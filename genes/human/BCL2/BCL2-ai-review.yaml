id: P10415
gene_symbol: BCL2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: BCL2 is a membrane-associated regulator of cell survival. Its BH3-binding groove
  recognizes proapoptotic ligands and BAX, restraining mitochondrial outer membrane permeabilization,
  cytochrome-c release and downstream caspase activation. BCL2 occurs at mitochondrial, endoplasmic-reticulum
  and nuclear-envelope membranes, with additional context-dependent pools. At the endoplasmic
  reticulum it inhibits IP3-receptor calcium release and binds BECN1 to limit autophagy; mitochondrial
  BCL2 can also inhibit AMBRA1-dependent autophagy. Cleavage or binding of Nur77 can expose
  a proapoptotic BCL2 state. Purified BCL2 has channel-forming capacity in reconstituted membranes,
  while its physiological use remains unresolved.
existing_annotations:
- term:
    id: GO:0043065
    label: positive regulation of apoptotic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: BCL2 can promote apoptosis after cleavage or conformational conversion, while its
      predominant intact-protein role is anti-apoptotic.
    action: KEEP_AS_NON_CORE
    reason: 'The former categorical rejection overlooked conditional target activity. PMID:18835031
      demonstrates BCL2-dependent death and a biochemical mechanism: exposed BCL2 BH3 neutralizes
      BCLXL, thereby permitting Bax-dependent permeabilization. The converted protein is not merely
      an inactive substrate, nor does this experiment show direct Bax activation by converted
      BCL2. Caspase cleavage and Nur77 conversion are also reported in PMID:9395403 and PMID:14980220.
      PAINT places both positive and negative apoptosis regulation at PTN000135648 in PTHR11256;
      no target-specific loss is established. Retain the positive role as contextual. The focused
      OpenScientist report independently concurs on cleavage and Nur77-dependent conversion; its
      general Bax-like wording does not override the experimentally resolved BCLXL-neutralization
      mechanism. Physiological prevalence remains a follow-up question, not a reason to reject
      demonstrated capacity.'
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
      - source_id: PANTHER:PTN000135648
        source_label: PTN000135648
        source_status: SUPPORTS_TRANSFER
        comment: The actual IBD includes positive and negative regulation at the same ancestor.
          Conditional target proapoptotic work contradicts an antiapoptotic-only rejection.
    supported_by:
    - reference_id: PMID:18835031
      supporting_text: NuBCP-9-induced Bcl-2 conformational change not only neutralizes Bcl-2’s
        inhibition of Bax-mediated membrane permeabilization but also exposes the Bcl-2’s BH3
        motif neutralizing Bcl-XL’s inhibition of Bax
    - reference_id: file:human/BCL2/BCL2-hypotheses/conditional-proapoptotic-and-channel-capacities/openscientist.md
      supporting_text: The proapoptotic capacity is real but proteoform- and context-dependent.
