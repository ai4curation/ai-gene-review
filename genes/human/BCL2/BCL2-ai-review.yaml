- id: file:human/BCL2/BCL2-hypotheses/conditional-proapoptotic-and-channel-capacities/openscientist.md
  title: 'BCL2 conditional proapoptotic and channel capacities: focused OpenScientist report'
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: 'The complete report supports retaining conditional proapoptotic and intrinsic
      channel capacities, consistent with the independently checked primary texts. Its acidic-pH-only
      permeabilization summary must be restricted to the carboxyfluorescein assay in PMID:9219694:
      PMID:9144199 directly records neutral-pH ion channels. The report admits that it did not
      inspect actual PAINT nodes and reviewed no mouse functional primary assays. It does not
      resolve oligomeric pore-complex membership; no duplicate NEW annotations are adopted.'
core_functions:
- description: BCL2 recognizes BH3-containing ligands and restrains BAX-dependent mitochondrial
    permeabilization, maintaining the mitochondrial barrier to cytochrome-c release and caspase
    activation.
  molecular_function:
    id: GO:0051434
    label: BH3 domain binding
  directly_involved_in:
  - id: GO:0043066
    label: negative regulation of apoptotic process
  - id: GO:1901029
    label: negative regulation of mitochondrial outer membrane permeabilization involved in
      apoptotic signaling pathway
  locations:
  - id: GO:0005741
    label: mitochondrial outer membrane
  supported_by:
  - reference_id: PMID:9027314
    supporting_text: "Overexpression of Bcl-2 prevented the efflux of cytochrome c from the\
      \ \nmitochondria and the initiation of apoptosis."
- description: BCL2 inhibits membrane-permeabilizing activity of BAX at mitochondria and IP3-receptor
    channel opening at the endoplasmic reticulum, linking calcium regulation to cell survival.
  molecular_function:
    id: GO:0016248
    label: channel inhibitor activity
  directly_involved_in:
