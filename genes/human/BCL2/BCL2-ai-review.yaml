  review:
    summary: BCL2 inhibits autophagy through interactions with BECN1 and AMBRA1.
    action: ACCEPT
    reason: 'This is demonstrated inhibitory work within autophagy regulation, not a reason
      to reject the annotation as crosstalk. Full-text PMID:21358617 combines interaction/domain
