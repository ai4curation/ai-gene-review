    supporting_text: 'Disruption of the

      interaction between BPAG1n4 and dynactin results in severe defects in retrograde

      axonal transport.'
suggested_questions:
- question: How do sequence-defined endogenous human DST products partition hemidesmosomal, microtubule,
    muscle and neuronal transport functions, especially where historical neural names overlap current
    short product records?
- question: What molecular arrangement connects epithelial BP230 and integrin beta4 to Rac1/cofilin-dependent
    polarity without assigning intrinsic exchange-factor activity to DST?
- question: Which product accounts for the curated H-zone location and the sperm-nuclear proteomic detection,
    and do these pools have functions distinct from cytoskeletal attachment?
suggested_experiments:
- description: Use product-specific endogenous tags and sequence-resolved proteomics in human epithelial,
    muscle and neuronal models, coupled to rescue with authenticated full-length products, to separate
    natural-product function from historical fragment or alias assignments.
- description: Compare matched full-length and tail constructs under controlled calcium conditions for
    EB1 association, microtubule lattice/end binding and network behavior, measuring affinity separately
    from cellular localization.
- description: Test the neuronal dynactin-associated linker with selective interaction-site perturbations
    and cargo transport measurements while retaining dynein motor activity as a separate variable.
