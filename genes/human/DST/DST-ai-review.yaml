    supporting_text: 'Although its

      COOH terminus interacts with intermediate filaments, its NH(2) terminus is

      important for its recruitment into HDs.'
  - reference_id: PMID:10637308
  - reference_id: PMID:19403692
  - reference_id: PMID:19932097
- description: Microtubule-binding regions of long dystonin products associate with the microtubule lattice
    and with EB1 at growing ends. Experiments on the BPAG1n4 C-terminal tail demonstrate a calcium-sensitive
    switch between plus-end tracking and lattice association, dependent on its EF-hand and microtubule-binding
    regions. These binding properties support microtubule organization; fragment assays do not establish
    identical regulation in all natural products or a direct calcium-affinity value.
  molecular_function:
    id: GO:0008017
    label: microtubule binding
  directly_involved_in:
  - id: GO:0000226
    label: microtubule cytoskeleton organization
  locations:
