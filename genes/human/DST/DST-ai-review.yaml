    supporting_text: 'a rapid, calcium-regulated switch between MT plus end interaction and

      lattice binding within the carboxyl terminus of BPAG1n4.'
  - reference_id: PMID:19632184
  - reference_id: PMID:10428034
- description: By associating with dynactin p150, the long neuronal BPAG1n4 form helps organize vesicle-associated
    machinery for retrograde axonal transport. Human brain-derived cDNA underlies the interaction constructs,
    whereas endogenous localization and transport assays were performed in mice. This adaptor role is
    distinct from dynein motor catalysis. Exact sequence equivalence between the historical full-length
    construct and a current human product has not been established.
  molecular_function:
    id: GO:0008093
    label: cytoskeletal adaptor activity
  directly_involved_in:
  - id: GO:0008090
    label: retrograde axonal transport
  locations:
  - id: GO:1904115
    label: axon cytoplasm
  - id: GO:0031410
    label: cytoplasmic vesicle
  supported_by:
