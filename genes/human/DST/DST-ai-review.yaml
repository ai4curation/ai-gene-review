    label: hemidesmosome
  - id: GO:0009925
    label: basal plasma membrane
  - id: GO:0031252
    label: cell leading edge
  - id: GO:0030018
    label: Z disc
  - id: GO:0045111
    label: intermediate filament cytoskeleton
  supported_by:
