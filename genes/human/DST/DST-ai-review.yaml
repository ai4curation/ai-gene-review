core_functions:
- description: Dystonin provides product-specific structural links between filament networks and cellular
    attachment structures. Epithelial BP230 connects keratin intermediate filaments to hemidesmosomal
    integrin beta4 and collagen XVII contacts. In human keratinocytes, the epithelial product also supports
    actin organization, front–rear polarity and persistent migration through a beta4-associated Rac1/cofilin
    pathway whose complete molecular arrangement remains unresolved. Muscle BPAG1-b associates with Z-disc
    proteins and adjacent intermediate-filament structures.
  molecular_function:
    id: GO:0005200
    label: structural constituent of cytoskeleton
  directly_involved_in:
  - id: GO:0045104
    label: intermediate filament cytoskeleton organization
  - id: GO:0030036
    label: actin cytoskeleton organization
  - id: GO:0030011
    label: maintenance of cell polarity
  - id: GO:0051546
    label: keratinocyte migration
  locations:
