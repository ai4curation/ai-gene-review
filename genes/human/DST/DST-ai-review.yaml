id: Q03001
gene_symbol: DST
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Dystonin is a plakin-family cytolinker whose alternative products connect cytoskeletal networks
  with cellular attachment structures and intracellular transport machinery. Epithelial BP230 links keratin
  intermediate filaments to hemidesmosomal membrane proteins and supports keratinocyte polarity and directional
  migration. Larger muscle and neuronal forms contain different combinations of filament-binding domains.
  Their functions include structural coupling at muscle Z-discs, microtubule association and regulation,
  and dynactin-associated retrograde transport in neurons. Product-specific domain composition and localization
  give these forms distinct functional capacities.
