id: P47870
gene_symbol: GABRB2
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: GABRB2 encodes the beta2 subunit of GABA-A receptors, heteropentameric ligand-gated chloride channels
  in neuronal membranes. Beta2 contributes to GABA-binding interfaces and the shared channel pore, coupling GABA
  recognition to chloride conductance and changes in postsynaptic membrane potential. Receptor composition and the
  chloride gradient shape the response. Human beta2 occurs in recombinant and native brain receptor assemblies,
  while splice products differ in sequence and experimentally studied behavior. Pathogenic variants can disrupt
  receptor trafficking and signaling and cause developmental and epileptic encephalopathy. Beta2-containing receptor
  assemblies also support synaptic contacts in defined experimental systems and occur in synaptic and extrasynaptic
  contexts.
