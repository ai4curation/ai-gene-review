core_functions:
- description: Contributes GABA-binding interface and pore structure to assembled GABA-A receptors, coupling GABA
    recognition to chloride-channel opening and postsynaptic signaling. Human alpha1/beta2/gamma2 structural constructs
    and functional comparisons establish the mechanism, while native human assemblies independently establish beta2
    membership. The structural construct has engineered intracellular loops and is not assigned to a current natural
    splice accession; receptor composition and ionic conditions determine the response. Postsynaptic localization
    is nonexclusive; beta2-containing receptors can also occupy other plasma-membrane pools.
