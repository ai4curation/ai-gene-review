suggested_questions:
- question: Which current natural P47870 products occur in native human receptor assemblies, and how do their abundance
    and receptor partners differ across cell types?
- question: What sequence differences account for the 314/373-residue short constructs reported in 19763268 versus
    current 313/372-residue UniProt products, and can the actual historical clones be mapped without inference from
    names alone?
- question: Which original donor experiments distinguish beta2-dependent developmental progression from later cochlear/neural
    maintenance?
- question: What beta2-specific evidence establishes dendritic-spine and cytoplasmic-vesicle membrane localization,
    rather than beta2/3 cross-reactive or gamma2-complex signals?
- question: Which receptor compositions and cellular conditions give beta2 a negative-regulatory role in GABAergic
    transmission or a direct physiological histamine response?
suggested_experiments:
- description: Compare sequence-verified current natural products in matched receptor assemblies, separating surface
    delivery, GABA currents and synaptic localization from engineered tags, loop replacements and host-cell effects.
- description: Use beta2-specific or sequence-resolved labeling with compartment controls to distinguish dendritic-spine,
    postsynaptic and trafficking-vesicle pools.
