core_functions:
- description: Manganese efflux across the plasma membrane via a calcium-coupled antiport
    mechanism (Ca2+/Mn2+ antiporter), exporting cytosolic Mn2+ in exchange for Ca2+
    using the inward Ca2+ gradient as the driving force.
  molecular_function:
    id: GO:0140983
    label: calcium:manganese antiporter activity
  directly_involved_in:
