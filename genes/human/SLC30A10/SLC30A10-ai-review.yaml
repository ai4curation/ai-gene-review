id: Q6XR72
gene_symbol: SLC30A10
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SLC30A10 (ZnT10) is a polytopic membrane protein of the cation diffusion
  facilitator (CDF/SLC30) family that, despite its "zinc transporter 10" name, functions
  physiologically as a calcium/manganese antiporter mediating manganese (Mn2+) efflux.
  It extrudes cytosolic Mn2+ across the plasma membrane using the inward Ca2+ gradient
  as the driving force, exchanging exported Mn2+ for imported Ca2+. It is expressed
  most highly in liver, small intestine and brain, where it protects cells against
  manganese toxicity by lowering intracellular Mn2+ and promoting biliary/systemic
  Mn excretion. The protein localizes mainly to the plasma membrane, with pools in
  the Golgi apparatus and early/recycling endosomes, and traffics between these compartments;
  it assembles as a homodimer (the functional antiporter unit) and can also form covalent
  heterodimers with other ZnT family members (SLC30A2/3/4). Autosomal-recessive loss-of-function
  mutations cause hypermanganesemia with dystonia 1 (HMNDYT1), a syndrome of manganese
  accumulation in liver and basal ganglia presenting with dystonia/parkinsonism, polycythemia
  and hepatic cirrhosis. In vitro and overexpression studies also report a secondary,
  context-dependent zinc-transport capacity (particularly for ZnT-family heterodimers),
  but the native homodimeric transporter is manganese-selective.
