proposed_new_terms: []
suggested_questions:
- question: Under what physiological conditions, if any, does human ZnT10 transport
    zinc in vivo, and does covalent heterodimerization with ZnT2/ZnT3/ZnT4 switch its
    metal selectivity toward zinc?
- question: Is the Ca2+/Mn2+ antiport the sole native transport mode, or does ZnT10
    also function as a facilitated Mn2+ efflux pathway independent of Ca2+ in some
    cell types?
suggested_experiments:
- description: Reconstitute purified human ZnT10 homodimer into proteoliposomes and
    directly measure Mn2+, Ca2+ and Zn2+ fluxes to define native metal selectivity
    and stoichiometry of the Ca2+-coupled exchange.
- description: Use the cryo-EM structures (PDB 9KVX/9KVY/9KVZ) to test how metal-coordination
    residues (Asn43, Asp47, Asp248, His244) and the His->Asn divergence determine Mn
    vs Zn selectivity, via structure-guided mutagenesis and transport assays.
- description: Determine whether endogenous ZnT10 forms heterodimers with other ZnTs
    in physiologically relevant cells (hepatocytes, enterocytes, neurons) and whether
    such heterodimers alter metal selectivity or subcellular targeting.
knowledge_gaps:
- gap_statement: Whether human ZnT10 has a genuine, physiologically relevant zinc-transport
    function in any native context, or whether reported zinc activity is an artifact
    of overexpression and heterodimerization, is undetermined and requires direct biochemical
    measurement of the native transporter.
  boundary: It is firmly established that the native homodimeric transporter is a Ca2+-coupled
    Mn2+ efflux antiporter and that loss of function causes hypermanganesemia; residual
    zinc transport has been seen only in overexpression/heterodimer settings.
  gap_kind:
  - BIOLOGY
