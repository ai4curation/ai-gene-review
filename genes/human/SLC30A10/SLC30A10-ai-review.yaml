    supporting_text: ZnT10 is exploiting the transmembrane Ca2+ inward gradient for
      active cellular exchange of Mn2+
  - reference_id: PMID:25319704
    supporting_text: SLC30A10 is a cell surface-localized Mn efflux transporter that
      reduces cellular Mn levels and protects against Mn-induced toxicity
- description: Maintenance of intracellular (and systemic) manganese homeostasis by
    lowering cytosolic Mn2+ levels, protecting against manganese toxicity; loss of
    function causes hypermanganesemia with dystonia/parkinsonism and liver cirrhosis.
  molecular_function:
