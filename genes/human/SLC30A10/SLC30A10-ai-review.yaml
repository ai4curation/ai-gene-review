  review:
    summary: Phylogenetic (IBD) transfer of zinc transporter activity from the zinc-transporting
      SLC30/CDF clade. ZnT10 is the functionally divergent, manganese-selective member
      of this family.
    action: MARK_AS_OVER_ANNOTATED
    reason: The ancestral CDF/SLC30 node transports zinc, and the IBD places zinc transport
      broadly across the clade. However, human ZnT10 has diverged to become a manganese-selective
      Ca2+/Mn2+ antiporter (the active-site His that coordinates zinc in other ZnTs
      is replaced by Asn43). A direct assay of the native transporter found no zinc
      transport (PMID:30755481, the GO:0005385 NOT annotation), and the His->Asn reversion
      experiment shows zinc transport must be engineered back in. The zinc term is
      therefore an over-annotation for this member relative to its evolved manganese
      specificity.
    supported_by:
    - reference_id: PMID:27226609
      supporting_text: residue Asn(43), which corresponds to the His residue constituting
        the potential intramembranous zinc coordination site in other ZnT transporters,
        is necessary to impart hZnT10's unique manganese mobilization activity
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN000901728
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Ancestral SLC30/CDF node is zinc-transporting; ZnT10 diverged to manganese
          selectivity, so the zinc term is mis-scoped onto this member.
