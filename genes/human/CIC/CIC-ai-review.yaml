id: Q96RK0
gene_symbol: CIC
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CIC encodes capicua, a nuclear sequence-specific transcriptional repressor that links RTK/Ras–MAPK
  signaling to gene expression. Its HMG-box and C1 domains jointly recognize TGAATGAA-like octamers
  in regulatory DNA, including ETV-family promoters. RTK activation can downregulate CIC and
  release its target genes from repression. CIC associates with ATXN1 and ATXN1L in repressive
  complexes and controls developmental gene-expression programs. CIC also functions as a tumor
  suppressor; somatic mutations, including missense changes in its DNA-recognition domains, recur
  in oligodendroglioma. In contrast, oncogenic CIC–DUX4 fusions activate CIC target genes in a
  subset of sarcomas. Loss of CIC disrupts neural maturation and behavior, and human heterozygous
  loss-of-function variants cause neurodevelopmental disease. Short and long CIC products share the
  DNA-recognition domains but differ in their N-terminal regions.
