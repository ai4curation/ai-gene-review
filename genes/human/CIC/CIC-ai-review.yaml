      species. The reporter demonstrates performed co-repressor work.
- id: PMID:22014525
  title: ATXN1 protein family and CIC regulate extracellular matrix remodeling and lung alveolarization.
  findings:
  - statement: Mouse Cic occupies Pea3-group promoters in lung, while loss of ATXN1-family partners reduces
      Cic and derepresses target genes.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Genuine normal full selected Results and experimental context read. These are mouse
      lung/embryonic experiments, not a human pulmonary assay. They corroborate the exact mouse chromatin/transcription
      donor chain without adding a lung process annotation.
core_functions:
- description: CIC recognizes regulatory DNA through its HMG-box and C1 domains and represses RNA polymerase
    II transcription. Human GFP-tagged CIC-S links promoter occupancy to reduced reporter expression;
    human HMG–C1 fragments independently establish direct motif recognition. The human construct accession
    NP_055940.3 maps to Q96RK0-2. Engineered min18/min31 structures do not establish equivalent regulation
    or affinity of both complete products.
  molecular_function:
    id: GO:0001227
    label: DNA-binding transcription repressor activity, RNA polymerase II-specific
  locations:
  - id: GO:0005654
    label: nucleoplasm
  in_complex:
    id: GO:0017053
    label: transcription repressor complex
  directly_involved_in:
  - id: GO:0000122
    label: negative regulation of transcription by RNA polymerase II
  supported_by:
  - reference_id: PMID:28278156
    supporting_text: significantly repressed upon cotransfection of GFP-CIC (WT)
  - reference_id: PMID:40967212
  - reference_id: PMID:20628574
suggested_questions:
- question: How do the distinct N-terminal regions of full-length CIC-L and CIC-S alter cofactor recruitment
    and repression at endogenous targets?
- question: Why do engineered CIC HMG–C1 variants show different binding behavior across EMSA, MST and
    linker lengths, and which measurements predict repression by complete CIC proteins?
- question: Do the screened CENPJ and GOLGA2 interactions occur for endogenous CIC in a defined physiological
    context, and what molecular consequence follows?
suggested_experiments:
- description: Compare sequence-verified full-length Q96RK0-1 and Q96RK0-2 at matched expression in human
    cells using target occupancy, reporter repression and endogenous transcript measurements. Include
    intact versus disrupted CIC sites and ATXN1/ATXN1L perturbations.
- description: Test endogenous CIC–CENPJ and CIC–GOLGA2 interactions with reciprocal, compartment-resolved
    assays and knockout controls, separating proximity from stable association before assigning a cellular
    mechanism.
