- id: PMID:20628574
  title: Partial loss of ataxin-1 function contributes to transcriptional dysregulation in spinocerebellar
    ataxia type 1 pathogenesis.
  findings:
  - statement: Mouse Cic occupies Ccnd1 and Etv5 promoters, and ATXN1 or ATXN1L enhances a CIC-site luciferase
      reporter in cellular assays.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Genuine normal full selected Results, Figure 2/3 legends and reporter/ChIP Methods read.
