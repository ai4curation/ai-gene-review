- id: PMID:28278156
  title: A new mode of DNA binding distinguishes Capicua from other HMG-box factors and explains its mutation
    patterns in cancer.
  findings:
  - statement: Human CIC requires its HMG-box and C1 domains for sequence-specific binding, ETV-promoter
      occupancy and reporter repression.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Genuine normal full Results and Methods read. GFP-tagged human NP_055940.3 maps to Q96RK0-2;
      isolated HMG–C1 EMSA constructs and Drosophila experiments have separate scope. CIC-DUX4 activation
      is not normal CIC repression.
- id: PMID:40967212
  title: Molecular basis of DNA recognition by the HMG-box-C1 module of capicua.
  findings:
  - statement: An engineered human HMG–C1 module reveals the joint DNA-recognition geometry; binding and
      variant effects depend on construct and assay.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Genuine normal full selected Results and Methods read. min18/min31 omit most of the
      complete protein. R201W can increase fragment binding, and R215W differs between EMSA and MST, so
      a blanket mutation-induced loss-of-binding claim is unsupported.
- id: PMID:17190598
  title: ATAXIN-1 interacts with the repressor Capicua in its native complex to cause SCA1 neuropathology.
  findings:
  - statement: ATXN1 binds CIC, influences its repressor activity and forms large native complexes in
      mouse cerebellum.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
