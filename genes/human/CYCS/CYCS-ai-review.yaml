id: P99999
gene_symbol: CYCS
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  CYCS encodes human cytochrome c, a small (105 aa, ~12 kDa) soluble heme-containing
  electron carrier protein of the mitochondrial intermembrane space. Cytochrome c
  has two
  well-established, evolutionarily conserved functions: (1) In the mitochondrial electron
  transport chain, it shuttles single electrons from Complex III (cytochrome bc1,
  via its
  cytochrome c1 subunit) to Complex IV (cytochrome c oxidase), accepting electrons
  via its
  covalently bound heme c group. (2) In apoptosis, upon mitochondrial outer membrane
  permeabilization (MOMP) triggered by pro-apoptotic Bcl-2 family members (BAX/BAK),
  cytochrome c is released into the cytosol where it binds Apaf-1 to form the apoptosome,
  activating caspase-9 and triggering the downstream caspase cascade. The heme c prosthetic
  group is covalently attached via thioether bonds to Cys14 and Cys17 (mature numbering
  Cys15 and Cys18 in UniProt), with His18 and Met80 as axial ligands to the iron atom.
  Gain-of-function mutations in CYCS (e.g., G42S) cause thrombocytopenia type 4 (THC4)
  by
  enhancing apoptotic activation in the megakaryocyte/platelet lineage. Cytochrome
  c is
  one of the most extensively studied proteins in biochemistry and a classic example
  of a
  dual-function (moonlighting) protein.
