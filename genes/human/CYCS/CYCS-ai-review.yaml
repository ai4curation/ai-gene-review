    qualifier: located_in
  - term:
      id: GO:0020037
      label: heme binding
    evidence_type: TAS
    original_reference_id: PMID:9515723
    review:
      summary: >-
        TAS annotation for heme binding from Skulachev 1998 (PMID:9515723), a review
        on cytochrome c
        in apoptotic and antioxidant cascades. The heme c group is covalently bound
        to Cys15 and
        Cys18 via thioether bonds, with His18 and Met80 as axial iron ligands. This
