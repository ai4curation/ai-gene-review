# ============================================================
# NUCLEUS ANNOTATION (LIFEdb)
# ============================================================
    qualifier: located_in
  - term:
      id: GO:0005634
      label: nucleus
    evidence_type: IDA
    original_reference_id: GO_REF:0000054
    review:
      summary: >-
        IDA annotation from LIFEdb, based on curation of intracellular localizations
        of expressed
        fusion proteins in living cells. LIFEdb generates GFP-fusion proteins and
        observes
        their
        localization. Nuclear localization of a CYCS-GFP fusion is likely an artifact
        of the
        overexpression/fusion system. Cytochrome c is a small protein (12 kDa) that
        could
        diffuse through nuclear pores, especially when overexpressed as a GFP fusion.
        There is no
        established functional role for cytochrome c in the nucleus.
      action: MARK_AS_OVER_ANNOTATED
      reason: >-
        LIFEdb GFP-fusion protein localization. Small proteins like cytochrome c (12
        kDa) can
        passively diffuse through nuclear pores when overexpressed as fusion constructs.
        This is
        likely an artifact and does not represent a functional nuclear localization.
        The canonical
        localization of cytochrome c is the mitochondrial IMS.

