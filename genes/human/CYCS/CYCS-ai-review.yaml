        heme attachment is essential for its electron carrier function. Well supported
        by structural
        and biochemical evidence.
      supported_by:
        - reference_id: PMID:9515723
          supporting_text: >-
            cytochrome c is a pro-apoptotic factor. It is released from its places
            on
            the outer
            surface of the inner mitochondrial membrane

