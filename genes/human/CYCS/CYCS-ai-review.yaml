# LOCALIZATION ANNOTATIONS - NUCLEUS
# ============================================================
    qualifier: located_in
  - term:
      id: GO:0005634
      label: nucleus
    evidence_type: HDA
    original_reference_id: PMID:21630459
    review:
      summary: >-
        HDA annotation for nuclear localization from de Mateo et al. 2011 (PMID:21630459),
        a
        proteomic characterization of the human sperm nucleus. Cytochrome c was identified
        among
        403 proteins in isolated sperm nuclei. This is a high-throughput mass spectrometry
        detection
        and may represent contamination or a sperm-specific localization artifact.
        Sperm
        nuclei
        are extremely compact structures and the biological significance of cytochrome
        c in the
        nucleus is unclear and unlikely to represent a functional localization.
      action: MARK_AS_OVER_ANNOTATED
      reason: >-
        Cytochrome c is a mitochondrial IMS protein. Its detection in sperm nuclei
        by
        mass
        spectrometry is likely due to contamination from the midpiece mitochondrial
        sheath, which
        is extremely close to the sperm nucleus. There is no established functional
        role for
        cytochrome c in the nucleus. This does not represent a meaningful localization.
      supported_by:
