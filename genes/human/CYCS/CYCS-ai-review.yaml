        label: mitochondrial intermembrane space
    supported_by:
      - reference_id: Reactome:R-HSA-164651
        supporting_text: Complex III transfers electrons from ubiquinol to cytochrome c
      - reference_id: Reactome:R-HSA-163214
        supporting_text: Electron transfer from reduced cytochrome c to molecular oxygen
      - reference_id: PMID:25595453
        supporting_text: Respiratory complexes III and IV can each bind two molecules of cytochrome c at low ionic strength
  - description: After mitochondrial outer-membrane permeabilization, released cytochrome c binds APAF1 in the cytosol and contributes to assembly of the apoptosome that recruits and activates procaspase-9 in the intrinsic apoptotic signaling pathway.
    contributes_to_molecular_function:
      id: GO:0008656
      label: cysteine-type endopeptidase activator activity involved in apoptotic process
