  - id: PMID:8689682
    title: 'Induction of apoptotic program in cell-free extracts: requirement for dATP and cytochrome c.'
    findings:
      - statement: >-
          Landmark paper identifying cytochrome c as a required factor for the apoptotic
          program.
          Cell-free system showed that cytochrome c is released from mitochondria
          during
          apoptosis
          and its addition to cytosol activates the apoptotic cascade.
        supporting_text: >-
          A cell-free system based on cytosols of normally growing cells is established
          that reproduces aspects of the apoptotic program in vitro
  - id: PMID:9267021
    title: Apaf-1, a human protein homologous to C. elegans CED-4, participates in cytochrome c-dependent activation of caspase-3.
    findings:
      - statement: >-
          Identification and cloning of Apaf-1 as the cytochrome c-binding protein
          that
          mediates
          caspase activation. Cytochrome c binds to Apaf-1 to trigger caspase-3 activation.
        supporting_text: >-
          Cytochrome c binds to Apaf-1, an event that may trigger the activation of
          caspase-3,
          leading to apoptosis
  - id: PMID:9515723
    title: Cytochrome c in the apoptotic and antioxidant cascades.
    findings:
      - statement: >-
          Review describing the dual role of cytochrome c as a pro-apoptotic factor
          (released
          from
          mitochondria to activate caspases via Apaf-1) and as an antioxidant (oxidizing
          superoxide
          back to O2 in the IMS).
        supporting_text: >-
          cytochrome c is a pro-apoptotic factor. It is released from its places on
          the
          outer
          surface of the inner mitochondrial membrane at early steps of apoptosis
          and,
          combining
          with some cytosolic proteins, activates conversion of the latent apoptosis-promoting
          protease pro-caspase-9 to its active form
  - id: PMID:10206961
    title: An APAF-1.cytochrome c multimeric complex is a functional apoptosome that activates procaspase-9.
    findings:
      - statement: >-
          Reconstitution of the apoptosome using purified cytochrome c, recombinant
          APAF-1,
          and
          recombinant procaspase-9. Cytochrome c and ATP/dATP hydrolysis promote APAF-1
          oligomerization to form the apoptosome, which recruits and activates procaspase-9.
        supporting_text: >-
          the binding of cytochrome c promote APAF-1 oligomerization, forming a large
          multimeric
          APAF-1.cytochrome c complex. Such a complex can be isolated using gel filtration
          chromatography and is by itself sufficient to recruit and activate procaspase-9
  - id: PMID:10383829
    title: A soluble version of the receptor-like protein tyrosine phosphatase kappa stimulates neurite outgrowth via a Grb2/MEK1-dependent signaling cascade.
    findings:
      - statement: >-
          This publication is about RPTPkappa stimulating neurite outgrowth and has
          no
          apparent
          connection to cytochrome c or cellular respiration. The reference appears
          to
          be
          incorrectly linked to the CYCS cellular respiration annotation.
        supporting_text: >-
          Receptor-like protein tyrosine phosphatase kappa (RPTPkappa) is expressed
          in
          the
          nervous system in a manner consistent with a role in axonal growth and guidance
    reference_review:
      relevance: NONE
      correctness: WRONG_IDENTIFIER
      review_notes: PMID:10383829 resolves to an RPTP-kappa neurite-outgrowth paper and does not support a CYCS cellular-respiration annotation.
  - id: PMID:12107093
    title: Microinjection of cathepsin d induces caspase-dependent apoptosis in fibroblasts.
    findings:
      - statement: >-
          Cathepsin D microinjection into cytosol induces apoptosis with cytochrome
          c
          redistribution
          and caspase activation. Cytochrome c release from mitochondria was observed
          as part of the
          apoptotic cascade. Used as ISS reference for mouse-to-human apoptotic signaling
          transfer.
        supporting_text: >-
          microinjection of cathepsin D into the cytosol of human fibroblasts caused
          apoptosis,
          which was detected as changes in distribution of cytochrome c, cell shrinkage,
          activation
          of caspases
  - id: PMID:19393246
    title: Knockdown of human COX17 affects assembly and supramolecular organization of cytochrome c oxidase.
    findings:
      - statement: >-
          COX17 knockdown affects cytochrome c oxidase assembly and supercomplex organization.
          Study involved cytochrome c in the context of respiratory chain supercomplex
          function
          in the mitochondrial IMS.
        supporting_text: >-
          Assembly of cytochrome c oxidase, the terminal enzyme of the mitochondrial
          respiratory chain, requires a concerted activity of a number of chaperones
          and
          factors for the insertion of subunits, accessory proteins, cofactors and
          prosthetic groups
  - id: PMID:20671748
    title: Bcl-2 family interaction with the mitochondrial morphogenesis machinery.
    findings:
      - statement: >-
          Study on Bax/Bak-dependent mitochondrial dynamics and Bcl-2 family regulation
          of
          mitochondrial morphology. Cytochrome c release is context for apoptosis
          studies.
        supporting_text: >-
          The regulation of both mitochondrial dynamics and apoptosis is key for
          maintaining the health of a cell
  - id: PMID:20833797
    title: Phosphoproteome analysis of functional mitochondria isolated from resting human muscle reveals extensive phosphorylation of inner membrane protein complexes and enzymes.
    findings: []
  - id: PMID:21630459
    title: Proteomic characterization of the human sperm nucleus.
    findings:
      - statement: >-
          Mass spectrometry identification of 403 proteins in isolated sperm nuclei.
          Cytochrome
          c
          detection likely represents contamination from the adjacent mitochondrial
          midpiece
          sheath.
        supporting_text: >-
          sperm nuclei were obtained through CTAB treatment and isolated to over 99.9%
          purity
          without any tail fragments, acrosome or mitochondria as assessed by optical
          microscopy
          and transmission electron microscopy
  - id: PMID:25416956
    title: A proteome-scale map of the human interactome network.
    findings: []
  - id: PMID:25595453
    title: Respiratory complexes III and IV can each bind two molecules of cytochrome c at low ionic strength.
    findings:
      - statement: >-
          Human cytochrome c interacts with respiratory complexes III and IV with
          2:1
          stoichiometry
          at low ionic strength. Extra binding sites facilitate turnover and sliding
          of
          cytochrome c
          within respiratory supercomplexes.
        supporting_text: >-
          two cytochrome c molecules per adduct - at low ionic strength. We conclude
          that
          such extra
          binding sites at the surfaces of complexes III and IV can facilitate the
          turnover
          and
          sliding of cytochrome c molecules
