core_functions:
  - description: Cytochrome c is the soluble heme c electron carrier in the mitochondrial intermembrane space, accepting electrons from Complex III after ubiquinol oxidation and donating them to Complex IV for reduction of molecular oxygen.
    molecular_function:
      id: GO:0009055
      label: electron transfer activity
    directly_involved_in:
