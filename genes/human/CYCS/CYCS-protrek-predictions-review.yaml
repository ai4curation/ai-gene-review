- source_method: ProTrek
  source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
  source_reference_id: PMID:41039041
  predicted_term:
    id: GO:1903606
    label: cytochrome c metabolic process
  predicted_term_type: GO_BP
  review:
    assessment: NPI
    confidence_score: 0
    error_type: FREQUENCY_BIAS
    summary: >-
      Rank 5 (score 14.20), reviewed in place of ranks 3 and 4, which are both obsolete variants of
      the rank-1 caspase-activation claim. Cytochrome c metabolic process refers to the synthesis,
      maturation and turnover of cytochrome c - the work of holocytochrome c synthase and the heme-attachment
      machinery - not to what cytochrome c itself does. Confusing a molecule's metabolism with its
      activity is the same error as the penicillin metabolic process calls for the two PBPs. The absence
      of electron transfer activity from the entire top five, for the textbook electron carrier, is
      the more consequential miss.
    supported_by:
    - reference_id: file:human/CYCS/CYCS-uniprot.txt
      supporting_text: >-
        Belongs to the cytochrome c family
