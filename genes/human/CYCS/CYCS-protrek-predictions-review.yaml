id: P99999
gene_symbol: CYCS
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens (Human)
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for human cytochrome c. The model commits entirely to the apoptotic
  arm - apoptosome formation and caspase activation - and returns nothing about electron transfer
  between Complex III and Complex IV, which is this review's first core function and the protein's
  ancestral role. Three of the top five calls are obsolete GO terms, the highest rate of any gene
  in either cohort. The free-text channel, by contrast, returns the electron-carrier description first
  and the apoptotic role second, in the right order. Assessment: 1 correct novel (COR), 1 uncertain
  (UNC), 1 nonparalog incorrect (NPI).
source_documents:
- projects/PROTREK_EVALUATION/argo139_protrek_hits.tsv
- genes/human/CYCS/CYCS-uniprot.txt
- genes/human/CYCS/CYCS-goa.tsv
