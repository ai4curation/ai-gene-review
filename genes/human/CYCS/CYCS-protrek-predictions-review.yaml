    label: apoptosome
  predicted_term_type: GO_CC
  review:
    assessment: COR
    confidence_score: 2
    summary: >-
      Rank 2 (score 17.15) and absent from GOA. The apoptosome is the APAF1-cytochrome c-caspase-9
      holoenzyme this review names as the complex for cytochrome c's apoptotic function. Correct,
      specific and novel - the one usable call in the list.
    supported_by:
    - reference_id: file:human/CYCS/CYCS-uniprot.txt
