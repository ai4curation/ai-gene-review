  source_reference_id: PMID:41039041
  predicted_term:
    id: GO:0008635
    label: activation of cysteine-type endopeptidase activity involved in apoptotic process by cytochrome
      c
  predicted_term_type: GO_BP
  review:
    assessment: UNC
    confidence_score: 1
    summary: >-
      Top-ranked hit (score 17.25). Biologically this is exactly right - cytosolic cytochrome c binds
      APAF1 to activate caspase-9, which is this review's second core function - but the term is obsolete
      in the current GO release, as are ranks 3 and 4, so it cannot be entered as an annotation. Recorded
      as uncertain on ontology-drift grounds rather than scored as correct, since the whole point
      of a prediction is that a curator can use it.
    supported_by:
