id: Q9Y2N7
gene_symbol: HIF3A
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  HIF3A encodes hypoxia-inducible factor 3 alpha, an oxygen-regulated bHLH-PAS
  transcription factor alpha subunit with extensive alternative splicing. Long
  isoforms such as HIF-3alpha2 can form ARNT/HIF-beta-containing nuclear
  complexes, bind hypoxia-response elements in chromatin, and activate a subset
  of hypoxia-responsive RNA polymerase II target genes. Short isoforms, including
  HIF-3alpha4/IPAS-like products, attenuate HIF1A- and EPAS1-driven hypoxic
  transcription, giving the locus both transcription-activating and dominant
  negative regulatory outputs.
