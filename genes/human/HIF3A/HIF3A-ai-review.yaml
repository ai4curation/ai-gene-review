core_functions:
- description: >-
    Long HIF3A isoforms, exemplified by HIF-3alpha2, dimerize with ARNT/HIF-beta
    to form nuclear RNA polymerase II transcription-regulator complexes that bind
    HRE-containing regulatory chromatin and activate a restricted subset of
    hypoxia-responsive genes such as EPO.
  molecular_function:
    id: GO:0000981
    label: DNA-binding transcription factor activity, RNA polymerase II-specific
  directly_involved_in:
  - id: GO:0045944
    label: positive regulation of transcription by RNA polymerase II
  locations:
  - id: GO:0000785
    label: chromatin
  in_complex:
    id: GO:0090575
    label: RNA polymerase II transcription regulator complex
  supported_by:
  - *hif3a2_chromatin
  - *hif3a2_luciferase
- description: >-
    Inhibitory HIF3A isoforms suppress hypoxia-inducible HIF transcription by
    dimerizing with HIF1A, EPAS1 or ARNT and limiting productive HRE binding and
    HIF-mediated RNA polymerase II target-gene activation.
  molecular_function:
    id: GO:0046982
    label: protein heterodimerization activity
  directly_involved_in:
  - id: GO:0000122
    label: negative regulation of transcription by RNA polymerase II
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - *hif3a_inhibits_hif
  - reference_id: PMID:16126907
    supporting_text: >-
      attenuates the ability of HIF-1 to bind hypoxia-responsive elements located
      within the enhancer/promoter of HIF target genes
proposed_new_terms: []
suggested_questions:
- question: >-
    Which HIF3A isoforms are translated at physiologically important levels in
    human hypoxic tissues, and should future curation split HIF3A output by
    activating long isoforms versus inhibitory HIF-3alpha4/IPAS-like isoforms?
- question: >-
    Does human HIF3A have direct mitochondrial or nuclear-speck localization
    evidence, or should the current similarity-based locations remain non-core
    until human isoform-specific imaging is available?
suggested_experiments:
- hypothesis: >-
    Endogenous long HIF3A isoforms occupy a restricted, HRE-containing subset of
    hypoxia-responsive Pol II enhancers and promoters.
  description: >-
    Use isoform-resolving HIF3A antibodies or epitope-edited endogenous HIF3A
    isoforms for ChIP-seq or CUT&RUN under normoxia, hypoxia, and reoxygenation,
    paired with isoform-specific perturbation and RNA-seq to distinguish direct
    activating targets from indirect or dominant-negative effects.
  experiment_type: endogenous isoform ChIP/CUT&RUN and RNA-seq
- hypothesis: >-
    Similarity-based mitochondrion and nuclear-speck assignments reflect
    isoform-specific minor pools rather than the main human HIF3A transcriptional
    activity.
  description: >-
    Express or endogenously tag the major human HIF3A isoforms individually and
    assay co-localization with mitochondria, nuclear speckles, and HRE-bound
    chromatin under normoxia, hypoxia, and apoptosis-inducing conditions.
  experiment_type: isoform-resolved subcellular localization assay
