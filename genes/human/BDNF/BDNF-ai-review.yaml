id: P23560
gene_symbol: BDNF
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'BDNF encodes brain-derived neurotrophic factor, a secreted neurotrophin processed from proBDNF
  to a mature homodimeric ligand. Mature BDNF activates NTRK2/TrkB signaling to promote neuronal survival,
  axon and dendrite remodeling and synaptic plasticity, whereas proBDNF can engage NGFR with SORCS2 or
  sortilin-family receptors to produce distinct responses.'
