  review:
    summary: IBA placing L-glutamate transmembrane transporter activity at the SLC1-family node
      (PTN000238242), seeded largely by the glutamate-transporting EAAT members (P43003-P43005,
      P48664). ASCT2 does transport glutamate, but only as a minor, pH-dependent (proton-coupled)
      antiport with glutamine, not the concentrative symport performed by the EAATs.
    action: KEEP_AS_NON_CORE
    reason: The glutamate-handling claim is genuinely true of ASCT2 but is a conditional secondary
      activity (acidic-pH, proton-coupled glutamate/glutamine exchange), not its core neutral-amino-acid
      exchange function. Kept as non-core rather than removed because the capability is experimentally
      documented; the family-level IBA sits at the right node but at the EAAT level of specificity.
    supported_by:
