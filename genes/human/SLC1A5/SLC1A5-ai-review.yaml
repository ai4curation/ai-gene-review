id: Q15758
gene_symbol: SLC1A5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SLC1A5 (ASCT2, ATB0) is a plasma-membrane, sodium-coupled obligate antiporter
  (exchanger) of small neutral amino acids and a member of the SLC1 / dicarboxylate-amino
  acid cation-symporter (DAACS) family. Its preferred substrate is L-glutamine, which it
  exchanges bidirectionally with other neutral amino acids (L-serine, L-threonine, L-asparagine,
  L-alanine, L-valine, L-methionine) at a 1:1 stoichiometry coupled to inward Na+ cotransport;
  it also transports D-serine and, under acidic extracellular pH, carries a minor proton-coupled
  glutamate/glutamine antiport. Unlike the glutamate-transporting EAATs (SLC1A1-3) of the same
  family, which concentratively symport glutamate, ASCT2 operates as an obligate 1:1 exchanger
  that equilibrates rather than concentrates its substrates. The protein assembles as a
  homotrimer, each protomer using an elevator-type transport domain (TMs 3, 6, 7, 8 plus hairpins
  HP1 and HP2) gated by HP2. ASCT2 is the principal glutamine importer of many proliferating and
  tumour cells, supplying glutamine for anaplerosis, nucleotide biosynthesis and, via downstream
  SLC7A5/SLC3A2 leucine exchange, mTORC1 signalling. In polarized epithelia it localizes to the
  apical (brush-border) membrane of proximal tubule and intestine. An extracellular beta-hairpin
  on the scaffold domain makes ASCT2 the cell-surface receptor for the RD114/type D retrovirus
  interference group and the docking receptor for the fusogenic endogenous-retroviral envelope
  syncytin-1 (ERVW-1), an interaction modulated by secreted suppressyn (ERVH48-1).
