- term:
    id: GO:0009925
    label: basal plasma membrane
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: located_in
  supporting_entities:
  - UniProtKB:P51912
  review:
    summary: ISS transfer from an ortholog (P51912) asserting a basal plasma-membrane location. This
      contradicts the documented apical (brush-border) restriction of ASCT2 in polarized epithelia.
    action: MARK_AS_OVER_ANNOTATED
    reason: ASCT2 is reported as restricted to the apical cell membrane of proximal tubule epithelial
      cells; a basal plasma-membrane location is not supported for the human protein and conflicts with
      the apical annotation. Treated as an over-annotation rather than removed outright because polarized
      distribution can vary by tissue and the underlying ortholog evidence was not re-examined here.
    supported_by:
    - reference_id: file:human/SLC1A5/SLC1A5-uniprot.txt
      record_section: ["CC:SUBCELLULAR LOCATION"]
      supporting_text: Restricted to the apical cell membrane of proximal tubule epithelial cells.
- term:
    id: GO:0010585
    label: L-glutamine secretion
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:D3ZJ25
  - ensembl:ENSRNOP00000060053
  review:
    summary: Electronic transfer from the rat ortholog for L-glutamine secretion (efflux). As an obligate
      exchanger ASCT2 can move glutamine in either direction, so glutamine efflux occurs, but framing it
      as regulated secretion overstates a non-core aspect of bidirectional exchange.
    action: KEEP_AS_NON_CORE
    reason: Bidirectional glutamine movement is part of the exchange mechanism, so glutamine efflux is
      real; however it is peripheral to the physiological import role and the secretion framing is
      ortholog-derived and context-specific.
    supported_by:
    - reference_id: file:human/SLC1A5/SLC1A5-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Exchanges L-glutamine with other neutral amino acids such as L-serine, L-threonine
        and L-asparagine in a bidirectional way.
