suggested_questions:
- question: Does ASCT2 have a physiologically significant role in transcellular transport across the
    blood-brain barrier, or is its BBB annotation an extrapolation from endothelial expression?
- question: Under what cellular conditions (e.g. acidic microenvironment of tumours or glia) does the
    minor pH-dependent glutamate/glutamine antiport of ASCT2 become quantitatively relevant to glutamate
    homeostasis?
suggested_experiments:
- description: Side-specific flux assays in reconstituted proteoliposomes and polarized epithelial
    monolayers to quantify the contribution of ASCT2-mediated glutamine efflux versus influx under
    physiological amino-acid gradients, clarifying the L-glutamine secretion annotation.
- description: Structure-guided mutagenesis of the HP2 gate and substrate-binding residues to separate
    neutral-amino-acid exchange from the uncoupled anion conductance, testing whether the channel-like
    activity is physiologically relevant.
- description: Cell-type-specific knockout/rescue of ASCT2 in brain endothelial cells with labelled
    glutamine to test directly whether ASCT2 mediates transport across the blood-brain barrier.
