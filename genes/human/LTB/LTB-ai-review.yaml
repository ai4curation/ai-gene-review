        \      subfamilies, including osteoclastogenic developmental ligands such\
        \ as\n      TNFSF11/RANKL (SF3, O14788), which bind the TRAF6-coupled receptor\
        \ RANK\n      lacking a death domain to promote osteoclast differentiation\
        \ and survival"
