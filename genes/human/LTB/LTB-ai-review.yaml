  review:
    summary: Remove root-level extrinsic-apoptosis propagation.
    action: REMOVE
    reason: The PANTHER root apoptosis assertion over-propagates death-domain signaling
      to LTB; this ligand's core receptor system is TRAF-coupled and not an extrinsic
      apoptosis trigger.
    supported_by:
    - reference_id: file:interpro/panther/PTHR11471/PTHR11471-review.yaml
      supporting_text: "Placing GO:2001238 at the Eumetazoa root (PTN000895255) propagates\n\
