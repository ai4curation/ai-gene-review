description: 'KRTAP13-1 (keratin-associated protein 13-1, KAP13.1) is a small (172 aa) high-sulfur hair keratin-associated protein of the KAP13 family (PMG/KRTAP_PMG family), encoded in the chromosome 21q22.1 KAP gene domain. Like other KAPs it is a hair-specific matrix protein: in the hair cortex the hair keratin intermediate filaments are embedded in an interfilamentous matrix of KAPs that become extensively disulfide cross-linked to the cysteine-rich hair keratins, giving the hair shaft its rigidity and resistance. KRTAP13-1 transcripts are weakly expressed in the late matrix and throughout the cortex of the anagen hair follicle. An orthologous KRTAP13-1 gene is present in sheep within a conserved chromosome 1 KAP cluster.'
