suggested_questions:
- question: What is the protein-level abundance and precise cortical stage of KAP13.1 deposition in human hair, given its weak in situ signal?
suggested_experiments:
- hypothesis: KAP13.1 is deposited in the cortical matrix of keratinizing hair cortex cells.
  description: Raise a KAP13.1-specific antibody and perform immunofluorescence/immuno-electron microscopy of plucked anagen scalp hair follicles, co-staining hair keratins.
  experiment_type: immunolocalization
