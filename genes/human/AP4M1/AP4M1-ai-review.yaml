- term:
    id: GO:0035615
    label: clathrin-cargo adaptor activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - FB:FBgn0024833
  - FB:FBgn0263351
  - PANTHER:PTN000055849
  - dictyBase:DDB_G0289247
  review:
    summary: >-
      The one IBA on this gene that does not survive. The IBD sits on the deep pan-mu
      node PTN000055849 and every one of its seeds is a clathrin-adaptor mu subunit -
      Drosophila AP-1mu and AP-2mu, Dictyostelium AP-1 mu, and in the current family
      slice human AP1M2. AP-4 works without clathrin and outside endocytosis, which is
      what this term's definition requires.
    action: MODIFY
    reason: >-
      The failure is in the node placement rather than in the source annotations. Each
      seed has its own experimental grounding for the term in QuickGO - AP1M2 IDA
      PMID:10338135, AP2M1 IDA PMID:23676497, Drosophila AP-1mu IMP PMID:22389401,
      AP-2mu IMP PMID:20226669, Dictyostelium apm1 IDA PMID:12802059 - and every one of
      them is a genuine clathrin adaptor. Placing the assertion at the node ancestral to
      all four AP complexes then carries it into the AP-3 and AP-4 clades, which are
      non-clathrin coats. AP4M1 has GO:0035615 by IBA only, with no experimental row for
      it in any organism, so nothing on the target side rescues it. The term's definition
      is doubly disqualifying: it requires bringing together a cargo protein with
      clathrin, responsible for the formation of endocytic vesicles, which commits both
      to clathrin, that AP-4 demonstrably lacks, and to endocytic vesicles, when AP-4 is
      a trans-Golgi network export coat. The term is current, not obsolete - it was
      renamed from clathrin adaptor activity in December 2025 and its clathrin definition
      dates from 2019. The correction is a generalisation rather than a deletion, because
      the cargo-adaptor essence does transfer even though the clathrin specialisation
      does not: GO:0035615's only parent, GO:0140312 cargo adaptor activity, states the
      coat-cargo bridging without the clathrin or endocytic commitments, and mu4 supplies
      exactly that function within the AP-4 coat. On an obligate-heterotetramer subunit
      it is a contributed activity, which is how core_functions records it.
    proposed_replacement_terms:
    - id: GO:0140312
      label: cargo adaptor activity
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      source_entities:
      - source_id: FB:FBgn0024833
        source_label: O62531, Drosophila AP-1mu
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Resolved through the UniProt cross-reference for this FlyBase identifier (1
          hit, TrEMBL). QuickGO shows GO:0035615 IMP from PMID:22389401. A true clathrin
          adaptor mu subunit; the term is right for it and wrong for AP-4.
      - source_id: FB:FBgn0263351
        source_label: O62530, Drosophila AP-2mu
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Resolved through the UniProt cross-reference (1 hit, TrEMBL). QuickGO shows
          GO:0035615 IMP from PMID:20226669. The endocytic adaptor mu subunit, i.e. the
          protein the term's endocytic-vesicle clause was written for.
      - source_id: PANTHER:PTN000055849
        source_label: PTHR10529 pan-mu-adaptin IBD node
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          The node, and the locus of the error. It is ancestral to the mu subunits of all
          four AP complexes, so an assertion placed here reaches AP-3 and AP-4 as well as
          AP-1 and AP-2. The same node's GO:0005802 IBD is fine because its seed list
          includes AP-4 subunits; this one's does not include a single one.
      - source_id: dictyBase:DDB_G0289247
        source_label: Q54HS9, AP1M_DICDI, Dictyostelium AP-1 complex subunit mu
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Resolved through the UniProt cross-reference for this dictyBase identifier (1
          hit, Swiss-Prot). QuickGO shows GO:0035615 IDA from PMID:12802059. A third
          clathrin-adaptor donor; the seed list contains no AP-4 subunit at all.
      residue_claims_not_applicable: >-
        The rejection is not residue-based, and the alignment run for this review makes
        the point sharply: the phenylalanine of the mu4 cargo site, F255, is conserved in
        every mu paralog tested, so no residue argument separates mu4 from the clathrin
        adaptors. The case against the term rests on coat composition and on the term's
        own definition, and the case for a distinct mu4 binding site rests on the APP
        crystal structure.
    supported_by:
    - reference_id: PMID:10436028
      supporting_text: >-
        Immunogold electron microscopy indicates that AP-4 is associated with
        nonclathrin-coated vesicles in the region of the trans-Golgi network.
    - reference_id: PMID:26542808
      supporting_text: >-
        The heterotetrameric (ϵ-β4-μ4-σ4) complex adaptor protein 4 (AP-4) is a component
        of a non-clathrin coat involved in protein sorting at the trans-Golgi network
        (TGN).
    - reference_id: PMID:20230749
      supporting_text: >-
        Biochemical and X-ray crystallographic analyses reveal that the properties of the
