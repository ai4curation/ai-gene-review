  review:
    summary: >-
      Proposed. mu4 binds ARF1 directly, through the same signal-binding domain that
      reads cargo tails, and does so independently of ARF1's nucleotide state. Nothing in
      the 53-row GOA set for this gene records any ARF or GTPase interaction.
    action: NEW
    reason: >-
      This is a real gap rather than a refinement. ARF-dependent recruitment to the
      trans-Golgi network is the mechanism that puts the AP-4 coat on a membrane at all -
      it is why the localization is brefeldin A-sensitive, a fact both founding papers
      reported - and the study that worked it out showed that two subunits contact ARF1
      directly, epsilon and mu4, with different nucleotide requirements. mu4's is the
      constitutive, nucleotide-independent contact. GO:0031267, binding to a small
      monomeric GTPase, is the right level: GO has no ARF-specific binding term, and
      GO:0030742 GTP-dependent protein binding would be positively wrong for mu4, since
      nucleotide independence is the paper's explicit finding, however apt it would be for
      the epsilon subunit. Coded IPI with the human ARF1 entry P84077 as the partner; the
      experiments are direct binding assays with recombinant proteins, not a
      perturbation.
    supported_by:
    - reference_id: PMID:11707398
      supporting_text: >-
        In addition, we demonstrate a direct interaction of the epsilon and mu4 subunits
        of AP-4 with ARF1.
    - reference_id: PMID:11707398
      supporting_text: >-
        epsilon binds only to ARF1-GTP and requires residues in the switch I and switch
        II regions of ARF1. In contrast, mu4 binds equally well to the GTP- and GDP-bound
        forms of ARF1 and is less dependent on switch I and switch II residues.
    - reference_id: PMID:11707398
      supporting_text: >-
        We map the interacting regions on the AP-4 subunits to the trunk region of ε and
        the signal-binding domain of µ4.
