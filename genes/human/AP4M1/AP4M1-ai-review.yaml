existing_annotations:
- term:
    id: GO:0000045
    label: autophagosome assembly
  evidence_type: IMP
  original_reference_id: PMID:29180427
  qualifier: involved_in
  review:
    summary: >-
      Core. Loss of AP-4 traps ATG9A at the trans-Golgi network and impairs LC3B
      lipidation and maturation of preautophagosomal structures; the same ATG9A
      redistribution is seen in fibroblasts from patients whose mutation is in the mu4
      subunit itself.
    action: ACCEPT
    reason: >-
      This is the function that finally explained AP-4 after nearly twenty years without
      an assigned pathway, and it is supported from three independent directions: the
      targeted study that identified ATG9A as an AP-4 cargo, unbiased organellar
      proteomics in AP-4 knockout and patient cells, and an AP-4 knockout mouse. AP4M1 is
      an obligate subunit, so the complex-level perturbation is evidence about this gene
      product; the AP4M1-specific patient-fibroblast result removes any residual doubt
      that the phenotype requires mu4.
    supported_by:
    - reference_id: PMID:29180427
      supporting_text: >-
        AP-4 promotes signal-mediated export of ATG9A from the trans-Golgi network to the
        peripheral cytoplasm, contributing to lipidation of the autophagy protein LC3B
        and maturation of preautophagosomal structures.
    - reference_id: PMID:29698489
      supporting_text: >-
        Importantly, we found that ATG9A was more concentrated at the TGN and depleted
        from the peripheral cytoplasm in both skin fibroblasts from patients with
        mutations in AP-4 μ4 and neurons from AP-4 ε KO mice, as compared to their normal
        counterparts.
    - reference_id: PMID:30262884
      supporting_text: >-
        We demonstrate that AP-4 deficiency causes missorting of ATG9A in diverse cell
        types, including patient-derived cells, as well as dysregulation of autophagy.
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:25416956
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q96K76
  review:
    summary: >-
      Partner resolved as USP47, a deubiquitinase, from a proteome-scale binary yeast
      two-hybrid map. No follow-up anywhere in the AP-4 literature and no functional
      interpretation available.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Bare protein binding from a single high-throughput binary screen. USP47 appears in
      none of the AP-4 mechanistic literature - not in the coat composition papers, not
      in the AP-4 affinity-purification datasets, and not among the accessory factors
      (tepsin, RUSC1/2, FHF) that unbiased proteomics did recover. The edge may be real
      but it supports no informative molecular function, so there is nothing to modify it
      to.
    supported_by:
    - reference_id: PMID:25416956
      supporting_text: high-quality human binary protein-protein interactions
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:26496610
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q96N21
  review:
    summary: >-
      Partner resolved as TEPSIN, the only known AP-4 accessory protein. The association
      is genuine but it is with the complex, not with mu4: tepsin's two conserved motifs
      bind the C-terminal ear domains of beta-4 and epsilon.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      A GFP-tagged affinity-purification survey reports co-purification of AP4M1 and
      TEPSIN, which follows from both being part of the AP-4 coat. The binding surfaces
      were subsequently mapped and they are on the other two subunits, so this row does
      not describe a mu4 molecular function. What it does record - membership of the same
      coat - is already asserted by the GO:0030124 rows.
    supported_by:
    - reference_id: PMID:26542808
      supporting_text: >-
        which interact with the C-terminal ear (or appendage) domains of the β4 and ϵ
        subunits of AP-4, respectively.
    - reference_id: PMID:26496610
      supporting_text: >-
        Here, we have generated a library of HeLa cell lines expressing 1,125 GFP-tagged
        proteins
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:26544806
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q9UK23
  review:
    summary: >-
      Partner resolved as NAGPA. This is a genuine mu4-specific interaction with the
      cytosolic region of a candidate cargo, and the same paper already supports a more
      informative term on this gene.
    action: MODIFY
    reason: >-
      The partner is resolved and the interaction is mu4-specific rather than
      complex-level, so the bare binding term should be replaced by the informative one.
      GOA itself records GO:0019904 from this same reference; making the two rows agree
      states the fact once, at the level of signal recognition by the mu homology domain,
      rather than leaving one of them as uninformative protein binding.
    proposed_replacement_terms:
    - id: GO:0019904
      label: protein domain specific binding
    supported_by:
    - reference_id: PMID:26544806
      supporting_text: >-
        We found that the μ4 subunit of AP-4 interacts with NAGPA, an enzyme involved in
        the synthesis of the mannose 6-phosphate signal that targets acid hydrolases to
        the lysosome
    - reference_id: file:human/AP4M1/AP4M1-uniprot.txt
      supporting_text: Interacts with tyrosine-based sorting signals on the cytoplasmic
        tail
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:29180427
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q7Z3C6
  review:
    summary: >-
      Partner resolved as ATG9A, the physiological AP-4 cargo. This is signal-mediated
      cargo selection by the coat, which has a molecular function term of its own.
    action: MODIFY
    reason: >-
      Recording the central cargo-recognition event of this complex as bare protein
      binding loses everything that matters about it. The interaction is what makes AP-4
      a coat adaptor for ATG9A, so cargo adaptor activity is the informative term; on a
      subunit of an obligate heterotetramer it is a contributed rather than an
      independently enabled activity, which is how it is represented in core_functions.
      The narrower child GO:0035615 is not available here because it commits to clathrin
      and to endocytic vesicles, neither of which applies to AP-4.
    proposed_replacement_terms:
    - id: GO:0140312
