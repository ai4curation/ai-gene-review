id: O00189
gene_symbol: AP4M1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  AP4M1 encodes mu4-adaptin, the medium (mu) subunit of adaptor protein complex 4 (AP-4),
  a heterotetramer of epsilon (AP4E1), beta-4 (AP4B1), mu-4 (AP4M1) and sigma-4 (AP4S1)
  that forms a non-clathrin coat on the cytosolic face of the trans-Golgi network. Within
  the complex, mu4 is the cargo-recognition subunit: its C-terminal mu homology domain
  (residues 184-452) binds short sorting motifs in the cytosolic tails of transmembrane
  proteins, with a signal preference of its own rather than the canonical YXXPhi
  specificity of the mu subunits of AP-1, AP-2 and AP-3, and with a binding surface whose
  location on the domain differs from theirs. Recruitment of AP-4 to trans-Golgi network
  membranes is ARF-dependent and brefeldin A-sensitive, and mu4 itself binds ARF1
  directly and independently of its nucleotide state. The physiological cargo established
  by both targeted and unbiased approaches is ATG9A, the only multispanning membrane
  protein of the core autophagy machinery: AP-4 exports ATG9A from the trans-Golgi
  network to the peripheral cytoplasm, and when AP-4 is lost ATG9A is retained at the
  Golgi, autophagosome formation is impaired, and axons accumulate swellings and
  aggregates. Additional AP-4-dependent cargoes include the amyloid precursor protein,
  whose mu4-bound YKFFE motif routes it from the trans-Golgi network to endosomes and so
  limits amyloidogenic processing, and SERINC1/SERINC3. Accessory factors tepsin, RUSC1/2
  and the FTS-Hook-FHIP complex act with the coat; mu4 binds the Hook1 and Hook2
  coiled-coil domains directly, coupling AP-4 and its ATG9A cargo to dynein-dependent
  perinuclear positioning. In neurons AP-4 restricts cargo, including AMPA
  receptor-TARP complexes, to the somatodendritic domain, and in polarized epithelia it
  participates in basolateral sorting. Biallelic loss-of-function variants in AP4M1 cause
  spastic paraplegia 50, a childhood-onset complicated hereditary spastic paraplegia with
  intellectual disability, microcephaly and progressive spasticity, one of the four
  genetically equivalent forms of AP-4 deficiency syndrome.
