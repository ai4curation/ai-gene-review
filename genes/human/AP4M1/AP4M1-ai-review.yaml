- description: >-
    Export of the amyloid precursor protein from the trans-Golgi network to endosomes,
    which restrains amyloidogenic processing. The YKFFE motif of the APP cytosolic tail
    binds mu4 directly; the complex was crystallized, and the mu4 mutations F255A and
