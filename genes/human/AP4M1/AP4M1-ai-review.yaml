core_functions:
- description: >-
    The cargo-recognition subunit of the AP-4 coat. Within the obligate
    epsilon-beta4-mu4-sigma4 heterotetramer, mu4 contributes the site that reads short
    sorting motifs in the cytosolic tails of transmembrane cargo, and it is that
    recognition event which loads cargo into AP-4-coated vesicles budding from the
    trans-Golgi network. The specificity is mu4's own rather than the canonical YXXPhi
    preference of the clathrin-adaptor mu subunits: a combinatorial peptide screen gives
    a distinct position-by-position profile, the APP motif is YKFFE, the binding site
    seen crystallographically is at a different location on the domain from other
    signal-adaptor interactions, and the GluRdelta2 tail engages through motifs that are
    not tyrosine-based at all. Two residues of the mu homology domain, F255 and R283,
    are required for the APP interaction. The activity is contributed rather than
    independently enabled, because a mu4 subunit outside the complex has no coat to load.
