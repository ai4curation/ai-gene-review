proposed_new_terms:
- proposed_name: tyrosine-based sorting signal binding
  proposed_definition: >-
    Binding to a tyrosine-based sorting signal, a short linear motif of the form YXXPhi
    (where Phi is a bulky hydrophobic residue) or a related tyrosine-containing motif,
    located within the cytosolic domain of a transmembrane protein and read by an adaptor
    to direct that protein into a transport vesicle.
  justification: >-
    Recognition of tyrosine-based sorting signals is the defining molecular activity of
    the mu subunits of all four AP complexes, yet GO offers no term for it that is not
    tied to clathrin-mediated endocytosis. The one available term, GO:0089710 endocytic
    targeting sequence binding, is defined as binding a signal which directs
    internalization by clathrin-coated pits, so it can be used for mu2 but not for mu1,
    mu3 or mu4, whose signals act in post-Golgi and endosomal sorting. The effect is that
    the best-characterized activity of AP4M1 - a specificity profile measured by
    combinatorial peptide screening, a dissociation constant measured by surface plasmon
    resonance, and a co-crystal with the APP signal - can only be recorded as
    GO:0019904 protein domain specific binding, which is both too general and
    technically inapt, since a sorting motif is a short linear element rather than a
    folded domain. A general parent for GO:0089710 would let the mu subunits, and other
    signal-reading adaptors, be annotated at the resolution the experiments actually
    reach.
  proposed_parent:
    id: GO:0005515
    label: protein binding
  supported_by:
  - reference_id: PMID:11139587
    supporting_text: >-
      The medium (mu) chains of the adaptor protein (AP) complexes AP-1, AP-2, and AP-3
      recognize distinct subsets of tyrosine-based (YXXphi) sorting signals found within
      the cytoplasmic domains of integral membrane proteins.
  - reference_id: PMID:10436028
    supporting_text: >-
      The mu4 subunit of the complex specifically interacts with a tyrosine-based sorting
      signal, indicating that, like the other three AP complexes, AP-4 is involved in the
      recognition and sorting of cargo proteins with tyrosine-based motifs.
knowledge_gaps:
- gap_statement: >-
    The sorting signal in ATG9A that mu4 reads has not been defined, so the connection
    between AP4M1's measured binding specificity and its only established physiological
    cargo is still missing.
  boundary: >-
    Firmly established: ATG9A is an AP-4 cargo, identified independently by a targeted
    search and by unbiased organellar proteomics, and its export from the trans-Golgi
    network is signal-mediated. Equally firmly established: mu4 has a measurable and
    idiosyncratic signal preference, obtained from a combinatorial peptide library, and
    at least one natural motif it binds - the APP YKFFE - has been co-crystallized with
    the domain, with two required residues identified by mutagenesis. What has not been
    published is the ATG9A motif itself, or a demonstration that the mu4 residues
    required for APP binding are also required for ATG9A export.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: >-
    Every functional annotation on this gene downstream of cargo selection - autophagosome
    assembly, trans-Golgi network export, the disease mechanism - assumes that mu4's
    signal-binding activity is what recognizes ATG9A. If the ATG9A determinant turned out
    to be read by a different subunit, or not to be a mu4-type motif at all, the molecular
    function currently credited to AP4M1 would be supporting a process it does not
    directly select for. It is also the experiment that would justify a specific
    signal-binding molecular function term rather than the generic one now used.
  resolution: >-
    Map the ATG9A cytosolic determinant by truncation and alanine scanning, test it
    against recombinant mu4 in a direct binding assay, and ask whether the F255A and
    R283D mutants that lose APP binding also fail to export ATG9A in an AP4M1-null
    background.
  provenance:
  - reference_id: PMID:29180427
    supporting_text: >-
      AP-4 promotes signal-mediated export of ATG9A from the trans-Golgi network to the
      peripheral cytoplasm, contributing to lipidation of the autophagy protein LC3B and
      maturation of preautophagosomal structures.
  - reference_id: PMID:11139587
    supporting_text: >-
      Statistical analyses of the results revealed that mu4 prefers aspartic acid at
      position Y+1, proline or arginine at Y+2, and phenylalanine at Y-1 and Y+3 (phi).
- gap_statement: >-
    Whether AP-4 has an endogenous lysosomal cargo is unresolved, and two GO annotations
    on this gene depend on the answer.
  boundary: >-
    Established: mu4 binds the LAMP-2 tyrosine signal in vitro, and a Tac reporter
    carrying a mu4-selected signal reaches the endosomal-lysosomal system by the
    biosynthetic route rather than by endocytosis. Also established: an unbiased survey of
    proteins whose localization depends on AP-4 returned ATG9A, SERINC1 and SERINC3, with
    no lysosomal membrane protein among them, and AP-4-deficient cells have not been
    reported to missort LAMP-2. So the capability is demonstrated and the physiological
    instance is not.
  gap_kind:
  - BIOLOGY
  - CURATION
  dark_aspect: BP_DARK
  status: OPEN
  significance: >-
    GO:0006622 protein targeting to lysosome and GO:0090160 Golgi to lysosome transport
    are both on this gene, the latter also propagated as an IBA through the AP-4 mu node,
    and both rest on the same reporter experiment. If no endogenous lysosomal cargo
    exists, these are annotations of an assay rather than of a function, and the IBA
    carries that across the whole AP-4 clade. This review grades them non-core for exactly
    this reason.
  resolution: >-
    Quantitative comparison of lysosomal membrane protein delivery in AP4M1-null versus
    wild-type cells, and a test of whether LAMP-2 localization or the composition of the
    lysosomal membrane changes in patient fibroblasts, which are already available.
  provenance:
  - reference_id: PMID:11139587
    supporting_text: >-
      These experiments showed that mu4 recognized the tyrosine signal from the human
      lysosomal protein LAMP-2, HTGYEQF.
  - reference_id: PMID:30262884
    supporting_text: >-
      We identify three transmembrane cargo proteins, ATG9A, SERINC1 and SERINC3, and two
      AP-4 accessory proteins, RUSC1 and RUSC2.
- gap_statement: >-
    How a defect in a ubiquitously expressed trans-Golgi network coat produces a disease
    that is almost entirely neurological is unexplained.
  boundary: >-
    Established: AP-4 is expressed in all cell types examined; loss of any one of its four
    subunits causes the same syndrome; ATG9A missorting is seen in patient fibroblasts as
    well as in neurons; and in neurons the consequences include impaired axonal
    autophagosome generation, axonal swellings and aggregate accumulation. Also
    established: restoring AP4M1 alone rescues AP-4 function in patient fibroblasts and
    gives dose- and age-dependent benefit in knockout mice. What is not established is why
    non-neuronal tissues tolerate the same molecular defect.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: NARROWING
  significance: >-
    The answer determines whether AP-4's core function is best described as a general
    trans-Golgi network export step that neurons happen to be most dependent on, or as a
    neuron-specific sorting activity that the standard cell-culture assays only
    approximate. It also bears on the tissue targeting of the gene therapies now in
    preclinical and early clinical testing.
  resolution: >-
    Side-by-side quantification of ATG9A flux, autophagic capacity and cargo missorting in
    isogenic AP4M1-null neurons, astrocytes and fibroblasts, with attention to whether a
    parallel export route substitutes for AP-4 in non-neuronal cells; and a test of
    whether the axon-specific deficit reflects transport distance rather than a distinct
    sorting requirement.
  provenance:
  - reference_id: PMID:31142229
    supporting_text: >-
      TGN retention results in depletion of axonal ATG9A, leading to defective
      autophagosome generation and aberrant expansions of the distal axon.
  - reference_id: PMID:36951961
    supporting_text: >-
      We preformed preclinical studies evaluating an adeno-associated virus (AAV)/AP4M1
      gene therapy for SPG50 and describe in vitro studies that demonstrate transduction
      of patient-derived fibroblasts with AAV2/AP4M1, resulting in phenotypic rescue.
suggested_questions:
- question: >-
    For GO_Central PAINT curators of PTHR10529: should the GO:0035615 IBD at
    PTN000055849 move down to the AP-1/AP-2 clades, or gain an IRD at the AP-4 node
    PTN000242612? All four of its seeds are AP-1 or AP-2 mu subunits, the term's
    definition commits to clathrin and to endocytic vesicles, and the same leak will
    reach every AP-4 and AP-3 mu orthologue in the family, not just the human gene. The
    node already demonstrates the mechanism: its GO:0005802 IBD is correctly blocked at
    the AP-2 clade by an IRD at PTN000242370.
- question: >-
    For InterPro: should the interpro2go mappings IPR001392 and IPR018240 to GO:0030131
    clathrin adaptor complex exist? Both signatures match the mu subunits of all four AP
    complexes, but GO:0030131 has only AP-1 and AP-2 among its descendants, so the
    mapping is guaranteed to over-call on every mu3 and mu4 protein. The other two terms
    these signatures carry, GO:0006886 and GO:0016192, are genuine family properties.
- question: >-
    For Reactome: the event "AP4 transports APP from trans-Golgi network to endosome
    lumen" yields GO:0008320 transmembrane protein transporter activity and GO:0031904
    endosome lumen on AP4M1. Can the reaction be re-typed as vesicular transport, so that
    a coat adaptor is not recorded as a translocase and is not placed inside the
    compartment its cargo is delivered to?
- question: >-
    For the Bonifacino group or whoever next works on AP-4: is the mu4-ARF1 contact,
    which is nucleotide-independent and maps to the signal-binding domain, on the same
    surface that binds cargo signals? If so, ARF1 and cargo would compete, which would be
    a different model of coat assembly from the AP-1/AP-2 paradigm.
- question: >-
    For GO ontology editors: would a general parent for GO:0089710 endocytic targeting
    sequence binding be accepted, so that recognition of a tyrosine-based sorting signal
    outside the endocytic pathway has a term? Three of the four AP mu subunits, and the
    GGAs, currently have nowhere to go but GO:0019904.
suggested_experiments:
- description: >-
    Alanine-scan the ATG9A cytosolic determinant against recombinant mu4 by isothermal
    titration calorimetry or surface plasmon resonance, then test the mapped motif for
    AP-4-dependent export in an AP4M1-null line. This is the experiment that would
    connect the measured mu4 signal preference to the one cargo that matters for the
    disease, and its absence is the main knowledge gap recorded here.
- description: >-
    Reconstitute AP-4 with mu4 carrying F255A or R283D in AP4M1-null cells and score
    ATG9A distribution, LC3B lipidation and APP processing in parallel. This separates
    cargo-specific from coat-wide effects, and would show whether the crystallographically
    defined APP site is used for ATG9A as well.
- description: >-
    Perform dynamic organellar mapping in isogenic AP4M1-null neurons and fibroblasts
    derived from the same iPSC line, and ask whether the AP-4-dependent proteome is
    cell-type-specific. The published unbiased surveys were done in HeLa cells and
    fibroblasts, so a neuronal cargo set would speak directly to why the disease is
    neurological.
- description: >-
    Mutate the mu4 surface that contacts ARF1 within the signal-binding domain and ask
    whether AP-4 still becomes membrane-associated and brefeldin A-sensitive, and whether
    it still binds cargo. A single mutant that loses ARF1 binding while retaining cargo
    binding, or the converse, would settle whether the two activities share a surface.
- description: >-
    Determine the structure of the AP-4 core bound to a Hook coiled-coil fragment by
    crystallography or cryo-EM, to establish whether the FHF site on mu4 overlaps the
    cargo-signal site and therefore whether coat positioning and cargo capture can occur
    simultaneously.
