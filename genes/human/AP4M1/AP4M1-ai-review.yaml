- description: >-
    Export of ATG9A from the trans-Golgi network, which supplies the peripheral ATG9A
    pool that autophagosome formation draws on. ATG9A is the only multispanning membrane
    protein of the core autophagy machinery, and it is the AP-4 cargo identified both by
    a targeted search and by unbiased organellar proteomics. When AP-4 function is lost,
    ATG9A is retained at the trans-Golgi network and depleted from the peripheral
    cytoplasm, LC3B lipidation and preautophagosomal maturation are impaired, and in
    neurons axons develop swellings and accumulate aggregates. The phenotype is
    documented in cells whose lesion is in AP4M1 itself, not only in models of the other
    three subunits.
