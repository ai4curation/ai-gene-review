id: P47974
gene_symbol: ZFP36L2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'ZFP36L2 encodes BRF2/TIS11D, a TTP-family tandem CCCH zinc-finger RNA-binding
  protein that binds AU-rich 3''-UTR elements and promotes target mRNA deadenylation
  and decay. Human evidence links ZFP36L2 to LDLR mRNA destabilization and maternal
  mRNA decay during preimplantation development, with mouse genetic studies supporting
  shared ZFP36L1/ZFP36L2 roles in lymphocyte, hematopoietic, and stem-cell quiescence
  programs.'
