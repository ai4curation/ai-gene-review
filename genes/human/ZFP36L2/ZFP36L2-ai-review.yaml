core_functions:
- description: ZFP36L2 binds AU-rich 3'-UTR elements and functions as a
    sequence-specific adaptor for mRNA decay, with direct human evidence for
    LDLR mRNA destabilization and maternal mRNA decay during early
    embryogenesis.
  molecular_function:
    id: GO:0035925
    label: mRNA 3'-UTR AU-rich region binding
  directly_involved_in:
  - id: GO:0061158
    label: 3'-UTR-mediated mRNA destabilization
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by: *id001
proposed_new_terms: []
suggested_questions:
- question: Which maternal transcripts are direct ZFP36L2 targets in human
    oocytes and zygotes, and how do infertility-associated variants alter RNA
    binding or decay-cofactor recruitment?
  experts: []
suggested_experiments:
- description: Profile wild-type and disease-variant ZFP36L2 in human
    oocyte-like cells or zygote models by CLIP-seq and mRNA half-life
    measurement to test maternal target specificity and decay defects.
  experiment_type: variant-specific maternal mRNA decay assay
