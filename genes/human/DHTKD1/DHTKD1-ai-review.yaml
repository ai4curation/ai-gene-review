suggested_questions:
- question: Under which native cell states do DHTKD1 and OGDH occupy a shared complex, and how much does
    this contribute to each substrate flux?
- question: Does the BMAL1 isoform-8 interaction occur between endogenous proteins in mammalian cells,
    and in which compartment?
suggested_experiments:
- description: Compare isotope-labeled lysine flux in relevant human cell types with DHTKD1 knockout,
    wild-type rescue and a catalytically impaired control. Measure labeled 2-oxoadipate and glutaryl-CoA
    alongside NADH and ATP pools, and account for OGDH-dependent bypass.
  hypothesis: Loss of the DHTKD1 E1 step changes pathway flux; comparing flux with energy-pool readouts
    can distinguish direct catalytic effects from context-dependent downstream responses.
- description: Reconstitute purified human DHTKD1, DLST and DLD with selected clinically supported DHTKD1
    variants. Compare isolated E1 turnover, complex NADH production and assembly measurements under matched
    substrate and cofactor conditions.
  hypothesis: Comparing the isolated and complete reactions can distinguish defects in intrinsic E1 catalysis
    from defects in assembly or transfer between components, without assuming one mechanism for all variants.
