core_functions:
- description: 'DHTKD1 supplies the ThDP-dependent E1 reaction of mitochondrial oxoadipate dehydrogenase:
    decarboxylation of 2-oxoadipate and reductive transfer of its glutaryl intermediate to the lipoyl
    group on DLST. This catalytic step participates in the convergent lysine and tryptophan catabolic
    pathway. DLST and DLD carry out the subsequent CoA transfer and lipoamide reoxidation; cofactor binding
    and homodimer formation are features of this one catalytic core.'
