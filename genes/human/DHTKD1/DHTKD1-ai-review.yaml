description: DHTKD1 is the thiamine diphosphate-dependent E1 component of the mitochondrial oxoadipate
  dehydrogenase complex. It decarboxylates 2-oxoadipate and transfers the resulting glutaryl intermediate
  to the lipoyl group on DLST. DLST then transfers glutaryl to CoA, and DLD reoxidizes the reduced lipoyl
  group. This sequence participates in the convergent lysine, hydroxylysine and tryptophan degradation
  pathway. DHTKD1 forms a functional homodimer and strongly prefers 2-oxoadipate over 2-oxoglutarate,
  although lower oxoglutarate activity and association with OGDH-containing assemblies have been demonstrated.
  Loss of DHTKD1 activity can cause accumulation of 2-aminoadipate and 2-oxoadipate.
