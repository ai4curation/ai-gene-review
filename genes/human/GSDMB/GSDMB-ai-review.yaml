      Pre-dates all functional work on GSDMB; useful for localization and tissue distribution.'
  findings: []
- id: PMID:28154144
  title: Gene polymorphism linked to increased asthma and IBD risk alters gasdermin-B structure,
    a sulfatide and phosphoinositide binding protein.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Verified against PubMed: PNAS 2017, Chao, Kulakova and Herzberg. Cached abstract
      only (publisher restricts PMC full text). The primary direct evidence that GSDMB binds phosphoinositides
      and sulfatide. Its lipid profile conflicts with PMID:34022140; the conflict is now understood
      as an isoform difference rather than a disagreement about the same molecule. Method caveat
      worth noting: binding was to lipids immobilized on nitrocellulose, which is less physiological
      than a bilayer.'
  findings: []
- id: PMID:32299851
  title: Granzyme A from cytotoxic lymphocytes cleaves GSDMB to trigger pyroptosis in target cells.
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: 'Identifier verified against PubMed: Science 2020;368(6494):eaaz7548, Zhou et al.
      Flagged DISPUTED because Science published a Published Erratum for it in 2026 (PMID:42424476,
      doi 10.1126/science.aej7549), and the content of that erratum could not be retrieved - PubMed
      carries no abstract, Europe PMC records it as subscription-only and not in PMC, and science.org
      returns HTTP 403. I do not know what was corrected and am not guessing. Consequences are limited:
      no GOA annotation on GSDMB cites this PMID, nothing in this review rests on it, and its central
      claim (granzyme A cleaves GSDMB to unleash pore formation) has been independently re-derived
      with structures by three other groups (PMID:36991122, PMID:36991125, PMID:41592574), the last
      of which pins the cleavage site at Lys244.'
  findings: []
- id: PMID:34022140
  title: Pathogenic ubiquitination of GSDMB inhibits NK cell bactericidal functions.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Verified against PubMed: Cell 2021, Hansen et al., full text cached. Establishes
      the direct bactericidal activity and the cardiolipin/lipid A specificity. Its headline negative
      claim - that GSDMB does not lyse host cells - was contested at the time (PMID:36157507) and
      is now better read as a property of the isoform used (Q8TAX9-1) rather than of GSDMB in general.
      Cited here only for the bactericidal and bacterial-lipid claims, which are not in dispute.'
  findings: []
- id: PMID:36157507
  title: GSDMB N-terminal assembles in plasma membrane to execute pyroptotic cell death.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: 'Verified against PubMed: Genes Dis 2022, Gong et al., full text cached. A short
      rebuttal-style report rather than a full study, but it does the decisive fractionation experiment
      (GSDMB-NT in plasma membrane, not mitochondria, no cytochrome c release) and it identifies
      the isoform question itself, stating that it used the 416-residue form while Hansen et al.
      used isoform 1. Format is brief and the evidence is a single figure, so it is weighted as corroborating
      rather than decisive.'
  findings: []
- id: PMID:36599845
  title: Insights into the GSDMB-mediated cellular lysis and its targeting by IpaH7.8.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: 'Verified against PubMed: Nat Commun 2023, Yin et al., full text cached. Crystal
      structure of the GSDMB-IpaH7.8 complex; cited as corroboration for the Shigella targeting and
      the membrane-engagement surfaces, not as primary evidence for any annotation here.'
  findings: []
- id: PMID:36899106
  title: Distinct GSDMB protein isoforms and protease cleavage processes differentially control pyroptotic
