  supported_by:
  - reference_id: PMID:36991125
    supporting_text: We determine the cryo-electron microscopy structure of the 27-fold-symmetric
      GSDMB pore and depict conformational changes that drive pore formation.
  - reference_id: PMID:36899106
    supporting_text: Thus, immunocyte-derived Granzyme-A can cleave all GSDMB isoforms, but in only
      those containing exon 6, this processing results in pyroptosis induction.
  - reference_id: PMID:41592574
    supporting_text: The exosite engages a two-loop-organized site in the GSDMB-C domain, rendering
      a functional cleavage at Lys244 in GSDMB.
  - reference_id: PMID:36157507
    supporting_text: an obvious GSDMB-NT localization at plasma membrane was observed after 1, 2
      and 4 h of transfection with GZMA
- molecular_function:
    id: GO:1901612
    label: cardiolipin binding
  description: A second, membrane-target-switched activity of GSDMB that distinguishes it from the
    rest of the gasdermin family. Isoform Q8TAX9-1 does not recognize host inner-leaflet phosphoinositides
    and does not lyse the host cell; instead its granzyme-A-released N-terminal fragment binds cardiolipin,
    phosphatidylglycerol and lipid A - lipids of Gram-negative bacterial membranes - and forms pores
    directly in the bacterium, killing intracellular Shigella. The lipid requirement is strict enough
    that the fragment cannot insert into a plasma-membrane-mimetic bilayer unless cardiolipin is
    added. Shigella flexneri counters the pathway with the secreted E3 ligase IpaH7.8, which ubiquitinates
    GSDMB for proteasomal degradation and thereby shields the bacterium from natural killer cells;
    the same effector targets human but not mouse GSDMD.
  directly_involved_in:
  - id: GO:0042742
    label: defense response to bacterium
  - id: GO:0050829
    label: defense response to Gram-negative bacterium
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:34022140
    supporting_text: Rather, GSDMB binds and forms pores in membranes enriched in cardiolipin and
      other bacterial lipids including phosphatidylglycerol and lipid A
  - reference_id: PMID:34022140
    supporting_text: In contrast to the canonical function of most gasdermin family members, GSDMB
      does not inhibit Shigella by lysing host cells. Rather, it exhibits direct microbiocidal activity
      through recognition of phospholipids found on Gram-negative bacterial membranes.
  - reference_id: PMID:34022140
    supporting_text: These findings place GSDMB as a central executioner of intracellular bacterial
      killing and reveal a mechanism employed by pathogens to counteract this host defense system.
suggested_questions:
- question: What was corrected in the 2026 Science erratum (PMID:42424476) to the original granzyme
    A / GSDMB paper (PMID:32299851)? The erratum is paywalled with no abstract in PubMed or Europe
    PMC, so its content could not be established here. If the correction touches the cleavage-site
    or pyroptosis data rather than, say, a figure label, several downstream reviews would need revisiting.
  experts: []
- question: Do the non-pore-competent isoforms (Q8TAX9-1, Q8TAX9-2, Q8TAX9-3) still traffic to the
    plasma membrane after cleavage? Their dominant-negative inhibition of the competent isoforms
    implies they co-assemble, which would mean the plasma membrane location is not isoform-restricted
    even though pore formation is. This determines whether localization annotations should carry
    an isoform qualifier at all.
  experts:
  - Judy Lieberman
- question: Is the cardiolipin/lipid A versus phosphoinositide lipid preference determined by the
    exon-6 region at all? Q8TAX9-1 and Q8TAX9-4 differ only at Asn221 and by the loss of residues
    234-242, and Q8TAX9-6 carries that same 234-242 loss yet remains host-cell pore-competent, so the
    lipid switch may not map to the deletion that explains pore competence.
  experts:
  - Neal M. Alto
  - Osnat Herzberg
- question: Does exon-6-containing GSDMB damage mitochondria as well as the plasma membrane? PMID:36899106
    reports concomitant mitochondrial damage from exon-6-containing N-terminal constructs, while
    PMID:36157507 found essentially no GSDMB-NT in the mitochondrial fraction and no cytochrome c
    release. This has not been reconciled.
  experts: []
- question: Which GSDMB isoforms are expressed in the tissues where GSDMB matters clinically - airway
    epithelium in asthma and gut epithelium in IBD - as opposed to the tumour cell lines where isoform
    composition has been measured? The asthma and IBD risk polymorphisms sit in the C-terminal domain,
    so their effect may be on granzyme A exosite engagement rather than on pore formation.
  experts: []
suggested_experiments:
- hypothesis: Plasma-membrane targeting of the GSDMB N-terminal fragment is isoform-independent,
    and only the final pore-assembly step requires exon 6.
  description: Express each UniProt isoform (Q8TAX9-1 through Q8TAX9-6) with an identical tag in
    the same cell background, activate with recombinant dimeric granzyme A, and score membrane association
    by surface biotinylation and subcellular fractionation in parallel with LDH release. If the non-competent
    isoforms reach the membrane at comparable levels but do not release LDH, the isoform restriction
    is a pore-assembly defect and localization annotations should not carry an isoform qualifier.
  experiment_type: Isoform panel, fractionation and cytotoxicity assay
- hypothesis: The switch between host-cell lipid and bacterial lipid recognition maps to the exon-6
    window (residues 234-242).
  description: Build reciprocal chimeras and point substitutions swapping residues 234-242 between
    Q8TAX9-1 and Q8TAX9-4, and measure binding to single-headgroup liposomes (PI4P, PI(4,5)P2, sulfatide,
    phosphatidylserine, phosphatidylglycerol, cardiolipin, Kdo2-lipid A) by co-sedimentation, plus
    killing of intracellular Shigella and of host cells. Include phosphatidylserine explicitly, since
    GSDMB has never been tested for it despite carrying a phosphatidylserine binding GO annotation
    by phylogenetic transfer.
  experiment_type: Chimera and liposome binding panel
- hypothesis: The asthma/IBD risk haplotype alters granzyme A exosite engagement rather than pore
    formation.
  description: Compare recombinant GSDMB carrying the Gly299/Pro306 and the Arg299/Ser306 C-terminal
    loop variants for dimeric granzyme A binding affinity by surface plasmon resonance and for cleavage
    kinetics at Lys244, then test whether any difference in cleavage rate translates into different
    pyroptosis kinetics in an isoform-matched cell background.
  experiment_type: Binding kinetics and cleavage assay
