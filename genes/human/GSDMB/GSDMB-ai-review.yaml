- term:
    id: GO:0022829
    label: wide pore channel activity
  evidence_type: IDA
  original_reference_id: PMID:36991125
  qualifier: enables
  isoform: Q8TAX9-4
  review:
    summary: Proposed new annotation - the isoform-resolved pore-forming activity of GSDMB, which
      GOA does not record at all.
    action: NEW
    reason: 'GSDMB has no molecular-function annotation for pore formation, even though a 27-fold
      symmetric pore has been solved by cryo-EM by two independent groups (PMID:36991125, PMID:36991122).
      GO:0022829 is the term GO_Central already uses for the GSDMD pore, so this keeps GSDMB consistent
      with its paralog. The annotation is deliberately tagged isoform Q8TAX9-4 (GSDMB3): pore competence
      is genuinely isoform-specific rather than merely tested on one isoform, because exon-6-derived
      elements are structurally required for pore assembly and isoforms lacking them yield fragments
      that cannot lyse and instead act dominant-negatively (PMID:37115914, PMID:36899106, PMID:36991122).
      Q8TAX9-6 (GSDMB4) is also pore-competent but partially resists NK-triggered cleavage.'
    supported_by:
    - reference_id: PMID:36991125
      supporting_text: We determine the cryo-electron microscopy structure of the 27-fold-symmetric
        GSDMB pore and depict conformational changes that drive pore formation.
    - reference_id: PMID:36991125
      supporting_text: The structure uncovers an essential role for exon-6-derived elements in pore
        assembly
    - reference_id: PMID:36991122
      supporting_text: GSDMB isoforms with a canonical interdomain linker exhibit normal pyroptotic
        activity whereas other isoforms exhibit attenuated or no pyroptotic activity.
- term:
    id: GO:1901612
    label: cardiolipin binding
  evidence_type: IDA
  original_reference_id: PMID:34022140
  qualifier: enables
  isoform: Q8TAX9-1
  review:
    summary: Proposed new annotation - the bacterial-lipid specificity that distinguishes GSDMB from
      the rest of the family, absent from GOA.
    action: NEW
    reason: 'GSDMB carries three inner-leaflet phospholipid binding terms inherited from GSDMD but
      nothing for the lipid it was actually shown to require. Hansen et al. found that GSDMB binds
      and forms pores in membranes enriched in cardiolipin, phosphatidylglycerol and lipid A, and
      that it could not insert into a plasma-membrane-mimetic bilayer unless cardiolipin was added
      (PMID:34022140). Tagged isoform Q8TAX9-1 because this is genuinely isoform-specific rather
      than merely what was tested: UniProt curates Q8TAX9-1 as binding lipid A and cardiolipin while
      explicitly not binding host inner-leaflet phosphoinositides, and Chao et al. found no cardiolipin
      binding for the form they assayed (PMID:28154144). Human GSDMD also carries GO:1901612, so
      the term is already in use for this family.'
    supported_by:
    - reference_id: PMID:34022140
      supporting_text: Rather, GSDMB binds and forms pores in membranes enriched in cardiolipin and
        other bacterial lipids including phosphatidylglycerol and lipid A
- term:
    id: GO:0050829
    label: defense response to Gram-negative bacterium
  evidence_type: IDA
  original_reference_id: PMID:34022140
  qualifier: involved_in
  isoform: Q8TAX9-1
  review:
    summary: Proposed new annotation - a more specific replacement-grade term for the antibacterial
      role, supported directly on GSDMB rather than inherited.
    action: NEW
    reason: 'The gene already carries the parent term GO:0042742 by IBA. The direct experimental
      evidence is more specific than that: GSDMB kills Gram-negative bacteria by recognizing lipids
      of their membranes, an activity so consequential that Shigella flexneri dedicates a secreted
      E3 ligase to destroying GSDMB (PMID:34022140, corroborated structurally in PMID:36599845 and
      PMID:36991122). Proposed as an addition rather than as a replacement for GO:0042742, since
      the IBA legitimately asserts inheritance at the family level. Tagged isoform Q8TAX9-1, the
      isoform in which the bactericidal activity was demonstrated and which UniProt curates as having
      it.'
    supported_by:
    - reference_id: PMID:34022140
      supporting_text: This virulence strategy protects Shigella from the bacteriocidic activity
        of natural killer cells by suppressing granzyme-A-mediated activation of GSDMB.
    - reference_id: PMID:34022140
      supporting_text: These findings place GSDMB as a central executioner of intracellular bacterial
        killing and reveal a mechanism employed by pathogens to counteract this host defense system.
