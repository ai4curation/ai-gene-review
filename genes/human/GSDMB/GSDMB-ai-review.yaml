- term:
    id: GO:0001786
    label: phosphatidylserine binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: The one GSDMB lipid term with no GSDMB-specific measurement in either direction - a
      pure GSDMD-to-family transfer.
    action: KEEP_AS_NON_CORE
    reason: 'This row''s WITH/FROM is mouse Gsdmd (MGI:MGI:1916396) plus the family node alone, with
      no human GSDMD donor and no GSDMB donor. Both GSDMB lipid-specificity studies tested panels
      that did not resolve phosphatidylserine: Chao et al. assayed phosphoinositides, sulfatide and
      cardiolipin (PMID:28154144), and the word phosphatidylserine does not occur anywhere in the
      full text of Hansen et al. (PMID:34022140), whose liposomes were built from PC plus PI, PI(4,5)P2,
      sulfatide, PE, PG, cardiolipin or lipid A. So GSDMB has never been tested for PS binding. Retained
      rather than removed - an IBA encodes a PAINT curator''s judgement about node placement that
      could not be inspected here, and PS binding is genuine for the GSDMD donor - but demoted to
      non-core because it should not be read as an established GSDMB molecular function.'
