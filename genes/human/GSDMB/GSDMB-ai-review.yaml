id: Q8TAX9
gene_symbol: GSDMB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'Gasdermin-B, a member of the gasdermin family of pore-forming proteins and the only
  human gasdermin with no rodent ortholog. Like its paralogs it is an autoinhibited two-domain cytosolic
  protein in which the C-terminal domain masks the membrane-binding surface of the N-terminal domain.
  Granzyme A delivered by cytotoxic T and natural killer cells cleaves the interdomain linker at
  Lys244, releasing the N-terminal fragment, which oligomerizes into a 27-subunit transmembrane pore.
  Recognition is unusually specific: granzyme A must dimerize and engages an exosite on the GSDMB
  C-terminal domain, and the mouse enzyme does this inefficiently. Pore competence is determined
  by alternative splicing rather than by cleavage. Granzyme A cleaves every splice isoform, but only
  isoforms that translate exon 6 assemble a functional pore, because exon-6-derived elements form
  the belt that the oligomer needs; isoforms with a deleted or modified exon 6 yield N-terminal fragments
  that cannot lyse cells and can act dominant-negatively over those that can. Different isoforms
  also read different lipids and therefore different target membranes: the canonical exon-6-containing
  form binds inner-leaflet phosphoinositides and sulfatide and permeabilizes the human plasma membrane,
  whereas another isoform instead binds cardiolipin and lipid A and kills Gram-negative bacteria
  directly rather than lysing the host cell. Shigella flexneri counters this by secreting the E3
  ligase IpaH7.8, which ubiquitinates GSDMB for proteasomal degradation. GSDMB is expressed mainly
  in gastrointestinal and airway epithelium and in derived tumours, is induced by interferon-gamma,
  and polymorphisms at the locus are associated with asthma and inflammatory bowel disease.'
alternative_products:
- name: 4 {ECO:0000303|PubMed:36991122} (GSDMB3)
  id: Q8TAX9-4
  description: Canonical 416-residue form, contains exon 6. Pore-competent and fully functional -
    cells expressing it die by pyroptosis on NK cell attack. Binds host inner-leaflet phosphoinositides
    (PI4P, PI5P, PI(4,5)P2) and sulfatide.
- name: 1 {ECO:0000303|PubMed:36991122}
  id: Q8TAX9-1
  sequence_note: VSP_061489, VSP_061490
  description: Differs from the canonical form at two points in the exon-6 region (Asn221 replaced
    by SAGLD, and residues 234-242 missing). Does not lyse host cells and does not bind host
    inner-leaflet phosphoinositides; instead binds cardiolipin and lipid A and kills Gram-negative
    bacteria directly. UniProt curates this as the isoform characterised in the Shigella/IpaH7.8
    work.
- name: 2 {ECO:0000303|PubMed:36991122, ECO:0000303|PubMed:36991125} (GSDMB2)
  id: Q8TAX9-2
  sequence_note: VSP_061487
  description: Exon-6 region disrupted (residues 221-243 replaced by a single residue). Not able to
    trigger pyroptosis; frequently the isoform up-regulated in tumours.
- name: 3 {ECO:0000303|PubMed:36991122} (GSDMB1)
  id: Q8TAX9-3
  sequence_note: VSP_061488
  description: Exon-6 region disrupted (residues 221-234 replaced by a single residue). Not able to
    trigger pyroptosis.
- name: '5'
  id: Q8TAX9-5
  sequence_note: VSP_061486
  description: Lacks the entire N-terminal pore-forming domain (residues 1-253 missing); cannot form
    a pore.
- name: 6 {ECO:0000303|PubMed:36991122} (GSDMB4)
  id: Q8TAX9-6
  sequence_note: VSP_061490
  description: Retains the exon-6 belt elements needed for pore assembly (differing from canonical
    only by the loss of residues 234-242) and is pore-competent, but partially resists NK
    cell-triggered cleavage, so cells expressing it die by mixed pyroptosis and apoptosis.
existing_annotations:
- term:
    id: GO:0042742
    label: defense response to bacterium
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: Antibacterial defence is one of the best-evidenced GSDMB functions on the target gene
      itself, not merely a family inheritance.
    action: ACCEPT
    reason: 'Unlike most gasdermin IBAs, this one has direct experimental grounding on GSDMB: Hansen
      et al. showed that GSDMB kills intracellular Gram-negative bacteria by binding cardiolipin
      and lipid A and forming pores in the bacterial membrane, and that Shigella flexneri evolved
      the IpaH7.8 effector specifically to destroy it (PMID:34022140); this was corroborated structurally
      (PMID:36599845, PMID:36991122). Note that GSDMB (UniProtKB:Q8TAX9) appears in this row''s own
      WITH/FROM alongside mouse Gsdmd (MGI:MGI:1916396) and human GSDMA (UniProtKB:Q96QA5) - expected
      and correct, since the target''s own experimental annotation is one of the descendant evidences
      the PAINT curator used, and the IBA then adds that the function is inherited rather than GSDMB-specific.
      The bactericidal activity is isoform-dependent (documented for Q8TAX9-1), which cannot be expressed
      on an IBA row and is recorded on the NEW rows below instead.'
    supported_by:
    - reference_id: PMID:34022140
      supporting_text: In contrast to the canonical function of most gasdermin family members, GSDMB
        does not inhibit Shigella by lysing host cells. Rather, it exhibits direct microbiocidal
        activity through recognition of phospholipids found on Gram-negative bacterial membranes.
- term:
    id: GO:0070269
    label: pyroptotic inflammatory response
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: Correct for GSDMB as a gene, but true only of the exon-6-containing isoforms; granzyme
      A cleaves all isoforms and only some of the resulting fragments can form a pore.
    action: ACCEPT
    reason: 'Accepted as core. Four independent laboratories agree that granzyme-A-cleaved GSDMB
      executes pyroptosis, including two independent cryo-EM structures of the assembled pore (PMID:36991122,
      PMID:36991125) and the 2026 crystal structure of the granzyme-A/GSDMB-C complex pinning cleavage
      at Lys244 (PMID:41592574). The important qualification, which GOA does not currently express
      anywhere, is that this is not a general property of the protein: pore competence requires translation
      of exon 6, so Q8TAX9-4 (GSDMB3) and Q8TAX9-6 (GSDMB4) are pore-competent while Q8TAX9-2 (GSDMB2),
      Q8TAX9-3 (GSDMB1) and Q8TAX9-5 are not, and the non-functional N-terminal fragments act dominant-negatively
      over the functional ones (PMID:37115914, PMID:36899106). The restriction is downstream of cleavage,
      not at it. An IBA row cannot carry an isoform, so the isoform-resolved claim is made on the
      NEW wide pore channel activity row below. Also worth noting for interpreting the mouse literature:
      GSDMB has no rodent ortholog and mouse granzyme A engages it poorly (PMID:41592574). GSDMB
      appears in its own WITH/FROM here, which marks experimental grounding on the target and is
      not circular.'
    supported_by:
    - reference_id: PMID:36899106
      supporting_text: Thus, immunocyte-derived Granzyme-A can cleave all GSDMB isoforms, but in
        only those containing exon 6, this processing results in pyroptosis induction.
    - reference_id: PMID:37115914
      supporting_text: Cleaved N-terminal (NT) fragments of GSDMB isoforms 3 and 4 caused pyroptosis,
        but isoforms 1, 2, and 5 did not.
    - reference_id: PMID:36991125
      supporting_text: Presence of exon 6 in the isoforms dictates the pore-forming, pyroptotic activity
        in GSDMB.
- term:
    id: GO:0005546
    label: phosphatidylinositol-4,5-bisphosphate binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: Family-level transfer from GSDMD that is independently supported for GSDMB by direct
      measurement, but only for the exon-6-containing isoform.
    action: ACCEPT
    reason: 'The WITH/FROM is mouse and human GSDMD only, but unlike the corresponding GSDMC row
      this transfer has GSDMB-specific backing: Chao et al. showed direct binding of both full-length
      GSDMB and its N-terminal domain to immobilized phosphoinositides (PMID:28154144), and UniProt
      curates PI(4,5)P2 binding as a property of canonical isoform Q8TAX9-4. This is the lipid basis
      of host plasma-membrane pore formation, so it is accepted as core. The conflict in the literature
      is real but is an isoform conflict rather than a contradiction: Hansen et al. reported that
      GSDMB does not bind host inner-leaflet phosphoinositides (PMID:34022140), working with Q8TAX9-1,
      which UniProt now records as explicitly lacking this binding while binding cardiolipin and
      lipid A instead.'
    supported_by:
    - reference_id: PMID:28154144
      supporting_text: We show that both full-length GSDMB and the N-terminal domain bind to nitrocellulose
        membranes immobilized with phosphoinositides or sulfatide, but not with cardiolipin.
