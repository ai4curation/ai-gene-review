id: Q96RR1
gene_symbol: TWNK
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: TWNK encodes Twinkle, the nuclear-encoded replicative DNA helicase of mitochondria. Twinkle
  is a superfamily 4, DnaB/T7 gp4-like ring helicase with an N-terminal zinc-binding-like and catalytically
  inactive primase-like (RNA polymerase-like) domain, a linker, and a C-terminal RecA-like helicase domain.
  It assembles into hexamers and heptamers that bind single- and double-stranded DNA and couple NTP hydrolysis
  (UTP and ATP) to 5'->3' translocation and unwinding of duplex DNA. Together with DNA polymerase gamma
  (POLG/POLG2) and the mitochondrial single-stranded DNA-binding protein SSBP1 it forms the minimal mtDNA
  replisome, unwinding the parental duplex ahead of the polymerase; it is the only replicative helicase
  in mammalian mitochondria and is required for nascent D-loop strand synthesis. Twinkle also anneals
  complementary single strands, dissociates D-loops and branch-migrates three-stranded structures. It
  localises to mitochondrial nucleoids in the matrix, associated with the inner membrane. Mutations cause
  autosomal dominant progressive external ophthalmoplegia with multiple mtDNA deletions, mtDNA depletion
  syndrome 7 (infantile-onset spinocerebellar ataxia/hepatocerebral) and Perrault syndrome 5. The splice
  isoform Twinky is monomeric and lacks ATPase, unwinding and DNA-binding activity.
