suggested_questions:
- question: What loads the closed Twinkle ring onto circular mtDNA in vivo, given that it forms stable
    hexamers without nucleotide and no dedicated helicase loader has been identified?
- question: Do the strand-annealing, D-loop dissociation and branch-migration activities of Twinkle act
    in mtDNA repair or recombination-dependent replication in vivo?
- question: Is the reduced mitochondrial transcript level seen with adPEO Twinkle mutants solely secondary
    to replication stalling, or does Twinkle at coreTAS affect transcription termination directly?
suggested_experiments:
- hypothesis: Twinkle strand-annealing and branch-migration activities contribute to the formation or
    resolution of mtDNA deletions.
  description: Engineer separation-of-function Twinkle variants that keep unwinding but lose annealing
    in vitro, express them in TWNK-depleted cells, and quantify mtDNA deletions, replication intermediates
    and recovery after damage.
- hypothesis: Inner-membrane tethering via the RPD is required for Twinkle function in vivo.
  description: Map lipid-binding residues in the RPD, test liposome binding and ATPase of mutants, and
    assess nucleoid membrane association and mtDNA copy number in cells expressing them.
