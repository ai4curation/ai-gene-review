core_functions:
- description: Hexameric Twinkle is the replicative 5'->3' DNA helicase of the mitochondrial replisome,
    coupling its own NTP (UTP/ATP) hydrolysis to unwinding of the parental mtDNA duplex ahead of POLG,
    stimulated by SSBP1, within mitochondrial nucleoids.
  molecular_function:
    id: GO:0043139
    label: 5'-3' DNA helicase activity
  directly_involved_in:
  - id: GO:0006264
    label: mitochondrial DNA replication
  locations:
  - id: GO:0042645
    label: mitochondrial nucleoid
  supported_by:
  - reference_id: PMID:12975372
    supporting_text: TWINKLE is a DNA helicase with 5' to 3' directionality and distinct substrate requirements
  - reference_id: PMID:15167897
    supporting_text: Our findings provide the first biochemical evidence that TWINKLE is the helicase
      at the mitochondrial DNA replication fork.
  - reference_id: PMID:23393161
