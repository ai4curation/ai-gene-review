- term:
    id: GO:0006355
    label: regulation of DNA-templated transcription
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: Self-referential IBA recording a PAINT curator's judgement that transcriptional regulation
      is a core ARP8 function, corroborated by a Drosophila Arp8 IMP. The direction-neutral parent is
      the correct term because the INO80 complex both activates and represses.
    action: ACCEPT
    reason: 'The WITH/FROM list contains UniProtKB:Q9H981 itself, so this is a self-referential IBA
      and NO_FAILURE_CORE applies: a curator judged the function core for ACTR8 rather than inferring
      it from elsewhere. The non-self donor, Drosophila Arp8 (Q9VX09, Swiss-Prot), carries its own IMP
      to exactly this term from PMID:16618800, so ortholog-strength support is available and does not
      sit above the donor''s own granularity.


      No specificity upgrade is proposed, and this is a considered refusal rather than an omission.
      ACTR8 does carry its own IMP to the child GO:0045893 (positive regulation), which would normally
      invite a downward MODIFY. But the complex works in both directions: it activates oncogenic transcription
      at enhancers in NSCLC and it represses p21 through p53. GRANULARITY_MISMATCH requires the donors
      to agree, and here the target''s own data disagree with itself on sign, so the direction-neutral
      parent is the genuine least common ancestor and the signed child is the narrower, context-specific
      statement. Accepted as core; the signed child row is kept non-core.'
    supported_by:
    - reference_id: PMID:27641337
      supporting_text: It occupies enhancer regions near lung cancer-associated genes, and its occupancy
        correlates with increased genome accessibility and enhanced expression of downstream genes.
    - reference_id: PMID:26340092
      supporting_text: we first demonstrate that INO80 complex negatively regulates the p21Waf1/Cip1
        (p21) expression in a p53-mediated mechanism
