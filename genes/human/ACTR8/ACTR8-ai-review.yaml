    - reference_id: PMID:25299602
      supporting_text: The N-terminal extension of the human Arp8 is abundant in basic amino acids.
    - reference_id: PMID:22977180
      supporting_text: It is rather short in human Arp8 compared to yeast Arp8, but still comprises
        46 mostly charged residues
    - reference_id: file:interpro/panther/PTHR11937/PTHR11937-paint.tsv
      supporting_text: PTHR11937 PTN000234048 GO:0003729 F IBD false SGD:S000005667
    propagation_review:
