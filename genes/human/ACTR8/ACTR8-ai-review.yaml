      consistent with the withdrawal of the Swiss-Prot-keyword route (GO_REF:0000043) that also removed
      cell division, DNA recombination and DNA-templated transcription from this gene. The merged ACTR1A
      review independently documents the same pipeline retirement for its paralog, so this is a systematic
      gap rather than a per-gene oversight.'
