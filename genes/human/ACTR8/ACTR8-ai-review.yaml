      ssDNA, and requires its basic N-terminal residues 1-38 for the duplex interaction. Also established:
      against a 30-bp duplex in a fluorescence titration, human ARP8''s affinity is only micromolar
      (6938 +/- 3448 nM), and the substantial DNA binding of the reconstituted Arp8-Arp4-actin-HSA sub-complex
      (366 +/- 23 nM) was attributed mainly to the HSA/DBINO domain of INO80 with only a possible minor
      Arp8 contribution - and that sub-complex is the S. cerevisiae one, so it bounds the human claim
      only by analogy. In yeast, the Arp8 N-terminus together with the Arp4 C-terminus and the Ino80
      HSA domain binds extranucleosomal DNA 37-51 bp from the nucleosome edge and acts as a DNA-length
      sensor.'
    gap_kind:
    - BIOLOGY
    dark_aspect: MF_DARK
    significance: It decides whether human ARP8's DNA binding is a targeting activity in its own right
      or an accessory to the INO80 HSA/DBINO domain, and therefore whether a DNA-binding molecular function
      should be annotated to ARP8 or to the complex. The apparent conflict is probably a substrate-length
      artefact - 30 bp is too short to engage the extension the 2014 study showed to be required - but
      that reconciliation has never been tested directly.
    resolution: Measure human ARP8 affinity for a length series of duplex DNA (30, 50, 80, 150 bp) and
      for mononucleosomes with defined linker lengths, using both full-length and delta-1-38 protein,
      and repeat with and without ATP.
    provenance:
    - reference_id: PMID:22977180
      supporting_text: Both human and yeast Arp8 bind to DNA with low affinity in the micromolar range,
        while no interaction with DNA was observed for Arp4.
    - reference_id: PMID:22977180
      supporting_text: The sub-complex I on the other hand has substantial DNA-binding activity (366
        nM), which most likely is accounted for by the HSA/DBINO domain with a potential minor contribution
        of Arp8
    - reference_id: PMID:30120252
      supporting_text: We show that the N-terminus of Arp8, C-terminus of Arp4 and the HSA domain of
        Ino80 bind extranucleosomal DNA 37-51 base pairs from the edge of nucleosomes and function as
        a DNA-length sensor that regulates nucleosome sliding by INO80.
- description: 'An INO80-independent role on condensed mitotic chromosomes. hArp8, but not hArp5, accumulates
    on mitotic chromosomes, and both RNAi depletion of hArp8 and expression of truncated hArp8 misalign
    them. The controls are what make this a separate function rather than a complex function seen in
    mitosis: depletion of hIno80 and of hArp5 does not cause misalignment, and the ARP8-ACTR5 interaction
    is detectable in asynchronous interphase cells but not in metaphase-arrested cells, consistent with
    ARP8 acting outside an assembled INO80 complex at this stage. The molecular activity underlying
    it is unidentified; nucleosome binding is stated here as the activity ARP8 is known to have on chromatin,
    but molecular_function is deliberately left unset on this entry: naming nucleosome binding here
    would assert a mechanism for chromosome alignment that this same description disclaims, and the
    slot is optional on CoreFunction. The activity is a knowledge gap and is recorded as one below.'
  directly_involved_in:
