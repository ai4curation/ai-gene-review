description: 'ACTR8 encodes ARP8 (hArp8), a nuclear actin-related protein and subunit of the INO80 ATP-dependent
  chromatin-remodelling complex. Its 624-residue chain folds into a conserved actin core, resolved crystallographically
  at 2.6 A with ATP bound, but several long loop insertions wrap the fold and the filament interface
  is not preserved, so ARP8 cannot polymerise; it exists as a monomer in solution with a capacity for
  transient dimerisation. The nucleotide pocket is retained and functional: ARP8 hydrolyses ATP at a
  low basal rate, and nucleotide occupancy gates its nucleic-acid binding, with ATP - but not ADP -
  inhibiting DNA binding through the pocket residues Ser55, Thr56, Lys288 and Ser290. Within INO80,
  ARP8 associates with ARP4, nuclear actin and the HSA domain of the INO80 ATPase to form the module
  that recognises the nucleosome substrate: purified ARP8 binds intact nucleosomes and the H3-H4 histone
  tetramer with nanomolar affinity, strongly preferring both over the H2A-H2B dimer, and binds nucleosomes
  cooperatively. A basic, disordered N-terminal extension gives ARP8 direct nucleic-acid binding with
  a preference for single-stranded DNA over duplex, which matches the resected ends generated at DNA
  double-strand breaks; ARP8 is the INO80 subunit required for recruiting the mammalian complex to damage
  sites, and its phosphorylation by ATM and ATR loosens its association with INO80 and restrains excessive
  INO80 and RAD51 loading at breaks. Through the complex, ARP8 acts in transcriptional regulation in
  both directions, in recovery of stalled replication forks and replication elongation, and in homologous-recombination
  repair. ARP8 also has a function apparently separable from INO80: it accumulates on condensed mitotic
  chromosomes, where its loss misaligns them although loss of INO80 or ARP5 does not, and its interaction
  with ARP5 is lost in metaphase. The protein is broadly expressed, constitutively nuclear and nucleoplasmic,
  and is phosphorylated at Ser132 and Ser412.'
