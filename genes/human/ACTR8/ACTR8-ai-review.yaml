- id: file:human/ACTR8/ACTR8-deep-research-affinage.md
  title: Affinage mechanistic annotation for ACTR8 (human)
  reference_review:
    relevance: NONE
    correctness: LOW_QUALITY
    review_notes: 'Recorded so the provider gap is machine-readable, and cited by nothing in this review.
      The record is empty - n_discoveries 0, citation_count 0, no findings table, no citations, and no
      self_evaluation_pairwise score - so the trust gates were clear only because there was nothing
      to gate. That is a provider gap, not a literature gap: the UniProt RN list alone carries 13 references, including a 2.6 A crystal structure whose
      RP line reads FUNCTION, SUBUNIT, AND ATP-BINDING SITES, and this review rests on 20 primary papers.
      The file is deliberately not used as a supporting_text anywhere, because a provider''s silence
      is weaker evidence than a provider''s assertion, and the campaign has already been burned once
      by treating an empty provider record as a negative result. The consequence is that the best-practices
      warning ''No annotations reference available deep research files'' stands unresolved on this gene;
      silencing it would require citing an empty file as if it said something. On the enum value: LOW_QUALITY
      is defined as ''correctly cited but methodologically weak'', and its ''correctly cited'' half
      is vacuous here because nothing cites the file. It is used as the nearest available fit for a
      machine-generated record that returned nothing on a gene with 13 UniProt references; the alternatives
      are worse, since UNVERIFIED would imply the record was never examined and VERIFIED would imply
      there was something to verify.'
