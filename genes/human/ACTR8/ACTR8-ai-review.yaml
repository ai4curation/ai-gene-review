existing_annotations:
- term:
    id: GO:0003729
    label: mRNA binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: A single yeast RIP-chip result propagated as a molecular function to 87 ARP8 orthologues
      across all eukaryotes. The donor annotation is genuine, but the assay cannot separate mRNA binding
      from the general single-stranded nucleic-acid binding that human ARP8 is actually characterised
      for, and the binding element it depends on differs in length between yeast and human.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'Resolving the donors and then querying their own evidence shows this row is not the family-level
      guess it first appears to be, and the obvious dismissal is wrong. The committed PAINT file records
      GO:0003729 as IBD from SGD:S000005667 alone, added 2025-08-05 - but a single donor is not by itself
      the objection, and claiming otherwise would contradict this review''s own GO:0006302 row. Donor
      counts at PTN000234048 are GO:0031011 four, GO:0006355 two, and GO:0003729 and GO:0006302 one
      each - and GO:0006302 is accepted here. What separates them is target-side evidence: human ARP8
      has direct experimental data for a role in double-strand break repair and none whatever for RNA
      binding. That is the criterion this review applies throughout. The donor, Saccharomyces cerevisiae
      ARP8 (Q12386, Swiss-Prot), does carry its own IDA, from PMID:20844764, and yeast ARP8 is in that
      paper''s *confirmed* set rather than among its unvalidated candidates: it appears in the table
      of novel RBPs confirmed by IP-microarray, with 231 targets at FDR <= 0.01 % - the Methods define
      the cut-off as a SAM-calculated false discovery rate less than or equal to 0.01 %, so it is 100-fold
      stricter than a bare 0.01 would suggest - at a point where only 12 of 35 candidates survived validation.
      So SOURCE_EVIDENCE_WEAK would be factually contradicted by my own analysis; the source annotation
      is sound.


      The propagation is what fails, on three grounds. (1) One donor and one study support a molecular-function
      term that now sits on all 87 members of the node, spanning plants, fungi, metazoa, Giardia and
      Paramecium, and no member outside S. cerevisiae has ever been assayed for it. (2) The screen design
      cannot distinguish the ligand class: the primary assay bound RNA samples to protein microarrays,
      with no DNA competitor anywhere in the design, so for a protein whose nucleic-acid-binding element
      is a basic disordered N-terminal extension and whose demonstrated preference is for single-stranded
      nucleic acid, ''binds mRNA'' and ''binds single-stranded polyanion'' are not separable by this
      experiment. Human ARP8''s characterised nucleic-acid ligands are ssDNA (preferentially) and dsDNA;
      no one has assayed human ARP8 with RNA at all. (3) The binding element is not conserved in size
      between donor and target - but this ground is weaker than it first looks, and is reported at its
      true strength. Reading the sentence to the end of its qualifying clause, PMID:22977180 says the
      N-terminal extension is rather short in human Arp8 compared to yeast Arp8 *but still comprises
      46 mostly charged residues*. So the human protein retains a substantial basic extension; the size
      asymmetry (yeast 881 aa against human 624 aa, much of the difference in this region) makes the
      transfer less safe without making it impossible. Grounds (1) and (2) carry the argument; (3) only
      supports it.


      MARK_AS_OVER_ANNOTATED rather than REMOVE, deliberately. REMOVE needs a positive argument and
      I have none: there is no human negative, only an absence of human RNA data, and an absence is
      not a finding. The right classification is PROPAGATION_BAD - the source annotation is sound but
      the term should not propagate to this target - which is what this reason argues, and it is why
      SOURCE_EVIDENCE_WEAK is deliberately absent from failure_modes. GRANULARITY_MISMATCH is used in
      the second sense its definition allows, child term overstates specificity: the donor''s own term
      names a ligand class its assay did not discriminate. It is not used in the parent-true-but-uninformative
      sense, and FUNCTIONAL_DIVERGENCE is deliberately not claimed, because a change of ligand class
      in the human protein has not been demonstrated - only that its characterised ligand is a different
      one. Recommendation for PAINT: restrict GO:0003729 to the S. cerevisiae leaf until an orthologue
      outside yeast has been assayed with RNA against a DNA competitor.'
    supported_by:
    - reference_id: PMID:20844764
      supporting_text: Novel RBPs identified in the protein microarray experiments and confirmed by
        IP-microarray experiments.
    - reference_id: PMID:20844764
