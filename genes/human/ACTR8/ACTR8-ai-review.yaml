    supporting_text: Here we report that hArp8, but not hArp5, accumulates on mitotic chromosomes.
  - reference_id: PMID:18163988
    supporting_text: Expression of truncated hArp8 proteins and depletion of endogenous hArp8 by RNA
      interference caused misalignment of mitotic chromosomes, suggesting that chromosome-associated
      hArp8 has a role in chromosome behavior.
  - reference_id: PMID:18163988
    supporting_text: In contrast, depletion of hIno80 and hArp5 did not cause misalignment of chromosomes,
      suggesting that the role of hArp8 at mitotic chromosomes is independent of the activity of hINO80
      complexes.
  knowledge_gaps:
  - gap_statement: The molecular activity by which ARP8 supports mitotic chromosome alignment is unknown,
      and so is what ARP8 is bound to on a mitotic chromosome, where nucleosomes are compacted and INO80
      is apparently not assembled with it.
    boundary: 'Established: hArp8 accumulates on mitotic chromosomes, its depletion or truncation misaligns
      them, hIno80 and hArp5 depletion do not, and the ARP8-ACTR5 interaction is lost in metaphase-arrested
      cells. Also established: ARP8 binds nucleosomes and (H3-H4)2 tetramers with nanomolar affinity
      and single-stranded DNA preferentially, and is phosphorylated at Ser412 in mitotic phosphoproteomes.
      Not established: any mitotic partner, any spindle or kinetochore association, or whether the mitotic
      pool binds chromatin through the same surface used within INO80.'
    gap_kind:
    - BIOLOGY
    dark_aspect: MF_DARK
    significance: 'Complex-independent activity is rarely reported for a nuclear actin-related protein,
      and this is one of the few instances with genetic controls behind the claim, so its mechanism
      would speak to whether nuclear ARPs have autonomous chromatin activities at all or only complex-borne
      ones. Stated as rare rather than unique: a negative over the whole nuclear-ARP literature is not
      something this review has established. It is also the one ARP8 function with no representation
      at all in the current GO annotation set.'
    resolution: Identify the mitotic ARP8 interactome by proximity labelling in nocodazole-arrested
      cells, and test whether the Ser412 phosphosite or the N-terminal extension is required for mitotic
      chromosome loading and for rescue of the alignment defect.
    provenance:
