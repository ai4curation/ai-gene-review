      supporting_text: In contrast, depletion of hIno80 and hArp5 did not cause misalignment of chromosomes,
        suggesting that the role of hArp8 at mitotic chromosomes is independent of the activity of hINO80
        complexes.
    - reference_id: PMID:18163988
      supporting_text: These findings provide the first insight into a novel function of actin family
        members in mitosis.
suggested_questions:
- question: GOA's entire molecular-function record for ACTR8 is six protein binding rows plus one cross-kingdom
    mRNA binding inference, and an explicit QuickGO query for GO:0005524 with goUsage=descendants returns
    zero - even though ATP is resolved in the human crystal structure PDB 4FO0, UniProt annotates the
    binding residues without a similarity tag, and the DR block still carries GO:0005524 as IEA:UniProtKB-KW.
    Should the withdrawal of Swiss-Prot-keyword-derived annotations (GO_REF:0000043) be accompanied
    by a sweep for cases like this, where the withdrawn keyword term was the only representation of
    a fact that has direct structural evidence behind it? For ACTR8 the same withdrawal also removed
    cell division, DNA recombination and DNA-templated transcription.
  experts:
  - Karl-Peter Hopfner
  - Christian B Gerhold
- question: Wherever ComplexPortal projects a complex-level phenotype to every subunit, Ensembl Compara
    (GO_REF:0000107) then multiplies it by the number of species with 1:1 orthologues, and the complex
    context is lost in the second step. For CPX-878 and PMID:23979016 that is 15 mouse subunits x 5
    terms, giving human ACTR8 five rows - including regulation of embryonic development and positive
    regulation of telomere maintenance in response to DNA damage - from an Ino80 conditional knockout
    in which Actr8 was never manipulated, and the same five rows land on the other 14 human INO80 subunits
    by the same route. Should the Compara transfer pipeline skip source annotations whose assignedBy
    is ComplexPortal, or should such transfers be re-issued with the complex rather than the subunit
    as the annotation subject?
  experts: []
- question: GO:0003729 mRNA binding was placed at PANTHER node PTN000234048 on 2025-08-05 from a single
    donor - S. cerevisiae ARP8 - and now sits on all 87 ARP8 orthologues in that node, across plants,
    fungi, metazoa, Giardia and Paramecium. The donor evidence is a genuine RIP-chip validation, but
    the screen bound RNA to protein microarrays with no DNA competitor, and the ARP8 element that binds
    nucleic acid is a basic disordered N-terminal extension that is considerably shorter in human than
    in yeast. Should a single-donor MF placed at a pan-eukaryotic node require either a second organism
    or an assay that discriminates the ligand class before it propagates?
  experts:
  - Masahiko Harata
  - Hitoshi Kurumizaka
- question: PAINT has an explicit IRD (NOT) annotation blocking GO:0005200 structural constituent of
    cytoskeleton at the ARP8 node PTN000234048, and this is exactly right - the human crystal structure
    shows loop insertions that explain ARP8's inability to polymerise. Eight such IRD blocks exist across
    PTHR11937. Yet in the same family, ACTL8 sits under the narrow beta/gamma-actin nodes PTN002631586
    and PTN007551913 at roughly 34 percent identity and inherits beta-actin's specific cell biology,
    and ACTL7A and ACTL7B each needed a GO:0005200 row removed by hand. Could the ARP8 node serve as
    the template - i.e. can the IRD discipline applied here be extended to the divergent actin-like
    nodes that currently lack it?
  experts: []
- question: 'ACTR8 has a reported function that is apparently independent of its complex: hArp8 accumulates
    on mitotic chromosomes and its depletion misaligns them, while depletion of hIno80 or hArp5 does
    not, and the ARP8-ACTR5 interaction is undetectable in metaphase-arrested cells. GO currently represents
    none of this on ACTR8. Is GO:0007080 mitotic metaphase chromosome alignment with an IMP from PMID:18163988
    the right representation, and should the mitotic pool be captured as GO:0000793 condensed chromosome
    in addition to the existing general GO:0005694 chromosome row rather than replacing it?'
  experts:
  - Masahiko Harata
- question: Human ARP8 has a measured low basal ATPase activity on the purified protein, but the same
    paper reports that none of H2A-H2B, (H3-H4)2, DNA or nucleosomes stimulates or inhibits it, and
    describes ARP8 as an extremely weak ATPase in the monomeric state; the residues that trigger hydrolysis
    in actin (Gln137, His73) are substituted (Glu266, Arg187) in ARP8. Should GO:0016887 ATP hydrolysis
    activity be annotated on a measured but physiologically unassigned trace activity, or held back
    until a stimulating partner is found? This review deliberately proposes GO:0005524 ATP binding and
    not GO:0016887.
  experts:
  - Karl-Peter Hopfner
suggested_experiments:
- hypothesis: Human ARP8's apparent mRNA binding, inherited from yeast by IBA, reflects non-selective
    binding of single-stranded polyanions by its basic N-terminal extension rather than a preference
    for RNA.
  description: Perform competition binding on recombinant full-length human ARP8 and the delta-1-38
    mutant with matched-length ssRNA, ssDNA and dsDNA probes present simultaneously, reading out by
    fluorescence anisotropy and by gel shift, in the presence and absence of ATP. A genuine mRNA-binding
    activity should show ssRNA outcompeting ssDNA; a polyanion-binding artefact should show ssDNA at
    least as competitive and both losses in delta-1-38. Run yeast ARP8 alongside as the donor control,
    since the extension is longer there. This directly tests the propagation objection raised against
    the GO:0003729 row, and its outcome would either justify a human IDA or justify restricting the
    term to the yeast leaf.
  experiment_type: competition nucleic-acid binding assay (fluorescence anisotropy and EMSA)
- hypothesis: 'The two disagreeing measurements of human ARP8 DNA affinity are reconciled by substrate
    length: a 30-bp duplex is too short to engage the basic N-terminal extension that long DNA requires.'
  description: Measure Kd for recombinant full-length human ARP8 and delta-1-38 against a duplex length
    series (20, 30, 50, 80, 150 bp) and against mononucleosomes assembled with 0, 20, 40 and 80 bp of
    linker DNA, using the same fluorescence titration method as the 2012 study so the numbers are directly
    comparable. Repeat with and without 1 mM ATP. The prediction is a sharp affinity gain above roughly
    40 bp that is abolished in delta-1-38, which would both explain the micromolar 30-bp value and test
    whether the yeast linker-length-sensor behaviour holds for human ARP8.
  experiment_type: quantitative DNA and nucleosome binding titration series
- hypothesis: ARP8's mitotic chromosome-alignment function is carried out outside the INO80 complex
    and depends on the same N-terminal extension that mediates its nucleic-acid binding.
  description: In nocodazole-arrested human cells, map the mitotic ARP8 interactome by proximity labelling
    and compare it with the interphase interactome, testing whether INO80 subunits are depleted from
    the mitotic set as the loss of the ARP8-ACTR5 co-IP in metaphase predicts. In parallel, complement
    an ARP8 knockout with full-length, delta-1-38, and Ser412 phospho-null and phospho-mimetic constructs
    and score mitotic chromosome alignment and chromosome loading by live imaging. This would identify
    the molecular activity behind the one ARP8 function that GO does not currently represent.
  experiment_type: proximity-labelling proteomics plus structure-function complementation
- hypothesis: ARP8's low basal ATPase is stimulated by a partner binding at the conserved target-binding
    cleft, which would make ATP hydrolysis a genuine regulated activity rather than a trace one.
  description: Screen for ATPase stimulation of purified human ARP8 by the INO80 subunits not tested
    in the original work - the HSA/post-HSA region, ARP4, nuclear actin, ACTR5, YY1 - and by H2A.Z-containing
    nucleosomes, using the same radiometric 32P assay so results are comparable to the published null.
    Include the E266A mutant, the predicted substitute for actin's catalytic Gln137, as the mechanistic
    control. A reproducible stimulation would justify annotating GO:0016887 to ACTR8; a second null
    would settle that the nucleotide is structural and regulatory rather than catalytic, which is the
    position this review takes provisionally.
  experiment_type: radiometric ATPase assay with candidate activators
