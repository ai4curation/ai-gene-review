    reason: 'This is the activity the gene is characterised for and it is entirely absent from GOA.
      Quantitative fluorescence titrations on full-length human ARP8 and on the delta-1-33 crystallisation
      construct give closely similar affinities for a 207-bp nucleosome, 51.0 +/- 9.6 nM and 62.6 +/-
      16 nM. The qualifier is enables rather than contributes_to because the measurement was made on
      human ARP8 alone, so it independently possesses the activity - the schema reserves contributes_to
      for subunits that do not.


      Two things this row deliberately does NOT claim, because PMID:22977180''s Table 2 mixes species
      and the paper separates them explicitly, assaying full-length and N-terminally truncated human
      Arp8 as well as yeast Arp8, Arp4 and the Arp8-Arp4-actin-HSA sub-complex. First, no fractional
      attribution of the module''s affinity to ARP8. The Arp8-Arp4-actin-HSA sub-complex measured at
      63.6 +/- 6.2 nM is the S. cerevisiae one, so setting it beside the 51 nM human figure would be
      a cross-species comparison; matched within yeast the comparison inverts, because ScArp8 alone
      binds the same 207-bp nucleosome at 314 +/- 35 nM, i.e. the module binds roughly 5-fold tighter
      than ScArp8 alone. ARP8''s fractional contribution therefore cannot be derived from these data,
      and the defensible statement is the authors'' own hedged one, that the contribution is significant.
      Second, cooperativity is not leaned on: human full-length ARP8 gives a Hill coefficient of 1.31
      +/- 0.4 for the nucleosome, which overlaps 1, and the unambiguous values are the delta-1-33 construct
      at 2.11 +/- 0.4 and the yeast sub-complex at 3.13 +/- 0.7. The paper does state cooperative binding
      of more than one Arp8 per nucleosome and that is quoted, but this term rests on the affinity,
      not on the Hill coefficient.


