- term:
    id: GO:0042867
    label: pyruvate catabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  review:
    summary: Electronic transfer of a pyruvate catabolic process term from an ortholog.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Fails the participation test. MCT4 transports pyruvate across the membrane but catalyzes no step
      of pyruvate breakdown; being a transporter of a metabolite is not participating in its catabolism
      (the catabolic enzymes perform those steps). The claim rests only on orthology-based electronic
      transfer. Over-annotation.
- term:
    id: GO:0050833
    label: pyruvate transmembrane transporter activity
  evidence_type: IDA
  original_reference_id: PMID:31719150
  qualifier: enables
  review:
    summary: Direct experimental pyruvate transporter activity (revised high-affinity view).
    action: KEEP_AS_NON_CORE
    reason: >-
      Pyruvate is a genuine, physiologically relevant substrate of MCT4 (Km ~4.2 mM), directly
      measured. However L-lactate is the primary/core substrate and the defining physiological role is
      lactate efflux; pyruvate transport is a real secondary activity, kept as non-core.
