- term:
    id: GO:0003723
    label: RNA binding
  evidence_type: HDA
  original_reference_id: PMID:22658674
  qualifier: enables
  review:
    summary: High-throughput mRNA-interactome capture hit on a membrane transporter.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Single HDA row from a global mRNA-binding proteome atlas (PMID:22658674). MCT4 is a polytopic
      plasma-membrane monocarboxylate transporter with no described RNA-binding function, and
      RNA-binding hits on membrane transporters are frequent non-specific captures in interactome-wide
      datasets. Not a core function; treated as over-annotation.
