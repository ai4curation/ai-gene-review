proposed_new_terms: []
suggested_questions:
- question: >-
    What is the physiological transport stoichiometry and electrogenicity of human MCT4 in its
    BSG-bound state across the full pathophysiological lactate concentration range, and how does BSG
    binding modulate its kinetics?
- question: >-
    How is MCT4 cell-surface abundance coordinated with HIF-1alpha-driven glycolytic reprogramming,
    and which post-translational modifications (e.g. the mapped C-terminal phosphosites) regulate its
    trafficking and stability?
suggested_experiments:
- description: >-
    Reconstitute human MCT4 with and without BSG/CD147 in a defined system (proteoliposomes or
    surface-expression-matched cells) and measure H+:lactate coupling ratio, electrogenicity and
    substrate selectivity (lactate, pyruvate, ketone bodies) to establish the native transport
    mechanism and the BSG contribution to catalysis versus trafficking.
- description: >-
    Cryo-EM of the human MCT4-BSG complex to define the ancillary-subunit interface and the
    substrate/proton translocation pathway, including the role of Arg-278.
