- id: PMID:10921872
  title: CD147 is tightly associated with lactate transporters MCT1 and MCT4 and facilitates
    their cell surface expression.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full-text verified. Establishes the obligate BSG/CD147 ancillary-subunit partnership: CD147
      co-immunoprecipitates and cross-links with MCT1 and MCT4 (not MCT2) and is required for their
      surface expression and activity. Basis for the complex-membership modeling and the BSG
      protein-binding row.
- id: PMID:11101640
  title: Characterisation of human monocarboxylate transporter 4 substantiates its
    role in lactic acid efflux from skeletal muscle.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract-only in cache. Direct oocyte characterization of human MCT4 as the proton-linked
      lactate transporter of white muscle responsible for glycolytic lactic-acid efflux; source of
      the IDA lactate:proton symporter and lactate-transport annotations. Km values here were later
      revised (see PMID:31719150).
- id: PMID:15505343
  title: Presence and localization of three lactic acid transporters (MCT1, -2, and
    -4) in separated human granulocytes, lymphocytes, and monocytes.
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Plasmalemmal localization of MCT4 in human leukocyte fractions by IHC/Western; supports the
      plasma-membrane location.
- id: PMID:21199217
  title: Basolateral sorting signals regulating tissue-specific polarity of heteromeric
    monocarboxylate transporters in epithelia.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full-text verified. Identifies strong redundant basolateral sorting signals in the MCT4
      C-terminal tail and confirms MCT1/MCT3/MCT4 form a heterodimeric complex with CD147; basis for
      basolateral localization annotation and complex membership.
- id: PMID:22658674
  title: Insights into RNA biology from an atlas of mammalian mRNA-binding proteins.
  findings: []
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      High-throughput mRNA-interactome capture atlas. The HDA RNA-binding hit on this polytopic
      membrane transporter is a non-specific capture; no described RNA-binding function for MCT4.
- id: PMID:23935841
  title: Crucial residue involved in L-lactate recognition by human monocarboxylate
    transporter 4 (hMCT4).
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full-text verified. Direct oocyte transport assays, pH-dependence (proton coupling) and
      mutagenesis showing Arg-278 (TMD8) is essential for L-lactate recognition; plasma-membrane
      localization (EXP).
- id: PMID:25416956
  title: A proteome-scale map of the human interactome network.
  findings: []
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Large-scale binary interactome (HuRI) screen; yields only bare protein-binding rows that are
      uninformative on their own.
- id: PMID:26854723
  title: Butyric acid increases transepithelial transport of ferulic acid through
    upregulation of the monocarboxylate transporters SLC16A1 (MCT1) and SLC16A3 (MCT4).
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full-text verified. MCT4 detected specifically in the lateral plasma membrane of Caco-2
      enterocytes, acting as a basolateral efflux route for monocarboxylates; supports lateral PM
      localization.
- id: PMID:28112518
  title: LC-MS/MS Based Quantitation of ABC and SLC Transporter Proteins in Plasma
    Membranes of Cultured Primary Human Retinal Pigment Epithelium Cells and Immortalized
    ARPE19 Cell Line.
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Targeted proteomic quantitation of MCT4 in plasma-membrane fractions of human RPE cells;
      supports the plasma-membrane location (IDA).
- id: PMID:30126976
  title: Proteome-wide analysis of phospho-regulated PDZ domain interactions.
  findings: []
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Phospho-PDZ interactome screen; bare protein-binding rows reflecting the MCT4 C-terminal
