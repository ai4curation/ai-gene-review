- id: PMID:31719150
  title: Monocarboxylate transporter 4 (MCT4) is a high affinity transporter capable
    of exporting lactate in high-lactate microenvironments.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract-only in cache. FRET-sensor measurements showing MCT4 is actually a high-affinity
      lactate transporter (Km ~0.7-1.7 mM) with physiologically relevant pyruvate affinity (Km ~4.2
      mM); revises the earlier low-affinity view. Source of the IDA pyruvate transport annotations.
- id: PMID:31791063
  title: 'Quantitative Protein Expression in the Human Retinal Pigment Epithelium:
    Comparison Between Apical and Basolateral Plasma Membranes With Emphasis on Transporters.'
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Quantitative proteomics of apical vs basolateral RPE membranes detecting MCT4; supports the
      basolateral (canonical) and apical (context-specific) plasma-membrane localizations.
