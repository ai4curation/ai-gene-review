id: O15427
gene_symbol: SLC16A3
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  SLC16A3 encodes monocarboxylate transporter 4 (MCT4), a proton-coupled, low-affinity-for-pyruvate
  but physiologically high-capacity L-lactate efflux transporter of the plasma membrane and a member
  of the major facilitator superfamily (SLC16/MCT family). MCT4 catalyzes electroneutral 1:1
  H+:monocarboxylate symport, using the transmembrane proton gradient to export L-lactate (its primary
  substrate), and secondarily pyruvate and ketone bodies, from the cytosol. It is the dominant MCT
  isoform of highly glycolytic cells - white skeletal muscle, astrocytes, white blood cells,
  chondrocytes, placenta and many tumors - where it removes glycolytically produced lactic acid and
  so maintains intracellular pH and glycolytic flux (Warburg effect). MCT4 is a multi-pass membrane
  protein (12 transmembrane helices) that requires the single-span glycoprotein BSG (basigin/CD147)
  as an obligate ancillary subunit for plasma-membrane trafficking and activity, with which it forms
  a heterodimeric plasma-membrane transporter complex. In polarized epithelia it is sorted
  basolaterally by signals in its C-terminal cytoplasmic tail. MCT4 expression is induced by hypoxia
  through a HIF-1alpha-dependent mechanism.
