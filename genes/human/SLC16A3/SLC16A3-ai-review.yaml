- term:
    id: GO:1902495
    label: transmembrane transporter complex
  evidence_type: IDA
  original_reference_id: PMID:10921872
  qualifier: part_of
  review:
    summary: >-
      NEW. MCT4 is part of a heterodimeric plasma-membrane transporter complex with its obligate
      ancillary subunit BSG/CD147.
    action: NEW
    reason: >-
      Captures the functionally meaningful BSG/CD147 partnership (removed as a bare protein-binding
      row) as complex membership, analogous to the B0AT1/ACE2 modeling in batch 10. MCT4 requires
      CD147 for plasma-membrane trafficking and activity and the two remain tightly bound at the cell
      surface, forming a heterodimeric transporter complex (also stated by PMID:21199217 and Reactome
      R-HSA-204392). QuickGO confirms GO:1902495 is a cellular-component complex term (a transmembrane
      protein complex enabling transfer across a membrane); there is no more specific
      monocarboxylate-transporter-complex term, so GO:1902495 is the most specific available.
    supported_by:
    - reference_id: PMID:10921872
      supporting_text: CD147 facilitates proper expression of MCT1 and MCT4 at the cell surface, where
        they remain tightly bound to each other
    - reference_id: PMID:21199217
      supporting_text: MCT1, MCT3, and MCT4 form a heterodimeric complex with CD147
core_functions:
- description: >-
    Proton-coupled (H+-symport, electroneutral 1:1) transmembrane transport of L-lactate across the
    plasma membrane, driven by the transmembrane proton gradient, mediating efflux of glycolytically
    produced lactate from highly glycolytic cells. Arg-278 (TMD8) is essential for substrate
    recognition.
