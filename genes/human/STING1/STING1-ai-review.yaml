- term:
    id: GO:0000045
    label: autophagosome assembly
  evidence_type: IDA
  original_reference_id: PMID:30568238
  qualifier: involved_in
  review:
    action: ACCEPT
    summary: STING1-containing ERGIC membrane serves as the source for LC3 lipidation and autophagosome
      biogenesis.
    reason: 'Supported by three independent IDA rows plus an IBA, and mechanistically explained:
      the process is independent of TBK1 and of interferon induction, so it is a real second function
      rather than a downstream effect of interferon.'
    supported_by:
    - reference_id: PMID:30842662
      supporting_text: Here we report that STING also activates autophagy through a mechanism that
        is independent of TBK1 activation and interferon induction.
    - reference_id: PMID:30842662
      supporting_text: Upon binding cGAMP, STING translocates to the endoplasmic reticulum-Golgi
        intermediate compartment (ERGIC) and the Golgi in a process that is dependent on the COP-II
        complex and ARF GTPases. STING-containing ERGIC serves as a membrane source for LC3 lipidation,
        which is a key step in autophagosome biogenesis.
