- term:
    id: GO:0005789
    label: endoplasmic reticulum membrane
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  review:
    action: ACCEPT
    summary: The endoplasmic reticulum membrane is where resting STING1 resides and where it is activated
      by cGAMP before ER exit.
    reason: Core location, with twenty-seven rows spanning experimental, phylogenetic, electronic
      and Reactome sources across two decades. STING1 is a polytopic ER membrane protein with four
      transmembrane helices.
    supported_by:
    - reference_id: PMID:30842659
      supporting_text: STING is an endoplasmic-reticulum membrane protein that contains four transmembrane
        helices followed by a cytoplasmic ligand-binding and signalling domain
    - reference_id: PMID:41639452
      supporting_text: STING is an endoplasmic reticulum (ER) membrane protein comprising four transmembrane
        (TM) helices forming the TM domain (TMD), a cytoplasmic ligand-binding domain (LBD) responsible
        for cGAMP binding, and a C-terminal tail containing both the phosphorylation site (Ser366)
        and the PXPLRXD
- term:
    id: GO:0045087
    label: innate immune response
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    action: ACCEPT
    summary: STING1 is a central node of the innate immune response to cytosolic DNA and bacterial
      cyclic dinucleotides.
    reason: 'Correct though general. Retained as-is: the IBA row rests on a phylogenetic judgement
      across the STING family that I did not re-examine, and the more specific terms the gene carries
      (cGAS/STING signalling pathway, antiviral and antibacterial innate immune response) already
      supply the detail.'
- term:
    id: GO:0016239
    label: positive regulation of macroautophagy
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    action: ACCEPT
    summary: Activated STING1 positively regulates macroautophagy, through both its trafficking and
      its proton channel.
    reason: Well supported experimentally and phylogenetically. The proton-channel work supplies
      the molecular mechanism (H+ efflux promoting LC3B/GABARAP lipidation), which makes this annotation
      mechanistically coherent rather than merely correlative.
    supported_by:
    - reference_id: PMID:30842662
      supporting_text: Here we report that STING also activates autophagy through a mechanism that
        is independent of TBK1 activation and interferon induction.
    - reference_id: PMID:37535724
      supporting_text: STING-induced LC3B lipidation and inflammasome activation were also inhibited
        by C53, suggesting that STING's channel activity is critical for these two processes.
- term:
    id: GO:0061507
    label: 2',3'-cyclic GMP-AMP binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    action: ACCEPT
    summary: STING1 binds 2'3'-cGAMP, the cGAS second messenger, with high affinity; this is the
      receptor event that starts the pathway.
    reason: Core molecular function, established by direct binding and co-crystal structure and independently
      reproduced. The IBA row is consistent with the experimental rows on the gene itself.
    supported_by:
    - reference_id: PMID:23747010
      supporting_text: This molecule, termed 2'3'-cGAMP, is unique in that it binds to the adaptor
        protein STING with a much greater affinity than cGAMP molecules containing other combinations
        of phosphodiester linkages.
- term:
