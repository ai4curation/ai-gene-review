- term:
    id: GO:0015485
    label: cholesterol binding
  evidence_type: IDA
  original_reference_id: PMID:41639452
  qualifier: enables
  review:
    action: ACCEPT
    summary: STING1 binds cholesterol at the same dimer-dimer interface that binds phosphoinositide,
      and the two lipids act cooperatively to stabilise the oligomer.
    reason: 'Interesting alongside the companion phosphoinositide paper, and consistent with it rather
      than duplicating it: cholesterol and PtdInsP occupy adjacent positions in the cryo-EM maps,
      the S80I and W82Q mutants selectively lose cholesterol binding and lose cGAMP-induced phosphorylation
      of STING, TBK1 and IRF3, and a cholesterol-like density was present at the same site in the
      authors'' earlier PIP-free structure. Unlike the phosphoinositide claim, a role for cholesterol
      in STING activation had been reported by other groups beforehand, which strengthens it. Same
      single-programme caveat applies to the direct-binding demonstration itself.'
    supported_by:
    - reference_id: PMID:41639452
      supporting_text: Our results show that STING wild type (WT) binds to most PIP lipids, cholesterol
        and its derivatives, but not several other types of lipids such as non-phosphorylated phosphatidylinositol
        (PI), phosphatidylethanolamine (PE) and phosphatidylserine (PS).
    - reference_id: PMID:41639452
      supporting_text: Our cell-based functional assay revealed that mutations to residues involved
        in the interactions with PIPs and cholesterol, including R71H, K20E/R71H, S80I and W82Q,
        substantially reduced phosphorylation of STING, TBK1 and IRF3 triggered by cGAMP
    - reference_id: PMID:41639452
      supporting_text: supporting previous studies that cholesterol plays a role in STING activation
        and regulation
