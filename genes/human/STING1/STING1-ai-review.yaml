- term:
    id: GO:0015252
    label: proton channel activity
  evidence_type: IDA
  original_reference_id: PMID:37535724
  qualifier: enables
  review:
    action: ACCEPT
    summary: 'STING1 is a proton channel: its transmembrane domain conducts protons and deacidifies
      the Golgi, driving an output branch that is separable from interferon induction.'
    reason: Scrutinised because a proton channel is a non-obvious assignment for an ER adaptor, and
      it holds. The founding study reconstituted purified STING into liposomes and measured transmembrane
      proton transport, with the agonist C53 (which binds the channel interface) blocking flux -
      so the conductance is a property of the protein, not an indirect cellular readout. It has since
      been used and required by at least three further independent laboratories (Tan lab, PMID:39423796;
      Miner lab, PMID:39947179; Yan lab, PMID:40185098) and the channel has become a small-molecule
      binding site. No refutation was found on PubMed search. Treated as a second core molecular
      function, distinct from the adaptor activity. Note the contrast with TMEM175, where the proton-channel
      claim genuinely is contested; here it is not.
    supported_by:
    - reference_id: PMID:37535724
      supporting_text: On the basis of structural analysis, we hypothesized that human STING is a
        proton channel. Indeed, we found that STING activation induced a pH increase in the Golgi
        and that STING reconstituted in liposomes enabled transmembrane proton transport.
    - reference_id: PMID:37535724
      supporting_text: STING-induced LC3B lipidation and inflammasome activation were also inhibited
        by C53, suggesting that STING's channel activity is critical for these two processes.
    - reference_id: PMID:39423796
      supporting_text: STING-mediated TFEB activation is independent of TBK1, but it requires STING
        trafficking and its conserved proton channel.
    - reference_id: PMID:39947179
      supporting_text: Recent discoveries revealed that STING also functions as a proton channel
        that deacidifies the Golgi apparatus.
    - reference_id: PMID:40185098
      supporting_text: This process requires STING's proton channel function, the V-ATPase-ATG5-ATG8
        cascade, and is independent of immune signaling.
    - reference_id: PMID:42336656
      supporting_text: The allosteric binding site lies within a hydrophobic transmembrane proton
        channel formed by intertwined helices of two STING monomers.
