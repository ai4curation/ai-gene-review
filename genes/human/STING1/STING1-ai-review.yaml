- term:
    id: GO:0016239
    label: positive regulation of macroautophagy
  evidence_type: IDA
  original_reference_id: PMID:30568238
  qualifier: involved_in
  review:
    action: ACCEPT
    summary: Activated STING1 positively regulates macroautophagy, through both its trafficking and
      its proton channel.
    reason: Well supported experimentally and phylogenetically. The proton-channel work supplies
      the molecular mechanism (H+ efflux promoting LC3B/GABARAP lipidation), which makes this annotation
      mechanistically coherent rather than merely correlative.
    supported_by:
    - reference_id: PMID:30842662
      supporting_text: Here we report that STING also activates autophagy through a mechanism that
        is independent of TBK1 activation and interferon induction.
    - reference_id: PMID:37535724
      supporting_text: STING-induced LC3B lipidation and inflammasome activation were also inhibited
        by C53, suggesting that STING's channel activity is critical for these two processes.
