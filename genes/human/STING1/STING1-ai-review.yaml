- term:
    id: GO:0035438
    label: cyclic-di-GMP binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: enables
  review:
    action: ACCEPT
    summary: STING1 binds bacterial cyclic di-GMP directly, acting as a sensor for bacterial cyclic
      dinucleotides as well as for host cGAMP.
    reason: Core molecular function. Direct radioligand binding with competition by unlabelled cyclic
      dinucleotides but not by other nucleotides, plus mutations that selectively impair the cyclic-dinucleotide
      response. This is the activity that grounds the antibacterial innate immune annotations.
    supported_by:
    - reference_id: PMID:21947006
      supporting_text: We demonstrate that STING binds directly to radiolabelled cyclic diguanylate
        monophosphate (c-di-GMP), and we show that unlabelled cyclic dinucleotides, but not other
        nucleotides or nucleic acids, compete with c-di-GMP for binding to STING.
- term:
    id: GO:0043123
    label: positive regulation of canonical NF-kappaB signal transduction
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  review:
    action: ACCEPT
    summary: STING1 activates canonical NF-kB signalling as a genuine second transcriptional output,
      separable from the interferon arm.
    reason: Core biological process. Seven independent experimental rows, and recent work localises
      this branch to post-Golgi endolysosomal compartments and shows it can operate independently
      of type I interferon signalling - so it is not simply a downstream consequence of interferon
      induction.
    supported_by:
    - reference_id: PMID:40973797
      supporting_text: Here we report that STING activates NF-κB in a delayed manner, following exit
        from the Golgi to endolysosomal compartments.
    - reference_id: PMID:40973797
      supporting_text: IRF3 engagement with STING pS358 induces trafficking to late endolysosomal
        compartments, supporting recruitment of TRAF6 and activation of NF-κB.
