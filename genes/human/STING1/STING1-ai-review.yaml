      supporting_text: Stimulator of interferon genes (STING) activation requires coat protein complex
        II (COPII)-mediated endoplasmic reticulum (ER) exit, but the mechanism remains elusive.
- term:
    id: GO:0035438
    label: cyclic-di-GMP binding
  evidence_type: IDA
  original_reference_id: PMID:29694889
  qualifier: enables
  review:
    action: ACCEPT
    summary: STING1 binds bacterial cyclic di-GMP directly, acting as a sensor for bacterial cyclic
      dinucleotides as well as for host cGAMP.
    reason: Core molecular function. Direct radioligand binding with competition by unlabelled cyclic
      dinucleotides but not by other nucleotides, plus mutations that selectively impair the cyclic-dinucleotide
      response. This is the activity that grounds the antibacterial innate immune annotations.
    supported_by:
    - reference_id: PMID:21947006
      supporting_text: We demonstrate that STING binds directly to radiolabelled cyclic diguanylate
        monophosphate (c-di-GMP), and we show that unlabelled cyclic dinucleotides, but not other
        nucleotides or nucleic acids, compete with c-di-GMP for binding to STING.
- term:
    id: GO:0051259
    label: protein complex oligomerization
  evidence_type: IDA
  original_reference_id: PMID:30842659
  qualifier: involved_in
  review:
    action: KEEP_AS_NON_CORE
    summary: These rows record STING1's own cGAMP-induced oligomerisation.
    reason: Accurate but it describes the protein's activation mechanism rather than a biological
      process it carries out on other entities; the informative statements are the homodimerisation
      MF and the lipid/cGAMP binding that drive it. The two rows carry different qualifiers (involved_in
      and acts_upstream_of) for the same self-assembly event, which is itself a sign the term is
      a poor fit here.
    supported_by:
    - reference_id: PMID:30842659
      supporting_text: This rotation is coupled to a conformational change in a loop on the side
        of the ligand-binding-domain dimer, which leads to the formation of the STING tetramer and
        higher-order oligomers through side-by-side packing.
