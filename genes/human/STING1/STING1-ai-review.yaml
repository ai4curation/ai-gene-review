  original_reference_id: GO_REF:0000024
  qualifier: located_in
  review:
    action: MARK_AS_OVER_ANNOTATED
    summary: Plasma membrane localisation has no human experimental support and is contradicted by
      the trafficking literature.
    reason: The three rows are IEA from UniProt subcellular-location mapping, ISS, and a generic
      Reactome exocytosis reaction; UniProt itself qualifies "Cell membrane" as ECO:0000250 by similarity
