- term:
    id: GO:0035438
    label: cyclic-di-GMP binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    action: ACCEPT
    summary: STING1 binds bacterial cyclic di-GMP directly, acting as a sensor for bacterial cyclic
      dinucleotides as well as for host cGAMP.
    reason: Core molecular function. Direct radioligand binding with competition by unlabelled cyclic
      dinucleotides but not by other nucleotides, plus mutations that selectively impair the cyclic-dinucleotide
      response. This is the activity that grounds the antibacterial innate immune annotations.
    supported_by:
    - reference_id: PMID:21947006
      supporting_text: We demonstrate that STING binds directly to radiolabelled cyclic diguanylate
        monophosphate (c-di-GMP), and we show that unlabelled cyclic dinucleotides, but not other
        nucleotides or nucleic acids, compete with c-di-GMP for binding to STING.
- term:
    id: GO:0061709
    label: reticulophagy
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    action: ACCEPT
    summary: Cyclic-di-GMP-triggered STING1 signalling has been linked to selective autophagy of
      the ER.
    reason: 'The weakest member of the autophagy cluster: UniProt supports it only "By similarity",
      and the human evidence is IBA/IEA/ISS with no direct experimental row. Kept as-is rather than
      downgraded because doing so would require asserting a propagation failure in the PANTHER family
      (PTN005046674) that I did not inspect, and because ER-derived membrane is genuinely the source
      of STING-induced autophagosomes. Flagged here as the annotation on this gene I would most like
      to see experimentally confirmed or retired.'
