- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  review:
    action: MARK_AS_OVER_ANNOTATED
    summary: Plasma membrane localisation has no human experimental support and is contradicted by
      the trafficking literature.
    reason: The three rows are IEA from UniProt subcellular-location mapping, ISS, and a generic
      Reactome exocytosis reaction; UniProt itself qualifies "Cell membrane" as ECO:0000250 by similarity
      to mouse Q3TBT3. The 2026 lipid work states positively that activated STING1 traffics to the
      Golgi and Golgi-derived endosomes but not to the plasma membrane. Marked as over-annotation
      rather than removed because the ISS is a curator judgement about the mouse orthologue.
    supported_by:
    - reference_id: PMID:41639452
      supporting_text: PI(4,5)P2 is enriched in the plasma membrane, but also present in the Golgi
        and endosomes at much lower levels35,37. PI(3,5)P2 is mostly localized to late endosomes
        and lysosomes35. Upon cGAMP binding, STING traffics to Golgi and Golgi-derived endosomes,
        but not plasma membrane.
