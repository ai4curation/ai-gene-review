- term:
    id: GO:0005741
    label: mitochondrial outer membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  review:
    action: MARK_AS_OVER_ANNOTATED
    summary: Mitochondrial outer membrane localisation comes entirely from 2008-2009 reports and
      is not how STING1 is understood today.
    reason: Six rows, four EXP plus one IDA, all from the first two years of work on the protein,
      and UniProt still lists the location with those same four references. Every subsequent structural
      and trafficking study places STING1 in the ER and its post-ER itinerary, and the same UniProt
      entry's FUNCTION block describes only that route. The early mitochondrial signal is plausibly
      mitochondria-associated ER membrane (MAM) rather than the outer mitochondrial membrane proper.
      Not removed, because these are experimental annotations whose full texts I have not read and
      which I have no standing to overturn, but marked as over-annotation so that it is not read
      as a current localisation.
    supported_by:
    - reference_id: PMID:18818105
      supporting_text: MITA was found to localize to the outer membrane of mitochondria and to be
        associated with VISA, a mitochondrial protein that acts as an adaptor in virus-triggered
        signaling.
    - reference_id: PMID:30842659
      supporting_text: STING is an endoplasmic-reticulum membrane protein that contains four transmembrane
        helices followed by a cytoplasmic ligand-binding and signalling domain
