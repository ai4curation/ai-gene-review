- term:
    id: GO:0033116
    label: endoplasmic reticulum-Golgi intermediate compartment membrane
  evidence_type: IDA
  original_reference_id: PMID:30842662
  qualifier: located_in
  review:
    action: ACCEPT
    summary: On activation STING1 buds from the ER in COPII vesicles into the ERGIC, where TBK1 is
      recruited and where LC3 lipidation is nucleated.
    reason: 'Core location for the activated protein, and arguably the single most informative CC
      term on the gene: ERGIC residence is what couples trafficking to signalling competence.'
    supported_by:
    - reference_id: PMID:30842662
      supporting_text: Upon binding cGAMP, STING translocates to the endoplasmic reticulum-Golgi
        intermediate compartment (ERGIC) and the Golgi in a process that is dependent on the COP-II
        complex and ARF GTPases. STING-containing ERGIC serves as a membrane source for LC3 lipidation,
        which is a key step in autophagosome biogenesis.
