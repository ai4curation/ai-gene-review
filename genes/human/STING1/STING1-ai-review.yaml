- term:
    id: GO:0061709
    label: reticulophagy
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  review:
    action: ACCEPT
    summary: Cyclic-di-GMP-triggered STING1 signalling has been linked to selective autophagy of
