      the step at which high-order oligomers support TBK1 trans-autophosphorylation.'
    supported_by:
    - reference_id: PMID:41639454
      supporting_text: STING then traffics from the ER through the Golgi to perinuclear vesicle clusters,
        which leads to activation of the kinases TBK1 and IKK and subsequent induction of interferons
        and other cytokines
- term:
    id: GO:0005546
    label: phosphatidylinositol-4,5-bisphosphate binding
  evidence_type: IDA
  original_reference_id: PMID:41639452
  qualifier: enables
  review:
    action: NEW
    summary: STING1 binds PtdIns(4,5)P2 in the same transmembrane groove that binds PtdIns(3,5)P2,
      with comparable potency in promoting high-order oligomerisation.
    reason: 'GOA already captures the PtdIns(3,5)P2 half of the 2026 lipid work (GO:0080025) but
      not this one, although it rests on the same evidence: a dedicated cryo-EM structure of the
      STING/PI(4,5)P2 complex, native-PAGE oligomerisation assays, and lipid-strip binding abolished
      by the R71H/K20E mutation. Proposed with an explicit caveat rather than as a settled fact:
      PtdIns(4,5)P2 is plasma-membrane-enriched and activated STING1 does not traffic to the plasma
      membrane, so although the binding capability is well demonstrated its physiological occupancy
      is not established - the authors themselves note this and argue PtdIns(3,5)P2 is the more likely
      in-cell ligand. It is also, like GO:0080025, single-programme evidence from companion papers
      rather than independently replicated. Annotated as the specific term matching the lipid actually
      assayed; a curator preferring a single annotation over two could instead use the parent GO:1902936
      phosphatidylinositol bisphosphate binding. PtdIns4P was deliberately not annotated, since the
      same paper argues its effect is probably indirect.'
    supported_by:
    - reference_id: PMID:41639452
      supporting_text: Our lipid binding, native PAGE and cryo-EM studies together indicate that
        both PI(3,5)P2 and PI(4,5)P2 are able to strongly bind STING and effectively induce high-order
        STING oligomerization.
    - reference_id: PMID:41639452
      supporting_text: Here we demonstrate that cGAMP-induced high-order oligomerization of STING
        is enhanced strongly by phosphatidylinositol 3,5-bisphosphate (PtdIns(3,5)P2 and PtdIns(4,5)P2,
        and by PtdIns4P to a lesser extent.
    - reference_id: PMID:41639452
      supporting_text: PI(4,5)P2 is enriched in the plasma membrane, but also present in the Golgi
        and endosomes at much lower levels35,37. PI(3,5)P2 is mostly localized to late endosomes
        and lysosomes35. Upon cGAMP binding, STING traffics to Golgi and Golgi-derived endosomes,
        but not plasma membrane.
    - reference_id: PMID:41639452
      supporting_text: It is possible that this effect of PI(4)P is indirect, as changes in the concentration
        of PI(4)P could affect other PIP species such as PI(4,5)P2 and PI(3,5)P2.
