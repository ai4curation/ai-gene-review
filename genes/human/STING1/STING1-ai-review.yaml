core_functions:
- molecular_function:
    id: GO:0035591
    label: signaling adaptor activity
  description: STING1 is the signal-transducing adaptor of the cytosolic DNA-sensing pathway. Binding
    of 2'3'-cGAMP or of bacterial cyclic dinucleotides to its cytosolic ligand-binding domain triggers
    high-order oligomerisation and ER exit; at the ERGIC and Golgi the oligomer recruits TBK1 through
    its C-terminal PXPLRXD motif, is phosphorylated on Ser366, and the phosphorylated tail then recruits
    IRF3 for TBK1-dependent phosphorylation, driving type I interferon transcription. From post-Golgi
    endolysosomes the same adaptor activity engages TRAF6 and activates NF-kappaB.
  directly_involved_in:
  - id: GO:0140896
    label: cGAS/STING signaling pathway
  - id: GO:0032481
    label: positive regulation of type I interferon production
  - id: GO:0043123
    label: positive regulation of canonical NF-kappaB signal transduction
  locations:
  - id: GO:0005789
    label: endoplasmic reticulum membrane
  - id: GO:0033116
    label: endoplasmic reticulum-Golgi intermediate compartment membrane
  - id: GO:0000139
    label: Golgi membrane
  - id: GO:0036020
    label: endolysosome membrane
  in_complex:
    id: GO:1990231
    label: STING complex
  supported_by:
  - reference_id: PMID:25636800
    supporting_text: Phosphorylated MAVS and STING then bind to a positively charged surface of interferon
      regulatory factor 3 (IRF3) and thereby recruit IRF3 for its phosphorylation and activation
      by TBK1.
  - reference_id: PMID:30842659
    supporting_text: This rotation is coupled to a conformational change in a loop on the side of
      the ligand-binding-domain dimer, which leads to the formation of the STING tetramer and higher-order
      oligomers through side-by-side packing.
  - reference_id: PMID:40973797
    supporting_text: IRF3 engagement with STING pS358 induces trafficking to late endolysosomal compartments,
      supporting recruitment of TRAF6 and activation of NF-κB.
- molecular_function:
    id: GO:0061507
    label: 2',3'-cyclic GMP-AMP binding
  description: STING1 is the intracellular receptor for 2'3'-cGAMP. The mixed 2'-5'/3'-5' linkage
    of the endogenous cGAS product is bound with far higher affinity than other cyclic GMP-AMP isomers,
    and binding closes the lid of the ligand-binding domain to initiate the conformational change
    that leads to oligomerisation. The same pocket binds bacterial cyclic di-GMP directly (GO:0035438),
    so STING1 serves as a sensor of bacterial cyclic dinucleotides as well as a receiver of the host
    second messenger.
  directly_involved_in:
  - id: GO:0140896
    label: cGAS/STING signaling pathway
  - id: GO:0140367
    label: antibacterial innate immune response
  locations:
