- term:
    id: GO:0080025
    label: phosphatidylinositol-3,5-bisphosphate binding
  evidence_type: IDA
  original_reference_id: PMID:41639452
  qualifier: enables
  review:
    action: ACCEPT
    summary: STING1 binds PtdIns(3,5)P2 directly through a groove in its transmembrane region; the
      lipid acts as a molecular glue that, together with cGAMP, drives high-order oligomerisation
      and ER exit.
    reason: 'This is the newly assigned molecular function of the gene and GOA already carries it
      as IDA from both 2026 Nature papers. Weighing the evidence honestly: the two papers are co-submitted
      companions with overlapping authorship (the cryo-EM structure cited by Tan et al. IS the Li
      et al. paper), so they are corroboration within one research programme, not independent replication,
      and no second laboratory has yet reproduced the direct binding. It is nonetheless accepted
      because (i) the support is multi-modal rather than one assay - FRET with labelled lipid against
      full-length protein, lipid strips, cryo-EM density at a defined dimer-dimer groove, structure-guided
      K20E/R71H loss of binding and of signalling, liposome reconstitution, and PIKFYVE deletion
      phenocopying the binding mutant; (ii) it converges on pre-existing independent human genetics,
      since R71 is part of the common hypofunctional HAQ allele and the structure explains why; and
      (iii) a modulatory role for phosphoinositides and cholesterol in STING activation had already
      been reported by other groups, which these papers set out to explain mechanistically. Recorded
      as a core-adjacent activation requirement rather than a third output branch.'
    supported_by:
    - reference_id: PMID:41639454
      supporting_text: These results indicate that STING directly binds to PtdIns(3,5)P2.
    - reference_id: PMID:41639454
      supporting_text: PtdIns(3,5)P2 bound directly to STING in fluorescence resonance energy transfer
        assays.
    - reference_id: PMID:41639454
      supporting_text: Proteomic analyses identified a constitutive interaction between STING and
        PIKFYVE, an enzyme that produces PtdIns(3,5)P2 in mammalian cells. Deletion of PIKFYVE blocked
        STING trafficking from the ER and TBK1 activation.
    - reference_id: PMID:41639452
      supporting_text: Here we demonstrate that cGAMP-induced high-order oligomerization of STING
        is enhanced strongly by phosphatidylinositol 3,5-bisphosphate (PtdIns(3,5)P2 and PtdIns(4,5)P2,
        and by PtdIns4P to a lesser extent.
    - reference_id: PMID:41639452
      supporting_text: Our cryo-electron microscopy structures reveal that PtdInsPs together with
        cholesterol bind at the interface between STING dimers, directly promoting the high-order
        oligomerization.
    - reference_id: PMID:41639452
      supporting_text: Our cryo-EM results show that R71 forms a salt bridge with the 5-phosphate
        group of PI(3,5)P2 or PI(4,5)P2, which provides a structural explanation for its critical
        role in STING activation.
