- molecular_function:
    id: GO:0015252
    label: proton channel activity
  description: 'The STING1 transmembrane domain forms a proton-conducting pathway at the interface
    between protomers. Purified STING1 reconstituted into liposomes supports transmembrane proton
    transport, and in cells its activation raises Golgi pH. The resulting proton efflux drives an
    output branch that is separable from interferon induction: non-canonical LC3B and GABARAP lipidation,
    NLRP3 inflammasome activation, and relief of mTORC1 inhibition leading to TFEB/TFE3-driven lysosome
    biogenesis. The agonist C53 binds the channel interface and blocks flux, uncoupling these outputs
    from IRF3 signalling.'
  directly_involved_in:
  - id: GO:1902600
    label: proton transmembrane transport
  - id: GO:0016239
    label: positive regulation of macroautophagy
