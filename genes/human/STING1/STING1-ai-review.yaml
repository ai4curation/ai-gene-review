    action: REMOVE
    summary: Twenty-five bare protein-binding IPI rows from large interaction screens and single-partner
      papers.
    reason: >-
      'Per project curation guidance, bare protein binding carries no functional
      information. The informative content of these rows is captured by the specific terms this gene
