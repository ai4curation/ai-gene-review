- term:
    id: GO:0061709
    label: reticulophagy
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: involved_in
  review:
    action: ACCEPT
    summary: Cyclic-di-GMP-triggered STING1 signalling has been linked to selective autophagy of
      the ER.
    reason: 'The weakest member of the autophagy cluster: UniProt supports it only "By similarity",
      and the human evidence is IBA/IEA/ISS with no direct experimental row. Kept as-is rather than
      downgraded because doing so would require asserting a propagation failure in the PANTHER family
      (PTN005046674) that I did not inspect, and because ER-derived membrane is genuinely the source
      of STING-induced autophagosomes. Flagged here as the annotation on this gene I would most like
      to see experimentally confirmed or retired.'
