    label: trans-Golgi network membrane
  supported_by:
  - reference_id: PMID:37535724
    supporting_text: On the basis of structural analysis, we hypothesized that human STING is a proton
      channel. Indeed, we found that STING activation induced a pH increase in the Golgi and that
      STING reconstituted in liposomes enabled transmembrane proton transport.
  - reference_id: PMID:37535724
    supporting_text: STING-induced LC3B lipidation and inflammasome activation were also inhibited
      by C53, suggesting that STING's channel activity is critical for these two processes.
  - reference_id: PMID:39423796
    supporting_text: STING-mediated TFEB activation is independent of TBK1, but it requires STING
      trafficking and its conserved proton channel.
  - reference_id: PMID:39947179
    supporting_text: Recent discoveries revealed that STING also functions as a proton channel that
      deacidifies the Golgi apparatus.
- molecular_function:
    id: GO:0080025
    label: phosphatidylinositol-3,5-bisphosphate binding
  description: STING1 binds PtdIns(3,5)P2 through a groove formed at the interface between adjacent
    dimers, contributed by H16 and K20 of the N-terminal tail of one protomer and R71 of a neighbouring
    loop. Binding requires the full-length protein including the transmembrane domain, and is enhanced
    by cholesterol, which occupies an adjacent position in the same interface (GO:0015485). The lipid
    acts as a molecular glue that, together with cGAMP, stabilises high-order oligomers and thereby
    permits ER exit and TBK1 activation; PIKFYVE, the kinase that makes PtdIns(3,5)P2, is constitutively
    bound to STING1, and its deletion or mutation of the lipid-binding residues blocks trafficking
    and signalling. PtdIns(4,5)P2 occupies the same site in vitro. This is an activation requirement
    gating the adaptor function rather than an independent output, and it rests on companion papers
    from a single research programme.
  directly_involved_in:
  - id: GO:0140896
    label: cGAS/STING signaling pathway
  locations:
  - id: GO:0005789
    label: endoplasmic reticulum membrane
  - id: GO:0033116
    label: endoplasmic reticulum-Golgi intermediate compartment membrane
  supported_by:
  - reference_id: PMID:41639454
    supporting_text: These results indicate that STING directly binds to PtdIns(3,5)P2.
  - reference_id: PMID:41639454
    supporting_text: Proteomic analyses identified a constitutive interaction between STING and PIKFYVE,
      an enzyme that produces PtdIns(3,5)P2 in mammalian cells. Deletion of PIKFYVE blocked STING
      trafficking from the ER and TBK1 activation.
  - reference_id: PMID:41639452
    supporting_text: Our cryo-electron microscopy structures reveal that PtdInsPs together with cholesterol
      bind at the interface between STING dimers, directly promoting the high-order oligomerization.
  - reference_id: PMID:41639452
    supporting_text: Our cryo-EM results show that R71 forms a salt bridge with the 5-phosphate group
      of PI(3,5)P2 or PI(4,5)P2, which provides a structural explanation for its critical role in
      STING activation.
suggested_questions:
- question: Can an independent laboratory, outside the Tan/Chen/Bai programme, reproduce direct PtdIns(3,5)P2
    binding to full-length STING1 and the loss of binding in the K20E/R71H mutant? The two 2026 Nature
    papers are co-submitted companions with overlapping authorship, so the lipid-ligand claim is
    currently corroborated rather than replicated.
- question: Is PtdIns(4,5)P2 binding physiologically occupied? It engages the same groove with similar
    potency in vitro, yet it is plasma-membrane-enriched and activated STING1 does not reach the
    plasma membrane. Does the Golgi/endosomal pool of PtdIns(4,5)P2 contribute to STING1 activation
    in cells, or is the binding an in vitro capability only?
- question: What precisely did the Publisher Correction to PMID:41639454 (PMID:41721038, Nature 651(8105):E11)
    change? The correction text is not exposed by PubMed or Europe PMC and the Nature page is behind
    authentication. Springer Nature reserves 'Publisher Correction' for production errors, so it
    most likely does not touch the data, but this should be confirmed before the lipid annotations
    are treated as settled.
- question: Does the common hypofunctional HAQ allele (R71H-G230A-R293Q) owe its impaired signalling
    specifically to loss of phosphoinositide binding at R71? If so, human population genetics would
    provide the independent line of evidence the lipid-ligand claim currently lacks.
- question: Is the proton channel activity of STING1 a conductance through a defined pore, or a lipid-dependent
    proton leak created by oligomerisation in the membrane? Four independent laboratories now depend
    on the channel and a drug series binds its interface, but a single-channel electrophysiological
    characterisation is still lacking.
- question: Should the early mitochondrial outer membrane localisation (GO:0005741, four EXP rows
    from 2008-2009, still carried by UniProt) be retired, reinterpreted as mitochondria-associated
    ER membrane contact sites (GO:0044233), or retained as-is? A curator with access to those full
    texts is better placed to decide than this review was.
- question: Is reticulophagy (GO:0061709) a genuine human STING1 function? It is currently supported
    only by IBA/IEA/ISS and by a 'By similarity' note in UniProt, with no direct human experimental
    evidence.
suggested_experiments:
- description: 'Independent replication of direct lipid binding: an unrelated laboratory should measure
    PtdIns(3,5)P2 and PtdIns(4,5)P2 binding to purified full-length human STING1 in nanodiscs by
    a method orthogonal to FRET - for example native mass spectrometry or isothermal titration calorimetry
    - with K20E/R71H and S80I as negative controls, and report affinities rather than relative signals.'
  hypothesis: The entire phosphoinositide-ligand claim currently rests on companion papers from one
    programme using a FRET assay the same group developed. Orthogonal, independent measurement is
    the single most valuable next experiment.
  experiment_type: orthogonal biophysical binding assay
- description: 'Test whether lipid binding is required in an endogenous setting: knock the K20E/R71H
    and S80I substitutions into the native STING1 locus of primary human macrophages and monocyte-derived
    dendritic cells and measure cGAMP- and HSV-1-induced ER exit, STING Ser366 phosphorylation, IRF3
    and NF-kappaB activation, and interferon output.'
  hypothesis: Published cell-based evidence used overexpression in HEK293T and reconstituted systems;
    a knock-in in a physiologically relevant cell type would show whether the lipid site is rate-limiting
    at endogenous expression levels.
  experiment_type: knock-in functional assay in primary cells
- description: Separate the PtdIns(3,5)P2 and PtdIns(4,5)P2 contributions in cells by acutely and
    selectively depleting each lipid - PIKFYVE inhibition or degron for PtdIns(3,5)P2, a recruitable
    5-phosphatase targeted to Golgi and endosomes for PtdIns(4,5)P2 - and scoring STING1 oligomerisation
    and signalling in each case.
  hypothesis: Resolves whether the in vitro equivalence of the two lipids has any counterpart in
    cells, and whether GO:0005546 should be regarded as a physiological or an in vitro capability.
  experiment_type: acute lipid depletion in cells
- description: 'Characterise the STING1 proton conductance electrophysiologically: patch-clamp enlarged
    Golgi or reconstituted proteoliposome-derived giant unilamellar vesicles containing wild-type
    STING1 and channel-interface mutants, with and without C53, to obtain current-voltage relations,
    pH dependence and, if possible, single-channel events.'
  hypothesis: The channel assignment is supported by bulk proton-flux assays and by pharmacology
    in four laboratories, but a direct biophysical characterisation would settle whether STING1 is
    a bona fide channel or a lipid-dependent leak pathway.
  experiment_type: electrophysiology
- description: 'Re-examine the mitochondrial localisation with modern methods: proximity labelling
    (APEX2 or TurboID) from endogenous STING1 in resting and stimulated cells, combined with correlative
    light and electron microscopy, to determine whether any STING1 is at the outer mitochondrial
    membrane or only at ER-mitochondria contact sites.'
  hypothesis: Would allow the six GO:0005741 rows to be either retired or re-termed to GO:0044233
    on evidence rather than on the age of the original reports.
  experiment_type: proximity labelling and imaging
- description: 'Test the reticulophagy claim directly in human cells: stimulate STING1 with cGAMP
    and with cyclic di-GMP and measure selective ER turnover using RAMP4-mCherry-GFP or FAM134B-dependent
    reporters in wild-type, STING1-knockout, and proton-channel-mutant backgrounds.'
  hypothesis: GO:0061709 is currently the least-supported process annotation on this gene and is
    carried only by inference; a direct assay would confirm or retire it.
  experiment_type: selective autophagy reporter assay
