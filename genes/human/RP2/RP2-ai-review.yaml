    supporting_text: Biochemical analysis showing a 90,000-fold stimulation of the GTPase reaction together
      with the structure of an Arl3-GDP-AlF4--RP2 transition state complex showed that RP2 is an efficient
      GAP for Arl3, with structural features similar to other GAPs.
  - reference_id: PMID:18376416
    supporting_text: Furthermore, the effect of mutations in patients with retinitis pigmentosa correlated
      with their effect on catalysis, in particular the mutation of the arginine finger of RP2.
  - reference_id: PMID:20106869
    supporting_text: Here, we show that the retinitis pigmentosa protein RP2, which is a GTPase activating
      protein (GAP) for Arl3, localizes to the ciliary apparatus, namely the basal body and the associated
      centriole at the base of the photoreceptor cilium.
  - reference_id: PMID:22085962
    supporting_text: Strikingly, knockdown of ARL3, UNC119b, and RP2 each dramatically reduced the percentage
      of cilia with localized NPHP3 1–200.
suggested_questions:
- question: Should RP2 be represented as a component of the ciliary lipidated-cargo targeting process,
    or only as a negative regulator of ARL3 activity?
- question: Is magnesium ion binding by RP2 itself supported by any direct data, or does the annotation
    derive from the ARL3 nucleotide site in the complex?
- question: How much of RP2 function in photoreceptors depends on its plasma membrane versus basal body/periciliary
    pools?
suggested_experiments:
- hypothesis: RP2 must be at the ciliary base (not only plasma membrane) to recycle UNC119B/PDE6D-ARL3
    complexes.
  description: Rescue RP2-null photoreceptors or RPE1 cells with acylation-site mutants or basal-body-tethered
    RP2 and measure ciliary NPHP3, transducin and PDE6 delivery.
  experiment_type: Targeted localization rescue
- hypothesis: All XLRP missense variants act by reducing ARL3 GAP activity or ARL3 binding.
  description: Systematic GAP assays and binding measurements for patient variants with matched cellular
    rescue.
  experiment_type: Variant biochemistry
