core_functions:
- description: 'GTPase-activating protein specific for ARL3: an arginine finger in the N-terminal beta-helix
    domain stimulates ARL3 GTP hydrolysis, keeping active ARL3 confined to the cilium and recycling lipidated-cargo
    carriers.'
