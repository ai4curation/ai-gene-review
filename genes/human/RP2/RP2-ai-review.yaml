    label: protein localization to ciliary membrane
  evidence_type: IMP
  original_reference_id: PMID:22085962
  qualifier: involved_in
  review:
    summary: Proposed NEW annotation. RP2 knockdown blocks ciliary membrane targeting of myristoylated
      NPHP3, as do ARL3 and UNC119B knockdown.
    action: NEW
    reason: 'RP2 performs the GTP-hydrolysis step that terminates each round of the ARL3-UNC119B cargo-release
      cycle and returns the carrier for reuse; Wright et al. describe this GTPase cycle as the mechanism
      that targets myristoylated cargo to the ciliary membrane. This places RP2 inside the localization
      process as a cycle component (GAP step) rather than as cargo. The module assigns RP2 to protein
      localization to cilium; the ciliary-membrane child is more precise. Caveat: RP2 could alternatively
      be modelled as a regulator of ARL3 activity only; this is flagged in suggested_questions.'
    supported_by:
    - reference_id: PMID:22085962
      supporting_text: Strikingly, knockdown of ARL3, UNC119b, and RP2 each dramatically reduced the percentage
        of cilia with localized NPHP3 1–200.
    - reference_id: PMID:22085962
      supporting_text: Finally, we showed that ARL3, UNC119b (but not UNC119a), and the ARL3 GAP Retinitis
        Pigmentosa 2 (RP2) are required for NPHP3 ciliary targeting and that targeting requires UNC119b
        myristoyl-binding activity.
