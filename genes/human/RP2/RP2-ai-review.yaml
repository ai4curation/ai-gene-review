id: O75695
gene_symbol: RP2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'RP2 is a ubiquitously expressed, N-terminally myristoylated and palmitoylated protein that
  associates with the cytoplasmic face of the plasma membrane and concentrates at the ciliary base (basal
  body, associated centriole and periciliary membrane) and Golgi. It is the specific GTPase-activating
  protein for the small GTPase ARL3: an arginine finger (Arg118) in its N-terminal beta-helix domain,
  which is homologous to the tubulin cofactor C, stimulates ARL3 GTP hydrolysis about 90,000-fold. By
  inactivating ARL3 outside the cilium RP2 keeps active ARL3 confined to the ciliary compartment and recycles
  the lipidated-cargo carriers UNC119B and PDE6D, enabling delivery of myristoylated and prenylated proteins
  (e.g., NPHP3, transducin, phosphodiesterase subunits) to the ciliary and photoreceptor outer segment
  membranes. RP2 also influences Golgi-to-cilium vesicle traffic. Loss-of-function mutations, including
  those of the arginine finger, cause X-linked retinitis pigmentosa.'
