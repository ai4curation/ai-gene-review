      action: MARK_AS_OVER_ANNOTATED
      reason: >-
        The row is transferred from mouse Cry1, annotated from a genetic-interaction
        (double-mutant) experiment in a study of diet-induced hyperinsulinemia and
        insulin resistance in cryptochrome-deficient mice (PMID:23531614), so it has an
        experimental basis. Increased fat accumulation in Cry-deficient animals is,
        however, a systemic metabolic phenotype of losing clock-dependent regulation,
        not evidence that CRY1 carries out lipid storage. The term over-reads the
        phenotype rather than being unsupported.
      supported_by: *id002
  - term:
      id: GO:0031397
      label: negative regulation of protein ubiquitination
    evidence_type: IEA
    original_reference_id: GO_REF:0000107
    qualifier: involved_in
    review:
      summary: >-
        Negative regulation of protein ubiquitination (IEA), transferred from mouse
        Cry1, where it is a direct assay showing that mCRY inhibits ubiquitylation of
        mPER2 (PMID:11889036).
      action: KEEP_AS_NON_CORE
      reason: >-
        The row is transferred from mouse Cry1, annotated by direct assay in the study
        that demonstrated mCRY-dependent inhibition of ubiquitylation of the clock
        protein mPER2 (PMID:11889036). The claim is therefore not a confusion of CRY1 as
        a ubiquitination substrate with a regulator: cryptochrome binding protects PER2
        from ubiquitylation and degradation. CRY1 is itself also ubiquitinated through
        FBXL3, which is a separate fact. Stabilization of PER2 is part of how the
        repressor complex is assembled but is secondary to CRY1's role as a
        transcriptional repressor, so it is kept as non-core.
      supported_by:
        - reference_id: PMID:17463251
          supporting_text: Cry1 and Cry2 proteins are ubiquitinated and degraded
  - term:
      id: GO:0031398
      label: positive regulation of protein ubiquitination
    evidence_type: IEA
    original_reference_id: GO_REF:0000107
    qualifier: involved_in
    review:
      summary: >-
        Positive regulation of protein ubiquitination (IEA), transferred from mouse
        Cry1, annotated from a mutant phenotype (PMID:28790135); the source paper is not
        available to check.
      action: UNDECIDED
      reason: >-
        The row is transferred from mouse Cry1, annotated from a mutant phenotype in a
        study of DDB1-mediated CRY1 degradation and FOXO1-driven gluconeogenesis
        (PMID:28790135), which is not available here. CRY1 is itself ubiquitinated and
        degraded, but that does not exclude it promoting the ubiquitination of another
        protein, and the donor annotation is experimental; whether the paper shows such
        an effect cannot be checked. The row is left undecided rather than removed as a
        substrate/regulator confusion.
      supported_by:
        - reference_id: PMID:17463251
          supporting_text: Cry1 and Cry2 proteins are ubiquitinated and degraded
