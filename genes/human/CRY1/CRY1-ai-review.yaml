      action: MARK_AS_OVER_ANNOTATED
      reason: >-
        The row is transferred from mouse Cry1, where mitochondrion rests on two
        experimental observations: a direct assay in an early localization study (IDA,
        PMID:9801304) and detection in the MitoCarta mitochondrial proteome (HDA,
        PMID:18614015). The transfer therefore has a real basis and is not an error of
        mapping. For the human protein there is no direct evidence, and the established
        sites of CRY1 action are the nucleus and cytoplasm, so a mitochondrial pool is
        unconfirmed rather than refuted; the organelle claim is treated as an
        over-annotation.
      additional_reference_ids: ["PMID:9801304"]
