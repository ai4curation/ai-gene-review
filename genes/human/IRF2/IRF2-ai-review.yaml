id: P14316
gene_symbol: IRF2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Interferon regulatory factor 2 (IRF2) is a nuclear and chromatin-associated IRF-family
  transcription factor that binds ISRE/IRF elements. It acts chiefly as a sequence-specific
  repressor of interferon-stimulated genes, including through TASOR2/HUSH2 recruitment, while also
  activating selected targets such as histone H4 and Tlr3 in cell-cycle and innate-immune contexts.
