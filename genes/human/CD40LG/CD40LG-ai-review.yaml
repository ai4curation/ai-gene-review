    id: GO:0005174
    label: CD40 receptor binding
  description: Binds and activates CD40 through its extracellular ligand domain, initiating
    contact-dependent or soluble-ligand signaling that promotes B-cell responses. CD40L provides
    the initiating receptor ligand; receptor-associated signaling proteins perform downstream
    enzymatic reactions.
