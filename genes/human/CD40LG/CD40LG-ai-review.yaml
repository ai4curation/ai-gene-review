suggested_questions:
- question: Which original experiments in PMID:8617933 establish IL-10 production and T-cell
    proliferation, beyond the accessible IL-4/costimulation abstract?
- question: What ligand species and construct support the human CD40LG anti-apoptosis annotation
    from PMID:12697681, and was CD40L itself assayed in the IL-12 experiment attributed to
    PMID:9922218?
- question: Which physiological ligand configurations trigger CD28i-associated reverse signaling,
    and can direct CD40L–kinase binding or activator activity be demonstrated separately from
    downstream phosphorylation?
- question: How do membrane versus soluble CD40L, integrin subtype and ligand oligomerization
    determine immune and platelet responses?
suggested_experiments:
- hypothesis: Ligand presentation and receptor composition determine whether CD40L elicits
    forward CD40 signaling, integrin-dependent responses or CD28i-associated reverse signaling.
  description: Compare expression-matched membrane and purified soluble human CD40L, with
    CD40/integrin blockade and CD28i perturbation. Measure receptor binding separately from
    NF-kappaB, JNK/PAK2 phosphorylation and cell-type-specific outputs; use biochemical binding/activation
    assays before assigning intrinsic kinase-regulator activity.
  experiment_type: biochemical and cell-based signaling
