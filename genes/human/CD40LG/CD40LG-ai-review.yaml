id: P29965
gene_symbol: CD40LG
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CD40 ligand (CD40L/CD154), encoded by CD40LG, is a type II transmembrane TNF-family
  protein displayed on activated T cells and platelets. Its extracellular domain binds CD40
  on neighboring cells and initiates signaling that promotes immune-cell activation, B-cell
  proliferation and immunoglobulin class switching. Proteolytic processing also produces a
  biologically active soluble ligand. CD40L can engage selected integrins, and cross-linking
  membrane CD40L can transmit reverse costimulatory signals in T cells through associated
  signaling proteins. The principal physiological role is communication between activated
  T cells and CD40-bearing antigen-presenting cells; loss of CD40L function causes X-linked
  immunodeficiency with hyper-IgM.
