- gap_statement: Whether AP3S1 has any role outside AP-3 is undetermined. The one published claim of an
    independent activity -- that sigma3A acts as a membrane receptor for IRS-1 in adipocytes -- has never
    been tested again.
  boundary: 'The original observation is specific: a sigma3A cDNA came out of an expression-library screen
    with IRS-1, GST-sigma3A bound IRS-1 in vitro, and adding GST-sigma3A released IRS-1 from low-density
