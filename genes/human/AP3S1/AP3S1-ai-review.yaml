suggested_questions:
- question: Is there any cargo, tissue or trafficking step that requires sigma3A specifically and cannot
    be served by sigma3B? Both isoforms are broadly expressed, both delta-sigma3A and delta-sigma3B bind
    the LIMP-II dileucine tail, and the two proteins are identical at every residue named for the cargo-signal
    site, so nothing currently distinguishes them functionally.
  experts:
  - Juan S. Bonifacino
  - Esteban C. Dell'Angelica
- question: In the cargo-free human AP-3 structure the sigma3 dileucine pocket is occupied by the N-terminal
    extension of beta3. Is that an autoinhibited state that a dileucine cargo has to displace, and is
    displacement coupled to the tyrosine-motif site on mu3?
  experts:
  - Richard W. Baker
- question: The delta ear binds sigma3 and blocks Arf binding without affecting dileucine-signal binding.
    Is that interaction regulated in cells -- by phosphorylation, by cargo occupancy, or by a partner
    -- and does the reported phosphoserine at position 191 of sigma3A play any part in AP-3 recruitment?
  experts:
  - Juan S. Bonifacino
- question: Given that AP3S1 is ubiquitously expressed and essential to a complex whose loss causes Hermansky-Pudlak
    syndrome through other subunits, why has no human AP3S1 disease allele been reported? Is the gene
    intolerant of loss of function, or is sigma3B able to compensate?
  experts: []
suggested_experiments:
- hypothesis: sigma3A and sigma3B are functionally interchangeable for dileucine cargo selection, and
    any difference between them lies outside the cargo-signal site.
  description: Generate single and double knockouts of AP3S1 and AP3S2 in a pigmented human cell line
    (MNT-1) and in a non-pigmented line, and score AP-3 complex assembly (co-IP of delta, beta3 and mu3),
    membrane recruitment of delta by immunofluorescence, and steady-state sorting of tyrosinase, LAMP-1
    and CD63. Then rescue the double knockout with sigma3A, with sigma3B, and with sigma3A carrying V94D
    or L109S. The prediction under the hypothesis is that either isoform rescues fully, the pocket mutants
    rescue assembly but not cargo sorting, and only the double knockout has a phenotype.
  experiment_type: genetic knockout with isoform swap rescue
- hypothesis: The beta3 N-terminal extension occupies the sigma3 dileucine pocket as an autoinhibitory
    element that dileucine cargo must displace.
  description: Reconstitute human AP-3 with a beta3 lacking the N-terminal extension and compare it with
    wild type for dileucine-peptide binding by ITC or fluorescence anisotropy, for Arf1-dependent recruitment
    to nanodiscs, and for the conformational state by cryo-EM. If the extension is autoinhibitory, its
    removal should raise dileucine-peptide affinity and may uncouple cargo binding from the second Arf1
    site.
  experiment_type: in vitro reconstitution and structural analysis
- hypothesis: sigma3A contributes the cargo-signal pocket in cells, not only in yeast three-hybrid assays.
  description: 'Knock in V94D or L109S at the endogenous AP3S1 locus in a cell line also lacking AP3S2,
    and measure: AP-3 assembly and membrane recruitment (which should be unaffected, since these residues
    are in the cargo site rather than the delta interface), and the sorting of a panel of dileucine cargoes
    (tyrosinase, LIMP-II, OCA2) versus tyrosine-motif cargoes (LAMP-1). A clean separation would establish
    the pocket''s role in vivo and would give the proposed dileucine-signal-binding term an in-cell anchor.'
  experiment_type: knock-in point mutagenesis with cargo sorting readout
- hypothesis: The delta-ear/sigma3 interaction is a regulated switch for AP-3 membrane recruitment.
  description: Map the delta-ear binding surface on sigma3A by cross-linking mass spectrometry or cryo-EM
    of the delta-ear/sigma3 complex, then mutate that surface on sigma3A without touching the cargo pocket
    and ask whether AP-3 becomes constitutively membrane-bound in cells. Combine with a phospho-null and
    phospho-mimetic pair at sigma3A Ser191 to test whether the reported phosphorylation modulates the
    switch.
  experiment_type: structural mapping with separation-of-function mutants
knowledge_gaps:
- gap_statement: Nothing is known that functionally separates sigma3A from sigma3B. The two paralogs are
    both broadly expressed, both delta-sigma3A and delta-sigma3B bind the LIMP-II dileucine tail, and
    no cargo, tissue or trafficking step has been shown to require one and not the other.
  boundary: 'The shared properties are firmly established: both were identified together as AP-3 subunits
    and both are expressed in a wide variety of tissues and cell lines; the GO definition of the complex
    admits either; and the yeast three-hybrid comparison that tested them side by side found both hemicomplexes
    binding the same signal. The bioinformatics analysis in this review adds that the two proteins, 83.9%
    identical overall, are identical at every residue the literature names for the cargo-signal site.
    What has never been done is a side-by-side loss-of-function comparison in cells, or a test of sigma3B
    against the Nef signal, which does discriminate between the AP-1 and AP-3 large subunits.'
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: GOA gives AP3S1 and AP3S2 near-identical annotation sets from the same references. That
    is currently an honest reflection of the evidence rather than a curation shortcut, but it means neither
    gene's annotation can be improved without new experiments, and any isoform-specific role -- including
    a possible explanation for why no human AP3S1 disease allele has been reported -- is invisible.
  resolution: Single and double AP3S1/AP3S2 knockouts in the same cell background, with isoform swap rescue,
    scored on complex assembly, membrane recruitment and cargo sorting.
  provenance:
  - reference_id: PMID:14691137
    supporting_text: yeast three-hybrid analyses showed that the cytosolic tail of LIMP-II interacted
      with γ1–σ1A, δ–σ3A, and δ–σ3B (σ3A and σ3B are two isoforms of σ3), but not with αC–σ2, ɛ–σ4, μ3A,
      or the VHS domain of GGA1
  - reference_id: PMID:14691137
    supporting_text: Together, these experiments demonstrate that the LIMP-II cytosolic tail binds to
      the AP-1 and AP-3 complexes through γ1–σ1A and δ–σ3 (A or B isoforms).
  - reference_id: PMID:9118953
    supporting_text: 'Northern and Western blot analyses demonstrate that the

      products of both the sigma3A and sigma3B genes are expressed in a wide variety

      of tissues and cell lines.'
  - reference_id: file:human/AP3S1/AP3S1-bioinformatics/RESULTS.md
    supporting_text: 'No sequence feature of the cargo-signal site separates sigma3A from

      sigma3B.'
- gap_statement: It is not known what displaces the beta3 N-terminal extension from the sigma3 dileucine
    pocket, or whether that occupancy is a genuine autoinhibited state of human AP-3 rather than a feature
    of the reconstituted, cargo-free complex.
  boundary: 'The structural observation is solid and unexpected: in the cargo-engaged human AP-3 structure
    the tyrosine motif is in the mu3 pocket while the dileucine pocket on sigma3 is filled by the N-terminal
    extension of beta3, and the authors offer the alternative that full activation requires ejection of
    that tail. AP-1 and AP-2 have the equivalent extensions and release them on activation. What is missing
    is any measurement of dileucine-peptide binding to the assembled complex with and without the beta3
    extension, and any test of whether the two cargo sites are coupled.'
