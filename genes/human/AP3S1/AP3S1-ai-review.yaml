core_functions:
- description: 'As the small subunit of AP-3, sigma3A forms the delta-sigma3A hemicomplex that recognises
    acidic dileucine sorting signals in the cytosolic tails of transmembrane cargo, capturing that cargo
    into AP-3-coated carriers budding from tubular sorting endosomes. The activity belongs to the hemicomplex,
    not to sigma3A alone -- these signals bind no single AP subunit -- but the hydrophobic pockets are
    on sigma3A itself and substituting them abolishes binding, and in AP-3 (unlike AP-1) sigma3A also
    supplies one of the two basic residues that grip the acidic position of the motif. The molecular_function
    slot records what sigma3A enables on its own: it is an obligate structural chain of the AP-3 core,
    pairing with delta as a stable hemicomplex. GO:0140312 is used rather than its only child GO:0035615,
    whose definition restricts it to the formation of endocytic vesicles -- which AP-3 does not do.'
