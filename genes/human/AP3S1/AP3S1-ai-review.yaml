proposed_new_terms:
- proposed_name: dileucine sorting signal binding
  proposed_definition: Binding to an acidic dileucine sorting signal, a short peptide motif of the form
    acidic residue - X - X - X - Leu - Leu/Ile in the cytosolic tail of a transmembrane protein, which
    directs that protein into coated carriers at the trans-Golgi network, endosomes or the plasma membrane.
  justification: 'GO expresses the tyrosine-based branch of adaptor cargo recognition through GO:0089710
    endocytic targeting sequence binding, whose definition requires an essential tyrosine and internalization
    by clathrin-coated pits, but it has no counterpart for the dileucine branch. Checked independently
    for this review: a QuickGO ontology search for ''dileucine'' returns zero hits; searches for ''sorting
    signal binding'' and ''targeting sequence binding'' return only the tyrosine, signal- and transit-peptide
    receptor terms; and GO:0140312 cargo adaptor activity has exactly one child, GO:0035615. The consequence
    is that a well-characterised, subunit-attributable activity -- demonstrated for sigma3A by yeast three-hybrid,
    GST pull-down and point mutagenesis (V94D, L109S) across four independent signals -- can currently
    only be annotated through a complex-level coat-binding term. The term would apply to the sigma and
    large subunits of AP-1, AP-2 and AP-3 across eukaryotes, with contributes_to, since the site straddles
    the two subunits. On the choice of parent: GO:0005515 protein binding is normally a term to avoid
    and is used here deliberately, because GO:0089710 -- the tyrosine counterpart this proposal mirrors
    -- is itself is_a GO:0005515 (is_a ancestors GO:0005515, GO:0005488, GO:0003674, checked on QuickGO),
    so mirroring it places the two motif-binding siblings in one genus. The same term was proposed independently
    in this repository''s AP1S1 review; this is the AP-3 half of the same gap, not a second request.'
  proposed_parent:
    id: GO:0005515
    label: protein binding
  supported_by:
  - reference_id: PMID:14691137
    supporting_text: signals from the human immunodeficiency virus negative factor protein and the lysosomal
      integral membrane protein II interact with combinations of the gamma and sigma1 subunits of AP-1
      and the delta and sigma3 subunits of AP-3, but not the analogous combinations of AP-2 and AP-4 subunits
  - reference_id: PMID:14691137
    supporting_text: These observations reveal a novel mode of recognition of sorting signals involving
      the gamma/delta and sigma subunits of AP-1 and AP-3.
  - reference_id: PMID:21097499
