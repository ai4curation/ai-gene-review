- gap_statement: What decides whether a given acidic dileucine signal is read by the AP-1 gamma1-sigma1A
    hemicomplex or by the AP-3 delta-sigma3 hemicomplex is not understood, and the sigma-side contribution
    to that choice has not been isolated.
  boundary: 'The phenomenon is well documented. Several cargoes bind both adaptors -- tyrosinase binds
    gamma1-sigma1A and delta-sigma3 -- while single-residue changes in an OCA2 signal can be engineered
    to favour one adaptor over the other, and only AP-3 binding gives steady-state melanosome localisation.
    Discrimination also runs in the other direction: of five Nef variants tested, all bound gamma1-sigma1A
    but only two bound delta-sigma3A. Mutagenesis has mapped the shared site onto all three complexes
    and shown which residues matter for which signal, but the pockets are nearly identical between sigma1A
    and sigma3A, so the determinant is most likely in the large subunit or in accessibility rather than
    in the sigma pocket itself. That has not been tested with chimeric hemicomplexes.'
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: Adaptor choice is what routes a membrane protein to a lysosome rather than to a melanosome
    or back to the surface. Until the determinant is known, the specificity of a sigma subunit cannot
    be predicted from sequence -- which is exactly the inference an automated pipeline would attempt --
    and AP-1 and AP-3 cargo assignments have to be made one cargo at a time.
  resolution: Test chimeric hemicomplexes pairing gamma1 with sigma3A and delta with sigma1A against a
    panel of signals with known adaptor preference, and ask which subunit carries the preference.
