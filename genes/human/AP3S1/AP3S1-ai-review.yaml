- term:
    id: GO:0008286
    label: insulin receptor signaling pathway
  evidence_type: TAS
  original_reference_id: PMID:9792713
  qualifier: involved_in
  review:
    summary: Insulin receptor signalling, from a 1998 traceable author statement. The paper reports a
      binding observation and closes on a hypothesis; no step of the pathway is shown to be executed by
      sigma3A.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'The finding is real as far as it goes: a 3T3-L1/3T3-F442A adipocyte expression library screened
      with IRS-1 pulled out a sigma3A cDNA, and GST-sigma3A released IRS-1 from low-density membranes.
      What the paper does not show is any signalling step. The term''s definition is ''The series of molecular
      signals generated as a consequence of the insulin receptor binding to insulin'', and the authors
      themselves state only that the results are ''consistent with the hypothesis that sigma3A serves
      as an IRS-1 receptor''. Nothing has confirmed it since: PubMed''s cited-in link set for this PMID
      returns 5 papers, against 119 for PMID:14691137 and 70 for PMID:21097499 by the same query; a PubMed
      search for ''sigma3A adaptor'' returns two papers in total; and UniProt''s SUBUNIT line for Q92572
      lists AGAP1 and BLOC-1 but not IRS1. TAS is a traceable author statement, not an experimental code,
      so the deference owed to a curator who read an assay does not apply here. Marked as an over-annotation
      rather than removed: the interaction itself is not contradicted, it simply does not support a pathway-participation
      claim.'
    supported_by:
    - reference_id: PMID:9792713
      supporting_text: 'A cDNA clone that encodes sigma3A, a small subunit of the AP-3 adaptor protein

        complex, was demonstrated to bind IRS-1 utilizing this cloning strategy.'
    - reference_id: PMID:9792713
      supporting_text: 'These

        results are consistent with the hypothesis that sigma3A serves as an IRS-1

        receptor that may dictate the subcellular localization and the signaling

        functions of IRS-1.'
