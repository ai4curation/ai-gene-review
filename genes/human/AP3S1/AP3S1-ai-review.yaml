  review:
    summary: Asserts that AP3S1 binds the AP-3 adaptor complex. AP3S1 is a constitutive subunit of that
      complex, and GO already records the relation, three times, as GO:0030123 part_of.
    action: REMOVE
    reason: 'The term is defined as ''Binding to an AP-3 adaptor complex'', with a definition that goes
      on to enumerate the beta3, delta, mu3 and sigma3 subunits -- one of which is the annotated protein.
      Typing a constitutive subunit as a ligand of its own complex is a role conflation; the relation
      GO provides for a subunit is part_of, and this gene carries it on GO:0030123 by IDA, by NAS and
      by IEA. This is not an isolated slip: a QuickGO query for GO:0035651 restricted to human returns
      29 annotations over 28 entities, and all seven human AP-3 subunit genes are among them -- AP3B1,
      AP3B2, AP3D1, AP3M1, AP3M2, AP3S1, AP3S2 -- every one by IEA, alongside the entities that do have
      experimental evidence for binding AP-3 from outside it (PI4K2A by IDA, RAB32 and RAB38 by IPI).
      The complex''s own subunits have been swept in with its ligands. The proximate source is the mouse
      Ap3s1 IDA on PMID:19010779, a study in which AP-3 was the cross-linking bait and BLOC-1, BLOC-2,
      HOPS, clathrin and PI4KIIalpha were the associated proteins; that cache is abstract-only, so this
      argument deliberately does not rest on anything inside the assay. It rests on the relation: no experiment
      can make a constitutive subunit a ligand of the complex it constitutes. Note also that this is the
      gene''s only molecular-function row in GOA, which is why the review adds a subunit-level MF rather
      than leaving the aspect empty. The merged sibling reviews of AP3D1 and AP3M1 grade this same IEA
      row MARK_AS_OVER_ANNOTATED rather than REMOVE, on the ground that the mouse IDA behind it is a real
      observation read in full by MGI curators. REMOVE is preferred here because the row being removed is
      the human IEA projection, not the mouse IDA; because the family-wide sweep (all seven human AP-3
      subunits, every one by IEA) shows the defect is in the relation type, not in any one experiment;
      and because a subunit that coassembles with delta into the complex core cannot be a ligand of that
      complex under the definition of the term. The sibling verdicts are noted so the family carries one
      argument with an explicit choice of action, and harmonising them to REMOVE is recommended.'
    supported_by:
