- id: PMID:9545220
  title: Association of the AP-3 adaptor complex with clathrin.
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Establishes the AP-3/clathrin association through the beta3 appendage. Cited by ComplexPortal
      for the AP-3-mediated cargo-loading row, which this review accepts as core. Cached abstract-only;
      the abstract carries the claim used.
- id: PMID:9697856
  title: Mutation in AP-3 delta in the mocha mouse links endosomal transport to storage deficiency in
    platelets, melanosomes, and synaptic vesicles.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'The mocha paper: a delta-subunit null linking AP-3 to melanosome, platelet dense granule
      and synaptic vesicle cargo. Complex-level evidence, used here to support the LRO rows as real biology
      while grading them non-core for this subunit. Cached abstract-only.'
- id: PMID:9792713
  title: Interaction of insulin receptor substrate-1 with the sigma3A subunit of the adaptor protein complex-3
    in cultured adipocytes.
  full_text_unavailable: true
  reference_review:
    relevance: LOW
    correctness: LOW_QUALITY
    review_notes: 'The sole source of the insulin-receptor-signalling row. Correctly cited and the interaction
      is real as reported, but the paper itself frames the functional claim as a hypothesis and nothing
      has confirmed it in 28 years: 5 PMC-indexed citing papers, and UniProt''s SUBUNIT line for Q92572
      does not list IRS1. Graded LOW_QUALITY for the annotation it supports, not for the biochemistry
      it reports. Cached abstract-only.'
- id: file:human/AP3S1/AP3S1-bioinformatics/RESULTS.md
  title: 'AP3S1 (sigma3A): the AP-3 dileucine pocket, and whether sigma3A differs from sigma3B'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'This review''s own analysis. Fetches ten sigma subunits live from UniProt, asserts
      every sequence length, verifies the five literature-named sigma3A residues, reproduces the published
      sigma2-to-sigma3A correspondences by independent alignment, and reports two deliberately unflattering
      controls: the verified non-binder sigma4 scores as well at the pocket as the binders, and sigma3A
      and sigma3B are identical at every pocket position.'
- id: file:human/AP3S1/AP3S1-deep-research-affinage.md
  title: Affinage mechanistic annotation for AP3S1 (human)
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: 'Machine-fetched Affinage record. Trust gates clear (self_evaluation_pairwise: win,
      faith_pct 100.0) and the record describes the right protein -- it names CLAPS3/AP3S1, gives uniprot_accession
      Q92572 and correctly places it in AP-3 -- so there is no symbol collision. All four of its citations
      are numeric PMIDs and all four were re-read. Its mechanism_profile GO grounding (GO:0060090) was
      not imported; the molecular function was re-grounded from the primary literature. Graded MEDIUM
      because it missed the entire dileucine literature, the AP-3 structure and the subunit-assembly genetics
      -- the whole molecular-function story for this gene.'
- id: file:human/AP3S1/AP3S1-uniprot.txt
  title: UniProtKB record Q92572 (AP3S1_HUMAN), AP-3 complex subunit sigma-1
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The machine-fetched UniProt record for Q92572, asserted to be the expected protein (AP3S1_HUMAN,
      193 aa) rather than a merged accession. Used for the subcellular location, the PDB and ComplexPortal
      cross-references, the PANTHER, PROSITE, FunFam and InterPro signatures and the chromosome assignment.
      Every quoted line is a single physical line of the flat file.
existing_annotations:
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:16162817
  qualifier: enables
  supporting_entities:
  - UniProtKB:P14679
  review:
    summary: Bare 'protein binding' recording the interaction with UniProtKB:P14679, human tyrosinase.
      The partner resolves, and the interaction has a specific, well-characterised molecular content that
      the term discards.
    action: MODIFY
    proposed_replacement_terms:
    - id: GO:0140312
      label: cargo adaptor activity
    reason: 'P14679 is TYR, human tyrosinase (UniProt, checked). What the cited paper shows is not a generic
      protein-protein contact but cargo-signal recognition: the acidic dileucine motif in the tyrosinase
      cytosolic tail is bound by the delta-sigma3 hemicomplex of AP-3, in a yeast three-hybrid assay that
      is negative for the corresponding AP-2 and AP-4 hemicomplexes, and GST pull-downs show the same
      interaction with native AP-3 and its dependence on the two leucines of the motif. ''protein binding''
      is exactly the term the curation guidelines say to replace, and there is a real molecular function
      underneath it. The replacement is GO:0140312 cargo adaptor activity rather than its only child GO:0035615
      clathrin-cargo adaptor activity, because GO:0035615 is defined as ''Bringing together a cargo protein
      with clathrin, responsible for the formation of endocytic vesicles'' and AP-3 is not an endocytic
      coat -- it acts on exit from tubular sorting endosomes. I checked the QuickGO children endpoint:
      GO:0035615 is GO:0140312''s only child, so the parent is the most specific term in that lineage
      that does not assert endocytosis. The activity belongs to the hemicomplex rather than to sigma3A
      alone -- these signals bind no single AP subunit -- but the pockets that accept the leucines are
      on sigma3A itself, and substituting them (V94D, L109S) abolishes binding, which is why the matching
      core function uses contributes_to_molecular_function. GO has no term for the precise activity, dileucine
      sorting-signal binding; that is recorded as a proposed new term and an ONTOLOGY knowledge gap.'
    supported_by:
    - reference_id: PMID:16162817
      supporting_text: Using this assay, the tyrosinase cytoplasmic domain interacts with hemicomplexes
        from AP-1 and AP-3 but not with those of AP-2 and AP-4
    - reference_id: PMID:16162817
      supporting_text: we show for the first time that the cytoplasmic dileucine-based sorting signal
        of tyrosinase binds not only to the δ-σ3 hemicomplexes of AP-3, confirming an AP-3 interaction
    - reference_id: PMID:16162817
      supporting_text: GST pull-down assays confirmed the interactions of the tyrosinase cytoplasmic domain
        with the native AP-1 and AP-3 complexes and the dependence of these interactions on leucine residues
        517 and 518 but not those at 527 and 528
    - reference_id: PMID:16162817
      supporting_text: Both adaptors recognize the tyrosinase dileucine-based melanosome sorting signal,
        and tyrosinase largely colocalizes with each adaptor on endosomes.
    - reference_id: PMID:14691137
      supporting_text: signals from the human immunodeficiency virus negative factor protein and the lysosomal
        integral membrane protein II interact with combinations of the gamma and sigma1 subunits of AP-1
        and the delta and sigma3 subunits of AP-3, but not the analogous combinations of AP-2 and AP-4
        subunits
    - reference_id: PMID:21097499
      supporting_text: This is evidenced by the loss of signal binding by the σ2 V88D or L103S substitutions
        and the homologous σ1A V88D and I103S and σ3A V94D and L109S substitutions.
    - reference_id: PMID:21097499
      supporting_text: signals, on the other hand, do not bind to any single AP subunit but to combinations
        of γ-σ1, α-σ2, and δ-σ3 subunits, as demonstrated by the use of yeast three-hybrid (Y3H) and in
        vitro binding assays
    - reference_id: file:human/AP3S1/AP3S1-bioinformatics/RESULTS.md
      supporting_text: 'All five verify. Q92572 is at sequence version 1 and is 193 aa, matching the length

        asserted by the script.'
    - reference_id: file:human/AP3S1/AP3S1-bioinformatics/RESULTS.md
      supporting_text: 'Identity at this pocket therefore does not separate

        binders from the non-binder, and the conservation argument for sigma3A carries no weight

        on its own.'
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: UniProtKB:P14679
        source_label: TYR, Homo sapiens tyrosinase, the interaction partner
        source_status: SUPPORTS_TRANSFER
        comment: 'The interaction partner, resolved in UniProt to TYRO_HUMAN, tyrosinase, gene TYR, Swiss-Prot,
          529 aa. It is not an incidental interactor: its cytosolic tail carries an acidic dileucine sorting
          signal whose two leucines the cited paper shows are required for binding native AP-3, and the
          same paper localises the binding to the delta-sigma3 hemicomplexes. This block is attached to
          a direct IPI rather than to a propagated row -- the schema places residue_claims inside propagation_review,
          and this is the row whose action rests on the residue argument, so the claims are recorded here
          in checkable form together with the resolved partner.'
      residue_claims:
      - claim_type: RETAINED
        anchor:
          accession: UniProtKB:P53680
          position: 88
          residue: V
          sequence_version: 2
        target:
          accession: UniProtKB:Q92572
          position: 94
          residue: V
          sequence_version: 1
        role: hydrophobic pocket accepting the first Leu of the acidic dileucine sorting signal
        method: MSA
        comment: 'sigma3A V94D abolishes dileucine-signal binding (PMID:21097499). The anchor is the structurally
          defined sigma2 pocket position; the correspondence was reproduced independently by global pairwise
          alignment in AP3S1-bioinformatics/ and matches the position the paper states. Retained, but
          note the analysis''s own negative control: sigma4, which does not bind these signals, scores
          as well at this site, so retention is not by itself evidence of the activity.'
      - claim_type: RETAINED
        anchor:
          accession: UniProtKB:P53680
          position: 103
          residue: L
          sequence_version: 2
        target:
          accession: UniProtKB:Q92572
          position: 109
          residue: L
          sequence_version: 1
        role: hydrophobic pocket accepting the Leu/Ile of the acidic dileucine sorting signal
        method: MSA
        comment: sigma3A L109S abolishes dileucine-signal binding (PMID:21097499). Correspondence reproduced
          by the alignment in AP3S1-bioinformatics/ and matching the published position. sigma3A and sigma3B
          carry Leu here where the AP-1 sigmas carry Ile.
      - claim_type: RETAINED
        anchor:
          accession: UniProtKB:P53680
          position: 15
          residue: R
          sequence_version: 2
        target:
          accession: UniProtKB:Q92572
          position: 15
          residue: R
          sequence_version: 1
