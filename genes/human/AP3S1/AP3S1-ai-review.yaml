      subunit: melanosomes exist in one cell type, AP-3 and AP-1 provide partially redundant routes to
      them, and the reference is projected across 48 entities. The general function -- delivering dileucine
      cargo out of sorting endosomes -- is what is core; melanosome assembly is one of its cell-type-specific
      consequences.'
