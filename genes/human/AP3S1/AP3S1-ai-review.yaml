- id: PMID:9118953
  title: 'AP-3: an adaptor-like protein complex with ubiquitous expression.'
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'The paper that identified sigma3A and sigma3B and named AP-3. Source of the only IDA
      on this gene. Projection checked: QuickGO returns 3 annotations over 2 entities for this reference,
      exactly the two sigma3 proteins, so the row is specific rather than a complex-wide projection. Cached
