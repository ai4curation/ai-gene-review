- gap_statement: 'The delta-ear/sigma3 interaction that gates AP-3 membrane recruitment has no known regulator:
    it is not known what relieves it in cells, nor where on sigma3A the ear binds.'
  boundary: 'The interaction itself is characterised and is unusually specific in its effect: the ear
    domain of delta binds sigma3, this blocks AP-3 binding to Arf while leaving dileucine-signal binding
    intact, and the isolated delta ear inhibits AP-3 recruitment to membranes in vitro and in vivo and
    impairs lysosomal membrane protein sorting. So the switch acts on the recruitment step, not on cargo
    recognition. What is missing is the binding surface on sigma3A, any physiological input that toggles
    it, and whether the phosphoserine UniProt records at sigma3A position 191 is involved.'
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: 'If this is a regulated switch, sigma3A is not only a cargo-binding and structural subunit
    but also the target of AP-3''s recruitment control, which would be a third, currently unannotatable
    role for the protein. It also matters for interpreting AP-3''s constitutively open conformation: an
    open complex still has to be kept off membranes somehow.'
  resolution: Map the delta-ear footprint on sigma3A, then make separation-of-function sigma3A mutants
    that lose ear binding but keep the cargo pocket, and test whether AP-3 becomes constitutively membrane-associated.
