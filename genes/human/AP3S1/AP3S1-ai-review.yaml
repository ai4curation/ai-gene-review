- term:
    id: GO:0016183
    label: synaptic vesicle coating
  evidence_type: NAS
  original_reference_id: PMID:15537701
  qualifier: involved_in
  review:
    summary: Synaptic vesicle coating, from ComplexPortal. AP-3 does coat synaptic vesicles, but this
      term's definition describes coated-pit formation at the presynaptic plasma membrane, which is AP-2
      territory.
    action: MODIFY
    proposed_replacement_terms:
    - id: GO:0016182
      label: synaptic vesicle budding from endosome
    reason: 'Decided from the definition rather than the label. GO:0016183 is defined as ''The formation
      of clathrin coated pits in the presynaptic membrane endocytic zone, triggered by the presence of
      high concentrations of synaptic vesicle components'' -- a plasma-membrane endocytic event. AP-3
      is not a plasma-membrane adaptor: it acts on exit from tubular sorting endosomes, and its synaptic
      role in the cited paper is the delivery of ZnT3 and ClC-3 into synaptic vesicles, not the nucleation
      of endocytic pits. GO already has the right term: GO:0016182 synaptic vesicle budding from endosome,
      ''Budding of synaptic vesicles during the formation of constitutive recycling vesicles from early
