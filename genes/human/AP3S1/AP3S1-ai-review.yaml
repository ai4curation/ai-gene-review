id: Q92572
gene_symbol: AP3S1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'AP3S1 encodes sigma3A, the small subunit of adaptor protein complex 3 (AP-3), the heterotetrameric
  coat adaptor that selects transmembrane cargo out of tubular sorting endosomes and delivers it to lysosomes
  and to lysosome-related organelles such as melanosomes, platelet dense granules and synaptic vesicles.
  AP-3 is built from two large chains (delta, encoded by AP3D1, plus beta3A or the neuron-enriched beta3B),
  a medium chain (mu3A or mu3B) and a small chain (sigma3A or sigma3B), so a cell can assemble several
  isoform combinations; sigma3A and sigma3B are both expressed in a wide range of tissues. The complex
  is recruited to membranes by Arf1-GTP through its delta subunit, associates with clathrin through the
  beta3 appendage, and is released again after the vesicle buds.


  Within the complex, sigma3A is not an inert filler. Cargo is selected through two classes of cytosolic
  sorting signal that bind different parts of AP-3: tyrosine-based YxxO motifs bind the mu3 subunit, while
  acidic dileucine motifs bind no single subunit but a composite site formed by the delta and sigma3 chains
  together. sigma3A supplies the hydrophobic pockets of that site and one of the two basic residues that
  grip the acidic position of the motif; substituting the pocket residues abolishes signal binding, and
  sigma3A is one of the four chains of the solved human AP-3 core, where the same pocket is found occupied
  by the N-terminal extension of beta3 in the cargo-free state. sigma3A pairs with delta as a stable hemicomplex
  that survives loss of the other two subunits. Cargoes routed this way include the lysosomal membrane
  proteins LAMP-1, LAMP-2, CD63 and LIMP-II, the melanosomal enzymes tyrosinase and OCA2, the zinc transporter
  ZnT3 and the lipid kinase PI4KIIalpha; HIV-1 Nef subverts the same site.


  Loss of AP-3 function is a disease mechanism in its own right. Mutations in the beta3A subunit cause
  Hermansky-Pudlak syndrome type 2, with oculocutaneous albinism, a bleeding diathesis from platelet dense-granule
  deficiency and immune defects, and the mouse mutants mocha and pearl, null for the delta and beta3A
  subunits, combine coat-colour dilution, platelet storage-pool deficiency and neurological deficits.
  No human disease has yet been attributed to AP3S1 itself, and the functional division of labour between
  sigma3A and sigma3B remains unresolved.'
