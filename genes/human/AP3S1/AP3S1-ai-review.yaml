- id: PMID:10024875
  title: Altered trafficking of lysosomal proteins in Hermansky-Pudlak syndrome due to mutations in the
    beta 3A subunit of the AP-3 adaptor.
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: 'Hermansky-Pudlak syndrome type 2: beta3A mutations, AP-3 loss and mislocalised CD63,
      LAMP-1 and LAMP-2. Complex-level, used for the lysosomal-sorting argument behind the GO:0006896
      modification. Cached abstract-only.'
- id: PMID:11807095
  title: Assembly and function of AP-3 complexes in cells expressing mutant subunits.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'The subunit-assembly genetics: in delta-null cells sigma3 is left monomeric, in beta3A-null
      cells delta and sigma3 coassemble. The clearest genetic statement of sigma3''s structural partner,
      and also the source of the finding that the beta3 clathrin box is dispensable for function. Full
      text available and read.'
- id: PMID:14691137
  title: Recognition of dileucine-based sorting signals from HIV-1 Nef and LIMP-II by the AP-1 gamma-sigma1
    and AP-3 delta-sigma3 hemicomplexes.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'The decisive paper for this gene''s molecular function: yeast three-hybrid demonstration
      that acidic dileucine signals bind the delta-sigma3 hemicomplex of AP-3 and the gamma1-sigma1A hemicomplex
      of AP-1, and not the AP-2 or AP-4 equivalents. Also the only source that tests sigma3A and sigma3B
      side by side. Full text available and read. Not found by affinage.'
- id: PMID:15051738
  title: Localization of the AP-3 adaptor complex defines a novel endosomal exit site for lysosomal membrane
    proteins.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Immuno-EM localisation of AP-3 to budding profiles on tubular sorting endosomes, and
      the basis for treating the mammalian AP-3 route as endosome-to-lysosome rather than Golgi-to-vacuole.
      Full text available and read.
- id: PMID:15469849
  title: An ear-core interaction regulates the recruitment of the AP-3 complex to membranes.
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: 'A sigma3-specific regulatory mechanism: the delta ear binds sigma3 and blocks Arf binding
      without affecting dileucine-signal binding, inhibiting membrane recruitment. Used for a knowledge
      gap and a suggested experiment rather than for an annotation, since it describes regulation of sigma3
      rather than an activity of sigma3. Cached abstract-only; the abstract carries the claims used.'
- id: PMID:15537701
  title: Genetic analysis of the neuronal and ubiquitous AP-3 adaptor complexes reveals divergent functions
    in brain.
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The beta3A/beta3B genetic comparison in mouse brain, cited by ComplexPortal for the
      two synaptic rows. Supports the existence of a neuronal AP-3 variant containing sigma3A and its
      role in synaptic vesicle composition; does not address coated-pit formation, which is why the synaptic-vesicle-coating
      term is modified. Cached abstract-only.
- id: PMID:16162817
  title: Functions of adaptor protein (AP)-3 and AP-1 in tyrosinase sorting from endosomes to melanosomes.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'The source of this gene''s protein-binding IPI, and the paper that identifies the partner
      as a dileucine cargo rather than a generic interactor: the tyrosinase tail binds the delta-sigma3
      hemicomplexes, and AP-3-deficient melanocytes missort tyrosinase into endosomes. Full text available
      and read. Not found by affinage.'
- id: PMID:16837549
  title: BLOC-1 interacts with BLOC-2 and the AP-3 complex to facilitate protein trafficking on endosomes.
  full_text_unavailable: true
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: BLOC-1/AP-3 interaction on early-endosome tubules; the source of the mouse CACAO IMP
      behind the transferred 'membrane' row. Cited to show that the source experiment supports a far more
      specific location than the root-level term transferred from it. Cached abstract-only.
- id: PMID:17360967
  title: The gamma/sigma1 and alpha/sigma2 hemicomplexes of clathrin adaptors AP-1 and AP-2 harbor the
    dileucine recognition site.
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Independent biochemical confirmation that the dileucine site sits on the large/sigma
      hemicomplex rather than on beta or mu, using purified AP-1 and AP-2 subunits. Not about AP-3, and
      cited only for that shared architectural point. Cached abstract-only.
- id: PMID:19010779
  title: Hermansky-Pudlak syndrome protein complexes associate with phosphatidylinositol 4-kinase type
    II alpha in neuronal and non-neuronal cells.
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
