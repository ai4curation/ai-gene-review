- id: PMID:20713646
  title: Combined zebrafish-yeast chemical-genetic screens reveal gene-copper-nutrition interactions that
    modulate melanocyte pigmentation.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: A zebrafish-yeast chemical-genetic screen in which partial knockdown of the ap3s1 orthologue
      itself sensitises melanocytes to hypopigmentation under low copper. The only gene-level in vivo
      perturbation of this gene's orthologue in the corpus, which is why it is cited on the melanosome
      row. Found by affinage; re-read and verified. Full text available.
- id: PMID:21097499
  title: Conservation and diversification of dileucine signal recognition by adaptor protein (AP) complex
    variants.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The mutagenesis paper that maps the dileucine site onto AP-3 and names the sigma3A residues
      directly (V94D and L109S abolish binding; Arg 15 and Leu 107 contribute). The single most important
      reference for this gene's molecular function, and the basis for the residue claims and the bioinformatics
      analysis. Full text available and read. Not found by affinage.
- id: PMID:21998198
  title: The schizophrenia susceptibility factor dysbindin and its associated complex sort cargoes from
    cell bodies to the synapse.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: 'The source of the mouse IMP behind the axonal and synaptic-vesicle transport rows.
      Read in full to establish what was perturbed: the genetics is the mocha Ap3d1 null, with sigma3
      appearing as an immunoblot readout. Correctly cited; the review grades the derived rows non-core
      on that basis rather than disputing them. Full text available.'
- id: PMID:22718909
  title: Differential recognition of a dileucine-based sorting signal by AP-1 and AP-3 reveals a requirement
    for both BLOC-1 and AP-3 in delivery of OCA2 to melanosomes.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: OCA2 dileucine-signal mutagenesis separating AP-1-preferring from AP-3-preferring variants,
      showing that AP-3 binding is required for steady-state melanosome localisation. Cited in a knowledge
      gap about what distinguishes AP-1 from AP-3 signal preference. Full text available.
- id: PMID:23247405
  title: Cell type-specific Rab32 and Rab38 cooperate with the ubiquitous lysosome biogenesis machinery
    to synthesize specialized lysosome-related organelles.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: 'A Small GTPases commentary on Bultema et al. 2012, and the reference ComplexPortal
      uses for four of this gene''s rows. Correctly cited but broad: a QuickGO query by this reference
      returns 178 annotations over 48 entities across AP-1, AP-3 and BLOC-2 in human and mouse. Full text
      available and read; graded LOW for relevance to AP3S1 specifically because it says nothing about
      sigma3A.'
- id: PMID:39705307
  title: A structure-based mechanism for initiation of AP-3 coated vesicle formation.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'The human AP-3 cryo-EM study. Contains this protein: UniProt maps PDB 9C58, 9C59, 9C5B
      and 9C5C to Q92572 with chain S over residues 1-193. Source of the NEW structural molecule activity
      row and of the observation that the sigma3 dileucine pocket is occupied by the beta3 N-terminal
      extension in the cargo-free state. Full text available and read. Not found by affinage; located
      by resolving the UniProt PDB cross-references through the RCSB API.'
- id: PMID:8697810
  title: Cloning, expression pattern and mapping to 12p 13.2 --> p13.1 of CLAPS3, a gene encoding a novel
    clathrin-adaptor small chain.
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The CLAPS3 cloning paper and the source of the AP-type-complex TAS row. Establishes
