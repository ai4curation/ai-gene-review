- term:
    id: GO:0005769
    label: early endosome
  evidence_type: NAS
  original_reference_id: PMID:23247405
  qualifier: located_in
  review:
    summary: Early endosome, from a ComplexPortal curator statement citing a Rab32/Rab38 review. The compartment
      is right and is where AP-3 does its work.
    action: ACCEPT
    reason: The evidence code is weak and the reference is a review projected across many gene products,
      but the location is the one the primary literature converged on. Immuno-electron microscopy places
      AP-3 on budding profiles of a tubular endosomal compartment, quantitative EM in melanocytes places
      it on endosome-derived membranes carrying tyrosinase, and the cited review itself describes AP-3
      acting with Rab32 and Rab38 on early/recycling endosome tubules. This is where AP-3 selects cargo,
      so the term is core rather than merely defensible. Retained despite the NAS code, because the claim
      is true and duplicate support across evidence codes is legitimate.
    supported_by:
    - reference_id: PMID:23247405
      supporting_text: Rab32 and Rab38 interact with AP-1, AP-3 and BLOC-2 on early/recycling endosome
        tubules, where cargo such as tyrosinase and Tyrp1 are loaded into vesicles or transport intermediates.
    - reference_id: PMID:15051738
      supporting_text: Here, we show by immuno-electron microscopy that AP-3 is associated with budding
        profiles evolving from a tubular endosomal compartment that also exhibits budding profiles positive
        for AP-1.
    - reference_id: PMID:15051738
      supporting_text: we propose that AP-3 defines a novel pathway by which lysosomal membrane proteins
        are transported from tubular sorting endosomes to lysosomes.
    - reference_id: PMID:16162817
      supporting_text: The results indicate that tyrosinase traffics through the early endocytic system
        and that mammalian AP-3 functions on early endosomes to divert tyrosinase away from a pathway
        leading to multivesicular endosomes and toward one leading to melanosomes.
    - reference_id: PMID:16162817
      supporting_text: These data show that tyrosinase is concentrated in AP-3-coated membranes essentially
        of endosomal origin.
- term:
    id: GO:0005794
    label: Golgi apparatus
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0132
  review:
    summary: Golgi apparatus, transferred from the UniProt subcellular-location vocabulary. Real, but
      it is the 1997 immunofluorescence compartment rather than the compartment where AP-3 was later shown
      to act.
    action: KEEP_AS_NON_CORE
    reason: 'The vocabulary step itself is exact -- SL-0132 is UniProt''s ''Golgi apparatus'' term and
      its GO mapping is GO:0005794, checked against the UniProt locations API -- and the underlying UniProt
      statement is genuine. What makes this non-core rather than core is the resolution of the evidence
      behind it. The Golgi assignment comes from immunofluorescence in the two 1997 papers that identified
      AP-3, which describe the complex in ''the Golgi region of the cell as well as with more peripheral
      structures'' and note that those peripheral structures colocalise only weakly with endosomal markers;
      the same authors were explicit that the peripheral compartment was unidentified. Immuno-EM later
      resolved it: AP-3 buds from tubular sorting endosomes, and in melanocytes tyrosinase is concentrated
      in AP-3-coated membranes ''essentially of endosomal origin''. Juxtanuclear staining at IF resolution
      does not separate the TGN from perinuclear endosomes. The UniProt CC line carries no ECO evidence
      tag at all, so there is no experimental attribution to defer to either. Kept, because a Golgi-region
      pool is reported and not contradicted; marked non-core because the informative locations are the
      endosome and the coated-vesicle membrane.'
    supported_by:
    - reference_id: file:human/AP3S1/AP3S1-uniprot.txt
      supporting_text: 'CC   -!- SUBCELLULAR LOCATION: Golgi apparatus. Cytoplasmic vesicle membrane;'
    - reference_id: PMID:9151686
      supporting_text: Immunofluorescence using anti-delta antibodies reveals that the AP-3 complex is
        associated with the Golgi region of the cell as well as with more peripheral structures.
    - reference_id: PMID:9151686
      supporting_text: These peripheral structures show only limited colocalization with endosomal markers
        and may correspond to a postTGN biosynthetic compartment.
    - reference_id: PMID:9118953
      supporting_text: 'Immunofluorescence microscopy

        analyses show that the sigma3-containing complex is present both in the area of

        the TGN and in peripheral structures, some of which contain the transferrin

        receptor.'
    - reference_id: PMID:15051738
      supporting_text: Here, we show by immuno-electron microscopy that AP-3 is associated with budding
        profiles evolving from a tubular endosomal compartment that also exhibits budding profiles positive
        for AP-1.
    - reference_id: PMID:16162817
      supporting_text: These data show that tyrosinase is concentrated in AP-3-coated membranes essentially
        of endosomal origin.
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
      - source_id: UniProtKB-SubCell:SL-0132
        source_label: UniProt subcellular location SL-0132, Golgi apparatus
        source_status: SUPPORTS_TRANSFER
        comment: 'Verified against the UniProt locations API: SL-0132 is ''Golgi apparatus'' and maps
          to GO:0005794 exactly, so the vocabulary step is faithful. The AP3S1 record states this location
          with no ECO evidence tag, i.e. it is an uncited UniProt assertion rather than a transferred
          experimental one, which is why the row is graded on the underlying literature rather than deferred
          to.'
      residue_claims_not_applicable: A controlled-vocabulary mapping of a whole-protein localisation;
        the question is which compartment the underlying microscopy resolved, not any residue.
- term:
    id: GO:0006886
    label: intracellular protein transport
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR000804
  review:
    summary: InterPro2GO mapping from the clathrin adaptor small-chain conserved site.
    action: ACCEPT
    reason: 'IPR000804 is the conserved site shared by clathrin-adaptor small chains, and its complete
      GO mapping set is GO:0006886, GO:0016192 and GO:0030117 -- all three true of any AP sigma subunit.
      Moving transmembrane proteins between endosomes, lysosomes and lysosome-related organelles is intracellular
      protein transport by definition. The term is general, and generality is correct here: the signature
      is shared across the AP-1, AP-2, AP-3 and AP-4 sigmas, which act in different compartments, so a
      more specific term at the level of this signature would over-reach.'
    supported_by:
    - reference_id: file:human/AP3S1/AP3S1-uniprot.txt
      supporting_text: DR   PROSITE; PS00989; CLAT_ADAPTOR_S; 1.
    - reference_id: PMID:9545220
      supporting_text: "A heterotetrameric complex termed AP-3 is involved in signal-mediated protein\
        \ \nsorting to endosomal-lysosomal organelles."
    - reference_id: PMID:39705307
      supporting_text: Adaptor protein complex-3 (AP-3) mediates cargo sorting from endosomes to lysosomes
        and lysosome-related organelles.
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: InterPro:IPR000804
        source_label: InterPro IPR000804, Clathrin adaptor complex, small chain (conserved site)
        source_status: SUPPORTS_TRANSFER
        comment: 'Confirmed against the InterPro API: a conserved_site entry, ''Clathrin adaptor complex,
          small chain'', whose complete GO mapping set is GO:0006886, GO:0016192 and GO:0030117. AP3S1
          carries the signature (PROSITE PS00989 CLAT_ADAPTOR_S on its UniProt record), and all three
          mapped terms are true of every AP sigma subunit, so the mapping holds across the whole signature
          rather than being merely permitted for this member.'
      residue_claims_not_applicable: A domain-signature-to-GO mapping; the protein matches the signature
        and the question is the breadth of the term, not a residue.
- term:
    id: GO:0006896
    label: Golgi to vacuole transport
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR027155
  review:
    summary: Golgi to vacuole transport, from the AP-3-sigma-specific InterPro family entry. The process
      is right but the donor compartment is the fungal one.
    action: MODIFY
    proposed_replacement_terms:
    - id: GO:0008333
      label: endosome to lysosome transport
    reason: 'IPR027155 is the AP-3-sigma family entry (''AP-3 complex subunit sigma''), which AP3S1 genuinely
      matches, and its GO mappings are GO:0006896 and GO:0030123. The second is right. The first names
      a route that AP-3 sigma performs in fungi: both AP-3-clade seeds of this family''s PAINT node carry
      GO:0006896 by IMP on their own records (S. cerevisiae Aps3, PMID:9335339; C. albicans Aps3, PMID:20870878,
      QuickGO checked live), which is the ALP pathway from the Golgi to the vacuole. The term is not fungus-only
      -- GO:0090160 Golgi to lysosome transport is its child and lysosome is_a vacuole, so nothing excludes
      mammals a priori -- but the mammalian route was resolved to a different donor compartment. Immuno-EM
      shows AP-3 budding from a tubular endosomal compartment and concludes that lysosomal membrane proteins
      are carried ''from tubular sorting endosomes to lysosomes''; in melanocytes AP-3 acts on early endosomes,
      and the AP-3 cargo it diverts is concentrated on membranes of endosomal origin. So the essence transfers
      and the compartment does not. Modified to GO:0008333 endosome to lysosome transport, which was checked
      on QuickGO: biological_process, not obsolete, is_a GO:0007041 and GO:0016192, so it sits under the
      same vacuolar-transport parent the original row had.'
    supported_by:
    - reference_id: file:human/AP3S1/AP3S1-uniprot.txt
      supporting_text: DR   InterPro; IPR027155; APS3.
    - reference_id: PMID:15051738
      supporting_text: we propose that AP-3 defines a novel pathway by which lysosomal membrane proteins
        are transported from tubular sorting endosomes to lysosomes.
    - reference_id: PMID:15051738
      supporting_text: Here, we show by immuno-electron microscopy that AP-3 is associated with budding
        profiles evolving from a tubular endosomal compartment that also exhibits budding profiles positive
        for AP-1.
    - reference_id: PMID:15051738
      supporting_text: Moreover, recycling of endocytosed LAMP-1 and CD63 back to the cell surface is
        greatly increased in AP-3-deficient cells.
    - reference_id: PMID:16162817
      supporting_text: The results indicate that tyrosinase traffics through the early endocytic system
        and that mammalian AP-3 functions on early endosomes to divert tyrosinase away from a pathway
        leading to multivesicular endosomes and toward one leading to melanosomes.
    - reference_id: PMID:10024875
      supporting_text: The AP-3 deficiency results in increased surface expression of the lysosomal membrane
        proteins CD63, lamp-1, and lamp-2, but not of nonlysosomal proteins.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      source_entities:
      - source_id: InterPro:IPR027155
        source_label: InterPro IPR027155, AP-3 complex subunit sigma (family)
        source_status: SUPPORTS_TRANSFER
        comment: 'Confirmed against the InterPro API: a family entry, ''AP-3 complex subunit sigma'',
          with exactly two GO mappings, GO:0006896 and GO:0030123. AP3S1 is a true member (the signature
          is on its UniProt record). The family spans fungal and animal AP-3 sigmas, and the experimental
          grounding for the Golgi-to-vacuole mapping sits on the fungal members, so the mapping carries
          their compartment rather than the mammalian one.'
      residue_claims_not_applicable: A signature-to-GO mapping whose defect is the donor compartment;
        AP3S1 is a full-length member of the family with no residue-level divergence at issue.
- term:
    id: GO:0008089
    label: anterograde axonal transport
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q9DCR2
  - ensembl:ENSMUSP00000025357
  review:
    summary: Anterograde axonal transport, transferred by Ensembl Compara from the mouse ortholog. Real
      AP-3 biology, but neuronal-context and complex-level.
    action: KEEP_AS_NON_CORE
    reason: 'The orthology is as safe as it gets: the donor is mouse Ap3s1, the 1:1 ortholog, and the
      two proteins are identical over all 193 residues. The mouse source is an IMP from PMID:21998198,
      which shows that BLOC-1 and AP-3 are required to move PI4KIIalpha out of neuronal cell bodies into
      neurites and nerve terminals, and which concludes that this is ''a novel vesicle transport mechanism
      requiring BLOC-1 and AP-3 complexes for cargo sorting from neuronal cell bodies to neurites and
      nerve terminals''. That is a genuine finding and the term fits it. It is not core for this gene:
      the perturbation is a whole-complex null in a single neuronal context, AP3S1 is ubiquitously expressed
      and its defining job is cargo selection on endosomes in every cell type, and this term describes
      the downstream microtubule-based movement of the carriers rather than anything sigma3A does. Kept
      as non-core.'
    supported_by:
    - reference_id: PMID:21998198
      supporting_text: Our findings indicate a novel vesicle transport mechanism requiring BLOC-1 and
        AP-3 complexes for cargo sorting from neuronal cell bodies to neurites and nerve terminals.
    - reference_id: PMID:21998198
      supporting_text: PI4KIIα targeting to neuronal processes is impaired in AP-3–deficient mocha (Ap3d1mh/mh)
        neurons.
    - reference_id: PMID:21998198
      supporting_text: Synaptosome fractions from control brains (lanes 1–8) and AP-3–deficient mocha
        (Ap3d1mh/mh) brains (lanes 1′–8′) were resolved on SDS–PAGE, and the contents were analyzed by
        immunoblot with antibodies against synaptic vesicle markers (SV2, synaptophysin), AP-3–dependent
        synaptic vesicle cargoes (PI4KIIα, VAMP7, ZnT3), and AP-3 σ3 subunit.
    - reference_id: file:human/AP3S1/AP3S1-bioinformatics/RESULTS.md
      supporting_text: there is no divergence anywhere in the protein for the transfer to have to bridge.
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
      - source_id: UniProtKB:Q9DCR2
        source_label: Ap3s1, Mus musculus sigma3A, the 1:1 ortholog of the target
        source_status: SUPPORTS_TRANSFER
        comment: 'One donor under two identifiers, not two: UniProt''s Ensembl cross-reference on Q9DCR2
          is ENSMUST00000025357.9 / ENSMUSP00000025357.8, so the accession and the Ensembl protein id
          name the same mouse protein. Q9DCR2 is AP3S1_MOUSE, gene Ap3s1, Swiss-Prot, 193 aa -- the 1:1
          ortholog and the same subunit, not the sigma3B paralog (which is Q8BSZ2 and is the donor for
          AP3S2''s matching rows). The two sequences are byte-identical over all 193 residues, so the
          transfer has no divergence to bridge. The mouse source row is IMP from PMID:21998198, and the
          perturbation in that paper is the mocha allele Ap3d1(mh/mh) -- a delta-subunit null that removes
          the whole AP-3 complex -- with sigma3 appearing as an immunoblot readout rather than as the
          mutated gene. Annotating an obligate-complex subunit from a complex-null phenotype is standard
          GO practice and is not being called a defect; it is why the claim is complex-level and neuronal-context,
          hence non-core for a subunit of a ubiquitously expressed adaptor.'
      - source_id: ensembl:ENSMUSP00000025357
        source_label: Ensembl mouse translation ENSMUSP00000025357
        source_status: SUPPORTS_TRANSFER
        comment: The Ensembl protein identifier for the same mouse entity as the UniProtKB:Q9DCR2 entry
          above, per that record's Ensembl cross-reference (ENSMUST00000025357.9 / ENSMUSP00000025357.8).
          It is the Compara handle for the transfer, not an independent second donor.
      residue_claims_not_applicable: An ortholog transfer between sequence-identical proteins; there is
        no residue difference for a claim to be about.
