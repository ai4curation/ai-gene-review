id: P32297
gene_symbol: CHRNA3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Human alpha3 contributes principal ligand-binding faces to heteromeric ganglionic receptors
  with beta4 or beta2, sometimes including accessory alpha5 or beta3. Reconstituted alpha3beta4 and alpha3beta4beta3
  stoichiometries are context-specific. These pentameric membrane proteins couple extracellular acetylcholine
  recognition to cation flux and neuronal excitability. Alpha3 is a major autonomic ganglion receptor
  component, and loss-of-function variants cause bladder dysfunction and dysautonomia.
