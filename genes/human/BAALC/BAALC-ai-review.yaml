knowledge_gaps:
- gap_statement: The physiological function of BAALC in neurons and in normal hematopoietic progenitors
    is unknown. Its described mechanisms come from leukemia cell lines and a rat interaction study.
  boundary: 'Established: cytoplasmic localization; lipidation-dependent raft targeting and CaMKIIalpha
    binding of the rat 1-6-8 isoform; MEKK1 binding and KLF4 retention in AML cells. Not established:
    a loss-of-function phenotype in neurons or normal progenitors, or whether CaMKIIalpha activity depends
    on BAALC.'
  gap_kind:
  - BIOLOGY
  status: OPEN
  provenance:
  - reference_id: PMID:15659234
    supporting_text: We also found that BAALC 1-6-8 protein, as well as CaMKIIalpha, was localized to
      lipid rafts and that both myristoylation and palmitoylation of BAALC 1-6-8 N-terminal portion were
      required for targeting of the protein into lipid rafts.
  - reference_id: PMID:15659234
    supporting_text: These findings suggest that BAALC 1-6-8 protein play a synaptic role at the postsynaptic
      lipid raft possibly through interaction with CaMKIIalpha.
  - reference_id: PMID:26050649
    supporting_text: In this study, we found that BAALC induced cell-cycle progression of leukemia cells
      by sustaining extracellular signal-regulated kinase (ERK) activity through an interaction with a
      scaffold protein MEK kinase-1 (MEKK1), which inhibits the interaction between ERK and MAP kinase
      phosphatase 3 (MKP3/DUSP6).
  - reference_id: PMID:26050649
    supporting_text: We also demonstrated that BAALC blocks ERK-mediated monocytic differentiation of
      AML cells by trapping Krüppel-like factor 4 (KLF4) in the cytoplasm and inhibiting its function
      in the nucleus.
suggested_questions:
- question: Does BAALC regulate CaMKIIalpha targeting or activity at postsynaptic rafts, and does it scaffold
    MEKK1-ERK signalling in normal CD34+ progenitors as it does in AML?
suggested_experiments:
- description: Characterize Baalc-knockout mice for synaptic plasticity (CaMKIIalpha raft localization,
    LTP) and hematopoietic progenitor output, and map isoform-specific interactors by proximity labelling.
