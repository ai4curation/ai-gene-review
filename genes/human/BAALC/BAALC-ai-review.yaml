taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: BAALC (brain and acute leukemia, cytoplasmic) is a small, mammal-specific cytoplasmic adaptor
  protein with several splice isoforms. It is expressed in neuroectoderm-derived tissues and in CD34+
  hematopoietic progenitors, and is downregulated on myeloid commitment. The neuronal 1-6-8 isoform is
  targeted to postsynaptic lipid rafts by N-terminal myristoylation and palmitoylation, and binds the
  regulatory domain of CaMKIIalpha. In acute myeloid leukemia, where high BAALC expression predicts poor
  prognosis, BAALC binds MEKK1 to sustain ERK signalling and retains KLF4 in the cytoplasm, which blocks
  monocytic differentiation.
