    id: GO:0019901
    label: protein kinase binding
  evidence_type: IPI
  original_reference_id: PMID:26050649
  qualifier: enables
  review:
    summary: Protein kinase binding (NEW, IPI). In human AML cells, BAALC binds the MAP3K MEKK1 (MAP3K1)
      and so sustains ERK activity by blocking the ERK-MKP3 interaction. Rat BAALC 1-6-8 binds the regulatory
      domain of CaMKIIalpha through its N-terminal 35 residues. Both are direct kinase partners of a non-catalytic
      adaptor. The human MEKK1 interaction is supported only by the abstract here.
    action: NEW
    reason: '[PMID:26050649 "In this study, we found that BAALC induced cell-cycle progression of leukemia
      cells by sustaining extracellular signal-regulated kinase (ERK) activity through an interaction
      with a scaffold protein MEK kinase-1 (MEKK1), which inhibits the interaction between ERK and MAP
      kinase phosphatase 3 (MKP3/DUSP6)."] [PMID:15659234 "The interaction occurred between the N-terminal
      35-amino-acid region of BAALC 1-6-8 protein and the C-terminal end of the regulatory domain of CaMKIIalpha,
      which contains alpha isoform-specific sequence."]'
    supported_by:
    - reference_id: PMID:26050649
      supporting_text: In this study, we found that BAALC induced cell-cycle progression of leukemia cells
