core_functions:
- description: Transfer of sulfur from 3-mercaptopyruvate through a catalytic Cys248
    persulfide in cytosolic and mitochondrial sulfur amino acid catabolism, generating
    thiosulfate and persulfide/H2S products with thioredoxin or sulfite/HCN acceptors.
  molecular_function:
    id: GO:0016784
    label: 3-mercaptopyruvate sulfurtransferase activity
  directly_involved_in:
  - id: GO:0000098
    label: sulfur amino acid catabolic process
  - id: GO:0070814
    label: hydrogen sulfide biosynthetic process
  locations:
  - id: GO:0005829
    label: cytosol
  - id: GO:0005759
    label: mitochondrial matrix
  supported_by:
  - reference_id: Reactome:R-HSA-9012721
    supporting_text: 3-mercaptopyruvate sulfurtransferase (MPST aka 3MST) mediates the
      transfer of a sulfur atom
  - reference_id: Reactome:R-HSA-9035484
    supporting_text: restores MPST to its underivatized form while generating
      disulfanide
- description: Cytosolic TUM1-like persulfide relay that supports both sulfur
    transfer to MOCS3 for Mo-molybdopterin cofactor biosynthesis and 2-thiouridine
    formation at wobble U34 in cytosolic tRNAs.
  molecular_function:
    id: GO:0016784
    label: 3-mercaptopyruvate sulfurtransferase activity
  directly_involved_in:
  - id: GO:0006777
    label: Mo-molybdopterin cofactor biosynthetic process
  - id: GO:0002143
    label: tRNA wobble position uridine thiolation
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:36671528
    supporting_text: TUM1 is involved in the sulfur transfer for Molybdenum cofactor
      synthesis and tRNA thiomodification by spectrophotometric measurement of the
      activity of sulfite oxidase and liquid chromatography quantification of the level
      of sulfur-modified tRNA.
proposed_new_terms: []
suggested_questions:
- question: Which human MPST isoforms and acceptors dominate the cytosolic and
    mitochondrial sulfur-relay fluxes in different tissues?
- question: How much of the human MPST/TUM1 contribution to wobble-U34 thiolation is due
    to direct sulfur relay to MOCS3 versus indirect control of persulfide or redox
    state?
suggested_experiments:
- description: Quantitatively rescue MPST knockout cells with cytosol-only and
    mitochondrion-targeted Cys248 variants and measure 3-mercaptopyruvate flux,
    sulfane-sulfur products, and U34 thiolation by LC-MS.
- description: Reconstitute human NFS1, MPST/TUM1 and MOCS3 sulfur transfer with
    purified proteins and catalytic-site mutants to measure direct persulfide relay
    rates.
