  review:
    summary: MPST participates in sulfur amino acid catabolism through
      3-mercaptopyruvate-dependent sulfur transfer.
    action: ACCEPT
    reason: 'Sulfur amino acid catabolism is a core MPST process: cysteine aminotransferase
      produces 3-mercaptopyruvate from cysteine, and MPST transfers sulfur from 3-mercaptopyruvate
      into mitochondrial thiosulfate and sulfane-sulfur products.'
    supported_by:
    - reference_id: Reactome:R-HSA-9012721
      supporting_text: 3-mercaptopyruvate sulfurtransferase (MPST aka 3MST) mediates the
        transfer of a sulfur atom from 3-methylpryuvate (3MPYR) to hydrogensulfite
    - reference_id: file:genes/human/MPST/MPST-uniprot.txt
