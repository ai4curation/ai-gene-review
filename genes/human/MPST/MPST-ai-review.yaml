id: P25325
gene_symbol: MPST
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: MPST encodes a cytosolic and mitochondrial 3-mercaptopyruvate
  sulfurtransferase that transfers sulfane sulfur from 3-mercaptopyruvate to thiol or
  sulfur acceptors, producing persulfide/H2S species and thiosulfate in sulfur amino
  acid catabolism. In the broader TUM1-like sulfur relay, MPST also contributes
  persulfide sulfur for cytosolic tRNA wobble-uridine thiolation; it has only weak
  rhodanese activity compared with the dedicated TST paralog.
alternative_products:
- name: '1'
  id: P25325-1
- name: '2'
  id: P25325-2
  sequence_note: VSP_055027
