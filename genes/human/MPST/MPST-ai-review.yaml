- term:
    id: GO:0006777
    label: Mo-molybdopterin cofactor biosynthetic process
  evidence_type: IMP
  qualifier: involved_in
  review:
    summary: MPST/TUM1 supports Moco biosynthesis as part of the NFS1-MOCS3 sulfur
      relay.
    action: NEW
    reason: Human TUM1 knockout cells have reduced sulfite oxidase activity because
      Moco levels are lower, and the paper places TUM1 between NFS1 and MOCS3 in
      the sulfur-relay pathway shared by Moco biosynthesis and cytosolic tRNA
      thiolation. NFS1 and MOCS3 both already carry GO:0006777, so MPST is a direct
      sulfur-relay participant in the same pathway.
    supported_by:
    - reference_id: PMID:36671528
      supporting_text: TUM1 is involved in the sulfur transfer for Molybdenum cofactor
        synthesis and tRNA thiomodification
    - reference_id: PMID:36671528
      supporting_text: TUM1 is also involved in sulfur transfer from NFS1 to MOCS3 by
        enhancing the sulfur transfer to the recipient protein
