- description: Binds ARF1-GTP through two interfaces on its N-terminal HEAT-repeat trunk. This is the
    primary ARF1 contact of the whole complex - the delta-sigma3 hemicomplex binds ARF1 almost as well
    as intact AP-3, while the beta3-mu3 hemicomplex barely binds at all - and it is what recruits and
    retains AP-3 on the endosomal membrane. Mutating either interface in human cells sends delta back
    to the cytosol.
