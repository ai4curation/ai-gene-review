suggested_experiments:
- hypothesis: The delta N-terminal amphipathic helix inserts into the outer leaflet and contributes to
    membrane deformation, so removing it will uncouple AP-3 recruitment from tubulation.
  description: Purify human AP-3 carrying wild-type delta, a helix-deleted delta, and a delta whose helix
    hydrophobic face is mutated to serine. Reconstitute with myristoylated ARF1-GTP on PI(3,5)P2-containing,
    cargo-bearing liposomes and score, by cryo-electron tomography, recruitment (AP-3 density per unit
    membrane) and tubulation (fraction of tubulated membrane, tube radius) as separate readouts. Wild-type
    delta and an ARF1-site-2 mutant are the positive and recruitment-null controls.
  experiment_type: in vitro reconstitution and cryo-electron tomography
- hypothesis: The mammalian AP-3 budding step happens only on tubular sorting endosomes, so removing AP-3
    selectively from the trans-Golgi will not delay lysosomal delivery of newly synthesised LAMP1.
  description: In HeLa cells with endogenous AP3D1 knocked out, re-express delta fused to an FKBP-rapamycin
    dimerisation module and acutely sequester it either at a TGN-anchored or at an endosome-anchored FRB.
    Follow a RUSH-released LAMP1-SBP-GFP reporter to lysosomes by live imaging. Rescue with untagged delta
    and with the ARF1 double-site mutant give the response range.
  experiment_type: acute compartment-selective depletion with synchronised cargo release
- hypothesis: Phosphorylation of the delta linker (S758/S759 and neighbouring sites) gates cargo capture
    rather than membrane recruitment.
  description: Map phosphosites by mass spectrometry on delta purified from cytosolic versus membrane-bound
    AP-3 fractions. Then complement AP3D1-knockout cells with phospho-null and phospho-mimetic delta and
    measure, separately, membrane recruitment (delta puncta per cell) and cargo capture (co-immunoprecipitation
    of VAMP7 and LAMP1, and lysosomal delivery of each).
  experiment_type: phosphoproteomics with phospho-mutant complementation
- hypothesis: The delta hinge selects additional SNARE or SNARE-complex cargoes beyond VAMP7, which would
    explain why delta-specific and complex-wide phenotypes differ.
  description: Use the delta hinge (residues 650-797) and the VAMP7-non-binding mut1/mut2 versions as
    baits in a proximity-labelling (TurboID) experiment in cells, and in parallel as GST baits against
    brain and melanocyte cytosol. Hits enriched on wild-type but not mut1/mut2 are candidate hinge cargoes;
    validate the top hits by testing whether their lysosomal delivery is rescued by wild-type but not
    by mut1/mut2 delta in AP3D1-knockout cells.
  experiment_type: interface-mutant differential proximity labelling and pulldown
- hypothesis: The hearing loss of AP3D1 deficiency is caused by mis-sorting of a specific dileucine-motif
    transmembrane cargo in the cochlea, with Vangl2 the leading candidate.
  description: Compare the surface and lysosomal proteomes of cochlear and vestibular epithelium from
    conditional Ap3d1-null and control mice at the onset of the phenotype, filtering for transmembrane
    proteins with cytosolic [DE]xxxL[LI] motifs. Test the top candidates plus Vangl2 for AP-3-dependent
    localisation, and for rescue of the polarity defect by motif-mutant versions that bypass AP-3.
  experiment_type: tissue-restricted knockout proteomics with candidate validation
