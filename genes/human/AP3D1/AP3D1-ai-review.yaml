id: O14617
gene_symbol: AP3D1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'AP3D1 encodes delta-adaptin, the large delta subunit of the heterotetrameric AP-3 adaptor
  protein complex. AP-3 (delta, a beta subunit, a mu subunit and a sigma subunit) is a cytosolic vesicle
  coat that is recruited to endosomal membranes by the GTP-bound form of the small GTPase ARF1, captures
  transmembrane cargo bearing dileucine- and tyrosine-based sorting signals, and polymerises into a tubular
  carrier that delivers that cargo to lysosomes and to lysosome-related organelles. Unlike the closely
  related AP-1 and AP-2 complexes, AP-3 does not require a clathrin lattice: its coat is built from rows
  of AP-3 arches cross-linked by ARF1 dimers. Within the complex, delta is the subunit that carries the
  primary ARF1 contact - two interfaces on its N-terminal HEAT-repeat trunk, both needed for the complex
  to stay on membranes - and, through a hinge in its long disordered linker, a dedicated binding site
  for the longin domain of the SNARE VAMP7, which AP-3 transports only when VAMP7 is engaged in a cis-SNARE
  complex. Delta also contributes, with the sigma subunit, to the dileucine cargo pocket. Delta is the
  only large subunit of AP-3 that is not duplicated in vertebrates: the ubiquitous complex uses beta-3A
  and the neuron-specific complex beta-3B, but both contain delta, so delta loss removes both forms. Characterised
  cargoes include LAMP1 and LAMP2, CD63, tyrosinase and TYRP1, VAMP7, CLN3, the zinc transporters ZnT2
  and ZnT3, phosphatidylinositol-4-kinase type II alpha and, postsynaptically, AMPA receptors in complex
  with stargazin. Loss of delta-adaptin causes pigment-granule, platelet dense-granule, lytic-granule
  and synaptic-vesicle defects: it underlies the Drosophila garnet eye-colour mutant, the mouse mocha
  mutant, and human Hermansky-Pudlak syndrome type 10, in which oculocutaneous albinism and a platelet
  storage-pool defect are accompanied by neutropenia, impaired cytotoxic lymphocyte degranulation, seizures,
  neurodevelopmental delay and hearing loss.'
