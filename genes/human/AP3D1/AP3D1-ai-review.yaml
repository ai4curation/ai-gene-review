core_functions:
- description: 'As the delta subunit of AP-3, contributes to the complex''s cargo-adaptor activity: AP-3
    binds sorting signals in the cytosolic tails of transmembrane cargo and links them to a self-assembling
    coat, concentrating the cargo into a carrier. Delta''s own contribution is the dileucine-binding surface
    it forms with sigma-3 and, in the hinge of its disordered linker, a separate receptor that binds the
    longin domain of VAMP7 when that SNARE is in a cis-SNARE complex.'
