- description: Contributes to assembly of the AP-3 membrane coat. Once two ARF1 molecules are bound and
    cargo is engaged, AP-3 dimerises and polymerises into spiralling rows of arches cross-linked by ARF1
    dimers, tubulating the donor membrane into a carrier. The coat requires no clathrin lattice, which
    distinguishes AP-3 from AP-1 and AP-2; breaking the lattice interfaces by point mutation abolishes
    carrier formation and lysosomal cargo delivery in human cells.
