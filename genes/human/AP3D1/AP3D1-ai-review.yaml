  review:
    summary: The yeast ALP pathway propagated to the Eukaryota node. The process transfers; the donor
      compartment does not - the mammalian AP-3 exit site is the tubular endosome, not the Golgi.
    action: MODIFY
    reason: 'PTN000513025 carries this term on a single gene-level donor, SGD:S000006116 (yeast APL5),
      whose own IMP is PMID:9335339 - the screen that defined AP-3 as the machinery carrying alkaline
      phosphatase and Vam3p FROM THE LATE GOLGI to the vacuole. That route is genuinely how yeast AP-3
      works. In mammals it is not: immuno-EM catches AP-3 budding from a tubular endosomal compartment
      and AP-3-deficient cells missort LAMP-1/LAMP-2 from that compartment (PMID:15051738); in melanocytes
      AP-3 is on early-endosomal buds (PMID:16162817); and the reconstituted human coat is described as
      an endosome-to-lysosome carrier (PMID:42139345). So the biology is conserved (deliver cargo to the
      lytic compartment, which GO:0006623 on the same node states correctly) while the term names a compartment
      pair that does not transfer. Proposing GO:0008333 endosome to lysosome transport. This is a term-scoping
      call, not a challenge to the node: the seed is sound for yeast and the target is inside the clade.
      Residual uncertainty - Peden et al. call the mammalian site ''controversial'' and a minor TGN pool
      is not excluded - is recorded in knowledge_gaps rather than resolved here.'
