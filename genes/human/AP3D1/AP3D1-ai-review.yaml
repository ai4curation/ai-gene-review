  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:107734
  - PANTHER:PTN000513028
  review:
    summary: 'Bilateria node, mouse IMP donor: AP-3 is needed for cargo to leave the cell body for the
      synapse.'
    action: KEEP_AS_NON_CORE
    reason: Single gene-level donor MGI:MGI:107734, with its own IMP from PMID:21998198 showing that AP-3-BLOC-1
      sorting acts in cell bodies upstream of nerve terminals. Correctly placed at Bilateria; correctly
      on delta, which is in both AP-3 forms. Neuron-specific context.
    supported_by:
    - reference_id: PMID:21998198
      supporting_text: Reduction of PI4KIIα in the dentate reflects a failure to traffic from the cell
        body.
    - reference_id: PMID:21998198
      supporting_text: PI4KIIα was targeted to processes in wild-type primary cultured cortical neurons
        and PC12 cells but failed to reach neurites in cells lacking either AP-3 or BLOC-1.
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      failure_modes:
      - CONTEXT_OR_TISSUE_MISMATCH
      source_entities:
      - source_id: MGI:MGI:107734
        source_label: mouse Ap3d1 (MGI:MGI:107734)
        source_status: SUPPORTS_TRANSFER
        comment: The only gene-level donor on this row; IMP from PMID:21998198.
      - source_id: PANTHER:PTN000513028
        source_label: PTHR22781 Bilateria (taxon:33213) IBD node PTN000513028
        source_status: SUPPORTS_TRANSFER
        comment: Bilateria-level node; human AP3D1 is inside the inheriting clade. The node carries only
          the neuronal terms, while the complex and compartment terms sit on the deeper PTN000513025 --
          the split is correct, because yeast has no synaptic vesicles. No IRD or IKR appears anywhere
          in the PTHR22781 PAINT slice.
      residue_claims: *id002
