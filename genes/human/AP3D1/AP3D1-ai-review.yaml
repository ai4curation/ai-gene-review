- term:
    id: GO:0060155
    label: platelet dense granule organization
  evidence_type: NAS
  original_reference_id: PMID:23247405
  qualifier: involved_in
  review:
    summary: Platelet dense granules are lysosome-related organelles built by the AP-3 pathway; the storage-pool
      defect is documented in mocha mice and in HPS10 patients.
    action: KEEP_AS_NON_CORE
    reason: 'The ComplexPortal NAS comes from a review, and that review states the HPS link rather than
      assaying AP-3 in platelets. The claim is nonetheless well supported by primary work not cited in
      the annotation: mocha is a platelet storage-pool deficiency model, and the second HPS10 family was
      shown to have an abnormal platelet storage pathway. Cell-type-specific outcome of the core sorting
      step.'
    additional_reference_ids:
    - PMID:9697856
    - PMID:30472485
    supported_by:
    - reference_id: PMID:23247405
      supporting_text: For example, Hermansky-Pudlak Syndrome (HPS) patients and the corresponding animal
        models have abnormal melanosomes, platelet dense granules and lamellar bodies of lung type II
        epithelial cells.
    - reference_id: PMID:9697856
      supporting_text: Here, we show that mocha is a null allele of the delta subunit of the adaptor-like
        protein complex AP-3, which is associated with coated vesicles budding from the trans-Golgi network,
        and that AP-3 is missing in mocha tissues.
    - reference_id: PMID:30472485
      supporting_text: We further demonstrated an abnormal storage pathway in the platelets.
- term:
