  review:
    summary: The delta-specific knockdown is sound, but AP-3 is not the zinc importer - it delivers the
      ZnT transporters that are.
    action: MODIFY
    reason: 'The experiment is squarely about this gene product: the siRNA targeted delta and depleted
      the complex, and vesicular zinc fell. But GO:0140916 is ''The directed import of zinc(2+) from the
      cytosol, across an organelle membrane, into a lysosome'' - a transmembrane transport event that
      ZnT2/ZnT3 perform, not AP-3. The paper''s own decisive result makes the distinction: overexpressing
      GFP-ZnT2 RESCUES the AP-3-depleted phenotype, which is only interpretable if the AP-3 defect is
      a failure to deliver the transporter. Annotating the trafficking factor with the transporter''s
      activity conflates the agent with the machinery that positions it. Proposing GO:0061462 protein
      localization to lysosome, which states what AP-3 does and keeps the experimental result attached
      to the right gene.'
