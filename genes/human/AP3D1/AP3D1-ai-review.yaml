- term:
    id: GO:0016183
    label: synaptic vesicle coating
  evidence_type: NAS
  original_reference_id: PMID:15537701
  qualifier: involved_in
  review:
    summary: The GO term means clathrin-coated pit formation at the presynaptic plasma membrane. AP-3
      does not act there; the cited paper is about endosomal sorting of synaptic-vesicle proteins.
    action: MODIFY
    reason: 'GO:0016183 is defined as ''The formation of clathrin coated pits in the presynaptic membrane
      endocytic zone, triggered by the presence of high concentrations of synaptic vesicle components''
      - clathrin-mediated endocytosis at the plasma membrane. Seong et al., the cited source, report nothing
      of the kind: they compare beta3A- and beta3B-containing AP-3 complexes and measure the synaptic-vesicle
      content of ZnT3 and ClC-3, i.e. sorting into vesicles derived from endosomes. AP-3 vesicle budding
      is also demonstrably clathrin-independent (PMID:23761069, PMID:42139345). The process the source
      actually supports is GO:0016182 synaptic vesicle budding from endosome, which is proposed as the
      replacement (a term already on the gene by IBA - a duplicate GO id is acceptable and is preferable
      to leaving a mis-scoped term standing).'
    proposed_replacement_terms:
    - id: GO:0016182
      label: synaptic vesicle budding from endosome
    additional_reference_ids:
    - PMID:23761069
    supported_by:
    - reference_id: PMID:15537701
      supporting_text: Consistently, beta3B deficiency compromised synaptic zinc stores assessed by Timm's
