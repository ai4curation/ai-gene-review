knowledge_gaps:
- gap_statement: It is not established whether the amphipathic helix at the delta N-terminus actually
    deforms the membrane or merely binds it. Both structural papers stop at a proposal, and the 2026 coat
    paper attributes the helix array to mu3 'and possibly' delta.
  boundary: 'What is established: AP-3 has low intrinsic membrane affinity and is recruited by ARF1-GTP
    through delta; the AP3:ARF1 coat does tubulate liposomes in vitro; and AlphaFold plus cryo-EM density
    support a helical N-terminal extension on delta in a position analogous to membrane-binding regions
    of other AP complexes.'
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: It decides whether delta contributes an active membrane-bending activity (GO:0180020)
    or only a recruitment and cargo-capture function. Asserting the former from the current evidence would
    be an over-annotation, so the term is deliberately not proposed in this review.
  resolution: Helix-deleted and hydrophobic-face-mutant delta in a liposome tubulation assay with purified
    AP-3 and ARF1, read out by cryo-ET, separating tubulation from recruitment.
  provenance:
  - reference_id: PMID:42139345
    supporting_text: Our AP3:ARF1 coat structure also suggests that there is an additional array of amphipathic
      helices is contributed by μ3 and possibly by δ.
- gap_statement: Whether mammalian AP-3 has a functional trans-Golgi pool that performs the Golgi-to-lysosome
    route its yeast ortholog performs, or whether the tubular sorting endosome is the only productive
    site, is unresolved.
  boundary: 'Established: yeast AP-3 buds alkaline phosphatase and Vam3p from the late Golgi; mammalian
    AP-3 is caught by immuno-EM budding from a tubular endosomal compartment and concentrates LAMP-1/LAMP-2
    there; anti-delta immunofluorescence nevertheless shows a Golgi-region signal as well as peripheral
    structures.'
  gap_kind:
