- term:
    id: GO:0048840
    label: otolith development
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:O54774
  - ensembl:ENSMUSP00000020420
  review:
    summary: From the mouse otoconia phenotype of the mocha allele. Inside the term's Vertebrata constraint,
      and matched by hearing loss in AP3D1 patients - but an organismal outcome, not a molecular role.
    action: KEEP_AS_NON_CORE
    reason: 'Mouse Ap3d1 carries GO:0048840 as IMP from PMID:15109702, a gravity-receptor study in which
      mocha is one of the otoconia-deficient strains. GO:0048840 carries an only_in_taxon constraint to
      Vertebrata (taxId 7742, checked on the QuickGO constraints endpoint), so a human annotation violates
      nothing. The transfer is also independently plausible: inner-ear degeneration is part of the original
      mocha description, impaired hearing is part of the HPS10 phenotype, and a homozygous AP3D1 missense
      variant presents as sensorineural hearing loss. Non-core because this is several steps downstream
      of what delta does molecularly.'
    additional_reference_ids:
    - PMID:15109702
    - PMID:36445457
    - PMID:9697856
    supported_by:
    - reference_id: PMID:9697856
      supporting_text: Here, we show that mocha is a null allele of the delta subunit of the adaptor-like
        protein complex AP-3, which is associated with coated vesicles budding from the trans-Golgi network,
        and that AP-3 is missing in mocha tissues.
    - reference_id: PMID:15109702
      supporting_text: 'The purpose of the present study was to examine gravity receptor function in mutant
        mouse strains with variable deficits in otoconia: lethal milk (lm), pallid (pa), tilted (tlt),
        mocha (mh), and muted (mu).'
    - reference_id: PMID:36445457
      supporting_text: Loss-of-function variants in AP3D1 have been linked to Hermansky-Pudlak syndrome
        (HPS) 10, a severe multisystem disorder characterized by oculocutaneous albinism, immunodeficiency,
        neurodevelopmental delay, hearing loss (HL), and neurological abnormalities, fatal in early childhood.
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      failure_modes:
      - CONTEXT_OR_TISSUE_MISMATCH
      source_entities:
      - source_id: UniProtKB:O54774
        source_label: mouse Ap3d1 (MGI:MGI:107734)
        source_status: SUPPORTS_TRANSFER
        comment: Mouse Ap3d1 IMP for GO:0048840 from PMID:15109702; the mocha allele is one of five otoconia-deficient
          strains assayed.
      - source_id: ensembl:ENSMUSP00000020420
        source_label: mouse Ap3d1 (Ensembl translation)
        source_status: SUPPORTS_TRANSFER
        comment: Ensembl Compara protein id for the same mouse Ap3d1 record as UniProtKB:O54774 (Ensembl
          reports ENSMUSP00000020420 as a 1199-aa mouse translation, the length of O54774) -- one donor
          under two identifiers, not two independent sources.
      residue_claims_not_applicable: 'Not a point-residue question: the annotation turns on which compartment
