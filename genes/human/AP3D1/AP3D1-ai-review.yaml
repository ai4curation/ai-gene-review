      that AP-3 does not associate with clathrin in all organisms. The cargo-loading claim survives intact,
      so the parent GO:0035459 vesicle cargo loading is proposed. Colocalisation of AP-3 with clathrin
      is not disputed (PMID:15051738, PMID:16162817) - the rejected claim is the functional one.'
