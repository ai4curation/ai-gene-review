- term:
    id: GO:0007399
    label: nervous system development
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:1927065
  - PANTHER:PTN002740135
  - ZFIN:ZDB-GENE-070912-509
  review:
    summary: Nervous system development by IBA (PTN002740135) from mouse Cables1 and zebrafish cables1 experimental
      annotations.
    action: KEEP_AS_NON_CORE
    reason: 'The PAINT node is CABLES1-specific (not propagated to CABLES2 or to the invertebrate SF0 lineage),
      so the human gene sits inside the clade that inherited the assertion. Donor evidence is perturbation-based:
      antisense knockdown of Cables in rodent cortical neurons inhibits neurite outgrowth, with a mechanistic basis
      in Cables bridging c-Abl and Cdk5 to upregulate Cdk5; zebrafish cables1 knockdown disrupts embryonic neural
      differentiation. No direct human neural experiment exists. The term is a broad developmental process, peripheral
      to the core molecular role as a CDK-associated regulator, so it is kept as non-core.'
    supported_by:
    - reference_id: PMID:10896159
      supporting_text: Expression of antisense Cables in primary cortical neurons inhibited neurite outgrowth.
    - reference_id: PMID:21268180
      supporting_text: 'cables1 is required for embryonic neural development: molecular, cellular, and behavioral
        evidence from the zebrafish.'
- term:
    id: GO:0051726
    label: regulation of cell cycle
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR012388
  review:
    summary: Regulation of cell cycle, inferred from the InterPro CABLES1/2 family signature (IPR012388).
    action: MODIFY
    reason: 'Correct but general. The specific, experimentally supported process is regulation of CDK activity:
      in human cells CABLES1 enhances WEE1-mediated inhibitory Y15 phosphorylation of CDK2 and decreases CDK2 kinase
      activity, while in rodent neurons it promotes c-Abl-mediated stimulatory Y15 phosphorylation of CDK5. Because
      the sign depends on the CDK and partner kinase, the neutral term GO:0000079 (a descendant of regulation of
      cell cycle) is proposed.'
    proposed_replacement_terms:
    - id: GO:0000079
      label: regulation of cyclin-dependent protein serine/threonine kinase activity
    supported_by:
    - reference_id: PMID:11585773
      supporting_text: Cables enhanced cdk2 tyrosine 15 phosphorylation by the Wee1 protein kinase, an inhibitory
        phosphorylation, which led to decreased cdk2 kinase activity.
    - reference_id: PMID:10896159
      supporting_text: Active c-Abl kinase leads to Cdk5 tyrosine phosphorylation, and this phosphorylation is enhanced
        by Cables.
- term:
    id: GO:0050821
    label: protein stabilization
  evidence_type: IDA
  original_reference_id: PMID:24975575
  review:
    summary: 'NEW: CABLES1 stabilizes p21/CDKN1A and TAp63 by binding them and preventing their ubiquitin-dependent
      proteasomal degradation.'
    action: NEW
    reason: In human cells, silencing endogenous CABLES1 shortens p21 half-life and increases its ubiquitination,
      and CABLES1 competes with the proteasome subunit PSMA3 for p21 binding. Human CABLES1 likewise binds TAp63alpha
      and attenuates its polyubiquitination. CABLES1 performs the stabilizing step itself, by direct binding that
      blocks degradation machinery access, so this is participation rather than mere necessity. No existing annotation
      covers it.
    supported_by:
    - reference_id: PMID:24975575
      supporting_text: Mechanistically, Cables1 interferes with the proteasome (Prosome, Macropain) subunit alpha
        type 3 (PSMA3) binding to p21 and protects p21 from PSMA3-mediated proteasomal degradation.
    - reference_id: PMID:20559324
      supporting_text: These findings indicate that Cables1 stabilizes p63α by blocking ubiquitin-mediated proteasomal
        degradation of the protein.
