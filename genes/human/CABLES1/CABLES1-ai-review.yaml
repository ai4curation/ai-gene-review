id: Q8TDN4
gene_symbol: CABLES1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'CABLES1 (CDK5 and ABL1 enzyme substrate 1; ik3-1) is a cyclin-box-containing, non-catalytic cyclin-dependent
  kinase (CDK)-interacting protein of the CABLES family. Its C-terminal cyclin-like region binds CDKs (CDK2, CDK3,
  CDK5) without activating them, and CABLES1 instead modulates CDK activity by promoting inhibitory or stimulatory
  tyrosine-15 phosphorylation by partner tyrosine kinases: in human cells it enhances WEE1-mediated CDK2 Y15 phosphorylation
  and lowers CDK2 activity, while in rodent neurons it bridges c-ABL and CDK5 and supports neurite outgrowth. Its
  N-terminal region binds p53-family proteins (p53, TAp63, p73) and the CDK inhibitor p21; CABLES1 protects TAp63
  and p21 from ubiquitin-dependent proteasomal degradation, the latter by blocking access of the proteasome subunit
  PSMA3. CABLES1 is found in the nucleus and cytoplasm, is itself a substrate of CDK2/CDK3, CDK5, ABL1 and AKT (AKT
  phosphorylation recruits 14-3-3 and suppresses its pro-apoptotic, growth-inhibitory activity), and behaves as
  a tumour suppressor. Germline loss-of-function variants predispose to Cushing''s disease (corticotroph pituitary
  tumours), and loss of expression is common in colon, endometrial, lung and ovarian cancers.'
