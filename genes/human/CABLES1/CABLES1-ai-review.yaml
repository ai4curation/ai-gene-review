- question: Does PMID:17101133 (NESH/Abi-3 and the Abi/WAVE complex) actually contain a CABLES1 cytosol experiment,
    or is the MGI-curated IDA attached to the wrong reference?
- question: Is CABLES1 a genuine molecular adaptor that physically bridges WEE1 to CDK2 (and ABL1 to CDK5) in human
    cells, which would justify a molecular adaptor activity annotation rather than protein kinase binding?
- question: Which CABLES1 functions are shared with CABLES2 and with the invertebrate SF0 lineage (fly Cables1,
    worm Y71F9B.6), given that PAINT restricted the nervous system development and cytosol IBAs to the CABLES1 clade?
suggested_experiments:
- description: Reconstitute CDK2-cyclin, WEE1 and purified human CABLES1 in vitro to test whether CABLES1 directly
    increases WEE1 phosphorylation of CDK2 Y15, and map the required CABLES1 regions.
- description: Test the Cushing's disease CABLES1 missense variants for loss of CDK binding, p21/p63 stabilization
    and WEE1-dependent CDK2 inhibition to identify which activity underlies tumour suppression in corticotrophs.
