  review:
    summary: SPAAR interacts with the lysosomal V-ATPase (ATP6V0A1, ATP6V0A2 per UniProt) and co-localises
      with it; annotated with colocalizes_with rather than part_of.
    action: ACCEPT
    reason: SPAAR is an interactor/regulator of the lysosomal V-ATPase, not a structural subunit of the
      proton pump, and there is no evidence that it contributes to proton transport. The colocalizes_with
      qualifier correctly records physical association without asserting complex membership, so the row
      is accepted on that reading; it should not be upgraded to part_of. Note that an HA-SPAAR pull-down
      in HUVECs did not recover V-ATPase subunits, so the association may be cell-context dependent.
    additional_reference_ids:
