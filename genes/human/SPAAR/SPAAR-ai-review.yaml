core_functions:
- description: Lysosome/late-endosome membrane microprotein that acts as a negative regulator of amino-acid-induced
    mTORC1 activation. SPAAR associates with the lysosomal V-ATPase (ATP6V0A1/ATP6V0A2) and favours a
    tightly bound V-ATPase-Ragulator-Rag GTPase supercomplex, preventing mTORC1 recruitment to the lysosome
    in response to amino acids but not growth factors. It is an interactor and regulator of the V-ATPase,
    not a subunit of the proton pump; no molecular-function term currently captures this regulatory activity.
  directly_involved_in:
