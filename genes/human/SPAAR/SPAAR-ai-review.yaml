description: 'SPAAR (small regulatory polypeptide of amino acid response; formerly the lncRNA LINC00961)
  is a mammalian microprotein of 90 aa (canonical) or 75 aa (short isoform, conserved with mouse) with
  a single transmembrane helix, a short lumenal N-terminus and a cytoplasmic C-terminus. It resides in
  the membrane of late endosomes and lysosomes, where it associates with the lysosomal V-type proton ATPase
  (interacting with the V0 a1 and a2 subunits ATP6V0A1/ATP6V0A2). SPAAR selectively restrains mTORC1 activation
  by amino acids, but not by growth factors: it favours a tightly bound V-ATPase-Ragulator-Rag GTPase
  supercomplex that fails to recruit mTORC1 to the lysosome. In mouse skeletal muscle the peptide is downregulated
  after acute injury, and its loss enhances mTORC1 activation and muscle regeneration. The peptide is
  expressed in lung, heart, skeletal muscle and endothelium; overexpression in endothelial cells promotes
  network formation, while the host RNA has separable, opposing effects on angiogenesis.'
