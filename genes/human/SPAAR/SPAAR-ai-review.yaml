suggested_questions:
- question: 'What molecular activity does SPAAR exert on the V-ATPase-Ragulator-Rag assembly: does it
    directly bridge the V0 a subunit to Ragulator/Rag, or allosterically lock the V-ATPase in an amino-acid-insensitive
    state? The answer determines whether a molecular adaptor or an enzyme/GTPase regulator MF term is
    appropriate.'
- question: Is the lysosomal V-ATPase interaction cell-type specific? HA-SPAAR pull-down in endothelial
    cells did not recover V-ATPase subunits, and the pro-angiogenic effect of SPAAR overexpression may
    operate through a different mechanism (e.g. SYNE1).
- question: Does the primate-specific 90-aa isoform 1 share the localisation and mTORC1-regulatory function
    of the conserved 75-aa isoform 2, to which UniProt attributes the function?
suggested_experiments:
- hypothesis: SPAAR's pro-angiogenic effect in endothelial cells depends on its mTORC1-regulatory function
    at the lysosome.
  description: Generate peptide-specific (start-codon mutant, lncRNA-preserving) knockout endothelial
    cells or mice, as done for muscle, and test angiogenesis, lysosomal mTORC1 recruitment after amino-acid
    restimulation, and rescue with wild-type versus V-ATPase-binding-deficient SPAAR.
  experiment_type: genetic knockout and rescue
