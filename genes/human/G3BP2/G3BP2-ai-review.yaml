- term:
    id: GO:0003723
    label: RNA binding
  evidence_type: HDA
  original_reference_id: PMID:22658674
  qualifier: enables
  review:
    summary: mRNA interactome capture in HeLa cells identified G3BP2 as an RNA-binding
      protein.
    action: ACCEPT
    reason: >-
      Direct proteome-wide evidence that G3BP2 is bound to RNA in cells: proteins
      were UV-crosslinked to polyadenylated mRNA and recovered on oligo(dT), so this
      row in fact demonstrates the more specific mRNA binding, which the gene
      already carries on its own accepted row. RNA binding is kept here rather than
      refined, so that every row on this term reads the same way, and because RNA
      engagement is integral to the core condensate-scaffold activity rather than a
      peripheral property.
    supported_by:
