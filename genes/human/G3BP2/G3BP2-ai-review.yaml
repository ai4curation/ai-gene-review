core_functions:
- description: >-
    RNA-dependent molecular condensate scaffold: G3BP2 switches from an
    autoinhibited compact state to an expanded, oligomerizing state on binding
    unfolded mRNA released from disassembling polysomes, crosslinking transcripts
    into the protein-RNA condensate that is the cytoplasmic stress granule. The
    NTF2-like domain provides dimerization and the mutually exclusive CAPRIN1/USP10
    docking site that tunes the transition, the RRM and RG-rich region provide RNA
    engagement, and the acidic disordered region restrains condensation until RNA
    binding relieves it.
  molecular_function:
    id: GO:0140693
    label: molecular condensate scaffold activity
  directly_involved_in:
  - id: GO:0034063
    label: cytoplasmic stress granule assembly
  locations:
  - id: GO:0010494
    label: cytoplasmic stress granule
  - id: GO:0005829
    label: cytosol
  supported_by:
  - *kedersha_dko
  - *kedersha_rescue
  - *yang_rescue
  - *guillen_phase
  - *guillen_rna_required
  - *guillen_valence
- description: >-
    Cytoplasmic anchoring of signalling proteins: G3BP2 binds partners that would
    otherwise enter the nucleus and holds them in the cytoplasm, a function
    established first for the IkappaB-alpha cytoplasmic-retention sequence and then
    for TWIST1, whose release from G3BP2 under high matrix stiffness drives its
    nuclear translocation and epithelial-mesenchymal transition. This activity is
    separable from granule assembly and is the basis of the gene's role in
    mechanotransduction.
  molecular_function:
    id: GO:0140311
    label: protein sequestering activity
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - *twist_release
  - *twist_loss
  - *ikb_retention
knowledge_gaps:
- gap_statement: >-
    It is not known whether human G3BP2 has any condensate or anchoring role that
    G3BP1 cannot perform, or whether the two paralogs differ only quantitatively.
  boundary: >-
    Rescue experiments in G3BP1/G3BP2 double-knockout cells show the paralogs are
    interchangeable for arsenite-induced granule assembly across 17 markers, and
    reconstitution shows G3BP2 condenses more efficiently because its RG-rich region
    carries more arginines. What has not been tested is whether that quantitative
    difference, or the cytoplasmic-anchoring activity characterised only for G3BP2,
    produces a stress, cell type or substrate where the paralogs are not
    interchangeable.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    Paralog-specific functions would determine whether the neurodevelopmental
    phenotypes of G3BP2 de novo variants arise from a dosage deficit in a shared
    granule function or from loss of something only G3BP2 does.
  resolution: >-
    Compare single and double paralog knockouts across a panel of stresses and cell
    types with matched expression of each paralog, and test whether G3BP1 can
    substitute for G3BP2 in retaining TWIST1 and IkappaB-alpha in the cytoplasm.
  provenance:
  - reference_id: PMID:32302571
    supporting_text: >-
      Expression of GFP-G3BP1 or GFP-G3BP2 were each sufficient to restore SG
      assembly in response to arsenite in G3BP1/2 dKO cells based on 17 markers
  - reference_id: PMID:32302572
    supporting_text: >-
      We conclude that the higher valence of arginine residues within the RG-rich
      region renders G3BP2 more prone to oligomerize and, consequently, more
      efficient to form condensates together with RNA.
- gap_statement: >-
    Whether G3BP2's association with dissociated 40S subunits serves ribosome
    quality control, granule assembly, or both is unresolved.
  boundary: >-
    G3BP2 binds dissociated 40S subunits but not intact monosomes, and
    G3BP-family-USP10 complexes are required to deubiquitinate small-subunit
    proteins and rescue 40S subunits from lysosomal degradation. It is not known
    whether the same binding surface serves both the quality-control and the
    condensation roles, nor whether a separation-of-function mutant could uncouple
    them.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    The answer decides whether stress granules are incidental to, or a vehicle for,
    G3BP-dependent 40S rescue, and so whether granule-modulating therapeutics would
    perturb ribosome homeostasis.
  resolution: >-
    Isolate RG-rich-region variants that abolish 40S binding while preserving
    RNA-dependent condensation, and test granule assembly and small-subunit
    ubiquitination independently in each background.
  provenance:
  - reference_id: PMID:31981475
    supporting_text: >-
      We show that G3BP1-family-USP10 complexes are required for deubiquitination of
      RPS2, RPS3, and RPS10 to rescue modified 40S subunits from programmed
      degradation.
    full_text_unavailable: true
  - reference_id: PMID:27022092
    supporting_text: >-
      The results confirm that G3BP1 (lane 4) and G3BP2 (lane 2) interact only with
      dissociated 40S subunits
suggested_questions:
- question: >-
    Should a protein that both performs condensation and presents the mutually
    exclusive CAPRIN1/USP10 docking site carry regulation-of-assembly terms
    alongside the assembly term, or should the regulation terms sit only on the
    partners that occupy the pocket?
- question: >-
    Is there a stress, cell type or client for which G3BP1 cannot substitute for
    G3BP2?
suggested_experiments:
- description: >-
    Reconstitute granule assembly in G3BP1/G3BP2 double-knockout cells expressing
    each paralog at matched endogenous levels, across arsenite, thapsigargin, heat
    and osmotic stress, and score assembly kinetics rather than endpoint counts.
  hypothesis: >-
    The paralogs differ quantitatively in condensation efficiency, so matched
    expression will reveal stress-specific thresholds at which only G3BP2 supports
    assembly.
  experiment_type: genetic rescue with quantitative imaging
- description: >-
    Map the G3BP2 surface required for dissociated-40S binding by RG-rich-region
    mutagenesis, then test the separation-of-function alleles for small-subunit
    deubiquitination, 40S stability and stress-granule assembly.
  hypothesis: >-
    40S engagement and RNA-driven condensation use partially distinct features of
    the RG-rich region and can be uncoupled.
  experiment_type: structure-function mutagenesis
