id: Q9UN86
gene_symbol: G3BP2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  G3BP2 is one of the two human G3BP-family RNA-binding scaffold proteins that
  nucleate cytoplasmic stress granules. It combines an N-terminal NTF2-like
  dimerization and partner-docking domain, an acidic disordered region, an RRM
  and a C-terminal RG-rich region, and it crosslinks mRNA released from
  disassembling polysomes into a protein-RNA condensate: purified G3BP2
  undergoes RNA-dependent liquid-liquid phase separation, and re-expressing
  G3BP2 alone restores stress-granule competence to cells lacking both G3BP
  paralogs. Its NTF2-like pocket is a mutually exclusive docking site for
  CAPRIN1 and USP10, whose binding tunes condensation up or down, and the same
  protein associates with dissociated 40S ribosomal subunits, where
  G3BP-family-USP10 complexes strip ubiquitin from small-subunit proteins and
  rescue 40S subunits from degradation. Separately from granule biology, G3BP2
  acts as a cytoplasmic anchor that retains IkappaB-alpha and the transcription
  factor TWIST1 outside the nucleus, placing it in NF-kappaB control and in
  matrix-stiffness mechanotransduction. G3BP2 is a target of several viruses,
  which either sequester it or proteolytically cleave it to suppress stress
  granules, and de novo variants in the gene are enriched in individuals with
  neurodevelopmental disorders.
