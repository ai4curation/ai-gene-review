- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:25893917
  qualifier: enables
  supporting_entities:
  - UniProtKB:P26687
  review:
    summary: Mouse Twist1 co-immunoprecipitates with G3BP2 in the mechanotransduction
      study.
    action: MODIFY
    reason: >-
      This paper does identify a molecular function for the interaction rather than
      merely recording it: G3BP2 is the cytoplasmic binding partner that holds
      TWIST1 out of the nucleus, and depleting G3BP2 makes TWIST1 constitutively
      nuclear. That is protein sequestering activity, the molecular function GO
      created when the old cytoplasmic-sequestering process term was obsoleted for
      being an activity rather than a process. The same substitution applies to the
      human TWIST1 row below.
    proposed_replacement_terms:
    - id: GO:0140311
      label: protein sequestering activity
    supported_by:
    - &twist_release
      reference_id: PMID:25893917
      supporting_text: >-
        High matrix stiffness promotes nuclear translocation of TWIST1 by releasing
        TWIST1 from its cytoplasmic binding partner G3BP2.
    - &twist_loss
      reference_id: PMID:25893917
      supporting_text: >-
        Loss of G3BP2 leads to constitutive TWIST1 nuclear localization and
        synergizes with increasing matrix stiffness to induce EMT and promote tumour
        invasion and metastasis.
