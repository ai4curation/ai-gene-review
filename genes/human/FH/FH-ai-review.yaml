  review:
    summary: Immunofluorescence and fractionation in human HeLa/HCT116 cells show FH entering the nucleus after
      DNA damage.
    action: ACCEPT
    reason: 'Yogev et al. assayed human cells directly: FH is mitochondrial and cytosolic at rest and accumulates
      in the nucleus within minutes of IR or HU treatment, with a dose-dependent increase in nuclear FH by fractionation.
      Nuclear FH is a minor, damage-induced localization pool. These experiments do not establish that this pool
      derives exclusively from natural product P07954-2.'
    supported_by:
    - &id005
      reference_id: PMID:20231875
      supporting_text: Surprisingly, after both HU or IR treatments, FH is also localized in the nucleus, showing
        increasing nuclear levels over time.
    - &id015
      reference_id: PMID:20231875
      supporting_text: We show that the cytosolic fumarase is a member of the DNA damage response that is recruited
        from the cytosol to the nucleus upon DNA damage induction.
