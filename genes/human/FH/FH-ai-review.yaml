- term:
    id: GO:2001034
    label: positive regulation of double-strand break repair via nonhomologous end joining
  evidence_type: IMP
  original_reference_id: PMID:26237645
  review:
    summary: Nuclear FH promotes NHEJ by producing fumarate locally at DSBs, which inhibits KDM2B, raises
      H3K36me2 and promotes Ku70/DNA-PK accumulation.
    action: NEW
    reason: 'No existing annotation captures this experimentally established role (UniProt FUNCTION also
      describes it). In human U2OS cells, DNA-PK phosphorylates FH at Thr236; FH binds H2A.Z at DSBs;
      catalytically dead R233H or non-phosphorylatable T236A FH fails to support NHEJ; and exogenous fumarate
      or KDM2B depletion rescues the defect. FH does part of the work: its catalytic activity makes the
      fumarate signal at the break. It does not carry out end joining itself, so a positive-regulation
      term is used rather than the NHEJ process term. Yeast cytosolic fumarase has a conserved DSB-protective
      role that depends on enzyme activity (PMID:20231875).'
    additional_reference_ids:
    - PMID:20231875
    supported_by:
    - &id017
      reference_id: PMID:26237645
      supporting_text: These results indicate that FH-produced fumarate promotes NHEJ-dependent DNA repair
        by inhibiting KDM2B-mediated demethylation at DSB regions.
    - reference_id: PMID:26237645
      supporting_text: In contrast, the catalytically inactive FH (N) R233H mutant, which was phosphorylated
