id: P07954
gene_symbol: FH
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'FH (fumarate hydratase, fumarase) is a class II, iron-independent fumarase that forms a
  homotetramer and catalyses the reversible stereospecific hydration of fumarate to L-malate (EC 4.2.1.2).
  Alternative transcription initiation produces two products from one gene. The longer product carries
  an N-terminal mitochondrial targeting sequence; it is imported into the mitochondrial matrix and catalyses
  the fumarate-to-malate step of the tricarboxylic acid (TCA) cycle. The shorter product has no targeting
  sequence and stays in the cytosol, where it metabolises fumarate produced by argininosuccinate lyase
  in the urea cycle and by amino acid catabolism. After DNA damage, part of the cytosolic pool enters
  the nucleus. There DNA-PK phosphorylates FH at Thr236, and FH binds histone H2A.Z at double-strand breaks.
  The fumarate it makes there inhibits the KDM2B demethylase, which raises H3K36me2 and promotes Ku70/DNA-PK
  recruitment and non-homologous end joining. FH is a tumour suppressor. Germline heterozygous loss-of-function
  mutations with second-hit inactivation cause hereditary leiomyomatosis and renal cell cancer (HLRCC).
  In these tumours fumarate accumulates and acts as an oncometabolite: it inhibits 2-oxoglutarate-dependent
  dioxygenases such as the HIF prolyl hydroxylases, and it succinates cysteines on proteins such as KEAP1.
  Biallelic hypomorphic mutations cause fumarase deficiency, a severe encephalopathy. Eukaryotes inherited
  two unrelated fumarase families: an O2-sensitive [4Fe-4S] class I enzyme and the class II enzyme. Humans
  kept only the class II form.'
