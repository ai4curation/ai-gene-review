id: P07954
gene_symbol: FH
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'FH (fumarate hydratase, fumarase) is a class II, iron-independent enzyme that forms a homotetramer
  and catalyses the reversible conversion of fumarate and L-malate. The mitochondrial product supplies the fumarate-to-malate
  step of the tricarboxylic acid cycle. A shorter natural product lacks the N-terminal targeting sequence and supports
  extramitochondrial fumarate metabolism. Cytosolic fumarate turnover is coupled to urea-cycle and arginine metabolism:
  in FH-deficient kidney models, fumarate accumulation drives reversed argininosuccinate lyase flux, while cytosolic
  FH re-expression restores metabolite balance. This disease-model coupling does not establish a single dominant
  flux direction in every normal tissue. In human DNA-damage assays, nuclear FH associates with H2A.Z-containing
  chromatin, and local fumarate production inhibits KDM2B-mediated H3K36 demethylation, supporting repair-factor
  accumulation and nonhomologous end joining. Engineered mitochondria-excluded constructs used in these studies
  are not equivalent to a demonstrated natural-product assignment. FH is also a tumour suppressor: inherited heterozygous
  loss-of-function variants predispose to hereditary leiomyomatosis and renal cell cancer following somatic inactivation
  of the remaining allele. Fumarate accumulation can inhibit 2-oxoglutarate-dependent dioxygenases and succinate
  protein cysteines. Biallelic defects cause fumarase deficiency, a severe metabolic encephalopathy.'
