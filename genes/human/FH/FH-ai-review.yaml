  review:
    summary: Human FH activity depends on tetramer assembly; A308T and H318Y have severe kinetic and oligomerization
      defects.
    action: ACCEPT
    reason: PMID:29456767 Figures 5-6 and Table 1 measure recombinant human FH kinetics and oligomerization. The
      variants show more than 900-fold lower turnover and predominantly dimeric populations, with small tetrameric
      fractions. The Results also distinguish recombinant A308T activity from the approximately 20% activity reported
      in patient fibroblasts. This directly supports fumarase activity and its assembly requirement without treating
      all variant measurements as absolute zero.
    supported_by:
