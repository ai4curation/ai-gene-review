- id: PMID:23643539
  title: A role for cytosolic fumarate hydratase in urea cycle metabolism and renal neoplasia.
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Original Methods and Results Figures 1-4 were read. Human full-length and mitochondria-excluded
      FH constructs are expressed in mouse renal/MEF models and human UOK262 cells; re-expression normalizes fumarate/argininosuccinate
      abnormalities. Isotope tracing supports reversed ASL chemistry, not arginine catalysis by FH. The actual donor
      supports the bounded urea/arginine inference. Human-tumour samples are small, and responses to arginine deprivation
      differ between mouse MEFs and the human cell system. The engineered FHcyt construct is not mapped to natural
      P07954-2 solely from its name.
