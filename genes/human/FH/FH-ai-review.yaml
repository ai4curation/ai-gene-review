  review:
    summary: Nuclear FH promotes NHEJ by producing fumarate locally at DSBs, which inhibits KDM2B, raises H3K36me2
      and promotes Ku70/DNA-PK accumulation.
    action: NEW
    reason: Retain this authored proposal on target-specific mechanistic evidence, not because other pathway participants
      have annotations. In PMID:26237645 human-cell experiments, recruitment-defective but catalytically active
      FH and catalytically inactive but recruited FH separate local catalysis from localization; fumarate/KDM2B
      interventions connect that catalysis to H3K36me2, repair-factor accumulation and NHEJ. FH supplies the locally
      produced regulatory metabolite and therefore performs work in the regulation process; it is neither a passive
      substrate nor the ligase. Current QuickGO has no corresponding FH process row, and the existing paper is already
      curated for interaction/location; this proposal explicitly adds a reviewed mechanistic interpretation. SETMAR
      provides a qualified positive catalytic/chromatin comparator, while ACLY and KDM2B absences are not treated
      as proof of an overlooked annotation. Correction PMID:29632342 replaces duplicated Figure 2d images; no corrected
      pixels or Figshare repetitions were independently assessed. The artificial FH(N) deletion of residues 1-21
      construct is not assigned to natural P07954-2 deletion of residues 1-43.
    additional_reference_ids:
    - PMID:20231875
    - PMID:29632342
    supported_by:
    - reference_id: PMID:26237645
      supporting_text: These results indicate that FH-produced fumarate promotes NHEJ-dependent DNA repair by inhibiting
        KDM2B-mediated demethylation at DSB regions.
    - reference_id: PMID:26237645
      supporting_text: In contrast, the catalytically inactive FH (N) R233H mutant, which was phosphorylated and
        recruited to chromatin
    - reference_id: PMID:20231875
      supporting_text: We show that the cytosolic fumarase is a member of the DNA damage response that is recruited
        from the cytosol to the nucleus upon DNA damage induction.
    - reference_id: PMID:29632342
