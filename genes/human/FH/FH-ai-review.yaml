      after DNA damage.
    action: ACCEPT
    reason: 'Yogev et al. assayed human cells directly: FH is mitochondrial and cytosolic at rest and
      accumulates in the nucleus within minutes of IR or HU treatment, with a dose-dependent increase
      in nuclear FH by fractionation. Nuclear FH is a minor, damage-induced pool of the cytosolic isoform.'
    supported_by:
