- description: 'Cytosolic FH catalyses reversible fumarate/malate interconversion. Its control of fumarate abundance
    couples this chemistry to arginine/urea-cycle metabolism: cytosolic FH re-expression corrects metabolite abnormalities
    in FH-deficient renal models. These results establish metabolic coupling without specifying a universal normal-tissue
    flux direction.'
