  review:
    summary: IBA from PANTHER node PTN000154499 (class II fumarase family; donors include human FH, mouse
      Fh1, rat Fh, yeast FUM1, Arabidopsis FUM1/FUM2, E. coli FumC).
    action: ACCEPT
    reason: FH catalyses the reversible stereospecific hydration of fumarate to L-malate (EC 4.2.1.2);
      this is the defining activity of the gene product, supported by direct kinetics on recombinant human
      FH and by disease variants that abolish activity. Human FH is a class II (iron-independent, FumC-type)
      fumarase and sits squarely inside the clade in which the activity is ancestral; the comparative
      analysis of Chen et al. 2026 confirms that humans retain only the class II family, so there is no
      paralog ambiguity. FH appearing among its own IBA sources reflects its own experimental grounding,
      not circularity.
    additional_reference_ids:
    - PMID:42822426
    supported_by:
