- description: In human DNA-damage assays, recruited nuclear FH produces fumarate locally at double-strand breaks.
    The resulting inhibition of KDM2B sustains H3K36 dimethylation and supports Ku70/DNA-PK accumulation and nonhomologous
    end joining. This is a damage-associated regulatory role of fumarase catalysis; experimental FH(N) constructs
    are not identified with a specific natural alternative product.
