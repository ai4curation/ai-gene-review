suggested_questions:
- question: Should cytosolic FH carry urea cycle (GO:0000050)? It hydrates the fumarate co-product of
    argininosuccinate lyase rather than catalysing a step of the ornithine-to-arginine sequence. Is the
    extended "Krebs bicycle" fumarate branch within the scope of the GO term?
  experts:
  - GO metabolism editors
- question: Is the nuclear DNA-repair role carried exclusively by the cytosolic (MTS-lacking) isoform
    in vivo, and does physiological nuclear FH abundance suffice to change local fumarate concentrations
    at DSBs?
- question: Should FH tumour suppression in HLRCC be represented in GO? It largely reflects fumarate oncometabolite
    effects (dioxygenase inhibition, protein succination) that follow loss of FH activity, not a distinct
    FH activity.
suggested_experiments:
- hypothesis: Nuclear FH supports NHEJ through its local catalytic product rather than through scaffolding
    at H2A.Z.
  description: Tether catalytically dead versus wild-type FH to an inducible DSB (e.g. via a LacI/dCas9
    fusion) in FH-null cells, and measure local fumarate (biosensor), H3K36me2 ChIP and NHEJ reporter
    efficiency.
  experiment_type: genetic interaction / reporter assay
- hypothesis: The cytosolic FH isoform alone accounts for urea-cycle coupling in hepatocytes.
  description: Use isoform-specific promoter or start-site editing in hepatocyte models to abolish the
    cytosolic or mitochondrial product, then trace 15N-ammonia/13C-aspartate flux through argininosuccinate
    and fumarate.
  experiment_type: metabolic flux analysis
