    label: urea cycle
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P97807
  - ensembl:ENSMUSP00000027810
  review:
    summary: Ensembl Compara transfer of urea cycle from mouse Fh1 (P97807).
    action: KEEP_AS_NON_CORE
    reason: In the cytosol, argininosuccinate lyase releases fumarate as a co-product of arginine formation
      in the urea cycle; cytosolic FH hydrates this fumarate to malate, linking the urea cycle to the
      TCA cycle ("Krebs bicycle") and returning carbon toward aspartate. FH thus catalyses a reaction
      on the fumarate branch rather than a step of the ornithine-citrulline-argininosuccinate-arginine
      sequence itself. It does contribute a step (removing ASL product); when FH is lost fumarate accumulates
      and ASL runs in reverse to make argininosuccinate (PMID:24280230), showing FH activity is coupled
      to the cycle. This is a genuine but peripheral, isoform-specific (cytosolic) role, best kept as
      non-core.
    additional_reference_ids:
    - PMID:24280230
    supported_by:
    - &id001
      reference_id: PMID:27554470
      supporting_text: Cytosolic FH acts in the urea cycle (19), principally in liver and kidney (20)
        but not in adipose tissue.
    - &id002
      reference_id: PMID:24280230
      supporting_text: Argininosuccinate was found to be produced from arginine and fumarate by the reverse
        activity of the urea cycle enzyme argininosuccinate lyase (ASL), making these cells auxotrophic
        for arginine.
