  review:
    summary: Ensembl Compara transfer of urea cycle from mouse Fh1 (P97807).
    action: KEEP_AS_NON_CORE
    reason: Retain the curated mouse-to-human inference as a peripheral metabolic coupling. In PMID:23643539, cytosol-restricted
      human FH expressed in mouse renal models and human UOK262 cells lowers fumarate and argininosuccinate abnormalities
      (Figures 2-4); isotope tracing identifies reversed ASL flux in FH deficiency. FH performs fumarate/malate
      chemistry that controls this coupling, whereas ASL performs the arginine/argininosuccinate conversion. These
      experiments do not demonstrate that FH is an ornithine-cycle enzyme or establish dominant normal-tissue flux.
      The engineered FHcyt construct is not assigned to a natural isoform by name alone.
