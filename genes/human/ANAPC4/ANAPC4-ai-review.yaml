  review:
    summary: Nuclear periphery (IBA). The sole donor is yeast Apc4 found in stress-induced intranuclear
      quality-control (INQ) foci; over-annotated for human.
    action: MARK_AS_OVER_ANNOTATED
    reason: The yeast IDA behind this node comes from a screen for proteins in the INQ, a compartment
      that [PMID:25817432 "define a novel intranuclear quality control compartment (INQ) that sequesters
      misfolded, ubiquitylated and sumoylated proteins in response to genotoxic stress"]; yeast Apc4 was
      among the hits [PMID:25817432 "The hits included regulators of the S-phase checkpoint response (Mrc1
      and Pph3) and components of the anaphase-promoting complex (Cdc20, Cdc27 and Apc4), chaperones (Hsp104
      and Apj1) and histone deacetylases (Hos2 and Rpd3)"]. That is stress-induced sequestration, not
      a constitutive location or a function of APC4, and there is no human evidence for it.
    supported_by:
    - reference_id: PMID:25817432
      supporting_text: The hits included regulators of the S-phase checkpoint response (Mrc1 and Pph3)
        and components of the anaphase-promoting complex (Cdc20, Cdc27 and Apc4), chaperones (Hsp104 and
        Apj1) and histone deacetylases (Hos2 and Rpd3)
