id: Q9UJX5
gene_symbol: ANAPC4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ANAPC4 (APC4) is a large core subunit of the anaphase-promoting complex/cyclosome (APC/C),
  the E3 ubiquitin ligase that drives mitotic and meiotic progression and keeps cells in G1 by marking
  cyclins, securin and other cell-cycle regulators for proteasomal destruction. APC4, made of a WD40 propeller
  and a helical bundle, forms the platform at the base of the complex together with APC5 and two domains
  of APC1. The catalytic cullin-RING module (APC2-APC11) sits at the platform's periphery, so APC4 is
  a structural scaffold rather than a catalytic subunit. Nuclear PTEN can bind the APC/C and promote its
  association with the coactivator CDH1.
