existing_annotations:
- term:
    id: GO:0004842
    label: ubiquitin-protein transferase activity
  evidence_type: TAS
  original_reference_id: PMID:6180011
  qualifier: enables
  review:
    summary: Ubiquitin-protein transferase activity (TAS, PINC 2003). The cited PMID is an unrelated 1982
      HLA paper, and APC4 is not a catalytic subunit. Modified to the ligase activity APC4 contributes
      to.
    action: MODIFY
    reason: 'PMID:6180011 is titled [PMID:6180011 "Two subgroups of HLA Bw44 defined by cell-mediated
      lympholysis"]; it cannot support any ANAPC4 annotation, so the citation is a wrong identifier. On
      the biology, APC4 does not transfer ubiquitin: the catalytic APC2/APC11 module sits at the periphery
      of the platform APC4 forms [PMID:25043029 "APC/C’s catalytic subunits Apc2 (cullin) and Apc11 (RING)
      are positioned at the periphery of the platform"]. What APC4 does is scaffold, holding the catalytic
      module in position relative to the TPR lobe that recruits the coactivator [PMID:21307936 "Our structure
      explains how this TPR sub-complex, together with additional scaffolding subunits (Apc1, Apc4 and
      Apc5), coordinate the juxtaposition of the catalytic and substrate recognition module (Apc2, Apc11
      and Apc10 (also known as Doc1))"]. That is GO:0160072 ubiquitin ligase complex scaffold activity,
      the term this repository uses for the other APC/C scaffold subunits (APC1/nuc2 in the same platform,
      the TPR subunits, and ANAPC2).'
    supported_by:
    - reference_id: PMID:25043029
      supporting_text: The base of the APC/C comprises the platform subunits of Apc4 and Apc5, together
        with two domains of Apc1.
    - reference_id: PMID:25043029
      supporting_text: APC/C’s catalytic subunits Apc2 (cullin) and Apc11 (RING) are positioned at the
        periphery of the platform
    - reference_id: PMID:21307936
      supporting_text: Our structure explains how this TPR sub-complex, together with additional scaffolding
        subunits (Apc1, Apc4 and Apc5), coordinate the juxtaposition of the catalytic and substrate recognition
        module (Apc2, Apc11 and Apc10 (also known as Doc1))
    - reference_id: PMID:6180011
      supporting_text: Two subgroups of HLA Bw44 defined by cell-mediated lympholysis
    proposed_replacement_terms:
    - id: GO:0160072
      label: ubiquitin ligase complex scaffold activity
