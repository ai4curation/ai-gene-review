- id: PMID:24736612
  title: Changes in the daily rhythm of lipid metabolism in the diabetic retina.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Complete original Methods, Results, Discussion and included table text were read. Rat
      retinal Elovl4 transcript abundance was rhythmic in controls and altered in diabetic animals. No
      Elovl4 functional perturbation or timed protein chemistry establishes the product's role in the
      circadian process. No figure pixels or separate supplements were inspected.
- id: PMID:32780351
  title: The Elovl4 Spinocerebellar Ataxia-34 Mutation 736T>G (p.W246G) Impairs Retinal Function in the
    Absence of Photoreceptor Degeneration.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Complete original Methods, Results, Discussion and included captions were read. Rat
      W246G has selective lipid effects, with reduced skin very-long-chain saturated products and preserved
      retinal polyunsaturated products; retinal ERG effects do not resolve miniature excitatory/inhibitory
      current signs. The mutant is not treated as a clean null. No pixels or separate supplements were
      inspected.
- id: PMID:37491316
  title: Synapse-Specific Defects in Synaptic Transmission in the Cerebellum of W246G Mutant ELOVL4 Rats-a
    Model of Human SCA34.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Complete genuine PMC main HTML Methods, Results, Discussion and captions were read separately
      from the abstract-only normal cache. Rat W246G reduced miniature excitatory frequency but increased
      miniature inhibitory frequency and amplitude in the reported Purkinje-cell Results, with input-specific
      short-term plasticity effects. Discussion wording about inhibitory frequency is inconsistent with
      those Results; the actual Results govern the assessment. No pixels or supplementary raw data were
      inspected.
  full_text_unavailable: true
