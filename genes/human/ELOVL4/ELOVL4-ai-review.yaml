suggested_questions:
- question: Which very-long-chain monounsaturated acyl-CoA substrates are elongated by human ELOVL4, and
    how do membrane composition and elongation partners influence its substrate preferences?
- question: How should the signed GO:0061886 and GO:0097151 transfers from rat ELOVL4 be interpreted given
    the reduced Purkinje-cell mEPSC frequency and increased mIPSC frequency/amplitude reported for W246G
    in PMID:37491316? Which allele- and synapse-specific evidence establishes the direction of the normal
    product’s contribution, without treating this selective missense allele as a clean null or automatically
    reversing either sign?
