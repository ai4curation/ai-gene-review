id: Q9GZR5
gene_symbol: ELOVL4
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'ELOVL4 is a multipass endoplasmic reticulum membrane enzyme that catalyzes acyl-CoA/malonyl-CoA
  condensation, the first step of the two-carbon fatty-acid elongation cycle. It supports synthesis of
  very long-chain saturated and polyunsaturated fatty acids incorporated into specialized lipids, including
  skin lipids and retinal photoreceptor phospholipids. C-terminal truncating variants associated with
  Stargardt-like macular dystrophy can disrupt ER retention and redirect wild-type protein into intracellular
  inclusions. The SCA34-associated W246G missense variant has a distinct effect: in homozygous knock-in
  rats it reduces skin very-long-chain saturated fatty acids while preserving retinal very-long-chain
  polyunsaturated fatty acids.'
