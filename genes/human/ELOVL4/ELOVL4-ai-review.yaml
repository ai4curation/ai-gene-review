      protein itself to release neurotransmitter. The existing rat experimental evidence therefore supports
      the human orthology-derived annotation as a non-core contextual role. ELOVL4-dependent lipid production
      provides a biologically grounded regulatory explanation, but its specific mediation of this phenotype
      remains inferred: the Discussion proposes, rather than reports, lipid rescue in these W246G rats.
      Climbing-fiber effects differ, W246G is a selective missense allele rather than a complete null, and
      this is not direct human experimentation. These limits constrain the mechanism and scope without negating
      the measured facilitation phenotype.'
