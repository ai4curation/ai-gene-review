- id: PMID:23479632
  title: Role of ELOVL4 and very long-chain polyunsaturated fatty acids in mouse models of Stargardt type
    3 retinal degeneration.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete cached scientific Methods, Results and Discussion were read. Endogenous mouse
      conditional Elovl4 loss markedly depleted retinal C30-C34 polyunsaturated products; the human disease-transgene
      experiment is a separate context. This is neither an isolated human enzyme assay nor proof that
      every disease mechanism is simple loss of function. The extraction lacks full figure captions; no
      pixels or separate supplements were inspected.
