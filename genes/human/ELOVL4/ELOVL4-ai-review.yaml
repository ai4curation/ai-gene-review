- id: PMID:11138005
  title: A 5-bp deletion in ELOVL4 is associated with two related forms of autosomal dominant macular
    dystrophy.
  findings:
  - statement: The familial 5-bp ELOVL4 deletion, retinal expression and homology to yeast elongation
      proteins linked very-long-chain lipid biology to inherited macular degeneration; the study did not
      establish photoreceptor GPCR activity.
    supporting_text: Bioinformatic analysis of ELOVL4 revealed that it has homology to a group of yeast
      proteins that function in the biosynthesis of very long chain fatty acids.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The original disease-identification paper was recovered as indexed Methods, Results,
      Discussion and captions. It supports retinal expression, the familial 5-bp deletion and elongase
      homology, not GPCR photoreceptor activity or a light-detection experiment. No figure pixels or supplements
      were inspected. The normal cache remains abstract-only.
  full_text_unavailable: true
- id: PMID:16036915
  title: Dominant negative mechanism underlies autosomal dominant Stargardt-like macular dystrophy linked
    to mutations in ELOVL4.
  findings:
  - statement: Tagged wild-type human ELOVL4 localized to the ER and copurified with coexpressed ELOVL4,
      including a C-terminally truncated disease mutant. Heterogeneous detergent complexes and possible
      aggregation leave oligomeric stoichiometry and catalytic competence unresolved.
    supporting_text: Wild type ELOVL4 containing an endoplasmic reticulum retention sequence was localized
      to the endoplasmic reticulum as expected.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Recovered indexed original Methods, Results, Discussion and captions establish human
      retinal cDNA constructs, COS-7 ER/calnexin overlap and co-expression-dependent HEK293T copurification.
      Heterogeneous detergent complexes may aggregate; neither fixed oligomeric stoichiometry nor catalytic
      activity was established. No figure pixels, supplements or alignment of the actual insert to the
      current reference was available. The normal cache remains abstract-only.
  full_text_unavailable: true
- id: PMID:20937905
  title: ELOVL1 production of C24 acyl-CoAs is linked to C24 sphingolipid synthesis.
  findings:
  - statement: The comparative membrane assay included human ELOVL4 and detected weak but significant
      saturated C24:0/C26:0-CoA elongation-associated output. It assigns ELOVL4 to the condensing step
      without resolving the complete chain-length distribution or purified intermediate kinetics.
    supporting_text: Elongases catalyze the first of four steps in the VLCFA elongation cycle; mammals
      have seven elongases (ELOVL1-7). In the present study, we determined the precise substrate specificities
      of all the ELOVLs by in vitro analyses.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Authentic main text and Figure 1 were inspected independently. Human N-terminal 3xFLAG
      ELOVL4 in HEK293T total membranes gave weak but significant C24:0/C26:0-CoA elongation-associated
      output. ER localization and CERS2 association are explicitly reported in the main text, but detailed
      supplementary Methods and S2/S8 images remain unavailable. C18:1 was the only MUFA in that panel;
      no broad MUFA inactivity or resolved product-length distribution is inferred. The normal cache remains
      abstract-only.
  full_text_unavailable: true
