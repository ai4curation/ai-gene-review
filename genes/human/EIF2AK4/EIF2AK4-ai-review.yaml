id: Q9P2K8
gene_symbol: EIF2AK4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: EIF2AK4 encodes GCN2, a cytosolic eIF2alpha kinase that links amino-acid availability and
  translation stress to control of protein synthesis. Activated GCN2 phosphorylates EIF2S1/eIF2alpha at
  Ser51, reducing bulk translation initiation while supporting selective translation of stress-responsive
  transcripts. Its kinase activity is regulated by tRNA-dependent and ribosome-associated signaling mechanisms
  that coordinate cellular adaptation to amino-acid limitation and other translation stresses.
