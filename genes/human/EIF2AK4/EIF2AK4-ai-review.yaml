  supporting_entities:
  - InterPro:IPR016255
  review:
    summary: Fungal Gcn2 checkpoint participation is supported; transfer of that specific role to human
      EIF2AK4 remains unresolved.
    action: UNDECIDED
    reason: 'IPR016255 matches EIF2AK4 and supplies this mapping. PMID17369398 reports Gcn2-dependent
      eIF2alpha phosphorylation, translation attenuation and delayed pre-replicative-complex formation
      after UV in fission yeast. PMID19033384 also reports a Gcn2-dependent G1 delay after hydrogen peroxide,
      using Mcm6 loading to distinguish that delay from the later cell-cycle delay remaining in the mutant.
      Its stimulus specificity does not refute checkpoint participation: GO:0000077 requires contribution
      to a DNA damage checkpoint, not a response to every damaging stimulus. The evaluated mammalian studies
      establish conserved kinase and stress-translation functions but do not resolve conservation of this
      particular checkpoint role. UNDECIDED records that biological transfer uncertainty, without asserting
      that the human function is false.'
    supported_by:
