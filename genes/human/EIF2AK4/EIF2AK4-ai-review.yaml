references:
- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO terms
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: InterPro entries and the target domain assignments were inspected. Kinase active-site
      and GCN2-family matches support conserved kinase function; the fungal checkpoint implication is
      kept separately unresolved for the human gene.
- id: GO_REF:0000003
  title: Gene Ontology annotation based on Enzyme Commission mapping
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: EC 2.7.11.1 maps a broad serine/threonine kinase class. The substrate-specific refinement
      uses independent GCN2 evidence rather than inferring its substrate from the EC class alone.
- id: GO_REF:0000024
  title: Manual transfer of experimentally-verified manual GO annotation data to orthologs by curator
    judgment of sequence similarity
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: All 29 imported ISS contexts were joined by exact term to complete captured mouse Q9QZ05
      or yeast P15442 annotation responses. Donor species, primary access limits and source-specific phenotype
      direction remain explicit.
- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Six IBA contexts were traced through the current PANTHER tree and alignment to six literal
      positive IBD records on three ancestors of the exact human target. All selected path records are
      retained. Donor count and target self-evidence were not treated as defects.
- id: GO_REF:0000044
  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot Subcellular Location vocabulary mapping,
    accompanied by conservative changes to GO terms applied by UniProt
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: UniProt subcellular-location mapping supports the cytoplasmic context. It does not establish
      that the same localization or activity was tested for every alternative product.
- id: GO_REF:0000116
  title: Automatic Gene Ontology annotation based on Rhea mapping
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The Rhea mapping supplies serine-directed phosphorylation chemistry. Independent substrate
      evidence supports refinement to eIF2alpha kinase activity.
- id: GO_REF:0000117
  title: Electronic Gene Ontology annotations created by ARBA machine learning models
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: ARBA00028884 was evaluated against the captured target cross-references. Three of 144
      literal condition sets match target InterPro/FunFam fields. The rule predicts broad protein-metabolism
      regulation; independent evidence supports the more specific translation-initiation mechanism.
- id: PMID:1739968
  title: Phosphorylation of initiation factor 2 alpha by protein kinase GCN2 mediates gene-specific translational
    control of GCN4 in yeast.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The official bibliographic/abstract record and exact yeast donor annotations support
      GCN2-mediated eIF2alpha phosphorylation and gene-specific translational control. The original body
      was not independently reconstructed; no detailed human enzyme assay is attributed to it. The existing
      main publication cache is reused unchanged.
  full_text_unavailable: true
- id: PMID:2038314
  title: Ribosome association of GCN2 protein kinase, a translational activator of the GCN4 gene of Saccharomyces
    cerevisiae.
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The verified original abstract and exact yeast donor record support ribosome association,
      including salt-sensitive association rather than obligatory structural ribosome membership. The
      full original body was not recovered. Mammalian association evidence is kept separate from this
      yeast experiment.
  full_text_unavailable: true
- id: PMID:10504407
  title: Characterization of a mammalian homolog of the GCN2 eukaryotic initiation factor 2alpha kinase.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Publisher-indexed Methods, Results and Discussion establish mouse GCN2 kinase activity
      on human eIF2alpha, including the Ser51 substrate control. The enzyme is mouse AJ243533 expressed
      in human 293/293T cells; the human GCN2 sequence reported here is only a 548-residue EST-derived
      fragment. The unchanged publication cache is abstract-only. No direct full-length human GCN2 or
      natural-product equivalence is inferred.
- id: PMID:12176355
  title: Activation of GCN2 in UV-irradiated cells inhibits translation.
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Indexed original Methods and Results establish UV-induced GCN2-dependent eIF2alpha phosphorylation
      and translation attenuation in mouse fibroblasts. A cell-cycle effect is discussed as a possible
      consequence; these assays do not establish the human DNA-damage-checkpoint transfer. The normal
      cache remains abstract-only despite separate original-text access.
- id: PMID:16054071
  title: The GCN2 kinase biases feeding behavior to maintain amino acid homeostasis in omnivores.
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Verified bibliographic/abstract record and selected original summary and beginning of
      Results support mouse GCN2-dependent feeding responses to amino-acid imbalance. Complete Methods
      were not recovered. Retains the curator-supported organismal context without claiming a directly
      tested human feeding circuit.
  full_text_unavailable: true
- id: PMID:16121183
  title: Translational control of hippocampal synaptic plasticity and memory by the eIF2alpha kinase GCN2.
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Original Methods, Results and captions establish mouse GCN2-knockout effects whose direction
      depends on stimulation or training strength. Weak stimulation/training enhances plasticity or memory,
      whereas stronger protocols reveal impaired late plasticity or memory. Human GCN2 antigen used to
      raise an antibody is not a human functional experiment.
- id: PMID:16601681
  title: Antiviral effect of the mammalian translation initiation factor 2alpha kinase GCN2 against RNA
    viruses.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Original Methods and Results identify mouse GCN2 constructs despite their human expression
      host. Kinase and tRNA-regulatory controls support the conserved stress mechanism and antiviral translation
      restriction. The direct Northwestern probe is viral GAR RNA; it is not a direct tRNA-binding assay.
      Mouse infection and cellular results are kept distinct.
- id: PMID:17369398
  title: A novel checkpoint mechanism regulating the G1/S transition.
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Verified source linked from InterPro IPR016255 and selected original text concern a
      fungal G1/S checkpoint mechanism. The family assignment is valid, but conservation of kinase chemistry
      alone does not establish the same checkpoint role in human EIF2AK4. The newly acquired normal cache
      is not being represented as an additional complete operative-body read.
- id: PMID:19033384
  title: The G1-S checkpoint in fission yeast is not a general DNA damage checkpoint.
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: 'Verified PubMed abstract and selected indexed Results qualify the fungal checkpoint
      model: the G1/S response is stimulus-dependent rather than a general DNA-damage checkpoint. Complete
      operative Methods were not accessible. This qualification does not show that GCN2 lacks all checkpoint
      functions.'
  full_text_unavailable: true
- id: PMID:23447528
  title: IMPACT is a developmentally regulated protein in neurons that opposes the eukaryotic initiation
    factor 2α kinase GCN2 in the modulation of neurite outgrowth.
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: 'Separately accessed original Methods and selected Results, captions and Discussion
      support mouse GCN2 inhibition of neurite outgrowth in primary neurons and N2a cells; unchanged NeuN
      limits a broader differentiation claim. The Polysome Profiles Methods and Figure 5C–F explicitly
      measure GCN2 separately from IMPACT: panel E uses input normalization and panel F uses polysomal
      rpS6 normalization. The indexed Results contain a text discontinuity, but the complete Figure 5
      caption and Discussion independently identify the GCN2 measurement. No figure pixels or separately
      downloaded supplement were interpreted. The unchanged committed cache is abstract-only; external
      original access is described here rather than inferred from its flag. No direct human neuronal assay
      or obligatory ribosome membership is claimed.'
- id: PMID:24310610
  title: Vaccine activation of the nutrient sensor GCN2 in dendritic cells enhances antigen presentation.
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: 'Available main text distinguishes human dendritic-cell GCN2/eIF2alpha signaling (Figure
      1D) from mouse experiments: dendritic-cell-specific GCN2 deletion affects vaccine-induced T-cell
      responses (Figure 2F/G), and cross-presentation assays measure OT-I T-cell proliferation after dendritic-cell
      exposure to infected-cell material (Figure 4A/K). The positive immune contribution is retained without
      assigning a T-cell-intrinsic GCN2 mechanism. The unchanged normal cache is marked full_text_available:true
      but omits Methods and separately published supplementary material. The optional review-level availability
      flag is omitted because a single Boolean would obscure this partial access; the source guide records
      the actual sections read.'
- id: PMID:25329545
  title: p58IPK is an inhibitor of the eIF2α kinase GCN2 and its localization and expression underpin
    protein synthesis and ER processing capacity.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Bibliographic identity and the abstract identify GCN2 inhibition by p58IPK. Only a selected
      original caption was additionally accessible; the operative cold-response experiment was not recovered.
      The cold-response assertion remains unresolved. Central kinase and amino-acid stress claims have
      independent support; this does not reconstruct this paper's unavailable Methods.
  full_text_unavailable: true
- id: PMID:26102367
  title: Translational Upregulation of an Individual p21Cip1 Transcript Variant by GCN2 Regulates Cell
    Proliferation and Survival under Nutrient Stress.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Operative original Methods and Results distinguish human SQ20B GCN2-depletion experiments
      from mouse p21 transcript reporters and translation analyses. Supports GCN2-dependent eIF2alpha
      phosphorylation during leucine limitation and selective p21 transcript translation alongside bulk
      translational inhibition. Does not assign activity to each natural human GCN2 product.
  full_text_unavailable: false
- id: PMID:32610081
  title: Ribosome Collisions Trigger General Stress Responses to Regulate Cell Fate.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Human MCF10A GCN2 inhibition and shRNA establish collision-induced eIF2alpha phosphorylation
      dependence. Kinase-dead ZAKalpha rescues this branch, whereas simple glutamine-starvation signaling
      persists in ZAK-knockout cells. The original did not capture GCN2 or GCN20 on collided ribosomes.
      Selected Methods, Results and captions were read; supplement files were not inspected. This is cellular
