    reason: The UniProt SL-0134 mapping agrees with WT human Golgi localization and the predicted N-terminal
      signal anchor. Retain Golgi membrane without treating microscopy as direct bilayer-topology measurement
      or generalizing to the short isoform.
    supported_by:
