  - UniProtKB:Q68CQ7
  review:
    action: ACCEPT
    reason: PAINT assigns Golgi apparatus activity to eukaryotic AN1/PTN001012071; the target descends
      from this node. The human entry is legitimately among the experimental descendants used by the curator,
      alongside mapped Arabidopsis GATL proteins with Golgi IDA records. This supports conserved Golgi
      activity and agrees with direct GLT8D1 localization; keep the incoming is_active_in qualifier distinct
      from located_in membrane annotations.
    supported_by:
    - reference_id: GO_REF:0000033
    - reference_id: PMID:34746377
- term:
    id: GO:0016020
    label: membrane
  evidence_type: HDA
  original_reference_id: PMID:19946888
  qualifier: located_in
  review:
    action: UNDECIDED
    reason: 'The abstract describes membrane-fraction proteomics of YTS cells, but the GLT8D1-specific
      identification and peptides could not be inspected: the linked supporting XLS is inaccessible. Membrane
      association is consistent with independently supported Golgi localization, yet this particular HDA
      evidence remains unverified. No contamination, plasma-membrane residence or isoform-specific conclusion
      is inferred (PMID:19946888).'
    supported_by:
    - reference_id: PMID:19946888
- term:
    id: GO:0016757
    label: glycosyltransferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR002495
  review:
    action: MODIFY
    reason: Refine this broad family-based activity to galactosyltransferase activity. Purified human
      residues 52–371 generated galactose-containing disaccharide products by LC–MS/MS. Low efficiency
      and unidentified physiological acceptors limit the biological substrate claim, not the demonstrated
      transfer reaction. No linkage-specific term or natural short-isoform activity is inferred (PMID:38066107).
    proposed_replacement_terms:
    - id: GO:0008378
      label: galactosyltransferase activity
    supported_by:
    - reference_id: PMID:38066107
      supporting_text: 'GLT8D1 displayed

        glycosyltransferase activity from UDP-galactose onto N-acetylgalactosamine'
- term:
    id: GO:0046527
    label: glucosyltransferase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN004435860
  - UniProtKB:P19817
  - UniProtKB:P27128
  - UniProtKB:P27129
  review:
    action: ACCEPT
    reason: PAINT places this function at PTHR13778 AN0/PTN004435860, ancestral to the exact human GLT8D1
      leaf AN57/PTN002492649; the three literal donors have experimental glucosyltransferase annotations
      and no loss is recorded on the target path. Retain this phylogenetic inference. Human full-length
      UDP-glucose assays measure UDP release without identifying a glucosylated product (PMID:35198895);
      the soluble-domain result does not establish loss of glucose transfer (PMID:38066107). Physiological
      donor/acceptor specificity remains unresolved.
    supported_by:
    - reference_id: GO_REF:0000033
    - reference_id: PMID:35198895
    - reference_id: PMID:38066107
