id: Q68CQ7
gene_symbol: GLT8D1
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: GLT8D1 is a Golgi-associated type-II membrane glycosyltransferase. A purified human catalytic-domain
  construct transfers galactose in vitro; its efficient physiological substrates remain unknown. Its donor
  and acceptor specificity may depend on molecular context. The natural short splice product has not been
  functionally resolved.
