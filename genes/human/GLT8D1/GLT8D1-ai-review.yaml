    label: Golgi membrane
  evidence_type: EXP
  original_reference_id: PMID:34746377
  qualifier: located_in
  review:
    action: ACCEPT
    reason: Full-length FLAG-tagged human WT GLT8D1 colocalized with a Golgi marker in transfected HEK293T
      cells; I290M instead accumulated in the ER. This supports the curated Golgi placement, with membrane
      association corroborated by the predicted UniProt signal anchor. Microscopy does not resolve bilayer
      topology, and the result is not generalized to every isoform or variant (PMID:34746377).
    supported_by:
    - reference_id: PMID:34746377
