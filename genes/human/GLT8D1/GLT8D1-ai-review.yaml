- term:
    id: GO:0046527
    label: glucosyltransferase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN004435860
  - UniProtKB:P19817
  - UniProtKB:P27128
  - UniProtKB:P27129
  review:
    action: KEEP_AS_NON_CORE
    reason: PAINT places the positive glucosyltransferase assertion at PTHR13778 AN0/PTN004435860, ancestral
      to human AN57/PTN002492649. Its experimentally grounded donors are bacterial LPS enzymes P19817
      (Salmonella waaJ), P27128 (E. coli waaO) and P27129 (E. coli waaJ). The separate bacteria-restricted
      LPS-process assertion does not taxonomically restrict this ancestral molecular function. Full-length
      UDP-glucose assays measure UDP release without a defined acceptor or identified glucosylated product
      (PMID:35198895). Soluble human 52–371 did not hydrolyze UDP-glucose; the panel measured hydrolysis,
      not glucose transfer (PMID:38066107). Retain this ancestral annotation as a non-core additional
      specificity.
    supported_by:
    - reference_id: GO_REF:0000033
    - reference_id: PMID:35198895
    - reference_id: PMID:38066107
