suggested_questions:
- question: Which endogenous donor and acceptor define GLT8D1 activity, and does the natural Q68CQ7-2
    splice product retain catalytic function?
suggested_experiments:
- description: Compare full-length Q68CQ7-1 and Q68CQ7-2 in membrane-compatible assays with candidate
    native acceptors and direct product identification.
  hypothesis: Construct context and acceptor structure may distinguish native activity from low-efficiency
    screening reactions.
