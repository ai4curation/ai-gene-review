core_functions:
- description: Bridge processed PIDD1 and caspase-2 through death-domain and CARD interactions,
    organizing caspase-2 activation in apoptotic signaling. The DD structure defines an assembly
    interface, not an obligatory intact-cell stoichiometry; stress-induced nucleolar and p53-feedback
    contexts are described separately.
