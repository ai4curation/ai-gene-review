    label: apoptotic signaling pathway
  locations:
  - id: GO:0005829
    label: cytosol
  in_complex: *id004
  supported_by:
  - reference_id: PMID:9044836
    supporting_text: adaptor/signaling molecule, CRADD, was identified and was shown to induce
      apoptosis.
  - reference_id: PMID:15073321
    supporting_text: complex that contains the death domain-containing protein PIDD
suggested_questions:
- question: What is the endogenous cellular role of the 103-residue CRADD alternative product,
    which retains the CARD region but lacks the canonical death domain?
- question: Which physiological stimuli recruit endogenous CRADD to cytoplasmic versus nucleolar
    CASP2 platforms, and when is PIDD1 required?
- question: Does the binary interaction with HTLV Tax occur in infection, and how should the conflicting
    Tax E3-activity experiments constrain partner-class annotation?
- question: Which source record generated the CRADD mechanical-response annotation linked to PMID19593445,
    whose complete original instead assays BAD in prostate-cancer models?
suggested_experiments:
- description: Measure endogenous CRADD isoform abundance and localization with isoform-resolved
    assays, then compare PIDD1 recruitment and CASP2 activation after matched rescue at near-endogenous
    expression.
- description: Use endogenous CRADD perturbation and compartment-resolved CASP2 activation reporters
    across defined genotoxic and receptor stimuli, separating adaptor recruitment, complex assembly
    and downstream cell death.
