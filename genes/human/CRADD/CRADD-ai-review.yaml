id: P78560
gene_symbol: CRADD
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CRADD (RAIDD) is a nonenzymatic signaling adaptor that links death-domain-containing
  PIDD1 to caspase-2. Its C-terminal death domain assembles with the processed PIDD1 death-domain
  region, while its N-terminal CARD recruits caspase-2 through prodomain interactions. These contacts
  organize caspase-2 activation platforms involved in apoptotic signaling. Cytoplasmic and, after
  genotoxic stress, nucleolar platforms have distinct requirements for PIDD1. CRADD-dependent
  caspase-2 activation can also reinforce p53 signaling through MDM2 cleavage. Disruptive human
  CRADD variants impair neuronal apoptotic signaling and cause a cortical malformation syndrome.
  The shorter alternative product retains the CARD region but lacks the canonical death domain;
  its cellular function is unresolved.
