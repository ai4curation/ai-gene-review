      name: signaling adaptor activity
      definition:
        text: The binding activity of a molecule that brings together two or more molecules in a signaling pathway,
          permitting those molecules to function in a coordinated way. Adaptor molecules themselves do not have
          catalytic activity.
        xrefs:
        - dbCode: PMID
          dbId: '19104498'
      comment: 'A signaling adaptor can bring together both protein and non-protein molecules within a signaling
        pathway. Scaffold proteins act in at least four ways: tethering signaling components, localizing these components
        to specific areas of the cell, regulating signal transduction by coordinating positive and negative feedback
        signals, and insulating correct signaling proteins from competing proteins (PMID:19104498).'
