    definition:
      text: The series of molecular signals which triggers the apoptotic death of a cell. The pathway starts with
        reception of a signal, and ends when the execution phase of apoptosis is triggered.
    comment: This term can be used to annotate gene products involved in apoptotic events happening downstream of
      the cross-talk point between the extrinsic and intrinsic apoptotic pathways. The cross-talk starts when caspase-8
      cleaves Bid and truncated Bid interacts with mitochondria. From this point on it is not possible to distinguish
      between extrinsic and intrinsic pathways.
