- url: https://www.ebi.ac.uk/QuickGO/services/ontology/go/terms/GO:0007165
  response_sha256: f198c9acc7b3ff9e23cfebd9da469121f9e1217f016f86431afc8e1ea3b1c58d
  term:
    id: GO:0007165
    isObsolete: false
    name: signal transduction
    definition:
      text: The cellular process in which a signal is conveyed to trigger a change in the activity or state of a
        cell. Signal transduction begins with reception of a signal (e.g. a ligand binding to a receptor or receptor
        activation by a stimulus such as light), or for signal transduction in the absence of ligand, signal-withdrawal
        or the activity of a constitutively active receptor. Signal transduction ends with regulation of a downstream
        cellular process, e.g. regulation of transcription or regulation of a metabolic process. Signal transduction
        covers signaling from receptors located on the surface of the cell and signaling via molecules located within
        the cell. For signaling between cells, signal transduction is restricted to events at and within the receiving
        cell.
    comment: Note that signal transduction is defined broadly to include a ligand interacting with a receptor, downstream
      signaling steps and a response being triggered. A change in form of the signal in every step is not necessary.
      Note that in many cases the end of this process is regulation of the initiation of transcription. Note that
      specific transcription factors may be annotated to this term, but core/general transcription machinery such
      as RNA polymerase should not.
    synonyms:
    - name: signaling cascade
      type: narrow
    - name: signaling pathway
      type: related
    - name: signalling cascade
      type: narrow
    - name: signalling pathway
      type: related
