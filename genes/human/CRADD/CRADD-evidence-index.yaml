  response_sha256: 71854a29ea73f9eebfa3d47224aafb89f746289c790fd5da1322e34544d4c272
  term:
    id: GO:0008625
    isObsolete: false
    name: extrinsic apoptotic signaling pathway via death domain receptors
    definition:
      text: The series of molecular signals in which a signal is conveyed from the cell surface to trigger the apoptotic
        death of a cell. The pathway starts with a ligand binding to a death domain receptor on the cell surface,
        and ends when the execution phase of apoptosis is triggered.
    comment: 'Gene products that may be annotated to this term include: 1) ligands such as FASL; 2) receptors such
      as FAS/CD95 (though care should be taken because FAS can also act as a non-apoptotic signal transducer); 3)
      signaling molecules such as FADD (FAS-associated protein with a death domain), cIAPs (cellular inhibitor of
      apoptosis proteins), c-FLIPs and caspases 8 and 10. Examples are TWEAK (TNF12) and FN14 (TNFRSF12A) (UniProt
      symbols O43508 and Q9NP84) in PMID:21525013.'
    synonyms:
    - name: death receptor-mediated apoptosis
      type: narrow
    - name: induction of apoptosis via death domain receptors
      type: related
    - name: induction of apoptosis via death receptors
      type: exact
    children:
