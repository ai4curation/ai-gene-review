  term:
    id: GO:0050700
    isObsolete: false
    name: CARD domain binding
    definition:
      text: Binding to a CARD (N-terminal caspase recruitment) domain, a protein-protein interaction domain that
        belongs to the death domain-fold superfamily. These protein molecule families are similar in structure with
        each consisting of six or seven anti-parallel alpha-helices that form highly specific homophilic interactions
        between signaling partners. CARD exists in the N-terminal prodomains of several caspases and in apoptosis-regulatory
        proteins and mediates the assembly of CARD-containing proteins that participate in activation or suppression
        of CARD carrying members of the caspase family.
      xrefs:
      - dbCode: PMID
        dbId: '12054670'
    aspect: molecular_function
    usage: Unrestricted
