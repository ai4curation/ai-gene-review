core_functions:
- description: Catalyzes PLP-dependent, reversible transamination of leucine, isoleucine
    and valine with 2-oxoglutarate in the mitochondrial matrix. This homodimer produces 
    the corresponding branched-chain keto acids and glutamate, supplying the first 
    reaction of BCAA catabolism upstream of BCKDH. The same chemistry supports 
    reamination of pre-existing ketoacid skeletons.
  molecular_function:
    id: GO:0004084
    label: branched-chain-amino-acid:2-oxoglutarate transaminase activity
  directly_involved_in:
  - id: GO:0009083
    label: branched-chain amino acid catabolic process
  locations:
  - id: GO:0005759
    label: mitochondrial matrix
  supported_by:
  - reference_id: PMID:17050531
    supporting_text: "plays a crucial role in orienting the substrate\noptimally for catalysis"
  - reference_id: PMID:11264579
  - reference_id: Reactome:R-HSA-70724
    supporting_text: reversible reactions of leucine, isoleucine, or valine with 
      alpha-ketoglutarate (2-oxoglutarate)
  - reference_id: Reactome:R-HSA-508179
    supporting_text: with glutamate to form leucine, isoleucine, or valine, 
      respectively, and alpha-ketoglutarate
proposed_new_terms: []
suggested_questions:
- question: Under which human tissue and nutrient conditions does BCAT2 carry net 
    reamination flux, and how much of that flux is attributable to BCAT2 rather than 
    BCAT1?
- question: Does the shorter cytosolic PP18b splice product retain the substrate 
    specificity, catalytic efficiency and dimer organization of the canonical 
    mitochondrial product?
suggested_experiments:
- description: Compare purified canonical mature BCAT2 and PP18b under matched 
    conditions, measuring PLP occupancy, oligomeric state and kinetics in both 
    transamination directions. Separately test subcellular distribution of the 
    endogenous products in human cells.
  hypothesis: The large N-terminal deletion can alter catalytic or assembly properties 
    in addition to changing subcellular targeting.
  experiment_type: isoform-resolved biochemical and localization analysis
