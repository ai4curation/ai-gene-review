gene_symbol: BCAT2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: BCAT2 is a pyridoxal 5'-phosphate-dependent branched-chain amino acid aminotransferase.
  It reversibly transfers the amino group of leucine, isoleucine or valine to 2-oxoglutarate, producing
  the corresponding branched-chain keto acid and glutamate. Its canonical product is imported into
  the mitochondrial matrix and functions as a homodimer, initiating branched-chain amino acid catabolism
  upstream of the branched-chain ketoacid dehydrogenase complex. The same reversible chemistry can
  regenerate amino acids from their existing ketoacid carbon skeletons. PLP is linked to an active-site
  lysine, and a nearby CXXC motif influences substrate positioning and catalytic activity in biochemical
  studies. A shorter splice product, PP18b, has been detected in the cytosolic fraction of human
  placenta; this product is distinct from the cytosolic paralog BCAT1.
