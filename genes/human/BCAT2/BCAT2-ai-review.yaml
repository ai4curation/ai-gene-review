id: O15382
gene_symbol: BCAT2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: BCAT2 is a pyridoxal 5'-phosphate-dependent branched-chain amino acid 
  aminotransferase (EC 2.6.1.42). It reversibly transfers the amino group of leucine, 
  isoleucine or valine to 2-oxoglutarate, producing glutamate and alpha-ketoisocaproate,
  alpha-keto-beta-methylvalerate or alpha-ketoisovalerate, respectively. The 
  mitochondrial homodimer initiates BCAA catabolism upstream of the branched-chain 
  ketoacid dehydrogenase complex; the reverse reaction regenerates amino acids from 
  existing ketoacid skeletons. PLP binds at the active site, and a nearby CXXC motif 
  influences substrate positioning. BCAT2 is broadly expressed, with high abundance in 
  muscle. A shorter splice product, PP18b, occurs in the cytosolic fraction of human 
  placenta and is distinct from the paralog BCAT1. Biallelic loss of BCAT2 activity 
  causes hypervalinemia and hyperleucine-isoleucinemia.
