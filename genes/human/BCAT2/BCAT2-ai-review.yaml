core_functions:
- description: The canonical mitochondrial product catalyzes PLP-dependent transamination of leucine,
    isoleucine and valine with 2-oxoglutarate. The homodimer couples branched-chain amino acid metabolism
    to glutamate formation and initiates the catabolic pathway. Its reaction is reversible; downstream
    oxidative decarboxylation is performed by BCKDH. PLP binding and dimer organization support this
    catalytic function rather than constituting separate metabolic functions.
  molecular_function:
    id: GO:0004084
    label: branched-chain-amino-acid:2-oxoglutarate transaminase activity
  directly_involved_in:
  - id: GO:0009083
    label: branched-chain amino acid catabolic process
  locations:
  - id: GO:0005759
    label: mitochondrial matrix
  supported_by:
  - reference_id: PMID:17050531
  - reference_id: PMID:11264579
  - reference_id: Reactome:R-HSA-70724
  - reference_id: Reactome:R-HSA-508179
proposed_new_terms: []
suggested_questions:
- question: Under which human tissue and nutrient conditions does BCAT2 carry net reamination flux,
    and how much of that flux is attributable to BCAT2 rather than BCAT1?
- question: Does the shorter cytosolic PP18b splice product retain the substrate specificity, catalytic
    efficiency and dimer organization of the canonical mitochondrial product?
suggested_experiments:
- description: Compare purified canonical mature BCAT2 and PP18b under matched conditions, measuring
    PLP occupancy, oligomeric state and kinetics in both transamination directions. Separately test
    subcellular distribution of the endogenous products in human cells.
  hypothesis: The large N-terminal deletion can alter catalytic or assembly properties in addition
    to changing subcellular targeting.
  experiment_type: isoform-resolved biochemical and localization analysis
