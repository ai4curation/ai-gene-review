id: Q8N2F6
gene_symbol: ARMC10
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ARMC10 (SVH) is a 343-residue armadillo-repeat protein with a single N-terminal transmembrane
  segment, the vertebrate ancestor of the eutherian ARMCX genes. It sits on the mitochondrial outer membrane,
  binds the KIF5/MIRO/TRAK2 trafficking complex and controls the number of moving mitochondria in neurons.
  AMPK phosphorylates it at S45, and ARMC10 is required for AMPK-induced mitochondrial fission. Mouse
  ArmC10 binds the myeloid growth factor oncomodulin with high affinity and mediates oncomodulin-driven
  axon regeneration. The SVH-B splice isoform binds p53 and suppresses its transcriptional activity.
