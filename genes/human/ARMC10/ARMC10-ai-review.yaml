proposed_new_terms: []
suggested_questions:
- question: The SVH-B isoform binds p53 and suppresses its transcriptional activity in hepatoma cells
    (PMID:17904127). Is this relevant to endogenous ARMC10 at mitochondria?
- question: How does ARMC10, a single-pass mitochondrial outer-membrane protein, act as a cell-surface
    receptor for oncomodulin? Is a distinct isoform or pool at the plasma membrane?
- question: Does S45 phosphorylation by AMPK change ARMC10's binding to MIRO/TRAK2 or to fission factors
    such as MFF or DRP1?
suggested_experiments:
- description: Express phospho-dead S45A and phospho-mimetic S45D ARMC10 in ARMC10-knockout cells and
    measure fission and mitochondrial motility under AMPK activation.
