id: Q96L96
gene_symbol: ALPK3
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'ALPK3 is a muscle-enriched alpha-kinase-family protein that organizes sarcomeric M-band
  proteins and supports the development and maintenance of functional cardiomyocytes. Human cell studies
  place ALPK3 at the M band and, in tagged immature cardiomyocytes, at the nuclear envelope, where its
  loss disrupts myomesin organization. Interactions with M-band proteins connect ALPK3 to sarcomeric protein
  homeostasis. Its intrinsic protein kinase activity remains disputed: positive recombinant-domain phosphorylation
  assays coexist with negative catalytic-domain and cellular mutant studies. Loss-of-function variants
  cause severe pediatric and adult cardiomyopathy.'
