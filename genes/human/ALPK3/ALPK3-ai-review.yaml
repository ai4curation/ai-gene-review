- term:
    id: GO:0004674
    label: protein serine/threonine kinase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - InterPro:IPR004166
  - EC:2.7.11.1
  review:
    action: UNDECIDED
    summary: Intrinsic ALPK3 serine/threonine kinase activity is experimentally disputed.
    reason: The InterPro/EC inference is plausible from family membership but cannot settle ALPK3-specific
      catalysis. PMID:39196058 reports positive recombinant-domain phosphoproteomics and a SQSTM1 immunoprecipitate
      assay with heat-denatured-domain and phosphatase controls. PMID:36321451 reports negative cellular
      catalytic-cleft tests, and PMID:38048395 reports a negative mouse-domain assay with an active TRPM7
      control. The latter does not test every full-length human condition, and the positive experiment
      does not prove that all observed phosphorylation is intrinsic to ALPK3. Retain the unresolved conflict
      rather than declaring the positive result an artifact or accepting family activity as measured human
      catalysis.
    supported_by:
    - reference_id: PMID:36321451
      full_text_unavailable: false
      supporting_text: Our phosphoproteomic studies of ALPK3dIC/dIC hiPSC-CMs, which altered the conformation
        of the kinase domain, ALPK3sIC/sIC, which targeted the predicted aspartate residue critical for
        catalysis, and massive overexpression of ALPK3 in HEK293T cells indicated that none of these perturbations
        significantly affected phosphorylation across the proteome.
    - reference_id: PMID:38048395
      full_text_unavailable: false
      supporting_text: However, our experimental results revealed the absence of detectable kinase activity
        in ALPK3 under the tested conditions (Figure 1B).
    - reference_id: PMID:39196058
      full_text_unavailable: false
      supporting_text: One tube received 5 μg active ALPK3 kinase and one received 5 μg of heat-denatured
        ALPK3 kinase.
