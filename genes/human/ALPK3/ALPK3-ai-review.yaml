- id: PMID:11418590
  title: A novel myocyte-specific gene Midori promotes the differentiation of P19CL6 cells into cardiomyocytes.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Primary identifier and DOI 10.1074/jbc.M100485200 verified. Original full JBC article
      read through the author-uploaded ResearchGate copy, including Methods and Figures 5-7. Mouse Midori
      cDNA, epitope-tagged localization in COS cells, and sense/antisense stable mouse P19CL6 lines support
      nuclear localization and altered acquisition of cardiac features under DMSO. Predicted ATP/GTP motif
      and proposed transcriptional regulation are not direct nucleotide-binding or transcription-factor
      assays. Primary access route: https://www.researchgate.net/publication/232284045_A_Novel_Myocyte-specific_Gene_MidoriPromotes_the_Differentiation_of_P19CL6_Cells_into_Cardiomyocytes
      . The normal publication record is now cached and its actual contents were independently read. Entire
      actual abstract read: mouse heart/skeletal-muscle expression, P19CL6 sense/antisense differentiation,
      nuclear localization and a predicted ATP/GTP motif. This record does not contain the original Methods
      or figures. The earlier external original JBC read remains separately documented; the motif is not
      an ATP-binding assay.'
  findings: []
- id: PMID:21441111
  title: Cardiomyopathy in α-kinase 3 (ALPK3)-deficient mice.
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: 'Primary identifier and DOI 10.1177/0300985811402841 verified. Primary PubMed abstract
      read; full body not recovered. Mouse knockout, cardiac magnetic resonance and microscopy show abnormal
      cardiomyocyte architecture and impaired contraction. These are mouse developmental and functional
      observations, not a purified kinase assay or direct human-protein experiment. Primary access route:
      https://pubmed.ncbi.nlm.nih.gov/21441111/ . The normal publication record is now cached and its
      actual contents were independently read. Entire actual abstract read: Alpk3-deficient mice, cardiac
      magnetic resonance and microscopy, abnormal intercalated discs/myofibrils and impaired contraction.
      Full body is unavailable in this record. Introductory nuclear-kinase wording is not a new enzyme
      assay.'
  findings: []
- id: PMID:26846950
