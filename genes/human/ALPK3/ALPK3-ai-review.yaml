    reason: 'The mouse donor is experimentally grounded: MGI links nuclear IDA to J:71661, the original
      mouse Midori paper PMID:11418590, whose tagged protein localizes to COS-cell nuclei. Independent
      human support comes from PMID:36321451 Figure 6: transient ALPK3-FLAG in hiPSC-derived cardiomyocytes
