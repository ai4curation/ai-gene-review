suggested_questions:
- question: Does native full-length human ALPK3 bind ATP and catalyze phosphotransfer, or do its alpha-kinase
    fold and partner interactions primarily support a noncatalytic organizing role?
- question: Which ALPK3 interactions form a simultaneous functional bridge or stable scaffold, rather
    than independent associations with MYOM2, obscurin, SQSTM1 and MuRF proteins?
- question: How does nuclear-envelope localization vary between endogenous and tagged ALPK3, developmental
    stages and species?
suggested_experiments:
- description: Compare purified full-length human ALPK3 and its isolated domain with matched mouse proteins,
    multiple independent purification steps, inactive-site variants and active alpha-kinase controls;
    measure direct ATP binding and site-resolved phosphotransfer onto purified SQSTM1 separately from
    lysate or immunoprecipitate assays.
- description: Use endogenous knock-in tags and orthogonal antibodies in staged human cardiomyocytes to
    quantify nuclear-envelope and M-band pools, and reconstitute defined ALPK3-partner combinations to
    distinguish structural assembly from indirect proteostasis changes.
