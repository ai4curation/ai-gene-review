core_functions:
- description: ALPK3 organizes the cardiomyocyte M-band protein network and supports formation and maintenance
    of a functional contractile apparatus. Human ALPK3 localization, partner association and loss-of-function
    studies connect it to myomesin and SQSTM1 positioning; the nuclear-envelope pool is documented in
    tagged immature human cardiomyocytes. An autonomous kinase or precisely defined bridging activity
    is not assigned while the catalytic conflict and the molecular organization of this network remain
    unresolved.
