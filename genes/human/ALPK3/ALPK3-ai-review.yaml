- id: PMID:36321451
  title: Pathogenesis of Cardiomyopathy Caused by Variants in ALPK3, an Essential Pseudokinase in the
    Cardiomyocyte Nucleus and Sarcomere.
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: 'Primary identifier and DOI 10.1161/CIRCULATIONAHA.122.059688 verified. Full PMC Methods,
      Results and Figures 2-6 read. Human isogenic cardiomyocytes, mouse knockout and human tissue show
      myomesin mislocalization and sarcomere disruption. Tagged ALPK3 in human cardiomyocytes localizes
      to M bands and nuclear envelope; HEK293T co-IP supports MYOM2 association, while MYOM1 co-IP was
      negative despite colocalization. Cellular catalytic-cleft mutations and overexpression support the
      pseudokinase interpretation, but do not establish absence of catalysis under every biochemical condition.
      PMID:39196058 reports a conflicting positive domain assay. Historical residue numbers use the article
      sequence rather than current 1705-aa UniProt coordinates. Primary access route: https://pmc.ncbi.nlm.nih.gov/articles/PMC9698156/
      . The normal publication record is now cached and its actual contents were independently read. Actual
      extracted Methods, relevant Results/Figures and Discussion read: isogenic human hiPSC-CMs with truncations,
      G1777E/D1784A dual-cleft and D1774A single-cleft variants; cellular phosphoproteomics and HEK293T
      overexpression support a noncatalytic model within those conditions. Tagged ALPK3 is at M-bands
      and predominantly nuclear envelope in these models; endogenous antibody specificity is problematic.
      MYOM2 co-IP is positive in HEK293T, while MYOM1 co-IP is negative despite colocalization. Mouse
      knockout supplies separate in-vivo structural evidence. Cellular negative phosphoproteomics does
      not universally disprove a biochemical activity under other conditions.'
  findings:
  - statement: Human cellular catalytic-cleft and overexpression experiments support a noncatalytic interpretation
      within the tested models; this does not negate the positive domain assay in another study.
    supporting_text: Our phosphoproteomic studies of ALPK3dIC/dIC hiPSC-CMs, which altered the conformation
      of the kinase domain, ALPK3sIC/sIC, which targeted the predicted aspartate residue critical for
      catalysis, and massive overexpression of ALPK3 in HEK293T cells indicated that none of these perturbations
      significantly affected phosphorylation across the proteome.
- id: PMID:38048395
  title: ALPK3 Functions as a Pseudokinase.
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: 'Primary identifier and DOI 10.1161/CIRCULATIONAHA.123.065993 verified. Full PMC research
      letter and Figure 1 read. Recombinant mouse ALPK3 residues 1339-1608 fail to phosphorylate heat-inactivated
      rat H9c2 or human cardiomyocyte lysates containing SQSTM1; mouse TRPM7 is a positive control. Mouse
      K1420R knock-in retains cardiac function and SQSTM1 phosphosignal. These negative results are substantive
      but concern a mouse isolated domain and a mouse mutation, rather than every full-length human context.
      They conflict with PMID:39196058; neither a proven contaminant nor universal inactivity is asserted.
      Primary access route: https://pmc.ncbi.nlm.nih.gov/articles/PMC10697696/ . The normal publication
      record is now cached and its actual contents were independently read. Entire actual experimental
      research-letter body and Figure 1 caption read, despite its short format/no PubMed abstract: murine
      ALPK3 domain 1339–1608, murine TRPM7 positive control, heat-inactivated rat H9c2/human hiPSC-CM
      lysates and radiolabeled ATP; no ALPK3 activity under tested conditions. Mouse K1420R preserves
      adult cardiac function and SQSTM1 T269/S272 ratio. Modeled nucleotide pockets are not measured binding.
      This is real negative evidence, not a universal inactivity proof.'
  findings:
  - statement: The mouse catalytic domain showed no detectable activity in the reported assay with an
      active TRPM7 comparator.
    supporting_text: However, our experimental results revealed the absence of detectable kinase activity
      in ALPK3 under the tested conditions (Figure 1B).
- id: PMID:39196058
  title: Alpha kinase 3 signaling at the M-band maintains sarcomere integrity and proteostasis in striated
    muscle.
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: 'Primary identifier and DOI 10.1038/s44161-023-00219-9 verified. Full PMC Methods, Results
      and Extended Data Figure 9 read. Endogenous tagged human ALPK3, human cardiac organoids and a mouse
      truncation model support M-band organization. Bacterially expressed His-tagged ALPK3 domain, reported
      residues 1577-1828, increases lysate phosphopeptides after irreversible endogenous-kinase inhibition.
      The SQSTM1-HA assay uses HEK293FT immunoprecipitates, active versus heat-denatured domain and phosphatase
      controls; it is not a wholly purified two-protein reaction. Positive phosphorylation evidence is
      retained, while intrinsic activity and the combined T269/S272 readout remain unresolved against
      PMID:38048395. Neither host-cell species nor old residue numbering is silently equated to a current
      canonical construct. Primary access route: https://pmc.ncbi.nlm.nih.gov/articles/PMC11358020/ .
      The normal publication record is now cached and its actual contents were independently read. Actual
      Methods, relevant Results/Figures and Discussion read: human tagged hPSC cardiomyocytes and mouse
      W1538X models; live tagged localization supports M-band and lacks a detected nuclear signal in that
      model. Recombinant domain 1577–1828 is expressed in E. coli BL21 and Ni-NTA purified. CM lysates
      are treated with fluorosulfonylbenzoyladenosine and dialyzed before addition of recombinant domain
      versus water. The targeted assay uses SQSTM1-HA immunoprecipitated from HEK293FT, active versus
      heat-denatured domain and lambda-phosphatase controls. These are positive kinase results that must
      be retained; the target is not a purified two-protein system and T269/S272 antibody does not isolate
      the residue class. Recombinant-domain species is not assigned merely from the bacterial or human
      host. Cellular proteomic changes include downstream effects.'
  findings:
  - statement: The positive targeted assay compares active and heat-denatured recombinant ALPK3 domain
      on a SQSTM1 immunoprecipitate; it is not a wholly purified two-protein system.
    supporting_text: One tube received 5 μg active ALPK3 kinase and one received 5 μg of heat-denatured
      ALPK3 kinase.
- id: PMID:40135575
  title: α Protein Kinase 3 Is Essential for Neonatal and Adult Cardiac Function.
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Primary identifier and DOI 10.1161/JAHA.124.039464 verified. Full PMC Methods and Results
      read. Global and inducible cardiac mouse knockouts, endogenous tagged mouse localization and thick-filament
      abundance measurements support maintenance of the M band. MuRF1 puncta recruitment uses full-length
      murine FLAG-ALPK3 and murine mCherry-MuRF1 in human HEK293T hosts. It is not a human ALPK3 construct
      assay or a demonstrated ligase-substrate bridge. The proposed scaffold/recruitment mechanism is
      distinguished from measured colocalization and protein homeostasis. Endogenous mouse cardiomyocytes
      did not show a nuclear pool in this study. Primary access route: https://pmc.ncbi.nlm.nih.gov/articles/PMC12132735/
      . The normal publication record is now cached and its actual contents were independently read. Actual
      Methods and relevant Results/Figures read: mouse global knockout, tamoxifen-induced adult cardiac
      deletion and endogenous C-terminal FLAG-HA knock-in; M-band localization in neonatal/adult cardiomyocytes
      without detected nuclear localization in that model. HEK293T transfection explicitly uses full-length
      murine ALPK3 and tagged MuRF1 constructs. Puncta/colocalization and thick-filament protein changes
      support a proposed proteostasis axis, not isolated enzymatic activity or a demonstrated simultaneous
      molecular bridge.'
