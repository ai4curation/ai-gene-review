  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: 'Primary identifier and DOI 10.1016/j.jacc.2015.10.093 verified. Primary PubMed abstract
      read. Five affected individuals in three families and myocardial histology support severe human
      disease and intercalated-disc remodeling. Introductory nuclear-kinase and early-differentiation
