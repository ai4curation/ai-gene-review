- id: PMID:42618778
  title: Alpha protein kinase 3 gene therapy restores heart function in mouse and human models of cardiomyopathy.
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Primary identifier and DOI 10.1038/s44161-026-00843-1 verified. Primary PubMed identity
      and publisher full Results/construct Methods read. Full-length human ALPK3 is delivered to neonatal/adult
      mutant mouse hearts and human cardiac organoids; M-band targeting, functional rescue and normalization
      of sarcomeric protein abundance support the structural homeostasis role. Mouse physiology and human
      organoid assays remain distinct. Phosphoproteome normalization after rescue does not isolate direct
      ALPK3 catalysis. The published journal paper is used rather than its earlier preprint. Primary access
      route: https://www.nature.com/articles/s44161-026-00843-1 . The normal publication record is now
      cached and its actual contents were independently read. Actual Methods, Results/Figures and Discussion
      read: human full-length 1705-residue ALPK3 transgene, AAV9/TNNT2 delivery to neonatal or adult mouse
      W1538X models, and separate AAV6-FLAG rescue in human ALPK3-mutant cardiac monolayers/organoids
      and TTN-truncation organoids. Human-specific peptides across the transgene and restoration of M-band
      structure/force are measured. Proteomic normalization is not an intrinsic kinase assay. Cross-study
      comparisons against miniALPK3 differ in mouse models/capsids/routes and do not prove mechanistic
      superiority or direct human clinical efficacy.'
