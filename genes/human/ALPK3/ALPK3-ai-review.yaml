- term:
    id: GO:0007507
    label: heart development
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q924C5
  review:
    action: ACCEPT
    summary: ALPK3 contributes to development of a functional heart through cardiomyocyte organization.
    reason: The transferred mouse assertion is linked in MGI to the original Midori IMP (PMID:11418590),
      with altered cardiomyocyte differentiation in sense/antisense P19CL6 lines. Independent human cardiomyocyte
      studies (PMID:27106955 and PMID:36321451) establish sarcomeric organization and myomesin positioning,
      providing positive cellular participation rather than inferring a process solely from lethal disease.
      Retain the broad developmental term without claiming a specific chamber patterning or transcription-factor
      mechanism.
    supported_by:
    - reference_id: PMID:11418590
      full_text_unavailable: true
      supporting_text: 'Permanent P19CL6

        cell lines overexpressing Midori more efficiently differentiated into

        cardiomyocytes than did parental cells, whereas those overexpressing the

        antisense Midori less efficiently differentiated. These results suggest that

        Midori may promote the differentiation of P19CL6 into cardiomyocytes.'
    - reference_id: PMID:27106955
      full_text_unavailable: true
      supporting_text: 'Ultra-structural analysis of cardiomyocytes derived from patient-specific and

        human ESC-derived stem cell lines lacking ALPK3 revealed disordered sarcomeres

        and intercalated discs.'
    - reference_id: PMID:36321451
      full_text_unavailable: false
      supporting_text: Together, these analyses show that ALPK3, MYOM1, and MYOM2 form a critical protein
        network in both the nucleus and the sarcomere M-band at various stages in cardiomyocyte development
        and demonstrate that loss of ALPK3 causes the profound mislocalization and accumulation of myomesin
        and thick filament proteins.
    propagation_review:
