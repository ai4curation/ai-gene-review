  review:
    action: UNDECIDED
    summary: Direct ATP binding remains unresolved independently of catalytic activity.
    reason: This InterPro mapping predicts ATP binding from the alpha-kinase domain. The 2022 and 2023
      negative studies question catalysis, but pseudokinase status does not itself imply loss of ATP binding.
      Conversely, ATP supplied to the disputed phosphorylation assays is not a direct binding measurement.
      No target-specific affinity or ligand-bound structure was established in the inspected papers, so
