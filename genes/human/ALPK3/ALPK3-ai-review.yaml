      nucleus term without asserting ubiquitous nucleoplasmic residence. PMID:40135575 found no endogenous
      nuclear signal in its neonatal/adult mouse cardiomyocytes; the developmental, species and tagging
      differences are retained rather than treating one model as a universal localization veto. The exact
      PTN002931915 ancestral IBD placement was not recovered locally; the biological retention rests on
      the positive donor and human evidence, not donor count or an invented node history.'
