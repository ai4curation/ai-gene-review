- term:
    id: GO:0005794
    label: Golgi apparatus
  evidence_type: IDA
  original_reference_id: PMID:31413141
  qualifier: located_in
  review:
    summary: The cited paper reports that MS4A4A did not colocalize with the Golgi marker giantin; the
      Golgi colocalization it reports is for TREM2.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      ORGANELLES check (2026-11-18), reversing the earlier ACCEPT. The full text of PMID:31413141 was
      read: human monocyte-derived macrophages were stained for MS4A4A, TREM2 and markers of the ER
      (KDEL), Golgi (giantin) and lipid rafts (caveolin-1). MS4A4A was mainly at the plasma membrane
      and co-stained with TREM2 on caveolin-1-positive rafts; TREM2 partly co-stained with KDEL and
      giantin, and the authors state that MS4A4A did not colocalize with these intracellular markers.
      The paper therefore gives a marker-controlled negative for MS4A4A at the Golgi, and the Golgi
      location it reports belongs to TREM2. The same curator (ARUK-UCL, same date) gave TREM2 only the
      raft row from this paper, which fits a mix-up between the two proteins, but that pattern is a lead,
      not the proof; the call rests on the authors' sentence. REMOVE is the close alternative (the claim
      is contradicted by the cited paper itself); MARK_AS_OVER_ANNOTATED is used because the supporting
      figure (Fig. S9G) is supplementary and was not seen. No other paper places MS4A4A at the Golgi
      with a marker; the UniProt location line says only Membrane, multi-pass. The Golgi is removed from
      core_functions.locations. The ER row from the same paper rests on the same sentence and should
      be revisited in an ER pass (not changed here).
    supported_by:
    - reference_id: PMID:31413141
      supporting_text: We also detected partial colocalization of TREM2 with both endoplasmic reticulum
        (KDEL) and Golgi (Giantin). In contrast, MS4A4A did not colocalize with these intracellular markers
    - reference_id: PMID:31413141
      supporting_text: we found MS4A4A primarily expressed on the plasma membrane of human macrophages,
        and also intracellularly
