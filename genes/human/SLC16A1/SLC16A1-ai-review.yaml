- term:
    id: GO:0005813
    label: centrosome
  evidence_type: IDA
  original_reference_id: PMID:23816619
  qualifier: located_in
  review:
    summary: Centrosome localization from a proteomic survey of spindle/centrosome proteins
      (SSX2IP study).
    action: UNDECIDED
    reason: The cached full text of PMID:23816619 (PMC3704989, about SSX2IP) contains no mention
      of MCT1, SLC16A1 or monocarboxylate transport, so the supporting observation is presumably
      in supplementary data that is not cached and could not be checked. A centrosomal location
      would be unexpected for a 12-TM plasma-membrane MFS carrier, and nothing elsewhere supports
      it, but an experimental annotation is not removed on that basis alone.
    supported_by:
    - reference_id: file:human/SLC16A1/SLC16A1-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: rapid transport across the plasma membrane of many monocarboxylates
