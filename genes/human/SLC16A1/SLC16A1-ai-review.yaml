core_functions:
- description: Proton-coupled symport of L-lactate and other monocarboxylates (pyruvate, ketone
    bodies, acetate) across the plasma membrane, in either direction according to substrate
    and proton gradients; requires the ancillary protein basigin for surface expression.
  molecular_function:
