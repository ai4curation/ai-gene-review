id: P53985
gene_symbol: SLC16A1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SLC16A1 encodes monocarboxylate transporter 1 (MCT1), a 12-transmembrane major
  facilitator superfamily carrier that catalyses bidirectional, proton-coupled transport of
  monocarboxylates across the plasma membrane, chiefly L-lactate and pyruvate but also acetate,
  the ketone bodies acetoacetate and beta-hydroxybutyrate, branched-chain 2-oxo acids and,
  at low pH, monoprotonated succinate. Direction is set by the substrate and proton gradients,
  so MCT1 serves as a lactate exporter in glycolytic cells and an importer in oxidative tissues,
  contributing to the Cori cycle, lactate shuttles and intracellular pH. Delivery to and activity
  at the cell surface require the ancillary glycoprotein basigin (BSG/CD147) or embigin. MCT1
  is widely expressed, with basolateral and apical pools in polarised epithelia, but is transcriptionally
  silenced ("disallowed") in pancreatic beta cells; promoter variants that de-repress it there
  allow pyruvate and lactate to stimulate insulin secretion, causing exercise-induced hyperinsulinism
  (HHF7). Loss-of-function variants cause MCT1 deficiency with recurrent ketoacidosis.
