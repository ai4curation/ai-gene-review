suggested_questions:
- question: Which transcriptional or epigenetic mechanisms keep SLC16A1 silenced in pancreatic
    beta cells, and do the HHF7 promoter variants disrupt repressor binding or create activator
    sites?
suggested_experiments:
- description: Map the beta-cell-specific silencing element of SLC16A1 (e.g. CRISPR tiling
    of the promoter in human stem-cell-derived beta cells) and test whether HHF7 variants
    abolish repression, linking ectopic MCT1 expression quantitatively to pyruvate-stimulated
    insulin secretion.
