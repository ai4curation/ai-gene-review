id: Q8N122
gene_symbol: RPTOR
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'RPTOR (Raptor, Regulatory-associated protein of mTOR) is the defining, substrate-recruiting
  scaffold subunit of mTOR complex 1 (mTORC1), the nutrient- and growth-factor-responsive serine/threonine
  kinase complex (MTOR-RPTOR-MLST8) that drives anabolic metabolism and cell growth. Raptor is noncatalytic
  and acts as a dual adaptor. As a substrate adaptor it binds the short TOR signaling (TOS) motifs of
  mTORC1 substrates and regulators - EIF4EBP1 (4E-BP1), RPS6KB1 (S6K1), the inhibitor AKT1S1/PRAS40 and
  others - and presents them to the MTOR kinase active site, giving mTORC1 its substrate specificity.
  As a membrane adaptor it binds the active Rag GTPase heterodimer (GTP-RagA/B with GDP-RagC/D) and, with
  the Ragulator complex, recruits mTORC1 to the lysosomal surface where Rheb activates it; this is the
  central amino-acid input to the pathway. Raptor is also the main regulatory hub of mTORC1, integrating
  upstream signals through its own post-translational modification: AMPK phosphorylation (Ser722/Ser792)
  promotes inhibitory 14-3-3 binding, NLK (Ser863) and PKA (Ser791) phosphorylation inhibit the complex,
  while EP300 acetylation (Lys1097), OGT O-GlcNAcylation (Thr700) and OTUB1 deubiquitination promote Rag
  binding and activation. Raptor is cytosolic in the resting state, lysosomal when active, and accumulates
  in cytoplasmic stress granules under oxidative stress. Through mTORC1 it promotes protein, lipid and
  nucleotide synthesis, cell growth and size, and suppresses autophagy.'
