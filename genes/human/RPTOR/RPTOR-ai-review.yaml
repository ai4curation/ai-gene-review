id: Q8N122
gene_symbol: RPTOR
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'RPTOR (Raptor) is the defining substrate-presenting subunit of mTOR complex 1 (mTORC1).
  It is a non-catalytic molecular adaptor with two roles within the complex: it mediates recruitment of
  mTORC1 to the lysosomal surface by binding the Rag GTPases, and it confers substrate specificity by
  binding TOS-motif-containing substrates (e.g. EIF4EBP1/4E-BP1 and RPS6KB1/S6K1) and directing them to
  the active site of the MTOR kinase. Through mTORC1 it couples nutrient, growth-factor and energy signals
  to the control of cell growth, protein synthesis, autophagy and metabolism.'
alternative_products:
