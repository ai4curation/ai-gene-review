    label: regulation of cell growth
  evidence_type: IMP
  original_reference_id: PMID:20381137
  qualifier: involved_in
  review:
    summary: Downstream growth regulation; non-core.
    action: KEEP_AS_NON_CORE
    reason: Regulation of cell growth is a downstream output of mTORC1 signalling; true but peripheral
      to RPTOR's core adaptor MF. Non-core.
- term:
    id: GO:0001938
    label: positive regulation of endothelial cell proliferation
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:D3ZDU2
  - ensembl:ENSRNOP00000005337
  review:
    summary: Distal proliferation output; non-core.
    action: KEEP_AS_NON_CORE
    reason: Positive regulation of endothelial cell proliferation (IEA) is a distal, tissue-level consequence
      of mTORC1 activity; non-core.
- term:
    id: GO:0004674
    label: protein serine/threonine kinase activity
  evidence_type: IDA
  original_reference_id: PMID:18372248
  qualifier: contributes_to
  review:
    summary: contributes_to the mTORC1 kinase activity (subunit); keep.
    action: ACCEPT
    reason: RPTOR is non-catalytic but is annotated with the contributes_to qualifier to the mTORC1 serine/threonine
      kinase activity, the correct way to credit a complex subunit for the complex's catalytic activity.
      Keep.
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:12150925
  qualifier: enables
  supporting_entities:
  - UniProtKB:P42345
  review:
    summary: Partner is the MTOR kinase; recast as protein kinase binding.
    action: MODIFY
    reason: Interaction partner is the MTOR kinase (UniProtKB:P42345 / mouse ortholog); binding the catalytic
      subunit of mTORC1 is informatively protein kinase binding, not bare protein binding. This contact
      is the enzyme side of RPTOR's enzyme-substrate adaptor role.
    proposed_replacement_terms:
    - id: GO:0019901
      label: protein kinase binding
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:12150926
  qualifier: enables
  supporting_entities:
  - UniProtKB:P23443
  review:
    summary: Interactor is RPS6KB1/S6K1, a protein kinase; recast as protein kinase binding.
    action: MODIFY
    reason: The interaction partner is RPS6KB1 (S6K1, UniProtKB:P23443), a protein kinase that RPTOR binds
      via its TOS motif as an mTORC1 substrate. A binary interaction evidences binding, so the supported
      refinement is protein kinase binding; the bridging enzyme-substrate adaptor activity itself is already
      asserted by IDA (GO:0140767).
    proposed_replacement_terms:
    - id: GO:0019901
      label: protein kinase binding
