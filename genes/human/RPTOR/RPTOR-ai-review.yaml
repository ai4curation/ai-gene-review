existing_annotations:
- term:
    id: GO:0001558
    label: regulation of cell growth
  evidence_type: IMP
  original_reference_id: PMID:20381137
  qualifier: involved_in
  review:
    summary: mTORC1, scaffolded by Raptor, controls cell growth; accepted.
    action: ACCEPT
    reason: Raptor is the essential scaffold of the growth-controlling mTORC1 kinase [PMID:12150926 "raptor
      is an essential scaffold for the mTOR-catalyzed"], which regulates cell growth and size [PMID:12150925
      "maintenance of cell size"].
    supported_by:
    - reference_id: PMID:12150926
      supporting_text: raptor is an essential scaffold for the mTOR-catalyzed
    - reference_id: PMID:12150925
      supporting_text: maintenance of cell size
- term:
    id: GO:0001938
    label: positive regulation of endothelial cell proliferation
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:D3ZDU2
  - ensembl:ENSRNOP00000005337
  review:
    summary: Positive regulation of endothelial cell proliferation, transferred from the rat ortholog;
      a tissue-specific downstream output of mTORC1, kept as non-core.
    action: KEEP_AS_NON_CORE
    reason: Proliferation effects are downstream consequences of mTORC1 growth signaling rather than Raptor's
      own adaptor function [PMID:18426977 "specific silencing of the mTOR partner protein raptor, blocks
      proliferation"]; the endothelial specialization comes from an Ensembl rat-ortholog transfer and
      is non-core for human Raptor.
    supported_by:
    - reference_id: PMID:18426977
      supporting_text: specific silencing of the mTOR partner protein raptor, blocks proliferation
- term:
    id: GO:0004674
    label: protein serine/threonine kinase activity
  evidence_type: IDA
  original_reference_id: PMID:18372248
  qualifier: contributes_to
  review:
    summary: Protein serine/threonine kinase activity (contributes_to). The catalytic subunit is MTOR;
      Raptor's informative contribution is substrate presentation. Modified to enzyme-substrate adaptor
      activity.
    action: MODIFY
    reason: Raptor is noncatalytic [PMID:27909983 "Raptor shows no caspase activity and therefore may
      bind to TOS"]; it enhances mTOR kinase output by recruiting substrates [PMID:12150926 "it strongly
      enhances the mTOR kinase activity toward p70alpha"]. The contributes_to kinase term is best expressed
      as the adaptor activity Raptor actually provides.
    supported_by:
    - reference_id: PMID:27909983
      supporting_text: Raptor shows no caspase activity and therefore may bind to TOS
    - reference_id: PMID:12150926
      supporting_text: it strongly enhances the mTOR kinase activity toward p70alpha
    proposed_replacement_terms: &id001
    - id: GO:0140767
      label: enzyme-substrate adaptor activity
