proposed_new_terms: []
suggested_questions:
- question: Is there a dedicated molecular-function term for "TORC1 complex binding"/scaffold recruitment
    that regulators binding raptor (e.g. PRAS40, DEPTOR, SPAG5) should map to, rather than generic protein
    binding?
- question: Should raptor PTM-site regulation (AMPK Ser722/792, NLK Ser863, PKA Ser791, EP300 Lys1097,
    OGT Thr700) be captured as regulatory annotations on raptor, given these are the main nodes through
    which upstream signals set mTORC1 activity?
suggested_experiments:
- description: Separation-of-function raptor mutants (TOS-binding RNC-domain mutants vs Rag-binding "claw"
    mutants) to dissect, in the same cells, which downstream outputs depend on substrate recruitment versus
    lysosomal recruitment.
