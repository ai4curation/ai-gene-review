- id: PMID:10828023
  title: Distinct localization and function of (1,4,5)IP(3) receptor subtypes and the (1,3,4,5)IP(4) receptor
    GAP1(IP4BP) in highly purified human platelet membranes.
  findings:
  - statement: In human platelets the type III IP3R is the plasma-membrane subtype and is the only IP3R
      significantly labelled by surface biotinylation of intact cells; type I IP3R is intracellular.
    supporting_text: In studies examining the labeling of surface proteins with biotin in intact platelets
      only the type III (1,4,5)IP(3)R was significantly labeled
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only cache. Subtype-resolved fractionation, surface biotinylation and immunogold in
      human platelets; direct support for a surface-exposed type III (ITPR3) plasma-membrane pool.
