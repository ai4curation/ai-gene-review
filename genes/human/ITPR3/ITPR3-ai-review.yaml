    reason: TIRF microscopy localises a fraction of type III IP3R to a domain immediately adjacent to the
      plasma membrane at junctate/TRPC3 ER-PM junctions, the anatomical site of agonist-activated Ca2+ entry.
      A junctional/peripheral pool rather than the bulk ER channel, so non-core.
    supported_by:
