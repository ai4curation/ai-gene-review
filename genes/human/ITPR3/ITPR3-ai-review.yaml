  review:
    summary: Plasma membrane pool. Among the IP3R subtypes, type III is the one found at the plasma membrane,
      so the family-node IBA is well supported for ITPR3 specifically; the bulk of ITPR3 is still ER membrane.
    action: KEEP_AS_NON_CORE
    reason: The IBA places plasma membrane at the IP3R family node. For ITPR3 this is corroborated by
      subtype-specific evidence, since in human platelets the type III IP3R is the plasma-membrane,
      surface-biotinylated subtype (PMID:10828023). It remains minor relative to the ER channel, so non-core.
    supported_by:
    - reference_id: PMID:10828023
      supporting_text: The PM fractions were found to contain the type III (1,4,5)IP(3)R and GAP1(IP4BP) in
        contrast to IM, which contained type I (1,4,5)IP(3)R
