id: Q14573
gene_symbol: ITPR3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ITPR3 encodes inositol 1,4,5-trisphosphate receptor type 3, a multi-pass endoplasmic-reticulum
  membrane protein that forms a homotetrameric IP3-gated calcium release channel. IP3 binding, with calcium
  as co-agonist, opens the channel to transport Ca2+ from the ER lumen to the cytosol, shaping calcium
  signals for processes including taste transduction, platelet activation, secretion and broad cellular
  calcium homeostasis. ITPR3 is enriched in the apical ER of polarized epithelial and taste cells.
