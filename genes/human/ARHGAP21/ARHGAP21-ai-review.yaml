- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:17347647
  qualifier: enables
  supporting_entities:
  - UniProtKB:P84078
  review:
    summary: Binding to GTP-bound ARF1, recorded as generic protein binding. The evidence is a 2.1 A crystal
      structure of ARF1-GTP bound to ARHGAP21's Arf-binding domain -- the strongest single interaction
      datum on this gene.
    action: MODIFY
    reason: 'ARF1 is a small GTPase, so GO:0031267 ''small GTPase binding'' is available and far more
      informative than GO:0005515; it is also the term that the merged GO:0017048 and GO:0017137 now resolve
      to, so it is where GO expects this class of annotation to sit. The structure defines the interface
      as a PH domain plus a C-terminal helix engaging the ARF1 switch regions, and IntAct records the
      ARHGAP21 side of this interaction against the PH domain by x-ray diffraction and cosedimentation.
      The same region binds ARF6 (UniProt SUBUNIT: ''Interacts with GTP-bound ARF1 and ARF6''). Worth
      stating explicitly because the symbol invites the opposite reading: this is an ARF-BINDING domain,
      not an ArfGAP domain, and an independent study classifies ARHGAP21 as an ARF6 effector while contrasting
      it with the Arf GAPs assayed alongside it. ARHGAP21 has no ArfGAP domain and no ARF-GAP annotation,
      which is correct.'
    proposed_replacement_terms:
    - id: GO:0031267
      label: small GTPase binding
    supported_by:
    - reference_id: PMID:17347647
      supporting_text: We show that ArfBD comprises a PH domain adjoining a C-terminal alpha helix, and
        that ARF1 interacts with both of these structural motifs through its switch regions and triggers
        structural rearrangement of the PH domain.
    - reference_id: PMID:16527809
      supporting_text: We also found that the tandem mutation Q37E/S38I prevented the binding of two Arf
        GAPs, but not the effector ARHGAP10, and blocked the formation of membrane protrusion and actin
        reorganization.
