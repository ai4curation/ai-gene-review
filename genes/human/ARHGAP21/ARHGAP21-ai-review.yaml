id: Q5T5U3
gene_symbol: ARHGAP21
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ARHGAP21 (also known by its former symbol ARHGAP10, which now belongs to a different gene)
  is a 1958-residue multidomain Rho-family GTPase-activating protein built from an N-terminal PDZ domain,
  a central pleckstrin-homology domain and a C-terminal RhoGAP domain. Its RhoGAP domain accelerates GTP
  hydrolysis on Rho-family GTPases using the conserved arginine finger R1184; reported substrates differ
  between studies and include Cdc42, RhoA and RhoC, and the preference appears to depend on cell type
  and stimulus. The PH domain and an adjacent C-terminal helix together form an ARF-binding domain that
  engages the switch regions of GTP-loaded ARF1, and this interaction recruits ARHGAP21 to Golgi membranes;
  ARHGAP21 is an ARF effector rather than an ARF GAP. At the Golgi it restrains Cdc42 to control Arp2/3-dependent
  F-actin dynamics and dynein-driven, microtubule-dependent positioning of the Golgi ribbon near the centrosome.
  A separate pool is recruited transiently to nascent cell-cell contacts, where ARHGAP21 binds alpha-catenin
  through a region in its C-terminal half and is required for alpha-catenin to be recruited to adherens
  junctions, linking it to junction integrity, epithelial-mesenchymal transition and InlA-dependent entry
  of Listeria monocytogenes. Its GAP activity is inhibited by direct binding of beta-arrestin 1 across
  the GAP domain downstream of angiotensin II type 1A receptor stimulation. The protein is widely expressed
  with highest levels in brain, heart, skeletal muscle and placenta, is extensively phosphorylated and
  binds 14-3-3 proteins, and is modified by SUMO2/3.
