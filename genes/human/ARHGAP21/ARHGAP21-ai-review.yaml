- term:
    id: GO:0045294
    label: alpha-catenin binding
  evidence_type: IPI
  original_reference_id: PMID:16184169
  qualifier: enables
  supporting_entities:
  - UniProtKB:P35221
  extensions:
  - predicate: RO:0002233
    term:
      id: UniProtKB:P35221
      label: CTNNA1
  review:
    summary: ARHGAP21 was identified as a direct partner of alpha-catenin in a two-hybrid screen using
      alpha-catenin as bait, colocalises with it at cell-cell junctions, and UniProt maps the interaction
      to residues 1592-1861 with ECO:0000269 evidence from this paper.
    action: NEW
    reason: 'This is the single largest curation gap on the gene. Querying QuickGO by reference shows
      PMID:16184169 produced two annotations in all of GOA, both on alpha-catenin (CTNNA1, P35221) and
      neither on ARHGAP21 -- even though the paper is titled for ARHGAP21''s requirement in alpha-catenin
