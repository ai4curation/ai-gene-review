- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:36931259
  qualifier: enables
  supporting_entities:
  - UniProtKB:P31947
  review:
    summary: ARHGAP21 recovered as a 14-3-3 (sigma) interactor by systematic paralog-resolved 14-3-3 interactome
      mapping. 14-3-3 binding is corroborated across four independent publications and three orthogonal
      methods in IntAct (anti-tag coIP, proximity-dependent biotin identification, pull down), so this
      is genuine replication rather than one screen logged several ways.
    action: MODIFY
    reason: 'The partner is a 14-3-3 protein and GO:0071889 ''14-3-3 protein binding'' is active and exactly
      describes the interaction, so the uninformative generic term should be replaced rather than removed.
      The assignment is consistent with ARHGAP21 being heavily phosphorylated -- UniProt lists roughly
      twenty phosphoserine sites -- and 14-3-3 proteins binding phosphoserine motifs. This is a binding
      call only: no downstream function of the 14-3-3 interaction has been demonstrated for ARHGAP21,
      so nothing more is claimed.'
    proposed_replacement_terms:
    - id: GO:0071889
      label: 14-3-3 protein binding
    supported_by:
    - reference_id: PMID:36931259
      supporting_text: Here, we map the interactomes of all human 14-3-3 paralogs and systematically characterize
        the effect of disrupting these interactions on client localization.
