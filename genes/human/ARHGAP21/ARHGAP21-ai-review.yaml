- term:
    id: GO:0005829
    label: cytosol
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-8981637
  qualifier: located_in
  review:
    summary: Cytosol, asserted by Reactome as the compartment of the 'RHOA GAPs stimulate RHOA GTPase
      activity' reaction.
    action: KEEP_AS_NON_CORE
    reason: 'A Reactome compartment label is a property of the reaction as modelled, not a measurement
      of where ARHGAP21 was observed, so it should not be read as primary localisation evidence. It is
      nonetheless not wrong: ARHGAP21 is a peripheral membrane protein and necessarily has a soluble cytosolic
      pool, and independent studies report nuclear and cytoplasmic signal. But the functionally meaningful
      pools are the Golgi membrane and the cell junction, which are separately annotated, so cytosol is
      retained as non-core rather than accepted as a core location.'
    supported_by:
    - reference_id: PMID:23200924
      supporting_text: ARHGAP21 is located in the nucleus and cytoplasm of both cell lines and its depletion
        resulted in decreased proliferation and increased migration of PC3 cells but not LNCaP cells.
