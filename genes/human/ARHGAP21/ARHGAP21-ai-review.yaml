knowledge_gaps:
- gap_statement: GO cannot record which GTPase a GAP acts on. ARHGAP21's best-characterised and most contested
    property is its substrate preference -- Cdc42 versus RhoA versus RhoC -- and the molecular-function
    branch has no vocabulary for it.
  boundary: 'What is known: ARHGAP21 is a GAP, and the R1184 arginine finger is required (two independent
    groups). What GO can express: GO:0005096 ''GTPase activator activity'', and nothing finer. QuickGO''s
    /complete endpoint shows GO:0005099 (Ras), GO:0005100 (Rho), GO:0008060 (ARF) and GO:0005097 (Rab)
    GAP terms were all merged into GO:0005096, which now has zero is_a children. The merge was deliberate,
    so this is recorded as a gap rather than a request to undo it.'
  gap_kind:
  - ONTOLOGY
  significance: 'The consequence is visible in this gene''s own record: Reactome''s reaction name ''RHOA
    GAPs stimulate RHOA GTPase activity'' carries substrate information that is lost the moment it is
    mapped to GO:0005096. Any consumer reading GO alone cannot tell a Cdc42 GAP from a RhoA GAP from an
    ARF GAP. For a family curated largely on substrate specificity this is a systematic loss, not an ARHGAP21-specific
    one.'
  status: OPEN
  resolution: In the absence of ontology terms, substrate identity is recorded machine-readably in this
    review as core_functions[].substrates and as has_input (RO:0002233) extensions on the annotations.
    A general fix would need either substrate-specific GAP terms reinstated or the has_input extension
    applied systematically across GAP annotations.
- gap_statement: GO has no term for the PDZ-domain side of a PDZ/PDZ-binding-motif interaction, so neither
    the quantitative affinity survey of ARHGAP21's PDZ domain nor its one reported cellular ligand can
    be recorded as anything more informative than generic protein binding.
  boundary: 'GO:0030165 ''PDZ domain binding'' exists but is defined as ''Binding to a PDZ domain of a
    protein'' -- the ligand side, for proteins carrying a PBM -- and has no descendants. A QuickGO full-text
    search over GO returns exactly two PDZ terms, the other being obsolete. ARHGAP21 carries the PDZ domain
    and binds the motifs, which is the direction GO does not model. Note this is an ontology gap, NOT
    a darkness claim about the domain: PMID:41957357 reports that the PDZ domain mediates binding to filamin
    A, so the module does have a reported cellular ligand.'
  gap_kind:
  - ONTOLOGY
  significance: Ten of ARHGAP21's twenty-four GO:0005515 rows are holdup-assay affinity measurements whose
    ARHGAP21 side maps to residues 50-159, the PDZ domain. All ten are removed in this review as uninformative
    because no better term exists, which means real biophysical data leaves no trace in GO. The same applies
    to every PDZ-domain protein assayed in that survey. The filamin A interaction escapes the gap only
    because GO happens to have a partner-specific term (GO:0031005 filamin binding), which is proposed
    here as a NEW row -- a ligand-by-ligand workaround that does not scale.
  status: OPEN
- gap_statement: Seven of the ten primary papers on human ARHGAP21 have produced no GO annotation anywhere
    in GOA. This gene's problem is missing curation, not over-annotation.
  boundary: Measured by querying QuickGO by reference for each primary paper (none of the ten result sets
    was truncated, so the counts are complete). Only PMID:15793564 (one row), PMID:17347647 (one generic
    protein-binding row) and PMID:20525016 (five rows) have contributed. PMID:16184169, PMID:16527809,
    PMID:21173159, PMID:22922005, PMID:23200924, PMID:23235160 and PMID:29212046 have contributed nothing.
  gap_kind:
  - CURATION
  significance: Every paper reporting RhoA or RhoC GAP activity is in the uncurated set, so the GO record
    is silent on that half of the literature for a reason independent of the ontology gap. A 2.1 A crystal
    structure of the ARF1-ARHGAP21 complex is recorded only as 'protein binding'. Three NEW rows in this
    review recover part of the shortfall, but SUMOylation at K1444, the beta-arrestin 1 inhibition of
    GAP activity, the alpha-tubulin interaction and the haematopoietic RhoC role all remain uncaptured.
  status: NARROWING
suggested_questions:
- question: Is ARHGAP21's GAP substrate preference intrinsic or contextual? No study has assayed Cdc42,
    RhoA and RhoC side by side with the same purified protein and the same assay; the two 2005 papers
    used different constructs and readouts, and the PC3-versus-LNCaP split in the prostate study hints
    that cell context matters. A single comparative kinetic experiment would settle whether the literature
    disagreement is a real biological switch or a methodological artefact.
  experts:
  - Philippe Chavrier
  - Anne J. Ridley
  - Sara T. O. Saad
- question: Should GO reinstate substrate-specific GAP terms, or should has_input extensions become the
    standard way to record GAP substrates? GO:0005099 (Ras), GO:0005100 (Rho), GO:0008060 (ARF) and GO:0005097
    (Rab) GAP terms have all been merged into GO:0005096, which now has zero is_a children, so the most
    heavily curated property of the GAP families is no longer expressible. ARHGAP21 is a good test case
    because its substrate is genuinely contested and a curator would want to record both readings rather
    than choose.
  experts: []
- question: Should GO add a term for the PDZ-domain side of a PDZ/PDZ-binding-motif interaction? GO:0030165
    'PDZ domain binding' models only the ligand side (binding TO a PDZ domain). Systematic PDZ affinity
    surveys now measure thousands of interactions from the PDZ-domain side, and those results are currently
    unrepresentable for the PDZ-containing protein -- ten of ARHGAP21's generic binding rows are exactly
    this case.
  experts:
  - Gilles Travé
  - Gergo Gogl
- question: Which PDZ ligands does ARHGAP21 engage in cells, and where? The holdup survey gives affinities
    for isolated fragments, and only one cellular ligand has been reported for the domain so far -- filamin
    A, in hepatocellular carcinoma cells, and the mapping is hedged as a 'potential mediator'. Whether
    the PDZ domain is occupied at the Golgi, at junctions, or not at all in a given cell type remains
    untested.
  experts:
  - Gilles Travé
  - Philippe Chavrier
- question: Does the alpha-catenin interaction require ARHGAP21's GAP activity? The alpha-catenin interaction
    region (roughly 1592-1861) is separate from the RhoGAP domain (1147-1339), so binding and catalysis
    are in principle separable. Testing the catalytically dead R1184A mutant for alpha-catenin recruitment
    would show whether ARHGAP21 acts at junctions as a scaffold, as an enzyme, or as both.
  experts:
  - Pascale Cossart
  - Sandra Sousa
- question: Would curators consider annotating PMID:16184169? It is a Nature Cell Biology paper whose
    title finding concerns ARHGAP21, and it has produced two GO annotations in all of GOA, both on its
    partner alpha-catenin and neither on ARHGAP21. Note that the paper calls the protein ARHGAP10, which
    is now a different gene's symbol -- a plausible reason it was passed over, and worth checking systematically
    for other genes that have been renamed into a symbol collision.
  experts: []
suggested_experiments:
- hypothesis: ARHGAP21's RhoGAP domain has an intrinsic substrate preference that is the same in every
    cell type, and the published Cdc42-versus-RhoA/RhoC disagreement reflects differences in construct
    and assay rather than biology.
  description: Express and purify a single ARHGAP21 RhoGAP-domain construct (residues ~1147-1339) and
    measure steady-state and single-turnover GTP hydrolysis against Cdc42, RhoA, RhoC and Rac1 under identical
    conditions, using the catalytically dead R1184A mutant as the negative control and a well-characterised
    single-specificity GAP as the positive control. Report kcat/Km for each pair so preference is quantitative
    rather than qualitative.
  experiment_type: in vitro GTPase-activating protein kinetic assay
- hypothesis: Which Rho GTPase ARHGAP21 engages in cells depends on cell context, so the same protein
    is a Cdc42 GAP in one lineage and a RhoA/RhoC GAP in another.
  description: Knock down ARHGAP21 in a panel spanning the systems where the conflicting results were
    obtained (HeLa, Caco-2, PC3, LNCaP) and quantify active Cdc42-GTP, RhoA-GTP and RhoC-GTP in parallel
    by effector-domain pulldown or FRET biosensor, with rescue by wild-type and R1184A ARHGAP21. A cell-type-dependent
    pattern would convert the literature disagreement into a finding.
  experiment_type: loss-of-function with parallel active-GTPase measurement
- hypothesis: ARHGAP21's Golgi, junction and PDZ functions are separable and map to distinct modules of
    the protein.
  description: In ARHGAP21-null cells, compare rescue by wild type, R1184A (catalytically dead), a PDZ-domain
    deletion, a PH/ArfBD point mutant (Y1000A or I1054A, both known to abolish ARF1 binding and membrane
    association) and a deletion of the 1592-1861 alpha-catenin-binding region. Score Golgi repositioning
    after nocodazole washout, alpha-catenin recruitment to nascent contacts, and junction strength. This
    assigns each phenotype to a module rather than to the protein as a whole.
  experiment_type: structure-function rescue in knockout cells
- hypothesis: The ARHGAP21 PDZ domain engages a specific PDZ-binding-motif ligand in cells, and that ligand
    is among the high-affinity holdup hits.
  description: Express the isolated ARHGAP21 PDZ domain as a proximity-labelling bait alongside a carboxylate-binding-loop
    mutant that cannot bind a PBM, and compare the labelled proteomes. Proteins enriched only by the wild-type
    bait, and present in the holdup hit list, are candidate in vivo ligands; validate the top candidates
    by C-terminal PBM truncation in the partner.
  experiment_type: proximity labelling with a binding-deficient control
- hypothesis: 14-3-3 binding is a regulatory input to ARHGAP21 rather than an incidental consequence of
    its heavy phosphorylation.
  description: Map the 14-3-3 binding site(s) by systematic serine-to-alanine mutagenesis across the roughly
    twenty documented phosphoserines, then test the binding-deficient mutant for Golgi recruitment, GAP
    activity toward Cdc42 and RhoA, and junction localisation. A phenotype would convert a well-replicated
    but currently functionless interaction into a mechanism; no phenotype would justify leaving GO:0071889
    as a binding-only annotation.
  experiment_type: phosphosite mutagenesis with interaction and activity readouts
