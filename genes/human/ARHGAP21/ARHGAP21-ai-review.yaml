- term:
    id: GO:0034333
    label: adherens junction assembly
  evidence_type: IMP
  original_reference_id: PMID:16184169
  qualifier: involved_in
  review:
    summary: Knockdown of ARHGAP21 impairs recruitment of alpha-catenin to cell-cell contacts, and its
      overexpression raises alpha-catenin and cortical actin at junctions; an independent knockdown study
      finds weaker cell-cell adhesions.
    action: NEW
    reason: 'ARHGAP21 does part of the work of building the junction rather than merely being required
      for it: it binds alpha-catenin directly through a mapped region, is itself recruited to the junction
      during adhesion formation, and determines whether alpha-catenin -- a core structural component linking
      cadherin to actin -- arrives there. Loss and gain of function move the phenotype in opposite directions,
      which is what distinguishes participation from being a passive requirement. Two independent human
      knockdown studies agree. The alternative framing would be a regulation-level term such as GO:1903393,
      which a curator may prefer if the effect is judged to run entirely through GAP activity; the direct
      alpha-catenin interaction is why the assembly term is proposed instead. Species caveat, stated because
      an experimental code asserts the experiment was done in the annotated organism: both supporting
      papers are abstract-only in the cache, neither abstract names a cell line, and PMID:16184169 is
      not in PMC or Europe PMC full text and returns no text-mined annotations, so the cell system could
      not be confirmed from any source available here. IMP is retained because the two-hybrid partner
      is human alpha-catenin and the annotation target is human ARHGAP21, but a curator with the full
      text should confirm the cell line before accepting the code.'
    supported_by:
    - reference_id: PMID:16184169
      supporting_text: In ARHGAP10-knockdown cells, L. monocytogenes entry and alpha-catenin recruitment
        at cell-cell contacts were impaired.
    - reference_id: PMID:16184169
      supporting_text: Its overexpression disrupted actin cables, enhanced alpha-catenin and cortical
        actin levels at cell-cell junctions and inhibited L. monocytogenes entry.
    - reference_id: PMID:23235160
      supporting_text: Cells lacking ARHGAP21 expression show weaker cell-cell adhesions, increased cell
        migration, and a diminished ability to undergo hepatocyte growth factor-induced epithelial-mesenchymal
        transition (EMT).
- term:
    id: GO:0032956
    label: regulation of actin cytoskeleton organization
  evidence_type: IMP
  original_reference_id: PMID:15793564
  qualifier: involved_in
  review:
    summary: 'ARHGAP21 controls Arp2/3-complex and F-actin dynamics at the Golgi through its GAP activity
      toward Cdc42. The direction of the effect is context-dependent: overexpression disrupts actin cables
      and raises cortical actin at junctions, while antisense knockdown in neonatal mouse pancreatic islets
      lowers F-actin.'
    action: NEW
    reason: 'The gene''s founding paper is titled for control of the Arp2/3 complex and F-actin dynamics,
      yet ARHGAP21 carries no actin-related biological process term at all -- only the cellular-component
      rows for actin cytoskeleton. A regulation term is the right shape, and is right for a second reason:
      ARHGAP21 does not nucleate or bundle actin itself, it sets the activity level of the Rho GTPase
      that drives Arp2/3-dependent polymerisation, and the reported sign of the effect differs between
      systems (overexpression disrupts actin cables in epithelial cells; antisense knockdown reduces F-actin
      in mouse islets). GO:0032956 is sign-agnostic and so accommodates both, where a directional regulation
      term would not. Evidence-code caveat: PMID:15793564 is abstract-only in the cache, so the assay
      detail behind the F-actin phenotype cannot be read here; IMP is retained because the abstract states
      the control of Arp2/3 and F-actin dynamics as this paper''s own result on the human protein, but
      a curator with the full text should confirm the perturbation used. Note the supporting PMID:25744409
      experiment is in MOUSE islets and is cited only to show the direction is not fixed, not as evidence
      for the human annotation.'
    supported_by:
    - reference_id: PMID:15793564
      supporting_text: regulates the Arp2/3 complex and F-actin dynamics at the Golgi through the control
        of Cdc42 activity.
    - reference_id: PMID:16184169
      supporting_text: Its overexpression disrupted actin cables, enhanced alpha-catenin and cortical
        actin levels at cell-cell junctions and inhibited L. monocytogenes entry.
    - reference_id: PMID:25744409
      supporting_text: F-actin was reduced in AS-islets, as judged by lower phalloidin intensity.
- term:
    id: GO:0031005
    label: filamin binding
  evidence_type: IPI
  original_reference_id: PMID:41957357
  qualifier: enables
  supporting_entities:
  - UniProtKB:P21333
  extensions:
  - predicate: RO:0002233
    term:
      id: UniProtKB:P21333
      label: FLNA
  review:
    summary: ARHGAP21 binds filamin A directly, with the PDZ domain implicated in the interaction with
      FLNA's 1-1200 aa fragment, and recruits HSP90-alpha to protect FLNA from ubiquitination and degradation.
    action: NEW
    reason: 'GO:0031005 ''filamin binding'' is active and partner-appropriate, so unlike the ten PDZ holdup
      rows this interaction CAN be expressed informatively -- which is why it is proposed as a row rather
      than left as generic binding. It also corrects the darkness framing of the PDZ knowledge gap: the
      domain does have one reported cellular ligand. The paper hedges the domain mapping (''functions
      as a potential mediator''), so the row is deliberately scoped to the binding itself, which the paper
      states directly, rather than to a PDZ-dependence claim. Both proteins are human and the work is
      in human HCC cell lines, so IPI is the correct code. The downstream FLNA-stabilisation and metastasis
      phenotypes are not proposed as process terms here: they are effects of the interaction in a cancer
      context rather than a demonstrated normal function, and the HSP90-alpha arm would need its own evidence.'
    supported_by:
    - reference_id: PMID:41957357
      supporting_text: Mechanistically, we demonstrated that ARHGAP21 directly binds to FLNA, and the
        PDZ domain of ARHGAP21 functions as a potential mediator of its binding to the 1-1200 aa fragment
        of FLNA.
