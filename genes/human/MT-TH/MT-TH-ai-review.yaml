id: URS00001FBD75_9606
gene_symbol: MT-TH
product_type: TRNA
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: MT-TH encodes mitochondrial tRNA-His, one of the 22 transfer RNAs encoded by mitochondrial
  DNA. After excision from the polycistronic mtDNA transcript and post-transcriptional maturation, it
  is charged with histidine by the corresponding mitochondrial aminoacyl-tRNA synthetase and, in the mitochondrial
  matrix, acts as the adaptor that reads the histidine codons CAU and CAC (CAY) of the 13 mtDNA-encoded
  mRNAs on the mitoribosome, delivering histidine to the growing polypeptide. Pathogenic variants in MT-TH,
  like those in other mt-tRNA genes, impair mitochondrial translation and oxidative phosphorylation and
  cause maternally inherited mitochondrial disease.
