id: Q96FX7
gene_symbol: TRMT61A
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'Catalytic subunit of the nuclear tRNA m1A58 methyltransferase. TRMT61A is a class I
  (Rossmann-fold) S-adenosyl-L-methionine-dependent methyltransferase that transfers a methyl group
  to N1 of adenosine 58 in the T-loop of cytosolic tRNAs, a modification conserved across bacteria,
  archaea and eukaryotes that stabilises initiator methionyl-tRNA and is required in human tRNA3(Lys)
  for correct termination of plus-strand strong-stop DNA synthesis during HIV-1 reverse transcription.
  It has no activity alone. The functional enzyme is a heterotetramer of two TRMT61A and two TRMT6
  chains, in which TRMT6, a catalytically dead paralogue, binds the substrate tRNA and, acting in
  trans across the dimer interface, splays the T- and D-loops apart to deliver the otherwise buried
  A58 into the TRMT61A active site. Substrate recognition is therefore structural rather than
  sequence-based. The complex has also been reported to deposit m1A on a small number of cytosolic
  mRNAs that fold into tRNA T-loop-like elements, at low stoichiometry, and this mRNA substrate class
  is disputed. Biochemical validation of transcriptome-wide maps indicates that most mapped internal
  mRNA m1A sites are instead inosine produced by A-to-I editing, and that genuine mRNA m1A is
  restricted to a handful of sites.'
