core_functions:
- molecular_function:
    id: GO:0160107
    label: tRNA (adenine(58)-N1)-methyltransferase activity
  description: TRMT61A is the catalytic chain of the nuclear tRNA m1A58 methyltransferase, a class I
    SAM-dependent methyltransferase that transfers a methyl group to N1 of adenosine 58 in the T-loop
    of cytosolic tRNAs. It is active only within the TRMT6-TRMT61A heterotetramer, where the
    non-catalytic TRMT6 chain binds the substrate tRNA and, acting in trans across the dimer interface,
    splays the T- and D-loops apart to present the otherwise buried A58 to the TRMT61A active site.
    Substrate selection is therefore structural rather than sequence-based, which is also why mRNAs
    that fold into T-loop-like elements can be methylated adventitiously. The modification stabilises
    initiator methionyl-tRNA and, in tRNA3(Lys), removes Watson-Crick pairing at the position that
    terminates the HIV-1 primer-binding sequence.
  directly_involved_in:
  - id: GO:0030488
    label: tRNA methylation
  in_complex:
    id: GO:0031515
    label: tRNA (m1A) methyltransferase complex
  locations:
  - id: GO:0005634
    label: nucleus
  - id: GO:0005654
    label: nucleoplasm
  supported_by:
  - reference_id: PMID:16043508
    supporting_text: Stable hTrm6p/hTrm61p complexes purified from yeast maintained tRNA m(1)A Mtase
      activity in vitro.
  - reference_id: PMID:16043508
    supporting_text: The human m(1)A Mtase complex also exhibited substrate specificity--modifying
      wild-type yeast tRNA(i) (Met) but not an A58U mutant.
  - reference_id: PMID:26470919
    supporting_text: tRNAs bind across the dimer interface such that Trm6 from the opposing heterodimer
      brings A58 into the active site of Trm61.
knowledge_gaps:
- gap_statement: It is undetermined whether the TRMT6-TRMT61A complex has a genuine, physiologically
    meaningful mRNA substrate class, or whether cytosolic mRNA m1A is confined to a handful of
    T-loop-like sites at stoichiometries too low to regulate anything.
  boundary: The tRNA A58 activity is settled, by direct in vitro biochemistry on the purified human
    complex, by site specificity demonstrated with an A58U substrate mutant, and by a crystal structure
    of the enzyme engaged with its tRNA substrate. What is unsettled is only the second substrate
    class.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: NARROWING
  significance: The mRNA-m1A assignment underpins a large and growing cancer literature that proposes
    TRMT61A and TRMT6 as drug targets. If internal mRNA m1A is essentially absent, the proposed
    mechanisms in those papers cannot be correct as stated, and any therapeutic effect of inhibiting
    the complex would have to be explained through tRNA hypomodification instead.
  resolution: Site-specific biochemical validation, by SCARPET or an equivalent orthogonal assay, of
    the specific mRNA sites that the 2017 base-resolution studies attributed to TRMT6/TRMT61A,
    performed in TRMT6 or TRMT61A knockout cells so that dependence on the complex is tested directly
    rather than inferred.
  provenance:
  - reference_id: PMID:42337368
    supporting_text: Using SCARPET, we show that newly mapped internal m1A sites are not m1A, but
      instead contain inosine from A-to-I editing.
  - reference_id: PMID:42337368
    supporting_text: These results strongly support the conclusion that m1A is not widespread in
      mammalian mRNAs but is instead largely restricted to the previously validated sites in PRUNE1,
      ND5 and MALAT1 RNA.
  - reference_id: PMID:29072297
    supporting_text: Within the cytosol, m1A is present in a low number of mRNAs, typically at low
      stoichiometries, and almost invariably in tRNA T-loop-like structures, where it is introduced
      by the TRMT6/TRMT61A complex.
suggested_questions:
- question: Are the two nuclear-encoded mRNA m1A sites that survive SCARPET validation, PRUNE1 A58 and
    MALAT1 A7945, actually deposited by the TRMT6-TRMT61A complex? PMID:42337368 confirms them
    biochemically but never mentions either subunit, so the attribution currently rests on inference
    from the 2017 mapping studies rather than on a stated result.
  experts:
  - Samie R Jaffrey
  - Schraga Schwartz
  - Chengqi Yi
- question: If internal mRNA m1A is as rare as the 2026 biochemistry indicates, what actually explains
    the reproducible tumour phenotypes seen on TRMT6 or TRMT61A knockdown? Is the relevant lesion tRNA
    A58 hypomodification and its downstream effects on translation, rather than loss of mRNA
    methylation at specific target transcripts?
  experts:
  - Huarong Chen
  - Peng Hou
- question: Does the complex have measurable in vitro activity on a synthetic mRNA folded into a
    T-loop-like element, and if so how does its kcat/Km compare with that on a genuine tRNA substrate?
    This would establish whether mRNA methylation is a real if minor activity or simply below the
    threshold at which the enzyme acts.
  experts:
  - Robert M Stroud
  - Janet Finer-Moore
- question: The GUUCRA tRNA-like motif class reported by PMID:29107537 and the T-loop-like class
    reported by PMID:29072297 were derived by different methods. Are they the same set of sites, and
    does either survive the A-to-I editing control that PMID:42337368 shows was missing from the later
    maps?
  experts:
  - Chengqi Yi
  - Modi Safra
suggested_experiments:
- hypothesis: Genuine, TRMT6/TRMT61A-dependent m1A in cytosolic mRNA is restricted to a very small
    number of sites that fold into tRNA T-loop-like elements, and is absent from the bulk of sites
    reported by transcriptome-wide mapping.
  description: Apply SCARPET, or an equivalent site-specific biochemical assay with an inosine control,
    to the specific cytosolic mRNA sites assigned to TRMT6/TRMT61A by Safra et al. and Li et al., in
    parallel in wild-type cells and in TRMT61A and TRMT6 knockout cells. A site that gives an m1A spot
    in wild-type cells and loses it in either knockout is a validated substrate of the complex; a site
    that gives an inosine spot is an editing artefact.
  experiment_type: Site-specific biochemical validation with genetic dependency test
- hypothesis: The complex methylates an mRNA only when that mRNA adopts a T-loop fold, so mRNA m1A is
    a structural spillover of tRNA recognition rather than a distinct activity.
  description: Measure steady-state kinetics of the purified recombinant human TRMT6-TRMT61A
    heterotetramer on a panel of synthetic RNAs, comprising an authentic tRNA, an mRNA fragment
    predicted to fold into a T-loop-like element, the same fragment with the fold disrupted by
    compensatory mutations, and an unstructured adenosine-containing control, and compare kcat/Km
    across the panel.
  experiment_type: In vitro enzyme kinetics with structured-substrate panel
- hypothesis: Tumour phenotypes attributed to loss of mRNA m1A are in fact caused by tRNA A58
    hypomodification.
  description: In a TRMT61A-dependent cancer model, test whether the growth defect caused by TRMT61A
    knockdown is rescued by re-expression of a catalytically dead TRMT61A, of wild-type TRMT61A, and
    of an orthogonal tRNA m1A58 methyltransferase that cannot act on mRNA. Rescue by the orthogonal
    tRNA-only enzyme would localise the phenotype to tRNA hypomodification.
  experiment_type: Genetic rescue with substrate-restricted enzyme variants
