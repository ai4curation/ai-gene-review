- term:
    id: GO:0061953
    label: mRNA (adenine-N1-)-methyltransferase activity
  evidence_type: IDA
  original_reference_id: PMID:29072297
  qualifier: enables
  review:
    summary: The contested molecular function. Assigned from single-nucleotide-resolution m1A mapping
      showing TRMT6/TRMT61A-dependent methylation of a small number of cytosolic mRNAs at T-loop-like
      elements, and challenged in 2026 by biochemical validation showing that mapped internal mRNA m1A
      sites are largely inosine.
    action: KEEP_AS_NON_CORE
    reason: GOA carries both this and GO:0160107, and the dispute is entirely about the substrate
      class, not about the enzyme. Two points argue for retaining it. First, the paper cited here is
      one of the sceptical, base-resolution studies that cut the earlier antibody-based maps down from
      thousands of sites to a handful, not one of the discredited antibody maps, and it reports the
      modification as rare and sub-stoichiometric. Second, the mechanism is coherent, because
      substrate recognition by this complex is structural (a splayed T-loop), so an mRNA folding into
      a T-loop-like element is a legitimate if adventitious substrate. Against retention as a core
      function, Nalavade et al. 2026 show that newly mapped internal mRNA m1A sites actually contain
      inosine from A-to-I editing and conclude that genuine mRNA m1A is restricted to PRUNE1, ND5 and
      MALAT1. That paper is a discriminating assay rather than a blanket debunk, since it confirmed
      the equally contested internal m7G at high stoichiometry. Note that it does not mention TRMT6 or
      TRMT61A and does not itself attribute the surviving PRUNE1/MALAT1 sites to this complex. Not
      REMOVE, because this is an experimental annotation whose full text is not in the publication
      cache, and the correct reading of the current evidence is that the substrate class is narrow,
      not absent.
    supported_by:
    - reference_id: PMID:29072297
      supporting_text: Within the cytosol, m1A is present in a low number of mRNAs, typically at low
        stoichiometries, and almost invariably in tRNA T-loop-like structures, where it is introduced
        by the TRMT6/TRMT61A complex.
    - reference_id: PMID:42337368
      supporting_text: Using SCARPET, we show that newly mapped internal m1A sites are not m1A, but
        instead contain inosine from A-to-I editing.
    - reference_id: PMID:42337368
      supporting_text: These results strongly support the conclusion that m1A is not widespread in
        mammalian mRNAs but is instead largely restricted to the previously validated sites in PRUNE1,
        ND5 and MALAT1 RNA.
