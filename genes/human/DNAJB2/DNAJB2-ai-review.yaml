core_functions:
- description: 'The J domain binds Hsp70/Hsc70 and stimulates hydrolysis of partner-bound ATP, coordinating
    client handling. Productive folding recovery is client-dependent: mutant Parkin function can be restored
    in cellular assays, whereas DNAJB2a does not improve heat-denatured luciferase refolding in the tested
    system.'
  molecular_function:
    id: GO:0001671
    label: ATPase activator activity
  directly_involved_in:
  - id: GO:0032781
    label: positive regulation of ATP-dependent activity
  - id: GO:0042026
    label: protein refolding
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:7957263
    supporting_text: The weak intrinsic ATPase activity of the constitutive 70-kDa heat-shock protein
      is enhanced more than fivefold
  - reference_id: PMID:22219199
  - reference_id: PMID:20889486
    supporting_text: HSJ1a rescued Parkin(C289G) relocation to mitochondria in a J domain-dependent manner
  - reference_id: PMID:21231916
- description: Binds aggregation-prone clients and helps prevent their aggregation
    while coordinating their sorting to the proteasome or handling by the Hsp70 machinery.
    Ubiquitin-interacting motifs provide modification-dependent client recognition.
    Proteasomal turnover is promoted for some clients, whereas UIM-dependent preservation
    can retard Atx3 degradation. CK2 phosphorylation changes client recognition. The
    soluble HSJ1a and ER-associated HSJ1b products place this coupled client-handling
    mechanism in distinct cellular pools.
  molecular_function:
    id: GO:0140309
    label: unfolded protein holdase activity
  directly_involved_in:
  - id: GO:0090084
    label: negative regulation of inclusion body assembly
  - id: GO:0032436
    label: positive regulation of proteasomal ubiquitin-dependent protein catabolic
      process
  locations:
  - id: GO:0005829
    label: cytosol
  - id: GO:0005789
    label: endoplasmic reticulum membrane
  supported_by:
  - reference_id: PMID:21625540
    supporting_text: This dual regulation is dependent on the binding of the J-domain
      with HSP70, and the UIM domain with polyUb chains.
  - reference_id: PMID:15936278
    supporting_text: HSJ1 prevents client aggregation, shields clients against chain
      trimming by ubiquitin hydrolases, and stimulates their sorting to the proteasome.
  - reference_id: PMID:28031292
  - reference_id: PMID:24023695
  - reference_id: PMID:12754272
