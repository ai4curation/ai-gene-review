id: P25686
gene_symbol: DNAJB2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: DNAJB2 (HSJ1) is a neuronally enriched J-domain co-chaperone that couples Hsp70-family ATPase
  regulation to handling of aggregation-prone proteins. Its J domain binds Hsp70/Hsc70 and stimulates
  ATP hydrolysis, while two ubiquitin-interacting motifs recognize ubiquitinated clients and coordinate
  their processing with the chaperone and proteasome systems. Client outcomes include aggregation suppression,
  functional recovery or degradation and depend on the substrate and experimental context. The long HSJ1b
  product is prenylated and associated with the cytoplasmic face of the endoplasmic reticulum; the shorter
  HSJ1a product occupies cytosolic and nuclear pools. Pathogenic DNAJB2 variants cause inherited peripheral
  neuropathy and related neuromuscular phenotypes.
alternative_products:
- name: 1 (HSJ1b {ECO:0000303|PubMed:1599432})
  id: P25686-3
  description: HSJ1b is the 324-residue displayed product, P25686-3. It contains the J domain and both
    ubiquitin-interacting motifs, plus a C-terminal geranylgeranylation site at Cys321 that supports association
    with the cytoplasmic face of the ER. Its membrane targeting can alter rhodopsin handling differently
    from HSJ1a.
- name: 2 (HSJ1a {ECO:0000303|PubMed:1599432}, DNAJB2a)
  id: P25686-2
  sequence_note: VSP_001286, VSP_001287
  description: HSJ1a is the 277-residue product, P25686-2. It retains the J domain and both ubiquitin-interacting
    motifs but lacks the long product’s prenylated C-terminal tail, and has cytosolic and nuclear pools.
    Its client-dependent antiaggregation, folding-recovery and degradation effects are supported by several
    studies; historical constructs with different endpoints are distinguished in the source guide.
