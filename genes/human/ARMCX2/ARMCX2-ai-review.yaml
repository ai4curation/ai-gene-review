id: Q7L311
gene_symbol: ARMCX2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ARMCX2 (ALEX2) is a eutherian-specific armadillo-repeat protein of the X-linked ARMCX cluster,
  which arose from the ancestral gene ARMC10. Like its relatives it has an N-terminal transmembrane segment
  and is mitochondrial, appearing in the high-confidence human mitochondrial proteome. It is expected
  to share the family's role in regulating mitochondrial dynamics and axonal transport, although ARMCX2
  itself has not been tested. Its transcript is broadly expressed, and its promoter becomes methylated
  in chemoresistant ovarian cancer.
