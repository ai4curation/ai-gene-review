  review:
    summary: Axonal transport of mitochondrion (IBA). The only seed is mouse Armcx3, which regulates neuronal
      mitochondrial trafficking through the Kinesin/Miro/Trak2 complex. Family members ARMC10 and Armcx1
      have independent transport evidence. ARMCX2 has not been tested, but nothing suggests it has lost
      the family function; accepted as an inherited role.
    action: ACCEPT
    reason: '[PMID:22569362 "Furthermore, we demonstrate that Armcx3 expression levels regulate mitochondrial
      dynamics and trafficking in neurons, and that Alex3 interacts with the Kinesin/Miro/Trak2 complex
      in a Ca(2+)-dependent manner."] [PMID:22569362 "The Armcx cluster is unique to Eutherian mammals
      and evolved from a single ancestor gene (Armc10)."]'
    supported_by:
