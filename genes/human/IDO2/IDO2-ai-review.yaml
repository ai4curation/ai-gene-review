  title: Characterization of an indoleamine 2,3-dioxygenase-like protein found in
    humans and mice.
  findings:
  - statement: >-
      Identified a mammalian IDO2/INDOL1 paralog adjacent to IDO1 and reported
      that INDOL1 catalyzes conversion of tryptophan to kynurenine.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified, abstract-only in the local cache. Supports the mouse and
      human IDO2 orthology basis and the transferred IDO molecular function.
- id: PMID:17671174
  title: Novel tryptophan catabolic enzyme IDO2 is the preferred biochemical target
    of the antitumor indoleamine 2,3-dioxygenase inhibitory compound D-1-methyl-tryptophan.
  findings:
  - statement: >-
      Characterized IDO2 as an IDO-related tryptophan-catabolizing enzyme and
      identified common human coding polymorphisms that ablate enzymatic
      activity.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified, abstract-only in the local cache. This is the direct IDA
      support used by UniProt for the human IDO2 catalytic-activity row.
- id: PMID:18418598
  title: IDO1 and IDO2 are expressed in human tumors levo- but not dextro-1-methyl
    tryptophan inhibits tryptophan catabolism.
  findings:
  - statement: >-
      In human tumors and HeLa cells, IDO2 mRNA could be detected, but IDO1
      siRNA abrogated tryptophan degradation and only the IDO1 inhibitor
      blocked activity.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified, abstract-only in the local cache. Supports keeping IDO2
      catalytic rows while not assigning broad tumor-resistance or dominant
      pathway-flux functions to IDO2.
- id: PMID:25394548
  title: Heme-binding-mediated negative regulation of the tryptophan metabolic enzyme
    indoleamine 2,3-dioxygenase 1 (IDO1) by IDO2.
  findings:
  - statement: >-
      Human IDO2 co-expression reduced IDO1-dependent kynurenine production in
      HEK293 cells, and an H360A heme-site mutant lost the suppressive effect,
      consistent with heme-site-dependent competition.
    reference_section_type: RESULTS
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full text is available in the local cache. The artificial HEK293
      overexpression system supports the heme-site capability and a potential
      IDO1-modulatory activity, but not a new GO biological-process annotation.
- id: PMID:25691885
  title: Tryptophan-degrading enzymes in tumoral immune resistance.
  findings:
  - statement: >-
      Reviewed IDO2 as a recently identified, still poorly established third
      candidate tryptophan-degrading enzyme in tumor immune resistance.
    reference_section_type: OTHER
  reference_review:
