      de novo NAD-biosynthetic enzyme.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      IDO2 catalyzes only the entry reaction into the kynurenine pathway
      captured by GO:0006569 and GO:0033754. The specific de novo NAD+
