    Low-efficiency heme-dependent indoleamine 2,3-dioxygenase activity that can
    oxidize L-tryptophan and molecular oxygen to N-formyl-L-kynurenine, the
    first chemical step of tryptophan catabolism through the kynurenine pathway.
