    record_section: ["CC:CATALYTIC ACTIVITY"]
    supporting_text: Reaction=L-tryptophan + O2 = N-formyl-L-kynurenine
- description: >-
    Binds a heme cofactor through the conserved proximal histidine that
    supports IDO-family dioxygenase chemistry and may allow IDO2 to compete
    with IDO1 for heme in contexts where both paralogs are co-expressed.
  molecular_function:
