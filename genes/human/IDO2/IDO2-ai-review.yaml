id: Q6ZQW0
gene_symbol: IDO2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  Indoleamine 2,3-dioxygenase 2 is a cytosolic heme dioxygenase in the
  vertebrate IDO/TDO kynurenine-pathway family. Recombinant human IDO2 can
  oxidize L-tryptophan with dioxygen to N-formyl-L-kynurenine, but it has much
  lower tryptophan affinity and catalytic efficiency than IDO1 and two common
  human coding variants strongly reduce or abolish the activity. IDO2 is
  expressed in selected immune and epithelial contexts and may also modulate
  IDO1 activity through heme-site-dependent competition, so the preserved core
  chemistry is best interpreted as a weak, context-dependent IDO paralog rather
  than the dominant human tryptophan-degrading enzyme.
