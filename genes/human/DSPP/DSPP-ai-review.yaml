  label: Homo sapiens
description: Dentin sialophosphoprotein is a secreted precursor of non-collagenous dentin matrix proteins.
  Proteolytic processing produces an N-terminal dentin sialoprotein region and an acidic, highly phosphorylated
  C-terminal dentin phosphoprotein region. Their matrix interactions and effects on mineral deposition support
  the formation and maturation of mineralized dentin. The phosphoprotein region binds calcium and collagen;
  evidence from rodent biochemistry and genetics distinguishes promotion of later dentin mineralization from
  an obligatory role in its initial nucleation.
