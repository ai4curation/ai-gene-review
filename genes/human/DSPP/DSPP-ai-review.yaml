core_functions:
- description: Secreted DSPP-derived proteins contribute to the structural integrity and mineral maturation
    of dentin. The acidic, phosphorylated DPP region interacts with calcium and collagen, coupling matrix association
    to mineral deposition; native rat phosphophoryn promotes apatite formation in reconstituted biochemical
    assays. Mouse null and DPP-truncation experiments establish complementary contributions of the DSP-containing
    and DPP regions to the amount and uniformity of later circumpulpal dentin mineralization. Initial matrix-vesicle-associated
    mineral formation can occur without DSPP in that mouse setting.
  molecular_function:
    id: GO:0005201
    label: extracellular matrix structural constituent
  directly_involved_in:
  - id: GO:0097187
    label: dentinogenesis
  locations:
  - id: GO:0140149
    label: non-collagenous component of interstitial matrix
  supported_by:
  - reference_id: PMID:16046405
    supporting_text: its function as a mediator of dentin biomineralization.
  - reference_id: PMID:40640300
  - reference_id: PMID:8995371
  - reference_id: PMID:22615197
suggested_questions:
- question: Which endogenous human DSPP-derived species enter odontoblast nuclei, and do those pools have a
    function distinct from extracellular matrix action?
- question: How do defined human DSP and DPP products divide their effects on dentin mineral propagation and
    maturation under native collagen and phosphorylation conditions?
- question: Which DSPP-derived reagent and receptor interactions account for the cellular differentiation effects,
    and how far do the mouse-cell findings extend to human odontoblasts?
suggested_experiments:
- description: Combine endogenous product-specific tagging or validated antibodies with nuclear fractionation,
    contamination controls and peptide-level identification in human odontoblast models, before assigning a
