id: Q16790
gene_symbol: CA9
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CA9 (carbonic anhydrase IX) is a hypoxia-induced, single-pass type I transmembrane member
  of the alpha carbonic anhydrase family. Its extracellular region carries an N-terminal proteoglycan-like
  (PG) domain and a zinc-dependent catalytic carbonic-anhydrase domain that faces the cell exterior, so
  CA9 is a cell-surface ectoenzyme. It reversibly hydrates CO2 to bicarbonate and a proton and is one
  of the most catalytically active CA isozymes. Driven by the HIF pathway, it is strongly upregulated
  in hypoxic solid tumors (and a limited set of normal tissues, notably gastric mucosa), where its extracellular
  catalysis supports pH homeostasis, helping acidify the tumor microenvironment while maintaining intracellular
  pH. It forms disulfide-linked oligomers and has been implicated in tumor cell adhesion and proliferation.
