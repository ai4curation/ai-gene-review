core_functions:
- description: Hypoxia-induced cell-surface ectoenzyme. Its extracellular zinc-dependent catalytic domain
    reversibly hydrates CO2 to bicarbonate and a proton, supporting pH regulation in hypoxic tissues and
    tumors.
  molecular_function:
    id: GO:0004089
    label: carbonate dehydratase activity
  locations:
  - id: GO:0005886
    label: plasma membrane
  directly_involved_in:
  - id: GO:0051453
    label: regulation of intracellular pH
  supported_by:
  - reference_id: PMID:11676494
    supporting_text: In kinetic constants for the hydration of CO2, CA IX closely resembled CA II
  - reference_id: PMID:18703501
    supporting_text: in addition to its classical role in pH regulation
suggested_questions:
- question: How much of CA9 catalytic output serves extracellular acidification versus intracellular pH
    maintenance in hypoxic tumor cells?
- question: Does the proteoglycan-like domain contribute catalytically (e.g. as a proton antenna) or mainly
    to adhesion?
suggested_experiments:
- description: Surface-restricted CA-activity assays (membrane-impermeant inhibitors) on hypoxic tumor
    cells, plus PG-domain deletion, to separate extracellular catalysis and adhesion functions.
