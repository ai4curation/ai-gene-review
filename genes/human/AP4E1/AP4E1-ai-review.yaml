  title: AP4E1 primary evidence, construct boundaries and annotation decisions
core_functions:
- description: Within AP-4, epsilon contributes the structural and membrane-recruitment side of a cargo-adaptor
    mechanism. Its trunk assembles into the heterotetramer and directly engages activated ARF1; its ear
    recruits tepsin. Together these contacts support formation of cytoplasmic carriers at the TGN. Cargo-motif
    recognition is supplied by mu4, so the cargo-adaptor activity is contributed in the complex rather
    than attributed to isolated epsilon.
