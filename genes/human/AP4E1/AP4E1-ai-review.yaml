suggested_questions:
- question: Does endogenous human AP4E1 occupy a measurable endosomal membrane pool distinct from its
    TGN pool, and what evidence drives ARBA00028568?
- question: How does bivalent tepsin recruitment organize the AP-4 coat; does it bridge AP-4 complexes
    in a reconstituted human system?
- question: What contribution does epsilon ARF1 binding make to cargo selection beyond the mu4 recognition
    interface?
suggested_experiments:
- description: Quantify endogenous epsilon localization using a validated knock-in tag, TGN and endosomal
    markers, and correlative imaging to distinguish transient membrane residence from cargo destination.
- description: Reconstitute full-length human AP-4 with ARF1, membrane cargo and tepsin, comparing epsilon
    ear and ARF1-interface mutants to test recruitment and coat organization directly.
