  review:
    summary: The cargo destination in the Reactome event does not place epsilon inside the endosome lumen.
    action: REMOVE
    reason: The cited event describes APP delivery and recognition of its cytoplasmic tail by mu4. GO0031904
      is the enclosed endosomal volume. AP-4 instead forms a cytoplasm-facing coat recruited through epsilon–ARF1
      contacts. Assigning that coat subunit to the cargo destination lumen conflicts with this topology.
      This is a source-specific TAS compartment correction; it does not claim a wrong experimental paper
      or exclude every endosome-associated pool.
