id: Q9UPM8
gene_symbol: AP4E1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: AP4E1 encodes the epsilon large subunit of the heterotetrameric AP-4 adaptor complex. AP-4
  forms a nonclathrin coat on the cytoplasmic face of the trans-Golgi network and sorts membrane proteins
  into transport carriers. The epsilon N-terminal trunk contributes to the complex core and binds activated
  ARF1 for membrane recruitment, while its C-terminal ear binds the accessory protein tepsin. These interactions
  support coat assembly and cargo transport in coordination with the mu4 cargo-recognition subunit.
