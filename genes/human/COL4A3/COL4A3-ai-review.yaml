  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: DISPUTED at figure-specific scope. The official 2019 notice identifies PNAS Fig 5A bottom
      Raf, Fig 5D middle rh-Endo and Fig 4A top phospho-FAK images (PDF pp6–8). The 2026 correction separately
      addresses similar blots in Figs 4C/5C and unavailable originals. Its linked preprint tests phospho-Akt/total
      Akt in HUVEC on fibronectin with 20 micrograms/ml recombinant human fragments; it does not repeat
      integrin blockade, angiogenesis, apoptosis or ERK assays. The correction therefore does not establish
      resolution of all 2019 concerns. This is not a retraction or proof that every experiment is false.
      Independent PMID:10837460 and PMID:12842087 support retained fragment biology. Original PNAS full
      main text remains unavailable; public notice, correction and preprint links and short anchors are
      in COL4A3-notes.md and the source-evidence index.
