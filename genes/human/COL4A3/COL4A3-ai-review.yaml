    label: integrin binding
  evidence_type: IDA
  original_reference_id: PMID:12682293
  qualifier: enables
  review:
    summary: Retain integrin binding by the tumstatin fragment.
    action: ACCEPT
    reason: The selected original abstract reports human tumstatin interaction with alphaVbeta3. The original
      PNAS source has figure-specific integrity concerns documented in PMID:31749508 and a later correction,
      PMID:42467515. Its 2026 repeat measures differential Akt phosphorylation, not integrin blockade
      or angiogenesis. Separate PMID:10837460 and actual human-recombinant/mouse functional experiments
      in PMID:12842087 support the retained biological activity; no whole-paper invalidation or complete
      revalidation is inferred. This activity belongs to the released NC1-derived fragment, not automatically
      to intact matrix collagen or every alternative product.
