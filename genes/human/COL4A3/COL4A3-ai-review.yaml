core_functions:
- description: Assembles with alpha-4 and alpha-5 chains into type-IV collagen protomers and terminal-domain
    networks, contributing basement-membrane architecture and mechanical integrity. The network-forming
    role is distinct from fibrillar collagen assembly and from enzymatic hydroxylation, cross-link chemistry
    or proteolytic processing carried out by other proteins. Alternative C-terminal products are not assumed
    to reproduce the canonical assembly.
  molecular_function:
    id: GO:0030020
    label: extracellular matrix structural constituent conferring tensile strength
  directly_involved_in:
  - id: GO:0030198
    label: extracellular matrix organization
  locations:
  - id: GO:0005604
    label: basement membrane
  in_complex:
    id: GO:0005587
    label: collagen type IV trimer
  supported_by:
  - reference_id: PMID:12193605
  - reference_id: PMID:7987396
  - reference_id: Reactome:R-HSA-2213207
- description: The released NC1-derived tumstatin fragment binds integrins and inhibits pathological angiogenesis
    through receptor-dependent endothelial effects. Human recombinant fragment rescue and beta3-dependent
    mouse assays support this receptor-dependent activity. The intact matrix chain and alternative products
    are not presumed equivalent; MMP-mediated fragment release is a processing step performed by the protease.
  molecular_function:
    id: GO:0005178
    label: integrin binding
  directly_involved_in:
  - id: GO:0016525
    label: negative regulation of angiogenesis
  locations:
  - id: GO:0005576
    label: extracellular region
  supported_by:
  - reference_id: PMID:10837460
  - reference_id: PMID:12842087
suggested_questions:
- question: Which alternative COL4A3 products form secreted alpha3/alpha4/alpha5 protomers, and which
    retain biologically active tumstatin regions?
- question: Does a sequence-defined COL4A3 fragment directly bind and inhibit a particular metalloendopeptidase,
    separately from its integrin-mediated effects?
- question: Does COL4A3 perform a defined collagen-fibril-organization step in addition to its established
    type-IV network role?
- question: Which original signaling conclusions survive independent replication after distinguishing
    the 2019 affected panels from the limited 2026 Akt repeat?
suggested_experiments:
- hypothesis: C-terminal splice changes alter collagen-IV assembly and released-fragment integrin activity.
  description: Compare sequence-authenticated human products in heterotrimer assembly, secretion and network-incorporation
    assays. Separately assay purified released fragments for integrin binding and receptor-dependent endothelial
    effects, with matching expression and processing controls.
- hypothesis: The inherited enzyme-inhibitor assertion represents a direct fragment-enzyme interaction
    distinct from fragment generation.
  description: If the original proposed enzyme can be identified, measure binding and catalytic activity
    with purified metalloendopeptidase, substrate and sequence-defined COL4A3 fragments, using inhibitor
    and cleavage controls.
status: DRAFT
