id: Q01955
gene_symbol: COL4A3
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: COL4A3 encodes the alpha-3 chain of type-IV collagen, a secreted basement-membrane protein.
  It assembles with alpha-4 and alpha-5 chains into triple-helical protomers that associate through terminal
  domains to form a matrix network, particularly important in the glomerular basement membrane. Disruption
  of this architecture causes Alport-spectrum kidney disease and can affect hearing. Proteolytic release
  of its C-terminal NC1 region produces tumstatin, a fragment that binds integrins and inhibits endothelial
  proliferation and pathological angiogenesis in experimental systems. Alternative transcripts change
  or remove portions of the C-terminal region, so their assembly and fragment activities need not be equivalent.
