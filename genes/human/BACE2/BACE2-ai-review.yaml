id: Q9Y5Z0
gene_symbol: BACE2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: BACE2 (beta-site APP-cleaving enzyme 2, memapsin-1) is a type I transmembrane aspartic protease
  of the pepsin family, the paralog of the Alzheimer beta-secretase BACE1. It traffics through the Golgi
  and endosomes to the plasma membrane and early melanosomes. In melanocytes it cleaves PMEL in its juxtamembrane
  domain, releasing the luminal fragment that forms the amyloid matrix of melanosomes; Bace2-null mice
  have coat-color defects. In pancreatic beta cells it is the sheddase of TMEM27/CLTRN, and loss of Bace2
  activity increases beta-cell mass and improves glucose control. In cells it cleaves APP mainly within
  the amyloid-beta region near the alpha site, which limits amyloid-beta production, and in vitro it degrades
  amyloid-beta efficiently. In lymphatic endothelial cells it sheds VEGFR3, modulating lymphangiogenic
  signalling. It matures by autocatalytic removal of its prodomain, and it can also cleave IAPP in vitro.
