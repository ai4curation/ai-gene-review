- term:
    id: GO:0016540
    label: protein autoprocessing
  evidence_type: IDA
  original_reference_id: PMID:11316808
  qualifier: involved_in
  review:
    summary: Protein autoprocessing (NEW, IDA). BACE2 removes its own prodomain by autocatalytic cleavage
      between Leu62 and Ala63. Mutating the catalytic Asp110 to Asn abolishes the cleavage, and purified
      BACE2 also autoactivates in vitro. BACE2 is the catalyst acting on itself, so it does the work of
      the process. ASPRV1 is a comparator protease reviewed with this term.
    action: NEW
    reason: '[PMID:11316808 "Here we show that prodomain processing of Asp1 occurs between Leu(62) and
      Ala(63) and is autocatalytic."] [PMID:11316808 "Mutation of one of the conserved catalytic aspartic
      acid residues in the active site of Asp1 to asparagine (D110N) abolished this cleavage."] [PMID:11423558
      "Herein we show that purified BACE2 can be autoactivated in vitro."]'
    supported_by:
    - reference_id: PMID:11316808
      supporting_text: Here we show that prodomain processing of Asp1 occurs between Leu(62) and Ala(63)
        and is autocatalytic.
    - reference_id: PMID:11316808
      supporting_text: Mutation of one of the conserved catalytic aspartic acid residues in the active
        site of Asp1 to asparagine (D110N) abolished this cleavage.
    - reference_id: PMID:11423558
