        leading edge of the cells
    - reference_id: file:human/SPRY1/SPRY1-uniprot.txt
      supporting_text: Found in the cytoplasm in unstimulated cells but is translocated to the membrane ruffles in cells stimulated
        with EGF (epidermal growth factor)
