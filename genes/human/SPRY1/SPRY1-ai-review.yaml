references:
- id: file:human/SPRY1/SPRY1-hypotheses/spry1-grb2-sh3-motif/openscientist.md
  title: OpenScientist focused report on a SPRY2-type GRB2 SH3-binding motif in SPRY1
  findings:
  - statement: SPRY1 (human, mouse) lacks the C-terminal PxxPxR GRB2 SH3-binding motif, which is conserved only in mammalian
      SPRY2 (PTVPPR, position 304); SPRY1 conserves the N-terminal NEYTEG Tyr53, so any GRB2 binding would be
