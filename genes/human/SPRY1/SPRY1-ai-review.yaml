  title: UniProt entry O43609 (SPRY1_HUMAN)
  findings: []
core_functions:
- description: Inducible negative-feedback inhibitor of RTK (notably FGFR, also VEGFR) signalling to Ras-ERK, recruited to
    the plasma membrane after growth-factor stimulation and phosphorylated on Tyr53; SHP2 dephosphorylation of Tyr53
    inactivates it. The molecular function is the Sprouty family's inherited protein kinase inhibitor activity (PAINT IBA;
    no loss in SPRY1). How SPRY1 blocks Ras activation is unresolved. Hanafusa 2002 reports phospho-Tyr53 binding to GRB2
    that keeps GRB2-SOS from FRS2/SHP2; Gross 2001 finds Ras blocked without disrupting the FRS2-GRB2-SOS complex. SPRY1
    lacks the SPRY2-exclusive C-terminal PxxPxR GRB2 SH3 motif, so a GRB2-sequestering activity is recorded as a lead,
    not asserted.
  molecular_function:
    id: GO:0004860
    label: protein kinase inhibitor activity
  directly_involved_in:
  - id: GO:0070373
    label: negative regulation of ERK1 and ERK2 cascade
  - id: GO:0040037
    label: negative regulation of fibroblast growth factor receptor signaling pathway
  - id: GO:0046580
    label: negative regulation of Ras protein signal transduction
  locations:
  - id: GO:0005886
    label: plasma membrane
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:12402043
    supporting_text: they bind to the adaptor protein Grb2 and inhibit the recruitment of the Grb2-Sos complex either to the
      fibroblast growth factor receptor (FGFR) docking adaptor protein FRS2 or to Shp2
  - reference_id: PMID:12402043
    supporting_text: after stimulation by growth factors Spry1 and Spry2 translocate to the plasma membrane and become phosphorylated
      on a conserved tyrosine
  - reference_id: PMID:16339969
    supporting_text: Sprouty1 specifically interacts with Grb2, whereas Sprouty4 interacts with Sos1
  - reference_id: PMID:16339969
    supporting_text: The hetero-oligomer formed between Sprouty1 and Sprouty4 exhibits the most potent inhibitory effect on
      ERK activation through its highly effective ability to suppress the association of Grb2-Sos1 complex with FRS2
  - reference_id: PMID:11585837
    supporting_text: these proteins specifically inhibit the Ras/Raf/MAP kinase pathway by preventing Ras activation
  - reference_id: PMID:20813052
    supporting_text: In line with these data, we observed an increased ERK1/2 activation and a higher migration capacity in
      SPRY1-silenced cells
  - reference_id: PMID:11238463
    supporting_text: Overexpressed Spry-1 and -2 inhibit fibroblast growth factor- and vascular endothelial growth factor-induced
      proliferation and differentiation by repressing pathways leading to p42/44 mitogen-activating protein (MAP) kinase activation
  - reference_id: PMID:11238463
    supporting_text: a small subset of hSpry-1 was recruited within 30 min to the plasma membrane, mainly to the lamellipodia
      of the leading edge of the cells
  - reference_id: PMID:16481357
    supporting_text: a purified SHP-2 protein dephosphorylates the critical tyrosine of Sprouty 1
  - reference_id: file:human/SPRY1/SPRY1-hypotheses/spry1-grb2-sh3-motif/openscientist.md
    supporting_text: to whatever extent SPRY1 binds GRB2 at all, it would do so through a route that has nothing to do with
      the PxxPxR motif named in the hypothesis
suggested_questions:
- question: 'At which step does SPRY1 block Ras activation: by sequestering phospho-Tyr53-bound GRB2 away from FRS2/SHP2 (Hanafusa
    2002) or downstream of an intact FRS2-GRB2-SOS complex (Gross 2001)? The answer decides whether ''protein sequestering
    activity'' or another MF best describes SPRY1.'
- question: Does SPRY1, like SPRY2/SPRY4, directly inhibit any kinase (RAF1, TESK1, JAK2), which would make the inherited
    GO:0004860 a core rather than non-core activity?
- question: Does SPRY1 negatively regulate EGFR signalling in human cells, or does its CBL-binding capacity (as reported for
    SPRY2) potentiate EGFR signalling? The PAINT EGFR annotation is unresolved for SPRY1.
- question: Ureteric bud and kidney phenotypes of Spry1 mutant mice are outcomes of unrestrained GDNF/RET and FGF10/FGFR2
    signalling; GO has obsoleted the specific 'negative regulation of GDNF receptor signaling involved in ureteric bud formation'
    terms. Is there a GO-sanctioned way to capture SPRY1's negative regulation of RET signalling without annotating developmental
    outcomes?
- question: How does Tyr53-dependent SPRY1 signalling activate p38 to drive senescence, independent of its ERK-inhibitory
    role?
suggested_experiments:
- hypothesis: Tyr53-phosphorylated SPRY1 directly competes with FRS2 for the GRB2 SH2 domain.
  description: Quantitative binding (ITC/SPR) of GRB2 SH2 domain to pTyr53 SPRY1 peptide vs FRS2 pY peptides, plus reconstitution
    of FRS2-GRB2-SOS1 assembly with recombinant SPRY1 WT, Y53F and cysteine-rich-domain mutants.
  experiment_type: in vitro binding and reconstitution
- hypothesis: Endogenous human SPRY1 provides ERK-dependent negative feedback on FGFR but not EGFR signalling.
  description: CRISPR knockout of SPRY1 (alone and with SPRY2/SPRY4) in human endothelial cells or iPSC-derived kidney organoids,
    FGF2/VEGF/EGF/GDNF time courses for Ras-GTP and pERK, and rescue with Y53A or palmitoylation-deficient SPRY1.
  experiment_type: genetic knockout with rescue
