- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:25416956
  qualifier: enables
  supporting_entities:
  - UniProtKB:O43597
  review:
    summary: Interaction with the paralog SPRY2 detected in the HI-II-14 proteome-scale yeast two-hybrid interactome.
    action: MODIFY
    reason: Sprouty paralogs hetero-oligomerise through their C-terminal cysteine-rich domains, and SPRY1-containing hetero-oligomers
      (notably with SPRY4) are the most potent inhibitors of FGF2-induced ERK activation. The SPRY1-SPRY2 pair is therefore
      a biologically meaningful paralog interaction, and protein heterodimerization activity is more informative than 'protein
      binding'. It is not itself the core feedback activity.
    proposed_replacement_terms:
    - id: GO:0046982
      label: protein heterodimerization activity
    additional_reference_ids:
    - PMID:16339969
    supported_by:
    - reference_id: PMID:25416956
      supporting_text: A proteome-scale map of the human interactome network
    - reference_id: PMID:16339969
      supporting_text: The four mammalian Sprouty isoforms interact with each other, most probably to form hetero- as well
        as homo-oligomers through their C-terminal domains
