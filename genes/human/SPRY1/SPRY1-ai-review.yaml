- term:
    id: GO:0004860
    label: protein kinase inhibitor activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000961788
  - UniProtKB:O43597
  - UniProtKB:Q9C004
  review:
    summary: PAINT-propagated protein kinase inhibitor activity from the Sprouty family node PTN000961788 (SPRY2 and SPRY4
      as experimental donors).
    action: ACCEPT
    reason: 'The IBA reflects a family-level judgment that Sprouty proteins inhibit kinases (SPRY4 inhibits TESK1 and blocks
      RAF1 activation; SPRY2 inhibits Ser/Thr kinases). SPRY1 sits inside the clade and there is no evidence of loss, so the
      inherited annotation is not contradicted. However, no SPRY1-specific assay shows direct inhibition of a kinase''s catalytic
      activity: the best-supported SPRY1 mechanism is binding the adaptor GRB2 and blocking recruitment of GRB2-SOS to FRS2/SHP2
      (adaptor sequestration), and SPRY1 suppression of JAK2 in erythroid cells is genetic with an explicitly unresolved mechanism.
      An OpenScientist sequence analysis then showed that SPRY1 lacks the C-terminal PxxPxR GRB2 SH3-binding motif,
      which is exclusive to SPRY2, and the GRB2 mechanism is contested even for SPRY2 (Martinez 2007 versus Lao 2007).
      A SPRY1-specific sequestering activity is therefore not established, and the inherited family activity, with no
      evidence of loss in SPRY1, is the best-supported molecular function and is now used as the core MF.'
    additional_reference_ids:
    - PMID:12402043
    - PMID:16339969
    - PMID:22508938
    supported_by:
    - reference_id: PMID:12402043
      supporting_text: they bind to the adaptor protein Grb2 and inhibit the recruitment of the Grb2-Sos complex either to
        the fibroblast growth factor receptor (FGFR) docking adaptor protein FRS2 or to Shp2
    - reference_id: PMID:16339969
      supporting_text: Sprouty1 specifically interacts with Grb2, whereas Sprouty4 interacts with Sos1
    - reference_id: PMID:22508938
      supporting_text: Molecular mechanisms for Spry1 suppression of Jak2 presently are speculative
    - reference_id: file:human/SPRY1/SPRY1-deep-research-falcon.md
      supporting_text: This is **adaptor-level regulation**, not evidence that SPRY1 catalytically dephosphorylates or directly
        blocks the FGFR kinase
    - reference_id: file:human/SPRY1/SPRY1-hypotheses/spry1-grb2-sh3-motif/openscientist.md
      supporting_text: The only canonical C-terminal PxxPxR GRB2-SH3 ligand in any mammalian Sprouty is SPRY2's PTVPPR at
        position 304
    - reference_id: PMID:17689925
      supporting_text: These results are evidence that the Sprouty2 mechanism of ERK inhibition is independent of Grb2 binding.
