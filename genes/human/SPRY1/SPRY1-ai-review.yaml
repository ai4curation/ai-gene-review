id: O43609
gene_symbol: SPRY1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'Sprouty homolog 1 (SPRY1) is a small, non-enzymatic intracellular member of the Sprouty family that acts as
  an inducible negative-feedback regulator of receptor tyrosine kinase (RTK) signalling to the Ras-RAF-MEK-ERK cascade. Its
  expression is induced by growth-factor/ERK signalling. SPRY1 is palmitoylated and associates with caveolin-1 on perinuclear/vesicular
  membranes; after FGF2 or VEGF stimulation a pool is recruited to the plasma membrane (leading-edge lamellipodia), where
  it becomes phosphorylated on a conserved N-terminal tyrosine (Tyr53) and reduces Ras activation and ERK signalling; inhibition
  is strongest in hetero-oligomers with SPRY4 (formed through the C-terminal cysteine-rich Sprouty domain). Phospho-SPRY1 has
  been reported to bind the adaptor GRB2 and limit recruitment of the GRB2-SOS complex to FRS2 and SHP2, but this is disputed,
  and SPRY1 lacks the C-terminal PxxPxR GRB2 SH3-binding motif found only in SPRY2.
  SHP2 (PTPN11) dephosphorylates the critical tyrosine, inactivating SPRY1. Physiologically SPRY1 restrains FGF/VEGF-driven
  endothelial proliferation, migration and angiogenesis, restricts GDNF/RET- and FGF10/FGFR2-driven ureteric bud induction
  and branching in the developing kidney (mouse), dampens FGF-driven lens fiber differentiation, and suppresses EPO-induced
  JAK2 and ERK activation in erythroid progenitors. Effects are context dependent: excess SPRY1 can reduce CBL-mediated FGFR2
  ubiquitination and prolong ERK signalling, and Tyr53-dependent SPRY1 signalling promotes p38-dependent cellular senescence.'
