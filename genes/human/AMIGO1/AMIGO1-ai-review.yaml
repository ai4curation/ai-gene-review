- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0039
  review:
    summary: 'Plasma membrane / membrane: AMIGO1 is a type I transmembrane protein at the neuronal surface.
      Accepted.'
    action: ACCEPT
    reason: AMIGO1 co-clusters with Kv2 channels at somatic ER-plasma membrane junctions [PMID:29403353
      "AMIGO-1 is coclustered with Kv2 α subunits at specific plasma membrane (PM) sites associated with
      hypolemmal subsurface cisternae at neuronal ER:PM junctions."]. AMIGO family members bind each other
      homophilically and heterophilically [PMID:12629050 "A homophilic and heterophilic binding mechanism
      is shown between the members of the AMIGO family."]; the ectodomain dimerizes through its LRRs [PMID:21983541
      "AMIGO-1 is a dimer, with the LRR regions forming the dimer interface"], and AMIGO acts as an adhesion
      molecule on developing fiber tracts [PMID:12629050 "Our results suggest that the members of the
      AMIGO protein family are novel cell adhesion molecules among which AMIGO is specifically expressed
      on fiber tracts of neuronal tissues and participates in their formation."]. In zebrafish, knockdown
      disrupts fasciculated tracts [PMID:24904058 "Knockdown of amigo1 expression using morpholino oligonucleotides
      impairs the formation of fasciculated tracts in early fiber scaffolds of brain."]. Evidence is from
      rat and zebrafish; the human rows are inferred.
    supported_by:
    - reference_id: PMID:29403353
      supporting_text: AMIGO-1 is coclustered with Kv2 α subunits at specific plasma membrane (PM) sites
        associated with hypolemmal subsurface cisternae at neuronal ER:PM junctions.
    - reference_id: PMID:12629050
      supporting_text: A homophilic and heterophilic binding mechanism is shown between the members of
        the AMIGO family.
