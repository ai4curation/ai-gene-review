- term:
    id: GO:1901381
    label: positive regulation of potassium ion transmembrane transport
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q80ZD8
  - ensembl:ENSMUSP00000061244
  review:
    summary: Positive regulation of potassium ion transmembrane transport, the process view of increasing
      Kv2.1 conductance. Accepted.
    action: ACCEPT
    reason: 'In mouse brain AMIGO1 is an auxiliary subunit of the Kv2.1 channel [PMID:22056818 "Here we
      identify AMIGO (amphoterin-induced gene and ORF), a neuronal adhesion protein with leucine-rich
      repeat and immunoglobin domains, as an integral part of the Kv2.1 channel complex."]: it increases
      Kv2.1 conductance [PMID:22056818 "AMIGO increases Kv2.1 conductance in a voltage-dependent manner
      in HEK cells."] and is needed for the native delayed-rectifier current [PMID:22056818 "Accordingly,
      inhibition of endogenous AMIGO suppresses neuronal I(K) at negative membrane voltages."]. In adult
      mammalian brain it is found only with Kv2.1 and Kv2.2 [PMID:29403353 "We show that AMIGO-1 is extensively
      colocalized with both Kv2.1 and its paralog Kv2.2 in brain neurons across diverse mammals, and that
      in adult brain, there is no apparent population of AMIGO-1 outside of that colocalized with these
      Kv2 α subunits."]. The human rows are inferred from the mouse ortholog.'
    supported_by:
    - reference_id: PMID:22056818
      supporting_text: Here we identify AMIGO (amphoterin-induced gene and ORF), a neuronal adhesion protein
        with leucine-rich repeat and immunoglobin domains, as an integral part of the Kv2.1 channel complex.
    - reference_id: PMID:22056818
      supporting_text: AMIGO increases Kv2.1 conductance in a voltage-dependent manner in HEK cells.
    - reference_id: PMID:29403353
      supporting_text: We show that AMIGO-1 is extensively colocalized with both Kv2.1 and its paralog
        Kv2.2 in brain neurons across diverse mammals, and that in adult brain, there is no apparent population
        of AMIGO-1 outside of that colocalized with these Kv2 α subunits.
    - reference_id: file:genes/human/AMIGO1/AMIGO1-deep-research-affinage.md
      supporting_text: AMIGO1 is a type I transmembrane leucine-rich-repeat/immunoglobulin-domain cell
        adhesion molecule that serves dual roles in neural circuit assembly and in shaping neuronal electrical
        excitability
