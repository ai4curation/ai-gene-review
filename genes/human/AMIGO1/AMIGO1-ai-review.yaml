id: Q86WK6
gene_symbol: AMIGO1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'AMIGO1 (amphoterin-induced gene and ORF 1) is a neuronal type I transmembrane protein with
  six leucine-rich repeats and one immunoglobulin domain; its ectodomain dimerizes through the LRRs. It
  has two roles. During development it acts as a homophilic and heterophilic adhesion molecule with the
  other AMIGO family members on fiber tracts, promoting neurite outgrowth and fasciculation. In mature
  neurons it is an auxiliary subunit of the voltage-gated potassium channels Kv2.1 and Kv2.2: it co-clusters
  with them at endoplasmic reticulum-plasma membrane junctions on the soma and proximal dendrites, depends
  on them for its surface expression, and increases Kv2.1 conductance in a voltage-dependent way, enlarging
  the delayed-rectifier potassium current at negative voltages.'
