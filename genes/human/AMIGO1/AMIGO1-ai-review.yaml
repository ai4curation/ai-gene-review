  review:
    summary: Positive regulation of neuron projection development. Supported in culture and in vivo, but
      compartment- and cell-type-specific; kept as non-core.
    action: KEEP_AS_NON_CORE
    reason: The ectodomain promotes neurite extension and, in solution, blocks fasciculation [PMID:12629050
      "A substrate-bound form of the recombinant AMIGO ectodomain promoted prominent neurite extension
      in hippocampal neurons, and in solution, the same AMIGO ectodomain inhibited fasciculation of neurites."].
      siRNA knockdown reduces dendritic growth of cultured cortical neurons [PMID:21938721 "In line with
      AMIGO's dendritic localization, siRNA-mediated silencing of AMIGO resulted in reduced dendritic
      growth of cortical neurons in culture."], and knockout mice have smaller horizontal-cell axons [PMID:35169021
      "Removal of AMIGO1 reduces the size of horizontal cell axons without affecting the size of their
      dendrites"]. Real but specific growth effects; kept as non-core.
