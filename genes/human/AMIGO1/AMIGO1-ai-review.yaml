- term:
    id: GO:0007409
    label: axonogenesis
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q80ZD7
  - ensembl:ENSRNOP00000066608
  review:
    summary: Axonogenesis / positive regulation of axonogenesis. Supported in culture and in vivo, but
      compartment- and cell-type-specific; kept as non-core.
    action: KEEP_AS_NON_CORE
    reason: The ectodomain promotes neurite extension and, in solution, blocks fasciculation [PMID:12629050
      "A substrate-bound form of the recombinant AMIGO ectodomain promoted prominent neurite extension
      in hippocampal neurons, and in solution, the same AMIGO ectodomain inhibited fasciculation of neurites."].
      In vivo, Amigo1 knockout mice have smaller retinal horizontal-cell axons with unchanged dendrites
      [PMID:35169021 "Removal of AMIGO1 reduces the size of horizontal cell axons without affecting the
      size of their dendrites"]. A real but cell-type-specific axon growth effect, secondary to the adhesion
      and Kv2 roles, so kept as non-core.
    supported_by:
    - reference_id: PMID:12629050
      supporting_text: A substrate-bound form of the recombinant AMIGO ectodomain promoted prominent neurite
        extension in hippocampal neurons, and in solution, the same AMIGO ectodomain inhibited fasciculation
        of neurites.
    - reference_id: PMID:35169021
