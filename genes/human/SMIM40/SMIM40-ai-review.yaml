  review:
    summary: >-
      UniProt subcellular-location mapping to membrane, based on the single predicted
      helical transmembrane segment (residues 35-55).
    action: ACCEPT
    reason: >-
      Correct, though general. A 21-residue hydrophobic helix in a 79-residue protein makes
      SMIM40 a single-pass integral membrane protein. No experiment identifies the specific
      membrane, so a more precise location cannot be given. This is the only annotation the
      gene carries and the only one the evidence supports.
