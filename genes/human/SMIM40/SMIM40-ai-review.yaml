suggested_questions:
- question: >-
    Is SMIM40 expressed as protein in the retina, and in which cell type and membrane?
- question: >-
    Is SMIM40 co-regulated with its immediate neighbour DAXX, or does it share regulatory
    elements with the surrounding MHC class II region genes?
suggested_experiments:
- hypothesis: SMIM40 is a retinal single-pass membrane protein of a defined compartment.
  description: >-
    Localise the mouse orthologue in retina sections with cell-type and organelle markers
    (antibody or knock-in tag), determine topology by protease protection, and examine
    retinal structure and function in a knockout.
