id: Q5STR5
gene_symbol: SMIM40
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  SMIM40 (small integral membrane protein 40) is a 79-amino-acid (about 9 kDa) protein
  encoded on chromosome 6p21.32, in the extended MHC region immediately upstream of DAXX. It
  has a single predicted helical transmembrane segment (residues 35-55), flanked by an
  acidic N-terminal segment and a short acidic C-terminal tail. It defines its own small
  protein family (Pfam SMIM40), with no recognised relationship to characterised proteins.
  Orthologues are found only in therian mammals, including marsupials and rodents. The
  protein has been detected by mass spectrometry in a large-scale liver proteome study, and
  its RNA is enriched in retina. Its membrane localisation is predicted from sequence; the
  specific membrane, topology, partners and biological role are unknown, and no functional
  study of SMIM40 has been published.
