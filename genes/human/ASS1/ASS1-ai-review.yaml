- term:
    id: GO:0006533
    label: L-aspartate catabolic process
  evidence_type: IMP
  original_reference_id: PMID:7977368
  qualifier: involved_in
  review:
    action: ACCEPT
    summary: ASS1 catalyzes conversion of its amino-acid substrates in the argininosuccinate pathway.
    reason: 'ASS1 catalyzes the argininosuccinate-forming step of the ASS1–ASL pathway: aspartate
      carbon proceeds to fumarate through ASL, its nitrogen enters the urea-cycle route, and citrulline
      is converted through argininosuccinate into arginine. This established metabolic route supports
      retention of the existing curator-assigned catabolic process term. It is not a general inference
      that any substrate consumption proves catabolism. PMID7977368 supplies human genetic evidence;
      direct substrate and catalytic evidence comes from independent human structural/kinetic studies.
      No new catabolic term or duplicate core is proposed.'
    supported_by:
    - reference_id: PMID:7977368
      full_text_unavailable: true
    - reference_id: PMID:18323623
      full_text_unavailable: true
    - reference_id: PMID:27287393
      full_text_unavailable: true
