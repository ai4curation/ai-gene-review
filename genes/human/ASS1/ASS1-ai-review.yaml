- term:
    id: GO:0015643
    label: toxic substance binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: enables
  review:
    action: KEEP_AS_NON_CORE
    summary: Fumonisin B1 affinity capture and inhibition support a limited in-vitro interaction.
    reason: Rat liver ASS was affinity-captured on immobilized fumonisin B1, and recombinant
