      carbon proceeds to fumarate through ASL, its nitrogen enters the urea-cycle route, and
      citrulline is converted through argininosuccinate into arginine. This established metabolic
      route supports retention of the existing curator-assigned catabolic process term. It
      is not a general inference that any substrate consumption proves catabolism. PMID:7977368
      supplies human genetic evidence; direct substrate and catalytic evidence comes from
      independent human structural/kinetic studies. No new catabolic term or duplicate core
      is proposed.'
