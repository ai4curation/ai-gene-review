id: P00966
gene_symbol: ASS1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ASS1 encodes argininosuccinate synthase, a predominantly cytosolic homotetrameric
  ligase that catalyzes the ATP-dependent condensation of L-citrulline and L-aspartate to
  form argininosuccinate, AMP and diphosphate. Argininosuccinate is then cleaved by ASL to
  produce arginine and fumarate. ASS1 therefore directly supports hepatic nitrogen disposal
  through the urea cycle and L-arginine synthesis in other tissues. In endothelial cells,
  regeneration of arginine from citrulline supports nitric oxide production by nitric oxide
  synthase. ASS1 activity can be regulated by protein interactions and acetylation, including
  CLOCK-dependent modification associated with circadian ureagenesis. Peripheral mitochondrial
  association has been reported in rodent tissues, and nuclear localization has been demonstrated
  in particular human cell contexts. Pathogenic ASS1 variants cause autosomal recessive citrullinemia
  type I.
