id: Q96Q83
gene_symbol: ALKBH3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ALKBH3 (AlkB homolog 3, also ABH3 or DEPC1) is an Fe(II)- and 2-oxoglutarate-dependent dioxygenase
  of the AlkB family that directly reverses alkylation damage to nucleic acids. It oxidizes the methyl
  groups of 1-methyladenine and 3-methylcytosine, releasing them as formaldehyde and regenerating the
  normal base, and it prefers single-stranded DNA and RNA. In the nucleus it works with the ASCC complex,
  whose ASCC3 helicase unwinds DNA to expose lesions for ALKBH3, and some tumor cell lines depend on this
  pathway for resistance to alkylating agents. Unlike ALKBH2, ALKBH3 also repairs methylated RNA and removes
  N1-methyladenosine from mRNA and tRNA, making it one of the erasers of this modification. It is found
  in both nucleus and cytoplasm and is overexpressed in several cancers.
