    id: GO:2000766
    label: negative regulation of cytoplasmic translation
  evidence_type: IDA
  original_reference_id: PMID:26863196
  qualifier: involved_in
  review:
    summary: 'Negative regulation of cytoplasmic translation, from the m1A methylome study: m1A correlates
      with higher translation and ALKBH3 removes it. Indirect; kept as non-core.'
    action: KEEP_AS_NON_CORE
    reason: The study links m1A to translation [PMID:26863196 "strongly indicating a functional role for
      m(1)A in promoting translation of me"] and shows ALKBH3 lowers mRNA m1A [PMID:26863196 "overexpression
      of wild-type ALKBH3, but not of an inactive mutant, reduced m1A levels in mRNA"]. The effect on
      translation is inferred from the correlation and from ALKBH3's activity on the mark, rather than
      measured as a direct consequence of ALKBH3, so it is kept as non-core.
    supported_by:
    - reference_id: PMID:26863196
