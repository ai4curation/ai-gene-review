  review:
    summary: Binding to ASCC3, the helicase subunit of the ASCC complex with which ALKBH3 co-purifies.
      Modified to protein-containing complex binding.
    action: MODIFY
    reason: 'The paper purifies ALKBH3 with the whole ASCC complex [PMID:22055184 "We report the purification
      of the ALKBH3 complex and demonstrate its association with the activating signal cointegrator complex
      (ASCC)."] and shows the two act together: the ASCC3 helicase generates the single-stranded DNA that
      ALKBH3 repairs [PMID:22055184 "ASCC3, the largest subunit of ASCC, encodes a 3''-5'' DNA helicase,
      whose activity is crucial for the generation of single-stranded DNA upon which ALKBH3 preferentially
      functions for dealkylation."]. The informative statement is association with the ASCC complex, GO:0044877
      protein-containing complex binding. Per the project''s GO:0005515 policy the generic term is replaced
      by an informative one where the evidence supports it, and removed otherwise; removal is not a claim
      that the interaction is false.'
    supported_by:
    - reference_id: PMID:22055184
      supporting_text: We report the purification of the ALKBH3 complex and demonstrate its association
        with the activating signal cointegrator complex (ASCC).
    - reference_id: PMID:22055184
      supporting_text: ASCC3, the largest subunit of ASCC, encodes a 3'-5' DNA helicase, whose activity
        is crucial for the generation of single-stranded DNA upon which ALKBH3 preferentially functions
        for dealkylation.
    proposed_replacement_terms:
    - id: GO:0044877
      label: protein-containing complex binding
