suggested_questions:
- question: Which original constructs and pair-level assays establish the ANOS1–NCALD and ANOS1–UBQLN1
    HuRI interactions, and do they support a specific molecular role?
- question: Does anosmin-1 inhibit any defined peptidase under physiological conditions, or is the WAP-domain
    inhibitor mapping overbroad?
- question: Does the uPA-activating biochemical activity generalize to endogenous human anosmin-1 in a
    physiological setting, and which molecular contacts mediate it?
