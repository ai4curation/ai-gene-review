  review:
    action: MODIFY
    summary: Direct FGFR1 binding refines the generic interaction annotation.
    reason: The original study directly measures FGFR1 binding and identifies the receptor ectodomain
      interface. Type 1 fibroblast growth factor receptor binding captures this molecular interaction.
      ANOS1 modulates FGF2/FGFR1/heparin assembly in an order-dependent manner; binding does not establish
      an independently sufficient receptor agonist or a general interaction with every FGFR.
    supported_by:
