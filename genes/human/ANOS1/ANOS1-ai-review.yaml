- term:
    id: GO:0030414
    label: peptidase inhibitor activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR008197
  review:
    action: UNDECIDED
    summary: WAP-domain membership alone does not resolve peptidase inhibition.
    reason: The IEA is transferred through InterPro:IPR008197. WAP proteins are functionally diverse,
      and PMID:15324302 reports uPA activation with no detected change in the tested thrombin assay. Those
      results challenge an automatic inhibitor assignment but do not exclude inhibition of every peptidase.
      The relevant molecular specificity remains uncertain; no universal NOT or confident loss-of-function
      claim follows from two tested enzymes.
    supported_by:
    - reference_id: PMID:15324302
      supporting_text: 'Anosmin-1

        significantly enhances the amidolytic activity of uPA in vitro'
    - *id001
