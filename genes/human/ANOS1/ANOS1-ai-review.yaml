taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Anosmin-1 is a secreted extracellular glycoprotein containing a cysteine-rich region, a WAP
  domain and four fibronectin type III domains. It associates with cell-surface glycosaminoglycans and
  extracellular matrix, binds FGFR1, and modulates assembly and activity of FGF receptor signaling complexes.
  These interactions contribute to cell adhesion, neuronal differentiation and context-dependent neuronal
  migration and axon guidance during olfactory-system development. Loss of ANOS1 function causes the X-linked
  form of Kallmann syndrome.
