  review:
    summary: >-
      NAS annotation of calcium-dependent protein serine/threonine phosphatase activity, citing an RT-PCR
      survey of CaMKII splice variants in tumour cells.
    action: REMOVE
    reason: >-
      CAMK2G is a protein kinase, not a phosphatase. The cited paper (abstract only) describes CaMKII
      as the multifunctional Ca2+/CaM-dependent protein kinase and reports only the identification of
      splice variants by RT-PCR; it contains no phosphatase assay. The phosphatase term is contradicted
      by the protein's domain architecture (Pkinase domain, no phosphatase domain) and is most likely
      a term-selection error (kinase vs phosphatase). The calcium-dependent phosphatase of this signalling
      system is calcineurin.
