- term:
    id: GO:0005516
    label: calmodulin binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - MGI:MGI:88256
  - PANTHER:PTN002389359
  - UniProtKB:Q13557
  - UniProtKB:Q9UQM7
  review:
    summary: Calmodulin binding by IBA from the CaMKII clade.
    action: ACCEPT
    reason: >-
      Calmodulin binding is intrinsic to CaMKII activation and, for the gamma isoform, is a function in
      its own right. Gamma has the highest Ca2+/CaM affinity of the four paralogs, and in neurons gamma-CaMKII
      acts as a carrier that sequesters Ca2+/CaM and shuttles it to the nucleus, a role that does not
      need its kinase activity. Accepted as core for CAMK2G (whereas for CAMK2A it is kept as non-core),
      because the gamma paralog-specific CaM-shuttle role makes CaM binding a direct functional output
      here.
    supported_by:
    - reference_id: PMID:14722083
      supporting_text: the rank order of CaM binding affinity (gamma > beta > delta > alpha)
    - reference_id: PMID:25303525
      supporting_text: >-
        We show that the shuttle protein is γCaMKII, its phosphorylation at Thr287 by βCaMKII protects
        the Ca(2+)/CaM signal, and CaN triggers its nuclear translocation.
