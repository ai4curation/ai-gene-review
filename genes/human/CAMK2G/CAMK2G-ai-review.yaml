id: Q13555
gene_symbol: CAMK2G
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  CAMK2G encodes the gamma subunit of calcium/calmodulin-dependent protein kinase II (CaMKII), a serine/threonine
  kinase built from an N-terminal kinase domain, an autoinhibitory Ca2+/calmodulin-binding regulatory
  segment, a variable linker and a C-terminal association domain that assembles twelve subunits into a
  homo- or heteromeric holoenzyme with the alpha, beta and delta paralogs. Ca2+/calmodulin binding relieves
  autoinhibition and allows Thr287 autophosphorylation, which makes the kinase Ca2+-independent. Unlike
  the neuron-specific alpha and beta isoforms, gamma is widely expressed, including in skeletal muscle
  and pancreatic islets, and it binds calmodulin with the highest affinity of the four paralogs. In the
  developing brain it is the dominant hippocampal isoform and regulates neurite outgrowth and neuronal
  maturation; in neurons gamma-CaMKII also acts as a carrier that sequesters Ca2+/calmodulin and shuttles
  it to the nucleus to drive CREB-dependent transcription needed for persistent synaptic plasticity and
  memory. Nucleus-targeted splice isoforms carry a nuclear localization signal. With the delta isoform
  it binds the STAT1 transcription activation domain and phosphorylates STAT1 Ser727 during interferon-gamma
  signalling. In skeletal muscle it associates with the sarcoplasmic reticulum and contributes to Ca2+
  handling. The de novo gain-of-function variant p.Arg292Pro causes severe intellectual disability.
