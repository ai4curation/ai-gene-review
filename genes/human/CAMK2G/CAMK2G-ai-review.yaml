        to interferon-gamma), the calcium/calmodulin-dependent protein kinase activity that phosphorylates
        STAT1 (activity 62b4ffe300004580, evidence PMID:11972023) is enabled_by CAMK2A (UniProtKB:Q9UQM7).
        PMID:11972023 identifies the STAT1-binding kinase as CaMKII gamma by mass spectrometry and
        concludes that the ubiquitous gamma/delta isoforms, not the brain alpha/beta isoforms, interact
        with STAT1. The node should be enabled by CAMK2G (UniProtKB:Q13555), possibly with a second
