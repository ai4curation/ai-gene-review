  review:
    summary: Endoplasmic reticulum membrane by IEA from an ARBA rule.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      There is no direct evidence that CAMK2G is an ER-membrane protein in non-muscle cells. It has no
      transmembrane segment. UniProt places it on the cytoplasmic side of the sarcoplasmic reticulum membrane
      by curator inference only, a muscle-specific peripheral association. The ARBA rule generalizes this
      to the ER membrane, which overstates what is known. The sarcoplasmic reticulum row is the appropriate
      one and is kept separately.
