        UniProt NAS row for CAMK2G (Q13555) with GO:0004723 calcium-dependent protein serine/threonine
        phosphatase activity, citing PMID:9060999, an RT-PCR survey of CaMKII splice variants. The paper
        describes CaMKII as a Ca2+/calmodulin-dependent protein kinase and has no phosphatase data; the
        protein has a Pkinase domain and no phosphatase domain. The intended term is probably GO:0004683
