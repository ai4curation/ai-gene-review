      resource: UNIPROT
      slot: GO_ID
      requested_change: REPOINT
      asserted_value: GO:0004723
      corrected_value: GO:0004683
      corrected_label: calcium/calmodulin-dependent protein kinase activity
      cause: OTHER
      confidence: PROBABLE
