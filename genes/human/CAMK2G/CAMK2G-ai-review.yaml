- term:
    id: GO:0019722
    label: calcium-mediated signaling
  evidence_type: ISS
  original_reference_id: PMID:25303525
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P11730
  - UniProtKB:Q923T9
  review:
    summary: >-
      In rodent neurons gamma-CaMKII sequesters Ca2+/calmodulin near CaV1 channels and shuttles it to
      the nucleus, where it activates CaMKK/CaMKIV and CREB-dependent transcription; loss of gamma-CaMKII
      abolishes this cytonuclear signalling and impairs memory. The p.Arg292Pro intellectual-disability
      variant selectively disrupts CaM sequestration and shuttling.
    action: NEW
    reason: >-
      Participation: gamma-CaMKII carries the Ca2+/CaM second-messenger complex from the membrane to the
      nucleus, which is a step of the signal relay itself (a carrier function, independent of its kinase
      activity), not a downstream dependency. No existing row captures this paralog-specific role. Evidence
      is from rodent neurons (ISS to human from rat Camk2g UniProtKB:P11730 and mouse Camk2g UniProtKB:Q923T9,
      the knockout in PMID:29934532), and the human relevance is supported by the ID variant that
      disrupts shuttling.
    supported_by:
    - reference_id: PMID:25303525
      supporting_text: >-
        We show that the shuttle protein is γCaMKII, its phosphorylation at Thr287 by βCaMKII protects
        the Ca(2+)/CaM signal, and CaN triggers its nuclear translocation.
    - reference_id: PMID:29934532
      supporting_text: >-
        Among cytonuclear signaling proteins, γCaMKII stands out in its ability to rapidly shuttle Ca2+/CaM
        to the nucleus and thus activate CREB-dependent transcription.
