  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-5082387
  qualifier: located_in
  review:
    summary: >-
      Nucleoplasm by Reactome TAS, from the reaction in which CaMKII phosphorylates HSF1 Ser230.
    action: KEEP_AS_NON_CORE
    reason: >-
      The Reactome reaction is family-level (CaMKII) and the HSF1 evidence is in vitro. Independently,
      however, CAMK2G has nucleus-targeted splice isoforms carrying a nuclear localization signal, gamma-CaMKII
      is found in nuclear fractions, and in neurons it translocates to the nucleus carrying Ca2+/CaM.
