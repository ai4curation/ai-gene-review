suggested_questions:
- question: >-
    Should the GO-CAM for calmodulin regulation of interferon-gamma JAK-STAT signalling (gomodel:62b4ffe300004489),
    whose basis paper identifies CaMKII gamma/delta as the STAT1 kinases, have its kinase node enabled
    by CAMK2G/CAMK2D rather than CAMK2A?
- question: >-
    Is there a GO molecular function term for a protein that carries a second-messenger complex (Ca2+/calmodulin)
    between compartments, as gamma-CaMKII does, beyond the generic calmodulin binding?
suggested_experiments:
- description: >-
    Use CAMK2G knockout or kinase-dead knock-in human cells (e.g. HeLa or fibroblasts), with and without
    CAMK2D loss, to test whether the endogenous gamma isoform is required for interferon-gamma-induced
    STAT1 Ser727 phosphorylation and interferon-stimulated gene expression.
