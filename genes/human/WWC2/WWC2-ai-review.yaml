- id: PMID:24682284
  title: Evolutionary and molecular facts link the WWC protein family to Hippo signaling.
  findings:
  - statement: WWC-family proteins, including WWC2, dimerize, share binding partners
      and repress YAP-dependent proliferation and organ-growth outputs.
    supporting_text: the highly conserved WWC proteins share a similar primary
      structure, the ability to form homo- and heterodimers and the interaction
      with a common set of binding proteins
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract supports the WWC-family YAP repression, dimerization
      and shared-interactor claims; UniProt records the exact WWC2 LATS1/2 and
      PRKCZ interactions from this paper.
- id: PMID:35271311
  title: 'OpenCell: Endogenous tagging for the cartography of human cellular organization.'
  findings: []
- id: PMID:35429439
  title: WWC proteins mediate LATS1/2 activation by Hippo kinases and imply a tumor
    suppression strategy.
  findings:
  - statement: WWC1/2/3 organize SAV1/MST1/2 with LATS1/2 to mediate LATS1/2
      activation.
    supporting_text: WWC proteins (WWC1/2/3) directly interact with LATS1/2 and
      SAV1, and SAV1, in turn, brings in MST1/2 to phosphorylate and activate
      LATS1/2.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Central support for WWC2 signaling-adaptor activity in the Hippo
      LATS activation module. The cached record is abstract-only but the abstract
      directly states the WWC1/2/3-SAV-LATS organizer mechanism used here.
