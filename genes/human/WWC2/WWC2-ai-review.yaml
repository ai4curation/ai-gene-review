suggested_questions:
- question: Which WWC2 outputs are isoform-specific rather than shared
    redundantly with WWC1/KIBRA and WWC3?
- question: Do the reported WWC2-DLC1 and WWC2-PRKCZ interactions drive a native
    pathway branch independent of the SAV/MST/LATS Hippo module?
suggested_experiments:
- description: Reconstitute purified WWC2, SAV1, MST1/2 and LATS1/2 variants to
    map which WWC2 regions are necessary and sufficient for SAV/LATS bridging and
    kinase activation.
- description: Use endogenous WWC1/WWC2/WWC3 knockouts and single-gene rescue in
    contact-inhibited epithelial cells to separate redundant pan-WWC effects from
    WWC2-specific control of LATS and YAP/TAZ phosphorylation.
