id: Q6AWC2
gene_symbol: WWC2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: WWC2 is a cytosolic WW- and C2-domain scaffold of the WWC/KIBRA
  family that assembles Hippo pathway signaling complexes. Through direct WWC-family
  interactions with LATS1/2 and SAV1 it helps organize MST-dependent LATS1/2
  activation, promoting downstream YAP/TAZ phosphorylation and restraint of
  YAP-driven transcriptional growth programs.
