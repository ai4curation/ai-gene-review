    label: molecular_function
  evidence_type: ND
  original_reference_id: GO_REF:0000015
  qualifier: enables
  review:
    summary: BBS9 provides an integral scaffold within the BBSome.
    action: MODIFY
    reason: An uncharacterized molecular-function root is no longer the best description.
      PMID:22500027 identifies BBS9 as a central scaffold through multiple subunit contacts, and
      BBS9 knockdown reduces incorporation of BBS1, BBS4 and BBS8 into the BBS2-containing complex.
      PMID:22072986 independently shows BBSome disintegration after BBS9 depletion. The specific
      scaffold term describes an integral complex component that holds the complex together;
      molecular function is not restricted to catalysis.
    additional_reference_ids:
    - PMID:22500027
    - PMID:22072986
    proposed_replacement_terms:
    - id: GO:0140378
      label: protein complex scaffold activity
    supported_by:
    - reference_id: PMID:22500027
    - reference_id: PMID:22072986
