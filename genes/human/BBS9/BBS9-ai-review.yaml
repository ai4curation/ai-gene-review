    label: cilium assembly
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:2442833
  - PANTHER:PTN000470005
  - UniProtKB:Q381Z0
  - ZFIN:ZDB-GENE-081027-4
  review:
    summary: BBS9 contributes to cilium assembly in the tested biological contexts.
    action: ACCEPT
    reason: Retain the existing cilium-assembly process. PMID:22479622 reports that Bbs9 shRNA in
      mouse IMCD3 cells increases the number of unciliated cells and shortens residual cilia, while
      zebrafish bbs9 morpholino perturbation reduces Kupffer-vesicle cilia number and length. The
      paper discusses a weaker effect in earlier RPE-cell assays, so these results support a conserved,
      context-dependent contribution without establishing universal necessity for initiation of every
      primary cilium. Human wild-type mRNA rescues the measured zebrafish eye phenotype; this is
      not a direct human-cell ciliogenesis assay.
    additional_reference_ids:
    - PMID:22479622
