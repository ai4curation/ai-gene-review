id: Q3SYG4
gene_symbol: BBS9
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: BBS9 is an integral subunit of the BBSome, an eight-protein complex that contributes
  to membrane-protein trafficking at cilia. It provides multiple contacts with other BBSome subunits
  and helps organize assembly of the complex. Its N-terminal region forms a beta-propeller, while
  other regions participate in subunit association. BBS9 occurs in cytoplasmic and ciliary compartments,
  including the ciliary base and centriolar satellites. Loss of BBS9 can disrupt BBSome organization
  and ciliary assembly or trafficking in a manner that depends on the cell and organism studied.
  Biallelic pathogenic variants cause Bardet-Biedl syndrome, with features that can include retinal
  degeneration, obesity, polydactyly and renal abnormalities.
