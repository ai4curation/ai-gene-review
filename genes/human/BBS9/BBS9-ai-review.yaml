suggested_questions:
- question: Which BBS9 interfaces control stable BBSome assembly, and which can affect cargo transport
    while preserving complex integrity?
- question: How does BBS9 influence the centriolar-satellite pool of CEP290 while its transition-zone
    localization remains detectable in the tested cells?
- question: Do the alternative BBS9 products have distinct subunit contacts or ciliary distributions
    under physiological expression conditions?
- question: What experimental donor evidence, beyond an adipogenic expression timecourse, supports
    a role for Bbs9 in adipocyte differentiation?
suggested_experiments:
- description: Compare BBS9 interface variants at matched expression levels, measuring pairwise subunit
    association, complete BBSome assembly, ciliary entry and individual cargo distributions separately.
    Include variants that preserve overall folding to distinguish interface defects from loss of
    protein stability.
  hypothesis: Different BBS9 interfaces make separable contributions to assembly and transport, while
    destabilizing variants affect both.
  experiment_type: controlled biochemical and cell-based structure-function analysis
