core_functions:
- description: 'Provides an integral scaffold for BBSome organization through multiple subunit contacts.
    Pairwise association and assembly experiments support contacts with BBS1, BBS2, BBS5 and TTC8/BBS8.
    BBS9 joins the BBS2-BBS7 assembly intermediate through BBS2; reducing BBS9 impairs incorporation of
    additional subunits into the complex. This organizing activity contributes to protein localization
    to cilia: human-cell depletion disrupts BBSome assembly and ciliary entry. The complex associates
    with the ciliary membrane, and BBS9 localization to cilia is reported in human hTERT-RPE1 cells. BBS9
    also contributes to cilium assembly in the tested mouse IMCD3 and zebrafish contexts; the magnitude
    depends on cell and organism, without establishing universal human-cell necessity. The CEP290 study
    separately shows loss of its centriolar-satellite pool after BBS9 depletion while transition-zone
    localization remains. These roles do not imply autonomous recognition of every ciliary cargo.'
