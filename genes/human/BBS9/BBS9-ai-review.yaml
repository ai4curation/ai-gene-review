  review:
    summary: The BBS9–BBS5 association supports its BBSome scaffold role.
    action: MODIFY
    reason: The founding BBSome purification study attributes an association with BBS5. Independent
      assembly experiments in PMID:22500027 identify BBS9 contacts with BBS1, BBS2, BBS5 and BBS8
      and show loss of downstream complex incorporation after BBS9 depletion. These contacts implement
      BBS9's integral scaffold role, a more informative function than generic binding. This refinement
      uses the independent mechanistic evidence rather than claiming that the original screening
      experiment alone proves scaffolding or direct endogenous affinity.
    additional_reference_ids:
    - PMID:22500027
    - PMID:22072986
