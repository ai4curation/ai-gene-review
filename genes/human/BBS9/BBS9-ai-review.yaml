  review:
    summary: The source attributes a BBS9-BBS1 association compatible with BBSome co-complex
      membership.
    action: KEEP_AS_NON_CORE
    reason: Retain the curator-attributed interaction with BBS1 (Q8NFJ9). The paper maps ciliary
      protein complexes using tandem affinity purification and mass spectrometry of tagged proteins
      in HEK293T cells. Its Methods establish the assay class, but the exact BBS9 supplementary
      bait/prey record was not independently re-examined. Co-complex recovery is compatible with
      this source assertion without demonstrating a binary contact or the organizing activity of
      BBS9 in that experiment. Targeted assembly studies support the separate scaffold core; they do
      not turn this screening record into a mechanistic scaffold assay. The supported association
      remains non-core under the supplied ActionEnum, not rejected solely for generic-term
      informativeness.
    supported_by:
    - reference_id: PMID:27173435
