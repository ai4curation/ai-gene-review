- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:14961121
  qualifier: enables
  supporting_entities:
  - UniProtKB:O43508
  review:
    summary: The best-supported interaction AGGF1 has - three orthogonal assays in the original paper
      and an independent co-IP in human endothelial cells 21 years later - and the least informative term
      available for it.
    action: MODIFY
    reason: 'TNFSF12/TWEAK was pulled out of a yeast two-hybrid screen with AGGF1 as bait, then confirmed
      by GST pull-down with recombinant proteins and by co-immunoprecipitation from cells, and the two
      proteins co-localise in HUVECs. It is the only AGGF1 partner in GOA with orthogonal in vitro and
      in vivo support, and notably it is absent from IntAct entirely - all 742 IntAct records for Q8N302
      come from high-throughput screens, none of which found it. It was independently re-confirmed by
      co-immunoprecipitation in human retinal microvascular endothelial cells in PMID:39905000. Bare protein
      binding states none of this. TWEAK is a secreted cytokine, and AGGF1 is a secreted protein that
      acts on endothelium in what the discovery paper proposed to be an autocrine fashion, so GO:0019955
      cytokine binding captures the relationship and is definitionally correct. GO:0043120 tumor necrosis
      factor binding was considered and rejected on its definition, which names TNF specifically as a
      proinflammatory cytokine produced by monocytes and macrophages - that does not cover TNFSF12 - even
      though GO itself places GO:0038057 TNFSF11 binding beneath it. That inconsistency is raised separately
      in suggested_questions, together with a proposal for the missing TNFSF12 binding term. GO:0019955
      is also defensible by usage and not only by its definition: asking each of the 92 human holders
      whether its own record carries GO:0038023 signaling receptor activity gave 83 receptors and 9 non-receptors,
      and among the non-receptors is BGN (biglycan) - a secreted extracellular proteoglycan that binds
      secreted cytokines, which is the same situation as AGGF1 and TNFSF12.'
    proposed_replacement_terms:
    - id: GO:0019955
      label: cytokine binding
    supported_by:
    - reference_id: PMID:14961121
      supporting_text: 'We also demonstrate a direct interaction of VG5Q with another secreted

        angiogenic factor, TWEAK (also known as TNFSF12).'
    - reference_id: PMID:39905000
      supporting_text: AGGF1 (V5GQ) is known to promote angiogenesis by interacting with TNFSF12 (TWEAK)
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:16189514
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q9UL45
  review:
    summary: A real two-method interaction with BLOC1S6, but with no functional follow-up in twenty years
      and no shared biology to point at. Kept as uninformative rather than refuted.
    action: KEEP_AS_NON_CORE
    reason: 'Q9UL45 resolves to reviewed canonical BLOC1S6 (pallidin, 172 aa), a BLOC-1 subunit involved
      in biogenesis of lysosome-related organelles - no published connection to AGGF1''s vascular or nuclear
      biology. The evidence is better than a single screen: one Rual CCSB-HI1 yeast two-hybrid hit here
      plus an anti-tag co-immunoprecipitation in human HEK293T cells from BioPlex (PMID:33961781, the
      second GOA row for this partner), i.e. two independent methods. That is enough not to call it over-annotation,
      and not enough to say anything more specific than protein binding. Both proteins carry coiled-coil
      regions - AGGF1 at residues 18-88 - which is the commonest route to a reproducible but physiologically
      inert two-hybrid pair, so the interaction is recorded without being promoted.'
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:31515488
  qualifier: enables
