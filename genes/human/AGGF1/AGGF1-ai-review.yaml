- description: Acts outside the cell as a secreted ligand for integrin alpha5beta1 on endothelium. AGGF1
    is cytoplasmic in resting microvascular endothelial cells and is released, by a non-classical route
    since it has no signal peptide, when capillary tube formation begins. Extracellular AGGF1 binds integrin
    alpha5, supports endothelial cell adhesion, and activates FAK, Src and AKT to drive proliferation,
    migration, autophagy and capillary tube formation; purified protein induces new vessels in the chick
    chorioallantoic membrane as potently as VEGF. The activity maps to a short RDD-containing motif at
    residues 604-613 that lies outside both of the domains the gene is named for. AGGF1 also binds the
    secreted cytokine TNFSF12/TWEAK, the partner found in the original two-hybrid screen and re-confirmed
    by co-immunoprecipitation in human retinal endothelial cells two decades later.
