  review:
    summary: One two-hybrid screen, but a nuclear partner that coheres with the nuclear biology the rest
      of this gene's GO record omits. Kept, not promoted.
    action: KEEP_AS_NON_CORE
    reason: 'Q96EZ8 is reviewed canonical MCRS1 (462 aa), a nucleoplasmic and nucleolar protein and a
      component of the NSL and INO80 complexes - and, like AGGF1, an FHA-domain protein (its FHA sits
      at 363-419). The evidence is thin: three IntAct records, all sub-methods of the single HuRI screen,
      no orthogonal assay, no functional follow-up. It is kept rather than marked over-annotated for a
      reason that matters beyond this row. Three of the four partners HuRI found for AGGF1 - DHX15, MCRS1
      and FBXO28 - carry GO:0005634 nucleus with experimental evidence (EXP or IDA), on a gene whose entire
      GOA localisation record is cytoplasm plus extracellular region. The fourth, MAB21L3, has no cellular-component
      annotation in GOA at all and no SUBCELLULAR LOCATION comment in UniProt, so it neither supports
      nor weakens the point. The interaction evidence in AGGF1''s own GO record already points at a compartment
      its localisation rows do not mention, which is corroborating context rather than noise.'
