    action: KEEP_AS_NON_CORE
    reason: 'Q8N8X9 is reviewed canonical MAB21L3 (362 aa), a mab-21-like protein with no FUNCTION comment
      in UniProt at all - an uncharacterised member of a nucleotidyltransferase-fold family. AGGF1-MAB21L3
      appears in five IntAct records across three publications, but those collapse to two independent
      experiments: the CCSB two-hybrid pipeline (this row and PMID:32296183, logged as array plus prey-pooling
      plus validated two hybrid, which is one screen counted three ways) and an anti-tag co-immunoprecipitation
      in human U2OS cells from PMID:40205054. Two methods make it a genuine interaction; an uncharacterised
      partner makes it uninformative. No more specific term is available, and inventing a functional interpretation
      for a partner nobody has characterised would be the error this review is trying to avoid elsewhere.'
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:32296183
  qualifier: enables
  supporting_entities:
  - UniProtKB:O43143
  review:
    summary: The single most mechanistically predicted partner a G-patch protein can have, sitting under
      the least informative term in the ontology. The evidence is one two-hybrid screen, so the term is
      refined without asserting any activity.
    action: MODIFY
    reason: 'O43143 is reviewed canonical DHX15 (795 aa), the DEAH-box RNA helicase that is the archetypal
      client of G-patch cofactors: the crystal structure of DHX15 bound to the NKRF G-patch shows the
      motif tethering the helicase''s C-terminal domains to its catalytic core and increasing its RNA
      affinity, helicase and ATPase activity (PMID:32179686). AGGF1 has an intact G-patch - 8 of 8 panel-conserved
      columns retained, every one identical to the corresponding NKRF residue - so of all the high-throughput
      partners in this gene''s record, this is the one with a prior. The evidence, however, is a single
      HuRI yeast two-hybrid experiment: all three IntAct records for this pair come from PMID:32296183
      and are the sub-methods two hybrid array, two hybrid prey pooling approach and validated two hybrid
      of one screen. MODIFY to GO:0017151 DEAD/H-box RNA helicase binding therefore restates the measured
      fact more informatively and adds nothing: it says AGGF1 binds a DEAH-box helicase, which is what
      was observed, and specifically does not say that AGGF1 activates it. A peer-reviewed 2026 survey
      of the family still lists AGGF1''s interacting helicase as unknown (PMID:42052570). Whether the
      G-patch functions as a DHX15 activator is filed as a suggested experiment, not annotated. On the
      term itself: DHX15 is a DEAH-box rather than a DEAD-box helicase, but GO has no DEAH-specific binding
      term at all - an ontology search for DEAH returns zero terms, and GO:0017151 has no comment, no
      synonyms and no children - so it is the only term available for this superfamily. Its ten human
      annotations name four partners: DDX5, and via POT1 the RecQ DNA helicases BLM and WRN, so GO already
      applies it well outside a strict DEAD-box reading.'
    proposed_replacement_terms:
    - id: GO:0017151
      label: DEAD/H-box RNA helicase binding
    supported_by:
    - reference_id: PMID:32179686
      supporting_text: ATPase activity of DHX15 are increased when G-patch is bound.
    - reference_id: file:human/AGGF1/AGGF1-bioinformatics/RESULTS.md
      supporting_text: '| **O43143 DHX15** | 3 | **1** — HuRI Y2H (PMID:32296183) as array + prey-pooling
        + "validated two hybrid" |'
