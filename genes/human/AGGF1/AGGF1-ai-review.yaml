- id: PMID:18564129
  title: Identification of association of common AGGF1 variants with susceptibility for Klippel-Trenaunay
    syndrome using the structure association program.
  findings:
  - statement: The originating laboratory's own follow-up, which concedes that the AGGF1-Klippel-Trenaunay
      relationship was not firmly established and moves to two different tagSNPs.
    supporting_text: previously identified as a candidate susceptibility gene for KTS, but further
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Author overlap with PMID:14961121 (Wang, Timur, Driscoll), which is what makes it the
      strongest item in the E133K story. The cached record is abstract-only; the paper's Discussion reportedly
      gives P = 0.59 for E133K between 163 cases and 465 controls, but that sentence is not in the cached
      text and is therefore not quoted here.
- id: PMID:23197652
  title: Functional characterization of Klippel-Trenaunay syndrome gene AGGF1 identifies a novel angiogenic
    signaling pathway for specification of vein differentiation and angiogenesis during embryogenesis.
  findings:
  - statement: Zebrafish aggf1 knockdown causes defective vasculogenesis and angiogenesis and loss of
      venous identity markers; constitutively active AKT rescues it. This is the source of the zebrafish
      orthologue's own GO:0001525 IMP, which is what the human IBA row propagates from.
    supporting_text: 'Overexpression of AGGF1 led to increased angiogenesis and

      increased lumen diameter of veins, whereas knockdown of AGGF1 expression

      resulted in defective vasculogenesis and angiogenesis.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Verified as the donor evidence behind the GO:0001525 IBA by querying QuickGO for ZFIN:ZDB-GENE-060929-836.
      The work is in zebrafish, so it supports the IBA but would be ISO, not IMP, if transferred to human
      directly.
- id: PMID:24277077
  title: Aggf1 acts at the top of the genetic regulatory hierarchy in specification of hemangioblasts
    in zebrafish.
  findings:
  - statement: Zebrafish aggf1 acts upstream of scl, fli1 and etsrp in hemangioblast specification. Cited
      as corroboration for the vasculogenesis row, not as its evidence; no supporting_text is taken from
      it.
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: Zebrafish work, cited only in prose as supporting context for the GO:0001570 row. No
      annotation rests on it and no quote is taken from it.
- id: PMID:27513923
  title: Angiogenic Factor AGGF1 Activates Autophagy with an Essential Role in Therapeutic Angiogenesis
    for Heart Disease.
  findings:
  - statement: Purified AGGF1 induces autophagy in HUVECs dose-dependently, shown by LC3-II and p62 western
      blot, GFP-LC3 puncta and electron microscopy.
    supporting_text: (A) Western blot analysis showing that AGGF1 at different concentrations induces
      autophagy (increased LC3-II/β-actin and LC3-II/I; decreased p62 expression) in HUVECs under a normoxic
      condition for 4 h (n = 3/group).
  - statement: 'Autophagy is required for every angiogenic behaviour AGGF1 drives: both pharmacological
      inhibition and ATG5 knockdown abolish AGGF1-induced proliferation, migration, tube formation and
      aortic-ring sprouting.'
    supporting_text: These data suggest that autophagy is required for AGGF1-mediated angiogenesis.
  - statement: AGGF1 treatment significantly induces HUVEC migration in scratch and Transwell assays.
    supporting_text: Wound-healing scratch assays for migration showed that AGGF1 treatment significantly
      induced HUVEC migration, but this effect was blocked by Baf or CQ (Fig 2B).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached and quotes verified. Produced no GO annotation on any gene product;
      two NEW rows in this review come from it.
- id: PMID:27522498
  title: Haploinsufficiency of Klippel-Trenaunay syndrome gene Aggf1 inhibits developmental and pathological
    angiogenesis by inactivating PI3K and AKT and disrupts vascular integrity by activating VE-cadherin.
  findings:
  - statement: Cited in prose only, as corroboration that AGGF1 activates PI3K p110alpha and p85alpha
      leading to AKT, GSK3beta and p70S6K activation. No annotation rests on it and no quote is taken
      from it.
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: Cited in prose only; no supporting_text is taken from this reference and no row depends
      on it.
- id: PMID:32179686
  title: Structural basis for DEAH-helicase activation by G-patch proteins.
  findings:
  - statement: The crystal structure of human DHX15 bound to the NKRF G-patch shows the motif running
      in an extended conformation across the helicase surface and tethering the catalytic core to the
      flexibly attached C-terminal domains.
    supporting_text: conformation across the helicase surface. It tethers the catalytic core to the
  - statement: G-patch binding increases DHX15's RNA affinity, helicase activity and ATPase activity -
      i.e. the domain is a helicase-activation module, not an autonomous nucleic-acid-binding module.
    supporting_text: ATPase activity of DHX15 are increased when G-patch is bound.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Does not study AGGF1, and is cited only for what a G-patch domain is. That distinction
      is deliberate: it grounds the objection to the IPR000467 to GO:0003676 mapping without asserting
      anything measured about AGGF1.'
- id: PMID:33069768
  title: Angiogenic factor AGGF1 acts as a tumor suppressor by modulating p53 post-transcriptional modifications
    and stability via MDM2.
  findings:
  - statement: Immunostaining in human HCT116 cells places AGGF1 in the nucleus co-localised with p53.
      This is the best-documented nuclear localisation of the human protein and GO records none of it.
    supporting_text: 'HA-tagged p53 expression plasmids, and immunostaining showed that AGGF

      co-localized with p53 in the nucleus'
  - statement: Serial deletion mapping localises p53 binding to residues 434-509, the FHA domain, and
      co-immunoprecipitation confirms the isolated FHA domain binds p53. No phosphatase control, phospho-site
      mutant or peptide competition was used, so this is not evidence that the FHA reads a phosphosite.
    supporting_text: amino acids 434 and 509 is the FHA domain of AGGF1. Co-IP showed that the AGGF1
  - statement: Of six COSMIC somatic FHA-domain variants tested, G437E, Q467H, Y469N and N483T impair
      AGGF1's tumour-suppressor activity while R447Q and V497I do not. G437 is the conserved glycine of
      the canonical phosphothreonine-anchoring G-R pair; R447 is not the conserved arginine (R438 is)
      and V497 lies outside the annotated FHA core.
    supporting_text: 'mutations p. Q467H, p.Y469 N, and p.N483T, but not mutations p.R447Q and p.

      V497I, reduced the expression level of p53 and p21'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached and all three quotes verified against it. Produced no GO annotation
      on any gene product. The mutational pattern independently corroborates the residue-level prediction
      that G437-R438, S454 and N478 form AGGF1's phosphothreonine-recognition surface - but corroborates
      only that the surface matters, not that it binds a phosphopeptide.
- id: PMID:33471274
  title: FHA domain of AGGF1 is essential for its nucleocytoplasmic transport and angiogenesis.
  findings:
  - statement: AGGF1 moves from nucleus to cytoplasm in endothelial cells during angiogenesis, and the
      dynamic distribution is required for its angiogenic function. A nuclear localisation signal is mapped
      to residues 260-288.
    supporting_text: Angiogenic factor with G-patch and FHA domains 1 (AGGF1) exhibits a dynamic
  - statement: Cytoplasmic distribution requires both the FHA domain and 14-3-3 alpha/beta, and the FHA
      domain is what binds 14-3-3. No phosphorylation claim is made in the abstract, and phospho-dependence
      was not tested.
    supporting_text: localization. The distribution of AGGF1 in cytoplasm needs both FHA domain and
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Absent from the affinage deep-research record despite being titled for the FHA domain,
      and absent from GOA. Cached record is abstract-only; the full text could not be retrieved, so no
      claim is made about experiments the abstract does not describe. In particular, a secondary source
      asserting the 14-3-3 interaction is phosphorylation-dependent was checked and found to be an inference,
      not a statement in the paper, and is not used.
- id: PMID:34551592
  title: Receptor and Molecular Mechanism of AGGF1 Signaling in Endothelial Cell Functions and Angiogenesis.
  findings:
  - statement: 'Integrin alpha5beta1 is the endothelial receptor for AGGF1: GST-AGGF1 precipitates integrin
      alpha5 from HUVEC extracts dose-dependently, and only anti-alpha5, anti-beta1 and anti-alpha5beta1
      antibodies block HUVEC adhesion to AGGF1.'
    supporting_text: GST pull-down assays showed that GST-AGGF1, but not control GST, precipitated integrin-α5
      from HUVEC protein extracts
  - statement: AGGF1 treatment of HUVECs activates FAK, Src and AKT, and the AKT response is abolished
      by siRNA against ITGA5, ITGB1, PTK2 or SRC.
    supporting_text: Altogether, these data suggest that AGGF1 activates AKT signaling via integrin α5β1,
      FAK and Src.
  - statement: The angiogenic activity maps to residues 604-613 (FQRDDAPAS), a motif lying outside both
      the FHA and the G-patch domain, and the RDD is required - changing it to the classical RGD integrin
      motif abolishes blocking activity.
    supporting_text: 'A 40-mer or 15-mer peptide containing the angiogenic domain blocks AGGF1 function,
      however, a 15-mer peptide containing a single

      amino acid mutation from -RDD- to -RGD- (a classical RGD integrin-binding motif)

      failed to block AGGF1 function.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached and all quotes verified. Produced no GO annotation on any gene product,
      which is why two of the three molecular-function proposals in this review come from it.
- id: PMID:35202649
  title: Angiogenic factor AGGF1 blocks neointimal formation after vascular injury via interaction with
    integrin α7 on vascular smooth muscle cells.
  findings:
  - statement: Reports an AGGF1-integrin alpha7 interaction via the RDDAPAS motif. The experiments were
      performed in mouse MOVAS-1 cells and in mice, so this would support ISO rather than IPI in human
      and is deliberately not used as evidence for the GO:0005178 proposal.
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: 'Cited in prose only, and specifically to record why it is NOT used: the species check
      is the point. No quote is taken from it.'
- id: PMID:35608889
  title: 'Identification and characterization of a special type of subnuclear structure: AGGF1-coated
    paraspeckles.'
  findings:
  - statement: AGGF1 is a structural and regulatory component of paraspeckles, forming an outer rim around
      the NONO/PSF/PSPC1/NEAT1 core and controlling paraspeckle size and number.
    supporting_text: of paraspeckles that induces paraspeckle formation, forms an outside rim of
  - statement: RNA immunoprecipitation shows AGGF1 interacting with NEAT1 - the only direct measurement
      of RNA binding by this protein, and the basis for moving the GO:0003676 IEA row to GO:0003723.
    supporting_text: AGGF1 interacts with NEAT1, which may be another possible mechanism underlying
  - statement: AGGF1 regulates alternative splicing, decreasing the exon skipping/inclusion ratio in a
      CD44 minigene - a second, independent assay of the splicing activity characterised in PMID:40035560.
    supporting_text: splicing as it decreases the exon skipping/inclusion ratio in a CD44 model.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Cached record is abstract-only and does not name the cell system, which a curator making
      the paraspeckle and RNA-binding annotations should confirm. From the Wang QK laboratory, which discovered
      AGGF1. An earlier draft hedged this by anchoring the nucleus proposal on PMID:33069768 instead -
      but that paper has the same senior author, so the hedge was empty and is withdrawn. The honest statement
      is that AGGF1''s mechanistic literature is dominated by one group. Of the 27 cached AGGF1 primary
      studies reachable from this review''s own inputs, 18 have Wang Q or Wang QK as senior author; a
      further 5 have a senior author who is themselves an author on one of those papers (Tian XL twice,
      plus Xu Y, Zhou B and Lu Q), i.e. trainee or collaborator lineage rather than an independent investigator;
      and 4 have a senior author who appears on no Wang-group paper at all - Qi J (PMID:17884784), Zhang
      JH (PMID:29885663), Liao S (PMID:33168501) and Chen L (PMID:39905000). Three of those four are used
      by this review: PMID:39905000 for the TNFSF12 interaction and the extracellular pool, PMID:29885663
      on the PI3K/AKT row, and PMID:33168501 on the GO:0005634 nucleus row, where it supplies the only
      line of support that is neither Wang-group nor lineage. The nucleus proposal is therefore anchored
      on PMID:33069768 because that paper''s imaging is in a named human cell line (HCT116) and its cached
      record is full text, not because it is independent of this one. Independent replication of the paraspeckle
      result remains the single most useful thing anyone could do for this gene''s annotation.'
- id: PMID:36696895
  title: Protein therapy of skeletal muscle atrophy and mechanism by angiogenic factor AGGF1.
  findings:
  - statement: Reports that AGGF1 binding TWEAK reduces the TWEAK-Fn14 interaction in atrophic muscle
      - the opposite direction to PMID:39905000 in retinal endothelium. The discrepancy is recorded as
      a knowledge gap and neither direction is annotated.
  reference_review:
    relevance: MEDIUM
    correctness: DISPUTED
    review_notes: Not disputed as a citation - the paper says what it says - but its central mechanistic
      claim is contradicted in direction by PMID:39905000. Recording both, and annotating neither, is
      the honest treatment. No quote is taken from it.
- id: PMID:37081014
  title: AGGF1 therapy inhibits thoracic aortic aneurysms by enhancing integrin α7-mediated inhibition
    of TGF-β1 maturation and ERK1/2 signaling.
  findings:
  - statement: Reports that AGGF1 enhances integrin alpha7 binding to LAP-TGF-beta1, blocking maturation
      of TGF-beta1. Cited in prose only; the work is in mice and no annotation rests on it.
  reference_review:
    relevance: LOW
    correctness: UNVERIFIED
    review_notes: Mouse work, cited for completeness of the integrin alpha7 story. No quote is taken from
      it.
- id: PMID:39905000
  title: Endothelial AGGF1 promotes retinal angiogenesis by coordinating TNFSF12/FN14 signalling.
  findings:
  - statement: Co-immunoprecipitation in human retinal microvascular endothelial cells independently re-confirms
      the AGGF1-TNFSF12 interaction first reported in 2004.
    supporting_text: AGGF1 (V5GQ) is known to promote angiogenesis by interacting with TNFSF12 (TWEAK)
  - statement: Silencing AGGF1 reduces TNFSF12-FN14 binding, i.e. AGGF1 promotes the interaction - the
      opposite of what PMID:36696895 reports in muscle.
    supporting_text: Our results revealed that the binding of TNFSF12 to FN14 diminished when AGGF1 was
      silenced
  - statement: AGGF1 protein is elevated in the vitreous fluid of patients with proliferative diabetic
      retinopathy, independent human evidence that the protein reaches the extracellular space.
    supporting_text: AGGF1 is elevated in the retinas of db/db mice and in the vitreous of patients suffering
      from PDR.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached and quotes verified. Produced no GO annotation on any gene product
      despite containing the only independent replication of AGGF1's best-supported interaction.
- id: PMID:40035560
  title: Angiogenic factor AGGF1 is a general splicing factor regulating angiogenesis and vascular development
    by alternative splicing of SRSF6.
  findings:
  - statement: Full-length transcriptome sequencing of human pulmonary artery endothelial cells with AGGF1
      silenced shows AGGF1 regulating alternative splicing of 436 genes.
    supporting_text: genes, and showed that AGGF1 is a general splicing factor regulating AS of 436
  - statement: AGGF1 promotes skipping of SRSF6 exon 3 to produce full-length SRSF6, and full-length SRSF6
      rescues the proliferation, migration and tube-formation defects of AGGF1-silenced endothelial cells.
    supporting_text: skipping of exon 3 that produces the full-length SRSF6 protein, an
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Cached record is abstract-only but the human cell system (HPAECs) and the perturbation
      (silencing) are both stated in it, which is what the IMP code requires. The reference-projection
      check found no projection pattern, but it did sharpen the coverage point: QuickGO shows this paper
      produced 10 annotations over 10 entities, and every one of them is GO:0048514 blood vessel morphogenesis
      in ZEBRAFISH - four on aggf1 by IMP and six on srsf6a/srsf6b by IGI. So a paper whose entire finding
      is that AGGF1 is a general splicing factor regulating 436 genes produced ten GO annotations, all
      about vessel morphogenesis in fish, and not one about splicing in any species. Nothing reached human
      AGGF1.'
- id: PMID:42052570
  title: 'G-patch proteins: important regulators of pre-mRNA splicing and ribosome biogenesis.'
  findings:
  - statement: A 2026 survey of the human G-patch family whose Table 3 lists AGGF1's interacting RNA helicase
      as Unknown, while naming DHX15 for CMTR1 and other members. This is the peer-reviewed state of the
      question the review's suggested experiment addresses.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text cached; the Table 3 row for AGGF1 reads Pre-mRNA splicing, Transcription regulation,
      Angiogenesis with interacting helicase Unknown and yeast homologue Sqs1. Cited to bound the DHX15
      claim rather than to support it.
- id: PMID:29885663
  title: Aggf1 attenuates neuroinflammation and BBB disruption via PI3K/Akt/NF-κB pathway after subarachnoid
    hemorrhage in rats.
  findings:
  - statement: Recombinant AGGF1 raises PI3K and phospho-Akt and improves blood-brain-barrier integrity
      after subarachnoid haemorrhage, and the protection is abolished by the PI3K inhibitor LY294002.
      Independent corroboration of the AGGF1-PI3K/AKT axis from a group with a senior author who appears
      on none of the dominant group's papers - but the work is in rats, so it supports the pathway without
      bearing on the human evidence code.
    supporting_text: significantly increased the expression of PI3K, p-Akt, VE-cadherin, Occludin,
  - statement: 'The AGGF1 effect is PI3K-dependent: the protective roles of recombinant AGGF1 are lost
      when PI3K is inhibited.'
    supporting_text: were abolished by LY294002.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Added after the PR reviewer pointed out that it was cached with full text, is AGGF1
      primary research, and was missing from both the review and lab_independence.py's paper set - which
      meant this review's independence count described its own list rather than the literature. Senior
      author Zhang JH appears on no paper from the dominant group, so this is the second substantive independent
      group alongside PMID:39905000. The work is in Sprague-Dawley rats, so it is cited as corroboration
      of the PI3K/AKT axis and not as evidence for any human evidence code.
- id: PMID:33168501
  title: '[ole of AGGF1 in DNA damage repair and modulating chemotherapy resistance in human colon cancer
    cells in vitro].'
  findings:
  - statement: Immunofluorescence in human HCT116 cells shows AGGF1 co-localising with gammaH2AX after
      cisplatin-induced DNA double-strand breaks. Cited only as independent human-cell corroboration that
      AGGF1 is nuclear - gammaH2AX marks nuclear chromatin - and not for the DNA-repair interpretation,
      which this review does not annotate.
    supporting_text: Immunofluorescence assay showed the co-localization of AGGF1 and γH2AX.
  - statement: The cell system is human HCT116, the same line in which PMID:33069768 images nuclear AGGF1,
      but the work is from a different group.
    supporting_text: 'METHODS: Cisplatin-induced human colon cancer HCT116 cells transfected with'
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: 'Added after the PR reviewer pointed out that excluding it was a judgement layered on
      top of a measurement: lab_independence.py counts it as independent (senior author Liao S appears
      on no dominant-group paper), it is cached with full text, and it bears directly on the review''s
      largest proposal. The DNA-damage-repair interpretation rests on siRNA knockdown changing phospho-gammaH2AX
      and NBS1 levels and is not annotated here; only the localisation is used. MEDIUM rather than HIGH
      for three reasons that agree: it is a small study, the article is Chinese-language with an English
      abstract (Nan Fang Yi Ke Da Xue Xue Bao), and the affinage record independently rates it Low confidence.
      Note also a fetcher defect rather than a curation one: the cached title begins ''[ole of AGGF1''
      - a bracket-stripping step in the publication fetcher has eaten the R of ''[Role'', which would
      affect every translated PubMed title of this form. The YAML deliberately reproduces the cached title
      verbatim so that title validation passes; hand-correcting it here would mask the bug rather than
      fix it.'
