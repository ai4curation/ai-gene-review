core_functions:
- description: 'Acts inside the nucleus as an RNA-binding regulator of alternative splicing. AGGF1 binds
    the long non-coding RNA NEAT1, coats paraspeckles as an outer rim around their NONO/PSF/PSPC1 core
    and controls their size and number, and silencing it in human endothelial cells alters alternative
    splicing of 436 genes - among them SRSF6, whose exon-3 skipping AGGF1 promotes to produce the full-length,
    angiogenically active isoform. This is the activity the protein''s domain architecture predicts and
    the one its GO record almost entirely omits: an OCRE domain, an FHA domain and a G-patch domain, the
    combination found in RBM5/RBM10-class splicing regulators, with the G-patch retaining every residue
    the family conserves.'
