- term:
    id: GO:0001570
    label: vasculogenesis
  evidence_type: TAS
  original_reference_id: PMID:15905966
  qualifier: involved_in
  review:
    summary: The term is defensible, but on evidence this annotation does not cite. Its actual source
      is a review written by the authors of the discovery paper, restating that paper - which measured
      angiogenesis, not vasculogenesis.
    action: KEEP_AS_NON_CORE
    reason: 'PMID:15905966 is a survey of vascular-anomaly genes, not a primary study, and what it says
      about AGGF1 is a restatement of PMID:14961121: that the gene encodes a potent angiogenic factor
      and that KTS-associated mutations enhance that activity. Vasculogenesis - de novo vessel formation
      from angioblasts - is a distinct process from angiogenesis and was not assayed in either paper.
      The term nevertheless survives, because zebrafish aggf1 knockdown was later shown to cause defective
      vasculogenesis (PMID:23197652) and to act upstream of scl, fli1 and etsrp in hemangioblast specification
      (PMID:24277077). So this row is right for reasons published seven years after it was made, and it
      rests on organismal knockdown in fish rather than on anything measured on the human protein. Kept,
      but not core - and it needs re-sourcing rather than simply keeping: the term should be retained
      while the reference and code are changed to PMID:23197652 with ISO (or an IBA from the zebrafish
      orthologue), because TAS to a review that discusses angiogenesis cannot support a vasculogenesis
      annotation on the human protein. That is why PMID:15905966 is marked MISCITED in the reference list:
      the term survives, this particular (term, evidence, reference) triple does not.'
    supported_by:
    - reference_id: PMID:15905966
      supporting_text: 'AGGF1 encodes a potent angiogenic factor, and

        KTS-associated mutations enhance angiogenic activity of AGGF1, defining

        ''increased angiogenesis'' as one molecular mechanism for the pathogenesis of KTS.'
    - reference_id: PMID:23197652
      supporting_text: 'knockdown of AGGF1 expression

        resulted in defective vasculogenesis and angiogenesis'
- term:
    id: GO:0001938
    label: positive regulation of endothelial cell proliferation
  evidence_type: IDA
  original_reference_id: PMID:14961121
  qualifier: involved_in
  review:
    summary: Direct assay of purified AGGF1 on human endothelial cells, extended and given a mechanism
      by later work from the same group. One of the best-supported statements about this protein.
    action: ACCEPT
    reason: 'Purified recombinant AGGF1 applied to HUVECs increased thymidine uptake from 524 to 680 counts
      (P = 0.007, n = 8) - a direct assay of the protein''s activity on the annotated organism''s cells,
      which is exactly what IDA asserts. The result has since been extended and given a mechanism: AGGF1
      treatment of HUVECs activates FAK, Src and AKT through integrin alpha5beta1 (PMID:34551592), and
      blocking autophagy abolishes AGGF1-driven HUVEC proliferation (PMID:27513923). Both of those papers
      share this one''s senior author, so they are extensions rather than independent replications - the
      activity is well characterised but has been characterised almost entirely by one group. It is nonetheless
      a direct assay of purified protein on human cells, which is what the code asserts. Core.'
    supported_by:
    - reference_id: PMID:14961121
      supporting_text: VG5Q can bind to endothelial cells and promote cell proliferation, suggesting that
        it may act in an autocrine fashion.
- term:
    id: GO:0003676
    label: nucleic acid binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR000467
  review:
    summary: A domain-name mapping, not a measurement - no reviewed human G-patch protein holds this term
      on anything but IEA. The conclusion nonetheless survives on AGGF1's own RNA-immunoprecipitation
      data, at the more informative child term.
    action: MODIFY
    reason: 'Two separate questions, and they come out differently. First, what is the InterPro2GO inference
      worth? Querying the whole reference class shows it is worth nothing on its own: of the eleven reviewed
      human G-patch proteins the QuickGO query returns in full - NKRF, GPKOW, RBM17, SUGP1, CMTR1, GPATCH1,
      GPATCH4, RBM5, PINX1, ZGPAT and AGGF1 - every single one carries GO:0003676 by IEA and by nothing
      else, and not one carries it with any experimental code. The mapping is a uniform output of IPR000467,
      not anybody''s finding. That is also what the structural literature now says about the domain: the
      DHX15 crystal structure shows the G-patch acting as an extended tether that clamps the helicase''s
      C-terminal domains to its catalytic core, a helicase-activation peptide rather than an autonomous
      nucleic-acid-binding module. Second, is the conclusion true of AGGF1 anyway? Yes, and on better
      evidence: RNA immunoprecipitation shows AGGF1 binding the lncRNA NEAT1 (PMID:35608889), and six
      of the ten other G-patch proteins in the panel carry GO:0003723 RNA binding with real experimental
      codes while none of them has experimental support for the generic parent. So the right action is
      to move the row to GO:0003723 RNA binding, which is both more informative and the term the class''s
      own measurements land on - not to remove it. The domain itself is intact and canonical: AGGF1 matches
      8 of 8 columns conserved at 80 percent or better across 34 annotated G-patch domains in 33 reviewed
      human proteins, and all 8 are identical to the corresponding residues of NKRF, whose G-patch is
      the one resolved in complex with DHX15 - including the invariant glycines AGGF1 G631 (NKRF G563)
      and AGGF1 G639 (NKRF G570), each conserved in 100 percent of the panel.'
