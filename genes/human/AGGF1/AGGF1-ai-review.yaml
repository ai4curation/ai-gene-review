proposed_new_terms:
- proposed_name: TNFSF12 binding
  proposed_definition: Binding to tumor necrosis factor ligand superfamily member 12 (TNFSF12, also known
    as TWEAK), a secreted member of the tumor necrosis factor cytokine family that signals through the
    receptor TNFRSF12A/Fn14.
  justification: 'GO already contains GO:0038057 TNFSF11 binding, defined in exactly this shape for another
    TNF-superfamily ligand, so the pattern is established and this is a missing sibling rather than a
    new modelling decision. TNFSF12 binding is needed by more than one gene product: AGGF1 binds TNFSF12
    by yeast two-hybrid, GST pull-down and co-immunoprecipitation (PMID:14961121) with independent confirmation
    by co-immunoprecipitation in human retinal endothelial cells (PMID:39905000), and TNFRSF12A/Fn14 is
    TNFSF12''s receptor. At present all of this can only be recorded as bare GO:0005515 protein binding
    or as the generic GO:0019955 cytokine binding. Note a related inconsistency that should be settled
    at the same time: GO:0038057 is currently placed under GO:0043120 tumor necrosis factor binding, whose
    definition names TNF specifically as a proinflammatory cytokine produced by monocytes and macrophages
    and so does not cover superfamily ligands. Either GO:0043120''s definition should be broadened to
    the superfamily, or the superfamily-member terms should hang directly from GO:0019955; this review
    used GO:0019955 because it is definitionally correct today.'
  proposed_parent:
    id: GO:0019955
    label: cytokine binding
suggested_questions:
- question: Does the AGGF1 G-patch activate DHX15, and is that what underlies AGGF1's splicing phenotype?
    This is the single question that would settle what two thirds of the gene's name means.
- question: Has anyone ever tested whether AGGF1's FHA domain binds a phosphothreonine peptide? The domain
    retains the complete canonical recognition set - G437-R438, S454 and N478 all transfer with identity
    from both CHEK2 and Rad53 FHA1 and land inside AGGF1's own annotated domain - and the cancer somatic
    mutations that impair function include G437E, on the conserved glycine of the phosphothreonine-anchoring
    G-R pair, while the two that do not impair function (R447Q, V497I) lie off that surface. Yet both
    published FHA functions, p53 binding (PMID:33069768) and 14-3-3 alpha/beta binding (PMID:33471274),
    were mapped by plain co-immunoprecipitation with deletion constructs, with no phosphatase control,
    no phospho-site mutant and no peptide competition. An FHA domain binding 14-3-3 - itself the canonical
    phospho-serine/threonine reader - is a mechanistically odd claim in exactly the direction a phosphatase
    control would test.
- question: 'A correction to report to UniProt. The FT VARIANT 133 line reads E -> K (displays a stronger
    angiogenic activity; dbSNP:rs34203073), presenting the variant as a functional Klippel-Trenaunay mutation.
    That attribution has been refuted: 3.3 percent of 275 healthy controls carry E133K, the single affected
    carrier in that study inherited it from a clinically normal parent (PMID:16443853), a second group
    reported it as a polymorphism in the Spanish population (PMID:17103452), and the originating laboratory''s
    own larger study conceded that further genetic studies were needed to establish any AGGF1-KTS relationship
    (PMID:18564129). ClinVar classifies NM_018046.5(AGGF1):c.397G>A as Benign/Likely benign with multiple
    submitters and no conflicts. The in vitro CAM-assay difference may be real; the disease attribution
    is not, and no GO annotation should be propagated from it.'
- question: Should GO:0043120 tumor necrosis factor binding be redefined? Its definition names TNF specifically
    as a proinflammatory cytokine produced by monocytes and macrophages, but GO:0038057 TNFSF11 binding
    is placed beneath it - so the term's placement already treats it as covering the superfamily while
    its text does not. This review used GO:0019955 cytokine binding for the AGGF1-TNFSF12 interaction
    for that reason.
- question: 'Why has none of AGGF1''s mechanistic literature reached GO? Querying QuickGO by reference
    for all 35 papers relevant to this gene returns 22 that produced no GO annotation on any gene product
    anywhere, and 3 more that annotate other genes but nothing on AGGF1. Only two papers ever produced
    an AGGF1 annotation: the 2004 discovery paper and a 2005 review. Everything since - the receptor,
    the signalling pathway, the paraspeckles, the splicing, the FHA-dependent p53 stabilisation, the nucleocytoplasmic
    transport, the autophagy - is invisible to GO. This is a coverage defect, not an over-annotation defect,
    and it is unusually stark for a gene with this much literature.'
- question: Do the four HuRI two-hybrid partners of AGGF1 - DHX15, MCRS1 and FBXO28, all three experimentally
    nuclear, plus the entirely unlocalised MAB21L3 - deserve orthogonal testing as a set? They are the
    only evidence in AGGF1's own GO record that points at the nucleus, and a single co-immunoprecipitation
    panel in a human cell line would either corroborate the nuclear picture or remove four rows at once.
suggested_experiments:
- hypothesis: The AGGF1 G-patch is a DHX15 activation module, and DHX15 activation is what couples AGGF1
    to pre-mRNA splicing.
  experiment_type: in vitro biochemistry
  description: Purify the isolated AGGF1 G-patch (residues approximately 610-670) and assay it against
    recombinant DHX15 and, as a specificity control, DHX16, in a coupled ATPase assay and in a fluorescence-anisotropy
    RNA-binding assay. Use the NKRF G-patch as the positive control - the same construct used to solve
    the DHX15 complex - and an AGGF1 G-patch with the invariant glycines at 631 and 639 substituted as
    the negative. A positive result converts GO:0017151 into a mechanism and makes AGGF1's splicing phenotype
    interpretable.
- hypothesis: AGGF1's FHA domain is a genuine phosphothreonine reader, and the G437/R438, S454, N478 surface
    is its binding site.
  experiment_type: peptide binding and mutagenesis
  description: Screen the purified AGGF1 FHA domain (residues 434-508) against an oriented phospho-threonine
    peptide library by fluorescence polarisation, and in parallel repeat the p53 and 14-3-3 co-immunoprecipitations
    with and without lambda phosphatase treatment of the lysate. Include the G437E, R438A, S454A and N478A
    point mutants, since the alignment predicts those four residues form the recognition surface and G437E
    is already known from tumour data to impair AGGF1 function. This is the experiment that would decide
    whether the FHA in the gene's name denotes an activity or only a fold.
- hypothesis: AGGF1's nuclear splicing function and its extracellular receptor-ligand function are genetically
    separable and should be curated as two core functions.
  experiment_type: structure-function in cells
  description: Compare endothelial cells expressing wild-type AGGF1, an NLS-deleted mutant (removing residues
    260-288), and a mutant lacking the 604-613 angiogenic motif, reading out alternative splicing by RNA-seq,
    paraspeckle number by NEAT1 RNA-FISH, and angiogenic behaviour by tube formation. If the two activities
    separate cleanly, AGGF1 should be curated as two distinct core functions rather than as a single pleiotropic
    angiogenic factor; if they do not, the coupling itself is the finding.
- hypothesis: AGGF1 is exported by an unconventional secretion pathway, most likely the FGF1-like route,
    since it has no signal peptide.
  experiment_type: secretion assay with pathway perturbation
  description: Test whether AGGF1 secretion from endothelial cells is brefeldin A-insensitive, whether
    it requires S100A13 and SYT1 as the FGF1 pathway does, and whether GORASP2 or ESCRT knockout blocks
    it, using quantitative ELISA on conditioned medium from cells expressing AGGF1 at native levels rather
    than from transfectants.
- hypothesis: AGGF1 binds RNA directly rather than being recruited to NEAT1 through NONO, PSF and HNRNPK.
  experiment_type: CLIP and in vitro RNA binding
  description: Perform eCLIP on endogenous AGGF1 in human endothelial cells to map crosslink sites transcriptome-wide,
    and test purified full-length AGGF1 and each isolated domain against NEAT1 fragments by electrophoretic
    mobility shift. This distinguishes direct RNA binding from recruitment through partners, and is what
    the proposed GO:0003723 row ultimately needs.
