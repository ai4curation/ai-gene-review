- id: PMID:14961121
  title: Identification of an angiogenic factor that when mutated causes susceptibility to Klippel-Trenaunay
    syndrome.
  findings:
  - statement: Purified recombinant AGGF1 promotes angiogenesis in the chick chorioallantoic membrane
      assay as potently as VEGF, and two siRNAs plus an antisense oligonucleotide inhibit endothelial
      tube formation.
    supporting_text: 'VG5Q protein acts as a potent angiogenic factor in

      promoting angiogenesis, and suppression of VG5Q expression inhibits vessel

      formation.'
  - statement: AGGF1 is secreted by endothelial cells when tube formation begins, detected by competitive
      ELISA on conditioned medium and by metabolic labelling.
    supporting_text: 'VG5Q shows strong expression in blood vessels and is

      secreted as vessel formation is initiated.'
  - statement: AGGF1 interacts with TNFSF12/TWEAK, shown by yeast two-hybrid, GST pull-down with recombinant
      proteins, and co-immunoprecipitation from cells.
    supporting_text: 'We also demonstrate a direct interaction of VG5Q with another secreted

      angiogenic factor, TWEAK (also known as TNFSF12).'
  - statement: The E133K association with Klippel-Trenaunay syndrome, which this paper reports, has since
      been refuted (see PMID:16443853, PMID:18564129). The biochemical results on the wild-type protein
      are unaffected.
    supporting_text: 'The second is mutation E133K identified in five KTS patients, but

      not in 200 matched controls.'
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: 'The source of seven of AGGF1''s twenty-four GOA rows, and the biochemistry it reports
      - secretion, endothelial binding, CAM angiogenesis, proliferation, TWEAK interaction - has been
      independently reproduced and extended. Marked DISPUTED rather than VERIFIED for one specific reason:
      its human-genetic claim, that E133K is a gain-of-function KTS mutation, was contradicted by PMID:16443853
      and PMID:17103452 and effectively withdrawn by the originating laboratory in PMID:18564129, and
      ClinVar now classifies the variant Benign/Likely benign. None of the GO rows sourced from this paper
      depends on that claim, which is why they are all accepted.'
- id: PMID:15905966
  title: 'Biomedicine and diseases: the Klippel-Trenaunay syndrome, vascular anomalies and vascular morphogenesis.'
  findings:
  - statement: A review by the authors of PMID:14961121 restating that paper's angiogenesis result. It
      contains no vasculogenesis experiment, although it is the cited source of AGGF1's GO:0001570 TAS
      row.
    supporting_text: 'AGGF1 encodes a potent angiogenic factor, and

      KTS-associated mutations enhance angiogenic activity of AGGF1, defining

      ''increased angiogenesis'' as one molecular mechanism for the pathogenesis of KTS.'
  reference_review:
    relevance: LOW
    correctness: MISCITED
    review_notes: The identifier and title are right and the paper is real, but it does not support the
      annotation it was cited for. GO:0001570 is vasculogenesis; this review discusses angiogenesis and
      restates a primary paper that assayed angiogenesis. The term survives on zebrafish knockdown data
      published seven years later (PMID:23197652), which this reference could not have cited.
