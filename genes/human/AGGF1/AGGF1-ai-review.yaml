id: Q8N302
gene_symbol: AGGF1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'AGGF1 is a 714-residue human protein that leads two separable lives. Inside the nucleus
  it behaves as an RNA-processing factor: it carries an OCRE domain, an FHA domain (residues 434-487)
  and a G-patch domain (619-665) - the architecture of splicing regulators such as RBM5/RBM10 and of the
  G-patch cofactors of DEAH-box RNA helicases - it binds the long non-coding RNA NEAT1, coats paraspeckles
  as an outer rim around their NONO/PSF/PSPC1 core, and regulates alternative splicing of hundreds of
  transcripts, among them SRSF6, whose exon-3 skipping it promotes. Outside the cell it acts as a secreted
  ligand: AGGF1 is released from endothelial cells as capillary tube formation begins, engages integrin
  alpha5beta1 through a short RDD-containing motif at residues 604-613 that lies outside both named domains,
  and activates FAK, Src and AKT to drive endothelial cell adhesion, proliferation, migration, autophagy
  and capillary tube formation. It also binds the secreted cytokine TNFSF12/TWEAK. The protein shuttles
  between these two compartments under the control of its FHA domain and an internal nuclear localisation
  region, and it lacks a signal peptide, so its export is non-classical. Homozygous loss of the mouse
  orthologue is embryonic lethal, and in zebrafish aggf1 acts near the top of the hierarchy specifying
  hemangioblasts and venous identity. Although the gene was discovered through a reported association
  with Klippel-Trenaunay syndrome, the specific variant on which that association rested, E133K, has since
  been shown to be a benign polymorphism: its gnomAD v4 allele frequency is about 1.4% overall, i.e. roughly
  2.8% of people carry a copy, and it was found in 3.3% of healthy population controls.'
