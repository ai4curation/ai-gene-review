id: Q15797
gene_symbol: SMAD1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SMAD1 is a receptor-regulated SMAD transcription factor in the BMP branch of TGF-beta superfamily signaling.
  BMP and related type I serine/threonine kinase receptors phosphorylate its C-terminal SSXS motif, allowing SMAD1 to form
  SMAD4-containing complexes, accumulate in the nucleus, bind BMP-responsive cis-regulatory DNA through its MH1 domain, and
  regulate RNA polymerase II transcription of target genes. SMAD1 also participates in specialized noncanonical or contextual
  outputs, including DROSHA-associated primary microRNA processing, anti-Mullerian hormone signaling, osteogenic differentiation,
  angiogenic endothelial responses, iron homeostasis, and negative regulation by inhibitory SMADs, SMURF ubiquitin ligases,
  nuclear export factors, and the inner nuclear membrane protein LEMD3/MAN1.
