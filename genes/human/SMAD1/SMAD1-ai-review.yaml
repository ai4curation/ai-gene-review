core_functions:
- description: After phosphorylation by BMP-family type I receptors, SMAD1 forms SMAD4-containing complexes that accumulate
    in the nucleus and bind BMP-responsive cis-regulatory DNA to activate RNA polymerase II transcription in the BMP/SMAD
    signal-transduction pathway.
  molecular_function:
    id: GO:0000981
    label: DNA-binding transcription factor activity, RNA polymerase II-specific
  directly_involved_in:
  - id: GO:0030509
    label: BMP signaling pathway
  - id: GO:0060395
    label: SMAD protein signal transduction
  - id: GO:0045944
    label: positive regulation of transcription by RNA polymerase II
  locations:
  - id: GO:0005634
    label: nucleus
  in_complex:
    id: GO:0071144
    label: heteromeric SMAD protein complex
  supported_by:
  - reference_id: PMID:8653785
    supporting_text: MADR1 in the nucleus
  - reference_id: PMID:11779505
    supporting_text: Phosphorylation of Smad1 at the conserved carboxyl terminal SVS sequence
  - reference_id: PMID:12270938
    supporting_text: responsive to Smad1 and Smad4 but not to Smad2 and Smad4 or Smad3 and Smad4
  - reference_id: PMID:20147459
    supporting_text: crystal structure of the MH1 domain of Smad1
suggested_questions:
- question: Which BMP-responsive promoters require direct SMAD1 MH1 DNA binding versus recruitment through other DNA-binding
    transcription factors?
  experts: []
- question: Which human cell states use SMAD1 for SMAD4-independent DDX5/DROSHA primary miRNA processing, and are pri-miRNA
    substrates selected directly by the SMAD1 MH1 domain?
  experts: []
- question: Should GO-CAM BMP/SMAD transcription-factor activities use an explicit nuclear compartment in addition to chromatin
    so that active SMAD1 complexes close over the nucleus?
  experts: []
suggested_experiments:
- hypothesis: Direct SMAD1 MH1 DNA binding and SMAD4 recruitment make separable contributions to BMP target selection.
  description: Compare BMP2- or BMP9-induced ChIP-seq, CUT&RUN, and nascent RNA-seq for endogenous SMAD1, a DNA-contact mutant,
    an MH2 trimerization mutant, and paired SMAD4 depletion in an endothelial or mesenchymal cell system.
- hypothesis: Only a defined subset of BMP-induced pri-miRNAs is directly selected by SMAD1-DDX5 complexes.
  description: After BMP stimulation, map endogenous SMAD1, DDX5, DROSHA, and pri-miRNA contacts by eCLIP/RIP-seq and test
    SMAD1-dependent pri-miRNA processing after MH1 and MH2 domain perturbations.
