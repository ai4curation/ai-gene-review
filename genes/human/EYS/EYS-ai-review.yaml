- id: PMID:27846257
  title: EYS Is a Protein Associated with the Ciliary Axoneme in Rods and Cones.
  full_text_unavailable: false
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Actual complete main Methods/Results/Discussion and captions were read from PMC5112921
      XML, especially indexed blocks 5–69; Figures 3 and 8 pixels were inspected. Endogenous human Y79
      EYS is enriched at CEP135-positive centrosomes and acetylated-tubulin-positive cilia. Macaca fascicularis
      retinal sections show partial overlap with acetylated tubulin and RP1 along photoreceptor outer
      segments. The study uses its own explicit isoform nomenclature: human 3144/619/594/3165-residue
      transcripts; the two short full-length constructs and split 3144-residue fragments are distinct
      from endogenous staining, and the displayed 3165-residue construct was unavailable. No universal
      short-product localization or native signal-peptide cleavage is established. No other figure pixels
      or supplementary files were inspected.'
core_functions:
- description: Provides conserved extracellular structural support associated with photoreceptor maintenance.
    Fly Spam/Eys coating directly protects cells against deformation and increases resistance to indentation
    after actin disruption. In zebrafish, Eys loss disrupts cone ciliary-pocket architecture before photoreceptor
    degeneration, supporting a structural contribution to maintenance rather than only a survival requirement.
    The human molecular role is a phylogenetic inference supported by these complementary experiments.
    Broad extracellular-matrix placement does not resolve the precise human interphotoreceptor compartment
    or assign the same activity to every observed axoneme-associated, outer-segment or centrosomal pool.
    Neither secretion nor equivalent activity is established for all four products.
  molecular_function:
    id: GO:0005201
    label: extracellular matrix structural constituent
  directly_involved_in:
  - id: GO:0045494
    label: photoreceptor cell maintenance
  locations:
  - id: GO:0031012
    label: extracellular matrix
