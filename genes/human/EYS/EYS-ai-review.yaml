    label: skeletal muscle tissue regeneration
  evidence_type: IMP
  original_reference_id: PMID:21826682
  qualifier: involved_in
  review:
    summary: The cited association study proposes regeneration as a hypothesis rather than testing it.
    action: MARK_AS_OVER_ANNOTATED
    reason: PMID:21826682 reports a suggestive association with severe statin-induced myopathy in humans
      and EYS transcript characterization. Its skeletal-muscle regeneration interpretation is explicitly
      proposed from domain similarity and possible Notch/agrin-related mechanisms; no EYS perturbation,
      injured-fiber regrowth or regeneration assay is reported in the operative Methods and Results. GO:0043403
      specifically describes postnatal regrowth of injured or damaged skeletal muscle. The genetic association
      and muscle transcript observations do not establish that process participation. Mark this specific
      functional interpretation as over-annotated without rejecting the reported association or asserting
      a contradicted muscle role. The historical 3196-residue retinal/spinal transcript and muscle 3-prime
      amplification are not equated with all four current UniProt products.
