- id: GO_REF:0000117
  title: Electronic Gene Ontology annotations created by ARBA machine learning models
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The four accessible exact ARBA payloads and captured target InterPro/FunFam/taxonomic
      features were compared. ARBA00029228, ARBA00044390 and ARBA00029146 have matching current condition
      sets. ARBA00027396 is accessible but does not reproduce the target match; its biological matrix
      assertion has independent PAINT/experimental support. ARBA00098139 returns a genuine HTTP 404, leaving
      its conditions unread. These are current-versus-historical provenance boundaries, not proof of biological
      loss. Developmental growth and anatomical development are distinguished from the directly supported
      maintenance phenotype; the replacement of nervous-system process by photoreceptor maintenance is
      explicitly lateral, not an ancestor refinement.
