suggested_questions:
- question: Which native retinal EYS pools are extracellular, membrane-associated or intracellular, and
    where does structural support occur relative to the ciliary pocket and outer segment?
- question: Which of the four natural human EYS products are expressed in relevant cells, and how do their
    localization, processing and structural activity differ?
- question: Does human EYS directly change extracellular mechanical properties in a way that preserves
    photoreceptor architecture, and which molecular partners are required?
suggested_experiments:
- hypothesis: Distinct EYS pools may occupy different membrane topologies, so conventional colocalization
    need not identify the site of extracellular structural activity.
  description: Map endogenous EYS in human retinal tissue or appropriately matured retinal organoids using
    independently validated epitopes, extracellular accessibility and protease-protection assays, and
    immuno-electron microscopy with loss-of-EYS controls. Relate signal to the ciliary-pocket membrane,
    outer segment and PNA-positive sheath. Confirm that endogenous tagging preserves expression and architecture;
    do not infer topology from sheath enclosure or optical overlap alone.
  experiment_type: Endogenous topology and ultrastructural localization
- hypothesis: The long and short natural products may have different localization or activity, independently
    of the behavior of historical fragments and shared antibody epitopes.
  description: Combine transcript-junction measurements and product-discriminating peptides with sequence-verified
    full-length product rescue at matched expression. Assess localization, N-terminal processing, extracellular
    recovery and retinal architecture separately for the four products, controlling for aggregation and
    tag effects. Distinguish the predicted signal sequence from directly measured cleavage and preserve
    literal accession-to-sequence correspondence rather than relying on historical isoform names.
  experiment_type: Product-resolved expression, processing and functional rescue
- hypothesis: Human EYS may provide mechanical support through extracellular assembly or attachment, with
    native retinal partners determining the effective structural unit.
  description: Test sequence-verified human EYS preparations or controlled cell-surface assemblies for
    coating, deformation resistance and force response, alongside matched EYS-negative controls and separate
    cytoskeletal perturbations. Compare candidate partner conditions without assuming that fly Prominin
    binding transfers directly to human EYS. Couple any reproducible mechanical effect to product-specific
    rescue of photoreceptor architecture and longitudinal survival in a suitable retinal model.
  experiment_type: Human structural activity and retinal maintenance coupling
