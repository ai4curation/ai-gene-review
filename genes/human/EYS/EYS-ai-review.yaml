id: Q5T1H1
gene_symbol: EYS
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: EYS is a multidomain protein containing EGF-like and laminin G domains that supports extracellular
  organization and photoreceptor maintenance. Its structural role helps preserve the architecture surrounding
  sensory cells, and loss of EYS disrupts cone ciliary-pocket integrity before progressive photoreceptor
  degeneration in zebrafish. In primate retina, EYS is associated with photoreceptor outer segments and
  the region near the connecting cilium; a human retinoblastoma cell line also contains ciliary and centrosomal
  pools. The precise topology of these pools and their relationship to extracellular structural support
  remain unresolved. Biallelic pathogenic EYS variants cause autosomal recessive retinitis pigmentosa.
  Human EYS has two long multidomain products and two much shorter products with different domain content;
  their individual functions, localization and processing are not established.
