- term:
    id: GO:0043015
    label: gamma-tubulin binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR025913
  review:
    summary: Positive human gamma-TuRC coassociation is retained, but the specific gamma-tubulin
      binding inference remains unresolved.
    action: UNDECIDED
    reason: The official IPR025913 entry genuinely maps this domain to gamma-tubulin binding, but
      its sole cited paper, PMID:18294141, uses gamma-tubulin as a centrosomal localization marker
      rather than testing that specific interaction. Independent PMID:22508265 Fig. 1D and Results
      positively co-immunoprecipitate endogenous human CEP57 with gamma-tubulin, GCP2 and NEDD1.
      NEDD1 is the strongest associated partner, and FRET, domain interaction and depletion experiments
      support CEP57 association with NEDD1 and NEDD1-dependent CEP57 localization/stability. Those
      experiments do not test whether the gamma-tubulin association depends on NEDD1, so they neither
      prove an exclusively NEDD1-mediated bridge nor resolve which gamma-TuRC component contacts
      CEP57. Retain the positive complex association while leaving the original partner-specific
      electronic inference undecided. This is not a universal purified-binary-binding requirement
      or evidence that CEP57 cannot bind gamma-tubulin; no gamma-tubulin enzymatic activity is transferred
      to CEP57.
    supported_by:
    - reference_id: PMID:22508265
    - reference_id: PMID:18294141
