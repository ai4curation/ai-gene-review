    label: fibroblast growth factor receptor signaling pathway
  evidence_type: IPI
  original_reference_id: PMID:12717444
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P09038
  review:
    summary: The source supports intracellular FGF2 transport without resolving a strictly nuclear
      destination.
    action: MODIFY
    reason: PMID:12717444 identifies FGF2-binding translokin and tests a binding-deficient FGF2 chimera.
      Both ligands enter the cytoplasm, whereas the chimera has reduced nuclear-associated accumulation
      and mitogenicity despite preserved receptor competition, ERK/p70S6K signaling and differentiation.
      Translokin RNAi and partial rescue by a ligand nuclear-localization signal support its own
      binding/transport role. GO:0006886 captures this intracellular movement without equating the
      predominantly perinuclear signal or nuclear-associated fraction with demonstrated intranuclear
      delivery. Human-library interaction discovery is distinct from mouse NIH3T3 knockdown and bovine
      endothelial transport assays; every purified construct species is not unambiguously identified
      in the Methods. No nuclear-pore motor is established. The tested receptor readouts do not prove
      universal nonparticipation in receptor signaling; this lateral refinement preserves the original
      IPI and P09038 partner while representing the directly measured trafficking role.
    supported_by:
    - reference_id: PMID:12717444
      supporting_text: reduces the translocation of FGF-2
    proposed_replacement_terms:
    - id: GO:0006886
      label: intracellular protein transport
