id: Q86XR8
gene_symbol: CEP57
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CEP57 is a coiled-coil centrosomal protein that binds microtubules and helps organize
  pericentriolar material and the mitotic spindle. Its distinct interaction regions anchor centrosomal
  proteins, including pericentrin, and support the integrity of the centrosome and centriole engagement.
  Human CEP57 can self-associate; purified constructs form condensates that concentrate tubulin,
  while cellular perturbations disrupt microtubule organization. CEP57, also called translokin, binds
  the 18-kDa form of FGF2 and supports its intracellular trafficking toward the nuclear vicinity
  in mammalian cell models. The relative contribution of its proposed kinetochore checkpoint role
  varies across experimental systems. Biallelic CEP57 variants cause mosaic variegated aneuploidy
  syndrome (PMID:21552266).
