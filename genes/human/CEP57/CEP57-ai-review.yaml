  qualifier: is_active_in
  supporting_entities:
  - PANTHER:PTN001456386
  - UniProtKB:Q5FWP9
  review:
    summary: Spindle-microtubule activity agrees with direct mammalian structural evidence.
    action: ACCEPT
    reason: The PAINT PTN001456386 assertion is retained as ancestral inference; the current
      frog donor identity does not alone settle its node placement. Human endogenous spindle-associated
      CEP57, reduced spindle microtubule organization after depletion, and direct human MT-binding
      assays support activity at this site. The complete phylogenetic node history was not reconstructed.
      This is structural participation, not merely the location of a passive spindle substrate.
    supported_by:
    - reference_id: PMID:22508265
    - reference_id: PMID:26743940
    - reference_id: PMID:23569207
