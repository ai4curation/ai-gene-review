    review_notes: Normal cache abstract-only; genuine complete primary HTML externally read
      for selected Results/Methods. Endogenous human gamma-TuRC co-IP, NEDD1-dependent recruitment
      and spindle organization are distinguished from CHO regrowth and mouse antibody-antigen
      constructs. Co-IP does not prove a binary gamma-tubulin interface.
- id: PMID:30804344
  title: The Cep57-pericentrin module organizes PCM expansion and centriole engagement.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full primary Results and relevant Methods establish human isoform-a constructs,
      endogenous PCM localization, purified CEP57–PCNT fragment binding and localization/rescue
      assays. The study reports SAC results differing from PMID:26743940 in its conditions;
      physical attachment, checkpoint signaling and PCM integrity are not conflated.
- id: PMID:38857398
  title: Cep57 regulates human centrosomes through multivalent interactions.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full primary selected Results/Figs.1–6 and cloning/purification/pull-down/assembly
      Methods read. Human full-length sfGFP-CEP57 condensation and full-length mutant rescue
      are separate from detailed engineered Cep57S (56–264 fused334–433) reconstitution. Tubulin
      concentration/assembly in PEG/taxol-containing conditions does not establish an autonomous
      processive polymerase.
- id: PMID:26743940
  title: Cep57 is a Mis12-interacting kinetochore protein involved in kinetochore targeting
    of Mad1-Mad2.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full primary selected Results and Methods read. Human HeLa-derived constructs
      directly bind Mis12/Mad1 and microtubules; reported checkpoint behavior differs from PMID:30804344.
      The paper itself reports no significant attachment defect, so checkpoint activity is not
      substituted for physical kinetochore attachment.
- id: PMID:23569207
  title: Cep57 protein is required for cytokinesis by facilitating central spindle microtubule
    organization.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full primary Methods/Results read. Endogenous human HeLa depletion affects
      central spindle/midbody organization; expression and rescue constructs were amplified
      from mouse. Tektin1 recruitment is structural/adaptor evidence, not an intrinsic enzyme
      function or a claim that every division fails.
- id: PMID:17803911
  title: Xenopus Cep57 is a novel kinetochore component involved in microtubule attachment.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Authentic abstract explicitly describes Xenopus egg-extract and isolated-chromosome
      attachment assays. Current Q5FWP9 maps to cep57l1; full original methods were not recovered.
      This donor evidence does not by itself establish an erroneous PAINT node or equivalent
      human CEP57 attachment function.
  full_text_unavailable: true
- id: PMID:21552266
  title: Mutations in CEP57 cause mosaic variegated aneuploidy syndrome.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Genuine normal full XML-derived cache accessed. Selected main Results describe
      exome discovery, Sanger confirmation in additional families, biallelic loss-of-function variants
      and segregation, supporting the human MVA statement. The disease finding does not establish
      a particular checkpoint or microtubule mechanism, and the paper explicitly leaves that mechanism
      open. Supplementary datasets were not independently reanalysed.
core_functions:
- description: CEP57 binds microtubules and supports spindle microtubule organization. Human
    C-terminal constructs directly co-sediment with microtubules; mouse domain assays and human
    engineered Cep57S reconstitution further demonstrate tubulin recruitment, bundling and assembly
    capabilities. Cellular depletion/rescue connects these capabilities to centrosomal and spindle
    organization without requiring that all in-vitro conditions reproduce a native full-length
    condensate.
