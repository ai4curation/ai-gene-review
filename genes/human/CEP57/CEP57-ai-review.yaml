    supporting_text: Cep57S condensates nucleate microtubules
- description: CEP57 provides cytoskeletal anchoring for centrosomal partners. Its N-terminal
    region directly recognizes the PCNT PACT domain, and recruitment/binding-deficient mutant
    and chimera experiments connect this physical interaction to organized pericentriolar material
    and centriole engagement in mitosis. The model specifies a protein anchor, not a kinase
    or a demonstrated fixed-stoichiometry motor complex.
