  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  review:
    summary: The Ensembl-transferred condition response is a downstream readout
      context, not a CASP9 core function.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'These hypoxia, ischemia, toxicological, hormone, and pharmacological
      terms are experimental or physiological contexts in which the intrinsic caspase
      cascade can be engaged; they should not be promoted to direct CASP9 activities
      without proximal evidence for CASP9 doing work in the named response.'
