- id: PMID:34472839
  title: Caspase-9 activation of procaspase-3 but not procaspase-6 is based on
    the local context of cleavage site motifs and on sequence.
  findings:
  - statement: Caspase-9 cleaves procaspase-3 at the intersubunit linker IETD↓S
      but does not efficiently activate procaspase-6 even though procaspase-6
      contains ISL Asp motifs, because the local sequence/structural context
      prevents productive cleavage. Active-site preference ranking is IETDS >
      TEVDA > DVVDN.
- id: PMID:34553588
  title: Deorphanizing caspase-3 and caspase-9 substrates in and out of
    apoptosis with deep substrate profiling.
  findings:
  - statement: Deep N-terminomics identified 124 putative caspase-9 protein
      substrates (137 cleavage sites) with a caspase-9 cleavage motif of
      LESD↓(G/S), broadly consistent with classical LEHD preference. Caspase-9
      intrinsic catalytic efficiency (kcat/Km ~3.3 x 10^3 M^-1 s^-1) is markedly
      lower than caspase-3 (7.6 x 10^5 M^-1 s^-1).
