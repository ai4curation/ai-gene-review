- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: Procaspase-9 is a cytoplasmic apoptotic initiator.
    action: ACCEPT
    reason: The inactive zymogen is cytoplasmic before apoptotic activation and
      the IBA localization agrees with experimental CASP9 localization evidence.
    supported_by:
    - reference_id: PMID:12782307
      supporting_text: caspase-9 is in the cytoplasm of non-apoptotic pituitary
        cells
- term:
    id: GO:0006915
    label: apoptotic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: CASP9 acts as the apoptosome-associated initiator caspase in
      intrinsic apoptosis; the top-level apoptotic-process term can be
      tightened.
    action: MODIFY
    reason: The inherited top-level apoptosis assertion is directionally
      correct, but CASP9 acts at the apoptosome in intrinsic apoptotic signaling
      rather than as an undifferentiated apoptosis participant.
    proposed_replacement_terms:
    - id: GO:0097193
      label: intrinsic apoptotic signaling pathway
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN000047947
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: The PAINT node supports inherited caspase apoptosis biology,
          but CASP9 is the intrinsic initiator and the top-level
          apoptotic-process term can be tightened.
    supported_by:
    - reference_id: PMID:9390557
      supporting_text: Caspase-9 and Apaf-1 bind to each other via their
        respective NH2-terminal CED-3 homologous domains
- term:
    id: GO:0004197
    label: cysteine-type endopeptidase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: 'Cysteine-type endopeptidase activity is the catalytic activity of full-length
      CASP9.'
    action: ACCEPT
    reason: The PAINT assertion is sound for catalytically active caspase-9
      orthologs; the human full-length protein cleaves and activates executioner
      procaspases after apoptosome recruitment.
    supported_by:
    - reference_id: PMID:9390557
      supporting_text: Activated caspase-9 in turn cleaves and activates
        caspase-3
