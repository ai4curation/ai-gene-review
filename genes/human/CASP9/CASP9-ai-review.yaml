  title: Active site–adjacent phosphorylation at Tyr-397 by c-Abl kinase
    inactivates caspase-9.
  findings:
  - statement: Serrano et al. 2017 observed no evidence for Tyr-153
      phosphorylation of caspase-9 in vitro or in cells, suggesting that Tyr-153
      is NOT phosphorylated by c-Abl as previously reported (cf. PMID:15657060).
      Instead, the authors identified active-site adjacent Tyr-397 as a c-Abl
      phosphorylation site that inhibits catalytic activity by interfering with
      substrate binding — making the c-Abl/caspase-9 axis inhibitory rather than
      activating in their hands.
