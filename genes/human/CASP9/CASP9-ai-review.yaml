suggested_questions:
- question: How do cells regulate the ratio of Caspase-9L to Caspase-9S
    isoforms, and what splicing factors are involved in this decision?
- question: What is the precise molecular mechanism by which Caspase-9S inhibits
    apoptosis - does it simply sequester Apaf-1 or does it have additional
    inhibitory mechanisms?
- question: What are the non-apoptotic functions of caspase-9 in autophagy,
    synaptic plasticity, and vascular function, and how are these regulated
    independently of apoptosis?
- question: Is the Tyr-153 c-Abl phosphorylation of caspase-9 originally
    reported in PMID:15657060 a productive in-cell event? PMID:29066624 (Serrano
    2017) reported no evidence for Tyr-153 phosphorylation of caspase-9 by c-Abl
    in vitro or in cells, and instead identified active-site adjacent Tyr-397 as
    an inhibitory c-Abl site. What in-cell methods (e.g., site-directed mutants
    coupled to endogenous c-Abl activation in DNA damage contexts) would
    definitively resolve whether c-Abl's regulatory effect on caspase-9 is
    activating, inhibitory, or both — and in which cellular contexts?
- question: How widespread is pathogen-encoded direct phosphorylation of
    caspase-9 (e.g., LegK3 at Thr-102; PMID:39349471) across bacterial effector
    kinases, and is this a generalizable strategy to suppress host intrinsic
    apoptosis?
- question: To what extent is oxidative-stress-driven, reversible suppression of
    caspase activation (PMID:39245717) a general mechanism that gates intrinsic
    apoptosis in vivo beyond drug-induced liver injury?
suggested_experiments:
- description: 'Isoform-specific proteomics: Develop isoform-specific antibodies or
    mass spectrometry methods to quantify 9L/9S ratios across tissues and disease
    states.'
- description: 'Structural studies of Caspase-9S in the apoptosome: Determine how
    the truncated isoform interacts with Apaf-1 and whether it truly occupies the
    same binding site as 9L.'
- description: 'Conditional isoform knockout: Generate mice with isoform-specific
    knockouts to determine the specific physiological roles of each isoform.'
alternative_products:
- name: 1 (9L, Alpha)
  id: P55211-1
  description: >-
    The canonical pro-apoptotic isoform (416 AA). Also called Caspase-9L or Caspase-9
    alpha.
    Contains the CARD domain and full catalytic domain. Activated by Apaf-1 in the
    apoptosome
    to initiate the intrinsic apoptotic pathway. Most GO annotations refer to this
    isoform.
- name: 2 (9S, Beta)
  id: P55211-2
  sequence_note: VSP_000818
  description: >-
    The dominant-negative anti-apoptotic isoform (307 AA). Also called Caspase-9S
    or Caspase-9
    beta. Lacks the catalytic domain but retains the CARD domain, allowing it to
    compete with
    Caspase-9L for Apaf-1 binding without triggering apoptosis. The 9L/9S ratio
    determines
    cellular sensitivity to apoptotic stimuli. Overexpressed in some cancers to
    evade apoptosis.
- name: 3 (Gamma)
  id: P55211-3
  sequence_note: VSP_043910, VSP_043911
  description: >-
    A less characterized isoform with alternative splicing affecting the N-terminal
    region.
    Functional studies are limited compared to the 9L and 9S isoforms.
- name: '4'
  id: P55211-4
  sequence_note: VSP_044256
  description: >-
    A less characterized isoform. Functional role not well established in the literature.
