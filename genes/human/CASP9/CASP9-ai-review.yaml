id: P55211
gene_symbol: CASP9
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'CASP9 encodes the apoptosome-associated initiator caspase of the intrinsic
  mitochondrial apoptosis pathway. After cytochrome c release, APAF1 recruits procaspase-9
  through CARD-CARD interactions and assembles an apoptosome platform that activates
  caspase-9, allowing the enzyme to cleave and mature executioner procaspases such
  as CASP3 and CASP7. Proteolytic activity resides in the full-length Caspase-9L isoform,
  whereas the shorter Caspase-9S isoform retains the recruitment domain but lacks
  the central catalytic domain and can antagonize intrinsic apoptosis by interfering
  with productive APAF1-caspase-9 complex formation.'
