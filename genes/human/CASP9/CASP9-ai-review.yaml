- term:
    id: GO:0043525
    label: positive regulation of neuron apoptotic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: 'Neuronal apoptosis is a well-known developmental outcome of the CASP9
      pathway, but it is not a separate core activity of the enzyme.'
    action: KEEP_AS_NON_CORE
    reason: "CASP9 executes the same intrinsic initiator-caspase chemistry in neurons
      as in other apoptosis contexts; the neuron-specific term should not be treated
      as its core molecular role."
- term:
    id: GO:0008630
    label: intrinsic apoptotic signaling pathway in response to DNA damage
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: 'The inherited DNA-damage-specific intrinsic-apoptosis row overstates
      the trigger specificity for CASP9.'
    action: MODIFY
    reason: CASP9 is the intrinsic initiator downstream of MOMP and APAF1; DNA
      damage is only one upstream route into that pathway, so the parent
      intrinsic apoptotic signaling term is more appropriate.
    proposed_replacement_terms:
    - id: GO:0097193
      label: intrinsic apoptotic signaling pathway
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN000047947
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: CASP9 participates broadly in apoptotic signaling, but the
          DNA-damage-specific child term overstates trigger specificity for an
          inherited initiator-caspase assertion.
    supported_by:
    - reference_id: PMID:9390557
      supporting_text: Activated caspase-9 in turn cleaves and activates
        caspase-3
