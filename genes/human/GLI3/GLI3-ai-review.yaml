    supporting_text: GLI3 directly binds to the Gli1 promoter and induces Gli1 transcription
      in response to Shh.
  - reference_id: PMID:10077605
    supporting_text: Here we show that full-length GLI3 localizes to the cytoplasm and activates
      PTCH1 expression, which is similar to full-length Ci155.
  - reference_id: PMID:17000779
    supporting_text: We show that Gli3 binds to MED12 and intact Mediator both in vitro and
      in vivo through a Gli3 transactivation domain (MBD; MED12/Mediator-binding domain) whose
      activity derives from concerted functional interactions with both Mediator and the histone
      acetyltransferase CBP.
  - reference_id: PMID:17000779
    supporting_text: Disruption of the Gli3-MED12 interaction through dominant-negative interference
      inhibited, while RNA interference-mediated MED12 depletion enhanced, both MBD transactivation
      function and Gli3 target gene induction in response to Shh signaling.
suggested_questions:
- question: How should routine gene-level annotations represent the distinct full-length activator
    and processed repressor products already distinguished in curated human GO-CAM activities,
    without treating them as splice isoforms?
- question: For the transferred part_of axoneme assertion, should the relation and compartment
    be revised to located_in ciliary tip? The donor experiment localizes Gli3 to tips but
    does not resolve the exact axonemal association.
- question: Do the SPOP-associated GLI3 nuclear foci have the splicing-factor markers required
    for the nuclear-speck annotation?
- question: Which target-specific experiment supports the transcriptional-regulation IDA from
    PMID:24311597, beyond the demonstrated human GLI3 peptide interaction and inspected GLI1
    reporter assay?
- question: What evidence supports the precise negative thymocyte-differentiation transfers
    and digit-morphogenesis assertion whose primary details remain inaccessible or unresolved?
    Preserve stromal versus thymocyte-intrinsic effects and mouse versus human scope.
suggested_experiments:
- hypothesis: Full-length and processed GLI3 occupy partially overlapping regulatory sites
    with different transcriptional outputs.
  description: Combine validated product-specific immunoprecipitation with endogenous N- and
    C-terminal tagging, protein measurements and matched transcriptional profiling. Calibrate
    enrichment and avoid treating simple subtraction of two ChIP signals as a quantitative
    repressor-specific profile.
  experiment_type: Chromatin profiling with product-specific controls
- hypothesis: The GLI3 ciliary-base and tip pools have distinct trafficking kinetics.
  description: Image endogenous GLI3 with validated base, tip and axoneme markers during Hedgehog
    stimulation, resolving molecular proximity and product identity alongside residence time.
  experiment_type: Endogenous imaging
- hypothesis: SPOP-associated GLI3 nuclear foci correspond to a defined nuclear compartment.
  description: Test colocalization with independent splicing-speck markers at endogenous expression
    levels and quantify recruitment after controlled SPOP perturbation.
  experiment_type: Compartment-specific imaging
