- term:
    id: GO:0000122
    label: negative regulation of transcription by RNA polymerase II
  evidence_type: IDA
  original_reference_id: PMID:10693759
  qualifier: acts_upstream_of_or_within
  review:
    summary: Repression of RNA polymerase II target genes by the processed N-terminal form GLI3R.
      Wang et al. showed that PKA-dependent processing of full-length GLI3 in the developing limb
      generates a potent repressor whose abundance is graded along the anteroposterior axis and antagonised
      by posterior Sonic hedgehog. This annotation concerns the repressor product (UniProtKB:P10071-PRO_0000406137).
    action: ACCEPT
    reason: This is the defining molecular output of GLI3 and the reason GLI3 is the principal repressor-forming
      GLI paralog. The cited work establishes both that the repressor is generated by regulated proteolysis
      and that it is the quantitatively dominant species, so the negative-regulation-of-Pol-II-transcription
      term is retained as a core process.
    supported_by:
    - reference_id: PMID:10693759
      supporting_text: We demonstrate that PKA-dependent processing of vertebrate Gli3 in developing
        limb similarly generates a potent repressor in a manner antagonized by apparent long-range
        signaling from posteriorly localized Sonic hedgehog protein.
    - reference_id: PMID:10693759
      supporting_text: The high relative abundance and potency of Gli3 repressor suggest specialization
        of Gli3 and its products for negative Hedgehog pathway regulation.
