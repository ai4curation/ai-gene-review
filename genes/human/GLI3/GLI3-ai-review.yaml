  - reference_id: PMID:10693759
    supporting_text: The high relative abundance and potency of Gli3 repressor suggest specialization
      of Gli3 and its products for negative Hedgehog pathway regulation.
  - reference_id: PMID:19084012
    supporting_text: Overexpression studies confirm that the N-terminal parts harbor gene repression
