    supporting_text: Gli3 Rep was efficiently coprecipitated with HDAC1, indicating that HDAC1 and
      GLI3 Rep associate with one another.
- description: Activation of Hedgehog target genes by the unprocessed full-length form (UniProtKB:P10071-PRO_0000047202).
    When Smoothened is active, processing is blocked, full-length GLI3 accumulates at the ciliary
    tip and is released from SUFU, then acts in the nucleus on GLI-site promoters such as GLI1 and
    PTCH1, recruiting CBP and the MED12 interface of Mediator through its C-terminal transactivation
    domain. This is the minor but genuine activator arm of GLI3 function, and the activity assigned
    to the GLI3 activator product in the curated human Hedgehog GO-CAM.
