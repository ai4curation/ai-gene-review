      and GLI3 Rep associate with one another.
- description: 'Full-length GLI3 (PRO_0000047202) can activate Hedgehog-responsive transcription
    through its C-terminal activation region and interactions with CBP and Mediator. MED12
    binding is regulatory rather than uniformly activating: its depletion enhanced GLI3 output
    in the studied context.'
