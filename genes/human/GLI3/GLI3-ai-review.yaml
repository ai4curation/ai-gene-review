- term:
    id: GO:0003700
    label: DNA-binding transcription factor activity
  evidence_type: IDA
  original_reference_id: PMID:10077605
  qualifier: enables
  review:
    summary: Full-length GLI3 localised to the cytoplasm and activated PTCH1 expression, while the
      Pallister-Hall truncation product behaved like Ci75, entering the nucleus and repressing GLI3-activated
      PTCH1 transcription. The activating form assayed here is the full-length activator (UniProtKB:P10071-PRO_0000047202).
    action: MODIFY
    reason: The generic DNA-binding transcription factor term understates what this paper shows. GLI3
      is an RNA polymerase II factor, and the assay measures activation of a Pol II target promoter
      by the full-length form, so the Pol II-specific activator term is the precise fit. This is also
      the molecular function assigned to the GLI3 activator in the curated human Hedgehog GO-CAM.
    proposed_replacement_terms:
    - id: GO:0001228
      label: DNA-binding transcription activator activity, RNA polymerase II-specific
    supported_by:
    - reference_id: PMID:10077605
      supporting_text: Here we show that full-length GLI3 localizes to the cytoplasm and activates
        PTCH1 expression, which is similar to full-length Ci155.
    - reference_id: PMID:10077605
      supporting_text: PHS mutant protein (GLI3-PHS) localizes to the nucleus and represses GLI3-activated
        PTCH1 expression, which is similar to Ci75.
