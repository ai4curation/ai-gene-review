- id: file:human/GLI3/GLI3-source-guide.md
  title: GLI3 source guide
  findings: []
description: GLI3 is a C2H2 zinc-finger transcription factor that mediates Hedgehog-dependent
  gene regulation. The 1580-residue human protein recognizes GLI regulatory DNA sites and
  can act as a transcriptional activator. Regulated partial proteolysis produces an N-terminal
  repressor, GLI3R, that retains DNA recognition but lacks the C-terminal activation region.
  These are proteolytic products, not alternative splice isoforms. Full-length GLI3 undergoes
  regulated cytoplasmic, ciliary and nuclear trafficking; the repressor acts in the nucleus.
  SUFU, phosphorylation and ubiquitin-dependent processing control the balance of these activities.
  Nuclear GLI3 engages transcriptional regulatory complexes, with mechanisms depending on
  its product and cellular context. Its developmental roles include limb, craniofacial and
  nervous-system patterning. Pathogenic human variants cause disorders including Greig cephalopolysyndactyly
  and Pallister-Hall syndromes.
core_functions:
- description: GLI regulatory-site recognition supplies sequence specificity for nuclear transcriptional
    control. Both full-length GLI3 and its N-terminal repressor retain the zinc-finger DNA-binding
    region.
