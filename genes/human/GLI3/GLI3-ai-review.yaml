  review:
    summary: Phylogenetic assertion, placed on the Ci/GLI node, that family members bind RNA polymerase
      II cis-regulatory regions in a sequence-specific manner.
    action: ACCEPT
    reason: 'The node placement is sound: sequence-specific GLI-site binding through five C2H2 zinc
      fingers is shared by Drosophila Ci and all vertebrate GLI paralogs, and GLI3 lies squarely inside
      that clade with its own experimental grounding. GLI3 appearing in its own WITH/FROM list is
      the expected marker that the IBD node was seeded in part by experimental evidence on this gene.'
    supported_by:
    - reference_id: PMID:2118997
      supporting_text: Furthermore, when produced in vitro, the GLI3 protein bound specifically to
        genomic DNA fragments containing GLI-binding sites.
    - reference_id: PMID:10075717
      supporting_text: GLI3 directly binds to the Gli1 promoter and induces Gli1 transcription in
        response to Shh.
