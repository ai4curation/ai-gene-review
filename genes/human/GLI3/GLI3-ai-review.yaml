suggested_questions:
- question: Should GO adopt form-specific annotation for GLI3 as a matter of routine, attaching GO:0001227
    to UniProtKB:P10071-PRO_0000406137 and GO:0001228 to UniProtKB:P10071-PRO_0000047202, as the curated
    human Hedgehog GO-CAM already does? At present the gene-level GOA record carries only the undirected
    parents GO:0003700 and GO:0000981, which loses the single most important fact about the gene.
- question: How much of the human ciliary-base localisation of GLI3 is a genuine steady-state pool,
    and how much is inferred from the fact that processing requires ciliary transit? GFP-tagged Gli
    proteins were not detected at the basal body in mouse limb bud cells, yet six Reactome reactions
    and one ARBA rule place GLI3 there.
- question: Do the stage-dependent positive and negative effects of Gli3 on alpha-beta thymocyte differentiation,
    established in mouse mutants, hold for human GLI3, and is there any thymic phenotype in Greig
    or Pallister-Hall syndrome that would justify propagating those terms to the human gene?
- question: Is the GLI3R-beta-catenin interaction a general mechanism of Hedgehog-Wnt crosstalk, or
    restricted to the neural tube context in which it was demonstrated? This determines whether GO:0090090
    should be treated as a core GLI3 process or as the context-limited activity recorded here.
suggested_experiments:
- hypothesis: The two GLI3 proteolytic products have non-overlapping genomic binding repertoires,
    not merely opposite effects at shared sites.
  description: Perform form-resolved ChIP-seq in a human cell line by tagging the endogenous locus
    with an N-terminal epitope (labelling both products) and a C-terminal epitope (labelling only
    the full-length activator), in the presence and absence of Smoothened agonist. Subtracting the
    C-terminal from the N-terminal profile gives the GLI3R-specific cistrome and would establish whether
    GLI3R occupies sites the activator never reaches.
  experiment_type: ChIP-seq
- hypothesis: The ciliary-base pool of GLI3 is a transient processing intermediate rather than a resting
    reservoir.
  description: Use live-cell single-molecule imaging of endogenously tagged GLI3 in ciliated human
    cells, combined with proteasome and SCF(beta-TrCP) inhibition, to measure dwell times at the ciliary
    base with and without Hedgehog stimulation. A short, inhibitor-extended dwell time would support
    the transient-intermediate interpretation and would refine the ciliary-base cellular component
    annotations.
  experiment_type: live-cell imaging
- hypothesis: SKI-bridged deacetylase recruitment and the HDAC-independent N-terminal repressor domain
    act on distinct subsets of GLI3R target genes.
  description: Compare transcriptional output in cells expressing GLI3R, GLI3R carrying a SKI-binding-deficient
    mutation, and GLI3R lacking residues 106-236, under HDAC inhibition and without it. Genes that
    lose repression only in one arm would map the division of labour between the two repression mechanisms.
  experiment_type: RNA-seq with structure-function mutants
