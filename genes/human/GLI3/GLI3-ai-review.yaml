    supporting_text: We demonstrate that PKA-dependent processing of vertebrate Gli3 in developing
      limb similarly generates a potent repressor in a manner antagonized by apparent long-range
      signaling from posteriorly localized Sonic hedgehog protein.
  - reference_id: PMID:10693759
    supporting_text: The high relative abundance and potency of Gli3 repressor suggest specialization
