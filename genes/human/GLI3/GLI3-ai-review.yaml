  qualifier: enables
  review:
    summary: Methylation-sensitive SELEX determination of the DNA-binding specificity of human transcription
      factors, including measurement of binding to defined double-stranded sequences.
    action: ACCEPT
    reason: A systematic in vitro binding measurement, and the most precise DNA-binding term available
