  review:
    summary: Crystal and SAXS structures of full-length human SUFU in complex with the conserved GLI
      SYGHL motif, defining the GLI-SUFU interface and the conformational change that accompanies
      binding.
    action: ACCEPT
    reason: 'Structural evidence for a defined, named complex. This is the informative machine-readable
      statement about the GLI3-SUFU association, and it is the reason the several generic protein-binding
      rows citing SUFU are removed rather than modified: the content they lack is recorded here. The
      complex holds full-length GLI3 inactive in the cytoplasm.'
    supported_by:
    - reference_id: PMID:24311597
      supporting_text: Here, the crystal and small-angle X-ray scattering structures of full-length
        human SUFU and its complex with the key SYGHL motif conserved in all GLIs are reported.
    - reference_id: PMID:24311597
      supporting_text: SUFU is an essential intracellular negative regulator of mammalian Hedgehog
        signalling and acts by binding and modulating the activity of GLI transcription factors.
