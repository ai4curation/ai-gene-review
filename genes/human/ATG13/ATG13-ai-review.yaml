  review:
    summary: ULK1C (including ATG13) and PI3KC3-C1 coassemble into a supercomplex in vitro.
    action: MARK_AS_OVER_ANNOTATED
    reason: ATG13 is not a subunit of the class III PI3K complex; the contacts in the supercomplex are
