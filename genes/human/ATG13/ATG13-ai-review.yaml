core_functions:
- description: Non-catalytic regulatory subunit of the ULK1/2 complex that bridges ULK1/2 to FIP200 and
    ATG101, stabilizes ULK and stimulates its kinase activity at phagophore assembly sites to initiate
    autophagosome formation.
  molecular_function:
    id: GO:0019887
    label: protein kinase regulator activity
  directly_involved_in:
  - id: GO:0000045
    label: autophagosome assembly
  - id: GO:0000423
    label: mitophagy
  locations:
  - id: GO:0000407
    label: phagophore assembly site
  - id: GO:0005829
    label: cytosol
  in_complex:
    id: GO:1990316
    label: Atg1/ULK1 kinase complex
  supported_by:
  - reference_id: PMID:19225151
    supporting_text: The binding of Atg13 stabilizes and activates ULK and facilitates the phosphorylation
      of FIP200 by ULK, whereas knockdown of Atg13 inhibits autophagosome formation.
  - reference_id: PMID:19225151
    supporting_text: The mammalian Atg13 binds both ULK1 and ULK2 and mediates the interaction of the
      ULK proteins with FIP200.
  - reference_id: PMID:19211835
    supporting_text: Here, we report a novel mammalian autophagy factor, Atg13, which forms a stable approximately
      3-MDa protein complex with ULK1 and FIP200.
  - reference_id: PMID:19211835
    supporting_text: Atg13 localizes on the autophagic isolation membrane and is essential for autophagosome
      formation.
  - reference_id: PMID:21855797
    supporting_text: required for the phosphorylation and release of Atg13 from Ulk1, and for the recruitment
      of Atg13 to damaged mitochondria
suggested_questions:
- question: How do mTORC1 and ULK1 phosphorylation sites on ATG13 change its binding to ULK1, FIP200 and
    Atg8-family proteins, and does ATG13 dissociate from ULK1 during mitophagy as reported?
- question: What partners occupy the animal-specific hydrophobic pockets of the ATG13-ATG101 HORMA heterodimer?
suggested_experiments:
- description: Reconstitute ULK1 kinase activity with purified FIP200, ATG101 and wild-type versus MIM-
    or LIR-mutant ATG13 on liposomes to separate kinase activation from membrane recruitment.
  hypothesis: ATG13 MIM binding stimulates ULK1 activity, while the LIR and HORMA domains mainly control
    membrane recruitment.
