    label: autophagosome
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - AGI_LocusCode:AT3G49590
  - CGD:CAL0000176796
  - PANTHER:PTN001268151
  review:
    summary: ATG13 acts at the phagophore assembly site and isolation membrane, not on completed autophagosomes.
    action: MARK_AS_OVER_ANNOTATED
    reason: The ULK1 complex is an initiation factor that is recruited to nascent autophagic membranes
      and released before or upon closure. Phagophore assembly site is the accurate location; the completed-autophagosome
      term overstates where ATG13 resides.
    supported_by:
    - reference_id: PMID:19211835
      supporting_text: Atg13 localizes on the autophagic isolation membrane and is essential for autophagosome
        formation.
