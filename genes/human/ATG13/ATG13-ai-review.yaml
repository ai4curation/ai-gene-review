- term:
    id: GO:0000045
    label: autophagosome assembly
  evidence_type: IDA
  original_reference_id: PMID:19225151
  qualifier: involved_in
  review:
    summary: ATG13 is an essential, non-catalytic subunit of the ULK1/2 complex and is required for autophagosome
      formation.
    action: ACCEPT
    reason: Knockdown of ATG13 blocks autophagosome formation, and ATG13 resides on the isolation membrane
      as part of the ULK1-ATG13-FIP200-ATG101 initiation complex. This is direct participation in autophagosome
      assembly at its initiating step.
    supported_by:
    - reference_id: PMID:19225151
      supporting_text: The binding of Atg13 stabilizes and activates ULK and facilitates the phosphorylation
        of FIP200 by ULK, whereas knockdown of Atg13 inhibits autophagosome formation.
    - reference_id: PMID:19211835
      supporting_text: Atg13 localizes on the autophagic isolation membrane and is essential for autophagosome
        formation.
