  review:
    summary: Piecemeal microautophagy of the nucleus is characterized in budding yeast; no ATG13-dependent
      equivalent route has been shown in human cells.
    action: MARK_AS_OVER_ANNOTATED
    reason: The PAINT assertion derives from yeast Atg13. The general initiation role of ATG13 is captured
      by other terms; until a mammalian piecemeal nuclear microautophagy route is demonstrated, this transfer
      adds a route-specific claim without target support. The human ULK1 review leaves the equivalent
      row UNDECIDED for the same reason.
