- term:
    id: GO:0000423
    label: mitophagy
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:1196429
  - PANTHER:PTN001268151
  - PomBase:SPAC4F10.07c
  review:
    summary: ATG13 is phosphorylated by ULK1, released and recruited to damaged mitochondria, and is required
      for efficient mitophagy.
    action: ACCEPT
    reason: Direct experimental support that ATG13 phosphorylation and recruitment to damaged mitochondria
      are required for mitochondrial clearance; ULK1-complex dependent mitophagy is also the conserved
      PAINT assertion.
    supported_by:
    - reference_id: PMID:21855797
      supporting_text: required for the phosphorylation and release of Atg13 from Ulk1, and for the recruitment
        of Atg13 to damaged mitochondria
    - reference_id: PMID:21855797
      supporting_text: Hsp90-Cdc37, Ulk1, and Atg13 phosphorylation are all required for efficient mitochondrial
        clearance.
