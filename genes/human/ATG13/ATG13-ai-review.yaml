      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN001268151
        source_label: PTN001268151
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: The ATG13-family node is sound for autophagy initiation; the completed-autophagosome
          location is broader than the phagophore assembly site where ATG13 acts.
