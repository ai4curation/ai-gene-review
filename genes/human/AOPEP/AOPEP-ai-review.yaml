description: 'AOPEP (aminopeptidase O, C9orf3) is an 819-residue member of the M1 zinc metallopeptidase
  family. It has a conserved HEXXH...E zinc-binding catalytic motif and a C-terminal nucleolar localization
  signal. Alternative splicing gives isoforms with or without the catalytic domain and the nucleolar signal.
  In transfected cells a GFP-tagged mouse protein localizes to the nucleolus, and forms lacking the signal
  stay in the cytoplasm. In mouse, a gene-trap reporter is expressed mainly in blood vessels. The protein
  is widely expressed in human brain, and biallelic loss-of-function variants cause autosomal recessive
  progressive dystonia. Its substrates and physiological function are unknown: the one report of its peptidase
  activity, including cleavage of angiotensin III, was withdrawn.'
