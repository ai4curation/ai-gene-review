- term:
    id: GO:0070006
    label: metalloaminopeptidase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR033577
  review:
    summary: Metalloaminopeptidase activity (IEA, InterPro AOPEP family). UniProt asserts aminopeptidase
      function by similarity to aminopeptidase N. However, AOPEP lacks the GXMEN motif that gives M1 enzymes
      their aminopeptidase specificity, and the only experimental report of aminopeptidase activity was
      withdrawn. Metallopeptidase chemistry is supported; exopeptidase specificity is not. Left undecided.
    action: UNDECIDED
    reason: 'UniProt''s function line is a by-similarity transfer from aminopeptidase N: [file:human/AOPEP/AOPEP-uniprot.txt
      "CC   -!- FUNCTION: Aminopeptidase which catalyzes the hydrolysis of amino acid"] The same transfer
      is enough for the zinc ligands and catalytic base, which are conserved, but not for specificity.
      A motif scan finds no GXMEN: [file:human/AOPEP/AOPEP-bioinformatics/RESULTS.md "AOPEP keeps the
      HEXXH zinc motif (HEIAH at 479) but has no GXMEN motif, even under a relaxed G.M.N pattern, whereas
      the three characterised M1 aminopeptidases each have GXMEN 27 to 36 residues upstream of their HEXXH
      motif."] The experimental support is gone: [PMID:30808004 "Withdrawal: Identification of human aminopeptidase
      O, a novel metalloprotease with structural similarity to aminopeptidase B and leukotriene A(4) hydrolase."]
      [file:human/AOPEP/AOPEP-uniprot.txt "expression patterns of this protein has been retracted due
      to concerns"]'
    supported_by:
    - reference_id: file:human/AOPEP/AOPEP-uniprot.txt
      supporting_text: 'CC   -!- FUNCTION: Aminopeptidase which catalyzes the hydrolysis of amino acid'
    - reference_id: file:human/AOPEP/AOPEP-bioinformatics/RESULTS.md
      supporting_text: AOPEP keeps the HEXXH zinc motif (HEIAH at 479) but has no GXMEN motif, even under
        a relaxed G.M.N pattern, whereas the three characterised M1 aminopeptidases each have GXMEN 27
        to 36 residues upstream of their HEXXH motif.
    - reference_id: PMID:30808004
