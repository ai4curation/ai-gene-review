proposed_new_terms: []
knowledge_gaps:
- gap_statement: No valid study has assayed AOPEP peptidase activity or identified a substrate. The one
    biochemical characterization, including angiotensin III cleavage, was withdrawn, and no biological
    process can be assigned despite a clear dystonia phenotype in humans lacking the protein.
  boundary: 'Established: an intact M1 zinc-metallopeptidase catalytic motif (by similarity), a functional
    nucleolar localization signal (mouse protein, overexpressed), spliced isoforms with and without these
    elements, brain expression, and recessive loss-of-function dystonia. Not established: catalytic activity,
    substrate specificity, endogenous location, and the process disrupted in dystonia.'
  gap_kind:
  - BIOLOGY
  dark_aspect: WHOLLY_DARK
  status: OPEN
  significance: AOPEP loss causes a recognised recessive dystonia, so identifying what the enzyme cleaves,
    and where, is the route to the disease mechanism.
  resolution: Purify recombinant human AOPEP, test hydrolysis of aminopeptidase substrates and neuropeptides
    with catalytic-residue mutants as controls, and localize the endogenous protein in neurons.
suggested_questions:
- question: Where is endogenous AOPEP? The only nucleolar evidence is an overexpressed mouse GFP fusion
    in COS7 cells, and Human Protein Atlas immunofluorescence reports cell junctions instead.
- question: Given the withdrawal of the enzymology paper, is there any independent evidence that AOPEP
    is catalytically active, and is it an aminopeptidase rather than an endopeptidase?
suggested_experiments:
- description: Assay purified wild-type and E480Q AOPEP against aminoacyl-amide substrates and angiotensin
    peptides, and profile neuronal peptidomes in AOPEP-knockout cells.
