  review:
    summary: Unresolved receptor-capacity inference at an actual ancestor of A1BG. The mature secreted
      Ig-domain protein has no annotated transmembrane segment or cytoplasmic signaling tail, a relevant
      divergence from many family receptors. Nevertheless, secretion alone cannot exclude a membrane-associated
      signaling role, and mouse A1BG surface association is experimentally observed.
    action: UNDECIDED
    reason: P04217 descends from receptor IBD PTN002621170. GO:0004888 describes ligand-dependent transmission
      of a signal across a membrane; its definition does not say that every component must independently
      span the membrane. The completed OpenScientist report and independently reproduced hydropathy
      calculation support absence of a conventional membrane-spanning helix, a relevant mechanistic
      divergence, but do not demonstrate loss of every receptor-complex role. The report admits that
      it inferred topology from family membership rather than tracing the target and overlooks the
      ortholog surface experiment. Neither peripheral association nor cellular NAMPT stabilization
      demonstrates receptor activity. Retain UNDECIDED without asserting NOT or replacing an unresolved
      ancestral capacity by a different supported activity.
