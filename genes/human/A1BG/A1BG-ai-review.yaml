core_functions:
- description: Extracellular binding and selective sequestration of CRISP proteins. Human A1BG forms a
    high-affinity plasma complex with CRISP3. Recombinant A1BG inhibits CRISP2 cholesterol-sulfate binding
    through a magnesium-dependent interaction involving immunoglobulin domain 3 and reduces CAP-dependent
    sterol export in a yeast reconstruction. These experiments establish a molecular inhibitory capacity;
    its contribution to healthy human sterol physiology and the inhibitory versus carrier role of the
    CRISP3 complex remain unresolved.
  molecular_function:
    id: GO:0140311
    label: protein sequestering activity
  locations:
  - id: GO:0005576
    label: extracellular region
  supported_by:
  - *id002
  - reference_id: file:human/A1BG/A1BG-uniprot.txt
    supporting_text: Interacts with CRISP3.
suggested_questions:
- question: Which CRISP activities are restrained by endogenous A1BG in healthy human plasma, and
    does CRISP3 binding primarily inhibit activity or form a transport/reservoir complex?
- question: Does membrane-associated A1BG transmit a ligand-dependent signal through a receptor complex,
    or does it provide another surface-associated function? Mouse atrial cardiomyocyte surface staining
    in PMID:40270023 establishes that secretion is compatible with a membrane pool.
- question: Does the complete experimental record behind mouse A1bg GO:0060396 establish work by
    the protein in GH receptor signaling, beyond GH-dependent transcript expression? The completed
    report supplies no independently verifiable full-text assay provenance; obtain the original full
    paper or curator assessment rather than another duplicate literature synthesis.
- question: How does A1BG association alter NAMPT lysosomal turnover in osteosarcoma cells, and is
    this mechanism used outside that cancer setting? Co-immunoprecipitation and colocalization do
    not alone prove purified binary binding.
- question: Which membrane partners explain the sex-dependent cardiac requirement for mouse A1BG,
    and are equivalent surface pools present in human cardiomyocytes?
suggested_experiments:
- hypothesis: A1BG is a general extracellular sequestering factor for CAP-superfamily proteins, with magnesium-dependent
    specificity determined by Ig domain 3.
  description: Surface plasmon resonance and isothermal titration calorimetry with purified human A1BG
    against a panel of human CAP-superfamily proteins (CRISP1, CRISP2, CRISP3, GLIPR1, GAPR1), with and
    without Mg2+, and with an Ig-domain-3 deletion/point-mutant series, to define the sequestering specificity
    in a purely human system.
  experiment_type: binding assay
- hypothesis: A1BG blocks CAP-protein function by occluding the sterol-binding cavity of the CAP domain.
  description: Structure determination by cryo-EM or crystallography of the A1BG Ig-domain-3/CRISP2 complex,
    to establish how the Ig domain engages the CAP domain relative to its sterol-binding cavity and its
    conserved Mg2+-coordinating tetrad.
  experiment_type: structural biology
- hypothesis: Loss of A1BG releases functionally active CRISP into the circulation.
  description: Assay plasma from A1bg-null mice (and, if available, from humans with A1BG loss-of-function
    variants) for free versus A1BG-complexed CRISP3 by size-exclusion chromatography and immunoprecipitation,
    and test CRISP-dependent sterol transfer activity in the two fractions.
  experiment_type: genetic and biochemical
- hypothesis: CRISP proteins are the dominant physiological ligands of circulating A1BG.
  description: Immunoprecipitate endogenous A1BG from human plasma and quantify co-purifying proteins
    by label-free or isotope-labelled mass spectrometry, to determine whether CRISP proteins dominate
    stoichiometrically or whether NAMPT and other reported partners are also present at meaningful levels.
  experiment_type: interaction proteomics
