- id: PMID:3458201
  title: 'Amino acid sequence of human plasma alpha 1B-glycoprotein: homology to the
    immunoglobulin supergene family.'
  findings:
  - statement: >-
      A1BG was purified from human plasma and completely sequenced, establishing it as a
      circulating plasma protein of unknown function.
    supporting_text: >-
      The complete amino acid sequence has been determined for alpha 1B-glycoprotein
      (alpha 1B), a protein of unknown function present in human plasma.
  - statement: >-
      The protein is built from five repeated immunoglobulin-like structural domains
      arising by internal duplication, placing it in the immunoglobulin supergene family.
    supporting_text: >-
      consists of five repeating structural domains, each containing about 95 amino
      acids and one disulfide bond
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Cached record title matches. Defining structural and biochemical paper for A1BG and
      the direct source of the IDA extracellular-region annotation; also the basis for
      rejecting a transmembrane-receptor interpretation.
- id: PMID:15461460
  title: Cysteine-rich secretory protein 3 is a ligand of alpha1B-glycoprotein in human
    plasma.
  findings:
  - statement: >-
      CRISP3 circulates in human plasma bound to A1BG; the complex is specific,
      noncovalent, 1:1 and of nanomolar affinity.
    supporting_text: >-
      We demonstrate that CRISP-3 is a specific and high-affinity ligand of A1BG with a
      dissociation constant in the nanomolar range as evidenced by surface plasmon
      resonance.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Cached record title matches. Abstract-only, but the binding data quoted are stated
      in the abstract. This is the interaction curated by UniProt ("Interacts with
      CRISP3") and a primary support for the proposed protein-sequestering activity.
- id: PMID:16723264
  title: A liver specific gene that is expressed in growth hormone transgenic mice and
    in normal female mice as a function of age.
  findings:
  - statement: >-
      Mouse A1bg ("cDNA #5") was isolated as a transcript induced in the liver of growth
      hormone transgenic mice and absent from GH-deficient, GH-antagonist and
      GH-receptor-knockout mice, showing that its expression requires an intact GH-GH
      receptor axis.
    supporting_text: >-
      These findings suggest that induction of mRNA #5 in the liver requires a
      continuous pattern of GH secretion and an intact GH-GH receptor-signaling complex.
  - statement: >-
      The encoded protein has five immunoglobulin-related domains and is similar to rat
      and human alpha-1-B glycoprotein, an acidic serum protein of unknown function.
    supporting_text: >-
      P5 has five immunoglobulin related domains thus allowing it to be classified as a
      member of the immunoglobulin super family (IGSF).
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Cached record title matches the citation, and the paper is genuinely about the A1BG
      ortholog. VERIFIED refers to its use *in this document*, where it is cited only for
      GH-dependent hepatic induction of mouse A1bg, which it does support. The problem is
      upstream, not here: this paper is the sole support for the mouse MGI IMP to GO:0060396
      (growth hormone receptor signaling pathway), from which the human IBA derives, yet it
      demonstrates only transcriptional induction - a downstream target relationship, not
      participation in the GH receptor signalling cascade. That critique is recorded in the
      annotation's propagation_review and in suggested_questions rather than as a
      correctness flag here, so that flag aggregation is not misled. Note the cache is
      abstract-only, so the critique is built from the abstract; the abstract is however
      explicit about the experimental design (subtractive hybridisation for
      GH-transgene-induced liver transcripts).
- id: PMID:39433128
  title: Alpha-1-B glycoprotein (A1BG) inhibits sterol-binding and export by CRISP2.
  findings:
  - statement: >-
      A1BG binding to CAP-superfamily proteins inhibits their sterol binding in vitro
      and abolishes their sterol export function in a yeast reconstitution system.
    supporting_text: >-
      Coexpression of A1BG with CAP proteins abolished their sterol export function in
      yeast and their interaction inhibits sterol-binding in vitro.
  - statement: >-
      The CRISP2 contact site is the third of the five immunoglobulin-like domains of
      A1BG and the interaction requires magnesium.
    supporting_text: >-
      We map the interaction between A1BG and CRISP2 to the third of five repeated
      immunoglobulin-like domains within A1BG.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Cached full text matches the cited title. Provides functional (not merely binding)
      evidence that A1BG blocks a partner protein's activity, which is the basis for the
      GO:0140311 proposal.
- id: PMID:40270023
  title: Sex-specific response to A1BG loss results in female dilated cardiomyopathy.
  findings:
  - statement: >-
      Conditional cardiomyocyte deletion of A1bg in mice causes dilated cardiomyopathy
      in females but not males, indicating a sex-specific cardiac requirement.
    supporting_text: >-
      The glycoprotein A1BG has emerged as a female-specific regulator of cardiac
      structure and integrity
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Cached full text matches the cited title. Mouse genetics; recorded as a knowledge
      gap rather than used for a human GO process annotation, since the mechanism linking
      a secreted plasma protein to a cardiomyocyte-autonomous phenotype is unresolved.
- id: PMID:40560034
  title: Adipocytes Promote Cisplatin Resistance through Secreting A1BG and Regulating
    NAMPT/PARP1 Axis-Mediated DNA Repair in Osteosarcoma.
  findings:
  - statement: >-
      Adipocyte-secreted A1BG binds NAMPT directly, stabilising it and raising NAD+
      levels, which enhances PARP1-dependent DNA repair and cisplatin resistance.
    supporting_text: >-
      Further investigation revealed a direct interaction between A1BG and NAMPT,
      leading to the stabilization of NAMPT and an increased NAD+ production.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Cached record title matches. Single-study, cancer-context mechanism; noted but not
      annotated, pending independent replication.
