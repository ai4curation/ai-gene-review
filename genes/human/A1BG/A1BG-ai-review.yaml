- id: file:human/A1BG/A1BG-deep-research-affinage.md
  title: Affinage mechanistic annotation for A1BG (human)
  findings:
  - statement: >-
      Machine-fetched Affinage record (trust gates passed; accession P04217 matches the
      local UniProt entry) describing A1BG as a secreted immunoglobulin-like plasma
      glycoprotein acting through protein-protein interactions with CRISP2 and NAMPT. It
      contains no membrane-receptor or growth-hormone-signalling content, independently
      corroborating the IBA removals.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      External precomputed LLM research, treated as a preliminary source. Every claim
      used here was re-verified against the cited primary PMIDs. Its own GO grounding
      (GO:0098772 molecular function regulator activity) was deliberately not imported;
      the specific descendant GO:0140311 was used instead.
