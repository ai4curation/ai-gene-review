- term:
    id: GO:0004888
    label: transmembrane signaling receptor activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: >-
      Same over-propagation problem as the plasma-membrane IBA, and from the same
      PANTHER node. "Transmembrane signaling receptor activity" requires a protein that
      spans the membrane and transduces a signal across it; A1BG has no transmembrane
      segment, no cytoplasmic signalling tail (no ITIM/ITAM), and is secreted into
      plasma. The activity has been inferred purely from the LILR/KIR-like receptors
      that dominate PTHR11738. No experimental study has reported receptor or
      signal-transduction activity for A1BG; the documented molecular activity is
      binding and sequestration of CAP/CRISP proteins in extracellular fluid.
    action: REMOVE
    reason: >-
      Physically impossible for a secreted, non-membrane protein; a family-level
      inference that does not apply to this divergent soluble member. Replaced by the
      proposed GO:0140311 protein sequestering activity, which is what A1BG actually
      does.
    propagation_review:
