  review:
    summary: >-
      Over-propagated phylogenetic inference. A1BG sits in PANTHER family PTHR11738
      ("MHC class I NK cell receptor"), the LILR/KIR leukocyte-receptor family. Every
      non-A1BG source gene in this annotation's WITH/FROM field that I resolved
      (PANTHER:PTN002621170 plus UniProtKB:P24071 FCAR, P43626/Q14953/Q14954 KIR
      family, Q8N423/Q8NHL6/Q8NHJ6 LILR family) is a type-I transmembrane immune
      receptor; eight of the nineteen accessions were checked individually, and the
      family as a whole is dominated by transmembrane receptors, though it does also
      contain naturally soluble members. The IBA has carried the receptors'
      plasma-membrane location onto A1BG. A1BG
      itself is a soluble secreted plasma protein: UniProt annotates a cleaved signal
      peptide (1-21) and a mature chain (22-495) comprising five immunoglobulin-like
      domains, with keyword "Secreted" and NO transmembrane feature anywhere in the
      sequence. The mature protein was sequenced directly from human plasma. It cannot
      be "active in" the plasma membrane.
    action: REMOVE
    reason: >-
      IBA inherited from transmembrane immune receptors in the same PANTHER family;
      contradicted by the absence of any transmembrane segment and by the curated
      "Secreted" subcellular location. This removes an over-propagated phylogenetic
      inference on biological grounds; no experimental annotation is being overruled.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN002621170
        comment: >-
          LILR/KIR-like leukocyte receptor node of PTHR11738. Plasma-membrane
          localisation is correct for the transmembrane receptors of this node but not
          for A1BG, the divergent secreted member (subfamily PTHR11738:SF184).
      - source_id: UniProtKB:Q8NHL6
        comment: LILRB1, a type-I transmembrane leukocyte Ig-like receptor; genuinely plasma-membrane.
      - source_id: UniProtKB:P43626
        comment: KIR2DL1, a type-I transmembrane NK receptor; genuinely plasma-membrane.
    supported_by:
