    correctness: VERIFIED
    review_notes: Cached record title matches. Abstract-only, but the binding data quoted are stated
      in the abstract. This is the interaction curated by UniProt ("Interacts with CRISP3") and a
      primary support for the proposed protein-sequestering activity.
- id: PMID:16723264
  title: A liver specific gene that is expressed in growth hormone transgenic mice and in normal
    female mice as a function of age.
  findings:
  - statement: 'Mouse A1bg ("cDNA #5") was isolated as a transcript induced in the liver of growth
      hormone transgenic mice and absent from GH-deficient, GH-antagonist and GH-receptor-knockout
      mice, showing that its expression requires an intact GH-GH receptor axis.'
    supporting_text: 'These findings suggest that induction of mRNA #5 in the liver requires a continuous
      pattern of GH secretion and an intact GH-GH receptor-signaling complex.'
  - statement: The encoded protein has five immunoglobulin-related domains and is similar to rat
      and human alpha-1-B glycoprotein, an acidic serum protein of unknown function.
    supporting_text: P5 has five immunoglobulin related domains thus allowing it to be classified
      as a member of the immunoglobulin super family (IGSF).
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: 'Identifier/title and GH-dependent mouse expression agree with the cached PubMed
      abstract. VERIFIED covers that positive finding, not a complete audit of the MGI source: full
      text is unavailable here. Withdraw the previous confident claim that the source demonstrates
      only expression and was therefore erroneous.'
- id: PMID:39433128
  title: Alpha-1-B glycoprotein (A1BG) inhibits sterol-binding and export by CRISP2.
  findings:
  - statement: Recombinant A1BG binds CRISP2 and prevents its cholesterol-sulfate binding; A1BG alone
      does not bind that sterol. Yeast CAP-dependent sterol export falls by more than 50%, while
      palmitate binding and fatty-acid export remain intact. Ig-domain-3 binding and magnesium dependence
      are experimentally examined.
    supporting_text: this binding is blocked in the presence of A1BG, which by itself does not bind
      cholesterol sulfate
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full Results and assay figures reviewed, including purified-protein MST, reconstructed
      yeast export, domain truncations and fatty-acid controls. Supports selective partner inhibition;
      does not establish an endogenous human sterol-metabolism process or universal CAP inhibition.
- id: PMID:40270023
  title: Sex-specific response to A1BG loss results in female dilated cardiomyopathy.
  findings:
  - statement: Conditional cardiomyocyte deletion of A1bg in mice causes dilated cardiomyopathy in
      females but not males, indicating a sex-specific cardiac requirement.
    supporting_text: The glycoprotein A1BG has emerged as a female-specific regulator of cardiac
      structure and integrity
  - statement: A1BG/tropomyosin co-immunostaining of adult mouse hearts places A1BG at atrial cardiomyocyte
      surfaces (Fig. 4D). This directly contradicts an exclusive-soluble-location argument.
    supporting_text: A1BG is associated with the outer surface of atrial CMs.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Read full localization, cardiac deletion and interactome experiments. Fig. 4D supports
      an ortholog membrane pool; it is not a human IDA assay or proof of transmembrane signaling
      receptor activity.
- id: PMID:40560034
  title: Adipocytes Promote Cisplatin Resistance through Secreting A1BG and Regulating NAMPT/PARP1
    Axis-Mediated DNA Repair in Osteosarcoma.
  findings:
  - statement: In osteosarcoma models, co-immunoprecipitation and colocalization support A1BG-NAMPT
      association. A1BG depletion reduces NAMPT protein stability; cycloheximide chase and lysosomal
      inhibitor rescue implicate turnover. These cell assays do not establish purified binary binding
      or specifically stabilization of extracellular NAMPT.
    supporting_text: Co‐IP followed by western blot analysis confirmed a robust interaction between
      A1BG and NAMPT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full Figure 5 and surrounding Results read. Distinguish adipocyte secretion of
      A1BG from the subsequent cellular NAMPT stability assays. The authors use direct interaction
      language, but co-IP/colocalization alone do not establish a direct two-protein interaction.
      No NEW pathway annotation is proposed here.
