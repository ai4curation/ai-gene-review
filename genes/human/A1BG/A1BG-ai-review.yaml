id: P04217
gene_symbol: A1BG
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  A1BG (alpha-1B-glycoprotein) is an abundant, liver-derived secreted plasma
  glycoprotein built from five tandem immunoglobulin-like domains. It is
  synthesised with a cleaved N-terminal signal peptide and has no transmembrane
  segment, so although it belongs to the same immunoglobulin-superfamily branch as
  the leukocyte immunoglobulin-like (LILR/KIR) cell-surface receptors it is a
  soluble extracellular protein rather than a membrane receptor. A1BG has no known
  catalytic activity; it acts through its Ig-like domains as a high-affinity plasma
  binding partner for CAP-superfamily (cysteine-rich secretory, CRISP) proteins. It
  carries CRISP3 in plasma as a 1:1, nanomolar-affinity, noncovalent complex, and
  binding of A1BG to CRISP2 and other CAP proteins inhibits their sterol binding
  and abolishes their sterol-export activity; the interaction surface maps to the
  third of the five Ig-like domains and requires magnesium. Related plasma proteins
  of the same family neutralise snake-venom metalloproteinases through equivalent
  complexes, placing A1BG in a family of extracellular protein-sequestering and
  toxin-neutralising factors. A1BG is heavily N-glycosylated, is a routine
  constituent of plasma proteomes, extracellular vesicles and blood microparticles,
  and is placed in neutrophil and platelet granule-lumen exocytosis reactions by
  Reactome. In mouse, hepatic
  A1bg transcription is strongly growth-hormone dependent and sexually dimorphic,
  and cardiomyocyte-restricted deletion causes a female-specific dilated
  cardiomyopathy. Additional reported activities that are not yet independently
  established include stabilisation of secreted NAMPT.
