- id: file:human/A1BG/A1BG-deep-research-affinage.md
  title: Affinage mechanistic annotation for A1BG (human)
  findings:
  - statement: The report summarizes CRISP2 inhibition and NAMPT-associated effects. Its omission
      of membrane or GH functions is not evidence against those functions, and the mouse surface-localization
      experiments must be considered independently.
  reference_review:
    relevance: MEDIUM
    correctness: MISCITED
    review_notes: The entire report was read. Its positive biochemical leads were checked against
      primary papers; its lack of receptor/GH discussion was previously misused as corroboration
      of REMOVE. That unsupported negative use is withdrawn.
- id: file:human/A1BG/A1BG-hypotheses/membrane-receptor-and-growth-hormone-capacities/openscientist.md
  title: OpenScientist focused assessment of A1BG membrane, receptor and growth-hormone capacities
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: 'Full report, HTML/PDF, computational provenance and plot read. Canonical hydropathy
      result reproduced; useful GH expression-versus-participation distinction retained. Categorical
      REMOVE/NOT leads are not justified: mouse surface localization is missed, NAMPT compartment/directness
      overstated, topology explicitly not traced, and claimed complete GH-paper access lacks independently
      checkable provenance. Report incorporated without changing the standing calibrated actions
      or launching a duplicate.'
  findings:
  - statement: The report computes a low mature-chain hydropathy maximum, corroborating absence of
      a conventional canonical transmembrane helix; it does not test all membrane associations.
    supporting_text: 'maximum hydropathy score was

      **0.98**'
    finding_review:
      finding_status: CORROBORATED
      review_notes: Recomputed from the exact cached P04217 sequence with the same 19-residue window;
        the biological conclusion is restricted to the measured hydropathy profile.
      supported_by:
      - reference_id: file:human/A1BG/A1BG-bioinformatics/RESULTS.md
        supporting_text: the maximum 19-residue mean Kyte–Doolittle score among windows starting
          at residue 22 or later is 0.9842105263.
  - statement: The report asserts that structural evidence closes both receptor and membrane-pool
      routes. The membrane-pool exclusion is overturned by the mouse surface experiment, without
      establishing human receptor activity.
    supporting_text: 'structure closes the receptor and

      membrane-pool routes'
    finding_review:
      finding_status: OVERTURNED
      superseded_by:
      - PMID:40270023
      review_notes: No hydrophobic helix is required for a peripheral membrane pool. Mouse atrial
        cardiomyocyte surface localization is explicit in the primary Results and Fig. 4D; retain
        its organism and assay limits.
      supported_by:
      - reference_id: PMID:40270023
        supporting_text: A1BG is associated with the outer surface of atrial CMs.
  - statement: The report correctly identifies GH-dependent expression as insufficient by itself
      to demonstrate signaling work, but cannot independently verify the complete source assay record.
    supporting_text: High for transcriptional dependence; does not test protein signaling
  - statement: The report admits that its PAINT topology was inferred from family membership rather
      than independently traced; the actual target lineage must govern propagation review.
    supporting_text: PANTHER tree topology (PTN nodes) inferred from family membership, not traced
      node-by-node.
  - statement: The report treats NAMPT stabilization as an extracellular interaction; the primary
      assays concern cellular NAMPT abundance and association, without proving a purified binary
      complex.
    supporting_text: 'Both documented functions are extracellular

      protein-protein interactions.'
    finding_review:
      finding_status: DISPUTED
      superseded_by:
      - PMID:40560034
      review_notes: Fig. 5 co-IP and colocalization use osteosarcoma cells; CHX chase and inhibitor
        assays assess cellular protein turnover. Secretion of A1BG does not establish extracellular
        localization of the NAMPT complex.
      supported_by:
      - reference_id: PMID:40560034
        supporting_text: A1BG knockdown significantly reduced the half‐life of NAMPT in osteosarcoma
          cells
