- term:
    id: GO:0140311
    label: protein sequestering activity
  evidence_type: IDA
  original_reference_id: PMID:39433128
  qualifier: enables
  review:
    summary: >-
      Proposed new molecular function. After removing the incorrect receptor IBA, GOA
      leaves A1BG with no molecular function term at all, yet its activity is
      experimentally defined: A1BG binds CAP-superfamily (CRISP) proteins through the
      third of its five immunoglobulin-like domains in a magnesium-dependent manner, and
      this binding inhibits CRISP2 sterol binding in vitro and abolishes CAP-protein
      sterol export in vivo in a yeast reconstitution system [PMID:39433128].
      Independently, A1BG is the high-affinity (nanomolar Kd), 1:1 plasma carrier of
      CRISP3, holding it in a noncovalent complex in the circulation [PMID:15461460].
      Binding a partner protein so as to block that partner's own ligand binding and
      export function is precisely GO:0140311 "protein sequestering activity" - binding
      to a protein to prevent it from interacting with other partners or to inhibit its
      localization to the area where it is active. Related A1BG-like plasma proteins of
      opossum neutralise snake-venom metalloproteinases by the same complex-formation
      mechanism, supporting a family-wide extracellular sequestering role.
    action: NEW
    reason: >-
      Fills the molecular-function gap left by removing GO:0004888, and is more specific
      and more informative than a bare protein-binding term or than the coarse
      "molecular function regulator activity" grounding offered by the affinage report.
    additional_reference_ids:
    - PMID:15461460
    supported_by:
    - reference_id: PMID:39433128
      supporting_text: >-
        Coexpression of A1BG with CAP proteins abolished their sterol export function in
        yeast and their interaction inhibits sterol-binding in vitro.
    - reference_id: PMID:39433128
      supporting_text: >-
        We map the interaction between A1BG and CRISP2 to the third of five repeated
        immunoglobulin-like domains within A1BG.
    - reference_id: PMID:15461460
      supporting_text: >-
        We demonstrate that CRISP-3 is a specific and high-affinity ligand of A1BG with
        a dissociation constant in the nanomolar range as evidenced by surface plasmon
        resonance.
    - reference_id: file:human/A1BG/A1BG-deep-research-affinage.md
      supporting_text: >-
        this interaction inhibits CRISP2 sterol-binding in vitro and abolishes its
        sterol export function in yeast
core_functions:
- description: >-
    Extracellular sequestration of CAP-superfamily (CRISP) proteins. A1BG circulates in
    plasma and uses the third of its five immunoglobulin-like domains to bind CRISP
    proteins in a magnesium-dependent, high-affinity, 1:1 noncovalent complex. Complex
    formation blocks the partner's own activity - it inhibits CRISP2 sterol binding and
    abolishes CAP-protein sterol export - and holds CRISP3 in the circulation. The same
    mechanism in related plasma proteins of this family neutralises snake-venom
    metalloproteinases.
  molecular_function:
    id: GO:0140311
    label: protein sequestering activity
  locations:
  - id: GO:0005576
    label: extracellular region
  supported_by:
  - reference_id: PMID:39433128
    supporting_text: >-
      Coexpression of A1BG with CAP proteins abolished their sterol export function in
      yeast and their interaction inhibits sterol-binding in vitro.
  - reference_id: PMID:15461460
    supporting_text: >-
      We demonstrate that CRISP-3 is a specific and high-affinity ligand of A1BG with a
      dissociation constant in the nanomolar range as evidenced by surface plasmon
      resonance.
  - reference_id: file:human/A1BG/A1BG-uniprot.txt
    supporting_text: "Interacts with CRISP3."
suggested_questions:
- question: >-
    Is the A1BG-CRISP complex physiologically inhibitory in human plasma, or primarily a
    carrier/reservoir? The CRISP2 sterol-export result was obtained by heterologous
    reconstitution in yeast; a direct demonstration that plasma A1BG restrains a human
    CRISP activity in vivo would settle whether protein sequestering activity or a
    carrier-type function is the better molecular-function call.
- question: >-
    Does A1BG neutralise snake-venom CRISP toxins in humans, as the A1BG-like opossum
    plasma proteins do for venom metalloproteinases? This would give A1BG a defensible
    defence-response biological-process annotation, which it currently lacks entirely.
- question: >-
    Should mouse A1bg's IMP annotation to GO:0060396 (growth hormone receptor signaling
    pathway) be re-curated as a response term? The underlying data (PMID:16723264) show
    GH-dependent hepatic induction of the transcript, which is a downstream target
    relationship rather than participation in the receptor signalling cascade, and the
    human IBA inherits the same conflation.
- question: >-
    Is the reported A1BG-NAMPT interaction and NAMPT stabilisation (PMID:40560034)
    reproducible outside the adipocyte/osteosarcoma chemoresistance setting? If so, a
    protein-stabilisation function would need to be annotated alongside the sequestering
    activity.
- question: >-
    What explains the female-specific cardiomyocyte requirement for A1bg in mice
    (PMID:40270023) for a protein that is secreted and liver-enriched in humans? Is there
    a genuine intracellular or autocrine cardiomyocyte pool of A1BG, or is the phenotype
    secondary to loss of a circulating pool?
suggested_experiments:
- hypothesis: >-
    A1BG is a general extracellular sequestering factor for CAP-superfamily proteins,
    with magnesium-dependent specificity determined by Ig domain 3.
  description: >-
    Surface plasmon resonance and isothermal titration calorimetry with purified human
    A1BG against a panel of human CAP-superfamily proteins (CRISP1, CRISP2, CRISP3,
    GLIPR1, GAPR1), with and without Mg2+, and with an Ig-domain-3 deletion/point-mutant
    series, to define the sequestering specificity in a purely human system.
  experiment_type: binding assay
- hypothesis: >-
    A1BG blocks CAP-protein function by occluding the sterol-binding cavity of the CAP
    domain.
  description: >-
    Structure determination by cryo-EM or crystallography of the A1BG Ig-domain-3/CRISP2
    complex, to establish how the Ig domain engages the CAP domain relative to its
    sterol-binding cavity and its conserved Mg2+-coordinating tetrad.
  experiment_type: structural biology
- hypothesis: >-
    Loss of A1BG releases functionally active CRISP into the circulation.
  description: >-
    Assay plasma from A1bg-null mice (and, if available, from humans with A1BG
    loss-of-function variants) for free versus A1BG-complexed CRISP3 by size-exclusion
    chromatography and immunoprecipitation, and test CRISP-dependent sterol transfer
    activity in the two fractions.
  experiment_type: genetic and biochemical
- hypothesis: >-
    CRISP proteins are the dominant physiological ligands of circulating A1BG.
  description: >-
    Immunoprecipitate endogenous A1BG from human plasma and quantify co-purifying
    proteins by label-free or isotope-labelled mass spectrometry, to determine whether
    CRISP proteins dominate stoichiometrically or whether NAMPT and other reported
    partners are also present at meaningful levels.
  experiment_type: interaction proteomics
