- term:
    id: GO:0060396
    label: growth hormone receptor signaling pathway
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: >-
      This IBA propagates from a genuine ortholog rather than a paralog - the WITH/FROM
      field cites PANTHER:PTN000200788 and MGI:MGI:2152878, which is mouse A1bg itself,
      carrying an MGI IMP annotation to the same term from PMID:16723264. Tracing that
      source annotation shows the problem is at the source, not in the transfer. The
      mouse paper isolated A1bg ("cDNA #5") in a subtractive screen for transcripts
      induced in the liver of growth-hormone transgenic mice, and found the mRNA absent
      from GH-deficient dwarf mice, from GH-antagonist mice and from GH-receptor
      knockouts. That is evidence that A1bg is a transcriptional TARGET downstream of an
      intact GH-GH receptor axis, not evidence that the A1BG protein is a component of
      the GH receptor signalling cascade. GO:0060396 is defined as the series of
      molecular signals generated as a consequence of the GH receptor binding growth
      hormone; a secreted liver product whose gene is GH-inducible is not part of that
      cascade. No human data connect A1BG to GH signalling at all, and A1BG has no
      cytokine-receptor architecture (no transmembrane segment, no box1/box2 JAK-binding
      motifs).
    action: REMOVE
    reason: >-
      The propagation is mechanically legitimate (true mouse ortholog) but the source
      MGI IMP conflates "expression responds to GH" with "participates in GH receptor
      signalling". The defensible term for the mouse observation would be a response
      term such as GO:0060416 response to growth hormone, and even that has no human
      evidence. Removing rather than modifying, because there is no human experimental
      support for any GH-related annotation on A1BG.
    propagation_review:
      root_cause: SOURCE_BAD
      failure_modes:
      - ROLE_CONFLATION
      - CONTEXT_OR_TISSUE_MISMATCH
      source_entities:
      - source_id: MGI:MGI:2152878
        comment: >-
          Mouse A1bg, the true ortholog. Its MGI IMP to GO:0060396 (PMID:16723264) rests
          on GH-dependent hepatic mRNA induction, i.e. the gene is a GH target, not a
          pathway component. The source annotation itself should be a response term.
      - source_id: PANTHER:PTN000200788
        comment: >-
          A1BG-specific PANTHER node; the term entered the tree solely from the single
          mouse IMP above, so the phylogenetic support is one gene deep.
    additional_reference_ids:
    - PMID:16723264
    supported_by:
    - reference_id: PMID:16723264
      supporting_text: >-
        These findings suggest that induction of mRNA #5 in the liver requires a
        continuous pattern of GH secretion and an intact GH-GH receptor-signaling
        complex.
    - reference_id: PMID:16723264
      supporting_text: >-
        By performing subtractive hybridization analysis on liver cDNAs
        of GH transgenic and non-transgenic mice, differentially expressed cDNAs were
        obtained.
