id: P04217
gene_symbol: A1BG
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: A1BG (alpha-1B-glycoprotein) is a secreted, glycosylated plasma protein with five immunoglobulin-like
  domains. It forms a high-affinity, noncovalent complex with CRISP3 in human plasma. Recombinant human
  A1BG binds CRISP2 and inhibits its sterol binding; coexpression also reduces CAP-protein-dependent sterol
  export in a yeast reconstruction. The CRISP2 interaction involves A1BG immunoglobulin domain 3 and depends
  on magnesium. A1BG itself does not bind cholesterol sulfate in the reported assay, and its inhibition
  of CRISP2 sterol binding does not abolish CRISP2 fatty-acid binding. Mouse A1BG associates with cardiomyocyte
  surfaces, and cardiomyocyte deletion causes female-specific cardiac defects. In an osteosarcoma model,
  A1BG associates with NAMPT and promotes its protein stability, linking it to NAD metabolism and treatment
  resistance in that context. The physiological extent of these activities in healthy human tissues remains
  to be established.
