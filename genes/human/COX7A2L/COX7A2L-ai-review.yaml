aliases:
- COX7A2L
- COX7RP
- EB1
- SCAFI
core_functions:
- description: COX7A2L/SCAFI is an inner-mitochondrial-membrane adaptor that associates with respiratory
    complexes III and IV and stabilizes a CIII2+IV respiratory-chain supercomplex. Direct human
    perturbation studies make the CIII2+IV role stronger than a direct steady-state requirement for the
    canonical I+III2+IV respirasome, although later complexome profiling supports SCAFI in a minor subset
    of respirasomes.
  molecular_function:
    id: GO:0030674
    label: protein-macromolecule adaptor activity
  locations:
  - id: GO:0005743
    label: mitochondrial inner membrane
  supported_by:
  - reference_id: PMID:27545886
    supporting_text: As in the mouse, human COX7A2L binds primarily to free mitochondrial complex III and,
      to a minor extent, to complex IV to specifically promote the stabilization of the III2+IV supercomplex
      without affecting respirasome formation.
  - reference_id: PMID:30428348
    supporting_text: COX7A2L-KO cells lack SC III2+IV but have enhanced complex III steady-state levels,
      activity, and assembly rate, normal de novo complex IV biogenesis, and delayed respirasome formation.
proposed_new_terms:
- proposed_name: mitochondrial respiratory chain complex III2/IV supercomplex assembly
  proposed_definition: The aggregation, arrangement, and bonding together of a mitochondrial respiratory
    chain complex III dimer and one or more complex IV monomers to form a CIII2+IV respiratory-chain
    supercomplex.
  justification: Human COX7A2L/SCAFI directly stabilizes CIII2+IV, and GO:0097250 mitochondrial respirasome
    assembly is defined for the complex I/III/IV respirasome rather than the CIII2+IV supercomplex.
  proposed_parent:
    id: GO:0033108
    label: mitochondrial respiratory chain complex assembly
  supported_by:
  - reference_id: PMID:27545886
    supporting_text: As in the mouse, human COX7A2L binds primarily to free mitochondrial complex III and,
      to a minor extent, to complex IV to specifically promote the stabilization of the III2+IV supercomplex
      without affecting respirasome formation.
  - reference_id: PMID:30428348
    supporting_text: COX7A2L-KO cells lack SC III2+IV but have enhanced complex III steady-state levels,
      activity, and assembly rate, normal de novo complex IV biogenesis, and delayed respirasome formation.
suggested_questions:
- question: Which human cell states use COX7A2L/SCAFI only for CIII2+IV stabilization, and which also require
    SCAFI for a minor subset of complex I-containing respirasomes?
- question: What structural feature of COX7A2L distinguishes its CIII/CIV supercomplex adaptor behavior from
    the stable complex-IV subunit behavior of COX7A1 and COX7A2?
suggested_experiments:
- description: Reconstitute purified human CIII2 and CIV with COX7A2L, COX7A1, or COX7A2 to test whether
    COX7A2L is sufficient to bridge and stabilize the CIII2+IV interface in a defined membrane.
- description: Quantify CIII2+IV, SCAFI-dependent respirasomes, and COX7A2-dependent respirasomes after
    COX7A2L knockout and rescue under ER stress, glucose deprivation, oxidative metabolism, and glycolytic
    rewiring.
status: DRAFT
