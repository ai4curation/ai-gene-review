- id: PMID:27545886
  title: COX7A2L Is a Mitochondrial Complex III Binding Protein that Stabilizes the III2+IV Supercomplex
    without Affecting Respirasome Formation.
  findings:
  - statement: Human COX7A2L binds primarily complex III, binds complex IV to a lesser extent, and promotes
      CIII2+IV stabilization without affecting canonical respirasome formation.
    supporting_text: As in the mouse, human COX7A2L binds primarily to free mitochondrial complex III and,
      to a minor extent, to complex IV to specifically promote the stabilization of the III2+IV supercomplex
      without affecting respirasome formation.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
