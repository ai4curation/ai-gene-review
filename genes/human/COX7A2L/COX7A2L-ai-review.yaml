    reason: PMID:9418891 found a 114 amino-acid estrogen-responsive transcript similar to cytochrome
      c oxidase subunit VIIa and named it COX7RP; it did not assay cytochrome-c oxidase activity. Later
      human COX7A2L work shows that the protein stabilizes CIII2+IV supercomplexes and does not affect
      biogenesis or function of individual OXPHOS complexes, so COX7A2L should not inherit the catalytic
      complex-IV oxidase activity of COX7A subunits.
