  - InterPro:IPR036539
  review:
    summary: InterPro2GO over-propagates a cytochrome-c oxidase process mapping to COX7A2L.
    action: REMOVE
    reason: COX7A2L is homologous to COX7A proteins but is not an individual complex-IV subunit that carries
      electrons from cytochrome c to oxygen. Human knockout and complementation studies instead support a
      CIII/CIV supercomplex adaptor role while showing normal complex-IV biogenesis and no direct defect
      in standard respiratory-chain electron transport.
    supported_by:
    - reference_id: PMID:27545886
      supporting_text: COX7A2L does not affect the biogenesis, stabilization, and function of the individual
        oxidative phosphorylation complexes.
    - reference_id: PMID:30428348
      supporting_text: COX7A2L-KO cells lack SC III2+IV but have enhanced complex III steady-state levels,
        activity, and assembly rate, normal de novo complex IV biogenesis, and delayed respirasome formation.
    source_defects:
    - defect_type: WRONG_TERM
      resource: INTERPRO
      record: InterPro:IPR003177|InterPro:IPR036539
      slot: GO mapping
      requested_change: CHECK
      asserted_value: GO:0006123
      cause: SCOPE_OVER_REACH
      confidence: CONFIRMED
      explanation: The InterPro2GO mapping to mitochondrial electron transport, cytochrome c to oxygen reaches
        human COX7A2L because it carries COX7A-family signatures. COX7A2L is a CIII/CIV supercomplex adaptor,
        not a catalytic or structural subunit of cytochrome-c oxidase, and both human knockout and
        overexpression data show that its loss removes SC III2+IV while leaving individual complex-IV
        biogenesis and basal mitochondrial respiration intact. Please restrict this process mapping so that
        it does not annotate the COX7A2L/SCAFI subfamily.
      supported_by:
      - reference_id: PMID:27545886
        supporting_text: COX7A2L does not affect the biogenesis, stabilization, and function of the individual
          oxidative phosphorylation complexes.
