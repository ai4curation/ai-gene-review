id: O14548
gene_symbol: COX7A2L
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: COX7A2L encodes SCAFI, a small single-pass mitochondrial inner-membrane
  protein in the cytochrome c oxidase VIIa family that associates with mitochondrial
  respiratory complexes III and IV. It acts as a protein-macromolecule adaptor for
  CIII2+IV and related respiratory-chain supercomplexes, linking respiratory-chain
  organization to mitochondrial stress and metabolic state.
