suggested_questions:
- question: Do KAP3 proteins preferentially associate with particular hair keratin pairs or with the ortho- versus paracortex?
- question: GO lacks a cellular component term for the keratin-associated interfilamentous matrix of the hair cortex/cuticle; should one be requested, as keratin filament is only an approximation?
suggested_experiments:
- hypothesis: KAP3.1 is deposited in a cortical subdomain of the hair shaft.
  description: Immunogold electron microscopy of human hair cortex with a KAP3.1-specific antibody, comparing ortho- and para-cortical cells.
