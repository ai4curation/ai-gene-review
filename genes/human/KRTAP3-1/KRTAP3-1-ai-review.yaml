id: Q9BYR8
gene_symbol: KRTAP3-1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Keratin-associated protein 3-1 (KAP3.1) is a 98-residue high-sulfur keratin-associated protein of the KAP3 family (Keratin_matx domain), encoded in the KRTAP cluster within the type I keratin locus on chromosome 17q21. High-sulfur KAPs are synthesised in the keratinizing zone of the hair cortex and form the interfilamentous matrix around trichocyte keratin intermediate filaments; extensive disulfide cross-linking between the cysteine-rich matrix proteins and the head and tail domains of hair keratins gives the hair shaft its rigidity and chemical resistance.
existing_annotations:
- term:
    id: GO:0005198
    label: structural molecule activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR007659
  review:
    summary: InterPro2GO structural molecule activity from the keratin matrix (Keratin_matx) domain.
    action: MODIFY
    reason: 'The structural role is correct, but GO has a more specific child term for proteins that contribute to the structural integrity of hairs: structural constituent of cutaneous appendage (GO:0030281). KAPs are structural matrix proteins of the hair fibre.'
    proposed_replacement_terms:
    - &id002
      id: GO:0030281
      label: structural constituent of cutaneous appendage
    supported_by:
    - &id001
      reference_id: file:human/KRTAP3-1/KRTAP3-1-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: which are essential for the formation of a rigid and resistant hair shaft through their extensive disulfide bond cross-linking with abundant cysteine residues of hair keratins
    - reference_id: PMID:29391282
      supporting_text: KAPs are the major constituent of the matrix between the hair keratin intermediate filaments (IFs), and stabilise hair structure by extensive disulfide bonding.
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:25416956
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q7Z3S9
  review:
    summary: High-throughput binary interaction (IPI, PMID:25416956) of KRTAP3-1 with NOTCH2NLA (UniProtKB:Q7Z3S9), annotated only as bare protein binding.
    action: REMOVE
    reason: Bare protein binding (GO:0005515) is uninformative and is removed under the project protein-binding policy. This row comes from a high-throughput binary interaction screen (yeast two-hybrid or a related assay). Small cysteine-rich keratin-associated proteins are among the most frequently recovered preys in these screens, and they are recovered with hundreds of unrelated partners that are not expressed in hair-forming trichocytes. Removal does not mean the reported interaction is false. The informative function of this protein is its structural role in the disulfide cross-linked hair keratin matrix, which is captured elsewhere in this review.
    supported_by:
    - *id001
