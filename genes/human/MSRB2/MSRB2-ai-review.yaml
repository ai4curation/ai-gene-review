core_functions:
- description: >-
    Reduces oxidized peptide methionine (R)-S-oxide residues in mitochondrial
    proteins back to methionine through its Cys-dependent, zinc-stabilized MsrB
    active site.
  molecular_function:
    id: GO:0033743
    label: peptide-methionine (R)-S-oxide reductase activity
  directly_involved_in:
  - id: GO:0030091
    label: protein repair
  locations:
  - id: GO:0005739
    label: mitochondrion
suggested_questions:
- question: Which mitochondrial proteins are the physiologic MSRB2 substrates in
    human cells, and are any shared with mitochondrial MSRB3 isoforms?
- question: Does MSRB2 reduce specific regulatory Met-R-SO sites in mitochondria
    or function mainly as a broad oxidative-damage repair enzyme?
suggested_experiments:
- description: >-
    Compare Met-R-SO proteomics in MSRB2-null, MSRB3-null and double-null human
    mitochondrial fractions after controlled oxidative stress to identify
    paralog-specific substrates.
- description: >-
    Rescue MSRB2-deficient cells with catalytically inactive and Zn-binding Cys
    mutants to separate structural localization effects from Met-R-SO reductase
    activity.
