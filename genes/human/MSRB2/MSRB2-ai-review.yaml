- term:
    id: GO:0030041
    label: actin filament polymerization
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q78J03
  - ensembl:ENSMUSP00000023856
  review:
    summary: Mouse MsrB2 can reduce oxidized actin in vitro but was not the
      cellular actin-polymerization enzyme in the donor study.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Mouse MsrB2 can rescue polymerization of purified MICAL-oxidized actin,
      but the cellular LPS-stimulated macrophage actin-polymerization defect was
      observed for MsrB1 knockout. Mitochondrial MSRB2 can repair some oxidized
      actin in vitro, but this is too weak to assign human MSRB2 to the cellular
      actin filament polymerization process.
    supported_by:
    - reference_id: PMID:23911929
      supporting_text: >-
        The sedimentation/Coomassie staining assay confirmed that the
        mMicals/NADPH-treated G-actin monomer was reassembled when either mMsrB2
        or mMsrB1 were added to the reaction mixture
    - reference_id: PMID:23911929
      supporting_text: >-
        only MsrB1 deficiency led to a defect in actin polymerization-dependent
        processes in macrophages in response to LPS stimulation
