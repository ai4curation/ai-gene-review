  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q78J03
  - ensembl:ENSMUSP00000023856
  review:
    summary: Mouse MsrB2 can directly repair oxidized actin in vitro, but this is
      not a core human MSRB2 function.
    action: KEEP_AS_NON_CORE
    reason: >-
      The Ensembl Compara row traces to mouse MsrB2, and purified mouse MsrB2 can
      reduce the Met-R-SO residues generated on actin by MICAL monooxygenases in
      a direct reassembly assay. Keep the molecular substrate row as non-core
      because human MSRB2 is mitochondrial, while the cellular actin-reassembly
      phenotype in the donor paper is assigned to cytosolic MsrB1.
    supported_by:
    - reference_id: PMID:23911929
      supporting_text: >-
        Both mMsrB2 and mMsrB1 could reduce these two Met sulfoxide residues,
        while mMsrA could not
    - reference_id: PMID:23911929
      supporting_text: >-
        Like actin, MsrB1 is a cytosolic protein, whereas MsrB2 resides in
        mitochondria.
