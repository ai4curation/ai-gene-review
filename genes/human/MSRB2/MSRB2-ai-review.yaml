id: Q9Y3D2
gene_symbol: MSRB2
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  MSRB2 encodes a mitochondrial methionine-R-sulfoxide reductase with a Cys-based
  MsrB active site and structural zinc ligands. After import through an N-terminal
  mitochondrial targeting peptide, the enzyme reduces oxidized peptide methionine
  (R)-S-oxide residues back to methionine, contributing to protein repair in the
  mitochondrial redox environment. Purified mouse MsrB2 can reduce MICAL-oxidized
  actin in vitro, but the mammalian actin-polymerization role is assigned to the
  cytosolic selenoprotein MSRB1 rather than to mitochondrial MSRB2.
