- term:
    id: GO:0006979
    label: response to oxidative stress
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR028427
  review:
    summary: MSRB2 repair activity can protect mitochondria from oxidative stress.
    action: KEEP_AS_NON_CORE
    reason: >-
      MSRB2 directly repairs oxidized Met-R-SO residues, and human MSRB2
      overexpression in mitochondria protected MOLT-4 cells from peroxide
      stress. Keep this as non-core because the row describes a physiological
      outcome of mitochondrial methionine-sulfoxide repair rather than the
      core reductase reaction.
    supported_by:
    - reference_id: PMID:18424444
      supporting_text: >-
        overexpression of methionine sulfoxide reductase B2 in mitochondria of
        acute T-lymphoblastic leukemia MOLT-4 cell line
    - reference_id: file:human/MSRB2/MSRB2-uniprot.txt
      record_section:
      - CC:FUNCTION
      supporting_text: >-
        may play a role in the preservation of mitochondrial integrity by
        decreasing the intracellular reactive oxygen species build-up
