id: Q14814
gene_symbol: MEF2D
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'MEF2D (myocyte enhancer factor 2D) is a MADS-box MEF2-family transcription factor that
  binds MEF2 cis-regulatory sites and activates RNA polymerase II transcription. MEF2D can form MEF2A-MEF2D
  heterodimers in human macrophages; these dimers associate with HDAC1/HDAC7 in an undifferentiated
  or repressive state and with p300 during macrophage differentiation, connecting MEF2D to control
  of c-Jun expression. MEF2D transcripts are broadly expressed and alternatively spliced, with myogenic
  isoforms described in early muscle-lineage studies. Like other MEF2 proteins, MEF2D activity is
  modulated by phosphorylation, acetylation, SUMOylation and histone deacetylase-associated repression.'
