suggested_questions:
- question: Which MEF2D isoforms dominate human macrophage and muscle contexts, and do they
    differ in HDAC1/HDAC7 or p300 association?
suggested_experiments:
- hypothesis: MEF2A-MEF2D heterodimers switch from HDAC-bound repressive complexes to p300-bound
    activating complexes at c-Jun during macrophage differentiation.
  description: Use sequential ChIP for MEF2A followed by MEF2D and CUT&RUN for HDAC1, HDAC7,
    p300 and histone acetylation before and after macrophage differentiation.
  experiment_type: sequential chromatin occupancy and cofactor recruitment assay
