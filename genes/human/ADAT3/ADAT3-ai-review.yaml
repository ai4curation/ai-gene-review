  review:
    summary: ADAT3 retains a zinc-binding deaminase-like domain while being catalytically inactive.
    action: KEEP_AS_NON_CORE
    reason: >-
      Correct metal-binding annotation. ADAT3 is an inactive deaminase-like subunit rather
      than the catalytic A34 deaminase, but the human UniProt record retains four Zn2+
      ligand-binding features inferred from mouse; the C-terminal capping of that pocket is
      part of the structural basis for inactivation, not evidence that the metal site is absent.
