- term:
    id: GO:0052717
    label: tRNA-specific adenosine-34 deaminase activity
  evidence_type: IDA
  original_reference_id: PMID:40120092
  qualifier: contributes_to
  review:
    summary: Proposed contributes_to annotation for the non-catalytic subunit required for
      ADAT2:ADAT3 A34 deamination.
    action: NEW
    reason: ADAT3 does not itself catalyze the zinc-dependent deamination reaction, but the
      ADAT2:ADAT3 complex is the active A34 deaminase and ADAT3 supplies the tRNA-recognition
      element that presents the anticodon loop to ADAT2. A contributes_to molecular-function row
      captures this subunit role without assigning independent catalytic activity to ADAT3.
    supported_by:
    - reference_id: PMID:25916855
      supporting_text: 'hetADAT, composed of two subunits: ADAT2 and ADAT3'
    - reference_id: PMID:40120092
      supporting_text: It recognizes specifically tRNAs through the ADAT3 N-terminal domain
