- term:
    id: GO:0021852
    label: pyramidal neuron migration to cerebral cortex
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q6PAT0
  review:
    summary: ADAT3 is required for neuronal migration through tRNA I34-dependent translation, not by
      executing migration directly.
    action: MARK_AS_OVER_ANNOTATED
    reason: ADAT3 depletion impairs mouse projection-neuron migration, but ADAT3 works as a
      tRNA-recognition subunit of a wobble-editing enzyme. The mechanistic model is codon-biased
      translation of downstream neuronal-migration genes, so pyramidal neuron migration overstates
      the gene product's direct role.
    supported_by:
    - reference_id: PMID:40120092
      supporting_text: specific translational impairment of neuronal migration genes
    - reference_id: PMID:40120092
      supporting_text: Yet, the identity of affected proteins and how mutant ADAT3 impairs
