  label: Homo sapiens
description: 'ADAT3 is the non-catalytic regulatory subunit of the human ADAT2:ADAT3 tRNA-specific adenosine-34
  deaminase complex. Its N-terminal tRNA-binding domain helps present A34-containing precursor tRNAs to
  the ADAT2 active site, enabling nuclear A34-to-I34 wobble editing in eight tRNA families; biallelic
  ADAT3 variants reduce complex activity and cause a neurodevelopmental disorder.'
