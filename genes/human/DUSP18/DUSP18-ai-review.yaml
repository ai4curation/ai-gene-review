gene_symbol: DUSP18
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  DUSP18 is a small non-receptor dual-specificity protein phosphatase with a
  single DSP/PTP catalytic domain. Purified human DUSP18 dephosphorylates pTyr-
  and pThr-containing peptides in vitro and directly dephosphorylates the
  activating Tyr416 site of human SRC in a reconstituted assay. In
  osteoclast-lineage cells, mouse Dusp18 is recruited to Kiss1r after kisspeptin
  stimulation and dephosphorylates the corresponding activating Src Tyr416 site,
  restraining osteoclast differentiation and bone resorption. DUSP18 is detected
  in cytoplasm and nucleus, with a
  mitochondrial inner-membrane pool inferred from mouse Dusp18.
