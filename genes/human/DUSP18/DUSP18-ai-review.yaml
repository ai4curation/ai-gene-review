suggested_questions:
- question: What are the physiological phosphoserine or phosphothreonine substrates of DUSP18, if any?
- question: Is the mitochondrial inner-membrane localization observed for mouse Dusp18 conserved and functional for human DUSP18?
suggested_experiments:
- description: >-
    Test human DUSP18 and catalytic C104S DUSP18 against phospho-SRC Tyr419 in a
    reconstituted KISS1R-containing membrane recruitment assay.
- description: >-
    Map DUSP18-dependent phosphotyrosine, phosphoserine and phosphothreonine
    changes after KISS1R activation and mitochondrial stress in cells expressing
    endogenous DUSP18.
