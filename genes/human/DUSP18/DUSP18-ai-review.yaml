    supporting_text: >-
      Both proteins are able to dephosphorylate the phosphotyrosine analog pNPP
      in vitro and can be inhibited by sodium orthovanadate. In vitro
      experiments also demonstrate that both DSPs can dephosphorylate single and
      diphosphorylated synthetic MAPK peptides
  - statement: DUSP18 localized to both nucleus and cytoplasm in COS-cell transfection.
    supporting_text: >-
      Transfection into COS cells indicates that both proteins are expressed in
      the nucleus and the cytoplasm.
  - statement: The authors did not detect DUSP18 activity on MAPKs after co-transfection in COS cells.
    supporting_text: >-
      However, when co-transfected with MAPKs into COS cells, the novel DSPs
      exhibited no detectable in vivo activity against MAPKs under our
      conditions.
