  review:
    summary: >-
      DNAH10 is a heavy chain of the two-headed inner dynein arm f (I1), together with DNAH2
      and the intermediate chains DNAI3, DNAI4 and DNAI7. Unlike DNAH1 and DNAH2, it has no
      inner dynein arm annotation, only the generic dynein complex.
    action: NEW
    reason: >-
      Coded ISO from the mouse ortholog Dnah10 (MGI:1860299). The primary experimental basis
      is PMID:30060180, in which Wdr78 pull-downs from mouse ependymal cells recovered Dnah10
      with the other Dynein-f subunits and Wdr78 depletion removed Dnah10 from the cilium,
      which the authors present as the first experimental validation of Dnah10 as a Dynein-f
      heavy chain. PMID:40898283 is corroborating but not a direct assay of arm membership:
      its subunit list comes from re-used published cryo-EM structures, and its own assay was
      co-immunoprecipitation of Dnah10 with CCDC73, CFAP57 and DYNLL1 in mouse lung, so it is
      not used as the evidence code source here. Loss of inner dynein arms in patient sperm
      and DNALI1-independent localization as an I1-alpha component are consistent with the
      assignment. The paralogous inner-arm heavy chains DNAH1 and DNAH2 already carry this
      term.
    supported_by:
    - reference_id: PMID:30060180
      supporting_text: >-
        Mass spectrometric analysis identified multiple subunits of Dynein-f (Dnah2, Dnah10,
        Tctex1, and Wdr63)
