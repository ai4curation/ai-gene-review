taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  DNAH10 (dynein axonemal heavy chain 10) is a 4471-residue axonemal dynein heavy chain. With
  DNAH2 it forms the two heavy chains of the two-headed inner dynein arm f (I1 dynein; DNAH10
  corresponds to the Chlamydomonas 1-alpha subspecies). The arm also contains the intermediate
  chains DNAI3, DNAI4 and DNAI7 and several light chains. It has an N-terminal stem and a
  motor head of six AAA modules with ATP-binding P-loops and a coiled-coil stalk with a microtubule-binding
  domain. Like other axonemal dyneins it is expected to generate minus-end-directed force
  that drives doublet sliding. DNAH10 is expressed mainly in testis and trachea and lies along
  the whole sperm flagellum and in respiratory cilia, where it localizes independently of
  the light intermediate chain DNALI1. Biallelic DNAH10 variants cause asthenoteratozoospermia
  with multiple morphological abnormalities of the sperm flagella (MMAF; spermatogenic failure
  56), with loss of inner dynein arms and reduced DNAH2, DNAH6 and DNAH1 in sperm. Other families
  have primary ciliary dyskinesia with chronic respiratory infection, situs inversus and disordered
  respiratory axonemes. Dnah10 knockout and knock-in mice reproduce male infertility and PCD-like
  airway disease with hydrocephalus. Zebrafish dnah10 mutants have slower-beating ependymal
  monocilia and spinal curvature. Later reports link DNAH10 to manchette function during spermiogenesis,
  through bridging of the UCHL3-PACRG complex, and to primary cilia in skeletal development,
  but these roles are less well established.
