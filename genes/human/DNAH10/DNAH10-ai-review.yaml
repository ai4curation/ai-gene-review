        inner dynein arms (IDAs).
    - reference_id: PMID:34237282
      supporting_text: >-
        Furthermore, the phenotypes were recapitulated in mouse models lacking Dnah10 or expressing
        a disease-associated variant, confirming the involvement of DNAH10 in human MMAF.
    - reference_id: PMID:34657236
      supporting_text: >-
        ultrastructural analysis by transmission electron microscopy showed significant inner
        dynein arm (IDA) deficiency in sperm flagella
core_functions:
- description: >-
    Heavy chain (I1-alpha type) of the two-headed I1/f inner dynein arm, with DNAH2. It is
    an ATP-driven minus-end-directed microtubule motor that drives axonemal beating in the
    sperm flagellum and in respiratory and ependymal motile cilia, and it is needed for the
    inner arms to assemble in sperm.
  molecular_function:
    id: GO:0008569
    label: minus-end-directed microtubule motor activity
  directly_involved_in:
  - id: GO:0030317
    label: flagellated sperm motility
  - id: GO:0060294
    label: cilium movement involved in cell motility
  locations:
  - id: GO:0036126
    label: sperm flagellum
  - id: GO:0097729
    label: 9+2 motile cilium
  in_complex:
    id: GO:0036156
    label: inner dynein arm
  supported_by:
  - reference_id: PMID:34237282
    supporting_text: >-
      Altogether, our findings in humans and mice demonstrate that DNAH10 is essential for
      sperm flagellar assembly
  - reference_id: PMID:37314648
    supporting_text: >-
      Subsequently, animal models of Dnah10-knockin mice harboring missense variants and Dnah10-knockout
      mice recapitulated the phenotypes of PCD, including chronic respiratory infection, male
      infertility, and hydrocephalus.
  - reference_id: PMID:30060180
    supporting_text: >-
      Our results also provide the first experimental evidence that validates Dnah10 and Dnah2
      as HCs and Wdr78, Wdr63, and Casc1 as ICs of vertebrate Dynein-f
  - reference_id: PMID:36792588
    supporting_text: >-
      Being a component of subspecies I1α, DNAH10 was not affected by the loss of DNALI1
suggested_questions:
- question: >-
    Why do some DNAH10 families present only with MMAF and others with full PCD (including
    situs inversus)? Does this track with allele type (truncating versus missense) or with
    modifiers?
- question: >-
    A structure-based listing places DNAH12 in the IDAf complex with DNAH2 and DNAH10 (PMID:40898283).
    Is DNAH12 a genuine I1/f subunit, or a neighbouring single-headed arm component near radial
    spoke 1?
- question: >-
    Is the reported bridging of the UCHL3-PACRG complex during manchette transport (PMID:41058558)
    a direct function of DNAH10, or a consequence of defective flagellar assembly?
- question: >-
    Is the reported primary-cilium and Hedgehog phenotype in Dnah10-deficient skeletal cells
    (PMID:42086325) reproducible, and is DNAH10 present in primary cilia at all?
suggested_experiments:
- description: >-
    Cryo-ET of the 96-nm repeat in Dnah10 knockout mouse sperm and tracheal cilia to test
    whether the whole I1/f arm (including DNAH2 and DNAI3/DNAI4) is lost, and whether the
    tether/tether-head complex is affected.
  experiment_type: cryo-electron tomography
- description: >-
    Immunolocalization of DNAH10 in primary cilia of chondrocytes and osteoblasts, with a
    knockout control, to test the proposed primary-cilium role.
  experiment_type: immunofluorescence microscopy
