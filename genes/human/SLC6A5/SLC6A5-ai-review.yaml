core_functions:
- description: >-
    GlyT2 is a plasma-membrane, Na+- and Cl--dependent symporter that imports glycine into the
    presynaptic cytosol, coupling 1 glycine : 1 Cl- : 3 Na+. At inhibitory glycinergic synapses it
    mediates high-affinity glycine reuptake from the synaptic cleft, terminating the glycinergic signal
    and recycling glycine for vesicular refilling.
