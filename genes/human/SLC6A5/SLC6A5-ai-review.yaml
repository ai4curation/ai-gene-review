- term:
    id: GO:0098810
    label: neurotransmitter reuptake
  evidence_type: IDA
  original_reference_id: PMID:9845349
  qualifier: involved_in
  review:
    summary: >-
      Proposed annotation. GlyT2 itself performs high-affinity glycine reuptake from the synaptic cleft
      into the presynaptic cytosol, terminating the glycinergic signal and recycling glycine. This is
      the most precise process term for GlyT2's role and is not currently in GOA.
    action: NEW
    reason: >-
      GlyT2 is the transporter that executes the reuptake step (participation test passes). Comparator
      SLC6 neurotransmitter transporters (SLC6A1/A2/A3/A4) carry neurotransmitter uptake/reuptake terms,
      so GlyT2's absence is a genuine gap, not a convention. GO:0098810 is a descendant of GO:0006836
