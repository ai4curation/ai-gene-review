proposed_new_terms:
- proposed_name: glycine:sodium:chloride symporter activity
  proposed_definition: >-
    Enables the transfer of a solute or solutes from one side of a membrane to the other according to
    the reaction: glycine(out) + Na+(out) + Cl-(out) = glycine(in) + Na+(in) + Cl-(in).
  justification: >-
    GlyT2 obligately co-transports glycine with both Na+ and Cl- (1 glycine : 1 Cl- : 3 Na+). The most
    specific existing GO MF term, GO:0015375 glycine:sodium symporter activity, captures only the Na+
    co-substrate and omits the obligatory chloride. GO already has the analogous GO:0140814 glycine
    betaine:sodium:chloride symporter activity, so a parallel glycine:sodium:chloride symporter activity
    term is warranted. It would be a child of GO:0015375 and of GO:0015378 sodium:chloride symporter
    activity.
  proposed_parent:
    id: GO:0015375
    label: glycine:sodium symporter activity
  supported_by:
  - reference_id: file:human/SLC6A5/SLC6A5-uniprot.txt
    supporting_text: glycine(out) + chloride(out) + 3 Na(+)(out) = glycine(in) + chloride(in) + 3 Na(+)(in)
    record_section: ["CC:CATALYTIC ACTIVITY"]
suggested_questions:
- question: >-
    Does the Cl- dependence of GlyT2 reflect Cl- co-transport (symport) in a fixed stoichiometry, or an
    allosteric/permeation role, and should GO represent a distinct glycine:sodium:chloride symporter
    activity term for the SLC6 neurotransmitter transporters?
- question: >-
    What governs the subcellular trafficking and recycling itinerary of GlyT2 (endosomal pool, possible
    dense-core-granule association reported for the rat ortholog), and how do hyperekplexia mutations
    perturb it?
suggested_experiments:
- description: >-
    Electrophysiological and radiotracer flux measurement of the Na+:Cl-:glycine coupling stoichiometry
    of human GlyT2 reconstituted or expressed in oocytes/cells, to confirm the 3:1:1 ratio and the
    electrogenicity underlying its concentrative reuptake.
- description: >-
    Endogenous immuno-electron microscopy / sub-synaptic fractionation of spinal-cord glycinergic
    terminals to localize GlyT2 precisely (presynaptic plasma membrane vs recycling endosomes vs any
    dense-core/secretory vesicle pool), resolving the ISS-transferred organelle annotations.
