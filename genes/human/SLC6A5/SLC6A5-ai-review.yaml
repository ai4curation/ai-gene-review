id: Q9Y345
gene_symbol: SLC6A5
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  SLC6A5 (GlyT2) is a sodium- and chloride-dependent glycine transporter of the
  SLC6/neurotransmitter:sodium symporter (SNF/NSS) family. It is a 12-transmembrane,
  plasma-membrane secondary-active symporter that couples the inward movement of glycine
  to the co-transport of 3 Na+ and 1 Cl- (glycine(out) + Cl-(out) + 3 Na+(out) = glycine(in)
  + Cl-(in) + 3 Na+(in)); the high Na+ coupling makes it strongly concentrative. GlyT2 is
  expressed presynaptically at inhibitory glycinergic synapses in the spinal cord, brainstem
  and cerebellum, where it mediates high-affinity glycine reuptake from the synaptic cleft,
  terminating the glycinergic signal and recycling glycine into the presynaptic terminal to
  replenish synaptic vesicles. Its substrate specificity is glycine-selective and insensitive
  to sarcosine, distinguishing it from the glial transporter GlyT1 (SLC6A9). Loss-of-function
  mutations cause hereditary hyperekplexia (startle disease, HKPX3), defining the presynaptic
  component of this disorder.
