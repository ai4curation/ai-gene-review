id: Q96GD4
gene_symbol: AURKB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: AURKB (Aurora kinase B) is the serine/threonine kinase subunit of the chromosomal passenger
  complex (CPC; with INCENP, survivin/BIRC5 and borealin/CDCA8). From prophase to metaphase the CPC sits
  on chromosome arms and inner centromeres. There AURKB phosphorylates histone H3 (Ser10, Ser28) and H1.4
  and destabilizes incorrect kinetochore-microtubule attachments, for example by restraining the Ska complex,
  to promote bipolar attachment. It also recruits checkpoint proteins such as BUB1 and SGO1. From anaphase
  the CPC relocates to the spindle midzone and midbody, where AURKB drives central spindle assembly and
  furrowing and enforces the abscission checkpoint through CHMP4C. AURKB also phosphorylates and inhibits
  cGAS on mitotic chromatin, and it suppresses p53 transcriptional activity.
