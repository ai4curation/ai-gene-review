- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: TAS
  original_reference_id: PMID:8570618
  qualifier: located_in
  review:
    summary: Author statement from the 1996 cloning paper, which localised p115 to a
      narrow cytoplasmic region just below the plasma membrane.
    action: ACCEPT
    reason: 'The term is correct but loses the informative part of the observation. The
      paper describes what GO defines as the cell cortex, and GO:0005938 cell cortex
      is an active term, so a more specific replacement was considered and then dropped
      on evidence. A comparator check asks what seven well-curated RhoGAPs actually carry:
      none of ARHGAP1, ARHGAP35, ARHGAP17, ARHGAP21, ARHGAP24, SRGAP2 or DLC1 is annotated
      to GO:0005938, while four of the seven carry GO:0005737. A zero-of-seven proposal
      is idiosyncratic rather than a gap in the record, so the row stands as annotated
      and the sub-plasma-membrane localisation is recorded as a knowledge gap instead.
      What would change this: a direct cortical-localisation experiment on human ARHGAP4,
      or GO:0005938 appearing on comparable RhoGAPs.'
    supported_by:
    - reference_id: PMID:8570618
      supporting_text: Its localization in a narrow cytoplasmic region just below the
        plasma membrane and its inhibitory effect on stress fiber organization indicate
        that p115 may down regulate rho-like GTPases in hematopoietic cells.
    knowledge_gaps:
    - gap_statement: Whether human ARHGAP4 is concentrated at the cell cortex is stated
        only as a 1996 author observation and has never been re-examined, so the compartment
        in which the GAP acts is not established at better than whole-cytoplasm resolution.
      boundary: Cytoplasmic localisation is solid, with two independent experimental
        rows on the human protein and a curated UniProt statement. The rat protein additionally
        localises to the Golgi complex and to microtubules during mitosis, and to axon
        growth cones and the leading edge of migrating cells.
      gap_kind:
      - BIOLOGY
      - CURATION
      dark_aspect: CC_DARK
      status: OPEN
      significance: Substrate selectivity of a GAP in cells is set largely by where it
        is delivered, since the isolated RHOGAP domain is non-selective in vitro. Without
        a resolved compartment, the in vitro promiscuity toward RAC1, CDC42 and RHOA
        cannot be narrowed to what the protein actually does.
      resolution: Immunofluorescence or live-cell imaging of endogenous ARHGAP4 in a
        hematopoietic cell type, with cortical, Golgi and microtubule markers.
      provenance:
      - reference_id: PMID:8570618
        supporting_text: Its localization in a narrow cytoplasmic region just below the
          plasma membrane and its inhibitory effect on stress fiber organization indicate
          that p115 may down regulate rho-like GTPases in hematopoietic cells.
      - reference_id: PMID:27481945
        supporting_text: We have found that
          the RHOGAP domain itself is nonselective and in some cases rather inefficient
          under cell-free conditions.
