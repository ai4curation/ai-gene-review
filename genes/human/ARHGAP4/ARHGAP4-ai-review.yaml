  - reference_id: file:human/ARHGAP4/ARHGAP4-deep-research-affinage.md
    supporting_text: the FCH domain directs localization to the leading edges of migrating
      cells and to axon growth cones, while the GAP domain and C-terminus are required
      for its inhibition of cell migration and axon outgrowth
  - reference_id: file:human/ARHGAP4/ARHGAP4-bioinformatics/RESULTS.md
    supporting_text: Residue identity and curated activity are decoupled in both directions.
  knowledge_gaps:
  - gap_statement: Which Rho-family GTPase ARHGAP4 acts on in cells is undetermined,
      and it is not expressible in GO even if it were determined.
    boundary: 'The in vitro substrate range is established for the rat protein: RAC1,
      CDC42 and RHOA are all stimulated. Reactome commits further, placing ARHGAP4 in
      the reaction "RAC1 GAPs stimulate RAC1 GTPase activity". The catalytic arginine
      finger is present at R543.'
    gap_kind:
    - BIOLOGY
    - ONTOLOGY
    dark_aspect: MF_DARK
    status: OPEN
    significance: Rho, Rac and Cdc42 drive opposing cytoskeletal programmes, so which
      one a GAP terminates determines whether it suppresses contractility or protrusion.
      A GAP annotated only as a GAP is, for pathway modelling, barely annotated at all.
    resolution: 'Biologically, real-time GAP kinetics on the human protein against the
      RHO panel, plus a substrate-trapping or biosensor experiment in a hematopoietic
      cell. Ontologically, no term can be proposed. GO:0005100 Rho, GO:0005099 and GO:0005098
      Ras, GO:0008060 ARF, GO:0005097 Rab and GO:0046582 Rap GTPase activator activity
      have all been merged into GO:0005096, whose old names survive only as synonyms,
      and GO:0017048 Rho GTPase binding has been merged into GO:0031267, so the binding
      route loses the specificity too. GO:0005096 has zero is_a children. The merge was
      deliberate, so the machine-readable route that remains is a has_input (RO:0002233)
      extension and core_functions substrates, both used here.'
    provenance:
    - reference_id: PMID:27481945
      supporting_text: We have found that
        the RHOGAP domain itself is nonselective and in some cases rather inefficient
        under cell-free conditions.
    - reference_id: PMID:27481945
      supporting_text: Thus, we propose that other domains of RHOGAPs confer substrate
        specificity and fine-tune their catalytic efficiency in cells.
    - reference_id: PMID:12414125
      supporting_text: Collectively, these results
        demonstrate that ARHGAP4 is more widely expressed than previously thought but
        potentially possesses specialized activity in regulating members of the Rho
        GTPase family in specific cellular compartments of the nervous system.
knowledge_gaps:
- gap_statement: ARHGAP4 has no non-redundant physiological function demonstrated in
    any organism. Every functional result in the literature is a gain-of-function or
    knockdown experiment in a cell line; no loss-of-function phenotype has been attributed
    to the gene in vivo.
  boundary: 'The biochemistry is settled in outline: it is a Rho-family GAP with an intact
    catalytic arginine finger, an F-BAR targeting module and an SH3 domain, expressed
    predominantly in hematopoietic tissue and the nervous system. What is missing is
    a phenotype, and the absence is a tested one rather than an untested one: IMPC ran
    413 statistical tests on the Arhgap4 knockout and recorded zero significant
    genotype-to-phenotype associations, whereas Srgap1 and Srgap3 have never been
    phenotyped there at all.'
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  status: OPEN
  significance: Without a loss-of-function anchor, the process annotations on this gene
    rest on sufficiency (overexpression inhibits migration and axon outgrowth) and on
    phylogenetic inheritance from the SRGAP branch. Functional redundancy with other
    RhoGAPs is the hypothesis the field has settled on, and the only direct test of it
    argues against one version of it. Microarray profiling of patient PBMC lacking
    ARHGAP4 found no change in RhoGAP family expression, so whatever compensates does
    not do so by being transcriptionally upregulated. That leaves redundancy at the
    protein level, which is what a combinatorial knockout would test, and which nobody
    has done.
  resolution: Conditional or compound knockouts in a hematopoietic lineage, tested under
    challenge rather than at baseline, and in combination with the closest expressed
    RhoGAP paralogs.
  provenance:
  - reference_id: PMID:10425039
    supporting_text: In the absence of detailed information
      about the physiological relevance and specific functions of rhoGAP C1, a
      thorough clinical and laboratory investigation of the patient was performed.
  - reference_id: PMID:10425039
    supporting_text: On the basis of our observations, the
      rhoGAP C1 protein is not essential for normal development in the human.
  - reference_id: PMID:10425039
    supporting_text: Therefore, we postulate that the loss of rhoGAP C1
      function is most likely compensated by other members of the GAP family.
  - reference_id: PMID:22965914
    supporting_text: The clinical features of loss of ARHGAP4 function remain unclear
      despite several
      reports of different patterns of deletions inactivating different functional
      regions of the protein.
  - reference_id: PMID:18489790
    supporting_text: Gene expression profiling of PBMC lacking ARHGAP4 revealed that
      expression of RhoGAP family genes was not influenced greatly by the lack of
      ARHGAP4.
  - reference_id: PMID:16781893
    supporting_text: Other patients with NDI,
      but without immunodeficiency, have had deletions that remove all ARHGAP4 except
      exon 1
  - reference_id: PMID:16781893
    supporting_text: These results are consistent with an X-linked form of SCID, due
      to the loss of regulatory elements that control the response to hypoxia in hematopoietic
      cells.
  - reference_id: PMID:26707211
    supporting_text: The relation between ARHGAP4 mutation and MR clinical characteristic
      is needed to be illuminated with participation of more MR patients.
- gap_statement: The GO record for ARHGAP4 is not wrong so much as absent. Sixteen of
    the nineteen primary papers about this gene produced no GO annotation on ARHGAP4
    in any species, and the human protein has no experimental molecular-function or biological-process
    annotation at all.
  boundary: 'Three papers account for every non-electronic functional row: PMID:8570618
    gives four TAS rows on the human protein; PMID:12414125 gives the rat GO:0005096
    IDA, GO:0005874 IDA, GO:0007399 IEP and GO:0035023 NAS; PMID:17804252 gives the rat
    GO:0010764 IMP, GO:0030517 IMP and GO:0030426 IDA. Everything else on the human entry
    is IBA, Ensembl projection, InterPro mapping, or Reactome.'
  gap_kind:
  - CURATION
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: A reviewer who assumes a sparse GO record reflects a sparsely studied
    gene will reach the wrong conclusion here, and a reviewer who treats the existing
    rows as over-annotation will delete the little that is correct. The defect is coverage.
    Concretely, the ARHGAP4-SEPT2-SEPT9 complex, the HDAC2 and p53 interactions, the
    EMT work, and the Golgi localisation reported in the title of PMID:12414125 are all
    uncurated.
  resolution: Curation of the primary papers, on the rat gene where the experiments were
    done, so that the existing Ensembl Compara route carries the results to human. The
    single highest-value addition is a GO:0005794 Golgi apparatus IDA on rat Arhgap4,
    since the microtubule half of the same observation is already annotated and projected.
  provenance:
  - reference_id: PMID:12414125
    supporting_text: Subcellularly, endogenous ARHGAP4 expression localized
      to the Golgi complex and could redistribute to the microtubules, for example
      during mitosis.
  - reference_id: PMID:34524873
    supporting_text: ARHGAP4, one of the Rho-GAPs, forms
      a complex with SEPT2 and SEPT9
suggested_questions:
- question: Which Rho-family GTPase does ARHGAP4 act on in a hematopoietic cell? The
    in vitro assay was done on rat protein against RAC1, CDC42 and RHOA together, and
    the RHOGAP domain is non-selective in cell-free conditions across this family, so
    the cellular answer is undetermined.
  experts: []
- question: ARHGAP4 is recovered in Hem-1 (NCKAP1L) leading-edge complexes in neutrophils,
    and those complexes are required for RAC activation. Is ARHGAP4 the brake within
    that machine, and if so does it act on RAC1 directly?
  experts: []
- question: Does ARHGAP4 have a Golgi function? The rat cloning paper reports Golgi localisation
    in its title, yet no Golgi GO annotation exists for the gene in any species, and
    the Golgi is not a site where a RhoGAP would obviously act.
  experts: []
- question: Is the T491M variant reported in an X-linked intellectual disability family,
    which lies outside the Rho-GAP domain (507-695), pathogenic? No functional assay
    has been performed on it.
  experts: []
- question: Why is complete loss of ARHGAP4 tolerated? Patients hemizygous for deletions
    removing the gene have no attributed phenotype, and the Arhgap4 knockout mouse returns
    zero significant IMPC associations across 413 statistical tests, so this is a tested
    absence rather than an untested one. Which paralogs compensate is open and tractable,
    and it is not transcriptional, since RhoGAP-family expression is unchanged in patient
    cells lacking ARHGAP4.
  experts: []
suggested_experiments:
- hypothesis: The human ARHGAP4 Rho-GAP domain is catalytically active and, like other
    isolated RHOGAP domains, non-selective in vitro.
  description: Real-time GAP kinetics of the human ARHGAP4 Rho-GAP domain against a RHO
    panel (RHOA, RHOB, RHOC, RAC1, RAC2, RAC3, CDC42, RHOG, RHOQ, RHOJ), with the R543A
    arginine-finger mutant as the negative control, following the design of PMID:27481945,
    which characterised 14 RHOGAPs this way but not ARHGAP4. Note that an arginine-finger
    mutant is a poor loss-of-function tool in cells, because it still sequesters the
    target GTPase.
- hypothesis: ARHGAP4 acts as a local brake on RAC1 within the Hem-1 leading-edge complex.
  description: Rho-family biosensor imaging in a neutrophil-like line after ARHGAP4 knockdown,
    to determine which GTPase activity rises and where, testing the Hem-1 leading-edge
    hypothesis directly.
- hypothesis: Endogenous human ARHGAP4 occupies the cell cortex, as the 1996 report suggests,
    rather than the bulk cytoplasm.
  description: Immunofluorescence of endogenous ARHGAP4 in a hematopoietic cell type
    against cortical, Golgi and microtubule markers, to establish the compartment in
    which the human protein resides. The sub-plasma-membrane localisation reported in
    1996 has never been re-examined.
- hypothesis: The absent single-knockout phenotype reflects redundancy with other RhoGAPs
    expressed in the same lineage.
  description: Combinatorial knockout of ARHGAP4 with the RhoGAPs co-expressed in the
    same hematopoietic lineage, assayed under migration or chemotaxis challenge rather
    than at baseline.
- hypothesis: Septin binding modulates ARHGAP4 catalytic activity rather than only its
    localisation.
  description: Reconstitute the ARHGAP4-SEPT2-SEPT9 complex and measure GAP activity
    with and without the septins. This would convert the strongest interaction result
    in the literature into a statement about molecular function.
references:
