- term:
    id: GO:0005096
    label: GTPase activator activity
  evidence_type: TAS
  original_reference_id: PMID:8570618
  qualifier: enables
  review:
    summary: The 1996 cloning paper for human C1/p115, which identified a GAP-homologous
      region by sequence similarity and observed that overexpression disrupted stress
      fibres. The conclusion drawn was that p115 may down-regulate Rho-like GTPases
      in hematopoietic cells.
    action: ACCEPT
    reason: 'The term is correct and is independently supported by the rat IDA and by
      the IBA, so the row should stand. Its evidential weight, however, is lower than
      its TAS code suggests: this paper reports no GAP assay. The authors inferred GAP
      function from two homology regions plus a cellular phenotype, so the row records
      a correct author statement rather than a measurement. Nothing here is a reason
      to modify or remove it, but a curator reading only this row should not treat it
      as a second, independent demonstration of catalysis.'
    supported_by:
    - reference_id: PMID:8570618
      supporting_text: 'It is characterized by two regions of similarity to motifs present
        in known proteins: GAP and SH3 homologous regions.'
    - reference_id: PMID:8570618
      supporting_text: Its localization in a narrow cytoplasmic region just below the
        plasma membrane and its inhibitory effect on stress fiber organization indicate
        that p115 may down regulate rho-like GTPases in hematopoietic cells.
- term:
    id: GO:0005096
    label: GTPase activator activity
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-9013144
  qualifier: enables
  extensions:
  - predicate: RO:0002233
    term:
      id: UniProtKB:P63000
      label: RAC1
  review:
    summary: Reactome places ARHGAP4 in the reaction "RAC1 GAPs stimulate RAC1 GTPase
      activity", which is a substrate-specific claim that the GO term itself cannot
      carry.
    action: ACCEPT
    reason: 'This row is the clearest illustration of the ontology limitation affecting
      this gene. Reactome commits to RAC1 as the substrate; GO:0005096 is substrate-agnostic,
      so the commitment survives only in the Reactome reaction identifier and is invisible
      to anything reading the GO term. The substrate-specific GAP terms that would once
      have carried it are gone. Resolving them across three independent services (OLS4,
      the GO API at api.geneontology.org, and this repository''s own cache/go/terms.csv)
      shows GO:0005100 Rho, GO:0005099 and GO:0005098 Ras, GO:0008060 ARF, GO:0005097
      Rab and GO:0046582 Rap GAP activity all merged into GO:0005096, whose old names
      survive only as synonyms, and GO:0017048 Rho GTPase binding merged into GO:0031267
      so the binding route loses Rho specificity too. GO:0005096 has zero is_a children.
      It is not childless, since QuickGO reports GO:1902773 GTPase activator complex
      as a child via capable_of, but a complex capable of the activity is not a more
      specific activity. QuickGO is not used as an authority for the merge status because
      it silently resolves merged ids to the surviving term flagged as not obsolete,
      which it did for seven of the nine ids queried. The merge was deliberate, so no
      replacement term is proposed and no new term is requested; the substrate is recorded
      as an RO:0002233 has_input extension and in core_functions substrates instead.'
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:16417406
  qualifier: enables
  supporting_entities:
  - UniProtKB:P55160
  review:
    summary: Interaction with NCKAP1L (Hem-1), a scaffold of the neutrophil leading-edge
      complexes that include the WAVE2 complex. UniProt curates this as the only SUBUNIT
      statement for this gene, with experimental evidence.
    action: REMOVE
    reason: 'GO:0005515 states nothing about what ARHGAP4 does. Repository policy routes
      generic protein binding to MODIFY when the cited paper supports a more informative
      molecular function and otherwise to REMOVE, and this row falls on the second branch.
      That there is nothing to modify to is established by walking the branch rather than
      by a text search, since GO search is token-based and a failed search is not evidence
      of absence. A complete enumeration of the branch, unbounded in depth and
      deduplicated, returns 105 distinct descendants of GO:0044877
      protein-containing complex binding, reached over 106 parent-child edges with
      every descendant within four edges of the root, among them exactly one
      actin-machinery term, GO:0071933 Arp2/3 complex binding, and no term for binding
      the WAVE/SCAR or Hem-1 complex. GO:0031209 SCAR complex
      exists, but as a cellular component rather than as something to bind. The paper
      assigns ARHGAP4 no function within the complex, and describes the complexes
      containing the additional proteins as biochemically separable from the WAVE2 complex
      proper, so neither Arp2/3 complex binding nor SCAR complex membership would be
      defensible either. Removal does not mean the interaction is false or the curation
      unsound. UniProt records it as this protein''s only SUBUNIT statement, with
      experimental evidence, and the partner identity is exactly the content GO:0005515
      discards; it is preserved in this review and in the description rather than in an
      annotation that says nothing. The cached record for this reference is abstract-only
      and does not name ARHGAP4, which is expected for a proteomic inventory whose
      component list is in the full text; that is not a reason to doubt the curator, and
      no part of this decision rests on it.'
    supported_by:
    - reference_id: PMID:16417406
      supporting_text: A subset of these leading edge complexes are biochemically separable
        from the WAVE2 complex and contain a diverse set of potential polarity-regulating
        proteins.
