- id: GO_REF:0000107
  title: Automatic transfer of experimentally verified manual GO annotation data to
    orthologs using Ensembl Compara
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Source of six rows, every one of which projects a curated rat row traceable
      to PMID:12414125 or PMID:17804252. Verified by querying the donor accession directly;
      these are not free-floating electronic inferences.
- id: PMID:8570618
  title: An X chromosome-linked gene encoding a protein with characteristics of a
    rhoGAP predominantly expressed in hematopoietic cells.
  findings:
  - statement: The protein, named p115 and encoded by the gene then called C1, is expressed
      predominantly in hematopoietic cells and contains GAP and SH3 homology regions.
    supporting_text: The protein encoded by C1, p115, is synthesized predominantly in
      cells of hematopoietic origin.
  - statement: p115 localises to a narrow cytoplasmic region just below the plasma membrane
      and inhibits stress fibre organisation, from which the authors inferred down-regulation
      of Rho-like GTPases.
    supporting_text: Its localization in a narrow cytoplasmic region just below the plasma
      membrane and its inhibitory effect on stress fiber organization indicate that p115
      may down regulate rho-like GTPases in hematopoietic cells.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The original human cloning paper and the source of all four TAS rows.
      Cached text is the abstract plus an abbreviated full text. No GAP assay is reported
      here; the GAP assignment is from sequence homology plus a stress-fibre phenotype,
      which is why the TAS rows carry less weight than the rat IDA.
- id: PMID:12414125
  title: Cloning of rat ARHGAP4/C1, a RhoGAP family member expressed in the nervous
    system that colocalizes with the Golgi complex and microtubules.
  findings:
  - statement: Recombinant ARHGAP4 stimulates GTP hydrolysis by RAC1, CDC42 and RHOA
      in vitro. This is the only direct measurement of the activity for this gene in
      any species.
    supporting_text: In vitro, recombinant ARHGAP4 stimulated the GTPase
      activity of three members of Rho GTPases, Rac1, Cdc42 and RhoA.
  - statement: Endogenous ARHGAP4 localises to the Golgi complex and redistributes to
      microtubules, for example during mitosis.
    supporting_text: Subcellularly, endogenous ARHGAP4 expression localized
      to the Golgi complex and could redistribute to the microtubules, for example
      during mitosis.
  - statement: ARHGAP4 mRNA is expressed across the developing and adult nervous systems.
      This is the basis of the GO:0007399 IEP row, that is, expression-pattern evidence.
    supporting_text: ARHGAP4 mRNA expression was observed in multiple tissues with marked
      expression throughout
      the developing and adult nervous systems.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The decisive biochemical paper, and it is about the RAT protein, which
      matters for every conclusion drawn from it. It produced four GO rows on rat Arhgap4
      and none on human ARHGAP4; the human entry receives them by Ensembl Compara projection.
      Its title reports Golgi localisation, for which no GO annotation exists in any
      species. Cached record is abstract-only.
- id: PMID:17804252
  title: ARHGAP4 is a novel RhoGAP that mediates inhibition of cell motility and axon
    outgrowth.
  findings:
  - statement: ARHGAP4 inhibits migration of NIH/3T3 cells and outgrowth of hippocampal
      axons.
    supporting_text: Our studies show that ARHGAP4 inhibits the migration of NIH/3T3
      cells and the outgrowth of hippocampal axons.
  - statement: The FCH (F-BAR) domain targets ARHGAP4 to the leading edge of migrating
      cells and to axon growth cones.
    supporting_text: Our structure/function analyses show that the FCH domain appears
      to be important for spatially localizing ARHGAP4 to the leading edges of migrating
      NIH/3T3 cells and to axon growth cones.
  - statement: The GAP domain and the C-terminus are both required for the inhibition
      of cell and axon motility, so the phenotype depends on catalysis and not on localisation
      alone.
    supporting_text: Our analyses also show that the GAP domain and C-terminus are necessary
      for ARHGAP4-mediated inhibition of cell and axon motility.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The best structure-function work on this gene, and the source of three
      rat GO rows (GO:0010764 IMP, GO:0030517 IMP, GO:0030426 IDA) that reach human only
      by projection. Every result is gain-of-function. Cached record is abstract-only;
      PMC2111057 exists but the publisher does not release the text.
- id: PMID:16417406
  title: Hem-1 complexes are essential for Rac activation, actin polymerization, and
    myosin regulation during neutrophil chemotaxis.
  findings:
  - statement: Hem-1 (NCKAP1L) scaffolds a family of neutrophil leading-edge complexes,
      of which the WAVE2 complex is one member, and some of which contain polarity-regulating
      proteins other than the WAVE2 components.
    supporting_text: A subset of these leading edge complexes are biochemically separable
      from the WAVE2 complex and contain a diverse set of potential polarity-regulating
      proteins.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Source of the GO:0005515 IPI with NCKAP1L and of the only UniProt SUBUNIT
      statement for this gene. The cached record is abstract-only and does not name ARHGAP4;
      the component list is in the full text, which is the normal situation for a proteomic
      inventory and is not a reason to doubt the annotation. Biologically the most interesting
      interaction on the gene, since it places a hematopoietic RhoGAP inside the machinery
      that activates RAC.
- id: PMID:27481945
  title: 'Deciphering the Molecular and Functional Basis of RHOGAP Family Proteins:
    A SYSTEMATIC APPROACH TOWARD SELECTIVE INACTIVATION OF RHO FAMILY PROTEINS.'
  findings:
  - statement: The isolated RHOGAP catalytic domain is non-selective and sometimes inefficient
      in cell-free assays, so substrate specificity in cells must come from the other
      domains of the protein.
    supporting_text: We have found that
      the RHOGAP domain itself is nonselective and in some cases rather inefficient
      under cell-free conditions.
  - statement: The authors therefore propose that specificity and catalytic tuning are
      conferred by the non-catalytic domains.
    supporting_text: Thus, we propose that other domains of RHOGAPs confer substrate
      specificity and fine-tune their catalytic efficiency in cells.
  - statement: Fourteen of the 66 human RHOGAPs were assayed against 12 RHO proteins.
      ARHGAP4 is in the catalogue of 66 but is not one of the 14.
    supporting_text: The activity of 14 representatives of the RHOGAP family toward 12
      RHO family proteins was determined in real time.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'The family-level reference frame for every substrate claim in this
      review, and the source of the arginine-finger-less control set used in the bioinformatics.
      Affinage did not return it. Two things were checked in the PMC full text rather
      than assumed: ARHGAP4 appears exactly once, as entry 42 of Table 1 under its old
      name p115, so it is inside the 57 predicted-catalytic RHOGAPs but outside the 14
      that were assayed; and the seven proteins reported to lack the arginine finger
      are ARHGAP36, ARAP2, DEPDC1, DEPDC1B, FAM13B, INPP5B and OCRL1. A web-search summary
      claiming this paper measured an ARHGAP4-R543K mutant by FRET is false and was not
      used.'
- id: PMID:16781893
  title: Severe combined immunodeficiency associated with nephrogenic diabetes insipidus
    and a deletion in the Xq28 region.
  findings:
  - statement: Patients whose deletions remove all of ARHGAP4 except exon 1 have nephrogenic
      diabetes insipidus without immunodeficiency, so near-complete loss of ARHGAP4 does
      not by itself cause an immune phenotype.
    supporting_text: Other patients with NDI,
      but without immunodeficiency, have had deletions that remove all ARHGAP4 except
      exon 1
  - statement: The authors attribute the SCID in their patient to loss of a conserved
      regulatory region between ARHGAP4 and ARD1A rather than to loss of ARHGAP4 itself.
    supporting_text: These results are consistent with an X-linked form of SCID, due
      to the loss of regulatory elements that control the response to hypoxia in hematopoietic
      cells.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The most informative human loss-of-function datum for this gene, and
      a negative one. Affinage did not return it. It is the reason this review treats
      the absence of a phenotype as a finding rather than an absence of study.
- id: PMID:10425039
  title: Compound deletion of the rhoGAP C1 and V2 vasopressin receptor genes in a patient
    with nephrogenic diabetes insipidus.
  findings:
  - statement: A patient hemizygous for a 21.5 kb deletion removing AVPR2 and most of
      the C1/ARHGAP4 locus was followed clinically and by laboratory testing for 16 years,
      with no abnormality beyond the AVPR2-attributable NDI, so ARHGAP4 is not essential
      for normal human development.
    supporting_text: On the basis of our observations, the
      rhoGAP C1 protein is not essential for normal development in the human.
  - statement: Because ARHGAP4 is hematopoietically enriched, immunologic and hematologic
      testing was done specifically, and was normal; the authors attribute this to
      compensation by other GAP-family members.
    supporting_text: Therefore, we postulate that the loss of rhoGAP C1
      function is most likely compensated by other members of the GAP family.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The single most informative human loss-of-function study on this gene,
      and the source of the redundancy hypothesis this review adopts. Affinage did not
      return it. Its negative result is unusually strong because the immunologic and
      hematologic testing was targeted at the tissue where ARHGAP4 is enriched rather
      than being a generic workup, and it spans 16 years.
- id: PMID:18489790
  title: Immunological profile in a family with nephrogenic diabetes insipidus with
    a novel 11 kb deletion in AVPR2 and ARHGAP4 genes.
  findings:
  - statement: Peripheral blood mononuclear cells from patients lacking half of ARHGAP4
      show no compensatory change in RhoGAP family gene expression, so whatever offsets
      the loss does not do it by transcriptional upregulation of paralogs.
    supporting_text: Gene expression profiling of PBMC lacking ARHGAP4 revealed that
      expression of RhoGAP family genes was not influenced greatly by the lack of
      ARHGAP4.
  - statement: Partial loss of ARHGAP4 produced measurable but subclinical immunologic
      changes and no susceptibility to infection.
    supporting_text: ARHGAP4 may play some role in lymphocyte differentiation but partial
      loss of ARHGAP4 does not result in
      clinical immunodeficiency.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Affinage did not return it. Its expression-profiling result is the
      only direct test of the compensation hypothesis proposed by PMID:10425039, and
      it refutes the transcriptional version of that hypothesis while leaving
      protein-level redundancy open. Both are cited in the knowledge gap rather than
      only the one that fits. Note that these patients retain roughly half of ARHGAP4,
      so the study bounds partial loss, not null.
- id: PMID:22965914
  title: A novel contiguous gene deletion of AVPR2 and ARHGAP4 genes in male dizygotic
    twins with nephrogenic diabetes insipidus and intellectual disability.
  findings:
  - statement: Reviewing all characterised deletions spanning ARHGAP4, the authors find
      the clinical consequences of losing it still undefined.
    supporting_text: The clinical features of loss of ARHGAP4 function remain unclear
      despite several
      reports of different patterns of deletions inactivating different functional
      regions of the protein.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Affinage did not return it. Cited for its explicit statement that the
      field does not know what losing ARHGAP4 does, which is what makes the knowledge
      gap a gap rather than an absence of study. The intellectual disability in these
      twins is not attributable to ARHGAP4 on this evidence, since the deletion also
      removes AVPR2 and the cohort is two siblings.
- id: PMID:40817404
  title: ARHGAP4/MYH9/β-catenin/c-Jun positive feedback loop promotes colorectal cancer
    stemness.
  findings: []
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: The republished version of the work withdrawn as PMID:40553870, and
      the identifier a curator should use. Listed for that mapping and because affinage
      cites it. Like the other cancer papers it produced no GO annotation, and no claim
      in this review rests on it.
- id: PMID:26707211
  title: ARHGAP4 mutated in a Chinese intellectually challenged family.
  findings:
  - statement: A T491M variant segregates in one X-linked intellectual disability family,
      with the authors themselves calling for replication before the association is accepted.
    supporting_text: The relation between ARHGAP4 mutation and MR clinical characteristic
      is needed to be illuminated with participation of more MR patients.
  reference_review:
    relevance: LOW
    correctness: LOW_QUALITY
    review_notes: A single-family exome study with no functional assay, whose candidate
      was selected by database filtering and SIFT. T491 lies outside the Rho-GAP domain
      (507-695). Recorded because it is one of only two ARHGAP4 variant reports in humans,
      not because it establishes a function. It produced no GO annotation.
- id: PMID:39060771
  title: ARHGAP4 variants are associated with X-linked early-onset temporal lobe epilepsy.
  findings: []
  reference_review:
    relevance: LOW
    correctness: UNVERIFIED
    review_notes: Indexed by PubMed as a Letter, and the PubMed record carries no abstract,
      so nothing beyond the title could be verified and no claim in this review rests
      on it. Recorded because it is the second of the two ARHGAP4 variant reports and
      because affinage did not return it. It produced no GO annotation. Assessing it
      would need the full text.
- id: PMID:34524873
  title: ARHGAP4-SEPT2-SEPT9 complex enables both up- and down-modulation of integrin-mediated
    focal adhesions, cell migration, and invasion.
  findings:
  - statement: ARHGAP4 forms a complex with SEPT2 and SEPT9, and perturbing it reorganises
      focal adhesions and alters migration and invasion.
    supporting_text: ARHGAP4, one of the Rho-GAPs, forms
      a complex with SEPT2 and SEPT9
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: 'The strongest interaction result in the ARHGAP4 literature, and fully
      uncurated: it produced no GO annotation on ARHGAP4, SEPT2 or SEPT9. Cited here
      as corroboration for the GO:0030336 IBA row and as a concrete instance of the coverage
      gap, not as the basis of any new annotation.'
- id: PMID:40553870
  title: 'WITHDRAWN: ARHGAP4/ MYH9/ β-catenin/ c-Jun positive feedback loop regulates
    colorectal cancer stemness.'
  findings:
  - statement: This version of the colorectal cancer stemness work was withdrawn for
      a publishing error, not for a problem with the data.
    supporting_text: This article has been withdrawn at the request of the author(s)
      and/or editor due to an error in the publishing process.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Recorded as a citation hazard. The affinage deep-research record cites
      PMID:40817404, the republished version of this work in NPJ Precision Oncology,
      which is the correct identifier to use. This withdrawn version is flagged so that
      a later reviewer encountering either identifier knows the relationship. No claim
      in this review depends on the finding.
- id: Reactome:R-HSA-9012999
  title: RHO GTPase cycle
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Basis of the GO:0051056 TAS row, which is the best-pitched process
      term on the gene.
- id: Reactome:R-HSA-9013144
  title: RAC1 GAPs stimulate RAC1 GTPase activity
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The reaction name is itself the finding. Reactome commits to RAC1 as
      the substrate, a commitment GO:0005096 cannot carry, so the Reactome identifier
      is the only machine-readable place in GOA where the ARHGAP4 substrate is named.
- id: file:human/ARHGAP4/ARHGAP4-deep-research-affinage.md
  title: Affinage mechanistic annotation for ARHGAP4 (human)
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The provider record used as the starting point. Its trust gates were
      clear (accession P98171, no non-human organism token, self-evaluation pairwise
      win, faith 100 percent) and its narrative is accurate as far as it goes, so the
      two statements cited from it are used as corroboration. It returned 11 citations
      and missed every human-genetics paper (PMID:16781893, PMID:18489790, PMID:10425039,
      PMID:22965914, PMID:26707211, PMID:39060771) and the family-wide RHOGAP kinetics
      survey (PMID:27481945), all of which were found instead by PubMed queries on the
      symbol and its synonyms. It also cites PMID:40817404 without noting that an earlier
      version of the same work was withdrawn. Its GO grounding was not imported.
- id: file:human/ARHGAP4/ARHGAP4-bioinformatics/RESULTS.md
  title: ARHGAP4 bioinformatics analyses
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Seven rerunnable analyses committed alongside this review, each with
      a self-test that breaks its input or its anchor on purpose and requires every guard
      to fire, with negative controls that must stay silent. They supply the arginine-finger
      alignment against the PDB 1TX4 anchor, the cross-service GO merge check, the
      per-reference coverage counts, the WITH/FROM and PAINT-node resolution, the
      comparator check that refuted three of four candidate term replacements, the IMPC
      query that distinguishes a tested-and-clean knockout from an untested one, and an
      offline audit of this document (GOA row reconciliation, duplicate YAML keys,
      verbatimness of both PMID and file quotes, folded-hyphen damage, and reference
      completeness).
