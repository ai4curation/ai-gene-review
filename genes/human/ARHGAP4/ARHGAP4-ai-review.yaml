core_functions:
- description: Rho-family GTPase-activating protein delivered to sites of membrane curvature.
    Through the arginine finger R543 of its Rho-GAP domain it accelerates intrinsic GTP
    hydrolysis on RAC1, CDC42 and RHOA, switching off Rho-family signalling to the actin
    cytoskeleton; through its N-terminal F-BAR domain it is concentrated at the leading
    edge of migrating cells and at axon growth cones, and both the GAP domain and the
    C-terminus are required for the resulting inhibition of motility. That combination
    is the standard resolution of how a non-selective GAP domain acquires specificity
    in cells. Both of those experiments used the rat protein, so the substrates listed
    are what the protein can act on rather than a demonstrated in vivo preference, and
    nothing here has been measured on the human protein. Negative regulation of cell
    migration is carried at core level and negative regulation of axon extension is not,
    even though both rest on the same gain-of-function experiments, because only the
    migration term is additionally supported by a PAINT node spanning three phyla
    (PTN001021265, seeded by rat Arhgap4, human SRGAP2 and C. elegans srgp-1) and by
    convergent reports from independent human cancer and epithelial studies. The axon
    result has neither, and no non-redundant physiological role is demonstrated for this
    gene in any organism.
  molecular_function:
    id: GO:0005096
    label: GTPase activator activity
  directly_involved_in:
  - id: GO:0051056
    label: regulation of small GTPase mediated signal transduction
  - id: GO:0030336
    label: negative regulation of cell migration
  locations:
  - id: GO:0005737
    label: cytoplasm
  substrates:
  - id: UniProtKB:P63000
    label: RAC1
  - id: UniProtKB:P60953
    label: CDC42
  - id: UniProtKB:P61586
    label: RHOA
  supported_by:
  - reference_id: PMID:12414125
    supporting_text: In vitro, recombinant ARHGAP4 stimulated the GTPase
      activity of three members of Rho GTPases, Rac1, Cdc42 and RhoA.
  - reference_id: PMID:17804252
    supporting_text: Our structure/function analyses show that the FCH domain appears
      to be important for spatially localizing ARHGAP4 to the leading edges of migrating
      NIH/3T3 cells and to axon growth cones.
  - reference_id: PMID:17804252
    supporting_text: Our analyses also show that the GAP domain and C-terminus are necessary
      for ARHGAP4-mediated inhibition of cell and axon motility.
  - reference_id: PMID:8570618
    supporting_text: Its localization in a narrow cytoplasmic region just below the plasma
      membrane and its inhibitory effect on stress fiber organization indicate that p115
      may down regulate rho-like GTPases in hematopoietic cells.
  - reference_id: file:human/ARHGAP4/ARHGAP4-deep-research-affinage.md
    supporting_text: Recombinant ARHGAP4 stimulates the intrinsic GTPase activity of
      Rac1, Cdc42, and RhoA, establishing it as a functional GAP for multiple Rho-family
