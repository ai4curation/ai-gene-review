id: P98171
gene_symbol: ARHGAP4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ARHGAP4 (originally C1/RGC1, protein p115) is an X-linked, hematopoietically
  enriched Rho GTPase-activating protein of the SLIT-ROBO RhoGAP (SRGAP) family. It
  combines an N-terminal F-BAR membrane-deforming module (residues 19-317), a central
  Rho-GAP catalytic domain (507-695) carrying the canonical arginine finger at R543,
  and a C-terminal SH3 domain (746-805). Work on the rat protein shows that recombinant
  ARHGAP4 accelerates GTP hydrolysis on RAC1, CDC42 and RHOA in vitro, and that the F-BAR
  module targets it to the leading edge of migrating cells and to axon growth cones, where
  the GAP domain and C-terminus are required for its inhibition of cell migration and axon
  outgrowth; no equivalent experiment has been done on the human protein. Endogenous rat
  protein is cytoplasmic, concentrated just beneath the plasma membrane, associated with
  the Golgi complex and redistributing onto microtubules during mitosis, and the human
  protein is cytoplasmic by two independent localisation experiments.
  It is expressed predominantly in hematopoietic tissues (spleen, thymus, leukocytes)
  and in the developing and adult nervous system, and it is recovered in the Hem-1
  (NCKAP1L) leading-edge complexes of neutrophils. Loss of the gene is well tolerated
  in both mouse and human, so its non-redundant physiological role remains undefined.
