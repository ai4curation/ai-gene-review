- term:
    id: GO:0007266
    label: Rho protein signal transduction
  evidence_type: TAS
  original_reference_id: PMID:8570618
  qualifier: involved_in
  review:
    summary: Author statement from the 1996 paper that p115 may down-regulate Rho-like
      GTPases in hematopoietic cells.
    action: KEEP_AS_NON_CORE
    reason: 'The term names the pathway ARHGAP4 acts on rather than what it does to it,
      and the obvious reading is that a GAP regulates Rho signal transduction instead
      of participating in it. I checked that reading rather than acting on it, and it
      does not hold up as a curation convention: two of seven well-curated RhoGAPs carry
      GO:0007266 (ARHGAP1 by TAS, ARHGAP35 by IBA), which is as many as carry GO:0035024,
      so placing a RhoGAP on the transduction term is established practice and not an
      error to correct. No replacement is proposed. It is marked non-core because the
      informative statement about this gene is the GAP activity itself, recorded on GO:0005096,
      and because the supporting author statement is explicitly hedged. What would change
      this: the GO consortium moving RhoGAPs off GO:0007266 onto regulation terms, which
      would show up as the comparator counts inverting.'
    supported_by:
    - reference_id: PMID:8570618
      supporting_text: Its localization in a narrow cytoplasmic region just below the
        plasma membrane and its inhibitory effect on stress fiber organization indicate
        that p115 may down regulate rho-like GTPases in hematopoietic cells.
