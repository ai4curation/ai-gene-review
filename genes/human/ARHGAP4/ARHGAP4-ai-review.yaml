- term:
    id: GO:0007010
    label: cytoskeleton organization
  evidence_type: TAS
  original_reference_id: PMID:8570618
  qualifier: involved_in
  review:
    summary: Author statement from the 1996 paper, whose cytoskeletal observation was
      that overexpressed p115 inhibited stress fibre organisation.
    action: MODIFY
    reason: 'The annotation asserts that ARHGAP4 organises the cytoskeleton, whereas
      the cited observation is that it negatively regulates a specific cytoskeletal structure.
      A RhoGAP switches Rho signalling off, so a regulation term is the correct shape.
      A comparator check supports the change rather than merely my reading of it: of
      seven well-curated RhoGAPs, not one carries GO:0007010, so ARHGAP4 is the outlier
      here, while GO:0051497 is carried by DLC1 with IDA evidence from the same kind
      of stress-fibre experiment and GO:0032956 regulation of actin cytoskeleton organization
      is carried by ARHGAP35 and ARHGAP17. GO:0051497 is proposed because it matches
      the observation exactly; GO:0032956 would be the conservative alternative if a
      reviewer prefers not to commit to stress fibres specifically from an overexpression
      phenotype. The evidence code should stay TAS, since this remains an author statement.'
    proposed_replacement_terms:
    - id: GO:0051497
      label: negative regulation of stress fiber assembly
    supported_by:
    - reference_id: PMID:8570618
      supporting_text: Its localization in a narrow cytoplasmic region just below the
        plasma membrane and its inhibitory effect on stress fiber organization indicate
        that p115 may down regulate rho-like GTPases in hematopoietic cells.
