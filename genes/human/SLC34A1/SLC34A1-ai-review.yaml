- term:
    id: GO:0045838
    label: positive regulation of membrane potential
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q06496
  - ensembl:ENSRNOP00000031764
  review:
    summary: Electrogenic transport depolarizes the membrane; wrong-sign term -> membrane depolarization.
    action: MODIFY
    reason: 'The electrogenic 3 Na+ : 1 Pi symport carries net positive charge (+1 per transport cycle)
      into the cell, which depolarizes the plasma membrane. GO:0045838 is the wrong sign: its definition
      is increasing the *extent* of the membrane potential, whereas depolarization *decreases* the extent
      (moves Vm from negative toward a more positive value). The sign-unambiguous term for this process is
      GO:0051899 membrane depolarization ("membrane potential decreases ... from negative potential to a
      more positive potential"). A real but non-core electrophysiological consequence of the transport cycle;
      sign/lateral MODIFY.'
    proposed_replacement_terms:
    - id: GO:0051899
      label: membrane depolarization
    supported_by:
    - reference_id: file:human/SLC34A1/SLC34A1-uniprot.txt
      record_section:
      - CC:FUNCTION
      supporting_text: a Na(+):Pi stoichiometry of 3:1 and is electrogenic
