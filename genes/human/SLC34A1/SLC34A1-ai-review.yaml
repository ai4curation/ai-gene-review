id: Q06495
gene_symbol: SLC34A1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'SLC34A1 encodes the renal type-IIa sodium-dependent phosphate cotransporter (NaPi-IIa /
  NaPi-2a), the principal apical phosphate transporter of the kidney proximal-tubule brush-border membrane.
  It electrogenically imports inorganic phosphate coupled to sodium with a 3 Na+ : 1 Pi stoichiometry,
  driving renal phosphate reabsorption and thereby setting systemic phosphate homeostasis. Its brush-border
  abundance is hormonally regulated - parathyroid hormone and FGF23 trigger its internalization and degradation,
  while dietary phosphate restriction increases it - and its apical retention depends on the C-terminal
  PDZ-binding motif that engages the NHERF1/PDZK1 scaffold network. Loss-of-function mutations cause hypophosphatemic
  nephrolithiasis/osteoporosis and infantile hypercalcemia/Fanconi renotubular syndrome.'
