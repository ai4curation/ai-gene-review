    label: ossification
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q06496
  - ensembl:ENSRNOP00000031764
  review:
    summary: Ossification (distal systemic consequence, over-annotated).
    action: MARK_AS_OVER_ANNOTATED
    reason: Any effect on ossification is a distal systemic consequence of renal phosphate 
      homeostasis; NaPi-IIa performs no step of ossification (participation test). Over-annotation.
- term:
    id: GO:0001822
    label: kidney development
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q06496
  - ensembl:ENSRNOP00000031764
  review:
    summary: Kidney development (over-annotated; mature-function transporter).
    action: MARK_AS_OVER_ANNOTATED
    reason: NaPi-IIa is a mature proximal-tubule transport function; its loss causes phosphate 
      wasting, not a kidney-development defect. Expression in the kidney is not a developmental 
      role. Over-annotation.
