  review:
    summary: No UBR5 RNA-binding function is established.
    action: REMOVE
    reason: The InterPro2GO RNA-binding row is driven by C-terminal PABC-like/PABP_HYD_C signatures 
      in UBR5, not by RNA-binding evidence. UBR5 uses that region as a protein-interaction module in
      a HECT ubiquitin ligase, and the reviewed literature and UniProt record do not support RNA 
      binding as a molecular function.
