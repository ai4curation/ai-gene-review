    - reference_id: PMID:37040767
      supporting_text: In addition to HECT, UBR5 also contains a Ub association domain (UBA) that 
        interacts with Ub 51,52, two predicted small beta-barrel domains (SBB1 and SBB2), a 
        70-residue zinc finger UBR-Box that recognizes the N-degron 31,53,54, and an MLLE (the term 
        comes from a signature motif, MLLEKITG) domain that mediates protein-protein interactions 
        55.
