id: O95071
gene_symbol: UBR5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'UBR5 is a large HECT-family E3 ubiquitin ligase that uses a UBR box, UBA domain, PABC/MLLE
  domain, and C-terminal HECT catalytic domain to recognize substrates and extend ubiquitin chains. It
  acts in the nucleus on transcriptional regulators, including unpaired transcription-factor subunits
  and ligand-bound nuclear receptors, and in the cytoplasm with UBR4 to build branched K11/K48 ubiquitin
  chains on aggregation-prone proteins for proteasomal degradation. UBR5 also assembles additional degradative
  or regulatory chain topologies, including K48/K63-branched chains on ITCH-primed TXNIP and K11/K29-linked
  chains on beta-catenin, and thereby connects ubiquitin-chain elongation to proteostasis, Wnt signaling,
  DNA-damage chromatin regulation, and transcription-factor turnover.'
