suggested_questions:
- question: Which UBR5 substrates account for its essential developmental and neurodevelopmental 
    roles in vivo, and are they handled by the same orphan-quality-control mechanism used for 
    nuclear transcriptional regulators?
- question: Does UBR5 directly ubiquitinate ESR1 in estrogen-treated breast cancer cells, or does it
    act through the same nuclear-receptor binding mechanism but on another pathway component?
suggested_experiments:
- description: Reconstitute estradiol-bound ESR1 ubiquitination with purified ESR1, UBR5, E1, E2, 
    and ubiquitin, and compare wild-type ESR1 with hydrophobic-cleft mutants that disrupt UBR5 
    binding.
  experiment_type: in vitro ubiquitination assay
- description: Use inducible endogenous UBR5 degron or catalytic-rescue cell lines followed by 
    ubiquitin-remnant proteomics in cytosolic and nuclear fractions to distinguish direct UBR5 
    substrates from secondary abundance changes.
  experiment_type: ubiquitin remnant proteomics
