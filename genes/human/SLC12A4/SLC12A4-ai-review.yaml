    label: potassium ion import across plasma membrane
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q28677
  review:
    summary: >-
      Directionally specified K+ import, but KCC1 physiologically mediates K+ efflux,
      not import.
    action: MODIFY
    reason: >-
      GO:1990573 is defined as the movement of K+ from outside the cell into the cytosol
      (import). KCC1 is activated by cell swelling and, under physiological gradients,
      drives net K+ (and Cl-) efflux to effect regulatory volume decrease; it is a
      principal K+-efflux pathway in erythrocytes. The import direction is not the
      physiological role, so generalize to the non-directional potassium ion
      transmembrane transport term, which the gene already carries.
    proposed_replacement_terms:
    - id: GO:0071805
      label: potassium ion transmembrane transport
core_functions:
- description: >-
    Electroneutral K+:Cl- symport across the plasma membrane, activated by cell
    swelling, driving coupled K+ and Cl- efflux to effect regulatory volume decrease
    and cell-volume / intracellular ion homeostasis.
  molecular_function:
    id: GO:0015379
    label: potassium:chloride symporter activity
  directly_involved_in:
  - id: GO:0006884
    label: cell volume homeostasis
  - id: GO:0071805
    label: potassium ion transmembrane transport
  - id: GO:1902476
    label: chloride transmembrane transport
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:10913127
    supporting_text: >-
      Both KCCs express minimal K(+)-Cl(-) cotransport under isotonic
      conditions, with significant activation by cell swelling under hypotonic
      conditions.
  - reference_id: PMID:34031912
    supporting_text: >-
      Potassium-coupled chloride transporters (KCCs) play crucial roles in regulating
      cell volume and intracellular chloride concentration.
proposed_new_terms: []
suggested_questions:
- question: >-
    What determines the subcellular polarity of KCC1 (basolateral vs apical) in
    polarized epithelia, and does it differ from the family-level apical placement
    inferred phylogenetically?
- question: >-
    What is the physiological role of the C-terminal ATP/ADP-binding pocket in gating
    KCC1 transport, and how does it integrate with SPAK/OSR1/WNK phospho-regulation?
suggested_experiments:
- description: >-
    Endogenous immunolocalization (or knock-in tagging) of KCC1 in polarized epithelial
    monolayers to resolve apical vs basolateral membrane targeting directly, rather than
    by phylogenetic inference.
- description: >-
    Structure-guided mutagenesis of the CTD ATP/ADP-binding residues (e.g. K699, K707,
    V730) combined with Rb+/K+-uptake assays to test whether nucleotide occupancy
    modulates transport rate or coupling.
