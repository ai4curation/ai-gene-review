  qualifier: enables
  review:
    summary: >-
      Cryo-EM resolves an ATP/ADP-binding pocket in the KCC1 C-terminal domain;
      nucleotide binding is regulatory, not the energy source for transport.
    action: KEEP_AS_NON_CORE
    reason: >-
      Well-supported by direct structural evidence, but ATP binding is a regulatory
      feature of the cytoplasmic CTD rather than a core function: KCC1 is a secondary
      active transporter powered by the K+ gradient, not by ATP hydrolysis. Kept as
      an accurate but peripheral molecular-function annotation.
    supported_by:
