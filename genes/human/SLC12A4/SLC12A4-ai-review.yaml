id: Q9UP95
gene_symbol: SLC12A4
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  SLC12A4 (KCC1) is an electroneutral potassium-chloride cotransporter of the
  cation-chloride cotransporter (SLC12/CCC) family. It is a multi-pass plasma
  membrane glycoprotein that assembles as a domain-swapped homodimer and mediates
  the coupled, electroneutral symport of K+ and Cl- across the plasma membrane
  according to the reaction K+(in) + Cl-(in) = K+(out) + Cl-(out). The transporter
  is a secondary active carrier that uses the transmembrane K+ gradient as its
  energy source rather than ATP hydrolysis; under physiological gradients it drives
  net K+ and Cl- efflux. Transport is quiescent under isotonic conditions and is
  switched on by cell swelling, through dephosphorylation of regulatory sites in the
  cytoplasmic N- and C-terminal domains (SPAK/OSR1 and WNK kinase control); a
  nucleotide (ATP/ADP)-binding pocket in the C-terminal domain further modulates
  activity. By extruding K+ and Cl- with osmotically obligated water, KCC1 effects
  regulatory volume decrease and contributes to cell-volume regulation and to
  intracellular potassium and chloride homeostasis. It is broadly expressed and is a
  major potassium-efflux pathway in
  erythrocytes, where elevated activity promotes red-cell dehydration.
