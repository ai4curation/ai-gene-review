    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      KCC1 acts at the plasma membrane, but the apical sub-location is a KCC
      family-level call (polarity varies across KCC paralogs). For SLC12A4
      specifically, UniProt infers a role in basolateral Cl- exit in NaCl-absorbing
