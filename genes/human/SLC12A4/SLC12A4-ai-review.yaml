- term:
    id: GO:0005765
    label: lysosomal membrane
  evidence_type: HDA
  original_reference_id: PMID:17897319
  qualifier: located_in
  review:
    summary: >-
      Detected in a lysosomal-membrane proteome; a peripheral/trafficking location
      for a transporter whose primary site of action is the plasma membrane.
    action: KEEP_AS_NON_CORE
    reason: >-
      Direct high-throughput proteomic localization to the lysosomal membrane. KCCs
      are known to traffic through the endolysosomal system (phosphorylation-dependent
      lysosomal degradation is documented for the paralog KCC2), so this is
      biologically plausible but peripheral to the core plasma-membrane transport
      function. Lysosomal membrane is a sub-compartment term (not a root organelle
      term), and the direct assay is retained as a non-core location.
