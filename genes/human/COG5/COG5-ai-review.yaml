suggested_questions:
- question: Which COG5 product-specific regions control COG7 association and cooperative COG6 incorporation?
- question: Does COG5 directly stabilize or recycle ATP7A, and can that effect be separated from loss
    of the larger COG complex?
suggested_experiments:
- description: Compare sequence-verified COG5 products at matched expression in deficient human cells,
    measuring COG7/COG6 assembly and defined retrograde cargo flux alongside Golgi morphology.
  hypothesis: Product-specific sequence changes can alter cooperative assembly without uniformly abolishing
    every COG5 interaction.
- description: Measure ATP7A localization and recycling kinetics after acute COG5 perturbation, with assembly-preserving
    separation-of-function variants and protein-turnover controls.
  hypothesis: The ATP7A stability phenotype reflects a separable trafficking step rather than an intrinsic
    copper-transport activity of COG5.
