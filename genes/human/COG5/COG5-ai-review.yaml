- id: PMID:19690088
  title: Deficiency in COG5 causes a moderate form of congenital disorders of glycosylation.
  findings:
  - statement: A patient COG5 splice defect reduces protein abundance and delays fibroblast
      BFA-induced retrograde redistribution; wild-type cDNA rescues the defect. Serum glycoproteins
      show impaired sialylation.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete genuine normal abstract read. No full Methods or patient-table inspection
      is claimed. The abstract explicitly reports the target and rescue.
- id: PMID:23228021
  title: 'COG5-CDG: expanding the clinical spectrum.'
  findings:
  - statement: COG5-deficient patient fibroblasts have reduced COG5/COG7 abundance and delayed
      GalT-GFP redistribution from Golgi to ER. The clinical spectrum is broader than the first
      mild case.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Actual selected full mutation/protein/BFA Methods, patient Results and Discussion
      were read. Original variant coordinates are retained as published; equivalent activity
      of every current product is not asserted.
- id: PMID:33277529
  title: COG5 variants lead to complex early onset retinal degeneration, upregulation of PERK
    and DNA damage.
  findings:
  - statement: Two human COG5 variants perturb Golgi morphology in cell models and can activate
      PERK-associated stress. Separate retinal experiments manipulate PERK, not COG5 directly.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Actual selected full human construct/cell Methods and Golgi/stress Results
      were read. Human constructs, mouse N1E-115 cells, HEK293 cells and PERK-driven mouse retinal
      experiments are distinguished.
- id: PMID:41824529
  title: COG5 deficiency disrupts cellular copper homeostasis and underlies the impaired mitochondrial
    OXPHOS function.
  findings:
  - statement: COG5 associates with ATP7A in cells and affects its stability, copper balance
      and downstream respiratory phenotypes. ATP7A recycling/localization is a proposed mechanism
      rather than a directly resolved COG5 transport reaction.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Actual selected full co-immunoprecipitation/rescue/copper Methods, Results
      and Discussion were read. Patient EBV-transformed lymphocytes and HEK293T loss/rescue
      models are distinguished. The source acknowledges model limits and conflicting clinical
      variant evidence; it is not used to assign copper-transporter or respiratory catalysis
      to COG5.
core_functions:
- description: Provides structural assembly activity within the COG complex, including cooperative
    incorporation of COG6 with COG7. This supports Golgi retrograde recycling and architecture.
    The evidence establishes a complex contribution, not isolated tethering or fusion by COG5.
    Equal activity of all four current products has not been demonstrated.
