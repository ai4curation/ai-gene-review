- id: PMID:11980916
  title: Characterization of a mammalian Golgi-localized protein complex, COG, that is required
    for normal Golgi morphology and function.
  findings:
  - statement: The purified mammalian COG complex includes GTC-90/COG5. Smaller COG5-containing
      material is also observed, with its origin unresolved. New knockout and localization experiments
      predominantly concern other COG subunits.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected protected cache remains abstract-only. Selected actual Results/Discussion
      from the distinct genuine normal full variant were read; no cache replacement or all-subunit
      assay equivalence is claimed.
- id: PMID:15047703
  title: The binary interacting network of the conserved oligomeric Golgi tethering complex.
  findings:
  - statement: Human COG5 and COG7 associate and cooperatively incorporate COG6 into a reconstructed
      subcomplex. This supports an integral structural role.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected protected abstract is unchanged. Original author-uploaded indexed
      Methods, Table I and assembly Results were read externally. Human constructs were translated
      in rabbit reticulocyte lysate; purified-protein confirmation of binary directness was
      explicitly reserved.
- id: PMID:19946888
  title: Defining the membrane proteome of NK cells.
  findings:
  - statement: The study profiles the membrane fraction of the YTS NK-like cell line; the exact
      COG5 detection remains unverified.
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: Complete selected abstract and publisher landing page read. The original supplemental
      spreadsheet request returned 403 and the full-text link redirected to the abstract; no
      target-table read is claimed. Independent COG5 membrane evidence supports retaining the
      broad location.
  full_text_unavailable: true
- id: PMID:27066481
  title: 'COG Complex Complexities: Detailed Characterization of a Complete Set of HEK293T Cells
    Lacking Individual COG Subunits.'
  findings:
  - statement: Human COG5 knockout disrupts subunit stability and Golgi ultrastructure. Replacement
      subunits localize to the Golgi and restore glycosylation phenotypes; pathway-level trafficking
      assays require their assay-specific limits.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected full source Methods/Results/Discussion and legends were read. COG5-specific
      stability and ultrastructure findings are distinguished from assays performed on representative
      COG knockout subsets.
- id: PMID:33961781
  title: Dual proteome-scale networks reveal cell-specific remodeling of the human interactome.
  findings:
  - statement: Exact positive BioPlex records support COG5 association with COG4 and COG7 in
      HEK293T and HCT116 cells.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Selected exact-main cache contains an abstract and Introduction/Discussion,
      not complete Methods/Results. Those passages and all four exact BioPlex target/paper/partner
      records were read. Record-specific bait/prey/host metadata are retained.
- id: PMID:9792665
  title: Purification and characterization of a novel 13 S hetero-oligomeric protein complex
    that stimulates in vitro Golgi transport.
  findings:
  - statement: GTC-90/COG5 is part of a transport-stimulating mammalian complex with cytosolic
      and Golgi-associated pools. Human splice cDNAs were characterized separately from the
      functional assay.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Genuine normal abstract remains unchanged. Original indexed full Methods and
      selected Results/localization text were recovered and read externally. Functional material
      was bovine, donor/acceptor Golgi were CHO, and microscopy used rat NRK cells; no human
      all-product activity is inferred.
