gene_symbol: COG5
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: COG5 is a noncatalytic subunit of the conserved oligomeric Golgi complex. It helps assemble
  and stabilize the complex's lobe B, cooperating with COG7 to incorporate COG6. Cytosolic and peripheral
  Golgi-associated COG5 pools support the organization of trafficking machinery that recycles Golgi components
  and maintains Golgi architecture. Disruption of this machinery alters glycosylation indirectly by disturbing
  the distribution and stability of Golgi proteins. Biallelic COG5 variants cause a congenital disorder
  of glycosylation with variable neurological and systemic manifestations.
