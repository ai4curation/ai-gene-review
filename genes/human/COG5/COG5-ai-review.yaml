- id: PMID:11980916
  title: Characterization of a mammalian Golgi-localized protein complex, COG, that is required for normal
    Golgi morphology and function.
  findings:
  - statement: The purified mammalian COG complex includes GTC-90/COG5. Smaller COG5-containing material
      is also observed, with its origin unresolved. New knockout and localization experiments predominantly
      concern other COG subunits.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Protected abstract retained; the distinct genuine full variant is publicly available
      at https://pmc.ncbi.nlm.nih.gov/articles/PMC2173297/. Results on COG purification and Figure 1 identify
      two Cog5-containing fractions; whether the smaller complex exists in vivo or arises during lysis
      is unresolved. Cog1/2 knockout experiments and new Cog1/7 microscopy are not COG5 experiments. Selected
      original Results/Discussion and legends were read, not every figure.
  full_text_unavailable: false
- id: PMID:15047703
  title: The binary interacting network of the conserved oligomeric Golgi tethering complex.
  findings:
  - statement: Human COG5 and COG7 associate and cooperatively incorporate COG6 into a reconstructed subcomplex.
      This supports an integral structural role.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Protected abstract retained. The original author-uploaded article was read at https://www.researchgate.net/publication/8652574_The_Binary_Interacting_Network_of_the_Conserved_Oligomeric_Golgi_Tethering_Complex.
      Experimental Procedures/Table I identify human constructs and rabbit reticulocyte lysate. Results
      on binary interactions and COG6/COG8 incorporation establish cooperative assembly; purified binary
      affinities remain unproven. The notes give exact section locators and one short methods excerpt.
  full_text_unavailable: false
- id: PMID:19946888
  title: Defining the membrane proteome of NK cells.
  findings:
  - statement: The study profiles the membrane fraction of the YTS NK-like cell line; the exact COG5 detection
      remains unverified.
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: Complete selected abstract and publisher landing page read. The original supplemental
      spreadsheet request returned 403 and the full-text link redirected to the abstract; no target-table
      read is claimed. Independent COG5 membrane evidence supports retaining the broad location.
  full_text_unavailable: true
- id: PMID:27066481
  title: 'COG Complex Complexities: Detailed Characterization of a Complete Set of HEK293T Cells Lacking
    Individual COG Subunits.'
  findings:
  - statement: Human COG5 knockout disrupts subunit stability and Golgi ultrastructure. Replacement subunits
      localize to the Golgi and restore glycosylation phenotypes; pathway-level trafficking assays require
      their assay-specific limits.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected full source Methods/Results/Discussion and legends were read. COG5-specific
      stability and ultrastructure findings are distinguished from assays performed on representative
      COG knockout subsets.
