- id: PMID:9792665
  title: Purification and characterization of a novel 13 S hetero-oligomeric protein complex that stimulates
    in vitro Golgi transport.
  findings:
  - statement: GTC-90/COG5 is part of a transport-stimulating mammalian complex with cytosolic and Golgi-associated
      pools. Human splice cDNAs were characterized separately from the functional assay.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Normal abstract retained. Original full text at https://www.researchgate.net/publication/13493088_Purification_and_Characterization_of_a_Novel_13_S_Hetero-oligomeric_Protein_Complex_That_Stimulates_in_VitroGolgi_Transport
      was read in the Golgi transport methods, antibody-inhibition Results and Figure 10 legend/localization
      text. Functional material is bovine, donor/acceptor Golgi are CHO, and NRK-52E cells provide microscopy.
      IgG inhibition with noninhibitory Fab is not isolated COG5 depletion/reconstitution. Notes provide
      checkable locators and a short control excerpt.
  full_text_unavailable: false
- id: Reactome:R-HSA-6809006
  title: Vesicle is tethered through binding GOLGA2:GORASP1, GOLGB1 and the COG complex
  findings:
  - statement: The curated event contains the Q9UP83-bearing COG complex at its modeled Golgi or trans-Golgi-network
      membrane location.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: This tethering event places the octameric COG complex at the cis-Golgi membrane alongside
      golgins and vesicle-associated factors. It supports the location of the COG5 subunit; it does not
      establish an isolated COG5 tethering reaction. The original event identifier, qualifier and target
      assertion are preserved.
- id: Reactome:R-HSA-6809010
  title: COPI vesicle uncoating
  findings:
  - statement: The curated event contains the Q9UP83-bearing COG complex at its modeled Golgi or trans-Golgi-network
      membrane location.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The uncoating event retains the COG complex on the Golgi membrane while coat components
      are released. This supports the cellular-component annotation, not a claim that COG5 catalyses COPI
      coat removal. The original event identifier, qualifier and target assertion are preserved.
- id: Reactome:R-HSA-6809011
  title: cis-Golgi t-SNAREs bind YKT6 on tethered vesicle
  findings:
  - statement: The curated event contains the Q9UP83-bearing COG complex at its modeled Golgi or trans-Golgi-network
      membrane location.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The cis-Golgi SNARE event represents membrane-associated COG in a tethered-vesicle assembly.
      Its location supports this annotation; SNARE zippering itself is performed by the SNARE machinery,
      not demonstrated for COG5. The original event identifier, qualifier and target assertion are preserved.
- id: Reactome:R-HSA-6811431
  title: RAB6:GTP binds the GARP and COG complexes, t-SNAREs and endosome-derived vesicles
  findings:
  - statement: The curated event contains the Q9UP83-bearing COG complex at its modeled Golgi or trans-Golgi-network
      membrane location.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The RAB6/endosome-derived-vesicle event places a COG-containing assembly at the trans-Golgi
      network membrane. It supports the location. Reactome explicitly leaves joint GARP–COG capture of
      one vesicle unestablished; no such simultaneous mechanism is inferred. The original event identifier,
      qualifier and target assertion are preserved.
- id: Reactome:R-HSA-6811433
  title: The COG tethering complex interacts with numerous SNAREs at the Golgi membrane
  findings:
  - statement: The curated event contains the Q9UP83-bearing COG complex at its modeled Golgi or trans-Golgi-network
      membrane location.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The curated event places the COG complex and associated SNARE assemblies at the Golgi
      membrane. Retain COG5 location through complex membership; specific contacts demonstrated for other
      COG subunits are not reassigned to COG5. The original event identifier, qualifier and target assertion
      are preserved.
- id: Reactome:R-HSA-6814682
  title: Fusion of early-endosome derived vesicles at the TGN
  findings:
  - statement: The curated event contains the Q9UP83-bearing COG complex at its modeled Golgi or trans-Golgi-network
      membrane location.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The early-endosome-vesicle fusion event represents COG in the trans-Golgi membrane context.
      It supports this location while the precise fusion mechanism remains incompletely established; it
      does not assign autonomous fusion activity to COG5. The original event identifier, qualifier and
      target assertion are preserved.
- id: Reactome:R-HSA-8847544
  title: The COG complex and CUX1 and GOLGA5 dimers contribute to intra-Golgi vesicle tethering
  findings:
  - statement: The curated event contains the Q9UP83-bearing COG complex at its modeled Golgi or trans-Golgi-network
      membrane location.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: This intra-Golgi tethering event represents COG with CUX1 and GOLGA5 at the Golgi membrane.
      It supports the location and integrated machinery context without assigning the golgins’ individual
      activities to COG5. The original event identifier, qualifier and target assertion are preserved.
- id: Reactome:R-HSA-8847635
  title: Formation of cis-SNARE complex and membrane fusion in intra-Golgi retrograde traffic
  findings:
  - statement: The curated event contains the Q9UP83-bearing COG complex at its modeled Golgi or trans-Golgi-network
      membrane location.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The intra-Golgi fusion event includes membrane-associated COG as the tethering assembly
      is recycled. Retain the location; neither autonomous membrane fusion nor SNARE-complex catalysis
      is inferred for COG5. The original event identifier, qualifier and target assertion are preserved.
- id: Reactome:R-HSA-8849748
  title: The COG complex binds RABs at the Golgi membrane
  findings:
  - statement: The curated event contains the Q9UP83-bearing COG complex at its modeled Golgi or trans-Golgi-network
      membrane location.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The RAB-interaction event localizes the COG complex to the Golgi membrane. This is a
      complex-level location premise, not a target-specific demonstration of every listed RAB–COG5 contact.
      The original event identifier, qualifier and target assertion are preserved.
- id: PMID:19690088
  title: Deficiency in COG5 causes a moderate form of congenital disorders of glycosylation.
  findings:
  - statement: A patient COG5 splice defect reduces protein abundance and delays fibroblast BFA-induced
      retrograde redistribution; wild-type cDNA rescues the defect. Serum glycoproteins show impaired
      sialylation.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete available abstract read; no full Methods claim. It reports the COG5 splice
      defect, impaired BFA-induced Golgi-to-ER redistribution and wild-type cDNA rescue. This is supporting
      human retrograde-trafficking evidence linked to the existing transport assessment, not a direct
      intra-Golgi flux measurement.
- id: PMID:23228021
  title: 'COG5-CDG: expanding the clinical spectrum.'
  findings:
  - statement: COG5-deficient patient fibroblasts have reduced COG5/COG7 abundance and delayed GalT-GFP
      redistribution from Golgi to ER. The clinical spectrum is broader than the first mild case.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected full Methods/Results were read, including BFA assay Methods and Figure 6 Results.
      Patient fibroblasts expressing GalT-GFP show delayed Golgi-to-ER redistribution. The introduction
      explains BFA-induced tubular Golgi collapse; this paper does not newly perform the cDNA rescue reported
      in PMID:19690088. These results corroborate trafficking dysfunction without resolving a separate
      COG5 vesicle-mediated Golgi-to-ER step.
- id: PMID:33277529
  title: COG5 variants lead to complex early onset retinal degeneration, upregulation of PERK and DNA
    damage.
  findings:
  - statement: Two human COG5 variants perturb Golgi morphology in cell models and can activate PERK-associated
      stress. Separate retinal experiments manipulate PERK, not COG5 directly.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Actual selected full human construct/cell Methods and Golgi/stress Results were read.
      Human constructs, mouse N1E-115 cells, HEK293 cells and PERK-driven mouse retinal experiments are
      distinguished.
- id: PMID:41824529
  title: COG5 deficiency disrupts cellular copper homeostasis and underlies the impaired mitochondrial
    OXPHOS function.
  findings:
  - statement: COG5 associates with ATP7A in cells and affects its stability, copper balance and downstream
      respiratory phenotypes. ATP7A recycling/localization is a proposed mechanism rather than a directly
      resolved COG5 transport reaction.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Actual selected full co-immunoprecipitation/rescue/copper Methods, Results and Discussion
      were read. Patient EBV-transformed lymphocytes and HEK293T loss/rescue models are distinguished.
      The source acknowledges model limits and conflicting clinical variant evidence; it is not used to
      assign copper-transporter or respiratory catalysis to COG5.
core_functions:
- description: Provides structural assembly activity within the COG complex, including cooperative incorporation
    of COG6 with COG7. This supports Golgi retrograde recycling and architecture. The evidence establishes
    a complex contribution, not isolated tethering or fusion by COG5. Equal activity of all four current
    products has not been demonstrated.
