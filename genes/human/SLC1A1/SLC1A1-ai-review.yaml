    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: is_active_in
  supporting_entities:
  - UniProtKB:P51906
  - ensembl:ENSMUSP00000025875
  review:
    summary: '''Active in cytoplasm'' is misleading: EAAT3 performs transport at the plasma membrane;
      its intracellular pool resides in endosomal membranes, not free in cytoplasm.'
    action: MARK_AS_OVER_ANNOTATED
    reason: The transport activity is exerted at the plasma membrane; the cytoplasmic/endosomal pool is
      a trafficking reservoir. The is_active_in cytoplasm assertion over-states the site of activity.
