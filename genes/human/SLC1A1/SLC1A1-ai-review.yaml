core_functions:
- description: High-affinity, Na+-coupled transport of L-glutamate across the plasma membrane. EAAT3 symports
    one glutamate with 3 Na+ and 1 H+ while counter-transporting 1 K+, driving concentrative uptake; in
    renal/intestinal epithelia this occurs at the apical membrane and mediates reabsorption of filtered
    glutamate.
