- term:
    id: GO:0005253
    label: monoatomic anion channel activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: enables
  supporting_entities:
  - UniProtKB:P51906
  - ensembl:ENSMUSP00000025875
  review:
    summary: EAATs possess a substrate-gated uncoupled anion conductance; monoatomic anion channel activity
      reflects this genuine biophysical property.
    action: KEEP_AS_NON_CORE
    reason: Real anion-channel behaviour of the EAAT family (uncoupled Cl- flux), but modulatory/non-core
      relative to the concentrative amino-acid transport function.
