id: P43005
gene_symbol: SLC1A1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SLC1A1 (EAAT3/EAAC1) is a sodium-dependent, high-affinity transmembrane transporter of acidic
  amino acids that mediates concentrative uptake of L-glutamate, L-aspartate and D-aspartate and also
  transports L-cysteine. It is a secondary active transporter belonging to the dicarboxylate/amino acid:cation
  symporter (DAACS; SLC1) family and assembles as a homotrimer in which each protomer works independently
  by an elevator-type mechanism. Each transport cycle couples uptake of one amino acid to the symport
  of three Na+ and one H+ and the antiport of one K+, allowing it to build transmembrane substrate gradients
  exceeding a millionfold; it additionally carries a thermodynamically uncoupled chloride (anion) conductance.
  EAAT3 operates at the plasma membrane and, in polarized epithelia, at the apical membrane. Its dominant
  physiological role in humans is reabsorption of glutamate and aspartate from the glomerular filtrate
  in the renal proximal tubule (and uptake in intestine); loss of function causes dicarboxylic aminoaciduria.
  In neurons it is a somatodendritic/perisynaptic transporter that buffers extracellular glutamate and,
  uniquely among the EAATs, provides the major Na+-dependent cysteine-uptake route that supplies cysteine,
  the rate-limiting precursor for glutathione synthesis, thereby supporting antioxidant defense. Surface
  expression is set by regulated endosomal trafficking and by interactions with partners including ARL6IP5
  (GTRAP3-18), caveolin-1, Numb and PDZ-domain scaffolds.
