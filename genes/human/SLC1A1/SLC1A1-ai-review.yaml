- term:
    id: GO:0006750
    label: glutathione biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P51906
  - ensembl:ENSMUSP00000025875
  review:
    summary: 'Glutathione biosynthetic process: EAAT3 supplies the rate-limiting precursor cysteine but
      does not catalyse any glutathione-biosynthesis step.'
    action: MARK_AS_OVER_ANNOTATED
    reason: 'Participation test fails: the biosynthetic steps are carried out by glutamate-cysteine ligase
      and glutathione synthetase; EAAT3 only imports the substrate (cysteine). UniProt frames this as
      a contributory role (''Contributes to glutathione biosynthesis ... via its role in ... transport'').
      Over-annotation; the correct machine-readable role is cysteine transport (retained).'
    supported_by:
    - reference_id: file:human/SLC1A1/SLC1A1-uniprot.txt
      supporting_text: Contributes to glutathione biosynthesis and protection against oxidative stress
        via its role in L-glutamate and L-cysteine transport
      record_section:
      - CC:FUNCTION
    - reference_id: PMID:33658209
      supporting_text: transport cysteine, which is a rate-limiting intermediate in the biosynthesis of
        the antioxidant glutathione
