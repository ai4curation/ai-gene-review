proposed_new_terms: []
suggested_questions:
- question: What is the physiological role, if any, of the EAAT3 uncoupled chloride (anion) conductance
    in neuronal excitability and epithelial function, as distinct from its concentrative amino-acid transport?
- question: To what extent does EAAT3-mediated neuronal cysteine uptake (vs system xc- and other routes)
    determine neuronal glutathione levels and vulnerability to oxidative stress in humans?
suggested_experiments:
- description: Cell-type-specific conditional Slc1a1 knockout combined with glutathione and oxidative-stress
    readouts in neurons vs renal epithelium to dissect the cysteine/glutathione-supply role from the glutamate/aspartate
    reabsorption role.
- description: Structure-guided mutations that selectively abolish the uncoupled anion conductance while
    preserving coupled amino-acid transport, assayed in neurons for effects on excitability, to test whether
    the anion channel has an independent physiological function.
