- term:
    id: GO:0047144
    label: 2-acylglycerol-3-phosphate O-acyltransferase activity
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-1482546
  qualifier: enables
  review:
    summary: Reactome 2-acyl-LPG acylation event mapped to 2-acylglycerol-3-phosphate (LPA) O-acyltransferase
      activity; wrong substrate and doubtful underlying activity.
    action: REMOVE
    reason: This Reactome-derived TAS asserts lysophosphatidic acid (LPA) acyltransferase activity (acyl-CoA
      + acyl-sn-glycerol-3-phosphate -> phosphatidate). The Reactome event it comes from describes acylation
      of lysophosphatidylglycerol (LPG) to phosphatidylglycerol, not of LPA; LPA and LPG differ in head
      group, so the mapped GO term names a reaction that has never been reported for CRLS1. The underlying
      LPG acyltransferase claim itself rests on a single report from one laboratory (Nie et al. 2010,
      PMID:20025994), has not been independently replicated, is mechanistically unusual for a CDP-alcohol
      phosphatidyltransferase-fold enzyme that has no acyltransferase motif, and used LPGAT1 as its positive
      control - a protein whose LPG acyltransferase assignment has since been questioned (see the human
      LPGAT1 review). Because the annotation is a curator-statement (TAS) mapping onto the wrong substrate
      class rather than an experimental assertion, removal is appropriate. Whether CRLS1 should instead
      carry a lysophospholipid acyltransferase term is raised as a suggested question rather than proposed
      as a replacement.
    additional_reference_ids:
    - PMID:20025994
    supported_by:
    - reference_id: PMID:20025994
      supporting_text: In this report, we identified a novel function of the hCLS1 enzyme as an acyl-CoA
        dependent LPG acyltransferase.
    - reference_id: file:human/CRLS1/CRLS1-uniprot.txt
      supporting_text: Belongs to the CDP-alcohol phosphatidyltransferase class-I
