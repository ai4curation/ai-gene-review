- term:
    id: GO:0036148
    label: phosphatidylglycerol acyl-chain remodeling
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-1482925
  qualifier: involved_in
  review:
    summary: Reactome places CRLS1 in PG acyl-chain remodeling on the basis of a single report of LPG
      acyltransferase activity.
    action: UNDECIDED
    reason: The only evidence that CRLS1 participates in phosphatidylglycerol remodeling is Nie et al.
      2010 (PMID:20025994), which reported CDP-DAG-independent, acyl-CoA-dependent LPG acyltransferase
      activity of recombinant and purified hCLS1. The data are internally consistent in that paper, but
      the activity has not been replicated by other groups, is chemically distinct from the CDP-alcohol
      phosphatidyltransferase mechanism of the enzyme, and relied on LPGAT1 as a positive control whose
      own substrate assignment has since been revised. In contrast, CRLS1 is firmly established as a consumer
      of PG for de novo cardiolipin synthesis (patient cells accumulate PG). Neither accepting nor removing
      this process is well supported; independent confirmation of the acyltransferase activity is needed.
    additional_reference_ids:
    - PMID:20025994
    supported_by:
    - reference_id: PMID:20025994
      supporting_text: In this report, we identified a novel function of the hCLS1 enzyme as an acyl-CoA
        dependent LPG acyltransferase.
    - reference_id: PMID:20025994
      supporting_text: The LPG acyltransferase activity of the hCLS1 enzyme did not require the presence
        of CDP-DAG, suggesting that the LPG acyltransferase activity of hCLS1 enzyme is independent from
        its CL synthase activity.
