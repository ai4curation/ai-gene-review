suggested_questions:
- question: Does CRLS1 really have acyl-CoA-dependent lysophosphatidylglycerol acyltransferase activity
    (Nie et al. 2010)? If confirmed, the appropriate MF would be a lysophospholipid acyltransferase term
    rather than the lysophosphatidic acid acyltransferase terms (GO:0003841, GO:0047144) Reactome mapped;
    if not, the Reactome LPG-acylation and PG remodeling events for CRLS1 should be retired.
  experts:
  - Reactome lipid metabolism curators
  - Vaz lab
  - Hatch lab
- question: Is CRLS1 a stable subunit of a defined cardiolipin-synthesizing complex with PGS1 and PTPMT1
    (700-800 kDa), and if so, should a protein-containing complex term be created?
  experts:
  - McQuibban lab
- question: Do the PANTHER/InterPro family-level transfers for cardiolipin synthase in protists correctly
    distinguish CDP-type (PTHR14269/IPR000462) from PLD-type (GO:0008808) enzymes in species that carry
    both, as reconstructed for LECA?
  experts:
  - PAINT curators
suggested_experiments:
- hypothesis: The LPG acyltransferase activity reported for hCLS1 is intrinsic to the enzyme rather than
    a co-purifying activity.
  description: Assay purified wild-type CRLS1 and a catalytic CDP-alcohol phosphotransferase motif mutant
    for acyl-CoA:LPG acyltransferase activity in parallel with CMP-forming CL synthase activity, and measure
    LPG and PG acyl profiles in CRLS1-knockout versus rescued cells by lipidomics.
  experiment_type: biochemical
- hypothesis: Pathogenic CRLS1 variants reduce catalytic activity rather than protein stability or localization.
  description: Express each COXPD57 variant in crd1-null yeast and CRLS1-knockout human cells; measure
    CL synthase activity in isolated mitochondria, protein abundance and inner-membrane localization.
  experiment_type: biochemical
