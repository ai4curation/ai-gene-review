id: Q9UJA2
gene_symbol: CRLS1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'CRLS1 (cardiolipin synthase 1, CLS1, formerly C20orf155) is the human cardiolipin synthase
  of the CDP-alcohol phosphatidyltransferase family. It is a multipass integral protein of the mitochondrial
  inner membrane that catalyses the final, committed step of de novo cardiolipin synthesis, transferring
  a phosphatidyl group from CDP-diacylglycerol to phosphatidylglycerol to form cardiolipin and CMP. The
  enzyme has an alkaline pH optimum and requires a divalent cation. It acts downstream of TAMM41 (CDP-DAG
  synthesis), PGS1 and PTPMT1 (phosphatidylglycerol synthesis), with which it associates in mitochondrial
  complexes, and upstream of acyl-chain remodeling by tafazzin. It is unrelated to the phospholipase D-type
  cardiolipin synthases of bacteria and some protists (2 PG -> CL + glycerol); humans have only the CDP-type
  enzyme. CRLS1 is most highly expressed in heart, skeletal muscle and liver. Cardiolipin produced by
  CRLS1 is required for cristae structure, respiratory chain organization and mitochondrial biogenesis:
  Crls1 null mice die around implantation, tissue-specific knockouts cause neurodegeneration or neonatal
  heart failure, and biallelic human variants cause an autosomal recessive multisystem mitochondrial encephalopathy
  (COXPD57) with reduced cardiolipin and accumulated phosphatidylglycerol. A single study has reported
  an additional acyl-CoA-dependent lysophosphatidylglycerol acyltransferase activity, which has not been
  independently confirmed.'
