  - ensembl:ENSRNOP00000071931
  review:
    summary: Blood-pressure regulation transferred from rat AVPR2.
    action: MARK_AS_OVER_ANNOTATED
    reason: AVPR2-driven renal water retention can affect systemic blood pressure, but the broad cardiovascular phenotype is an indirect organismal consequence rather than the receptor step itself.
    supported_by: &id001
