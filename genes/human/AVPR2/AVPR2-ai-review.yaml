      supporting_text: stimulates adenylyl cyclase and promotes the cyclic AMP-mediated incorporation of water pores
    - &id006
      reference_id: PMID:19440390
      supporting_text: regulates aquaporin-2-mediated water reabsorption via activation of the Gs protein/adenylyl cyclases/cAMP pathway
- term:
