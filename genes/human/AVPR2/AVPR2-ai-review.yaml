id: P30518
gene_symbol: AVPR2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'AVPR2 is the human vasopressin V2 receptor, a seven-transmembrane G protein-coupled receptor that binds extracellular arginine vasopressin at the plasma membrane and couples to Gs to stimulate transmembrane adenylyl cyclases, cAMP production and PKA signaling. In renal collecting-duct principal cells this V2 branch drives aquaporin-2-dependent water reabsorption; activated receptor also undergoes beta-arrestin- and clathrin-associated internalization into endosomal compartments.'
alternative_products:
- name: '1'
  id: P30518-1
- name: '2'
  id: P30518-2
  sequence_note: VSP_036990, VSP_036991
