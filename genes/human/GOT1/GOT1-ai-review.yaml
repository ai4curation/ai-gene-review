- term:
    id: GO:0030511
    label: positive regulation of transforming growth factor beta receptor signaling pathway
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  review:
    summary: 'Correct the regulatory sign: AAT1 restrains TGF-beta/Smad signaling in the traced experiment.'
    action: MODIFY
    reason: The rat donor traces to PMID:26880260. Full primary rat pulmonary adventitial-fibroblast experiments
      show AAT1 overexpression suppressing stretch-induced TGF-beta1/Smad2/3, while knockdown increases
      it. Thus the positive GO sign is inverted. Replace it with negative regulation as a contextual ortholog-supported
      process, not a universal direct receptor interaction or an assertion of direct human experimental
      evidence.
    supported_by:
    - reference_id: PMID:26880260
      supporting_text: 'AAT1 overexpression blocked the increase in collagen I and III

        expression, transforming growth factor-β1 (TGF- β1) expression and

        phosphorylation of Smad2/3 induced by stretch'
    proposed_replacement_terms:
    - id: GO:0030512
      label: negative regulation of transforming growth factor beta receptor signaling pathway
    propagation_review:
      root_cause: SOURCE_BAD
      failure_modes:
      - REGULATORY_SIGN_INVERSION
      source_entities:
      - source_id: UniProtKB:P13221
        source_status: SOURCE_BAD
        comment: QuickGO rat donor IMP points to PMID:26880260. Full-text overexpression/knockdown data
