id: P17174
gene_symbol: GOT1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: GOT1 is the cytosolic aspartate aminotransferase, a homodimeric pyridoxal 5'-phosphate-dependent
  enzyme that reversibly transfers an amino group between L-aspartate and 2-oxoglutarate to form oxaloacetate
  and L-glutamate. It provides the cytosolic transamination step of the malate-aspartate shuttle and connects
  aspartate, glutamate and central-carbon metabolism. Net flux depends on substrate supply and cellular
  state. Additional transamination activities toward cysteine and 2-aminobutyrate are supported by curated
  ortholog or biochemical evidence, with their physiological contributions depending on context. Rodent
  studies connect cytosolic aspartate aminotransferase to sulfur-dioxide-linked collagen regulation and
  calcium homeostasis, while human stellate-cell experiments connect GOT1-dependent metabolism to proliferation.
  These contextual roles are distinct from its conserved catalytic reaction. Human variants that reduce
  GOT1 activity can lower serum AST activity.
