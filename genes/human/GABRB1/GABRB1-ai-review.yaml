id: P18505
gene_symbol: GABRB1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: GABRB1 encodes the beta1 subunit of the type A gamma-aminobutyric acid (GABA-A) receptor, a heteropentameric
  ligand-gated chloride channel of the Cys-loop family. Each subunit has an N-terminal extracellular ligand-binding domain,
  four transmembrane helices (M2 lines the pore) and a large M3-M4 cytoplasmic loop. Beta subunits form the principal face
  of the GABA binding sites at beta/alpha interfaces, so beta1-containing receptors open a chloride pore on GABA binding and
  mediate fast synaptic and tonic inhibition in the brain. Beta1 coassembles with alpha, gamma, delta, epsilon and theta subunits;
  it is a minority beta subunit in native human cortical receptors, where cryo-EM resolved beta1 in several alpha1-containing
  assemblies, and a beta1-beta1 interface can bind histamine. In rat thalamic reticular neurons beta1 underlies fast, loreclezole-insensitive
  IPSCs. De novo heterozygous missense variants (for example F246S in TM1) cause developmental and epileptic encephalopathy
  45, and gain-of-function Gabrb1 mutations in mice cause spontaneous channel opening, increased tonic inhibition and high
  ethanol consumption.
