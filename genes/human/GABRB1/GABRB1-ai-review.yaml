suggested_questions:
- question: Are beta1-containing GABA-A receptors present in presynaptic membranes anywhere in the brain, as speculated for
    nucleus accumbens interneurons, and if so do they regulate GABA release?
- question: Which native receptor compositions carry beta1 in human brain regions other than cortex, and in which cell types
    (for example thalamic reticular, striatal and locus coeruleus neurons)?
suggested_experiments:
- description: Subunit-specific immunogold or expansion microscopy with beta1-specific antibodies validated on Gabrb1 knockout
    tissue, to resolve synaptic, extrasynaptic and any presynaptic beta1 localization.
- description: Knock-in mouse carrying the DEE45 F246S variant, with slice recordings of phasic and tonic currents in beta1-rich
    neurons, to test whether spontaneous openings seen in HEK cells occur in vivo.
