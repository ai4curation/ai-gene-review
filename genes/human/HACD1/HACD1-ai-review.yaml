- id: PMID:18554506
  title: Characterization of four mammalian 3-hydroxyacyl-CoA dehydratases involved in very long-chain
    fatty acid synthesis.
  findings:
  - statement: All four human HACD proteins exhibited C16 3-hydroxypalmitoyl-CoA dehydratase activity.
      HACD1 and HACD2 additionally complemented PHS1-suppressed yeast. HACD proteins associated with ELOVL
      condensation enzymes.
    reference_section_type: ABSTRACT
    supporting_text: all four of these human proteins are indeed 3-hydroxyacyl-CoA dehydratases
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The original publisher main Methods, Results and Discussion were inspected separately
      from the unchanged abstract-only cache. Human HACD1 has a C16 purified-enzyme assay, ER localization
      and PHS1-suppressed yeast rescue. The main Discussion explicitly states that only the C16 substrate
      was used; exact short excerpts and section locators are committed in the manual report. Supplements
      were not independently inspected. The curated VLCFA enzyme class is retained; chain-specific UniProt
      Rhea evidence links are a separate clarification question.
- id: PMID:23933735
  title: Congenital myopathy is caused by mutation of HACD1.
  findings:
  - statement: A homozygous nonsense HACD1 variant (p.Tyr248Stop) causes autosomal recessive congenital
      myopathy and completely abrogates the dehydratase activity, confirming HACD1's role in the third
      step of VLCFA elongation.
    reference_section_type: ABSTRACT
    supporting_text: the enzymatic activity of dehydration of 3-hydroxyacyl-CoA, the third step in the
      elongation of very long-chain fatty acids (VLCFAs)
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The original full text (PMC3842179) and retained full-text cache identify the human
      wild-type and p.Tyr248Stop comparison in HEK293T cells. The C16 assay shows loss of mutant activity.
      This is not a test of the natural CAP splice product, and normal serum VLCFAs in one patient do
      not establish normal muscle lipids.
