id: B0YJ81
gene_symbol: HACD1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: HACD1 is a muscle-enriched, multipass endoplasmic reticulum membrane enzyme that catalyzes
  the dehydration step of the fatty-acid elongation cycle. It converts a (3R)-3-hydroxyacyl-CoA intermediate
  into a (2E)-enoyl-CoA and water, contributing to fatty-acyl chains used in membrane lipids, including
  sphingolipids. HACD1 associates with other elongation enzymes, including TECR. Biallelic loss-of-function
  variants cause congenital myopathy. The alternative CAP splice product has a short, distinct C terminus
  and lacks the catalytic region of the 288-residue canonical enzyme; its reported adhesion and mineral-associated
  activities concern that separate product.
