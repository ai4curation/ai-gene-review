- term:
    id: GO:0045880
    label: positive regulation of smoothened signaling pathway
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P57680
  - ensembl:ENSMUSP00000031005
  review:
    summary: EVC is a positive regulator of Smoothened-dependent signaling.
    action: ACCEPT
    reason: 'The actual mouse P57680 donor record is experimentally grounded in PMID:17660199. Its operative
      Methods/Results use Evc-null mice and native mouse chondrocytes/MEFs: shorter endochondral bones
      and altered growth-plate zones accompany reduced Ptch1/Gli1 responses, including impaired responses
      to Smoothened agonist purmorphamine. This establishes a positive signaling contribution in the growth
      plate, not bone-matrix synthesis or autonomous growth activity. In the actual experiment Ihh expression
      is retained while downstream pathway readouts and agonist responses are impaired, supporting a positive
      signaling role rather than simply an association with short limbs. This conserved gene-level inference
      does not identify EVC as the receptor, establish a specific catalytic activity, or demonstrate identical
      function of untested human products.'
    supported_by:
    - reference_id: PMID:17660199
    - reference_id: PMID:21356043
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: UniProtKB:P57680
        source_status: SUPPORTS_TRANSFER
        comment: Current mouse IMP17660199 and actual Evc-null agonist/readout experiments support positive
          regulation.
