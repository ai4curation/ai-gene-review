- term:
    id: GO:0036064
    label: ciliary basal body
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: located_in
  supporting_entities:
  - UniProtKB:P57680
  - ensembl:ENSMUSP00000031005
  review:
    summary: Retain basal-body localization with explicit ciliary-base and imaging-resolution limits.
    action: ACCEPT
    reason: The proximate mouse source is IDA PMID:17660199. Its actual Methods/Results localize native
      Evc at chondrocyte and mIMCD3 ciliary bases using a mouse-antigen antibody, with knockout loss of
      signal; the text describes a position suggestive of distal basal body/transition zone. Independently,
      current human HPA016046 records basal body in ASC52telo, serum-starved hTERT-RPE1 and RPTEC/TERT1,
      and the aggregate page lists basal body and nucleoplasm as approved main locations. Two selected
      images were viewed; RPE1 has green puncta at the bases of red cilia. The inspected composites lack
      an independently displayed yellow basal-body channel and do not establish ultrastructural incorporation
      into the microtubule array. The antigen is shared by canonical 992-aa EVC and the captured 991/535-aa
      RefSeq proteins, so product specificity is unresolved. These positive original and human antibody
      observations support retaining the location rather than treating nearby EvC-zone membrane localization
      as a universal exclusion. No basal-body assembly function or nuclear mechanism is inferred.
    supported_by:
    - reference_id: PMID:17660199
    - reference_id: GO_REF:0000052
    - reference_id: PMID:24582806
    additional_reference_ids:
    - PMID:17660199
    - GO_REF:0000052
    - PMID:24582806
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: UniProtKB:P57680
        source_status: SUPPORTS_TRANSFER
        comment: Actual IDA17660199 ciliary-base microscopy remains positive; independent human HPA provides
          corroboration with defined resolution/product limits.
