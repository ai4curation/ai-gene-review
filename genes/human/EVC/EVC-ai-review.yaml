id: P57679
gene_symbol: EVC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: EVC is a membrane-associated component of the EvC ciliary signaling complex. In association
  with EVC2, it occupies a specialized region of proximal ciliary membrane and promotes Hedgehog signaling
  downstream of Smoothened. This signaling contribution supports growth-plate organization and endochondral
  bone growth. Pathogenic human EVC variants cause Ellis–van Creveld syndrome, with skeletal, dental and
  cardiac abnormalities.
existing_annotations:
- term:
    id: GO:0001501
    label: skeletal system development
  evidence_type: TAS
  original_reference_id: PMID:10700184
  qualifier: involved_in
  review:
    summary: Retain the human skeletal-development association as a downstream developmental context.
    action: KEEP_AS_NON_CORE
    reason: 'The PMID:10700184 target identity and accessible original abstract are verified: EVC variants
      segregate with the skeletal dysplasia, including short limbs, short ribs and polydactyly. This supports
      the broad developmental association but does not define an intrinsic molecular activity of EVC.
      The complete original body remained inaccessible; the nominal publisher PDF returned HTML. Retain
      this existing positive TAS context as non-core without inventing an embryonic skeletal assay or
      a particular step performed by the protein.'
    supported_by:
    - reference_id: PMID:10700184
- term:
    id: GO:0003416
    label: endochondral bone growth
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P57680
  - ensembl:ENSMUSP00000031005
  review:
    summary: Retain endochondral bone growth as a supported developmental consequence of ciliary signaling.
    action: KEEP_AS_NON_CORE
    reason: 'The actual mouse P57680 donor record is experimentally grounded in PMID:17660199. Its operative
      Methods/Results use Evc-null mice and native mouse chondrocytes/MEFs: shorter endochondral bones
      and altered growth-plate zones accompany reduced Ptch1/Gli1 responses, including impaired responses
      to Smoothened agonist purmorphamine. This establishes a positive signaling contribution in the growth
      plate, not bone-matrix synthesis or autonomous growth activity. The current term covers the increase
      in size or mass of endochondral bone. Conserved EVC signaling supports this developmental context,
      while the primary molecular role is in the ciliary signaling complex. Human assays were not performed
      in this mouse paper; the inference is retained without asserting functional equivalence of the separate
      shorter RefSeq products.'
    supported_by:
    - reference_id: PMID:17660199
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
      - source_id: UniProtKB:P57680
        source_status: SUPPORTS_TRANSFER
        comment: Actual mouse IMP17660199 and original growth-plate/signaling experiments support the
          conserved developmental context.
