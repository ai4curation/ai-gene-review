    summary: Refine the correct broad plasma-membrane mapping to ciliary membrane.
    action: MODIFY
    reason: SL-0039 maps correctly to plasma membrane. Actual PMID:21356043 localization/topology experiments
      use mouse Evc/Evc2 constructs and native mouse cells. Coexpression supports ciliary membrane localization
