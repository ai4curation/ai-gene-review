- term:
    id: GO:0036064
    label: ciliary basal body
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: located_in
  supporting_entities:
  - UniProtKB:P57680
  - ensembl:ENSMUSP00000031005
  review:
    summary: Retain basal-body localization with explicit ciliary-base and imaging-resolution limits.
    action: ACCEPT
    reason: 'Retain the conserved basal-body/ciliary-base localization. PMID:17660199 reports native mouse
      Evc staining at the distal basal body/transition-zone region using knockout controls, and PMID:21356043
      reports native mouse ciliary-base localization. Curated human UniProt SUBCELLULAR LOCATION and the
      public HPA EVC record provide independent support: HPA016046 is classified as basal body in ASC52telo,
      serum-starved hTERT-RPE1 and RPTEC/TERT1 cells. The selected blue/red/green images support ciliary-base
      puncta but do not independently resolve a basal-body marker channel or incorporation into the microtubule
      array. The shared antigen matches the 992-, 991- and 535-residue RefSeq products, so the human staining
      is not product-specific. Nearby EvC-zone membrane localization does not negate this bounded basal-body
      association; no basal-body assembly or scaffold activity is inferred. The source guide gives the
      public image and antibody locators; GO_REF:0000052 describes the method, not these target-specific
      observations.'
    supported_by:
    - reference_id: PMID:17660199
    - reference_id: PMID:21356043
    - reference_id: file:human/EVC/EVC-uniprot.txt
    - reference_id: file:human/EVC/EVC-source-guide.md
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: UniProtKB:P57680
        source_status: SUPPORTS_TRANSFER
        comment: Actual IDA17660199 ciliary-base microscopy remains positive; independent human HPA provides
          corroboration with defined resolution/product limits.
