  knowledge_gaps:
  - gap_statement: The biochemical step supplied by EVC itself within the ciliary signaling complex is
      not resolved by the examined primary experiments. A distinct EVC scaffold, adaptor or catalytic
      activity has not been demonstrated by those interaction, localization and perturbation assays.
    boundary: Evc loss impairs Smoothened-agonist responses in mouse cells. EVC–EVC2 association, ciliary
      membrane/ciliary-base localization and signal-dependent association of the complex with SMO are
      reported. The latter is a complex-level receptor interaction, not an isolated EVC–SMO binary assay
      or an identified EVC-specific biochemical step. EFCAB7-mediated tethering is a different subunit’s
      demonstrated role. A scaffold mechanism for the EvC complex remains a proposed explanation; these
      observations do not establish an individual EVC adaptor, scaffold or catalytic activity.
    gap_kind:
    - BIOLOGY
    dark_aspect: MF_DARK
    status: OPEN
    significance: Identifying the EVC-specific step would distinguish signal organization from recruitment,
      altered localization or another mechanism, without assigning another subunit's activity to EVC.
    resolution: Separate EVC-dependent signaling from complex assembly and localization using controlled
      human-cell rescue and interaction mapping, followed by direct reconstitution of any proposed molecular
      step.
    provenance:
    - reference_id: PMID:24582806
    - reference_id: PMID:17660199
    - reference_id: PMID:21356043
suggested_questions:
- question: What EVC-specific molecular step links activated Smoothened to downstream GLI regulation,
    independently of EVC2 association and EFCAB7–IQCE-dependent positioning?
- question: How do the mouse MEF findings in PMID:21356043—full-length Evc detected in cytoplasmic but
    not nuclear fractions, with Evc2 detected in both—relate to the independent human HPA016046 nucleoplasmic
    signal? Which cell, product or antibody-specificity differences explain the observations, and can
    spatially resolved human imaging distinguish basal-body association from adjacent ciliary membrane?
- question: Which of the separately recorded human products, NP_714928.1 (992 residues, matching P57679),
    NP_001293019.1 (991 residues) and NP_001293021.1 (535 residues), are expressed, incorporated into
    the EVC2-associated complex and competent for ciliary signaling?
- question: Is there a muscle-cell-autonomous developmental role for human EVC, distinct from congenital
    cardiac malformation and broader Hedgehog-dependent developmental effects?
suggested_experiments:
- hypothesis: EVC has a signaling contribution that can be experimentally separated from its abundance,
    EVC2 association and ciliary localization.
  description: In ciliated human cells, compare endogenous EVC loss with matched-expression rescue and
    interaction-guided EVC variants. Measure EVC2 association, ciliary localization and Smoothened accumulation
    alongside agonist-dependent GLI1/PTCH1 transcription and GLI processing or localization. Include a
    downstream GLI bypass control to distinguish pathway position from general cell dysfunction. Advance
    a specific scaffold, adaptor or catalytic model only after directly testing the proposed step.
  experiment_type: Genetic separation of function with localization, interaction and signaling assays
- hypothesis: Ciliary-base antibody staining may represent proximal membrane, basal-body association or
    a mixture of product-dependent locations.
  description: Compare HPA016046 staining with endogenous EVC tagging in wild-type and EVC-null human
    ciliated cells. Resolve basal-body and ciliary-membrane markers separately. Test nuclear localization
    with fractionation controls and product-resolved detection, explicitly comparing with the mouse MEF
    result in PMID:21356043, which detected full-length Evc only in the cytoplasmic fraction. A negative
    result in those mouse cells does not settle the independent human HPA signal. Establish genetic specificity
    before assigning a nuclear mechanism or an ultrastructural basal-body position.
  experiment_type: Genetic specificity controls and spatially resolved microscopy
- hypothesis: The shorter human RefSeq products may differ in expression, complex incorporation or signaling
    competence despite sharing the HPA016046 antigen.
  description: Establish endogenous transcripts and product-specific peptides before comparing the separately
    recorded 992-, 991- and 535-residue proteins. Test detected products at matched abundance for EVC2
    association, proximal ciliary targeting and Hedgehog-responsive transcription, without assuming that
    an overexpression phenotype establishes physiological isoform function.
  experiment_type: Transcript and product-resolved proteomics with controlled functional rescue
