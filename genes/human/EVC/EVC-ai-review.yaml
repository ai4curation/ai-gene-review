core_functions:
- description: Participates in Smoothened-dependent Hedgehog signal transduction and promotes its output
    as part of the EVC2-associated complex in proximal ciliary membrane and the basal-body region. Evc-specific
    mouse perturbation and agonist responses establish the signaling contribution; localization studies
    and reported signal-dependent complex–SMO association place it within the ciliary pathway. Basal-body
    association is retained with light-microscopy spatial limits, without asserting incorporation into
    the microtubule array or a basal-body assembly activity. The individual biochemical step supplied
    by EVC remains unresolved.
  directly_involved_in:
  - id: GO:0007224
    label: smoothened signaling pathway
  - id: GO:0045880
    label: positive regulation of smoothened signaling pathway
  locations:
  - id: GO:0060170
    label: ciliary membrane
  - id: GO:0036064
    label: ciliary basal body
  in_complex:
