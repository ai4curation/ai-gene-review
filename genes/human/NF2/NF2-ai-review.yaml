- term:
    id: GO:0003779
    label: actin binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - FB:FBgn0011661
  - PANTHER:PTN001150648
  - RGD:1359472
  - RGD:621260
  - UniProtKB:P15311
  - UniProtKB:P35241
  review:
    summary: Merlin lacks the canonical ERM C-terminal actin-binding site but binds F-actin through N-terminal regions.
    action: KEEP_AS_NON_CORE
    reason: The PAINT and InterPro rows assert actin binding. PMID:9537418 only rules out the canonical ezrin/radixin/moesin
      C-terminal actin-binding site, while later human NF2 work maps F-actin association to the N-terminal FERM
      half. The direct actin interaction is therefore retained as a real but non-core Merlin activity rather than
      used for a PAINT prune.
    supported_by: &id001
    - reference_id: PMID:9537418
      supporting_text: Schwannomin itself lacks the actin binding sites found in ezrin, radixin and moesin
    - reference_id: PMID:11368764
      supporting_text: merlin isoform 2 binds F-actin with an apparent binding constant of 3.6 microM
    - reference_id: PMID:11329377
      supporting_text: folding of the N-terminal domain influences schwannomin interaction with actin through two
        novel actin-binding sites located in this region
