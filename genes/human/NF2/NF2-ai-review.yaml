id: P35240
gene_symbol: NF2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: NF2 encodes Merlin, a FERM-domain tumor suppressor related to ezrin, radixin, and moesin. Merlin acts
  as a membrane- and cytoskeleton-associated signaling adaptor at the cytoplasmic face of the plasma membrane and
  cell junctions, where it restrains mitogenic pathways including Rac/PAK and Hippo/LATS/YAP signaling. The closed,
  growth-inhibitory form also accumulates in the nucleus and binds the CRL4(DCAF1) ubiquitin ligase complex to suppress
  its activity. NF2 loss drives vestibular schwannomatosis and contributes to meningioma, ependymoma, mesothelioma,
  and other tumors.
