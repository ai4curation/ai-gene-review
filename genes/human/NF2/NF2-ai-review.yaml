suggested_questions:
- question: Which NF2 membrane partners are direct effectors in human Hippo/LATS activation, and which are context-specific
    junctional or Rac/PAK regulators?
- question: Which of the many reported Merlin interactors survive endogenous, isoform-resolved validation rather
    than overexpression or two-hybrid screening?
suggested_experiments:
- description: Use endogenous tagging plus acute NF2 rescue in NF2-null human Schwann, mesothelial, and epithelial
    cells to map which Merlin pools are required for LATS/YAP, CRL4(DCAF1), and Rac/PAK outputs.
- description: Quantify purified Merlin isoforms against F-actin in the presence and absence of betaII-spectrin
    and junctional partners to separate N-terminal direct actin binding from betaII-spectrin-mediated or partner-mediated
    cytoskeletal tethering.
