- term:
    id: GO:0017157
    label: regulation of exocytosis
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P63044
  review:
    summary: VAMP2 executes exocytosis rather than regulating it; the regulatory term misstates its role.
    action: MARK_AS_OVER_ANNOTATED
    reason: Regulation of exocytosis describes modulating the rate or extent of a fusion reaction carried out
      by something else. VAMP2 is a component of the fusion machine itself, which is captured by the
      exocytosis and vesicle fusion terms accepted here. The regulators of this step are synaptotagmin,
      complexin and Munc18.
