  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P63045
  review:
    summary: VAMP2 is machinery used by glucose-stimulated secretion, not a protein whose state changes in
      response to glucose.
    action: MARK_AS_OVER_ANNOTATED
    reason: Response to glucose describes a change in the cell's or protein's state caused by the sugar. The
