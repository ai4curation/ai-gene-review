  - PANTHER:PTN005236497
  - PomBase:SPAC6G9.11
  - RGD:3949
  - RGD:61880
  - SGD:S000000028
  - SGD:S000005854
  - UniProtKB:P63026
  - UniProtKB:Q5ASG1
  - UniProtKB:Q9BV40
  - WB:WBGene00004897
  - ZFIN:ZDB-GENE-030131-8225
  review:
    summary: After fusion VAMP2 is delivered into the presynaptic plasma membrane, where it forms the
      cis-SNARE complex until NSF disassembly and CALM-dependent retrieval; a core location of the v-SNARE
      cycle.
    action: ACCEPT
    reason: The plasma membrane is one end of every fusion reaction VAMP2 performs and is the compartment it
      occupies between fusion and retrieval. The many Reactome rows are one claim restated across the
      cargo-specific pathways of the vesicle cycle and reinforce rather than duplicate it.
    supported_by:
    - reference_id: file:human/VAMP2/VAMP2-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: VAMP2 is a v-SNARE assembling into a SNARE complex with the t-SNAREs SNAP25 and STX1A
        to mediate the fusion of synaptic vesicles with the presynaptic plasma membrane in neurotransmitter
        release
