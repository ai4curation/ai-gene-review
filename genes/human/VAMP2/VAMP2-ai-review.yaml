    label: secretory granule membrane
  evidence_type: IDA
  original_reference_id: PMID:16677249
  qualifier: located_in
  negated: true
  review:
    summary: VAMP2 was not detected on the granule membranes of human eosinophils and neutrophils; the
      negative annotation is supported and is kept.
    action: KEEP_AS_NON_CORE
    reason: The study fractionated human granulocytes and found VAMP7 and VAMP8, not VAMP2, on the granule
      compartments whose exocytosis it assayed. A recorded negative is worth keeping because it separates the
      granulocyte routes from the neuroendocrine granule pool. It is non-core because granulocyte granules are
      peripheral to the synaptic vesicle function.
    consistency_exception:
      reason: The NOT applies to granulocyte granules specifically. VAMP2 is on neuroendocrine dense-core and
        insulin granule membranes, which is what the positive secretory granule and secretory granule membrane
        rows record; the two claims concern different cell types and both hold.
    supported_by:
    - reference_id: PMID:16677249
      supporting_text: Vesicle-associated membrane proteins-7 and -8 were localized to granule and
        membrane-enriched fractions in eosinophils and neutrophils, whereas syntaxin-6 was not detectable.
