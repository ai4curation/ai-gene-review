id: P63027
gene_symbol: VAMP2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'VAMP2 (synaptobrevin-2) is the principal vesicular R-SNARE of neurons and neuroendocrine cells. It
  is a small tail-anchored (type IV) membrane protein of the synaptic vesicle: a short proline-rich N-terminal region
  is followed by a ~60-residue SNARE motif carrying the zero-layer arginine, a tryptophan-containing juxtamembrane
  linker, and a C-terminal transmembrane anchor, with the SNARE motif facing the cytoplasm. Free VAMP2 is largely
  unstructured and folds on partner binding. Its molecular activity is to contribute the R-helix of the trans-SNARE
  bundle: with the plasma-membrane Q-SNAREs syntaxin-1 and SNAP-25 it forms a parallel four-helix bundle whose N-to-C
  zippering pulls the vesicle and target bilayers together and drives their fusion, so that neurotransmitter is
  released at the presynaptic active zone in response to calcium. Assembly is templated by Munc18-1 bound to syntaxin-1,
  and after fusion the cis-complex is taken apart by NSF and alpha-SNAP so VAMP2 can be reused; the free SNARE motif
  is then recognised by the ANTH domain of CALM/AP180 for clathrin-mediated retrieval, so VAMP2 is also cargo of
  the recycling arm of the vesicle cycle. The same v-SNARE serves regulated exocytosis outside the synapse, including
  neuroendocrine dense-core granules, insulin-responsive GLUT4 vesicles and insulin granules, where it pairs with
  syntaxin-4 and SNAP-23 and is partly redundant with VAMP3 and VAMP8; it is not the R-SNARE of granulocyte, mast
  cell, natural killer cell or airway goblet cell granules. VAMP2 is the substrate of tetanus toxin and of botulinum
  neurotoxins B, D, F and G, which cleave the SNARE motif at serotype-specific bonds and block release; it is not
  itself a protease. Heterozygous de novo missense and in-frame deletion variants in the SNARE motif impair reconstituted
  membrane fusion and cause a neurodevelopmental disorder with hypotonia, intellectual disability, autistic features
  and, for C-terminal variants, epilepsy and a movement disorder.'
