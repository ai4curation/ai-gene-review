suggested_questions:
- question: Is VAMP2 itself required for fast synaptic vesicle endocytosis, or is the endocytic phenotype of
    its loss a secondary consequence of impaired fusion and of CALM-dependent cargo retrieval?
- question: Which R-SNARE carries insulin-stimulated GLUT4 exocytosis in human muscle and adipose tissue,
    given that VAMP2, VAMP3 and VAMP8 can substitute for one another in rodent knockouts?
- question: Do the disease-associated SNARE-motif variants act as dominant negatives by poisoning the
    four-helix bundle, or by haploinsufficiency, and does the difference explain the severity gradient between
    N- and C-terminal variants?
suggested_experiments:
- description: Single-molecule optical-tweezer zippering assays on wild-type and patient-derived VAMP2 SNARE
    motifs in the presence of Munc18-1, comparing the stability of the half-zippered intermediate at equimolar
    and heterozygous ratios of wild-type to variant protein.
  hypothesis: C-terminal SNARE-motif variants destabilise the C-terminal half of the zippering reaction and
    act dominantly, whereas N-terminal variants reduce the amount of assembly-competent protein.
- description: Conditional deletion of VAMP2 in human iPSC-derived adipocytes and myotubes, alone and combined
    with VAMP3 and VAMP8 deletion, with surface GLUT4 measured after insulin.
  hypothesis: VAMP2 is the dominant R-SNARE for insulin-stimulated GLUT4 delivery in human cells but its loss
    is buffered by VAMP3 and VAMP8.
