      fusion as one of the possible associated disease mechanisms.
  - reference_id: file:human/VAMP2/VAMP2-uniprot.txt
    record_section: ["CC:FUNCTION"]
    supporting_text: VAMP2 is a v-SNARE assembling into a SNARE complex with the t-SNAREs SNAP25 and STX1A to
      mediate the fusion of synaptic vesicles with the presynaptic plasma membrane in neurotransmitter release
- description: Binds the cognate Q-SNAREs syntaxin-1A/1B through its SNARE motif, the binary interaction that
    nucleates assembly of the fusion-competent four-helix bundle
  molecular_function:
