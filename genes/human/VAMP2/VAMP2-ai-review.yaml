  - statement: Recombinant VAMP2 forms SNARE complexes in vitro but does not support platelet granule
      secretion, which uses VAMP3 and VAMP8.
    supporting_text: In contrast, rVAMP-2, which formed SNARE complexes in vitro, had no effect on platelet
      exocytosis.
