core_functions:
- description: Vesicular R-SNARE that supplies the fourth helix of the synaptic SNARE bundle; its zippering
    with syntaxin-1 and SNAP-25 on the presynaptic membrane releases the energy that merges the synaptic
    vesicle and plasma membranes for calcium-triggered neurotransmitter release
  molecular_function:
    id: GO:0005484
    label: SNAP receptor activity
  directly_involved_in:
