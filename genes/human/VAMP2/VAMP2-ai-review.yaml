- term:
    id: GO:0000149
    label: SNARE binding
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: enables
  supporting_entities:
  - UniProtKB:P63044
  review:
    summary: VAMP2 binds its cognate Q-SNAREs syntaxin-1 and SNAP-25 through its SNARE motif; this is the
      defining binding activity of the protein and is retained as core.
    action: ACCEPT
    reason: SNARE binding is the activity on which every other claim in this entry rests. The ISS is to the
      rat and mouse orthologues, which are 100 percent identical over the SNARE motif, and the human protein's
      participation in the syntaxin-1A/SNAP-25 complex is directly supported.
    supported_by:
    - reference_id: PMID:10481273
      supporting_text: The entire SNARE motif of synaptobrevin is capable of interacting with the isolated
        C-terminal SNARE motif of syntaxin
