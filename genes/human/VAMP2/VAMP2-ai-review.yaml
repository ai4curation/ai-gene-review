- term:
    id: GO:0005829
    label: cytosol
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-194796
  qualifier: located_in
  review:
    summary: VAMP2 is a tail-anchored integral membrane protein, not a cytosolic one; the cytosol rows reflect
      how Reactome types the cytoplasmic face of its reactions.
    action: MARK_AS_OVER_ANNOTATED
    reason: The SNARE motif faces the cytoplasm, so the annotation is not simply false, but VAMP2 is anchored
      in a membrane throughout its life and is never a soluble cytosolic protein. The informative locations
      are the synaptic vesicle membrane and the plasma membrane, both annotated here.
