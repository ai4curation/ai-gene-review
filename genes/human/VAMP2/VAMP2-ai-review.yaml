- term:
    id: GO:0005484
    label: helical-bundle zippering fusogenic activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - FB:FBgn0013342
  - PANTHER:PTN005236497
  - RGD:620421
  - SGD:S000000028
  - SGD:S000005854
  - UniProtKB:Q9BV40
  review:
    summary: The fusogenic activity of the zippering SNARE bundle is VAMP2's molecular function; this is the
      core molecular-function annotation of the entry.
    action: ACCEPT
    reason: 'The PAINT node places the activity on the synaptobrevin clade, which is right: VAMP2 contributes the
      R-helix whose N-to-C zippering with syntaxin-1 and SNAP-25 supplies the energy for bilayer merger, and reconstituted
      lipid mixing with patient variants shows the human protein performing it.'
    supported_by:
    - reference_id: PMID:30929742
      supporting_text: Reconstituted fusion involving a lipid-mixing assay indicated impairment in vesicle
        fusion as one of the possible associated disease mechanisms.
    - reference_id: file:human/VAMP2/VAMP2-deep-research-claude-code.md
      supporting_text: N-to-C "zippering" of the trans-SNARE complex releases the energy that pulls the two
        bilayers together.
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:10481273
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q16623
  review:
    summary: The cited NMR study shows the synaptobrevin SNARE motif binding the syntaxin SNARE motif, which
      is an informative molecular function rather than bare protein binding.
    action: MODIFY
    reason: Bare protein binding is uninformative. The paper identifies the partner as syntaxin and maps the
      interaction to the SNARE motifs, so syntaxin-1 binding is the supported term.
    proposed_replacement_terms:
    - id: GO:0017075
      label: syntaxin-1 binding
    supported_by:
    - reference_id: PMID:10481273
      supporting_text: The entire SNARE motif of synaptobrevin is capable of interacting with the isolated
        C-terminal SNARE motif of syntaxin
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:17196367
  qualifier: enables
  supporting_entities:
  - UniProtKB:O94806
  review:
    summary: Bare protein binding, carrying no information about what VAMP2 does; removed under the
      protein-binding policy.
    action: REMOVE
    reason: None of these interactions is being called false. They include well-documented partners (PRKD3,
      WDFY2/PKCzeta, alpha-synuclein, CALM/PICALM, VAP-B, the clostridial proteases that use VAMP2 as
      substrate) and large-scale two-hybrid and affinity-capture screens, but GO:0005515 states only that a
      protein was bound, which is uninformative, and no informative molecular-function term covers these
      specific partners. Where an informative term exists it is recorded on the rows modified to syntaxin-1
      binding.
