core_functions:
- description: >-
    Assembly chaperone for AP-type membrane coat adaptor complexes. AAGAB binds folded but
    unassembled adaptor subunits - the small sigma subunits via its N-terminal type I
    pseudoGTPase domain, and the AP-1 gamma and AP-2 alpha subunits via a shared surface on
    its C-terminal dimerisation domain - protecting them from degradation and enforcing an
    ordered assembly sequence. It is required for assembly of AP-1, AP-2 and AP-4, but
    specifically not AP-3. AAGAB is a homodimer that becomes monomeric on client binding, and
    it leaves before the tetramer is finished: for AP-2 the alpha/sigma2 intermediate is
    handed off to CCDC32. This is assembly chaperoning, not protein folding - the clients are
    already folded. The molecular_function term below is a partial stand-in on two counts: it
    is AP-2-specific while the client set spans AP-1, AP-2 and AP-4, and it names the assembled
    complex while AAGAB in fact binds the free subunits. The accurate term would be the
    subunit-binding term filed under proposed_new_terms.
  molecular_function:
    id: GO:0035612
    label: AP-2 adaptor complex binding
  directly_involved_in:
  - id: GO:0051131
    label: chaperone-mediated protein complex assembly
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:34494650
    supporting_text: >-
      AAGAB is an assembly chaperone regulating AP1 and AP2 clathrin adaptors.
  - reference_id: PMID:31353312
    supporting_text: AAGAB acts as a specific chaperone for the α subunit monomer.
  - reference_id: PMID:36598941
    supporting_text: >-
      Alpha and gamma adaptin-binding protein (AAGAB) is a chaperone governing the assembly
      of the heterotetrameric adaptor complexes 1 and 2 (AP1 and AP2) involved in
      clathrin-mediated membrane trafficking.
proposed_new_terms:
- proposed_name: AP-type membrane coat adaptor complex subunit binding
  proposed_definition: >-
    Binding to a free, unassembled subunit of a heterotetrameric AP-type membrane coat
    adaptor complex (GO:0030119) - for example the alpha or sigma2 subunit of AP-2, the
    gamma or sigma1/sigma3 subunit of AP-1, or the epsilon or sigma4 subunit of AP-4 - as
    distinct from binding the assembled adaptor complex.
  justification: >-
    GO's existing adaptor-binding terms are all complex-level: AP-1 (GO:0035650), AP-2
    (GO:0035612) and AP-3 (GO:0035651) adaptor complex binding all exist, with no AP-4
    equivalent, and all of them denote binding to the assembled heterotetramer. That is
    precisely what assembly chaperones do NOT do. AAGAB binds free, unassembled subunits and
    is displaced before the tetramer exists - the AAGAB:alpha:sigma2 intermediate "cannot
    recruit additional AP2 subunits" and is handed to CCDC32 (PMID:39145939) - so annotating
    it with a complex-binding term asserts the one interaction the published mechanism rules
    out. A single subunit-level term covers AAGAB's whole client set (AP-1 gamma/sigma,
    AP-2 alpha/sigma2, AP-4 epsilon/sigma4) at the grain the protein is actually selected
    for, and would serve other assembly chaperones such as CCDC32 equally. The name is scoped
    to AP-type membrane coat adaptor complex (GO:0030119) rather than clathrin adaptor complex
    (GO:0030131) because AP-4 is not a clathrin adaptor: GO:0030124 AP-4 adaptor complex is_a
    GO:0030119, and the only is_a descendants of GO:0030131 are AP-1 (GO:0030121) and AP-2
    (GO:0030122). A clathrin-scoped name would exclude one of AAGAB's three clients. It replaces the
    earlier draft of this entry, which proposed an "AP-1 adaptor complex binding" term to fill
    a supposed AP-1 gap. That draft was wrong twice over: GO:0035650 already exists, so there
    was no AP-1 gap, and filling it would in any case have been the wrong altitude. Note the
    irony that GO has an AP-3 term, AP-3 being the one adaptor AAGAB pointedly does not act
    on, while AP-4, which AAGAB does chaperone, has no term at all.
