id: Q6PD74
gene_symbol: AAGAB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  AAGAB (p34, alpha- and gamma-adaptin-binding protein) is a cytosolic assembly
  chaperone for the heterotetrameric AP-type membrane coat adaptor complexes. It is not
  a folding chaperone: its clients are already-folded adaptor subunits, and AAGAB
  works by enforcing an ordered assembly pathway and by protecting partially
  assembled intermediates from the degradation that otherwise destroys unassembled
  subunits. AAGAB has two functional modules - an N-terminal type I pseudoGTPase
  domain, catalytically inactive, that engages the small sigma subunits, and a
  C-terminal dimerisation domain that recognises the gamma subunit of AP-1 and the
  alpha subunit of AP-2 through a shared surface. It exists as a homodimer that
  converts to a monomer on binding adaptor subunits. AAGAB is required for
  assembly of AP-1 (trans-Golgi network to endosome transport), AP-2
  (clathrin-mediated endocytosis) and AP-4 (ATG9A export from the TGN), but
  specifically not AP-3. For AP-2 it initiates assembly by stabilising the alpha
  and sigma2 subunits and then hands the intermediate off to CCDC32, so AAGAB is
  released and does not form part of the finished complex. Loss of AAGAB collapses
  adaptor assembly and broadly remodels surface protein homeostasis; truncating
  mutations that destabilise the C-terminal domain and abolish chaperone function
  cause autosomal dominant punctate palmoplantar keratoderma type 1A.
