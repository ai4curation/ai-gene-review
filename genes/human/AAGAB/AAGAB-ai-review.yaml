- id: PMID:39145939
  title: An AAGAB-to-CCDC32 handover mechanism controls the assembly of the AP2 adaptor complex.
  findings:
  - statement: >-
      AAGAB initiates AP2 assembly by stabilising the alpha and sigma2 subunits, but the
      resulting AAGAB:alpha:sigma2 complex cannot recruit further AP2 subunits; CCDC32 takes
      over the intermediate and templates recruitment of mu2 and beta2. This is the direct
      evidence that AAGAB leaves before the tetramer is complete.
    supporting_text: >-
      AAGAB initiates AP2 assembly by stabilizing its α and σ2 subunits, but the AAGAB:α:σ2
      complex cannot recruit additional AP2 subunits
  - statement: >-
      The handover is the paper's headline mechanism and generalises beyond AP2.
    supporting_text: >-
      AP2 is assembled by a handover mechanism switching from AAGAB-based initiation
      complexes to CCDC32-based template complexes
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Cached full text matches the cited title. This is the sole source for the "released
      before the tetramer is complete" claim, which is what makes AAGAB satisfy the defining
      clause of GO:0051131 ("chaperone molecules that do not form part of the finished
      complex"). It is also the reason the complex-binding replacement terms are marked as
      interim stand-ins rather than accepted at face value.
