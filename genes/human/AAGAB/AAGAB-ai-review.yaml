- proposed_name: protein complex assembly chaperone activity
  proposed_definition: >-
    Binding to one or more folded subunits of a protein complex in order to stabilise them
    and promote their ordered assembly into that complex, where the binding protein does not
    form part of the finished complex.
  justification: >-
    GO's chaperone molecular-function terms concern folding - GO:0044183 protein folding
    chaperone is explicitly annotated "a protein folding chaperone binds an unfolded protein
    to fold it". Assembly chaperones such as AAGAB act on subunits that are already folded,
    and their function is to impose an assembly order and prevent premature degradation of
    intermediates. The biological-process side is served by GO:0051131 chaperone-mediated
    protein complex assembly, but there is no corresponding molecular function, so proteins
    like AAGAB can only be annotated with binding terms that do not convey the chaperone
    activity. Notably, an automated pipeline grounding AAGAB's activity selected GO:0044183
    for exactly this reason, which is incorrect.
  proposed_parent:
    id: GO:0005515
    label: protein binding
  supported_by:
  - reference_id: PMID:36598941
    supporting_text: Assembly of protein complexes is facilitated by assembly chaperones.
  - reference_id: PMID:35976721
    supporting_text: >-
      These findings demonstrate that AP-4 assembly is not spontaneous but AAGAB-assisted,
suggested_questions:
- question: >-
    Why is AP-3 exempt? AAGAB is required for AP-1, AP-2 and AP-4 assembly but explicitly not
    for AP-3. Identifying what distinguishes the AP-3 subunits - a different chaperone, or an
    intrinsically spontaneous assembly - would sharpen the mechanism and indicate whether a
    parallel AP-3 assembly chaperone remains to be found.
- question: >-
    Is the reported AAGAB-NEDD4-1-PTEN/SHIP2 axis in hypoxic-ischaemic injury a genuinely
    separate function, or a downstream consequence of impaired adaptor assembly? It comes from
    a single group in rodent models, and NEDD4-1 substrate ubiquitination is plausibly
    affected indirectly by altered endocytic trafficking.
- question: >-
    Does AAGAB have clients beyond the AP complexes? Its architecture - a pseudoGTPase domain
    reading small subunits plus a dimerisation domain reading large subunits - is generic
    enough that other heteromeric complexes could use the same chaperone.
- question: >-
    Why is haploinsufficiency for a chaperone of three ubiquitous adaptor complexes tolerated
    everywhere except palms and soles? Understanding the tissue restriction of PPKP1A would
    reveal which adaptor-dependent cargo is rate-limiting in acral keratinocytes.
suggested_experiments:
- hypothesis: >-
    AAGAB is a general assembly chaperone whose client range extends beyond AP-1/AP-2/AP-4.
  description: >-
    Quantitative interaction proteomics on endogenously tagged AAGAB under conditions that
    trap transient chaperone-client complexes (crosslinking, or a substrate-trap AAGAB
    mutant), comparing wild type with the PPKP1A C-terminal truncations, to enumerate clients
    systematically rather than by candidate.
  experiment_type: interaction proteomics
- hypothesis: >-
    AP-3 assembly is AAGAB-independent because its sigma subunit lacks the pseudoGTPase-domain
    binding determinants.
  description: >-
    Swap the sigma-subunit surfaces between AP-1/AP-2 and AP-3 and test whether AP-3 sigma
    chimeras become AAGAB-dependent for assembly, and whether AP-1/AP-2 sigma chimeras
    carrying AP-3 surfaces become AAGAB-independent.
  experiment_type: structure-function
- hypothesis: >-
    The acral restriction of PPKP1A reflects a specific adaptor-dependent cargo in
    palmoplantar keratinocytes.
  description: >-
    Compare surface-proteome remodelling on AAGAB depletion between palmoplantar and truncal
    primary keratinocytes, identifying cargo whose surface level is disproportionately
    AAGAB-sensitive in acral cells.
  experiment_type: cell biology
- hypothesis: >-
    AAGAB's molecular function is assembly chaperoning and not folding chaperoning.
  description: >-
    Test in vitro whether purified AAGAB can refold chemically denatured AP-2 sigma2, versus
    whether it only binds and stabilises already-folded sigma2 and accelerates its
    incorporation into the tetramer. A negative refolding result with a positive assembly
    result would formally justify the proposed assembly-chaperone molecular function term.
  experiment_type: in vitro reconstitution
