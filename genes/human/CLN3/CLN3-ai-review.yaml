    supporting_text: "CLN3 was found to interact directly with active, \nguanosine-5'-triphosphate (GTP)-bound\
      \ Rab7"
suggested_questions:
- question: How does CLN3 chloride conductance relate mechanistically to glycerophosphodiester clearance
    and lipid distribution?
  experts:
  - Lysosomal electrophysiology and lipid-transport specialists
- question: Do the alternative CLN3 products retain the membrane topology, chloride conductance and Rab7-binding
    regions required for the measured canonical functions?
  experts:
  - CLN3 isoform and membrane-protein specialists
- question: Does CLN3 organize simultaneous Rab7/RILP/motor contacts, or do the measured interactions
    occur in separate trafficking states?
  experts:
  - Endolysosomal trafficking specialists
suggested_experiments:
- hypothesis: Chloride conductance and glycerophosphodiester clearance can be separated by selective CLN3
    variants.
  description: Compare matched-expression, correctly localized pore-selectivity mutants with wild-type
    CLN3 in lysosomal electrophysiology and isotope-traced metabolite-clearance assays; distinguish changes
    in channel function from expression, pH and organelle integrity.
  experiment_type: Functional separation and rescue
- hypothesis: The mapped Rab7-binding region contributes to organelle positioning independently of chloride
    permeation.
  description: Test full-length separation-of-function substitutions that disrupt the fragment-mapped
    Rab7 interface while preserving localization and chloride conductance. Measure native partner association
    and directional late-endosomal transport; do not infer GEF/GAP activity from FRAP alone.
  experiment_type: Interaction mapping and live-cell transport
