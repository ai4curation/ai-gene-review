id: Q13286
gene_symbol: CLN3
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CLN3 (battenin) is a multipass endolysosomal membrane protein whose loss causes juvenile
  neuronal ceroid lipofuscinosis. It conducts chloride and contributes to lysosomal ion balance and degradative
  function. A detailed trafficking study identified cytosolic-region binding to active Rab7 and RILP,
  linking CLN3 to the positioning and trafficking of late endosomal compartments. CLN3 deficiency also
  disrupts lipid distribution, lysosomal metabolite clearance and neuronal physiology. Cellular lipid-binding
  and transport observations complement these roles, while the exact mechanism of glycerophosphodiester
  clearance and proposed soluble glycolipid transfer remains unresolved.
