- id: PMID:11722572
  title: Elevated lysosomal pH in neuronal ceroid lipofuscinoses (NCLs).
  findings:
  - statement: Elevated lysosomal pH in a CLN3-deletion patient fibroblast line supports an acidification-defect
      interpretation in that disease-cell comparison.
    finding_review:
      finding_status: DISPUTED
      superseded_by:
      - PMID:41558486
      review_notes: The general inference that CLN3 promotes lysosomal acidification is disputed by the
        later human HEK293T knockout/rescue measurements, which show the opposite loss-associated direction.
        The original calibrated patient-cell observation is preserved; it was not repeated or refuted
        by the later study. The superseded_by link identifies the conflicting evidence rather than declaring
        the entire earlier paper overturned.
      supported_by:
      - reference_id: PMID:41558486
        supporting_text: knocking out CLN3 reduced the luminal pH in both fed and starved cells
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Authentic abstract plus official indexed Methods, Table 1, Results and selected Discussion
      were inspected. One CLN3-deletion patient fibroblast line had elevated lysosomal pH; experiment
      counts are not independent patient counts. Its broader acidifying-function interpretation is explicitly
      disputed by the later human knockout/rescue results, while the original patient observation remains
      intact. The protected cache is still abstract-only.
