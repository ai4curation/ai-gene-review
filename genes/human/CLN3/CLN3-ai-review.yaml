- term:
    id: GO:0005254
    label: chloride channel activity
  evidence_type: IDA
  original_reference_id: PMID:41558486
  qualifier: enables
  review:
    summary: Add directly demonstrated chloride channel activity.
    action: NEW
    reason: Human CLN3 expression produces endolysosomal chloride conductance, and plasma-membrane retargeting
      plus selectivity-altering mutants support a channel contribution beyond knockout necessity. The
      inspected pH series is mouse Neuro-2a, while rectification alone does not establish voltage gating.
      No narrower gating subtype or activity of every alternative product is asserted. All thirteen current
      chloride-channel subtype definitions and typed ancestry were checked against the seed without overlap.
    supported_by:
    - reference_id: PMID:41558486
      supporting_text: CLN3 mediates an endolysosomal Cl− conductance
- term:
    id: GO:1902476
    label: chloride transmembrane transport
  evidence_type: IDA
  original_reference_id: PMID:41558486
  qualifier: involved_in
  review:
    summary: CLN3 directly performs chloride permeation across the tested membranes.
    action: NEW
    reason: Human CLN3 expression produces endolysosomal chloride currents that depend on chloride substitution;
      retargeted CLN3 also produces plasma-membrane currents, and pore-region mutations alter the measured
      channel properties. CLN3 therefore performs the membrane-crossing step, rather than merely being
      necessary for lysosomal physiology. Official typed process coverage finds no ancestor or descendant
      among the existing assertions or replacements. Same-role chloride channels CLCN1 and CFTR carry
      experimental annotations to this process, while PACC1 carries a function-derived annotation. The
      current GO-CAM index has no target entry, which is not used as evidence of a gap. This assertion
      is limited to the tested human constructs; it does not generalize all seven products or assert a
      universal gating response.
    supported_by:
    - reference_id: PMID:41558486
