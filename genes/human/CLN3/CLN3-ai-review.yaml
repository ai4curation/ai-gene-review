core_functions:
- description: CLN3 conducts chloride across endolysosomal membranes. Human expression, membrane-retargeting
    and selectivity-changing mutants establish channel activity; endogenous mouse currents additionally
    show luminal-pH dependence. The tested tagged constructs do not establish identical gating or conductance
    for all seven products. This ion-conducting role supports lysosomal physiology without assigning CLN3
    the hydrolytic reactions performed by luminal enzymes.
  molecular_function:
    id: GO:0005254
    label: chloride channel activity
  locations:
  - id: GO:0005765
    label: lysosomal membrane
  - id: GO:0031902
    label: late endosome membrane
  supported_by:
  - reference_id: PMID:41558486
  - reference_id: PMID:14699076
  directly_involved_in:
  - id: GO:1902476
    label: chloride transmembrane transport
- description: A single detailed trafficking study demonstrates direct binding of the CLN3 cytosolic N-terminal
    fragment to active Rab7 and separate loop-fragment binding to RILP. Cellular associations with motor
    components and altered late-endosomal redistribution support a trafficking role. This experimentally
    mapped interaction capability has a narrower, single-study evidence base than the chloride-channel
    activity; simultaneous adaptor-complex assembly, GEF/GAP chemistry and autonomous motor activity remain
    unestablished.
  molecular_function:
    id: GO:0031267
    label: small GTPase binding
  directly_involved_in:
  - id: GO:0047496
    label: vesicle transport along microtubule
  locations:
  - id: GO:0031902
    label: late endosome membrane
  - id: GO:0005765
    label: lysosomal membrane
  supported_by:
