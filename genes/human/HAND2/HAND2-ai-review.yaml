suggested_questions:
- question: Which HAND2 target genes are regulated through direct E-box binding by HAND2/E-protein heterodimers
    versus DNA-binding-independent recruitment by GATA4, MEF2C or NKX2-5, and does this differ between heart, limb
    and sympathetic neurons?
- question: Should GO represent the progesterone-HAND2-FGF stromal pathway in endometrium (embryo implantation/decidualization)
    as a HAND2 process, given that HAND2 acts by regulating paracrine FGF expression?
- question: Are the ERK1/2 and p38 cascade annotations from the heart failure study direct HAND2 effects or downstream
    readouts of hypertrophy?
suggested_experiments:
- hypothesis: A DNA-binding-deficient (basic region mutant) HAND2 retains GATA4-dependent activation of cardiac
    targets but loses E-box-dependent targets.
  description: Knock in a basic-domain mutant HAND2 in human iPSC-derived cardiomyocytes and neural crest; profile
    HAND2, GATA4 and E-protein occupancy by CUT&RUN and transcriptome by RNA-seq.
  experiment_type: genome-wide DNA-binding and transcriptomic profiling
