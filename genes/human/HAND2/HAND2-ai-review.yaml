id: P61296
gene_symbol: HAND2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: HAND2 (dHAND) is a Twist-family class B basic helix-loop-helix transcription factor that heterodimerizes
  with E-proteins (TCF3/E12-E47, TCF4, TCF12) and other bHLH factors (HAND1, TWIST1) to bind E-box elements, and
  activates target genes through an N-terminal activation domain. It also acts without direct DNA binding by forming
  complexes with partner transcription factors, notably GATA4 (via its bHLH domain, recruiting p300), MEF2C, NKX2-5
  and PHOX2A, to synergistically activate cardiac genes such as NPPA/ANF and noradrenergic genes such as DBH. Dimer
  partner choice is regulated by PKA/PP2A phosphorylation of helix I. In development it is expressed in lateral
  mesoderm, the right-ventricle-fated heart tube, cardiac and cranial neural crest, posterior limb bud and sympathetic/enteric
  neuron precursors, and is required for right ventricle formation, outflow tract and aortic arch alignment, branchial
  arch development, posterior limb identity upstream of Sonic hedgehog, and sympathetic and enteric neuron differentiation.
  In the adult it is induced by progesterone in endometrial stroma, where it suppresses FGF production to permit
  implantation, and is re-expressed in failing myocardium downstream of calcineurin/NFAT, where it promotes pathological
  hypertrophy.
