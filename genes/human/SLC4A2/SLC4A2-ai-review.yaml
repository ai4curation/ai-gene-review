id: P04920
gene_symbol: SLC4A2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SLC4A2 (anion exchanger 2, AE2) is a member of the SLC4 bicarbonate-transporter
  (band 3-related) family that functions as a sodium-independent, electroneutral chloride/bicarbonate
  exchanger in the plasma membrane. It catalyses the one-for-one exchange of extracellular
  chloride for intracellular bicarbonate (and the reverse), thereby regulating intracellular
  pH, chloride concentration and cell volume. The protein has a large cytoplasmic N-terminal
  domain and a C-terminal polytopic membrane domain that carries out transport. AE2 is
  broadly expressed and is typically targeted to the basolateral membrane of epithelial
  cells, although in hepatocytes it is sorted apically (canalicular), where it contributes
  to biliary bicarbonate secretion. Through pH homeostasis it supports specialised physiology
  in several tissues, including acid secretion by gastric parietal cells, osteoclast-mediated
  bone resorption, and enamel mineralisation by ameloblasts; biallelic loss of function
  causes an autosomal recessive osteopetrosis.
