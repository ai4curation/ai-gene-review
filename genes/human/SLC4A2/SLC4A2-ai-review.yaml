    supporting_text: Reaction=hydrogencarbonate(in) + chloride(out) = hydrogencarbonate(out)
  - reference_id: file:human/SLC4A2/SLC4A2-uniprot.txt
    record_section: ["CC:FUNCTION"]
    supporting_text: Sodium-independent anion exchanger which mediates the electroneutral
      exchange of chloride for bicarbonate ions across the cell membrane
  - reference_id: PMID:34668226
