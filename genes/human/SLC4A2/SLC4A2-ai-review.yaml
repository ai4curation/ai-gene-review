suggested_questions:
- question: Does human AE2 physically associate with carbonic anhydrase II (or other carbonic
    anhydrases) to form a bicarbonate-transport metabolon, and is this the basis of the
    electronically transferred enzyme-binding annotation?
- question: Which specific AE2-dependent pH or chloride changes drive osteoclast podosome-belt
    formation and bone resorption, and can they be uncoupled from differentiation?
- question: Is the spermatogenesis and digestive-tract-development annotation (transferred
    from rodent orthologs) supported by a developmental requirement for human AE2, or does
    it reflect physiological acid/base roles rather than development?
suggested_experiments:
- hypothesis: AE2-mediated Cl-/HCO3- exchange controls osteoclast function by regulating
    cytosolic pH at the podosome belt, with calpain as the pH-sensitive effector.
  description: In primary human osteoclasts and the RAW264.7 rescue system, pair ratiometric
    intracellular-pH imaging with podosome-belt and pit-resorption assays across wild-type,
    OPTB9 mutant (A186T, V553A) and transport-dead AE2, and test whether clamping pH or
    inhibiting calpain reproduces or rescues the podosome phenotype.
  experiment_type: cell biology and imaging
- hypothesis: AE2 forms a functional bicarbonate-transport metabolon with carbonic anhydrase
    II that enhances HCO3-/Cl- exchange.
  description: Co-immunoprecipitation and proximity assays between endogenous AE2 and CAII,
    with transport-activity measurement (intracellular pH/Cl- flux) in cells expressing
    AE2 with and without a CAII-binding-site mutation or CAII knockdown.
  experiment_type: interaction biochemistry and transport assay
knowledge_gaps:
- gap_statement: The mechanistic chain linking AE2 anion exchange to osteoclast actin/podosome
    organisation and bone resorption is undetermined - specifically which local pH or chloride
    signal is sensed, and by which effector, to control podosome-belt formation.
  boundary: It is established that AE2 loss-of-function impairs osteoclastogenesis and bone
    resorption and causes abnormal podosome-belt formation, and that AE2 acts via anion-exchange-dependent
    control of intracellular pH; the sensed signal and the effector are not defined.
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
