  qualifier: located_in
  review:
    summary: AE2 was detected in a high-throughput mass-spectrometry proteome of isolated
      focal adhesions in a study primarily characterising myosin-II-responsive focal-adhesion
      components and beta-Pix.
    action: MARK_AS_OVER_ANNOTATED
    reason: This is a single high-throughput proteomics dataset with no functional or independent
      corroboration of a focal-adhesion role for AE2. As an abundant polytopic plasma-membrane
      transporter, AE2 is a plausible co-isolation contaminant of membrane-associated adhesion
      fractions. There is no evidence that AE2 is a resident focal-adhesion component or
      functions there, so the annotation is treated as an over-annotation rather than a
      core location. It is not removed because the HDA detection is a real experimental
      observation that cannot be fully refuted.
