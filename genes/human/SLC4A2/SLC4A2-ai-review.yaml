core_functions:
- description: Sodium-independent, electroneutral exchange of chloride for bicarbonate across
    the plasma membrane. This one-for-one Cl-/HCO3- antiport is the evolved molecular activity
    of AE2; by moving bicarbonate in or out it sets and regulates intracellular pH and chloride
    concentration. The protein acts at the basolateral membrane in most epithelia and at
    the apical (canalicular) membrane in hepatocytes.
  molecular_function:
    id: GO:0140900
    label: chloride:bicarbonate antiporter activity
  directly_involved_in:
