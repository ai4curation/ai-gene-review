  title: Fgd1, the Cdc42 GEF responsible for Faciogenital Dysplasia, directly interacts with cortactin and mAbp1
    to modulate cell shape.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Identifier, title and DOI 10.1093/hmg/ddg209 were verified against official donor UniProt and
      the actual author-uploaded original. Selected original Methods, Results, Figure 3–7 captions and Table 1 were
      read. Mouse Fgd1 1–960 and engineered derivatives interact with cortactin/mAbp1 in binding and tagged-protein
      assays; the full-length construct redistributes from cytoplasmic/Golgi pools toward ruffles and lamellipodia
