    review_notes: Identity, DOI and original author header agree with the accepted publication metadata. The author-uploaded
      original was read through the operative Experimental Procedures, Results and Discussion, and captions for
      Figures 1–4. Human FGD1 residues 330–710 were expressed as tagged DH–PH constructs; purified exchange assays
      distinguish Sf9-derived modified Cdc42Hs from bacterial Cdc42Hs, and the binding assay uses NIH 3T3 lysate.
