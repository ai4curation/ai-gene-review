  review:
    summary: FGD1 promotes GDP–GTP exchange on Cdc42.
    action: ACCEPT
    reason: PMID:8969170 directly measures GDP dissociation and GTPγS loading using purified human FGD1 residues
      330–710, containing the DH and first PH domains. The recombinant fragment stimulates membrane-derived, post-translationally
      modified Cdc42Hs from Sf9 cells; bacterially expressed Cdc42Hs is not stimulated in those assays. This establishes
      guanyl-nucleotide exchange factor activity, with the stated substrate and construct limits. It is not a natural
      splice-product comparison or proof that every FGD1 construct has the same activity.
