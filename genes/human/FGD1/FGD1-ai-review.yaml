id: P98174
gene_symbol: FGD1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: FGD1 is a multidomain guanine nucleotide exchange factor that activates CDC42 by promoting GDP release
  and GTP binding. Its Dbl homology domain is followed by a pleckstrin homology domain, with a FYVE-type zinc finger
  and a second pleckstrin homology domain farther toward the C terminus. Cytosolic and membrane-associated pools
  couple CDC42 activation to changes in actin organization and cell shape. Ortholog studies identify interactions
  with cortactin and mAbp1 that influence cortical targeting. Pathogenic FGD1 variants cause Aarskog–Scott syndrome.
