  terms:
  - id: GO:0005085
    name: guanyl-nucleotide exchange factor activity
    isObsolete: false
    aspect: molecular_function
    definition:
      text: Stimulates the exchange of GDP to GTP on a signaling GTPase, changing its conformation to its active
        form. Guanine nucleotide exchange factors (GEFs) act by stimulating the release of guanosine diphosphate
        (GDP) to allow binding of guanosine triphosphate (GTP), which is more abundant in the cell under normal
        cellular physiological conditions.
      xrefs:
      - dbCode: PMID
        dbId: '23303910'
      - dbCode: PMID
        dbId: '27218782'
  - id: GO:0031267
    name: small GTPase binding
    isObsolete: false
    aspect: molecular_function
    definition:
      text: Binding to a small monomeric GTPase.
      xrefs:
      - dbCode: PMID
        dbId: '27218782'
  - id: GO:0051056
    name: regulation of small GTPase mediated signal transduction
    isObsolete: false
    aspect: biological_process
    definition:
      text: Any process that modulates the frequency, rate or extent of small GTPase mediated signal transduction.
  - id: GO:0090630
    name: activation of GTPase activity
    isObsolete: false
    aspect: biological_process
    definition:
      text: Any process that initiates the activity of an inactive GTPase through the replacement of GDP by GTP.
  - id: GO:0043087
    name: regulation of GTPase activity
    isObsolete: false
    aspect: biological_process
    definition:
      text: Any process that modulates the rate of GTP hydrolysis by a GTPase.
  - id: GO:0007165
    name: signal transduction
    isObsolete: false
    aspect: biological_process
    definition:
      text: The cellular process in which a signal is conveyed to trigger a change in the activity or state of a
        cell. Signal transduction begins with reception of a signal (e.g. a ligand binding to a receptor or receptor
        activation by a stimulus such as light), or for signal transduction in the absence of ligand, signal-withdrawal
        or the activity of a constitutively active receptor. Signal transduction ends with regulation of a downstream
        cellular process, e.g. regulation of transcription or regulation of a metabolic process. Signal transduction
        covers signaling from receptors located on the surface of the cell and signaling via molecules located within
        the cell. For signaling between cells, signal transduction is restricted to events at and within the receiving
        cell.
  - id: GO:0032489
    name: regulation of Cdc42 protein signal transduction
    isObsolete: false
    aspect: biological_process
    definition:
      text: Any process that modulates the frequency, rate or extent of Cdc42 protein signal transduction.
