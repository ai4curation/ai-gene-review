id: P11836
gene_symbol: MS4A1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: MS4A1 encodes CD20, the founding member of the MS4A family of tetraspanning membrane proteins.
  CD20 is a non-glycosylated, S-palmitoylated four-pass plasma membrane protein with cytoplasmic N and
  C termini and two short extracellular loops, expressed exclusively on B lymphocytes from the late pre-B
  stage until terminal differentiation into plasma cells. It resides constitutively in membrane rafts,
  self-associates (cryo-EM resolves a compact double-barrel dimer; biochemical data suggest higher oligomers),
  and associates with surface IgM of the B cell antigen receptor (BCR), dissociating upon receptor engagement.
  CD20 is required for BCR-stimulated store-operated calcium entry and increases transmembrane Ca2+ conductance
  when expressed ectopically; whether it forms a channel itself or regulates a store-operated channel
  remains unresolved. Loss of CD20 in humans causes common variable immunodeficiency 5, with normal B
  cell development but impaired T cell-independent antibody responses. CD20 is the target of therapeutic
  monoclonal antibodies (rituximab, ofatumumab, obinutuzumab) used to deplete B cells in lymphoma and
  autoimmune disease.
