existing_annotations:
- term:
    id: GO:0002115
    label: store-operated calcium entry
  evidence_type: IMP
  original_reference_id: PMID:12920111
  qualifier: involved_in
  review:
    summary: 'CD20 is required for B cell receptor-stimulated store-operated calcium entry: siRNA knockdown
      of CD20 in B cells reduced BCR-stimulated influx, and ectopic CD20 introduced a raft-dependent SOC
      entry pathway in CHO cells.'
    action: ACCEPT
    reason: Direct loss-of-function (siRNA) evidence in B cells plus gain-of-function in heterologous
      cells places CD20 as a component of the SOC entry pathway downstream of the BCR. This is the best-supported
      process role of CD20 and is corroborated by reduced CD19-induced calcium responses in CD20-/- mouse
      B cells (PMID:14688067). Whether CD20 forms the pore or regulates/organizes an ORAI/STIM-type channel
      is unresolved, so the process term (not a channel MF) is the appropriate assertion.
    additional_reference_ids:
    - PMID:14688067
    supported_by:
    - &id014
      reference_id: PMID:12920111
      supporting_text: B cell receptor-stimulated influx was significantly reduced by downregulation of
        CD20 expression using short interfering RNA and also by cholesterol depletion
    - &id002
      reference_id: PMID:12920111
      supporting_text: This is the first evidence that raft-associated CD20 constitutes a component of
        a SOC entry pathway activated by the B cell receptor.
    - &id020
      reference_id: PMID:14688067
      supporting_text: CD19-induced intracellular calcium responses were significantly reduced in CD20(-/-)
        B cells, with a less dramatic effect on IgM-induced responses.
    - reference_id: file:human/MS4A1/MS4A1-uniprot.txt
      supporting_text: Functions as a store-operated calcium (SOC) channel component promoting calcium
        influx after activation by the B-cell receptor/BCR
- term:
    id: GO:0005154
    label: epidermal growth factor receptor binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: enables
  supporting_entities:
  - UniProtKB:D4A4Y3
  - ensembl:ENSRNOP00000028433
  review:
    summary: Electronic transfer (Ensembl Compara) from a rat Ms4a1 ortholog annotation asserting epidermal
      growth factor receptor binding.
    action: REMOVE
    reason: 'No human or mouse study links CD20 to EGFR, and the two proteins are not co-expressed in
      a physiological setting: CD20 is B-cell restricted, whereas EGFR is not a B-cell receptor. CD20
      interaction data consistently point to the BCR (IgM), MHC class II and itself. The ortholog-projected
      binding claim is not supported by the biology of the human protein and is not informative about
      its function.'
    supported_by:
    - reference_id: file:human/MS4A1/MS4A1-uniprot.txt
      supporting_text: Expressed on B-cells.
    - &id010
      reference_id: file:human/MS4A1/MS4A1-uniprot.txt
      supporting_text: Interacts with the heavy and light chains of cell surface IgM, the antigen-binding
        components of the BCR
    - &id007
      reference_id: PMID:18474602
      supporting_text: Two major surface-labeled proteins that coprecipitated with CD20 were identified
        as the heavy and light chains of cell surface IgM, the antigen-binding components of the BCR.
