  review:
    summary: High-throughput binary interaction with UniProtKB:Q8N6L0 reported in the HI-II-14 proteome-scale
      yeast two-hybrid map.
    action: REMOVE
    reason: Generic protein binding is uninformative about CD20 function. The interaction with UniProtKB:Q8N6L0
      comes from a systematic yeast two-hybrid screen without follow-up in B cells; many HuRI partners
      of CD20 are ER/membrane proteins (e.g. REEP2/REEP4, TMX2, SLC10A1, HSD17B11) consistent with promiscuous
      membrane-protein pairing in Y2H. Removal does not imply the interaction is false; the functionally
      informative CD20 interactions (IgM BCR, self-association) are captured by other annotations.
