  title: UniProt entry P11836 (CD20_HUMAN)
  findings: []
core_functions:
- description: Plasma-membrane raft-resident component of the B cell antigen receptor (BCR) signaling
    machinery that associates with surface IgM and is required for BCR-triggered store-operated calcium
    entry into the cytosol of B lymphocytes.
  molecular_function:
    id: GO:0001791
    label: IgM binding
  directly_involved_in:
  - id: GO:0050853
    label: B cell receptor signaling pathway
  - id: GO:0002115
    label: store-operated calcium entry
  - id: GO:1902656
    label: calcium ion import into cytosol
  locations:
  - id: GO:0044853
    label: plasma membrane raft
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - *id007
  - *id014
  - *id002
  - *id021
  knowledge_gaps:
  - gap_statement: 'The molecular activity of CD20 in calcium entry is unknown: it is unresolved whether
      CD20 oligomers form a calcium-permeable pore themselves or regulate/organize a store-operated channel
      (e.g. ORAI/STIM) within BCR-associated rafts.'
    gap_kind:
    - BIOLOGY
    dark_aspect: MF_DARK
    status: OPEN
    significance: Determines whether CD20 should carry a channel activity term or a regulator activity,
      and how anti-CD20 antibodies alter calcium flux.
    resolution: Reconstitution of purified CD20 in planar bilayers/liposomes and calcium flux assays in
      ORAI1/STIM1-deficient B cells expressing CD20.
    provenance:
    - *id022
    - *id002
proposed_new_terms: []
suggested_questions:
- question: Does CD20 conduct Ca2+ directly as an oligomeric channel, or does it couple the BCR to ORAI/STIM
    store-operated channels?
- question: What is the native oligomeric state of CD20 in resting B cell membranes (dimer as in cryo-EM
    vs tetramer by co-IP), and does BCR engagement change it?
- question: Why is CD20 loss selectively deleterious for T cell-independent antibody responses while T-dependent
    responses and B cell development are largely normal?
suggested_experiments:
- description: Reconstitute purified human CD20 in liposomes/planar lipid bilayers and measure Ca2+ and
    Sr2+ permeation, with and without rituximab.
  experiment_type: electrophysiology/reconstitution
  hypothesis: CD20 oligomers form an intrinsic cation-permeable pore.
- description: Knock out ORAI1/STIM1 in human B cell lines and test whether CD20 overexpression still
    enhances BCR-triggered store-operated calcium entry.
  experiment_type: genetic epistasis/calcium imaging
  hypothesis: CD20 acts upstream of or as a regulator of ORAI/STIM SOC channels rather than as an independent
    channel.
- description: Super-resolution imaging and proximity labeling of endogenous CD20, IgM-BCR, IgD-BCR and
    CD19 in resting versus activated primary human B cells.
  experiment_type: imaging/proteomics
  hypothesis: CD20 organizes BCR nanoclusters in resting B cells and is released upon receptor engagement.
