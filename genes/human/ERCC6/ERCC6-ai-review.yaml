- term:
    id: GO:0000012
    label: single strand break repair
  evidence_type: IDA
  original_reference_id: PMID:29545921
  qualifier: involved_in
  review:
    summary: CSB contributes to cellular single-strand-break repair under alkylation stress.
    action: KEEP_AS_NON_CORE
    reason: PMID:29545921 Figure1 and the associated Results compare human CS-B fibroblasts, controls
      and wild-type-complemented cells by alkaline comet assays after MMS, including G1-enriched cells.
      Delayed disappearance of strand breaks supports a contextual repair contribution. Retain this existing
      assertion as non-core without assigning CSB a glycosylase, end-processing or ligase reaction, or
      treating the comet endpoint as identification of a particular chemical step.
- term:
    id: GO:0000077
    label: DNA damage checkpoint signaling
  evidence_type: IMP
  original_reference_id: PMID:25820262
  qualifier: involved_in
  review:
    summary: CSB supports the DNA-damage checkpoint in the tested human-cell context.
    action: KEEP_AS_NON_CORE
    reason: PMID:25820262 Results/Figures2–8 use human hTERT-RPE CSB knockout and rescue, checkpoint/ATM–Chk2
      measurements and repair reporters. These support a positive checkpoint contribution in addition
      to the chromatin-remodeling role. This contextual regulatory function does not make CSB the checkpoint
      kinase.
