- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:26030138
  qualifier: enables
  supporting_entities:
  - UniProtKB:O00232
  review:
    summary: Human CSB associates with PSMD12 in tagged-protein co-immunoprecipitation (anti-Flag capture
      only).
    action: KEEP_AS_NON_CORE
    reason: PMID:26030138 Figure 6D tests human CSB-Flag and PSMD12-Myc in CS1AN fibroblast lysates. Anti-Flag
      capture recovered the partner; the reciprocal anti-Myc experiment did not confirm this association.
      The preceding full-length CSB-TAP screen used a TAP-only control and a clone that restored UV survival,
      but the interaction assays were performed without exogenous DNA damage. These are cellular association
      assays, not purified binary-binding or catalytic tests; they do not establish that CSB performs
      the partner's molecular activity. Retain the supported generic interaction as non-core; no more
      specific molecular function is assigned from complex co-recovery alone. S1 Table row 18 reports
      2 control versus 6 CSB-TAP unique peptides for this partner, so the original screen is not described
      as complete absence from the control.
