id: Q03468
gene_symbol: ERCC6
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ERCC6 encodes CSB, a nuclear DNA-dependent ATPase that promotes RNA polymerase II progression
  and organizes transcription-coupled nucleotide-excision repair. CSB acts on upstream DNA in polymerase
  complexes and recruits CSA and other repair factors to stalled transcription machinery. Its ATP-dependent
  chromatin-remodeling activity also promotes histone displacement around DNA double-strand breaks. The
  locus produces the distinct CSB–PGBD3 fusion, which has sequence-selective DNA-binding and gene-regulatory
  activities; the full-length CSB motor activities are established for the canonical protein.
