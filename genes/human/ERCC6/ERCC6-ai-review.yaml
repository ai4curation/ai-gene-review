- term:
    id: GO:0003678
    label: DNA helicase activity
  evidence_type: IDA
  original_reference_id: PMID:8999876
  qualifier: enables
  negated: true
  review:
    summary: Preserve the experimentally supported NOT DNA-helicase annotation.
    action: ACCEPT
    reason: This source row is negated. PMID:8999876 Figure4 and operative Results test purified human
      CSB on a partial duplex, with positive UvrD control and assays with CSA, without detecting strand
      displacement. The result is compatible with ATP-dependent DNA translocation rather than helicase
      unwinding. Accept the negative assertion within the tested conditions, without claiming that every
      possible substrate/context was excluded.
