- id: PMID:22032989
  title: CSA and CSB proteins interact with p53 and regulate its Mdm2-dependent ubiquitination.
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Access and target scope: Actual main Results/Figures4–5 and cell/construct/extract
      Methods, plus author-upload web458–478,567–695,1061–1146; normal original Methods191–211. Human
      primary fibroblast/CS1AN/HeLa experiments use reciprocal and sequential immunoprecipitation to place
      full-length CSB in a p53–Mdm2–CSA assembly. Figure5 distinguishes full-length 1493-aa CSB from the
      shorter CSB–PGBD3 fusion; both can associate with p53 but the fusion does not support the same CSA
      linkage. Immunopurified CSB complexes contribute to Mdm2-dependent p53 ubiquitination; Mdm2 is the
      E3 catalyst. No purified binary CSB–p53 affinity assay claimed; no E3 activity assigned to CSB and
      no extra fusion annotation manufactured. Genuine normal cache added separately. See the original-source
      guide for the DOI/access route and precise operative locators; normal-cache access flags were not
      changed. Original routes and precise source limits are documented in ERCC6-original-source-guide.md.'
- id: PMID:26218421
  title: CSB-PGBD3 Mutations Cause Premature Ovarian Failure.
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Actual original Results 197–213, Methods 259–277/283 and the construct description/caption309
      were read, with the database consultation also inspecting Methods 270–312. Tagged full human CSB–PGBD3-RFP
      in U2OS and fusion-eGFP in HeLa support nuclear and damage-associated chromatin localization. Rhesus-oocyte
      immunohistochemistry is separate; human ovary western is expression evidence. Nucleus is supported,
      while the precise external nucleoplasm/nuclear-body claims remain unresolved. No figure pixels or
      separate supplements were inspected; no canonical-CSB equivalence is inferred. Original routes and
      precise source limits are documented in ERCC6-original-source-guide.md.
- id: PMID:28727848
  title: The nuclear proteome of Trypanosoma brucei.
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: https://doi.org/10.1371/journal.pone.0181884. Actual original JATS Methods nuclear purification
      and MS (indexed10,13), Results22/26; actual original S1 Table.xlsx S1A row642 and S1B row576, including
      headers. No figure pixels. Procyclic T. brucei donor Tb927.7.4080/Q57UN8 is detected with five peptides
      and imputed nuclear enrichment NES2.306, p0.01793; whole-cell values are absent. It is not one of
      the six fluorescent-fusion validations. Proteomic nuclear enrichment supplies donor grounding. It
      is not human direct localization and is not imaging of this donor. Original routes and precise source
      limits are documented in ERCC6-original-source-guide.md.
- id: PMID:31644904
  title: Rat Model of Cockayne Syndrome Neurological Disease.
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: https://doi.org/10.1016/j.celrep.2019.09.028. Actual author-upload original main Results331–779
      and Figure2 caption1233–1260; STAR Methods2294–2728, especially clonogenic2508–2533, qRT-PCR2535–2543,
      EU2545–2563, UDS2565–2581 and CPD2595–2612. Supplementary S2C/D panels and primer table not independently
      inspected; no pixels. Rat R571X primary fibroblasts model human R652X. Post-UV RNA-synthesis recovery/CPD
      removal is impaired while UDS is preserved. Potassium-bromate clonogenic sensitivity does not by
      itself distinguish DNA-damage prevention from repair or survival. The normal cache is abstract-only,
      but actual original main text and operative Methods were separately recovered. Do not manufacture
      an unavailable-main flag from cache metadata. Detailed supplementary elongation/protection assays
      remain unread. Original routes and precise source limits are documented in ERCC6-original-source-guide.md.
- id: PMID:31970402
  title: Cockayne syndrome group A and B proteins function in rRNA transcription through nucleolin regulation.
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Access and target scope: Actual main human cell/construct Methods; Results CSB–Nucleolin
      and Figures5–6 captions, including rDNA occupancy and pre-rRNA readouts. Human CS1AN stable GFP–CSB
      wild-type versus UBD LL1427/1428GG rescue, at near-endogenous abundance, and U2OS CSB knockdown
      establish positive rRNA synthesis. Wild-type CSB restores Nucleolin and PolI occupancy at rDNA coding
      regions and unprocessed pre-rRNA; Nucleolin depletion distinguishes the recruitment-dependent effect.
      No figure pixels/supplement; CSB regulates PolI access/elongation rather than synthesizing RNA itself.
      Genuine normal cache added separately. See the original-source guide for the DOI/access route and
      precise operative locators; normal-cache access flags were not changed. Original routes and precise
      source limits are documented in ERCC6-original-source-guide.md.'
core_functions:
- description: Canonical CSB hydrolyzes ATP, providing the chemical energy for its DNA motor and chromatin-remodeling
    functions. Purified human CSB directly releases phosphate from ATP; DNA structure and partner proteins
    modulate this activity.
  molecular_function:
    id: GO:0016887
    label: ATP hydrolysis activity
  supported_by:
  - reference_id: PMID:12560492
  - reference_id: PMID:9565609
  - reference_id: PMID:16246722
- description: Canonical CSB acts on upstream DNA in RNA polymerase II complexes to promote polymerase
    progression and participate in transcription-coupled repair. Human-CSB mutational and structural experiments
    support a translocase mechanism; movement is inferred from conformational states and functional assays
    rather than directly tracked stepping.
  molecular_function:
    id: GO:0015616
    label: DNA translocase activity
  directly_involved_in:
  - id: GO:0006283
    label: transcription-coupled nucleotide-excision repair
  - id: GO:0032968
    label: positive regulation of transcription elongation by RNA polymerase II
  locations:
  - id: GO:0000785
    label: chromatin
  supported_by:
  - reference_id: PMID:34526721
  - reference_id: PMID:9326587
- description: Canonical CSB uses ATP-dependent chromatin remodeling to displace histones near DNA double-strand
    breaks. Human-cell knockout and wild-type versus W851R rescue establish H2A/H2B eviction at an induced
    break, with a targeted cellular remodeling readout.
  molecular_function:
    id: GO:0140658
    label: ATP-dependent chromatin remodeler activity
  directly_involved_in:
  - id: GO:0006302
    label: double-strand break repair
  locations:
  - id: GO:0000785
    label: chromatin
  supported_by:
  - reference_id: PMID:29203878
- description: Canonical CSB recruits repair proteins to chromatin-associated stalled RNA polymerase II.
    Human CIM-deletion, chromatin-tethering and knockout/rescue experiments establish a recruitment function
    involving CSA and downstream repair assembly, distinct from the measured ATP hydrolysis and motor
    mechanism.
  molecular_function:
    id: GO:0140463
    label: chromatin-protein adaptor activity
  directly_involved_in:
  - id: GO:0071168
    label: protein localization to chromatin
  locations:
