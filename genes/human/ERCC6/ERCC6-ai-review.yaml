  review:
    summary: Canonical CSB nuclear localization can be refined to its independently demonstrated nucleoplasmic
      pool.
    action: MODIFY
    reason: 'The actual PTHR45629 tree places human leaf PTN002473896 below the Eukaryota assertion node
      PTN001326493. The ungapped target MSA is an exact 1,493-residue match to Q03468, all three assigned
      IBD terms occur at that node, and no NOT is present on the target path. The nonhuman donor Q57UN8
      is Tb927.7.4080: PMID:28727848 Methods nuclear purification/mass spectrometry and S1 Table, sheet
      S1B row 576, identify it in the procyclic T. brucei nuclear proteome (five peptides in S1A row 642;
      NES 2.306, p = 0.01793, with whole-cell missing values imputed). This is proteomic enrichment, not
      one of the six imaged fusion proteins. Independently, PMID:12560492 Methods Localization of ECFP-tagged
      CSB and Results/Figure 6 show functional CSB-ECFP predominantly in human fibroblast nuclei. The
      target in its own WITH/FROM is legitimate experimental grounding, not circularity. Neither experiment
      transfers canonical-CSB localization or function automatically to the fusion. Independently read
      human CSB imaging in PMID:16107709 Figures 4 and 5D resolves diffuse nucleoplasmic localization;
      PMID:12560492 supplies functional tagged-CSB corroboration. This added precision does not invalidate
      the original nuclear location or its verified source chain. The integrated review consistently refines
      the five broad canonical-CSB nucleus assertions to the independently observed nucleoplasmic pool.
      Conditional localization is retained in separate nucleolar annotations; the refinement does not
      imply exclusive localization or identify a nuclear-body class.'
