- term:
    id: GO:0004930
    label: G protein-coupled receptor activity
  evidence_type: IDA
  original_reference_id: PMID:21693646
  qualifier: enables
  negated: true
  review:
    summary: GPCR activity inferred from LGR5's seven-transmembrane architecture.
    action: REMOVE
    reason: Although LGR5 belongs structurally to the GPCR superfamily, the cited studies explicitly show
      that R-spondin-stimulated LGR5/LGR4 do not couple to heterotrimeric G proteins or beta-arrestin.
      G protein-coupled receptor activity (activation of a G protein) is therefore contradicted; its receptor
      function is captured by transmembrane signaling receptor activity.
    supported_by: &id002
    - &id008
      reference_id: PMID:21693646
      supporting_text: Interestingly, neither receptor is coupled to heterotrimeric G proteins or to β-arrestin
        when stimulated by the R-spondins, indicating a unique mechanism of action.
    - reference_id: PMID:22815884
      supporting_text: No coupling between LGR4 and heterotrimeric G proteins could be detected in RSPO-treated
        cells
