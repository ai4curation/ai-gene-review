id: O75473
gene_symbol: LGR5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: LGR5 is a leucine-rich repeat-containing seven-transmembrane receptor of the glycoprotein
  hormone receptor-like (rhodopsin family) group, with a large N-terminal ectodomain of 17 leucine-rich
  repeats that binds the secreted R-spondins (RSPO1-4). It marks Wnt-dependent adult stem cells of the
  intestinal crypt, stomach, hair follicle and other epithelia. R-spondin binding by LGR4/5/6 potentiates
  canonical Wnt/beta-catenin signaling by enhancing Wnt-induced LRP6 phosphorylation, in part by recruiting
  and neutralizing the E3 ligases RNF43/ZNRF3 that otherwise degrade Frizzled and LRP receptors; LGR5
  does not activate heterotrimeric G proteins or beta-arrestin. LGR5 reaches the plasma membrane, where
  its ectodomain is exposed for ligand binding, but it is constitutively internalized by dynamin-dependent
  endocytosis and retromer-mediated retrograde transport, so at steady state it is predominantly intracellular
  in the trans-Golgi network.
