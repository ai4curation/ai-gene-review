  - *id003
suggested_questions:
- question: What is the relative contribution of NPY5R versus NPY1R to NPY-induced feeding in humans,
    given the limited efficacy of Y5 antagonists in obesity trials?
- question: Does NPY5R localize to neuronal primary cilia in human hypothalamus, and does ciliary localization
    affect signaling?
suggested_experiments:
- description: Map endogenous NPY5R subcellular distribution (soma, presynaptic terminals, primary cilia)
    in human iPSC-derived hypothalamic neurons using validated antibodies or tagged knock-in alleles,
    and measure Gi-mediated cAMP inhibition in each context.
