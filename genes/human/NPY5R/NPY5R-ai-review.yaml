core_functions:
- description: Cell-surface Gi/o-coupled receptor for neuropeptide Y and peptide YY that inhibits adenylate
    cyclase, transducing neuropeptide signals in hypothalamic neurons.
  molecular_function: *id007
  locations:
  - id: GO:0005886
    label: plasma membrane
