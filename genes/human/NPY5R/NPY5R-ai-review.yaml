id: Q15761
gene_symbol: NPY5R
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: NPY5R (neuropeptide Y receptor Y5) is a class A seven-transmembrane G protein-coupled receptor
  of the plasma membrane, expressed mainly in the hypothalamus and other brain regions. It binds neuropeptide
  Y and peptide YY with high affinity (and pancreatic polypeptide with lower affinity) and couples to
  Gi/o proteins to inhibit adenylate cyclase. Y5 was identified as a candidate hypothalamic receptor for
  NPY-stimulated feeding and also modulates neurotransmission; its long third intracellular loop distinguishes
  it from other Y receptors.
