core_functions:
- description: >-
    Heavy chain of the two-headed I1/f inner dynein arm, with DNAH10. It is an ATP-driven
    minus-end-directed microtubule motor that drives axonemal beating in the sperm flagellum
    and in 9+2 motile cilia, and it is needed for the inner dynein arms and normal axonemal
    organization to form in sperm.
  molecular_function:
    id: GO:0008569
    label: minus-end-directed microtubule motor activity
  directly_involved_in:
  - id: GO:0030317
    label: flagellated sperm motility
  - id: GO:0060294
    label: cilium movement involved in cell motility
  locations:
  - id: GO:0036126
    label: sperm flagellum
  - id: GO:0097729
    label: 9+2 motile cilium
  in_complex:
    id: GO:0036156
    label: inner dynein arm
  supported_by:
  - reference_id: PMID:30811583
    supporting_text: >-
      Together, these data suggest that the DNAH2 mutation can cause severe sperm flagella
      defects that damage sperm motility.
  - reference_id: PMID:33968937
    supporting_text: Dnah2-null males, but not females, are infertile.
  - reference_id: PMID:30060180
    supporting_text: Depletion of Wdr78 or Dnah2 by RNAi paralyzed mouse ependymal cilia.
  - reference_id: PMID:30060180
    supporting_text: >-
      Our results also provide the first experimental evidence that validates Dnah10 and Dnah2
      as HCs and Wdr78, Wdr63, and Casc1 as ICs of vertebrate Dynein-f
suggested_questions:
- question: >-
    DNAH2 knockdown paralyses mouse ependymal cilia, yet men with biallelic DNAH2 variants
    are reported without respiratory disease. Do respiratory cilia tolerate loss of the I1/f
    arm, or have PCD cohorts not been screened for DNAH2?
- question: >-
    Are the centriole and annulus defects in Dnah2-null spermatids a direct role for DNAH2
    in manchette- or IFT-based transport, or a secondary consequence of a failed axoneme?
- question: >-
    One study reports a role for DNAH2 in Fanconi anaemia DNA repair in U2OS cells (PMID:35402838).
    Is a non-ciliary nuclear function plausible for a 500 kDa axonemal dynein, or is this
    an off-target or antibody artefact?
- question: >-
    The UniProt/InterPro PANTHER cross-reference assigns DNAH2 (Q9P225) to PTHR46532:SF11,
    the subfamily named "dynein axonemal heavy chain 12", whereas the PANTHER service places
    it in PTHR10676:SF183 ("dynein axonemal heavy chain 2"). Should the InterPro-side assignment
    be corrected?
suggested_experiments:
- description: >-
    Cryo-ET of the 96-nm repeat in Dnah2-null mouse sperm and tracheal cilia to determine
    whether the whole I1/f arm (DNAH10, DNAI3, DNAI4) is lost and whether other arms depend
    on it.
  experiment_type: cryo-electron tomography
- description: >-
    High-speed video microscopy and ciliary beat frequency/waveform analysis of airway cells
    from men with biallelic DNAH2 variants.
  experiment_type: ciliary beat analysis
