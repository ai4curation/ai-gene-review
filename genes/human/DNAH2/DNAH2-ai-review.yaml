- id: PMID:30811583
  title: >-
    DNAH2 is a novel candidate gene associated with multiple morphological abnormalities of
    the sperm flagella.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract only. First report of biallelic DNAH2 variants in MMAF; source of the IMP annotations.
- id: PMID:31178125
  title: >-
    Mutations in DNAH17, Encoding a Sperm-Specific Axonemal Outer Dynein Arm Heavy Chain,
    Cause Isolated Male Infertility Due to Asthenozoospermia.
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Abstract only. DNAH17 paper in which DNAH2 is used as an inner dynein arm marker in
      human sperm; source of the IDA localization rows.
- id: PMID:9256245
  title: >-
    Isolation of several human axonemal dynein heavy chain genes: genomic structure of the
    catalytic site, phylogenetic analysis and chromosomal assignment.
  findings: []
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Abstract only. Cloning and phylogenetic classification of human axonemal heavy chains;
      supports only the NAS rows.
- id: PMID:33968937
  title: >-
    Genetic Defects in DNAH2 Underlie Male Infertility With Multiple Morphological Abnormalities
    of the Sperm Flagella in Humans and Mice.
  findings:
  - statement: Dnah2-null male mice are infertile with MMAF-like sperm.
    supporting_text: >-
      Dnah2-null sperm cells display absent, short, bent, coiled, and/or irregular flagella
      consistent with the MMAF phenotype.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text. Human family plus Dnah2-null mice: male-specific infertility, MMAF, centriole/annulus
      mislocalization and loss of DNAH1 from flagella.
- id: PMID:33771466
  title: >-
    Novel bi-allelic variants in DNAH2 cause severe asthenoteratozoospermia with multiple
    morphological abnormalities of the flagella.
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract only. Three further men with biallelic DNAH2 variants and MMAF.
- id: PMID:30060180
  title: >-
    Vertebrate Dynein-f depends on Wdr78 for axonemal localization and is essential for ciliary
    beat.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text. Shows Dnah2 and Dnah10 are the heavy chains of vertebrate dynein-f, that
      Wdr78 (IC138) associates with Dnah2 and is needed for its ciliary localization, and
      that Dnah2 knockdown paralyses ependymal cilia.
- id: PMID:40898283
  title: >-
    DNAH10 mutation cause primary ciliary dyskinesia with defects of IDAf complex assembly
    and lung fibrosis manifestation.
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      DNAH10 PCD paper listing the IDAf complex composition with DNAH2 and DNAH10 as heavy
      chains (inclusion of DNAH12 there is not established elsewhere).
- id: PMID:35402838
  title: >-
    DNAH2 facilitates the homologous recombination repair of Fanconi anemia pathway through
    modulating FANCD2 ubiquitination.
  findings: []
  reference_review:
    relevance: LOW
    correctness: LOW_QUALITY
    review_notes: >-
      siRNA study in U2OS cells proposing a role for DNAH2 in Fanconi anaemia DNA repair;
      not independently replicated and not used for annotation.
- id: PMID:36792588
  title: >-
    DNALI1 deficiency causes male infertility with severe asthenozoospermia in humans and
    mice by disrupting the assembly of the flagellar inner dynein arms and fibrous sheath.
  findings: []
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Used for the observation that the I1/f heavy chain DNAH10 is DNALI1-independent.
