id: Q9P225
gene_symbol: DNAH2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  DNAH2 (dynein axonemal heavy chain 2) is a 4427-residue axonemal dynein heavy chain and
  one of the two heavy chains of the two-headed inner dynein arm f (I1 dynein), the vertebrate
  counterpart of the Chlamydomonas 1-alpha heavy chain. Its partner heavy chain is DNAH10,
  and the arm also contains the intermediate chains DNAI3 (WDR63/IC140), DNAI4 (WDR78/IC138)
  and DNAI7 (CASC1) and several light chains. It has an N-terminal stem that assembles the
  arm and a motor head of six AAA modules with ATP-binding P-loops and a coiled-coil stalk
  carrying the microtubule-binding domain. Like other axonemal dyneins it is expected to generate
  minus-end-directed force that drives doublet sliding. DNAH2 is expressed mainly in testis
  and trachea and is found along the sperm flagellum and in motile cilia. RNAi knockdown of
  Dnah2 in mouse ependymal cells paralyses their motile cilia, and loss of the IC138 ortholog
  Wdr78 removes Dnah2 and the other dynein-f subunits from the cilium. Biallelic DNAH2 variants
  cause male infertility with multiple morphological abnormalities of the sperm flagella (MMAF;
  spermatogenic failure 45). Patient sperm lose DNAH2 and the inner dynein arms and have disorganized
  axonemes and midpiece defects. Dnah2-null male mice are infertile with MMAF-like sperm,
  mislocalized centriolar and annulus proteins and loss of the inner-arm heavy chain DNAH1
  from the flagellum, whereas female mice are fertile. Men with DNAH2 variants can father
  children by ICSI.
