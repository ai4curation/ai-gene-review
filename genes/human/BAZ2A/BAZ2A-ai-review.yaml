id: Q9UIF9
gene_symbol: BAZ2A
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: BAZ2A (TIP5) is the large regulatory subunit of NoRC ISWI chromatin remodeling complexes,
  which pair it with SNF2H/SMARCA5 or SMARCA1 to slide and space nucleosomes. In the nucleolus, NoRC silences
  a fraction of rRNA genes by integrating TTF-I, promoter-complementary pRNA through the TAM domain, and
  histone-tail recognition by its PHD finger and bromodomain, then recruiting HDAC1, histone methyltransferases
  and DNA methyltransferases to establish rDNA heterochromatin. Much of this canonical rDNA mechanism was
  defined for mouse Tip5. Human BAZ2A forms the corresponding ISWI complexes and can also bind H3K14ac-marked
  inactive enhancers to repress RNA polymerase II target genes through a TAM-, TOP2A- and KDM1A-linked arm.
