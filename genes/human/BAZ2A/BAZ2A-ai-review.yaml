  review:
    summary: Regulation of transcription by RNA polymerase II (IBA). BAZ2A represses enhancer-linked Pol
      II genes in prostate cancer cells and limits active-chromatin invasion into repressive compartments
      in mouse ESCs, but NoRC/rDNA silencing remains its best-defined core role. Kept as non-core.
    action: KEEP_AS_NON_CORE
    reason: Human BAZ2A has direct non-rDNA repression evidence through H3K14ac-marked inactive enhancers
      and TAM-dependent, RNA-mediated association with TOP2A and KDM1A, and mouse ESC data support a
      related TOP2A/cohesin chromatin-regulation arm. These observations justify retaining the Pol II
      parent as non-core rather than treating it as only a generic BAZ-family transfer.
    supported_by:
    - reference_id: PMID:34403195
      supporting_text: BAZ2A associates with inactive enhancers marked by H3K14ac and repressing transcription
        of genes frequently silenced in aggressive and poorly differentiated PCa.
    - reference_id: PMID:37184661
      supporting_text: TOP2A and KDM1A pharmacological inhibition up-regulate BAZ2A-repressed genes that
        are regulated by inactive enhancers bound by BAZ2A, whereas rRNA genes are not affected.
    - reference_id: PMID:33433018
      supporting_text: On ESC chromatin, BAZ2A interacts with SNF2H, DNA topoisomerase 2A (TOP2A) and
        cohesin.
    - reference_id: file:human/BAZ2A/BAZ2A-deep-research-affinage.md
      supporting_text: Through these interactions BAZ2A partners with SNF2H, TOP2A, cohesin and KDM1A
        to constrain chromatin accessibility at repressive (B) compartments and to silence enhancer-controlled
        genes via an RNA-dependent mechanism distinct from rDNA silencing
    propagation_review:
