id: Q9UIF9
gene_symbol: BAZ2A
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: BAZ2A (TIP5) is the large regulatory subunit of the NoRC ISWI chromatin remodeling complexes,
  which pair it with SNF2H/SMARCA5 or SMARCA1 to slide and space nucleosomes. In the nucleolus, NoRC silences
  a fraction of rRNA genes. TIP5 is targeted to rDNA through TTF-I, its bromodomain reading H4K16ac, and
  its TAM domain binding promoter-complementary pRNAs. It then recruits HDAC1, histone methyltransferases
  and DNA methyltransferases to establish rDNA heterochromatin. Much of this mechanism was defined for
  mouse Tip5. Human BAZ2A forms the corresponding ISWI complexes with SMARCA5 and SMARCA1.
