- id: PMID:33433018
  title: BAZ2A safeguards genome architecture of ground-state pluripotent stem cells.
  findings:
  - statement: BAZ2A interacts with SNF2H, TOP2A and cohesin on ESC chromatin.
    supporting_text: On ESC chromatin, BAZ2A interacts with SNF2H, DNA topoisomerase 2A (TOP2A) and
      cohesin.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text; mouse ESC data support a non-rDNA BAZ2A chromatin-regulation arm.
- id: PMID:34403195
  title: BAZ2A-mediated repression via H3K14ac-marked enhancers promotes prostate cancer stem cells.
  findings:
  - statement: Human BAZ2A-BRD binds H3K14ac at inactive enhancers and represses nearby genes in prostate
      cancer cells.
    supporting_text: This association is mediated by BAZ2A-bromodomain (BAZ2A-BRD) that specifically
      binds H3K14ac.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text; direct human evidence for BAZ2A BRD/H3K14ac-dependent enhancer repression.
- id: PMID:34715126
  title: Structural basis of the TAM domain of BAZ2A in binding to DNA or RNA independent of methylation
    status.
  findings:
  - statement: Human BAZ2A TAM binds dsDNA and dsRNA sequence-nonspecifically.
    supporting_text: Our results showed that the TAM domain of BAZ2A selectively binds to dsDNA and
      dsRNA and that it binds to the backbone of dsDNA in a sequence nonspecific manner
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text; human TAM EMSA, ITC, mutagenesis and crystal structures establish direct
      dsDNA/dsRNA binding.
- id: PMID:37184661
  title: BAZ2A-RNA mediated association with TOP2A and KDM1A represses genes implicated in prostate cancer.
  findings:
  - statement: Human BAZ2A represses inactive-enhancer genes through a TAM, RNA, TOP2A and KDM1A mechanism
      distinct from rRNA silencing.
    supporting_text: TOP2A and KDM1A pharmacological inhibition up-regulate BAZ2A-repressed genes that
      are regulated by inactive enhancers bound by BAZ2A, whereas rRNA genes are not affected.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text; direct human prostate-cancer evidence that TAM-dependent Pol II gene repression
      uses RNA-mediated TOP2A/KDM1A associations separable from pRNA-rDNA silencing.
