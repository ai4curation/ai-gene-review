suggested_questions:
- question: Does human BAZ2A stimulate SMARCA5 ATPase directly (as suggested in PMID:28801535), and are
    the pRNA-binding and H4K16ac-reading mechanisms defined in mouse conserved in human rDNA silencing?
- question: Do BAZ2A's rDNA-silencing and H3K14ac enhancer-repression arms use the same TAM and bromodomain
    readouts, or does enhancer repression define a separable non-rDNA core function?
suggested_experiments:
- description: In human cells, test TAM-domain (pRNA-binding) and bromodomain (H4K16ac) mutants of BAZ2A
    for rDNA promoter occupancy, CpG methylation and Pol I output.
