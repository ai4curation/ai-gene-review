  original_reference_id: Reactome:R-HSA-6798751
  qualifier: located_in
  review:
    summary: >-
      Follows from ACTR10's inclusion in Reactome's azurophil granule lumen protein
      set, which Reactome's Neutrophil degranulation pathway derives from bulk
      neutrophil granule proteomics. ACTR10 has no signal peptide and no transmembrane
      segment - the UniProt feature table contains only a CHAIN, three sequence
      conflicts and secondary-structure features - and its only recorded location is
      "Cytoplasm, cytoskeleton". A subunit buried at the pointed end of a 1.2 MDa
      cytosolic complex has no route into the secretory pathway. The assignment is
      also not a property of dynactin, and this is now computed rather than asserted.
      Across the 11 canonical subunits named in UniProt's SUBUNIT line - DCTN1, DCTN2
      and DCTN3 in the shoulder, ACTR1A and ACTB in the filament, CAPZA1 and CAPZB at
      the barbed end, ACTR10, DCTN4, DCTN5 and DCTN6 at the pointed end - exactly one,
      ACTR10, carries any annotation originating from Reactome's Neutrophil
      degranulation route, and ACTR10 alone is annotated to azurophil granule lumen.
      Two near-misses are worth stating because they would otherwise inflate the count:
      CAPZA1 does carry an extracellular-region TAS, but from R-HSA-879377, an
      S100B/AGER binding reaction that is not under Neutrophil degranulation at all; and
      ACTB carries extracellular-region terms only by HDA mass spectrometry, a different
      artefact class. The one protein that genuinely shares ACTR10's route is ACTR1B, the
      beta-centractin paralog that substitutes for ACTR1A in a fraction of dynactin and
      so is a twelfth protein rather than one of the 11 - and, like CAPZA1, one with a
      large non-dynactin pool. So the pattern is per-protein detection in granule
      fractions, not secretion of the complex.
    action: REMOVE
    reason: >-
      Topologically impossible for a cytosolic, membrane-anchorless dynactin subunit,
      and inconsistent across the complex it belongs to, which marks it as detection
      of a cytosolic contaminant in a granule fraction rather than genuine secretion.
      The cost of leaving it is concrete: a 2024 study restated these annotations as
      ACTR10 biology.
