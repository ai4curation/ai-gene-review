core_functions:
- description: >-
    Pointed-end capping subunit of dynactin. ACTR10 docks by its conserved barbed-end
    face onto the composite site formed by the terminal ACTR1A and beta-actin subunits
    of dynactin's actin-like minifilament, and terminates it: its subdomain-2 loop is
    deleted relative to actin, so no further subunit can be added on one protofilament,
    while subdomain 4 blocks addition sterically on the other. A single ACTR10 subunit
    therefore caps both protofilaments and, with the ACTR1A/beta-actin end it reads,
    sets where the complex stops. ACTR10 also nucleates the rest of the pointed-end
    module, contacting DCTN4/p62 and DCTN5/p25 directly, and ACTR10 together with
    DCTN4 is required for dynactin to remain assembled at all - depletion of ACTR10
    leaves less than a tenth of dynactin intact and produces the endosome-dispersal
    and multipolar-spindle phenotypes of whole-complex loss. Through this structural
    role ACTR10 contributes to dynactin's complex-level activity of binding and
    activating the dynein motor for processive minus-end-directed transport. ACTR10
    retains an occupied actin-fold nucleotide site (ATP-Mg or ADP is modelled in the
    Arp11 chain of most dynactin structures) but has no demonstrated catalytic or
    polymerising activity.
