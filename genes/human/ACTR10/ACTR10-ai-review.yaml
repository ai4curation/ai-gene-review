- term:
    id: GO:0005524
    label: ATP binding
  evidence_type: ISS
  original_reference_id: PMID:36071160
  qualifier: enables
  supporting_entities:
  - UniProtKB:I3LHK5
  review:
    summary: >-
      Proposed new annotation, and the mirror image of the over-annotation this family
      usually attracts. GOA gives ACTR10 no nucleotide-binding term at all, yet the
      actin nucleotide site is retained and occupied. Eckley et al. predicted from
      sequence in 1999 that the actin fold's nucleotide and metal binding elements are
      conserved in Arp11, and the structures bear it out: a nucleotide is modelled in
      the Arp11 chain in 19 of the 24 deposited PDB entries that contain ACTR10, and
      the methods of the 3.37 A pointed-end structure state that ATP-Mg was built into
      Arp11 on the basis of density while ADP-Mg was built into beta-actin and the
      Arp1 subunits of the same filament. Computing contacts from the 7Z8M coordinates
      gives 18 Arp11 residues within 4 A of that ATP, arranged canonically for the
      actin fold, and 17 of the 18 are identical in human ACTR10; none of beta-actin's
      own nucleotide contacts fall in an alignment gap. The evidence is ISS rather
      than IDA because every structure with a modelled nucleotide in this chain is
      pig ACTR10 (I3LHK5); the two human dynactin structures (9B7J, 9B85) model ADP on
      the Arp1 chains and AMP-PNP on beta-actin but leave the ACTR10 chain empty.
    action: NEW
    reason: >-
      A concrete annotation gap supported by observed ligand density in the ortholog plus
      near-complete pig-to-human identity across the contacting residues - 17 of 18, which
      is orthology rather than conservation relative to actin, where only 9 of 17 of
      beta-actin's own contacts are shared - and not by fold or family inference. It should be read as a structural/architectural nucleotide site of
      the kind actin-fold proteins carry: no ATP hydrolysis, exchange or dependence
      has been assayed for ACTR10, so no ATPase or ATP-dependent-activity term is
      warranted, and this row deliberately claims binding only. A fourth ground comes from
      the sibling review of ACTR1A, which proposes GO:0043531 ADP binding for Arp1 on the
      stated principle of annotating "the term for the ligand actually observed" because no
      structure has resolved an ATP-bound Arp1. Applied to Arp11 that same principle selects
      GO:0005524: a structure does resolve ATP in the Arp11 chain, and its authors say so
      contrastively against the ADP they built into Arp1 and beta-actin. The two reviews
      therefore differ in term only because the observed ligands differ, not in method.

      On the choice of term: the ligand modelled in the Arp11 chain is ADP in 14 entries
      and ATP in 5, so GO:0005524 is not the majority observation and needs a reason.
      Three things settle it. First, the ATP assignments are the documented ones - the
      only entry whose text states how the density was interpreted is the 3.37 A
      pointed-end model, which says ATP-Mg was built into Arp11 while ADP-Mg went into
      beta-actin and Arp1, so the ATP call is deliberate and contrastive rather than a
      default. Second, GO's own precedent on the actin fold uses this term: of a
      12-member actin/Arp panel only two carry any term under GO:0000166, and both use
      GO:0005524 - human ACTA1 (TAS, alongside GO:0043531 ADP binding) and yeast ACT1
      (IDA). Third, the same survey shows the gap is family-wide rather than a judgement
      about ACTR10: 10 of 12 members carry no nucleotide-binding term at all, including
      ACTB, ACTG1 and ACTR1A. A curator preferring to encode the majority state should
      add GO:0043531 ADP binding as well, exactly as ACTA1 has both; a curator wanting to
      stay agnostic could use the shared parent GO:0032559 adenyl ribonucleotide binding.
      Either is defensible, and none of them licenses an ATPase or ATP-dependent-activity
      term.
