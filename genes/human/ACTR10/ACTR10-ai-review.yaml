proposed_new_terms:
- proposed_name: pointed-end capping of the dynactin Arp1 minifilament
  proposed_definition: >-
    The binding of a protein to the pointed (minus) end of the actin-related protein 1
    (Arp1/ACTR1A) minifilament of the dynactin complex, preventing further addition,
    exchange or removal of filament subunits and thereby defining the pointed
    extremity of the complex.
  justification: >-
    GO cannot currently express the event ACTR10 performs, and the mismatch is one of
    scope rather than of missing biology. The nearest existing term, GO:0051694
    pointed-end actin filament capping, is defined as "The binding of a protein or
    protein complex to the pointed (or minus) end of an actin filament, thus preventing
    the addition, exchange or removal of further actin subunits", and GO's actin
    filament (GO:0005884) is "A filamentous structure formed of a two-stranded helical
    polymer of the protein actin and associated proteins". Dynactin's backbone is
    something else by GO's own definition (GO:0005869): "an actin-like 40 nm filament
    composed of actin-related protein" - eight Arp1/ACTR1A subunits plus a single
    beta-actin. The subunits whose addition Arp11 blocks are therefore Arp1, not actin,
    so GO:0051694 as written describes a different event from the one Arp11 performs. The
    argument is about grain and context, not about a capacity Arp11 lacks: Eckley and
    Schroer tested Arp11 against conventional actin and found it could coassemble, and
    predicted from its conserved barbed-end face that it can interact with filament pointed
    ends generally (PMID:12857853). What GO is missing is therefore a term for capping the
    Arp1 minifilament specifically, not a prohibition on relating Arp11 to actin. The only dynactin-specific capping term GO
    ever had, GO:0005870, cannot express it either: it is a cellular-component term for
    the CapZ heterodimer at the opposite (barbed) end, so it is about the wrong end of the
    filament and the wrong aspect regardless of its status. Its status is in fact obsolete
    - QuickGO returns isObsolete true and renders the label as "obsolete actin capping
    protein of dynactin complex" with a definition prefixed "OBSOLETE.", and OLS reports
    term_replaced_by GO:0008290 F-actin capping protein complex, which is again barbed-end
    CapZ and again a cellular component. The
    event is well enough characterised to warrant a term: cryo-EM shows a single Arp11
    subunit capping both protofilaments, blocking subunit addition on one because its
    subdomain-2 loop is too short and sterically on the other, and Arp11 is the only
    subunit that directly caps that end. Two placements are offered rather than one,
    because the choice is an editorial call about GO:0051693's intended scope. If
    GO:0051693 actin filament capping is meant to cover filaments built from any
    actin-family protein - which its current wording, "an actin filament ... further
    actin subunits", does not say - the new term is its child, as proposed here, and it
    would also serve the yeast ortholog Arp10 and the fungal Arp11 proteins and give
    the two ends of dynactin's filament parallel representation. If GO:0051693 is to
    stay strictly F-actin, the new term belongs instead under GO:0065003
    protein-containing complex assembly, since terminating the Arp1 filament is a step
    in building dynactin. Either way the alternative - widening GO:0051693 and
    GO:0051694 in place - would also resolve it.
  proposed_parent:
    id: GO:0051693
    label: actin filament capping
  supported_by:
  - reference_id: PMID:25814576
    supporting_text: Our structural data reveal how a single Arp11 subunit can cap both
      protofilaments.
  - reference_id: PMID:25814576
    supporting_text: Only Arp11 directly caps the pointed end
  - reference_id: PMID:12857853
    supporting_text: We tested the ability of Arp11 to interact with conventional actin and
      found it could coassemble.
  - reference_id: PMID:12857853
    supporting_text: CapZ and subunits of the pointed end complex are believed to cap the
      ends of the Arp1 filament and prevent annealing.
  - reference_id: PMID:10525537
    supporting_text: The predicted structure of Arp11 suggests it will not form filaments
      by itself and will only interact with filaments of Arp1, or conventional actin,
      at their pointed ends.
suggested_questions:
- question: >-
    Does ACTR10's nucleotide site do anything beyond stabilising the fold? ATP-Mg or
    ADP is modelled in the Arp11 chain of 19 of 24 dynactin structures, and 17 of the
    18 ATP-contacting residues are conserved between pig and human, yet no exchange or
    hydrolysis assay on Arp11 has ever been published. If the site turned over, it
    would make capping potentially regulated rather than constitutive.
  experts:
  - Andrew P. Carter
  - Trina A. Schroer
- question: >-
    Does ACTR10 bind mitochondria directly, and through what? The zebrafish
    separation-of-function construct lacking the dynactin-binding region still binds
    mitochondria, which implies a distinct mitochondrial-facing surface, but no
    outer-membrane partner has been identified and the result has not been reproduced
    in a human system.
  experts:
  - Catherine M. Drerup
- question: >-
    How is the cargo-selective zebrafish phenotype compatible with ACTR10 being
    required for dynactin integrity? RNAi in Cos7 cells leaves under a tenth of
    dynactin assembled when Arp11 is depleted, whereas the zebrafish actr10 mutant
    shows a mitochondria-restricted retrograde defect. Either the fish allele is
    hypomorphic for the structural role or vertebrate dynactin tolerates partial Arp11
    loss better than Cos7 dynactin, and the two possibilities imply very different
    annotations.
  experts:
  - Trina A. Schroer
  - Catherine M. Drerup
- question: >-
    Should pan-dynactin biological processes be propagated to individual structural
    subunits? Reactome records ACTR10 as a participant in MHC class II transport, COPI
    anterograde transport and COPI-independent Golgi-to-ER retrograde traffic, but only
    a cytosol location has reached GO from those reactions. A consistent policy would
    either add the process terms to every subunit or keep them at the complex level
    and rely on part_of dynactin complex.
  experts: []
- question: >-
    Why does ACTR10 appear at focal adhesions and in sperm structures in antibody-based
    imaging? Human Protein Atlas immunofluorescence lists vesicles, plasma membrane,
    focal adhesion sites, perinuclear theca and flagellar structures for ACTR10, none of
    which is expected for a dynactin subunit. Either dynactin has unrecognised
    localisations or the antibodies cross-react with other actin-fold proteins.
  experts: []
suggested_experiments:
- hypothesis: >-
    ACTR10 binds ATP or ADP with a measurable affinity and the bound nucleotide is
    required for it to cap the Arp1 minifilament.
  description: >-
    Express and purify recombinant human ACTR10 alone and as the ACTR10-DCTN4-DCTN5-DCTN6
    pointed-end module, and measure nucleotide occupancy and exchange directly, using
    HPLC quantification of released nucleotide after denaturation together with
    fluorescent nucleotide analogue (mant-ATP/mant-ADP) titration and stopped-flow
    exchange kinetics. In parallel mutate the contact residues identified from the 7Z8M
    coordinates in the phosphate-binding loops (G21/E22/A23/F24/K26 and G307/G308/T309)
    and test whether nucleotide-free ACTR10 still assembles into dynactin and still
    terminates an Arp1 filament in a reconstituted assembly assay. Actin and Arp1 are
    the natural positive controls, both being nucleotide-loaded in the same structures.
  experiment_type: In vitro nucleotide binding and structure-guided mutagenesis
- hypothesis: >-
    ACTR10 contacts a mitochondrial outer-membrane protein through a surface distinct
    from its dynactin-binding face.
  description: >-
    Perform proximity-dependent biotinylation (TurboID or split-TurboID) from
    endogenously tagged human ACTR10 in a neuronal model such as differentiated
    iPSC-derived neurons, comparing full-length ACTR10 with the construct region shown
    in zebrafish to retain mitochondrial binding while lacking the dynactin-binding
    region. Filter hits against a matched DCTN4 and ACTR1A bait set so that generic
    dynactin proximity is subtracted, then validate candidate outer-membrane partners by
    co-immunoprecipitation and by testing whether their depletion phenocopies the
    ACTR10-dependent retrograde mitochondrial defect in live-cell axonal transport
    imaging.
  experiment_type: Proximity labelling proteomics with separation-of-function constructs
- hypothesis: >-
    Human ACTR10 is not present in neutrophil granules or the extracellular space, and
    the Reactome-derived annotations reflect cytosolic carryover in granule fractions.
  description: >-
    Fractionate primary human neutrophils into azurophil, specific and gelatinase
    granules, secretory vesicles, cytosol and membrane, and immunoblot each fraction for
    ACTR10 alongside all other dynactin subunits and a panel of markers (myeloperoxidase
    for azurophil granules, ficolin-1 for specific granules, and a soluble cytosolic
    marker). Protease-protection of intact granules distinguishes lumenal residence from
    surface association. The prediction is that ACTR10 tracks quantitatively with the
    cytosolic marker and with the other dynactin subunits and is protease-accessible,
    which would settle the four removed localisation annotations experimentally.
  experiment_type: Subcellular fractionation with protease protection and immunoblotting
- hypothesis: >-
    Human ACTR10 caps the pointed end of human dynactin with a nucleotide bound, and the
    human structural evidence for both can be obtained at sufficient resolution.
  description: >-
    Extend the human dynactin cryo-EM work by focused refinement on the pointed end,
    using a pointed-end-directed adaptor or the Chlamydia Dre1 handle to improve
    orientation sampling, and push the ACTR10 chain past 3 A. This would convert the
    dynactin-complex annotation for human ACTR10 from IBA to IDA and would test directly
    whether the nucleotide density seen in pig Arp11 is present in the human protein,
    which is the one point on which the proposed ATP-binding annotation currently
    depends on the ortholog.
  experiment_type: Focused cryo-EM refinement of human dynactin's pointed end
