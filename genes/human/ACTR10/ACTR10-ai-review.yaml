id: Q9NZ32
gene_symbol: ACTR10
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  ACTR10 (ARP11, also called ACTR11/ARP10/hARP11) is the pointed-end subunit of
  dynactin, the ~1.2 MDa multiprotein activator of cytoplasmic dynein-1. It is a
  highly divergent member of the actin family: it retains the actin fold, and its
  nucleotide- and metal-binding site is occupied by ATP or ADP with Mg2+ in cryo-EM
  structures of the complex, but it has lost the subdomain-2
  surface loop that actin uses at its pointed-end face. As a result ACTR10 cannot
  polymerise or be polymerised past, and instead caps the pointed end of dynactin's
  actin-like ACTR1A/beta-actin minifilament, terminating the filament and setting the
  end of the complex. Docked onto that filament end, ACTR10 is also the platform on
  which the remaining pointed-end subunits DCTN4/p62, DCTN5/p25 and DCTN6/p27
  assemble, and it is required for the structural integrity of dynactin as a whole:
  cells depleted of ACTR10 lose essentially all assembled dynactin and show the
  dispersal of endosomes and the spindle defects expected of dynein-dynactin loss.
  The pointed end formed around ACTR10 is a cargo- and adaptor-facing surface. In
  vertebrate neurons ACTR10 couples mitochondria to the dynein-dynactin motor and is
  required for retrograde axonal transport of mitochondria and hence for normal
  mitochondrial distribution between soma and axon terminals; loss of the protein
  also produces the general dynein-dynactin phenotypes of disturbed melanosome
  distribution, photoreceptor degeneration and mislocalised myelin basic protein
  mRNA in oligodendrocytes. ACTR10 is ubiquitously expressed and acts throughout the
  cytoplasm, wherever dynactin activates dynein for minus-end-directed transport.
