      biology.
- id: PMID:32296183
  title: A reference map of the human binary protein interactome.
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      HuRI yeast two-hybrid interactome. Supplies two ACTR10 partners of very
      different value: DCTN4/p62, a true neighbour of ACTR10 in the dynactin
      pointed-end complex confirmed by cryo-EM and chemical cross-linking, and
      KRT31, a hair-cuticle keratin with no shared expression domain.
- id: PMID:10525537
  title: Analysis of dynactin subcomplexes reveals a novel actin-related protein associated
    with the arp1 minifilament pointed end.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The paper that discovered ARP11 as the fourth subunit of dynactin's pointed-end
      complex, in bovine brain dynactin, and cloned the vertebrate sequences. Its
      sequence-based predictions - actin fold with nucleotide and metal binding
      elements retained, barbed-end face conserved, actin residues 38-57 deleted,
      therefore capping rather than polymerisation - were all subsequently confirmed
      by cryo-EM and are reproduced independently in this review's alignment.
- id: PMID:12857853
  title: Interactions between the evolutionarily conserved, actin-related protein, Arp11,
    actin, and Arp1.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text available. Establishes by coprecipitation that recombinant Arp11 and
      Arp1 interact, and that cytosolic Arp11 is found exclusively in dynactin with no
      free pool. Its abstract also refutes a one-sided reading of itself, in the sentence
      immediately before the one commonly quoted: the authors tested Arp11 against
      conventional actin and found it could coassemble, so the paper does not show that
      Arp11 is incapable of engaging actin filaments - the "free cytosolic actin do not
      interact significantly" statement is about the absence of a free Arp11 pool in
      cells, not about binding capacity. The full text states it outright in the
      Discussion ("Arp11 can interact with both Arp1 and conventional actin"), but the
      abstract alone was sufficient to see it. It also floats
      an Arp2/3-like nucleation role for Arp11 as a hypothesis while arguing that Arp1
      does not require nucleation.
- id: PMID:16291862
  title: Arp10p is a pointed-end-associated component of yeast dynactin.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Establishes by genetics and biochemistry that S. cerevisiae Arp10p is the
      functional ARP11 homolog and associates with the Arp1p filament pointed end. It
      is the reason SGD:S000002513 on the GO:0005200 row counts as an ortholog rather
      than a generic actin, and it also states the family's pairing pattern
      (Arp1/Arp11 versus the nuclear Arp7/Arp9), which is the distinction the nucleus
      IBA crosses.
- id: PMID:22918948
  title: Dynactin's pointed-end complex is a cargo-targeting module.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Cross-linking and siRNA analysis of the pointed-end complex. Shows Arp11
      contacts p62 and p25 directly and that Arp11 (with p62) is required for
      dynactin to remain assembled at all. Work is in Cos7 (African green monkey)
      cells, so it is ortholog-level rather than human evidence.
- id: PMID:25814576
  title: The structure of the dynactin complex and its interaction with dynein.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Pig dynactin cryo-EM. Gives the mechanism of capping: Arp11 blocks subunit
      addition on one protofilament because its subdomain-2 loop is too short and
      sterically on the other, and is the only subunit that caps the pointed end.
- id: PMID:33734450
  title: Cryo-EM reveals the complex architecture of dynactin's shoulder region and
    pointed end.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Pig dynactin pointed-end structures at 3.8-4.5 A. Assigns p25 and p27 for the
      first time and shows the p62 saddle wrapping around Arp11, which is the
      structural content of the ACTR10-DCTN4 interaction row.
- id: PMID:36071160
  title: Structure of dynein-dynactin on microtubules shows tandem adaptor binding.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Source of the highest-resolution pointed-end model containing a nucleotide
      (PDB 7Z8M, 3.37 A). Its methods state explicitly that ATP-Mg was built into
      Arp11 on the basis of density while ADP-Mg was built into beta-actin and the
      Arp1 subunits - the strongest single statement that ACTR10's nucleotide site is
      occupied rather than vestigial. The claim is about pig Arp11, so it supports an
      ISS-level, not IDA-level, human annotation.
- id: PMID:40186871
  title: The Chlamydia effector Dre1 binds dynactin to reposition host organelles during
    infection.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      First cryo-EM structure of HUMAN dynactin, purified from human cell culture
      using a Chlamydia effector as affinity handle; human ACTR10 (Q9NZ32) is chain J
      of PDB 9B7J and 9B85, and AP-MS from HEK293T recovered all 11 dynactin
      subunits. This makes human ACTR10's dynactin-complex membership directly
      demonstrable, whereas GOA still records it only as IBA.
- id: PMID:28414272
  title: Regulation of mitochondria-dynactin interaction and mitochondrial retrograde
    transport in axons.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Zebrafish forward-genetic actr10 mutant; the experimental basis of the ZFIN
      annotation from which GO:0098958 was propagated to human. Shows a
      cargo-selective retrograde failure for mitochondria and traces it to loss of
      mitochondria-dynactin attachment, with a separation-of-function construct
      lacking the dynactin-binding domain that still binds mitochondria.
- id: PMID:33376159
  title: Retrograde Mitochondrial Transport Is Essential for Organelle Distribution and
    Health in Zebrafish Neurons.
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Follow-up on the same zebrafish actr10 allele showing the organelle-homeostasis
      consequence: mitochondria accumulate in axon terminals and are depleted from
      the soma. Corroborates rather than extends the transport role.
- id: PMID:29073112
  title: Dynein/dynactin is necessary for anterograde transport of Mbp mRNA in oligodendrocytes
    and for myelination in vivo.
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Independent zebrafish actr10 allele (stl83). Important as a control on the
      cargo-selectivity claim: this allele shows the generic dynein-dynactin
      loss-of-function phenotypes, so ACTR10 should not be read as a
      mitochondria-only subunit.
- id: PMID:42439233
  title: 'Actin-related and actin-like proteins: functional diversification of the actin-fold.'
  findings: []
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      2026 review of the human actin-fold family, cached as abstract only. Cited for the
      family-level framing that underpins two decisions here: that the dynactin Arps
      (Arp1, Arp11) form a cytoplasmic dynein-activating and cargo-adaptor branch
      distinct from the nuclear chromatin-remodelling Arps and from the testis-restricted
      actin-like proteins - which is exactly the boundary the nucleus IBA crosses - and
      that nucleotide binding is a defining property of the actin fold rather than an
      actin-specific one.
- id: PMID:39697424
  title: ACTR10 Overexpression Facilitates the Progression and Tyrosine Kinase Inhibitor
    Resistance in Hepatocellular Carcinoma.
  findings: []
  reference_review:
    relevance: LOW
    correctness: LOW_QUALITY
    review_notes: >-
      Entirely in-silico reanalysis of public expression, DepMap and co-expression
