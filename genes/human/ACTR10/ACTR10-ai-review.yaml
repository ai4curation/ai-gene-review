- term:
    id: GO:0098958
    label: retrograde axonal transport of mitochondrion
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: >-
      Propagated from a single but excellent source: zebrafish actr10 (Q7ZVU0), the
      true ortholog, whose annotation rests on a forward-genetic loss-of-function
      allele with an IMP. In actr10 mutants mitochondria, and specifically not the
      other cargoes assayed, accumulate at microtubule plus ends because they fail to
      attach to the dynein-dynactin complex; an Actr10 construct lacking the
      dynactin-binding domain still binds mitochondria, indicating ACTR10 is the
      coupling element rather than merely a structural subunit in this process.
      Follow-up work shows the homeostatic consequence, with mitochondria depleted
      from the soma and accumulated in axon terminals. Two caveats worth carrying
      forward: the zebrafish cross-reference is ambiguous, resolving to two unreviewed
      accessions of which only Q7ZVU0 is annotated; and a second actr10 allele shows
      the generic dynein-dynactin phenotypes (photoreceptor loss, aberrant melanosome
      distribution, mislocalised mbp mRNA), so ACTR10 is not a mitochondria-only
      subunit.
    action: ACCEPT
    reason: >-
      Sound ortholog-based propagation from a real loss-of-function experiment, and
      the best-characterised in-vivo role of the protein. It is retained as core
      because the zebrafish work identifies ACTR10 as the specific subunit mediating
      the mitochondria-dynactin link, not merely as a passenger in general dynactin
      function; the broader dynein-dynactin transport role is captured in
      core_functions.
