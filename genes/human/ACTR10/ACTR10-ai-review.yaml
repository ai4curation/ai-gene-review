- term:
    id: GO:0005856
    label: cytoskeleton
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  review:
    summary: >-
      Mapped from the UniProt subcellular-location keyword SL-0090, which in turn
      renders the line "Cytoplasm, cytoskeleton" - itself an ECO:0000250 by-similarity
      statement from pig I3LHK5. The location is not wrong, but GO:0005856 is a strict
      ancestor of GO:0005869 dynactin complex (confirmed from the QuickGO ancestor
      list for GO:0005869, which contains GO:0005856, GO:0015629 actin cytoskeleton
      and GO:0015630 microtubule cytoskeleton), and ACTR10 already carries the
      dynactin-complex term. The coarse parent therefore adds nothing.
    action: MODIFY
    reason: >-
      Redundant coarse ancestor of an annotation the gene already has. The informative
      statement is complex membership, which belongs in GO:0005869; keeping both makes
      the location look independently supported when it is the same fact stated less
      precisely. To be explicit about what the replacement means downstream: the gene
      already carries GO:0005869 as part_of by IBA, and the UniProt SubCell pipeline
      behind GO_REF:0000044 cannot emit a complex term from the keyword SL-0090, so this
      is in practice a drop-the-redundant-ancestor recommendation - the replacement
      collapses into the existing part_of row rather than creating a second, located_in
      one.
    proposed_replacement_terms:
    - id: GO:0005869
      label: dynactin complex
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
