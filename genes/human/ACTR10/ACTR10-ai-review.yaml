    significance: >-
      Without the partner, ACTR10's cargo-coupling role cannot be represented as a
      causal molecular activity: GO can record involvement in retrograde mitochondrial
      transport but not an adaptor or receptor activity, and it is impossible to say
      whether the activity is ACTR10's own or the pointed-end module's.
    resolution: >-
      Identify the mitochondrial outer-membrane partner - proximity labelling from
      endogenously tagged ACTR10 in neurons, subtracted against DCTN4 and ACTR1A
      baits, followed by loss-of-function phenocopy tests in live axonal-transport
      imaging.
