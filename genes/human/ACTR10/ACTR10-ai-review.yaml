- description: >-
    Cargo-coupling element of dynactin's pointed end for mitochondria. The
    ACTR10-containing pointed end is the cargo- and adaptor-facing surface of
    dynactin, and in vertebrate neurons ACTR10 is specifically required to attach
    mitochondria to the dynein-dynactin motor within axonal cytoplasm. Loss of the
    orthologous protein leaves anterograde transport and other cargoes unaffected but
    abolishes retrograde mitochondrial movement, so mitochondria accumulate at
    microtubule plus ends in axon terminals and are depleted from the cell body; a
    construct lacking the dynactin-binding region still binds mitochondria, placing the
    coupling activity in ACTR10 itself rather than in the complex as a whole. This is
    one instance of a more general role, since independent alleles of the same gene also
    produce the generic dynein-dynactin defects of melanosome mislocalisation,
    photoreceptor loss and mislocalised myelin basic protein mRNA.
