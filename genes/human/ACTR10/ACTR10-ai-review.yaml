existing_annotations:
- term:
    id: GO:0005634
    label: nucleus
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  review:
    summary: >-
      Every WITH/FROM source on this row is a nuclear actin-related protein from a
      different subfamily, not an ACTR10/ARP11 ortholog: budding yeast ARP9 (Q05123)
      and Candida ARP9 (Q5A9X7), which are subunits of the SWI/SNF and RSC
      chromatin-remodelling complexes; mouse ACTL7A (Q9QY84), a testis actin-like
      protein; and an unreviewed Trypanosoma brucei entry named only "Actin-like
      protein, putative". All four carry their own experimental nucleus annotations,
      so the source annotations are correct and it is the transfer that fails. The
      mechanism is visible in the WITH/FROM field itself: dynactin membership and
      mitochondrial transport were propagated from ARP11-specific nodes
      (PTN000232945, PTN000232947), whereas nucleus came from PTN008986520, a deeper
      node in PTHR11937 that groups ARP11 with the nuclear ARPs. ACTR10 is a subunit
      of a cytoplasmic 1.2 MDa complex with a single UniProt location, "Cytoplasm,
      cytoskeleton", and an independent check in Human Protein Atlas
      immunofluorescence puts 3/4 human nuclear ARPs but 0/3 human dynactin ARPs in a
      nuclear compartment.
    action: REMOVE
    reason: >-
      Paralog transfer across a subfamily boundary within the actin family, carrying
      the strong is_active_in qualifier. There is no evidence of any kind that human
      ACTR10 acts in the nucleus, and dynactin has no nuclear form. The sources are
      sound for themselves, so this is a propagation failure rather than a weak
      source.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - WRONG_ORTHOLOG_OR_PARALOG
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      source_entities:
      - source_id: CGD:CAL0000196900
        source_label: Candida albicans ARP9 (Q5A9X7, unreviewed/TrEMBL)
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Candida ARP9, a nuclear chromatin-remodelling actin-related protein.
          QuickGO reports IDA for nucleus on this entry, so the source annotation is
          experimental; the entry is unreviewed, so its protein name is not itself
          evidence.
      - source_id: MGI:MGI:1343051
        source_label: mouse Actl7a (Q9QY84, Swiss-Prot)
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Actin-like protein 7A, a testis-restricted actin-like protein with its own
          IDA/EXP nucleus annotations and an IDA for male germ cell nucleus. A
          distinct subfamily from ARP11 with no dynactin role.
      - source_id: PANTHER:PTN008986520
        source_label: PANTHER internal tree node
        source_status: NOT_RELEVANT
        comment: >-
          Not a protein but the ancestral node PAINT annotated. Notably a different
          and deeper node than the ARP11-specific nodes used for the dynactin-complex
          and mitochondrial-transport rows, which is where the over-propagation
          enters.
      - source_id: SGD:S000004636
        source_label: S. cerevisiae ARP9 (Q05123, Swiss-Prot)
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Arp9p is a subunit of the SWI/SNF (GO:0016514, IDA) and RSC (GO:0016586,
          IDA) chromatin-remodelling complexes, with nucleus IDA. A bona fide nuclear
          ARP and a paralog, not the ARP11 ortholog - the S. cerevisiae ARP11
          ortholog is ARP10/Q04549, which is used on the GO:0005200 row of this same
          gene.
      - source_id: UniProtKB:Q57ZL0
        source_label: Trypanosoma brucei "Actin-like protein, putative" (unreviewed/TrEMBL)
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: >-
          Unreviewed entry with no gene symbol and an automatic by-similarity name;
          QuickGO does report IDA for nucleus, so the annotation is experimental even
          though the protein is otherwise uncharacterised and not assignable to an
          ARP subfamily.
    supported_by:
    - reference_id: file:human/ACTR10/ACTR10-bioinformatics/RESULTS.md
      supporting_text: '- protein sources: 4; with own experimental evidence for this
        term: 4; with a reviewed (Swiss-Prot) record: 2'
    - reference_id: file:human/ACTR10/ACTR10-bioinformatics/RESULTS.md
      supporting_text: 'Q05123 (Swiss-Prot) Saccharomyces cerevisiae (strain ATCC 204508
        / S288c) ARP9 :: Actin-like protein ARP9'
    - reference_id: file:human/ACTR10/ACTR10-bioinformatics/RESULTS.md
      supporting_text: '- dynactin clade: 0/3 genes with a nuclear compartment in their
        HPA location list (ACTR10:non-nuclear, ACTR1A:non-nuclear, ACTR1B:non-nuclear)'
    - reference_id: PMID:16291862
      supporting_text: consistent with the general pattern of paired Arps engaged in related
        functions (Arp2/Arp3 and Arp7/Arp9)
    - reference_id: PMID:42439233
      supporting_text: In the nucleus, multiple Arps, actin, and actin-like proteins are
        incorporated into large ATP-dependent chromatin-remodelling and histone-modifying
        complexes
    - reference_id: PMID:42439233
      supporting_text: many of which exhibit tissue-specific expression, particularly in
        the testis, and are associated with spermiogenesis and male fertility
    - reference_id: file:human/ACTR10/ACTR10-uniprot.txt
      supporting_text: 'SUBCELLULAR LOCATION: Cytoplasm, cytoskeleton'
- term:
    id: GO:0005869
    label: dynactin complex
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: part_of
  review:
    summary: >-
      Correct and central. All three protein sources on this row are genuine ACTR10
      orthologs - mouse Actr10 (Q9QZB7, which carries its own IDA for this term),
      pig ACTR10 (I3LHK5, the accession behind the pig dynactin cryo-EM series) and
      C. elegans arp-11 (Q9GYR2, unreviewed but with its own IDA) - and the node used
      (PTN000232945) is ARP11-specific. Human evidence is now stronger than the
      annotation records: human dynactin was purified from human cell culture and
      solved by cryo-EM in 2025, with human ACTR10 (Q9NZ32) modelled as chain J of
      PDB 9B7J and 9B85, and AP-MS from HEK293T recovering all 11 dynactin subunits.
      UniProt lists ACTR10 among the four pointed-end subunits and ComplexPortal
      records it in CPX-26352.
    action: ACCEPT
    reason: >-
      Core. Ortholog-based propagation from sources that carry their own experimental
      complex-membership annotations, and now independently demonstrable in the human
      protein by cryo-EM of human dynactin. The one thing worth changing is the
      evidence code, not the term: an IDA from PMID:40186871 is available and would
      bring human ACTR10 into line with mouse Actr10, which already has the IDA.
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: MGI:MGI:1891654
        source_label: mouse Actr10 (Q9QZB7, Swiss-Prot; cross-reference also maps to
          2 TrEMBL entries)
        source_status: SUPPORTS_TRANSFER
        comment: >-
          True ortholog with its own IDA for dynactin complex from PMID:10525537. The
          MGI cross-reference is ambiguous, resolving to three accessions (Q9QZB7 plus
          TrEMBL A0A1Y7VL71 and A0A1Y7VM21); only the Swiss-Prot entry carries
          annotations.
      - source_id: PANTHER:PTN000232945
        source_label: PANTHER internal tree node
        source_status: NOT_RELEVANT
        comment: >-
          Tree node rather than a protein. Worth recording that this ARP11-specific
          node, and not the deeper node used for the nucleus row, is the correct level
          for ARP11 propagation.
      - source_id: UniProtKB:I3LHK5
        source_label: pig ACTR10 / Arp10 (Swiss-Prot)
        source_status: SUPPORTS_TRANSFER
        comment: >-
          True ortholog and the subject of the pig dynactin cryo-EM series (chain J
          in 22 PDB entries). It is also the ECO:0000250 source for UniProt's human
          FUNCTION and SUBUNIT lines.
      - source_id: WB:WBGene00016793
        source_label: C. elegans arp-11 (Q9GYR2, unreviewed/TrEMBL)
        source_status: SUPPORTS_TRANSFER
        comment: >-
          True ortholog with its own IDA for this term. No reviewed UniProt entry
          exists and the accession is not indexed under xref:wormbase-*, so it was
          resolved by identifier search; an unreviewed entry is weaker support and its
          name is an automatic label, but the curated annotation on it is real.
    supported_by:
    - reference_id: file:human/ACTR10/ACTR10-uniprot.txt
      supporting_text: 'subunits: ACTR10, DCNT4, DCTN5 and DCTN6.'
    - reference_id: PMID:40186871
      supporting_text: By exploiting Dre1 as an affinity reagent, we purified dynactin
        from human cell culture and solved the first cryo-EM structure of human dynactin.
    - reference_id: PMID:40186871
      supporting_text: all 11 subunits of the host dynactin complex
    - reference_id: PMID:10525537
      supporting_text: The p62 and p27 subunits are associated with two previously undetected
        dynactin subunits, p25 and a novel actin-related protein, Arp11, in dynactin
    - reference_id: file:human/ACTR10/ACTR10-bioinformatics/RESULTS.md
      supporting_text: '- protein sources: 3; with own experimental evidence for this
        term: 3; with a reviewed (Swiss-Prot) record: 2'
- term:
    id: GO:0005200
    label: structural constituent of cytoskeleton
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: >-
      This is the fold-propagation row and it needed testing in both directions. The
      source set is mixed: seven of the ten protein sources are polymerising actins
      or Arp2/3 subunits (mouse and rat ACTG1, yeast ACT1, two Dictyostelium actins,
      human ACTR2 and ACTR3), but three are dynactin-relevant - yeast ARP1/centractin
      (P38696), which builds the dynactin filament, and crucially yeast ARP10
      (Q04549), the true S. cerevisiae ARP11 ortholog. All ten carry their own
      experimental evidence for the term and all ten are Swiss-Prot. The term itself
      is well scoped for ACTR10 by GO's own classification, since GO:0005869 dynactin
      complex is a descendant of GO:0015629 actin cytoskeleton; and it is
      substantively true, because ACTR10 caps and terminates dynactin's actin-like
      minifilament and is required for the complex to stay assembled at all. What
      does NOT transfer from the conventional-actin sources is polymerisation. ACTR10
      lacks the subdomain-2 loop (20/20 of actin residues 38-57 align to a gap), it binds
      Arp1 by coprecipitation, and in cells it is found exclusively in dynactin with no
      free pool. The boundary needs stating carefully rather than overstated: Arp11 was
      tested against conventional actin and could coassemble with it in vitro, and an
      Arp2/3-like nucleation role was raised by those authors as a hypothesis - but it
      was never demonstrated, and they argue Arp1 needs no nucleator, having a critical
      concentration below 1 nM and assembling without a lag. So no actin-polymerisation
