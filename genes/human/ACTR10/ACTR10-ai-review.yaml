- id: PMID:23650620
  title: 'Proteome profiling of human neutrophil granule subsets, secretory vesicles,
    and cell membrane: correlation with transcriptome profiling of neutrophil precursors.'
  findings: []
  full_text_unavailable: true
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Bulk proteomics of neutrophil granule fractions, cited by Reactome's Neutrophil
