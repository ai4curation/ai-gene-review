  - gap_statement: >-
      No aspect of ACTR10's mitochondrial cargo-coupling function has been assayed in
      a human system; the evidence is entirely zebrafish genetics plus shRNA in
      cultured rodent neurons.
    boundary: >-
      Human ACTR10 is firmly established as a dynactin subunit - it is chain J of the
      2025 cryo-EM structure of dynactin purified from human cells - and the protein
      is 96% identical to the pig ortholog used for all the structural work. The gap
      is not about complex membership but about whether the cargo-selective
      mitochondrial phenotype is conserved in human cells.
