  - gap_statement: >-
      The molecular link between ACTR10 and the mitochondrial outer membrane is
      unidentified: no ACTR10-binding protein or lipid on mitochondria has been
      reported, so it is unknown whether ACTR10 contacts the organelle directly or
      through an intermediate adaptor.
    boundary: >-
      That the linkage exists and requires ACTR10 is not in doubt: in actr10 mutant
      zebrafish neurons mitochondria specifically fail to attach to the
      dynein-dynactin complex while other cargoes move normally, and an Actr10
      construct lacking the dynactin-binding domain still binds mitochondria, so a
      mitochondria-facing surface on ACTR10 itself is implied. What is missing is the
      partner on the other side of that surface.
