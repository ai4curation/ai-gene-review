          loss-of-function allele. The UniProt entry is unreviewed, so its protein
          name carries no weight, but the curated IMP does. The second hit
          (A0A8N7UZZ7) carries no annotations.
      - source_id: PANTHER:PTN000232947
        source_label: PANTHER internal tree node
        source_status: NOT_RELEVANT
        comment: ARP11-specific tree node rather than a protein.
    supported_by:
