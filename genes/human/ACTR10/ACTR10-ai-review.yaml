- id: PMID:25416956
  title: A proteome-scale map of the human interactome network.
  findings: []
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      HI-II-14 yeast two-hybrid interactome. Supplies the single ACTR10-NAGK
