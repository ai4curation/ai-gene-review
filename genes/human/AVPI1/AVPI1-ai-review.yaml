- term:
    id: GO:0043410
    label: positive regulation of MAPK cascade
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:1916784
  - PANTHER:PTN002682860
  review:
    summary: 'Positive regulation of MAPK cascade (IBA). The only experimental source in the family is
      MGI''s IDA on mouse Avpi1, from the founding VIT32 paper. In its full text, all MAPK-cascade data
      come from Xenopus oocytes injected with mouse VIT32 cRNA: ERK2 phosphorylation at 12 h, MEK1 dependence
      shown with U0126, and MPF activation. The authors state that the cascade still has to be tested
      in kidney cells. UniProt therefore annotates human AVPI1 MAPK activation only as ''may be involved''
      (ECO:0000250). The transfer is phylogenetically reasonable within this small vertebrate family.
      The underlying observation, however, is a heterologous overexpression phenotype with no endogenous
      or human data. Kept as non-core.'
    action: KEEP_AS_NON_CORE
    reason: '[PMID:12356727 "The Xenopus oocyte expression system revealed two functions: (i) when injected
      alone, VIT32 cRNA rapidly induces oocyte meiotic maturation through the activation of the maturation
      promoting factor, the amphibian homolog of the universal M phase trigger Cdc2/cyclin; and (ii) when
      co-injected with the ENaC, VIT32 cRNA selectively downregulates channel activity, but not channel
      cell surface expression."] [PMID:12356727 "As shown in Figure 6 A, progesterone induces a time-dependent
      increase in the phosphorylation of ERK2 (lanes 4–6). mVIT32 had a similar effect at 12 h (lane 9),
      but not at 6 h (lane 8)."] [PMID:12356727 "It is now important to test this novel regulatory cascade
      in kidney cells experimentally, either in vitro or in vivo ."] [file:human/AVPI1/AVPI1-uniprot.txt
      "CC   -!- FUNCTION: May be involved in MAP kinase activation, epithelial sodium"]'
    supported_by:
    - reference_id: PMID:12356727
      supporting_text: 'The Xenopus oocyte expression system revealed two functions: (i) when injected
        alone, VIT32 cRNA rapidly induces oocyte meiotic maturation through the activation of the maturation
        promoting factor, the amphibian homolog of the universal M phase trigger Cdc2/cyclin; and (ii)
        when co-injected with the ENaC, VIT32 cRNA selectively downregulates channel activity, but not
        channel cell surface expression.'
    - reference_id: PMID:12356727
      supporting_text: As shown in Figure 6 A, progesterone induces a time-dependent increase in the phosphorylation
        of ERK2 (lanes 4–6). mVIT32 had a similar effect at 12 h (lane 9), but not at 6 h (lane 8).
    - reference_id: PMID:12356727
      supporting_text: 'Our data provide evidence for two functions that might be related: (i) the activation
        of the MAP kinase cascade; and (ii) the downregulation of ENaC activity.'
    - reference_id: PMID:12356727
      supporting_text: It is now important to test this novel regulatory cascade in kidney cells experimentally,
        either in vitro or in vivo .
    - reference_id: file:human/AVPI1/AVPI1-uniprot.txt
      supporting_text: 'CC   -!- FUNCTION: May be involved in MAP kinase activation, epithelial sodium'
