id: Q5T686
gene_symbol: AVPI1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: AVPI1 (arginine vasopressin-induced protein 1; VIT32/VIP32) is a small (147-residue) protein
  with no recognizable domains, first identified as a vasopressin-induced transcript in renal collecting-duct
  principal cells. When its cRNA is injected into Xenopus oocytes, it triggers meiotic maturation through
  activation of maturation-promoting factor (the paper's title reports MAP kinase activation). Co-injected
  with the epithelial sodium channel (ENaC), it reduces channel activity without lowering surface expression.
  Its endogenous function in human cells is unknown. HPA antibody staining places it in the nucleoplasm
  and at the plasma membrane, and large-scale binary screens recover many coiled-coil partners such as
  MDFI and keratin-associated proteins.
