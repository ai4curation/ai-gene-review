knowledge_gaps:
- gap_statement: The molecular and physiological function of AVPI1 is unknown. Its only functional data
    are heterologous overexpression phenotypes in Xenopus oocytes.
  boundary: 'Established: AVPI1 is vasopressin-induced in collecting-duct cells. Its cRNA triggers oocyte
    maturation via MPF and inhibits co-expressed ENaC activity (PMID:12356727). HPA staining is nucleoplasm
    and plasma membrane. Not established: any endogenous function, molecular activity or binding partner
    relevant to MAPK signalling or ENaC regulation in mammalian cells, or a loss-of-function phenotype.'
