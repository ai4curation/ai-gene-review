knowledge_gaps:
- gap_statement: >-
    The molecular activity and endogenous interaction partners of human LRIT2 are
    unknown.
  gap_kind:
  - BIOLOGY
  dark_aspect: WHOLLY_DARK
  status: OPEN
  significance: >-
    A direct molecular activity is needed before LRIT2 can be assigned a core function
    rather than only membrane topology.
  resolution: >-
    Identify endogenous LRIT2 partners in human retinal cells by affinity purification
    and proximity labeling, then validate direct binding and functional consequences
    with purified ectodomains and loss-of-function rescue.
- gap_statement: >-
    The cell types, subcellular sites, and physiological role of endogenous human
    LRIT2 in the eye have not been established.
  gap_kind:
  - BIOLOGY
  dark_aspect: WHOLLY_DARK
  status: OPEN
  significance: >-
    Retinal cDNA provenance and cross-species eye phenotypes do not identify a human
    retinal process or distinguish developmental from synaptic roles.
  resolution: >-
    Map endogenous LRIT2 RNA and protein in human donor retina and retinal organoids,
    then perturb LRIT2 in matched photoreceptor and bipolar-cell systems and measure
    development, connectivity, and visual-signaling outputs.
  provenance:
  - reference_id: PMID:31934309
    supporting_text: corresponding to mouse candidate genes Adal, Ankrd33, Car14, Ccdc126, Dkk3, Fam169a, Grifin, Kcnj14, Lrit2, Ppef2, and Ppm1n, were found to exhibit reduced eye size phenotype
    reference_section_type: RESULTS
- gap_statement: >-
    Whether LRIT2 associates with LRIT1 endogenously, and whether that association has
    a conserved retinal consequence, remains unresolved.
  gap_kind:
  - BIOLOGY
  dark_aspect: WHOLLY_DARK
  status: OPEN
  significance: >-
    The curated association is transferred from mouse and does not establish a stable
    human heterodimer, an interaction interface, or shared LRIT1 synaptic biology.
  resolution: >-
    Test endogenous LRIT1-LRIT2 proximity and stoichiometry in retinal cell types,
    followed by single and double perturbations that distinguish shared, redundant,
    and opposing phenotypes.
- gap_statement: >-
    The expression, localization, and partner specificity of LRIT2 isoforms 1 and 2
    have not been compared.
  boundary: >-
    An OpenScientist run (kgap-lrit2-isoform-domains) refutes the premise that the two
    isoforms differ in domain content, and flags the isoform annotation itself as
    unreliable. Isoform 2 is the canonical sequence carrying a single 10-residue in-frame
    insertion, GLLGGKHLTP after Asp297, with 100 per cent identity over the canonical
    length and no substitutions; the local A6NDA9 record states exactly this as VAR_SEQ
    297, D to DGLLGGKHLTP. Every annotated feature is present in both and simply shifts
    by ten residues downstream of the insertion: signal peptide 1-19, LRRNT 23-54, the
    four leucine-rich repeats, LRRCT 200-252, the immunoglobulin-like domain 253-341, the
    274-327 disulfide, N-glycosylation at Asn52, fibronectin type-III 361-451 and the
    transmembrane helix 466-486, all confirmed in the local record. Both isoforms are
    predicted single-pass type I membrane proteins, neither is secreted, and there is no
    alternative start, internal exon replacement or truncation. The insertion arises from
    a 30-nucleotide symmetric cassette exon absent from the MANE Select transcript, and
    five independent lines say it should not carry functional weight: no vertebrate
    sequence constraint, no primate-specific constraint, no human population constraint,
    zero median expression of its transcript across all 54 GTEx tissues, and a sole cDNA
    from a library pooled across non-retinal tissues while the single adult retina cDNA
    skips the exon. The run's own framing is the careful one, a splice-competent cryptic
    or low-frequency alternative exon rather than a sequencing error or a functional
    isoform. Mapped onto the predicted structure the insertion point sits mid-strand in
    an Ig-domain beta hairpin two strands from the structural disulfide, and the inserted
    glycine-proline-rich sequence cannot continue a strand, so the prediction is local
    destabilisation of the Ig fold rather than loss of an exposed partner-binding loop.
    This leaves the stated gap largely dissolved rather than answered: there is no
    domain-content difference to compare, and the significance note above, that isoform 2
    alters the immunoglobulin-like domain, is right about the location but should not be
    read as altered domain composition. Three limits are recorded. Nothing here is
    experimental; no LRIT2 isoform has been assayed and no quantitative retinal isoform
    ratio exists, GTEx containing no retina, so the expression result bounds non-retinal
    tissue only. Isoform 2 was never folded, the structure-prediction service failing on
    every attempt, so the destabilisation claim is inference from the isoform 1 model.
    And the run records a self-correction, a splice-site percentile reported mid-run that
    did not replicate against independent background sets and was revised downward.
  gap_kind:
  - BIOLOGY
  dark_aspect: WHOLLY_DARK
  status: NARROWING
  provenance:
  - reference_id: file:human/LRIT2/LRIT2-hypotheses/kgap-lrit2-isoform-domains/openscientist.md
    supporting_text: >-
      The two annotated isoforms of A6NDA9 do not differ in domain content.
  significance: >-
    Isoform 2 alters the immunoglobulin-like domain, so sequence-level variation may
    affect ectodomain folding or partner recognition, but no functional specialization
    has been demonstrated.
  resolution: >-
    Use long-read retinal transcriptomics, isoform-specific proteomics, cell-surface
    trafficking assays, and quantitative partner-binding measurements for both
    endogenous isoforms.
