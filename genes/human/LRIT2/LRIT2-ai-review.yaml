suggested_questions:
- question: >-
    What extracellular ligand or membrane partner binds human LRIT2, and does LRIT2
    alter that partner's localization or signaling?
  experts:
  - Retinal membrane-protein experts
  - Cell-surface interaction experts
- question: >-
    Which human retinal cell types express LRIT2 protein, and at which membrane
    compartment is it enriched?
  experts:
  - Human retinal atlas experts
  - Ocular cell biologists
- question: >-
    Is an endogenous LRIT1-LRIT2 complex present, and is it required for either
    protein's trafficking or retinal function?
  experts:
  - Photoreceptor synapse experts
  - Quantitative interaction biologists
- question: >-
    Does the isoform-2 replacement/extension within the immunoglobulin-like domain
    change LRIT2 folding, surface delivery, or partner specificity?
  experts:
  - Protein-folding experts
  - Isoform biology experts
suggested_experiments:
- hypothesis: >-
    LRIT2 has an endogenous extracellular binding partner in human retinal cells.
  description: >-
    Introduce an endogenous extracellular tag into LRIT2 in human retinal organoids,
    perform cell-surface proximity labeling and affinity purification, and validate
    candidate partners by reciprocal co-immunoprecipitation and purified-ectodomain
    binding assays.
  experiment_type: endogenous interaction proteomics
- hypothesis: >-
    LRIT2 contributes to a discrete developmental or signaling phenotype in the human
    retina.
  description: >-
    Generate isogenic LRIT2-null and rescue retinal organoids, profile cell-type
    composition and synaptic connectivity, and assay photoreceptor-to-bipolar signaling
    without assuming the zebrafish small-eye phenotype transfers directly.
  experiment_type: human retinal organoid genetics
- hypothesis: >-
    LRIT1 and LRIT2 form a context-dependent retinal complex but have nonredundant
    physiological outputs.
  description: >-
    Compare LRIT1, LRIT2, and double knockouts with endogenous interaction imaging and
    matched rescue in retinal cells, quantifying trafficking, synapse organization,
    and light-response phenotypes.
  experiment_type: genetic interaction and cell biology
- hypothesis: >-
    The isoform-2 immunoglobulin-domain replacement/extension changes surface delivery
    or partner recognition.
  description: >-
    Quantify isoform-specific expression in human retina, then compare purified
    ectodomain folding, cell-surface abundance, interaction spectra, and rescue of any
    LRIT2-null phenotype for isoforms 1 and 2.
  experiment_type: isoform-resolved structure-function analysis
