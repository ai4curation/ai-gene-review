  review:
    summary: >-
      This electronic annotation maps the reviewed UniProt subcellular-location
      statement "Membrane; Single-pass type I membrane protein" to the broad GO
      membrane term. The topology is consistent with LRIT2's predicted N-terminal
      signal peptide and transmembrane helix at residues 466-486.
    action: KEEP_AS_NON_CORE
    reason: >-
      Membrane is an appropriately conservative location for this type I single-pass
      protein. The evidence does not identify a specific cellular membrane, so the
      annotation should be retained as written rather than narrowed to plasma membrane
      or another compartment. It is kept outside a core function because it is an
      inferred broad topology statement and no molecular activity or physiological
      process has been established for human LRIT2.
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
      - source_id: UniProtKB-SubCell:SL-0162
        source_label: UniProt subcellular location - Membrane
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: >-
          The controlled-vocabulary source exactly matches the GOA WITH/FROM field and
          is consistent with UniProt's single-pass type I topology, but no direct human
          LRIT2 localization experiment is cited.
