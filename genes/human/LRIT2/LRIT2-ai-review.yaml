gene_symbol: LRIT2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  LRIT2 is a type-I single-pass membrane glycoprotein with an extracellular
  leucine-rich-repeat region, an immunoglobulin-like domain, and a fibronectin
  type-III domain followed by a short cytoplasmic tail. Human cDNA evidence supports
  two splice isoforms; isoform 2 replaces canonical Asp297 with an eleven-residue
  sequence, producing a net ten-residue extension within the immunoglobulin-like
  domain. A human isoform-1 clone was
  obtained from retina, and expression resources describe retinal enrichment, but the
  endogenous human protein's cellular localization and physiological role have not
  been established. Curated orthology evidence suggests association with LRIT1, while
  zebrafish ortholog knockdown produced reduced eye size. These findings connect LRIT2
  to ocular biology without yet defining a conserved molecular activity or a normal
  human retinal function.
