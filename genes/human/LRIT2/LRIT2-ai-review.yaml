        source_status: SOURCE_WEAK_OR_INFERRED
        comment: >-
          The controlled-vocabulary source exactly matches the GOA WITH/FROM field and
          is consistent with UniProt's single-pass type I topology, but no direct human
          LRIT2 localization experiment is cited.
references:
- id: file:human/LRIT2/LRIT2-hypotheses/kgap-lrit2-isoform-domains/openscientist.md
  title: OpenScientist analysis of LRIT2 isoform domain content and cassette-exon constraint
  findings:
  - statement: >-
      The two LRIT2 isoforms are identical in domain content, differing only by a 10-residue
      in-frame insertion inside the Ig-like domain, and the cassette exon that creates it shows
      no constraint at any timescale, no expression and only non-retinal clone support.
    supporting_text: >-
      the accurate description is a splice-competent cryptic or low-frequency alternative exon,
      which is a weaker claim than sequencing error and a much weaker claim than functional
      isoform
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: >-
      The 550-residue canonical length, the VAR_SEQ 297 D-to-DGLLGGKHLTP insertion and every
      annotated feature boundary quoted by the run were confirmed in the local A6NDA9 record,
      which also shows the isoform rests on an author statement from a cDNA paper
      (ECO:0000303), consistent with the run's clone-provenance argument. The conservation
      scores, the gnomAD and GTEx analyses, the exon coordinates and the structural mapping were
      not independently checked. The run states that it could not fold isoform 2 because the
      prediction service failed, and records one of its own mid-run figures as revised downward
      after it failed to replicate.
