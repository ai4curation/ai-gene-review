core_functions: []
knowledge_gaps:
- gap_statement: >-
    The molecular activity and endogenous interaction partners of human LRIT2 are
    unknown.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: >-
    A direct molecular activity is needed before LRIT2 can be assigned a core function
    rather than only membrane topology.
  resolution: >-
    Identify endogenous LRIT2 partners in human retinal cells by affinity purification
    and proximity labeling, then validate direct binding and functional consequences
    with purified ectodomains and loss-of-function rescue.
- gap_statement: >-
    The cell types, subcellular sites, and physiological role of endogenous human
    LRIT2 in the eye have not been established.
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  status: OPEN
  significance: >-
    Retinal cDNA provenance and cross-species eye phenotypes do not identify a human
    retinal process or distinguish developmental from synaptic roles.
  resolution: >-
    Map endogenous LRIT2 RNA and protein in human donor retina and retinal organoids,
    then perturb LRIT2 in matched photoreceptor and bipolar-cell systems and measure
    development, connectivity, and visual-signaling outputs.
  provenance:
  - reference_id: PMID:31934309
    supporting_text: corresponding to mouse candidate genes Adal, Ankrd33, Car14, Ccdc126, Dkk3, Fam169a, Grifin, Kcnj14, Lrit2, Ppef2, and Ppm1n, were found to exhibit reduced eye size phenotype
    reference_section_type: RESULTS
- gap_statement: >-
    Whether LRIT2 associates with LRIT1 endogenously, and whether that association has
    a conserved retinal consequence, remains unresolved.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    The curated association is transferred from mouse and does not establish a stable
    human heterodimer, an interaction interface, or shared LRIT1 synaptic biology.
  resolution: >-
    Test endogenous LRIT1-LRIT2 proximity and stoichiometry in retinal cell types,
    followed by single and double perturbations that distinguish shared, redundant,
    and opposing phenotypes.
- gap_statement: >-
    The expression, localization, and partner specificity of LRIT2 isoforms 1 and 2
    have not been compared.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    Isoform 2 alters the immunoglobulin-like domain, so sequence-level variation may
    affect ectodomain folding or partner recognition, but no functional specialization
    has been demonstrated.
  resolution: >-
    Use long-read retinal transcriptomics, isoform-specific proteomics, cell-surface
    trafficking assays, and quantitative partner-binding measurements for both
    endogenous isoforms.
