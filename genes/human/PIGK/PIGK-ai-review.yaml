references:
- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO
    terms
  findings:
  - statement: >-
      Two different InterPro signatures drive the GO_REF:0000002 IEA annotations of PIGK. The
      dedicated GPI_transamidase signature (IPR028361) supplies GPI-anchor transamidase
      activity (GO:0003923), the specific and correct call. The generic peptidase C13
      (legumain-like) fold signature (IPR001096) separately supplies peptidase activity
      (GO:0008233) and proteolysis (GO:0006508); these are fold-derived generalizations of the
      transamidation chemistry rather than descriptions of what PIGK does.
- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  findings:
  - statement: >-
      PAINT phylogenetic inference places PIGK in the GPI8/Gpi8p clade of catalytic GPI
      transamidase subunits, supporting the IBA annotations to GPI-anchor transamidase
      activity (GO:0003923), GPI-anchor transamidase complex (GO:0042765) and attachment of
      GPI anchor to protein (GO:0016255).
- id: GO_REF:0000041
  title: Gene Ontology annotation based on UniPathway vocabulary mapping
  findings:
  - statement: >-
      UniPathway vocabulary mapping supplies the IEA annotation of PIGK to GPI anchor
      biosynthetic process (GO:0006506), a related, broader process term covering the pathway
      that culminates in the specific transamidation step (GO:0016255) that PIGK actually
      catalyzes. Note that GO:0006506 is not an is_a/part_of ancestor of GO:0016255 in the
      current ontology.
- id: GO_REF:0000044
  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot Subcellular Location
    vocabulary mapping, accompanied by conservative changes to GO terms applied by
    UniProt
  findings:
  - statement: >-
      UniProt subcellular-location keyword mapping supplies the IEA annotation of PIGK to
      endoplasmic reticulum membrane (GO:0005789), consistent with the experimental EXP
      evidence from PMID:11483512 and the single-pass type I membrane topology in the
      UniProt entry.
- id: GO_REF:0000120
  title: Combined Automated Annotation using Multiple IEA Methods
  findings:
  - statement: >-
      Combined automated IEA pipelines supply the annotations of PIGK to attachment of GPI
      anchor to protein (GO:0016255) and GPI-anchor transamidase complex (GO:0042765), both
      redundant with extensive direct IDA evidence for this gene.
- id: PMID:10793132
  title: Gaa1p and gpi8p are components of a glycosylphosphatidylinositol (GPI) transamidase
    that mediates attachment of GPI to proteins.
  full_text_unavailable: true
  findings:
  - statement: >-
      Conserved cysteine and histidine residues of Gpi8p/PIGK, characteristic of the cysteine
      protease family, are essential for forming the carbonyl intermediate, identifying PIGK
      as the catalytic component that cleaves the GPI attachment signal peptide.
    supporting_text: >-
      We also show that cysteine and histidine residues of Gpi8p, which are conserved in
      members of a cysteine protease family, are essential for generation of a carbonyl
      intermediate. This result suggests that Gpi8p is a catalytic component that cleaves the
      GPI attachment signal peptide.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: >-
      Gaa1p and Gpi8p associate with one another and together constitute a GPI transamidase,
      the basis for the PIGK-GPAA1 protein-binding and complex-membership annotations.
    supporting_text: >-
      Moreover, Gaa1p and Gpi8p are associated with each other. Therefore, Gaa1p and Gpi8p
      constitute a GPI transamidase and cooperate in generating a carbonyl intermediate, a
      prerequisite for GPI attachment.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: >-
      The reaction PIGK carries out replaces a C-terminal GPI attachment signal peptide with
      a preassembled GPI in the ER, proceeding through a carbonyl intermediate.
    supporting_text: >-
      The GPI attachment signal peptide is replaced by a preassembled GPI in the endoplasmic
      reticulum by a transamidation reaction through the formation of a carbonyl intermediate.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Foundational paper identifying GPI8/PIGK as the catalytic component of the GPI
      transamidase and its association with GAA1. Source of the IMP transamidase-activity
      and complex-membership annotations. Cached record is abstract-only.
- id: PMID:11483512
  title: PIG-S and PIG-T, essential for GPI anchor attachment to proteins, form a
    complex with GAA1 and GPI8.
  full_text_unavailable: true
  findings:
  - statement: >-
      PIG-S and PIG-T form a complex with GAA1 and GPI8/PIGK, extending the transamidase to
      four known subunits and grounding the GPI-anchor transamidase complex (GO:0042765)
      annotation.
    supporting_text: >-
      We also demonstrate that PIG-S and PIG-T form a protein complex with GAA1 and GPI8, and
      that PIG-T maintains the complex by stabilizing the expression of GAA1 and GPI8.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: >-
      The GPI transamidase acts in the endoplasmic reticulum, replacing a protein's
      C-terminal GPI attachment signal peptide with a pre-assembled GPI - the experimental
      basis for the EXP ER-membrane localization of PIGK.
    supporting_text: >-
      The GPI transamidase mediates GPI anchoring in the endoplasmic reticulum, by replacing
      a protein's C-terminal GPI attachment signal peptide with a pre-assembled GPI.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: >-
      Knockout of PIG-S or PIG-T impairs transfer of GPI to proteins, particularly formation
      of the carbonyl intermediate, showing that the PIGK catalytic step depends on the
      intact complex.
    supporting_text: >-
      PIG-S and PIG-T knockout cells were defective in transfer of GPI to proteins,
      particularly in formation of the carbonyl intermediates.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Defines PIG-S and PIG-T as transamidase subunits complexed with GAA1 and GPI8/PIGK,
      and localizes the enzyme to the ER. Cached record is abstract-only.
- id: PMID:12582175
  title: Two subunits of glycosylphosphatidylinositol transamidase, GPI8 and PIG-T,
    form a functionally important intermolecular disulfide bridge.
  full_text_unavailable: true
  findings:
  - statement: >-
      PIGK (GPI8) and PIG-T form an intermolecular disulfide bond between conserved cysteines
      that is required for full transamidase activity, a specific structural interaction
      within the complex rather than a generic protein-binding observation.
    supporting_text: >-
      Here we report that two subunits of mammalian GPI transamidase, GPI8 and PIG-T, form a
      functionally important disulfide bond between conserved cysteine residues.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: >-
      Cysteine-to-serine mutants of GPI8 or PIG-T fail to fully restore GPI-anchored protein
      surface expression and have markedly reduced in vitro transamidase activity, so the
      bond is required for full but not minimal activity.
    supporting_text: >-
      Microsomal membranes of these transfectants had markedly decreased activities in an in
      vitro transamidase assay. The formation of this disulfide bond is not essential but
      required for full transamidase activity.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: >-
      A catalytically inactive human transamidase complex containing non-functional GPI8
      co-purifies with proform substrate proteins, showing the five-subunit complex is
      sufficient to bind substrate independently of catalysis by PIGK.
    supporting_text: >-
      We also demonstrate that an inactive human GPI transamidase complex that consists of
      non-functional GPI8 and four other components was co-purified with the proform of
      substrate proteins, indicating that these five components are sufficient to hold the
      substrate proteins.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Establishes the PIGK-PIGT intermolecular disulfide required for full transamidase
      activity, and shows substrate binding is a complex-level property. Cached record is
      abstract-only.
- id: PMID:12802054
  title: Human PIG-U and yeast Cdc91p are the fifth subunit of GPI transamidase that
    attaches GPI-anchors to proteins.
  full_text_unavailable: true
  findings:
  - statement: >-
      PIG-U was identified as the fifth subunit by affinity purification of the transamidase
      complex through epitope-tagged GPI8/PIGK, direct evidence for the composition of the
      PIGK-containing complex.
    supporting_text: >-
      The GPI transamidase complex affinity-purified from cells expressing
      epitope-tagged-GPI8 contained PIG-U and four other known components.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: >-
      Cells lacking PIG-U still assemble the other four subunits but cannot cleave the GPI
      attachment signal peptide, showing that PIGK's catalytic step requires the full
      pentamer rather than the PIGK-GAA1 core alone.
    supporting_text: >-
      Cells lacking PIG-U formed complexes of the four other components normally but had no
      ability to cleave the GPI attachment signal peptide.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: >-
      PIG-U is proposed to recognize the GPI attachment signal or the lipid portion of GPI,
      dividing substrate recognition between subunits rather than assigning it all to the
      catalytic PIGK.
    supporting_text: >-
      Taken together, PIG-U and the yeast orthologue Cdc91p are the fifth component of GPI
      transamidase that may be involved in the recognition of either the GPI attachment
      signal or the lipid portion of GPI.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Identifies PIG-U as the fifth transamidase subunit via GPI8/PIGK affinity purification;
      source of complex-membership and attachment-of-GPI-anchor annotations. Abstract-only.
- id: PMID:19946888
  title: Defining the membrane proteome of NK cells.
  full_text_unavailable: true
  findings:
  - statement: >-
      PIGK was detected in a high-throughput membrane-proteome survey of the NK-like YTS cell
      line; the study assigns no function and supports only the generic membrane
      (GO:0016020) annotation, not the specific ER-membrane localization.
    supporting_text: >-
      Mass spectrometric analysis identified 1843 proteins with high confidence scores. On
      the basis of the presence of transmembrane regions or evidence of posttranslational
      modifications and prediction algorithms, approximately 40% of the identified proteins
      were predicted as plausible membrane proteins.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Bulk NK-cell membrane proteome; supports only a generic membrane co-identification of
      PIGK, not a specific function or location.
- id: PMID:28514442
  title: Architecture of the human interactome defines protein communities and disease
    networks.
  findings:
  - statement: >-
      The PIGK interaction sourced from this paper comes from BioPlex 2.0, an
      affinity-purification mass-spectrometry network of over 56,000 candidate interactions;
      it is a discovery-scale resource rather than PIGK-focused evidence.
    supporting_text: >-
      Here we present BioPlex 2.0 (Biophysical Interactions of ORFeome-derived complexes),
      which uses robust affinity purification-mass spectrometry methodology to elucidate
      protein interaction networks and co-complexes nucleated by more than 25% of
      protein-coding genes from the human genome
    reference_section_type: ABSTRACT
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      BioPlex 2.0 large-scale AP-MS interactome; source of a bare protein-binding IPI. Does
      not inform PIGK's molecular function beyond what the dedicated complex studies show.
- id: PMID:33961781
  title: Dual proteome-scale networks reveal cell-specific remodeling of the human
    interactome.
  findings:
  - statement: >-
      The PIGK interaction sourced from this paper comes from BioPlex 3.0 and a parallel
      HCT116 network, again a proteome-scale AP-MS resource rather than a PIGK-specific
      experiment.
    supporting_text: >-
      The first, BioPlex 3.0, results from affinity purification of 10,128 human
      proteins-half the proteome-in 293T cells and includes 118,162 interactions among 14,586
      proteins.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      BioPlex 3.0 / HCT116 proteome-scale interactome; source of a bare protein-binding IPI
      without PIGK-specific functional interpretation.
- id: PMID:34576938
  title: Functional Analysis of the GPI Transamidase Complex by Screening for Amino
    Acid Mutations in Each Subunit.
  findings:
  - statement: >-
      GPI-TA is a five-subunit complex (PIGK, GPAA1, PIGT, PIGS, PIGU) in which loss of any
      one subunit abolishes activity, the clearest statement that PIGK's catalytic activity
      is only realized in the assembled complex.
    supporting_text: >-
      GPI-TA consists of five subunits: PIGK, GPAA1, PIGT, PIGS, and PIGU, and the absence of
      any subunit leads to the loss of activity.
    reference_section_type: ABSTRACT
  - statement: >-
      The complex recognizes and cleaves the C-terminal GPI attachment signal of precursor
      proteins and then transfers GPI to the newly exposed C-terminus, the two-step reaction
      PIGK catalyzes.
    supporting_text: >-
      Attachment of GPI to proteins is mediated by the GPI-transamidase (GPI-TA) complex,
      which recognizes and cleaves the C-terminal GPI attachment signal of precursor
      proteins. Then, GPI is transferred to the newly exposed C-terminus of the proteins.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Systematic mutational analysis of all five GPI-TA subunits plus a purification method;
      supports complex membership and the attachment-of-GPI-anchor process annotation.
- id: PMID:35165458
  title: Structure of human glycosylphosphatidylinositol transamidase.
  full_text_unavailable: true
  findings:
  - statement: >-
      The 3.1 A cryo-EM structure of the human GPI transamidase identifies PIGK as the
      catalytic subunit and resolves a C206-H164-N58 triad critical for the transamination
      reaction.
    supporting_text: >-
      The PIGK subunit functions as the catalytic component, in which we identified a
      C206-H164-N58 triad that is critical for the transamination reaction.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: >-
      Transmembrane helices of the complex form a widely opened cleft directly underneath
      PIGK that serves as the GPI substrate-binding site, indicating that the lipid-binding
      pocket is a property of the assembled complex rather than of the PIGK catalytic domain
      alone.
    supporting_text: >-
      Transmembrane helices constitute a widely opened cleft, which is located underneath
      PIGK, serving as a GPI substrate-binding site.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: >-
      The ubiquitin E3 ligase RNF121 is resolved bound at the back of the complex and is
      proposed to act as a quality-control factor for the transamidase.
    supporting_text: >-
      The ubiquitin E3 ligase RNF121 is visualized at the back of the complex and probably
      serves as a quality control factor for the GPIT complex.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Cryo-EM structure of the human GPI-T complex identifying the PIGK catalytic triad;
      primary structural support for the transamidase-activity assignment. Abstract-only.
- id: PMID:35551457
  title: Molecular insights into biogenesis of glycosylphosphatidylinositol anchor
    proteins.
  full_text_unavailable: true
  findings:
  - statement: >-
      A 2.53 A cryo-EM structure shows the human GPI transamidase is an equimolar
      heteropentamer, the structural basis for PIGK's part_of annotation to the
      GPI-anchor transamidase complex.
    supporting_text: >-
      Here, we report the cryo-electron microscopy (cryo-EM) structure of the human GPI-T at
      a global 2.53-Å resolution, revealing an equimolar heteropentameric assembly.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: >-
      Structure-based mutagenesis supports a legumain-like mechanism for recognition and
      cleavage of the proprotein substrate, consistent with PIGK's peptidase C13 family
      assignment being mechanistically real rather than merely a fold resemblance.
    supporting_text: >-
      Structure-based mutagenesis suggests a legumain-like mechanism for the recognition and
      cleavage of proprotein substrates, and an endogenous GPI in the structure defines a
      composite cavity for the lipid substrate.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: >-
      The active site is an elongated composite cavity extending about 22 A from the membrane
      to the catalytic dyad, shaped to accommodate both the proprotein and the lipid
      substrate - a complex-level architecture rather than a PIGK-only active site.
    supporting_text: >-
      This elongated active site, stemming from the membrane and spanning an additional ~22-Å
      space toward the catalytic dyad, is structurally suited for both substrates which
      feature an amphipathic pattern that matches this geometry.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      High-resolution cryo-EM structure of human GPI-T with endogenous GPI bound; supports
      the transamidase activity, complex membership and GPI-anchored protein biosynthesis
      annotations. Abstract-only.
- id: PMID:37684232
  title: Structures of liganded glycosylphosphatidylinositol transamidase illuminate
    GPI-AP biogenesis.
  findings:
  - statement: >-
      Substrate- and product-bound human GPI-T structures explain how the enzyme achieves
      broad proprotein specificity despite the absence of a consensus signal sequence, and
      define the catalytic mechanism of the PIGK subunit.
    supporting_text: >-
      Here, substrates- and products-bound human GPI-T structures identify subsite features
      that enable broad proprotein specificity, inform catalytic mechanism, and reveal a
      multilevel safeguard mechanism against its promiscuity.
    reference_section_type: ABSTRACT
  - statement: >-
      In the resting enzyme the catalytic site is occluded by a locally stabilized
      autoinhibitory loop, and activation requires energetically unfavourable rearrangements
      that convert that loop into catalytic cleft elements - a safeguard against
      indiscriminate cleavage.
    supporting_text: >-
      In the absence of proproteins, the catalytic site is invaded by a locally stabilized
      loop. Activation requires energetically unfavorable rearrangements that transform the
      autoinhibitory loop into crucial catalytic cleft elements.
    reference_section_type: ABSTRACT
  - statement: >-
      Substrate binding in the transmembrane and lumenal domains respectively powers the
      conformational rearrangement and induces a competent cleft, so specificity is an
      emergent property of the whole complex rather than of the PIGK active site alone.
    supporting_text: >-
      Enzyme-proprotein binding in the transmembrane and luminal domains respectively powers
      the conformational rearrangement and induces a competent cleft.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Liganded GPI-T structures defining the two-phase catalytic mechanism and the
      autoinhibitory safeguard; primary support for the IDA transamidase-activity annotation.
- id: PMID:40205054
  title: Multimodal cell maps as a foundation for structural and functional genomics.
  findings:
  - statement: >-
      The PIGK interaction sourced from this paper comes from a multimodal subcellular map of
      over 5,100 proteins in U2OS cells built from combined interaction and
      immunofluorescence data; it is a resource-scale assignment, not a PIGK-specific assay.
    supporting_text: >-
      Here we construct a global map of human subcellular architecture through joint
      measurement of biophysical interactions and immunofluorescence images for over 5,100
      proteins in U2OS osteosarcoma cells.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Proteome-scale multimodal cell map; source of a bare protein-binding IPI. Does not
      inform PIGK's molecular function.
- id: PMID:9356492
  title: The affected gene underlying the class K glycosylphosphatidylinositol (GPI)
    surface protein defect codes for the GPI transamidase.
  full_text_unavailable: true
  findings:
  - statement: >-
      The human class K GPI-anchoring mutant, which accumulates assembled GPI donors but
      cannot transfer them to proproteins, is defective in the human homolog of yeast GPI8
      (PIGK), identifying PIGK as the gene underlying the transamidation defect.
    supporting_text: >-
      we found that the genetic element affected in these cells corresponds to the human
      homolog of yGPI8, a gene affected in a yeast mutant strain exhibiting similar
      accumulation of GPI donors without transfer.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: >-
