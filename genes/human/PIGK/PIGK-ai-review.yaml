suggested_questions:
- question: >-
    PIGK carries the catalytic triad, yet loss of any one of the other four subunits abolishes
    activity and the GPI lipid-binding cleft is formed by partner transmembrane helices. Should
    PIGK's GPI-anchor transamidase activity (GO:0003923) be annotated as enables, or is
    contributes_to a more faithful model of an activity that only exists in the assembled
    heteropentamer?
  experts:
  - Kinoshita T
  - Ohishi K
  - Hong Y
- question: >-
    PIGK is annotated to peptidase activity (GO:0008233) and proteolysis (GO:0006508) by
    InterPro2GO on the basis of its peptidase C13 fold. Given that the cleavage step is an
    obligate half-reaction of transamidation and no free proteolytic product accumulates, are
    these annotations informative or should they be treated as fold-derived over-annotations?
  experts:
  - Kinoshita T
  - Fujita M
  - Murakami Y
- question: >-
    The RNF121 E3 ligase is resolved bound to the transamidase in one cryo-EM structure and
    proposed as a quality-control factor. Is RNF121 a bona fide constitutive component of the
    PIGK complex, and does it ubiquitinate PIGK or a partner subunit?
  experts:
  - Kinoshita T
  - Zhang H
- question: >-
    How does the autoinhibitory loop that occludes the PIGK catalytic site in the resting
    enzyme relate to the disease-causing PIGK variants in neurodevelopmental disorder with
    hypotonia and cerebellar atrophy - do pathogenic substitutions destabilize the complex, the
    triad, or the activation rearrangement?
  experts:
  - Kinoshita T
  - Murakami Y
suggested_experiments:
- hypothesis: >-
    The GPI-anchor transamidase activity is a property of the assembled pentamer rather than of
    PIGK alone, so PIGK's molecular function is better modelled as contributes_to.
  description: >-
    Express and purify PIGK alone, PIGK-GPAA1, and the full pentamer into nanodiscs and assay
    transamidation of a defined proprotein substrate with an acyl-GPI donor by mass
    spectrometry, quantifying both the acyl-enzyme intermediate and the finished GPI-anchored
    product. If PIGK alone forms no acyl-enzyme intermediate on a physiological substrate, the
    catalytic step is complex-dependent throughout and not merely lipid-binding-dependent.
  experiment_type: stepwise in vitro reconstitution with intermediate trapping
- hypothesis: >-
    PIGK has no independent proteolytic activity outside transamidation, so the
    InterPro2GO-derived peptidase and proteolysis annotations describe a fold rather than a
    function.
  description: >-
    Incubate purified PIGK-containing GPI-T with a proprotein substrate in the presence and
    absence of the GPI donor, then quantify released C-terminal signal peptide by targeted mass
    spectrometry. Test whether cleavage occurs at an appreciable rate without an acceptor
    nucleophile, and repeat with small nucleophiles (hydrazine, hydroxylamine) as a positive
    control for acyl-enzyme turnover.
  experiment_type: donor-dependence proteolysis assay
- hypothesis: >-
    Pathogenic PIGK variants act through distinct mechanisms - complex destabilization, triad
    disruption, or failure of the autoinhibitory-loop rearrangement - which would predict
    different residual activity and different responsiveness to substrate load.
  description: >-
    Reconstitute a panel of reported PIGK patient variants in PIGK-null cells and measure in
    parallel (i) incorporation into the pentamer by blue-native PAGE and co-immunoprecipitation,
    (ii) surface GPI-anchored protein levels by FLAER and CD59/CD55 flow cytometry, and (iii) in
    vitro transamidase activity of purified complexes. Map each variant onto the liganded
    structures to test whether the mechanistic class predicts the biochemical phenotype.
  experiment_type: variant panel with complex-assembly, cell-surface and in vitro activity readouts
core_functions:
- description: Catalytic (cysteine-protease-like) subunit of the ER-membrane GPI-anchor
    transamidase (GPI-T) complex that attaches preassembled GPI anchors to proteins.
    PIGK cleaves the C-terminal GPI-attachment signal peptide of nascent proproteins
    (nucleophile Cys206, proton donor His164) forming an acyl(carbonyl)-enzyme thioester
    intermediate, then transfers the GPI anchor onto the newly exposed omega-site via
    a transamidation reaction.
