- term:
    id: GO:0005524
    label: ATP binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR000040
  review:
    summary: ATP binding is not supported as a RUNX1 molecular function.
    action: REMOVE
    reason: RUNX1 is a Runt-domain DNA-binding transcription factor, not an ATP-dependent enzyme or motor;
      the InterPro Runt-domain mapping over-interprets an internal motif as ATP binding.
    supported_by:
    - reference_id: file:human/RUNX1/RUNX1-notes.md
      supporting_text: 'The InterPro `ATP binding` row is a domain-mapping artifact: the Runt domain is
        not an ATP-dependent catalytic or motor domain.'
    - reference_id: file:human/RUNX1/RUNX1-uniprot.txt
      supporting_text: 'CC   -!- SUBUNIT: Heterodimer with CBFB. RUNX1 binds DNA as a monomer and

        CC       through the Runt domain. DNA-binding is increased by

        CC       heterodimerization.'
    source_defects:
    - defect_type: WRONG_TERM
      resource: INTERPRO
      record: InterPro:IPR000040
      requested_change: DELETE_ROW
      asserted_value: GO:0005524
      confidence: CONFIRMED
      explanation: IPR000040 AML1_Runt is the RUNX Runt DNA-binding domain. RUNX1 is a sequence-specific
        DNA-binding core-binding-factor subunit, not an ATP-binding enzyme or motor, so the GO:0005524 ATP binding
        InterPro2GO mapping should be removed from the entry.
      supported_by:
      - reference_id: file:human/RUNX1/RUNX1-uniprot.txt
        supporting_text: Heterodimer with CBFB. RUNX1 binds DNA as a monomer and through the Runt domain.
