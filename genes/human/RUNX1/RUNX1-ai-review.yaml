suggested_questions:
- question: Which RUNX1 cardiovascular and connective-tissue ISS rows are direct transcriptional programs
    in human cells rather than injury-model phenotypes from mouse Runx1?
- question: Which RUNX1 isoforms measurably repress versus activate endogenous Pol II targets in primary
    hematopoietic cells?
