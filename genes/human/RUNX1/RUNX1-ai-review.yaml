  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:99829
  - PANTHER:PTN000237028
  - UniProtKB:Q13950
  review:
    summary: ossification is a PAINT-propagated RUNX developmental program, not the RUNX1 core molecular
      function.
    action: KEEP_AS_NON_CORE
    reason: PAINT places these developmental processes on a shared RUNX node. RUNX1 is a direct transcriptional
      regulator of differentiation programs, but the inherited tissue-level process should remain non-core
      for RUNX1.
