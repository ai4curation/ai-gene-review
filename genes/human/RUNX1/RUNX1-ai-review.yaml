id: Q01196
gene_symbol: RUNX1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: RUNX1 encodes a nuclear Runt-domain DNA-binding transcription factor that forms CBFB/core-binding-factor
  complexes on target regulatory elements and activates or represses RNA polymerase II transcription in
  a context-dependent manner. It is a central regulator of hematopoietic and immune-cell gene-expression
  programs, and its target selection is shaped by protein cofactors that tune RUNX1 binding, activation,
  and repression at chromatin.
