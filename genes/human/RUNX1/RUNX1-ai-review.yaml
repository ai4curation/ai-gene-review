- term:
    id: GO:0000122
    label: negative regulation of transcription by RNA polymerase II
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q03347
  review:
    summary: Negative regulation of Pol II transcription is a supported context-specific RUNX1 output.
    action: KEEP_AS_NON_CORE
    reason: RUNX1 can activate or repress target promoters depending on isoform and cofactors, so this
      repression row is retained as non-core.
    supported_by:
    - reference_id: file:human/RUNX1/RUNX1-uniprot.txt
      supporting_text: 'CC   -!- FUNCTION: Forms the heterodimeric complex core-binding factor (CBF)

        CC       with CBFB. RUNX members modulate the transcription of their target

        CC       genes through recognizing the core consensus binding sequence 5''-

        CC       TGTGGT-3'', or very rarely, 5''-TGCGGT-3'', within their regulatory

        CC       regions via their runt domain, while CBFB is a non-DNA-binding

        CC       regulatory subunit that allosterically enhances the sequence-specific

        CC       DNA-binding capacity of RUNX.'
    - reference_id: file:human/RUNX1/RUNX1-uniprot.txt
      supporting_text: 'CC   -!- SUBUNIT: Heterodimer with CBFB. RUNX1 binds DNA as a monomer and

        CC       through the Runt domain. DNA-binding is increased by

        CC       heterodimerization.'
