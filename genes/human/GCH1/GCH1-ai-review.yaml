core_functions:
- description: Catalyzes the first reaction supplying dihydroneopterin triphosphate for tetrahydrobiopterin
    biosynthesis. The zinc-containing homodecamer is regulated through association with GFRP. Endothelial
    laminar shear can increase activity through CK2-dependent Ser81 phosphorylation.
  molecular_function:
    id: GO:0003934
    label: GTP cyclohydrolase I activity
  directly_involved_in:
