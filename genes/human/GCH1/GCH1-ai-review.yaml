id: P30793
gene_symbol: GCH1
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
status: DRAFT
description: GCH1 is a zinc-dependent GTP cyclohydrolase that forms a homodecamer and converts GTP to
  dihydroneopterin triphosphate and formate. This cytosolic reaction supplies the pteridine precursor
  for tetrahydrobiopterin synthesis. GFRP couples enzyme regulation to tetrahydrobiopterin feedback and
  phenylalanine availability. The resulting cofactor supports nitric oxide synthases and aromatic amino-acid
  hydroxylases. Nuclear enzyme activity is also reported in human epidermal cells. Alternative splicing
  produces four proteins with distinct C termini. Pathogenic variants cause dopa-responsive dystonia and
  BH4-deficient hyperphenylalaninemia.
