  review:
    summary: >-
      protein serine/threonine kinase activity is retained as a core annotation for GSK3A because direct
      substrate assays and PAINT placement agree that GSK3A is a primed-substrate serine/threonine kinase.
    action: ACCEPT
    reason: >-
      The IBA row from GO_REF:0000033 is consistent with GSK3A as a constitutively active CMGC protein
      serine/threonine kinase. PAINT places this activity on the GSK family without a GSK3A lineage loss,
      UniProt records serine and threonine phosphotransferase reactions, and direct GSK3A/GSK3 assays
      show phosphorylation of substrates including RICTOR and STARD3.
