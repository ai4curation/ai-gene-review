- term:
    id: GO:0005102
    label: signaling receptor binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q2NL51
  - ensembl:ENSMUSP00000071654
  review:
    summary: >-
      signaling receptor binding is retained as non-core because the LRP6 and TNFRSF10B interactions are
      real receptor contacts but are accessory physical interactions rather than the GSK3A catalytic output.
    action: KEEP_AS_NON_CORE
    reason: >-
      The IEA row from GO_REF:0000107 is retained because GSK3A has reported receptor-complex contacts,
      including LRP6 in Wnt signaling and TNFRSF10B at death receptors. This term is kept as non-core
      because receptor binding is a regulatory interaction for a kinase whose core function is substrate
      phosphorylation.
    additional_reference_ids:
    - file:human/GSK3A/GSK3A-notes.md
    - PMID:20371704
