    label: regulation of systemic arterial blood pressure
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q2NL51
  - ensembl:ENSMUSP00000071654
  review:
    summary: >-
      regulation of systemic arterial blood pressure is marked over-annotated for human GSK3A because
      this mouse-orthology transfer does not identify a direct human GSK3A substrate or vascular mechanism.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The IEA row from GO_REF:0000107 traces to mouse Gsk3a blood-pressure phenotypes through Ensembl-Compara/ISS
      rather than to a demonstrated vascular GSK3A substrate in human cells. The systemic blood-pressure
      effect may be biologically related to the pleiotropic kinase, but it overstates the direct evidence
      and is marked over-annotated.
    additional_reference_ids:
    - file:human/GSK3A/GSK3A-uniprot.txt
    - file:human/GSK3A/GSK3A-notes.md
