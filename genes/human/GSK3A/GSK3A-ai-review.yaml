- term:
    id: GO:0008286
    label: insulin receptor signaling pathway
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:1861437
  - MGI:MGI:2152453
  - PANTHER:PTN000624303
  review:
    summary: >-
      insulin receptor signaling pathway is retained as a core GSK3A branch because human skeletal-muscle
      knockdown and overexpression support GSK3A as a negative insulin-response regulator.
    action: ACCEPT
    reason: >-
      The IBA row from GO_REF:0000033 is retained because human GSK3A knockdown improved insulin-stimulated
      glycogen synthase activity and glucose uptake, whereas GSK3A overexpression impaired those insulin
      responses. GSK3A is therefore part of the insulin/glycogen signaling branch, and this pathway-level
      term is core for the paralog.
    additional_reference_ids:
    - file:human/GSK3A/GSK3A-uniprot.txt
    - file:human/GSK3A/GSK3A-notes.md
    - PMID:17569761
