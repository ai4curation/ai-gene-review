- term:
    id: GO:0003214
    label: cardiac left ventricle morphogenesis
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q2NL51
  - ensembl:ENSMUSP00000071654
  review:
    summary: >-
      cardiac left ventricle morphogenesis is marked over-annotated for human GSK3A because the mouse
      phenotype transfer is too developmental for the direct kinase evidence available here.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The IEA row from GO_REF:0000107 is an orthology transfer from mouse cardiac-development data. GSK3A
      is a conserved CMGC kinase, but the reviewed human evidence supports kinase, Wnt, glycogen/insulin,
      RICTOR, STARD3, and tau branches rather than a direct left-ventricle morphogenesis role.
    additional_reference_ids:
    - file:human/GSK3A/GSK3A-uniprot.txt
    - file:human/GSK3A/GSK3A-notes.md
