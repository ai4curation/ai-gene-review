id: P49840
gene_symbol: GSK3A
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  GSK3A encodes glycogen synthase kinase-3 alpha, a constitutively active cytosolic and nuclear
  CMGC serine/threonine kinase that is restrained by inhibitory Ser-21 phosphorylation and
  activated by Tyr-279 phosphorylation. It phosphorylates primed and unprimed protein substrates,
  acting with GSK3B in the beta-catenin destruction complex to negatively regulate canonical
  Wnt signaling, in insulin-linked inhibition of glycogen synthase, in tau phosphorylation,
  and in substrate-specific control of ubiquitin-dependent turnover and membrane-contact-site
  regulators.
