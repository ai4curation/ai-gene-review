id: Q96BM1
gene_symbol: ANKRD9
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'ANKRD9 (ankyrin repeat domain-containing 9), an ASB-family protein, is the substrate receptor
  of a cullin-5 RING E3 ubiquitin ligase (CUL5, ELOB, ELOC, RNF7) that recognizes the purine-synthesis
  enzymes IMPDH1 and IMPDH2 and targets them for proteasomal degradation. Its action on IMPDH2 is metabolically
  switched: under basal conditions ANKRD9 sits in cytoplasmic vesicle-like structures, but on nutrient
  limitation it co-assembles with IMPDH2 into cytosolic rods in which IMPDH2 is stable, a transition reversed
  by guanosine and dependent on a conserved Cys109-Cys110 motif. ANKRD9 has anti-proliferative activity
  in human cells; chicken ANKRD9 restrains myogenesis through IMPDH2, and mouse Ankrd9 supports enterocyte
  ATP levels and dietary fat absorption.'
