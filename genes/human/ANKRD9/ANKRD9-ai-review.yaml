- term:
    id: GO:0006878
    label: intracellular copper ion homeostasis
  evidence_type: IMP
  original_reference_id: PMID:24522796
  qualifier: involved_in
  review:
    summary: Intracellular copper ion homeostasis (IMP). ANKRD9 was a hit in a genome-wide siRNA ionomics
      screen; its knockdown dispersed the trans-Golgi network and altered the copper transporter ATP7A,
      which the authors themselves suggest is secondary to TGN fragmentation. ANKRD9 does not take part
      in copper handling itself; marked as over-annotated.
    action: MARK_AS_OVER_ANNOTATED
    reason: '[PMID:24522796 "Down-regulation of this adaptor protein led to an increased cell size, dispersion
      of the TGN (Fig. 5D) and a change in ATP7A electrophoretic mobility (Fig. 4B)."] The source study
      notes the ATP7A change [PMID:24522796 "which could be a secondary effect of TGN fragmentation"].
      Independently, Ankrd9 loss in mouse enterocytes [PMID:41826336 "Inactivation of Ankrd9 in mice reduces
      intestinal ATP despite intact mitochondrial and glycolytic function, alters Golgi morphology, delays
      ApoB/chylomicron trafficking, and causes lipid accumulation in enterocytes, along with a lean body
      phenotype."] The copper effect is therefore two steps downstream of ANKRD9 (Golgi organization,
      then ATP7A trafficking), and involved_in overstates it.'
    supported_by:
    - reference_id: PMID:24522796
      supporting_text: Down-regulation of this adaptor protein led to an increased cell size, dispersion
        of the TGN (Fig. 5D) and a change in ATP7A electrophoretic mobility (Fig. 4B).
    - reference_id: PMID:24522796
      supporting_text: which could be a secondary effect of TGN fragmentation
    - reference_id: PMID:41826336
      supporting_text: Inactivation of Ankrd9 in mice reduces intestinal ATP despite intact mitochondrial
        and glycolytic function, alters Golgi morphology, delays ApoB/chylomicron trafficking, and causes
        lipid accumulation in enterocytes, along with a lean body phenotype.
