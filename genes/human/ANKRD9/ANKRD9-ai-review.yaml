- id: PMID:41826336
  title: Enterocytes rely on purine biosynthesis/salvage pathway to facilitate dietary fat absorption.
  findings:
  - statement: Ankrd9 loss reduces enterocyte ATP and impairs chylomicron trafficking.
    supporting_text: Inactivation of Ankrd9 in mice reduces intestinal ATP despite intact mitochondrial
      and glycolytic function, alters Golgi morphology, delays ApoB/chylomicron trafficking, and causes
      lipid accumulation in enterocytes, along with a lean body phenotype.
  - statement: Ankrd9 clusters near the cis-Golgi.
    supporting_text: Ankrd9 does not interact with ApoB but clusters near the cis-Golgi and the lateral
      membrane
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text; mouse knockout. Physiological role in dietary fat absorption; no GO term
      drawn from a single study.
