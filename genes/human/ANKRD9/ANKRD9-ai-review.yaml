proposed_new_terms: []
suggested_questions:
- question: How does ANKRD9 both degrade IMPDH2 and, in mouse enterocytes, support purine-derived ATP
    synthesis? Does the rod-forming, IMPDH2-stabilizing mode dominate there?
- question: What are the ANKRD9-containing vesicle-like structures, and how does guanosine switch ANKRD9
    between vesicles and IMPDH2 rods?
suggested_experiments:
- description: Identify the vesicle compartment that holds ANKRD9 under basal conditions (mouse enterocyte
    data place it near the cis-Golgi), and test whether the Cys109-Cys110 motif is a lipidation or metal-binding
    site that controls the switch.
