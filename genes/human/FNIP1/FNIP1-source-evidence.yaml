publication_access:
- reference_id: PMID:17028174
  normal_path: publications/PMID_17028174.md
  bytes: 31311
  sha256: 1c25e6feaf2891ed6aacf6e2c13b36b2e71067b91cbc5536fe00328bf81197ca
  normal_full_text_available: true
  original_source_url: https://pmc.ncbi.nlm.nih.gov/articles/PMC1592464/
  manual_access: Selected original cached Results and Methods
  selected_locators:
  - Cloning of human FNIP1 cDNA
  - FLCN and FNIP1 interact and colocalize in the cytoplasm
  - FNIP1 interacts with AMPK
  scope_limits: The human 1166-aa construct was assembled from overlapping cDNAs. Tagged and endogenous
    FLCN association, reticulocyte-translation/GST capture and AMPK-complex association are distinct assays.
    FNIP1 is an AMPK substrate; regulatory gamma/beta-subunit capture does not make those partners protein
    kinases or establish FNIP1 catalysis. Nutrient/AMPK experiments here primarily examine phosphorylation,
    not FNIP1-loss TOR inhibition. No SI or figure pixels independently inspected.
- reference_id: PMID:18403135
  normal_path: publications/PMID_18403135.md
  bytes: 25822
  sha256: 3bba39b13fac4e7896bfc31f323f1a679c031713189a7afbed8c9b92c104bde5
  normal_full_text_available: true
  original_source_url: https://pmc.ncbi.nlm.nih.gov/articles/PMC2727720/
  manual_access: Selected original cached Results and Methods
  selected_locators:
  - FNIP1/FNIP2 interactions and FLCN association
  - Immunoprecipitation and in vitro binding assays
  scope_limits: Human FNIP1/FNIP2 reciprocal endogenous and tagged capture, reticulocyte-labeled FNIP2
    capture by GST-FNIP1, and sequential affinity capture support association/multimers. These assays
    do not establish a fixed dimer stoichiometry or equal behavior of all current FNIP1 splice products.
- reference_id: PMID:18663353
  normal_path: publications/PMID_18663353.md
  bytes: 2706
  sha256: dfcd654ee665234d9cccc974e38b220ea9d4cf549986ee1cc33b635a870f23c1
  normal_full_text_available: false
  original_source_url: https://doi.org/10.1038/onc.2008.261
  manual_access: Authentic normal abstract only; selected source-specific assay not recovered
  selected_locators:
  - Abstract
  scope_limits: The abstract foregrounds FNIP2/FNIPL. The particular FNIP1 localization experiment remains
    unverified; no wrong-gene or paralog-error claim is made. The cytoplasmic location is independently
    supported by other FNIP1 studies.
- reference_id: PMID:19914239
  normal_path: publications/PMID_19914239.md
  bytes: 2102
  sha256: d9774e3af70d284f30cbec45eefec73e10c56b81e7185a62b353ff2c0a71c91d
  normal_full_text_available: false
  original_source_url: https://febs.onlinelibrary.wiley.com/doi/abs/10.1016/j.febslet.2009.11.033
  manual_access: Selected official publisher-indexed Results and supplementary caption; normal cache remains
    abstract-only
  selected_locators:
  - Results 3.1–3.3
  - Supplementary Figure S4 caption in indexed original text
  scope_limits: Indexed primary text describes COS7 cells expressing Flag-tagged rat FLCN variants with
    Myc-FNIP1/FNIP2 and anti-Myc capture. S62 phosphorylation-state variants did not materially alter
    association. This supports the original rat-FLCN partner context. Complete Methods, supplementary
    figure pixels and exact FNIP1 construct sequence were not inspected. Direct publisher access returned
    a block; the successful indexed text is a separate access route.
- reference_id: PMID:20562859
  normal_path: publications/PMID_20562859.md
  bytes: 112750
  sha256: dfb4ad5d51215c777221bb6be545f4919365abe946cc36f984db5fe994cc3bf7
  normal_full_text_available: true
  original_source_url: https://pmc.ncbi.nlm.nih.gov/articles/PMC2901998/
  manual_access: Normal full article plus exact curated target-specific interaction records; no complete
    supplementary target validation audit
  selected_locators:
  - IntAct Q8TF40 target query, PMID-specific GABARAP/GABARAPL1 records
  scope_limits: Exact positive target records support human FNIP1 associations with the two ATG8-family
    proteins, including affinity-capture contexts. Retain their distinct partner identities. This is not
    a demonstration that FNIP1 is a canonical autophagy cargo receptor, nor proof that every listed high-throughput
    edge was independently validated in native cells.
- reference_id: PMID:21209915
  normal_path: publications/PMID_21209915.md
  bytes: 123257
  sha256: b9ffe344c954b3faa6de14da4f43136284ab60763d42e45da6ef0ede85bfbca7
  normal_full_text_available: true
  original_source_url: https://pmc.ncbi.nlm.nih.gov/articles/PMC3012117/
  manual_access: Selected original cached Results and relevant assay text
  selected_locators:
  - GPNMB reporter and expression experiments
  - RT-qPCR Methods
  scope_limits: FNIP1 reduces TFE3-driven GPNMB reporter activity in HT1080 cells; FLCN/FNIP combinations
    have stronger selected effects. FNIP1 alone does not suppress GPNMB in FLCN-null UOK257 cells. These
    source-specific results support contextual regulation rather than DNA binding or universal repression
    of RNA polymerase II. Preserve the original TFE3 participant extension.
- reference_id: PMID:22190034
  normal_path: publications/PMID_22190034.md
  bytes: 6326
  sha256: 2168d7126b087920d94b877adddeb2ac6b690004dba07c12d06c1db24ae3f7b4
  normal_full_text_available: false
  original_source_url: https://pmc.ncbi.nlm.nih.gov/articles/PMC3310911/
  manual_access: Normal abstract and three exact positive IntAct target records; original full-body access
    unsuccessful
  selected_locators:
  - IntAct Q8TF40/Q9Q2G4 records assigned to this PMID
  scope_limits: Curated records preserve the HIV protease partner, D25-mutant bait and affinity/coimmunoprecipitation/spoke
    context. They support a measured association without demonstrating FNIP1 cleavage, substrate status
    or binding to a physiologically active protease conformation. No target-specific full-paper or SI
    validation is claimed.
- reference_id: PMID:22608497
  normal_path: publications/PMID_22608497.md
  bytes: 101351
  sha256: 1ad535a24c052ae2eedaa77e74a9bb1e3a97c0c36675ab1eb1f0dcad1d43e6cd
  normal_full_text_available: true
  original_source_url: https://pmc.ncbi.nlm.nih.gov/articles/PMC3361584/
  manual_access: Selected original normal Results, Discussion and Methods
  selected_locators:
  - Normal cache lines 124–184 and 196–214
  - B-cell transfer/rescue, AMPK–mTOR, nutrient-survival and Eµ-Myc experiments
  scope_limits: Mouse Fnip1 loss causes a cell-autonomous early B-cell defect and increased susceptibility
    to apoptosis under tested stresses; wild-type Fnip1 re-expression restores development. AMPK activation
    persists but fails to restrain S6 in the knockout. Nutrient and rapamycin rescue are conditional.
    The donor annotation has positive-apoptosis direction, whereas these experiments support a survival-promoting/negative-apoptosis
    contribution. Preserve human ISS provenance and document the source-side discrepancy; do not silently
    change its original term.
- reference_id: PMID:22709692
  normal_path: publications/PMID_22709692.md
  bytes: 30843
  sha256: 9a10336ac155bd5450bccf2780e12ea6f9ddb6e132140e8c2627bc4180d57c9e
  normal_full_text_available: true
  original_source_url: https://pmc.ncbi.nlm.nih.gov/articles/PMC3418720/
  manual_access: Selected original normal Results, Discussion and Methods
  selected_locators:
  - Normal cache lines 105–179
  - Pro-B-cell block, receptor/Bcl2 rescue and mTOR assays
  scope_limits: Independent mouse Fnip1-loss models arrest early B-cell development and increase death.
    Bcl2 and prearranged-receptor experiments support survival/developmental contributions with distinct
    endpoints. This study did not observe the same mTOR increase or rapamycin rescue as PMID:22608497;
    the models must remain distinct. Conditional Flcn comparisons are separate from Fnip1-specific rescue
    experiments.
- reference_id: PMID:24081491
  normal_path: publications/PMID_24081491.md
  bytes: 153797
  sha256: b20ce2a850a510be76a0433e185183cf6af028b8a433ff9804d994dccd486265
  normal_full_text_available: true
  original_source_url: https://pmc.ncbi.nlm.nih.gov/articles/PMC3787382/
  manual_access: Selected original normal FNIP1 Results, Discussion, figure captions and Methods
  selected_locators:
  - Figures 3–5
  - Construct accession BC001956.1 and recruitment/Rag-association Methods
  scope_limits: FNIP1 depletion and overexpression support FLCN lysosomal recruitment and Rag association
    in human cells. They do not directly measure FNIP1 increasing FLCN GAP catalytic activity. The FNIP1
    construct accession resolves to a human 508-aa sequence, differing by one residue from current Q8TF40-2;
    the paper calls it full-length. Do not assign canonical or current isoform identity from this unresolved
    discrepancy. Mouse FLCN constructs and endogenous human FLCN experiments are separate.
- reference_id: PMID:25126726
  normal_path: publications/PMID_25126726.md
  bytes: 16159
  sha256: 1a6409efcdb637f6f7c1c046ca9521614b65ab8bd34644b76d796e67588ca013
  normal_full_text_available: true
  original_source_url: https://pmc.ncbi.nlm.nih.gov/articles/PMC4198360/
  manual_access: Selected actual original Results/captions from retained PMC body beyond incomplete normal
    cache
  selected_locators:
  - Figure 3 and associated Results
  - Tagged affinity capture and GABARAP experiments
  scope_limits: FNIP1 increases FLCN–GABARAP capture in human cells, with FNIP2 compared separately. GST-GABARAP
    capture uses cell lysate; it is not an isolated three-purified-protein affinity measurement. Tagged
    MDCK localization emphasized FNIP2 and cannot be reassigned to FNIP1. Retain both original participant
    inputs without adding autophagy-adaptor or cleavage functions.
- reference_id: PMID:27353360
  normal_path: publications/PMID_27353360.md
  bytes: 3644
  sha256: 0f721ec59527d71f2fdaaec87b4a57eb288f03925c875b5d5be7ad7e811931fd
  normal_full_text_available: false
  original_source_url: https://pmc.ncbi.nlm.nih.gov/articles/PMC4931344/
  manual_access: Selected original full XML Results and ATPase/binding Methods
  selected_locators:
  - Body paragraphs 4, 6, 7, 9–11 and 28; Figures 2–6
  scope_limits: Purified bacterial FNIP1 binds Hsp90 and FLCN and permits their association. Human-cell
    complex experiments identify Hsp90, HOP, p23, CDC37, GR, BRAF and CDK4 partners. Full-length FNIP1
    and residues 929–1166 inhibit Hsp90 ATPase in the reported assay; that ATPase experiment used cell-purified,
    salt-washed components, distinct from bacterial direct-binding experiments. Client maturation/loading
    is supported, without assigning every co-complex edge direct binary binding or every natural product
    equivalent activity.
- reference_id: PMID:29848618
