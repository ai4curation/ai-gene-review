- id: PMID:17028174
  title: Folliculin encoded by the BHD gene interacts with a binding protein, FNIP1, and AMPK, and is
    involved in AMPK and mTOR signaling.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected original cached Results and Methods. The human 1166-aa construct was assembled
      from overlapping cDNAs. Tagged and endogenous FLCN association, reticulocyte-translation/GST capture
      and AMPK-complex association are distinct assays. FNIP1 is an AMPK substrate; regulatory gamma/beta-subunit
      capture does not make those partners protein kinases or establish FNIP1 catalysis. Nutrient/AMPK
      experiments here primarily examine phosphorylation, not FNIP1-loss TOR inhibition. No SI or figure
      pixels independently inspected.
- id: PMID:18403135
  title: Identification and characterization of a novel folliculin-interacting protein FNIP2.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected original cached Results and Methods. Human FNIP1/FNIP2 reciprocal endogenous
      and tagged capture, reticulocyte-labeled FNIP2 capture by GST-FNIP1, and sequential affinity capture
      support association/multimers. These assays do not establish a fixed dimer stoichiometry or equal
      behavior of all current FNIP1 splice products.
- id: PMID:18663353
  title: Interaction of folliculin (Birt-Hogg-Dubé gene product) with a novel Fnip1-like (FnipL/Fnip2)
    protein.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: Authentic normal abstract only; selected source-specific assay not recovered. The abstract
      foregrounds FNIP2/FNIPL. The particular FNIP1 localization experiment remains unverified; no wrong-gene
      or paralog-error claim is made. The cytoplasmic location is independently supported by other FNIP1
      studies.
- id: PMID:19914239
  title: Serine 62 is a phosphorylation site in folliculin, the Birt-Hogg-Dubé gene product.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected official publisher-indexed Results and supplementary caption; normal cache
      remains abstract-only. Indexed primary text describes COS7 cells expressing Flag-tagged rat FLCN
      variants with Myc-FNIP1/FNIP2 and anti-Myc capture. S62 phosphorylation-state variants did not materially
      alter association. This supports the original rat-FLCN partner context. Complete Methods, supplementary
      figure pixels and exact FNIP1 construct sequence were not inspected. Direct publisher access returned
      a block; the successful indexed text is a separate access route.
- id: PMID:20562859
  title: Network organization of the human autophagy system.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: Normal full article plus exact curated target-specific interaction records; no complete
      supplementary target validation audit. Exact positive target records support human FNIP1 associations
      with the two ATG8-family proteins, including affinity-capture contexts. Retain their distinct partner
      identities. This is not a demonstration that FNIP1 is a canonical autophagy cargo receptor, nor
      proof that every listed high-throughput edge was independently validated in native cells.
- id: PMID:21209915
  title: Inactivation of the FLCN tumor suppressor gene induces TFE3 transcriptional activity by increasing
    its nuclear localization.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected original cached Results and relevant assay text. FNIP1 reduces TFE3-driven
      GPNMB reporter activity in HT1080 cells; FLCN/FNIP combinations have stronger selected effects.
      FNIP1 alone does not suppress GPNMB in FLCN-null UOK257 cells. These source-specific results support
      contextual regulation rather than DNA binding or universal repression of RNA polymerase II. Preserve
      the original TFE3 participant extension.
- id: PMID:22190034
  title: Global landscape of HIV-human protein complexes.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: Normal abstract and three exact positive IntAct target records; original full-body access
      unsuccessful. Curated records preserve the HIV protease partner, D25-mutant bait and affinity/coimmunoprecipitation/spoke
      context. They support a measured association without demonstrating FNIP1 cleavage, substrate status
      or binding to a physiologically active protease conformation. No target-specific full-paper or SI
      validation is claimed.
- id: PMID:24081491
  title: Recruitment of folliculin to lysosomes supports the amino acid-dependent activation of Rag GTPases.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected original normal FNIP1 Results, Discussion, figure captions and Methods. FNIP1
      depletion and overexpression support FLCN lysosomal recruitment and Rag association in human cells.
      They do not directly measure FNIP1 increasing FLCN GAP catalytic activity. The FNIP1 construct accession
      resolves to a human 508-aa sequence, differing by one residue from current Q8TF40-2; the paper calls
      it full-length. Do not assign canonical or current isoform identity from this unresolved discrepancy.
      Mouse FLCN constructs and endogenous human FLCN experiments are separate.
- id: PMID:25126726
  title: FLCN, a novel autophagy component, interacts with GABARAP and is regulated by ULK1 phosphorylation.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected actual original Results/captions from retained PMC body beyond incomplete normal
      cache. FNIP1 increases FLCN–GABARAP capture in human cells, with FNIP2 compared separately. GST-GABARAP
      capture uses cell lysate; it is not an isolated three-purified-protein affinity measurement. Tagged
      MDCK localization emphasized FNIP2 and cannot be reassigned to FNIP1. Retain both original participant
      inputs without adding autophagy-adaptor or cleavage functions.
- id: PMID:27353360
  title: The FNIP co-chaperones decelerate the Hsp90 chaperone cycle and enhance drug binding.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected original full XML Results and ATPase/binding Methods. Purified bacterial FNIP1
      binds Hsp90 and FLCN and permits their association. Human-cell complex experiments identify Hsp90,
      HOP, p23, CDC37, GR, BRAF and CDK4 partners. Full-length FNIP1 and residues 929–1166 inhibit Hsp90
      ATPase in the reported assay; that ATPase experiment used cell-purified, salt-washed components,
      distinct from bacterial direct-binding experiments. Client maturation/loading is supported, without
      assigning every co-complex edge direct binary binding or every natural product equivalent activity.
- id: PMID:29848618
  title: GATOR1-dependent recruitment of FLCN-FNIP to lysosomes coordinates Rag GTPase heterodimer nucleotide
    status in response to amino acids.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected original full XML via independent CC consultation, beyond abstract-only normal
      cache. Endogenous-locus 2×HA-FNIP1 in human HeLa cells shows nutrient-regulated LAMP1 colocalization
      and RagC-dependent lysosomal recruitment, while remaining associated with FLCN. Fed cytosolic and
      starved membrane-associated pools are compatible. No complete splice-product assignment, quantitative
      soluble-fraction census, figure-pixel or SI inspection is claimed.
- id: PMID:30699359
  title: Post-translational Regulation of FNIP1 Creates a Rheostat for the Molecular Chaperone Hsp90.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected original normal Results and Methods. OGT, PP5 and CK2 associate with FNIP1
      and modify it; the matched glycosylation/phosphorylation/dephosphorylation assays establish regulated-substrate
      roles rather than FNIP1 catalysis. FNIP1 domain/mutant effects on Hsp90 ATPase support a cochaperone
      rheostat within the tested constructs.
- id: PMID:32905580
  title: Absent B cells, agammaglobulinemia, and hypertrophic cardiomyopathy in folliculin-interacting
    protein 1 deficiency.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected original PMC Results and captions; main cache remains abstract-only. Human
      biallelic FNIP1 deficiency is associated with severe B-cell deficiency. The sampled marrow has relative
      early-stage enrichment and fewer immature B cells without an overt complete block. Mitochondrial
      number/activity increased in the measured cells; selected signaling readouts differ rather than
      demonstrating uniform TOR activation. Supplementary Methods were not inspected. Clinical evidence
      supports a human developmental context without a purified molecular mechanism.
- id: PMID:34597140
  title: GABARAP sequesters the FLCN-FNIP tumor suppressor complex to couple autophagy with lysosomal
    biogenesis.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected original normal Results, captions and construct/SPR Methods. Human FNIP1 wild-type
      and Y583A/V586A LIR mutants support GABARAP-dependent sequestration and TFEB-selective signaling
      control. FNIP2 peptide structures and tight-binding measurements are distinct from FNIP1 full-complex
      experiments. This supports an FNIP1 role in basal FLCN-complex function and condition-dependent
      inhibition by sequestration, not a uniform sign for every mTOR output.
- id: PMID:37079666
  title: Induction of lysosomal and mitochondrial biogenesis by AMPK phosphorylation of FNIP1.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected original normal Results, Discussion and Methods. Human-cell FNIP1 phosphorylation
      mutants, AMPK stimulation and locked-state RagC epistasis place FNIP1 in the FLCN–Rag–TFEB/TFE3
      pathway. This supports positive TORC1 control toward these substrates in the basal setting and release
      after AMPK activation. It does not directly establish isolated FNIP1 GAP catalysis or the exact
      direct enzyme-activation conjunction. Lysosomal gene/volume responses are downstream contextual
      functions.
- id: PMID:39423796
  title: A TBK1-independent primordial function of STING in lysosomal biogenesis.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: Selected original normal Results and captions. The inspected STING–GABARAP–RagC experiments
      are compatible with the FLCN–FNIP signaling route and cite the earlier direct FNIP1 work. An FNIP1-specific
      perturbation establishing the exact curated IDA assertion was not isolated in the selected text.
      Retain the distinction between that source-specific access limit and independent positive FNIP1
      evidence in PMID:34597140 and PMID:37079666.
- id: PMID:22608497
  title: Disruption of Fnip1 reveals a metabolic checkpoint controlling B lymphocyte development.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected original normal Results, Discussion and Methods. Mouse Fnip1 loss causes a
      cell-autonomous early B-cell defect and increased susceptibility to apoptosis under tested stresses;
      wild-type Fnip1 re-expression restores development. AMPK activation persists but fails to restrain
      S6 in the knockout. Nutrient and rapamycin rescue are conditional. The donor annotation has positive-apoptosis
      direction, whereas these experiments support a survival-promoting/negative-apoptosis contribution.
      Preserve human ISS provenance and document the source-side discrepancy; do not silently change its
      original term.
- id: PMID:22709692
  title: The folliculin-FNIP1 pathway deleted in human Birt-Hogg-Dubé syndrome is required for murine
    B-cell development.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected original normal Results, Discussion and Methods. Independent mouse Fnip1-loss
      models arrest early B-cell development and increase death. Bcl2 and prearranged-receptor experiments
      support survival/developmental contributions with distinct endpoints. This study did not observe
      the same mTOR increase or rapamycin rescue as PMID:22608497; the models must remain distinct. Conditional
      Flcn comparisons are separate from Fnip1-specific rescue experiments.
