gene_symbol: FNIP1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: FNIP1 is an Hsp90 cochaperone and a nutrient-responsive partner of folliculin (FLCN). It
  binds Hsp90, restrains its ATPase cycle and supports client loading and maturation, including FLCN.
  A cytosolic FNIP1–FLCN complex is recruited to lysosomal membranes and contributes to RagC/D-dependent
  TORC1 signaling toward TFEB and TFE3. AMPK-dependent phosphorylation and GABARAP-dependent sequestration
  regulate this signaling partnership. FNIP1 also supports the metabolic fitness, survival and development
  of B lymphocytes, with nutrient and TOR responses varying among experimental settings. The functions
  of its shorter natural products are incompletely defined.
