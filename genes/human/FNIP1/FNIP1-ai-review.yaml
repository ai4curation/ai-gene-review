  review:
    action: KEEP_AS_NON_CORE
    summary: FNIP1 supports immature B-cell development through a metabolic and survival checkpoint.
    reason: The exact mouse donor Q68FD7 cites PMID:22608497. Fnip1-deficient mouse B-cell precursors
      fail to mature efficiently; mixed bone-marrow transplantation supports a cell-intrinsic defect,
      and re-expression of Fnip1 rescues B-cell development. Nutrient and survival perturbations place
      this requirement in a metabolic checkpoint rather than a lineage-specifying transcriptional activity.
      Human FNIP1 deficiency also reduces immature and peripheral B cells (PMID:32905580), but the sampled
      patient did not show the same overt maturation block as the mouse model. Retain the original ISS
      as a contextual developmental role.
