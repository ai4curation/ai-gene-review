  review:
    action: MODIFY
    summary: The inspected donor experiments support protection from B-cell apoptosis, the opposite regulatory
      direction.
    reason: The human ISS retains mouse FNIP1 Q68FD7 as its source. The donor GOA assigns the positive
      term from PMID:22608497, but the actual mouse Results show increased apoptosis after Fnip1 loss
      under pre-BCR stimulation, nutrient stress and Eμ-Myc expression; Annexin V/viability assays and
      the Discussion identify normal Fnip1 as supporting survival. PMID:22709692 independently finds increased
      pre-B-cell death and caspase activity after Fnip1 loss, with Bcl2 rescue. The evidence therefore
      supports negative regulation of B-cell apoptotic process in these contexts. Propose GO:0002903 while
      preserving the original positive term, source and ISS provenance; this is a source-direction correction,
      not a claim of direct caspase inhibition or universal anti-apoptotic activity.
