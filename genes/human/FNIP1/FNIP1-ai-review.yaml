  review:
    action: KEEP_AS_NON_CORE
    summary: FNIP1 participates in suppression of TFE3-dependent transcription in defined cell assays.
    reason: PMID:21209915 measures GPNMB promoter reporters and expression in human cells. FNIP1 expression
      suppresses TFE3-driven reporter activity in HT1080 cells, while FLCN/FNIP combinations strengthen
      selected effects; FNIP1 alone does not suppress GPNMB in FLCN-null UOK257 cells. This supports a
      contextual regulatory contribution through the FLCN–TFE pathway, not DNA binding or general RNA
      polymerase II repression by FNIP1. Preserve the original TFE3 participant extension and the distinction
      between promoter response and direct transcription-factor binding.
