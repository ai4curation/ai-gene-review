      gene induction and lysosomal expansion. FNIP1 knockout/reconstitution and the nonphosphorylatable
      mutant support negative regulation of lysosome organization in the tested human-cell conditions.
      This is a downstream contextual consequence of FNIP1’s FLCN-associated signaling role, not a direct
      lysosomal membrane-building or hydrolase activity and not a universal response of all natural products.
    supported_by:
    - reference_id: PMID:37079666
