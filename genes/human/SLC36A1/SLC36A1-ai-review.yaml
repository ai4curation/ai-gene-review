proposed_new_terms: []
suggested_questions:
- question: Does human SLC36A1 at the lysosomal membrane function as a nutrient
    transceptor that signals amino-acid sufficiency to mTORC1, as suggested for its
    Drosophila and mammalian orthologs, and if so is the signalling role separable from
    its transport activity?
- question: What is the quantitative contribution of lysosomal PAT1-mediated efflux to
    cytosolic amino-acid pools relative to other lysosomal exporters (e.g. SLC38A9,
    SLC66 family), and under what physiological conditions does the lysosomal versus
    apical plasma-membrane pool of PAT1 predominate?
suggested_experiments:
- description: Generate endogenous-level, differentially tagged SLC36A1 knock-in cell
    lines (e.g. split-tags resolving plasma-membrane vs lysosomal pools) and quantify the
    partitioning and flux of each pool, combined with substrate-flux assays to measure
    lysosomal amino-acid efflux directly.
- description: Test whether loss of SLC36A1 alters mTORC1 activity (phospho-S6K/4E-BP1)
    in response to amino-acid refeeding, using isogenic knockout cells, and determine
    whether transport-dead mutants (e.g. Cys180/Cys329 substitutions) retain any
    signalling function to distinguish transporter from transceptor roles.
knowledge_gaps:
- gap_statement: Whether, and by what molecular mechanism, lysosomal SLC36A1 couples
    amino-acid efflux to mTORC1 amino-acid sensing in human cells is not established.
  boundary: PAT1's proton-coupled transport of small neutral amino acids and its dual
    apical plasma-membrane/lysosomal-membrane localization are firmly established; the
    efflux role is inferred by similarity to the rodent ortholog.
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  significance: Resolving this would clarify whether PAT1 is a passive lysosomal exporter
    or an active signalling node linking lysosomal proteolysis to cell growth control.
  provenance:
  - reference_id: file:human/SLC36A1/SLC36A1-uniprot.txt
    supporting_text: May be involved in the efflux from the lysosomal compartment of
      neutral amino acids resulting from proteolysis
