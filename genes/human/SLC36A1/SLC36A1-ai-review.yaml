core_functions:
- description: >-
    Electrogenic proton-coupled symport of small, zwitterionic neutral amino acids and
    related amino compounds across a membrane. PAT1 binds a proton and a substrate
    (glycine, L-alanine, L-proline, their D-enantiomers, GABA, beta-alanine, taurine)
    and co-translocates them in the same direction, energized by the inwardly directed
    electrochemical proton gradient; an essential Cys180-Cys329 disulfide bond organizes
    the substrate-binding site.
  molecular_function:
    id: GO:0005280
    label: amino acid:proton symporter activity
  directly_involved_in:
