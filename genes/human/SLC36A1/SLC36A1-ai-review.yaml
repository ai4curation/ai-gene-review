id: Q7Z2H8
gene_symbol: SLC36A1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  SLC36A1 (PAT1/LYAAT1) is an electrogenic, proton-coupled (H+-dependent) symporter
  for small, zwitterionic neutral amino acids and related amino compounds. It
  co-transports a proton down its electrochemical gradient together with a substrate
  such as glycine, L-alanine, L-proline, their D-enantiomers, and derivatives
  including GABA (4-aminobutanoate), beta-alanine and taurine; transport is
  Na+/Cl--independent, pH-dependent (acidic optimum) and of relatively low affinity
  but high capacity. The protein is a multi-pass (11 transmembrane helix) membrane
  protein of the amino acid/polyamine transporter 2 (APC superfamily) family, with a
  disulfide bond (Cys180-Cys329) essential for substrate binding. SLC36A1 shows dual
  localization at the apical brush-border membrane of intestinal enterocytes, where
  it mediates absorption of dietary small neutral amino acids and amino-acid-like
  drugs, and at the lysosomal membrane, where it is implicated in the efflux of
  neutral amino acids generated by lysosomal proteolysis back to the cytosol. Through
  these activities it contributes to intestinal and renal amino-acid handling and to
  lysosomal amino-acid homeostasis.
