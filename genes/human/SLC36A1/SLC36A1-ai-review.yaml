  qualifier: enables
  review:
    summary: Taurine transport by PAT1 was mis-mapped to an ATP-driven ABC-type taurine
      transporter activity.
    action: MODIFY
    reason: The experimental evidence (PMID:19074966) is sound and shows PAT1 transports
      taurine, but the GO term is biochemically wrong. GO:0015411 is defined as an
      ATP-driven ABC-type transporter (ATP + H2O + taurine(out) = ADP + phosphate +
      taurine(in)). PAT1 is an H+-coupled secondary-active symporter with no ATPase
      activity and does not hydrolyse ATP. The correct, mechanism-neutral molecular
      function is taurine transmembrane transporter activity (GO:0005368), which this
      row's own IDA evidence supports.
    proposed_replacement_terms:
    - id: GO:0005368
      label: taurine transmembrane transporter activity
