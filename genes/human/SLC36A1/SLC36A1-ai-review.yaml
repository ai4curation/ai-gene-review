        PAT1 and TauT.
    source_defects:
    - defect_type: WRONG_TERM
      asserted_value: GO:0015411 (ABC-type taurine transporter transporter activity)
      corrected_value: GO:0005368 (taurine transmembrane transporter activity)
      resource: ARUK_UCL
