core_functions:
- description: GABBR1 is the GABA-binding subunit of the obligate GABBR1-GABBR2 GABA-B receptor. Agonist binding
    closes the GABBR1 Venus-flytrap domain, and the heterodimer activates Gi/o proteins through GABBR2, inhibiting
    adenylyl cyclase and releasing G-beta-gamma that opens Kir3 channels and inhibits voltage-gated calcium channels.
  contributes_to_molecular_function:
    id: GO:0004965
    label: G protein-coupled GABA receptor activity
  in_complex:
    id: GO:1902712
    label: G protein-coupled GABA receptor complex
  locations:
  - id: GO:0005886
    label: plasma membrane
  directly_involved_in:
  - id: GO:0007214
    label: gamma-aminobutyric acid signaling pathway
  - id: GO:0007193
    label: adenylate cyclase-inhibiting G protein-coupled receptor signaling pathway
  supported_by:
  - reference_id: PMID:24305054
    supporting_text: The agonists and antagonists are anchored in the interdomain crevice of GBR1 by an overlapping
      set of residues
  - reference_id: PMID:22660477
    supporting_text: GBR1 is responsible for ligand-binding and GBR2 is responsible for G protein coupling
  - reference_id: PMID:9872316
    supporting_text: Co-expression of the two receptors produces a fully functional GABA(B) receptor at the cell
      surface
  - reference_id: PMID:9844003
    supporting_text: Presynaptic GABABRs inhibit neurotransmitter release by down-regulating high-voltage activated
      Ca2+ channels, whereas postsynaptic GABABRs decrease neuronal excitability by activating a prominent inwardly
      rectifying K+ (Kir) conductance
- description: 'Presynaptic GABBR1-containing receptors inhibit transmitter release: GABBR1a/b autoreceptors on
    GABAergic terminals reduce GABA release, and sushi-domain-targeted GABBR1a heteroreceptors on glutamatergic
    terminals reduce glutamate release.'
  contributes_to_molecular_function:
