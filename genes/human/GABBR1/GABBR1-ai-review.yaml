suggested_questions:
- question: Which publication did ComplexPortal intend for the three GABBR1 rows (and the matching GABBR2 rows)
    that cite the unrelated PMID:987231?
- question: Does the peripheral, secreted GABBR1e isoform act as a physiological antagonist of GABA-B signalling
    in tissues such as kidney and lung?
- question: Which extracellular partners of the GABBR1a sushi domains, if any, underlie the projected extracellular
    matrix protein binding annotation?
suggested_experiments:
- hypothesis: NEDLC-associated GABBR1 variants that keep normal GABA potency but lower efficacy (p.Ala397Val, p.Ala535Thr)
    impair the GABBR1 conformational change transmitted to GABBR2.
  description: Measure ectodomain closure and transmembrane-interface rearrangement (intersubunit FRET or BRET sensors)
    alongside Gi activation for each variant coexpressed with GABBR2, in cells with matched surface expression.
- hypothesis: Presynaptic heteroreceptor inhibition of glutamate release in human neurons depends on GABBR1a sushi-domain
    targeting.
  description: In human iPSC-derived glutamatergic neurons, compare baclofen inhibition of evoked EPSCs after selective
    GABBR1a knockout versus GABBR1b knockout, with axonal immunolabelling of GABBR1.
