  review:
    summary: Phylogenetically inherited GABA-B receptor activity; GABBR1 is the GABA-binding subunit of the receptor.
    action: ACCEPT
    reason: The PAINT node PTN000054983 places GABA-B receptor activity in the GABA-B receptor clade, which contains
      GABBR1 and its fly, worm and rodent orthologues. Human structures place the orthosteric GABA and baclofen
      site in the GABBR1 Venus-flytrap domain, and functional receptor activity requires coassembly with GABBR2.
      The activity is a property of the heterodimer to which GABBR1 contributes the ligand-binding site.
