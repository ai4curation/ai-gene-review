id: Q9UBS5
gene_symbol: GABBR1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'GABBR1 encodes GABA-B receptor subunit 1, the agonist-binding subunit of the metabotropic GABA-B receptor,
  a class C G protein-coupled receptor that functions only as an obligate heterodimer with GABBR2. GABA, baclofen
  and competitive antagonists bind in the cleft of the GABBR1 extracellular Venus-flytrap domain; GABBR2 couples
  the dimer to Gi/o proteins. Released G-beta-gamma activates Kir3 (GIRK) potassium channels and inhibits high-voltage-activated
  calcium channels, while G-alpha-i/o inhibits adenylyl cyclase. GABBR1 alone is held in the endoplasmic reticulum
  by a C-terminal RXR(R) retention motif that is masked by coiled-coil assembly with GABBR2, allowing surface delivery.
  Two main isoforms differ at the N terminus: GABBR1a carries two sushi domains that target it to axons, where it
  forms presynaptic heteroreceptors inhibiting glutamate release, whereas GABBR1b predominates postsynaptically;
  both form presynaptic autoreceptors inhibiting GABA release. GABBR1-containing receptors mediate slow inhibitory
  postsynaptic potentials and presynaptic inhibition throughout the brain. Loss of Gabbr1 in mice abolishes all
  GABA-B responses and causes seizures, hyperalgesia and memory impairment, and de novo GABBR1 missense variants
  that impair receptor activation cause a neurodevelopmental disorder with language delay and variable cognitive
  abnormalities.'
