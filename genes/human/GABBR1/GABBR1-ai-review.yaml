  review:
    summary: Intracellular GABBR1 pools are membrane-bound (ER and secretory pathway), not free in the cytoplasm.
    action: MARK_AS_OVER_ANNOTATED
    reason: GABBR1 is a multipass membrane protein. Immunogold studies find much GABBR1 label inside neuronal cell
      bodies, consistent with an intracellular reserve retained in the secretory pathway until it assembles with
      GABBR2 (RXR(R) ER-retention signal). Cytoplasm is therefore an imprecise, over-broad reading of intracellular
      membrane pools; the functional location is the plasma membrane.
    additional_reference_ids:
