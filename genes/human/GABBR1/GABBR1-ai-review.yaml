  review:
    summary: Ensembl projection from rat Gabbr1 of a bone-cell phenotype; not a function of the GABBR1 receptor
      in human.
    action: MARK_AS_OVER_ANNOTATED
    reason: This Ensembl Compara row transfers a rat annotation (Q9Z0U4). GABA-B receptor expression has been reported
      outside the nervous system, but GABBR1 acts as a receptor subunit that signals through Gi/o proteins; it does
      not carry out the steps of osteoblast differentiation, and no human evidence was found. A receptor-mediated
      influence on a differentiation readout is at most indirect. Marked as over-annotation rather than removed
      because the rat source paper was not examined.
