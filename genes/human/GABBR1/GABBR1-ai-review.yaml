  review:
    summary: GABA-B receptor activity is correct for GABBR1; the cited abstract describes GABBR2 expressed without
      GABBR1.
    action: ACCEPT
    reason: The PMID:10328880 abstract reports GABBR2 coupling to adenylyl cyclase in CHO cells lacking GABABR1;
      it does not report a GABBR1 assay. The full text, which may contain GABBR1 experiments, was not available,
      so the curator's attribution is not overruled. The function itself is firmly established for GABBR1 by human
      structural and coexpression studies, so the row is accepted on the biology. Later work showed that GABBR2
      alone does not bind GABA, so the paper's GABBR2-homomer interpretation is disputed.
