    label: structural constituent of postsynapse
  evidence_type: IMP
  original_reference_id: PMID:29429936
  qualifier: enables
  review:
    summary: ACTN1 rescue and separation-of-function mutants support a postsynaptic structural role.
    action: ACCEPT
    reason: PMID:29429936 uses combined alpha-actinin-1/-2/-4 knockdown followed by shRNA-insensitive
      ACTN1 rescue in cultured rat hippocampal neurons. WT ACTN1 supports postsynaptic organization,
      whereas PSD-95-binding-defective ACTN1 variants impair targeting without reducing total PSD-95
      or spine F-actin. The experiment demonstrates ACTN1 structural capacity, not unique isoform
      essentiality or an experiment in human neurons.
    supported_by:
    - reference_id: PMID:29429936
      supporting_text: α-actinin-1*WT allowed for rescue with substantial though not complete replacement
        of endogenous α-actinin in cultured neurons
