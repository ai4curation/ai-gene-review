id: P12814
gene_symbol: ACTN1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ACTN1 encodes alpha-actinin-1, a dimeric actin-filament crosslinker that organizes stress
  fibers and cortical actin networks and connects them to adhesion complexes. Its actin-binding domains
  and antiparallel dimer architecture support filament bundling, while integrin and vinculin interactions
  help anchor the cytoskeleton at membrane contacts. Alternative splicing changes calcium regulation
  of the C-terminal region. ACTN1-dependent actin organization contributes to megakaryocyte proplatelet
  architecture and normal platelet size. In neuronal experiments, ACTN1 also anchors PSD-95 and supports
  postsynaptic receptor organization. Pathogenic variants cause autosomal dominant macrothrombocytopenia.
