- term:
    id: GO:0005829
    label: cytosol
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-6809663
  qualifier: located_in
  review:
    summary: "Reactome cytosol placement (Formation of hair keratin fibres); KAPs are synthesized in the cytoplasm of keratinizing cortical cells but act in the keratin matrix."
    action: KEEP_AS_NON_CORE
    reason: "Keratin-associated proteins are non-membrane proteins synthesized in the cytoplasm of differentiating (keratinizing) hair or wool cortical cells, so a cytoplasmic/cytosolic placement is true of the newly made protein. It is not the site of function: KAPs act in the interfilamentous matrix around trichocyte keratin intermediate filaments of the keratinized cell, which this review captures with keratin filament (GO:0045095). The placement is correct but peripheral, so it is kept as non-core rather than marked as over-annotated; ARBA IEA and Reactome TAS cytosol rows are treated identically across the KRTAP family reviews."
    supported_by:
    - reference_id: Reactome:R-HSA-6809663
      supporting_text: In the lower and middle cortex, keratin filaments are embedded in a matrix that consists of KAPs.
    - reference_id: file:human/KRTAP17-1/KRTAP17-1-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: '[hair keratin-]associated proteins (KRTAP), which are essential for the formation of a rigid and resistant hair shaft through their extensive disulfide bond cross-linking with abundant cysteine residues of hair keratins'
- term:
    id: GO:0045095
    label: keratin filament
  evidence_type: TAS
  original_reference_id: PMID:16382671
  qualifier: located_in
  review:
    summary: Proposed keratin filament location for KRTAP17-1, the defining location of hair keratin-associated proteins.
    action: NEW
    reason: KRTAP17-1 is a member of a characterized hair KAP family; KAPs are matrix proteins that surround and cross-link hair keratin intermediate filaments in the hair fibre. GOA lacks any informative location for this gene (only cytosol), whereas related KAPs carry keratin filament via the InterPro keratin-matrix signature, which this sequence does not match. GO has no separate term for the keratin-associated matrix, so keratin filament is the closest location.
    supported_by:
    - reference_id: PMID:16382671
      supporting_text: Hair keratin-associated proteins (KAP) are a major component of the hair fiber, and play crucial roles in forming a strong hair shaft through a cross-linked network with keratin intermediate filaments (KIF), which are produced from hair keratins
    - reference_id: Reactome:R-HSA-6809663
      supporting_text: KAPs forming extensive disulfide cross-links with keratin filaments
    - reference_id: file:human/KRTAP17-1/KRTAP17-1-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: '[hair keratin-]associated proteins (KRTAP), which are essential for the formation of a rigid and resistant hair shaft through their extensive disulfide bond cross-linking with abundant cysteine residues of hair keratins'
    - reference_id: PMID:11279113
      supporting_text: contained 37 genes for high/ultrahigh sulfur hair keratin-associated proteins (KAPs), which could be divided into a total of 7 KAP multigene families
- term:
    id: GO:0030281
    label: structural constituent of cutaneous appendage
  evidence_type: TAS
  original_reference_id: PMID:18721477
  qualifier: enables
  review:
    summary: Proposed structural constituent of cutaneous appendage for KRTAP17-1, a hair-fibre matrix protein.
    action: NEW
    reason: KAPs (both high/ultrahigh-sulfur and high glycine-tyrosine groups) are structural components of the hair/wool fibre matrix that are essential for rigid and resistant hair shafts. GO:0030281 (definition explicitly covers hairs) is the same MF proposed as the replacement for 'structural molecule activity' on the other KAPs in this family.
    supported_by:
    - reference_id: PMID:18721477
      supporting_text: 'KRTAP contains two major groups: high/ultrahigh cysteine (HS) and high glycine-tyrosine (HGT) that are considered to have originated independently, and are essential for the formation of rigid and resistant hair shafts through their extensive disulfide bond cross-linking with the abundant cysteine residues of hair keratins or hydrophobic interactions with keratins'
