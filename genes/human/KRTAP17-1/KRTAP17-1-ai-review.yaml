id: Q9BYP8
gene_symbol: KRTAP17-1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: KRTAP17-1 (keratin-associated protein 17-1, KAP17.1) is a small (105 aa) cysteine- and glycine-rich hair keratin-associated protein, cloned from human scalp and encoded in the chromosome 17q12-21 high/ultrahigh sulfur KAP gene cluster that lies within the type I keratin gene domain. Like other KAPs it is a component of the interfilamentous matrix of the hair fibre, in which hair keratin intermediate filaments are embedded and extensively disulfide cross-linked. IgG autoreactivity against KRTAP17-1 has been reported in a subset of atopic dermatitis patients, a finding not linked to its normal structural role.
