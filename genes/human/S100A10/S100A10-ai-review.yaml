id: P60903
gene_symbol: S100A10
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: S100A10 (p11, annexin A2 light chain) is a small S100-family EF-hand protein that, uniquely
  in the family, has lost calcium binding and exists as a constitutive tight homodimer that mimics the
  Ca2+-activated conformation of other S100 proteins. Each S100A10 dimer binds the N-terminal acetylated
  peptides of two annexin A2 (ANXA2) molecules to form the (S100A10)2(ANXA2)2 heterotetramer (calpactin
  I, AIIt), which is anchored at the cytoplasmic face of the plasma membrane and in lipid rafts. Within
  this complex S100A10 provides hydrophobic binding surfaces that recruit cytoplasmic tails of membrane
  proteins and other partners. It promotes the trafficking and surface presentation of ion channels and
  receptors, including the K+ channel TASK-1 (KCNK3), the sodium channel NaV1.8 (SCN10A), the epithelial
  Ca2+ channels TRPV5/TRPV6, the serotonin 5-HT1B receptor and the chemokine receptor CCR10. It also bridges
  ANXA2 to the large scaffold AHNAK, linking the complex to cortical actin organization and membrane repair.
  At the cell surface, S100A10 acts as a plasminogen receptor whose C-terminal lysines bind plasminogen
  and accelerate t-PA-dependent plasmin generation, contributing to fibrinolysis in vivo. A minor nuclear
  pool in complex with ANXA2 binds the chromatin remodeler SMARCA3 (HLTF), enhancing its DNA binding and
  nuclear-matrix retention; in mouse brain this p11-SMARCA3 pathway is required for behavioral and neurogenic
  responses to antidepressants.
