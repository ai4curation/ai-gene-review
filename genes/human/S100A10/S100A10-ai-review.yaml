suggested_questions:
- question: How does S100A10 reach the outer leaflet/cell surface to act as a plasminogen receptor, given
    that it lacks a signal peptide and its partner ANXA2 is also cytosolic?
- question: Is a molecular-function term for plasminogen binding (cofactor of t-PA-mediated plasminogen
    activation) warranted for S100A10, analogous to other cell-surface plasminogen receptors?
- question: Does S100A10 promote surface delivery of channels and receptors only as part of the AnxA2-p11
    heterotetramer, or can free S100A10 dimers (stabilized against degradation) act independently?
- question: Is the AnxA2-p11-dependent regulation of SMARCA3 relevant outside the hippocampal antidepressant
    context, e.g. in PAI-1 transcription in endothelial cells?
suggested_experiments:
- hypothesis: S100A10 is required for surface delivery of its channel partners in vivo independent of
    ANXA2.
  description: Compare surface biotinylation of TASK-1, NaV1.8 and TRPV5 in S100a10-null versus Anxa2-null
    primary cells, rescuing with S100A10 mutants that cannot bind ANXA2 (e.g. C83 or hydrophobic-pocket
    mutants).
  experiment_type: genetic and cell biology
- hypothesis: The C-terminal lysines of S100A10 are necessary for fibrinolysis in vivo.
  description: Knock-in mice expressing S100A10 lacking the C-terminal lysines, assessed for vascular
    fibrin deposition, thrombus clearance and endothelial plasmin generation.
  experiment_type: in vivo genetics
