id: P25063
gene_symbol: CD24
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CD24 (heat-stable antigen ortholog) is a very small, heavily N- and O-glycosylated sialomucin-like
  protein whose mature peptide of about 30 residues is attached to the outer leaflet of the plasma membrane
  by a glycosylphosphatidylinositol (GPI) anchor, concentrating it in lipid rafts. Lacking a cytoplasmic
  domain, it signals by clustering with raft-associated Src-family kinases such as LYN and FGR. Its glycans
  make it a ligand for P-selectin, supporting adhesion of carcinoma cells to platelets and endothelium,
  and its sialylated form is the principal protein ligand of the inhibitory receptor Siglec-10 on macrophages
  and other innate immune cells. Through Siglec-10 CD24 dampens inflammatory responses to damage-associated
  molecular patterns such as HMGB1 and HSP70/90, and on tumour cells it acts as an anti-phagocytic "don't
  eat me" signal. It is expressed on B-cell precursors and mature resting B cells, granulocytes, activated
  T cells, epithelia and many carcinomas, and modulates B-cell activation and apoptosis, chemokine receptor
  (CXCR4) function and renal progenitor differentiation.
