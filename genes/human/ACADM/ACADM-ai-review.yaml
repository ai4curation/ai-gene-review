      source_entities:
      - source_id: UniProtKB:P45952
        source_status: SUPPORTS_TRANSFER
        comment: The historical MGI donor annotation traces to PMID:18459129 and context-dependent hepatic
          gluconeogenic flux changes. This supports a secondary metabolic regulatory role with the mouse
          LPS-stress limitation retained.
      - source_id: ensembl:ENSMUSP00000072483
