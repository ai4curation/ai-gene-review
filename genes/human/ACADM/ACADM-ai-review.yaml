id: P11310
gene_symbol: ACADM
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ACADM encodes mitochondrial medium-chain acyl-CoA dehydrogenase (MCAD), a soluble matrix
  flavoenzyme that catalyzes the initial dehydrogenation step of fatty acid beta-oxidation. The mature
  homotetramer contains one FAD per subunit and converts acyl-CoA substrates to trans-2-enoyl-CoA, transferring
  electrons to electron transfer flavoprotein (ETF). Its preferred substrates have medium-length chains,
  with maximal activity near C6-C8; its substrate range also includes shorter and longer chains. This
  activity supports energy production from fat, especially during fasting. Biallelic loss-of-function
  variants cause MCAD deficiency, with impaired tolerance of catabolic stress; many missense variants
  disrupt protein folding, stability, or tetramer assembly.
