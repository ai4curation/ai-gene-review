core_functions:
- description: Catalyzes FAD-dependent, ETF-coupled alpha,beta-dehydrogenation of medium-chain acyl-CoA
    esters to trans-2-enoyl-CoA in the mitochondrial matrix, performing the first reaction of the beta-oxidation
    cycle. The active enzyme is a homotetramer with one bound FAD per subunit and a substrate preference
    centered on C6-C8; overlapping shorter/longer substrate activities do not imply equal physiological
    contributions.
  molecular_function:
    id: GO:0070991
    label: medium-chain fatty acyl-CoA dehydrogenase activity
