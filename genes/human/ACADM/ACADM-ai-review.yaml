  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  review:
    summary: Mouse MCAD deficiency alters gluconeogenic flux specifically during the LPS-induced acute
      phase response.
    action: KEEP_AS_NON_CORE
    reason: The 2023-03-10 MGI comparative GO graph explicitly traces mouse Acadm (MGI:87867; UniProtKB:P45952)
      to an IMP annotation from PMID:18459129 / MGI:4412440. This resolves the historical source chain,
      without claiming the graph is a current GOA snapshot. Quantitative flux measurements in the primary
      abstract show about 20% lower de novo G6P synthesis during the acute phase response, with no reduction
      during fasting alone. Retain a contextual contribution to regulation of gluconeogenesis through
      metabolic coupling, rather than a second core enzyme function or a claim of direct transcriptional
      regulation. The experiment is mouse liver under defined metabolic stress; it does not establish
      constitutive control in every human tissue.
