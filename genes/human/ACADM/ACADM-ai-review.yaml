      of aggregates
proposed_new_terms: []
suggested_questions:
- question: What experiments resolve genuine ACADM residence in sperm nuclei, beyond identification in
    a purified nuclear proteome?
- question: What mechanism connects MCAD-dependent fatty-acid oxidation to the CoA-linked carnitine process
    beyond altered acylcarnitine pools, and how do the mouse stress-dependent glucose-flux findings translate
    to human tissues?
- question: What proportion of human MCAD activity on short- and long-chain substrates contributes to
    physiological flux in different tissues, compared with its dominant medium-chain role?
