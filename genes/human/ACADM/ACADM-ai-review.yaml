- term:
    id: GO:0005978
    label: glycogen biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  review:
    summary: Mouse MCAD deficiency changes hepatic glucose-6-phosphate partitioning toward glycogen under
      fasting and inflammatory stress.
    action: MARK_AS_OVER_ANNOTATED
    reason: The 2023-03-10 MGI comparative GO graph explicitly traces mouse Acadm (MGI:87867; UniProtKB:P45952)
      to an IMP annotation from PMID:18459129 / MGI:4412440. This resolves the historical source chain,
      without claiming the graph is a current GOA snapshot. The primary abstract reports increased allocation
      of newly formed G6P to glycogen, not an ACADM-catalyzed glycogen-forming step. The independent reviewer
      inspected the corresponding methods/results in the author thesis chapter; the discussion was not
      recovered. The observed metabolic coupling is real, but assigning participation in glycogen biosynthesis
      overstates the demonstrated role of this fatty-acid oxidation enzyme. No claim of an erroneous ortholog
      identity or fabricated donor annotation is made.
    additional_reference_ids:
    - PMID:18459129
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      source_entities:
      - source_id: UniProtKB:P45952
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: The identified mouse Acadm donor has a historical IMP glycogen-biosynthesis annotation
          from PMID:18459129. The source measures glucose flux repartitioning after MCAD loss, providing
          weak evidence for assigning the enzyme itself to glycogen formation; this is a process-role
          issue, not an orthology error.
      - source_id: ensembl:ENSMUSP00000072483
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: The identified mouse Acadm donor has a historical IMP glycogen-biosynthesis annotation
          from PMID:18459129. The source measures glucose flux repartitioning after MCAD loss, providing
          weak evidence for assigning the enzyme itself to glycogen formation; this is a process-role
          issue, not an orthology error.
      failure_modes:
      - ROLE_CONFLATION
