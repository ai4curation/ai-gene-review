- id: PMID:25416781
  title: Human METTL20 is a mitochondrial lysine methyltransferase that targets the β subunit of electron
    transfer flavoprotein (ETFβ) and modulates its activity.
  findings:
  - statement: MCAD is one of the ETF-dependent dehydrogenases; methylation of ETFβ by METTL20 reduces
      ETF's ability to receive electrons from MCAD, confirming MCAD operates via ETF in beta-oxidation.
    supporting_text: METTL20-mediated methylation of ETFβ in vitro reduced its ability to receive electrons
      from the medium chain acyl-CoA dehydrogenase and the glutaryl-CoA dehydrogenase
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached primary text supports ETF methylation-dependent changes in electron transfer
      from MCAD. The recovered text includes abstract and discussion; complete assay methods were not
      recovered, so uninspected detailed conditions are not asserted.
