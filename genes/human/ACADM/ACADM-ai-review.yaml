- id: PMID:8823175
  title: 'Medium-long-chain chimeric human Acyl-CoA dehydrogenase: medium-chain enzyme with the active
    center base arrangement of long-chain Acyl-CoA dehydrogenase.'
  findings:
  - statement: The catalytic base of MCAD is Glu376 (mature numbering) on loop JK; its position (versus
      Glu255 on helix G in LCAD/IVD) is a key determinant of chain-length specificity, with native MCAD
      peaking at hexanoyl/octanoyl-CoA.
    supporting_text: The catalytically essential glutamate residue that initiates catalysis by abstracting
      the substrate alpha-hydrogen as H+ is located at position 376 (mature MCADH numbering) on loop JK
      in medium chain acyl-CoA dehydrogenase (MCADH)
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached primary abstract describes human wild type and engineered chimeras separately.
      The C6/C8 optimum is explicitly attributed to native MCAD, not transferred from the chimeric enzyme;
      full kinetic tables were not independently recovered.
