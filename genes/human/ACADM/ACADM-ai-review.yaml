- id: PMID:16020546
  title: Human acyl-CoA dehydrogenase-9 plays a novel role in the mitochondrial beta-oxidation of unsaturated
    fatty acids.
  findings:
  - statement: The abstract describes ACAD9 mitochondrial membrane association. That abstract sentence
      alone does not establish MCAD localization; the separate MCAD fractionation experiment in the full
      article is assessed in reference_review and the annotation reasons.
    supporting_text: Submitochondrial fractionation studies found native ACAD-9 to be associated with
      the mitochondrial membrane
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached abstract and author-uploaded full primary article inspected, especially Figure
      5 and submitochondrial localization results. MCAD itself was assayed and detected in both fractions.
      The authors qualify membrane association; no paralog-miscitation inference is made.
- id: PMID:16972171
  title: Prolonged moderate-intensity exercise without and with L-carnitine supplementation in patients
    with MCAD deficiency.
  findings:
  - statement: Exercise raised plasma free fatty acids and octanoylcarnitine in MCAD-deficient patients.
      The authors interpret this as increased fatty-acid oxidation and suggest compensatory carnitine
      biosynthesis; these metabolite observations do not directly quantify successful MCAD reaction flux
      or establish ACADM catalysis of carnitine synthesis.
    supporting_text: A significant rise in plasma free fatty acids and octanoylcarnitine levels during
      exercise was seen in all patients, indicating a substantial increase in FAO during exercise
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Identifier/title and cached abstract checked against PubMed and author-institution record.
      Patient exercise metabolite responses are explicit; full text was not recovered, so exact carnitine-process
      participation remains unresolved.
- id: PMID:1731887
  title: Structural organization and regulatory regions of the human medium-chain acyl-CoA dehydrogenase
    gene.
  findings:
  - statement: Describes the genomic organization and regulatory regions of the human ACADM gene; supports
      mitochondrial localization (TAS).
    supporting_text: Medium-chain acyl-CoA dehydrogenase (MCAD) is a highly regulated mitochondrial flavo-enzyme
      that catalyzes the initial reaction in fatty acid beta-oxidation
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Cached primary abstract explicitly describes human MCAD as a mitochondrial flavoenzyme;
      this is statement support for the location, not a dedicated fractionation experiment.
- id: PMID:1902818
  title: 'Molecular characterization of medium-chain acyl-CoA dehydrogenase (MCAD) deficiency: identification
    of a lys329 to glu mutation in the MCAD gene, and expression of inactive mutant enzyme protein in
    E. coli.'
  findings:
  - statement: The human precursor Lys329Glu variant (mature K304E) produced inactive enzyme; impaired
      active-tetramer formation is offered as a probable explanation. Mature MCAD protein was detected
      within mitochondria.
    supporting_text: mutant MCAD, which was demonstrated to be inactive, probably because of the inability
      to form active tetrameric MCAD
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached primary abstract supports recombinant human variant inactivity and intramitochondrial
      protein. Tetramer failure is a probable explanation in this source, not a universal established
      mechanism.
- id: PMID:19224950
  title: Protein misfolding is the molecular mechanism underlying MCADD identified in newborn screening.
  findings:
  - statement: Wild-type recombinant human MCAD elutes as a homotetramer. The disease variants show heterogeneous
      defects in folding, assembly, stability or octanoyl-CoA kinetics, rather than one identical assembly
      defect in every variant.
    supporting_text: Wild-type MCAD was eluted in the tetrameric form with an almost negligible amount
      of aggregates
  - statement: MCAD is an ACAD-family flavoprotein that catalyzes the first step of mitochondrial beta-oxidation
      of medium-chain fatty acids.
    supporting_text: MCAD is a member of the acyl-CoA dehydrogenase (ACAD) family of flavoproteins, which
      catalyzes the first step of the mitochondrial β-oxidation of medium-chain fatty acids
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full cached primary text inspected, including octanoyl-CoA/ferricenium kinetics, wild-type
      and variant size-exclusion chromatography, and mature-protein variant numbering. Assay-specific
      Km values are not universal constants.
- id: PMID:1970566
  title: Characterization of wild-type and an active site mutant of human medium chain acyl-CoA dehydrogenase
    after expression in Escherichia coli.
  findings:
  - statement: Recombinant human MCAD is a yellow flavoprotein with stoichiometric FAD; the active-site
      glutamate (Glu376 mature numbering) is the catalytic proton-abstracting base, its mutation abolishing
      activity.
    supporting_text: The wild-type enzyme is a yellow protein due to the content of stoichiometric FAD
      and had a specific activity which is 50% of MCADH purified from pig kidney
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached primary abstract describes purified recombinant human wild type and catalytic-base
      mutant, FAD content and activity loss. Older mature-protein numbering is distinguished from precursor
      numbering.
- id: PMID:21237683
  title: Identification and characterization of new long chain acyl-CoA dehydrogenases.
  findings:
  - statement: Characterized the human ACAD family in cerebellum; MCAD was localized to the molecular
      layer and axons of specific neurons, supporting medium-chain dehydrogenase activity and neuronal
