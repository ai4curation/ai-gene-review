suggested_experiments:
- description: Quantitative substrate-profiling of purified recombinant human MCAD across C4-C16 saturated
    and unsaturated acyl-CoAs using the ETF-coupled assay, to define the precise chain-length boundaries
    and rank-order efficiency that justify the medium-chain vs long-chain MF annotations and to test whether
    the C14/C16 RHEA-derived long-chain annotations are physiologically meaningful.
- description: Use orthogonal localization assays and ACADM-specific peptide validation in purified human
    sperm nuclei to distinguish a genuine nuclear pool from preparation artifacts. In parallel, assess
    the reproducibility and physiological context of MCAD membrane association with controlled mitochondrial
    fractionation.
