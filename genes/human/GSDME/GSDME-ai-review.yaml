suggested_questions:
- question: Should the propanediol-specific wording in the current wide-pore-channel definition be corrected
    to match its established gasdermin usage?
- question: Can the original human cardiolipin-assay provenance be resolved independently of the verified
    mouse transfer?
- question: Which official splice products undergo physiological activation, and how do they differ from
    disease-associated truncations?
suggested_experiments:
- hypothesis: Granzyme B contributes to GSDME-dependent pyroptosis mainly by activating caspase-3 rather
    than by cleaving GSDME directly.
  description: In GSDME-expressing target cells, deliver purified granzyme B with perforin into wild-type
    and caspase-3-null backgrounds, and in parallel into cells expressing a GSDME in which the shared
    Asp270 site is mutated. Quantify N-terminal fragment release, lactate dehydrogenase release and apoptotic
    versus lytic morphology at matched enzyme concentrations. Reactome records that direct cleavage of
    GSDME by granzyme B is inefficient, so this would establish how much of the pyroptotic output of lymphocyte
    attack is routed through caspase-3.
  experiment_type: Protease epistasis with a cleavage-site mutant
- hypothesis: The GSDME N-terminal fragment forms the same kind of oligomeric membrane pore as the other
    gasdermins, justifying the wide pore channel activity annotation by direct structural evidence rather
    than by family inference.
  description: Reconstitute the purified GSDME N-terminal fragment into liposomes and planar lipid bilayers,
    measure single-pore conductance and cargo size cut-off, and determine the assembled pore by cryo-EM.
    Comparing conductance and subunit stoichiometry with published GSDMD and perforin pores would place
    GSDME on the same molecular-function term on its own evidence.
  experiment_type: Reconstitution electrophysiology plus cryo-EM
- hypothesis: GSDME expression determines whether cytotoxic lymphocyte attack kills a target cell by apoptosis
    or by pyroptosis, and this switch is what links it to anti-tumour immunity.
  description: Using isogenic tumour lines differing only in GSDME expression, measure the mode of death
    after attack by primary NK cells and by CAR T cells, scoring membrane rupture, IL-1-family release
    and the recruitment of bystander immune cells in vivo. A clean switch would support reading the pyroptosis
    annotations as the functionally dominant arm in GSDME-positive targets rather than a minor alternative.
  experiment_type: Isogenic GSDME-null and -replete killing assays
