id: O60443
gene_symbol: GSDME
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: GSDME (DFNA5) is a gasdermin precursor whose N-terminal cleavage product forms membrane pores,
  executing pyroptotic cell death. Caspase-3 and granzyme B can activate it by cleavage after Asp270.
  The active fragment can also permeabilize mitochondria and amplify apoptotic signaling. Deafness-associated
  aberrant splicing produces toxic truncations distinct from the physiological cleavage product.
