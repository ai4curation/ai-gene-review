  review:
    summary: Dystrophin actin-binding domain (Dys-ABD) binds K19 directly and specifically in COS-7 cells and in vitro.
    action: REMOVE
    reason: The interaction is real and important, but generic protein binding (GO:0005515) is uninformative. Its functional
      meaning - K19 filaments linking the costamere/dystrophin complex to the contractile apparatus - is captured by the existing
      costamere (GO:0043034) and structural constituent of muscle (GO:0008307) annotations from the same paper. There is no
      specific 'dystrophin binding' MF term in GO.
