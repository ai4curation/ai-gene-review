  review:
    summary: 'IBA: structural constituent of skin epidermis propagated across the type I keratin node.'
    action: MARK_AS_OVER_ANNOTATED
    reason: KRT19 is a simple/ductal epithelial keratin. In the interfollicular epidermis it is restricted to fetal germinative
      layers and rare basal cell nests, declining with epidermal maturation, so it does not make a significant contribution
      to the structural integrity of the epidermis (unlike KRT10/KRT14). This family-level propagation over-reaches for KRT19;
      KRT19 also lacks the tail domain of epidermal keratins.
    supported_by:
    - reference_id: PMID:23377137
      supporting_text: keratin-19 expression gradually decreased with epidermal maturation through gestation
    - &id006
      reference_id: PMID:2448790
      supporting_text: The DNA sequence encodes a protein of 44,098 Da, which is unique in that it lacks the terminal non-alpha-helical
        tail segment found in all other keratins
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - CONTEXT_OR_TISSUE_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN002757528
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Type I keratin node seeded by epidermal keratins (e.g. KRT10 P13645); the epidermal structural role does
          not hold for the simple-epithelial, tailless KRT19.
