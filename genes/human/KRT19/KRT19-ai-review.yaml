core_functions:
- description: 'Structural subunit of epithelial keratin intermediate filaments: heterodimerizes with type II keratins (mainly
    KRT8) and polymerizes into the cytoplasmic keratin filament network that confers mechanical integrity on simple and ductal
    epithelia.'
  molecular_function:
    id: GO:0005200
    label: structural constituent of cytoskeleton
  directly_involved_in:
