  review:
    summary: IBA propagation of morphogenesis of an epithelium across the type I keratin family node (PTN002757528).
    action: KEEP_AS_NON_CORE
    reason: Keratin filaments contribute to epithelial mechanical integrity, which is a structural contribution to epithelial
      tissue morphogenesis at the family level. There is no KRT19-specific evidence of an epithelial morphogenesis defect,
      so this is retained as a non-core, family-level inference rather than a core function.
