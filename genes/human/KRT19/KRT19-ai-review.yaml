suggested_questions:
- question: What does the tailless KRT19 rod contribute that KRT18 does not, given that both pair with KRT8 in simple epithelia
    and single K19-null mice show little epithelial phenotype?
- question: Are the reported scaffolding interactions of K19 (TGM2-Src, beta-catenin/RAC1, cyclin D3) properties of filamentous
    K19 or of a soluble pool, and do they occur in non-transformed epithelia?
- question: Should GO represent the selective binding of K19 to the dystrophin actin-binding domain with a more specific molecular
    function than protein binding (no 'dystrophin binding' term currently exists)?
suggested_experiments:
- hypothesis: K19 is required for keratin network resilience in cholangiocytes under mechanical or toxic stress.
  description: Compare keratin network integrity, cell fragility and injury susceptibility in biliary organoids from Krt19-null
    versus wild-type mice, and in human cholangiocyte organoids with KRT19 knockout, under stretch and bile-acid challenge.
  experiment_type: genetic perturbation
- hypothesis: Filamentous rather than soluble K19 mediates signalling-scaffold interactions reported in cancer cells.
  description: Express assembly-incompetent K19 rod mutants versus wild type in KRT19-knockout MCF7 cells and test binding
    to beta-catenin, cyclin D3 and TGM2 by proximity labelling and co-immunoprecipitation.
  experiment_type: biochemical / cell biology
