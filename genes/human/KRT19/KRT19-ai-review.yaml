id: P08727
gene_symbol: KRT19
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: KRT19 encodes keratin 19 (K19, CK19), the smallest type I (acidic) keratin and the only intermediate filament
  protein lacking a C-terminal tail domain. As an obligate heteropolymer partner of type II keratins, chiefly KRT8 in simple
  epithelia, it forms parallel coiled-coil heterodimers that assemble into cytoplasmic keratin intermediate filaments, providing
  mechanical resilience to simple and ductal epithelia (biliary, gastrointestinal, mammary, urothelial) and to basal cells
  of the hair follicle outer root sheath and fetal epidermis. In striated muscle, K19-containing filaments concentrate at
  costameres, bind the actin-binding domain of dystrophin and link the sarcolemma to the contractile apparatus; K19-null mice
  develop a mild myopathy with costamere disruption. KRT19 is a widely used marker of cholangiocytes, epithelial progenitors
  and carcinoma cells, and has been reported to act as a signalling scaffold (Src/TGM2, beta-catenin/RAC1, cyclin D3) in cancer
  cell lines.
