core_functions:
- description: GTP-dependent recruitment of peripheral effectors (the GARP tethering complex and ARMH3)
    to the trans-Golgi network membrane, supporting endosome-to-TGN retrograde transport. Experimentally
    shown for human ARL5A (localisation, GARP-recruitment rescue, ARMH3 binding, Arl5a-specific shRNA
    effect); loss-of-function largely paralog-combined with ARL5B.
  molecular_function:
    id: GO:0003924
    label: GTPase activity
  directly_involved_in:
