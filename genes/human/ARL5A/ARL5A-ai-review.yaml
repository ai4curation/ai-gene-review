  label: Homo sapiens
description: 'ARL5A is a small GTPase of the ARF family (ARF-like protein 5A) that acts as a nucleotide-dependent
  molecular switch at the trans-Golgi network (TGN). It is N-terminally myristoylated and has an N-terminal
  amphipathic helix and a canonical G domain (crystal structures with bound guanine nucleotide). Membrane
  association at the TGN depends on the upstream ARF-family GTPase ARFRP1 and its membrane anchor SYS1.
  In its GTP-bound form ARL5A, together with its close paralog ARL5B, recruits peripheral effectors to
  the TGN: the GARP tethering complex, which promotes SNARE-dependent fusion of endosome-derived retrograde
  carriers, and the armadillo-repeat protein ARMH3, which bridges to and activates phosphatidylinositol
  4-kinase IIIbeta (PI4KB) to generate TGN PI4P. ARL5A thereby contributes to endosome-to-TGN retrograde
  transport of cargo such as TGN46, mannose 6-phosphate receptors and Shiga toxin, including amino-acid-stimulated
  retrograde trafficking linked to its interaction with the Ragulator complex. Most loss-of-function data
  are from combined ARL5A/ARL5B depletion; ARL5A is expressed at lower levels than ARL5B in HeLa cells.'
