  review:
    summary: GTPase activity inferred from the ARF/SAR small GTPase InterPro signature. ARL5A has an intact
      G1/P-loop, G3/DxxG (including the switch II Gln70) and G4/NKxD motif set, crystallises with a guanine
      nucleotide, and behaves as a nucleotide switch in cells (Q70L GTP-locked and T30N GDP-locked mutants
      have opposite effector-binding and localisation behaviour).
    action: ACCEPT
    reason: 'GTPase activity is the conventional molecular-function term for an Arf-family molecular switch
      and is the activity through which ARL5A acts (GTP-dependent effector recruitment). Note for downstream
      transfer: intrinsic GTP hydrolysis by ARL5A has not been measured directly, and no ARL5-specific
      GAP has been identified; the assignment rests on family membership, the conserved switch II glutamine
      and the opposite behaviour of the Q70L (hydrolysis-deficient) and T30N mutants. The PTHR11711 family
      review holds this term at UNRESOLVED scope family-wide, but for the ARL5 clade the catalytic glutamine
      is retained and the mutant behaviour is consistent with a working GTPase cycle.'
