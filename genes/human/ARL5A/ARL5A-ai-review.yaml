suggested_questions:
- question: Does ARL5A have any function not shared with ARL5B, given that nearly all loss-of-function
    data are from combined depletion and ARL5A is low-abundance in HeLa cells?
- question: Is the 'hARL5' studied by Lin et al. 2002 (nuclear/nucleolar, HP1alpha-binding; mutants T35N/Q80L)
    actually ARL5A, and is any nuclear pool of ARL5A reproducible?
- question: Should the ARL5-ARMH3-PI4KB axis be represented as regulation of PI4P synthesis on ARL5A,
    or only on ARMH3/PI4KB, given that ARL5A performs no step of the kinase reaction?
suggested_experiments:
- description: Rescue ARL5A/ARL5B double-KO HeLa cells with ARL5A alone (WT, Q70L, T30N) and measure GARP
    and ARMH3 TGN recruitment, TGN46 and STxB retrograde delivery, and TGN PI4P.
  hypothesis: ARL5A alone is sufficient for all ARL5 functions at the TGN.
- description: Measure intrinsic and GAP-stimulated GTP hydrolysis and nucleotide exchange of purified
    myristoylated ARL5A, including testing Ragulator and ARFRP1 as candidate GEFs.
  hypothesis: ARL5A is a catalytically competent GTPase whose activation at the TGN is promoted by a defined
    exchange factor.
