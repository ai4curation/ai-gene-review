proposed_new_terms: []
suggested_questions:
- question: >-
    MCT8 is placed under active/secondary-active transmembrane transporter activity in the GO is_a hierarchy
    (GO:0015349 is_a GO:0015291), yet it is experimentally a facilitative, energy-independent, uncoupled
    transporter. Should the ontology placement of thyroid hormone transmembrane transporter activity, or a
    MCT8-specific facilitative term, be revised?
- question: >-
    What determines the strong directional/physiological asymmetry of MCT8 (net brain T3 uptake across the BBB
    in humans) given that transport is equilibrative in vitro, and how do cellular deiodinase activity and
    hormone gradients set the effective direction?
suggested_experiments:
- description: >-
    Quantitative flux and electrophysiology on purified, reconstituted human MCT8 (now that cryo-EM structures
    exist) to confirm uncoupled facilitated diffusion, define the full iodothyronine/iodotyrosine selectivity
    profile and apparent affinities, and test ion-independence directly.
- description: >-
    Cell-type-specific conditional Mct8 models combined with intracellular T3 reporters to dissect how MCT8
    transport at the BBB endothelium versus neurons shapes brain thyroid hormone status, informing the
    pathophysiology of Allan-Herndon-Dudley syndrome.
