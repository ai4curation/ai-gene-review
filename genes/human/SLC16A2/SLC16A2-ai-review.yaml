id: P36021
gene_symbol: SLC16A2
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  SLC16A2 encodes MCT8 (monocarboxylate transporter 8), a specific, facilitative
  (equilibrative) thyroid hormone transmembrane transporter. Despite its name and
  membership in the SLC16/MCT (major facilitator superfamily) family, MCT8 does not
  transport the classic monocarboxylates (lactate, pyruvate); instead it mediates the
  bidirectional, Na+- and H+-independent, energy-independent facilitated diffusion of
  iodothyronines across the plasma membrane. Its major substrates are the thyroid
  hormones T3 and T4, and to a lesser extent reverse T3 and 3,3'-diiodothyronine; it
  also effluxes the iodotyrosines 3,5-diiodo-L-tyrosine (DIT) and 3-iodo-L-tyrosine
  (MIT). Unlike MCT1-4, MCT8 does not require an ancillary chaperone (basigin,
  embigin or neuroplastin) and can form homodimers and homooligomers. MCT8 is a
  multi-pass (12-transmembrane) plasma membrane protein highly expressed in liver and
  heart, and at the blood-brain barrier endothelium and choroid plexus, where it is a
  rate-limiting mediator of cellular thyroid hormone uptake and, in particular, of T3
  transport across the blood-brain barrier into the brain. Loss-of-function mutations
  cause the X-linked Allan-Herndon-Dudley syndrome (MCT8 deficiency), characterized by
  severe psychomotor retardation together with a distinctive thyroid profile of
  elevated serum T3 and low T4.
