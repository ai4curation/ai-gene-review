core_functions:
- description: >-
    Facilitative (equilibrative), Na+- and H+-independent, energy-independent bidirectional transport of
    iodothyronines (thyroid hormones T3 and T4, and to a lesser extent rT3 and 3,3'-T2) across the plasma
    membrane, mediating cellular thyroid hormone uptake and efflux. MCT8 also effluxes the iodotyrosines
    DIT and MIT. It acts without an ancillary chaperone (unlike the proton-coupled MCT1-4).
  molecular_function:
    id: GO:0015349
    label: thyroid hormone transmembrane transporter activity
  directly_involved_in:
  - id: GO:0070327
    label: thyroid hormone transport
  - id: GO:0150104
    label: transport across blood-brain barrier
