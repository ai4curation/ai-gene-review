  review:
    summary: Genetic interaction with DIO1 (P49895), modeled as MCT8 acting upstream of amino acid metabolism.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Over-broad and indirect. The partner UniProtKB:P49895 is DIO1 (iodothyronine deiodinase 1); MCT8
      supplies transported substrate to deiodinases, but "amino acid metabolic process" is a very general
      process that MCT8 does not itself perform. The participation test fails (MCT8 transports, it does not
      metabolize amino acids). The thyroid-hormone-specific upstream relationship is captured more precisely
      by the GO:0042403 row.
