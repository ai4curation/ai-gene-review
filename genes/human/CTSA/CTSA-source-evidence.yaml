reactome:
  roots:
  - R-HSA-1605724
  - R-HSA-4084999
  - R-HSA-4341669
  - R-HSA-9638120
  - R-HSA-6798751
  conclusion: Five positive roots traced through 22 actual objects to the P10619 processed chains. Lysosomal-complex
    membership does not transfer NEU1/NEU4 sialidase catalysis to CTSA. The established activation assay
    is NEU1-specific, and GLB1 protection is distinct; NEU4 activation is not inferred from model membership.
    Granule-to-extracellular transport supports CTSA cargo locations, not a new exocytosis process assertion.
  locators:
  - https://reactome.org/content/detail/R-HSA-1605630
  - https://reactome.org/content/detail/R-HSA-1605642
  - https://reactome.org/content/detail/R-HSA-1605735
  - https://reactome.org/content/detail/R-HSA-6798751
gocam:
  repository_source: gocams/index.tsv
  result: No exact P10619 row in the selected repository index; no biological absence inferred.
limits: No new annotation is proposed. Source objects, qualifiers and product identities are preserved.
  Unverified screen target records are distinguished from genuine negative experiments.
followup_scope:
  deamidase: Terminal peptide-amide hydrolysis is supported. No NEW annotation or ontology term is proposed
    while its mapping remains unresolved.
  ontology: OLS and QuickGO definitions of GO:0004040, GO:0008242 and GO:0016811 were checked. A missing
    precise label does not prove that broad amidase activity excludes peptide carboxamides.
  ontology_locators:
  - https://www.ebi.ac.uk/QuickGO/term/GO:0004040
  - https://www.ebi.ac.uk/QuickGO/term/GO:0008242
  - https://www.ebi.ac.uk/QuickGO/term/GO:0016811
  contextual_annotations: ER transit and precursor-associated glycosidase routing are retained as non-core.
    The latter includes an assembly contribution, not simply cargo transport.
  core_boundary: NEU1 activation is the activator MF; GLB1 stabilization is the separate protein-stability
    process.
