gene: CTSA
accession: P10619
purpose: Compact source, assay and propagation summary. Original assertions and decisions are in CTSA-ai-review.yaml.
  Raw downloaded datasets and reproducible working checks are retained in the isolated research packet
  rather than embedded here.
source_selection:
  basis: Genuine isolated fetch-gene and publication-cache commands; original selected main sources retained
    byte-for-byte. Falcon authentication and perplexity-lite quota failures are recorded in manual notes;
    neither returned a research report.
  shared_source: The selected PMID19159218 cache is the unchanged main/shared-PR version.
  cache_and_access: A cache can remain abstract-only while an authentic original was read elsewhere. Reference
    availability records original access, and the read scopes below state what was actually inspected.
products:
  official: https://www.uniprot.org/uniprotkb/P10619/entry
  canonical:
    id: P10619-1
    length: 480
  alternative:
    id: P10619-2
    length: 463
    difference: VSP_054832 deletes canonical residues 102–118; exact reconstruction matches the separately
      retrieved official FASTA.
  processing: Canonical signal 1–28, post-signal precursor 29–480, heavy chain 29–326 and light chain
    327–480. The two processed chains are not the two splice products.
  limits: Retention of catalytic residues does not establish equal folding, processing, protective activity
    or catalysis of both splice products. Historical452-residue numbering excludes the signal peptide.
primary_read_scopes:
- reference: PMID:12505983
  url: https://doi.org/10.1093/emboj/cdg002
  read: Complete original scientific main text and eight captions; no pixels or supplement.
  finding: Human PPCA cleaves mouse LAMP2A; active-site controls, substrate-site mutation, human fibroblast
    rescue and mouse knockout support receptor turnover and negative CMA regulation.
  limit: Precursor/mature mixture, human enzyme/mouse substrate and species-specific cell systems retained.
    Internal cleavage is not simply C-terminal trimming.
- reference: PMID:1387645
  url: https://repub.eur.nl/pub/40728/920617_MORREAU%2C%20Johannes.pdf
  locator: Publication 5, printed pages 85–100, original JBC study chapter.
  read: Complete scientific chapter Methods, Results, Discussion and captions; no figure pixels.
  finding: Human CTSA and GLB1 precursors associate in the ER; ER-retained CTSA mutants co-retain GLB1
    and delay normal routing.
  limit: Authentic author thesis, not a recovered journal PDF. GLB1 can reach lysosomes without CTSA;
    no universal obligatory cargo-receptor inference.
- reference: PMID:1756715
  url: https://repub.eur.nl/pub/40851/911129_GALJART%2C%20Niels%20Jakob.pdf
  read: Selected original author-chapter sections on activity, localization, constructs and processing;
    bounded independent consultation.
  finding: Human Hu54/F412V in COS-1 cells separates wild-type catalytic activity, dimerization and lysosomal
    targeting from mutant instability.
  limit: Heterologous-host human construct; no assumption that both splice products were tested.
  locator: 'Publication 6: PDF/printed pages 141–159. Selected activity, localization, construct and processing
    sections were read.'
- reference: PMID:1907282
  url: https://pure.eur.nl/ws/files/166310489/Human_Lysosomal_Protective_Protein_Has_Cathepsin_A-like_Activity.pdf
  read: Recovered nine-page JBC scientific main and captions in bounded independent consultation; no pixels.
  finding: Human Ser150/His429 mature-numbering substitutions abolish carboxypeptidase activity but retain
    protective rescue.
  limit: Corresponds to precursor Ser178/His457; mutant rescue separates catalysis from protection.
  locator: JBC 266, printed pages 14754–14762; repository cover precedes the nine scientific pages.
- reference: PMID:2244901
  url: https://doi.org/10.1016/0006-291x(90)91572-a
  read: Complete abstract; original Methods unavailable.
  finding: Seven galactosialidosis fibroblast strains have deficient esterase/deamidase activity at neutral
    pH and carboxypeptidase activity at acidic pH.
  limit: Serine-mechanism refinement is corroborated by 1907282, not by unseen Methods.
- reference: PMID:3107551
  url: https://doi.org/10.1016/s0006-291x(87)80486-2
  read: Complete abstract; original Methods unavailable.
  finding: Protective-protein uptake restores deficient glycosidase activities in human fibroblasts.
  limit: Does not by itself resolve the later purified NEU1 activation mechanism.
- reference: PMID:3136930
  url: https://repub.eur.nl/pub/40851/911129_GALJART%2C%20Niels%20Jakob.pdf
  read: Selected original Cell reprint sections in an authentic author thesis through bounded consultation.
  finding: Human Hu54 expression, secreted precursor uptake, processing and rescue.
  limit: 452 residues describe the post-signal precursor, not a splice-product identity.
  locator: 'Publication 1: PDF/printed pages 70–79 reproduce Cell 54:755–764. Selected original sections
    were read, not the whole thesis.'
- reference: PMID:37205763
  url: https://doi.org/10.1126/sciadv.adf8169
  read: Original target Results, Methods and captions in the core consultation; additional activation-result
    passages read during owner anchor selection.
  finding: Purified human CTSA activates human NEU1; CTSA itself does not hydrolyze the NEU1 assay substrate.
  limit: Mouse NEU1 structure and human activation assay are separate. The proposed loop rearrangement
    is not a solved CTSA-bound structure.
- reference: PMID:19056867
  url: https://esbl.nhlbi.nih.gov/UrinaryExosomes/
  locator: CTSA / NP_000299, three peptides, reference key2; zero-based HTML row 319 in captured table.
  read: Complete abstract plus author-database header, reference key and target row.
  finding: The target is positively listed in the human urinary-exosome dataset.
  limit: The original main article was not recovered; no exosome-biogenesis or product-specific role inferred.
- reference: PMID:23533145
  url: https://doi.org/10.1002/pmic.201200561
  read: Complete selected main text; no valid target supplemental workbook.
  finding: Human EPS-urine exosome proteomics method and contamination limits are available.
  limit: Supplementary Table 2 download returned HTML challenge; the CTSA entry remains unverified.
- reference: PMID:19946888
  url: https://doi.org/10.1002/jms.1696
  read: Complete abstract only.
  finding: Human YTS NK-cell membrane-fraction screen.
  limit: Target peptide table remains unverified; no negative membrane inference.
- reference: PMID:20176123
  url: https://doi.org/10.1016/j.semcdb.2010.02.005
  read: Selected complete CMA regulatory passages and target caption; not the whole review.
  finding: Luminal membrane association and LAMP2A turnover synthesize the primary 12505983 mechanism.
  limit: Secondary review, not an independent CTSA assay.
- reference: PMID:1694176
  url: https://www.researchgate.net/publication/21461952_A_peptidase_in_human_platelets_that_deamidates_tachykinins_Probable_identity_with_the_lysosomal_protective_protein
  locator: JBC 265:11265–11272; indexed Methods and product-identification Results, Tables II–IV and selected
    Discussion.
  read: Complete abstract plus selected indexed original text; no figure pixels. Direct publisher and
    ResearchGate downloads returned access errors.
  finding: HPLC and TLC identify free-acid peptide products.
  limit: Substrate- and pH-dependent activity; no assignment to either current splice product.
- reference: PMID:8591035
  url: https://www.researchgate.net/publication/14609586_Three-dimensional_structure_of_the_human_'protective_protein'_structure_of_the_precursor_form_suggests_a_complex_activation_mechanism
  locator: Structure 3:1249–1259; abstract and selected original introduction only.
  read: Complete normal-cache abstract plus selected indexed introduction; no whole-paper or pixel claim.
  finding: Human precursor dimer structure explains occlusion of the CTSA catalytic cleft.
  limit: Not treated as a newly inspected direct NEU1 activation experiment; that support remains PMID:37205763.
