id: P10619
gene_symbol: CTSA
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CTSA encodes cathepsin A, a lysosomal serine carboxypeptidase and protective component of
  complexes containing neuraminidase NEU1 and beta-galactosidase GLB1. It removes C-terminal amino acids
  from peptides and also hydrolyzes terminal amides of selected tachykinins, whereas its nonproteolytic
  association stabilizes lysosomal glycosidases and activates NEU1. The precursor enters the secretory
  pathway and is processed into disulfide-linked heavy and light chains. CTSA also controls LAMP2A turnover
  and chaperone-mediated autophagy through proteolysis at the luminal face of the lysosomal membrane.
  CTSA deficiency causes galactosialidosis, with combined impairment of lysosomal glycosidase activities.
