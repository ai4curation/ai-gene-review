core_functions:
- description: CTSA catalyzes serine-dependent removal of C-terminal amino acids from peptides in lysosomes.
    The enzyme additionally deamidates selected peptide carboxamides; that chemistry is distinct from
    the carboxypeptidase reaction represented here. Its processed chains form the same catalytic protein.
  molecular_function:
    id: GO:0004185
    label: serine-type carboxypeptidase activity
  directly_involved_in:
  - id: GO:0006508
    label: proteolysis
  locations:
  - id: GO:0043202
    label: lysosomal lumen
  supported_by:
  - reference_id: PMID:1907282
    supporting_text: 'Mutagenesis of the serine and histidine active site

      residues abolishes the enzymatic activity'
  - reference_id: PMID:1756715
  - reference_id: PMID:1694176
  - reference_id: PMID:8591035
- description: CTSA directly activates NEU1 through a nonproteolytic interaction, represented by enzyme
    activator activity. Its association with GLB1 protects that enzyme from degradation, represented separately
    by regulation of protein stability. These protective functions are separable from CTSA carboxypeptidase
    catalysis.
  molecular_function:
    id: GO:0008047
    label: enzyme activator activity
  locations:
  - id: GO:0043202
    label: lysosomal lumen
  supported_by:
  - reference_id: PMID:37205763
    supporting_text: The absolute NEU1 activity is 150-fold higher in presence than in absence of CTSA.
  - reference_id: PMID:1907282
  - reference_id: PMID:3107551
  directly_involved_in:
  - id: GO:0031647
    label: regulation of protein stability
suggested_questions:
- question: How do the 480- and 463-residue splice products differ in folding, processing, glycosidase
    protection and catalytic activity?
  experts: []
- question: What structural change in human NEU1 is induced by CTSA binding, and how does that activation
    differ from GLB1 stabilization?
- question: Which physiological substrates use CTSA carboxypeptidase activity, and how is this separated
    from the internal LAMP2A cleavage reported in CMA regulation?
- question: Can the target peptide entries for the NK-cell membrane and expressed-prostatic-secretion
    exosome screens be verified from their original supplemental datasets?
- question: The current fungal cpyA donor annotation links serine carboxypeptidase activity to an unrelated
    clinical publication. What is the correct source provenance for that individual annotation?
- question: Which GO term should represent peptide C-terminal deamidation, and when does this reaction
    versus amino-acid removal control tachykinin activity in vivo? Broad amidase activity needs semantic
    assessment for peptide carboxamides.
suggested_experiments:
- description: Express and purify both precisely defined human splice products, confirm processing by
    mass spectrometry, and compare peptide hydrolysis, NEU1 activation and GLB1 protection under matched
    conditions.
- description: Reconstitute LAMP2A cleavage with separately purified CTSA precursor and mature forms,
    catalytic-site controls and mapped cleavage products to distinguish internal cleavage from C-terminal
    trimming.
status: DRAFT
