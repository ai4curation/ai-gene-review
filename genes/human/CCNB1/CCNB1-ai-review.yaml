  review:
    summary: IBA propagation of G1/S transition from the ancestral cyclin node. Cyclin B1 is the mitotic B-type cyclin; G1/S commitment is driven by the G1/S cyclins (E/A), not cyclin B1.
    action: MARK_AS_OVER_ANNOTATED
    reason: The PANTHER cyclin node PTN000019791 groups G1/S cyclins (cyclin E/A/D) with mitotic cyclins (cyclin A/B); the G1/S-transition function is a cyclin E/A activity that has functionally diverged from the B-type cyclins. Cyclin B1 acts at the G2/M transition, not G1/S, so this term over-reaches when propagated to CCNB1.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN000019791
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Ancestral cyclin node spanning G1/S (cyclin E/A/D) and mitotic (cyclin A/B) cyclins; G1/S transition is inherited by the G1/S cyclins, not by the mitotic B-type cyclin CCNB1.
