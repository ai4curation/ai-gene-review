  review:
    summary: Core biological process for cyclin B1. Cyclin B1-CDK1 is the master driver of the G2/M transition.
    action: ACCEPT
    reason: Cyclin B1 accumulates through G2 and its complex with CDK1 initiates mitosis; this is the defining function of the gene. Supported directly by structural/biochemical work on cyclin B and by the broader literature.
