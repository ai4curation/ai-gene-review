id: P14635
gene_symbol: CCNB1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'CCNB1 encodes cyclin B1, the principal B-type mitotic cyclin (cyclin AB subfamily) and the regulatory subunit of the cyclin-dependent kinase CDK1 (CDC2). Cyclin B1 is not itself an enzyme; it binds CDK1 to form the cyclin B1-CDK1 holoenzyme, historically called M-phase/maturation-promoting factor (MPF), and induces the active kinase conformation while conferring substrate specificity and subcellular targeting on CDK1. Cyclin B1 accumulates through G2 and, once its associated CDK1 is activated (following CDC25-mediated removal of inhibitory Thr14/Tyr15 phosphorylation and reversal of WEE1/PKMYT1 inhibition), the complex drives the G2/M transition and mitotic entry. Cyclin B1 has no single static location: it is predominantly cytoplasmic during interphase, shuttles through the nucleus, and accumulates in the nucleus at prophase after phosphorylation of its cytoplasmic-retention/nuclear-export region; active cyclin B1-CDK1 first appears on centrosomes, and the protein also localizes
  to spindle microtubules, condensed chromosomes and unattached kinetochores. Through localized CDK1 phosphorylation of substrates (nuclear lamins, condensins, MPS1, separase and many others) it promotes centrosome separation, chromosome condensation, nuclear-envelope breakdown, spindle assembly, correct kinetochore-microtubule attachment and spindle-assembly-checkpoint control. At the metaphase-to-anaphase transition cyclin B1 is polyubiquitinated by the APC/C-CDC20 complex and destroyed by the proteasome; loss of cyclin B1 inactivates CDK1 and drives mitotic exit. A minor fraction of cyclin B1-CDK1 also localizes to the mitochondrial matrix, where it phosphorylates respiratory complex I subunits to support the energetic demands of the G2/M transition.'
