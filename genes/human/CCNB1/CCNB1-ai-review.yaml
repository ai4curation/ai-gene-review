core_functions:
- description: Binds and activates the CDK1 (CDC2) serine/threonine protein kinase to form the cyclin B1-CDK1 holoenzyme (M-phase promoting factor, MPF); rising complex activity drives the G2/M transition and mitotic entry.
  supported_by:
  - reference_id: PMID:12524548
    supporting_text: Cyclin B1-Cdk1 is the key initiator of mitosis
  - reference_id: PMID:24746669
    supporting_text: cyclin B1/Cdk1
  - reference_id: file:human/CCNB1/CCNB1-deep-research-falcon.md
    supporting_text: Cyclin B1 is not itself an enzyme. Its primary function is to bind and activate the catalytic serine/threonine kinase CDK1, forming the cyclin-B1-CDK1 complex, historically termed maturation- or M-phase-promoting factor.
  molecular_function:
    id: GO:0061575
    label: cyclin-dependent protein serine/threonine kinase activator activity
  directly_involved_in:
  - id: GO:0000086
    label: G2/M transition of mitotic cell cycle
  in_complex:
    id: GO:0097125
    label: cyclin B1-CDK1 complex
  locations:
  - id: GO:0005737
    label: cytoplasm
  - id: GO:0005813
    label: centrosome
- description: As the regulatory subunit of CDK1, confers substrate specificity and dynamic subcellular targeting on the kinase, directing localized phosphorylation of mitotic substrates at centrosomes, spindle, chromosomes and kinetochores to drive mitotic nuclear division, metaphase chromosome alignment and spindle-assembly-checkpoint control.
  supported_by:
  - reference_id: PMID:17495531
    supporting_text: "The cyclins activate their respective CDKs and confer substrate \nrecognition properties"
  - reference_id: PMID:18195732
    supporting_text: "cyclin B1 accumulates at kinetochores during prometaphase, where it \ncontributes to the correct attachment of microtubules to kinetochores and \nefficient \nalignment of the chromosomes"
  molecular_function:
    id: GO:0016538
    label: cyclin-dependent protein serine/threonine kinase regulator activity
  directly_involved_in:
  - id: GO:0045931
    label: positive regulation of mitotic cell cycle
  - id: GO:0007080
    label: mitotic metaphase chromosome alignment
  in_complex:
    id: GO:0097125
    label: cyclin B1-CDK1 complex
  locations:
  - id: GO:0005634
    label: nucleus
  - id: GO:0005813
    label: centrosome
proposed_new_terms: []
suggested_questions:
- question: Which mitotic substrates strictly require kinetochore- or centrosome-localized cyclin B1-CDK1 (versus the nuclear or cytoplasmic pool), and how does this spatial partitioning order the events of mitosis?
- question: To what extent is the mitochondrial-matrix cyclin B1-CDK1 pool that phosphorylates complex I a physiologically dedicated function versus a low-level consequence of high mitotic CDK1 activity?
suggested_experiments:
- description: Combine analog-sensitive CDK1 with rapid, degron-controlled removal of cyclin B1 and quantitative phosphoproteomics across synchronized mitosis to map the cyclin B1-dependent CDK1 substrate set and separate direct targets from indirect effects.
- description: Use endogenously tagged cyclin B1 with live super-resolution imaging plus localization-signal mutants (chromatin arginine anchor, NES/CRS, hydrophobic patch) to dissect how each subcellular pool contributes to distinct mitotic events and to APC/C-mediated destruction timing.
