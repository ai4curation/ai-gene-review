  review:
    summary: Membrane, from a mass-spectrometry membrane proteome of an NK-like cell line. AKNA has no
      transmembrane segment and no other study places it at a membrane; marked as over-annotated.
    action: MARK_AS_OVER_ANNOTATED
    reason: The source is a whole-proteome survey of a membrane fraction [PMID:19946888 "The present study
