id: Q7Z591
gene_symbol: AKNA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'AKNA is a large protein with two reported, as yet unreconciled, functions. It was first
  described as an AT-hook protein of lymphocytes: nuclear, it binds A/T-rich regulatory elements in the
  CD40 and CD40 ligand promoters and coordinately activates both genes, and genome-wide it occupies A/T-rich
  promoter motifs and raises IL-2 expression in T cells. It carries an A.T hook and multiple PEST motifs
  typical of high-turnover regulators. Independently, AKNA is a centrosomal protein that sits at the subdistal
  appendages of the mother centriole in neural stem cells and basal progenitors, where it is necessary
  and sufficient to organize centrosomal microtubules and to promote their nucleation and growth. This
  activity controls delamination of progenitors into the subventricular zone and their exit from it, and
  also epithelial-to-mesenchymal transition in other epithelia. Mice lacking AKNA develop neutrophil-driven
  systemic inflammation with alveolar destruction and die soon after birth.'
