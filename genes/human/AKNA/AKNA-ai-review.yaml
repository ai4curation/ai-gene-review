- id: file:genes/human/AKNA/AKNA-deep-research-affinage.md
  title: Affinage mechanistic annotation for AKNA (human)
  findings:
  - statement: Affinage places AKNA at the subdistal appendages, independently of its transcriptional
      role.
    supporting_text: Independently of transcription, AKNA localizes to the subdistal appendages of the
      mother centriole in neural stem cells and basal progenitors
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Trust gates passed. Summarizes both functions accurately; its MF suggestions (DNA binding,
      transcription regulator activity) are recorded here as a knowledge gap rather than adopted.
core_functions:
- description: Centrosomal organizer of microtubules at the subdistal appendages of the mother centriole.
    AKNA promotes centrosomal microtubule nucleation and growth, and this drives delamination of neural
    progenitors into the subventricular zone and, in other epithelia, epithelial-to-mesenchymal transition.
  directly_involved_in:
  - id: GO:0060234
    label: neuroblast delamination
  locations:
  - id: GO:0005813
    label: centrosome
  - id: GO:0005814
    label: centriole
  supported_by:
  - reference_id: PMID:30787442
    supporting_text: AKNA localizes at the subdistal appendages of the mother centriole in specific subtypes
      of neural stem cells, and in almost all basal progenitors.
  - reference_id: PMID:30787442
    supporting_text: This protein is necessary and sufficient to organize centrosomal microtubules, and
      promote their nucleation and growth.
  - reference_id: PMID:30787442
    supporting_text: These features of AKNA are important for mediating the delamination process in the
      formation of the subventricular zone.
  knowledge_gaps:
  - gap_statement: No molecular function term captures what AKNA does at the centrosome, and none is annotated.
    boundary: The mouse study shows AKNA is necessary and sufficient to organize centrosomal microtubules
      and promote nucleation and growth, and UniProt adds that it recruits nucleation factors and minus-end
      stabilizers. Whether AKNA binds tubulin or microtubules itself, or acts only as a recruiting scaffold,
      is not shown. The mouse curator, reading the full text, added neither a microtubule-nucleation process
      nor a binding activity, and comparable subdistal-appendage proteins (NIN, CEP170, ODF2) do not carry
      positive regulation of microtubule nucleation either, so none is added here.
    gap_kind:
    - BIOLOGY
    dark_aspect: MF_DARK
    provenance:
    - reference_id: PMID:30787442
      supporting_text: This protein is necessary and sufficient to organize centrosomal microtubules,
        and promote their nucleation and growth.
- description: 'Nuclear regulator of transcription in lymphocytes: AKNA binds A/T-rich promoter elements
    and coordinately activates CD40 and CD40 ligand, and in T cells occupies A/T-rich promoter motifs
    and raises IL-2.'
  directly_involved_in:
  - id: GO:0045944
    label: positive regulation of transcription by RNA polymerase II
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:11268217
    supporting_text: Here we describe AKNA, a human AT-hook protein that directly binds the A/T-rich regulatory
      elements of the promoters of CD40 and CD40 ligand (CD40L) and coordinately regulates their expression.
  - reference_id: PMID:36835622
    supporting_text: This suggests that AKNA induces the expression of genes involved in helper T-cell
      activation, such as IL-2
  knowledge_gaps:
  - gap_statement: Whether AKNA is a sequence-specific DNA-binding transcription factor, and how that
      squares with its centrosomal role, is unresolved.
    boundary: Direct promoter binding is stated only in the 2001 abstract; the full text is not cached.
      The same group later calls AKNA a hypothetical AT-hook-like factor, the 2023 ChIP-seq is a re-analysis
      of tagged-protein occupancy, and UniProt flags the dual role as unreconciled. No DNA-binding or
      transcription-factor activity is annotated for AKNA in any species, and PAINT propagates only the
      centrosomal functions, so no MF is added.
    gap_kind:
    - BIOLOGY
    - CURATION
    dark_aspect: MF_DARK
    provenance:
    - reference_id: PMID:11268217
      supporting_text: Here we describe AKNA, a human AT-hook protein that directly binds the A/T-rich
        regulatory elements of the promoters of CD40 and CD40 ligand (CD40L) and coordinately regulates
        their expression.
    - reference_id: PMID:21606955
      supporting_text: Here we report that targeted deletions of mouse AKNA, a hypothetical AT-hook-like
        transcription factor, sensitize mice to pathogen-induced inflammation and cause sudden neonatal
        death.
    - reference_id: file:genes/human/AKNA/AKNA-uniprot.txt
      supporting_text: both act as a microtubule organizer and as a transcription factor;
proposed_new_terms: []
suggested_questions:
- question: Should the centriole rows be refined to GO:0120103 centriolar subdistal appendage? The mouse
    abstract places AKNA there explicitly, and NIN, CEP170 and ODF2 carry that term, but the mouse curator
    chose centriole.
- question: Are the nuclear transcriptional role and the centrosomal role carried by different isoforms?
    AKNA has many reported splice forms, and only some were shown active on promoters.
- question: Does the neonatal inflammatory phenotype of AKNA-null mice come from loss of transcriptional
    repression in neutrophils or from a centrosome/microtubule defect?
suggested_experiments:
- description: EMSA or fluorescence anisotropy with purified AKNA AT-hook fragments and the CD40/CD40L
    promoter elements, with an A.T-hook point mutant as control.
- description: In vitro microtubule nucleation and binding assays with purified AKNA to decide between
    direct microtubule binding and recruitment of gamma-TuRC.
