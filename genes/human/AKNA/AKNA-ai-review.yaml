- term:
    id: GO:0045944
    label: positive regulation of transcription by RNA polymerase II
  evidence_type: IDA
  original_reference_id: PMID:11268217
  qualifier: involved_in
  review:
    summary: 'Positive regulation of transcription by RNA polymerase II, from the discovery paper: AKNA
      binds A/T-rich elements in the CD40 and CD40L promoters and activates both. Accepted, deferring
      to the full-text curation.'
    action: ACCEPT
    reason: The abstract states the finding directly [PMID:11268217 "Here we describe AKNA, a human AT-hook
      protein that directly binds the A/T-rich regulatory elements of the promoters of CD40 and CD40 ligand
      (CD40L) and coordinately regulates their expression."], and a later study maps AKNA ChIP-seq peaks
      to promoters [PMID:36835622 "We detected 381 AKNA peaks at promoter regions"] and finds that AKNA
      overexpression raises IL-2 [PMID:36835622 "This suggests that AKNA induces the expression of genes
      involved in helper T-cell activation, such as IL-2"]. The cached discovery paper is abstract-only
      and the curator read the full text. This transcriptional role and the centrosomal role are reported
      by separate groups and have never been reconciled [file:genes/human/AKNA/AKNA-uniprot.txt "both
      act as a microtubule organizer and as a transcription factor;"]; that is recorded as a knowledge
      gap rather than used to discount either.
    supported_by:
    - reference_id: PMID:11268217
      supporting_text: Here we describe AKNA, a human AT-hook protein that directly binds the A/T-rich
        regulatory elements of the promoters of CD40 and CD40 ligand (CD40L) and coordinately regulates
        their expression.
    - reference_id: PMID:36835622
      supporting_text: We detected 381 AKNA peaks at promoter regions
    - reference_id: PMID:36835622
      supporting_text: This suggests that AKNA induces the expression of genes involved in helper T-cell
        activation, such as IL-2
- term:
    id: GO:0050727
    label: regulation of inflammatory response
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q80VW7
  - ensembl:ENSMUSP00000041614
  review:
    summary: 'Regulation of inflammatory response, from Ensembl orthology, derived from the mouse knockout.
      Kept as non-core: the phenotype is systemic, and the mechanism is not established.'
    action: KEEP_AS_NON_CORE
    reason: Mouse AKNA knockouts develop neutrophil-driven inflammation [PMID:21606955 "Here we report
      that targeted deletions of mouse AKNA, a hypothetical AT-hook-like transcription factor, sensitize
      mice to pathogen-induced inflammation and cause sudden neonatal death."], and reporter assays suggest
      repression [PMID:21606955 "promoter/reporter experiments showed that AKNA could act as a gene repressor"].
      The same paper calls AKNA only a hypothetical transcription factor, and whether the phenotype comes
      from the transcriptional or the centrosomal function is untested. The process label is accurate
      as a phenotype-level statement and is kept as non-core.
    supported_by:
    - reference_id: PMID:21606955
      supporting_text: Here we report that targeted deletions of mouse AKNA, a hypothetical AT-hook-like
