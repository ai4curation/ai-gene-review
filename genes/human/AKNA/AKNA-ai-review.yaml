  review:
    summary: Generic protein binding with CD2BP2, from a screen for proteins carrying the GYF-domain recognition
      motif. Uninformative as a function statement; removed.
    action: REMOVE
    reason: CD2BP2's GYF domain recognizes proline-rich motifs [PMID:16000308 "The GYF domain of CD2BP2
      serves as an adapter that recognizes proline-rich sequences in intracellular proteins."], and the
      screen found such a motif in AKNA. The activity belongs to CD2BP2 as reader; AKNA supplies a peptide
      ligand, and no GO term for GYF-domain binding exists to refine to. Per the project's GO:0005515
      policy the generic term is not marked over-annotated - its defect is that it is uninformative -
      and removal is not a claim that the interaction is false.
    supported_by:
    - reference_id: PMID:16000308
      supporting_text: The GYF domain of CD2BP2 serves as an adapter that recognizes proline-rich sequences
        in intracellular proteins.
