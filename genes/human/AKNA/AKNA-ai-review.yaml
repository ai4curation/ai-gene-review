- id: PMID:11268217
  title: Regulation of CD40 and CD40 ligand by the AT-hook transcription factor AKNA.
  findings:
  - statement: AKNA binds A/T-rich elements in the CD40 and CD40L promoters and coordinately regulates
      both.
    supporting_text: Here we describe AKNA, a human AT-hook protein that directly binds the A/T-rich regulatory
      elements of the promoters of CD40 and CD40 ligand (CD40L) and coordinately regulates their expression.
  - statement: AKNA is nuclear.
    supporting_text: Consistent with its function, AKNA is a nuclear protein
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only. The discovery paper and the only direct evidence for promoter binding.
- id: PMID:30787442
  title: The centrosome protein AKNA regulates neurogenesis via microtubule organization.
  findings:
  - statement: AKNA localizes at the subdistal appendages of the mother centriole.
    supporting_text: AKNA localizes at the subdistal appendages of the mother centriole in specific subtypes
      of neural stem cells, and in almost all basal progenitors.
  - statement: AKNA organizes centrosomal microtubules and promotes their nucleation and growth.
    supporting_text: This protein is necessary and sufficient to organize centrosomal microtubules, and
      promote their nucleation and growth.
  - statement: This is required for delamination into the SVZ.
    supporting_text: These features of AKNA are important for mediating the delamination process in the
      formation of the subventricular zone.
  - statement: AKNA regulates EMT in other epithelia.
    supporting_text: The epithelial-to-mesenchymal transition is also regulated by AKNA in other epithelial
      cells, demonstrating its general importance for the control of cell delamination.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only. Mouse study; source of all mouse experimental annotations and, through
      them, the human ISS/IEA/IBA rows.
- id: PMID:21606955
  title: Coordinate activation of inflammatory gene networks, alveolar destruction and neonatal death
    in AKNA deficient mice.
  findings:
  - statement: Mouse AKNA knockout causes pathogen-induced inflammation and neonatal death; AKNA is called
      a hypothetical AT-hook-like factor.
    supporting_text: Here we report that targeted deletions of mouse AKNA, a hypothetical AT-hook-like
      transcription factor, sensitize mice to pathogen-induced inflammation and cause sudden neonatal
      death.
  - statement: Reporter assays suggest AKNA can repress.
    supporting_text: promoter/reporter experiments showed that AKNA could act as a gene repressor
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text cached. Source of the inflammatory-response rows; from the discovery group,
      who still describe the transcription-factor role as hypothetical.
- id: PMID:36835622
  title: 'Critical Role of the Transcription Factor AKNA in T-Cell Activation: An Integrative Bioinformatics
    Approach.'
  findings:
  - statement: ENCODE ChIP-seq places AKNA at promoters.
    supporting_text: We detected 381 AKNA peaks at promoter regions
  - statement: AKNA overexpression raises IL-2.
    supporting_text: This suggests that AKNA induces the expression of genes involved in helper T-cell
      activation, such as IL-2
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text cached. Re-analysis of ENCODE ChIP-seq in HepG2 plus overexpression in Jurkat
      cells; supports promoter occupancy but not direct sequence-specific binding.
