- id: file:human/COPG2/COPG2-deep-research-openai.md
  title: Deep research on COPG2 function (OpenAI o3 deep research)
  findings:
  - statement: >-
      Comprehensive review of COPG2 function including COPI architecture, gamma2-COP's
      role in the gamma/zeta adaptor subcomplex, preferential incorporation of
      gamma2/zeta1
      coatomer into COPI vesicles, and functional redundancy with COPG1 for basic
      COPI
      functions but distinct roles in neuronal differentiation.
- id: file:human/COPG2/COPG2-deep-research-falcon.md
  title: Deep research on COPG2 function (Falcon / Edison Scientific Literature)
  findings:
  - statement: >-
      Synthesizes paralog-specific biology of COPG2/gamma2-COP versus COPG1/gamma1-COP,
      reporting ~80% overall amino-acid identity (trunk ~81%, appendage ~75%) and
      a ~30 aa N-terminal extension in gamma2-COP. Highlights trans-Golgi enrichment
      of gamma2-COP (vs cis-Golgi enrichment of gamma1-COP), GBF1/ARF1-mediated recruitment
      of coatomer, an estimated <=~5% abundance of gamma2/zeta2 coatomer relative
      to total coatomer, and context-dependent dispensability (e.g., COPG2 knockdown
      did not impair hepatocyte HDL uptake and increased apoA-I secretion by 33%;
      gamma2-COP loss did not impair neurite outgrowth, in contrast to gamma1-COP
      loss). Notes that MEST/COPG2 locus regulation (imprinting, MestXL antisense
      transcription) may modulate COPG2 expression, particularly in neuronal lineages.
- id: file:human/COPG2/COPG2-deep-research-affinage.md
  title: Affinage mechanistic annotation for COPG2 (human)
  findings:
  - statement: COPG2 encodes the gamma2-COP subunit of the COPI coatomer complex; human COPG2 on chromosome 7q32 escapes genomic imprinting and is biallelically expressed, whereas in mouse CNS tissues MestXL antisense transcriptional interference causes maternal-allele-biased Copg2 expression.
    reference_section_type: RESULTS
    supporting_text: COPG2 encodes a coatomer (COPI) complex subunit (gamma2-COP) whose locus is a model for tissue- and species-specific allelic regulation rather than for vesicle-trafficking mechanism per se in the available corpus
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Affinage deep-research record for human COPG2 (Q9UBF2). Soft trust gate
      tripped: self_evaluation_pairwise is loss (uniprot_accession: Q9UBF2 matches;
      faith_pct: 100.0; 4 discoveries across 4 citations). As the narrative itself
      explicitly notes, all 4 papers in Affinage's indexed corpus (PMID:10788617,
      PMID:10995575, PMID:12879359, PMID:22053079) study genomic imprinting and
      MestXL antisense transcriptional interference at the MEST/COPG2 locus rather
      than the biochemical role of gamma2-COP in COPI vesicle coat assembly or
      retrograde trafficking (which is covered by PMID:11056392 and PMID:14729954).
core_functions:
- description: >-
    COPG2 encodes gamma-2-COP, a structural subunit of the COPI coatomer complex
    that
    mediates retrograde vesicle transport from the Golgi apparatus to the endoplasmic
    reticulum and intra-Golgi transport. As part of the gamma/zeta adaptor subcomplex,
    COPG2 participates in ARF1-GTP-dependent membrane recruitment, coat assembly,
    and
    vesicle formation. The gamma2/zeta1 coatomer isoform is preferentially incorporated
    into a specific population of COPI vesicles.
