id: Q9UBF2
gene_symbol: COPG2
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  COPG2 encodes gamma-2-COP (gamma2-COP), a subunit of the heptameric COPI (coat protein
  complex I)
  coatomer. The COPI complex mediates retrograde vesicle transport from the Golgi
  apparatus to the
  endoplasmic reticulum (ER) and intra-Golgi transport. COPG2 is a paralog of COPG1
  (gamma1-COP),
  sharing approximately 80% sequence identity (with ~81% identity in the trunk and
  ~75% in the appendage domains), and gamma2-COP has a ~30 amino-acid N-terminal extension
  relative to gamma1-COP. The gamma subunit resides in the gamma/zeta adaptor subcomplex
  (F-subcomplex) that connects ARF1-GTP to the coat and participates in vesicle formation;
  coatomer recruitment is initiated by GBF1-mediated activation of ARF1 on Golgi/ERGIC
  membranes. Studies show that gamma2/zeta1 coatomer is preferentially incorporated
  into a specific population of COPI vesicles, although gamma2/zeta2 coatomer is estimated
  to constitute at most ~5% of total coatomer. Localization studies suggest gamma2-COP
  is enriched at the trans-Golgi, whereas gamma1-COP is enriched at the cis-Golgi. While
  functionally redundant with COPG1 for basic COPI functions, COPG2 appears to play
  a more general housekeeping role, whereas COPG1 has specialized functions in neuronal
  differentiation; COPG2 knockdown does not affect hepatocyte HDL uptake (in contrast
  to essential COPI subunits) and can even increase apoA-I secretion, indicating context-dependent
  and partially specialized roles.
