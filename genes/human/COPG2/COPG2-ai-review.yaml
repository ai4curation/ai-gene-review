- term:
    id: GO:0006888
    label: endoplasmic reticulum to Golgi vesicle-mediated transport
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000029440
  - SGD:S000005231
  review:
    summary: >-
      Phylogenetically projected ER-to-Golgi vesicle-mediated transport from
      PANTHER node PTN000029440 (yeast donor SEC21, SGD:S000005231). While
      yeast sec21 mutants exhibit ER-to-Golgi trafficking blocks and mammalian
      COPI acts at the ERGIC during carrier maturation, COPI's direct coat
      function mediates retrograde Golgi-to-ER retrieval (GO:0006890, already
      separately annotated), whereas anterograde ER-to-Golgi budding is mediated
      by COPII.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      COPI's direct vesicular transport role is retrograde Golgi-to-ER and
      intra-Golgi retrieval (GO:0006890 and GO:0006891, both already present and
      accepted on COPG2), whereas anterograde ER-to-Golgi vesicle budding is
      mediated by COPII. Yeast SEC21 (SGD:S000005231) was isolated as an
      ER-to-Golgi sec mutant because loss of COPI-mediated retrograde retrieval
      of ER-resident recycling factors and SNAREs secondarily blocks anterograde
      ER-to-Golgi transport, and in mammalian cells COPI associates with ERGIC
      membranes during carrier maturation rather than driving anterograde ER
      export. Marked as over-annotated and harmonized with paralog COPG1.
    supported_by:
    - reference_id: file:human/COPG2/COPG2-deep-research-openai.md
      supporting_text: >-
        COPI-coated vesicles mediate retrograde transport from the Golgi back
        to the
        endoplasmic reticulum (ER) as well as intra-Golgi transport
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - ROLE_CONFLATION
      source_entities:
      - source_id: SGD:S000005231
        source_label: SEC21 (yeast)
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Yeast SEC21 was isolated as an ER-to-Golgi sec mutant because loss of COPI-mediated retrograde retrieval secondarily blocks anterograde ER-to-Golgi traffic; the direct conserved transport direction of COPI is retrograde Golgi-to-ER (GO:0006890).
      - source_id: PANTHER:PTN000029440
        source_label: coatomer subunit gamma ancestral node
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Ancestral gamma-COP node; projecting ER-to-Golgi transport conflates secondary anterograde phenotypes and ERGIC maturation with COPI's direct retrograde Golgi-to-ER retrieval function.
- term:
