- term:
    id: GO:0009306
    label: protein secretion
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - FB:FBgn0028968
  - PANTHER:PTN000029440
  review:
    summary: >-
      Phylogenetically inferred role in protein secretion from PANTHER node PTN000029440
      (Drosophila donor gammaCOP, FB:FBgn0028968). COPI function is required
      for maintaining secretory pathway homeostasis, but its direct role is in
      retrograde retrieval, not anterograde secretion.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      COPI's direct biochemical and cellular role is retrograde Golgi-to-ER and
      intra-Golgi retrieval (recycling ER-resident proteins and SNAREs), not
      anterograde protein secretion (which is COPII's role). Moreover, COPG2
      knockdown in hepatocytes did not impair HDL uptake (unlike essential COPI
      subunits) and actually increased apoA-I secretion by 33%, showing COPG2 is
      dispensable for and may even oppose certain secretory outputs. Harmonized
      with paralog COPG1 (MARK_AS_OVER_ANNOTATED on the same PTN000029440 node).
    supported_by:
    - reference_id: file:human/COPG2/COPG2-deep-research-openai.md
      supporting_text: >-
        COPI coat function contributes to Golgi structural maintenance and dynamics
    - reference_id: file:human/COPG2/COPG2-deep-research-falcon.md
      supporting_text: >-
        COPG2 knockdown did not alter HDL uptake [...] COPG2 knockdown increased
        apoA-I secretion by 33%
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - ROLE_CONFLATION
      source_entities:
      - source_id: FB:FBgn0028968
        source_label: gammaCOP (Drosophila)
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: Drosophila gammaCOP genetic secretory phenotypes reflect downstream consequences of COPI-dependent Golgi/ER retrieval defects rather than direct participation in anterograde secretion.
      - source_id: PANTHER:PTN000029440
        source_label: coatomer subunit gamma ancestral node
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Ancestral gamma-COP node; conserved coatomer function is retrograde retrieval, whereas anterograde protein secretion defects are indirect downstream consequences of Golgi/ER homeostasis collapse.

