id: O76090
gene_symbol: BEST1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: BEST1 is a membrane anion-channel subunit that assembles into homopentamers. In retinal
  pigment epithelial cells it acts principally at the basolateral plasma membrane, where its intracellular-calcium-gated
  pore conducts chloride and bicarbonate and contributes to epithelial ion homeostasis. Gating
  and permeation can also be modified by GAD65 and extracellular GABA; human-cell experiments
  support glutamate and GABA permeation under defined conditions. Mouse studies implicate Best1
  in glial transmitter release and neuronal terminal localization, although astroglial expression
  has been disputed and these neural roles remain less directly established in humans. Pathogenic
  variants cause several dominant and recessive retinal disorders through allele-dependent effects
  on channel function, trafficking and other aspects of RPE physiology.
