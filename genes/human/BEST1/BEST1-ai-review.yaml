- id: PMID:39277606
  title: GAD65 tunes the functions of Best1 as a GABA receptor and a neurotransmitter conducting
    channel.
  findings:
  - statement: Official abstract, selected primary interaction Results/Discussion/Methods and
      human iPSC-RPE Figure 7 Results distinguish GAD65-dependent permeation, extracellular-GABA
      activation and imposed-condition GABA influx. Human glutamate currents and GABA influx
      support permeability, not physiological flux direction in intact RPE or endogenous human
      glial secretion.
  - statement: Selected normal Results and Figure 6 legend describe an extracellular GABA-bound
      human BEST1 structure, a more open neck and GABA-potentiated chloride currents in HEK293
      cells at 1 micromolar intracellular calcium. Methods specify human BEST1 purification
      and external GABA substitutions. These support a GABA-gated chloride-channel activity
      under the reported assay conditions, while the relevant endogenous receptor context remains
      unresolved.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
