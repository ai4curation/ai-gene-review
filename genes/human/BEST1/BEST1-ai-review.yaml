suggested_questions:
- question: Which brain regions, cell types and detection conditions reconcile the negative astroglial
    localization findings with cell-type-specific Best1 perturbation and rescue, and which neural
    roles can be demonstrated directly in human cells?
- question: What are the physiological magnitude and direction of BEST1-dependent glutamate and
    GABA flux in polarized human RPE, and how do GAD65 and extracellular GABA affect those fluxes
    in vivo?
- question: Does the intracellular signal described in PMID:17003041 represent vesicular membrane-associated
    BEST1 or a distinct cytosolic pool?
- question: In which endogenous human cell types, and under what calcium and GAD65 conditions,
    does extracellular GABA gate BEST1 chloride conductance? Can the reported dose response
    and binding-site mechanism be reproduced independently and linked to a physiological receptor
    role?
