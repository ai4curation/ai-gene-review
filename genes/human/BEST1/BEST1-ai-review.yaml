    reason: 'GO:0005229 already descends from GO:0022834 through GO:0141147, so calcium gating
      does not justify an additional broad core assertion. The more specific proposal uses independent
      human BEST1 evidence in PMID:39277606: an extracellular GABA-bound structure and increased
      chloride currents in HEK293 cells, with a reported GABA EC50 of 371 nM. Figure 6 recordings
      used 1 micromolar intracellular calcium; this is GABA-promoted opening in a calcium-containing
      assay, not calcium-independent gating. GO:0022851 captures GABA-dependent chloride conduction
      without requiring membership in the canonical GABA-A receptor protein family. The original
      orthology evidence, qualifiers and donors remain unchanged; they are not relabeled as
      the newer human experiment. This refinement does not establish endogenous human neural
      receptor function, GABA secretion, or physiological GABA flux direction.'
