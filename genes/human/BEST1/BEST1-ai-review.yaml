- id: PMID:10737974
  title: VMD2 mutations in vitelliform macular dystrophy (Best disease) and other maculopathies.
  findings:
  - statement: The normal abstract identifies BEST1/VMD2 variants associated with retinal disease.
      It supplies disease and membrane-protein context rather than a modern direct channel mechanism.
  full_text_unavailable: true
- id: PMID:11050159
  title: Bestrophin, the product of the Best vitelliform macular dystrophy gene (VMD2), localizes
    to the basolateral plasma membrane of the retinal pigment epithelium.
  findings:
  - statement: The normal abstract and selected full-text paragraphs distinguish human RPE surface
      labeling, native macaque/porcine basolateral staining and human protein expressed in rat
      RPE-J cells. The expressed-cell intracellular staining does not establish a soluble cytosolic
      pool.
- id: PMID:11904445
  title: The vitelliform macular dystrophy protein defines a new family of chloride channels.
  findings:
  - statement: The normal abstract directly identifies calcium-sensitive human bestrophin chloride
      currents, oligomeric behavior and dominant mutant effects after heterologous expression.
      It establishes channel capability rather than relying solely on disease association.
  full_text_unavailable: true
- id: PMID:12907679
  title: Structure-function analysis of the bestrophin family of anion channels.
  findings:
  - statement: The normal abstract describes bestrophin anion-channel structure-function analysis.
      The human activity is independently corroborated; no claim of a complete figure or supplemental
      audit is made.
  full_text_unavailable: true
- id: PMID:17003041
  title: Bestrophin-1 enables Ca2+-activated Cl- conductance in epithelia.
  findings:
  - statement: Normal abstract plus selected indexed primary Results/Discussion support human
      epithelial-cell and expressed-human-protein chloride currents, alongside separate animal
      epithelial observations. The early channel-versus-regulator discussion and intracellular/possibly
      vesicular localization are kept distinct from later human pore evidence. The normal cache
      remains abstract-only.
  full_text_unavailable: true
- id: PMID:18179881
  title: Biallelic mutation of BEST1 causes a distinct retinopathy in humans.
  findings:
  - statement: The normal abstract links biallelic human BEST1 variants to a distinct retinopathy
      and altered chloride currents. It supports a disease-associated channel defect without implying
      all recessive cases share that mechanism.
  full_text_unavailable: true
- id: PMID:18400985
  title: Bestrophin Cl- channels are highly permeable to HCO3-.
  findings:
  - statement: The normal abstract separately reports human BEST1 bicarbonate permeability and
      conductance among several bestrophin homologs. Human BEST1 is directly assayed, so its bicarbonate
      activity is not a paralog transfer.
  full_text_unavailable: true
- id: PMID:19372599
  title: Human disease-causing mutations disrupt an N-C-terminal interaction and channel function
    of bestrophin 1.
  findings:
  - statement: Normal abstract and selected primary Results/Discussion support human BEST1 N/C-terminal
      interaction and multimeric channels. Functional terminal-interaction defects need not abolish
      oligomerization; the study does not independently fix the later established pentamer stoichiometry.
  full_text_unavailable: true
- id: PMID:19853238
  title: Missense mutations in a retinal pigment epithelium protein, bestrophin-1, cause retinitis
    pigmentosa.
  findings:
  - statement: The normal cache is abstract-only; selected authenticated additional primary text
      was read separately and remains quarantined. Expressed wild-type BEST1 is basolateral in
      MDCKII cells, while particular variants alter distribution and function. The broader cache
      was not substituted for the protected canonical file.
  full_text_unavailable: true
- id: PMID:21330666
  title: Functional characterization of bestrophin-1 missense mutations associated with autosomal
    recessive bestrophinopathy.
  findings:
  - statement: The normal abstract reports wild-type/mutant human BEST1 whole-cell recordings
      and localization in polarized MDCKII cells. Individual panel details beyond this reading
      are not claimed.
  full_text_unavailable: true
- id: PMID:26200502
  title: Autosomal Recessive Bestrophinopathy Is Not Associated With the Loss of Bestrophin-1
    Anion Channel Function in a Patient With a Novel BEST1 Mutation.
  findings:
  - statement: The normal abstract describes human iPSC-RPE and expressed-protein studies, including
      preserved channel function in a particular recessive-disease variant combination. Its title
      is not evidence against BEST1 being an anion channel.
  full_text_unavailable: true
- id: PMID:26720466
  title: A Novel BEST1 Mutation in Autosomal Recessive Bestrophinopathy.
  findings:
  - statement: The normal abstract reports a human recessive-retinopathy family, wild-type/mutant
      HEK293T currents and plasma-membrane localization. The tested variants reduce current without
      a universal loss of membrane localization.
  full_text_unavailable: true
- id: PMID:31791063
  title: 'Quantitative Protein Expression in the Human Retinal Pigment Epithelium: Comparison
    Between Apical and Basolateral Plasma Membranes With Emphasis on Transporters.'
  findings:
  - statement: The normal abstract describes human RPE apical/basolateral surface proteomics.
      Official identity was checked, but publisher and repository retrieval did not yield the
      BEST1-specific full-text/table result. The curated basal-membrane assertion is accepted
      with independent localization support, not claimed as newly verified from its table.
  full_text_unavailable: true
- id: PMID:35789156
  title: Structures and gating mechanisms of human bestrophin anion channels.
  findings:
  - statement: Selected normal full-text Results and figure caption describe purified wild-type
      human BEST1 and BEST2 pentamers and different calcium-bound conformations. BEST1’s partially
      open structure must not be conflated with BEST2’s fully open conformation. No complete supplementary
      or image audit is claimed.
- id: PMID:9662395
  title: Identification of the gene responsible for Best macular dystrophy.
  findings:
  - statement: The normal abstract establishes the disease-gene association for Best macular dystrophy.
      It supports visual-system relevance without assigning phototransduction chemistry.
  full_text_unavailable: true
- id: Reactome:R-HSA-2744361
  title: BESTs transport cytosolic Cl- to extracellular region
  findings:
  - statement: The bestrophin reaction places chloride on opposite sides of the plasma membrane;
      passive channel activity is not constrained to the depicted direction.
- id: Reactome:R-HSA-2752067
  title: BESTs transport cytosolic HCO3- to extracellular region
  findings:
  - statement: The bestrophin reaction describes bicarbonate movement from cytosol to extracellular
      space and supports the membrane transport context.
- id: Reactome:R-HSA-983712
  title: Ion channel transport
  findings:
  - statement: The broad ion-channel-transport pathway supplies pathway context; human BEST1’s
      specific chloride and bicarbonate activities are established independently.
