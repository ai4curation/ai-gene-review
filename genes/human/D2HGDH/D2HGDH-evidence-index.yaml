judgment_boundaries:
  ion_processes: Positive purified-enzyme stimulation is preserved, but does not establish the assigned
    cellular/organism process. Both original NOT rows remain UNDECIDED because the negative rat enzyme
    experiment neither establishes nor contradicts the broader human process exclusion. This is deliberate
    biological uncertainty despite full-text access, not denial of the negative experiment.
  destabilization: Strong deletion/fusion results are preserved, but endogenous D2HGDH is the degraded
    substrate. Native participation in destabilizing proteins is not established.
  secondary_substrates: Strong D-malate and weak D-lactate are human experimental activities; meso-tartrate
    is a rat assay transfer. Physiological flux is not inferred from turnover alone. D-lactate retention
    rests on measured kinetics, binding and independent rat turnover/competition, not a threshold comparing
    only 0.16 with the negligible L-2-hydroxyglutarate signal; physiological significance remains unestablished.
  location_breadth: Five broad mitochondrial assertions remain scientifically supported, but the accepted
    existing matrix term entails them. Each source retains its own resolution.
  FAD_scope: 'Both existing cofactor mappings remain accepted within one catalytic core: GO:0050660 covers
    the redox pair and GO:0071949 the oxidized form. This pragmatic source-level retention does not claim
    additional logical coverage from the ancestor or require retaining all broad annotations.'
