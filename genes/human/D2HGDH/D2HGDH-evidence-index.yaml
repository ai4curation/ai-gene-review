  interpretation: Direct target group detected; current source is not a missing-target-table inference.
    Class/cluster 1 evidence supports mitochondrial residence. Peripheral classification does not by itself
    distinguish which mitochondrial membrane or matrix-facing side. Peripheral is an extraction-based
