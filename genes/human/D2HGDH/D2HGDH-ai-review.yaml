core_functions:
- description: Oxidizes D-2-hydroxyglutarate to 2-oxoglutarate in mitochondria, using tightly bound FAD
    and a zinc-coordinating substrate pocket. This limits D-2-hydroxyglutarate accumulation. Strong D-malate
    and weaker D-lactate oxidation are measured additional substrate activities; their physiological contributions
    and the terminal electron acceptor remain unresolved.
