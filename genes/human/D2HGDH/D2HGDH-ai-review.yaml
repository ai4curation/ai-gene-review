    summary: The negative magnesium enzyme result is established, but the broader human process exclusion
      is unresolved.
    reason: 'This original ISS assertion is explicitly NOT and retains the rat P84850 donor. PMID:15070399
      reports no magnesium-dependent stimulation of purified rat enzyme in the tested radiochemical assay;
      that negative biochemical observation is accepted. The current GO definition concerns a cell or
