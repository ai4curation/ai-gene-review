  review:
    action: ACCEPT
    summary: FAD is the tightly bound redox cofactor of human D2HGDH.
    reason: 'Human residues 51–521 co-purify with FAD, and every reported crystal structure contains noncovalently
      bound FAD in the catalytic pocket. The protein-side contacts and catalytic mechanism support this
      cofactor-binding activity. GO:0050660 covers oxidized or reduced FAD, whereas GO:0071949 specifically
      names the oxidized form; they are not duplicate identifiers. Preserve both existing assertions but
      do not create a separate FAD-binding core unit. The current InterPro records contain the literal
      corresponding GO mappings and exact Q8N465 domain matches; their classification is corroborated
      by the human structures. This retention is a source-level cofactor judgment rather than a claim
      that an ancestor adds independent logical coverage: the broader mapping describes the redox cofactor
      across the catalytic cycle, while the narrower mapping specifies oxidized FAD. TOO_GENERAL is used
      for uninformative generic catalysis and broad locations here, not as an automatic deletion of every
      supported ancestor. Both cofactor observations remain integrated into the single dehydrogenase core.'
    supported_by:
    - reference_id: PMID:33431826
      supporting_text: In all the structures, there is a FAD non-covalently bound to the active site
