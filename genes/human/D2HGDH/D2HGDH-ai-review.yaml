- term:
    id: GO:0006089
    label: lactate metabolic process
  evidence_type: ISS
  original_reference_id: PMID:15070399
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P84850
  review:
    action: KEEP_AS_NON_CORE
    summary: D-lactate oxidation is a measured secondary substrate activity.
    reason: 'The purified rat enzyme oxidizes D-lactate in the PMS/DCIP assay, and recombinant human residues
      51–521 also show weak but positive D-lactate turnover. The current lactate-metabolism definition
      includes chemical reactions involving lactate and does not restrict the term to L-lactate. Retain
      the performed reaction as non-core; neither weak turnover nor stereochemical difference is evidence
      of absence. The experiments do not establish an important physiological D-lactate clearance role.
      This is not a numerical cutoff based only on comparison with the negligible L-2-hydroxyglutarate
      signal: the human study reports D-lactate-dependent kinetics and measurable substrate binding, corroborated
      by the earlier rat turnover and competition experiments. The human specific activity is low (0.16
      versus 2.02 micromol/min/mg for D-2-hydroxyglutarate), and the reported kcat is 13.5-fold lower.
      These support a weak performed reaction, not an important physiological clearance pathway; no new
      L-enantiomer function is inferred.'
    supported_by:
    - reference_id: PMID:15070399
    - reference_id: PMID:33431826
      supporting_text: a very weak activity towards D-LAC
