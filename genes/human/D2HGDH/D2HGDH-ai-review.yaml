      participation in that broader process. The deliberate asymmetry is epistemic: the three positive
      ion-response rows promote observed enzyme stimulation into an unshown cellular process and are over-annotated;
      these NOT rows instead require adjudicating a broader exclusion, whose truth remains unresolved.
      UNDECIDED concerns that cross-species process exclusion, not access to the fully read paper or doubt
      about the negative assay. It does not endorse a universal absence, imply a positive response, or
      require removal of the experimental observation.'
