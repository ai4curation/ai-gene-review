suggested_questions:
- question: Does the ETF/ETF-dehydrogenase system proposed in PMID:15070399 directly reoxidize D2HGDH-bound
    FAD in mammalian mitochondria, and how does this candidate route affect D-2-hydroxyglutarate clearance
    compared with other acceptors?
- question: Do the 307- and 319-residue splice products produce stable mitochondrial proteins, and do
    they retain any catalytic or regulatory function despite loss of canonical substrate-binding residues?
- question: How much D-malate flux is carried by D2HGDH in intact human cells under normal and disease
    conditions?
suggested_experiments:
- description: Compare product-specific expression and localization of the three official splice products,
    then measure D-2-hydroxyglutarate and D-malate turnover with matched protein abundance and FAD occupancy.
    Include full-length and assay-truncated long-product controls to separate splicing effects from N-terminal
    construct effects.
