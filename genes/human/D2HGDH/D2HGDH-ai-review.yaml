id: Q8N465
gene_symbol: D2HGDH
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: D2HGDH is a mitochondrial FAD-dependent dehydrogenase that oxidizes D-2-hydroxyglutarate
  to 2-oxoglutarate and limits accumulation of this metabolite. Its catalytic pocket binds substrate adjacent
  to FAD and a zinc-coordinating site. Human enzyme also efficiently oxidizes D-malate and more weakly
  D-lactate in purified assays, while their physiological fluxes remain less defined. Loss-of-function
  variants cause D-2-hydroxyglutaric aciduria type 1. The 521-residue precursor contains an N-terminal
  targeting region; two shorter splice products of 307 and 319 residues lack much of the canonical C-terminal
  substrate-binding region and have not been functionally characterized in the cited assays.
