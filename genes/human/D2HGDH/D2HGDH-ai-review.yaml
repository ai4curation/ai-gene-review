  qualifier: involved_in
  review:
    summary: The native protein is a degradation target, and its N terminus contributes susceptibility
      in engineered constructs.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'PMID:33053349 goes beyond a proteomic hit: VbP depletes native/full-length D2HGDH; proteasome
      and cullin-pathway inhibitors block depletion; full human 1–521 is more protease-sensitive than
      52–521, and deletion of the N terminus prevents VbP-induced degradation. Transferring residues 1–51
      onto CARD8-ZUC permits DPP8/9-inhibitor-triggered GSDMD cleavage and LDH release in CARD8-null THP-1
      cells. These positive deletion and fusion results establish a transferable susceptibility element,
      not a native D2HGDH role performing a protein-destabilization step. The broad gene-level process
      attribution is therefore over-annotated; this does not deny the engineered cis effect or infer absence
      of degradation.'
    supported_by:
    - reference_id: PMID:33053349
      supporting_text: We discovered that VbP only induced the degradation of the full-length proteins
