id: O43557
gene_symbol: TNFSF14
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: TNFSF14 encodes LIGHT, a shed and membrane TNF-superfamily ligand on
  activated immune cells that binds HVEM, LTBR, and the soluble decoy receptor DcR3
  to costimulate T cells and activate NF-kappaB or contextual apoptosis signaling
  in receptor-bearing cells.
alternative_products:
