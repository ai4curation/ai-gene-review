  evidence_type: IPI
  original_reference_id: PMID:25087510
  qualifier: part_of
  review:
    summary: Accept the TNFRSF ligand-receptor complex.
    action: ACCEPT
    reason: This row is a direct complex annotation for the ligand bound to a TNFR-superfamily
      receptor.
    supported_by:
    - reference_id: PMID:25087510
      supporting_text: 'LIGHT initiates intracellular signaling via engagement of
        the two TNF receptors,

        HVEM and LTβR. In humans, LIGHT is neutralized by DcR3, a unique soluble member

        of the TNFR superfamily, which tightly binds LIGHT and inhibits its interactions

        with HVEM and LTβR.'
