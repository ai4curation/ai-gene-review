  evidence_type: IDA
  original_reference_id: PMID:26583432
  qualifier: involved_in
  review:
    summary: APPL proteins are required for nuclear delivery of the TGF-beta receptor intracellular 
      domain - but only a double knockdown was done.
    action: KEEP_AS_NON_CORE
    reason: Silencing APPL1 and APPL2 abolished nuclear accumulation of endogenous and tagged 
      TbetaRI-ICD after TGF-beta stimulation, so the gene product is genuinely required for this 
      import event and the annotation is not wrong. Every functional experiment in the paper, 
      however, silences both adaptors simultaneously, and the physical association with TbetaRI and 
      PKCzeta was mapped to APPL1 alone - so APPL2's individual contribution is unresolved. Given 
      54% paralog identity, a double knockdown cannot be read as evidence about either gene singly. 
      Kept as a real but peripheral role rather than removed, since curators reading the full text 
      had the same design available to them and the requirement itself is not in doubt. Note the 
      cargo imported is TbetaRI-ICD, not APPL2.
