- term:
    id: GO:0002024
    label: diet induced thermogenesis
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q8K3G9
  - ensembl:ENSMUSP00000020500
  review:
    summary: diet induced thermogenesis rests on a neuron-restricted Appl2 knockout in mouse 
      hypothalamus.
    action: KEEP_AS_NON_CORE
    reason: Deleting APPL2 in ventromedial-hypothalamic RIP-Cre neurons reduced beiging of 
      subcutaneous white adipose tissue and produced cold intolerance and obesity, acting through 
      AMPK and sympathetic outflow (PMID:29467283). The perturbation is APPL2-specific and 
      conditional. The donor is mouse Appl2 (Q8K3G9), a 1:1 ortholog 92.7% identical to the human 
      protein, so the orthology transfer carries no ortholog-assignment risk. This is nonetheless an
      organism-level physiological outcome of APPL2 acting in one neuronal population, several steps
      removed from what the protein does molecularly, so it is peripheral rather than core.
    supported_by:
    - reference_id: PMID:29467283
      supporting_text: "Genetic ablation of APPL2 in RIP-Cre neurons diminishes beiging in sWAT\nwithout
        affecting BAT, leading to cold intolerance and obesity in mice."
    - reference_id: PMID:29467283
      supporting_text: "Hypothalamic APPL2 enhances neuronal activation in VMH RIP-Cre neurons and raphe\n\
        pallidus, thereby eliciting SNS outflow to sWAT and subsequent beiging."
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
      - source_id: UniProtKB:Q8K3G9
        source_label: Appl2 (Mus musculus)
        source_status: SUPPORTS_TRANSFER
        comment: Mouse Appl2, the 1:1 ortholog of the target and the only gene-level donor on this 
          row; human and mouse APPL2 are 92.7% identical over a full-length global alignment 
          (APPL2-bioinformatics/RESULTS.md), so the transfer itself is safe. The mouse evidence is a
          conditional, neuron-restricted APPL2 knockout with a whole-animal thermogenic phenotype 
          (PMID:29467283) - APPL2-specific, but organismal.
      - source_id: ensembl:ENSMUSP00000020500
        source_label: Appl2 (Mus musculus), Ensembl protein
        source_status: SUPPORTS_TRANSFER
        comment: Ensembl protein accession for the same mouse Appl2 entry (it resolves to 
          UniProtKB:Q8K3G9), so this row carries one donor under two identifiers, not two 
          independent donors.
