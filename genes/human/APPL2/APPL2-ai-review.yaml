id: Q8NEU8
gene_symbol: APPL2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'APPL2 (DCC-interacting protein 13-beta, DIP13B) is a 664-residue cytoplasmic adaptor protein
  built from an N-terminal BAR domain, a central pleckstrin-homology domain and a C-terminal phosphotyrosine-binding
  domain, with no catalytic activity of its own. The BAR domain drives self-association into crescent-shaped
  dimers and also heterodimerisation with its paralog APPL1, while the PH and PTB domains bind phosphoinositides;
  together these give the protein a curvature-sensing, lipid-binding scaffold. APPL2 is an effector of
  small GTPases of the Rab5 branch, binding GTP-loaded Rab5, Rab22A, Rab24 and Rab31 - the last being
  the only one whose affinity has been measured, a dissociation constant of 140 nM - and this is what
  recruits it to membranes. On a peripheral subpopulation of early endosomes, called APPL endosomes for
  the two adaptors that mark them, APPL2 acts together with Rab5 and annexin A2 as part of a signalling
  platform that links internalised receptors to the nucleus; a pool of the protein shuttles into the nucleus
  and associates with the NuRD/MeCP1 chromatin-remodelling complex and with a Reptin-beta-catenin-HDAC
  repressive complex, where it promotes beta-catenin/TCF-dependent transcription. In muscle, APPL2 is
  a brake on metabolic signalling: it binds the adiponectin receptors AdipoR1 and AdipoR2 in competition
  with APPL1 and sequesters APPL1 away from the adiponectin and insulin pathways, and it binds phosphorylated
  TBC1D1 to block insulin-evoked GLUT4 translocation and glucose uptake, so losing APPL2 improves insulin
  sensitivity and glucose tolerance. In macrophages the protein instead occupies surface ruffles, macropinosomes
  and early phagosomes, where Rab31 recruits it to promote phagocytic cup closure and Fc-gamma-receptor-driven
  PI3K/Akt signalling, while downstream of TLR4 it restrains Akt and NF-kappaB activation and limits cytokine
  secretion. Further roles have been described in hypothalamic control of adipose beiging and cold tolerance,
  in hepatocyte-growth-factor-dependent fibroblast migration, and in tuning glucocorticoid-receptor sensitivity
  during adult neurogenesis. Across these settings APPL2 repeatedly behaves as the counterweight to APPL1
  rather than its duplicate: the two proteins are only about 54% identical, bind different Rabs, and have
  opposite effects on adiponectin signalling and on Akt activation downstream of several receptors.'
