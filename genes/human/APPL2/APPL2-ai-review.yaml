- term:
    id: GO:0070062
    label: extracellular exosome
  evidence_type: HDA
  original_reference_id: PMID:19056867
  qualifier: located_in
  review:
    summary: A whole-fraction urinary-exosome proteomics inventory projected onto every protein it 
      detected.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'I ran the reference-projection test against QuickGO: this single reference carries 1016 GO
      annotations over 1016 distinct gene products, all of them GO:0070062 - one per protein in the dataset.
      That is an inventory of what was in the fraction, not a claim that APPL2 functions in extracellular
      exosomes. By contrast the gene-specific references on this record project onto only 2-6 entities
      each. APPL2 is a peripheral membrane protein on endosomal membranes, so detection in a multivesicular-body-derived
      fraction is unsurprising and carries no functional content. Marked over-annotated rather than removed:
      the protein was genuinely detected.'
    supported_by:
    - reference_id: PMID:19056867
      supporting_text: we used LC-MS/MS to profile the proteome of human urinary exosomes
    - reference_id: PMID:19056867
      supporting_text: "the\nanalysis identified 1132 proteins unambiguously"
