- term:
    id: GO:1905451
    label: positive regulation of Fc-gamma receptor signaling pathway involved in phagocytosis
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q8K3G9
  - ensembl:ENSMUSP00000020500
  review:
    summary: APPL2 promotes PI3K/Akt signalling downstream of the Fc-gamma receptor during 
      phagocytosis.
    action: ACCEPT
    reason: "APPL2 depletion reduced PI3K/Akt signalling and enhanced p38 signalling from the Fc-gamma
      receptor, and reduced recruitment of Akt to phagosomal membranes. The sign is positive for the Akt
      arm, which is what this term asserts. The donor is mouse Appl2 (Q8K3G9), a 1:1 ortholog 92.7% identical
      to the human protein, so the orthology transfer carries no ortholog-assignment risk. Accepted as
      core, with one caveat recorded in the notes: in the same cell type but downstream of TLR4 rather
      than FcgammaR, APPL2 restrains Akt signalling - the sign of APPL2's effect on this kinase is receptor-dependent,
      and no single annotation can express that."
    supported_by:
    - reference_id: PMID:25568335
      supporting_text: "APPL2\ndepletion also reduced PI3K/Akt signaling and enhanced p38 signaling from
        FcγR."
    - reference_id: PMID:25568335
      supporting_text: "siRNA depletion of either Rab31 or APPL2\nreduces FcγR-mediated phagocytosis."
    - reference_id: PMID:25328665
