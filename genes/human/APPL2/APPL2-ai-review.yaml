  - ensembl:ENSMUSP00000020500
  review:
    summary: APPL2 constrains cytokine secretion in the immune response; the negative sign is the 
      one the data support.
    action: ACCEPT
    reason: "Two independent mouse studies agree on the direction: Appl2 deletion raised TNF-alpha and
      IL-1beta from primary macrophages, and APPL2 depletion in macrophages showed it 'serves to constrain
      the secretion of pro- and anti-inflammatory cytokines'. The signed term is therefore correctly signed,
      which is the thing to check on a transfer like this. The donor is mouse Appl2 (Q8K3G9), a 1:1 ortholog
      92.7% identical to the human protein, so the orthology transfer carries no ortholog-assignment risk."
    supported_by:
    - reference_id: PMID:25328665
      supporting_text: "deletion of Appl2 led to\nhigher levels of TNF-α and IL-1β in primary macrophages"
    - reference_id: PMID:27219021
      supporting_text: "APPL2 has a\ndominant role in nuclear translocation of NF-KB p65 and it serves
        to constrain\nthe secretion of pro- and anti-inflammatory cytokines."
    - reference_id: PMID:25328665
      supporting_text: "When challenged with\nlipopolysaccharides (LPS), Appl2 KO mice exhibited more
        severe symptoms of\nendotoxin shock, accompanied by increased production of proinflammatory\n\
        cytokines."
