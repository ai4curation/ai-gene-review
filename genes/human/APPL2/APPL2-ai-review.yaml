    summary: cellular response to hepatocyte growth factor stimulus, from mouse embryonic 
      fibroblasts where a single Appl2 knockout has the phenotype.
    action: KEEP_AS_NON_CORE
    reason: 'The title of the source paper reads as a double-knockout result, and I checked whether it
      is: it is not. Single Appl1 KO, single Appl2 KO and the double KO all showed decreased HGF-induced
      Akt activation, so there is an APPL2-specific loss-of-function anchor here and the rows do not suffer
      the paralog conflation that the TGF-beta rows do. The migration and invasion defects are reported
      for Appl-deficient MEFs collectively, so the migration row is slightly weaker than the HGF-response
      row. The donor is mouse Appl2 (Q8K3G9), a 1:1 ortholog 92.7% identical to the human protein, so
      the orthology transfer carries no ortholog-assignment risk. Non-core because the effect is growth-factor-selective
      - EGF, insulin and serum activate Akt normally - and Appl2-null mice are viable and grow normally.'
    supported_by:
