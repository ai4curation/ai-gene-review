- term:
    id: GO:0034143
    label: regulation of toll-like receptor 4 signaling pathway
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q8K3G9
  - ensembl:ENSMUSP00000020500
  review:
    summary: APPL2 regulates TLR4 signalling in macrophages, with each adaptor depleted separately.
    action: ACCEPT
    reason: Depleting APPL1 and APPL2 individually revealed separate and opposing functions in Akt 
      and MAPK signalling downstream of LPS/TLR4, with APPL2 dominant in NF-kappaB p65 nuclear 
      translocation and in constraining cytokine secretion. Crucially the adaptors were depleted 
      'respectively', so this is an APPL2-specific result, not a pooled one. Reinforced by the Appl2
      knockout mouse, which is hypersensitive to LPS. The donor is mouse Appl2 (Q8K3G9), a 1:1 
      ortholog 92.7% identical to the human protein, so the orthology transfer carries no 
