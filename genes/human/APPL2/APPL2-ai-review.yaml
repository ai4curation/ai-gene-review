- term:
    id: GO:0051289
    label: protein homotetramerization
  evidence_type: IDA
  original_reference_id: PMID:23055524
  qualifier: involved_in
  review:
    summary: The cited paper reports a dimer by every solution method; the tetramer is a reading of 
      the crystallographic asymmetric unit.
    action: MODIFY
    reason: "The word 'tetramer' does not occur anywhere in the full text of this paper. What it reports
      is that the APPL2 BAR-PH construct crystallised with two dimers in the asymmetric unit - four chains,
      which is a statement about crystal packing, not about the assembly state in solution. Every solution
      measurement in the same paper gives a dimer: chemical cross-linking, and multi-angle light scattering
      returning 95.1 kDa against a theoretical dimer mass of 92.1 kDa. The only tetramer described is
      a heterotetramer with the Rab (an APPL2 BAR-PH dimer plus two Rab31 monomers), which is not homotetramerization
      either. UniProt's 'Homotetramer (PubMed:23055524)' appears to rest on the same misreading. I propose
      GO:0051260 protein homooligomerization rather than deletion: the BAR domain does self-associate,
      and the defined oligomer the paper supports is the dimer, already annotated as GO:0042803 and GO:0042802.
      I am overruling a curator here only because the cached full text is complete and the decisive sentences
      are quotable verbatim."
    proposed_replacement_terms:
    - id: GO:0051260
      label: protein homooligomerization
    supported_by:
    - reference_id: PMID:23055524
      supporting_text: hAPPL2 BARPH crystallized in the P 2 1 2 1 2 1 space group with two dimers in
        the asymmetric unit.
    - reference_id: PMID:23055524
      supporting_text: hAPPL2 BARPH is predominantly a dimer in solution
    - reference_id: PMID:23055524
      supporting_text: 95.1 kDa ± 2.0% for hAPPL2 BARPH (theoretical mass of 92.1 for dimer)
    - reference_id: PMID:23055524
      supporting_text: we conclude the stoichiometry of the complex is 2:2.
- term:
    id: GO:0060100
    label: positive regulation of phagocytosis, engulfment
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q8K3G9
  - ensembl:ENSMUSP00000020500
  review:
    summary: APPL2 depletion reduces Fc-gamma-receptor-mediated phagocytosis and delays phagocytic 
      cup closure.
    action: ACCEPT
    reason: 'This is one of the better-evidenced APPL2-specific functions: siRNA against APPL2 alone reduced
      internalisation of IgG-coated particles, delayed the PI(3,4,5)P3 transition and delayed phagocytic
      cup closure, with APPL2 physically on the closing cup and bound to GTP-Rab31 there. The donor is
      mouse Appl2 (Q8K3G9), a 1:1 ortholog 92.7% identical to the human protein, so the orthology transfer
      carries no ortholog-assignment risk. Accepted as a core function - promoting phagosome closure is
      a direct membrane-remodelling role for a BAR-domain Rab effector, not a downstream physiological
      effect.'
    supported_by:
    - reference_id: PMID:25568335
      supporting_text: "siRNA depletion of either Rab31 or APPL2\nreduces FcγR-mediated phagocytosis."
    - reference_id: PMID:25568335
      supporting_text: "Mechanistically, this corresponds with a\ndelay in the transition to PI(3,4,5)P3
        and phagocytic cup closure."
    - reference_id: PMID:25568335
      supporting_text: "During early phagocytosis, we find that Rab31\nrecruits the signaling adaptor
        APPL2."
