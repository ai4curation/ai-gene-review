      supporting_text: "the endocytic\nadaptor molecules APPL1 and APPL2 are required for TGFβ-induced
        nuclear\ntranslocation of TβRI-ICD and for cancer cell invasiveness of human prostate and\nbreast
        cancer cell lines"
    - reference_id: PMID:26583432
      supporting_text: we identify APPL1 as a TβRI- and PKCζ-associated protein and show that APPL1 
        and APPL2 are required for the nuclear translocation of TβRI-ICD
