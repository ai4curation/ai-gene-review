- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:17030088
  qualifier: enables
  supporting_entities:
  - UniProtKB:P23945
  review:
    summary: Interaction with the FSH receptor, reported alongside APPL1 in a receptor-proximal 
      complex.
    action: KEEP_AS_NON_CORE
    reason: FSHR was shown to interact with APPL2 as well as APPL1, independently of FSH 
      stimulation, in a putative FSHR signalling complex. The same paper reports the one clean 
      functional distinction between the paralogs - APPL1 binds Akt2 and APPL2 does not - which is 
      why this reference matters beyond the interaction itself. No APPL2-specific functional 
      consequence of the FSHR interaction has been established, and GO has no more informative 
      molecular-function term for it, so the row is kept as a peripheral protein-binding record 
      rather than re-termed.
    supported_by:
    - reference_id: PMID:17030088
      supporting_text: "This report shows that, in addition to APPL1, \nFSHR interacts with FOXO1a and
        APPL2."
    - reference_id: PMID:17030088
      supporting_text: "APPL1 associates with Akt2, whereas APPL2 does not. This is the first documented\
        \ \ndifference in function between APPL1 and APPL2."
