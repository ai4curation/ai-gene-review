proposed_new_terms:
- proposed_name: negative regulation of adiponectin-activated signaling pathway
  proposed_definition: "A process that stops, prevents or reduces the frequency, rate or extent of the
    adiponectin-activated signaling pathway. GO currently has GO:0033211 adiponectin-activated signaling
    pathway but no signed children: a QuickGO ontology search for 'regulation of adiponectin' returns
    only the secretion branch (GO:0070163, GO:0070164, GO:0070165) and GO:0055100 adiponectin binding.
    APPL2's best-characterised metabolic role is specifically to antagonise this pathway - it competes
    with APPL1 for AdipoR1/AdipoR2 and sequesters APPL1 - and that direction currently cannot be expressed,
    so the annotation has to fall back on the neutral parent."
  justification: Without a signed child, an adiponectin antagonist and an adiponectin potentiator 
    receive the same GO term. APPL1 and APPL2 are exactly that pair, and both are annotated to 
    GO:0033211.
  supported_by:
  - reference_id: PMID:19661063
    supporting_text: "APPL2, an isoform\nof APPL1 that forms a dimer with APPL1, can interacts with both
      AdipoR1 and\nAdipoR2 and acts as a negative regulator of adiponectin signaling in muscle\ncells."
  - reference_id: PMID:19661063
    supporting_text: "suppressing APPL2 expression by RNAi significantly enhances\nadiponectin-stimulated
      glucose uptake and fatty acid oxidation."
  proposed_parent:
    id: GO:0033211
    label: adiponectin-activated signaling pathway
- proposed_name: APPL endosome
  proposed_definition: A subpopulation of early endosomes marked by the Rab5 effectors APPL1 and 
    APPL2, distinguishable from canonical EEA1-positive early endosomes by limited EEA1 
    colocalisation, a distinct migration pattern in continuous density gradients, a peripheral 
    distribution beneath the plasma membrane, and dependence on annexin A2 as well as Rab5 for 
    membrane recruitment. Would be a child of GO:0005769 early endosome.
  justification: The compartment has been defined biochemically and by imaging since 2004 and is 
    referred to by name throughout the field, but the most specific GO term available for APPL2 is 
    GO:0031901 early endosome membrane, which does not distinguish it from the EEA1-positive 
    population the authors explicitly separate it from.
  supported_by:
  - reference_id: PMID:21645192
    supporting_text: "APPL endosomes are a recently identified subpopulation of early endosomes\ncharacterized
      by the presence of two homologous Rab5 effector proteins APPL1 and\nAPPL2."
  - reference_id: PMID:21645192
    supporting_text: "They exhibit only limited colocalization with EEA1, another Rab5 effector\nand a
      marker of the canonical early endosomes."
  - reference_id: PMID:21645192
    supporting_text: Annexin A2 is essential for targeting APPL2 to endosomes and can compensate for
      Rab5 deficiency in mediating APPL membrane recruitment
  proposed_parent:
    id: GO:0005769
    label: early endosome
suggested_questions:
- question: Is the receptor-dependent sign of APPL2's effect on Akt - restraining after TLR4, 
    promoting after Fc-gamma receptor engagement - set by which Rab recruits it (Rab31 on phagosomes
    versus the macropinosomal pool), or by which PI3K is available at each membrane domain?
- question: Is sequestration the molecular activity of APPL2 rather than a side effect of 
    scaffolding? Everything mapped so far is competitive occupancy - of AdipoR1/R2 against APPL1, of
    phospho-Ser235 TBC1D1, of Reptin.
- question: Given that APPL2 and APPL1 heterodimerise through their BAR domains yet oppose each 
    other functionally, is the APPL1-APPL2 heterodimer an inactive reservoir, or does it have 
    activities neither homodimer has?
- question: GO cannot currently express negative regulation of the adiponectin-activated signaling 
    pathway. Should such a term be created, and should APPL1 and APPL2 then be re-annotated to the 
    corresponding positive and negative children?
- question: Should GO represent the APPL endosome as a distinct compartment, given that it is 
    separable from EEA1-positive early endosomes biochemically, by density-gradient migration, by 
    peripheral distribution and by its dependence on annexin A2?
- question: Does the homotetramer recorded for APPL2 in UniProt and GOA have any experimental basis 
    beyond two dimers in a crystallographic asymmetric unit?
suggested_experiments:
- hypothesis: APPL2 contributes to TbetaRI-ICD nuclear transport independently of APPL1, rather than
    only as the redundant half of a pair.
  description: Rescue APPL1/APPL2 double-knockdown cells with APPL2 alone, APPL1 alone, or a 
    BAR-interface mutant that cannot heterodimerise, and score TbetaRI-ICD nuclear accumulation and 
    TGF-beta-induced invasion. This is the control the existing literature lacks and is what would 
    convert the GO:0007179 and GO:0006606 rows from a paralog-pooled result into an APPL2-specific 
    one.
  experiment_type: genetic rescue / single-adaptor complementation
- hypothesis: The basic cluster at residues 151-157 (PKKKENE) is a functional nuclear localisation 
    signal that the PH domain masks.
  description: Mutate 151-157 to alanine and ask whether the nuclear pool of APPL2 is lost and 
    whether the Reptin/HDAC association and the beta-catenin/TCF reporter response go with it; in 
    parallel test whether a PH-domain-deletion construct, which should unmask the motif, shows 
    increased nuclear accumulation. The motif is APPL2-specific - the aligned span in APPL1 is 
    SKKREND - so a positive result would also explain a paralog difference.
  experiment_type: site-directed mutagenesis with imaging and biochemical readouts
- hypothesis: Full-length APPL2 is a dimer in solution, and the homotetramer in the current 
    annotations is a crystal-packing artefact.
  description: Measure the oligomeric state of full-length recombinant APPL2 by mass photometry and 
    SEC-MALS, and compare with the BAR-PH fragment; attempt a structure or prediction of the 
    full-length protein to determine whether the PTB domain supports higher-order assembly.
  experiment_type: biophysical characterisation
- hypothesis: The sign of APPL2's effect on Akt tracks the Rab that recruits it to the membrane.
  description: Compare Akt phosphorylation, PI(3,4,5)P3 kinetics and PI3K-subunit recruitment side 
    by side in APPL2-depleted macrophages stimulated through TLR4 versus the Fc-gamma receptor, with
    Rab31 and Rab5 co-depletion arms, using live probes for the phosphoinositide transitions.
  experiment_type: comparative perturbation with live-cell imaging
- hypothesis: APPL2 antagonises adiponectin signalling by two separable mechanisms - receptor 
    competition and APPL1 sequestration - either of which is sufficient.
  description: Express in Appl2-null myotubes an APPL2 mutant that binds AdipoR1 but not APPL1 and 
    one that binds APPL1 but not AdipoR1, and measure adiponectin-stimulated glucose uptake and 
    fatty acid oxidation for each. The result would also determine whether GO:0140311 protein 
    sequestering activity is the right molecular function or only part of it.
  experiment_type: separation-of-function mutants in a null background
knowledge_gaps:
- gap_statement: "It is not known what determines the sign of APPL2's effect on PI3K/Akt signalling: in
    macrophages APPL2 restrains Akt downstream of TLR4 but promotes it downstream of the Fc-gamma receptor."
  boundary: 'Known: Appl2 knockout raises Akt and NF-kappaB phosphorylation after LPS, while APPL2 depletion
    reduces Akt recruitment and phosphorylation during FcgammaR-mediated phagocytosis, both in macrophages.
    Unknown: whether the reversal is set by the recruiting Rab, the membrane domain, or a different PI3K
    at each site.'
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: Two GO annotations on this gene assert opposite directions of Akt-pathway 
    regulation, and both are correct in context. No single annotation can express a 
    receptor-dependent sign reversal, so the ontology forces an apparent contradiction onto a real 
    biological phenomenon.
  provenance:
  - reference_id: PMID:25328665
    supporting_text: "phosphorylation of Akt and its downstream effector NF-κB was significantly\nenhanced."
  - reference_id: PMID:25568335
    supporting_text: "APPL2\ndepletion also reduced PI3K/Akt signaling and enhanced p38 signaling from
      FcγR."
- gap_statement: Whether APPL2 recruits or regulates a PI3K directly has never been tested, even 
    though the proposed mechanism for its role in phagocytosis depends on it.
  boundary: 'Known: APPL2 depletion delays the PI(4,5)P2-to-PI(3,4,5)P3 transition at the phagocytic cup,
    and mouse Appl2 is found in a complex with the PI3K regulatory subunit p85alpha together with Appl1.
    Unknown: whether APPL2 binds any PI3K subunit directly, and whether that binding is what produces
    the phosphoinositide phenotype.'
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: It is the difference between APPL2 being a lipid-kinase-recruiting adaptor and being
    a passive curvature sensor whose loss perturbs the membrane indirectly.
  provenance:
  - reference_id: PMID:25568335
    supporting_text: It is not known whether these or any other PI3K subunits are recruited or 
      regulated by APPL2, and this remains to be elucidated in future studies.
  - reference_id: PMID:25328665
    supporting_text: "Appl2 is a critical negative regulator of innate immune response via\ninhibition
      of PI3K/Akt/NF-κB signaling pathway by forming a complex with Appl1\nand PI3K."
- gap_statement: 'How the nuclear pool of APPL2 is generated is unknown: the proposed nuclear localisation
    signal at residues 151-157 has never been mutated.'
  boundary: 'Known: the motif PKKKENE is present verbatim at 151-157 of Q8NEU8, lies inside the BAR domain,
    is conserved in mouse Appl2 and diverges in APPL1 (SKKREND), and the crystal structure places it on
    a face masked by the PH domain. A nuclear APPL2 pool is well documented. Unknown: whether this motif
    is the signal, and whether PH-domain rotation gates it.'
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: The nucleus rows and the NuRD and Reptin complex-binding rows all rest on a nuclear 
    pool whose import mechanism is unexplained. It is also one of the very few sequence features 
    that distinguishes APPL2 from APPL1.
  provenance:
  - reference_id: PMID:23055524
    supporting_text: a putative nuclear localization sequence has been identified in the APPL2 
      sequence 151 PKKKENE 157
  - reference_id: PMID:26583432
    supporting_text: A possible nuclear localization signal in APPL2 has recently been observed in 
      silico
  - reference_id: file:human/APPL2/APPL2-bioinformatics/RESULTS.md
    supporting_text: "also present verbatim, sits inside the BAR domain (loop 2), and is conserved in\n\
      mouse Appl2"
- gap_statement: APPL2's individual contribution to TGF-beta-driven TbetaRI-ICD nuclear transport is
    unresolved because only simultaneous APPL1 + APPL2 knockdowns were performed.
  boundary: 'Known: depleting both adaptors abolishes nuclear TbetaRI-ICD accumulation and reduces TGF-beta-induced
    invasion and MMP2/MMP9 transcription. Unknown: whether APPL2 alone is required; the TbetaRI and PKCzeta
    associations were mapped to APPL1 only.'
  gap_kind:
  - CURATION
  status: OPEN
  significance: Two GOA rows (GO:0007179 IMP and GO:0006606 IDA) rest entirely on this design. At 
    ~54% paralog identity and with documented opposite-sign behaviour elsewhere, a double knockdown 
