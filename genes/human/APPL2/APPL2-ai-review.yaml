        comment: "The target's own accession among the seeds, which is expected rather than circular:
          APPL2 has its own experimental signalling annotations (the TAS row from PMID:15016378 and the
          IMP rows from PMID:24879834 and PMID:26583432), and those descendant evidences are part of what
          the PAINT curator used to place the node."
      - source_id: UniProtKB:Q9UKG1
        source_label: APPL1 (Homo sapiens)
        source_status: SUPPORTS_TRANSFER
        comment: Human APPL1, the paralog. It supports the generic parent term; it would not support
