- term:
    id: GO:0033211
    label: adiponectin-activated signaling pathway
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q8K3G9
  - ensembl:ENSMUSP00000020500
  review:
    summary: APPL2 acts in the adiponectin-receptor pathway as APPL1's antagonist; the GO term is 
      sign-neutral and therefore correct.
    action: ACCEPT
    reason: "APPL2 binds AdipoR1 and AdipoR2 through its BAR domain, competes with APPL1 for the receptors
      and sequesters APPL1 away from the pathway; knocking APPL2 down enhances adiponectin-stimulated
      glucose uptake and fatty acid oxidation, and overexpressing it does the reverse. This is a core
      function. The sign-inversion risk here is real but does not bite: GO:0033211 is defined purely as
      the series of signals initiated by adiponectin binding its receptor, with no direction, so involvement
      is all that is asserted and involvement is exactly what the mouse data show. A QuickGO search finds
      no signed child of this term - there is no 'negative regulation of adiponectin-activated signaling
      pathway' - which is recorded under proposed_new_terms. The donor is mouse Appl2 (Q8K3G9), a 1:1
      ortholog 92.7% identical to the human protein, so the orthology transfer carries no ortholog-assignment
      risk."
    supported_by:
    - reference_id: PMID:19661063
      supporting_text: "APPL2, an isoform\nof APPL1 that forms a dimer with APPL1, can interacts with
        both AdipoR1 and\nAdipoR2 and acts as a negative regulator of adiponectin signaling in muscle\n\
        cells."
    - reference_id: PMID:19661063
      supporting_text: "suppressing APPL2 expression by RNAi significantly enhances\nadiponectin-stimulated
        glucose uptake and fatty acid oxidation."
    - reference_id: PMID:19661063
      supporting_text: "APPL2\nalso suppresses adiponectin and insulin signaling by sequestrating APPL1
        from\nthese two pathways."
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: UniProtKB:Q8K3G9
        source_label: Appl2 (Mus musculus)
        source_status: SUPPORTS_TRANSFER
        comment: Mouse Appl2, the 1:1 ortholog of the target and the only gene-level donor on this 
          row; human and mouse APPL2 are 92.7% identical over a full-length global alignment 
          (APPL2-bioinformatics/RESULTS.md), so the transfer itself is safe. The mouse evidence 
          (PMID:19661063) is APPL2-specific in both directions (RNAi and overexpression in C2C12 
          myotubes) and the transferred term carries no regulatory sign, so the negative direction 
          of APPL2's effect cannot be inverted by this transfer.
      - source_id: ensembl:ENSMUSP00000020500
        source_label: Appl2 (Mus musculus), Ensembl protein
        source_status: SUPPORTS_TRANSFER
        comment: Ensembl protein accession for the same mouse Appl2 entry (it resolves to 
          UniProtKB:Q8K3G9), so this row carries one donor under two identifiers, not two 
          independent donors.
