- term:
    id: GO:0042593
    label: glucose homeostasis
  evidence_type: IMP
  original_reference_id: PMID:24879834
  qualifier: involved_in
  review:
    summary: Muscle-specific APPL2 deletion improves glucose tolerance in mice.
    action: ACCEPT
    reason: Conditional deletion of APPL2 in skeletal muscle enhanced insulin sensitivity and 
      improved glucose tolerance, and the cellular phenotype runs in both directions - 
      overexpression impairs and knockdown enhances insulin-evoked GLUT4 recruitment and glucose 
      uptake. The mechanism is mapped to a phospho-Ser235-dependent TBC1D1 interaction. This is the 
      best-evidenced APPL2 function in the record and is core.
    supported_by:
    - reference_id: PMID:24879834
      supporting_text: "conditional deletion of APPL2 in skeletal\nmuscles enhances insulin sensitivity,
        leading to an improvement in glucose\ntolerance."
    - reference_id: PMID:24879834
      supporting_text: "insulin-evoked plasma membrane recruitment of GLUT4 and glucose uptake are impaired
        by APPL2 overexpression but\nenhanced by APPL2 knockdown."
    - reference_id: PMID:24879834
      supporting_text: "Insulin stimulates TBC1D1 phosphorylation on\nserine 235, leading to enhanced
        interaction with the BAR domain of APPL2, which\nin turn suppresses insulin-evoked TBC1D1 phosphorylation
        on threonine 596 in\ncultured myotubes and skeletal muscle."
