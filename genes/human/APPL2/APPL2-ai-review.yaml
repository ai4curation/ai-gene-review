  review:
    summary: Phagosome membrane keyword projection, ultimately from mouse macrophage imaging.
    action: KEEP_AS_NON_CORE
    reason: UniProt's Phagosome membrane keyword for APPL2 is a by-similarity annotation from mouse 
      Appl2, which was imaged on early, actin-rich phagosomes in primary macrophages and RAW264.7 
