      supporting_text: "siRNA depletion of either Rab31 or APPL2\nreduces FcγR-mediated phagocytosis."
    - reference_id: PMID:25568335
      supporting_text: "Mechanistically, this corresponds with a\ndelay in the transition to PI(3,4,5)P3
