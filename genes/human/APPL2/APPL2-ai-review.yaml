  review:
    summary: Membership of an endogenous Reptin/beta-catenin/HDAC1/HDAC2 complex together with 
      APPL1.
    action: KEEP_AS_NON_CORE
    reason: "This row's WITH/FROM is the set CTNNB1, HDAC1, HDAC2 and APPL1 - it records co-membership
      of a nuclear repressive complex rather than a pairwise interaction. The complex is endogenous and
      the functional consequence is real: overexpressing APPL2 reduces the HDAC1/HDAC2 and beta-catenin
      associated with Reptin. It is non-core because the APPL2 evidence in this paper is entirely overexpression-based
      - APPL2 is practically undetectable in the HEK293 cells used, so no loss-of-function control was
      possible."
    supported_by:
    - reference_id: PMID:19433865
      supporting_text: "APPL proteins are present in an endogenous complex containing Reptin,\nbeta-catenin,
        HDAC1, and HDAC2."
    - reference_id: PMID:19433865
      supporting_text: overexpression of either APPL protein clearly reduced the levels of HDAC1 and
        HDAC2 associated with Reptin
    - reference_id: PMID:19433865
      supporting_text: Since APPL2 is practically undetectable in HEK293 cells, we could not test 
        the effects of its knockdown on transcription.
