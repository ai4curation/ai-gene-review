- term:
    id: GO:0010008
    label: endosome membrane
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - MGI:MGI:1920243
  - PANTHER:PTN000572460
  - UniProtKB:Q8NEU8
  - UniProtKB:Q9UKG1
  review:
    summary: Family-level endosomal-membrane inference placed at the Bilateria node ancestral to 
      both APPL paralogs; correct and core for APPL2.
    action: ACCEPT
    reason: "The IBD behind this IBA sits on PTN000572460 at taxon 33213 (Bilateria), above the APPL1/APPL2
      duplication, and was seeded by mouse Appl1, human APPL1 and human APPL2 itself. Membrane recruitment
      through Rab binding is the defining property of both paralogs, so placing it at their last common
      ancestor is the right depth, and APPL2 sits squarely inside the inheriting clade (PANTHER subfamily
      PTHR46415:SF1). The target's own accession in the WITH/FROM is expected: APPL2 carries two independent
      IDA rows for this exact term plus an EXP row for the more specific early endosome membrane, and
      those descendant evidences are part of what the curator used to place the node. There is no evidence
      of loss or divergence - APPL2 binds four Rabs, is recruited by annexin A2, and is solubilised from
      endosomes when that recruitment fails."
    supported_by:
    - reference_id: PMID:21645192
      supporting_text: "APPL endosomes are a recently identified subpopulation of early endosomes\ncharacterized
        by the presence of two homologous Rab5 effector proteins APPL1 and\nAPPL2."
    - reference_id: PMID:15016378
      supporting_text: "This pathway operates via APPL1 and APPL2, two Rab5\neffectors, which reside on
        a subpopulation of endosomes."
    - reference_id: PMID:21645192
      supporting_text: Annexin A2 is essential for targeting APPL2 to endosomes and can compensate 
        for Rab5 deficiency in mediating APPL membrane recruitment
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: MGI:MGI:1920243
        source_label: Appl1 (Mus musculus)
        source_status: SUPPORTS_TRANSFER
        comment: Mouse Appl1, resolved to UniProtKB:Q8K3H0. A Rab5 effector on the same APPL 
          endosome compartment; the localisation is correct for it and transfers correctly to APPL2,
          which was shown on the same structures in the original characterisation.
      - source_id: PANTHER:PTN000572460
        source_label: PTHR46415 Bilateria (taxon 33213) IBD node ancestral to both APPL1 (subfamily 
          SF3) and APPL2 (SF1)
        source_status: SUPPORTS_TRANSFER
        comment: Bilateria-level IBD node of PTHR46415, seeded by mouse Appl1, human APPL1 and human
          APPL2. The family has only two nodes and five reviewed members, and this node is ancestral
          to both subfamilies (SF1 = APPL2, SF3 = APPL1), so endosomal-membrane localisation is 
          asserted for the whole family. APPL2 is inside the inheriting clade.
      - source_id: UniProtKB:Q8NEU8
        source_label: APPL2 (Homo sapiens), the target
        source_status: SUPPORTS_TRANSFER
        comment: "The target's own accession, which is correct and expected here rather than circular:
          APPL2 has two IDA rows for GO:0010008 (PMID:15016378, PMID:21645192) and an EXP row for early
          endosome membrane, and those are among the descendant evidences the PAINT curator used to place
          the IBD. Their presence means the IBA adds a claim of inheritance on top of experimental grounding
          that already exists on the target."
      - source_id: UniProtKB:Q9UKG1
        source_label: APPL1 (Homo sapiens)
        source_status: SUPPORTS_TRANSFER
        comment: Human APPL1, the paralog. APPL1 and APPL2 were identified together as the two Rab5 
          effectors defining APPL endosomes, so its endosomal-membrane evidence is directly 
          applicable to the node.
