- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:15016378
  qualifier: enables
  supporting_entities:
  - UniProtKB:P20339
  review:
    summary: Bare protein binding for a Rab GTPase partner (RAB5A); the informative term is small 
      GTPase binding.
    action: MODIFY
    reason: "APPL2 is a Rab effector: it binds GTP-loaded Rab5, Rab22A, Rab24 and Rab31 in a screen against
      46 Rabs, binds purified Rab31 directly with a preference for the GTP form, and the APPL2 BAR-PH
      dimer binds two Rab31 molecules. 'Protein binding' says none of this. GO:0031267 small GTPase binding
      is the current term for it - the former GO:0017137 'Rab GTPase binding' is listed among GO:0031267's
      secondary ids, i.e. it was merged into small GTPase binding rather than obsoleted, so GO:0031267
      is the id to use."
    proposed_replacement_terms:
    - id: GO:0031267
      label: small GTPase binding
    supported_by:
    - reference_id: PMID:15016378
      supporting_text: "This pathway operates via APPL1 and APPL2, two Rab5\neffectors, which reside on
        a subpopulation of endosomes."
    - reference_id: PMID:15016378
      supporting_text: "Both APPL1 and APPL2 are essential for cell proliferation and their\nfunction
        requires Rab5 binding."
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:15016378
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q9UKG1
  review:
    summary: Bare protein binding for the APPL1 partner; the interaction is a defined BAR-domain 
      heterodimer.
    action: MODIFY
    reason: "APPL1 is by far the most frequently reported APPL2 partner in this GOA record, and the interaction
      is not a generic one: the minimal BAR domains are necessary and sufficient for APPL1-APPL2 heterodimerisation
      in yeast two-hybrid and the proteins reciprocally coimmunoprecipitate. GO:0046982 protein heterodimerization
      activity states that, where 'protein binding' does not. The heterodimer is also the mechanistic
      substrate of the adiponectin antagonism, in which APPL2 sequesters APPL1."
    proposed_replacement_terms:
    - id: GO:0046982
      label: protein heterodimerization activity
    supported_by:
    - reference_id: PMID:18034774
      supporting_text: the APPL minimal BAR domains were necessary and sufficient for mediating 
        APPL1-APPL1, APPL2-APPL2 and APPL1-APPL2 interactions in the yeast two-hybrid system
    - reference_id: PMID:18034774
      supporting_text: APPL2-V5-His specifically coimmunoprecipitated with APPL1-YFP and vice versa
    - reference_id: PMID:15016378
      supporting_text: "This pathway operates via APPL1 and APPL2, two Rab5\neffectors, which reside on
