  supporting_entities:
  - MGI:MGI:2384914
  - PANTHER:PTN000572460
  - UniProtKB:Q8NEU8
  - UniProtKB:Q9UKG1
  review:
    summary: "A deliberately generic family-level term: the node's seeds are APPL1 and APPL2, whose signalling
      roles are opposite in sign."
    action: KEEP_AS_NON_CORE
    reason: "The IBD sits on PTN000572460 at Bilateria, seeded by mouse Appl2, human APPL1 and human APPL2.
      The instinct is to call such a high-level term a granularity mismatch, and that would be wrong here.
      The two seeds disagree in sign: APPL1 potentiates adiponectin and Akt signalling while APPL2 antagonises
      it, competing for AdipoR1/R2 and sequestering APPL1; and in the same macrophage system APPL1 and
      APPL2 have 'separate and opposing functions' in Akt and MAPK signalling. Any child term specific
      enough to be informative would be false for one seed, so the uninformative parent is the honest
      least common ancestor and there is no propagation failure. It is non-core only in the sense that
      the term conveys nothing; the underlying claim - that APPL2 is a signalling adaptor - is correct
      and is stated properly by the pathway-specific rows."
    supported_by:
    - reference_id: PMID:19661063
      supporting_text: "APPL2, an isoform\nof APPL1 that forms a dimer with APPL1, can interacts with
        both AdipoR1 and\nAdipoR2 and acts as a negative regulator of adiponectin signaling in muscle\n\
        cells."
    - reference_id: PMID:27219021
      supporting_text: "By\ndepleting cells of each adaptor respectively we show separate and opposing\n\
        functions for APPL1 and 2 in Akt and MAPK signaling."
    - reference_id: PMID:19661063
      supporting_text: "APPL2\nalso suppresses adiponectin and insulin signaling by sequestrating APPL1
        from\nthese two pathways."
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
      - source_id: MGI:MGI:2384914
        source_label: Appl2 (Mus musculus)
        source_status: SUPPORTS_TRANSFER
        comment: Mouse Appl2, resolved to UniProtKB:Q8K3G9 - the target's own 1:1 ortholog, 92.7% 
          identical. Its signalling annotations come from Appl2 knockout mice and Appl2-specific 
          knockdowns.
      - source_id: PANTHER:PTN000572460
        source_label: PTHR46415 Bilateria (taxon 33213) IBD node ancestral to both APPL1 (subfamily 
          SF3) and APPL2 (SF1)
        source_status: SUPPORTS_TRANSFER
        comment: Bilateria-level IBD node of PTHR46415, seeded by mouse Appl2, human APPL1 and human
          APPL2. Because the node is ancestral to both paralogs and the paralogs' signalling roles 
          are opposite in sign, GO:0023052 is the correct least common ancestor rather than an 
          under-specified choice. The same curator placed the AKT-binding and insulin-receptor 
          -signalling IBDs one node down, at PTN008708200 (Tetrapoda, APPL1 subfamily only), where 
          APPL2 does not inherit them - which is corroborated by direct human evidence that APPL1 
          binds Akt2 and APPL2 does not.
      - source_id: UniProtKB:Q8NEU8
        source_label: APPL2 (Homo sapiens), the target
