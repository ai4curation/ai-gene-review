- term:
    id: GO:0050768
    label: negative regulation of neurogenesis
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q8K3G9
  - ensembl:ENSMUSP00000020500
  review:
    summary: negative regulation of neurogenesis, driven mainly by APPL2 transgenic overexpression 
      in mouse.
    action: KEEP_AS_NON_CORE
    reason: 'The in vivo evidence is an APPL2 transgenic mouse: APPL2 Tg animals have reduced hippocampal
      and olfactory neurogenesis and a higher glial fraction, reversible by a glucocorticoid-receptor
      antagonist. A matching loss-of-function exists only in cultured neural stem cells, where APPL2 knockdown
      promoted neurogenesis. So both directions exist and the negative sign is right, but the animal-level
      claim rests on gain of function, where an overexpressed adaptor can titrate partners non-physiologically.
      The donor is mouse Appl2 (Q8K3G9), a 1:1 ortholog 92.7% identical to the human protein, so the orthology
      transfer carries no ortholog-assignment risk. Non-core: this is a tissue-specific developmental
      consequence of APPL2 tuning glucocorticoid-receptor sensitivity, several steps from the molecular
      function.'
    supported_by:
    - reference_id: PMID:28965332
      supporting_text: "APPL2 Tg mice had decreased\nhippocampal neurogenesis that was reversed by GR
        antagonist RU486."
    - reference_id: PMID:32468397
      supporting_text: APPL2 overexpression resulted in NSCs switching from neuronal differentiation
        to gliogenesis while APPL2 knockdown promoted neurogenesis.
    - reference_id: PMID:32468397
      supporting_text: APPL2 Tg mice had a higher population of glial cells and dampened neuronal 
        production in the olfactory system
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
      - source_id: UniProtKB:Q8K3G9
        source_label: Appl2 (Mus musculus)
        source_status: SUPPORTS_TRANSFER
        comment: Mouse Appl2, the 1:1 ortholog of the target and the only gene-level donor on this 
