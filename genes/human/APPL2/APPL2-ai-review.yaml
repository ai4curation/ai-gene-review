- term:
    id: GO:0032009
    label: early phagosome
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: located_in
  supporting_entities:
  - UniProtKB:Q8K3G9
  - ensembl:ENSMUSP00000020500
  review:
    summary: APPL2 on early phagosomes in macrophages, transferred from mouse.
    action: ACCEPT
    reason: 'Rab31-GTP recruits APPL2 to early-stage phagosomes in mouse macrophages, where the two colocalise
      around the phagosome circumference; the authors call this the first evidence that APPL2 is associated
      with early phagosomes. The donor is mouse Appl2 (Q8K3G9), a 1:1 ortholog 92.7% identical to the
      human protein, so the orthology transfer carries no ortholog-assignment risk. Accepted as core rather
      than peripheral: this is precisely where APPL2 performs the phagocytic-cup-closure and Fc-gamma-receptor
      signalling functions that are themselves accepted as core, and a location is not made peripheral
      by being cell-type-restricted when the activity carried out there is central. Note that in macrophages
      this pool replaces rather than supplements the endosomal one - APPL2 is largely absent from endosomes
      in that cell type.'
    supported_by:
    - reference_id: PMID:25568335
      supporting_text: This is the first evidence that APPL2 is associated with early phagosomes.
    - reference_id: PMID:25568335
      supporting_text: "During early phagocytosis, we find that Rab31\nrecruits the signaling adaptor
        APPL2."
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
      - source_id: UniProtKB:Q8K3G9
        source_label: Appl2 (Mus musculus)
        source_status: SUPPORTS_TRANSFER
        comment: Mouse Appl2, the 1:1 ortholog of the target and the only gene-level donor on this 
          row; human and mouse APPL2 are 92.7% identical over a full-length global alignment 
          (APPL2-bioinformatics/RESULTS.md), so the transfer itself is safe. The mouse observation 
          is GTP-Rab31-dependent recruitment of APPL2 to early phagosomes in primary macrophages and
          RAW264.7 cells (PMID:25568335).
      - source_id: ensembl:ENSMUSP00000020500
        source_label: Appl2 (Mus musculus), Ensembl protein
        source_status: SUPPORTS_TRANSFER
        comment: Ensembl protein accession for the same mouse Appl2 entry (it resolves to 
          UniProtKB:Q8K3G9), so this row carries one donor under two identifiers, not two 
          independent donors.
