- term:
    id: GO:0001786
    label: phosphatidylserine binding
  evidence_type: IDA
  original_reference_id: PMID:18034774
  qualifier: enables
  review:
    summary: Phosphatidylserine binding was seen only for the isolated PTB domain on a lipid strip, 
      not for full-length APPL2.
    action: KEEP_AS_NON_CORE
    reason: "On PIP Strips the isolated APPL PTB domains bound phosphatidylserine, but the full-length
      proteins did not, and the authors explicitly flag the discrepancy. This is a real property of the
      domain in vitro and it is consistent with the PTB domain's role in membrane targeting, but it has
      not been shown for the intact protein and no cellular consequence has been attached to it. Kept,
      not removed, and marked non-core: the phosphoinositide binding of the full-length protein (GO:0035091)
      is the better-supported lipid-binding claim."
    supported_by:
    - reference_id: PMID:18034774
      supporting_text: APPL isolated PTB domains also bound to membrane-immobilized 
        phosphatidylserine (PS, spot 15).
    - reference_id: PMID:18034774
      supporting_text: It is possible that APPL-APPL interactions and/or the overall conformation of
        the full-length proteins may inhibit PTB domain-mediated PS binding.
