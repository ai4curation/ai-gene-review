- term:
    id: GO:0090263
    label: positive regulation of canonical Wnt signaling pathway
  evidence_type: IMP
  original_reference_id: PMID:19433865
  review:
    summary: APPL2 relieves Reptin-mediated repression of beta-catenin/TCF-dependent transcription 
      in human cells, a function with no corresponding GOA row.
    action: NEW
    reason: GOA carries the APPL2-RUVBL2/Reptin and APPL2-CTNNB1/HDAC1/HDAC2 interactions as bare 
      protein-binding rows but no biological-process row for what those interactions do. In human 
      HEK293 cells, APPL2 overexpression increased beta-catenin-stimulated SuperTOPflash activity 
      dose-dependently with no effect on the mutated-site control reporter, increased Wnt3a-induced 
      expression of endogenous Wnt target genes, relieved Reptin-mediated repression, reduced 
      HDAC1/HDAC2 and beta-catenin bound to Reptin, and increased beta-catenin occupancy at the 
      cyclin D1 and Axin2 promoters while reducing Reptin and HDAC1 there. UniProt annotates the 
      same role on Q8NEU8 with experimental evidence from this paper. Coded IMP rather than IDA 
      because the perturbation is overexpression; the caveat that this is a gain-of-function assay 
      is genuine - APPL2 is practically undetectable in HEK293 cells, so no knockdown control was 
      possible, and APPL2's effect was consistently smaller than APPL1's.
    supported_by:
    - reference_id: PMID:19433865
      supporting_text: overexpression of either APPL1 or APPL2 increased the levels of 
        β-catenin-stimulated reporter activity in a dose-dependent manner
    - reference_id: PMID:19433865
      supporting_text: in cells treated with Wnt3a-conditioned medium, overexpression of either 
        APPL1 or APPL2 proteins caused higher expression of the Wnt target genes
    - reference_id: PMID:19433865
      supporting_text: this repression was relieved in a dose-dependent manner by adding increasing 
        amounts of APPL1 or APPL2
    - reference_id: PMID:19433865
      supporting_text: overexpression of either APPL protein clearly reduced the levels of HDAC1 and
        HDAC2 associated with Reptin
    - reference_id: PMID:19433865
      supporting_text: Since APPL2 is practically undetectable in HEK293 cells, we could not test 
        the effects of its knockdown on transcription.
- term:
    id: GO:0140311
    label: protein sequestering activity
  evidence_type: ISS
  original_reference_id: PMID:19661063
  supporting_entities:
  - UniProtKB:Q8K3G9
  review:
    summary: APPL2 sequesters APPL1 away from the adiponectin and insulin pathways - the mechanism 
      behind its antagonism, and a molecular function GOA does not record.
    action: NEW
    reason: 'Every functional row on this gene describes what APPL2 does to a pathway; none names the
      molecular activity by which it does it. The mechanism is explicit in the source: APPL2 binds AdipoR1
      and AdipoR2 through its BAR domain, competes with APPL1 for the receptors, and additionally suppresses
      both adiponectin and insulin signalling by sequestrating APPL1 from those pathways; adiponectin
      and metformin both trigger APPL1-APPL2 dissociation, so the sequestration is regulated rather than
      constitutive. GO:0140311 is defined as binding a protein to prevent it interacting with other partners
      or to inhibit its localisation to where it is active, which is exactly this. Coded ISS with mouse
      Appl2 (Q8K3G9) as the donor because the experiments are in C2C12 mouse myotubes; the human protein
      is 92.7% identical and the APPL1-APPL2 heterodimer that the activity depends on is established directly
      for the human proteins.'
    supported_by:
    - reference_id: PMID:19661063
      supporting_text: "APPL2\nalso suppresses adiponectin and insulin signaling by sequestrating APPL1
        from\nthese two pathways."
    - reference_id: PMID:19661063
      supporting_text: "APPL2, an isoform\nof APPL1 that forms a dimer with APPL1, can interacts with
        both AdipoR1 and\nAdipoR2 and acts as a negative regulator of adiponectin signaling in muscle\n\
        cells."
    - reference_id: PMID:19661063
      supporting_text: "Overexpression of APPL2 inhibits the interaction between APPL1 and\nAdipoR1, leading
        to down-regulation of adiponectin signaling in C2C12 myotubes."
    - reference_id: file:human/APPL2/APPL2-bioinformatics/RESULTS.md
      supporting_text: Human and mouse APPL2 are 92.7% identical over a full-length global alignment
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: UniProtKB:Q8K3G9
        source_label: Appl2 (Mus musculus)
        source_status: SUPPORTS_TRANSFER
        comment: Mouse Appl2, the 1:1 ortholog of the target (92.7% identity over a full-length 
          global alignment, APPL2-bioinformatics/RESULTS.md). The sequestration was shown in mouse 
          C2C12 myotubes by overexpression and RNAi, and the heterodimer it depends on is 
          independently established for the human proteins by yeast two-hybrid and reciprocal 
          coimmunoprecipitation, so the transfer is safe.
      residue_claims_not_applicable: The activity is mediated by the BAR-domain heterodimer 
        interface rather than by any identified catalytic or binding residue, and no BAR-interface 
        mutant has been reported, so there is no residue-level claim to make.
