[project]
name = "appl2-bioinformatics"
version = "0.1.0"
description = "Sequence-level checks supporting the human APPL2 (Q8NEU8) GO annotation review"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "biopython>=1.84",
    "requests>=2.32",
]

[build-system]
requires = ["uv_build>=0.7.0,<0.13.0"]
build-backend = "uv_build"
