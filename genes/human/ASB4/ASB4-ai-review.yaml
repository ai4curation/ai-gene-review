- id: PMID:21955513
  title: Ankyrin repeat and SOCS box containing protein 4 (Asb-4) colocalizes with insulin receptor substrate
    4 (IRS4) in the hypothalamic neurons and mediates IRS4 degradation.
  findings:
  - statement: Asb-4 increases IRS4 ubiquitination.
    supporting_text: As shown in Figure 4E, using Chinese hamster overy (CHO) cells, Asb-4 increased the
      ubiquitination of IRS4.
  - statement: Asb-4 binds IRS4 in hypothalamus.
    supporting_text: Furthermore, Asb-4 co-immunoprecipitated with IRS4 in rat hypothalamic extracts.
  - statement: Asb-4 reduces AKT Thr308 phosphorylation.
    supporting_text: In HEK293 cells expression of Asb-4 decreased both basal and insulin-stimulated phosphorylation
      of AKT at Thr308 (Figure 5).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text; rat hypothalamus and cell lines.
