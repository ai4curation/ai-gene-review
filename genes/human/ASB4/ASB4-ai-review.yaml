id: Q9Y574
gene_symbol: ASB4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ASB4 is an ankyrin repeat and SOCS box protein of the ASB family that serves as the substrate-recognition
  subunit of an Elongin B/C-cullin (CUL2 or CUL5)-RBX1 E3 ubiquitin ligase. It binds the asparaginyl hydroxylase
  FIH and is hydroxylated in an oxygen-dependent manner. ASB4 polyubiquitinates the transcriptional regulator
  ID2 for proteasomal degradation, promoting trophoblast differentiation and placental vascular patterning,
  and overexpression promotes vascular differentiation of embryonic stem cells. In hypothalamic neurons
  it binds and ubiquitinates IRS4, promoting its degradation and dampening insulin signalling. It also
  binds the COP9 signalosome subunit GPS1 and lowers its levels.
