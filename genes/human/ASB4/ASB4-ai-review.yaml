  title: Ankyrin repeat and SOCS box containing protein 4 (Asb-4) interacts with GPS1 (CSN1) and inhibits
    c-Jun NH2-terminal kinase activity.
  findings:
  - statement: Asb-4 binds GPS1.
    supporting_text: As shown in Figure 2 , HA-GPS1 co-precipitated with Myc-Asb-4, detected by anti-Myc
      antibody ( Figure 2A ), and Myc-Asb-4 co-precipitated with HA-GPS1 detected by anti-HA antibody
      ( Figure 2B ).
  - statement: Asb-4 lowers cytosolic GPS1.
    supporting_text: Asb-4 may affect JNK activity by reducing the cytosolic protein levels of GPS1.
  - statement: Asb-4 is localized solely in the cytosol.
