  evidence_type: TAS
  original_reference_id: PMID:9164961
  qualifier: involved_in
  review:
    summary: Inflammatory response. A3AR agonists inhibit neutrophil degranulation in activated human
      whole blood.
    action: KEEP_AS_NON_CORE
    reason: Pharmacological studies (an A3-selective agonist reversed by XAC) implicate A3AR in modulating
      neutrophil degranulation during inflammation. This is a downstream, cell-type-specific physiological
      role.
    supported_by:
    - reference_id: PMID:9164961
      supporting_text: adenosine acts via A2 as well as A3 receptors to inhibit neutrophil degranulation
