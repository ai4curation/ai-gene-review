- term:
    id: GO:0008016
    label: regulation of heart contraction
  evidence_type: TAS
  original_reference_id: PMID:9837869
  qualifier: involved_in
  review:
    summary: Regulation of heart contraction, attributed to a paper on cardiomyocyte protection during
      simulated ischemia.
    action: MARK_AS_OVER_ANNOTATED
    reason: The cited study shows that overexpressing human A3AR protects cultured chick cardiomyocytes
      from simulated ischemia (ATP content, cell death, CK release). It does not measure contractility.
      Cardioprotection is not regulation of heart contraction.
    supported_by:
    - reference_id: PMID:9837869
      supporting_text: cultured myocytes with enhanced expression of the human A3 receptor and showed
        significantly higher ATP content, fewer cells killed, and less creatine kinase released into the
        medium
