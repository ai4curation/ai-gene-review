- term:
    id: GO:0007190
    label: activation of adenylate cyclase activity
  evidence_type: TAS
  original_reference_id: PMID:9380026
  qualifier: involved_in
  review:
    summary: Activation of adenylate cyclase activity. Based on adenylyl cyclase sensitization after prolonged
      agonist exposure.
    action: MARK_AS_OVER_ANNOTATED
    reason: A3AR is a Gi-coupled receptor that acutely inhibits adenylyl cyclase. The cited study reports
      adaptive supersensitization of adenylyl cyclase after hours of agonist treatment, in parallel with
      receptor desensitization. That is an indirect cellular adaptation, not receptor-driven activation
      of the cyclase, so the term misrepresents what A3AR does.
    supported_by:
    - reference_id: PMID:9380026
      supporting_text: prolonged treatment with the AR agonist 5'-N-ethylcarboxamidoadenosine induces
        uncoupling of the A3AR from G proteins and functional desensitization
