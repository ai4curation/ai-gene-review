  review:
    summary: Plasma membrane. A3AR is a 7TM receptor at the cell surface, with an extracellular orthosteric
      site.
    action: ACCEPT
    reason: As a class A GPCR, A3AR spans the plasma membrane seven times and binds extracellular adenosine
      and RNA-derived nucleosides released into the extracellular space. Flow-cytometric measurement of
      A3R cell-surface expression in the i6A/m6A study, and Reactome's placement of the ligand-receptor-Gi
      reactions at the plasma membrane, support this location. The UniProt location is inferred by similarity;
      the multi-pass topology is supported by structures.
    supported_by:
    - reference_id: PMID:39511145
      supporting_text: The cell surface expression of A3R was measured as described previously with modifications
    - reference_id: PMID:33472058
      supporting_text: most modified nucleosides are resistant to degradation and are released into the
        extracellular space
    - reference_id: Reactome:R-HSA-418904
      supporting_text: A1 and A3 receptors bind adenosine
