core_functions:
- description: Cell-surface Gi-coupled receptor for extracellular adenosine and RNA-derived modified nucleosides
    (m6A, i6A). Ligand binding in the extracellular orthosteric pocket activates Gi, which inhibits adenylyl
    cyclase and lowers cAMP.
  molecular_function:
    id: GO:0001609
    label: G protein-coupled adenosine receptor activity
  locations:
  - id: GO:0005886
    label: plasma membrane
  directly_involved_in:
  - id: GO:0007193
    label: adenylate cyclase-inhibiting G protein-coupled receptor signaling pathway
  supported_by:
  - reference_id: PMID:40825947
    supporting_text: with A1AR and A3AR preferentially coupling to Gi proteins
  - reference_id: PMID:33472058
    supporting_text: acts as a ligand for the human adenosine A3 receptor, for which it has greater affinity
      than unmodified adenosine
  - reference_id: PMID:9837869
    supporting_text: Cardiac myocytes transfected with the A 3 receptor cDNA had an enhanced IB-MECA-mediated
      inhibition of adenylyl cyclase activity.
suggested_questions:
- question: Are m6A and i6A physiologically relevant A3AR agonists at the concentrations found in human
    tissues, compared with adenosine?
- question: How does A3AR coupling bias (Gi versus Gq/beta-arrestin) differ among mast cells, neutrophils
    and tumor cells?
suggested_experiments:
- description: Use A3AR-deficient human mast cells (CRISPR) to test whether m6A/i6A-driven degranulation
    requires A3AR, and profile G protein and arrestin coupling with BRET sensors.
