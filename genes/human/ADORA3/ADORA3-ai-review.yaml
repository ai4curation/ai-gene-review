id: P0DMS8
gene_symbol: ADORA3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ADORA3 encodes the adenosine A3 receptor (A3AR), a class A seven-transmembrane G protein-coupled
  receptor in the plasma membrane, with an extracellular orthosteric pocket for extracellular adenosine.
  It couples mainly to Gi/o proteins, which inhibit adenylyl cyclase and lower cAMP. It also activates
  ERK1/2 and PI3K pathways. Besides adenosine, it is activated selectively by RNA-derived modified nucleosides,
  including N6-methyladenosine (m6A) and N6-isopentenyladenosine (i6A), which are released from cells
  under stress. A3AR is expressed in lung, liver, kidney, heart and inflammatory cells such as mast cells
  and neutrophils. It modulates mast-cell degranulation (type I allergic responses), neutrophil degranulation,
  ischemic cardioprotection and, in rodents, hippocampal synaptic transmission. Overexpression in osteosarcoma
  cells suppresses proliferation and migration.
