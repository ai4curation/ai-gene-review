- id: PMID:23129749
  title: Congenital B cell lymphocytosis explained by novel germline CARD11 mutations.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete cached abstract and selected unique Results/Discussion/Methods read. Four human
      patients from a family and a separate case, germline sequencing, patient lymphocyte phenotypes and
      WT/mutant reconstitution support activating CARD11 variants and BENTA. BJAB/Jurkat-derived assays
      and primary human T cells distinguish constitutive NF-kappaB activation from subsequent T-cell hyporesponsiveness.
      Chronic mutant signaling is not a claim that normal CARD11 constitutively drives this phenotype;
      increased marrow output and malignant progression mechanisms remain interpretations. Images and
      supplementary clinical tables were not inspected.
- id: PMID:23561803
  title: Whole-exome sequencing links caspase recruitment domain 11 (CARD11) inactivation to severe combined
    immunodeficiency.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete canonical metadata and abstract read; full text unavailable. A homozygous nonsense
      variant in an infant of consanguineous parents, profound T-cell functional defects/agammaglobulinemia
      and reconstitution of truncated CARD11 support autosomal-recessive SCID. The abstract explicitly
      reports defective antigen-receptor signaling and NF-kappaB activation, but detailed constructs,
      cell recipient, Methods and images were not recovered.
  full_text_unavailable: true
- id: PMID:14673152
  title: CD3/CD28 costimulation-induced NF-kappaB activation is mediated by recruitment of protein kinase
    C-theta, Bcl10, and IkappaB kinase beta to the immunological synapse through CARMA1.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete canonical HTML main Introduction/Methods/Results/Discussion and abstract read.
      Human CARMA1 cDNA comparison, tagged WT/L808P reconstitution in Jurkat-derived JPM50.6 cells, SEE-Raji
      conjugate imaging and raft fractionation support synaptic recruitment and organization of signaling
      proteins. Contact formation persists without CARMA1. PKC-theta coassociation need not be binary.
      The HTML contains figure placeholders but omits original figure captions/images, which were not
      independently inspected.
core_functions:
- description: CARD11 converts receptor-dependent activation into a BCL10-nucleating
    assembly and recruits MALT1 and ubiquitin-signaling components. This physical organization
    advances canonical NF-kappaB signaling, including bringing BCL10 together with the
    HOIP enzyme. Plasma-membrane and lipid-raft association provide established functional
    contexts for this regulated adaptor; a fixed native oligomer size is not assumed.
  molecular_function:
    id: GO:0035591
    label: signaling adaptor activity
  directly_involved_in:
  - id: GO:0043123
    label: positive regulation of canonical NF-kappaB signal transduction
  locations:
  - id: GO:0005886
    label: plasma membrane
  - id: GO:0045121
    label: membrane raft
  in_complex:
    id: GO:0032449
    label: CBM complex
  supported_by:
  - reference_id: PMID:24074955
    supporting_text: 'substoichiometric CARMA1

      nucleates Bcl10 filaments'
  - reference_id: PMID:27777308
    supporting_text: co-recruiting Bcl10 with HOIP, thereby bringing substrate to enzyme
  - reference_id: PMID:12154360
  - reference_id: PMID:17287217
suggested_questions:
- question: Does purified, correctly folded full-length human CARD11 or its GUK domain
    catalyze GMP phosphorylation, with nucleotide-product identification and suitable
    positive and negative controls? The inspected historical source does not establish
    this chemistry; the over-annotation judgment does not establish catalytic inactivity.
- question: Which defined apoptotic pathway, if any, is directly regulated by CARD11 in a target-specific
    experiment, rather than inferred from CARD architecture or transformed-cell viability?
- question: Which CARD11 peptides and vesicle-purification controls support the neural-stem-cell extracellular-exosome
    assertion?
- question: What is the active full-length CARD11 assembly in native lymphocytes, and how do small-oligomer
    and filament preparations relate to that state?
- question: What molecular step connects CARD11 to ASCT2-dependent nutrient signaling in human T cells?
    Reduced transporter upregulation and phospho-S6 do not establish a direct binary interface.
suggested_experiments:
- description: Reconstitute full-length CARD11-dependent BCL10 assembly with defined phosphorylation state
    and native-membrane recruitment, comparing oligomer distributions and NF-kappaB pathway output.
- description: Test nucleotide turnover by purified CARD11 with mass-spectrometric or chromatographic
    GDP identification, matched folding controls and an authentic guanylate kinase positive control.
