  evidence_type: NAS
  original_reference_id: PMID:11278692
  qualifier: enables
  review:
    summary: The GMP kinase assertion exceeds the catalytic evidence in the cited target
      study.
    action: MARK_AS_OVER_ANNOTATED
    reason: GO:0004385 requires ATP-dependent conversion of GMP to GDP. The externally
      recovered original PMID:11278692 Experimental Procedures, Results and Discussion
      describe CARD11 domain homology, BCL10 interaction, localization and NF-kappaB reporter
      experiments. They characterize the PDZ-SH3-GUK region as a protein-interaction scaffold
      and do not report nucleotide turnover. CARD-dependent BCL10 protein phosphorylation
      is discussed as requiring participation of a serine/threonine kinase; it is not
      GMP phosphorylation by CARD11. Mark the catalytic specificity as over-annotated
      relative to this inspected evidence. This judgment does not infer inactivity from
      NAS, another MAGUK, or unexamined residues, and does not establish that CARD11 is
      incapable of catalysis. The canonical cache remains abstract-only; external scientific
      text, not original figure pixels, was read.
    supported_by:
    - reference_id: PMID:11278692
