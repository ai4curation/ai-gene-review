id: Q9BXL7
gene_symbol: CARD11
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CARD11 (CARMA1) is an intracellular signaling adaptor that couples antigen-receptor stimulation
  in lymphocytes to canonical NF-kappaB activation. Its CARD and coiled-coil region organize BCL10 assembly,
  while regulated recruitment of MALT1 and ubiquitin-signaling proteins builds the CBM signalosome at
  membrane-associated signaling sites. Phosphorylation and intramolecular interactions control access
  to this assembly platform. CARD11 also supports activation-associated metabolic signaling in T cells.
  Activating germline variants cause B-cell expansion with NF-kappaB activation and T-cell anergy (BENTA),
  biallelic loss of function causes combined immunodeficiency, and some heterozygous hypomorphic variants
  interfere with the normal protein and cause immunodeficiency with severe atopy.
