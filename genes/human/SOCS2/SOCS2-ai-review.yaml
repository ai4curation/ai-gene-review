id: O14508
gene_symbol: SOCS2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  SOCS2 is a cytokine-induced SOCS-box substrate receptor for Cullin5-RING/ECS ubiquitin ligase complexes.
  Its SH2 domain binds phosphorylated cytokine-receptor degrons, especially on growth hormone receptor
  and erythropoietin receptor, while its SOCS box recruits Elongin B/C, CUL5, and RBX2 to ubiquitinate
  bound receptors for proteasomal degradation. SOCS2 thereby acts as a cytoplasmic negative-feedback attenuator
  of growth hormone and erythropoietin/JAK-STAT signaling, with additional non-core interactions with
  receptor tyrosine kinases such as IGF1R and FLT3.
