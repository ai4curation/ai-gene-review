id: URS000006E464_9606
gene_symbol: MT-TM
product_type: TRNA
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: MT-TM encodes mitochondrial tRNA-Met, one of the 22 transfer RNAs encoded by mitochondrial
  DNA. After excision from the polycistronic mtDNA transcript and post-transcriptional maturation, it
  is charged with methionine by the corresponding mitochondrial aminoacyl-tRNA synthetase and, in the
  mitochondrial matrix, acts as the adaptor that reads the methionine codons AUG and AUA (AUR) of the
  13 mtDNA-encoded mRNAs on the mitoribosome, delivering methionine to the growing polypeptide. It is
  the single methionine tRNA of human mitochondria and serves both translation initiation and elongation.
  Reading of the AUA codon, which is methionine in the mitochondrial code, depends on 5-formylcytidine
  at wobble position 34, installed by NSUN3 and ALKBH1. Pathogenic variants in MT-TM, like those in other
  mt-tRNA genes, impair mitochondrial translation and oxidative phosphorylation and cause maternally inherited
  mitochondrial disease.
references:
- id: PMID:21910628
  title: 'Human mitochondrial tRNAs: biogenesis, function, structural aspects, and diseases.'
  findings:
  - statement: The 22 mtDNA-encoded tRNAs are used by the mitochondrial protein synthesis machinery to
      translate the 13 mtDNA-encoded mRNAs.
    supporting_text: These mRNAs are translated by the mitochondrial protein synthesis machinery, which
      uses the 22 species of mitochondrial tRNAs (mt tRNAs) encoded by mtDNA.
  - statement: mt tRNA genes are frequent sites of pathogenic point mutations.
    supporting_text: The genes encoding mt tRNAs are highly susceptible to point mutations, which are
      a primary cause of mitochondrial dysfunction and are associated with a wide range of pathologies.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (Suzuki, Nagao and Suzuki 2011 Annu Rev Genet, review); abstract only.
      Covers all 22 mtDNA-encoded tRNAs collectively rather than this tRNA specifically.
- id: PMID:7219534
  title: Sequence and organization of the human mitochondrial genome.
  findings:
  - statement: The human mitochondrial genome encodes 22 tRNAs.
    supporting_text: The genes for the 12S and 16S rRNAs, 22 tRNAs, cytochrome c oxidase subunits I, II
      and III, ATPase subunit 6, cytochrome b and eight other predicted protein coding genes have been
      located.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified (Anderson et al. 1981 Nature); the reference human mtDNA sequence that
      located the 22 tRNA genes.
- id: PMID:28257121
  title: Dealing with an Unconventional Genetic Code in  Mitochondria: The Biogenesis and Pathogenic 
    Defects of the 5-Formylcytosine Modification in  Mitochondrial tRNA(Met).
  findings:
