existing_annotations:
- term:
    id: GO:0030533
    label: triplet codon-amino acid adaptor activity
  evidence_type: TAS
  review:
    summary: No GOA annotation exists for MT-TM (RNAcentral/Rfam2GO supplies GO:0030533 for some but not
      all mt-tRNA sequences). Proposed to record the canonical tRNA adaptor function.
    action: NEW
    reason: MT-TM is one of the 22 mtDNA-encoded tRNAs used by the mitochondrial translation machinery;
      the codon-anticodon adaptor function is carried out by the tRNA itself. The same term is assigned
      by Rfam2GO to sister mt-tRNAs (e.g. MT-TQ, MT-TH, MT-TS1).
    supported_by: &id001
    - reference_id: PMID:28257121
      supporting_text: In addition to the standard AUG methionine codon, the single mitochondrial tRNA
        Methionine (mt-tRNAMet) also recognises AUA during translation initiation and elongation.
    - reference_id: PMID:21910628
      supporting_text: These mRNAs are translated by the mitochondrial protein synthesis machinery, which
        uses the 22 species of mitochondrial tRNAs (mt tRNAs) encoded by mtDNA.
- term:
    id: GO:0032543
    label: mitochondrial translation
  evidence_type: TAS
  review:
    summary: Proposed process annotation for the mitochondrial tRNA.
    action: NEW
    reason: The tRNA directly performs the decoding step of mitochondrial translation (it is not merely
      required for it), so involved_in mitochondrial translation is appropriate; this is the specific
      child of translation that sister mt-tRNAs receive via the MODIFY of their IEA translation annotation.
    supported_by: *id001
core_functions:
- description: >-
    Met-accepting tRNA that reads the methionine codons AUG and AUA (AUR) of mtDNA-encoded mRNAs on the
    mitoribosome, delivering methionine during mitochondrial translation. As the single methionine tRNA
    of human mitochondria it serves initiation as well as elongation: it is the species MTFMT formylates
    and mtIF2 delivers to the ribosomal P site. GO:0032543 is listed because it spans both of those
    roles.
  molecular_function:
    id: GO:0030533
    label: triplet codon-amino acid adaptor activity
  directly_involved_in:
  - id: GO:0032543
    label: mitochondrial translation
  supported_by: *id001
suggested_questions:
- question: Should GO annotate all 22 mtDNA-encoded tRNAs, including MT-TM, uniformly to triplet codon-amino
    acid adaptor activity and mitochondrial translation, rather than relying on Rfam2GO coverage that
    varies between mt-tRNA sequences?
  experts:
  - GO RNA annotation curators
