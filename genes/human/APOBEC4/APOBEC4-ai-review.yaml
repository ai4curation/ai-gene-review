description: APOBEC4 is the founding member of a distinct subfamily of the AID/APOBEC cytidine deaminases,
  present in mammals, birds and amphibians and most closely related to APOBEC1. It keeps the zinc-coordinating
  CMP/dCMP deaminase motifs and is expressed mainly in testis. However, human APOBEC4 shows no detectable
  cytidine deaminase activity in vitro, is non-mutagenic when expressed in bacteria or yeast, and binds
  single-stranded DNA only weakly. Overexpressed in human cells it is mostly cytoplasmic and enhances
  transcription from a broad range of viral and cellular promoters, including the HIV-1 LTR. An siRNA
  screen identified it as a possible regulator of nucleolar function. Its physiological substrate and
  role are unknown.
