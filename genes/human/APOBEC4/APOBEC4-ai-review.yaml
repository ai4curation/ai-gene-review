knowledge_gaps:
- gap_statement: APOBEC4 keeps the catalytic motifs of a cytidine deaminase, but no deaminase activity,
    substrate or physiological role has been found. Its only reported activity, broad promoter enhancement,
    comes from overexpression in cell lines.
  boundary: 'Established: conserved deaminase-domain zinc and catalytic motifs, a testis-biased expression
    pattern, no deaminase activity in vitro, no mutagenesis in bacteria or yeast, weak ssDNA binding,
    and promoter enhancement when overexpressed. Not established: any substrate (DNA or RNA), whether
    the testis protein is catalytically active, endogenous location, and the mechanism of transcriptional
    enhancement.'
  gap_kind:
  - BIOLOGY
  dark_aspect: WHOLLY_DARK
  status: OPEN
  significance: Like APOBEC2, APOBEC4 has no detectable catalytic activity; resolving its function would
    show whether the subfamily kept, lost or changed the editing chemistry of its relatives.
  resolution: Test RNA editing in testis (e.g. RNA-seq of APOBEC4 knockout testis for C-to-U changes),
    and assay purified protein against RNA substrates and with candidate cofactors.
suggested_questions:
- question: Does APOBEC4 edit RNA in testis, or is it a catalytically inactive member like APOBEC2?
suggested_experiments:
- description: Compare testis transcriptomes of wild-type and APOBEC4-knockout mice for C-to-U editing
    sites.
