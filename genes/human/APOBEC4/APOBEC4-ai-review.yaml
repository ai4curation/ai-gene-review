  findings:
  - statement: The APOBEC4 deaminase-domain zinc-coordinating motifs are conserved.
    supporting_text: The zinc-coordinating motifs involved in catalysis and the secondary structure of
      the APOBEC4 deaminase domain are evolutionarily conserved, suggesting that APOBEC4 proteins are
      active polynucleotide (deoxy)cytidine deaminases.
  - statement: APOBEC4 is expressed mainly in testis in mammals.
    supporting_text: In mammals, APOBEC4 is expressed primarily in testis which suggests the possibility
      that it is an editing enzyme for mRNAs involved in spermatogenesis.
