      summary: A second glucose is removed from the N-linked glycan. The removal of an alpha1,3 glucose moiety is catalyzed by glucosidase II, a complex composed of an alpha subunit (GANAB) with catalytic activity and a beta subunit (GLU2B; PRKCSH), probably with regulatory and recruitment function (Pelletier MF et al, 2000). GANAB can exist in two different isoforms, but both are able to catalyze both of the reactions catalyzed by glucosidase II (Pelletier MF et al, 2000).  Defects in PRKCSH are a cause of polycystic liver disease (PCLD).
  - path: reactome/R-HSA-532668.md
    bytes: 3539
    sha256: c4ab003c619877340b03d5904c8a6925c45e1e85216770adc896c010233f7800
    blob: d295ffc083d86267c09b65bd97d970cdae84a9b9
    disposition: missing_only
    header:
      stable_id: R-HSA-532668
      display_name: N-glycan trimming in the ER and Calnexin/Calreticulin cycle
      species: Homo sapiens
      summary: After being synthesized in the ER membrane the 14-sugars lipid-linked oligosaccharide is co-translationally transferred to an unfolded protein, as described in the previous steps. After this point the N-glycan is progressively trimmed of the three glucoses and some of the mannoses before the protein is transported to the cis-Golgi. The role of these trimming reactions is that the N-glycan attached to an unfolded glycoprotein in the ER assume the role of 'tags' that direct the interactions of the glycoprotein with different elements that mediate its folding. The removal of the two outer glucoses leads to an N-glycan with only one glucose, which is a signal for the binding of either one of two chaperone proteins, calnexin (CNX) and calreticulin (CRT). These chaperones provide an environment where the protein can fold more easily. The interaction with these proteins is not transient and is terminated by the trimming of the last remaining glucose, after which the glycoprotein
        is released from  CNX or CRT and directed to the ER Quality Control compartment (ERQC) if it still has folding defects, or transported to the Golgi if the folding is correct. The involvement of N-glycans in the folding quality control of proteins in the ER explains why this form of glycosylation is so important, and why defects in the enzymes involved in these reactions are frequently associated with congenital diseases.  However, there are many unknown points in this process, as it is known that even proteins without N-glycosylation sites can be folded properly (Caramelo JJ and Parodi AJ, 2008).
  - path: reactome/R-HSA-548890.md
    bytes: 2029
    sha256: e152cea2694eabce773991e02e9db21743378b3087a4fa243a957d528b74a5d3
    blob: a92efc594a35011bac18205c2031707e45f031a9
    disposition: immutable_main
    header:
      stable_id: R-HSA-548890
      display_name: Removal of the third glucose by glucosidase II and release from the chaperone
      species: Homo sapiens
      summary: While the protein is bound to the chaperone complex, the glycan is still accessible to glucosidase II, which eventually removes the last remaining glucose residue. This also results in breaking the interaction between the chaperone and the glycoprotein, independently of whether the latter has achieved proper folding (Pelletier MF et al, 2000). This has been interpreted as a 'timing mechanism', in which a protein has only a limited period of time to achieve correct folding when bound to the chaperone, to avoid the scenario where proteins that take too long to fold would block the availability of CNX or CRT. Proteins with folding defects get transported to the Endoplasmic Reticulum Quality Control Compartment, while proteins with correct folding are transported to the cis-Golgi where the glycan is further modified.
  - path: reactome/R-HSA-901042.md
    bytes: 1041
    sha256: 299bd068746f8f9e071a33aa250bc75122abd759b344ab22994e7d54b40fc8ba
    blob: 09a4947dc24dceed6b562a87b21b91c208bf403e
    disposition: missing_only
    header:
      stable_id: R-HSA-901042
      display_name: Calnexin/calreticulin cycle
      species: Homo sapiens
      summary: The unfolded protein is recognized by a chaperon protein (calnexin or calreticulin) and the folding process starts. The binding of these protein requires a mono-glucosylated glycan (Caramelo JJ and Parodi AJ, 2008) and lectin-based interaction with client proteins is the predominant contributor to chaperone activity of calreticulin (inferred from the mouse homolog in Lum et al. 2016).
  - path: reactome/R-HSA-9683663.md
    bytes: 776
    sha256: d33e7927d5c47e575eabf2c050d4b944f1c25e8789c151dfe98ba8358df4ba43
    blob: 2ea97337ab91be0f5c030afff4b4a97c22776e72
    disposition: immutable_main
    header:
      stable_id: R-HSA-9683663
      display_name: N-glycan trimming of Spike
      species: Homo sapiens
      summary: N-glycan side chains on the nascent SARS-CoV-1 spike protein get their terminal glucose moieties cleaved by ER glucosidases I and II, before folding. Iminosugars inhibit this process and are good candidates for broad-spectrum anivirals (Zhao et al, 2015).
  - path: reactome/R-HSA-9683686.md
    bytes: 644
    sha256: 0949f0a89a6a9810376968cc80dae6c08ef1984b0c6fa5f6693f7fa787a299a6
    blob: c78053700f70db216ba672d7dc892b0ca840cafd
    disposition: immutable_main
    header:
      stable_id: R-HSA-9683686
      display_name: Maturation of spike protein
      species: Homo sapiens
      summary: Spike protein of SARS-Cov is subject to N-glycosylation and palmitoylation. The chaperone calnexin exclusively helps with protein folding. The end product is a homotrimer (Nal et al, 2005).
  - path: reactome/R-HSA-9686790.md
    bytes: 2576
    sha256: f942838ffb14dae06314e76f310102087b2cce8d77db645851256451c1df195e
    blob: f6c5e21c32c9f711630167cd727ec9bbd098ce63
