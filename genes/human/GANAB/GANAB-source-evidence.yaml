      display_name: ER-alpha glucosidases bind ER-alpha glucosidase inhibitors
      species: Homo sapiens
      summary: Inhibition of host cellular functions required for viral replication is considered another host-targeting antiviral strategy. Extensive pharmacological studies have validated ER glucosidases as valuable host antiviral targets against many enveloped viruses (Chang et al. 2013). Most known ER glucosidase inhibitors are imino sugars like 1-deoxynojirimycin (DNJ) and castanopermine (CAST) derivatives (Taylor et al. 1994).<br><br>It is generally believed that inhibition of ER glucosidase I and/or II prevents the removal of the terminal glucose moieties on N-linked glycans and results in misfolding and retention of glycoproteins in the ER and ultimate degradation via the ER-associated degradation (ERAD) pathway (Simsek et al. 2005, Alonzi et al. 2013).  As a consequence of the abnormal trafficking and degradation of viral glycoproteins, virion assembly and secretion are inhibited (Chang et al. 2009, Taylor et al. 1998).<br><br>Long-term suppression of ER glucosidases I and/or II
        with more potent inhibitors may cause significant side effects, particularly in nerve and immune systems (Sadat et al. 2014).
  - path: reactome/R-HSA-9694364.md
    bytes: 718
    sha256: 3e72d9a4dfa08e1b10d94eb00be844717b19046eaddf888ac91ae5b6807f4729
    blob: fd30ea17f0bfc5ff09be7badd0ae4808c9ae6188
    disposition: immutable_main
    header:
      stable_id: R-HSA-9694364
      display_name: N-glycan glucose trimming of Spike
      species: Homo sapiens
      summary: N-glycan side chains on the unfolded SARS-CoV-2 spike protein get their terminal glucose moieties cleaved by ER glucosidases I and II, before folding.  (Watanabe et al, 2020, Völker et al, 2002, Pelletier et al, 2000).
  - path: reactome/R-HSA-9694548.md
    bytes: 2534
    sha256: 7781cffa92bd290b67a10a668ce92fc3619ab33700d5f4b4d1871d3878a0a93c
    blob: cb586ffb69888c3d6dbeb72d458f7b47ca811c9d
    disposition: immutable_main
    header:
      stable_id: R-HSA-9694548
      display_name: Maturation of spike protein
      species: Homo sapiens
      summary: 'This COVID-19 pathway has been created by a combination of computational inference from SARS-CoV-1 data (https://reactome.org/documentation/inferred-events) and manual curation, as described in the summation for the overall SARS-CoV-2 infection pathway.<br><br>The viral Spike protein of SARS-CoV-1 is subject to N-glycosylation and palmitoylation. The chaperone calnexin exclusively helps with protein folding. The end product is a homotrimer (Nal et al, 2005).


        In SARS-CoV-2 the Spike glycosylation patterns were extensively characterized, and consist of both N-glycans and O-glycans attached to about twenty amino acids (reviewed by Petrović et al, 2021; Gong et al, 2021; Shajahan et al, 2021). Although there is no reason for the host''s glycosylation enzymes behaving differently than with other host or non-host proteins, direct involvement of host enzymes and chaperones with SARS-CoV-2 Spike glycosylation has not been shown. Indirect evidence from inhibition experiments (Reyes et al, 2021; Franco et al, 2022) is confounded by simultaneous inhibition of glycosylation of other proteins like the ACE2 receptor.'
  - path: reactome/R-HSA-9768727.md
    bytes: 7018
    sha256: 2c16b84ec9672dcb506da2cf3288feeeb2899d7250883ff3225b6d5b7ae50bd7
    blob: 4abf6a24c6536fd07807e49df84ff21672a19551
    disposition: missing_only
    header:
      stable_id: R-HSA-9768727
      display_name: Regulation of CDH1 posttranslational processing and trafficking to plasma membrane
      species: Homo sapiens
      summary: CDH1 (also known as E-cadherin, epithelial cadherin, Cadherin-1, CADH1, or uvomorulin) is synthesized as a precursor protein of ~140 kDa (Shore and Nelson 1991). The N-terminal signal peptide (amino acid residues 1-22) is removed in the endoplasmic reticulum (ER), while the proprotein region (amino acid residues 23-154) of CDH1 is cleaved in the trans-Golgi network, resulting in a protein of ~120 kDa. While proteolytic cleavage is not necessary for CDH1 presentation at the plasma membrane, it is necessary for the establishment of homotypic interactions at adhesion junctions (Ozawa and Kemler 1990; Shore and Nelson 1991). The proprotein sequence of CDH1 is predominantly removed by FURIN, but other proprotein convertases are also involved (Posthaus et al. 1998). Like other plasma membrane proteins, CDH1 undergoes glycosylation on multiple amino acid residues. Four glycosylated asparagines in CDH1 conform with the glycosylation sequon Asn-X-Thr/Ser which is glycosylated in the
        endoplasmic reticulum (ER) through transfer of the preassembled, high-mannose oligosaccharide, Glu3Man9GlucNAc2 glycan, from a dolichyl-pyrophosphate carrier by the oligosaccharyltransferase (OST) complex (Ramírez et al. 2019). N-glycosylation of CDH1 on four asparagine residues, and N637 in particular, is required for proper folding and translocation of CDH1 to Golgi for further processing (Zhou et al. 2008; Zhao H. et al. 2008). In Drosophila, the glucosyltransferase Xiantuan (also known as xit, a homologue of yeast ALG8), which encodes one of the enzymes involved in the addition of the terminal glucose residues to the Glu3Man9GlucNAc2 glycan precursor, is required for the proper glycosylation and intracellular distribution of E-cadherin (Zhang et al. 2014). CDH1 also undergoes O-mannosylation in the ER, with TMTC3 as one of the implicated ER mannosyltransferases (Graham et al. 2020). CDH1 associates with beta-catenin (CTNNB1) during posttranslational processing in the ER (Chen
        et al. 1999). In the Golgi, CDH1 may undergo additional glycosylation catalyzed by GALNT3, which transfers O-GalNAc group to target proteins (Wang et al. 2014; Raghu et al. 2019; Shu et al. 2023). During apoptosis, ER stress was reported to lead to O-glycosylation of both CTNNB1 and the CDH1 cytosolic tail, blocking exit of CDH1 from the ER, and reducing intercellular adhesion (Zhu et al. 2001; Geng et al. 2012). Trafficking of CDH1 to the plasma membrane from Golgi is negatively regulated by RAB2A (Kajiho et al. 2016). Golgi membrane protein TMEM165 was also reported to negatively regulate CDH1 trafficking to the plasma membrane by affecting CDH1 glycosylation (Murali et al. 2020). CDH1 glycosylation was found to be altered in cancer (Yoshimura et al. 1996; Byrne et al. 2012; reviewed in Zhao Y. et al. 2008; reviewed in Bastian et al. 2021), which can have an effect on CTNNB1 signaling (Kitada et al. 2001). Cell type-specific processing of CDH1 has also been reported (Burke and
        Hong 2006). Trafficking of CDH1 to the cell surface can be regulated in a cell confluency-dependent manner, so that subconfluent cells present less CDH1 on their surface (Murray et al. 2004). Glycosylation of CDH1 was also reported to differ between confluent and subconfluent cells (Liwosz et al. 2006).
  - path: reactome/R-HSA-9932352.md
    bytes: 1900
    sha256: c93ab61c84785384c706a9d74b2803dcb613fa65fa34a04e227723c304b189ae
    blob: 9fbf49695cf26c73121da32d1f6848b716ff3be8
