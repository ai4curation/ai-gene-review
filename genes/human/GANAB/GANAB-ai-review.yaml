core_functions:
- description: Catalyzes hydrolysis of the diglucosylated high-mannose N-glycan to its monoglucosylated form as the alpha subunit of ER-lumen glucosidase II. The human GANAB–PRKCSH enzyme directly performs this early N-glycan-trimming step; PRKCSH association supports activity, solubility and retention. This is the first of the two inner-glucose removals summarized by the single primary-source excerpt below; the final-glucose reaction is described in the second core.
