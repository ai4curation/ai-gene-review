proposed_new_terms:
- proposed_name: Glc1Man9GlcNAc2 oligosaccharide glucosidase activity
  proposed_definition: 'Catalysis of the reaction: a monoglucosylated Glc1Man9GlcNAc2-protein + H2O = a Man9GlcNAc2-protein + D-glucose, removing the remaining glucose residue from the high-mannose N-linked glycan.'
  justification: 'Human glucosidase II complexes hydrolyze both Glc1 and Glc2 substrates in PMID:10929008. The current GO:0106407 definition describes only Glc2-to-Glc1 hydrolysis, yet the production FlyBase GO-CAM 680ad14200001222 types two Gcs2alpha (FB:FBgn0027588) activities, 680ad14200001292 and 680ad14200001231, as GO:0106407 and links them by RO:0002413. Both enabled_by assertions use human UniProtKB:Q14697 as their ISS source. Their placement between glucosidase I and mannosidase, together with the primary chemistry, supports interpreting them as the successive inner-glucose removals; the model does not explicitly encode the intermediate glycans. The local dmel_n_glycan_processing module likewise uses GO:0106407 for both removals, and projects/GLYCOBIOLOGY/cazy2go.generated.terms.yaml records the ec2go-derived EC:3.2.1.207-to-GO:0106407 mapping. The latter is a retained generated mapping, not a newly retrieved ec2go release. RHEA:56000 also crossreferences GO:0106407 for the final-glucose
    reaction. These positive usage records supersede a null ontology search as the basis for reconciliation. The preferred resolution is to reconcile or broaden the existing term definition to cover its documented two-step usage, preserving the current model and module typing. This NTR remains conditional: if curators retain the Glc2-only definition and create a separate final-glucose term, the downstream GO-CAM activity and the final-step representation within the combined module would need specific retyping; the Glc2 activity should retain GO:0106407. The definition uses D-glucose because the inspected human assays do not establish product-anomer stereochemistry. RHEA beta-D-glucose and the retaining GH31 mechanism warrant an explicit question, not an asserted source defect. GO:0015926 remains the conservative generic parent; the actual GO:0106407 is_a GO:0090599 edge is acknowledged despite their conflicting product wording. The original HPLC substrates had the reported GlcNAc1 reducing
    end; the glycoprotein GlcNAc2 representation follows the curated reaction. No incoming evidence field or new original annotation is introduced.'
