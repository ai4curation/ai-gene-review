references:
- id: PMID:10929008
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Official PubMed identifier/abstract and selected original Results, Methods and captions from the author-hosted 14-page paper were read. The original tests both human alpha1 D542N and alpha2 D564N, shows activity of both long human forms with beta on Glc1/Glc2 high-mannose substrates, and no Glc3 cleavage under the tested conditions. Human/insect heteroenzymes form in single-human-subunit baculovirus preparations, so these are not isolated human alpha-only assays. Beta HDEL modification affects retention. No complete-paper or figure-image inspection is claimed; the local PDF download was HTTP 403 while indexed original text was available. The original use of EC 3.2.1.84 does not supersede the current GO polymer-substrate definition.
  title: The heterodimeric structure of glucosidase II is required for its activity, solubility, and localization in vivo.
  findings:
  - statement: Both tested long human GANAB alpha forms function with PRKCSH in glucosidase II; the original substrate assays support removal of the two inner glucose residues, with single-human-subunit insect-cell preparations forming mixed-species heteroenzymes.
- id: PMID:27259053
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Verified PubMed identity and selected original functional Results/Figures 4–5 captions. Human GANAB loss and rescue inform polycystin maturation/trafficking, not a direct GANAB transport activity. The paper uses the 966-aa long splice form and describes the 944-aa exon-skipped form; exact current sequence mapping is Q14697-2/-1. Cilia still form despite loss of ciliary PC2, so no GANAB ciliary residence or obligatory cilium-biogenesis function is inferred. Complete Methods, images and supplements were not read; later browser challenge is retained as an access limit. Genuine native acquisition subsequently retained the full original text; the selected reading scope stated here is unchanged.
  title: Mutations in GANAB, Encoding the Glucosidase IIα Subunit, Cause Autosomal-Dominant Polycystic Kidney and Liver Disease.
  findings:
  - statement: Human GANAB loss impairs polycystin maturation/trafficking; cilia can still form despite loss of ciliary polycystin-2, separating client trafficking from GANAB ciliary residence.
