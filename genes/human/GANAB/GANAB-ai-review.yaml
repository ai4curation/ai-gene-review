id: Q14697
gene_symbol: GANAB
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: GANAB is the catalytic alpha subunit of the ER-lumen glucosidase II heterodimer with PRKCSH. It removes the two inner glucose residues from immature N-linked glycans, coupling glycan maturation to the calnexin/calreticulin folding cycle. Its glycan-processing activity supports maturation and trafficking of client glycoproteins, including polycystin-1 and polycystin-2. Pathogenic GANAB variants cause cystic kidney and liver disease.
