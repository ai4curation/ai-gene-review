    review_notes: 'Official article-scoped PubMed and the immutable abstract establish the PCLD gene study and positive GANAB-dependent polycystin maturation evidence. The exact activity experiment was not independently recovered: original JCI90129 routes returned HTTP 503 and the retained BioC/EPMC responses did not contain an article. An initial mistyped 90183 route is retained as a local failed lookup, not evidence. The official corrigendum JCI96729 was read: it corrects mislabeled Pkd1 RT-PCR primer sequences and supplies the actual Pkd1 pair; it does not withdraw the GANAB claims. Independent 10929008 supports the specific enzymatic refinement. No wrong-gene or contradictory-assay inference is made from the abstract boundary.'
