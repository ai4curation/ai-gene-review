- description: Catalyzes removal of the remaining glucose from a monoglucosylated high-mannose N-glycan in the ER lumen. The human GANAB-containing complexes cleave Glc1 substrates in the original assays, and the curated RHEA:56000 reaction represents this final-glucose hydrolysis on a glycoprotein. This is the second direct catalytic step of glucosidase II, distinct from the Glc2-to-Glc1 activity. The proposed molecular-function name is provisional while the existing GO:0106407 definition and its broader production-model usage are reconciled.
