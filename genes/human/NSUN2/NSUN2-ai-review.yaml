core_functions:
- molecular_function:
    id: GO:0016428
    label: tRNA (cytidine-N5)-methyltransferase activity
  description: NSUN2 is the human Trm4 orthologue and the principal RNA m5C writer of the cell. Using
    SAM and a motif VI catalytic cysteine, it methylates C34 of intron-containing pre-tRNA-Leu(CAA)
    and C47-C50 in the variable loop of many cytoplasmic tRNAs, and the same enzyme, imported into
    the mitochondrial matrix, makes m5C at positions 48-50 of several mitochondrial tRNAs. The activity
    has been reconstituted in vitro with purified protein and mapped product positions, and the corresponding
    modifications are lost in NSUN2-null mouse tissue, NSUN2 knockout human cells and cells from
    patients with biallelic NSUN2 variants. The methylation stabilises tRNA against stress-induced
    endonucleolytic cleavage.
  directly_involved_in:
  - id: GO:0030488
    label: tRNA methylation
  - id: GO:0002127
    label: tRNA wobble base cytosine methylation
  - id: GO:0036416
    label: tRNA stabilization
  locations:
  - id: GO:0005730
    label: nucleolus
  - id: GO:0005634
    label: nucleus
  - id: GO:0005737
    label: cytoplasm
  - id: GO:0005739
    label: mitochondrion
  supported_by:
  - reference_id: PMID:17071714
    supporting_text: Using transcripts of intron-less and intron-containing human pre-tRNA Leu (CAA)
      genes as substrates, we have shown that m5C34 is introduced only in the intron-containing tRNA
      precursors when the substrates were incubated in the HeLa extract.
  - reference_id: PMID:31287866
    supporting_text: In addition, we successfully reconstituted m5C at positions 48-50 of mt-tRNA
      in vitro with NSUN2 protein in the presence of S-adenosylmethionine.
  - reference_id: PMID:22577224
    supporting_text: Patient cells lacked NSUN2 protein and there was resultant loss of site-specific
      5-cytosine methylation of the tRNA(Asp GTC) at C47 and C48, known NSUN2 targets.
- molecular_function:
    id: GO:0003723
    label: RNA binding
  description: Substrate recognition by NSUN2 extends beyond tRNA. It is the only enzyme that methylates
    C69 of the vault RNA VTRNA1.1, and that single modification determines how VTRNA1.1 is processed
    into small vault RNAs, so NSUN2 binding and methylation of a structured non-coding RNA has a
    defined downstream consequence. NSUN2 is also recovered in mRNA interactome capture and recognises
    a specific structural motif in exosome-enriched transcripts. This binding function is listed
    separately from the catalytic function because in several of these contexts the binding, rather
    than the chemistry, is what has been directly demonstrated.
  locations:
  - id: GO:0005634
    label: nucleus
  - id: GO:0005737
    label: cytoplasm
  supported_by:
  - reference_id: PMID:31186410
    supporting_text: Methylation of cytosine 69 in VTRNA1.1 occurs frequently in human cells, is
      exclusively mediated by NSUN2, and determines the processing of VTRNA1.1 into small-vault RNAs
      (svRNAs).
  - reference_id: PMID:28341602
    supporting_text: Both these proteins are found in exosomes secreted by HEK293 cells.
suggested_questions:
- question: Is NSUN2-dependent m5C in mRNA a physiologically significant modification in its own
    right, or largely the low-level off-target activity of an enzyme whose real substrate is tRNA?
    The nucleoside mass-spectrometry evidence for NSUN2-dependent m5C in polyA RNA is real, but polyA
    fractions carry about forty-fold less m5C than total RNA and the authors of that study cannot
    exclude contaminating tRNA and rRNA nucleosides. What level of polyA purity, or what orthogonal
    single-molecule method, would settle this?
  experts:
  - Ralph E Kleiner
  - Michaela Frye
- question: Which of the thousands of reported mRNA m5C sites survive a method-agnostic test? Aza-IP,
    bisulfite sequencing and miCLIP overlap very poorly, and mRNA secondary structure produces false-positive
    bisulfite signals. Is there a consensus high-confidence site set for NSUN2, and what is its size?
  experts:
  - Alexey A Malygin
- question: If m5C occurs at roughly one in several thousand cytosines in mRNA, and ALYREF and YBX1
    bind m5C-containing regions only a few fold better than unmodified ones, how can a reader-based
    mechanism achieve specificity in vivo? Does the reader model require additional co-recruitment,
    or should the phenotypes attributed to single mRNA m5C sites be re-examined?
  experts:
  - Alexey A Malygin
  - Yun-Gui Yang
- question: Does NSUN2 have any role in ribosomal RNA or in mitochondrial ribosome assembly, as its
    IBA annotations assert? These were propagated from mouse Nsun4, a paralogue with a distinct substrate
    and complex, and NSUN2 loss does not appreciably impair mitochondrial translation. Should the
    PAINT node for these terms be moved?
  experts: []
- question: How much of the NSUN2 loss-of-function phenotype in human intellectual disability is
    attributable to tRNA hypomodification and stress-induced tRNA fragments, and how much, if any,
    to loss of mRNA or vault RNA methylation? A separation-of-function allele would be the cleanest
    test.
  experts:
  - Michaela Frye
  - Joseph G Gleeson
suggested_experiments:
- hypothesis: NSUN2-dependent m5C sites in mRNA are far fewer than current maps report, and only
    a small high-confidence subset is reproducible across methods.
  description: Apply direct RNA nanopore sequencing, or another method that does not require chemical
    conversion or antibody enrichment, to matched wild-type and NSUN2 knockout human cells, with
    a catalytically dead NSUN2 add-back as a third arm. Intersect the resulting site calls with published
    bisulfite, Aza-IP and miCLIP sets and report the size of the reproducible core. Include synthetic
    spike-ins of known modification stoichiometry to calibrate false-positive and false-negative
    rates.
  experiment_type: Direct RNA sequencing
- hypothesis: The mRNA m5C signal measured by nucleoside mass spectrometry in polyA fractions is
    partly contributed by contaminating tRNA and rRNA.
  description: Quantify m5C by LC-MS/MS in polyA RNA purified to increasing stringency (successive
    oligo-dT rounds, then size selection, then depletion with tRNA- and rRNA-specific probes), measuring
    residual tRNA and rRNA in each fraction by qPCR, and plot m5C against measured contamination
    to extrapolate the true mRNA value.
  experiment_type: Quantitative mass spectrometry
- hypothesis: Individual mRNA m5C sites proposed to drive disease phenotypes are functional at that
    site.
  description: For a small number of prominent claimed sites (for example HDGF and IL1B), introduce
    a silent or minimally disruptive C-to-U or C-to-A substitution at the endogenous locus by base
    editing, and test whether transcript stability and the downstream phenotype change as predicted,
    with NSUN2 knockout as a positive control. This replaces enzyme-level perturbation, which affects
    thousands of transcripts, with site-level perturbation.
  experiment_type: Base editing and phenotyping
- hypothesis: The tRNA and mRNA functions of NSUN2 can be genetically separated.
  description: Screen NSUN2 variants, guided by the tRNA-bound structure, for alleles that retain
    tRNA C34 and C48-C50 methylation while losing mRNA methylation (or the reverse), validating each
    by nucleoside LC-MS/MS on separated RNA fractions. Introduce any separation-of-function allele
    into cells and mice and ask which arm accounts for the differentiation and neurodevelopmental
    phenotypes.
  experiment_type: Structure-guided mutagenesis and mouse genetics
- hypothesis: The rRNA-related IBA annotations on NSUN2 are paralogue leakage from NSUN4.
  description: 'Test directly for NSUN2-dependent rRNA m5C: map m5C in cytoplasmic and mitochondrial
    rRNA by mass spectrometry in wild-type and NSUN2 knockout cells, and assay mitoribosome assembly
    by sucrose-gradient profiling in the same cells, using NSUN4 knockout as the positive control.'
  experiment_type: Mass spectrometry and ribosome profiling
