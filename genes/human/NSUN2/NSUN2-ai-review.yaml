- term:
    id: GO:0009383
    label: rRNA (cytosine-C5-)-methyltransferase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: Phylogenetic transfer of rRNA C5 methyltransferase activity across the NSUN family node.
    action: MARK_AS_OVER_ANNOTATED
    reason: The only donor named in the GOA WITH/FROM column besides the family node is mouse Nsun4
      (MGI:MGI:1919431), whose characterised substrate is mitochondrial 12S rRNA. NSUN2 has a well-mapped
      and quite different substrate repertoire - cytoplasmic pre-tRNA C34, tRNA and mt-tRNA C47-C50,
      vault RNA C69, and mRNA - and no rRNA substrate has been reported for it in twenty years of
      work on the enzyme. This looks like a paralogue-specific function propagated too broadly rather
      than a genuine ancestral activity retained by NSUN2. Not removed outright, since the PAINT
      tree itself was not inspected and an ancestral rRNA-methylating activity for the family is
      plausible; marked as over-annotation of this particular gene.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - WRONG_ORTHOLOG_OR_PARALOG
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: MGI:MGI:1919431
        source_label: Nsun4
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Donor named in the GOA WITH/FROM column is mouse Nsun4, the mitochondrial 12S rRNA
          m5C methyltransferase that partners MTERF4 in mitoribosomal large subunit assembly. That
          is a paralogue-specific substrate and complex; NSUN2 has no reported rRNA substrate.
      - source_id: PANTHER:PTN000516076
        source_label: PTN000516076
        source_status: UNRESOLVED
        comment: Family-wide NSUN node. The PAINT tree was not inspected for this review, so no claim
          is made about where the IBD was placed; the objection rests only on the donor gene identity
          and on NSUN2-specific substrate data.
- term:
    id: GO:0016428
    label: tRNA (cytidine-N5)-methyltransferase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: Phylogenetic assertion that NSUN2 inherits the Trm4-type tRNA m5C methyltransferase
      activity of its family.
    action: ACCEPT
    reason: 'Correct and core. The donor list spans mouse, fission yeast (two genes), budding yeast
      and C. elegans as well as NSUN2 itself, which is the expected pattern for a deeply conserved
      function: NSUN2 appearing in its own WITH/FROM simply reflects that its experimental annotation
      was one of the descendant evidences used to place the ancestral node, and the IBA adds the
      further statement that the activity is inherited rather than human-specific.'
    supported_by:
    - reference_id: PMID:17071714
      supporting_text: We identified a human orthologue of tRNA:m5C methyltransferase from Saccharomyces
        cerevisiae, which has been previously shown to catalyse the specific modification of C34
        in the intron-containing yeast pre-tRNA Leu (CAA).
