- term:
    id: GO:1902775
    label: mitochondrial large ribosomal subunit assembly
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: Mitochondrial large ribosomal subunit assembly propagated across the NSUN family node.
    action: MARK_AS_OVER_ANNOTATED
    reason: This is the documented function of NSUN4, which forms a complex with MTERF4 and is required
      for mitoribosome large-subunit assembly; the GOA WITH/FROM column names mouse Nsun4 as the
      donor. NSUN2 is genuinely imported into the mitochondrial matrix, but its demonstrated job
      there is m5C at positions 48-50 of mt-tRNAs, and its loss does not have a profound effect on
      mitochondrial translation or oxidative phosphorylation in differentiated cells (PMID:31276587)
      - which is what one would expect to be perturbed if NSUN2 were needed for large-subunit assembly.
    supported_by:
