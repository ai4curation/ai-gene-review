- term:
    id: GO:0006397
    label: mRNA processing
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  review:
    summary: GO:0006397 mRNA processing covers conversion of a primary transcript into mature mRNA
      - splicing, capping, polyadenylation. The cited work reports mRNA stabilisation and nuclear
      export instead.
    action: MODIFY
    reason: A term-choice problem rather than an evidence problem, so the annotations are modified
      rather than removed. PMID:22395603 reports that NSUN2 inhibits turnover of p16 mRNA, PMID:31358969
      that NSUN2 with YBX1 stabilises HDGF mRNA, and PMID:28418038 that NSUN2-dependent m5C promotes
      ALYREF-mediated nuclear export. None of these is a pre-mRNA maturation step. The accurate terms
      are mRNA stabilization (GO:0048255) and regulation of mRNA export from nucleus (GO:0010793),
      the latter of which this gene already carries from PMID:28418038.
    proposed_replacement_terms:
    - id: GO:0048255
      label: mRNA stabilization
    - id: GO:0010793
      label: regulation of mRNA export from nucleus
