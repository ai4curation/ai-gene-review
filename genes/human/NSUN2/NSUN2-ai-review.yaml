- term:
    id: GO:0062152
    label: mRNA (cytidine-5-)-methyltransferase activity
  evidence_type: IDA
  original_reference_id: PMID:22395603
  qualifier: enables
  review:
    summary: In vitro methylation of the p16 3'UTR by NSun2, with knockdown shortening and overexpression
      lengthening the p16 mRNA half-life.
    action: KEEP_AS_NON_CORE
    reason: 'GOA carries both sides of this question and both are retained. The catalytic assignment
      itself is supported by evidence that does not depend on the contested mapping assays: RNA-mediated
      activity-based protein profiling traps NSUN2 covalently on 5-fluorocytidine-containing RNA
      recovered by oligo-dT capture, and nucleoside LC-MS/MS of polyA-selected RNA shows an 82% fall
      in m5C in NSUN2 knockout cells (PMID:34556860); the mRNA export phenotype is rescued by wild-type
      but not methyltransferase-dead NSUN2 (PMID:28418038); and in vitro methylation of a defined
      p16 3''UTR fragment was reported (PMID:22395603). The activity is therefore not removed - and
      could not be, since this term also carries an EXP code whose full text has not been read here.
      What is disputed is the reliability and biological weight of the mRNA m5C maps. The methods
      disagree with one another (very low overlap between Aza-IP, bisulfite sequencing and miCLIP),
      mRNA secondary structure shields cytosines from bisulfite and generates false positives, and
      m5C occurs at roughly one in several thousand cytosines in mRNA, which leaves it unexplained
      how the proposed readers discriminate modified transcripts (PMID:42587746). The authors of
      the chemoproteomic study themselves note that polyA fractions carry ~40-fold lower m5C than
      total RNA and that contaminating tRNA/rRNA nucleosides could contribute to the measured signal.
      Demoted to non-core rather than accepted as core: the deeply conserved, structurally and genetically
      nailed-down substrate class for this Trm4 orthologue is tRNA (and vault RNA and mitochondrial
      tRNA), whereas the mRNA activity is quantitatively minor, its site maps are unresolved, and
      the large disease literature built on single mRNA m5C sites rarely supplies orthogonal validation.'
    supported_by:
    - reference_id: PMID:22395603
      supporting_text: In vitro methylation assays show that NSun2 methylates the p16 3'UTR at A988.
