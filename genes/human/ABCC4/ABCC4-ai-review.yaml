id: O15439
gene_symbol: ABCC4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ABCC4 (MRP4) is a ubiquitously expressed, polytopic plasma-membrane ATP-binding cassette transporter of the ABCC/MRP subfamily. Using ATP binding and hydrolysis at its two nucleotide-binding domains, it catalyses primary active efflux of a broad range of organic anions out of cells. Physiological substrates include the cyclic nucleotides cAMP and cGMP, prostaglandins (PGE1/PGE2), leukotrienes B4 and C4, urate, reduced glutathione and glutathione S-conjugates, bile acids (cotransported with GSH), and steroid glucuronides and sulfates; it also effluxes many drugs and their metabolites (antivirals, 6-mercaptopurine, methotrexate, cephalosporins, chemotherapeutics), contributing to multidrug resistance. Its subcellular polarity is tissue-dependent, residing in the apical membrane of kidney proximal tubule and the basolateral (sinusoidal) membrane of hepatocytes, and it is present at blood-tissue barriers (blood-brain, blood-CSF, blood-testis) and in platelet dense-granule membranes, where it loads cyclic nucleotides. A C-terminal PDZ-binding motif recruits PDZ-domain scaffolds (e.g. SNX27, PDZK1, NHERF, MPP1) that govern its membrane localization and turnover. By exporting signalling molecules such as cyclic nucleotides and prostaglandins, ABCC4 influences processes including platelet mediator storage, cyclic-nucleotide signalling and prostaglandin-dependent ciliogenesis.
