- term:
    id: GO:0001409
    label: guanine nucleotide transmembrane transporter activity
  evidence_type: IDA
  original_reference_id: PMID:15454390
  qualifier: enables
  review:
    summary: MRP4/ABCC4 mediates ATP-dependent efflux of the cyclic guanine nucleotide cGMP (a guanine nucleotide), shown directly in overexpressing vesicles (PMID:15454390).
    action: ACCEPT
    reason: cGMP is a (cyclic) guanine nucleotide; ATP-dependent cGMP transport is directly demonstrated, so guanine-nucleotide transporter activity is a correct, core molecular function.
    supported_by:
    - reference_id: PMID:15454390
      supporting_text: MRP4 could transport urate simultaneously with cAMP or cGMP
- term:
    id: GO:0002576
    label: platelet degranulation
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-114608
  qualifier: involved_in
  review:
    summary: 'Platelet degranulation: MRP4 in platelet dense-granule membranes loads cyclic nucleotides/nucleotides, contributing to mediator storage and release (PMID:15297306; Reactome).'
    action: KEEP_AS_NON_CORE
    reason: Genuine platelet-specific physiological role downstream of MRP4's nucleotide-transport activity, but peripheral to the core transporter function; retained as non-core.
