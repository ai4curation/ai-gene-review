- term:
    id: GO:0016404
    label: 15-hydroxyprostaglandin dehydrogenase (NAD+) activity
  evidence_type: NAS
  original_reference_id: PMID:7557451
  qualifier: enables
  review:
    summary: 15-hydroxyprostaglandin dehydrogenase (NAD+) activity, NAS from PMID:7557451 — a paper about the HPGD (15-PGDH) enzyme, not ABCC4.
    action: REMOVE
    reason: ABCC4 is a polytopic ABC membrane transporter with ATP-driven efflux activity; it has no NAD(+)-dependent oxidoreductase/dehydrogenase domain and cannot perform 15-hydroxyprostaglandin dehydrogenation. PMID:7557451 ('a C-terminal-truncated form of human NAD(+)-dependent 15-hydroxyprostaglandin dehydrogenase') describes HPGD/15-PGDH, a soluble cytosolic enzyme. This NAS annotation is a gene/term mis-attribution and is biologically impossible for ABCC4; remove.
    source_defects:
    - defect_type: WRONG_TERM
      resource: GOA_EBI
      asserted_value: GO:0016404
      requested_change: DELETE_ROW
      confidence: PROBABLE
      explanation: GO:0016404 (15-hydroxyprostaglandin dehydrogenase (NAD+) activity) was annotated to ABCC4 (O15439) via NAS PMID:7557451, but that paper concerns the HPGD/15-PGDH enzyme. ABCC4 is an ABC efflux transporter without any dehydrogenase/oxidoreductase activity, so this enzymatic MF does not belong on this gene product.
