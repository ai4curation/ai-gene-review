- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:22411990
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q96L92
  review:
    summary: IPI interaction of MRP4 with UniProtKB:Q96L92 (UniProtKB:Q96L92); like MRP4's other characterized partners this is a PDZ-domain-containing protein that engages MRP4's C-terminal PDZ-binding motif.
    action: MODIFY
    reason: 'Bare ''protein binding'' is uninformative. MRP4 carries a C-terminal class-I PDZ-binding motif (UniProt MOTIF 1322-1325; SUBUNIT: ''Interacts (via PDZ-binding motif) with SNX27 (via PDZ domain)''). UniProtKB:Q96L92 is a PDZ-domain scaffold/adaptor captured in this interaction dataset, so the evidence supports the specific molecular function PDZ domain binding (GO:0030165), which organizes MRP4 trafficking, turnover and polarized membrane localization.'
    proposed_replacement_terms:
