- id: PMID:16672280
  title: 'Three-dimensional structure of rat-liver acyl-CoA oxidase in complex with a fatty acid: insights
    into substrate-recognition and reactivity toward molecular oxygen.'
  full_text_unavailable: true
  findings:
  - statement: Rat ACOX1 crystal structure 2DDH contains a free fatty-acid ligand in the substrate channel
      after thioester hydrolysis, with carboxyl oxygen contacts to the enzyme/FAD environment. This supports
      binding under crystallization conditions, without establishing a human physiological carrier function.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Independently reverified on 2026-09-26 through the primary RCSB deposition https://www.rcsb.org/structure/2DDH:
      its Literature section explicitly links PMID:16672280 to DOI:10.1093/jb/mvj088 and reproduces the
      abstract; its polymer maps to rat ACOX1/P07872, and its ligand table lists HXD. The primary component
      record https://www.rcsb.org/ligand/HXD identifies free (3R)-3-hydroxydodecanoic acid. The abstract
      describes thioester hydrolysis and hydrogen bonds from a ligand carboxyl oxygen to Glu421/FAD. The
      direct PubMed URL returned CAPTCHA during this follow-up and the DOI publisher route was unavailable;
      these do not invalidate the verified primary-deposition citation. The quote is from the externally
      visible abstract, now correctly stored in supporting_text rather than supporting_text_fulltext.
      The standard fetch-pmid workflow recovered PMID:16672280 on 2026-09-27. Its exact
      machine-generated bytes and source-artifact hashes were verified before import. The cached
      identifier, title and abstract agree with the independently checked primary source; full
      text remains unavailable. Targeted validation now passes with the required cache present.'
