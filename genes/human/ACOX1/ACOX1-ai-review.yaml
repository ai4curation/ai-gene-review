- term:
    id: GO:0005504
    label: fatty acid binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: Retain inherited fatty-acid binding with a bounded structural interpretation.
    action: KEEP_AS_NON_CORE
    reason: GO:0005504 describes binding to a fatty acid and does not require a dedicated carrier site.
      Rat ACOX1 structure 2DDH (P07872; PMID:16672280) contains free hydroxydodecanoic acid in the active-site
      channel after hydrolysis of the crystallization acyl-CoA ligand. The free carboxyl group makes defined
      hydrogen-bond contacts with the enzyme/FAD environment; this observed noncovalent complex supports
      fatty-acid binding even though the ligand arose in the crystal and occupies the substrate channel.
      Retain this ortholog-supported capability as non-core, with no claim of a separate binding site,
      physiological carrier function, or measured free-acid affinity in human ACOX1. The PAINT IBD is
      on PTN000097533; exact free-acid-binding assays for its Acox2/Acox3 donors remain unresolved. Retention
      is supported independently by the ACOX1 ortholog structure, not by assuming those donor assays measured
      free acid.
    supported_by:
    - reference_id: PMID:16672280
      supporting_text: only the fatty acid moiety that had been formed through hydrolysis of the thioester
        bond
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
      - source_id: PANTHER:PTN000097533
        source_status: UNRESOLVED
        comment: The cached PAINT IBD (2025-09-02) is seeded by rat Acox2/Acox3 fatty-acid-binding evidence.
          Exact donor assay details remain unresolved; no target-specific loss is established. Independent
          rat ACOX1 ligand-bound structure supports retention of a non-core inherited capability.
