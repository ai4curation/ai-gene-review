- description: 'FAD-dependent acyl-CoA oxidation in the peroxisomal matrix: homodimeric ACOX1 performs
    the initial beta-oxidation reaction on straight-chain fatty acyl-CoAs, including very-long-chain substrates,
    producing (2E)-enoyl-CoA and hydrogen peroxide. Substrate breadth and isoform-dependent preferences
    are integrated within this catalytic function.'
