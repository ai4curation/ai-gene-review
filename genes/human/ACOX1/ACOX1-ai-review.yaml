id: Q15067
gene_symbol: ACOX1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ACOX1 is a FAD-dependent peroxisomal straight-chain acyl-CoA oxidase that catalyzes the initial
  oxidative step of fatty-acid beta-oxidation. It converts 2,3-saturated fatty acyl-CoAs to (2E)-enoyl-CoAs
  and transfers electrons to molecular oxygen, producing hydrogen peroxide. Its substrate range includes
  medium-, long- and very-long-chain fatty acyl-CoAs and prostaglandin CoA esters; it also contributes
  to peroxisomal dicarboxylic-acid degradation and the chain-shortening step of DHA synthesis. The enzyme
  forms homodimers and enters the peroxisomal matrix through its C-terminal SKL targeting signal. Full-length
  component A can be cleaved into complementary B and C chains that together retain activity. Alternative
  isoforms differ in chain-length preference. Biallelic loss of function causes peroxisomal acyl-CoA oxidase
  deficiency with VLCFA accumulation. The recurrent dominant p.N237S gain-of-function variant stabilizes
  the dimer and increases oxidase activity and oxidative stress, producing the distinct neuropathy Mitchell
  syndrome.
