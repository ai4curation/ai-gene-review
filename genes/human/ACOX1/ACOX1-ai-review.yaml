  original_reference_id: PMID:7876265
  qualifier: involved_in
  review:
    summary: Retain the broad precursor-metabolite role alongside the defined oxidase pathway.
    action: KEEP_AS_NON_CORE
    reason: GO:0006091 includes pathways that form precursor metabolites and is not restricted to direct
      ATP synthesis. PMID:7876265 demonstrates active recombinant human ACOX1 catalyzing the initial straight-chain
      acyl-CoA oxidation reaction, establishing direct participation in a pathway that generates shorter-chain
      metabolites. Retain the broad experimental annotation as non-core with this pathway interpretation
      and curator deference, without claiming that ACOX1 itself generates ATP or releases acetyl-CoA.
      The displayed AmiGO is_a ancestry of GO:0006635 does not include GO:0006091, so replacing this row
      with beta-oxidation would not simply refine an established parent-child relation.
