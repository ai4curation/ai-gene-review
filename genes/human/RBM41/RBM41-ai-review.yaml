existing_annotations:
- term:
    id: GO:0000398
    label: mRNA splicing, via spliceosome
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - AGI_LocusCode:AT1G09230
  - FB:FBgn0265184
  - PANTHER:PTN000413238
  - ZFIN:ZDB-GENE-060312-35
  review:
    summary: IBA from PTN000413238, the PTHR16105 ancestral node shared by the U11/U12-65K (RNPC3, SF0)
      and RBM41 (SF2) subfamilies. Human RBM41 is independently shown to be a minor spliceosome component
      whose knockout alters U12-type intron 3' splice site usage.
    action: ACCEPT
    reason: 'The IBA donors are SF0 (65K) proteins, so on phylogeny alone this transfers across a paralog
      split; however, direct human evidence corroborates it for RBM41: RBM41 associates with U12, U4atac
      and U6atac snRNPs, with excised U12-type intron lariats, and its loss shifts U12-type 3'' splice
      site choice. RBM41 is therefore a participant in spliceosomal mRNA splicing, specifically of U12-type
      introns (no GO term for minor-intron splicing exists). The effect is modest and the precise step
      (post-catalytic) is inferred rather than demonstrated.'
    supported_by:
    - reference_id: PMID:38499487
      supporting_text: In contrast, RBM41 preferentially co-immunoprecipitated U12-type but not U2-type
        intron lariats
    - reference_id: PMID:38499487
      supporting_text: suggesting that the loss of RBM41 has a weak, but nevertheless statistically significant
        effect on the splicing of a subset of U12-type introns
- term:
    id: GO:0003676
    label: nucleic acid binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR035979
  review:
    summary: Generic nucleic acid binding inferred from the RBD domain superfamily signature (IPR035979).
    action: MODIFY
    reason: Correct but too general. RBM41's C-terminal RRM binds the 3'-terminal stem-loops of U12 and
      U6atac snRNAs in vitro by EMSA and associates with U12, U4atac and U6atac snRNAs in cells in an
      RRM-dependent way. The specific supported terms are U12 snRNA binding (already carried by IBA) and
      U6atac snRNA binding.
    proposed_replacement_terms:
    - &id001
      id: GO:0030626
      label: U12 snRNA binding
    - &id002
      id: GO:0030624
      label: U6atac snRNA binding
    supported_by:
    - reference_id: PMID:38499487
      supporting_text: Thus, both RBM41 and U11/U12-65K C-terminal RRMs show dual snRNA binding specificity
        in vitro with only slight differences in RNA affinity
    - reference_id: PMID:38499487
      supporting_text: The Q352A and F354A mutations and deletion of the RRM led to dramatic loss of the
        U12, U4atac and U6atac interactions
