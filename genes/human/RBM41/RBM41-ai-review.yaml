id: Q96IZ5
gene_symbol: RBM41
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'RBM41 is a 413-residue nuclear RNA-binding protein and a specific component of the minor
  (U12-type) spliceosome. It is a paralog of the U11/U12-65K protein (RNPC3): the two share a C-terminal
  RNA recognition motif (RRM, residues 309-387) with an N-terminal extension, whereas RBM41 has a distinct,
  conserved, predominantly helical N-terminal region with no recognised domain. The RRM binds the 3''-terminal
  stem-loops of U12 and U6atac snRNAs with low-micromolar affinity, using a U1A-like Y312/Q352/F354 triad.
  In cells RBM41 associates with U12, U4atac and U6atac snRNAs but not U11 snRNA, co-sediments with the
  U12 mono-snRNP rather than the U11/U12 di-snRNP, binds excised U12-type intron lariats, and through
  its N-terminal region associates with complexes containing the DEAH-box helicase DHX8. It concentrates
  in Cajal bodies in an RNA binding-dependent manner. These properties point to a role in post-catalytic
  steps of the minor spliceosome cycle (spliced-product release, disassembly or snRNP recycling), in contrast
  to 65K, which acts during intron recognition. RBM41 is not essential for human cell viability; knockout
  cells show modest changes in 3'' splice site choice at a subset of U12-type introns.'
