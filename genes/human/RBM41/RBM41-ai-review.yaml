references:
- id: PMID:38499487
  title: Distinct functions for the paralogous RBM41 and U11/U12-65K proteins in the minor spliceosome.
  findings:
  - statement: RBM41 RRM binds U12 and U6atac snRNA 3'-terminal stem-loops in vitro with low micromolar
      affinity (EMSA).
    supporting_text: Thus, both RBM41 and U11/U12-65K C-terminal RRMs show dual snRNA binding specificity
      in vitro with only slight differences in RNA affinity
  - statement: RBM41 associates with U12, U4atac and U6atac snRNAs but not U11 snRNA in cells, dependent
      on the RRM.
    supporting_text: V5-RBM41 co-immunoprecipitated the U12 snRNA, U4atac and U6atac snRNAs, but not the
      U11 snRNA
  - statement: RBM41 co-sediments with the U12 mono-snRNP.
    supporting_text: RBM41 peak co-migrated with the U12 mono-snRNP
  - statement: RBM41 associates with DHX8 through its N-terminal region.
    supporting_text: The interaction with DHX8 was dependent on the highly conserved N-terminal region
      of RBM41, while the RRM mutations and deletion of the RRM had no effect
  - statement: RBM41 co-immunoprecipitates U12-type intron lariats.
    supporting_text: In contrast, RBM41 preferentially co-immunoprecipitated U12-type but not U2-type
      intron lariats
  - statement: Endogenous RBM41 localises to Cajal bodies.
    supporting_text: Consistently, we found that endogenous RBM41 localizes to Cajal bodies, as shown
      by colocalization with coilin-GFP in HEK293 cells
  - statement: RBM41 knockout HEK293 cells are viable with modest U12-type 3' splice site changes.
    supporting_text: suggesting that the loss of RBM41 has a weak, but nevertheless statistically significant
      effect on the splicing of a subset of U12-type introns
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached (PMC11039992); the only functional characterisation of RBM41. Not yet
      used as a GOA source.
