    label: RNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR000504
  review:
    summary: RNA binding inferred from the RRM domain (IPR000504).
    action: MODIFY
    reason: 'RNA binding is true and experimentally confirmed, but the evidence supports the specific
      snRNA targets: U12 snRNA and U6atac snRNA 3''-terminal stem-loops (EMSA, low micromolar Kd), with
      RRM point mutants Q352A/F354A abolishing snRNA association in cells.'
    proposed_replacement_terms:
