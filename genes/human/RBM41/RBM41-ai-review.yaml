- term:
    id: GO:0005689
    label: U12-type spliceosomal complex
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: part_of
  supporting_entities:
  - FB:FBgn0265184
  - PANTHER:PTN000413238
  - UniProtKB:Q96LT9
  review:
    summary: IBA from PTN000413238 (donors include human RNPC3 and fly 65K). Human RBM41 is experimentally
      found in U12 mono-snRNP and associated with U12-type intron lariat complexes.
    action: ACCEPT
    reason: Supported directly for RBM41 by RIP, glycerol gradient and lariat co-IP data. Note that RBM41
      does not co-sediment with the U11/U12 di-snRNP (where 65K sits), so the shared location is the broader
      U12-type spliceosomal complex, not the di-snRNP; a more specific location (U12 snRNP) is proposed
      as NEW.
    supported_by:
    - reference_id: PMID:38499487
      supporting_text: RBM41 peak co-migrated with the U12 mono-snRNP
    - reference_id: PMID:38499487
      supporting_text: In contrast, RBM41 preferentially co-immunoprecipitated U12-type but not U2-type
        intron lariats
- term:
    id: GO:0030626
    label: U12 snRNA binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - AGI_LocusCode:AT1G09230
  - PANTHER:PTN000413238
  review:
    summary: IBA from PTN000413238 (donor Arabidopsis SNRNP65, SF0). Human RBM41 RRM binds the U12 snRNA
      3'-terminal stem-loop directly in vitro.
    action: ACCEPT
    reason: 'The IBA crosses the 65K/RBM41 paralog split, but the function is directly demonstrated for
      human RBM41: EMSA with untagged recombinant RRM (Kd about 2 uM for the U12 hairpin), and RRM-dependent
      co-immunoprecipitation of U12 snRNA by tagged and endogenous RBM41. This is the core molecular function.'
    supported_by:
    - reference_id: PMID:38499487
      supporting_text: Thus, both RBM41 and U11/U12-65K C-terminal RRMs show dual snRNA binding specificity
        in vitro with only slight differences in RNA affinity
    - reference_id: PMID:38499487
      supporting_text: V5-RBM41 co-immunoprecipitated the U12 snRNA, U4atac and U6atac snRNAs, but not
        the U11 snRNA
    - reference_id: PMID:38499487
      supporting_text: The Q352A and F354A mutations and deletion of the RRM led to dramatic loss of the
        U12, U4atac and U6atac interactions
- term:
    id: GO:0097157
    label: pre-mRNA intronic binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - AGI_LocusCode:AT1G09230
  - PANTHER:PTN000413238
  review:
    summary: IBA from PTN000413238 with Arabidopsis SNRNP65 (SF0) as donor. No experiment shows RBM41
      binding intronic pre-mRNA sequence directly.
    action: MARK_AS_OVER_ANNOTATED
    reason: RBM41 co-immunoprecipitates excised U12-type intron lariats, but its snRNP association depends
      on RRM-snRNA binding, so lariat recovery is most parsimoniously explained by RBM41 riding on U12
      snRNA within post-catalytic complexes, not direct intron recognition. Intron recognition is a property
      of the U11/U12 di-snRNP stage in which 65K (SF0), not RBM41, participates; this subfamily-specific
      function should not be transferred to SF2.
    supported_by:
    - reference_id: PMID:38499487
      supporting_text: In contrast, RBM41 preferentially co-immunoprecipitated U12-type but not U2-type
        intron lariats
    - reference_id: PMID:38499487
      supporting_text: Together the sequence analysis suggests similar RNA binding properties, but otherwise
        divergent functions for the two paralogous proteins
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      - ROLE_CONFLATION
      source_entities:
      - source_id: PANTHER:PTN000413238
        comment: PTHR16105 ancestral node above both SF0 (U11/U12-65K) and SF2 (RBM41)
      - source_id: AGI_LocusCode:AT1G09230
        source_label: SNRNP65
        comment: Arabidopsis 65K ortholog, PTHR16105:SF0; acts in the U11/U12 di-snRNP intron-recognition
          stage, which RBM41 does not join
