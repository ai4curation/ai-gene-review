- question: At which post-catalytic step does RBM41 act (spliced-exon release by DHX8, intron-lariat spliceosome
    disassembly, or U12 snRNP recycling in Cajal bodies)?
- question: Is the RBM41-DHX8 association a direct protein contact, and should DHX8's activity in U12-type
    spliceosomes be modelled with RBM41 as a regulator or adaptor?
- question: Do the PTHR16105 IBA terms propagated from SF0 (65K) donors to SF2 (RBM41) need subfamily-level
    review, given that RBM41 does not join the U11/U12 di-snRNP or recognise introns?
