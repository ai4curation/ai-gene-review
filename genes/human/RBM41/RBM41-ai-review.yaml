    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:16189514
  qualifier: enables
  supporting_entities:
  - UniProtKB:P07910
  review:
    summary: Interaction with UniProtKB:P07910 reported in a high-throughput yeast two-hybrid screen.
      No functional follow-up for RBM41 is reported for this partner.
    action: REMOVE
    reason: Bare protein binding is uninformative under the repository protein-binding policy; removal
      does not mean the reported interaction is false. The screen provides no molecular function beyond
      the binary contact, and many partners (coiled-coil, keratin, TRAF and TRIM proteins) are frequent
      yeast two-hybrid preys. The functionally characterised RBM41 contacts (DHX8, ZCRB1/U11/U12-31K,
      coilin) come from BioID and co-IP in PMID:38499487 and are not represented by these rows.
