- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0039
  review:
    summary: UniProt subcellular-location mapping (SL-0039 cell membrane) to plasma membrane.
    action: KEEP_AS_NON_CORE
    reason: Human TGN46 is present on the cell surface and returns to the TGN via endosomes (PMID:8907712),
      and it exits the TGN in CARTS bound for the plasma membrane (PMID:38466628). The plasma membrane
      is a genuine but transient station of its cycling itinerary rather than its steady-state functional
      compartment, so it is kept as non-core.
