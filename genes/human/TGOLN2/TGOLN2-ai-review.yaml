  original_reference_id: GO_REF:0000052
  qualifier: located_in
  review:
    summary: Human Protein Atlas immunofluorescence localizing TGOLN2 to the Golgi apparatus.
    action: MODIFY
    reason: 'TGN46 is a resident of the trans-Golgi network rather than the Golgi stack: quantitative
      immuno-EM in HeLa cells places most TGN46 in TGN tubules with little overlap with the stack enzyme
      GalT (PMID:9084986). The broad Golgi apparatus term is correct but less specific than the evidence
      supports, so it is refined to trans-Golgi network (GO:0005802), a part_of descendant that this gene
      already carries by IDA and IBA.'
