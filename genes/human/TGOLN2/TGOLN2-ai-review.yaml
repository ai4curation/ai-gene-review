- id: file:human/TGOLN2/TGOLN2-uniprot.txt
  title: UniProt entry O43493 (TGON2_HUMAN)
core_functions:
- description: Resident TGN membrane glycoprotein that sorts secretory cargo into CARTS for Golgi-to-plasma-membrane
    export. Loss of TGN46 in human HeLa cells cuts PAUF secretion and CARTS loading, and the lumenal domain
    carries the sorting signal. The molecular activity behind sorting (direct cargo binding versus a lumenal
    sorting platform) is not established.
  directly_involved_in:
  - id: GO:0043001
    label: Golgi to plasma membrane protein transport
  locations:
  - *id001
  - *id007
  supported_by:
  - *id008
  - *id009
  - *id004
suggested_questions:
- question: Does the TGN46 lumenal domain bind PAUF (or other CARTS cargoes) directly, e.g. through its
    O- and N-glycans, so that 'cargo receptor activity' would be justified?
- question: Is TGN46 an active component of CARTS biogenesis or a sorting cargo that rides in the carrier?
- question: Do the TGN48 and TGN51 isoforms, with extra tyrosine motifs and distinct retrieval behaviour,
    differ in sorting function?
- question: Should a PAINT curator propagate any process term from PTN000575073 given that the node is
    placed at taxon:2759 and includes divergent members such as fly rgn that lack the TM segment and YQRL
    motif?
suggested_experiments:
- description: In vitro binding (pull-down, SPR or microscale thermophoresis) of purified, glycosylated
    TGN46 lumenal domain with PAUF, with and without deglycosylation.
- description: Rescue of PAUF secretion in TGN46-KO HeLa cells with isoform-specific TGN46, TGN48 and
    TGN51 constructs and lumenal repeat deletions.
