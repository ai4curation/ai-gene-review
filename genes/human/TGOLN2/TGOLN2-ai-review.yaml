- term:
    id: GO:0005788
    label: endoplasmic reticulum lumen
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-8952289
  qualifier: located_in
  review:
    summary: Reactome places TGOLN2 in the ER lumen as a substrate of the FAM20C luminal kinase reaction.
    action: REMOVE
    reason: TGN46 is a single-pass type I membrane protein (signal peptide, lumenal domain 22-381, TM
      helix 382-402) whose steady-state location is the TGN, from which it cycles to the cell surface
      (PMID:8907712, PMID:9084986). Its lumenal Ser/Thr residues are FAM20C substrates (UniProt MOD_RES),
      but an integral membrane protein is not a soluble component of the ER lumen; the location is an
      artifact of the compartment chosen for the generic Reactome FAM20C substrate reaction, and there
      is no evidence of ER retention.
    supported_by:
    - reference_id: file:human/TGOLN2/TGOLN2-uniprot.txt
      supporting_text: Cell membrane; Single-pass type I membrane
    - &id003
      reference_id: PMID:8907712
      supporting_text: TGN but is present on the cell surface and returns via endosomes
