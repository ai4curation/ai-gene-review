id: O43493
gene_symbol: TGOLN2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: TGOLN2 encodes TGN46 (with splice variants TGN48 and TGN51), a heavily glycosylated single-pass
  type I membrane glycoprotein whose large mucin-like lumenal domain contains 14 tandem 14-residue repeats
  and whose short cytosolic tail carries a YQRL tyrosine-based sorting motif. It is the human ortholog
  of rodent TGN38 and resides mainly in the trans-Golgi network, from which it constitutively cycles to
  the plasma membrane and returns via endosomes; return depends on the cytosolic tyrosine motif. TGN46
  leaves the TGN in CARTS, protein kinase D-dependent carriers to the cell surface, and is required for
  efficient sorting and secretion of the soluble CARTS cargo PAUF (ZG16B), a sorting activity encoded
  in its lumenal domain. It is widely used as a TGN marker. Lumenal residues are phosphorylated by the
  secretory kinase FAM20C.
