id: O43493
gene_symbol: TGOLN2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: TGOLN2 (TGN46) is a single-pass type I membrane glycoprotein that resides primarily in the
  trans-Golgi network. It has a large, heavily O-glycosylated luminal domain, a single transmembrane helix
  and a short cytoplasmic tail with tyrosine-based sorting motifs that drive its retrieval to the TGN.
  TGN46 cycles continuously between the trans-Golgi network and the plasma membrane, returning through
  endosomes, and is implicated in cargo sorting and the formation of secretory/transport carriers at the
  TGN. Its precise molecular function is not established.
