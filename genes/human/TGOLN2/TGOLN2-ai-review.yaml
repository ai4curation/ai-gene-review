- term:
    id: GO:0043001
    label: Golgi to plasma membrane protein transport
  evidence_type: IMP
  original_reference_id: PMID:38466628
  review:
    summary: TGN46 knockout in HeLa cells strongly reduces secretion of the CARTS cargo PAUF and its packaging
      into CARTS, and the TGN46 lumenal domain is necessary and sufficient to sort membrane proteins into
      CARTS.
    action: NEW
    reason: 'Human loss-of-function plus domain-mapping evidence (PMID:38466628). This passes the participation
      test: TGN46 is not merely transported by the pathway; its lumenal domain performs the cargo-sorting
      step that loads PAUF into TGN-to-PM carriers (sorting module, as for cargo receptors such as LMAN1
      in ER export). The authors note that whether TGN46 also participates in carrier biogenesis is unknown,
      so no carrier-formation term is proposed, and no cargo receptor molecular-function term is proposed
      because direct TGN46-cargo binding was not demonstrated. PAINT propagated no process term from PTN000575073;
      this annotation rests on human data and should not be transferred to divergent family members such
      as fly rgn.'
    supported_by:
    - &id008
      reference_id: PMID:38466628
      supporting_text: In TGN46-KO cells, PAUF-MycHis secretion was reduced by ~75% as compared to control
        cells
    - &id009
      reference_id: PMID:38466628
      supporting_text: signals encoded in the lumenal domain of TGN46 are not only necessary, but also
        sufficient for cargo sorting into CARTS
