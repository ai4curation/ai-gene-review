core_functions:
- description: Single-pass type I membrane glycoprotein resident in the trans-Golgi network that cycles
    to the cell surface and back via endosomes, implicated in cargo sorting and transport-carrier formation
    at the TGN. Its specific molecular function is not established.
  locations:
  - id: GO:0005802
    label: trans-Golgi network
  supported_by:
  - reference_id: file:human/TGOLN2/TGOLN2-uniprot.txt
    supporting_text: May be involved in regulating membrane traffic to and from
suggested_questions:
- question: What is the molecular function of TGN46 - does it act as a cargo receptor, a sorting adaptor,
    or a structural component of TGN carrier biogenesis?
suggested_experiments:
- description: Identify luminal-domain cargo and cytoplasmic-tail adaptor interactions of TGN46 by proximity
    labeling at the TGN, and test carrier formation after TGN46 depletion.
