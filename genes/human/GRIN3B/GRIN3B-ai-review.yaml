- term:
    id: GO:0005262
    label: calcium channel activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: contributes_to
  supporting_entities:
  - UniProtKB:Q91ZU9
  - ensembl:ENSMUSP00000048576
  review:
    summary: Calcium channel activity transferred from the mouse ortholog (IMP PMID:14602821).
    action: MARK_AS_OVER_ANNOTATED
    reason: 'GluN3B lowers the calcium permeability of the receptors it joins: GluN1/GluN3 receptors are described
      as relatively Ca2+-impermeable, and adding a GluN3 subunit to GluN1/GluN2 receptors reduces their Ca2+ permeability.
      Calcium flux is therefore a property of the GluN2-containing channel that GluN3 restrains, not an activity
      GluN3 contributes; the accurate statement of what the receptor carries is monoatomic cation transmembrane
      transport, which this review accepts. The mouse donor study shows that GluN3B reduces the Ca2+ permeability
      of NMDA currents.'
    supported_by:
    - reference_id: PMID:11823786
      supporting_text: NR1/NR3A or -3B receptors form relatively Ca2+-impermeable cation channels that are resistant
        to Mg2+, MK-801, memantine and competitive antagonists
    - reference_id: PMID:12008020
      supporting_text: coexpression of NR3B reduced the Ca(2+) permeability of glutamate-induced currents in cells
        expressing NR1a and NR2A
    - reference_id: PMID:14602821
      supporting_text: NR3B, when exogenously introduced into hippocampal neurons, can coassemble with endogenous
        NR1 and NR2A and can reduce the Ca2+ permeability of NMDA currents
