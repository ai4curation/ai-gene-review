      supporting_text: Forms excitatory glycinergic receptor complexes with GluN1 alone which are activated by glycine
      record_section:
      - CC:FUNCTION
    - &id004
      reference_id: PMID:11823786
      supporting_text: NR3A or NR3B co-assembles with NR1 to form excitatory glycine receptors that are unaffected by glutamate
        or NMDA
