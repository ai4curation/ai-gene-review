core_functions:
- description: GluN3B is inferred to bind glycine and, with GluN1, form an unconventional glycine-gated cation channel. The
    GluN1/GluN3B pore is relatively calcium-impermeable and resistant to canonical open-channel blockers.
  contributes_to_molecular_function: *id005
  directly_involved_in:
