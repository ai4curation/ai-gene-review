- term:
    id: GO:0160212
    label: glycine-gated cation channel activity
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: enables
  supporting_entities:
  - RGD:621705
  review:
    summary: Glycine-gated cation channel activity transferred from rat Grin3b.
    action: ACCEPT
    reason: GluN1/GluN3B receptors are excitatory cation channels gated by glycine alone. Glycine binding to the
      GluN3 subunit opens the channel, while glycine binding to GluN1 reduces the current. In mouse hippocampal
      neurons, exogenous GluN3B did not contribute to an excitatory glycine response under the conditions tested,
      so native GluN1/GluN3B glycine receptors are less well established than GluN1/GluN3A ones.
    supported_by:
    - reference_id: PMID:11823786
      supporting_text: NR3A or NR3B co-assembles with NR1 to form excitatory glycine receptors that are unaffected
        by glutamate or NMDA
    - reference_id: PMID:17214961
      supporting_text: glycine bound to the NR1 subunit causes auto-inhibition of NR1/NR3 receptors whereas glycine
        binding to the NR3 subunits is required for opening of the ion channel
    - reference_id: PMID:26777280
      supporting_text: Binding of glycine to the high-affinity GluN3 subunits triggers channel opening, whereas
        glycine binding to the low-affinity GluN1 subunits causes an auto-inhibition of the maximal glycine-inducible
        receptor current
    - reference_id: PMID:14602821
      supporting_text: NR3B was not involved in the excitatory glycine response in neurons under our test conditions
