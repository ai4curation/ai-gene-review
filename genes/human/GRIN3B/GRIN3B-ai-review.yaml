id: O60391
gene_symbol: GRIN3B
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: GRIN3B encodes GluN3B, the second GluN3-family glycine-binding subunit of NMDA-receptor complexes. By conservation
  with rodent GluN3B, it can co-assemble with GluN1 into excitatory glycine-gated cation channels and can enter GluN1/GluN2/GluN3
  triheteromeric receptors that show reduced current amplitude, calcium permeability and open-channel block compared with
  GluN1/GluN2 receptors. GRIN3B is inferred to reach the plasma membrane and postsynaptic membrane in a GluN1-containing receptor
  complex; unlike GRIN3A, direct functional and localization data for the human GluN3B protein are sparse, with most GO annotations
  transferred from rat or mouse GluN3B.
