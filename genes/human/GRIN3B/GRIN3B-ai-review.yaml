    label: postsynaptic membrane
  in_complex: &id007
    id: GO:0098878
    label: neurotransmitter receptor complex
  supported_by:
  - *id003
  - *id004
  - *id006
- description: The GluN3B ligand-binding domain is conserved as a glycine-binding site for GluN1/GluN3B channel opening.
  molecular_function:
    id: GO:0016594
    label: glycine binding
  in_complex: *id007
  supported_by: *id008
suggested_questions:
- question: Which human neuronal populations express functional GluN3B-containing receptors, and are they postsynaptic, presynaptic
    or extrasynaptic?
- question: Does human GluN3B form glycine-gated diheteromeric receptors with the same stoichiometry and GluN1-site auto-inhibition
    described for GluN3A?
suggested_experiments:
- hypothesis: Human GluN3B can form functional GluN1/GluN3B excitatory glycine receptors at the cell surface.
  description: Express sequence-verified human GluN1 and GluN3B in a mammalian cell line, use glycine plus GluN1-site antagonists
    to isolate GluN3B-gated current, and compare calcium permeability and Mg2+ block with human GluN1/GluN3A.
  experiment_type: heterologous electrophysiology
