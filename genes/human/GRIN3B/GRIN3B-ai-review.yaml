        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: The PANTHER node captures NMDA receptor activity in canonical GluN2-containing receptors, not the GluN3B
          glycine-binding contribution to unconventional GluN1/GluN3 receptors.
    reason: GluN3 subunits can enter triheteromeric GluN1/GluN2/GluN3 receptors, but their distinguishing ligand site is glycine,
      not glutamate; direct GluN1/GluN3A and conserved GluN1/GluN3 evidence supports glycine-gated cation channel activity
      rather than assigning GluN3 a glutamate receptor activity.
    supported_by: &id002
