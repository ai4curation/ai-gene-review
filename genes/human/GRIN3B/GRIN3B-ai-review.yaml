  review:
    summary: PAINT annotation at PANTHER:PTN001826301.
    action: MODIFY
    reason: 'Glutamate receptor activity is defined as combining with glutamate. GluN3B does not bind glutamate:
      its ligand-binding domain binds glycine. It does take part in glutamate receptors as a subunit of GluN1/GluN2/GluN3
      receptors, which the more specific NMDA glutamate receptor activity (a descendant of this term, verified in
      GO) records. Glycine-gated cation channel activity is not a descendant of glutamate receptor activity, so
      it is not a replacement here.'
    proposed_replacement_terms:
    - id: GO:0004972
      label: NMDA glutamate receptor activity
    supported_by:
    - reference_id: PMID:18636091
      supporting_text: we investigate mechanisms underlying the binding by NR3A and NR3B of glycine and D-serine
    - reference_id: PMID:11823786
      supporting_text: NR3A or NR3B co-assembles with NR1 to form excitatory glycine receptors that are unaffected
        by glutamate or NMDA
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN001826301
        source_label: PANTHER:PTN001826301
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: The node covers ionotropic glutamate receptor subunits that bind glutamate. GluN3 subunits sit
          in the clade but their ligand-binding domain binds glycine, so the bare glutamate receptor activity is
          accurate for the receptor complex, not for the subunit.
