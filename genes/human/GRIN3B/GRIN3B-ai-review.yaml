- term:
    id: GO:0051205
    label: protein insertion into membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q91ZU9
  - ensembl:ENSMUSP00000048576
  review:
    summary: Protein insertion into membrane transferred from mouse Grin3b (IMP PMID:14602821).
    action: MARK_AS_OVER_ANNOTATED
    reason: The donor study shows that GluN1 and GluN3B each need the other to reach the cell surface, i.e. assembly-dependent
      trafficking of the receptor complex. Protein insertion into membrane is the incorporation of a protein into
      the lipid bilayer during biogenesis, which the study did not examine.
    supported_by:
    - reference_id: PMID:14602821
      supporting_text: Although NR1 or NR3B alone cannot be transported to the cell surface, coexpression of these
        subunits mutually supported transport of the NMDA receptor complex
    - reference_id: file:human/GRIN3B/GRIN3B-uniprot.txt
      record_section: ["CC:SUBCELLULAR LOCATION"]
      supporting_text: Requires the presence of GRIN1 to be targeted at the plasma membrane
    source_defects:
    - defect_type: WRONG_TERM
      resource: UNIPROT
      record: UniProtKB:Q91ZU9
      requested_change: CHECK
      asserted_value: GO:0051205
      cause: LABEL_WITHOUT_DEFINITION
      confidence: PROBABLE
      explanation: Mouse Grin3b (Q91ZU9) carries IMP protein insertion into membrane (GO:0051205) from PMID:14602821,
        which shows that NR1 and NR3B mutually support transport of the receptor complex to the cell surface. That
        is receptor trafficking or surface localisation, not insertion of a protein into the lipid bilayer. The
        human GRIN3B ISS and IEA rows inherit it.
