  - RGD:621704
  review:
    summary: PAINT places NMDA glutamate receptor activity (contributes_to) at PTN002708573.
    action: ACCEPT
    reason: GluN3B assembles with GluN1 and GluN2A into receptors that respond to NMDA and glycine, where it lowers
      Ca2+ permeability and increases resistance to Mg2+ and open-channel blockers. It contributes to this activity
      as a modulatory subunit and does not bind glutamate itself.
    supported_by:
    - reference_id: PMID:12008020
      supporting_text: NR3B could form NMDA receptor complex with NR1a and NR2A subunits in heterologous cells
    - reference_id: PMID:12008020
      supporting_text: coexpression of NR3B reduced the Ca(2+) permeability of glutamate-induced currents in cells
        expressing NR1a and NR2A
    - reference_id: PMID:22564863
      supporting_text: IC(50) values for Mg(2+) and memantine increased when receptors contained GluN3A subunits
        and were further increased when they contained GluN3B
    - reference_id: PMID:14602821
      supporting_text: NR3B, when exogenously introduced into hippocampal neurons, can coassemble with endogenous
        NR1 and NR2A and can reduce the Ca2+ permeability of NMDA currents
