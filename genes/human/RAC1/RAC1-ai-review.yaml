- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: EXP
  original_reference_id: PMID:1643658
  qualifier: located_in
  review:
    summary: RAC1 acts on the cytoplasmic face of the plasma membrane.
    action: MODIFY
    reason: C-terminal geranylgeranylation anchors RAC1 to the inner leaflet of the plasma membrane, where
      it is activated and engages effectors. This is its principal site of action; note that it is an
      intracellular, peripheral membrane protein and is not exposed on the cell surface. The more specific supported term the gene already carries is cytoplasmic side of plasma membrane (GO:0009898) -- the protein is lipid-anchored or recruited to the inner (cytoplasmic) leaflet and faces the cytosol, not the cell exterior.
    proposed_replacement_terms:
    - id: GO:0009898
      label: cytoplasmic side of plasma membrane
    supported_by:
    - reference_id: file:human/RAC1/RAC1-uniprot.txt
      supporting_text: 'SUBCELLULAR LOCATION: Cell membrane {ECO:0000269|PubMed:1643658, ECO:0000269|PubMed:22843693,
        ECO:0000269|PubMed:29074776}; Lipid-anchor'
    - reference_id: file:human/RAC1/RAC1-uniprot.txt
      supporting_text: Note=Inner surface of plasma membrane possibly with attachment requiring prenylation
        of the C-terminal cysteine
