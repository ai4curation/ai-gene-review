core_functions:
- description: Acts as a nucleotide-dependent molecular switch on the cytoplasmic face of the plasma membrane
    - loaded with GTP by RhoGEFs, inactivated by RhoGAP-stimulated hydrolysis, and held soluble by RhoGDI
    - that binds effectors such as the WAVE complex and PAK kinases only in the GTP state and thereby
    drives branched actin polymerization, lamellipodium and ruffle formation, cell spreading, polarity
    and directed migration.
  molecular_function:
    id: GO:0003924
    label: GTPase activity
  locations:
  - id: GO:0009898
    label: cytoplasmic side of plasma membrane
  - id: GO:0005829
    label: cytosol
  - id: GO:0030027
    label: lamellipodium
  - id: GO:0005938
    label: cell cortex
  directly_involved_in:
  - id: GO:0016601
    label: Rac protein signal transduction
  - id: GO:0007015
    label: actin filament organization
  - id: GO:0010592
    label: positive regulation of lamellipodium assembly
  - id: GO:0016477
    label: cell migration
  supported_by:
  - reference_id: file:human/RAC1/RAC1-uniprot.txt
    supporting_text: Reaction=GTP + H2O = GDP + phosphate + H(+)
  - reference_id: file:human/RAC1/RAC1-uniprot.txt
    supporting_text: In its active state, binds to a variety of effector proteins to regulate cellular
      responses
  - reference_id: PMID:9312003
    supporting_text: remodels the actin cytoskeleton by inducing actin polymerization at the cell periphery
  - reference_id: PMID:19625648
    supporting_text: play essential roles in coordinating directional migration and superoxide production
      during neutrophil responses to chemoattractants
- description: Serves as the GTPase subunit of NADPH oxidase complexes - with NOX2/p22phox in phagocytes
    and with Nox1 in other cells - translocating to the membrane and completing the activated complex
    that transfers electrons from NADPH to oxygen to generate superoxide.
  molecular_function:
    id: GO:0003924
    label: GTPase activity
  in_complex:
    id: GO:0043020
    label: NADPH oxidase complex
  locations:
  - id: GO:0009898
    label: cytoplasmic side of plasma membrane
  directly_involved_in:
  - id: GO:0042554
    label: superoxide anion generation
  - id: GO:0045730
    label: respiratory burst
  supported_by:
  - reference_id: file:human/RAC1/RAC1-uniprot.txt
    supporting_text: Subunit of the phagocyte NADPH oxidase complex that mediates the transfer of electrons
      from cytosolic NADPH to O2 to produce the superoxide anion
  - reference_id: PMID:38355798
    supporting_text: The activation of phagocyte NADPH oxidase requires membrane translocation and the
      binding of several cytosolic factors
  - reference_id: PMID:16636067
    supporting_text: Nox1-dependent reactive oxygen generation is regulated by Rac1.
- description: At postsynaptic sites of glutamatergic synapses, is locally activated by synaptic GEFs
    such as ARHGEF6/ARHGEF7 and remodels spine actin, controlling dendritic spine morphogenesis and synapse
    assembly.
  molecular_function:
    id: GO:0003924
    label: GTPase activity
  locations:
  - id: GO:0098794
    label: postsynapse
  - id: GO:0098978
    label: glutamatergic synapse
  directly_involved_in:
  - id: GO:0030865
    label: cortical cytoskeleton organization
  supported_by:
  - reference_id: file:human/RAC1/RAC1-uniprot.txt
    supporting_text: In hippocampal neurons, involved in spine morphogenesis and synapse formation, through
      local activation at synapses by guanine nucleotide exchange factors (GEFs)
suggested_questions:
- question: Which RAC1 effector branches account for its distinct outputs - lamellipodial protrusion,
    NADPH oxidase activation and spine morphogenesis - in the same cell, and how are they separated spatially?
- question: What distinguishes RAC1 from RAC2 and RAC3 functionally, given their near-identical effector
    binding surfaces but different expression and phenotypes?
- question: How does the nuclear pool of RAC1, conferred by its polybasic region, contribute to cell behaviour,
    if at all?
- question: How do the recurrent activating RAC1 variants found in developmental disorders and in melanoma
    change effector selection rather than simply increasing GTP loading?
suggested_experiments:
- description: Optogenetic or chemically induced local activation of RAC1 at defined membrane subdomains
    in human cells, with simultaneous readout of actin protrusion and NADPH oxidase activity, to test
    whether the two outputs can be separated spatially.
- description: Effector-selective RAC1 mutants (separating WAVE, PAK and p67phox binding) expressed in
    RAC1-null human cells, scored for lamellipodium formation, migration, superoxide production and spine
    density in differentiated neurons.
- description: Quantitative proteomics of the GTP-loaded RAC1 interactome across cell types, using nucleotide-state-specific
    affinity capture, to map which of the many reported binary interactions are nucleotide-dependent effectors.
