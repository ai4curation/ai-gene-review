  review:
    summary: Generic cytoskeleton localization inferred phylogenetically.
    action: MODIFY
    reason: The PAINT node correctly places Rac GTPases at actin structures, but cytoskeleton is less
      precise than the cortical and lamellipodial locations this gene carries with direct evidence, and
      RAC1 is a regulator of rather than a structural part of the cytoskeleton.
    proposed_replacement_terms:
    - id: GO:0005938
      label: cell cortex
    - id: GO:0030027
      label: lamellipodium
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN001530052
        source_status: SUPPORTS_TRANSFER
        comment: The ancestral Rac node legitimately acts on the actin cytoskeleton, so the node assertion
          is sound; only the granularity of the location term is at issue.
