id: P63000
gene_symbol: RAC1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: RAC1 is a ubiquitously expressed Rho-family small GTPase that cycles between an active GTP-bound
  and an inactive GDP-bound state and is held at the cytoplasmic (inner) face of the plasma membrane by
  C-terminal geranylgeranylation of Cys189, with a soluble RhoGDI-bound cytosolic pool. In the GTP-bound
  state it engages effectors such as the WAVE regulatory complex, PAK kinases, PKN2 and IQGAP proteins
  to drive branched actin polymerization, producing lamellipodia and membrane ruffles, and thereby controls
  cell spreading, polarity, directed migration and chemotaxis, cell-cell and cell-matrix adhesion and
  phagocytic engulfment. RAC1 is also an essential subunit of the phagocyte NADPH oxidase, where it binds
  the NOX2-p22phox core together with the cytosolic factors to generate superoxide, and of Nox1-based
  oxidases. In neurons it acts at postsynaptic sites of glutamatergic synapses to control spine morphogenesis
  and synapse assembly. Its activity is set by RhoGEFs, RhoGAPs and RhoGDIs; a polybasic C-terminal region
  additionally confers nuclear-localization activity. Activating RAC1 mutations cause a developmental
  disorder with brain anomalies, and dysregulated RAC1 signalling contributes to tumour invasion.
