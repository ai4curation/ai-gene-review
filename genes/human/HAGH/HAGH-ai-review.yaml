id: Q16775
gene_symbol: HAGH
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  HAGH encodes glyoxalase II (hydroxyacylglutathione hydrolase, EC 3.1.2.6), a monomeric metallo-beta-lactamase-fold
  thiolesterase with a binuclear zinc centre. It hydrolyses (R)-S-lactoylglutathione, made from methylglyoxal
  and glutathione by glyoxalase I (GLO1), to D-lactate and free glutathione, completing the glyoxalase
  route of methylglyoxal detoxification and returning glutathione to the cellular pool. It also hydrolyses
  other S-2-hydroxyacylglutathione thioesters such as S-D-mandeloylglutathione. A single vertebrate gene
  makes two forms: a long form initiated at an upstream AUG that is imported into the mitochondrial matrix,
  and a short form, from internal ribosome entry or an alternative transcript, that stays in the cytosol.
