  review:
    summary: >-
      PAINT places glutathione metabolic process at vertebrate node PTN002631193 (seeds rat Hagh and HAGH).
    action: KEEP_AS_NON_CORE
    reason: >-
      True in that the reaction releases free glutathione from its thioester, recycling the GSH consumed
      by glyoxalase I, but this is a consequence of the hydrolase step rather than a role in glutathione
      metabolism as such. GO has no term for glutathione regeneration, so the term is as precise as warranted
      and is kept as non-core; the core process is methylglyoxal catabolism.
