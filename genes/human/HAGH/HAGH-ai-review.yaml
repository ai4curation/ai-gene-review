suggested_questions:
- question: >-
    What substrate does mitochondrial glyoxalase II see in vivo, given that glyoxalase I is cytosolic:
    is S-D-lactoylglutathione imported, or does the matrix form act on other S-2-hydroxyacylglutathione
    thioesters?
suggested_experiments:
- description: >-
    Express only the long (matrix) or only the short (cytosolic) HAGH form in HAGH-null cells and measure
    S-D-lactoylglutathione and methylglyoxal-derived adducts in each compartment.
  experiment_type: isoform-specific complementation with compartment metabolomics
