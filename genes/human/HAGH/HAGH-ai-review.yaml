- term:
    id: GO:0006750
    label: glutathione biosynthetic process
  evidence_type: IDA
  original_reference_id: PMID:8550579
  qualifier: involved_in
  review:
    summary: Inferred from the hydrolase assay, whose products are glutathione and D-lactate.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Glyoxalase II returns glutathione that glyoxalase I had conjugated; it does not synthesise glutathione
      from its amino-acid precursors (GCLC/GCLM and GSS do). The cited paper characterises the hydrolase
      only (abstract), so the biosynthesis claim over-reads a product release. The argument would support
      REMOVE, but the cached record is abstract-only and the curator may have seen data in the full text, so
      the conservative MARK_AS_OVER_ANNOTATED is used rather than removing an experimental row.
    supported_by:
    - *id001
    - *id002
