core_functions:
- description: >-
    Small basic nuclear protein of unknown molecular function, translated from the upstream
    ORF of the imprinted SNURF-SNRPN bicistronic mRNA and localized to nuclear speckles. No
    molecular activity or process has been demonstrated, so only its location is stated.
  locations:
  - id: GO:0016607
    label: nuclear speck
  supported_by:
  - reference_id: PMID:10318933
    supporting_text: C-terminally tagged SNURF–GFP is indeed targeted to the nucleus when
      ectopically expressed
  - reference_id: PMID:10318933
    supporting_text: Additional studies are needed to determine whether SNURF functions as a
      ubiquitin-like or RNA-binding protein or has other biochemical functions.
suggested_questions:
- question: Does the SNURF protein itself (as opposed to the SNURF-SNRPN transcript and the
    imprinting centre) contribute to any Prader-Willi syndrome phenotype?
- question: Does the arginine-rich 71-aa protein bind RNA or speckle components (SR proteins,
    snRNPs), consistent with its nuclear-speckle localization?
suggested_experiments:
- hypothesis: The SNURF protein has a function separate from the imprinting-centre DNA and the
    SNRPN product.
  description: Introduce a start-codon or frameshift mutation into the mouse Snurf ORF that
    leaves the imprinting centre and Snrpn translation intact, and phenotype the mice. Combine
    with proximity labelling or RNA crosslinking of tagged endogenous SNURF in neurons.
