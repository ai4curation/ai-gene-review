  review:
    summary: PAINT inference at a SNURF-family node, grounded in the human HPA nuclear-speck
      observation (Q9Y675 is itself the experimental source).
    action: ACCEPT
    reason: >-
      The IBA says the speckle location is inherited across the eutherian SNURF clade, which is
      reasonable for an ORF conserved at 93-100% amino-acid identity. The human protein is
      its own grounding evidence, which is expected and not circular. No contrary localization
      data exist, and the term is a refinement of the established nuclear location.
    supported_by:
    - reference_id: PMID:10318933
      supporting_text: Amino acid identity with human SNURF ranges from 93% to 100%, with most
        substitutions being quite conservative.
