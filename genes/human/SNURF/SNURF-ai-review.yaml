gene_symbol: SNURF
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  SNURF (SNRPN upstream reading frame protein) is a highly basic 71-amino-acid nuclear
  protein encoded by the upstream open reading frame of the bicistronic SNURF-SNRPN
  transcript on chromosome 15q11-q13; the downstream ORF of the same mRNA encodes the
  spliceosomal SmN protein (SNRPN). The locus lies in the Prader-Willi syndrome imprinting
  centre and is expressed only from the paternal allele, and both proteins are made in
  normal but not Prader-Willi cells. The ORF is conserved across eutherian mammals with
  substitutions concentrated at wobble positions, which indicates selection for coding
  function, and the protein carries a conserved basic nuclear localization motif. A
  GFP-tagged protein localizes to the nucleus and antibody staining places it in nuclear
  speckles. Its molecular function and biological role are unknown. It is unrelated to the
  RING finger protein RNF4, which was originally also named SNURF.
