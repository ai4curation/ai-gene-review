- term:
    id: GO:0051117
    label: ATPase binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q9WU12
  - ensembl:ENSMUSP00000141531
  review:
    summary: Ensembl Compara transfer of an MGI IPI on mouse Snurf (Q9WU12, WITH the SNF2-family
      ATPase ARIP4/Rad54l2, PMID:12058073). The SNURF in that paper is the RING finger protein
      RNF4, not the SNRPN upstream reading frame protein.
    action: REMOVE
    reason: >-
      Symbol collision at the source. RNF4 was first described as "SNURF", small nuclear RING
      finger protein, a 194-residue C3HC4 RING protein from the same steroid-receptor
      coregulator group (PMID:9710597) that published the ARIP4 paper. The ARIP4 paper's full
      text (PMC117628, read online; the local cache is abstract-only) defines its SNURF as
      "small nuclear RING finger protein (SNURF)" and uses a "SNURF residues 20-177" VP16
      fusion as an androgen-receptor-binding control. A 20-177 fragment cannot come from the
      71-residue SNRPN-uORF protein. The MGI IPI (and its reciprocal protein-binding IPI on
      ARIP4) was therefore attached to the wrong mouse gene product (Snurf instead of Rnf4),
      and the human IEA inherits that error. Nothing links Q9Y675 to ATPase binding.
    supported_by:
    - reference_id: PMID:9710597
      supporting_text: 194 amino acid residues and comprising a consensus C3HC4 zinc finger (RING)
        structure in the C-terminal region and a bipartite nuclear localization signal near the
        N terminus
    - reference_id: PMID:10318933
      supporting_text: SNURF encodes a highly basic 71-aa protein that is nuclear-localized (as
        is SmN).
