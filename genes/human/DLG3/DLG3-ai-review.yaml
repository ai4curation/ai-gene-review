id: Q92796
gene_symbol: DLG3
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: DLG3, also called SAP102, is a membrane-associated scaffold with PDZ, SH3 and guanylate-kinase-like
  domains. It organizes receptor-associated protein complexes at excitatory postsynaptic sites
  and participates in the trafficking and retention of NMDA receptors. Its synaptic distribution
  and effects on receptor composition depend on developmental and splice context. DLG3 also
  participates in junctional organization in polarized epithelia.
alternative_products:
- name: '1'
  id: Q92796-1
  description: The displayed human product is 817 amino acids and contains three PDZ domains,
    an SH3 domain and a guanylate-kinase-like domain.
- name: '2'
  id: Q92796-2
  sequence_note: VSP_035940, VSP_035941, VSP_035942
  description: This 512-amino-acid human product deletes canonical residues 1–336 and replaces
    residues 337–381 and 592–606. It lacks the first two complete PDZ domains and changes the
    beginning of the third.
- name: '3'
  id: Q92796-3
  sequence_note: VSP_043717, VSP_035942
  description: This 366-amino-acid human product deletes canonical residues 1–483 and replaces
    residues 592–606. It lacks all three canonical PDZ domains.
