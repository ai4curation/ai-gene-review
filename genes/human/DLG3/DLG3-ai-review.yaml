    summary: DLG3 PDZ-domain binding to a DUSP10-derived peptide is retained as a non-core association.
    action: KEEP_AS_NON_CORE
    reason: The original SD1 PDZ-PBM-interactome sheet reports DLG3_2 binding to the DUSP10-derived
      synthetic peptide biotin-ado-ado-PKLMGVETVV, with composite pKd 5.2019229 (sheet row 1262).
