description: ANKRD34A (ankyrin repeat domain-containing 34A) is an uncharacterized ankyrin-repeat protein
  of the ANKRD34 family, with brain-enhanced expression. It is cytosolic. No molecular activity, partner
  or biological role is known; in vitro, a domain of ANKRD34A is strongly methylated by the glutamine
  methyltransferase HEMK2 (N6AMT1).
