knowledge_gaps:
- gap_statement: ANKRD34A's molecular activity, partners and biological role are unknown; only its cytosolic
    location is established.
  boundary: The only experimental annotation is an HPA cytosol localization, matched by the current PAINT
    node. The pi-body IBA is a stale propagation from a germline protein now in another family. The only
    paper is an in vitro methyltransferase substrate screen.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: ANKRD34A is brain-enhanced, but nothing indicates what it does there.
  resolution: Identify endogenous partners in neurons (for example by proximity labelling) and test loss
    of function in a neuronal model.
