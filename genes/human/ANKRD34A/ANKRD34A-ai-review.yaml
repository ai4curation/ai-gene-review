  review:
    summary: pi-body (IBA). Propagated from a single donor, mouse Asz1/GASZ, a germline piRNA-pathway
      protein that PANTHER now places in a different family (PTHR24157). The node is absent from the current
      PAINT release, and nothing places ANKRD34A in germ cells or pi-bodies.
    action: REMOVE
    reason: "GOA carries the row [file:human/ANKRD34A/ANKRD34A-uniprot.txt \"DR   GO; GO:0071546; C:pi-body;\
      \ IBA:GO_Central.\"], from node PTN001192751 with MGI:1921318 (Asz1) as its only experimental donor.\
      \ ANKRD34A is now in PTHR24156 [file:interpro/panther/PTHR24156/PTHR24156-entries.csv \"Q69YU3,Ankyrin\
      \ repeat domain-containing protein 34A,protein,9606,Homo sapiens,Homo sapiens (Human),ANKRD34A,496,PTHR24156:SF4,ANKYRIN\
      \ REPEAT DOMAIN 34A,True\"], whereas Asz1 is in PTHR24157. The current PTHR24156 PAINT data contain\
      \ a single cytosol node and no pi-body assertion [file:interpro/panther/PTHR24156/PTHR24156-paint.tsv\
      \ \"PTHR24156\tPTN001192733\tGO:0005829\tC\tIBD\tfalse\tUniProtKB:A5PLL1|UniProtKB:Q69YU3\ttaxon:33511\t\
      20260730\"] ANKRD34A expression is brain-enhanced [file:human/ANKRD34A/ANKRD34A-uniprot.txt \"DR\
      \   HPA; ENSG00000272031; Tissue enhanced (brain).\"], and pi-bodies are germline structures. The\
      \ domain architectures also differ: PTHR24157 is the ankyrin repeat, SAM and basic leucine zipper\
      \ family [file:interpro/panther/panther.obo \"name: ANKYRIN REPEAT, SAM AND BASIC LEUCINE ZIPPER\
      \ DOMAIN-CONTAINING PROTEIN 1\"], and mouse Asz1 has six ANK repeats and a SAM domain, whereas ANKRD34\
      \ proteins have four ANK repeats followed by a largely disordered tail and no SAM domain. Asz1's\
      \ own pi-body localization is sound; the node propagated it to the wrong subfamily. PANTHER also\
      \ retains an ANKRD34A-related subfamily inside PTHR24157 [file:interpro/panther/panther.obo \"name:\
      \ ANKYRIN REPEAT DOMAIN-CONTAINING PROTEIN 34A-RELATED\"], which is probably how the node once spanned\
      \ both."
