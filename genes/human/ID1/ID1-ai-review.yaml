id: P41134
gene_symbol: ID1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ID1 is a helix-loop-helix transcriptional regulator inhibitor that lacks the basic DNA-binding region found in bHLH transcription factors. It heterodimerizes with E proteins and other bHLH factors to prevent productive E-box binding and modulate transcriptional programs that control cell proliferation, senescence, differentiation, circadian output, and adipocyte thermogenesis in a context-dependent manner.
