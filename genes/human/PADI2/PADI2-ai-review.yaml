id: Q9Y2J8
gene_symbol: PADI2
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: PADI2 is a calcium-dependent peptidylarginine deiminase that modifies protein arginyl residues to citrulline. The enzyme can act on soluble cytoplasmic and extracellular substrates such as chemokines, and in estrogen-responsive chromatin it is recruited by ESR1 to citrullinate histone H3 Arg26, promoting local chromatin decondensation and target-gene activation.
