suggested_questions:
- question: Which PADI2 substrates account for its cytoplasmic and extracellular functions in primary human immune cells?
suggested_experiments:
- description: Use PADI2-selective perturbation followed by citrullinome proteomics in primary human macrophages or neutrophils to distinguish direct substrates from inflammatory consequences.
