- id: file:human/AP1S2/AP1S2-deep-research-affinage.md
  title: Affinage mechanistic annotation for AP1S2 (human)
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: LOW_QUALITY
    review_notes: >-
      Machine-generated deep-research record whose own head-to-head self-evaluation scored
      pairwise tie rather than win against the curated UniProt reference, tripping the trust
      gate. It describes the correct protein and its narrative matched the primary papers where
      I checked it, and its ten citations are all numeric PMIDs with no preprints. Marked
      LOW_QUALITY per the tripped gate: every claim taken from it was re-verified against the
      cited PMID, and no sentence from it is used as supporting_text. It missed the
      dileucine-hemicomplex literature (PMID:21097499, PMID:17360967, PMID:14691137), the
      naming paper PMID:9733768, and both ComplexPortal sources, and it under-weighted the
      negative patient-fibroblast result.
