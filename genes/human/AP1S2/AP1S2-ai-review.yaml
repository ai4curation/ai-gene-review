  review:
    summary: >-
      The one well-characterised non-neuronal cargo route for sigma1B: delivery of the sorting
      receptor sortilin to lysosomes in adipocytes, mediated by a dileucine-type motif in
      sortilin's tail.
    action: NEW
    reason: >-
      The cargo determinant is defined and it is of exactly the class the gamma1/sigma1B
      hemicomplex recognises: sigma1B-specific binding of sortilin requires the sortilin
      DxxD-x12-DSxxxL motif. The functional consequence is a reduced lysosomal fraction of
      sortilin, with downstream stabilisation of DLK1 and inhibition of adipogenesis. Two
      caveats are stated rather than hidden: the defect is partial - the authors explicitly
      exclude a block at any single organelle - and it is tissue-restricted, since sortilin and
      DLK1 levels are unchanged in the brain of the same animals despite brain having the
      highest sigma1B expression. Coded ISS from the identical mouse orthologue.
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
      - source_id: UniProtKB:Q9DB50
