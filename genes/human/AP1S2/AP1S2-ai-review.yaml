          Places the assertion at least as deep as the fungal-metazoan split.
      - source_id: UniProtKB:P53680
        source_label: >-
          AP2S1 (human sigma2)
        source_status: SUPPORTS_TRANSFER
        comment: >-
          Human AP-2 sigma subunit, with its own IDA and IMP for GO:0016192 from
          PMID:11102472. Being an AP-2 rather than an AP-1 subunit, it is one of the donors
          that forces the node term up to the AP-complex-wide parent.
      - source_id: WB:WBGene00000157
        source_label: >-
          aps-2 (C. elegans AP-2 sigma)
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: >-
          Neither a UniProt accession nor resolvable through the accession-keyed
          PTHR11753-entries.csv, and QuickGO rejects the WB prefix at the geneProductId
