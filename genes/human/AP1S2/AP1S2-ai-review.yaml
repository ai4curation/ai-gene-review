        source_status: SUPPORTS_TRANSFER
        comment: >-
          Same donor. PMID:24928897 shows sigma1B binds sortilin through the sortilin
          DxxD-x12-DSxxxL motif - a dileucine-type signal of the class the gamma1/sigma1B
          hemicomplex recognises - and that in sigma1B-deficient adipocytes the fraction of
          sortilin reaching lysosomes is reduced. Coded ISS because the work is in mouse
          adipose tissue; the effect is partial and tissue-restricted, which is stated in the
