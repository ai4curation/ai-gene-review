  review:
    summary: >-
      ARBA machine-learning rule assigning the broadest possible cytoplasmic location. True of
      a peripheral coat protein on the cytoplasmic face of Golgi and vesicle membranes, but the
      least informative of the several locations already annotated on this gene.
    action: MODIFY
    reason: >-
      AP1S2 is cytoplasmic - it has no signal peptide or transmembrane segment and UniProt
      describes it as a peripheral membrane protein on the cytoplasmic side - so the term is
      not wrong. It is simply too broad: the informative statement about the non-membrane-bound
      pool is cytosol, which Reactome already annotates ten times on this gene, and the
      membrane-associated pool is covered by the Golgi, TGN and vesicle-membrane rows. Tracing
      the cited rule also failed (see propagation_review), which is a further reason not to
      lean on this row for anything.
    proposed_replacement_terms:
    - id: GO:0005829
      label: cytosol
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: ARBA:ARBA00026971
        source_label: >-
          ARBA rule ARBA00026971 (annotates GO:0005737 cytoplasm)
        source_status: SOURCE_STALE_OR_MISSING
        comment: >-
          Fetched live from rest.uniprot.org/arba/ARBA00026971: 2388 condition sets,
          conditions of type FunFam id, InterPro id, taxon and PANTHER id, and a single
          annotation, GO:0005737. Scanning every set against AP1S2's actual signature
          complement - InterPro IPR000804/IPR011012/IPR016635/IPR022775/IPR044733 from the
          InterPro REST record for P56377, FunFam 3.30.450.60:FF:000009 from the UniProt DR
          line, PANTHER PTHR11753 - leaves only two sets that mention anything AP1S2 has, and
          neither can fire: one pairs IPR011012 with taxon Saccharomyces, and the other
          requires IPR027156 'AP-2 complex subunit sigma' alongside IPR016635 and IPR022775,
          which AP1S2 does not match (its family signature is the AP-1 one, IPR044733). The
          rule's FunFam conditions cover 3.30.450.60:FF:000003/4/7/8/10/11 but not FF:000009.
          So the published rule does not reproduce this row. That is a trace failure, not a
          reason to drop a term that is biologically true of a peripheral coat protein on the
          cytoplasmic face of Golgi and vesicle membranes.
      residue_claims_not_applicable: >-
        The objection is to term breadth and to an unreproducible rule trace, neither of which
        is a point-residue question.
    supported_by:
    - reference_id: file:human/AP1S2/AP1S2-uniprot.txt
      supporting_text: 'Peripheral membrane protein; Cytoplasmic side. Membrane, clathrin-'
- term:
    id: GO:0005765
    label: lysosomal membrane
  evidence_type: NAS
  original_reference_id: PMID:23247405
  qualifier: located_in
  review:
    summary: >-
      ComplexPortal projection onto the sigma1b AP-1 complex from a commentary on
      lysosome-related organelle biogenesis. The AP-1 coat is a transient visitor to the
      lysosomal membrane at the point of vesicle delivery, not a resident of it.
    action: KEEP_AS_NON_CORE
    reason: >-
      An AP-1 coat assembles on the donor TGN or endosomal membrane and disassembles before or
      at delivery - the source itself says the clathrin coat and adaptors disassemble on vesicle
      budding and return to the cytosolic pool. Being detectable at the lysosomal membrane
      during that hand-off is real but peripheral, and it is not where the sigma subunit does
      its work. Kept rather than removed because sigma1B does have a lysosome-directed cargo
      route in at least one tissue.
    supported_by:
    - reference_id: PMID:23247405
      supporting_text: Upon vesicle budding, the clathrin coat and adaptors disassemble and
        return to the cytosolic pool so they can be reutilized in further rounds of traffic
    - reference_id: PMID:24928897
      supporting_text: σ1B deficiency does not lead to a block of sortilin transport out of a
        specific organelle, but the fraction that reaches lysosomes is reduced.
