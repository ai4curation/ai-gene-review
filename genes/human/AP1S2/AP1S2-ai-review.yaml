  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-421831
  qualifier: located_in
  review:
    summary: >-
      Reactome places the AP-1 clathrin coat, including the sigma1b variant complex, on the
      trans-Golgi network membrane during coat assembly. This is the membrane on which AP-1
      is recruited and assembled, and it is a core location for the protein.
    action: ACCEPT
    reason: >-
      Coat assembly at the TGN is the canonical AP-1 step and the Golgi membrane is where it
      happens. UniProt states the same location independently for this entry, and the
      GO:0030121 AP-1 adaptor complex term that AP1S2 carries has GO:0005794 among its own
      ontology ancestors, so Golgi membrane is consistent with everything else asserted about
      the complex. The reaction-level citation is complex-level rather than
      sigma-isoform-specific, but the location does not depend on which sigma isoform is
      present.
