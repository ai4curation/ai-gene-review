- term:
    id: GO:0016192
    label: vesicle-mediated transport
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - CGD:CAL0000182525
  - FB:FBgn0039132
  - FB:FBgn0043012
  - MGI:MGI:1098244
  - MGI:MGI:1889383
  - PANTHER:PTN000204281
  - PomBase:SPAP27G11.06c
  - RGD:620188
  - SGD:S000003561
  - SGD:S000004160
  - UniProtKB:P53680
  - WB:WBGene00000157
  review:
    summary: >-
      The single phylogenetic annotation on this gene, placed at the PTHR11753 node
      PTN000204281 whose seeds are sigma subunits of AP-1, AP-2 and AP-3 from fungi, plants,
      amoebae, flies, worms and mammals. Vesicle-mediated transport is the correct last common
      ancestor term for that node and AP1S2 sits inside the clade that inherits it.
    action: ACCEPT
    reason: >-
      The node placement is sound and the target is well inside it. The seeds disagree about
      which AP complex, which membrane and which destination is involved - AP-1 at the TGN,
      AP-2 at the plasma membrane, AP-3 toward lysosome-related organelles - so GO:0016192 is
      the correct LCA rather than an over-cautious parent; a more specific child would be wrong
      for most donors. Nine of the eleven gene-level donors carry their own experimental
      evidence for the term. The strongest is the direct mouse orthologue Ap1s2, which is 100%
      identical to human AP1S2 over all 157 human residues and carries IDA and IMP evidence for
      vesicle-mediated transport, so the inference is not merely deep-homology reasoning. There
      is no IRD or IKR anywhere in the family PAINT slice and no target-specific evidence of
      loss: human AP1S2 retains the full sigma-subunit fold, the dileucine-signal binding
      residues, and the gamma-adaptin interaction.
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: CGD:CAL0000182525
        source_label: >-
          APS3 (Candida albicans AP-3 sigma)
        source_status: SUPPORTS_TRANSFER
        comment: >-
          Resolves to UniProtKB:Q59QC5 (APS3_CANAL), IMP for GO:0016192 from PMID:20870878.
          QuickGO rejects the CGD identifier at the geneProductId endpoint, so the donor was
          traced through its UniProt xref.
      - source_id: FB:FBgn0039132
        source_label: >-
          AP-1sigma (Drosophila)
        source_status: SUPPORTS_TRANSFER
        comment: >-
          The FlyBase gene resolves to four TrEMBL accessions (A0A0B4KHB7, B8A403, Q9VCF4,
          Q9GQM8) for one gene; those accessions carry GO:0016192 only as ISS/IEA, but the
          FlyBase gene-level record queried through the GO API carries an IMP from
          PMID:22389401, so the donor is experimentally grounded.
      - source_id: FB:FBgn0043012
        source_label: >-
          AP-2sigma (Drosophila)
        source_status: SUPPORTS_TRANSFER
        comment: >-
          Resolves to UniProtKB:Q9VDC3 and Q9GQM7. GO:0016192 is supported by IMP
          PMID:20226669 on the UniProt-keyed record and by NAS PMID:11598180 at the FlyBase
          gene level. This donor appears in the GOA WITH/FROM but not in the seed column of
          the current PAINT slice; the slice row is dated 20260828 against the GOA row's
          20250902, so the simplest reading is that the seed list was revised after the GOA
          snapshot. I read nothing further into the difference.
      - source_id: MGI:MGI:1098244
        source_label: >-
          Ap1s1 (mouse sigma1A), the paralogous AP-1 sigma isoform
        source_status: SUPPORTS_TRANSFER
        comment: >-
          Resolves to UniProtKB:P61967 (AP1S1_MOUSE), which carries IMP for GO:0016192 from
          PMID:24928897 and TAS from PMID:9714600. A paralogue rather than an orthologue of
          the target, but an AP-1 sigma subunit, so it supports the AP-complex-wide term at
          this node.
      - source_id: MGI:MGI:1889383
        source_label: >-
          Ap1s2 (mouse sigma1B), the direct orthologue of the target
        source_status: SUPPORTS_TRANSFER
        comment: >-
          Resolves by UniProt xref to UniProtKB:Q9DB50 (AP1S2_MOUSE). QuickGO returns IDA and
          IMP for GO:0016192 on this donor from PMID:20203623 plus an IMP from PMID:24928897.
          The mouse protein is 100.0% identical to human AP1S2 over all 157 human residues,
          differing only by a 3-residue insertion at mouse 143-145
          (AP1S2-bioinformatics/RESULTS.md), so this donor grounds the transfer as directly as
          any donor can.
      - source_id: PANTHER:PTN000204281
        source_label: >-
          PTHR11753 ADAPTOR COMPLEXES SMALL SUBUNIT FAMILY IBD node (seeded by AP-1, AP-2 and
          AP-3 sigma subunits of mouse, rat, human, fly, worm, fission and budding yeast and
          Candida)
        source_status: SUPPORTS_TRANSFER
        comment: >-
          The node, not a donor. The family PAINT slice
          (interpro/panther/PTHR11753/PTHR11753-paint.tsv) carries two IBD rows and both sit
          on this node; the GO:0016192 IBD lists ten gene-level seeds spanning AP-1, AP-2 and
          AP-3 sigma subunits from Candida, budding and fission yeast, fly, worm, rat, mouse
          and human. Because the seeds disagree on compartment and destination, GO:0016192 is
          the correct last common ancestor term for the node rather than an under-specific
          parent. AP1S2 is a PTHR11753 member (PTHR11753-entries.csv lists P56377, AP-1
          complex subunit sigma-2, AP1S2, 157 aa) and so sits inside the clade that inherits
          it; there is no IRD or IKR anywhere in the slice.
      - source_id: PomBase:SPAP27G11.06c
        source_label: >-
          vas2 (fission yeast AP-1 sigma-1)
        source_status: SUPPORTS_TRANSFER
        comment: >-
