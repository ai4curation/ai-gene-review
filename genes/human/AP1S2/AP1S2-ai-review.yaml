    review_notes: >-
      An extra-view commentary, cited by ComplexPortal for five terms on this gene. Two of
      those, platelet dense granule organization and melanosome assembly, are not supported by
      what the paper says: its only platelet sentence is an explicit prediction about Rab38,
      and its AP-1 experiments use pan-AP-1 reagents that cannot distinguish sigma isoforms.
      Reference projection: 178 annotations across 48 distinct gene products from five terms.
      Marked MISCITED for those two rows; the early endosome and vesicle-mediated transport
      rows it also supports are independently correct.
