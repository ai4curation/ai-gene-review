id: P56377
gene_symbol: AP1S2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  AP1S2 encodes sigma1B (also called sigma-2), one of three vertebrate small-subunit
  isoforms that can occupy the sigma slot of the heterotetrameric AP-1 clathrin adaptor,
  alongside the large gamma (AP1G1 or AP1G2) and beta1 (AP1B1) adaptins and a medium mu1
  subunit. Within that complex the sigma subunit is not a spacer: together with the
  N-terminal trunk of the gamma adaptin it forms the binding site for (D/E)XXXL(L/I)
  dileucine sorting signals in the cytosolic tails of transmembrane cargo, and human
  sigma1B assembles specifically into AP-1 and not into AP-2, AP-3 or AP-4. The complex
  is recruited to trans-Golgi network and endosomal membranes, links clathrin to those
  membranes, and buds cargo-laden vesicles that traffic between the TGN, endosomes and
  lysosomes.
  Unlike the ubiquitous sigma1A isoform, sigma1B is tissue-restricted and its biology is
  most penetrant in neurons. In hippocampal neurons the AP-1/sigma1B complex reforms
  synaptic vesicles from early endosomes after stimulation; without it, vesicle
  reformation is slow and incomplete and large clathrin-budding endosomal intermediates
  accumulate in the presynaptic terminal. sigma1B also carries an isoform-private
  protein interaction that sigma1A lacks: it binds the Rab5 exchange factor Rabex-5,
  which prevents assembly of the AP-1/sigma1A-ArfGAP1-Rabex-5 complex, lowers endosomal
  Rabex-5 and thereby restrains Rab5/Vps34-driven maturation of early endosomes into
  multivesicular late endosomes, balancing recycling of synaptic-vesicle proteins
  against their degradation. Outside the nervous system it directs a dileucine-motif
  cargo, sortilin, toward lysosomes in adipocytes.
  Loss-of-function variants cause an X-linked intellectual disability syndrome with
  highly variable expressivity that has been described under three separate names -
  Fried syndrome, Pettigrew syndrome and X-linked intellectual disability with
  hydrocephalus - typically combining intellectual disability, hypotonia and delayed
  walking with basal ganglia calcification or iron deposition, hydrocephalus or
  Dandy-Walker malformation, and seizures. Patient fibroblasts show no detectable defect
  in AP-1 stability, localization or function, consistent with sigma1A and sigma1C
  covering the ubiquitous AP-1 functions and the phenotype arising from a
  brain-restricted sorting defect.
