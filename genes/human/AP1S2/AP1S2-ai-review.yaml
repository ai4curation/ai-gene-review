core_functions:
- description: >-
    As the small subunit of the heterotetrameric AP-1 clathrin adaptor, AP1S2 pairs with a
    gamma adaptin to form the gamma/sigma1 hemicomplex that recognises (D/E)XXXL(L/I)
    dileucine sorting signals in the cytosolic tails of transmembrane cargo, and so
    contributes to the complex's cargo-adaptor activity at trans-Golgi network and endosomal
    membranes. The activity belongs to the complex, not to the 157-residue subunit alone, but
    the cargo-binding site is built jointly from sigma and gamma residues, and human sigma1B
    assembles into AP-1 and into no other AP complex.
  contributes_to_molecular_function:
    id: GO:0035615
    label: clathrin-cargo adaptor activity
  directly_involved_in:
  - id: GO:0016192
    label: vesicle-mediated transport
  - id: GO:0006886
    label: intracellular protein transport
  locations:
  - id: GO:0032588
    label: trans-Golgi network membrane
  - id: GO:0000139
    label: Golgi membrane
  - id: GO:0030659
    label: cytoplasmic vesicle membrane
  in_complex:
    id: GO:0030121
    label: AP-1 adaptor complex
  supported_by:
  - reference_id: PMID:21097499
    supporting_text: all AP-1 hemicomplexes containing γ1 (γ1-σ1A, γ1-σ1B, and γ1-σ1C)
      interact with similar avidities with the Nef, tyrosinase, and LIMP-II signals
  - reference_id: PMID:21097499
    supporting_text: all three σ1-HA isoforms are incorporated into AP-1 complexes containing
      γ1, β1, and μ1 subunits but not into complexes including the αC subunit of AP-2, the β3A
      subunit of AP-3, or the ϵ subunit of AP-4
  knowledge_gaps:
  - gap_statement: >-
      GO has no molecular-function term for the sigma subunit's own contribution to an AP
      complex - the recognition of a (D/E)XXXL(L/I) dileucine sorting signal at the
      sigma/large-subunit interface - so the only MF available for AP1S2 is the complex-level
      clathrin-cargo adaptor activity, which must be qualified as contributes_to.
    boundary: >-
      What the sigma subunit does is known in detail: mutagenesis has identified the individual
      sigma residues (R15, V88, L101, I103 in sigma1A numbering) whose substitution abolishes
      signal binding, and the site is shared between sigma and the gamma, alpha or delta
      subunit.
    gap_kind:
    - ONTOLOGY
    dark_aspect: MF_DARK
    status: OPEN
    resolution: >-
      Create a dileucine sorting signal binding molecular-function term usable with
      contributes_to for AP complex sigma and large subunits. Proposed under
      proposed_new_terms.
    provenance:
    - reference_id: PMID:21097499
      supporting_text: The requirement of residues in two subunits of each complex (γ and σ1
        for AP-1, α and σ2 for AP-2, and δ and σ3 for AP-3) explains why it was necessary to
        use Y3H assays to detect interactions of (D/E) XXX L(L/I) signals with AP subunits
- description: >-
    In neurons, the AP-1 complex containing sigma1B rather than sigma1A reforms synaptic
    vesicles from early endosomes after stimulation. Loss of sigma1B slows and truncates
    vesicle reformation and leaves clathrin-budding early endosomal intermediates in the
    presynaptic terminal, with normal targeting and docking of the vesicles that do form -
    placing the defect at endosomal budding rather than earlier in the secretory pathway. This
    is the function whose loss plausibly explains the neurological phenotype of AP1S2
    deficiency in humans.
  directly_involved_in:
  - id: GO:0036466
    label: synaptic vesicle recycling via endosome
  - id: GO:0016182
    label: synaptic vesicle budding from endosome
  locations:
  - id: GO:0005769
    label: early endosome
  in_complex:
    id: GO:0030121
    label: AP-1 adaptor complex
  supported_by:
  - reference_id: PMID:20203623
    supporting_text: Synaptic vesicle reformation in cultured neurons from σ1B-deficient mice
      is reduced upon stimulation, and large endosomal intermediates accumulate.
  - reference_id: PMID:25128028
    supporting_text: endosomes proved to be classic early endosomes with an increase in the
      phospholipid phosphatidylinositol 3-phosphate (PI-3-P)
  knowledge_gaps:
  - gap_statement: >-
      Which synaptic-vesicle cargo proteins the AP-1/sigma1B hemicomplex actually selects is
      undetermined. No sigma1B cargo has been identified in neurons, in contrast to adipose
      tissue where sortilin is defined; the neuronal evidence is a proteome-level shift, not a
      motif-level assignment.
    boundary: >-
      It is established that sigma1B loss misroutes specific synaptic-vesicle proteins rather
      than causing a wholesale sorting collapse - tetraspanins are enriched in
      sigma1B-deficient synaptosomes but not in their endosomes or clathrin-coated vesicles -
      and that the gamma1/sigma1B hemicomplex binds (D/E)XXXL(L/I) signals in vitro.
    gap_kind:
    - BIOLOGY
    dark_aspect: RESIDUAL_SUBGAP
    status: OPEN
    significance: >-
      Without a defined neuronal cargo, the link from the molecular activity to the human
      intellectual disability phenotype remains a plausible chain rather than a demonstrated
      one.
    resolution: >-
      Identify dileucine-motif-bearing synaptic-vesicle proteins that bind gamma1/sigma1B but
      not gamma1/sigma1A, and test whether mutating the motif reproduces the sigma1B-null
      recycling defect.
    provenance:
    - reference_id: PMID:25128028
      supporting_text: Tetraspanins are enriched in σ1B(-/-) synaptosomes, but not in their
        endosomes or in their clathrin-coated-vesicles (CCVs), indicating AP-1/σ1B-dependent
        sorting.
- description: >-
    sigma1B carries an isoform-private protein interaction that sigma1A lacks: within the
    gamma1/sigma1 hemicomplex it binds the Rab5 guanine-nucleotide exchange factor Rabex-5
    (and the RabGAP5 RUN domain). Sequestering Rabex-5 prevents assembly of the
    AP-1/sigma1A-ArfGAP1-Rabex-5 complex, lowers endosomal Rabex-5, and so restrains
    Rab5-GTP-stimulated Vps34 activity and the maturation of early endosomes into
    multivesicular late endosomes. The two AP-1 sigma isoforms therefore set the balance
    between recycling a synaptic-vesicle protein and sending it for degradation.
  directly_involved_in:
  - id: GO:2000642
    label: negative regulation of early endosome to late endosome transport
  locations:
  - id: GO:0005769
    label: early endosome
  in_complex:
    id: GO:0030121
    label: AP-1 adaptor complex
  supported_by:
  - reference_id: PMID:27411398
    supporting_text: Unexpectedly, Rabex-5 binds σ1B, not σ1A
  - reference_id: PMID:27411398
    supporting_text: Formation of AP-1/σ1A-ArfGAP1-Rabex-5 complexes is prevented by σ1B
      binding of Rabex-5 and the amount of endosomal Rabex-5 is reduced.
proposed_new_terms:
- proposed_name: dileucine sorting signal binding
  proposed_definition: >-
    Binding to a (D/E)XXXL(L/I) dileucine-based sorting signal in the cytosolic domain of a
    transmembrane protein. Such signals are recognised jointly by two subunits of a
    heterotetrameric adaptor protein complex - the gamma and sigma1 subunits of AP-1, the
    alpha and sigma2 subunits of AP-2, or the delta and sigma3 subunits of AP-3 - so a single
    subunit contributes to, rather than independently enables, this activity.
  justification: >-
    The molecular activity of an AP complex sigma subunit is signal recognition, and it has
    been mapped to individual residues by mutagenesis, yet GO offers no term for it. The only
    molecular function available for AP1S2 today is GO:0035615 clathrin-cargo adaptor activity,
    which is a complex-level term and whose definition additionally restricts it to endocytic
    vesicle formation. A signal-binding term would let the subunit-level knowledge be annotated
    with contributes_to, and would apply equally to AP1S1, AP1S3, AP2S1, AP3S1 and the
    corresponding large subunits.
  proposed_parent:
    id: GO:0005515
    label: protein binding
  supported_by:
  - reference_id: PMID:21097499
    supporting_text: One type of signal, referred to as "dileucine-based," fits the consensus
      motif (D/E)XXXL(L/I).
  - reference_id: PMID:21097499
    supporting_text: The requirement of residues in two subunits of each complex (γ and σ1 for
      AP-1, α and σ2 for AP-2, and δ and σ3 for AP-3) explains why it was necessary to use Y3H
      assays to detect interactions of (D/E) XXX L(L/I) signals with AP subunits
knowledge_gaps:
- gap_statement: >-
    No AP1S2-specific animal model exists outside the mouse. In particular there is no
    zebrafish ap1s2 mutant or morphant in the published literature, although zebrafish models
    exist for the AP-1 large subunit ap1g1, so the hydrocephalus and Dandy-Walker features of
    the human syndrome have no developmental model.
  boundary: >-
    The mouse sigma1B knockout is viable and fertile and reproduces the cognitive phenotype -
    reduced motor coordination and severely impaired long-term spatial memory - but it has not
    been reported to have hydrocephalus, Dandy-Walker malformation or basal ganglia mineral
    deposition, which are the features that define the human syndrome radiologically.
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  status: OPEN
  significance: >-
    The brain malformations are what make the human disorder recognisable, and no model
    currently explains them.
  resolution: >-
    A zebrafish ap1s2 loss-of-function line assayed for ventricular volume and hindbrain
    morphology, or a conditional mouse allele in neuroepithelium and ependyma.
  provenance:
  - reference_id: PMID:20203623
    supporting_text: The σ1B-deficient mice have reduced motor coordination and severely
      impaired long-term spatial memory.
  - reference_id: PMID:23756445
    supporting_text: MRXS5 or Pettigrew syndrome was described 20 years ago in a four
      generation family including nine affected individuals presenting with facial dysmorphism,
      intellectual disability, Dandy-Walker malformation and inconstant choreoathetosis.
- gap_statement: >-
    How loss of sigma1B produces a brain-restricted phenotype is unexplained at the mechanistic
    level. Patient fibroblasts show no AP-1 defect at all, so the disease mechanism cannot be a
    general failure of AP-1 assembly, but the specific brain process that cannot be covered by
    sigma1A or sigma1C has not been identified.
  boundary: >-
    It is established that sigma subunits are required for AP complex stability in general,
    that sigma1B is dispensable for the housekeeping functions of AP-1, and that sigma1A and
    sigma1B are both highly expressed in brain. The redundancy argument is therefore a
    reasonable hypothesis rather than a demonstrated mechanism.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    This is the gap between a well-described molecular activity and a well-described clinical
    syndrome, and closing it would say which neuronal cargo or which developmental window is
    non-redundant.
  resolution: >-
    Compare the endosomal and synaptic-vesicle proteomes of sigma1A- and sigma1B-depleted human
    neurons from the same isogenic background, and test whether sigma1A overexpression rescues
    the sigma1B-null recycling defect.
  provenance:
  - reference_id: PMID:18428203
    supporting_text: no major alteration of the stability, subcellular localization, and
      function of the AP-1 complex was observed in fibroblasts derived from a patient carrying
      an AP1S2 mutation
  - reference_id: PMID:18428203
    supporting_text: the phenotype observed in our patients results from a subtle and
      brain-specific defect of the AP-1-dependent intracellular protein traffic
- gap_statement: >-
    Whether AP1S2 has any postsynaptic role is untested. No study has examined dendritic spine
    number or morphology in sigma1B-deficient neurons, so the possibility that the cognitive
    phenotype has a postsynaptic component is open rather than excluded.
  boundary: >-
    The one relevant observation is negative and localisational: AP-1 shows little or no
    colocalisation with the postsynaptic marker Homer in either wild-type or sigma1B-deficient
    boutons, supporting a predominantly presynaptic distribution. That is a statement about
    where the complex is, not about whether spines are normal.
  gap_kind:
  - BIOLOGY
  dark_aspect: CC_DARK
  status: OPEN
  resolution: >-
    Spine density and morphology quantification in sigma1B-null hippocampal neurons, with
    electrophysiology separating pre- from postsynaptic contributions.
  provenance:
  - reference_id: PMID:20203623
    supporting_text: no or very little co-localization was observed between AP1 and the
      post-synaptic marker, Homer, both in WT and knockout boutons
- gap_statement: >-
    The functional meaning of the MAB21L2 interaction is unknown. It is the only non-AP-1
    partner in the curated interaction set for human AP1S2 and no study has tested whether it
    reflects cargo selection, a regulatory interaction, or an assay artefact.
  boundary: >-
    The interaction is curated by UniProt with five IntAct experiments from a binary
    yeast-two-hybrid reference map, so it is reproducible within that format; what is missing
    is any orthogonal validation or functional test.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  resolution: >-
    Co-immunoprecipitation from a tissue expressing both proteins, and a test of whether
    MAB21L2 carries a dileucine-type motif that the gamma1/sigma1B hemicomplex binds.
  provenance:
  - reference_id: file:human/AP1S2/AP1S2-uniprot.txt
    supporting_text: 'P56377; Q9Y586: MAB21L2; NbExp=5; IntAct=EBI-1054374, EBI-6659161;'
- gap_statement: >-
    Which sigma1 isoform operates in the melanocyte and platelet AP-1 complexes has never been
    determined, which is why the melanosome and platelet dense granule annotations on this gene
    cannot be evaluated on their merits.
  boundary: >-
    AP-1 as a complex does participate in cargo traffic from endosomal tubules to maturing
    melanosomes, and the reagents used were pan-AP-1. Separately, sigma1B expression is
    tissue-restricted rather than ubiquitous.
  gap_kind:
  - BIOLOGY
  - CURATION
  dark_aspect: BP_DARK
  status: OPEN
  significance: >-
    Complex-level annotation projected onto isoform-specific complex objects will keep
    generating unsupported subunit annotations until the isoform composition of tissue-specific
    AP-1 complexes is measured.
  resolution: >-
    Isoform-resolved immunoprecipitation or targeted proteomics of AP-1 from melanocytes and
    megakaryocytes.
  provenance:
  - reference_id: PMID:23247405
    supporting_text: Confocal immunofluorescence microscopy experiments show that a significant
      percentage of structures labeled with endogenous AP-1, AP-3 and BLOC-2 co-localize with
      endogenous Rab32 and Rab38 in many locations throughout MNT-1 melanocytes.
suggested_questions:
- question: >-
    Does any AP-1/sigma1B complex in the human brain bind a synaptic-vesicle protein through a
    (D/E)XXXL(L/I) motif, and is that motif required for the protein's recycling?
  experts:
  - Peter Schu
  - Juan S. Bonifacino
- question: >-
    Can sigma1A overexpression rescue the synaptic-vesicle recycling defect of sigma1B-null
    neurons, which would show the isoforms differ only in expression, or does it fail, which
    would show they differ in specificity?
  experts:
  - Peter Schu
- question: >-
    Do the human AP1S2 variants that truncate the protein and the one splice variant that
    shortens it without abolishing it (c.426+1G>T, losing 46 residues) produce the same
    cellular defect, or is there a residual-function allele series?
  experts:
  - Laurent Villard
  - F. Lucy Raymond
- question: >-
    Is the Rabex-5 interaction detectable with the human proteins, and does it require the
    sigma1 C-terminal extension that distinguishes sigma1 isoforms from sigma2?
  experts:
  - Peter Schu
  - Dan Cassel
- question: >-
    Why do patient fibroblasts show no AP-1 defect while patient brains show a developmental
    malformation - is the requirement developmental-stage-specific rather than
    cell-type-specific?
  experts:
  - Guntram Borck
  - Laurence Colleaux
suggested_experiments:
- hypothesis: >-
    Neuronal synaptic-vesicle proteins carrying (D/E)XXXL(L/I) motifs are selected
    preferentially by gamma1/sigma1B rather than gamma1/sigma1A hemicomplexes.
  description: >-
    Reconstitute human gamma1/sigma1A and gamma1/sigma1B hemicomplexes and compare their
    binding to a panel of synaptic-vesicle protein cytosolic tails, to find neuronal cargo that
    discriminates between the isoforms the way sortilin does in adipocytes.
  experiment_type: yeast three-hybrid and in vitro binding
- hypothesis: >-
    The sigma1A and sigma1B isoforms are functionally non-equivalent in human neurons, not
    merely differently expressed.
  description: >-
    Generate isogenic AP1S1 and AP1S2 knockouts in human iPSC-derived neurons and compare
    synaptic-vesicle recycling kinetics, endosomal proteome and Rabex-5 distribution, so the
    two isoforms are tested in the same human background.
  experiment_type: isogenic knockout plus synaptopHluorin imaging and proteomics
- hypothesis: >-
    Loss of ap1s2 disrupts ventricular and hindbrain development, accounting for the
    hydrocephalus and Dandy-Walker malformation seen in patients.
  description: >-
    Make a zebrafish ap1s2 loss-of-function line and quantify ventricular volume, hindbrain
    morphology and basal ganglia mineralisation, to test whether the human brain malformations
    can be modelled at all.
  experiment_type: zebrafish mutant phenotyping
- hypothesis: >-
    The R14/V87/L100/I102 residues identified here as retained form the same dileucine-signal
    pocket in sigma1B as their counterparts do in sigma1A.
  description: >-
    Solve or predict the structure of a gamma1/sigma1B hemicomplex bound to a dileucine signal
    and compare the pocket with the gamma1/sigma1A structure.
  experiment_type: structural biology
- hypothesis: >-
    sigma1B is absent from the AP-1 complexes that operate in melanocytes and megakaryocytes,
    so the melanosome and platelet dense granule annotations do not apply to it.
  description: >-
    Perform isoform-resolved targeted proteomics of AP-1 immunoprecipitates from melanocytes
    and megakaryocytes to determine whether sigma1B is present at all in those complexes.
  experiment_type: targeted proteomics
