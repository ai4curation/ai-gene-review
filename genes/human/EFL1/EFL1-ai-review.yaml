core_functions:
- description: Hydrolyzes GTP during the SBDS-assisted release of eIF6 from late cytosolic 60S ribosomal
    subunits. Human-protein biochemistry establishes ribosome-stimulated GTP hydrolysis and factor release,
    while structures with human EFL1 and SBDS on Dictyostelium subunits support a conformational mechanism
    in which accommodated EFL1 competes with eIF6 for an overlapping ribosomal site. The exact temporal
    relationship between hydrolysis and eIF6 displacement remains unresolved by these experiments.
  molecular_function:
    id: GO:0003924
    label: GTPase activity
  directly_involved_in:
  - id: GO:0042256
    label: cytosolic ribosome assembly
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:21536732
  - reference_id: PMID:26479198
suggested_questions:
- question: At which step in the EFL1–SBDS cycle does GTP hydrolysis occur relative to eIF6 displacement
    and release of the maturation factors?
- question: Does loss of residues 32–82 in the shorter natural EFL1 product alter nucleotide handling,
    SBDS interaction or productive eIF6 release?
suggested_experiments:
- description: Measure nucleotide hydrolysis, eIF6 release and EFL1–SBDS dissociation in parallel using
    time-resolved assays with sequence-verified human factors and defined 60S substrates, including catalytically
    impaired controls.
- description: Compare the two sequence-verified natural EFL1 products under matched conditions for nucleotide
    binding, ribosome-stimulated hydrolysis, SBDS binding and eIF6 release, while controlling protein
    abundance and folding.
