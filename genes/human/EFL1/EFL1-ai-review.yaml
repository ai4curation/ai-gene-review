id: Q7Z2Z2
gene_symbol: EFL1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: EFL1 is a cytosolic ribosome maturation GTPase that works with SBDS to release the anti-association
  factor eIF6 from late 60S ribosomal subunits. Ribosome binding stimulates its GTPase activity, while
  conformational changes in EFL1 and SBDS couple the nucleotide cycle to factor release. Removal of eIF6
  permits the mature large subunit to join a small subunit and enter translation. EFL1 is related to elongation
  factor 2 but specializes in this late maturation step.
