  assessment: Full original Methods and Results were inspected. Human-protein fluorescence anisotropy
    supports the pair association; SAXS, yeast two-hybrid and structural modeling concern yeast proteins.
    Current IntAct EBI-21463457 independently records the human in-vitro experiment. Construct features
    remain assigned to their literal participant. No exact expressed EFL1 insert sequence was recovered.
  operative_locators:
  - 'Results: human EFL1–SBDS binding kinetics and domain/mutant anisotropy'
  - 'Methods: human proteins and fluorescent tags; separate yeast SAXS/two-hybrid sections'
  figure_pixels_inspected: false
  quantitative_target_supplement_reanalysed: false
