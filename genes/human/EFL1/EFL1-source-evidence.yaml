  full_original_access: true
  assessment: Full original BioID Methods, controls and relevant Results were inspected. IntAct EBI-56912423
    records human SBDS-bait/EFL1-prey proximity in K562 cells. This is not isolated binary binding or
    proof of an autonomous EFL1 post-transcriptional function. The target-specific quantitative supplement
    was not recovered, and no numerical reanalysis is claimed.
  operative_locators:
  - 'Methods: BioID, matched biotin controls, streptavidin enrichment and mass spectrometry'
  - 'Results/Discussion: proximity-network interpretation and expression/localization limitations'
