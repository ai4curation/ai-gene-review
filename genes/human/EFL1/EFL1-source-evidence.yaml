  normal_cache_full_text_available: true
  full_original_access: true
  assessment: Identifier and title verified against the genuine normal full-text cache. Operative original
    Methods, Results, Discussion and captions were independently read. Structures combine human EFL1/SBDS
    with Dictyostelium 60S/eIF6 and use GMPPCP plus glutaraldehyde. Local EFL1 resolution is 8–9 angstroms.
    Hydrolysis timing remains unresolved; no atomic interface or exact natural-product assignment is inferred.
    No figure pixels or supplements were inspected.
  operative_locators:
  - 'Results: two EFL1 conformations and competitive eIF6 displacement'
  - 'Methods: human factors, Dictyostelium particles, GMPPCP/glutaraldehyde and domain-model fitting'
  - 'Discussion: unresolved hydrolysis timing'
