  assessment: Identifier and title verified. The normal cache remains abstract-only, but the full PMC
    original was separately recovered. Methods and the human pair anisotropy Results/Figure 6 caption
    were read; most nucleotide-exchange kinetics concern yeast EFL1. Human SBDS mutant binding is not
    evidence that both current EFL1 products were assayed. No figure pixels were inspected.
  operative_locators:
  - 'Methods: protein expression and fluorescence-anisotropy measurements'
  - 'Results and Figure 6 caption: human EFL1 binding to human SBDS WT/S143L; yeast kinetics are separate'
  figure_pixels_inspected: false
  quantitative_target_supplement_reanalysed: false
- id: PMID:26479198
  doi: 10.1038/nsmb.3112
  original_url: https://pmc.ncbi.nlm.nih.gov/articles/PMC4871238/
