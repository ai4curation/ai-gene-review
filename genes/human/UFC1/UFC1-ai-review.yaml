core_functions:
- description: E2 UFM1-conjugating enzyme that accepts activated UFM1 from the E1 enzyme UBA5 via a thioester intermediate at its catalytic Cys-116 and, with the UFL1/DDRGK1 E3 ligase, transfers UFM1 onto substrate lysines (notably RPL26/uL24 on ER-bound 60S ribosomes).
