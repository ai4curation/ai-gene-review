suggested_questions:
- question: Beyond RPL26/uL24, what is the full physiological substrate repertoire of UFC1-dependent ufmylation, and which substrates are direct E2 products versus E3-determined?
- question: How do the disease variants R23Q and T106I mechanistically reduce thioester formation, and does residual activity correlate with phenotype severity?
suggested_experiments:
- description: Reconstitute the UBA5-UFC1-UFL1/DDRGK1 cascade in vitro with purified components and 60S ribosomes to quantify the kinetic contribution of UFC1 active-site activation to RPL26 ufmylation.
- description: CRISPR knock-in of UFC1 catalytic (C116S) or disease (R23Q/T106I) alleles in cells followed by ribosome-ufmylation and ER-RQC reporter assays to test the requirement of E2 activity for 60S recycling.
