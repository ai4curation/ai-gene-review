- description: Light-dependent cis-trans isomerization of retinal supplies 11-cis chromophore for visual-pigment
    regeneration. The canonical human isoform has robust activity in a recombinant assay; splice variants
    differ markedly. This retinal reaction and light-dependent retinoid handling support sustained vision.
  molecular_function:
