id: P47804
gene_symbol: RGR
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: RGR is a membrane opsin and light-dependent retinal photoisomerase expressed in retinal pigment
  epithelium and Müller glia. Its preferred ground-state chromophore is all-trans-retinal, attached through
  a Schiff base; illumination generates 11-cis-retinal for visual-pigment regeneration. RGR supports chromophore
  recycling during sustained illumination and also influences light-dependent retinyl-ester handling in
  RPE cells. The predominant full-length human isoform is associated with internal membranes. An exon6-skipping
  isoform, RGR-d, reaches the basolateral plasma membrane of human RPE and accumulates in extracellular
  deposits with age; it has much lower photoisomerase activity in recombinant assays. Although RGR belongs
  to the opsin GPCR family, a coupled G protein and the mechanism linking illumination to retinoid-enzyme
  regulation remain unresolved. RGR variants have been associated with retinal degeneration.
