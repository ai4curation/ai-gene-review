- id: PMID:18474598
  title: Retinal pigment epithelium-retinal G protein receptor-opsin mediates light-dependent translocation
    of all-trans-retinyl esters for synthesis of visual chromophore in retinal pigment epithelial cells.
  findings:
  - statement: RGR-opsin is required for light-dependent mobilization/translocation of all-trans-retinyl
      esters in RPE cells (RNAi in human RPE cells; rgr-/- and rpe65-/-,rgr-/- knockout mice), supporting
      retinoid metabolic process.
    supporting_text: RGR-opsin mediates light-dependent mobilization of
  - statement: RGR functions as a photoisomerase and, unlike photoreceptor opsins, does not require RPE65
      for synthesis of its chromophore.
    supporting_text: because RGR functions as a photoisomerase
  - statement: In the dark RGR-opsin inhibits LRAT and all-trans-retinyl ester hydrolase in vitro, with
      inhibition released upon light exposure.
    supporting_text: RGR-opsin inhibits lecithin:retinol acyltransferase
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Read the available full-text Results/Discussion on retinyl-ester handling and light-dependent
      enzyme modulation. The signaling mechanism is explicitly unresolved; variant motifs are not a negative
      coupling assay. Direct human photoisomerization is more clearly supported by the later PMID:31694912
      Fig.9 experiment.
- id: PMID:8641686
  title: Localization of the human RGR opsin gene to chromosome 10q23.
  findings:
  - statement: RGR encodes an opsin (retinal G protein-coupled receptor) expressed in Mueller cells and
      the RPE and mapped to chromosome 10q23; described as playing a role in the visual process.
    supporting_text: expressed in Müller cells and the retinal pigment epithelium
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Verified as the original GOA TAS source. Only the mapping/expression abstract was accessible;
      the full paper's localization and signaling evidence was not inspected. Do not assert that all its
      GO annotations arose solely from a historical name. Later primary evidence independently supports
      vision and an isoform-dependent plasma-membrane pool.
- id: file:human/RGR/RGR-uniprot.txt
  title: UniProt entry P47804 (RGR_HUMAN)
  findings:
  - statement: RGR binds all-trans-retinal via a Schiff-base lysine and, on illumination, photoisomerizes
      it to 11-cis-retinal for regeneration of visual pigments; also mobilizes all-trans-retinyl esters
      to ER membranes in the RPE.
    supporting_text: Binds all-trans-retinal via a conserved Schiff-base lysine
  - statement: The record describes no consistent evidence of G-protein activation. This is an evidence
