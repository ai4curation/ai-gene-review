id: P83436
gene_symbol: COG7
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: COG7 is a peripheral Golgi-associated subunit of the conserved oligomeric Golgi complex.
  Its interaction with COG5 helps organize lobe B and incorporate other COG subunits. This structural
  role supports recycling and localization of Golgi-resident proteins, maintains Golgi architecture and
  enables normal glycan processing. Human COG7 deficiency causes a severe congenital disorder of glycosylation
  with disrupted trafficking and glycosylation in patient cells. COG7 is not a glycosyltransferase; its
  effects on glycan synthesis arise through the organization of Golgi machinery.
