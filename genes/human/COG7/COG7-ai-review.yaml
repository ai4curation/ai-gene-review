suggested_questions:
- question: Which COG7 surfaces organize additional lobe-B contacts independently of the mapped COG5 interface?
- question: Does the reduction of GS15, syntaxin-5 or GM130 after COG7 deficiency reflect altered synthesis,
    quality control, trafficking-dependent turnover or a direct protective contact?
- question: Which partner interactions detected in heterologous screens occur in native COG7 complexes
    under defined cellular conditions?
suggested_experiments:
- description: Compare sequence-verified human COG7 interface variants at matched expression in COG7-deficient
    cells, measuring lobe-B assembly, resident-protein recycling and pulse-chase turnover of selected
    Golgi proteins.
  hypothesis: COG7-dependent assembly and protein-abundance phenotypes can be separated to identify how
    complex assembly maintains individual Golgi proteins.
