  review:
    summary: COG7 provides a structural interface for lobe-B assembly.
    action: MODIFY
    reason: The original human reconstruction shows cooperative incorporation of COG6 by COG5 plus COG7
      and optimal COG8 incorporation with the lobe-B partners. Independent human COG7 interface mutations
      impair COG5 association and reduce recovered lobe-B assembly. Together these establish performed
      structural assembly, supporting protein complex scaffold activity. The crystallographic fragments
      are from K. lactis, and the glycosylation-rescue experiment tests COG5 mutants; neither is presented
      as a full-length human COG7 assay. Human COG7 knockout also reduces the abundance of its lobe-B
      partners; this supports complex maintenance, separately from the measured interface and assembly
      assays.
