core_functions:
- description: Provides a COG5-contacting structural interface that assembles lobe B of the COG complex
    at Golgi membranes and supports resident-protein recycling, Golgi organization and protein maintenance.
    Human COG7 interface mutations impair COG5 association and recovered lobe-B assembly; COG7 loss reduces
    lobe-B partner abundance, and COG7 correction restores GS15 in patient cells. Stabilization is complex
    mediated, with the resident-protein turnover route unresolved. Yeast fragment structures and human
    COG5 rescue experiments have distinct scope; isolated COG7 tethering, SNARE bridging and enzymatic
    activity are not established.
  molecular_function:
    id: GO:0140378
    label: protein complex scaffold activity
  directly_involved_in:
  - id: GO:0000301
    label: retrograde transport, vesicle recycling within Golgi
  - id: GO:0007030
    label: Golgi organization
  - id: GO:0050821
    label: protein stabilization
  locations:
