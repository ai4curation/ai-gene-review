  label: Homo sapiens
description: ERCC4 (XPF) is the catalytic subunit of the nuclear ERCC4–ERCC1 structure-specific DNA endonuclease.
  Its metal-dependent nuclease domain is distinct from the N-terminal helicase-like regulatory module,
  and C-terminal helix–hairpin–helix domains help assemble the heterodimer and engage DNA. The complex
  cleaves DNA junctions during nucleotide-excision repair and interstrand-crosslink repair and contributes
  to processing recombination intermediates. XPA and SLX4 organize recruitment in different repair contexts.
  A smaller fraction also participates in telomere-associated processes. Disease-associated ERCC4 variants
  can disrupt architecture, catalytic activity or recruitment to particular repair pathways; xeroderma
  pigmentosum and Fanconi anemia phenotypes therefore need not reflect the same intrinsic nuclease defect.
