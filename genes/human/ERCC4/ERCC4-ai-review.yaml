core_functions:
- description: ERCC4 provides the catalytic nuclease subunit of ERCC1–XPF, cleaving duplex DNA near a
    double-strand/single-strand junction during nucleotide-excision repair and interstrand cross-link
    repair. In nucleotide-excision repair this supplies the incision on the 5′ side of the lesion; recruitment
    and incision context differ among repair pathways.
  molecular_function:
    id: GO:0106332
    label: ds/ssDNA junction-specific dsDNA endonuclease activity
  directly_involved_in:
  - id: GO:0006289
    label: nucleotide-excision repair
  - id: GO:0036297
    label: interstrand cross-link repair
  locations:
  - id: GO:0005654
    label: nucleoplasm
  in_complex:
    id: GO:0070522
    label: ERCC4-ERCC1 complex
  supported_by:
  - reference_id: PMID:8797827
    supporting_text: This complex is a structure-specific endonuclease responsible for the 5' incision
      during repair.
  - reference_id: PMID:22547097
    supporting_text: In NER, ERCC1-XPF is recruited to DNA lesions by interaction with XPA and incises
      the DNA 5' to the lesion.
  - reference_id: PMID:10413517
    supporting_text: determined that it is an endonuclease and can bind DNA in the absence of the ERCC1
      subunit.
  - reference_id: PMID:16076955
  - reference_id: PMID:32111838
  - reference_id: PMID:32034146
- description: The same ERCC1–XPF nuclease processes junctions bearing nonhomologous 3′ tails during single-strand-annealing
    repair of DNA double-strand breaks. Human RAD52 binds XPF and can stimulate junction incision under
    defined order-of-addition conditions; ERCC4 performs the cleavage step rather than the annealing reaction.
  molecular_function:
    id: GO:0106332
    label: ds/ssDNA junction-specific dsDNA endonuclease activity
  directly_involved_in:
  - id: GO:0000736
    label: double-strand break repair via single-strand annealing, removal of nonhomologous ends
  locations:
  - id: GO:0005654
    label: nucleoplasm
  in_complex:
    id: GO:0070522
    label: ERCC4-ERCC1 complex
  supported_by:
  - reference_id: PMID:14690602
    supporting_text: ERCC1/XPF-deficient cells retained the telomeric overhang after TRF2 inhibition,
      identifying this nucleotide excision repair endonuclease as the culprit in overhang removal.
  - reference_id: PMID:14734547
    supporting_text: The XPF/ERCC1 heterodimer is a DNA structure-specific endonuclease that participates
      in nucleotide excision repair and homology-dependent recombination reactions, including DNA single
      strand annealing and gene targeting.
  - reference_id: Reactome:R-HSA-5686657
  - reference_id: PMID:16076955
