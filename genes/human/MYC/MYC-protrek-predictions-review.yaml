    error_type: FREQUENCY_BIAS
    summary: >-
      Rank 3 (score 16.14). Response to actinomycin D is an experimental-treatment term; actinomycin
      D is a transcription inhibitor widely used in MYC turnover experiments, so the association is
      with the assay rather than with the biology. MYC is not annotated to it. Ranks 4 and 5 return
      to substance with a G1/S cell cycle term and N-box binding, so this is an isolated lapse in
      an otherwise accurate list.
    supported_by:
