description: >-
  ProTrek sequence-to-text retrieval for c-Myc. Ranks 1 and 2 are exact GOA matches naming the MYC-MAX
  complex and E-box binding, which between them are this review's first two core functions and the
  mechanistic core of MYC biology. Ranks 4 and 5 add a correct cell-cycle term and a DNA-motif refinement.
  Only rank 3 is off. This is one of the cleanest human results in the cohort. Assessment: 2 correct
  not novel (CNN), 1 nonparalog incorrect (NPI).
