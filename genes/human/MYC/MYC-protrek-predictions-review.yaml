    summary: >-
      Top-ranked hit (score 17.17), an exact GOA match. The Myc-Max heterodimer is the obligate functional
      unit - MYC cannot bind DNA alone - so naming the complex is the single most informative statement
      about the protein. Correct and specific; already annotated.
