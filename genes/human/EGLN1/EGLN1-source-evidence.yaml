  interpretation: The normalized binding intensity (BI), not pKd, is compared with 0.05. All three positive
    imported pairs have one DAPF measurement and estimated pKd using the 18 micromolar conversion assumption,
    without a row-level independent FP measurement. WHRN BI 0.05223779 lies just above threshold; it is
    not described as strong binding. IL16_4 and DFNB31_1 supply independent original-table evidence at
    gene-product level while their currently recorded IntAct domains are censored. Below-threshold values
    do not prove noninteraction. Domain names and official features do not authenticate experimental inserts
    or natural-product identity.
