core_functions:
- description: An Fe(II)- and 2-oxoglutarate-dependent prolyl hydroxylase that modifies HIF-alpha oxygen-dependent
    degradation domains. Hydroxylation supplies the recognition signal for VHL-dependent ubiquitination
    and subsequent proteasomal turnover, coupling oxygen availability to suppression of HIF signaling.
    EGLN1 catalyzes the hydroxylation step; the downstream ubiquitin ligase and proteasome carry out targeting
    and degradation.
  molecular_function:
    id: GO:0160082
    label: hypoxia-inducible factor-proline dioxygenase activity
  directly_involved_in:
  - id: GO:1902072
    label: negative regulation of hypoxia-inducible factor-1alpha signaling pathway
  locations:
  - id: GO:0005829
    label: cytosol
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:11598268
  - reference_id: PMID:19604478
  - reference_id: PMID:16956324
  - reference_id: PMID:19631610
  - reference_id: url:https://www.proteinatlas.org/ENSG00000135766-EGLN1/subcellular
  - reference_id: PMID:19208626
  substrates:
