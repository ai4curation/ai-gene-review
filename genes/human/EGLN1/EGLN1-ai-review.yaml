    label: HIF1A
  - id: UniProtKB:Q99814
    label: EPAS1
suggested_questions:
- question: Do the 404- and 325-residue natural products retain catalytic activity and substrate preferences
    comparable with the displayed 426-residue protein?
- question: Do the EGLN1 peptide interactions with IL16 PDZ4, DLG3 PDZ2 and WHRN PDZ1 occur for full-length
    proteins in relevant human cells?
- question: Does the PHD2-associated decrease in PDE4D activity reflect a separate noncovalent inhibitory
    mechanism, altered protein amount, or hydroxylation-dependent regulation?
- question: Which neuronal EGLN1 effects generalize across cell types and insults, given distinct PHD1/PHD2
    outcomes in cortical oxidative stress and dopaminergic mitochondrial-stress models?
suggested_experiments:
- description: Compare purified sequence-verified natural EGLN1 products in matched HIF peptide hydroxylation
    and 2-oxoglutarate-turnover assays, measuring both outputs rather than assuming coupling.
- description: Test full-length EGLN1 with the three quantitatively positive PDZ domains and full-length
    partner proteins using an orthogonal binding assay, defined peptide/terminal controls and appropriate
    human-cell contexts.
- description: Measure PDE4D catalytic activity at equal protein concentration before and after PHD2 exposure,
    separating abundance, reversible association and covalent modification effects.
