id: Q9GZT9
gene_symbol: EGLN1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: EGLN1 (PHD2) is an Fe(II)- and 2-oxoglutarate-dependent prolyl hydroxylase that couples oxygen
  availability to HIF-alpha stability. It hydroxylates proline residues in HIF-alpha oxygen-dependent
  degradation domains, enabling recognition by the VHL ubiquitin-ligase machinery and subsequent proteasomal
  turnover. The enzyme acts in cytosolic and nuclear pools; its chemistry, rather than the downstream
  ubiquitination or proteolysis, is the oxygen-sensitive step. Additional neuronal studies connect PHD2-dependent
  hydroxylation to postsynaptic protein turnover and stress responses. Pathogenic EGLN1 variants cause
  familial erythrocytosis.
alternative_products:
- name: '1'
  id: Q9GZT9-1
  description: Displayed 426-residue reference isoform. Removal of the initiator methionine yields the
    annotated chain spanning residues 2–426; this processing is distinct from alternative splicing.
- name: '2'
  id: Q9GZT9-2
  sequence_note: VSP_007569
  description: 404-residue alternative splice product lacking reference residues 338–359. The deletion
    lies within the annotated dioxygenase domain; catalytic equivalence to the displayed isoform is not
    established by sequence identity elsewhere.
- name: '3'
  id: Q9GZT9-3
  sequence_note: VSP_042191
  description: 325-residue alternative splice product in which reference residues 58–175 are replaced
    by a 17-residue segment. This sequence differs from the historical HPH-2 construct lacking residues
    76–177 and from the engineered 181–426 catalytic-domain construct; those assays do not establish isoform-specific
    equivalence.
