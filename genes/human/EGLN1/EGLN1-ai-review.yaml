    reason: The literal donor P59722 carries an IMP enzyme-inhibitor assertion from PMID 22975349. Its
      accessible abstract reports lower PDE4D protein and activity after PHD2 expression, co-immunoprecipitation
      and hydroxylated PDE4D peptides. It does not resolve whether catalytic inhibition was distinguished
      from reduced enzyme abundance. GO:0004857 requires reduction of catalytic activity by a molecular
      function regulator. Preserve the transfer without converting a perturbation endpoint into a direct
      inhibitor activity; the full operative assay was not recovered.
