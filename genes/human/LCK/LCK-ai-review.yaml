core_functions:
- description: Src-family non-receptor protein tyrosine kinase that initiates T cell receptor signaling at the plasma membrane by phosphorylating CD3/TCR zeta ITAMs and then phosphorylating and activating ZAP70 (and LAT).
  molecular_function:
    id: GO:0004715
    label: non-membrane spanning protein tyrosine kinase activity
  directly_involved_in:
  - id: GO:0050852
    label: T cell receptor signaling pathway
  locations:
  - id: GO:0005886
    label: plasma membrane
  - id: GO:0001772
    label: immunological synapse
  - id: GO:0045121
    label: membrane raft
  supported_by:
  - reference_id: PMID:2470098
    supporting_text: Last, we demonstrate directly that members of the CD3 complex, including the gamma, delta, and epsilon chains, as well as a putative zeta subunit, can be phosphorylated at tyrosine residues by the CD4/CD8.p56lck complex.
  - reference_id: PMID:8681956
    supporting_text: The protein tyrosine kinase (PTK) Lck phosphorylates the zeta-chain, which in turn associates with another PTK, ZAP70, and stimulates its phosphorylation activity.
  - reference_id: PMID:10318843
    supporting_text: One essential function of Lck in this process is to phosphorylate ZAP-70 and up-regulate its catalytic activity.
  - reference_id: PMID:16938345
    supporting_text: Further, the in vitro kinase assay using purified Lck and LAT shows that Lck directly phosphorylates LAT.
- description: 'Coreceptor coupling: LCK binds the cytoplasmic tails of CD4 and CD8, which positions the kinase at the peptide-MHC-engaged TCR-CD3 complex.'
  molecular_function:
    id: GO:0042609
    label: CD4 receptor binding
  directly_involved_in:
  - id: GO:0050852
    label: T cell receptor signaling pathway
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:2470098
    supporting_text: Last, we demonstrate directly that members of the CD3 complex, including the gamma, delta, and epsilon chains, as well as a putative zeta subunit, can be phosphorylated at tyrosine residues by the CD4/CD8.p56lck complex.
  - reference_id: PMID:12732664
    supporting_text: Coaggregation of TCR and CD4 leads to Lck activation within seconds outside lipid rafts, followed by its translocation into lipid rafts and the activation of colocalized Fyn.
- description: Coreceptor coupling to CD8 for MHC class I-restricted TCR signaling.
  molecular_function:
    id: GO:0042610
    label: CD8 receptor binding
  directly_involved_in:
  - id: GO:0050852
    label: T cell receptor signaling pathway
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:2470098
    supporting_text: In this study, we reveal that the human CD8 antigen is also associated with the T-cell-specific protein-tyrosine kinase (p56lck).
- description: SH2-domain phosphotyrosine binding to phosphorylated ZAP70 (Tyr319) and Syk that stabilizes the kinase cascade downstream of ITAM phosphorylation.
  molecular_function:
    id: GO:0001784
    label: phosphotyrosine residue binding
  directly_involved_in:
  - id: GO:0050852
    label: T cell receptor signaling pathway
  supported_by:
  - reference_id: PMID:10318843
    supporting_text: We show that a phosphopeptide encompassing the motif harboring Tyr319, YSDP, interacted with LckSH2, although with a lower affinity compared with a phosphopeptide containing the optimal binding motif, YEEI.
  - reference_id: PMID:8798676
    supporting_text: The SH2 domain of Lck bound the autophosphorylation site only when both Tyr518 and Tyr519 were phosphorylated.
suggested_questions:
- question: What fraction of LCK is coreceptor-bound versus free in naive CD4 and CD8 T cells, and does the free pool dominate TCR ITAM phosphorylation for high-affinity ligands?
- question: Does LCK directly participate in CD27 or other TNFR-family co-signaling, or is LCK phosphorylation only a readout of concurrent TCR stimulation (PMID:38354704)?
- question: Is LCK a direct, physiologically relevant kinase for PLCgamma2 in B cells, as implied by the phospholipase annotations from PMID:11606584?
suggested_experiments:
- hypothesis: LCK kinase activity, and not its scaffolding functions, is required for CD27-dependent memory gene programs in naive CD8 T cells.
  description: Compare wild-type, kinase-dead (K273R) and CD4/CD8-binding-deficient (zinc clasp C20/C23A) LCK re-expressed in LCK-knockout human T cells stimulated with TCR plus trimeric CD70, reading out CD27 signaling and ITAM phosphorylation.
  experiment_type: genetic complementation
