existing_annotations:
- term:
    id: GO:0000242
    label: pericentriolar material
  evidence_type: IDA
  original_reference_id: PMID:7513706
  qualifier: located_in
  review:
    summary: Immunofluorescence in human T cells showed Lck at the plasma membrane and on pericentrosomal vesicles that co-localize with the mannose 6-phosphate receptor.
    action: KEEP_AS_NON_CORE
    reason: The observed pericentrosomal signal is vesicular (endosomal/M6PR compartment) rather than a centrosome structural component; the principal site of LCK action is the cytoplasmic face of the plasma membrane. Retained as a minor, experimentally observed localization.
    supported_by:
    - reference_id: PMID:7513706
      supporting_text: Lck was present at the plasma membrane, consistent with its proposed role in transmembrane signalling, and was also associated with pericentrosomal vesicles which co-localized with the cation-independent mannose 6-phosphate receptor.
- term:
    id: GO:0001772
    label: immunological synapse
  evidence_type: IDA
  original_reference_id: PMID:20007709
  qualifier: located_in
  review:
    summary: Active LCK co-localizes with SOCS-6 at the immunological synapse after APC-T cell conjugation.
    action: ACCEPT
    reason: LCK is recruited to the T cell side of the immunological synapse where it phosphorylates TCR-CD3 ITAMs; a physiologically relevant location for its core activity.
    supported_by:
    - reference_id: PMID:20007709
      supporting_text: Confocal microscopy showed that upon APC-T cell conjugation, SOCS-6 was recruited to the immunological synapse and colocalized with the active form of p56(lck).
- term:
    id: GO:0001784
    label: phosphotyrosine residue binding
  evidence_type: IPI
  original_reference_id: PMID:20624904
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q6GX35
  review:
    summary: LCK SH2 domain binds phosphotyrosine peptides (here from the Chlamydia effector Tarp on a human SH2 domain array).
    action: ACCEPT
    reason: The LCK SH2 domain is a bona fide phosphotyrosine-binding module; it binds phosphorylated ZAP70 Tyr319 and Syk Tyr518/519, supporting kinase activation in TCR signaling. The term is informative and correct for LCK.
    supported_by:
    - reference_id: PMID:10318843
      supporting_text: We show that a phosphopeptide encompassing the motif harboring Tyr319, YSDP, interacted with LckSH2, although with a lower affinity compared with a phosphopeptide containing the optimal binding motif, YEEI.
    - reference_id: PMID:8798676
      supporting_text: The SH2 domain of Lck bound the autophosphorylation site only when both Tyr518 and Tyr519 were phosphorylated.
