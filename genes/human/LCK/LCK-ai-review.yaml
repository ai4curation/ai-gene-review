- term:
    id: GO:0005829
    label: cytosol
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  supporting_entities:
  - ARBA:ARBA00029243
  - UniProtKB-SubCell:SL-0091
  review:
    summary: Cytosol location (Reactome compartment convention / automated).
    action: KEEP_AS_NON_CORE
    reason: LCK is synthesized as a soluble cytosolic protein before N-myristoylation and S-palmitoylation direct it to membranes; its functional pool acts at the cytoplasmic face of the plasma membrane. Reactome uses cytosol for membrane-peripheral reactions, so this location is acceptable but not the principal site of action.
