    reason: The paper reports LCK as a substrate of serine/threonine kinases (MAPK, PKA, PKC), not as a phosphatase. LCK has no phosphatase domain; the annotation appears to invert the direction of the reaction and is contradicted by the evidence itself.
    supported_by:
    - reference_id: PMID:8506364
      supporting_text: In vitro kinase assays show that Ser-59 can be uniquely phosphorylated by mitogen-activated protein kinase and that Ser-42 can be phosphorylated by either protein kinase A or protein kinase C.
