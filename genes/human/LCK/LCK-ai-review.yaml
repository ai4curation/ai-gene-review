- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: EXP
  original_reference_id: PMID:22034844
  qualifier: located_in
  review:
    summary: LCK is anchored at the inner leaflet of the plasma membrane via dual N-terminal acylation.
    action: ACCEPT
    reason: Plasma membrane is the principal site of LCK function, where it associates with CD4/CD8 and phosphorylates TCR-CD3 ITAMs.
    supported_by:
    - reference_id: PMID:22034844
      supporting_text: Dual N-terminal acylation of Lck with myristate (N-acylation) and palmitate (S-acylation) is essential for its membrane association and function.
    - reference_id: PMID:7513706
      supporting_text: Lck was present at the plasma membrane, consistent with its proposed role in transmembrane signalling, and was also associated with pericentrosomal vesicles which co-localized with the cation-independent mannose 6-phosphate receptor.
