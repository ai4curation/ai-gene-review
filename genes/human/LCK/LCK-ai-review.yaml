id: P06239
gene_symbol: LCK
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: LCK (lymphocyte-specific protein tyrosine kinase, p56lck) is a Src-family non-receptor protein tyrosine kinase expressed mainly in T cells and NK cells. It is N-myristoylated and S-palmitoylated, which anchors it to the cytoplasmic face of the plasma membrane and to lipid rafts. Through a zinc clasp formed between its unique N-terminal region and the cytoplasmic tails of CD4 and CD8, LCK is coupled to the coreceptors and is brought to the T cell receptor (TCR)-CD3 complex when the TCR engages peptide-MHC. LCK initiates TCR signaling by phosphorylating the immunoreceptor tyrosine-based activation motifs (ITAMs) of CD3 and TCR zeta chains, which recruit ZAP70; LCK then phosphorylates and activates ZAP70 and also phosphorylates LAT and other substrates, with its SH2 domain binding phosphorylated ZAP70. Its activity is set by the balance of CSK-mediated phosphorylation of the inhibitory C-terminal Tyr505 and CD45 (PTPRC)-mediated dephosphorylation, together with activation-loop Tyr394 autophosphorylation that is reversed by phosphatases such as PTPN22 and DUSP22. LCK signaling is essential for pre-TCR and TCR-driven thymocyte development and mature T cell activation, and LCK also phosphorylates ITAMs of other receptors, such as the Fc gamma RIIIA zeta subunit in NK cells, and costimulatory receptor tails such as CD28.
