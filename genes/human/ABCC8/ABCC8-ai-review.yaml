- term:
    id: GO:1905604
    label: negative regulation of blood-brain barrier permeability
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q09429
  - ensembl:ENSRNOP00000028696
  review:
    summary: The traced injury evidence supports increased, not decreased, barrier permeability.
    action: MODIFY
    reason: 'The Q09429 source PMID:18854840 reports that inhibiting SUR1 reduces IgG extravasation
      and restores junctional ZO-1 after rat subarachnoid hemorrhage. PMID:24114458 independently
      reports the same direction with SUR1 antisense. Thus the transferred negative sign is opposite
      to the source intervention logic: intact injury-induced SUR1 signaling promotes permeability.
      Replace with positive regulation, restricted in interpretation to the injury context; this
      is a source-side sign correction, not a claim of normal human barrier maintenance.'
    additional_reference_ids:
    - PMID:18854840
    - PMID:24114458
