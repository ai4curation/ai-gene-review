- id: file:human/ABCC8/ABCC8-deep-research-falcon.md
  title: ABCC8 functional-annotation research report (Falcon)
  findings: []
core_functions:
- description: Regulates Kir6.2 potassium-channel gating by sensing adenine nucleotides and sulfonylurea
    ligands, coupling metabolism to membrane excitability and insulin secretion. SUR1 provides nucleotide-dependent
    regulation and channel assembly/surface-expression functions; Kir6.2 supplies the ion-conducting
    pore. SUR1 has ATPase activity, but channel opening is not a stoichiometric ATP-driven K+ pumping
    reaction and hydrolysis is not obligatory for every opening under all tested conditions.
  molecular_function:
    id: GO:0015459
    label: potassium channel regulator activity
  contributes_to_molecular_function:
    id: GO:0015272
    label: ATP-activated inward rectifier potassium channel activity
  directly_involved_in:
  - id: GO:0071805
    label: potassium ion transmembrane transport
  - id: GO:0050796
    label: regulation of insulin secretion
  locations:
  - id: GO:0005886
    label: plasma membrane
  in_complex:
    id: GO:0008282
    label: inward rectifying potassium channel
  supported_by:
  - reference_id: PMID:29286281
    supporting_text: These structures support the role of SUR1 as an ADP sensor
  - reference_id: PMID:24814349
    supporting_text: Seven of the 8 mutants reaching the plasma membrane had dramatically reduced
      response to MgADP or to diazoxide (<10% of wild-type response).
  - reference_id: PMID:30587573
    supporting_text: ATP binding to SUR1, without hydrolysis, opens channels when nucleotide antagonism
      on Kir6.2 is minimized
suggested_questions:
- question: Which experiments support the rat-source presynaptic and synaptic-vesicle membrane locations,
    intracellular glucose homeostasis, LDL clearance and glial proliferation, and do these roles
    transfer to human SUR1?
- question: Which mouse experiment underlies the unrecovered positive regulation of glucose-stimulated
    insulin secretion source, and what phase or condition determines its sign?
- question: Under which native injury conditions does human SUR1 form a functional TRPM4-associated
    channel, given differing heterologous-system results in PMID:22291026 and PMID:23255597?
- question: Should GO:0015272 terminology and its ATP pore-block wording be clarified to distinguish
    SUR1 nucleotide activation from inhibitory ATP binding to Kir6.2?
suggested_experiments:
- description: Measure SUR1 nucleotide occupancy, hydrolysis and Kir6.2 single-channel gating simultaneously
    in purified human complexes and beta-cell models, using binding-competent and catalysis-altered
    controls, to separate nucleotide sensing from obligatory hydrolytic coupling.
- description: Compare endogenous SUR1 complex composition and currents in injured human neurovascular
    cells with genetically rescued ABCC8 and TRPM4 perturbations, controlling for KCNJ11-containing
    KATP and drug off-target effects.
