- term:
    id: GO:1990573
    label: potassium ion import across plasma membrane
  evidence_type: ISS
  original_reference_id: GO_REF:0000114
  qualifier: involved_in
  supporting_entities:
  - ComplexPortal:CPX-185
  review:
    summary: Direction-independent potassium transport is supported, but this donor does not establish
      physiological human K+ import.
    action: MODIFY
    reason: The live ComplexPortal CPX-185 record identifies a rat Kir6.2–SUR2B complex (4xAbcc9:4xKcnj11),
      not SUR1. Its K+ influx annotation is a homologous-complex source, whose direction-specific
      tissue claim should not automatically transfer to human ABCC8. Inward rectification does not
      itself imply net physiological influx; beta-cell KATP carries outward current under its normal
      electrochemical conditions. The conserved supported role is potassium ion transmembrane transport
      via channel regulation (PMID:29286281; Reactome:R-HSA-1296024).
    additional_reference_ids:
    - PMID:29286281
    proposed_replacement_terms:
