      pump.
    action: MODIFY
    reason: The full text of PMID:26181369 uses direct biochemical MgATPase assays together with
      patch clamp, including human SUR1 constructs. GO:0019829 requires cation translocation coupled
      to ATP hydrolysis as a pump reaction. The channel pore conducts K+ through Kir6.2, while SUR1
      nucleotide-domain activity regulates gating. Replace with the directly measured ATPase activity;
