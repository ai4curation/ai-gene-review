  - UniProtKB:Q92887
  - UniProtKB:Q96J66
  - WB:WBGene00003411
  review:
    summary: SUR1 is an ABC-family channel regulator rather than an established primary active transporter.
    action: MODIFY
    reason: GO:0140359 describes ATP-driven substrate translocation by a primary active ABC transporter.
      Human SUR1 structures and electrophysiology (PMID:29286281; PMID:34815345) resolve a separate
      Kir6.2 ion pathway and regulatory SUR1 nucleotide domains. SUR1 retains ATP binding and ATPase
      activity, but no independent transported solute is demonstrated. This target-specific functional
      specialization makes primary-active-transporter propagation inappropriate; replace with potassium
      channel regulator activity, without asserting loss of ATPase catalytic residues.
    additional_reference_ids:
    - PMID:29286281
    - PMID:34815345
    - PMID:26181369
    proposed_replacement_terms:
    - id: GO:0015459
      label: potassium channel regulator activity
    propagation_review:
      root_cause: PROPAGATION_BAD
      source_entities:
      - source_id: PANTHER:PTN009085477
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: 'Challenge the active-transporter activity at this ancestral-node transfer specifically
          for the SUR regulatory lineage: direct human structural and functional data show regulation
          of a separate pore, not a SUR1 solute-pump mechanism. This does not deny the ATPase fold
          or use donor count as evidence.'
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      - ROLE_CONFLATION
    supported_by:
    - reference_id: PMID:29286281
      supporting_text: These structures support the role of SUR1 as an ADP sensor
    - reference_id: file:human/ABCC8/ABCC8-deep-research-falcon.md
      supporting_text: no transported solute is established
