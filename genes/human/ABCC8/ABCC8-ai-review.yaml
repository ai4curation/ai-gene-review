id: Q09428
gene_symbol: ABCC8
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ABCC8 encodes sulfonylurea receptor 1 (SUR1), an ABC-family membrane protein that regulates
  ATP-sensitive potassium channels. Four SUR1 subunits associate with four KCNJ11/Kir6.2 pore subunits
  at the plasma membrane, particularly in pancreatic beta cells and neuroendocrine tissues. SUR1
  binds adenine nucleotides and sulfonylurea drugs, contributes to channel assembly and surface expression,
  and couples metabolic signals to channel gating. Its nucleotide-binding domains possess ATPase
  activity, whereas potassium passes through Kir6.2 rather than a SUR1 transport pore. In beta cells,
  channel opening restrains calcium-dependent insulin release; glucose-driven channel closure permits
  secretion. Loss-of-function variants cause congenital hyperinsulinism, while activating variants
  can cause neonatal diabetes. Injury-associated SUR1 signaling also contributes to neurovascular
  dysfunction in experimental models.
