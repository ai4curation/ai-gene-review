proposed_new_terms: []
suggested_questions:
- question: >-
    What are the distinct contributions of the neuronal (presynaptic axon-terminal) versus
    astrocytic pools of GAT-1 to clearance of synaptic GABA, and how do they differ in
    regulation?
- question: >-
    How does PDZ-mediated binding to the PALS1 (MPP5) scaffold control GAT-1 surface expression,
    clustering and GABA-uptake capacity at the presynaptic membrane in human neurons?
suggested_experiments:
- description: >-
    Electrophysiological and [3H]-GABA radiotracer characterization of GAT-1 disease variants
    expressed alone and co-expressed with wild-type, to distinguish loss-of-transport from
    dominant-negative trafficking/oligomerization effects, interpreted against the GAT-1 cryo-EM
    structures (PDB 7Y7V/7Y7W).
- description: >-
    Cell-type-specific conditional Slc6a1 manipulation (neuron vs astrocyte drivers) combined with
    optical GABA sensors at GABAergic synapses to quantify each pool's contribution to cleft GABA
    clearance and inhibitory tone.
