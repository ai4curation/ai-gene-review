core_functions:
- description: >-
    Sodium- and chloride-dependent secondary-active symport of GABA across the plasma membrane:
    one GABA molecule is imported together with two sodium ions and one chloride ion per cycle,
    generating a net inward electrogenic current. This coupled symporter activity is the defining
    molecular function of GAT-1 and the basis of synaptic GABA reuptake.
  molecular_function:
    id: GO:0005332
    label: gamma-aminobutyric acid:sodium:chloride symporter activity
  directly_involved_in:
  - id: GO:0051936
    label: gamma-aminobutyric acid reuptake
  - id: GO:0051939
    label: gamma-aminobutyric acid import
  locations:
