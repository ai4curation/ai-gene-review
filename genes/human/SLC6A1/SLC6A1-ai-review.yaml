id: P30531
gene_symbol: SLC6A1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  SLC6A1 (GAT-1, GABA transporter 1) is a 599-residue, 12-transmembrane plasma-membrane
  protein of the SLC6/neurotransmitter:sodium symporter (NSS, SNF) family. It is a sodium-
  and chloride-dependent secondary-active symporter that imports the inhibitory neurotransmitter
  gamma-aminobutyric acid (GABA) across the plasma membrane together with two sodium ions and
  one chloride ion per cycle, generating an inward electrogenic current; transport is reversible
  and its direction depends on the membrane potential and the transmembrane sodium, chloride and
  GABA gradients. GAT-1 concentrates at presynaptic terminals of GABAergic interneurons and in
  astrocytes, where it performs the reuptake of GABA from the synaptic cleft and extracellular
  space, terminating GABAergic signalling and recycling the neurotransmitter. It is a validated
  drug target (the anticonvulsant tiagabine is a GAT-1 inhibitor). Loss-of-function variants cause
  autosomal-dominant myoclonic-atonic epilepsy and related developmental/epileptic phenotypes.
