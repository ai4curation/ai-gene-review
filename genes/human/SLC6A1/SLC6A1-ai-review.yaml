    label: gamma-aminobutyric acid
  - id: CHEBI:29101
    label: sodium(1+)
  - id: CHEBI:17996
    label: chloride
  supported_by:
  - reference_id: PMID:10973981
    supporting_text: suggesting unidirectional influx of 2Na(+):1Cl(-):1GABA per transport cycle
  - reference_id: PMID:10973981
    supporting_text: the GAT1 stoichiometry was 2Na(+):1GABA
  - reference_id: file:human/SLC6A1/SLC6A1-uniprot.txt
    record_section: ["CC:CATALYTIC ACTIVITY"]
