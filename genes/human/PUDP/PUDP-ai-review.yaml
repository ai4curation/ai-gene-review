- term:
    id: GO:1990738
    label: pseudouridine 5'-phosphatase activity
  evidence_type: IDA
  original_reference_id: PMID:20722631
  qualifier: enables
  review:
    summary: Purified recombinant human HDHD1/PUDP hydrolyses pseudouridine 5'-phosphate with kcat 1.6 s-1 and
      Km 0.3 uM. Its catalytic efficiency on this substrate is at least 1000-fold higher than on other phosphate
      esters, including UMP. Patient cells with an STS-HDHD1 co-deletion lose more than 90% of the native
      activity, which confirms that this gene encodes the erythrocyte enzyme.
    action: ACCEPT
    reason: This is direct biochemical evidence with kinetic constants, supported by genetic loss-of-activity
      in patient cells. It is the defining, experimentally established function of human PUDP. Independent
      later work used human HDHD1 as the psi-MP-specific phosphatase in an engineered pseudouridine production
      pathway.
    supported_by:
    - reference_id: PMID:20722631
      supporting_text: Purified human recombinant HDHD1 dephosphorylated pseudouridine 5'-phosphate with a
        kcat of 1.6 s-1, a Km of 0.3 μM and a catalytic efficiency at least 1000-fold higher than that on
        which it acted on other phosphate esters, including 5'-UMP.
    - reference_id: PMID:20722631
      supporting_text: The molecular identity of pseudouridine-5'-phosphatase was confirmed by the finding
        that its activity was negligible (<10% of controls) in extracts of B-cell lymphoblasts or
        erythrocytes from X-linked ichthyosis patients harbouring a combined deletion of the STS gene
    - reference_id: PMID:41053063
      supporting_text: HDHD1 (ΨMP-specific phosphatase)
