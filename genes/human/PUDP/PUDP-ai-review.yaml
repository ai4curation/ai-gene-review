gene_symbol: PUDP
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  PUDP (also known as HDHD1 or GS1) is a small (228 aa, about 26 kDa) Mg2+-dependent phosphatase of the
  HAD-like hydrolase superfamily (subfamily IA, Gpp1/Gpp2-like). It is encoded next to STS on Xp22.31 and
  partially escapes X inactivation. It hydrolyses pseudouridine 5'-phosphate (psi-UMP) to pseudouridine and
  inorganic phosphate with sub-micromolar Km and at least 1000-fold selectivity over other phosphate esters,
  including UMP. Pseudouridine is the most abundant modified nucleoside in RNA and is not salvaged in mammals.
  PUDP is therefore thought to clear psi-UMP released during RNA turnover, so that it is excreted as free
  pseudouridine and not phosphorylated into the nucleotide pool. The enzyme is soluble and was first
  purified from erythrocytes. Cells from X-linked ichthyosis patients carrying STS-PUDP co-deletions lose
  most of the activity. In vitro the enzyme also dephosphorylates 2-deoxyglucose-6-phosphate, and
  overexpressing it confers 2-deoxyglucose resistance in cultured cells.
