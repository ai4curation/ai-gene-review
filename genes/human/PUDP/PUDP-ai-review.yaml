  review:
    summary: Reactome places the HDHD1:Mg2+ dephosphorylation of psi-UMP in the cytosol. The enzyme was first
      detected and partially purified from human erythrocytes.
    action: ACCEPT
    reason: PUDP is a small soluble HAD phosphatase with no signal peptide, transmembrane segment or organelle
      targeting feature in UniProt. Its native activity was measured in erythrocyte and lymphoblast extracts.
      The cytosol is the expected compartment for a nucleotide-pool housekeeping enzyme. No imaging study was
      found, so the claim rests on biochemical fractionation and curator inference, which is adequate for this
      location.
    supported_by:
    - reference_id: Reactome:R-HSA-6788295
      supporting_text: Pseudouridine 5'-phosphatase (HDHD1) is a Mg2+-dependent enzyme present in erythrocytes
        that can dephosphorylate PURIDP to pseudouridine (PURID)
    - reference_id: PMID:20722631
      supporting_text: We show that human erythrocytes contain a pseudouridine-5'-phosphatase displaying a Km
        ≤ 1 μM for its substrate.
