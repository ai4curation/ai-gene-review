core_functions:
- description: Mg2+-dependent hydrolysis of pseudouridine 5'-phosphate to pseudouridine and phosphate in
    the cytosol, which clears a modified nucleotide released by RNA turnover so that pseudouridine is
    excreted and not recycled into the nucleotide pool. This is experimentally established for human PUDP by
    recombinant enzyme kinetics and by loss of activity in patient cells. Within the unikont PTHR18901 clade
    (node PTN000431252) the function is inherited by phylogeny.
  molecular_function:
    id: GO:1990738
    label: pseudouridine 5'-phosphatase activity
  directly_involved_in:
  - id: GO:0009222
    label: pyrimidine ribonucleotide catabolic process
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:20722631
    supporting_text: Purified human recombinant HDHD1 dephosphorylated pseudouridine 5'-phosphate with a
      kcat of 1.6 s-1, a Km of 0.3 μM and a catalytic efficiency at least 1000-fold higher than that on
      which it acted on other phosphate esters, including 5'-UMP.
  - reference_id: file:DROME/CG5565/CG5565-bioinformatics/RESULTS-rereview.md
    supporting_text: Human PUDP (HGNC:16818) descends from the same PTN000431252 node
suggested_questions:
- question: What is the physiological source of free pseudouridine 5'-phosphate in human cells? Is it RNA
    degradation by 5'-mononucleotide-releasing nucleases, or something else? Does loss of PUDP raise psi-UMP
    enough for it to be phosphorylated and misincorporated into RNA?
- question: Is the in vitro 2-deoxyglucose-6-phosphate phosphatase activity of PUDP large enough at
    endogenous expression levels to affect tumour responses to 2-deoxyglucose?
- question: Does the paralog from the Catarrhini-specific duplication (PTN004500568) keep pseudouridine
    5'-phosphatase activity, or does SF43 versus SF38 mark a functional split?
suggested_experiments:
- description: Do targeted metabolomics of psi-UMP, pseudouridine and psi-containing RNA in PUDP-knockout
    human cells and in XLI patient cells with STS-PUDP co-deletion, to test whether psi-UMP accumulates
    and whether pseudouridine excretion falls.
  experiment_type: metabolomics
- description: Mutate the predicted catalytic Asp14 and Asp16 and solve substrate-bound structures, to
    confirm the HAD catalytic mechanism and identify the cap-domain residues that give the 1000-fold
    preference for psi-UMP over UMP.
  experiment_type: site-directed mutagenesis and crystallography
