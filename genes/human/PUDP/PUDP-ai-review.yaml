- term:
    id: GO:0009222
    label: pyrimidine ribonucleotide catabolic process
  evidence_type: IDA
  original_reference_id: PMID:20722631
  review:
    summary: PUDP catalyses the step that breaks down the pyrimidine ribonucleotide psi-UMP to the nucleoside
      pseudouridine, which mammals do not salvage and excrete in urine.
    action: NEW
    reason: >-
      Participation test: PUDP itself catalyses the dephosphorylation of psi-UMP (IDA, with kinetics), so it
      performs a step of psi-UMP breakdown rather than being required for it or acted on by it. Comparator
      check: the cytosolic pyrimidine 5'-nucleotidase NT5C3A, which plays the same role on UMP and CMP,
      carries UMP and CMP catabolic process annotations from its biochemistry paper (PMID:11795870). GO has no
      psi-UMP-specific catabolic process term, so the closest correct parent is GO:0009222. Pseudouridine is a
      uracil C-glycoside ribonucleoside, so psi-UMP is a pyrimidine ribonucleotide. The physiological source of
      psi-UMP (RNA degradation) is inferred, not demonstrated, but the catabolic step itself is directly
      measured.
    supported_by:
    - reference_id: PMID:20722631
      supporting_text: In conclusion, HDHD1 is a phosphatase specifically involved in dephosphorylation of a
        modified nucleotide present in RNA.
    - reference_id: PMID:20722631
      supporting_text: Pseudouridine, the fifth-most abundant nucleoside in RNA, is not metabolized in
        mammals, but is excreted intact in urine.
