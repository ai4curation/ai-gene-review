    summary: PAINT IBA from the eukaryote-level PTHR18901 node PTN000431251, seeded by plant GPP1/GPP2, yeast
      YKL033W-A and PUDP itself. PUDP is one of the experimental donors. Its presence in the WITH/FROM list
      shows that the gene has its own experimental grounding, not that the support is circular.
    action: MODIFY
    reason: The node placement is sound and PUDP is inside the clade, so the claim is true. It is less
      specific than the evidence allows. PUDP has directly measured, highly selective pseudouridine
      5'-phosphatase activity (IDA, PMID:20722631), and PAINT curators placed GO:1990738 at the descendant
