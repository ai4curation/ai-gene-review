      reached this GOA snapshot. Refine to GO:1990738 (is_a phosphatase activity), which the gene already
      carries. The plant glycerol-3-phosphatase IBD sits at PTN008360158 in the plant lineage and is
      deliberately not inherited by PUDP, so it is not proposed.
