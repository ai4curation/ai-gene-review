core_functions:
- description: Cytoplasmic tail of TMED9 recruits the COPI coat (coatomer) to ERGIC and cis-Golgi membranes,
    supporting COPI vesicle formation and retrograde recycling, and thereby maintaining ERGIC and Golgi
    architecture.
  directly_involved_in:
  - id: GO:0048205
    label: COPI coating of Golgi vesicle
  - id: GO:0007030
    label: Golgi organization
  locations:
  - id: GO:0033116
    label: endoplasmic reticulum-Golgi intermediate compartment membrane
  - id: GO:0000139
    label: Golgi membrane
  - id: GO:0005789
    label: endoplasmic reticulum membrane
  supported_by:
  - reference_id: PMID:18287528
    supporting_text: Silencing of Surf4/ERGIC-53 or p25 resulted in partial redistribution of coat protein
      (COP) I but not Golgi matrix proteins to the cytosol
  - reference_id: PMID:18287528
    supporting_text: Surf4, ERGIC-53, and p25 contain such a dilysine signal that is functional in all
      three proteins
  - reference_id: PMID:12237308
    supporting_text: individual members exist as dimers and monomers and that the ratio between these
      two forms depends on both the organelle investigated and the p24 protein
- description: Acts as a cargo receptor in early secretory pathway vesicles, retaining or sorting selected
    cargo (PTPN2 TC48 isoform in the ER; misfolded MUC1-fs trapped in TMED9-containing vesicles).
  directly_involved_in:
  - id: GO:0006886
    label: intracellular protein transport
  locations:
  - id: GO:0030663
    label: COPI-coated vesicle membrane
  supported_by:
  - reference_id: PMID:31348885
    supporting_text: MUC1-fs is trapped in TMED9 cargo receptor-containing vesicles of the early secretory
      pathway
  - reference_id: PMID:31348885
    supporting_text: BRD4780 binds TMED9, releases MUC1-fs, and re-routes it for lysosomal degradation,
      an effect phenocopied by TMED9 deletion
  - reference_id: PMID:16595549
    supporting_text: Coexpression with p25 enhanced ER localization of TC48
suggested_questions:
- question: What lumenal features of misfolded MUC1-fs (and other cargo) are recognized by the TMED9 GOLD
    domain, and does the same site mediate normal cargo selection?
- question: Is TMED9 COPI-recruiting activity dependent on hetero-oligomerization with TMED2/TMED10, or
    can TMED9 dimers act alone?
suggested_experiments:
- description: Map TMED9 GOLD-domain residues required for MUC1-fs capture using structure-guided mutants
    in TMED9-knockout kidney epithelial cells, assaying MUC1-fs retention versus lysosomal clearance.
- description: Surface biotinylation and immunofluorescence of endogenous TMED9 versus a KKXX-mutant in
    polarized epithelial cells to quantify any physiological surface pool.
