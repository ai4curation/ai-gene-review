id: Q9BVK6
gene_symbol: TMED9
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: TMED9 (p24alpha2, also called p25 or GP25L2) is a member of the p24/EMP24/GP25L family of
  type I transmembrane proteins. It has a lumenal GOLD domain, a coiled-coil region, a single transmembrane
  helix and a short cytoplasmic tail carrying a KKXX dilysine COPI-binding signal and COPII-binding residues.
  TMED9 cycles between the endoplasmic reticulum, the ER-Golgi intermediate compartment (ERGIC) and the
  cis-Golgi, where it exists as monomers and homodimers and forms hetero-oligomers with other p24 proteins
  such as TMED2 and TMED10. Through its cytoplasmic tail it promotes recruitment of the COPI coat to ERGIC
  and cis-Golgi membranes, which is needed to keep the ERGIC and Golgi ribbon intact, and it functions
  as a cargo receptor in the early secretory pathway; for example it retains the ER isoform of PTPN2 and
  captures misfolded frameshift MUC1 in early secretory vesicles in MUC1 kidney disease. TMED9 is an intracellular
  membrane protein and is not normally found at the plasma membrane; it reaches the cell surface only
  when its dilysine retrieval signal is mutated.
