id: Q16762
gene_symbol: TST
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: TST encodes the mitochondrial rhodanese, a thiosulfate-cyanide
  sulfurtransferase that transfers sulfur from thiosulfate to hydrogen cyanide to form
  thiocyanate and sulfite. TST is the dedicated human rhodanese paralog in PTHR11364
  and, after folding and mitochondrial import, acts in the matrix; nascent cytosolic TST
  also moonlights as a 5S rRNA-binding import factor with MRPL18.
