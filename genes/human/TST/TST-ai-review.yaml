      cause: LABEL_WITHOUT_DEFINITION
      confidence: CONFIRMED
      explanation: The 2003 PINC row on TST asserts cyanate catabolic process from the
        TST cDNA/rhodanese-activity paper. That paper supports GO:0004792
        thiosulfate-cyanide sulfurtransferase activity rather than catabolism of
        cyanate.
      supported_by:
      - reference_id: PMID:9070219
        supporting_text: thiosulfate; cyanide sulfurtransferase, EC 2.8.1.1
    supported_by:
    - reference_id: PMID:9070219
      supporting_text: thiosulfate; cyanide sulfurtransferase, EC 2.8.1.1
- term:
    id: GO:0009636
    label: response to toxic substance
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  supporting_entities:
  - ARBA:ARBA00026669
  review:
    summary: Broad toxic-response term is entailed by the more specific cyanide
      detoxification row.
    action: TOO_GENERAL
    reason: 'TST is the main cyanide-detoxifying rhodanese: human TST overexpression increased
      exogenous KCN degradation and reduced endogenous cyanide, while TST knockdown had the
      reciprocal effect. GO:0009636 is an ancestor of the accepted GO:0070458 cellular
      detoxification of nitrogen compound row, so the broad parent adds no information.'
    supported_by:
    - reference_id: PMID:40033006
      supporting_text: Overexpression of human rhodanese (OE-TST) or its downregulation
        (shTST) in HepG2 cells resulted in the reduction or accumulation, respectively,
        of endogenous cyanide
