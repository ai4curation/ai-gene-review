- term:
    id: GO:0009440
    label: cyanate catabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  supporting_entities:
  - ARBA:ARBA00092626
  review:
    summary: Cyanate catabolism is a cyanide/cyanate term error.
    action: REMOVE
    reason: ARBA has propagated cyanate catabolic process to TST, but the TST reaction
      is thiosulfate-dependent cyanide conversion to thiocyanate. Cyanate is OCN- and is
      not the same substrate as cyanide/HCN.
    source_defects:
    - defect_type: WRONG_TERM
      resource: UNIPROT
      slot: GO_ID
      requested_change: DELETE_ROW
      asserted_value: GO:0009440
      cause: LABEL_WITHOUT_DEFINITION
      confidence: CONFIRMED
      explanation: ARBA:ARBA00092626 assigns cyanate catabolic process to TST, but TST
        is a thiosulfate-cyanide sulfurtransferase. Cyanate catabolism should not be
        asserted from the rhodanese signature.
      supported_by:
      - reference_id: file:genes/human/TST/TST-notes.md
        supporting_text: neither source establishes catabolism of OCN- cyanate by TST
    supported_by:
    - reference_id: file:genes/human/TST/TST-notes.md
      supporting_text: Cyanate is not cyanide.
