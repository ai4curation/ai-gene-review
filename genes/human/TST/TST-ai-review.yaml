- term:
    id: GO:0035928
    label: rRNA import into mitochondrion
  evidence_type: IMP
  original_reference_id: PMID:20663881
  qualifier: involved_in
  review:
    summary: TST/rhodanese contributes to 5S rRNA import into mitochondria.
    action: KEEP_AS_NON_CORE
    reason: Silencing TST/rhodanese proportionally decreased 5S rRNA import into
