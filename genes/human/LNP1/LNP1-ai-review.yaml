    supporting_text: Probabilities above 75% indicate highly confident localizations (Class I sites).
    reference_section_type: RESULTS
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed/cache and official supplement verified; the exact A1A4G5 row is retained
