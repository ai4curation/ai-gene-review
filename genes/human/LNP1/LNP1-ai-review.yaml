knowledge_gaps:
- gap_statement: >-
    The normal physiological process and cellular phenotype controlled by wild-type
    LNP1 are unknown.
  boundary: >-
    LNP1 is a protein-level-supported 178-residue human gene product, but its reviewed
    UniProt record has no FUNCTION statement, no curated pathway, and no PAN-GO
    annotation; the defensible evidence currently stops at physical associations and
    provisional antibody localization.
  gap_kind:
  - BIOLOGY
  dark_aspect: WHOLLY_DARK
  status: OPEN
  significance: >-
    Without a causal phenotype or process, even reproducible interaction partners
    cannot be interpreted as the gene product's biological role.
  resolution: >-
    Identify a reproducible loss-of-function phenotype in an endogenously expressing
    human model and rescue it with wild-type LNP1 while mapping the responsible
    molecular interaction.
  provenance:
  - reference_id: file:human/LNP1/LNP1-uniprot.txt
    supporting_text: DR   PAN-GO; A1A4G5; 0 GO annotations based on evolutionary models.
- gap_statement: >-
    It is unknown whether LNP1 binds 14-3-3 proteins directly, which phosphosite
    controls the association, and what the association does in cells.
  boundary: >-
    BioPlex repeatedly recovers LNP1 with six human 14-3-3 paralogs in two cell lines,
    and hu.MAP3.0 integrates overlapping proteomic evidence into a
    phosphoserine-dependent LNP1-YWHAE model. Current-sequence inspection exposes an
    unresolved Ser112-versus-Ser114 discrepancy in the published motif description.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: NARROWING
  significance: >-
    Resolving this would distinguish a regulated interaction module from repeated
    co-complex recovery and could provide the first mechanistic handle on LNP1.
  resolution: >-
    Use site-resolved phosphoproteomics, S112A/S114A mutants, phosphatase treatment,
    reciprocal endogenous co-immunoprecipitation, and purified binding assays across
    representative 14-3-3 paralogs.
  provenance:
  - reference_id: file:human/LNP1/LNP1-bioinformatics/RESULTS.md
    supporting_text: >-
      IntAct classifies the BioPlex LNP1-14-3-3 records as MI:0007 anti tag
      coimmunoprecipitation, MI:0914 association, and MI:1060 spoke expansion rather
      than direct binary binding.
  - reference_id: PMID:40425816
    supporting_text: >-
      We also identify LNP1, an uncharacterized protein, as associated with members of
      the 14-3-3 complex (huMAP3_06971.1).
- gap_statement: >-
    The physiological significance of the LNP1-LYN interaction and whether LYN
    phosphorylates LNP1 are unknown.
  boundary: >-
    A LYN affinity-capture screen followed by targeted Western validation supports
    physical association, but no endogenous context, catalytic consequence, or
    downstream pathway has been established for LNP1.
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  status: OPEN
  significance: >-
    LYN could connect LNP1 to a defined signaling context, but merely binding a kinase
    does not show that LNP1 is its substrate or pathway component.
  resolution: >-
    Reproduce the interaction at endogenous abundance, test direct binding and
    phosphorylation with purified proteins and kinase-dead LYN, and measure the
    consequence of disrupting the interaction in a relevant human cell type.
  provenance:
  - reference_id: file:human/LNP1/LNP1-bioinformatics/RESULTS.md
    supporting_text: >-
      BioGRID maps the validated PLATO pair to LYN/P07948 and LNP1/A1A4G5 and
      classifies interaction 868526 as Affinity Capture-Western.
- gap_statement: >-
    The endogenous subcellular localization and trafficking behavior of LNP1 are
    unresolved.
  boundary: >-
    Human Protein Atlas imaging with one approved antibody reports vesicles in two
    cell lines and cytosolic plus nuclear-speck signal in only one, while UniProt has
    no curated SUBCELLULAR LOCATION statement.
  gap_kind:
  - BIOLOGY
  dark_aspect: CC_DARK
  status: OPEN
  significance: >-
    A validated compartment is required to judge which reported partners can meet
    LNP1 physiologically and to choose an appropriate model for functional studies.
  resolution: >-
    Endogenously tag LNP1 in multiple expressing human cell types and combine
    knockout-controlled imaging with biochemical fractionation and organelle-marker
    colocalization.
  provenance:
  - reference_id: file:human/LNP1/LNP1-bioinformatics/RESULTS.md
    supporting_text: >-
      Human Protein Atlas antibody HPA047926 has Approved reliability and reports
      vesicles in PC-3 and U2OS, with nuclear-speck and cytosolic signal only in PC-3.
core_functions: []
proposed_new_terms: []
suggested_questions:
- question: >-
    Does endogenous LNP1 bind multiple 14-3-3 paralogs directly, and is the
    interaction phosphoserine-dependent?
- question: >-
    Is Ser112 or Ser114 the relevant LNP1 phosphosite, and which kinase installs it?
- question: >-
    Is the LNP1-LYN interaction reproducible at endogenous abundance, and does LYN
    phosphorylate or regulate LNP1?
- question: >-
    Where does endogenous LNP1 localize, and is its vesicular distribution conserved
    across cell types?
- question: >-
    What normal cellular phenotype follows LNP1 loss, independently of NUP98::LNP1
    fusion biology?
suggested_experiments:
- hypothesis: >-
    LNP1 is a phosphoserine-dependent 14-3-3 ligand whose association is controlled by
    one of the adjacent Ser112/Ser114 residues.
  description: >-
    Endogenously tag LNP1, compare reciprocal 14-3-3 co-immunoprecipitation before and
    after phosphatase treatment, map the site by targeted mass spectrometry, and test
    S112A, S114A, and double-mutant rescue constructs in purified and cellular binding
    assays.
  experiment_type: interaction biochemistry and phosphoproteomics
- hypothesis: >-
    LYN binds LNP1 directly and regulates it through phosphorylation.
  description: >-
    Re-test the interaction by reciprocal endogenous co-immunoprecipitation and
    purified-protein binding, then compare wild-type and kinase-dead LYN in kinase
    assays and quantitative LNP1 phosphoproteomics.
  experiment_type: kinase and interaction assays
- hypothesis: >-
    Wild-type LNP1 is a vesicle-associated protein in a restricted set of human cell
    types.
  description: >-
    Introduce a minimally disruptive endogenous tag in PC-3, U-2 OS, and additional
    LNP1-expressing models, and combine knockout-controlled microscopy, organelle-marker
    colocalization, live imaging, and biochemical fractionation.
  experiment_type: endogenous localization and trafficking
- hypothesis: >-
    LNP1 loss produces a measurable phenotype that depends on its reported interaction
    module.
  description: >-
    Perform CRISPR knockout with wild-type and interaction-defective rescue in
    retina- and testis-relevant human models, using unbiased transcriptomic, proteomic,
    trafficking, proliferation, and stress-response readouts to discover a causal
    process.
  experiment_type: genome editing and multi-omics phenotyping
- hypothesis: >-
    The LNP1 segment contributes a fusion-specific property to NUP98::LNP1 that is not
    shared by wild-type LNP1.
  description: >-
    Compare wild-type LNP1, full NUP98::LNP1, and matched fusion constructs lacking or
    mutating the LNP1 segment for puncta formation, chromatin occupancy, transcriptional
    effects, and hematopoietic transformation.
  experiment_type: fusion-domain dissection
