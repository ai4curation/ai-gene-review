id: A1A4G5
gene_symbol: LNP1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  LNP1 (leukemia NUP98 fusion partner 1) is a small, highly charged and partly
  disordered human protein whose normal physiological role is not established.
  Interaction studies associate LNP1 with the LYN tyrosine kinase and repeatedly
  recover it with multiple 14-3-3 paralogs, consistent with a possible
  phosphoregulated interaction module, but the direct mechanism and cellular
  consequences remain unknown. Limited antibody imaging reports mainly vesicular
  staining with cell-line-dependent cytosolic and nuclear-speck signal. Chromosomal
  rearrangements can fuse LNP1 to NUP98 in rare leukemias; puncta formation and
  transforming activity demonstrated for NUP98::LNP1 are properties of the chimeric
  oncoprotein and do not establish a function for wild-type LNP1.
