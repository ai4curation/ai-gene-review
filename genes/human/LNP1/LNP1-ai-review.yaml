- id: file:human/LNP1/LNP1-bioinformatics/RESULTS.md
  title: Reproducible LNP1 interaction and localization provenance audit
  findings:
  - statement: >-
      Exact BioPlex source rows preserve accession-level YWHAB and YWHAE protein-group
      assignments.
    supporting_text: >-
      Official BioPlex source rows identify P31946-2, not canonical P31946, as the
      YWHAB protein-group accession in both 293T and HCT116 LNP1 experiments.
  - statement: >-
      Raw 293T output contains canonical and isoform-2 YWHAE protein-group rows.
    supporting_text: >-
      Official BioPlex source output contains both P62258 and P62258-2 YWHAE
      protein-group rows in 293T cells, while HCT116 contains P62258.
  - statement: >-
      The official phosphoproteome supplement records the mapped LNP1 Ser114 site.
    supporting_text: >-
      Official PMID:31819260 Supplementary Table S2 records A1A4G5 Ser114 with
      localization probability 0.844585 and two spectral counts.
  - statement: >-
      BioPlex interaction records are AP-MS associations rather than direct binary
      binding assays.
    supporting_text: >-
      IntAct classifies the BioPlex LNP1-14-3-3 records as MI:0007 anti tag
      coimmunoprecipitation, MI:0914 association, and MI:1060 spoke expansion rather
      than direct binary binding.
  - statement: >-
      The targeted PLATO validation resolves specifically to LYN and LNP1.
    supporting_text: >-
      BioGRID maps the validated PLATO pair to LYN/P07948 and LNP1/A1A4G5 and
      classifies interaction 868526 as Affinity Capture-Western.
  - statement: >-
      HPA localization is based on one Approved antibody and varies by cell line.
    supporting_text: >-
      Human Protein Atlas antibody HPA047926 has Approved reliability and reports
      vesicles in PC-3 and U2OS, with nuclear-speck and cytosolic signal only in PC-3.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Reproducible standard-library audit of official BioPlex, IntAct, BioGRID, HuRI,
      hu.MAP3, Complex Portal, UniProt, HPA, and publication-supplement records. It
      distinguishes exact source protein-group accessions and binary validation from AP-MS
      co-association, predicted-complex membership, and isolated crosslinks.
- id: PMID:33961781
  title: Dual proteome-scale networks reveal cell-specific remodeling of the human interactome.
  findings:
  - statement: >-
      BioPlex 3.0 used human-cell AP-MS; official BioPlex and IntAct records identify
      LNP1 association with six 14-3-3 paralogs in both source networks.
    supporting_text: >-
      In contrast, affinity-purification mass spectrometry (AP-MS) enables enrichment
      and detection of even low-abundance proteins, though exogenous expression of
      tagged baits is required, and extensive sample preparation has limited
      scalability while precluding recovery of transient interactions ( Gingras et
      al., 2007 ).
    reference_section_type: INTRODUCTION
  - statement: The two source networks were generated in 293T and HCT116 cells.
    supporting_text: >-
      Second, performing AP-MS in 293T and HCT116 cells has enabled comparison of two
      context-specific, proteome-scale interaction networks.
    reference_section_type: DISCUSSION
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed/cache verified. LNP1 is not named in article prose; pair-level mappings
      were verified in official BioPlex and IntAct records. All six 14-3-3 family
      members recur in both cell lines. Anti-tag co-immunoprecipitation/AP-MS supports
      association, not purified direct binding or a stable stoichiometric complex.
- id: PMID:23503679
  title: Protein interaction discovery using parallel analysis of translated ORFs (PLATO).
  findings:
  - statement: >-
      Figure 2c identifies LNP1 among candidates validated by GST-LYN affinity
      precipitation and anti-tag Western blotting.
    supporting_text: >-
      GSTLYN precipitation and western blot analysis confirmed binding for five of
      seven novel candidates tested (Figure 2c).
    reference_section_type: RESULTS
  - statement: >-
      The discovery screen used GST-LYN against a human ORFeome with GST controls.
    supporting_text: >-
      After affinity enrichment of the human ORFeome using as bait GSTLYN, GST alone,
      or an irrelevant GST-fused protein (GST-Muted), we performed Illumina sequencing
      to identify proteins specifically precipitated with GST-LYN (Figure 2a,
      Supplementary Figure 3a).
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed/cache and Figure 2 verified. Panel 2c labels LNP1 and shows a GST-LYN
      pulldown band with no GST-Pep control band. Validation used lysates of HEK293T
      cells transiently overexpressing tagged candidates and bacterially produced
      GST-LYN; it establishes physical binding in this assay, not LYN-dependent
      phosphorylation or a physiological pathway.
- id: PMID:40425816
  title: 'hu.MAP3.0: atlas of human protein complexes by integration of >25,000 proteomic experiments.'
  findings:
  - statement: hu.MAP3.0 places LNP1 with multiple 14-3-3 proteins.
    supporting_text: >-
      We also identify LNP1, an uncharacterized protein, as associated with members of
      the 14-3-3 complex (huMAP3_06971.1).
    reference_section_type: RESULTS
  - statement: >-
      The authors connect the association to a reported phosphoserine and candidate
      14-3-3 motif.
    supporting_text: >-
      LNP1 has a known phosphoserine site at Ser114 (Ochoa et al, 2020) in a motif
      reminiscent of 14-3-3 binding (KFpSESF vs RXY/FXpSXP (Yaffe et al, 1997)).
    reference_section_type: RESULTS
  - statement: >-
      AlphaFold3 modeling provides computational corroboration for LNP1-YWHAE
      association.
    supporting_text: This provides further evidence of LNP1’s association with the 14-3-3 complex.
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The paper directly discusses A1A4G5/LNP1, but hu.MAP3.0 combines data integration
      and AlphaFold3 and frames these results as testable hypotheses. It does not
      establish one stable 28-member complex. Current residues 110-115 are KFSESF: the
      paper says Ser114 but writes KFpSESF, which places the phosphate on Ser112, so
      the site-specific mechanism remains unresolved.
