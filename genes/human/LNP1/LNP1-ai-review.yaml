- id: PMID:34903620
  title: Phase Separation Mediates NUP98 Fusion Oncoprotein Leukemic Transformation.
  findings:
  - statement: >-
      NUP98-LNP1 fusion constructs form nuclear puncta and transform hematopoietic
      cells.
    supporting_text: >-
      We also show that three additional leukemia-associated NUP98 FOs (NUP98-PRRX1,
      NUP98-KDM5A, and NUP98-LNP1) form nuclear puncta and transform hematopoietic
      cells.
    reference_section_type: ABSTRACT
  - statement: >-
      The NUP98-LNP1 result included mouse lineage-negative hematopoietic
      stem/progenitor-cell transformation and induced myeloid differentiation.
    supporting_text: >-
      Three additional NUP98 FOs, NUP98–PRRX1, NUP98–KDM5A, and NUP98–LNP1, also form
