- id: PMID:32296183
  title: A reference map of the human binary protein interactome.
  findings:
  - statement: >-
      HuRI reports a binary LNP1-GPRIN2 interaction, but its cellular function remains
      undetermined.
    supporting_text: >-
      While HuRI displays highly significant overlap with known functional
      relationships, the cellular function of most individual PPIs remains to be
      elucidated.
    reference_section_type: DISCUSSION
  - statement: The one-isoform-per-gene design limits isoform-specific interpretation.
    supporting_text: >-
      Screening only one isoform per gene also misses interaction partners specific to
      alternative spliceforms50.
    reference_section_type: DISCUSSION
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Official HuRI supplements resolve CCSB ORF ID 6830 to human GPRIN2/O60269 and
      LNP1 to ORF 54500. The three IntAct rows are assay representations of one binary
      LNP1-GPRIN2 interaction, not three partners or self-binding. No physiological
      context is established, so no generic binding or process annotation is proposed.
