      interactions in intact human nuclei.
    reference_section_type: ABSTRACT
  - statement: >-
      The authors caution that novel XL-MS interactions can be nonspecific and
      difficult to validate.
    supporting_text: >-
      The major challenge is represented by the ability to identify and filter out
      nonspecific interactions and by challenges in validating novel observed PPIs.
    reference_section_type: DISCUSSION
  reference_review:
    relevance: LOW
    correctness: VERIFIED
