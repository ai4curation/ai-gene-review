id: P17535
gene_symbol: JUND
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'JUND encodes JunD, a nuclear Jun-family bZIP AP-1 transcription factor that binds AP-1 cis-regulatory sites
  as a heterodimer with FOS-family and other bZIP partners. A conserved N-terminal menin-binding motif recruits MEN1, which
  directly binds JunD and represses JunD-driven transcription while MAPK8/MAPK10 phosphorylation and FOS-family dimerization
  tune JunD AP-1 activity.'
existing_annotations:
- term:
    id: GO:0000122
    label: negative regulation of transcription by RNA polymerase II
  evidence_type: IDA
  original_reference_id: PMID:22327296
  qualifier: involved_in
  review:
    summary: negative regulation of transcription by RNA polymerase II is a supported MEN1-dependent JUND output.
    action: KEEP_AS_NON_CORE
    reason: MEN1 binding can inhibit JUND phosphorylation and suppress JUND-induced transcription, so this row is kept
      as a context-specific repressive AP-1 output rather than as the dominant Jun-family activation function.
    supported_by:
    - reference_id: PMID:22327296
      supporting_text: The menin-JUND interaction blocks JUN N-terminal kinase (JNK)-mediated JUND phosphorylation and
        suppresses JUND-induced transcription
- term:
    id: GO:0000785
    label: chromatin
  evidence_type: ISA
  original_reference_id: GO_REF:0000113
  qualifier: located_in
  supporting_entities:
  - tfclass:1.1.1
  review:
    summary: chromatin is consistent with the nuclear chromatin-associated AP-1 DNA-binding mechanism.
    action: ACCEPT
    reason: This TFClass ISA row places class 1.1.1 sequence-specific Jun bZIP factors on chromatin; that
      inference is consistent with JunD acting as a nuclear AP-1 factor rather than with a separate non-core
      location.
