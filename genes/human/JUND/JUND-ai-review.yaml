core_functions:
- description: JUND is a Jun-family AP-1 bZIP subunit that binds AP-1 cis-regulatory DNA, usually as a FOS-family
    heterodimer, and regulates RNA polymerase II transcription with weaker, context-dependent activation that is
    restrained by MEN1 binding.
