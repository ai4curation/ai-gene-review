suggested_questions:
- question: Which JUND-dependent stress, cytokine, steroid or developmental transcriptional programs are driven by
    direct AP-1 promoter occupancy rather than secondary transcriptional cascades?
suggested_experiments:
- description: Combine endogenous JUND perturbation/rescue with CUT&RUN or ChIP-seq and nascent RNA profiling in a
    stimulus-matched human cell type to distinguish direct AP-1 target genes from downstream pathway responses.
