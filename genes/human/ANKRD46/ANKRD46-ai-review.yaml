description: ANKRD46 (ankyrin repeat domain-containing 46) is a small uncharacterized protein of 228 residues,
  with four N-terminal ankyrin repeats and a single predicted C-terminal transmembrane helix, and endogenously
  tagged ANKRD46 localizes prominently to the endoplasmic reticulum, consistent with a tail-anchored ER
  membrane protein. It is a validated target of miR-21, whose inhibition raises ANKRD46 levels. No molecular
  activity or biological role has been established.
