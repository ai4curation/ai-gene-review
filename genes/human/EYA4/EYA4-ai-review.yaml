core_functions:
- description: Hydrolyzes protein phosphotyrosine through its C-terminal catalytic domain. Purified human
    EYA4 residues 367–639 dephosphorylate PLK1-pY425, PLK1-pY445 and H2AX-pY142 peptides. Human cellular
    experiments connect EYA4 to PLK1 activation at the G2 centrosomal pool; independent imaging supports
    a nucleoplasmic pool. The positive DNA-repair-regulation facet is a conserved phylogenetic inference
    corroborated by H2AX substrate chemistry, not an EYA4-specific cellular repair assay. Domain activity
    and antibody localization do not establish equivalent function for all five natural products.
