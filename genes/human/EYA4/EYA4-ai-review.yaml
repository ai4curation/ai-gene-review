  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PMID/DOI/title verified against actual Europe PMC metadata and original XML (Nature
      Communications 2024, DOI 10.1038/s41467-024-45683-4). Selected operative main Methods, Results and
