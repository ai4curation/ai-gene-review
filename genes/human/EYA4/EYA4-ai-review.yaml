suggested_experiments:
- hypothesis: EYA4-dependent H2AX phosphotyrosine removal may provide a cellular repair-regulatory mechanism,
    but isolated-domain activity need not predict its contribution in nuclei.
  description: Compare EYA4 depletion with rescue by sequence-verified full-length wild-type and catalytic-site
    mutant EYA4 at matched expression. Measure H2AX-pY142 loss, damage-site recruitment and repair/survival
    kinetics after a defined DNA-damage challenge. Include EYA1 perturbation separately to distinguish
    paralog contributions and quantify EYA4 nuclear abundance rather than assuming it from antibody staining.
  experiment_type: Cellular substrate attribution and repair outcome analysis
- hypothesis: Sequence differences among natural EYA4 products may alter catalytic capacity, abundance
    or localization, independently of their shared antibody epitopes.
  description: Identify endogenous products using transcript junctions and product-discriminating peptides,
    then compare sequence-verified full-length proteins in phosphotyrosine assays and matched-expression
    localization experiments. Use independent endogenous tags or antibodies with mapped epitopes to distinguish
    nuclear and centrosomal pools. Include PLK1 and H2AX substrates and do not equate the isolated 367–639
    domain with every full-length product.
  experiment_type: Product-resolved biochemical and localization comparison
- hypothesis: EYA4 promotes PLK1 activation partly through pY445 turnover, but the size and timing of
    the endogenous contribution remain uncertain.
  description: Quantify endogenous PLK1-pY445 with isotope-labeled phosphopeptide standards across synchronized
    G2 and mitotic entry after EYA4 depletion and wild-type or catalytic mutant rescue. Measure PLK1-pT210
    and selected PLK1 substrate phosphorylation in parallel, controlling for total PLK1 abundance and
    cell-cycle composition. Treat Y445F as a functional perturbation rather than a direct measurement
    of physiological phosphosite occupancy, and distinguish EYA4 perturbation from pan-EYA inhibition.
