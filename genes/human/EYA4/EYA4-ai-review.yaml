    summary: The original TAS support for visual-stimulus processing remains unverified.
    reason: The accessible PMID:9887327 abstract establishes EYA4 characterization and reports predominantly
      craniofacial, dermamyotome and limb expression in mouse embryos, with no pathogenic EYA4 variant
