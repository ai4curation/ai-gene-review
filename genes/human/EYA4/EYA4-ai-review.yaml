gene_symbol: EYA4
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: EYA4 is a transcriptional coactivator and aspartate-based protein tyrosine phosphatase of
  the eyes-absent family. Its N-terminal transactivation region cooperates with SIX-family transcription
  factors, including SIX3, which recruits EYA4 to the nucleus and promotes target-gene expression. Its
  conserved C-terminal HAD-like catalytic domain hydrolyzes protein phosphotyrosine. In human cells, EYA4
  associates with PLK1 at G2 centrosomes and promotes PLK1 activation and successful mitosis. EYA4 also
  occupies the nucleoplasm, and its H2AX-directed phosphatase activity supports an evolutionarily conserved
  role in DNA-repair regulation. EYA4 contributes to sensory-system development and maintenance; pathogenic
  variants cause autosomal dominant sensorineural hearing loss, sometimes with dilated cardiomyopathy.
  Alternative splicing generates distinct isoforms, and expression is enriched in heart and skeletal muscle.
