core_functions:
- description: Hydrolyzes protein phosphotyrosine through its C-terminal catalytic domain. Purified human
    EYA4 residues 367–639 dephosphorylate PLK1-pY425, PLK1-pY445 and H2AX-pY142 peptides. In human cells,
    EYA4 supplies the phosphatase step that promotes PLK1 activation at the G2 centrosomal pool, supporting
    centrosome organization and mitotic progression. The DNA-repair facet is a conserved phylogenetic
    inference corroborated by H2AX substrate chemistry and remains distinct from a direct EYA4-specific
    cellular repair assay. Domain assays and antibody localization do not resolve the activity of individual
    full-length isoforms.
