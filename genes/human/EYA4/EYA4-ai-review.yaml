id: O95677
gene_symbol: EYA4
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: EYA4 is an eyes-absent family protein with a C-terminal protein tyrosine phosphatase domain.
  Its catalytic domain dephosphorylates phosphotyrosine peptides from PLK1 and histone H2AX. In human
  cells, EYA4 associates with PLK1 during G2 and promotes PLK1 activation, linking its phosphatase activity
  to centrosomal and mitotic regulation. EYA4 also has a nucleoplasmic pool. A conserved role in positive
  regulation of DNA repair is consistent with its H2AX-directed biochemical activity, although EYA4-specific
  cellular repair mechanisms remain unresolved. Its developmental roles include regulation of sensory-system
  morphogenesis, with distinct middle-ear and otic phenotypes in mouse and zebrafish. Five natural human
  products differ in sequence; their activities and compartment distributions have not been established
  individually.
