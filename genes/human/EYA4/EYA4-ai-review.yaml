- id: PMID:38360978
  title: The Eyes Absent family members EYA4 and EYA1 promote PLK1 activation and successful mitosis through
    tyrosine dephosphorylation.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PMID/DOI/title verified against actual Europe PMC metadata and original XML (Nature
      Communications 2024, DOI 10.1038/s41467-024-45683-4). Selected operative main Methods, Results and
      figure captions were read; no figure pixels or supplementary files were inspected. Purified poly-His/TVMV
      human EYA4 residues 367–639 were obtained by Ni-NTA, Fast Q and Superdex 75 and assayed on PLK1
      phosphotyrosine peptides and H2AX-pY142. The inspected enzyme Methods do not explicitly state the
      expression host. The current domain sequence occurs exactly in products 1 and 2, but this is not
      historical plasmid sequencing or evidence that all five native products share activity. Endogenous
      human HeLa G2 EYA4 centrosomal signal with PLK1 and an EYA4-siRNA comparison is distinct from HPA
      nuclear localization. Cellular genetic perturbations and orthogonal PLK1 phosphotyrosine/activation
      assays support a mitotic mechanism; the PLK1-pY445 PRM comparison alone was a nonsignificant trend.
      Pan-EYA benzarone perturbation is not treated as EYA4-specific, and the H2AX peptide control does
      not establish a cellular EYA4 DNA-repair phenotype.
  full_text_unavailable: false
- id: PMID:19234442
  title: Tyrosine dephosphorylation of H2AX modulates apoptosis and survival decisions.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Verified original identity; operative Methods/Results/captions were read in the intact
      full-body normal record, reused from the independently reviewed EYA1 packet. HA-Eya1/3 preparations
      immunopurified from irradiated 293T cells remove H2AX phosphotyrosine; human depletion and murine
      rescue remain distinct. The recombinant GST-Eya3 240–573 fragment supplies the pSer-negative comparison,
      not full-length EYA1 or EYA4. H2AX tyrosine state/repair-factor association and Eya3-specific cellular
      results support the family context. This paper does not itself test EYA4, and no supplementary/pixel
      read is claimed in this database lane.
  full_text_unavailable: false
