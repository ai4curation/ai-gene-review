suggested_questions:
- question: What regulates the exit of NRROS-proTGF-beta1 complexes from the ER to the cell surface, and
    why do disease variants impair delivery of active TGF-beta1?
- question: Does NRROS bind TGF-beta2 or TGF-beta3 prodomains in vivo, or is it specific to TGF-beta1?
suggested_experiments:
- description: Surface biotinylation and glycosidase sensitivity time courses of endogenous NRROS in human
    iPSC-derived microglia, with and without TGFB1 co-expression, to quantify ER versus surface pools
    and their dependence on complex formation.
