id: Q86YC3
gene_symbol: NRROS
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: NRROS (LRRC33) is a single-pass type I transmembrane leucine-rich repeat protein, a paralog
  of GARP (LRRC32), expressed mainly in myeloid cells and highly in brain microglia. Its extracellular
  LRR domain forms disulfide bonds with the latency-associated peptide (LAP) of proTGF-beta1, tethering
  latent TGF-beta1 to the cell surface as a "milieu molecule" from which mature TGF-beta1 is released
  by integrin alphaVbeta8 in a highly localized manner. A substantial pool of NRROS resides in the endoplasmic
  reticulum, where complexes with proTGF-beta1 form, and only a mature glycoform reaches the plasma membrane.
  NRROS-dependent TGF-beta1 activation maintains homeostatic microglia; loss-of-function variants cause
  infantile-onset seizures with neurodegeneration and brain calcification. Earlier proposals that it negatively
  regulates reactive oxygen species or directly inhibits Toll-like receptor signaling are not supported
  by knockout studies.
