- term:
    id: GO:0005372
    label: water transmembrane transporter activity
  evidence_type: IDA
  original_reference_id: PMID:14695256
  qualifier: enables
  review:
    summary: >-
      Water flux accompanies Na(+)/glucose cotransport; this study attributes the initial
      water flux largely to osmosis driven by intracellular glucose accumulation.
    action: KEEP_AS_NON_CORE
    reason: >-
      Water permeation is a genuine, repeatedly reported property of SGLT1 but is secondary to
      its core sugar-symport function; UniProt curates it as a water-channel role. The precise
      mechanism (passive channel vs. secondary osmosis) remains debated, so it is retained as a
      non-core activity.
    supported_by:
    - reference_id: file:human/SLC5A1/SLC5A1-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: >-
        Acts as a water channel enabling passive water transport across the
        plasma membrane in response to the osmotic gradient created upon sugar
        and Na(+) uptake.
