core_functions:
- description: >-
    Electrogenic, high-affinity Na(+)/D-glucose symport: coupling of the inward Na(+)
    electrochemical gradient to the active, uphill import of D-glucose across the apical
    plasma membrane, with a stoichiometry of 2 Na(+) per glucose. This is the committed apical
    uptake step for dietary glucose absorption in the intestinal enterocyte and for
    high-affinity renal glucose reabsorption in the proximal-tubule S3 segment.
