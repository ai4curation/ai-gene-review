id: P13866
gene_symbol: SLC5A1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  SLC5A1 (SGLT1) is the high-affinity, electrogenic Na(+)/glucose cotransporter of the
  SLC5 sodium:solute symporter (SSF) family. It is a 664-residue, 13-transmembrane-helix
  integral membrane protein that couples the inwardly directed electrochemical Na(+)
  gradient (maintained by the Na(+)/K(+)-ATPase) to the uphill, active import of D-glucose
  and D-galactose, with a stoichiometry of 2 Na(+) per sugar. It is the principal apical
  transporter for dietary glucose and galactose uptake in the small-intestinal enterocyte
  brush border, with basolateral exit handled by the facilitative transporter GLUT2; it also
  mediates high-affinity renal glucose reabsorption in the S3 (straight) segment of the
  proximal tubule, where it acts nonredundantly alongside the low-affinity SGLT2. It
  additionally transports the non-metabolizable glucose analog alpha-methyl-D-glucoside
  (an alpha-glucoside) that is used experimentally to assay its activity, and functions as
  a high-conductivity passive water pathway that accompanies sugar and Na(+) uptake. SGLT1
  is competitively inhibited by phlorizin. Loss-of-function mutations cause the autosomal
  recessive disorder glucose-galactose malabsorption (GGM), characterized by neonatal
  osmotic diarrhea relieved by removing glucose and galactose from the diet.
