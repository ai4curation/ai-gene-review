    label: myo-inositol:sodium symporter activity
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: enables
  supporting_entities:
  - UniProtKB:P11170
  review:
    summary: >-
      myo-inositol:sodium symporter activity transferred by similarity from rabbit SGLT1
      (P11170), reflecting broad SLC5-family substrate promiscuity rather than a characterized
      human SGLT1 function.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Human SGLT1 is characterized as a D-glucose/D-galactose (and alphaMDG) cotransporter;
      its two curated catalytic activities are for glucose and galactose only. Physiological
      Na(+)-coupled myo-inositol transport is the function of dedicated transporters SMIT1
      (SLC5A3) and SMIT2 (SLC5A11). No direct human evidence supports a myo-inositol symporter
      role for SGLT1, so this ISS transfer over-annotates the gene.
    supported_by:
