suggested_questions:
- question: >-
    What is the physiological significance, if any, of SGLT1 expression at the blood-brain
    barrier relative to the dominant GLUT1-mediated facilitative glucose transport?
- question: >-
    Is SGLT1's high passive water permeability a direct water-channel function or a secondary
    osmotic consequence of sugar/Na(+) accumulation, and how much does it contribute to
    intestinal transepithelial water transport in vivo?
suggested_experiments:
- description: >-
    Quantify SGLT1-dependent transepithelial water flux in intestinal organoids/enteroids from
    wild-type vs. SLC5A1-null donors under defined osmotic and sugar gradients to separate
    direct water permeation from secondary osmosis.
- description: >-
    Test substrate selectivity of purified human SGLT1 reconstituted in proteoliposomes against
    myo-inositol, pentoses and fucose to determine whether any of the ISS-transferred substrate
    activities are measurable for the human protein.
