suggested_questions:
  - question: Is the P3R3URF ORF translated into a stable endogenous peptide, as
      judged by targeted mass spectrometry with P3R3URF-unique peptides and by
      ribosome profiling that controls for multi-mapping reads?
  - question: Which germ-cell stage or other cell condition translates the putative
      95-aa P3R3URF microprotein, and what is its stoichiometry relative to any
      P3R3URF-PIK3R3 readthrough product?
  - question: If a P3R3URF peptide exists, does it act independently or only as
      the N-terminal extension of a P3R3URF-PIK3R3 readthrough fusion, and what
      is its subcellular localization?
  - question: Does the P3R3URF uORF regulate translation or stability of canonical
      PIK3R3 mRNA, independent of producing a peptide product?
suggested_experiments:
  - description: Targeted Ribo-seq plus translation initiation site profiling at
      the PIK3R3 locus using a pipeline such as Rp3 that controls for multi-mapping
      short reads, in tissues with high PIK3R3 expression (e.g. brain, lymphoid
      tissue).
  - description: Immunoprecipitation/mass spectrometry using antibodies or epitope
      tags specific to the P3R3URF N-terminal sequence (distinct from PIK3R3) to
      directly identify P3R3URF-unique tryptic peptides with at least two PSMs at
      <1% FDR.
  - description: CRISPR base editing or precise deletion of the P3R3URF start codon
      and/or stop codon without altering the PIK3R3 coding sequence, followed by
      quantitative measurement of PIK3R3 mRNA and protein levels and downstream
      PI3K/AKT/mTOR signaling, to distinguish uORF-mediated translational regulation
      from microprotein production.
knowledge_gaps:
  - gap_statement: P3R3URF has no established molecular function or pathway role despite
      protein-level evidence for synthesis of its 95-aa microprotein.
    boundary: The UniProt PE1 and proteomics-repository evidence support protein
      detection, not biochemical activity, localization, a direct interactor set,
      or cytokine-signaling participation. The sole GOA pathway annotation is a
      PANTHER IBA transfer from the SOCS4/SOCS5 cytokine-signaling node rather than
      a direct P3R3URF assay.
    gap_kind:
      - BIOLOGY
    dark_aspect: MF_DARK
    status: OPEN
    significance: Resolving this gap would distinguish a testis-enriched functional
      microprotein from detectable translation without a selected independent role,
      and would avoid transferring SOCS-clade cytokine-signaling functions onto a
      95-aa uORF product with no SH2 domain or SOCS box.
    resolution: Use P3R3URF-ORF-specific ribosome profiling, targeted mass spectrometry,
      endogenous tagging/interactomics, and start-codon or frameshift edits that spare
      the PIK3R3 coding sequence.
