        direct evidence places the 95-aa P3R3URF product in that SH2/SOCS-box
        cytokine-receptor branch.
      action: REMOVE
      reason: P3R3URF is an upstream-ORF microprotein with protein-detection support
        but no demonstrated localization, binding partner, perturbation phenotype,
        or signaling activity. The cytokine-signaling IBA is asserted on the
