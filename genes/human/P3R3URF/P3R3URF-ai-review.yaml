description: P3R3URF (PIK3R3 upstream open reading frame protein; UniProt A0A087WWA1,
  95 aa; HGNC:53451) is a testis-enriched microprotein encoded by an upstream
  open reading frame located on the PIK3R3 locus. UniProt treats the 95-aa product
  as a reviewed PE1 entry with MANE/CCDS support and peptide-detection repository
  cross-references, but no P3R3URF-specific biochemical activity, cellular
  localization, binding partner, or pathway role has been established. The locus
  has been hypothesized to give rise to a P3R3URF-PIK3R3 readthrough/fusion product,
  but the only directly relevant experimental study (Tidball et al. 2023, bioRxiv)
  failed to detect P3R3URF or P3R3URF-PIK3R3 transcripts by qRT-PCR in human iNeurons
  and instead favored a post-translational modification of canonical PIK3R3 as the
  explanation for a higher-molecular-weight immunoblot band. Functional annotation
  should therefore not extrapolate from canonical PIK3R3 (p55gamma) PI3K/AKT/mTOR
  biology to P3R3URF.
existing_annotations:
  - term:
      id: GO:0019221
      label: cytokine-mediated signaling pathway
    evidence_type: IBA
    original_reference_id: GO_REF:0000033
    review:
      summary: PANTHER IBA annotation to cytokine-mediated signaling pathway, propagated
        from family PTN008494619. This pathway role is plausible only by analogy
        to canonical PIK3R3 (p55gamma), which is a PI3K regulatory subunit acting
        downstream of cytokine receptors. There is no direct experimental evidence
        that P3R3URF itself participates in cytokine signaling; focused reviews
        found no demonstrated biochemical, localization, interactor, perturbation,
        or cytokine-signaling evidence for the uORF product.
      action: REMOVE
      reason: P3R3URF is an upstream-ORF microprotein with protein-detection support
        but no demonstrated localization, binding partner, perturbation phenotype,
        or signaling activity. The IBA propagation appears to conflate P3R3URF
        with canonical PIK3R3 biology. Pathway conclusions from the only relevant
        experimental study should be attributed to PIK3R3, not P3R3URF.
      propagation_review:
        root_cause: PROPAGATION_BAD
        failure_modes:
        - ROLE_CONFLATION
        - SOURCE_EVIDENCE_WEAK
        source_entities:
