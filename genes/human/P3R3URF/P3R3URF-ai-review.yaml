        subunit branch; a 95-aa arginine/proline-rich peptide with no SH2 domain
        and no SOCS box cannot plausibly be placed in a clade whose cytokine role
        is defined by SH2-mediated receptor engagement. Pathway conclusions from
        the only relevant experimental study should be attributed to PIK3R3, not
        P3R3URF.
