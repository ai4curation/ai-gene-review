description: P3R3URF (PIK3R3 upstream open reading frame protein; UniProt A0A087WWA1,
  95 aa; HGNC:53451) is a testis-enriched microprotein encoded by an upstream
  open reading frame located on the PIK3R3 locus. The 95-aa product has MANE/CCDS
  transcript support and peptide-detection repository cross-references, but no
  P3R3URF-specific biochemical activity, cellular localization, binding partner,
  or pathway role has been established. The locus has been hypothesized to give
  rise to a P3R3URF-PIK3R3 readthrough/fusion product, but the only directly
  relevant experimental study (Tidball et al. 2023, bioRxiv) failed to detect
  P3R3URF or P3R3URF-PIK3R3 transcripts by qRT-PCR in human iNeurons and instead
  favored a post-translational modification of canonical PIK3R3 as the explanation
  for a higher-molecular-weight immunoblot band.
