- source_index: 14
  source_annotation:
    term:
      id: GO:0005759
      label: mitochondrial matrix
    evidence_type: IDA
    original_reference_id: PMID:27974379
    qualifier: located_in
  methods:
  - Mitochondrial immunopurification/BioID
  - GRSF1 immunofluorescence
  - Curated UniProt localization
  primary_locators:
  - PMID:27974379 Results/Figure 1, Figure EV1, immunoprecipitation/BioID/immunofluorescence Methods
  - PMID:25683715 Figure1 and endogenous 143B localization Results
  - UniProt CC SUBCELLULAR LOCATION
  review:
    summary: FASTKD2 functions in the mitochondrial matrix, including mitochondrial RNA granules.
    action: ACCEPT
    reason: The original FASTKD2 mitochondrial immunopurification/BioID and RNA-granule localization evidence
      is consistent with the matrix compartment (PMID:27974379, Results/Figure 1, expanded Figure EV1 and localization
      Methods). Independent endogenous FASTKD2 localization in PMID:25683715 and the curated UniProt CC SUBCELLULAR
      LOCATION statement support this placement. Accept the experimental curator's matrix assignment consistently
      with the other positive matrix annotations. These sources do not resolve freely soluble matrix residence
      from association with the matrix-facing inner membrane, and RNA-granule localization is partial rather
      than exclusive. That subcompartment/topology limit does not negate the broader matrix claim; no membrane
      topology or cleavage coordinate is inferred.
    supported_by:
    - reference_id: PMID:27974379
    - reference_id: PMID:25683715
    - reference_id: UniProtKB:Q9NYY8
- source_index: 20
  source_annotation:
    term:
      id: GO:0006915
      label: apoptotic process
    evidence_type: IMP
    original_reference_id: PMID:18771761
    qualifier: involved_in
  methods:
  - Patient fibroblast staurosporine/nuclear fragmentation
  - FASTKD2 overexpression
  - Respiratory-complex activity context
  primary_locators:
  - PMID:18771761 Figure 5 and Results paragraph beginning The presence of a FAST domain
  - PMID:18771761 final Discussion; normal fibroblast respiratory activities versus muscle COX deficiency
  - UniProt CC FUNCTION
  review:
    summary: The preliminary apoptosis phenotypes do not establish FASTKD2's participation in the apoptotic
      process.
    action: MARK_AS_OVER_ANNOTATED
    reason: PMID:18771761 Figure 5 and its Results show reduced staurosporine-induced nuclear fragmentation
      in patient fibroblasts and fragmentation after FASTKD2 overexpression. The authors explicitly leave specific
      apoptotic action versus nonspecific overexpression toxicity unresolved. Crucially, respiratory-chain
      complex activities were reported as normal in the tested mutant fibroblasts; the COX deficiency was observed
      in skeletal muscle. The phenotype therefore cannot be declared a demonstrated consequence of OXPHOS failure
      in those fibroblasts. Nonetheless, these preliminary response and toxicity observations do not identify
      a normal FASTKD2 contribution to apoptotic signaling or execution. The process assignment overshoots
      the resolved mechanism, while the positive experimental phenotype is retained and a possible regulatory
      role is not excluded. UniProt CC FUNCTION likewise describes the apoptosis role tentatively.
    supported_by:
    - reference_id: PMID:18771761
    - reference_id: UniProtKB:Q9NYY8
- source_index: 22
  source_annotation:
    term:
      id: GO:0032543
      label: mitochondrial translation
    evidence_type: IDA
    original_reference_id: PMID:26370583
    qualifier: involved_in
  methods:
  - RNAi and CRISPR depletion
  - Emetine-selective mitochondrial [35S]-methionine pulse labeling
  - Independent RNA-binding/assembly assays
  primary_locators:
  - PMID:26370583 Figure 4D/Results Physiological consequences; Methods Pulse labeling of mitochondrial translation
    products
  - PMID:25683715 Figures 4–5 and RNA-IP/sedimentation Methods
  review:
    summary: FASTKD2 supports mitochondrial translation, with RNA handling and ribosome biogenesis as its resolved
      core roles.
    action: KEEP_AS_NON_CORE
    reason: 'PMID:26370583 Figure 4D and the pulse-labeling Methods directly measure reduced mitochondrial
      protein synthesis after FASTKD2 RNAi or CRISPR depletion; emetine excludes cytoplasmic translation. Crucially,
      RNAi reduced translation without appreciably changing RNR2 (16S rRNA) steady-state abundance or processing
      on the measured Northern blots. The translation phenotype therefore cannot be attributed solely to observed
      16S-rRNA depletion. The study also establishes RNA contacts and transcript defects, while PMID:25683715
      connects FASTKD2 to 16S rRNA and large-subunit assembly. Retain the positive translation role as non-core
      to prioritize those resolved RNA-handling and assembly activities in the synthesis. The proximal translation
      mechanism remains unresolved: these assays do not isolate a translation step, but that limitation does
      not establish absence of direct participation. This is a core-prioritization judgment, not denial of
      UniProt''s translation requirement or a claim that all effects are secondary to rRNA loss. Noncatalytic
      translation contributions remain possible.'
    supported_by:
    - reference_id: PMID:26370583
    - reference_id: PMID:25683715
    - reference_id: UniProtKB:Q9NYY8
    additional_reference_ids:
    - PMID:25683715
- source_index: 29
  source_annotation:
    term:
      id: GO:1900864
      label: mitochondrial RNA modification
    evidence_type: IEA
    original_reference_id: GO_REF:0000107
    qualifier: involved_in
    supporting_entities:
    - UniProtKB:Q922E6
    - ensembl:ENSMUSP00000027103
  methods:
  - Mouse-heart Ptcd1 perturbation/Pseudo-Seq
  - PTCD1 co-immunoprecipitation and HeLa BioID
  - Human RNA-module co-immunoprecipitation and 2D gels
  primary_locators:
  - PMID:29617655 Figure 6 and Results PTCD1 Stabilizes the 16S rRNA to Enable Its Pseudouridylation
  - PMID:27667664 Figure 6/Results module section and Discussion
  - PMID:27974379 Figure 3D
  - UniProt CC SUBUNIT
  review:
    summary: Orthology transfers a positive modification-module association, but FASTKD2-specific participation
      in the chemical step remains unresolved.
    action: UNDECIDED
    reason: The Ensembl one-to-one mouse donor Q922E6/ENSMUSP00000027103 has a real FlyBase IPI GO:1900864
      annotation to PMID:29617655 with PTCD1/Q8C2E4. The full paper reports mouse-heart PTCD1–Fastkd2 co-immunoprecipitation,
      co-fractionation with RPUSD4, and loss of 16S-rRNA pseudouridylation after PTCD1 disruption. The perturbation
      directly testing chemical modification is PTCD1 loss, not Fastkd2 loss. Human studies place FASTKD2 in
      an RNA-handling module with pseudouridine synthases (PMID:27667664; PMID:27974379), but the inspected
      experiments do not isolate whether FASTKD2 supplies a structural or regulatory contribution specifically
      to modification. Such a noncatalytic contribution remains possible; lack of a catalytic domain is not
      a disproof. Retain source-specific uncertainty rather than equating general RNA maturation or complex
      association with a demonstrated chemical-modification role, and do not infer a wrong-gene annotation
      or biological absence. UniProt CC SUBUNIT's regulatory protein-RNA complex statement is supported by
      the positive NGRN/WBSCR16 immunoprecipitation and RNase-resistant interactions in PMID:27667664 (Results/Figure
      6; Discussion leaves single versus overlapping complexes unresolved). PMID:27974379 Figure 3D instead
      finds largely monomeric migration under its 2D-gel conditions and proposes transient associations. These
      observations support physical/module association without establishing one stable obligate holocomplex,
      and neither isolates a FASTKD2-specific contribution to modification. In PMID:29617655, RPUSD4 is the
      synthase and PTCD1 loss is the tested perturbation; a noncatalytic FASTKD2 contribution remains plausible
      but unseparated. Keep the uncertainty rather than asserting that association is sufficient or that FASTKD2
      cannot contribute.
    supported_by:
    - reference_id: GO_REF:0000107
    - reference_id: PMID:29617655
    - reference_id: PMID:27667664
    - reference_id: PMID:27974379
