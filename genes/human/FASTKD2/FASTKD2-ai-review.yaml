  label: Homo sapiens
description: FASTKD2 is a mitochondrial RNA-binding protein of the FASTK family, with C-terminal FAST
  and RAP domains. It concentrates in mitochondrial RNA granules in the matrix, binds 16S ribosomal RNA
  and selected mitochondrial messenger RNAs, and promotes mitochondrial RNA maturation and large-ribosomal-subunit
  assembly. Loss of FASTKD2 reduces 16S rRNA and mitochondrial protein synthesis, linking its RNA-handling
  activity to respiratory-chain function. Whether FASTKD2 directly alters ND6 turnover or acts through
  secondary effects of defective ribosome assembly remains unresolved. Biallelic loss-of-function variants
  cause mitochondrial encephalomyopathy, including disease associated with cytochrome c oxidase deficiency.
