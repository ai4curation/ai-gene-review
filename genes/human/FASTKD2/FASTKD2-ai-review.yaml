core_functions:
- description: Binds mitochondrial rRNA and selected mRNAs to support RNA maturation and large-ribosomal-subunit
    assembly in mitochondrial RNA granules. Regulation of mitochondrial mRNA stability is retained as
    a conserved function supported by PAINT and human RNA-contact/abundance data; the inspected FASTKD2
    experiments do not isolate direct ND6 decay kinetics from secondary ribosome-assembly effects. Matrix
    placement combines curated phylogenetic/database inference with mitochondrial and granule localization
    evidence.
