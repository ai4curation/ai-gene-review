suggested_questions:
- question: Does FASTKD2 binding directly alter ND6 decay, or does ND6 destabilization follow impaired
    large-subunit assembly and translation? The inspected human binding/steady-state experiments and the
    PTCD1 study leave these mechanisms distinguishable (PMID:26370583; PMID:29617655).
- question: Does FASTKD2 supply a structural or regulatory contribution specifically to mitochondrial
    RNA pseudouridylation, beyond its established RNA-binding and assembly role? The inspected module
    studies and PTCD1 perturbation establish association but do not isolate that FASTKD2-dependent step
    (PMID:27667664; PMID:27974379; PMID:29617655).
- question: Do the two curated FASTKD2 splice products differ in RNA specificity, mitochondrial import
    or granule residence? The 710- and 648-residue products are sequence-defined, but the inspected tagged-protein
    and depletion studies do not resolve their individual functions.
suggested_experiments:
- hypothesis: FASTKD2 directly regulates the fate of bound ND6 RNA independently of secondary loss of
    mitochondrial ribosomes.
  description: Combine acute FASTKD2 depletion and rescue with mitochondrial RNA pulse-chase measurements,
    precursor-versus-mature ND6 analysis and parallel 16S-rRNA, large-subunit assembly and translation
    measurements. Compare early time points before assembly fails with a matched perturbation that reduces
    mitochondrial translation without removing FASTKD2. Measure RNA binding by rescue proteins and verify
    their import and abundance to distinguish altered turnover from processing or localization effects.
  experiment_type: Time-resolved RNA turnover and separation-of-function rescue
- hypothesis: FASTKD2 RNA binding helps present mitochondrial RNA to the pseudouridylation machinery.
  description: Measure site-specific pseudouridylation after acute FASTKD2 depletion and matched rescue,
    alongside RNA abundance and assembly controls. Reconstitute the relevant RNA substrate and pseudouridine
    synthase with and without FASTKD2, measuring modification separately from RNA binding. A FASTKD2-dependent
    effect would establish a contribution to the step without presuming that FASTKD2 catalyzes the chemistry.
  experiment_type: RNA modification mapping and biochemical reconstitution
