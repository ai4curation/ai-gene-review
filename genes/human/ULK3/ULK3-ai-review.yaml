      The abstract-only source explicitly supports ULK3-induced autophagy, and
      the later CAF paper corroborates this phenotype. The row is kept as a
      non-core contextual process because the accessible evidence does not show
      that ULK3 is the endogenous initiating kinase of bulk autophagosome
      biogenesis.
    additional_reference_ids:
    - PMID:28877478
    supported_by:
    - reference_id: PMID:19279323
      supporting_text: >-
        Overexpression of one of those genes, ULK3, induces autophagy and
        senescence.
    - reference_id: PMID:28877478
      supporting_text: >-
        Increased ULK3 also induces autophagy, which is unlinked from GLI and
        CAF activation.
- term:
