id: Q6PHR2
gene_symbol: ULK3
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  ULK3 is a cytoplasmic serine/threonine protein kinase in the
  APG1/unc-51/ULK kinase family. Its best-supported signaling role is in
  Hedgehog pathway activation: ULK3 autophosphorylates, phosphorylates GLI
  transcription factors, binds the Hedgehog inhibitor SUFU, and helps convert
  full-length GLI proteins into transcriptional activators. ULK3 can also induce
  autophagy in senescent or CSL-depleted fibroblast contexts and is required for
  a GLI-dependent cancer-associated fibroblast activation program, but direct
  evidence does not place it in the canonical ULK1/ULK2 autophagy-initiation
  kinase complex.
