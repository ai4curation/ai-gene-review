core_functions:
- description: >-
    ULK3 is a Fused-family protein serine/threonine kinase that
    phosphorylates GLI transcription factors downstream of Hedgehog signaling,
    promoting conversion of full-length GLI proteins into transcriptional
    activators.
  molecular_function:
    id: GO:0004674
    label: protein serine/threonine kinase activity
  directly_involved_in:
  - id: GO:0007224
    label: smoothened signaling pathway
  - id: GO:0045880
    label: positive regulation of smoothened signaling pathway
  locations:
  - id: GO:0005737
    label: cytoplasm
  supported_by:
  - reference_id: PMID:19878745
    supporting_text: >-
      We show that ULK3 is an autophosphorylated kinase and phosphorylates GLI
      proteins in vitro.
  - reference_id: PMID:20643644
    supporting_text: >-
      Sufu blocks Ulk3 autophosphorylation and abolishes its ability to
      phosphorylate and positively regulate Gli proteins.
  - reference_id: PMID:31279575
    supporting_text: >-
      Furthermore, we provide evidence that Sonic hedgehog (Shh) activates
      Gli2 by stimulating its phosphorylation on conserved sites through the
      Fu-family kinases ULK3 and mFu/STK36 in a manner depending on Gli2
      ciliary localization.

proposed_new_terms: []

suggested_questions:
- question: >-
    Does endogenous ULK3 localize to the ciliary tip during vertebrate
    Hedgehog signaling, or does it phosphorylate GLI proteins from a broader
    cytoplasmic or periciliary pool?
- question: >-
    Which direct ULK3 substrates mediate autophagy induction in senescent or
    CSL-depleted fibroblasts, and are they independent of canonical
    ULK1/ULK2-driven phagophore initiation?
- question: >-
    Is the CSL-ULK3-GLI fibroblast activation program specific to
    cancer-associated fibroblast conversion, or does it operate in normal
    wound-healing fibroblast activation?

suggested_experiments:
- description: >-
    Tag endogenous ULK3 and image it with GLI2, SUFU, and ciliary-tip markers
    before and after Hedgehog stimulation.
  hypothesis: >-
    Direct imaging will distinguish whether Reactome's ciliary-tip Hedgehog
    events reflect ULK3 residence at the tip or GLI/SUFU localization at that
    site.
- description: >-
    Perform ULK3-dependent phosphoproteomics in senescent and CSL-depleted
    fibroblasts with rescue by wild-type and kinase-dead ULK3.
  hypothesis: >-
    Direct non-GLI ULK3 substrates explain contextual autophagy induction
    without making ULK3 a canonical ULK1/ULK2 complex kinase.
- description: >-
    Test ULK3 loss and kinase-dead rescue in primary fibroblast wound-healing
    and tumor co-culture models.
  hypothesis: >-
    Separating normal from cancer-associated fibroblast responses will define
    whether fibroblast activation is a narrow stromal phenotype or a broader
    ULK3 biological process.
