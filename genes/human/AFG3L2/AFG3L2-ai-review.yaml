suggested_questions:
- question: Which native human precursor-processing reactions require AFG3L2 directly, and how
    do they differ from substrate degradation or secondary mitochondrial stress responses?
- question: How do AFG3L2 homohexamers and SPG7-containing heterohexamers select regulatory
    substrates in different human cell types?
- question: How should one integrated m-AAA protease activity be represented with both
    ATP-dependent peptidase activity (GO:0004176) and metalloendopeptidase activity
    (GO:0004222), while preserving the distinction between ATP-driven protein translocation and
    short-peptide cleavage that can occur without ATP?
suggested_experiments:
- hypothesis: AFG3L2 substrates can be prioritized by matrix-exposed degrons and
    metabolite-sensitive conformational states rather than by generic inner-membrane
    localization alone.
  description: Combine pulse-chase proteomics in AFG3L2 knockout/rescue cells with
    degron-mutant substrate panels for SLC25A39, SLC25A45, EMRE, and TMBIM5, measuring
    substrate half-life, AFG3L2 association, and mitochondrial metabolite or calcium readouts.
  experiment_type: proteomics and targeted substrate-turnover assays
