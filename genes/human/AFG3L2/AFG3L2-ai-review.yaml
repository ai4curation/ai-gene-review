    label: protein autoprocessing
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q8JZQ2
  - ensembl:ENSMUSP00000025408
  review:
    summary: AFG3L2 catalyzes precursor self-maturation as part of m-AAA protease biogenesis.
    action: ACCEPT
    reason: 'The mouse Q8JZQ2 donor is grounded in the MGI-linked PMID:19656850 precursor-processing
      experiments. Independent human-protein evidence in PMID:30252181 Figure 3C shows precursor
      accumulation for the protease-inactive E575Q control and R468C variant, supporting autocatalytic
      maturation. These experiments express human AFG3L2 in m-AAA-deficient yeast, not native human
      cells. Self-maturation is a direct proteolytic contribution to the conserved enzyme function;
      human evidence corroborates rather than replaces the mouse donor chain.'
    supported_by:
    - reference_id: PMID:19656850
      supporting_text: The mitochondrial processing peptidase MPP generates an intermediate
        form of Afg3l2 that is matured autocatalytically.
    - reference_id: file:human/AFG3L2/AFG3L2-uniprot.txt
      supporting_text: autocatalytic proteolytic processing to generate the proteolytically
    - reference_id: PMID:30252181
      supporting_text_fulltext: human AFG3L2 undergoes autocatalytic processing as do the
        homolog mouse subunits Afg3l2 and Afg3l1
      full_text_unavailable: true
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: UniProtKB:Q8JZQ2
        source_status: SUPPORTS_TRANSFER
        comment: Mouse Afg3l2 Q8JZQ2 is the original donor; its MGI autoprocessing annotation
          is experimentally grounded by PMID:19656850. Human AFG3L2 self-maturation in yeast is
          independently supported by PMID:30252181, with no transfer of mouse Afg3l1 as an
          active human paralog.
      - source_id: ensembl:ENSMUSP00000025408
        source_status: SUPPORTS_TRANSFER
        comment: The supplied Compara protein accompanies the mouse Afg3l2 donor. The evidence
          assessment is term-specific above; the complete current Ensembl gene tree was not
          reconstructed.
    additional_reference_ids:
    - PMID:19656850
    - PMID:30252181
    - file:human/AFG3L2/AFG3L2-notes.md
