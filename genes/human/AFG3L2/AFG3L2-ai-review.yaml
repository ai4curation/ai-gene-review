id: Q9Y4W6
gene_symbol: AFG3L2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: AFG3L2 is a mitochondrial inner-membrane AAA+ zinc protease whose catalytic
  domains face the matrix. It assembles into homohexameric m-AAA proteases and heteromeric
  complexes with SPG7/paraplegin. ATP hydrolysis powers substrate unfolding and translocation
  into a proteolytic chamber. AFG3L2 removes unassembled or aberrant mitochondrial proteins,
  including nascent membrane proteins, and can carry out limited precursor processing. Human
  enzyme studies demonstrate maturation of a recombinant MRPL32 precursor, and expression in
  yeast supports AFG3L2 self-maturation and SPG7/paraplegin maturation; cellular studies
  implicate AFG3L2 in OMA1 and PINK1 processing. Regulated turnover of EMRE, SLC25A39, SLC25A45
  and TMBIM5 connects its protease activity to calcium uptake, mitochondrial metabolite
  homeostasis and membrane stress. AFG3L2 dysfunction causes neurological disorders including
  dominant spinocerebellar ataxia and recessive spastic ataxia.
