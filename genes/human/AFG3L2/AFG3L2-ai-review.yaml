  review:
    summary: Conserved mitochondrial substrate maturation is supported by human AFG3L2
      biochemistry.
    action: ACCEPT
    reason: The PAINT ancestral assertion at PTN000554085 is consistent with maturation of a
      human MRPL32 precursor by engineered human AFG3L2 (PMID:29932645). Human self evidence in
      the descendant list is legitimate experimental grounding, not circularity. The assay is
      biochemical precursor processing; it does not establish that loss of this reaction
      explains every human mitoribosome phenotype. Independent human-protein expression in
      yeast also supports AFG3L2 self-maturation and SPG7/paraplegin maturation (PMID:30252181,
      Figure 3C-D); construct and host limits are recorded in the reference assessment.
    supported_by:
