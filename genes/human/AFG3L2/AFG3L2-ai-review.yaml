core_functions:
- description: ATP-fueled unfolding, translocation and zinc-dependent endopeptide cleavage of
    mitochondrial protein substrates by matrix-facing m-AAA protease complexes. This integrated
    activity removes aberrant or unassembled proteins and supports productive precursor
    maturation, including AFG3L2 self-maturation and SPG7/paraplegin maturation demonstrated
    with human proteins expressed in yeast. Human MRPL32 maturation is demonstrated with an
    engineered soluble protease and recombinant precursor; cellular PINK1 processing implicates
    AFG3L2 without reconstituting the precise cleavage reaction.
