    label: mitochondrial protein quality control
  evidence_type: IDA
  original_reference_id: PMID:26504172
  qualifier: involved_in
  review:
    summary: AFG3L2 limits proteotoxic accumulation during mitochondrial protein synthesis.
    action: ACCEPT
    reason: PMID:26504172 shows altered nascent-chain abundance after AFG3L2 depletion and
      suppression of actinonin effects by AFG3L2 overexpression. Five-day knockdown did not
      reduce large mitoribosomal-subunit assembly or monosome formation. These data support
      protein quality control without assigning all effects to MRPL32 maturation.
    supported_by:
    - reference_id: PMID:26504172
      supporting_text: The mitochondrial m-AAA protease subunit AFG3L2 is critical to this
        surveillance mechanism
