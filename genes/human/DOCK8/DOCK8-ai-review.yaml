core_functions:
- description: DOCK8 promotes CDC42 nucleotide exchange through its DHR-2 domain, coupling localized CDC42
    activation to leukocyte polarization and migration. Human DOCK8 constructs support CDC42 activation
    and regulated leading-edge recruitment in cell assays; the dendritic-cell migration and structural
    evidence includes mouse experiments. LRCH1 restrains access to CDC42, while phosphorylation promotes
    release of this inhibition.
  molecular_function:
    id: GO:0005085
    label: guanyl-nucleotide exchange factor activity
  directly_involved_in:
  - id: GO:0090630
    label: activation of GTPase activity
  - id: GO:1903905
    label: positive regulation of establishment of T cell polarity
  - id: GO:2000406
    label: positive regulation of T cell migration
  locations:
  - id: GO:0005829
    label: cytosol
  - id: GO:0031256
    label: leading edge membrane
  substrates:
  - id: UniProtKB:P60953
    label: CDC42
  supported_by:
  - reference_id: PMID:28028151
    supporting_text: DOCK8 DHR-2 enhanced the amount of GTP-bound-Cdc42
  - reference_id: PMID:22461490
- description: DOCK8 provides signaling-adaptor activity in CpG-stimulated human B cells, associating
    with MyD88 and Pyk2 and supporting phosphorylation-dependent recruitment of Src-family kinases. This
    activity helps couple TLR9 stimulation to Pyk2–Src–Syk–STAT3 signaling. The assembly geometry and
    proposed SH2-binding interface remain unresolved.
  molecular_function:
    id: GO:0035591
    label: signaling adaptor activity
  supported_by:
  - reference_id: PMID:22581261
    supporting_text: DOCK8 functions as an adaptor that links TLR9 via MyD88
suggested_questions:
- question: Under which matched regulatory conditions do the natural DOCK8 products activate CDC42, and
    what explains the negative 2031-residue construct result in the 2020 cellular screen?
- question: What physical interfaces and stoichiometry allow DOCK8 to support Pyk2 activation and phosphorylation-dependent
    Src/Lyn recruitment without requiring an obligatory MyD88–Pyk2 bridge?
- question: Does DOCK8 catalyze RHOJ exchange under a defined physiological or biochemical condition,
    as modeled by Reactome, and which experiment supports that substrate assignment?
suggested_experiments:
- hypothesis: Regulatory context and construct identity explain differing DOCK8 activity readouts.
  description: Compare all four sequence-verified human products and separately defined DHR2 fragments
    in matched purified nucleotide-exchange and cellular CDC42 assays. Control expression, phosphorylation
    and LRCH coexpression, and measure localization independently; retain inactive catalytic and empty-vector
    controls.
  experiment_type: Matched biochemical and cellular comparison
- hypothesis: Specific DOCK8 interfaces coordinate the Pyk2–Src signaling assembly.
  description: Combine purified binding measurements and endogenous reciprocal association with interface
    mutants, then measure Pyk2 activation, DOCK8 phosphorylation and Src/Lyn recruitment separately. Test
    MyD88 dependence without assuming a fixed ternary bridge.
  experiment_type: Mechanistic interaction and signaling analysis
