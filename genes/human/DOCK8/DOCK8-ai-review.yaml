id: Q8NF50
gene_symbol: DOCK8
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: DOCK8 is a large Rho-family guanine-nucleotide exchange factor that activates CDC42 and couples
  localized signaling to leukocyte polarization and migration. It moves between cytosolic and leading-edge
  membrane pools and is restrained by LRCH1 association, with phosphorylation promoting release of that
  inhibition. In human B cells, DOCK8 also provides a signaling adaptor function linking TLR9–MyD88 stimulation
  to Pyk2 and Src-family kinase signaling. Its functions support immune-cell migration, communication
  and persistence; loss of DOCK8 causes a combined immunodeficiency.
alternative_products:
- name: '1'
  id: Q8NF50-1
  description: The 2099-residue displayed product provides the canonical sequence reference. Human DOCK8
    signaling and localization studies support the gene-level activities, but historical constructs with
    unresolved sequence boundaries are not automatically assigned to this product.
- name: '2'
  id: Q8NF50-2
  sequence_note: VSP_027373
  description: This 2067-residue product lacks canonical residues 927–958. The sequence difference is
    established; comparative exchange, adaptor and localization functions relative to the other natural
    products remain unresolved.
- name: '3'
  id: Q8NF50-3
  sequence_note: VSP_039838
  description: This 2031-residue product lacks canonical residues 1–68. The 2020 deposited library coding
    sequence matches this product exactly within vector flanks. Tagged constructs associate with LRCH
    proteins and show regulated localization; the reported activity-screen negative is confined to the
    tested conditions and does not establish universal catalytic inactivity.
- name: '4'
  id: Q8NF50-4
  sequence_note: VSP_039838, VSP_027373
  description: This 1999-residue product lacks canonical residues 1–68 and 927–958. Its distinct sequence
    is verified, but neither equivalence to the displayed product nor loss of exchange/adaptor activity
    is established by the inspected studies.
