gene: DOCK8
accession: UniProtKB:Q8NF50
scope: Source navigation for 43 preserved assertions. This sidecar describes original evidence and limits;
  it is not an independent primary source.
primary_sources:
- reference: PMID:22461490
  url: https://pmc.ncbi.nlm.nih.gov/articles/PMC3418773/
  read_scope: Selected independently recovered original Results and exchange-assay passages; official 3VHL
    entity record.
  locators:
  - Figure 6 mant-GTP exchange assay; mouse dendritic-cell migration and structure entity 1.
  supports: Purified DHR2 exchange and mouse physiological/structural context.
  limits: Kinetic-construct species was not established from the recovered scope. The structural entity is
    mouse; that does not assign species to every assay. Normal cache is abstract-only.
- reference: PMID:28028151
  url: https://pmc.ncbi.nlm.nih.gov/articles/PMC5206493/
  read_scope: Selected original Results, Methods and captions.
  locators:
  - Results/Figures 2,3,6,7; Methods Retrovirus infection, Cdc42 activation, FRET and recombinant proteins.
  supports: Human FLAG-DOCK8 in murine T8.1 cells promotes CDC42 activation, leading-edge localization, polarity
    and migration. LRCH1 competition/phosphorylation provides regulation.
  limits: Cellular GTP loading is distinct from purified fragment competition. DHR2 endpoints differ in Results
    1635–2099, caption 1632–2068 and Methods 1632–2086; no natural-product assignment from these numbers.
- reference: PMID:22581261
  url: https://pubmed.ncbi.nlm.nih.gov/22581261/
  read_scope: Selected full original Results/Methods.
  locators:
  - Sections on TLR9-induced activation and DOCK8 association with MyD88/Pyk2; phosphorylation and Src/Lyn
    recruitment.
  supports: Human B-cell signaling supports an adaptor unit.
  limits: MyD88–Pyk2 can associate without DOCK8. Exact assembly geometry, a proposed SH2 docking site and
    absolute GEF independence are unestablished.
- reference: PMID:22006977
  url: https://pubmed.ncbi.nlm.nih.gov/22006977/
  read_scope: Selected human and mouse original Results/Methods/Figure 1 and later mouse experiments.
  locators:
  - Figure 1 memory-cell sorting/CFSE/TAE±IL2; separate mouse OT-I primary expansion, persistence and recall.
  supports: Human memory T-cell proliferation is impaired under tested stimulation.
  limits: Subset composition and survival affect interpretation; mouse primary expansion is only subtly reduced
    and is not equated with human memory failure.
- reference: PMID:32203420
  url: https://doi.org/10.1038/s41556-020-0488-x
  read_scope: Genuine original Results/captions and read-only supplementary workbook cells; no new figure-pixel
    interpretation.
  locators:
  - Figure 6d,g and Extended Data 8d; Supplementary Tables 1/2/3/4 rows 80/103/674/80.
  supports: DOCK8–LRCH2 co-IP/AP-MS, cytosolic/conditional LRCH-driven localization, sequence-authenticated
    Q8NF50-3 library product.
  limits: Table 2 is a condition-specific negative screen summary. Figure 2 source workbook has no DOCK8-named
    cell; no unseen raw FRET data are claimed. Protected cache remains abstract-only.
- reference: PMID:15304341
  url: https://pubmed.ncbi.nlm.nih.gov/15304341/
  read_scope: Complete abstract; publisher full/PDF403 and OpenAlex locations inspected.
  locators:
  - Abstract historical 1701-residue clone, Cdc42 screen and cell-edge/lamellipodia observations.
  supports: Historical DOCK8 interaction/localization context.
  limits: RHOJ exchange assay cited by Reactome remains unverified; no miscitation claim from missing access
    or modern-product mapping from the old clone name.
- reference: PMID:19946888
  url: https://pubmed.ncbi.nlm.nih.gov/19946888/
  read_scope: Complete abstract and source annotation; genuine failed publisher/supplement routes retained.
  locators:
  - NK-cell membrane proteome; target-specific table unavailable.
  supports: Curator-positive membrane assertion retained and independently refined.
  limits: No claimed target-table read, specific organelle fraction or rejection from abstract silence.
- reference: PMID:24255178
  url: https://pubmed.ncbi.nlm.nih.gov/24255178/
  read_scope: Complete abstract and exact IntAct target records; publisher full/PDF403.
  locators:
  - Records 25/54 DOCK8–LRCH2 and 28/53 DOCK8–LRCH1.
  supports: Human HEK293 anti-tag AP-MS coassociation.
  limits: Shared experiment identifiers require pair+publication keys. No full-paper target-specific Hippo
    mechanism or purified binary binding is asserted.
- reference: PMID:25416956
  url: https://pubmed.ncbi.nlm.nih.gov/25416956/
  read_scope: Selected genuine original screening/retest Results and Experimental Procedures.
  locators:
  - HI-II-14 workflow and exact DOCK8–MEOX2/KRT40/CARHSP1 pairs.
  supports: Repeated, identity-confirmed Y2H pairs support binary recognition.
  limits: Orthogonal validation was a subset. TF/cytoskeletal binding refinements describe verified partner
    classes, not DOCK8 physiological transcription/filament function.
- reference: PMID:26871637
  url: https://pmc.ncbi.nlm.nih.gov/articles/PMC4882190/
  read_scope: Selected separate genuine full cache Methods/Results; protected shorter cache unchanged.
  locators:
  - Interaction profiling and Binary Interaction Mapping; exact IntAct DOCK8 fragment 1587–2099/PIMREG pair.
  supports: Positive binary fragment association.
  limits: Fragment scope is not all-natural-product activity; protected cache completeness and independent
    read scope are distinguished.
- reference: PMID:28514442
  url: https://pubmed.ncbi.nlm.nih.gov/28514442/
  read_scope: Original stable-cell/construct/AP-MS Methods and exact pair.
  locators:
  - C-terminal HA-FLAG ORFeome constructs; DOCK8–LRCH2 record 16.
  supports: HEK293T AP-MS coassociation.
  limits: Spoke-expanded association is not purified direct affinity.
- reference: PMID:31515488
  url: https://pubmed.ncbi.nlm.nih.gov/31515488/
  read_scope: Original Clone-seq/Y2H Methods and exact pair features.
  locators:
  - DOCK8–LRCH1 record 9; partner 486 no-effect variant.
  supports: Positive pair in the recorded variant assay.
  limits: Do not silently label it a wild-type native complex.
- reference: PMID:33961781
  url: https://pmc.ncbi.nlm.nih.gov/articles/PMC8165030/
  read_scope: Selected separately recovered original Methods; current full-text-flagged cache lacks Methods.
  locators:
  - Cloning, stable 293T/HCT116 lines, AP-MS and network aggregation; exact target 293T records 58/60/67.
  supports: DOCK8 coassociation with LRCH1/LRCH2.
  limits: Network aggregation is gene-level; no natural isoform assignment or direct affinity from co-complex
    capture.
- reference: PMID:40205054
  url: https://pubmed.ncbi.nlm.nih.gov/40205054/
  read_scope: Original U2OS AP-MS design and paper-linked primary CX graph.
  locators:
  - NDEx 95bc75d5-d1d1-11ee-8a40-005056ae23aa; edge 554270 LRCH1→DOCK8.
  supports: Positive experimental U2OS AP-MS edge.
  limits: This is not an embedding-derived edge; gene identity does not resolve a natural product.
- reference: PMID:25762780
  url: https://pubmed.ncbi.nlm.nih.gov/25762780/
  read_scope: Selected original human NK-cell/construct/association passages.
  locators:
  - HkRP3 coassociation and polarity/adhesion experiments.
  supports: Corroborates immune-cell DOCK8 function and association.
  limits: HkRP3 microtubule/dynein properties and speculative DOCK8 transport role are not assigned as intrinsic
    DOCK8 activity.
- reference: PMID:22634526
  url: https://pubmed.ncbi.nlm.nih.gov/22634526/
  read_scope: Complete abstract and current experimental FlyBase records.
  locators:
  - Zir IGI GEF/Rho-signaling records; encapsulation and phagocytosis genetics.
  supports: Experimental donor grounding for the ancestral Rho-regulation node.
  limits: No purified human exchange measurement or automatic Rac2 substrate transfer.
construct_analysis:
  reference: PMID:32203420
  original_url: https://rothlab.csb.pitt.edu/publications/Muller_NatureCellBio_2020.pdf
  workbook_url: https://media.springernature.com/original/springer-static/esm/art%3A10.1038%2Fs41556-020-0488-x/MediaObjects/41556_2020_488_MOESM3_ESM.xlsx
  workbook_sha256: da213a54f017f233482d1c3e29661fb4e0d35baac749a0ca1cabac53065369c3
  coding_sequence_cell: Supplementary Table 1 L80
  identity_cells: A80 DOCK8; F80 Human; G80 NP_001180465.1; H80 2031; I80 V4983; K80 human isoform 3.
  translation: Standard genetic code, all three forward frames and all four independently reconstructed official
    sequences. Unique full coding-body match Q8NF50-3 at zero-based frame 2, two-aa offset; RA/LI flanks are
    vector context.
  control_and_negative_scope: Table 2 row 103 reports RHOA/RAC1/CDC42 negative screen calls. Table 3 row 674
    GOLD LRCH2 association is a distinct positive readout. Neither is a universal activity or inactivity statement.
  public_reproduction: DOCK8-bioinformatics/constructs/RESULTS.md documents the published raw workbook, official
    product FASTAs, exact extracted DNA and executable comparison; run just reproduce in that directory.
