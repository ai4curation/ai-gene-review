ontology_checks:
  source: https://www.ebi.ac.uk/QuickGO/services/ontology/go/terms/
  typed_relations: is_a and part_of only for claimed ancestry; regulates edges are not substituted.
  refinements:
  - GO0031256 part_of GO0031252 and is_a-descendant of GO0005886/0016020.
  - GO0031258 is_a GO0031256, so the positive lamellipodium-membrane source remains ACCEPT.
  - GO0090630 is_a-descendant of GO0043547 and means GDP replacement by GTP.
  - GO0035025 descends from GO0035023 and GO0051056; GO0007266 descends from GO0007264.
  - GO0140297 and GO0008092 descend from GO0005515; current GO0008134 usage directs the more specific
    TF-binding descendant.
  adaptor: GO0035591 is assessed against measured coassociation and kinase recruitment; no fixed interface
    or ternary structure inferred.
access_and_metadata:
  publication_cache: All existing cached bytes and Boolean full_text_available values remain exact. Independent
    original access is documented separately.
  provider: Genuine Falcon attempt failed authentication; perplexity-lite fallback failed quota/authentication.
    No generated provider report was fabricated.
  quotes: Publication quotes occur once in YAML/notes, with each newly reproduced source aggregate ≤25
    words; original-only 32203420 anchor appears only in notes, not in a validated cache quotation.
  no_new: All core functions and processes are covered by existing assertions/replacements. No new process
    was inferred from loss-of-function necessity or an annotation-count gap.
