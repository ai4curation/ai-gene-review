id: P12110
gene_symbol: COL6A2
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: COL6A2 encodes the alpha2 chain of collagen VI, a secreted extracellular matrix protein with
  a short collagenous region flanked by von Willebrand factor A domains. In canonical collagen VI, alpha2
  associates with alpha1 and alpha3 chains; intracellular dimers and tetramers give rise to extracellular
  beaded microfibrils that support tissue architecture. The major 2C2 product and two shorter C-terminal
  splice products share their N-terminal and collagenous regions, but the assembly properties of the shorter
  products remain incompletely established. Collagen VI occurs around cells and in connective-tissue matrices,
  including muscle-associated matrix. Pathogenic COL6A2 variants cause collagen VI-related muscular dystrophies,
  including Bethlem and Ullrich phenotypes.
