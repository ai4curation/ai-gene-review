core_functions:
- description: 'Alpha2(VI) supplies a structural chain of collagen VI assemblies that form extracellular
    beaded microfibrils and connect matrix structures. Canonical alpha1/alpha2/alpha3 units contribute
    matrix integrity. The shorter alpha2 C-terminal splice products retain shared structural regions,
    while their incorporation and matrix-assembly properties remain incompletely established. Collagen-chain
    contacts support this integrated assembly role: isolated non-triple-helical human major 2C2 alpha2
    binds pepsin-collagen VI, while the alpha4 transfection assay demonstrates multichain coassembly;
    these distinct assays do not establish all splice products as equivalent.'
  molecular_function:
    id: GO:0030020
    label: extracellular matrix structural constituent conferring tensile strength
  in_complex:
    id: GO:0005589
    label: collagen type VI trimer
  locations:
  - id: GO:0001527
    label: microfibril
  supported_by:
  - reference_id: PMID:2551668
  - reference_id: PMID:1690728
  - reference_id: PMID:18400749
  - reference_id: PMID:23869615
  - reference_id: PMID:8168508
suggested_questions:
- question: How do 2C2A and 2C2A′ differ from the major 2C2 product in secretion, trimer incorporation,
    higher-order assembly and matrix organization?
- question: How do alpha2 ligand affinities measured in non-triple-helical recombinant chains change in
    sequence-defined canonical and alternative collagen VI assemblies?
- question: What fractions of vesicle-associated alpha2 are intact extracellular assemblies, membrane-bound
    material or degradation fragments, and which products contribute?
suggested_experiments:
- description: Compare sequence-defined human alpha2 products with matched alpha1/alpha3 partners using
    pulse-chase secretion, chain-specific mass spectrometry and extracellular microfibril imaging.
  hypothesis: The distinct C termini alter incorporation or higher-order assembly while preserving the
    common collagenous region.
- description: Apply protease protection and fractionation with product-specific C-terminal peptides to
    parotid and CSF EV preparations.
  hypothesis: The observed alpha2 groups comprise separable surface-associated, intravesicular and soluble
    matrix pools.
status: DRAFT
