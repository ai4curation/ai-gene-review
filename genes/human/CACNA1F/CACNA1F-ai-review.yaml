id: O60840
gene_symbol: CACNA1F
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CACNA1F encodes the pore-forming alpha1 subunit of the CaV1.4 L-type voltage-gated calcium
  channel. Calcium entry through CaV1.4 couples retinal membrane voltage to neurotransmitter release
  and supports visual signaling. Its C-terminal splice variants differ in voltage-dependent activation,
  calcium-dependent inactivation and modulation by CaBP4. Pathogenic variants cause X-linked incomplete
  congenital stationary night blindness, cone-rod dystrophy and Aland Island eye disease; the molecular
  effects include altered splicing, predicted loss of channel function and experimentally demonstrated
  changes in gating.
