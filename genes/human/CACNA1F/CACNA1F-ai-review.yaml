core_functions:
- description: Forms the CaV1.4 L-type calcium pore in a voltage-gated channel complex. Calcium entry
    across the plasma membrane links retinal voltage changes to transmitter-release signaling and
    visual perception. Alternative C-terminal splicing and CaBP4 change channel activation and inactivation,
    so the kinetic behavior depends on the product and its molecular partners.
  molecular_function:
    id: GO:0008331
    label: high voltage-gated calcium channel activity
  directly_involved_in:
