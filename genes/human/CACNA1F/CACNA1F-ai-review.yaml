suggested_questions:
- question: Which original rat protein-localization experiments support the outer-segment, neuronal-cell-body
    and perikaryon transfers, and which of these pools is established for human CaV1.4?
- question: What target-specific evidence and process placement underlie the clinical PMID:7571473
    light-detection assertion, as distinct from the established calcium-entry and visual-signal-transmission
    functions?
- question: How do the six reviewed CACNA1F products and their auxiliary partners distribute among
    native human retinal cell types, and how do those combinations determine activation and inactivation?
suggested_experiments:
- description: Compare defined human CaV1.4 splice products with controlled auxiliary-subunit composition
    in electrophysiological assays and retinal models, while validating product-specific localization
    reagents against loss-of-expression controls.
