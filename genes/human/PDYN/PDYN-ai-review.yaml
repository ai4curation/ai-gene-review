- id: PMID:10098940
  title: 'Ultrastructural localization of dynorphin in the dentate gyrus in human
    temporal lobe epilepsy: a study of reorganized mossy fiber synapses.'
  findings:
  - statement: >-
      Demonstrated by preembedding immunoperoxidase electron microscopy in human surgical dentate
      gyrus specimens that dynorphin A immunoreactivity is localized to neuronal dense-core
      vesicles in mossy fiber axon terminals and dendritic shafts and spines.
    supporting_text: >-
      In electron microscopic preparations, dynorphin A immunoreactivity was highly associated
      with dense core vesicles and was localized predominantly in axon terminals in the inner
      molecular layer of the dentate gyrus, although some dynorphin-labeled dense core vesicles
      were also observed in dendritic shafts and spines.
- id: PMID:18384820
  title: Supersensitivity to mu-opioid receptor-mediated inhibition of the adenylyl cyclase pathway
    involves pertussis toxin-resistant Galpha protein subunits.
  findings:
  - statement: >-
      Opioid receptor agonists stimulate [35S]GTPgammaS binding and inhibit forskolin-stimulated
      adenylyl cyclase activity via pertussis-toxin-sensitive Galpha(i/o) subunits.
    supporting_text: >-
      In control animals, the mu-opioid selective agonists, sufentanil and DAMGO, stimulated
      [35S]5'-(gamma-thio)-triphosphate ([35S]GTP gamma S) binding and inhibited
      forskolin-stimulated adenylyl cyclase activity, through a mechanism involving pertussis toxin
      (PTX) sensitive G alpha(i/o) subunits.
- id: PMID:22437502
  title: Crystal structure of the µ-opioid receptor bound to a morphinan antagonist.
  findings:
  - statement: >-
      Opioid receptors couple predominantly to the inhibitory G protein Gi to inhibit adenylyl
      cyclase and mediate analgesia.
    supporting_text: >-
      The μOR couples predominantly to Gi, the inhibitory G protein for adenylyl cyclase. μOR
      signaling through Gi is responsible for its analgesic properties4.
