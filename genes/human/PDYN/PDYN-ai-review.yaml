- term:
    id: GO:0038003
    label: G protein-coupled opioid receptor signaling pathway
  evidence_type: IDA
  original_reference_id: PMID:9047294
  qualifier: involved_in
  review:
    summary: >-
      Mature dynorphin and neoendorphin peptides cleaved from PDYN act as the high-affinity
      endogenous agonists for the G protein-coupled kappa-opioid receptor OPRK1 (and also activate
      OPRM1 and OPRD1) to initiate the G protein-coupled opioid receptor signaling pathway.
    action: NEW
    reason: >-
      Human PDYN currently carries only generic neuropeptide signaling pathway (GO:0007218) in GOA
      and lacks GO:0038003 (which is annotated on human PENK and on all four opioid receptors
      OPRM1, OPRD1, OPRK1, OPRL1). Dynorphin A(1-17) is the canonical high-affinity endogenous
      agonist of the kappa-opioid receptor OPRK1 (PMID:9047294; Reactome:R-HSA-374298), directly
      initiating GO:0038003.
    supported_by:
    - reference_id: PMID:9047294
      supporting_text: >-
        Dynorphin A (1-17) (dynorphin) acts preferentially and with high affinity at the
        kappa-opioid receptor, for which it is the natural, endogenous ligand.
- term:
    id: GO:0031635
    label: adenylate cyclase-inhibiting opioid receptor signaling pathway
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-373076
  qualifier: involved_in
  review:
    summary: >-
      Binding of mature PDYN-derived opioid peptides (dynorphin A, dynorphin B, alpha/beta-neoendorphin)
      to Gi/o-coupled kappa, mu, and delta opioid receptors activates pertussis-toxin-sensitive
      Galpha_i/o subunits that inhibit adenylate cyclase.
    action: NEW
    reason: >-
      All four vertebrate opioid receptors (OPRK1, OPRM1, OPRD1, OPRL1) couple to pertussis-toxin-sensitive
      heterotrimeric Gi/o proteins whose canonical effector mechanism is inhibition of adenylate
      cyclase (GO:0031635; PMID:18384820, PMID:22437502, Reactome:R-HSA-373076, R-HSA-380073).
      Adding GO:0031635 captures the canonical Gi/o-mediated effector branch downstream of opioid
      receptor activation by dynorphins and neoendorphins.
    supported_by:
    - reference_id: PMID:18384820
      supporting_text: >-
        In control animals, the mu-opioid selective agonists, sufentanil and DAMGO, stimulated
        [35S]5'-(gamma-thio)-triphosphate ([35S]GTP gamma S) binding and inhibited
        forskolin-stimulated adenylyl cyclase activity, through a mechanism involving pertussis
        toxin (PTX) sensitive G alpha(i/o) subunits.
    - reference_id: PMID:22437502
      supporting_text: >-
        The μOR couples predominantly to Gi, the inhibitory G protein for adenylyl cyclase. μOR
        signaling through Gi is responsible for its analgesic properties4.
    - reference_id: PMID:9047294
      supporting_text: >-
        Dynorphin A (1-17) (dynorphin) acts preferentially and with high affinity at the
        kappa-opioid receptor, for which it is the natural, endogenous ligand.
