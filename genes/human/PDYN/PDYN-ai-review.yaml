id: P01213
gene_symbol: PDYN
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  Secreted vertebrate opioid neuropeptide polyprotein precursor (Proenkephalin-B / Prodynorphin)
  synthesized in striatonigral medium spiny neurons, hippocampal dentate
  gyrus granule cells (mossy fibers), hypothalamic magnocellular neurons, and spinal cord dorsal
  horn interneurons. Packaged into the lumen of neuronal dense-core vesicles and
  proteolytically cleaved at paired basic sites by prohormone convertases PC1/PC2 (PCSK1/PCSK2)
  and carboxypeptidase E (CPE) into multiple bioactive opioid peptides sharing an N-terminal
  Leu-enkephalin (Tyr-Gly-Gly-Phe-Leu) message sequence with basic C-terminal address extensions:
  dynorphin A(1-17), dynorphin A(1-8), dynorphin B (rimorphin), alpha-neoendorphin,
  beta-neoendorphin, leumorphin, and Leu-enkephalin. Following activity-dependent exocytosis into
  the extracellular region, mature dynorphin peptides act as high-affinity
  endogenous opioid peptide agonists preferentially at the Gi/o-coupled
  kappa-opioid receptor (OPRK1, KOR) — and with lower selectivity at mu (OPRM1) and delta (OPRD1)
  opioid receptors — to initiate the G protein-coupled opioid receptor signaling pathway
  and its canonical adenylate cyclase-inhibiting opioid receptor signaling pathway,
  suppressing presynaptic voltage-gated calcium channels, activating GIRK potassium
  channels, and modulating synaptic transmission, nociception, and stress/aversion circuits.
