      In electron microscopic preparations, dynorphin A immunoreactivity was highly associated
      with dense core vesicles and was localized predominantly in axon terminals in the inner
      molecular layer of the dentate gyrus, although some dynorphin-labeled dense core vesicles
      were also observed in dendritic shafts and spines.
proposed_new_terms: []
suggested_questions:
- question: >-
    How do the distinct basic C-terminal address extensions of dynorphin A(1-17), dynorphin A(1-8),
    dynorphin B, and alpha/beta-neoendorphin differentially bias Gi/o subtype activation versus
    beta-arrestin-2 recruitment at human OPRK1?
suggested_experiments:
- description: >-
    Measure biased Galpha_i1/2/3/oA/oB vs. beta-arrestin-2 recruitment across the full panel of
    endogenous PDYN cleavage products — dynorphin A(1-17), dynorphin A(1-8), dynorphin B,
    alpha-neoendorphin, beta-neoendorphin, and leumorphin — at human OPRK1, OPRM1, and OPRD1 in
    BRET dissociation assays.
  hypothesis: >-
    C-terminally shorter products (dynorphin A(1-8), alpha-neoendorphin) exhibit reduced
    beta-arrestin-2 recruitment relative to full-length dynorphin A(1-17) at OPRK1 while retaining
    full Gi/o-mediated adenylate cyclase inhibition.
