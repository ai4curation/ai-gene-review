id: Q5T2T1
gene_symbol: MPP7
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: MPP7 (MAGUK p55 subfamily member 7) is a vertebrate membrane-associated guanylate kinase
  (MAGUK) scaffold with two N-terminal L27 domains, a PDZ domain, an SH3 domain with a HOOK region, and
  a C-terminal guanylate kinase-like domain that, like other MAGUK GUK domains, is not expected to act
  as an enzyme. In human epithelial cells, MPP7 heterodimerizes with LIN7A, LIN7B or LIN7C through its
  C-terminal L27 domain. The MPP7-LIN7 dimer then recruits DLG1 through the MPP7 N-terminal L27 domain,
  forming a 1:1:1 MPP7-DLG1-LIN7 complex whose L27 core has been solved by X-ray crystallography. MPP7
  stabilizes DLG1 and targets the complex to adherens junctions and the lateral plasma membrane; its own
  lateral targeting depends on DLG1 and, via the SH3-HOOK region, on CRB3/PALS1. Depletion of MPP7 in
  Caco-2 cells impairs the formation and maintenance of functional tight junctions. A basic-hydrophobic
  motif in MPP7 binds phospholipids, and phosphorylation by aPKC releases it from the cell cortex. In
  mouse muscle satellite cells, Mpp7 is a CREB target required, with AMOT, for nuclear accumulation of
  YAP1 and for stem cell expansion and self-renewal; this role has not been tested in human cells.
