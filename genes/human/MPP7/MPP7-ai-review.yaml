core_functions:
- description: Central scaffold of the MPP7-DLG1-LIN7 tripartite complex. Its C-terminal L27 domain heterodimerizes
    with LIN7, and its N-terminal L27 domain then recruits DLG1. MPP7 stabilizes DLG1 and directs the
    complex to epithelial adherens junctions.
  molecular_function:
    id: GO:0140378
    label: protein complex scaffold activity
  directly_involved_in:
  - id: GO:0071896
    label: protein localization to adherens junction
  locations:
  - id: GO:0005912
    label: adherens junction
  - id: GO:0016328
    label: lateral plasma membrane
  in_complex:
    id: GO:0097025
    label: MPP7-DLG1-LIN7 complex
  supported_by:
  - reference_id: PMID:17237226
    supporting_text: The amino-terminal L27 domain of MPP7 is not sufficient for interaction with DLG1
      but interacts efficiently only if MPP7 is in a complex with LIN7A or -C.
  - reference_id: PMID:17237226
    supporting_text: Expression of MPP7 deleted of the PDZ or Src homology 3 domain redistributes MPP7,
      DLG1, and LIN7 out of adherens junctions and into the soluble cytoplasmic fraction without changing
      the localization of E-cadherin.
  - reference_id: PMID:20702775
    supporting_text: the loop αA-αB and helix αB of the C-terminal L27 domain of MPP7 play a critical
      role in assembling the entire tripartite complex
- description: L27-domain-mediated binding of DLG1 at the lateral membrane, needed for formation and maintenance
    of functional epithelial tight junctions (shown by knockdown and TER in Caco-2 cells).
  molecular_function:
    id: GO:0097016
    label: L27 domain binding
  directly_involved_in:
  - id: GO:0070830
    label: bicellular tight junction assembly
  locations:
  - id: GO:0005923
    label: bicellular tight junction
  - id: GO:0016328
    label: lateral plasma membrane
  supported_by:
  - reference_id: PMID:17332497
    supporting_text: We find that MPP7 targets to the lateral surface of epithelial cells via its L27N
      domain, through an interaction with hDlg1.
  - reference_id: PMID:17332497
    supporting_text: Loss of either hDlg1 or MPP7 from epithelial Caco-2 cells results in a significant
      defect in the assembly and maintenance of functional tight junctions.
suggested_questions:
- question: Does MPP7 bridge the Crumbs (CRB3-PALS1) and Dlg polarity complexes in vivo, or are its PALS1
    and DLG1 interactions sequential and transient?
- question: Is the tight junction defect after MPP7 loss due to reduced junction assembly or to reduced
    dynamic stability of already-formed junctions, given that occludin and ZO-1 localize normally?
- question: Does human MPP7 have the AMOT/YAP-TAZ co-regulatory role reported for mouse muscle stem cells,
    and does that role need its junctional L27 complex or a separate pool?
- question: MPP7 (PANTHER SF39) and Drosophila Metro / C. elegans MAGU-1 (SF42) are in sister subfamilies
    with no one-to-one orthology. Which features of the LIN7-dependent DLG1 recruitment are shared by
    the clade, and which are specific to the MPP7 lineage?
suggested_experiments:
- description: MPP7 knockout in polarized epithelial organoids or MDCK/Caco-2 3D cysts, with live imaging
    of junction assembly and turnover (FRAP of ZO-1/occludin), to separate assembly from maintenance.
  experiment_type: genetic perturbation with live imaging
- description: Rescue of MPP7-null cells with L27N, L27C, SH3-HOOK and PRBH phospho-site mutants, to map
    which interactions and aPKC regulation are needed for DLG1 junctional targeting and TER.
  experiment_type: structure-function rescue
