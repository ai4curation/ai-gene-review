core_functions:
- description: Binds collagen through the vWFA2 region and associates with extracellular matrix. Sulfated-glycan
    recognition provides a complementary matrix-binding capability. Human domain and engineered-reporter
    assays establish these interactions; mouse tendon phenotypes support matrix maintenance without resolving
    a separate direct tensile or collagen-assembly activity. The alternative product replaces part of
    vWFA2, so equal full-product activity is untested.
  molecular_function:
    id: GO:0005518
    label: collagen binding
  locations:
  - id: GO:0031012
    label: extracellular matrix
  supported_by:
  - reference_id: PMID:22610276
  - reference_id: PMID:19013156
  - reference_id: PMID:35901072
  - reference_id: PMID:40094079
- description: The released LCCL region exhibits chemoattractant activity in an assay with human recombinant
    reagent and isolated mouse neutrophils. Lower-chamber exposure increases Transwell migration relative
    to no LCCL; chemokinesis and a responder-derived relay remain unexcluded without checkerboard or receptor
    tests. Separately, mouse lung infection studies place cochlin upstream of MCP-1/KC production and
    subsequent recruitment. These routes are distinguished rather than assigning every immune effect to
    direct attraction. The exact active natural product remains unresolved; other proteases release the
    LCCL region.
  molecular_function:
    id: GO:0042056
    label: chemoattractant activity
  supported_by:
  - reference_id: PMID:30905438
  - reference_id: PMID:23684986
  - reference_id: PMID:41803274
  - reference_id: file:human/COCH/COCH-primary-excerpts.md
  locations:
