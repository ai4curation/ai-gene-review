  review:
    action: NEW
    summary: Human recombinant LCCL promotes mouse neutrophil migration toward the lower Transwell chamber.
    reason: 'Original Figure 7E and STAR Methods compare isolated mouse marrow neutrophils migrating into
      a lower chamber containing purified human LCCL with a no-LCCL control (five replicates per condition).
      The key-resource table distinguishes this reagent from the full-length processing construct. This
      controlled asymmetric exposure supports assay-scoped chemoattractant activity beyond infection rescue
      alone. A checkerboard assay was not reported: a chemokinetic contribution or responder-derived relay
      is not excluded, and receptor-dependent directional sensing is not established. PMID:23684986 instead
      links reduced MCP-1/KC secretion to later recruitment defects in infected mouse lung; that indirect
      route is immune context, not the direct assay supporting this MF. No exact natural isoform or all-product
      activity is inferred. The axon-guidance-specific child does not fit and typed coverage remains nonredundant.'
