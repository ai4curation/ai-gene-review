description: Cochlin is a secreted extracellular-matrix glycoprotein with an N-terminal LCCL domain and
  two von Willebrand factor A domains. Its collagen-binding and sulfated-glycan-binding capacities connect
  it to matrix organization and maintenance, especially in the inner ear. Pathogenic COCH variants can
  cause dominant progressive audiovestibular disease, while biallelic loss of function also impairs hearing.
  Proteolytic release of the LCCL region produces a distinct immune-active fragment that can aggregate
  bacteria and attract immune cells. Cochlin also influences cell shape in cultured human trabecular-meshwork
  cells.
