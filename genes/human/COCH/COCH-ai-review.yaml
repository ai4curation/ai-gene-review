    label: extracellular region
suggested_questions:
- question: Which natural cochlin cleavage products and receptors account for neutrophil attraction, and
    how do they differ from the intact matrix-associated protein?
- question: Does the C-terminal replacement in O43405-2 alter secretion, collagen binding or glycan specificity
    despite retaining the LCCL sequence?
- question: What direct interaction or physical mechanism connects cochlin to tendon fibril organization,
    and which tissues place it within a basement-membrane versus interstitial solid matrix?
suggested_experiments:
- description: Compare sequence-verified canonical and alternative full-length human products, purified
    collagen-binding domains and native cleavage products in matched secretion, collagen and glycan-binding
    assays.
  hypothesis: The altered vWFA2 tail changes matrix engagement without necessarily abolishing all LCCL-associated
    activities.
- description: Use purified sequence-defined human LCCL with checkerboard Transwell gradients and receptor
    perturbations in human neutrophils, controlling viability and general motility.
  hypothesis: The increased migration in the lower-chamber assay contains a gradient-dependent component
    separable from chemokinesis or responder-derived chemokine signaling.
- description: Localize endogenous cochlin by immunogold microscopy against basement-membrane and interstitial-matrix
    markers, with validated antibody and tissue controls.
  hypothesis: Cochlin occupies tissue-specific matrix compartments that broad matrisome classification
    cannot resolve.
