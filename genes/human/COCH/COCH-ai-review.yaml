- term:
    id: GO:0008201
    label: heparin binding
  evidence_type: IDA
  original_reference_id: PMID:35901072
  qualifier: enables
  review:
    action: NEW
    summary: A human cochlin reporter construct recognizes heparin with sulfation-dependent specificity.
    reason: The original Methods describe a sequence-checked human cochlin clone carrying a reported natural
      T-to-S variant, fused to CD8alpha/CD3zeta in a cell-surface reporter. Heparin induces the reporter,
      whereas N-desulfation reduces the response; expression controls and a CD8alpha/CD3zeta construct
      lacking the cochlin moiety are reported. The human cochlin moiety, rather than the reporter tags
      alone, is therefore the supported binding determinant in this assay; no native receptor activity
      is assigned. Independent purified mouse cochlin-Fc/Protein-A assays corroborate binding but are
      not relabeled as human experiments. Later mouse domain-deletion data require vWA1 and do not support
      assigning this activity to isolated LCCL. This is a supported secondary matrix-binding capability,
      not a new process or an assertion that every natural product has identical specificity.
    supported_by:
    - reference_id: PMID:35901072
      supporting_text: human cochlin was preferentially bound to HP
    - reference_id: PMID:36511224
