core_functions:
- description: Dynein regulator that binds the cytoplasmic dynein intermediate and light chains and recruits
    LIS1 to autoinhibited dynein, promoting assembly of active dynein-dynactin-adaptor complexes before
    being displaced by dynactin; it acts at kinetochores (recruited by CENP-F; chromosome alignment and
    spindle orientation) and at the late-G2 nuclear envelope (NUP133-CENP-F platform; apical interkinetic
    nuclear migration and centrosome-nucleus coupling in neural progenitors).
