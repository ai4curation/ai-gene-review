- term:
    id: GO:0022027
    label: interkinetic nuclear migration
  evidence_type: IMP
  original_reference_id: PMID:27553190
  qualifier: involved_in
  review:
    summary: NDE1 knockdown in embryonic rat radial glial progenitors completely blocks apical (G2) interkinetic
      nuclear migration; nuclei arrest near the ventricle, as with CENP-F or NUP133 knockdown. CDK1 phosphosites
      T215/T243 are required.
    action: NEW
    reason: 'Participation: NDE1 is part of the motor-regulatory machinery itself (binds dynein and recruits
      LIS1 to it at the nuclear envelope), not merely a requirement. Comparator: adaptors/regulators in
      the same role (Hook3, PCM1, TACC proteins) carry GO:0022027. Paralog asymmetry: NDEL1 knockdown
      does not block apical INM.'
    supported_by:
    - &id020
      reference_id: PMID:27553190
      supporting_text: However, NDE1 inhibition alone causes a complete block of apical INM, contributing
        to a large reduction in mitotic index with no evidence for ectopic mitoses.
    - &id018
      reference_id: PMID:27553190
      supporting_text: Altogether, these results provide further evidence for the requirement of NDE1
        during late-G2 dynein recruitment to the nuclear envelope, and reveal a new NDE1-specific role
        after completion of apical INM but before mitotic entry.
    - reference_id: PMID:27553190
      supporting_text: RNAi against the NDE1 paralogue NDEL1 has no such effects.
    - reference_id: PMID:39167527
      supporting_text: We find that Nde1 T215 and T243 phosphomutants block apical interkinetic nuclear
        migration (INM) and, consequently, mitosis in radial glial progenitor cells.
    - &id024
      reference_id: file:human/NDE1/NDE1-deep-research-falcon.md
      supporting_text: Depletion impairs apical interkinetic nuclear migration, whereas NDEL1 depletion
        does not reproduce this progenitor phenotype.
