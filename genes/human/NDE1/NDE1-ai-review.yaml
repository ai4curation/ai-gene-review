  review:
    summary: PAINT IBA for establishment of mitotic spindle orientation.
    action: ACCEPT
    reason: NudE-family proteins regulate cortical/kinetochore dynein, and loss of Nde1 in mice causes
      defective mitotic orientation in cortical progenitors; depletion in human cells causes spindle rotation.
      Accept.
    supported_by:
