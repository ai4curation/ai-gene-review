- term:
    id: GO:0005871
    label: kinesin complex
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: part_of
  supporting_entities:
  - PANTHER:PTN000100519
  - RGD:621235
  review:
    summary: PAINT IBA placing NudE-family proteins in the kinesin complex.
    action: REMOVE
    reason: NDE1 is a regulator of cytoplasmic dynein, not a subunit of a kinesin complex. The node draws
      on rat Ndel1 data; even if Ndel1 associates with kinesin-1 in some contexts, this does not make
      NDE1 part of a kinesin complex, and no human NDE1 data support it.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - ROLE_CONFLATION
      source_entities:
      - source_id: PANTHER:PTN000100519
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: Node seeded by rat Ndel1 (RGD:621235); a kinesin association of a dynein regulator does
          not justify part_of kinesin complex for the NudE family.
    supported_by:
    - &id007
      reference_id: PMID:17682047
      supporting_text: Surprisingly, NudE interacted not with the dynein motor domain but with both the
        intermediate chain IC2C and the light chain LC8.
