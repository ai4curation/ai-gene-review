id: Q9NXR1
gene_symbol: NDE1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: NDE1 (nuclear distribution protein nudE homolog 1) is a coiled-coil dynein regulator of the
  NudE family, paralogous to NDEL1. Its N-terminal coiled coil dimerizes (and can form mixed complexes
  with NDEL1) and binds LIS1, while the C-terminal region binds the cytoplasmic dynein intermediate and
  light chains; NDE1 thereby recruits LIS1 to autoinhibited dynein and promotes LIS1-mediated assembly
  of active dynein-dynactin-cargo adaptor complexes, dissociating when dynactin binds the intermediate
  chain; at high levels it inhibits motility. NDE1 is concentrated at the centrosome/mother centriole
  throughout the cell cycle, on the mitotic spindle and spindle poles, and at kinetochores, where it is
  recruited by CENP-F and is needed for kinetochore dynein, chromosome alignment and spindle orientation.
  In late G2, CENP-F bound to the nucleoporin NUP133 recruits NDE1/NDEL1 and thus dynein and LIS1 to the
  nuclear envelope, keeping centrosomes tethered to the nucleus and, in radial glial progenitors of the
  developing neocortex, driving apical interkinetic nuclear migration; NDE1, regulated by CDK1 phosphorylation,
  is specifically required for this step and for subsequent mitotic entry. NDE1 also restrains primary
  cilium length at the mother centriole, acts as a RAB9 effector linking late endosomes to dynein for
  retrograde transport to the trans-Golgi network, and contributes to neuronal migration. Biallelic loss-of-function
  mutations cause microlissencephaly (lissencephaly 4) and microhydranencephaly, reflecting failed neural
  progenitor proliferation and neurogenesis.
