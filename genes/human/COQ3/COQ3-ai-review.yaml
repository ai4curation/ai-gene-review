suggested_questions:
- question: Does phosphorylation of COQ3 by COQ8B, observed with ancestral proteins in vitro (PMID:38425362),
    occur on extant human COQ3 in mitochondria, and does it regulate the COQ6-COQ3 C5 modification?
suggested_experiments:
- description: Assay purified extant human COQ3 (not the ancestral reconstruction) with DHDB and demethyl-CoQ
    analogues, with and without COQ8B-mediated phosphorylation, to confirm the kinetics measured on the
    ancestral enzyme.
