id: Q9NZJ6
gene_symbol: COQ3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'COQ3 encodes the mitochondrial S-adenosyl-L-methionine-dependent O-methyltransferase of
  coenzyme Q10 biosynthesis, a member of the UbiG/COQ3 family of class I methyltransferases. After import
  via an N-terminal transit peptide it associates peripherally with the matrix face of the inner mitochondrial
  membrane as a subunit of the COQ complex (complex Q, with COQ4, COQ5, COQ6, COQ7 and COQ9). COQ3 catalyses
  two non-consecutive O-methylations of the benzoquinone ring: methylation of 3,4-dihydroxy-5-decaprenylbenzoate
  to 4-hydroxy-3-methoxy-5-decaprenylbenzoate early in ring modification, and the final methylation of
  3-demethylubiquinol (or 3-demethylubiquinone) to ubiquinol-10 (ubiquinone-10). The reaction requires
  Mg2+, and COQ3 is phosphorylated by COQ8B in vitro. Human COQ3 restores CoQ synthesis in yeast coq3
  null mutants, and its loss causes primary CoQ10 deficiency.'
