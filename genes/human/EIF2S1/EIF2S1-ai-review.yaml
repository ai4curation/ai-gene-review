gene_symbol: EIF2S1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  EIF2S1 encodes eIF2alpha, the regulatory alpha subunit of the heterotrimeric translation initiation
  factor eIF2 (alpha, beta and gamma subunits). eIF2 binds GTP and initiator Met-tRNAi to form the ternary
  complex, which joins the 40S ribosomal subunit in the 43S/48S pre-initiation complex that scans mRNA
  for the start codon; after start-codon recognition eIF2-GDP is released and recycled to eIF2-GTP by
  the guanine nucleotide exchange factor eIF2B. eIF2 is a general initiation factor used by capped and
  IRES-driven mRNAs alike, not a cap- or IRES-binding factor. eIF2alpha is the convergence point of the
  integrated stress response: the kinases HRI (EIF2AK1), PKR (EIF2AK2), PERK (EIF2AK3) and GCN2 (EIF2AK4)
  phosphorylate its Ser52 (Ser51 in mature numbering) in response to heme deficiency and mitochondrial
  stress, viral dsRNA, ER stress and amino-acid starvation. Phosphorylated eIF2 binds and inhibits eIF2B,
  lowering ternary complex, attenuating global initiation and derepressing uORF-controlled mRNAs such
  as ATF4, and it triggers stress granule assembly. PP1 holophosphatases targeted by PPP1R15A (GADD34)
  and PPP1R15B (CReP) remove the phosphate. eIF2alpha is cytosolic; after HRI activation, phosphorylated
  eIF2alpha also accumulates on the mitochondrial surface, where it can trigger PARKIN-independent mitophagy.
