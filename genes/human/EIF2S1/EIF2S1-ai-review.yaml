- term:
    id: GO:0034198
    label: cellular response to amino acid starvation
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q6ZWX6
  - ensembl:ENSMUSP00000071214
  review:
    summary: The amino-acid-starvation arm of the ISR runs through eIF2-alpha phosphorylation by GCN2.
    action: ACCEPT
    reason: 'This is one of the four canonical stress inputs that converge on this protein: GCN2 phosphorylates
      eIF2-alpha Ser-52 on amino acid starvation, and eIF2-alpha is the entity that then inhibits eIF2B and redirects
      translation. The evidence here is orthology-based and the human GCN2 statement in UniProt is itself by similarity,
      which is why the mechanistic sibling term GO:0140469 GCN2-mediated signaling is raised as a question rather
      than asserted (see suggested_questions) even though the gene carries the HRI and PERK branch terms by IDA.'
    supported_by:
    - reference_id: file:human/EIF2S1/EIF2S1-uniprot.txt
      record_section: ["CC:PTM"]
      supporting_text: Phosphorylation on Ser-52 by the EIF2AK4/GCN2 protein kinase occurs in response to amino
        acid starvation and UV irradiation (By similarity)
    - reference_id: file:human/EIF2S1/EIF2S1-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: 'EIF2S1/eIF2-alpha is a key component of the integrated stress response (ISR), required for
        adaptation to various stress: phosphorylation by metabolic-stress sensing protein kinases (EIF2AK1/HRI,
        EIF2AK2/PKR, EIF2AK3/PERK and EIF2AK4/GCN2) in response to stress converts EIF2S1/eIF2-alpha in a global
        protein synthesis inhibitor'
