- term:
    id: GO:0005741
    label: mitochondrial outer membrane
  evidence_type: IC
  original_reference_id: PMID:38340717
  qualifier: located_in
  review:
    summary: Phospho-eIF2alpha recruited during HRI-branch activation sits on the cytosolic face of the mitochondrial
      outer membrane.
    action: NEW
    reason: 'Added as the sub-compartment beside the retained GO:0005739 rows, as projects/ORGANELLES.md directs,
      because three independent lines agree and none of them is the organelle-level assay alone: subcellular fractionation
      with an ER-marker control that excludes mitochondria-associated ER membranes, quantified colocalization with
      the outer-membrane marker TOM20, and a Fis1-anchored outer-membrane tethering experiment in which the phosphomimetic
      reconstitutes the mitophagy phenotype. The topology is forced: eIF2alpha is a cytosolic protein recruited
      to the organelle surface, with no presequence and no transmembrane segment, so the outer membrane is the only
      compartment compatible with the function. IC rather than IDA because this is an inference the review authors
      draw from the published assays rather than a single experiment resolving the compartment.'
    supported_by:
