  review:
    summary: >-
      IBA from PAINT node PTN000063907 (eIF2alpha family), with experimental seeds including yeast SUI2,
      mouse Eif2s1 and human EIF2S1.
    action: ACCEPT
    reason: >-
      eIF2 is the canonical initiation factor that forms the eIF2-GTP-Met-tRNAi ternary complex and delivers
      it to the 40S subunit; eIF2alpha is an essential subunit, conserved across eukaryotes. GO:0003743
      is the correct level (eIF2 is neither cap- nor IRES-specific).
    supported_by:
    - reference_id: file:human/EIF2S1/EIF2S1-uniprot.txt
      record_section:
      - CC:FUNCTION
      supporting_text: >-
        Member of the eIF2 complex that functions in the early steps of protein synthesis by forming a
        ternary complex with GTP and initiator tRNA
    - reference_id: PMID:23063529
      supporting_text: >-
        Together with GTP and initiator methionyl-tRNA, translation initiation factor eIF2 forms a ternary
        complex that binds the 40S ribosome and then scans an mRNA to select the AUG start codon for protein
        synthesis.
