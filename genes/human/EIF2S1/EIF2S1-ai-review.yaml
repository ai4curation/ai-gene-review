  review:
    summary: >-
      InterPro S1-domain mapping to nucleic acid binding. The eIF2alpha N-terminal domain is an OB-fold
      S1 domain; mRNA interactome-capture studies place EIF2S1 among RNA-bound proteins.
    action: MODIFY
    reason: >-
      The S1 domain and interactome-capture data support RNA (not generic nucleic acid) binding, which
      the gene already carries (GO:0003723). The generic parent is refined to RNA binding, kept non-core
      because eIF2 activity is defined by Met-tRNAi delivery rather than by mRNA binding by the alpha
      subunit.
