- term:
    id: GO:0000423
    label: mitophagy
  evidence_type: IDA
  original_reference_id: PMID:38340717
  qualifier: involved_in
  review:
    summary: Phospho-eIF2alpha accumulating on the mitochondrial outer membrane is necessary and sufficient to trigger
      PINK1/PRKN-independent mitophagy.
    action: MODIFY
    proposed_replacement_terms:
    - id: GO:1901526
      label: positive regulation of mitophagy
    reason: The experiments are strong (fractionation with an ER-marker control, TOM20 colocalization, and Fis1-anchored
      tethering of the S51D phosphomimetic reconstituting the phenotype), but they show that eIF2alpha supplies
      the signal, not that it does any of the work of autophagic engulfment; the authors state the downstream mechanism
      is unresolved. Regulation is what the data support, and it matches GO:1901526 already carried by the HRI kinase
      EIF2AK1 for the same pathway. This is a lateral regulation-of shift, not a refinement, so the replacement
      is not a descendant.
    supported_by:
    - reference_id: PMID:38340717
      supporting_text: Activation of the HRI branch results in mitochondrial localization of phosphorylated eukaryotic
        initiation factor 2, which we show is sufficient to induce mitophagy.
      reference_section_type: ABSTRACT
    - reference_id: PMID:38340717
      supporting_text: Taken together, these results indicate that phosphorylation and mitochondrial localization
        of EIF2α are necessary and sufficient to trigger mitophagy.
      reference_section_type: RESULTS
    - reference_id: PMID:38340717
      supporting_text: Accompanying this mitochondrial localization, a substantial increase in mitophagy was measured
        in K562 cells expressing EIF2αS51D but not in cells expressing EIF2αWT or EIF2αS51A (Figure 5B).
      reference_section_type: RESULTS
    - reference_id: PMID:38340717
      supporting_text: More experiments will be needed to understand the mechanism whereby p-EIF2 on the mitochondrial
        surface results in recruitment or initiation of autophagosomes.
      reference_section_type: DISCUSSION
    - reference_id: file:human/EIF2S1/EIF2S1-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: 'EIF2S1/eIF2-alpha also acts as an activator of mitophagy in response to mitochondrial damage:
        phosphorylation by EIF2AK1/HRI promotes relocalization to the mitochondrial surface, thereby triggering
        PRKN-independent mitophagy'
      reference_section_type: DATABASE_ENTRY
