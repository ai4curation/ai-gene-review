  - UniProtKB:P05198
  review:
    summary: Initiation-factor activity inherited from the ancestral eIF2-alpha node; refined to the cap-dependent
      child the gene already carries.
    action: MODIFY
    reason: 'The IBD sits on PTN000063907 in PTHR10602 and was seeded from Drosophila, mouse, S. cerevisiae SUI2
      and human P05198 itself; self-appearance in WITH/FROM is legitimate grounding, not circularity, and marks
      that experimental support exists on the target. The node placement is sound - every eukaryotic member delivers
      Met-tRNAi for initiation. The term is nevertheless the parent of GO:0160296, which this gene already carries
      by IDA, so refine to the cap-dependent child; the IRES-mediated sibling is not a conserved cellular activity
      of the clade and is handled on its own row. eIF2-alpha does not catalyse initiation on its own: the activity
      belongs to the alpha/beta/gamma trimer, which is why core_functions records it under contributes_to_molecular_function.'
    proposed_replacement_terms:
