      supporting_text: Analysis of the subcellular fractions with an ER marker showed no evidence of ER enrichment
        of p-EIF2α upon DFP treatment
    - reference_id: PMID:38340717
      supporting_text: Activation of the HRI branch results in mitochondrial localization of phosphorylated eukaryotic
