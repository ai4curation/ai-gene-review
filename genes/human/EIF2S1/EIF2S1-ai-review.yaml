      transcriptional programme that determines cell fate under pathological ER stress.
    supporting_text: We identified QRICH1 as a key effector of the PERK-eIF2α axis of the UPR.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only in the cache. GOA records both GO:0034976 and GO:0036499 for EIF2S1 from this reference,
      which is why the general row is refined to the branch-specific one. UniProt also cites it for ER-stress-induced
      up-regulation of EIF2S1.
  full_text_unavailable: true
