suggested_questions:
- question: Is there direct human evidence that would support annotating EIF2S1 to GO:0140469 GCN2-mediated signaling?
    The gene carries the sibling branch terms GO:0140468 HRI-mediated signaling and GO:0036499 PERK-mediated unfolded
    protein response by IDA, and GO annotates GO:0140468 across the whole HRI transduction chain including eIF2-alpha,
    so the absence of the GCN2 term looks like a gap rather than a convention. The human GCN2 statement in UniProt
    is annotated by similarity, and the amino-acid-starvation rows in GOA are ISS/IEA, so no human assay was identified
    here.
- question: What mitochondrial protein does phosphorylated eIF2-alpha engage at the outer membrane, and does that
    contact warrant a more specific molecular function than ribosome binding? PMID:38340717 shows the localisation
    is sufficient for mitophagy and that the defect on HRI loss is at autophagosome recruitment, but no receptor
    is identified.
- question: Should the stress-granule localisation and stress-granule assembly rows be upgraded from orthology-based
    evidence? eIF2-alpha is a standard stress-granule marker in human cells, yet both the GOA rows and the UniProt
    location are ISS/by-similarity from the mouse ortholog Q6ZWX6, so a human IDA appears to be missing from the
    record rather than from the literature.
- question: Is the reproducible eIF2-alpha/PRMT7 interaction, recovered independently in PMID:32296183 and PMID:33961781,
    functionally meaningful - for example is eIF2-alpha arginine-methylated, and does that affect Ser-52 phosphorylation
    or eIF2B binding? Both rows are bare protein binding and neither study assigns a mechanism.
suggested_experiments:
- hypothesis: Phosphorylated eIF2-alpha at the mitochondrial outer membrane recruits a specific autophagy adaptor
    or receptor, and that adaptor is required for HRI-branch mitophagy.
  description: Use the rapalog-inducible FKBP-eIF2-alpha(S51D)/FRB-Fis1 tethering system of PMID:38340717 with proximity-dependent
    biotinylation (TurboID fused to the tethered construct) and compare the S51D, wild-type and S51A labelling proteomes
    at matched mitochondrial loading. Validate candidate adaptors by knockdown in the mito-mKeima assay under DFP,
    BTdCPU and CCCP, and test whether re-targeting the candidate to peroxisomes makes tethered S51D competent to
    drive pexophagy, which would separate the receptor contribution from the organelle-specific requirement.
  experiment_type: Proximity labelling with tethering-based gain of function and mitophagy reporter epistasis
- hypothesis: GCN2 activation in human cells drives eIF2-alpha-dependent outputs with the same dependence on Ser-52
    as the HRI and PERK branches, which would ground a human GO:0140469 annotation for EIF2S1.
  description: In human cells carrying an endogenous EIF2S1 S52A knock-in alongside the wild-type parental line,
    activate GCN2 by histidinol or leucine withdrawal (with GCN2 knockout and a GCN2 inhibitor as specificity controls)
    and measure ATF4 reporter induction, polysome profiles and ribosome-profiling initiation signatures. Run PERK
    (thapsigargin) and HRI (BTdCPU) activation in parallel on the same lines so the GCN2 branch is scored against
    branches for which eIF2-alpha participation is already established by IDA.
  experiment_type: Phosphoacceptor knock-in epistasis with branch-selective pharmacology and ribosome profiling
- hypothesis: A measurable fraction of phospho-eIF2-alpha escapes eIF2B sequestration, and that free fraction rather
    than total p-eIF2-alpha determines the non-translational outputs.
  description: Quantify, by sucrose-gradient fractionation combined with absolute quantification mass spectrometry,
    the partition of p-eIF2-alpha between eIF2B-bound and free pools across HRI, PERK, PKR and GCN2 activation,
    in parental cells and in cells depleted of EIF2B3 or EIF2B4. Correlate the free fraction with mitophagy flux
    and with ATF4 induction to test which output tracks which pool.
  experiment_type: Quantitative complex-partition proteomics with branch-selective activation
