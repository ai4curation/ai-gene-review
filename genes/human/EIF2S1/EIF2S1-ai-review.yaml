- term:
    id: GO:1990624
    label: guanyl nucleotide exchange factor inhibitor activity
  evidence_type: IDA
  original_reference_id: PMID:31048492
  qualifier: enables
  review:
    summary: 'Phosphorylated eIF2alpha converts eIF2 from a substrate of eIF2B into an inhibitor of it:
      cryo-EM and crystal structures of human eIF2B bound to unphosphorylated versus Ser-phosphorylated
      eIF2 show two distinct binding modes, nucleotide-exchange-active and -inactive, and ELISA with recombinant
      human subunits shows the eIF2-eIF2B interaction is enhanced by eIF2alpha phosphorylation or the
      S51D phosphomimetic. This is the molecular mechanism of the integrated stress response and it has
      no molecular function annotation on human EIF2S1.'
    action: NEW
    reason: 'eIF2alpha itself does the work: the phosphorylated Ser52 loop is the moiety that engages
      the eIF2B regulatory subcomplex in the exchange-inactive mode, so the inhibition is not merely an
      outcome that eIF2alpha is necessary for. The comparator check supports adding rather than withholding
      the term: PomBase has already annotated the S. pombe ortholog eIF2alpha (tif211, UniProtKB:P56286)
      to GO:1990624 with TAS from PMID:31048492 (QuickGO, 2026-10-29), and the structures that paper reports
      contain the human eIF2alpha chain (PDB 6K71 and 6K72, chain K = P05198 residues 1-315), so the human
      annotation is better grounded than the ortholog row it was transferred to. The term is neither an
      ancestor nor a descendant of anything else annotated to this gene: it sits under GO:0004857 enzyme
      inhibitor activity, whereas the existing molecular functions are under GO:0003743. GO:0140467 integrated
      stress response signaling is deliberately not proposed, being an ancestor of the already-accepted
      GO:0036499 and GO:0140468.'
    supported_by:
    - reference_id: PMID:31048492
      supporting_text: 'The unphosphorylated and phosphorylated forms of eIF2 bind to eIF2B in completely
        different manners: the nucleotide exchange-active and -inactive modes, respectively.'
      reference_section_type: ABSTRACT
    - reference_id: PMID:31048492
      supporting_text: These structures explain how phosphorylated eIF2 dominantly inhibits the nucleotide
        exchange activity of eIF2B.
      reference_section_type: ABSTRACT
    - reference_id: PMID:29599213
      supporting_text: Phosphorylation converts eIF2 from a substrate to a competitive inhibitor of its
        dedicated guanine nucleotide exchange factor, eIF2B, thereby inhibiting translation.
      reference_section_type: ABSTRACT
    - reference_id: PMID:16288713
      supporting_text: the beta-subunit specifically interacts with the purified eIF2B in ELISA studies
        and this interaction is enhanced when wt eIF2alpha in the recombinant trimeric complex is phosphorylated
        or replaced by a mutant phosphomimetic eIF2alpha (S51D)
      reference_section_type: ABSTRACT
    - reference_id: file:human/EIF2S1/EIF2S1-uniprot.txt
      supporting_text: Activity is regulated by phosphorylation at Ser-49 and Ser-52, which stabilizes
        the eIF2/GDP/eIF2B complex and prevents the eIF2B-mediated exchange of GDP for GTP, thereby preventing
        the formation of the 43S pre-initiation complex (43S PIC)
      record_section:
      - CC:ACTIVITY REGULATION
      reference_section_type: DATABASE_ENTRY
