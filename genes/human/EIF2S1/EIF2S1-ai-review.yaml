    reason: 'eIF2alpha''s N-terminal S1/OB fold is an RNA-binding domain, and eIF2 sits on mRNA in the
      43S/48S pre-initiation complex, so crosslinking to polyadenylated RNA is expected rather than artefactual.
      Kept at the parent term: eIF2''s RNA ligands include both the mRNA and the initiator tRNA of the
      ternary complex, so RNA binding is the right altitude for the subunit.'
