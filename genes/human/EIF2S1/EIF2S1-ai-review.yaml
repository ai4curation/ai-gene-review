- term:
    id: GO:0003743
    label: translation initiation factor activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - FB:FBgn0261609
  - MGI:MGI:95299
