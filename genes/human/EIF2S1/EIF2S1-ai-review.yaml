- term:
    id: GO:0033290
    label: eukaryotic 48S preinitiation complex
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: part_of
  supporting_entities:
  - PANTHER:PTN000063908
  - SGD:S000003767
  review:
    summary: Membership of the 48S pre-initiation complex, inherited from the eukaryotic node.
    action: ACCEPT
    reason: 'The IBD on PTN000063908 (taxon 2759) was seeded from S. cerevisiae SUI2. The placement matches the
      mechanism: the eIF2 ternary complex joins the 40S/eIF3/eIF1A assembly to form the 43S PIC, which becomes the
      48S complex on mRNA recruitment and start-codon selection, and eIF2-alpha domain 1 is part of that assembly.
      UniProt states the complex membership directly for the human protein.'
    supported_by:
    - reference_id: GO_REF:0000033
    - reference_id: file:human/EIF2S1/EIF2S1-uniprot.txt
      record_section: ["CC:SUBUNIT"]
      supporting_text: eIF2 is member of the 43S pre-initiation complex (43S PIC).
    - reference_id: Reactome:R-HSA-72691
    - reference_id: PMID:23063529
      supporting_text: Together with GTP and initiator methionyl-tRNA, translation initiation factor eIF2 forms
        a ternary complex that binds the 40S ribosome and then scans an mRNA to select the AUG start codon for protein
        synthesis.
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN000063908
        source_label: PTN000063908
        source_status: SUPPORTS_TRANSFER
        comment: Eukaryote-restricted IBD; the 48S assembly step it describes is the one UniProt states directly
          for the human protein.
      - source_id: SGD:S000003767
        source_label: SUI2 (S. cerevisiae)
        source_status: SUPPORTS_TRANSFER
        comment: 'Sole seed. A short WITH/FROM list is not weak support: a well-characterised MOD donor can carry
          a node on its own.'
      residue_claims_not_applicable: Complex membership, not a point-residue question.
- term:
    id: GO:0034063
    label: cytoplasmic stress granule assembly
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q6ZWX6
  - ensembl:ENSMUSP00000071214
  review:
    summary: Contribution to stress-granule assembly via phospho-eIF2-alpha-stalled initiation complexes; non-core.
    action: KEEP_AS_NON_CORE
    reason: 'eIF2-alpha contributes materially rather than merely permitting: the stalled 48S-like complex that
      seeds a granule contains eIF2, and granule assembly follows its phosphorylation. The evidence here is orthology-based,
      and the human record annotates stress-granule localisation by similarity as well, so the row is kept rather
      than accepted as core - assembling granules is a consequence of the initiation switch, not a separate activity
      of this protein.'
