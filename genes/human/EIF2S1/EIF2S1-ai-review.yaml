- term:
    id: GO:0005739
    label: mitochondrion
  evidence_type: IDA
  original_reference_id: PMID:38340717
  qualifier: is_active_in
  review:
    summary: >-
      Biochemical fractionation and TOM20 co-immunostaining show phospho-eIF2alpha accumulating on mitochondria
      after HRI activation (DFP), with an ER marker excluding ER contamination of the fraction.
    action: KEEP_AS_NON_CORE
    reason: >-
      Direct evidence (fractionation checked with an ER marker, plus imaging) for stress-induced recruitment
      of p-eIF2alpha to the mitochondrion; peripheral to the core cytosolic initiation role. Per the organelle
      policy the root term is kept and no sub-compartment is added - this is transient recruitment to
      the organelle surface, not an outer-membrane location.
    supported_by:
    - reference_id: PMID:38340717
      supporting_text: >-
        However, DFP treatment resulted in notable accumulation of p-EIF2α in the mitochondrial fraction,
        whereas Tg treatment resulted in p-EIF2α localization almost exclusively in the cytosolic fraction
        (Figure 4A).
    - reference_id: PMID:38340717
      supporting_text: >-
        Analysis of the subcellular fractions with an ER marker showed no evidence of ER enrichment of
        p-EIF2α upon DFP treatment (Figure S4C).
