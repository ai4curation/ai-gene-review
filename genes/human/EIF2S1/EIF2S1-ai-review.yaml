    action: MODIFY
    proposed_replacement_terms:
    - id: GO:0019901
      label: protein kinase binding
    reason: 'Bare protein binding is uninformative. The partner is an eIF2alpha kinase and eIF2alpha is its substrate:
      the N-terminal domain of eIF2alpha docks on an extensive face of the kinase C-lobe, the same surface the vaccinia
      K3L pseudosubstrate mimics. GO:0019901 protein kinase binding states that.'
    supported_by:
    - reference_id: PMID:18971339
      supporting_text: Our results support the identification of the eIF2alpha-binding site on an extensive face
        of the C-terminal lobe of the kinase domain, and they indicate that subtle changes to the PKR kinase domain
        can drastically impact pseudosubstrate inhibition while leaving substrate phosphorylation intact.
      reference_section_type: ABSTRACT
    - reference_id: PMID:9431994
      supporting_text: Homologous regions of the alpha subunit of eukaryotic translational initiation factor 2 (eIF2alpha)
        and the vaccinia virus K3L gene product interact with the same domain within the dsRNA-activated protein
        kinase (PKR).
      reference_section_type: TITLE
