suggested_questions:
- question: >-
    The inhibitory state of phosphorylated eIF2 (tight, non-productive binding to eIF2B that blocks its
    exchange activity) fits GO:1990624 guanyl nucleotide exchange factor inhibitor activity, which this
    review uses for the phospho-eIF2 core function. Should ISR GO-CAMs type the phospho-eIF2 node with
    GO:1990624 (negatively regulating eIF2B GO:0005085) instead of duplicating EIF2S1 with cap-dependent and
    IRES-mediated activity terms, and should EIF2S1 carry a GO:1990624 annotation from PMID:10613902-type
    evidence?
- question: >-
    The UniProt-assigned GO:0160296 and GO:0160297 rows on EIF2S1 (PMID:16289705) mirror the EIF2S1 activity
    typing in GO-CAM gomodel:66b5638000001589 and its clones; should both be replaced by GO:0003743 at
    source?
suggested_experiments:
- description: >-
    Tether wild-type, S51D and S51A eIF2alpha to the mitochondrial surface in cells lacking EIF2S2 or
    EIF2S3 incorporation (or with eIF2B overexpression), and use proximity labelling to identify autophagy
    factors recruited by mitochondrial phospho-eIF2.
  hypothesis: >-
    Phosphorylated eIF2 on the mitochondrial surface recruits autophagy machinery directly, independently
    of its translational effects.
knowledge_gaps:
- gap_statement: >-
    How phosphorylated eIF2 on the mitochondrial surface triggers mitophagy, and why HRI-generated but
    not PERK-generated phospho-eIF2 accumulates there, is unknown.
  boundary: >-
    Tethering phosphomimetic eIF2alpha to mitochondria is sufficient for mitophagy without phospho-ubiquitin
    accumulation, and ISRIB does not block DFP-induced mitophagy, but no receptor or adaptor linking p-eIF2
    to autophagosome formation has been identified.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  provenance:
  - reference_id: PMID:38340717
    supporting_text: >-
      More experiments will be needed to understand the mechanism whereby p-EIF2 on the mitochondrial
      surface results in recruitment or initiation of autophagosomes.
