- term:
    id: GO:0000423
    label: mitophagy
  evidence_type: IDA
  original_reference_id: PMID:38340717
  qualifier: involved_in
  review:
    summary: 'Mitophagy: phospho-eIF2alpha accumulating on mitochondria after iron chelation is necessary
      and sufficient to trigger PINK1/PRKN-independent mitophagy.'
    action: ACCEPT
    reason: 'The gene product does the work here rather than being acted on: tethering phosphomimetic
      eIF2alpha to the mitochondrial outer membrane triggers mitophagy, while the S51A phosphomutant and
      the equivalent peroxisomal tethering do not. A genuine second core function, distinct from the translation-initiation
      role.'
    supported_by:
    - reference_id: PMID:38340717
      supporting_text: Taken together, these results indicate that phosphorylation and mitochondrial localization
        of EIF2α are necessary and sufficient to trigger mitophagy.
      reference_section_type: RESULTS
    - reference_id: PMID:38340717
      supporting_text: HRI activation results in accumulation of phosphorylated EIF2 on mitochondria,
        and we show that this localization is sufficient to trigger mitophagy.
      reference_section_type: ABSTRACT
    - reference_id: PMID:38340717
      supporting_text: These results suggest that some feature of mitochondria, in addition to pEIF2α
        targeting, is required for organellar degradation.
      reference_section_type: RESULTS
    - reference_id: file:human/EIF2S1/EIF2S1-uniprot.txt
      supporting_text: 'EIF2S1/eIF2-alpha also acts as an activator of mitophagy in response to mitochondrial
        damage: phosphorylation by EIF2AK1/HRI promotes relocalization to the mitochondrial surface, thereby
        triggering PRKN-independent mitophagy'
      record_section:
      - CC:FUNCTION
      reference_section_type: DATABASE_ENTRY
