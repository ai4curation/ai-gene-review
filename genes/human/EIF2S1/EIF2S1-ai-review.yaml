- term:
    id: GO:0000423
    label: mitophagy
  evidence_type: IDA
  original_reference_id: PMID:38340717
  qualifier: involved_in
  review:
    summary: Phosphorylated eIF2-alpha accumulating on the mitochondrial surface is the signal that triggers HRI-branch,
      PRKN-independent mitophagy.
    action: ACCEPT
    reason: 'PMID:38340717 does not merely show that eIF2-alpha is required: conditional rapalog tethering of phosphomimetic
      eIF2-alpha (S51D) to the mitochondrial outer membrane induced mitophagy without any stress, while wild-type
      and S51A tethering did not, so this protein itself performs a step of the process. Mechanistically the deficit
      on HRI loss is at autophagosome recruitment to mitochondria, downstream of PINK1/PARKIN marking, and the effect
      is organelle-selective because the same tethering to peroxisomes failed to induce pexophagy. Core function,
      not a necessity-only annotation.'
    supported_by:
    - reference_id: PMID:38340717
      supporting_text: Taken together, these results indicate that phosphorylation and mitochondrial localization
        of EIF2α are necessary and sufficient to trigger mitophagy.
    - reference_id: PMID:38340717
      supporting_text: it did result in a clear reduction in the association of LC3B-GFP with mitochondria, indicating
        a defect in the recruitment of autophagosomes to mitochondria
    - reference_id: PMID:38340717
      supporting_text: it failed to induce pexophagy, in contrast to starvation
    - reference_id: file:human/EIF2S1/EIF2S1-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: 'EIF2S1/eIF2-alpha also acts as an activator of mitophagy in response to mitochondrial damage:
        phosphorylation by EIF2AK1/HRI promotes relocalization to the mitochondrial surface, thereby triggering
        PRKN-independent mitophagy'
