id: P05198
gene_symbol: EIF2S1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'EIF2S1 encodes eIF2-alpha, the regulatory subunit of the heterotrimeric eukaryotic translation initiation
  factor 2 (eIF2; alpha/EIF2S1, beta/EIF2S2, gamma/EIF2S3). As part of this trimer it forms the eIF2-GTP-Met-tRNAi
  ternary complex that loads the initiator methionyl-tRNA onto the 40S ribosomal subunit, giving the 43S pre-initiation
  complex that scans mRNA and selects the AUG start codon; after GTP hydrolysis the eIF2-GDP released from the ribosome
  must be recharged by the exchange factor eIF2B. eIF2-alpha carries the regulatory phosphoacceptor Ser-52 (Ser-51
  in the mature-protein numbering used by much of the literature), and phosphorylation at this residue is the convergence
  point of the integrated stress response: four kinases sensing distinct stresses - HRI/EIF2AK1 (heme deficiency
  and mitochondrial damage, via OMA1-cleaved DELE1), PKR/EIF2AK2 (double-stranded RNA), PERK/EIF2AK3 (endoplasmic
  reticulum stress) and GCN2/EIF2AK4 (amino acid starvation) - phosphorylate it, converting eIF2 from an eIF2B substrate
  into a competitive eIF2B inhibitor. The resulting drop in initiation attenuates global cap-dependent protein synthesis
  while licensing translation of uORF-containing stress mRNAs such as ATF4, ATF5, DDIT3/CHOP, QRICH1 and PPP1R15A/GADD34,
  and the stalled initiation complexes that accumulate seed cytoplasmic stress granules. The switch is reversed
  by PP1 holoenzymes with the regulatory subunits PPP1R15A/GADD34 and PPP1R15B/CReP. Beyond translational control,
  phosphorylated eIF2-alpha generated by HRI relocalises to the mitochondrial surface, where it is sufficient to
  trigger PRKN-independent mitophagy by promoting autophagosome recruitment. The protein is cytosolic, with stress-dependent
  pools on stress granules and on mitochondria.'
