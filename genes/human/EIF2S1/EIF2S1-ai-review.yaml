id: P05198
gene_symbol: EIF2S1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'EIF2S1 encodes eIF2alpha, the alpha subunit of the heterotrimeric eukaryotic translation initiation
  factor 2 (eIF2), together with the beta (EIF2S2) and GTPase gamma (EIF2S3) subunits. eIF2 binds GTP and initiator
  methionyl-tRNA to form the ternary complex that delivers Met-tRNAi to the 40S ribosomal subunit, generating the
  43S/48S pre-initiation complex; after start-codon recognition and GTP hydrolysis, eIF2-GDP is released and must
  be reloaded with GTP by the exchange factor eIF2B. Within this complex eIF2alpha is the regulatory subunit and
  the last one added during CDC123-dependent assembly, and its S1/OB-fold domain contacts mRNA near the start codon.
  Its defining regulatory role is as the convergence point of the integrated stress response: phosphorylation of
  a single serine (Ser52 of the UniProt sequence, the Ser51 of the mature-protein numbering used in most papers)
  by any of four kinases - HRI/EIF2AK1 sensing heme deficiency and mitochondrial stress through OMA1-cleaved DELE1,
  PKR/EIF2AK2 sensing double-stranded RNA, PERK/EIF2AK3 sensing ER stress, and GCN2/EIF2AK4 sensing amino-acid starvation
  and UV - converts eIF2 from an eIF2B substrate into a competitive eIF2B inhibitor. The result is global attenuation
  of cap-dependent translation together with preferential translation of mRNAs bearing inhibitory upstream open
  reading frames, including ATF4, ATF5, DDIT3/CHOP, QRICH1 and PPP1R15A/GADD34, the last of which scaffolds protein
  phosphatase 1 onto eIF2alpha to reset the switch. Phospho-eIF2alpha also accumulates in stress granules as part
  of stalled 48S complexes, and under HRI-branch activation it accumulates on the cytosolic face of the mitochondrial
  outer membrane, where it is sufficient to trigger mitophagy by a route mechanistically distinct from PINK1/PRKN.
  eIF2alpha is ubiquitously expressed, acts in the cytosol, and is the target of the small-molecule eIF2B activator
  ISRIB. Its legacy alias EIF2A is shared with, but refers to a different gene from, EIF2A.'
