- term:
    id: GO:1990624
    label: guanyl nucleotide exchange factor inhibitor activity
  evidence_type: IC
  original_reference_id: PMID:10613902
  qualifier: enables
  review:
    summary: >-
      Proposed: Ser51-phosphorylated eIF2 binds eIF2B tightly and blocks its GDP-GTP exchange activity.
    action: NEW
    reason: >-
      GO:1990624 is defined as binding to and inhibiting a guanyl nucleotide exchange factor, which is
      exactly what phosphorylated eIF2 does to eIF2B: phosphorylation raises eIF2's affinity for eIF2B and
      prevents nucleotide exchange, and this inhibition of the exchange factor is the mechanism by which
      the integrated stress response attenuates initiation. eIF2alpha itself is the entity that performs
      the inhibition (its phosphorylated form is the inhibitor), so this is participation, not substrate
      status. No existing row captures this regulatory activity; GO:0003743 covers only the productive
      initiation-factor role.
    supported_by:
    - reference_id: file:human/EIF2S1/EIF2S1-uniprot.txt
      record_section:
      - CC:ACTIVITY REGULATION
      supporting_text: >-
        Activity is regulated by phosphorylation at Ser-49 and Ser-52, which stabilizes the eIF2/GDP/eIF2B
        complex and prevents the eIF2B-mediated exchange of GDP for GTP
    - reference_id: PMID:10613902
      supporting_text: >-
        Phosphorylation of eIF-2α increases the affinity of eIF-2 for eIF-2B, and prevents the exchange
        of GDP for GTP, thereby inhibiting the formation of preinitiation complexes.
