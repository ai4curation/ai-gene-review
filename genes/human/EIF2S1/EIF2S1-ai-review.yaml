- term:
    id: GO:0006446
    label: regulation of translational initiation
  evidence_type: NAS
  original_reference_id: PMID:18639529
  qualifier: involved_in
  review:
    summary: Author statement that eIF2alpha phosphorylation governs the productive versus non-productive eIF2-eIF2B
      interaction.
    action: MODIFY
    proposed_replacement_terms:
    - id: GO:0032057
      label: negative regulation of translational initiation in response to stress
    reason: Correct but uninformatively general. The regulation eIF2alpha exerts is specifically the stress-triggered
      negative regulation of initiation through eIF2B inhibition, and GO:0032057 (an is_a descendant) is already
      carried by this gene. The cited paper itself is about phospho-eIF2alpha failing to engage eIF2B productively.
    supported_by:
    - reference_id: PMID:18639529
      supporting_text: Recombinant phosphorylated human eIF2alpha that cannot interact with purified eIF2B, the
        GDP/GTP exchange factor of eIF2, however interacts efficiently with eIF2B along with the beta-subunit of
        eIF2 of the rabbit reticulocyte lysates and also with the purified recombinant beta-subunit.
      reference_section_type: ABSTRACT
    - reference_id: file:human/EIF2S1/EIF2S1-uniprot.txt
      record_section: ["CC:ACTIVITY REGULATION"]
      supporting_text: Activity is regulated by phosphorylation at Ser-49 and Ser-52, which stabilizes the eIF2/GDP/eIF2B
        complex and prevents the eIF2B-mediated exchange of GDP for GTP, thereby preventing the formation of the
        43S pre-initiation complex (43S PIC)
      reference_section_type: DATABASE_ENTRY
    - reference_id: file:human/EIF2S1/EIF2S1-uniprot.txt
      record_section: ["CC:PTM"]
      supporting_text: Phosphorylation at Ser-49 and Ser-52 stabilizes the eIF-2/GDP/eIF2B complex and prevents
        GDP/GTP exchange reaction, thus impairing the recycling of eIF-2 between successive rounds of initiation
        and leading to global inhibition of translation
      reference_section_type: DATABASE_ENTRY
- term:
    id: GO:0010494
    label: cytoplasmic stress granule
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  supporting_entities:
  - UniProtKB:Q6ZWX6
  - ensembl:ENSMUSP00000071214
  - UniProtKB-SubCell:SL-0496
  review:
    summary: Cytoplasmic stress granule from combined electronic methods.
    action: KEEP_AS_NON_CORE
    reason: 'Supported and as precise as warranted, but peripheral: eIF2 is a constituent of the stalled 48S complexes
      that condense into stress granules once eIF2alpha is phosphorylated, so the location is a downstream consequence
      of the ISR switch rather than where the core activity happens. UniProt records the stress-granule location
      for this entry.'
    supported_by:
    - reference_id: file:human/EIF2S1/EIF2S1-uniprot.txt
      record_section: ["CC:SUBCELLULAR LOCATION"]
      supporting_text: 'SUBCELLULAR LOCATION: Cytoplasm, Stress granule'
      reference_section_type: DATABASE_ENTRY
    - reference_id: file:human/EIF2S1/EIF2S1-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: 'EIF2S1/eIF2-alpha is a key component of the integrated stress response (ISR), required for
        adaptation to various stress: phosphorylation by metabolic-stress sensing protein kinases (EIF2AK1/HRI,
        EIF2AK2/PKR, EIF2AK3/PERK and EIF2AK4/GCN2) in response to stress converts EIF2S1/eIF2-alpha in a global
        protein synthesis inhibitor, leading to an attenuation of cap-dependent translation, while concomitantly
        initiating the preferential translation of ISR-specific mRNAs, such as the transcriptional activators ATF4
        and QRICH1'
      reference_section_type: DATABASE_ENTRY
