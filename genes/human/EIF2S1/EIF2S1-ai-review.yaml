id: P05198
gene_symbol: EIF2S1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'EIF2S1 encodes eIF2alpha, the alpha subunit of the heterotrimeric eukaryotic translation
  initiation factor 2 (eIF2alpha/EIF2S1, eIF2beta/EIF2S2, eIF2gamma/EIF2S3). eIF2 delivers the initiator
  methionyl-tRNA to the 40S ribosomal subunit as a GTP-dependent ternary complex, is a constituent of
  the 43S/48S pre-initiation complex, and is released as eIF2-GDP after start-codon recognition and GTP
  hydrolysis; the guanine-nucleotide exchange factor eIF2B then recharges it for the next round. Within
  this complex eIF2alpha carries an N-terminal S1/OB-fold RNA-binding domain and, on its Ser52 loop (Ser51
  in the literature numbering), the single phosphorylation site at which all four stress kinases converge:
  HRI/EIF2AK1, PKR/EIF2AK2, PERK/EIF2AK3 and GCN2/EIF2AK4, responding respectively to heme deficiency
  and mitochondrial stress, viral double-stranded RNA, endoplasmic reticulum stress and amino acid starvation.
  Phosphorylation turns eIF2 from a substrate of eIF2B into an inhibitor of it, which attenuates global
  cap-dependent translation while allowing selective translation of mRNAs with regulatory upstream open
  reading frames, including ATF4, ATF5, DDIT3/CHOP, QRICH1 and PPP1R15A/GADD34; GADD34- and CReP-directed
  protein phosphatase 1 reverses it. eIF2alpha is therefore the hub of the integrated stress response,
  and the stalled pre-initiation complexes that accumulate when it is phosphorylated are the building
  blocks of cytoplasmic stress granules. Beyond translation, phosphorylated eIF2alpha relocalizes to the
  mitochondrial surface downstream of HRI and is there sufficient to trigger PINK1/PRKN-independent mitophagy.
  The protein acts in the cytosol; its clinical relevance runs through the ISR as a drug target (ISRIB),
  through MEHMO syndrome and vanishing white matter disease in its complex and exchange-factor partners,
  and through chronic ISR signalling in neurodegeneration and metabolic disease.'
