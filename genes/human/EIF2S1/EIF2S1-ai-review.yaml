existing_annotations:
- term:
    id: GO:0000423
    label: mitophagy
  evidence_type: IDA
  original_reference_id: PMID:38340717
  qualifier: involved_in
  review:
    summary: >-
      Phosphorylated eIF2alpha generated by HRI relocalizes to the mitochondrial surface, and tethering
      phosphomimetic (S51D) but not WT or S51A eIF2alpha to mitochondria is sufficient to trigger mitophagy
      (Chakrabarty et al. 2024).
    action: KEEP_AS_NON_CORE
    reason: >-
      Direct, well-controlled experimental support from a single recent study in K562 cells; phospho-eIF2alpha
      itself appears to be the signal that acts at the mitochondrion, so the gene product does some of
      the work. It is a newly described, secondary role of a translation initiation factor, mechanistically
      unresolved (how p-eIF2 recruits autophagy machinery is unknown), so it is kept as non-core.
    supported_by:
    - reference_id: PMID:38340717
      supporting_text: >-
        Activation of the HRI branch results in mitochondrial localization of phosphorylated eukaryotic
        initiation factor 2, which we show is sufficient to induce mitophagy.
    - reference_id: PMID:38340717
      supporting_text: >-
        Accompanying this mitochondrial localization, a substantial increase in mitophagy was measured
        in K562 cells expressing EIF2αS51D but not in cells expressing EIF2αWT or EIF2αS51A (Figure 5B).
- term:
