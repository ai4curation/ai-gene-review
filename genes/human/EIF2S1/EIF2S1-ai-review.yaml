  review:
    summary: Stress-induced relocalisation of phospho-eIF2-alpha to the mitochondrial surface, shown by fractionation
      and by colocalisation with TOM20.
    action: ACCEPT
    reason: 'Two orthogonal direct assays in PMID:38340717 support the organelle claim: enrichment of p-eIF2-alpha
      in the mitochondrial fraction of DFP-treated K562 and HeLa cells, and colocalisation with the outer-membrane
      marker TOM20 by immunofluorescence; the authors also checked the fractions with an ER marker and saw no ER
      enrichment, which answers the mitochondria-associated-ER-membrane confound. The root organelle term is kept
      and is not refined to GO:0005741: eIF2-alpha has no transmembrane segment or targeting presequence, and what
      is observed is stress-dependent peripheral recruitment to the cytosolic face, which the organelle policy explicitly
      declines to call an outer-membrane location. is_active_in is justified because the tethering experiment shows
      the activity is exerted there.'
    supported_by:
