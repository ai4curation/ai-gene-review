- term:
    id: GO:0006446
    label: regulation of translational initiation
  evidence_type: NAS
  original_reference_id: PMID:18639529
  qualifier: involved_in
  review:
    summary: Regulation of initiation is correct but general; the supported specific role is stress-triggered negative
      regulation.
    action: MODIFY
    reason: PMID:18639529 is an author statement about alpha/beta intersubunit contacts and the effect of phosphorylation.
      Everything established about eIF2-alpha's regulatory role runs through Ser-52 phosphorylation, which converts
      eIF2 into a competitive inhibitor of eIF2B and shuts initiation down under stress; the gene already carries
      GO:0032057, a descendant of this term. No eIF2-alpha-mediated positive or stress-independent regulation of
      initiation is reported, so refine rather than keep the parent.
    proposed_replacement_terms:
    - id: GO:0032057
      label: negative regulation of translational initiation in response to stress
    supported_by:
