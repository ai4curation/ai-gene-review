  review:
    summary: Stress-granule localisation, inferred from the mouse ortholog; retained as non-core.
    action: KEEP_AS_NON_CORE
    reason: 'Stalled 48S-like pre-initiation complexes containing eIF2 are the species that nucleates stress granules
      when eIF2-alpha is phosphorylated, so the localisation is well founded even though the human record annotates
