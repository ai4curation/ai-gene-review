core_functions:
- description: 'Regulatory alpha subunit of the eIF2 heterotrimer: contributes to delivery of GTP-bound initiator
    methionyl-tRNA to the 40S subunit during cytoplasmic translation initiation, with its S1/OB-fold domain contacting
    mRNA in the pre-initiation complex.'
  molecular_function:
    id: GO:0003729
    label: mRNA binding
  contributes_to_molecular_function:
    id: GO:0160296
    label: cap-dependent translation initiation factor activity
  directly_involved_in:
  - id: GO:0002183
    label: cytoplasmic translational initiation
  locations:
  - id: GO:0005829
    label: cytosol
  in_complex:
    id: GO:0005850
    label: eukaryotic translation initiation factor 2 complex
  supported_by:
  - reference_id: file:human/EIF2S1/EIF2S1-uniprot.txt
    record_section: ["CC:FUNCTION"]
    supporting_text: Member of the eIF2 complex that functions in the early steps of protein synthesis by forming
      a ternary complex with GTP and initiator tRNA
    reference_section_type: DATABASE_ENTRY
  - reference_id: file:human/EIF2S1/EIF2S1-uniprot.txt
    record_section: ["CC:FUNCTION"]
    supporting_text: This complex binds to a 40S ribosomal subunit, followed by mRNA binding to form a 43S pre-initiation
      complex (43S PIC)
    reference_section_type: DATABASE_ENTRY
  - reference_id: PMID:16289705
    supporting_text: eIF2 (eukaryotic translation initiation factor 2) and eIF2B augmented translation of capped,
      uncapped and encephalomyocarditis virus-internal ribosome entry site-promoted mRNAs.
    reference_section_type: ABSTRACT
  - reference_id: file:human/EIF2S1/EIF2S1-uniprot.txt
    record_section: ["CC:SUBUNIT"]
    supporting_text: Eukaryotic translation initiation factor 2 eIF2 is a heterotrimeric complex composed of an
      alpha (EIF2S1), a beta (EIF2S2) and a gamma (EIF2S3) chain
    reference_section_type: DATABASE_ENTRY
  - reference_id: PMID:35031321
    supporting_text: By binding to eIF2γ, eIF2α displaces Cdc123 and thereby completes the assembly process.
    reference_section_type: ABSTRACT
- description: 'Integrated stress response switch: phosphorylation of Ser52 (the Ser51 of the mature-protein numbering
    used in the literature) by HRI, PKR, PERK or GCN2 converts eIF2 from a substrate into a competitive inhibitor
    that binds eIF2B in a nucleotide-exchange-inactive mode, attenuating cap-dependent initiation while licensing
    translation of uORF-containing stress mRNAs such as ATF4, DDIT3 and PPP1R15A.'
  molecular_function:
    id: GO:0031369
    label: translation initiation factor binding
  directly_involved_in:
  - id: GO:0032057
    label: negative regulation of translational initiation in response to stress
  - id: GO:0036499
    label: PERK-mediated unfolded protein response
  - id: GO:0140468
    label: HRI-mediated signaling
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: file:human/EIF2S1/EIF2S1-uniprot.txt
    record_section: ["CC:ACTIVITY REGULATION"]
    supporting_text: Activity is regulated by phosphorylation at Ser-49 and Ser-52, which stabilizes the eIF2/GDP/eIF2B
      complex and prevents the eIF2B-mediated exchange of GDP for GTP, thereby preventing the formation of the 43S
      pre-initiation complex (43S PIC)
    reference_section_type: DATABASE_ENTRY
  - reference_id: file:human/EIF2S1/EIF2S1-uniprot.txt
    record_section: ["CC:PTM"]
    supporting_text: Phosphorylation at Ser-49 and Ser-52 stabilizes the eIF-2/GDP/eIF2B complex and prevents GDP/GTP
      exchange reaction, thus impairing the recycling of eIF-2 between successive rounds of initiation and leading
      to global inhibition of translation
    reference_section_type: DATABASE_ENTRY
  - reference_id: PMID:31048492
    supporting_text: 'The unphosphorylated and phosphorylated forms of eIF2 bind to eIF2B in completely different
      manners: the nucleotide exchange-active and -inactive modes, respectively.'
    reference_section_type: ABSTRACT
  - reference_id: PMID:38340717
    supporting_text: Phosphorylation of the α subunit of EIF2 by the ISR kinases causes EIF2 to change from a substrate
      to a competitive inhibitor of EIF2B.
    reference_section_type: INTRODUCTION
  - reference_id: file:human/EIF2S1/EIF2S1-uniprot.txt
    record_section: ["CC:ACTIVITY REGULATION"]
    supporting_text: This results in the global attenuation of 5' cap-dependent protein synthesis and concomitant
      translation of ISR-specific mRNAs that contain a short upstream open reading frame (uORF) in their 5' UTR,
      such as ATF4, ATF5, DDIT3/CHOP and PPP1R15A/GADD34
    reference_section_type: DATABASE_ENTRY
  - reference_id: file:human/EIF2S1/EIF2S1-uniprot.txt
    record_section: ["CC:PTM"]
    supporting_text: 'Substrate for at least 4 kinases: EIF2AK1/HRI, EIF2AK2/PKR, EIF2AK3/PERK and EIF2AK4/GCN2'
    reference_section_type: DATABASE_ENTRY
  knowledge_gaps:
  - gap_statement: Whether Ser49 is phosphorylated in human cells, and whether it contributes to eIF2B inhibition
      independently of Ser52, is undetermined.
    boundary: Ser52 phosphorylation is established in human cells by mass spectrometry and by mutagenesis, and is
      the site all four ISR kinases are shown to use. UniProt annotates Ser49 as an HRI site only by similarity
      to another species (ECO:0000250|UniProtKB:P83268), and its ACTIVITY REGULATION and PTM lines describe the
      two sites together, so no human experiment separates them.
    gap_kind:
    - BIOLOGY
    dark_aspect: MF_DARK
    status: OPEN
    significance: If Ser49 is an independent input, the ISR switch is graded rather than binary, which changes how
      an eIF2B-targeting drug such as ISRIB would be expected to behave across stresses.
    resolution: Allele-replacement of S49A, S52A and the double mutant in EIF2S1-null cells, read out as eIF2B binding
      mode and ATF4 induction across HRI, PERK and GCN2 activators.
    provenance:
    - reference_id: file:human/EIF2S1/EIF2S1-uniprot.txt
      supporting_text: Activity is regulated by phosphorylation at Ser-49 and Ser-52, which stabilizes the eIF2/GDP/eIF2B
        complex and prevents the eIF2B-mediated exchange of GDP for GTP, thereby preventing the formation of the
        43S pre-initiation complex (43S PIC)
      reference_section_type: DATABASE_ENTRY
    - reference_id: file:human/EIF2S1/EIF2S1-uniprot.txt
      supporting_text: Phosphorylation at Ser-49 and Ser-52 stabilizes the eIF-2/GDP/eIF2B complex and prevents
        GDP/GTP exchange reaction, thus impairing the recycling of eIF-2 between successive rounds of initiation
        and leading to global inhibition of translation
      reference_section_type: DATABASE_ENTRY
knowledge_gaps:
- gap_statement: 'What reads phospho-eIF2alpha on the mitochondrial outer membrane and converts it into autophagosome
    recruitment is unknown: no receptor, adaptor or downstream effector of the mitochondrial phospho-eIF2 signal
    has been identified.'
  boundary: It is established that HRI-branch activation puts phospho-eIF2alpha on the outer membrane, that tethering
    the S51D phosphomimetic there is sufficient to induce mitophagy while the S51A mutant is not, and that the route
    is distinct from PINK1/PRKN because HRI knockdown does not prevent phospho-ubiquitin accumulation. Tethering
    the same phosphomimetic to peroxisomes does not induce pexophagy, so a mitochondria-specific co-factor must
    be involved.
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  status: OPEN
  significance: This is the only step of the HRI mitophagy branch with no molecular mechanism, and it is the step
    that makes the branch mitochondria-selective.
  resolution: Phospho-state-controlled proximity labelling from the outer-membrane-tethered eIF2alpha constructs,
    followed by a focused genetic screen for loss of DFP-induced mitophagy.
  provenance:
  - reference_id: PMID:38340717
    supporting_text: More experiments will be needed to understand the mechanism whereby p-EIF2 on the mitochondrial
      surface results in recruitment or initiation of autophagosomes.
    reference_section_type: DISCUSSION
  - reference_id: PMID:38340717
    supporting_text: Accompanying this mitochondrial localization, a substantial increase in mitophagy was measured
      in K562 cells expressing EIF2αS51D but not in cells expressing EIF2αWT or EIF2αS51A (Figure 5B).
    reference_section_type: RESULTS
  - reference_id: PMID:38340717
    supporting_text: The HRI mitophagy pathway operates in parallel with the mitophagy pathway controlled by the
      Parkinson's disease related genes PINK1 and PARKIN and is mechanistically distinct.
    reference_section_type: ABSTRACT
- gap_statement: Whether mitochondrially localized phospho-eIF2 also acts on local translation of nuclear-encoded
    mitochondrial mRNAs at the organelle surface, as distinct from signalling mitophagy, has not been tested.
  boundary: The mitochondrial pool of phospho-eIF2alpha is established by fractionation and by TOM20 colocalization,
    and its mitophagy output is established by tethering. Whether the same pool retains or alters an initiation-factor
    role locally is raised by the authors as an open possibility and is not addressed by any published experiment.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: Distinguishes a signalling relocalization from a spatial reprogramming of translation, which bears
    on whether the mitochondrial pool should carry an initiation-factor activity annotation at that location at
    all.
  resolution: Ribosome profiling of mitochondria-associated versus free polysomes under HRI-branch activation, with
    eIF2B co-recruitment imaged in parallel.
  provenance:
  - reference_id: PMID:38340717
    supporting_text: However, DFP treatment resulted in notable accumulation of p-EIF2α in the mitochondrial fraction,
      whereas Tg treatment resulted in p-EIF2α localization almost exclusively in the cytosolic fraction (Figure
      4A).
    reference_section_type: RESULTS
  - reference_id: PMID:38340717
    supporting_text: We observed clear colocalization of p-EIF2α with the mitochondrial OM marker TOM20 in DFP-treated
      samples as opposed to control or Tg-treated samples (Figure 4C).
    reference_section_type: RESULTS
proposed_new_terms: []
suggested_questions:
- question: Is the mitochondrial pool of phospho-eIF2alpha still competent to inhibit eIF2B, or is recruitment to
    the outer membrane a way of partitioning the ISR switch away from its translational output?
- question: GO:0005515 rows for EIF2S1 include three eIF2-kinase partners. Would GO benefit from a "eIF2alpha kinase
    substrate" style relation, or is has_input on the kinase the intended mechanism for recording that eIF2alpha
    is the substrate of HRI/PKR/PERK/GCN2?
- question: Should the GO:2000676 (positive regulation of type B pancreatic cell apoptotic process) annotation sit
    on eIF2alpha at all, given that the same node also drives the adaptive outcome, or does it belong on DDIT3/CHOP?
suggested_experiments:
- hypothesis: A mitochondria-specific outer-membrane receptor binds phospho-eIF2alpha and recruits the autophagy
    machinery.
  description: Perform proximity labelling (APEX2 or TurboID) from the Fis1-tethered eIF2alpha-S51D and eIF2alpha-S51A
    constructs in parallel, after rapalog addition, and take the phospho-specific interactors forward into a focused
    CRISPRi screen for loss of DFP-induced mitophagy. The S51A arm is the control that distinguishes phospho-dependent
    partners from bystanders of the tether.
  experiment_type: proximity proteomics / targeted genetic screen
- hypothesis: Ser49 phosphorylation contributes to eIF2B inhibition in human cells independently of Ser52.
  description: Reconstitute eIF2 with alpha subunits carrying S49A, S52A and S49A/S52A and measure eIF2B-catalysed
    GDP/GTP exchange and eIF2B binding mode; in parallel, express the same alleles in EIF2S1-knockout cells and
    read out ATF4 reporter induction across HRI, PERK and GCN2 activators.
  experiment_type: biochemical reconstitution / allele replacement
- hypothesis: The mitochondrial phospho-eIF2 pool is translationally silent and spatially separated from eIF2B.
  description: Image eIF2B (via a tagged eIF2B subunit) and phospho-eIF2alpha together after DFP versus thapsigargin
    treatment, and quantify eIF2B co-recruitment to TOM20-positive membranes; combine with ribosome profiling of
    mitochondrially-associated versus free polysomes to test whether the mitochondrial pool changes local initiation.
  experiment_type: quantitative imaging / ribosome profiling
