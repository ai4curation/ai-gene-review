- term:
    id: GO:0016020
    label: membrane
  evidence_type: HDA
  original_reference_id: PMID:19946888
  qualifier: located_in
  review:
    summary: Generic membrane from an NK-cell membrane-proteome dataset; a fractionation artefact for a soluble
      factor.
    action: MARK_AS_OVER_ANNOTATED
    reason: PMID:19946888 profiled a membrane-enriched fraction. eIF2-alpha has no transmembrane segment, signal
      peptide or lipid anchor in UniProt, and abundant cytosolic and ribosome-associated proteins are routinely
      recovered in such fractions. The protein does associate with membrane-proximal structures - ER-bound ribosomes,
      and the mitochondrial surface under HRI activation - so the row is not flatly wrong, but a bare membrane assignment
      overstates what the dataset shows and the mitochondrial location is recorded separately with proper controls.
    supported_by:
    - reference_id: PMID:38340717
      supporting_text: Tg treatment resulted in p-EIF2α localization almost exclusively in the cytosolic fraction
    - reference_id: file:human/EIF2S1/EIF2S1-uniprot.txt
      record_section: ["CC:SUBCELLULAR LOCATION"]
      supporting_text: Cytoplasm, cytosol
- term:
    id: GO:0032057
    label: negative regulation of translational initiation in response to stress
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q6ZWX6
  - ensembl:ENSMUSP00000071214
  review:
    summary: Phosphorylated eIF2-alpha shuts down initiation under stress by inhibiting eIF2B; this is the gene's
      core regulatory function.
    action: ACCEPT
    reason: 'eIF2-alpha itself performs this step: phosphorylation at Ser-52 converts eIF2 from an eIF2B substrate
      into a competitive eIF2B inhibitor, which is the molecular event that attenuates cap-dependent initiation.
      UniProt annotates the mechanism with experimental evidence (ECO:0000269) on the human record, so although
      this row is projected from the mouse ortholog, the claim is directly grounded in human data. The same switch
      licenses uORF-dependent translation of ATF4, ATF5, DDIT3 and PPP1R15A.'
    supported_by:
    - reference_id: file:human/EIF2S1/EIF2S1-uniprot.txt
      record_section: ["CC:ACTIVITY REGULATION"]
      supporting_text: Activity is regulated by phosphorylation at Ser-49 and Ser-52, which stabilizes the eIF2/GDP/eIF2B
        complex and prevents the eIF2B-mediated exchange of GDP for GTP, thereby preventing the formation of the
        43S pre-initiation complex (43S PIC)
    - reference_id: file:human/EIF2S1/EIF2S1-uniprot.txt
      record_section: ["CC:ACTIVITY REGULATION"]
      supporting_text: This results in the global attenuation of 5' cap-dependent protein synthesis and concomitant
        translation of ISR-specific mRNAs that contain a short upstream open reading frame (uORF) in their 5' UTR,
        such as ATF4, ATF5, DDIT3/CHOP and PPP1R15A/GADD34
    - reference_id: PMID:38340717
      supporting_text: Phosphorylation of the α subunit of EIF2 by the ISR kinases causes EIF2 to change from a
        substrate to a competitive inhibitor of EIF2B.
