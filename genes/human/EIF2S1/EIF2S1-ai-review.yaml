  knowledge_gaps:
  - gap_statement: 'No molecular activity is known for phospho-eIF2alpha once it is on the mitochondrial
      surface: the receptor, adaptor or modification it engages to commit the organelle to autophagic
      degradation is unidentified, which is why this core function is recorded with no molecular_function
      term.'
    boundary: 'Firmly established: HRI-dependent Ser52 phosphorylation, accumulation of phospho-eIF2alpha
      on mitochondria by fractionation and TOM20 co-staining, and sufficiency of mitochondrially tethered
      phosphomimetic eIF2alpha to induce mitophagy, with the S52A phosphomutant and peroxisomal tethering
      as negative controls. Not established: what it does there. The ISR''s own transcriptional outputs
      (ATF4, ATF3, CHOP, GADD34) were excluded by the CRISPRi screen, and the recruitment does not act
      through phospho-ubiquitin accumulation, so the canonical ubiquitin-receptor route is not the mechanism.'
    gap_kind:
    - BIOLOGY
    dark_aspect: MF_DARK
    status: OPEN
    significance: This is the only activity of eIF2alpha that is not an aspect of translation initiation,
      and it is a PINK1/PRKN-independent route to mitochondrial quality control, so the missing step is
      of direct interest for Parkinson's disease and for any GO-CAM of the HRI branch, which currently
      cannot be closed past the localization step.
    resolution: Identify the binding partner of mitochondrial phospho-eIF2alpha (proximity labelling from
      the S52D versus S52A tether), and test the authors' alternative that the effect runs through local
      translation of mRNAs at the mitochondrial surface.
    provenance:
    - reference_id: PMID:38340717
      supporting_text: It is important to address how HRI inhibition can reduce PINK1/PARKIN mitophagy
        without affecting accumulation of phospho-ubiquitin, given that ubiquitination of the mitochondrial
        surface recruits autophagy receptors and has been shown to be sufficient to induce mitophagy.
      reference_section_type: DISCUSSION
suggested_questions:
- question: Is the mitophagy-triggering species on mitochondria phospho-eIF2alpha alone, the whole phospho-eIF2
    trimer, or a stalled pre-initiation complex? The answer decides whether the mitophagy activity should
    be annotated to EIF2S1 with enables or with contributes_to, and whether EIF2S2 and EIF2S3 should carry
    it too.
- question: Should GO:1990624 guanyl nucleotide exchange factor inhibitor activity be annotated to EIF2S2
    and EIF2S3 as well, with contributes_to? The ELISA data implicate the beta subunit in mediating the
    productive and non-productive eIF2-eIF2B interactions, and PomBase currently has the term only on
    eIF2alpha.
- question: Does eIF2 dependence generalise across IRES classes? GO:0160297 IRES-mediated translation
    initiation factor activity rests on one EMCV-IRES reporter in HeLa extract, and HCV-like IRESs can
    initiate with reduced eIF2 dependence.
- question: What, if anything, does the Ser49 phosphosite do in human eIF2alpha? It is annotated only
    by similarity to Drosophila (UniProtKB:P83268) and is bundled with Ser52 in the UniProt activity-regulation
    statement.
suggested_experiments:
- description: 'Separate the mitophagy function from the translation function genetically: in EIF2S1-null
    cells, compare rescue by wild-type eIF2alpha, by S52D, and by an S52D variant carrying substitutions
    that abolish eIF2B binding without abolishing trimer assembly. If mitophagy survives loss of eIF2B
    engagement, the mitochondrial activity is independent of the GEF-inhibitor activity and warrants its
    own molecular function.'
- description: Determine what phospho-eIF2alpha recruits at the mitochondrial surface. Proximity labelling
    (APEX2 or TurboID) from mitochondrially tethered S52D versus S52A eIF2alpha, compared against the
    cytosolic tether, would identify the autophagy receptor or adaptor that converts the localization
    into mitophagy and would supply the missing causal link for a GO-CAM of this branch.
- description: 'Quantify the stoichiometry of the mitochondrial pool: is total eIF2alpha unchanged while
    only the phospho-form redistributes, and what fraction of cellular phospho-eIF2alpha is involved?
    Quantitative immunoblotting of fractions plus phospho-specific immuno-EM would establish whether this
    is a minor signalling pool or a bulk relocalization.'
- description: 'Test whether eIF2alpha phosphorylation is required at synapses, where the is_active_in
    GO:0045202 row is only an ortholog projection: compartment-resolved ribosome profiling or puromycin-proximity
    labelling in dendrites of neurons expressing S52A versus wild-type eIF2alpha.'
