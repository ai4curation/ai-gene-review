- id: PMID:38340717
  title: The HRI branch of the integrated stress response selectively triggers mitophagy.
  findings:
  - statement: A whole-genome CRISPRi screen for deferiprone-induced mitophagy enriched the HRI branch of the ISR
      (EIF2AK1/HRI, DELE1, OMA1, ABCB7), and individual knockdowns confirmed the requirement.
    supporting_text: Activation of the HRI branch results in mitochondrial localization of phosphorylated eukaryotic
      initiation factor 2, which we show is sufficient to induce mitophagy.
    reference_section_type: ABSTRACT
  - statement: Rapalog-induced tethering of phosphomimetic eIF2-alpha (S51D), but not wild-type or S51A, to the
      mitochondrial outer membrane was sufficient to induce mitophagy in K562 and HeLa cells.
    supporting_text: Taken together, these results indicate that phosphorylation and mitochondrial localization
      of EIF2α are necessary and sufficient to trigger mitophagy.
    reference_section_type: RESULTS
  - statement: Phospho-eIF2-alpha accumulated in the mitochondrial fraction and colocalised with TOM20 after DFP
      treatment, with no ER enrichment in the same fractions, whereas thapsigargin kept it almost entirely cytosolic.
    supporting_text: We observed clear colocalization of p-EIF2α with the mitochondrial OM marker TOM20 in DFP-treated
      samples as opposed to control or Tg-treated samples
    reference_section_type: RESULTS
  - statement: HRI inhibition did not block PINK1 accumulation, PARKIN recruitment or phospho-ubiquitin, but reduced
      LC3B-GFP association with mitochondria, placing the HRI contribution at autophagosome recruitment.
    supporting_text: it did result in a clear reduction in the association of LC3B-GFP with mitochondria, indicating
      a defect in the recruitment of autophagosomes to mitochondria
    reference_section_type: RESULTS
  - statement: Tethering phosphomimetic eIF2-alpha to peroxisomes did not induce pexophagy, so a mitochondria-specific
      feature is additionally required.
    supporting_text: it failed to induce pexophagy, in contrast to starvation
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text available in the cache and read for this review. Establishes the mitophagy, mitochondrion
      and HRI-branch rows; the gain-of-function tethering experiment is what makes the mitophagy annotation a participation
      claim rather than a necessity claim. UniProt cites the same paper for the Mitochondrion location (ECO:0000269|PubMed:38340717).
- id: PMID:9431994
  title: Homologous regions of the alpha subunit of eukaryotic translational initiation factor 2 (eIF2alpha) and
    the vaccinia virus K3L gene product interact with the same domain within the dsRNA-activated protein kinase
    (PKR).
  findings:
  - statement: eIF2-alpha binds PKR in vitro through the same or an overlapping domain as the vaccinia K3L pseudosubstrate;
      the N-terminal 123 residues suffice, and binding is to the PKR catalytic C-terminus rather than the regulatory
      N-terminus.
    supporting_text: The data presented here demonstrate that the natural substrate, eIF2alpha, also binds to PKR
      in vitro and interacts with the same or an overlapping domain within PKR.
    reference_section_type: ABSTRACT
  - statement: Deleting the conserved GYID residues from eIF2-alpha decreased PKR binding.
    supporting_text: pK3, eIF2alpha, and the truncated form of eIF2alpha all bind to the C-terminus of PKR containing
      the catalytic domain, but not to the regulatory N-terminus.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only in the cache. Direct in vitro binding data; the basis for refining the PKR protein-binding
      rows to GO:0019901 protein kinase binding.
  full_text_unavailable: true
