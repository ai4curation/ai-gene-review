  evidence_type: IDA
  original_reference_id: PMID:38340717
  qualifier: is_active_in
  review:
    summary: 'is_active_in mitochondrion: phospho-eIF2alpha accumulates on mitochondria after iron chelation,
      and mitochondrially tethered phosphomimetic eIF2alpha is sufficient to trigger mitophagy.'
    action: ACCEPT
    reason: 'Direct evidence by two orthogonal routes, biochemical fractionation and TOM20 co-staining,
      with the ER-marker control that projects/ORGANELLES.md asks for run and negative, so this is not
      mitochondria-associated ER membrane. is_active_in is justified because the localization is itself
      what drives mitophagy. Kept at the root organelle term and no mitochondrial outer membrane row is
      proposed: this is stress-triggered recruitment of a soluble cytosolic protein to the organelle surface,
      which the policy excludes from being an outer-membrane location.'
    supported_by:
    - reference_id: PMID:38340717
      supporting_text: However, DFP treatment resulted in notable accumulation of p-EIF2α in the mitochondrial
        fraction, whereas Tg treatment resulted in p-EIF2α localization almost exclusively in the cytosolic
        fraction (Figure 4A).
      reference_section_type: RESULTS
    - reference_id: PMID:38340717
      supporting_text: We observed clear colocalization of p-EIF2α with the mitochondrial OM marker TOM20
        in DFP-treated samples as opposed to control or Tg-treated samples (Figure 4C).
      reference_section_type: RESULTS
    - reference_id: PMID:38340717
      supporting_text: Analysis of the subcellular fractions with an ER marker showed no evidence of ER
        enrichment of p-EIF2α upon DFP treatment (Figure S4C).
      reference_section_type: RESULTS
    - reference_id: PMID:38340717
      supporting_text: Taken together, these results indicate that phosphorylation and mitochondrial localization
        of EIF2α are necessary and sufficient to trigger mitophagy.
      reference_section_type: RESULTS
