- term:
    id: GO:0003723
    label: RNA binding
  evidence_type: HDA
  original_reference_id: PMID:22658674
  qualifier: enables
  review:
    summary: RNA binding detected by proteome-wide mRNA-interactome capture; retained as a non-core molecular capability.
    action: KEEP_AS_NON_CORE
    reason: 'eIF2-alpha was recovered in UV-crosslinking mRNA-interactome capture, and the eIF2 trimer contacts
      both initiator Met-tRNA and the mRNA around the start codon, so RNA binding is a real molecular capability
      of this protein. It is kept at the parent term rather than refined to GO:0003729 mRNA binding because eIF2-alpha''s
      physiological RNA ligands include initiator tRNA as well as mRNA, so the parent is the honest level. Non-core:
      the capability serves the initiation-factor activity rather than standing on its own.'
