  description: N-terminal product of autoproteolysis of the Nup98-Nup96 precursor (isoforms 1/2), and the sole product of the Nup98-specific isoforms 3/4. Carries the FG/GLFG-repeat domain that forms the selective permeability barrier and binds transport receptors, the GLEBS motif that binds RAE1, and the C-terminal autoproteolytic (peptidase S59) domain that also anchors Nup98 to the NPC. Responsible for the FG-barrier, mRNA export, intranuclear GLFG-body and DHX9-cofactor functions.
