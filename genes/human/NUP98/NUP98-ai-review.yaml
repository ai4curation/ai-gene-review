id: P52948
gene_symbol: NUP98
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'NUP98 encodes a precursor protein that cleaves itself autoproteolytically, via its C-terminal domain, into two distinct nucleoporins of the nuclear pore complex (NPC): Nup98 and Nup96 (alternatively spliced Nup98-only transcripts give Nup98 alone). Nup98 has a long, intrinsically disordered N-terminal domain of FG and GLFG repeats that forms a cohesive, phase-separating meshwork. Within the NPC central channel this meshwork is a major part of the selective permeability barrier: it excludes inert macromolecules while providing binding sites that let nuclear transport receptors (importins, exportins, NXF1) and their cargoes cross the pore. Through its GLEBS motif Nup98 binds the mRNA export factor RAE1, and the RAE1-Nup98 complex contacts mRNPs during mRNA export. Nup98 sits mainly at the nucleoplasmic side of the NPC and in the pore core, and it is dynamic. A mobile pool in the nucleoplasm and in intranuclear GLFG bodies binds chromatin and transcripts and acts as a cofactor of the RNA helicase DHX9, stimulating its ATPase activity and supporting transcription and splicing of target genes. Nup96 is a stable scaffold subunit of the Nup107-160 (Y) complex that forms the NPC outer rings. It is essential for NPC assembly, and the complex is recruited to kinetochores in mitosis. Several viral proteins, including SARS-CoV-2 ORF6 and vesicular stomatitis virus M, target the RAE1-Nup98 complex to block host mRNA export and STAT nuclear import. Fusions of the NUP98 FG-repeat region to many partner genes drive acute leukemias.'
