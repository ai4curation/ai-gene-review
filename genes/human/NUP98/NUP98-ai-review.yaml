core_functions:
- description: FG-repeat nucleoporin forming the NPC selective permeability barrier. The intrinsically disordered FG/GLFG-repeat domain of Nup98 assembles into a cohesive, phase-separated FG meshwork in the NPC that excludes inert macromolecules while providing low-affinity binding sites that allow nuclear transport receptor-cargo complexes to translocate, thereby mediating bidirectional nucleocytoplasmic transport including importin-dependent protein import. Nup98 resides at the nucleoplasmic side/NPC core and nuclear basket region.
  molecular_function:
    id: GO:0017056
    label: structural constituent of nuclear pore
  directly_involved_in:
  - id: GO:0006913
    label: nucleocytoplasmic transport
  - id: GO:0006606
    label: protein import into nucleus
  locations:
  - id: GO:0005635
    label: nuclear envelope
  in_complex:
    id: GO:0005643
    label: nuclear pore
  supported_by:
  - *id026
  - *id017
  - *id024
  - *id005
  - *id019
- description: mRNA export factor at the NPC. Through its GLEBS motif Nup98 binds RAE1, forming a RAE1-Nup98 complex that binds single-stranded RNA and mRNPs, and its FG repeats bind the mRNA export receptor NXF1; this complex is the target by which VSV M and SARS-CoV-2 ORF6 block host mRNA export.
  molecular_function:
    id: GO:0017056
    label: structural constituent of nuclear pore
  directly_involved_in:
