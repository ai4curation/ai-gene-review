- description: Off-pore cofactor of the RNA helicase DHX9. Intranuclear Nup98 (nucleoplasm and GLFG bodies) binds DHX9 in an RNA-facilitated manner, stimulates its ATPase activity, and co-occupies target gene loci and transcripts, supporting DHX9-dependent transcription and splicing.
  molecular_function:
