  - SGD:S000003060
  review:
    summary: IBA for telomere tethering at nuclear periphery, inherited from yeast GLFG nucleoporin evidence.
    action: MARK_AS_OVER_ANNOTATED
    reason: No evidence in the reviewed literature for a role of human Nup98 or Nup96 in tethering telomeres to the nuclear periphery; peripheral telomere anchoring is a feature documented in budding yeast, and the cached human literature does not support transfer of this specific process. Retained only as an over-annotation flag rather than removal, given the phylogenetic basis.
    propagation_review:
      root_cause: UNRESOLVED
      failure_modes: []
      source_entities:
      - source_id: PANTHER:PTN000574450
        source_status: UNRESOLVED
        comment: GLFG nucleoporin ancestral node carrying the telomere-tethering IBD; placement appears driven by budding-yeast evidence and no human or other metazoan experimental support was found in the reviewed literature.
      - source_id: SGD:S000003060
        source_status: UNRESOLVED
        comment: Yeast GLFG nucleoporin donor; experimental yeast evidence not re-examined here, and whether peripheral telomere tethering is conserved in the vertebrate Nup98/Nup96 lineage is unresolved.
