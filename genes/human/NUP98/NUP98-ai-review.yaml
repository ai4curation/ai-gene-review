    ids:
    - PRO_0000019930
    residues: 881-1817
  description: C-terminal product of the Nup98-Nup96 precursor (isoforms 1/2 only). A structured scaffold nucleoporin and stable subunit of the Nup107-160 (Y) complex that forms the NPC outer rings, essential for NPC assembly; the complex is recruited to kinetochores in mitosis. Lacks FG repeats.
