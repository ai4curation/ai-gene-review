  - *id007
- description: Scaffold nucleoporin Nup96 (C-terminal product of the autoproteolytically processed NUP98 precursor). Nup96 is a stable subunit of the Nup107-160 (Y) complex forming the NPC outer rings and is essential for NPC assembly and for docking Nup153 and Tpr to the pore.
  molecular_function:
    id: GO:0017056
    label: structural constituent of nuclear pore
  directly_involved_in:
