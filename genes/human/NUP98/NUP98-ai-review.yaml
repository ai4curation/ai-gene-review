existing_annotations:
- term:
    id: GO:0000776
    label: kinetochore
  evidence_type: IDA
  original_reference_id: PMID:15146057
  qualifier: colocalizes_with
  review:
    summary: Nup96, the C-terminal autoproteolytic product of the NUP98 precursor, is a stable Nup107-160 complex subunit that the whole complex targets to kinetochores from prophase to anaphase. Nup98 itself was not detected at kinetochores in this study.
    action: KEEP_AS_NON_CORE
    reason: Supported for the Nup96 chain encoded by NUP98 (colocalizes_with). Kinetochore association of the Nup107-160 complex is a mitotic moonlighting role, not the core NPC function.
    supported_by:
    - &id009
      reference_id: PMID:15146057
      supporting_text: a specific labeling of Nup96 at kinetochores was already observed during prophase, when Nup96 is mainly localized at the nuclear envelope
    - &id002
      reference_id: PMID:15146057
      supporting_text: indicating that most, if not all, Nup96 is stably associated with the Nup107-160 complex during the entire cell cycle
- term:
    id: GO:0000973
    label: post-transcriptional tethering of RNA polymerase II gene DNA at nuclear periphery
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000574450
  - SGD:S000001551
  - SGD:S000003060
  review:
    summary: IBA from a PANTHER node seeded by yeast GLFG nucleoporins (Nup100/Nup145) that maintain transcriptional memory by tethering recently repressed genes at the nuclear periphery.
    action: KEEP_AS_NON_CORE
    reason: Human Nup98 binds promoters of inducible genes and is required for transcriptional memory of interferon-gamma-induced genes (reviewed in the introduction of PMID:28221134), consistent with conserved inheritance of a gene-tethering/memory role. However, metazoan Nup98 acts largely in the nucleoplasm off the pore, so the peripheral tethering aspect is not directly shown in human cells. Retained as non-core.
    supported_by:
    - &id027
      reference_id: PMID:28221134
      supporting_text: One such nucleoporin, Nup98, binds chromatin and regulates gene expression.
- term:
    id: GO:0003713
    label: transcription coactivator activity
  evidence_type: IMP
  original_reference_id: PMID:28221134
  qualifier: enables
  review:
    summary: Capitanio et al. show Nup98 binds DHX9, stimulates its ATPase activity and supports DHX9-stimulated transcription in a reporter assay.
    action: KEEP_AS_NON_CORE
    reason: Nup98 acts as a cofactor of the DHX9 helicase rather than as a classical coactivator bridging a DNA-bound transcription factor; the curator-assigned IMP is accepted as a non-core off-pore regulatory role. A more mechanistic MF (ATPase activator activity) is proposed under the DHX9 protein binding row.
    supported_by:
    - reference_id: PMID:28221134
      supporting_text: Nup98 functions as a co-factor that regulates DHX9 and, potentially, other RNA helicases
    - &id003
      reference_id: PMID:28221134
      supporting_text: Importantly, binding of Nup98 stimulates the ATPase activity of DHX9, and a transcriptional reporter assay suggests Nup98 supports DHX9-stimulated transcription.
