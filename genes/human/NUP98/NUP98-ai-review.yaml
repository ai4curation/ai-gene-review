  review:
    summary: IBA for RNA binding at the GLFG nucleoporin node. Human Nup98 associates with transcripts in an RNA-facilitated manner and, in complex with RAE1, binds single-stranded RNA.
    action: KEEP_AS_NON_CORE
    reason: RNA association is supported (RAE1-Nup98 complex ssRNA binding; Nup98-DHX9 binding to transcripts), but the predicted nucleoporin RNA-binding motif in the C-terminal domain is structurally unlikely to bind RNA, and much of the RNA contact may be contributed by partners. Non-core.
