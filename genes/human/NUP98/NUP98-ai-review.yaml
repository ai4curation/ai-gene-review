suggested_questions:
- question: In human NPCs, what fraction of the permeability barrier is contributed by the Nup98 FG domain relative to NUP62-complex and other FG nucleoporins, and is the Nup98 FG phase in vivo a condensate-like cohesive meshwork as in vitro?
- question: Should GO annotations to P52948 be split by cleavage product (Nup98 chain PRO_0000019929 vs Nup96 chain PRO_0000019930), given that Nup107-160 complex, outer ring and kinetochore annotations apply only to Nup96 while FG-barrier and mRNA-export annotations apply only to Nup98?
- question: Does human Nup98 tether recently repressed or inducible genes to the nuclear periphery, as its yeast orthologs do, or does its transcriptional memory role occur entirely in the nucleoplasm?
- question: Is cytoplasmic mislocalization of Nup98 seen in degenerating neurons a cause or a consequence of nucleocytoplasmic transport failure, and does it reflect loss of Nup98 from the FG barrier of individual pores?
suggested_experiments:
- hypothesis: The Nup98 FG domain is the dominant constituent of the permeability barrier in human NPCs.
  description: Acute degron-mediated depletion of Nup98 (or replacement with FG-domain-deleted Nup98) in human cells, followed by measurement of passive leakage of inert dextrans/GFP multimers and receptor-mediated import/export kinetics, and cryo-ET of the central channel.
  experiment_type: genetic perturbation with transport assay
- hypothesis: Nup98 activates DHX9 ATPase by direct allosteric stimulation through its FG/GLFG region.
  description: Steady-state ATPase kinetics of purified DHX9 with titrated recombinant Nup98 FG/GLFG fragments, FG-to-SG mutants, and RNA substrates, to determine whether Nup98 alters kcat, Km or RNA affinity.
  experiment_type: biochemical assay
