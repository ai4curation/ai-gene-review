id: Q8TDU6
gene_symbol: GPBAR1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: GPBAR1 (TGR5, M-BAR) is a class A G protein-coupled receptor of the plasma membrane that
  is activated by bile acids, with lithocholic and deoxycholic acid the most potent natural agonists.
  Bile-acid binding to an orthosteric pocket in the transmembrane bundle couples GPBAR1 to Gs, activating
  adenylyl cyclase and raising cAMP, and triggers receptor internalization and ERK activation. GPBAR1
  is expressed in monocytes/macrophages, gallbladder and biliary epithelium, intestinal enteroendocrine
  L cells, brown adipose tissue and other tissues, where it mediates rapid, non-genomic bile-acid signaling
  that suppresses macrophage inflammatory responses, promotes GLP-1 secretion and increases energy expenditure.
