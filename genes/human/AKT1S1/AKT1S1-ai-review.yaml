suggested_questions:
- question: Is the reported pro-survival function of PRAS40 separable from its mTORC1 inhibition, or does
    it follow from mTORC1 control?
- question: Does nuclear PRAS40 have an activity of its own (for example in the RPL11-MDM2-p53 pathway),
    or is it a nuclear pool of the mTORC1 inhibitor?
suggested_experiments:
- description: Compare TOS-motif and phospho-site mutants of PRAS40 in apoptosis assays to test whether
    survival effects require mTORC1 binding.
