- id: PMID:17386266
  title: PRAS40 is an insulin-regulated inhibitor of the mTORC1 protein kinase.
  findings:
  - statement: PRAS40 binds mTORC1 through raptor in insulin-deprived cells.
    supporting_text: We identify PRAS40 as a raptor-interacting protein that binds to mTORC1 in insulin-deprived
      cells
  - statement: PRAS40 inhibits cell growth and mTORC1 signaling.
    supporting_text: PRAS40 inhibits cell growth, S6K1 phosphorylation, and rheb-induced activation of
      the mTORC1 pathway
  - statement: Akt phosphorylation relieves the inhibition.
    supporting_text: Insulin stimulates Akt/PKB-mediated phosphorylation of PRAS40, which prevents its
      inhibition of mTORC1 in cells and in vitro.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only (record re-fetched to current format). Co-discovery of PRAS40 as an mTORC1
      inhibitor.
- id: PMID:17510057
  title: PRAS40 regulates mTORC1 kinase activity by functioning as a direct inhibitor of substrate binding.
  findings:
  - statement: The TOS motif FVMDE is required for raptor binding.
    supporting_text: A putative TOR signaling motif, FVMDE, is identified in PRAS40 and shown to be required
      for interaction with raptor.
  - statement: Recombinant PRAS40 inhibits mTORC1 via raptor.
    supporting_text: Recombinant PRAS40 inhibits mTORC1 kinase activity in vivo and in vitro, and this
      inhibition depends on PRAS40 association with raptor.
  - statement: PRAS40 is a direct inhibitor of substrate binding.
    supporting_text: We, therefore, propose that PRAS40 regulates mTORC1 kinase activity by functioning
      as a direct inhibitor of substrate binding.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only. Establishes the substrate-competitive mechanism.
- id: PMID:29236692
  title: Mechanisms of mTORC1 activation by RHEB and inhibition by PRAS40.
  findings:
  - statement: PRAS40 blocks both substrate-recruitment sites of mTOR.
    supporting_text: reveals PRAS40 inhibits both substrate-recruitment sites
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached. Structural basis of inhibition.
- id: PMID:12524439
  title: Identification of a proline-rich Akt substrate as a 14-3-3 binding partner.
  findings:
  - statement: Akt phosphorylation of PRAS40 creates a 14-3-3 binding site.
    supporting_text: Thus, PRAS40 is a novel substrate of Akt, the phosphorylation of which leads to the
      binding of this protein to 14-3-3.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only. Discovery of PRAS40 as an Akt substrate and 14-3-3 client.
- id: PMID:18372248
  title: Regulation of proline-rich Akt substrate of 40 kDa (PRAS40) function by mammalian target of rapamycin
    complex 1 (mTORC1)-mediated phosphorylation.
  findings:
  - statement: mTORC1 contains PRAS40.
    supporting_text: The rapamycin-sensitive mammalian target of rapamycin (mTOR) complex 1 (mTORC1) contains
      mTOR, raptor, mLST8, and PRAS40
  - statement: PRAS40 inhibits mTORC1 when bound and dissociates on insulin.
    supporting_text: PRAS40 functions as a negative regulator when bound to mTORC1, and it dissociates
      from mTORC1 in response to insulin.
  - statement: Ser221 phosphorylation controls 14-3-3 binding and inhibition.
    supporting_text: mutation of Ser-221 to Ala reduces the interaction with 14-3-3 to the same extent
      as mutation of Thr-246
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached. mTORC1 feedback phosphorylation of PRAS40.
- id: PMID:17604271
  title: PRAS40 is a target for mammalian target of rapamycin complex 1 and is required for signaling
    downstream of this complex.
  findings:
  - statement: 14-3-3 binding requires amino acids and insulin.
    supporting_text: PRAS40 binds 14-3-3 proteins, and this requires both amino acids and insulin.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only. Source of a yeast-BMH1 14-3-3 row.
- id: PMID:31601764
  title: Architecture of human Rag GTPase heterodimers and their complex with mTORC1.
  findings:
  - statement: The PRAS40 TOS motif docks in raptor.
    supporting_text: The TOS motif from PRAS40 (fused to RagC) contacts a groove between the RNC and the
      α-solenoid of RAPTOR
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text cached. Cryo-EM of Rag-mTORC1 using a PRAS40 TOS fusion.
- id: PMID:19648646
  title: Differential 14-3-3 affinity capture reveals new downstream targets of phosphatidylinositol 3-kinase
    signaling.
  findings:
  - statement: 14-3-3 affinity capture used yeast BMH1/BMH2.
    supporting_text: binding of protein to 14-3-3-Sepharose (mixed BMH1 and BMH2, the 14-3-3 isoforms
      from Saccharomyces cerevisiae)
  - statement: PRAS40 is an insulin-regulated 14-3-3 binder.
    supporting_text: four known insulin-regulated proteins (PFK-2, PRAS40, AS160, and MYO1C) had high
      d(0)/d(4) values
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
