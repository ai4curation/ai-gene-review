  review:
    summary: Binding to 14-3-3 eta (YWHAH). PRAS40 is a phosphorylation-dependent 14-3-3 client, and that
      binding regulates its activity; modified to 14-3-3 protein binding.
    action: MODIFY
    reason: Akt phosphorylation creates the 14-3-3 site [PMID:12524439 "Thus, PRAS40 is a novel substrate
      of Akt, the phosphorylation of which leads to the binding of this protein to 14-3-3."], binding
      depends on insulin and amino acids [PMID:17604271 "PRAS40 binds 14-3-3 proteins, and this requires
      both amino acids and insulin."], and loss of 14-3-3 binding increases PRAS40's inhibition of mTORC1
      [PMID:18372248 "mutation of Ser-221 to Ala reduces the interaction with 14-3-3 to the same extent
      as mutation of Thr-246"], [PMID:18372248 "mutation of Ser-221 to Ala increases the inhibitory activity
      of PRAS40 toward mTORC1."]. GO:0071889 14-3-3 protein binding is the conventional term for 14-3-3
      clients; RPTOR, IRS2, HDAC7 and CFTR carry it in human. Per the project's GO:0005515 policy the
      generic term is replaced by an informative one where the evidence supports it, and removed otherwise;
      removal is not a claim that the interaction is false.
    supported_by:
    - reference_id: PMID:12524439
      supporting_text: Thus, PRAS40 is a novel substrate of Akt, the phosphorylation of which leads to
        the binding of this protein to 14-3-3.
    - reference_id: PMID:17604271
      supporting_text: PRAS40 binds 14-3-3 proteins, and this requires both amino acids and insulin.
    - reference_id: PMID:18372248
      supporting_text: mutation of Ser-221 to Ala reduces the interaction with 14-3-3 to the same extent
        as mutation of Thr-246
    proposed_replacement_terms:
    - id: GO:0071889
      label: 14-3-3 protein binding
