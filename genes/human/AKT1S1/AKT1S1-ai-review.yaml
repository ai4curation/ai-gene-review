      mTORC1 kinase activity [PMID:17510057 "Recombinant PRAS40 inhibits mTORC1 kinase activity in vivo
      and in vitro, and this inhibition depends on PRAS40 association with raptor."] as a substrate-competitive
      inhibitor [PMID:17510057 "We, therefore, propose that PRAS40 regulates mTORC1 kinase activity by
