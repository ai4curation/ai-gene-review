existing_annotations:
- term:
    id: GO:0004860
    label: protein kinase inhibitor activity
  evidence_type: IDA
  original_reference_id: PMID:18372248
  qualifier: enables
  review:
    summary: Protein kinase inhibitor activity, from the study of mTORC1 phosphorylation of PRAS40. Correct,
      if less specific than the serine/threonine term also annotated; accepted.
    action: ACCEPT
    reason: PRAS40 binds raptor through its TOS motif [PMID:17510057 "A putative TOR signaling motif,
      FVMDE, is identified in PRAS40 and shown to be required for interaction with raptor."] and inhibits
      mTORC1 kinase activity [PMID:17510057 "Recombinant PRAS40 inhibits mTORC1 kinase activity in vivo
      and in vitro, and this inhibition depends on PRAS40 association with raptor."] as a substrate-competitive
      inhibitor [PMID:17510057 "We, therefore, propose that PRAS40 regulates mTORC1 kinase activity by
      functioning as a direct inhibitor of substrate binding."]; the structure shows it blocks both substrate-recruitment
      sites [PMID:29236692 "reveals PRAS40 inhibits both substrate-recruitment sites"]. Insulin relieves
      the inhibition through Akt phosphorylation [PMID:17386266 "Insulin stimulates Akt/PKB-mediated phosphorylation
      of PRAS40, which prevents its inhibition of mTORC1 in cells and in vitro."]. This paper adds that
      phosphorylation tunes the inhibition [PMID:18372248 "mutation of Ser-221 to Ala increases the inhibitory
      activity of PRAS40 toward mTORC1."].
    supported_by:
    - reference_id: PMID:18372248
      supporting_text: PRAS40 functions as a negative regulator when bound to mTORC1, and it dissociates
        from mTORC1 in response to insulin.
    - reference_id: PMID:18372248
      supporting_text: mutation of Ser-221 to Ala increases the inhibitory activity of PRAS40 toward mTORC1.
