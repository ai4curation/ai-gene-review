id: Q96B36
gene_symbol: AKT1S1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'AKT1S1 (PRAS40, proline-rich Akt substrate of 40 kDa) is a cytosolic inhibitor of mTORC1,
  the nutrient- and insulin-responsive kinase complex that drives protein synthesis and cell growth. In
  the absence of insulin and nutrients it binds mTORC1 through a TOR signaling (TOS) motif that docks
  on raptor, and it blocks both substrate-recruitment sites of the complex, so it acts as a substrate-competitive
  inhibitor of 4E-BP1 and S6K1 phosphorylation. Insulin and growth factors switch the inhibition off:
  Akt phosphorylates PRAS40 on Thr246 and mTORC1 itself phosphorylates Ser183, Ser212 and Ser221, which
  releases PRAS40 from raptor and creates binding sites for 14-3-3 proteins that hold it away from the
  complex. PRAS40 is therefore both an inhibitor and a substrate of mTORC1. A nuclear pool has been reported,
  and PRAS40 has been linked to cell survival in rodent injury models and to tumor growth.'
