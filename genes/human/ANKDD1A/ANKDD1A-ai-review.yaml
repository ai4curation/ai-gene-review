  review:
    summary: Signal transduction (InterPro IEA from the death domain). A generic domain-based inference
      with no supporting data; over-annotated.
    action: MARK_AS_OVER_ANNOTATED
    reason: ANKDD1A has a C-terminal death domain, a fold that mediates homotypic interactions in apoptotic
      and inflammatory signaling, and InterPro2GO maps that to signal transduction. No study shows ANKDD1A
      in any signaling pathway through its death domain; the only functional study concerns FIH1 and HIF1α
      in glioma cells [PMID:30082910 "ANKDD1A directly interacts with FIH1 and inhibits the transcriptional
      activity of HIF1α by upregulating FIH1."]. The term is not wrong in principle but is unsupported
      for this protein [file:human/ANKDD1A/ANKDD1A-deep-research-affinage.md "Beyond its FIH1/HIF1α axis
      in glioma, no further molecular detail has been characterized in the available corpus."].
    supported_by:
    - reference_id: PMID:30082910
      supporting_text: ANKDD1A directly interacts with FIH1 and inhibits the transcriptional activity
        of HIF1α by upregulating FIH1.
    - reference_id: file:human/ANKDD1A/ANKDD1A-deep-research-affinage.md
      supporting_text: Beyond its FIH1/HIF1α axis in glioma, no further molecular detail has been characterized
        in the available corpus.
