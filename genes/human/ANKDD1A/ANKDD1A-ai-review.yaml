description: ANKDD1A (ankyrin repeat and death domain-containing 1A) is an uncharacterized protein with
  eleven ankyrin repeats and a C-terminal death domain. Its promoter is often hypermethylated and silenced
  in glioma. One study in glioblastoma cells reports that ANKDD1A binds the asparaginyl hydroxylase FIH1
  (HIF1AN) and lowers HIF1-alpha activity under hypoxia, and the FIH1 interaction is also seen in a proteome-scale
  interaction map. Whether ANKDD1A regulates FIH1 or is one of its ankyrin-repeat substrates is unknown,
  as is its normal function.
