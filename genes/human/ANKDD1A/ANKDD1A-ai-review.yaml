  review:
    summary: Protein binding (IPI) with FIH1/HIF1AN, from BioPlex. The interaction is independently reported,
      but generic protein binding is uninformative; removed.
    action: REMOVE
    reason: 'A targeted glioma study also reports that ANKDD1A binds FIH1 [PMID:30082910 "ANKDD1A directly
      interacts with FIH1 and inhibits the transcriptional activity of HIF1α by upregulating FIH1."],
      so the interaction is likely real. But what it means is unknown. ANKDD1A could be an FIH1 regulator,
      as that study proposes, or an FIH1 substrate: FIH1 hydroxylates a conserved asparagine in the ankyrin
      consensus of many ankyrin-repeat proteins [PMID:17003112 "The target Asn residue is highly conserved
      as part of the ankyrin consensus, and peptides derived from a diverse range of ARD-containing proteins
      supported FIH enzyme activity."], and ANKDD1A has eleven ankyrin repeats. No informative MF term
      can be chosen until that is resolved, so the row is removed and the question recorded.'
    supported_by:
    - reference_id: PMID:30082910
      supporting_text: ANKDD1A directly interacts with FIH1 and inhibits the transcriptional activity
        of HIF1α by upregulating FIH1.
    - reference_id: PMID:17003112
      supporting_text: The target Asn residue is highly conserved as part of the ankyrin consensus, and
        peptides derived from a diverse range of ARD-containing proteins supported FIH enzyme activity.
