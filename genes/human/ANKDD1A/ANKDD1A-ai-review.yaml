description: ANKDD1A (ankyrin repeat and death domain-containing 1A) is an uncharacterized protein with
  eleven ankyrin repeats and a C-terminal death domain. Its promoter is often hypermethylated and silenced
  in glioma. One study, overexpressing ANKDD1A in glioblastoma cells and xenografts, reports that it binds
  the asparaginyl hydroxylase FIH1 (HIF1AN), lowers HIF1-alpha activity under hypoxia and slows tumor
  growth. The FIH1 interaction is also seen in a proteome-scale interaction map. Whether ANKDD1A regulates
  FIH1 or is one of its ankyrin-repeat substrates is unknown, as is its normal function.
