  review:
    summary: Protein binding (IPI) with FIH1/HIF1AN, from BioPlex. The interaction is replicated and domain-mapped,
      and FIH1 is an enzyme; modified to enzyme binding.
    action: MODIFY
    reason: 'A targeted glioma study confirms that ANKDD1A binds FIH1 [PMID:30082910 "ANKDD1A directly
      interacts with FIH1 and inhibits the transcriptional activity of HIF1α by upregulating FIH1."] and
      maps the contact to the FIH1 N-terminal domain [PMID:30082910 "These results indicate that the N-terminal
      domain of FIH1 is responsible for the interaction with ANKDD1A."]. FIH1 is an asparaginyl hydroxylase,
      so GO:0019899 enzyme binding describes the interaction without deciding what it means. ANKDD1A could
      be an FIH1 regulator, as that study proposes, or an FIH1 substrate: FIH1 hydroxylates a conserved
      asparagine in the ankyrin consensus of many ankyrin-repeat proteins [PMID:17003112 "The target Asn
      residue is highly conserved as part of the ankyrin consensus, and peptides derived from a diverse
      range of ARD-containing proteins supported FIH enzyme activity."], and ANKDD1A has eleven ankyrin
      repeats. Enzyme binding holds under either hypothesis.'
