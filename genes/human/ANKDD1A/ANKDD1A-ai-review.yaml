- id: PMID:30082910
  title: Hypermethylated gene ANKDD1A is a candidate tumor suppressor that interacts with FIH1 and decreases
    HIF1α stability to inhibit cell autophagy in the glioblastoma multiforme hypoxia microenvironment.
  findings:
  - statement: ANKDD1A binds FIH1 and inhibits HIF1-alpha activity.
    supporting_text: ANKDD1A directly interacts with FIH1 and inhibits the transcriptional activity of
      HIF1α by upregulating FIH1.
  - statement: ANKDD1A acts as a tumor suppressor in hypoxic glioma cells.
    supporting_text: Here, we first demonstrated that ANKDD1A is a functional tumor suppressor gene, especially
      in the hypoxia microenvironment.
  - statement: ANKDD1A overexpression slows xenograft growth and extends survival.
    supporting_text: Our studies indicated that ANKDD1A expression inhibited tumor growth in vivo and
      extended mouse overall survival.
  - statement: The FIH1 N-terminal domain binds ANKDD1A.
    supporting_text: These results indicate that the N-terminal domain of FIH1 is responsible for the
      interaction with ANKDD1A.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Full text. The only functional study: glioblastoma lines and U251 xenografts, all by
      ectopic overexpression of a silenced gene.'
- id: PMID:17003112
  title: Posttranslational hydroxylation of ankyrin repeats in IkappaB proteins by the hypoxia-inducible
    factor (HIF) asparaginyl hydroxylase, factor inhibiting HIF (FIH).
  findings:
  - statement: FIH hydroxylates a conserved Asn in the ankyrin consensus of many ankyrin-repeat proteins.
    supporting_text: The target Asn residue is highly conserved as part of the ankyrin consensus, and
      peptides derived from a diverse range of ARD-containing proteins supported FIH enzyme activity.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only. Establishes ankyrin-repeat proteins as general FIH substrates; ANKDD1A
      itself is not tested.
