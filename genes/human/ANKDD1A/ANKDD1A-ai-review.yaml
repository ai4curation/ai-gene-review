knowledge_gaps:
- gap_statement: ANKDD1A's molecular activity and normal function are unknown; whether it regulates FIH1
    or is an FIH1 substrate is unresolved.
  boundary: 'All functional data come from one paper from one group, in glioma only, and all are gain-of-function:
    ANKDD1A was overexpressed in glioblastoma lines where it is normally silenced, including in xenografts.
    Nothing tests its loss in a normal tissue.'
