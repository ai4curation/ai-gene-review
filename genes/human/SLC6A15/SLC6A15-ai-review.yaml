id: Q9H2J7
gene_symbol: SLC6A15
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SLC6A15 (B0AT2) is a sodium-dependent, concentrative (symporter) plasma-membrane
  transporter for small, hydrophobic, zwitterionic neutral amino acids. It belongs to
  the SLC6 (sodium:neurotransmitter symporter / SNF) family but, unlike the biogenic-amine
  members, it does not transport neurotransmitters and is not chloride-dependent. B0AT2
  couples the uphill import of amino acids to the downhill movement of Na+, with a strong
  preference for the branched-chain amino acids leucine, valine and isoleucine plus
  methionine (micromolar affinity); it also carries proline (electrogenic 1:1 proline:Na+
  cotransport) and, as low-affinity substrates, alanine, serine, threonine, cysteine,
  glutamine, asparagine, phenylalanine and pipecolate, while excluding aromatic/charged
  amino acids, beta-amino acids, glycine and GABA. Expression is almost exclusive to the
  brain, where the protein is proposed to supply amino-acid (notably BCAA) nitrogen for
  neurotransmitter biosynthesis in glutamatergic and GABAergic neurons. Transporter surface
  density is regulated by PKC.
