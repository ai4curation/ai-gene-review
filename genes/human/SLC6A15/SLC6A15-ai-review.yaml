- term:
    id: GO:0005326
    label: neurotransmitter transmembrane transporter activity
  evidence_type: NAS
  original_reference_id: PMID:11112352
  qualifier: enables
  review:
    summary: NAS from the 2000 orphan-transporter cloning paper, which assigned v7-3
      to the Na+/Cl--dependent neurotransmitter transporter family on sequence grounds
      but did not identify any substrate. Later functional characterization established
      B0AT2 as a neutral amino-acid transporter that explicitly excludes neurotransmitters.
    action: MARK_AS_OVER_ANNOTATED
    reason: This term rests on family/sequence membership asserted before the substrate
      was known; the cloning paper itself states the substrates were unknown. Functional
      characterization (PubMed:16226721) shows B0AT2 transports branched-chain and other
      neutral amino acids and excludes GABA and glycine, so it is not a neurotransmitter
      transporter. It supplies amino-acid precursors for neurotransmitter synthesis
      rather than transporting neurotransmitters, making this an over-annotation.
    supported_by:
    - reference_id: PMID:11112352
      supporting_text: the substrates transported by these transporters remain unknown
    - reference_id: PMID:16226721
      supporting_text: SBAT1 excluded aromatic or charged amino acids, beta-amino acids,
        glycine, and GABA.
