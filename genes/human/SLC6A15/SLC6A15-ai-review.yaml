  title: Characterization of a branched-chain amino-acid transporter SBAT1 (SLC6A15)
    that is expressed in human brain.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-verified. First functional characterization of human SLC6A15
      (SBAT1/B0AT2); establishes Na+-coupled, concentrative transport of neutral amino
      acids with strong BCAA/methionine preference, exclusion of aromatic/charged amino
      acids, glycine and GABA, brain-specific expression, and PKC regulation of surface
      density. Primary support for the core molecular-function and process annotations.
