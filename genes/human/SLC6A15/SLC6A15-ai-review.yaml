core_functions:
- description: Sodium-coupled, concentrative symport of neutral amino acids across the
    neuronal plasma membrane, with a strong preference for branched-chain amino acids
    (leucine, valine, isoleucine) and methionine, also carrying proline and other
    low-affinity neutral amino acids.
  molecular_function:
    id: GO:0015657
    label: branched-chain amino acid:sodium symporter activity
  supported_by:
  - reference_id: PMID:16226721
    supporting_text: SBAT1 exhibited a strong preference for branched-chain amino
      acids (BCAA) and methionine
  locations:
  - id: GO:0005886
    label: plasma membrane
- description: Na+-coupled transport of a broad set of neutral (zwitterionic) amino
    and imino acids, including proline (electrogenic 1:1 proline:Na+ cotransport),
    supplying amino-acid nitrogen for neurotransmitter synthesis in neurons.
  molecular_function:
    id: GO:0005295
    label: neutral L-amino acid:sodium symporter activity
  supported_by:
  - reference_id: PMID:16226721
    supporting_text: SBAT1 mediated Na+-coupled transport of hydrophobic, zwitterionic
      alpha-amino and imino acids.
  locations:
  - id: GO:0005886
    label: plasma membrane
suggested_questions:
- question: Does B0AT2-mediated branched-chain amino-acid uptake quantitatively
    control glutamate/GABA pools in specific neuronal populations in vivo?
- question: What determines B0AT2's unusual chloride-independence within the SLC6
    family, and does it require any ancillary (collectrin/TMEM27-like) subunit for
    surface trafficking the way SLC6A19 (B0AT1) requires ACE2/collectrin?
suggested_experiments:
- description: Electrophysiological and radiotracer substrate profiling of human B0AT2
    in a heterologous system to define the full substrate scope, affinities, and Na+
    coupling stoichiometry for each neutral amino acid, including low-affinity substrates.
- description: Conditional neuronal Slc6a15 knockout in mouse with metabolomic
    quantification of intracellular BCAA and neurotransmitter (glutamate, GABA) levels
    to test the neurotransmitter-precursor-supply hypothesis.
