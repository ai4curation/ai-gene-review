      it to the Na+/Cl--dependent neurotransmitter transporter family by sequence and
      showed cell-surface expression, but explicitly states the substrates were unknown.
      The family-based neurotransmitter transporter/transport annotations (NAS) derive
      from here and are superseded by later functional characterization.
