    label: ubiquitin ligase inhibitor activity
  evidence_type: IDA
  original_reference_id: PMID:15962011
  qualifier: enables
  review:
    summary: SPRY2 binds the E3 ligase CBL (phospho-Tyr55 to the TKB domain) and CIN85, and inhibits CBL-mediated
      EGFR ubiquitination, endocytosis and degradation.
    action: NEW
    reason: SPRY2 itself performs the inhibitory step (competitive occupation of the CBL TKB domain together
      with CIN85 binding), not merely being required for an outcome; mutants that cannot bind CBL or CIN85
      lose the activity. No existing SPRY2 MF annotation captures this; it is currently represented only
      as protein binding and an IMP 'kinase activator' term.
