- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:15962011
  qualifier: enables
  supporting_entities:
  - UniProtKB:P22681
  review:
    summary: SPRY2 binds the E3 ubiquitin ligase CBL (c-Cbl) via phospho-Tyr55 and inhibits CBL-mediated
      ubiquitination and downregulation of EGFR.
    action: MODIFY
    reason: 'The paper shows more than binding: SPRY2 engagement of CBL inhibits CBL-mediated EGFR ubiquitination/downregulation.
      ''Ubiquitin ligase inhibitor activity'' (GO:1990948; ''binds to and stops, prevents or reduces the
      activity of a ubiquitin ligase'') captures the functional consequence; protein binding is uninformative.'
