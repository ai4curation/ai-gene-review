    - reference_id: PMID:15962011
      supporting_text: Sprouty2 therefore acts as an inducible inhibitor of EGFR downregulation by targeting
        both the Cbl and CIN85 pathways
    - reference_id: PMID:15962011
      supporting_text: Thus, Sprouty2 removes Cbl from activated EGFRs and blocks Cbl-mediated EGFR ubiquitination
        and degradation, which leads to sustained receptor signalling
    - reference_id: PMID:17974561
      supporting_text: Tesk1 does not affect interaction of Spry2 with the E3 ubiquitin ligase, c-Cbl,
