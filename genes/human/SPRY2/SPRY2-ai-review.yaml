core_functions:
- description: 'Inducible feedback inhibitor of FGFR-Ras-ERK signalling by sequestration of the adaptor
    GRB2: after PP2A-mediated serine dephosphorylation, the SPRY2-specific C-terminal PXXPXR motif binds
    the GRB2 N-terminal SH3 domain and competes with SOS1, reducing Ras activation and ERK1/2 phosphorylation.'
