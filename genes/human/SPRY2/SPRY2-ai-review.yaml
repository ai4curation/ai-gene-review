    label: enzyme inhibitor activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q9QXV8
  - ensembl:ENSMUSP00000022709
  review:
    summary: Ensembl Compara orthology transfer of 'enzyme inhibitor activity' from mouse Spry2.
    action: MODIFY
    reason: Correct in essence but very general. The best-supported enzyme-inhibitory activity of SPRY2
      is antagonism of protein kinases (RAF1, BRAF, SYK; DYRK1A substrate competition), captured by the
      family IBA GO:0004860. SPRY2 also inhibits the CBL E3 ligase (GO:1990948), proposed separately.
    proposed_replacement_terms:
    - id: GO:0004860
      label: protein kinase inhibitor activity
    supported_by:
    - reference_id: PMID:26809508
      supporting_text: Mechanistically, we show that SPRY2 attenuates the B-cell receptor (BCR) and MAPK-Erk
        signaling by binding to and antagonizing the activities of RAF1, BRAF, and spleen tyrosine kinase
        (SYK) in normal B cells and CLL cells
- term:
