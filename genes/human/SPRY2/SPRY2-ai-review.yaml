id: O43597
gene_symbol: SPRY2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'Protein sprouty homolog 2 (SPRY2) is a small, non-enzymatic intracellular member of the
  Sprouty family that acts as a growth-factor-inducible feedback regulator of receptor tyrosine kinase
  (RTK) signalling. It is cytosolic in resting cells, associates with microtubules, and on growth-factor
  stimulation translocates to plasma-membrane ruffles and endosomes, a targeting that depends on S-acylation
  of its C-terminal cysteine-rich Sprouty domain. Downstream of FGF receptors SPRY2 inhibits the Ras-ERK
  pathway: following PP2A-mediated serine dephosphorylation a C-terminal PXXPXR motif binds the GRB2 N-terminal
  SH3 domain and competes with SOS1, and SPRY2 also binds and antagonizes RAF kinases (RAF1, BRAF) and
  SYK. Phosphorylation of the conserved N-terminal Tyr55 creates a high-affinity docking site for the
  TKB domain of the E3 ligase CBL; together with binding of the endocytic adaptor CIN85 this sequesters
  CBL from activated EGFR, inhibiting EGFR ubiquitination and downregulation and thereby sustaining EGF-induced
  signalling. SPRY2 output is therefore receptor- and context-dependent: inhibitory for FGFR-ERK signalling
  but potentiating for EGFR signalling. SPRY2 additionally associates with PLC-gamma, caveolin-1 and TESK1
  (which inactivates it), and its loss or repression affects angiogenesis, cell survival and lens and
  lung development in model systems.'
