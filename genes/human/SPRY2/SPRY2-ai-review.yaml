suggested_questions:
- question: Which SPRY2 mechanism dominates FGFR-ERK inhibition in physiological settings - GRB2 sequestration
    via the PXXPXR motif, or RAF/BRAF antagonism - and does SPRY2 directly reduce RAF catalytic activity
    or only its activation?
- question: Is SPRY2 inhibition of CBL best represented in GO as a ubiquitin ligase inhibitor activity
    on SPRY2, with EGFR as has_input on CBL, and should the EGFR-potentiating and FGFR-inhibiting outputs
    be modelled as distinct activities in GO-CAM?
- question: Should the family IBA 'negative regulation of epidermal growth factor receptor signaling pathway'
    (seeded by Drosophila Sprouty) be excluded from mammalian SPRY2/SPRY1, given their CBL/CIN85-mediated
    potentiation of EGFR signalling?
- question: Does SPRY2 inhibit PLC-gamma enzymatic activity directly (via its SH2-binding phospho-Tyr55)
    or by sequestration, and is this an additional protein-sequestering or enzyme-inhibitor function?
suggested_experiments:
- description: Reconstituted in vitro assays with purified RAF1/BRAF, MEK substrate and recombinant SPRY2
    (wild type, serine-to-alanine and CRD mutants) to test direct inhibition of RAF catalytic activity.
  experiment_type: in vitro kinase assay
  hypothesis: SPRY2 directly inhibits RAF kinase activity rather than only binding RAF.
- description: In vitro ubiquitination of EGFR (or its pY1045 peptide fusion) by CBL in the presence of
    phospho-Tyr55 SPRY2 versus Y55F mutant, with and without CIN85.
  experiment_type: in vitro ubiquitination assay
  hypothesis: Phospho-SPRY2 competitively inhibits CBL E3 activity toward EGFR, enhanced by CIN85 bridging.
- description: Endogenous SPRY2 knock-in of PXXPXR (GRB2-binding) versus Y55F (CBL-binding) mutations,
    measuring FGF- and EGF-induced ERK kinetics and EGFR half-life in the same cell line.
  experiment_type: CRISPR knock-in mutagenesis
  hypothesis: The GRB2 and CBL binding sites separately account for FGFR inhibition and EGFR potentiation.
