  review:
    summary: PAINT IBA placing protein kinase inhibitor activity at the Sprouty family node (PTN000961788),
      with human SPRY2 and SPRY4 among the descendant evidence.
    action: ACCEPT
    reason: 'Consistent with SPRY2-specific evidence: SPRY2 binds RAF kinases and antagonizes RAF1, BRAF
      and SYK, and is a stronger inhibitor of growth-factor-induced MAPK activation when not serine-phosphorylated.
      Shared with SPRY4 (RAF1/TESK1). SPRY2 appearing in its own with/from list reflects its own experimental
      grounding and is expected.'
    supported_by:
    - reference_id: PMID:26809508
      supporting_text: Mechanistically, we show that SPRY2 attenuates the B-cell receptor (BCR) and MAPK-Erk
        signaling by binding to and antagonizing the activities of RAF1, BRAF, and spleen tyrosine kinase
        (SYK) in normal B cells and CLL cells
    - reference_id: PMID:19690147
      supporting_text: Sprouty2 is a feedback regulator that controls the Ras/Raf/MEK/extracellular signal-regulated
        kinase mitogen-activated protein kinase (MAPK) pathway at multiple levels, one way being through
        direct interaction with Raf kinases
    - reference_id: PMID:19690147
