proposed_new_terms:
- proposed_name: intracellular pyridoxal 5'-phosphate homeostasis
  proposed_definition: >-
    A homeostatic process involved in the maintenance of a steady state level of pyridoxal 5'-phosphate
    within a cell.
  justification: >-
    PLPHP and its orthologs (E. coli YggS, yeast YBL036C, plant PLPHPs) are consistently described as
    PLP homeostasis proteins: they bind PLP and their loss disturbs the PLP pool, but they do not catalyse
    a step of vitamin B6 metabolism. The only available process term is the broad vitamin B6 metabolic
    process (GO:0042816).
  proposed_parent:
    id: GO:0055082
    label: intracellular chemical homeostasis
  supported_by:
  - reference_id: PMID:27912044
    supporting_text: our studies suggest that PROSC is involved in intracellular homeostatic regulation
      of PLP
  - reference_id: PMID:26872910
    supporting_text: >-
      Comparative genomic, genetic and metabolic analyses suggest that these phenotypes reflect an imbalance
      in PLP homeostasis.
suggested_questions:
- question: >-
    Does human PLPHP hand PLP directly to apo-enzymes, as shown in vitro for the Arabidopsis, E. coli
    and Salmonella proteins, or does it only buffer free PLP? The human interactome did not show enrichment
    of PLP-dependent enzymes.
- question: >-
    Is the mitochondrial pool of PLPHP inside the matrix, and how is it imported given that no cleavable
    presequence is annotated?
- question: >-
    Is the RNA binding reported for E. coli YggS and for recombinant human PLPHP physiological in human
    cells, and which RNAs are bound?
- question: >-
    Is recombinant human PLPHP a monomer or a homodimer in cells? Two laboratories report mostly monomer
    and one reports mostly dimer.
- question: >-
    Do the exposed, poorly conserved patient variants p.Pro87Leu and p.Ala107Thr and the C-terminal p.His275Asp
    reduce protein level in patient cells, or do they affect a surface interaction? The monomer model
    gives no structural reason for loss of function.
- question: >-
    Should GO add an intracellular pyridoxal 5'-phosphate homeostasis term, so that the YggS/PLPHP family
    need not be annotated to vitamin B6 metabolic process?
suggested_experiments:
- hypothesis: >-
    PLPHP protects newly synthesised PLP from dephosphorylation and transfers it to apo-enzymes.
  description: >-
    Reconstitute purified human PDXK or PNPO, PDXP, PLPHP (wild type, K47A and R241Q) and an apo-aminotransferase,
    and measure PLP hydrolysis and holo-enzyme formation over time with and without PLPHP.
- hypothesis: A fraction of PLPHP is imported into the mitochondrial matrix.
  description: >-
    Protease-protection and carbonate extraction on purified mitochondria from human cells with endogenously
    tagged PLPHP, with matrix, intermembrane-space and outer-membrane markers, and N-terminal sequencing
    of the mitochondrial form to test for presequence cleavage.
- hypothesis: >-
    Exposed patient variants act by lowering protein abundance rather than by changing PLP binding.
  description: >-
    Express p.Pro87Leu, p.Ala107Thr and p.His275Asp in PLPHP-knockout HEK293 cells at single copy, and
    measure protein half-life, PLP occupancy and rescue of the cellular B6 vitamer profile.
