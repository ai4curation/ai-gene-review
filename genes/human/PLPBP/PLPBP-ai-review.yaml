core_functions:
- description: >-
    Binds pyridoxal 5'-phosphate covalently, as a Schiff base on Lys47 of a single-domain fold-type III
    barrel, and is required to keep the cellular pool of PLP and its precursor vitamers in balance in
    the cytosol and in mitochondria. No catalytic activity is known, and the mechanism by which PLP binding
    maintains the pool is unresolved.
