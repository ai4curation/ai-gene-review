- term:
    id: GO:0030170
    label: pyridoxal phosphate binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000015833
  - SGD:S000000132
  - UniProtKB:P67080
  review:
    summary: >-
      PLP binding propagated from PANTHER node PTN000015833, seeded by yeast YBL036C and E. coli YggS.
      The human protein itself binds PLP covalently: recombinant PLPHP carries PLP as a Schiff base (PMID:29689137)
      and the adduct was mapped to Lys47 by mass spectrometry (PMID:31825581).
    action: ACCEPT
    reason: >-
      This is the one molecular function with direct evidence on the human protein and it is the property
      the family is named for. The node placement is sound: in four PLP-bound homolog crystal structures
      (yeast, E. coli, cyanobacterium) the Schiff-base lysine aligns with human Lys47, and the phosphate
      and ring contacts (Ser226, Gly243, Arg241, Asn68) are conserved. No more specific molecular function
      term can be supported, because the protein has no known catalytic or carrier activity.
    additional_reference_ids:
    - PMID:29689137
    - PMID:31825581
    - PMID:12499548
    supported_by:
    - reference_id: PMID:29689137
      supporting_text: Normal PLPHP is largely a monomer with PLP bound through a Schiff-base linkage.
    - reference_id: PMID:31825581
      supporting_text: >-
        Lys47 was determined the PLP-binding site of PLPBP via liquid chromatography combined with tandem
        MS (LC-MS/MS) analysis
    - reference_id: file:human/PLPBP/PLPBP-bioinformatics/RESULTS.md
      supporting_text: >-
        In all four templates the lysine whose NZ is covalently linked to PLP C4A aligns with human **Lys47**
        (yeast K49, E. coli K36, PipY K26).
