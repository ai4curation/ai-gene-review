- id: file:human/PLPBP/PLPBP-deep-research-openscientist.md
  title: OpenScientist deep research report for PLPBP
  findings:
  - statement: >-
      The report concludes that PLPBP is a non-catalytic PLP-binding protein whose loss lowers cellular
      PLP, in agreement with this review.
    supporting_text: >-
      It is not an enzyme, not a membrane transporter, and has no established signalling function in human
      cells.
  - statement: >-
      The report argues the protein acts only in the cytosol and that the mitochondrial annotation is
      not direct human evidence.
    supporting_text: >-
      The only mitochondrial annotation (GO:0005739) is high-throughput (HTP, ECO:0006056) transferred
      from a *Drosophila* study, not human direct evidence.
  reference_review:
    relevance: MEDIUM
    correctness: DISPUTED
    review_notes: >-
      Provider output, kept verbatim. Two claims are not adopted. (1) It describes the GO:0005739 HTP
      row as transferred from a Drosophila study; the row cites the MitoCarta3.0 inventory of mammalian
      mitochondrial proteins (PMID:34800366) and FlyBase is only the assigning group. It also does not
      weigh the two targeted human studies that place PLPHP in mitochondria (PMID:30668673, PMID:37451483).
      Its N-terminal analysis (no canonical cleavable presequence) agrees with the descriptors in the
      bioinformatics folder and is the reason no matrix row is added. (2) It states PLP handover to apo-enzymes
      as the mechanism; the transfer experiments it cites are on E. coli and Salmonella YggS, not the
      human protein, so this review keeps the mechanism as an open gap.
