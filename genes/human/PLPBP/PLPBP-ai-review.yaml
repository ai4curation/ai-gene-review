gene_symbol: PLPBP
aliases:
- PLPHP
- PROSC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  PLPBP encodes pyridoxal 5'-phosphate homeostasis protein (PLPHP, formerly PROSC), a 275-residue member
  of the ubiquitous YggS/PROSC (COG0325) family found in bacteria, archaea and eukaryotes. The protein
  is a single-domain fold-type III barrel related to the N-terminal domain of alanine racemase, and it
  holds pyridoxal 5'-phosphate (PLP), the active form of vitamin B6, as a Schiff base on Lys47. Unlike
  the PLP-dependent enzymes of this fold it has no second domain and no established catalytic activity.
  It is ubiquitously expressed and is found in the cytosol and in mitochondria. Cells lacking it have
  a lower PLP pool, accumulate the pyridoxine and pyridoxamine phosphate precursors of PLP, and show reduced
  activity of PLP-dependent enzymes, including mitochondrial transaminases; the human protein rescues
  the equivalent bacterial mutant, so the function is conserved. How it maintains the PLP pool is not
  established: proposals include shielding newly made PLP from phosphatases and side reactions and passing
  it to apo-enzymes, and bacterial orthologs can transfer PLP to an apo-enzyme in vitro. Biallelic loss-of-function
  variants cause an autosomal recessive early-onset epilepsy that responds to pyridoxine or PLP.
