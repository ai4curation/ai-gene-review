- term:
    id: GO:0005739
    label: mitochondrion
  evidence_type: HTP
  original_reference_id: PMID:34800366
  qualifier: located_in
  review:
    summary: >-
      Mitochondrion from the MitoCarta3.0 inventory (PMID:34800366). Targeted studies agree: PLPHP was
      localised to mitochondria in human cells (PMID:30668673) and is present in the mitochondrial fraction
      of HEK293 cells (PMID:37451483). Loss of PLPHP changes mitochondrial PLP and pyridoxamine phosphate
      levels and impairs mitochondrial oxidative metabolism (PMID:37451483).
    action: ACCEPT
    reason: >-
      Direct evidence for the organelle from a proteomic inventory and from two targeted studies, with
      a functional consequence in mitochondria when the protein is absent. The sub-compartment is not
      resolved: UniProt annotates no transit peptide, and the only indication of a matrix pool is indirect
      and from mouse (accumulation in mitochondria lacking the matrix protease CLPP, PMID:38139332). With
      one line of evidence no sub-compartment row is added. The OpenScientist deep-research report argues
      for a cytosol-only protein because the N-terminus has no canonical presequence; that argument bears
      on the import route and sub-compartment, not on the direct localization data, so the organelle row
      is kept. The fractionation in PMID:37451483 had cytosolic GAPDH in the mitochondrial fraction, so
      the organelle claim rests on the combination of sources rather than on that blot alone.
    additional_reference_ids:
    - PMID:30668673
    - PMID:37451483
    - PMID:38139332
    - file:human/PLPBP/PLPBP-deep-research-openscientist.md
