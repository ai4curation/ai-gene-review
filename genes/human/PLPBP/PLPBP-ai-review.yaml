  - statement: Reported variant numbering is canonical numbering.
    supporting_text: >-
      All 24 literature variants that carry a protein change reproduce that change when their c. change
      is applied to the CDS
  - statement: >-
      Patient missense variants are more conserved, more buried and nearer PLP than other population missense
      variants.
    supporting_text: patient missense variants (n = 18) differ from other gnomAD missense variants (n
      = 301)
  - statement: Heterozygous loss of function is tolerated.
    supporting_text: >-
      63 high-confidence predicted loss-of-function alleles, total allele count 307, no homozygotes.
