    summary: >-
      Vitamin B6 metabolic process propagated from PANTHER node PTN000015836, seeded by yeast YBL036C
      (IMP, PMID:37451483) and zebrafish plpbp (IMP, PMID:30668673). In human cells loss of PLPHP lowers
      PLP and raises the PNPO substrates pyridoxine and pyridoxamine phosphate (PMID:37451483), and the
      human protein rescues the pyridoxine sensitivity of E. coli lacking YggS (PMID:27912044).
    action: ACCEPT
    reason: >-
      Kept as the core process at this breadth. PLPHP does not catalyse a vitamer interconversion, but
      it binds the end product of the pathway and its loss changes several B6 vitamer pools at once: PLP
      falls and pyridoxine 5'-phosphate and pyridoxamine 5'-phosphate rise in human fibroblasts and HEK293
      cells, and the same pattern is seen in yeast, zebrafish and bacteria. The narrower child term GO:0042822
      pyridoxal 5'-phosphate metabolic process (an is_a child of this term, confirmed in QuickGO) was
      considered and not used as a replacement, because the evidence on this row is about the balance
      between the vitamers and not about PLP alone, so the vitamin B6-wide term is the breadth the data
      support. A homeostasis term for PLP does not exist in GO and is requested separately under proposed_new_terms;
      that request is an ontology gap and not a claim that this row is wrong. The node is seeded only
      from eukaryotes although bacterial members share the phenotype; that affects how far the term propagates,
      not whether it is right for the human protein.
