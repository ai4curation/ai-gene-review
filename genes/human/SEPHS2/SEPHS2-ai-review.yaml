id: Q99611
gene_symbol: SEPHS2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SEPHS2 (selenophosphate synthetase 2, selenide water dikinase 2, EC 2.7.9.3) is the human
  enzyme that makes the activated selenium donor for selenocysteine synthesis. In an ATP- and Mg2+-dependent
  reaction it converts hydrogenselenide and water to monoselenophosphate, releasing AMP and phosphate.
  SEPSECS uses monoselenophosphate to convert O-phosphoseryl-tRNA(Sec) to selenocysteinyl-tRNA(Sec), so
  SEPHS2 supplies selenium for the whole selenoproteome. SEPHS2 is itself a selenoprotein, with a catalytic
  selenocysteine at position 60 encoded by an in-frame UGA, so its own synthesis depends on the pathway
  it supplies. Truncated SEPHS2 chains produced by failed UGA decoding are removed by the CRL2(KLHDC3)
  ubiquitin ligase. The enzyme is a PurM-fold homodimer with ATP bound between the subunits. It is cytosolic
  and associates with SEPHS1, SEPSECS and TRNAU1AP (SECp43). Its paralog SEPHS1 lacks the selenocysteine
  and does not substitute for SEPHS2 in de novo selenophosphate synthesis.
