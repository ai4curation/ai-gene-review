  - *id005
suggested_questions:
- question: Under selenium limitation, does reduced Sec60 incorporation into SEPHS2 itself (with CRL2(KLHDC3)
    clearance of truncated chains) create a feed-forward loss of selenophosphate supply, and does SEPHS1
    buffer it?
suggested_experiments:
- hypothesis: Selenophosphate output of SEPHS2 sets the selenoprotein hierarchy under limiting selenium.
  description: In SEPHS2-null cells rescued with Sec60 (UGA) or Cys60 (UGU) SEPHS2, titrate selenite and
    measure 75Se labelling of selenoproteins and Sec-tRNA(Sec) levels.
