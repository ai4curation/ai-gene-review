core_functions:
- description: 'Selenophosphate synthetase: ATP- and Mg2+-dependent synthesis of monoselenophosphate from
    hydrogenselenide and water (EC 2.7.9.3). This supplies the selenium donor that SEPSECS uses to form
    Sec-tRNA(Sec), the dedicated step through which SEPHS2 participates in selenocysteine biosynthesis.'
