id: Q9Y6E7
gene_symbol: SIRT4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SIRT4 is a mitochondrial matrix sirtuin that uses NAD+ to remove lipoamide cofactors from protein lysines and
  to ADP-ribosylate protein substrates. Its best-characterized reaction is DLAT delipoylation, which diminishes pyruvate dehydrogenase
  activity and shifts mitochondrial carbon use; it also ADP-ribosylates GLUD1 to inhibit glutamate dehydrogenase and can hydrolyze
  biotinyl-lysine, placing it at the intersection of pyruvate dehydrogenase control, glutamate metabolism, insulin secretion,
  and lipid oxidation.
