taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ANKRD11 is a large ankyrin-repeat-containing transcription coregulator that acts mainly in
  the nucleoplasm. It interacts with nuclear-receptor coregulators and histone-modifying proteins, and
  can repress or enhance transcription according to its partners and cellular context. Its nuclear-receptor-associated
  repression and p53-associated coactivation are mediated through protein interactions rather than an
  established sequence-specific DNA-binding domain. An N-terminal motif binds the STAG2–RAD21 interface
  of cohesin and can compete with CTCF for that interaction. These chromatin-associated regulatory activities
  influence neural precursor proliferation and differentiation. Heterozygous pathogenic variants cause
  KBG syndrome, with characteristic neurodevelopmental, dental, craniofacial and skeletal abnormalities.
