suggested_questions:
- question: How does endogenous ANKRD11 select among nuclear-receptor coregulators, p53-associated cofactors
    and cohesin in different cell types?
- question: Does the additional cytosolic pool execute a distinct function, or reflect trafficking, turnover
    or cell-state-dependent redistribution?
- question: Which developmental target genes connect ANKRD11 protein interactions to dental and craniofacial
    phenotypes, beyond the existing perturbation evidence?
- question: Can the original ANKRD11 localization experiments and construct identities in PMID:25413698
    be recovered for direct source-specific assessment?
suggested_experiments:
- description: Compare endogenous ANKRD11 interaction partners and transcriptional outputs in human neural
    precursors and cranial neural-crest derivatives, using binding-interface mutants with expression and
    localization controls.
