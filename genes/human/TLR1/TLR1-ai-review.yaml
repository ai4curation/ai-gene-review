    label: microglial cell activation
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:E9PTL5
  - ensembl:ENSRNOP00000097749
  review:
    summary: Electronic ortholog transfer (rat) of microglial cell activation.
    action: MARK_AS_OVER_ANNOTATED
    reason: TLR1 acts as the lipopeptide-selecting co-receptor of TLR2. Microglial activation is a downstream
      cellular outcome of TLR2-subfamily signaling; TLR1 enhanced TLR2-dependent Abeta42-triggered inflammatory
      activation, but this is not a microglia-specific role of TLR1 and the process is several steps removed
      from its receptor activity.
    supported_by:
    - reference_id: PMID:22198949
      supporting_text: TLR2-mediated Aβ42-triggered inflammatory activation was enhanced by TLR1 and suppressed
        by TLR6
- term:
    id: GO:0001875
    label: lipopolysaccharide immune receptor activity
  evidence_type: IDA
  original_reference_id: PMID:16880211
  qualifier: contributes_to
  review:
    summary: Curator IDA (the same evidence also underlies GO-CAM 5fb9cc0600000727) that TLR1 contributes
      to an immune receptor activity of the TLR1:TLR2 heterodimer.
    action: MODIFY
    reason: The contributes_to receptor claim is well founded - TLR1 and TLR2 form a pre-existing heterodimer
      that is activated at the cell surface by triacylated lipopeptide - but GO:0001875 is defined as
      combining with lipopolysaccharide. TLR1:TLR2 binds triacyl lipopeptides (the amide-linked acyl chain
      sits in a TLR1 channel), not LPS. The parent GO:0038187 pattern recognition receptor activity captures
      the activity without the wrong ligand.
    proposed_replacement_terms:
    - id: GO:0038187
      label: pattern recognition receptor activity
    supported_by:
    - reference_id: PMID:16880211
      supporting_text: Our data show that TLR2 forms heterodimers with TLR1 and TLR6 and that these heterodimer
        pre-exist and are not induced by the ligand
    - reference_id: PMID:16880211
      supporting_text: Activation occurs at the cell surface, and the observed trafficking is independent
        of signaling
    - reference_id: PMID:17889651
      supporting_text: the two ester-bound lipid chains are inserted into a pocket in TLR2, while the
        amide-bound lipid chain is inserted into a hydrophobic channel in TLR1
