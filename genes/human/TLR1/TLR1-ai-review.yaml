id: Q15399
gene_symbol: TLR1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'TLR1 is a type I transmembrane pattern recognition receptor of the Toll-like receptor family,
  expressed widely and most highly in leukocytes, spleen, thymus and ovary. Its leucine-rich-repeat ectodomain
  pairs with TLR2 to form a heterodimeric receptor at the plasma membrane that recognises triacylated
  bacterial lipopeptides and lipoproteins, such as the mycobacterial 19-kDa lipoprotein and synthetic
  Pam3CSK4: the two ester-linked acyl chains insert into a pocket in TLR2 and the amide-linked chain into
  a hydrophobic channel in TLR1, bridging the two ectodomains. Ligand-induced dimerisation juxtaposes
  the cytoplasmic TIR domains, which recruit TIRAP and MYD88 and lead through IRAK and TRAF6 to NF-kappaB
  activation and proinflammatory cytokine production. Activated TLR1:TLR2 complexes accumulate in lipid
  rafts and are then trafficked to the Golgi; TLR1 is also recruited to phagosomes. TLR1 polymorphisms,
  including the common I602S allele that impairs surface expression, influence susceptibility to leprosy.'
