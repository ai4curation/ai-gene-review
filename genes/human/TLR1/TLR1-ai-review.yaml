core_functions:
- description: 'As the TLR2 partner in the TLR1:TLR2 heterodimer, TLR1 contributes to pattern recognition
    receptor activity at the plasma membrane: triacylated lipopeptide bridges the two ectodomains (amide-linked
    acyl chain in the TLR1 channel), bringing the TIR domains together to recruit MyD88-pathway adaptors
    and initiate TLR1:TLR2 signaling.'
  contributes_to_molecular_function:
    id: GO:0038187
    label: pattern recognition receptor activity
  directly_involved_in:
  - id: GO:0038123
    label: toll-like receptor TLR1:TLR2 signaling pathway
  - id: GO:0042495
    label: detection of triacyl bacterial lipopeptide
  locations:
  - id: GO:0005886
    label: plasma membrane
  - id: GO:0044853
    label: plasma membrane raft
  in_complex:
    id: GO:0035354
    label: Toll-like receptor 1-Toll-like receptor 2 protein complex
  supported_by:
  - reference_id: PMID:17889651
    supporting_text: the two ester-bound lipid chains are inserted into a pocket in TLR2, while the amide-bound
      lipid chain is inserted into a hydrophobic channel in TLR1
  - reference_id: PMID:16880211
    supporting_text: Activation occurs at the cell surface, and the observed trafficking is independent
      of signaling
  - reference_id: PMID:12077222
    supporting_text: Macrophages from TLR1-deficient (TLR1(-/-)) mice showed impaired proinflammatory
      cytokine production in response to the 19-kDa lipoprotein and a synthetic triacylated lipopeptide
- description: TLR1 directly binds the amide-linked acyl chain of triacylated lipopeptides and binds TLR2;
    the choice of TLR1 (rather than TLR6) as partner sets the triacyl specificity of the TLR2 heterodimer.
  molecular_function:
    id: GO:0042497
    label: triacyl lipopeptide binding
  directly_involved_in:
  - id: GO:0071727
    label: cellular response to triacyl bacterial lipopeptide
  supported_by:
  - reference_id: PMID:17889651
    supporting_text: Binding of the tri-acylated lipopeptide, Pam(3)CSK(4), induced the formation of an
      "m" shaped heterodimer of the TLR1 and TLR2 ectodomains
  - reference_id: PMID:19931471
    supporting_text: Its ligand specificity is controlled by whether it heterodimerizes with TLR1 or TLR6
suggested_questions:
- question: GO:0001875 lipopolysaccharide immune receptor activity is currently used (contributes_to)
    for TLR1 and in GO-CAM 5fb9cc0600000727 for the TLR1:TLR2 complex, whose ligand is triacyl lipopeptide.
    Should these be moved to GO:0038187 pattern recognition receptor activity, or should GO add a lipopeptide-specific
    immune receptor activity term parallel to the LPS term?
- question: Is the TLR1:TLR10 heterodimer observed on overexpression formed at endogenous levels in B
    cells, and does it compete with TLR1:TLR2 for ligand or partner?
suggested_experiments:
- description: Quantify endogenous TLR1:TLR2 vs TLR10:TLR2 vs TLR1:TLR10 complexes in primary human B
    cells and monocytes by proximity ligation or co-immunoprecipitation with and without Pam3CSK4, and
    measure how the ratio changes the NF-kappaB response.
  hypothesis: TLR10 competes with TLR1 for TLR2 and ligand, tuning the TLR1:TLR2 response in cells where
    both are expressed.
  experiment_type: co-immunoprecipitation / proximity ligation assay
