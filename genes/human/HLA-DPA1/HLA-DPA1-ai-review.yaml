- term:
    id: GO:0002503
    label: peptide antigen assembly with MHC class II protein complex
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000460629
  - UniProtKB:P01903
  - UniProtKB:P01911
  - UniProtKB:P28067
  - UniProtKB:P28068
  review:
    summary: IBA on the class II PAINT node for the loading of an antigenic peptide into the class II
      binding groove.
    action: ACCEPT
    reason: 'This is the process the DP alpha chain is a direct participant in rather than merely a requirement
      for: the term is defined as "The binding of a peptide to the antigen binding groove of an MHC class
      II protein complex", and the DP2 crystal structure shows that the groove is built jointly by the
      alpha-1 and beta-1 domains, with alpha-chain residues (alphaAla11 shaping the p6 pocket floor, alphaArg76
      forming the cleft-stabilising salt bridge) determining its shape. The IBD node placement is sound:
      peptide loading is the ancestral, defining activity of the whole class II alpha/beta family and
      there is no evidence of divergence or loss in the DP isotype, which has been shown crystallographically
      to bind self-peptide in exactly this manner.'
    supported_by:
    - &id021
      reference_id: PMID:20356827
      supporting_text: The α1 and β1 domains of DP2 form the peptide-binding groove, and the peptide takes
        an extended polyproline-like helical course through the groove.
