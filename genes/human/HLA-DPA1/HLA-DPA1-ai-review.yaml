  review:
    summary: 'IMP row from the DP2 study: DP alpha-chain-expressing fibroblasts carrying wild-type DP
      beta presented beryllium to a patient-derived CD4 T-cell line, while acidic-pocket mutants of the
      beta chain abolished presentation without affecting assembly or superantigen presentation.'
    action: ACCEPT
    reason: 'The DP2 molecule assayed here is DPA1*01:03/DPB1*02:01, so the presenting entity whose function
      was measured includes this alpha chain, which supplies half of the groove that holds the self-peptide
