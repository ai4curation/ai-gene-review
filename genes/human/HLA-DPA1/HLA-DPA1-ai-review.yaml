id: P20036
gene_symbol: HLA-DPA1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: HLA-DPA1 encodes the alpha chain of the HLA-DP class II major histocompatibility molecule.
  It is a single-pass type I membrane glycoprotein whose N-terminal alpha-1 domain forms one half of the
  peptide-binding groove and whose C1-set immunoglobulin-like alpha-2 domain supports it; the chain is
  obligately heterodimeric with an HLA-DPB1 beta chain, and the two together create the cleft that binds
  peptides of roughly 10-30 residues. Newly made alpha and beta chains pair in the endoplasmic reticulum,
  where three heterodimers assemble onto a trimer of the invariant chain CD74 that occupies the groove
  and routes the complex through the Golgi and trans-Golgi network into the endocytic system. In the late
  endosomal/lysosomal MHC class II compartment CD74 is trimmed by cathepsins to the CLIP fragment, HLA-DM
  catalyses its release, and antigenic peptides generated from endocytosed or autophagy-delivered proteins
  are loaded into the groove. The peptide-loaded molecule is then delivered to the plasma membrane, where
  it displays its cargo to CD4 T cells, so that HLA-DP contributes to CD4 T-cell selection, activation
  and the ensuing helper responses. Expression is restricted largely to professional antigen-presenting
  cells and some epithelia and is driven by the CIITA/X-box promoter machinery, which makes the gene strongly
  interferon-gamma-inducible. The DP alpha chain is modestly polymorphic compared with the beta chain;
  crystallography of the DPA1*01:03/DPB1*02:01 molecule (HLA-DP2) shows alpha-chain residues shaping the
  peptide pockets and stabilising the cleft, and HLA-DP alleles are associated with chronic beryllium
  disease, hard metal lung disease and several autoimmune and infectious-disease susceptibilities.
