      genes on this node do: DM and DO act in trans on the alpha-beta-CLIP complex to catalyse or modulate
      CLIP release. The DP alpha chain is instead a constituent of the class II complex, so applying the
      term to it inverts the relationship in the same way GO:0032395 does, and the correct statements
      for this chain are part_of GO:0042613 and the GO:0042605 peptide antigen binding rows, all of which
      it already carries. It is marked as over-annotated rather than removed because the node placement
      is a defensible family-level call - the PANTHER node mixes class II subunits with class II binders
      - and the DP alpha chain does contact other class II molecules within the CD74 heterononamer, so
      the claim is not flatly false, merely uninformative and misdirected for this gene.'
