- id: file:human/HLA-DPA1/HLA-DPA1-deep-research-falcon.md
  title: Falcon deep research report for human HLA-DPA1
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: >-
      Provider-generated literature synthesis that completed after the review was
      written. Reconciled against the review: consistent with the peptide-binding,
      class II heterodimer, endolysosomal loading and CD4 T-cell presentation picture
      already asserted. Its three material additions were checked against primary
      papers and added as references here (PMID:38412034 DPA1-allele-dependent EBNA1
      presentation; PMID:28489076 DP-beta84Gly presentation of endogenous peptides;
      PMID:31358998 and PMID:37788895 HLA-DP as an NKp44 ligand). None of them changed
      an existing annotation action, and the report is not used as sole evidence for
      any GO decision.
- id: PMID:38412034
  title: An EBV-related CD4 TCR immunotherapy inhibits tumor growth in an HLA-DP5+ nasopharyngeal
    cancer mouse model.
  findings:
  - statement: With the DPB1*05:01 beta chain held constant, an EBNA1-derived epitope was naturally processed
      and presented by the DPA1*02:02 pairing but not by the DPA1*01:03 pairing, so the DP alpha allele
      can determine which endogenously derived antigen is displayed.
    supporting_text: EBNA1564–583 was endogenously processed by HLA-DPA1*02:02/DPB1*0501 but not by HLA-DPA1*01:03/DPB1*0501
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified (DOI 10.1172/JCI172092); full text cached in this session. Surfaced
      by the falcon deep research. Relevant to the open question of how much HLA-DP peptide specificity
      is set by the alpha chain; does not by itself add a GO annotation beyond the existing peptide antigen
      binding and class II presentation rows.
- id: PMID:28489076
  title: HLA-DP(84Gly) constitutively presents endogenous peptides generated by the class I antigen processing
    pathway.
  findings:
  - statement: HLA-DP heterodimers with Gly at beta-chain position 84 do not bind the invariant chain through
      the CLIP region and constitutively present proteasome-generated, TAP-transported endogenous peptides
      as well as endocytic ones.
    supporting_text: Importantly, these unique antigen presentation mechanisms enable DP84Gly to constitutively
      present intracellular peptides generated by the proteasome and transported to the ER by TAP, much
      like class I molecules.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified (DOI 10.1038/ncomms15244); full text cached in this session. Surfaced
      by the falcon deep research. The decisive polymorphism is in HLA-DPB1, so this is a property of
      particular assembled DP molecules rather than a DPA1-specific activity; recorded as a suggested
      question rather than as a new annotation on the alpha chain.
- id: PMID:31358998
  title: A subset of HLA-DP molecules serve as ligands for the natural cytotoxicity receptor NKp44.
  findings:
  - statement: The activating NK-cell receptor NKp44 binds directly to a subset of HLA-DP heterodimers,
      including HLA-DP401 (DPA1*01:03 with DPB1*04:01), but not to the HLA-DR or HLA-DQ molecules tested.
    supporting_text: the NKp44 Fc construct displayed significant binding to a subset of HLA-DP molecules,
      including the HLA-DP401 molecule
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified (DOI 10.1038/s41590-019-0448-4); full text cached in this session. Surfaced
      by the falcon deep research. Establishes an innate-receptor ligand role for assembled HLA-DP; the
      allele dependence maps to the DPA1/DPB1 pair, so it is recorded as a suggested question rather than
      asserted as a DPA1 molecular function.
- id: PMID:37788895
  title: HLA-DPA1*02:01~B1*01:01 is a risk haplotype for primary sclerosing cholangitis mediating activation
    of NKp44+ NK cells.
  findings:
  - statement: Interferon-gamma-stimulated cholangiocyte organoids carrying the DPA1*02:01~DPB1*01:01 haplotype
      upregulated HLA-DP, showed increased NKp44 binding, and triggered more NKp44+ NK-cell degranulation
      than HLA-DPB1 knockout organoids.
    supporting_text: Human cholangiocyte organoids expressing the PSC risk molecule HLA-DPA1*02:01-DPB1*01:01
      upregulated HLA-DP on stimulation with IFN-γ and showed an increased binding of NKp44, while degranulation
      of primary NKp44+NK cells was reduced against HLA-DPB1 KO compared with HLA-DP expressing WT cholangiocyte
      organoids.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified (DOI 10.1136/gutjnl-2023-329524); full text cached in this session. Surfaced
      by the falcon deep research. The genetic association and the functional assays both concern the
      paired DPA1-DPB1 haplotype, so no DPA1-specific annotation follows; it supports the interferon-gamma
      inducibility already kept as non-core and motivates a suggested question about NKp44 ligand activity.
