- id: file:human/HLA-DPA1/HLA-DPA1-uniprot.txt
  findings: []
  title: UniProt entry P20036 (HLA class II histocompatibility antigen, DP alpha 1 chain)
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The curated UniProt record for P20036, used for the function statement, the alpha/beta
      heterodimer and CD74 heterononamer subunit description, the full subcellular itinerary, the family
      assignment and the single recorded SREBF2 interaction.
core_functions:
- description: 'Forms, together with an HLA-DPB1 beta chain, the peptide-binding cleft of the HLA-DP class
    II molecule: the alpha-1 domain supplies one wall and part of the floor of the groove, with alpha-chain
    residues shaping the peptide side-chain pockets (alphaAla11 opening the bottom of the p6 pocket) and
    stabilising the cleft (the conserved alphaArg76-betaAsp55 salt bridge). The assembled heterodimer
    binds peptides of roughly 10-30 residues that are generated by lysosomal proteolysis of endocytosed
    and autophagy-delivered proteins, loading them in the late endosomal/lysosomal MHC class II compartment
    after HLA-DM releases the CD74-derived CLIP fragment, and then displays the bound peptide at the plasma
    membrane to the receptors of CD4 T cells, thereby activating class II-restricted helper T-cell responses.'
  molecular_function:
    id: GO:0042605
    label: peptide antigen binding
  directly_involved_in:
  - id: GO:0002503
    label: peptide antigen assembly with MHC class II protein complex
  - id: GO:0019886
    label: antigen processing and presentation of exogenous peptide antigen via MHC class II
  - id: GO:0050870
    label: positive regulation of T cell activation
  in_complex:
    id: GO:0042613
    label: MHC class II protein complex
  locations:
  - id: GO:0005886
    label: plasma membrane
  - id: GO:0009986
    label: cell surface
  - id: GO:0005765
    label: lysosomal membrane
  - id: GO:0031902
    label: late endosome membrane
