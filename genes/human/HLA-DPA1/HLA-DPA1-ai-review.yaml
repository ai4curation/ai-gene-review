    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:28514442
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q12772
  review:
    summary: Generic protein binding IPI recording a high-throughput AP-MS association between HLA-DPA1
      and SREBF2 (UniProtKB:Q12772) in the BioPlex ORFEOME interactome survey.
    action: REMOVE
    reason: 'Per repository curation policy generic protein binding is uninformative and is removed rather
      than retained: it conveys no molecular function for the DP alpha chain. Removal does not assert
      that the reported interaction is false - UniProt records the same HLA-DPA1/SREBF2 pair with three
      experiments - but no mechanism, directionality or biological consequence has been reported for it,
      and SREBF2 is a sterol-regulated ER/nuclear transcription factor with no described role in class
      II assembly, trafficking or peptide loading. There is therefore no evidence-backed informative molecular
      function to MODIFY to; inventing one from a high-throughput co-purification alone would be unsupported.
      The informative molecular functions of this chain are already captured by the GO:0042605 peptide
      antigen binding rows and by part_of GO:0042613.'
