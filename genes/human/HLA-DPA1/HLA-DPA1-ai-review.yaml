suggested_questions:
- question: Does the HLA-DP alpha chain contribute measurably to the T-cell receptor interface? The one
    published DP/TCR co-complex reports a tilted footprint made "at the expense of the DP2 alpha chain
    helix", which is the opposite of the usual class II geometry and leaves it unclear whether a GO:0042608
    T cell receptor binding annotation (which HLA-DRA and HLA-DRB1 both carry by IDA) is appropriate for
    DP alpha chains in general or is excluded by an isotype-specific geometry.
  experts:
  - Clayton GM
  - Kappler JW
  - Dai S
- question: How much of HLA-DP peptide-repertoire specificity is set by the modestly polymorphic alpha
    chain rather than by DPB1? The DP2 structure shows alpha-chain residues forming part of the p6 pocket
    floor, yet DP disease associations are nearly always reported in terms of beta-chain positions, and
    DPA1-DPB1 haplotype linkage makes the contributions hard to separate epidemiologically.
  experts:
  - Dai S
  - Fontenot AP
- question: Is the reported HLA-DPA1/SREBF2 association biologically meaningful, or an artefact of overexpressing
    a membrane protein in AP-MS? It is the only interaction UniProt records for P20036, it recurs across
    BioPlex datasets, and no mechanism has been proposed; resolving it would determine whether any informative
    molecular function should replace the removed generic protein binding rows.
  experts:
  - Huttlin EL
  - Harper JW
- question: Should the HLA-DP alpha chain carry an annotation for its role as a ligand of the activating
    NK-cell receptor NKp44? NKp44 binds a subset of assembled HLA-DP molecules directly (PMID:31358998),
    and the DPA1*02:01~DPB1*01:01 haplotype drives NKp44+ NK-cell degranulation against cholangiocyte
    organoids (PMID:37788895), which would make HLA-DP a class II ligand for an innate receptor in
    addition to its CD4 T-cell role. Both the binding and the genetics are resolved at the level of the
    DPA1-DPB1 pair rather than the alpha chain alone, so no annotation was proposed here.
  experts:
  - Altfeld M
  - Carrington M
  - Niehrs A
- question: Does the HLA-DP-specific use of the class I processing route change which process terms apply
    to the DP alpha chain? DP molecules whose beta chain carries Gly84 do not present CLIP and
    constitutively display proteasome-generated, TAP-transported endogenous peptides (PMID:28489076),
    so for those allotypes GO:0019886 antigen processing and presentation of exogenous peptide antigen
    via MHC class II may understate the repertoire. The decisive residue is in DPB1, and the existing
    rows were left unchanged.
  experts:
  - Hirano N
- question: Does the DPA1 allele itself select which endogenous antigens are presented? Holding DPB1*05:01
    constant, an EBNA1 epitope was naturally processed and presented by DPA1*02:02 but not DPA1*01:03
    (PMID:38412034), which is the most direct evidence that the modestly polymorphic alpha chain sets
    part of the DP peptide repertoire.
  experts:
  - Chen L
- question: Should GO provide a way to state that a class II constituent subunit contacts the other class
    II molecules within the CD74 heterononamer, distinct from GO:0023026 MHC class II protein complex
    binding, which is meant for trans-acting binders such as HLA-DM and HLA-DO? At present the same term
    is applied to both roles through a shared PANTHER node.
  experts: []
suggested_experiments:
- hypothesis: The HLA-DP alpha chain makes a smaller contribution to the TCR interface than the alpha
    chains of other class II isotypes, because of the widened groove and tilted TCR docking seen in DP2.
  description: Solve or compare additional DP/peptide/TCR co-complexes with TCRs selected against conventional
    peptide antigens rather than against a metal-modified surface, and quantify per-chain buried surface
    area and atom-to-atom contacts against matched DR and DQ co-complexes. Complement with surface plasmon
    resonance on DP molecules carrying alanine substitutions along the alpha-1 helix (alpha55-alpha76)
    to test whether alpha-chain contacts contribute measurably to TCR affinity.
  experiment_type: X-ray crystallography and surface plasmon resonance
- hypothesis: Polymorphic positions in the DPA1 alpha-1 domain alter the bound peptide repertoire independently
    of the paired DPB1 allele.
  description: Express matched sets of DP heterodimers in which the DPB1 allele is held constant while
    DPA1*01:03, *02:01 and *03:01 are varied, immunopurify the molecules from the same cell background,
    and compare eluted peptide repertoires by immunopeptidomics, scoring motif changes at the p1, p4,
    p6 and p9 anchor positions. The prediction is a measurable shift at p6, whose pocket floor includes
    alphaAla11.
  experiment_type: Immunopeptidomics (LC-MS/MS of eluted peptides)
- hypothesis: The HLA-DPA1/SREBF2 co-purification does not reflect an interaction that occurs at endogenous
    expression levels in antigen-presenting cells.
  description: Test the pair at endogenous levels in a class II-positive cell type (primary monocyte-derived
    dendritic cells or a B-lymphoblastoid line) by reciprocal endogenous immunoprecipitation followed
    by immunoblot, and by proximity labelling (BioID or APEX2) from a knock-in tagged HLA-DPA1 allele.
    Score whether SREBF2 is recovered above the control-bait background, and whether SREBF2 knockdown
    changes DP surface level, CLIP occupancy or presentation of a model antigen.
  experiment_type: Endogenous co-immunoprecipitation and proximity labelling
- hypothesis: The DP alpha chain is required for, and does part of the work of, peptide loading rather
    than only enabling beta-chain expression.
  description: In a DPA1-knockout antigen-presenting line reconstituted with wild-type DPA1 or with groove-face
    alpha-chain point mutants (e.g. alphaAla11 substitutions that fill the p6 pocket floor, or alphaArg76
    substitutions that break the conserved salt bridge), measure surface DP level with a conformation-dependent
    antibody, CLIP occupancy, and presentation of a defined DP-restricted peptide to a reporter T-cell
    line. Mutants that assemble and reach the surface normally but fail to present would separate the
    chain's structural role from its direct contribution to peptide binding.
  experiment_type: CRISPR knockout and structure-guided mutant reconstitution with T-cell reporter assay
