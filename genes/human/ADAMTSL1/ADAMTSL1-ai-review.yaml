  description: >-
    The 525-amino-acid splice form that the literature calls punctin-1, comprising the signal
    peptide and the first four thrombospondin type-1 repeats. It is the form that was
    purified and characterised in 2002, the form in which every O-fucosylation and
    C-mannosylation site was mapped, the form carrying all published secretion mutants, and
    the form used to test the Trp42Arg disease variant. Note that UniProt lists Punctin-1 as
    an alternative name for the whole entry while the canonical displayed sequence is the
    1762-amino-acid isoform 3, so "punctin-1" in the literature and "Punctin-1" in UniProt
    refer to different things. No functional difference from the long form has been
    demonstrated; the distinction here is one of experimental coverage, not of known biology.
- id: ADAMTSL1_SIGNAL_PEPTIDE_LESS
  name: Signal-peptide-less isoforms 5 and 6
  type: SPLICE_VARIANT
  maps_to:
  - type: UNIPROT_ISOFORM
    ids:
    - Q8N6G6-5
    - Q8N6G6-6
  description: >-
    Both isoforms delete residues 1-1299 (VSP_039322), removing the signal peptide, so
    neither is expected to enter the secretory pathway or reach the extracellular matrix.
    Isoform 5 is additionally flagged by UniProt as a likely target of nonsense-mediated
    decay. Secretion-dependent and extracellular annotations on this gene should not be read
    as applying to these two forms.
references:
- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO terms
  findings:
  - statement: >-
      The only InterPro entry matched by ADAMTSL1 that carries a GO mapping is IPR013273
      (ADAMTS/ADAMTS-like), and it maps to GO:0030198 extracellular matrix organization
      alone. Although the signature spans the catalytic ADAMTS metalloproteases, the mapping
      does not include any peptidase or hydrolase term, so no catalytic activity is
      propagated to the non-catalytic members of the family through this route.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Checked against the current interpro2go release: IPR013273 maps only to GO:0030198, and
      none of ADAMTSL1's other thirteen InterPro entries carries any GO mapping.
- id: Reactome:R-HSA-5173005
  title: B3GALTL transfers glucose to O-fucosyl-proteins
  findings:
  - statement: >-
      Reaction of the O-glycosylation of TSR domain-containing proteins pathway in which
      B3GLCT, an ER membrane enzyme, adds glucose to the O-fucose already present on
      thrombospondin type-1 repeats. ADAMTSL1 is a member of the O-fuc-proteins participant
      set, which Reactome places in the endoplasmic reticulum lumen.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Reaction record fetched from the Reactome content service; compartments are
      endoplasmic reticulum membrane and endoplasmic reticulum lumen, and the catalyst is
      B3GLCT. The underlying claim for ADAMTSL1 is experimentally supported by PMID:17395588,
      which detected the fucose-glucose disaccharide on TSR2, TSR3 and TSR4 of punctin-1.
- id: Reactome:R-HSA-5173192
  title: POFUT2 transfers fucose to TSR domain-containing proteins
  findings:
  - statement: >-
      Reaction in which the ER-resident enzyme POFUT2 attaches fucose to the conserved Ser or
      Thr of thrombospondin type-1 repeats. ADAMTSL1 is a member of the POFUT2 substrates
      participant set, placed by Reactome in the endoplasmic reticulum lumen.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Reaction record fetched from the Reactome content service. Directly corroborated for
      ADAMTSL1 by PMID:17395588.
- id: Reactome:R-HSA-6785565
  title: Defective B3GALTL does not transfer glucose to O-fucosyl-proteins
  findings:
  - statement: >-
      A Reactome FailedReaction modelling the Peters-plus syndrome disease state, in which
      the B3GALTL G393E variant fails to glucosylate O-fucosylated thrombospondin repeats.
      ADAMTSL1 appears as an input to a reaction that by construction does not proceed, yet
      the GO pipeline emits the same endoplasmic reticulum lumen location as for the working
      reaction.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Confirmed as schemaClass FailedReaction via the Reactome content service. The location
      it asserts for ADAMTSL1 is not wrong, but it is the third identical copy of one
      statement and carries no information the two working reactions do not already supply.
- id: PMID:11805097
  title: Punctin, a novel ADAMTS-like molecule, ADAMTSL-1, in extracellular matrix.
  findings:
  - statement: >-
      Punctin/ADAMTSL-1 is a secreted glycoprotein resembling the ADAMTS proteases but lacking
      the pro-metalloprotease and disintegrin-like domains, and containing four thrombospondin
      type-1 repeats in the short form that was purified.
    supporting_text: >-
      Punctin lacks the pro-metalloprotease and the disintegrin-like domain typical of this
      family but contains other ADAMTS domains in precise order including four thrombospondin
      type I repeats.
    reference_section_type: ABSTRACT
  - statement: >-
      Recombinant punctin expressed in transfected COS-1 cells is deposited into the cell
      substratum in a punctate pattern and is excluded from focal contacts. This is the
      observation that gave the protein its name and the primary human evidence that it
      reaches the extracellular matrix.
    supporting_text: >-
      In transfected COS-1 cells, punctin is deposited in the cell substratum in a punctate
      fashion and is excluded from focal contacts.
    reference_section_type: ABSTRACT
  - statement: >-
      The gene is expressed in adult skeletal muscle, and the authors present punctin as the
      founding member of the ADAMTS-like family whose matrix function was at that point
      prospective rather than demonstrated.
    supporting_text: >-
      Punctin is the first member of a novel family of ADAMTS-like proteins that may have
      important functions in the extracellular matrix.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Founding description of the protein, cited by UniProt with ECO:0000269 for subunit,
      subcellular location, tissue specificity, glycosylation, mass spectrometry and
      disulfide bonds. Cached record is abstract-only. The localisation caveat that must
      travel with it is that the assay used epitope-tagged recombinant protein in a
      heterologous cell line.
- id: PMID:17395588
  title: 'O-fucosylation of thrombospondin type 1 repeats in ADAMTS-like-1/punctin-1
    regulates secretion: implications for the ADAMTS superfamily.'
  findings:
  - statement: >-
      The thrombospondin repeats of punctin-1 carry POFUT2-type O-fucose, extended in TSR2,
      TSR3 and TSR4 to a fucose-glucose disaccharide, and mutating the modified Ser/Thr
      residues reduces the amount of protein secreted. This is the experimental basis for
      ADAMTSL1's participation in the two Reactome ER-lumen glycosylation reactions.
    supporting_text: >-
      Mutation of the putative modified Ser/Thr residues in TSR2, TSR3, and TSR4 led to
      significantly decreased levels of secreted punctin-1.
    reference_section_type: ABSTRACT
  - statement: >-
      N-glycosylation and O-fucosylation together are required for efficient biosynthesis of
      the protein.
    supporting_text: >-
      the data define a critical role for N-glycosylation and O-fucosylation in the
      biosynthesis of punctin-1
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Cited by UniProt with ECO:0000269 for four glycosylation sites and for subcellular
      location. Cached record is abstract-only; the claims used here are all stated in the
      abstract. Experiments were performed on the short punctin-1 form.
- id: PMID:19671700
  title: Post-translational modification of thrombospondin type-1 repeats in ADAMTS-like
    1/punctin-1 by C-mannosylation of tryptophan.
  findings:
  - statement: >-
      Trp39 and Trp42 of the first thrombospondin repeat carry C-linked mannose, adjacent to
      the O-fucose site, and substituting these tryptophans changes secretion efficiency. The
      authors conclude that the two modifications together act as a quality-control mechanism
      on export.
    supporting_text: >-
      Together, these modifications appear to provide a quality control mechanism for
      punctin-1 secretion.
    reference_section_type: ABSTRACT
  - statement: >-
      Mass spectrometry of recombinant human punctin-1 identified the TSR1 peptide spanning
      residues 36-49 bearing two mannose residues and a Glc-Fuc disaccharide.
    supporting_text: >-
      Analysis of tryptic fragments of recombinant human punctin-1 by mass spectrometry
      identified a peptide derived from TSR1 containing the (36)WDAWGPWSECSRTC(49) sequence
      of interest modified with two mannose residues and a Glc-Fuc disaccharide
      (O-fucosylation).
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Cited by UniProt with ECO:0000269 for three carbohydrate sites, five mutagenesis
      entries and subcellular location. Cached record is abstract-only.
- id: PMID:24281761
  title: Time-resolved analysis of the matrix metalloproteinase 10 substrate degradome.
  findings:
  - statement: >-
      Endogenous ADAMTSL1 was identified in human fibroblast secretomes by terminal amine
      isotopic labelling of substrates and shown to be a direct MMP10 substrate. This places
      native, untagged ADAMTSL1 in the extracellular compartment of a primary human cell type
      and shows it is subject to extracellular proteolysis rather than performing it.
    supporting_text: >-
      we identified the extracellular matrix protein ADAMTS-like protein 1 (ADAMTSL1) as a
      direct MMP10 substrate
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract-only in the cache, but the ADAMTSL1 result is stated in the abstract and named
      as one of the paper's three headline findings. Independent of the 2002 tagged-construct
      localisation, which is why it is used as corroboration for the proposed GO:0031012 row.
- id: PMID:28722276
  title: Identification and functional analysis of an ADAMTSL1 variant associated with a
    complex phenotype including congenital glaucoma, craniofacial, and other systemic features
    in a three-generation human pedigree.
  findings:
  - statement: >-
      The ADAMTS-like proteins are defined as comprising the ADAMTS ancillary domains while
      lacking the protease domain, and therefore lacking enzymatic activity.
    supporting_text: >-
      it also contains a family of seven ADAMTS-like proteins (ADAMTSL family) comprising an
      ADAMTS ancillary domain but lacking the protease domain and thus, enzymatic activity
    reference_section_type: RESULTS
  - statement: >-
      Full-length ADAMTSL1 has thirteen thrombospondin type-1 repeats, four Ig-like C2-type
      domains and one PLAC domain over 1762 residues, and punctin-1 is the 525-residue short
      splice variant with four repeats.
    supporting_text: >-
      Despite being the prototypic ADAMTSL, little is currently known about ADAMTSL1, which
      contains thirteen thrombospondin type 1 repeats (TSRs), four Immunoglobulin-like C2-type
      domains and a single PLAC (protease and lacunin) domain in its full-length form (1762
      amino acids) and four TSRs in a short splice variant named punctin-1 (525 amino acids)
    reference_section_type: RESULTS
  - statement: >-
      The group that discovered the protein states that its tissue function is unknown and
      that a role in matrix assembly and turnover is an expectation drawn from other family
      members rather than an ADAMTSL1 result.
    supporting_text: >-
      The function of punctin-1 in tissues is currently unknown, however, by analogy with
      other family members (Apte 2009; Dubail and Apte 2015; Hubmacher and Apte 2015), there
      is a strong possibility that it mediates the assembly and turnover of extracellular
      matrix at the affected sites.
    reference_section_type: DISCUSSION
  - statement: >-
      A heterozygous p.Trp42Arg allele at a C-mannosylation site cosegregates with a
      multisystem phenotype; the mutant protein is retained intracellularly and also reduces
      secretion of cotransfected wild-type protein.
    supporting_text: >-
      p.Trp42Arg punctin-1 was not secreted and accumulated in cells and 2) in the presence of
      the mutant construct, wild-type punctin-1 was secreted at reduced levels and also
      accumulated intracellularly
    reference_section_type: RESULTS
  - statement: >-
      All of the functional work was done on the short punctin-1 form because no full-length
      expression construct existed, which is why the experimental coverage of this gene is
      confined to isoform Q8N6G6-1.
    supporting_text: A plasmid construct for full-length ADAMTSL1 is presently unavailable.
    reference_section_type: DISCUSSION
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text available in the cache and read in full. Co-authored by the Apte laboratory,
      which discovered the protein, so its explicit statement that the tissue function is
      unknown is an authoritative negative and not an omission.
- id: PMID:22014523
  title: MADD-4 is a secreted cue required for midline-oriented guidance in Caenorhabditis
    elegans.
  findings:
  - statement: >-
      MADD-4, the C. elegans protein most closely related to ADAMTSL1 and ADAMTSL3, is a
      secreted guidance cue acting through the netrin receptor UNC-40/DCC. The authors
      explicitly decline to extend a biological role to the mammalian orthologues.
    supporting_text: >-
      The biological role of MADD-4 orthologs, including ADAMTSL1 and 3 in mammals, is
      unknown.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Used only for the family-level context and for the authors' own statement that the
      mammalian role is unknown. Nothing from the nematode phenotype is carried into a human
      annotation.
- id: PMID:30714143
  title: ADAMTSL1 and mandibular prognathism.
  findings:
  - statement: >-
      Two rare ADAMTSL1 missense variants segregate with mandibular prognathism in Thai
      families, and mouse Adamtsl1 is expressed in the condensed mesenchyme of the condyle
      but not in long-bone cartilage. The mechanism the authors propose requires ADAMTSL1 to
      cleave aggrecan, an activity the protein's domain content does not support, and they
      label it a hypothesis.
    supporting_text: >-
      We hypothesize that mutations in ADAMTSL1 cause failure to cleave aggrecan in the
      condylar cartilage, and that leads to overgrowth of the mandible.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: LOW
    correctness: DISPUTED
    review_notes: >-
      The genetic association is reported without functional validation, and the proposed
      mechanism attributes proteolysis to a protein that has no metalloprotease domain, no
      catalytic activity comment and no EC number. Cited here as an example of the
      family-name-to-activity conflation, not as evidence for any annotation.
- id: PMID:35115729
  title: Disentangling glial diversity in peripheral nerves at single-nuclei resolution.
  findings:
  - statement: >-
      Adamtsl1 is used as one of three transcriptional markers defining a myelinating Schwann
      cell subtype in mouse peripheral nerve that preferentially ensheathes motor axons. The
      gene's own function is not assayed.
    supporting_text: >-
      including a subtype characterized by expression of Pmp2, Adamtsl1 and Cldn14 that
      preferentially myelinates motor axons
    reference_section_type: ABSTRACT
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Full text available and searched. Every mention of Adamtsl1 is as a cluster marker;
      there is no perturbation of the gene. Recorded so that a later reviewer does not mistake
      marker expression for a function, and so the companion cell-ablation study
      (PMID:39880678) is read as a property of the cell type rather than of the gene.
- id: PMID:22242013
  title: Microenvironmental regulation by fibrillin-1.
  findings:
  - statement: >-
      Surface plasmon resonance with recombinant human ADAMTSL-1, -2 and -3 against the
      N-terminal half of fibrillin-1 found that ADAMTSL-2 and -3 bound and ADAMTSL-1 did not.
      This is a direct, measured negative for ADAMTSL1 against the partner through which the
      other ADAMTS-like proteins reach the extracellular matrix organization term.
    supporting_text: >-
      ADAMTSL-2, -3, and papilin polypeptides interacted with the N-terminal half of
      fibrillin-1, while ADAMTSL-1 did not.
    reference_section_type: RESULTS
  - statement: >-
      The negative covers fibrillin-1 in its entirety, not only the N-terminal half: binding
      to the C-terminal half was negative for every ADAMTSL protein in the panel. Held to a
      lower evidentiary standard than the N-terminal result, though: it is reported as data
      not shown, with no figure or table behind it, whereas the N-terminal negative is
      reported as an outcome of a panel that is displayed - Figure 5a shows sensorgrams for
      the binders only, so the paper contains no ADAMTSL-1 trace for either half.
    supporting_text: >-
      Binding to the C-terminal half of fibrillin-1 was negative for all ADAMTSL proteins
      tested
    reference_section_type: RESULTS
  - statement: >-
      In the same study ADAMTSL-1 also failed to bind the non-catalytic C-terminal region of
      ADAMTS-10, which ADAMTSL-3 binds with high affinity. This result is corroborating rather
      than discriminating and must not be added to the fibrillin-1 one: ADAMTSL-2 is equally
      negative against ADAMTS-10 and still reaches GO:0030198, ADAMTS-10 binding was shown
      only for ADAMTSL-3, and ADAMTSL-6/THSD4 was never tested against it, so ADAMTS-10 is not
      what places ADAMTSL-2 or -6 in the fibrillin-1 pathway. The discriminating result is the
      fibrillin-1 negative alone.
    supporting_text: >-
      However, neither ADAMTSL-2 nor -1 bound to ADAMTS-10, indicating that ADAMTS enzymes may
      partner only with specific ADAMTSL proteins.
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The most informative molecular-function experiment ever performed on human ADAMTSL1, and
      it is a negative. Found only because a sibling review of ADAMTSL3 surfaced it: the paper
      is titled for fibrillin-1, so no ADAMTSL1-keyed search reaches it, and it is absent from
      ADAMTSL1's GOA and from the affinage record. One caveat travels with it, and it is the
      isoform question that runs through this whole review. The methods describe the reagent as
      "Recombinant full length ADAMTSL-1" but give no length, and in 2017 the Apte laboratory
      stated that no construct for the 1762-residue form existed. Both RefSeq entries were
      available in 2012 (NP_443098 for the 525-residue isoform 1, NP_001035362 for the
      1762-residue isoform 3), so the paper alone does not settle which was tested; the balance
      of evidence favours the short punctin-1 form. The negative is therefore firm for whatever
      was assayed and probably does not test the nine additional thrombospondin repeats, four
      Ig-like domains and PLAC domain of the long isoform. Recorded as a bounded negative
      rather than a blanket one.
- id: PMID:24634412
  title: Hedgehog pathway inhibition in chondrosarcoma using the smoothened inhibitor IPI-926
    directly inhibits sarcoma cell growth.
  findings:
  - statement: >-
      ADAMTSL1 was identified as a Hedgehog-responsive gene in primary chondrosarcoma
      xenografts treated with the SMO inhibitor IPI-926, and manipulating it altered
      chondrosarcoma cell proliferation. This is the only gene-specific functional
      perturbation result reported for ADAMTSL1, and Apte is a co-author.
    supporting_text: >-
      Gene profiling studies identified genes differentially expressed in chondrosarcomas
      following IPI-926 treatment, one of which, ADAMTSL1, regulates chondrosarcoma cell
      proliferation.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Adjudicated and deliberately not annotated, recorded here rather than only in the gene
      notes because it bears on this review's claim that ADAMTSL1 has no gene-specific
      functional data. Three reasons for declining. The cached record is abstract-only and the
      abstract does not state the direction of the effect, so neither GO:0008284 nor GO:0008285
      can be chosen and picking either would be a guess. The assay is a chondrosarcoma cell
      line in a Hedgehog-inhibitor study, a disease context with no normal-physiology
      counterpart for this gene. And a proliferation phenotype bears on neither of this
      review's recorded gaps, since it identifies no molecular function and says nothing about
      matrix organisation, so it narrows neither. It does mean the review's claim should be
      read precisely as no molecular function and no matrix-organisation evidence, rather than
      no functional observation of any kind.
- id: PMID:39880678
  title: Pmp2+ Schwann Cells Maintain the Survival of Large-Caliber Motor Axons.
  findings:
  - statement: >-
      Ablating the Schwann cell population co-marked by Adamtsl1, Cldn14 and Pmp2 causes loss
      of large-caliber motor axons. The perturbation is of the cell population, not of the
      gene, so the phenotype is a property of the cell type.
    supporting_text: >-
      Recently, we identified a population of Schwann cells (SCs) expressing Adamtsl1 ,
      Cldn14 , and Pmp2 (a.k.a. PMP2+ SCs) that preferentially myelinate large-caliber motor
      axons.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Not annotated, and recorded so that the decision is visible in the review file rather
      than only in the gene notes. Adamtsl1 is used only as one of three markers of the ablated
      population and the gene itself is never perturbed, so attributing the axonal phenotype to
      ADAMTSL1 would be a cell-level to gene-level projection error. Companion to
      PMID:35115729, which defined the subtype.
- id: file:human/ADAMTSL1/ADAMTSL1-uniprot.txt
