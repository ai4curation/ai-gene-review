core_functions:
- description: >-
    A secreted, heavily glycosylated ADAMTS-like protein deposited into the pericellular
    matrix. The location is the only part of this that the gene's own data establishes, so it
    is the only structured claim made here. No molecular function, ligand or binding partner
    has been identified, so no molecular-function term is asserted; and although the gene
    carries GO:0030198 extracellular matrix organization from the family InterPro signature,
    that term has no ADAMTSL1-specific support, so it is deliberately not repeated as a core
    process here and is instead reviewed on its own row as KEEP_AS_NON_CORE, where its family-
    level basis and the limits of that basis are set out. What can be said positively about
    the protein's role in matrix remodelling is negative in form: it is a substrate of
    extracellular proteolysis rather than an agent of it, having none of the catalytic
    machinery of the ADAMTS proteases and being itself cleaved by MMP10 in fibroblast
    secretomes.
  locations:
  - id: GO:0031012
    label: extracellular matrix
  supported_by:
  - reference_id: PMID:11805097
    supporting_text: >-
      In transfected COS-1 cells, punctin is deposited in the cell substratum in a punctate
      fashion and is excluded from focal contacts.
  - reference_id: PMID:24281761
    supporting_text: >-
      we identified the extracellular matrix protein ADAMTS-like protein 1 (ADAMTSL1) as a
      direct MMP10 substrate
  - reference_id: PMID:28722276
    supporting_text: >-
      it also contains a family of seven ADAMTS-like proteins (ADAMTSL family) comprising an
      ADAMTS ancillary domain but lacking the protease domain and thus, enzymatic activity
knowledge_gaps:
- gap_statement: >-
    No molecular function is known for ADAMTSL1: no ligand, no binding partner, no activity
    and no structural role has been demonstrated, and the gene carries no molecular-function
    annotation of any evidence code in GOA.
  boundary: >-
    Well established: the protein's domain content (thrombospondin type-1 repeats, four Ig-
    like C2-type domains, ADAMTS spacer, PLAC domain, no catalytic domains), its secretion and
    matrix deposition, the glycosylation chemistry that gates its export, its cleavage by
    MMP10, and a dominant-negative human allele. Also now bounded on the other side by
    measured negatives rather than by silence: recombinant human ADAMTSL-1 did not bind the
    N-terminal half of fibrillin-1 in an SPR panel where ADAMTSL-2, ADAMTSL-3 and papilin did,
    and the same experiments report the C-terminal half negative for every ADAMTSL tested,
    which is what licenses stating the exclusion as fibrillin-1 binding rather than N-terminal
    fibrillin-1 binding, though that second half is given as data not shown. ADAMTSL-1 also
    did not bind the non-catalytic region of ADAMTS-10. Only the fibrillin-1 result
    discriminates ADAMTSL1 from its relatives - ADAMTSL-2 is equally negative against
    ADAMTS-10 and ADAMTSL-6/THSD4 was never tested against it - so what is excluded is
    fibrillin-1 binding, with the ADAMTS-10 result corroborating rather than adding to it, and
    both subject to the caveat that the construct's isoform is not stated. Entirely open: what
    the protein does bind, and what it does once it is in the matrix.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: >-
    ADAMTSL1 is the prototype of the ADAMTS-like family and is implicated in a multisystem
    developmental disorder, yet has no molecular handle at all. Until a partner is identified
    the disease mechanism cannot be modelled beyond loss of secretion, and the family-level
    extracellular matrix organization inference cannot be made specific.
  resolution: >-
    Identification of a physical binding partner for recombinant full-length ADAMTSL1 would
    supply the first molecular-function term. The obvious family candidates are now poorer
    candidates than they look: fibrillin-1 and ADAMTS-10 were both tested by SPR in
    PMID:22242013 and both were negative, so an unbiased search is more appropriate than
    another fibrillin-1 experiment. Fibrillin-2 is not reported as tested anywhere, and FBN2
    appears among the affinity-purification hits, so it is the one family-shaped hypothesis
    still standing. No LTBP result for ADAMTSL1 appears in the main text of PMID:22242013
    either, but LTBP-1 and LTBP-4 were coupled to chips in the same experiments and the LTBP
    data sit in a supplementary table absent from the cached record, so untested is not a safe
    reading for those. Producing a construct for the 1762-residue form is the prerequisite for
    all of it, and would also determine whether the published negatives extend to the long
    isoform.
  provenance:
  - reference_id: PMID:28722276
    supporting_text: >-
      The function of punctin-1 in tissues is currently unknown, however, by analogy with
      other family members (Apte 2009; Dubail and Apte 2015; Hubmacher and Apte 2015), there
      is a strong possibility that it mediates the assembly and turnover of extracellular
      matrix at the affected sites.
  - reference_id: PMID:22014523
    supporting_text: >-
      The biological role of MADD-4 orthologs, including ADAMTSL1 and 3 in mammals, is
      unknown.
  - reference_id: PMID:22242013
    supporting_text: >-
      However, neither ADAMTSL-2 nor -1 bound to ADAMTS-10, indicating that ADAMTS enzymes
      may partner only with specific ADAMTSL proteins.
suggested_questions:
- question: >-
    Where should the family draw the line between KEEP_AS_NON_CORE and MARK_AS_OVER_ANNOTATED
    for the InterPro GO:0030198 IEA that every ADAMTS-like protein carries? ADAMTSL1 and
    ADAMTSL5 are in the same IBA position for this term: both hold the IPR013273 IEA, and
    neither receives the GO:0030198 IBA from PTN000347317 that ADAMTSL2, ADAMTSL4 and THSD4
    do. Their wider evidence now differs, and in the direction that cuts against this review:
    ADAMTSL5 has its own IDA to GO:0031012 plus microfibril and heparin binding, while
    ADAMTSL1 has a measured SPR negative against fibrillin-1, the route by which the family
    reaches GO:0030198. The better-supported gene is thus the one taking the harsher action,
    which is an argument for settling the line family-wide rather than a tie to be broken per
    gene. The concurrent ADAMTSL5 review marks the row MARK_AS_OVER_ANNOTATED; this review
    marks it KEEP_AS_NON_CORE, on the grounds that the term is the level of generality at
    which the heterogeneous family agrees, that PAINT independently placed it as an IBD at a
    node covering both genes, and that a non-catalytic route to it is demonstrably available
    to this architecture. The difference between the genes is therefore real but points the
    wrong way to explain the divergence: it would justify the harsher action on ADAMTSL1, not
    the milder one, so it cannot be what separates the two verdicts. The line should be
    settled once for the family rather than gene by gene.
  experts:
  - GO Central / PAN-GO curators
- question: >-
    Should the molecular-function keyword Hydrolase (KW-0378) be removed from Q8N6G6? It
    generates the GO:0016787 hydrolase activity cross-reference in the entry's own GO list,
    while the same entry's CAUTION comment states that the metalloprotease and
    disintegrin-like domains are absent, and there is no CATALYTIC ACTIVITY comment, no EC
    number and no active-site or metal-binding feature. Of the six human ADAMTS-like
    proteins, only ADAMTSL1 and THSD4 carry the keyword; ADAMTSL2, ADAMTSL3, ADAMTSL4 and
    ADAMTSL5 carry the identical CAUTION and no molecular-function keyword. Should THSD4
    (Q6ZMP0), which carries the keyword but has no CAUTION comment at all, be reviewed at the
    same time? The annotation no longer reaches GOA, since keyword-derived annotations were
    withdrawn for cellular organisms, so this is a defect that is live in UniProt and
    invisible in GO.
  experts:
  - UniProt curators
- question: >-
    Why does human ADAMTSL1 carry no GO:0031012 extracellular matrix annotation at all, when
    the term is an IBD at node PTN000347317, 24 of the 26 human members of PTHR13723 receive
    it by IBA from that node, and mouse Adamtsl1 in the same subfamily SF157 does receive it
    from the same node? Two human members miss the IBA. PAPLN is the other, and its case is
    not explained by PAINT declining to overlay an existing direct annotation, because its
    only GO:0031012 rows are IEA and TAS, neither experimental; the concurrent ADAMTSL5 review
    sharpens that further by showing three PAPLN orthologs are themselves seeds at the node.
    ADAMTSL1 is the one that ends up with no annotation at all. Both look like propagation
    coverage gaps rather than curatorial decisions, and in ADAMTSL1's case the gap has landed
    on the family member whose matrix deposition is directly observed in human cells.
  experts:
  - GO Central / PAINT curators
- question: >-
    Should PAINT's loss calls at node PTN002673039 propagate to the other ADAMTS-like
    members? The node carries an inferred-from-key-residues loss of GO:0004222
    metalloendopeptidase activity and an inferred-from-rapid-divergence loss of GO:0006508
    proteolysis, correctly recording that catalysis was lost on this branch, but in GOA that
    judgement surfaces as exactly one annotation, ADAMTSL2's negated GO:0004222 row. For
    ADAMTSL1 the negated annotation would be the machine-readable form of a statement UniProt
    already makes in prose, and it would inoculate the gene against the recurring
    reappearance of proteolytic activity in family-level summaries.
  experts:
  - GO Central / PAINT curators
- question: >-
    Should the PANTHER family GO-slim and protein-class view be made aware of PAINT's own
    loss calls? The geneinfo service returns GO_SLIM_MF GO:0004222 metalloendopeptidase
    activity, GO_SLIM_BP GO:0006508 proteolysis and protein class PC00153 metalloprotease for
    every member of PTHR13723 queried, including all six ADAMTS-like proteins and including
    ADAMTSL2, whose GOA record explicitly negates GO:0004222, so a non-catalytic member is
    summarised as a metalloprotease.
  experts:
  - PANTHER curators
- question: >-
    What action should a review record for a biosynthetic-transit compartment row? ADAMTSL1
    and ADAMTSL4 carry the identical three GO:0005788 TAS rows from the same three Reactome
    reactions; the merged ADAMTSL4 review records them as ACCEPT while its reason describes
    them as reflecting secretory pathway transit rather than a functional localisation, and
    this review records the same judgement as KEEP_AS_NON_CORE. A convention would remove the
    discrepancy in either direction.
  experts: []
- question: >-
    Should Reactome FailedReactions contribute location annotations to GO? R-HSA-6785565
    models a disease state in which glucosylation does not occur, yet it emits a GO:0005788
    location annotation identical to the one from the corresponding working reaction
    R-HSA-5173005, adding a third identical row here without adding information.
  experts:
  - Reactome curators
- question: >-
    What does ADAMTSL1 bind, given that the obvious family candidates are already excluded?
    Unlike ADAMTSL2, ADAMTSL3, THSD4 and papilin, recombinant human ADAMTSL-1 did not bind the
    N-terminal half of fibrillin-1, and it did not bind the non-catalytic region of ADAMTS-10
    either, in the same study. Two questions follow. Does the negative extend to the
    1762-residue isoform, since the paper describes its reagent only as full length and the
    group that made the protein stated in 2017 that no long-form construct existed? And if
    ADAMTSL1 is genuinely outside the fibrillin-1 pathway that unites the rest of the family,
    what does the prototype of the ADAMTS-like family actually do? FBN2 appears among its
    affinity-purification hits and fibrillin-2 has not been tested, which is the one family-
    shaped hypothesis still standing.
  experts:
  - Suneel S. Apte
  - Dirk Hubmacher
suggested_experiments:
- hypothesis: >-
    The nine thrombospondin repeats, four immunoglobulin-like domains and PLAC domain that
    are absent from punctin-1 carry functions that no published experiment has been able to
    test.
  description: >-
    Build a full-length ADAMTSL1 expression construct and purify the 1762-residue protein.
    This is the rate-limiting step for everything else: the 2017 study states that no such
    construct existed, so every published biochemical result is confined to the 525-residue
    punctin-1 splice form.
  experiment_type: recombinant protein expression
- hypothesis: >-
    ADAMTSL1 has a matrix binding partner outside the fibrillin-1 / ADAMTS-10 axis that unites
    the rest of the ADAMTS-like family.
  description: >-
    An unbiased partner search rather than another candidate test: pull-down or proximity-
    labelling from a matrix-producing human cell line using recombinant full-length ADAMTSL1
    as bait, with mass-spectrometric identification. Candidate SPR should be reserved for
    fibrillin-2 and heparin, which are not reported as tested anywhere, and for LTBP1 and
    LTBP4, whose ADAMTSL1 results are absent from that study's main text but may sit in a
    supplementary table not present in the cached record and are worth checking before
    assaying. Use ADAMTSL2 or ADAMTSL3 as the positive control. Fibrillin-1 and the non-
    catalytic region of ADAMTS-10 should be included only as controls, since recombinant human
    ADAMTSL-1 has already been shown not to bind either, and repeating them with the
    1762-residue isoform would additionally test whether that published negative extends to
    the long form.
  experiment_type: protein-protein interaction assay
- hypothesis: >-
    ADAMTSL1 promotes or restrains fibrillin microfibril deposition, which would make
    GO:0030198 a gene-specific rather than a family-level annotation.
  description: >-
    Assay fibrillin microfibril deposition in fibroblast cultures with ADAMTSL1 knocked down
    or supplemented with recombinant protein, the standard test used to establish the
    matrix-organising role of the other ADAMTS-like proteins.
  experiment_type: cell-based matrix assembly assay
- hypothesis: >-
    The peripheral-nerve phenotype attributed to Pmp2-positive Schwann cells is a property of
    that cell population rather than of Adamtsl1, which is only one of its markers.
  description: >-
    Phenotype an Adamtsl1-null mouse for the tissues where the human phenotype localises -
    ocular anterior segment and intraocular pressure, mandibular condylar cartilage,
    dentition, and skeletal muscle - and compare the peripheral-nerve phenotype directly with
    that of Pmp2-positive Schwann cell ablation.
  experiment_type: mouse knockout phenotyping
- hypothesis: >-
    ADAMTSL1 acts through an MMP10-generated fragment rather than as an intact protein.
  description: >-
    Map the MMP10 cleavage site in ADAMTSL1 and test whether the released fragment has
    activity of its own, since a matrix protein whose only reported enzymatic relationship is
    being a substrate may be functioning through a processed form.
  experiment_type: degradomics and fragment activity assay
- hypothesis: >-
    Native ADAMTSL1 occupies the extracellular matrix of the tissues where its loss produces
    disease, not only that of transfected cells in culture.
  description: >-
    Localise endogenous ADAMTSL1 protein, not transcript, in adult human skeletal muscle and
    in the ocular anterior segment. All existing localisation data come from recombinant
    protein in transfected cells or from secretome proteomics, so an antibody-based
    localisation in the affected tissues would put the extracellular matrix annotation on
    native protein in its own tissue context.
  experiment_type: immunohistochemistry
