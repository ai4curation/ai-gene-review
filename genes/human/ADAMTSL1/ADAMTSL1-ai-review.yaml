id: Q8N6G6
gene_symbol: ADAMTSL1
product_type: PROTEIN
status: COMPLETE
aliases:
- ADAMTSL-1
- Punctin-1
- ADAMTSR1
- C9orf94
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  ADAMTSL1 is a large secreted glycoprotein of the extracellular matrix and the prototype of
  the ADAMTS-like family. It is built entirely from the ancillary modules of the ADAMTS
  proteases - thrombospondin type-1 repeats, four immunoglobulin-like C2-type domains, an
  ADAMTS spacer region and a C-terminal PLAC domain - and lacks the prodomain, the
  metalloprotease domain and the disintegrin-like domain, so it is not itself a protease.
  Its biosynthesis is unusually dependent on glycosylation of the thrombospondin repeats:
  O-fucosylation by POFUT2 with subsequent glucose addition by B3GLCT, together with
  C-mannosylation of tryptophans in the first repeat, act as a quality-control gate on export
  from the endoplasmic reticulum, and disrupting either modification traps the protein inside
  the cell. Once secreted, the protein is deposited into the pericellular matrix in a
  punctate pattern that gave it the name punctin, and it is cleaved by MMP10 in fibroblast
  secretomes. The gene is expressed most strongly in adult skeletal muscle, with additional
  expression in ocular anterior-segment tissues, the mandibular condyle and a myelinating
  Schwann cell subtype. A heterozygous substitution at a C-mannosylation site blocks
  secretion and acts dominant-negatively in a pedigree with congenital glaucoma together with
  craniofacial, dental, auditory, renal, brain-vascular and limb anomalies, and other
  missense variants segregate with mandibular prognathism. Its molecular function and binding
  partners are undetermined; by analogy with other ADAMTS-like proteins it is expected to act
  in the assembly or turnover of the extracellular matrix, but this has not been demonstrated
  for ADAMTSL1 itself.
