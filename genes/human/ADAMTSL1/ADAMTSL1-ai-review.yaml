existing_annotations:
- term:
    id: GO:0030198
    label: extracellular matrix organization
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR013273
  review:
    summary: >-
      Family-signature inference that is correctly constructed and carries independent
      positive support at family level, but no ADAMTSL1 evidence. Kept, and explicitly not
      asserted as this gene's demonstrated core function.
    action: KEEP_AS_NON_CORE
    reason: >-
      Three things give this IEA positive support rather than merely leaving it unrefuted.
      First, the mapping is careful: IPR013273 (ADAMTS/ADAMTS-like) is the only one of
      ADAMTSL1's fourteen InterPro entries with any GO mapping, and it maps to GO:0030198
      alone - no peptidase, protease or hydrolase term - even though the signature also
      matches the catalytic ADAMTS metalloproteases. Second, GO:0030198 does not depend on the
      domain ADAMTSL1 lacks: catalytic family members reach the term through proteolysis, but
      ADAMTSL2, ADAMTSL4 and THSD4 reach it non-catalytically through fibrillin microfibril
      assembly, so the term sits at the level of generality at which a mechanistically
      heterogeneous family genuinely agrees, and a non-catalytic route to it is available to
      this architecture in principle. This ground has to be qualified for ADAMTSL1 in
      particular, and the qualification is a measured negative rather than an absence: in the
      one experiment that tested it, recombinant human ADAMTSL-1 did not bind the N-terminal
      half of fibrillin-1 in the same SPR panel in which ADAMTSL-2, ADAMTSL-3 and papilin did
      - and the same experiments report the C-terminal half negative for every ADAMTSL tested,
      albeit as data not shown, so the exclusion covers fibrillin-1 entire - and it did not
      bind the non-catalytic region of ADAMTS-10 either. Only the fibrillin-1 half of that is
      discriminating, and the two must not be double-counted: ADAMTSL-2 is equally negative
      against ADAMTS-10 and still reaches GO:0030198, ADAMTS-10 binding was shown only for
      ADAMTSL-3, and THSD4 was never tested against it. The load-bearing result is the
      fibrillin-1 negative alone, and it is sufficient: the specific route by which the
      relatives reach this term is excluded for ADAMTSL1. That does not refute GO:0030198,
      which is far broader than fibrillin-1 binding, but it removes the strongest mechanistic
      analogy and it is a further reason the term cannot be treated as core here. Third, PAINT
      arrived at the same term independently: GO:0030198 is an IBD annotation at PTN000347317,
      seeded by fourteen gene sources (eleven mouse, two fly, one nematode), and that node
      sits above ADAMTSL1. That last step is what makes this ground bear on the gene rather
      than merely on its family, so it is worth stating how it is established: mouse Adamtsl1
      is in PANTHER subfamily SF157, the same subfamily as human ADAMTSL1, and it receives the
      GO:0031012 IBA from PTN000347317, so that node is an ancestor of SF157 and therefore of
      ADAMTSL1. All three are family-level, and that is the limit of the case. What the
      annotation does not have is any ADAMTSL1 evidence. The laboratory that discovered the
      protein states that its tissue function is unknown and that matrix assembly and turnover
      is an expectation drawn from relatives; being resident in the matrix and being an MMP10
      substrate places ADAMTSL1 within matrix remodelling but does not show that it organises
      the matrix. Hence KEEP_AS_NON_CORE rather than ACCEPT, since ACCEPT would assert this as
      the gene's core function and the evidence does not reach that. Not
      MARK_AS_OVER_ANNOTATED either, on the three grounds above. The concurrent ADAMTSL5
      review marks its identical InterPro IEA MARK_AS_OVER_ANNOTATED; the two genes are in the
      same IBA position for this term, because neither receives the GO:0030198 IBA from
      PTN000347317 that ADAMTSL2, ADAMTSL4 and THSD4 do (computed in the bioinformatics
      census, section 1). They are no longer in the same evidentiary position overall, and the
      difference now runs against this review rather than for it: ADAMTSL5 has its own IDA to
      GO:0031012 plus microfibril and heparin binding, while ADAMTSL1 has a measured negative
      against the very route by which the family reaches GO:0030198, so the better-supported
      gene is the one taking the harsher action. That is an argument for settling the line
      family-wide rather than a reason to change one gene in isolation, so it is carried into
      suggested_questions rather than resolved here.
    supported_by:
    - reference_id: PMID:28722276
      supporting_text: >-
        The function of punctin-1 in tissues is currently unknown, however, by analogy with
        other family members (Apte 2009; Dubail and Apte 2015; Hubmacher and Apte 2015),
        there is a strong possibility that it mediates the assembly and turnover of
        extracellular matrix at the affected sites.
    - reference_id: PMID:24281761
      supporting_text: >-
        we identified the extracellular matrix protein ADAMTS-like protein 1 (ADAMTSL1) as a
        direct MMP10 substrate
    - reference_id: file:human/ADAMTSL1/ADAMTSL1-bioinformatics/RESULTS.md
      supporting_text: 'Entries with a CATALYTIC ACTIVITY comment: none.'
    - reference_id: file:human/ADAMTSL1/ADAMTSL1-deep-research-affinage.md
      supporting_text: >-
        Direct biochemical demonstration of an enzymatic activity for the mammalian protein
        has not been established in the available corpus.
    - reference_id: file:interpro/panther/PTHR13723/PTHR13723-paint.tsv
      supporting_text: PTHR13723 PTN000347317 GO:0030198 P IBD false
    - reference_id: PMID:22242013
      supporting_text: >-
        ADAMTSL-2, -3, and papilin polypeptides interacted with the N-terminal half of
        fibrillin-1, while ADAMTSL-1 did not.
    knowledge_gaps:
    - gap_statement: >-
        Whether ADAMTSL1 itself participates in organising the extracellular matrix, as
        opposed to merely residing in it and being turned over within it, has never been
        tested.
      boundary: >-
        Firmly established: ADAMTSL1 is secreted, is deposited punctately into the
        pericellular matrix, and is cleaved there by MMP10. Also established: three other
        members of its family regulate fibrillin microfibril assembly without catalysis, so a
        non-catalytic matrix-organising role is mechanistically available to this architecture
        in principle. Excluded for ADAMTSL1, however, is the specific route the relatives
        take: recombinant human ADAMTSL-1 did not bind the N-terminal half of fibrillin-1 in
        the SPR panel where ADAMTSL-2, ADAMTSL-3 and papilin did, and the same experiments
        found binding to the C-terminal half negative for every ADAMTSL tested, so the
        negative covers fibrillin-1 entire rather than one half of it - though that second
        half is reported as data not shown, with no figure or table behind it, whereas the
        N-terminal negative is reported as an outcome of a panel that is displayed. Figure 5a
        shows sensorgrams for the binders only, so the paper contains no ADAMTSL-1 trace for
        either half (PMID:22242013, subject to that study leaving its construct's isoform
        unstated). That excludes the route, not the process, which is why the row is kept
        rather than marked over-annotated. Not established: any ADAMTSL1 loss-of-function or
        assembly result bearing on matrix organisation, and no validated binding partner -
        FBN2 appears in affinity-purification data but has never been confirmed by an
        orthogonal assay.
      gap_kind:
      - BIOLOGY
      dark_aspect: BP_DARK
      status: OPEN
      significance: >-
        GO:0030198 is the gene's only functional annotation, and every downstream use of
        ADAMTSL1 as a matrix-organising protein rests on it. Testing it would either convert
        the family inference into a gene-specific fact or show that the prototype of the
        family does something else.
      resolution: >-
        A microfibril or matrix-assembly assay using recombinant full-length ADAMTSL1,
        together with matrix phenotyping of an Adamtsl1-null mouse, would settle it. Both
        have been blocked in practice by the absence of a full-length expression construct.
      provenance:
      - reference_id: PMID:28722276
        supporting_text: >-
          The function of punctin-1 in tissues is currently unknown, however, by analogy with
          other family members (Apte 2009; Dubail and Apte 2015; Hubmacher and Apte 2015),
          there is a strong possibility that it mediates the assembly and turnover of
          extracellular matrix at the affected sites.
      - reference_id: PMID:28722276
        supporting_text: A plasmid construct for full-length ADAMTSL1 is presently unavailable.
      - reference_id: PMID:22242013
        supporting_text: >-
          ADAMTSL-2, -3, and papilin polypeptides interacted with the N-terminal half of
          fibrillin-1, while ADAMTSL-1 did not.
- term:
    id: GO:0005788
    label: endoplasmic reticulum lumen
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-5173005
  qualifier: located_in
  review:
    summary: >-
      True but non-core. ADAMTSL1's thrombospondin repeats really are glucosylated by B3GLCT
      in the ER lumen, so the protein occupies that compartment during biosynthesis; it acts
      in the extracellular matrix.
    action: KEEP_AS_NON_CORE
    reason: >-
      The underlying biology is experimentally supported for this gene rather than inferred
      from pathway membership alone: mass spectrometry of punctin-1 detected the
      fucose-glucose disaccharide that B3GLCT produces on TSR2, TSR3 and TSR4, and mutating
      the modified residues reduces secretion. The compartment assignment is therefore
      correct. It is marked non-core because the endoplasmic reticulum lumen is a
      biosynthetic transit compartment for a secreted protein, not its site of action, and
      because the Reactome pipeline projects the compartment of a reaction's participant set:
      this reference annotates about nine gene products with the same three terms, so it is
      one statement about set membership rather than an observation about ADAMTSL1.
    supported_by:
    - reference_id: PMID:17395588
      supporting_text: >-
        Mutation of the putative modified Ser/Thr residues in TSR2, TSR3, and TSR4 led to
        significantly decreased levels of secreted punctin-1.
- term:
    id: GO:0005788
    label: endoplasmic reticulum lumen
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-5173192
  qualifier: located_in
  review:
    summary: >-
      Same statement as the B3GLCT row, from the upstream reaction of the same pathway.
      POFUT2 acts on ADAMTSL1's thrombospondin repeats in the ER lumen; kept as a transit
      location rather than a functional one.
    action: KEEP_AS_NON_CORE
    reason: >-
      POFUT2 is the ER-resident enzyme that installs the O-fucose on which B3GLCT builds, and
      ADAMTSL1 is a demonstrated substrate: the O-fucose was mapped to Thr48, Thr312, Ser391
      and Thr451 by mass spectrometry, and C-mannosylation of the adjacent tryptophans in the
      same repeat was mapped in the companion study, with both modifications acting together
      as a gate on export. The compartment is correct and better supported than the other two
      rows, but it remains a biosynthetic transit compartment rather than the site where the
      protein functions. This is one of three GOA rows asserting the identical term for the
      same gene from three reactions of one Reactome pathway.
    supported_by:
    - reference_id: PMID:19671700
      supporting_text: >-
        Together, these modifications appear to provide a quality control mechanism for
        punctin-1 secretion.
    - reference_id: PMID:17395588
      supporting_text: >-
        the data define a critical role for N-glycosylation and O-fucosylation in the
        biosynthesis of punctin-1
- term:
    id: GO:0005788
    label: endoplasmic reticulum lumen
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-6785565
  qualifier: located_in
  review:
    summary: >-
      The weakest of the three identical rows: it derives from a Reactome FailedReaction
      modelling the Peters-plus disease state, in which the B3GALTL G393E variant does not
      glucosylate its substrates. The location it asserts is still correct, but it carries no
      information the two working reactions do not already supply.
    action: KEEP_AS_NON_CORE
    reason: >-
      Verified against the Reactome content service: R-HSA-6785565 has schemaClass
      FailedReaction, its catalyst is the B3GALTL G393E disease variant, and it has inputs but
      no outputs. The GO pipeline emits the compartment of the input participant set
      regardless of whether the reaction proceeds, so ADAMTSL1 receives the same endoplasmic
      reticulum lumen assignment it already has from R-HSA-5173005. Kept because the
      compartment claim is not wrong and ADAMTSL1 is a genuine B3GLCT substrate, but marked
      non-core on the same transit-compartment grounds as its two siblings, and flagged as
      redundant. Whether a FailedReaction should emit a location annotation identical to that
      of the corresponding working reaction is raised as a question for the Reactome-GO
      pipeline rather than treated as a defect in this gene's record.
    supported_by:
    - reference_id: PMID:17395588
      supporting_text: >-
        Mutation of the putative modified Ser/Thr residues in TSR2, TSR3, and TSR4 led to
