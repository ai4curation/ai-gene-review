  original_reference_id: PMID:11805097
  qualifier: located_in
  isoform: Q8N6G6-1
  review:
    summary: >-
      Proposed new annotation. ADAMTSL1 is the only one of the 26 human members of PANTHER
      family PTHR13723 with no extracellular matrix annotation of any kind, even though its
      matrix deposition is directly observed in human cells, endogenous untagged protein is
      recovered from human fibroblast secretomes (PMID:24281761), and its mouse orthologue
      receives the term by IBA from the same PANTHER node.
    action: NEW
    reason: >-
      The gap was found by census rather than by inspection. PAINT holds GO:0031012 as an IBD
      annotation at node PTN000347317; 24 of the 26 human members of PTHR13723 receive it by
      IBA from that node, and the one further exception, PAPLN, holds the term from its own
      evidence, which is the expected behaviour since PAINT does not lay an IBA over a direct
      annotation. ADAMTSL1 has neither. The gap is species-specific rather than
      subfamily-specific: mouse Adamtsl1 (Q8BLI0), the same PANTHER subfamily SF157, does
      receive the IBA from PTN000347317 and additionally carries three HDA rows from matrisome
      proteomics. Human evidence is not lacking. UniProt records the location as supported by
      three experimental references, the founding paper shows recombinant punctin deposited
      punctately into the cell substratum and excluded from focal contacts, and endogenous
      untagged ADAMTSL1 was recovered from human fibroblast secretomes and named as a direct
      MMP10 substrate. The caveat on the primary evidence is that the 2002 assay used
      epitope-tagged protein in a heterologous cell line, which is why the secretome result is
      cited alongside it: it is native protein in a primary human cell type, and it is
      independent of the tag. The isoform field records that the assayed material was the
      525-residue punctin-1 form, which is what was purified and expressed; it is not a claim
      that the localisation is restricted to that isoform, and it should not be read as one.
      Isoforms 1 to 4 all retain the signal peptide, so all are expected to be secreted, while
      isoforms 5 and 6 delete it and would not be.
