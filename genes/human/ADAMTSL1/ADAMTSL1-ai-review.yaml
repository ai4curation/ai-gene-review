- id: file:human/ADAMTSL1/ADAMTSL1-deep-research-affinage.md
  title: Affinage mechanistic annotation for ADAMTSL1 (human)
  findings:
  - statement: >-
      The provider record passed its own gates (gates_passed True, faith 100 percent, ten
      numeric PMIDs, no preprint identifiers in PMID-shaped fields) and its central framing -
      a secreted matrix glycoprotein without the catalytic domains, with no demonstrated
      enzymatic activity - agrees with UniProt and with the primary literature.
    supporting_text: >-
      Direct biochemical demonstration of an enzymatic activity for the mammalian protein has
      not been established in the available corpus.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Used as a lead only. Every claim taken forward was re-verified against the cited PMID
      or against UniProt. Two divergences were found and are recorded in the gene notes: the
      record describes the protein as having four thrombospondin repeats, which is true of
      the short punctin-1 splice form but not of the 1762-residue canonical sequence, and it
