      Of the 26 human members of PANTHER family PTHR13723, 24 receive GO:0031012
      extracellular matrix by IBA from node PTN000347317. PAPLN does not, but holds the term
      from its own evidence. ADAMTSL1 is the only human member of the family with no
      GO:0031012 annotation from any evidence code, while its mouse orthologue - same
      subfamily SF157 - does receive the IBA from the same node.
    supporting_text: '**Members with no `GO:0031012` annotation of any kind: ADAMTSL1.**'
  - statement: >-
      Within the ADAMTS-like branch, ADAMTSL1 and THSD4 carry the Hydrolase keyword while
      ADAMTSL2, ADAMTSL3, ADAMTSL4 and ADAMTSL5 do not, and none of the six has a catalytic
      activity comment.
    supporting_text: 'Entries with a CATALYTIC ACTIVITY comment: none.'
  - statement: >-
      PAINT records IKR and IRD loss calls at node PTN002673039 that block metalloendopeptidase
      activity and proteolysis from propagating down the ADAMTS-like branch, but in GOA the
      loss reaches only ADAMTSL2. ADAMTSL1 receives neither the catalytic terms nor the
      negation.
