  label: Homo sapiens
description: AMMECR1L is the paralog of AMMECR1, sharing its conserved RAGNYA-fold AMMECR1 domain, which
  is predicted to bind nucleic acids or nucleotides. AMMECR1L dimerizes with AMMECR1 and localizes with
  it to the nucleus. Its levels rise in cells of a patient who has lost AMMECR1, suggesting partial compensation.
  Its molecular activity and biological role are otherwise uncharacterized.
