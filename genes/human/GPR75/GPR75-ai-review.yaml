  id: NCBITaxon:9606
  label: Homo sapiens
description: 'Class A (rhodopsin-like) G protein-coupled receptor of the plasma membrane, 540 residues
  with a seven-transmembrane fold, expressed most highly in brain and spinal cord and also in retinal
  pigment epithelium, hypothalamus, adipose tissue, pancreatic islets, liver, kidney and vasculature.
  Cryo-EM structures of the human receptor in apo and Gq-coupled states show that it engages heterotrimeric
  Gq, and that it adopts an active-like conformation without a bound ligand: the canonical DRY motif
  is replaced by HRL so the ionic lock is absent, and the extracellular domain is collapsed so that
  no conventional orthosteric pocket exists. GPR75 remains formally an orphan receptor in the IUPHAR
  classification. Two endogenous agonists have been proposed - the chemokine CCL5/RANTES and the cytochrome
  P450 eicosanoid 20-hydroxyeicosatetraenoic acid - and both assignments are disputed, the CCL5 claim
  resting on heterologous-expression pharmacology in a small number of studies and the structural
  work raising doubt about orthosteric ligand binding in general. Independently of the ligand question,
  human loss-of-function variants in GPR75 are associated with protection from obesity and type 2
  diabetes, and Gpr75-null rodents are lean, hypophagic and resistant to diet-induced insulin resistance,
  which has made the receptor a prominent anti-obesity drug target. Its evolutionary relatives by
  transmembrane sequence are peptide receptors such as galanin and growth hormone secretagogue receptors
  rather than chemokine receptors.'
