- term:
    id: GO:0016493
    label: C-C chemokine receptor activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: 'Phylogenetic transfer of C-C chemokine receptor activity to human GPR75. The PAINT tree
      was inspected. The annotation''s WITH/FROM is MGI:MGI:2441843 (mouse Gpr75) plus node PANTHER:PTN002796002,
      and mouse Gpr75 does carry GO:0016493 with IDA from PMID:17001303, so the IBD is experimentally
      grounded - in exactly one descendant, the direct orthologue of the target.'
    action: MARK_AS_OVER_ANNOTATED
    reason: 'Not removed, because the donor annotation is a genuine experimental annotation whose
      full text was not read here, and because CCL5-dependent, GPR75-dependent responses have been
      reported by more than one group (PMID:17001303 in transfected cells, PMID:29772059 in SH-SY5Y
      cells that lack CCR1/CCR3/CCR5). But it is an over-annotation of human GPR75 for four reasons.
      First, there is no experimental support on the human protein at all: the IBA, the Ensembl IEA
      and the ISS all reduce to the same mouse orthologue (UniProtKB:Q6X632 / MGI:2441843), so what
      looks like three independent lines of evidence is one. Second, IUPHAR still classifies GPR75
      as an orphan receptor and 2025-2026 reviews state that the agonist status of both CCL5 and 20-HETE
      remains controversial. Third, the 2026 cryo-EM structures show a completely collapsed extracellular
      domain with no conventional orthosteric pocket and a receptor that is constitutively active
      without ligand - a particularly hard architecture to reconcile with chemokine binding, which
      normally requires an extended N-terminal and extracellular-loop recognition surface. Fourth,
      GPR75 is not a chemokine receptor by descent; its nearest relatives by transmembrane sequence
      are peptide receptors of other families. The defensible molecular function for this gene remains
      the generic GO:0004930.'
    supported_by:
