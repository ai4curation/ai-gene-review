core_functions:
- molecular_function:
    id: GO:0004930
    label: G protein-coupled receptor activity
  description: 'GPR75 is a plasma-membrane class A seven-transmembrane receptor that couples to heterotrimeric
    Gq and has been captured in a Gq-bound cryo-EM complex. It adopts an active-like conformation
    even in the apo state: the canonical DRY motif is replaced by HRL so that the ionic lock is absent,
    and a Lys134-Asp210 salt bridge stabilises the active form without ligand. Its endogenous agonist
    is not established; CCL5/RANTES and 20-HETE have both been proposed and both remain disputed, and
    IUPHAR continues to list the receptor as an orphan. The generic receptor term is therefore the
    highest-confidence molecular function that can be asserted.'
  directly_involved_in:
  - id: GO:0007186
    label: G protein-coupled receptor signaling pathway
  locations:
  - id: GO:0005886
    label: plasma membrane
  knowledge_gaps:
  - gap_statement: The endogenous agonist of GPR75 is undetermined, and it is unresolved whether the
      receptor has a functional orthosteric ligand site at all.
    boundary: The receptor fold, plasma membrane localisation and Gq coupling are established by cryo-EM,
      and the organismal consequence of losing GPR75 is well replicated - human loss-of-function variants
      and rodent knockouts are lean and insulin-sensitive. What is missing is a validated agonist
      and a binding site for it.
    gap_kind:
    - BIOLOGY
    - CURATION
    dark_aspect: MF_DARK
    status: OPEN
    significance: GPR75 is a leading anti-obesity target, and the choice between an orthosteric small
      molecule, an allosteric modulator and a protein-protein-interaction approach depends entirely
      on this. It also determines whether the chemokine-receptor annotations currently in GOA should
      survive.
    resolution: An unbiased ligand screen against the structurally characterised receptor, with the
      candidate agonists CCL5 and 20-HETE tested head-to-head in multiple laboratories and with binding
      measured directly rather than inferred from downstream signalling.
    provenance:
    - reference_id: PMID:40362321
      supporting_text: however, its definitive endogenous ligand remains unidentified, and GPR75 is
        currently classified as an orphan receptor by International Union of Basic and Clinical Pharmacology
        (IUPHAR)
    - reference_id: PMID:41545757
      supporting_text: a completely collapsed extracellular domain eliminates the traditional orthosteric
        binding pocket, raising critical questions about previously reported small molecule ligands
  supported_by:
  - reference_id: PMID:41545757
    supporting_text: Here we present the cryo-EM structures of human GPR75 in apo and Gq-coupled states
  - reference_id: PMID:40362321
    supporting_text: More recent studies have classified GPR75 as a Gαq protein-coupled receptor within
      the Class A rhodopsin-like family
suggested_questions:
- question: Does CCL5/RANTES bind human GPR75 directly, or do the reported GPR75-dependent CCL5 responses
    reflect a co-receptor, a heteromer, or transactivation? No direct binding measurement has been
    published, and the 2026 structures show a collapsed extracellular domain that offers neither of
    the two recognition surfaces chemokine receptors normally use.
  experts:
  - Italo Mocchetti
  - Simona Dedoni
- question: If GPR75 is constitutively active with no orthosteric pocket, what actually regulates
    it in vivo - an allosteric lipid, a protein partner, receptor trafficking, or expression level
    alone?
  experts:
  - H Eric Xu
  - Can-Rong Wu
- question: Should GO retain C-C chemokine receptor activity on the mouse Gpr75 experimental annotation
    that seeds all the human propagations, given that IUPHAR does not recognise the deorphanization?
    This is a source-annotation question for MGI and GO_Central rather than a human-gene question.
  experts: []
- question: Is the lean, insulin-sensitive phenotype of GPR75 loss mediated by constitutive receptor
    activity rather than by loss of agonist-evoked signalling? If so, a useful antagonist would need
    inverse-agonist properties.
  experts:
  - Michal Laniado Schwartzman
suggested_experiments:
- hypothesis: CCL5 binds human GPR75 directly with an affinity consistent with the reported functional
    potencies.
  description: Measure direct binding of fluorescently or radiolabelled CCL5 to purified human GPR75
    reconstituted in nanodiscs, by saturation and competition binding and by mass photometry, alongside
    a validated chemokine receptor such as CCR5 as a positive control and surface mutants of the apo
    GPR75 structure as specificity controls. A negative result with adequate power would settle the
    annotation question.
  experiment_type: Direct ligand binding to purified receptor
- hypothesis: The GPR75-dependent effects of CCL5 in neuronal cells require a partner receptor or
    an indirect route rather than direct chemokine binding.
  description: In SH-SY5Y cells with GPR75 knocked out, reconstitute with wild-type GPR75 versus receptors
    carrying mutations in the residual extracellular surface and test CCL5-evoked ERK and AKT phosphorylation;
    in parallel run proximity labelling on CCL5-stimulated cells to identify any co-receptor present
    in the GPR75 vicinity.
  experiment_type: Genetic reconstitution plus proximity proteomics
- hypothesis: GPR75 signals constitutively in cells and is modulated allosterically rather than orthosterically.
  description: Compare basal and agonist-stimulated Gq activation and beta-arrestin recruitment for
    wild-type GPR75 versus the HRL-motif and Lys134-Asp210 salt-bridge mutants predicted to destabilise
    the ligand-free active state, and screen a lipid and small-molecule library for modulators that
    act on the basal signal rather than on a stimulated one.
  experiment_type: Pharmacological profiling of constitutive activity
