  review:
    summary: Sound PAINT IBA from Unikont node PTN000106239, reinforced by direct mitochondrial localization and catalytic activity of human ABHD11.
    action: ACCEPT
    reason: >-
      PAINT node PANTHER:PTN000106239 (Unikonts, strictly inside Eukaryota and
      excluding the bacterial YbfF clade) propagates GO:0005739 from verified
      mammalian (Q8NFV4, mouse Abhd11 MGI:1916008) and yeast (Imo32
      SGD:S000003263) mitochondrial proteins; human ABHD11 is both localized to
