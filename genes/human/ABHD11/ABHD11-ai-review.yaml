    - reference_id: PMID:32792488
      supporting_text: >-
        Here, using CRISPR Cas9 genome-wide mutagenesis to screen for genetic
        determinants of 2-OG levels, we uncover a redox sensitive mitochondrial
        lipoylation pathway, dependent on the mitochondrial hydrolase ABHD11, that
        signals changes in mitochondrial 2-OG metabolism to 2-OG dependent
        dioxygenase function.
    propagation_review:
