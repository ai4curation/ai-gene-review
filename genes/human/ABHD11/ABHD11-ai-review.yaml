- description: >-
    Mitochondrial matrix glutaryl-lipoyl thioesterase associated with the
    2-oxoglutarate dehydrogenase complex (OGDHc) that hydrolyzes inhibitory
    S-glutaryl adducts from the lipoylated E2 subunit DLST, preserving lipoamide
    redox cycling, 2-oxoglutarate oxidative decarboxylation, and tricarboxylic
    acid cycle flux.
  molecular_function:
    id: GO:0016790
    label: thiolester hydrolase activity
  directly_involved_in:
