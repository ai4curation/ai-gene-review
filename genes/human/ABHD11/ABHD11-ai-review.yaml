id: Q8NFV4
gene_symbol: ABHD11
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  ABHD11 is a 306-residue human mitochondrial matrix serine hydrolase of the
  alpha/beta-hydrolase superfamily encoded within the 7q11.23 chromosomal
  interval hemizygously deleted in Williams-Beuren syndrome. Imported into the
  mitochondrial matrix via a cleavable N-terminal targeting presequence, ABHD11
  folds into an eight-stranded alpha/beta-hydrolase core capped by an inserted
  three-helix lid and carries a canonical catalytic triad comprising the
  nucleophilic elbow serine Ser132 (within 130-GHSMG-134), the beta-6
  charge-relay aspartate Asp156, and the C-terminal loop general-base histidine
  His287, together with a 64-HGLFG-68 oxyanion-hole motif. Physiologically,
  ABHD11 physically associates with the OGDH and DLST subunits of the
  mitochondrial 2-oxoglutarate dehydrogenase complex (OGDHc) and acts as a
  glutaryl-lipoyl thioesterase that hydrolyzes inhibitory S-glutaryl adducts
  from the lipoate cofactor on K110 of DLST, releasing free glutarate and
  regenerating catalytically active dihydrolipoamide. Loss or covalent
  active-site inhibition of ABHD11 causes glutaryl-lipoyl adduct accumulation on
  OGDHc, impairs oxidative decarboxylation of 2-oxoglutarate and tricarboxylic
  acid cycle flux, elevates 2-oxoglutarate and L-2-hydroxyglutarate to inhibit
  2-oxoglutarate-dependent dioxygenases in transformed cells, and rewires
  reductive lipid and oxysterol synthesis in T lymphocytes to promote central
  memory CD8+ differentiation and dampen effector cytokine production. Although
  purified ABHD11 hydrolyzes short-chain chromogenic carboxylic esters in vitro,
  full-length enzyme shows no physiological monoacylglycerol, diacylglycerol, or
  long-chain acyl-CoA hydrolase activity.
alternative_products:
- name: 1 (A)
  id: Q8NFV4-1
  description: >-
    Canonical 306-aa mitochondrial matrix precursor (sequence version 2, trimmed
    by 9 N-terminal initiation-artifact residues relative to historical 315-aa
    sequence version 1), carrying the N-terminal mitochondrial targeting
    presequence and intact oxyanion loop (64-HGLFG-68) and Ser132-Asp156-His287
    catalytic triad; all physiological enzymatic and complex-association
    activities belong to this form.
- name: 2 (B)
  id: Q8NFV4-2
  sequence_note: VSP_023925, VSP_023928
  description: >-
    Substitutes residues 87-92 and deletes residues 93-306, truncating ahead of
    the Ser132 nucleophile and removing the entire catalytic domain; predicted
    to undergo nonsense-mediated mRNA decay and cannot be catalytically active.
- name: 3 (C)
  id: Q8NFV4-3
  sequence_note: VSP_023926, VSP_023927
  description: >-
    Substitutes Val88->Gly and deletes residues 89-306, truncating ahead of the
    catalytic triad and predicted to undergo nonsense-mediated mRNA decay.
- name: 4 (D)
  id: Q8NFV4-4
  sequence_note: VSP_023924
  description: >-
    299-aa splice variant lacking residues 42-48 in the N-terminal disordered
    segment while retaining the entire alpha/beta-hydrolase fold and catalytic
    triad (Ser125-Asp149-His280); used as the open reading frame clone in the
    HuRI yeast two-hybrid interactome screen (PMID:32296183).
- name: 5 (E)
  id: Q8NFV4-5
  sequence_note: VSP_023924, VSP_023929, VSP_023930
  description: >-
    Deletes residues 42-48, replaces residues 116-143 (eliminating the
    130-GHSMG-134 nucleophilic elbow), and truncates residues 144-306 (removing
    Asp156 and His287), yielding a catalytically inactive fragment.
- name: '6'
  id: Q8NFV4-6
  sequence_note: VSP_046994
  description: >-
    Internal deletion of residues 146-202 removing beta-6 (including the Asp156
    charge-relay carboxylate) and part of the helical cap domain, disrupting the
    active-site architecture.
