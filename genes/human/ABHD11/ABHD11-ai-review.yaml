proposed_new_terms:
- proposed_name: protein S-glutaryl-dihydrolipoyllysine hydrolase activity
  proposed_definition: >-
    Catalysis of the hydrolysis of the thioester bond in an S-glutaryl-dihydrolipoyllysine
    residue of a lipoylated protein to yield glutarate and a protein
    dihydrolipoyllysine residue.
  justification: >-
    Existing GO term GO:0016790 (thiolester hydrolase activity) captures the
    thioester bond cleavage class, and acyl-CoA or S-glutathione hydrolase child
    terms do not cover deacylation of S-glutarylated lipoamide prosthetic groups
    on mitochondrial 2-oxoacid dehydrogenase E2 subunits demonstrated for human
    ABHD11 (PMID:40664791).
  proposed_parent:
    id: GO:0016790
    label: thiolester hydrolase activity
  supported_by:
