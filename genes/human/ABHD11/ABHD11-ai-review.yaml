- term:
    id: GO:0006103
    label: 2-oxoglutarate metabolic process
  evidence_type: IMP
  original_reference_id: PMID:32792488
  qualifier: involved_in
  review:
    summary: ABHD11 catalytic activity directly maintains OGDHc lipoylation and mitochondrial oxidative decarboxylation of 2-oxoglutarate.
    action: NEW
    reason: >-
      ABHD11 directly participates in mitochondrial 2-oxoglutarate catabolism as
      a resident enzymatic repair subunit physically bound to OGDHc (part_of
      GO:0045252 by IDA, selectively co-purifying with OGDH and DLST) that
      continuously hydrolyzes catalytic-cycle-generated S8-glutaryl-lipoamide
      adducts on DLST in situ; CRISPR knockout, active-site point mutation
      (S141A/Ser132Ala, H296A/His287Ala), or selective pharmacological inhibition
      (ML226) directly impairs mitochondrial OGDHc catalytic activity and causes
      rapid 2-oxoglutarate accumulation in [U-13C5]glutamine tracing
      (PMID:32792488, PMID:40664791). Comparator check against in-repo human
      reviews confirms that upstream de novo lipoate-installation enzymes (LIAS
      and LIPT1; LIPT2 not yet curated in-repo) carry GO:0009249 (protein
      lipoylation) and do NOT carry GO:0006103 because they perform one-time
      prosthetic-group biosynthesis across multiple 2-oxoacid dehydrogenases,
      whereas OGDHc subunits DLST and DLD carry GO:0006103 alongside GO:0045252;
      ABHD11 aligns with OGDHc complex members rather than upstream lipoylation
      enzymes because it neither synthesizes nor ligates lipoate (PMID:32792488)
      but acts within OGDHc to sustain ongoing 2-oxoglutarate turnover.
    supported_by:
    - reference_id: PMID:32792488
      supporting_text: >-
        ABHD11 loss or inhibition drives a rapid increase in 2-OG levels by
        impairing lipoylation of the 2-OG dehydrogenase complex (OGDHc)-the rate
        limiting step for mitochondrial 2-OG metabolism.
    - reference_id: PMID:32792488
      supporting_text: >-
        OGDHc activity was decreased in ABHD11 deficient mitochondria, similarly
        to levels observed with depletion of the OGDH subunit (Fig. 2g).
