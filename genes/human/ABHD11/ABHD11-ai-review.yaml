- term:
    id: GO:0006629
    label: lipid metabolic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN002919262
  - SGD:S000003263
  review:
    summary: Over-propagated PAINT IBA from single-seed yeast IMO32 overexpression triacylglycerol changes; human ABHD11 regulates OGDHc lipoyl deglutarylation and 2-oxoglutarate metabolism rather than cellular glycerolipid metabolism.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Propagated at Eukaryota (PANTHER:PTN002919262) solely from SGD:S000003263
      (yeast IMO32 high-copy overexpression [14C]acetate triacylglycerol shifts in
      PMID:28465236). Full-length human ABHD11 shows no hydrolytic activity toward
      monoacylglycerols, diacylglycerols, oleoyl-CoA, or arachidonoyl-CoA
      (PMID:27544863), Abhd11 knockout mice have unaltered endogenous 2-AG
      levels (PMID:32579589), and ABHD11's physiological function is removing
      S-glutaryl adducts from the lipoate cofactor of mitochondrial OGDHc to
      sustain 2-oxoglutarate and TCA cycle metabolism (PMID:32792488,
      PMID:40664791); lipidomic shifts upon ABHD11 inhibition are downstream
      metabolic consequences of impaired OGDHc flux driving reductive
      carboxylation.
    supported_by:
    - reference_id: PMID:27544863
      supporting_text: >-
        Our fluorescent activity assays designed for natural lipase substrates
        revealed no activity of hABHD11 towards mono- or diacylglycerols.
    - reference_id: PMID:40664791
      supporting_text: >-
        Mechanistically, we find ABHD11 removes glutaryl adducts from lipoate-an
        essential fatty acid modification required for the TCA cycle.
    propagation_review:
      root_cause: SOURCE_WEAK_OR_INFERRED
      failure_modes:
      - SOURCE_EVIDENCE_WEAK
      - FUNCTIONAL_DIVERGENCE
      residue_claims_not_applicable: Physiological substrate and pathway divergence despite an intact Ser132-Asp156-His287 triad.
      source_entities:
