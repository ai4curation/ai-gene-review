  findings:
  - statement: >-
      Demonstrates that human ABHD11 is a glutaryl-lipoyl thioesterase that
      directly cleaves S-glutaryl adducts from K110-lipoylated OGDHc-E2 (DLST)
      to release glutarate and preserve TCA cycle activity, without cleaving
      lysine-glutaryl amides or glutaryl-CoA, and regulates human CD8+ central
      memory T cell programming.
    supporting_text: >-
      Here we show that glutaryl–lipoyl adducts (Lpglu) are constantly formed on
      ketoacid dehydrogenases and that the serine hydrolase ABHD11 acts as a
      glutaryl–lipoyl thioesterase that removes these lipoyl adducts.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Definitive full-text biochemical identification of ABHD11's endogenous
      reaction (glutaryl-lipoyl thioester hydrolysis on OGDHc-E2). Catalytic
      site numbering S141 and H296 in Fig. 3f uses historical 315-aa Q8NFV4 sv=1
      (= Ser132 and His287 in current 306-aa sv=2).
- id: PMID:41184294
  title: Mitochondrial ABHD11 inhibition drives sterol metabolism to modulate T-cell effector function.
  findings:
  - statement: >-
      Pharmacological inhibition of mitochondrial ABHD11 compromises the TCA
      cycle in human and mouse T cells, elevating 24,25-epoxycholesterol
      biosynthesis and LXR signaling to suppress effector cytokine production.
    supporting_text: >-
      Mechanistically, the anti-inflammatory effects of ABHD11 inhibition are
      attributed to increased 24,25-epoxycholesterol (24,25-EC) biosynthesis and
      subsequent liver X receptor (LXR) activation, which arise from a
      compromised TCA cycle.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Corroborates ABHD11's conserved role in maintaining OGDHc/TCA cycle function in primary human and murine T lymphocytes; downstream sterol/cytokine effects are not annotated as direct GO processes of ABHD11.
- id: file:human/ABHD11/ABHD11-deep-research-affinage.md
  title: Affinage mechanistic annotation for ABHD11 (human)
  findings:
  - statement: >-
      Machine-fetched Affinage synthesis accurately summarizing ABHD11's
      mitochondrial OGDHc association, glutaryl-lipoyl thioesterase activity,
      and T cell metabolic effects, while emitting a hallucinated RNA-catalytic
      GO Slim term and a malformed bioRxiv pseudo-PMID.
    supporting_text: >-
      Mechanistically, ABHD11 acts as a deglutarylating thioesterase that
      selectively removes glutaryl adducts from the lipoate moiety of the OGDHc
      lipoyl domain, so that its absence allows glutaryl-lipoyl adducts to
      accumulate and rewires mitochondrial/TCA metabolism [PMID:40664791].
  reference_review:
    relevance: HIGH
    correctness: LOW_QUALITY
    review_notes: >-
      Although Affinage's prose narrative accurately reflects PMID:32792488,
      PMID:40664791, PMID:41184294, PMID:27544863, and PMID:32579589 and passed
      its internal pairwise gate (self_evaluation_pairwise = win, faith_pct =
      83.3%), curatorial audit identified two concrete defects that preclude
      marking it VERIFIED: (1) its GO mechanism profile asserts GO:0140098
      'catalytic activity, acting on RNA', which has zero biological or
      literature basis for ABHD11 (alongside coarse goslim_generic terms
      GO:0140096 and GO:0016787 and root GO:0005739); and (2) its dated findings
      and citations list a malformed pseudo-PMID token
      'PMID:bio_10.1101_2024.09.11.612392' that duplicates the published Nature
      Chemical Biology 2025 paper PMID:40664791 (itself misdated as 2024). None
      of Affinage's GO Slim terms or pseudo-PMIDs were imported; every claim
      used in this review was verified directly against cached primary PMIDs and
      UniProt Q8NFV4.
    source_defects:
    - defect_type: WRONG_STATEMENT
      resource: OTHER
      record: UniProtKB:Q8NFV4
      slot: molecular_activity
      requested_change: CHECK
      asserted_value: '- **molecular_activity:** GO:0140096 catalytic activity, acting on a protein, GO:0016787 hydrolase activity, GO:0140098 catalytic activity, acting on RNA'
      cause: OTHER
      confidence: CONFIRMED
      explanation: >-
        Affinage's automated GO Slim grounding on https://affinage.wi.mit.edu/api/gene/ABHD11
        falsely assigns GO:0140098 (catalytic activity, acting on RNA) to human
        ABHD11, a mitochondrial matrix glutaryl-lipoyl thioesterase with no RNA
        substrate or ribonuclease activity; molecular_activity should reflect
        thiolester hydrolase activity (GO:0016790) without GO:0140098.
    - defect_type: WRONG_STATEMENT
      resource: OTHER
      record: UniProtKB:Q8NFV4
      slot: citations
      requested_change: CHECK
      asserted_value: '- PMID:bio_10.1101_2024.09.11.612392'
      corrected_value: PMID:40664791
      cause: OTHER
      confidence: CONFIRMED
      explanation: >-
        Affinage's citation list at https://affinage.wi.mit.edu/api/gene/ABHD11
        emits a non-PubMed bioRxiv pseudo-identifier ('PMID:bio_10.1101_2024.09.11.612392')
        that duplicates the peer-reviewed Nature Chemical Biology 2025 article
        PMID:40664791 already present in the same record; remove the malformed
        preprint token and update the PMID:40664791 publication year to 2025.
- id: file:human/ABHD11/ABHD11-uniprot.txt
  title: UniProtKB record Q8NFV4 (ABHDB_HUMAN) for Homo sapiens ABHD11
  findings:
  - statement: >-
      Canonical 306-aa human ABHD11 (Q8NFV4 sv=2) carries an N-terminal
      mitochondrial transit peptide, active-site residues Ser132 and His287 with
      curated S132A and H287A loss-of-function mutagenesis, and mitochondrial
      matrix localization.
    record_section: ["CC:SUBCELLULAR LOCATION"]
    supporting_text: 'CC       Mitochondrion matrix {ECO:0000269|PubMed:32792488}.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Primary sequence and feature table source for Q8NFV4 sv=2; note that
      RecName EC 3.1.1.116 / RHEA:33275..48596 over-states truncated in vitro
      Q8NFV4 (flagged in source_defects on GO:0120516), and FT ACT_SITE 228
      (Asp228 in 223-WRVNLDALT-231) in the cap/core linker is an unverified
      homology call whereas beta-6 Asp156 aligns with the structural triad acid
      of E. coli YbfF (PDB:3BF7).
- id: file:human/ABHD11/ABHD11-bioinformatics/RESULTS.md
