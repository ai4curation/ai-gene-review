    supporting_text: >-
      ABHD11 released glutarate from the OGDHc-E2 Lpglu peptide, and this was
      blocked with ML226 (Fig. 3g).
suggested_questions:
- question: >-
    Does human ABHD11 also hydrolyze endogenous lipid-peroxidation-derived
    hemiacetal/Michael lipoyl adducts (such as 4-hydroxynonenal conjugates) or
    S-succinyl-lipoyl adducts in vivo, or are lipid-peroxidation phenotypes in
    ABHD11-deficient cells indirect consequences of S-glutaryl-lipoyl
    sequestration?
- question: >-
    Does haploinsufficiency of ABHD11 within the 7q11.23 deletion contribute to
    mitochondrial bioenergetic or immunometabolic phenotypes in individuals with
    Williams-Beuren syndrome?
suggested_experiments:
- hypothesis: >-
    A crystal or cryo-EM structure of human ABHD11 bound to an S-glutaryl-lipoyl
    DLST lipoyl-domain mimic will reveal how the inserted three-helix cap domain
    selects lipoate thioesters while excluding coenzyme A thioesters.
  description: >-
    Co-crystallize catalytically inactive human ABHD11 Ser132Ala (mature chain)
    with a synthetic S-glutaryl-dihydrolipoyl-K110 DLST lipoyl domain and solve
    its high-resolution X-ray structure to map cap-crevice contacts and compare
    directly with Escherichia coli YbfF (PDB:3BF7).
  experiment_type: structural biology
- hypothesis: >-
    Williams-Beuren syndrome patient-derived cells carrying hemizygous 7q11.23
    deletion exhibit elevated steady-state DLST K110 glutaryl-lipoylation under
    metabolic stress.
  description: >-
    Quantify OGDHc-E2 K110 functional lipoylation versus S-glutaryl-lipoylation
    by LC-MS/MS and Seahorse 2-oxoglutarate-driven respiration in WBS patient T
    cells and iPSC-derived cardiomyocytes before and after lentiviral ABHD11
    complementation.
  experiment_type: biochemistry
