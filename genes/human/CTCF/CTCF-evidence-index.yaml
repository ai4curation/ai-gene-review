primary_read_scopes:
- reference_id: PMID:16107875
  completed_read_and_evidence_scope: Authentic external publisher Methods and selected main Results were
    read. Human mitotic chromosome association/localization and separate mouse H19 chromatin experiments
    support the locations; no figure-pixel or full supplementary read is claimed.
- reference_id: PMID:16595548
  completed_read_and_evidence_scope: Complete abstract explicitly reports human K562/MCF7 nucleoplasmic-to-nucleolar
    redistribution and separate rat neuron observations. Full original Methods remain unavailable. Positive
    curated location is retained; its PARylated 180-kDa form is not a numbered splice product.
- reference_id: PMID:16815976
  completed_read_and_evidence_scope: Selected original mouse liver allele-specific 3C/ChIP, CTCF-site
    mutation and Discussion/Methods were read. Human translated CTCF assays are separate. Supports performed
    imprinting architecture without proving intrinsic methyltransferase or a direct homodimer bridge.
- reference_id: PMID:17827499
  completed_read_and_evidence_scope: Indexed original human CTCF fragment purification and methylation-sensitive
    insulator DNA assays recovered. Mouse imprinting substrate is not a human whole-organism experiment.
    Cache remains abstract-only.
- reference_id: PMID:18347100
  completed_read_and_evidence_scope: Selected human MHC-II main Results/Methods/Discussion establish CTCF-dependent
    transcript output and promoter contacts, with general transcription and regulator-expression controls.
    Nuclear association is not purified binary binding.
- reference_id: PMID:18413740
  completed_read_and_evidence_scope: The correct paper explicitly reports CTCF BAG-1 promoter binding
    and repression alongside BORIS activation. Its saved full-text flag is preserved, but the extraction
    contains Introduction/Discussion and lacks Methods/Results; direct recovery failed. The reported positives
