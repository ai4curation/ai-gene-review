suggested_questions:
- question: Which CTCF activity directly modulates centromeric sister cohesion, as distinct from centromere
    spring structure and chromosome segregation?
- question: Which DNA-binding and chromatin-organization activities are retained by the official 399-aa
    product?
- question: Can the source citation for the original PMID18654629 looping row be updated to a direct loop
    study while preserving its historical identity?
- question: Does the CTCF–CGGBP1 interaction represent a separable non-DNA-binding coregulator role, or
    should its positive association receive a different partner-class term?
- question: How do cell type, depletion duration and mitotic state explain the distinct CENP-E recruitment
    outcomes in the 2015 and 2026 studies?
- question: How do the protected PTHR16515/PTHR16515:SF49 records and the current PTHR24404 target tree
    correspond across PANTHER resource versions? The target and its three on-path IBDs are authenticated
    in the latter; this version difference alone does not justify changing the selected family or rejecting
    the transfers.
suggested_experiments:
- description: Compare the two sequence-verified human CTCF products at matched expression using motif-resolved
    DNA binding, chromatin occupancy and contact assays; distinguish engineered finger fragments from
    the natural short product.
- description: Use acute, matched CTCF perturbations in the original HeLa and HCT116 contexts to separate
    CENP-E recruitment, centromere tension, sister cohesion and chromosome congression endpoints.
status: DRAFT
proposed_new_terms:
- proposed_name: histone demethylase binding
  proposed_definition: Binding to a protein that catalyzes histone demethylation.
  justification: CTCF associates with the histone demethylase KDM5B in DNase-treated cell extracts. GO:0019899
    enzyme binding remains the supported available partner-class term. The captured immediate child list
    lacks a fitting histone-demethylase-binding child; a curator should check broader ontology coverage
    before creating this proposed class. The interaction does not establish demethylase activity or activation
    by CTCF, or purified binary contact.
  proposed_parent:
    id: GO:0019899
    label: enzyme binding
  supported_by:
  - reference_id: PMID:24937458
