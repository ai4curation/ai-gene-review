id: P49711
gene_symbol: CTCF
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CTCF is a nuclear zinc-finger DNA-binding protein that organizes chromatin loops and regulates
  transcription. Sequence-specific occupancy at regulatory and boundary elements helps anchor contacts
  with cohesin and constrains enhancer–promoter communication. CTCF can activate or repress RNAPII transcription
  according to the locus and cellular context, and contributes to allele-specific organization at imprinted
  loci. RNA interactions can modulate its chromatin occupancy. CTCF also contributes to mitotic centromere
  organization. The 727-residue protein contains eleven zinc fingers; the 399-residue alternative product
  lacks the N-terminal 328 residues, and equivalent DNA recognition or architectural activity has not
  been established.
alternative_products:
- name: '1'
  id: P49711-1
  sequence_note: Displayed 727-residue sequence independently matches the official FASTA. The original
    engineered fragments and endogenous assays are distinguished from numbered-product assignments.
- name: '2'
  id: P49711-2
  sequence_note: VSP_045350 deletes canonical residues 1–328, yielding the exact official 399-residue
    sequence. This removes zinc fingers 1 and 2 and part of finger 3; retained fingers do not establish
    equivalent recognition, loop anchoring or transcriptional function.
