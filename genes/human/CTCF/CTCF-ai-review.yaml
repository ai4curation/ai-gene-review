core_functions:
- description: Sequence-specific CTCF binding anchors chromatin loops and organizes regulatory contacts
    in the nucleus, including contacts between enhancers and promoters. Its architectural contribution
    is distinct from the ATP-dependent extrusion motor supplied by SMC complexes.
  molecular_function:
    id: GO:0140587
    label: chromatin loop anchoring activity
  directly_involved_in:
  - id: GO:0140588
    label: chromatin looping
  locations:
