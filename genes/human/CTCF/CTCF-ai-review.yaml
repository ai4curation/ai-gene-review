  - reference_id: PMID:24662484
    supporting_text: Knockdown of CTCF disrupted these chromatin loops
  - reference_id: PMID:26276636
  - reference_id: PMID:34856126
- description: CTCF binds regulatory DNA to modulate transcription by RNA polymerase II. It can repress
    or activate transcription according to the promoter and cellular context, as shown by MYC repression
    and APP activation assays.
