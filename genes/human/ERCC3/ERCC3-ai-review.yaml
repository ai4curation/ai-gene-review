    label: DNA helicase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR001161
  review:
    summary: Refine the family-level helicase mapping to the principal DNA-translocase activity.
    action: MODIFY
    reason: IPR001161 genuinely matches P19447 (60–779) and supplies this helicase annotation; the mapping
      is not a wrong-family assignment. Human PIC structures and newer recombinant human TFIIH experiments
      establish XPB engagement and ATP-driven movement along duplex DNA (PMID:27193682, Results 22–23/34–42;
      PMID:41673165, Results 46–51/Figure 5). GO:0015616 describes this motor action. The distinct 3′–5′
      unwinding capacity directly measured in PMID:17466626 Figure 5B is retained in its specific non-core
      annotations, rather than declared absent.
