id: P19447
gene_symbol: ERCC3
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ERCC3 encodes XPB, a 782-amino-acid ATP-dependent DNA motor in the TFIIH core complex. In
  the nucleoplasm, XPB engages duplex DNA and uses ATP hydrolysis to promote DNA opening during nucleotide-excision
  repair and RNA polymerase II transcription initiation. Its activity also contributes to promoter clearance.
  Partner-dependent regulation within TFIIH coordinates the XPB motor with the repair and transcription
  assemblies. Recombinant human XPB has measurable 3′–5′ DNA-unwinding capacity, but experiments separating
  ATPase and unwinding defects support duplex translocation as its principal DNA-opening mechanism. The
  extent of XPB dependence varies among promoters and experimental conditions. Biallelic ERCC3 variants
  cause xeroderma pigmentosum group B, sometimes with Cockayne syndrome features, or photosensitive trichothiodystrophy.
