suggested_questions:
- question: Which experiments directly distinguish damage-selective binding by human XPB from its general
    duplex-DNA contact within a lesion-recognition or repair complex?
- question: How do physiological TFIIH partners couple XPB ATP hydrolysis to duplex translocation, and
    under which conditions does the separately measured 3′–5′ unwinding capacity contribute materially?
- question: Which promoter features determine dependence on XPB motor activity, and how do complete acute
    loss, residual protein after depletion, catalytic inhibition and structural disruption differ?
- question: Which cell lineage and primary experiment underlie the hair-cell differentiation assertion
    from PMID:11335038, separately from hair-shaft synthesis or mature-cell function?
- question: Which original clone or historical accession mapping reconciles the imported ADAMTSL4 Q6UY14-3
    interaction context with Q6UY14-1 in the available HuRI record?
- question: Which human XPB interfaces and original controls establish the p53 and XPG interactions, and
    do selective interface perturbations separate repair, transcription and contextual apoptosis responses?
core_functions:
- description: XPB couples ATP hydrolysis to movement along duplex DNA within the TFIIH core, promoting
    DNA opening during nucleotide-excision repair and RNA polymerase II transcription initiation, and
    contributing to the transition through promoter clearance. The motor acts in regulated multiprotein
    assemblies; its transcriptional impact varies among promoters and experimental conditions.
