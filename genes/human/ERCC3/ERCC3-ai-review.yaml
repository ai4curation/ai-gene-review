        source_status: SUPPORTS_TRANSFER
        comment: Actual PTHR11274 v19 tree places human P19447 leaf PTN002477849 below PTN000138598 (Eukaryota);
          current IBD line 13805 supports GO:0000112. No intervening NOT record was found; target MSA
          sequence matches canonical 782 aa. The yeast donor complex was read in the actual scanned original;
          no target-specific loss was found.
