  review:
    summary: XPB associates with the XPC–RAD23B repair-recognition complex.
    action: KEEP_AS_NON_CORE
    reason: PMID:10734143, Methods and Figures 1–3, supports human TFIIH association with XPC–HR23B. Free
      XPC binds GST-XPB, whereas isolated HR23B does not bind the tested TFIIH subunits; HR23B recovery
      therefore depends on the XPC-containing complex. Retain the supported association without claiming
      a purified binary XPB–RAD23B interface or assigning RAD23B activity to XPB.
