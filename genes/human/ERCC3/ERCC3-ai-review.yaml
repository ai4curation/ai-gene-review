- term:
    id: GO:0003684
    label: damaged DNA binding
  evidence_type: NAS
  original_reference_id: PMID:2167179
  qualifier: enables
  review:
    summary: The source establishes repair complementation, but specific damaged-DNA binding remains unresolved.
    action: UNDECIDED
    reason: The actual PMID:2167179 original describes predicted DNA/helicase motifs and human ERCC3 correction
      of UV-induced repair synthesis in XPB cells (Results, Figure 4 and Experimental Procedures). It
      does not directly compare binding to damaged and undamaged DNA. Later human XPB structures establish
      general duplex contact and motor-driven opening, including an internal Cy5 lesion mimic in PMID:41673165,
      but do not establish preferential damage recognition. Retain uncertainty on this specific MF rather
      than infer it from repair participation.
    additional_reference_ids:
    - PMID:27193682
    - PMID:41673165
