  review:
    summary: The repair-complex IBA is phylogenetically and experimentally grounded.
    action: ACCEPT
    reason: The current IBD at the eukaryotic XPB/Ssl2 node is inherited by human ERCC3. Its yeast donor
      is the Rad2/core-TFIIH/Ssl2 assembly actually purified and tested for incision in PMID:8855246,
      Methods 10718–10719 and Figures 1–3. This is a complex-membership assertion, not endonuclease activity
      assigned to XPB. Human TFIIH/XPG repair assemblies in PMID:41673165 independently support the conserved
      repair context, without claiming that all yeast purification properties were reproduced with human
      protein.
