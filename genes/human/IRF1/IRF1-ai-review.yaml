id: P10914
gene_symbol: IRF1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Interferon regulatory factor 1 (IRF1) is an inducible nuclear IRF-family DNA-binding
  transcription factor that recognizes ISRE/IRF elements in RNA polymerase II promoters. It
  activates antiviral, antibacterial, antigen-presentation, apoptotic, DNA-damage and growth-arrest
  target genes after interferon, pattern-recognition and stress signals, and can also repress
  selected genes such as TLR4 or survivin in a context-dependent manner.
