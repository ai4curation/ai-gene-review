- id: UniProtKB:P15153
  title: Ras-related C3 botulinum toxin substrate 2
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Official UniProt record identifies human RAC2/P15153, taxon 9606, 192 residues.
      Its CRC64 matches Reactome reference entity 62656; Reactome entity 195339 models the processed
      1–189 chain. This reference verifies substrate identity, while the catalytic assignment is supported
      by Reactome:R-HSA-9014296 and human cellular activation by PMID:12176041.
core_functions:
- description: DOCK2 promotes guanine-nucleotide exchange on RAC GTPases, connecting upstream signals
    to actin remodeling and immune-cell motility. Purified human DOCK2–ELMO1 complexes directly exchange
    nucleotide on RAC1, while human DOCK2 deficiency disrupts receptor-triggered RAC1 activation and
    chemokine responses. RAC2 is supported as a substrate by the curated RAC2 exchange reaction and
    human cellular activation studies; these are distinct from the directly measured purified RAC1
    assay. ELMO1 regulates substrate access and supports productive cellular signaling, with different
    N-terminal deletion effects in purified and cellular assays. DOCK2 acts in a cytosolic pool and
    can undergo regulated membrane recruitment.
  substrates:
  - id: UniProtKB:P63000
    label: RAC1
  - id: UniProtKB:P15153
    label: RAC2
  molecular_function:
    id: GO:0005085
    label: guanyl-nucleotide exchange factor activity
  directly_involved_in:
  - id: GO:0035022
    label: positive regulation of Rac protein signal transduction
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:32651375
    supporting_text: GEF activity data was monitored by the exchange of fluorescent mant-GTP following
      an injection of GDP
  - reference_id: PMID:26083206
    supporting_text: the chemotactic response of T and B lymphocytes from P1 and P2 was profoundly
      impaired
  - reference_id: Reactome:R-HSA-9014296
  - reference_id: PMID:12176041
  - reference_id: UniProtKB:P15153
suggested_questions:
- question: Does the DOCK2 signal associated with neutrophil granules or extracellular vesicles represent
    an enclosed pool, surface association or co-fractionation? Controlled protease protection and
    fraction-purity measurements could distinguish these possibilities.
