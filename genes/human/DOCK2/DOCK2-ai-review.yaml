id: Q92608
gene_symbol: DOCK2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: DOCK2 is a RAC-directed guanine-nucleotide exchange factor enriched in hematopoietic cells.
  Its DHR2 catalytic region promotes nucleotide exchange, while interactions with ELMO proteins and membrane-associated
  signaling components regulate substrate access and cellular recruitment. DOCK2 links chemokine and antigen-receptor
  signals to actin remodeling, immune-cell migration and antigen uptake. Biallelic loss of function causes
  combined immunodeficiency with impaired cellular responses. Alternative transcripts encode a long catalytic
  product and a much shorter product whose biological activity remains unresolved.
alternative_products:
- name: '1'
  id: Q92608-1
  description: The 1830-residue canonical product contains the N-terminal ELMO-interaction region and
    C-terminal DHR2 catalytic region. Human full-length DOCK2–ELMO1 complexes and an independently sequence-matched
    human DHR2 fragment support RAC-directed exchange. The full-length cryo-EM depositions contain unresolved
    sequence positions and are not an all-residue sequence-verification experiment.
- name: '2'
  id: Q92608-2
  sequence_note: VSP_007696, VSP_007697, VSP_007698, VSP_007699, VSP_007700
  description: This alternative product comprises 336 residues and differs from the long product through
    five alternative sequence regions. It lacks the canonical C-terminal DHR2 catalytic region. The full-length
    and isolated-domain experiments do not establish its molecular activity; the sequence difference does
    not demonstrate that the natural product has no biological function.
