  - ensembl:ENSMUSP00000090884
  review:
    summary: Mouse DOCK2 supports dendritic-cell antigen uptake and the associated immune-cell response.
    action: KEEP_AS_NON_CORE
    reason: 'The literal donor is mouse Dock2 Q8C3J5. PMID:21892172 directly compares wild-type and Dock2-null
      bone-marrow-derived dendritic cells: uptake of soluble antigen and particles is reduced, and ectopic
      DOCK2 restores uptake in the low-Dock2 ASC-null background. These are positive functional observations,
      retained as a cell-type-specific role. The later addendum PMID:22905357 shows that low Dock2 expression
      occurs in only some ASC-null lines and leaves its cause unresolved; it limits the general ASC-to-Dock2
      claim but explicitly retains the Dock2 loss/rescue observations. This ortholog annotation is not
      evidence that the experiments used human cells.'
