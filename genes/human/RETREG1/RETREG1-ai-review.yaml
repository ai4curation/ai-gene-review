proposed_new_terms:
- proposed_name: procollagen quality control by reticulophagy
  proposed_definition: >-
    The selective autophagy process in which misfolded procollagen in the endoplasmic
    reticulum lumen is recognised by a luminal chaperone co-receptor, packaged into
    endoplasmic reticulum fragments by an ER-phagy receptor, and delivered to the lysosome
    for degradation.
  proposed_parent:
    id: GO:0061709
    label: reticulophagy
  justification: >-
    There is good human evidence that misfolded procollagen is a specific RETREG1 cargo
    (PMID:30559329: in Saos2 human osteoblasts, siRNA of FAM134B most effectively inhibited
    delivery of procollagen I to lysosomes among the autophagy and ER-phagy receptors
    screened), but GO has no term for it, and the obvious candidate does not fit. GO:0030574
    collagen catabolic process is defined as "The proteolytic chemical reactions and pathways
    resulting in the breakdown of collagen in the extracellular matrix, usually carried out
    by proteases secreted by nearby cells" (QuickGO, retrieved 2026-11-24), which locates the
    substrate in the extracellular matrix. RETREG1's cargo is misfolded procollagen that
    never leaves the ER lumen, so the term's substrate and compartment are both wrong for it,
    and RETREG1 performs no proteolysis. The human comparator set agrees with that reading
    rather than against it: of 88 human GO:0030574 rows (QuickGO, taxon 9606, retrieved
    2026-11-24) all are proteases (MMP1-MMP28, cathepsins B/K/L/S, PLG, PRSS2, FAP, ADAMTS3,
    FURIN, TMPRSS6, KLK6), their regulators (CST3), or endocytic receptors for extracellular
    collagen (ITGB1 IDA PMID:10455171, MRC2/Endo180 IDA PMID:12972549) - the receptors handle
    collagen that originated in the matrix, which is definition-compatible, so they are not a
    precedent for an ER-luminal client. MGI does annotate mouse Retreg1 (Q8VE91) to GO:0030574
    (IMP, acts_upstream_of_or_within, PMID:34338405, assigned_by MGI, 2021-12-08), and that
    receipt is recorded here, but the hedged qualifier does not resolve the mismatch of
    compartment and substrate, so this review proposes the missing term rather than
    propagating the mouse row to human. A GO:0032963-side sibling for intracellular
    procollagen turnover would be an alternative home; the reticulophagy parent is proposed
    because the only characterised route is receptor-mediated ER-phagy.
  supported_by:
  - reference_id: PMID:30559329
    supporting_text: the ER-resident lectin chaperone Calnexin (CANX) and the ER-phagy receptor
      FAM134B are required for autophagy-mediated quality control of endogenous procollagens
    reference_section_type: ABSTRACT
  - reference_id: PMID:30559329
    supporting_text: we found that FAM134B silencing most effectively inhibited PC1 delivery to
      lysosomes
    reference_section_type: RESULTS
  - reference_id: PMID:30559329
    supporting_text: The impaired delivery of PC1 to lysosomes in CRISPR Fam134b MEFs was
      rescued by reintroducing WT human FAM134B, but not a FAM134B protein lacking the (LIR)
      motif
    reference_section_type: RESULTS
  - reference_id: PMID:30559329
    supporting_text: FAM134B binds the autophagosome membrane-associated protein LC3 and
      delivers a portion of ER containing both CANX and procollagen to the lysosome for
      degradation
    reference_section_type: ABSTRACT
suggested_questions:
- question: >-
    Does isoform 2 (Q9H6L5-2) still function as an ER-phagy receptor? VSP_025685 deletes
    residues 1-141, which removes the first three of the four transmembrane helices
    (60-80, 96-116, 119-139) and with them most of the reticulon-homology domain, leaving only
    TM4 (209-229); VSP_025686 then replaces 142-152, which also removes the CAMK2B
    phosphoacceptor Ser-151 and the neighbouring Ser-149 (Ser-153 is retained). Isoform 2 is
    therefore predicted to lack both the membrane-bending hairpin and the phospho-switch that
    tunes it, while keeping the C-terminal LIR. A LIR-only, scission-incompetent protein could
    act as a dominant-negative tether - which is what reconstituting Fam134b-deltaLIR did in
    mouse knockout cells - so isoform ratio could be a regulator of ER-phagy output.
- question: >-
    Is there a genuine resident cis-Golgi pool of endogenous human RETREG1, or was the 2009
    assignment an artefact, with the reported cis-Golgi disruption on knockdown an indirect
    consequence of ER expansion?
- question: >-
    What determines which ER-phagy receptor handles a given ER subdomain or cargo, when RETREG1,
    RETREG2, RETREG3, TEX264, CCPG1, SEC62, RTN3 and ATL3 are all present in the same cell?
- question: >-
    What switches the RHD off again, dephosphorylating Ser-149/Ser-151/Ser-153 once ER stress
    resolves, and is failure of that switch what makes the G216R variant pathogenic?
knowledge_gaps:
- gap_statement: >-
    The substrate range of RETREG1-mediated ER-phagy is unknown beyond bulk ER membrane and
    misfolded procollagen. It is not known whether RETREG1 reads any feature of the cargo itself,
    or whether cargo selection is entirely delegated to luminal co-receptors such as calnexin, in
    which case the set of co-receptors defines the substrate range and is itself uncharacterised.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  significance: >-
    Determines whether RETREG1 is a generic membrane-scission-plus-ATG8 module that any luminal
    receptor can recruit, or a receptor with its own specificity. The answer changes how
    ER-phagy-based clearance of misfolded secretory proteins could be therapeutically targeted.
- gap_statement: >-
    How an oligomeric RHD array generates enough force to sever an ER tubule, and how many
    subunits are needed, is not known; the in vitro assay shows fragmentation but not the
    geometry or stoichiometry of the scissioning species.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  significance: >-
    A quantitative model of the scission step would explain why G216R hyper-oligomerisation is
    pathogenic and would predict which other HSAN2B variants are gain rather than loss of
    function, which currently cannot be read off the sequence.
suggested_experiments:
- hypothesis: >-
    Endogenous human RETREG1 is an ER-resident protein with no steady-state cis-Golgi pool, and
    the reported cis-Golgi phenotype of knockdown is indirect.
  description: >-
    Image endogenous RETREG1 in a human cell line with validated antibodies or a knock-in
    endogenous tag, co-staining for an ER marker (calnexin or SEC61B) and a cis-Golgi marker
    (GM130/GOLGA2), and quantify colocalisation; in parallel, fractionate and blot for RETREG1
    across ER and Golgi fractions. Repeat in a nocodazole-dispersed-Golgi condition to break
    juxtanuclear overlap. This would settle whether the Golgi and cis-Golgi annotations describe a
    real compartment.
- hypothesis: >-
    The RHD membrane-bending activity and the LIR adaptor activity are separable, and each is
    sufficient for a distinct subset of RETREG1 functions.
  description: >-
    Reconstitute purified wild-type, LIR-dead (FELL-to-AELA) and oligomerisation-impaired
    (S149A/S151A/S153A) RETREG1 into giant unilamellar vesicles and measure membrane tubulation and
    fission by fluorescence microscopy, alongside ATG8 recruitment to the same vesicles. Then
    rescue RETREG1-null cells with each variant and score ER morphology, bulk ER-phagy flux and
    procollagen clearance separately, to establish which readouts need bending, which need ATG8
    binding, and which need both.
- hypothesis: >-
    Cargo selection by RETREG1 is delegated to luminal co-receptors, so the set of co-receptors,
    not RETREG1, defines its substrate range.
  description: >-
    Perform proximity labelling (TurboID or APEX2) from the luminal and the cytosolic face of
    endogenously tagged RETREG1 in cells under basal conditions, ER stress and a procollagen
    misfolding challenge, and compare the luminal interactomes. Validate candidate co-receptors by
    testing whether their loss phenocopies RETREG1 loss for a specific cargo while leaving bulk
    ER-phagy intact.
