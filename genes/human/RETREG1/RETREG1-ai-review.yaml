- id: PMID:19838196
  title: Mutations in FAM134B, encoding a newly identified Golgi protein, cause severe
    sensory and autonomic neuropathy.
  findings:
  - statement: Loss-of-function mutations in FAM134B cause hereditary sensory and autonomic
      neuropathy type II, and knockdown kills dorsal root ganglion neurons, implicating the
      gene in long-term survival of nociceptive and autonomic neurons rather than in pain
      perception itself.
    supporting_text: This implicates FAM134B as critical in long-term survival of nociceptive
      and autonomic ganglion neurons.
    reference_section_type: ABSTRACT
  - statement: FAM134B was originally described as a cis-Golgi protein, and knockdown altered
      cis-Golgi structure; this is the sole primary source of every Golgi and cis-Golgi
      annotation on the gene.
    supporting_text: Fam134b knockdown results in structural alterations of the cis-Golgi
      compartment
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract-only in the cache. The disease gene identification is not in question. Its
      cis-Golgi localisation claim has not been reproduced by any later study and is the
      origin of the Golgi annotations this review marks over-annotated; the paper is not
      miscited, so DISPUTED would overstate the problem, which is one of subsequent
      reinterpretation rather than of the citation.
- id: PMID:26040720
  title: Regulation of endoplasmic reticulum turnover by selective autophagy.
  findings:
  - statement: The FAM134 reticulon family are ER-resident receptors that bind LC3 and GABARAP
      and drive ER degradation by autophagy; FAM134B knockdown expands the ER and
      overexpression fragments it and drives lysosomal delivery.
    supporting_text: members of the FAM134 reticulon protein family are ER-resident receptors
      that bind to autophagy modifiers LC3 and GABARAP, and facilitate ER degradation by
      autophagy
    reference_section_type: ABSTRACT
  - statement: HSAN2B-causing FAM134B mutants cannot act as ER-phagy receptors, tying the
      molecular activity to the human disease.
    supporting_text: Mutant FAM134B proteins that cause sensory neuropathy in humans are unable
      to act as ER-phagy receptors.
    reference_section_type: ABSTRACT
  - statement: Fam134b knockout mice show ER expansion, blocked ER turnover, sensitisation to
      stress-induced apoptosis and sensory neuron degeneration.
    supporting_text: disruption of Fam134b in mice causes expansion of the ER, inhibits ER
      turnover, sensitizes cells to stress-induced apoptotic cell death and leads to degeneration
      of sensory neurons
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The founding ER-phagy paper and the source of the gene's ER membrane topology mapping,
      LIR mutagenesis and ATG8 interaction set. Abstract-only in the cache, so the curated
      UniProt features derived from it (TOPO_DOM, MOTIF 453-458, MUTAGEN 453-458) were used as
      the route to its full-text content rather than being second-guessed.
- id: PMID:30559329
  title: A selective ER-phagy exerts procollagen quality control via a Calnexin-FAM134B complex.
  findings:
  - statement: In collagen-producing human cells, calnexin recognises misfolded procollagen in
      the ER lumen and hands it to FAM134B, which binds LC3 and delivers the
      procollagen-containing ER portion to the lysosome.
    supporting_text: FAM134B binds the autophagosome membrane-associated protein LC3 and delivers
      a portion of ER containing both CANX and procollagen to the lysosome for degradation
    reference_section_type: ABSTRACT
  - statement: Loss of either CANX or FAM134B, by siRNA or CRISPR-Cas9, blocks autophagy-mediated
      quality control of endogenous procollagens.
    supporting_text: the ER-resident lectin chaperone Calnexin (CANX) and the ER-phagy receptor
      FAM134B are required for autophagy-mediated quality control of endogenous procollagens
    reference_section_type: ABSTRACT
  - statement: The two loss-of-function approaches are in different species, which the abstract's
      "siRNA interference, CRISPR-Cas9 or knockout-mediated gene deletion" does not separate.
      The FAM134B siRNA screen is in human Saos2 osteoblasts, while the FAM134B CRISPR-Cas9
      knockout is in mouse embryonic fibroblasts, where the procollagen-delivery defect is
      rescued by wild-type human FAM134B but not by a LIR-deleted mutant. The human receipt for
      a procollagen-cargo claim is therefore the Saos2 siRNA result.
    supporting_text: The impaired delivery of PC1 to lysosomes in CRISPR Fam134b MEFs was rescued
      by reintroducing WT human FAM134B, but not a FAM134B protein lacking the (LIR) motif
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text available in the cache (689 lines) and read for this review; title, authors and
      journal confirmed against PubMed. The human receipt for the procollagen cargo is the
      Saos2 siRNA screen, in which FAM134B silencing was the most effective of the autophagy
      and ER-phagy receptors tested; the CRISPR-Cas9 FAM134B knockout in the same paper is in
      mouse MEFs, rescued by wild-type human FAM134B but not the LIR mutant. This paper is not
      cited by human GOA for RETREG1 at all, so the procollagen-cargo claim is unannotated in
      human rather than declined by a curator; it is recorded here as a proposed new term
      because GO:0030574 collagen catabolic process is defined over extracellular-matrix
      collagen and does not fit an ER-luminal client.
- id: PMID:31006538
  title: Intrinsically Disordered Protein TEX264 Mediates ER-phagy.
  findings:
  - statement: A differential LC3B/LIR interactome screen identified TEX264 as the major ER-phagy
      receptor; ER-phagy is blocked by TEX264 deletion alone and almost completely when FAM134B
      and CCPG1 are also deleted, so RETREG1 contributes to a partially redundant receptor set.
    supporting_text: ER-phagy is profoundly blocked by deletion of TEX264 alone and almost
      completely by additional deletion of FAM134B and CCPG1
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      The title and abstract foreground TEX264, and the two GOA rows citing this paper for
      RETREG1 (a GABARAP IPI and a reticulophagy IMP) are therefore the kind of annotation that
      must not be challenged from the abstract alone. The abstract in fact confirms that
      FAM134B knockouts were made and assayed here, so both rows are consistent with what the
      paper reports.
- id: PMID:31930741
  title: FAM134B oligomerization drives endoplasmic reticulum membrane scission for
    ER-phagy.
  findings:
  - statement: RHD-mediated oligomerisation of FAM134B is required for membrane fragmentation in
      vitro and ER-phagy in cells, establishing a membrane-scission activity separable from LIR
      binding.
    supporting_text: oligomerization of ER-phagy receptor FAM134B (also referred to as
      reticulophagy regulator 1 or RETREG1) through its reticulon-homology domain is required for
      membrane fragmentation in vitro and ER-phagy in vivo
    reference_section_type: ABSTRACT
  - statement: ER stress activates CAMK2B, which phosphorylates the FAM134B RHD and enhances
      oligomerisation and membrane-fragmentation activity.
    supporting_text: Under ER-stress conditions, activated CAMK2B phosphorylates the
      reticulon-homology domain of FAM134B, which enhances FAM134B oligomerization and activity
      in membrane fragmentation
    reference_section_type: ABSTRACT
  - statement: The HSAN2B-derived variant G216R is a gain of function, hyper-oligomerising and
      hyper-scissioning, causing excessive ER-phagy and sensory neuron death; the pathway is
      therefore dosage-sensitive in both directions.
    supporting_text: FAM134B G216R, a variant derived from a type II hereditary sensory and
      autonomic neuropathy (HSAN) patient, exhibits gain-of-function defects, such as hyperactive
      self-association and membrane scission, which results in excessive ER-phagy and sensory
      neuron death
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract-only in the cache. Primary support for the proposed membrane bending activity and
      for the RHD phosphorylation PTMs that UniProt records from it.
- id: PMID:34338405
  title: Role of FAM134 paralogues in endoplasmic reticulum remodeling, ER-phagy,
    and Collagen quality control.
  findings:
  - statement: All three FAM134 paralogues, including FAM134B/RETREG1, are required to maintain ER
      morphology, and the requirement depends on the LIR motif.
    supporting_text: FAM134A, FAM134B/RETREG1, and FAM134C are essential for maintaining ER
      morphology in a LC3-interacting region (LIR)-dependent manner
    reference_section_type: ABSTRACT
  - statement: Pro-collagen I is a shared ER-phagy substrate of the paralogues, with FAM134A able
      to compensate for loss of FAM134B in a LIR-independent manner.
    supporting_text: Utilizing pro-Collagen I, as a shared ER-phagy substrate, we observe that
      FAM134A acts in a LIR-independent manner and compensates for the loss of FAM134B and
      FAM134C
    reference_section_type: ABSTRACT
  - statement: The field treats FAM134B as an intra-membrane ER-resident protein with an RHD and a
      LIR, with no role for a Golgi pool.
    supporting_text: FAM134B has been classified as an intra-membrane ER-resident protein that
      harbors a reticulon homology domain (RHD) and a LIR sequence
    reference_section_type: INTRODUCTION
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text available in the cache and read for this review. Establishes the paralogue
      division of labour and the LIR-dependence of the ER-morphology requirement, and
      corroborates the proposed GO:0090158 row - but it does not anchor it, because its
      ER-morphology data are electron microscopy and immunofluorescence of Fam134 single
      knockout MEFs (mouse) and for Fam134b it refers back to PMID:26040720, which is where the
      human knockdown evidence lives. This is also the paper MGI used to annotate mouse Retreg1
      (Q8VE91) to GO:0007029 endoplasmic reticulum organization and GO:0030574 collagen
      catabolic process, both IMP with the hedged acts_upstream_of_or_within qualifier
      (assigned_by MGI, 2021-12-08; QuickGO, retrieved 2026-11-24).
- id: PMID:34854256
  title: The crystal structure of the FAM134B-GABARAP complex provides mechanistic
    insights into the selective binding of FAM134 to the GABARAP subfamily.
  findings:
  - statement: FAM134B binds the GABARAP subfamily more strongly than the LC3 subfamily, using
