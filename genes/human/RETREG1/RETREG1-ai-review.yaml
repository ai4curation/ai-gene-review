- id: Reactome:R-HSA-9921595
  title: NS2B3 cleaves FAM134B
  findings:
  - statement: The dengue virus NS2B3 protease cleaves RETREG1 to block its oligomerisation and
      prevent formation of ER- and viral-protein-enriched autophagosomes, placing RETREG1 in the
