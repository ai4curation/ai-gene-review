        position directly. The reported cis-Golgi disruption on knockdown is also consistent
        with an indirect consequence of ER expansion rather than with a resident Golgi pool.
        This is a request to re-examine the by-similarity location, not an assertion that it is
        false - no study has tested and excluded a Golgi pool for the human protein, and the
        mouse source is a genuine IDA. Mapping this location to GO is the source of the two
