    supporting_text: SARS-CoV-2 ORF3a hijacks reticulophagy and then disrupts ER homeostasis
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Abstract-only in the cache. Used here only for the ER and ER-membrane localisation rows
