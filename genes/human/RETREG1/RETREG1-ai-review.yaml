gene_symbol: RETREG1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  RETREG1 (reticulophagy regulator 1; also known as FAM134B) is the founding
  mammalian receptor for selective autophagy of the endoplasmic reticulum
  (ER-phagy/reticulophagy) and one of three paralogues in the FAM134/RETREG
  family (RETREG1/FAM134B, RETREG2/FAM134A, RETREG3/FAM134C). It is a multi-pass
  ER membrane protein with four transmembrane helices; the reticulon-homology
  domain (RHD, residues 84-233) spans the last three of them and inserts into the
  bilayer to bend it, while a large cytosolic
  C-terminal tail carries a LIR motif (DDFELL, residues 453-458) that binds
  ATG8-family proteins with a preference for the GABARAP subfamily over LC3.
  These two activities make RETREG1 both the membrane remodeller and the cargo
  receptor of the same step: the RHD oligomerises and fragments ER membrane,
  while the LIR tethers the resulting fragments to the forming autophagosome so
  that they are delivered to the lysosome. The activity is tuned by ER stress,
  through CAMK2B phosphorylation of the RHD, which promotes oligomerisation and
  scission. Cargo is not limited to bulk ER: misfolded procollagen is recognised
  in the ER lumen by the lectin chaperone calnexin and handed to RETREG1 for
  autophagic disposal, making RETREG1 part of a secretory-protein
  quality-control route. Through this turnover RETREG1 sets steady-state ER
  morphology, and both its loss and its hyperactivation kill sensory neurons:
  biallelic loss-of-function mutations cause hereditary sensory and autonomic
  neuropathy type 2B, while the HSAN2B variant G216R hyper-oligomerises and
  drives excessive ER-phagy. RETREG1 is also a focus of viral manipulation,
  being activated by SARS-CoV-2 ORF3a and cleaved by the dengue virus NS2B3
  protease.
