- term:
    id: GO:0019233
    label: sensory perception of pain
  evidence_type: IMP
  original_reference_id: PMID:19838196
  qualifier: involved_in
  review:
    summary: >-
      Annotated from HSAN2B, in which biallelic loss of FAM134B causes impaired nociception.
      The phenotype is real, but it arises from degeneration of the neurons that sense pain.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      RETREG1 performs no step of sensory perception: it has no role in transduction,
      conduction or central processing of a noxious stimulus. What the paper shows is that
      losing it kills nociceptive and autonomic ganglion neurons, which is captured by
      GO:0043524 and is kept as non-core in this review. Annotating the organism-level
      sensory deficit to the gene conflates a disease consequence with participation. Not
      REMOVE, because the human genetic evidence is solid and the term is a defensible, if
      over-reaching, curatorial summary of it.
    supported_by:
    - reference_id: PMID:19838196
      supporting_text: This implicates FAM134B as critical in long-term survival of nociceptive
        and autonomic ganglion neurons.
      reference_section_type: ABSTRACT
