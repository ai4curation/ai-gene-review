core_functions:
- description: >-
    Acts as the ER-membrane receptor for selective autophagy of the ER: its cytosolic LIR motif
    (DDFELL, 453-458) binds ATG8-family proteins on the forming autophagosome, with a preference
    for the GABARAP subfamily, thereby bridging the ER membrane to the autophagosomal membrane so
    that ER fragments are sequestered and delivered to the lysosome. Cargo includes bulk ER under
    basal and stress conditions and, via the luminal co-receptor calnexin, misfolded procollagen.
  molecular_function:
    id: GO:0140506
    label: endoplasmic reticulum-autophagosome adaptor activity
  supported_by:
  - reference_id: file:human/RETREG1/RETREG1-uniprot.txt
    record_section: ["CC:DOMAIN"]
    supporting_text: The LIR motif interacts with ATG8 family proteins and is necessary to target
      the ER fragments to autophagosomes for subsequent lysosomal degradation.
  - reference_id: PMID:26040720
    supporting_text: Mutant FAM134B proteins that cause sensory neuropathy in humans are unable to
      act as ER-phagy receptors.
    reference_section_type: ABSTRACT
  - reference_id: PMID:34854256
    supporting_text: demonstrated that FAM134B used both its LIR core and the C-terminal helix to
      bind to GABARAP
    reference_section_type: ABSTRACT
  locations:
  - id: GO:0005789
    label: endoplasmic reticulum membrane
  directly_involved_in:
  - id: GO:0061709
    label: reticulophagy
  - id: GO:0090158
    label: endoplasmic reticulum membrane organization
- description: >-
    Deforms and severs the ER membrane. The transmembrane helices of the reticulon-homology
    domain (84-233, comprising the second, third and fourth of the protein's four helices)
    insert into the bilayer and generate curvature; RHD-mediated homo-oligomerisation,
    enhanced by CAMK2B phosphorylation of Ser-151 and neighbouring residues under ER stress, drives
    membrane fragmentation. This activity supplies the ER fragments that the LIR then hands to the
    autophagosome, and it sets steady-state ER morphology.
