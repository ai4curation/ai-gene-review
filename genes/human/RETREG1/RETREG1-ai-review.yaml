- term:
    id: GO:0090158
    label: endoplasmic reticulum membrane organization
  evidence_type: IMP
  original_reference_id: PMID:26040720
  qualifier: involved_in
  review:
    summary: >-
      RETREG1 is required to maintain ER morphology: in human cells its knockdown expands the
      ER network and its overexpression fragments it. The paralogue study adds that the
      requirement is shared across FAM134A/B/C and is LIR-dependent, but its ER-morphology
      experiments are mouse single-knockout MEFs, so the human receipt is the knockdown.
    action: NEW
    reason: >-
      Anchored on PMID:26040720, which is the human loss-of-function evidence ("Downregulation
      of FAM134B protein in human cells causes an expansion of the ER"); PMID:34338405 is cited
      here as corroboration only, because its ER-morphology work is electron microscopy of
      Fam134 single-knockout MEFs and for Fam134b specifically it refers back to
      PMID:26040720 ("This phenotype was also found in Fam134b knockout cells (Fig 6A)
      (Khaminets et al, 2015)"). The comparator check is positive rather than negative: the
      other ER-shaping proteins carry GO:0090158 in human (ARL6IP1 IDA PMID:24262037, ATL3 IDA
      PMID:37102997 and IMP PMID:27619977, ATL1/ATL2/RTN4 IMP, RTN1/RTN2/RTN3 IBA, REEP5 ISS;
      QuickGO annotation search for GO:0090158 restricted to taxon 9606, 74 rows, retrieved
      2026-11-24), and MGI annotates the mouse ortholog Q8VE91 to the parent GO:0007029 from
      PMID:34338405 (IMP, acts_upstream_of_or_within, assigned_by MGI, 2021-12-08). RETREG1
      does the work of the process itself rather than merely being required for it: the RHD
      oligomerises, bends and severs ER membrane in a reconstituted assay, which is a direct
      contribution to ER membrane organisation and not a downstream consequence of losing the
      protein. The LIR-dependence of the morphology phenotype does not cut against this. ER
      membrane is removed from the network by being fragmented and then handed to the
      autophagosome, so both halves of the receptor contribute to the steady-state shape of
      the ER: the RHD supplies the scission and the LIR commits the fragment to degradation.
      That is why GO:0090158 is attached to both core functions rather than to the
      membrane-bending one alone. GO:0090158 is preferred over the parent GO:0007029 because
      the activity acts on the ER membrane specifically, and it is the level the comparable
      membrane-shaping proteins are annotated at.
    supported_by:
    - reference_id: PMID:26040720
      supporting_text: Downregulation of FAM134B protein in human cells causes an expansion of
        the ER
      reference_section_type: ABSTRACT
    - reference_id: PMID:31930741
      supporting_text: oligomerization of ER-phagy receptor FAM134B (also referred to as
        reticulophagy regulator 1 or RETREG1) through its reticulon-homology domain is required
        for membrane fragmentation in vitro and ER-phagy in vivo
      reference_section_type: ABSTRACT
    - reference_id: PMID:34338405
      supporting_text: FAM134A, FAM134B/RETREG1, and FAM134C are essential for maintaining ER
        morphology in a LC3-interacting region (LIR)-dependent manner
      reference_section_type: ABSTRACT
    - reference_id: PMID:34338405
      supporting_text: we subjected Fam134 single knockout MEFs to electron microscopy analysis
      reference_section_type: RESULTS
