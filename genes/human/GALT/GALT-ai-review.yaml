- term:
    id: GO:0008270
    label: zinc ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: >-
      Structural zinc binding. The human GALT crystal structure shows a divalent
      metal site per monomer that prefers zinc and confers stability; this
      InterPro-based IEA is consistent with the experimental (IDA) zinc
      annotation. The site is distinct from the active site, so this is a
      structural rather than catalytic function.
    action: KEEP_AS_NON_CORE
    reason: >-
      Zinc binding is experimentally confirmed for human GALT and corroborated
      by the structure, but serves a structural/stability role separate from the
      core catalytic uridylyltransferase activity.
