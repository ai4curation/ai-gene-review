      uridylyltransferase is not studied. The GALT annotation is therefore a
      symbol collision with B4GALT1 (UniProtKB:P15291), recorded below as a
      source defect. Nothing else places GALT in the Golgi: the human enzyme is
      a soluble cytosolic homodimer. These quotations are not in the cached
      abstract, so they are given here rather than as supporting_text.
