    action: REMOVE
    reason: >-
      The cached record is abstract-only, but the publisher full text
      (https://journals.biologists.com/jcs/article/123/15/2649/31141/The-Lyn-kinase-C-lobe-mediates-Golgi-export-of-Lyn)
      was checked. GalT is defined there as the Golgi marker
      beta-1,4-galactosyltransferase ("ACSL3 was seen with the Golgi caveolin
      and beta-1,4-galactosyltransferase (GalT) where Lyn accumulated") and is
      used with GM130 as a Golgi-resident reference ("knockdown of ACSL3 did not
