        supporting_text: >-
          GALT (EC 2.7.7.12) reversibly converts galactose 1-phosphate (Gal-1-P)
          and UDP glucose (UDP-Glc) into glucose 1-phosphate (Glc-1-P) and UDP
          galactose (UDP-Gal)
