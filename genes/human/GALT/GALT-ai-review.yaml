  qualifier: is_active_in
  review:
    summary: >-
      GALT is a soluble cytosolic metabolic enzyme. The IBA cytoplasm call is
      correct but less specific than the cytosol term (GO:0005829, part_of
      cytoplasm) that GALT already carries from Reactome.
    action: MODIFY
    reason: >-
      Correct but general. GALT has no signal peptide, transmembrane segment or
      organelle-targeting sequence, the human enzyme is purified and
      crystallised as a soluble homodimer, and Reactome places both the normal
      and the defective GALT reactions in the cytosol. Cytosol is a part_of
      descendant of cytoplasm already carried by the gene, so the row is
      refined to it rather than kept at cytoplasm.
