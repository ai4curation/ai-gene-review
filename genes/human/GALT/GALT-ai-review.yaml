- term:
    id: GO:0006011
    label: UDP-alpha-D-glucose metabolic process
  evidence_type: IDA
  original_reference_id: PMID:27005423
  qualifier: involved_in
  review:
    summary: >-
      GALT consumes UDP-alpha-D-glucose as the uridylyl donor and regenerates it
      as part of the Leloir cycle, so it participates in UDP-glucose metabolism.
      Supported by the structure showing the UDP-glucose-derived covalent UMP
