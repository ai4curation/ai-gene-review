    label: positive regulation of DNA replication
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-69656
  qualifier: involved_in
  review:
    action: MODIFY
    summary: 'Wrong direction: WEE1 restrains, rather than promotes, DNA replication initiation.'
    reason: The Reactome pathway mapped to this term (Cyclin A:Cdk2-associated events at S phase entry) includes
      WEE1 only as the kinase that inhibits Cyclin A:CDK2 through Tyr15 phosphorylation. Direct human-cell evidence
      shows that loss of WEE1 activity increases replication initiation, causing replication stress. The sign of
      the annotation should be corrected to negative regulation of DNA replication initiation.
    supported_by:
    - reference_id: Reactome:R-HSA-69656
      supporting_text: Prior to S phase entry, the activity of Cyclin A:Cdk2 complexes is negatively regulated through
        Tyr 15 phosphorylation of  Cdk2
    - &id010
      reference_id: PMID:22907750
      supporting_text: elevation of CDK activity by inhibition of WEE1 kinase rapidly increases initiation of replication
    - &id011
      reference_id: PMID:20194642
      supporting_text: WEE1 depletion rapidly induced DNA damage in S phase in newly replicated DNA
    proposed_replacement_terms:
    - id: GO:0032297
      label: negative regulation of DNA-templated DNA replication initiation
