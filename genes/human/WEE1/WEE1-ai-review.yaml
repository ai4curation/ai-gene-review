- term:
    id: GO:0004713
    label: protein tyrosine kinase activity
  evidence_type: EXP
  original_reference_id: PMID:8348613
  qualifier: enables
  review:
    action: ACCEPT
    summary: WEE1 phosphorylates the inhibitory Tyr15 of cyclin-bound CDKs.
    reason: Purified human WEE1 phosphorylates cyclin-bound CDK1 on Tyr15 but not Thr14, endogenous WEE1 phosphorylates
      several cyclin-associated CDKs on Tyr15, and a Lys114 (ATP-site lysine) mutant loses both kinase and mitotic-inhibitor
      activity. Antibody depletion shows WEE1 supplies most CDK1-Tyr15 kinase activity in HeLa lysates. The structural
      resemblance of the WEE1 kinase domain to Ser/Thr kinases does not change its demonstrated tyrosine specificity.
      The IBA is placed at PTN008510964, seeded by human WEE1, Drosophila Wee1 and Xenopus Wee2-A; human WEE1 is
      a descendant and has its own direct evidence, so the inheritance is sound.
    supported_by:
    - *id001
    - &id003
      reference_id: PMID:7743995
      supporting_text: the endogenous WEE1Hu phosphorylated several cyclin-associated CDKs on Y15
    - &id004
      reference_id: PMID:8428596
      supporting_text: Mutation of a critical lysine codon (Lys114) believed to be essential for kinase activity
        abolished both the in vivo mitotic inhibitor function
    - &id005
      reference_id: PMID:7774574
      supporting_text: Antibody depletion experiments demonstrate that WEE1 accounts for most of the activity that
        phosphorylates CDC2 on Tyr15 in an in vitro assay of HeLa cell lysates
