  review:
    action: MARK_AS_OVER_ANNOTATED
    summary: Cytoplasmic activity is a family-level inference not borne out for WEE1.
    reason: The IBA comes from the PTHR11042 root node PTN000113601, whose cytoplasm seeds are dominated by eIF2-alpha
      kinases, PKMYT1 and other members; human WEE1 is not among the cytoplasm seeds although it seeds the nucleus
      assertion at the same node. The Ensembl Compara IEA is a projection from mouse Wee1. Human WEE1 is experimentally
      nuclear, and its defining function is to oppose CDK1 that is activated in the cytoplasm from inside the nucleus.
      A transient cytoplasmic pool (e.g. during synthesis) is not excluded, but 'active in cytoplasm' over-states
      the evidence.
