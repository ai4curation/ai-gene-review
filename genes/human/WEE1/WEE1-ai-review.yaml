id: P30291
gene_symbol: WEE1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: WEE1 (Wee1A) is a predominantly nuclear, non-receptor protein tyrosine kinase that inhibits cyclin-dependent
  kinases by phosphorylating their inhibitory Tyr15 residue, most prominently CDK1 bound to cyclin B1, and also
  CDK2 complexes; it does not phosphorylate the adjacent Thr14, which is the province of the related kinase PKMYT1.
  By holding CDK1 inactive through S and G2 phase, WEE1 delays mitotic entry until DNA replication is complete and
  supports the DNA-damage G2 delay; by restraining CDK2 during S phase it limits replication-origin firing and protects
  ongoing replication. WEE1 also phosphorylates histone H2B Tyr37 in late S phase, linked to repression of replication-dependent
  histone genes. The kinase domain is structurally closest to Ser/Thr kinases despite its tyrosine specificity.
  WEE1 activity rises in S/G2 and is switched off at mitosis by CDK1 and PLK1 phosphorylation, which creates phosphodegrons
  recognised by SCF(beta-TrCP) for ubiquitin-dependent degradation. WEE1 is distinct from the oocyte-enriched paralog
  WEE2 (Wee1B).
