id: P30291
gene_symbol: WEE1
product_type: PROTEIN
status: IN_PROGRESS
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: WEE1 is a predominantly nuclear protein tyrosine kinase that inhibits cyclin-dependent kinases
  by phosphorylating their inhibitory tyrosine residue, especially CDK1 Tyr15. It restrains mitotic entry
  until DNA replication is complete and participates in replication and DNA-damage checkpoints. Its activity
  and abundance are controlled by phosphorylation, binding partners and ubiquitin-dependent degradation.
  WEE1 is distinct from the oocyte-enriched paralog WEE2.
