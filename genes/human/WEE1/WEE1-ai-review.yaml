  qualifier: involved_in
  review:
    action: UNDECIDED
    summary: The positive DNA-replication regulation assignment needs reaction-context tracing.
    reason: WEE1 permits completion of replication by restraining CDKs and preventing premature mitosis;
      that does not by itself establish a direct positive regulator of replication initiation or synthesis.
      Inspect the cited Reactome event and its primary mechanistic basis before choosing the process term.
    supported_by:
    - *id007
    - *id003
- term:
    id: GO:2000134
    label: negative regulation of G1/S transition of mitotic cell cycle
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-69195
  qualifier: involved_in
  review:
    action: KEEP_AS_NON_CORE
    summary: WEE1 also restrains cell-cycle CDK activity outside mitotic entry.
    reason: The broad CDK-inhibitory role is consistent with G1/S control, while its core checkpoint assignment
      is negative G2/M regulation. Retain the curated pathway assertion as an additional context.
    supported_by:
    - *id003
