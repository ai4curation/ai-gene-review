suggested_questions:
- question: Should the histone H2B Tyr37 kinase activity of WEE1 (PMID:22885324) be captured as a regulation-of-histone-gene-transcription
    process, and is it conserved beyond the yeast and mammalian systems tested?
- question: Is the HPA nucleolar signal for WEE1 reproducible with independent antibodies, given that transfected
    WEE1 was reported to be excluded from nucleoli?
suggested_experiments:
- description: Endogenous tagging of WEE1 with live imaging through S and G2 to test for nucleolar or cytoplasmic
    pools, combined with a kinase-dead knock-in to separate localization from catalytic activity.
