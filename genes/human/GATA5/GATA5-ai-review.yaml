    label: heart induction
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P97489
  - ensembl:ENSMUSP00000015771
  review:
    summary: Keep the mouse-derived cardiac induction context as non-core.
    action: KEEP_AS_NON_CORE
    reason: Mouse Gata5 supports this ortholog transfer, and the GATA5 clade has a 
      dedicated PAINT cardiac-development assertion. Human BAV and 
      congenital-heart-disease variants support a conserved cardiac developmental role 
      without making heart induction the sole core function of this pleiotropic 
      transcription factor.
    supported_by:
    - reference_id: GO_REF:0000107
    - reference_id: GO_REF:0000024
    - reference_id: GO_REF:0000033
    - reference_id: PMID:24638895
