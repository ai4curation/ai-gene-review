core_functions:
- description: Nuclear GATA5 binds GATA motifs in cis-regulatory DNA and activates RNA
    polymerase II transcriptional programs. Human GATA5 directly activates 
    gastrointestinal mucin promoters in cultured cells and belongs to the conserved
    metazoan GATA lineage whose DNA-binding transcription factors steer cell-fate
    decisions.
  molecular_function:
    id: GO:0000981
    label: DNA-binding transcription factor activity, RNA polymerase II-specific
  directly_involved_in:
  - id: GO:0045944
    label: positive regulation of transcription by RNA polymerase II
  - id: GO:0045165
    label: cell fate commitment
  locations:
  - id: GO:0005634
    label: nucleus
  - id: GO:0000785
    label: chromatin
  supported_by:
  - reference_id: PMID:14986113
    supporting_text: GATA-5 was found to activate the promoters of the human MUC2 and 
      MUC4 genes
  - reference_id: PMID:9566909
    supporting_text: Upon stimulation to differentiate, the transcript levels for hGATA-5
      increase
suggested_questions:
- question: Which direct human GATA5 target genes execute its aortic-valve and 
    congenital-heart-development roles?
- question: Do ZFPM1/FOG-1 or ZFPM2/FOG-2 bind endogenous human GATA5 in cardiac or 
    intestinal cells, and does that interaction mediate repression or activation at 
    specific GATA5 targets?
suggested_experiments:
- description: Perform GATA5 CUT&RUN or ChIP-seq plus RNA-seq after acute GATA5 
    perturbation in human iPSC-derived endocardial cushion or cardiomyocyte models.
  experiment_type: functional genomics
  hypothesis: Direct GATA5 occupancy at cardiac enhancers controls the transcript 
    changes that underlie aortic-valve and cardiac morphogenesis phenotypes.
- description: Rescue GATA5-null differentiating intestinal epithelial cells with 
    wild-type, zinc-finger mutant, and BAV-associated GATA5 alleles, then assay mucin 
    and IFABP-family target expression.
  experiment_type: rescue assay
  hypothesis: GATA5 DNA binding is required for the intestinal differentiation program 
    inferred from vertebrate promoter and HT-29 expression assays.
