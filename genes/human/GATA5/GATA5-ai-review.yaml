id: Q9BWX5
gene_symbol: GATA5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'GATA5 is a nuclear GATA zinc-finger transcription factor that binds GATA cis-regulatory
  DNA and regulates RNA polymerase II target genes. It belongs to the GATA4/5/6 developmental
  branch and contributes to cardiogenic and endoderm-derived epithelial transcriptional programs;
  human variants that reduce GATA5 transactivation are associated with congenital cardiac
  valve and septation defects.'
