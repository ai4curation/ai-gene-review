  review:
    summary: Retain conserved Pol II DNA-binding transcription-factor activity.
    action: ACCEPT
    reason: The PTHR10071 root node PTN001600628 carries the Pol II DNA-binding 
      transcription-factor activity IBD inherited by all six human GATA factors, 
      including GATA5 at PTN002467693. Human GATA5 activated MUC2 and MUC4 reporter 
      promoters in a zinc-finger-dependent assay, corroborating this inherited molecular
      function.
    supported_by:
    - reference_id: GO_REF:0000033
    - reference_id: PMID:14986113
      supporting_text: GATA-5 was found to activate the promoters of the human MUC2 and MUC4 genes
