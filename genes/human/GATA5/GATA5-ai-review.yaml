  review:
    summary: Retain conserved GATA-family Pol II repression.
    action: ACCEPT
    reason: The actual PTHR10071 tree places human GATA5 at leaf PTN002467693 below the 
      root PTN001600628 IBD. GATA family members are sequence-specific Pol II 
      transcription factors with both activating and repressing outputs; GATA5 also 
      participates in the Reactome nucleoplasmic GATA/ZFPM cofactor event whose FOG 
      proteins can recruit repressive CtBP complexes.
    supported_by:
    - reference_id: GO_REF:0000033
    - reference_id: Reactome:R-HSA-996755
