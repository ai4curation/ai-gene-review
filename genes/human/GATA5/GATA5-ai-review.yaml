      Gata5 ortholog plus TFClass chromatin assertions are consistent with GATA5 binding
      regulatory DNA in a chromatin context. This is the chromatin-bound surface of the 
      same Pol II cis-regulatory function supported by the accepted molecular-function 
      rows.
