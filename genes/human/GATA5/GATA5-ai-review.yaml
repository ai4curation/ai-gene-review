  review:
    summary: Retain aortic valve morphogenesis as a human cardiac disease context.
    action: KEEP_AS_NON_CORE
    reason: Human GATA5 variants are associated with bicuspid aortic valve, and Shi et 
      al. showed reduced transcriptional activity for two familial BAV variants. The row
      is retained as a non-core aortic-valve context of GATA5-dependent cardiac 
      transcription, with the Padang et al. association treated as supportive variant 
      evidence rather than a direct morphogenesis assay from the cached abstract alone.
    supported_by:
    - reference_id: PMID:22641149
    - reference_id: PMID:24638895
