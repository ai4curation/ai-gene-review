    label: photoreceptor cell
  - id: UBERON:0000966
    label: retina
  supported_by:
  - reference_id: PMID:31637240
    supporting_text: >-
      Our study demonstrated direct binding of IFT complex B proteins IFT52 and IFT57 to
      the N-terminal ankyrin repeats and the central domain of SANS.
  - reference_id: PMID:31637240
    supporting_text: >-
      Analysis of photoreceptor cells of SANS knock out mice revealed the decrease of
      IFTs in the ciliary compartment indicating a role of SANS in the proper positioning
      of IFT-B molecules in primary cilia.
  - reference_id: PMID:24608321
    supporting_text: >-
      we demonstrated the localization of the SANS-Magi2 complex in the periciliary
      membrane complex facing the ciliary pocket of retinal photoreceptor cells in situ
  - reference_id: PMID:24608321
    supporting_text: >-
      We showed that the SANS-Magi2 complex assembly is regulated by the phosphorylation
