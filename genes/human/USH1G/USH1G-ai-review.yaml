- term:
    id: GO:1990435
    label: upper tip-link density
  evidence_type: ISS
  original_reference_id: PMID:21709241
  qualifier: located_in
  review:
    summary: >-
      Proposed new cellular component. The upper tip-link density is the electron-dense
      plaque that anchors the cadherin-23 end of the stereociliary tip link in the mature
      hair bundle. Grati and Kachar showed by immunofluorescence, and confirmed by
      expression of GFP-tagged constructs in hair cells, that SANS and MYO7A cluster
      precisely there, and that SANS, MYO7A and harmonin-b form a tripartite complex that
      constitutes the core of the UTLD [PMID:21709241]. UniProt cites the same study for
      SANS FUNCTION and for identification in a complex with MYO7A and USH1C.
    action: NEW
    reason: >-
      This is the single most informative cellular component for the auditory and vestibular
      arm of SANS function and it is entirely absent from GOA, which offers only 'plasma
      membrane' and 'actin cytoskeleton' for this compartment. Adding it distinguishes the
      tension-bearing complex of the mature bundle from the transient developmental
      complexes and gives the hearing/equilibrioception process annotations a concrete
      structural anchor. The localisation was determined in rodent hair cells with tagged
      constructs while human evidence is genetic, so ISS is recorded as the evidence code
      for the human gene (matching the treatment of the same study in the MYO7A review).
    supported_by:
    - reference_id: PMID:21709241
      supporting_text: >-
        Using immunofluorescence, we now show that MYO7A and sans, a MYO7A-interacting
        protein, cluster at the UTLD.
    - reference_id: PMID:21709241
      supporting_text: >-
        MYO7A and sans localization at the UTLD is confirmed by transfection of hair cells
        with GFP-tagged constructs for these proteins.
    - reference_id: PMID:21709241
      supporting_text: >-
        We propose that MYO7A, sans, and harmonin-b form the core components of the UTLD
        molecular complex.
- term:
    id: GO:0030674
    label: protein-macromolecule adaptor activity
  evidence_type: IDA
  original_reference_id: PMID:21709241
  qualifier: enables
  review:
    summary: >-
      Proposed new molecular function. GOA currently gives USH1G no informative molecular
      function at all: twelve rows of 'protein binding', one 'identical protein binding' and
      one 'spectrin binding'. Yet the molecular role of SANS is well defined - it is the
      adaptor that physically bridges harmonin/USH1C and myosin VIIa within the upper
      tip-link density complex, using a bipartite SAM/PDZ-binding-motif interface for
      harmonin [PMID:20142502] and its central region for the MYO7A MyTH4-FERM cassette. The
      same adaptor logic recruits IFT-B proteins through the ankyrin repeats
      [PMID:31637240], MAGI2 through the phosphorylated SAM domain [PMID:24608321] and PDZD7
      [PMID:19028668].
    action: NEW
    reason: >-
      Replaces a wall of uninformative GO:0005515 rows with the function those interactions
      collectively define. GO:0030674 is the appropriate level: SANS has no catalytic,
      transport or motor activity of its own, and its contribution is to hold two or more
      macromolecules in a functional spatial relationship - here holding the MYO7A motor
      against the harmonin/CDH23 anchor so that resting tension can be applied to the tip
      link.
    supported_by:
    - reference_id: PMID:21709241
      supporting_text: >-
        Cotransfection studies in a heterologous system show that MYO7A, sans, and the UTLD
        protein harmonin-b form a tripartite complex and that each protein is capable of
        interacting with one another independently.
    - reference_id: PMID:21709241
      supporting_text: >-
        In this complex, MYO7A is likely the motor element that pulls on CDH23 to exert
        tension on the tip-link.
    - reference_id: PMID:20142502
      supporting_text: >-
        We further show that the synergistic PDZ1/SAM and PDZ1/carboxyl PDZ binding-motif
        interactions, between harmonin and Sans, lock the two scaffold proteins into a
        highly stable complex.
- term:
    id: GO:0048024
    label: regulation of mRNA splicing, via spliceosome
  evidence_type: IMP
  original_reference_id: PMID:34023904
  qualifier: involved_in
  review:
    summary: >-
      Proposed new biological process. GOA carries the two nuclear cellular components from
      PMID:34023904 (Cajal body, nuclear speck) but no process term for splicing, even
      though UniProt now names the protein 'pre-mRNA splicing regulator USH1G' on the
      strength of the same study. SANS depletion blocks transfer of U4/U6.U5 tri-snRNPs
      from Cajal bodies to speckles, alters the kinetics of spliceosome assembly with
      accumulation of complex A, and changes constitutive and alternative splicing of
      proliferation- and Usher-related transcripts; the USH1G variant p.Met104Val fails to
      rescue the USH1C splicing defect in SANS-depleted cells (UniProt VARIANT,
      ECO:0000269|PubMed:31637240).
    action: NEW
    reason: >-
      A clear gap: the process underlying the protein's current recommended name is
      unannotated. The regulation term is preferred over GO:0000398 'mRNA splicing, via
      spliceosome' because SANS is not a spliceosomal catalytic component - it is a carrier
      or assembly factor that controls the availability of tri-snRNPs, and the authors are
      explicit that it does not catalyse the splicing reaction itself.
    supported_by:
    - reference_id: PMID:34023904
      supporting_text: >-
        SANS is required for the transfer of tri-snRNPs between Cajal bodies and nuclear
        speckles for spliceosome assembly and may also participate in snRNP recycling back
        to Cajal bodies.
    - reference_id: PMID:34023904
      supporting_text: >-
        SANS depletion alters the kinetics of spliceosome assembly, leading to accumulation
        of complex A.
    - reference_id: PMID:34023904
      supporting_text: >-
        SANS deficiency and USH1G pathogenic mutations affects splicing of genes related to
        cell proliferation and human Usher syndrome.
