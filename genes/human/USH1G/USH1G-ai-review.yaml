      term are acceptable.
- term:
    id: GO:0005813
    label: centrosome
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  review:
    summary: >-
      Derived from the UniProt subcellular-location statement 'Cytoplasm, cytoskeleton,
      microtubule organizing center, centrosome', itself an ECO:0000250 transfer from
      mouse Q80T11 ('Expressed in the pericentriolar region of the centrosome'). It is
      consistent with the ciliary-base/basal-body localisation of SANS in photoreceptors
      [PMID:31637240] and with its microtubule association.
    action: ACCEPT
    reason: >-
      Biologically coherent with the independently annotated ciliary base (GO:0097546,
      IDA) and ciliary basal body (GO:0036064, IEA) terms - the basal body is a modified
      centriole - so this is a real, if indirect, localisation rather than an artefact.
    supported_by:
    - reference_id: PMID:31637240
      supporting_text: >-
        Moreover, SANS is associated with microtubules, the transport routes for protein
        delivery toward the cilium.
- term:
    id: GO:0005829
    label: cytosol
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  review:
    summary: >-
      SANS is a soluble, peripherally membrane-associated scaffold with a large cytosolic
      pool; the splicing study explicitly contrasts the newly discovered nuclear pool with
      the previously recognised cytosolic and ciliary pools [PMID:34023904].
    action: ACCEPT
    reason: >-
      Correct but low-information. Kept because it is the compartment in which the
      MYO7A/harmonin and IFT-B complexes are assembled, and it is independently supported
      by an HPA IDA row.
    supported_by:
    - reference_id: PMID:34023904
      supporting_text: >-
        Previously, SANS was shown to function only in the cytosol and primary cilia.
- term:
    id: GO:0005856
    label: cytoskeleton
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  review:
    summary: >-
      SANS associates both with the actin cytoskeleton of the hair bundle/cuticular plate
      and with microtubules along the photoreceptor trafficking route [PMID:31637240,
      PMID:23704327]. The generic 'cytoskeleton' term covers both.
    action: ACCEPT
    reason: >-
      Broad but genuinely two-sided here (actin and microtubule), so the general parent is
      arguably the honest level for a single term; the more specific GO:0015629 actin
      cytoskeleton is annotated separately by ISS and Ensembl IEA.
    supported_by:
    - reference_id: PMID:31637240
      supporting_text: >-
        Moreover, SANS is associated with microtubules, the transport routes for protein
        delivery toward the cilium.
- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  review:
    summary: >-
      SANS has no transmembrane segment; UniProt classes it as a peripheral membrane
      protein recruited to the cell membrane through CDH23 or PCDH15 (by similarity from
      mouse Q80T11). Functionally the relevant membrane sites are the upper tip-link
      density beneath the stereocilia membrane and the periciliary membrane complex of
      photoreceptors [PMID:21709241, PMID:24608321].
    action: KEEP_AS_NON_CORE
    reason: >-
      Not wrong, but 'plasma membrane' conveys almost nothing about a peripheral scaffold
      that is restricted to two highly specialised membrane subdomains. Kept as non-core;
      the informative replacement (GO:1990435 upper tip-link density) is proposed as a new
      annotation below rather than by overwriting this IEA.
    supported_by:
    - reference_id: PMID:24608321
      supporting_text: >-
        we demonstrated the localization of the SANS-Magi2 complex in the periciliary
        membrane complex facing the ciliary pocket of retinal photoreceptor cells in situ
