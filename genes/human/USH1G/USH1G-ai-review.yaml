- term:
    id: GO:0050957
    label: equilibrioception
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: >-
      InterPro2GO mapping from IPR037602. Vestibular areflexia is a defining feature of
      Usher syndrome type 1G, and the Jackson shaker mouse has the corresponding vestibular
      phenotype with disorganised hair bundles [PMID:12588794]. Vestibular and cochlear
      hair cells use the same USH1 tip-link complex, so the mechanism is the same one that
      underlies hearing.
    action: ACCEPT
    reason: >-
      Correct and mechanistically direct, in the same sense as sensory perception of sound:
      SANS is a structural part of the hair-cell mechanotransduction apparatus in
      vestibular as well as cochlear hair cells.
    supported_by:
    - reference_id: PMID:12588794
      supporting_text: >-
        In Jackson shaker mice the hair bundles, the mechanoreceptive structures of inner
        ear sensory cells, are disorganized.
- term:
    id: GO:0120025
    label: plasma membrane bounded cell projection
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: located_in
  review:
    summary: >-
      ARBA machine-learned term. This is a very high-level grouping class (the common
      parent of cilium, stereocilium, microvillus, neurite, etc.) that adds nothing beyond
      the cilium and stereocilium terms already justified by direct evidence. The two
      cell projections SANS actually occupies are the stereocilium of hair cells, where it
      clusters at the upper tip-link density [PMID:21709241], and the photoreceptor
      sensory cilium [PMID:31637240].
    action: MODIFY
    reason: >-
      The essence (SANS acts in a plasma-membrane-bounded cell projection) is sound but the
      term is uninformative at this depth. Replace with the specific projections supported
      by direct localisation data - stereocilium and photoreceptor cell cilium - rather
      than retaining an ARBA grouping class.
    proposed_replacement_terms:
    - id: GO:0032420
      label: stereocilium
    - id: GO:0097733
      label: photoreceptor cell cilium
    supported_by:
    - reference_id: PMID:21709241
      supporting_text: >-
        MYO7A and sans localization at the UTLD is confirmed by transfection of hair cells
        with GFP-tagged constructs for these proteins.
    - reference_id: file:human/USH1G/USH1G-deep-research-falcon.md
      supporting_text: >-
        In cochlear and vestibular hair cells, SANS participates in the Usher type-1 protein
        network that organizes the actin-rich stereociliary bundle and its mechanosensitive
        linkages.
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:20142502
  qualifier: enables
  review:
    summary: >-
      IntAct capture of the SANS-harmonin (USH1C, Q9Y6N9) interaction from the 2.3 A
      crystal structure of the harmonin NPDZ1 / SANS SAM-PBM complex. This is the single
      best-characterised SANS interaction: the SAM domain packs against harmonin PDZ1 and
      the C-terminal PDZ-binding motif augments the PDZ beta-sheet, giving a bipartite,
      roughly nanomolar complex, and USH1 patient mutations on both sides destabilise it
      [PMID:20142502].
    action: MODIFY
    reason: >-
      'Protein binding' records that an interaction exists but says nothing about what SANS
      does. The structural and functional data define SANS as the adaptor that bridges
      harmonin to myosin VIIa within the upper tip-link density complex, which is captured
      by GO:0030674 protein-macromolecule adaptor activity. Replacing the bare term here
      preserves the IntAct interaction record while giving the protein an informative
      molecular function.
    proposed_replacement_terms:
    - id: GO:0030674
      label: protein-macromolecule adaptor activity
    supported_by:
    - reference_id: PMID:20142502
      supporting_text: >-
        We discover that the SAM domain of Sans, specifically, binds to the PDZ domain of
        harmonin, revealing previously unknown interaction modes for both PDZ and SAM
        domains.
    - reference_id: PMID:20142502
      supporting_text: >-
        We further show that the synergistic PDZ1/SAM and PDZ1/carboxyl PDZ binding-motif
        interactions, between harmonin and Sans, lock the two scaffold proteins into a
        highly stable complex.
- term:
