  - reference_id: PMID:12588794
    supporting_text: >-
      we suggest that a functional network formed by the USH1B, C, D and G proteins is
      responsible for the correct cohesion of the hair bundle
- description: >-
    Acting as a scaffold/adaptor at the photoreceptor ciliary base and periciliary membrane
    compartment: binding intraflagellar transport complex B proteins IFT52 and IFT57 through
    its ankyrin repeats and central domain to position IFT-B for cargo delivery into the
    sensory cilium, and engaging MAGI2 through its CK2-phosphorylated SAM domain to control
    clathrin-dependent endocytosis at the periciliary membrane, both required for
    outer-segment renewal and photoreceptor survival.
