    myosin VIIa motor against the harmonin/cadherin-23 anchor through a bipartite SAM /
    C-terminal PDZ-binding-motif interface with harmonin and a central-region interface with
    the MYO7A MyTH4-FERM cassette, so that resting tension is maintained on the stereociliary
    tip link during hair-cell mechanotransduction.
