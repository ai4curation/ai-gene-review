id: Q495M9
gene_symbol: USH1G
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  USH1G encodes SANS (scaffold protein containing ankyrin repeats and SAM domain), a
  461-residue non-enzymatic multivalent scaffold built from three N-terminal ankyrin
  repeats, a partly disordered central (CENT) region, a C-terminal SAM domain and a
  terminal class-I PDZ-binding motif. Its best-established role is in the mechanosensory
  hair cells of the cochlea and vestibule, where SANS binds harmonin (USH1C) through a
  bipartite SAM/PDZ-binding-motif interface and binds the MyTH4-FERM cassette of myosin
  VIIa (MYO7A) through its central region. SANS, MYO7A and harmonin cluster together at
  the upper tip-link density, the electron-dense plaque that anchors the cadherin-23 end
  of the stereociliary tip link in the mature hair bundle, where the complex holds the
  tip link under resting tension and is required for hair-bundle cohesion, hearing and
  balance. In photoreceptor cells SANS is a scaffold of the ciliary and periciliary
  protein network: it concentrates at the ciliary base and connecting cilium, associates
  with microtubules, binds the intraflagellar transport complex B proteins IFT20, IFT52
  and IFT57 through its ankyrin repeats and central region, and is needed for their
  correct positioning at the cilium; a CK2-phosphorylation-dependent interaction between
  the SANS SAM domain and MAGI2 additionally regulates clathrin-dependent endocytosis at
  the periciliary membrane facing the ciliary pocket. SANS also shuttles into the nucleus,
  where it localises to Cajal bodies and nuclear speckles, interacts with SF3B1, SON,
  PRPF6, PRPF31 and the U4/U6.U5 tri-snRNP, and mediates transfer of tri-snRNP particles
  from Cajal bodies to speckles, so that its loss slows spliceosome assembly and alters
  constitutive and alternative splicing. Additional partners include PDZD7, spectrin
  beta-V and, by similarity, the tip-link cadherins CDH23 and PCDH15, which recruit SANS
  to the plasma membrane. Biallelic loss-of-function causes Usher syndrome type 1G
  (congenital profound deafness, vestibular areflexia and prepubertal retinitis
  pigmentosa); hypomorphic alleles cause non-syndromic progressive hearing loss.
existing_annotations:
- term:
    id: GO:0001917
    label: photoreceptor inner segment
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  review:
    summary: >-
      SANS is a scaffold of the ciliary/periciliary protein network of photoreceptor
      cells, and the ciliary base, basal body and periciliary membrane compartment where
      it acts all lie within the inner segment [PMID:31637240, PMID:24608321]. The
      photoreceptor inner segment localisation is independently supported for human
      USH1G by IDA (PMID:24608321), by ISS from mouse Ush1g (Q80T11) and by two IEA
      pipelines, so the PAINT node placement is consistent with direct evidence on the
      target itself.
    action: ACCEPT
    reason: >-
      The IBA reflects a phylogenetic judgement that the ciliary/periciliary photoreceptor
      role is ancestral in this small family, and human USH1G carries its own experimental
      grounding for the same compartment; the appearance of UniProtKB:Q495M9 in the
      WITH/FROM field is the expected marker of that descendant evidence, not circularity.
      The term is broad but correct; the more informative sites (ciliary base,
      photoreceptor connecting cilium) are annotated separately.
    supported_by:
    - reference_id: PMID:31637240
      supporting_text: >-
        The USH1G protein SANS is a scaffold of the ciliary/periciliary USH protein
        network of photoreceptor cells.
- term:
    id: GO:0050953
    label: sensory perception of light stimulus
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: >-
      Loss of USH1G causes prepubertal-onset retinitis pigmentosa, so vision is lost when
      the gene fails. However SANS is not a component of the phototransduction cascade; it
      is a scaffold that positions IFT-B at the photoreceptor ciliary base and regulates
      periciliary endocytosis [PMID:31637240, PMID:24608321]. Its contribution to light
      perception is therefore indirect, mediated through photoreceptor cell maintenance
      (GO:0045494, separately annotated).
    action: KEEP_AS_NON_CORE
    reason: >-
      Retained because the organism-level involvement is real and the PAINT node placement
      is defensible across the family, but flagged as non-core: this is a downstream
      consequence of the ciliary trafficking/maintenance role rather than a description of
      what SANS does. GO:0045494 photoreceptor cell maintenance is the mechanistically
      informative term for this arm of the phenotype.
    supported_by:
    - reference_id: PMID:31637240
      supporting_text: >-
        Analysis of photoreceptor cells of SANS knock out mice revealed the decrease of
        IFTs in the ciliary compartment indicating a role of SANS in the proper
        positioning of IFT-B molecules in primary cilia.
- term:
    id: GO:0097733
    label: photoreceptor cell cilium
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  review:
    summary: >-
      SANS concentrates at the base of the photoreceptor sensory cilium together with
      IFT20, IFT52 and IFT57, and its loss depletes these IFT-B proteins from the ciliary
      compartment [PMID:31637240]. Human USH1G additionally has a direct IDA annotation to
      this term from the same study.
    action: ACCEPT
    reason: >-
      The IBA agrees with direct experimental evidence on the human protein and on mouse
      Ush1g, and 'is_active_in' is the correct qualifier because the IFT-positioning
      function is executed at this structure. No reason to challenge the node placement.
    supported_by:
    - reference_id: PMID:31637240
      supporting_text: >-
        Quantitative immunofluorescence microscopy revealed the co-localization of SANS
        with IFT20, IFT52, and IFT57 particularly at ciliary base of wild type mouse
        photoreceptor cells.
- term:
    id: GO:0007605
    label: sensory perception of sound
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: >-
      Hearing is the most dose-sensitive USH1G phenotype: biallelic loss causes congenital
      profound sensorineural deafness in humans and disorganised hair bundles in Jackson
      shaker mice [PMID:12588794], and hypomorphic alleles cause non-syndromic progressive
      hearing loss (UniProt DISEASE note). Mechanistically SANS is a structural component
      of the upper tip-link density complex with MYO7A and harmonin [PMID:21709241].
    action: ACCEPT
    reason: >-
      Core process. Unlike the light-perception term, involvement in hearing is direct:
      SANS is physically part of the mechanotransduction apparatus that receives the
      stimulus, not merely a maintenance factor upstream of it. The PAINT node is
      well-grounded in both human and mouse experimental annotations.
    supported_by:
    - reference_id: PMID:21709241
      supporting_text: >-
        Using immunofluorescence, we now show that MYO7A and sans, a MYO7A-interacting
        protein, cluster at the UTLD.
    - reference_id: PMID:12588794
      supporting_text: >-
        These results demonstrate that SANS underlies USH1G.
- term:
    id: GO:0001917
    label: photoreceptor inner segment
