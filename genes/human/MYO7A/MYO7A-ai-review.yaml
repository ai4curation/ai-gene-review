- term:
    id: GO:1990435
    label: upper tip-link density
  evidence_type: ISS
  original_reference_id: PMID:21709241
  qualifier: located_in
  review:
    summary: In mature cochlear and vestibular hair bundles, MYO7A clusters with sans
      (USH1G) and harmonin-b (USH1C) at the upper tip-link density, the plaque at the
      upper insertion of the CDH23-PCDH15 tip link, with eight or more MYO7A molecules
      estimated per density.
    action: NEW
    reason: This is the sub-stereociliary compartment in which the best-defined mechanical
      function of MYO7A occurs, pulling on CDH23 to maintain resting tip-link tension
      and thereby set the operating point of the mechanotransduction channels, and
      it is missing from the current annotation set, which stops at GO:0032420 stereocilium
      and GO:0120044 stereocilium base. The cited immunolocalisation and heterologous
      co-transfection work used rodent hair cells and tagged constructs, so ISS is
      the appropriate evidence code for the human protein; the human orthologue is
      96 to 97 percent identical over the motor domain and its partners USH1C and USH1G
      are the same USH1 proteins. This is a tension-bearing complex of the mature bundle,
      distinct from the transient ankle-link complex of developing bundles.
    supported_by:
    - reference_id: PMID:21709241
      supporting_text: Analysis of the immunofluorescence intensity indicates that
        eight or more MYO7A molecules are present at each UTLD, consistent with a direct
        role for MYO7A in maintaining tip-link tension.
    - reference_id: PMID:21709241
      supporting_text: In this complex, MYO7A is likely the motor element that pulls
        on CDH23 to exert tension on the tip-link.
- term:
    id: GO:0032400
    label: melanosome localization
  evidence_type: IMP
  original_reference_id: PMID:19643958
  qualifier: involved_in
  review:
    summary: RNAi knockdown of MYO7A in primary human retinal pigment epithelial cells
      changes melanosome motility, converting normal short-range movement into the
      longer-range fast movements characteristic of myosin-VIIa-null RPE, indicating
      that the motor normally captures and retains melanosomes on apical cortical actin
      after microtubule-based delivery.
    action: NEW
    reason: Melanosome positioning in the RPE is one of the two best-established cellular
      functions of MYO7A, is mechanistically explained by the RAB27A-MYRIP-MYO7A module
      already annotated at the level of localisation and interaction, and yet no process
      term for it exists in the current set, which offers only the generic GO:0030048
      actin filament-based movement. The evidence is a loss-of-function experiment
      in human cells, so IMP is appropriate. GO:0032400 melanosome localization is
      preferred over GO:0032402 melanosome transport because the demonstrated effect
      is constraint and retention rather than net directed transport.
    supported_by:
    - reference_id: PMID:19643958
      supporting_text: RNAi knockdown studies showed that MYO7A functions to constrain
        rapid, long-range movements of melanosomes.
    - reference_id: PMID:19643958
      supporting_text: Melanosome motility was also comparable, and, after RNAi knockdown,
        consisted of longer-range fast movements characteristic of melanosomes in shaker1
        RPE.
