  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text confirms immunolocalisation of MYO7A and sans to the upper
      tip-link density in hair cells and the tripartite MYO7A, sans and harmonin-b
      complex in a heterologous system. The hair cells are rodent, hence ISS rather
      than IDA for the human protein.
- id: PMID:23023331
  title: Alterations of the CIB2 calcium- and integrin-binding protein cause Usher
    syndrome type 1J and nonsyndromic deafness DFNB48.
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text confirms an interaction between CIB2 and myosin VIIa. The
      focus of the paper is CIB2 rather than MYO7A, and it also reports that CIB2 localisation
      at stereocilia tips is unaffected in Myo7a mutant mice.
