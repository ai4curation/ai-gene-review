existing_annotations:
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  review:
    summary: Family-level phylogenetic assertion that myosins act in the cytoplasm.
      True for MYO7A, but far less informative than the sites where it actually works,
      namely stereocilia and the upper tip-link density, the RPE apical cortex, and
      melanosome and lysosome surfaces.
    action: KEEP_AS_NON_CORE
    reason: The IBD node placement is uncontroversial, since every characterised myosin
      is a cytoplasmic actin-based motor, so there is no reason to challenge it. It
      is retained as a correct but generic location that does not capture the core
      biology; the specific compartments (GO:0032420 stereocilium, GO:0042470 melanosome,
      GO:0005765 lysosomal membrane, GO:0032391 photoreceptor connecting cilium) are
      annotated separately.
- term:
    id: GO:0006897
    label: endocytosis
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: Phylogenetic transfer of an endocytosis role from a node containing myosins
      with documented endocytic-trafficking functions. MYO7A does participate in membrane
      traffic, including phagosome handling in RPE and hair-cell vesicle trafficking
      of aminoglycosides, but endocytosis proper is not its defining activity.
    action: KEEP_AS_NON_CORE
    reason: There is no target-specific evidence of loss or divergence that would justify
      arguing with the node placement, and the general membrane-trafficking role is
      consistent with the RPE phagosome and lysosome literature. It is nonetheless
      peripheral relative to the motor and tension-bearing functions in stereocilia
      and the RPE actin cortex, so it is kept as non-core.
- term:
    id: GO:0007015
    label: actin filament organization
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: Family-level assertion that these myosins act on the organisation of actin
      filaments. For MYO7A the corresponding phenotype is progressive disorganisation
      of the actin-filled stereocilia bundle when the motor is lost.
    action: KEEP_AS_NON_CORE
    reason: Plausible at the node and consistent with hair-bundle phenotypes, but MYO7A
      is not an actin nucleator, bundler or severing factor; its effect on bundle architecture
      is an indirect consequence of tension-bearing and adhesion-link anchoring. Retained
      as a correct but non-core generalisation; the specific process in human tissue
      is stereocilium organisation.
- term:
    id: GO:0007423
    label: sensory organ development
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: Phylogenetic transfer from a node seeded by Drosophila crinkled and mouse
      Myo7a, both of which have sensory-organ phenotypes affecting bristles and hair
      cells respectively.
    action: KEEP_AS_NON_CORE
    reason: The node placement is sound, since the sensory-organ requirement for class
      VII myosins is conserved from fly bristles to vertebrate hair cells, but this
      is a broad developmental umbrella term. The mechanistically informative annotations
      for the human gene are the sensory-perception and stereocilium terms; this one
      is retained as non-core pleiotropic and developmental context.
- term:
    id: GO:0015629
    label: actin cytoskeleton
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  review:
    summary: MYO7A is an actin-based motor that works while bound to F-actin; the human
      protein binds F-actin with high affinity even in the presence of ATP.
    action: ACCEPT
    reason: This is the correct site of action for the motor and is directly supported
      by human biochemistry as well as by the phylogenetic assertion. Accepted as a
      core location.
    supported_by:
    - reference_id: PMID:21687988
      supporting_text: Our results show that human myosin-7a is a slow motor with a
        rate-limiting ADP release step from actomyosin and a high affinity for F-actin,
        even in the presence of ATP.
- term:
    id: GO:0016020
    label: membrane
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  review:
    summary: Generic membrane association, reflecting the fact that unconventional
      myosin tails bind membranous cargo. For MYO7A the relevant memberships are the
      melanosome, lysosome and apical plasma membranes.
    action: KEEP_AS_NON_CORE
    reason: Correct but uninformative at this level. The specific membranes MYO7A engages
      are separately annotated (GO:0005765 lysosomal membrane, GO:0042470 melanosome,
      GO:0016324 apical plasma membrane), so this root-level term is retained only
      as non-core context.
- term:
    id: GO:0000146
    label: microfilament motor activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: Actin-based (microfilament) motor activity, the defining molecular function
      of MYO7A, asserted phylogenetically and directly measured for the human motor
      domain.
    action: ACCEPT
    reason: This is the core molecular function. Note that MYO7A itself appears in
      the WITH/FROM list, which is expected, because its own experimental annotation
      (PMID:21687988) is one of the descendant evidences the PAINT curator used to
      place the IBD, and the IBA additionally asserts that the activity is inherited
      rather than lineage-specific.
    supported_by:
    - reference_id: PMID:21687988
      supporting_text: A rate-limiting, slow ADP release step causes long lifetimes
        of strong actin-binding intermediates and results in a high duty ratio.
- term:
    id: GO:0030048
    label: actin filament-based movement
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: Actin-based movement is the process counterpart of the motor activity;
      for MYO7A this covers cargo movement along cortical actin (melanosomes, phagosomes,
      lysosomes) and tension-bearing at actin-anchored adhesion links.
    action: ACCEPT
    reason: Directly supported by in vitro motility measurements with the human motor
      domain and by cellular melanosome and phagosome phenotypes. MYO7A appearing in
      its own WITH/FROM reflects experimental grounding on the target itself, not circularity.
    supported_by:
    - reference_id: PMID:21687988
      supporting_text: These specific kinetic adaptations indicate that human myosin-7a
        is a slow molecular motor with a high duty ratio, suitable for moving cargoes
        and mediating tension in the cytoskeleton.
- term:
    id: GO:0007605
    label: sensory perception of sound
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: Hearing requires myosin-VIIa; the node is seeded by Drosophila crinkled,
      mouse Myo7a (shaker-1) and human MYO7A itself, whose loss causes congenital profound
      deafness in Usher syndrome type 1B.
    action: ACCEPT
    reason: Core biological process, independently supported by human loss-of-function
