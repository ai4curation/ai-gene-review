- id: PMID:8842737
  title: 'Human Usher 1B/mouse shaker-1: the retinal phenotype discrepancy explained
    by the presence/absence of myosin VIIA in the photoreceptor cells.'
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only in the cache. Establishes myosin-VIIA expression in
      human but not rodent photoreceptors and its localisation to the inner segment,
      base of the outer segment and synaptic ending region. The developmental interpretation
      annotated as IC (GO:0042462) goes beyond what the localisation data show.
