    action: ACCEPT
    reason: Calmodulin light chains on the five IQ motifs constitute the lever arm
      that converts motor-domain conformational changes into force, and Ca2+-dependent
      calmodulin release is how the motor is switched off. This is a core molecular
      function, supported by a human mutation with a measured effect on calmodulin
      binding. The IMP evidence code is unusual for a binding term but the experiment
      does test the interaction directly in cells.
    supported_by:
