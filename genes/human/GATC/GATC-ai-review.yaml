- term:
    id: GO:0070681
    label: obsolete glutaminyl-tRNAGln biosynthesis via transamidation
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000385050
  - UniProtKB:O43716
  review:
    summary: >-
      PAINT IBA to glutaminyl-tRNAGln biosynthesis via transamidation, a term now obsolete
      (QuickGO: pathway variant out of scope; replacements to consider are GO:0050567 for
      the amidotransferase step and charged-tRNA amino acid modification for the process acting
      on already-charged tRNA). The biology is correct and central for GATC.
    action: MODIFY
    reason: >-
      The underlying assertion (GatCAB converts Glu-tRNA(Gln) to Gln-tRNA(Gln)) is correct,
      but the term is obsolete. GatCAB acts on an already-charged tRNA, so the process is
      best captured by charged-tRNA amino acid modification; the activity is captured by the
      NEW contributes_to glutaminyl-tRNA synthase (glutamine-hydrolyzing) activity annotation.
    proposed_replacement_terms:
    - id: GO:0019988
      label: charged-tRNA amino acid modification
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      source_entities:
      - source_id: PANTHER:PTN000385050
        source_status: SUPPORTS_TRANSFER
        comment: >-
          The GatC node correctly transfers participation in tRNA(Gln) transamidation; the
          defect is only that the target term has since been obsoleted as a pathway variant.
    supported_by:
    - reference_id: PMID:19805282
      supporting_text: >-
        We successfully reconstituted in vitro Gln-tRNA(Gln) formation catalyzed by the recombinant
        mtGluRS and hGatCAB.
