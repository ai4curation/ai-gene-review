core_functions:
- description: >-
    Structural subunit of the mitochondrial GatCAB glutamyl-tRNA(Gln) amidotransferase that,
    with QRSL1 and GATB, transamidates misacylated Glu-tRNA(Gln) to Gln-tRNA(Gln) using glutamine
    and ATP, providing the only route to correctly charged glutaminyl tRNA for mitochondrial
    protein synthesis.
  contributes_to_molecular_function:
    id: GO:0050567
    label: glutaminyl-tRNA synthase (glutamine-hydrolyzing) activity
  directly_involved_in:
  - id: GO:0019988
    label: charged-tRNA amino acid modification
  - id: GO:0032543
    label: mitochondrial translation
  locations:
  - id: GO:0005739
    label: mitochondrion
  in_complex:
    id: GO:0030956
    label: glutamyl-tRNA(Gln) amidotransferase complex
  supported_by:
  - reference_id: PMID:19805282
    supporting_text: >-
      We successfully reconstituted in vitro Gln-tRNA(Gln) formation catalyzed by the recombinant
      mtGluRS and hGatCAB.
  - reference_id: PMID:30283131
    supporting_text: >-
      mt-tRNAGln is indirectly charged by a transamidation reaction involving the GatCAB aminoacyl-tRNA
      amidotransferase complex.
suggested_questions:
- question: >-
    Does human GATC simply stabilise the QRSL1-GATB interface, as inferred from bacterial
    GatCAB structures, or does it also influence tRNA(Gln) recognition or glutamine channelling?
- question: >-
    Why does high extracellular glutamine rescue tRNA(Gln) aminoacylation in GatCAB-deficient
    fibroblasts, and could this be exploited therapeutically in COXPD42?
suggested_experiments:
- description: >-
    Determine the structure of human mitochondrial GatCAB bound to tRNA(Gln) to define the
    contacts made by GATC, and test patient GATC variants for effects on complex stability
    and amidotransferase kinetics in vitro.
