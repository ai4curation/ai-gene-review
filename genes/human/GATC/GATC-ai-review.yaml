id: O43716
gene_symbol: GATC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  GATC encodes the C subunit of the mitochondrial glutamyl-tRNA(Gln) amidotransferase GatCAB,
  a heterotrimer with the catalytic subunits QRSL1 (GatA, glutaminase) and GATB (GatB, kinase/transamidase).
  Because mammalian mitochondria lack a glutaminyl-tRNA synthetase, mitochondrial tRNA(Gln)
  is first misacylated with glutamate by the mitochondrial glutamyl-tRNA synthetase (EARS2),
  and GatCAB then converts Glu-tRNA(Gln) to Gln-tRNA(Gln) using glutamine and ATP, via a phosphorylated
  glutamyl-tRNA intermediate. GATC is a small non-catalytic structural subunit that, by analogy
  with bacterial GatC, wraps around the interface of the A and B subunits to stabilise the
  complex. GatCAB activity is required for correct charging of mitochondrial tRNA(Gln), for
  exclusion of misacylated Glu-tRNA(Gln) from translation (it binds mitochondrial EF-Tu weakly),
  and therefore for accurate mitochondrial protein synthesis and respiration. Biallelic GATC
  variants, like those in QRSL1 and GATB, cause combined oxidative phosphorylation deficiency
  42, a lethal infantile metabolic cardiomyopathy with lactic acidosis; in patient fibroblasts
  tRNA(Gln) aminoacylation and mitochondrial translation are deficient in low glutamine and
  restored by high glutamine.
