    label: regulation of translational fidelity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR003837
  - InterPro:IPR036113
  review:
    summary: >-
      InterPro (GatC domain) mapping to regulation of translational fidelity. GatCAB converts
      misacylated Glu-tRNA(Gln) to Gln-tRNA(Gln), and the misacylated form is excluded from
      translation, so the complex contributes to accurate decoding of Gln codons.
    action: KEEP_AS_NON_CORE
    reason: >-
      Defensible in that GatCAB prevents glutamate misincorporation, but the direct role is
      tRNA(Gln) charging rather than regulation of the fidelity of the translational machinery;
      non-core.
    supported_by:
    - reference_id: PMID:19805282
      supporting_text: >-
        the misaminoacylated form of tRNA(Gln) is rejected from the translational apparatus
        to maintain the accuracy of mitochondrial protein synthesis
