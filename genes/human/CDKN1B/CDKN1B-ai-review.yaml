suggested_questions:
- question: Cytoplasmic p27 has been reported both to increase motility (RSK1/Thr198-dependent RhoA inhibition)
    and to decrease it (sequestration of stathmin). Which direction dominates in a given cell type, and
    should GO capture cytoplasmic p27's cytoskeletal role with a directional process term at all, or only
    as RhoA/stathmin binding plus the cytosolic location?
  experts:
  - Slingerland JM
  - Baldassarre G
- question: p27 acts as both inhibitor and assembly factor. Would GO be better served by an explicit 'cyclin-CDK
    complex assembly' molecular-function or process annotation for Cip/Kip proteins, rather than the generic
    molecular adaptor activity term currently used?
  experts:
  - Sherr CJ
  - Kriwacki RW
- question: Numerous process terms on CDKN1B (heart development, cardiac regeneration, vSMC proliferation,
    senescence, autophagic cell death) derive from perturbing p27 abundance. Which of these should be
    retained at all, given that they are consequences of one conserved activity - inhibition of G1 cyclin-CDK2
    - in different tissues?
  experts:
  - Nakayama KI
  - Roberts JM
suggested_experiments:
- hypothesis: The inhibitory and assembly-factor modes of p27 are separable, and the assembly mode requires
    Tyr74/Tyr88 phosphorylation rather than loss of cyclin binding.
  description: Reconstitute cyclin D1-CDK4 and cyclin E-CDK2 with recombinant p27 variants (wild type,
    Y74F/Y88F, phosphomimetic, subdomain-1 and subdomain-2 point mutants) and measure complex assembly
    kinetics by surface plasmon resonance alongside kinase activity, then test the same alleles for rescue
    of G1 arrest and of cyclin D-CDK4 nuclear import in CDKN1B-null cells.
  experiment_type: structure-function reconstitution and separation-of-function rescue
- hypothesis: Nuclear and cytoplasmic p27 have non-overlapping interactomes and phenotypes, and the cytoplasmic
    pool acts through RhoA and stathmin rather than through any CDK.
  description: Express compartment-restricted p27 (NLS-forced and NES-forced, in a CDK-binding-dead background)
    in CDKN1B-null cells and compare proximity-labelling interactomes, RhoA-GTP levels, microtubule dynamics,
    migration and cell-cycle distribution.
  experiment_type: compartment-restricted expression with proximity labelling
- hypothesis: CDKN1B is not a p53-responsive CKI, so the p53-class DNA damage response annotations reflect
    pathway membership rather than regulation of p27.
  description: Quantify CDKN1B transcript and p27 protein, with p21 as positive control, across a damage
    panel (ionising radiation, UV, doxorubicin) in isogenic TP53 wild-type and TP53-null cells, combined
    with TP53 ChIP-seq/ChIP-qPCR at the CDKN1B locus.
  experiment_type: transcriptional and protein-level damage-response profiling
