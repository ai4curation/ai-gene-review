  - ARBA:ARBA00029050
  review:
    summary: Signal transduction, from an ARBA machine-learning model (ARBA00029050).
    action: MARK_AS_OVER_ANNOTATED
    reason: 'p27 sits at the receiving end of signalling rather than transducing it: TGF-beta, contact
      inhibition, PI3K-AKT, RAS-MAPK/RSK and Src-family inputs converge on p27''s synthesis, phosphorylation,
      localisation and degradation, and p27''s own output is inhibition of cyclin-CDK complexes. A root-level
      ''signal transduction'' term adds no information that the cell-cycle regulation terms do not already
      carry, and it invites propagation of an inappropriate signalling role. Not removed outright because
      p27 genuinely is the effector through which antimitogenic signals are relayed to the cell cycle.'
