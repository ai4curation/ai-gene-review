  review:
    summary: Protein kinase inhibitor activity, from the crystal structure of the p27 kinase-inhibitory
      domain bound to phosphorylated cyclin A-CDK2.
    action: MODIFY
    reason: The activity is correct but stated one level too broadly. p27 does not inhibit protein kinases
      generally; it inhibits cyclin-dependent kinases, and the cited structure shows exactly how - the
      extended inhibitor binds both subunits, rearranging the CDK2 N-terminal lobe and inserting a 3(10)
      helix into the catalytic cleft as an ATP mimic. The specific child term GO:0004861 is the right
      level and is separately annotated with IDA and IBA support.
