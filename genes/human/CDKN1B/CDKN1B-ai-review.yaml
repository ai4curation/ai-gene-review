- term:
    id: GO:0000079
    label: regulation of cyclin-dependent protein serine/threonine kinase activity
  evidence_type: IDA
  original_reference_id: PMID:8033212
  qualifier: involved_in
  review:
    summary: 'p27 regulates the activity of cyclin-dependent kinases: it binds cyclin E-CDK2 and cyclin
      A-CDK2 and blocks their activation, and also modulates cyclin D-CDK4.'
    action: ACCEPT
    reason: 'Core function, established in the cloning paper by direct kinase assays: p27 prevents activation
      of cyclin E-CDK2 and inhibits already-active complexes, and blocks Rb phosphorylation by cyclin
      E-CDK2, cyclin A-CDK2 and cyclin D2-CDK4. The parent ''regulation'' term (rather than the negative-regulation
      child) is appropriate for this gene, because p27 is not a uniform inhibitor: at substoichiometric
      levels and when phosphorylated on Tyr74/Tyr88 it promotes assembly and can permit cyclin D-CDK4
      activity.'
