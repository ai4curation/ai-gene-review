  review:
    summary: Ubiquitin ligase activator activity, annotated from the Skp1-Skp2-Cks1/phospho-p27 crystal
      structure.
    action: REMOVE
    reason: 'The structure establishes the opposite relationship: p27 is the substrate the ligase recognises,
      not an activator of it. Thr187 phosphorylation by cyclin-CDK2 creates the phosphodegron that CKS1
      reads, and Glu185 inserts into the SKP2-CKS1 interface - this is how a substrate is recruited, and
      SCF(SKP2)-CKS1 assembles and functions on other substrates without p27. Nothing in the work shows
      p27 increasing ligase activity. The supportable statement from this same reference is ubiquitin
      protein ligase binding (GO:0031625), which is separately annotated, so no information is lost by
      removal.'
