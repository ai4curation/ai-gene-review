    summary: CDK inhibitor activity inferred from the Cip/Kip phylogeny (PANTHER:PTN004142838), with descendant
      evidence from Drosophila dacapo, mouse Cdkn1b, human CDKN1B itself and CDKN1C/p57.
    action: ACCEPT
    reason: 'This is the defining molecular function of the Cip/Kip family and the node placement is sound:
      CDK-inhibitory activity is shared by p21, p27, p57 and the single invertebrate members (dacapo,
      cki-1/cki-2), all acting through the same bipartite cyclin-plus-CDK contact. Human P46527 appearing
      in its own WITH/FROM is expected and welcome - it marks that the IBD node was placed using experimental
      evidence that includes this gene, so the IBA adds the further claim that the activity is inherited
      rather than lineage-specific.'
