    summary: Experimental physical interaction (IPI) between p27/CDKN1B and RHOA, recorded by curators
      under the bare term 'protein binding'.
    action: MODIFY
    reason: Here the cited paper does support a more informative molecular function, so the generic term
      should be replaced rather than dropped. RSK1-mediated Thr198 phosphorylation increases p27 binding
      to RhoA in vitro and in cells, and the consequence is measurable RhoA pathway inhibition - reduced
      RhoA-GTP, reduced phospho-cofilin, loss of actin stress fibres - all reversed by p27 knockdown.
      That is a small GTPase binding activity (GO:0031267; the former 'Rho GTPase binding' GO:0017048
      has been merged into it) and it is the molecular basis of the CDK-independent cytoplasmic function
      of p27.
