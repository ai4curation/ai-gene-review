  - WB:WBGene00000516
  - WB:WBGene00000517
  review:
    summary: Negative regulation of the G1/S transition, inferred from the Cip/Kip phylogeny (PANTHER:PTN004142838)
      with descendant evidence from Drosophila dacapo and C. elegans cki-1/cki-2.
    action: ACCEPT
    reason: 'This is the core process for p27 and the node placement is well judged: restraint of the
      G1/S transition through inhibition of G1 cyclin-CDK complexes is what dacapo and cki-1 do in flies
      and worms, and what p27 does in mammals, where CDK2-dependent Thr187 phosphorylation and SCF(SKP2)-CKS1
      degradation form the switch that releases the block.'
    supported_by:
