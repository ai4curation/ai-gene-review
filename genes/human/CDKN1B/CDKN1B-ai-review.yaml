  review:
    summary: 'Heart development, from the mouse ortholog: p21 and p27 peak around postnatal day 5 and
      are required for cardiomyocyte cell-cycle exit.'
    action: KEEP_AS_NON_CORE
    reason: Real but downstream and tissue-specific. p21/p27 knockout cardiomyocytes fail to exit the
      cycle at G1 and undergo endoreplication, so the developmental phenotype follows directly from the
      same cyclin E/A-CDK2 inhibitory activity annotated as core rather than representing a distinct cardiac
      function. Typical of the many organ-development terms a pleiotropic CKI attracts; kept, but explicitly
      non-core.
