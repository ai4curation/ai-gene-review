  review:
    summary: CDK inhibitor activity, from crystal structures of Cdk2-Spy1 and p27-Cdk2-Spy1 defining how
      p27 inhibits CDK2 and why Spy1/RINGO-bound CDK2 escapes it.
    action: ACCEPT
    reason: 'Structurally direct and mechanistically informative: p27 inhibition requires the cyclin-binding
      site that Spy1 lacks, which is why p27 inhibits cyclin-CDK2 but barely inhibits CDK2-Spy1. This
      delimits the activity rather than contradicting it, and is the basis of the UniProt statement that
      p27 has little inhibitory activity on SPDYA-bound CDK2.'
