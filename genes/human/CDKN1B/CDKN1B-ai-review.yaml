- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:32707033
  qualifier: enables
  supporting_entities:
  - UniProtKB:P06493
  review:
    summary: Experimental physical interaction (IPI) between p27/CDKN1B and the kinase CDK1, recorded
      by curators under the bare term 'protein binding'.
    action: MODIFY
    reason: The interaction is well supported but the bare term is uninformative. The partner is a cyclin-dependent
      kinase, and the crystal structure of the p27 kinase-inhibitory domain bound to cyclin A-CDK2 shows
      p27 contacting and rearranging the CDK N-terminal lobe and inserting into the catalytic cleft; protein
      kinase binding (GO:0019901) is the evidence-backed informative replacement, with the functional
      consequence captured separately by GO:0004861.
    proposed_replacement_terms:
    - id: GO:0019901
      label: protein kinase binding
    supported_by:
    - reference_id: PMID:8684460
      supporting_text: p27Kip1 binds the complex as an extended structure
    - reference_id: PMID:8684460
      supporting_text: inserts into the catalytic cleft, mimicking ATP.
