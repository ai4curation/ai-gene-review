- id: file:human/CDKN1B/CDKN1B-deep-research-falcon.md
  title: Falcon deep research report for CDKN1B
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: 'LLM-generated synthesis (Edison/Falcon). Its account of the canonical biology matches
      the primary literature reviewed here: the intrinsically disordered Cip/Kip architecture and KID
      (~residues 25-93), inhibition of cyclin E/A-CDK2, the context-dependent cyclin D-CDK4/6 assembly
      role, Ser10/CRM1 export, Thr157/Thr198-14-3-3 cytoplasmic retention, and CDK2-dependent Thr187 phosphorylation
      feeding CKS1-SCF(SKP2) degradation. It is cited here only for the cytoplasmic non-CDK functions
      it summarises. Left UNVERIFIED because its citations are to internal document keys (e.g. ''cusan2018landscapeofcdkn1b'',
      ''bencivenga2025p27kip1andtumors'') rather than PMIDs and could not be resolved against the publication
      cache; its clinical/prognostic sections were not used for any annotation decision.'
  findings: []
core_functions:
- description: 'Stoichiometric inhibitor of nuclear G1/S cyclin-CDK2 complexes: p27 binds cyclin E-CDK2
    and cyclin A-CDK2 through its bipartite kinase-inhibitory domain, preventing their activation and
    inhibiting already-active complexes, thereby keeping Rb hypophosphorylated and restraining the G1/S
    transition.'
  molecular_function:
    id: GO:0004861
    label: cyclin-dependent protein serine/threonine kinase inhibitor activity
  directly_involved_in:
  - id: GO:2000134
    label: negative regulation of G1/S transition of mitotic cell cycle
  - id: GO:0008285
    label: negative regulation of cell population proliferation
  locations:
  - id: GO:0005654
    label: nucleoplasm
  supported_by:
  - reference_id: PMID:8033212
    supporting_text: p27Kip1 associates with cyclin E-Cdk2
  - reference_id: PMID:8033212
    supporting_text: prevents their activation, and inhibits
  - reference_id: PMID:8684460
    supporting_text: p27Kip1 binds the complex as an extended structure
  - reference_id: PMID:8684460
    supporting_text: inserts into the catalytic cleft, mimicking ATP.
- description: 'Cyclin-binding module that determines specificity: subdomain 1 of p27 docks rapidly into
    the MRAIL groove of cell-cycle cyclins, tethering the inhibitor to the assembled holoenzyme before
    the CDK-contacting subdomain folds, and accounting for why p27 regulates cell-cycle cyclin-CDKs but
    not CDK5-p25.'
  molecular_function:
    id: GO:0030332
    label: cyclin binding
