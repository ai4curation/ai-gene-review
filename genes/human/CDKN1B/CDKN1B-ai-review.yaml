    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:29997244
  qualifier: enables
  supporting_entities:
  - UniProtKB:P78396
  review:
    summary: Experimental physical interaction (IPI) between p27/CDKN1B and the cyclin CCNA1, recorded
      by curators under the bare term 'protein binding'.
    action: MODIFY
    reason: 'The interaction data are sound, but bare ''protein binding'' conveys no functional information.
      The partner is a cyclin, and p27 engages cyclins through a defined mechanism: its N-terminal subdomain
      1 docks into the MRAIL groove of the cyclin box first, tethering the inhibitor before subdomain
      2 folds onto the CDK. That is exactly cyclin binding (GO:0030332), which is the informative replacement
      here and is already separately annotated from PMID:15024385.'
    proposed_replacement_terms:
    - id: GO:0030332
      label: cyclin binding
    supported_by:
    - reference_id: PMID:15024385
      supporting_text: Binding to Cdk2-cyclin A is accompanied by p27 folding, and kinetic
    - reference_id: PMID:15890360
      supporting_text: p27/cyclin interactions are an important determinant of p27 specificity towards
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:31515488
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q12933
  review:
    summary: Experimental physical interaction (IPI) between p27/CDKN1B and TRAF2, recorded by curators
      under the bare term 'protein binding'.
    action: REMOVE
    reason: 'Removal reflects the term, not the data: the reported interaction may well be real, but ''protein
      binding'' asserts nothing about what p27 does and cannot be graded as a molecular function. Per
      curation guidance the generic term should be replaced by an informative MF term where the paper
      supports one; this partner does not support a specific p27 molecular activity beyond what the CDK-inhibitory
      and cyclin/CDK-binding annotations already state.'
    supported_by:
    - reference_id: PMID:31515488
      supporting_text: Extensive disruption of protein interactions by genetic variants across the allele
        frequency spectrum in human populations.
