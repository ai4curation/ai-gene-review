- term:
    id: GO:1904706
    label: negative regulation of vascular associated smooth muscle cell proliferation
  evidence_type: IMP
  original_reference_id: PMID:19088079
  qualifier: involved_in
  review:
    summary: Negative regulation of vascular smooth muscle cell proliferation, from PDGF induction of
      miR-221, which downregulates p27 and thereby permits vSMC proliferation.
    action: KEEP_AS_NON_CORE
    reason: 'The evidence supports p27 restraining proliferation in this cell type, and the direction
      is right: relieving p27 is required for PDGF-driven proliferation. It is nonetheless one tissue-specific
      instance of the general antiproliferative function already annotated (GO:0008285), and the manipulation
      acts on p27 rather than through it. Kept as non-core.'
    supported_by:
    - reference_id: PMID:19088079
      supporting_text: down-regulation of the targets c-Kit and p27Kip1.
    - reference_id: PMID:19088079
      supporting_text: miR-221 is critical for PDGF-mediated induction of cell proliferation.
