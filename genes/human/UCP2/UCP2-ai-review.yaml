id: P55851
gene_symbol: UCP2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: UCP2 (SLC25A8) is a member of the mitochondrial carrier (SLC25) family located
  in the inner mitochondrial membrane. Although named for its homology to the thermogenic
  uncoupling protein UCP1, reconstitution and silencing studies show that its principal activity
  is an antiport that exports four-carbon Krebs-cycle intermediates (malate, oxaloacetate,
  aspartate) from the matrix in exchange for phosphate plus a proton. By draining C4 metabolites
  it limits the oxidation of acetyl-CoA-producing substrates such as glucose, favours glutaminolysis,
  and lowers the ATP/ADP ratio and mitochondrial ROS production. Reconstituted UCP2 also conducts
  protons when activated by long-chain fatty acids (inhibited by purine nucleotides) and transports
  chloride, but the physiological weight of this mild uncoupling is debated, and it does not
  mediate adaptive thermogenesis. UCP2 is widely expressed (adipose tissue, muscle, macrophages,
  pancreatic islets, hypothalamus). In pancreatic beta cells it restrains glucose-stimulated
  insulin secretion, and heterozygous impaired-function variants have been reported in congenital
  hyperinsulinism, an association that remains disputed.
