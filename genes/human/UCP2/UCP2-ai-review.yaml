    summary: Oxidative phosphorylation uncoupler activity (IBA).
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      UCP2 was named by homology to UCP1, and this IBA follows that name: the donors are UCP1 itself
      (MGI:98894, RGD:3931) and a plant UCP. Reconstitution and silencing data instead show a
      C4-dicarboxylate/phosphate antiporter. UniProt also states that UCP2 does not mediate adaptive
      thermogenesis, though that line is itself a similarity-based assertion (ECO:0000250 from
      UniProtKB:P70406), so against an IBA it is inference against inference and nothing here turns on
      it; the reconstitution and silencing data carry the argument. The FA-activated proton conductance
      is real and is kept separately as GO:0015078, non-core; the difference is that GO:0015078 asserts a
      transport capability while this term asserts its physiological consequence, that the leak uncouples
      oxidative phosphorylation. The first is measured, the second is what the UCP1 orthologs do and UCP2
      is not shown to.
    supported_by:
