core_functions:
- description: Electroneutral export of C4 Krebs-cycle intermediates (malate, oxaloacetate,
    aspartate) from the mitochondrial matrix in exchange for phosphate plus a proton, limiting
    oxidation of acetyl-CoA-producing substrates and thereby lowering the ATP/ADP ratio and
    ROS production.
  molecular_function:
    id: GO:0015364
    label: dicarboxylate:phosphate antiporter activity
  directly_involved_in:
  - id: GO:0015740
    label: C4-dicarboxylate transport
  - id: GO:1990542
    label: mitochondrial transmembrane transport
  locations:
  - id: GO:0005743
    label: mitochondrial inner membrane
  supported_by:
  - reference_id: PMID:24395786
    supporting_text: UCP2 reconstituted in lipid vesicles catalyzed the exchange of malate, oxaloacetate, and aspartate for phosphate plus a proton from opposite sides of the membrane.
  - reference_id: PMID:24395786
    supporting_text: by exporting C4 compounds out of mitochondria, UCP2 limits the oxidation of acetyl-CoA-producing substrates such as glucose and enhances glutaminolysis, preventing the mitochondrial accumulation of C4 metabolites derived from glutamine.
  - reference_id: file:human/UCP2/UCP2-uniprot.txt
    supporting_text: Krebs cycle in exchange for phosphate plus a proton across the inner membrane of mitochondria, a process driven by mitochondrial motive force with an overall impact on glycolysis, glutaminolysis and glutathione-dependent redox balance.
suggested_questions:
- question: Do the UCP2 variants reported in congenital hyperinsulinism impair C4-dicarboxylate/phosphate
    antiport in human beta cells, and is UCP2 haploinsufficiency sufficient to cause hyperinsulinism
    given that the reported variants were inherited from a parent?
- question: What fraction of UCP2-dependent changes in mitochondrial coupling reflects fatty-acid-activated
    proton leak versus reduced substrate oxidation caused by C4-metabolite export?
suggested_experiments:
- description: Measure malate/aspartate efflux, oxygen consumption and glucose-stimulated
    insulin secretion in human stem-cell-derived beta cells carrying UCP2 knockout or patient
    variants, rescued with wild-type or transport-dead UCP2, to test whether the secretion
    phenotype tracks antiport activity.
