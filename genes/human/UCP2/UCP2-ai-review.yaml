- term:
    id: GO:0015078
    label: proton transmembrane transporter activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - MGI:MGI:1099787
  - PANTHER:PTN000642156
  - UniProtKB:P25874
  - UniProtKB:P55851
  - UniProtKB:P55916
  review:
    summary: Proton transmembrane transporter activity.
    action: KEEP_AS_NON_CORE
    reason: >-
      Reconstituted UCP2 conducts protons when activated by long-chain fatty acids and inhibited by
      purine nucleotides, so the capability is directly measured and the term is kept. It is non-core
      because the core activity is the C4-dicarboxylate/phosphate antiport, and because a measured
      conductance is not evidence of the flux mattering in vivo. That is also what separates this row
      from GO:0017077 oxidative phosphorylation uncoupler activity, which is marked over-annotated: this
      term names a transport capability, whereas that one names a physiological consequence - the proton
      leak being large enough to uncouple respiration from ATP synthesis - which the same evidence does
      not support, and which UniProt denies for thermogenesis. Keeping one and rejecting the other is
      therefore not inconsistent; the two terms make claims of different strength.
    supported_by:
    - reference_id: PMID:26182433
      supporting_text: transported protons in the presence of physiologically-relevant fatty acid (FA) activators.
    - reference_id: PMID:22524567
      supporting_text: All three neuronal UCPs are able to transport protons across lipid membranes with characteristics similar to those of the archetypal protein UCP1, which is activated by fatty acids and inhibited by purine nucleotides.
    - reference_id: file:human/UCP2/UCP2-uniprot.txt
      supporting_text: cardiolipin and long-chain free fatty acids and inhibited by purine nucleotides ATP and ADP.
