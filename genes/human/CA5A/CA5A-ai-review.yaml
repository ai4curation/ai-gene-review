id: P35218
gene_symbol: CA5A
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CA5A encodes carbonic anhydrase VA, a zinc-dependent enzyme imported into the mitochondrial
  matrix after cleavage of an N-terminal targeting peptide. It catalyzes reversible interconversion
  of carbon dioxide and bicarbonate. Its bicarbonate production supplies mitochondrial carbamoyl-phosphate
  synthetase 1 and biotin-dependent carboxylases, linking this reaction to nitrogen disposal and intermediary
  metabolism without catalyzing their downstream reactions. Human loss-of-function variants can impair
  enzyme activity or stability and cause episodes of hyperammonemia and associated metabolic disturbances,
  particularly early in life.
