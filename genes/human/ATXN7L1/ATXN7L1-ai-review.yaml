knowledge_gaps:
- gap_statement: Whether ATXN7L1 is a subunit of a SAGA-like deubiquitination module (alternative to ATXN7),
    what its SCA7 domain binds, and what it does in cells are unknown.
  boundary: 'Established: SCA7 domain by sequence; recurrent USP22 interaction in AP-MS and IP-MS screens.
    Human Protein Atlas immunofluorescence reports nucleoplasm and cytosol; ATXN7L1 is not among the OpenCell
    tagged lines. Not established in any cited source (affinage found no mechanistic literature): complex
    membership, nucleosome binding, effect on H2B deubiquitination, or any phenotype.'
