suggested_questions:
- question: Does ATXN7L1 compete with ATXN7 for USP22, ATXN7L3 and ENY2, forming an alternative deubiquitination
    module, and does its SCA7 domain bind nucleosomes like ATXN7's?
suggested_experiments:
- description: Immunoprecipitate endogenous ATXN7L1 to test co-purification with ATXN7L3, ENY2 and SAGA
    core subunits, and measure H2B ubiquitination after ATXN7L1 knockout with or without ATXN7.
