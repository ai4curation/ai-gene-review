description: ATXN7L1 (ataxin-7-like protein 1) is a paralog of the SAGA subunit ATXN7. It shares ATXN7's
  zinc-finger SCA7 domain and is otherwise largely disordered. Its function is uncharacterized. In several
  independent interaction screens it binds USP22, the catalytic deubiquitinase of the SAGA deubiquitination
  module, suggesting it may associate with that module as ATXN7 does.
