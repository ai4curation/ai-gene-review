suggested_questions:
- question: >-
    Which membrane does SMIM18 occupy in neurons and pituitary cells, and is its N-terminus
    luminal (the N-x-T sequon at Asn6 would then be glycosylated)?
- question: >-
    Do SMIM18 and its relative SMIM22/CASIMO1 share any partner or function, given that their
    similarity is concentrated in the transmembrane helix and juxtamembrane cysteines?
suggested_experiments:
- hypothesis: SMIM18 is a single-pass membrane protein of a defined organelle in brain cells.
  description: >-
    Express epitope-tagged SMIM18 (or tag the endogenous locus) in a neuronal or pituitary
    cell line, co-stain with organelle markers, determine topology by protease protection and
    PNGase F sensitivity, and identify partners by proximity labelling.
