gene_symbol: SMIM18
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  SMIM18 (small integral membrane protein 18) is a 95-amino-acid (about 11 kDa) protein
  encoded on chromosome 8p12 within an intron of GTF2E2, on the opposite strand. It has a
  single predicted helical transmembrane segment (residues 35-55), preceded by a short
  N-terminal segment and followed by a cysteine cluster and a charged C-terminal tail. It
  belongs to the SMIM5/18/22 family, whose best studied member, SMIM22 (CASIMO1), is a
  membrane microprotein that binds squalene epoxidase. The resemblance is largely confined
  to the transmembrane region, so no function can be inferred from it. Orthologues are
  found across jawed vertebrates, including teleost fish. The protein has been detected by
  mass spectrometry, and its RNA is enriched in brain, pituitary gland and retina. Its
  membrane localisation is predicted from sequence; the specific membrane, topology,
  interaction partners and biological role are unknown, and no functional study of SMIM18
  has been published.
