historical_review_yaml: |
  id: P11413
  gene_symbol: G6PD
  product_type: PROTEIN
  status: INITIALIZED
  taxon:
    id: NCBITaxon:9606
    label: Homo sapiens
  description: Glucose-6-phosphate dehydrogenase (G6PD, EC 1.1.1.49) is the committed,
    rate-limiting first enzyme of the oxidative branch of the pentose phosphate pathway
    (hexose monophosphate shunt). It oxidises D-glucose-6-phosphate to
    6-phospho-D-glucono-1,5-lactone while reducing NADP+ to NADPH. G6PD is the principal
    cytosolic source of NADPH for reductive biosynthesis (fatty acids, cholesterol,
    nucleotides) and, most critically in erythrocytes, for regenerating reduced glutathione
    and defending cells against oxidative stress. The enzyme is active as a
    homodimer/homotetramer (dimer of dimers) and requires a tightly bound structural
    NADP+ in addition to the catalytic (cosubstrate) NADP+. G6PD deficiency is the most
    common human enzyme defect, affecting several hundred million people, and is X-linked;
    it causes acute oxidant-induced hemolytic anemia (favism from fava beans, certain
    drugs, and infection), neonatal jaundice, and, in severe variants, chronic
    nonspherocytic hemolytic anemia.
  alternative_products:
  - name: Short
    id: P11413-1
  - name: Long
    id: P11413-2
    sequence_note: VSP_001592
  - name: '3'
    id: P11413-3
    sequence_note: VSP_037802
  existing_annotations:
  - term:
      id: GO:0004345
      label: glucose-6-phosphate dehydrogenase activity
    evidence_type: IBA
    original_reference_id: GO_REF:0000033
    qualifier: enables
    review:
      summary: Core, well-supported molecular function. G6PD catalyzes the NADP+-dependent
        oxidation of glucose-6-phosphate, the first and rate-limiting step of the oxidative
        pentose phosphate pathway. The IBA call across metazoan, plant, fungal and bacterial
        orthologs correctly captures the conserved catalytic function.
      action: ACCEPT
      reason: This is the primary, extensively validated molecular function of G6PD,
        supported by human structural, kinetic, and disease-mutation studies.
      supported_by:
      - reference_id: file:human/G6PD/G6PD-uniprot.txt
        record_section: ["CC:FUNCTION"]
        supporting_text: Catalyzes the rate-limiting step of the oxidative pentose-
      - reference_id: PMID:15858258
        supporting_text: catalyses the first and rate-limiting step of the pentose phosphate shunt.
  - term:
      id: GO:0009051
      label: pentose-phosphate shunt, oxidative branch
    evidence_type: IBA
    original_reference_id: GO_REF:0000033
    qualifier: involved_in
    review:
      summary: Core biological process. G6PD is the entry enzyme of the oxidative branch
        of the pentose phosphate pathway, converting glucose-6-phosphate toward
        ribulose-5-phosphate while generating NADPH. This is the correct, specific BP term
        for the enzyme and is conserved across the ortholog set.
      action: ACCEPT
      reason: Directly corresponds to the pathway step catalyzed by G6PD; well supported
        phylogenetically and experimentally.
      supported_by:
      - reference_id: file:human/G6PD/G6PD-uniprot.txt
        record_section: ["CC:FUNCTION"]
        supporting_text: Catalyzes the rate-limiting step of the oxidative pentose-
  - term:
      id: GO:0005829
      label: cytosol
    evidence_type: IBA
    original_reference_id: GO_REF:0000033
    qualifier: is_active_in
    review:
      summary: Correct subcellular localization. G6PD is a soluble cytosolic enzyme that
        is active in the cytosol, consistent with the localization of the pentose phosphate
        pathway and with direct human immunofluorescence and fractionation data.
      action: ACCEPT
      reason: Cytosolic localization is well established for human G6PD and its orthologs.
      supported_by:
      - reference_id: file:human/G6PD/G6PD-uniprot.txt
        record_section: ["CC:SUBCELLULAR LOCATION"]
        supporting_text: Cytoplasm, cytosol
  - term:
      id: GO:0006006
      label: glucose metabolic process
    evidence_type: IBA
    original_reference_id: GO_REF:0000033
    qualifier: involved_in
    review:
      summary: G6PD acts on glucose-6-phosphate rather than free glucose; glucose metabolic
        process is a correct but more general parent term. The specific and informative
        annotations are the pentose-phosphate shunt (oxidative branch) BP terms and the
        glucose-6-phosphate metabolic process term.
      action: MARK_AS_OVER_ANNOTATED
      reason: The term is not wrong (the PPP is part of glucose catabolism) but is
        unnecessarily general given the more specific pentose-phosphate shunt and
        glucose 6-phosphate metabolic process annotations that better describe the enzyme.
      propagation_review:
        root_cause: TERM_SCOPING_PROBLEM
        failure_modes:
        - GRANULARITY_MISMATCH
        source_entities:
        - source_id: PANTHER:PTN000604427
          source_label: G6PD family node
          source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
          comment: G6PD acts on glucose-6-phosphate; the family-level glucose metabolic
            process term is a true but uninformative parent of the specific pentose-phosphate
            shunt annotations.
  - term:
      id: GO:0004345
      label: glucose-6-phosphate dehydrogenase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    review:
      summary: Electronic assignment of the core catalytic activity via ARBA/InterPro/EC
        1.1.1.49/RHEA:15841. Consistent with all experimental evidence.
      action: ACCEPT
      reason: Correct core molecular function; the IEA mapping to EC 1.1.1.49 is accurate.
  - term:
      id: GO:0005829
      label: cytosol
    evidence_type: IEA
    original_reference_id: GO_REF:0000044
    qualifier: located_in
    review:
      summary: UniProt subcellular-location keyword mapping to cytosol, matching the
        curated localization.
      action: ACCEPT
      reason: Accurate cytosolic localization consistent with experimental data.
      supported_by:
      - reference_id: file:human/G6PD/G6PD-uniprot.txt
        record_section: ["CC:SUBCELLULAR LOCATION"]
        supporting_text: Cytoplasm, cytosol
  - term:
      id: GO:0006006
      label: glucose metabolic process
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: involved_in
    review:
      summary: InterPro2GO transfer of a general glucose metabolic process term. As with
        the IBA call, this is a correct but overly general parent of the specific
        pentose-phosphate shunt annotations.
      action: MARK_AS_OVER_ANNOTATED
      reason: Superseded in specificity by the pentose-phosphate shunt and
        glucose-6-phosphate metabolic process terms.
  - term:
      id: GO:0016020
      label: membrane
    evidence_type: IEA
    original_reference_id: GO_REF:0000044
    qualifier: located_in
    review:
      summary: G6PD is a soluble cytosolic enzyme. A fraction can associate peripherally
        with the erythrocyte membrane, and UniProt records a peripheral membrane
        localization, but the bare "membrane" CC term is an over-annotation relative to
        the dominant cytosolic localization.
      action: MARK_AS_OVER_ANNOTATED
      reason: Only a minor, peripheral membrane-associated pool exists; the generic
        membrane term over-represents this as a primary location.
      supported_by:
      - reference_id: file:human/G6PD/G6PD-uniprot.txt
        record_section: ["CC:SUBCELLULAR LOCATION"]
        supporting_text: Membrane; Peripheral membrane protein
  - term:
      id: GO:0016614
      label: oxidoreductase activity, acting on CH-OH group of donors
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: Correct but general parent of glucose-6-phosphate dehydrogenase activity.
        G6PD is an NADP+-dependent oxidoreductase acting on the CH-OH group of
        glucose-6-phosphate.
      action: MARK_AS_OVER_ANNOTATED
      reason: The specific child term GO:0004345 is annotated and preferred; this parent
        term is redundant.
  - term:
      id: GO:0050661
      label: NADP binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    review:
      summary: G6PD binds NADP+ both as catalytic cosubstrate and as a structural cofactor.
        Electronic assignment is accurate and independently supported by human structural
        studies and kinetics.
      action: ACCEPT
      reason: NADP binding is an intrinsic, experimentally confirmed property of G6PD.
      supported_by:
      - reference_id: file:human/G6PD/G6PD-uniprot.txt
        record_section: ["CC:MISCELLANEOUS"]
        supporting_text: Binds two molecules of NADP. The first one is a
      - reference_id: PMID:15858258
        supporting_text: NADP(+) binding at the coenzyme site
  - term:
      id: GO:0005515
      label: protein binding
    evidence_type: IPI
    original_reference_id: PMID:21157431
    qualifier: enables
    review:
      summary: IntAct capture of a G6PD interaction with HSPB1/Hsp27 (P04792). Cosentino
