suggested_questions:
- question: What original assays support binding of free D-glucose, as distinct from glucose 6-phosphate,
    in the human and rat annotation chain?
- question: Which original 1968 experiments support pentose biosynthesis and erythrocyte maturation, and
    what target-specific evidence supports the substantia-nigra developmental assertion?
- question: Can the UniProt FUNCTION direction for NAADP/NAADPH be reconciled with PMID:34784249 and RHEA:86243
    without changing the retained source record?
- question: How do the 515-, 561- and 545-residue natural products differ in activity, assembly and localization
    under comparable conditions?
suggested_experiments:
- description: Compare purified, sequence-verified natural G6PD products using matched G6P/NADP+ turnover
    and oligomerization assays, distinguishing kinetic parameters from direct ligand-binding constants.
- description: Test free D-glucose and G6P binding separately with appropriate ligand and catalytic controls
    rather than infer one from the other.
