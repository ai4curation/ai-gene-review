core_functions:
- description: NADP+-dependent oxidation of glucose 6-phosphate initiates the oxidative pentose-phosphate
    pathway in the cytosol, generating NADPH. Catalytic and structural NADP+ sites support an enzyme that
    can assemble as active homodimers and tetramers. The reducing power supports redox buffering and biosynthesis
    through downstream enzymes; G6PD does not itself catalyze glutathione reduction or sterol synthesis.
