gene_symbol: G6PD
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Glucose-6-phosphate dehydrogenase is a soluble, predominantly cytosolic enzyme that oxidizes
  glucose 6-phosphate to 6-phosphogluconolactone while reducing NADP+ to NADPH. This reaction initiates
  the oxidative pentose-phosphate pathway and supplies reducing power for cellular redox buffering and
  biosynthesis. G6PD has catalytic and structural NADP+ binding sites and forms active homodimeric and
  tetrameric assemblies. Regulatory protein interactions and lysine acetylation modulate its activity,
  and a peripheral membrane-associated pool is documented. Deficiency particularly compromises erythrocyte
  redox homeostasis and can cause hemolytic anemia. Alternative splicing produces the canonical 515-residue
  protein and longer 561- and 545-residue products.
