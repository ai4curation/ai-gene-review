    supporting_text: we show that PEX39, a previously uncharacterized protein, is a cytosolic peroxin
      that facilitates the import of PTS2-containing proteins by binding PEX7 and stabilizing its
      interaction with cargo proteins containing a PTS2.
  - reference_id: PMID:40739340
    supporting_text: Handover of PEX7 from PEX39 to PEX13 via these motifs provides a new paradigm
      for peroxisomal protein import and biogenesis.
  - reference_id: PMID:40739340
    supporting_text: In contrast with the import of PTS2-containing proteins, recombinant HsPEX39
      had no effect on the import of PTS1-containing proteins in vitro, as assessed by import of the
      PTS1-containing protein SCP2
suggested_questions:
- question: Does PEX39 contact the PTS2 nonapeptide directly, as the AlphaFold model of the PEX7-PEX39-PHYH(1-24)
    complex predicts, or does its N-terminal region stabilize the PEX7 binding groove without touching
    the signal? This decides whether PEX39 should ever carry GO:0000268 peroxisome signal sequence
    receptor activity in addition to a carrier or adaptor term.
  experts:
  - Walter W. Chen
  - Jorge E. Azevedo
  - Bettina Warscheid
- question: How do PEX39 and PEX5L, the established human PTS2 co-receptor, act in sequence? Both are
    present in the same in vitro PEX7-PHYH-PEX39-PEX5 species, and PEX5(179-266) is predicted to displace
    the N-terminal portion of PEX39 while leaving the KPWE contact intact - is PEX39 required for PEX5L
    loading, or a parallel stabilizer?
  experts:
  - Tony A. Rodrigues
  - Jorge E. Azevedo
- question: Are PEX39 variants a cause or a modifier of human peroxisomal disease? Loss of PEX39 impairs
    but does not abolish PTS2 import, so PEX39 would be expected to produce a mild, PTS2-restricted
    phenotype rather than a Zellweger-spectrum presentation.
  experts:
  - Hans R. Waterham
suggested_experiments:
- hypothesis: The N-terminal region of PEX39 makes direct physical contact with the PTS2 nonapeptide
    of cargo bound to PEX7.
  description: Site-specific photo-crosslinking from within a PTS2 peptide (or from PEX39 residues
    predicted to contact it, e.g. L21) in reconstituted PEX7-cargo-PEX39 complexes, followed by mass
    spectrometric identification of the crosslinked partner. A positive PEX39-PTS2 crosslink that is
    lost in the PEX39 N-terminal truncation would establish direct signal binding.
  experiment_type: site-specific photo-crosslinking with MS readout
- hypothesis: PEX39 abundance is a rate-limiting parameter of PTS2 import, since both its loss and
    its overexpression impair import.
  description: Titrate PEX39 expression across a wide range in PEX39-knockout human cells using a
    dose-controlled promoter, and quantify the mature/precursor ratio of PHYH, AGPS and ACAA1 by immunoblot
    at each level, to establish whether import efficiency is a narrow optimum and where endogenous
    PEX39 sits on that curve.
  experiment_type: dose-response complementation with quantitative import readout
- hypothesis: PEX39 is dispensable for PTS1 import but required for the residual PTS2 import seen in
    hypomorphic PEX7 patient backgrounds.
  description: Knock out PEX39 in patient-derived fibroblasts carrying hypomorphic PEX7 alleles
    (rhizomelic chondrodysplasia punctata type 1) and matched controls, and measure plasmalogen
    synthesis, phytanic acid alpha-oxidation and PTS2 precursor processing. This tests the modifier
    hypothesis directly in a human genetic background.
  experiment_type: genetic interaction test in patient fibroblasts
