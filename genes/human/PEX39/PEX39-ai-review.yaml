description: >-
  PEX39 (peroxisomal biogenesis factor 39, formerly C6orf226) is a small (101-residue)
  cytosolic peroxin of the type 2 peroxisomal targeting signal (PTS2) protein import pathway.
  It is built around a DUF5572/KPWE module and its most conserved feature, an (R/K)PWE motif,
  is shared with the N terminus of the peroxisomal membrane protein PEX13. PEX39 binds the
  PTS2 receptor PEX7 with nanomolar affinity through this motif while its N-terminal region
  wraps onto the receptor, clamping PEX7 onto PTS2-bearing cargo such as phytanoyl-CoA
  2-hydroxylase (PHYH), alkyl-dihydroxyacetone phosphate synthase (AGPS) and peroxisomal
  thiolase (ACAA1) and stabilizing an interaction that is otherwise weak. The PEX39-PEX7
  interaction is deliberately labile: at the peroxisomal membrane PEX39 is displaced by the
  competing KPWE motif of PEX13, handing the loaded receptor to the docking/translocation
  machinery. PEX39 acts only on the PTS2 branch of matrix protein import and has no effect on
  PTS1 cargo. Loss of PEX39 causes accumulation of unprocessed PTS2 precursors in the cytosol
  in both yeast and human cells, and excess PEX39 is also inhibitory, so the protein is
  normally kept at low abundance. The gene is conserved from budding yeast (Yjr012c/Pex39) to
  human, and the presence of PEX39 across eukaryotes tracks the presence of the PEX13 KPWE
  motif.
