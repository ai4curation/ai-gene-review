- term:
    id: GO:0016560
    label: protein import into peroxisome matrix, docking
  evidence_type: IMP
  original_reference_id: PMID:40739340
  qualifier: involved_in
  review:
    summary: CRISPR knockout of PEX39 in two human cell lines caused accumulation of precursor PHYH
      in the cytosolic fraction and loss of mature PHYH from the organellar fraction; the equivalent
      PTS2 import defect was seen in Scpex39-delta yeast.
    action: ACCEPT
    reason: Correct participation in PTS2 matrix import, and the docking sub-process is a defensible
      placement because PEX39's mechanistic contribution ends exactly at the membrane, where its
      KPWE motif is exchanged for the competing KPWE motif of PEX13 and the loaded receptor is handed
      to the docking/translocation module. The caveat worth recording is that the measured phenotype
      is failure of PTS2 import as a whole (GO:0016558, the parent), and that a large part of PEX39's
      work - clamping PEX7 onto cargo - happens in the cytosol upstream of docking; GO currently
      has no child term for receptor cargo loading.
    supported_by:
    - reference_id: PMID:40739340
      supporting_text: Importantly, cellular fractionation revealed that HsPEX39 loss led to an accumulation
        of precursor PHYH in the cytosolic fraction and a decrease of mature PHYH in the organellar
        fraction, thus demonstrating impaired import of PTS2-containing proteins
    - reference_id: PMID:40739340
      supporting_text: These results suggest that PEX39 must dissociate from PEX7 to allow PEX7 to
        bind the N terminus of PEX13 at the peroxisome, a handover mechanism that would be facilitated
        if the PEX39–PEX7 interaction were labile.
- term:
    id: GO:0000268
    label: peroxisome signal sequence receptor activity
  evidence_type: IDA
  original_reference_id: PMID:40739340
  qualifier: enables
  review:
    summary: The 2025 paper is correctly cited and PEX39 is genuinely a PTS2-pathway factor, but
      this particular term asserts more than the paper shows. GO defines GO:0000268 as "Binding
      to a peroxisomal targeting sequence"; the same paper reports that PEX39 on its own does not
      bind a PTS2 cargo protein at all. PEX39 binds PEX7 through its KPWE motif and clamps the receptor
      onto cargo, which is co-receptor behaviour rather than receptor behaviour.
    action: MODIFY
    reason: The essence is sound and the annotation must not be discarded - PEX39 is an experimentally
      demonstrated component of PTS2 receptor function. What is wrong is the choice of the receptor
      term. Native PAGE shows PEX39 cannot form a complex with PHYH alone, so an independent PTS2-binding
      activity is not established (a direct PEX39-PTS2 contact is predicted by AlphaFold and is consistent
      with the N-terminal truncation data, but was never measured as a separate binding event). GO:0140597
      protein carrier chaperone (renamed "protein carrier activity" in current GO; "Directly binding to a protein and delivering it either to an acceptor
      molecule or to a specific location") describes what was actually demonstrated - high-affinity
      binding of PEX7 and its delivery to PEX13 - and is the term the budding-yeast PTS2 co-receptor
      Pex21 (UniProtKB:P50091) already carries with IDA evidence, so the change keeps PEX39 consistent
      with existing GO treatment of PTS2 co-receptors. GO:0030674 protein-macromolecule adaptor activity
      would be a defensible alternative for the clamping step alone.
    supported_by:
    - reference_id: PMID:40739340
      supporting_text: HsPEX39 could not complex with either PEX5 or PHYH alone, per native PAGE
    - reference_id: PMID:40739340
      supporting_text: Collectively, our data indicate that PEX39 stabilizes the interaction between
        PEX7 and PTS2-containing proteins, thereby providing a mechanism by which PEX39 facilitates
        the import of PTS2-containing proteins.
    - reference_id: PMID:40739340
      supporting_text: Because of the labile nature of the PEX39–PEX7 interaction via the (R/K)PWE
        motif, PEX39 can now be exchanged with the PEX13 N terminus, which also contains a KPWE motif
        (steps 4 and 5), thus handing PEX7 over from PEX39 to PEX13.
    proposed_replacement_terms:
    - id: GO:0140597
      label: protein carrier chaperone
