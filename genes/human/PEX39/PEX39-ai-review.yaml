core_functions:
- description: >-
    PEX39 is the cytosolic cargo-loading and delivery factor of the PTS2 branch of peroxisomal
    matrix protein import. Through the conserved KPWE motif at the C terminus of its DUF5572 module
    it binds the PTS2 receptor PEX7 with nanomolar affinity, while its N-terminal region folds around
    PEX7 to contact the bound targeting signal, acting as a clamp that converts the intrinsically weak
    PEX7-PTS2 interaction into a stable receptor-cargo complex. That grip is deliberately weak enough
    to be reversed: at the peroxisomal membrane the equivalent KPWE motif in the N terminus of PEX13
    competes for the same surface of PEX7, displacing PEX39 and transferring the loaded receptor to
    the docking/translocation module. PEX39 thus binds a protein and delivers it to a specific acceptor,
    and it does so only for the PTS2 pathway - recombinant PEX39 has no effect on PTS1 cargo import.
  molecular_function:
    id: GO:0140597
    label: protein carrier chaperone
  directly_involved_in:
  - id: GO:0016560
    label: protein import into peroxisome matrix, docking
  locations:
