- id: PMID:10577904
  title: Loss-of-function mutations in a human gene related to Chlamydomonas reinhardtii dynein IC78 result
    in primary ciliary dyskinesia.
  findings:
  - statement: Human DNAI1 encodes an axonemal intermediate-chain protein; truncating variants were found
      with immotile respiratory cilia lacking outer arms.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Genuine full original read in the independent core consultation: human cDNA, genotype
      and respiratory ultrastructure establish identity and outer-arm contribution. No isolated DNAI1
      motor assay.'
- id: PMID:11231901
  title: Axonemal dynein intermediate-chain gene (DNAI1) mutations result in situs inversus and primary
    ciliary dyskinesia (Kartagener syndrome).
  findings:
  - statement: Human DNAI1 mutations cause primary ciliary dyskinesia with variable laterality among affected
      families.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Identifier and abstract verified. Full-original recovery did not succeed; detailed sperm
      and localization assertions are retained with curator deference where independently established.
  full_text_unavailable: true
- id: PMID:15750039
  title: Mislocalization of DNAH5 and DNAH9 in respiratory cells from patients with primary ciliary dyskinesia.
  findings:
  - statement: In the examined DNAI1-mutant respiratory cells, DNAH5 is retained proximally but lost distally,
      and DNAH9 is absent from axonemes.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Normal cache remains abstract-only; separately recovered genuine PMC original Methods,
      target Results, table and Discussion were read.
- id: PMID:16858015
  title: 'Mutations of DNAI1 in primary ciliary dyskinesia: evidence of founder effect in a common mutation.'
  findings:
  - statement: DNAI1 disease variants are associated with outer-dynein-arm defects in human primary ciliary
      dyskinesia.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full-cache Methods, genotyping and ultrastructural Results read; uncertain monoallelic
      variants are not conflated with biallelic disease alleles.
- id: PMID:17515466
  title: Congenital heart disease and other heterotaxic defects in a large cohort of patients with primary
