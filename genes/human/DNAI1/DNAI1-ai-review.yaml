id: Q9UI46
gene_symbol: DNAI1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: DNAI1 is a noncatalytic intermediate-chain subunit of axonemal outer dynein arms. It helps
  organize the dynein motor complex and supports ciliary beating and flagellated sperm movement. The mature
  protein is associated with axonemes, while a cytoplasmic pool occupies dynein axonemal particles during
  motor assembly and deployment. Biallelic loss-of-function variants cause primary ciliary dyskinesia
  with outer-arm defects, which can affect respiratory function, fertility and left-right body patterning.
alternative_products:
- name: '1'
  id: Q9UI46-1
  description: The 699-residue reference product contains seven annotated WD repeats and corresponds in
    length to the originally cloned human protein.
- name: '2'
  id: Q9UI46-2
  sequence_note: VSP_056963, VSP_056964
  description: The 168-residue product retains reference residues 1–87, replaces residues 88–168 and lacks
    residues 169–699, including the annotated WD-repeat regions. Its contribution to dynein assembly and
    motility is unresolved.
