  evidence_type: TAS
  original_reference_id: PMID:10577904
  qualifier: enables
  review:
    summary: The unqualified motor-activity assertion exceeds the role established for this noncatalytic
      intermediate chain.
    action: MARK_AS_OVER_ANNOTATED
    reason: The human cloning, sequence and respiratory-ultrastructure experiments identify DNAI1 as
      an outer-arm intermediate chain whose loss disrupts the motor complex. The intermediate-chain
      identity and WD-repeat architecture support a structural interaction role in the motor complex,
      rather than identifying DNAI1 as the force-generating heavy chain. Refining GO:0003774 to GO:0003777
      while retaining enables would preserve that excess claim. The imported qualifier remains unchanged
      as source metadata; the core separately records contribution to microtubule motor activity. The
      paper does not directly assay a human DNAI1 heavy- or light-chain interface, so those binding
      terms are not substituted on this source alone.
    supported_by:
    - reference_id: PMID:10577904
