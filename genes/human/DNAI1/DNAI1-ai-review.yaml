core_functions:
- description: DNAI1 forms an intermediate-chain interaction unit within outer dynein arms, with conserved
    contacts to dynein heavy and light chains. As a noncatalytic component it contributes to microtubule
    motor activity, outer-arm assembly and ciliary or sperm movement. The mature motor pool is axonemal;
    DNAI1 also occupies cytoplasmic DynAPs during the assembly/deployment stage, whose exact reaction
    sequence remains unresolved.
  molecular_function:
    id: GO:0045504
    label: dynein heavy chain binding
  contributes_to_molecular_function:
    id: GO:0003777
    label: microtubule motor activity
