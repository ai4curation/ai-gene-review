- id: PMID:18950741
  title: DNAI2 mutations cause primary ciliary dyskinesia with defects in the outer dynein arm.
  findings:
  - statement: DNAI1-mutant human respiratory cells can retain proximal DNAI2 while losing distal DNAI2,
      showing partial preservation of outer-arm assembly.
