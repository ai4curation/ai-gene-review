id: Q86YT5
gene_symbol: SLC13A5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SLC13A5 encodes NaCT (Na+/citrate cotransporter; NaC2), a plasma-membrane,
  sodium-coupled, high-affinity transporter of the SLC13/DASS (divalent anion:Na+
  symporter) family and the human ortholog of Drosophila Indy. It mediates the
  electrogenic, Na+-dependent import of extracellular (circulating) citrate into
  cells, recognizing the trivalent citrate anion with a stoichiometry of about
  four Na+ per citrate. NaCT functions as a homodimer that moves substrate by an
  elevator-type mechanism. It is expressed most strongly in liver and also in
  brain neurons and testis, where it supplies cytosolic citrate used as a carbon
  source for fatty-acid and cholesterol synthesis and for energy metabolism;
  neurons in particular depend on citrate import because they cannot synthesize
  tricarboxylic-acid-cycle intermediates de novo. Citrate is the physiological
  substrate; succinate and other di-/tricarboxylic acids are transported with
  substantially lower affinity. Biallelic loss-of-function variants cause autosomal-recessive
  developmental and epileptic encephalopathy 25 with amelogenesis imperfecta
  (DEE25; "SLC13A5 citrate transporter disorder"), with neonatal seizures, severe
  developmental delay and tooth hypoplasia; NaCT is also a drug target for
  metabolic disease.
