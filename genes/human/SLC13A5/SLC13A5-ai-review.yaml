      -p.L488P) lead to a complete loss of NaCT-mediated citrate transport'
- description: Sodium-coupled symport mechanism; NaCT couples downhill Na+ entry to
    the uphill import of the organic acid citrate, making citrate uptake electrogenic
    and sodium-dependent.
