id: Q07352
gene_symbol: ZFP36L1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'ZFP36L1 encodes BRF1/TIS11B, a TTP-family tandem CCCH zinc-finger RNA-binding
  protein. ZFP36L1 binds AU-rich 3''-UTR elements and recruits mRNA decay machinery
  to destabilize target transcripts, with documented human targets including VEGFA,
  LDLR, BCL2, CDK6, NR3C2, and STAT5B mRNAs and an additional nuclear role in DLL4
  mRNA 3''-end processing.'
