core_functions:
- description: ZFP36L1 binds AU-rich 3'-UTR elements and couples target
    transcripts to CCR4-NOT and other mRNA decay machinery, promoting cytosolic
    3'-UTR-mediated destabilization of mRNAs such as VEGFA, LDLR, BCL2 and CDK6.
