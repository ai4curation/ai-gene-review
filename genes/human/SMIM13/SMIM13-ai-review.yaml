description: >-
  SMIM13 (formerly C6orf228) is a 91-amino-acid (about 10.4 kDa) protein of the SMIM13
  family (Pfam DUF4750). It has a single predicted transmembrane helix near the N terminus
  (residues 10-30), and its C-terminal half (residues 47-91) is predicted to be
  intrinsically disordered, with basic and mixed-charge stretches; four serine/threonine
  residues in this tail are annotated as phosphorylation sites by similarity to the mouse
  protein. The transcript is detected in all tissues and is enriched in brain. Antibody
  staining in the Human Protein Atlas gives nucleoplasm as the main signal, with nuclear
  membrane and Golgi apparatus as additional locations; the membrane in which the protein
  actually resides has not been established by an orthogonal method. No molecular
  activity, interaction partner or biological process has been reported for SMIM13.
