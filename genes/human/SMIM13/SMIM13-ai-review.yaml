suggested_questions:
- question: >-
    In which membrane does endogenous SMIM13 reside? Antibody staining suggests nuclear
    envelope and Golgi, but the main nucleoplasmic signal is unexpected for an integral
    membrane protein and needs an orthogonal method.
- question: >-
    Is SMIM13 phosphorylated in human cells, and does phosphorylation of its disordered
    C-terminal tail affect localisation or partners?
suggested_experiments:
- hypothesis: SMIM13 is an integral membrane protein of the nuclear envelope or Golgi.
  description: >-
    Express endogenously tagged SMIM13 and co-stain with nuclear envelope (LMNB1, SUN2)
    and Golgi (GOLGA2) markers; confirm membrane integration by carbonate extraction, and
    validate the commercial antibody in knockout cells.
