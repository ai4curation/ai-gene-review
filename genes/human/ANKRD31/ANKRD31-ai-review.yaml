  review:
    summary: Homologous chromosome pairing at meiosis (ISS). Pairing fails in Ankrd31-null spermatocytes,
      as a consequence of defective DSB formation; kept as non-core, following the MGI convention for
      DSB-machinery genes.
    action: KEEP_AS_NON_CORE
    reason: '[PMID:31003867 "Unrepaired DSBs and pairing failures-stochastic on autosomes, nearly absolute
      on X and Y-cause meiotic arrest and sterility in males."] The pairing defect follows from the DSB
      defect, not from a separate pairing activity, which is what the acts_upstream_of_or_within qualifier
      encodes; GOA''s involved_in overstates it. MGI annotates other DSB-machinery proteins (MEI4, IHO1,
      SPO11) to this term by IMP, so the transfer is consistent with that convention.'
    supported_by:
