suggested_questions:
- question: PAR hyperaccumulation of DSB factors requires ANKRD31 and is linked to mo-2 minisatellite
    arrays (PMID:32461690). Does ANKRD31 recognize mo-2 chromatin itself, or a protein bound there?
- question: Is the reported epididymal role of ANKRD31 compatible with the founding study's finding of
    no somatic defects in null mice?
suggested_experiments:
- description: Test whether ANKRD31 binds mo-2 minisatellite DNA or chromatin directly (in vitro binding,
    and occupancy mapping in mo-2-deleted spermatocytes), to identify the chromosomal partner of its adaptor
    activity.
