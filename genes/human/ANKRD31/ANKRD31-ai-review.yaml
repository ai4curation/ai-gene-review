  review:
    summary: Protein-macromolecule adaptor activity (NEW, ISS from mouse ANKRD31). ANKRD31 binds the REC114
      PH domain directly and links REC114 and other DSB-promoting factors to chromosome axes and the PAR.
    action: NEW
    reason: '[PMID:31003867 "A crystal structure defines a pleckstrin homology (PH) domain in REC114 and
      its direct intermolecular contacts with ANKRD31."] [PMID:31003867 "In vivo, ANKRD31 stabilizes REC114
      association with the PAR and elsewhere."] It has several partners [PMID:37976262 "ANKRD31 interacts
      with multiple proteins, including the conserved and essential DSB-promoting factor REC114"], and
      UniProt adds IHO1 [file:human/ANKRD31/ANKRD31-uniprot.txt "CC       with IHO1. {ECO:0000250|UniProtKB:A0A140LI88}."]
      Alleles that remove only the REC114 contact, [PMID:37976262 "without diminishing contacts with other
      known partners"], phenocopy the null [PMID:37976262 "A complete lack of the ANKRD31-REC114 interaction
      mimicked an Ankrd31 null, with delayed DSB formation and recombination, defects in DSB repair, and
      altered DSB locations including failure to target DSBs to the PARs."] So the binding is the function:
      ANKRD31 holds REC114 at chromosomal sites. Its PH-domain surface is shared, competitively, with
      IHO1 and TOPOVIBL [PMID:37431931 "IHO1 directly interacts with the PH domain of REC114 by recognizing
      the same surface as TOPOVIBL and another meiotic factor ANKRD31"], which shows that ANKRD31 engages
      a defined REC114 interface. None of the cited papers identifies the chromosomal partner that ANKRD31
      binds.'
