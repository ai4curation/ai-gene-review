core_functions:
- description: Meiosis-specific scaffold that binds the REC114 PH domain and anchors DSB-promoting factors
    on chromosome axes, controlling where and when meiotic DSBs form, including in the pseudoautosomal
    region.
  directly_involved_in:
  - id: GO:0010780
    label: meiotic DNA double-strand break formation involved in reciprocal meiotic recombination
  locations:
  - id: GO:0005694
    label: chromosome
  supported_by:
  - reference_id: PMID:31000436
    supporting_text: We identify ANKRD31 as a key component of complexes of DSB-promoting proteins that
      assemble on meiotic chromosome axes.
  - reference_id: PMID:31003867
    supporting_text: A crystal structure defines a pleckstrin homology (PH) domain in REC114 and its direct
      intermolecular contacts with ANKRD31.
  - reference_id: PMID:31003867
    supporting_text: In vivo, ANKRD31 stabilizes REC114 association with the PAR and elsewhere.
  - reference_id: PMID:37976262
    supporting_text: A complete lack of the ANKRD31-REC114 interaction mimicked an Ankrd31 null, with
      delayed DSB formation and recombination, defects in DSB repair, and altered DSB locations including
      failure to target DSBs to the PARs.
  - reference_id: PMID:31003867
    supporting_text: Spermatocytes lacking ANKRD31 have altered DSB locations and fail to target DSBs
      to the pseudoautosomal regions (PARs) of sex chromosomes.
proposed_new_terms: []
suggested_questions:
- question: What does ANKRD31 bind on the chromosome axis or in the pseudoautosomal region to anchor REC114
    there?
- question: Is the reported epididymal role of ANKRD31 compatible with the founding study's finding of
    no somatic defects in null mice?
suggested_experiments:
- description: Map ANKRD31 chromatin occupancy (for example by CUT&RUN in spermatocytes) relative to PAR
    mo-2 minisatellites and axis proteins, to identify what recruits it.
