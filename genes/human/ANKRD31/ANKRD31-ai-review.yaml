id: Q8N7Z5
gene_symbol: ANKRD31
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ANKRD31 (ankyrin repeat domain-containing 31) is a meiosis-specific scaffold of the machinery
  that makes programmed DNA double-strand breaks (DSBs). On meiotic chromosome axes it binds the pleckstrin-homology
  domain of REC114 directly and stabilizes REC114 and other DSB-promoting factors on chromosomes. This
  controls the timing, number and location of meiotic DSBs, and is essential for the very high DSB rate
  in the pseudoautosomal region that ensures X-Y crossing over. Ankrd31-null male mice are sterile, with
  delayed DSBs, unrepaired breaks and X-Y pairing failure; null females have reduced oocyte reserves.
  In humans, heterozygous ANKRD31 variants that weaken REC114 binding are found in premature ovarian insufficiency.
  A role in the epididymal epithelium has also been reported.
