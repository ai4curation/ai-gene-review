- id: PMID:31003867
  title: REC114 Partner ANKRD31 Controls Number, Timing, and Location of Meiotic DNA Breaks.
  findings:
  - statement: ANKRD31 directly binds the REC114 PH domain.
    supporting_text: A crystal structure defines a pleckstrin homology (PH) domain in REC114 and its direct
      intermolecular contacts with ANKRD31.
  - statement: ANKRD31 loss mislocalizes DSBs and abolishes PAR DSBs.
    supporting_text: Spermatocytes lacking ANKRD31 have altered DSB locations and fail to target DSBs
      to the pseudoautosomal regions (PARs) of sex chromosomes.
  - statement: ANKRD31 loss paradoxically raises DSB numbers.
    supporting_text: They also have delayed and/or fewer recombination sites but, paradoxically, more
      DSBs, suggesting DSB dysregulation.
  - statement: Ankrd31-null males are sterile with pairing failure.
    supporting_text: Unrepaired DSBs and pairing failures-stochastic on autosomes, nearly absolute on
      X and Y-cause meiotic arrest and sterility in males.
  - statement: Ankrd31-null females have reduced oocyte reserves.
    supporting_text: Ankrd31-deficient females have reduced oocyte reserves.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text; mouse. Defining study and one of two sources of the mouse IMP/EXP rows behind
      every human ISS.
- id: PMID:31000436
  title: Mouse ANKRD31 Regulates Spatiotemporal Patterning of Meiotic Recombination Initiation and Ensures
    Recombination between X and Y Sex Chromosomes.
  findings:
  - statement: ANKRD31 is a component of axis-bound DSB-promoting complexes.
    supporting_text: We identify ANKRD31 as a key component of complexes of DSB-promoting proteins that
      assemble on meiotic chromosome axes.
  - statement: ANKRD31 loss delays recombination initiation.
    supporting_text: Genome-wide, ANKRD31 deficiency causes delayed recombination initiation.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only; mouse. Independent co-founding study.
  full_text_unavailable: true
- id: PMID:37976262
  title: Essential roles of the ANKRD31-REC114 interaction in meiotic recombination and mouse spermatogenesis.
  findings:
  - statement: Loss of the REC114 interaction phenocopies the null.
    supporting_text: A complete lack of the ANKRD31-REC114 interaction mimicked an Ankrd31 null, with
      delayed DSB formation and recombination, defects in DSB repair, and altered DSB locations including
      failure to target DSBs to the PARs.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text; mouse separation-of-function alleles.
- id: PMID:34257419
  title: Pathogenic variants of meiotic double strand break (DSB) formation genes PRDM9 and ANKRD31 in
    premature ovarian insufficiency.
  findings:
  - statement: Heterozygous ANKRD31 variants weakening REC114 binding occur in POI.
    supporting_text: the ANKRD31 variations disturbed its interaction with another DSB formation factor
      REC114 by haploinsufficiency effect
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text; human genetics with functional interaction tests.
- id: PMID:34820371
  title: Ankrd31 in Sperm and Epididymal Integrity.
  findings:
  - statement: ANKRD31 interacts with epididymal junction proteins.
    supporting_text: we showed the physical interaction among ANKRD31 and some epithelial junction proteins
      in wild-type (WT) epididymides
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Full text; mouse. Its proposed somatic epididymal role sits uneasily with the founding
      study's report of no somatic defects; no GO term drawn.
