- id: PMID:24191001
  title: Assembly factors for the membrane arm of human complex I.
  findings:
  - statement: >-
      Suppressing expression of the NDUFA11 subunit disrupted Complex I assembly and caused
      subcomplexes of 550 and 815 kDa to accumulate, providing the stalled intermediates in
      which assembly factors could be identified.
    supporting_text: "assembly of the complex, and subcomplexes with masses of 550 and 815 kDa"
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: >-
      Eight known extrinsic assembly factors plus a hydrophobic protein, C3orf1 (= TIMMDC1),
      were associated with those subcomplexes - the observation that first placed TIMMDC1 on
      Complex I assembly intermediates.
    supporting_text: "protein, C3orf1, were associated with the subcomplexes. The characteristics of"
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: >-
      The characteristics of C3orf1 (TIMMDC1), of TMEM126B and of NDUFA11 suggest that all
      three participate in constructing the membrane arm of Complex I - the basis for the
      UniProt FUNCTION statement and for the core biological process annotated here.
    supporting_text: "C3orf1, of another assembly factor, TMEM126B, and of NDUFA11 suggest that they"
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (DOI:10.1073/pnas.1319247110); the experimental source cited by UniProt
      for the TIMMDC1 FUNCTION and SUBUNIT statements. The abstract is now present in the
      local publications cache (content_type: abstract_only), so the findings above quote it
      verbatim; an earlier version of this review recorded the paper as uncached.
- id: PMID:25416956
  title: A proteome-scale map of the human interactome network.
  findings:
  - statement: >-
      A systematic map of roughly 14,000 high-quality human binary protein-protein
      interactions, generated without hypothesis-driven selection; the TIMMDC1 hit it
      contributes (FATE1) is screen-derived and lacks mitochondrial context.
    supporting_text: "systematic map of ?14,000 high-quality human binary protein-protein interactions"
