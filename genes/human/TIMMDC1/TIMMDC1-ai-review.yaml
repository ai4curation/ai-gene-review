- id: PMID:33961781
  title: Dual proteome-scale networks reveal cell-specific remodeling of the human
    interactome.
  findings:
  - statement: >-
      BioPlex 3.0 was built by affinity purification of 10,128 human proteins in 293T cells,
      giving 118,162 interactions among 14,586 proteins; the TIMMDC1-NDUFB11 edge recorded
      here comes from this network.
    supporting_text: "of 10,128 human proteins-half the proteome-in 293T cells and includes 118,162"
    reference_section_type: ABSTRACT
  - statement: >-
      The study separates interactions shared across the 293T and HCT116 networks, which
      reside in core complexes and involve essential proteins, from cell-specific ones that
      link those complexes. It does not report whether the TIMMDC1-NDUFB11 edge is among the
      shared set: the edge recorded here comes from BioPlex 3.0, which is the 293T network,
      so this statistic says nothing about that particular contact. What makes the edge
      biologically plausible is the identity of the partner - NDUFB11 is a Complex I
      membrane-arm (ND) subunit - not its recovery across cell lines.
    supporting_text: "and involve essential proteins, cell-specific interactions link these complexes,"
    reference_section_type: ABSTRACT
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      BioPlex 3.0 AP-MS; source of a GO:0005515 IPI whose WITH/FROM partner
      NDUFB11 (a Complex I membrane-arm subunit) is biologically consistent with
      the membrane-arm assembly role, though the MF term itself is uninformative.
- id: PMID:34800366
