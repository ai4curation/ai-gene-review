- id: Reactome:R-HSA-6799178
  title: Intermediate 1 binds HP subcomplex to form Intermediate 2
  findings:
  - statement: >-
      The hydrophobic protein (HP) fraction is anchored to the inner mitochondrial membrane
      by the Intermediate 1 assembly factors NDUFAF3 (C3orf60), NDUFAF4 (C6orf66) and
      TIMMDC1 (C3orf1) to form Intermediate 2.
    supporting_text: "anchored to the inner mitochondrial membrane by Intermediate"
    reference_section_type: DATABASE_ENTRY
- id: Reactome:R-HSA-6799179
  title: Peripheral arm subunits bind the 815kDa complex to form a 980kDa complex
  findings:
  - statement: >-
      The peripheral (flavoprotein) arm subunits join the 815 kDa intermediate to form the
      980 kDa complex, a late step of the inner-membrane Complex I biogenesis pathway.
    supporting_text: "Subunits NDUFA12, NDUFS1, 4, 6, NDUFV1, 2 and 3 with the assembly factor"
    reference_section_type: DATABASE_ENTRY
- id: Reactome:R-HSA-6799191
  title: Intermediate 2 binds MT-ND1:NDUFAF5:NDUFAF6 to form a 315kDa subcomplex
  findings:
  - statement: >-
      The 315 kDa intermediate - the subcomplex UniProt records TIMMDC1 as associating with -
      is centred on the core iron-sulfur subunits NDUFS2 and NDUFS3, and the IP subcomplex is
      anchored to the inner mitochondrial membrane by MT-ND1.
    supporting_text: "to the inner mitochondrial membrane by NADH-ubiquinone oxidoreductase chain 1"
    reference_section_type: DATABASE_ENTRY
- id: Reactome:R-HSA-6799196
  title: The MCIA complex, NDUFAF2-7 all dissociate from the 980kDa complex, resulting
    in Complex I
  findings:
  - statement: >-
      In the final step of Complex I biogenesis the MCIA complex and the assembly factors
      NDUFAF2-7 and TIMMDC1 dissociate from the 980 kDa complex to leave mature Complex I,
      confirming that TIMMDC1 is transient and not a holoenzyme subunit.
    supporting_text: "The MCIA complex, NDUFAF2-7 all dissociate from the 980kDa complex"
    reference_section_type: DATABASE_ENTRY
- id: Reactome:R-HSA-6799197
  title: ND4, ND5 bind the 550kDa complex to form the 815kDa complex
  findings:
  - statement: >-
      The distal membrane-arm subunits MT-ND4 and MT-ND5 associate with the 550 kDa complex
      to form the 815 kDa complex, requiring DMAC1 and DMAC2 - part of the membrane arm whose
      construction TIMMDC1 supports.
    supporting_text: "Distal components of the membrane arm MT-ND4 and 5 associate with the 550kDa"
    reference_section_type: DATABASE_ENTRY
- id: Reactome:R-HSA-6799202
  title: The 315kDa subcomplex binds the 370kDa subcomplex to form the 550kDa complex
  findings:
  - statement: >-
      The 315 kDa and 370 kDa subcomplexes associate to form the 550 kDa complex, an
      intermediate step of the inner-membrane Complex I biogenesis pathway.
    supporting_text: "The 315kDa and 370kDa subcomplexes associate to form a 550kDa complex"
    reference_section_type: DATABASE_ENTRY
- id: Reactome:R-HSA-6799203
  title: IP subcomplex binds NDUFAF3, NDUFAF4, TIMMDC1 to form Intermediate 1
  findings:
  - statement: >-
      Complex I assembly begins with a 315 kDa subcomplex centred on the core iron-sulfur
      subunits NDUFS2 and NDUFS3; the IP subcomplex then binds NDUFAF3, NDUFAF4 and TIMMDC1
      to form Intermediate 1. This is the step in which TIMMDC1 itself acts.
    supporting_text: "around the core subunits NADH dehydrogenase [ubiquinone] iron-sulfur proteins 2"
    reference_section_type: DATABASE_ENTRY
