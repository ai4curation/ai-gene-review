- id: PMID:31515488
  title: Extensive disruption of protein interactions by genetic variants across the
    allele frequency spectrum in human populations.
  findings:
  - statement: >-
      The study assayed 2,009 missense SNVs across 2,185 protein-protein interactions to
      measure which coding variants disrupt binding; it is a variant-perturbation screen
      over an existing interaction set, not a discovery of physiological TIMMDC1 partners.
    supporting_text: "missense single nucleotide variants (SNVs) across 2185 protein-protein"
    reference_section_type: ABSTRACT
  - statement: >-
      Roughly 10.5% of the missense variants carried per individual were found to be
      interaction-disruptive, so the assay's purpose is population-genetic rather than
      functional characterization of any single protein.
    supporting_text: "carried per individual are disruptive, a higher proportion than previously"
    reference_section_type: ABSTRACT
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      High-throughput variant-interaction study; source of an uninformative
      GO:0005515 IPI (WITH/FROM FATE1).
- id: PMID:32296183
  title: A reference map of the human binary protein interactome.
  findings:
  - statement: >-
      HuRI is a systematic all-by-all yeast two-hybrid screen of about 90% of the
      protein-coding genome, yielding 52,569 verified binary PPIs among 8,275 proteins; this
      is the source of the many non-mitochondrial TIMMDC1 partners (SCD, STX6, YIF1A and
      others).
    supporting_text: "we refer to HI-III-20 as a reference map of the human binary protein interactome (HuRI)"
    reference_section_type: RESULTS
  - statement: >-
      The authors note that the cellular function of most individual PPIs in the map remains
      to be elucidated, which is why a HuRI-derived 'protein binding' annotation conveys no
      molecular function for TIMMDC1.
    supporting_text: "the cellular function of most individual PPIs remains to be elucidated"
    reference_section_type: DISCUSSION
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      HuRI Y2H reference interactome; source of many uninformative GO:0005515 IPIs
      whose partners are mostly non-mitochondrial membrane proteins (Y2H noise).
- id: PMID:33753518
  title: TMEM70 and TMEM242 help to assemble the rotor ring of human ATP synthase
    and interact with assembly factors for complex I.
  findings:
