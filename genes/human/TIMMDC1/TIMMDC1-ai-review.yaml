  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      High-throughput mitochondrial proteome; supports mitochondrial localization.
- id: PMID:28604674
  title: Genetic diagnosis of Mendelian disorders via RNA sequencing.
  findings:
  - statement: >-
      RNA-seq of patient fibroblasts identified a private exon arising from an intronic
      cryptic splice site in the Complex I assembly factor TIMMDC1, establishing it as a
      novel disease-associated gene - a variant class that whole-exome sequencing had
      missed in both patients.
    supporting_text: "complex I assembly factor TIMMDC1 establishing a novel disease-associated gene."
    reference_section_type: ABSTRACT
  - statement: >-
      Re-expression of TIMMDC1 in the patient cells increased Complex I subunit levels,
      which is what converts the association into causal evidence that TIMMDC1 loss produces
      the Complex I defect.
    supporting_text: "Re-expression of TIMMDC1 in these cells increased complex"
    reference_section_type: RESULTS
  - statement: >-
      The two TIMMDC1 patients presented with muscular hypotonia, developmental delay and
      neurological deterioration leading to death within the first three years of life, with
      isolated Complex I deficiency in muscle - the clinical basis for MC1DN31.
    supporting_text: "patients presented with muscular hypotonia, developmental"
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (DOI:10.1038/ncomms15824); the UniProt source for INVOLVEMENT IN
      MC1DN31. Full text is now present in the local cache, so the findings above quote it
