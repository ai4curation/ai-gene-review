core_functions:
- description: >-
    Chaperone / assembly factor that acts during the mid-stage (MCIA-associated)
    construction of the membrane arm of mitochondrial Complex I. TIMMDC1
    transiently binds incompletely assembled Complex I intermediates (including
    the ~315 kDa subcomplex) together with NDUFAF3, NDUFAF4 and the MCIA machinery
    (which also engages TMEM70/TMEM242), and dissociates on maturation of the
    holoenzyme. Its precise molecular activity is unresolved: as a
    Tim17/Tim22/Tim23-family multi-pass inner-membrane protein it is a candidate
    membrane scaffold/insertase for the ND (membrane-arm) subunits, but no
    catalytic insertase or transporter activity has been demonstrated, and it is
    not a stable structural subunit of the Complex I holoenzyme; therefore no
    specific molecular_function term is asserted.
  directly_involved_in:
  - id: GO:0032981
    label: mitochondrial respiratory chain complex I assembly
  locations:
  - id: GO:0005743
    label: mitochondrial inner membrane
  supported_by:
  - reference_id: file:human/TIMMDC1/TIMMDC1-uniprot.txt
    supporting_text: >-
      Chaperone protein involved in the assembly of the mitochondrial
      NADH:ubiquinone oxidoreductase complex (complex I). Participates in
      constructing the membrane arm of complex I.
    reference_section_type: DATABASE_ENTRY
  - reference_id: file:human/TIMMDC1/TIMMDC1-uniprot.txt
    supporting_text: >-
      Associates with the intermediate 315 kDa subcomplex of incompletely
      assembled complex I.
    reference_section_type: DATABASE_ENTRY
  - reference_id: PMID:33753518
    supporting_text: >-
      and also with an additional assembly factor for complex I, the
      translocase of IMM domain-containing protein 1, or TIMMDC1
    reference_section_type: RESULTS
  knowledge_gaps:
  - gap_statement: >-
      The molecular function of TIMMDC1 is undetermined: it is unresolved whether
      it possesses genuine protein/membrane-insertase catalytic activity (as its
      Tim17/Tim22/Tim23 fold might suggest) or acts purely as a membrane scaffold
      that positions the ND (membrane-arm) subunits during Complex I assembly.
    boundary: >-
      What is firmly established is the cellular role and the localization, not the
      activity. TIMMDC1 is a multi-pass integral protein of the mitochondrial inner
      membrane; it associates with the 550 and 815 kDa stalled Complex I subcomplexes and
      with the 315 kDa intermediate, together with NDUFAF3, NDUFAF4, TMEM126B and the MCIA
      complex; it dissociates on maturation and is not a holoenzyme subunit; and its loss
      causes isolated Complex I deficiency that is rescued by re-expression. What is absent
      is any assay of a catalytic activity: no insertase, translocase or transporter
      activity has been measured for TIMMDC1, and its family membership is the only reason
      to suspect one.
    gap_kind:
    - BIOLOGY
    dark_aspect: MF_DARK
    status: OPEN
    significance: >-
      This is the difference between a mechanism and a correlation. Every current
      annotation on TIMMDC1 is a localization or a process; none says what the protein
      does. If it is a genuine insertase for the mitochondrially encoded ND subunits, it
      would be the first such activity described for Complex I biogenesis and would explain
      why a Tim17-family fold was recruited to this pathway; if it is a passive scaffold,
      the fold is a chassis and the search for the real insertase continues elsewhere.
    resolution: >-
      A reconstituted insertion assay with defined ND-subunit substrates in a membrane
      system, coupled with a structure of a TIMMDC1-containing assembly intermediate that
      resolves its interface with the membrane arm. Either result would license a specific
      molecular_function term; a negative result would justify a scaffold/structural term
      instead.
    provenance:
    - reference_id: PMID:24191001
      supporting_text: "C3orf1, of another assembly factor, TMEM126B, and of NDUFA11 suggest that they"
      reference_section_type: ABSTRACT
    - reference_id: file:human/TIMMDC1/TIMMDC1-uniprot.txt
      supporting_text: >-
        Chaperone protein involved in the assembly of the mitochondrial
        NADH:ubiquinone oxidoreductase complex (complex I). Participates in
        constructing the membrane arm of complex I.
      reference_section_type: DATABASE_ENTRY
proposed_new_terms: []
suggested_questions:
- question: >-
    Does TIMMDC1 have genuine membrane-insertase catalytic activity for the
    mitochondrially encoded ND subunits, or does it act solely as a scaffold?
- question: >-
    Which Complex I membrane-arm (ND) subunits does TIMMDC1 directly contact
    during assembly, and in what order?
suggested_experiments:
- hypothesis: >-
    TIMMDC1 retains genuine membrane-insertase activity inherited from the
    Tim17/Tim22/Tim23 superfamily, and can catalyse insertion of ND-subunit substrates into
    a lipid bilayer independently of the rest of the assembly machinery.
  description: >-
    Reconstitute purified TIMMDC1 into proteoliposomes or nanodiscs with defined ND-subunit
    substrates (or model hydrophobic substrates) and assay insertion and topology by
    protease-protection and site-specific labelling, against a TIMMDC1-free control. A
    positive result would establish a catalytic activity; a negative result under conditions
    where a known insertase works would support the passive-scaffold model.
  experiment_type: In vitro reconstitution insertase assay
- hypothesis: >-
    TIMMDC1 contacts specific ND (membrane-arm) subunits in a defined order during assembly,
    and its interface with the membrane arm is resolvable in a stalled intermediate.
  description: >-
    Determine cryo-EM structures of TIMMDC1-containing Complex I assembly intermediates -
    for example the 550 and 815 kDa subcomplexes that accumulate on NDUFA11 suppression -
    and map the TIMMDC1 interface, complementing the structures with in-cell crosslinking
    mass spectrometry to order the contacts over time.
  experiment_type: Single-particle cryo-electron microscopy with crosslinking MS
- hypothesis: >-
    The TIMMDC1-NDUFB11 interaction reported by BioPlex is a genuine assembly contact rather
    than an affinity-purification artefact, and is required for membrane-arm construction.
  description: >-
    Validate the interaction by reciprocal co-immunoprecipitation from mitochondria under
    native conditions, then test its necessity by expressing interface mutants in
    TIMMDC1-null cells and measuring Complex I assembly by blue-native PAGE and complexome
    profiling.
  experiment_type: Targeted interaction validation with mutant complementation
