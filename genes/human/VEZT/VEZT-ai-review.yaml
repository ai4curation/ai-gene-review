- term:
    id: GO:0005654
    label: nucleoplasm
  evidence_type: IDA
  original_reference_id: GO_REF:0000052
  qualifier: located_in
  review:
    summary: >-
      Human Protein Atlas immunofluorescence annotation reporting nucleoplasmic staining
      for VEZT. This agrees with the independent report of nuclear vezatin immunoreactivity
      in mouse preimplantation embryos and with the UniProt nucleus location, but it
      is antibody-based imaging with no accompanying functional or biochemical corroboration.
    action: KEEP_AS_NON_CORE
    reason: >-
      Retained rather than removed - it is a curated experimental observation and it
      is independently echoed in mouse, so second-guessing it from the literature alone
      would be unwarranted. It is marked non-core because a nucleoplasmic pool is difficult
      to reconcile with a two-pass integral membrane protein whose N- and C-termini
      are both cytoplasmic, and because no nuclear role, import mechanism or nuclear
      interactor has been reported for vezatin. Fractionation or endogenous tagging
      with isoform-resolved reagents would settle whether this reflects a non-membrane-anchored
      splice product or antibody cross-reactivity.
    additional_reference_ids:
    - PMID:16199027
    supported_by:
    - reference_id: PMID:16199027
      supporting_text: vezatin is also detected in nuclei during most of the cell cycle
- term:
    id: GO:0005634
    label: nucleus
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: located_in
  review:
    summary: >-
      Curator sequence-similarity transfer of the nucleus location from mouse vezatin
      (UniProtKB:Q3ZK22). The mouse source observation is nuclear vezatin immunoreactivity
      in preimplantation embryos throughout most of the cell cycle; the same location
      is reported for human VEZT by HPA immunofluorescence.
    action: KEEP_AS_NON_CORE
    reason: >-
      Same judgment as the IEA nucleus and IDA nucleoplasm annotations. The transfer
      itself is legitimate, since mouse and human vezatin are clear orthologs and the
      mouse observation is experimental, and it is corroborated in human cells, so
      removal is not justified. It is nonetheless orthogonal to everything understood
      about vezatin's mechanism and is not supported by any nuclear function, so it
      is best carried as a non-core location.
    additional_reference_ids:
    - PMID:16199027
    supported_by:
    - reference_id: PMID:16199027
      supporting_text: vezatin is also detected in nuclei during most of the cell cycle
- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: EXP
  original_reference_id: PMID:15090598
  qualifier: located_in
  review:
    summary: >-
      Experimental localization of human vezatin to the plasma membrane and adherens
      junctions of polarized epithelial cells, from the study showing that myosin VIIA
      and vezatin are required for InlA/E-cadherin-dependent Listeria monocytogenes
      internalization into human Caco-2 cells.
    action: ACCEPT
    reason: >-
      Direct experimental evidence in human cells and the primary source of the UniProt
      cell-membrane location for Q9HBM0. The cached record for this paper is abstract-only,
      but the abstract itself states the junctional plasma-membrane localization, and
      the localization is independently established for vezatin in several epithelial
      systems (PMID:11080149, PMID:20049712). The Listeria entry phenotype is an exploitation
