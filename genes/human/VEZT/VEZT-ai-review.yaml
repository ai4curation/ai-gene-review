      process, so it informs the location and the adaptor function but should not be
      read as vezatin's biological purpose.
    additional_reference_ids:
    - PMID:11080149
    supported_by:
    - reference_id: PMID:15090598
      supporting_text: We have recently identified an unconventional myosin, myosin
        VIIa and its ligand vezatin, at the adherens junctions of polarized epithelial
        cells
    - reference_id: PMID:15090598
      supporting_text: both myosin VIIa and vezatin are crucial for Listeria internalization
- term:
    id: GO:0002142
    label: stereocilia ankle link complex
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: part_of
  review:
    summary: >-
      Curator sequence-similarity transfer from mouse vezatin (UniProtKB:Q3ZK22) of
      membership in the transient ankle-link complex at the base of developing cochlear
      hair-cell stereocilia. In mouse, vezatin colocalizes with ADGRV1/VLGR1, usherin
      and whirlin in a band at the stereocilia base, is lost from that site in Vlgr1-null
      (ankle-link-less), shaker-1 (Myo7a-null) and whirler (Whrn-null) mice, and binds
      the usherin cytoplasmic region directly in vitro.
    action: ACCEPT
    reason: >-
      This is the best-evidenced complex membership for vezatin, and the GO term definition
      names vezatin explicitly as one of the four constituents (Vlgr1, usherin, vezatin,
      whirlin), so the annotation is internally consistent with the ontology. The evidence
      is genetic - concordant delocalization in three independent mutants - plus a
      direct binary interaction, not mere colocalization. It is worth being explicit
      about what this does and does not license. Vezatin is not one of the four canonical
      USH2 proteins (USH2A, ADGRV1, WHRN, PDZD7) that define the USH2 complex term
      GO:1990696, and no VEZT mutation has been shown to cause Usher syndrome or any
      Mendelian deafness, so GO:1990696 should not be added on the strength of the
      usherin interaction alone. The ankle-link complex term is the accurate one. Human
      transfer is by similarity only, as expected for a structure that can only be
      assayed in animal cochlea.
    additional_reference_ids:
    - PMID:11080149
    - PMID:17567809
    supported_by:
    - reference_id: PMID:17567809
      supporting_text: the putative transmembrane protein vezatin, and the PDZ (postsynaptic
        density-95/Discs large/zona occludens-1) domain-containing submembrane protein
        whirlin are colocalized with Vlgr1 at the stereocilia base in developing cochlear
        hair cells
    - reference_id: PMID:17567809
      supporting_text: we were able to show that vezatin binds to the cytoplasmic region
        of usherin
    - reference_id: PMID:17567809
      supporting_text: our results support the existence of an ankle-link molecular
        complex (ALC)
    - reference_id: PMID:11080149
      supporting_text: vezatin is, in addition, concentrated at another membrane-membrane
        interaction site, namely at the fibrillar links interconnecting the bases of
        adjacent stereocilia
- term:
    id: GO:0034334
    label: adherens junction maintenance
  evidence_type: ISS
  original_reference_id: PMID:20049712
  qualifier: involved_in
  review:
    summary: >-
      Proposed new annotation capturing the specific biological process that the existing
      cell-cell adhesion annotations only approximate. Vezatin is recruited to cell-cell
      contacts markedly later than E-cadherin and is dispensable for junction formation,
      but is required for junctions to persist under load. Hair-cell-specific Vezt
      deletion in mouse causes irreversible hearing loss after a single minute of 105
      dB sound and progressive hair-cell death, and zygotic Vezt-null blastocyst outgrowths
      lose E-cadherin and beta-catenin from the plasma membrane with disrupted intercellular
      adhesion.
    action: NEW
    reason: >-
      The existing GO:0098609 annotations (present twice, IBA and IEA) state only that
      vezatin participates in cell-cell adhesion. The distinctive, repeatedly demonstrated
      point about vezatin is temporal - it arrives after the cadherin-catenin core
      is in place and acts on the stability of already-formed junctions, via myosin
      VIIA and radixin-mediated coupling to cortical actin. GO:0034334 states this
      precisely and is supported by loss-of-function data in two independent mouse
      systems. Evidence is recorded as ISS because the loss-of-function experiments
      are in the mouse ortholog; human VEZT is a clear one-to-one ortholog with conserved
      domain architecture, the same junctional localization and the same myosin VIIA
      binding.
    additional_reference_ids:
    - PMID:17452094
    - PMID:11080149
    supported_by:
    - reference_id: PMID:20049712
      supporting_text: the protein does not play a role in the formation of junctions,
        but rather participates in their stability
    - reference_id: PMID:20049712
      supporting_text: Conditional mutant mice bearing non-functional vezatin alleles
        only in the sensory cells of the inner ear (hair cells) indeed exhibited irreversible
        hearing loss after only one minute exposure to a 105 dB broadband sound
    - reference_id: PMID:20049712
      supporting_text: vezatin directly interacts with radixin in its actin-binding
        conformation
    - reference_id: PMID:17452094
      supporting_text: the junctional proteins E-cadherin and beta-catenin are delocalized
        and not observed at the plasma membrane anymore
