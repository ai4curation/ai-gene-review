- id: PMID:15090598
  title: Unconventional myosin VIIa and vezatin, two proteins crucial for Listeria
    entry into epithelial cells.
  full_text_unavailable: true
  findings:
  - statement: Human vezatin and myosin VIIA are located at the adherens junctions
      of polarized epithelial cells, and both are required for InlA/E-cadherin-dependent
      internalization of Listeria monocytogenes.
    supporting_text: We have recently identified an unconventional myosin, myosin VIIa
      and its ligand vezatin, at the adherens junctions of polarized epithelial cells
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified. Source of the UniProt EXP plasma-membrane annotation
      for Q9HBM0. Cached record is abstract-only; the abstract nonetheless states the
      junctional localization directly.
- id: PMID:11080149
  title: Vezatin, a novel transmembrane protein, bridges myosin VIIA to the cadherin-catenins
    complex.
  findings:
  - statement: Vezatin was identified as a ligand of the C-terminal FERM domain of
      myosin VIIA and binds the FERM, not the MyTH4, half of the C-terminal cassette.
    supporting_text: vezatin specifically interacts with the C-terminal FERM domain
      of myosin VIIA
    reference_section_type: RESULTS
  - statement: Vezatin is a ubiquitous adherens junction protein that co-immunoprecipitates
      with E- or N-cadherin and alpha-/beta-catenin, and its junctional recruitment
      requires the E-cadherin cytoplasmic tail and the C-terminal region of alpha-catenin.
    supporting_text: Vezatin co-immunoprecipitated with E- or N-cadherin and β- and
      α-catenins
    reference_section_type: RESULTS
  - statement: In inner ear hair cells vezatin is concentrated at the base of the stereocilia,
      facing the ankle links, in addition to hair cell and supporting cell adherens
      junctions.
    supporting_text: conspicuous vezatin labelling was observed at the base of the
      hair cell stereocilia
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified, full text cached. The defining paper for VEZT; establishes
      myosin VIIA binding, adherens junction localization and the stereocilia ankle-link
      site.
- id: PMID:20049712
  title: Vezatin, an integral membrane protein of adherens junctions, is required for
    the sound resilience of cochlear hair cells.
  findings:
  - statement: Vezatin has two adjacent transmembrane domains with cytoplasmic N- and
      C-terminal regions, determined experimentally by permeabilization-dependent epitope
      accessibility.
    supporting_text: We conclude that vezatin is an integral membrane protein with
      two transmembrane domains, and cytoplasmic N- and C-terminal regions
    reference_section_type: RESULTS
  - statement: Vezatin is recruited to adherens junctions later than E-cadherin and
