existing_annotations:
- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  review:
    summary: >-
      Phylogenetic (PAINT) propagation placing vezatin's site of action at the plasma
      membrane. This is well grounded across the family - vezatin is an integral membrane
      protein whose extracytoplasmic loop is accessible on the surface of unpermeabilized
      cells, and its junctional pool is the functional pool.
    action: ACCEPT
    reason: >-
      Human VEZT itself appears in the WITH/FROM list alongside mouse Vezt and the
      ancestral node PTN001440408, which is the expected signature of a node seeded
      by experimental descendants rather than circularity. Direct experimental support
      exists in human and canine epithelial cells (surface labelling of unpermeabilized
      MDCK cells with anti-ectodomain antibodies) and in human Caco-2 cells (PMID:15090598).
      The adherens junction term GO:0005912, also annotated, is the more informative
      location, but active-in plasma membrane is a correct and appropriately conservative
      family-level statement.
    additional_reference_ids:
    - PMID:11080149
    - PMID:20049712
    supported_by:
    - reference_id: PMID:11080149
      supporting_text: both antibodies labelled the cell surface, demonstrating that
        vezatin is a transmembrane protein
    - reference_id: PMID:20049712
      supporting_text: We conclude that vezatin is an integral membrane protein with
        two transmembrane domains, and cytoplasmic N- and C-terminal regions
- term:
    id: GO:0098609
    label: cell-cell adhesion
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: >-
      Phylogenetic propagation of the core biological role of the vezatin family, participation
      in cadherin-based cell-cell adhesion. Vezatin is a ubiquitous component of adherens
      junctions that co-immunoprecipitates with E- or N-cadherin and alpha-/beta-catenin
      and that links the cadherin-catenin complex to myosin VIIA and to cortical actin
      via radixin.
    action: ACCEPT
    reason: >-
      The node placement is supported by direct experimental work on the mouse and
      human proteins. In mouse, morpholino knockdown and zygotic null alleles produce
      failure of intercellular adhesion with delocalization of E-cadherin and beta-catenin
      from the plasma membrane (PMID:16199027, PMID:17452094), and hair-cell-specific
      deletion destabilizes junctions under mechanical load (PMID:20049712). The term
      is at an appropriate level of generality for an IBA - vezatin is not itself an
      adhesion receptor but is required for the strength and maintenance of cadherin-mediated
      adhesion (see the NEW GO:0034334 entry below for the more precise statement).
    additional_reference_ids:
    - PMID:11080149
    - PMID:17452094
    supported_by:
    - reference_id: PMID:11080149
      supporting_text: Vezatin is a ubiquitous protein of adherens cell-cell junctions,
        where it interacts with both myosin VIIA and the cadherin-catenins complex
    - reference_id: PMID:17452094
      supporting_text: the junctional proteins E-cadherin and beta-catenin are delocalized
        and not observed at the plasma membrane anymore
- term:
    id: GO:0001669
    label: acrosomal vesicle
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  review:
    summary: >-
      UniProt subcellular-location mapping (SL-0007) of a By-similarity acrosome location
      taken from mouse vezatin. The underlying mouse data are solid - immunocytochemistry
      and immunoelectron microscopy place vezatin in the forming acrosome of differentiating
      spermatids and on the outer acrosomal membrane of epididymal sperm - but this
      is a germ-cell-restricted localization that has not been demonstrated for the
      human protein.
    action: KEEP_AS_NON_CORE
    reason: >-
      The annotation is not wrong and rests on real ultrastructural evidence in the
      mouse ortholog, so it should be retained. It is, however, a cell-type-restricted
      site far from vezatin's general function as an adherens-junction adaptor, and
      notably vezatin is absent from the ectoplasmic specializations (the adherens
      junctions of the seminiferous epithelium), so this pool is not simply the junctional
      pool. Flagging it as non-core keeps it from being read as a general location
      of the protein.
    additional_reference_ids:
    - PMID:17379651
    supported_by:
    - reference_id: PMID:17379651
      supporting_text: In differentiating spermatids, ultrastructural data indicate
        that vezatin localizes in the acrosome
    - reference_id: PMID:17379651
      supporting_text: In epididymal sperm, vezatin localizes also to the outer acrosomal
        membrane
- term:
    id: GO:0005634
    label: nucleus
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  review:
    summary: >-
      UniProt subcellular-location mapping (SL-0191) of a By-similarity nucleus location
      taken from mouse vezatin, where vezatin immunoreactivity was reported in nuclei
      of preimplantation embryos through most of the cell cycle. Independent human
      immunofluorescence (HPA) also reports nucleoplasmic staining.
    action: KEEP_AS_NON_CORE
    reason: >-
      There is genuine, independent observational support in two systems, so this should
      not be deleted. It is nevertheless hard to reconcile with the established topology
      of the protein - two adjacent transmembrane helices with both termini cytoplasmic
      (PMID:20049712) - and no nuclear function, import signal or nuclear binding partner
      has been described for vezatin. Non-membrane-anchored splice products exist (an
      ORF lacking the transmembrane segment was cloned in the original study), which
      is a plausible but unproven explanation. Retain as a non-core location pending
      isoform-resolved validation; do not treat it as part of vezatin's mechanism.
    additional_reference_ids:
    - PMID:16199027
    - PMID:20049712
    supported_by:
    - reference_id: PMID:16199027
      supporting_text: vezatin is also detected in nuclei during most of the cell cycle
    - reference_id: PMID:20049712
      supporting_text: We conclude that vezatin is an integral membrane protein with
        two transmembrane domains, and cytoplasmic N- and C-terminal regions
- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  review:
    summary: >-
      UniProt subcellular-location mapping (SL-0039) of the experimentally determined
      cell-membrane location of human vezatin. Redundant with the EXP and IBA plasma-membrane
      annotations, which is expected and unproblematic.
    action: ACCEPT
    reason: >-
      Correct and directly supported. Antibodies against the predicted extracytoplasmic
      region label the surface of unpermeabilized epithelial cells, establishing vezatin
      as a bona fide plasma-membrane protein, and the human protein was localized to
      the plasma membrane and adherens junctions in Caco-2 cells in PMID:15090598,
      the reference underlying the UniProt annotation.
    additional_reference_ids:
    - PMID:11080149
    supported_by:
    - reference_id: PMID:11080149
      supporting_text: both antibodies labelled the cell surface, demonstrating that
        vezatin is a transmembrane protein
    - reference_id: PMID:15090598
      supporting_text: We have recently identified an unconventional myosin, myosin
        VIIa and its ligand vezatin, at the adherens junctions of polarized epithelial
        cells
- term:
    id: GO:0005912
    label: adherens junction
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  review:
    summary: >-
      UniProt subcellular-location mapping (SL-0009). This is the single most informative
      and best-supported location for vezatin - it is a ubiquitous adherens-junction
      membrane protein, recruited there through the E-cadherin cytoplasmic tail and
      the C-terminal region of alpha-catenin, and it co-immunoprecipitates with E-
      or N-cadherin and alpha-/beta-catenin.
    action: ACCEPT
    reason: >-
      Core location. Directly demonstrated in human, canine and mouse epithelial cells
      and tissues, and specifically excluded from desmosomes and focal adhesions, so
      the term is neither too broad nor over-reaching. Junctional recruitment is late
      relative to E-cadherin, consistent with a role in junction maturation and stabilization
      rather than nucleation (PMID:20049712).
    additional_reference_ids:
    - PMID:11080149
    - PMID:20049712
    supported_by:
    - reference_id: PMID:11080149
      supporting_text: These results identify vezatin as a ubiquitous protein of adherens
        junctions
    - reference_id: PMID:11080149
      supporting_text: Vezatin co-immunoprecipitated with E- or N-cadherin and β- and
        α-catenins
    - reference_id: PMID:20049712
      supporting_text: vezatin recruitment at AJs in MDCKII cells is markedly delayed
        compared to that of E-cadherin
- term:
    id: GO:0017022
    label: myosin binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: >-
      InterPro2GO mapping from IPR026859 (the vezatin myosin-binding region). This
      is the only molecular-function annotation on VEZT and it is the correct one -
      vezatin was discovered as a yeast two-hybrid partner of the C-terminal MyTH4-FERM
      cassette of myosin VIIA and binds specifically to the FERM half, not the MyTH4
      half.
    action: ACCEPT
    reason: >-
      An informative, non-generic MF term whose domain mapping is validated by direct
      experiment on the human protein (two-hybrid, co-immunoprecipitation from co-transfected
      HEK293 cells, and pull-down of endogenous vezatin from Caco-2 extracts by biotinylated
      myosin VIIA FERM fragments). This binding is the mechanistic core of the whole
      annotation set, because it is what recruits myosin VIIA to cadherin-catenin complexes
      and to the stereocilia ankle-link region. It also underlies the InlA-dependent
      Listeria entry phenotype (PMID:15090598).
    additional_reference_ids:
    - PMID:11080149
    supported_by:
    - reference_id: PMID:11080149
      supporting_text: the C-terminal FERM domain of myosin VIIA binds to a novel transmembrane
        protein, vezatin
    - reference_id: PMID:11080149
      supporting_text: vezatin specifically interacts with the C-terminal FERM domain
        of myosin VIIA
- term:
    id: GO:0060171
    label: stereocilium membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  review:
    summary: >-
      UniProt subcellular-location mapping (SL-0303) of a By-similarity stereocilium-membrane
      location taken from mouse vezatin. Immunofluorescence and immunoelectron microscopy
      place vezatin in the membrane at the base of hair-cell stereocilia, facing the
      ankle links, in mouse and (persisting into adulthood) chicken.
    action: ACCEPT
    reason: >-
      A genuine and functionally important site of action, not a generic mapping. Vezatin's
      stereociliary pool is spatially restricted to the ankle-link region at the stereocilia
      base and is developmentally transient in mouse, tracking the appearance and disappearance
      of the ankle links; in chicken, where ankle links persist, vezatin persists and
      colocalizes with the ankle-link antigen. Because vezatin is a multi-pass membrane
      protein, stereocilium membrane rather than a cytoskeletal stereocilium term is
      the correct granularity. Evidence comes from mouse and chicken hair cells rather
      than human tissue, which is inherent to the By-similarity route but does not
      undermine the term.
    additional_reference_ids:
    - PMID:11080149
    - PMID:17567809
    supported_by:
    - reference_id: PMID:11080149
      supporting_text: conspicuous vezatin labelling was observed at the base of the
        hair cell stereocilia
    - reference_id: PMID:11080149
      supporting_text: which was shown to face the ankle links by immunoelectron microscopy
    - reference_id: PMID:17567809
      supporting_text: The labeling present at the base of the stereocilia in P6 wild-type
        mice was colocalized with Vlgr1
