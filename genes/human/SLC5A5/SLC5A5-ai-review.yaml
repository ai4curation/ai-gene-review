  review:
    summary: Family-level IBA asserting sodium-coupled organic-acid (monocarboxylate)
      symport, inherited from the SLC5/SSF transporter clade (PANTHER PTHR42985,
      sodium-coupled monocarboxylate transporter).
    action: MODIFY
    reason: The sodium-coupled symport essence is correct, but the substrate branch
      is wrong for NIS. NIS transports iodide and other inorganic/pseudohalide anions
      (chlorate, thiocyanate, nitrate, selenocyanate), not organic acids/monocarboxylates;
      GO:0005343 is a sibling, not an ancestor, of the gene's directly supported
      GO:0008507. The IBD node for organic-acid symport was placed on the broader
      SMCT-containing clade; in the NIS lineage the activity diverged to anion symport.
      Replace with the anion:sodium symporter branch the gene already carries by IDA
      (GO:0015373), which is consistent with GO:0008507.
    proposed_replacement_terms:
