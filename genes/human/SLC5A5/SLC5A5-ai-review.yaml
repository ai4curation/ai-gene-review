core_functions:
- description: Secondary active, electrogenic symport of iodide into the cell coupled
    to the inward Na+ electrochemical gradient (2 Na+ to 1 I-), at the basolateral
    plasma membrane of thyroid follicular cells, concentrating iodide for thyroid
    hormone biosynthesis. The transporter also accepts other monovalent anions/pseudohalides
    and is competitively inhibited by perchlorate.
