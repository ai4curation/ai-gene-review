  review:
    summary: Electronic InterPro2GO mapping (SLC5A5-specific signature IPR035689)
      linking NIS to thyroid hormone generation.
    action: KEEP_AS_NON_CORE
    reason: NIS performs the iodide-trapping step that supplies the iodide substrate
      for thyroid hormone synthesis, and its loss causes thyroid dyshormonogenesis;
      it is therefore legitimately associated with this process. However, the hormone-generation
      chemistry itself (iodide organification/tyrosine iodination and coupling, and
      thyroglobulin proteolysis) is carried out by TPO, thyroglobulin and cathepsins,
      not by NIS, which supplies the substrate by transport. Kept as a genuine but
      non-core contributory process annotation rather than a core molecular function.
