id: Q92911
gene_symbol: SLC5A5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SLC5A5 (NIS, sodium/iodide symporter) is a secondary active transporter
  that mediates concentrative uptake of iodide (I-) into cells, driven by the
  inwardly directed electrochemical Na+ gradient established by the Na+/K+-ATPase.
  Transport is electrogenic with a 2 Na+:1 I- stoichiometry. NIS is a polytopic
  integral membrane glycoprotein (13 transmembrane helices, extracellular N-terminus,
  cytosolic C-terminus) of the sodium:solute symporter (SSF/SLC5) family. In thyroid
  follicular cells it localizes to the basolateral plasma membrane, where iodide
  trapping provides the substrate for thyroid hormone
  (thyroxine, triiodothyronine) biosynthesis; it is also expressed in salivary gland,
  gastric mucosa, lactating mammary gland, placenta and choroid plexus. Besides
  iodide, NIS transports other monovalent anions and pseudohalides (chlorate,
  thiocyanate, nitrate, selenocyanate, perrhenate, pertechnetate, tetrafluoroborate)
  and is competitively inhibited by perchlorate. Biallelic loss-of-function mutations
  cause iodide transport defect / thyroid dyshormonogenesis 1 (congenital
  hypothyroidism). NIS-mediated radioiodide accumulation is the basis of diagnostic
  thyroid imaging and radioiodine (131-I) therapy of thyroid cancer, and NIS is
  widely used as a reporter gene.
