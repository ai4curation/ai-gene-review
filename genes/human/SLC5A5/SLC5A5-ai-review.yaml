- term:
    id: GO:0005634
    label: nucleus
  evidence_type: IDA
  original_reference_id: PMID:15961562
  qualifier: located_in
  review:
    summary: Nuclear localization annotation drawn from a study of the paired-box
      transcription factor PAX8 in human placenta and choriocarcinoma cells.
    action: MARK_AS_OVER_ANNOTATED
    reason: A nuclear location is biologically implausible for NIS, a 13-transmembrane
      integral plasma-membrane symporter; the entire paper concerns PAX8, a nuclear
      transcription factor that regulates expression of thyroglobulin, thyroperoxidase
      and NIS. The nuclear entity in this work is PAX8, and NIS appears only as one
      of its transcriptional targets. The nuclear IDA most likely belongs to PAX8,
      not SLC5A5; flagged as a probable wrong-gene source defect for curator review
      rather than removed outright.
    supported_by:
    - reference_id: PMID:15961562
      supporting_text: it mediates TSH-induced modulation of the expression of important
        genes, such as those encoding thyroglobulin, thyroperoxidase, and the sodium/iodide
        symporter
    source_defects:
    - defect_type: WRONG_GENE_PRODUCT
      resource: UNIPROT
      asserted_value: SLC5A5 located_in nucleus (GO:0005634)
      corrected_value: likely PAX8 (the nuclear transcription factor studied in PMID:15961562)
      requested_change: CHECK
      confidence: SUSPECTED
      explanation: The cited paper studies PAX8 (a nuclear transcription factor) and
        its regulation of NIS gene expression; nuclear localization of a polytopic
        plasma-membrane transporter is not credible. The abstract does not state NIS
        nuclear localization, so the full text should be checked, but the annotation
        appears mis-attributed from PAX8 to its target gene NIS.
