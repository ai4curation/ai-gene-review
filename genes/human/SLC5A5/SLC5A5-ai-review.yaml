suggested_questions:
- question: Is the nuclear localization annotation (GO:0005634, PMID:15961562) a mis-attribution
    from the transcription factor PAX8 to its target gene NIS?
- question: Does NIS at the choroid plexus mediate iodide transport across the blood-CSF
    barrier, and is annotation to transport across blood-brain barrier (GO:0150104)
    appropriate, or should a blood-CSF/choroid-plexus term be used instead?
- question: Given multiple biochemical demonstrations of a disulfide-stabilised NIS
    dimer required for transport, should UniProt's SUBUNIT annotation be updated from
    Monomer to reflect homodimerization?
suggested_experiments:
- description: Polarized epithelial (e.g. MDCK or primary thyrocyte) surface-biotinylation
    and confocal imaging to formally confirm basolateral (vs apical) targeting of
    endogenous human NIS and map the sorting determinants.
- description: Cryo-EM or X-ray structure of human NIS in substrate- and inhibitor-bound
    states to define the iodide and Na+ binding pockets and the mechanism of perchlorate
    inhibition.
- description: Quantitative tissue-resolved proteomics/functional assays in choroid
    plexus to test whether NIS contributes to iodide flux into CSF.
