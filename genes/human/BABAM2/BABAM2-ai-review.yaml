id: Q9NXR7
gene_symbol: BABAM2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: BABAM2 (BRISC and BRCA1-A complex member 2; BRE/BRCC45) is an adaptor subunit, built from
  two ubiquitin E2 variant-like domains, of two BRCC3/BRCC36 K63-linked deubiquitinase complexes. In the
  nuclear BRCA1-A complex (RAP80, ABRAXAS1, BRCC3, BABAM2, BABAM1) it bridges BABAM1 to the rest of the
  complex, maintains complex integrity, and supports BRCA1 targeting to K63-ubiquitinated chromatin at
  DNA double-strand breaks, the G2/M checkpoint and resistance to ionizing radiation. In the cytoplasmic
  and nuclear BRISC complex (ABRAXAS2, BRCC3, BABAM2, BABAM1, with SHMT2) it has the same bridging role;
  BRISC deubiquitinates IFNAR1 and NUMA1. As BRE, it was originally identified as a TNF-R1/Fas-binding
  protein that inhibits death-receptor apoptosis.
