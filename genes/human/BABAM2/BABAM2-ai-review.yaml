  review:
    summary: Peroxisome signal sequence receptor activity (TAS). Peroxisome signal sequence receptor activity
      (TAS). The source paper notes that the canonical BRE isoform carries a C-terminal peroxisomal targeting
      sequence and proposes that BRE regulates peroxisomal activities. Carrying a targeting signal is
      not acting as a receptor for one, which is the PEX5/PEX7 role. The source shows no peroxisomal function
      for BRE. Removed.
    action: REMOVE
