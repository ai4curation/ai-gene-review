id: Q9UM21
gene_symbol: MGAT4A
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: MGAT4A encodes GnT-IVa, a type-II Golgi glycosyltransferase that transfers 
  N-acetylglucosamine from UDP-GlcNAc to the alpha-1,3 arm of complex and hybrid N-glycans through a
  beta-1,4 linkage. Together with the lower-affinity GnT-IVb isozyme MGAT4B and the less directly 
  characterized MGAT4C paralog, it forms beta-1,4 GlcNAc branches that support production of tri- 
  and tetra-antennary N-linked glycans, including N-glycans that stabilize SLC2A2/GLUT2 at the
  pancreatic beta-cell surface by similarity to mouse Mgat4a.
alternative_products:
- name: '1'
  id: Q9UM21-1
- name: '2'
  id: Q9UM21-2
  sequence_note: VSP_046075, VSP_046076, VSP_046077
