core_functions:
- description: MGAT4A transfers GlcNAc from UDP-GlcNAc to the alpha-1,3 arm of complex and hybrid 
    N-glycans in the Golgi, generating the beta-1,4 GlcNAc branch used to build tri- and 
    tetra-antennary N-linked glycans, including glycans on substrates such as SLC2A2/GLUT2 by
    similarity to mouse Mgat4a.
