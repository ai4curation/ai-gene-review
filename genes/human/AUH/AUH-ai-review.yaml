  - reference_id: PMID:24598254
    supporting_text: AUH is most abundant in the matrix
  - reference_id: PMID:12434311
    supporting_text: was measured in the reverse direction, using HMG-CoA as substrate.
- description: Binds AU-rich sequences in transcript 3'-UTRs in vitro. A lysine-rich surface contributes
    to RNA binding. The interaction is established independently of a proposed transcript-decay role;
    the physiological RNA targets and relationship to mitochondrial translation remain incompletely resolved.
    The physiological compartment of the classical AU-rich transcript-binding activity is unresolved;
    no matrix or cytosolic location is assigned to that specific activity.
  molecular_function:
    id: GO:0003730
    label: mRNA 3'-UTR binding
  supported_by:
