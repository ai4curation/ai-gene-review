core_functions:
- description: Catalyzes the hydration of 3-methylglutaconyl-CoA to 3-hydroxy-3-methylglutaryl-CoA in
    mitochondrial leucine degradation. The reaction is reversible; leucine catabolism uses the hydration
    direction.
  molecular_function:
