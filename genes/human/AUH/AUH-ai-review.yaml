proposed_new_terms: []
suggested_questions:
- question: Does the classical AU-rich transcript-binding activity operate in the mitochondrial matrix,
    or does a cytosolic or precursor pool mediate that interaction? Direct localization and substrate-specific
    binding tests are needed to distinguish these possibilities.
- question: Which RNA contacts of AUH are direct in mitochondria, and how does its RNA-binding surface
    contribute to the effects of AUH abundance and catalytic activity on mitochondrial translation?
- question: How much itaconyl-CoA hydration flux depends on AUH in human macrophages under endogenous
    itaconate production?
- question: Does the fatty-acid beta-oxidation IBD at PTN000941828 apply to the AUH lineage, and is there
    direct evidence for retained activity or functional divergence relevant to that process?
- question: How does the 140–168 deletion in Q13825-2 affect folding, enzyme activity and RNA binding?
suggested_experiments:
- description: Compare direct RNA binding, mitochondrial translation and metabolite flux after matched
    expression of human AUH variants that separately perturb the RNA-contact surface and hydratase active
    site; measure protein abundance, import and folding before attributing changes to a specific activity.
- description: Measure AUH-dependent itaconyl-CoA and citramalyl-CoA flux in human macrophages under endogenous
    itaconate production, with purified-enzyme assays establishing substrate activity separately.
