id: Q13825
gene_symbol: AUH
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: AUH is a mitochondrial methylglutaconyl-CoA hydratase of the crotonase superfamily. It catalyzes
  the reversible hydration of 3-methylglutaconyl-CoA to 3-hydroxy-3-methylglutaryl-CoA during leucine
  degradation. The protein forms a hexamer and also binds AU-rich RNA sequences through a positively charged
  surface. In human cells, AUH associates with mitochondrial RNA and ribosomes; altered AUH abundance
  perturbs mitochondrial protein synthesis. The physiological compartment and RNA targets of the classical
  AU-rich transcript-binding activity remain unresolved. A secondary itaconyl-CoA hydratase activity has
  been attributed to AUH in the mitochondrial C5-dicarboxylate pathway. Loss of its leucine-pathway activity
  causes 3-methylglutaconic aciduria type 1.
