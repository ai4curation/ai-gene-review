core_functions:
- description: 'Actin-activated ATP-driven motor: as the heavy chain of the non-muscle myosin IIA hexamer,
    MYH9 hydrolyses ATP to translocate and contract actin filaments, assembling into bipolar myosin II
    filaments in stress fibers, the cortex and the cytokinetic contractile ring.'
