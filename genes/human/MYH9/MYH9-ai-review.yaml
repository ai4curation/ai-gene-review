id: P35579
gene_symbol: MYH9
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: MYH9 encodes the heavy chain of non-muscle myosin IIA (NMIIA), the predominant class II myosin
  of most non-muscle cells and the only class II myosin in platelets, megakaryocytes and leukocytes. Two
  heavy chains dimerize through a long alpha-helical coiled-coil rod and associate with essential and
  regulatory light chains; regulatory light chain phosphorylation (by MLCK and ROCK) unfolds the inhibited
  monomer and drives assembly into bipolar filaments. The N-terminal motor domain is an actin-activated
  Mg-ATPase that translocates actin filaments, so NMIIA filaments crosslink and contract actin to generate
  cortical tension. NMIIA is concentrated in stress fibers, the cell cortex, the uropod and rear of migrating
  cells, and the cytokinetic contractile ring. Through actomyosin contraction it drives cytokinesis, cell
  shape change and spreading, focal adhesion maturation, rear retraction during migration (for example,
  T cell motility), and force-dependent positioning of organelles and the nucleus, including myosin-II-driven
  nuclear repositioning in migrating immune cells. Tissue-specific roles include proplatelet formation,
  kidney podocyte and inner-ear function; heterozygous MYH9 mutations cause MYH9-related disease (macrothrombocytopenia
  with leukocyte inclusions, nephropathy, deafness, cataract). The C-terminal tail is a regulatory hub
  bound by S100A4, which promotes filament disassembly. NMIIA is also exploited by viruses, acting as
  an entry receptor for herpes simplex virus 1 glycoprotein B.
