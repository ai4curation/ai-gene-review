    supporting_text: both heads of either thiophosphorylated or unphosphorylated heavy meromyosin bind
      very strongly to actin (K(d) < 10 nM) in the presence or absence of ADP
  - reference_id: PMID:24072716
    supporting_text: Phosphorylation of the regulatory light chain leads to assembly into filaments, which
      bind to actin in the presence of ATP
- description: 'Actomyosin contraction at the rear of migrating leukocytes: MYH9, the only class II myosin
    in T cells, is required for uropod maintenance and T cell motility, and in migrating immune cells
    NMIIA accumulates behind the nucleus where myosin II forces reposition it.'
  molecular_function:
    id: GO:0000146
    label: microfilament motor activity
  directly_involved_in:
  - id: GO:0050900
    label: leukocyte migration
  locations:
  - id: GO:0001931
    label: uropod
  supported_by:
  - reference_id: PMID:15064761
    supporting_text: MyH9 function is required for maintenance of the uropod and for T cell motility but
      is dispensable for synapse formation
  - reference_id: PMID:15064761
    supporting_text: nonmuscle myosin heavy chain IIA, or MyH9, is the only class II myosin expressed
      in T cells and is associated with the uropod during crawling
  - reference_id: PMID:37987147
    supporting_text: imaging of myosin‐IIA localization during amoeboid nucleokinesis using MYH9‐GFP encoding
      dendritic cells revealed an enriched myosin‐IIA localization in retracting protrusions closely behind
      the nucleus
  - reference_id: PMID:37987147
    supporting_text: Amoeboid nucleokinesis comprises a two-step polarity switch and is driven by myosin-II
      forces that readjust the nuclear to the cellular path
  - reference_id: file:human/MYH9/MYH9-deep-research-falcon.md
    supporting_text: many pharmacologic studies inhibit all NMII isoforms, whereas MYH9-specific knockout,
      knockdown or mutation gives stronger isoform-level evidence
suggested_questions:
- question: 'Does MYH9 (NMIIA) itself contribute to neuronal nucleokinesis, or is the rear actomyosin
    force in migrating neurons supplied mainly by MYH10 (NMIIB)? Most neuronal evidence is from pan-myosin
    II inhibition (blebbistatin) or MYH10-specific studies; MYH9-specific evidence for nuclear movement
    comes chiefly from immune cells. (The Falcon deep research report makes the same caveat: pan-NMII
    pharmacology cannot assign function to MYH9 specifically.)'
  experts:
  - neuronal migration biologists
  - non-muscle myosin II paralog specialists
- question: Should the GOA rows citing PMID:2732579 (a wrong identifier) be re-pointed to PMID:27325790,
    the Rab3a/Slp4-a/NMHC-IIA paper that matches their content?
  experts:
  - GOA/UniProt curators
suggested_experiments:
- description: Paralog-specific knockdown or conditional knockout of Myh9 versus Myh10 in migrating cortical
    or MGE interneurons with live imaging of nuclear translocation and rear myosin accumulation.
  hypothesis: NMIIA and NMIIB contribute differently to rear actomyosin pushing of the nucleus in migrating
    neurons.
  experiment_type: paralog-specific genetic perturbation with live imaging
