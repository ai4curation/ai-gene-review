    label: myosin II complex
  supported_by:
  - reference_id: PMID:12237319
    supporting_text: The R702C mutant displays 25% of the maximal MgATPase activity of wild type heavy
      meromyosin and moves actin filaments at half the wild type rate
  - reference_id: PMID:12237319
    supporting_text: This heavy meromyosin has only 4% of the maximal MgATPase activity of wild type and
      does not translocate actin filaments in an in vitro motility assay
  - reference_id: PMID:24072716
    supporting_text: Although each NM II is capable of forming bipolar filaments, those formed by IIC
      tend to contain fewer constituent molecules than those of IIA and IIB
  - reference_id: PMID:24072716
    supporting_text: Phosphorylation of the regulatory light chain leads to assembly into filaments, which
      bind to actin in the presence of ATP
  - reference_id: PMID:11029059
    supporting_text: GFP-tagged full-length NMHC II-A or II-B, but not delta N592, were localized to the
      cytokinetic ring during mitosis
  - reference_id: PMID:7699007
    supporting_text: This concentration of myosin-II isozymes in the cleavage furrow is maintained until
      the daughter cells separate
  - reference_id: PMID:15774463
    supporting_text: Introducing green fluorescent protein (GFP)-tagged NMHC II isoforms into II-B siRNA-treated
      cells resulted in reduction of multinucleation
  - reference_id: file:human/MYH9/MYH9-uniprot.txt
    supporting_text: Cellular myosin that appears to play a role in cytokinesis,
- description: Actin filament binding by the motor heads and by bipolar filaments, crosslinking actin
    into contractile actomyosin bundles.
  molecular_function:
    id: GO:0051015
    label: actin filament binding
  directly_involved_in:
