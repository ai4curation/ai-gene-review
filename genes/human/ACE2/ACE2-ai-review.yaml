  review:
    summary: ACE2 supports neutral amino-acid transporter surface expression rather than
      transporting tryptophan itself.
    action: MODIFY
    reason: ACE2 forms an apical brush-border complex with SLC6A19/B0AT1 and is required for
      efficient neutral amino-acid transport through that transporter. The imported substrate passes
      through SLC6A19, so the ACE2 row should be a positive-regulation term.
    proposed_replacement_terms:
