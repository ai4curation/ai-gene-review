- term:
    id: GO:0000122
    label: negative regulation of transcription by RNA polymerase II
  evidence_type: IDA
  original_reference_id: PMID:17906677
  qualifier: involved_in
  review:
    summary: ACE2 overexpression changes inflammatory transcriptional readouts downstream of
      angiotensin signaling.
    action: MARK_AS_OVER_ANNOTATED
    reason: PMID:17906677 used ACE2 plasmid overexpression in EAhy926 endothelial cells and
      measured suppression of Ang II/Ang IV-induced MIF and p22phox expression. This is an
      engineered downstream transcriptional readout of altered angiotensin signaling, not direct
      regulation of RNA polymerase II transcription by the ACE2 gene product.
    supported_by:
    - reference_id: PMID:17906677
      supporting_text: Gene transfer of ACE2 suppressed the expression of p22phox and MIF induced
        by angiotensin (Ang) II and Ang IV
- term:
    id: GO:0001618
    label: virus receptor activity
  evidence_type: IDA
  original_reference_id: PMID:16051304
  qualifier: enables
  review:
    summary: ACE2 is a coronavirus receptor for SARS-CoV, SARS-CoV-2 and NL63.
    action: ACCEPT
    reason: The row captures ACE2 as a cell-surface coronavirus entry receptor, a core but
      pathogen-exploited activity that is distinct from ACE2 carboxypeptidase catalysis. This is the
      function that the SARS-CoV-2 entry GO-CAM should use for virion attachment; the model instead
      typed the ACE2 attachment activity as endopeptidase activity.
    supported_by:
