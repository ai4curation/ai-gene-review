- term:
    id: GO:0004175
    label: endopeptidase activity
  evidence_type: IDA
  original_reference_id: PMID:15283675
  qualifier: enables
  review:
    summary: ACE2 is a zinc metallocarboxypeptidase, not an endopeptidase.
    action: REMOVE
    reason: PMID:15283675 measured C-terminal cleavage of angiotensin peptides by ACE2; that is
      exopeptidase/carboxypeptidase chemistry, not endopeptidase activity. The SARS-CoV-2 entry
      GO-CAM repeats this same term as the MF for virion attachment, where GO:0001618 virus receptor
      activity is the appropriate ACE2 function.
    supported_by:
    - reference_id: PMID:10924499
      supporting_text: "In the hydrolysis of the angiotensins, ACEH functions exclusively\nas a carboxypeptidase."
    - reference_id: file:human/ACE2/ACE2-uniprot.txt
      supporting_text: DE            EC=3.4.17.23
- term:
