  review:
    summary: ACE2 is a monocarboxypeptidase rather than a peptidyl-dipeptidase.
    action: REMOVE
    reason: PMID:10924499 shows that ACE2 hydrolyzes a single C-terminal residue from peptide
      substrates and is inactive on bradykinin and Hip-His-Leu, the canonical ACE
      peptidyl-dipeptidase substrates. ACE2 is therefore a monocarboxypeptidase, not a
      peptidyl-dipeptidase.
