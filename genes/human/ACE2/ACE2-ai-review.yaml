    label: carboxypeptidase activity
  evidence_type: IDA
  original_reference_id: PMID:10924499
  qualifier: enables
  review:
    summary: ACE2 is a zinc-dependent carboxypeptidase that removes single C-terminal residues from
      angiotensin and other vasoactive peptides.
    action: ACCEPT
    reason: ACE2 was cloned and experimentally characterized as a captopril-insensitive
      carboxypeptidase and the reviewed UniProt record records zinc-dependent EC 3.4.17.23
      chemistry. The row reflects the core endogenous catalytic function.
