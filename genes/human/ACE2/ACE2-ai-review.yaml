- term:
    id: GO:0005788
    label: endoplasmic reticulum lumen
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-9683488
  qualifier: located_in
  review:
    summary: The Reactome ER-lumen row reflects maturation of a lumen-facing ectodomain during
      transit, not residence of soluble ACE2 in the ER lumen.
    action: MARK_AS_OVER_ANNOTATED
    reason: ACE2 is glycosylated while trafficking through the ER en route to the cell surface, but
      that transit of a type-I membrane protein does not establish ER-lumen residence for the
      protein as a whole.
    supported_by:
    - reference_id: Reactome:R-HSA-9683488
