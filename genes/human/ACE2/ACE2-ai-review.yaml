- term:
    id: GO:0005576
    label: extracellular region
  evidence_type: EXP
  original_reference_id: PMID:15983030
  qualifier: located_in
  review:
    summary: The soluble shed ectodomain of ACE2 is extracellular.
    action: KEEP_AS_NON_CORE
    reason: Full-length ACE2 is a type-I plasma-membrane protein with an extracellular catalytic
      ectodomain; proteolytic shedding also releases a soluble extracellular form. The
      extracellular-region row is kept for that processed form but is not the core location of the
      membrane receptor/enzyme.
    supported_by:
    - reference_id: PMID:15380922
      supporting_text: "Transfection experiments\ndemonstrated that secreted human ACE2 (shACE2) was secreted
        constitutively into\nthe medium."
