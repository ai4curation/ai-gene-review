id: Q9BYF1
gene_symbol: ACE2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'ACE2 encodes angiotensin-converting enzyme 2, a zinc-dependent type-I plasma-membrane metallocarboxypeptidase
  with an extracellular catalytic domain. Its core endogenous activity is cleavage of single C-terminal
  residues from angiotensin and other vasoactive peptides, especially conversion of angiotensin II to
  angiotensin-(1-7), thereby counterbalancing the ACE/angiotensin II arm of the renin-angiotensin system.
  Full-length ACE2 also acts at apical epithelial membranes as an accessory subunit that promotes SLC6A19/B0AT1
  neutral amino-acid transporter expression and activity. The extracellular ACE2 domain is exploited as
  an entry receptor by coronaviruses including SARS-CoV, SARS-CoV-2 and HCoV-NL63; this receptor activity
  is independent of its peptidase chemistry. Proteolytic shedding can release a soluble extracellular
  ACE2 ectodomain, and an interferon-inducible short isoform lacks the peptidase and SARS-CoV-2 receptor
  region.'
alternative_products:
