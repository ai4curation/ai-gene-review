core_functions:
- description: 'Cargo-specific clathrin endocytic adaptor: the PTB domain binds sorting signals in transmembrane
    cargo (NPC1L1, EAAT3, integrin alpha5, L1, Notch) and C-terminal motifs bind AP-2 alpha-adaptin and
    EH-domain proteins, linking cargo to clathrin-coated pits for internalization. Established for human
    NUMB.'
