    label: negative regulation of Notch signaling pathway
  evidence_type: IMP
  original_reference_id: PMID:18172499
  review:
    summary: 'NUMB antagonises Notch: loss of NUMB in human breast cancer increases NOTCH activity; mammalian
      Numb with ITCH promotes Notch1 ubiquitination and NICD degradation.'
    action: NEW
    reason: 'NUMB performs part of the work: its PTB domain binds Notch and it recruits/activates the
      E3 ITCH to ubiquitinate membrane Notch1, routing it away from signalling. Direct human evidence
      (Colaluca 2008) plus mammalian biochemistry; the canonical Drosophila numb function. Proposed from
      human evidence, not by transfer, because PAINT did not propagate it.'
    additional_reference_ids:
    - PMID:12682059
