suggested_questions:
- question: Which human NUMB isoforms (exon 3/exon 9 combinations) carry the clathrin-cargo adaptor activity
    versus the p53/MDM2 and Notch-antagonist activities?
- question: Is NUMB itself a direct activator of ITCH E3 activity (as Reactome describes for GLI1) and
    should that be captured as an MF (e.g. ubiquitin-protein transferase activator activity)?
suggested_experiments:
- description: Reconstitute NUMB PTB-domain binding to YxNxxF, Notch and integrin alpha5 cargo peptides
    together with AP-2 and clathrin in vitro, comparing p72 and p66 isoforms, to define cargo-adaptor
    specificity.
