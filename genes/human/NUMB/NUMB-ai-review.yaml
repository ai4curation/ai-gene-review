id: P49757
gene_symbol: NUMB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: NUMB is a cytoplasmic phosphotyrosine-binding (PTB) domain protein that acts as a cargo-specific
  clathrin endocytic adaptor. Its N-terminal PTB domain recognises sorting signals in transmembrane cargo
  (for example YxNxxF motifs in NPC1L1 and EAAT3, and the Notch intracellular region), while C-terminal
  DPF/NPF motifs bind the alpha-adaptin appendage of AP-2 and EH domains of EPS15/EPS15R/REPS1. NUMB associates
  peripherally with the plasma membrane at clathrin-coated pits and traffics to endosomes; AAK1 phosphorylation
  (T102) regulates this distribution. Through endocytic sorting and recruitment of E3 ubiquitin ligases
  (ITCH), NUMB antagonises Notch signalling and promotes GLI1 ubiquitination; it also binds MDM2 in a
  NUMB-p53-MDM2 complex that stabilises p53. Its cargoes include integrins, cadherins, L1 and glutamate
  receptors/transporters. In mice, Numb and its paralog Numbl maintain neural progenitors, radial glial
  adherens junctions and the subventricular niche. Alternative splicing of exons 3 and 9 produces isoforms
  (p72, p71, p66, p65) differing in membrane association and binding to EPS15 and AP-2.
