    label: clathrin-coated pit
  - id: GO:0005886
    label: plasma membrane
  - id: GO:0010008
    label: endosome membrane
  directly_involved_in:
  - id: GO:0072583
    label: clathrin-dependent endocytosis
  supported_by:
