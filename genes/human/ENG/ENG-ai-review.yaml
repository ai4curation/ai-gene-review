- question: Which stage- and cell-type-resolved experiments distinguish endoglin participation in initial
    de novo vasculogenesis from its established roles in later vascular remodeling and smooth-muscle investment?
    How should that distinction constrain the inherited general and CNS vasculogenesis annotations?
- question: Which original porcine endoglin assay supports glycosaminoglycan recognition underlying the
    PMID:8294451 transfer? Can direct ENG binding be distinguished from recognition of ENG-associated
    glycans by another assay component?
