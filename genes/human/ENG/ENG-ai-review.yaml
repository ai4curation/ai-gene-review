  review:
    summary: Endoglin is an auxiliary signaling coreceptor rather than an independently catalytic receptor.
    action: MODIFY
    reason: PMID18974388 describes long and short endoglin as auxiliary TGF-beta receptors and reports
      receptor interactions and different signaling responses. Its full Methods remain unavailable here.
      Independently inspected human-domain association and reporter experiments in PMID12015308, together
      with the BMP9 structural and signaling evidence, establish cooperation with signaling receptors.
      GO:0015026 captures that role more specifically than generic transmembrane signaling receptor activity
      without assigning kinase activity or equal activity to both natural products.
