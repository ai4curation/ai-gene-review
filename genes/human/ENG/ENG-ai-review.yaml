id: P17813
gene_symbol: ENG
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Endoglin (CD105) is a disulfide-linked, type I transmembrane glycoprotein that acts as a
  coreceptor in vascular signaling. Its extracellular orphan region binds BMP9 and BMP10, and its association
  with signaling receptors supports BMP9–ALK1–SMAD responses and context-dependent TGF-beta signaling.
  Endoglin is prominent on endothelial cell surfaces and contributes to vascular remodeling, vessel-wall
  maturation and selected cardiac developmental processes. Long and short splice products share the extracellular
  region but have different cytoplasmic tails; soluble extracellular forms also occur. Heterozygous pathogenic
  ENG variants cause hereditary hemorrhagic telangiectasia type 1.
