core_functions:
- description: DOCK7 catalyzes guanine-nucleotide exchange on Rho-family GTPases. Purified human DHR2
    fragments activate RAC1 and CDC42 when the GTPases are prenylated and associated with liposomes; the
    corresponding soluble, nonprenylated substrates show little or no exchange under those conditions.
    RAC signaling contributes to neuronal polarity and cytoskeletal remodeling. DOCK7 has a cytosolic
    pool and can be recruited into membrane-associated signaling complexes.
  molecular_function:
    id: GO:0005085
    label: guanyl-nucleotide exchange factor activity
  directly_involved_in:
  - id: GO:0035025
    label: positive regulation of Rho protein signal transduction
  locations:
  - id: GO:0005829
    label: cytosol
  substrates:
  - id: UniProtKB:P63000
    label: RAC1
  - id: UniProtKB:P60953
    label: CDC42
  supported_by:
  - reference_id: PMID:23718289
    supporting_text: robust activation of isoprenylated Rac1 and Cdc42 in a model liposome system
  - reference_id: PMID:16982419
  - reference_id: Reactome:R-HSA-8875591
- description: DOCK7 also regulates microtubule growth through TACC3 independently of its nucleotide-exchange
    domain. In mouse cortical radial glial cells, its TACC3-binding region controls interkinetic nuclear
    migration and the balance between progenitor expansion and neuronal differentiation. Human neuroblastoma
    cells show endogenous DOCK7 and TACC3 colocalization at the centrosome.
  directly_involved_in:
  - id: GO:0022027
    label: interkinetic nuclear migration
  locations:
  - id: GO:0005813
    label: centrosome
  supported_by:
  - reference_id: PMID:22842144
    supporting_text: does not involve its GEF activity
suggested_questions:
- question: Does DOCK7 stimulate GTP hydrolysis in any context, as distinct from its established nucleotide-exchange
    activity?
- question: Which endogenous cellular contexts permit DOCK7-dependent CDC42 activation, and how do membrane
    recruitment and prenylation determine substrate use?
- question: How does the DOCK7–TACC3 interaction alter microtubule growth independently of DHR2, and which
    natural products retain this mechanism?
- question: Does endogenous DOCK7 regulate septin organization independently of the LRCH3/fragment coexpression
    system?
suggested_experiments:
- description: Compare sequence-authenticated natural products and catalytic controls in separate nucleotide-exchange
    and GTP-hydrolysis assays using prenylated membrane-associated and soluble RAC1/CDC42.
  hypothesis: Membrane context and product composition determine exchange specificity without implying
    GAP activity.
  experiment_type: Biochemical substrate and product comparison
- description: Combine endogenous DOCK7 perturbation with TACC3-binding-deficient and DHR2-deficient rescue,
    measuring microtubule growth and nuclear migration separately from Rac activation.
  hypothesis: The TACC3-dependent nuclear-migration mechanism is separable from nucleotide exchange.
  experiment_type: Mechanistic separation-of-function rescue
