id: Q96N67
gene_symbol: DOCK7
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: DOCK7 is a large Rho-family guanine-nucleotide exchange factor that regulates neuronal polarity
  and the cytoskeleton. Its DHR2 domain catalyzes exchange on RAC1 and, under prenylated membrane-substrate
  conditions, CDC42. Rac signaling promotes microtubule-dependent axon formation. A separate TACC3-dependent
  mechanism regulates microtubule growth and interkinetic nuclear migration independently of the exchange
  domain. DOCK7 occupies cytosolic, axonal and centrosomal pools and associates with LRCH proteins and
  other cellular complexes. Its seven annotated products differ in internal segments or truncation; their
  functional equivalence has not been established.
