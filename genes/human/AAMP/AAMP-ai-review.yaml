      constant, 14 pmol) and mediates heparin-sensitive cell adhesion.
suggested_questions:
- question: >-
    Should the GO:0014909 IEP annotation be re-coded as IMP? PMID:18634987 reports
    overexpression, antibody-blockade and siRNA perturbations plus an in vivo antibody
    experiment in apoE-null mice - direct perturbation evidence, not an expression pattern.
    The same paper's evidence code also determines what the self-referential IBA on this gene
    is effectively transferring.
- question: >-
    How does AAMP protect RhoA from SMURF2 without being a ubiquitin-pathway protein itself -
    steric occlusion of the SMURF2 docking site, or competition for the same surface? A
    structural answer would determine whether a more specific molecular function term, such as
    a ubiquitin-ligase inhibitor activity, is justified.
- question: >-
    Are the cytosolic GTPase-regulating pool and the cell-surface heparin-binding pool the same
    protein doing two jobs, or is there a targeting mechanism that partitions them? AAMP has no
    signal peptide, so how the surface pool gets there is unexplained.
- question: >-
    Does the AAMP-AEN interaction mean anything? It is the only partner in the GOA record, is
    reproducible across four screens including an orthogonal AP-MS method, and yet is entirely
    unconnected to AAMP's characterised biology and has never been followed up.
- question: >-
    Is the NOD2/NF-kappaB arm mechanistically independent of the Rho-GTPase arm, or does it
    also run through cytoskeletal regulation? Rho GTPases are known modulators of NOD
    signalling, so the two functions may not be as separate as the literature presents them.
suggested_experiments:
- hypothesis: >-
    AAMP protects RhoA by occluding the SMURF2 interaction surface.
  description: >-
    Map the AAMP-RhoA interface by crosslinking mass spectrometry or structure determination,
    then test whether interface mutants that retain RhoA binding still block SMURF2-mediated
    ubiquitination, separating binding from protection.
  experiment_type: structural biology and biochemistry
- hypothesis: >-
    The cell-surface and cytosolic pools of AAMP have separable functions.
  description: >-
    Compare cells rescued with wild-type AAMP against a variant that cannot reach the surface,
    or with surface AAMP selectively blocked by antibody, scoring RhoA activity, stress-fibre
    formation, heparin-sensitive adhesion and tube formation independently.
  experiment_type: cell biology
- hypothesis: >-
    AAMP is a general regulator of Rho-family GTPase stability, not only RhoA.
  description: >-
    Measure the abundance, ubiquitination and activation state of a panel of Rho-family GTPases
    (RhoA, RhoB, RhoC, CDC42, RAC1) on AAMP knockout and overexpression, to establish the
    breadth of the stabilisation activity and whether the CDC42 effect is also stability-based.
  experiment_type: quantitative proteomics
- hypothesis: >-
    The AAMP-AEN interaction is a screen artefact rather than biology.
  description: >-
    Test the interaction by co-immunoprecipitation at endogenous expression levels and by
    proximity labelling, and check whether AAMP or AEN behaves as a frequent non-specific
    partner across unrelated baits in the same datasets.
  experiment_type: interaction validation
