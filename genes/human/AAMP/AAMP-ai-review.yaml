    label: positive regulation of small GTPase mediated signal transduction
  - id: GO:0050821
    label: protein stabilization
  - id: GO:0014909
    label: smooth muscle cell migration
  - id: GO:0010595
    label: positive regulation of endothelial cell migration
  - id: GO:0001525
    label: angiogenesis
