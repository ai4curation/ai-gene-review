    label: cytosol
  supported_by:
  - reference_id: PMID:34901393
    supporting_text: >-
      AAMP stabilized RhoA by binding to it and suppressing its SMURF2-mediated
      ubiquitination and degradation.
  - reference_id: PMID:33279622
    supporting_text: >-
      AAMP interacted with cell division cycle 42 (CDC42) and promoted its activation,
      resulting in the formation of cellular protrusions.
  - reference_id: PMID:18634987
    supporting_text: >-
      Knockdown of AAMP decreases RhoA activity in the membrane fraction of SMCs.
- description: >-
    Cell-surface heparin binding and heparin-sensitive adhesion. A basic N-terminal region of
    AAMP binds heparin with high affinity (Kd 14 pmol) and mediates glycosaminoglycan-dependent
    cell adhesion at the cell surface. This surface pool is functionally distinct from the
    cytosolic GTPase-regulating pool: it is the target of the blocking antibodies that inhibit
    endothelial tube formation and smooth muscle migration.
  molecular_function:
