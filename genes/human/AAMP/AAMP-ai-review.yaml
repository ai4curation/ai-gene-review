- term:
    id: GO:1903141
    label: negative regulation of establishment of endothelial barrier
  evidence_type: IMP
  original_reference_id: PMID:39404373
  qualifier: involved_in
  review:
    summary: >-
      Proposed new annotation. A proteomics screen for short-half-life regulators of
      endothelial integrity identified AAMP, and siRNA depletion of AAMP significantly
      increased trans-endothelial electrical resistance - that is, loss of AAMP improves
      barrier function, so AAMP is a negative regulator. The mechanism connects directly to
      the Rho annotations proposed above: AAMP depletion reduced RhoA and RhoB activity and
      total RhoA levels, diminishing actomyosin contraction in resting endothelial cells and
      shifting the spreading/contraction balance toward spreading. This is distinct from the
      existing migration and angiogenesis terms - barrier function is a separate endothelial
      property, and GOA records nothing for it.
    action: NEW
    reason: >-
      Adds a distinct, loss-of-function-supported endothelial process that no existing
      annotation covers, and which shares a mechanism with the proposed Rho-GTPase terms.
    supported_by:
    - reference_id: PMID:39404373
      supporting_text: >-
        these data identify AAMP and MTSS1 as novel negative regulators of endothelial
        barrier function
    - reference_id: PMID:39404373
      supporting_text: >-
        depletion of AAMP resulted in a significant increase in trans-endothelial electrical
        resistance
- term:
    id: GO:0070432
    label: regulation of nucleotide-binding oligomerization domain containing 2 signaling
      pathway
  evidence_type: IMP
  original_reference_id: PMID:19535145
  qualifier: involved_in
  review:
    summary: >-
      Proposed new annotation covering AAMP's innate-immune role, which the gene description
      reports but which GOA does not represent at all. AAMP was identified as a NOD2 binding
      partner in a two-hybrid screen, the interaction was confirmed by co-immunoprecipitation
      from human cells and mapped to an internal peptide spanning three WD40 domains, and both
      overexpression and siRNA knockdown showed that AAMP modulates NOD2- and NOD1-mediated
      NF-kappaB activation in HEK293T cells. The non-directional parent term is used
      deliberately: the paper says "modulates" and does not establish a consistent direction,
      so GO:0070434 (positive) or GO:0070433 (negative) would assert more than the evidence
      supports. Bidirectional perturbation in a human cell line is nonetheless IMP-grade
      evidence for regulation as such.
    action: NEW
    reason: >-
      Represents a documented, experimentally supported arm of AAMP function that GOA omits
      entirely; the unsigned parent is chosen because the source does not resolve direction.
      Deliberately not carried into core_functions: it rests on a single 2009 study with no
      follow-up and is mechanistically disconnected from the Rho-GTPase axis that accounts for
      everything else this gene does. Annotated because the evidence supports it, kept non-core
      because its weight relative to the rest of the record is small.
    supported_by:
    - reference_id: PMID:19535145
      supporting_text: >-
        we showed that AAMP modulates Nod2- and Nod1-mediated NF-kappaB activation in
        HEK293T cells.
    - reference_id: PMID:19535145
      supporting_text: >-
        revealed that an internal peptide of AAMP spanning three WD40 domains was
        sufficient for this interaction.
core_functions:
- description: >-
    Positive regulation of Rho-family small GTPases. AAMP binds RhoA directly and shields it
    from SMURF2-mediated ubiquitination and degradation, increasing the active RhoA pool, and
    binds CDC42 and promotes its activation. Through RhoA/Rho-kinase signalling this drives
    actin stress-fibre formation, membrane protrusion, cell spreading and motility. The same
    axis underlies AAMP's requirement in VEGF-induced endothelial migration and angiogenesis
    and in smooth muscle cell migration and neointima formation.
  molecular_function:
    id: GO:0031267
    label: small GTPase binding
  directly_involved_in:
