id: Q13685
gene_symbol: AAMP
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  AAMP (angio-associated migratory cell protein) is a 52 kDa WD40-repeat protein
  that also carries immunoglobulin-like domains and an N-terminal basic
  heparin-binding region. It occupies two pools: an intracellular cytosolic pool
  and a plasma-membrane/cell-surface pool, the latter mediating high-affinity
  heparin binding and heparin-sensitive, glycosaminoglycan-dependent cell
  adhesion. Functionally AAMP is a positive regulator of Rho-family small GTPases
  and hence of actin-based motility. It binds RhoA directly and shields it from
  SMURF2-mediated ubiquitination and degradation, raising the pool of active
  RhoA, and it binds CDC42 and promotes its activation, driving formation of
  cellular protrusions. Through RhoA/Rho-kinase signalling AAMP is required for
  VEGF-induced endothelial cell spreading, migration, actin stress-fibre
  formation and tube formation, and for smooth muscle cell migration and
  neointima formation after arterial injury; antibody blockade of surface AAMP
  inhibits both. It is expressed in endothelial cells, trophoblasts, smooth
  muscle and many tumours, and its upregulation promotes migration and invasion
  in colorectal and non-small-cell lung cancer. Separately from its cytoskeletal
  role, its WD40 domains engage the innate-immune receptor NOD2 and modulate
  NOD1/NOD2-driven NF-kappaB activation. In endothelial cells AAMP is itself a
  short-lived, ubiquitination-controlled protein and acts as a negative regulator
  of barrier function: its depletion lowers RhoA and RhoB activity and raises
  trans-endothelial electrical resistance.
