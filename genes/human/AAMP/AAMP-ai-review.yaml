- id: PMID:18634987
  title: Blockade of angio-associated migratory cell protein inhibits smooth muscle
    cell migration and neointima formation in accelerated atherosclerosis.
  findings:
  - statement: >-
      AAMP overexpression increases smooth muscle cell migration while anti-AAMP antibody and
      siRNA decrease it; antibody blockade also reduces neointimal SMC density and neointima
      formation in apoE-null mice.
    supporting_text: >-
      The AAMP overexpression increases, while both treatment with anti-rAAMP-ab and
      transfection with siRNA decreases SMC migration.
  - statement: >-
      AAMP knockdown reduces RhoA activity specifically in the membrane fraction of smooth
      muscle cells, linking AAMP to Rho signalling.
    supporting_text: >-
      Knockdown of AAMP decreases RhoA activity in the membrane fraction of SMCs.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Cached record title matches the citation; abstract-only, but the structured abstract
      states the results used here explicitly. Note the discrepancy flagged in this review: GOA
      codes the annotation from this paper as IEP, yet the paper reports overexpression, siRNA,
      antibody-blockade and in vivo perturbation experiments, which is IMP-grade evidence.
