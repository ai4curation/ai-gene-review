- term:
    id: GO:0031267
    label: small GTPase binding
  evidence_type: IPI
  original_reference_id: PMID:34901393
  qualifier: enables
  review:
    summary: >-
      Proposed new annotation. Apart from heparin binding, AAMP currently has no molecular
      function in GOA, so nothing in the record connects it to the mechanism by which it
      controls migration. Two independent groups have shown direct binding to Rho-family small
      GTPases: AAMP binds RhoA and suppresses its SMURF2-mediated ubiquitination and
      degradation, and AAMP interacts with CDC42 and promotes its activation. A third study
      (PMID:39404373) independently reports that AAMP controls both RhoA and RhoB activity and
      stability in endothelial cells. On the term choice: GO:0017048 "Rho GTPase binding" is
      not an available alternative, because it was merged into GO:0031267. QuickGO resolves
      the identifier GO:0017048 to GO:0031267, which lists it among its secondaryIds alongside
      GO:0005084, GO:0008536 and GO:0017016, and carries "Rho GTPase binding" as a synonym.
      There is no live Rho-specific binding term to prefer - GO:0031267 is that term now, and
      its broader label reflects a deliberate ontology merge rather than a loss of precision.
    action: NEW
    reason: >-
      Supplies the missing molecular function that links AAMP's binding activity to its
      well-annotated migration and angiogenesis phenotypes.
    additional_reference_ids:
    - PMID:33279622
    - PMID:39404373
    supported_by:
    - reference_id: PMID:34901393
      supporting_text: >-
        AAMP stabilized RhoA by binding to it and suppressing its SMURF2-mediated
        ubiquitination and degradation.
    - reference_id: PMID:33279622
      supporting_text: >-
        AAMP interacted with cell division cycle 42 (CDC42) and promoted its activation,
        resulting in the formation of cellular protrusions.
    - reference_id: PMID:39404373
      supporting_text: >-
        Mechanistically, AAMP controls both RhoA and RhoB activity and stability.
- term:
    id: GO:0050821
    label: protein stabilization
  evidence_type: IMP
  original_reference_id: PMID:34901393
  qualifier: involved_in
  review:
    summary: >-
      Proposed new annotation capturing the specific mechanism by which AAMP raises active
      RhoA levels. SMURF2 is an E3 ubiquitin ligase that ubiquitinates RhoA and targets it for
      degradation; AAMP binds RhoA and suppresses that ubiquitination, so RhoA protein is
      stabilised and the active pool rises. This is a distinct, mechanistically defined
      activity rather than a restatement of the binding annotation, and it is what converts
      AAMP from a Rho-associated protein into a Rho regulator.
    action: NEW
    reason: >-
      Records the demonstrated stabilisation mechanism, which no existing annotation captures.
    additional_reference_ids:
    - PMID:39404373
    supported_by:
    - reference_id: PMID:34901393
      supporting_text: >-
        AAMP stabilized RhoA by binding to it and suppressing its SMURF2-mediated
        ubiquitination and degradation.
    - reference_id: PMID:39404373
      supporting_text: >-
        Mechanistically, AAMP controls both RhoA and RhoB activity and stability.
- term:
    id: GO:0051057
    label: positive regulation of small GTPase mediated signal transduction
  evidence_type: IMP
  original_reference_id: PMID:26350504
  qualifier: involved_in
  review:
    summary: >-
      Proposed new annotation. AAMP positively regulates Rho-family GTPase signalling, and the
      effect is directional and consistent across cell types and laboratories: knockdown
      reduces membrane RhoA activity in smooth muscle cells, RhoA/Rho-kinase signalling
      mediates AAMP's control of endothelial migration and angiogenesis, AAMP stabilises RhoA
      against degradation, and AAMP promotes CDC42 activation. GOA currently records the
      downstream phenotypes (migration, angiogenesis) but not the signalling pathway that
      produces them.
    action: NEW
    reason: >-
      Connects the two existing process annotations to their shared mechanism; supported by
      loss-of-function evidence in two cell types from independent groups.
    additional_reference_ids:
    - PMID:18634987
    - PMID:33279622
    - PMID:34901393
    supported_by:
    - reference_id: PMID:26350504
      supporting_text: >-
        Furthermore, we identified RhoA/Rho kinase signaling as an important factor that
        contributes to the action of AAMP in regulating endothelial cell migration and
        angiogenesis.
    - reference_id: PMID:18634987
      supporting_text: >-
        Knockdown of AAMP decreases RhoA activity in the membrane fraction of SMCs.
    - reference_id: file:human/AAMP/AAMP-deep-research-affinage.md
