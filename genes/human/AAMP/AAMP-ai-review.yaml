- id: PMID:39404373
  title: AAMP and MTSS1 Are Novel Negative Regulators of Endothelial Barrier Function
    Identified in a Proteomics Screen.
  findings:
  - statement: >-
      siRNA depletion of AAMP significantly increases trans-endothelial electrical resistance,
      identifying AAMP as a negative regulator of endothelial barrier function.
    supporting_text: >-
      these data identify AAMP and MTSS1 as novel negative regulators of endothelial
      barrier function
  - statement: >-
      AAMP controls the activity and the stability of both RhoA and RhoB - independent
      corroboration, in a different cell type and for a second Rho GTPase, of the
      SMURF2/RhoA mechanism reported in colorectal cancer cells.
    supporting_text: >-
      Mechanistically, AAMP controls both RhoA and RhoB activity and stability.
  - statement: >-
      In a confluent endothelial monolayer, ectopically expressed AAMP localised to nucleus
      and cytosol but not to the plasma membrane, a caveat on the constitutive nature of the
      surface pool.
    supporting_text: >-
      AAMP expression in the nucleus and cytosol; however, AAMP was not localized at the
      plasma membrane
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Cached full text matches the cited title. Added after PR review feedback pointed out that
      it was cached by this PR but cited nowhere, while two claims depended on it. It is the
      third independent laboratory to report AAMP-dependent Rho GTPase regulation, extends it
      to RhoB, and is the sole source for the proposed endothelial-barrier annotation.
- id: file:human/AAMP/AAMP-deep-research-affinage.md
  title: Affinage mechanistic annotation for AAMP (human)
  findings:
  - statement: >-
      Machine-fetched Affinage record (trust gates passed) describing AAMP as a WD40- and
      immunoglobulin-domain protein acting as a positive regulator of Rho-family GTPases and
      the actin cytoskeleton, with the CDC42 activation mechanism attributed to impeding the
      ARHGAP1-CDC42 interaction.
    supporting_text: >-
      binds CDC42 to promote its activation by impeding the ARHGAP1–CDC42 interaction
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      External precomputed LLM research, treated as a preliminary source; every claim used was
      re-verified against the cited PMIDs. Its main value here was assembling the scattered
      RhoA/RhoB/CDC42 literature into one mechanistic picture, which is what made the three
      proposed annotations possible - GOA and UniProt between them mention Rho only once, in a
      hedged "may act through the RhoA pathway". Its GO grounding (GO:0098772, GO:0008092,
      GO:0060090, GO:0008289) was not imported; GO:0008289 lipid binding in particular has no
      support in the cited literature and looks like a spurious inference from the heparin and
      glycosaminoglycan work.
