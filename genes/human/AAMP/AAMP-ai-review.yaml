- id: PMID:26350504
  title: AAMP Regulates Endothelial Cell Migration and Angiogenesis Through RhoA/Rho
    Kinase Signaling.
  findings:
  - statement: >-
      RhoA/Rho-kinase signalling mediates AAMP's control of endothelial cell migration and
      angiogenesis; AAMP knockdown reduced VEGF-induced actin stress fibres and collagen gel
      contraction, and knockdown or antibody blockade impaired VEGF-induced tube formation and
      aortic ring sprouting.
    supporting_text: >-
      Furthermore, we identified RhoA/Rho kinase signaling as an important factor that
      contributes to the action of AAMP in regulating endothelial cell migration and
      angiogenesis.
  - statement: >-
      VEGF upregulates AAMP expression and recruits AAMP to cell membrane protrusions.
    supporting_text: >-
      Moreover, VEGF recruited AAMP to the cell membrane protrusions.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Cached record title matches the citation. Establishes the RhoA/Rho-kinase mechanism in
      endothelial cells and is a primary support for the proposed GO:0051057 annotation.
      Abstract-only, but the quoted results are stated there.
- id: PMID:34901393
  title: AAMP promotes colorectal cancermetastasis by suppressing SMURF2-mediatedubiquitination
    and degradation of RhoA.
  findings:
  - statement: >-
      AAMP binds RhoA and suppresses its SMURF2-mediated ubiquitination and degradation,
      stabilising RhoA and raising the level of active RhoA.
    supporting_text: >-
      AAMP stabilized RhoA by binding to it and suppressing its SMURF2-mediated
      ubiquitination and degradation.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Cached full text matches the cited title. The title as indexed contains missing spaces
      ("cancermetastasis", "SMURF2-mediatedubiquitination"); that is how it appears in the
      source record and is reproduced verbatim here rather than silently corrected. Primary
      support for the proposed GO:0031267 and GO:0050821 annotations, and the clearest
      mechanistic account of how AAMP raises active RhoA.
