- term:
    id: GO:0014909
    label: smooth muscle cell migration
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: >-
      The WITH/FROM field of this IBA is PANTHER:PTN001068868|UniProtKB:Q13685, and Q13685 is
      human AAMP itself - the gene being annotated. That self-reference is not a defect. As
      clarified by the repository maintainer during review, a self-referential IBA is a valid
      and meaningful curation act: it records that the PAINT curator inspected the source
      annotation, judged the function to be core rather than peripheral, and found the
      assignment evolutionarily coherent, with an IBD supporting it further up the tree. The
      IBA is therefore an independent curatorial judgement layered on top of the experimental
      annotation, not a circular restatement of it.

      The underlying biology is well demonstrated in any case: overexpression increases smooth
      muscle cell migration, antibody treatment and siRNA decrease it, and antibody blockade
      reduces neointima formation in apoE-null mice. Accept as a core process.
    action: ACCEPT
    reason: >-
      Correct and core. The self-reference in WITH/FROM reflects a curator judging this
      function core for the family node, which is the intended use of IBA, not a propagation
      failure.
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
