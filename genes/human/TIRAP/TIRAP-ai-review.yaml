core_functions:
- description: Bridging (sorting) signaling adaptor that couples activated TLR4 and TLR2 TIR domains to
    MyD88 at the plasma membrane, initiating MyD88-dependent signaling to NF-kappaB and MAP kinases.
  molecular_function:
    id: GO:0035591
    label: signaling adaptor activity
  directly_involved_in:
  - id: GO:0035665
    label: TIRAP-dependent toll-like receptor 4 signaling pathway
  - id: GO:0034134
    label: toll-like receptor 2 signaling pathway
  locations:
  - id: GO:0031234
    label: extrinsic component of cytoplasmic side of plasma membrane
  supported_by:
  - reference_id: PMID:16751103
    supporting_text: TIRAP then functions to facilitate MyD88 delivery to activated TLR4 to initiate signal
      transduction.
  - reference_id: PMID:17258210
