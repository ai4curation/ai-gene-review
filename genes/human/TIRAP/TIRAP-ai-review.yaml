suggested_questions:
- question: Beyond TLR2 and TLR4 at the plasma membrane, does TIRAP act as a bridging adaptor for endosomal
    TLRs (e.g. TLR9) in human cells, and if so through which endosomal phosphoinositide?
- question: Is TIRAP a physiological adaptor for RAGE signaling in vivo, and should RAGE-dependent signaling
    be represented as a TIRAP process (no specific GO pathway term currently exists)?
- question: What is the mechanistic basis for the disputed disease associations of the S180L variant,
    given reports that it abolishes TLR2 binding versus population studies that fail to replicate?
- question: Should 'positive regulation of toll-like receptor N signaling pathway' annotations on obligate
    pathway components such as TIRAP be systematically converted to pathway membership terms?
suggested_experiments:
- description: CRISPR knockout of TIRAP in human primary macrophages or iPSC-derived macrophages, profiling
    responses to TLR1/2, TLR2/6, TLR4, TLR7/8 and TLR9 agonists across a ligand dose range, to define
    human TLR adaptor requirements.
- description: Reconstitution of TIRAP-null human cells with PIP2-binding motif mutants and membrane-targeting
    chimeras to test whether membrane targeting alone accounts for TIRAP's requirement.
- description: In vitro reconstitution of TLR4-TIR / TIRAP / MyD88 complex assembly with S180L and D96N
    variants, measured by cryo-EM or fluorescence polarization, to quantify variant effects on nucleation.
