id: P58753
gene_symbol: TIRAP
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: TIRAP (TIR domain-containing adapter protein; also called Mal, MyD88-adapter-like) is a 221-residue
  cytoplasmic signaling adaptor of the innate immune system, consisting of a disordered N-terminal region
  carrying a phosphatidylinositol 4,5-bisphosphate (PIP2)-binding motif and a C-terminal Toll/interleukin-1
  receptor (TIR) domain. Through PIP2 binding TIRAP is pre-positioned on the cytoplasmic face of the plasma
  membrane, where its TIR domain engages the TIR domains of activated TLR4 and TLR2 (with TLR1 or TLR6)
  and recruits the adaptor MyD88; it therefore acts as a bridging or sorting adaptor for the MyD88-dependent
  branch of TLR2 and TLR4 signaling, leading via IRAK kinases and TRAF6 to activation of NF-kappaB, JNK
  and ERK and to production of inflammatory cytokines such as TNF and IL-6. TIRAP is not required for
  TRIF-dependent signaling (TLR3, or the IFN-beta branch of TLR4) or for TLR7 and TLR9 responses in knockout
  mice. TIRAP also binds the phosphorylated cytoplasmic tail of RAGE (AGER) and the PI3K regulatory subunit
  p85alpha, and its activity is regulated by BTK and IRAK phosphorylation and by ubiquitin-mediated degradation.
  The common S180L variant, which attenuates TLR2 binding and signaling, has been associated with altered
  susceptibility to invasive bacterial disease, malaria and tuberculosis, and the TIR domain is a target
  of bacterial TIR-domain mimics such as Brucella TcpB.
