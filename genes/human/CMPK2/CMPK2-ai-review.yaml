id: Q5EBM0
gene_symbol: CMPK2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  CMPK2 is an interferon-inducible mitochondrial pyrimidine nucleotide kinase in the
  thymidylate kinase family. Its C-terminal kinase domain phosphorylates dUMP, dCMP,
  CMP and UMP with ATP and supports mitochondrial pyrimidine nucleotide metabolism, but
  it has diverged from the canonical dTMP kinase activity of DTYMK. Its N-terminal
  mitochondrial targeting sequence directs the protein to mitochondria, and its
  mammal-specific N-terminal domain mediates kinase-independent restriction of
  flavivirus translation when localized at mitochondria. Biallelic loss-of-function
  variants in CMPK2 are associated with idiopathic basal ganglia calcification.
