suggested_questions:
- question: What is the glial counter-receptor for ASTN1, and does ASTN2 bind ASTN1 in cis to gate adhesion
    or only to direct its endocytosis?
suggested_experiments:
- description: Use proximity labelling or an ASTN1 ectodomain-Fc probe on Bergmann glia to identify the
    glial receptor, then test binding-deficient ASTN1 mutants for rescue of granule-cell migration in
    Astn1-null slices.
