knowledge_gaps:
- gap_statement: The glial receptor that ASTN1 binds, and the molecular activity that mediates neuron-glia
    adhesion, are unknown.
  boundary: 'Established: ASTN1 confers neuron-glia binding and is needed for normal migration rates (mouse
    antibody, transfection and knockout studies). It is a surface membrane protein whose level is controlled
    by ASTN2 and endocytosis. Not established: the glial binding partner, which ASTN1 domain contacts
    it, and whether ASTN1 also signals.'
