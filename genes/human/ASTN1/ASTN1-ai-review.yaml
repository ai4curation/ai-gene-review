- id: PMID:8602532
  title: CNS gene encoding astrotactin, which supports neuronal migration along glial fibers.
  findings:
  - statement: Antibodies to astrotactin block granule-cell migration on glia.
    supporting_text: Fab fragments of antibodies to a recombinant astrotactin peptide blocked migration
      of cerebellar granule neurons in vitro along astroglial fibers.
  - statement: Astrotactin acts as a neuron-glia binding ligand.
    supporting_text: Transfection of astrotactin complementary DNA into 3T3 cells indicated that astrotactin
      acts as a ligand for neuron-glia binding during neuronal migration.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only; mouse cloning and functional assays.
  full_text_unavailable: true
- id: PMID:11861479
  title: Mice that lack astrotactin have slowed neuronal migration.
  findings:
  - statement: Astn1-null granule cells show less glial binding and slower migration.
    supporting_text: In vitro and in vivo cerebellar granule cell assays show a decrease in neuron-glial
      binding, a reduction in migration rates and abnormal development of Purkinje cells.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only; mouse knockout.
  full_text_unavailable: true
- id: PMID:20573900
  title: Astn2, a novel member of the astrotactin gene family, regulates the trafficking of ASTN1 during
    glial-guided neuronal migration.
  findings:
  - statement: ASTN2 complexes with ASTN1 and regulates its surface level.
    supporting_text: Biochemical and flow cytometry experiments show that ASTN2 forms a complex with ASTN1
      and regulates surface expression of ASTN1.
  - statement: ASTN1 is trafficked to the leading process.
    supporting_text: Live imaging of Venus-tagged ASTN1 in migrating cerebellar granule cells reveals
      the intracellular trafficking of ASTN1-Venus, with ASTN1-Venus accumulating in the forward aspect
      of the leading process where new sites of adhesion will form.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only in cache (PMC2905051 exists but full text was not retrieved); mouse trafficking
      study.
  full_text_unavailable: true
- id: PMID:41544630
  title: Bi-allelic variants in neuronal adhesion molecule astrotactin 1 gene ASTN1 cause diverse neurodevelopmental
    disorders.
  findings:
  - statement: Bi-allelic ASTN1 variants cause neurodevelopmental disorders.
    supporting_text: Here, we describe eighteen individuals with NDDs from twelve unrelated families with
      bi-allelic, ultra-rare, predicted damaging variants in ASTN1 and one individual with heterozygous
      variants in both ASTN1 and ASTN2 .
  - statement: Patients have cortical and cerebellar malformations.
    supporting_text: Brain malformations appreciated were varied and included mild cerebral atrophy, polymicrogyria,
      lissencephaly, colpocephaly, malformation of the hippocampus, bilateral periventricular hyperintensities,
      and dysgenesis of the corpus callosum and cerebellum.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text; human genetics cohort (18 individuals, 12 families).
