id: O14525
gene_symbol: ASTN1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ASTN1 (astrotactin 1) is a large neuronal membrane protein with two transmembrane helices
  and an extracellular region carrying three EGF-like repeats and a fibronectin type III domain. It is
  expressed in postmitotic neuronal precursors of laminated brain regions and acts as a neuronal ligand
  for adhesion to radial and Bergmann glial fibres during glial-guided migration. Its paralog ASTN2 forms
  a complex with it and controls its surface level. ASTN1 is endocytosed and recycled to the front of
  the leading process, which may coordinate making and releasing glial contacts as the neuron moves. Astn1-null
  mice have slowed granule cell migration, small cerebella and poor motor coordination. Bi-allelic ASTN1
  variants in humans cause neurodevelopmental disorders with variable cortical and cerebellar malformations.
