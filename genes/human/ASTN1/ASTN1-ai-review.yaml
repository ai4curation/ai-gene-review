  review:
    summary: 'Endosome (IBA). ASTN1 is found in a subset of RhoB-positive endosomes, and its surface level
      is controlled by clathrin-mediated endocytosis. This endocytic recycling is thought to help release
      glial adhesions as the neuron moves. Endosomes are a trafficking compartment, though: ASTN1''s adhesion
      activity is at the cell surface. The location is correct, but the IBA''s is_active_in qualifier
      overstates it. Kept as non-core, consistent with the clathrin-coated vesicle row.'
    action: KEEP_AS_NON_CORE
    reason: '[PMID:20573900 "In single, optical sections of fixed cells, both ASTN1 and ASTN2 are expressed
      in a subset of RhoB-positive endosomes, as well as in vesicles that are not RhoB positive"] [PMID:20573900
      "These findings support the idea that surface localization of ASTN1-Venus is regulated by clathrin-mediated
      receptor endocytosis."] [PMID:20573900 "Together, these findings suggest that ASTN2 regulates the
      levels of ASTN1 in the plasma membrane and that the release of neuronal adhesions to the glial fiber
      during neuronal locomotion involves the intracellular trafficking of ASTN1."] [PMID:20573900 "ASTN1
      is exposed on the cell surface and, as demonstrated previously ( Stitt and Hatten, 1990 ; Zheng
      et al., 1996 ), provides a ligand for neuron-glial adhesion during migration."]'
    supported_by:
    - reference_id: PMID:20573900
      supporting_text: In single, optical sections of fixed cells, both ASTN1 and ASTN2 are expressed
        in a subset of RhoB-positive endosomes, as well as in vesicles that are not RhoB positive
    - reference_id: PMID:20573900
      supporting_text: These findings support the idea that surface localization of ASTN1-Venus is regulated
        by clathrin-mediated receptor endocytosis.
    - reference_id: PMID:20573900
      supporting_text: Together, these findings suggest that ASTN2 regulates the levels of ASTN1 in the
        plasma membrane and that the release of neuronal adhesions to the glial fiber during neuronal
        locomotion involves the intracellular trafficking of ASTN1.
    - reference_id: PMID:20573900
      supporting_text: ASTN1 is exposed on the cell surface and, as demonstrated previously ( Stitt and
        Hatten, 1990 ; Zheng et al., 1996 ), provides a ligand for neuron-glial adhesion during migration.
