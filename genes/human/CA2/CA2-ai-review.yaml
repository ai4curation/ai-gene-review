core_functions:
- description: Catalyzes reversible CO2/bicarbonate interconversion through a zinc-dependent
    active site, supporting cytosolic acid-base equilibration and intracellular pH
    regulation. Transport proteins move the ions across membranes; CAII performs the
    associated carbonate chemistry.
  molecular_function:
    id: GO:0004089
    label: carbonate dehydratase activity
  directly_involved_in:
