suggested_questions:
- question: Under which native transporter and tissue contexts does CAII form a direct
    complex that changes ion flux independently of effects on the pH-based assay readout?
- question: What target-specific human evidence establishes apical enrichment and
    myelin-sheath localization, and which primary donor assays underlie the transferred
    annotations?
- question: Do the measurable arylesterase and cyanamide-hydration activities contribute
    materially to any endogenous human pathway?
suggested_experiments:
- description: Compare purified full-length transporter–CAII binding in an appropriate
    membrane system with tag-free domain controls, and pair direct ion-flux measurements
    with pH kinetics and catalytically inactive CAII controls.
