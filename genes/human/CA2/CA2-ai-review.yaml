id: P00918
gene_symbol: CA2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Carbonic anhydrase II is a soluble zinc-dependent enzyme that rapidly
  and reversibly interconverts carbon dioxide and water with bicarbonate and protons.
  Its cytosolic catalysis supports intracellular pH control and the supply or removal
  of substrates coupled to epithelial acid-base transport. Human enzyme structures
  and mutational kinetics define the catalytic zinc environment and proton-transfer
  network. CAII can associate with the cytosolic face of membrane transport proteins,
  although direct binding and substrate-channeling interpretations depend on the transporter
  and assay. It also displays arylesterase and cyanamide-hydration activities in vitro.
  Biallelic CA2 deficiency causes osteopetrosis with renal tubular acidosis and cerebral
  calcification.
