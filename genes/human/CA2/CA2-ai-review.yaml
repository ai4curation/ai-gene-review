  review:
    summary: Retain experimentally observed arylesterase activity as a secondary activity.
    action: KEEP_AS_NON_CORE
    reason: The human CAII His64-mutant abstract explicitly reports hydrolysis of
      4-nitrophenyl acetate. That substrate fits the phenyl-acetate reaction in the
      official GO definition. This laboratory side activity does not establish an
      independent physiological aryl-ester pathway or replace CO2/bicarbonate catalysis
      as the central function. The source is abstract-only.
