suggested_questions:
- question: How much GlcNAc transfer does the EXT1 GT-A domain supply in an intact, membrane-associated
    human EXT1–EXT2 complex, and under which acceptor or donor conditions does that contribution become
    appreciable relative to EXT2?
- question: Which differences between the older separately expressed EXT1 preparations and the modern
    heterocomplex assays arise from acceptor chemistry, expression and purification, protein integrity,
    or catalytic versus allosteric effects of the GT-A substitutions?
- question: How are alternating GlcA and GlcNAc additions coordinated between catalytic sites in the native
    Golgi complex, and does the growing chain dissociate between transfers under physiological conditions?
suggested_experiments:
- hypothesis: EXT1 GT-A supplies a condition-dependent GlcNAc-transfer component that can be separated
    from effects on heterocomplex stability.
  description: Compare sequence-verified human wild-type complexes with EXT1 GT-A, EXT2 GT-A and EXT1
    GT-B substitutions under matched expression and purification conditions. Quantify intact protein abundance,
    complex assembly and stability before measuring single-sugar transfer with defined acceptors and product-resolved
    chromatography or mass spectrometry. Include both soluble catalytic constructs and membrane-reconstituted
    full-length proteins, with appropriate inactive and donor-omission controls.
  experiment_type: Controlled enzyme kinetics and product analysis
- hypothesis: Preparation integrity and acceptor conditions explain part of the different activity assignments
    in separately expressed EXT1 and assembled EXT1–EXT2 assays.
  description: Reproduce the earlier K5-derived oligosaccharide and modern short-acceptor or glypican
    assays side by side using matched human constructs. Measure both transfer reactions, chain-length
    distributions and enzyme integrity; test for copurifying endogenous EXT2 with sequence-specific proteomics.
    Normalize rates to intact active preparations rather than total tag signal, and distinguish qualitative
    activity from quantitative equivalence.
  experiment_type: Comparative biochemical reconstitution
- hypothesis: Alternating extension can be coordinated without obligatory direct substrate channeling.
  description: Use pulse-chase labeled donors and competing acceptors with purified human heterocomplexes
    to test whether partially elongated chains remain enzyme-bound between additions. Combine time-resolved
    product distributions with binding and turnover measurements, and compare the behavior of membrane-associated
    and soluble complexes without assuming that structural proximity alone establishes channeling.
  experiment_type: Time-resolved chain-extension and substrate-exchange assays
