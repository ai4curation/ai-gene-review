      EXT1 residues 29–746 and human EXT2 lacking residues 1–46 are secreted using engineered leaders
      from HEK293 cells, captured on anti-FLAG agarose and tested on free K5-derived oligosaccharides.
      Product digestion supports beta-GlcA/alpha-GlcNAc extension; Figure 6 gel filtration supports apparent
      EXT1 homodimer and EXT1–EXT2 heterocomplex. Isoelectric-focusing assessment of endogenous contamination
      is reported but not displayed. No original figure pixels were newly inspected, no physiological
      secretion or all-product equivalence is inferred.
  full_text_unavailable: false
- id: PMID:17761672
