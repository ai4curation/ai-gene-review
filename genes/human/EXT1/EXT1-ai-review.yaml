core_functions:
- description: Transfer glucuronic acid from UDP-glucuronate to a GlcNAc-terminated heparan sulfate chain
    through the EXT1 GT-B catalytic domain. This is the principal glucuronyl-transfer step of the Golgi
    EXT1–EXT2 elongation complex; human enzyme assays and catalytic substitutions establish the chemistry
    independently of developmental phenotypes.
  molecular_function:
    id: GO:0050509
    label: N-acetylglucosaminyl-proteoglycan 4-beta-glucuronosyltransferase activity
  directly_involved_in:
