    id: GO:0000271
    label: polysaccharide biosynthetic process
  evidence_type: IDA
  original_reference_id: PMID:12907669
  qualifier: involved_in
  review:
    summary: The experimentally established polymerization belongs to heparan-sulfate biosynthesis.
    action: MODIFY
    reason: 'PMID:12907669 Methods and Figures 2–5 demonstrate extension of K5-derived heparan-sulfate
      backbone acceptors by soluble human EXT1 preparations, with linkage-sensitive product digestion.
      Replace the broad polysaccharide process with the specific heparan-sulfate proteoglycan process
      already represented for this gene. This is an evidence-based lateral specificity correction, not
      a claimed current ontology descendant: the 2003 acceptors lack a core protein, whereas independent
      PMID:36593275 directly assays glypican-1-associated chain elongation. EXT1 catalyzes chain elongation;
      it does not synthesize the core protein or every linker residue.'
    supported_by:
    - reference_id: PMID:12907669
    - reference_id: PMID:36593275
    proposed_replacement_terms:
    - id: GO:0015012
      label: heparan sulfate proteoglycan biosynthetic process
