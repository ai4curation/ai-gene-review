id: Q16394
gene_symbol: EXT1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: EXT1 is a type II membrane glycosyltransferase that forms the EXT1–EXT2 complex in the Golgi
  and elongates the heparan sulfate chains of proteoglycans. Its N-terminal GT-B domain supplies the principal
  beta-1,4-glucuronyl-transfer activity, adding glucuronic acid from UDP-glucuronate to a terminal N-acetylglucosamine.
  EXT1 also has measurable alpha-1,4-N-acetylglucosaminyl-transfer capacity, although its contribution
  to that reaction in the assembled enzyme is less firmly quantified than the dominant activity of EXT2.
  Alternating sugar addition by the complex builds the backbone subsequently modified into heparan sulfate,
  which supports extracellular signaling and tissue organization. Loss of EXT1 function disrupts heparan
  sulfate synthesis and is associated with hereditary multiple exostoses.
