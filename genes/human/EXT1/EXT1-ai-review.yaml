    correctness: UNVERIFIED
    review_notes: 'PubMed identity and the positive abstract were verified: COS-7 oligomerization/Golgi
      localization and neonatal mouse chondrocyte expression are reported. Publisher/DOI and alternate
      searches did not recover the complete operative original. Insert species, antibody details and the
      imported ER contexts remain source-specific access limits. Independent actually read human EXT1
      studies support the reviewed location and complex refinements without claiming to verify this paper’s
      protocol.'
  full_text_unavailable: true
- id: PMID:12907669
