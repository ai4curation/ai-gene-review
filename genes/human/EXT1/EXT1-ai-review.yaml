      Methods, operative Results and captions were read. Human EXT1 depletion in HEK293 cells shortens
      HS chains and lowers the HS/chondroitin-sulfate ratio. Full-length EXT1/EXT2 overexpression constructs
      are mouse brain cDNAs; the soluble constructs refer to the prior human study. Do not conflate those
      experiments or assign the EXT2 localization image to EXT1. Main figure pixels and supplements were
      not inspected.
