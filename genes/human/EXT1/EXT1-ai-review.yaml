- id: PMID:10639137
  title: The putative tumor suppressors EXT1 and EXT2 form a stable complex that accumulates in the Golgi
    apparatus and catalyzes the synthesis of heparan sulfate.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Actual author-uploaded original Methods, Results, Table 1 and relevant captions were
      read. Human HeLa-derived EXT1 is assayed in BHK/mouse sog9 cells with murine or bovine EXT2 constructs.
      Figure 2 shows Golgi-marker colocalization after co-expression; Figure 3 supports self/hetero-association;
      Table 1 measures sugar transfer by immunoprecipitates. The cellular preparations do not isolate
      EXT1 from endogenous partners, and HSV infection is a surrogate for surface HS. No figure pixels
      were newly inspected.
  full_text_unavailable: false
- id: PMID:10679296
