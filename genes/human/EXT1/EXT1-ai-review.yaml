  - reference_id: PMID:36593275
  - reference_id: PMID:35137078
- description: 'Transfer N-acetylglucosamine from UDP-GlcNAc to a GlcA-terminated heparan sulfate acceptor.
    Human EXT1 expressed separately has positive single-transfer and chain-extension activity, supporting
    this secondary catalytic capacity. Its quantitative contribution within the Golgi EXT1–EXT2 complex
    remains unresolved: modern complex assays favor EXT2 as the dominant GlcNAc-transferase, while EXT1
    GT-A mutant effects vary with assay conditions and can include protein-stability effects. This unit
    does not imply that isolated EXT1 substitutes quantitatively for the native heterocomplex.'
