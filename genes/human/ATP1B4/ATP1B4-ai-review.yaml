  qualifier: located_in
  review:
    summary: Plasma membrane (TAS). This is the location predicted in 1999 by analogy to Na,K-ATPase beta-subunits.
      Plasma-membrane BetaM is the ancestral, non-eutherian state. Human and rodent BetaM localize to
      the nuclear envelope and intracellular membranes, and no plasma-membrane pool is reported for the
      eutherian protein. Contradicted; removed.
    action: REMOVE
    reason: '[PMID:10456317 "The data obtained indicate the existence of hitherto unknown X,K-ATPase (most
      probably Na,K-ATPase) isozymes in muscle cells."] [PMID:17592128 "The encoded beta m-proteins in
      fish, amphibian, and avian species are beta-subunits of Na,K-ATPase located in the plasma membrane."]
      [PMID:17592128 "In placental mammals beta m-proteins lost their ancestral functions, accumulate
      in nuclear membrane of perinatal myocytes, and associate with transcriptional coregulator Ski-interacting
      protein (SKIP)."] [PMID:14656723 "On transfection of human rhabdomyosarcoma cell line RD, green
      fluorescent protein-tagged beta(m) resides intracellularly with significant enrichment in nuclear
      envelopes, whereas beta(m) with transmembrane domain deleted localizes in both cytoplasm and nucleoplasm."]'
    supported_by:
