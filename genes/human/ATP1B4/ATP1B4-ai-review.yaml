- id: PMID:10456317
  title: Identification of a novel gene of the X,K-ATPase beta-subunit family that is predominantly expressed
    in skeletal and heart muscles.
  findings:
  - statement: The 1999 discovery paper inferred an Na,K-ATPase isozyme from sequence alone.
    supporting_text: The data obtained indicate the existence of hitherto unknown X,K-ATPase (most probably
      Na,K-ATPase) isozymes in muscle cells.
    finding_review:
      finding_status: OVERTURNED
      superseded_by:
