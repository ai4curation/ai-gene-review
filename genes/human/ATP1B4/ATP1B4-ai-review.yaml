        supporting_text: Finally, βm does not assemble with any of the X,K-ATPase α-subunits, thus indicating
          that it does not function as a subunit of X,K-ATPase in placental mammals ( 8 , 9 ).
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only; gene discovery. Its functional inference was later overturned by the
      same group.
  full_text_unavailable: true
- id: PMID:17592128
  title: Evolution of Na,K-ATPase beta m-subunit into a coregulator of transcription in placental mammals.
  findings:
  - statement: Eutherian BetaM lost Na,K-ATPase function and moved to the nuclear membrane.
    supporting_text: In placental mammals beta m-proteins lost their ancestral functions, accumulate in
      nuclear membrane of perinatal myocytes, and associate with transcriptional coregulator Ski-interacting
      protein (SKIP).
  - statement: BetaM regulates TGF-beta/Smad7 transcription via SKIP.
    supporting_text: Through interaction with SKIP, eutherian beta m acquired new functions as exemplified
      by regulation of TGF-beta-responsive reporters and by augmentation of mRNA levels of Smad7, an inhibitor
      of TGF-beta signaling.
  - statement: Human BetaM does not associate with Na,K-ATPase alpha-subunits.
    supporting_text: In contrast to human Na,K-ATPase β1(hβ1) used as a control (lanes 13–18), hβm was
      not coimmunoprecipitated with an α-antibody (lanes 7–12).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text; the key co-option paper.
