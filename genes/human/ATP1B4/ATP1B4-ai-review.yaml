id: Q9UN42
gene_symbol: ATP1B4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ATP1B4 encodes BetaM, a member of the Na,K-ATPase beta-subunit family that was co-opted for
  a new role in placental mammals. In fish, amphibians and birds, BetaM is a plasma-membrane Na,K-ATPase
  beta-subunit. Eutherian BetaM gained a long Glu-rich N-terminal domain, no longer assembles with Na,K-ATPase
  alpha-subunits, and instead resides in the inner nuclear membrane of skeletal and cardiac myocytes,
  peaking in late fetal and early postnatal life. There it binds the transcriptional coregulator SKIP
  (SNW1) and nuclear-envelope proteins such as LAP1 and Syne1. It modulates TGF-beta-responsive transcription
  and Smad7 expression, and, independently of SKIP, binds the MyoD distal regulatory region and recruits
  BRG1 to activate MyoD. Mice lacking BetaM are leaner, with higher energy expenditure and fat oxidation.
