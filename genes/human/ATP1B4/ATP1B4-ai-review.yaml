    summary: Sodium:potassium-exchanging atpase complex (IEA, InterPro Na,K-ATPase beta-subunit family).
      The family mapping reflects the ancestral role kept by fish, amphibian and avian BetaM. In placental
      mammals BetaM does not assemble with any X,K-ATPase alpha-subunit and has lost the pump-subunit
      function; a curated NOT transmembrane transport IDA row records this. The electronic mapping is
      contradicted for the human protein.
