- term:
    id: GO:0003712
    label: transcription coregulator activity
  evidence_type: ISO
  original_reference_id: PMID:36836771
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q99ME6
  review:
    summary: 'Transcription coregulator activity (NEW, ISO from mouse BetaM). BetaM has no DNA-binding
      domain but acts on transcription through other factors. It sits with SKIP in the Smad7 transcriptional
      complex and modulates Smad7 and TGF-beta reporters. Independently of SKIP, it occupies the MyoD
      distal regulatory region, promotes activating chromatin marks and recruits BRG1, so it does part
      of the regulatory work. Comparator: its partner SNW1/SKIP carries coactivator and corepressor activity
      by IDA. The general coregulator term is used because BetaM acts in both directions (Smad7 up, TGF-beta
      reporters modulated).'
    action: NEW
    reason: '[PMID:36836771 "BetaM binds to the distal regulatory region (DRR) of MyoD, promotes epigenetic
      changes associated with activation of transcription, and recruits the SWI/SNF chromatin remodeling
      subunit, BRG1."] [PMID:17592128 "To demonstrate directly the presence of the authentic βm and SKIP
      in the Smad7 transcriptional complex in vivo , we performed a ChIP analysis."] [PMID:17592128 "Through
      interaction with SKIP, eutherian beta m acquired new functions as exemplified by regulation of TGF-beta-responsive
      reporters and by augmentation of mRNA levels of Smad7, an inhibitor of TGF-beta signaling."]'
    supported_by:
    - reference_id: PMID:36836771
      supporting_text: BetaM binds to the distal regulatory region (DRR) of MyoD, promotes epigenetic
        changes associated with activation of transcription, and recruits the SWI/SNF chromatin remodeling
        subunit, BRG1.
    - reference_id: PMID:17592128
      supporting_text: To demonstrate directly the presence of the authentic βm and SKIP in the Smad7
        transcriptional complex in vivo , we performed a ChIP analysis.
    - reference_id: PMID:17592128
      supporting_text: Through interaction with SKIP, eutherian beta m acquired new functions as exemplified
        by regulation of TGF-beta-responsive reporters and by augmentation of mRNA levels of Smad7, an
        inhibitor of TGF-beta signaling.
