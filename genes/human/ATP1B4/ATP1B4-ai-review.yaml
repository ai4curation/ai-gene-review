      in nuclear membrane of perinatal myocytes, and associate with transcriptional coregulator Ski-interacting
      protein (SKIP)."] [PMID:17592128 "Finally, βm does not assemble with any of the X,K-ATPase α-subunits,
      thus indicating that it does not function as a subunit of X,K-ATPase in placental mammals ( 8 ,
