  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only; mouse and human cell localization.
  full_text_unavailable: true
- id: PMID:36836771
  title: Eutherian-Specific Functions of BetaM Acquired through Atp1b4 Gene Co-Option in the Regulation
    of MyoD Expression.
  findings:
  - statement: BetaM binds the MyoD DRR and recruits BRG1.
    supporting_text: BetaM binds to the distal regulatory region (DRR) of MyoD, promotes epigenetic changes
      associated with activation of transcription, and recruits the SWI/SNF chromatin remodeling subunit,
      BRG1.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text; mouse neonatal muscle and C2C12.
- id: PMID:26939788
  title: Evolutionary diversification of the BetaM interactome acquired through co-option of the ATP1B4
    gene in placental mammals.
  findings:
  - statement: BetaM binds LAP1, Syne1 and other partners.
    supporting_text: The inventory of identified BetaM interactors includes lamina-associated protein
      LAP-1, myocyte nuclear envelope protein Syne1, BetaM itself, heme oxidases HMOX1 and HMOX2; transcription
      factor LZIP/CREB3, ERGIC3, PHF3, reticulocalbin-3, and β-sarcoglycan.
  - statement: BetaM residues 72-98 mediate SKIP binding.
    supporting_text: Analysis of truncated forms of BetaM indicates that residues 72-98 adjacent to the
      membrane in nucleoplasmic domain are important for the interaction with SKIP.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text; Y2H and split-ubiquitin interactome.
- id: PMID:40724605
  title: Ablation of the Evolutionarily Acquired Functions of the Atp1b4 Gene Increases Metabolic Capacity
    and Reduces Obesity.
  findings:
  - statement: Atp1b4-null mice are leaner, with higher energy expenditure.
    supporting_text: Male BetaM-deficient (Atp1b4-/Y) mice have remarkably lower body weight and adiposity
      than their wild-type littermates, despite higher food intake.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text; mouse knockout metabolism.
