suggested_experiments:
- hypothesis: >-
    Cardiolipin binding by the basic inter-transmembrane loop is required for MIC27 to support
    crista junction formation, and is separable from MICOS assembly.
  description: >-
    Re-express wild-type APOOL and a loop-neutralised variant, with the basic residues of 130-137
    mutated to alanine or glutamine, in MIC27 knockout cells, and compare cardiolipin binding by
    liposome flotation, MICOS assembly by blue-native PAGE, and crista junction number by
    quantitative electron microscopy. This is the single experiment that would convert cardiolipin
    binding from a demonstrated in vitro activity into a demonstrated cellular function.
  experiment_type: structure-function rescue in a knockout background
- hypothesis: >-
    The discrimination between cardiolipin and phosphatidylglycerol seen on lipid strips reflects a
    real affinity difference in a bilayer context.
  description: >-
    Measure APOOL-cardiolipin binding quantitatively rather than on lipid strips, using surface
    plasmon resonance or isothermal titration calorimetry against liposomes of defined cardiolipin
    content with phosphatidylglycerol and phosphatidic acid as specificity controls, to establish an
    affinity and test whether the specificity survives in a membrane.
  experiment_type: quantitative lipid binding
- hypothesis: >-
    MIC27 and MIC10 form a wedge-shaped heterodimer that positions cardiolipin at the inter-helical
    loops, as the simulations predict.
  description: >-
    Determine the structure of the human MIC10 module (MIC10, MIC26, MIC27, MIC13) in a lipid
    environment, by cryo-EM of a detergent- or nanodisc-reconstituted complex, to test the predicted
    MIC10-MIC27 dimer arrangement and locate the cardiolipin sites.
  experiment_type: structural biology
- hypothesis: >-
    The reciprocal abundance regulation of MIC26 and MIC27 is degradative, with the surviving
    paralogue stabilised by occupying the position vacated in the MIC10 module.
  description: >-
    Perform cycloheximide chase and selective protease inhibition in MIC26 and MIC27 single knockout
    cells to determine whether the compensation acts on protein turnover rather than synthesis, and
    test dose dependence by expressing MIC26 from a heterologous promoter in MIC27 knockout cells.
  experiment_type: protein turnover
- hypothesis: >-
    The OXPHOS phenotype of the MIC26/MIC27 double knockout is the cardiolipin arm alone, separable
    from the loss of crista junctions.
  description: >-
    Restore cardiolipin genetically in MIC26/MIC27 double knockout cells, as already shown to rescue
    respiratory complex stability, and ask by quantitative electron microscopy whether crista
    junctions return. If they do not, the lipid and the membrane geometry are separable.
  experiment_type: genetic rescue with ultrastructural readout
- hypothesis: >-
    The two mammalian paralogues partitioned an ancestral function that the single-copy invertebrate
    protein still performs in full.
  description: >-
    Express Drosophila Mic26-27 (CG5903) in human MIC26/MIC27 double knockout cells and score crista
    junction rescue, which would show whether the mammalian pair genuinely partitioned an ancestral
    function or merely duplicated it.
  experiment_type: cross-species complementation
