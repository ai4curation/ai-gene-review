knowledge_gaps:
- gap_statement: >-
    No cardiolipin-binding-deficient APOOL mutant has ever been made, so the protein's only
    demonstrated molecular activity has never been connected to any cellular phenotype.
  boundary: >-
    Firmly established: purified recombinant APOOL binds cardiolipin and not phosphatidylglycerol or
    any other common membrane phospholipid, with a GST-only negative control. Also firmly
    established: losing APOOL costs the cell crista junctions and cristae. What has never been shown
    is that the first causes the second. Every phenotype in the literature comes from removing the
    whole protein, never from removing only its lipid binding, and no dissociation constant, binding
    stoichiometry or structure of the complex has been reported.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: >-
    This is the hinge of the entire model for the protein. If cardiolipin binding is what couples the
    MICOS scaffold to the inner membrane, a binding-dead APOOL should fail to support crista
    junctions while still assembling into MICOS, a clean separation that the existing null alleles
    cannot provide. If instead the loop is dispensable, APOOL's role must be reassigned to
    protein-protein contacts within the MIC10 module and cardiolipin binding becomes incidental.
  resolution: >-
    The 2026 simulations nominate a specific structural element and so make the experiment designable
    for the first time. Neutralise the basic inter-transmembrane loop (human residues 130-137,
    RKGSKFKK, retained across all ten family members tested here) and re-express it in MIC27 knockout
    cells, then score MICOS assembly by blue-native gel and crista junctions by quantitative electron
    microscopy. Binding should be measured directly rather than on lipid strips, for instance by
    liposome flotation or surface plasmon resonance with defined cardiolipin content.
  provenance:
  - reference_id: PMID:23704930
    supporting_text: >-
      These findings suggest that the function of APOOL is linked to its ability to bind the
      mitochondrial lipid cardiolipin.
  - reference_id: PMID:42647630
    supporting_text: >-
      Similar levels of CDL2 interaction were observed with Mic27, having 83% CDL2 occupancy at the
      connecting loop.
- gap_statement: >-
    Whether MIC26 and MIC27 act directly on respiratory chain supercomplexes and the F1Fo-ATP
    synthase, or only indirectly through reduced cardiolipin and lost crista junctions, is
    unresolved, and the authors who reported the phenotype say so themselves.
  boundary: >-
    Established: double knockout of MIC26 and MIC27 in human cells lowers cardiolipin, destabilises
    respiratory chain complexes and supercomplexes and the monomeric F1Fo-ATP synthase, and
    overexpressing cardiolipin synthase in those cells restores respiratory complex stability. Also
    established: the effect needs both paralogues gone, and single knockouts show little or none of
    it. Not established: whether either protein contacts or chaperones any OXPHOS complex, or whether
    the whole effect is downstream of the lipid and the membrane geometry.
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  status: OPEN
  significance: >-
    The answer decides whether MIC26 and MIC27 belong in the OXPHOS assembly literature at all, and
    whether any GO biological process annotation for respiratory chain complex assembly is warranted
    for this gene. No such annotation is proposed here precisely because the question is open, a
    double-knockout phenotype rescued by a lipid enzyme being exactly the pattern an indirect effect
    produces.
  resolution: >-
    Distinguishing experiments would be complexome profiling of cells in which cardiolipin is
    restored genetically but crista junctions are not, to separate the lipid from the geometry;
    proximity labelling from MIC27 to test for physical neighbourhood with OXPHOS subunits; and
    rescue of the double knockout with a binding-dead APOOL, which should restore complex assembly
    only if the contribution is structural rather than lipidic.
  provenance:
  - reference_id: PMID:32788226
    supporting_text: >-
      While cardiolipin was reduced in DKO cells, overexpression of cardiolipin synthase in DKO
      restores the stability of RCs/SC.
  - reference_id: PMID:32788226
    supporting_text: >-
      Either the MICOS subunits (MIC26 and MIC27) directly influence the biosynthesis of cardiolipin
      or indirectly affect cardiolipin levels due to change in cristae/CJs organization which might
      disrupt the membranes or supply of precursors required for cardiolipin synthesis.
- gap_statement: >-
    The mechanism by which MIC26 and MIC27 reciprocally control each other's protein abundance is
    unknown, and it is the confound that made a decade of single-gene depletion studies of this pair
    difficult to interpret.
  boundary: >-
    Established: deleting either paralogue raises the other's protein level, and this happens without
    a change in the other's mRNA, so it is post-transcriptional. Established too that the
    consequences are real, since it is why the single knockouts give only partial cristae phenotypes
    and why two careful human studies reached opposite conclusions about whether MIC27 depletion
    affects cristae at all. Not established: whether the surviving paralogue is stabilised by
    occupying the vacated position in the MIC10 module, protected from a specific protease, or
    regulated at translation.
  gap_kind:
  - BIOLOGY
  - CURATION
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    Beyond the mechanism itself, this is a standing warning for curation of this gene pair. Any
    single-depletion phenotype, positive or negative, is measured in a cell that has compensated. The
    one negative cristae report for MIC27 in the literature is best read in that light rather than as
    a contradiction.
  resolution: >-
    Cycloheximide chase and proteasome or AAA-protease inhibition in each single knockout would
    separate degradation from synthesis; expressing MIC26 from a heterologous promoter in MIC27
    knockout cells would test whether the compensation is dose-dependent; and pulse-labelling would
    settle whether translation rate changes.
  provenance:
  - reference_id: PMID:32788226
    supporting_text: >-
      We found that the mRNA levels of MIC26 and MIC27 are not significantly altered in MIC27 and
      MIC26 KO cell lines, respectively (Fig 1B), implying that this change in the protein levels of
      MIC26 or MIC27 occurs at a posttranscriptional level.
  - reference_id: PMID:25764979
    supporting_text: >-
      We further demonstrate that MIC26 and MIC27, a homologous protein formerly termed APOOL,
      regulate their levels in an antagonistic manner.
