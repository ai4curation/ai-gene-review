      was not used.
existing_annotations:
- term:
    id: GO:0001401
    label: SAM complex
  evidence_type: HDA
  original_reference_id: PMID:26477565
  qualifier: part_of
  review:
    summary: >-
      APOOL is not a subunit of the outer-membrane SAM complex; the co-migration behind this
      high-throughput row is the MICOS-SAM bridge, which the same reference already records correctly
      as MIB complex membership.
    action: REMOVE
    reason: >-
      GO:0001401 is defined as a complex of the mitochondrial OUTER membrane that sorts and assembles
      imported outer-membrane proteins. APOOL is an inner-membrane protein. It resists alkaline
      carbonate extraction, and its protease-accessibility profile matches the intermembrane-space
      marker Mitofilin, not the outer-membrane marker TOM20. A protein integrated in the inner
      membrane cannot be part_of an outer-membrane complex, so this is a compartment and complex
      mismatch rather than a matter of degree. The cited reference does not support the row either.
      Its own resolution of the complexome profile places MIC27 in form (A), the MICOS complex, with
      SAMM50 and MTX2 appearing only when the membrane-bridging subcomplex is formed and DNAJC11 and
      MTX1 only in the complete MIB complex. The real relationship the profile shows, that APOOL
      co-migrates with SAMM50-containing assemblies because MICOS is bridged to the outer membrane,
      is already captured from this same reference by GO:0140275 MIB complex and GO:0061617 MICOS
      complex, both of which are accepted here. Removing this row therefore loses no information and
      removes a false compartment assignment.
    supported_by:
    - reference_id: PMID:26477565
      supporting_text: >-
        We find three main forms of the complex: A) The MICOS complex, containing all the MICOS
        proteins, B) a membrane bridging subcomplex, containing in addition SAMM50, MTX2 and the
        previously uncharacterized MTX3, and C) the complete MIB complex containing in addition
        DNAJC11 and MTX1.
    - reference_id: PMID:23704930
      supporting_text: >-
        APOOL was found to remain fully in the membrane fraction whereas the chaperone mtHsp60 was
        released efficiently, yet not completely, to the soluble fraction
    - reference_id: PMID:23704930
      supporting_text: >-
        Taken together, we conclude that APOOL is located in the intermembrane space consistent with
        the proposed location of the Mitofilin/MINOS complex.
    additional_reference_ids:
    - PMID:25781180
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:25764979
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q16891
  review:
    summary: >-
      A real interaction with MIC60/Mitofilin, but recorded as bare protein binding, which conveys no
      molecular function and is already implied by the accepted MICOS complex membership.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The partner resolves against UniProt to Q16891, IMMT/MIC60 (MIC60_HUMAN), the central MICOS
      subunit, and the interaction is independently supported by reciprocal co-immunoprecipitation in
      PMID:23704930. The annotation is therefore not wrong. It is uninformative. GO:0005515 states
      only that two proteins touch, and the biologically meaningful content, that both are subunits
      of one complex, is already asserted by GO:0061617 part_of MICOS complex, which this review
      accepts on six rows drawn from five distinct references. There is no more informative molecular function to
      promote it to. The obvious candidate, an oligomer-stabilising or scaffolding activity, comes
      from yeast (PMID:26968360, PMID:29733859) and is contradicted for human MIC27 by the CRISPR
      knockouts in PMID:32788226, which show MIC26 and MIC27 are dispensable for the stability and
      integration of the remaining MICOS subunits. Marked as over-annotated rather than removed
      because the underlying observation is sound.
    supported_by:
    - reference_id: PMID:25764979
      supporting_text: >-
        The latter isoform spans the mitochondrial inner membrane and physically interacts with
        several MICOS complex subunits such as MIC60, MIC27, and MIC10.
    - reference_id: PMID:32788226
      supporting_text: >-
        MIC26 and MIC27 are dispensable for the stability and integration of the remaining MICOS
        subunits into the complex suggesting that they assemble late into the MICOS complex.
    additional_reference_ids:
    - PMID:23704930
    - PMID:26968360
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:25764979
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q5TGZ0
  review:
    summary: >-
      A real interaction with MIC10, the membrane-shaping core of the MICOS module APOOL belongs to,
      but again recorded only as bare protein binding.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The partner resolves against UniProt to Q5TGZ0, MICOS10/MIC10 (MIC10_HUMAN), and the
      interaction is corroborated by the reciprocal co-immunoprecipitation of APOOL with MINOS1 in
      PMID:23704930 and by the co-degradation of MIC10, MIC26 and MIC27 when MIC13 is lost
      (PMID:25997101, PMID:27479602). This is the most functionally interesting of the three
      partners, because the yeast literature assigns Mic27 a role in stabilising Mic10 oligomers.
      That role has not been demonstrated for the human protein, and the human knockout data run the
      other way, so promoting this row to an oligomer-stabilisation molecular function would be
      stating a yeast mechanism as human fact. With no informative human MF available, the row is
      marked over-annotated. The real content, shared membership of the MICOS complex, is already
      recorded by GO:0061617.
    supported_by:
    - reference_id: PMID:25764979
      supporting_text: >-
        The latter isoform spans the mitochondrial inner membrane and physically interacts with
        several MICOS complex subunits such as MIC60, MIC27, and MIC10.
    - reference_id: PMID:25997101
      supporting_text: >-
        Using quantitative proteomics, we show that loss of QIL1 resulted in MICOS disassembly with
        the accumulation of a MIC60-MIC19-MIC25 sub-complex and degradation of MIC10, MIC26, and
        MIC27.
    additional_reference_ids:
    - PMID:23704930
    - PMID:26968360
    - PMID:27479602
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:25764979
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q9BUR5
  review:
    summary: >-
      A real interaction with the paralogue MIC26/APOO, recorded as bare protein binding; the
      biologically important relationship between these two proteins is reciprocal regulation of
      abundance, which GO:0005515 does not express.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The partner resolves against UniProt to Q9BUR5, APOO/MIC26 (MIC26_HUMAN), the other human
      member of PTHR14564. The interaction is real and both proteins sit in the same MICOS module.
      But the substantive finding of this very paper about the MIC26-MIC27 relationship is not
      binding. It is that the two regulate each other's levels antagonistically, which is why every
      single-gene depletion before the double knockout was hard to interpret. GO:0005515 captures
      none of that, and GO has no molecular function term for reciprocal control of a paralogue's
      abundance. Shared complex membership is already recorded by GO:0061617, so the row is redundant
      as well as uninformative.
    supported_by:
    - reference_id: PMID:25764979
      supporting_text: >-
        We further demonstrate that MIC26 and MIC27, a homologous protein formerly termed APOOL,
        regulate their levels in an antagonistic manner.
    - reference_id: PMID:32788226
      supporting_text: >-
        MIC26 and MIC27 are reciprocally regulated at the posttranscriptional level
    additional_reference_ids:
    - PMID:37279200
- term:
    id: GO:0005576
    label: extracellular region
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-481007
  qualifier: located_in
  review:
    summary: >-
      A name-era artefact. APOOL is not secreted; the row is a projection of a Reactome platelet
      pathway membership that itself rests on a 2004 bulk releasate proteomics screen.
    action: REMOVE
    reason: >-
      Three independent lines of positive evidence place this protein inside mitochondria and nowhere
      else. Endogenous APOOL is entirely absent from the cytosolic fraction and enriched in the
      mitochondrial fraction, and resists alkaline carbonate extraction (PMID:23704930). UniProt
      records only a mitochondrial TRANSIT peptide, not a signal peptide, and gives SUBCELLULAR
      LOCATION Mitochondrion inner membrane. Most directly, PMID:37279200 tested the secreted-isoform
      hypothesis for this family head-on in four human cell lines with four antibodies and tagged
      constructs and concluded that MIC26 and MIC27 are exclusively mitochondrial, explicitly
      excluding a high-molecular-weight glycosylated MIC27. The provenance of the row is equally
