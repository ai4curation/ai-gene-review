- id: file:human/APOOL/APOOL-bioinformatics/RESULTS.md
  title: APOOL bioinformatics, inter-transmembrane loop conservation across PTHR14564
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Analysis performed for this review. Fetches the nine PTHR14564 representative members plus the
      Drosophila PAINT seed Q9VEY5 live from UniProt, asserts every length against the local family
      index, reads the human transmembrane boundaries from the UniProt flat file rather than
      re-predicting them, and aligns with FAMSA. Result, the human inter-TM loop is residues 130-137
      RKGSKFKK, net charge +5, and all ten members carry a net-positive block with at least two basic
      residues. The document states its own limits, chiefly that conservation and charge are not a
      binding demonstration.
- id: file:human/APOOL/APOOL-deep-research-affinage.md
  title: Affinage mechanistic annotation for APOOL (human)
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: LOW_QUALITY
    review_notes: >-
      LLM-generated deep research. Trust gates cleared (self_evaluation_pairwise win, faith 100%) and
      the record describes the correct protein with no symbol collision, which is why it is listed at
