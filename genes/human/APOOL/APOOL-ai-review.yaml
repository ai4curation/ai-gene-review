id: Q6UXV4
gene_symbol: APOOL
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  APOOL, also called MIC27, is a subunit of the MICOS complex (mitochondrial contact site and cristae
  organizing system) of the mitochondrial inner membrane. It is synthesised with an N-terminal
  mitochondrial targeting sequence, inserts into the inner membrane through two short transmembrane
  helices connected by a strongly basic loop, and presents both its N-terminal and its long,
  intrinsically disordered C-terminal region to the intermembrane space. The gene is named for a
  superficial resemblance to the plasma apolipoproteins, but the protein is not secreted and is not
  part of any lipoprotein particle: endogenous APOOL is absent from the cytosol, resists alkaline
  carbonate extraction, and has been shown in four human cell lines to exist only as the ~30 kDa
  mitochondrial form, with no glycosylated or secreted species.


  Within MICOS, APOOL belongs to the membrane-shaping MIC10 module together with MIC10, MIC26 and
  MIC13, rather than to the MIC60-MIC19-MIC25 module; its incorporation depends on MIC13, whose loss
  causes APOOL to be degraded along with MIC10 and MIC26. Because MICOS associates across the
  intermembrane space with the outer-membrane SAMM50-metaxin machinery, APOOL is also recovered in
  the larger MIB (mitochondrial intermembrane space bridging) assembly, and MICOS itself is
  concentrated at crista junctions, the narrow tubular necks that connect cristae to the inner
  boundary membrane.


  The one molecular activity demonstrated for the protein is lipid binding: recombinant APOOL binds
  cardiolipin specifically and does not bind its biosynthetic precursor phosphatidylglycerol or any
  other common membrane phospholipid. The basic inter-transmembrane loop that is the proposed lipid
  contact is conserved across the whole MIC26/MIC27 family. Functionally, loss of APOOL reduces the
  number of crista junctions and cristae per mitochondrial section and impairs respiration, and
  simultaneous loss of APOOL and its paralogue APOO/MIC26 produces the full MICOS phenotype of
  concentric, onion-like cristae together with reduced cardiolipin and destabilised respiratory chain
  supercomplexes and ATP synthase. APOOL and APOO regulate each other's protein levels reciprocally
  and post-transcriptionally, so each partly masks the other's loss. The pair arose late in evolution
  and is restricted to opisthokonts; Drosophila, for example, carries a single combined MIC26/MIC27
  protein, CG5903.
