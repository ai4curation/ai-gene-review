      by chasing Reactome provenance, not by a gene-centred search), PMID:33053165 and PMID:40751083.
      Its mechanism_profile proposes GO:0008289 and GO:0005198; neither was imported, since
      GO:1901612 is the specific term the data support and structural molecule activity is
      contradicted for human MIC27 by PMID:32788226. Its citation list contains one non-numeric
