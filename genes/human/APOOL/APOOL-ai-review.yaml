core_functions:
- description: >-
    Cardiolipin-binding subunit of the MIC10 module of the MICOS complex, acting in the mitochondrial
    inner membrane to build and maintain crista junctions. APOOL inserts into the inner membrane
    through two short transmembrane helices connected by a strongly basic loop and presents its
    termini to the intermembrane space; the purified protein binds cardiolipin specifically and not
    the precursor phosphatidylglycerol, which is the only molecular activity demonstrated for it and
    the reason it is placed at the interface between the MICOS scaffold and the inner membrane's
    signature anionic lipid. Its incorporation into MICOS requires MIC13, and it joins the complex
    with MIC10 and its paralogue MIC26 rather than the MIC60-MIC19-MIC25 module. Functionally the
    contribution is to membrane shape rather than to complex integrity. Knocking out MIC27 in human
    cells significantly reduces both crista junctions and cristae per mitochondrial section and
    impairs respiration, while leaving the assembly and stability of the remaining MICOS subunits
    intact, and the complete MICOS phenotype of concentric onion-like cristae appears only when the
    paralogue MIC26 is removed as well. The activity is therefore recorded as a contribution to the
    membrane-bending activity of the MIC10 module rather than as an activity APOOL has on its own,
    with cardiolipin binding as the subunit-level function it brings to that module.
  supported_by:
  - reference_id: PMID:23704930
    supporting_text: >-
      GST-APOOL-HIS6 was found to bind specifically to cardiolipin (CL) but not to any of the other
      lipids tested, notably not even to phosphatidylglycerol the precursor of cardiolipin
  - reference_id: PMID:23704930
    supporting_text: >-
      Taken together, we conclude that APOOL is located in the intermembrane space consistent with
      the proposed location of the Mitofilin/MINOS complex.
  - reference_id: PMID:32788226
    supporting_text: >-
      We observed that both SKOs and DKO cells show significantly reduced CJs per mitochondrial
      section compared with the controls
  - reference_id: PMID:32788226
    supporting_text: >-
      MIC26 and MIC27 are dispensable for the stability and integration of the remaining MICOS
      subunits into the complex suggesting that they assemble late into the MICOS complex.
  - reference_id: PMID:25997101
    supporting_text: >-
      Using quantitative proteomics, we show that loss of QIL1 resulted in MICOS disassembly with the
      accumulation of a MIC60-MIC19-MIC25 sub-complex and degradation of MIC10, MIC26, and MIC27.
  - reference_id: PMID:42647630
