suggested_questions:
- question: >-
    Does the basic inter-transmembrane loop of MIC27 (human residues 130-137, RKGSKFKK) mediate the
    cardiolipin binding seen on lipid strips, and is that binding required for crista junction
    formation, or does MIC27 support crista junctions through protein contacts within the MIC10
    module regardless of lipid binding?
  experts:
  - Andreas S. Reichert
  - Ruchika Anand
- question: >-
    What is the stoichiometry and arrangement of MIC10, MIC26, MIC27 and MIC13 within the MIC10
    module, and do MIC26 and MIC27 occupy the same position in the module, as their reciprocal
    abundance regulation and partial functional redundancy would suggest?
  experts:
  - Arun Kumar Kondadi
  - Siewert J. Marrink
- question: >-
    By what post-transcriptional mechanism does loss of one of MIC26 or MIC27 raise the level of the
    other, and is the compensating paralogue actually taking over the vacated function or merely
    accumulating?
  experts:
  - Ruchika Anand
  - Sebastian Koob
- question: >-
    Do the cardiolipin reduction and the OXPHOS supercomplex destabilisation in MIC26/MIC27 double
    knockout cells lie downstream of the loss of crista junctions, or does the pair influence
    cardiolipin metabolism more directly?
  experts:
  - Ilka Wittig
  - Ruchika Anand
- question: >-
    Is the yeast finding that Mic27 stabilises Mic10 oligomers true of human MIC27, given that human
    MIC26 and MIC27 knockouts leave the assembly and stability of the other MICOS subunits intact?
  experts:
  - Andreas S. Reichert
- question: >-
    Is there any physiological condition, tissue or developmental stage in which MIC27 is not
    functionally redundant with MIC26, given that the two are co-expressed and mutually compensating
    in every cell line examined so far?
  experts:
