- term:
    id: GO:0050821
    label: protein stabilization
  evidence_type: IMP
  original_reference_id: PMID:36074822
  qualifier: involved_in
  review:
    summary: LYSET is required to stabilise GlcNAc-1-phosphotransferase (GNPTAB) in the Golgi.
    action: NEW
    reason: In LYSET-deficient cells GlcNAc-1-phosphotransferase is unstable and degraded; LYSET binds
      it directly, and the pathogenic R45W allele that fails to bind does not rescue GNPTAB levels. LYSET
      itself does the stabilising work (binding the enzyme's hydrophilic transmembrane segment), so this
      is participation, not mere necessity.
    supported_by:
    - reference_id: PMID:36074822
      supporting_text: Without LYSET, GlcNAc-1-phosphotransferase was unstable because of a hydrophilic
        transmembrane domain.
    - reference_id: PMID:36074822
      supporting_text: LYSET was found to associate in the Golgi with GlcNAc-1-phosphotransferase
