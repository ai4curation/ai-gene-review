suggested_questions:
- question: Does LYSET act as a chaperone that shields the hydrophilic GNPTAB beta-subunit transmembrane
    domain, and should GO represent this with a molecular function term?
  experts:
  - lysosomal enzyme trafficking biochemists
  - GO molecular function editors
suggested_experiments:
- description: Reconstitute GNPTAB with wild-type or R45W LYSET in proteoliposomes and measure GNPTAB
    stability, S1P cleavage and GlcNAc-1-phosphotransferase activity.
  experiment_type: biochemical reconstitution
  hypothesis: LYSET directly stabilises the GNPTAB transmembrane region, which is sufficient for S1P cleavage
    and activity.
