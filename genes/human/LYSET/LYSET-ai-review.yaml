    summary: LYSET binds GNPTAB, but 'protein binding' carries no functional information.
    action: REMOVE
    reason: The interaction is real (co-IP; lost with the pathogenic R45W allele) and functionally essential;
      its functional meaning is captured by the process terms protein stabilization and lysosomal transport.
      Removal does not assert the interaction is false.
    supported_by:
