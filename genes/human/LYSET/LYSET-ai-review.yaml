id: Q8N6I4
gene_symbol: LYSET
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: LYSET (lysosomal enzyme trafficking factor; previously TMEM251, also GCAF) is a small Golgi-resident
  protein with two transmembrane domains that is an essential component of the mannose 6-phosphate (M6P)
  lysosomal enzyme targeting machinery. It binds the alpha/beta subunits of GlcNAc-1-phosphotransferase
  (GNPTAB) in the Golgi, stabilising the enzyme (whose beta-subunit transmembrane domain is otherwise
  unstable), enabling its site-1 protease cleavage and activity, and retaining it in Golgi stacks. Without
  LYSET, GlcNAc-1-phosphotransferase is degraded and mislocalised to lysosomes, M6P tagging is lost, soluble
  acid hydrolases are missorted and secreted, and lysosomal degradation of endocytic, macropinocytic and
  autophagic cargo fails. Biallelic LYSET loss-of-function variants cause a mucolipidosis II-like disorder,
  dysostosis multiplex Ain-Naz type.
