- term:
    id: GO:0001501
    label: skeletal system development
  evidence_type: TAS
  original_reference_id: PMID:8601314
  qualifier: involved_in
  review:
    summary: Skeletal developmental process annotation (TAS).
    action: KEEP_AS_NON_CORE
    reason: FGFR3 is a major regulator of endochondral skeletal growth (negative regulator of bone growth;
      also affects osteoblast mineralization), but these broad developmental terms describe a tissue-level
      outcome of its receptor signalling rather than its core function. The growth restraint is better
      captured by negative regulation of chondrocyte proliferation/differentiation and negative regulation
      of developmental growth.
    supported_by:
    - &id020
      reference_id: PMID:8601314
      supporting_text: FGFR-3 appears to regulate endochondral ossification by an essentially negative
        mechanism, limiting rather than promoting osteogenesis.
    - &id001
      reference_id: file:human/FGFR3/FGFR3-deep-research-falcon.md
      supporting_text: Conversely, loss of FGFR3 function produces skeletal overgrowth, confirming its
        role as a brake on bone growth
