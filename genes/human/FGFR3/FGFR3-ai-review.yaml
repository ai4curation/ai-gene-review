core_functions:
- description: 'Ligand-activated transmembrane receptor tyrosine kinase for FGFs at the plasma membrane:
    FGF and heparan sulfate binding drives dimerization, trans-autophosphorylation and phosphorylation
    of effectors (FRS2, PLCG1), activating ERK1/2 and other FGFR signalling branches.'
