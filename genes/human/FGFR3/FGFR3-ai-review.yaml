suggested_questions:
- question: Is STAT1 activation by FGFR3 in chondrocytes JAK-independent (direct receptor or PLCgamma-dependent),
    and should GO:0007259 JAK-STAT annotations on FGFRs be replaced by GO:0097696 generally?
- question: Which FGFR3 outputs are paralog-specific (growth-plate restraint, inner ear) versus shared
    with FGFR1/FGFR2, and should the FGFR module encode FGFR3 growth restraint as a distinct regulatory
    step?
- question: Does the FGFRL1 paper (PMID:18061161) contain primary FGFR3 localization data supporting the
    Golgi and transport vesicle IDA annotations?
- question: Is there primary evidence for FGFR3 colocalization with focal adhesions, or should GO:0005925
    be retired?
suggested_experiments:
- description: Chondrocyte-specific knock-in of kinase-dead versus STAT1-binding-deficient FGFR3 to separate
    growth restraint arms (STAT1 vs ERK) in vivo.
- description: Quantitative FGF ligand/Klotho specificity profiling of FGFR3b versus FGFR3c at the cell
    surface using purified components and SPR.
- description: Endogenous-level proximity labelling (BioID/TurboID) of FGFR3 in chondrocytes to identify
    context-specific effectors responsible for anti-proliferative signalling.
