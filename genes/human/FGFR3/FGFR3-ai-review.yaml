    label: MAPK cascade
  evidence_type: TAS
  original_reference_id: PMID:10918587
  qualifier: involved_in
  review:
    summary: Activated FGFR3 derivatives stimulate MAPK phosphorylation.
    action: MODIFY
    reason: FGFR3 is upstream of, not a component of, the MAPK cascade; the receptor activates the cascade.
      Positive regulation of MAPK cascade (GO:0043410) captures the relationship correctly.
    proposed_replacement_terms:
