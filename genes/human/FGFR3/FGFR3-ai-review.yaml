id: P22607
gene_symbol: FGFR3
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Fibroblast growth factor receptor 3 is a single-pass type I transmembrane receptor tyrosine
  kinase with three extracellular Ig-like domains (alternatively spliced IIIb/IIIc forms of D3 set ligand
  specificity), a transmembrane helix and a split cytoplasmic tyrosine kinase domain. At the plasma membrane,
  binding of FGF ligands together with heparan sulfate (and, for endocrine FGFs, Klotho co-receptors)
  induces receptor dimerization and trans-autophosphorylation, after which FGFR3 phosphorylates and recruits
  FRS2, PLCG1 and other effectors to activate RAS-ERK1/2, PLCgamma, PI3K-AKT and STAT1/3 signalling. Activated
  receptor is ubiquitinated, internalized and degraded. FGFR3 is the principal FGF receptor of growth-plate
  chondrocytes, where its signalling restrains proliferation and hypertrophic differentiation and promotes
  apoptosis, acting as a brake on endochondral bone growth; gain-of-function variants cause achondroplasia,
  hypochondroplasia and thanatophoric dysplasia, whereas partial loss of function causes tall stature
  and hearing loss (CATSHL). It also contributes to inner ear development and osteoblast mineralization,
  and activating mutations or fusions (e.g. FGFR3-TACC3) drive bladder cancer and multiple myeloma. A
  secreted splice isoform lacking the transmembrane domain can bind FGFs and may act as a decoy.
