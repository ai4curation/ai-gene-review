- term:
    id: GO:0007259
    label: cell surface receptor signaling pathway via JAK-STAT
  evidence_type: IMP
  original_reference_id: PMID:11294897
  qualifier: involved_in
  review:
    summary: Activated FGFR3 induces STAT1/STAT3 tyrosine phosphorylation.
    action: MODIFY
    reason: The cited work shows STAT activation by the receptor but not a JAK-dependent route; in chondrocytes
      STAT1 activation is PLCgamma-dependent. The less committed parent, cell surface receptor signaling
      pathway via STAT (GO:0097696), is appropriate.
    proposed_replacement_terms:
    - id: GO:0097696
      label: cell surface receptor signaling pathway via STAT
    supported_by:
    - &id012
      reference_id: PMID:11294897
      supporting_text: Addition of a single tyrosine residue, Y724, restored its ability to stimulate
        cellular transformation, phosphatidylinositol 3-kinase activation, and phosphorylation of Shp2,
        MAPK, Stat1, and Stat3.
    - &id014
      reference_id: PMID:17561467
      supporting_text: Both PLCgamma and STAT1 were activated by FGFR3 signaling, but a dominant-negative
        form of PLCgamma (DN-PLCgamma) remarkably reduced STAT1 phosphorylation.
