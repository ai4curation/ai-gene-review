- description: FGFR3 receptor signalling in growth-plate chondrocytes restrains proliferation (STAT1 arm)
    and hypertrophic differentiation (ERK arm), acting as a negative regulator of endochondral bone growth;
    this is the paralog-distinguishing physiological role.
