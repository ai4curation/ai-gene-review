    supporting_text: RhoJ is required for the formation of the holoreceptor complex comprising VEGFR2, PlexinD1, and neuropilin-1
suggested_questions:
- question: In PMID:32347571, were the RhoJ-PlexinD1 binding and Sema3E-release experiments done with human RHOJ in human
    endothelial cells, or with mouse RhoJ? If the latter, should the GO:0071526 semaphorin-plexin signaling annotation
    on human RHOJ carry ISS from the mouse ortholog rather than IMP?
- question: Should RHOJ's early/sorting-endosome trafficking role, shown in HeLa cells (PMID:12960428), be captured by a post-internalization
    endosomal transport term rather than the Cdc42-derived 'endocytosis' IBA? Is the role relevant in endothelial cells?
- question: Which GEFs and GAPs control RHOJ in endothelial cells in vivo, given that rapid intrinsic exchange makes RHOJ
    partly GEF-independent and that VEGF has been reported both to activate and to inactivate it?
- question: Does GLUL act as a palmitoyl-transferase toward RHOJ, or does it stabilize RHOJ palmitoylation indirectly (PMID:30158707)?
suggested_experiments:
- description: Measure the kinetics of intrinsic and GAP-stimulated GTP hydrolysis and GEF-catalysed exchange for full-length,
    prenylated RHOJ, and compare with CDC42 and RHOQ, to define where RHOJ sits in the switch spectrum.
- description: Use endothelial-specific Rhoj knockout or knock-in of a PlexinD1-binding-deficient RHOJ mutant to separate
    the PlexinD1 transducer role from the focal-adhesion/GIT-PIX role in retinal sprouting angiogenesis.
