id: Q9H4E5
gene_symbol: RHOJ
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: RHOJ (TCL, TC10-like) is a Rho-family small GTPase of the Cdc42/TC10 subgroup. In human tissues it is strongly
  enriched in vascular endothelial cells, and its expression is driven by the ETS factor ERG. The 214-residue protein has
  a complete G domain and cycles between GDP- and GTP-bound states. It has rapid intrinsic nucleotide exchange and measurable
  intrinsic GTP hydrolysis, and an N-terminal extension (residues 17-20) together with a distal loop (121-129) controls GTP
  loading. It is anchored to the cytoplasmic face of the plasma membrane by C-terminal CAAX farnesylation and by palmitoylation
  of Cys3 and Cys11; glutamine synthetase (GLUL) sustains that palmitoylation. A smaller fraction of RHOJ sits on early/sorting
  endosomes. GTP-loaded RHOJ binds the CRIB/GBD domains of effectors such as PAK kinases and WASP/N-WASP, and it binds the
  cytoplasmic domain of PlexinD1. In endothelial cells RHOJ localizes to focal adhesions, where it works with the GIT-PIX
  complex to speed focal adhesion disassembly. It also restrains RhoA-ROCK actomyosin contractility and stress-fibre formation,
  and so promotes endothelial migration, lumen and tube formation. Downstream of Sema3E/PlexinD1 and VEGF/VEGFR2 it integrates
  repulsive and attractive cues during directional endothelial migration. Loss of RHOJ impairs developmental and pathological
  angiogenesis, including tumor vessel growth and ischemic retinopathy in mice. In HeLa cells it is also needed for internalized
  receptors to enter early/sorting endosomes.
