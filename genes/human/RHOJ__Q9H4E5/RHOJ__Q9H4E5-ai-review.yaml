    supporting_text: GTP-bound but not GDP-bound TCL protein directly interacts with Cdc42/Rac interacting binding domains,
      such as those found in PAK and WASP
  - reference_id: PMID:21148427
    supporting_text: Downregulating RhoJ expression increased focal adhesions and stress fibers in migrating cells
- description: In human endothelial cells, RHOJ at focal adhesions works with the GIT-PIX complex to speed focal adhesion
    disassembly and limit actomyosin contractility. This promotes endothelial migration, lumen and tube formation, and hence
    angiogenic sprouting.
  molecular_function:
