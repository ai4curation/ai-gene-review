  review:
    summary: GTPase activity, propagated from the PTHR24072 (Rho family) root node PTN000632671. Human RHOJ (Q9H4E5) is itself
      one of the IBD seeds.
    action: ACCEPT
    reason: RHOJ keeps an intact G domain (G1-G5) and is in PANTHER subfamily SF17 under the family-root node. Its own biochemistry
      is part of the basis for the IBD. Intrinsic GTP hydrolysis was measured for human TCL/RHOJ (PMID:10967094), and GAPs
      stimulate it (Reactome).
    supported_by:
    - reference_id: PMID:10967094
      supporting_text: In vitro, TCL shows rapid GDP/GTP exchange and displays higher GTP dissociation and hydolysis rates
        than TC10.
    - reference_id: file:human/RHOJ__Q9H4E5/RHOJ__Q9H4E5-bioinformatics/RESULTS.md
      supporting_text: These functions are therefore both measured on human RHOJ and inherited across the Rho family.
    - reference_id: Reactome:R-HSA-9017488
      supporting_text: stimulate its GTPase activity, resulting in GTP to GDP hydrolysis
