  review:
    summary: Ackermann et al. purified GST-TCL/RHOJ, measured mant-GTP loading, and used G30V/Q79L (constitutively active)
      and T35N mutants in PAK pulldowns.
    action: ACCEPT
    reason: The study mainly measures nucleotide exchange and loading. Hydrolysis is implied by the behaviour of the GTPase-deficient
      G30V/Q79L mutants rather than measured directly. Intrinsic hydrolysis by RHOJ was measured in PMID:10967094, so the
      activity itself is experimentally established for human RHOJ.
    supported_by:
    - reference_id: PMID:27660391
      supporting_text: the ΔN mutant bound mant-GTP to a level similar to wild-type TCL after about 1 h
    - reference_id: PMID:10967094
      supporting_text: In vitro, TCL shows rapid GDP/GTP exchange and displays higher GTP dissociation and hydolysis rates
        than TC10.
