  review:
    summary: EC 3.6.5.2 mapping to G protein activity (small-GTPase molecular switch).
    action: ACCEPT
    reason: GO:0003925 describes a regulator that cycles between active GTP-bound and inactive GDP-bound states and binds
      effectors when active. This is RHOJ's core function. GTP-bound but not GDP-bound RHOJ binds CRIB effectors (PMID:10967094).
      GEFs (DOCK8) load it and GAPs inactivate it (Reactome). PlexinD1 binds RHOJ selectively in the GTP-bound state (PMID:32347571).
    supported_by:
    - reference_id: PMID:10967094
      supporting_text: GTP-bound but not GDP-bound TCL protein directly interacts with Cdc42/Rac interacting binding domains,
        such as those found in PAK and WASP
    - reference_id: Reactome:R-HSA-9017491
      supporting_text: catalyze GDP to GTP exchange on RHOJ, resulting in formation of the active RHOJ:GTP complex
    - reference_id: PMID:32347571
      supporting_text: In the GTP-bound state, RhoJ interacts with the cytoplasmic domain of PlexinD1.
