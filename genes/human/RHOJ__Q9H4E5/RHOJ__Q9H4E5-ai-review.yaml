- term:
    id: GO:0071526
    label: semaphorin-plexin signaling pathway
  evidence_type: IMP
  original_reference_id: PMID:32347571
  review:
    summary: GTP-bound RHOJ binds the PlexinD1 cytoplasmic domain. Sema3E releases it, and released RHOJ drives contraction.
      PlexinD1-bound RHOJ promotes Sema3E-induced PlexinD1-VEGFR2 association, VEGFR2 Y1214 phosphorylation and p38 activation,
      which lead to repulsive endothelial migration.
    action: NEW
    reason: 'RHOJ is an intracellular transducer of this pathway, not merely required for it. It binds the receptor cytoplasmic
      domain in a nucleotide-dependent manner, is released on ligand binding, and conveys the output (contraction and reverse
      migration). This is transducer participation, which is what the term covers. The cached abstract does not name the
      cell types or species used for the mechanistic work (the in vivo data are from mouse retina), and the full text was
      not available, so the species of the mechanistic evidence is raised as a suggested question rather than as a
      qualification of this annotation.'
    supported_by:
    - reference_id: PMID:32347571
      supporting_text: In the GTP-bound state, RhoJ interacts with the cytoplasmic domain of PlexinD1.
    - reference_id: PMID:32347571
      supporting_text: Upon Sema3E stimulation, RhoJ released from PlexinD1 induces cell contraction.
