  - reference_id: PMID:21148427
    supporting_text: RhoJ was found to positively regulate endothelial motility and tubule formation
  - reference_id: PMID:21628409
    supporting_text: Knock-down of RhoJ similarly resulted in a marked reduction in the ability of ECs to form lumens.
- description: Transducer of Sema3E/PlexinD1 repulsive signaling, which it integrates with VEGF/VEGFR2 attraction during directional
    endothelial migration. GTP-RHOJ binds the PlexinD1 cytoplasmic domain and is released on Sema3E stimulation. RHOJ is also
    needed to assemble the VEGFR2-PlexinD1-neuropilin-1 holoreceptor. Shown in endothelial cells and mouse retina; the species
    used for the mechanistic work is not stated in the cached abstract.
  molecular_function:
    id: GO:0003925
