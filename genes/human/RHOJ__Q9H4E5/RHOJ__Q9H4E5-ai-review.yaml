core_functions:
- description: GTP-regulated molecular switch at the cytoplasmic face of the endothelial plasma membrane. RHOJ binds GTP,
    hydrolyses it intrinsically, and in the GTP-bound state engages effectors. This is measured directly on human RHOJ and
    also inherited from the Rho-family root PAINT node, for which RHOJ is a seed.
  molecular_function:
    id: GO:0003925
    label: G protein activity
  directly_involved_in:
  - id: GO:0007165
    label: signal transduction
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:10967094
    supporting_text: In vitro, TCL shows rapid GDP/GTP exchange and displays higher GTP dissociation and hydolysis rates than
      TC10.
  - reference_id: PMID:27660391
    supporting_text: the ΔN mutant bound mant-GTP to a level similar to wild-type TCL after about 1 h
  - reference_id: file:human/RHOJ__Q9H4E5/RHOJ__Q9H4E5-bioinformatics/RESULTS.md
    supporting_text: These functions are therefore both measured on human RHOJ and inherited across the Rho family.
- description: 'Nucleotide-dependent binding to CRIB/GBD domains of Cdc42-subfamily effectors, including PAK kinases and WASP/N-WASP.
    This couples active RHOJ to actin remodeling: dorsal F-actin ruffles, and suppression of stress fibres in migrating endothelial
    cells. RHOJ does not bind actin or phosphorylate substrates itself.'
  molecular_function:
    id: GO:0032427
    label: GBD domain binding
