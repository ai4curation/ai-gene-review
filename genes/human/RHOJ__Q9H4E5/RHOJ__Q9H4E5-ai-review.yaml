- term:
    id: GO:0006897
    label: endocytosis
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - FB:FBgn0010341
  - MGI:MGI:106211
  - PANTHER:PTN008604842
  - UniProtKB:P60953
  review:
    summary: Endocytosis, propagated from the Cdc42-seeded node PTN008604842 (Opisthokonta). No RHOJ protein is among the
      seeds.
    action: MARK_AS_OVER_ANNOTATED
    reason: RHOJ descends from this node, so the inference is phylogenetically legitimate. But RHOJ-specific evidence refines
      it. In HeLa cells, RHOJ/TCL knockdown did not affect receptor-mediated transferrin internalization. Instead, internalized
      cargo failed to pass from Rab5-positive uncoated vesicles into EEA1-positive early/sorting endosomes, and recycling
      was slower (PMID:12960428). RHOJ therefore acts in post-internalization early endosomal trafficking, not in endocytic
      uptake itself, and 'endocytosis' overstates what was shown. The trafficking role is real but has been shown only in
      HeLa overexpression and knockdown studies. It was not seen in endothelial cells, where it is peripheral to RHOJ's main
      function, so no replacement term is asserted.
    supported_by:
    - reference_id: PMID:12960428
      supporting_text: Receptor-dependent internalization of transferrin (Tf) is unaffected by suppression of endogenous TCL
        by small interfering RNA treatment.
    - reference_id: PMID:12960428
      supporting_text: TCL is essential for clathrin-dependent endocytosed receptors to enter the early/sorting endosomes
    - reference_id: file:human/RHOJ__Q9H4E5/RHOJ__Q9H4E5-bioinformatics/RESULTS.md
      supporting_text: These are inferences about RHOJ, not RHOJ-specific measurements.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN008604842
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Cdc42-seeded Opisthokonta node (seeds FB:FBgn0010341, MGI:MGI:106211, UniProtKB:P60953). RHOJ descends from
          it, but RHOJ knockdown leaves transferrin internalization intact and blocks only entry into early/sorting endosomes
          (PMID:12960428), so the RHOJ role is post-internalization trafficking, not uptake.
