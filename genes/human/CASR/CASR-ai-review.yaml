    relevance: HIGH
    correctness: VERIFIED
    review_notes: The complete abstract and selected complete construct/functional Methods paragraphs
      were read. Structures use truncated human receptor and dominant-negative or mini/chimeric
      G proteins, whereas cellular assays use full-length receptor. Gi/Gs-tail chimeras redirect
      coupling to an IP1 readout in Gq/11-deficient cells; this is not native Gi/Gs second-messenger
      measurement. Separate TRUPATH assays address Gi1, Gi3 and Gq. The authors report no detectable
      CaSR-induced Gs activity in HEK293T or MCF7, although that method paragraph names a Gq
      donor, an unresolved internal description ambiguity. Surface-expression controls and calcium-dependent
      FRET-background subtraction are explicit. No universal physiological Gs claim is justified.
