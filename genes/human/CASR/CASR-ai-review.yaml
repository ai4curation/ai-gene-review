- id: PMID:27434672
  title: Structural mechanism of ligand activation in human calcium-sensing receptor.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected complete structural, ligand-binding, mutational and cellular-assay
      passages were read. Human extracellular-domain constructs were expressed in insect cells,
      whereas full-length human receptors were tested in HEK293 cells with surface-expression
      controls, IP1 and calcium readouts. Scintillation proximity directly demonstrated tryptophan
      binding; anomalous diffraction supported calcium-binding sites. The paper interprets amino
      acids as agonists, but later controlled-membrane work distinguishes positive allosteric
      modulation. Amino-acid binding remains supported irrespective of this activation-model
      dispute.
- id: PMID:32817431
  title: Illuminating the allosteric modulation of the calcium-sensing receptor.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected complete Results and Discussion passages describe a SNAP-tag TR-FRET
      receptor sensor, cellular IP1/calcium assays, cell-surface controls, cross-linking and
      dialyzed membrane preparations. Under the controlled membrane conditions calcium alone
      drove the full conformational transition, whereas amino acids potentiated calcium responses.
      This differs from a universal amino-acid-alone agonist interpretation. Detailed experimental
      protocols delegated to the separate SI Appendix were not independently read.
- id: PMID:32843625
  title: Calcium-sensing receptor-mediated NLRP3 inflammasome response to calciprotein particles
    drives inflammation in rheumatoid arthritis.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected complete Results, captions, Discussion and Methods passages were
      read, including human monocytes, one sequenced CaSR-deficient THP-1 clone and a non-targeting
      clone, myeloid-specific mouse deletion, pharmacological controls, calciprotein-particle
      uptake, NLRP3 dependence, IL-1beta release and ASC-speck methodology. CaSR contributes
      upstream to inflammatory activation under calcium/phosphate/particle conditions; residual
      CaSR-independent activation is explicit. This does not make CASR a structural inflammasome
      component or establish a universal receptor output. Figures and supplementary data were
      not independently reanalyzed.
- id: PMID:33603117
  title: Structural mechanism of cooperative activation of the human calcium-sensing receptor
    by Ca(2+) ions and L-tryptophan.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected complete cryo-EM interpretation, construct and cellular-assay passages
      were read. Full-length human CaSR with substituted signal sequence/tags was expressed
      in insect cells; HEK293T mutant assays measured IP1 with surface-expression controls.
      Tryptophan closes the Venus flytrap domain but does not alone complete transmembrane activation;
      calcium and amino acids cooperate in the authors' model. Ambient ligands and conformational
      intermediates limit absolute ligand-sufficiency conclusions.
- id: PMID:34194040
  title: Asymmetric activation of the calcium-sensing receptor homodimer.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected complete structural, engineered-dimer, BRET, IP1 and expression-method
      passages were read. Human CaSR residues 20-894 were used for structural and cellular assays,
      with signaling competence assessed; forced dimers used GABAB-derived targeting elements.
      The results support GPCR signaling, asymmetric activation and allosteric modulation, but
      engineered targeting constructs and the C-terminal truncation must not be presented as
      unmodified endogenous receptor behavior.
- id: PMID:34467854
  title: Structural insights into the activation of human calcium-sensing receptor.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected complete structural, ligand, mutational, expression-control and Discussion
      passages were read. A human 1-870 construct was purified for structures and full-length
      mutant receptors were tested in cells. Inhibitory nanobody stabilization and calcium/TNCA/cinacalcet
      conditions define the structural states. The authors acknowledge that cryo-EM density
      alone does not uniquely identify calcium and that amino-acid activation terminology remains
      contested. Cellular calcium responses and expression controls support receptor activity.
- id: PMID:38326620
  title: Allosteric modulation and G-protein selectivity of the Ca(2+)-sensing receptor.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The complete abstract and selected complete Results/Methods paragraphs were
      read. Two complementary cellular BRET approaches primarily support Gi/o and Gq/11 activation,
      with receptor surface-expression controls. Human receptor constructs include a 20-894
      truncation; structural preparations additionally use GABAB-derived tails, tethering and
      engineered G proteins. These experiments support receptor coupling in the tested systems,
      not a universal native-tissue G-protein preference or a direct cAMP measurement.
