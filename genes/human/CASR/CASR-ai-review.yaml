  - ensembl:ENSRNOP00000003092
  review:
    summary: The rat donor assay supports receptor-mediated activation of chloride channels, rather than
      assigning their transport step to human CASR.
    action: MARK_AS_OVER_ANNOTATED
    reason: GO:1902476 denotes chloride movement across a membrane, under chloride and inorganic-anion
      transmembrane transport. GO_REF:0000107 transfers experimentally curated donor assertions through
      Ensembl orthology; the rat source is not uncurated. The dated official Casr donor graph links this
      rat IDA assertion to PMID:7816802. In the independently read original Results and Figure 3 caption,
      rat kidney receptor RNA expressed in Xenopus oocytes produces calcium-activated chloride currents
      after polyvalent-cation stimulation, whereas water-injected controls do not. Persistence of the
      response without extracellular calcium supports signaling through intracellular calcium release
      to the oocyte chloride channels. This positive experiment establishes an upstream receptor-dependent
      channel response, not a chloride-translocation step performed by CASR. Transferring that readout
      as human CASR involvement in chloride transport overextends the demonstrated assay role. This is
      not a universal rule that only pore proteins can participate in transport, a negative experiment
      on human CASR, or a declaration that the donor curator made an error. The established receptor-signaling
      annotations are retained; a particular human chloride-transport regulatory subtype is not added
      without its relevant assay.
    supported_by:
    - reference_id: GO_REF:0000107
    - reference_id: file:human/CASR/CASR-uniprot.txt
    - reference_id: PMID:7816802
      supporting_text: 'characteristic activation of inositol phospholipid-dependent,

        intracellular Ca(2+)-induced Cl- currents.'
