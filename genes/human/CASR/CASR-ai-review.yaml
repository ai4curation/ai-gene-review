suggested_questions:
- question: Which rat- and mouse-derived tissue-specific assertions can be grounded in target-specific
    primary assays, with the relevant cell type and stimulus preserved?
- question: How do endogenous ligand concentrations, receptor construct boundaries and cell-specific G-protein
    abundance account for differences in amino-acid activation models and G-protein coupling?
- question: Do the two UniProt products differ in trafficking or signaling under matched expression conditions?
    The current source rows do not establish isoform-specific function.
- question: Which parathyroid secretion experiments and ortholog-transfer evidence justify a human CASR
    annotation to GO:2000829, negative regulation of parathyroid hormone secretion? CASR performs a calcium-sensing
    regulatory step, and secretion-regulating GPCR comparators support that type of role; the remaining
    issue is the specific secretion endpoint and its human transfer, not receptor identity.
suggested_experiments:
- description: Compare full-length CASR products in matched cells with controlled extracellular
    calcium and amino-acid composition, measuring cell-surface abundance, G-protein activation,
    IP1, cytosolic calcium and cAMP in parallel.
