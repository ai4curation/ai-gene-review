  review:
    summary: CASR can engage Gi-linked signaling that inhibits adenylate cyclase.
    action: ACCEPT
    reason: The complete abstract and selected complete Results/Methods paragraphs were read.
      Two complementary cellular BRET approaches primarily support Gi/o and Gq/11 activation,
      with receptor surface-expression controls. Human receptor constructs include a 20-894
      truncation; structural preparations additionally use GABAB-derived tails, tethering and
      engineered G proteins. These experiments support receptor coupling in the tested systems,
      not a universal native-tissue G-protein preference or a direct cAMP measurement. Gi engagement
      is directly supported, whereas the adenylate-cyclase step is an established pathway interpretation
      rather than a direct cAMP endpoint in the inspected assays. Retain the curator assertion
      with that distinction and without imposing one G-protein preference on all tissues.
