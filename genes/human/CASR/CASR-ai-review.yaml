  review:
    summary: Receptor activation contributes to regulation of intracellular calcium responses.
    action: ACCEPT
    reason: The complete abstract describes CaSR-dependent intracellular calcium oscillations,
      T888 phosphorylation, PKC feedback and phosphatase-sensitive behavior in receptor-expressing
      HEK293 cells, with a separate bovine parathyroid component. This supports receptor-dependent
      calcium regulation without identifying CASR as a calcium channel. The cache is abstract-only.
      Retain the curator's calcium-regulatory assertion in the context of receptor-dependent
      calcium signaling and feedback; this is not evidence that CASR itself is a calcium channel,
      pump or intracellular buffer.
    supported_by:
