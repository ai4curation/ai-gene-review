    correctness: VERIFIED
    review_notes: The complete abstract describes CaSR-dependent intracellular calcium oscillations,
      T888 phosphorylation, PKC feedback and phosphatase-sensitive behavior in receptor-expressing
      HEK293 cells, with a separate bovine parathyroid component. This supports receptor-dependent
      calcium regulation without identifying CASR as a calcium channel. The cache is abstract-only.
  full_text_unavailable: true
- id: PMID:17555508
  title: Neonatal severe hyperparathyroidism associated with a novel de novo heterozygous R551K
    inactivating mutation and a heterozygous A986S polymorphism of the calcium-sensing receptor
    gene.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The complete abstract reports a de novo heterozygous R551K variant in cis
      with A986S in one child with neonatal severe hyperparathyroidism, later mild hypercalcemia,
      and reduced calcium sensitivity in HEK293 cells. It supports receptor signaling and localization;
      this family-specific presentation does not redefine the usual recessive severe-disease
      association. The cache is abstract-only.
  full_text_unavailable: true
- id: PMID:19789209
