id: P41180
gene_symbol: CASR
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CASR encodes the calcium-sensing receptor, a class C seven-transmembrane G protein-coupled
  receptor that functions as a homodimer. Its extracellular Venus flytrap and cysteine-rich
  domains sense extracellular calcium and transmit ligand-dependent conformational changes to
  the transmembrane domains. Calcium sensitivity is modulated by amino acids and other ligands.
  Coupling to Gq/11 and Gi/o pathways regulates phosphoinositide signaling, intracellular calcium
  responses and cyclic AMP in a cellular-context-dependent manner. In parathyroid and renal
  tissues, this sensing system helps regulate parathyroid hormone secretion and systemic calcium
  balance. Receptor folding, dimerization, glycosylation and regulated delivery to the cell
  surface influence signaling capacity. Loss-of-function and gain-of-function variants alter
  the calcium set point and underlie familial hypocalciuric hypercalcemia, neonatal severe hyperparathyroidism
  and autosomal dominant hypocalcemia, with severity and inheritance depending on the variant
  and allelic context.
