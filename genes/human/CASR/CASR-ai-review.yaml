- id: PMID:7816802
  title: Cloning and functional expression of a rat kidney extracellular calcium/polyvalent cation-sensing
    receptor.
  findings: []
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The authenticated normal cache contains the complete abstract only despite PMCID PMC42831.
      It directly describes rat kidney RaKCaR cRNA in Xenopus oocytes and phospholipid-dependent, intracellular-calcium-induced
      chloride currents. Separately read selected original-paper Results and Figure 3 caption supply water-injected
      controls and persistence of the response in calcium-free extracellular solution with EGTA; these
      external sections are not presented as cached full text or a whole-paper reading. The dated official
      rat donor graph links this paper to the chloride-transport assertion. These observations support
      receptor-mediated channel activation, with the human transport transfer assessed as excessive; they
      do not establish a specific human chloride-transport regulatory subtype. The abstract describes
      earlier bovine parathyroid receptor/PTH work as background, not a new human PTH-secretion assay.
core_functions:
- description: Senses extracellular calcium through a dimeric class C G protein-coupled receptor
    and transmits the signal through Gq/11- and Gi-linked pathways. Ligand-dependent extracellular-domain
    closure and transmembrane rearrangement regulate cellular phosphoinositide, calcium and
    cyclic-AMP responses, providing a receptor mechanism for endocrine and renal calcium control.
    Amino acids modulate calcium sensitivity; their agonist versus allosteric classification
    depends on assay conditions.
  molecular_function:
    id: GO:0004930
    label: G protein-coupled receptor activity
  locations:
  - id: GO:0005886
    label: plasma membrane
  directly_involved_in:
  - id: GO:0005513
    label: detection of calcium ion
  - id: GO:0007200
    label: phospholipase C-activating G protein-coupled receptor signaling pathway
  - id: GO:0007193
    label: adenylate cyclase-inhibiting G protein-coupled receptor signaling pathway
  supported_by:
