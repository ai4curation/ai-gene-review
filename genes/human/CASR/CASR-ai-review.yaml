      in HEK293 cells, partial signaling rescue for selected combinations and biochemical heterodimers.
      This supports receptor function and functional communication between subunits. The cache
      is abstract-only; uninspected controls are not claimed.
  full_text_unavailable: true
- id: PMID:15572418
  title: Functional characterization of calcium-sensing receptor codon 227 mutations presenting
    as either familial (benign) hypocalciuric hypercalcemia or neonatal hyperparathyroidism.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The complete abstract reports human R227Q and R227L receptors expressed in
      HEK293 cells, comparable glycosylation and cell-surface abundance, and different extracellular-calcium
      concentration responses. It supports plasma-membrane localization of the tested receptors.
      The cache is abstract-only.
