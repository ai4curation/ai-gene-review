    associated with apparent autosomal recessive inheritance of familial hypocalciuric hypercalcemia.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The complete abstract reports Q459R in a consanguineous family, mild hypercalcemia
      in homozygotes, largely normal heterozygotes, and reduced signaling despite cell-surface
      expression. This is a particular allele/family with apparent recessive mild disease, not
      a universal inheritance rule. The cache is abstract-only.
  full_text_unavailable: true
- id: PMID:20361938
  title: The cargo receptor p24A facilitates calcium sensing receptor maturation and stabilization
    in the early secretory pathway.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Human CaSR and human TMED2/p24A constructs were tested in HEK293 cells after
      a human-kidney yeast two-hybrid screen. Selected complete Methods, Results and Discussion
      passages show reciprocal coimmunoprecipitation of immature CaSR, truncation and p24A-mutant
      comparisons, surface/total expression controls and Sar1 perturbations. TMED2 is the trafficking
      cargo receptor; CASR is its cargo. Direct purified-protein binding and a chaperone activity
      of CASR were not established.
- id: PMID:20798521
  title: Calcium sensing receptor mutations implicated in pancreatitis and idiopathic epilepsy
    syndrome disrupt an arginine-rich retention motif.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected complete Methods, Results and Discussion passages from the normal
      HTML cache show FLAG-tagged human CaSR expressed in HEK293 cells, background-corrected
      surface/total ELISA, ERK responses, arginine-motif mutants and phosphorylation-site substitutions.
      They support regulated surface abundance. The historical epilepsy implication is not accepted
      as current gene-disease validity; the frozen ClinGen record classifies that association
      as refuted. Cellular trafficking results and disease causality are separate claims. Direct
      14-3-3 binding was explicitly left unresolved by the authors.
