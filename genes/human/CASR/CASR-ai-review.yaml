    reason: Selected complete structural, ligand-binding, mutational and cellular-assay passages
      were read. Human extracellular-domain constructs were expressed in insect cells, whereas
      full-length human receptors were tested in HEK293 cells with surface-expression controls,
      IP1 and calcium readouts. Scintillation proximity directly demonstrated tryptophan binding;
      anomalous diffraction supported calcium-binding sites. The paper interprets amino acids
      as agonists, but later controlled-membrane work distinguishes positive allosteric modulation.
      Amino-acid binding remains supported irrespective of this activation-model dispute. Retain
      the curator's calcium-regulatory assertion in the context of receptor-dependent calcium
      signaling and feedback; this is not evidence that CASR itself is a calcium channel, pump
      or intracellular buffer.
    supported_by:
    - reference_id: PMID:27434672
