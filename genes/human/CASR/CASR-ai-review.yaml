    correctness: VERIFIED
    review_notes: The complete abstract reports surface localization of wild-type receptor,
      ER retention of R66H, R66C and N583X mutants, and FRET evidence for wild-type and R66H/R66C
      dimers. Dimerization is necessary but not sufficient for efficient export in this experiment.
      The cache is abstract-only, so the full imaging and FRET controls were not independently
      inspected.
  full_text_unavailable: true
