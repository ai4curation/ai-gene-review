core_functions:
- description: Serves as the gamma subunit of the Sec61 protein-conducting channel in the endoplasmic
    reticulum membrane, clamping the two halves of SEC61A1 so that the complex can act as a ribosome receptor
    and gated pore, translocating signal-peptide-bearing precursors across the ER membrane cotranslationally
    (and, with SEC62/SEC63, post-translationally) and inserting the first transmembrane segments of membrane
    proteins.
  molecular_function:
    id: GO:0008320
    label: transmembrane protein transporter activity
  in_complex:
    id: GO:0005784
    label: Sec61 translocon complex
