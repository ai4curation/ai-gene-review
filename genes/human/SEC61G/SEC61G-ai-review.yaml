  - reference_id: file:human/SEC61G/SEC61G-uniprot.txt
    supporting_text: Forms a ribosome receptor and a gated pore in the ER membrane, both functions required
      for cotranslational translocation of nascent polypeptides
  - reference_id: file:human/SEC61G/SEC61G-uniprot.txt
    supporting_text: The SEC61 channel is also involved in ER membrane insertion of transmembrane proteins
suggested_questions:
- question: Does SEC61G contribute anything beyond structural stabilization of SEC61A1 - for example substrate
    selectivity or regulation of channel gating?
- question: Does the SEC61G paralog SEC61G-containing translocon differ functionally from SEC61A2-containing
    channels in human tissues?
- question: Is SEC61G co-amplification with EGFR in glioblastoma functionally consequential, by raising
    translocon capacity, or is it a passenger of the 7p11.2 amplicon?
suggested_experiments:
- description: Degron-based acute depletion of SEC61G in human cells with ribosome profiling and secretome
    analysis, to test whether its loss affects all translocon substrates equally or selectively.
- description: Cryo-EM of translocons assembled with structure-guided SEC61G mutants engaged on a nascent
    chain, to determine how the gamma subunit influences lateral-gate opening.
- description: Isogenic glioblastoma lines with SEC61G copy number varied independently of EGFR, assayed
    for ER capacity, secretory load and growth, to separate amplicon passenger from driver.
