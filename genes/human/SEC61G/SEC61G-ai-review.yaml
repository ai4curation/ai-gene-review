id: P60059
gene_symbol: SEC61G
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SEC61G is the gamma subunit of the Sec61 protein-conducting channel, the heterotrimeric translocon
  of the endoplasmic reticulum membrane. It is a small single-pass membrane protein of the SecE/SEC61-gamma
  family that clamps the two halves of the SEC61A1 pore-forming subunit, stabilizing the channel together
  with SEC61B. The assembled Sec61 complex acts as a ribosome receptor and a gated aqueous pore that translocates
  signal-peptide-bearing precursor polypeptides across the ER membrane cotranslationally and, with SEC62/SEC63,
  post-translationally, and inserts the first transmembrane segments of membrane proteins before handing
  multi-pass substrates to the multi-pass translocon. SEC61G is therefore an intracellular ER-membrane
  component, not a cell-surface protein; the translocon is the target of inhibitors such as mycolactone
  and cotransin, and SEC61G lies in the chromosome 7p11.2 region co-amplified with EGFR in glioblastoma.
