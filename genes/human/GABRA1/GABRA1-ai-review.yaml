id: P14867
gene_symbol: GABRA1
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: GABRA1 encodes the alpha1 subunit of heteropentameric GABA-A receptors. Its extracellular
  domain contributes to GABA-binding interfaces with beta subunits, and its transmembrane helices contribute
  to the chloride-conducting pore. Alpha1-containing receptors mediate fast postsynaptic GABAergic signaling;
  other partner combinations support tonic signaling, with gating and pharmacology depending on receptor
  composition. The direction and electrical effect of chloride movement depend on the ionic gradient.
  Alpha1-containing receptor assemblies can also promote inhibitory contacts in reduced neuronal co-cultures.
  Pathogenic GABRA1 variants can impair receptor trafficking or function and cause epilepsy.
