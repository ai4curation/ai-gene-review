- id: PMID:2538761
  title: Importance of a novel GABAA receptor subunit for benzodiazepine pharmacology.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Authentic abstract explicitly reports alpha1/beta1/gamma2 receptor pharmacology. Detailed
      clone species and methods remain unread. Gamma2-specific benzodiazepine effects are not assigned
      as an independent alpha1 activity.
- id: PMID:25489750
  title: Inhibitory synapse formation in a co-culture model incorporating GABAergic medium spiny neurons
