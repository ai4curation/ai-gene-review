- id: PMID:25172774
  title: The kinesin KIF21B participates in the cell surface delivery of γ2 subunit-containing GABAA receptors.
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Identifier and title verified against the authentic original abstract. Rat UniProt P62813
      links SL-0089 cytoplasmic vesicle membrane to this paper with ECO:0000269. The abstract reports
      gamma2-containing GABA-A receptor co-precipitation and colocalization with KIF21B in cultured hippocampal
      neurons, reduced receptor clusters after KIF21B knockdown, and proposed transport-vesicle delivery.
      Full text was not recovered (publisher access failed); no alpha1-specific panel, construct, vesicle
      identity or direct human localization experiment was verified. This assessment identifies the donor
      source while preserving the two alpha1 vesicle judgments as UNDECIDED.
