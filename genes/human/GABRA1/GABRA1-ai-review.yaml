  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected original protocol/Results/Discussion show surface-expression assays and alpha1/beta3/gamma2
      co-cultures, while Figure2 reuses earlier alpha1/beta2/gamma2 data. Figure1B caption repeats beta2
      despite beta3 context. No silent repair, independent-replication claim or cDNA-species inference
      is made; images were not inspected.
- id: PMID:29950725
  title: Structure of a human synaptic GABA(A) receptor.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected original human alpha1/beta2/gamma2 Methods, receptor currents, ligand-pocket
      Results and captions read. M3-M4 loops were replaced for the structure, with functional comparison.
      Alpha1 contributes GABA-pocket surfaces and pore structure; detergent-dependent conformations are
      not all assigned to the physiological gating cycle.
- id: PMID:30266951
  title: Structural basis of neurosteroid anesthetic action on GABA(A) receptors.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: 'Original abstract read and ROOT selected publisher Methods/Results retained: ELIC extracellular
      domain/human alpha1 transmembrane chimera, bacterial structural expression and oocyte functional
      tests. Supports transmembrane steroid-modulation mechanisms; does not alone establish native human
      heteromer membership or alpha1 orthosteric recognition. No raw map or supplementary image was inspected.'
- id: PMID:30602789
  title: Cryo-EM structure of the human α1β3γ2 GABA(A) receptor in a lipid bilayer.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected original human P14867/beta3/gamma2L Methods, electrophysiology, ligand-binding
      and captions read. Full-length tagged receptor in nanodiscs is functionally tested. Pocket ligand
      identity was unresolved and GABA docking is not identification. Gamma2L is the partner product;
      minor alpha1 proteolysis is a preparation observation.
- id: PMID:35140402
  title: Mechanisms of inhibition and activation of extrasynaptic αβ GABA(A) receptors.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected original human alpha1/beta3 construct Methods, wild-type comparison, patch-clamp
      and structural Results read. Engineered loops/BRIL/tags are distinct from natural products. Low
      opening probability, zinc blockade and alpha1/beta3 stoichiometry are assembly-context findings,
      not universal alpha1 properties.
- id: PMID:39843743
  title: Resolving native GABA(A) receptor structures from the human brain.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Authentic abstract and selected native full-text Methods, Results and Discussion were
      read. Anti-alpha1 affinity purification of pooled tissue from 81 epilepsy surgeries supports native
      human alpha1-containing beta2 and beta3 assemblies. The predominant assembly is beta2-alpha1-beta2-alpha1-gamma2;
      five maps contain unresolved subunit mixtures at one position. Selected recombinant tests corroborate
      receptor activity. Preparation abundance is not generalized to healthy brain, and the low-resolution
      accessory-partner assignments remain tentative. Complete-paper, figure-image, raw-map and full mass-spectrometry-table
      inspection are not claimed.
- id: PMID:9039914
  title: Insensitivity to anaesthetic agents conferred by a class of GABA(A) receptor subunit.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Authentic abstract describes a human epsilon subunit assembling with alpha/beta receptors
      and altering chloride currents/anesthetic responses. The exact alpha1 construct is not named there;
      original full methods were not read. Whole alpha1 channel/complex claims have independent support;
      no erroneous-paralog conclusion is made.
- id: PMID:11992121
  title: Mutation of GABRA1 in an autosomal dominant form of juvenile myoclonic epilepsy.
  reference_review:
