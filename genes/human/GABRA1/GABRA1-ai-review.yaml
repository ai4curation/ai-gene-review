    relevance: HIGH
    correctness: VERIFIED
    review_notes: Original abstract and ROOT-selected public captions describe alpha1/beta2/delta oocyte
      currents, low GABA efficacy and modulation. Clone species is not established by the host; original
      full text recovery failed. Relevant to the extrasynaptic interpretation but not independent human
      neuronal imaging.
- id: PMID:23909897
  title: GABA(A) receptors can initiate the formation of functional inhibitory GABAergic synapses.
