      co-cultures, receptor-specific controls, stable active contacts and synaptic currents. Positive
      receptor-assembly participation is supported; a unique alpha1 adhesion site, universal in-vivo necessity
      and the species of every clone are not established by the host.
- id: PMID:2465923
  title: Sequence and expression of human GABAA receptor alpha 1 and beta 1 subunits.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Authentic abstract explicitly identifies cloned human alpha1/beta1 and GABA-gated chloride
      channels in mammalian cells. Detailed original methods were not recovered. Its direct molecular
      conclusion is corroborated by later human receptor experiments.
- id: PMID:25025157
  title: Palmitoylation of gephyrin controls receptor clustering and plasticity of GABAergic synapses.
  reference_review:
