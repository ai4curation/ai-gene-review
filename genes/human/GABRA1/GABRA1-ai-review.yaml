    review_notes: Original abstract explicitly supports native mouse alpha1/delta partnership, colocalization
      and tonic currents with Gabra4/Gabrd genetic comparisons. Full text was not read; no direct human
      localization or universal alpha1 composition is inferred.
- id: PMID:18204487
