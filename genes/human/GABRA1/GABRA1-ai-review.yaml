      co-cultures, while Figure2 reuses earlier alpha1/beta2/gamma2 data. Figure1B caption repeats beta2
      despite beta3 context. No silent repair, independent-replication claim or cDNA-species inference
      is made; images were not inspected.
- id: PMID:29950725
  title: Structure of a human synaptic GABA(A) receptor.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
