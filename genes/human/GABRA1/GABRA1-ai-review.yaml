      Results and captions read. M3-M4 loops were replaced for the structure, with functional comparison.
      Alpha1 contributes GABA-pocket surfaces and pore structure; detergent-dependent conformations are
      not all assigned to the physiological gating cycle.
- id: PMID:30266951
  title: Structural basis of neurosteroid anesthetic action on GABA(A) receptors.
  reference_review:
