- term:
    id: GO:0032043
    label: mitochondrial DNA catabolic process
  evidence_type: IDA
  original_reference_id: PMID:42838054
  qualifier: involved_in
  review:
    summary: Recombinant DNASE1L3 removes oxidized mitochondrial DNA tethered to the surface of primary human
      B cells; DNASE1 does not.
    action: NEW
    reason: The enzyme performs the step itself, so this is a catalytic process annotation, not a substrate
      or necessity claim. The only other human/mouse carrier of GO:0032043 is ENDOG, the intramitochondrial
      nuclease; the term's definition has no location restriction, so extracellular breakdown of mitochondrial
      DNA falls within it. GO:0032043 is_a GO:0006308, which the gene already carries for its general extracellular
      and nuclear chromatin cleavage; this narrower row records the distinct mitochondrial-DNA substrate. As a caveat
      on directness, the preprint full text (PMID:41280093) shows that mitochondrial identity of the surface DNA
      was established by sequencing, Southern blotting and 8-oxo-dG mass spectrometry in cell lines, while
      the B-cell experiments measured removal of total surface DNA by csATAC-See imaging and flow cytometry.
