suggested_questions:
- question: Which cell types use an intracellular DNASE1L3 pool versus entry of secreted enzyme for nuclear
    fragmentation during membrane injury, and how does PARP-dependent inhibition control each context?
- question: Does the 275-residue natural product retain secretion, catalytic activity and access to nucleosomal
    or membrane-associated DNA?
- question: Can host-mediated NET disassembly be represented distinctly from NET formation and symbiont-mediated
    trap disruption, without conflating clearance with neutrophil activation or directed cytotoxicity?
- question: Does DNASE1L3 cleave cell-surface DNA while it is still bound to heparan sulfate proteoglycans
    and surface proteins, or only after release, and does the C-terminal peptide that aids access to membrane-associated
    chromatin also govern this activity?
- question: Is the DNA that DNASE1L3 removes from primary B cells mitochondrial, as in the cell lines, and
    does its accumulation in DNASE1L3-deficient people feed the anti-dsDNA response?
- question: Should GO add an extracellular DNA catabolic process term (see proposed_new_terms), so that breakdown
    of plasma, microparticle, NET and cell-surface DNA by DNASE1L3 and DNASE1 can be distinguished from intracellular
    DNA degradation?
suggested_experiments:
- description: Compare sequence-verified natural 305- and 275-residue products in matched secretion and
    substrate-cleavage assays, controlling protein amount and testing naked, nucleosomal and microparticle-associated
    DNA.
- description: Measure endogenous DNASE1L3 redistribution and DNA fragmentation with time-resolved caspase,
    membrane-integrity and CAD controls to distinguish apoptosis from secondary necrosis.
- description: Sequence the surface DNA released from primary B cells of Dnase1l3-/- and wild-type mice,
    and of R206C and reference-allele human donors, to test whether the extra surface DNA is mitochondrial;
    include wild-type versus C-terminal-truncated recombinant enzyme and heparinase treatment to test how
    proteoglycan tethering and the C-terminal peptide govern access.
proposed_new_terms:
- proposed_name: neutrophil extracellular trap disassembly
  proposed_definition: The disaggregation of a neutrophil extracellular trap, including breakdown of its
    extracellular DNA scaffold.
  justification: Current searches distinguish NET formation (GO:0140645) and symbiont-mediated NET disruption
    (GO:0141144), but did not identify a host NET-disassembly term. PMID:29191910 directly demonstrates
    host DNase-mediated digestion after NET release. This ontology proposal records that distinction;
    it does not add a new annotation or substitute formation for degradation. Parent placement requires
    ontology review.
  supported_by:
  - reference_id: PMID:29191910
- proposed_name: extracellular DNA catabolic process
  proposed_definition: The chemical reactions and pathways resulting in the breakdown of DNA located outside
    the cell, including cell-free plasma DNA, DNA in membrane vesicles and microparticles, the DNA scaffold
    of extracellular traps, and DNA tethered to the outer cell surface.
  justification: GO has DNA catabolic process (GO:0006308) and mitochondrial DNA catabolic process (GO:0032043)
    but nothing that distinguishes where the DNA is broken down. Secreted DNASE1L3 digests circulating plasma
    DNA, microparticle chromatin, released NETs and, per PMID:42838054, mitochondrial DNA on the B cell surface;
    loss causes human SLE. A child of GO:0006308 located in the extracellular region would capture this, and
    would also serve DNASE1. A further child, cell surface DNA catabolic process, could be added if more
    surface-DNA nucleases are found.
  supported_by:
  - reference_id: PMID:30593563
    supporting_text: DNASE1L3 plays a role in circulating plasma DNA homeostasis by enhancing fragmentation
      and influencing end-motif frequencies
  - reference_id: PMID:41280093
    supporting_text: DNASE1L3, but not DNASE1, partially and reproducibly removed cell surface DNA
