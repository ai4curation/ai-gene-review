id: Q13609
gene_symbol: DNASE1L3
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: DNASE1L3 is a calcium- and magnesium-dependent DNase I-family endonuclease that degrades
  extracellular DNA, including nucleosomal chromatin associated with apoptotic cell-derived microparticles.
  Its C-terminal region helps it act on protein- and lipid-associated DNA substrates, contributing to
  clearance of circulating self-DNA. Intracellular ER and inducible nuclear pools have also been observed,
  with context-dependent contributions to DNA fragmentation in dying cells.
alternative_products:
- name: '1'
  id: Q13609-1
  description: Displayed 305-residue precursor. UniProt annotates signal residues 1–20 and mature chain 21–305.
    Human nuclease studies support the gene-level activity; historical constructs are not automatically
    assigned to every natural product.
- name: '2'
  id: Q13609-2
  sequence_note: VSP_047251; deletion of displayed residues 78–107 yields a 275-residue product.
  description: The natural 30-residue internal deletion is sequence-verified. Comparative activity, secretion
    and physiological substrate preference were not established for this product by the inspected studies;
    it is distinct from engineered C-terminal deletions.
