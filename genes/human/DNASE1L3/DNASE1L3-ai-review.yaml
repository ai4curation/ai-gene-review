id: Q13609
gene_symbol: DNASE1L3
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: DNASE1L3 is a calcium- and magnesium-dependent DNase I-family endonuclease that degrades
  extracellular DNA, including nucleosomal chromatin associated with apoptotic cell-derived microparticles
  and released neutrophil extracellular traps. It shapes the size of circulating plasma DNA,
  and it removes oxidized mitochondrial DNA held on the surface of B cells by heparan sulfate proteoglycans. Its C-terminal region supports access to protein- and lipid-associated
  DNA substrates, helping clear self-DNA and limit anti-DNA autoimmunity. Intracellular DNASE1L3 can also
  cleave nuclear chromatin into internucleosomal fragments in dying cells; this contribution depends on
  the cellular and death-induction context.
alternative_products:
- name: '1'
  id: Q13609-1
  description: Displayed 305-residue precursor with an annotated signal peptide at residues 1–20 and mature
    chain at residues 21–305.
- name: '2'
  id: Q13609-2
  sequence_note: VSP_047251; deletion of displayed residues 78–107 yields a 275-residue product.
  description: A 275-residue product lacking the internal segment corresponding to canonical residues
    78–107. Its comparative catalytic activity, secretion and substrate preference remain uncharacterized.
