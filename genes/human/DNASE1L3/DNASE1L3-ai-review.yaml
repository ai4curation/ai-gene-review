core_functions:
- description: Hydrolyzes extracellular DNA, including nucleosomal DNA exposed on or contained within
    apoptotic cell-derived microparticles. The C-terminal peptide supports access to these chromatin and
    membrane-associated substrates; their digestion limits the availability of extracellular self-DNA.
  molecular_function:
    id: GO:0004530
    label: deoxyribonuclease I activity
  directly_involved_in:
  - id: GO:0006308
    label: DNA catabolic process
  locations:
  - id: GO:0005576
    label: extracellular region
  supported_by:
  - reference_id: GO_REF:0000033
  - reference_id: PMID:9714828
  - reference_id: PMID:27293190
    supporting_text: DNASE1L3, but not DNASE1, digested genomic DNA in MP generated from apoptotic Jurkat
      T cells
suggested_questions:
- question: Which cell types use intracellular DNASE1L3 for apoptotic fragmentation, and how can this
    contribution be distinguished from secondary necrosis and extracellular DNA digestion?
- question: Does the 275-residue natural product retain secretion, catalytic activity and access to nucleosomal
    or membrane-associated DNA?
- question: Do the neutrophil annotations describe altered activation or directed target-cell killing,
    beyond the demonstrated degradation of released NETs?
suggested_experiments:
- description: Compare sequence-verified natural 305- and 275-residue products in matched secretion and
    substrate-cleavage assays, controlling protein amount and testing naked, nucleosomal and microparticle-associated
    DNA.
- description: Measure endogenous DNASE1L3 redistribution and DNA fragmentation with time-resolved caspase,
    membrane-integrity and CAD controls to distinguish apoptosis from secondary necrosis.
