intracellular_assay_scope:
  PMID:24312463: Human DNase gamma expression in Ramos, U937 and HepG2 cells supports necrosis-associated
    nuclear DNA fragmentation. Mouse knockout nuclei, tissues and liver ischemia independently support
    the catalytic role. Figures 1–4 text/captions and Methods were read; no pixels inspected. Nuclear
    import from intracellular stores versus entry of secreted enzyme remains a model.
  PMID:23229555: Human DNAS1L3 in mouse MEFs supports context-dependent CAD cooperation; endogenous human
    HT-29 immunofluorescence and fractionation support induced nuclear relocation. The normal cache remains
    abstract-only; the separately recovered author original supplies Methods/Results.
