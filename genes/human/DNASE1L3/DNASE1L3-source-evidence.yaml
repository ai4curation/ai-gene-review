core: 'Two contexts of the same nuclease chemistry: extracellular DNA/NET clearance and nuclear chromatin
  fragmentation in dying cells. The latter has direct human-construct and endogenous-location support;
  apoptotic dependence remains context-specific. No NEW annotation.'
