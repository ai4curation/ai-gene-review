core_functions:
- description: Soluble B9-domain scaffold of the MKS module that binds B9D2 (and through it B9D1) at the
    ciliary transition zone; required for assembly of the transition-zone gate, efficient ciliogenesis,
    and the diffusion barrier for ciliary membrane proteins. No enzymatic or other defined molecular activity
    is known.
