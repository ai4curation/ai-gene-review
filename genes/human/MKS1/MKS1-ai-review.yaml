id: Q9NXB0
gene_symbol: MKS1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: MKS1 is a soluble B9-domain (C2-like) protein of the MKS (tectonic-like) module of the primary
  cilium transition zone. It binds B9D2 directly and, through B9D2, B9D1, forming a linear MKS1-B9D2-B9D1
  complex that associates with the transmembrane MKS-module proteins (TMEM67/meckelin, TMEM216, TMEM231,
  TMEM107, TCTN1-3, CC2D2A). MKS1 localizes to the basal body/transition zone and is required for efficient
  ciliogenesis, for centriole migration to the apical membrane, and for the transition-zone diffusion
  barrier that keeps ciliary membrane protein composition distinct from the plasma membrane. Loss of MKS1
  also perturbs cilia length and centrosome number. Biallelic MKS1 mutations cause Meckel syndrome type
  1, Joubert syndrome 28 and Bardet-Biedl syndrome 13.
