suggested_questions:
- question: Does the MKS1 B9/C2 domain bind membrane lipids directly, and is lipid binding needed for
    MKS1 function in the transition-zone barrier?
- question: Is the centrosome-overduplication/multiciliation phenotype of MKS1 loss a direct centrosomal
    role or a secondary consequence of defective ciliary signalling?
suggested_experiments:
- description: Liposome flotation/lipid-strip assays with purified MKS1 B9 domain (alone and in the MKS1-B9D2-B9D1
    complex), followed by rescue of MKS1-KO RPE1 cells with lipid-binding-deficient mutants and measurement
    of ciliary membrane protein diffusion (FRAP of ciliary SSTR3 or SMO).
  experiment_type: biochemistry and genetic rescue
