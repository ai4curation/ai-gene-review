id: Q9NXB0
gene_symbol: MKS1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: MKS1 is a B9/C2-domain protein of the ciliary transition zone and a core subunit of the MKS
  (Meckel syndrome) module. Together with B9D2 and B9D1 it forms a soluble heterotrimeric B9-domain complex.
  The complex localizes to the distal transition zone at the level of the Y-links, between the axonemal
  microtubules and the ciliary membrane. There it is needed for the diffusion barrier that keeps the ciliary
  membrane's protein composition distinct from the plasma membrane. MKS1 is also needed for normal ciliogenesis
  and the control of centrosome number in some cell types. Loss-of-function mutations cause Meckel-Gruber
  syndrome and Joubert syndrome.
