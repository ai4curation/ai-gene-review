core_functions:
- description: MKS1 is a soluble B9/C2-domain subunit of the transition-zone MKS module. It binds B9D2
    directly to form the MKS1-B9D2-B9D1 complex, and the three proteins localize to the distal transition
    zone in an interdependent way. In that position the complex helps maintain the diffusion barrier that
    keeps ciliary membrane composition (e.g. ARL13B, INPP5E) distinct. Loss of MKS1 also causes variable
    defects in cilium assembly and centrosome number. MKS1 has no characterized catalytic activity.
  directly_involved_in:
  - id: GO:1904491
    label: protein localization to ciliary transition zone
  - id: GO:0060271
    label: cilium assembly
  locations:
  - id: GO:0035869
    label: ciliary transition zone
  in_complex:
    id: GO:0036038
    label: MKS complex
  supported_by:
  - reference_id: PMID:32726168
    supporting_text: We here demonstrate the interaction mode of these B9D proteins to be MKS1-B9D2-B9D1
      and demonstrate their interdependent localization to the TZ
  - reference_id: PMID:32726168
    supporting_text: On the basis of these observations, we conclude that formation of the heterotrimeric
      B9D complex is essential for the TZ to function as a diffusion barrier for membrane proteins.
  - reference_id: PMID:22179047
    supporting_text: The complex that we have described is essential for normal cilia function and acts
      as a diffusion barrier to maintain the cilia membrane as a compartmentalized signalling organelle
