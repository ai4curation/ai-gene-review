suggested_questions:
- question: Does the MKS1 B9/C2 domain bind membrane lipids directly, and does that binding position the
    MKS module between the axoneme and the ciliary membrane?
suggested_experiments:
- description: Liposome flotation/co-sedimentation of purified MKS1-B9D2-B9D1 complex to test direct lipid
    binding by the B9 domains, combined with TZ-localization rescue by lipid-binding-deficient mutants
    in MKS1-KO RPE1 cells.
