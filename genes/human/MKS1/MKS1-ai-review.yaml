  review:
    summary: Cilium assembly (IBA, IEA, ISS, and IMP from Tammachote et al. 2009).
    action: ACCEPT
    reason: MKS1 depletion blocks centriole migration and primary cilium formation (Dawe et al. 2007),
      MKS1-KO RPE1 cells show reduced ciliogenesis (Okazaki et al. 2020), and MKS-module proteins establish
      basal body/TZ membrane attachment early in ciliogenesis. MKS1 is a structural constituent of the
      transition zone it helps build, so it participates in cilium assembly.
    supported_by:
    - reference_id: PMID:17185389
      supporting_text: siRNA-mediated reduction of Mks1 and Mks3 expression in a ciliated epithelial cell-line
        blocked centriole migration to the apical membrane and consequent formation of the primary cilium
    - reference_id: PMID:32726168
      supporting_text: Both the MKS1-KO and the B9D2-KO cell lines were moderately compromised with respect
