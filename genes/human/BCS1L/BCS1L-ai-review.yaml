gene_symbol: BCS1L
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: BCS1L is a mitochondrial inner-membrane AAA ATPase required for assembly of respiratory complex
  III. Its conserved Bcs1-family function uses ATP to move the folded Rieske iron-sulfur domain of UQCRFS1
  from the matrix to the intermembrane-space side while enabling incorporation of the client into the
  membrane complex. Human mitochondrial targeting and disease-associated assembly defects support this
  role; detailed heptameric architecture and conformational cycling have been characterized in orthologs.
  BCS1L also associates with LETM1. Pathogenic variants cause disorders including complex III deficiency,
  GRACILE syndrome and Bjornstad syndrome.
