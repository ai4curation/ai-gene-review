    reason: GO:0045275 denotes the ubiquinol-to-cytochrome-c electron-transfer complex. The conserved
      Bcs1 mechanism instead places BCS1L in a separate protein-translocation motor that delivers the
      Rieske client during assembly; the mouse Bcs1 architecture and mechanistic context in PMID:37821516
      support this distinction, together with the curated human UniProt chaperone assignment. Reactome
      lists mature complex III subunits without BCS1L, which corroborates the distinction but is not by
      itself proof of exclusion; its summary does not explicitly name BCS1L as an assembly factor. Remove
      the TAS mature-complex membership assertion on this combined biological evidence, while preserving
      the original source object. The full PMID:9878253 paper and the historical basis of the TAS remain
      unavailable, so no particular curator error or mapping mechanism is asserted.
