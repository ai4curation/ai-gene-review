gene_symbol: BCS1L
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: BCS1L is a mitochondrial inner-membrane AAA ATPase that promotes respiratory complex III
  assembly by moving the folded Rieske iron-sulfur domain of UQCRFS1 from the matrix to the intermembrane-space
  side and enabling client incorporation into the membrane complex. Its N-terminal transmembrane helix
  anchors a matrix-facing region containing a BCS1-specific domain and a C-terminal AAA domain. The Bcs1-family
  motor forms a heptameric ring whose nucleotide-dependent conformational changes couple ATP utilization
  to protein translocation. BCS1L also associates with LETM1 and contributes to mitochondrial network
  organization. Pathogenic variants cause complex III deficiency, GRACILE syndrome and Bjornstad syndrome.
