core_functions:
- molecular_function: *id001
  description: ATP-driven movement of the folded Rieske domain across the mitochondrial inner membrane
    enables UQCRFS1 incorporation during complex III assembly. The membrane-anchored Bcs1 motor accommodates
    its client on the matrix side and releases the folded domain toward the intermembrane space.
  directly_involved_in:
  - id: GO:0034551
    label: mitochondrial respiratory chain complex III assembly
  - id: GO:0032979
    label: protein insertion into mitochondrial inner membrane from matrix
  locations:
  - id: GO:0005743
    label: mitochondrial inner membrane
  supported_by:
  - reference_id: PMID:37821516
  - reference_id: PMID:11528392
  - reference_id: PMID:9878253
  - reference_id: file:human/BCS1L/BCS1L-uniprot.txt
suggested_questions:
- question: Do the complex I and IV assembly phenotypes require an additional BCS1L activity, or follow
    from interdependence of respiratory complexes?
- question: What source evidence and complex definition underlie the original GO:0045275 part_of assertion,
    and does it refer to a mature complex or an assembly intermediate?
- question: Can direct assays with human BCS1L establish substrate transport and ATP coupling independently
    of the ortholog conformational measurements?
- question: How should Bcs1-family folded-protein export be represented given that FlyBase GO-CAM gomodel:6918f23700002487/6918f23700002635
    uses GO:0008566, while that term and EC:7.4.2.3 define TIM-mediated import? Should the definition
    be broadened or a separate mitochondrial folded-protein export term be provided?
