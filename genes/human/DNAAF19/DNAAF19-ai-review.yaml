- term:
    id: GO:0036157
    label: outer dynein arm
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: part_of
  supporting_entities:
  - InterPro:IPR042422
  review:
    summary: Generalize outer-arm membership to an axonemal attachment location.
    action: MODIFY
    reason: IPR042422 is an exact target family match (residues 3–241), but its GO:0036157 mapping places
      the protein within the outer arm. The original fractionation instead shows persistence on axonemes
      lacking arm/docking components and after arm extraction. Refine to axoneme, the supported compartment,
      without asserting a solved attachment interface or categorical exclusion from every transient arm-associated
      complex.
    supported_by:
    - reference_id: GO_REF:0000002
    - reference_id: PMID:22581229
    proposed_replacement_terms:
    - id: GO:0005930
      label: axoneme
    propagation_review:
      root_cause: PROPAGATION_BAD
      source_entities:
      - source_id: InterPro:IPR042422
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: The family identity is correct; mapping an arm attachment/assembly factor to the motor-arm
          component overstates the supported complex membership.
      failure_modes:
      - COMPARTMENT_OR_COMPLEX_MISMATCH
- term:
