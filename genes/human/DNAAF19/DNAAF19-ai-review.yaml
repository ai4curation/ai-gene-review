core_functions:
- description: Binds microtubules and self-associates to support assembly and axonemal attachment of outer and inner
    dynein arms. Direct human recombinant microtubule binding complements human-protein rescue of both arm classes
    and conserved axonemal localization. Native human respiratory material contains apparent dimers, while recombinant
    full-length protein and defined fragments form oligomers. Native polymer geometry and the precise dynein/docking
    interface remain unresolved; native human arm-loss evidence is strongest for outer arms.
  molecular_function:
    id: GO:0008017
    label: microtubule binding
  directly_involved_in:
  - id: GO:0036158
    label: outer dynein arm assembly
  - id: GO:0036159
    label: inner dynein arm assembly
  locations:
  - id: GO:0005930
    label: axoneme
  - id: GO:0005737
    label: cytoplasm
  - id: GO:0031514
    label: motile cilium
  supported_by:
  - reference_id: PMID:22581229
    supporting_text: wild-type human CCDC103 mRNA also restored dynein arms
  - reference_id: PMID:31858719
    supporting_text: sufficient for heat/detergent-resistant dimer formation
  - reference_id: PMID:25572396
suggested_questions:
- question: What is the native human DNAAF19 assembly and its physical interface with axonemal microtubules,
    docking proteins and each dynein-arm class?
- question: Is the predicted 98-residue product expressed as a stable protein, and does it retain any
    self-association or dynein-arm assembly activity?
