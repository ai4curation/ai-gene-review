id: Q8IW40
gene_symbol: DNAAF19
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: DNAAF19, formerly CCDC103, is a small self-associating microtubule-binding protein that supports axonemal
  dynein-arm assembly and attachment in motile cilia. Conserved cytoplasmic and axonemal pools support dynein incorporation,
  enabling ciliary beating and normal left–right patterning. Purified human protein binds and stabilizes microtubules
  and forms oligomers; native human respiratory material contains apparent dimers. Its precise native polymer arrangement
  and dynein interface remain unresolved. Human variants cause primary ciliary dyskinesia with variable dynein-arm
  and laterality defects. Alternative transcripts encode a full-length 242-residue product and a predicted 98-residue
  product with a distinct short C terminus.

alternative_products:
- name: '1'
  id: Q8IW40-1
  description: Canonical 242-residue product. Historical human rescue and self-association constructs
    support the full-length protein and defined fragments; the independently authenticated interaction
    reference sequence also matches this product.
- name: '2'
  id: Q8IW40-2
  sequence_note: VSP_046037, VSP_046038
  description: 'Predicted 98-residue product: canonical residues 1–92 followed by NSWKSS. It lacks the
    complete native 68–94 dimerization segment and the 93–242 oligomerization region assayed in PMID:31858719.
    Equivalent assembly activity has not been demonstrated.'
