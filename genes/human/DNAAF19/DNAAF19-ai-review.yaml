- term:
    id: GO:0008017
    label: microtubule binding
  evidence_type: IDA
  original_reference_id: PMID:25572396
  qualifier: enables
  review:
    summary: Direct microtubule association demonstrated with purified human protein.
    action: NEW
    reason: PMID:25572396 directly tests bacterially expressed His10-tagged human CCDC103 with purified bovine-brain
      microtubules. In the sedimentation assay, CCDC103 remains soluble without microtubules and co-sediments with
      preformed or assembling microtubules; little or no binding to free tubulin dimers is observed. Cold-stability
      measurements and a minimal two-component EM reconstruction support this physical interaction. Methods and
      Figures 7A–C/8 distinguish these human-protein assays from the Chlamydomonas axoneme-extract assay in Figure
      7D. This specific binding assertion is not covered by the existing named protein-partner pairs and does not
      establish native human polymer geometry, the dynein interface, or equivalent activity of the predicted short
      product.
    supported_by:
    - reference_id: PMID:25572396
      supporting_text: CCDC103 binds microtubules directly
