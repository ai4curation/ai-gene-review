- term:
    id: GO:0042803
    label: protein homodimerization activity
  evidence_type: IDA
  original_reference_id: PMID:22581229
  qualifier: enables
  review:
    summary: Homodimerization is a measured self-association mechanism.
    action: ACCEPT
    reason: PMID:22581229 detects apparent dimers of human protein in respiratory cells and after expression
      in fish, and purified Chlamydomonas protein forms dimers. PMID:31858719 independently shows that
      human residues 68–94 confer dimerization on LC1 fusions. Retain the existing activity in the integrated
      assembly core, without equating fragment dimers with a solved native polymer architecture or functional
      equivalence of the short predicted isoform.
    supported_by:
    - reference_id: PMID:22581229
    - reference_id: PMID:31858719
