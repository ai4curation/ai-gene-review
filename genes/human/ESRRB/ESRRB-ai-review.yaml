id: O95718
gene_symbol: ESRRB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ESRRB (ERRβ) is an estrogen-related nuclear receptor that binds specific double-stranded
  regulatory DNA and activates RNA polymerase II transcription. Its zinc-finger DNA-binding domain recognizes
  response elements, while interactions with transcription factors and coactivators promote gene expression
  on chromatin. Alternative splicing produces protein forms with different C-terminal regions. In mice,
  Esrrb regulates stem-cell identity and tissue differentiation, linking this conserved transcriptional
  activity to context-dependent developmental programs.
