- term:
    id: GO:0005634
    label: nucleus
  evidence_type: EXP
  original_reference_id: PMID:18775884
  qualifier: located_in
  review:
    summary: Human ESRRB has directly observed nuclear localization, with independent human evidence supporting
      the more precise nucleoplasm compartment.
    action: MODIFY
    reason: 'PMID:18775884 (doi:10.1093/humrep/den298), Methods immunohistochemistry and confocal microscopy
      and Results/Figures 3–5, establishes nuclear staining in human endometrial cells using an antibody
      shared by the long and short products. Those experiments do not resolve nucleoplasm, and their endogenous
      staining cannot be assigned to a single product. The refinement instead uses independent positive
      human evidence: the ESRRB Human Protein Atlas record shows supported nucleoplasmic staining in K-562
      cells with HPA074772, whose antigen spans shared residues 36–65, and Reactome R-HSA-376419 and R-HSA-382096
      explicitly reach human ESRRB/O95718 entity 446173, residues 1–433, in nucleoplasm through candidate
      set 376224. Thus GO:0005654 describes an established subnuclear location of the gene product, rather
      than inferring it from the endometrial study or applying a rule by evidence code. The HPA antibody
      cannot distinguish the three products; the Reactome entity covers the 433-residue product. This
      does not establish nucleoplasmic localization for every product in every tissue, or exclude the
      separately observed cytosolic pool. Main endometrial Methods, Results and captions were read, but
      its figure pixels and supplemental Figure S1 were not; the separate HPA and Reactome access scopes
      are recorded in the source guide.'
    proposed_replacement_terms:
    - id: GO:0005654
      label: nucleoplasm
    supported_by:
    - reference_id: PMID:18775884
    - reference_id: GO_REF:0000052
    - reference_id: Reactome:R-HSA-376419
    - reference_id: Reactome:R-HSA-382096
