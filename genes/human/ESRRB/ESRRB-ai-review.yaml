  original_reference_id: PMID:19196830
  qualifier: involved_in
  negated: true
  review:
    summary: The inherited NOT assertion is not resolved by the human-versus-mouse embryonic stem-cell
      expression comparison.
    action: UNDECIDED
    reason: PMID:19196830 (doi:10.1210/me.2008-0465), Methods human and mouse ESC culture and quantitative
      PCR, Results nuclear-receptor expression and Discussion ERR-family comparison, measures expression
      in human H1/H9 ESCs and early embryoid bodies versus mouse ESCs. ERRbeta was undetectable in the
      tested human cultures, whereas mouse expression and previously published mouse trophoblast phenotypes
      are discussed. The human experiment does not perturb ESRRB in embryonic placental tissue or test
      a placental developmental outcome. GO:0001892 concerns progression of embryonically driven placental
      development, so absence of expression in these particular cultured states does not establish absence
      of that function in humans. Preserve negated:true and the NAS source exactly, withhold both acceptance
      of the functional negative and conversion to a positive assertion, and seek the actual basis for
      the human NOT annotation. This is an unresolved scope bridge, not a claim that the mouse experiments
      were attributed to the wrong gene.
    supported_by:
    - reference_id: PMID:19196830
