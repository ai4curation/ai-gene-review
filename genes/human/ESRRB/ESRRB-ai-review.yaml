    summary: Steroid-dependent receptor specificity remains unresolved.
    action: UNDECIDED
    reason: The current InterPro mappings from IPR024178 and IPR027289 really do supply this steroid-specific
      claim; the family labels are not a ligand assay. Current GO definitions require steroid-dependent
      receptor activity or steroid binding as appropriate. The available ERRβ reporter pharmacology in
      PMID:20534447 does not identify a steroid ligand, and the verified PMID:24315836 abstract positively
