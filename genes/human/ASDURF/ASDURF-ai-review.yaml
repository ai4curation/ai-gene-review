description: >-
  ASDURF (ASNSD1 upstream open reading frame protein) is a 96-amino-acid microprotein
  translated from an upstream open reading frame (uORF) in the 5' leader of the ASNSD1
  mRNA, upstream of and separate from the ASNSD1 main coding sequence. The peptide was first
  detected by peptidomics in K562 cells, at roughly 10-2000 copies per cell, and a tagged
  construct localizes to the cytoplasm. ASDURF is structurally related to beta-prefoldins.
  It is a subunit of the PAQosome (R2TP/prefoldin-like complex), a cytoplasmic chaperone
  assembly involved in the biogenesis of several multiprotein complexes. Within it, ASDURF
  joins PFDN2, PFDN6, UXT, URI1 and PDRG1 to form the heterohexameric prefoldin-like module.
  Purified ASDURF binds the prefoldin-like complex directly. ASDURF is upregulated in MYC- and
  MYCN-driven medulloblastoma and is required for the survival of MYC-driven medulloblastoma
  cells, where its loss phenocopies loss of prefoldin-like subunits. Loss of ASDURF or PFDN2
  causes overlapping post-transcriptional changes in the proteome, with cell-cycle proteins
  prominent among them. No catalytic or chaperone activity has been shown for ASDURF itself.
