core_functions:
- description: >-
    Structural subunit of the prefoldin-like module of the PAQosome (R2TP/prefoldin-like
    chaperone complex) in the cytoplasm. ASDURF is a beta-prefoldin-like peptide that,
    together with PFDN2, PFDN6, UXT, URI1 and PDRG1, forms the heterohexameric prefoldin-like
    module. No molecular function term is assigned: no chaperone or other activity has been
    shown for ASDURF on its own, and bare protein binding would not be informative.
