    summary: >-
      ComplexPortal annotation of the PAQosome (CPX-6145) function, applied to all twelve
      subunits (ASDURF, PFDN2, PFDN6, UXT, URI1, PDRG1, RPAP3, PIH1D1, RUVBL1, RUVBL2,
