suggested_questions:
- question: >-
    Does ASDURF replace a canonical beta-prefoldin position in the prefoldin-like hexamer
    (making it obligatory for PAQosome assembly), or is it a substoichiometric or
    exchangeable subunit?
- question: >-
    Which PAQosome client complexes (for example RNA polymerase II, snoRNPs, PIKK
    complexes) depend specifically on ASDURF, and does that explain the post-transcriptional
    cell-cycle proteome signature seen after its loss?
- question: >-
    Does translation of the ASDURF uORF also regulate translation of the downstream ASNSD1
    coding sequence in cis, independent of the peptide's trans function?
suggested_experiments:
- description: >-
    Assemble the prefoldin-like module from recombinant subunits with and without ASDURF,
    and test assembly and client binding (for example RPB5/POLR2E or unfolded model
    substrates). This would show whether ASDURF is structurally required and whether the
    module has holdase activity.
- description: >-
    Delete ASDURF without changing the ASNSD1 coding sequence (start-codon mutation in the
    endogenous locus). Then measure PAQosome integrity and the assembly of known client
    complexes by quantitative proteomics.
