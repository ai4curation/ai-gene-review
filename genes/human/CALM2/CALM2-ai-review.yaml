core_functions:
- description: Calcium-bound calmodulin activates protein serine/threonine kinases such as CaMKII
    through regulatory association and relief of autoinhibition. Calcium binding is the sensing mechanism
    of this unit; the kinase performs phosphate transfer. Human CaMKII structural and interaction
    studies establish the shared-protein mechanism without implying that every calmodulin-binding
    kinase is activated.
  molecular_function:
    id: GO:0043539
    label: protein serine/threonine kinase activator activity
  directly_involved_in:
  - id: GO:0005513
    label: detection of calcium ion
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:20668654
    supporting_text: mechanism of CaMKII activation by calmodulin
  - reference_id: PMID:35568036
- description: Calmodulin activates calcineurin through calcium-dependent target association, enabling
    phosphatase signaling. Human calmodulin conformational-lock experiments distinguish this activating
    function from the phosphatase reaction itself. Cytoplasmic and nuclear calmodulin complexes provide
    cellular context; the common protein sequence does not identify which CALM gene supplied an individual
    measured molecule.
  molecular_function:
    id: GO:0072542
    label: protein phosphatase activator activity
  directly_involved_in:
  - id: GO:0097720
    label: calcineurin-mediated signaling
  locations:
  - id: GO:0005829
    label: cytosol
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:8631777
    supporting_text: "loss of ability to activate \ntarget enzymes, phosphodiesterase and calcineurin"
  - reference_id: Reactome:R-HSA-2730867
  - reference_id: Reactome:R-HSA-4551465
- description: Calmodulin regulates calcium channels by sensing calcium and associating with channel
    regulatory regions. It supports CaV1.2 calcium-dependent inactivation and restrains RyR2-mediated
    release, coupling calcium sensing to cardiac electrical and excitation-contraction regulation.
    The broad regulatory unit includes these channel-specific inhibitory mechanisms without making
    inhibition universal. Human CALM2-associated long-QT evidence is separated from CALM1 and CALM3
    variant studies and mouse RyR2 models; calmodulin is an accessory regulator rather than the conducting
    pore.
  molecular_function:
    id: GO:0005246
    label: calcium channel regulator activity
  directly_involved_in:
  - id: GO:0010881
    label: regulation of cardiac muscle contraction by regulation of the release of sequestered calcium
      ion
  - id: GO:0060315
    label: negative regulation of ryanodine-sensitive calcium-release channel activity
  locations:
  - id: GO:0005829
    label: cytosol
  - id: GO:0005886
    label: plasma membrane
  in_complex:
    id: GO:0034704
    label: calcium channel complex
  supported_by:
  - reference_id: PMID:26969752
    supporting_text: dominant loss of inactivation in CaV1.2
  - reference_id: PMID:20226167
    supporting_text: "CaM attenuated the aberrant increase of \nCa(2+) sparks"
  - reference_id: PMID:26164367
suggested_questions:
- question: Which specialized myelin-sheath and sperm-midpiece calmodulin pools are directly supported
    by the original rodent assays, and how are the identical CALM gene products distinguished?
- question: What target-specific evidence underlies the substantia-nigra developmental annotation,
    beyond the available adult disease-proteomics abstract?
- question: How do CALM2 expression and dosage influence target occupancy and phenotypic differences
    among calmodulinopathies despite the identical canonical CALM1, CALM2 and CALM3 protein sequences?
