id: P0DP24
gene_symbol: CALM2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CALM2 encodes calmodulin, a small EF-hand calcium sensor whose canonical protein sequence
  is identical to those encoded by CALM1 and CALM3. Calcium-dependent conformational changes and
  target association couple intracellular calcium signals to activation of enzymes such as CaMKII
  and calcineurin and to regulation of ion channels. Calmodulin supports CaV1.2 calcium-dependent
  inactivation and controls RyR2-mediated calcium release; it also regulates potassium channels through
  distinct target interactions. Soluble cytoplasmic and nuclear pools exchange with membrane- and
  organelle-associated complexes. CALM2 variants can cause severe cardiac arrhythmia, including long-QT
  syndrome, through altered calcium sensing and channel regulation. The same protein also participates
  in cell-cycle and synaptic signaling, with gene-specific expression and dosage contributing biological
  context.
