- term:
    id: GO:0004722
    label: protein serine/threonine phosphatase activity
  evidence_type: EXP
  original_reference_id: PMID:12721286
  qualifier: enables
  review:
    summary: Experimentally demonstrated phosphoserine/phosphothreonine protein phosphatase activity of human CTDSP1.
    action: ACCEPT
    reason: Human SCP1 dephosphorylates phospho-Ser5 of the RNA polymerase II CTD in vitro (PMID:12721286), and
      the crystal structures with kinetics of the D96N enzyme bound to phospho-CTD peptides define its P.Ser/P.Thr-specific
      active site (PMID:17157258). The term is also the appropriate parent for the many non-CTD protein substrates
      reported for CTDSP1 (Smad1, Smad2/3 linker, REST, PML, Twist1, c-Myc).
    supported_by:
    - &id001
      reference_id: PMID:12721286
      supporting_text: This study describes a family of small CTD phosphatases (SCPs) that preferentially catalyze
        the dephosphorylation of Ser5 within the consensus repeat. The preferred substrate for SCP1 is RNAP II phosphorylated
        by TFIIH.
    - &id002
      reference_id: PMID:17157258
      supporting_text: Fcp1 and Scp1 belong to a family of Mg2+ -dependent phosphoserine (P.Ser)/phosphothreonine
        (P.Thr)-specific phosphatases.
    - &id003
      reference_id: PMID:17157258
      supporting_text: Here, we present the X-ray crystal structures of a dominant-negative form of human Scp1 (D96N
        mutant) bound to mono- and diphosphorylated peptides encompassing the CTD heptad repeat (Y1S2P3T4S5P6S7).
