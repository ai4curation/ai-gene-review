- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:16882717
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q15797
  review:
    summary: CTDSP1 interacts with SMAD1, its substrate; SCP1 dephosphorylates the receptor-phosphorylated C-terminus
      of Smad1.
    action: MODIFY
    reason: 'Bare protein binding is uninformative. The cited paper shows that the interaction is enzyme-substrate:
      human SCP1 dephosphorylates Smad1 C-terminal phosphoserines, and depleting SCP1/SCP2 in human cells prolongs
      Smad1 phosphorylation. The informative molecular function is the phosphatase activity itself, protein serine/threonine
      phosphatase activity (GO:0004722), already carried by CTDSP1 from EXP/IEA rows.'
    proposed_replacement_terms:
    - id: GO:0004722
      label: protein serine/threonine phosphatase activity
    supported_by:
    - &id009
      reference_id: PMID:16882717
      supporting_text: In Xenopus embryos, SCP2/Os4 and human SCP1, 2, and 3 cause selective dephosphorylation of
        Smad1 compared with Smad2, inhibiting BMP- and Smad1-dependent transcription
    - &id008
      reference_id: PMID:16882717
      supporting_text: In human cells, RNAi-mediated depletion of SCP1 and SCP2 increases the extent and duration
        of Smad1 phosphorylation in response to BMP, the transcriptional action of Smad1, and the strength of endogenous
        BMP gene responses.
