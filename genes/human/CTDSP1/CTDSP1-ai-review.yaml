suggested_questions:
- question: Is the plasma-membrane, palmitoylation-dependent pool of SCP1 that dephosphorylates AKT Ser473 (PMID:28440748)
    detectable for the endogenous protein, and does it justify a plasma membrane annotation alongside the nuclear
    one?
- question: Should negative regulation of BMP signaling pathway be curated at the SCP-clade PAINT node (PTN000954535),
    given that human SCP1, SCP2 and SCP3 all dephosphorylate Smad1 (PMID:16882717)?
- question: Is CDCA3 a physiological SCP1 substrate (PMID:24769477), given that it is the most frequently recovered
    CTDSP1 interactor in binary interactome screens?
- question: How does a single enzyme stabilise some substrates (REST, PML) and destabilise others (Twist1, c-Myc),
    and is substrate choice dictated by recruitment through the N-terminal region (residues 43-63 bind Twist1)?
suggested_experiments:
- description: Endogenous-tag (knock-in) imaging and fractionation of CTDSP1 in non-neuronal cells, with palmitoylation-site
    (N-terminal cysteine) mutants, to establish whether a plasma-membrane pool exists without overexpression.
- description: CTDSP1 knockout in a BMP-responsive human cell line with catalytic-dead (D96N) versus wild-type rescue
    and CTDSP2/CTDSPL co-depletion, measuring phospho-Smad1 kinetics, to separate CTDSP1-specific from redundant
    SCP activity.
