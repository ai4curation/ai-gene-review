id: Q9GZU7
gene_symbol: CTDSP1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'CTDSP1 (SCP1, NLI-IF) is a small nuclear protein phosphatase of the FCP/SCP branch of the haloacid
  dehalogenase (HAD) superfamily. Its C-terminal FCP1-homology domain binds one Mg2+ ion and uses a DXDX(T/V) motif,
  with Asp96 forming a phosphoaspartyl intermediate, to hydrolyse phosphoserine and phosphothreonine on protein
  substrates. Its best-characterised substrate is the C-terminal heptad-repeat domain of the RNA polymerase II largest
  subunit, from which it preferentially removes phospho-Ser5 placed by TFIIH; crystal structures with phospho-CTD
  peptides define this preference, and the activity is stimulated by the RAP74 subunit of TFIIF. CTDSP1 represses
  RNA polymerase II transcription, and the transcriptional repressor REST recruits it to RE-1-containing neuronal
  genes to keep them silent in non-neuronal cells and stem cells. CTDSP1 also stabilises REST itself by dephosphorylating
  its C-terminal phosphodegron. Beyond the polymerase, it dephosphorylates signalling and transcription proteins:
  the receptor-phosphorylated C-terminus of Smad1, which terminates BMP signalling; the linker region of Smad2/3;
  and stability-controlling sites on PML, Twist1 and c-Myc. CTDSP1 is expressed mainly in non-neuronal tissues and
  is downregulated during neurogenesis, partly by the neuron-enriched microRNA miR-124, while its intron hosts miR-26b.'
