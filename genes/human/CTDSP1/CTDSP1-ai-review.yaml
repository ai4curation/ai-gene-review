- term:
    id: GO:0005634
    label: nucleus
  evidence_type: IDA
  original_reference_id: PMID:12721286
  qualifier: located_in
  review:
    action: ACCEPT
    summary: CTDSP1 is a nuclear protein that colocalizes with RNA polymerase II and acts at REST-bound promoters.
    reason: Immunolocalization in PMID:12721286 underlies the UniProt nuclear location (ECO:0000269). Consistent
      with function at promoters (REST-recruited, PMID:15681389) and nuclear localization of the mouse ortholog
      (PMID:14743429). Nucleoplasm (GO:0005654) is the more specific location from HPA; nucleus remains correct
      and is accepted as is.
    supported_by:
    - &id004
      reference_id: file:human/CTDSP1/CTDSP1-uniprot.txt
      record_section: ["CC:SUBCELLULAR LOCATION"]
      supporting_text: 'SUBCELLULAR LOCATION: Nucleus {ECO:0000269|PubMed:12721286}.'
    - &id005
      reference_id: PMID:15681389
      supporting_text: We show that REST/NRSF recruits SCPs to neuronal genes that contain RE-1 elements, leading
        to neuronal gene silencing in non-neuronal cells.
