    - *id005
- term:
    id: GO:0006357
    label: regulation of transcription by RNA polymerase II
  evidence_type: IDA
  original_reference_id: PMID:12721286
  qualifier: involved_in
  review:
    summary: CTDSP1 regulates RNA polymerase II transcription; the direction is repression.
    action: MODIFY
    reason: Correct but less specific than the evidence. In PMID:12721286, SCP1 expression inhibits activated transcription
      from several promoters while a phosphatase-dead mutant enhances transcription, and REST recruits SCPs to RE-1
      genes to silence them (PMID:15681389). CTDSP1 performs a step of this process directly by dephosphorylating
      the Pol II CTD, so the replacement is negative regulation of transcription by RNA polymerase II (GO:0000122),
      matching the treatment of the paralog CTDSP2.
    proposed_replacement_terms:
    - id: GO:0000122
      label: negative regulation of transcription by RNA polymerase II
    supported_by:
    - reference_id: PMID:12721286
      supporting_text: Expression of SCP1 inhibits activated transcription from a number of promoters, whereas a
        phosphatase-inactive mutant of SCP1 enhances transcription.
    - *id005
    - reference_id: file:human/CTDSP1/CTDSP1-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Negatively regulates RNA polymerase II transcription, possibly by controlling the transition
        from initiation/capping to processive transcript elongation.
- term:
    id: GO:0006470
    label: protein dephosphorylation
  evidence_type: IDA
  original_reference_id: PMID:12721286
  qualifier: involved_in
  review:
    summary: CTDSP1 directly dephosphorylates protein substrates, principally the RNA polymerase II CTD.
    action: ACCEPT
    reason: Protein dephosphorylation is the process executed by its own catalytic activity, demonstrated in vitro
      on RNA polymerase II (PMID:12721286) and on many other phosphoprotein substrates in human cells. This is as
      precise as GO currently allows for CTD dephosphorylation.
    supported_by:
    - *id001
    - *id006
- term:
    id: GO:0008420
    label: RNA polymerase II CTD heptapeptide repeat phosphatase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000954535
  - UniProtKB:O14595
  - UniProtKB:Q9GZU7
  review:
    summary: RNA polymerase II CTD heptapeptide repeat phosphatase activity, inherited from the SCP-clade PAINT
      node.
    action: ACCEPT
    reason: The PAINT IBD for GO:0008420 is placed at PTN000954535 in PTHR12210, seeded by experimental annotations
      of human CTDSP1 (Q9GZU7) and CTDSP2 (O14595). CTDSP1 is in subfamily PTHR12210:SF139 (PANTHER 19 gene-info
      service), CTDSP2 in SF187, and both descend from this node. CTDSP1 appearing in its own WITH/FROM marks that
      it carries direct experimental grounding (PMID:12721286, PMID:17157258); this is not circular. The DXDX(T/V)
      catalytic motif with the Asp96 phosphoaspartyl nucleophile is intact, so there is no sign of loss. PAINT propagated
      only this MF from the node and no process or location terms, and that restraint is respected.
    supported_by:
    - &id007
      reference_id: file:human/CTDSP1/CTDSP1-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Preferentially catalyzes the dephosphorylation of 'Ser-5' within the tandem 7 residue repeats
        in the C-terminal domain (CTD) of the largest RNA polymerase II subunit POLR2A.
    - reference_id: file:human/CTDSP1/CTDSP1-uniprot.txt
      record_section: ["FT:ACT_SITE"]
      supporting_text: /note="4-aspartylphosphate intermediate"
    - *id001
- term:
    id: GO:0008420
    label: RNA polymerase II CTD heptapeptide repeat phosphatase activity
  evidence_type: IDA
  original_reference_id: PMID:12721286
  qualifier: enables
  review:
    summary: Direct demonstration that human SCP1 dephosphorylates the RNA polymerase II CTD, preferring phospho-Ser5.
    action: ACCEPT
    reason: 'This is the founding biochemical characterization of human SCP1: recombinant enzyme dephosphorylates
      Ser5 within the CTD consensus repeat and prefers RNAP II phosphorylated by TFIIH. Independent structural and
      kinetic work on human Scp1 bound to phospho-CTD peptides confirms the activity and its Ser5 preference (PMID:17157258).
      This is the core function of CTDSP1.'
    supported_by:
    - *id001
    - *id003
    - reference_id: PMID:15304220
      supporting_text: We demonstrate that the first aspartate in the signature motif undergoes metal-assisted phosphorylation
        during catalysis, resulting in a phosphoaspartate intermediate that was structurally mimicked with the inhibitor
        beryllofluoride.
