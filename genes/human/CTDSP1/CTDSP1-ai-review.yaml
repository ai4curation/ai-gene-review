- term:
    id: GO:0004722
    label: protein serine/threonine phosphatase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - RHEA:20629
  - RHEA:47004
  - EC:3.1.3.16
  review:
    summary: Protein serine/threonine phosphatase activity, from Rhea/EC mapping of the curated catalytic activities.
    action: ACCEPT
    reason: The electronic mapping agrees with the experimental evidence. CTDSP1 is a Mg2+-dependent HAD-family
      phosphoserine/phosphothreonine phosphatase (Asp96 nucleophile) whose substrates extend beyond the RNA polymerase
      II CTD to Smad1, Smad2/3 linker, REST, PML, Twist1 and c-Myc phosphoserines, so this broader term is as precise
      as warranted for the non-CTD activities and is not superseded by GO:0008420.
    supported_by:
    - *id002
    - reference_id: PMID:17035229
      supporting_text: Using a functional genomic approach, we identified the small C-terminal domain phosphatase
        1 (SCP1) as a specific phosphatase for Smad2/3 dephosphorylation in the linker and N terminus.
    - &id006
      reference_id: PMID:25197063
      supporting_text: we find that C-terminal domain small phosphatase 1 (CTDSP1), which is recruited by REST to
        neuronal genes, is present in REST immunocomplexes, dephosphorylates S861/864, and stabilizes REST.
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:12721286
  qualifier: enables
  supporting_entities:
  - UniProtKB:P35269
  review:
    summary: CTDSP1 (SCP1) binds the RAP74 subunit of TFIIF, which stimulates its CTD phosphatase activity.
    action: REMOVE
    reason: Bare protein binding is uninformative and is removed under the GO:0005515 policy; removal does not dispute
      the interaction. The functional content (TFIIF/RAP74 enhances SCP1 CTD phosphatase activity) concerns activation
      of CTDSP1 by its partner and is already represented by the accepted RNA polymerase II CTD heptapeptide repeat
      phosphatase activity (GO:0008420) annotation. No GO term for a binding-to-be-activated relationship is informative
      here.
    supported_by:
    - reference_id: PMID:12721286
      supporting_text: Like FCP1, the activity of SCP1 is enhanced by the RAP74 subunit of TFIIF.
