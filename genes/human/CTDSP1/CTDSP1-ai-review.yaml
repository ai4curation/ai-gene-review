- term:
    id: GO:0070062
    label: extracellular exosome
  evidence_type: HDA
  original_reference_id: PMID:23533145
  qualifier: located_in
  review:
    summary: Detected in a proteomic survey of urinary exosomes from prostatic secretions.
    action: MARK_AS_OVER_ANNOTATED
    reason: A single high-throughput proteomic detection in exosomes is not evidence that this nuclear CTD phosphatase
      functions in extracellular vesicles. No targeted study places CTDSP1 in exosomes, and its known functions
      are nuclear (RNA polymerase II, REST complexes). The detection likely reflects passive cargo from shed cells.
    supported_by:
    - *id004
- term:
    id: GO:0030514
    label: negative regulation of BMP signaling pathway
  evidence_type: IMP
  original_reference_id: PMID:16882717
  review:
    summary: CTDSP1 terminates BMP signaling by dephosphorylating the receptor-phosphorylated C-terminal serines
      of Smad1.
    action: NEW
    reason: 'Participation test: CTDSP1 itself catalyses the inactivating step (removal of the activating C-terminal
      phosphates of Smad1), so this is a catalytic contribution, not a necessity or substrate claim. Human SCP1
      selectively dephosphorylates Smad1 over Smad2, and RNAi depletion of SCP1 and SCP2 in human cells increases
      the extent and duration of BMP-induced Smad1 phosphorylation and the BMP gene response (PMID:16882717). An
      independent study finds that SCP1 phosphatase activity suppresses BMP-induced osteoblastic differentiation
      and that its knockdown enhances it (PMID:21239611). Comparator check (QuickGO, 2026-10-20): the R-Smad phosphatase
      MTMR4 (Q9NYA4) carries this term (IMP, PMID:23150675), and the Smad2/3 C-terminal phosphatase PPM1A carries
      the analogous GO:0030512 negative regulation of TGF-beta receptor signaling pathway (IDA, PMID:16751101),
      so phosphatases that inactivate the pathway''s R-Smad transducer are in the role GO assigns these terms to.
      The same term is proposed for the paralog CTDSP2 on the same paper.'
    supported_by:
    - *id008
    - *id009
    - reference_id: PMID:21239611
      supporting_text: The phosphatase activity of SCP1 was required for this suppression, and the knockdown of
        SCP1 in myoblasts stimulated the osteoblastic differentiation induced by BMP signaling.
- term:
    id: GO:0050821
    label: protein stabilization
  evidence_type: IDA
  original_reference_id: PMID:25197063
  review:
    summary: CTDSP1 stabilizes the REST transcriptional repressor by dephosphorylating its Ser861/864 degron phosphosites.
    action: NEW
    reason: Two independent laboratories show in human cells that CTDSP1 dephosphorylates the REST C-terminal phosphodegron
      (S861/S864) and thereby protects REST from betaTrCP-dependent degradation (PMID:25197063; PMID:30217818, with
      kinetics and crystal structures). CTDSP1 itself performs the protecting step (removal of the degron phosphate),
      so it participates in the stabilization. CTDSP1 similarly stabilizes PML by dephosphorylating S518 (PMID:25293974).
      Note that CTDSP1 has the opposite effect on other substrates (it destabilizes Twist1 and c-Myc by dephosphorylating
      stabilizing sites; PMID:26975371, PMID:25893300), so this term is substrate-specific and non-core.
    supported_by:
    - *id006
    - reference_id: PMID:30217818
      supporting_text: Furthermore, we show that SCP1 stabilizes REST protein levels, which sustains REST's gene
        silencing function in HEK293 cells.
    - reference_id: PMID:25293974
      supporting_text: Here, we show that the phosphatase SCP1 and its isoforms SCP2/3 dephosphorylate PML at S518,
        thereby blocking PML ubiquitination and degradation mediated by the prolyl isomerase Pin1 and the ubiquitin
        ligase KLHL20.
