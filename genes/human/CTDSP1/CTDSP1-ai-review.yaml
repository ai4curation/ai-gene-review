- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:16189514
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q99618
  review:
    summary: High-throughput or interactome-scale interaction of CTDSP1 with CDCA3.
    action: REMOVE
