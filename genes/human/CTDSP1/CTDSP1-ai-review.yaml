- term:
    id: GO:0005654
    label: nucleoplasm
  evidence_type: IDA
  original_reference_id: GO_REF:0000052
  qualifier: located_in
  review:
    summary: Nucleoplasm localization from Human Protein Atlas immunofluorescence.
    action: ACCEPT
    reason: HPA immunofluorescence places CTDSP1 in the nucleoplasm, consistent with the experimentally established
      nuclear localization (PMID:12721286) and with its action on promoter-bound RNA polymerase II and REST complexes
      (PMID:15681389). This is the most specific well-supported location.
    supported_by:
