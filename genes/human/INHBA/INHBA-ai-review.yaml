id: P08476
gene_symbol: INHBA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: INHBA encodes the secreted beta A subunit of dimeric TGF-beta-family ligands. Two beta A
  chains form activin A, which binds type II activin receptors and recruits a signaling type I receptor,
  commonly ACVR1B/ALK4, to activate SMAD2/3-dependent responses. Activin A acts as an endocrine and local
  cytokine regulating FSH secretion, development, cell differentiation and context-dependent growth and
  immune responses. Pairing beta A with the INHA alpha chain instead produces inhibin A, an antagonist
  that engages betaglycan and type II activin receptors and suppresses activin signaling and FSH secretion.
  Beta A can also pair with beta B to form activin AB. Follistatin and FSTL3 limit activin availability
  by masking receptor-binding surfaces. Receptor composition and target-cell context determine whether
  downstream outcomes include growth stimulation, growth arrest, differentiation or apoptosis.
