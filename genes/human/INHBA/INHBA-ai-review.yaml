- term:
    id: GO:0001942
    label: hair follicle development
  evidence_type: IGI
  original_reference_id: PMID:10932194
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q04999
  review:
    summary: Activin beta A contributes to hair and whisker development.
    action: KEEP_AS_NON_CORE
    reason: Mouse Inhba loss and Inhbb replacement at the Inhba locus alter whisker and hair phenotypes,
      supporting a conserved developmental signaling role. This is peripheral to the ligand biochemical
      mechanism.
    supported_by:
    - reference_id: PMID:10932194
      supporting_text: Whereas mice homozygous for the Inhba-null allele demonstrate disruption of whisker,
        palate and tooth development, leading to neonatal lethality
    - reference_id: PMID:10932194
      supporting_text: somatic, testicular, genital and hair growth were grossly affected and influenced
        by the dosage and bioactivity of the allele.
- term:
    id: GO:0002244
    label: hematopoietic progenitor cell differentiation
  evidence_type: IDA
  original_reference_id: PMID:15451575
  qualifier: involved_in
  review:
    summary: Activin A supports hematopoietic progenitor differentiation toward the erythroid lineage.
    action: KEEP_AS_NON_CORE
    reason: PMID:15451575 reports activin-induced commitment toward erythropoiesis in primary human cells.
      The progenitor-cell term captures this stage accurately. Erythrocyte differentiation is retained
      separately but is not an ontology descendant of this term, so it is not used as a purported narrower
      replacement.
    supported_by:
    - reference_id: PMID:15451575
      supporting_text: We report the induction by Activin A and BMP2 of cell commitment towards erythropoiesis
        in the absence of EPO.
