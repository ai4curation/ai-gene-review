    label: ovarian follicle development
  evidence_type: IGI
  original_reference_id: PMID:10932194
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q04999
  review:
    summary: Ovarian activins support follicular growth and differentiation.
    action: KEEP_AS_NON_CORE
    reason: Ovarian beta A knockout and combined beta A/beta B genetics support a local ovarian growth
      pathway. PMID:9166111 detects activins in follicular fluid but is not by itself proof of developmental
      function; the genetic evidence provides independent support.
    supported_by:
    - reference_id: PMID:17609433
      supporting_text: our data indicate that activin betaA and betaB function redundantly in a growth
        stimulatory pathway in the mammalian ovary.
    - reference_id: PMID:17609433
      supporting_text: Whereas ovarian betaA knockout females are subfertile, betaB/betaA double mutant
        females are infertile.
