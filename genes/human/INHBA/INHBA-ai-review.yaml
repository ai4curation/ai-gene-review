- term:
    id: GO:0005179
    label: hormone activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR000491
  review:
    summary: INHBA contributes to endocrine activin and inhibin hormones.
    action: ACCEPT
    reason: Activin A stimulates pituitary FSH release, whereas inhibin A containing INHA and INHBA suppresses
      it. The direction depends on ligand composition; the subunit is not an independently active monomeric
      hormone.
    supported_by:
    - reference_id: PMID:3267209
      supporting_text: the sequence of EDF mRNA is identical to that for the beta A subunit of inhibin,
        a gonadal protein that suppresses the secretion of pituitary follicle-stimulating hormone.
    - reference_id: PMID:2575216
      supporting_text: Purified activin B was shown to elicit FSH release in an in vitro pituitary assay
        and trigger the accumulation of hemoglobin in K562 cells. The potency of activin B in both of
        these assays (ED50 approximately 2 ng/ml) was indistinguishable from that observed for activin
        A.
    - reference_id: PMID:2575216
      supporting_text: Coexpression of the beta A- and beta B-subunit mRNAs resulted in the secretion
        of the three forms of activin, A, AB, and B.
