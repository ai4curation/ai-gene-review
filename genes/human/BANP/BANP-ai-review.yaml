  evidence_type: IMP
  original_reference_id: PMID:26080397
  qualifier: involved_in
  review:
    summary: Regulation of alternative mRNA splicing, via spliceosome (IMP). BANP represses CD44 variable
      exons v2-v6 by bringing HDAC6 to deacetylate SAM68, and ERK phosphorylation relieves this. A real
      but specialized function next to its role as a CpG-island transcription factor; kept as non-core.
    action: KEEP_AS_NON_CORE
    reason: '[PMID:26080397 "Here, we demonstrate that Scaffold/matrix-associated region-binding protein
      1 (SMAR1) negatively regulates alternative splicing through histone deacetylase 6 (HDAC6)-mediated
      deacetylation of RNA-binding protein Sam68 (Src-associated substrate during mitosis of 68 kDa)."]
      [file:human/BANP/BANP-uniprot.txt "CC       pre-mRNA and negatively regulates the inclusion of CD44
      proximal"]'
    supported_by:
