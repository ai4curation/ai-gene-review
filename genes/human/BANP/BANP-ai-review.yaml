- term:
    id: GO:0001228
    label: DNA-binding transcription activator activity, RNA polymerase II-specific
  evidence_type: ISS
  original_reference_id: PMID:34234345
  qualifier: enables
  review:
    summary: DNA-binding transcription activator activity, RNA polymerase II-specific (NEW, ISS). BANP
      binds the unmethylated CGCG motif at CpG-island promoters, opens chromatin, phases nucleosomes and
      strongly activates essential metabolic genes. Binding was mapped in both the mouse and human genomes.
      The activation evidence comes from pluripotent stem and neuronal cells, and the abstract does not
      say whether these were human. ISS (from the conserved BEN-domain ortholog) is therefore used rather
      than IDA for the human protein. BANP also represses some targets (cyclin D1, BAX/PUMA) via HDAC1
      complexes, but CpG-island activation is its genome-wide activity.
    action: NEW
    reason: '[PMID:34234345 "Here we combine single-molecule footprinting with interaction proteomics
      to identify BTG3-associated nuclear protein (BANP) as the transcription factor that binds this element
      in the mouse and human genome."] [PMID:34234345 "We show that BANP is a strong CGI activator that
      controls essential metabolic genes in pluripotent stem and terminally differentiated neuronal cells."]
      [PMID:34234345 "Upon binding to an unmethylated motif, BANP opens chromatin and phases nucleosomes."]
      [PMID:34234345 "BANP binding is repelled by DNA methylation of its motif in vitro and in vivo, which
      epigenetically restricts most binding to CGIs and accounts for differential binding at aberrantly
      methylated CGI promoters in cancer cells."]'
    supported_by:
    - reference_id: PMID:34234345
      supporting_text: Here we combine single-molecule footprinting with interaction proteomics to identify
        BTG3-associated nuclear protein (BANP) as the transcription factor that binds this element in
        the mouse and human genome.
    - reference_id: PMID:34234345
      supporting_text: We show that BANP is a strong CGI activator that controls essential metabolic genes
        in pluripotent stem and terminally differentiated neuronal cells.
    - reference_id: PMID:34234345
      supporting_text: Upon binding to an unmethylated motif, BANP opens chromatin and phases nucleosomes.
    - reference_id: PMID:34234345
      supporting_text: BANP binding is repelled by DNA methylation of its motif in vitro and in vivo,
        which epigenetically restricts most binding to CGIs and accounts for differential binding at aberrantly
        methylated CGI promoters in cancer cells.
