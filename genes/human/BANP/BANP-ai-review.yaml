- term:
    id: GO:0003677
    label: DNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR018379
  review:
    summary: DNA binding (IEA, InterPro BEN domain). BANP's BEN domain binds CGCG-containing DNA, as shown
      by crystal structures. It acts as a methylation-sensitive CpG-island-binding transcription factor.
      Accepted; the sequence-specific and activator terms are added as NEW.
    action: ACCEPT
    reason: '[file:human/BANP/BANP-uniprot.txt "DR   InterPro; IPR018379; BEN_domain."] [PMID:37086783
      "We then determined crystal structures of the BANP BEN domain in apo form and in complex with a
      CGCG-containing DNA, respectively, which revealed that the BANP BEN domain mainly used the electrostatic
      interactions to bind DNA with some base-specific interactions with the TC motifs."] [PMID:39225042
      "BANP and BEND3 preferentially bind DNA bearing unmethylated CpG motifs, and they function as CpG
      island-binding proteins."]'
    supported_by:
    - reference_id: file:human/BANP/BANP-uniprot.txt
      supporting_text: DR   InterPro; IPR018379; BEN_domain.
    - reference_id: PMID:37086783
      supporting_text: We then determined crystal structures of the BANP BEN domain in apo form and in
        complex with a CGCG-containing DNA, respectively, which revealed that the BANP BEN domain mainly
        used the electrostatic interactions to bind DNA with some base-specific interactions with the
        TC motifs.
    - reference_id: PMID:39225042
      supporting_text: BANP and BEND3 preferentially bind DNA bearing unmethylated CpG motifs, and they
        function as CpG island-binding proteins.
