id: Q8N9N5
gene_symbol: BANP
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: BANP (BTG3-associated nuclear protein; SMAR1) is a nuclear BEN-domain transcription factor.
  It binds the unmethylated CGCG element at CpG-island promoters, where it opens chromatin, phases nucleosomes
  and activates essential metabolic genes; methylation of the motif repels binding. Through matrix-attachment-region
  elements it can also repress specific targets by recruiting SIN3/HDAC1 corepressor complexes (cyclin
  D1, BAX and PUMA), and it modulates p53 activity. A pool in nuclear speckles brings HDAC6 to deacetylate
  SAM68 and so represses CD44 variable-exon inclusion. ERK phosphorylation exports BANP to the cytoplasm
  and relieves this repression.
