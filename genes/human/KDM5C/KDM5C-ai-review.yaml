id: P41229
gene_symbol: KDM5C
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'KDM5C/SMCX is an X-linked nuclear JARID1-family H3K4me2/me3 demethylase. It represses neuronal
  REST target genes as part of chromatin-modifying complexes containing REST, HDAC1/2 and G9a, and pathogenic
  KDM5C variants reduce demethylase or chromatin-binding functions in Claes-Jensen-type X-linked intellectual
  disability.'
