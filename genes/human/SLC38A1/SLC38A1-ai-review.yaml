core_functions:
- description: Na+-coupled (System A) symport of small neutral L-amino acids across the
    plasma membrane - electrogenic, pH-dependent, 1:1 Na+:amino acid cotransport,
    diagnostically inhibited by MeAIB.
  molecular_function:
    id: GO:0005295
    label: neutral L-amino acid:sodium symporter activity
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:10891391
    supporting_text: the cloned transporter mediates Na(+)-coupled transport of the
      system A-specific model substrate alpha-(methylamino)isobutyric acid. The
      transport process is saturable with a Michaelis-Menten constant of 0. 89 +/- 0.12
      mM. The Na(+):amino acid stoichiometry is 1:1
- description: Na+-coupled symport of L-glutamine across the plasma membrane, the
    physiologically prominent substrate - mediating glutamine influx into neurons and
    supplying glutamine as a precursor for glutamate/GABA synthesis.
  molecular_function:
    id: GO:0140902
    label: L-glutamine:sodium symporter activity
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: file:human/SLC38A1/SLC38A1-uniprot.txt
    record_section: ["CC:CATALYTIC ACTIVITY"]
    supporting_text: L-glutamine(in) + Na(+)(in) = L-glutamine(out) + Na(+)(out)
  - reference_id: PMID:15054072
    supporting_text: SNAT1 mediates glutamine (Gln) influx into neurons
proposed_new_terms: []
suggested_questions:
- question: Does SNAT1 primarily supply glutamine as a precursor for neuronal
    glutamate/GABA synthesis in vivo, or is its major role general neutral amino acid
    nutrition? The Melone 2004 localization study questioned the transmitter-pool
    replenishment hypothesis.
- question: What is the physiological significance of the extensive SNAT1
    phosphorylation (Ser25/28/49/52/56, Thr54) in its N-terminal cytoplasmic tail for
    transport regulation or trafficking?
suggested_experiments:
- description: Conditional neuronal and interneuron-specific Slc38a1 knockout with
    measurement of intracellular glutamine, glutamate and GABA pools and GABAergic
    synaptic transmission, to directly test the glutamine-precursor-supply hypothesis.
- description: Electrophysiological substrate-specificity and Na+-coupling kinetics of
    purified/reconstituted human SNAT1 across the full neutral amino acid range, to
    quantify substrate preferences beyond the model substrate MeAIB.
