id: Q9H2H9
gene_symbol: SLC38A1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SLC38A1 (SNAT1/ATA1) is a plasma-membrane, Na+-coupled System A neutral
  amino acid transporter of the SLC38 family. It catalyses electrogenic, pH-dependent
  symport (1:1 Na+:amino acid) of small short-chain neutral amino acids - glutamine,
  alanine, asparagine, serine, glycine, proline, histidine, methionine, cysteine and
  threonine - from the extracellular space into the cell, driven by the Na+
  electrochemical gradient, and is diagnostically inhibited by the non-metabolizable
  substrate analogue MeAIB. It is broadly expressed (placenta, heart, brain and other
  tissues) and is prominent in neurons, where it mediates glutamine influx into the
  somatodendritic compartment and supplies glutamine as a precursor for the glutamate
  and GABA pools; it also contributes to System A amino acid uptake in placental
  trophoblast and is present at the blood-brain barrier endothelium.
