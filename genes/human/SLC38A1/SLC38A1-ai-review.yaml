existing_annotations:
- term:
    id: GO:0001504
    label: neurotransmitter uptake
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-112313
  qualifier: involved_in
  review:
    summary: Reactome places SNAT1 in a glial neurotransmitter uptake/metabolism
      pathway, but SNAT1 imports the precursor glutamine, not neurotransmitters.
    action: MARK_AS_OVER_ANNOTATED
    reason: SNAT1 is a System A neutral amino acid symporter; glutamine (its principal
      neuronal substrate) is a metabolic precursor, not a neurotransmitter, and SNAT1
      does not take up glutamate or GABA. The glutamine it supplies feeds transmitter
      synthesis only indirectly, and direct localization work argues its major role is
      not transmitter-pool replenishment. "Neurotransmitter uptake" mis-frames the
      precursor-supply role.
    supported_by:
    - reference_id: PMID:15054072
      supporting_text: These findings suggest that the major function of SNAT1 is not
        to replenish the transmitter pools of Glu and GABA.
