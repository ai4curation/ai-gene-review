  label: Homo sapiens
description: ANKMY1 (ankyrin repeat and MYND domain-containing 1) is an uncharacterized protein of about
  940 residues with seven ankyrin repeats, three MORN repeats and a C-terminal MYND-type zinc finger.
  It was first cloned as a testis-specific ankyrin-like protein (TSAL1), and its expression is enhanced
  in testis. It was recovered as a candidate partner of thromboxane synthase in a single affinity-proteomics
  screen, but its location, partners and function have not been established.
