suggested_questions:
- question: Does the 59-amino-acid galanin message-associated peptide (GMAP) cleaved from human preprogalanin
    engage a dedicated cell-surface receptor in human tissues, or is its biological activity restricted
    to antimicrobial defense?
  experts:
  - Tomas Hokfelt
  - Barbara Kofler
  - Jae Young Seong
suggested_experiments:
- hypothesis: The temporal lobe epilepsy mutation p.A39E (Ala7Glu in mature human galanin) destabilizes
    the N-terminal alpha-helical conformation within the extracellular vestibule of GALR1 and GALR2, converting
    a full agonist into a receptor antagonist.
  description: Determine cryo-EM structures and perform molecular dynamics simulations of wild-type vs.
    Ala7Glu human galanin(1-30) bound to GALR1-Gi and GALR2-Gq complexes.
  experiment_type: Cryo-electron microscopy and G-protein BRET signaling assay
