    Protein Aggregation in Affected Brains.
  findings: []
- id: PMID:9402244
  title: Concomitant evaluation of plasma galanin and catecholamine levels during a cold pressor test
    in healthy human male and female subjects.
  findings:
  - statement: Galanin is localized in the central and peripheral nervous systems and adrenal medulla
      and circulates in human plasma.
    supporting_text: The neuropeptide galanin (GAL) is localized in the peripheral and central nervous
      systems as well as in the adrenal medulla where it coexists with catecholamines.
