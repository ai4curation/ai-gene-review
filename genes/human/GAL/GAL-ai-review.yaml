- term:
    id: GO:0007189
    label: adenylate cyclase-activating G protein-coupled receptor signaling pathway
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN008359337
  - UniProtKB:P22466
  review:
    summary: Tissue-specific adrenocortical adenylate cyclase/PKA-dependent GALR1 signaling branch stimulated
      by galanin.
    action: KEEP_AS_NON_CORE
    reason: Although GALR1 and GALR3 canonically couple to Gi/o (inhibiting adenylate cyclase) in neurons
      and GALR2 couples to Gq/11 (PMID:24602615), PMID:17982695 directly demonstrated that 10 nM galanin
      enhances cAMP production and cortisol secretion in dispersed human inner adrenocortical cells via
      GALR1, and that this response is suppressed by the adenylate cyclase inhibitor SQ-22536 and the
      PKA inhibitor H-89. Kept as non-core for this tissue-restricted adrenocortical signaling branch.
    supported_by:
    - reference_id: PMID:17982695
      supporting_text: Galanin (10(-8) M) and ACTH (10(-9) M) enhanced cyclic-AMP production from dispersed
        cells, and the response was suppressed by the adenylate cyclase inhibitor SQ-22536 (10(-4) M).
