- id: PMID:1370155
  title: Sequence of human galanin and its inhibition of glucose-stimulated insulin secretion from RIN
    cells.
  findings:
  - statement: Human galanin inhibits glucose-stimulated insulin secretion in a dose-dependent manner
      with sub-nanomolar potency.
    supporting_text: Human galanin inhibited glucose-stimulated insulin secretion in a dose-dependent
      manner in RIN cells. Human, porcine, and rat galanin exhibited similar activity with ED50 less than
      1 nM.
- id: PMID:1722333
  title: Isolation and primary structure of pituitary human galanin, a 30-residue nonamidated neuropeptide.
  findings:
  - statement: Native human pituitary galanin is a 30-amino-acid neuropeptide with a non-amidated C-terminal
      serine.
    supporting_text: Compared to the 29-residue porcine, rat, and bovine Gals, hGal uniquely comprises
      30 amino acids possessing an additional nonamidated serine residue as C terminus.
- id: PMID:17982695
  title: Galanin stimulates cortisol secretion from human adrenocortical cells through the activation
    of galanin receptor subtype 1 coupled to the adenylate cyclase-dependent signaling cascade.
  findings:
  - statement: Galanin enhances cyclic-AMP production and stimulates cortisol secretion from human inner
      adrenocortical cells via GALR1, sensitive to the adenylate cyclase inhibitor SQ-22536.
    supporting_text: Galanin (10(-8) M) and ACTH (10(-9) M) enhanced cyclic-AMP production from dispersed
      cells, and the response was suppressed by the adenylate cyclase inhibitor SQ-22536 (10(-4) M).
  - statement: Galanin stimulates cortisol secretion from human adrenocortical cells via GALR1.
    supporting_text: We conclude that galanin stimulates cortisol secretion from human inner adrenocortical
      cells, acting through GAL-R1 coupled to the adenylate cyclase/PKA-dependent signaling cascade via
      a Ptx-sensitive Galpha protein.
- id: PMID:22329353
  title: The neuropeptide galanin is a novel inhibitor of human hair growth.
  findings:
  - statement: Galanin inhibits proliferation of human hair matrix keratinocytes, shortens anagen, and
      reduces hair shaft elongation.
    supporting_text: Galanin reduced proliferation of hair matrix keratinocytes in situ compared with
      vehicle-treated controls, shortened the hair growth phase (anagen) in vitro and reduced hair shaft
      elongation.
- id: PMID:23415787
  title: Catecholaminergic system innervates galanin-immunoreactive neurons in the human diencephalon.
  findings:
  - statement: Light microscopic immunocytochemistry in the human diencephalon localized galanin immunoreactivity
      to hypothalamic neurons innervated by catecholaminergic fibers.
    supporting_text: Our studies show that among the three catecholamines, dopamine is the most abundant
      and the vast majority of catecholaminergic contacts on galanin-immunoreactive neurons is dopaminergic.
- id: PMID:23597562
  title: Inhibition of tumor angiogenesis and growth by a small-molecule multi-FGF receptor blocker with
    allosteric properties.
  findings: []
- id: PMID:24517231
  title: 'Coevolution of the spexin/galanin/kisspeptin family: Spexin activates galanin receptor type
    II and III.'
  findings:
  - statement: Ligand-receptor interaction studies show that galanin activates GALR1, GALR2, and GALR3,
      whereas spexin selectively activates GALR2 and GALR3.
    supporting_text: A ligand-receptor interaction study showed that SPXs activate human, Xenopus, and
      zebrafish GALR2/3 family receptors but not GALR1, suggesting that SPXs are natural ligands for GALR2/3.
      Particularly, SPXs exhibited much higher potency toward GALR3 than GAL.
- id: PMID:24602615
  title: Activation of galanin receptor 2 stimulates large conductance Ca(2+)-dependent K(+) (BK) channels
    through the IP3 pathway in human embryonic kidney (HEK293) cells.
  findings:
  - statement: Activation of human GALR2 by galanin elevates intracellular Ca2+ via ER Ca2+ efflux through
      IP3 receptors to open BK channels.
    supporting_text: Taken together, activation of GalR2 leads to elevation of intracellular Ca(2+) is
      due to Ca(2+) efflux from ER through IP3R sequentially opening BK channels.
