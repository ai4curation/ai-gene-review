  - UniProtKB:P22466
  review:
    summary: Core molecular function of mature human galanin as a secreted neuropeptide hormone.
    action: ACCEPT
    reason: Mature human galanin (30 residues) is a canonical neuropeptide hormone secreted by central
      and peripheral neurons and neuroendocrine cells to activate GALR1, GALR2, and GALR3 and inhibit
      glucose-stimulated insulin secretion (PMID:1722333, PMID:1370155, PMID:25691535).
    supported_by:
    - reference_id: PMID:1722333
      supporting_text: Compared to the 29-residue porcine, rat, and bovine Gals, hGal uniquely comprises
        30 amino acids possessing an additional nonamidated serine residue as C terminus.
    - reference_id: PMID:1370155
      supporting_text: Human galanin inhibited glucose-stimulated insulin secretion in a dose-dependent
        manner in RIN cells. Human, porcine, and rat galanin exhibited similar activity with ED50 less
        than 1 nM.
