- term:
    id: GO:0007189
    label: adenylate cyclase-activating G protein-coupled receptor signaling pathway
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN008359337
  - UniProtKB:P22466
  review:
    summary: Non-canonical adenylate cyclase-activating pathway annotation that should be replaced by
      galanin-activated signaling pathway and canonical adenylate cyclase-inhibiting GPCR signaling.
    action: MODIFY
    reason: Structural and pharmacological studies establish that GALR1 and GALR3 couple canonically to
      Gi/o (inhibiting adenylate cyclase, GO:0007193) and GALR2 couples to Gq/11 (activating phospholipase
      C, PMID:24602615); the PKA-sensitive cortisol release reported in adrenocortical cells (PMID:17982695)
      is indirect, so GO:0090663 (galanin-activated signaling pathway) and GO:0007193 are more accurate.
    proposed_replacement_terms:
    - id: GO:0090663
      label: galanin-activated signaling pathway
    - id: GO:0007193
      label: adenylate cyclase-inhibiting G protein-coupled receptor signaling pathway
    propagation_review:
      root_cause: SOURCE_BAD
      failure_modes:
      - REGULATORY_SIGN_INVERSION
      - SOURCE_EVIDENCE_WEAK
      source_entities:
      - source_id: UniProtKB:P22466
        source_label: GAL
        source_status: SOURCE_BAD
        comment: Seeded from an adrenocortical assay (PMID:17982695) where PKA-sensitive cortisol release
          is indirect; GALR1 and GALR3 couple canonically to Gi/o (inhibiting adenylate cyclase) and GALR2
          couples to Gq/11.
      residue_claims_not_applicable: Signaling pathway effector coupling sign correction (Gi/o and Gq/11
        vs. Gs) rather than a catalytic or binding residue divergence question.
