id: P22466
gene_symbol: GAL
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'Galanin peptides (GAL) encodes a 123-amino-acid preproprotein cleaved into the mature 30-amino-acid
  non-amidated human neuropeptide galanin (residues 33-62) and the 59-amino-acid galanin message-associated
  peptide (GMAP, residues 65-123). Synthesized in central and peripheral neurons as well as neuroendocrine
  and epidermal cells, mature galanin is stored in dense-core secretory granules and released into the
  extracellular space, where its conserved N-terminal pharmacophore (Gly1-Trp2-Thr3-Leu4-Asn5-Ser6-Ala7-Gly8-Tyr9-Leu10-Leu11-Gly12-Pro13)
  binds and activates all three class A G-protein-coupled galanin receptors: GALR1 (Gi/o-coupled), GALR2
  (Gq/11- and Gi/o-coupled), and GALR3 (Gi/o-coupled). Through galanin-activated receptor signaling, GAL
  modulates synaptic transmission, nociception, epileptiform excitability, neuroendocrine hormone secretion
  (including inhibition of glucose-stimulated insulin secretion and stimulation of adrenocortical cortisol
  release), and hair follicle cycling.'
