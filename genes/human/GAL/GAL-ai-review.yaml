- term:
    id: GO:0004966
    label: galanin receptor activity
  evidence_type: IMP
  original_reference_id: PMID:25691535
  qualifier: enables
  review:
    summary: 'Ligand-receptor role conflation: GAL encodes the secreted neuropeptide hormone ligand, not
      the transmembrane galanin receptor.'
    action: MODIFY
    reason: PMID:25691535 characterized a pathogenic temporal lobe epilepsy mutation (p.A39E) in the mature
      galanin peptide that alters its agonist/antagonist activity at GALR1 and GALR2. GAL is the extracellular
      peptide ligand (GO:0005184 neuropeptide hormone activity, GO:0031764 type 1 galanin receptor binding,
      GO:0031765 type 2 galanin receptor binding), not the receptor.
    proposed_replacement_terms:
    - id: GO:0005184
      label: neuropeptide hormone activity
    - id: GO:0031764
      label: type 1 galanin receptor binding
    - id: GO:0031765
      label: type 2 galanin receptor binding
    supported_by:
    - reference_id: PMID:25691535
      supporting_text: Functional analysis revealed that the p.A39E mutant showed antagonistic activity
        against galanin receptor 1 (GalR1)-mediated response, and decreased binding affinity and reduced
        agonist properties for GalR2.
