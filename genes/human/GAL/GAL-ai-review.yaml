  title: Galanin pathogenic mutations in temporal lobe epilepsy.
  findings:
  - statement: A pathogenic p.A39E mutation in human galanin causes temporal lobe epilepsy and alters
      agonist/antagonist signaling at GALR1 and GALR2.
    supporting_text: Functional analysis revealed that the p.A39E mutant showed antagonistic activity
      against galanin receptor 1 (GalR1)-mediated response, and decreased binding affinity and reduced
      agonist properties for GalR2.
