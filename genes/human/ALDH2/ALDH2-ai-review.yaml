- id: PMID:19506075
  title: Role of the general base Glu-268 in nitroglycerin bioactivation and superoxide
    formation by aldehyde dehydrogenase-2.
  findings:
  - statement: ALDH2 denitrates nitroglycerin to 1,2-glyceryl dinitrate and nitrite and
      also reduces it to NO; C302S abolishes all activities while E268Q leaves GTN
      denitration intact despite crippling dehydrogenase and esterase activity.
    supporting_text: Although the C302S mutation led to >90% loss of all enzyme
      activities, the E268Q mutant exhibited virtually unaffected rates of GTN denitration
      despite low dehydrogenase and esterase activities.
  - statement: The esterase activity runs through the same catalytic cysteine and general
      base as aldehyde oxidation, is stimulated but not required by NAD, and was measured
      on the artificial substrate p-nitrophenyl acetate.
    supporting_text: The esterase activity is stimulated by NAD, but the co-factor is not
      essential for the reaction, which is initiated by nucleophilic attack of the
      substrate by Cys-302, resulting in formation of a thioester and release of the
      corresponding alcohol by hydrolysis of the intermediate through activation of water
      by Glu-268
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached. Residue numbering is mature-protein (Cys302, Glu268),
      corresponding to Cys319 and Glu285 of the UniProt precursor. This is the source for
      the nitroglycerin, acetaldehyde and esterase rows.
