suggested_questions:
- question: GO obsoleted GO:0018547 nitroglycerin reductase activity on the grounds that
    there was no evidence the specific reaction exists, yet UniProt records two
    nitroglycerin reactions on ALDH2 with experimental evidence (RHEA:80159, RHEA:80155)
    and the thionitrate intermediate has been seen crystallographically. Should a
    nitrate-ester reductase term be created, and if not, is GO:0046857 the intended home
    for this chemistry?
  experts:
  - GO molecular function ontology editors
  - ALDH2 nitroglycerin pharmacology groups
- question: Is the NAD+-stimulated esterase activity of ALDH2 physiologically relevant,
    that is, is there a biological carboxylic ester that ALDH2 hydrolyses in the
    mitochondrial matrix, or is it only a consequence of the thioester mechanism probed
    with p-nitrophenyl acetate?
  experts:
  - ALDH enzymology groups
- question: Does human ALDH2 contribute measurably in vivo to the reactions currently
    annotated only by similarity to rodent ALDH2, namely succinate-semialdehyde and
    4-aminobutanal oxidation, given that ALDH5A1 and ALDH9A1 are the dedicated human
    enzymes?
  experts:
  - GABA and polyamine metabolism groups
suggested_experiments:
- hypothesis: The weak formaldehyde dehydrogenase activity of ALDH2 is a genuine second
    line of formaldehyde defence rather than incidental turnover, and its contribution
    scales with matrix formaldehyde load.
  description: Measure formaldehyde-derived formate production and DNA-damage markers in
    isogenic ADH5-null cells carrying wild-type, E504K or catalytically dead (C319A)
    ALDH2, with and without mitochondrially targeted formaldehyde generation, and
    determine formaldehyde kinetic constants on the purified enzyme.
  experiment_type: Genetic complementation plus enzyme kinetics
- hypothesis: The substrate-specific activities currently assigned to human ALDH2 only by
    similarity to rodent ALDH2, namely retinal, succinate semialdehyde and 4-aminobutanal
    oxidation, are negligible relative to the dedicated human enzymes.
  description: Determine kcat/KM of purified human ALDH2 for all-trans-retinal, succinate
    semialdehyde and 4-aminobutanal side by side with ALDH1A1, ALDH5A1 and ALDH9A1 under
    matched conditions, and report the ratios.
  experiment_type: Comparative steady-state enzymology
- hypothesis: ALDH2 is a physiological substrate of mitochondrial matrix quality control
    (LONP1 and CLPXP) once inactivated by its own aldehyde substrates, which would make
    the Reactome substrate rows a real regulatory mechanism rather than a bystander
    observation.
  description: Compare ALDH2 half-life and turnover in cells after 4-HNE or acrolein
    exposure in wild-type versus LONP1- and CLPP-depleted backgrounds, using pulse-chase
    and degradation assays on the mature matrix form.
  experiment_type: Protein turnover and degradation assay
