id: P05091
gene_symbol: ALDH2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  ALDH2 encodes the mitochondrial low-Km aldehyde dehydrogenase. Its 517-residue
  precursor is imported into mitochondria through a cleaved N-terminal transit peptide
  and the mature subunits assemble into a soluble homotetramer of the mitochondrial
  matrix. The enzyme uses the canonical ALDH chemistry, in which an active-site cysteine
  (Cys319 in precursor numbering, Cys302 in the mature numbering used in the enzymology
  literature) adds to the aldehyde carbon, hydride passes to NAD+, and the thioacyl
  intermediate is hydrolysed by water activated by a glutamate general base (Glu285
  precursor, Glu268 mature). Affinity for short-chain aldehydes is very high (KM for
  acetaldehyde about 0.02 uM), and oxidation of ethanol-derived acetaldehyde to acetate
  is the second and final step of ethanol degradation. The same active site handles
  reactive endogenous aldehydes: ALDH2 is the most catalytically efficient human isoform
  for the lipid-peroxidation products acrolein, 4-hydroxy-2-nonenal and malondialdehyde,
  it oxidises the dopamine-derived neurotoxin DOPAL to DOPAC, and it has weak but
  physiologically consequential activity on formaldehyde that acts as a second line of
  defence behind ADH5. Independently of aldehyde oxidation, the catalytic cysteine
  denitrates the vasodilator nitroglycerin to 1,2-glyceryl dinitrate plus nitrite and
  reduces it to nitric oxide, which is how the drug works. The common East Asian E504K
  substitution (ALDH2*2) nearly abolishes activity, causing acetaldehyde accumulation
  with alcohol-induced flushing and loss of nitroglycerin efficacy, and together with
  biallelic ADH5 loss of function it causes AMeD syndrome through failed formaldehyde
  clearance.
