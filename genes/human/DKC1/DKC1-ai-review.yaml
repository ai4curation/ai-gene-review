id: O60832
gene_symbol: DKC1
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Dyskerin is an RNA-binding pseudouridine synthase and a core protein of H/ACA ribonucleoprotein
  particles. Guide RNAs position RNA substrates for uridine isomerization during ribosomal and spliceosomal
  RNA maturation, and dyskerin-dependent pseudouridylation also occurs in human mRNAs. In telomerase,
  dyskerin binds and stabilizes the H/ACA region of telomerase RNA, enabling assembly and maintenance
  of the active enzyme while TERT carries out DNA synthesis. Dyskerin occupies nucleolar, nucleoplasmic
  and Cajal-body pools; a shorter natural product has reported cytoplasmic localization. Pathogenic DKC1
  variants cause X-linked dyskeratosis congenita, linking altered RNA biology to telomere dysfunction.
alternative_products:
- name: '1'
  id: O60832-1
  description: Canonical 514-residue dyskerin with the PUA RNA-binding domain and N- and C-terminal localization
    regions. The curated H/ACA catalytic and telomerase-RNP roles are associated with this product; the
    inspected endogenous-cell assays do not independently resolve all splice products.
- name: '3'
  id: O60832-2
  sequence_note: VSP_042422
  description: Natural 420-residue product named isoform 3. Residues 1–419 are shared with the canonical
    sequence, followed by Arg420; the canonical C-terminal localization region is absent. Cytoplasmic
    localization is reported for this variant. Retention of the catalytic residue and PUA domain does
    not establish equivalent enzyme activity or inactivity.
