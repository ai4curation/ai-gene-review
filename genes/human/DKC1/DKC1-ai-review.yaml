- id: Reactome:R-HSA-163090
  title: Elongation Of The Telomeric Chromosome End
  findings:
  - statement: The curated event adds nucleotides to the telomeric DNA end using the TERC template. Its
      bound telomerase input, output and catalytic complex contain DKC1 2–514; TERT supplies DNA synthesis,
      while dyskerin is an RNA-associated structural subunit.
- id: Reactome:R-HSA-163096
  title: Recruitment of Telomerase RNP to the Telomeric Chromosome End
  findings:
  - statement: The curated recruitment event connects free telomerase RNP to the chromosome-bound RNP.
      Both contain DKC1 2–514 in nucleoplasm; this does not establish a separate DKC1 DNA-recruitment
      activity.
- id: Reactome:R-HSA-163099
  title: Alignment Of The RNA Template On The Telomeric Chromosome End
  findings:
  - statement: The curated alignment event converts a telomere-associated telomerase RNP into a base-paired
      complex. Both contain DKC1 2–514 in nucleoplasm; RNA–DNA template alignment is a property of the
      complete RNP, not an autonomous dyskerin reaction.
- id: Reactome:R-HSA-163120
  title: Disassociation of Telomerase RNP and the Chromosome End
  findings:
  - statement: The curated event releases telomerase RNP from an extended chromosome end. DKC1 2–514 occurs
      in both bound input and released RNP in nucleoplasm; membership does not make dyskerin an independent
      dissociation enzyme.
- id: Reactome:R-HSA-164616
  title: Biogenesis and assembly of the telomerase RNP
  findings:
  - statement: The curated assembly event includes DKC1 2–514 as an input and a component of the assembled
      telomerase RNP. H/ACA binding supports TERC accumulation and RNP assembly; the source also describes
      nuclear trafficking without assigning every assembly step to one exclusive subcompartment.
- id: Reactome:R-HSA-164617
  title: Elongation of Extended Telomeric Chromosome End
  findings:
  - statement: The curated subsequent-extension event contains DKC1 2–514 in chromosome-bound telomerase
      input, product and catalytic complexes in nucleoplasm. This is continued RNP membership; TERT, not
      dyskerin, performs nucleotide polymerization.
- id: Reactome:R-HSA-164620
  title: Translocation Of Telomerase RNP And Alignment Of RNA Template (TERC) To Extended Single Stranded
    Telomeric Chromosome-End
  findings:
  - statement: The curated translocation event connects an extended telomere-associated RNP to the next
      base-paired state. Both contain DKC1 2–514 in nucleoplasm; the model does not assign an autonomous
      motor or translocase activity to dyskerin.
- id: Reactome:R-HSA-6790905
  title: Box H/ACA snoRNP transforms uridine to pseudouridine in pre-rRNA
  findings:
  - statement: The curated event converts uridine to pseudouridine in pre-rRNA using an H/ACA guide RNA.
      Its catalytic physical entity contains DKC1 2–514 and is modeled in nucleoplasm; that curated compartment
      is retained without excluding the independently supported nucleolar pool.
- id: Reactome:R-HSA-9671145
  title: DKC1 binds SHQ1
  findings:
  - statement: The curated binding event takes DKC1 2–514 as input and produces a DKC1:SHQ1 complex in
      nucleoplasm. SHQ1 binding controls stepwise H/ACA/telomerase assembly and does not imply that SHQ1
      is a permanent mature telomerase subunit.
