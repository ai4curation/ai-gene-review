  qualifier: contributes_to
  review:
    summary: Dyskerin contributes to an active telomerase ribonucleoprotein.
    action: ACCEPT
    reason: This source explicitly makes the weaker contributes_to assertion. Human HeLa dyskerin immunoprecipitates
