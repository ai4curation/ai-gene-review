    id: GO:0003720
    label: telomerase activity
  evidence_type: IDA
  original_reference_id: PMID:12135483
  qualifier: enables
  review:
    summary: Dyskerin supports telomerase but is not its reverse-transcriptase catalyst.
    action: MARK_AS_OVER_ANNOTATED
    reason: GO:0003720 describes RNA-templated DNA polymerization. PMID:12135483 reports dyskerin as a
      telomerase component and an antisense-dependent change in whole-cell telomerase activity; its full
      experimental text was unavailable. Independent human holoenzyme structural evidence establishes
      the H/ACA RNA-stabilizing contribution of dyskerin, whereas TERT performs DNA synthesis. The autonomous
      molecular-activity assertion therefore exceeds the established subunit role. Preserve the positive
      experiment and the separately accepted contributes_to assertion; this is not a claim of a wrong
      protein or absent telomerase contribution.
    supported_by:
    - reference_id: PMID:12135483
    - reference_id: PMID:29695869
