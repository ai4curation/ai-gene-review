suggested_questions:
- question: Does the 420-residue cytoplasmic product retain catalytic activity or assemble with distinct
    RNA/protein partners under endogenous expression?
- question: Which DKC1-specific supplemental observations establish scaRNA and TCAB1-protein localization
    effects beyond the documented TERC-stability phenotype?
- question: Which human mRNA sites are directly modified by dyskerin-containing RNPs, and which guide
    RNAs and cellular pools specify those sites?
- question: Does the curated 5S-rRNA reaction description reflect direct DKC1 substrate evidence, or should
    the reaction context remain rRNA-general?
suggested_experiments:
- description: Compare purified, sequence-verified 514- and 420-residue products in matched H/ACA RNP
    reconstitution assays, measuring RNA binding and site-specific pseudouridine formation separately.
  hypothesis: Loss of the canonical C terminus changes localization and assembly without necessarily abolishing
    the retained catalytic domain.
- description: Use endogenous isoform-resolved tagging with RNA-protein crosslinking and site-resolved
    pseudouridine mapping to connect cytoplasmic and nuclear DKC1 pools to actual RNA substrates.
  hypothesis: Distinct dyskerin pools differ in RNA recruitment rather than simply in catalytic-domain
    presence.
status: DRAFT
