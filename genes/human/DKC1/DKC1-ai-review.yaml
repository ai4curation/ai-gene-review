    label: enzyme-directed rRNA pseudouridine synthesis
  evidence_type: IMP
  original_reference_id: PMID:25219674
  qualifier: involved_in
  review:
    summary: Dyskerin-dependent rRNA pseudouridylation uses the H/ACA guide-RNA mechanism.
    action: MODIFY
    reason: GO:0000455 specifically requires site selection without a guide RNA. PMID:25219674 distinguishes
      H/ACA-guided Cbf5/dyskerin from stand-alone PUS enzymes. Its human HEK293 DKC1 knockdown reduces
      rRNA pseudouridylation, and patient fibroblasts show smaller reductions; these are cellular modification
      measurements rather than purified guide-independent catalysis. The established H/ACA mechanism therefore
      supports GO:0000454. The original IMP source and relationship remain unchanged.
    proposed_replacement_terms:
    - id: GO:0000454
      label: snoRNA guided rRNA pseudouridine synthesis
    supported_by:
