  - reference_id: PMID:25219674
    supporting_text: significant complementarity to human snoRNAs
  - reference_id: PMID:15962000
  - reference_id: PMID:19179534
- description: Binds the H/ACA region of telomerase RNA and organizes its protein contacts, supporting
    RNA accumulation and assembly of active telomerase. This structural contribution supports telomere
    maintenance; TERT performs DNA synthesis.
  molecular_function:
