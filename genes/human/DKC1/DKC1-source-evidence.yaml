  event_findings:
  - reference_id: Reactome:R-HSA-163090
    url: https://reactome.org/content/detail/R-HSA-163090
    finding: The curated event adds nucleotides to the telomeric DNA end using the TERC template. Its
      bound telomerase input, output and catalytic complex contain DKC1 2–514; TERT supplies DNA synthesis,
      while dyskerin is an RNA-associated structural subunit.
  - reference_id: Reactome:R-HSA-163096
    url: https://reactome.org/content/detail/R-HSA-163096
    finding: The curated recruitment event connects free telomerase RNP to the chromosome-bound RNP. Both
      contain DKC1 2–514 in nucleoplasm; this does not establish a separate DKC1 DNA-recruitment activity.
  - reference_id: Reactome:R-HSA-163099
    url: https://reactome.org/content/detail/R-HSA-163099
    finding: The curated alignment event converts a telomere-associated telomerase RNP into a base-paired
      complex. Both contain DKC1 2–514 in nucleoplasm; RNA–DNA template alignment is a property of the
      complete RNP, not an autonomous dyskerin reaction.
  - reference_id: Reactome:R-HSA-163120
    url: https://reactome.org/content/detail/R-HSA-163120
    finding: The curated event releases telomerase RNP from an extended chromosome end. DKC1 2–514 occurs
      in both bound input and released RNP in nucleoplasm; membership does not make dyskerin an independent
      dissociation enzyme.
  - reference_id: Reactome:R-HSA-164616
    url: https://reactome.org/content/detail/R-HSA-164616
    finding: The curated assembly event includes DKC1 2–514 as an input and a component of the assembled
      telomerase RNP. H/ACA binding supports TERC accumulation and RNP assembly; the source also describes
      nuclear trafficking without assigning every assembly step to one exclusive subcompartment.
  - reference_id: Reactome:R-HSA-164617
    url: https://reactome.org/content/detail/R-HSA-164617
    finding: The curated subsequent-extension event contains DKC1 2–514 in chromosome-bound telomerase
      input, product and catalytic complexes in nucleoplasm. This is continued RNP membership; TERT, not
      dyskerin, performs nucleotide polymerization.
  - reference_id: Reactome:R-HSA-164620
    url: https://reactome.org/content/detail/R-HSA-164620
    finding: The curated translocation event connects an extended telomere-associated RNP to the next
      base-paired state. Both contain DKC1 2–514 in nucleoplasm; the model does not assign an autonomous
      motor or translocase activity to dyskerin.
  - reference_id: Reactome:R-HSA-6790905
    url: https://reactome.org/content/detail/R-HSA-6790905
    finding: The curated event converts uridine to pseudouridine in pre-rRNA using an H/ACA guide RNA.
      Its catalytic physical entity contains DKC1 2–514 and is modeled in nucleoplasm; that curated compartment
      is retained without excluding the independently supported nucleolar pool.
  - reference_id: Reactome:R-HSA-9671145
    url: https://reactome.org/content/detail/R-HSA-9671145
    finding: The curated binding event takes DKC1 2–514 as input and produces a DKC1:SHQ1 complex in nucleoplasm.
      SHQ1 binding controls stepwise H/ACA/telomerase assembly and does not imply that SHQ1 is a permanent
      mature telomerase subunit.
