gene: DKC1
uniprot: https://www.uniprot.org/uniprotkb/O60832/entry
scope: Authored evidence guide; raw publication/protein/GOA caches are unchanged. Scientific source limitations
  are distinguished from normal-cache availability flags.
products:
- name: '1'
  id: O60832-1
  description: Canonical 514-residue dyskerin with the PUA RNA-binding domain and N- and C-terminal localization
    regions. The curated H/ACA catalytic and telomerase-RNP roles are associated with this product; the
    inspected endogenous-cell assays do not independently resolve all splice products.
- name: '3'
  id: O60832-2
  sequence_note: VSP_042422
  description: Natural 420-residue product named isoform 3. Residues 1–419 are shared with the canonical
    sequence, followed by Arg420; the canonical C-terminal localization region is absent. Cytoplasmic
    localization is reported for this variant. Retention of the catalytic residue and PUA domain does
    not establish equivalent enzyme activity or inactivity.
mechanistic_units:
- function: H/ACA-associated pseudouridylation
  scope: One chemistry across RNA classes. The displayed nucleolar snoRNP is one established context;
    snRNA scaRNP activity and Cajal bodies are a separate context of the same catalytic protein. The mRNA
    observations do not localize every reaction to nucleolus or Cajal body.
- function: Telomerase RNA binding/stabilization and structural contribution
  scope: TERT performs reverse transcription. Whole-holoenzyme and H/ACA-subcomplex memberships are complementary
    levels of description, not independent DKC1 polymerase activities. Core location nucleoplasm includes
    the supported Cajal-body trafficking pool because Cajal body is part_of nucleoplasm. Neither adding
    the nested child merely to repeat accepted CC terms nor replacing the broader pool with Cajal body
    alone is warranted; the RNA-binding/stabilization function is not restricted to one nuclear body.
