existing_annotations:
- term:
    id: GO:0005111
    label: type 2 fibroblast growth factor receptor binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN002608278
  - RGD:61805
  review:
    summary: FGF7 is a selective ligand of the epithelial IIIb splice isoform of FGFR2 (the KGF receptor);
      type 2 FGF receptor binding is the precise, phylogenetically placed description of its receptor-binding
      activity.
    action: ACCEPT
    reason: The PAINT node for the FGF7/FGF10 subfamily places FGFR2 binding at the right specificity.
      Direct binding data show KGFR (FGFR2 IIIb) is a high-affinity FGF7 receptor while the IIIc isoform
      does not bind it. This is the core molecular function.
    additional_reference_ids:
    - PMID:16597617
    - PMID:8663044
    supported_by:
    - &id001
      reference_id: PMID:1309608
      supporting_text: Binding assays demonstrated that the KGFR was a high-affinity receptor for both
        KGF and acidic FGF, while FGFR-2 showed high affinity for basic and acidic FGF but no detectable
        binding by KGF.
    - reference_id: file:human/FGF7/FGF7-uniprot.txt
      supporting_text: Interacts with FGFR2.
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:1309608
  qualifier: enables
  supporting_entities:
  - UniProtKB:P21802-3
  review:
    summary: Binding assays identified FGF7 (KGF) as a high-affinity ligand of the FGFR2 IIIb isoform
      (KGFR, P21802-3), which is what the IntAct IPI row records.
    action: MODIFY
    reason: Generic protein binding is uninformative. The interacting partner is the FGFR2 IIIb receptor,
      so the informative term is type 2 fibroblast growth factor receptor binding (GO:0005111). The interaction
      itself is well supported.
    proposed_replacement_terms:
    - id: GO:0005111
      label: type 2 fibroblast growth factor receptor binding
    supported_by:
    - *id001
    - reference_id: PMID:1309608
      supporting_text: The KGFR transcript was specific to epithelial cells
