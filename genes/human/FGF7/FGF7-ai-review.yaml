- question: Does PMID:11023837 genuinely support FGF7 in mesenchymal cell proliferation, or was the UniProt
    IDA attached to a mis-entered PMID?
- question: Which FGF7 functions in human epithelia are non-redundant with FGF10 and FGF22, given the
    mild phenotype of Fgf7-null mice?
- question: Is the synaptogenic role of FGF7 at inhibitory hippocampal synapses conserved in human brain,
    and which receptor isoform mediates it presynaptically?
- question: Should the GO FGF-family PAINT node for cytoplasm (PTN000160075) be restricted so it does
    not propagate to classically secreted, signal-peptide-bearing FGFs such as FGF7?
suggested_experiments:
- description: Measure FGF7 binding kinetics and signalling (pFRS2, pERK) across FGFR1-4 IIIb/IIIc isoforms
    with defined heparan sulfate oligosaccharides and FGFBP1, in isogenic cell backgrounds.
  experiment_type: biochemistry/quantitative signaling
  hypothesis: FGF7 selectivity for FGFR2b is absolute at physiological concentrations and is tuned by
    heparan sulfate structure and FGFBP1.
- description: Knock out FGF7 in human stromal fibroblasts co-cultured with keratinocyte or airway epithelial
    organoids, with and without FGF10 knockout, and quantify epithelial proliferation, migration and barrier
    repair after injury.
  experiment_type: genome editing/organoid co-culture
  hypothesis: Stromal FGF7 is required for maximal epithelial repair responses but is partially compensated
    by FGF10.
