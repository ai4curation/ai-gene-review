  review:
    summary: FGF7 has a cleaved N-terminal signal peptide and is secreted by mesenchymal/stromal cells
      to act on neighbouring epithelia; the extracellular region is where it binds heparan sulfate and
      FGFR2b.
    action: ACCEPT
    reason: Consistent with the family-level PAINT placement for canonical secreted FGFs and with direct
      purification of KGF from fibroblast conditioned medium.
    supported_by:
    - &id002
      reference_id: file:human/FGF7/FGF7-uniprot.txt
      supporting_text: 'SUBCELLULAR LOCATION: Secreted.'
    - reference_id: PMID:2915979
      supporting_text: A growth factor specific for epithelial cells was identified in conditioned medium
        of a human embryonic lung fibroblast cell line.
