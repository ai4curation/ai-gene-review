id: P21781
gene_symbol: FGF7
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: FGF7, also called keratinocyte growth factor (KGF), is a secreted, heparin-binding member
  of the fibroblast growth factor family (FGF7 subfamily with FGF3, FGF10 and FGF22). It is produced mainly
  by mesenchymal and stromal cells such as fibroblasts and acts in a paracrine manner on neighbouring
  epithelial cells. FGF7 binds with high selectivity to the epithelial IIIb splice isoform of FGFR2 (the
  KGF receptor), in complexes stabilized by heparan sulfate, triggering receptor tyrosine kinase activation
  and downstream RAS-MAPK, PI3K-AKT and PLC-gamma signalling. Its principal biological role is as a mitogen,
  survival and motility factor for epithelial cells, including epidermal keratinocytes, lung alveolar
  and airway epithelium and embryonic pancreatic epithelium, contributing to epithelial development, homeostasis
  and re-epithelialization after injury. In the mouse hippocampus, FGF7 released from pyramidal neuron
  dendrites also acts as a target-derived organizer of inhibitory presynaptic terminals. A truncated recombinant
  form (palifermin) is used clinically to protect oral mucosa during cytotoxic cancer therapy.
