        comment: FGF family root node; spans intracellular FGF homologous factors and signal-peptide-less
          FGF1/FGF2 as well as classically secreted paracrine FGFs.
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
      - source_id: UniProtKB:Q92913
        comment: FGF13, an intracellular FGF homologous factor; cytoplasmic activity does not transfer
          to secreted FGF7.
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
