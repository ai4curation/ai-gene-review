    summary: Propagated from the FGF-family root node (PTN000160075), whose cytoplasmic activity reflects
      intracellular FGFs and the non-signal-peptide FGF1/FGF2 rather than classically secreted ligands.
    action: REMOVE
    reason: FGF7 carries a cleaved signal peptide (residues 1-31), is secreted, and exerts its activity
      extracellularly on FGFR2b. There is no experimental evidence for a cytoplasmic site of action for
      human or mouse FGF7 (the mouse Fgf7 GO record has no experimental cytoplasm annotation). The node
      placement over-propagates an intracellular property of other clades to a secreted paracrine ligand.
    supported_by:
