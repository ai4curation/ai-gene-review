- term:
    id: GO:0036148
    label: phosphatidylglycerol acyl-chain remodeling
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-1482925
  qualifier: involved_in
  review:
    summary: Phosphatidylglycerol remodeling is retained as a position-dependent, non-core activity.
    action: KEEP_AS_NON_CORE
    reason: PMID:18458083 reported human LPCAT4 activity toward LPG without resolving the glycerol position, consistent with acylation
      of 1-acyl LPG at free sn-2. PMID:41740885 directly found no activity toward sn-2-dominant 2-acyl LPG at free sn-1. PG remodeling
      is therefore retained as a position-dependent non-core process rather than an unqualified activity across LPG isomers.
    additional_reference_ids:
    - PMID:18458083
    - PMID:41740885
