- id: PMID:38226852
  title: Overexpression of lysophospholipid acyltransferase, LPLAT10/LPCAT4/LPEAT2, in the mouse liver increases glucose-stimulated insulin secretion.
  full_text_unavailable: true
  findings:
  - statement: Liver-specific LPLAT10 overexpression in mice increased hepatic and serum PC 40:7 containing C18:1 and C22:6.
    supporting_text: Hepatic and serum levels of phosphatidylcholine 40:7, containing C18:1 and C22:6, were increased in Ad-LPLAT10-treated mice.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: This mouse gain-of-function intervention increased glucose-stimulated insulin secretion and suppressed postprandial hyperglycemia.
    supporting_text: Postprandial hyperglycemia was suppressed by the induction of glucose-stimulated insulin secretion in Ad-LPLAT10-treated mice compared with that in control Ad vector-treated mice.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Verified mouse liver overexpression study; useful physiological context but not evidence for an endogenous human hepatic role because normal liver expression was reported to be low.
- id: PMID:37294538
  title: Pan-cancer analysis identifies LPCATs family as a prognostic biomarker and validation of LPCAT4/WNT/β-catenin/c-JUN/ACSL3 in hepatocellular carcinoma.
  findings:
  - statement: In hepatocellular carcinoma models, LPCAT4 promoted cell growth and cholesterol biosynthesis through increased ACSL3 expression.
    supporting_text: LPCAT4 enhanced cell growth and cholesterol biosynthesis by up-regulating ACSL3 in hepatocellular carcinoma (HCC).
    reference_section_type: ABSTRACT
  - statement: The reported LPCAT4-to-ACSL3 regulation was mediated by WNT/β-catenin/c-JUN signaling in the studied HCC context.
    supporting_text: WNT/β-catenin/c-JUN signaling pathway mediated LPCAT4's regulation on ACSL3.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full-text HCC study with experimental cell-model validation, embedded in a pan-cancer association analysis. It supports a disease-context growth/ACSL3 axis, not LPCAT4's core catalytic specificity or a general physiological role.
