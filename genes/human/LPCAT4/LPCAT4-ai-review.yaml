    supporting_text: The AGPAT7 cDNA is 1898 bp in length, encoding a putative protein with 524 amino acid residues, which contains an acyltransferase domain in 123-234 aa.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: The overexpressed protein localized mainly to the ER in HeLa cells.
    supporting_text: AGPAT7 protein was mainly localized to the endoplasmic reticulum (ER) in Hela cells.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
