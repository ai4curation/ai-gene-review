id: Q643R3
gene_symbol: LPCAT4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  LPCAT4, also called LPEAT2 or LPLAT10, is an integral endoplasmic-reticulum
  membrane lysophospholipid acyltransferase that reacylates lysophospholipids in
  phospholipid remodeling. Human-enzyme assays establish activity toward
  lysophosphatidylcholine, lysophosphatidylethanolamine, and
  lysophosphatidylserine, with particularly prominent LPE acylation in the original
  study. Position-resolved assays show that LPCAT4 can acylate sn-2
  lysophospholipids selectively at the sn-1 position and favors unsaturated
  fatty-acyl-CoA donors. Oleoyl- and docosahexaenoyl-CoA are effective donors,
  while palmitoyl- and stearoyl-CoA also support activity. These
  activities remodel phosphatidylcholine, phosphatidylethanolamine, and
  phosphatidylserine and generate minor phospholipid species bearing an unsaturated
  fatty acid at sn-1. The older assay supports acylation of 1-acyl LPG at its free
  sn-2 position, whereas position-resolved assays found no activity toward 2-acyl
  LPG at its free sn-1 position. Thus phosphatidylglycerol remodeling depends on
  acceptor position. Despite the historical name
  AGPAT7 and membership in an acyltransferase family, direct studies found no
  appreciable activity toward lysophosphatidic acid or glycerol 3-phosphate;
  LPCAT4 is therefore not supported as a lysophosphatidic-acid acyltransferase or
  phosphatidic-acid biosynthetic enzyme. Lplat10-deficient mouse brain loses
  phospholipids with unsaturated sn-1 chains, providing in-vivo support for the
  remodeling chemistry while leaving the functions of these minor lipids unresolved
  in humans. Mouse liver overexpression effects on insulin secretion and an
  LPCAT4-WNT-beta-catenin-c-JUN-ACSL3 axis reported in hepatocellular carcinoma are
  context-specific outcomes rather than additional core catalytic activities. No
  functionally distinct protein isoforms or stable LPCAT4-containing complex has
  been established.
