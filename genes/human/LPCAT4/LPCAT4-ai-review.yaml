- id: PMID:18458083
  title: Molecular identification of a novel mammalian brain isoform of acyl-CoA:lysophospholipid
    acyltransferase with prominent ethanolamine lysophospholipid acylating activity,
    LPEAT2.
  full_text_unavailable: true
  findings:
  - statement: Heterologous expression of LPEAT2/LPCAT4 strongly increased LPEAT activity.
    supporting_text: Ectopic expression of LPEAT2 in mammalian HEK293T cells led to a dramatic increase (up to 9-fold) in LPEAT activity
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: The enzyme accepts several lysophospholipid headgroups but not glycerol-3-phosphate, LPA, LPI, or DAG in the reported assays.
    supporting_text: >-
      LPEAT2 also exhibited significant acyl-CoA-dependent acyltransferase
      activity toward 1-O-alkenyl-lysophosphatidylethanolamine,
      lysophosphatidylglycerol, 1-O-alkyl-lysophosphatidylcholine,
      lysophosphatidylserine, and lysophosphatidylcholine but lacked appreciable
      acylating activity toward glycerol 3-phosphate, lysophosphatidic acid,
      lysophosphatidylinositol, and diacylglycerol
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: LPCAT4/LPEAT2 uses a broad range of medium- and long-chain acyl-CoAs.
    supporting_text: LPEAT2 recognizes a broad range of medium and long chain fatty acyl-CoA
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: Overexpressed LPEAT2 localized to the endoplasmic reticulum.
    supporting_text: When overexpressed in mammalian cells, LPEAT2 is localized to the endoplasmic reticulum.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Defining human-cell enzymology study for substrate breadth, negative LPA activity, ER localization, and brain-enriched expression; abstract verified.
- id: PMID:19946888
  title: Defining the membrane proteome of NK cells.
  full_text_unavailable: true
  findings: []
  reference_review:
    relevance: LOW
    correctness: UNVERIFIED
    review_notes: The cached abstract describes a global YTS NK-cell membrane proteome but does not name LPCAT4; defer to the curator/dataset for the protein-specific identification.
- id: PMID:41740885
  title: LPLAT10/LPEAT2 produces atypical phospholipids with an unsaturated FA at
    the sn-1 position.
  findings:
  - statement: LPLAT10/LPEAT2/LPCAT4 generates phospholipids bearing unsaturated fatty acids at sn-1.
    supporting_text: Here, we report that LPLAT10 (also known as LPEAT2 or LPCAT4) is a lysophospholipid acyltransferase responsible for generating PLs with an unsaturated FA at the sn-1 position.
    reference_section_type: ABSTRACT
  - statement: It acylates LPC, LPE, and LPS selectively at sn-1 using saturated or unsaturated acyl-CoAs.
    supporting_text: In vitro, LPLAT10 incorporated both saturated and unsaturated FAs into lysophosphatidylcholine, lysophosphatidylethanolamine, and lysophosphatidylserine, selectively at the sn-1 position.
    reference_section_type: ABSTRACT
  - statement: LPLAT10 has relatively higher affinity for unsaturated fatty acyl-CoAs.
    supporting_text: LPLAT10 appeared to have a relatively higher affinity for unsaturated FA-CoAs.
    reference_section_type: ABSTRACT
  - statement: Position-resolved assays found no LPCAT4 activity toward 2-acyl LPG with a free sn-1 position.
    supporting_text: LPLAT10 did not act on sn-2 dominant LPI, LPG, and LPA
    reference_section_type: RESULTS
  - statement: Loss of Lplat10 selectively depleted brain phospholipids with unsaturated sn-1 chains in mice.
    supporting_text: >-
      Consistently, only PLs with unsaturated FAs such as oleic acid (C18:1),
      linoleic acid (C18:2), arachidonic acid (C20:4), and DHA (C22:6) at the sn-1
      position decreased in the brain from Lplat10-deficient mice.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full-text biochemical and knockout-lipidomics study that resolves sn-position and acyl-chain specificity; includes human LPLAT10 assays and mouse in-vivo validation.
- id: PMID:16243729
  title: Cloning and characterization a novel human 1-acyl-sn-glycerol-3-phosphate acyltransferase gene AGPAT7.
  full_text_unavailable: true
