core_functions:
- description: >-
    Reacylates lysophospholipids at the endoplasmic-reticulum membrane to remodel
    phosphatidylcholine, phosphatidylethanolamine, and phosphatidylserine. Human
    LPCAT4 accepts LPC, LPE, and LPS, with prominent LPE activity in the original
    study; position-resolved assays show preferential use of sn-2 lysophospholipid
    acceptors and incorporation at the sn-1 position. It accepts medium- and
    long-chain acyl-CoAs and has relatively higher affinity for unsaturated donors,
    thereby generating phospholipids with unsaturated sn-1 chains. The older LPG
    result supports acylation of 1-acyl LPG at free sn-2, whereas position-resolved
    assays reject 2-acyl LPG acylation at free sn-1; PG remodeling is therefore not
    included as an unqualified core process. Direct assays in both defining studies found no appreciable LPA
    acylation, excluding historical AGPAT7/LPAAT and phosphatidic-acid synthesis
    assignments from the core function.
  molecular_function:
    id: GO:0071617
    label: lysophospholipid acyltransferase activity
  directly_involved_in:
  - id: GO:0036151
    label: phosphatidylcholine acyl-chain remodeling
  - id: GO:0036152
    label: phosphatidylethanolamine acyl-chain remodeling
  - id: GO:0036150
    label: phosphatidylserine acyl-chain remodeling
  locations:
  - id: GO:0005789
    label: endoplasmic reticulum membrane
  supported_by:
  - reference_id: PMID:18458083
    supporting_text: >-
      Ectopic expression of LPEAT2 in mammalian HEK293T cells led to a dramatic
      increase (up to 9-fold) in LPEAT activity
  - reference_id: PMID:18458083
    supporting_text: >-
      LPEAT2 also exhibited significant acyl-CoA-dependent acyltransferase
      activity toward 1-O-alkenyl-lysophosphatidylethanolamine,
      lysophosphatidylglycerol, 1-O-alkyl-lysophosphatidylcholine,
      lysophosphatidylserine, and lysophosphatidylcholine but lacked appreciable
      acylating activity toward glycerol 3-phosphate, lysophosphatidic acid,
      lysophosphatidylinositol, and diacylglycerol
  - reference_id: PMID:41740885
    supporting_text: >-
      In vitro, LPLAT10 incorporated both saturated and unsaturated FAs into
      lysophosphatidylcholine, lysophosphatidylethanolamine, and
      lysophosphatidylserine, selectively at the sn-1 position.
knowledge_gaps:
- gap_statement: >-
    The endogenous acceptor and acyl-CoA usage of human LPCAT4 is not quantitatively
    resolved across native tissues and cell types.
  boundary: >-
    Heterologous human-enzyme assays support LPC, LPE, and LPS reacylation and favor
    sn-2 acceptors and unsaturated acyl-CoAs. The in-vivo positional lipidomic
    validation is from mouse brain, so substrate flux and donor competition in
    endogenous human cells remain uncertain.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    Native substrate competition determines which PC, PE, and PS species LPCAT4
    actually produces and whether the prominent LPE activity observed in one assay
    dominates physiologically.
  resolution: >-
    Use isotope-resolved flux lipidomics after endogenous LPCAT4 knockout and
    genomic rescue in human neuronal and non-neuronal cells, quantifying positional
    LPC, LPE, and LPS acceptors together with saturated and unsaturated acyl-CoAs.
- gap_statement: >-
    The physiological extent of LPCAT4-dependent 1-acyl LPG acylation and
    phosphatidylglycerol remodeling is unresolved.
  boundary: >-
    PMID:18458083 detected LPG activity without resolving acceptor position,
    consistent with acylation of 1-acyl LPG at free sn-2. PMID:41740885 found no
    activity toward 2-acyl LPG at free sn-1. Both studies agree on LPC, LPE, and
    LPS substrates and on absence of LPA acylation.
  gap_kind:
  - BIOLOGY
  - CURATION
  status: OPEN
  significance: >-
    Establishing endogenous 1-acyl LPG flux is necessary before PG remodeling can
    be treated as a physiological LPCAT4 process; the 2-acyl LPG reaction is already
    contradicted by position-resolved evidence.
  resolution: >-
    Quantify 1-acyl and 2-acyl LPG separately using purified or matched membrane
    preparations and endogenous knockout/rescue, with position-resolved products,
    catalytic-dead controls, and orthogonal mass-spectrometric confirmation.
- gap_statement: >-
    The biological roles of LPCAT4-generated phospholipids carrying unsaturated
    fatty acids at sn-1 are unknown in human cells.
  boundary: >-
    Lplat10-deficient mouse brain selectively loses sn-1-unsaturated PC, PE, and PS
    species, but the knockout showed no overt cerebellar histological abnormality
    and the functional consequences of these low-abundance lipids remain unclear.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: >-
    These products may alter membrane physical properties, neuronal signaling, or
    lipid-mediated communication despite their low abundance.
  resolution: >-
    Engineer human neuronal models with catalytic LPCAT4 loss and rescue, restore
    selected positional lipid species independently, and measure membrane order,
    organelle dynamics, electrophysiology, and stress responses alongside positional
    lipidomics.
- gap_statement: >-
    The membrane orientation and structure-based determinants of LPCAT4 acceptor
    position, phospholipid headgroup, and acyl-CoA selectivity are not established.
  boundary: >-
    LPCAT4 is an integral ER-membrane enzyme with two predicted transmembrane helices,
    but the reviewed primary studies do not resolve its topology, active-site
    orientation, or substrate-entry routes.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: >-
    A mechanistic model is needed to explain sn-1 selectivity, preference for
    unsaturated donors, and the position-dependent LPG result.
  resolution: >-
    Determine membrane topology experimentally and solve LPCAT4 structures with
    acyl-CoA and position-defined lysophospholipid analogs, followed by endogenous
    mutational rescue and comprehensive substrate profiling.
- gap_statement: >-
    The physiological relevance of reported liver-endocrine and
    hepatocellular-carcinoma phenotypes to endogenous human LPCAT4 activity remains
    uncertain.
  boundary: >-
    Increased insulin secretion followed adenoviral LPLAT10 overexpression in mouse
    liver, where basal expression is low. The WNT-beta-catenin-c-JUN-ACSL3 result is
    from hepatocellular-carcinoma models and association analyses rather than normal
    human liver physiology.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: >-
    These contexts could reflect specific lipid products or nonphysiological enzyme
    abundance and should not be generalized without endogenous perturbation.
  resolution: >-
    Perturb endogenous LPCAT4 in primary human hepatocyte, beta-cell co-culture, and
    genotype-defined HCC organoid models, then couple positional lipidomics to
    insulin-secretion, cholesterol-flux, WNT, c-JUN, and ACSL3 measurements with
    catalytic rescue controls.
- gap_statement: >-
    Functionally distinct endogenous LPCAT4 protein isoforms and stable
    LPCAT4-containing complexes have not been demonstrated.
  boundary: >-
    The reviewed UniProt record lists no alternative protein isoforms; old sequence
    cautions reflect cloning discrepancies. No reviewed evidence establishes a
    stable complex required for catalysis or localization.
  gap_kind:
  - BIOLOGY
  - CURATION
  status: OPEN
  significance: >-
    Unsupported isoform or complex assumptions could obscure regulation of the
    enzyme and misinterpret transcript or interaction datasets.
  resolution: >-
    Reconcile full-length transcripts by long-read sequencing and proteomics, and
    combine endogenous proximity labeling with reciprocal interaction and genetic
    perturbation to identify reproducible regulatory partners without assuming
    constitutive complex membership.
proposed_new_terms: []
suggested_questions:
- question: >-
    Which positional LPC, LPE, and LPS species and which saturated or unsaturated
    acyl-CoAs are the dominant endogenous human LPCAT4 substrates?
- question: >-
    Does LPCAT4 acylate endogenous 1-acyl LPG at free sn-2, and does that activity
    contribute measurably to PG remodeling in vivo?
- question: >-
    What functions do LPCAT4-generated sn-1-unsaturated phospholipids serve in human
    neurons and other high-expression cell types?
- question: >-
    How do LPCAT4 membrane topology and active-site architecture determine sn-1,
    headgroup, and unsaturated-acyl-donor selectivity?
- question: >-
    Are liver-endocrine and HCC phenotypes caused by LPCAT4 catalytic products at
    endogenous expression levels?
- question: >-
    Are any endogenous LPCAT4 protein isoforms or stable regulatory partners
    functionally distinct?
suggested_experiments:
- hypothesis: >-
    Endogenous human LPCAT4 preferentially uses sn-2 LPC, LPE, and LPS with
    unsaturated acyl-CoAs, but substrate ranking differs by cell type.
  description: >-
    Perform endogenous knockout and genomic rescue in human neuronal, epithelial,
    and hepatic models, using stable-isotope acyl donors and position-resolved
    lipidomics to quantify acceptor competition, donor kinetics, and PC/PE/PS product
    flux.
  experiment_type: endogenous positional phospholipid flux profiling
- hypothesis: >-
    LPCAT4 supports 1-acyl LPG acylation at free sn-2 but not 2-acyl LPG acylation at
    free sn-1, yielding position-dependent rather than universal PG remodeling.
  description: >-
    Assay matched LPCAT4 preparations against sn-1 and sn-2 LPG panels while varying
    acyl donor, membrane composition, detergent, enzyme abundance, and time; confirm
    PG positional products by orthogonal mass spectrometry and compare endogenous
    PG flux after knockout/rescue.
  experiment_type: LPG discrepancy resolution
- hypothesis: >-
    Selected sn-1-unsaturated phospholipids generated by LPCAT4 alter neuronal
    membrane organization and signaling.
  description: >-
    Create catalytic-null and rescue human neuronal models, restore individual
    positional PC/PE/PS species with controlled delivery or orthogonal enzymes, and
    measure membrane order, organelle dynamics, electrophysiology, and stress
    responses.
  experiment_type: positional-lipid function dissection
- hypothesis: >-
    Specific active-site and membrane-facing residues determine LPCAT4 preference for
    sn-2 lysophospholipids and unsaturated acyl-CoAs.
  description: >-
    Map ER-membrane orientation, determine substrate-bound structures, mutate
    candidate access-channel and catalytic residues, and test rescue of positional
    lipid products at the endogenous locus.
  experiment_type: membrane topology and structure-function analysis
- hypothesis: >-
    Endogenous LPCAT4 catalytic activity, rather than overexpression alone, drives
    only a subset of the reported liver-endocrine and HCC signaling phenotypes.
  description: >-
    Compare endogenous knockout, catalytic-dead rescue, and expression-matched
    wild-type rescue in primary human hepatocyte/beta-cell co-culture and HCC
    organoids while measuring positional lipids, insulin secretion, cholesterol
    flux, WNT-c-JUN activity, and ACSL3 abundance.
  experiment_type: context-bounded catalytic causality
