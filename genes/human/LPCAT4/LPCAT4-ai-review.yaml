- term:
    id: GO:0006654
    label: phosphatidic acid biosynthetic process
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-1483166
  qualifier: involved_in
  review:
    summary: The phosphatidic-acid biosynthesis assignment is contradicted by direct LPCAT4 substrate testing.
    action: REMOVE
    reason: This Reactome pathway includes the conversion of LPA to phosphatidic acid, but PMID:18458083 explicitly found
