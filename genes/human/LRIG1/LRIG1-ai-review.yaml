  review:
    summary: The IBA assigns autonomous signaling receptor activity to LRIG1 from a
      broad LRR receptor-family node. Direct human evidence instead establishes LRIG1
      as a membrane regulator that binds receptor tyrosine kinases and accelerates
      their ubiquitination and degradation.
    action: REMOVE
    reason: Current GO defines signaling receptor activity as receiving a signal and
      transmitting it in the cell to initiate a change in cell activity. LRIG1 is
      experimentally a negative regulator of ErbB-family receptor abundance, not the
      signal-receiving receptor. Several WITH/FROM donors are genuine receptors such
      as TLR3, CD180, RTN4RL1, and RTN4RL2, so this is an unsafe role transfer from
      receptor paralog/family members to a receptor regulator.
