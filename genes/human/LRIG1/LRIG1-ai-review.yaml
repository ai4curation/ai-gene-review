core_functions:
- description: >-
    Membrane-anchored LRIG1 binds and inhibits transmembrane receptor tyrosine
    kinases. It restrains ERBB receptors by recruiting c-CBL and enhancing receptor
    ubiquitination and degradation, destabilizes MET through a ligand- and
    c-CBL-independent route, and inhibits RET activation. After SAIT301-induced MET
    engagement, ubiquitinated LRIG1 recruits HRS and accompanies MET to lysosomes;
    this treatment-specific route is opposed by USP8. These mechanisms establish
    receptor inhibitor activity, not autonomous receptor, kinase, ubiquitin-ligase
    or deubiquitinase activity.
