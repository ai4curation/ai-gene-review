id: Q96JA1
gene_symbol: LRIG1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  LRIG1 is a widely expressed type I single-pass membrane glycoprotein with an
  extracellular leucine-rich-repeat region, three immunoglobulin-like domains and
  a cytoplasmic tail. At the plasma membrane it binds and inhibits several receptor
  tyrosine kinases through receptor- and context-dependent mechanisms. Human LRIG1
  recruits c-CBL to ERBB receptors to enhance receptor ubiquitination and degradation,
  destabilizes MET independently of CBL, and inhibits the activation of oncogenic
  RET variants; neuronal experiments also show inhibition of GDNF-dependent RET
  activation and signaling. In an antibody-induced MET-degradation setting,
  ubiquitinated LRIG1 binds the endosomal sorting protein HRS and accompanies MET to
  lysosomes, while USP8 deubiquitinates LRIG1 and opposes this route. LRIG1 can also
  undergo constitutive ectodomain shedding, generating a soluble product that inhibits
  EGF signaling in neighboring cells without detectable EGFR downregulation. These
  observations establish LRIG1 as a receptor tyrosine kinase inhibitor rather than
  a signaling receptor, kinase, ubiquitin ligase or deubiquitinase. The strength and
  physical basis of LRIG1-receptor association vary among assays, and no receptor-bound
  or full-length experimental structure is available. Two human protein isoforms are
  curated, but distinct physiological functions have not been demonstrated. Its
  tumor-suppressive effects are tissue- and genotype-dependent rather than uniform
  across cancers.
