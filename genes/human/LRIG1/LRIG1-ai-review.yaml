    negative regulatory action toward ErbB receptor tyrosine kinases is opposed by
    leucine-rich repeat and immunoglobulin domain-containing protein 3 (Lrig3).
  findings:
  - statement: LRIG3 functionally opposes LRIG1 in ErbB regulation, whereas LRIG1 destabilizes
