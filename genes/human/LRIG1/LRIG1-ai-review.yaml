proposed_new_terms:
- proposed_name: negative regulation of glial cell-derived neurotrophic factor receptor
    signaling pathway
  proposed_definition: >-
    Any process that stops, prevents or reduces the frequency, rate or extent of the
    glial cell-derived neurotrophic factor receptor signaling pathway.
  justification: >-
    Current GO provides the GDNF receptor signaling pathway but no corresponding
    negative-regulation child. Lrig1-RET association directly reduces GDNF binding,
    RET recruitment to lipid rafts, receptor autophosphorylation and MAPK activation;
    an exact term would represent this biology without misusing a generic signaling
    or kinase-regulation term. GO:2000732 is an unrelated RNA polymerase I transcription-
    termination term, while obsolete GO:2000734 was restricted to ureteric bud formation;
    neither represents general negative regulation of GDNF receptor signaling. The source
    cache is abstract-only, so this proposal does not assert a human-specific annotation
    or transfer the function from LRIG3.
  proposed_parent:
    id: GO:0023057
    label: negative regulation of signaling
  supported_by:
  - reference_id: PMID:18171921
    supporting_text: inhibits GDNF binding, recruitment of Ret to lipid rafts, receptor
    reference_section_type: ABSTRACT
suggested_questions:
- question: >-
    Which ubiquitin ligase and degradation-machinery components mediate basal,
    c-CBL-independent LRIG1-dependent MET destabilization, and how do they differ
    from the SAIT301-induced HRS/USP8 route?
- question: >-
    What are the affinity, stoichiometry and receptor-contact surfaces of endogenous
    full-length LRIG1 complexes with EGFR/ERBB, MET and RET, and which contacts explain
    their distinct inhibitory mechanisms?
- question: >-
    Which protease and cleavage site generate soluble LRIG1 in vivo, what receptor or
    co-receptor does the ectodomain engage, and does either curated isoform differ in
    shedding or paracrine activity?
- question: >-
    In which human tissues and tumor genotypes is endogenous LRIG1 quantitatively
    rate-limiting for receptor signaling or tumor suppression, rather than merely
    correlated with disease state?
suggested_experiments:
- description: >-
    Endogenously tag LRIG1 and selected ERBB, MET and RET receptors in human epithelial
    and neuronal cell models, then combine ligand time courses, quantitative surface
    proteomics, receptor half-life measurements, phosphosignaling and acute LRIG1
    degradation/rescue to compare receptor inhibition without overexpression.
  hypothesis: >-
    Endogenous LRIG1 inhibits each receptor family with distinct dependencies on
    receptor activation, ubiquitination and degradation.
  experiment_type: endogenous quantitative receptor-trafficking and signaling analysis
- description: >-
    Perform a focused CRISPR screen of E3 ligases and endosomal-sorting factors in
    LRIG1-positive MET cells, followed by ubiquitin-remnant proteomics and rescue with
    catalytic-dead candidates under basal, HGF and SAIT301 conditions.
  hypothesis: >-
    A non-CBL E3 ligase ubiquitinates LRIG1 or an associated factor to drive basal MET
    destabilization, while HRS and USP8 specifically tune the induced lysosomal route.
  experiment_type: genetic interaction screen and ubiquitin proteomics
- description: >-
    Reconstitute full-length glycosylated LRIG1 with EGFR, MET or RET in defined membranes
    and use cryo-EM, crosslinking mass spectrometry and quantitative binding assays,
    validating candidate interfaces with separation-of-function mutants at endogenous
    expression levels.
  hypothesis: >-
    LRIG1 uses partly distinct ectodomain contacts for different receptor families,
    explaining both low apparent affinity and receptor-specific inhibitory mechanisms.
  experiment_type: structural and quantitative interaction analysis
- description: >-
    Map LRIG1 cleavage by N-terminomics and secretome proteomics after ADAM17 knockout
    or inhibition, then compare cleavage-resistant full-length LRIG1 and purified
    isoform-specific ectodomains in receptor-panel binding, signaling and co-culture
    assays.
  hypothesis: >-
    A defined metalloprotease cleavage event releases a soluble LRIG1 ectodomain whose
    paracrine target and mechanism differ from membrane LRIG1-driven receptor degradation.
  experiment_type: protease mapping and isoform-resolved paracrine signaling assay
knowledge_gaps:
- gap_statement: >-
    The E3 ligase and degradation machinery that execute basal, c-CBL-independent
    LRIG1-mediated MET destabilization are unresolved, and it is not known whether
    the SAIT301-induced HRS/USP8 pathway is used during unperturbed MET regulation.
  boundary: >-
    Endogenous LRIG1 binds and destabilizes MET independently of HGF and c-CBL. In
    SAIT301-treated cancer cells, LRIG1 ubiquitination recruits HRS and targets the
    LRIG1-MET complex to lysosomes, while USP8 counteracts this process.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    Identifying the basal machinery is required to distinguish LRIG1's physiological
    MET-regulatory mechanism from a therapeutic-antibody-specific trafficking route.
  resolution: >-
    Combine endogenous LRIG1/MET perturbation with E3-ligase and sorting-factor screens,
    ubiquitin-site mapping and rescue under basal, HGF and SAIT301 conditions.
  provenance:
  - reference_id: PMID:17178829
    supporting_text: The mechanism by which LRIG1 destabilizes the Met receptor is currently
      unknown
    reference_section_type: DISCUSSION
- gap_statement: >-
    The direct structural interface, affinity and stoichiometry of full-length LRIG1
    with its receptor targets remain unresolved, and positive cell-based association
    results have not been reconciled with failure to detect EGFR binding in purified
    ectodomain assays.
  boundary: >-
    Human cell studies demonstrate LRIG1 association with ERBB receptors, MET and RET,
    but the two experimental structures cover isolated ectodomain fragments and no
    LRIG1-receptor complex or full-length LRIG1 structure is available.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    Resolving the interface would distinguish direct low-affinity recognition from
    avidity, membrane-context or cofactor-dependent association and enable rigorous
    separation-of-function tests.
  resolution: >-
    Determine structures and binding kinetics of full-length, glycosylated LRIG1 with
    ERBB, MET and RET in membrane contexts, followed by endogenous interface-mutant rescue.
  provenance:
  - reference_id: PMID:25765764
    supporting_text: We could not detect any binding of the LRIG1 domains
    reference_section_type: ABSTRACT
- gap_statement: >-
    The physiological protease, cleavage site and direct signaling target of the shed
    LRIG1 ectodomain are unknown, as is whether the two curated human isoforms differ
    in production or activity of the soluble product.
  boundary: >-
    LRIG1 ectodomains are constitutively shed, shedding is modulated by ADAM17 perturbation,
    and purified ectodomain suppresses EGF signaling without detectable EGFR downregulation.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: >-
    Closing this gap would define a mechanistically distinct non-cell-autonomous LRIG1
