- id: PMID:15282549
  title: LRIG1 restricts growth factor signaling by enhancing receptor ubiquitylation
    and degradation.
  findings:
  - statement: Human LRIG1 associates with the four mammalian ErbB receptors and enhances
      EGFR ubiquitylation and degradation through recruitment of the E3 ligase c-Cbl.
    supporting_text: We report upregulation of LRIG1 transcript and protein upon EGF
      stimulation, and physical association of the encoded protein with the four EGFR
      orthologs of mammals. Upregulation of LRIG1 is followed by enhanced ubiquitylation
      and degradation of EGFR. The underlying mechanism involves recruitment of c-Cbl,
      an E3 ubiquitin ligase that simultaneously ubiquitylates EGFR and LRIG1 and sorts
      them for degradation.
    reference_section_type: ABSTRACT
    full_text_unavailable: false
  - statement: LRIG1 is an integral transmembrane protein, supporting its receptor-associated
      plasma-membrane state.
    supporting_text: Their structural relative in mammals, LRIG1, is a transmembrane
      protein
    reference_section_type: ABSTRACT
    full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct human mechanistic evidence for ErbB association, c-Cbl recruitment,
      receptor ubiquitylation/degradation, and membrane topology.
- id: PMID:15345710
  title: The leucine-rich repeat protein LRIG1 is a negative regulator of ErbB family
    receptor tyrosine kinases.
  findings:
  - statement: In transfected human cells, LRIG1 formed complexes with EGFR and ERBB2-4,
      reduced EGFR abundance and half-life, and enhanced ligand-stimulated EGFR ubiquitination.
    supporting_text: LRIG1 forms a complex with each of the ErbB receptors
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct human ErbB-family evidence, but only the abstract is cached;
      detailed assay interpretation should remain bounded to the reported transfection
      systems.
- id: PMID:18542056
  title: LRIG1 negatively regulates the oncogenic EGF receptor mutant EGFRvIII.
  findings:
  - statement: LRIG1 retains interaction with oncogenic EGFRvIII and suppresses EGFRvIII-driven
      glioblastoma-cell phenotypes through a mechanism distinct from Cbl-mediated degradation.
    supporting_text: We find that EGFRvIII retains interaction with LRIG1 and is in
      fact more sensitive to LRIG1 action than wild-type receptor. We demonstrate that
      LRIG1 regulation of EGFRvIII is distinct from the only other known mechanism
      of EGFR regulation, Cbl-mediated degradation.
    reference_section_type: ABSTRACT
    full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct evidence in human glioblastoma cells; the oncogenic EGFRvIII
      context and Cbl-independent mechanism must not be generalized to every ErbB receptor.
