id: O75419
gene_symbol: CDC45
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CDC45 is a nuclear replication factor that forms the CMG helicase with the MCM2–7 motor
  and the GINS complex. It contributes the architecture needed for productive DNA unwinding and remains
  associated with the replication machinery during DNA synthesis. Purified human CDC45 also binds
  single-stranded and branched DNA. Its RecJ-related fold has lost the conserved nuclease active
  site, and ATP-driven unwinding is a property of the assembled CMG complex. Biallelic hypomorphic
  CDC45 variants cause Meier-Gorlin syndrome and craniosynostosis, linking impaired replication capacity
  to developmental growth defects.
