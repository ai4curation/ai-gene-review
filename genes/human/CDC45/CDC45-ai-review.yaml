core_functions:
- description: CDC45 binds single-stranded DNA and supplies structural interfaces that organize the
    nuclear CMG replication helicase. Together with GINS it supports the MCM2–7 motor during genome
    duplication; ATP-driven unwinding belongs to the assembled complex.
  molecular_function:
    id: GO:0003697
    label: single-stranded DNA binding
  contributes_to_molecular_function:
    id: GO:0003678
    label: DNA helicase activity
  directly_involved_in:
  - id: GO:0006260
    label: DNA replication
  locations:
  - id: GO:0005654
    label: nucleoplasm
  in_complex:
    id: GO:0071162
    label: CMG complex
  supported_by:
