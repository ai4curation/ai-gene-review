id: Q2TB18
gene_symbol: ASTE1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ASTE1 (asteroid homolog 1) is a structure-specific DNA endonuclease with an XPG-like N-terminal
  nuclease domain. It cleaves single-stranded DNA and 3' overhang DNA. Recruited to DNA double-strand
  breaks by the shieldin complex through SHLD2, it acts downstream of 53BP1, RIF1 and shieldin, trimming
  the 3' single-stranded tails of resected ends. This limits end resection and favours non-homologous
  end joining over homologous recombination. Its loss impairs end joining and immunoglobulin class switch
  recombination, and in BRCA1-deficient cells it restores homologous recombination and confers PARP-inhibitor
  resistance. A coding microsatellite in its last exon is frequently frameshifted in mismatch-repair-deficient
  cancers.
