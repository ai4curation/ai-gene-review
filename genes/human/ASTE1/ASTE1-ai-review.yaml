- id: PMID:34354233
  title: ASTE1 promotes shieldin-complex-mediated DNA repair by attenuating end resection.
  findings:
  - statement: ASTE1 is a 3' overhang/ssDNA endonuclease.
    supporting_text: Here, we identify a downstream effector of the shieldin complex, ASTE1, as a structure-specific
      DNA endonuclease that specifically cleaves single-stranded DNA and 3' overhang DNA.
  - statement: ASTE1 localizes to DSB sites in a shieldin-dependent manner.
    supporting_text: ASTE1 localizes to DNA damage sites in a shieldin-dependent manner.
  - statement: ASTE1 loss impairs NHEJ and class switching.
    supporting_text: Loss of ASTE1 impairs non-homologous end-joining, leads to hyper-resection and causes
      defective immunoglobulin class switch recombination.
  - statement: ASTE1 loss restores HR in BRCA1-deficient cells.
    supporting_text: ASTE1 deficiency also causes resistance to poly(ADP-ribose) polymerase inhibitors
      in BRCA1-deficient cells owing to restoration of homologous recombination.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only (not in PMC); the sole functional study. Mutant and interaction details
      are taken from UniProt's curation of this paper.
  full_text_unavailable: true
- id: PMID:15563124
  title: Immunogenic peptides generated by frameshift mutations in DNA mismatch repair-deficient cancer
    cells.
  findings:
  - statement: The HT001 (ASTE1) coding microsatellite is a frameshift target in MSI cancers.
    supporting_text: Here, we characterize the immunogenic properties of five additional HLA-A0201-restricted
      frameshift-induced neopeptides derived from mutations in three cMS-containing genes (Caspase-5,
      TAF-1b, and HT001) that are frequently hit in MSI+ cancer cells.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Abstract-only; tumour-immunology study, not gene function. The validated CTL epitope
      came from Caspase-5, not HT001.
  full_text_unavailable: true
- id: PMID:23674496
  title: Identification and selective degradation of neopeptide-containing truncated mutant proteins in
    the tumors with high microsatellite instability.
  findings:
  - statement: ASTE1 frameshift mRNAs were analysed in MSI-H cancer lines.
    supporting_text: We selected 7 genes (TTK, TCF7L2, MARCKS, ASTE1, INO80E, CYHR1, and EBPL) for mutant
      mRNA expression analysis and 3 genes (TTK, TCF7L2, and MARCKS) for mutant protein expression analysis.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Abstract-only; only mutant mRNA, not protein, was examined for ASTE1.
  full_text_unavailable: true
- id: PMID:23344038
  title: 'Overlapping ATP2C1 and ASTE1 genes in human genome: implications for SPCA1 expression?'
  findings:
  - statement: ASTE1 overlaps ATP2C1 on the opposite strand in human.
    supporting_text: Furthermore, the terminal exon of the human ATP2C1 gene overlaps with the ASTE1 gene
      on the opposing strand and whose open reading frame is transcribed towards ATP2C1 (Figure 1C) [3].
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Full text; hypothesis paper on gene overlap, with no ASTE1 experiments.
