id: Q13936
gene_symbol: CACNA1C
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CACNA1C encodes the pore-forming alpha1C subunit of CaV1.2, an L-type high-voltage-activated
  calcium channel. Its voltage sensors and calcium-selective pore convert plasma-membrane depolarization
  into calcium entry. In cardiac muscle this current contributes to the action potential and triggers
  ryanodine-receptor-mediated calcium release for contraction; in smooth muscle and neurons it links electrical
  activity to calcium-dependent responses. Beta and alpha2delta subunits regulate channel expression and
  gating, while calmodulin and other intracellular partners control inactivation and local signaling.
  Extensive alternative splicing changes gating, surface expression and pharmacology. Pathogenic variants
  can alter current density, selectivity or inactivation in different directions, producing cardiac and
  neurodevelopmental phenotypes.
