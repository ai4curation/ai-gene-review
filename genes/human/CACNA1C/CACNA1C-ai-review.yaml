core_functions:
- description: The alpha1C pore couples membrane depolarization to calcium entry through L-type CaV1.2
    channels. In cardiac muscle, this current contributes to electrical excitation and triggers RyR-mediated
    stored-calcium release for contraction. Auxiliary subunits and calmodulin regulate this same pore
    unit, and splice variation changes its gating and surface expression. The channel supplies trigger
    calcium; the ryanodine receptor performs sarcoplasmic-reticulum release.
