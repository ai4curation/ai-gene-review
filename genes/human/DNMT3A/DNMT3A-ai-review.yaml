    id: GO:0140003
    label: histone H3K36me3 reader activity
  evidence_type: IDA
  original_reference_id: PMID:30478443
  qualifier: enables
  review:
    action: NEW
    summary: The human PWWP domain directly recognizes histone H3K36me3.
    reason: Purified human WT GST-PWWP binds H3K36me3 peptide but not the corresponding unmodified peptide;
      histone-tail arrays additionally show H3K36me2 recognition. W330R loses the measured interaction.
      These direct WT recognition assays support the reader activity already represented in the core,
      without inferring it solely from mutant methylation phenotypes or assigning the fragment assay to
      every natural product. No imported annotation or proposed replacement is an ancestor or descendant
      of this reader term; the ADD unmodified-histone reader is complementary. The annotation does not
      imply exclusive recognition of H3K36me3 or an independently demonstrated constitutive-heterochromatin
      process.
