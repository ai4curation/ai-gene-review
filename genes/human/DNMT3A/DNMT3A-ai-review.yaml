id: Q9Y6K1
gene_symbol: DNMT3A
product_type: PROTEIN
status: IN_PROGRESS
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: DNMT3A is a de novo DNA cytosine-5 methyltransferase that establishes and remodels mammalian
  DNA methylation patterns. Its catalytic domain recognizes cytosines, preferentially in CpG contexts,
  while PWWP and ADD chromatin-reader domains and interacting proteins guide genomic targeting and activity.
  Chromatin methylation contributes to transcriptional regulation and cell identity. Alternative N-terminal
  isoforms differ in chromatin localization.
