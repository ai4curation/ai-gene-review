- term:
    id: GO:0030182
    label: neuron differentiation
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q1LZ53
  - ensembl:ENSRNOP00000046524
  review:
    action: KEEP_AS_NON_CORE
    summary: Neuronal differentiation is retained as a contextual developmental role, grounded in mouse
      ortholog perturbation rather than the rat expression donor.
    reason: The rat donor annotation is IEP (PMID:19660178 follows Dnmt3a expression during
      dorsal-root-ganglion neural-stem-cell differentiation with only a nonselective methylation inhibitor),
      which alone would not establish participation. Independent ortholog evidence does. Mouse Dnmt3a (O88508,
      the same PANTHER subfamily PTHR23068:SF10 as human DNMT3A) is required cell-autonomously for neuronal
      differentiation of postnatal neural stem cells; acute deletion impairs it, and the defect is rescued by
      wild-type but not catalytically inactive Dnmt3a. Dnmt3a methylates nonpromoter regions of neurogenic
      genes, antagonising Polycomb repression of them (PMID:20651149). DNMT3A therefore does work in this
      process through its methylation activity. It is a developmental context of the core activity, not a
      separate function.
    supported_by:
    - reference_id: PMID:19660178
    - reference_id: PMID:20651149
      supporting_text: Thus, specific and cell-autonomous functions of Dnmt3a are required for neurogenesis
        from postnatal NSCs.
    - reference_id: PMID:20651149
      supporting_text: the neurogenesis deficit in Dnmt3a -null cultures was rescued by re-expressing physiological
        levels of WT Dnmt3a, but not catalytically inactive mutant Dnmt3a
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
      - source_id: UniProtKB:Q1LZ53
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: The rat donor annotation is an expression-pattern (IEP) inference. The process term holds
          for the target on independent mouse ortholog perturbation and rescue evidence (PMID:20651149),
          not on this donor.
      - source_id: ensembl:ENSRNOP00000046524
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: Same rat IEP donor as above; the transfer outcome is correct for reasons the donor does
          not itself establish.
