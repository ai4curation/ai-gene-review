- term:
    id: GO:0071514
    label: genomic imprinting
  evidence_type: ISO
  original_reference_id: PMID:15215868
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:O88508
  review:
    action: NEW
    summary: DNMT3A performs the de novo methylation that establishes maternal and most paternal germline
      imprints, shown for the mouse ortholog in the same PANTHER subfamily.
    reason: Germ-cell-specific deletion of mouse Dnmt3a (O88508, PANTHER PTHR23068:SF10 like human DNMT3A)
      abolishes methylation and allele-specific expression at all maternally imprinted loci examined and
      at two of three paternally imprinted loci, whereas germline Dnmt3b deletion has no phenotype
      (PMID:15215868). This is participation rather than necessity alone, because the imprint is the
      methylation mark itself and DNMT3A is the catalytic subunit that deposits it; DNMT3L, its noncatalytic
      activator, is required for the same loci. In a comparator check, mouse Dnmt3a carries this term by IMP from
      this paper, mouse and human DNMT3L carry it, yet human DNMT3A does not, so the catalytic partner is
      missing a term its activator has. No imported or proposed term is an ancestor or descendant of
      GO:0071514; GO:0044027 (CpG-island methylation-dependent silencing) is a sibling under epigenetic
      regulation of gene expression. Human-specific germline evidence is not available; the transfer rests
      on subfamily orthology.
    supported_by:
    - reference_id: PMID:15215868
      supporting_text: Offspring from Dnmt3a conditional mutant females die in utero and lack methylation
        and allele-specific expression at all maternally imprinted loci examined.
    - reference_id: PMID:15215868
      supporting_text: both Dnmt3a and Dnmt3L are required for methylation of most imprinted loci in germ
        cells
