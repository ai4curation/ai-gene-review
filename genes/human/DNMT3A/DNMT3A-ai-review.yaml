id: Q9Y6K1
gene_symbol: DNMT3A
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: DNMT3A is a chromatin-associated DNA cytosine C5 methyltransferase that establishes DNA methylation
  patterns important for development and cellular identity. It methylates CpG sites and can also methylate
  non-CpG cytosines. With the noncatalytic activator DNMT3L it forms a heterotetrameric DNA methyltransferase
  complex in which DNMT3A supplies both active sites, and in germ cells it deposits the methylation that
  establishes maternal and most paternal genomic imprints. Its ADD domain recognizes the histone H3 amino terminus preferentially when lysine
  4 is unmethylated, while its PWWP domain recognizes methylated H3 lysine 36. These reader modules, oligomerization
  and regulatory partners help target and control DNA methylation, including repression at selected promoters.
  Nuclear and cytoplasmic pools vary with cell type and developmental stage. Alternative transcripts encode
  products with different amino termini or extensive truncation. Germline and somatic variants can alter
  growth and neurodevelopment or contribute to hematological malignancy.
alternative_products:
- name: '1'
  id: Q9Y6K1-1
  description: The 912-residue canonical product contains the PWWP, ADD and catalytic domains, combining
    histone recognition with DNA cytosine methylation.
- name: '2'
  id: Q9Y6K1-2
  sequence_note: VSP_046254
  description: This 723-residue alternative product replaces canonical residues 1–213 with a 24-residue
    amino terminus and retains the PWWP, ADD and catalytic regions.
- name: '3'
  id: Q9Y6K1-3
  sequence_note: VSP_040998, VSP_040999
  description: This 166-residue alternative product has a distinct carboxyl-terminal segment and lacks
    the canonical PWWP, ADD and catalytic regions. Its biological role remains unresolved.
