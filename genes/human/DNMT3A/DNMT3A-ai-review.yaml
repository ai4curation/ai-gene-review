core_functions:
- description: Transfers methyl groups from S-adenosylmethionine to the C5 position of DNA cytosines,
    establishing DNA methylation patterns. Human catalytic-domain assays show a preference for CpG sites
    while retaining measurable CpA and CpT methylation. Chromatin-associated methylation contributes to
    silencing at selected CpG-island promoters; histone recognition and regulatory partners help specify
    genomic targeting.
  molecular_function:
    id: GO:0003886
    label: DNA (cytosine-5-)-methyltransferase activity
  directly_involved_in:
  - id: GO:0044027
    label: negative regulation of gene expression via chromosomal CpG island methylation
  - id: GO:0071514
    label: genomic imprinting
  locations:
  - id: GO:0000785
    label: chromatin
  in_complex:
    id: GO:0140020
    label: DNA methyltransferase complex
  supported_by:
  - reference_id: PMID:15215868
    supporting_text: both Dnmt3a and Dnmt3L are required for methylation of most imprinted loci in germ
      cells
  - reference_id: PMID:29414941
    supporting_text: 'the

      DNMT3A-DNMT3L-DNA complex in which two DNMT3A monomers simultaneously attack two

      cytosine-phosphate-guanine (CpG) dinucleotides'
  - reference_id: PMID:23042785
    supporting_text: "DNMT3A \nrecruitment is increased, with hypermethylation being associated with silencing\
      \ \nof gene expression."
- description: The ADD domain recognizes the histone H3 amino-terminal tail preferentially when lysine
    4 is unmethylated, connecting the local histone state to DNA methyltransferase targeting. Human isolated-domain
    binding and structural experiments establish this recognition; methylated H3K4 peptides bind more
    weakly under the tested conditions.
  molecular_function:
    id: GO:0140063
    label: unmodified histone reader activity
  locations:
  - id: GO:0000785
    label: chromatin
  supported_by:
  - reference_id: PMID:19834512
    supporting_text: 'DNMT3A recognizes the unmethylated state of lysine 4 in

      histone H3.'
- description: The PWWP domain reads methylated histone H3 lysine 36, including H3K36me3 and H3K36me2,
    to help target DNA methylation within chromatin. Direct human-domain binding and the altered methylation
    pattern associated with PWWP substitutions support this recognition function; it is complementary
    to ADD-mediated recognition of the H3 amino terminus.
  molecular_function:
    id: GO:0140003
    label: histone H3K36me3 reader activity
  locations:
  - id: GO:0000785
    label: chromatin
  supported_by:
  - reference_id: PMID:30478443
suggested_questions:
- question: Which cell types express the 723- and 166-residue natural products, and what molecular activities
    do they retain independently of the historically named 689-residue DNMT3A2 reagent?
- question: Under which cellular and biochemical conditions does DNMT3A recognize H4R3me2s, given the
    positive PRMT5-linked report and the condition-specific non-replication in the independent ADD study?
- question: Which exposure-associated expression changes reflect DNMT3A executing a response, rather than
    DNMT3A abundance being a downstream readout?
