    label: negative regulation of transcription by RNA polymerase II
  evidence_type: IDA
  original_reference_id: PMID:23042785
  qualifier: involved_in
  review:
    action: ACCEPT
    summary: DNMT3A can repress transcription through targeted DNA methylation.
    reason: Recruitment by transcriptional regulators and promoter hypermethylation provide mechanistic
      support for negative transcriptional regulation. This does not imply that all DNMT3A-dependent methylation
      universally represses transcription.
