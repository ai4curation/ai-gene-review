  qualifier: part_of
  review:
    action: MODIFY
    summary: The DNMT3A-DNMT3L heterotetramer is a DNA methyltransferase complex, a more specific
      descendant of catalytic complex.
    reason: The cited human study characterises DNMT3A-DNMT3L complexes with regulated DNA methylation
      activity, and the human DNMT3A-DNMT3L-DNA crystal structure shows the heterotetramer methylating
      DNA through its two DNMT3A active sites. GO:0140020 DNA methyltransferase complex ("a protein
      complex that possesses DNA methyltransferase activity") is an is_a descendant of GO:1902494 catalytic
      complex and states what this complex does. Correcting the earlier assessment, which retained the
      generic parent on the assumption that no named GO complex existed. DNMT3A supplies the catalytic
      sites; DNMT3L is the noncatalytic activating subunit.
