suggested_questions:
- question: Which exact primary assay and PAINT ancestral placement support estrogen-response-element
    binding by human AR, beyond its established ARE preference?
- question: Does the PMID18487222 experiment establish RNA polymerase III transcriptional regulation,
    and does PMID11896058 demonstrate an adaptor bridge rather than pairwise TFIIF binding?
- question: Which SH2 phosphopeptide affinities are realized by endogenous full-length AR in defined ligand,
