core_functions:
- description: Full-length AR recognizes and binds androgen through its ligand-binding domain, then combines
    regulatory-DNA recognition with coregulator recruitment to activate or repress Pol II transcription.
    This ligand-sensing transcriptional activity supports androgen receptor signaling. Ligand-binding-domain-deficient
    products can retain distinct constitutive transcriptional behavior. Nuclear/chromatin pools perform
    DNA-directed transcription; cytosol is a regulated receptor pool preceding or following nuclear entry.
  molecular_function:
    id: GO:0003707
    label: nuclear steroid receptor activity
  locations:
