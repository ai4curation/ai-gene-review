- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:21730179
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q02790
  review:
    summary: FKBP4/FKBP52 association supports enzyme binding.
    action: MODIFY
    reason: The complete abstract and independently read original Results/Fig3 and main Methods establish
      FKBP52/AR/Hsp90 coassociation in LNCaP, LAPC4 and 22Rv1 cells. FKBP52 is a peptidyl-prolyl isomerase;
      enzyme binding captures the partner class while retaining complex-mediated scope. A direct AR BF3
      contact was proposed but not demonstrated. Do not infer protein-folding chaperone binding from HSP90
      membership, an AR isomerase activity, or a requirement for FKBP52 catalysis.
    proposed_replacement_terms:
    - id: GO:0019899
      label: enzyme binding
    supported_by:
    - reference_id: PMID:21730179
      supporting_text: 'MJC13, inhibits AR function by preventing hormone-dependent

        dissociation of the Hsp90-FKBP52-AR complex'
      full_text_unavailable: true
