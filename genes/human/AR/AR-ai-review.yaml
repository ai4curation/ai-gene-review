- description: Condensation is a mode of AR assembly associated with transcriptional regulation. Purified
    human activation-domain fragments establish intrinsic condensate formation under defined solution
    conditions, while a separate receptor study reports ligand-activated transcriptional condensates.
    These results do not establish that every nuclear focus is liquid or that every splice product has
    identical phase behavior.
