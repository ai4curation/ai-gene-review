  review:
    summary: Action potential; not shown for Kv8.2, and its photoreceptor role is resting potential.
    action: MARK_AS_OVER_ANNOTATED
    reason: The IBA comes from a node shared with conducting Kv channels of excitable neurons. Kv8.2 is silent alone,
      and its only demonstrated physiological role is in Kv2.1/Kv8.2 channels of photoreceptors, which signal with
      graded potentials; there IKx sets the resting membrane potential. No study ties Kv8.2 to action potentials,
      so the term over-reaches for this subunit.
