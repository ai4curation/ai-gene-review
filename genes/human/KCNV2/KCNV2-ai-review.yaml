id: Q8TDN2
gene_symbol: KCNV2
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: KCNV2 encodes Kv8.2, an electrically silent alpha subunit of voltage-gated potassium channels with
  the canonical six-transmembrane Kv fold, an S4 voltage sensor, a potassium pore loop and an N-terminal T1 tetramerization
  domain. Kv8.2 cannot form functional homotetramers and is retained in the endoplasmic reticulum when expressed
  alone; it co-assembles with Kv2.1 (KCNB1) into heterotetrameric channels that reach the plasma membrane, and its
  subunits contribute to the heteromer's pore. In the heteromer Kv8.2 shifts activation to more negative potentials,
  producing a window current near the photoreceptor operating range. In rod and cone photoreceptors Kv2.1/Kv8.2
  channels sit in the inner segment and carry the voltage-gated potassium current IKx, which largely sets the resting
  membrane potential in darkness and shapes the light response. Recessive loss-of-function variants, which abolish
  expression, prevent heteromer assembly or produce nonconducting heteromers, cause cone dystrophy with supernormal
  rod responses.
