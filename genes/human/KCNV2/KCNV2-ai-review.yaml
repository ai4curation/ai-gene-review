core_functions:
- description: 'Kv8.2 is an obligate partner subunit of Kv2.1 (KCNB1): it contributes to the voltage-gated potassium
    channel activity of Kv2.1/Kv8.2 heterotetramers, shifting their activation to more negative potentials, and
    in the photoreceptor inner segment the heteromer carries IKx, which sets the resting membrane potential (human
    subunits expressed in cells and oocytes; mouse retina and knockout).'
