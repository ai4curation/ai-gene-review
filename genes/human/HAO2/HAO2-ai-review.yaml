suggested_experiments:
- description: Quantify long-chain 2-hydroxy fatty acid oxidation in human hepatocyte
    or kidney-proximal-tubule models after HAO2 knockout and rescue with wild-type
    or catalytically inactive HAO2, with subcellular fractionation confirming the
    peroxisomal matrix pool.
