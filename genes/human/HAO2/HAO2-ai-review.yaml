- id: PMID:10777549
  title: Identification and characterization of HAOX1, HAOX2, and HAOX3, three human
    peroxisomal 2-hydroxy acid oxidases.
  findings:
  - statement: The original human HAOX family characterization showed that HAOX2
      is peroxisomal, expressed mainly in liver and kidney, and preferentially oxidizes
      2-hydroxypalmitate among the assayed substrates.
    supporting_text: HAOX2 is expressed predominantly in liver and kidney and displays
      highest activity toward 2-hydroxypalmitate.
  - statement: The same abstract frames human HAOX1, HAOX2 and HAOX3 as peroxisomal
      2-hydroxy fatty acid oxidases that may contribute to fatty acid alpha-oxidation.
    supporting_text: These results indicate that all three human 2-hydroxy acid
      oxidases are involved in the oxidation of 2-hydroxy fatty acids and may also
      contribute to the general pathway of fatty acid alpha-oxidation.
