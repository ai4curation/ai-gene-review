  label: Homo sapiens
description: HAO2 (hydroxyacid oxidase 2; HAOX2) is a soluble peroxisomal FMN-dependent
  2-hydroxy-acid oxidase of the FMN-dependent alpha-hydroxy acid dehydrogenase
  family. Human HAO2 is expressed mainly in liver and kidney, forms a homotetramer,
  carries a C-terminal peroxisome-targeting signal, and is imported to the peroxisomal
  matrix through the PEX5 cargo pathway. It oxidizes medium- and long-chain 2-hydroxy
  fatty acids, including 2-hydroxyhexadecanoate and 2-hydroxyoctanoate, to the
  corresponding 2-oxoacids with molecular oxygen as the likely physiological electron
  acceptor and hydrogen peroxide as coproduct. This specificity differs from the
  related hepatic paralog HAO1/glycolate oxidase, which prefers glycolate and can
  also oxidize glyoxylate.
