id: Q9BS18
gene_symbol: ANAPC13
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ANAPC13 (APC13, Swm1 in budding yeast) is a small, conserved core subunit of the anaphase-promoting
  complex/cyclosome (APC/C), the E3 ubiquitin ligase that drives mitotic and meiotic progression by marking
  cyclins, securin and other cell-cycle regulators for proteasomal destruction. APC13 sits in the TPR
  lobe of the complex, beside APC16 and CDC26, and holds the TPR subunits CDC16 and CDC27 in the APC/C;
  without it, ligase activity falls and APC/C-dependent cell-cycle events are delayed. Biallelic ANAPC13
  mutations cause female infertility with oocytes arrested at metaphase I, a defect reproduced in knock-in
  mice.
