- term:
    id: GO:0005634
    label: nucleus
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0191
  review:
    summary: Nucleus (UniProt SubCell IEA). Plausible for an APC/C subunit, but direct human evidence
      is mixed; kept as non-core.
    action: KEEP_AS_NON_CORE
    reason: UniProt's basis is curator inference (ECO:0000305). The yeast ortholog is nuclear [PMID:10022899
      "We propose that Swm1p, a nuclear protein, would participate"], and the APC/C acts on nuclear substrates.
      But overexpressed wild-type human APC13 was mainly cytoplasmic in HEK293T cells [PMID:40238067 "In
      the case of APC13, we conducted cellular transfection assays and immunofluorescence, revealing that
      the missense mutated APC13 variant predominantly localized to the nucleus, in contrast to the wild-type
      protein, which was primarily found in the cytoplasm"]. The location is defensible but not established
      for human APC13.
    supported_by:
    - reference_id: PMID:10022899
      supporting_text: We propose that Swm1p, a nuclear protein, would participate
    - reference_id: PMID:40238067
      supporting_text: In the case of APC13, we conducted cellular transfection assays and immunofluorescence,
        revealing that the missense mutated APC13 variant predominantly localized to the nucleus, in contrast
        to the wild-type protein, which was primarily found in the cytoplasm
- term:
    id: GO:0005680
    label: anaphase-promoting complex
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: part_of
  supporting_entities:
  - PANTHER:PTN002010391
  - UniProtKB:Q9BS18
  review:
    summary: Part of the anaphase-promoting complex. APC13 is a constitutive core subunit; accepted.
    action: ACCEPT
    reason: APC13 is a small core APC/C subunit; the human protein associates with APC/C subunits and
      complements the yeast deletion [PMID:15060174 "Both the human and the fission yeast homologues are
      associated with APC/C subunits, and they complement the phenotype of an SWM1 deletion mutant of
      budding yeast."]. It holds the TPR subunits CDC16 and CDC27 in the complex [PMID:15060174 "Swm1/Apc13
      promotes the stable association with the APC/C of the essential subunits Cdc16 and Cdc27."]. The
      yeast ortholog is present in the APC/C throughout the cell cycle [PMID:12609981 "indicating that
      they are constitutive components of the complex throughout the yeast cell cycle"].
    supported_by:
    - reference_id: PMID:15060174
      supporting_text: Both the human and the fission yeast homologues are associated with APC/C subunits,
        and they complement the phenotype of an SWM1 deletion mutant of budding yeast.
    - reference_id: PMID:15060174
      supporting_text: Swm1/Apc13 promotes the stable association with the APC/C of the essential subunits
        Cdc16 and Cdc27.
    - reference_id: PMID:12609981
      supporting_text: indicating that they are constitutive components of the complex throughout the
        yeast cell cycle
    propagation_review:
      root_cause: NO_FAILURE_CORE
      residue_claims_not_applicable: APC13 is a non-catalytic subunit; the propagated term makes no residue-level
        claim.
