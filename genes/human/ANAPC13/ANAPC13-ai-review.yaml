- id: file:genes/human/ANAPC13/ANAPC13-deep-research-affinage.md
  title: Affinage mechanistic annotation for ANAPC13 (human)
  findings: []
  reference_review:
    relevance: MEDIUM
    review_notes: 'Trust gates clear. Its core narrative (TPR-lobe stabilization, Arc Lamp position, oocyte
      arrest) matches the cited papers; PMID:15060174, PMID:12609981, PMID:25490258, PMID:41997520 and
      PMID:40238067 are used here. Not used: the yeast sporulation and cell-wall roles (PMID:10022899
      apart from Swm1p''s nuclear location, and PMID:15135545), which are yeast-specific and are not propagated
      to human; and the SF3B1/Treg paper (PMID:39303038), which concerns ANAPC13 expression levels. Its
      proposed MFs are not adopted: catalytic activity does not fit a non-catalytic subunit, and molecular
      adaptor activity is parked as a suggested question.'
