- term:
    id: GO:0051445
    label: regulation of meiotic cell cycle
  evidence_type: NAS
  original_reference_id: PMID:15678131
  qualifier: involved_in
  review:
    summary: Regulation of meiotic cell cycle (NAS, review). Now supported by human and mouse genetics;
      accepted.
    action: ACCEPT
    reason: 'The APC/C has essential functions in meiosis [PMID:16364912 "essential functions in mitosis,
      meiosis, and G1 phase of the cell cycle"]. Biallelic ANAPC13 mutations arrest human oocytes at metaphase
      I [PMID:41997520 "We identified 2 biallelic ANAPC13 mutations (NM_001242374.1: c.6C>A; p.D2E and
      c.71T>G; p.L24R) in 3 infertile females with oocyte maturation arrest at metaphase I."], and a knock-in
      mouse reproduces the arrest [PMID:41997520 "Our study demonstrated the critical role of ANAPC13
      in human and mouse oocyte maturation"]. A second cohort of infertile women also carries ANAPC13
      variants [PMID:40238067 "Several variants related to APC/C genes were screened in these three families
      covering CDC23 and APC13"], including the same p.D2E change, so it is a second family rather than
      an independent allele.'
    supported_by:
    - reference_id: PMID:16364912
      supporting_text: essential functions in mitosis, meiosis, and G1 phase of the cell cycle
    - reference_id: PMID:41997520
      supporting_text: 'We identified 2 biallelic ANAPC13 mutations (NM_001242374.1: c.6C>A; p.D2E and
        c.71T>G; p.L24R) in 3 infertile females with oocyte maturation arrest at metaphase I.'
    - reference_id: PMID:41997520
      supporting_text: Our study demonstrated the critical role of ANAPC13 in human and mouse oocyte maturation
    - reference_id: PMID:40238067
      supporting_text: Several variants related to APC/C genes were screened in these three families covering
        CDC23 and APC13
