proposed_new_terms: []
suggested_questions:
- question: Should small TPR-lobe subunits that hold other subunits in place (APC13, CDC26, APC16) get
    a scaffold or adaptor MF such as GO:0060090 molecular adaptor activity, or is contributes_to ubiquitin
    protein ligase activity the right convention?
- question: Why do ANAPC13 loss-of-function alleles arrest oocytes at metaphase I while somatic cells
    proliferate? Is the oocyte APC/C more sensitive to TPR-lobe destabilization?
suggested_experiments:
- description: Purify APC/C from wild-type and Anapc13 knock-in oocytes or cells and quantify CDC16/CDC27
    occupancy and ubiquitination activity.
