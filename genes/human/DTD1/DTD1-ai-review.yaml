- term:
    id: GO:0106026
    label: Gly-tRNA(Ala) deacylase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000116
  qualifier: enables
  supporting_entities:
  - RHEA:53744
  review:
    action: REMOVE
    summary: >-
      Gly-tRNA(Ala) editing is a conserved DTD activity that uses the same active site
      as chiral proofreading, which is incomplete in this truncated product.
    reason: >-
      DTD acts on achiral glycine precisely because the Gly-cisPro pocket rejects only
      L-chiral side chains; this activity is conserved across bacterial and eukaryotic
      DTDs and is properly a function of the canonical DTD1 protein. A0A2R8YCT7 lacks
      the Gly-cisPro motif and the final beta strand, so the Rhea-based transfer is not
      supported for this gene model.
