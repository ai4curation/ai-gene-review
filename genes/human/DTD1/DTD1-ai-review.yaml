id: A0A2R8YCT7
gene_symbol: DTD1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: DTD1 encodes D-aminoacyl-tRNA deacylase, also known as the DNA-unwinding element-binding
  protein DUE-B. The 127-residue human product A0A2R8YCT7 retains an N-terminal portion of the 209-residue
  reference but ends before the conserved Gly-cisPro substrate-selection motif. Its biochemical activity
  is unresolved; the tRNA-editing and DNA-binding functions established for larger DTD1 constructs cannot
  be assumed for this product.
existing_annotations:
