- term:
    id: GO:0006399
    label: tRNA metabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: involved_in
  supporting_entities:
  - UniRule:UR000000476
  review:
    action: MARK_AS_OVER_ANNOTATED
    summary: The DTD1 gene takes part in tRNA metabolism through D-aminoacyl-tRNA editing, a process GO
      Central assigns to canonical DTD1 by IBA. This product cannot carry out the editing chemistry, so
      the process transfer goes beyond what it can do.
    reason: The process annotation rests on the deacylase activity, which this truncated product lacks
      (see the GO:0002161 row). Because no deacylation step is possible, A0A2R8YCT7 does no part of the
      work of tRNA metabolism. A dominant-negative or heterodimer role has never been tested. The term
      is true of the gene and stays appropriate for Q8TEA8, but it is over-annotated on this gene model.
    supported_by:
