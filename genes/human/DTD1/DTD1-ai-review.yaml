  review:
    action: UNDECIDED
    summary: The cytoplasm assignment comes from a family-level rule. For the canonical human protein,
      cytoplasm is itself only by similarity, and nuclear and chromatin localization have been shown experimentally.
    reason: No localization data exist for A0A2R8YCT7. Its transcript is annotated as an NMD target (file:human/DTD1/DTD1-bioinformatics/RESULTS-rereview.md),
