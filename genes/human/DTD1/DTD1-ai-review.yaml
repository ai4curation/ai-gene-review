  review:
    action: REMOVE
    summary: >-
      The InterPro DTD signature matches the shared N-terminal segment, but this
      product of an NMD-biotype transcript ends at residue 127 and lacks the beta strand
      131-146 and the Gly139-cisPro140 motif that complete the dimeric editing site.
    reason: >-
      Aminoacyl-tRNA deacylation is a well established function of the DTD1 gene
      (canonical Q8TEA8, PANTHER PTHR10472:SF5, PAINT node PTN000049487), but the
      family signature transfer is wrong for this particular gene model. The DTD active
      site is built across the two subunits of a dimeric beta-barrel, and the
      cross-subunit Gly-cisPro element that captures the substrate chiral centre lies
      in the segment deleted here. The transcript encoding A0A2R8YCT7 is annotated by
      Ensembl as a nonsense-mediated decay target, so the product may not accumulate at
      all. The gene-level function remains annotated on Q8TEA8; it should not be
      asserted for this truncated product.
