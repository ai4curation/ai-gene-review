- term:
    id: GO:0006399
    label: tRNA metabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: involved_in
  supporting_entities:
  - UniRule:UR000000476
  review:
    action: UNDECIDED
    summary: The gene encodes a tRNA editor, but this product lacks an essential substrate-selection element.
      A noncatalytic contribution to tRNA metabolism is conceivable but untested; the broad process cannot
      be resolved from the remaining N-terminal sequence.
    supported_by:
    - *id001
    - *id003
- term:
    id: GO:0051499
    label: D-aminoacyl-tRNA deacylase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - InterPro:IPR003732
  - RHEA:13953
  - EC:3.1.1.96
  review:
    action: REMOVE
    summary: The DTD1-family assignment is sound, but the selected sequence terminates before the Gly-cisPro
      motif required to form the conserved chiral proofreading site. The full-length editing activity
      is not transferable to this incomplete product.
    supported_by:
    - *id001
    - *id003
    - *id002
- term:
    id: GO:0106026
    label: Gly-tRNA(Ala) deacylase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000116
  qualifier: enables
  supporting_entities:
  - RHEA:53744
  review:
    action: REMOVE
    summary: Gly-tRNA(Ala) deacylation requires a functional DTD editing pocket. The selected sequence
      lacks the reference Gly-cisPro substrate-selection motif, so this specific catalytic assignment
      is not justified by an intact family mechanism. No alternative catalytic mechanism is demonstrated.
    supported_by:
    - *id001
    - *id003
- term:
    id: GO:0106074
    label: aminoacyl-tRNA metabolism involved in translational fidelity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  supporting_entities:
  - GO:0002161
  - GO:0051499
  - GO:0106026
  review:
    action: UNDECIDED
    summary: Aminoacyl-tRNA proofreading is established for the DTD1 gene, but contribution of this 127-residue
      form to translational fidelity is unresolved because it lacks the conserved editing motif. This
      broad process is not rejected solely from the absence of an exact-product assay.
    supported_by:
    - *id002
    - *id001
