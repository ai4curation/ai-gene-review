id: A0A2R8YCT7
gene_symbol: DTD1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  DTD1 encodes D-aminoacyl-tRNA deacylase 1 (also called DUE-B), a homodimeric
  trans-editing enzyme of the conserved DTD family that hydrolyses D-aminoacyl-tRNAs
  and mischarged Gly-tRNA(Ala), keeping D-amino acids and glycine-for-alanine errors
  out of translation. Its active site lies at the dimer interface, where an invariant
  cross-subunit Gly-cisPro motif rejects L-aminoacyl-tRNAs. The canonical 209-residue
  human protein also carries a disordered basic C-terminal region that binds DNA, and
  it has been reported at the nuclear envelope and at replication origins together with
  CDC45 and TOPBP1. The entry A0A2R8YCT7 is a 127-residue product predicted from an
  alternative DTD1 transcript annotated as a nonsense-mediated decay target: it is
  identical to the canonical protein for residues 1-124, then ends with a short
  alternative tail, and lacks the last beta strand of the DTD fold, the Gly-cisPro
  motif and the entire C-terminal DNA-binding region. Whether this product accumulates
  in cells or has any activity is unknown.
