    label: tRNA metabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: involved_in
  supporting_entities:
  - UniRule:UR000000476
  review:
    action: REMOVE
    summary: >-
      The UniRule transfer rests on the DTD catalytic function; this truncated
      product lacks the editing-site elements, so it is not shown to do any step of tRNA
      metabolism.
    reason: >-
      Participation in tRNA metabolism for DTD proteins means hydrolysing
      D-aminoacyl-tRNA or Gly-tRNA(Ala). The canonical DTD1 carries this process by IBA
      (PTN000049487) and that is correct. A0A2R8YCT7 lacks the C-terminal beta strand
      and the Gly-cisPro motif needed to form the dimeric active site, and is encoded by
      an NMD-biotype transcript; a non-catalytic contribution (for example, as a
      heterodimer partner of the full-length protein) is untested. With the catalytic
      function removed, there is no basis for the process on this product.
    supported_by:
