id: A0A2R8YCT7
gene_symbol: DTD1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: DTD1 encodes D-aminoacyl-tRNA deacylase 1 (also called DUE-B), a member of the DTD family
  (PANTHER PTHR10472:SF5) of dimeric trans-acting tRNA editing enzymes. The canonical 209-residue product
  (UniProt Q8TEA8) hydrolyses D-aminoacyl-tRNAs and mischarged Gly-tRNA(Ala); chiral selection depends
  on a Gly-cisPro dipeptide that one subunit donates to the active site of the other at the dimer interface.
  The human protein also carries a disordered, vertebrate-specific C-terminal extension that is needed
  for DNA binding and has been linked to replication-origin binding and Cdc45 loading. A0A2R8YCT7 is
  a 127-residue protein predicted from an Ensembl nonsense-mediated-decay transcript (ENST00000647441)
  that includes an extra 47-nt cassette exon. It is identical to canonical residues 1-124, then ends
  with a frameshifted Thr-Leu-Phe tail. It therefore lacks the final core beta-strand (residues 131-146),
  the NxGP(V/F)T motif carrying the Gly139-Pro140 chiral-selection dipeptide, and the whole C-terminal
  DNA-binding extension. No activity, localization or stable expression has been shown for this product
  specifically.
existing_annotations:
- term:
    id: GO:0002161
    label: aminoacyl-tRNA deacylase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR003732
  review:
    action: REMOVE
    summary: InterPro2GO transfer from the DTD domain signature (IPR003732). The DTD1 gene clearly encodes
      an aminoacyl-tRNA deacylase. This product, though, is a truncated NMD-transcript translation that
      lacks the part of the fold the editing site needs.
    reason: PANTHER places DTD1 in SF5 (D-aminoacyl-tRNA deacylase 1), and deacylase activity is an ancestral
      property of the DTD family. The truncation is specific to this product, which is the only reason
      the transfer fails here. In the DTD dimer the two active sites sit at the subunit interface, and
      each subunit donates an invariant Gly-cisPro dipeptide to its partner's pocket (PMID:24302572).
      In human DTD1 that dipeptide is Gly139-Pro140, inside the NxGP(V/F)T motif (QNDGPVT, 136-142) and
      the final core beta-strand (131-146) seen in the 2OKV structure of the active N-terminal core (PMID:17264083).
      A0A2R8YCT7 diverges after residue 124 and has none of these elements (file:human/DTD1/DTD1-bioinformatics/RESULTS-rereview.md).
      The product therefore cannot form the deacylase active site. The activity belongs to the canonical
      product Q8TEA8, not to this one. The general term is removed for the same reason as its child GO:0051499,
      so the two rows are consistent.
    supported_by:
