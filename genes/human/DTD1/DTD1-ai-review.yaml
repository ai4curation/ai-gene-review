  review:
    action: REMOVE
    summary: RHEA-based transfer of glycyl-tRNA(Ala) deacylation. In the DTD family this activity uses
      the same Gly-cisPro-dependent active site as D-aminoacyl-tRNA deacylation, and that site is incomplete
      in this product.
    reason: Gly-tRNA(Ala) clearance by DTD uses the same dimer-interface pocket as D-aminoacyl-tRNA hydrolysis.
      Even for canonical human DTD1, UniProt asserts this activity by similarity to Plasmodium DTD (Q8IIS0).
      A0A2R8YCT7 lacks the Gly-cisPro-bearing strand (file:human/DTD1/DTD1-bioinformatics/RESULTS-rereview.md),
      so the activity cannot be transferred to it.
