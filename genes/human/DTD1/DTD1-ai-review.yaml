core_functions: []
suggested_questions:
- question: Is the ENST00000647441 transcript (extra 47-nt exon between canonical exons 3 and 4) translated
    at detectable levels, or is it efficiently removed by nonsense-mediated decay? Proteomics peptides
    mapped to A0A2R8YCT7 fall within residues shared with Q8TEA8, so they do not show that this product
    exists.
- question: Could a 1-124 DTD1 fragment heterodimerize with full-length DTD1 and act as a dominant-negative
    regulator of D-aminoacyl-tRNA editing?
suggested_experiments:
- description: Use isoform-specific RT-qPCR with and without NMD inhibition (UPF1 knockdown or cycloheximide)
    to measure ENST00000647441, and use targeted proteomics for the unique C-terminal ...KDTLF peptide
    junction to test whether the product accumulates.
- description: Express the 1-124+TLF product recombinantly and test its folding, dimerization and D-Tyr-tRNA(Tyr)
    deacylation, with full-length DTD1 as positive control and alone or co-expressed with it.
