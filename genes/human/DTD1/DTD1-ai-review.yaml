    label: aminoacyl-tRNA deacylase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR003732
  review:
    action: REMOVE
    summary: The selected 127-residue product lacks the conserved cross-subunit Gly-cisPro motif of the
      DTD editing pocket. Human DTD1 editing activity was measured for a larger N-terminal core, not this
      truncated product. Domain-family matching does not support a complete aminoacyl-tRNA deacylase activity
      in A0A2R8YCT7.
    supported_by:
    - &id002
      reference_id: PMID:17264083
      supporting_text: 'the N-terminal

        core of DUE-B is shown to display both D-aminoacyl-tRNA deacylase activity and

        ATPase activity.'
    - &id003
      reference_id: PMID:24302572
      supporting_text: 'how it uses an invariant

        ''cross-subunit'' Gly-cisPro dipeptide to capture the chiral centre of incoming

        D-aminoacyl-tRNA.'
