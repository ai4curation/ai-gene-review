core_functions:
- description: 'AFF1 is the scaffolding subunit of one branch of the super elongation complex. It binds
    the CDK9-cyclin T (P-TEFb) kinase module constitutively and, through a short motif that folds only
    on binding, grips the AF9 ANC1-homology domain with sub-nanomolar affinity, joining P-TEFb to the
    AF9/ENL and ELL/EAF modules. Holding those modules together is what the complex needs from AFF1: a
    single acetylation-mimicking substitution in AFF1 loses SEC assembly and, with it, P-TEFb-dependent
    phosphorylation of the RNA polymerase II C-terminal domain, so paused polymerase is not released into
    productive elongation.'
