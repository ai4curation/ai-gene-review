- term:
    id: GO:0005515
    label: protein binding
  qualifier: enables
  evidence_type: IPI
  original_reference_id: PMID:21729782
  supporting_entities:
  - UniProtKB:P42568
  review:
    summary: 'Replace with an informative molecular function. The partner is MLLT3/AF9 (P42568), captured
      here in the MED26 study''s co-purification of SEC with Mediator; the reference-projection test returns
      26 annotations over 17 entities, all GO:0005515, so this is one interaction network rather than
      a targeted binary assay. Judged per partner rather than per gene: this row and the PMID:23260655
      row name the same partner and get the same verdict, while the HIV-1 Tat row is decided separately.'
    action: MODIFY
    reason: 'AF9 is a verified partner by every available standard: five orthogonal detection methods
      in IntAct (NMR, circular dichroism, gel filtration, pull-down, tagged co-immunoprecipitation) across
      two publications, a deposited NMR structure (PDB 2LM0), and a dissociation constant of 0.17 nM -
      an order of magnitude tighter than AF9''s other known ligands measured in the same experiment. So
      the problem with the row is not the partner, it is that bare protein binding records nothing about
      what the interaction accomplishes. What it accomplishes is bridging: AFF1 contacts AF9 through residues
      761-774 and the P-TEFb kinase module through a separate region, and a single acetyl-mimic substitution
      in AFF1 is sufficient to lose SEC assembly and Pol II CTD phosphorylation. That is adaptor activity
      as GO defines it - bringing two or more macromolecules into contact so they can act in a coordinated
      way. This row contributes the in-cell half of that case: AFF1 and AF9 co-purify with Mediator on
      chromatin, which is where the bridging matters. Recorded for a curator''s eye rather than as an
      objection: the same reference set led UniProt to assign GO:0060090 molecular adaptor activity to
      AF9 itself. That is not double counting - AF9''s AHD is the hub competed for by Dot1L, BCoR and
      hPC3, while AFF1 is the hub joining P-TEFb to the ELL/EAF module - but the symmetry is worth checking.'
    proposed_replacement_terms:
    - id: GO:0030674
      label: protein-macromolecule adaptor activity
    supported_by:
    - reference_id: PMID:21729782
      supporting_text: Reactivation of paused Pol II correlates with recruitment of super-elongation complexes
        (SECs) containing ELL/EAF family members, P-TEFb, and other proteins
    - reference_id: PMID:31611376
      supporting_text: Reexpression of wild-type AFF1, but not an acetylation mimic mutant, restores SEC
        component recruitment and target gene expression in AFF1 knockdown cells.
- term:
    id: GO:0005515
    label: protein binding
  qualifier: enables
  evidence_type: IPI
  original_reference_id: PMID:22190034
  supporting_entities:
  - UniProtKB:P04608
  review:
    summary: 'Kept as a real but non-core host-pathogen interaction. The partner is HIV-1 Tat (P04608),
      from a systematic affinity-purification survey of all 18 HIV-1 proteins; the projection test returns
      183 annotations over 104 distinct entities, all GO:0005515. Expanding the IntAct records rather
      than trusting UniProt''s NbExp=3: the three records come from ONE publication, logged as two sub-methods
      in two cell lines (HEK293T and Jurkat) at MI-score 0.56. So NbExp=3 is again counting sub-methods,
      not independent experiments.'
    action: KEEP_AS_NON_CORE
    reason: 'The interaction is not screen noise: AFF1''s role in Tat-dependent HIV transactivation is
      independently established, and the two-cell-line replication is part of that study''s design. But
      it is not a core cellular function of AFF1, and the molecular detail is genuinely open - the corroborating
      study''s stated mechanism is that AFF1 raises Tat''s affinity for cyclin T1, which does not establish
      a direct AFF1-Tat contact, and AFF1 has no Tat co-structure (2LM0, its only PDB entry, is the AF9
      complex). Bare protein binding is uninformative, but no better molecular-function term exists for
      a virus-host bridging role, so this is kept rather than modified.'
    supported_by:
    - reference_id: PMID:22190034
      supporting_text: we report the use of affinity tagging and purification mass spectrometry to determine
