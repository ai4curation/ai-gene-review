- term:
    id: GO:0010468
    label: regulation of gene expression
  qualifier: involved_in
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  supporting_entities:
  - InterPro:IPR007797
  review:
    summary: Sound but one level too coarse. This comes from InterPro2GO via IPR007797, the AF4/FMR2 family
      signature. PAINT gives that same family GO:0006355 - one level more specific - so two automatic
      pipelines assign different granularities to the same family from the same evidence base, and GO:0010468
      was verified to be a genuine ancestor of GO:0006355, making it strictly redundant on this gene.
    action: MODIFY
    reason: The argument is upstream, about the mapping, not about this gene. Every characterised member
      of the AF4/FMR2 family regulates transcription specifically, not gene expression at some unspecified
      step - none has a reported role in translation, RNA stability or any other post-transcriptional
      layer, and the family's defining biochemistry is occupancy of a transcription-elongation complex.
      So IPR007797 supports the more precise term for every protein it matches, and the mapping is what
      should move. On THIS gene the row is redundant either way - today it is an ancestor of the GO:0006355
      the gene already holds by IBA, and after the refinement it would duplicate that row exactly - so
      no gene-level redundancy is removed by the change, and the family-wide precision gain is the whole
      of the case for it.
