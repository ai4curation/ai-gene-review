    label: nervous system process
  qualifier: involved_in
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  supporting_entities:
  - FB:FBgn0041111
  - MGI:MGI:1202294
  - PANTHER:PTN000829417
  review:
    summary: 'Kept, but not as a core function. Both experimental donors reach this term from below: Drosophila
      lilli and mouse Aff2 each carry GO:0007611 learning or memory by IMP, a descendant, and PAINT generalised
      to the organ-system parent rather than transferring the specific term - which is the conservative
      and correct move, since neither learning nor memory has been assayed for human AFF1. There is no
      human AFF1 nervous-system experiment at all.'
    action: KEEP_AS_NON_CORE
    reason: 'AFF1''s own nervous-system link is a mouse phenotype: the robotic allele carries a missense
      change in a conserved region of Af4 and the mice show region-specific Purkinje-cell loss with ataxia,
      with Igf-1 identified by ChIP as a target - attributed by those authors to "the AF4 transcriptional
      regulatory complex" rather than to Af4 alone. Stated at the strength the papers state it: the 2003
      study is explicit that the causal step is hypothesised rather than demonstrated. That evidence is
      real but it is (i) mouse, (ii) a dominant missense allele in which Af4 accumulates, so a gain-of-function
      rather than a loss of function, and (iii) downstream of the same transcription-elongation activity
      captured by the core rows. The discriminator against core function 3, which uses similar tissue-specific-output
      language and is nevertheless kept as core, is the evidence and not the tissue-specificity: the DKK1
      axis rests on direct human loss- AND gain-of-function in the relevant cell type with a mapped intermediate
      whose removal abolishes the effect, whereas this row has no human data at all and its mouse support
      is a dominant gain-of-function allele with no identified mechanism. MARK_AS_OVER_ANNOTATED is a
      defensible reading on the same facts and a curator may prefer it; KEEP_AS_NON_CORE is chosen because
      the term is not wrong - PAINT deliberately generalised from two independent learning-or-memory IMPs
      rather than transferring them, which is sound practice - and over-annotated would mis-describe a
      correct conservative call as an over-reach. Note for upstream curation: mouse Aff1 is NOT among
      this row''s donors and MGI has annotated no nervous-system term to it, so the claim reaches human
      AFF1 through its paralogues while the ortholog''s own relevant phenotype is uncaptured.'
    supported_by:
