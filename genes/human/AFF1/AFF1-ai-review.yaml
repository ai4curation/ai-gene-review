    subunits and lowers polymerase II C-terminal domain phosphorylation genome-wide; PARP1 then binds
    AFF1 and poly(ADP-ribosyl)ates it in the region the E3 ligase Siah1 targets, blocking its ubiquitination
    and stabilising it, which supports the resumption of transcription. Cells lacking AFF1 repair DNA
    and survive genotoxic stress poorly.
