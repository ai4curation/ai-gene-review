    AF-4, the gene fused to MLL in t(4;11) leukemias.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: 'PubMed-verified, and titled for the paralog LAF-4/AFF3 - which is why no AFF1-keyed
      search surfaces it. It reports that AF-4 as well as LAF-4 has a domain that transactivates when
