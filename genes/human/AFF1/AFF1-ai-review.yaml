gene_symbol: AFF1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'AFF1 (also called AF4, and the founding member of the AF4/FMR2 family) is a large nuclear
  protein, about three-quarters of whose 1210 residues are intrinsically disordered, that works as a scaffold
  rather than as an enzyme or a sequence-specific DNA-binding factor. It is the subunit that holds together
  one branch of the super elongation complex: it is constitutively bound to the CDK9-cyclin T kinase P-TEFb
  and is present in every major P-TEFb assembly, and a short motif in its middle folds onto the ANC1-homology
  domain of AF9 with sub-nanomolar affinity, tying P-TEFb to the AF9/ENL and ELL/EAF modules on chromatin.
  Through that complex AFF1 promotes the release of promoter-paused RNA polymerase II into productive
  elongation, which depends on P-TEFb phosphorylating the polymerase C-terminal domain. Its own abundance
  and modification state make it a control point rather than a passive strut: p300 acetylation loosens
  the complex and shuts transcription down soon after DNA damage, while PARP1-dependent poly(ADP-ribosyl)ation
  protects AFF1 from Siah1-directed ubiquitination and supports transcriptional restart, and cells short
  of AFF1 repair DNA and survive genotoxic stress poorly. Its gene-specific outputs include the Wnt antagonist
  DKK1, through which AFF1 restrains osteoblast differentiation in mesenchymal stromal cells - the opposite
  of what its closest paralogue AFF4 does there. AFF1 is also the most frequent partner fused to KMT2A/MLL
  by the t(4;11)(q21;q23) translocation of infant acute lymphoblastic leukaemia; the resulting chimera
  is a distinct oncoprotein, and its properties are not simply those of the wild-type protein.'
