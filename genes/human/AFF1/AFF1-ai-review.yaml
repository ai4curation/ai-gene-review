- id: file:human/AFF1/AFF1-deep-research-affinage.md
  title: Affinage mechanistic annotation for AFF1 (human)
  reference_review:
    relevance: LOW
    correctness: LOW_QUALITY
    review_notes: 'Adjudicated and deliberately not used as evidence anywhere in this review; recorded
      here so the judgement lives in the repository. Its gates_passed: True and faith_pct: 100.0 concern
      PRECISION - the 23 citations are all well-formed numeric PMIDs with no preprint ids in PMID-shaped
      fields. Recall was measured, not estimated: of the 7 PMIDs that AFF1''s GOA rows actually cite,
      affinage returned 0, including the 2026 paper behind 7 of the 20 rows (computed in RESULTS.md section
      G). Four substantive defects: two cited papers carry unflagged corrections (PMID:28955517 -> PMID:32257529;
      PMID:17135274 -> PMID:37777189); the claim that AFF1 recruits DOT1L is contradicted by PMID:20159561;
      a stated hypothesis in PMID:12629167 is reported as demonstrated causation; and a result PMID:20007461
      attributes to "the AF4 transcriptional regulatory complex" is attributed to Af4 alone. LOW_QUALITY
      refers to this record as a source, not to the underlying papers.'
proposed_new_terms:
- proposed_name: transcriptional restart after DNA damage
  proposed_definition: The resumption of RNA polymerase II transcription following the transcriptional
    shutdown that DNA damage induces, once lesions have been repaired or bypassed.
  proposed_parent:
    id: GO:0006974
    label: DNA damage response
  justification: 'GO has no term for this process. Verified on a working endpoint rather than inferred
    from an empty search: a control query for "super elongation complex" returns GO:0032783 first, five
    phrasings of the restart concept return nothing relevant, and none of the 96 is_a/part_of descendants
    of GO:0006974 has "recover", "restart" or "resum" in its name. The consequence is visible in this
    gene''s record: the one process that PMID:41062835 and PMID:31611376 jointly describe - AFF1 acetylation
    shutting SEC down early after genotoxic stress, AFF1 PARylation stabilising it for recovery - has
    to be expressed as an unrelated pair of terms, GO:0006974 plus GO:0032968, which loses the fact that
    AFF1 is the switch for both halves. The field treats recovery as a distinct, separately assayed phase
    of the damage response, so a child of GO:0006974 would let it be annotated as one process.'
  supported_by:
  - reference_id: PMID:41062835
    supporting_text: Upon DNA damage, PARP1 binds to and PARylates AFF1 in a region targeted by the E3
      ligase Siah1, preventing AFF1 ubiquitination and promoting its stability. This stabilization supports
      efficient transcriptional recovery after DNA damage.
  - reference_id: PMID:31611376
    supporting_text: we show that site-specific acetylation of super elongation complex (SEC) subunit
      AFF1 by p300 reduces its interaction with other SEC components and impairs P-TEFb-mediated C-terminal
      domain phosphorylation of RNA polymerase II both in vitro and in vivo
suggested_questions:
- question: 'PAINT/UniProt curation, stated once for all affected genes: PMID:22195968 gives GO:0032783
    super elongation complex to 10 Drosophila recipients and only the generic parent GO:0008023 to all
    eleven of its human recipients - AFF1, AFF4, CDK9, ELL, ELL2, ELL3, EAF1, EAF2, MLLT1, MLLT3 and ICE2
    - even though UniProt''s own reference table records the paper''s contribution as "IDENTIFICATION
    IN THE SEC COMPLEX". The consequence is a detour: Drosophila lilli''s GO:0032783 IPI from this paper
    is the donor of human AFF1''s GO:0032783 IBA, so the specific term reaches the human gene by phylogenetic
    inference from a fly protein annotated in the same experiment. Would GOA consider refining the human
    rows at the reference, which would fix eleven gene products in one edit? Note the split is not purely
    clade-based - Drosophila Ell also received only the parent - so this is a per-annotation gap rather
    than a rule about clades.'
  experts:
  - GOA/UniProt curators
  - GO Central PAINT curators
- question: PANTHER node PTN000829417 assigns, to the same 79 recipients, both GO:0032783 - whose definition
    is explicitly about RNA polymerase II elongation - and the polymerase-agnostic GO:0006354. Since every
    characterised SEC substrate is Pol II, would PAINT consider moving the process term to GO:0006368
    transcription elongation by RNA polymerase II at the node, which would refine all four human AFF paralogues
    at once? Separately, InterPro2GO gives the same family GO:0010468 via IPR007797 while PAINT gives
    GO:0006355, so the two pipelines differ by one level on the same family.
  experts:
  - GO Central PAINT curators
  - InterPro2GO curators
- question: 'MGI curation gap: the AFF1-specific nervous-system literature is a mouse phenotype - the
    robotic allele stabilises Af4 and causes Purkinje-cell loss with ataxia (PMID:12629167), with Af4
    regulating Igf-1 in Purkinje cells (PMID:20007461) - yet mouse Aff1 carries no nervous-system term,
    and human AFF1''s GO:0050877 IBA therefore rests on the paralogues Aff2 and lilli instead of on the
    ortholog. Would MGI consider annotating the robotic phenotype?'
  experts:
  - MGI curators
- question: Do AFF1 and AFF4 ever occupy the same super elongation complex? PMID:28955517's discussion
    states they "are not found together in a single SEC" and UniProt models them as alternative occupants
    of one slot ("AFF (AFF1 or AFF4)"), but IntAct records an AFF1-AFF4 physical association across 8
    records and 2 distinct publications at MI-score 0.6, and PMID:20159561's Flag-AFF4 purification recovers
    endogenous AFF1. If they are genuinely mutually exclusive, GO cannot currently say so - GO:0032783
    has no children and ComplexPortal's seven AFF1-containing entries all list AFF1 and AFF4 together.
  experts:
  - transcription elongation biologists
  - ComplexPortal curators
- question: 'UniProt: would a FUNCTION comment be considered for P51825? The entry currently has none,
    despite a solved partner complex, a measured dissociation constant, a curated SUBUNIT line and a 2026
    primary paper on its role in transcriptional recovery. The SUBCELLULAR LOCATION line is also still
    ECO:0000305 curator inference although an experimental IDA now exists (PMID:41062835). Third item,
    raised here because ActionEnum has no qualifier-change action so it cannot be expressed on the row
    itself: GO:0003711 transcription elongation factor activity is annotated with the enables qualifier,
    but the activity is delivered by the assembled SEC and the evidence is an AFF1 knockdown, so contributes_to
    would be the strictly correct qualifier. The term is right; only the qualifier overstates AFF1''s
    independence.'
  experts:
  - UniProt curators
- question: Is AFF1's molecular adaptor role better modelled on AFF1, on AF9, or on both? UniProt assigned
    GO:0060090 molecular adaptor activity to AF9 (P42568) from PMID:23260655, and this review proposes
    GO:0030674 for AFF1 from the same interaction plus the acetyl-mimic rescue. Both proteins are hubs,
    but for different ligand sets, and a curator's view on whether adaptor activity should be annotated
    reciprocally would be useful.
  experts:
  - GO Central curators
  - UniProt curators
suggested_experiments:
- hypothesis: AFF1-containing and AFF4-containing super elongation complexes are mutually exclusive assemblies
    rather than one complex carrying both.
  description: 'Sequential immunodepletion followed by quantitative mass spectrometry: deplete AFF1 from
    nuclear extract to exhaustion, then ask whether the remaining ELL/EAF/P-TEFb/AF9 pool still contains
    AFF4 at near-stoichiometric levels, and repeat in the opposite order. Pair it with single-molecule
    two-colour photobleaching on complexes purified through a third subunit (ELL2 or EAF1) to count AFF1
    and AFF4 copies per particle. This distinguishes genuine co-occupancy from an average over two populations,
    which is what a bulk co-immunoprecipitation cannot do and which is why the current evidence is contradictory.'
  experiment_type: biochemistry
- hypothesis: The bridging function of AFF1 is separable from its abundance, so the transcriptional-restart
    phenotype after DNA damage is caused by loss of SEC assembly rather than by loss of AFF1 protein per
    se.
  description: 'Knock in, at the endogenous locus, the acetylation-mimic and acetylation-defective AFF1
    alleles used in PMID:31611376 together with a PARylation-site mutant of the Siah1-targeted region
    from PMID:41062835, then measure recovery of nascent transcription after UV or camptothecin by TT-seq
    alongside AFF1 protein levels and SEC composition. The informative outcome is a separation: an allele
    that keeps normal AFF1 abundance but fails to recover transcription would show the defect is assembly,
    not dosage.'
  experiment_type: genetics
- hypothesis: AFF1 and AFF4 direct SEC to non-overlapping gene sets, and the osteogenic sign inversion
    between them follows from that target split rather than from different biochemistry.
  description: 'In one human mesenchymal stromal cell background, perform paired degron-mediated acute
    depletion of AFF1 and of AFF4 with TT-seq and Pol II PRO-seq readouts, plus ChIP-seq for each paralogue.
    Then swap the AF9-binding motifs between them and ask whether target selection follows the motif or
    the rest of the protein. A negative control is built in: if the two depletions converge on the same
    genes, the differential osteogenesis result requires another explanation.'
  experiment_type: genomics
- hypothesis: AFF1 contacts HIV-1 Tat directly, rather than only raising Tat's affinity for cyclin T1
    within a ternary complex.
  description: Measure binding of recombinant Tat to purified AFF1 fragments by isothermal titration calorimetry
    and NMR chemical-shift perturbation, with and without cyclin T1 present, and attempt a co-structure
    of the AFF1 region that is not the AF9-binding motif. AFF4-Tat-P-TEFb structures exist and AFF1 has
    none, so the honest current position is that the GO:0005515 row rests on affinity purification and
    a functional requirement, not on a mapped contact.
  experiment_type: structural_biology
- hypothesis: The transactivation activity reported for an AF-4 GAL4 fusion in 1996 reflects a function
    the native protein performs at its own target promoters.
  description: The original result used a GAL4-DNA-binding-domain chimera, so it shows a region can activate
    when artificially tethered and cannot show what AFF1 does natively - which is why no GO term is proposed
    from it here. Test it properly by tethering the same region with a catalytically dead dCas9 to endogenous
    AFF1 target promoters identified by ChIP-seq, and by deleting that region at the endogenous locus
    and measuring nascent transcription of those same promoters.
  experiment_type: genetics
knowledge_gaps:
- gap_statement: Whether AFF1 and AFF4 can occupy the same super elongation complex is unresolved, and
    the evidence points both ways. UniProt models them as alternative occupants of one slot and PMID:28955517's
    discussion states they are not found together, but IntAct records an AFF1-AFF4 association across
    8 records and 2 distinct publications at MI-score 0.6 and PMID:20159561's AFF4 purification recovers
    endogenous AFF1.
  boundary: 'What is settled is that the two paralogues are not functionally interchangeable: depleting
    AFF1 does not destabilise ELL1 or P-TEFb whereas depleting AFF4 does, their SEC target genes are reported
    as largely non-overlapping, and in mesenchymal stromal cells they act in opposite directions on osteogenesis.
    What is not settled is complex stoichiometry, which bulk co-immunoprecipitation cannot decide because
    it averages over populations.'
  gap_kind:
  - BIOLOGY
  dark_aspect: CC_DARK
  status: OPEN
  significance: It determines whether GO:0032783 needs paralogue-specific children. No such children are
    proposed here, because proposing terms for a distinction the evidence does not settle would be an
    over-annotation of the opposite sign.
  provenance:
  - reference_id: file:human/AFF1/AFF1-uniprot.txt
    supporting_text: composed of EAF1, EAF2, CDK9, MLLT3/AF9, AFF (AFF1 or AFF4), the P-TEFb
  - reference_id: PMID:28955517
    supporting_text: Although AFF1 and AFF4 are components of SECs, they may be independently localized
      and are not found together in a single SEC.
  - reference_id: PMID:20159561
    supporting_text: We observed that the reduction of the AFF4 homologue AFF1 does not alter ELL1 and
      P-TEFb stability in these cells
- gap_statement: AFF1's subnuclear distribution is described inconsistently. Older immunofluorescence
    reports discrete punctate compartments ('AF4 bodies') where AF4 and AF9 co-localise, while PMID:28955517's
    discussion describes AFF1 as diffuse and reserves nuclear speckles for AFF4. GOA reflects the uncertainty
    by giving AFF1 no subnuclear term at all, while AFF4 has nucleoplasm and nuclear body and AFF2 has
    nuclear speck.
  boundary: Nuclear localisation itself is settled, by IDA and by immunofluorescence in several cell types.
    Chromatin association is settled, by ChIP at DKK1 and at MYC. What is unresolved is whether AFF1 concentrates
    in a defined subnuclear body.
  gap_kind:
  - BIOLOGY
  dark_aspect: CC_DARK
  status: OPEN
  significance: No subnuclear term is proposed for AFF1 here. The absence of one in GOA appears to be
    appropriate caution rather than a coverage gap.
  provenance:
  - reference_id: file:human/AFF1/AFF1-uniprot.txt
    supporting_text: 'CC   -!- SUBCELLULAR LOCATION: Nucleus {ECO:0000305}.'
  - reference_id: PMID:28955517
    supporting_text: Although AFF1 and AFF4 are components of SECs, they may be independently localized
      and are not found together in a single SEC.
- gap_statement: Whether AFF1 has any molecular function outside a super elongation complex is unknown.
    Every measurement on the protein is made either within SEC or on a short peptide from it, and its
    only solved structure is 42 residues bound to a partner; 901 of its 1210 residues (74.5%) are annotated
    as disordered, most of it with no assigned interaction.
  boundary: The SEC-dependent activity is well established and quantified. What is unmapped is the function
    of the large disordered regions outside the AF9-binding motif and the Siah1/PARylation region - including
    the nine MS-detected phosphosites and one acetylation site, none of which has an assigned consequence.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: This is why GO:0030674 is proposed as the molecular function rather than anything narrower,
    and why the elongation-factor and coregulator terms are recorded as contributions to a complex.
  provenance:
  - reference_id: file:human/AFF1/AFF1-uniprot.txt
    supporting_text: RP   STRUCTURE BY NMR OF 738-779 IN COMPLEX WITH MLLT3.
  - reference_id: PMID:23260655
    supporting_text: 1H-15N heteronuclear NOE experiments show that AF4 residues 761-775 are ordered in
      the complex whereas the remainder is flexible
- gap_statement: What the wild-type AFF1 protein contributes to t(4;11) leukaemogenesis, as distinct from
    the MLL-AFF1 chimera, is not established. The chimera is a different molecule with its own composition,
    and the peptide inhibitor PFWT that kills t(4;11) cells is a synthetic reagent modelled on AFF1's
    AF9-binding domain rather than the gene product.
  boundary: The AF9-binding motif itself is mapped and quantified on wild-type AFF1. What is not separable
    from the current data is which leukaemia phenotypes require the remaining wild-type allele's own activity.
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  status: OPEN
  significance: No GOA row for AFF1 rests on the fusion or on the peptide, which is the correct state;
    this gap records why no leukaemia process term is proposed here.
  provenance:
  - reference_id: PMID:15269783
    supporting_text: we have developed a peptide, designated PFWT, which disrupts the AF4-AF9 interaction
      in vitro and in vivo
  - reference_id: PMID:23260655
    supporting_text: The affinity for AF4 is extremely high (KD = 0.17 ± 0.05 nM)
