core_functions:
- description: Binds regulatory DNA through the DM domain and forms sequence-dependent homomeric assemblies
    to activate or repress gonadal gene expression. This nuclear transcription-factor activity supports
    male differentiation; mouse promoter studies additionally connect it to repression of premature meiotic
    entry. Regulatory direction depends on the target and cell type.
