  review:
    summary: Retain context-specific support for mitotic division in spermatogonia.
    action: KEEP_AS_NON_CORE
    reason: Mouse loss of Dmrt1 depletes mitotically dividing spermatogonia as cells enter meiosis prematurely;
      this supports the curated positive mitotic-regulation assertion in that lineage. It does not establish
      a direct spindle activity or universal stimulation of division. Human primordial germ-cell-like-cell
      induction instead accompanies mitotic arrest at a different developmental state. The 2023 authors
      also caution that high transgene expression and imperfect timing control may accelerate arrest within
      4–8 days; dose and induction schedule limit physiological comparison.
