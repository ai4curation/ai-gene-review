- term:
    id: GO:0006355
    label: regulation of DNA-templated transcription
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR001275
  - InterPro:IPR026607
  - InterPro:IPR036407
  review:
    summary: Resolve broad transcription regulation into supported positive and negative RNA polymerase
      II regulation.
    action: MODIFY
    reason: The general mapping is correct, but DMRT1 has established promoter-specific activation and
      repression. Mouse Stra8 repression and Sohlh1 activation, together with inducible human DMRT1 activation
      of DAZL cis-regulatory reporters in HEK293 cells, support the two existing specific process terms.
