  review:
    summary: DMRT1 represses selected RNA polymerase II targets.
    action: ACCEPT
    reason: 'In mouse spermatogonia, cell-specific ChIP and conditional deletion show promoter binding
      and repression of Stra8. Repression is target- and cell-dependent: other targets are activated,
      and the retinoic-acid response reporter is indirectly regulated. This is one direction of the integrated
      transcription-factor function, not a general silencing activity.'
