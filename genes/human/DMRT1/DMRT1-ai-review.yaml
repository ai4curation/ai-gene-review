- term:
    id: GO:0001228
    label: DNA-binding transcription activator activity, RNA polymerase II-specific
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q9QZ59
  - ensembl:ENSMUSP00000025755
  review:
    summary: DMRT1 can activate transcription from selected RNA polymerase II promoters.
    action: ACCEPT
    reason: The earlier reporter study used a human DMRT1–VP16 fusion, so it is not treated alone as proof
      of native activation. Independent mouse Sohlh1 promoter occupancy/expression and inducibly expressed
      human DMRT1 in HEK293 DAZL cis-regulatory luciferase assays support this positive component. The
      three tested genomic peaks are not all promoters. Motif deletions were tested, but their directional
      effect is not asserted without a figure/source-data read. Other targets are repressed; the integrated
      core is not exclusively activating.
    supported_by:
    - reference_id: PMID:17605809
    - reference_id: PMID:20951351
    - reference_id: PMID:37709822
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: UniProtKB:Q9QZ59
        source_status: SUPPORTS_TRANSFER
        comment: The exact donor is mouse Dmrt1 (Q9QZ59). Its experimental annotations are traceable in
          the saved QuickGO donor record; this is ortholog transfer, not a direct human experiment. The
          donor reporter construct limitation is retained, with independent native regulatory evidence.
- term:
    id: GO:0002176
    label: male germ cell proliferation
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q9QZ59
  - ensembl:ENSMUSP00000025755
  review:
    summary: Retain the stage-specific role in male germ-cell proliferation.
    action: KEEP_AS_NON_CORE
    reason: 'Mouse conditional deletion shows loss of differentiating spermatogonia and premature meiotic
      entry, supporting DMRT1-dependent maintenance of the mitotic germ-cell population. This developmental
      output is not a universal proliferative activity: induced human primordial germ-cell-like cells
      in PMID:37709822 undergo mitotic arrest as they acquire a prospermatogonial program. The different
      stages do not invalidate the curated mouse-derived assertion. The 2023 authors also caution that
      high transgene expression and imperfect timing control may accelerate arrest within 4–8 days; dose
      and induction schedule limit physiological comparison.'
    supported_by:
    - reference_id: PMID:20951351
    - reference_id: PMID:37709822
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
      - source_id: UniProtKB:Q9QZ59
        source_status: SUPPORTS_TRANSFER
        comment: The exact donor is mouse Dmrt1 (Q9QZ59). Its experimental annotations are traceable in
          the saved QuickGO donor record; this is ortholog transfer, not a direct human experiment. Positive
          germ-cell effects are conditional on lineage and developmental stage.
