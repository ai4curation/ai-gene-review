  review:
    summary: Retain the broader male-fate specification assertion with mammalian timing limits.
    action: KEEP_AS_NON_CORE
    reason: The curated mouse donor links this term to gonadal differentiation experiments. DMRT1 contributes
      to specification and maintenance of male cellular identity, including direct control of sex-program
      genes; it is not simply a passive marker. However, null mice initially form male gonads, and partial
      human first-trimester knockdown did not prevent testis formation, whereas later disruption caused
      dysgenesis. Retain the context-dependent curated assertion without presenting DMRT1 as the mammalian
      fetal SRY-like initiating switch.
