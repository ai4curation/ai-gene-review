id: Q9Y5R6
gene_symbol: DMRT1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: DMRT1 is a zinc-coordinating, sequence-specific transcription factor that regulates gonadal
  cell identity and germ-cell development. Its DM DNA-binding region recognizes cis-regulatory sequences
  and forms DNA-dependent homomeric assemblies. DMRT1 acts in the nucleus and can activate or repress
  transcription depending on target and cellular context. It supports testicular differentiation and maintenance
  of the male somatic program; in mouse spermatogonia it also restrains premature meiotic entry. Alternative
  human transcripts encode three predicted isoforms with different C-terminal sequences.
alternative_products:
- name: 1 (DMRT1a)
  id: Q9Y5R6-1
  description: DMRT1a is the 373-residue canonical protein, containing the DM DNA-binding region and the
    complete C-terminal segment.
- name: 2 (DMRT1b)
  id: Q9Y5R6-2
  sequence_note: VSP_042961, VSP_042962
  description: DMRT1b is 275 residues, with M275V and loss of canonical residues 276–373. It retains the
    experimentally characterized DNA-recognition region; equivalent transcriptional activity has not been
    established.
- name: 3 (DMRT1c)
  id: Q9Y5R6-3
  sequence_note: VSP_042959, VSP_042960
  description: DMRT1c is 175 residues, replacing canonical residues 120–175 with a distinct tail and lacking
    176–373. Although the annotated DM feature at 72–118 remains, the altered region includes the position
    of DNA-contact residue R123; equivalent DNA recognition is not established.
