  review:
    summary: Cellular response to retinoic acid (IEA, transferred from a rat expression annotation). The
      underlying data are an expression change in human neuroblastoma, not a role in the response; over-annotated.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'The chain is a round trip: this human IEA comes by orthology from a rat IEP, and that IEP
      rests on human neuroblastoma data, [PMID:19853839 "On induction of differentiation by retinoic acid,
      a sequential expression was found in human neuroblastoma, where ANKK1 was expressed first, followed
      by that of DRD2."] The data show that ANKK1 expression changes during retinoic-acid-induced differentiation,
      not that ANKK1 takes part in the cellular response.'
