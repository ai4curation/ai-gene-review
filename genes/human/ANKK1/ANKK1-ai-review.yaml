taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ANKK1 (ankyrin repeat and kinase domain-containing 1) is a RIP-family serine/threonine kinase
  with an N-terminal kinase domain and twelve C-terminal ankyrin repeats. The gene lies immediately next
  to DRD2. The TaqIA polymorphism (rs1800497) associated with addiction and dopamine-related traits changes
  Glu713 to Lys in an ankyrin repeat, and is in strong linkage disequilibrium with rs7118900, which changes
  Ala239 to Thr in the kinase domain. The kinase domain keeps all catalytic residues, but its activity
  and substrates have not been measured. Tagged ANKK1 is in both nucleus and cytoplasm of transfected
  cells, and in mouse brain it is found in astrocytes and in the nuclei of neurons and neural precursors.
  Its levels peak in mitosis, and its expression responds to dopamine receptor agonists.
