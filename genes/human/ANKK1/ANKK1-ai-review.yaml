- id: file:human/ANKK1/ANKK1-deep-research-affinage.md
  title: Affinage mechanistic annotation for ANKK1 (human)
  findings: []
  reference_review:
    relevance: MEDIUM
    review_notes: 'Trust gates clear. Its localization, cell-cycle and TaqIA claims match the papers used
      here. Its striatal-knockout claims (PMID:36805080: learning, impulsivity and energy-homeostasis
      deficits) show that ANKK1 is necessary in striatal circuits but not what it does molecularly, so
      no behavioral process term is proposed from them. The muscle-metabolism expression claims (PMID:29758057)
      are not used.'
