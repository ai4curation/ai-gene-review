suggested_questions:
- question: Is ANKK1 an active kinase, what does it phosphorylate, and do the TaqIA Glu713Lys or linked
    Ala239Thr variants change its activity? Is ANKK1 an FIH1 substrate on its ankyrin repeats?
suggested_experiments:
- description: Purify ANKK1 and a K51A kinase-dead mutant, test autophosphorylation and phosphorylation
    of candidate substrates, and compare the Ala239 and Thr239 variants.
