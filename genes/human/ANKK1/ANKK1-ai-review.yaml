    supporting_text: We observed that the ANKK1-kinase is located in both the nucleus and the cytoplasm,
      suggesting that there is nucleocytoplasmic shuttling of this putative signal transducer.
  - statement: TaqIA is in linkage disequilibrium with rs7118900 (Ala239Thr).
    supporting_text: The TaqIA SNP is in strong linkage disequilibrium with the SNP rs7118900, which changes
      the alanine at position 239 to threonine in the ANKK1 protein
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only. Transfected HEK293T; Ala239Thr variant expression.
