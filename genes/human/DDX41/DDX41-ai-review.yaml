id: Q9UJV9
gene_symbol: DDX41
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: DDX41 is a 622-amino-acid DEAD-box protein that binds nucleic acids and participates in nuclear
  RNA processing and innate immune signaling. It associates with activated spliceosomes and binds RNA
  near splice sites, helping coordinate pre-mRNA splicing with transcriptional elongation. DDX41 also
  supports snoRNA maturation, with downstream effects on ribosome function and hematopoietic homeostasis.
  Purified DDX41 hydrolyzes ATP, unwinds DNA duplexes and promotes ATP-independent DNA strand annealing.
  A stimulus-dependent cytosolic pool participates in DNA-triggered cGAS/STING signaling by influencing
  nucleic-acid recognition and substrate availability; cGAS supplies cGAMP synthesis.
