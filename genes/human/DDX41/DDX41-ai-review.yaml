  review:
    summary: DDX41 participates in spliceosomal pre-mRNA processing in human cells.
    action: ACCEPT
    reason: 'PMID:25920683 links DDX41 depletion in human K562 and primary CD34+ cells to increased skipping
      of ZMYM2 exon 3, with the reciprocal decrease after wild-type DDX41 expression in U937 cells. The
      same study identifies RNA-resistant associations with spliceosomal proteins in human HEK293 nuclear
      extracts. PMID:36229594 provides stronger mechanistic support: tagged DDX41 binds coding RNA near
      5′ splice sites in K562 cells and associates with activated spliceosomes and the transcription machinery.
      Together these observations support direct participation in spliceosomal RNA processing. They do
      not establish that DDX41 catalyzes RNA-duplex unwinding or the spliceosomal transesterification
      reaction.'
    supported_by:
