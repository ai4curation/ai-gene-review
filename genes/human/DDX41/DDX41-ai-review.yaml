  review:
    action: MODIFY
    summary: The cited experiments demonstrate DNA unwinding, rather than RNA-duplex unwinding.
    reason: The original Results and Figure 3 of PMID:35613581 explicitly report no unwinding of the tested
      3-prime- or 5-prime-tailed 13-bp RNA duplexes by recombinant DDX41, with active DDX43 as a positive
      control. In contrast, DDX41 unwinds forked and tailed DNA duplexes in an ATP-dependent manner; nonhydrolyzable
      ATP analogues and the ATPase-defective E345A mutant do not support this reaction. Replace this source-specific
      RNA-helicase assertion with DNA helicase activity. This conclusion follows the actual positive and
      negative substrate experiments, not the protein family name, and does not establish that DDX41 can
      never remodel an RNA substrate under other conditions. The reported preference for a 3-prime overhang
      is retained in notes without asserting a directly measured processive translocation mechanism.
    supported_by:
