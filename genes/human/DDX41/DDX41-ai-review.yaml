- id: PMID:35613581
  title: DDX41 is required for cGAS-STING activation against DNA virus infection.
  findings:
  - statement: Recombinant DDX41 unwinds tested DNA duplexes with ATP, does not unwind the tested tailed
      RNA duplexes, and also promotes ATP-independent DNA strand annealing. Human macrophage fractionation
      supports stimulus-dependent cytosolic accumulation.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Independent original review establishes ATP-dependent DNA unwinding, ATP-independent
      annealing and DNA-triggered cGAS/STING participation. The tested RNA duplexes were negative, making
      its imported RNA-helicase IDA source-specific misassignment; broader RNA activity under other conditions
      remains unresolved.
