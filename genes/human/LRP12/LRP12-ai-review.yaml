suggested_questions:
- question: >-
    Can the full text and curator evidence for PMID:37330909 be retrieved and linked to
    document the species, constructs, and experimental context of the molecular assays
    before their applicability to endogenous human LRP12 is interpreted?
  experts: []
- question: >-
    Does the extracellular LDLR-like region bind a physiological ligand or cargo, and
    does ligand engagement modulate LRP12-integrin coupling or internalization?
  experts: []
- question: >-
    Are both curated human LRP12 isoforms translated, surface-delivered, and competent
    for α4-integrin regulation in the same tissues?
  experts: []
- question: >-
    Are mouse neuronal-development phenotypes caused by the α4-integrin mechanism, a
    distinct LRP12 signaling pathway, or both?
  experts: []
- question: >-
    Are the reported ACTN2 and MYOT tail interactions reproducible in muscle, and do
    they inform normal LRP12 biology independently of the noncoding repeat-mediated
    pathology in OPDM1?
  experts: []
suggested_experiments:
- hypothesis: >-
    Endogenous human LRP12 restrains α4-integrin activation through direct cytoplasmic-tail
    binding that excludes talin.
  description: >-
    Generate isogenic LRP12-null human α4-integrin-expressing primary or lineage-relevant
    cells, rescue with expression-matched wild-type LRP12 or mapped interface mutants,
    and quantify LRP12-α4 proximity, activation-specific integrin epitopes, talin
    recruitment, nascent-adhesion turnover, adhesion, and migration.
  experiment_type: endogenous receptor-integrin mechanism and rescue study
- hypothesis: >-
    LRP12 has a specific extracellular ligand that regulates its surface organization
    or cargo uptake rather than a generic LDL-receptor activity.
  description: >-
    Perform unbiased native ectodomain ligand capture and cell-surface binding screens,
    validate candidates biophysically, and use pulse-chase imaging to distinguish
    binding, internalization, recycling, and degradation; include LDL particles and
    endocytosis-defective tail mutants as explicit controls.
  experiment_type: ligand discovery and quantitative trafficking assay
- hypothesis: >-
    The 19-residue N-terminal deletion in isoform 2 changes processing or surface
    delivery and thereby alters LRP12 function.
  description: >-
    Establish isoform-resolved transcript and targeted-proteomic measurements in human
    tissues, engineer each isoform at the endogenous locus, and compare signal-peptide
    processing, glycosylation, surface abundance, α4-integrin inhibition, ligand binding,
    and uptake at matched expression.
  experiment_type: endogenous isoform-resolved functional comparison
- hypothesis: >-
    LRP12-dependent human neural migration and arborization require its α4-integrin
    inhibitory interface.
  description: >-
    Use LRP12-null human neural progenitors and cortical organoids rescued with
    wild-type or α4-binding-deficient LRP12; quantify integrin activation, adhesion
    dynamics, neurite branching, cell migration, and laminar organization while testing
    α4-integrin epistasis.
  experiment_type: human neural organoid mechanism and epistasis study
