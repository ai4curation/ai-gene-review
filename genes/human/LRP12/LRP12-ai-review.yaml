core_functions:
- description: >-
    At the plasma membrane, LRP12 binds the cytoplasmic tail of α4 integrins and
    restrains their activation by interfering with talin engagement, thereby balancing
    nascent-adhesion turnover and cell migration. The accessible abstract does not
    resolve the molecular-assay species or constructs, so the mechanism remains
    species- and construct-bounded pending clarification.
  molecular_function:
    id: GO:0005178
    label: integrin binding
  directly_involved_in:
  - id: GO:0033624
    label: negative regulation of integrin activation
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:37330909
    supporting_text: "The LRP12 cytoplasmic domain directly binds to the\nintegrin α4 cytoplasmic tail and inhibits talin binding to the β subunit, thus\nkeeping integrin inactive."
  - reference_id: PMID:37330909
    supporting_text: "In migrating cells, LRP12-α4 interaction induces\nnascent adhesion (NA) turnover at the leading-edge protrusion. Knockdown of\nLRP12 leads to increased NAs and enhanced cell migration."
knowledge_gaps:
- gap_statement: >-
    The species and constructs used for the α4-integrin molecular assays, and independent
    curated experimental confirmation on human LRP12, remain unresolved from the
    accessible evidence.
  boundary: >-
    PMID:37330909 establishes LRP12 tail binding, talin exclusion, and integrin
    inactivation, but its abstract does not state the organism or constructs for those
    assays. GO currently records experimental integrin binding on mouse Q8BUJ9 and an
    exact-ortholog IEA on human LRP12; this provenance does not establish what every
    experiment in the paper tested.
  gap_kind:
  - BIOLOGY
  - CURATION
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    Species- and construct-resolved evidence is required to define the physiological
    human receptor-integrin pair, relevant cell types, and conservation of the
    talin-exclusion mechanism.
  resolution: >-
    Test endogenous LRP12-α4 proximity and binding in human α4-integrin-expressing
    primary cells, perturb LRP12, and rescue with expression-matched wild-type or
    α4-tail-interface mutants while measuring integrin conformation, talin recruitment,
    adhesion turnover, and migration.
  provenance:
  - reference_id: PMID:37330909
    supporting_text: "Here, we identify LRP12 as an endogenous transmembrane inhibitor\nfor α4 integrin activation."
- gap_statement: >-
    The physiological extracellular ligand and any cargo-internalization function of
    LRP12 remain unknown.
  boundary: >-
    Human studies establish LDLR-family architecture, endocytic/signaling motifs, and
    several cytoplasmic-tail interactions. They do not demonstrate LDL-particle binding,
    a defined extracellular ligand, receptor-mediated cargo uptake, or endocytic flux.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    Identifying extracellular partners is necessary to determine whether LRP12 couples
    ligand recognition to integrin regulation, signaling, or trafficking rather than
    merely sharing LDLR-family architecture.
  resolution: >-
    Use native ectodomain capture and quantitative surface-interaction screens followed
    by purified binding and internalization assays; compare candidate ligands and LDL
    particles with controls that separate surface binding from productive uptake.
  provenance:
  - reference_id: PMID:12809483
    supporting_text: "To evaluate the relationship of ST7 to the LDLR superfamily \nproteins and to determine whether ST7 may function in endocytosis and/or signal \ntransduction, we used proteomic tools to analyze the functional motifs present \nin the protein."
- gap_statement: >-
    Functional differences between the two curated human LRP12 isoforms are unresolved.
  boundary: >-
    UniProt curates isoform 1 as the displayed sequence and isoform 2 with a 19-residue
    N-terminal deletion, but the reviewed integrin, neuronal, trafficking, and cancer
    studies do not establish isoform-specific activity or endogenous protein abundance.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    The N-terminal difference may affect signal-peptide processing, surface delivery,
    or extracellular interactions, so canonical-product findings cannot automatically
    be assigned to both proteoforms.
  resolution: >-
    Resolve isoform transcripts and proteins across human tissues, then compare
    processing, surface abundance, α4-integrin regulation, extracellular-partner binding,
    and internalization using expression-matched and endogenous isoform perturbations.
  provenance:
  - reference_id: UniProtKB:Q9Y561
    supporting_text: "CC       Event=Alternative splicing; Named isoforms=2;\nCC       Name=1;\nCC         IsoId=Q9Y561-1; Sequence=Displayed;\nCC       Name=2;\nCC         IsoId=Q9Y561-2; Sequence=VSP_040992;"
- gap_statement: >-
    The mechanism connecting Lrp12 to neuronal arborization, migration, and cortical
    lamination is not defined and has not been tested directly in human neural cells.
  boundary: >-
    Loss-of-function phenotypes are from mouse primary neurons and embryonic cortex.
    The reporter study maps an Lrp12-positive preplate population and Reelin-dependent
    patterning but does not establish Lrp12 as a Reelin receptor or show that α4-integrin
    regulation causes the neuronal outcomes.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    Connecting the receptor's molecular activity to neural phenotypes would distinguish
    a conserved cell-adhesion mechanism from a separate developmental pathway.
  resolution: >-
    Perturb LRP12 in human neural progenitors and cortical organoids, rescue with
    wild-type and α4-binding-deficient variants, and measure integrin activation,
    adhesion dynamics, neurite architecture, migration, and laminar positioning.
  provenance:
  - reference_id: PMID:26639854
    supporting_text: "In vivo ablation of LRP12 by intraventricularly in utero electroporated shRNAs\nelicits cortical maldevelopment, i.e. aberrant lamination by malpositioning of\nupper cortical layer neurons."
- gap_statement: >-
    No experimental structure defines full-length LRP12 or its complex with α4 integrin.
  boundary: >-
    The reviewed record contains an AlphaFold prediction but no experimental PDB
    cross-reference. The relative arrangement of the extracellular repeats,
    transmembrane helices, cytoplasmic tails, and talin-competitive interface in a
    membrane is therefore unknown.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: >-
    Structural definition would reveal how a single-pass receptor recognizes an
    integrin tail and whether extracellular or membrane organization regulates that
    interaction.
  resolution: >-
    Reconstitute full-length human LRP12 with a defined α4-integrin heterodimer in a
    membrane and combine cryo-EM or integrative structural analysis with interface
    mutagenesis, talin competition, and functional rescue.
  provenance:
  - reference_id: UniProtKB:Q9Y561
    supporting_text: DR   AlphaFoldDB; Q9Y561; -.
