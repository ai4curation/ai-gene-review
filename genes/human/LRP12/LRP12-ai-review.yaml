- id: PMID:12809483
  title: ST7 is a novel low-density lipoprotein receptor-related protein (LRP) with
    a cytoplasmic tail that interacts with proteins related to signal transduction
    pathways.
  findings:
  - statement: Human LRP12 belongs to the LDL receptor-related family, but family membership alone does not establish LDL-particle binding or uptake.
    supporting_text: "These results strongly suggested that ST7 was \nalso a novel member of the low-density lipoprotein receptor superfamily."
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: The LRP12 cytoplasmic tail interacted in yeast two-hybrid assays with RACK1, NMRK2/MIBP, and ZFYVE9/SARA.
    supporting_text: "Use of the yeast two-hybrid \nsystem to identify proteins that associate with ST7's cytoplasmic domain \nrevealed that this domain interacts with three proteins involved in signal \ntransduction and/or endocytosis, viz., receptor for activated protein C kinase 1 \n(RACK1), muscle integrin binding protein (MIBP), and SMAD anchor for receptor \nactivation (SARA), suggesting that ST7, like other proteins in the LDLR \nsuperfamily, functions in these two pathways."
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: The accessible record reports endocytic and signaling motifs, not a direct cargo-internalization assay.
    supporting_text: "Our results indicate that ST7 is a member of a subfamily of the \nLDLR superfamily and that its cytoplasmic domain contains several motifs \nimplicated in endocytosis and signal transduction."
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct human LRP12 family/topology and cytoplasmic-tail interaction study. Abstract-only cache; claims about LDL uptake or broad trafficking must not exceed the accessible motif and interaction evidence.
- id: PMID:26639854
  title: LRP12 silencing during brain development results in cortical dyslamination
    and seizure sensitization.
  findings:
  - statement: Lrp12 knockdown impaired neuronal arborization in primary mouse neurons.
    supporting_text: "In vitro\nknockdown of LRP12 in primary neurons results in impaired neuronal arborization."
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: In utero cortical Lrp12 silencing in mice caused upper-layer neuron malpositioning and cortical dyslamination.
    supporting_text: "In vivo ablation of LRP12 by intraventricularly in utero electroporated shRNAs\nelicits cortical maldevelopment, i.e. aberrant lamination by malpositioning of\nupper cortical layer neurons."
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct loss-of-function evidence for mouse neuronal development; supports conserved-process interpretation but not an unqualified human or isoform-specific mechanism.
- id: PMID:9927190
  title: Cloning and characterization of a novel gene encoding a putative transmembrane
    protein with altered expression in some human transformed and tumor-derived cell
    lines.
  findings:
  - statement: The cloned human LRP12/ST7 product is an 859-residue putative single-pass membrane protein with extracellular LDLR-like repeats and a long cytoplasmic region.
    supporting_text: "Molecular cloning of a near full-length cDNA revealed that the novel gene\nencodes a putative transmembrane protein composed of 859 amino acids: the 492\nN-terminal amino acids including a fivefold cysteine-rich repeat of 40 amino\nacids homologous to the ligand binding repeat of the known low density\nlipoprotein receptor, a 24 hydrophobic amino acid stretch spanning the plasma\nmembrane, and a C-terminal domain of 343 residues."
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: The original tumor study established differential expression, not a direct tumor-suppressor or growth-regulatory mechanism.
    supporting_text: "These studies\nare a first step in characterizing a novel putative receptor protein, whose\nexpression is downregulated in some malignantly transformed cells, and which may\nplay an important role in the transformation process of these cells."
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Foundational human cloning/topology study. Its cancer conclusion is explicitly tentative and should not be converted into a general growth-regulation function.
- id: PMID:37330909
  title: LRP12 is an endogenous transmembrane inactivator of α4 integrins.
  findings:
  - statement: Lrp12 directly binds the α4-integrin cytoplasmic tail and interferes with talin engagement, maintaining the integrin in an inactive state.
    supporting_text: "The LRP12 cytoplasmic domain directly binds to the\nintegrin α4 cytoplasmic tail and inhibits talin binding to the β subunit, thus\nkeeping integrin inactive."
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: Lrp12 controls leading-edge nascent-adhesion turnover and restrains cell migration.
    supporting_text: "In migrating cells, LRP12-α4 interaction induces\nnascent adhesion (NA) turnover at the leading-edge protrusion. Knockdown of\nLRP12 leads to increased NAs and enhanced cell migration."
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Decisive direct mechanism for α4-integrin binding and inactivation. The human GO IEA is an exact-ortholog transfer from mouse Q8BUJ9, so the species boundary remains explicit.
- id: PMID:20439316
  title: Lrp12/Mig13a reveals changing patterns of preplate neuronal polarity during
    corticogenesis that are absent in reeler mutant mice.
  findings:
  - statement: In mouse, an Lrp12/Mig13a-expressing preplate-neuron subset undergoes tangential migration and pioneers anterior-commissure projections.
    supporting_text: "Lrp12/Mig13a, a mammalian gene\nrelated to the Caenorhabditis elegans neuroblast migration gene mig-13, is\nexpressed in a subpopulation of preplate neurons that undergo ventrally directed\ntangential migrations in the preplate layer and pioneer axon projections to the\nanterior commissure."
    reference_section_type: ABSTRACT
    full_text_unavailable: false
  - statement: The reporter study describes Lrp12-positive cell behavior and Reelin-dependent patterning; it does not by itself establish an Lrp12 receptor mechanism.
    supporting_text: "These changes in\nneuronal polarity do not occur in reeler mutant mice, revealing the earliest\nknown defect in reeler cortical patterning and suggesting that the alignment of\npreplate neurons into a pseudolayer facilitates the movement of later-born\nradially migrating neurons into the emerging cortical plate."
    reference_section_type: ABSTRACT
    full_text_unavailable: false
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Useful mouse expression and cell-behavior context. It is a reporter/patterning study and should not be read as direct evidence that Lrp12 transduces Reelin or drives the observed movements.
- id: PMID:30029672
  title: Epigenomic profiling of non-small cell lung cancer xenografts uncover LRP12
    DNA methylation as predictive biomarker for carboplatin resistance.
  findings:
  - statement: LRP12 promoter methylation correlated inversely with expression and predicted carboplatin response in NSCLC cohorts.
    supporting_text: "This\nanalysis led to the identification of a promoter CpG island methylation of LDL\nreceptor-related protein 12 (LRP12) associated with increased resistance to\ncarboplatin. Validation in an independent patient cohort (n = 35) confirmed that\nLRP12 methylation status is predictive for therapeutic response of NSCLC\npatients to platin therapy with a sensitivity of 80% and a specificity of 84%\n(p < 0.01)."
    reference_section_type: ABSTRACT
    full_text_unavailable: false
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Valid cancer biomarker evidence from PDX and patient cohorts, but it is an epigenetic association screen rather than a direct assay of normal LRP12 receptor function.
- id: PMID:41276539
  title: LRP12 promotes gastric cancer progression through AKT/mTOR signaling and
    M2 macrophage-mediated immunosuppression.
  findings:
  - statement: In gastric-cancer models, LRP12 perturbation altered proliferation and invasion, and knockdown reduced xenograft growth.
    supporting_text: "Functional studies using\nboth overexpression and knockdown showed that LRP12 promotes GC cell\nproliferation and invasion, while xenografts of LRP12-knockdown cells exhibited\nreduced tumor growth."
    reference_section_type: ABSTRACT
    full_text_unavailable: false
  - statement: LRP12 overexpression increased AKT and mTOR phosphorylation in the tested gastric-cancer context.
    supporting_text: "Mechanistically, LRP12 overexpression activated the\nAKT/mTOR pathway, reflected by increased phosphorylation of AKT and mTOR."
    reference_section_type: ABSTRACT
    full_text_unavailable: false
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Direct perturbation evidence in human gastric-cancer cells with mouse xenograft follow-up, but it is disease-context evidence and does not establish the normal core receptor mechanism or rescue the older PMID:9927190 growth annotation provenance.
- id: PMID:31332380
  title: Noncoding CGG repeat expansions in neuronal intranuclear inclusion disease,
    oculopharyngodistal myopathy and an overlapping disease.
  findings:
  - statement: A noncoding CGG-repeat expansion in LRP12 was identified as the cause of oculopharyngodistal myopathy 1.
    supporting_text: "we identified similar noncoding CGG repeat expansions in two\nother diseases: oculopharyngeal myopathy with leukoencephalopathy and\noculopharyngodistal myopathy, in LOC642361/NUTM2B-AS1 and LRP12, respectively."
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Foundational human genetic evidence linking a noncoding LRP12 CGG-repeat expansion to OPDM1; this repeat-mediated disease mechanism does not establish a normal LRP12 protein activity for GO annotation.
- id: PMID:37339631
  title: CGG repeat expansion in LRP12 in amyotrophic lateral sclerosis.
  findings:
  - statement: LRP12 CGG expansions of 61-100 repeats were found in ALS, whereas most LRP12-OPDM expansions contained 100-200 repeats.
    supporting_text: "We identify CGG\nrepeat expansion in LRP12 in five families and two simplex individuals. These\nALS individuals (LRP12-ALS) have 61-100 repeats, which contrasts with most OPDM\nindividuals with repeat expansion in LRP12 (LRP12-OPDM), who have 100-200\nrepeats."
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: Expanded-repeat disease showed RNA foci and phenotype-dependent Muscleblind-like 1 aggregation.
    supporting_text: "RNA foci are more prominent in muscle and iPSMNs in LRP12-ALS\nthan in LRP12-OPDM. Muscleblind-like 1 aggregates are observed only in OPDM\nmuscle."
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: Repeat length determines whether the LRP12 expansion presents predominantly as ALS or OPDM.
    supporting_text: "In conclusion, CGG repeat expansions in LRP12 cause ALS and OPDM,\ndepending on the length of the repeat. Our findings provide insight into the\nrepeat length-dependent switching of phenotypes."
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct human genetic and cellular evidence for repeat-length-dependent ALS28 versus OPDM1 phenotypes. The pathogenic 5-prime-UTR expansion is noncoding and supports repeat-mediated toxic gain-of-function disease biology, not a new protein-level GO function.
