id: Q9Y561
gene_symbol: LRP12
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  LRP12 is an 859-residue type-I single-pass plasma-membrane protein of the
  low-density-lipoprotein-receptor-related family. Its extracellular region contains
  two CUB domains and five LDL-receptor class A repeats, followed by one transmembrane
  helix and a long cytoplasmic tail. The tail binds α4 integrins and interferes with
  talin engagement, restraining integrin activation and balancing nascent-adhesion
  turnover and cell migration; it also interacts with RACK1, NMRK2/MIBP, and
  ZFYVE9/SARA. Mouse developmental studies link Lrp12 to neuronal arborization,
  migration, and cortical lamination. Two named human protein isoforms differ by a
  short N-terminal deletion. Noncoding CGG-repeat expansions in the LRP12 5-prime
  untranslated region cause oculopharyngodistal myopathy 1 and, at shorter pathogenic
  repeat lengths, amyotrophic lateral sclerosis 28.
