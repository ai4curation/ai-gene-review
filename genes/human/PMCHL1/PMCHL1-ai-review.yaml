id: Q16048
gene_symbol: PMCHL1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  PMCHL1 (5p14.3) is a primate-specific chimeric locus, classified by HGNC as a pseudogene,
  that arose 30-35 million years ago by retroposition of an antisense pro-melanin-concentrating
  hormone (PMCH) transcript into an intron of the brain cadherin gene CDH12, followed by
  de novo creation of exons and splice sites. It is a 5'-truncated copy of PMCH: it lacks the
  region encoding the PMCH signal peptide and N-terminal pro-region, but retains sequence
  corresponding to the C-terminal NGE-, NEI- and MCH-peptide segments, each carrying amino-acid
  substitutions. The locus is transcribed in testis and in fetal, newborn and adult brain,
  producing sense unspliced and spliced RNAs and noncoding antisense RNAs. The UniProt entry
  (86 aa) corresponds to a short ORF on sense transcripts (VMCH-p8) with a novel, lysine-rich
  putative nuclear localization signal at its N-terminus in place of a secretory signal
  peptide. VMCH-p8 was translated only in vitro and, weakly, in transfected cells; it was not
  detected by antibody in human or macaque tissues that express PMCHL RNA, and the transcripts
  are proposed to act as mRNA-like noncoding RNAs. No function of a PMCHL1 protein has been
  demonstrated.
