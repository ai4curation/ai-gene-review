- term:
    id: GO:0030354
    label: melanin-concentrating hormone activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR005456
  review:
    summary: InterPro2GO mapping of hormone activity onto a 5'-truncated, signal-peptide-less copy
      of the PMCH C-terminal region whose protein has not been detected.
    action: REMOVE
    reason: >-
      Melanin-concentrating hormone activity requires a mature, secreted cyclic MCH peptide
      released from pro-MCH by processing in the secretory pathway. PMCHL1 is a 5'-truncated
      version of the MCH gene (PMID:11070051). The putative 86-aa product aligns only to PMCH
      81-165 and lacks the signal peptide (PMCHL1-bioinformatics/RESULTS.md). Its MCH-like
      segment carries four substitutions relative to human MCH (M150T, R152S, R160Q, P161S in
      PMCH numbering), although the disulfide cysteines are retained. No endogenous protein was
      detected (PMID:19068116). The hormone activity is therefore unsupported. Retaining the
      cysteines alone does not establish activity, because a peptide that is never secreted cannot
      act as a hormone.
    additional_reference_ids:
    - PMID:11070051
    supported_by:
    - reference_id: PMID:11070051
      supporting_text: They correspond to a 5'-end truncated version of the MCH gene mapped on chromosome
        12q23 and encoding a neuropeptide precursor.
    - reference_id: file:human/PMCHL1/PMCHL1-bioinformatics/RESULTS.md
      supporting_text: 'MCH region (PMCH 147-165): M150->T71, R152->S73, R160->Q81, P161->S82'
    - reference_id: PMID:19068116
      supporting_text: Western blot analyses of human and macaque tissues expressing PMCHL RNA failed
        to reveal any protein corresponding to VMCH-p8 and protein variants encoded by spliced transcripts.
- term:
    id: GO:0031777
    label: type 1 melanin-concentrating hormone receptor binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN002636265
  - RGD:3358
  review:
    summary: Phylogenetic inheritance of MCHR1 ligand binding from the euteleost pro-MCH node onto
      a primate-specific, truncated retrocopy that does not encode a secreted precursor and is
      probably not translated.
    action: REMOVE
    reason: >-
      The IBD at PTN002636265 (taxon Euteleostomi, seeded by rat Pmch, RGD:3358) correctly places
      MCHR1-ligand function at the root of the PMCH family. PMCHL1 is inside that clade only
      because it descends from a PMCH transcript that was retroposed about 30-35 Mya. PANTHER
      separates it into its own subfamily (PTHR12091:SF1, PRO-MCH-LIKE PROTEIN 1-RELATED). The
      retrocopy shows loss of the features the function depends on. It is 5'-truncated and lacks
      the signal peptide and N-terminal pro-region (PMCH 1-80 absent), so no MCH peptide can be
      processed or secreted. It has a novel N-terminal putative NLS (PMID:19068116). Its MCH-like
      segment is substituted. The locus is annotated by HGNC as a pseudogene. No protein was
      detected in human or macaque tissues, nor in HEK293 cells transfected with ORF1-bearing
      constructs (PMID:19068116). The product is unlikely to exist as a ligand, so the inherited
      binding function should not apply.
    supported_by:
    - reference_id: PMID:11181993
      supporting_text: the PMCHL1 gene was created near 25 million years ago (Ma) by a complex mechanism
        of exon shuffling through retrotransposition of an antisense MCH messenger RNA coupled to
        de novo creation of splice sites
    - reference_id: PMID:19068116
      supporting_text: Even though high levels of ORF1-bearing PMCHL1/2 transcripts were detected
        by RT-PCR, no signal corresponding to the VMCH-p8 protein could be detected (data not shown).
    - reference_id: file:human/PMCHL1/PMCHL1-bioinformatics/RESULTS.md
      supporting_text: PMCH residues 1-80 have no counterpart in Q16048
    propagation_review:
      root_cause: PROPAGATION_BAD
