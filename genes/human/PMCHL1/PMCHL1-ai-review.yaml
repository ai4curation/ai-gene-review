- id: PMID:8326825
  title: Isolation and characterization of the human melanin-concentrating hormone
    gene and a variant gene.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified (Brain Res Mol Brain Res 1993). First description of the variant
      MCH gene; its statement that the variant expresses a prohormone predates the later
      structural and protein-detection work, which does not support it.
  findings:
  - statement: The variant MCH gene shares coding sequence with the C-terminal part of the MCH
      prohormone but not the N-terminal part.
    supporting_text: Cloning from three genomic libraries and sequencing of one class of hMCH genomic
      DNA reveal high similarity between coding regions and the C-terminal part of the hMCH prohormone
- id: PMID:8188237
  title: Assignment of the human pro-melanin-concentrating hormone gene (PMCH) to chromosome
    12q23-q24 and two variant genes (PMCH1 and PMCHL2) to chromosome 5p14 and 5q12-q13.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: PubMed-verified (Genomics 1994). Chromosomal mapping only; defines the PMCHL1
      (5p14) and PMCHL2 (5q12-q13) loci.
  findings: []
- id: PMID:9729295
  title: Antisense expression of the human pro-melanin-concentrating hormone genes.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (Brain Res 1998). Hypothalamic RT-PCR shows only antisense
      PMCHL1 transcripts; basis of the UniProt CAUTION.
  findings:
  - statement: Brain transcripts from the variant locus are antisense, and there is no evidence
      that an MCH precursor is made from the pMCHL loci.
    supporting_text: Thus, there is no evidence that the MCH peptide-precursor molecule is produced
      in the brain by the human-variant pMCHL loci.
- id: PMID:11070051
  title: 'Structure and expression of the variant melanin-concentrating hormone genes: only PMCHL1
    is transcribed in the developing human brain and encodes a putative protein.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (Mol Biol Evol 2000). Abstract only in cache. Describes the
      5'-truncation, sense and antisense PMCHL1 RNAs in brain, and VMCH-p8 translation only in
      vitro and in transfected COS cells.
  findings:
  - statement: PMCHL1 and PMCHL2 are 5'-truncated versions of the MCH gene.
    supporting_text: They correspond to a 5'-end truncated version of the MCH gene mapped on chromosome
      12q23 and encoding a neuropeptide precursor.
- id: PMID:11181993
  title: Birth of two chimeric genes in the Hominidae lineage.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (Science 2001). Abstract only in cache. Origin of PMCHL1 by
      retroposition of antisense PMCH mRNA and exon shuffling; PMCHL2 by later duplication.
  findings:
  - statement: PMCHL1 is a chimeric gene created by retrotransposition of antisense MCH mRNA.
    supporting_text: the PMCHL1 gene was created near 25 million years ago (Ma) by a complex mechanism
      of exon shuffling through retrotransposition of an antisense MCH messenger RNA coupled to
      de novo creation of splice sites
- id: PMID:19068116
  title: Primate-specific spliced PMCHL RNAs are non-protein coding in human and macaque tissues.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (BMC Evol Biol 2008), full text cached. Key paper. An anti-VMCH-p8
      antiserum detected no protein in human testis, human brain or macaque brain, nor in HEK293
      cells transfected with ORF1-bearing sequences. The authors note that expression below the
      detection threshold cannot be excluded.
  findings:
  - statement: No protein product of PMCHL ORFs is detectable in tissues expressing PMCHL RNA.
    supporting_text: This strongly suggests that these putative proteins are not translated in vivo
      in the human and macaque tissues that we tested.
  - statement: PMCHL transcripts are proposed to function as mRNA-like noncoding RNAs.
    supporting_text: It is tempting to propose that these PMCHL transcripts work mainly as an mRNA-like
      non-protein coding RNA (ncRNA).
- id: file:human/PMCHL1/PMCHL1-bioinformatics/RESULTS.md
  title: Pairwise comparison of PMCHL1 (Q16048) with parent pro-MCH (PMCH, P20382)
  findings:
  - statement: Q16048 aligns only to PMCH 81-165 and lacks the PMCH signal peptide and N-terminal
      pro-region.
    supporting_text: PMCH residues 1-80 have no counterpart in Q16048
suggested_questions:
- question: Should the PANTHER PTN002636265 IBD (MCHR1 binding; negative regulation of dopaminergic
    transmission) be blocked for subfamily PTHR12091:SF1 (PMCHL1/PMCHL2)? These are primate
    retrocopies lacking the PMCH signal peptide, with no detectable protein.
- question: Does UniProt Q16048 (86 aa) represent the same ORF as VMCH-p8, which Schmieder et al.
    2008 describe as 72 aa? If not, which transcript supports the 86-aa model?
- question: Should a PE5 entry whose locus HGNC classifies as a pseudogene receive any InterPro2GO
    or IBA function annotation by default?
suggested_experiments:
- description: Re-examine ribosome-profiling and deep proteomics data from human testis and fetal
    brain for translation of the PMCHL1 ORF1/VMCH-p8 reading frame, using PMCHL1-specific
    peptides that discriminate it from PMCH and PMCHL2.
  experiment_type: ribosome profiling / targeted mass spectrometry
- description: Test the proposed noncoding-RNA role of PMCHL1 transcripts by knockdown of sense
    and antisense PMCHL1 RNAs in a human neural progenitor model.
  experiment_type: RNA knockdown
