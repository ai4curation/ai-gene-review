id: Q9NQ31
gene_symbol: AKIP1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'AKIP1 (A-kinase-interacting protein 1, also BCA3) is a small nuclear protein that binds
  the catalytic subunit of cAMP-dependent protein kinase A. Despite its name it is not an A-kinase anchoring
  protein: it binds the N-terminal A helix of the catalytic subunit rather than the regulatory subunit,
  through its own carboxyl terminus, and it carries a nuclear localization signal. AKIP1 sits in nuclear
  speckles, and cells expressing it accumulate more catalytic subunit in the nucleus on cAMP stimulation.
  Its best-characterized consequence is on NF-kappaB: AKIP1 binds the p65 subunit as well as the PKA catalytic
  subunit, bringing kinase and substrate together so that p65 is phosphorylated on Ser-276 and retained
  in the nucleus, which promotes p65-dependent transcription and determines whether PKA activation enhances
  or suppresses NF-kappaB. The effect depends on splice variant: the full-length AKIP1a enhances transcription,
  while AKIP1b, lacking the third exon, recruits SIRT1 and represses it. AKIP1 has also been reported
  to bind GTP-loaded Rac1, beta-catenin and the mitochondrial protein AIF, and to localize to interfibrillary
  mitochondria in cardiac myocytes, where it is induced by oxidant and ischemic stress. Its carboxyl terminus
  ends in a class II PDZ-binding motif that binds many PDZ-domain proteins in vitro. Human AKIP1 is produced
  as several splice variants, whereas rodents express only the full-length form, and the rodent and human
  proteins are only moderately conserved.'
