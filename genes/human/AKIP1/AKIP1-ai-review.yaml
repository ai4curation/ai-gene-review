- term:
    id: GO:1901222
    label: regulation of non-canonical NF-kappaB signal transduction
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR033214
  review:
    summary: Regulation of NON-canonical NF-kappaB signalling, from InterPro. AKIP1 acts on p65, the canonical
      pathway; modified to the canonical term.
    action: MODIFY
    reason: 'The essence - AKIP1 regulates NF-kappaB - is well supported, but the branch is wrong. The
      mechanism is PKA phosphorylation of p65 on Ser-276 [PMID:20562110 "attenuated PKA-dependent phosphorylation
      of p65 on Ser-276"], which AKIP1 enables [PMID:20562110 "This inhibitory function of PKAc in NF-kappaB
      signaling was reversed by overexpression of AKIP1 in 293 cells."], and p65 is the canonical-pathway
      subunit; the non-canonical pathway runs through NIK, p100 processing and RelB. AKIP1 binds p65 itself,
      directly [PMID:18178962 "The interaction between AKIP1 and p65 was confirmed by glutathione S-transferase
      pull-down assay in vitro and immunoprecipitation-Western blotting assay in vivo."], with the kinase
      in the same complex [PMID:18178962 "We found that the PKAc was present in the AKIP1.p65 complex
      and enhanced the transcriptional activity of NF-kappaB by phosphorylating p65."]. Direction: the
      effect depends on the splice variant [PMID:23319652 "This regulation is dependent on the splice
      variants of AKIP1."] - [PMID:23319652 "AKIP1b was shown to recruit the histone deacetylase silent
      mating type information regulation 2 homolog (SIRT1) in a NEDDylation (NEDD8, neural precursor cell
      expressed, developmentally down-regulated 8-mediated)-dependent manner and repress transcription"],
      whereas [PMID:23319652 "In contrast, AKIP1a was shown to recruit NF-κB in a PKA-dependent manner
      and enhance transcription"]. The product annotated here is the canonical isoform, AKIP1a [file:genes/human/AKIP1/AKIP1-uniprot.txt
      "IsoId=Q9NQ31-1; Sequence=Displayed;"], which enhances, so the replacement is GO:0043123 positive
      regulation of canonical NF-kappaB signal transduction. The repression is restricted to AKIP1b, a
      different isoform, and would belong on an isoform-specific annotation rather than tempering this
      one.'
    proposed_replacement_terms:
    - id: GO:0043123
      label: positive regulation of canonical NF-kappaB signal transduction
    supported_by:
    - reference_id: PMID:20562110
      supporting_text: attenuated PKA-dependent phosphorylation of p65 on Ser-276
    - reference_id: PMID:18178962
      supporting_text: The interaction between AKIP1 and p65 was confirmed by glutathione S-transferase
        pull-down assay in vitro and immunoprecipitation-Western blotting assay in vivo.
    - reference_id: PMID:18178962
      supporting_text: We found that the PKAc was present in the AKIP1.p65 complex and enhanced the transcriptional
        activity of NF-kappaB by phosphorylating p65.
    - reference_id: PMID:23319652
      supporting_text: In contrast, AKIP1a was shown to recruit NF-κB in a PKA-dependent manner and enhance
        transcription
    - reference_id: PMID:23319652
      supporting_text: AKIP1b was shown to recruit the histone deacetylase silent mating type information
        regulation 2 homolog (SIRT1) in a NEDDylation (NEDD8, neural precursor cell expressed, developmentally
        down-regulated 8-mediated)-dependent manner and repress transcription
    - reference_id: file:genes/human/AKIP1/AKIP1-deep-research-affinage.md
      supporting_text: in cells with high AKIP1, PKA-activating agents enhance p65–PKAc interaction, p65
        Ser-276 phosphorylation, and NF-κB-dependent transcription
- term:
    id: GO:0035591
    label: signaling adaptor activity
  evidence_type: IPI
  original_reference_id: PMID:18178962
  qualifier: enables
  review:
    summary: AKIP1 binds both the PKA catalytic subunit and its substrate p65, and the kinase is found
      in the AKIP1-p65 complex - it brings kinase and substrate together. That is signaling adaptor activity.
    action: NEW
    reason: 'Participation: AKIP1 makes both contacts itself. It binds the catalytic subunit''s A helix
      [PMID:15630084 "we identified a PKA-interacting protein (AKIP1) that binds to the amino terminus
      (residues 1-39) of the C subunit of PKA."] and, independently, p65 [PMID:18178962 "we have identified
      protein kinase A-interacting protein 1 (AKIP1) as a binding partner of NF-kappaB p65 subunit, and
      AKIP1 enhances the NF-kappaB-mediated gene expression."], confirmed by pull-down and co-immunoprecipitation
      [PMID:18178962 "The interaction between AKIP1 and p65 was confirmed by glutathione S-transferase
      pull-down assay in vitro and immunoprecipitation-Western blotting assay in vivo."]; the kinase is
      present in that complex and phosphorylates p65 [PMID:18178962 "We found that the PKAc was present
      in the AKIP1.p65 complex and enhanced the transcriptional activity of NF-kappaB by phosphorylating
      p65."], and the effect is lost on knockdown [PMID:18178962 "When AKIP1 was knocked down by RNA interference,
      the PMA-mediated NF-kappaB-dependent gene expression was abolished, indicating a physiological role
      of AKIP1."]. GO:0035591 is the binding activity that brings components of one signalling pathway
      together so they act in a coordinated way, which is this. It is the same term the AKAP7 review uses
      for the analogous PKA-to-channel bridge; AKIP1 is not an AKAP, but it does the same kind of work
      with a different subunit. No IPI partner accession is recorded because the abstract does not state
      the species of the co-immunoprecipitation, and recording a guessed one would misstate what was tested.'
    supported_by:
    - reference_id: PMID:18178962
      supporting_text: we have identified protein kinase A-interacting protein 1 (AKIP1) as a binding
        partner of NF-kappaB p65 subunit, and AKIP1 enhances the NF-kappaB-mediated gene expression.
    - reference_id: PMID:18178962
      supporting_text: The interaction between AKIP1 and p65 was confirmed by glutathione S-transferase
        pull-down assay in vitro and immunoprecipitation-Western blotting assay in vivo.
    - reference_id: PMID:18178962
      supporting_text: We found that the PKAc was present in the AKIP1.p65 complex and enhanced the transcriptional
        activity of NF-kappaB by phosphorylating p65.
    - reference_id: PMID:15630084
      supporting_text: we identified a PKA-interacting protein (AKIP1) that binds to the amino terminus
        (residues 1-39) of the C subunit of PKA.
