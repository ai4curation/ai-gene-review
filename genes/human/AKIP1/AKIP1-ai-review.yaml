      Rac1 and beta-catenin papers, none cited by GOA.
core_functions:
- description: Nuclear partner of the PKA catalytic subunit that directs PKA output onto NF-kappaB p65.
    AKIP1 binds the catalytic subunit's N-terminal A helix through its own carboxyl terminus, increases
    nuclear catalytic subunit on cAMP stimulation, and enables PKA to phosphorylate p65 on Ser-276, switching
    PKA from suppressing to enhancing canonical NF-kappaB transcription.
  molecular_function:
    id: GO:0035591
    label: signaling adaptor activity
  directly_involved_in:
  - id: GO:0043123
    label: positive regulation of canonical NF-kappaB signal transduction
  locations:
  - id: GO:0005654
    label: nucleoplasm
  supported_by:
  - reference_id: PMID:15630084
    supporting_text: we identified a PKA-interacting protein (AKIP1) that binds to the amino terminus
