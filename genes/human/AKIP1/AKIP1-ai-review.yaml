suggested_questions:
- question: AKIP1's carboxyl terminus binds the PKA catalytic subunit and also ends in a class II PDZ-binding
    motif. Are PDZ binding and catalytic-subunit binding mutually exclusive, and does a PDZ partner sequester
    AKIP1 away from PKA?
- question: 'Should AKIP1 carry a nuclear-retention process term? The discovery paper''s headline result
    is that AKIP1 raises nuclear PKA catalytic subunit, and the p65 paper''s title is nuclear retention
    of p65. Not added as NEW here: both are overexpression results and the participation mechanism (anchoring
    versus blocking export) is not shown.'
- question: Do the reported Rac1 and beta-catenin interactions hold beyond the single studies that report
    them?
- question: Which human splice variant represses and which enhances NF-kappaB, and are the existing annotations
    tied to the right one?
