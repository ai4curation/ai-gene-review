- id: PMID:20562110
  title: A-kinase-interacting protein 1 (AKIP1) acts as a molecular determinant of PKA in NF-kappaB signaling.
  findings:
  - statement: PKA phosphorylation of p65 on Ser-276 is the mechanism.
    supporting_text: attenuated PKA-dependent phosphorylation of p65 on Ser-276
  - statement: AKIP1 reverses PKA's inhibitory effect on NF-kappaB.
    supporting_text: This inhibitory function of PKAc in NF-kappaB signaling was reversed by overexpression
      of AKIP1 in 293 cells.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached. The best-characterized function. Not cited by any GO annotation; it
      is what shows the InterPro mapping chose the wrong NF-kappaB branch.
- id: PMID:18178962
  title: AKIP1 enhances NF-kappaB-dependent gene expression by promoting the nuclear retention and phosphorylation
    of p65.
  findings:
  - statement: AKIP1 binds p65 directly, by two-hybrid, pull-down and co-immunoprecipitation.
    supporting_text: The interaction between AKIP1 and p65 was confirmed by glutathione S-transferase
      pull-down assay in vitro and immunoprecipitation-Western blotting assay in vivo.
  - statement: The PKA catalytic subunit is in the AKIP1-p65 complex and phosphorylates p65.
    supporting_text: We found that the PKAc was present in the AKIP1.p65 complex and enhanced the transcriptional
      activity of NF-kappaB by phosphorylating p65.
  - statement: Knocking down AKIP1 abolishes PMA-induced NF-kappaB gene expression.
    supporting_text: When AKIP1 was knocked down by RNA interference, the PMA-mediated NF-kappaB-dependent
      gene expression was abolished, indicating a physiological role of AKIP1.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only. The paper UniProt cites with an experimental evidence code for AKIP1's
      NF-kappaB function, yet cited by no GO annotation. It supplies the direct p65 contact, which with
      the catalytic-subunit binding grounds the signaling adaptor row.
- id: PMID:23319652
  title: A kinase interacting protein (AKIP1) is a key regulator of cardiac stress.
  findings:
  - statement: AKIP1 localizes to interfibrillary mitochondria in cardiac myocytes.
    supporting_text: AKIP1 is preferentially localized to interfibrillary mitochondria and up-regulated
      in this cardiac mitochondrial subpopulation on ischemic injury.
  - statement: Mouse and human AKIP1a are only about 70% identical.
    supporting_text: Because there is only 70% homology between the mouse and human AKIP1a
  - statement: 'The NF-kappaB effect depends on splice variant: AKIP1b represses via SIRT1.'
    supporting_text: AKIP1b was shown to recruit the histone deacetylase silent mating type information
      regulation 2 homolog (SIRT1) in a NEDDylation (NEDD8, neural precursor cell expressed, developmentally
      down-regulated 8-mediated)-dependent manner and repress transcription
  - statement: AKIP1a, the canonical isoform, enhances.
    supporting_text: In contrast, AKIP1a was shown to recruit NF-κB in a PKA-dependent manner and enhance
      transcription
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text cached. The mitochondrial localization is shown in rat myocytes and is curated
      for no species; given the modest rodent-human conservation it is recorded as a knowledge gap rather
      than added.
- id: PMID:17227220
  title: Breast cancer-associated gene 3 (BCA3) is a novel Rac1-interacting protein.
  findings:
  - statement: AKIP1 (BCA3) binds GTP-bound Rac1 directly.
    supporting_text: BCA3 binds directly to Rac and, in vivo, binds GTP-Rac but not GDP-Rac.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only. A single study in osteoclasts; recorded as a question rather than annotated.
