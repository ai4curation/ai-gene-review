- id: PMID:15630084
  title: A-kinase-interacting protein localizes protein kinase A in the nucleus.
  findings:
  - statement: AKIP1 binds the N-terminal A helix of the PKA catalytic subunit.
    supporting_text: we identified a PKA-interacting protein (AKIP1) that binds to the amino terminus
      (residues 1-39) of the C subunit of PKA.
  - statement: The contact is the catalytic subunit A helix and the AKIP1 C-terminus.
    supporting_text: The interaction was localized to the A helix (residues 14-39) of the C subunit and
      to the carboxyl terminus of AKIP1.
  - statement: AKIP1 is nuclear, in speckles.
    supporting_text: In normal breast (Hs 578 Bst) and HeLa cells, AKIP1 is present in the nucleus as
      speckles.
  - statement: AKIP1 raises nuclear PKA catalytic subunit on cAMP stimulation.
    supporting_text: Upon stimulation with forskolin, HeLa cells expressing AKIP1 accumulated higher levels
      of the endogenous C subunit in the nucleus.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only. The discovery paper; grounds the catalytic-subunit binding refinement
      and the nuclear location.
- id: PMID:36115835
  title: Quantitative fragmentomics allow affinity mapping of interactomes.
  findings:
  - statement: A systematic PDZ-PBM affinity screen, the source of 18 PDZ-partner rows.
    supporting_text: Here, we measure the affinities of 65,000 interactions involving PDZ domains and
      their target PDZ-binding motifs (PBM)
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text cached, but AKIP1 is never named in the text - its data are supplementary.
      Supports PDZ domain binding as what was measured; these are peptide-domain affinities, not cellular
      interactions.
- id: PMID:32296183
  title: A reference map of the human binary protein interactome.
  findings:
  - statement: Proteome-scale binary interactome.
    supporting_text: Here we present a human 'all-by-all'
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Full text cached. Source of one generic protein-binding row (FHL2).
- id: PMID:32814053
  title: Interactome Mapping Provides a Network of Neurodegenerative Disease Proteins and Uncovers Widespread
    Protein Aggregation in Affected Brains.
  findings:
  - statement: A neurodegenerative-disease yeast two-hybrid interactome.
    supporting_text: generated by systematic yeast two-hybrid interaction screening of ∼500 ND-related
      proteins
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Abstract-only. Source of three generic protein-binding rows (FGFR3, GSN and the uncharacterised
      GW128).
- id: PMID:20562110
  title: A-kinase-interacting protein 1 (AKIP1) acts as a molecular determinant of PKA in NF-kappaB signaling.
  findings:
  - statement: PKA phosphorylation of p65 on Ser-276 is the mechanism.
    supporting_text: attenuated PKA-dependent phosphorylation of p65 on Ser-276
  - statement: AKIP1 reverses PKA's inhibitory effect on NF-kappaB.
    supporting_text: This inhibitory function of PKAc in NF-kappaB signaling was reversed by overexpression
      of AKIP1 in 293 cells.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached. The best-characterized function. Not cited by any GO annotation; it
      is what shows the InterPro mapping chose the wrong NF-kappaB branch.
- id: PMID:23319652
  title: A kinase interacting protein (AKIP1) is a key regulator of cardiac stress.
  findings:
  - statement: AKIP1 localizes to interfibrillary mitochondria in cardiac myocytes.
    supporting_text: AKIP1 is preferentially localized to interfibrillary mitochondria and up-regulated
      in this cardiac mitochondrial subpopulation on ischemic injury.
  - statement: Mouse and human AKIP1a are only about 70% identical.
    supporting_text: Because there is only 70% homology between the mouse and human AKIP1a
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text cached. The mitochondrial localization is shown in rat myocytes and is curated
      for no species; given the modest rodent-human conservation it is recorded as a knowledge gap rather
      than added.
- id: PMID:17227220
  title: Breast cancer-associated gene 3 (BCA3) is a novel Rac1-interacting protein.
  findings:
  - statement: AKIP1 (BCA3) binds GTP-bound Rac1 directly.
    supporting_text: BCA3 binds directly to Rac and, in vivo, binds GTP-Rac but not GDP-Rac.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only. A single study in osteoclasts; recorded as a question rather than annotated.
- id: PMID:30936461
  title: AKIP1 promotes early recurrence of hepatocellular carcinoma through activating the Wnt/β-catenin/CBP
    signaling pathway.
  findings:
  - statement: AKIP1 binds beta-catenin.
    supporting_text: Here we identified AKIP1 as a binding partner of β-catenin.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only. A single cancer-cell study; recorded as a question rather than annotated.
- id: file:genes/human/AKIP1/AKIP1-deep-research-affinage.md
  title: Affinage mechanistic annotation for AKIP1 (human)
  findings:
  - statement: Affinage summarises the NF-kappaB mechanism as p65 Ser-276 phosphorylation - the canonical
      pathway.
    supporting_text: in cells with high AKIP1, PKA-activating agents enhance p65–PKAc interaction, p65
      Ser-276 phosphorylation, and NF-κB-dependent transcription
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Trust gates passed; a wide and accurate summary that surfaced the NF-kappaB, mitochondrial,
      Rac1 and beta-catenin papers, none cited by GOA.
core_functions:
- description: Nuclear partner of the PKA catalytic subunit that directs PKA output onto NF-kappaB p65.
    AKIP1 binds the catalytic subunit's N-terminal A helix through its own carboxyl terminus, increases
    nuclear catalytic subunit on cAMP stimulation, and enables PKA to phosphorylate p65 on Ser-276, switching
    PKA from suppressing to enhancing canonical NF-kappaB transcription.
  molecular_function:
    id: GO:0034236
    label: protein kinase A catalytic subunit binding
  directly_involved_in:
  - id: GO:0043122
    label: regulation of canonical NF-kappaB signal transduction
  locations:
  - id: GO:0005654
    label: nucleoplasm
  supported_by:
  - reference_id: PMID:15630084
    supporting_text: we identified a PKA-interacting protein (AKIP1) that binds to the amino terminus
      (residues 1-39) of the C subunit of PKA.
  - reference_id: PMID:15630084
    supporting_text: Upon stimulation with forskolin, HeLa cells expressing AKIP1 accumulated higher levels
      of the endogenous C subunit in the nucleus.
  - reference_id: PMID:20562110
    supporting_text: attenuated PKA-dependent phosphorylation of p65 on Ser-276
  - reference_id: PMID:20562110
    supporting_text: This inhibitory function of PKAc in NF-kappaB signaling was reversed by overexpression
      of AKIP1 in 293 cells.
  knowledge_gaps:
  - gap_statement: Whether AKIP1 localizes to mitochondria in human cells, and what it does there, is
      undetermined.
    boundary: Shown in rat cardiac myocytes, with an interaction with AIF; curated for no species. Rodent
      and human AKIP1 are only about 70% identical and rodents lack the human splice variants, so transfer
      is not safe without a human experiment.
    gap_kind:
    - BIOLOGY
    - CURATION
    dark_aspect: CC_DARK
    provenance:
    - reference_id: PMID:23319652
      supporting_text: AKIP1 is preferentially localized to interfibrillary mitochondria and up-regulated
        in this cardiac mitochondrial subpopulation on ischemic injury.
    - reference_id: PMID:23319652
      supporting_text: Because there is only 70% homology between the mouse and human AKIP1a
proposed_new_terms: []
suggested_questions:
- question: AKIP1's carboxyl terminus binds the PKA catalytic subunit and also ends in a class II PDZ-binding
    motif. Are PDZ binding and catalytic-subunit binding mutually exclusive, and does a PDZ partner sequester
    AKIP1 away from PKA?
- question: Do the reported Rac1 and beta-catenin interactions hold beyond the single studies that report
    them?
- question: Which human splice variant represses and which enhances NF-kappaB, and are the existing annotations
    tied to the right one?
suggested_experiments:
- description: Image tagged human AKIP1 against mitochondrial markers in human cardiomyocytes to test
    the mitochondrial localization seen in rat.
- description: Mutate the C-terminal F-P-V motif and test PDZ partner binding and PKA catalytic subunit
    binding separately.
