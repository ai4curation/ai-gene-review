    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:15630084
  qualifier: enables
  supporting_entities:
  - UniProtKB:P17612
  review:
    summary: Binding to PRKACA, the PKA catalytic subunit - the interaction AKIP1 is named for. Modified
      to the specific catalytic-subunit term.
    action: MODIFY
    reason: 'This is the defining interaction and the discovery paper maps it on both sides: AKIP1 binds
      the catalytic subunit''s N-terminal A helix [PMID:15630084 "we identified a PKA-interacting protein
      (AKIP1) that binds to the amino terminus (residues 1-39) of the C subunit of PKA."], [PMID:15630084
      "The interaction was localized to the A helix (residues 14-39) of the C subunit and to the carboxyl
      terminus of AKIP1."]. GO:0034236 protein kinase A catalytic subunit binding is the precise, verified
      child of GO:0051018 for this. Notably it is the catalytic subunit, not the RII regulatory subunit
      that AKAPs bind - AKIP1 is not an AKAP despite the name. Per the project''s GO:0005515 policy the
      generic term is not marked over-annotated - its defect is that it is uninformative - and removal
      is not a claim that the interaction is false.'
    proposed_replacement_terms:
    - id: GO:0034236
      label: protein kinase A catalytic subunit binding
    supported_by:
    - reference_id: PMID:15630084
      supporting_text: we identified a PKA-interacting protein (AKIP1) that binds to the amino terminus
        (residues 1-39) of the C subunit of PKA.
    - reference_id: PMID:15630084
      supporting_text: The interaction was localized to the A helix (residues 14-39) of the C subunit
        and to the carboxyl terminus of AKIP1.
