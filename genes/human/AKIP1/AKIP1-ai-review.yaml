- term:
    id: GO:1901222
    label: regulation of non-canonical NF-kappaB signal transduction
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR033214
  review:
    summary: Regulation of NON-canonical NF-kappaB signalling, from InterPro. AKIP1 acts on p65, the canonical
      pathway; modified to the canonical term.
    action: MODIFY
    reason: 'The essence - AKIP1 regulates NF-kappaB - is well supported, but the branch is wrong. The
      mechanism is PKA phosphorylation of p65 on Ser-276 [PMID:20562110 "attenuated PKA-dependent phosphorylation
      of p65 on Ser-276"], which AKIP1 enables [PMID:20562110 "This inhibitory function of PKAc in NF-kappaB
      signaling was reversed by overexpression of AKIP1 in 293 cells."], and p65 is the canonical-pathway
      subunit; the non-canonical pathway runs through NIK, p100 processing and RelB. The mapping''s own
      source, InterPro IPR033214, describes AKIP1 colocalizing with p65 and says nothing about the non-canonical
      pathway, so the branch is not supported even there. GO:0043122 regulation of canonical NF-kappaB
      signal transduction is the replacement, deliberately direction-neutral: InterPro notes that different
      AKIP1 splice variants have been reported to repress or enhance NF-kappaB transcription.'
    proposed_replacement_terms:
    - id: GO:0043122
      label: regulation of canonical NF-kappaB signal transduction
    supported_by:
    - reference_id: PMID:20562110
      supporting_text: attenuated PKA-dependent phosphorylation of p65 on Ser-276
    - reference_id: PMID:20562110
      supporting_text: This inhibitory function of PKAc in NF-kappaB signaling was reversed by overexpression
        of AKIP1 in 293 cells.
    - reference_id: file:genes/human/AKIP1/AKIP1-deep-research-affinage.md
      supporting_text: in cells with high AKIP1, PKA-activating agents enhance p65–PKAc interaction, p65
        Ser-276 phosphorylation, and NF-κB-dependent transcription
