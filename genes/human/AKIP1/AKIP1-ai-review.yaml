- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:36115835
  qualifier: enables
  supporting_entities:
  - UniProtKB:A4D2P6
  review:
    summary: Binding to GRID2IP, a PDZ-domain protein, measured by PDZ-PBM affinity profiling. Modified
      to PDZ domain binding, which the assay itself measures.
    action: MODIFY
    reason: 'The study is a systematic affinity screen of exactly this interaction class [PMID:36115835
      "Here, we measure the affinities of 65,000 interactions involving PDZ domains and their target PDZ-binding
      motifs (PBM)"], and GRID2IP is one of 18 PDZ-domain partners it reports for AKIP1. AKIP1 does carry
      a candidate motif: its C-terminal residues end F-P-V, a class II PDZ-binding motif (hydrophobic-x-hydrophobic
      at the carboxyl terminus). So ''PDZ domain binding'' (GO:0030165) is what was measured and has a
      sequence basis. Two cautions travel with it: the AKIP1 values sit in the paper''s supplementary
      data rather than its text, and these are peptide-domain affinities rather than interactions shown
      in cells. Per the project''s GO:0005515 policy the generic term is not marked over-annotated - its
      defect is that it is uninformative - and removal is not a claim that the interaction is false.'
    proposed_replacement_terms:
    - id: GO:0030165
      label: PDZ domain binding
    supported_by:
    - reference_id: PMID:36115835
      supporting_text: Here, we measure the affinities of 65,000 interactions involving PDZ domains and
        their target PDZ-binding motifs (PBM)
