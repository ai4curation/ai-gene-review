  supporting_entities:
  - UniProtKB:Q9BQ04
  review:
    summary: CNNM4 binds RBM4B, called RBM30 in the original study.
    action: KEEP_AS_NON_CORE
    reason: The human brain-library screen initially yielded a clone containing COX11
      and RBM30 plasmids. The investigators subsequently retested the two prey proteins
      separately with full-length ACDP4 and negative-vector controls, supporting each
      positive interaction. RBM4B is an RNA-binding protein, but no verified more
      specific partner-class term captures this pair. The assay does not establish
      a physiological RNA-regulatory role for CNNM4.
    supported_by:
    - reference_id: PMID:15840172
      supporting_text: ACDP4 also interacts with RBM30
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:15840172
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q9Y6N1
  review:
    summary: CNNM4 has an experimentally supported interaction with COX11.
    action: KEEP_AS_NON_CORE
    reason: Separate yeast two-hybrid retesting supports the COX11 pair, and coexpression
      modifies metal-induced toxicity in HEK293 cells. COX11 is a copper-delivery
      assembly factor, so protein-folding chaperone binding would misclassify the
      partner. The proposed direct metal handoff and native complex architecture were
      not demonstrated.
    supported_by:
    - reference_id: PMID:15840172
      supporting_text: ACDP4 physically interacts with COX11
