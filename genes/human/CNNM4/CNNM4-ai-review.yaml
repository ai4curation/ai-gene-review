- id: PMID:42497866
  title: Dynamic dimer-of-dimers architecture defines Mg(2+) transport in human CNNM4.
  findings:
  - statement: Full-length human CNNM4 forms an MgATP-bound dimer-of-dimers; surface-controlled
      mutations impair magnesium efflux.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected complete Methods/Results inspected. Outward-facing and
      mutant occluded human structures are observed; the inward state is inferred
      from CorC, and sodium densities are tentative. No raw-map reanalysis or purified
      flux reconstitution is claimed.
- id: PMID:34928937
  title: CNNM proteins selectively bind to the TRPM7 channel to stimulate divalent
    cation entry into cells.
  findings:
  - statement: Human CNNM4 associates with TRPM7 and restores channel currents and
      magnesium uptake independently of its magnesium-lowering function.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected Methods/Results and captions inspected. WT current rescue
      uses modest episomal expression. The explicit Fig. 3E caption resolves the prose
      buffer-order ambiguity. Mouse CNNM2 pore-mutant experiments are not attributed
      to human CNNM4.
