core_functions:
- description: CNNM4 couples magnesium export to sodium entry at the plasma membrane,
    supporting magnesium balance and directional transport in polarized epithelia.
    MgATP binding to its CBS region helps organize the full-length dimer-of-dimers
    assembly. Cellular exchange measurements and human structures support antiporter
    activity; exact cycle stoichiometry and the inward-facing human conformation remain
    unresolved. This function is established for full-length CNNM4, not the short
    alternative product.
  molecular_function:
    id: GO:0061768
    label: magnesium:sodium antiporter activity
  directly_involved_in:
  - id: GO:1903830
    label: magnesium ion transmembrane transport
  - id: GO:0035725
    label: sodium ion transmembrane transport
  - id: GO:0010960
    label: magnesium ion homeostasis
  locations:
  - id: GO:0016323
    label: basolateral plasma membrane
  supported_by:
  - reference_id: PMID:24339795
  - reference_id: PMID:24706765
  - reference_id: PMID:42497866
- description: CNNM4 associates with TRPM7 and increases divalent-cation channel activity.
    WT human CNNM4 current rescue and efflux-defective mutant assays separate this
    regulatory activity from magnesium export. TRPM7 supplies the influx pore; CNNM4
    does not thereby acquire channel or kinase activity.
  molecular_function:
    id: GO:0099106
    label: ion channel regulator activity
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
