  evidence_type: IDA
  original_reference_id: PMID:15840172
  qualifier: involved_in
  review:
    summary: The original study supports a broad metal-homeostasis context with assay
      limits.
    action: KEEP_AS_NON_CORE
    reason: ACDP4 expression altered copper-, manganese- and cobalt-induced cell toxicity,
      and COX11 coexpression enhanced these effects. The authors explicitly called
      for direct metal-accumulation measurements; viability alone does not identify
      a transported metal or flux direction. Later direct magnesium measurements support
      CNNM4 cation homeostasis, while the original broad assertion is retained as
      contextual evidence.
    supported_by:
