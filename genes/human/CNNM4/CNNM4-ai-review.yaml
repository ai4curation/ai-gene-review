- term:
    id: GO:0015081
    label: sodium ion transmembrane transporter activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - MGI:MGI:2151060
  - PANTHER:PTN002635769
  review:
    summary: The coupled magnesium:sodium antiporter term captures the measured activity.
    action: MODIFY
    reason: The sodium-transporter assertion has positive experimental grounding,
      and human CNNM4 assays permit a more precise coupled classification. Sodium
      removal blocks magnesium efflux, sodium restoration restores it, and SBFI/Mag-fura2
      measurements show sodium entry alongside magnesium loss. The reported approximately
      2:1 cellular flux relationship is consistent with electroneutral exchange; it
      is not a purified single-cycle stoichiometry. Full-length human structures and
      surface-controlled mutagenesis strengthen target attribution. The original propagation
      source remains intact; this refinement does not assert an error in historical
      PAINT placement.
    supported_by:
    - reference_id: GO_REF:0000033
    - reference_id: PMID:24339795
      supporting_text: In the absence of extracellular Na+, Mg2+ depletion did not
        induce Mg2+ extrusion
