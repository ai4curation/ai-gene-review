  review:
    summary: CNNM4 participates in protein assemblies, with the original interaction
      context preserved.
    action: KEEP_AS_NON_CORE
    reason: The original COX11/RBM30 study supports physical association through two-hybrid
      experiments but leaves native architecture and metal handoff unresolved. Independent
