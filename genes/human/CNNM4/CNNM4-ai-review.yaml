- term:
    id: GO:0099106
    label: ion channel regulator activity
  evidence_type: IDA
  original_reference_id: PMID:34928937
  qualifier: enables
  review:
    summary: Human CNNM4 interacts with TRPM7 and promotes its channel activity.
    action: NEW
    reason: CNNM4 coimmunoprecipitates with TRPM7, including endogenous proteins,
      and modest WT human CNNM4 reexpression restores TRPM7 whole-cell currents and
      magnesium uptake in CNNM3/4-deficient cells. Similar surface-channel levels
      and the SLC41A1 comparator distinguish this from generic magnesium lowering.
      Human CNNM4 S196P and CBS-deletion variants retain current rescue despite impaired
      efflux. This is performed channel regulation, not assignment of the TRPM7 pore
      or kinase activity to CNNM4. The new MF has no typed ancestor/descendant overlap
      with the seeded terms or ATP-binding addition.
    supported_by:
    - reference_id: PMID:34928937
      supporting_text: the recorded TRPM7 currents increased
    - reference_id: PMID:40962059
- term:
    id: GO:0005524
    label: ATP binding
  evidence_type: IDA
  original_reference_id: PMID:24706765
  qualifier: enables
  review:
    summary: Human CNNM4 directly binds MgATP through its CBS region.
    action: NEW
    reason: Purified human CNNM4 residues 359–511 bind radiolabeled ATP in a magnesium-dependent
      filter-binding assay with a GST control; the reported affinity is 43.4 ± 8.9
      µM. Full-length human CNNM4 also contains bound MgATP in the cryo-EM structure.
      This is measured recognition rather than an inference from a domain name, and
      it does not establish ATP hydrolysis. The 263-residue alternative product lacks
      the assayed CBS segment. ATP binding is nonredundant with the transport and
      channel-regulator MFs.
    supported_by:
    - reference_id: PMID:24706765
      supporting_text: all of these proteins, except for CNNM3, showed saturable binding
        with ATP
    - reference_id: PMID:42497866
