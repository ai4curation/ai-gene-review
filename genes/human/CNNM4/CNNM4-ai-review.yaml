- id: PMID:24339795
  title: 'Basolateral Mg2+ extrusion via CNNM4 mediates transcellular Mg2+ transport
    across epithelia: a mouse model.'
  findings:
  - statement: Human CNNM4 drives sodium-coupled magnesium efflux; mouse knockout
      establishes intestinal magnesium-balance phenotypes.
  reference_review:
    relevance: HIGH
