id: Q6P4Q7
gene_symbol: CNNM4
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CNNM4 is a plasma-membrane magnesium transporter with an extracellular
  domain, a transmembrane transport region, tandem CBS domains and a cyclic nucleotide-binding
  homology domain. It couples magnesium export to sodium entry and also associates
  with TRPM7 to promote divalent-cation channel activity. MgATP binding organizes
  its cytoplasmic domains, and full-length human CNNM4 forms an asymmetric dimer-of-dimers
  assembly. Basolateral epithelial localization supports directional magnesium movement
  and systemic magnesium balance. Biallelic pathogenic variants cause Jalili syndrome,
  combining cone-rod dystrophy with defective enamel formation.
