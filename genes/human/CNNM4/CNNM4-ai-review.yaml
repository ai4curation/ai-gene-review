  - reference_id: PMID:40962059
suggested_questions:
- question: What is the complete human CNNM4 ion-coupling cycle, including the inward-facing
    state and the identity and occupancy of the putative sodium sites?
- question: Does the 263-residue Q6P4Q7-2 product have a stable physiological role
    despite lacking the transmembrane and CBS regions?
- question: How are CNNM4 efflux and TRPM7 regulation coordinated in polarized epithelia
    and in retinal or enamel-forming cells?
suggested_experiments:
- description: Reconstitute purified full-length human CNNM4 into oriented proteoliposomes
    and measure simultaneous sodium and magnesium flux under controlled gradients,
    with empty-vesicle and transport-site mutant controls.
  hypothesis: CNNM4 directly catalyzes coupled sodium/magnesium exchange with an experimentally
    measurable coupling relationship.
- description: Compare matched full-length CNNM4 and the reconstructed short alternative
    product for expression, localization, magnesium efflux and TRPM7 current rescue
    at comparable abundance.
  hypothesis: Loss of the transmembrane and CBS regions separates the short product
    from the established full-length transport mechanism.
