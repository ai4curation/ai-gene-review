    label: low-density lipoprotein particle receptor activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - MGI:MGI:96765
  - PANTHER:PTN002800105
  - RGD:2998
  - UniProtKB:P01130
  - ZFIN:ZDB-GENE-031217-1
  review:
    summary: 'Core function: LDLR is the prototypical LDL particle receptor.'
    action: ACCEPT
    reason: LDLR is the hepatocyte cell-surface receptor that captures apoB-100-containing LDL (and 
      apoE-containing lipoproteins) and carries it into the cell by clathrin-mediated endocytosis. 
      Functional receptor expression after cDNA transfection, and FH alleles that abolish LDL 
      binding or surface delivery, establish this activity directly.
    supported_by: &id003
    - reference_id: PMID:6091915
      supporting_text: Transfection of simian COS cells with the human LDL receptor cDNA linked to 
        the SV40 early promoter resulted in expression of functional cell surface receptors.
    - reference_id: PMID:6299582
      supporting_text: The receptor for low-density lipoprotein (LDL) is synthesized as a 120 kd 
        precursor that undergoes a 40 kd posttranslational increase in apparent molecular weight en 
        route to the cell surface.
    - reference_id: file:human/LDLR/LDLR-uniprot.txt
      supporting_text: Binds low density lipoprotein /LDL, the major cholesterol-carrying 
        lipoprotein of plasma, and transports it into cells by endocytosis.
