- term:
    id: GO:0005509
    label: calcium ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR001881
  - InterPro:IPR018097
  review:
    summary: Calcium binding by LDL-A repeats is structural.
    action: KEEP_AS_NON_CORE
    reason: Each LDL-A module coordinates a calcium ion that is required for its fold and for ligand
      binding; endosomal calcium loss contributes to ligand release. This is a structural property 
      supporting, not constituting, receptor function.
    supported_by:
    - reference_id: PMID:22091758
      supporting_text: The low-density lipoprotein receptor (LDLR), the primary receptor for 
        cholesterol uptake, binds ligands through its seven LDL-A modules (LAs).
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:10571240
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q60841
  review:
    summary: Uninformative protein binding; partner-specific functions are captured elsewhere.
    action: REMOVE
    reason: The IPI evidence reports a physical interaction but 'protein binding' says nothing about
      LDLR function. The biologically important interactions (apoB-100/apoE ligand binding, PCSK9 
      and IDOL-mediated degradation, ARH/AP-2 adaptor recognition of the FxNPxY tail) are 
      represented by more specific terms in this review. Removal does not mean the reported 
      interaction is false.
