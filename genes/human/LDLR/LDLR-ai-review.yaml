id: P01130
gene_symbol: LDLR
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: The low-density lipoprotein receptor (LDLR) is a single-pass type I transmembrane 
  endocytic receptor, most abundant on hepatocytes, that binds apolipoprotein B-100 on LDL and 
  apolipoprotein E on VLDL remnants through seven calcium-dependent LDL-A repeats. Receptors cluster
  in clathrin-coated pits, where the cytoplasmic FxNPxY signal is recognized by the adaptors AP-2 
  and ARH (LDLRAP1), and are internalized. In the acidic early endosome the EGF-precursor homology 
  domain (beta-propeller) displaces the ligand, which proceeds to lysosomes for hydrolysis, while 
  the receptor recycles to the surface. Hepatic LDLR is the main route of plasma LDL clearance and 
  of cellular cholesterol import, and its abundance is set by SREBP-2 transcription and by 
  post-translational degradation driven by PCSK9 binding to the EGF-A repeat and by IDOL-mediated 
  ubiquitination. Loss-of-function variants cause familial hypercholesterolemia. LDLR also serves as
  an entry receptor for several viruses.
