- term:
    id: GO:0001920
    label: negative regulation of receptor recycling
  evidence_type: IDA
  original_reference_id: PMID:17452316
  qualifier: involved_in
  review:
    summary: LDLR is the receptor whose recycling is inhibited, not the regulator.
    action: MARK_AS_OVER_ANNOTATED
    reason: In this study PCSK9 binding to the LDLR EGF-A repeat prevents LDLR recycling. The 
      regulator is PCSK9; LDLR is the regulated cargo, so the regulation term describes the 
      partner's role.
    supported_by:
    - reference_id: PMID:17452316
      supporting_text: Recombinant human PCSK9 interacted in a sequence-specific manner with the 
        first epidermal growth factor-like repeat (EGF-A) in the EGF homology domain of the human 
        LDLR.
    - reference_id: PMID:17452316
      supporting_text: As a consequence, the LDLR is rerouted from the endosome to the lysosome 
        where it is degraded.
- term:
    id: GO:0002020
    label: protease binding
  evidence_type: IPI
  original_reference_id: PMID:22081141
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q8NBP7-PRO_0000027120
  review:
    summary: PCSK9 binding is real but describes LDLR as a regulatory target.
    action: KEEP_AS_NON_CORE
    reason: The EGF-A repeat of LDLR is bound by PCSK9, a non-catalytic regulator in this context, 
      which redirects the receptor to lysosomes. The interaction is well established structurally, 
      but it is a regulatory input acting on LDLR rather than an LDLR function.
