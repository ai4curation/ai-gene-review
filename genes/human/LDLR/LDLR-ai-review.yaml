- term:
    id: GO:0001540
    label: amyloid-beta binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: enables
  supporting_entities:
  - UniProtKB:P35951
  - ensembl:ENSMUSP00000034713
  review:
    summary: Amyloid-beta binding reported from rodent/brain studies; non-core.
    action: KEEP_AS_NON_CORE
