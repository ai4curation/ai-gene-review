core_functions:
- description: Binds apoB-100-containing LDL at the cell surface and internalizes it by 
    clathrin-mediated receptor-mediated endocytosis, delivering cholesterol to the cell and clearing
    LDL from plasma; the receptor then recycles from early endosomes.
  molecular_function:
    id: GO:0005041
    label: low-density lipoprotein particle receptor activity
  directly_involved_in:
  - id: GO:0090118
    label: receptor-mediated endocytosis involved in cholesterol transport
  - id: GO:0034383
    label: low-density lipoprotein particle clearance
  locations:
  - id: GO:0005886
    label: plasma membrane
  - id: GO:0005905
    label: clathrin-coated pit
  - id: GO:0005769
    label: early endosome
  supported_by:
  - reference_id: file:human/LDLR/LDLR-uniprot.txt
    supporting_text: Binds low density lipoprotein /LDL, the major cholesterol-carrying lipoprotein 
      of plasma, and transports it into cells by endocytosis.
  - reference_id: PMID:6091915
    supporting_text: Transfection of simian COS cells with the human LDL receptor cDNA linked to the
      SV40 early promoter resulted in expression of functional cell surface receptors.
  - reference_id: PMID:6299582
    supporting_text: The other three mutations specify precursors (100, 120, and 170 kd) that 
      undergo a normal 40 kd increase in molecular weight and reach the surface, but do not bind LDL
      normally.
- description: Also binds apoE-containing lipoproteins (beta-VLDL, remnants) and mediates their 
    uptake, contributing to plasma remnant clearance.
  molecular_function:
    id: GO:0030229
    label: very-low-density lipoprotein particle receptor activity
  directly_involved_in:
  - id: GO:0034381
    label: plasma lipoprotein particle clearance
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:2777800
    supporting_text: This mutant receptor could not bind LDL, but could bind other ligands for the 
      LDL receptor, beta-migrating very low density lipoprotein, and the apolipoprotein E-lipid 
      complex.
  - reference_id: PMID:24412220
    supporting_text: The low-density lipoprotein receptor (LDLR) has a high affinity for apoE, and 
      is the only member of its receptor family to demonstrate an apoE isoform specific binding 
      affinity (E4>E3>>E2).
