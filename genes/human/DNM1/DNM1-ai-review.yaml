id: Q05193
gene_symbol: DNM1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Dynamin-1 is a large, predominantly neuronal GTPase that converts nucleotide hydrolysis into
  membrane remodeling during endocytosis. Its pleckstrin-homology domain binds phosphoinositides, its
  stalk supports self-assembly, and its proline-rich tail recruits SH3-domain partners. Assembly at membrane
  necks couples GTPase-domain interactions to constriction and vesicle scission, supporting receptor-mediated
  uptake and presynaptic membrane retrieval. Dynamin-1 also influences endocytic pit and vesicle dimensions.
  Alternative splicing changes an internal segment and the C-terminal tail; pathogenic variants can disrupt
  neuronal membrane trafficking and cause developmental and epileptic encephalopathy.
alternative_products:
- name: '1'
  id: Q05193-1
  description: The displayed 864-residue product has the canonical internal segment and long C terminus.
    The human 6DLU structural construct matches residues 1–748 exactly but omits the proline-rich tail.
- name: '2'
  id: Q05193-2
  sequence_note: VSP_031518
  description: This 864-residue product replaces the internal segment at canonical residues 407–444. The
    GTPase, PH and GED domain intervals are retained. The effect of this splice choice on activity and
    regulation remains unresolved.
- name: '3'
  id: Q05193-3
  sequence_note: VSP_031519
  description: This 851-residue product shares the canonical internal segment and replaces the final 20
    residues with a seven-residue tail. Its first 748 residues also match 6DLU, so that engineered deletion
    cannot distinguish products 1 and 3.
- name: '4'
  id: Q05193-5
  sequence_note: VSP_031518, VSP_031519
  description: Named isoform 4, accession Q05193-5 combines the internal 407–444 replacement and the shortened
    C terminus. Its retained catalytic domains do not demonstrate activity or regulatory equivalence to
    the other natural products.
