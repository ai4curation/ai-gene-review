core_functions:
- description: DNM1 couples GTP hydrolysis to oligomeric membrane remodeling and scission at endocytic
    necks. Assembly brings GTPase domains together to stimulate hydrolysis, while the polymer and lipid
    bilayer cooperate to constrict and sever the neck.
  molecular_function:
    id: GO:0061791
    label: GTPase motor activity
  directly_involved_in:
  - id: GO:0099050
    label: vesicle scission
  - id: GO:0006898
    label: receptor-mediated endocytosis
  - id: GO:0016185
    label: synaptic vesicle budding from presynaptic endocytic zone membrane
  locations:
  - id: GO:0005905
    label: clathrin-coated pit
  - id: GO:0098793
    label: presynapse
  supported_by:
  - reference_id: PMID:19084269
    supporting_text: confirming that the NT closure required GTP hydrolysis.
  - reference_id: PMID:20428113
    supporting_text: G domain dimerization is an integral part of dynamin’s assembly-stimulated GTPase
      activity.
  - reference_id: PMID:30069048
  - reference_id: PMID:15703209
  - reference_id: PMID:35220002
  - reference_id: PMID:9238017
suggested_questions:
- question: Which natural DNM1 splice products are responsible for the measured regulatory and membrane-remodeling
    differences under physiological neuronal conditions?
- question: Does DNM1 directly participate in clathrin cage assembly, or does its pre-fission effect on
    pit dimensions arise through other membrane-remodeling or recruitment steps?
- question: Can the DNM1 peptide/protein-group entry in the EPS-urine extracellular-vesicle dataset be
    recovered and independently verified?
