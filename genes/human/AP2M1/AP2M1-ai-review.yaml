id: Q96CW1
gene_symbol: AP2M1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: AP2M1 encodes the medium μ2 subunit of the heterotetrameric AP-2 clathrin adaptor complex.
  Its C-terminal domain recognizes cytoplasmic sorting signals in membrane cargo, especially tyrosine-based
  motifs, while its N-terminal region helps assemble the adaptor core. AP-2 cycles between the cytosol
  and coats on the cytoplasmic face of the plasma membrane, coupling cargo selection to clathrin-dependent
  internalization. Membrane-dependent rearrangement and phosphorylation of μ2 Thr156 coordinate cargo
  capture and accessory-protein recruitment. This machinery supports receptor turnover and synaptic membrane-protein
  retrieval. Pathogenic AP2M1 variants can impair endocytosis and cause developmental and epileptic encephalopathy.
