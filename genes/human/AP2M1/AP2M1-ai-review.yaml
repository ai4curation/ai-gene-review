core_functions:
- description: AP2M1 recognizes cytoplasmic sorting sequences in cargo proteins and, as the medium subunit
    of AP-2, contributes to their coupling to the clathrin coat. Membrane-dependent rearrangement and
    regulated Thr156 phosphorylation coordinate cargo capture and coat maturation. This supports receptor
    uptake, endocytic budding and synaptic cargo retrieval; it does not make isolated μ2 the complete
    clathrin adaptor or a kinase.
