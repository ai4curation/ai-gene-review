suggested_questions:
- question: Which target-specific assay establishes AP2M1 residence on mature lysosomal or endolysosomal
    membranes, as distinct from its coat on carriers carrying cargo to those destinations?
- question: Where does human AP2M1 lie relative to the GO:0006896 IBD and same-term IRD in the complete
    PAINT tree, and is there target-specific retention or loss evidence?
- question: Which exact interaction experiments support the unresolved generic screen pairs, and which
    distinguish direct sorting-signal recognition from coassembly or indirect association?
- question: How do the two human AP2M1 isoforms differ in cargo recognition and regulation under endogenous
    expression, beyond both tested isoforms binding HCV core?
suggested_experiments:
- description: Compare matched human AP2M1 isoforms and cargo-site mutants in AP-2 reconstitution and
    endogenous rescue, measuring motif binding, coat recruitment and receptor uptake separately.
