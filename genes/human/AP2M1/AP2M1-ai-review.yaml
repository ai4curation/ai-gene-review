- term:
    id: GO:0044325
    label: transmembrane transporter binding
  evidence_type: IPI
  original_reference_id: PMID:23529131
  qualifier: enables
  supporting_entities:
  - UniProtKB:P51787
  review:
    summary: Retain binding to the membrane transporter KCNQ1.
    action: ACCEPT
    reason: The inspected original Fig. 3 shows endogenous μ2 co-IP with KCNQ1 in human HT29cl.19A cells,
      enhanced by estrogen during uptake. Co-IP supports the existing partner-class term; it does not
      establish a purified binary interface or experimentally map a particular KCNQ1 sorting motif.
    supported_by:
    - reference_id: PMID:23529131
      supporting_text: 'KCNQ1 was retrieved from the plasma membrane by a clathrin-mediated endocytosis,

        which involved the association between KCNQ1 and the clathrin adaptor, AP-2.'
      full_text_unavailable: true
- term:
    id: GO:0045334
    label: clathrin-coated endocytic vesicle
  evidence_type: NAS
  original_reference_id: PMID:25898166
  qualifier: located_in
  review:
    summary: Retain association with the clathrin-coated endocytic carrier.
    action: ACCEPT
    reason: The actual study characterizes μ2-dependent coated-pit/vesicle production and uses μ2 depletion/rescue
      controls. The adaptor is a transient coat component, not a permanent luminal or integral membrane
      protein.
    supported_by:
