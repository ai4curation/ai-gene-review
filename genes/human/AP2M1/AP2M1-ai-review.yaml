- id: PMID:17035630
  title: Functional analysis of AP-2 alpha and mu2 subunits.
  findings:
  - statement: μ2 cargo-site and phosphorylation-site mutations impair transferrin uptake in HeLa replacement
      assays.
    supporting_text: 'Mutating the PtdIns(4,5)P2 binding site of

      alpha, the phosphorylation site of mu2, or the YXXPhi binding site of mu2

      impairs AP-2 function, as assayed by transferrin uptake.'
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Actual recovered HTML and targeted Methods/Results read. Human HeLa endogenous depletion
      with resistant μ2 mutants supports cargo-site and Thr156 function. Mouse alpha plasmid identity
      does not establish inherited μ2 species; tag-dependent dysfunction remains relevant.
- id: PMID:20603002
  title: A large-scale conformational change couples membrane recruitment to cargo binding in the AP2
    clathrin adaptor complex.
  findings:
  - statement: The AP2 complex couples membrane and cargo binding to the clathrin scaffold through a regulated
      structural rearrangement.
    supporting_text: 'The AP2 adaptor complex (alpha, beta2, sigma2, and mu2 subunits) crosslinks the

      endocytic clathrin scaffold to PtdIns4,5P(2)-containing membranes and

      transmembrane protein cargo.'
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Actual recovered XML structural Results and construct context read. RCSB2XA7 μ2 chain
      is rat P84092 in a mixed-species core. Membrane-driven opening exposes cargo sites; it does not
      assign isolated μ2 the entire adaptor activity.
- id: PMID:31430451
  title: Temporal Ordering in Endocytic Clathrin-Coated Vesicle Formation via AP2 Phosphorylation.
  findings:
  - statement: μ2 Thr156 phosphorylation creates a NECAP-recruitment platform during coat maturation.
    supporting_text: 'μ2Thr156 phosphorylation favors a new, cargo-bound conformation of AP2

      and simultaneously creates a binding platform for the endocytic NECAP proteins'
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Actual recovered XML phosphorylation/NECAP Results and construct Methods read. μ2 phosphorylation
      supplies a binding platform during pit maturation; inherited μ2 species remains unresolved, unlike
      explicitly human NECAP. μ2 is substrate/platform, not kinase.
