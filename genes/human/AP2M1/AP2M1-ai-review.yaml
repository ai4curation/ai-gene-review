- term:
    id: GO:0035615
    label: clathrin-cargo adaptor activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - FB:FBgn0024833
  - FB:FBgn0263351
  - PANTHER:PTN000055849
  - dictyBase:DDB_G0289247
  review:
    summary: Retain μ2 contribution to clathrin-cargo adaptor activity.
    action: ACCEPT
    reason: μ2 supplies cargo-signal recognition within the assembled AP-2 adaptor; other subunits supply
      additional membrane and clathrin contacts. The authored core explicitly uses contributes_to_molecular_function.
      Original qualifiers are preserved, including the two existing contributes_to rows; acceptance does
      not claim autonomous isolated-μ2 bridging.
    supported_by:
    - reference_id: PMID:20603002
      supporting_text: 'The AP2 adaptor complex (alpha, beta2, sigma2, and mu2 subunits) crosslinks the

        endocytic clathrin scaffold to PtdIns4,5P(2)-containing membranes and

        transmembrane protein cargo.'
      full_text_unavailable: false
    - reference_id: PMID:23676497
      supporting_text: "we identified the clathrin \nadaptor AP2 as an interacting partner of a previously\
        \ uncharacterized atypical \nbinding motif in the ADAM10 C-terminal domain."
      full_text_unavailable: true
    - reference_id: PMID:12121421
      supporting_text: 'recognition of the FDNPVY signal is mediated by a binding site in the

        mu2-subunit that is distinct from the site for the more general YppØ sorting

        signal'
      full_text_unavailable: true
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN000055849
        source_status: UNRESOLVED
        comment: The actual PAINT node assertion was inspected in the local family export; full tree/MSA
          placement was not reconstructed. Target self-inclusion and donor count are not defects.
