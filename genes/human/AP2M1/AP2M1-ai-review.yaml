    label: receptor internalization
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  supporting_entities:
  - ARBA:ARBA00087457
  review:
    summary: Retain receptor internalization.
    action: ACCEPT
    reason: Independent human-cell uptake and cargo-tail experiments support the automated process assignment,
      although the exact ARBA rule was not reconstructed. μ2 recognizes and organizes cargo within AP-2
      rather than merely being consumed by internalization.
    supported_by:
    - reference_id: PMID:19419997
      supporting_text: 'We

        also identify tyrosine-995 of KIAA0319 as a critical amino acid required for the

        interaction with AP-2 and subsequent internalization.'
      full_text_unavailable: false
    - reference_id: PMID:31104773
      supporting_text: 'Functional complementation of both the μ-subunit carrying the p.Arg170Trp

        variant in human cells and astrocytes derived from AP-2μ conditional knockout

        mice revealed a significant impairment of CME of transferrin.'
      full_text_unavailable: false
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: ARBA:ARBA00087457
        source_status: UNRESOLVED
        comment: The exact donor experiment or electronic mapping was not reconstructed. Separately inspected
          target evidence is described in the rationale; no failure is inferred from donor count.
- term:
    id: GO:0031623
    label: receptor internalization
  evidence_type: IMP
  original_reference_id: PMID:25898166
