      supporting_text: AP2 depletion (of μ2) resulted in an ∼12-fold decrease in the number of endocytic
        CCPs/CCVs
      full_text_unavailable: false
    - reference_id: PMID:17035630
      supporting_text: 'Mutating the PtdIns(4,5)P2 binding site of

        alpha, the phosphorylation site of mu2, or the YXXPhi binding site of mu2

        impairs AP-2 function, as assayed by transferrin uptake.'
      full_text_unavailable: false
- term:
    id: GO:0048488
    label: synaptic vesicle endocytosis
  evidence_type: IDA
  original_reference_id: PMID:11102472
  qualifier: involved_in
  review:
    summary: Retain participation in synaptic-vesicle retrieval.
    action: ACCEPT
    reason: The actual cited main paper uses bovine brain AP-2/clathrin assembly and squid presynaptic
      intervention to establish conserved complex-level coat function during retrieval. Preserve the curated
      human process assertion with this cross-species scope explicit; the experiments do not isolate a
      human μ2 catalytic step or transfer beta2 clathrin-binding chemistry to μ2.
    supported_by:
    - reference_id: PMID:11102472
      supporting_text: "Microinjection of these peptides into squid giant \npresynaptic terminals reversibly\
        \ blocked synaptic transmission and inhibited \nsynaptic vesicle endocytosis by preventing coated\
        \ pit formation at the plasma \nmembrane."
      full_text_unavailable: false
    - reference_id: PMID:31671891
      supporting_text: μ2-subunit also interacts with C2 domains as present in Synaptotagmin1 [11] or
        Otoferlin [12].
      full_text_unavailable: false
