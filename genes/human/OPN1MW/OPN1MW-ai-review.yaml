  review:
    summary: OPN1MW is required for visual perception, specifically medium-wavelength (green) colour vision.
    action: ACCEPT
    reason: Organism-level process for which the gene is essential. A C203R substitution in the green opsin gene
      accompanies severe deuteranomaly (PMID:1302020); N94K and R330Q green opsins from deutan subjects form no
      or little pigment in COS-7 cells (PMID:12051694); a green-red hybrid gene causes deutan defects only in the
      expressed second position of the array (PMID:10319869).
    supported_by: &id006
    - reference_id: PMID:1302020
      supporting_text: A substitution of a highly conserved cysteine by arginine at position 203 in the green opsins
        presumably accounted for his colour vision defect
    - reference_id: PMID:10319869
      supporting_text: the green-red hybrid gene will only cause deutan defects when it occupies the second position
        of the pigment gene array
    - reference_id: file:human/OPN1MW/OPN1MW-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Mediates visual perception of green light in cone photoreceptor cells
