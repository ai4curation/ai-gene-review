  review:
    summary: OPN1MW is a light receptor and a GPCR; the specific activity is G protein-coupled photoreceptor activity.
    action: MODIFY
    reason: True but general. GO:0004930 G protein-coupled receptor activity and GO:0009881 photoreceptor activity
      are is_a ancestors of GO:0008020 G protein-coupled photoreceptor activity (combining with light and activating
      a heterotrimeric G protein by GDP-GTP exchange), which the gene already carries (rows 16-18). The cited papers
      are cell-culture mutagenesis of the human pigments (spectral tuning, PMID:8185948) and the C203R deuteranomaly
      case (PMID:1302020); both bear on the pigment's light-sensing role, which is part of this activity. Consistent
      with OPN1LW and RHO.
