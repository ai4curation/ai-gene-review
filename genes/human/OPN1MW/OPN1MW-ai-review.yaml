  review:
    summary: OPN1MW is a plasma membrane (and membrane) protein; the specific membrane is the cone photoreceptor
      disc membrane.
    action: MODIFY
    reason: True but general. Cone discs arise as evaginations of the ciliary plasma membrane and stay contiguous
      with it, so GO:0120201 cone photoreceptor disc membrane is an is_a descendant of plasma membrane and membrane;
      the gene already carries it (row 35) and the GO-CAM gomodel:69ea894900003563 uses it. In native human retina
      the green pigment is measured in cone outer segments (PMID:6140680). The IDA paper (PMID:20579627) compares
      wild-type and W177R MW opsin in cultured cells, where the mutant is retained in the ER; it shows surface delivery
      of the heterologous protein, not which part of a cone. PMID:2937147 (TAS) is the cloning paper. Same decision
      as OPN1LW; differs from RHO because rod discs are sealed and not plasma membrane.
