  review:
    summary: OPN1MW enables G protein-coupled photoreceptor activity.
    action: ACCEPT
    reason: Core activity. Recombinant M opsin activates transducin (GTPgammaS binding) and is quenched by phosphorylation
      (PMID:15773913); the cached abstract does not say which species the recombinant opsin was, and the retinas
      were ground squirrel and pig, so the IDA rests on mammalian M opsin rather than demonstrably on the human
      protein. The ISS row transfers the activity from the human L opsin (P04000), a paralog identical at all but
      15 residues whose transducin activation is assayed directly (see the OPN1LW review); the IBA is an opsin-clade
      node with direct evidence in its descendants. All three agree with the GO-CAM and the visual_phototransduction
      module.
    supported_by: &id007
    - reference_id: PMID:15773913
      supporting_text: Using an in vitro GTPgammaS binding assay, we also found that the ability of recombinant
        M opsin to activate G(t) was greatly reduced by phosphorylation
    - reference_id: file:human/OPN1MW/OPN1MW-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: G protein-coupled photoreceptor that selectively activates transducin G alpha protein (G(t))
        in response to medium-wavelength (green) light
