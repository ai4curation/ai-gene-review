    id: GO:0008020
    label: G protein-coupled photoreceptor activity
  directly_involved_in:
  - id: GO:0141190
    label: transducin-mediated opsin signaling pathway
  locations:
  - id: GO:0120201
    label: cone photoreceptor disc membrane
  supported_by:
  - reference_id: PMID:15773913
    supporting_text: Using an in vitro GTPgammaS binding assay, we also found that the ability of recombinant M
      opsin to activate G(t) was greatly reduced by phosphorylation
  - reference_id: PMID:6140680
    supporting_text: transverse measurements were made of the absorbance spectra of the outer segments of the rods
      and cones
- description: Covalent binding of the 11-cis-retinal chromophore, forming the green visual pigment that absorbs
    maximally near 530 nm.
  molecular_function:
    id: GO:0005502
    label: 11-cis retinal binding
  directly_involved_in:
  - id: GO:0016038
    label: absorption of visible light
  locations:
  - id: GO:0120201
    label: cone photoreceptor disc membrane
  supported_by:
  - reference_id: PMID:12051694
    supporting_text: Both normal and mutant opsins were expressed in cultured COS-7 cells and visual pigments were
      regenerated with 11-cis-retinal
  - reference_id: PMID:6140680
    supporting_text: green cones, 530.8 +/- 3.5 nm
suggested_questions:
- question: Which species was the recombinant M opsin used in PMID:15773913 for the GTPgammaS assay? If not human,
    the IDA rows on P04001 should be ISS from that ortholog.
- question: Does the green opsin dimer seen in purified Sf9-expressed pigment exist in cone outer segment membranes,
    and does it affect transducin coupling?
suggested_experiments:
- hypothesis: Human M opsin forms dimers in native cone disc membranes.
  description: Crosslinking or single-molecule imaging of M opsin in human retinal organoid cones, with a dimer-interface
    (TM4/TM5) mutant to test effects on transducin activation.
