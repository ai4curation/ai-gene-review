  review:
    summary: OPN1MW acts in G protein-coupled opsin signalling (phototransduction); the specific pathway is transducin-mediated
      opsin signalling.
    action: MODIFY
    reason: Each term (GPCR signaling pathway, phototransduction, cellular response to light stimulus) is a true
      ancestor of GO:0141190 transducin-mediated opsin signaling pathway, which the gene already carries (rows 36-37)
      and the GO-CAM uses. The assayed steps are mammalian M opsin activating G(t) and being phosphorylated in a
      light-dependent way in ground squirrel and pig retinas (PMID:15773913); the cascade downstream in cones is
      inferred from rod biochemistry and Reactome. PMID:2937147 (row 9) cloned the gene and did not assay signalling.
      Consistent with OPN1LW and RHO.
    proposed_replacement_terms: &id004
    - id: GO:0141190
      label: transducin-mediated opsin signaling pathway
    supported_by: &id005
    - reference_id: PMID:15773913
      supporting_text: Therefore, phosphorylation may participate directly in the termination of phototransduction
        in cones by decreasing the activity of M opsin
    - reference_id: Reactome:R-HSA-420883
      supporting_text: Stimulated opsins can act as GEFs for G (t) alpha subunits by replacing GDP with GTP
