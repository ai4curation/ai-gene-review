id: P04001
gene_symbol: OPN1MW
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: OPN1MW encodes the medium-wavelength-sensitive (M, "green") cone opsin, the visual pigment apoprotein
  of M cones. It is a seven-transmembrane G protein-coupled receptor of the opsin family that binds 11-cis-retinal
  covalently through a Schiff base at Lys-312, forming a pigment that absorbs maximally near 530 nm. Photoisomerization
  of the chromophore converts the pigment into an active receptor that catalyses GDP-GTP exchange on cone transducin,
  initiating the cGMP cascade that hyperpolarizes the cone; light-dependent phosphorylation of its C-terminal tail
  by GRK7 (or GRK1) and binding of cone arrestin terminate the signal. The pigment resides in the disc membranes
  of the cone outer segment, which are continuous with the plasma membrane. OPN1MW lies downstream of OPN1LW in
  a tandem X-chromosome array that often carries several M copies, of which only the gene next to OPN1LW is normally
  expressed; the L and M pigments differ at 15 of 364 residues. Loss, inactivation or L/M hybridization of the gene
  causes deutan colour vision deficiency, loss of all L and M pigment genes causes blue cone monochromacy, and the
  misfolding W177R allele causes X-linked cone dystrophy.
