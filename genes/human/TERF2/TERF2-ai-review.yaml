- term:
    id: GO:0006278
    label: RNA-templated DNA biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000108
  qualifier: involved_in
  supporting_entities:
  - GO:0003720
  review:
    summary: RNA-templated DNA biosynthetic process, IEA (GO_REF:0000108, inferred by a GO rule from the
      contributes_to telomerase activity annotation).
    action: REMOVE
    reason: 'This inference derives from the contributes_to telomerase activity annotations, which this
      review removes: TRF2 is not a telomerase subunit and does not participate in RNA-templated telomeric
      DNA synthesis; it regulates telomere length mostly negatively.'
    supported_by:
