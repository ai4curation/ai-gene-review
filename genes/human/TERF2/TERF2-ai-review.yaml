    reason: Bare protein binding is uninformative. The cited work shows TRF2, bound to telomeric DNA,
      recruiting this partner to telomeres through a docking interaction, which is chromatin-protein adaptor
      activity (GO:0140463; brings a protein to a chromatin region to establish its chromatin localization).
    proposed_replacement_terms: *id004
    supported_by:
    - reference_id: PMID:25620558
      supporting_text: Here, we establish that the shelterin protein TRF2 recruits RTEL1 to telomeres
        in S phase, which is required to prevent catastrophic t-loop processing by structure-specific
        nucleases.
