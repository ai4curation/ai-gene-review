- term:
    id: GO:0003720
    label: telomerase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: contributes_to
  supporting_entities:
  - PANTHER:PTN002929876
  - UniProtKB:Q15554
  review:
    summary: Contributes to telomerase activity, IBA (PAINT).
    action: REMOVE
    reason: TRF2 is not a telomerase subunit and contributes nothing to telomerase catalysis (RNA-templated
      addition of telomeric repeats by TERT/TERC). TRF2 regulates telomere length mostly negatively, and
      acts on duplex telomeric DNA. Association of telomerase with telomeres in IPs is a shelterin-level
      (TPP1-mediated) association, not a contribution to the activity. The IBA over-propagates a regulatory/associative
      relationship as a catalytic contribution. The IBA seed is the human TERF2 IDA itself, which this
      review judges unsupported.
    supported_by:
    - reference_id: PMID:23685356
      supporting_text: Antibodies against TRF1 and TRF2 immunoprecitated telomerase activity, putatively
        dependent on the previously established link between the shelterin component TPP1 and telomerase
    propagation_review:
      root_cause: SOURCE_BAD
      failure_modes:
      - ROLE_CONFLATION
      source_entities:
      - source_id: PANTHER:PTN002929876
        source_status: SOURCE_BAD
        comment: TRF ancestral node; the only experimental seed listed for contributes_to telomerase activity
          is human TERF2 itself, whose IDA rests on co-immunoprecipitation of telomerase activity (HOT1
          paper), not a contribution to catalysis.
      - source_id: UniProtKB:Q15554
        source_status: SOURCE_BAD
        comment: 'TERF2 IDA from PMID:23685356: telomerase activity co-precipitated with anti-TRF2, attributed
          by the authors to TPP1; association, not catalytic contribution.'
