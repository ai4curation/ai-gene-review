- term:
    id: GO:0140463
    label: chromatin-protein adaptor activity
  evidence_type: IDA
  original_reference_id: PMID:25620558
  review:
    summary: TRF2, bound to telomeric DNA, recruits Apollo, RAP1, SLX4, RTEL1 and dephosphorylated NBS1
      to telomeres through its TRFH docking site and other interaction surfaces.
    action: NEW
    reason: 'Proposed to capture the docking-hub molecular function that many protein binding IPI rows
      describe. The definition (brings together a protein and a region of chromatin to establish the chromatin
      localization of the protein) matches TRF2: partner telomere localization depends on TRF2 binding,
      shown by mutation of the TRFH site (TRF2 I124D loses RTEL1) and of the partner motif (Apollo-Delta).
      TRF2 itself performs the bridging, so it passes the participation test.'
    supported_by:
    - reference_id: PMID:25620558
      supporting_text: Here, we establish that the shelterin protein TRF2 recruits RTEL1 to telomeres
        in S phase, which is required to prevent catastrophic t-loop processing by structure-specific
        nucleases.
    - reference_id: PMID:19287395
      supporting_text: Our findings indicate that an array of TRF2 molecules functions as a protein hub
        and regulates telomeres by recruiting different signaling molecules via a linear sequence code.
    - reference_id: PMID:16730175
      supporting_text: Apollo appears preferentially localized at telomeres in a TRF2-dependent manner.
    - reference_id: PMID:24012755
      supporting_text: Telomeric localization of SLX4 and associated nucleases depend on the SLX4-endonuclease
        and SLX4-TRF2 interactions and the protein levels of SLX4 and TRF2.
