core_functions:
- description: 'Binds duplex TTAGGG telomeric repeats as a TRFH-domain homodimer within shelterin, and
    remodels telomere ends into t-loops. This DNA-bound architecture caps chromosome ends: it represses
    ATM/MRN signalling and classical NHEJ (preventing end fusions) and, through the basic domain, prevents
    homologous recombination from excising t-loops.'
  molecular_function:
    id: GO:0003691
    label: double-stranded telomeric DNA binding
  directly_involved_in:
  - id: GO:0016233
    label: telomere capping
  - id: GO:0031848
    label: protection from non-homologous end joining at telomere
  - id: GO:0031627
    label: telomeric loop formation
  - id: GO:0032208
    label: negative regulation of telomere maintenance via recombination
  locations:
  - id: GO:0000781
    label: chromosome, telomeric region
  in_complex:
    id: GO:0070187
    label: shelterin complex
  supported_by:
  - reference_id: PMID:9326950
    supporting_text: bound specifically to duplex TTAGGG repeats in vitro and localized to all human telomeres
      in metaphase chromosomes
  - reference_id: PMID:10338214
    supporting_text: Electron microscopy reported here demonstrated that TRF2 can remodel linear telomeric
      DNA into large duplex loops (t loops) in vitro.
  - reference_id: PMID:9476899
    supporting_text: Here, we show that the human telomeric protein TRF2 plays a key role in the protective
      activity of telomeres.
  - reference_id: PMID:15507207
    supporting_text: TRF2DeltaB-induced deletions depended on XRCC3, a protein implicated in Holliday
      junction resolution, and created t-loop-sized telomeric circles.
- description: 'Protein docking hub on telomeric chromatin: the TRFH domain binds Y/F/H-x-L-x-P motifs
    of Apollo/SNM1B, dephosphorylated NBS1, SLX4 and others, and further surfaces bind RAP1 and RTEL1,
    recruiting these factors to telomeres. Docking of dephosphorylated NBS1 keeps MRN from activating
    ATM at functional telomeres; Apollo recruitment generates leading-end overhangs; RTEL1 recruitment
    allows t-loop unwinding in S phase.'
  molecular_function:
    id: GO:0140463
    label: chromatin-protein adaptor activity
  directly_involved_in:
  - id: GO:0070198
    label: protein localization to chromosome, telomeric region
  - id: GO:0031848
    label: protection from non-homologous end joining at telomere
  locations:
  - id: GO:0000781
    label: chromosome, telomeric region
  in_complex:
    id: GO:0070187
    label: shelterin complex
  supported_by:
  - reference_id: PMID:19287395
    supporting_text: Our findings indicate that an array of TRF2 molecules functions as a protein hub
      and regulates telomeres by recruiting different signaling molecules via a linear sequence code.
  - reference_id: PMID:18202258
    supporting_text: Instead, the TRFH docking site of TRF2 binds a shelterin accessory factor (Apollo),
      which does not interact with the TRFH domain of TRF1.
  - reference_id: PMID:28216226
    supporting_text: Telomeres employ TRF2 to protect chromosome ends from activating the DNA damage sensor
      MRE11-RAD50-NBS1 (MRN), thereby repressing ATM-dependent DNA damage checkpoint responses.
  - reference_id: PMID:25620558
    supporting_text: Here, we establish that the shelterin protein TRF2 recruits RTEL1 to telomeres in
      S phase, which is required to prevent catastrophic t-loop processing by structure-specific nucleases.
suggested_questions:
- question: Should the TRF2 docking-hub function be modelled in GO-CAM as TRF2 chromatin-protein adaptor
    activity with has_input NBN/Apollo (rather than NBN adaptor activity with has_input TERF2, as in gomodel:65a1f4f800002884)?
- question: Does human TERF2 produce a neuronal short isoform equivalent to rat TRF2-S with RNA-binding
    and axonal mRNA transport activity?
- question: Is TRF2 repression of ATM at telomeres mediated mainly by t-loop formation, by direct inhibition
    of ATM S1981 autophosphorylation, or by sequestering dephosphorylated NBS1, and do these contributions
    differ by cell-cycle phase?
suggested_experiments:
- hypothesis: A human neuronal TERF2 isoform lacking the Myb domain exists and transports G-rich mRNAs
    into axons, as rat TRF2-S does.
  description: Long-read RNA-seq and isoform-specific immunoblotting in human iPSC-derived cortical neurons,
    followed by RIP-seq and compartmentalized-culture axonal RNA quantification after isoform-specific
    knockdown.
- hypothesis: TRFH-domain docking of dephosphorylated NBS1, independent of t-loops, is sufficient to suppress
    ATM activation at telomeres.
  description: Express TRF2 TRFH mutants that lose NBS1 but retain Apollo and RTEL1 binding in TRF2-null
    cells, and measure telomeric ATM activation, TIFs and fusions, combined with super-resolution measurement
    of t-loop frequency.
