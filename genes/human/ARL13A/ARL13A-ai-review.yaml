knowledge_gaps:
- gap_statement: 'Whether ARL13A shares any of ARL13B''s ciliary functions is unknown: all functional
    data in its PANTHER family come from ARL13B-type proteins, and the only ARL13A study finds partial
    ciliary localization and divergent expression.'
  boundary: 'Established: Arf-family sequence lacking the catalytic glutamine; partial ciliary localization
    of zebrafish Arl13a; divergent expression from arl13b. Not directly measured for ARL13A: nucleotide
    binding or hydrolysis (GTP binding is inferred from the Arf-family fold), ciliary membrane association,
    effectors, or any loss-of-function phenotype in a vertebrate.'
  gap_kind:
  - BIOLOGY
  dark_aspect: WHOLLY_DARK
  status: OPEN
  provenance:
  - reference_id: PMID:30009987
    supporting_text: These results indicate that arl13a and arl13b have evolved different roles and that
      arl13a does not function in the zebrafish retina.
  - reference_id: PMID:38606629
    supporting_text: For GTPases lacking the conserved glutamine (ARL5C, ARL9, ARL10, ARL13A, ARL15, SAR1A
      and SAR1B), we generated specific mutants based on the position where the glutamine would normally
      be found.
  - reference_id: PMID:30009987
    supporting_text: The Arl13a-mCherry fluorescence puncta partially overlapped with acetylated tubulin
      (Fig. 4B), indicating that Arl13a localized to cilia.
  significance: ARL13A's IBA annotations assume it kept ARL13B's ciliogenesis and receptor-targeting functions
    after duplication; testing that would show whether the PAINT node placement holds for this paralog.
  resolution: Knock out ARL13A in a ciliated vertebrate cell line or mouse and test cilium assembly and
    ciliary receptor targeting, alone and with ARL13B loss.
suggested_questions:
- question: Did ARL13A retain ARL13B's ciliogenesis and ciliary receptor-targeting functions, or diverge
    (for example toward a testis-specific role)?
