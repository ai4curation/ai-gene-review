gene_symbol: ARL13A
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ARL13A is a 290-residue Arf-family small GTPase, the vertebrate paralog of the ciliary GTPase
  ARL13B, in a separate PANTHER subfamily. It lacks the conserved catalytic glutamine used for GTP hydrolysis
  by Arf-family GTPases. In zebrafish embryos, overexpressed tagged Arl13a localizes to microtubules of
  the mitotic spindle and midbody in dividing cells and to a subset of cilia, but its expression pattern
  diverges from arl13b, and it is not needed in the retina. Its function is unknown; loss-of-function
  variants appear among cheetah genes with premature stop codons, a species with frequent male sterility.
