    supporting_text: wild-type C6ST-1 activity
suggested_questions:
- question: Does human CHST3 sulfate GlcNAc in any defined physiological glycan, and
    what experimental and phylogenetic evidence places that specificity at PTN002473209?
  experts:
  - Glycosaminoglycan enzymology
  - PAINT curation
- question: How much of keratan Gal-6 sulfation is performed by CHST3 in native tissues
    relative to CHST1, and which acceptor structures distinguish their roles?
suggested_experiments:
- description: Compare sequence-verified human CHST3 with established GlcNAc-6 and
    Gal-6 sulfotransferases on chemically defined glycan acceptors, using positional
    product analysis and matched inactive controls. Resolve GalNAc, Gal and GlcNAc
    reactions separately rather than inferring residue specificity from bulk keratan
    sulfate incorporation.
