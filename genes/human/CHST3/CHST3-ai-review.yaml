id: Q7LGC8
gene_symbol: CHST3
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CHST3 encodes chondroitin 6-O-sulfotransferase 1, a type II Golgi membrane enzyme
  that transfers sulfate from PAPS to C6 of N-acetylgalactosamine residues in chondroitin
  chains. This reaction shapes extracellular and cell-surface chondroitin sulfate proteoglycans.
  CHST3 also sulfates galactose C6 in keratan sulfate as a lower-efficiency secondary activity.
  Biallelic loss of CHST3 activity causes skeletal dysplasia with joint dislocations and progressive
  spinal involvement.
