core_functions:
- description: CHST3 catalyzes PAPS-dependent 6-O-sulfation of chondroitin GalNAc
    residues during proteoglycan biosynthesis. Direct human soluble-enzyme assays
    and patient-cell product analyses establish this catalytic step; the soluble constructs
    remove the N-terminal anchor and do not themselves determine native topology.
    Secondary keratan utilization is retained separately from this principal chondroitin
    function.
