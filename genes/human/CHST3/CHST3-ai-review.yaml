  title: Loss of chondroitin 6-O-sulfotransferase-1 function results in severe human
    chondrodysplasia with progressive spinal involvement.
  findings:
  - statement: Human R304Q disease alleles abolish recombinant CHST3 activity and
      alter patient fibroblast/urinary chondroitin sulfation. Soluble WT human CHST3
      directly performs GalNAc-6 transfer.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Genuine normal full text read, including Functional Studies, recombinant
      Results, Tables 2–4 descriptions and Discussion. Human soluble construct replaces
      residues 1–48 with signal/protein-A sequence; COS-1 expression and IgG-Sepharose
      capture. The structural active-site model is not a CHST3 crystal structure.
