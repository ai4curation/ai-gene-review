id: Q7LGC8
gene_symbol: CHST3
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CHST3 encodes chondroitin 6-O-sulfotransferase 1, a type II Golgi membrane
  sulfotransferase that transfers sulfate from PAPS to C6 of N-acetylgalactosamine
  residues in chondroitin chains. This modification contributes to the sulfation pattern
  of extracellular and cell-surface chondroitin sulfate proteoglycans. The recombinant
  human enzyme also accepts keratan sulfate in vitro. Biallelic loss of CHST3 activity
  causes a skeletal dysplasia with joint dislocations and progressive spinal involvement.
