id: P23528
gene_symbol: CFL1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'Cofilin-1 is a ubiquitous ADF/cofilin-family actin regulator that binds G-actin and F-actin
  and promotes actin-filament severing and depolymerization. Its Ser-3 phosphorylation cycle couples actin
  turnover to upstream LIMK, slingshot, chronophin and other signaling pathways, enabling cytoplasmic
  actin remodeling in cell protrusions, cytokinesis and stress-induced actin structures. Several viruses
  and signaling proteins bind or regulate CFL1, but these contexts modulate the conserved actin-remodeling
  activity rather than defining a separate catalytic function.'
existing_annotations:
- term:
    id: GO:0000281
    label: mitotic cytokinesis
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:101757
  - PANTHER:PTN001375639
  review:
    summary: The PAINT cytokinesis assertion is kept.
    action: ACCEPT
    reason: PAINT places mitotic cytokinesis on an Amniota CFL1 node seeded by mouse Cfl1, and human
      CFL1 is the non-muscle cofilin paralog with the same actin-filament turnover activity. This is
      a conserved cell-biological use of the core severing function rather than a separate
      paralog-specific enzyme activity.
    supported_by:
    - reference_id: file:interpro/panther/PTHR11913/PTHR11913-paint.tsv
      supporting_text: "PTHR11913\tPTN001375639\tGO:0000281\tP\tIBD\tfalse"
- term:
    id: GO:0003779
    label: actin binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - UniProtKB:P45592
  - ensembl:ENSRNOP00000093902
  - InterPro:IPR002108
  review:
    summary: The generic actin-binding IEA should be refined to filament binding.
    action: MODIFY
    reason: The ADF/cofilin domain row captures genuine actin binding, and purified human ADF and
      cofilin were compared directly for F-actin filament binding and severing. A more informative
      MF term already used on CFL1 is actin filament binding.
    supported_by:
    - reference_id: PMID:11812157
      supporting_text: we find little difference between the two proteins in their binding to
        filaments, their severing activities or their activation of subunit release from the pointed
        ends of filaments
    proposed_replacement_terms:
    - id: GO:0051015
      label: actin filament binding
- term:
    id: GO:0003789
    label: actin filament severing activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: enables
  supporting_entities:
  - UniProtKB:P18760
  - ensembl:ENSMUSP00000147514
  review:
    summary: CFL1 has actin filament severing activity.
    action: ACCEPT
    reason: The mouse ortholog transfer is consistent with the ancestral PAINT placement and direct
      assays of purified human ADF/cofilin filament severing.
    supported_by:
    - reference_id: PMID:11812157
      supporting_text: we find little difference between the two proteins in their binding to
        filaments, their severing activities or their activation of subunit release from the pointed
        ends of filaments
    - reference_id: file:interpro/panther/PTHR11913/PTHR11913-paint.tsv
      supporting_text: "PTHR11913\tPTN000227258\tGO:0030042\tP\tIBD\tfalse"
- term:
    id: GO:0005102
    label: signaling receptor binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: enables
  supporting_entities:
  - UniProtKB:P18760
  - ensembl:ENSMUSP00000147514
  review:
    summary: The signaling-receptor-binding transfer overstates upstream receptor signaling.
    action: MARK_AS_OVER_ANNOTATED
    reason: CFL1 remodels actin downstream of many receptors but is not itself a receptor ligand.
      The mouse source transfer is better interpreted as pathway context around cofilin regulation,
      not as a conserved signaling receptor-binding molecular function.
    supported_by:
    - reference_id: PMID:10436159
      supporting_text: ROCK, which is a downstream effector of Rho, did not phosphorylate cofilin
        directly but phosphorylated LIM-kinase
