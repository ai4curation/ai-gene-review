suggested_questions:
- question: How much of MICU2 function is low-Ca2+ inhibition versus participation in the high-Ca2+
    activated MICU1-MICU2 branch? Direct perturbation emphasizes MICU2 as the inhibitory partner,
    while GO-CAMs that model only the activated branch naturally place the MICU1-MICU2 sensor
    upstream of positive regulation of MCU.
  experts: []
- question: Do mammalian tissues vary the MICU1:MICU2:MICU3 ratio enough that the MICU2-containing
    uniporter has tissue-specific thresholds or cooperative responses?
  experts: []
suggested_experiments:
- hypothesis: MICU2-specific residues in the Ca2+-free heterodimer interface set the low-Ca2+
    gatekeeping threshold independently of MICU2 protein stability.
  description: Introduce MICU2 interface mutations that disrupt either the apo-specific MICU1-MICU2
    contacts or the Ca2+-bound contacts at the endogenous locus, then compare MICU2 stability, MICU1
    binding, uniplex assembly and permeabilized-cell Ca2+ uptake curves across resting and
    activating Ca2+ concentrations.
- hypothesis: The positive high-Ca2+ contribution assigned to MICU2 in activated-branch models is
    secondary to MICU1 and separable from MICU2 low-Ca2+ inhibition.
  description: Reconstitute MICU-null cells with MICU1, MICU2 and EF-hand or interface mutants in
    controlled ratios, then measure MCU patch-clamp currents and matrix Ca2+ uptake below and above
    the activation threshold to separate low-Ca2+ gatekeeping from high-Ca2+ stimulation.
