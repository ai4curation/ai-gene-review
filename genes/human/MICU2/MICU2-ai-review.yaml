  review:
    summary: MICU2 binds Ca2+ through EF-hand motifs and uses that binding as the sensing step in
      uniporter regulation.
    action: ACCEPT
    reason: MICU2 has two functional EF-hand Ca2+-binding sites, structural work captured Ca2+-free
      and Ca2+-bound states, and Ca2+ binding drives the MICU1-MICU2 conformational change that
      gates the mitochondrial calcium uniporter. The PAINT row is current and paint-losses reported
      no IRD or IKR loss on the human MICU2 lineage; the ARBA/InterPro row is also consistent with
      the directly solved human MICU2 structures.
    supported_by:
    - &id001
      reference_id: PMID:31397067
      supporting_text: Glu242 in MICU1 and Arg352 in MICU2 are crucial for apo heterodimer formation
    - &id002
      reference_id: PMID:28615291
      supporting_text: We reconstitute the MICU1-MICU2 heterodimer and demonstrate that it binds
        Ca2+ cooperatively with high affinity.
