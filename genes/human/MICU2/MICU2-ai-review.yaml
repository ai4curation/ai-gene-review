id: Q8IYU8
gene_symbol: MICU2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'MICU2 is an EF-hand Ca2+ sensor of the mitochondrial calcium uniporter that resides in the
  intermembrane space and peripherally associates with the inner-membrane MCU/EMRE pore as a MICU1-MICU2
  heterodimer. Ca2+ binding to the MICU1-MICU2 dimer switches the uniplex between a low-Ca2+ gatekept
  state, which prevents constitutive matrix Ca2+ loading, and a high-Ca2+ conducting state, which permits
  rapid mitochondrial Ca2+ import during cytosolic Ca2+ transients. MICU2 is the more inhibitory partner
  of the dimer at resting Ca2+, whereas MICU1 is the principal stimulatory and pore-occluding subunit,
  so MICU2 tunes the threshold and cooperative response of the uniporter rather than forming the Ca2+
  pore itself.'
