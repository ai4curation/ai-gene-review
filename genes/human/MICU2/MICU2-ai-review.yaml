- id: GO_REF:0000024
  title: Manual transfer of experimentally-verified manual GO annotation data to orthologs by
    curator judgment of sequence similarity
  findings:
  - statement: ISS transfer from mouse MICU2 is directionally correct for mitochondrial localization
      and uniplex membership, but calcium channel complex should be refined to the uniplex term.
- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  findings:
  - statement: The MICU-family PAINT node remains applicable to human MICU2; paint-losses reported
      no IRD or IKR loss on this lineage.
- id: GO_REF:0000044
  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot Subcellular Location vocabulary
    mapping, accompanied by conservative changes to GO terms applied by UniProt
  findings:
  - statement: The UniProt subcellular-location mapping to the mitochondrial inner membrane matches
      the reviewed MICU2 record and direct studies.
- id: GO_REF:0000052
  title: Gene Ontology annotation based on curation of immunofluorescence data
  findings:
  - statement: The immunofluorescence-based mitochondrial row is compatible with direct MICU2
      localization studies.
- id: GO_REF:0000107
  title: Automatic transfer of experimentally verified manual GO annotation data to orthologs using
    Ensembl Compara
  findings:
  - statement: Compara transfer from mouse MICU2 is sound for mitochondrial localization, but
      overstates MICU2 as a positive regulator.
- id: GO_REF:0000117
  title: Electronic Gene Ontology annotations created by ARBA machine learning models
  findings:
  - statement: ARBA transfers match direct MICU2 evidence for calcium import, calcium homeostasis
      and calcium sensor activity, but the cellular response to calcium ion term is broad.
- id: GO_REF:0000120
  title: Combined Automated Annotation using Multiple IEA Methods
  findings:
  - statement: The combined automated annotations are broadly compatible with direct MICU2 evidence,
      with generic transport and calcium-channel-complex parents needing refinement.
- id: PMID:24231807
  title: EMRE is an essential component of the mitochondrial calcium uniporter complex.
  findings:
  - statement: Affinity purification of the uniplex recovered MICU2 and placed it with MICU1, MCU,
      MCUb and EMRE in the mitochondrial calcium uniporter holocomplex.
- id: PMID:24560927
  title: MICU1 and MICU2 finely tune the mitochondrial Ca2+ uniporter by exerting opposite effects
    on MCU activity.
  findings:
  - statement: Direct biochemical and cellular experiments showed that MICU2 forms an IMS-localized
      MICU1 heterodimer and is the dominant low-Ca2+ inhibitory gatekeeper of MCU.
- id: PMID:26387864
  title: The Ca(2+)-Dependent Release of the Mia40-Induced MICU1-MICU2 Dimer from MCU Regulates
    Mitochondrial Ca(2+) Uptake.
  findings:
  - statement: Mia40/CHCHD4-dependent disulfide formation links MICU1 and MICU2 into a
      Ca2+-regulated heterodimer.
- id: PMID:26774479
  title: 'EMRE Is a Matrix Ca(2+) Sensor that Governs Gatekeeping of the Mitochondrial Ca(2+) Uniporter.'
  findings:
  - statement: Mitoplast patch-clamp and topology experiments placed MICU2 in the intermembrane
      space as part of EMRE-dependent uniporter regulation.
- id: PMID:26903221
  title: Functional roles of MICU1 and MICU2 in mitochondrial Ca(2+) uptake.
  findings:
  - statement: MICU2 knockdown increased MCU activity at low cytosolic Ca2+, supporting a low-Ca2+
      inhibitory role in mitochondrial Ca2+ homeostasis.
- id: PMID:27099988
  title: Dual functions of a small regulatory subunit in the mitochondrial calcium uniporter
    complex.
  findings:
  - statement: EMRE topology work found MICU1 and MICU2 confined to the IMS-facing surface of the
      inner membrane under physiological conditions.
- id: PMID:28615291
  title: High-affinity cooperative Ca(2+) binding by MICU1-MICU2 serves as an on-off switch for
    the uniporter.
  findings:
  - statement: Reconstitution of the MICU1-MICU2 dimer showed cooperative high-affinity Ca2+ binding
      matching the uniporter activation threshold.
- id: PMID:30699349
  title: Dimerization of MICU Proteins Controls Ca(2+) Influx through the Mitochondrial Ca(2+)
    Uniporter.
  findings:
  - statement: Human MICU2 and MICU3 crystal structures supported Ca2+-induced MICU dimer
      rearrangements that regulate MCUC gating.
- id: PMID:31397067
  title: The crystal structure of MICU2 provides insight into Ca(2+) binding and MICU1-MICU2
    heterodimer formation.
  findings:
  - statement: The human MICU2 crystal structure and mutagenesis mapped Ca2+-free and Ca2+-bound
      MICU1-MICU2 heterodimer interfaces.
- id: PMID:31533452
  title: MCUB Regulates the Molecular Composition of the Mitochondrial Calcium Uniporter Channel to
    Limit Mitochondrial Calcium Overload During Stress.
  findings:
  - statement: This MCUB study used mtCU composition and MICU1/2 association as context; its MICU2
      annotations are NAS-level summaries rather than a primary MICU2 dissection.
- id: PMID:32148862
  title: Structure of the MICU1-MICU2 heterodimer provides insights into the gatekeeping threshold
    shift.
  findings:
  - statement: The apo human MICU1-MICU2 heterodimer structure explained how MICU2 helps set the
      Ca2+ gatekeeping threshold.
- id: PMID:32494073
  title: Structure and mechanism of the mitochondrial Ca(2+) uniporter holocomplex.
  findings:
  - statement: Human cryo-EM structures of the low-Ca2+ and high-Ca2+ uniplex resolved MICU2 in the
      MICU1-MICU2 regulatory dimer.
- id: PMID:32667285
  title: Structures reveal gatekeeping of the mitochondrial Ca(2+) uniporter by MICU1-MICU2.
  findings:
  - statement: Cryo-EM of beetle MCU-EMRE with human MICU1-MICU2 showed the MICU dimer on the IMS
      side and a Ca2+-dependent gatekeeping transition.
- id: PMID:32762847
  title: Structural insights into the Ca(2+)-dependent gating of the human mitochondrial calcium
    uniporter.
  findings:
  - statement: Human uniplex EM structures in the presence and absence of Ca2+ showed Ca2+-dependent
      assembly of MICU1-MICU2 with MCU-EMRE.
- id: PMID:32790952
  title: The structure of the MICU1-MICU2 complex unveils the regulation of the mitochondrial
    calcium uniporter.
  findings:
  - statement: MICU1-MICU2 structures and EMRE-peptide experiments supported a Ca2+-dependent switch
      between gatekeeping and activation states.
- id: PMID:32862359
  title: Structure of intact human MCU supercomplex with the auxiliary MICU subunits.
  findings:
  - statement: A human MCU supercomplex structure resolved MICU1 and MICU2 as auxiliary subunits
      attached to an O-shaped dimer of MCU-EMRE heterodecamers.
- id: PMID:33961781
  title: Dual proteome-scale networks reveal cell-specific remodeling of the human interactome.
  findings:
  - statement: BioPlex 3.0 provides AP-MS evidence for a MICU1-MICU2 interaction, but only as a
      high-throughput protein-binding edge.
- id: PMID:34800366
  title: Quantitative high-confidence human mitochondrial proteome and its dynamics in cellular
    context.
  findings:
  - statement: The MitoCoP high-confidence mitochondrial proteome supports mitochondrial
      localization and is consistent with MICU2-specific direct studies.
- id: PMID:40205054
  title: Multimodal cell maps as a foundation for structural and functional genomics.
  findings:
  - statement: The multimodal U2OS cell map provides high-throughput MICU1-MICU2 interaction
      evidence but no new MICU2-specific molecular mechanism.
- id: Reactome:R-HSA-8949178
  title: MCU translocates calcium from the mitochondrial intermembrane space to the mitochondrial
    matrix
  findings:
  - statement: Reactome correctly places MICU2 in the inner-membrane MCU complex that imports Ca2+
      from the intermembrane space to the matrix.
- id: Reactome:R-HSA-8953461
  title: SMDT1 assists in assembling MCU, MCUB, MICU1, MICU2 (or MICU3) yielding the MCU complex
  findings:
  - statement: Reactome correctly includes MICU2 in the SMDT1/EMRE-assisted assembly of the MCU
      complex.
core_functions:
- description: MICU2 uses EF-hand Ca2+ binding to help the MICU1-MICU2 dimer sense
    intermembrane-space Ca2+ and gate the mitochondrial calcium uniporter. Ca2+-dependent
    rearrangement of this dimer moves the uniplex from a low-Ca2+ inhibited state toward a
    conducting high-Ca2+ state, coupling cytosolic Ca2+ spikes to matrix Ca2+ import while avoiding
    basal overload.
