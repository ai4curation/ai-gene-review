- term:
    id: GO:0005743
    label: mitochondrial inner membrane
  evidence_type: EXP
  original_reference_id: PMID:24231807
  qualifier: located_in
  review:
    summary: MICU2 is peripherally associated with the mitochondrial inner membrane as an IMS-facing
      uniplex regulator.
    action: ACCEPT
    reason: Core location. MICU2 is soluble on the intermembrane-space face of the inner membrane,
      where the MICU1-MICU2 dimer couples Ca2+ sensing to the MCU/EMRE pore. The location is also
      consistent with the UniProt subcellular-location mapping and with the two Reactome events that
      place MICU2 in the mitochondrial calcium uniporter complex.
    supported_by:
    - &id006
      reference_id: PMID:27099988
      supporting_text: The results thus establish that MICU1 and MICU2 are both confined to the
        inner-membrane surface under physiological conditions.
    - *id005
