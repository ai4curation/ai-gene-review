  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q8CD10
  - ensembl:ENSMUSP00000022543
  review:
    summary: Positive regulation captures MICU2's high-Ca2+ activated branch but is not the
      dominant low-Ca2+ gatekeeping role.
    action: KEEP_AS_NON_CORE
    reason: MICU2 participates in the high-Ca2+ MICU1-MICU2 branch in which EF-hand binding releases
      MCU inhibition and permits rapid Ca2+ import. This row is therefore correct as a non-core
      arm of MICU2 function, while the dominant low-Ca2+ gatekeeping role is captured by negative
      regulation of mitochondrial calcium ion concentration.
    supported_by:
    - *id007
    - reference_id: PMID:24560927
      supporting_text: MICU2EFmut strongly decreases mitochondrial calcium uptake, thus indicating
        that MICU2 Ca2+-binding domains are necessary to release MCU inhibition
