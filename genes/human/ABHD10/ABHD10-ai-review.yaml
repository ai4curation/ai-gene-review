      nucleophilic active site residue of PRDX5, providing a direct mechanistic
      connection between ABHD10-mediated S-depalmitoylation of PRDX5 and its
      antioxidant capacity.
  - statement: >-
      Mutation of catalytic Ser152 to Ala (S152A) abolishes human ABHD10
      S-depalmitoylase activity.
