id: Q9NUJ1
gene_symbol: ABHD10
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  ABHD10 (alpha/beta hydrolase domain-containing protein 10) is a soluble
  mitochondrial matrix serine hydrolase and S-depalmitoylase (EC 3.1.2.22) of
  the alpha/beta-hydrolase superfamily. Synthesized as a 306-residue precursor
  with a predicted 52-residue N-terminal mitochondrial transit peptide, mature
  28-kDa ABHD10 resides in the mitochondrial matrix and uses a conserved
  charge-relay catalytic triad (Ser152, Asp249, His279) topped by a
  hydrophobic alpha-helical cap domain to cleave S-palmitoyl thioester linkages
  on mitochondrial proteins. Its best-characterized human physiological
  substrate is peroxiredoxin-5 (PRDX5), where ABHD10 hydrolyzes inhibitory
  S-palmitoylation at the peroxidatic active-site cysteine (Cys100) to preserve
  mitochondrial hydrogen peroxide buffering capacity and protect cells against
  oxidative stress; transcriptional repression of ABHD10 by ELK-3 downstream of
  TGFbeta1 and EGF signaling increases PRDX5 S-palmitoylation and promotes
  hepatocyte oxidative injury. In pancreatic ductal adenocarcinoma cells,
  ABHD10 has also been reported to interact with and S-depalmitoylate long-chain
  fatty-acid--CoA ligase 4 (ACSL4) at Cys157 to limit lipid peroxidation, while
  acting less efficiently than APT1 (LYPLA1) toward S-palmitoylated glutamate
  dehydrogenase (GLUD1). Mammalian ABHD10 is additionally enriched in male
  germ-cell mitochondria, where S-depalmitoylation of mitochondrial sheath and
  metabolic proteins (including SPATA19, GK2, and PDHX) supports sperm
  mitochondrial sheath organization and male fertility. In human liver, ABHD10
  also exhibits carboxylic-ester hydrolase activity toward xenobiotic
  1-O-acyl-beta-D-glucuronide drug conjugates (EC 3.1.1.93), hydrolyzing
  mycophenolic acid acyl-glucuronide (AcMPAG) and probenecid acyl-glucuronide
  (PRAG) to attenuate reactive acyl-glucuronide accumulation without cleaving
  phenolic O-glucuronides such as MPAG.
alternative_products:
- name: '1'
  id: Q9NUJ1-1
  description: >-
    Canonical 306-aa mitochondrial precursor containing the cleavable
    N-terminal mitochondrial transit peptide (residues 1-52) and intact
    Ser152-Asp249-His279 catalytic triad in mature chain 53-306.
- name: '2'
  id: Q9NUJ1-2
  sequence_note: VSP_056093
  description: >-
    N-terminally truncated splice variant missing residues 1-157, which removes
    both the mitochondrial transit peptide and the nucleophilic active-site
    Ser152, rendering it catalytically inactive as a serine hydrolase.
- name: '3'
  id: Q9NUJ1-3
  sequence_note: VSP_056742, VSP_056743
  description: >-
    C-terminally truncated splice variant divergent at residues 193-205 and
    missing residues 206-306, which removes the catalytic acid Asp249 and
    general base His279 of the charge-relay triad.
