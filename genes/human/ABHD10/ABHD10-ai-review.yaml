- id: PMID:41285782
  title: >-
    The S-depalmitoylase ABHD10 is essential for sperm mitochondrial sheath
    formation and male fertility.
  publication_type: PRIMARY_RESEARCH
  findings:
  - statement: >-
      Immunogold staining and transmission electron microscopy in human HEK293T
      cells directly demonstrate that ABHD10 localizes to the mitochondrial
      matrix.
    supporting_text: >-
      Subcellular localization of ABHD10 in HEK293T cells using immunogold
      staining, followed by TEM. The FLAG antibody was utilized to detect the
      expression of ABHD10 proteins. Representative image of mitochondria in
      HEK293T cells demonstrated that ABHD10 was localized in the matrix of
      mitochondria.
  - statement: >-
      Loss of ABHD10 in mice causes hyper-palmitoylation of SPATA19, GK2, PDHX,
      NDUFV1, and SDHB, malformed sperm mitochondrial sheaths, and male
      sterility.
    supporting_text: >-
      Using mass spectrometry-based mitochondrial acyl-biotin exchange assays,
      we systematically identify that loss of ABHD10 leads to the
      hyper-palmitoylation of multiple functionally critical proteins, including
      mitochondrial sheath formation factors (SPATA19 and GK2) and aerobic
      respiration regulators (PDHX, NDUFV1 and SDHB).
  - statement: >-
      HA-knock-in mouse analyses confirm mitochondrial matrix localization of
      ABHD10 in vivo, although the authors' description of ABHD10 as
      "testis-specific" overstates tissue exclusivity relative to established
      hepatic and somatic expression.
    supporting_text: >-
      In this study, we inserted an HA tag into ABHD10 gene, confirming that
      ABHD10 is a testis-specific protein expressed in the mitochondrial matrix
      in vivo.
    finding_review:
      finding_status: DISPUTED
      superseded_by:
      - PMID:22294686
      - PMID:31740833
      - PMID:37400491
      - PMID:42849309
      review_notes: >-
        While in vivo mitochondrial matrix residence and strong adult testis
        enrichment in HA-knock-in mice are well supported, calling ABHD10
        "testis-specific" conflicts with direct enzyme purification from human
        liver (PMID:22294686), endogenous mitochondrial S-depalmitoylase
        activity in human HepG2, HEK293T, and HeLa cells (PMID:31740833),
        physiological hepatocyte expression and ELK-3 regulation in human and
        mouse liver (PMID:37400491), and global proteomics quantification across
        58 pediatric and adult primary human hepatocyte donors (PMID:42849309).
      supported_by:
      - reference_id: PMID:22294686
        supporting_text: >-
          Recombinant ABHD10 expressed in Sf9 cells efficiently deglucuronidated
          AcMPAG with a K(m) value of 100.7 ± 10.2 μM, which was similar to
          those in HLM, HLC, and human liver homogenates (HLH).
      - reference_id: PMID:31740833
        supporting_text: >-
          We also performed ABPP in both enriched mitochondrial and cytosolic
          fractions prepared from mitoFP-treated HepG2 cells, which further
          confirmed that ABHD10 is a target of mitoFP and that ABHD10 is highly
          enriched in mitochondria (Supplementary Fig. 17).
      - reference_id: PMID:37400491
        supporting_text: >-
          This ELK-3-mediated ABHD10 downregulation drives oxidative stress and
          disrupts mature hepatocyte function via enhancing S-palmitoylation of
          PRDX5's Cys100 residue.
