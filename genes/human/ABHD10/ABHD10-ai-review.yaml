  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Provides a comparative mitochondrial S-depalmitoylase substrate-specificity
      datapoint: whereas APT1 (LYPLA1) efficiently depalmitoylates S-palmitoylated
      glutamate dehydrogenase (GDH/GLUD1) to restore hexameric assembly and
      catalytic activity, ABHD10 restored GDH activity less efficiently under
      the tested in vitro conditions. Supports selectivity of ABHD10's cap
      domain toward preferred substrates such as PRDX5 rather than promiscuous
      deacylation of all mitochondrial S-palmitoylproteins; GLUD1 is therefore
      not listed as a primary physiological substrate of ABHD10.
  findings:
  - statement: >-
      In comparative assays on S-palmitoylated mitochondrial glutamate
      dehydrogenase (GDH), ABHD10 restored enzymatic activity less efficiently
      than APT1 under the conditions tested.
    full_text_unavailable: true
    supporting_text: >-
      Treatment with acyl-protein thioesterase 1 (APT1) restored both hexameric
      assembly and enzymatic activity, whereas α/β-hydrolase domain-containing
      protein 10 (ABHD10) restored activity less efficiently under the
      conditions tested.
- id: PMID:43004423
  title: >-
    The ABHD10-ACSL4 axis promotes pancreatic ductal adenocarcinoma growth via
    suppressing ferroptosis.
  publication_type: PRIMARY_RESEARCH
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Identifies long-chain fatty-acid--CoA ligase 4 (ACSL4; UniProtKB:O60488)
      as a human ABHD10 S-depalmitoylation substrate at Cys157 in pancreatic
      ductal adenocarcinoma (PDAC) cells using acyl-biotin exchange, Click-iT
      palmitoylation, and co-immunoprecipitation assays, reinforcing GO:0008474
      (palmitoyl-(protein) hydrolase activity) and warranting inclusion of
      ACSL4 in core_functions substrates. GO:0110076 (negative regulation of
      ferroptosis) was explicitly evaluated and withheld from NEW annotations
      under AGENTS.md NEW biological-process conservatism because (1) cached
      evidence is abstract-only from a single oncogenic PDAC tumor growth model,
      (2) sub-organellar topology of interaction between mitochondrial matrix
      ABHD10 and outer-membrane/MAM-associated ACSL4 cannot be verified without
      full text, and (3) ferroptosis suppression is a downstream cellular
      consequence of ACSL4 Cys157 S-depalmitoylation rather than a distinct
      normal physiological pathway directly executed by ABHD10.
  findings:
  - statement: >-
      In pancreatic ductal adenocarcinoma cells, ABHD10 interacts with and
      S-depalmitoylates ACSL4 at Cys157, whereas ABHD10 depletion increases
      ACSL4 S-palmitoylation, lipid peroxidation, and ferroptosis.
    full_text_unavailable: true
    supporting_text: >-
      Mechanistically, ABHD10 interacted with acyl-CoA synthetase long-chain
      family member 4 (ACSL4) and depalmitoylated it at cysteine 157, thereby
      suppressing ferroptosis. HF treatment or ABHD10 depletion increased ACSL4
      palmitoylation, enhanced lipid peroxidation, disrupted redox homeostasis,
      and induced ferroptotic changes.
