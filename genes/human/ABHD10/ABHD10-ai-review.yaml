- term:
    id: GO:0019585
    label: glucuronate metabolic process
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-156588
  qualifier: involved_in
  review:
    summary: >-
      Over-broad pathway-level projection from Reactome Glucuronidation
      (R-HSA-156588); ABHD10 does not synthesize or catabolize endogenous
      glucuronate/UDP-glucuronate, only liberating D-glucuronate as a byproduct
      of secondary xenobiotic acyl-glucuronide ester hydrolysis.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Reactome pathway R-HSA-156588 ("Glucuronidation") models phase II drug
      conjugation by microsomal UDP-glucuronosyltransferases (UGTs) using
      UDP-glucuronate and appends ABHD10 as a reverse acyl-glucuronide
      esterase step. ABHD10 neither participates in endogenous glucuronate
      biosynthesis/catabolism nor acts in the ER lumen where UGT conjugation
      occurs; its drug-conjugate role is already captured by GO:0006805
      xenobiotic metabolic process and GO:0102390.
    supported_by:
    - reference_id: Reactome:R-HSA-156588
      supporting_text: >-
        Glucuronidation conjugation utilizes UDP-glucuronosyltransferases (UGTs;
        EC 2.4.1.17) to catalyze a wide range of diverse endogenous and
        xenobiotic compounds.
