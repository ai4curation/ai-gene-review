- id: PMID:22294686
  title: >-
    Human α/β hydrolase domain containing 10 (ABHD10) is responsible enzyme for
    deglucuronidation of mycophenolic acid acyl-glucuronide in liver.
  publication_type: PRIMARY_RESEARCH
  findings:
  - statement: >-
      Purified and recombinant human ABHD10 hydrolyzes the carboxylic ester
      linkage of mycophenolic acid acyl-glucuronide (AcMPAG; Km = 100.7 uM) in
      human liver homogenates.
    supporting_text: >-
      Recombinant ABHD10 expressed in Sf9 cells efficiently deglucuronidated
      AcMPAG with a K(m) value of 100.7 ± 10.2 μM, which was similar to those in
      HLM, HLC, and human liver homogenates (HLH).
  - statement: >-
      Recombinant human ABHD10 cannot hydrolyze the phenolic O-glucuronide MPAG,
      demonstrating specificity for carboxylic ester rather than O-glycosyl
      linkages.
    supporting_text: >-
      In fact, we found that the recombinant human ABHD10 could catalyze the
      deglucuronidation of AcMPAG, but could not catalyze the deglucuronidation
      of MPAG, a phenolic glucuronide of MPA (data not shown).
  - statement: >-
      Human ABHD10 contains a conserved alpha/beta-hydrolase catalytic triad
      comprising Ser152, Asp249, and His279.
    supporting_text: >-
      Human ABHD10 has the nucleophile-His-acid catalytic triad (Ser 152 , Asp
      249 , and His 279 ) as does CES ( 36 )
