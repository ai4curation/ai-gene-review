- term:
    id: GO:0045454
    label: cell redox homeostasis
  evidence_type: IMP
  original_reference_id: PMID:31740833
  qualifier: involved_in
  review:
    summary: >-
      ABHD10 directly maintains mitochondrial hydrogen peroxide buffering and
      redox homeostasis by S-depalmitoylating the peroxidatic active-site
      cysteine (Cys100) of PRDX5.
    action: NEW
    reason: >-
      With GO:0002084 obsoleted in favor of MF GO:0008474, human ABHD10 lacks a
      non-obsolete biological process annotation for its core endogenous role.
      In PMID:31740833 (corroborated by PMID:37400491), ABHD10 directly
      catalyzes S-depalmitoylation of PRDX5 at active-site Cys100 to regenerate
      catalytically competent PRDX5; genetic knockdown or mitoFP inhibition of
      ABHD10 diminishes mitochondrial H2O2 buffering and sensitizes human cells
      to oxidative stress in a PRDX5-dependent manner, while wild-type (but not
      S152A) ABHD10 restores mitochondrial antioxidant capacity.
    additional_reference_ids:
    - PMID:37400491
    supported_by:
    - reference_id: PMID:31740833
      supporting_text: >-
        We then find that ABHD10 regulates the S-palmitoylation status of the
        nucleophilic active site residue of PRDX5, providing a direct
        mechanistic connection between ABHD10-mediated S-depalmitoylation of
        PRDX5 and its antioxidant capacity.
    - reference_id: PMID:37400491
      supporting_text: >-
        This ELK-3-mediated ABHD10 downregulation drives oxidative stress and
        disrupts mature hepatocyte function via enhancing S-palmitoylation of
        PRDX5's Cys100 residue.
    - reference_id: file:human/ABHD10/ABHD10-deep-research-affinage.md
      supporting_text: >-
        In its depalmitoylase role, ABHD10 removes palmitoyl groups from
        peroxiredoxin-5 (PRDX5) at the active-site cysteine (Cys100), thereby
        preserving PRDX5 antioxidant capacity and limiting mitochondrial
        oxidative stress [PMID:31740833, PMID:37400491].
core_functions:
- description: >-
    Hydrolyzes S-palmitoyl thioester modifications on mitochondrial protein
    substrates—principally active-site Cys100 of peroxiredoxin-5 (PRDX5) in the
    mitochondrial matrix to regenerate PRDX5 peroxidatic activity and maintain
    cell redox homeostasis, as well as Cys157 of long-chain fatty-acid--CoA
    ligase 4 (ACSL4) reported in pancreatic ductal adenocarcinoma cells.
