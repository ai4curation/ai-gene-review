proposed_new_terms:
- proposed_name: 1-O-acyl-beta-D-glucuronide esterase activity
  proposed_definition: >-
    Catalysis of the reaction: a 1-O-acyl-beta-D-glucuronide + H2O = a
    carboxylate + D-glucuronate.
  justification: >-
    Human ABHD10 catalyzes carboxylic-ester hydrolysis of structurally distinct
    1-O-acyl-beta-D-glucuronide drug conjugates in liver, including
    mycophenolic acid acyl-glucuronide (AcMPAG; PMID:22294686) and probenecid
    acyl-glucuronide (PRAG; PMID:25217485), while exhibiting zero glycosidase
    activity toward phenolic O-glucuronides such as MPAG. GO currently provides
    only the single-substrate term GO:0102390 (mycophenolic acid
    acyl-glucuronide esterase activity) under GO:0052689 (carboxylic ester
    hydrolase activity), leaving PRAG and other 1-O-acyl-glucuronide ester
    substrates without an appropriate molecular function term and contributing
    to recurring curator misclassification of acyl-glucuronide
    "deglucuronidation" under GO:0004553 (hydrolase activity, hydrolyzing
    O-glycosyl compounds).
  proposed_parent:
    id: GO:0052689
    label: carboxylic ester hydrolase activity
  supported_by:
  - reference_id: PMID:22294686
    supporting_text: >-
      In fact, we found that the recombinant human ABHD10 could catalyze the
      deglucuronidation of AcMPAG, but could not catalyze the deglucuronidation
      of MPAG, a phenolic glucuronide of MPA (data not shown).
  - reference_id: PMID:25217485
    full_text_unavailable: true
    supporting_text: >-
      We found that recombinant α/β hydrolase domain containing 10 (ABHD10)
      substantially catalyzed PRAG deglucuronidation activity, whereas
      carboxylesterases did not.
