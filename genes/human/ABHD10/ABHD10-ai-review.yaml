- term:
    id: GO:0006805
    label: xenobiotic metabolic process
  evidence_type: IDA
  original_reference_id: PMID:22294686
  qualifier: involved_in
  review:
    summary: >-
      Biochemically validated secondary role in human liver, where ABHD10
      hydrolyzes reactive drug acyl-glucuronide metabolites (AcMPAG and PRAG)
      to limit their net accumulation; retained as non-core relative to
      endogenous mitochondrial S-depalmitoylation.
    action: KEEP_AS_NON_CORE
    reason: >-
      Human ABHD10 purified from human liver and expressed recombinantly
      catalyzes carboxylic-ester hydrolysis of mycophenolic acid
      acyl-glucuronide (AcMPAG; PMID:22294686) and probenecid acyl-glucuronide
      (PRAG; PMID:25217485), and PMSF inhibition increases net acyl-glucuronide
      formation in human liver homogenates. Because this hepatic xenobiotic
      esterase activity reflects secondary turnover of drug conjugates rather
      than ABHD10's conserved endogenous mitochondrial protein S-depalmitoylase
      function, GO:0006805 is retained as KEEP_AS_NON_CORE.
    supported_by:
    - reference_id: PMID:22294686
      supporting_text: >-
        Recombinant ABHD10 expressed in Sf9 cells efficiently deglucuronidated
        AcMPAG with a K(m) value of 100.7 ± 10.2 μM, which was similar to those
        in HLM, HLC, and human liver homogenates (HLH).
    - reference_id: PMID:25217485
      full_text_unavailable: true
      supporting_text: >-
        In conclusion, we found that PRAG deglucuronidation catalyzed by ABHD10
        suppressively regulates PRAG formation via multiple UGT enzymes in human
        liver.
