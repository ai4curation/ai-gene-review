    Human ABHD10 directly S-depalmitoylates human SPATA19 and GK2 on conserved
    cysteines in human germ-cell mitochondria via Ser152 catalysis.
  description: >-
    Perform mitochondrial acyl-biotin exchange proteomics and purified
    recombinant wild-type vs S152A human ABHD10 S-depalmitoylation kinetics on
    S-palmitoylated human SPATA19 and GK2 peptides, paired with targeted
