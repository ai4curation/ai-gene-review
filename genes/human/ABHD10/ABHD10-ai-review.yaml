- id: file:human/ABHD10/ABHD10-deep-research-affinage.md
  title: "Affinage mechanistic annotation for ABHD10 (human)"
  publication_type: DEEP_RESEARCH
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Passes Affinage trust gates cleanly (faith_pct 100.0,
      self_evaluation_pairwise win, 8 valid numeric PubMed citations, zero
      malformed PMID:bio_ preprint tokens). The mechanistic narrative accurately
      synthesizes ABHD10's mitochondrial matrix S-depalmitoylase activity toward
      PRDX5 Cys100 (PMID:31740833, PMID:37400491) and testis mitochondrial
      sheath/respiratory substrates SPATA19, GK2, PDHX, NDUFV1, and SDHB
      (PMID:41285782), serine nucleophile pharmacology (PMID:22400490,
      PMID:24447064), and hepatic AcMPAG/PRAG acyl-glucuronide esterase activity
      (PMID:22294686, PMID:25217485). However, Affinage's goslim_generic
      mechanism profile (GO:0140096 catalytic activity, acting on a protein;
      GO:0016787 hydrolase activity; GO:0005739 mitochondrion; Reactome
      R-HSA-1430728 Metabolism and R-HSA-8953897 Cellular responses to stimuli)
      is far too coarse for GO curation and was not imported in place of
      specific terms GO:0008474 palmitoyl-(protein) hydrolase activity,
      GO:0102390 mycophenolic acid acyl-glucuronide esterase activity,
      GO:0005759 mitochondrial matrix, and GO:0045454 cell redox homeostasis.
      Affinage also lists KCMF1 as a partner from abstract-only PMID:42206676
      without flagging the compartment mismatch between mitochondrial matrix
      ABHD10 and cytosolic/nuclear KCMF1 or the internal title-vs-abstract
      directionality tension in PMID:42206676.
  findings:
  - statement: >-
      Affinage synthesizes ABHD10 as a mitochondrial matrix serine hydrolase and
      protein S-depalmitoylase acting on PRDX5 Cys100 and testis substrates as
      well as hepatic drug acyl-glucuronides.
    supporting_text: >-
      ABHD10 is a serine hydrolase that operates as a protein S-depalmitoylase
      in the mitochondrial matrix, controlling mitochondrial redox homeostasis
      and lipid-related function across multiple tissues [PMID:31740833,
      PMID:41285782].
suggested_questions:
