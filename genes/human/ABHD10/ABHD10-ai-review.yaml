      peptide at residues 1-52 in UniProt Q9NUJ1 (ECO:0000255) paired with a
      soluble mature alpha/beta-hydrolase domain lacking transmembrane segments.
    supported_by:
    - reference_id: PMID:41285782
      supporting_text: >-
