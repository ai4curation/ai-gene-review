core_functions:
- description: >-
    Common alpha subunit of secreted heterodimeric glycoprotein hormones—thyroid-stimulating
    hormone (TSH, with TSHB), follicle-stimulating hormone (FSH, with FSHB), luteinizing hormone
    (LH, with LHB), and chorionic gonadotropin (hCG, with CGB)—that directly contacts and activates
    the cognate leucine-rich-repeat GPCRs TSHR, FSHR, and LHCGR to initiate the thyroid-stimulating
    hormone, follicle-stimulating hormone, and luteinizing hormone signaling pathways.
