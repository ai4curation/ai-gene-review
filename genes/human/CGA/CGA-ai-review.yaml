id: P01215
gene_symbol: CGA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  Glycoprotein hormones alpha chain (CGA) is the common secreted cystine-knot alpha subunit that
  non-covalently heterodimerizes with four hormone-specific beta subunits—TSHB, FSHB, LHB, and
  chorionic gonadotropin beta (CGB)—to form the active pituitary and placental glycoprotein
  hormones thyroid-stimulating hormone (TSH), follicle-stimulating hormone (FSH), luteinizing
  hormone (LH), and human chorionic gonadotropin (hCG). Within each heterodimer, the alpha chain
  directly contacts both the extracellular leucine-rich repeat domain and the hinge region of the
  cognate G protein-coupled receptor (TSHR, FSHR, or LHCGR), driving receptor activation in the
  thyroid-stimulating hormone, follicle-stimulating hormone, and luteinizing hormone signaling
  pathways.
