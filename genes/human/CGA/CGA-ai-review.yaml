    proposed_replacement_terms:
    - id: GO:0038194
      label: thyroid-stimulating hormone signaling pathway
    - id: GO:0042699
      label: follicle-stimulating hormone signaling pathway
    - id: GO:0042700
      label: luteinizing hormone signaling pathway
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN002608947
        source_label: GLYCOPROTEIN HORMONES ALPHA CHAIN jawed-vertebrate clade
        source_status: SUPPORTS_TRANSFER
        comment: >-
          PAINT node PTN002608947 places generic GO:0007186 on the jawed-vertebrate CGA clade
          rather than the three specific glycoprotein hormone signaling pathways (GO:0038194,
          GO:0042699, GO:0042700).
    supported_by:
    - reference_id: PMID:36001021
      supporting_text: >-
        TSH is a member of the glycoprotein hormone family, which includes luteinising hormone,
        follicle-stimulating hormone, and human chorionic gonadotropin. All are heterodimers of a
        common α subunit and subtype-specific β subunit, which determines the biologic specificity.
    - reference_id: PMID:36720854
      supporting_text: >-
        FSH, along with luteinizing hormone (LH), chorionic gonadotropin (CG) and
        thyroid-stimulating hormone (TSH), constitute the family of glycoprotein hormones14, which
        share similar 3D architectures and function through binding and activation of a subfamily
        of G protein-coupled receptors, named glycoprotein hormone receptors15.
