suggested_questions:
- question: >-
    How do distinct N-glycan sulfation and sialylation patterns on the shared CGA alpha subunit
    when paired with TSHB, FSHB, LHB, or CGB modulate receptor residence time and Gs versus Gq/11
    signaling bias at TSHR, FSHR, and LHCGR?
suggested_experiments:
- description: >-
    Compare single-molecule FRET conformational dynamics of the TSHR, FSHR, and LHCGR hinge regions
    upon binding recombinant heterodimers containing site-specific glycan-engineered CGA variants.
  hypothesis: >-
    Biantennary N-glycans at Asn52 and Asn78 of CGA sterically tune the lever-like push-pull
    movement of the receptor extracellular domain relative to the transmembrane bundle across all
    three glycoprotein hormone receptors.
  experiment_type: Single-molecule FRET and GloSensor cAMP/IP1 signaling assays
