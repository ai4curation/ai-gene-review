- term:
    id: GO:0000077
    label: DNA damage checkpoint signaling
  evidence_type: IDA
  original_reference_id: PMID:12529385
  qualifier: acts_upstream_of_or_within
  review:
    summary: Mouse Hus1 study in which NBN is used as the comparator for the IR-responsive S-phase checkpoint; NBS1
      was not required for the BPDE-induced S-phase checkpoint.
    action: MODIFY
    reason: NBN does act in DNA damage checkpoint signaling, but the checkpoint it serves in S phase is the IR-responsive
      intra-S checkpoint that depends on ATM activation and MDC1-mediated NBN recruitment. The cited paper is about
      Hus1 and positions NBS1 in the IR-responsive pathway, while showing it is not needed for the BPDE checkpoint.
      The specific term mitotic intra-S DNA damage checkpoint signaling is supported directly by MDC1-NBS1 disruption
      experiments. The general row is refined rather than removed.
    proposed_replacement_terms:
    - id: GO:0031573
      label: mitotic intra-S DNA damage checkpoint signaling
    supported_by:
    - reference_id: PMID:12529385
      supporting_text: checkpoint-mediated inhibition of DNA synthesis in response to BPDE did not require NBS1,
        a component of the IR-responsive S-phase checkpoint pathway
    - reference_id: PMID:18678890
      supporting_text: Disruption of the MDC1-NBS1 interaction results in failure of NBS1 accumulation at DNA double-strand
        breaks and impairment of intra-S checkpoint activation.
