description: 'RASGEF1A (Ras-GEF domain-containing family member 1A) is a 481-residue cytoplasmic guanine nucleotide exchange
  factor of the CDC25-homology family, consisting of an N-terminal Ras exchanger motif (REM/RasGEF-N) domain followed by a
  C-terminal CDC25-type Ras-GEF catalytic domain and lacking any recognised membrane-targeting or regulatory module. Purified
  RASGEF1A catalyses GDP/GTP exchange on small GTPases of the Ras superfamily. Its substrate preference is reported differently
  by the two studies that have tested it: a biochemical study with purified proteins found it to be a highly specific exchanger
  for Rap2 (dependent on Rap2 Phe39 in switch I) with no activity on Rap1 or H/K/N-Ras, whereas an earlier study reported
  exchange activity on K-, H- and N-Ras in vitro and increased Ras activity after overexpression. RASGEF1A is expressed mainly
  in brain and spinal cord and is strongly up-regulated in intrahepatic cholangiocarcinoma, where its knockdown slows tumour
  cell growth; overexpression increases cell motility. Its physiological substrate, regulation, subcellular site of action
  and in vivo role remain uncharacterised.'
