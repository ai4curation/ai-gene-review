core_functions:
- description: Guanine nucleotide exchange factor for Ras-superfamily small GTPases. The REM plus CDC25 catalytic module promotes
    GDP release and GTP loading. Purified-protein data indicate high specificity for Rap2 over Rap1 and the Ras subfamily,
    while an earlier study reported activity on H-, K- and N-Ras.
  molecular_function:
    id: GO:0005085
    label: guanyl-nucleotide exchange factor activity
  directly_involved_in:
  - id: GO:0007264
    label: small GTPase-mediated signal transduction
  supported_by:
  - *id002
  - *id001
  - reference_id: file:human/RASGEF1A/RASGEF1A-uniprot.txt
    record_section: ["CC:FUNCTION"]
    supporting_text: Guanine nucleotide exchange factor (GEF) with specificity for RAP2A, KRAS, HRAS, and NRAS (in vitro)
suggested_questions:
- question: Is Rap2 (RAP2A/B/C) the physiological substrate of RASGEF1A in cells, and can the reported H/K/N-Ras exchange
    activity be reconciled with the purified-protein data showing no Ras-subfamily activity?
- question: Once a cellular substrate is established, should GO:0032486 Rap protein signal transduction replace GO:0007265
    Ras protein signal transduction for RASGEF1A, given that GO:0017034 Rap GEF activity is obsolete and substrate specificity
    can only be expressed through has_input in GO-CAM?
- question: Where does RASGEF1A act in neurons, the main site of expression, given that it lacks any recognised membrane-targeting
    domain?
suggested_experiments:
- description: Measure GTP loading of endogenous RAP2A/B/C, RAP1 and H/K/N-RAS by effector pull-down after RASGEF1A knockout
    or knockdown in neuronal cells, and rescue with wild-type versus catalytic-dead RASGEF1A.
- description: Re-run side-by-side in vitro exchange kinetics of full-length and catalytic-domain RASGEF1A on Rap2 and H/K/N-Ras
    under identical conditions to resolve the conflicting substrate reports.
- description: Determine the subcellular localization of endogenous RASGEF1A in neurons by immunostaining and fractionation,
    relative to Rap2-positive compartments.
