    id: GO:0006644
    label: phospholipid metabolic process
  evidence_type: IMP
  original_reference_id: PMID:10506173
  qualifier: involved_in
  review:
    summary: >-
      ACP6 alters mitochondrial phospholipid metabolism through LPA hydrolysis.
    action: KEEP_AS_NON_CORE
    reason: >-
      Stable LPAP expression lowered phosphatidic acid, phosphatidylglycerol, and cardiolipin,
      consistent with an effect on mitochondrial phospholipid metabolism downstream of LPA
      hydrolysis.
    supported_by:
    - reference_id: PMID:10506173
      supporting_text: >-
        LPAP-stable transfected NIH 3T3 cells showed less phosphatidic acid, phosphatidylglycerol,
        and cardiolipin
