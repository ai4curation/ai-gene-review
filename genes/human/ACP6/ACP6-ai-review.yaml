        to the corresponding monoacylglycerol
- term:
    id: GO:0006654
    label: phosphatidic acid biosynthetic process
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-1483166
  qualifier: involved_in
  review:
    summary: >-
      ACP6 hydrolyzes LPA rather than synthesizing phosphatidic acid.
    action: REMOVE
    reason: >-
      The cited Reactome pathway describes PA production by GPAT, AGPAT/LPAAT, and PLD enzymes.
      ACP6 catalyzes the hydrolysis of LPA to monoacylglycerol and phosphate, the opposite
      direction from AGPAT-mediated PA synthesis.
    supported_by:
    - reference_id: Reactome:R-HSA-1483166
      supporting_text: >-
        Next, LPA is converted to PA by a LPA acyltransferase (AGPAT, also known as LPAAT).
    - reference_id: file:genes/human/ACP6/ACP6-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: >-
        Hydrolyzes lysophosphatidic acid (LPA) containing a medium length fatty acid chain
        to the corresponding monoacylglycerol
    source_defects:
    - defect_type: WRONG_TERM
      resource: REACTOME
      record: R-HSA-1483166
      slot: GO_ID
      requested_change: CHECK
      asserted_value: GO:0006654
      cause: OTHER
      confidence: PROBABLE
      report_status: NOT_REPORTED
      explanation: >-
        ACP6 hydrolyzes lysophosphatidic acid to monoacylglycerol and phosphate, but R-HSA-1483166
        annotates it to phosphatidic acid biosynthesis. Reactome should check whether the
        ACP6 hydrolysis event is nested under the wrong PA-synthesis pathway or whether the
        GO biological-process export is too broad for this catabolic reaction.
      supported_by:
      - reference_id: Reactome:R-HSA-1483166
        supporting_text: >-
          Next, LPA is converted to PA by a LPA acyltransferase (AGPAT, also known as LPAAT).
      - reference_id: Reactome:R-HSA-8878654
        supporting_text: >-
          Lysophosphatidic acid phosphatase type 6 (ACP6) can hydrolyse LPA of varying lengths.
