  review:
    summary: >-
      The cytoplasmic signal is weaker than the mitochondrial evidence.
    action: TOO_GENERAL
    reason: >-
      This ACPL1 study reported cytoplasmic signal in transfected COS-7 cells,
      while the LPAP enzymology paper localized endogenous protein to mitochondria
      and later MitoCoP proteomics independently retained ACP6 as mitochondrial.
      The reviewed mitochondrial rows make the root cytoplasm term true but too
      general for ACP6.
