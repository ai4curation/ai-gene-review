    action: MARK_AS_OVER_ANNOTATED
    propagation_review:
      root_cause: SOURCE_BAD
      failure_modes:
      - ROLE_CONFLATION
      source_entities:
      - source_id: PANTHER:PTN002480348
        source_status: UNRESOLVED
        comment: The ACP6 seed supports lysophosphatidic acid hydrolysis, not lysobisphosphatidic
          acid metabolism, but the full UniProt-cited paper was not checked for
          LBPA assays.
    reason: >-
      The ACP6 literature and UniProt record support lysophosphatidic acid hydrolysis. They
      do not show a role for the different lipid lysobisphosphatidic acid, so the LBPA process
      term should not be propagated for ACP6.
