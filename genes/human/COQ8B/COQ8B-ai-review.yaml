  label: Homo sapiens
description: >-
  COQ8B (ADCK4) is a mitochondrial atypical kinase-like protein of the UbiB/ADCK family
  and the closest paralog of COQ8A (ADCK3); both are co-orthologs of yeast Coq8p and
  arose by duplication at the emergence of chordates. It is required for the
  biosynthesis of coenzyme Q10 (ubiquinone), an essential lipid-soluble electron
  carrier of the respiratory chain, and it supports the assembly and activity of the
  multi-subunit COQ metabolon (complex Q / CoQ synthome), interacting with COQ6, COQ7
  and other COQ proteins. The protein adopts a protein kinase-like fold in which an
  N-terminal KxGQ motif occludes the canonical substrate-binding pocket; nucleotide
  (ATP) binding relieves this autoinhibition. Its best-supported catalytic activity is
  ATP hydrolysis: the COQ8 family lacks canonical protein kinase activity toward
  general substrates in trans, and reconstituted (ancestral tetrapod) COQ8B shows
  ATPase activity that is stimulated ten-fold by the COQ6:COQ3 pair. In the same
  reconstitution COQ8B increased and streamlined CoQ production in an ATP-dependent
  manner without stably co-eluting with the metabolon, and COQ3 (but not COQ6) was
  phosphorylated by COQ8B; whether this COQ3 phosphorylation is a physiological
  protein-kinase function is not yet established. COQ8B does not phosphorylate CoQ
  lipid intermediates. It localizes mainly to the mitochondrion, associated with the
  matrix face of the inner mitochondrial membrane, and is also detected in the cytosol
  and at the cell membrane. It is particularly important in kidney podocytes;
  loss-of-function mutations cause primary coenzyme Q10 deficiency presenting as
  steroid-resistant nephrotic syndrome with focal segmental glomerulosclerosis
  (nephrotic syndrome type 9, COQ10D9).
