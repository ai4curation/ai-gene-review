suggested_questions:
- question: >-
    Is the COQ3 phosphorylation observed with reconstituted ancestral COQ8B detectable for
    human COQ8B in mitochondria, and does it regulate COQ synthome assembly in vivo?
- question: >-
    Why does COQ8B loss cause predominantly renal (podocyte) disease whereas COQ8A loss
    causes cerebellar ataxia, given the shared ATPase mechanism?
suggested_experiments:
- description: >-
    Measure ATPase activity of purified human COQ8B wild type and COQ10D9 patient variants
    in the presence of cardiolipin, CoQ intermediates and the COQ6:COQ3 pair, and test
    phospho-site mutants of COQ3 for effects on CoQ output in COQ8B-deficient podocytes.
