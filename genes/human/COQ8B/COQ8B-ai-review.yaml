core_functions:
- description: >-
    ATP-binding atypical UbiB-family kinase-like protein whose demonstrated catalytic
    activity is ATP hydrolysis (ATPase), gated by nucleotide binding that relieves
    KxGQ-mediated autoinhibition and stimulated by the COQ6:COQ3 pair. Acting at the
    matrix face of the inner mitochondrial membrane, it supports assembly and activity of
    the COQ synthome and streamlines coenzyme Q10 production; it is not a canonical
    in-trans protein kinase (an in vitro COQ3 phosphorylation is recorded as non-core).
