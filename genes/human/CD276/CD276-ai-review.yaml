description: CD276 (B7-H3) is a type I transmembrane glycoprotein of the B7 immunoglobulin superfamily.
  The predominant human isoform (4Ig-B7-H3) has a duplicated IgV-IgC extracellular region displayed on
  the cell surface, a single transmembrane helix and a short cytoplasmic tail; a 2Ig isoform and soluble
  shed forms also exist. CD276 is expressed at low levels on many normal tissues and is induced on dendritic
  cells and monocytes by inflammatory stimuli, and is highly expressed on many solid tumours and tumour
  vasculature. Acting as a ligand for a still unidentified receptor on activated T cells, it modulates
  T-cell proliferation and cytokine production; early studies described costimulation whereas later human
  studies found inhibition of T-cell activation, so the direction of its effect is context-dependent and
  disputed. A proposed murine receptor, TREML2, was not confirmed in human.
