suggested_questions:
- question: What is the human receptor for CD276 on activated T cells, given that TREML2 was excluded
    and the original counter-receptor was never identified?
- question: Which experimental variables (isoform 4Ig versus 2Ig, soluble versus membrane-bound presentation,
    T-cell activation state) determine whether CD276 enhances or reduces T-cell responses?
suggested_experiments:
- hypothesis: The opposing costimulatory and inhibitory effects reported for CD276 reflect engagement
    of two distinct receptors with different expression kinetics on T cells.
  description: Use proximity labelling or a genome-wide receptor-array screen with recombinant 4Ig- and
    2Ig-B7-H3 on naive versus pre-activated human T cells to identify binding partners, then test each
    candidate by knockout for its effect on proliferation and IL-2 output.
