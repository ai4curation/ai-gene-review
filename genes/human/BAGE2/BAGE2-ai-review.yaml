  label: Homo sapiens
description: 'BAGE2 is a member of the BAGE (B melanoma antigen) family. These are nearly identical genes
  in the juxtacentromeric regions of chromosomes 13 and 21, generated in hominoids by juxtacentromeric
  reshuffling of a KMT2C/MLL3 gene fragment. It encodes a putative 109-residue protein of unknown function.
  Like BAGE1, the family has a cancer/testis expression profile: silent in normal somatic tissues except
  testis, and expressed in melanomas and bladder and lung carcinomas. Selective constraint on the putative
  coding regions suggests the proteins are functional, but no activity has been described.'
