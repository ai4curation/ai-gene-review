  title: BAGE genes generated by juxtacentromeric reshuffling in the Hominidae lineage are under selective
    pressure.
  findings:
  - statement: BAGE genes arose from MLL3 fragments and are under selective pressure.
    supporting_text: Our data strongly suggest that BAGE proteins have a function and that juxtacentromeric
      regions, whose plasticity is now largely proved, are not a simple junkyard of gene fragments, but
      may be the birth site of novel genes.
