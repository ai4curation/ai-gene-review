core_functions:
- description: Type-II phosphatidylinositol kinase that phosphorylates phosphatidylinositol
    5-phosphate using ATP or GTP as phosphodonor, enabling PI(5)P-dependent GTP sensing and
    PI(4,5)P2 synthesis from cytosolic, nuclear, and membrane-associated pools.
  molecular_function:
    id: GO:0016309
    label: 1-phosphatidylinositol 5-phosphate 4-kinase activity
  directly_involved_in:
  - id: GO:1902635
    label: 1-phosphatidyl-1D-myo-inositol 4,5-bisphosphate biosynthetic process
  locations:
  - id: GO:0005829
    label: cytosol
  - id: GO:0005634
    label: nucleus
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:26774281
    supporting_text: The in vitro kinase assay was carried out using γ-32P radiolabeled ATP or GTP
      (Perkin Elmer), synthetic PI(5)P diC16 (Echelon Biosciences), and recombinant PI5P4Ks.
  - reference_id: PMID:26774281
    supporting_text: Based on its kinetic property, PI5P4Kβ is a good candidate for a functional GTP
      sensor. PI5P4Kβ displayed a higher GTP-dependent kinase activity than ATP-dependent kinase
      activity
  - reference_id: PMID:30718367
    supporting_text: They were also localised in a manner similar to that reported in mammalian
      cells with hPIP4K2A largely seen to be cytosolic, along with some plasma membrane
      localisation, whereas hPIP4K2B was present in nucleus along with cytosolic and membrane
      localisation
suggested_questions:
- question: Which PIP4K2B compartments are directly regulated by cellular GTP concentration?
- question: Does the historical PIP4K2B interaction with TNFRSF1A have a modern mechanistic role
    after the type-II PIP4K substrate correction?
suggested_experiments:
- description: Use endogenous tagging and lipid reporters to compare PIP4K2B localization with local
    PI5P and PI(4,5)P2 turnover during basal growth, starvation, and insulin stimulation.
- description: Rescue PIP4K2B-depleted human cells with kinase-dead and PIP5K1A-binding-defective
    variants to separate catalytic PI5P 4-kinase functions from catalytic-independent PIP5K
    suppression.
