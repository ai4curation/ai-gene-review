id: P78356
gene_symbol: PIP4K2B
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: PIP4K2B is the beta isoform of the type-II PI5P 4-kinases and phosphorylates PI5P with
  ATP or GTP to produce PI(4,5)P2. It is a cytosolic and nuclear peripheral-membrane lipid kinase
  with prominent GTP-sensing activity, forms dimers, interacts with PIP4K2A, and contributes to
  localized PI5P/PI(4,5)P2 control in autophagy and insulin-PI3K signaling.
