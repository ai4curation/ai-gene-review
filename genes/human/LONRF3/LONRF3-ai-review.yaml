- id: file:human/LONRF3/LONRF3-uniprot.txt
  title: UniProtKB entry Q496Y0 (LONF3_HUMAN)
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Curated source for three annotated isoforms and predicted domain
      architecture. Canonical LONRF3 has four TPR repeats, two RING-type zinc fingers,
      and a C-terminal Lon N-terminal substrate-binding domain. Isoform 2 deletes
      residues 313-353, essentially removing TPR4 while retaining both RING fingers
      and the Lon N-terminal domain. Isoform 3 changes residues 605-610 and lacks
      residues 611-759, truncating most of the Lon N-terminal domain while retaining
      both RING fingers. UniProt provides no direct LONRF3 activity, substrate, complex,
      or experimental localization evidence.
core_functions:
- description: >-
    Predicted RING-type ubiquitin protein ligase activity. The assignment rests on the
    accepted IBA annotation and two predicted RING-type zinc-finger regions, but remains
    inference-grade because ubiquitin transfer by LONRF3 itself has not been demonstrated
    and no E2 enzyme, substrate, ubiquitin-chain product, biological process, active
    location, or stable complex is known.
  molecular_function:
    id: GO:0061630
    label: ubiquitin protein ligase activity
  supported_by:
  - reference_id: GO_REF:0000033
  - reference_id: file:human/LONRF3/LONRF3-bioinformatics/RESULTS.md
    supporting_text: >-
      Both regions retain dense Cys/His patterns and are strongly conserved in reviewed
      mouse Lonrf3, supporting intact rather than degenerate RING-family architecture:
knowledge_gaps:
- gap_statement: >-
    Intrinsic ubiquitin protein ligase activity by LONRF3 has not been demonstrated, and
    its E2 requirements, active RING region or regions, and ubiquitin-chain products are
    unknown.
  boundary: >-
    An IBA supports broad ubiquitin ligase activity, and UniProt predicts two RING-type
    zinc fingers; neither source is a direct LONRF3 ubiquitin-transfer experiment.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: >-
    Direct catalysis is required to distinguish an active E3 ligase from a RING-containing
    interaction scaffold and to determine whether one or both RING regions contribute.
  resolution: >-
    Reconstitute sequence-verified full-length LONRF3 with an E1, a panel of human E2
    enzymes, and ubiquitin; measure E2~ubiquitin discharge, autoubiquitination, and chain
    formation while comparing wild type with structure-guided mutants in each RING region.
  provenance:
  - reference_id: file:human/LONRF3/LONRF3-bioinformatics/RESULTS.md
    supporting_text: >-
      The sequence evidence strongly disfavors degeneration of either RING region across
      the human–mouse comparison, but it cannot prove zinc occupancy or ligase activity.
  - reference_id: file:human/LONRF3/LONRF3-uniprot.txt
    supporting_text: RING-type 1
- gap_statement: >-
    No physiological LONRF3 substrate or biological process has been established.
  boundary: >-
    Seven proteins occur as candidate partners in three systematic interaction resources,
    but those binary edges do not demonstrate LONRF3-dependent ubiquitination,
    degradation, or another substrate outcome; LONRF2 substrates and protein-quality-
    control biology are paralog-specific evidence.
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  status: OPEN
  significance: >-
    Substrate identity is necessary to connect the inferred ligase activity to a cellular
    pathway and to determine whether LONRF3 resembles or diverges from other LONRF paralogs.
  resolution: >-
    Combine acute endogenous LONRF3 depletion with diGly ubiquitin-remnant proteomics and
    quantitative protein-turnover measurements, then require rescue by wild-type but not
    RING-disrupted LONRF3 and validate prioritized substrates in a purified reaction.
  provenance:
  - reference_id: PMID:32296183
    supporting_text: >-
      Here we present a human 'all-by-all' reference interactome map of human binary
      protein interactions, or 'HuRI'.
- gap_statement: >-
    The native subcellular location of active LONRF3 and any regulated cofactor assembly
    are unknown.
  boundary: >-
    UniProt carries only electronic cytoplasmic localization, while the interaction
    resources do not establish endogenous co-localization or a physiological stable
    complex.
  gap_kind:
  - BIOLOGY
  dark_aspect: CC_DARK
  status: OPEN
  significance: >-
    Compartment and transient cofactors constrain which E2 enzymes and substrates can
    encounter LONRF3 and prevent screen-derived partners from being interpreted as one
    complex.
  resolution: >-
    Endogenously tag LONRF3 and combine quantitative imaging, biochemical fractionation,
    and proximity labeling under basal and proteotoxic-stress conditions, validating
    candidate cofactors by reciprocal endogenous interaction assays.
  provenance:
  - reference_id: PMID:20195357
    supporting_text: >-
      Here we present the first large-scale IR data set obtained using mRNA display for 50
      human transcription factors (TFs), including 12 transcription-related proteins.
- gap_statement: >-
    Whether the three annotated LONRF3 isoforms differ in ligase activity, substrate
    selection, localization, or stability is unknown, and the isoform used for each
    interaction-screen edge is not established in the cached main texts.
  boundary: >-
    Isoform 2 removes most of TPR4 while retaining both RING regions and the C-terminal
    Lon-domain homolog; isoform 3 retains both RING regions but truncates most of the
    C-terminal Lon-domain homolog. These architectural differences have not been tested
    functionally.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: >-
    The altered TPR and putative substrate-binding architectures could change partner or
    substrate selection without eliminating the retained RING regions.
  resolution: >-
    Compare sequence-verified isoforms expressed at matched endogenous levels for E2
    engagement, ubiquitination activity, partner selection, stability, localization, and
    rescue of any substrate or phenotype discovered after LONRF3 loss.
  provenance:
  - reference_id: file:human/LONRF3/LONRF3-uniprot.txt
    supporting_text: IsoId=Q496Y0-3; Sequence=VSP_023081, VSP_023082;
proposed_new_terms: []
suggested_questions:
- question: >-
    Does full-length LONRF3 directly catalyze ubiquitin transfer, which E2 enzymes support
    it, and do both RING regions contribute to the reaction?
- question: >-
    Which endogenous proteins are direct LONRF3 substrates, and does their modification
    alter degradation, localization, interaction, or activity?
- question: >-
    Where does endogenous LONRF3 function, and which of the seven screen-derived partners,
    if any, are reproducible cofactors or substrates rather than assay-context contacts?
- question: >-
    Do the isoform-2 TPR4 deletion and isoform-3 Lon-domain truncation alter substrate
    recognition or regulation relative to the canonical product?
suggested_experiments:
- hypothesis: >-
    LONRF3 is an active RING-type E3 ligase whose activity requires one or both intact
    RING regions and a restricted subset of human E2 enzymes.
  description: >-
    Purify sequence-verified full-length LONRF3 and reconstitute ubiquitination with an E1,
    ubiquitin, and an E2 panel. Measure E2~ubiquitin discharge, autoubiquitination, and free
    chain formation, comparing wild type with separate and combined zinc-coordinating-
    residue mutants of the two RING regions.
  experiment_type: reconstituted ubiquitination assay
- hypothesis: >-
    Acute loss of LONRF3 changes ubiquitination and abundance of a limited set of direct
    physiological substrates.
  description: >-
    Engineer an acute degron at the endogenous LONRF3 locus, then perform matched diGly
    ubiquitin-remnant proteomics, total proteomics, and pulse-chase turnover analysis.
    Rescue candidate changes with wild-type versus RING-disrupted LONRF3 and test direct
    modification in a purified reaction.
  experiment_type: acute perturbation and ubiquitin proteomics
- hypothesis: >-
    LONRF3 occupies a regulated cellular compartment and engages a limited local network
    not resolved by systematic binary screens.
  description: >-
    Introduce a minimally disruptive endogenous fluorescent or proximity-labeling tag,
    map localization and proximal proteins under basal and proteotoxic-stress conditions,
    and validate high-confidence partners by reciprocal endogenous co-immunoprecipitation.
  experiment_type: endogenous localization and proximity proteomics
- hypothesis: >-
    Isoforms 2 and 3 retain potential RING ligase activity but differ from the canonical
    product in substrate or partner selection because of their altered TPR or Lon-domain
    architecture.
  description: >-
    Express sequence-verified isoforms from the same genomic landing site at matched levels
    and compare localization, E2 binding, ubiquitination activity, proximity interactomes,
    and modification of substrates identified in endogenous loss-of-function studies.
  experiment_type: isoform-comparative functional analysis
