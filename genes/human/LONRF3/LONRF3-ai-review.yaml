- id: file:human/LONRF3/LONRF3-bioinformatics/RESULTS.md
  title: LONRF3 comparative domain analysis results
  findings:
  - statement: >-
      Both predicted LONRF3 RING regions retain dense Cys/His patterns and are strongly
      conserved in the reviewed mouse ortholog, supporting intact RING-family architecture.
    supporting_text: >-
      Both regions retain dense Cys/His patterns and are strongly conserved in reviewed
      mouse Lonrf3, supporting intact rather than degenerate RING-family architecture:
  - statement: >-
      LONRF3 lacks the AAA+ ATPase and protease-domain machinery found in the LONP1
      control, so its isolated Lon N-terminal domain does not support peptidase activity.
    supporting_text: >-
      More decisively, the targeted presence matrix finds no AAA+ ATPase domain/core
      (IPR003593/IPR003959), Lon protease family call (IPR004815), peptidase S16 active
      site (IPR008268), or Lon proteolytic domain (IPR008269) in LONRF3. All five are
      present in the LONP1 control.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Reproducible comparison using reviewed mouse Lonrf3, LONRF paralogs, RNF4, and
      LONP1 controls. It supports domain architecture and presence/absence conclusions
      only; it does not directly demonstrate ubiquitin transfer, zinc occupancy, or a
      biological substrate.
