  review:
    summary: Phylogenetic inference supports LONRF3 as a RING-type ubiquitin E3 ligase.
    action: ACCEPT
    reason: >-
      The IBA is the only informative catalytic annotation for LONRF3 and is consistent
      with its conserved LONRF-family placement and two annotated RING-type zinc-finger
      regions. No direct LONRF3 ubiquitin-transfer assay or substrate is available, so
      the broad ligase term is retained without transferring the protein-quality-control
      substrates or neuronal biology established for the paralog LONRF2.
