id: Q496Y0
gene_symbol: LONRF3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  LONRF3 is a poorly characterized LONRF-family protein predicted to function as a
  RING-type ubiquitin E3 ligase on the basis of phylogenetic annotation and two
  conserved RING-type zinc-finger regions. It also contains four TPR repeats and a
  C-terminal region homologous to the substrate-binding N-terminal domain of Lon
  proteases. LONRF3 lacks the AAA+ ATPase and proteolytic domains of complete Lon
  peptidases; its isolated Lon-domain homology therefore does not confer the complete
  architecture of a Lon peptidase. Direct ubiquitin-transfer activity, E2 partners, physiological
  substrates, biological process, and native subcellular location have not been
  established. Seven candidate partners have been recovered by systematic binary-
  interaction screens, but none is validated as a substrate, cofactor, or stable-complex
  component. Two alternative isoforms alter the TPR or C-terminal Lon-domain architecture, but
  their functions have not been compared.
