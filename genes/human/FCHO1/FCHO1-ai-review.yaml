      donor D3ZIM5 annotations were read. Captured aligned sequences match the official target proteins. PMID:35072626
      provides tagged FCHO1 localization at transient perisynaptic sites in rat hippocampal neurons; Figures
      4 and 5 pixels were viewed. Endogenous knock-in controls and later super-resolution component measurements
      did not include FCHO1. The construct species is not independently resolved. This remains a contextual
