id: O14526
gene_symbol: FCHO1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: FCHO1 is a muniscin-family endocytic protein that couples plasma-membrane association to organization
  of clathrin-coated pits. Its N-terminal F-BAR domain binds phosphoinositide-containing membranes, its central
  linker binds AP-2, and its C-terminal mu-homology domain engages EPS15, intersectin and other endocytic partners.
  These interactions support coat assembly and cargo internalization in a cell- and cargo-dependent manner.
  Human FCHO1 deficiency can impair T-cell receptor trafficking and activation and cause combined immunodeficiency.
