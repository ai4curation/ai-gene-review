      rows were read. The official family label is PROLINE-SERINE-THREONINE PHOSPHATASE INTERACTING PROTEIN
      1; the target subfamily is PTHR23065:SF6, F-BAR DOMAIN ONLY PROTEIN 1. GOA donor sets match the cached
      IBD sets, including expected target self-WITH. Initial and one recovery request for geneinfo, tree and
      family MSA timed out. Literal matches do not establish a verified target leaf path or MSA. Independent
      human evidence in PMID:22484487 and PMID:32098969 supports the retained biology; no functional loss is
      inferred from access failures, donor count or self-WITH. Broad cytoplasm is covered by directly supported
      cytosol. The later notices on PMID:20448150 are not treated as a retraction or silently resolved.
