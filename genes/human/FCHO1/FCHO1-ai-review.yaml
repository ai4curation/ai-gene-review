      SL-0069 coated-pit field were read. This method merges identical electronic annotations rather than adding
      an independent experiment. Human target membrane/coat evidence supports the annotation; exact historical
      rule matching remains unreplayed. Coated pit and free mature coated vesicle are not conflated.
- id: PMID:19713939
  title: Syp1 is a conserved endocytic adaptor that contains domains involved in cargo selection and membrane
    tubulation.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Original publisher PDF identity and DOI 10.1038/emboj.2009.248 verified. The bounded read
      covers the FCHO1/EPS15 Results, Figure 5 including actual pixels, Figure 7 Results/caption, relevant
      Discussion and Methods. Human FCHO1 muHD binds EPS15 from rat brain cytosol, and an EPS15 C-terminal
