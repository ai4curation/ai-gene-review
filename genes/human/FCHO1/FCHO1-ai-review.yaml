      and cytosol with enhanced reliability and two antibodies whose separate antigens match the canonical
      sequence. Three original composite images were viewed; two other image requests failed. The positive
      signals are retained with cell-line and antibody scope. No independent endogenous specificity control,
      nuclear molecular function or isoform attribution was established. Method provenance is distinct from
      the target images.
