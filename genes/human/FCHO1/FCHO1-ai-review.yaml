      consequences are clathrin coat assembly and clathrin-dependent endocytosis; each includes a Primates/FunFam
      1.20.1270.60:FF:000016 condition set. Target UniProt/Gene3D family fields are consistent, but exact FunFam
      matching and historical rule state were not replayed. Independent saved human target evidence in PMID:22484487
      and PMID:32098969 supports participation with context-dependent necessity. No novel catalytic function
      is inferred from a family label.
- id: GO_REF:0000120
