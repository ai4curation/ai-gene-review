- index: 30
  source_annotation:
    term:
      id: GO:0050852
      label: T cell receptor signaling pathway
    evidence_type: IMP
    original_reference_id: PMID:32098969
    qualifier: involved_in
  previous_review:
    summary: FCHO1 supports T-cell-receptor signaling through context-dependent receptor trafficking.
    action: KEEP_AS_NON_CORE
    reason: The 2020 human Jurkat study links FCHO1 loss and wild-type rescue to receptor internalization and receptor-triggered
      calcium responses. The same paper did not establish direct FCHO1–CD3 binding and leaves the detailed coupling
      between trafficking and signal strength unresolved. Retain the positive signaling annotation as a cellular
      context of the endocytic organizer, rather than an independently demonstrated receptor-proximal catalytic
      or signaling-adaptor activity.
    supported_by:
    - reference_id: PMID:32098969
  review:
    summary: FCHO1 supports T-cell-receptor signaling through context-dependent receptor trafficking.
    action: KEEP_AS_NON_CORE
    reason: Human FCHO1-deficient Jurkat cells in PMID:32098969 Figure 4 show impaired CD3:TCR internalization and
      receptor-triggered calcium responses, restored by wild-type FCHO1. Direct FCHO1–CD3 binding was not established.
      This supports the existing signaling annotation through endocytic organization, retained as a non-core cellular
      context. The independent 2019 patient study (PMID:30822429, main text discussing Figure E4A–B, Figure 1E–F
      and Figure E4C) adds impaired activation-induced proliferation and survival in the one patient with pre-transplant
      functional samples, P2; it does not independently reproduce the Jurkat trafficking mechanism. In activated
      P2 T-cell blasts, transferrin uptake was impaired but TCR/CD3 internalization was preserved. Patient cells,
      cargo and activation state therefore remain distinct from the Jurkat comparison; neither study establishes
      a universal cargo defect or a separate receptor-proximal catalytic activity.
    supported_by:
    - reference_id: PMID:32098969
    - reference_id: PMID:30822429
- index: 31
  source_annotation:
    term:
      id: GO:0050870
      label: positive regulation of T cell activation
    evidence_type: IMP
    original_reference_id: PMID:32098969
    qualifier: involved_in
  previous_review:
    summary: FCHO1 positively supports activation of human T cells.
    action: KEEP_AS_NON_CORE
    reason: The 2020 study reports reduced activation responses in patient T cells and complementary FCHO1-dependent
      receptor-trafficking/signaling results in human cells. These support the positive regulatory annotation in
      its immune-cell context. The molecular role resolved here is endocytic organization; the data do not establish
      a separate activation-specific biochemical activity or a single universal mechanism for all cytokine responses.
    supported_by:
    - reference_id: PMID:32098969
  review:
    summary: FCHO1 positively supports activation of human T cells.
    action: KEEP_AS_NON_CORE
    reason: 'The 2020 study reports patient T-cell response abnormalities and FCHO1-dependent receptor trafficking/calcium
      responses in human Jurkat cells (Figures 4 and 6). PMID:30822429 adds functional evidence from pre-transplant
      patient P2 PBMCs: anti-CD3/CD28-induced proliferation was reduced, with more hypodiploid cells and fewer cycling
      cells, despite preserved induction of the measured activation markers. Its activated T-cell blasts had impaired
      transferrin uptake but preserved TCR/CD3 internalization. These observations strengthen the positive, context-dependent
      contribution to T-cell activation and expansion, without implying that every early activation readout fails
      or that the two studies measured the same trafficking phenotype. Retain the immune-cell role as non-core relative
      to membrane-associated endocytic organization, with no new activation-specific biochemical function.'
    supported_by:
    - reference_id: PMID:32098969
    - reference_id: PMID:30822429
new_annotation:
  index: 37
  annotation:
    term:
      id: GO:0043495
      label: protein-membrane adaptor activity
    evidence_type: IC
    original_reference_id: PMID:22484487
    qualifier: enables
    review:
      summary: Human FCHO1 bridges membrane association and endocytic protein interactions to organize coat sites.
      action: NEW
      reason: The synthesis combines human-target experiments rather than domain architecture alone. PMID:22484487
        Results “The FCHO endocytic hub,” “The linker region” and “The μHD,” Figures 1–2 and Supplementary Figure
        S1k show PtdIns(4,5)P2-dependent FCHO1 membrane binding, central-linker AP-2 association and muHD association
        with EPS15/ITSN; domain-localization comparisons distinguish membrane association from coat-partner engagement.
        PMID:32098969 Figures 2–3 show that human FCHO1 wild type supports membrane-localized endocytic protein
        organization and coordinated clathrin-coat recruitment, whereas F-BAR or muHD disease variants disrupt different
        components of that behavior. Together these support GO:0043495 protein-membrane adaptor activity as an IC
        synthesis. This is not direct clathrin or CD3 binding, enzymatic activation, universal dependence of endocytosis
        on FCHO1, or a unique function of a natural splice product. Official typed is_a/part_of ancestry shows no
        ancestor/descendant relation between this term and the existing or replacement binding terms GO:0005515,
        GO:0035612, GO:0097110 and GO:1990782.
      supported_by:
      - reference_id: PMID:22484487
      - reference_id: PMID:32098969
  primary_locators:
  - reference_id: PMID:22484487
    locator: Results The FCHO endocytic hub / The linker region / The μHD; Figures 1–2; Supplementary Figure S1k
  - reference_id: PMID:32098969
    locator: Results and captions for Figures 2–3, human FCHO1 localization and coordinated coat recruitment
