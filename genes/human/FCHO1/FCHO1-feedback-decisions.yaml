    summary: Human FCHO1 binds the endocytic scaffold EPS15 through its C-terminal mu-homology region.
    action: MODIFY
    reason: PMID:19713939 Figure 5 shows EPS15 recovery with human FCHO1 muHD and competition by the EPS15 C-terminal
      fragment; the Methods identify the FCHO1 fragment as human and the cytosol as rat, consistent with the source
      partner A7BFV9. The Discussion explicitly identifies Ede1/EPS15 as scaffold/adaptor proteins. GO:0097110 scaffold
      protein binding therefore describes this positive pair more precisely than generic protein binding. This is
      a binding-class refinement, not a claim that the isolated assay proves FCHO1 recruits cargo, activates EPS15,
      or establishes binding of every natural FCHO1 product. The rat partner and existing source object remain unchanged.
    proposed_replacement_terms:
