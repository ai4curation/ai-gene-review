gene: FCHO1
scope: Seven existing generic binding contexts; all source objects and natural products remain unchanged.
binding_policy: Use a supported specific existing term where possible; otherwise retain legitimate generic
  binding as non-core.
source_decisions: FCHO1-binding-decisions.yaml
references:
- reference_id: PMID:19713939
  title: Syp1 is a conserved endocytic adaptor that contains domains involved in cargo selection and membrane
    tubulation.
  assessment:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Original publisher PDF identity and DOI 10.1038/emboj.2009.248 verified. The bounded read
      covers the FCHO1/EPS15 Results, Figure 5 including actual pixels, Figure 7 Results/caption, relevant
      Discussion and Methods. Human FCHO1 muHD binds EPS15 from rat brain cytosol, and an EPS15 C-terminal
      fragment competes. The original explicitly calls Ede1/EPS15 scaffold/adaptor proteins, supporting the
      binding-class refinement. Human GFP-FCHO1 localization and overexpression-associated internalization
      effects are described separately from the yeast Syp1 mechanistic experiments; yeast membrane-tubulation
      and Mid2 cargo results are not transferred wholesale to human FCHO1. This assessment does not establish
      natural-product-specific binding or an endogenous human pair in that rat-cytosol assay. The normal cache
      is abstract-only; the separate genuine publisher PDF supplied the operative text.
  original_url: https://doi.org/10.1038/emboj.2009.248
- reference_id: PMID:25416956
  title: A proteome-scale map of the human interactome network.
  assessment:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Identity verified from genuine PMC BioC metadata (PMID 25416956; DOI 10.1016/j.cell.2014.10.050)
      and the original Table S2 workbook fetched from the official BioStudies supplement. Independently extracted
      sheet 2G rows 4771, 9693 and 9694 explicitly join human FCHO1 to PTK6, LGALS14 and EXOSC5. The primary
      Results/Methods describe the HI-II-14 binary Y2H screen and pairwise retesting; screens_found=1 is a
      discovery-screen count. Table S2A/S2C contain no FCHO1 target row in the inspected workbook, so dataset-wide
      orthogonal validation is not assigned to these pairs. Table S2F is domain-pair analysis, not a measured
      FCHO1 binding-site map. The evidence supports binding to PTK6 as a protein-tyrosine kinase and non-core
      binding to LGALS14/EXOSC5, without enzymatic, regulatory, complex-membership or natural-product claims.
      The reused file named 25416956-original.xml is a preserved HTTP500 JSON response and was excluded; the
      genuine BioC original supplied the read text.
  original_url: https://pmc.ncbi.nlm.nih.gov/articles/PMC4266588/
- reference_id: PMID:31515488
  title: Extensive disruption of protein interactions by genetic variants across the allele frequency spectrum
    in human populations.
  assessment:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Identity verified in the genuine original XML (PMID 31515488; DOI 10.1038/s41467-019-11959-3);
      saved supplement bytes were independently matched to members of the genuine Europe PMC archive and the
      prior reuse pins. Supplementary Data 2 rows 3437–3439 join FCHO1 GeneID 23149/O14526,E423G to PTK6 5753,
      LGALS14 56891 and EXOSC5 56915, each with Disruption=0. The primary Results and relevant Methods establish
      that these are variant-versus-wild-type interaction measurements in the Y2H framework. The result supports
      the three binding pairs and a bounded PTK6-binding refinement; it does not assign a natural isoform,
      infer kinase regulation or establish exosome/galectin function for FCHO1. The inspected Supplementary
      Data 6 has no FCHO1 PCA retest row, so independent mammalian confirmation of these exact pairs is not
      claimed. Read scope is limited to the target rows and relevant primary sections rather than a complete
      reanalysis of the population-variant study.
  original_url: https://pmc.ncbi.nlm.nih.gov/articles/PMC6742646/
