limits:
- The 2014 screens_found=1 is a discovery-screen count, not a single confirmatory-test count.
- 2014 Table S2F is domain-pair analysis, not independent proof that these particular FCHO1 contacts map to
  an SH3/FCH interface.
- No target-specific orthogonal assay record was found in the inspected 2014 S2A/S2C or 2019 SD6.
- 2019 Disruption=0 means no disruption called for tested E423G pairs; it is not proof of an endogenous function
  or a natural-isoform assignment.
- Exact clone boundaries were not remapped to the three natural FCHO1 splice products.
- Original raw captures are private provenance; no uncommitted sources/ paths are presented as public links.
- No new literature recovery or experimental recommendations were made in this static review.
