  review:
    summary: A postsynaptic endocytic-zone location is a contextual ortholog inference.
    action: KEEP_AS_NON_CORE
    reason: The actual Ensembl response identifies one-to-one orthology from human ENSG00000130475 to rat ENSRNOG00000033912
      / ENSRNOP00000049715; its ungapped target and source sequences match the captured official proteins. Rat D3ZIM5
      has three SynGO source annotations to this term from PMID:35072626. That original study shows tagged FCHO1
      at a subset of perisynaptic sites and transient recruitment in cultured rat hippocampal neurons (Figures 4
      and 5, whose pixels were inspected). The stable-positioned site in the GO definition does not require every
      recruited protein to be permanently resident. FCHO1 was not among the endogenous knock-in controls or the
      later super-resolution component panel, and the plasmid species was not independently resolved. Preserve this
      bounded transfer without claiming direct human neuronal localization or a constitutive EZ component. PMID:41943152
      provides separate rat presynaptic endocytosis context; it does not substitute for the postsynaptic localization
      experiment.
    additional_reference_ids:
    - PMID:35072626
    - PMID:41943152
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
