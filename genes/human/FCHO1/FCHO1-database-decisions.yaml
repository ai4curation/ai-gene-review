        source_label: rat Fcho1
        source_status: SUPPORTS_TRANSFER
        comment: Actual experimental donor annotations and original localization evidence are recovered; the transfer
          is contextual and does not establish human endogenous neuronal localization.
      - source_id: ensembl:ENSRNOP00000049715
        source_label: rat Fcho1 protein
