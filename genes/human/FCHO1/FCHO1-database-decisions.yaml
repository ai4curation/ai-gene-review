  review:
    summary: FCHO1 has a contextual HPA nucleoplasmic localization.
    action: KEEP_AS_NON_CORE
    reason: "The actual HPA FCHO1 record reports enhanced nucleoplasm and cytosol localization with HPA041653 and\
      \ HPA062981. Their distinct antigens match canonical residues 285\u2013364 and 746\u2013818. Three selected\
      \ original composite images were inspected: both antibodies in MCF-7 and HPA062981 in PC-3. HPA reports nucleoplasm\
      \ in all examined antibody/cell combinations, with cytosol in a subset. The images are consistent with those\
      \ calls; no independent endogenous specificity control, isoform resolution or nuclear molecular function was\
      \ established. The positive nuclear observation is retained without making it the principal endocytic site.\
      \ The better-established plasma-membrane role does not disprove another pool."
