scope: Eleven functional annotation reviews; source indices are zero-based.
rows:
- index: 19
  source_annotation:
    term:
      id: GO:0005886
      label: plasma membrane
    evidence_type: IDA
    original_reference_id: PMID:20448150
    qualifier: located_in
  review:
    summary: FCHO1 associates with the plasma membrane at endocytic coat sites.
    action: ACCEPT
    reason: The recovered 2010 supplement includes human FCHO1 constructs and surface-punctum localization, although
      several endogenous panels use a combined FCHo1/2 label. Independent 2012 human FCHO1 localization and 2020
      wild-type-versus-variant imaging establish the same plasma-membrane claim. Acceptance rests on this convergent
      target-specific evidence, not an assumption that the editorial concern was resolved. The 2010 report has a
      verified 2025 Expression of Concern and subsequent Erratum; their bodies and affected-experiment/resolution
      scope were unavailable.
    supported_by:
    - reference_id: PMID:20448150
    - reference_id: PMID:22484487
    - reference_id: PMID:32098969
    - reference_id: PMID:39847650
    - reference_id: PMID:41232007
- index: 21
  source_annotation:
    term:
      id: GO:0005905
      label: clathrin-coated pit
    evidence_type: IDA
    original_reference_id: PMID:20448150
    qualifier: is_active_in
  review:
    summary: FCHO1 is recruited to plasma-membrane clathrin-coated pits.
    action: ACCEPT
    reason: The original supplement Figure S2B follows tagged human FCHO1 with clathrin, and Figure S1D shows its
      overlap with FCHo2 puncta. Independent human FCHO1 localization in the 2012 study and coat-dynamics imaging
      in the 2020 study support this pit compartment directly. This is not a claim of residence on detached coated
      vesicles. The 2010 report has a verified 2025 Expression of Concern and subsequent Erratum; their bodies and
      affected-experiment/resolution scope were unavailable.
    supported_by:
    - reference_id: PMID:20448150
    - reference_id: PMID:22484487
    - reference_id: PMID:32098969
    - reference_id: PMID:39847650
    - reference_id: PMID:41232007
- index: 22
  source_annotation:
    term:
      id: GO:0005905
      label: clathrin-coated pit
    evidence_type: IDA
    original_reference_id: PMID:22484487
    qualifier: located_in
  review:
    summary: Human FCHO1 localizes to surface clathrin-coated pits.
    action: ACCEPT
    reason: The 2012 Results describe low-level GFP-FCHO1 puncta at the ventral surface that overlap AP-2 and remain
      distinct from APPL1- and EEA1-positive endosomes. Figure 1 and the domain analysis place full-length FCHO1
      at clathrin foci; the human constructs are identified in Methods. The data support a coat-site location without
      assuming that every FCHO1 molecule is constitutively coat-bound.
    supported_by:
    - reference_id: PMID:22484487
- index: 24
  source_annotation:
    term:
      id: GO:0030136
      label: clathrin-coated vesicle
    evidence_type: IDA
    original_reference_id: PMID:20448150
    qualifier: colocalizes_with
    negated: true
  review:
    summary: The inherited NOT annotation for mature clathrin-coated vesicles remains unresolved.
    action: UNDECIDED
    reason: Preserve the negation. The recovered original reports FCHo1/2 depletion from purified coated-vesicle
      fractions, and Supplementary Figure S6E shows the combined FCHo1/2 blot with loading controls. However, the
      antibody Methods identify anti-FCHo2 Ra103 raised against the FCHO2 N-terminal region; this does not independently
      resolve the FCHO1-specific contribution to the combined signal. Positive pit localization does not by itself
      prove absence from mature vesicles. The 2010 report has a verified 2025 Expression of Concern and subsequent
      Erratum; their bodies and affected-experiment/resolution scope were unavailable. The evidence therefore remains
      compatible with the curator’s negative assignment, but does not settle its target-specific scope; no wrong-gene
      or retraction claim is made.
    supported_by:
    - reference_id: PMID:20448150
    - reference_id: PMID:39847650
    - reference_id: PMID:41232007
- index: 25
  source_annotation:
    term:
      id: GO:0035612
      label: AP-2 adaptor complex binding
    evidence_type: IDA
    original_reference_id: PMID:22484487
    qualifier: enables
  review:
    summary: FCHO1 binds the AP-2 adaptor complex through its central linker.
    action: ACCEPT
    reason: The 2012 study maps AP-2 association to human FCHO1 linker constructs, with the major determinant between
      residues 267 and 442. Figure 1c–d and the corresponding Results identify binding to the α-subunit appendage
      platform and loss of binding with its W840A substitution, with weaker β2-appendage association. Methods distinguish
      the human FCHO1 constructs from the mouse/rat appendage reagents. This directly supports AP-2-complex binding,
      without claiming that FCHO1 binds clathrin directly or that the same assay measured AP-2 activation.
    supported_by:
    - reference_id: PMID:22484487
- index: 28
  source_annotation:
    term:
      id: GO:0048268
      label: clathrin coat assembly
    evidence_type: IMP
    original_reference_id: PMID:20448150
    qualifier: involved_in
  review:
    summary: FCHO1 contributes to assembly of endocytic clathrin coats.
    action: ACCEPT
    reason: The 2010 supplement contains FCHO1-specific knockdown and untagged-expression comparisons, in addition
      to combined FCHo1/2 manipulations and predominantly FCHo2 main-paper experiments. Independent 2012 domain
      interactions and 2020 wild-type-versus-variant coat dynamics support human FCHO1 as a membrane-associated
      organizer that helps assemble coats. The 2012 persistence of coats after FCHO1/2 depletion limits universal
      obligatory-nucleator wording, not this positive participation claim. The 2010 report has a verified 2025 Expression
      of Concern and subsequent Erratum; their bodies and affected-experiment/resolution scope were unavailable.
    supported_by:
    - reference_id: PMID:20448150
    - reference_id: PMID:22484487
    - reference_id: PMID:32098969
    - reference_id: PMID:39847650
    - reference_id: PMID:41232007
- index: 29
  source_annotation:
    term:
      id: GO:0048268
      label: clathrin coat assembly
    evidence_type: IMP
    original_reference_id: PMID:32098969
    qualifier: involved_in
  review:
    summary: Human FCHO1 organizes productive clathrin-coated-pit formation.
    action: ACCEPT
    reason: The 2020 Results and Figure 3 compare wild-type human FCHO1 with patient-associated variants in FCHO1-deficient
      cells carrying endogenously tagged clathrin. Wild-type FCHO1 tracks productive coat formation, whereas the
      tested variants fail to show the same behavior. Together with its established membrane and coat-partner interactions,
      this demonstrates an organizing contribution rather than merely a downstream requirement. It does not establish
      universal dependence of all clathrin-mediated traffic on FCHO1.
    supported_by:
    - reference_id: PMID:32098969
    - reference_id: PMID:22484487
- index: 30
  source_annotation:
    term:
      id: GO:0050852
      label: T cell receptor signaling pathway
    evidence_type: IMP
    original_reference_id: PMID:32098969
    qualifier: involved_in
  review:
    summary: FCHO1 supports T-cell-receptor signaling through context-dependent receptor trafficking.
    action: KEEP_AS_NON_CORE
    reason: The 2020 human Jurkat study links FCHO1 loss and wild-type rescue to receptor internalization and receptor-triggered
      calcium responses. The same paper did not establish direct FCHO1–CD3 binding and leaves the detailed coupling
      between trafficking and signal strength unresolved. Retain the positive signaling annotation as a cellular
      context of the endocytic organizer, rather than an independently demonstrated receptor-proximal catalytic
      or signaling-adaptor activity.
    supported_by:
    - reference_id: PMID:32098969
- index: 31
  source_annotation:
    term:
      id: GO:0050870
      label: positive regulation of T cell activation
    evidence_type: IMP
    original_reference_id: PMID:32098969
    qualifier: involved_in
  review:
    summary: FCHO1 positively supports activation of human T cells.
    action: KEEP_AS_NON_CORE
    reason: The 2020 study reports reduced activation responses in patient T cells and complementary FCHO1-dependent
      receptor-trafficking/signaling results in human cells. These support the positive regulatory annotation in
      its immune-cell context. The molecular role resolved here is endocytic organization; the data do not establish
      a separate activation-specific biochemical activity or a single universal mechanism for all cytokine responses.
    supported_by:
    - reference_id: PMID:32098969
- index: 34
  source_annotation:
    term:
      id: GO:0072583
      label: clathrin-dependent endocytosis
    evidence_type: IMP
    original_reference_id: PMID:20448150
    qualifier: involved_in
  review:
    summary: FCHO1 participates in clathrin-dependent endocytosis.
    action: ACCEPT
    reason: The 2010 supplement reports human FCHO1-specific perturbation and expression effects alongside combined
      FCHo1/2 experiments. Independent 2012 human FCHO1 membrane/coat interactions and 2020 receptor-internalization
      data support a physical organizing contribution to this pathway. Preserved uptake in other cargo and cell
      contexts limits claims of universal essentiality, not participation. The 2010 report has a verified 2025 Expression
      of Concern and subsequent Erratum; their bodies and affected-experiment/resolution scope were unavailable.
    supported_by:
    - reference_id: PMID:20448150
    - reference_id: PMID:22484487
    - reference_id: PMID:32098969
    - reference_id: PMID:39847650
    - reference_id: PMID:41232007
- index: 35
  source_annotation:
    term:
      id: GO:0072583
      label: clathrin-dependent endocytosis
    evidence_type: IMP
    original_reference_id: PMID:32098969
    qualifier: involved_in
  review:
    summary: Human FCHO1 contributes to cargo-dependent clathrin-mediated endocytosis.
    action: ACCEPT
    reason: The 2020 study combines human FCHO1 coat-dynamics imaging with receptor-internalization comparisons
      and wild-type rescue. It also reports preserved transferrin uptake in patient fibroblasts, demonstrating that
      the dependency varies with cargo and cell context. FCHO1’s membrane and coat-partner organization supplies
      a direct structural contribution to the pathway; the annotation does not assert universal necessity or direct
      recognition of CD3.
    supported_by:
    - reference_id: PMID:32098969
    - reference_id: PMID:22484487
