  review:
    summary: The variant-interaction dataset retains the FCHO1–PTK6 pair and supports protein tyrosine kinase
      binding.
    action: MODIFY
    reason: PMID:31515488 Supplementary Data 2, worksheet row 3437, joins FCHO1 GeneID 23149/O14526,E423G to
      PTK6 GeneID 5753 with Disruption=0. The original compares variant interactions with wild-type interactions
      in the Y2H framework. Together with the exact target/partner identities, this supports GO:1990782 protein
      tyrosine kinase binding. The non-disruption call is specific to the tested variant and interaction; it
      does not establish kinase regulation, phosphorylation, physiological localization, or equivalent activity
      of all natural splice products. The inspected Supplementary Data 6 has no FCHO1 PCA retest row.
    proposed_replacement_terms:
    - id: GO:1990782
      label: protein tyrosine kinase binding
