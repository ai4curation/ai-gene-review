  review:
    summary: The human interactome screen supports a FCHO1–LGALS14 interaction without establishing a more
      specific FCHO1 molecular function.
    action: KEEP_AS_NON_CORE
    reason: PMID:25416956 Table S2G, worksheet row 9693, records FCHO1 GeneID 23149 with LGALS14 GeneID 56891,
      independently joined to source partner Q8TCE9 by official UniProt metadata. Retain this positive binary-screen
      evidence as non-core under the project binding exception. Binding a galectin does not establish carbohydrate
      binding, galectin-complex membership or an endocytic role for this pair. No more specific GO binding
      class was established from the saved assay evidence and bounded official term search; no physiological
      or product-specific mechanism is inferred.
    supported_by:
