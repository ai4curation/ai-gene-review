    summary: The human interactome screen supports a FCHO1–EXOSC5 interaction without establishing exosome
      activity for FCHO1.
    action: KEEP_AS_NON_CORE
    reason: PMID:25416956 Table S2G, worksheet row 9694, records FCHO1 GeneID 23149 with EXOSC5 GeneID 56915,
      independently joined to source partner Q9NQT4. Retain the positive protein-binding observation as non-core.
      Identification of the partner as an RNA-exosome component does not show that FCHO1 binds the assembled
