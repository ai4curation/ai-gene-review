  review:
    summary: The human interactome screen supports FCHO1 binding to protein-tyrosine kinase PTK6.
    action: MODIFY
    reason: PMID:25416956 Table S2G, worksheet row 4771, explicitly records PTK6 GeneID 5753 with FCHO1 GeneID
      23149. Official UniProt metadata maps PTK6 to the source partner Q13882 and identifies it as a protein-tyrosine
      kinase. The original reports pairwise retesting of positive screen pairs. GO:1990782 protein tyrosine
      kinase binding is the supported specific binding class. This does not assign kinase activity to FCHO1,
      establish phosphorylation of FCHO1, or infer kinase activation/inhibition. No target-specific orthogonal
      validation is claimed from the dataset-wide controls or from the domain-pair analysis in Table S2F.
    proposed_replacement_terms:
    - id: GO:1990782
      label: protein tyrosine kinase binding
    supported_by:
    - reference_id: PMID:25416956
