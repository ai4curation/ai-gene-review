    - reference_id: PMID:10339406
      supporting_text: hTim23 is organized into two distinct complexes in the inner membrane, one
        containing hTim17a and one containing hTim17b.
      reference_section_type: ABSTRACT
    - reference_id: file:human/TIMM23/TIMM23-uniprot.txt
      record_section: ["CC:SUBUNIT"]
      reference_section_type: DATABASE_ENTRY
      supporting_text: Component of the TIM23 complex at least composed of TIMM23, TIMM17 (TIMM17A
