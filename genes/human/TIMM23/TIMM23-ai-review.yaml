- term:
    id: GO:0061734
    label: type 2 mitophagy
  evidence_type: IMP
  original_reference_id: PMID:37160114
  qualifier: involved_in
  review:
    summary: Supported as a non-core stress-response role. TIMM23 can help PINK1 accumulate during depolarization-linked mitophagy, but its primary function is TIM23 presequence translocase protein import.
    action: KEEP_AS_NON_CORE
    reason: >-
      Mutant-phenotype evidence on the target: TIM23 downregulation lowers PINK1 levels and delays its
      autophosphorylation, and inactivating OMA1 reverses that loss, so TIMM23 contributes to PINK1
      accumulation by shielding it from OMA1. Kept as non-core because this is a stress-specific role
      in depolarised mitochondria, separable in principle from the constitutive presequence-import
      function, and because the step TIMM23 performs is protection of a partner rather than the
      mitophagy machinery itself.
    additional_reference_ids:
    - file:human/TIMM23/TIMM23-deep-research-falcon.md
    supported_by:
    - reference_id: file:human/TIMM23/TIMM23-uniprot.txt
      record_section: ["CC:FUNCTION"]
      reference_section_type: DATABASE_ENTRY
      supporting_text: Has a role in the activation of stress-induced mitophagy by protecting PINK1
        from OMA1-mediated degradation and facilitating its accumulation at the outer mitochondrial
        membrane in response to depolarization
    - reference_id: PMID:37160114
      supporting_text: TIM23 downregulation decreases PINK1 levels and significantly delays autophosphorylation,
        indicating that TIM23 promotes PINK1 accumulation in response to depolarization.
      reference_section_type: ABSTRACT
