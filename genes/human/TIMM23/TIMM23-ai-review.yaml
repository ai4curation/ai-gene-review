id: O14925
gene_symbol: TIMM23
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: TIMM23 encodes an essential inner mitochondrial membrane core subunit of the TIM23 presequence translocase. Together with TIMM17A/B and TIMM50, it supports import of nuclear-encoded, presequence-containing mitochondrial proteins into the matrix and lateral insertion of selected inner-membrane proteins; it also has a supported non-core role in PINK1-linked stress-induced mitophagy.
existing_annotations:
- term:
    id: GO:0030150
    label: protein import into mitochondrial matrix
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: Correct and core. TIMM23-containing TIM23 translocase imports presequence-containing proteins into the mitochondrial matrix.
    action: ACCEPT
    reason: >-
      The ancestral node is the Tim17/Tim22/Tim23 family branch for the presequence translocase, and
      the inheritance is confirmed on the target: the human Tim23 cloning paper shows that matrix
      translocation requires Tim23 together with Tim17 and Tim44, and hTim23 was functionally analysed
      in that work. TIMM23 performs part of the translocation step itself rather than being merely
      required for it, so the process is core.
    additional_reference_ids:
    - file:human/TIMM23/TIMM23-deep-research-falcon.md
    supported_by:
    - reference_id: file:human/TIMM23/TIMM23-deep-research-falcon.md
      supporting_text: Most mitochondrial proteins are nuclear encoded and must be imported into mitochondria. The **TIM23 complex** (also called the **presequence translocase**) is the major inner-membrane translocase for **presequence-containing precursor proteins**, handling a large fraction of mitochondrial protein biogenesis.
    - reference_id: PMID:10339406
      supporting_text: translocation of preproteins into the matrix requires the membrane proteins
        Tim23, Tim17 and Tim44, which drive translocation in cooperation with mtHsp70 and its co-chaperone
        Mge1p
      reference_section_type: ABSTRACT
- term:
    id: GO:0005744
    label: TIM23 mitochondrial import inner membrane translocase complex
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: part_of
  review:
    summary: Correct. TIMM23 is a core component of the TIM23 mitochondrial inner-membrane presequence translocase complex.
    action: ACCEPT
    reason: >-
      Complex membership inherited from the Tim23 clade and directly established for the human
      protein: hTim23 is found in two distinct inner-membrane complexes with hTim17a or hTim17b, and
      UniProt records the TIMM23/TIMM17/TIMM50 composition with a direct TIMM50 contact. A
      mass-spectrometric definition of the human TIM23 complex has since been published.
    additional_reference_ids:
    - file:human/TIMM23/TIMM23-deep-research-falcon.md
    supported_by:
    - reference_id: file:human/TIMM23/TIMM23-deep-research-falcon.md
