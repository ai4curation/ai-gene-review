- id: PMID:10339406
  title: Genetic and structural characterization of the human mitochondrial inner membrane translocase.
  findings:
  - statement: >-
      The human homologues of Tim17, Tim23 and Tim44 were cloned and functionally analysed; matrix
      translocation of preproteins requires Tim23 together with Tim17 and Tim44 acting with mtHsp70
      and Mge1p.
    supporting_text: >-
      translocation of preproteins into the matrix requires the membrane proteins Tim23, Tim17 and
      Tim44, which drive translocation in cooperation with mtHsp70 and its co-chaperone Mge1p
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: >-
      hTim23 resolves into two distinct inner-membrane complexes of 110 kDa native mass, one
      containing hTim17a and one hTim17b, which establishes both the inner-membrane location and the
      TIM23 complex membership of the human protein.
    supporting_text: >-
      hTim23 is organized into two distinct complexes in the inner membrane, one containing hTim17a
      and one containing hTim17b.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
- id: PMID:14726512
  title: Organization and function of the small Tim complexes acting along the import pathway of metabolite carriers into mammalian mitochondria.
  findings:
  - statement: >-
      The human small Tim complexes of the TIM22 carrier pathway are tightly associated with the
      inner membrane. The paper's subject is that pathway rather than TIM23, and its abstract does
      not mention Tim23, so whatever supports the TIMM23 inner-membrane TAS row is in the full text,
      which is not cached.
    supporting_text: >-
      Both human complexes are tightly associated with the inner membrane
    reference_section_type: ABSTRACT
    full_text_unavailable: true
- id: PMID:15044455
  title: Tim50, a component of the mitochondrial translocator, regulates mitochondrial integrity and cell death.
  findings:
  - statement: >-
      Human Tim50, an inner-membrane protein with phosphatase activity, is present in a complex with
      human Tim23; in yeast the two together regulate translocation of presequence-containing
      proteins across the inner membrane.
    supporting_text: >-
      We demonstrate that human Tim50 possesses phosphatase activity and is present in a complex
      with human Tim23.
    reference_section_type: ABSTRACT
- id: PMID:20053669
  title: Role of Magmas in protein transport and human mitochondria biogenesis.
  findings:
  - statement: >-
      Magmas forms a stable subcomplex with the J-proteins Pam18/DnaJC19 that is tethered to the
      TIM23 complex in both yeast and humans, and mutations destabilising it cause protein
      translocation defects.
    supporting_text: >-
      Magmas forms a stable subcomplex with J-protein Pam18 or DnaJC19 through its C-terminal region
      and is tethered to TIM23 complex of yeast and humans.
    reference_section_type: ABSTRACT
- id: PMID:23260140
  title: MITRAC links mitochondrial protein translocation to respiratory-chain assembly and translational regulation.
  findings:
  - statement: >-
      TIM21, a subunit of the inner-membrane presequence translocase, is also present in the MITRAC
      respiratory-chain assembly intermediates, establishing a link between the TIM23 transport
      machinery and respiratory-chain assembly.
    supporting_text: >-
      We establish an unexpected molecular link between the TIM23 transport machinery and assembly
      of respiratory-chain complexes
    reference_section_type: ABSTRACT
    full_text_unavailable: true
- id: PMID:23263864
  title: Methylation-controlled J-protein MCJ acts in the import of proteins into human mitochondria.
  findings:
  - statement: >-
      The J-protein MCJ/DNAJC15 and MAGMAS interact with the core components of the TIM23
      pre-protein translocase, and MCJ acts as the J co-chaperone of the human import motor.
    supporting_text: >-
      MCJ and MAGMAS interact with the core components of the TIM23 pre-protein translocase
    reference_section_type: ABSTRACT
    full_text_unavailable: true
- id: PMID:25997101
  title: QIL1 is a novel mitochondrial protein required for MICOS complex stability and cristae morphology.
  findings:
  - statement: >-
      This is the study UniProt cites as the subcellular-location reference for O14925, so the
      curated Mitochondrion inner membrane statement for TIMM23 traces to its quantitative
      proteomics of the MICOS complex and cristae junctions.
    supporting_text: >-
      Using quantitative proteomics, we show that loss of QIL1 resulted in MICOS disassembly
    reference_section_type: ABSTRACT
- id: PMID:30598479
  title: ROMO1 is a constituent of the human presequence translocase required for YME1L protease import.
  findings:
  - statement: >-
      The constituents of the human TIM23 complex were defined by mass spectrometry in this study,
      which also identified ROMO1 as a new, short-lived translocase constituent required for import
      of the YME1L protease.
    supporting_text: >-
      we define the constituents of the human TIM23 complex using mass spectrometry and identified
      ROMO1 as a new translocase constituent with an exceptionally short half-life
    reference_section_type: ABSTRACT
- id: PMID:32296183
  title: A reference map of the human binary protein interactome.
  findings: []
- id: PMID:32814053
  title: Interactome Mapping Provides a Network of Neurodegenerative Disease Proteins and Uncovers Widespread Protein Aggregation in Affected Brains.
  findings: []
- id: PMID:34800366
  title: Quantitative high-confidence human mitochondrial proteome and its dynamics in cellular context.
  findings:
  - statement: >-
      MitoCoP, the high-confidence human mitochondrial proteome of 1,134 protein-coding genes, was
      built from purified mitochondria by subtractive and spatial proteomics, importomics and
      curation; membership of this set is what the HTP mitochondrion annotation rests on, and it
      resolves organelle membership only.
    supporting_text: >-
      we combined subtractive proteomics, spatial proteomics, mitochondria-specific importomics, and
      literature/database curation by stringent criteria. We defined a human mitochondrial
      high-confidence proteome (MitoCoP) of 1,134 protein-coding genes
    reference_section_type: RESULTS
- id: PMID:37160114
  title: TIM23 facilitates PINK1 activation by safeguarding against OMA1-mediated degradation in damaged mitochondria.
  findings:
  - statement: >-
      Mass spectrometry of PINK1 co-immunoprecipitates identified the inner membrane protein TIM23
      as a component of the PINK1 complex.
    supporting_text: >-
      we identify the inner membrane protein TIM23 as a component of the PINK1 complex
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: >-
      TIM23 downregulation lowers PINK1 levels and delays its autophosphorylation, and inactivating
      the protease OMA1 reverses that loss, so TIM23 promotes PINK1 accumulation on depolarisation by
      safeguarding it from OMA1.
    supporting_text: >-
      TIM23 downregulation decreases PINK1 levels and significantly delays autophosphorylation,
      indicating that TIM23 promotes PINK1 accumulation in response to depolarization.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
- id: file:human/TIMM23/TIMM23-deep-research-falcon.md
  title: Falcon deep research report for human TIMM23
  findings:
  - statement: >-
      The provider report describes TIMM23 as an essential core subunit of the TIM23 presequence
      translocase while noting that recent structural work places the dominant translocation cavity
      on the Tim17-family subunits; this is the distinction the GO:0008320 rows turn on.
    supporting_text: >-
      **TIMM23 is essential** within the TIM23 presequence translocase core, but **Tim17-family
      proteins** appear to provide the dominant **translocation cavity** driven by conserved
      electrostatics (negative charges).
    reference_section_type: OTHER
