- term:
    id: GO:0008320
    label: protein transmembrane transporter activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: Accepted as TIMM23 contribution to TIM23-dependent protein translocation across the mitochondrial inner membrane. TIMM23 is essential in the translocase core, even though recent structural work emphasizes Tim17-family subunits as the dominant translocation cavity.
    action: ACCEPT
    reason: >-
      The activity is a contribution to translocation by the assembled translocase rather than a
      property of TIMM23 alone, which is why recent structural work placing the translocation cavity
      on the Tim17-family subunits does not invalidate it: TIMM23 is an essential core subunit of the
      machine that performs the transport, and UniProt states that the complex mediates translocation
      across the inner membrane.
    additional_reference_ids:
    - file:human/TIMM23/TIMM23-deep-research-falcon.md
    supported_by:
    - reference_id: file:human/TIMM23/TIMM23-deep-research-falcon.md
      supporting_text: '**TIMM23 is essential** within the TIM23 presequence translocase core, but **Tim17-family proteins** appear to provide the dominant **translocation cavity** driven by conserved electrostatics (negative charges).'
    - reference_id: file:human/TIMM23/TIMM23-uniprot.txt
      record_section: ["CC:FUNCTION"]
      reference_section_type: DATABASE_ENTRY
      supporting_text: Essential component of the TIM23 complex, a complex that mediates the translocation
        of transit peptide-containing proteins across the mitochondrial inner membrane
