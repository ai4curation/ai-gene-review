  review:
    summary: The CG-1 domain belongs to a DNA-binding transcriptional regulator; the generic DNA-binding
      mapping can be refined.
    action: MODIFY
    reason: 'InterPro-derived DNA binding is consistent with the conserved CG-1 domain in human
      Q9Y6Y1. Human CAMTA1 activates a LexA-tethered yeast reporter (PMID:11925432), while mammalian
      CAMTA motif and mutagenesis experiments support DNA-dependent regulation (PMID:25049392).
      The full primary study PMID:34499028 adds native in vivo family evidence: CRISPR-tagged C.
      elegans CAMT-1a occupies three cmd-1 promoter regions by ChIP-seq, and deleting all three
      regions produces behavioral defects rescued by neuronal CMD-1 expression. This joins promoter
      occupancy to cis-regulatory function, complementing the conserved CG-1 domain and mammalian
      DNA-recognition evidence. ChIP occupancy alone does not resolve direct nucleotide contacts,
      and the worm experiments are not human promoter-specificity assays. Together these findings
      support refinement to DNA-binding transcription factor activity for human CAMTA1. This gene-level
      refinement is not a proposal to remap every IPR005559-containing protein solely from domain
      occurrence.'
    supported_by:
    - reference_id: UniProt:Q9Y6Y1
    - reference_id: PMID:11925432
      supporting_text: 'Two human

        proteins designated HsCAMTA1 and HsCAMTA2 were also shown to activate

        transcription in yeast'
    - reference_id: PMID:25049392
    - reference_id: PMID:34499028
      supporting_text: CAMT-1 directly activates calmodulin expression by binding multiple sites
        in the cmd-1 promoter
    proposed_replacement_terms:
