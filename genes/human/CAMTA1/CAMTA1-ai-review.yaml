  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The normal abstract and PubMed identity were checked. Human intragenic CAMTA1
      rearrangements establish the congenital-ataxia/intellectual-disability association. This
      is disease and loss-of-function evidence rather than a direct biochemical assay. Clinical
      non-progression does not imply anatomically static MRI findings. Full text was not retrieved.
- id: UniProt:Q9Y6Y1
  title: 'UniProtKB Q9Y6Y1: Calmodulin-binding transcription activator 1 (Homo sapiens)'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The normal retrieved human record was inspected for identity, sequence, four
      alternative products, functional comments, subcellular assignments and domain features.
      Curator inferences and predicted motifs are distinguished from direct experiments.
- id: PMID:34499028
  title: Neuronal calmodulin levels are controlled by CAMTA transcription factors.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The complete cached Introduction, Results with figure captions, Discussion
      and Methods were read. C. elegans CAMT-1a ChIP-seq with input/mock controls identifies
      three cmd-1 promoter regions; CRISPR deletion of all three, but not the tested partial
      deletions, produces defects rescued by neuronal CMD-1. This supplies in vivo CAMTA family
      evidence, not a direct human CAMTA1 binding assay or the exact PAINT IBD. Drosophila CaM-expression
      experiments are separate. The 2024 eLife correction (doi:10.7554/eLife.104114), read externally,
      adds an author for fly retinal imaging and does not revise the promoter-binding experiments.
core_functions:
- description: Recognizes regulatory DNA through the conserved CG-1 domain and activates transcription
    in the nucleus. Human transactivation and mammalian CAMTA DNA-recognition evidence jointly
    support this activity; the native human target repertoire remains incompletely defined.
