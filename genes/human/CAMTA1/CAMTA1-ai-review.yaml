  label: Homo sapiens
description: CAMTA1 is a nuclear transcriptional regulator containing a CG-1 DNA-binding domain,
  a TIG domain, ankyrin repeats and C-terminal IQ motifs. Its conserved DNA-recognition and transcription-activation
  functions support regulation of neuronal gene expression. Human CAMTA1 has transcriptional activation
  capacity, and loss-of-function rearrangements cause congenital cerebellar ataxia with or without
  intellectual disability. Mouse studies connect Camta1 deficiency to impaired Purkinje-cell maintenance
  and cerebellar degeneration. Human cell experiments also implicate CAMTA1 in positive regulation
  of calcineurin-NFAT signaling, although the intervening molecular mechanism remains unresolved.
