  review:
    summary: CAMTA1 positively affects NFAT signaling in the tested human cell system.
    action: KEEP_AS_NON_CORE
    reason: 'The original full-text study directly tests CAMTA1: its knockdown decreases stimulated
      NFAT reporter output in 293A cells and c-Myc-tagged NFATc2 dephosphorylation in 293T cells. This supports the existing
      perturbation-based positive-regulation assertion, although the molecular link to calcineurin-NFAT
      remains undefined. The paper separately examines miR-124 and its multiple targets in human
      pulmonary artery smooth-muscle cells; those miRNA phenotypes are not assigned wholesale
      to CAMTA1. Retain this contextual signaling role outside the central DNA-dependent transcriptional
      activity.'
