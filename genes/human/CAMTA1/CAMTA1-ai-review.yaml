  review:
    summary: The inherited transcription-coregulator assertion remains plausible, but its distinct
      partner-mediated mechanism is unresolved.
    action: UNDECIDED
    reason: 'GO:0003712 denotes transcriptional regulation through a DNA-binding transcription-factor
      partner at a genomic locus; it is distinct from intrinsic DNA-binding transcription-factor
      activity. The full primary worm CAMT-1 study was inspected: native cmd-1 promoter occupancy
      and promoter-region deletions support CAMTA-dependent transcription (PMID:34499028), but do
      not establish a separate partner-mediated mechanism in human CAMTA1. This is relevant experimental
      family evidence, not a reconstruction of this row''s PAINT IBD. The frozen coregulator row
      lists PTN000596526, PomBase:SPAC26H5.05 and UniProtKB:O94983; the worm identifier occurs in
      other CAMTA1 IBA rows, not this row. A CAMTA can possess both intrinsic DNA-binding activity
      and an additional partner-mediated function, so promoter occupancy does not contradict coregulation.
      The exact ancestral placement and applicability of a distinct partner mechanism to human CAMTA1
      remain unresolved; retain UNDECIDED without inferring target loss or a propagation error.'
