    review_notes: >-
      Although primarily a biochemical study of paralog ACCS, includes dedicated
      phylogenetic, AlphaFold2 active-site modeling, and surrogate mutagenesis
      analyses (hACCS R457C and R351Y) directly addressing human ACCSL (Q4AC99).
  findings:
  - statement: >-
      Mammalian ACCSL likely evolved by tandem duplication of ACCS, and human
      ACCSL (Q4AC99) uniquely replaces the conserved substrate
      alpha-carboxylate-binding arginine with Cys529 while sharing Tyr423 and
      Ser273 active-site differences relative to human ACCS.
    supporting_text: >-
      As depicted in Figure 8, the overall active site structure of hACCSL is
      very similar to hACCS with only three residues differing: C529, Y423, and
      S273.
