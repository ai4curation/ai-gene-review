suggested_questions:
- question: >-
    Does purified human ACCSL—and specifically the ancestral-like Arg529 human
    variant (rs2074051)—covalently bind PLP at Lys395 or retain residual
    enzymatic activity when Tyr423 occupies the partner-subunit pocket?
  experts:
  - Yang Hai
- question: >-
    Can human ACCSL form heterodimers with co-localized paralog ACCS to modulate
    ACCS C-beta-S lyase activity in cells where both paralogs are expressed?
  experts:
  - Yang Hai
suggested_experiments:
- hypothesis: >-
    Reference human ACCSL (Cys529/Tyr423) lacks C-beta-S lyase turnover even if
    supplemented with PLP, whereas the common rs2074051 Arg529 variant restores
    alpha-carboxylate ligand docking while remaining impaired on bulky cysteine
    S-conjugate sulfoxides due to Tyr423.
  description: >-
    Purify recombinant human ACCSL-Cys529, ACCSL-Arg529, and ACCSL-K395A from
    Saccharomyces cerevisiae, measure bound PLP stoichiometry by UV-vis alkaline
    release and mass spectrometry, and screen amino-acid / thiol-conjugate
    libraries by differential scanning fluorimetry and LC-MS.
  experiment_type: Recombinant protein biochemistry and ligand screening
