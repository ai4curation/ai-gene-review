core_functions:
- description: >-
    Uncharacterized fold-type I PLP-dependent enzyme-like paralog (putative
    pseudoenzyme) that preserves Lys395, Asp358, and Trp207 of ancestral ACCS
    while substituting Cys529 (polymorphic rs2074051 p.Cys529Arg) and Tyr423 at
    substrate-orienting active-site positions; whether it binds PLP, acts as a
    non-catalytic regulator, or turns over unrecognized substrates remains
    undetermined (PMID:39876065).
  supported_by:
  - reference_id: PMID:39876065
    supporting_text: >-
      In light of these two “loss-of-function” substitutions (i.e. C529 and
      Y423) naturally found in hACCSL, we hypothesize that hACCSL is either a
      pseudoenzyme as predicted, or it possess a totally different function and
      recognizes substrates different from what we used in this study, a
      phenomenon known for some psuedokinases.[33]
  - reference_id: file:human/ACCSL/ACCSL-deep-research-affinage.md
    supporting_text: No mechanistic discoveries found in literature.
knowledge_gaps:
- gap_statement: >-
    It is unknown whether human ACCSL (both reference Cys529 and common human
    Arg529 allele rs2074051) covalently binds pyridoxal 5'-phosphate at Lys395,
    functions as a non-catalytic pseudoenzyme regulator (potentially
    heterodimerizing with ACCS), or catalyzes an unrecognized reaction, and its
    subcellular localization and biological role in human germline and somatic
    cells are completely uncharacterized.
  boundary: >-
    Chromosomal synteny with ACCS on 11p11.2, retention of Lys395/Asp358/Trp207,
    and active-site divergence at Cys529, Tyr423, and Ser273—together with
    100-fold and ~40-fold activity losses in surrogate hACCS R457C and R351Y
    mutants—are established (PMID:39876065), whereas direct biochemical,
    localization, and genetic data on ACCSL itself are absent.
  gap_kind:
  - BIOLOGY
  dark_aspect: WHOLLY_DARK
  status: OPEN
  significance: >-
    Human ACCSL is classified as a Pharos Tdark protein and segregates a coding
    polymorphism (rs2074051, p.Cys529Arg) that restores the canonical fold-type
    I substrate-anchoring arginine conserved in non-human mammals, raising the
    possibility of allele-dependent enzymatic or regulatory activity in humans.
  resolution: >-
    Express and purify recombinant human ACCSL-Cys529 and ACCSL-Arg529 alongside
    K395A, quantify UV-vis/LC-MS PLP stoichiometry, test homo- and
    ACCS-heterodimerization, and profile metabolite turnover and germline
    subcellular localization.
  provenance:
  - reference_id: PMID:39876065
    supporting_text: >-
      Direct biochemical characterization of hACCSL in vitro would answer this
      question in the future;
  - reference_id: file:human/ACCSL/ACCSL-deep-research-affinage.md
    supporting_text: No mechanistic discoveries found in literature.
