id: Q4AC99
gene_symbol: ACCSL
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  Probable inactive 1-aminocyclopropane-1-carboxylate synthase-like protein 2
  (ACCSL) is a 568-residue fold-type I pyridoxal 5'-phosphate-dependent
  aminotransferase-like protein encoded on human chromosome 11p11.2 immediately
  adjacent to its ancestral paralog ACCS (50% amino-acid identity), from which
  it arose via mammalian-specific tandem gene duplication. Assigned to the
  eutherian clade PTHR43795:SF1, ACCSL preserves the core fold-type I
  Schiff-base lysine (Lys395), pyridinium-stabilizing aspartate (Asp358), and
  pocket tryptophan (Trp207), but carries two natural active-site substitutions
  at positions required for ACCS cysteine S-conjugate sulfoxide beta-lyase
  catalysis: Cys529 in place of the substrate alpha-carboxylate-anchoring
  arginine (Arg457 in ACCS; polymorphic in humans via rs2074051 p.Cys529Arg) and
  Tyr423 in place of the cationic inter-subunit pocket arginine (Arg351 in
  ACCS). Because engineering the corresponding R457C and R351Y substitutions
  into human ACCS reduces enzymatic activity by ~100-fold and ~40-fold, ACCSL
  may function either as a pseudoenzyme or on an unrecognized class of
  substrates; its cofactor occupancy, biochemical activity, subcellular
  localization, and physiological role in germline and somatic tissues remain
  experimentally uncharacterized.
