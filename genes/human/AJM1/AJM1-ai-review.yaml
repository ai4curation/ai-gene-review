gene_symbol: AJM1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'AJM1 (apical junction component 1 homolog, formerly C9orf172) is a 976-residue human protein
  carrying the diagnostic domains of the AJM-1 family (Ajm-1, AJM1_C and a shared apical-junction signature)
  and no catalytic or transporter domain, so it is expected to act structurally rather than enzymatically.
  It is named for, and inferred from, the Caenorhabditis elegans protein AJM-1, a large coiled-coil component
  of the nematode apical junction that occupies a domain basal to the cadherin-catenin complex, is recruited
  there by the MAGUK scaffold DLG-1 together with LET-413/Scribble, and is required for the integrity
  of that junctional domain. On that basis human AJM1 is expected to localise to the apical plasma membrane
  and to cell-cell junctions and to contribute to organising them, most plausibly as a scaffolding or
  adapter component rather than as a signalling or catalytic one. This expectation is untested: the protein
  has no experimental characterisation of its own, no reported binding partners, no endogenous localisation
  study, and no established physiological or disease role in humans, and nematode and vertebrate apical
  junctions are not assembled from the same components, so conservation of the specific structural role
  remains an open question rather than an established fact.'
