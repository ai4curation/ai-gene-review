  review:
    summary: Cilium. The only row with no experimental support anywhere in its chain, and the one ciliary
      claim that IS experimental in the worm was scoped by its own authors to nematodes.
    action: REMOVE
    reason: 'Context that applies to this whole gene: human AJM1 has NO experimental GO annotation of
      any kind, and seven of its eight rows trace to a single worm protein, C. elegans ajm-1 (UniProtKB:A0A1C3NSL9
      / WB:WBGene00000100). That single point of origin is easy to miss, because the set looks diverse
      - three evidence codes across four GO_REFs. But the three UniProt SubCell IEAs are second-order:
      UniProt made an ISS from the worm [file:genes/human/AJM1/AJM1-uniprot.txt "SUBCELLULAR LOCATION:
      Apical cell membrane"], every location in that entry carrying ECO:0000250|UniProtKB:A0A1C3NSL9,
      and the SubCell-to-GO mapping then re-emitted them as IEA. Only the InterPro row (IPR038825) is
      independent of the worm gene, and it is family-domain based rather than experimental. This row is
      different in kind from the rest and does not survive. Trace it: human IEA comes from UniProt SubCell,
      which comes from UniProt''s by-similarity cilium statement [file:genes/human/AJM1/AJM1-uniprot.txt
      "SUBCELLULAR LOCATION: Apical cell membrane"] citing worm ajm-1 - and the WORM''s own GO:0005929
      is ITSELF only IEA (GO_REF:0000044), not experimental. So the chain is inference on inference with
      no measurement at any step. The worm does have one experimentally grounded ciliary annotation, GO:0036064
      ciliary basal body (IDA), but it comes from a study that explicitly confines the AJM-1 mechanism
      to nematodes [PMID:27623382 "C. elegans Girdin also regulates localization of the apical junction
      component AJM-1, suggesting that in nematodes Girdin may position BBs via rootletin- and AJM-1-dependent
      anchoring to the cytoskeleton and plasma membrane, respectively."] while reserving the conserved
      claim for Girdin, not AJM-1 [PMID:27623382 "Together, our results describe a conserved role for
      Girdin in BB positioning and ciliogenesis."]. So the best ciliary evidence in the donor both names
      a different compartment and disclaims transfer to vertebrates. Removing an unsupported IEA here
      is exactly the over-propagated-electronic-inference case CLAUDE.md sanctions; no experimental annotation
      and no curator judgement is being overruled.'
    additional_reference_ids:
    - PMID:27623382
    - file:genes/human/AJM1/AJM1-uniprot.txt
    supported_by:
    - reference_id: PMID:27623382
      supporting_text: C. elegans Girdin also regulates localization of the apical junction component
        AJM-1, suggesting that in nematodes Girdin may position BBs via rootletin- and AJM-1-dependent
