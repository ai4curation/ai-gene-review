      to cover both, defining the complex as the vertebrate tight junction/zonula adherens/desmosome unit
      AND the invertebrate subapical complex/zonula adherens/septate junction unit. So the term is deliberately
      cross-lineage and the objection does not stand. The donor evidence is strong - two IDAs on worm
      ajm-1 - and the node placement is sound [PMID:11715019 "AJM-1 controls the integrity of a distinct
      apical junctional domain in C. elegans"]. There is no evidence of loss or divergence in human AJM1
      to argue against inheritance, which per the IBA guidance is what a challenge would need.'
