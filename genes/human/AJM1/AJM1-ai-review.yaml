- id: PMID:11715019
  title: Cooperative regulation of AJM-1 controls junctional integrity in Caenorhabditis elegans epithelia.
  findings:
  - statement: Worm AJM-1 is a coiled-coil protein of a junctional domain basal to the cadherin-catenin
      complex - the founding characterisation and the source of the donor's IDA annotations.
    supporting_text: We have characterized the novel coiled-coil protein AJM-1, which localizes to an
      apical junctional domain of Caenorhabditis elegans epithelia basal to the HMR-HMP (cadherin-catenin)
      complex.
  - statement: Loss of AJM-1 compromises the integrity of that junctional domain, which is the loss-of-function
      basis for the cell-cell junction organization transfer.
    supporting_text: In the absence of AJM-1, the integrity of this domain is compromised.
  - statement: The authors' conclusion is explicitly scoped to C. elegans.
    supporting_text: AJM-1 controls the integrity of a distinct apical junctional domain in C. elegans
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Cached record is abstract-only. This is the donor paper for essentially the whole human
      annotation set, so its scope matters: every claim in it is about C. elegans. Cited here as the evidence
      behind the propagations, not as evidence about the human protein.'
- id: PMID:27623382
  title: A Conserved Role for Girdin in Basal Body Positioning and Ciliogenesis.
  findings:
  - statement: The AJM-1-dependent basal body anchoring mechanism is explicitly confined to nematodes
      by the authors.
    supporting_text: C. elegans Girdin also regulates localization of the apical junction component AJM-1,
      suggesting that in nematodes Girdin may position BBs via rootletin- and AJM-1-dependent anchoring
      to the cytoskeleton and plasma membrane, respectively.
  - statement: The conserved claim in this paper is about Girdin, not about AJM-1.
    supporting_text: Together, our results describe a conserved role for Girdin in BB positioning and
      ciliogenesis.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached record is abstract-only. Found by searching the donor's annotations rather than
      the human gene - it is the source of worm ajm-1's only experimental ciliary annotation (GO:0036064
      ciliary basal body, IDA). Decisive for removing the human cilium row, because the authors scope
      the AJM-1 mechanism to nematodes and reserve the conserved claim for Girdin.
- id: file:genes/human/AJM1/AJM1-deep-research-falcon.md
  title: Falcon deep research report for human AJM1
  findings:
  - statement: The report's own verdict is that human AJM1 is poorly characterized and that the junctional
      role is inferred, not validated.
    supporting_text: Human AJM1 is a poorly characterized, probably non-enzymatic protein whose conserved
      domains and nematode ortholog suggest a structural or scaffolding role at cell–cell junctions. Direct
      validation of this role in human cells remains inadequate.
  - statement: It states plainly that most AJM-1 literature concerns the C. elegans ortholog rather than
      the human protein.
    supporting_text: However, **the literature is limited for this specific human protein**. Most detailed
      AJM-1 literature concerns the *Caenorhabditis elegans* ortholog.
  - statement: It flags that mammalian and nematode junctional complexes differ and that functional conservation
      is untested.
    supporting_text: Mammalian junctional complexes differ from the nematode CeAJ; functional conservation
      remains untested.
  - statement: No decisive endogenous localization study of human AJM1 was found.
    supporting_text: no decisive endogenous localization study of human AJM1 was identified
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Fallback provider, used because affinage REFUSED to write a record for this gene: its
      symbol-collision trust gate tripped BLOCKING, and inspection of the quarantined output confirmed
      the gate was right - every claim and every PMID in it described C. elegans AJM-1. That record was
      not written into the gene folder. Falcon, given the same ambiguous symbol, handled it correctly:
      it verified the identity, stated that the human protein is poorly characterized, and kept worm evidence
      explicitly separate from human inference. Its citation keys are internal rather than PMIDs, so it
      is used here for its assessment of the evidence STATE, which is checkable against the file, and
      not as a source of biological claims - those are anchored to PMIDs.'
- id: file:genes/human/AJM1/AJM1-uniprot.txt
  title: UniProtKB C9J069 (AJM1_HUMAN) flat file
  findings:
  - statement: Every subcellular location in the human entry is by similarity to the worm protein, which
      is why the three SubCell-derived IEAs are not independent of the IBA rows.
    supporting_text: 'SUBCELLULAR LOCATION: Apical cell membrane'
  - statement: The function line is hedged and also by similarity.
    supporting_text: 'FUNCTION: May be involved in the control of adherens junction'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Machine-fetched UniProt record. The important detail is the evidence codes: FUNCTION
      and all three SUBCELLULAR LOCATION statements carry ECO:0000250|UniProtKB:A0A1C3NSL9, so they are
      curator inferences from the worm protein, not human observations.'
core_functions:
- description: 'Inferred structural component of epithelial cell-cell junctions. This entry is recorded
    as an inference and should be read as one: human AJM1 has no experimental annotation, no reported
    interaction partner and no endogenous localisation study, so everything below is transferred from
    C. elegans ajm-1 or read off domain architecture. On that basis AJM1 is expected to sit at the apical
    plasma membrane and at cell-cell junctions and to help organise them, acting as a scaffolding or adapter
    component - it carries the AJM-1 family domains and no catalytic or transporter domain, so a non-enzymatic
    structural role is the only reading the sequence supports. No molecular_function term is asserted
    here, deliberately. The worm donor''s only molecular function annotation is cytoskeletal protein binding
    with TAS evidence, which is too weak and too generic to transfer, and inventing a structural-constituent
    term for a protein with zero human data would be the kind of over-annotation this review set exists
    to remove. The honest position is a located, process-level inference with the molecular activity left
    open. The largest open question is not whether AJM1 is junctional but whether the specific nematode
    role transfers at all, since the nematode apical junction and the vertebrate apical junction are not
    built from the same parts.'
