    supporting_text: We have characterized the novel coiled-coil protein AJM-1, which localizes to an
      apical junctional domain of Caenorhabditis elegans epithelia basal to the HMR-HMP (cadherin-catenin)
      complex.
  - reference_id: PMID:11715019
    supporting_text: In the absence of AJM-1, the integrity of this domain is compromised.
  - reference_id: file:genes/human/AJM1/AJM1-deep-research-falcon.md
    supporting_text: Human AJM1 is a poorly characterized, probably non-enzymatic protein whose conserved
      domains and nematode ortholog suggest a structural or scaffolding role at cell–cell junctions. Direct
      validation of this role in human cells remains inadequate.
  - reference_id: file:genes/human/AJM1/AJM1-deep-research-falcon.md
    supporting_text: no decisive endogenous localization study of human AJM1 was identified
proposed_new_terms: []
suggested_questions:
- question: Does human AJM1 localise to epithelial junctions at all? Every location annotation on this
    gene is a by-similarity transfer from one worm protein, and a single endogenous-tagging or validated-antibody
    experiment in a polarised human epithelial line would either ground the whole set or collapse it.
- question: Does human AJM1 bind DLG1? The worm interaction with the DLG-1 L27 domain is the mechanistic
    core of the ortholog's function, and its presence or absence in human cells is the sharpest single
    test of whether the nematode role transferred.
- question: Should the cilium annotation be removed at UniProt as well as in GOA? The human IEA derives
    from UniProt's by-similarity cilium statement, whose worm source is itself only IEA. Fixing it only
    in GOA leaves the generator in place.
- question: Is the apparent independence of this gene's evidence codes misleading in general? Here three
    IEAs, an ISS and three IBAs reduce to one worm protein plus one InterPro family. A curator scanning
    the evidence-code column would read this as far better supported than it is.
suggested_experiments:
- description: Endogenous tagging of AJM1 in a polarised human epithelial line (Caco-2 or MDCK-equivalent)
    with apical, tight-junction and adherens-junction markers, to test the apical plasma membrane and
    apical junction complex annotations directly rather than by similarity.
- description: Proximity labelling from tagged endogenous AJM1 in the same line, specifically asking whether
    DLG1, SCRIB or catenins are recovered - i.e. whether the worm DAC architecture has any human counterpart.
- description: AJM1 knockout in a polarised epithelial line followed by transepithelial electrical resistance
    and permeability assays, which would convert the cell-cell junction organization term from an IMP
    transfer into direct human evidence.
- description: 'Test the ciliary claim explicitly: image AJM1 against basal body and axonemal markers
    in ciliated human cells. Given that the worm''s experimental ciliary annotation is to the basal body
    and is author-scoped to nematodes, a negative result here would be informative and cheap.'
