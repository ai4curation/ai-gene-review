      Apical cell membrane"], every location in that entry carrying ECO:0000250|UniProtKB:A0A1C3NSL9,
      and the SubCell-to-GO mapping then re-emitted them as IEA. Only the InterPro row (IPR038825) is
      independent of the worm gene, and it is family-domain based rather than experimental. I initially
      suspected this row of a lineage mismatch - the nematode CeAJ is not built from the same parts as
      a vertebrate apical junction, and the deep-research report makes that point too [file:genes/human/AJM1/AJM1-deep-research-falcon.md
      "Mammalian junctional complexes differ from the nematode CeAJ; functional conservation remains untested."].
