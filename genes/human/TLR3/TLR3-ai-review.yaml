  - *id010
- molecular_function:
    id: GO:0004888
    label: transmembrane signaling receptor activity
  description: After dsRNA-induced dimerisation, the cytoplasmic TIR domains of TLR3 recruit the adaptor
    TRIF (TICAM1) independently of MyD88, leading to IRF3 activation and type I interferon induction and
    to canonical NF-kappaB and MAP kinase activation.
