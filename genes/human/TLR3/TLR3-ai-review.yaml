taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'Toll-like receptor 3 (TLR3, CD283) is a type I transmembrane pattern recognition receptor
  for double-stranded RNA, a molecular signature of viral replication. Its luminal ectodomain of 23 leucine-rich
  repeats binds dsRNA of at least 40-50 bp at acidic pH through two sites at opposite ends of the horseshoe
  (LRR1-3 and LRR17-20, including His539 and Asn541), and ligand binding brings two receptors together
  into a dimer, the minimal signalling unit. Newly made TLR3 resides in the endoplasmic reticulum and
  is carried by the chaperone UNC93B1 through the Golgi to endosomes, where cathepsin cleavage generates
  the signalling-competent receptor; recognition takes place in acidified endosomes/endolysosomes, although
  some cells also display TLR3 at the cell surface. Unlike the other TLRs, TLR3 does not use MyD88: its
  cytoplasmic TIR domain recruits the adaptor TRIF (TICAM1), which activates TBK1/IKK-epsilon and IRF3
  to induce type I and type III interferons, and RIPK1/TRAF6/TAK1 to activate NF-kappaB and MAP kinases
  for inflammatory cytokine production; when caspase-8 or cIAPs are inhibited the same route can trigger
  RIPK3-dependent necroptosis. TLR3 signalling is terminated by c-Src/ZNRF1-mediated ubiquitination and
  lysosomal degradation. TLR3 is widely expressed, including in fibroblasts, epithelial cells, dendritic
  cells and CNS-resident cells. Human inherited TLR3 deficiency causes susceptibility to herpes simplex
  encephalitis and severe influenza pneumonitis, showing that TLR3 is dispensable for defence against
  most pathogens but essential for cell-intrinsic interferon responses to particular viruses in the CNS
  and lung.'
