core_functions:
- molecular_function:
    id: GO:0038187
    label: pattern recognition receptor activity
  description: TLR3 directly binds double-stranded RNA, a product of viral replication, through its leucine-rich
    repeat ectodomain in acidified endosomes, and ligand-induced dimerisation initiates the innate immune
    response. Recognition is specific for dsRNA over ssRNA and DNA and requires His539 and Asn541.
  directly_involved_in:
  - id: GO:0034138
    label: toll-like receptor 3 signaling pathway
  - id: GO:0051607
    label: defense response to virus
  locations:
