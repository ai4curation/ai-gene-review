  - *id002
  - *id022
  - *id019
- molecular_function:
    id: GO:0003725
    label: double-stranded RNA binding
  description: The TLR3 ectodomain binds dsRNA saturably, specifically and reversibly, with affinity increasing
    at acidic pH and with ligand length; the smallest dsRNAs that form stable complexes (40-50 bp) each
    bind one TLR3 dimer and are also the smallest that activate the receptor in cells.
  directly_involved_in:
  - id: GO:0034138
    label: toll-like receptor 3 signaling pathway
  locations:
  - id: GO:0036020
    label: endolysosome membrane
