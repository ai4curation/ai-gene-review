suggested_questions:
- question: Should the Toll-like receptor family IBA for 'is active in plasma membrane' be restricted
    to the cell-surface TLR clade (TLR1/2/4/5/6/10), excluding the endosomal nucleic-acid-sensing TLRs
    (TLR3/7/8/9) whose signalling requires endosomal acidification?
- question: Is the IEP annotation of TLR3 to 'cellular response to mechanical stimulus' (PMID:19593445)
    supported by any data in that paper? The full text concerns BAD in prostate cancer and does not mention
    TLR3.
- question: Does cell-surface TLR3 on fibroblasts and epithelial cells signal at all, or is it only a
    pool en route to endosomes? The answer decides whether a NOT cell-surface annotation from melanocytes
    should stand at the gene level.
- question: Does TLR3 respond to endogenous dsRNA released from damaged cells in sterile injury (e.g.
    skin wounding), and if so, should a role in the inflammatory response to wounding be regarded as core
    rather than context-specific?
- question: Beyond the ligand-induced dimer, does TLR3 assemble laterally into higher-order multimers
    along long double-stranded RNA, and does that explain why robust cellular signalling needs longer
    duplexes than the 40-50 bp needed for a stable dimer? A 2023 cryo-electron microscopy study reporting
    this is summarised in the Falcon deep-research file but was not verified here against the primary
    paper, so the review still treats the dimer as the minimal signalling unit (PMID:18172197).
- question: Is there any contribution of MyD88 to human TLR3 signalling? The Falcon deep-research file
    summarises a 2025 report of TRIF-dependent MyD88 involvement in mouse macrophages. That primary paper
    was not available for verification here, so this review retains the MyD88-independent, TRIF-only model
    supported by PMID:12471095 and PMID:16286015.
suggested_experiments:
- description: Knock the H539E and N541A dsRNA-binding-site mutations into the endogenous TLR3 locus of
    primary human fibroblasts and dendritic cells and measure poly(I:C)- and virus-induced IRF3 activation,
    type I/III interferon output and NF-kappaB activation, to confirm that direct dsRNA binding is rate-limiting
    at physiological expression.
  hypothesis: The dsRNA-binding site defined by overexpression mutagenesis is required for signalling
    at endogenous TLR3 levels.
  experiment_type: knock-in functional assay in primary cells
- description: Use compartment-restricted TLR3 constructs (surface-anchored vs endosome-restricted) in
    cells lacking endogenous TLR3 to test whether cell-surface TLR3 can signal, resolving whether the
    plasma-membrane annotations reflect a signalling pool or only a transit pool.
  hypothesis: TLR3 signalling requires the acidic endosomal compartment and surface TLR3 is signalling-incompetent.
  experiment_type: compartment-targeting rescue assay
- description: Compare TLR3-dependent transcriptional outputs (interferons, chemokines, IL-6, TNF) across
    matched cell types by RNA-seq after poly(I:C) with and without TLR3 knockout, to distinguish direct
    TLR3-driven outputs from indirect, cell-type-specific ones such as IFN-gamma and galectin-9 induction.
  hypothesis: Several cytokine-production annotations (IFN-gamma, IL-12, galectin-9) are indirect consequences
    of TLR3-driven type I interferon rather than direct TLR3 outputs.
  experiment_type: comparative transcriptomics with genetic perturbation
