knowledge_gaps:
- gap_statement: >-
    The normal expression, localization, molecular partners, and physiological role
    of endogenous human LRIT1 in retinal neurons have not been established.
  boundary: >-
    Human LRIT1 was cloned and chromosomally mapped, while the functional synaptic and
    outer-segment evidence comes from mouse or rat orthologs. Orthology supports the
    review's core model but does not prove identical cell-type distribution or visual
    physiology in humans.
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  status: OPEN
  significance: >-
    Direct human evidence is needed to connect the conserved molecular architecture
    to retinal physiology and disease relevance.
  resolution: >-
    Map endogenous LRIT1 in human donor retina and retinal organoids, then perturb
    LRIT1 in cone-to-bipolar assembloids and quantify synaptic connectivity,
    transmission, and light-adaptation phenotypes.
  provenance:
  - reference_id: PMID:10777785
    supporting_text: The human homolog of Pal was mapped to chromosome 10q23.2–23.3 using fluorescence in situ hybridization.
    reference_section_type: ABSTRACT
- gap_statement: >-
    The stoichiometry, orientation, and binding interfaces of the LRIT1-mGluR6-FRMPD2
    assembly are unknown.
  boundary: >-
    Mouse LRIT1 and mGluR6 co-immunoprecipitate in retina and transfected cells, and
    another study reports FRMPD2 binding. These assays do not establish an obligate
    stable ternary complex, the responsible domains, or whether pre- and postsynaptic
    LRIT1 molecules contribute differently.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: >-
    Interface and orientation information are required to distinguish adhesive,
    receptor-allosteric, and scaffold-coupling mechanisms.
  resolution: >-
    Use endogenous proximity labeling and crosslinking mass spectrometry in mouse and
    human retinal systems, followed by domain-specific rescue and direction-resolved
    cell-contact assays.
  provenance:
  - reference_id: PMID:29590623
    supporting_text: Together, these findings establish LRIT1 as a binding partner of mGluR6.
    reference_section_type: RESULTS
- gap_statement: >-
    How LRIT1 modulates cone synaptic gain and background adaptation is unresolved.
  boundary: >-
    Mouse knockout alters cone-to-bipolar response sensitivity and adaptation but does
    not define whether LRIT1 acts through presynaptic release, mGluR6 signaling,
    trans-synaptic geometry, or another mechanism.
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  status: OPEN
  significance: >-
    This mechanism is the principal unresolved link between LRIT1 binding and its
    circuit-level visual phenotype.
  resolution: >-
    Combine compartment-specific rescue in cones and bipolar cells with glutamate
    sensors, presynaptic calcium imaging, mGluR6 signaling measurements, and paired
    electrophysiology across controlled background illumination.
  provenance:
  - reference_id: PMID:29590623
    supporting_text: |-
      These
      observations reveal molecular mechanisms involved in scaling synaptic
      communication in the retina.
    reference_section_type: ABSTRACT
- gap_statement: >-
    The relationship between LRIT1's synaptic pool, rat outer-segment disk localization,
    and heterologous ER accumulation is not understood.
  boundary: >-
    Rat Pal was reported on photoreceptor disk membranes and in the ER after HeLa-cell
    expression, whereas knockout-validated mouse work localizes Lrit1 primarily to
    photoreceptor synapses. Species, antibody, trafficking, and assay differences have
    not been reconciled.
  gap_kind:
  - BIOLOGY
  dark_aspect: CC_DARK
  status: OPEN
  significance: >-
    Resolving these pools will determine whether LRIT1 has multiple physiological
    locations or whether some localization reflects model-specific trafficking.
  resolution: >-
    Compare endogenous LRIT1 localization with knock-in tags and independent antibodies
    across mouse, rat, and human retinal preparations, including pulse-chase analysis
    from ER to synapse and outer segment.
  provenance:
  - reference_id: PMID:10777785
    supporting_text: Pal immunoreactivity was distributed diffusely on the disk membrane in the lamellar regions.
    reference_section_type: RESULTS
  - reference_id: PMID:29590623
    supporting_text: Overall, these data indicate that LRIT1 is produced by both rod and cone photoreceptors and ON-bipolar cells and is transported to the synapse where it is prominently present in the cone synaptic cleft.
    reference_section_type: RESULTS
proposed_new_terms: []
suggested_questions:
- question: >-
    Is endogenous human LRIT1 expressed on the presynaptic cone membrane, the
    postsynaptic bipolar-cell membrane, or both, and how does this distribution change
    with illumination?
- question: >-
    Which extracellular residues mediate LRIT1-mGluR6 binding, and does FRMPD2 couple
    the LRIT1 cytoplasmic tail to the cone release apparatus?
- question: >-
    Why do independent mouse knockout studies differ in the reported structural
    consequences at cone pedicles while agreeing on altered cone visual signaling?
- question: >-
    Does LRIT1 have a physiological outer-segment role distinct from its synaptic role,
    or does the rat disk-membrane result reflect species or assay context?
suggested_experiments:
- hypothesis: >-
    Human LRIT1 conserves the mouse LRIT1-mGluR6 interaction and is required for
    adaptive cone-to-ON-bipolar synaptic transmission.
  description: >-
    Generate LRIT1-null human retinal organoids or cone-bipolar assembloids, restore
    endogenous wild-type LRIT1, and measure mGluR6 proximity, cone-pedicle contacts,
    glutamate release, postsynaptic responses, and adaptation across background-light
    levels.
  experiment_type: Human retinal orthology and rescue test
- hypothesis: >-
    LRIT1 regulates cone transmission through separable extracellular mGluR6-binding
    and intracellular FRMPD2-scaffold interfaces.
  description: >-
    Map both interfaces by crosslinking mass spectrometry and mutagenesis, then perform
    matched surface-delivery-controlled rescue of mouse or human LRIT1 mutants in
    Lrit1-null retinal explants while measuring synaptic physiology.
  experiment_type: Domain-resolved interaction and rescue analysis
- hypothesis: >-
    LRIT1 acts in both presynaptic cones and postsynaptic bipolar cells, with distinct
    contributions to gain control.
  description: >-
    Use cone-specific and bipolar-cell-specific conditional deletion and rescue,
    combined with paired recordings, glutamate sensors, and mGluR6 pathway reporters,
    to assign compartment-specific functions.
  experiment_type: Direction-resolved retinal circuit genetics
- hypothesis: >-
    The ER, outer-segment disk, and synaptic LRIT1 pools form a regulated trafficking
    pathway rather than unrelated localization artifacts.
  description: >-
    Endogenously tag LRIT1 in mouse, rat, and human retinal models and perform pulse-
    chase super-resolution imaging with ER, outer-segment, and synaptic markers under
    controlled developmental and illumination conditions.
  experiment_type: Comparative endogenous trafficking analysis
