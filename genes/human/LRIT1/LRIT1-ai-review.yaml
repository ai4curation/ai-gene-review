- id: PMID:29590622
  title: Lrit1, a Retinal Transmembrane Protein, Regulates Selective Synapse Formation in Cone Photoreceptor Cells and Visual Acuity.
  findings:
  - statement: >-
      Mouse Lrit1 localizes to photoreceptor terminals and supports the selective
      cone-to-cone-ON-bipolar synaptic connection.
    supporting_text: "Here, we found that Lrit1, a \nleucine-rich transmembrane protein, localizes to the photoreceptor synaptic \nterminal and regulates the synaptic connection between cone photoreceptors and \ncone ON-bipolar cells."
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: >-
      Mouse Lrit1 loss alters cone-pedicle morphology and impairs cone-to-ON-bipolar
      signal transmission.
    supporting_text: "Lrit1-deficient retinas exhibit an aberrant morphology of \ncone photoreceptor pedicles, as well as an impairment of signal transmission \nfrom cone photoreceptors to cone ON-bipolar cells."
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: >-
      Mouse Lrit1 interacts with both the photoreceptor scaffold Frmpd2 and the
      ON-bipolar glutamate receptor mGluR6.
    supporting_text: "Furthermore, we demonstrated \nthat Lrit1 interacts with Frmpd2, a photoreceptor scaffold protein, and with \nmGluR6, an ON-bipolar cell-specific glutamate receptor."
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Title and abstract were checked. The paper directly studies mouse Lrit1; the
      human annotations derived here are explicit orthology transfers. The local cache
      is abstract-only, so detailed assay claims defer to the source curator.
- id: PMID:29590623
  title: LRIT1 Modulates Adaptive Changes in Synaptic Communication of Cone Photoreceptors.
  findings:
  - statement: >-
      Mouse LRIT1 binds mGluR6 in native retina and reciprocal heterologous
      co-immunoprecipitation assays.
    supporting_text: Together, these findings establish LRIT1 as a binding partner of mGluR6.
    reference_section_type: RESULTS
  - statement: >-
      Mouse LRIT1 is concentrated at photoreceptor synapses and is prominent in the
      cone synaptic cleft.
    supporting_text: Overall, these data indicate that LRIT1 is produced by both rod and cone photoreceptors and ON-bipolar cells and is transported to the synapse where it is prominently present in the cone synaptic cleft.
    reference_section_type: RESULTS
  - statement: >-
      Mouse Lrit1 knockout increases cone-synapse sensitivity while impairing
      background adaptation and temporally demanding photopic vision.
    supporting_text: |-
      Knockout
      of LRIT1 in mice increases the sensitivity of cone synaptic signaling while
      impairing its ability to adapt to background light without overtly influencing
      the morphology or molecular composition of photoreceptor synapses.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text and title were checked. The study directly establishes mouse Lrit1
      binding, localization, and cone-synaptic physiology; human claims must remain
      explicit orthology transfers.
core_functions:
- description: >-
    At photoreceptor synapses, LRIT1 binds the postsynaptic metabotropic glutamate
    receptor mGluR6 across the synaptic cleft. Mouse ortholog studies support a
    synapse-assembly role in selective cone-to-ON-bipolar connectivity and a
    distinct modulation of cone synaptic gain, background adaptation, and temporal
    signaling. One mouse study reports cone-pedicle abnormalities after Lrit1 loss,
    whereas another finds preserved gross synaptic architecture but altered
    transmission; the shared evidence supports receptor binding and functional
    organization without requiring a constitutive structural defect. Direct human
    retinal function has not yet been demonstrated.
