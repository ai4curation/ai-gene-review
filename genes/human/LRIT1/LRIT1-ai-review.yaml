  label: Homo sapiens
description: >-
  LRIT1 is a type-I single-pass membrane glycoprotein with an
  extracellular leucine-rich-repeat region, an immunoglobulin-like domain, and a
  fibronectin type III domain. Studies of the mouse ortholog place LRIT1 at rod and
  cone photoreceptor synapses, with enrichment in cone terminals and the synaptic
  cleft. LRIT1 binds the ON-bipolar-cell metabotropic glutamate receptor mGluR6
  and associates with the scaffold FRMPD2.
  Mouse loss-of-function studies show that LRIT1 supports selective cone-to-ON-
  bipolar connectivity and tunes the gain, background adaptation, and temporal
  resolution of cone synaptic transmission. Rat Pal/Lrit1 also localizes to
  photoreceptor outer-segment disk membranes; overexpressed rat Pal accumulates in
  the endoplasmic reticulum in HeLa cells. The physiological contribution of human
  LRIT1 and the relationship between its synaptic and outer-segment pools remain
  unresolved.
