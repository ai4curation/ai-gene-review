    supporting_text: Here, we show that loss of INTS6 in human cells results in increased interaction
      of RNAPII with proteins that can mediate its dissociation from the DNA template, including the CRL3ARMC5
      E3 ligase, which ubiquitylates CTD serine5-phosphorylated RPB1 for degradation.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text; human cells.
