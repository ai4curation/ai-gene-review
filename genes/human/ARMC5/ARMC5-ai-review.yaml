suggested_questions:
- question: ARMC5 occupies promoter-proximal chromatin when SPT5 is lost, yet is mostly soluble at steady
    state. What fraction of its Pol II targeting happens on chromatin versus in the free pool, and does
    SPT5 directly shield Pol II from ARMC5?
suggested_experiments:
- description: Map which ARMC5 surface binds Pol II versus SREBF using the PBMAH and myelomeningocele
    missense variants, and test each for Pol II versus SREBF degradation.
