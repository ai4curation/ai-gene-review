id: Q96C12
gene_symbol: ARMC5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'ARMC5 is an armadillo-repeat and BTB-domain protein that serves as the substrate receptor
  of a CUL3-RBX1 ubiquitin ligase (CRL3-ARMC5). It shuttles between cytosol and nucleus. Its main substrate
  is RNA polymerase II: CRL3-ARMC5 ubiquitinates RPB1 (POLR2A), and in its absence most Pol II subunits
  accumulate. It acts on excess and defective Pol II at the promoter-proximal stage, in parallel with
  Integrator, to control the quantity and quality of transcription complexes before elongation. Through
  its armadillo repeats it also targets full-length, SCAP-free SREBF for degradation. ARMC5 is a tumour
  suppressor in the adrenal cortex: germline and somatic loss causes primary bilateral macronodular adrenal
  hyperplasia. Armc5 knockout mice die in early embryogenesis, and ARMC5 variants raise neural tube defect
  risk.'
