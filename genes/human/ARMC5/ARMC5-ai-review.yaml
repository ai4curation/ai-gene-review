- term:
    id: GO:0000785
    label: chromatin
  evidence_type: IDA
  original_reference_id: PMID:39667934
  qualifier: is_active_in
  review:
    summary: Chromatin (IDA). ARMC5 acts on chromatin-bound, promoter-proximal Pol II. GFP ChIP-seq shows
      ARMC5 occupancy at promoter-proximal regions when SPT5 is depleted, which CDK9 inhibition reduces.
      Crosslinking also recovers ARMC5 in the chromatin fraction with RPB1, although most ARMC5 is soluble
      at steady state. Accepted as a site of its activity.
    action: ACCEPT
    reason: '[PMID:39854452 "Using an unbiased proteomic screening approach, we identify armadillo repeat-containing
      5 (ARMC5) as a CUL3 adaptor required for VCP/p97-dependent degradation of SPT5-depleted, chromatin-bound
      Pol II."] [PMID:39854452 "Compared to the high levels of signal observed upon single auxin treatment,
      ARMC5 ChIP-seq signal was largely decreased by double treatment with NVP-2 and auxin (Fig."] [PMID:39854452
      "Thus, CDK9 kinase activity appears to regulate ARMC5 recruitment to promoter-proximal Pol II, in
      good agreement with our initial MS results (Fig. 1D)."] [PMID:39667934 "However, when crosslinker
      dithiobis (succinimidyl propionate) (DSP) was used,68 ARMC5 could also be detected in the chromatin
      fraction, along with the interaction between ARMC5 and RPB1 (Figure 5D)."] [PMID:39667934 "This
      indicates that ARMC5 is found predominantly in the soluble fraction, where it interacts with RNA
      Pol II, but it may also transiently interact with RNA Pol II on chromatin."]'
    supported_by:
    - reference_id: PMID:39854452
      supporting_text: Using an unbiased proteomic screening approach, we identify armadillo repeat-containing
        5 (ARMC5) as a CUL3 adaptor required for VCP/p97-dependent degradation of SPT5-depleted, chromatin-bound
        Pol II.
    - reference_id: PMID:39854452
      supporting_text: Compared to the high levels of signal observed upon single auxin treatment, ARMC5
        ChIP-seq signal was largely decreased by double treatment with NVP-2 and auxin (Fig.
    - reference_id: PMID:39667934
      supporting_text: However, when crosslinker dithiobis (succinimidyl propionate) (DSP) was used,68
        ARMC5 could also be detected in the chromatin fraction, along with the interaction between ARMC5
        and RPB1 (Figure 5D).
