- id: PMID:38225631
  title: ARMC5 controls the degradation of most Pol II subunits, and ARMC5 mutation increases neural tube
    defect risks in mice and humans.
  findings:
  - statement: ARMC5 loss stabilizes most Pol II subunits.
    supporting_text: Surprisingly, the absence of ARMC5 causes the accumulation of not only POLR2A but
      also most of the other 11 Pol II subunits, indicating that the degradation of the whole Pol II complex
      is compromised.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text; mouse and human.
