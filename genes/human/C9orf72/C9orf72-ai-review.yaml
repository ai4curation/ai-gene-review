core_functions:
- description: Promotes Rab39A nucleotide exchange, enabling recruitment of HOPS components during autophagosome–lysosome
    fusion. This activity was demonstrated for purified C9orf72 alone and supported by cellular loss/rescue;
    it is kept distinct from substrate-dependent GAP activity and contested exchange activity of SMCR8-containing
    preparations. C9orf72 does not itself supply HOPS tethering or SNARE membrane fusion.
  molecular_function:
    id: GO:0005085
    label: guanyl-nucleotide exchange factor activity
  directly_involved_in:
  - id: GO:0061909
    label: autophagosome-lysosome fusion
  locations:
  - id: GO:0005829
    label: cytosol
  - id: GO:0044754
    label: autolysosome
  supported_by:
  - reference_id: PMID:37821429
    supporting_text: C9orf72 strongly facilitated the release of Mant-GDP from Rab39A
- description: Positions small-GTPase substrate and stabilizes the C9orf72–SMCR8 complex, contributing
    to GTP hydrolysis. Human-complex structures and C9orf72 interface mutations establish this physical
    contribution; SMCR8 supplies the catalytic Arg147 finger. ARF1/5/6 are robust biochemical substrates,
    while Rab8A hydrolysis required more complex in the tested preparation. WDR41 recruits the complex
    to lysosomes, but the physiological substrate pools and whether catalysis occurs at the lysosome remain
    unresolved.
  contributes_to_molecular_function:
