    supporting_text: ARF1 sits in a 25 Å-wide concave pocket
  - reference_id: PMID:32303654
  - reference_id: PMID:27559131
- description: Recognizes active Rab1A as an effector and coordinates recruitment of the ULK1 initiation
    machinery during autophagosome assembly. This is a recruitment mechanism distinct from exchanging
    nucleotide on Rab39A and from hydrolysis promoted by the SMCR8 complex. Interaction and trafficking
    experiments support the regulatory work without assigning ULK1 kinase activity, stable holo-ULK1 membership,
    or Rab1A exchange to C9orf72.
