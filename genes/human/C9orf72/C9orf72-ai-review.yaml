  - UniProtKB:P09651
  review:
    action: UNDECIDED
    summary: Retain uncertainty about the reported C9orf72–hnRNPA1 interaction because the endogenous
      assay relies on a subsequently questioned C9orf72 antibody.
    reason: PMID:24549040 reports hnRNPA1 coassociation after endogenous immunoprecipitation and mass-spectrometry
      screening. Its unique Results describe reverse hnRNP-antibody precipitation, while the Figure 7
      caption describes anti-C9orf72 precipitation; both interpretations rely on the sc-138763 C9orf72
      reagent for capture or detection. The mass-spectrometry discovery also used that reagent. PMID:30075745
      explicitly includes sc-138763 among tested commercial antibodies and reports deficient specificity
      against knockout mouse controls. This does not demonstrate that the human SH-SY5Y interaction is
      false, but it leaves the target identity of this particular antibody-dependent edge unresolved.
      The inspected GFP-C9orf72 experiment assesses stress-granule induction, not an antibody-independent
      tagged-protein binding validation. No independent reagent-resolved hnRNP binding experiment was
      identified in this bounded reading. Preserve the original curated source and partner rather than
      remove the annotation or call it verified.
    supported_by:
    - reference_id: PMID:24549040
    - reference_id: PMID:30075745
