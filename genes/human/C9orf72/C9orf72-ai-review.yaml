suggested_questions:
- question: Which defined C9orf72, C9orf72–SMCR8 and C9orf72–SMCR8–WDR41 preparations account for the
    reported Rab exchange versus ARF/Rab GAP activities, and which nucleotide states, stoichiometries
    and membrane conditions determine physiological substrate preference?
- question: Can independent endogenous isoform-specific detection resolve the proposed short-product nuclear
    membrane pool and extracellular C9orf72, while distinguishing antibody cross-reactivity, fixation
    effects and low abundance?
- question: Does the Rab1A–ULK1 recruitment mechanism warrant a more specific molecular-adaptor annotation
    after direct assessment of the coordinated interfaces, beyond the existing small-GTPase-binding and
    assembly-regulation assertions?
- question: How do loss of normal C9orf72 protein, expanded repeat RNA and dipeptide-repeat products contribute
    separately to synaptic and stress responses in human cells?
