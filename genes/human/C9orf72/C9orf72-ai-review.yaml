      constructs and trafficking perturbations require separate assessment. The ddx309 correction replaces
      Fig. 5E internalized-TrkB imagery and restores Fig. 7C legend text; authors state conclusions unchanged.
      Correction prose, not corrected image reanalysis, was read. Canonical and authenticated alternate
      Full Text bodies match.
