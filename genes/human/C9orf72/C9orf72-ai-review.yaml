id: Q96LT7
gene_symbol: C9orf72
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: C9orf72 is a DENN-family regulator of small-GTPase-dependent membrane trafficking. Its long
  product forms a stable complex with SMCR8 and WDR41 that helps control GTPase cycling and endolysosomal
  homeostasis. C9orf72 also recognizes active Rab1A to recruit autophagy-initiation machinery, and purified
  C9orf72 has been reported to promote Rab39A nucleotide exchange upstream of HOPS-dependent autophagosome–lysosome
  fusion. The protein is predominantly cytoplasmic, with nutrient-dependent lysosomal association and
  enrichment in neuronal presynaptic compartments. It also influences stress-granule responses and neuronal
  actin dynamics. Pathogenic intronic repeat expansions can reduce normal protein expression while generating
  toxic repeat RNA and dipeptide-repeat products; these are distinct from the normal protein and its alternative
  products.
