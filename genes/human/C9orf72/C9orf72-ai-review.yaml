    action: UNDECIDED
    summary: Exchange activity of the C9orf72–SMCR8–WDR41 complex remains mechanistically contested.
    reason: Positive primary GDP-release assays in PMID:27103069 and PMID:27617292 support the original
      complex-level claim and preserved contributes_to qualifier. In contrast, PMID:32848248 reports no
      detectable exchange by the human HEK293-purified heterotrimer on Rab1A, Rab5A, Rab7A, Rab8A or Rab39B,
      with a Rabex5/Rab5A positive control. This is an actual exchange-assay conflict, not an inference
      that a GAP cannot also be a GEF. Preparation, substrate and time-scale differences remain unresolved.
      The 2023 C9orf72-alone Rab39A experiment uses a different substrate/preparation and does not settle
      the earlier complex assays. Preserve UNDECIDED without discarding either positive evidence or curator
      judgment. The target in PAINT descendant evidence is legitimate, not circular; the ancestral node
      was not independently re-curated.
