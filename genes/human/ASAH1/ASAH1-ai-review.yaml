core_functions:
- description: Acid ceramidase cleaves ceramide to sphingosine and a free fatty acid in the acidic endolysosomal
    system. Precursor autocleavage exposes the catalytic beta-subunit N-terminal cysteine. Saposin D enhances
    access to membrane substrates; an obligatory stable enzyme-saposin complex is not established. This
    hydrolytic activity is the principal molecular function despite secondary substrate and reverse-reaction
    activities in particular assays.
  molecular_function:
    id: GO:0017040
    label: N-acylsphingosine amidohydrolase activity
  directly_involved_in:
  - id: GO:0046514
    label: ceramide catabolic process
  locations:
  - id: GO:0043202
    label: lysosomal lumen
  supported_by:
  - reference_id: PMID:8955159
    supporting_text: hydrolyzes the sphingolipid ceramide into sphingosine and free fatty acid.
    full_text_unavailable: true
  - reference_id: PMID:11451951
    supporting_text: "processed to the mature, heterodimeric enzyme (40 + 13 kDa) in the \nendosomes/lysosomes."
    full_text_unavailable: true
  - reference_id: PMID:29692406
    supporting_text: "Autocleavage triggers a conformational \nchange exposing a hydrophobic channel leading\
      \ to the active site."
    full_text_unavailable: false
proposed_new_terms: []
suggested_questions:
- question: What is the physiological (in vivo) significance of the reverse ceramide-synthase activity
    of ASAH1 relative to dedicated ceramide synthases (CerS1-6)?
- question: How much of the SMA-PME versus Farber disease phenotypic spectrum is explained by residual
    acid ceramidase activity versus tissue-specific substrate handling?
suggested_experiments:
- description: Tissue-specific conditional Asah1 knockouts (e.g. motor neuron vs skin) to dissect the
    SMA-PME versus Farber phenotypes.
- description: Quantify the in vivo contribution of ASAH1 reverse (ceramide synthase) activity using isotope-labeled
    sphingosine/fatty acid flux in cells with and without ASAH1.
