id: Q13510
gene_symbol: ASAH1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ASAH1 encodes acid ceramidase, a soluble lysosomal N-terminal nucleophile hydrolase that
  cleaves ceramide into sphingosine and a free fatty acid at acidic pH. A glycosylated precursor undergoes
  autocleavage into disulfide-linked alpha and beta subunits, exposing catalytic Cys143 at the beta-subunit
  N terminus. Mannose-6-phosphate-dependent trafficking delivers the enzyme to the endolysosomal system,
  where saposin D facilitates access to membrane ceramide. Acid ceramidase shapes cellular ceramide and
  sphingosine pools; substrate preferences depend on ceramide structure and assay conditions. Cellular
  studies also support glycosphingolipid deacylation when lysosomal glycosidases are deficient. Secreted
  and nuclear pools occur in particular settings, including an interaction with the nuclear receptor SF-1
  in adrenocortical cells. Pathogenic ASAH1 variants cause a spectrum including Farber disease and spinal
  muscular atrophy with or without progressive myoclonic epilepsy.
