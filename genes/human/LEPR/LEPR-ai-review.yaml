suggested_questions:
- question: Does the short isoform OB-Ra make any quantitatively important contribution to leptin entry into the
    CNS in humans, given that antibody blockade of the leptin-receptor interface did not prevent leptin translocation
    across a human blood-brain barrier model and ObRa overexpression did not increase permeation?
- question: Which LEPR-dependent peripheral actions of leptin (angiogenic, immune, bone) occur at physiological
    leptin concentrations in humans rather than being artefacts of supraphysiological dosing in vitro?
- question: How do the higher-order leptin:receptor assemblies seen structurally relate to the low abundance of
    the signalling-competent long isoform relative to the inactive short isoforms on hypothalamic neurons?
suggested_experiments:
- description: Quantify isoform-resolved LEPR surface stoichiometry on human hypothalamic neurons (for example iPSC-derived
    POMC neurons) by single-molecule imaging, and test how obesity-associated LEPR variants alter the ligand-induced
    assemblies and downstream STAT3 phosphorylation.
- description: Compare POMC and AGRP transcriptional responses to leptin in isogenic human hypothalamic neurons
    carrying patient LEPR missense alleles with those in receptor-null neurons, to separate signalling-dead from
    partially active alleles.
