id: P48357
gene_symbol: LEPR
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: LEPR (also called OB-R or LEP-R, CD295) is the single-pass type I transmembrane receptor for the adipocyte
  hormone leptin and a member of the class I cytokine receptor family, most closely related to the gp130 signal-transducing
  subunit of the IL-6 receptor. Alternative splicing produces a long signalling isoform (LEPRb/OB-Rb), several short
  isoforms (including OB-Ra) and a soluble ectodomain (isoform E) that binds circulating leptin. The ectodomain
  binds leptin with high affinity and leptin-induced restructuring assembles higher-order leptin:receptor complexes
  on the cell surface; the long isoform then signals through JAK2 and STAT3, with additional MAPK/FOS, PI3K and
  SHP2-ERK arms and negative feedback through SOCS3 and PTP1B. LEPRb is expressed in hypothalamic neurons, notably
  POMC and AgRP/NPY neurons of the arcuate nucleus, where leptin signalling stimulates POMC and represses AgRP transcription
  and thereby suppresses food intake and supports energy expenditure; receptor expression elsewhere (choroid plexus,
  endothelium, immune cells, pancreatic islets, bone) underlies peripheral leptin actions on angiogenesis, T-cell
  responses, insulin secretion, bone mass and reproduction. Biallelic loss-of-function LEPR mutations cause hyperphagia
  and severe early-onset obesity with hypogonadotropic hypogonadism, altered immune function and reduced growth
  hormone and thyrotropin secretion, a phenotype resembling but milder than congenital leptin deficiency.
