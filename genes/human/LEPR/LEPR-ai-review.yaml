- term:
    id: GO:0150104
    label: transport across blood-brain barrier
  evidence_type: NAS
  original_reference_id: PMID:26590417
  qualifier: involved_in
  review:
    summary: Transport across blood-brain barrier (NAS, BBB review). LEPR regulates leptin entry but is not
      itself the transporter at the human BBB.
    action: MARK_AS_OVER_ANNOTATED
    reason: The short isoform ObRa has long been proposed to shuttle leptin across the BBB, and that specific
      claim is what the direct experiments refute. In a human endothelial BBB model, leptin translocation was
      non-paracellular and endocytosis-dependent but was not blocked by an ObR-neutralising antibody that did
      prevent leptin-ObR binding and leptin-induced STAT3 phosphorylation in the same cells, and the authors
      conclude ObR is not the primary leptin transporter there, pointing to LRP-2 instead [PMID:27037668]. The
      second study is not a null result, and what it shows is that ObRa over-expression had no
      effect while ObRb over-expression in co-cultured C6 astrocytoma cells did increase leptin permeation
      across the endothelial monolayer [PMID:20977476]. That is astrocytic LEPR signalling regulating transport
      performed by the endothelium, not LEPR carrying leptin across the barrier, which is what this term
      asserts. Marked over-annotated rather than removed because LEPR genuinely modulates leptin entry; a
      regulatory term would fit, and GO has none specific to this transport.
    supported_by:
    - reference_id: PMID:27037668
      supporting_text: our results demonstrate that leptin binding
        to and signalling through ObR is not required for efficient transport across
        human endothelial monolayers, indicating that ObR is not the primary leptin
        transporter at the human BBB
    - reference_id: PMID:20977476
      supporting_text: Unexpectedly, ObRb over-expression in C6 cells increased leptin
        permeation whereas ObRa over-expression showed no effect when compared with the
        control group of pcDNA-transfected C6 cells
    - reference_id: PMID:20977476
      supporting_text: the results indicate that astrocytes actively regulate
        leptin transport across the blood-brain barrier, a mechanism independent of
        reduction of paracellular permeability
