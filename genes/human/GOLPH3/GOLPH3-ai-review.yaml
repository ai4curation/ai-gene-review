id: Q9H4A6
gene_symbol: GOLPH3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'GOLPH3 is a phosphatidylinositol-4-phosphate (PI4P)-binding peripheral membrane protein
  on the cytoplasmic face of the Golgi, concentrated at the trans-Golgi network. It is a COPI vesicle
  adaptor: it recognises the cytoplasmic tails of Golgi-resident glycosyltransferases and other clients
  and packages them into retrograde intra-Golgi COPII/COPI vesicles, thereby retaining enzymes within
  the stack. By simultaneously binding PI4P and the unconventional myosin MYO18A, GOLPH3 links Golgi membranes
  to the actomyosin cytoskeleton, generating the tensile force that shapes the Golgi ribbon and promotes
  vesicle budding. A minor mitochondrial pool contributes to lipid metabolism, and GOLPH3 modulates secretion,
  cell migration and mTOR signalling in cancer contexts.'
