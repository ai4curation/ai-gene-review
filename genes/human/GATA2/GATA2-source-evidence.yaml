  - relative_path: reactome/R-HSA-8939236.md
    bytes: 2108
    sha256: cc0502dfa7ce4a8b732c9de74c640b64ad564b0b42175312dbf5a51e4a3f6fdc
    blob: 2baf73b37a32832f8ebae9768b107bfddfaa7223
    mode: '100644'
    header: &id053
      stable_id: R-HSA-8939236
      display_name: RUNX1 regulates transcription of genes involved in differentiation of HSCs
      species: Homo sapiens
      summary: The RUNX1:CBFB complex regulates transcription of the SPI1 (PU.1) gene, involved in differentiation
        of hematopoietic stem cells (HSCs). RUNX1 recruits histone methyltransferase KMT2A (MLL) to the SPI1 gene
        locus, leading to generation of the activating H3K4Me3 mark on nucleosomes associated with the SPI1 promoter
        and the upstream regulatory element (Huang et al. 2011). SPI1 transactivation represses self-renewal and
        proliferation of HSCs (Fukuchi et al. 2008) and is needed for commitment of HSCs to specific hematopoietic
        lineages (Imperato et al. 2015).<br>As a component of the TAL1 transcription factor complex, involved in
        acute T cell lymphoblastic leukemia (T-ALL), RUNX1 can promote growth and inhibit apoptosis of hematopoietic
        stem cells by stimulating transcription of the MYB gene and possibly the TRIB2 gene (Sanda et al. 2012,
        Mansour et al. 2014).
  - relative_path: reactome/R-HSA-8956568.md
    bytes: 1086
    sha256: 8519369f777a4a099d9afa6308babf158208eb1c97df448059ab9428c23f9671
    blob: 9f541e36b255c26167021c330a906483c06940c9
    mode: '100644'
    header: &id051
      stable_id: R-HSA-8956568
      display_name: RUNX1 binds the core TAL1 complex
      species: Homo sapiens
      summary: RUNX1, in complex with CBFB, binds to the core TAL1 complex consisting of TAL1 (SCL), TCF3 (E2A)
        or TCF12 (HEB), LMO1 or LMO2, LDB1 and GATA1, GATA2 or GATA3 (Wilson et al. 2010, Tijssen et al. 2011, Sanda
        et al. 2012, Mansour et al. 2014, Hoang et al. 2016). Assembly of the RUNX1- and GATA3-containing TAL1 complex
        is positively regulated by the CDK7-containing CAK complex (Kwiatkowski et al. 2014).
  - relative_path: reactome/R-HSA-996755.md
    bytes: 2203
    sha256: 7077a450b7eaaafeec58bb13ce8df7e41b695800b143d8a809165bf101540aba
    blob: 93effd13ab6e8469d0d65742af997baf645df341
    mode: '100644'
    header: &id052
      stable_id: R-HSA-996755
      display_name: ZFPM proteins bind GATA proteins
      species: Homo sapiens
      summary: The Friend of GATA (FOG) family of proteins are a highly-conserved family of large multitype zinc
        finger cofactors that bind to the amino zinc finger of GATA transcription factors, modulating their activity.
        GATA proteins are named for the DNA consensus sequence they recognize, (T/A)GATA(A/G). FOG/GATA protein
        interactions are essential for the development of many tissues. All six GATA family members are capable
        of interacting with both FOG-1 and FOG-2 (Tsang et al. 1997, Tevosian et al. 1999). Mutations that disrupt
        binding of GATA-1 to FOG-1 are associated with a syndrome of severe X-linked macrothrombocytopenia (Cantor
        & Orkin 2005) and in some cases dyserythropoietic anemia (Nichols et al. 2000). In addition to binding GAG
        proteins, FOGs interact with complexes containing the co-repressor C-terminal binding protein (CtBP) that
        are thought to coordinate histone modifications leading to a transcriptionally repressed state (Shi et al.
        2003).
