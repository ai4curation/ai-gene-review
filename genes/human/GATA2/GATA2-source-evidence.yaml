source_access_updates:
- reference_id: PMID:20705609
  scope: The extracted original Methods, Results and Discussion were read after genuine native acquisition and reread
    for this assessment. Full-length human GATA2 and human FOG2 constructs in mouse 3T3-L1 cells, with GATA2-V296M
    and FOG2 GATA-contact mutants and expression controls, support functional dependence on the GATA/FOG interface.
    FOG2 contact mutants retain partial repression; GATA2-V296M alters proliferation while retaining inhibition
    of adipogenesis. This supports a coregulator-binding refinement of the literal Q8WW38 IPI, not a newly measured
    purified affinity or an exact modern natural-product mapping. Figure images and supplementary materials were
    not inspected. FOG recruitment of CTBP does not assign CTBP enzymatic activity to GATA2.
- reference_id: PMID:10938104
  scope: After the earlier authentic-abstract read, the genuine native full original Methods, Results and Discussion
    were inspected by an independent reader; the curator read that receipt and relevant native Methods/Results.
    Reciprocal human GATA2/human PML association, interface mapping and GATA-site-dependent reporter potentiation
    support the source-specific coactivator-binding refinement. PML did not increase GATA2 abundance or DNA binding
    in the tested controls. The initial mouse-library discovery, engineered human-protein assays, unsuccessful initial
    endogenous hematopoietic assays and positive endogenous NB4 leukemia association are distinguished. The modern
    P29590-4 sequence crosswalk remains unverified; no exact natural-product mapping, purified affinity or universal
    wild-type physiology is asserted. Figure images and complete figure legends were not independently inspected.
- reference_id: PMID:16153155
  scope: The authentic PubMed abstract and P07327 identity as human ADH1A were verified. A positive ADH1A cis-element
    reporter result and GATA2 EMSA/supershift support transcriptional regulation in synthesis with independent GATA2
    activation evidence. A GATA2-specific perturbation or site-mutant assay was not verified, and full text remains
    unavailable. The separate target-specific protein-interaction context remains UNVERIFIED; DNA binding does not
    establish GATA2–ADH1A protein binding or justify a wrong-protein allegation.
- reference_id: PMID:22499991
  scope: Selected authentic original main Methods/Results and textual captions were inspected separately from the
    native cache. Despite full_text_available=true, that cache contains the abstract and Discussion but omits main
    Methods/Results. Human dermal endothelial GATA2 knockdown/resistant overexpression, VEGFR2-expression effects
    and rescue support expression regulation and contextual vascular repair. Mouse wound miR-200b/TNF interventions
    are distinguished from human-cell experiments; no GATA2-specific whole-wound closure rescue is claimed. The
    main Results measure vessel formation, while the Discussion migration sentence cites earlier papers. The unavailable
    relevant supplement leaves the narrower migration assay unresolved. No figure-image reading is claimed.
- reference_id: PMID:27780851
  scope: The authentic abstract verifies endothelial GATA2-dependent miR-126 transcription and describes gain/loss
    and promoter assays. The same miRNA/endothelial biological claim is accepted across IDA and IGI, while the literal
    Q96SQ7 genetic-interaction experiment remains unverified. Publisher routes denied full text and the inspected
    repository lacked it. Four alternative target-expression contexts, migration/proliferation and cytoplasmic panels
    remain unresolved. Abstract-level support for one claim is not verification of every detailed assay or modern
    protein isoform.
- reference_id: PMID:28473536
  scope: Selected original main Results and HT/methyl-SELEX Methods were read. The subsequently recovered authentic
    supplementary workbook identifies GATA2 eDBD in S1 row294 and positive GATA2 methylated/unmethylated DNA motifs
    in S2 rows8188/8193. The retained original rows were independently replayed. This is an engineered recombinant
    DNA-binding-domain selection assay, not a full-length natural-product test, GATA2 structure or endogenous cis-regulatory
    localization assay. No GATA2-specific S3 methylation-class result is asserted. The original IDA is supported,
    while its cis-regulatory refinement uses independent human promoter/ChIP evidence.
