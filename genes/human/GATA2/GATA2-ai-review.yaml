id: P23769
gene_symbol: GATA2
aliases:
- NFE1B
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: GATA2 is a nuclear zinc-finger transcription factor that recognizes GATA-containing regulatory DNA
  and assembles context-dependent activating or repressive complexes at RNA polymerase II genes. Its transcriptional
  programs support hematopoietic progenitor and lineage decisions and regulate endothelial gene expression, survival
  and angiogenic behavior. Interactions with other transcription factors and cofactors help determine the direction
  and cellular specificity of its effects.
alternative_products:
- id: P23769-1
  name: '1'
  sequence_note: Displayed 480-residue product; direct official FASTA equals the official canonical sequence.
  description: The current canonical product supplies the reference sequence for domain and source-construct comparisons.
    Historical 470-aa clones and engineered expression proteins have not all been mapped residue-for-residue to
    this natural product.
- id: P23769-2
  name: '2'
  sequence_note: 'Described 466-residue product: VSP041126 deletes canonical residues 340–353 (SAARRAGTCCANCQ).
    The feature reconstruction equals the independently retrieved direct FASTA.'
  description: This is a verified natural sequence difference. A distinct physiological activity, loss of all DNA
    binding, or isoform-specific localization is not established by sequence identity alone; canonical functional
    experiments are not automatically assigned to this shorter product.
