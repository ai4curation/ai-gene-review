core_functions:
- description: Binds GATA-containing regulatory DNA and recruits context-dependent transcriptional partners to control
    RNA polymerase II transcription. This regulatory activity helps instruct cellular fate programs, including hematopoietic
    lineage decisions, and controls endothelial target-gene expression. Both activation and repression are supported
    in different partner and cellular contexts.
