suggested_questions:
- question: Do the verified 480- and 466-residue natural products differ in DNA-site recognition, partner selection,
    transcriptional activity or compartmental distribution when compared at matched abundance?
- question: Which GATA2-specific experiments in PMID:27780851 establish the individual target-expression, genetic-interaction,
    migration/proliferation and cytoplasmic-localization contexts beyond its abstract-level miR-126 transcriptional
    finding?
- question: Does the GATA2–FOG1 interaction directly engage the particular C2H2 finger domain implied by the original
    domain-binding annotation, and which residues and constructs establish that orientation?
- question: Which original experiments establish the GATA2–ADH1A protein interaction in PMID:16153155, and what
    GATA2-specific perturbation or site-mutant controls further resolve its ADH1A transcriptional mechanism?
suggested_experiments:
- hypothesis: The natural 14-residue deletion changes regulatory specificity rather than simply reducing every GATA2
    activity.
  description: Compare sequence-verified 480- and 466-residue products at matched expression using nuclear localization,
    GATA-site binding, endogenous chromatin occupancy, partner association and target transcription in the same
    cellular background; include rescue and expression controls.
  experiment_type: Matched natural-product comparison
