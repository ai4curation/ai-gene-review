core_functions:
- description: Secreted extracellular-matrix-associated CTHRC1 contributes to tissue-remodeling
    contexts and has proposed regulatory roles in collagen deposition and Wnt/PCP signaling, but its
    receptor or direct molecular activity remains unresolved.
  locations:
  - id: GO:0005576
    label: extracellular region
  - id: GO:0031012
    label: extracellular matrix
  supported_by:
  - reference_id: PMID:23056600
    supporting_text: In human plasma, we detected Cthrc1 in pg/ml quantities
  - reference_id: file:genes/human/CTHRC1/CTHRC1-uniprot.txt
    record_section: ["CC:FUNCTION"]
    supporting_text: 'FUNCTION: May act as a negative regulator of collagen matrix'
knowledge_gaps:
- gap_statement: The direct molecular activity and receptor or binding partners through which human
    CTHRC1 modulates collagen deposition, metabolism or Wnt/planar-cell-polarity signaling remain
    unresolved.
  gap_kind:
  - BIOLOGY
  status: OPEN
suggested_questions:
- question: Which direct extracellular binding partners mediate endogenous human CTHRC1 signaling in
    matrix-remodeling tissues?
suggested_experiments:
- description: Purify human CTHRC1 from a secretion-competent cell system, identify direct
    extracellular interactors by crosslinking/AP-MS, and rescue CTHRC1-null primary fibroblasts with
    binding-defective mutants.
