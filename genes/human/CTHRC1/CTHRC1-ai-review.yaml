  label: Homo sapiens
description: 'CTHRC1 encodes a secreted collagen triple-helix repeat protein found in extracellular fluids
  and extracellular matrix proteomes. It has been reported as a matrix-associated factor induced during
  tissue remodeling and vascular injury, with proposed roles in collagen deposition, Wnt/planar-cell-polarity
  signaling and circulating metabolic regulation that remain less mechanistically defined than its extracellular
  localization.'
