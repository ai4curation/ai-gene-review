  - UniProtKB:P35354
  - UniProtKB:Q8SPQ9
  review:
    summary: The broad cytoplasmic IBA is experimentally seeded for the CTHRC1 branch but non-core.
    action: KEEP_AS_NON_CORE
    reason: Direct mammalian evidence reports intracellular full-length Cthrc1 in differentiated
      smooth muscle, so cytoplasm is kept as a non-core context. The PANTHER node includes mouse
      Cthrc1, not only PTGS proteins, among its cytoplasm IBD seeds, so the broad cytoplasm
      propagation is experimentally grounded for this branch while still peripheral to secreted
      human CTHRC1.
    supported_by:
    - reference_id: PMID:18467647
      supporting_text: Intracellular localization of full-length Cthrc1 was sharply reduced in
        dedifferentiated smooth muscle
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
      - source_id: PANTHER:PTN000935189
        source_status: SUPPORTS_TRANSFER
        comment: The PTN000935189 cytoplasm IBD includes mouse Cthrc1 among its seeds, and CTHRC1
          has independent mammalian intracellular-localization evidence for the same broad term.
