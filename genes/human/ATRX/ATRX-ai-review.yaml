- id: PMID:27029610
  title: ATRX binds to atypical chromatin domains at the 3' exons of zinc finger genes to 
    preserve H3K9me3 enrichment.
  findings:
  - statement: Human-cell chromatin experiments connect ATRX with TRIM28, SETDB1 and 
      ZNF274 at atypical zinc-finger gene chromatin domains and H3K9me3 preservation; 
      coimmunoprecipitation is not proof of each purified binary interface.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Normal source metadata and the explicit GOA experiment were checked 
      against the complete available abstract and selected relevant original Results. 
      Species and assay boundaries are recorded in the gene notes; no whole-paper or 
      supplement inspection is claimed.
