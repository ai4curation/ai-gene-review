      supplement inspection is claimed.
- id: PMID:24981860
  title: Human-chromatin-related protein interactions identify a demethylase complex 
    required for chromosome segregation.
  findings:
  - statement: This systematic interaction study is the source cited for a generic 
      ATRX–DAXX interaction row. The exact pair-level matrix entry and score were not 
      independently inspected; separate targeted studies establish the association.
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: The available normal abstract describes interaction mapping; the exact 
      ATRX–DAXX matrix entry and score were not independently inspected. The association 
      has separate targeted evidence.
- id: PMID:25417162
  title: ATRX directs binding of PRC2 to Xist RNA and Polycomb targets.
  findings:
  - statement: Selected Results support ATRX association with PRC2 and Xist RNA. Isolated 
      EZH2 contact, complete construct-species details and the contents of two linked 
      corrections remain unverified.
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: Complete abstract and selected Results support an ATRX–PRC2 association.
      Purified-reagent species, isolated EZH2 contact and the contents of two linked 
      errata were not verified. This is not a retraction or invalidity finding.
- id: PMID:26055325
  title: Genetic Inactivation of ATRX Leads to a Decrease in the Amount of Telomeric 
    Cohesin and Level of Telomere Transcription in Human Glioma Cells.
  findings:
  - statement: In human telomerase-positive glioma cells, ATRX localizes to subtelomeric 
      chromatin and its loss reduces telomeric cohesin and TERRA; ATRX inactivation alone 
      did not initiate ALT in that model.
- id: PMID:26340527
  title: The Daxx/Atrx Complex Protects Tandem Repetitive Elements during DNA 
    Hypomethylation by Promoting H3K9 Trimethylation.
  findings:
  - statement: In hypomethylated mouse embryonic stem cells, DAXX/Atrx-associated 
      chromatin protects tandem repeats and supports H3K9 trimethylation through the 
      chromatin machinery; this is not ATRX methyltransferase catalysis.
- id: PMID:26373281
  title: Loss of ATRX Suppresses Resolution of Telomere Cohesion to Control Recombination 
    in ALT Cancer Cells.
  findings:
  - statement: The ATRX–macroH2A1.1–tankyrase axis regulates timely resolution of 
      sister-telomere cohesion and recombination in ALT-cell contexts; cohesion resolution
      is distinct from the amount of chromatin-bound cohesin.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The PMID/title and original GOA source are consistent with telomeric 
      cohesion experiments. In addition to the preserved canonical abstract, selected 
      original Results and captions were read from the separately retrieved normal 
      full-text artifact. Canonical cache bytes and their abstract-only flag remain 
      unchanged.
- id: PMID:26496610
  title: A human interactome in three quantitative dimensions organized by stoichiometries
    and abundances.
  findings:
  - statement: This interaction-network source underlies a generic ATRX–DAXX annotation. 
      Exact pair-level assay details were not independently verified; targeted ATRX/DAXX 
      literature supplies separate biological support.
  full_text_unavailable: true
  reference_review:
