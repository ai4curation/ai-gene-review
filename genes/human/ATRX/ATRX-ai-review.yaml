- id: PMID:7697714
  title: Mutations in a putative global transcriptional regulator cause X-linked mental 
    retardation with alpha-thalassemia (ATR-X syndrome).
  findings:
  - statement: Pathogenic variants in the human ATRX locus establish its association with 
      X-linked intellectual disability and alpha-thalassemia; the early predicted 
      regulatory mechanism is not itself a catalytic assay.
  full_text_unavailable: true
- id: PMID:7874112
  title: Cloning and characterization of a new human Xq13 gene, encoding a putative 
    helicase.
  findings:
  - statement: The historical human XH2 cloning study identifies the locus later named 
      ATRX. Its early sequence and putative-helicase interpretation do not replace the 
      current full-length sequence or direct biochemical evidence.
  full_text_unavailable: true
- id: Reactome:R-HSA-9007926
  title: ATRX binds DAXX
  findings:
  - statement: The normal human event describes ATRX binding DAXX in a 
      chromatin-remodeling assembly.
- id: Reactome:R-HSA-9670101
  title: ATRX:DAXX binds to subtelomeric chromosomal regions
  findings:
  - statement: The human event places ATRX–DAXX at subtelomeric chromatin and links it to 
      cohesin recruitment and TERRA regulation.
- id: Reactome:R-HSA-9670114
  title: Histone H3.3 deposition at telomere
  findings:
  - statement: The event describes ATRX/DAXX-dependent telomeric H3.3 deposition, 
      distinguishing DAXX histone handling from HIRA-associated deposition pathways.
- id: Reactome:R-HSA-9670619
  title: Defective ATRX does not bind DAXX
  findings:
  - statement: This disease event describes defective ATRX variants and their DAXX 
      association, distinguishing fragment assays from inferred loss-of-function candidate
      variants; it is not a negation for normal ATRX.
- id: Reactome:R-HSA-9670620
  title: Defective DAXX does not bind ATRX
  findings:
  - statement: This disease event concerns defective DAXX variants in ATRX association and
      distinguishes fragment experiments from full-length mutant testing; it does not 
      establish universal failure of the normal complex.
- id: PMID:14729260
  title: A conserved truncated isoform of the ATR-X syndrome protein lacking the 
    SWI/SNF-homology domain.
  findings:
  - statement: A conserved truncated ATRX product lacks the SWI/SNF motifs and differs 
      from full-length ATRX in PML-body localization. The human/mouse transcript mechanism
      does not by itself map the reported product to a particular current UniProt isoform.
    supporting_text: "unlikely to be functionally equivalent to\nthe full length protein"
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete normal abstract read; no full text available. Human and mouse 
      are explicit. Intron-11 retention and intronic polyadenylation are reported. 
      Sequence-level equivalence to P46100-6 and residual biochemical activity were not 
      established.
- id: PMID:23329831
  title: Alpha thalassemia/mental retardation syndrome X-linked gene product ATRX is 
    required for proper replication restart and cellular resistance to replication stress.
  findings:
  - statement: Human ATRX-deficient cells show impaired replication restart after 
      hydroxyurea. MRN copurifies with ATRX; cotransfection pull-down recovers NBS1 rather
      than the other tested MRN components.
    supporting_text: ATRX pulled down NBS1, but not the other two components
    reference_section_type: RESULTS
    full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete cached Experimental Procedures and Results read, including 
      human HCT116 knockout, HeLa imaging and HEK293T purification/co-precipitation. This 
      does not establish a purified binary ATRX-MRN interface or negate independent 
      complex association in PMID:24651726. DNA-fiber restart and elongation-rate 
      endpoints are distinct. Figure pixels and supplements were not inspected.
- id: PMID:23563309
  title: Atrx deficiency induces telomere dysfunction, endocrine defects, and reduced life
    span.
  findings:
  - statement: Atrx loss in mouse neural progenitors produces replication-associated 
      damage with ATM activation and downstream p53-dependent apoptosis; combined p53 loss
      increases persistence of damaged cells.
    supporting_text: loss of ATRX in the embryonic brain results in the accumulation of 
      DNA damage
    reference_section_type: RESULTS
    full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete abstract plus selected mouse damage/p53/telomere Results and 
      mouse-genetics, imaging, immunoblot and neural-progenitor Methods read. This is not 
      the original PMID:24651726 donor identified in the historical MGI table, so it does 
      not resolve the two source-specific p53 transfers. G4-ligand sensitivity is not 
      direct evidence of purified G4 unwinding. Endocrine/whole-body experiments were not 
      newly inspected beyond the abstract.
- id: PMID:40443347
  title: ATRX ADD domain is a versatile module for recognizing macroH2A, H3, and beyond.
  findings:
  - statement: Purified human ATRX fragments map macroH2A-H2B recognition to the ADD 
      domain, with discrimination from canonical H2A in the tested assays. The same study 
      distinguishes direct CHD4 peptide binding from broader NuRD associations.
    supporting_text: retained the ability to bind GST-mH2A-H2B
    reference_section_type: RESULTS
    full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected protein-expression/purification, pull-down, ITC, AP-MS and 
      immunoblot Methods and domain-mapping/CHD4 Results read. ATRX is the human P46100 
      construct expressed in E. coli. Complex structures are AlphaFold predictions, not 
      solved structures. CHD4 in the Methods/Results resolves the abstract typography CDH4
      without altering the cached record. AP-MS does not establish stable membership of 
      ATRX in every recovered complex. No figure pixels or complete supplements read; 
      normal year2025 is retained despite later issue context.
- id: PMID:42380617
  title: Distinct ATRX functions cooperate with 9-1-1 and CST complexes to safeguard 
    replication and telomere integrity.
  findings:
  - statement: Human-cell separation-of-function experiments distinguish PIP-dependent 
      protection against genome-wide replication stress from ATPase-dependent suppression 
      of telomeric single-stranded DNA, with endpoint-specific dependence on the ATRX-DAXX
      interaction.
    supporting_text: genome-wide replication-stress sensitivity of ATRX-null cells was 
      recapitulated with a PIP-box mutant
    reference_section_type: RESULTS
    full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete abstract plus selected mutant-complementation, ssDNA and H3.3 
      Results, human-cell/construct Methods and endogenous knock-in Methods read. Poor 
      ectopic K1600R expression prompted an endogenous knock-in; it was not treated as 
      equivalent expression by assumption. Binding-motif mutation, DAXX knockout and 
      double knockout are distinct comparisons. Findings are context-specific and do not 
      invalidate the established ATRX-DAXX remodeling core. Oversized duplicate extraction
      containers, full supplements, raw data and figure pixels were not fully read.
core_functions:
- description: Full-length ATRX provides the ATP-dependent remodeling motor in an 
    ATRX–DAXX chromatin complex, changing histone–DNA contacts and helping organize 
    histone-variant chromatin at repetitive nuclear regions. DAXX supplies the directly 
    demonstrated isolated H3.3 chaperone activity.
  molecular_function:
    id: GO:0140658
    label: ATP-dependent chromatin remodeler activity
  directly_involved_in:
  - id: GO:0006338
    label: chromatin remodeling
  locations:
  - id: GO:0005721
    label: pericentric heterochromatin
  - id: GO:0000781
    label: chromosome, telomeric region
  supported_by:
  - reference_id: PMID:12953102
    supporting_text: alteration of mononucleosome disruption patterns
  - reference_id: PMID:20651253
    supporting_text: "the ATRX-Daxx\ncomplex catalyzes the deposition and remodeling of H3.3-containing
      nucleosomes"
- description: The ADD domain recognizes H3K9-trimethylated histone tails in combination 
    with the H3K4 methylation state, contributing to heterochromatin targeting. 
    Recognition is impaired by H3K4 di- or trimethylation and by tested disease-associated
    ADD variants.
  molecular_function:
    id: GO:0062072
    label: histone H3K9me2/3 reader activity
  locations:
  - id: GO:0000792
    label: heterochromatin
  supported_by:
  - reference_id: PMID:21421568
    supporting_text: "specific binding\nof the ADD domain to H3 histone tail peptides containing
      H3K9me3"
suggested_questions:
- question: Which p53-specific experiment underlies the historical mouse GO:0030330 
    annotation to PMID:24651726, and how does it map to the current human transfers? Does 
    it establish ATRX participation in that cascade rather than a secondary response to 
    replication damage?
- question: Which sequence-verified human ATRX splice products retain functional ADD 
    recognition and ATPase remodeling? Can the strongly truncated P46100-6 product be 
    mapped to the experimentally described ATRXt transcript before transferring 
    isoform-specific results?
- question: How do cell type, telomerase status and local chromatin account for the 
    different ATRX-dependent TERRA and telomeric-cohesion outcomes?
- question: Do the original high-throughput interaction matrices and the corrected PRC2 
    study resolve the remaining partner-specific assay details without conflating complex 
    association with a purified binary interface?
suggested_experiments:
- description: Compare sequence-verified ATRX splice products in matched cells using 
    expression-normalized localization, ADD histone-tail binding and ATP-dependent 
    nucleosome-remodeling assays; include full-length ATRX and domain-disrupting controls.
- description: In matched telomerase-positive and ALT cell backgrounds, separate ATRX 
    motor, DAXX-binding and macroH2A-binding perturbations while measuring H3.3 
    deposition, TERRA, telomeric cohesin occupancy and sister-telomere cohesion as 
    distinct readouts.
