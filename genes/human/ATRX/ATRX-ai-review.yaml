- id: PMID:10570185
  title: Localization of a putative transcriptional regulator (ATRX) at pericentromeric 
    heterochromatin and the short arms of acrocentric chromosomes.
  findings:
  - statement: ATRX localizes to pericentromeric heterochromatin and the short arms of 
      human acrocentric chromosomes; this supports chromosomal localization rather than an
      enzymatic assignment.
- id: PMID:10699177
  title: Cell cycle-dependent phosphorylation of the ATRX protein correlates with changes 
    in nuclear matrix and chromatin association.
  findings:
  - statement: ATRX phosphorylation and association with chromatin and the nuclear matrix 
      vary across the cell cycle; the reported correlation does not define a complete 
      causal phosphorylation mechanism.
  full_text_unavailable: true
- id: PMID:10742099
  title: Mutations in ATRX, encoding a SWI/SNF-like protein, cause diverse changes in the 
    pattern of DNA methylation.
  findings:
  - statement: Human ATRX mutations are associated with altered DNA methylation patterns 
      at repetitive regions; the result does not establish intrinsic DNA methyltransferase
      activity.
  full_text_unavailable: true
- id: PMID:12953102
  title: The ATRX syndrome protein forms a chromatin-remodeling complex with Daxx and 
    localizes in promyelocytic leukemia nuclear bodies.
  findings:
  - statement: ATRX forms a DAXX-associated nuclear remodeling complex with ATP-dependent 
      DNA translocation and nucleosome effects, and a subset localizes to PML bodies. 
      Selected original assays did not detect conventional duplex unwinding with the 
      tested substrates.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Official PubMed identity checked. Complete normal abstract and selected 
      original translocation/remodeling Results and Figure4 caption; complete Methods, 
      supplements and figure pixels were not inspected.
- id: PMID:15882967
  title: The mammalian heterochromatin protein 1 binds diverse nuclear proteins through a 
    common motif that targets the chromoshadow domain.
  findings:
  - statement: A variant PxVxL motif in ATRX supports binding to the HP1 chromoshadow 
      domain, providing a more informative molecular interaction than generic protein 
      binding.
  full_text_unavailable: true
- id: PMID:17296936
  title: Interaction between chromatin proteins MECP2 and ATRX is disrupted by mutations 
    that cause inherited mental retardation.
  findings:
  - statement: MeCP2 interacts with ATRX and affects its heterochromatin targeting. The 
      inspected interaction design includes human ATRX prey and rat MeCP2 bait, with 
      distinct mouse-cell localization experiments.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Normal source metadata and the explicit GOA experiment were checked 
      against the complete available abstract and selected relevant original Results. 
      Species and assay boundaries are recorded in the gene notes; no whole-paper or 
      supplement inspection is claimed.
- id: PMID:20211137
  title: Distinct factors control histone variant H3.3 localization at specific genomic 
    regions.
  findings:
  - statement: ATRX and DAXX associate with H3.3 chromatin and support its telomeric 
      localization in mouse embryonic stem cells; human HeLa histone-complex experiments 
      are a separate assay context.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Normal source metadata and the explicit GOA experiment were checked 
      against the complete available abstract and selected relevant original Results. 
      Species and assay boundaries are recorded in the gene notes; no whole-paper or 
