- id: PMID:20651253
  title: Daxx is an H3.3-specific histone chaperone and cooperates with ATRX in 
    replication-independent chromatin assembly at telomeres.
  findings:
  - statement: DAXX has intrinsic H3.3/H4 chaperone activity, whereas the ATRX–DAXX 
      complex supports ATP-dependent nucleosome remodeling and H3.3 deposition; mouse 
      embryonic stem-cell experiments support telomeric targeting.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Official PubMed identity checked. Complete normal abstract and selected 
      original Results and Figure1–5 captions distinguish DAXX chaperoning from 
      ATRX-complex remodeling; complete Methods and supplements were not inspected.
- id: PMID:21421568
  title: The ATRX-ADD domain binds to H3 tail peptides and reads the combined methylation 
    state of K4 and K9.
  findings:
  - statement: The ATRX ADD domain recognizes H3K9-trimethylated histone tails in the 
      context of the H3K4 methylation state, and tested disease-associated ADD variants 
      impair binding and heterochromatin localization.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Official PubMed identity checked. Complete normal abstract and selected 
      original Discussion support ADD histone recognition; complete original Methods and 
      figure pixels were not inspected.
- id: PMID:22102817
  title: EBV tegument protein BNRF1 disrupts DAXX-ATRX to activate viral early gene 
    transcription.
  findings:
  - statement: The EBV tegument protein BNRF1 disrupts the DAXX–ATRX restriction system 
      and promotes viral early transcription; the abstract does not by itself establish a 
      purified binary BNRF1–ATRX interaction.
- id: PMID:22391447
  title: ATRX-mediated chromatin association of histone variant macroH2A1 regulates 
    α-globin expression.
  findings:
  - statement: ATRX associates with macroH2A1 and restricts its chromatin accumulation, 
      including at alpha-globin loci in human erythroleukemic cells; this is distinct from
      assigning ATRX macroH2A-deposition activity.
  full_text_unavailable: true
- id: PMID:24651726
  title: ATRX dysfunction induces replication defects in primary mouse cells.
  findings:
  - statement: Atrx loss causes replication defects in primary mouse-cell models, while 
      human HeLa coimmunoprecipitation supports ATRX association with the MRN complex. The
      mouse-focused title does not exclude the human experiment.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Normal source metadata and the explicit GOA experiment were checked 
      against the complete available abstract and selected relevant original Results. 
