id: P46100
gene_symbol: ATRX
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ATRX is a nuclear SNF2-family ATP-dependent chromatin remodeler. Its 
  full-length protein combines an N-terminal ADD histone-recognition domain with a 
  C-terminal ATPase motor. The ADD domain recognizes H3K9 trimethylation in the context of
  an unmethylated H3K4, and interactions with HP1 and other chromatin proteins aid 
  targeting. Together with DAXX, ATRX organizes H3.3-containing chromatin at repetitive 
  genomic regions, including pericentric and telomeric sites. The ADD domain also binds 
  the histone-fold region of macroH2A, and ATRX limits macroH2A chromatin accumulation at 
  selected loci. ATRX also protects susceptible genomic regions during replication. 
  Human-cell studies distinguish PIP-motif-dependent protection against genome-wide 
  replication stress from ATPase-dependent suppression of telomeric single-stranded DNA, 
  with context-specific dependence on DAXX. These activities support chromatin 
  organization and genome stability. Pathogenic germline variants cause ATR-X syndrome, 
  while somatic ATRX loss is associated with alternative telomere maintenance in some 
  tumors.
