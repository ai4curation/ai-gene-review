id: P57764
gene_symbol: GSDMD
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  GSDMD (Gasdermin-D) is the terminal executioner of pyroptosis, a lytic,
  pro-inflammatory form of programmed cell death. The full-length protein is
  autoinhibited: an N-terminal pore-forming domain is held inactive by an
  intramolecular interaction with its C-terminal repressor domain. Inflammatory
  caspases cleave the interdomain linker — CASP1 at Asp275 in the canonical
  inflammasome pathway, and CASP4/CASP5 in the non-canonical pathway triggered by
  cytosolic lipopolysaccharide (CASP8 cleaves it in the Yersinia/TAK1-inactivation
  context) — releasing the N-terminal fragment (GSDMD-NT). GSDMD-NT translocates
  to the plasma membrane, where it binds acidic inner-leaflet phospholipids
  (monophosphorylated and bisphosphorylated phosphatidylinositols, phosphatidic
  acid, phosphatidylserine) and cardiolipin, oligomerizes, and inserts to form
  large ring-shaped transmembrane pores of 10-15 nm inner diameter. These pores
  conduct mature interleukin-1 family cytokines (IL-1β and IL-18) out of the cell
  and drive pyroptosis; terminal membrane rupture is executed downstream by NINJ1.
  Because its lipid specificity restricts pore formation to the inner leaflet,
  GSDMD-NT released from dying cells is directly bactericidal against Gram-negative
  and Gram-positive bacteria while sparing neighboring host cells. GSDMD activity
  is tuned by cleavage site choice (CASP3/CASP7 cleavage at Asp87 inactivates it)
  and by post-translational modifications including palmitoylation, succination,
  and O-GlcNAcylation of Cys191. A minor CASP3/CASP7-generated p13 fragment
  additionally acts in the nucleus, and the protein is targeted by several
  microbial evasion mechanisms.
