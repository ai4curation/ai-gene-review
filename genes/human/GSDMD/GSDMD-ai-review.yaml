core_functions:
- description: >-
    Pore-forming activity of the caspase-cleaved N-terminal fragment (GSDMD-NT).
    After inflammatory-caspase cleavage releases GSDMD-NT from autoinhibition, the
    fragment oligomerizes in the plasma membrane and forms large ring-shaped
    transmembrane pores (10-15 nm inner diameter). These non-selective wide pores
    conduct mature IL-1 family cytokines (IL-1β, IL-18) and drive pyroptotic,
    lytic cell death, providing host defense against infection and danger signals.
  molecular_function:
    id: GO:0022829
    label: wide pore channel activity
  directly_involved_in:
  - id: GO:0070269
    label: pyroptotic inflammatory response
  - id: GO:0141201
    label: pyroptotic cell death
  - id: GO:0032731
    label: positive regulation of interleukin-1 beta production
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:33883744
    supporting_text: Gasdermin D pore structure reveals preferential release of mature
      interleukin-1
- description: >-
    Acidic-phospholipid binding that targets GSDMD-NT to the cytoplasmic leaflet
    of membranes. GSDMD-NT selectively binds inner-leaflet phosphoinositides
    (including phosphatidylinositol 4-phosphate and phosphatidylinositol
    4,5-bisphosphate), phosphatidylserine and the bacterial/mitochondrial lipid
    cardiolipin, but not the outer-leaflet lipids phosphatidylcholine or
    phosphatidylethanolamine. This specificity localizes pore formation to the
    inner leaflet and underlies both pyroptosis of the host cell and the direct
    bactericidal activity of secreted GSDMD-NT.
  molecular_function:
    id: GO:0005546
    label: phosphatidylinositol-4,5-bisphosphate binding
  directly_involved_in:
  - id: GO:0046931
    label: pore complex assembly
  - id: GO:0051260
    label: protein homooligomerization
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:27281216
    supporting_text: Pore-forming activity and structural autoinhibition of the gasdermin
      family
- description: >-
    Innate antibacterial effector activity. GSDMD-NT released from pyroptotic
    cells, and GSDMD-NT acting at intracellular membranes, forms pores that kill
    both Gram-negative and Gram-positive bacteria, contributing to defense against
    bacterial infection. This effector role is a direct consequence of the same
    pore-forming/lipid-binding activities and their preference for bacterial
    (cardiolipin-rich) membranes.
  molecular_function:
    id: GO:0022829
    label: wide pore channel activity
  directly_involved_in:
  - id: GO:0050829
    label: defense response to Gram-negative bacterium
  - id: GO:0050830
    label: defense response to Gram-positive bacterium
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:27281216
    supporting_text: Pore-forming activity and structural autoinhibition of the gasdermin
      family
suggested_questions:
- question: >-
    What determines whether GSDMD pore formation leads to reversible membrane
    repair and cell survival versus NINJ1-mediated membrane rupture and pyroptotic
    death in a given cell type?
- question: >-
    How do the individual post-translational modifications of Cys191
    (palmitoylation, succination, O-GlcNAcylation) and site-specific cleavage
    quantitatively tune GSDMD pore formation in vivo?
- question: >-
    What are the physiological roles and mechanisms of the minor GSDMD fragments
    (the nuclear p13 STAT1 coactivator and the allergen-protease-generated p40)
    relative to the canonical GSDMD-NT pore?
suggested_experiments:
- description: >-
    Reconstitute GSDMD-NT pore formation in defined liposomes of varying lipid
    composition and measure conductance and cytokine (IL-1β/IL-18) passage to map
    the quantitative relationship between lipid specificity and pore properties.
- description: >-
    Use structure-guided GSDMD point mutants (cleavage-site, oligomerization, and
    lipid-binding interface variants) knocked in at the endogenous locus to
    dissect which activities are required for pyroptosis versus antibacterial
    defense in primary macrophages.
- description: >-
    Quantify the contribution of Cys191 modifications by combining chemical-genetic
    tools (e.g. the covalent Cys191 inhibitors) with mass spectrometry of the
    modified residue during inflammasome activation, correlating modification
    state with pore-forming capacity.
