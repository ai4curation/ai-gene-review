suggested_questions:
- question: Is a peptide produced from the MTRNR2L2 locus at all? Everything annotated to this gene 
    follows from the assumption that it is, and the assumption rests on an intact open reading frame
    plus RT-PCR detection of the transcript [PMID:19477263]. Targeted mass spectrometry of testis 
    for the HN2-specific tryptic peptides would settle it.
  experts:
  - Alan Saghatelian
  - Pinchas Cohen
  - Jonathan Wren
- question: How should GO treat a family in which one member has all the experimental evidence and 
    twelve nuclear copies have none? The present solution propagates humanin's activity to every 
    copy through PANTHER:PTN002141596, which produces thirteen gene products annotated as receptor 
    antagonists and apoptosis regulators on the strength of one mitochondrial peptide. A node 
    restricted to MT-RNR2 plus MTRNR2L5, the two sequences with functional data, would say what is 
    actually known.
- question: Can any assay distinguish HN2 from humanin and from the other nuclear humanin-like 
    peptides? HN2 matches humanin at 21 of 24 positions, so ELISA and antibody-based measurements of
    circulating humanin-like peptides - which exist in the clinical literature for other members of 
    this family - cannot be assumed to be locus-specific. This question governs how all biomarker 
    reports about this family should be read.
  experts:
  - Pinchas Cohen
suggested_experiments:
- description: Targeted (PRM) mass spectrometry of human testis and of plasma for peptides unique to
    HN2, using the positions at which it differs from humanin (Leu12->Ser, Arg23->Leu and 
    Ala24->Leu, plus a four-residue C-terminal extension (SSVF)) to design discriminating 
    transitions. This is the one experiment that would convert the entire annotation set on this 
    gene from inference to observation.
- description: Ribosome profiling or ORF-capture of the MTRNR2L2 transcript in a tissue where it is 
    expressed, to test whether the predicted ORF is translated rather than merely transcribed.
- description: Synthesise the HN2 peptide and run it side by side with humanin in the assays that 
    define humanin activity - staurosporine- and amyloid-beta-induced death, FPRL1 competition, BAX 
    binding - as was done for HN5 alone [PMID:19477263]. Side-by-side potencies would show whether 
    the shared annotations are warranted and would put numbers on the contribution of the 
    substituted residues.
- description: CRISPR deletion of the MTRNR2L2 locus in a human cell line that expresses it, with 
    apoptosis challenge, to test whether the locus contributes to cytoprotection as a gene rather 
    than as a synthetic peptide. The thirteen near-identical loci make guide design the hard part, 
    and off-target cutting at the paralogs is the control that matters.
