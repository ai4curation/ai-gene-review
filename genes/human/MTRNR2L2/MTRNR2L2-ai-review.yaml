- term:
    id: GO:0048019
    label: receptor antagonist activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN002141596
  - UniProtKB:Q8IVG9
  review:
    summary: Phylogenetic propagation of humanin's receptor antagonist activity to MTRNR2L2 from the
      humanin-family node PANTHER:PTN002141596. The grounding experiment is humanin competing with 
      amyloid-beta at FPRL1 [PMID:15153530]; nothing comparable has been done with HN2.
    action: MARK_AS_OVER_ANNOTATED
    reason: "The IBD behind this row places the activity at the humanin-family node, and the placement
      is reasonable for the mitochondrial peptide: humanin is a genuine FPRL1 ligand and the antagonism
      of amyloid-beta at that receptor is directly observed [PMID:15153530]. Arguing with the row means
      asking whether MTRNR2L2 sits inside the clade that inherited the function, and the difficulty is
      that the question is not really phylogenetic. The nuclear MT-RNR2-like loci are copies of a mitochondrial
      rRNA segment, so descent in this tree tracks genomic sequence rather than a protein-coding lineage,
      and membership of the node does not establish that the ORF is translated, that the peptide is stable,
      or that it reaches a receptor. On residues: HN2 keeps humanin positions 1-11 and 13-22 but, like
      five of the seven loci reviewed here, substitutes Leu12, a position where humanin Leu12->Ala abolishes
      neuroprotective activity (file:human/MT-RNR2__Q8IVG9/MT-RNR2__Q8IVG9-uniprot.txt); it also carries
      a C-terminal extension of four residues whose effect on a peptide whose C-terminal helix is required
      for activity has never been tested. Bodzioch et al., who defined these loci, singled out position
      13 as the one that may matter for cell-surface receptor binding [PMID:19477263]. A second, term-level
      point applies to every member of this node: receptor antagonist activity describes humanin's competition
      with amyloid-beta at FPRL1, which is a property measured in a specific assay, whereas humanin also
      carries receptor ligand activity by IDA - so even for the donor the term captures one facet of the
      interaction. The node placement is defensible and the row may yet prove right, so this is an over-annotation
      rather than an error: it states an activity for a gene product that has never been shown to exist,
      let alone to engage a receptor."
    supported_by:
    - reference_id: PMID:15153530
      supporting_text: Humanin shares human FPRL1 and mouse FPR2 with Abeta(42) and suggest that 
        Humanin may exert its neuroprotective effects by competitively inhibiting the access of 
        FPRL1 to Abeta(42).
    - reference_id: PMID:19477263
      supporting_text: Proline vs serine in position 19 may determine whether the peptide is 
        secreted or not, while threonine in position 13 may be important for cell surface receptor 
        binding.
    - reference_id: PMID:35372353
      supporting_text: It is predicted that these various isoforms might contribute to differential 
        neuroprotective effects and receptor binding, but their individual roles remain to be 
        investigated.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - WRONG_ORTHOLOG_OR_PARALOG
      source_entities:
      - source_id: PANTHER:PTN002141596
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Humanin-family ancestral node. The assertion is correctly placed for the 
          mitochondrially encoded peptide, which has the experimental grounding; its mechanical 
          descent to nuclear MT-RNR2-like copies carries no evidence that those copies yield a 
          peptide with receptor-level activity.
      - source_id: UniProtKB:Q8IVG9
        source_label: MT-RNR2
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Humanin, with IDA for this term from the FPRL1 competition experiments 
          [PMID:15153530]. Sound at source; all assays used synthetic humanin.
- term:
    id: GO:1900118
    label: negative regulation of execution phase of apoptosis
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN002141596
  - UniProtKB:P0CJ72
  review:
    summary: Phylogenetic propagation of negative regulation of the execution phase of apoptosis to 
      MTRNR2L2 from the humanin-family node. The co-listed donor is UniProtKB:P0CJ72 (MTRNR2L5), 
      whose own evidence for this term is an IMP from an assay on synthetic HN5 peptide 
      [PMID:19477263].
    action: MARK_AS_OVER_ANNOTATED
    reason: 'The antiapoptotic function is the best-supported property of this family, and the IBD placement
      is sensible: humanin blocks BAX, BID and BIM and is antiapoptotic in many systems, and synthetic
      HN5 peptide - the product of one of these very nuclear loci - is cytoprotective against staurosporine-induced
      apoptosis [PMID:19477263]. That last point is important and cuts against a blanket dismissal: a
      nuclear humanin-like sequence, carrying the same Leu12->Ser substitution that most of these loci
      carry, does retain cytoprotective activity when synthesised. What the row still lacks for MTRNR2L2
      is anything specific to this locus. Its transcript is detectable and staurosporine-responsive [PMID:19477263],
      but a transcript is not a peptide: no HN2 peptide has been observed, no apoptosis assay has used
      it, and the systematic human-genetics lookup across all thirteen loci found no association with
      disease and no expression QTL that would argue for a functional product [PMID:31753007]. On residues:
      HN2 keeps humanin positions 1-11 and 13-22 but, like five of the seven loci reviewed here, substitutes
      Leu12, a position where humanin Leu12->Ala abolishes neuroprotective activity (file:human/MT-RNR2__Q8IVG9/MT-RNR2__Q8IVG9-uniprot.txt);
      it also carries a C-terminal extension of four residues whose effect on a peptide whose C-terminal
      helix is required for activity has never been tested. I mark the row as an over-annotation: plausible,
      untested for this locus, and currently an assertion about the humanin sequence rather than about
      this gene product.'
    supported_by:
    - reference_id: PMID:19477263
      supporting_text: Cytoprotection against the STS-induced apoptosis conferred by the polymorphic
        HN5 variant, in which threonine in position 13 is replaced with isoleucine, is reduced 
        compared to the wild type HN5 peptide.
    - reference_id: PMID:19477263
      supporting_text: At least ten of these nuclear genes are expressed in human tissues, and 
        respond to staurosporine (STS) and beta-carotene.
    - reference_id: PMID:31753007
      supporting_text: None of the found associations were statistically significant after 
        correction for multiple testing.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - WRONG_ORTHOLOG_OR_PARALOG
      source_entities:
      - source_id: PANTHER:PTN002141596
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Humanin-family node. The ancestral antiapoptotic assertion is well placed for 
          humanin and for the synthetic HN5 peptide, but descent in this tree is descent of a 
          mitochondrial rRNA segment copied into the nucleus, and says nothing about whether this 
          copy is translated.
      - source_id: UniProtKB:P0CJ72
        source_label: MTRNR2L5
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: MTRNR2L5/HN5, the only nuclear humanin-like sequence with a functional assay. Its 
          synthetic peptide is cytoprotective [PMID:19477263], which supports the node; it does not 
          extend to a sibling locus with different residues and no peptide-level data.
