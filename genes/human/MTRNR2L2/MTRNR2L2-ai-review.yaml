id: P0CJ69
gene_symbol: MTRNR2L2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'MTRNR2L2 is a nuclear human locus on an unplaced scaffold of the reference assembly that
  resembles the humanin small open reading frame of the mitochondrial large-subunit rRNA gene MT-RNR2,
  one of thirteen such MT-RNR2-like sequences in the human genome that are generally interpreted as nuclear
  insertions of mitochondrial DNA. Its predicted product, humanin-like 2 (HN2), is a 28-residue peptide
  (MAPRGFSCLLLSTSEIDLPVKRLLSSVF) that matches humanin at 21 of 24 aligned positions, differing by Leu12->Ser,
  Arg23->Leu and Ala24->Leu, plus a four-residue C-terminal extension (SSVF). The locus is transcribed:
  RT-PCR detects it in human tissues, most strongly in testis, with expression also in kidney, heart,
  skeletal muscle and brain, and its transcript level changes after staurosporine and beta-carotene treatment
  of cultured cells (down-regulated 6 h and up-regulated 24 h after staurosporine, and transiently up-regulated
  by beta-carotene). Whether a peptide is actually made from this transcript, and what it does, is unestablished:
  no HN2 peptide has been detected in human tissue or fluid, no molecular activity has been measured for
  it, and no binding partner or receptor interaction has been reported. The humanin peptide from which
  it is named is cytoprotective and antiapoptotic, binds BAX, BID, BIM and IGFBP3 intracellularly and
  signals through FPRL1/FPR2 and a CNTFR-alpha/WSX-1/gp130 complex when secreted, but those properties
  were measured on the mitochondrially encoded peptide and on synthetic analogues of it, not on this gene
  product.'
