  review:
    summary: Maltose metabolism is compatible with GAA chemistry and the term’s glycogen-intermediate
      scope.
    action: KEEP_AS_NON_CORE
    reason: GO:0000023 explicitly includes maltose as an intermediate in glycogen and starch catabolism;
      it is not restricted to dietary digestion. The original IC infers this process from alpha-1,4-glucosidase
      activity, and PMID:29061980 directly measures human GAA maltose hydrolysis. PMID:9505277 establishes
      cellular glycogen correction rather than a separate maltose flux assay. Retain the inferred, non-core
      process with that distinction, instead of treating the lysosomal glycogen role as evidence against
      all maltose metabolism. No intestinal digestion role is asserted.
