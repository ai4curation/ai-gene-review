- question: Do endogenous GAA molecules associate directly with lysosomal or neutrophil-granule membranes,
    and what distinguishes peripheral association from co-fractionation?
- question: What fraction of detected urinary or EPS-urine GAA is enclosed within extracellular vesicles
    rather than surface-associated or co-isolated soluble material?
- question: Does the secondary carbohydrate pocket observed after proteolysis contribute to glycogen binding
    or processivity in endogenous mature GAA?
- question: Which original measurements underlie the classic glycophagy, lysosome-organization and diaphragm-contraction
    annotations, and do the diaphragm data establish participation beyond downstream storage pathology?
- question: Is there a physiological sucrose-processing context for GAA beyond the currently supported
    glycogen, maltose and isomaltose chemistry?
suggested_experiments:
- description: Measure cleavage of structurally defined branched glycogen substrates by mature human GAA,
    separating alpha-1,4 and alpha-1,6 turnover without extrapolating the disaccharide specificity ratio
    to whole polymers.
- description: Combine density-resolved extracellular-vesicle isolation with protease protection, detergent
    controls and target-specific GAA detection to distinguish enclosed, surface-associated and soluble
    co-isolated protein.
