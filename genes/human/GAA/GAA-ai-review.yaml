id: P10253
gene_symbol: GAA
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: GAA encodes lysosomal acid alpha-glucosidase, a glycoside hydrolase family 31 enzyme that
  releases glucose from glycogen in the acidic lysosomal lumen. It cleaves terminal alpha-1,4 linkages
  and the alpha-1,6 linkages needed to clear glycogen branches. The glycosylated precursor is targeted
  through mannose-6-phosphate-dependent trafficking and undergoes proteolytic maturation into active lysosomal
  forms. Deficient GAA activity causes Pompe disease, with lysosomal glycogen accumulation and prominent
  cardiac, skeletal-muscle and respiratory manifestations.
