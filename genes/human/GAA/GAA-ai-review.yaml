  review:
    summary: Autolysosome-lumen activity is a plausible, curated specialized localization of lysosomal
      GAA.
    action: KEEP_AS_NON_CORE
    reason: The literal mouse P70699 donor has an experimental is_active_in autolysosome-lumen record,
      and the human annotation preserves the specified orthology identifiers. Human GAA is delivered to
      and active in the lysosomal lumen; autolysosomal glycogen degradation is compatible with that established
      activity. Retain this specialized compartment as non-core without replacing the original relation
      or claiming that the human source directly imaged autolysosomes. The official donor-record reading
      did not independently verify the full donor experiment.
