alternative_products:
- id: P38435-1
  name: '1'
  sequence_note: Displayed 758-residue sequence; direct official FASTA and canonical sequence agree.
- id: P38435-2
  name: '2'
  sequence_note: 701 residues; lacks canonical positions 15–71 through the declared VSP_046179 alternative sequence. The reconstructed sequence exactly matches the direct official isoform FASTA.
suggested_questions:
- question: Which original experiment in PMID:17073445 supports the negative regulation of neurotransmitter secretion claim and its osteocalcin-input extension, separately from the directly measured catalytic chemistry?
  experts:
  - GO annotation curators
  - Original study authors
- question: Which original experiments support the mouse-derived neurotransmitter-secretion, bone-development and testosterone-biosynthesis annotations? PMID:25264202 is currently available only as an authentic abstract.
  experts:
  - Bone-endocrine biology specialists
  - GO annotation curators
- question: Does the sequence-verified 701-residue splice product retain membrane insertion and coupled carboxylation/epoxidation activity, and where is it expressed relative to the 758-residue product?
  experts:
  - Vitamin K enzymology specialists
  - Transcript and protein isoform curators
- question: How are successive glutamate residues positioned for modification, and which proposed proton-transfer and bicarbonate-dependent steps are directly supported beyond structural models and mutational effects?
  experts:
  - GGCX structural enzymologists
suggested_experiments:
- description: Compare sequence-verified 758- and 701-residue human products at matched abundance, measuring endoplasmic-reticulum membrane topology, protein-substrate carboxylation and vitamin K epoxide production separately.
  hypothesis: The amino-terminal deletion changes membrane organization or coupling efficiency without necessarily eliminating every catalytic readout.
- description: Measure carboxylation of defined individual substrate residues together with vitamin K epoxide formation during controlled substrate-loading and release experiments.
  hypothesis: Substrate recognition and modification order can be distinguished from an epoxidation-only proxy for productive carboxylation.
