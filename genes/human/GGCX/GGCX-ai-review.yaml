  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Authentic abstract establishes a cloned human 758-residue enzyme and increased microsomal carboxylase activity after cDNA expression. Original Methods were inaccessible. The historical predicted topology and lipoxygenase sequence similarity do not establish a second enzymatic function.
