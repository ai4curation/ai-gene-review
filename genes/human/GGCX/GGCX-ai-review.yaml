id: P38435
gene_symbol: GGCX
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Vitamin K-dependent gamma-carboxylase is an endoplasmic-reticulum membrane enzyme that converts protein-bound glutamate to gamma-carboxyglutamate while oxidizing vitamin K hydroquinone to vitamin K epoxide. Its membrane-associated catalytic machinery recognizes substrate propeptides and modifies glutamate-rich regions on the lumenal side of the endoplasmic reticulum. This modification enables calcium-dependent functions of coagulation proteins and other substrates, including osteocalcin and matrix Gla protein. Impaired GGCX activity can cause combined vitamin K-dependent coagulation-factor deficiency and connective-tissue phenotypes. Alternative splicing produces 758- and 701-residue proteins; the physiological activity of the shorter product remains unresolved.
core_functions:
- description: Catalyzes vitamin K-dependent gamma-carboxylation of protein glutamate residues at the endoplasmic-reticulum membrane, coupled to oxidation of vitamin K hydroquinone. These are two chemical aspects of one catalytic function.
  molecular_function:
    id: GO:0008488
    label: gamma-glutamyl carboxylase activity
  directly_involved_in:
  - id: GO:0017187
    label: peptidyl-glutamic acid carboxylation
  - id: GO:0042373
    label: vitamin K metabolic process
  locations:
  - id: GO:0005789
    label: endoplasmic reticulum membrane
  supported_by:
  - reference_id: PMID:1749935
