    full_text_unavailable: true
- id: PMID:9166845
  title: Genomic sequence and transcription start site for the human gamma-glutamyl carboxylase.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Identity and complete abstract verified. Human locus organization and transcript starts are distinguished from the separately reported bovine tissue expression measurements. Two transcripts differ by a 3-prime untranslated Alu sequence; this does not establish two protein isoforms or explain the natural 701-residue deletion product.
  full_text_unavailable: true
- id: PMID:9845520
  title: A missense mutation in gamma-glutamyl carboxylase gene causes combined deficiency of all vitamin K-dependent blood coagulation factors.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Authentic abstract links a human recessive coagulation-factor deficiency to defective carboxylase and reports reduced activity after expression in Drosophila cells. Its initial amino-acid wording conflicts with the stated codons; the concluding L394R agrees with canonical Leu394. Original Methods were inaccessible; reduced activity is not complete catalytic loss.
  full_text_unavailable: true
  findings:
  - statement: The disease-associated enzyme retained reduced activity in the reported expression assay.
    supporting_text: threefold reduced activity compared with WT carboxylase
    reference_section_type: ABSTRACT
    full_text_unavailable: true
- id: PMID:10910912
  title: A topological study of the human gamma-glutamyl carboxylase.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Authentic abstract reports terminal-tag mapping of full-length carboxylase in 293 cells and segment reporters translated with canine microsomes. It supports an ER membrane protein with cytoplasmic amino terminus and lumenal carboxyl terminus. The original Methods were inaccessible; the historical crossing estimate is not a modern complete structural map or evidence for a freely soluble lumenal protein.
  full_text_unavailable: true
  findings:
  - statement: Terminal-tag experiments placed the carboxyl terminus on the ER lumenal side.
    supporting_text: 'the

      carboxyl-terminus is on the lumenal side'
    reference_section_type: ABSTRACT
    full_text_unavailable: true
