- term:
    id: GO:0001954
    label: positive regulation of cell-matrix adhesion
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P22646
  - ensembl:ENSMUSP00000099896
  review:
    summary: Derived from the SKAP-55 study, in which TCR/CD3 ligation was used to trigger integrin adhesion.
      SKAP-55 and ADAP are the proteins shown to regulate integrin adhesion; CD3E is the upstream receptor
      subunit used as the stimulus.
    action: MARK_AS_OVER_ANNOTATED
    reason: TCR-triggered inside-out integrin activation is a downstream consequence of TCR-CD3 signaling,
      not an activity of CD3E itself. The cited paper characterizes SKAP-55; the adhesion regulators are
      SKAP-55/ADAP. Annotating every receptor subunit upstream of inside-out signaling with adhesion-regulation
      terms over-extends CD3E's role.
    supported_by: &id001
    - reference_id: PMID:12652296
      supporting_text: SKAP-55 regulates integrin-mediated adhesion and conjugate formation between T
        cells and antigen-presenting cells (APCs).
