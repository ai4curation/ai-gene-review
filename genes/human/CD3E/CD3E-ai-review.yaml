  evidence_type: TAS
  original_reference_id: PMID:8530500
  qualifier: involved_in
  review:
    action: MARK_AS_OVER_ANNOTATED
    summary: The source supports TCR-associated kinase signaling rather than the specified
      receptor-kinase pathway.
    reason: GO:0007169 requires a cell-surface receptor that possesses tyrosine kinase activity.
      The cited report describes anti-CD3-triggered signaling, G-alpha-q/11 nucleotide exchange
      and regulation involving associated protein tyrosine kinases; these are not receptor-intrinsic
      kinase chemistry. CD3 epsilon recruits kinases within a nonenzymatic receptor complex.
      This source-specific term mismatch supports overannotation, not a claim that CD3E could
      never influence another receptor pathway. The original full Methods remain inaccessible.
    supported_by:
    - reference_id: PMID:8530500
    - reference_id: PMID:28659468
