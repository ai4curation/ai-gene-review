  evidence_type: TAS
  original_reference_id: PMID:8530500
  qualifier: involved_in
  review:
    action: UNDECIDED
    summary: The reported G-protein coupling merits source-specific uncertainty.
    reason: The original abstract reports G-alpha-q/11 nucleotide exchange, CD3-epsilon association
      and G-alpha11-dependent PLC-beta signaling after anti-CD3 stimulation. GO:0007186 defines
      receptor-promoted GDP/GTP exchange on an associated heterotrimeric G protein and does
      not explicitly impose a seven-transmembrane topology. Thus the term cannot be rejected
      solely from CD3E architecture. The complete original coupling controls and construct
      context remain inaccessible; retain uncertainty about this particular assignment rather
      than declaring the observation impossible or unreplicated.
