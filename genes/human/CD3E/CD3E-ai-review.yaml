suggested_questions:
- question: Which human neural cell contexts preserve the mouse CD3-epsilon localization and
    developmental roles, and can an epsilon-specific rescue separate them from loss of other
    CD3 subunits?
- question: What exact CD3E perturbation and expression endpoints underlie the two IMP mappings
    to PMID:23817958, whose accessible abstract does not expose those assays?
- question: How do native human CD3-epsilon phosphorylation states control competition among
    LCK, NCK, ZAP70 and CSK at physiological receptor occupancy, separately from phosphomimetic
    mutants and CAR constructs?
- question: Which ITPRIPL1 concentrations and cellular presentation states engage native human
    CD3 epsilon, and how does this inhibitory input interact with LAG3-associated regulation?
suggested_experiments:
- hypothesis: Distinct CD3-epsilon recruitment interfaces coordinate receptor assembly and
    signal strength without intrinsic kinase chemistry.
  description: Use expression-matched human CD3E knock-in mutants with surface-receptor controls,
    timed phosphoproteomics and partner-specific binding measurements to separate assembly
    effects from recruitment and signaling effects.
  experiment_type: genetic and biochemical
