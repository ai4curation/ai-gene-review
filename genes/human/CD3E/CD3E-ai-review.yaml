id: P07766
gene_symbol: CD3E
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CD3 epsilon is an invariant single-pass type I transmembrane subunit of the T cell antigen
  receptor (TCR-CD3) complex, expressed by T cells and their precursors. It carries an extracellular Ig-like
  domain, a transmembrane segment with an acidic residue that packs against the TCR chains, and a cytoplasmic
  tail containing one immunoreceptor tyrosine-based activation motif (ITAM), a proline-rich sequence and
  a basic residue-rich stretch. CD3E forms obligate heterodimers with CD3D and CD3G; these CD3de and CD3ge
  dimers, together with the CD3 zeta homodimer, assemble with TCR alpha/beta (or gamma/delta) in the endoplasmic
  reticulum, and CD3E is required for assembly and surface expression of the pre-TCR and TCR. After antigen
  recognition by the TCR, the CD3E ITAM is phosphorylated by LCK/FYN and then recruits the tandem SH2
  kinases ZAP70 and SYK, while a ligand-induced conformational change exposes the proline-rich PxxDY motif,
  which binds the SH3 domains of NCK1/NCK2 (and EPS8-family proteins) before tyrosine phosphorylation,
  which then blocks it. CD3E also carries endocytosis signals for TCR-CD3 internalization, and it can
  serve as a receptor for the inhibitory ligand ITPRIPL1. Biallelic CD3E loss-of-function causes a T cell-negative,
  B cell-positive, NK cell-positive severe combined immunodeficiency (IMD18).
