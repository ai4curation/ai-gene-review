id: P07766
gene_symbol: CD3E
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CD3 epsilon is a single-pass membrane subunit of the T-cell antigen-receptor
  complex. Its extracellular and transmembrane contacts assemble CD3 gamma-epsilon and delta-epsilon
  heterodimers with the clonotypic receptor, while its cytoplasmic basic region, proline-rich
  sequence and ITAM recruit signaling proteins including LCK, NCK, ZAP70 and SYK. CD3 epsilon
  coordinates these interactions without intrinsic kinase activity. Ligand recognition by the
  clonotypic chains is thereby coupled to T-cell signaling; CD3 epsilon also receives an inhibitory
  input from ITPRIPL1 and participates in LAG3-associated regulation of the receptor. CD3E
  disruption causes immunodeficiency 18, a T-B+NK+ severe combined immunodeficiency.
