suggested_questions:
- question: Does the proposed ITPRIPL1-CD3E interaction occur at physiological ligand densities in human
    tumors, and does it signal through NCK recruitment to the CD3E proline-rich sequence as suggested,
    independently of TCR engagement?
- question: Which of the CD3E-dependent GO terms (MHC class II receptor activity contributes_to; positive/negative
    regulation of gene expression from PMID:23817958) reflect CD3E activity, as opposed to anti-CD3 antibodies
    used as a T cell stimulus? The full texts are needed to adjudicate these experimental annotations.
- question: Should the mouse neuronal CD3 annotations (dendrite development, cerebellum development, dendritic
    spine) be propagated to human CD3E by Ensembl Compara, given that they derive from phenotypes rather
    than a defined molecular activity?
suggested_experiments:
- hypothesis: The CD3E basic residue-rich sequence and PxxDY motif act as a sequential switch that couples
    TCR engagement first to NCK and then, after Y166 phosphorylation, to ZAP70.
  description: Knock-in of CD3E PxxDY (Y166F, P-to-A) and basic-rich sequence mutants into CD3E-deficient
    human T cells, followed by proximity labeling and phosphoproteomics after pMHC stimulation, to resolve
    the timing of NCK, LCK and ZAP70 recruitment.
  experiment_type: genetic and proteomic
