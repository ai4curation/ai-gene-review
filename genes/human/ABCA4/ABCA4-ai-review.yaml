- term:
    id: GO:0007603
    label: phototransduction, visible light
  evidence_type: TAS
  original_reference_id: PMID:9202155
  qualifier: involved_in
  review:
    summary: The complete 1997 article establishes rim-protein identity and localization, while presenting
      ion transport and photoresponse functions as unresolved hypotheses.
    action: MARK_AS_OVER_ANNOTATED
    reason: The full Wiley article was recovered and read after the initial abstract-only assessment.
      Its discussion speculates about calcium handling and light-stimulated ATPase activity; it does
      not establish that ABCA4 converts absorbed photons into a molecular signal. Later direct experiments
      identify NRPE and PE transport supporting retinoid clearance. Thus the legacy phototransduction
      assignment exceeds the demonstrated role, although ABCA4 contributes to the maintenance of vision.
    supported_by:
    - reference_id: PMID:9202155
      supporting_text: may play a role in the photoresponse.
      supporting_text_fulltext: The function of RmP in photoreceptors remains a critical open question.
    - *id001
