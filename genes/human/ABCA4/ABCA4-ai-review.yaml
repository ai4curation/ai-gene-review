- term:
    id: GO:0003924
    label: GTPase activity
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: enables
  supporting_entities:
  - UniProtKB:F1MWM0
  review:
    summary: ABCA4 has experimentally demonstrated GTPase capacity in the bovine ortholog used as the
      ISS donor.
    action: KEEP_AS_NON_CORE
    reason: The WITH/FROM donor is reviewed bovine ABCA4 F1MWM0, whose GTPase IDA points to PMID:10767284.
      That study directly measured GTP hydrolysis, and PMID:22735453 found GTP could partly replace ATP
      in transport. Retain this biochemical capacity as non-core because physiological GTP-driven transport
      in human photoreceptors is not established.
    supported_by:
    - reference_id: PMID:10767284
      supporting_text: We have examined the ATPase and GTPase activity of detergent-solubilized and reconstituted
        ABCR.
    - reference_id: PMID:22735453
      supporting_text: GTP could partially substitute for ATP, whereas ADP and GDP showed substantially
        reduced activity.
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
      - source_id: UniProtKB:F1MWM0
        source_label: ABCA4 (Bos taurus)
        source_status: SUPPORTS_TRANSFER
        comment: Live UniProt and QuickGO trace the bovine GTPase IDA to PMID:10767284; its accessible
          abstract explicitly reports ATPase and GTPase assays. This is supported nucleotidase promiscuity,
          not a mistaken transfer from a small GTPase.
