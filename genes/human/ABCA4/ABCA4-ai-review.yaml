id: P78363
gene_symbol: ABCA4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ABCA4 is a large ATP-binding cassette lipid flippase concentrated in the rim and incisure
  regions of rod and cone photoreceptor outer-segment discs, with additional expression in retinal pigment
  epithelium. Its two cytoplasmic nucleotide-binding domains power the movement of N-retinylidene-phosphatidylethanolamine
  (NRPE), formed from retinal and phosphatidylethanolamine, from the lumenal to the cytosolic leaflet
  of disc membranes. Both all-trans and 11-cis retinal adducts are substrates. This exposes the adduct
  to the cytosolic side, where its dissociation and subsequent retinal reduction limit accumulation of
  reactive retinal and bisretinoid precursors. ABCA4 also flips phosphatidylethanolamine in the same direction.
  Biallelic pathogenic variants cause ABCA4-related retinopathy, including Stargardt macular dystrophy
  and a broader cone-rod degeneration spectrum, through impaired transport, substrate recognition, folding
  or trafficking.
