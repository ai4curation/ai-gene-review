  review:
    summary: ABCA4 participates in retinal/retinoid handling by moving the retinal-PE adduct to the cytosolic
      disc leaflet for subsequent retinal release and reduction.
    action: ACCEPT
    reason: This is a direct transport step in the retinoid metabolic pathway, supported by reconstitution
      and variant studies. ABCA4 does not itself reduce retinal to retinol or catalyze the chemical cis/trans
      isomerization.
