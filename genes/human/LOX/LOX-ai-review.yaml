    label: extracellular matrix
  supported_by:
  - reference_id: PMID:1685472
    supporting_text: Lysyl oxidase (EC 1.4.3.13) initiates the crosslinking of collagens
      and elastin by catalyzing oxidative deamination of the epsilon-amino group in
      certain lysine and hydroxylysine residues.
  - reference_id: PMID:1357535
    supporting_text: This is the first step in the covalent cross-linking of collagen
      and tropoelastin and results in the formation of insoluble collagen and elastic
      fibers in the extracellular matrix.
  - reference_id: PMID:31152061
    supporting_text: the initial step in the formation of covalent collagen cross-links,
      an essential process for fibril stabilization
  - reference_id: PMID:26838787
    supporting_text: Expression of the LOX variants p.Ser280Arg and p.Ser348Arg resulted
      in significantly lower lysyl oxidase activity when compared with the wild-type
      protein.
knowledge_gaps:
- gap_statement: >-
    The quantitative substrate partitioning of endogenous human LOX among collagen
    types, elastin, and the corresponding LOXL-family enzymes in the aortic wall is
    unresolved.
  boundary: >-
    Human sequence and biochemical evidence establish oxidation of collagen and
    elastin substrates, and human loss-of-function variants establish aortic-disease
    relevance. They do not identify which native matrix sites are modified by LOX
    rather than another lysyl oxidase, or quantify the relative contribution of each
    substrate class in human aortic tissue.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    Resolving enzyme-specific substrates is necessary to connect reduced LOX activity
    to the collagen and elastic-lamella defects that weaken the human aortic wall.
  resolution: >-
    Map LOX-dependent allysine, hydroxyallysine, and mature cross-links in primary
    human aortic matrix after selective LOX perturbation, with orthogonal control of
    LOXL paralog activity and rescue by wild-type or catalytic-dead LOX.
  provenance:
  - reference_id: PMID:26838787
    supporting_text: These data, along with previous studies showing that the deficiency
      of LOX in mice or inhibition of lysyl oxidases in turkeys and rats causes aortic
      dissections, support the conclusion that rare genetic variants in LOX predispose
      to thoracic aortic disease.
- gap_statement: >-
    How BMP1 cleavage, downstream ADAMTS2/14 cleavage, tyrosine sulfation, and
    propeptide-mediated recruitment are coordinated to partition LOX between collagen
    and elastin substrates in native human tissues is not known.
  boundary: >-
    Expressed-LOX experiments in murine skin fibroblasts and HEK293 cells show that
    ADAMTS2/14 processing and sulfated tyrosines affect collagen binding. Recombinant
    interaction studies support fibulin-4/tropoelastin targeting through the
    propeptide, but do not establish the timing, stoichiometry, or tissue-specific
    balance of these events in vivo.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    Form-specific targeting may determine which extracellular-matrix substrate is
    cross-linked and could explain why defects in LOX processing or recruitment
    preferentially disrupt particular connective tissues.
  resolution: >-
    Quantify endogenous long and short mature LOX forms, sulfation states, and transient
    substrate associations in human matrix-producing cells and organoids while
    perturbing BMP1, ADAMTS2/14, and EFEMP2 independently.
  provenance:
  - reference_id: PMID:31152061
    supporting_text: We noted that the LOX sequence between the BMP1- and ADAMTS-processing
      sites contains several conserved tyrosine residues, of which some are post-translationally
      modified by tyrosine O-sulfation and contribute to binding to collagen.
  - reference_id: PMID:19855011
    supporting_text: We also found a specific interaction between FBLN4 and the propeptide
      of LOX, which efficiently promotes assembly of LOX onto tropoelastin.
- gap_statement: >-
    The physiological functions of released LOX-PP, and whether endogenous mature LOX
    has any normal intracellular or nuclear activity, remain unresolved.
  boundary: >-
    Recombinant LOX-PP binds numerous molecules in vitro and ectopic LOX-PP alters
    signaling in lung-cancer cells. Nuclear accumulation of the LOX catalytic domain
    was observed after co-expression with p66β in tumor cells, but these experiments
    do not demonstrate a native nuclear pool or physiological nuclear catalysis.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    Separating precursor, mature-enzyme, and released-propeptide effects is essential
    to prevent extracellular catalytic activity from being conflated with proposed
    intracellular signaling roles.
  resolution: >-
    Use form-specific endogenous tags and cleavage-resistant alleles to track proLOX,
    mature LOX, and LOX-PP in normal human cells, then test whether any nuclear pool is
    catalytically active and required for a reproducible phenotype at endogenous levels.
  provenance:
  - reference_id: PMID:21690299
    supporting_text: In H1299 lung cancer cells, ectopic LOX-PP expression reduced the
      nuclear levels of PIC by increasing its turnover in the lysosome, thereby decreasing
      the nuclear levels and transcriptional activity of β-catenin while increasing
      β-catenin membrane localization.
  - reference_id: PMID:25118846
    supporting_text: Moreover, co-expression of p66β and LOX in living tumor cells leads
      to the nuclear accumulation of LOX.
proposed_new_terms: []
suggested_questions:
- question: >-
    Which collagen and elastin lysine or hydroxylysine sites are modified specifically
    by LOX, rather than LOXL paralogs, in the normal and aneurysmal human aortic wall?
- question: >-
    How do BMP1 and ADAMTS2/14 cleavage, tyrosine sulfation, and fibulin-4-dependent
    recruitment control the distribution of LOX activity between collagen fibrils and
    elastic fibers in vivo?
- question: >-
    Does released endogenous LOX-PP have a reproducible physiological signaling
    function, and is any endogenous nuclear LOX pool catalytically active in normal
    human cells?
suggested_experiments:
- hypothesis: >-
    LOX modifies a defined subset of collagen and elastin sites in human aortic matrix
    that is not redundantly oxidized by LOXL paralogs.
  description: >-
    Engineer selective LOX knockout or acute degradation in primary human aortic
    smooth-muscle cells and matrix-producing vascular organoids, then quantify
    site-resolved allysine, hydroxyallysine, and mature cross-links by mass spectrometry.
    Compare wild-type, catalytic-dead, and disease-variant rescue while measuring LOXL
    expression and activity as paralog controls.
  experiment_type: genome editing and matrix cross-link proteomics
- hypothesis: >-
    Proteolytic processing and tyrosine sulfation direct LOX toward collagen, whereas
    the intact propeptide and fibulin-4 favor tropoelastin targeting.
  description: >-
    Introduce endogenous cleavage-site and sulfotyrosine-site substitutions in human
    fibroblasts or vascular organoids, perturb EFEMP2, and use pulse-chase labeling,
    form-specific immunoprecipitation, proximity labeling, and collagen/elastin
    cross-link measurements to distinguish transient substrate targeting from stable
    complex formation.
  experiment_type: endogenous protein processing and substrate-targeting analysis
- hypothesis: >-
    Reported LOX-PP signaling and nuclear LOX phenotypes require nonphysiological
    overexpression and are absent at endogenous abundance in normal human cells.
  description: >-
    Tag the endogenous precursor on each side of the BMP1 cleavage site to track the
    mature enzyme and LOX-PP separately, quantify their extracellular and intracellular
    pools, and compare endogenous perturbation with matched overexpression in normal and
    tumor-derived cells. Test nuclear oxidase activity, β-catenin output, and rescue with
    secretion-defective, cleavage-resistant, and catalytic-dead alleles.
  experiment_type: form-specific endogenous localization and functional analysis
