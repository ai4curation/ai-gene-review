    supporting_text: This cDNA encodes a polypeptide of 417 amino acid residues, including
      a signal peptide of 21 amino acids.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
