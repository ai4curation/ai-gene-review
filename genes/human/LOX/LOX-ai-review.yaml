      be transferred to the mature catalytic enzyme.
- id: PMID:31152061
  title: Differential cleavage of lysyl oxidase by the metalloproteinases BMP1 and
    ADAMTS2/14 regulates collagen binding through a tyrosine sulfate domain.
  findings:
  - statement: BMP1 activates proLOX, whereas ADAMTS2/14 make a second downstream
      cleavage in expressed LOX.
    supporting_text: In this study, using murine skin fibroblasts and HEK293 cells,
      along with immunoprecipitation, LOX enzymatic activity, solid-phase binding assays,
      and proteomics analyses, we report that the LOX precursor is proteolytically
      processed by the procollagen N-proteinases ADAMTS2 and ADAMTS14 between Asp-218
      and Tyr-219, 50 amino acids downstream of the BMP1 cleavage site.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: Sulfated tyrosines in the segment between the BMP1 and ADAMTS cleavage
      sites contribute to LOX collagen binding.
    supporting_text: We noted that the LOX sequence between the BMP1- and ADAMTS-processing
      sites contains several conserved tyrosine residues, of which some are post-translationally
      modified by tyrosine O-sulfation and contribute to binding to collagen.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct processing, activity, binding, and proteomics study in murine
      skin fibroblasts and HEK293 cells. Abstract only in the local cache despite a
      PMCID; title and quotes verified.
- id: PMID:27432961
  title: Loss of function mutation in LOX causes thoracic aortic aneurysm and dissection
    in humans.
  findings:
  - statement: A human LOX missense allele segregates with thoracic aortic disease,
      and the homologous engineered mouse allele disrupts elastic lamellae and causes
      severe aortic disease when homozygous.
    supporting_text: Mutant mice that were heterozygous for the human allele displayed
      disorganized ultrastructural properties of the aortic wall characterized by fragmented
      elastic lamellae, whereas mice homozygous for the human allele died shortly after
      parturition from ascending aortic aneurysm and spontaneous hemorrhage.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: The authors infer that insufficient collagen and elastin cross-linking
      explains LOX-associated aortic-wall weakness.
    supporting_text: These data suggest that a missense mutation in LOX is associated
      with aortic disease in humans, likely through insufficient cross-linking of elastin
      and collagen in the aortic wall.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Independent human segregation plus knock-in mouse model. The cache
      contains only the abstract; its title and quotes were verified. The cross-linking
      mechanism is explicitly presented as a likely inference, so it supports physiological
      relevance without replacing direct biochemical evidence.
