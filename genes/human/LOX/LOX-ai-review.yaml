  title: LOX Mutations Predispose to Thoracic Aortic Aneurysms and Dissections.
  findings:
  - statement: Human disease-associated catalytic-domain LOX variants have significantly
      reduced lysyl oxidase activity.
    supporting_text: Expression of the LOX variants p.Ser280Arg and p.Ser348Arg resulted
      in significantly lower lysyl oxidase activity when compared with the wild-type
      protein.
    reference_section_type: ABSTRACT
    full_text_unavailable: false
  - statement: Rare LOX variants predispose to thoracic aortic disease, supporting
      a physiological requirement for LOX in aortic-wall integrity.
    supporting_text: These data, along with previous studies showing that the deficiency
      of LOX in mice or inhibition of lysyl oxidases in turkeys and rats causes aortic
      dissections, support the conclusion that rare genetic variants in LOX predispose
      to thoracic aortic disease.
    reference_section_type: ABSTRACT
    full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct human genetics plus biochemical assays of expressed LOX variants;
      full text available and quotes verified. Disease establishes physiological importance
      but is not itself a molecular function.
