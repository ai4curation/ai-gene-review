- id: PMID:18586678
  title: Lysyl oxidase oxidizes cell membrane proteins and enhances the chemotactic
    response of vascular smooth muscle cells.
  findings:
  - statement: In cultured rat aortic smooth-muscle cells, inhibiting LOX reduced
      chemotaxis toward LOX and PDGF-BB, while sub-chemotactic LOX enhanced the PDGF-BB
      response.
    supporting_text: Here we demonstrate that inhibition of LOX activity by beta-aminopropionitrile
      (BAPN) in cultured rat aortic smooth muscle cells (SMCs) reduced the chemotactic
      response and sensitivity of these cells toward LOX and toward PDGF-BB. The chemotactic
      activity of PDGF-BB was significantly enhanced in the presence of a non-chemotactic
      concentration of LOX.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: LOX-dependent oxidation of cell-surface PDGFR-beta altered ligand binding
      and downstream signaling kinetics in rat SMCs, with LOX-knockout mouse embryonic
      fibroblasts providing orthogonal support.
    supporting_text: These novel findings suggest that LOX activity is essential to
      generate optimal chemotactic sensitivity of cells to chemoattractants by oxidizing
      specific cell surface proteins, such as PDGFR-beta.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary mechanistic evidence for LOX involvement in PDGFR-beta-dependent
      signaling and chemotaxis. Experiments in the cached abstract are cultured rat aortic
      SMCs and LOX-knockout mouse embryonic fibroblasts, not human cells; only the abstract
      is available locally.
- id: PMID:19570982
