  findings:
  - statement: Human fibulin-4 directly binds LOX and promotes a ternary complex with
      tropoelastin that can target elastin cross-linking.
    supporting_text: Novel findings are that fibulin-4 directly binds LOX, and this
      interaction enhances fibulin-4 binding to tropoelastin, thus forming a ternary
      complex that may be critical for elastin cross-linking.
    reference_section_type: INTRODUCTION
    full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full-text biochemical interaction study using recombinant human elastic-fiber
      proteins; directly supports LOX-fibulin-4 binding and elastic-fiber targeting.
