- id: file:human/LOX/LOX-uniprot.txt
  title: UniProtKB reviewed entry P28300 (LYOX_HUMAN), protein-lysine 6-oxidase
  findings:
  - statement: Curated human LOX function is oxidative deamination of peptidyl lysines
      in collagen and elastin precursors.
    supporting_text: Responsible for the post-translational oxidative deamination of
      peptidyl lysine residues in precursors to fibrous collagen and elastin
    reference_section_type: DATABASE_ENTRY
  - statement: Curated human LOX localization is secreted extracellular space.
    supporting_text: Secreted, extracellular space.
    reference_section_type: DATABASE_ENTRY
  - statement: BMP1 removes the LOX propeptide, while ADAMTS2 and ADAMTS14 make an
      additional downstream cleavage.
    supporting_text: Proteolytically cleaved by BMP1 which removes the propeptide
      (PubMed:31152061). Also proteolytically cleaved by ADAMTS2 and ADAMTS14, but
      not by ADAMTS3, at an additional cleavage site downstream of the BMP1 cleavage
      site (PubMed:31152061).
    reference_section_type: DATABASE_ENTRY
  - statement: Differential LOX processing regulates collagen binding.
    supporting_text: Cleavage by BMP1 to remove the propeptide does not increase enzymatic
      activity but increases binding to collagen (PubMed:31152061). Cleavage by ADAMTS2
      produces a form with reduced collagen-binding activity (PubMed:31152061).
    reference_section_type: DATABASE_ENTRY
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Reviewed UniProtKB record for human LOX; exact source for the function,
      extracellular-localization, and proteolytic-processing statements cited by annotation
      evidence items in this review.
- id: PMID:1352776
  title: Characterization of the human lysyl oxidase gene locus.
  findings:
  - statement: Human LOX is a copper-dependent collagen- and elastin-cross-linking enzyme;
      the locus produces multiple alternatively spliced transcripts.
    supporting_text: Lysyl oxidase (EC 1.4.3.13) is a copper-dependent enzyme acting
      principally on collagen and elastin catalyzing the formation of aldehyde cross-links.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Human gene-locus paper; the enzyme statement is background and the
      direct experimental contribution is gene organization/transcript analysis. Abstract
      only in cache; title and quote verified.
- id: PMID:1357535
  title: The complete derived amino acid sequence of human lysyl oxidase and assignment
    of the gene to chromosome 5 (extensive sequence homology with the murine ras recision
    gene).
  findings:
  - statement: Human LOX oxidizes lysine to an aldehyde that initiates covalent collagen
      and tropoelastin cross-linking in the extracellular matrix.
    supporting_text: Lysyl oxidase catalyzes the oxidation of lysine residues to alpha-aminoadipic-delta-semialdehyde.
      This is the first step in the covalent cross-linking of collagen and tropoelastin
      and results in the formation of insoluble collagen and elastic fibers in the extracellular
      matrix.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Foundational human sequence paper with a concise catalytic and ECM-cross-linking
      account; catalytic-domain localization is sequence-based. Abstract only in cache;
      title and quote verified.
- id: PMID:1685472
  title: Molecular cloning of human lysyl oxidase and assignment of the gene to chromosome
    5q23.3-31.2.
  findings:
  - statement: Human LOX initiates collagen and elastin cross-linking by oxidative
      deamination of selected lysine and hydroxylysine epsilon-amino groups.
    supporting_text: Lysyl oxidase (EC 1.4.3.13) initiates the crosslinking of collagens
      and elastin by catalyzing oxidative deamination of the epsilon-amino group in certain
      lysine and hydroxylysine residues.
