id: P28300
gene_symbol: LOX
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  LOX is a secreted, copper- and lysine-tyrosylquinone-dependent protein-lysine
  6-oxidase synthesized as a preproprotein. Extracellular proteolysis produces a
  mature C-terminal enzyme that oxidatively deaminates selected peptidyl lysine and
  hydroxylysine residues in collagen and elastin, generating aldehydes that initiate
  covalent cross-links and stabilize collagen fibrils and elastic fibers. Collagen
  targeting is regulated by precursor processing and tyrosine sulfation, while the
  propeptide participates in recruitment to tropoelastin before being released as the
  noncatalytic LOX propeptide (LOX-PP). Loss-of-function variants impair LOX activity
  and cause familial thoracic aortic aneurysm and dissection, consistent with an
  essential role in aortic-wall extracellular-matrix integrity.
