core_functions:
- description: >-
    After secretion and extracellular processing of proLOX, the mature C-terminal
    copper/LTQ enzyme oxidatively deaminates selected lysine and hydroxylysine side
    chains in collagen and elastin to allysine and hydroxyallysine. These aldehydes
    initiate covalent cross-link formation, thereby stabilizing collagen fibrils and
    elastic fibers. Substrate delivery is form- and processing-dependent: sulfated
    tyrosines retained in the long mature form promote collagen binding, whereas the
    propeptide can recruit proLOX to fibulin-4/tropoelastin assemblies before it is
    released. These targeting interactions are not treated as stable complex
    membership. The released LOX-PP is a distinct noncatalytic product, and reported
    tumor-cell or nuclear effects are not assigned to this extracellular catalytic
    activity. Human catalytic-domain variants with reduced enzyme activity predispose
    to thoracic aortic disease, supporting the physiological importance of this
    reaction for aortic-wall matrix integrity without making disease or blood-vessel
    morphogenesis a second molecular function.
  molecular_function:
    id: GO:0004720
    label: protein-lysine 6-oxidase activity
  directly_involved_in:
  - id: GO:0018057
    label: peptidyl-lysine oxidation
  - id: GO:0030199
    label: collagen fibril organization
  - id: GO:0048251
    label: elastic fiber assembly
  locations:
