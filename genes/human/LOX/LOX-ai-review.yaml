  - statement: Human LOX propeptide directly binds multiple extracellular-matrix
      proteins and matrix-associated enzymes in vitro.
    supporting_text: We have identified 17 new partners of LOX-PP including four GAGs
      (chondroitin sulfate, dermatan sulfate, heparan sulfate, hyaluronan), collagen
      I, cross-linking and proteolytic enzymes (lysyl oxidase-like 2, transglutaminase-2,
      and MMP-2), one proteoglycan (fibromodulin), one matricryptin (anastellin),
    reference_section_type: RESULTS
    full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full-text structural/interaction characterization of recombinant human
