  review:
    summary: 'Proposed location: CD16A is present and signals at the immunological synapse.'
    action: NEW
    reason: The record places CD16A at the plasma membrane and on its external side but never at the specialised
      contact where it does its work. Grier et al. identified the CD16-CD2 association both biochemically
