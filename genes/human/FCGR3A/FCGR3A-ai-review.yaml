core_functions:
- molecular_function:
    id: GO:0019772
    label: low-affinity IgG receptor activity
  description: 'Reading antibody bound to another cell and converting it into a cytotoxic or inflammatory
    response. CD16A binds the Fc region of IgG with low affinity, which tunes it to immune complexes and
    to opsonised cell surfaces rather than to the monomeric IgG that saturates plasma. It is a pure recognition
    and transduction module: it has no catalytic activity and no signalling motif of its own, and depends
    on assembly through its transmembrane segment with the CD247 (CD3 zeta) homodimer or the FcepsilonRI
    gamma chain, which supply the ITAMs and are also needed for surface expression. Downstream the receptor
    activates Syk, a calcium flux, PI3K/AKT and integrins, with a phosphorylation switch in its distinctive
    cytoplasmic domain partitioning cytokine production from degranulation. In NK cells the output is
    polarised release of perforin and granzyme B into the contact with the target, which is how this receptor
    connects to the other genes reviewed in this set; in monocytes and macrophages it is TNF-alpha and
    IL-1-alpha release. A second, antibody-independent route runs through an association with CD2. The
    activity is self-terminating, since activation triggers ADAM17 to shed the ectodomain.'
