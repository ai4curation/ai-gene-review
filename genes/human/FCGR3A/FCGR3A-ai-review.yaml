- term:
    id: GO:0005576
    label: extracellular region
  evidence_type: EXP
  original_reference_id: PMID:25816339
  qualifier: located_in
  review:
    summary: CD16A is shed from the NK cell surface by ADAM17, so part of the gene product is extracellular.
    action: ACCEPT
    reason: 'Correct, and for a specific and well-studied reason rather than as a generic ectodomain statement:
      CD16A is shed from the cell surface. ADAM17 cleaves its stalk region between Ala195 and Val196,
      releasing the soluble ectodomain, and shedding is triggered by NK cell activation. So a genuine
      pool of this gene product is extracellular and separate from the membrane-anchored receptor.'
    supported_by:
    - &id004
      reference_id: PMID:24337742
      supporting_text: We found that recombinant a disintegrin and metalloprotease (ADAM) 17 cleaved the
        ectodomain of FcγRIIIA/CD16A and a peptide for which the sequence encompasses aa 191-201 of the
        FcγRIIIA/CD16A stalk region but not ADAM10.
    - &id005
      reference_id: PMID:25816339
      supporting_text: CD16a is a potent activating receptor and despite blocking CD16a shedding, the
        S197P mutation did not disrupt IgG binding by the receptor or its activation of NK92 cells by
        antibody-treated tumor cells.
