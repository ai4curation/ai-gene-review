id: P08637
gene_symbol: FCGR3A
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'Low-affinity receptor for the Fc region of IgG and the receptor that makes antibody-dependent
  cellular cytotoxicity possible. FCGR3A encodes CD16A, a type I transmembrane glycoprotein with two immunoglobulin-like
  ectodomains, expressed on natural killer cells, gamma-delta T cells, macrophages and a CD16-positive
  subset of blood monocytes. It is distinguished from the closely related FCGR3B/CD16B of neutrophils,
  which is GPI-anchored, by a single residue that determines the membrane anchor. CD16A binds IgG weakly
  enough that it responds to immune complexes and to antibody-coated cells rather than to monomeric IgG,
  and it carries no signalling motif of its own: it must assemble through its transmembrane segment with
  the CD3 zeta (CD247) homodimer or with the FcepsilonRI gamma chain, which supply the ITAMs and are also
  required for surface expression. Engagement by antibody bound to a target cell triggers Syk activation,
  a calcium flux, PI3K/AKT signalling and integrin activation, and drives polarised release of perforin-
  and granzyme-containing cytolytic granules into the contact with the target, killing it. A phosphorylation
  switch in the receptor''s unusual cytoplasmic domain partitions these outputs, with the phosphorylated
  form favouring calcium flux and cytokine production and the unphosphorylated form favouring degranulation.
  Beyond killing, CD16A ligation drives NK cell proliferation and, on monocytes and macrophages, dominates
  the induction of TNF-alpha and IL-1-alpha by small immune complexes, which implicates it in rheumatoid
  inflammation. Its activity is self-limiting: activation triggers ADAM17 to cleave the stalk region between
  Ala195 and Val196, shedding the ectodomain, which disassembles the contact with the target and releases
  the cell to engage another. The receptor also supports antibody-independent killing through an association
  with the coactivation receptor CD2, and a homozygous L66H substitution that abolishes that association
  causes a human immunodeficiency with susceptibility to herpesvirus infection while leaving antibody-dependent
  killing intact. As the effector receptor for therapeutic IgG, it is central to the action of antibody
  drugs in oncology.'
existing_annotations:
- term:
    id: GO:0001788
    label: antibody-dependent cellular cytotoxicity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000159565
  - UniProtKB:A3RFZ7
  - UniProtKB:P08637
  review:
    summary: Phylogenetic propagation of antibody-dependent cellular cytotoxicity across the Fc-gamma
      receptor clade.
    action: ACCEPT
    reason: 'Core. CD16A is the receptor that makes antibody-dependent cellular cytotoxicity happen: it
      binds the Fc region of IgG on an opsonised target and transduces that into killing. Yeap et al.
      make the requirement explicit - monocytes lacking CD16 do not perform ADCC and acquire the ability
      when CD16 expression is induced - and the activity is the basis of the clinical effect of therapeutic
      antibodies. As a phylogenetic assertion it is secure: Fc receptor-driven cytotoxicity is the ancestral
      function of this family.'
    supported_by:
    - &id001
      reference_id: PMID:27670158
      supporting_text: CD16, the FcγRIIIA, is essential for ADCC by NK cells, and is also expressed by
        a subset of human blood monocytes.
    - &id002
      reference_id: PMID:27670158
      supporting_text: Monocytes lacking CD16 did not exert ADCC but acquired this property after CD16
        expression was induced by either cytokine stimulation or transient transfection.
