- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:23006327
  qualifier: enables
  supporting_entities:
  - UniProtKB:P06729
  review:
    summary: Bare protein binding; partner CD2 (UniProtKB:P06729).
    action: REMOVE
    reason: Bare protein binding carries no functional information and is removed under the project's
      protein-binding policy. Removal says the annotation is uninformative, not that the interaction is
      false. The interaction is real and mechanistically important - Grier et al. found CD16 associates
      with the coactivation receptor CD2 biochemically and at the immunological synapse, and the L66H
      immunodeficiency mutation abolishes that association and with it spontaneous cytotoxicity. What
      matters about it is captured by the cytotoxicity rows this review accepts, not by a term saying
      two proteins touch.
    supported_by:
    - &id015
      reference_id: PMID:23006327
      supporting_text: An association between CD16 and CD2 was identified biochemically and at the immunological
        synapse, which elicited CD16 signaling after CD2 engagement.
    - &id009
      reference_id: PMID:23006327
      supporting_text: Thus, CD16 serves a role in NK cell-mediated spontaneous cytotoxicity through a
        specific association with CD2 and represents a potential mechanism underlying a human congenital
        immunodeficiency.
