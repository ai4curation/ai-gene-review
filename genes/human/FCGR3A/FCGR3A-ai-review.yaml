    action: NEW
    reason: 'Offered deliberately, and with the contrast to perforin in view. This project removed this
      same term from PRF1 on the grounds that perforin is cargo released into a synapse built by other
      molecules and does none of the work of building it. CD16A is the other case: it is an activating
      receptor that binds antibody on the opposing cell surface, physically bridging the two membranes
      and triggering the cytoskeletal reorganisation that forms the contact. Srpan et al. show activation
      via CD16 triggering assembly of a cytolytic contact, and show the converse directly - shedding CD16
      increases NK cell motility, facilitates detachment from target cells, and disassembles the immune
      synapse - using a non-cleavable receptor to establish that it is the loss of CD16 itself that does
      this. That is participation, not mere requirement. Two caveats a curator should weigh. The paper''s
      framing is about disassembly, so the assembly claim rests on the contacts CD16 ligation produces
      rather than on a dedicated assembly experiment. And the same paper distinguishes the less stable,
      motile contact triggered by CD16 from the stable symmetrical synapse triggered by NKG2D, so if GO
      means only the stable form, this annotation may be too strong; the term''s own definition does not
      make that distinction.'
