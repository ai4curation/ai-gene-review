    supporting_text: CD16 (Fc gammaRIIIA), the low affinity receptor for IgG, is expressed on the majority
      of human peripheral blood NK cells.
  - reference_id: PMID:27670158
    supporting_text: CD16, the FcγRIIIA, is essential for ADCC by NK cells, and is also expressed by a
      subset of human blood monocytes.
  - reference_id: PMID:27670158
    supporting_text: Monocytes lacking CD16 did not exert ADCC but acquired this property after CD16 expression
      was induced by either cytokine stimulation or transient transfection.
  - reference_id: PMID:2532305
    supporting_text: Here we report that CD16, the receptor for the Fc (constant) region of IgG, specifically
      associates with the CD3 zeta homodimer on the membrane of human NK cells, and that co-transfection
      with CD3 zeta complementary DNA permits expression of a transmembrane-linked CD16 complex on COS-7
      cel
  - reference_id: PMID:23024279
    supporting_text: Phosphorylated CD16A mediates a more robust calcium flux, tyrosine phosphorylation
      of Syk, and proinflammatory cytokine production, whereas nonphosphorylatable CD16A is more effective
      at activation of the Gab2/PI3K pathway, leading to enhanced degranulation.
suggested_questions:
- question: Does CD16A belong on GO:0001771 immunological synapse formation? This review proposes it,
    on the grounds that the receptor bridges the two membranes and that shedding it disassembles the contact,
    and the same project removed that term from PRF1 because perforin is only cargo. But Srpan et al.
    distinguish the less stable motile contact triggered by CD16 from the stable symmetrical synapse triggered
    by NKG2D, so a curator may judge the term too strong for this receptor.
  experts:
  - Daniel M Davis
  - Katja Srpan
  - Jordan S Orange
- question: Is the shedding of CD16A by ADAM17 annotatable on FCGR3A at all? The receptor is the substrate
    of that cleavage, not a participant in it, so by the participation rule it should carry no proteolysis-related
    process term and this review proposed none - yet shedding is one of the most functionally consequential
    things that happens to this protein, and the GO mechanism for recording it would be has input on ADAM17.
  experts:
  - Bruce Walcheck
  - Gilles Thibault
- question: How much of the FCGR3A record should be read as FCGR3B? Several early CD16 papers study both
    isoforms, and FCGR3A and FCGR3B differ mainly in their membrane anchor. The annotations cited here
    are appropriate to the transmembrane NK form, but the two genes are a standing risk of conflation
    and the FCGR3B record would be worth auditing against this one.
  experts:
  - Jeffrey C Edberg
  - Robert P Kimberly
- question: CD16A supports antibody-independent killing through CD2, and the L66H immunodeficiency separates
    that from ADCC. Should there be a distinct process term for this route, or is natural killer cell
    mediated cytotoxicity sufficient to cover both the antibody-dependent and antibody-independent contributions
    of one receptor?
  experts:
  - Jordan S Orange
  - Kerry S Campbell
suggested_experiments:
- hypothesis: CD16A actively builds the NK-target contact rather than merely occupying it, and does so
    to a lesser degree than NKG2D.
  description: Compare synapse assembly in primary NK cells expressing wild-type or non-cleavable S197P
    CD16A against antibody-opsonised targets and against NKG2D-ligand-bearing targets, measuring F-actin
    ring formation, interface area and symmetry, contact lifetime and adhesion force by live imaging and
    optical tweezers. Quantifying assembly kinetics rather than disassembly would settle whether the proposed
    GO:0001771 annotation is warranted and whether the CD16-triggered contact is a synapse in GO's sense.
  experiment_type: Live-cell synapse imaging with a non-cleavable receptor
- hypothesis: The CD16A cytoplasmic phosphorylation switch, not receptor occupancy, determines whether
    ligation produces degranulation or cytokine release.
  description: Reconstitute CD16-negative NK cells with CD16A bearing phosphomimetic or non-phosphorylatable
    substitutions in the RSSTR motif, then stimulate with matched antibody-opsonised targets and measure
    perforin and granzyme B release, calcium flux, Syk and AKT phosphorylation and TNF-alpha secretion
    in parallel. A clean partition would justify treating the calcium, PI3K/AKT, degranulation and cytokine-production
    annotations as separable outputs of one receptor rather than as a single cascade.
  experiment_type: Phosphosite mutant reconstitution with paired signalling and effector readouts
- hypothesis: CD16A's contribution to antibody-independent NK killing is mediated specifically by its
    association with CD2 and is separable from IgG binding.
  description: In NK-92 cells, express wild-type CD16A, the L66H variant, and an IgG-binding-dead mutant
    that retains CD2 association, then assay killing of antibody-coated and uncoated targets. Showing
    that the IgG-binding-dead receptor still supports spontaneous cytotoxicity while L66H does not would
    establish two mechanistically distinct contributions from one receptor and inform whether they need
    separate process terms.
  experiment_type: Separation-of-function mutagenesis in an NK cell line
