- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: EXP
  original_reference_id: PMID:29967280
  qualifier: located_in
  review:
    summary: CD16A is a transmembrane receptor at the plasma membrane.
    action: ACCEPT
    reason: 'Core and correct. CD16A is a type I transmembrane glycoprotein at the plasma membrane of
      NK cells and of a monocyte subset; the transmembrane anchoring is what distinguishes it from CD16B/FCGR3B,
      which is GPI-anchored on neutrophils, and residue 203 determines which anchor is used. Kept at plasma
      membrane rather than refined to the external side: the protein spans the bilayer, so this is the
      accurate location for the whole product, and the external-side rows describe where the IgG-binding
      ectodomain sits rather than correcting this term.'
    supported_by:
    - &id007
      reference_id: PMID:1825220
      supporting_text: CD16-I is expressed as a phosphatidylinositol glycan-anchored membrane glycoprotein
        on neutrophils, whereas CD16-II is a transmembrane-linked glycoprotein on NK cells.
    - *id006
