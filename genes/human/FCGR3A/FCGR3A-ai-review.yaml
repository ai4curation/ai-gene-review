references:
- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
- id: GO_REF:0000044
  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot Subcellular Location vocabulary mapping,
    accompanied by conservative changes to GO terms applied by UniProt
- id: PMID:1825220
  title: Analysis of Fc gamma RIII (CD16) membrane expression and association with CD3 zeta and Fc epsilon
    RI-gamma by site-directed mutation.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (J Exp Med 1991;173:1025-8). Site-directed mutagenesis showing that
      residue 203 decides between transmembrane anchoring (CD16-II, the NK form encoded by FCGR3A) and
      GPI anchoring (CD16-I, the neutrophil FCGR3B form), and that CD3 zeta or FcepsilonRI gamma is needed
      for efficient surface expression. The reference that pins the FCGR3A/FCGR3B distinction.
- id: PMID:2138330
  title: Fc gamma receptor type III (CD16) is included in the zeta NK receptor complex expressed by human
    natural killer cells.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified (J Exp Med 1990;171:1757-61). Places CD16 in the zeta NK receptor complex.
      Cited as the traceable author statement for the plasma membrane location and for the broad immune
      response term, the latter of which this review flags as too general.
- id: PMID:2532305
  title: Co-association of CD3 zeta with a receptor (CD16) for IgG Fc on human natural killer cells.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (Nature 1989;342:803-5). The original demonstration that CD16 associates
      with the CD3 zeta homodimer on human NK cells and that co-transfection with CD3 zeta permits surface
      expression of the transmembrane complex. Foundational for the receptor-complex rows.
- id: PMID:8478617
  title: Physical and functional association of p56lck with Fc gamma RIIIA (CD16) in natural killer cells.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified (J Exp Med 1993;177:1421-4). Physical and functional association of
      p56lck with FcgammaRIIIA in NK cells; early support for the Fc-gamma receptor signalling pathway
      row.
- id: PMID:9916693
  title: Quantitative analysis of the effect of CD16 ligation on human NK cell proliferation.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (J Immunol 1999;162:1261-9). Quantitative single-cell analysis establishing
      CD16 as an activation receptor for NK proliferation, while also showing it kills NK progenitors,
      so the net effect depends on costimulation. Sole support for the proliferation row and useful for
      its honesty about the opposing effect.
- id: PMID:10318937
  title: Human CD16 as a lysis receptor mediating direct natural killer cell cytotoxicity.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (Proc Natl Acad Sci USA 1999;96:5640-4). Shows CD16 is directly involved
      in lysing some virus-infected and tumour cells independent of antibody binding, which is why the
      NK-cytotoxicity rows say more than the ADCC rows. Also the reference the GO-CAM uses for this gene's
      activity.
- id: PMID:10706735
  title: Cutaneous injection of human subjects with macrophage inflammatory protein-1 alpha induces significant
    recruitment of neutrophils and monocytes.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: PubMed-verified (J Clin Invest 2000;105:1125-36). A MIP-1-alpha skin-injection study
      in human subjects; CD16 appears as a leukocyte surface marker. Adequate for the external-side-of-plasma-membrane
      location, incidental to the paper's subject.
- id: PMID:10728755
  title: 'Induction of tumor necrosis factor alpha production by adhered human monocytes: a key role for
    Fcgamma receptor type IIIa in rheumatoid arthritis.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (Arthritis Rheum 2000;43:608-16). Shows that of the three human Fc-gamma
      receptors only FcgammaRIII ligation induces TNF-alpha and IL-1-alpha release from adhered monocytes,
      and that blocking the other two does not affect it. The specific basis for both the TNF-production
      and macrophage-activation rows.
- id: PMID:11711607
  title: Effector function activities of a panel of mutants of a broadly neutralizing antibody against
    human immunodeficiency virus type 1.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified (J Virol 2001;75:12161-8). Antibody Fc-mutant panel against HIV-1-infected
      cells; ADCC is reduced or abolished by mutations that disrupt Fc receptor engagement. Supports ADCC
      from the antibody side rather than by manipulating the receptor.
- id: PMID:23006327
  title: Human immunodeficiency-causing mutation defines CD16 in spontaneous NK cell cytotoxicity.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'PubMed-verified (J Clin Invest 2012;122:3769-80). The human L66H immunodeficiency mutation:
      patients retain ADCC but lose spontaneous NK cytotoxicity, through loss of a CD16-CD2 association
      identified biochemically and at the immunological synapse. Supports the NK-cytotoxicity and activation
      rows and is the main evidence for the proposed immunological synapse location.'
- id: PMID:23024279
  title: The unique cytoplasmic domain of human FcγRIIIA regulates receptor-mediated function.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (J Immunol 2012;189:4951-9). Dissects the CD16A-specific cytoplasmic
      domain and the PKC phosphorylation switch that partitions calcium flux and cytokine production from
      Gab2/PI3K-driven degranulation. The basis for the calcium, PI3K/AKT and degranulation rows being
      distinct claims rather than restatements.
- id: PMID:23533145
  title: In-depth proteomic analyses of exosomes isolated from expressed prostatic secretions in urine.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: PubMed-verified (J Proteome Res 2013;12:2203-11). Shotgun proteomics of exosomes from
      expressed prostatic secretions in urine. CD16A's appearance is incidental and in an unrelated tissue
      context, which is why the extracellular exosome row is marked over-annotated.
- id: PMID:24337742
  title: 'ADAM17-mediated shedding of FcγRIIIA on human NK cells: identification of the cleavage site
    and relationship with activation.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (J Immunol 2014;192:741-51). Identifies ADAM17 as the protease and the
