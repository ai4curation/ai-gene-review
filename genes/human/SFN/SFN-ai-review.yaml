- term:
    id: GO:0001836
    label: release of cytochrome c from mitochondria
  evidence_type: IDA
  original_reference_id: PMID:11574543
  qualifier: involved_in
  review:
    summary: SFN inhibits rather than promotes cytochrome-c release after DNA damage.
    action: MODIFY
    reason: PMID:11574543 shows loss of SFN makes cells sensitive to DNA-damage-induced Bax
      translocation and cytochrome-c release, so the row is directionally inverted; the paper
      supports negative regulation of cytochrome-c release rather than release itself.
    proposed_replacement_terms:
    - id: GO:0090201
      label: negative regulation of release of cytochrome c from mitochondria
    supported_by:
    - reference_id: PMID:11574543
      supporting_text: Exposure to adriamycin resulted in rapid apoptosis only in final
        sigma(-/-) cells.
