id: P31947
gene_symbol: SFN
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'SFN encodes 14-3-3 protein sigma, an epithelial-enriched member of the conserved soluble
  14-3-3 adaptor family. The protein forms dimers and recognizes phosphorylated serine/threonine motifs
  in client proteins, allowing it to sequester or remodel clients in the cytosol. SFN-specific human studies
  support roles in PKP3-dependent desmosome dynamics, GBP1 sequestration during interferon-stimulated
  innate immunity, and anti-apoptotic sequestration of BAX after DNA damage.'
alternative_products:
