core_functions:
- molecular_function:
    id: GO:0050815
    label: phosphoserine residue binding
  description: Recognizes phosphorylated serine/threonine motifs in client proteins; this
    phosphomotif specificity is the biochemical basis of 14-3-3 client binding.
  directly_involved_in:
  - id: GO:0007165
    label: signal transduction
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: file:human/SFN/SFN-uniprot.txt
    supporting_text: Binds to a large number of partners, usually by recognition of a phosphoserine
      or phosphothreonine motif
- molecular_function:
    id: GO:0042802
    label: identical protein binding
  description: Forms 14-3-3 homodimers whose paired grooves can engage one or two phosphorylated
    client motifs and support client sequestration or scaffolding.
  directly_involved_in:
  - id: GO:0007165
    label: signal transduction
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: file:human/SFN/SFN-uniprot.txt
    supporting_text: Homodimer
- molecular_function:
    id: GO:0140311
    label: protein sequestering activity
  description: Retains phosphorylated clients in the cytosol or otherwise masks access to their
    normal partners or compartments.
  directly_involved_in:
  - id: GO:0008104
    label: intracellular protein localization
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: file:human/SFN/SFN-uniprot.txt
    supporting_text: Promotes cytosolic retention of GBP1 GTPase by binding to
      phosphorylated GBP1
proposed_new_terms: []
suggested_questions:
- question: Which SFN client branches are truly sigma-specific in epithelial cells rather than
    shared with other 14-3-3 isoforms?
- question: Should the p53-dependent SFN sequestration of CDK1-CCNB1 in the G2/M DNA
    damage checkpoint be modeled only as protein sequestering activity, as in the cached
    SFN GO-CAMs, or should SFN also carry a direct checkpoint biological-process row?
  experts: []
suggested_experiments:
- description: Use endogenous tagging plus phosphosite mutants of representative SFN clients to
    separate paralog-specific 14-3-3 regulation from redundant binding by other human 14-3-3 dimers.
