- term:
    id: GO:0005021
    label: vascular endothelial growth factor receptor activity
  evidence_type: TAS
  original_reference_id: PMID:8394751
  qualifier: enables
  review:
    action: REMOVE
    summary: FLT3 is not a VEGF receptor; its ligand is FLT3LG and its closest relatives
      are KIT and CSF1R.
    reason: The FLT name is shared with the VEGF receptors FLT1 and FLT4, but the cited
      cloning paper places FLT3 with CSF1R and KIT, the class III receptor kinases, not
      with the VEGF receptor class. UniProt records FLT3LG as the ligand and no VEGF
      binding, and no study shows VEGF activating FLT3. The annotation appears to follow
      the gene name rather than the biology.
    source_defects:
    - defect_type: WRONG_TERM
      resource: OTHER
      slot: GO_ID
      requested_change: DELETE_ROW
      asserted_value: GO:0005021
      cause: OTHER
      confidence: PROBABLE
      explanation: The TAS annotation of vascular endothelial growth factor receptor
        activity (GO:0005021) to human FLT3 (P36888) from PMID:8394751, assigned by PINC,
        is not supported by that paper, which reports that FLT3 encodes a receptor
        tyrosine kinase similar to CSF1R/FMS and KIT. FLT3 is the receptor for FLT3LG;
        VEGF receptor activity belongs to FLT1, KDR and FLT4. The shared FLT gene-name
        prefix is the likely source of the error. The row, and the derived VEGF signaling
        pathway annotation, should be withdrawn.
      supported_by:
      - reference_id: PMID:8394751
        supporting_text: The deduced amino acid sequence shows that FLT3 codes for a
          receptor-type tyrosine kinase of 993 residues, presenting a strong similarity
          with the corresponding mouse FLT3/FLK2 protein as well as with the receptors for
          colony-stimulating factor 1 (CSF1R/FMS) and steel locus factor (SLFR/KIT).
      - reference_id: file:human/FLT3/FLT3-uniprot.txt
        supporting_text: Tyrosine-protein kinase that acts as a cell-surface receptor for
          the cytokine FLT3LG
    supported_by:
