core_functions:
- description: Cell-surface receptor for the cytokine FLT3 ligand. The extracellular
    immunoglobulin-like domains bind the ligand, which converts the monomer into a
    homodimer, relieves autoinhibition and triggers autophosphorylation of the split
    kinase domain, launching signalling in haematopoietic progenitors and dendritic-cell
    precursors.
  molecular_function:
    id: GO:0004714
    label: transmembrane receptor protein tyrosine kinase activity
  locations:
  - id: GO:0005886
    label: plasma membrane
  directly_involved_in:
  - id: GO:0007169
    label: cell surface receptor protein tyrosine kinase signaling pathway
  - id: GO:0019221
    label: cytokine-mediated signaling pathway
  - id: GO:0046777
    label: protein autophosphorylation
  supported_by:
  - reference_id: file:human/FLT3/FLT3-uniprot.txt
    supporting_text: Tyrosine-protein kinase that acts as a cell-surface receptor for the
      cytokine FLT3LG and regulates differentiation, proliferation and survival of
      hematopoietic progenitor cells and of dendritic cells.
  - reference_id: file:human/FLT3/FLT3-uniprot.txt
    supporting_text: FLT3LG binding leads to dimerization and activation by
      autophosphorylation.
- description: Signalling hub for progenitor expansion. The phosphorylated receptor
    recruits PI3K and SRC-family and SYK kinases and activates the PI3K-AKT-MTOR and
    RAS-ERK axes, driving proliferation and survival of early haematopoietic progenitors,
    an output that becomes constitutive in FLT3-ITD leukaemia.
  molecular_function:
    id: GO:0141038
    label: phosphatidylinositol 3-kinase activator activity
  locations:
  - id: GO:0005886
    label: plasma membrane
  directly_involved_in:
  - id: GO:0051897
    label: positive regulation of phosphatidylinositol 3-kinase/protein kinase B signal
      transduction
  - id: GO:0008284
    label: positive regulation of cell population proliferation
  - id: GO:0030097
    label: hemopoiesis
  supported_by:
  - reference_id: file:human/FLT3/FLT3-uniprot.txt
    supporting_text: Promotes phosphorylation of SHC1 and AKT1, and activation of the
      downstream effector MTOR.
  - reference_id: PMID:7507245
    supporting_text: STK-1, the human homolog of Flk-2/Flt-3, is selectively expressed in
      CD34+ human bone marrow cells and is involved in the proliferation of early
      progenitor/stem cells.
suggested_questions:
- question: How much of the surface pool of FLT3 is lost in ITD-mutant cells, and does the
    ER-retained mutant signal from the ER rather than from the plasma membrane?
- question: Which of the many kinases recovered as FLT3 partners, SYK, ABL2 and the
    SRC-family members, act on the receptor and which are substrates?
- question: Does wild-type FLT3 signalling to STAT5 occur at all in primary human
    progenitors, given that it is reported as marginal in cell lines?
suggested_experiments:
- hypothesis: ITD mutants signal predominantly from an intracellular compartment rather
    than the cell surface.
  description: Compare surface and total FLT3 by flow cytometry on non-permeabilised and
    permeabilised cells expressing wild-type or ITD receptors, and localise active
    signalling with phospho-specific antibodies and compartment-restricted inhibitors.
- hypothesis: SYK and ABL2 have opposite effects on FLT3 output because one phosphorylates
    the receptor and the other acts downstream.
  description: Reconstitute each kinase with purified FLT3 intracellular domain, map
    phosphosites by mass spectrometry, then test the same sites by mutation in cells for
    proliferation and AKT activation.
- hypothesis: The ligand-binding surface of FLT3 is accessible on primary CD34-positive
    cells in a way that distinguishes wild-type from mutant receptors.
  description: Use labelled FLT3 ligand and conformation-selective antibodies on primary
    AML blasts and normal progenitors to quantify surface receptor and ligand-binding
    competence side by side.
