id: P36888
gene_symbol: FLT3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: FLT3 is a class III receptor tyrosine kinase of haematopoietic progenitor
  cells and dendritic-cell precursors, related to KIT and CSF1R. It is a single-pass type
  I membrane protein whose five extracellular immunoglobulin-like domains are exposed at
  the cell surface and bind the cytokine FLT3 ligand; binding drives receptor
  dimerisation, releases the autoinhibited conformation and triggers autophosphorylation
  of the split intracellular kinase domain. Activated FLT3 recruits PI3K and SRC-family
  and SYK kinases and drives AKT, MTOR and ERK signalling, supporting proliferation,
  survival and differentiation of early progenitors, B-cell precursors and dendritic
  cells. Internal tandem duplications and kinase-domain mutations make the receptor
  constitutively active and are among the most frequent lesions in acute myeloid
  leukaemia; such mutants are partly retained in the endoplasmic reticulum rather than
  reaching the surface.
