- id: PMID:22306653
  title: Germline mutations in DIS3L2 cause the Perlman syndrome of overgrowth and Wilms tumor susceptibility.
  findings:
  - statement: Human DIS3L2 mutations cause Perlman syndrome; inactivation affects mitotic phenotypes
      and cancer-cell growth.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The PMID/title and complete cached abstract were verified. Publisher challenge pages
      and failed public-author retrieval did not provide the original full text; no unseen assay detail
      is claimed. The explicit abstract supports exonuclease activity, mitotic abnormalities and growth
      effects.
  full_text_unavailable: true
- id: PMID:23756462
  title: Exonuclease hDIS3L2 specifies an exosome-independent 3'-5' degradation pathway of human cytoplasmic
    mRNA.
  findings:
  - statement: Human DIS3L2 is a processive 3′–5′ exoribonuclease that can degrade structured RNA substrates
      and functions outside the RNA exosome in the tested preparations.
  - statement: Human-cell depletion slows selected mRNA decay; endogenous and tagged protein show a soluble
      cytoplasmic pool, and XRN1 co-recovery is RNA dependent.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Identifier and title verified against the official EuropePMC record. Independent selected
      original Methods, Results, Discussion and captions were read from the publisher. The normal publication
      cache is abstract-only; the public source note preserves the independently accessed experimental
      details. XRN1 co-immunoprecipitation does not establish a purified direct interface or an obligatory
      complex.
  full_text_unavailable: true
- id: PMID:24141620
  title: Mammalian DIS3L2 exoribonuclease targets the uridylated precursors of let-7 miRNAs.
  findings:
  - statement: Human 885-residue DIS3L2 binds oligo(U) RNA and catalyses divalent-metal-dependent RNA
      degradation; a D391N substitution abolishes the measured cleavage.
  - statement: Human-cell and biochemical experiments identify uridylated pre-let-7 as a substrate, with
      oligo(U) preference but not an absolute inability to degrade other substrates.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Official identity and the genuine full main-text cache were verified; independent original
      XML and Supplemental Methods pp1–9 were read. Mouse embryonic-stem-cell discovery is separate from
      the human isoform-1 experiments. The assay substrate is precursor let-7; the study does not directly
      demonstrate degradation of mature let-7. The endogenous HeLa depletion result differs from the overexpression/substrate-trapping
      context.
  full_text_unavailable: false
- id: PMID:23503588
  title: The exoribonuclease Dis3L2 defines a novel eukaryotic RNA degradation pathway.
  findings:
  - statement: Fission-yeast Dis3l2 provides an exosome-independent 3′–5′ RNA decay route with uridylated-RNA
      preference and genetic interplay with Xrn1.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Official identity verified. Independent selected original Methods, Results, Discussion
      and captions were read from the publisher. These are Schizosaccharomyces pombe experiments, including
      SPAC2C4.07c and D461N; they are not direct human or mouse assays. The normal cache remains abstract-only.
  full_text_unavailable: true
- id: PMID:23594738
  title: A role for the Perlman syndrome exonuclease Dis3l2 in the Lin28-let-7 pathway.
  findings:
  - statement: Mouse Dis3l2 preferentially degrades uridylated pre-let-7; depletion accumulates precursors
      without raising measured mature let-7.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The genuine full cached original Methods and Results were inspected. Mouse V6.5 ESC-derived870-residue
      Dis3l2.2 and engineered constructs are distinct from human natural products; direct assays test
      uridylated precursors.
  full_text_unavailable: false
- id: PMID:25119025
  title: Mechanism of Dis3l2 substrate recognition in the Lin28-let-7 pathway.
  findings:
  - statement: Mouse Dis3l2 binds oligo(U) strongly and degrades oligo(U)-tailed substrates, with preference
      rather than exclusive substrate recognition.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The genuine full original biochemistry, structural Results and Methods were inspected.
      Mouse full-length and engineered37–857/deletion/D389N constructs are not natural human products.
  full_text_unavailable: false
- id: PMID:27974621
  title: Characterization of a TUTase/RNase complex required for Drosophila gametogenesis.
  findings:
  - statement: Drosophila Dis3l2 degrades a mature miR-1010 model substrate and uridylated precursor RNA,
      supplying distinct grounding for the miRNA-decay IBA.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The genuine full original Fig3B, Results and Methods were inspected with the current
      FlyBase/Q8IRJ7 donor annotation. Drosophila S2 immunoprecipitates, model substrates and catalytic-mutant
      controls are distinguished from direct human physiology. The wild-type/catalytic-dead comparison
      in Figure 3A uses an artificial 77-nt substrate; Figure 3B compares mature and precursor substrates
      with wild-type immunoprecipitates.
  full_text_unavailable: false
- id: PMID:34904664
  title: Nuclear poly(A) binding protein 1 (PABPN1) mediates zygotic genome activation-dependent maternal
    mRNA clearance during mouse early embryonic development.
  findings:
  - statement: DIS3L2 contributes to turnover of oligouridylated maternal mRNAs during mouse early embryonic
      development.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The genuine full original Methods and selected Results were inspected. Mouse embryo
      perturbation/RNA-tail evidence is distinct from tagged-protein HeLa fractionation and interaction
      experiments.
  full_text_unavailable: false
- id: file:human/DIS3L2/DIS3L2-source-guide.md
  title: DIS3L2 source, substrate and propagation guide
  findings:
  - statement: Public primary-source locators distinguish human precursor assays, fly mature-miRNA evidence,
      fission-yeast P-body context and current ancestral-node provenance.
core_functions:
- description: Processively degrades RNA from free 3′ ends in the cytosol, providing exosome-independent
    turnover of selected mRNAs and preferential degradation of oligo(U)-tailed pre-let-7 precursors. Divalent
    metal ions support the exonuclease reaction.
  molecular_function:
    id: GO:0000175
    label: 3'-5'-RNA exonuclease activity
  directly_involved_in:
  - id: GO:0000956
    label: nuclear-transcribed mRNA catabolic process
  - id: GO:1990074
    label: polyuridylation-dependent mRNA catabolic process
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:23756462
    supporting_text: processive activity on structured RNA substrates in vitro
  - reference_id: PMID:24141620
    supporting_text: specifically targets uridylated pre-let-7 in vivo
  - reference_id: PMID:23503588
  - reference_id: PMID:34904664
- description: Recognizes oligo(U) tracts on RNA as the substrate-selection component coupled to exonucleolytic
    degradation. Direct human RNA-binding assays distinguish recognition from cleavage; this does not
    imply a separate regulatory pathway or an absolute U-tail requirement.
  molecular_function:
    id: GO:0008266
    label: poly(U) RNA binding
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:24141620
suggested_questions:
- question: Does the current miRNA catabolic process term intentionally cover precursor-miRNA destruction?
    The directly demonstrated human DIS3L2 substrate in PMID:24141620 is pre-let-7, whereas the current
    GO:0010587 definition describes mature 21–23-nucleotide miRNA.
- question: Which of the four shorter natural DIS3L2 products are expressed as stable proteins and retain
    RNA binding or exonuclease activity under physiological conditions?
- question: Which original experiments support the specific mitotic sister-chromatid separation annotation
    in PMID:22306653, and how directly does RNA turnover affect that step?
suggested_experiments:
- description: Compare sequence-verified natural DIS3L2 products in matched RNA-binding and 3′–5′ degradation
    assays, with protein stability and catalytic-mutant controls.
- description: Measure endogenous human mature-miRNA and precursor half-lives separately after acute DIS3L2
    perturbation and rescue to distinguish direct substrates from altered biogenesis.
