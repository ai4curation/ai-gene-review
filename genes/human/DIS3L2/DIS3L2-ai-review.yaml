id: Q8IYB7
gene_symbol: DIS3L2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: DIS3L2 is a cytosolic 3′–5′ exoribonuclease that degrades RNA independently of the RNA exosome.
  Its divalent-metal-dependent catalytic domain works with RNA-binding regions to process accessible RNA
  3′ ends, including structured substrates. DIS3L2 contributes to turnover of selected mRNAs and preferentially
  recognizes oligo(U)-tailed RNA, including uridylated pre-let-7 precursors. Oligouridylation promotes
  substrate selection but is not an absolute requirement for every cleavage reaction. Loss of DIS3L2 is
  associated with Perlman syndrome and disturbed control of cell growth and division.
alternative_products:
- name: '1'
  id: Q8IYB7-1
  description: Displayed 885-residue product. PMID24141620 Supplemental Methods identifies a sequenced
    human isoform-1 cDNA as 885 amino acids, NP_689596.4; the fixed official UniProt record maps that
    exact RefSeq version to Q8IYB7-1. Tag-cleaved bacterial wild-type protein supports RNA binding and
    exonuclease assays, while separate FLAG preparations from human cells support pre-let-7 substrate
    assays. The D391N catalytic mutant is an experimental construct, not another natural isoform.
- name: '2'
  id: Q8IYB7-2
  sequence_note: VSP_030376, VSP_030378
  description: 619-residue product; residues 581–619 differ from the displayed sequence and displayed
    residues 620–885 are absent. The reserved original experiments do not independently establish activity,
    inactivity, localization or substrate equivalence for this natural product. The 885-residue assays
    should not be propagated to it as an isoform-resolved result.
- name: '3'
  id: Q8IYB7-3
  sequence_note: VSP_030375, VSP_030377
  description: 603-residue product; residues 528–603 differ from the displayed sequence and displayed
    residues 604–885 are absent. No isoform-resolved functional assay for this natural product was established
    in the three reserved originals; its distinct sequence does not by itself demonstrate measured inactivity.
- name: '4'
  id: Q8IYB7-4
  sequence_note: VSP_030372, VSP_030373
  description: 249-residue product; residues 236–249 differ from the displayed sequence and displayed
    residues 250–885 are absent. No isoform-resolved functional assay for this natural product was established
    in the reserved originals. The short sequence must not be treated as an experimentally characterized
    catalytic-domain fragment or assigned the full-length protein’s measured activity.
- name: '5'
  id: Q8IYB7-5
  sequence_note: VSP_030371, VSP_030374
  description: 356-residue product; residues 201–356 differ from the displayed sequence and displayed
    residues 357–885 are absent. No isoform-resolved functional assay for this natural product was established
    in the reserved originals; neither equivalence to the full-length enzyme nor measured inactivity is
    demonstrated.
