  review:
    summary: The conserved uridylation-coupled mRNA decay route is biologically supported.
    action: ACCEPT
    reason: 'The mouse Q8CI75 donor has direct perturbation evidence in PMID:34904664: DIS3L2 depletion
      stabilizes maternal transcripts and enriches oligo(U)-tailed Gm4745 species during early embryonic
      decay. UniRule assigns the same pathway, and fission-yeast and human biochemical studies establish
      oligo(U)-preferential exonucleolysis. DIS3L2 performs RNA destruction; upstream TUT enzymes add
      the U tail. This does not imply that every human substrate must be uridylated.'
    additional_reference_ids:
    - PMID:34904664
