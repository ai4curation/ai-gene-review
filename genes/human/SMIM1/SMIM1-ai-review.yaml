core_functions:
- description: Small type II (tail-anchored) membrane protein of the erythroid plasma membrane that forms
    disulfide-linked homodimers and exposes a short extracellular C-terminus carrying the Vel blood group
    antigen. No molecular activity is known; no molecular function term is assigned. Loss-of-function
    data link it, weakly, to red cell haemoglobinisation and whole-body energy expenditure, but how it
    acts is unknown.
  locations:
  - id: GO:0005886
    label: plasma membrane
  - id: GO:0009986
    label: cell surface
  supported_by:
  - *id003
  - *id005
  - *id007
suggested_questions:
- question: Does SMIM1 have a molecular activity of its own (for example as a regulator of a red cell
    transporter or channel), or is it a structural component of an erythroid membrane complex?
- question: Is the zebrafish morpholino red cell phenotype reproduced in a stable smim1 mutant or a Smim1
    knockout mouse, and is erythrocyte differentiation the right process term for human SMIM1?
- question: How does SMIM1 absence lower circulating thyroid hormone and energy expenditure, given its
    predominantly erythroid expression?
suggested_experiments:
- description: Proximity labelling or co-immunoprecipitation of endogenous SMIM1 from primary erythroblasts
    to identify red cell membrane partners, replacing the non-specific Y2H interactome.
- description: Generate Smim1 knockout mice (or stable zebrafish mutants) and measure erythropoiesis,
    red cell indices, thyroid hormone levels and energy expenditure.
