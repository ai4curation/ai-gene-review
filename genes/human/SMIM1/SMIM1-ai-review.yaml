    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:32296183
  qualifier: enables
  supporting_entities:
  - UniProtKB:A0A0S2Z4U3
  review:
    summary: High-throughput yeast two-hybrid hit (UniProtKB:A0A0S2Z4U3) from the HuRI human reference
      interactome; bare protein binding carries no functional information.
    action: REMOVE
    reason: Generic protein binding is uninformative and no more specific molecular function can be derived
      from a high-throughput Y2H pair. SMIM1 has 54 HuRI partners and none has any functional link to
      it. They are almost all unrelated membrane proteins (gap junction proteins, SLC transporters, syntaxin,
      ER/Golgi membrane proteins, mitochondrial outer-membrane proteins), which is the pattern expected
      when a single hydrophobic transmembrane helix is assayed in a yeast nuclear system. The only interaction
      with independent support is SMIM1 self-association, which is captured by the protein homodimerization
      activity row. Removal does not imply the reported interaction is false.
