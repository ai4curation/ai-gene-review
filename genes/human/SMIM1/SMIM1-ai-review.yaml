- term:
    id: GO:0048823
    label: nucleate erythrocyte development
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN002866670
  - ZFIN:ZDB-GENE-081022-87
  review:
    summary: Nucleate erythrocyte development, propagated by IBA from zebrafish smim1 (ZFIN) morpholino
      knockdown data.
    action: MODIFY
    reason: The term is restricted to development of nucleated erythrocytes, the mature red cell type
      of fish, amphibians, reptiles and birds; human erythrocytes enucleate, so the term describes the
      wrong cell type for a human gene. The underlying signal is a mild reduction in red cell number after
      smim1 morpholino knockdown in zebrafish, supported in human by an intronic eQTL that lowers SMIM1
      expression and is associated with lower mean corpuscular haemoglobin concentration. The taxon-neutral
      parent process, erythrocyte differentiation, captures this. The mechanism is unknown and the effect
      is small (Vel-negative humans have no recognised haematological disease), so this is a weakly supported,
      non-core process assignment; a full replacement term is proposed rather than removal because the
      IBA node placement within the vertebrate SMIM1 clade is not contradicted.
    proposed_replacement_terms:
    - id: GO:0030218
      label: erythrocyte differentiation
    additional_reference_ids:
    - PMID:23563608
    supported_by:
    - reference_id: PMID:23563608
      supporting_text: In vivo zebrafish smim1 knock down studies showed a mild reduction in the number
        of red blood cells, identifying SMIM1 as a novel regulator of red blood cell formation.
