references:
- id: GO_REF:0000024
  title: Manual transfer of experimentally-verified manual GO annotation data to orthologs
    by curator judgment of sequence similarity
  findings:
  - statement: >-
      Curator sequence-similarity transfer from experimentally characterized orthologs
      supplies the ISS annotations of TUSC3 to protein N-linked glycosylation (GO:0006487)
      and to mitochondrion (GO:0005739); the first agrees with direct human evidence, while
      the mitochondrial location is not corroborated by any experimental study of TUSC3 and
      conflicts with its established ER-membrane residence.
- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  findings:
  - statement: >-
      PAINT phylogenetic inference places TUSC3 in the Ost3p/Ost6p thioredoxin-domain OST
      subunit clade, supporting the IBA annotations to oligosaccharyltransferase complex
      (GO:0008250) and protein N-linked glycosylation (GO:0006487); the same GO_REF also
      supplies an IBA to magnesium ion transmembrane transport (GO:1903830), which rests on
      the contested Mg2+-transporter interpretation of the family rather than on its
      thioredoxin/OST function.
- id: GO_REF:0000044
  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot Subcellular Location
    vocabulary mapping, accompanied by conservative changes to GO terms applied by
    UniProt
  findings:
  - statement: >-
      UniProt subcellular-location keyword mapping supplies the IEA annotation of TUSC3 to
      endoplasmic reticulum membrane (GO:0005789), which matches the multi-pass ER topology
      and lumenal thioredoxin domain described in the UniProt entry.
- id: GO_REF:0000117
  title: Electronic Gene Ontology annotations created by ARBA machine learning models
  findings:
  - statement: >-
      ARBA machine-learning rules supply IEA annotations of TUSC3 to protein N-linked
      glycosylation (GO:0006487), oligosaccharyltransferase complex (GO:0008250) and
      magnesium ion transmembrane transporter activity (GO:0015095); the first two are well
      supported, whereas the transporter activity inherits the disputed Mg2+ assignment.
- id: PMID:15835887
  title: Proteomic analysis of mammalian oligosaccharyltransferase reveals multiple
    subcomplexes that contain Sec61, TRAP, and two potential new subunits.
  full_text_unavailable: true
  findings:
  - statement: >-
      Proteomic dissection of ribosome-associated mammalian OST resolves multiple
      subcomplexes of 500-700 kDa with different subunit compositions, the analysis that
      places TUSC3 among OST-associated subunits.
    supporting_text: >-
      we now demonstrate that mammalian OST can be isolated from solubilized, actively
      engaged ribosomes as multiple distinct protein complexes that range in size from
      approximately 500 to 700 kDa. These complexes exhibit different ribosome affinities
      and subunit compositions.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: >-
      The paper identifies DC2 as an OST-copurifying protein weakly homologous to the
      C-terminal half of yeast Ost3p and Ost6p, the yeast proteins to which TUSC3 is the
      thioredoxin-domain counterpart.
    supporting_text: >-
      Mass spectrometry identified a 17 kDa protein as DC2 which is weakly homologous to the
      C-terminal half of yeast Ost3p and Ost6p.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified. Proteomic identification of mammalian OST subcomplexes and
      subunit heterogeneity; original HGNC-UCL IDA source for OST complex
      membership of TUSC3.
- id: PMID:18455129
  title: Oligosaccharyltransferase-subunit mutations in nonsyndromic mental retardation.
  full_text_unavailable: true
  findings:
  - statement: >-
      A homozygous 1 bp insertion in TUSC3 (c.787_788insC, p.N263fsX300) causing mRNA decay
      segregates with autosomal-recessive non-syndromic intellectual disability, the IMP
      basis for the cognition (GO:0050890) annotation.
    supporting_text: >-
      Sequencing N33/TUSC3 identified a 1 bp insertion, c.787_788insC, resulting in a
      premature stop codon, p.N263fsX300, and leading to mRNA decay.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: >-
      TUSC3 encodes a subunit of the oligosaccharyltransferase complex that carries out the
      key step of N-glycosylation - the NAS basis for the protein N-linked glycosylation
      annotation from this paper.
    supporting_text: >-
      This interval encompasses the gene N33/TUSC3 encoding one subunit of the
      oligosaccharyltransferase (OTase) complex, which catalyzes the transfer of an
      oligosaccharide chain on nascent proteins, the key step of N-glycosylation.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: >-
      Patient fibroblasts showed normal bulk N-glycan synthesis and transfer, which the
      authors attribute to functional compensation; this is why loss of TUSC3 does not
      present as a classical CDG and is consistent with MAGT1 redundancy.
    supporting_text: >-
      Surprisingly, glycosylation analyses of patient fibroblasts showed normal N-glycan
      synthesis and transfer, suggesting that normal N-glycosylation observed in patient
      fibroblasts may be due to functional compensation.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified. Identified a frameshift TUSC3 mutation causing
      autosomal-recessive non-syndromic intellectual disability; establishes
      TUSC3 as an OTase subunit and links OTase activity to cognition. Note bulk
      N-glycosylation was normal in patient fibroblasts (MAGT1 redundancy).
- id: PMID:18452889
  title: A defect in the TUSC3 gene is associated with autosomal recessive mental
    retardation.
  full_text_unavailable: true
  findings:
  - statement: >-
      An independent consanguineous family with seven affected individuals carries a
      homozygous deletion partly removing TUSC3, with complete absence of a functional
      transcript, replicating TUSC3 loss as a cause of non-syndromic AR intellectual
      disability.
    supporting_text: >-
      Haplotype analyses and copy-number studies led to the identification of a homozygous
      deletion partly removing TUSC3 (N33) in all patients.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: >-
      The authors note that, unlike other glycosylation defects, TUSC3 inactivation causes
      isolated intellectual disability rather than a multisystem CDG phenotype.
    supporting_text: >-
      Our data suggest that in contrast to other genetic defects of glycosylation,
      inactivation of TUSC3 causes nonsyndromic MR
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified. Independent family with a homozygous TUSC3 deletion
      causing non-syndromic AR intellectual disability; UniProt DISEASE
      co-reference for MRT7. Not directly used in existing_annotations but
      supports the disease/cognition role.
- id: PMID:19717468
  title: Mammalian MagT1 and TUSC3 are required for cellular magnesium uptake and
    vertebrate embryonic development.
  full_text_unavailable: true
  findings:
  - statement: >-
      Knockdown of TUSC3 lowers total and free intracellular Mg2+ in mammalian cell lines,
      the IMP basis for the magnesium ion transport (GO:0015693) annotation.
    supporting_text: >-
      Knockdown of either MagT1 or TUSC3 protein significantly lowers the total and free
      intracellular Mg(2+) concentrations in mammalian cell lines.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: >-
      The authors interpret their yeast-complementation and knockdown data as showing TUSC3
      is a plasma-membrane Mg2+ transporter; this interpretation is the source of the
      plasma membrane (GO:0005886) and transporter-activity annotations and is contested by
      later work placing TUSC3 in the ER as an OST oxidoreductase subunit.
    supporting_text: >-
      We conclude that MagT1 and TUSC3 are indispensable members of the vertebrate plasma
      membrane Mg(2+) transport system.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: >-
      Morpholino knockdown of TUSC3 in zebrafish arrests early development and is rescued by
      excess Mg2+ or by mammalian mRNA, indicating a physiological requirement but not by
      itself establishing direct transport by TUSC3.
    supporting_text: >-
      Morpholino knockdown of MagT1 and TUSC3 protein expression in zebrafish embryos
      results in early developmental arrest; excess Mg(2+) or supplementation with mammalian
      mRNAs can rescue the effects.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: DISPUTED
    review_notes: >-
      PubMed-verified citation. Experimental basis for the magnesium-transport
      annotations, but the interpretation as a direct plasma-membrane Mg2+
      transporter is disputed by later work (PMID:25135935, PMID:26864433) that
      localizes TUSC3/MAGT1 to the ER as OST oxidoreductase subunits; any Mg2+
      role is likely indirect.
- id: PMID:24685145
  title: Structural basis of substrate specificity of human oligosaccharyl transferase
    subunit N33/Tusc3 and its role in regulating protein N-glycosylation.
  full_text_unavailable: true
  findings:
  - statement: >-
      TUSC3 has a membrane-anchored N-terminal thioredoxin domain in the ER lumen that can
      form transient mixed disulfide complexes with OST substrates - the structural basis of
      its protein-disulfide oxidoreductase molecular function.
    supporting_text: >-
      Here, we show that N33/Tusc3 possesses a membrane-anchored N-terminal thioredoxin
      domain located in the ER lumen that may form transient mixed disulfide complexes with
      OST substrates.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: >-
      X-ray structures of TUSC3 bound to two model peptides reveal a defined peptide-binding
      groove adjacent to the active site that accepts peptides in either orientation, giving
      TUSC3 genuine substrate selectivity rather than indiscriminate thiol chemistry.
    supporting_text: >-
      X-ray structures of complexes between N33/Tusc3 and two different peptides as model
      substrates reveal a defined peptide-binding groove adjacent to the active site that
      can accommodate peptides in opposite orientations.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: >-
      The authors' model is that TUSC3 raises glycosylation efficiency for a subset of human
      glycoproteins by slowing their folding, which is the mechanistic rationale for
      modelling TUSC3 as contributing to OST activity rather than catalysing glycan transfer.
    supporting_text: >-
      Our results support a model in which N33/Tusc3 increases glycosylation efficiency for
      a subset of human glycoproteins by slowing glycoprotein folding.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified. X-ray structures (PDB 4M8G/4M90/4M91/4M92) of the lumenal
      N33/TUSC3 thioredoxin domain with model peptide substrates; source of the
      redox-active Cys99-Cys102 disulfide and the transient-mixed-disulfide model.
      Abstract only (no cached full text).
- id: PMID:25135935
  title: Oxidoreductase activity is necessary for N-glycosylation of cysteine-proximal
    acceptor sites in glycoproteins.
  findings:
  - statement: >-
      The lumenal CXXC active site of the MagT1/TUSC3 oxidoreductase is required for
      glycosylation of STT3B-dependent acceptor sites, including sequons bracketed by
      disulfides or containing cysteine as the internal residue.
    supporting_text: >-
      The lumenally oriented active site CVVC motif in MagT1 is required for glycosylation
      of STT3B-dependent acceptor sites including those that are closely bracketed by
      disulfides or contain cysteine as the internal residue (NCT/S).
    reference_section_type: ABSTRACT
  - statement: >-
      The oxidoreductase is predominantly oxidized in vivo, consistent with a mechanism in
      which it forms a transient mixed disulfide with the substrate to give STT3B access to
      unmodified acceptor sites.
    supporting_text: >-
      The predominant form of MagT1 in vivo is oxidized, which is consistent with transient
      formation of mixed disulfides between MagT1 and a glycoprotein substrate to facilitate
      access of STT3B to unmodified acceptor sites.
    reference_section_type: ABSTRACT
  - statement: >-
      TUSC3 fully complements MagT1-depleted cells, establishing functional redundancy
      between the two thioredoxin-domain OST-B subunits and explaining the normal bulk
      glycosylation seen in TUSC3 patient fibroblasts.
    supporting_text: >-
      MagT1-depleted cells were fully complemented by expression of TUSC3, which is
      indicative of functional redundancy between MagT1 and TUSC3.
    reference_section_type: RESULTS
  - statement: >-
      This paper directly addresses the competing Mg2+-transporter interpretation, noting
      that MagT1 overexpression does not raise cellular Mg2+ and that MagT1-deficient
      lymphocytes have normal cellular Mg2+ levels.
    supporting_text: >-
      However, overexpression of MagT1 alone does not increase the Mg2+ concentration in
      cells even though MagT1, but not TUSC3, is expressed in most human tissues (Molinari
      et al., 2008; Zhou and Clapham, 2009). MagT1-deficient human lymphocytes display
      altered kinetics of Mg2+ uptake, but have normal cellular levels of Mg2+
    reference_section_type: INTRODUCTION
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified; full text cached. Key mechanistic paper: the STT3B-complex
      oxidoreductase (MagT1) uses a CXXC/mixed-disulfide mechanism to promote
      glycosylation of cysteine-proximal sequons, and TUSC3 fully complements
      MagT1 in a CXXC-dependent manner (functional redundancy). Grounds the core
      oxidoreductase MF for TUSC3.
- id: PMID:26864433
  title: Mammalian cells lacking either the cotranslational or posttranslocational
    oligosaccharyltransferase complex display substrate-dependent defects in asparagine
    linked glycosylation.
  findings:
  - statement: >-
      CRISPR/Cas9 was used to make viable HEK293 lines null for the two STT3B-specific
      accessory subunits MagT1 and TUSC3, providing clean genetic tools free of the residual
      expression that confounds siRNA knockdown.
    supporting_text: >-
      Here, we have used the CRISPR/Cas9 gene editing technology to create viable HEK293
      derived cells lines that are deficient for a single catalytic subunit (STT3A or STT3B)
      or two STT3B-specific accessory subunits (MagT1 and TUSC3).
    reference_section_type: ABSTRACT
  - statement: >-
      TUSC3 is described as an accessory subunit assembled with the catalytic STT3B and a
      shared subunit set, consistent with modelling its molecular function as a contribution
      to complex-level activity.
    supporting_text: >-
      Metazoan organisms express two oligosaccharyltransferase complexes that are composed
      of a catalytic subunit (STT3A or STT3B) assembled with a shared set of accessory
      subunits and one to two complex specific subunits.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified; full text cached. CRISPR MagT1/TUSC3 double-knockout
      HEK293 cells show dramatic loss of STT3B-dependent glycosylation, providing
      direct in vivo evidence for TUSC3 in protein N-linked glycosylation.
- id: PMID:31831667
  title: Cryo-electron microscopy structures of human oligosaccharyltransferase complexes
    OST-A and OST-B.
  full_text_unavailable: true
  findings:
  - statement: >-
      Cryo-EM structures show that MAGT1 - and by extension its paralogue TUSC3 - occupies
      the OST-B-specific subunit position contacting the catalytic STT3B, whereas OST-A uses
      DC2 in the equivalent position.
    supporting_text: >-
      Although they have similar overall architectures, structural differences in the
      catalytic subunits STT3A and STT3B facilitate contacts to distinct OST subunits, DC2
      in OST-A and MAGT1 in OST-B.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: >-
      An acceptor peptide and dolichylphosphate were resolved bound to STT3B but only
      dolichylphosphate in STT3A, suggesting the two complexes differ in substrate affinity -
      relevant to why the OST-B-specific TUSC3 matters for particular acceptor sites.
    supporting_text: >-
      We observed an acceptor peptide and dolichylphosphate bound to STT3B, but only
      dolichylphosphate in STT3A, suggesting distinct affinities of the two OST complexes
      for protein substrates.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified. Cryo-EM structures of human OST-A and OST-B; OST-B
      contains the MAGT1/TUSC3 subunit. ComplexPortal source for the ER-membrane
      and OST-complex annotations. Abstract only (no cached full text).
- id: PMID:12887896
  title: Oligosaccharyltransferase isoforms that contain different catalytic STT3
    subunits have distinct enzymatic properties.
  full_text_unavailable: true
  findings:
  - statement: >-
      Mammals express two homologs of yeast Ost3p - TUSC3 and MAGT1 - which are assembled
      with the shared OST subunits into complexes of significantly different enzymatic
      activity.
    supporting_text: >-
      Here we show that genomes of most multicellular eukaryotes encode two homologs of
      Stt3p and mammals express two homologs of Ost3p. The Stt3p and Ost3p homologs are
      assembled together with the previously described mammalian OST subunits (ribophorins I
      and II, OST48, and DAD1) into complexes that differ significantly in enzymatic
      activity.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: >-
      Tissue- and cell-type-specific expression of the STT3 homologs is proposed to tune OST
      enzymatic properties, the context in which TUSC3's restricted tissue distribution
      (relative to the ubiquitous MAGT1) is interpreted.
    supporting_text: >-
      Tissue and cell type-specific differences in expression of the Stt3p homologs suggest
      that the enzymatic properties of oligosaccharyltransferase are regulated in eukaryotes
      to respond to alterations in glycoprotein flux through the secretory pathway and may
      contribute to tissue-specific glycan heterogeneity.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified. Showed mammals express two Ost3p homologs (TUSC3/MAGT1)
      assembled into OST complexes with distinct enzymatic activity; UniProt
      reference for OST identification and tissue specificity.
- id: Reactome:R-HSA-446209
  title: Transfer of N-glycan to the protein
  findings:
  - statement: >-
      Reactome lists TUSC3 (N33) among the subunits of the ER-membrane OST complex that
      transfers the preassembled 14-sugar glycan onto nascent protein, with STT3A or STT3B
      supplying the catalytic domain.
    supporting_text: >-
      This reaction is catalyzed by the oligosaccharyltransferase (OST) complex, comprising
      at least seven proteins; DAD1 (Dolichyl-diphosphooligosaccharide--protein
      glycosyltransferase subunit DAD1), DDOST (OST48 in yeast), RPN1 (ribophorin 1), RPN2
      (ribophorin 2), OST4, TUSC3 (N33), MAGT1 (magnesium transporter protein 1) and either
      STT3A or STT3B
    reference_section_type: DATABASE_ENTRY
- id: Reactome:R-HSA-5223345
  title: Miscellaneous transport and binding events
  findings:
  - statement: >-
      This is a Reactome holding pathway for transport and binding events that cannot yet be
      placed in an existing pathway; it is the source of the broad transmembrane transport
      (GO:0055085) TAS annotation for TUSC3 and carries no TUSC3-specific evidence.
    supporting_text: >-
      This section contains known transport and binding events that as of yet cannot be
      placed in exisiting pathways
    reference_section_type: DATABASE_ENTRY
- id: Reactome:R-HSA-5339528
  title: TUSC3 transports Mg2+ from extracellular region to cytosol
  findings:
  - statement: >-
      Reactome models TUSC3 as an essential protein for cellular Mg2+ uptake, citing Zhou &
      Clapham 2009; this record is the sole source of the magnesium ion transmembrane
      transporter activity (GO:0015095) and plasma membrane (GO:0005886) TAS annotations and
      inherits the disputed interpretation of that paper.
    supporting_text: >-
      Tumor suppressor candidate 3 (TUSC3) is expressed in most non-lymphoid cells and
      tissues and is an essential protein in Mg2+ uptake into cells (Zhou & Clapham 2009).
    reference_section_type: DATABASE_ENTRY
- id: Reactome:R-HSA-9694793
  title: Spike protein gets N-glycosylated
  findings:
  - statement: >-
      TUSC3 is listed as an OST-complex participant in the ER N-glycosylation of the
      SARS-CoV-2 spike protein; a substrate-specific reaction record supporting the
      ER-membrane localization rather than a distinct TUSC3 function.
    supporting_text: >-
      Glycosyltransferases in the endoplasmatic reticulum are responsible for the attachment
      of numerous high-mannose N-glycans on the SARS-CoV-2 spike protein.
    reference_section_type: DATABASE_ENTRY
- id: Reactome:R-HSA-9918962
  title: E is N-glycosylated
  findings:
  - statement: >-
      TUSC3 appears as an OST-complex participant in ER N-glycosylation of the dengue virus
      E glycoprotein; a host-pathway reaction record, not evidence of a virus-specific TUSC3
      function.
    supporting_text: >-
      DENV-2 E protein is known to be N-glycosylated at Asn-67 and Asn-153 (Asn-347 and
      Asn-433 of the polyprotein, respectively), a process requiring, among others, the
      oligosaccharyl transferase activity of the host OST complex
    reference_section_type: DATABASE_ENTRY
- id: Reactome:R-HSA-9918988
  title: pre-M is N-glycosylated
  findings:
  - statement: >-
      TUSC3 appears as an OST-complex participant in ER N-glycosylation of the dengue virus
      prM protein; a substrate-level record supporting only ER-membrane localization.
    supporting_text: >-
      Dengue virus pre-prM is N-glycosylated at Asn-7, Asn-31, Asn-52, and Asn-69 (Asn-121,
      Asn-145, Asn-166 and Asn-183 of the polyprotein), requiring, among others, the
      oligosaccharyl transferase activity of the OST complex
    reference_section_type: DATABASE_ENTRY
- id: Reactome:R-HSA-9919011
  title: Pre-NS1 folds and is N-glycosylated
  findings:
  - statement: >-
      TUSC3 appears as an OST-complex participant in the co-folding N-glycosylation of
      dengue virus NS1; notably this substrate is glycosylated while folding, the situation
      in which the TUSC3 oxidoreductase activity is expected to matter.
    supporting_text: >-
      Pre-NS1 protein, while being folded, is glycosylated at Asn-130 and Asn-207 (Asn-905
      and Asn-982 in the polyprotein, respectively).
    reference_section_type: DATABASE_ENTRY
- id: Reactome:R-HSA-9931286
  title: CD274 N-linked glycosylation in ER
  findings:
  - statement: >-
      TUSC3 appears as an OST-complex participant in the ER N-glycosylation of PD-L1
      (CD274); the record attributes catalysis to STT3A/STT3B, consistent with TUSC3 being a
      non-catalytic accessory subunit.
    supporting_text: >-
      PD-L1 is N-glycosylated at N192, N200 and N219 by the OST complex (STT3A and STT3A) in
      the ER lumen.
    reference_section_type: DATABASE_ENTRY
suggested_questions:
- question: >-
    Does TUSC3 transport Mg2+ directly, or is the reduced cellular Mg2+ on TUSC3 knockdown an
    indirect consequence of hypoglycosylation of genuine Mg2+ transporters? The current
    GO:0015095 and GO:0005886 annotations depend entirely on the 2009 interpretation, which
    later ER-localization work does not support.
  experts:
  - Clapham DE
  - Zhou H
  - Gilmore R
  - Cherepanova NA
- question: >-
    TUSC3 and MAGT1 are functionally redundant in cultured cells, yet only TUSC3 loss causes
    autosomal-recessive intellectual disability. Which cell types express TUSC3 without
    MAGT1, and which glycoprotein substrates in those cells are TUSC3-dependent?
  experts:
  - Gilmore R
  - Cherepanova NA
  - Molinari F
  - Colleaux L
- question: >-
    The ISS annotation of TUSC3 to mitochondrion (GO:0005739) has no experimental support in
    human and conflicts with the ER-membrane localization established structurally. Is there
    any orthologue evidence that justifies it, or should it be removed?
  experts:
  - Glockshuber R
  - Mohorko E
- question: >-
    Does the peptide-binding groove adjacent to the TUSC3 active site confer a substrate
    preference distinct from that of MAGT1, which would explain why the two paralogues are
    not interchangeable in every tissue despite complementing in HEK293 cells?
  experts:
  - Glockshuber R
  - Mohorko E
  - Aebi M
suggested_experiments:
- hypothesis: >-
    TUSC3 has no intrinsic Mg2+ transport activity; the Mg2+ phenotype of TUSC3 loss is
    secondary to defective N-glycosylation of bona fide magnesium transporters.
  description: >-
    Reconstitute purified TUSC3 into proteoliposomes and assay Mg2+ flux directly with a
    fluorescent Mg2+ indicator, using a characterized Mg2+ channel (e.g. CorA or MRS2) as a
    positive control. In parallel, compare cellular Mg2+ in TUSC3-null cells rescued with
    wild-type TUSC3 versus a CXXC-motif mutant that is oxidoreductase-dead but structurally
    intact: if the Mg2+ phenotype is secondary to glycosylation, only the wild-type rescue
    should restore Mg2+ levels.
  experiment_type: proteoliposome transport assay with separation-of-function rescue
- hypothesis: >-
    TUSC3-dependent glycoproteins in neural tissue account for the intellectual-disability
    phenotype, and these substrates are cysteine-proximal sequons not covered by MAGT1 in
    cells where MAGT1 expression is low.
  description: >-
    Profile TUSC3 and MAGT1 expression across human neural cell types (single-cell RNA-seq
    and targeted proteomics), then in TUSC3-null iPSC-derived neurons perform site-specific
    N-glycoproteomics to identify sequons losing occupancy, scoring each for proximity to
    disulfides and for internal-cysteine (NCT/S) context. Validate the top hits by rescue
    with wild-type versus CXXC-mutant TUSC3.
  experiment_type: cell-type-resolved glycoproteomics with rescue validation
- hypothesis: >-
    TUSC3 and MAGT1 have overlapping but non-identical substrate repertoires dictated by the
    peptide-binding groove flanking their active sites.
  description: >-
    In MagT1/TUSC3 double-null HEK293 cells, rescue separately with TUSC3, MAGT1, and
    reciprocal groove-swap chimeras, then compare site-occupancy across the glycoproteome by
    quantitative glycoproteomics. Complement with in vitro mixed-disulfide trapping on a
