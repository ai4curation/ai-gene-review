id: O60488
gene_symbol: ACSL4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ACSL4 (FACL4) is a membrane-associated, ATP-dependent long-chain fatty
  acid-CoA ligase that activates fatty acids for cellular lipid metabolism. Recombinant
  human variants preferentially activate highly unsaturated substrates including
  arachidonate, eicosapentaenoate, docosahexaenoate and adrenate. The resulting acyl-CoAs
  supply membrane-lipid synthesis and remodeling, helping determine the abundance of
  peroxidation-susceptible phospholipids and cellular sensitivity to ferroptosis. ACSL4
  has experimentally supported pools at the endoplasmic reticulum and mitochondrial outer
  membrane, with plasma-membrane, ER-mitochondria contact-site and lipid-droplet
  distributions that vary with variant and cellular context. Loss-of-function variants
  cause X-linked intellectual disability, linking fatty-acid activation to nervous-system
  development and function.
