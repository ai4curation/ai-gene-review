  - term:
      id: GO:0006633
      label: fatty acid biosynthetic process
    evidence_type: IEA
    original_reference_id: GO_REF:0000107
    review:
      summary: ACSL4 performs the fatty-acid activation step used to prime elongation.
      action: ACCEPT
      reason: GO:0006633 includes fatty-acid elongation. Reactome R-HSA-548843 identifies
        ACSL4 itself as the arachidonate-activation catalyst, and parent R-HSA-75876 includes
        this activation in elongation. Thus ACSL4 performs a step of the annotated biosynthetic
        pathway, although it does not catalyze carbon-chain condensation. The exact experimental
        basis of the mouse donor annotation was not recovered; this acceptance rests on
        the positive human pathway evidence.
      supported_by:
      - reference_id: Reactome:R-HSA-548843
        supporting_text: Acyl-CoA synthetase long-chain family member 4 (ACSL4) associated
          with the endoplasmic reticulum membrane catalyses the conjugation of arachidonate
          (AA) with CoA to form arachidonyl-CoA (AA-CoA)
      - reference_id: Reactome:R-HSA-75876
        supporting_text: In humans, activation is catalyzed by one of five acyl-CoA synthetase
          long-chain (ACSL) enzymes
      - reference_id: Reactome:R-HSA-75876
        supporting_text: Here the full two-carbon elongation cycle to form stearate from
          palmitate is annotated, as well as the activation and condensation steps for elongation
          of arachidonate
      propagation_review:
        root_cause: NO_FAILURE_CORE
        source_entities:
        - source_id: UniProtKB:Q9QUJ7
          source_status: UNRESOLVED
          comment: Mouse Acsl4 donor identity is established, but the exact donor experiment
            for fatty-acid biosynthesis was not recovered. Positive human Reactome activation-in-elongation
            evidence supports retaining the target assertion.
        - source_id: ensembl:ENSMUSP00000033634
          source_status: UNRESOLVED
          comment: Mouse Acsl4 donor identity is established, but the exact donor experiment
            for fatty-acid biosynthesis was not recovered. Positive human Reactome activation-in-elongation
