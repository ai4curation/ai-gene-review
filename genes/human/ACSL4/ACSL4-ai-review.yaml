core_functions:
  - description: Activates long-chain fatty acids, especially arachidonate and other
      highly unsaturated C20 and C22 substrates, to acyl-CoA thioesters using ATP and CoA. This supplies lipid
      synthesis/remodeling and promotes ferroptosis susceptibility by enabling
      accumulation of peroxidation-sensitive membrane lipids. ER and mitochondrial pools
      are supported in human cells; their relative contributions depend on cellular
      context.
    molecular_function:
      id: GO:0004467
      label: long-chain fatty acid-CoA ligase activity
    locations:
      - id: GO:0005789
        label: endoplasmic reticulum membrane
      - id: GO:0005741
        label: mitochondrial outer membrane
    directly_involved_in:
      - id: GO:0035338
        label: long-chain fatty-acyl-CoA biosynthetic process
      - id: GO:0160020
        label: positive regulation of ferroptosis
    supported_by:
      - reference_id: PMID:31061331
        supporting_text: both ACSL4 variants preferred various kinds of highly unsaturated
          fatty acids (HUFAs), including docosahexaenoic acid (DHA), adrenic acid
          (docosatetraenoic acid) and eicosapentaenoic acid (EPA), as well as AA as a
          substrate
      - reference_id: PMID:29450800
        supporting_text: the ACSL4 localisation pattern more closely followed that of
          calnexin which is an endoplasmic reticulum resident chaperone
      - reference_id: PMID:38720107
        supporting_text: ACSL4 was mainly located in outer membrane of mitochondria (OM)
          and IMS
      - reference_id: PMID:35027735
        supporting_text: activated ACSL4 catalyses polyunsaturated fatty acid-containing
          lipid biosynthesis and promotes the accumulation of lipid peroxidation products,
          leading to ferroptosis
proposed_new_terms: []
suggested_questions:
  - question: What are the relative contributions of ACSL4 versus other ACSL family
      members to ferroptosis in different tissue contexts?
  - question: Does ACSL4's role in neuronal function relate primarily to ferroptosis or to
      other lipid-dependent processes?
suggested_experiments:
  - description: Lipidomic analysis comparing AA-CoA and AdA-CoA levels in ACSL4 knockout
      versus wild-type cells across different tissue types. This would quantify the
      specific contribution of ACSL4 to PUFA-CoA pools in different cellular contexts.
    hypothesis: ACSL4 is the primary source of AA-CoA and AdA-CoA in ferroptosis-sensitive
      tissues
  - description: Structure-function analysis of ACSL4 disease-causing mutations to
      understand substrate specificity determinants. This would inform both disease
      mechanisms and potential therapeutic interventions.
    hypothesis: Disease mutations affect substrate binding or catalytic efficiency
