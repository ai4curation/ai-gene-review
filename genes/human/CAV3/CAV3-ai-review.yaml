  original_reference_id: PMID:17060380
  qualifier: involved_in
  review:
    summary: The cited study does not establish CAV3-dependent control of heart rate.
    action: MARK_AS_OVER_ANNOTATED
    reason: The complete primary Results and Discussion distinguish mutant late sodium current
      in HEK293 cells from the proposed pacemaking mechanism. The heart-rate argument concerns
      bradycardia in T78M carriers, but T78M was not electrophysiologically tested in this paper;
      its proposed effect on sinus rate is extrapolated from a separate SCN5A mutation. The
      measured F97C/S141R channel effects do not establish that extrapolation. This source-specific
      physiological extension is excessive, without asserting that CAV3 can never influence
      heart rate or disputing the molecular current measurements.
