    supporting_text: 'gain-of-function increase

      in late sodium current'
  - reference_id: PMID:17275750
suggested_questions:
- question: Which native CAV3-dependent mechanisms regulate SCN5A independently of variant overexpression,
    and how do they affect ventricular repolarization, depolarization or pacemaking?
  experts:
  - Cardiac electrophysiology and channel-complex specialists
- question: Does the target-specific structural evidence justify a protein-complex scaffold
    molecular-function annotation for CAV3, distinct from its experimentally supported adaptor
    role? Compare muscle caveolar components in the same structural role before proposing NEW.
- question: How should broad dystrophin-complex membership represent transient beta-dystroglycan
    association versus the biochemical separation of CAV3 from the stable purified complex?
- question: Which donor experiments resolve the undecided metabolic, developmental, focal-adhesion,
    T-tubule and stretch-response transfers, and which observations can be attributed specifically
    to CAV3?
- question: Where is the CAV3-specific endoplasmic-reticulum observation supporting PMID:22792322,
    and do the exact screen records distinguish stable interactions from assay-context associations?
suggested_experiments:
- description: Compare endogenous-level wild-type CAV3 and selected variants in isogenic human
    cardiomyocytes, with matched surface expression and sodium-current, action-potential and
    calcium measurements, to separate channel-complex regulation from overexpression and secondary
    injury.
- description: Measure caveolar assembly and repair-protein recruitment after matched CAV3 perturbations,
    separating oligomer/coat stability, DYSF/TRIM72 localization and membrane repair instead
    of treating one phenotype as proof of every mechanism.
