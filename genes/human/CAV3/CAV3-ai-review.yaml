core_functions:
- description: Caveolar membrane organization and coordinated protein recruitment. At the sarcolemma,
    CAV3 associates with cavins and selected channel partners. The experimentally resolved adaptor
    example recruits NEDD4-2 to hERG and controls mature channel surface turnover; this is distinct
    from CAV3 catalyzing ubiquitination, conducting ions or being an obligatory core subunit
    of the dystrophin complex. Caveola assembly is a conserved, experimentally supported role,
    while the precise structural-scaffold molecular-function representation remains a question.
  molecular_function:
    id: GO:0030674
    label: protein-macromolecule adaptor activity
  directly_involved_in:
  - id: GO:0070836
    label: caveola assembly
  locations:
  - id: GO:0005901
    label: caveola
  - id: GO:0042383
    label: sarcolemma
  supported_by:
  - reference_id: PMID:22879586
    supporting_text: interact with each other and form a complex
  - reference_id: PMID:18936328
  - reference_id: PMID:19726876
  - reference_id: PMID:19380584
- description: Context-dependent regulation of T-type calcium channels. CAV3 associates with
    CaV3.2 and influences its current and PKA-dependent modulation. Human-construct HEK293 studies
    and mouse cardiomyocyte experiments distinguish CaV3.2 from CaV3.1 and distinguish altered
    activity from measured surface abundance; CAV3 is not the channel pore or a calcium-binding
    sensor.
  molecular_function:
    id: GO:0005246
    label: calcium channel regulator activity
  locations:
  - id: GO:0042383
    label: sarcolemma
  supported_by:
  - reference_id: PMID:21084288
    supporting_text: co-expression of Cav-3 did not alter peak Ca(v)3.1 current density
- description: Association with and modulation of cardiac sodium-channel complexes. Human CAV3
    coassociates with SCN5A/Nav1.5, and tested CAV3 variants alter late current in HEK293 expression
    systems. Wild-type CAV3 had no significant baseline effect versus vector in those studies,
    so the evidence does not define a universal wild-type activation or inhibition mechanism.
    Native regulation, heart-rate/contraction consequences and clinical long-QT validity remain
    distinct.
  molecular_function:
    id: GO:0017080
    label: sodium channel regulator activity
  locations:
