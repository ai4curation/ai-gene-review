  review:
    summary: CAV3 regulates CaV3.2 channel activity and its PKA-dependent modulation.
    action: ACCEPT
    reason: The primary study expresses human caveolin-3 with human CaV3.2 or CaV3.1 channels
      in HEK293 cells and also tests mouse cardiomyocytes. CAV3 associates with both channels
      but reduces CaV3.2 current without reducing its measured surface abundance; CaV3.1 current
      is not similarly suppressed. Knockdown removes cAMP-dependent augmentation without simply
      lowering basal T-type current. This supports channel regulator activity with channel-
      and signaling-context specificity.
