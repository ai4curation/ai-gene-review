id: P56539
gene_symbol: CAV3
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Caveolin-3 is a muscle-enriched membrane protein that oligomerizes and contributes
  to caveolar organization at the sarcolemma. It associates with cavins and selected membrane
  partners, coordinating protein recruitment, trafficking and signaling. Channel-specific interactions
  regulate calcium currents and control potassium-channel surface turnover through recruitment
  of NEDD4-2; CAV3 variants can also alter persistent sodium current in expression systems.
  These effects depend on the channel and cellular context. Altered caveolin-3 abundance or
  trafficking disrupts muscle membrane organization and repair, producing a spectrum of caveolinopathy.
  Historical arrhythmia-associated variant studies provide molecular channel evidence with more
  limited gene–disease interpretation.
