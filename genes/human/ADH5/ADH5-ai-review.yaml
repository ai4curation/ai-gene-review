    supporting_text: Here we have purified a single activity from Escherichia coli, Saccharomyces cerevisiae
      and mouse macrophages that metabolizes S-nitrosoglutathione (GSNO), and show that it is the glutathione-dependent
      formaldehyde dehydrogenase.
suggested_questions:
- question: Which tissues depend most on ADH5 relative to ALDH2 for formaldehyde clearance, and does GSNO
    reductase loss contribute to AMeD syndrome?
suggested_experiments:
- description: Compare formaldehyde-induced DNA damage and GSNO/protein-SNO levels in human hematopoietic
    progenitors carrying ADH5 catalytic mutants that separately impair S-(hydroxymethyl)glutathione oxidation
    (Arg115) or GSNO reduction.
