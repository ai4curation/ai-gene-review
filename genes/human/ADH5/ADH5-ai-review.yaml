taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ADH5 is human class III alcohol dehydrogenase (chi-ADH), a ubiquitously expressed cytosolic
  zinc homodimer of the medium-chain dehydrogenase/reductase family and the ancestral form from which
  the ethanol-active ADH classes evolved. Its principal activity is the NAD+-dependent oxidation of S-(hydroxymethyl)glutathione,
  the spontaneous adduct of formaldehyde and glutathione, to S-formylglutathione, which ESD hydrolyzes
  to formate; together with ALDH2 it clears endogenous formaldehyde, and combined ADH5 and ALDH2 deficiency
  causes the formaldehyde-driven AMeD bone marrow failure syndrome. ADH5 is also the conserved S-nitrosoglutathione
  reductase that controls cellular GSNO and protein S-nitrosylation. It oxidizes ethanol very poorly but
  oxidizes long-chain primary alcohols and omega-hydroxy fatty acids, and is activated by fatty acids
  bound at an Arg115-containing site.
