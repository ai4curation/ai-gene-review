- term:
    id: GO:0001772
    label: immunological synapse
  evidence_type: IDA
  original_reference_id: PMID:15708849
  qualifier: part_of
  review:
    summary: Kept VAV3 immunological-synapse localization as a T-cell context.
    action: KEEP_AS_NON_CORE
    reason: TCR signalling recruits VAV3 to the immunological synapse through
      SLP-76. This is a direct and specific VAV3 localization in activated T
      cells, but it is context-specific rather than the only VAV3 operating
      compartment.
    supported_by:
    - reference_id: PMID:15708849
      supporting_text: TCR-induced association of Vav3 with SLP-76 is required
        for its membrane/IS localization and function
- term:
    id: GO:0002768
    label: immune response-regulating cell surface receptor signaling pathway
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN008462184
  - RGD:3951
  - UniProtKB:Q9UKW4
  review:
    summary: Immune-response receptor signalling is a recurring VAV context but
      not a distinct core activity.
    action: KEEP_AS_NON_CORE
    reason: TCR stimulation recruits VAV3 through SLP-76 and requires VAV3 for
      NFAT activation, and the PTN008462184 PAINT node is also seeded by human
      VAV3 itself. This supports immune response-regulating cell surface
      receptor signalling as a T-cell receptor-output context downstream of the
      core VAV3 Rho/Rac GEF activity.
    supported_by:
    - reference_id: file:interpro/panther/PTHR45818/PTHR45818-paint.tsv
      supporting_text: "PTHR45818\tPTN008462184\tGO:0002768\tP\tIBD\tfalse"
    - reference_id: PMID:15708849
      supporting_text: TCR-induced association of Vav3 with SLP-76 is required
        for its membrane/IS localization and function
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
      - source_id: PANTHER:PTN008462184
        source_status: SUPPORTS_TRANSFER
        comment: PTN008462184 is seeded by rat Vav1 and by human VAV3 itself
          (UniProtKB:Q9UKW4), so this row's immune-receptor transfer is
          self-grounded as well as rat-supported.
- term:
    id: GO:0005085
    label: guanyl-nucleotide exchange factor activity
  evidence_type: EXP
  original_reference_id: PMID:8990121
  qualifier: enables
  review:
    summary: Accepted VAV-family Rho GTPase GEF activity; the VAV3 row appears
      miscited to a VAV1 paper.
    action: ACCEPT
    reason: Rho-family nucleotide exchange is the conserved VAV catalytic
      activity; GO:0005089 Rho guanyl-nucleotide exchange factor activity was
      merged into GO:0005085, so GO:0005085 is now the most specific available
      molecular-function term for this activity.
    supported_by: &id001
    - &id004
