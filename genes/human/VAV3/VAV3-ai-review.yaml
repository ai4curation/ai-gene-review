- term:
    id: GO:0005096
    label: GTPase activator activity
  evidence_type: TAS
  original_reference_id: PMID:10523675
  qualifier: enables
  review:
    summary: The cited VAV3 paper supports GEF, not GAP, activity.
    action: REMOVE
    reason: The PINC row assigns GTPase activator activity, the GAP reaction
      that stimulates GTP hydrolysis. PMID:10523675 instead reports GDP-GTP
      nucleotide exchange on RhoA/RhoG/Rac1, so the source term should be
      corrected to GO:0005085 guanyl-nucleotide exchange factor activity.
    supported_by:
    - reference_id: PMID:10523675
      supporting_text: Vav-3 promotes the exchange of nucleotides on RhoA, on
        RhoG and, to a lesser extent, on Rac-1
    source_defects:
    - defect_type: WRONG_TERM
      resource: PINC
      slot: GO_ID
      requested_change: REPOINT
      asserted_value: GO:0005096
      corrected_value: GO:0005085
      corrected_label: guanyl-nucleotide exchange factor activity
      cause: OTHER
      confidence: CONFIRMED
      explanation: The PINC TAS row on human VAV3 cites PMID:10523675 but
        assigns GO:0005096 GTPase activator activity, a GAP reaction. The cited
        abstract reports that VAV3 promotes nucleotide exchange on RhoA, RhoG
        and Rac1 and that the DH and zinc-finger regions promote GDP-GTP
        nucleotide exchange, so the supported activity is GO:0005085
        guanyl-nucleotide exchange factor activity.
      supported_by:
      - reference_id: PMID:10523675
        supporting_text: Vav-3 promotes the exchange of nucleotides on RhoA, on
          RhoG and, to a lesser extent, on Rac-1
