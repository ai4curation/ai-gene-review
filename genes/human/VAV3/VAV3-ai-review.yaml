        RhoG and, to a lesser extent, on Rac-1
    - &id005
      reference_id: file:interpro/panther/PTHR45818/PTHR45818-paint.tsv
      supporting_text: "PTHR45818\tPTN005252413\tGO:0005085\tF\tIBD\tfalse"
    source_defects:
    - defect_type: WRONG_REFERENCE
      resource: REACTOME
      slot: DB:Reference
      requested_change: CHECK
      asserted_value: PMID:8990121
      cause: UNKNOWN
      confidence: PROBABLE
      explanation: The Reactome-derived EXP row assigns VAV3 guanyl-nucleotide
        exchange factor activity using PMID:8990121, a 1997 paper on the
        original VAV/VAV1 protein that predates the 1999 VAV3 identification in
