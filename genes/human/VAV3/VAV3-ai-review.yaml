id: Q9UKW4
gene_symbol: VAV3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'VAV3 is a broadly expressed cytoplasmic VAV-family Rho/Rac guanine nucleotide
  exchange factor. It exchanges nucleotides on RhoA, RhoG and Rac-family substrates
  after tyrosine-kinase signalling, can be recruited to phosphorylated receptors or
  adaptors through its SH2 domain, and contributes to cell-shape and immune-receptor
  signalling contexts through Rho-family GTPase activation.'
