proposed_new_terms: []
suggested_questions:
- question: >-
    Does LRBA bind CTLA4 or a CTLA4-selective sorting adaptor directly to enable
    constitutive entry into Rab11 recycling compartments?
- question: >-
    Which endogenous cargoes besides CTLA4 require LRBA for endosomal recycling and
    endolysosome homeostasis in immune and nonimmune human cells?
- question: >-
    Does LRBA use the same domains and partners for ATG9A trafficking during mitophagy
    as for CTLA4/endosomal traffic?
- question: >-
    Which PKA substrates and B-cell responses depend specifically on LRBA-RII anchoring?
- question: >-
    Are either of the two reviewed LRBA protein isoforms specialized for trafficking,
    autophagy, or PKA anchoring?
suggested_experiments:
- hypothesis: >-
    LRBA selects CTLA4 through a cargo-specific contact required for entry into the
    Rab11 recycling route.
  description: >-
    Endogenously tag LRBA and CTLA4 in primary human T cells, combine pulse-chase
    surface labeling with live Rab11 imaging, and rescue acute LRBA loss with
    candidate cargo-binding mutants.
  experiment_type: Endogenous live-cell trafficking and separation-of-function rescue
- hypothesis: >-
    LRBA controls a broader, cell-type-dependent endosomal recycling cargo set.
  description: >-
    Apply quantitative surface proteomics and recycling assays after acute LRBA
    degradation in primary T cells, B cells, and patient-corrected fibroblasts, with
    CTLA4 as a positive control.
  experiment_type: Comparative trafficking proteomics
- hypothesis: >-
    LRBA directly scaffolds an ATG9A capture or transfer step during mitophagy.
  description: >-
    Synchronize PINK1/Parkin mitophagy in endogenously tagged human cells and combine
    single-particle ATG9A tracking, LRBA acute depletion, proximity labeling, and
    domain-specific rescue.
  experiment_type: Mitophagy trafficking kinetics and interactomics
- hypothesis: >-
    Activation-dependent LRBA-RII binding creates a spatially restricted PKA signaling
    domain required for human B-cell responses.
  description: >-
    Use compartment-targeted PKA biosensors and phosphoproteomics in CD40L/IL-4-
    activated primary B cells after LRBA depletion and rescue with RII-binding-deficient
    mutants.
  experiment_type: Spatial signaling and phosphoproteomics
- hypothesis: >-
    LRBA isoforms differ in abundance or function across immune-cell states.
  description: >-
    Develop isoform-specific proteomic reagents and perform expression-matched
    isoform rescue for CTLA4 recycling, ATG9A trafficking, and PKA anchoring.
  experiment_type: Isoform-resolved proteomics and functional rescue
