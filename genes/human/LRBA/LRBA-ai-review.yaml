      Proximity proteomics found LRBA associated with TOM1 and TOLLIP in a
      Golgi/trans-Golgi transport context.
    supporting_text: |-
      LRBA interacted with both TOM1 and TOLLIP but had molecular context mainly in the Golgi/trans-Golgi transport.
    reference_section_type: RESULTS
    full_text_unavailable: false
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Direct BioID/AP-MS context supports proximity/interaction with TOM1 and
      TOLLIP. It does not establish a stoichiometric stable LRBA complex.
