- term:
    id: GO:0032456
    label: endocytic recycling
  evidence_type: IMP
  original_reference_id: PMID:33960403
  qualifier: involved_in
  review:
    summary: Human LRBA is required for constitutive endocytic recycling of CTLA4 through Rab11 compartments.
    action: NEW
    reason: >-
      LRBA loss impairs constitutive CTLA4 recycling and redirects the internalized
      receptor toward degradation in human-cell experiments. GO:0032456 captures the
      endocytic recycling route without asserting that LRBA is a constitutive Rab11
      component.
    supported_by:
    - reference_id: PMID:33960403
      supporting_text: >-
        Overall, we find that in the absence of ligand, constitutive CTLA‐4 trafficking
        adopts many of the hallmark pathways seen for other clathrin‐mediated endocytic
        receptors. However, CTLA‐4 is specifically dependent on LRBA to permit effective
        recycling via a Rab11 compartment.
