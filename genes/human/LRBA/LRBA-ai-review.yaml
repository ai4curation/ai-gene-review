      providing the source context for an LRBA-CTLA4 IPI record.
    supporting_text: |-
      Here we substantially scale the cell mapping datasets and pipeline, yielding protein biophysical interactions and protein IF images for a matched set of more than 5,100 proteins in U2OS cells (Fig. 1).
    reference_section_type: INTRODUCTION
    full_text_unavailable: false
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: >-
      IntAct/GOA assigns the LRBA interaction to CTLA4 (UniProtKB:P16410), but the
      pair is not exposed in the cached article prose. Do not infer direct binding
      or stable complex membership from this multimodal screen alone.
- id: PMID:11254716
  title: Identification of a novel lipopolysaccharide-inducible gene with key features
    of both A kinase anchor proteins and chs1/beige proteins.
  findings:
  - statement: >-
      The original LBA study found LPS-inducible expression, three tissue-dependent
      transcript isoforms, and stimulated vesicular/trans-Golgi/lysosomal localization.
    supporting_text: |-
      Expression of lba is induced after LPS stimulation of B cells and macrophages.
      In addition, lba is expressed in many other tissues in the body and has three
      distinct mRNA isoforms that are differentially expressed in various tissues.
      Strikingly, LBA-green-fluorescent protein (GFP) fusion proteins are localized to
      vesicles after LPS stimulation. Confocal microscopy indicates this protein is
      colocalized with the trans-Golgi complex and some lysosomes.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Foundational LBA characterization. The cached abstract does not explicitly
      assign the localization experiments to human LRBA, so these fusion-protein
      compartment claims are retained as early ortholog/model evidence rather than
      direct human localization.
- id: PMID:12160729
  title: BCL8 is a novel, evolutionarily conserved human gene family encoding proteins
    with presumptive protein kinase A anchoring function.
  findings:
  - statement: >-
      Human LRBA maps to 4q32, is ubiquitously expressed, and is closely related to
      the large BCL8B protein.
    supporting_text: |-
      LRBA, a human gene with a ubiquitous expression pattern mapping to 4q32, encodes
      a protein closely related to BCL8.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Direct human gene/expression evidence and isoform-2 sequence provenance, but
      the title's PKA-anchoring language is presumptive and does not itself prove
      LRBA-PKA binding.
- id: PMID:15554694
  title: Crystal structure of the PH-BEACH domains of human LRBA/BGL.
  findings:
  - statement: >-
      The human LRBA PH-BEACH tandem has an intimate domain association, while the
      noncanonical PH domain did not bind phospholipids in the reported assays.
    supporting_text: |-
      However, our binding assays demonstrate that the PH domain
      in the BEACH proteins cannot bind phospholipids.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Direct human structural/biochemical evidence. It argues against assigning
      generic phospholipid binding to LRBA's PH domain; the FAN-domain affinity
      measurement should not be transferred to LRBA.
- id: PMID:22608502
  title: Deleterious mutations in LRBA are associated with a syndrome of immune deficiency
    and autoimmunity.
  findings:
  - statement: >-
      Biallelic loss of LRBA in humans disrupts B-cell development, activation,
      plasmablast formation, immunoglobulin secretion, and proliferative responses.
    supporting_text: |-
      Individuals with
      homozygous LRBA mutations had no LRBA, had disturbed B cell development,
      defective in vitro B cell activation, plasmablast formation, and immunoglobulin
      secretion, and had low proliferative responses.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Primary human genetics and patient-cell evidence establishing LRBA deficiency.
      Disease phenotypes bound LRBA function but do not by themselves identify its
      direct molecular activity.
- id: PMID:31883622
  title: Dissecting the localization of lipopolysaccharide-responsive and beige-like
    anchor protein (LRBA) in the endomembrane system.
  findings:
  - statement: >-
      In mononuclear phagocytes, ARF activity controls LRBA trafficking; LRBA is
      enriched on early and late endosomes and is recruited during early autophagy flux.
    supporting_text: |-
      LRBA intracellular trafficking depends on the activity of the GTPase
      ADP ribosylation factor-1 (ARF) in MP. LRBA was identified in early, late
      endosomes but did not colocalize strongly with lysosomal markers.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Direct localization/perturbation evidence in mononuclear-phagocyte context.
      It distinguishes endosomal LRBA from strong lysosome residency and should not
      be generalized to all cell types.
- id: PMID:32592188
  title: Lipopolysaccharide-responsive beige-like anchor acts as a cAMP-dependent protein
    kinase anchoring protein in B cells.
  findings:
  - statement: >-
      LRBA binds PKA RIIbeta in Ramos cells and activation-dependent RIIalpha/RIIbeta
      in primary human B cells, supporting an AKAP/scaffold role.
    supporting_text: |-
      interacting protein. Furthermore, in primary human B cells, LRBA was induced
      after CD40L and IL-4 stimulation, and under such activation, we found that LRBA
      interacts with RIIα and RIIβ, suggesting that LRBA acts as an AKAP and binds RII
      subunits.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Direct human B-cell co-immunoprecipitation supports PKA regulatory-subunit
      anchoring. This does not establish a universal, constitutive LRBA complex or
      catalytic activity.
- id: PMID:33960403
  title: Regulation of CTLA-4 recycling by LRBA and Rab11.
  findings:
  - statement: >-
      LRBA is required upstream of Rab11 to route CTLA4 into recycling compartments;
      LRBA loss reduces recycling and shifts CTLA4 toward degradation.
    supporting_text: |-
      These results show that LRBA is
      required for effective CTLA-4 recycling by delivering CTLA-4 to Rab11 recycling
      compartments, and in its absence, CTLA-4 fails to recycle and undergoes
      degradation.
    reference_section_type: ABSTRACT
    full_text_unavailable: false
  - statement: >-
      The requirement for LRBA is context dependent: loss produced a stronger CTLA4
      phenotype in Jurkat T cells than in HeLa cells, and mouse knockout pathology is limited.
    supporting_text: |-
      Interestingly, the importance of LRBA in regulating CTLA‐4 appears to vary in different species and cell types as LRBA KO mice showed limited pathology [38, 39]. Accordingly, we found that loss of LRBA in Jurkat cells had a much greater effect on CTLA‐4 than in HeLa cells.
    reference_section_type: DISCUSSION
    full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Direct CRISPR/knockdown, recycling, degradation, and colocalization evidence in
      human cell lines plus patient T-cell observations. Strongest mechanistic source
      for the LRBA-Rab11-CTLA4 relationship, with explicit species/cell-type limits.
- id: PMID:39325073
  title: Arf1-dependent LRBA recruitment to Rab4 endosomes is required for endolysosome
    homeostasis.
  findings:
  - statement: >-
      ARF-family GTPases recruit LRBA to the trans-Golgi network and Rab4-positive
      endosomes, where LRBA supports endosomal flow and endolysosome homeostasis.
    supporting_text: |-
      We show that LRBA, however, only slightly colocalizes with Rab11. Instead, LRBA
      is recruited by members of the small GTPase Arf protein family to the TGN and to
      Rab4+ endosomes, where it controls intracellular traffic.
    reference_section_type: ABSTRACT
    full_text_unavailable: false
  - statement: >-
      LRBA-deficient patient fibroblasts accumulate enlarged endolysosomes and show
      increased lysosome secretion.
    supporting_text: |-
      In patient-derived
      fibroblasts, loss of LRBA led to defects in the endosomal pathway promoting the
      accumulation of enlarged endolysosomes and lysosome secretion.
    reference_section_type: ABSTRACT
    full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Current direct human patient-fibroblast and engineered-cell evidence. It refines
      LRBA localization toward TGN/Rab4 endosomes and shows broader endolysosome
      homeostasis beyond CTLA4, without defining LRBA as a stable coat-complex subunit.
core_functions:
- description: >-
    Endosomal sorting scaffold required for constitutive CTLA4 recycling through a
    Rab11 compartment and protection from lysosomal degradation. This human T-cell
    mechanism maintains CTLA4-mediated immune homeostasis without requiring LRBA to
    be a constitutive Rab11-compartment component or stable coat-complex subunit.
  directly_involved_in:
  - id: GO:0032456
    label: endocytic recycling
  locations:
  - id: GO:0005768
    label: endosome
  supported_by:
  - reference_id: PMID:33960403
    supporting_text: >-
      Overall, we find that in the absence of ligand, constitutive CTLA‐4 trafficking
      adopts many of the hallmark pathways seen for other clathrin‐mediated endocytic
      receptors. However, CTLA‐4 is specifically dependent on LRBA to permit effective
      recycling via a Rab11 compartment.
- description: >-
    ARF-family-dependent trafficking scaffold recruited to the trans-Golgi network
    and Rab4-positive endosomes, where it supports general intracellular traffic and
    endolysosome homeostasis. This independently demonstrated route is kept separate
    from the CTLA4-to-Rab11 recycling mechanism; current evidence does not establish
    that the TGN/Rab4 pool directly hands CTLA4 to Rab11.
  locations:
  - id: GO:0005794
    label: Golgi apparatus
  - id: GO:0005768
    label: endosome
  supported_by:
  - reference_id: PMID:39325073
    supporting_text: >-
      We show that LRBA, however, only slightly colocalizes with Rab11. Instead, LRBA
      is recruited by members of the small GTPase Arf protein family to the TGN and to
      Rab4+ endosomes, where it controls intracellular traffic.
- description: >-
    Trafficking factor for delivery of ATG9A-containing vesicles to damaged
    mitochondria and the phagophore assembly site during PINK1/Parkin mitophagy. The
    evidence supports a role in phagophore growth but does not establish LRBA as an
    ATG4 protease, ATG8-processing enzyme, or stable autophagy-complex subunit.
  directly_involved_in:
  - id: GO:0034497
    label: protein localization to phagophore assembly site
  - id: GO:0000423
    label: mitophagy
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:33773106
    supporting_text: >-
      ATG4 proximity networks reveal a role for ATG4s
      and their proximity partners, including the immune-disease protein LRBA, in
      ATG9A vesicle trafficking to mitochondria.
- description: >-
    Activation-dependent A-kinase anchoring activity in human B cells through binding
    to PKA RIIalpha and RIIbeta regulatory subunits. This is a bounded scaffold
    function and does not imply protein kinase activity or a universal constitutive
    LRBA-PKA complex.
  molecular_function:
    id: GO:0034237
    label: protein kinase A regulatory subunit binding
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:32592188
    supporting_text: >-
      interacting protein. Furthermore, in primary human B cells, LRBA was induced
      after CD40L and IL-4 stimulation, and under such activation, we found that LRBA
      interacts with RIIα and RIIβ, suggesting that LRBA acts as an AKAP and binds RII
      subunits.
knowledge_gaps:
- gap_statement: >-
    The direct molecular contacts by which LRBA selects CTLA4 and enables its entry
    into Rab11-dependent recycling are unknown.
  boundary: >-
    Human loss-of-function experiments establish constitutive CTLA4 recycling failure
    and reduced entry into Rab11 compartments, but do not identify a direct LRBA cargo
    contact or sorting partner.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: >-
    Resolving these contacts would distinguish cargo recognition from coat recruitment,
    membrane remodeling, or another scaffold mechanism.
  resolution: >-
    Map endogenous LRBA contacts with CTLA4, Rab11 machinery, and sorting adaptors
    using separation-of-function mutants and purified-component assays.
  provenance:
  - reference_id: PMID:33960403
    supporting_text: >-
      Overall, we find that in the absence of ligand, constitutive CTLA‐4 trafficking
      adopts many of the hallmark pathways seen for other clathrin‐mediated endocytic
      receptors. However, CTLA‐4 is specifically dependent on LRBA to permit effective
      recycling via a Rab11 compartment.
- gap_statement: >-
    The molecular basis for LRBA-mediated endolysosome homeostasis beyond CTLA4 cargo
    is unresolved, including the relevant cargo spectrum and membrane-remodeling step.
  boundary: >-
    LRBA-deficient human fibroblasts accumulate enlarged endolysosomes and increase
    lysosome secretion, but these phenotypes do not identify a direct LRBA activity.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: >-
    This would establish whether CTLA4 is one client of a general LRBA sorting system
    or uses an immune-cell-specialized pathway.
  resolution: >-
    Perform quantitative surface/recycling proteomics and organelle-resolved lipid and
    cargo flux analyses after acute endogenous LRBA depletion and rescue.
  provenance:
  - reference_id: PMID:39325073
    supporting_text: >-
      In patient-derived
      fibroblasts, loss of LRBA led to defects in the endosomal pathway promoting the
      accumulation of enlarged endolysosomes and lysosome secretion.
- gap_statement: >-
    LRBA's direct role in ATG9A-vesicle capture, movement, or fusion at damaged
    mitochondria and the phagophore assembly site is unknown.
  boundary: >-
    Functional proximity experiments establish an LRBA requirement in ATG9A-vesicle
    trafficking during mitophagy but do not reveal its direct molecular activity.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: >-
    Defining the step would connect LRBA's autophagy role to, or separate it from, its
    endosomal sorting mechanism.
  resolution: >-
    Use synchronized mitophagy, endogenous live-cell LRBA/ATG9A imaging, acute
    depletion, and domain-rescue analysis to resolve recruitment and fusion kinetics.
  provenance:
  - reference_id: PMID:33773106
    supporting_text: >-
      ATG4 proximity networks reveal a role for ATG4s
      and their proximity partners, including the immune-disease protein LRBA, in
      ATG9A vesicle trafficking to mitochondria.
- gap_statement: >-
    The physiological outputs and spatial organization of LRBA-dependent PKA RII
    anchoring in primary B cells are unknown.
  boundary: >-
    Activation-dependent binding to RIIalpha and RIIbeta is demonstrated in human B
    cells, but no LRBA-organized PKA substrate or signaling microdomain is established.
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  status: OPEN
  significance: >-
    This is necessary to connect the anchoring interaction to B-cell activation and
    to distinguish it from incidental coimmunoprecipitation.
  resolution: >-
    Compare local PKA activity and phosphoproteomes in activated primary B cells after
    LRBA depletion and rescue with RII-binding-deficient LRBA mutants.
  provenance:
  - reference_id: PMID:32592188
    supporting_text: >-
      interacting protein. Furthermore, in primary human B cells, LRBA was induced
      after CD40L and IL-4 stimulation, and under such activation, we found that LRBA
