- id: PMID:26206937
  title: AUTOIMMUNE DISEASE. Patients with LRBA deficiency show CTLA4 loss and immune
    dysregulation responsive to abatacept therapy.
  findings:
  - statement: >-
      LRBA colocalizes with CTLA4 in endosomal vesicles and protects CTLA4 from
      lysosomal degradation, maintaining CTLA4 protein in activated and regulatory T cells.
    supporting_text: |-
      We found that LRBA colocalized with CTLA4 in endosomal vesicles and
      that LRBA deficiency or knockdown increased CTLA4 turnover, which resulted in
      reduced levels of CTLA4 protein in FoxP3(+) regulatory and activated
      conventional T cells. In LRBA-deficient cells, inhibition of lysosome
      degradation with chloroquine prevented CTLA4 loss.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Direct human patient/cell evidence for the CTLA4 endosomal-trafficking and
      lysosomal-degradation mechanism; abstract-only cache, so finer interaction
      architecture should not be inferred.
- id: PMID:31263572
  title: Dominant TOM1 mutation associated with combined immunodeficiency and autoimmune
    disease.
  findings:
