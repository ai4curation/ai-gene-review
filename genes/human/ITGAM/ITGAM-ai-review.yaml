    label: plasma membrane
  in_complex:
    id: GO:0034688
    label: integrin alphaM-beta2 complex
  supported_by:
  - reference_id: PMID:7524101
    supporting_text: A recombinant fragment representing the CR3 A-domain, a 200-amino acid region in
      the ectodomain of the CD11b subunit, bound to iC3b directly and in a divalent cation-dependent manner.
  - reference_id: PMID:24065820
    supporting_text: We demonstrate that the C3d moiety of iC3b harbors the binding site for the CR3 αI
      domain, and our structure of the C3d:αI domain complex rationalizes the CR3 selectivity for iC3b.
  - reference_id: PMID:24065820
    supporting_text: recognizes iC3b on complement-opsonized objects, enabling their phagocytosis.
  - reference_id: PMID:22586164
    supporting_text: A 31% reduction was observed in the phagocytosis of iC3b opsonised sheep erythrocytes
      (sRBC(iC3b)) by 77H cells (p=0.003)
  - reference_id: PMID:22632727
    supporting_text: Taken together, these data demonstrate that phagocytic signaling through CR3 and
      its ligand C3 is one molecular mechanism by which microglia engulf RGC inputs.
  - reference_id: PMID:27033548
    supporting_text: These data demonstrate that CR3 is necessary for oAβ-dependent engulfment of synapses
      by microglia.
- description: 'CR3/Mac-1 is a promiscuous leukocyte adhesion receptor: the alphaM-beta2 heterodimer binds
    cell adhesion molecules on other cells (ICAM-1 on activated endothelium, JAM-3/JAM-C on platelets
    and epithelium, Thy-1) and matrix or plasma proteins (fibrinogen, TGFBIp), mediating activation-dependent
    firm adhesion of neutrophils and monocytes to endothelium, platelets and matrix, and transmigration.'
  molecular_function:
    id: GO:0050839
    label: cell adhesion molecule binding
  contributes_to_molecular_function:
    id: GO:0004895
    label: cell adhesion receptor activity
