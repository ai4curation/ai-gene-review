    label: integrin alphaM-beta2 complex
  supported_by:
  - reference_id: PMID:1980124
    supporting_text: we conclude that ICAM-1 is a counter receptor for Mac-1 and that this receptor pair
      is responsible, in part, for the adhesion between stimulated neutrophils and stimulated endothelial
      cells.
  - reference_id: PMID:12208882
    supporting_text: JAM-3 directly bound to Mac-1, and this binding was similar in its extent to the
      binding of ICAM-1 or fibrinogen, which both are known ligands for Mac-1
  - reference_id: PMID:15004192
    supporting_text: we have identified the specific interaction between human Thy-1 and the leukocyte
      integrin Mac-1 (CD11b/CD18; alphaMbeta2) both in cellular systems and in purified form.
  - reference_id: PMID:18083624
    supporting_text: mediates monocytes adhesion under both static and flow conditions mainly through
      integrin alphaMbeta2.
  - reference_id: PMID:8986723
    supporting_text: In mice selectively deficient in CD11b/CD18, a beta 2 integrin, chemoattractant-induced
      leukocyte adhesion to microvascular endothelium in vivo was reduced.
suggested_questions:
- question: Does CR3 participate in human microglial engulfment of complement-tagged synapses in the adult
    or Alzheimer disease brain, and is the iC3b-binding alphaI domain sufficient for this, or do co-receptors
    (e.g. CR4/ITGAX, TREM2/TYROBP) contribute?
  experts:
  - microglia biologists
  - complement biologists
- question: Is direct binding of amyloid-beta by CD11b/CD18 established, or does CR3-dependent amyloid-beta
    uptake depend entirely on iC3b opsonisation of amyloid?
  experts:
  - neuroimmunology experts
- question: Should GO represent CR3 recognition of non-complement microbial ligands (e.g. fungal hsp60,
    beta-glucan) with a pattern recognition receptor term rather than heat shock protein binding?
  experts:
  - GO immune curators
suggested_experiments:
- description: In human iPSC-derived microglia carrying ITGAM knockout, R77H, or alphaI-domain MIDAS mutations,
    quantify engulfment of C3-opsonised versus C3-depleted synaptosomes and of fibrillar amyloid-beta
    with and without serum complement.
  hypothesis: Microglial synapse and amyloid uptake via CR3 depends on iC3b recognition by the alphaI
    domain and is reduced by the lupus-associated R77H variant.
  experiment_type: genetic perturbation with phagocytosis assays
- description: Surface plasmon resonance with purified activated alphaI domain against monomeric, oligomeric
    and fibrillar amyloid-beta in the absence of complement.
  hypothesis: CD11b does not bind amyloid-beta directly with appreciable affinity; uptake requires opsonisation.
  experiment_type: biophysical binding assay
