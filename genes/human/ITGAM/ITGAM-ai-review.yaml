id: P11215
gene_symbol: ITGAM
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ITGAM encodes integrin alpha-M (CD11b), the alpha subunit of the leukocyte integrin alphaM-beta2
  (Mac-1), also known as complement receptor 3 (CR3). It is a single-pass type I membrane glycoprotein
  that pairs non-covalently with ITGB2 (CD18) and is expressed on neutrophils, monocytes, macrophages,
  microglia, NK cells and subsets of lymphocytes, with reserve pools in neutrophil granule membranes that
  are mobilised to the cell surface on activation. The inserted von Willebrand factor A-like (alphaI)
  domain of CD11b carries a metal ion-dependent adhesion site that directly binds the C3d moiety of the
  complement opsonin iC3b, so CR3 recognises iC3b-coated microbes, apoptotic cells, immune complexes and
  other complement-tagged material and drives their phagocytosis. CR3 is also a promiscuous adhesion receptor
  that binds ICAM-1, JAM-3, Thy-1, fibrinogen, factor X and extracellular matrix proteins, mediating firm
  adhesion of activated leukocytes to endothelium, platelets and matrix, transmigration, and outside-in
  signalling that influences degranulation, superoxide production, cytokine output and neutrophil apoptosis.
  In the central nervous system, microglial CR3 mediates engulfment of C3-tagged synapses during developmental
  synaptic refinement and has been implicated in microglial uptake of amyloid-beta and in microglia-driven
  neuronal death. The coding variant R77H (rs1143679), which impairs iC3b-mediated phagocytosis and adhesion,
  is associated with systemic lupus erythematosus.
