  supporting_entities:
  - GO:0006911
  - GO:0097242
  review:
    summary: Inferred by curator from ISS amyloid-beta clearance/phagocytosis annotations.
    action: MARK_AS_OVER_ANNOTATED
    reason: CR3 contributes to microglial uptake of Abeta-coated particles and fibrillar Abeta, partly
      via C3 opsonisation (iC3b is the CR3 ligand). The cited studies show antibody blockade/knockout
      effects on uptake but not direct binding of Abeta by CD11b, so a direct amyloid-beta binding MF
      overstates the evidence.
    supported_by:
    - &id002
      reference_id: PMID:20199584
      supporting_text: antibodies against CD11b or CD18 reduced the uptake of the artificial amyloid deposit
        by microglial cell showing that CR3 is involved in the mechanism.
    - &id009
      reference_id: PMID:22438044
      supporting_text: these results demonstrate that C3 and Mac-1 are involved in phagocytosis and clearance
        of fAβ by microglia
- term:
    id: GO:0001774
    label: microglial cell activation
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P05555
  review:
    summary: ISS from mouse Itgam (MAC1 KO reduces MPTP-induced microgliosis).
    action: KEEP_AS_NON_CORE
    reason: MAC1-deficient microglia show reduced activation in the MPTP model; CR3 signaling contributes
      to microglial activation, but this is a context-dependent, disease-model phenotype rather than the
      core receptor function.
