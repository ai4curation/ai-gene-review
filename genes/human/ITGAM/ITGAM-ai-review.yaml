core_functions:
- description: As the alphaM subunit of complement receptor 3 (CR3; ITGAM/ITGB2), CD11b directly binds
    the complement opsonin iC3b through the metal ion-dependent site of its alphaI domain (contacting
    the C3d moiety) and, with ITGB2, forms the iC3b receptor that recognises complement-opsonised targets
    at the plasma membrane of phagocytes and drives their phagocytic engulfment and downstream signalling.
    In microglia, CR3 is the receptor that engulfs C3-tagged synaptic inputs during complement-mediated
    synapse pruning; CR3 does not activate complement or deposit C3 itself.
  molecular_function:
    id: GO:0001852
    label: complement component iC3b binding
  contributes_to_molecular_function:
    id: GO:0001858
    label: complement component iC3b receptor activity
  directly_involved_in:
  - id: GO:0006910
    label: phagocytosis, recognition
  - id: GO:0006911
    label: phagocytosis, engulfment
  - id: GO:0002430
    label: complement receptor mediated signaling pathway
  - id: GO:0150062
    label: complement-mediated synapse pruning
  locations:
