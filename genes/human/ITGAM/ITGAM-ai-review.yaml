    label: leukocyte adhesion to vascular endothelial cell
  - id: GO:0033631
    label: cell-cell adhesion mediated by integrin
  - id: GO:0007160
    label: cell-matrix adhesion
  locations:
  - id: GO:0005886
    label: plasma membrane
  in_complex:
