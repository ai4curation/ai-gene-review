        the ectodomain of the CD11b subunit, bound to iC3b directly and in a divalent cation-dependent
        manner.
    - reference_id: PMID:24065820
      supporting_text: We demonstrate that the C3d moiety of iC3b harbors the binding site for the CR3
        αI domain, and our structure of the C3d:αI domain complex rationalizes the CR3 selectivity for
        iC3b.
