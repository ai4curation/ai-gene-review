  review:
    summary: ISS from mouse; CR3 binding of a C3 fragment.
    action: MODIFY
    reason: CR3 binds the iC3b fragment through the alphaM I-domain; structural work shows the binding
      site lies in the C3d moiety and explains CR3 selectivity for iC3b over C3b. iC3b binding is the
      accurate term.
