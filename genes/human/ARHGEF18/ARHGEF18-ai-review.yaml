taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ARHGEF18, also called p114RhoGEF and septin-associated RhoGEF (SA-RhoGEF),
  is a Dbl-family guanine nucleotide exchange factor built around a DH catalytic domain
  (residues 447-644) followed by a PH domain (684-786), preceded by a degenerate C2H2
  zinc finger and followed by a long coiled coil and disordered C-terminus. Purified
  protein catalyses nucleotide exchange on RhoA and binds RhoA but not Rac1 or Cdc42;
  in cells it has also been reported to activate Rac1, and no source finds activity on
  Cdc42. Its defining property is not which GTPase it acts on but where. It is recruited
  to the apical junctional complex of epithelia and to endothelial tight junctions,
  where it generates a spatially restricted pool of active RhoA that drives
  ROCK-dependent myosin II light-chain phosphorylation, assembles the circumferential
  actomyosin belt, and matures tight junctions into a functional permeability barrier.
  Recruitment is combinatorial and tissue-specific, through the junctional adaptors
  cingulin and paracingulin (with ZO-1 upstream in endothelium), the FERM proteins
  EPB41L4B/Lulu2 and EPB41L5, the polarity proteins PATJ and CRB3A, and LKB1. Its
  activity is modulated by heterotrimeric G proteins. G beta-gamma subunits stimulate
  its exchange activity, and a region near its own C-terminus binds G alpha 12 but not
  G alpha 13, through an interface distinct from the RH domain that the RH-RhoGEFs use.
  It is also bound by SEPTIN9, which inhibits it in one setting and activates it in
  others. Activated
  RhoA binds back onto the PH domain, a positive-feedback interface resolved at 1.4
  angstrom. Loss of the protein does not simply abolish Rho signalling. Junctional RhoA
  falls while non-junctional RhoA rises, so depleted cells lose their junctional
  actomyosin belt and gain basal stress fibres at the same time. The same module
  operates in retinal neuroepithelium, kidney podocytes, syncytiotrophoblast,
  eosinophils and endothelium under shear stress, and the Drosophila ortholog Cysts
  performs the equivalent role at fly adherens junctions. Biallelic loss-of-function
  variants cause autosomal-recessive adult-onset retinal degeneration (retinitis
  pigmentosa 78).
