- term:
    id: GO:0051497
    label: negative regulation of stress fiber assembly
  evidence_type: IMP
  original_reference_id: PMID:25753039
  qualifier: involved_in
  review:
    summary: Depleting p114RhoGEF in human dermal microvascular endothelial cells induces
      stress fibres and vinculin-positive focal adhesions, so the protein is required to
      keep them down. The sign looks inverted for a RhoA activator, and the resolution is
      that the two observations are made in different systems.
    action: KEEP_AS_NON_CORE
    reason: The annotation is supported and reproducible. The same loss-of-function
      phenotype appears independently in epithelium, where Terry et al. report reduced
