      across the orthologs.'
  knowledge_gaps:
  - gap_statement: No annotation anywhere records that ARHGEF18 binds activated RhoA
      through its PH domain, and the term that would name the partner class has been
      merged away.
    boundary: The interaction is resolved at 1.4 angstrom in PDB 6BCB and is functionally
      characterised across the Lbc family, where mutating the PH binding site attenuates
      RhoA stimulation. The ten RhoA-contacting mouse residues map to human Ile-740,
      Arg-742, Glu-743, Val-744, Ala-745, Asn-746, Phe-752, Ile-754, Pro-761 and Met-763,
      all identical.
    gap_kind:
    - CURATION
    - ONTOLOGY
    dark_aspect: MF_DARK
    status: OPEN
    significance: This is the mechanism by which a diffusible GEF produces a
      non-diffusible pool of active GTPase, which is the entire point of the protein. It
      is also the only structural information that exists for this gene, and it is
      uncurated in both species, since the structure was solved on the mouse protein and
      the mouse record does not carry it either.
    resolution: Curation of PMID:29876405 and PMID:23493395 would supply GO:0031267 by
      IPI or IDA with RHOA in the WITH/FROM field, and the natural place to enter it is
      the mouse record, on which the structure was solved. That cannot be reached by
      similarity transfer from either direction, because mouse Arhgef18 has 23 GO
      annotations of which none is experimental and ten are ISO projections from human.
      Ontologically, GO:0017048 Rho GTPase binding is obsolete with term replaced by
      GO:0031267, which itself now has zero children, so the nucleotide-state and partner
      specificity of the interaction cannot be expressed and would have to live in an
      annotation extension.
suggested_questions:
- question: Does ARHGEF18 load Rac1 directly, or is the Rac1 activation seen in cells an
    indirect consequence of RhoA signalling or of GEF displacement?
  experts:
  - Tatyana Voyno-Yasenetskaya, G protein signalling to Rho GTPases and author of the
    paper reporting Rac1 activation
  - Mohammad Reza Ahmadian, quantitative nucleotide-exchange kinetics across the Dbl
    family
- question: The retinal phenotype is adult-onset and recessive while the medaka knockout
    is larval-lethal. Is the human disease a partial-function state, or is the retinal
    requirement genuinely later and more restricted in mammals?
  experts:
  - Karl Matter, junctional RhoA signalling and the ARHGEF18 retinal degeneration
    phenotype
  - Maria Balda, tight junction assembly and epithelial barrier formation
- question: SEPTIN9 inhibits SA-RhoGEF-dependent Rho activation in one study and activates
    ARHGEF18 in two later ones. Is the sign determined by the SEPTIN9 isoform, by the
    subcellular site, or by which region of ARHGEF18 is engaged?
  experts:
  - Masaki Inagaki, septin and RhoGEF interactions; identified SA-RhoGEF as a Sept9b
    partner
  - William Trimble, septin function at the ciliary base and in mitochondrial dynamics
- question: Should GO restore any means of recording GTPase substrate identity for
    exchange factors and activating proteins, given that the merge into GO:0005085 and
    GO:0005096 makes RhoA-directed, Rac-directed and Cdc42-directed regulators
    indistinguishable?
  experts:
  - GO Ontology Development Team, molecular function ontology structure and the rationale
    for the substrate merges
suggested_experiments:
- description: Measure nucleotide-exchange kinetics of the recombinant human ARHGEF18
    DH-PH module on RhoA, RhoB, RhoC, RAC1 and CDC42 by stopped-flow using fluorescent
    nucleotide analogues, with a RhoA-specific GEF (LARG DH/PH) and a Rac1-specific GEF
    (TIAM1 DH/PH) run in parallel as positive controls and the Tyr-606 to alanine mutant
    as the negative control. This is the single experiment that would resolve the
    twenty-five-year-old disagreement between the two discovery papers, and it has never
    been done on this protein.
- description: Knock in the RP78 missense allele (canonical Thr-458 to alanine) at the
    endogenous locus in a polarised human epithelial or retinal organoid model and read
    out junctional active RhoA with a FRET biosensor alongside barrier function. The
    variant is reported as partial loss of function, so the informative measurement is how
    much junctional RhoA activity is lost rather than whether any is, and the same
    readouts distinguish a junction-assembly defect from a maintenance defect.
- description: Test whether the PH-domain RhoA-binding interface is required in cells by
    substituting the contact residues identified in PDB 6BCB (human Arg-742, Glu-743,
    Asn-746) and asking whether junctional RhoA activation, myosin light-chain
    phosphorylation and barrier formation still occur when the DH domain is intact. This
    separates catalysis from positive feedback, which no experiment on this protein has
    yet done.
- description: Determine which SEPTIN9 isoform and which ARHGEF18 region set the sign of
    the septin interaction, by reconstituting exchange assays with defined SEPTIN9
    isoforms against full-length ARHGEF18 and against N-terminal and C-terminal
    truncations. The 2005 study mapped inhibition to the ARHGEF18 C-terminus binding the
    SEPTIN9 N-terminal variable region, while the 2023 and 2025 studies report activation
    through an N-terminal interaction, so the reagents to distinguish the two already
    exist.
