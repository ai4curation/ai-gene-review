    supporting_text: this knockdown impaired later stages of tubulogenesis, resulting in
      multiple lumens in a tube
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Verified against PubMed; abstract only. A stage-specific requirement,
