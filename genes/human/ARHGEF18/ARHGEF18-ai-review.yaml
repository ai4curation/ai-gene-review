- term:
    id: GO:0005085
    label: guanyl-nucleotide exchange factor activity
  evidence_type: IDA
  original_reference_id: PMID:14512443
  qualifier: enables
  review:
    summary: Direct assay of exchange-factor activity. Niu et al. used pull-downs and
      dominant-negative GTPases in cells and found activation of RhoA and Rac1 but not
      Cdc42; Blomquist et al. had already shown exchange on purified RhoA. This is the
      gene's core molecular function and its only curated molecular-function evidence.
    action: ACCEPT
    reason: 'The term is correct and is the most specific one GO offers. It is worth
      being explicit that this is not a granularity choice. GO:0005089 Rho guanyl-nucleotide
      exchange factor activity was merged into GO:0005085 (obsolete, term replaced by
      GO:0005085, obsolescence reason IAO:0000227), as were the Rac, Ras, ARF, Rab and
      Ran equivalents, and GO:0005085 now has no is_a children. Checked in QuickGO,
      OLS4 and the GO API, because QuickGO silently resolves merges and returns the
      replacement record as non-obsolete. Substrate identity is therefore carried in
      core_functions.substrates and recorded as an ontology knowledge gap rather than
      proposed as a new term. Two caveats on the evidence itself, both left in place
      rather than acted on. First, this paper''s Rac1 result is contradicted by the
      purified-protein experiment in PMID:11085924 and by the in-cell depletion in
      PMID:21258369; UniProt carries both readings and so does this review. Second,
      Reactome places ARHGEF18 in a generic GEFs catalyst set for a p75NTR reaction
      whose stated outputs are RAC1 and Cdc42, which is a set-level assignment rather
      than a measurement on this protein.'
    supported_by:
    - reference_id: PMID:14512443
      supporting_text: we have determined that p114RhoGEF activated RhoA and Rac1 but
        not Cdc42 proteins
    - reference_id: PMID:11085924
      supporting_text: p114-Rho-GEF interacted specifically with RhoA, in its nucleotide-free
        and guanosine 5'-[gamma-thio]triphosphate-bound states, but not with Rac1 and
        Cdc42, and efficiently catalysed guanine nucleotide exchange of RhoA
    - reference_id: PMID:21258369
      supporting_text: p114RhoGEF is a widely expressed gene and, in vitro, functions
        as a specific activator of RhoA17-19. Accordingly, depletion of p114RhoGEF resulted
        in reduced levels of active RhoA in HCE cells without significantly affecting
        Rac and Cdc42
    - reference_id: file:human/ARHGEF18/ARHGEF18-deep-research-affinage.md
      supporting_text: Through its DH/PH catalytic module it activates RhoA (and Rac1, but
        not Cdc42)
    knowledge_gaps:
    - gap_statement: Whether ARHGEF18 is a RhoA-only exchange factor or acts on Rac1 as
        well is unresolved, and the answer is not expressible in GO either way.
      boundary: Both primary papers agree it does not act on Cdc42. Purified protein
        exchanges nucleotide on RhoA and does not bind Rac1 or Cdc42 (PMID:11085924);
        in-cell pull-downs with dominant-negative GTPases report RhoA and Rac1
        (PMID:14512443); in-cell depletion reduces active RhoA without affecting Rac
        (PMID:21258369). The 1.4 angstrom structure of the protein's own PH domain is
        with RhoA (PDB 6BCB).
      gap_kind:
      - BIOLOGY
      - ONTOLOGY
      dark_aspect: MF_DARK
      status: OPEN
      significance: RhoA and Rac1 drive opposing cytoskeletal programmes, contraction
        versus protrusion, so which one a GEF loads determines the sign of its effect
        on the actin cortex. A GEF annotated only as a GEF is, for pathway modelling,
        barely annotated.
      resolution: Biologically, real-time exchange kinetics on the human DH-PH module
        against a RhoA, Rac1, Cdc42, RhoB and RhoC panel would settle it. The one
        systematic Dbl-family panel of this kind does not include p114RhoGEF.
        Ontologically nothing can be proposed, since GO:0005089, GO:0030676, GO:0005088,
        GO:0005086, GO:0017112 and GO:0005087 were all merged into GO:0005085, which now
        has zero is_a children in both OLS4 and QuickGO, exactly as the RhoGAP terms were
        merged into GO:0005096.
