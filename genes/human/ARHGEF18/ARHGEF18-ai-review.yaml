- term:
    id: GO:0120192
    label: tight junction assembly
  evidence_type: IMP
  original_reference_id: PMID:21258369
  qualifier: involved_in
  review:
    summary: Proposed new annotation. Depleting p114RhoGEF leaves spreading and initial
      contact formation intact but blocks junctional maturation, so ZO-1 staining stays
      discontinuous, and transepithelial resistance reaches only 40 per cent of control
      while 4 and 70 kilodalton dextran continues to leak.
    action: NEW
    reason: This is the process the gene is best characterised for and GOA does not record
      it at all. The experiment is a clean loss-of-function with a quantitative functional
      readout, and it is stage-resolved, since initial adhesion is unaffected and only
      maturation fails, which is what makes the assembly term rather than a maintenance
      term correct. It is corroborated in three further systems, bronchial epithelium
      through LKB1, endothelium through ZO-1 and paracingulin, and MDCK tubulogenesis
      where lumen consolidation specifically fails. The same paper supplies the two
      proposed compartment annotations, and it has produced no GO annotation in any
      species, which is the single largest curation gap on this gene.
    supported_by:
    - reference_id: PMID:21258369
      supporting_text: Depletion of p114RhoGEF strongly attenuated barrier formation and
        only reached 40% of the values of control cultures
    - reference_id: PMID:21258369
      supporting_text: Thus, p114RhoGEF is not required for spreading and initiation of
        adhesion, but for junctional maturation.
    - reference_id: PMID:23648482
      supporting_text: Together, LKB1 and p114RhoGEF control RhoA activity in these cells
        to promote apical junction assembly
