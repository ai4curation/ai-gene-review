      depletions of ZO-1 and JACOP
  - statement: Vinculin is in the p114RhoGEF complex but not the ZO-1 complex, which is
      what makes the protein localization to cell-cell junction annotation specific rather
      than a general junction phenotype.
    supporting_text: p114RhoGEF, and not ZO-1, immunoprecipitates contained vinculin
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Title names ZO-1, not ARHGEF18, but the full text contains substantial
      p114RhoGEF experiments and the ARUK-UCL curator clearly read them; all three GOA rows
      derived from it check out against the cached full text.
- id: PMID:26217016
  title: CRB3A Controls the Morphology and Cohesion of Cancer Cells through Ehm2/p114RhoGEF-Dependent
    Signaling.
  findings:
  - statement: CRB3A recruits p114RhoGEF and its activator Ehm2 to the cell periphery and
      raises RhoA activation, converting an ameboid morphology into an epithelial one with
      a circumferential actomyosin belt.
    supporting_text: CRB3A recruits p114RhoGEF and its activator Ehm2 to the cell periphery
      using both functional motifs of its cytoplasmic tail and increases RhoA activation
      levels
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Verified against PubMed; abstract only. Adds the Crumbs polarity module
      to the list of tissue-specific recruitment mechanisms, and pairs with the Drosophila
      result that the Crumbs complex recruits Cysts. Produced zero GO annotations in any
      species.
- id: PMID:26483385
  title: p114RhoGEF governs cell motility and lumen formation during tubulogenesis through
    a ROCK-myosin-II pathway.
  findings:
  - statement: p114RhoGEF knockdown leaves early tubulogenesis intact but impairs later
