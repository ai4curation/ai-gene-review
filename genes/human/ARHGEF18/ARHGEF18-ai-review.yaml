core_functions:
- description: Guanine-nucleotide exchange factor that generates a spatially restricted
    pool of active RhoA at the apical junctional complex. The DH domain, whose conserved
    catalytic tyrosine is intact at Tyr-606, catalyses GDP release from RhoA; purified
    protein does this on RhoA and does not bind Rac1 or Cdc42, while in cells the protein
    has also been reported to load Rac1, and no source finds activity on Cdc42. The
    protein is not constitutively junctional. It is recruited there by a combinatorial
    set of adaptors that differs by tissue, cingulin in epithelium, ZO-1 and paracingulin
    in endothelium, EPB41L4B/Lulu2 with PATJ apically, CRB3A, LKB1, and EPB41L5 in
    podocytes, and its output is read out by a complex containing ROCK II and myosin IIA
    that it co-precipitates with. The functional consequence is myosin light-chain
    phosphorylation confined to the junction, which builds the circumferential actomyosin
    belt and matures tight junctions into a barrier. Because confluent cells globally
    downregulate RhoA, losing this protein does not lower Rho signalling overall, it moves
    it, so depleted cells simultaneously lose junctional actomyosin and gain basal stress
    fibres. The substrates listed are what the protein has been shown to act on, and the
    disagreement between them is unresolved rather than settled; the sequence analysis run
    here cannot arbitrate it.
