- id: PMID:28132693
  title: Biallelic Mutation of ARHGEF18, Involved in the Determination of Epithelial
    Apicobasal Polarity, Causes Adult-Onset Retinal Degeneration.
  findings:
  - statement: Biallelic ARHGEF18 variants cause adult-onset recessive retinal
      degeneration, and the gene is described as a RHOA activator.
    supporting_text: ARHGEF18 encodes ARHGEF18, a guanine nucleotide exchange factor that
      activates RHOA, a small GTPase protein that is a key component of tight junctions and
      adherens junctions
  - statement: The RP78 missense allele hits a conserved DH-domain residue required for
      RHOA interaction and activation; UniProt records it as VARIANT 458 T to A.
    supporting_text: the p.Thr270Ala missense variant affects a highly conserved residue in
      the DBL homology domain, which is required for the interaction and activation of RHOA
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Verified against PubMed. The disease finding itself licenses no GO term,
      but the variant characterisation supports the direction of the process annotation.
      Abstract only in the cache, and it produced zero GO annotations in any species.
- id: PMID:28536193
  title: The FERM protein EPB41L5 regulates actomyosin contractility and focal adhesion
    formation to maintain the kidney filtration barrier.
  findings:
  - statement: EPB41L5 binds and recruits ARHGEF18 to the leading edge of podocytes to
      control actomyosin contractility and focal adhesion maturation.
    supporting_text: by binding and recruiting the RhoGEF ARGHEF18 to the leading edge,
      EPB41L5 directly controls actomyosin contractility and subsequent maturation of focal
      adhesions, cell spreading, and migration
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Verified against PubMed. Extends the FERM-protein recruitment mechanism
      from EPB41L4B in epithelium to EPB41L5 in podocytes. Note that the abstract spells
      the gene ARGHEF18, which is why symbol-based retrieval misses it; the quoted text
      preserves the misspelling because it is verbatim.
- id: PMID:29601110
  title: Expression of novel "LOCGEF" isoforms of ARHGEF18 in eosinophils.
  findings:
  - statement: Alternative N-terminal isoforms of ARHGEF18 sit at the plasma membrane in
      resting eosinophils and redistribute to the two poles on cytokine-induced polarisation.
    supporting_text: Immunofluorescence microscopy revealed striking relocalization of
      LOCGEFs from the plasma membrane to the two poles upon polarization of eosinophils by
      IL5, IL33 and CCL11
  - statement: The canonical p114 isoform is absent from eosinophils, so the junctional
      mechanism cannot be assumed to operate there.
    supporting_text: No p114 transcript or protein band was detected in eosinophils.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Verified against PubMed, full text available. Defines the five UniProt
      isoforms and the only localisation evidence outside epithelium and endothelium. The
      p114 isoform is not detected in eosinophils, so the junctional mechanism cannot be
      assumed to apply there.
- id: PMID:29876405
  title: Crystal structures of the PH domains from Lbc family of RhoGEFs bound to activated
    RhoA GTPase.
  findings:
  - statement: The PH domain of p114RhoGEF was solved at 1.4 angstrom in complex with RhoA
      (PDB 6BCB); this is the only structure of any part of ARHGEF18.
    supporting_text: Here we present two crystal structures at resolutions of 1.4 Å and 2.0
      Å of RhoA complexed with the PH domain from p114RhoGEF (PDB access code 6BCB) and
      AKAP-LbcRhoGEF (PDB access code 6BCA), respectively
  - statement: Direct PH-domain binding to activated Rho GTPases is a property of the whole
      Lbc family.
    supporting_text: All 7 Lbc RhoGEFs associate directly with activated Rho GTPases via
      their PH domains
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Verified against PubMed; open access, full text and coordinates freely
      available. Missed by the automated provider because the title names the family. It
      has produced zero GO annotations in any species, so the only structural information
      about this gene is absent from its GO record.
- id: PMID:31051012
  title: A Gα12-specific Binding Domain in AKAP-Lbc and p114RhoGEF.
  findings:
  - statement: A C-terminal region of p114RhoGEF binds G alpha 12 through a mechanism
      distinct from the RH domain interface used by the RH-RhoGEFs.
    supporting_text: We identified a Gα12-binding region near the C-terminus of AKAP-Lbc,
      closely homologous to a region of p114RhoGEF that we also discovered to interact with
      Gα12
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Verified against PubMed, full text available. The second heterotrimeric
      G protein input to this gene alongside the G beta-gamma stimulation in PMID:14512443.
      Produced zero GO annotations in any species.
- id: PMID:31409654
  title: Apical polarity proteins recruit the RhoGEF Cysts to promote junctional myosin
    assembly.
  findings:
  - statement: Drosophila Cysts is the single ortholog of mammalian p114RhoGEF, GEF-H1,
      p190RhoGEF and AKAP-13, which is what makes the PAINT node seeded by all four a
      legitimate ancestral inference.
    supporting_text: To explore the regulation of Rho GTPases in vivo, we analyzed the Rho
      GTPase guanine nucleotide exchange factor (RhoGEF) Cysts, the Drosophila orthologue
      of mammalian p114RhoGEF, GEF-H1, p190RhoGEF, and AKAP-13
  - statement: Cysts activates Rho1 at junctions and stabilises junctional myosin, the fly
      equivalent of the mammalian junctional module.
    supporting_text: Cysts activates Rho1 at adherens junctions and stabilizes junctional
      myosin
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Verified against PubMed, full text available. Establishes the orthology
      that underwrites this gene's exchange-factor IBD. Missed by the automated provider
      because the title names the fly gene.
