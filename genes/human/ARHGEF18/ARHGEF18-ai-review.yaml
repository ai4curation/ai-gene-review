    action: KEEP_AS_NON_CORE
    reason: A single high-throughput pull-down between two members of the same RhoGEF
      clade, with no follow-up anywhere in the literature and no functional consequence
      reported. Kept because the dataset is a curated interactome rather than a
      prediction and the accession resolves correctly; non-core because nothing is
      known about what the contact does, and because paralogs sharing a compartment are
