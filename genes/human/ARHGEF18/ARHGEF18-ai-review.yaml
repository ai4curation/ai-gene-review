  review:
    summary: Co-immunoprecipitation with CGNL1 (paracingulin, called JACOP in the paper)
      from human dermal microvascular endothelial cell extracts. The interaction is
      real and mechanistically important, but protein binding as a term says nothing
      about what it does.
    action: KEEP_AS_NON_CORE
    reason: 'Q0VF96 resolves to CGNL1, cingulin-like protein 1. The finding this row
      stands for is that paracingulin, downstream of ZO-1, is what puts ARHGEF18 at
      endothelial junctions, which is the recruitment arm of the protein''s core
      function rather than an accessory contact. Kept rather than removed because the
      interaction is directly observed; non-core because the informative content is a
      localisation dependency and GO:0005515 cannot express it. The same paper''s two
      IMP rows do carry that content. A more informative molecular-function term is not
      available, since GO:0017048 Rho GTPase binding, the nearest analogue for the
      partner class, was itself merged into GO:0031267 small GTPase binding, and that
      would in any case be the wrong partner here.'
    supported_by:
    - reference_id: PMID:25753039
      supporting_text: p114RhoGEF and JACOP coimmunoprecipitated from endothelial cell
        extracts, and both ZO-1 and JACOP were required for junctional recruitment of
        p114RhoGEF
