  knowledge_gaps:
  - gap_statement: GO cannot record which GTPase this exchange factor acts on, and the
      merge that removed the vocabulary was deliberate.
    boundary: The literature is specific where GO is not. Purified protein exchanges on
      RhoA and does not bind Rac1 or Cdc42; in cells, RhoA is reported by three groups and
      Rac1 by one; Cdc42 is excluded by all. The 1.4 angstrom structure of this protein's
      PH domain is with RhoA.
    gap_kind:
    - ONTOLOGY
    dark_aspect: MF_DARK
    status: OPEN
    significance: Substrate identity is the difference between a contractility factor and
      a protrusion factor. Without it, every Dbl-family protein in the ontology collapses
      onto one indistinguishable term.
    resolution: No term can be proposed. GO:0005089 Rho guanyl-nucleotide exchange factor
      activity is obsolete with term replaced by GO:0005085 and obsolescence reason
      IAO:0000227, and the Rac, Ras, ARF, Rab and Ran equivalents went the same way;
      GO:0005085 now has zero is_a children in OLS4 and QuickGO alike. The pattern extends
      beyond the GEFs, since GO:0017048 Rho GTPase binding was merged into GO:0031267 and
      the RhoGAP terms into GO:0005096. Substrate identity is carried here in the
      substrates slot and by RO:0002233 has_input in any downstream causal model.
  - gap_statement: The two primary papers disagree about Rac1, and the experiment that
      would settle it has never been done on this protein.
    boundary: Blomquist used purified protein and a binding plus exchange assay; Niu used
      in-cell pull-downs with dominant-negative GTPases, a design that can report indirect
      loading. Terry's depletion experiment in corneal epithelial cells found no effect on
      Rac.
    gap_kind:
    - BIOLOGY
    dark_aspect: MF_DARK
    status: OPEN
    significance: The Rac1 claim is what licenses the reactive-oxygen-species arm of this
      gene's described biology and its placement in Reactome's RAC1 GTPase cycle. If it is
      an indirect effect, a whole branch of the gene's annotation rests on nothing.
    resolution: Real-time nucleotide-exchange kinetics on the recombinant human DH-PH
      module against RhoA, RhoB, RhoC, RAC1 and CDC42, alongside a RhoA-specific and a
      Rac1-specific comparator. The one published systematic panel of this kind, covering
      21 Dbl proteins against 12 Rho GTPases, does not include p114RhoGEF.
- description: A second, non-catalytic interaction with the same GTPase, on a different
    domain and in the opposite nucleotide state. The PH domain binds RhoA loaded with GTP,
    which the DH domain does not; the two sites are distinct, and the arrangement makes
    the protein a positive-feedback amplifier rather than a simple catalyst, so that RhoA
    already activated at a junction recruits and potentiates more exchange activity at the
    same site. This is the one part of ARHGEF18 that has been solved structurally, at 1.4
    angstrom for the mouse PH domain bound to a GTP-analogue-loaded RhoA, and the entire
    RhoA-contacting surface is conserved in the human protein. The same interface is
    shared with the other Lbc-family RhoGEFs and is absent from Rac- and Cdc42-specific
    GEFs. It is the most plausible molecular explanation for how junctional RhoA activity
    stays spatially restricted instead of diffusing, and GO records none of it.
