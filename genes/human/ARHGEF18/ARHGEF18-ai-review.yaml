      which is a consequence of PANTHER splitting the vertebrate ARHGEF18 lineage into
      its own family after the IBD was made, not evidence that the seeds are wrong.
      The propagation is in any case redundant here, because human ARHGEF18 carries an
      IDA for the same term and Blomquist et al. measured exchange on purified protein.
