- term:
    id: GO:0031267
    label: small GTPase binding
  evidence_type: ISS
  original_reference_id: PMID:29876405
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q6P9R4
  review:
    summary: Proposed new annotation, and the only molecular function of this protein
      that has been solved structurally. The PH domain of the mouse ortholog was
      crystallised at 1.4 angstrom bound to RhoA loaded with a GTP analogue, PDB 6BCB,
      and the same interface is a general property of the Lbc-family RhoGEFs, where it
      acts as a positive-feedback mechanism rather than as the catalytic site.
    action: NEW
    reason: This is a distinct activity from the exchange reaction, on a different domain
      and in the opposite nucleotide state, and GO records none of it for this gene in any
      species. The transfer is by sequence similarity rather than IPI because the solved
      construct is the mouse ortholog UniProtKB:Q6P9R4; the ten RhoA-contacting residues
      computed from 6BCB at 4 angstrom map to human Ile-740, Arg-742, Glu-743, Val-744,
      Ala-745, Asn-746, Phe-752, Ile-754, Pro-761 and Met-763, all identical, so the
      interface is conserved without exception. GO:0031267 is the most specific term
      available, because GO:0017048 Rho GTPase binding was merged into it and it now has
      zero is_a children in both OLS4 and QuickGO, so neither the partner identity nor the
      GTP-loaded state can be expressed in the term itself. The reference field is
      deliberately the paper rather than GO_REF:0000024. That GO_REF covers manual
      transfer of experimentally-verified annotation data to orthologs, which presupposes
      an annotation on the donor, and the mouse record carries no GO:0031267 to transfer.
      Mouse Arhgef18 has 23 GO annotations and not one of them is experimental, ten being
      ISO projections from human. Citing PMID:29876405 directly keeps the row consistent
      with that fact, since the paper is where the similarity-bearing evidence actually
      lives. The cleaner two-step route, if MGI will take it, is to enter GO:0031267 on
      the mouse record first by IPI from this paper with RHOA in the WITH/FROM field, and
      let the human row follow as an ISS behind it.
    supported_by:
    - reference_id: PMID:29876405
      supporting_text: Here we present two crystal structures at resolutions of 1.4 Å and
        2.0 Å of RhoA complexed with the PH domain from p114RhoGEF (PDB access code 6BCB)
        and AKAP-LbcRhoGEF (PDB access code 6BCA), respectively
    - reference_id: PMID:23493395
      supporting_text: This demonstrates feasibility of the hypothesis that binding of
        activated RhoA to the PH domains acts as a positive feedback mechanism
    - reference_id: file:human/ARHGEF18/ARHGEF18-bioinformatics/RESULTS.md
      supporting_text: 'Bottom line: all ten RhoA-contacting residues of the mouse
        PH domain are identical in human ARHGEF18 and all ten lie inside the human
        PH domain (684-786), so the RhoA-binding interface is conserved without
        exception across the orthologs.'
- term:
    id: GO:0035023
    label: regulation of Rho protein signal transduction
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:103264
  - PANTHER:PTN002677784
  - UniProtKB:Q12802
  review:
    summary: Phylogenetic propagation from PTN002677784, seeded by mouse Arhgef2 and
      human AKAP13. The conclusion is right but the term is sign-agnostic, and everything
      known about this protein says the sign is positive.
    action: MODIFY
    reason: Every primary experiment on ARHGEF18 shows activation of Rho signalling,
      never inhibition. Purified protein catalyses exchange on RhoA; expressing it raises
      active RhoA and phosphorylated myosin light chain; depleting it lowers junctional
      active RhoA; and a patient missense allele in the DH domain reduces RHOA
      activation. UniProt already phrases the variant effect as decreased function in
      positive regulation of Rho protein signal transduction. GO:0035025 positive
      regulation of Rho protein signal transduction is current and non-obsolete in
      QuickGO, OLS4 and the GO API, and it is an is_a child of the term annotated here,
      so this is a straightforward refinement rather than a change of meaning. The
      refinement is warranted at clade level and not only from target data, which matters
      because an IBA encodes a judgment about the clade rather than about this gene. Both
      seeds are themselves exchange factors, mouse Arhgef2 being GEF-H1 and Q12802 being
      AKAP13/Lbc, and an exchange factor is by definition a positive regulator of its
      GTPase when active, so the ancestral call the node encodes already carries the
      positive sign; the target-specific results agree with it rather than substituting
      for it. Two further observations do not change the action. The seeds are paralogs
      rather than the target or its fly ortholog; and Terry et al. show that ARHGEF18
      and GEF-H1 are functionally opposed at junctions, GEF-H1 being recruited and
      switched off where ARHGEF18 is recruited and switched on, which is a reason to be
      careful about transferring regulatory detail between them even though both
      positively regulate Rho when active.
    proposed_replacement_terms:
    - id: GO:0035025
      label: positive regulation of Rho protein signal transduction
    supported_by:
    - reference_id: PMID:28132693
      supporting_text: the p.Thr270Ala missense variant affects a highly conserved residue
        in the DBL homology domain, which is required for the interaction and activation
        of RHOA
    - reference_id: PMID:23698346
      supporting_text: We show that ArhGEF18-mediated activation of the small GTPase RhoA
        is required to maintain apicobasal polarity at the onset of retinal differentiation
        and to control the ratio of neurogenic to proliferative cell divisions
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN002677784
        source_label: PTHR47440 ancestral node, Lbc/RH-RhoGEF clade
        source_status: SUPPORTS_TRANSFER
        comment: The clade-level inference is sound; only the sign-agnostic term is at
          issue.
      - source_id: MGI:MGI:103264
        source_label: mouse Arhgef2 (GEF-H1)
        source_status: SUPPORTS_TRANSFER
        comment: A paralog, not the ortholog. Terry et al. show the two proteins are
          oppositely regulated at epithelial junctions.
      - source_id: UniProtKB:Q12802
        source_label: AKAP13 (Lbc)
        source_status: SUPPORTS_TRANSFER
        comment: A paralog. Its PH domain binds activated RhoA in the same way this
          protein's does, in two structures from one study, PDB 6BCA and 6BCB.
