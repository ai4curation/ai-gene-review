- id: file:human/ARHGEF18/ARHGEF18-deep-research-affinage.md
  title: Affinage mechanistic annotation for ARHGEF18 (human)
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: LOW_QUALITY
    review_notes: Blocking trust gates passed (accession Q6ZSZ5, human), but the soft gate
      tripped. Affinage's own head-to-head self-evaluation scored this record as a tie
      rather than a win against the curated UniProt reference. Precision was good, since
      every PMID it returned resolves to a real paper about this gene, and the three
      identifiers checked most closely (20810787, 23648482, 26483385) match the papers it
      described. Recall was the problem. It missed the founding biochemistry
      (PMID:11085924), the paper that named the protein SA-RhoGEF (PMID:15558029), the only
      structure of the protein (PMID:29876405), the family-level positive-feedback study
      (PMID:23493395), the podocyte recruitment mechanism (PMID:28536193), the open-access
      septin precursor (PMID:36912772) and the Drosophila ortholog work (PMID:31409654). It
      also states the substrate as RhoA and Rac1 citing only PMID:14512443, without the
      contradicting purified-protein result.
- id: file:human/ARHGEF18/ARHGEF18-bioinformatics/RESULTS.md
  title: ARHGEF18 (p114RhoGEF) bioinformatics
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Reproducible analysis committed alongside this review. Resolves the two
      published loss-of-function substitutions onto the current canonical sequence
      (Thr-458, Tyr-606), shows that the conserved Dbl tyrosine is pan-family and therefore
      uninformative about substrate, validates a structure-anchored substrate classifier at
      8 of 8 on held-out proteins and then shows why its ARHGEF18 answer should not be
      pushed, and maps the ten RhoA-contacting PH residues of PDB 6BCB onto the human
      protein. Both scripts carry self-tests with positive and negative controls, all
      passing.
