  original_reference_id: PMID:24997597
  qualifier: located_in
  review:
    summary: CEP152 localizes at the peripheral scaffold associated with developing centriole-assembly
      sites.
    action: ACCEPT
    reason: The source images CEP152 rings around mother and maturing daughter centrioles and PLK4
      redistribution toward a SAS6-positive procentriole site. It does not place CEP152 within the
      cartwheel or centriole lumen. The curated procentriole-context assertion is retained together
      with independent human imaging of CEP152 at induced procentriole rosettes in PMID:22020124
      Figure 1C; precise ring-to-procentriole geometry remains distinct from intrinsic procentriole
      structure.
