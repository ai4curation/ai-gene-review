id: O94986
gene_symbol: CEP152
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CEP152 is a large coiled-coil centrosomal scaffold that organizes centriole biogenesis.
  With CEP63 it forms a higher-order cylindrical assembly around the proximal region of a parent
  centriole. Its N-terminal region binds and positions PLK4, and distinct interactions with CPAP/CENPJ
  support procentriole initiation. CEP152 also participates in the conserved Deup1-dependent machinery
  for centriole amplification in multiciliated cells. During mitosis, a CEP152–CEP63 complex restrains
  CEP57-dependent pericentrin recruitment, while CEP152 recruits APC/C and undergoes ubiquitylation
  associated with release of this restraint. Biallelic CEP152 variants cause primary microcephaly
  9 and Seckel syndrome 5.
