    id: GO:1901673
    label: regulation of mitotic spindle assembly
  evidence_type: IMP
  original_reference_id: PMID:34878135
  qualifier: involved_in
  review:
    summary: CEP152 regulates spindle assembly through its centrosomal inhibitory complex and APC/C
      recruitment.
    action: NEW
    reason: This corrects the inherited reviewer-authored NEW proposal from direct spindle assembly
      to regulation of mitotic spindle assembly; the original proposed object is preserved in audit
      provenance. PMID:34878135 Figures 3–5 show APC/C association despite mutated substrate-recognition
      motifs, CEP152-dependent centrosomal APC/C recruitment while centrioles remain, and increased
      CEP57–pericentrin association/recruitment after CEP152 depletion. Thus CEP152 performs regulatory
      work beyond being a substrate. DBK mutant persistence delays microtubule nucleation and bipolar
      spindle formation. The study does not demonstrate a purified direct APC/C interface; its Discussion
      explicitly allows ubiquitylation-dependent relocation without obligatory degradation. GO:1901673
      captures this regulation more precisely than calling CEP152 a spindle-building component.
