core_functions:
- description: CEP152 forms an integral scaffold with CEP63 around the proximal centriole. Its spatially
    distinct PLK4- and CPAP-binding regions organize centriole-duplication machinery; self-assembly
    and human mutant-rescue experiments connect this architecture to procentriole initiation.
  molecular_function:
    id: GO:0140378
    label: protein complex scaffold activity
  directly_involved_in:
  - id: GO:0007099
    label: centriole replication
  locations:
  - id: GO:0000242
    label: pericentriolar material
  in_complex:
    id: GO:0120099
    label: procentriole replication complex
  supported_by:
  - reference_id: PMID:20852615
  - reference_id: PMID:21059844
    supporting_text: Cep152 recruits Plk4 and CPAP
  - reference_id: PMID:30858376
  - reference_id: PMID:37433832
- description: During mitosis, CEP152 participates in a CEP63–CEP57 regulatory complex that restrains
    pericentrin recruitment and recruits APC/C at centrosomes. APC/C-dependent ubiquitylation and
    reduced centrosomal CEP152 permit remodeling of this complex, regulating spindle microtubule
    nucleation and assembly.
  molecular_function:
    id: GO:0140378
    label: protein complex scaffold activity
  directly_involved_in:
  - id: GO:1901673
    label: regulation of mitotic spindle assembly
  locations:
  - id: GO:0005813
    label: centrosome
  supported_by:
  - reference_id: PMID:34878135
    supporting_text: the Cep152-Cep63 complex has an inhibitory function on Cep57
proposed_new_terms: []
suggested_questions:
- question: Does APC/C-mediated CEP152 ubiquitylation principally relocate the scaffold, promote
    its degradation, or do both in distinct mitotic phases?
- question: How do CEP152 assembly geometry and its CEP63–CEP57 interactions coordinate centriole
    duplication with mitotic pericentrin recruitment?
- question: How directly do the four human CEP152 isoforms support Deup1-dependent amplification
    in native human multiciliated epithelia, and do their partner preferences differ?
suggested_experiments:
- description: Compare endogenous CEP152 localization and total abundance during mitosis using targeted
    ubiquitylation-site or degron perturbations, with matched measurements of CEP57–pericentrin association
    and spindle microtubule regrowth.
