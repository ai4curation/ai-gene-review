taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'ROCK2 is a RhoA/RhoB/RhoC-activated AGC serine/threonine protein kinase that phosphorylates
  actomyosin and cytoskeletal substrates, including myosin-phosphatase and ERM-family targets, and thereby
  regulates smooth muscle contractility, stress fibers, focal adhesions, cell motility, centrosome biology
  and nuclear transcriptional outputs.'
