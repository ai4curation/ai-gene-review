core_functions:
  - molecular_function:
      id: GO:0004743
      label: pyruvate kinase activity
    description: >-
      PKM catalyzes the final rate-limiting step of glycolysis, transferring a phosphoryl
      group
      from phosphoenolpyruvate (PEP) to ADP to generate pyruvate and ATP. CRITICAL
      ISOFORM
      DISTINCTION: PKM1 (P14618-2) is constitutively active with HIGH activity in
      adult tissues
      (muscle, brain, heart). PKM2 (P14618-1) has LOW basal activity requiring allosteric
      activation by fructose-1,6-bisphosphate, and is expressed in embryonic tissues
      and cancer
      cells. PKM2's low activity allows glycolytic intermediates to accumulate for
      biosynthetic
      pathways - the metabolic basis of the Warburg effect.
    supported_by:
      - reference_id: file:human/PKM/PKM-deep-research-falcon.md
        supporting_text: "PKM catalyzes the terminal glycolytic step: **PEP + ADP → pyruvate + ATP**. This reaction couples high-energy phosphate transfer to ATP production and is a principal flux-control point in glycolysis."
      - reference_id: file:human/PKM/PKM-deep-research-affinage.md
        reference_section_type: RESULTS
        supporting_text: "The interconversion between oligomeric states is the central regulatory switch: tetramerization favors enzymatic pyruvate kinase activity, whereas dimer/monomer formation favors nuclear functions"
references:
  - id: file:human/PKM/PKM-uniprot.txt
    title: UniProtKB record for human PKM (P14618)
    findings:
      - statement: UniProt annotates nuclear homodimeric PKM2 (Isoform M2) as a protein threonine and tyrosine kinase phosphorylating STAT3 (Tyr-705) and histone H3 (Thr-11).
        record_section:
          - CC:FUNCTION
        supporting_text: "Translocates into the nucleus in response to various signals, such as EGF receptor activation, and homodimerizes, leading to its conversion into a protein threonine- and tyrosine-protein kinase"
        finding_review:
          finding_status: DISPUTED
          superseded_by:
            - PMID:26300261
          review_notes: >-
            Direct PEP- or ATP-dependent protein kinase activity of PKM2 was
            challenged by Hosios et al. (2015, PMID:26300261), who detected no
            PKM2-dependent protein phosphorylation in vitro using either PEP or
            ATP as a phosphate donor across recombinant and PKM2-null systems.
          supported_by:
            - reference_id: PMID:26300261
              supporting_text: "We investigated the protein kinase activity of PKM2; however, we were unable to demonstrate PKM2-dependent phosphorylation of any proteins in vitro using either PEP or ATP as a phosphate donor. Instead, all PKM2-dependent phosphotransfer events observed involved regeneration of ATP from ADP and PEP, the known function of PKM2 in glycolysis."
  - id: PMID:26300261
    title: Lack of Evidence for PKM2 Protein Kinase Activity.
    publication_type: PRIMARY_RESEARCH
    findings:
      - statement: Biochemical assays using [32P]-PEP, [gamma-32P]-ATP, recombinant wild-type or R399E PKM2, and PKM2-null cell extracts detected no direct PKM2-dependent protein kinase activity, showing instead that PKM2-dependent phosphotransfer reflects canonical ATP regeneration from PEP and ADP.
        supporting_text: "We investigated the protein kinase activity of PKM2; however, we were unable to demonstrate PKM2-dependent phosphorylation of any proteins in vitro using either PEP or ATP as a phosphate donor. Instead, all PKM2-dependent phosphotransfer events observed involved regeneration of ATP from ADP and PEP, the known function of PKM2 in glycolysis."
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: >-
        Rigorous biochemical evaluation of reported PKM2 protein kinase activity
        using HPLC-purified [32P]-PEP, [gamma-32P]-ATP, recombinant WT/R399E
        PKM2, and Pkm2-null MEF lysates, demonstrating that apparent
        PEP-dependent protein phosphorylation is explained by contaminating
        [gamma-32P]-ATP or canonical pyruvate-kinase regeneration of ATP from
        ADP rather than direct protein phosphorylation by PKM2.
  - id: file:human/PKM/PKM-deep-research-affinage.md
    title: Affinage mechanistic annotation for PKM (human)
    findings:
      - statement: Tetrameric PKM drives canonical glycolytic pyruvate kinase flux, whereas dimeric/monomeric PKM2 translocates to the nucleus to coordinate transcription, cell-cycle progression, and inflammatory signaling.
        supporting_text: "PKM (PKM2 isoform) is a multifunctional glycolytic pyruvate kinase whose tetrameric form drives metabolic flux but whose dimeric/monomeric forms acquire non-canonical activities upon translocation to the nucleus, coordinating metabolism with gene expression, cell-cycle control, and inflammation [PMID:22056988, PMID:24316223]."
        reference_section_type: RESULTS
      - statement: Biochemical reconstitution with [32P]-PEP challenged direct PKM2-dependent protein kinase activity, highlighting controversy over non-canonical protein phosphorylation claims.
        supporting_text: "Using [32P]-phosphoenolpyruvate (PEP) with recombinant enzyme and PKM2-deleted in vitro systems, no PKM2-dependent protein kinase activity was detected; labeled protein species required ADP and were not PKM2-dependent, and direct phosphate transfer from ATP to protein by PKM2 was not observed."
        reference_section_type: RESULTS
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: >-
        High-faithfulness synthesis (self_evaluation_pairwise: win, faith_pct: 100.0,
        40 citations) that accurately captures the PKM2 tetramer-to-dimer regulatory
        switch, nuclear coactivator functions (CTNNB1, STAT3, H3T11), PEP-dependent
        PGAM1 H11 histidine phosphorylation (PMID:38750259), and the biochemical
        challenge to direct PKM2 protein-kinase activity (PMID:26300261).
