- term:
    id: GO:0005829
    label: cytosol
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: located_in
  supporting_entities:
  - ARBA:ARBA00029243
  review:
    summary: Cytosolic association is compatible with a soluble regulatory light-chain protein.
    action: KEEP_AS_NON_CORE
    reason: The cytoplasmic IBA and conserved light-chain architecture support an intracellular soluble
      pool. Reactome places this protein in myosin-associated reactions, but these location annotations
      alone do not establish a specific MYL10-dependent contractile mechanism. The ARBA row is an annotation
      overlap, not independent validation.
    supported_by:
    - reference_id: file:human/MYL10/MYL10-uniprot.txt
      supporting_text: Myosin is a hexamer of 2 heavy chains and 4 light chains.
