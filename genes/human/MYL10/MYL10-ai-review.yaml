id: Q9BUA6
gene_symbol: MYL10
product_type: PROTEIN
status: IN_PROGRESS
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: MYL10 is a myosin regulatory light-chain family protein with EF-hand calcium-binding motifs.
  It is an intracellular protein associated with myosin-family regulation by evolutionary inference. A
  mitochondrial localization has been reported for expressed human MYL10 and propagated through curated
  phylogenetic annotation, but the physiological function of this pool and the specific endogenous myosin
  partner remain incompletely characterized.
existing_annotations:
- term:
    id: GO:0005509
    label: calcium ion binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000549442
  - UniProtKB:P10916
  review:
    summary: Calcium-binding EF-hand architecture supports the conserved molecular function.
    action: ACCEPT
    reason: Human MYL10 has PROSITE-ProRule calcium-coordinating positions in the first EF-hand. The horse
      protein retains the EF-hand core, including the corresponding binding-region sequence. The IBA represents
      curated placement of calcium binding in the light-chain phylogeny; the InterPro evidence is compatible
      sequence support. Direct calcium-binding measurements on horse MYL10 are not asserted.
    supported_by:
    - reference_id: file:human/MYL10/MYL10-uniprot.txt
      supporting_text: /ligand="Ca(2+)"
