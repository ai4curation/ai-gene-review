- term:
    id: GO:0005829
    label: cytosol
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: located_in
  supporting_entities:
  - ARBA:ARBA00029243
  review:
    summary: Cytosol is a correct location for a soluble myosin regulatory light chain.
    action: ACCEPT
    reason: MYL10 is a soluble RLC-family protein, and the IBA to cytoplasm (above) establishes the compartment;
      cytosol is the specific soluble compartment where non-filament-bound light chains and cytoplasmic myosin II
      reside. The Reactome rows place MYL10 among the light chains in smooth-muscle contraction reactions; those
      reactions are curated for the RLC family generically and do not show that MYL10 itself acts in smooth muscle
      (its closest relatives are sarcomeric RLCs, and the mouse gene is expressed in precursor lymphocytes), but
      the location claim stands on its own. The ARBA row is a machine-learned prediction that agrees with this,
      not independent evidence.
    supported_by:
    - reference_id: file:human/MYL10/MYL10-uniprot.txt
      record_section: ["CC:SUBUNIT"]
      supporting_text: Myosin is a hexamer of 2 heavy chains and 4 light chains.
