  evidence_type: IPI
  original_reference_id: PMID:32296183
  qualifier: enables
  supporting_entities:
  - UniProtKB:P36508
  review:
    summary: Binary interactome hit with ZNF76; generic protein binding is uninformative and is removed under the
      protein-binding policy.
    action: REMOVE
    reason: 'The IPI comes from the HuRI binary interactome screen (PMID:32296183), and UniProt lists the Q9BUA6-P36508
      (ZNF76) pair with three experiments. The interaction may well be real, but GO:0005515 says nothing about what
      MYL10 does: ZNF76 is a nuclear zinc-finger transcription factor with no established link to myosin light-chain
      function, and no informative molecular-function term can be derived from a yeast two-hybrid hit alone. Removal
