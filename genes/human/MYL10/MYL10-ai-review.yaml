  review:
    summary: Cytoplasmic distribution is compatible with the conserved myosin light-chain role.
    action: ACCEPT
    reason: The curated ancestral IBA supports cytoplasmic activity within the myosin light-chain family.
      This is an appropriate location for a soluble light-chain protein and there is no target-specific
      evidence of loss. It does not imply that all MYL10 is exclusively cytoplasmic.
    supported_by:
    - reference_id: file:human/MYL10/MYL10-uniprot.txt
      supporting_text: Myosin is a hexamer of 2 heavy chains and 4 light chains.
- term:
    id: GO:0005739
    label: mitochondrion
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - PANTHER:PTN002746160
  - UniProtKB:Q9BUA6
  review:
    summary: Retain the reported mitochondrial localization as a non-core localization.
    action: KEEP_AS_NON_CORE
    reason: Human MYL10 has a direct expressed-fusion-protein localization annotation under GO_REF:0000054.
      The PAINT IBA is experimentally grounded on that human observation and is not circular because human
      MYL10 appears as its own descendant source. The horse transfer is plausible but the physiological
      function of this mitochondrial pool is unresolved; do not infer a mitochondrial targeting sequence
      or a mitochondrial myosin motor from this observation.
