- term:
    id: GO:0005739
    label: mitochondrion
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - PANTHER:PTN002746160
  - UniProtKB:Q9BUA6
  review:
    summary: A mitochondrial pool is reported by a human GFP-fusion localization and propagated within the MYL10
      subfamily; retained as a non-core location.
    action: KEEP_AS_NON_CORE
    reason: 'The IDA row is a LIFEdb localization of an expressed fusion protein (GO_REF:0000054), and the IBA (PTN002746160,
      the MYL10-subfamily node) is grounded on that human observation; human Q9BUA6 appearing as its own source
      is the expected marker of experimental grounding, not circularity. The mouse ortholog Myl10 (Q62082, same
      PANTHER subfamily SF36) independently carries a mitochondrion HDA annotation from the MitoCarta mouse tissue
      proteome (PMID:18614015), so two independent methods in two species agree. The location is therefore kept,
      but as non-core: no mitochondrial targeting signal is annotated, the 60-residue N-terminal extension has not
      been tested as one, and no mitochondrial activity or partner of MYL10 is known.'
    additional_reference_ids:
    - PMID:18614015
