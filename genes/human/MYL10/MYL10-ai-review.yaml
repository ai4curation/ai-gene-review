core_functions:
- description: Divalent-cation (calcium) binding EF-hand protein of the sarcomeric-type myosin regulatory light
    chain lineage, expected to act as a non-catalytic light-chain subunit on a myosin heavy-chain neck in the cytoplasm;
    its endogenous myosin partner is not identified.
  molecular_function:
    id: GO:0005509
    label: calcium ion binding
  locations:
  - id: GO:0005737
    label: cytoplasm
  supported_by:
  - reference_id: file:human/MYL10/MYL10-uniprot.txt
    record_section: ["FT:BINDING"]
    supporting_text: /ligand="Ca(2+)"
  - reference_id: file:human/MYL10/MYL10-deep-research-falcon.md
    supporting_text: It is not itself an ATPase, kinase, transporter, or receptor.
suggested_questions:
- question: PAINT propagated myosin heavy chain binding and myosin II complex only at the nonmuscle RLC node (MYL9/MYL12A/B),
    not to the sarcomeric-type node that includes MYL2 and MYL10. Should the sarcomeric clade, including MYL10,
    carry a myosin-complex or heavy-chain-binding term, given that RLC binding to the heavy-chain neck is ancestral
    to the whole family?
- question: Which myosin heavy chain does MYL10 load onto in precursor lymphocytes and in skeletal muscle, where
    its transcript is enriched?
- question: Human MYL10 retains the RLC N-terminal phosphorylation motif (RKRAEGTASSNVFSMF, compare MYL2 KKRAGGANSNVFSMF
    with Ser15 phosphorylated). Is the MYL10 serine aligned with MYL2 Ser15 phosphorylated in vivo, and by which
    kinase?
suggested_experiments:
- description: Co-immunoprecipitation/proteomics of endogenous or tagged MYL10 from lymphoid and muscle cells to
    identify its myosin heavy-chain partner(s).
- description: Isothermal titration or fluorescence measurement of Ca2+ and Mg2+ binding by recombinant MYL10, with
    a D97A/E108A first-EF-hand mutant as control.
- description: Fractionation and imaging of endogenous MYL10 to test the mitochondrial pool, and deletion of the
    N-terminal extension to test whether it directs that localization.
