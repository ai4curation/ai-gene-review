  - UniProtKB:P36508
  review:
    summary: The ZNF76 binary interaction is retained as a non-core experimental observation.
    action: KEEP_AS_NON_CORE
    reason: The cited human interactome study supplies an IPI interaction, and the reviewed UniProt record
      independently lists Q9BUA6–P36508 with three experiments. Generic protein binding does not identify
      the physiological role of MYL10 or establish a myosin partner. Retain the observation without treating
      it as a core function.
    supported_by:
