id: Q9BUA6
gene_symbol: MYL10
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: MYL10 (myosin regulatory light chain 10; also called PLRLC, precursor lymphocyte-specific regulatory
  light chain) is a non-enzymatic, calmodulin-like EF-hand protein of the myosin regulatory light chain (RLC) family.
  It belongs to the MYL10 subfamily of the RLC family, which sits in the sarcomeric-type lineage that also contains
  the cardiac and skeletal RLCs MYL2, MYL7 and MYLPF, rather than with the nonmuscle/smooth-muscle RLCs MYL9 and
  MYL12A/B. The human protein (226 aa) carries a unique N-terminal extension of about 60 residues ahead of the conserved
  RLC core; the core contains a canonical calcium-coordinating loop in the first EF hand and three predicted EF-hand
  domains. By family membership MYL10 is expected to bind the neck (lever-arm) region of a myosin heavy chain and
  to modulate actomyosin mechanics, but its endogenous heavy-chain partner, regulatory phosphorylation and calcium
  affinity have not been measured. The mouse ortholog was first described as a gene expressed in precursor B and
  T lymphocytes and induced by interleukin-7. The protein is soluble and cytoplasmic; an expressed GFP-fusion of
  human MYL10 and a mouse mitochondrial proteome both place a pool in mitochondria, whose function is unknown.
