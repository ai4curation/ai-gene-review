- term:
    id: GO:0005509
    label: calcium ion binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000549442
  - UniProtKB:P10916
  review:
    summary: Calcium ion binding is the conserved molecular function placed by PAINT at the sarcomeric-type RLC
      node and supported by the canonical first EF-hand loop in human MYL10.
    action: ACCEPT
    reason: The IBA derives from PAINT node PTN000549442, the node shared by MYL2, MYL7, MYLPF and MYL10 (human
      MYL2, P10916, is the experimental donor); MYL10 falls inside that clade (PANTHER subfamily PTHR23049:SF36)
      and has no sequence evidence of loss. Human MYL10 residues 97-108 (DQNRDGFIDKED) form a canonical 12-residue
      EF-hand calcium-binding loop with D/N/D/D at positions 1, 3, 5 and 9 and Glu at position 12, matching the
      PROSITE EF_HAND_1 pattern and the ProRule binding-site features in the UniProt record. The InterPro2GO row
      (IPR002048) is consistent sequence-level support. No direct calcium affinity measurement exists for MYL10,
      so the assertion rests on phylogeny and conserved coordinating residues; in RLCs this first-EF-hand site is
      the divalent-cation (Ca/Mg) site, not a calmodulin-like trigger.
    supported_by:
