id: A6NG13
gene_symbol: MGAT4D
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: MGAT4D, also called GnT1IP, is a catalytically diverged GT54-family type-II membrane 
  protein. Its luminal domain inhibits MGAT1 in the Golgi, reducing the conversion of Man5GlcNAc2 to
  hybrid and complex N-glycans. Unlike MGAT4A and MGAT4B, MGAT4D has no detected GnT-IV catalytic 
  activity in the available transfected-cell studies.
