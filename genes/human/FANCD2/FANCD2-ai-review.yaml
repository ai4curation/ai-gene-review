suggested_questions:
- question: Which FANCD2 DNA-contact and ubiquitination-dependent states are required for interstrand-crosslink
    repair, aphidicolin-stalled fork restart, hydroxyurea-dependent fork restraint and checkpoint signaling
    in matched human cell backgrounds?
- question: How do the four natural FANCD2 products differ in DNA binding, FANCI association and localization,
    and which are expressed at sufficient abundance to contribute to repair?
- question: Does FANCD2 participate in removal of pre-existing R-loops, or chiefly prevent their formation
    through RNA processing and export?
suggested_experiments:
- description: Compare endogenous-level rescue of FANCD2-deficient human cells with wild-type, K561R and
    validated DNA-contact mutants. Measure ID2 abundance and DNA residence alongside lesion-matched crosslink
    repair, aphidicolin washout restart, hydroxyurea fork progression and DNA-synthesis checkpoint assays;
    control cell-cycle state and avoid interpreting unequal rescue-protein expression as state equivalence.
- description: Establish product-specific transcript and protein abundance, then test each natural product
    at matched levels for FANCI association, DNA binding and compartment localization. Use antibodies
    or targeted peptides that distinguish products and retain full-length and engineered truncation controls
    as separate reagents.
- description: Separate R-loop formation from clearance with an inducible transcription pulse followed
    by shutoff, orthogonal RNA–DNA hybrid measurements and RNase-H controls. Compare FANCD2 loss and rescue
    while measuring RNA export, so reduced steady-state hybrids are not automatically interpreted as direct
    disassembly.
