description: FANCD2 is a nuclear DNA-binding protein that partners with FANCI in the ID2 DNA-repair complex.
  Monoubiquitination by the Fanconi anemia core machinery remodels ID2 into a closed clamp around duplex
  DNA, supporting repair of interstrand cross-links. FANCD2 also contributes to homologous-recombination
  repair and recovery of stalled replication forks, while its checkpoint effects depend on the lesion
  and cellular context. It helps coordinate repair-factor recruitment and RNA-associated genome protection
  without itself providing the nuclease, polymerase or ubiquitin-transfer reactions. Biallelic pathogenic
  variants cause Fanconi anemia complementation group D2. The relative activities of its four natural
  protein products remain incompletely resolved.
