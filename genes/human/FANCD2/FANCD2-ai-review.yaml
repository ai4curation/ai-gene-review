core_functions:
- description: FANCD2 binds DNA and forms the FANCI–FANCD2 repair complex, whose monoubiquitinated state
    encircles duplex DNA as a closed clamp. This DNA-associated unit supports interstrand-crosslink repair,
    homologous-recombination repair and recovery of stalled replication forks. Purified FANCD2 preferentially
    binds single-stranded DNA, whereas the reconstituted ubiquitinated heterodimer accommodates duplex
    DNA; these are distinct experimental states of one functional unit. FANCL/UBE2T catalyze ubiquitin
    transfer, and downstream nucleases and polymerases perform the chemical repair steps.
  molecular_function:
    id: GO:0003677
    label: DNA binding
