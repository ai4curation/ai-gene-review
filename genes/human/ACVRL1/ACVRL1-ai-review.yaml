references:
- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO terms
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Official InterPro mapping method inspected. Domain membership supports the shared kinase-domain claim, not a specific endothelial response.
- id: GO_REF:0000024
  title: Manual transfer of experimentally verified manual GO annotation data to orthologs by curator judgment of sequence similarity
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Manual ortholog-transfer rows were kept only where mouse Acvrl1 phenotypes match known ALK1 vascular biology.
- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Phylogenetic inference across TGF-beta-superfamily receptors was interpreted against human ALK1 ligand evidence.
- id: GO_REF:0000044
  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot Subcellular Location vocabulary mapping, accompanied by conservative changes to GO terms applied by UniProt
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The UniProt subcellular-location vocabulary transfer is consistent with the single-pass receptor acting at the plasma membrane.
- id: GO_REF:0000107
  title: Automatic transfer of experimentally verified manual GO annotation data to orthologs using Ensembl Compara
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Ensembl Compara transfers from mouse Acvrl1 were retained for vascular contexts but not treated as independent human experiments.
- id: GO_REF:0000108
  title: Automatic assignment of GO terms using logical inference, based on inter-ontology links
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The logical inference from activin receptor activity reaches a real but non-core receptor-defined pathway for ALK1.
- id: GO_REF:0000117
  title: Electronic Gene Ontology annotations created by ARBA machine learning models
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
