suggested_questions:
- question: Which BMP9/BMP10 receptor stoichiometries and endothelial states determine whether ALK1 signaling increases or decreases endothelial proliferation?
  experts: []
- question: How much of contextual TGF-beta signaling through ALK1 reflects direct ligand recognition versus recruitment of ALK1 by ALK5/TGFBR2 or accessory receptors such as endoglin?
  experts: []
- question: Should GO-CAM BMP9 models type ALK1, BMPR2, and ACVR2B activities with GO:0098821 BMP receptor activity rather than activin/TGF-beta receptor terms when the ligand is BMP9?
  experts: []
suggested_experiments:
- hypothesis: Endothelial receptor composition controls the sign of BMP9/ALK1 proliferation outputs.
  description: Quantify BMPR2, ACVR2A/B, ENG, and ALK5 abundance in matched primary human endothelial states, perturb each receptor alone and in combination, and measure BMP9-induced SMAD1/5, SMAD2, migration, proliferation, and survival endpoints separately.
- hypothesis: BMP9-ALK1 signaling improves colonic epithelial barrier function through colonocyte differentiation rather than acute assembly of bicellular tight junctions.
  description: Use primary human colonic monolayers with acute and chronic BMP9/ALK1 perturbation to measure new tight-junction assembly, junctional protein turnover, TEER, and colonocyte markers independently.
