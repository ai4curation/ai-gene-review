id: P37023
gene_symbol: ACVRL1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ACVRL1 encodes ALK1, a single-pass plasma-membrane type I serine/threonine kinase receptor of the TGF-beta superfamily. It forms heteromeric receptor complexes with type II receptors such as BMPR2 or ACVR2B, binds high-affinity BMP-family ligands BMP9/GDF2 and BMP10 through its extracellular domain, and phosphorylates receptor-regulated SMADs through its cytosolic kinase domain to trigger BMP/TGF-beta transcriptional responses. ALK1 signaling is especially important in vascular endothelium and lymphatic development, and ACVRL1 loss-of-function variants cause hereditary hemorrhagic telangiectasia type 2.
