core_functions:
- description: Binds actin filaments and severs them, promoting actin turnover and depolymerization
    in the muscle cytoskeleton. Full-length human protein has direct severing and depolymerization
    activity; muscle LIM protein modulates the latter. Human muscle studies report Z-disc/I-band
    localization, whereas neonatal rat cardiomyocytes show enrichment near M-bands. The shared
    sarcomeric context is represented here without claiming an exclusive subregion or converting
    the rat result into a human M-band assay.
  molecular_function:
    id: GO:0003789
    label: actin filament severing activity
  directly_involved_in:
  - id: GO:0051014
    label: actin filament severing
  - id: GO:0030042
    label: actin filament depolymerization
  locations:
  - id: GO:0015629
    label: actin cytoskeleton
  - id: GO:0030017
    label: sarcomere
  supported_by:
  - reference_id: PMID:35440100
    supporting_text: wild-type (WT) CFL2 showed much higher severing activity as compared to
      WT CFL1
  - reference_id: PMID:19752190
  - reference_id: PMID:25373779
  - reference_id: PMID:17160903
suggested_questions:
- question: What direct experiment establishes CFL2 association with the nuclear matrix, separately
    from nuclear entry or actin-rod formation?
- question: Which screen interactions occur endogenously in striated muscle, and how do CFL2
    abundance, actin state and partner variants affect them?
suggested_experiments:
- description: Compare purified human CFL2 products and disease variants by single-filament
    severing and end-depolymerization assays at matched occupancy, with explicit actin isoform
    and pH controls.
- description: Use validated CFL2-selective reagents and endogenous tagging to distinguish Z-disc,
    adjacent I-band and nuclear-matrix pools without CFL1 cross-reactivity.
