id: Q9Y281
gene_symbol: CFL2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Cofilin-2 is an actin-binding protein enriched in striated muscle that promotes
  filament severing and depolymerization. Its direct interaction with actin changes filament
  organization and supports turnover of sarcomeric thin filaments. Cofilin-2 localizes to the
  muscle actin cytoskeleton, including the Z-disc region, and interacts with muscle LIM protein,
  which modulates its activity. Human CFL2 variants can cause congenital myopathy with abnormal
  actin accumulation and sarcomeric organization.
