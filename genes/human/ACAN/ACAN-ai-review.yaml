suggested_questions:
- question: What is the hyaluronan-independent activity that recruits aggrecan into perineuronal
    nets? Point mutations that abolish hyaluronan binding entirely still allow aggrecan to
    incorporate into perineuronal nets, only less efficiently, which means the long-standing model
    in which the hyaluronan-lectican-link protein ternary complex is the sole anchor is incomplete.
    Identifying the second binding partner would settle whether the cartilage and central nervous
    system pools of aggrecan assemble by the same mechanism, and it would supply the molecular
    function term that the perineuronal net localisation currently lacks.
- question: Does full-length aggrecan perform a defined extracellular-matrix assembly step that
    warrants GO:0085029 beyond the established hyaluronan-binding and structural activities?
    PMID:40273987 tests binding of added human fragments to pre-existing mouse neuronal nets, not de
    novo net formation. Reactome R-HSA-2318623 already represents aggrecan-hyaluronan-HAPLN1
    binding. Compare current VCAN, BCAN and NCAN curation and resolve the structural-participant
    convention before proposing an additional process annotation.
- question: Can the aggrecan substrate relationship be represented in a GO-CAM protease activity
    node through has input? Aggrecan turnover is biologically important, but being cleaved does not
    establish that aggrecan performs the proteolytic step.
- question: How much does vascular aggrecan contribute to vessel-wall mechanics? Human aortic and
    venous studies support extracellular localization, and venous protein/transcript levels change
    in disease, but those measurements alone do not establish the mechanical contribution of this
    pool.
- question: What is the ligand or structural role of G2, which resembles G1 but did not bind
    hyaluronan in PMID:40273987? Region-specific experiments should distinguish G1 hyaluronan
    binding, central-chain compression resistance and COMP binding, and G3 tenascin/fibulin
    interactions.
- question: Would a cartilage-specific matrix term add useful compartment resolution beyond the
    confirmed extracellular matrix and gel-phase terms? A separate proposal would require an
    ontology-wide synonym search and comparison with existing specialized-matrix terms; this
    question does not defer the verified GO:0140150 parent relationship.
suggested_experiments:
- hypothesis: A specific protein or glycan partner, distinct from hyaluronan, anchors aggrecan in
    perineuronal nets.
  description: Use the hyaluronan-binding-null G1 and G1-G2 fragments as affinity baits on detergent
    extracts of cortical perineuronal net material, identify retained partners by mass spectrometry,
    and test candidates by knockdown in cortical cultures followed by quantitative measurement of
    fragment incorporation. Hyaluronidase pretreatment of the cultures provides the orthogonal
    control.
  experiment_type: biochemistry and cell biology
- hypothesis: Compression resistance is a quantitative function of aggrecan dosage and of
    glycosaminoglycan chain substitution rather than of core protein abundance alone.
  description: Measure equilibrium and dynamic compressive moduli of cartilage explants across a
    graded aggrecan dosage series, including tissue from heterozygous patients carrying truncating
    alleles, and correlate the mechanical readout with quantified chondroitin sulfate content and
    aggregate size determined by size-exclusion chromatography.
  experiment_type: biomechanics
- hypothesis: G3 variants have separable effects on secretion and matrix retention.
  description: Compare secretion, matrix incorporation and turnover of wild-type and
    disease-associated G3 variants by pulse-chase in chondrocytes. Use tenascin-R, tenascin-C and
    fibulin-1 binding as established G3 readouts. Assay intact aggrecan-COMP binding separately with
    glycosaminoglycan controls, rather than assuming it is a G3 interaction.
  experiment_type: cell biology and biochemistry
- hypothesis: The G2 region has a distinct ligand despite its close structural similarity to the
    hyaluronan-binding G1.
  description: Screen purified G2 against glycosaminoglycan and matrix protein arrays by biolayer
    interferometry, using G1 as the positive control for hyaluronan, and attempt cocrystallisation
    with any ligand that binds. A negative result across a broad panel would itself be informative,
    supporting a purely spacer or protease-presentation role for G2.
  experiment_type: structural biology and biophysics
