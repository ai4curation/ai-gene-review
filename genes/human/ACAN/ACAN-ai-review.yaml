- term:
    id: GO:0005540
    label: hyaluronic acid binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: Correct and core - this is the activity that makes aggrecan an aggregating proteoglycan. The
      N-terminal G1 region docks onto a hyaluronan filament, and many monomers loading onto one filament
      is what builds the supramolecular aggregate. The InterPro Link-domain mapping happens to be right
      here, but the evidence code now badly understates what is known. The cocrystal structure of the
      human G1 region with a hyaluronan decasaccharide has been solved, showing the immunoglobulin domain
      and the two Link modules acting as one unit with hyaluronan clamped in a groove running the length
      of the tandem Link domains, and the affinity has been measured directly by biolayer interferometry
      at 234 nM, in agreement with an earlier surface plasmon resonance value. This annotation should be
      upgraded from IEA to a direct experimental code citing PMID:40273987.
    action: ACCEPT
    supported_by:
    - reference_id: file:human/ACAN/ACAN-uniprot.txt
      supporting_text: 'CC       resist compression in cartilage. It binds avidly to hyaluronic acid via'
    - reference_id: PMID:40273987
      supporting_text: We demonstrate that the single immunoglobulin domain and the two Link modules that
        comprise the G1 region form a single structural unit, and that HA is clamped inside a groove that
        spans the length of the tandem Link domains.
    - reference_id: PMID:40273987
      supporting_text: In these experiments, ACAN binds to immobilized HA with an affinity of 234 nM,
        which is consistent with the value of 226 nM reported in an earlier study using surface plasmon
        resonance
- term:
    id: GO:0005796
    label: Golgi lumen
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: located_in
  review:
    summary: True but transitional. Aggrecan's keratan sulfate chains, chondroitin sulfate chains and
      N-glycans are all built in the Golgi lumen, so the core protein necessarily passes through that
      compartment on its way out of the chondrocyte. It does not function there - the mechanical function
      requires the mature, fully glycanated molecule in the extracellular matrix. This ARBA model
      annotation duplicates fourteen Reactome reaction-level rows for the same compartment.
    action: KEEP_AS_NON_CORE
    supported_by:
    - reference_id: file:human/ACAN/ACAN-uniprot.txt
      supporting_text: 'CC   -!- PTM: Contains mostly chondroitin sulfate, but also keratan sulfate'
- term:
    id: GO:0007155
    label: cell adhesion
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: A family-level mis-transfer that should not have reached aggrecan. InterPro IPR000538 (Link
      domain) carries two GO mappings, hyaluronic acid binding and cell adhesion. The hyaluronan half is
      the domain's defining biochemistry and applies to every member; the cell-adhesion half comes from
      the cell-surface members of the family - CD44, the main cell-surface hyaluronan receptor, and TSG-6
      - which the InterPro entry itself frames in terms of cell-cell and cell-matrix interactions.
      Aggrecan is not one of those. It is secreted, has no transmembrane segment or GPI anchor and no
      integrin-binding motif, and GO:0007155 requires attachment of a cell via cell adhesion molecules.
      Aggrecan-rich matrices are if anything the opposite, in that cartilage matrix and the perineuronal
      net are barriers that restrict cell and process migration. Nothing in the human aggrecan literature
      reports an adhesion-molecule role.
    action: REMOVE
    reason: The Link domain is shared between secreted lecticans and cell-surface hyaluronan receptors,
      and the cell-adhesion mapping is licensed by the receptor members. Aggrecan is a secreted,
      non-membrane-anchored matrix proteoglycan and does not mediate cell adhesion.
    supported_by:
    - reference_id: file:human/ACAN/ACAN-uniprot.txt
      supporting_text: 'CC   -!- SUBCELLULAR LOCATION: Secreted, extracellular space, extracellular'
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - WRONG_ORTHOLOG_OR_PARALOG
      - ROLE_CONFLATION
      source_entities:
      - source_id: InterPro:IPR000538
        source_label: Link domain
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: The domain entry spans CD44 and TSG-6 as well as the secreted lecticans; the
          cell-adhesion mapping is licensed by the cell-surface members, not by aggrecan.
- term:
    id: GO:0043202
    label: lysosomal lumen
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: located_in
  review:
    summary: This is where aggrecan is destroyed, not where it works. Extracellular keratan sulfate
      proteoglycan is internalized and delivered to the lysosome, where endo-beta-galactosidase and the
      sulfatases dismantle the keratan chains. Recording the compartment is defensible for a catabolic
      substrate, but it is not a functional location and should not be read as one.
    action: KEEP_AS_NON_CORE
- term:
    id: GO:0140150
    label: gel phase of interstitial matrix
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: located_in
  review:
    summary: Half right. The physical claim is exactly aggrecan's function - the aggregates form a densely
      packed hydrated gel, and the term's own definition names lectican-binding proteoglycans as
      constituents. The compartment is the problem, because GO:0140150 sits under interstitial matrix
      (GO:0005614), while aggrecan's two principal matrices, cartilage extracellular matrix and the
      perineuronal net, are specialized matrices rather than interstitial connective tissue matrix. The
      term is strictly accurate only for the minor vascular pool, where aggrecan has been detected in the
      guanidine-extractable matrix of human aorta and saphenous vein. Keeping it as non-core with that
      caveat; the missing term is a cellular component for cartilage extracellular matrix, proposed below.
    action: KEEP_AS_NON_CORE
    supported_by:
    - reference_id: PMID:25701227
      supporting_text: These large aggregates generate a densely-packed, hydrated gel enmeshed in a
        network of reinforcing collagen fibrils and other proteoglycans
    - reference_id: PMID:27068509
      supporting_text: To our knowledge, the present study is the first to report the identification of
        aggrecan in venous tissue.
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:32814053
  qualifier: enables
  review:
    summary: A screen hit standing alone. The WITH/FROM accession resolves to UniProtKB:P05067, APP, and
      the reference is a systematic yeast two-hybrid interactome map of around 500
      neurodegeneration-related proteins yielding tens of thousands of candidate interactions. Aggrecan
      and APP are both extracellular and neuronal, so the pair is not absurd, but a two-hybrid interaction
      between a heavily glycanated secreted proteoglycan and a type-I membrane protein is exactly the
      situation where the assay is least informative, since neither partner is in its native compartment
      or glycosylation state in yeast. There is no orthogonal validation, no functional follow-up, and APP
      appears nowhere in aggrecan's own literature. The annotation is also uninformative as a term, since
      bare protein binding says nothing about what aggrecan does. Marking it over-annotated rather than
      removing it, since IntAct records three experiments and the interaction may yet prove real.
    action: MARK_AS_OVER_ANNOTATED
    reason: Unreplicated yeast two-hybrid hit from a large candidate-interaction screen, in an assay poorly
      suited to a glycanated secreted proteoglycan, with no functional follow-up and no independent
      support in the aggrecan literature. Bare GO:0005515 also conveys no function.
    supported_by:
    - reference_id: PMID:32814053
      supporting_text: is generated by systematic yeast two-hybrid interaction screening
    - reference_id: file:human/ACAN/ACAN-uniprot.txt
      supporting_text: 'CC       P16112; P05067: APP; NbExp=3; IntAct=EBI-9076211, EBI-77613;'
