      matrix-binding activity to the G3 C-type lectin repeat, and the strongest support for the
      proposed extracellular matrix binding function.
- id: PMID:40273987
  title: Aggrecan immobilizes to perineuronal nets through hyaluronan-dependent and
    hyaluronan-independent binding activities.
  findings:
  - statement: The cocrystal structure of the human ACAN G1 region with a hyaluronan decasaccharide
      shows the immunoglobulin domain and two Link modules acting as a single structural unit, with
      hyaluronan clamped in a groove spanning the tandem Link domains.
    supporting_text: We demonstrate that the single immunoglobulin domain and the two Link modules
      that comprise the G1 region form a single structural unit, and that HA is clamped inside a
      groove that spans the length of the tandem Link domains.
  - statement: Human ACAN G1 binds immobilised hyaluronan with an affinity of 234 nM measured by
      biolayer interferometry, agreeing with an earlier surface plasmon resonance determination.
    supporting_text: In these experiments, ACAN binds to immobilized HA with an affinity of 234 nM,
      which is consistent with the value of 226 nM reported in an earlier study using surface
      plasmon resonance
  - statement: Recombinant human G1 and G1-G2 fragments added to mouse cortical neuron cultures bind
      pre-existing perineuronal nets with high specificity.
    supporting_text: both fragments of ACAN bound highly and very specifically to PNNs on cultured
      cortical neurons
  - statement: Abolishing hyaluronan binding by point mutation only reduces, rather than prevents,
      incorporation into perineuronal nets, so a hyaluronan-independent anchoring activity also
      operates.
    supporting_text: Thus, these results suggest that ACAN can be recruited into PNNs independently
      of its HA-binding activity.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full cached paper inspected. Human P16112-based constructs support G1 hyaluronan
      binding by structure and biolayer interferometry. The cell experiment adds human fragments to
      mouse cortical neuron cultures with established nets; it tests localization/retention, not de
      novo assembly of full-length aggrecan into a new matrix. The paper also finds no detectable G2
      hyaluronan binding. Direct evidence corroborates the seeded IEA without replacing its source
      evidence code.
