core_functions:
- description: Hyaluronan binding by the N-terminal G1 region retains aggrecan in extracellular
    aggregates with hyaluronan and link protein. Its immunoglobulin domain and two Link modules form
    a structural unit with a hyaluronan-binding groove. Recombinant human G1 binds immobilized
    hyaluronan with an affinity of about 234 nM and binds pre-existing perineuronal nets in mouse
    neuron cultures. Residual net binding by hyaluronan-binding-null fragments indicates an
    additional interaction whose partner remains unresolved.
  molecular_function:
    id: GO:0005540
    label: hyaluronic acid binding
  locations:
  - id: GO:0031012
    label: extracellular matrix
  - id: GO:0072534
    label: perineuronal net
  supported_by:
  - reference_id: PMID:40273987
    supporting_text: We demonstrate that the single immunoglobulin domain and the two Link modules
      that comprise the G1 region form a single structural unit, and that HA is clamped inside a
      groove that spans the length of the tandem Link domains.
  - reference_id: PMID:25701227
    supporting_text: The G1/hyaluronan/link protein ternary complex is very stable thereby
      immobilizing the aggrecan into enormous complexes that maintain a stable network and provide
      mechanical properties to cartilage.
  - reference_id: file:human/ACAN/ACAN-uniprot.txt
    supporting_text: 'CC       resist compression in cartilage. It binds avidly to hyaluronic acid via'
- description: Compression resistance arises from the fixed negative charge of the
    glycosaminoglycan-rich central region. Aggrecan retained in hyaluronan aggregates attracts
    water, generating swelling pressure restrained by the cartilage collagen network. This
    structural contribution supports cartilage development and load bearing. Severe aggrecan
    deficiency is lethal in studied animal models; human pathogenic alleles cause distinct skeletal
    growth and joint disorders.
