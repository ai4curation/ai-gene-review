proposed_new_terms:
- proposed_name: cartilage extracellular matrix
  proposed_definition: A specialized extracellular matrix produced by chondrocytes, consisting of a
    collagen type II fibril network interpenetrated by a hydrated gel of hyaluronan-bound aggregating
    proteoglycan, and characterised by high fixed negative charge density and resistance to compressive
    load.
  justification: GO describes cartilage extensively as a process but has no cellular component for the
    matrix itself. There are more than thirty cartilage biological-process terms (cartilage development
    GO:0051216, cartilage morphogenesis GO:0060536, cartilage condensation GO:0001502, articular cartilage
    development GO:0061975, growth plate cartilage development GO:0003417, cartilage homeostasis
    GO:1990079, and so on), yet the only cellular components available for the tissue that all of those
    processes build are the generic extracellular matrix GO:0031012 or, worse, gel phase of interstitial
    matrix GO:0140150, which is scoped under interstitial matrix GO:0005614 and therefore describes
    interstitial connective tissue rather than cartilage. GO:0140047 specialized extracellular matrix
    already carries siblings of exactly the right kind - perineuronal net GO:0072534, interphotoreceptor
    matrix GO:0033165, hyaline layer GO:0033166, cuticular extracellular matrix GO:0060102, egg coat
    GO:0035805 - and cartilage matrix is arguably the best-characterised specialized extracellular matrix
    in vertebrate biology, so its absence looks like an oversight rather than a deliberate exclusion. The
    gap bites hardest on exactly the genes it should serve best. Aggrecan is the defining constituent of
    cartilage matrix, and there is no term that says so, which is why its GOA record ends up with a
    misscoped interstitial-matrix term. The same is true of COL2A1, COL9A1, COL11A1, COMP, MATN1, MATN3,
    HAPLN1, CHAD, PRG4 and the ADAMTS aggrecanases, all of which currently have to be located in the
    generic parent. A cartilage-specific component term would also let the two ends of aggrecan's biology
    be told apart, since the same protein sits in cartilage matrix and in the perineuronal net, and only one of
    those two locations is currently expressible.
  proposed_parent:
    id: GO:0140047
    label: specialized extracellular matrix
  supported_by:
  - reference_id: PMID:25701227
    supporting_text: These large aggregates generate a densely-packed, hydrated gel enmeshed in a network
      of reinforcing collagen fibrils and other proteoglycans
  - reference_id: PMID:35338222
    supporting_text: The variant proteins also showed decreased binding to known cartilage extracellular
      matrix ligands.
  - reference_id: file:human/ACAN/ACAN-uniprot.txt
    supporting_text: 'CC   -!- FUNCTION: This proteoglycan is a major component of extracellular'
suggested_questions:
- question: What is the hyaluronan-independent activity that recruits aggrecan into perineuronal nets?
    Point mutations that abolish hyaluronan binding entirely still allow aggrecan to incorporate into
    perineuronal nets, only less efficiently, which means the long-standing model in which the
    hyaluronan-lectican-link protein ternary complex is the sole anchor is incomplete. Identifying the
    second binding partner would settle whether the cartilage and central nervous system pools of
    aggrecan assemble by the same mechanism, and it would supply the molecular function term that the
    perineuronal net localisation currently lacks.
- question: Should aggrecan carry a biological process term for building the matrix? After removing
    proteolysis and cell adhesion, the only process terms left in GOA are two broad development terms,
    and nothing in the record states that aggrecan assembles the matrix it is a constituent of, even
    though the aggregation event is the whole reason the protein exists. Extracellular matrix assembly
    GO:0085029 and extracellular matrix organization GO:0030198 both exist; whether a structural
    constituent that self-assembles with hyaluronan and a link protein should be annotated to them, or
    whether those terms are reserved for the enzymes and receptors that remodel matrix, is a modelling
    decision GO should make explicitly rather than by omission.
- question: How should a protein that is a major protease substrate be annotated? Aggrecanase cleavage of
    the interglobular domain is one of the best-characterised proteolytic events in human pathology and is
    the mechanistic core of cartilage loss in osteoarthritis, but the only way it currently appears on
    ACAN is as an incorrect involved_in proteolysis annotation. GO has no substrate role to assign, so
    curators either state the relationship wrongly, as here, or leave a central piece of the gene's
    biology unrecorded.
- question: Is the vascular pool of aggrecan functionally significant, or incidental? Aggrecan has been
    identified by proteomics in human aorta and saphenous vein, is depleted in varicose veins at both
    protein and transcript level, and yet UniProt still describes its tissue distribution as restricted to
    cartilage. Whether vascular aggrecan contributes to vessel wall mechanics determines whether the
    interstitial-matrix localisation terms are appropriate for this protein at all.
- question: Which of aggrecan's three globular regions should each annotation be attributed to? The
    hyaluronan binding is G1, the matrix ligand binding is the G3 C-type lectin, the compression
    resistance is the chondroitin sulfate region between G2 and G3, and G2 has no assigned function
    despite Link modules nearly identical to those of G1. Human disease alleles separate these functions
    cleanly - interglobular repeat variants, truncations and G3 missense variants give distinguishable
    phenotypes - so region-resolved annotation is achievable and would make the record far more useful.
suggested_experiments:
- hypothesis: A specific protein or glycan partner, distinct from hyaluronan, anchors aggrecan in
    perineuronal nets.
  description: Use the hyaluronan-binding-null G1 and G1-G2 fragments as affinity baits on detergent
    extracts of cortical perineuronal net material, identify retained partners by mass spectrometry, and
    test candidates by knockdown in cortical cultures followed by quantitative measurement of fragment
    incorporation. Hyaluronidase pretreatment of the cultures provides the orthogonal control.
  experiment_type: biochemistry and cell biology
- hypothesis: Compression resistance is a quantitative function of aggrecan dosage and of
    glycosaminoglycan chain substitution rather than of core protein abundance alone.
  description: Measure equilibrium and dynamic compressive moduli of cartilage explants across a graded
    aggrecan dosage series, including tissue from heterozygous patients carrying truncating alleles, and
    correlate the mechanical readout with quantified chondroitin sulfate content and aggregate size
    determined by size-exclusion chromatography.
  experiment_type: biomechanics
- hypothesis: The G3 C-type lectin is required for retention of aggrecan in the matrix rather than for
    secretion per se.
  description: Express wild-type and osteochondritis-dissecans G3 variants in chondrocytes and separately
    quantify secretion efficiency, matrix incorporation and turnover by pulse-chase, distinguishing a
    folding and secretion defect from a failure of matrix retention. Recombinant G3 binding assays against
    tenascin-R, fibulin-1, fibulin-2, matrilin-1 and COMP give the matched biochemical readout.
  experiment_type: cell biology and biochemistry
- hypothesis: The G2 region has a distinct ligand despite its close structural similarity to the
    hyaluronan-binding G1.
  description: Screen purified G2 against glycosaminoglycan and matrix protein arrays by biolayer
    interferometry, using G1 as the positive control for hyaluronan, and attempt cocrystallisation with any
    ligand that binds. A negative result across a broad panel would itself be informative, supporting a
    purely spacer or protease-presentation role for G2.
  experiment_type: structural biology and biophysics
