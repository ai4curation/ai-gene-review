- term:
    id: GO:0140150
    label: gel phase of interstitial matrix
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: located_in
  review:
    summary: Aggrecan-hyaluronan aggregates constitute a hydrated proteoglycan gel within cartilage
      matrix, directly described by PMID:25701227. This matches the GO definition of the gel phase
      as an interstitial hydrogel containing hyaluronan and proteoglycans. Cartilage being
      specialized connective tissue does not make it disjoint from interstitial matrix. The location
      is core to the compression-resisting function; vascular detection is additional support for
      extracellular distribution, not the sole reason this term is applicable.
    action: ACCEPT
    supported_by:
    - reference_id: PMID:25701227
      supporting_text: These large aggregates generate a densely-packed, hydrated gel enmeshed in a
        network of reinforcing collagen fibrils and other proteoglycans
    - reference_id: PMID:27068509
      supporting_text: To our knowledge, the present study is the first to report the identification
        of aggrecan in venous tissue.
