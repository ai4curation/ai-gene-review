  qualifier: is_active_in
  review:
    summary: Wrong compartment, and GO itself says so. Aggrecan is a secreted matrix proteoglycan of the
      perineuronal net, and GO deliberately places the perineuronal net outside the synapse - the
      ancestors of GO:0072534 run perisynaptic extracellular matrix (GO:0098966) to synapse-associated
      extracellular matrix (GO:0099535) to specialized extracellular matrix (GO:0140047) and extracellular
      matrix, and GO:0045202 is not among them (checked via the QuickGO ancestors endpoint for GO:0072534
      over is_a and part_of). So is_active_in synapse asserts residence in the synapse proper, which
      aggrecan does not have - it has no membrane anchor and is not a synaptic cleft or pre/postsynaptic
      component. The same IBA batch already carries the precise term. The likely source of the imprecision
      is the donor mix, in that brevican and neurocan dominate this PANTHER node, are genuinely
      perisynaptic, and mouse Bcan carries a glutamatergic synapse annotation, so the coarser synapse term
      leaked down to the whole node. This should collapse into the perineuronal net annotation.
    action: MODIFY
    reason: The essence - aggrecan acts in the matrix that surrounds and stabilizes synapses - is right,
      but GO:0045202 is the wrong compartment for a secreted matrix protein and is not an ancestor of the
      perineuronal net term. GO:0072534 states the same biology correctly.
