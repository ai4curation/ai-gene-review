core_functions:
- description: Hyaluronan binding through the N-terminal G1 region, the activity that makes aggrecan an
    aggregating proteoglycan. G1 comprises an immunoglobulin domain and two tandem Link modules that act
    as one structural unit, with the hyaluronan chain clamped in a groove running the length of the tandem
    Link domains at an affinity of roughly 230 nM. Many aggrecan monomers load onto a single hyaluronan
    filament, each junction stabilised by a hyaluronan and proteoglycan link protein, and the resulting
    ternary complex immobilises aggrecan into aggregates exceeding 200 MDa. This is the assembly step that
    builds both the cartilage matrix gel and the perineuronal net; in the perineuronal net it is important
    but not strictly required, since hyaluronan-binding-null mutants still incorporate, less efficiently.
