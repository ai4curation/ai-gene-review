core_functions:
- description: Hyaluronan binding by the N-terminal G1 region retains aggrecan in extracellular
    aggregates with hyaluronan and link protein. Its immunoglobulin domain and two Link modules form
    a structural unit with a hyaluronan-binding groove. Recombinant human G1 binds immobilized
    hyaluronan with an affinity of about 234 nM and binds pre-existing perineuronal nets in mouse
    neuron cultures. Residual net binding by hyaluronan-binding-null fragments indicates an
    additional interaction whose partner remains unresolved.
