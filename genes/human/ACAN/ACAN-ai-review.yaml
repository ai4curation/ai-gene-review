id: P16112
gene_symbol: ACAN
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'ACAN encodes aggrecan, the large secreted chondroitin-sulfate proteoglycan that gives
  cartilage its ability to bear load. The core protein is built from three globular regions: an N-terminal
  G1 (an immunoglobulin domain followed by two Link modules) that binds the glycosaminoglycan hyaluronan,
  a structurally similar G2, and a C-terminal G3 carrying EGF, C-type lectin and complement-control
  modules. Between G2 and G3 lies a large region substituted with roughly a hundred chondroitin sulfate
  chains and a smaller number of keratan sulfate chains. Chondrocytes secrete aggrecan into the cartilage
  matrix, where many monomers dock onto a single hyaluronan filament through G1, each junction clamped by
  a hyaluronan and proteoglycan link protein, producing supramolecular aggregates in excess of 200 MDa.
  The dense fixed negative charge of the glycosaminoglycan chains draws in water; the resulting swelling
  pressure, restrained by the surrounding collagen II network, is what allows cartilage to resist
  compression and to recover its shape after load. The G3 C-type lectin adds a second layer of matrix
  integration, binding tenascins, fibulins, matrilins and cartilage oligomeric matrix protein. A distinct
  pool of aggrecan is secreted in the central nervous system, where it is the lectican most characteristic
  of perineuronal nets, the honeycomb-like specialized matrix that encloses parvalbumin-positive
  interneurons and stabilizes their synapses once developmental plasticity has closed. Aggrecan is a
  prominent protease substrate: cleavage by the ADAMTS aggrecanases and by matrix metalloproteinases
  within the interglobular region between G1 and G2 releases the glycosaminoglycan-bearing bulk of the
  molecule while leaving the G1 fragment anchored to hyaluronan, and this loss underlies matrix
  degradation in osteoarthritis and inflammatory arthritis. Human variants span a dosage series: complete
  loss produces lethal chondrodysplasia, while heterozygous truncating and G3 missense alleles cause
  spondyloepiphyseal and spondyloepimetaphyseal dysplasias, short stature with advanced bone age, early
  osteoarthritis and familial osteochondritis dissecans.'
