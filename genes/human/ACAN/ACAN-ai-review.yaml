  - statement: The aggregates form a densely packed hydrated gel within the collagen fibril network.
    supporting_text: These large aggregates generate a densely-packed, hydrated gel enmeshed in a network
      of reinforcing collagen fibrils and other proteoglycans
  - statement: The G3 domain binds tenascins, fibulins and sulfated glycolipids, integrating aggrecan into
      the wider matrix.
    supporting_text: Moreover, the G3 domain of aggrecan interacts with tenascins, fibulins and sulfated
      glycolipids
  - statement: Unlike the other lecticans, aggrecan's brain expression is concentrated in perineuronal
