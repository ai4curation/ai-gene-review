      supporting_text: In both mutant animals, there is little or no aggrecan in cartilage leading to
        shortened long bones and lethality
    - reference_id: PMID:35338222
      supporting_text: The cartilage aggrecan proteoglycan is crucial for both skeletal growth and
        articular cartilage function.
    propagation_review:
