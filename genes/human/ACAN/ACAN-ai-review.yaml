- id: PMID:35338222
  title: Novel missense ACAN gene variants linked to familial osteochondritis dissecans
    cluster in the C-terminal globular domain of aggrecan.
  findings:
  - statement: Aggrecan is required for both skeletal growth and articular cartilage function.
    supporting_text: The cartilage aggrecan proteoglycan is crucial for both skeletal growth and articular
      cartilage function.
  - statement: Missense variants in the G3 C-type lectin repeat reduce secretion of both recombinant
      variant protein and full-length aggrecan from heterozygous patient cartilage.
    supporting_text: Functional studies showed that neither recombinant variant proteins, nor full-length
      variant aggrecan proteoglycan from heterozygous patient cartilage, were secreted to the same level as
      wild-type aggrecan.
  - statement: The same variants reduce binding to known cartilage extracellular matrix ligands,
      establishing the G3 C-type lectin as a matrix-binding module.
    supporting_text: The variant proteins also showed decreased binding to known cartilage extracellular
      matrix ligands.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached and read. Human genetic and functional evidence localising a
      matrix-binding activity to the G3 C-type lectin repeat, and the strongest support for the proposed
      extracellular matrix binding function.
- id: PMID:40273987
  title: Aggrecan immobilizes to perineuronal nets through hyaluronan-dependent and
    hyaluronan-independent binding activities.
  findings:
  - statement: The cocrystal structure of the human ACAN G1 region with a hyaluronan decasaccharide shows
      the immunoglobulin domain and two Link modules acting as a single structural unit, with hyaluronan
      clamped in a groove spanning the tandem Link domains.
    supporting_text: We demonstrate that the single immunoglobulin domain and the two Link modules that
      comprise the G1 region form a single structural unit, and that HA is clamped inside a groove that
      spans the length of the tandem Link domains.
  - statement: Human ACAN G1 binds immobilised hyaluronan with an affinity of 234 nM measured by biolayer
      interferometry, agreeing with an earlier surface plasmon resonance determination.
    supporting_text: In these experiments, ACAN binds to immobilized HA with an affinity of 234 nM, which
      is consistent with the value of 226 nM reported in an earlier study using surface plasmon resonance
  - statement: Recombinant human G1 and G1-G2 fragments bind perineuronal nets on cultured cortical
      neurons with high specificity.
    supporting_text: both fragments of ACAN bound highly and very specifically to PNNs on cultured
      cortical neurons
  - statement: Abolishing hyaluronan binding by point mutation only reduces, rather than prevents,
      incorporation into perineuronal nets, so a hyaluronan-independent anchoring activity also operates.
    supporting_text: Thus, these results suggest that ACAN can be recruited into PNNs independently of its
      HA-binding activity.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached and read; residue numbering is explicitly against human ACAN P16112, so
      the structural and biophysical results are human data rather than transferred. This is the published
      version of a bioRxiv preprint that the affinage record cited without a PubMed identifier, so it is
      used here in its peer-reviewed form. The basis for recommending that GO:0005540 be upgraded from
      InterPro IEA to a direct experimental code.
