- term:
    id: GO:0007417
    label: central nervous system development
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: Defensible but broad, and secondary to the cartilage role. Aggrecan does have a genuine CNS
      pool - it is the lectican most characteristic of perineuronal nets, which assemble late in
      development and close the critical period for cortical plasticity - so a developmental process term
      is not wrong. The donor set includes rat Acan (RGD:68358), a true ortholog, so this is not a paralog
      transfer. What the term does not do is say anything specific, since central nervous system
      development covers everything from neural tube closure to myelination, whereas aggrecan's
      contribution is the narrow one of building and maintaining perineuronal nets around parvalbumin
      interneurons after circuits have formed. Keeping it as non-core is the honest position until a
      perineuronal-net assembly process term exists and is supported for the human protein.
    action: KEEP_AS_NON_CORE
    supported_by:
    - reference_id: PMID:25701227
      supporting_text: Aggrecan is also expressed in the brain, and unlike other hyalectans, is expressed
        primarily in the perineuronal nets
