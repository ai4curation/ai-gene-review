- description: Matrix ligand binding through the C-terminal G3 region. The C-type lectin repeat in G3
    binds other constituents of the cartilage extracellular matrix - tenascins, fibulins, matrilins,
    cartilage oligomeric matrix protein and sulfated glycolipids - so that aggrecan is integrated into the
    wider matrix network rather than only into the hyaluronan aggregate. The evidence that this is a
    physiologically required activity is human genetic - missense substitutions in the C-type lectin repeat
    cause familial osteochondritis dissecans with short stature and early osteoarthritis, and the variant
    proteins both bind matrix ligands less well and are secreted less efficiently.
