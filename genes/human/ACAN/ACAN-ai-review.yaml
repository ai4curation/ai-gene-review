- term:
    id: GO:0005796
    label: Golgi lumen
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: located_in
  review:
    summary: True but transitional. Aggrecan's keratan sulfate chains, chondroitin sulfate chains
      and N-glycans are all built in the Golgi lumen, so the core protein necessarily passes through
      that compartment on its way out of the chondrocyte. It does not function there - the
      mechanical function requires the mature, fully glycanated molecule in the extracellular
      matrix. This ARBA model annotation duplicates fourteen Reactome reaction-level rows for the
      same compartment.
    action: KEEP_AS_NON_CORE
    supported_by:
    - reference_id: file:human/ACAN/ACAN-uniprot.txt
      supporting_text: 'CC   -!- PTM: Contains mostly chondroitin sulfate, but also keratan sulfate'
- term:
    id: GO:0007155
    label: cell adhesion
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: The categorical exclusion of aggrecan from cell adhesion is not supported. An
      extracellular matrix ligand can participate without a membrane anchor. PMID:11222505 reports
      CD44-dependent cell binding to immobilized rat and bovine aggrecan through chondroitin sulfate
      chains. That evidence makes an adhesion role plausible, but it does not directly validate a
      human Link-domain mapping. The full study and human-specific mechanistic scope could not be
      fully adjudicated.
    action: UNDECIDED
    reason: Keep the InterPro inference unresolved rather than claiming a disproved function. The
      available primary abstract supports nonhuman, glycosaminoglycan-mediated adhesion; secretion
      does not exclude this role, and no evidence establishes the prior alleged paralog-transfer
      error.
    additional_reference_ids:
    - PMID:11222505
    propagation_review:
      root_cause: UNRESOLVED
      source_entities:
      - source_id: InterPro:IPR000538
        source_label: Link domain
        source_status: UNRESOLVED
        comment: The domain-to-process mapping requires assessment of the role of the human target.
          The nonhuman CD44-aggrecan adhesion study implicates chondroitin sulfate chains, not the
          aggrecan Link domain; it neither validates this mapping nor supports categorical
          rejection.
