id: P16112
gene_symbol: ACAN
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'ACAN encodes aggrecan, a large secreted proteoglycan that provides cartilage with resistance
  to compression. Its N-terminal G1 region contains an immunoglobulin domain and two Link modules that
  bind hyaluronan. The related G2 region lacks detectable hyaluronan-binding activity, and a long central
  region carries numerous chondroitin sulfate and keratan sulfate chains. Hyaluronan and link protein
  retain aggrecan in large extracellular aggregates. The fixed negative charge of the glycosaminoglycans
  attracts water, generating swelling pressure constrained by the collagen network. The C-terminal G3
  region binds matrix ligands including tenascins and fibulins; a separate interaction with cartilage
  oligomeric matrix protein involves aggrecan glycosaminoglycan chains. Aggrecan also occurs in perineuronal
  nets surrounding neuronal cell bodies and dendrites, and has been identified in human vascular extracellular
  matrix. Extracellular proteases cleave aggrecan during matrix turnover and cartilage degeneration; aggrecan
  is their substrate. Human pathogenic variants cause dominant short stature and skeletal or joint disorders,
  including early osteoarthritis and familial osteochondritis dissecans, and recessive spondyloepimetaphyseal
  dysplasia. G3 variants can impair both secretion and matrix-ligand binding.'
