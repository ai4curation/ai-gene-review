- description: Osmotic load bearing. The roughly one hundred chondroitin sulfate chains carried on the
    region between G2 and G3 give aggrecan an exceptionally high fixed negative charge density. Immobilised
    at high concentration in the hyaluronan aggregate, that charge draws in water and generates a swelling
    pressure; the surrounding collagen II network resists the swelling, and the balance between the two is
    what lets cartilage bear compressive load and recover its shape. This is aggrecan's primary function,
    and loss of it is what makes aggrecan-deficient cartilage fail - complete loss gives lethal
    chondrodysplasia with shortened long bones, and reduced dosage gives short stature and early
    osteoarthritis.
