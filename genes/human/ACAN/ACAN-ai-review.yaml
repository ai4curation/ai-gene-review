- term:
    id: GO:0001501
    label: skeletal system development
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: Right biology, one level too coarse. Aggrecan is the cartilage-specific aggregating
      proteoglycan; the tissue whose development requires it is cartilage, and the skeletal consequences
      of losing it - shortened long bones, lethality from tracheal collapse in the cartilage matrix
      deficiency mouse and the nanomelic chicken - are downstream of cartilage matrix failure rather than
      of a direct role in bone. Human alleles make the same point, in that complete loss gives
      chondrodysplasia while heterozygous alleles give short stature with advanced bone age and early
      osteoarthritis. Donors include mouse and rat Acan, so the transfer itself is sound; GO:0051216
      cartilage development is a child of this term and states the supported claim.
    action: MODIFY
    reason: GO:0051216 cartilage development is the specific process aggrecan is required for; skeletal
      system development is its true but uninformative parent, and the bone phenotypes are secondary to
      cartilage matrix failure.
    proposed_replacement_terms:
    - id: GO:0051216
      label: cartilage development
    supported_by:
