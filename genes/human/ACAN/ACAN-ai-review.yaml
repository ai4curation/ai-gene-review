- term:
    id: GO:0006508
    label: proteolysis
  evidence_type: NAS
  original_reference_id: PMID:1569188
  qualifier: involved_in
  review:
    summary: This annotation has the roles the wrong way round. Aggrecan is the substrate of proteolysis,
      not an agent of it. The cited paper shows exactly that - aggrecan fragments in human synovial fluid
      all begin at the same new N-terminus, ARGSV, generated by cleavage of the aggrecan core protein at
      the Glu373-Ala374 bond within the interglobular domain, and the authors attribute the cleavage to a
      cartilage proteinase, later identified as the ADAMTS aggrecanases. Aggrecan has no protease domain,
      no catalytic residues, and no proteolytic activity of any kind; the agents in this process are
      ADAMTS4, ADAMTS5, HTRA1 and the matrix metalloproteinases, several of which are annotated for
      exactly this reaction. Annotating a substrate with involved_in for the process that destroys it makes
      aggrecan indistinguishable from the proteases in any process-based query, and it is the most
      misleading statement in this gene's GOA record. If the intent was to record the biology of aggrecan
      turnover, that belongs on the proteases, or on aggrecan through an annotation extension naming it as
      the substrate - not as involved_in proteolysis.
    action: REMOVE
    reason: Substrate-as-agent role conflation. The cited reference documents aggrecan being cleaved by a
      cartilage proteinase; aggrecan is not a protease and does not participate in proteolysis as an
      agent. The correct holders of GO:0006508 here are ADAMTS4, ADAMTS5, HTRA1 and the MMPs.
