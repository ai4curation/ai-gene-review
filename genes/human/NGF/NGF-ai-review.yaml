id: P01138
gene_symbol: NGF
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'NGF encodes beta-nerve growth factor, a secreted cystine-knot neurotrophin that is proteolytically
  processed from proNGF to a mature homodimeric ligand. Mature NGF binds NTRK1/TrkA and NGFR/p75NTR to
  support sensory and sympathetic neuron survival, differentiation and neurite outgrowth, while proNGF
  can signal through NGFR with SORT1 or SORCS2 to promote apoptotic or growth-cone-collapse responses.'
