id: P49765
gene_symbol: VEGFB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'VEGFB encodes vascular endothelial growth factor B, a secreted PDGF/VEGF-family growth factor
  that forms disulfide-linked homodimers and signals primarily as a VEGFR1/FLT1 ligand. Alternative splicing
  produces VEGF-B186 and VEGF-B167, with VEGF-B167 showing heparin and neuropilin-1 association. VEGFB
  regulates endothelial responses including extracellular-matrix remodeling and can attract mast cells
  in inflammatory contexts.'
