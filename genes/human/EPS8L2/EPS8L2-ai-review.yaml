core_functions:
- description: 'Activating subunit of an ABI1-scaffolded EPS8L2-ABI1-SOS1 complex: the EPS8L2 effector region engages SOS1
    and switches it to Rac-GEF activity, coupling growth factor receptor signalling to Rac activation and membrane ruffling.
    Experimentally established for human EPS8L2.'
  contributes_to_molecular_function:
    id: GO:0005085
    label: guanyl-nucleotide exchange factor activity
  directly_involved_in:
  - id: GO:0035022
    label: positive regulation of Rac protein signal transduction
  - id: GO:1900029
    label: positive regulation of ruffle assembly
  locations:
  - id: GO:0032587
    label: ruffle membrane
  supported_by:
  - *id004
  - *id014
  - *id017
  - *id015
- description: Direct binding of actin filaments through the conserved C-terminal effector region, which targets EPS8L2 to
    F-actin-rich ruffles (human, experimental) and, by orthology to same-subfamily mouse Eps8l2, to the tips of the shorter
    rows of hair-cell stereocilia, where it is needed to maintain the hair-bundle staircase.
  molecular_function:
    id: GO:0051015
    label: actin filament binding
  locations:
  - id: GO:0032587
    label: ruffle membrane
  - id: GO:0032426
    label: stereocilium tip
  supported_by:
  - *id001
  - *id012
  - *id009
  - reference_id: PMID:23918390
    supporting_text: Eps8L2 is required for their maintenance in adult hair cells
  - *id008
suggested_questions:
- question: Should EPS8L2 carry stereocilium maintenance (GO:0120045)? Mouse knockouts show progressive loss of the staircase
    and stereocilium width, but MGI did not annotate this process from PMID:23918390, and it is unclear whether EPS8L2 performs
    a step (e.g. barbed-end capping or bundling at row-2 tips) or is only required.
- question: Does EPS8L2 cap actin filament barbed ends or bundle filaments, as EPS8 does, given that it lacks the IRSp53 binding
    that EPS8 needs for bundling?
- question: Is the EPS8L2-ABI1-SOS1 Rac-GEF complex assembled at stereocilia tips, or does EPS8L2 act there through other
    partners such as BAIAP2L2, TWF2 and CAPZB?
suggested_experiments:
- description: Pyrene-actin barbed-end elongation and low-speed sedimentation bundling assays with purified full-length human
    EPS8L2 and its C-terminal effector region, compared with EPS8.
- description: Knock-in mice carrying DFNB106 variants or an effector-region actin-binding mutant, with row-specific stereocilia
    length and width measurements over time, to test whether F-actin binding is needed for bundle maintenance.
