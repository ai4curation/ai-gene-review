    id: GO:0005085
    label: guanyl-nucleotide exchange factor activity
  evidence_type: IDA
  original_reference_id: PMID:14565974
  qualifier: contributes_to
  review:
    summary: Anti-flag immunocomplexes of EPS8L2 co-expressed with ABI1 and SOS1 release GDP from Rac (Rac-GEF activity),
      and this depends on ABI1. The isolated EPS8L2 C-terminus binds native SOS1, as the EPS8 effector region does to activate
      SOS1.
    action: ACCEPT
    reason: 'The contributes_to qualifier is correct: SOS1 is the catalytic subunit, and EPS8L2 contributes to the Rac-GEF
      activity of the EPS8L2-ABI1-SOS1 complex as the activating subunit. This is a core function directly assayed for the
      human protein.'
