id: Q9H6S3
gene_symbol: EPS8L2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: EPS8L2 (EPS8-like protein 2) is a cytoplasmic actin-regulatory adaptor of the EPS8 family, built from an N-terminal
  PTB-like domain, a central SH3 domain and a C-terminal effector region that binds F-actin and SOS1. In fibroblasts, EPS8L2
  binds ABI1 and assembles with ABI1 and the dual Ras/Rac exchange factor SOS1 into a complex with Rac-GEF activity, binds
  actin filaments directly, is recruited to growth-factor-induced membrane ruffles, and can substitute for EPS8 in driving
  receptor tyrosine kinase-induced Rac-dependent ruffling; EPS8 and EPS8L2 are broadly co-expressed and functionally redundant
  in this pathway. In the inner ear, the mouse ortholog localizes to the tips of the shorter rows of hair-cell stereocilia
  and is required for the long-term maintenance of the hair-bundle staircase and stereocilium width; its loss causes late-onset
  progressive hearing loss. Biallelic loss-of-function variants in human EPS8L2 cause autosomal recessive progressive non-syndromic
  hearing loss (DFNB106). EPS8L2 has also been reported to interact with the nuclear envelope phosphatase CTDNEP1 in regulating
  dorsal actin cables during nuclear positioning in migrating cells.
