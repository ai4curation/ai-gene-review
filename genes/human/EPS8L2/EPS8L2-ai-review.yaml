- term:
    id: GO:0007605
    label: sensory perception of sound
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q99K30
  - ensembl:ENSMUSP00000026577
  review:
    summary: Ensembl Compara transfer from mouse Eps8l2. Mouse Eps8l2 (Q99K30, same PANTHER subfamily PTHR12287:SF20) knockouts
      have late-onset progressive hearing loss with hair-bundle deterioration, and human biallelic loss-of-function variants
      cause DFNB106 progressive hearing loss.
    action: KEEP_AS_NON_CORE
    reason: Kept, but non-core. The ortholog transfer is evolutionarily sound (same SF20 subfamily). However, the evidence
      is necessity evidence at the organism level; the cellular role of EPS8L2 is in maintaining the actin core and staircase
      of hair-cell stereocilia, upstream of hearing. Normal MET currents in immature knockout hair cells show it is not part
      of the transduction machinery itself.
    supported_by:
    - &id006
      reference_id: PMID:23918390
      supporting_text: Eps8L2 null-mutant mice exhibit a late-onset, progressive hearing loss that is directly linked to a
        gradual deterioration in hair bundle morphology
    - &id007
      reference_id: PMID:26282398
      supporting_text: We concluded that this frame-shift mutation, predicted to result either in a truncated inactive protein,
        or in no protein at all due to nonsense-mediated mRNA decay, is responsible for the progressive hearing loss of the
        two Algerian patients
    - &id008
      reference_id: file:interpro/panther/PTHR12287/PTHR12287-entries.csv
      supporting_text: Eps8l2,729,PTHR12287:SF20
