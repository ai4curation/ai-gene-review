description: 'PIKFYVE (PIKfyve, the mammalian ortholog of yeast Fab1) is a large (2098 aa) type III phosphoinositide kinase.
  It is the only enzyme known to make phosphatidylinositol 3,5-bisphosphate (PI(3,5)P2) by phosphorylating PI3P at the D5
  position, and it is also the main source of cellular phosphatidylinositol 5-phosphate (PI5P). The protein has an N-terminal
  PI3P-binding FYVE zinc finger, a DEP domain, a chaperonin (CCT/TCP-1)-like module, a CCR region, and a C-terminal PIPK catalytic
  domain. The FYVE finger recruits it from the cytosol to PI3P-rich early and late endosome and phagosome membranes. There
  it acts within the PIKfyve-VAC14-FIG4 (PAS) complex, in which a VAC14 pentamer scaffolds one PIKfyve and one FIG4, so that
  PI(3,5)P2 synthesis is coupled to its turnover. PIKfyve is also a protein serine kinase whose autophosphorylation represses
  its lipid kinase activity and stimulates FIG4. Its lipid products control endolysosomal membrane dynamics: endosome fission,
  endosome-to-TGN retrograde transport, lysosome and phagosome maturation (partly through the PI(3,5)P2-gated channel TRPML1),
  and lysosome size. Through these products PIKfyve supports many cell-type-specific processes, including neutrophil chemotaxis
  and ROS production, melanosome biogenesis, MHC class II antigen presentation, autophagosome biogenesis (via PI5P), insulin-stimulated
  GLUT4 translocation, STING activation (PI(3,5)P2 is a STING ligand) and endocytic entry of coronaviruses. Loss of PIKfyve
  is embryonic lethal in mice, and heterozygous PIKFYVE variants cause fleck corneal dystrophy.'
