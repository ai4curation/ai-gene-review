- description: 'Phosphatidylinositol 5-kinase: PIKfyve phosphorylates PI to PI5P and is the principal cellular source of PI5P,
    a lipid that regulates actin remodelling and VPS34-independent autophagosome biogenesis. Established experimentally in
    vitro and in human and rodent cells; the share made directly versus via PI(3,5)P2 dephosphorylation is unresolved.'
  molecular_function:
    id: GO:0052810
    label: 1-phosphatidylinositol-5-kinase activity
  directly_involved_in:
