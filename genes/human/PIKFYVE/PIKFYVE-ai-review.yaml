  - *id022
  - *id030
- description: 'Protein serine kinase (autophosphorylation): PIKfyve phosphorylates serines on itself, including the activation-loop
    Ser2053. This represses its lipid kinase activity and stimulates FIG4 lipid phosphatase activity, and FIG4 reverses the
    phosphorylation, forming a feedback loop that sets PI(3,5)P2 levels. Shown for human PIKfyve in the reconstituted complex;
    no trans substrates are established.'
  molecular_function: *id003
