core_functions:
- description: 'Phosphatidylinositol 3-phosphate 5-kinase: PIKfyve converts PI3P to PI(3,5)P2 on early/late endosome and phagosome
    membranes, recruited by its PI3P-binding FYVE finger, as the kinase subunit of the PIKfyve-VAC14-FIG4 complex. The PI(3,5)P2
    it produces drives endosome fission and endosome-to-TGN retrograde transport and endolysosome maturation. Established
    experimentally for the human protein.'
