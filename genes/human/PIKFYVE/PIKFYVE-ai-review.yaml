    id: GO:0070772
    label: PAS complex
  supported_by:
  - *id004
  - *id020
suggested_questions:
- question: Does PIKfyve phosphorylate any protein other than itself (e.g. FIG4, VAC14, or cargo/effector proteins), or is
    its protein serine kinase activity strictly autoregulatory?
- question: What fraction of cellular PI5P comes from direct 5-phosphorylation of PI by PIKfyve versus myotubularin 3-dephosphorylation
    of PIKfyve-made PI(3,5)P2?
- question: Is there direct evidence for PIKfyve or the PAS complex on the Golgi membrane, as in Reactome's Golgi reactions,
    or should those reactions be relocated to endosomal membranes?
- question: Should the ISS annotations to PIKFYVE with STING1 (Q86WV6) as source (cholesterol binding, PI(3,5)P2 binding)
    be withdrawn by UniProt, given that the proteins are not homologous?
suggested_experiments:
- description: Phosphoproteomics comparing wild-type and kinase-dead (K1877E) PIKfyve knock-in cells, with in vitro kinase
    assays on candidate hits, to identify any trans protein substrates of PIKfyve.
- description: Isotope-tracing lipidomics of PI5P in cells expressing PIKfyve with or without myotubularin depletion, to separate
    direct PI 5-kinase output from the indirect PI(3,5)P2-derived route.
