core_functions:
- description: Electrogenic, Na(+)-coupled symport (amino acid transport System A) of small
    neutral amino acids across the plasma membrane. SNAT2 cotransports one Na(+) with one
    neutral amino acid (alanine, glutamine, glycine, serine, proline, methionine, asparagine,
    histidine, threonine; the MeAIB analogue is diagnostic) into the cell, driven by the inward
    sodium electrochemical gradient; pH-sensitive, Li(+)-intolerant, 1:1 stoichiometry.
  molecular_function:
    id: GO:0005295
    label: neutral L-amino acid:sodium symporter activity
  directly_involved_in:
  - id: GO:0015804
    label: neutral amino acid transport
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:10930503
    supporting_text: The transporter is specific for neutral amino acids. It is pH-sensitive and
      Li+-intolerant. The Na+:amino acid stoichiometry is 1:1.
  - reference_id: PMID:15774260
    supporting_text: Na+ -dependent uptake of alpha-(methylamino)isobutyric acid, a specific
      model substrate for system A, was pH-sensitive and saturable
- description: Na(+)-coupled import of L-glutamine, the physiologically dominant SNAT2 cargo,
    supplying intracellular glutamine that feeds mTORC1 signalling (via SLC7A5 antiport), the
    neuronal glutamine/glutamate cycle, and anaplerotic/biosynthetic metabolism.
  molecular_function:
    id: GO:0015186
    label: L-glutamine transmembrane transporter activity
  directly_involved_in:
  - id: GO:1903803
    label: L-glutamine import across plasma membrane
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: file:human/SLC38A2/SLC38A2-uniprot.txt
    record_section: ["CC:CATALYTIC ACTIVITY"]
    supporting_text: Reaction=L-glutamine(in) + Na(+)(in) = L-glutamine(out) + Na(+)(out)
proposed_new_terms: []
suggested_questions:
- question: Does SNAT2 act apically (brush border) or basolaterally in any polarized human
    epithelium, and is the rat-ortholog brush-border annotation an artefact of cross-species
    transfer?
- question: To what extent does SNAT2 transport the N-methylated/osmolyte-like compounds
    (MeAIB is a substrate) that led to the glycine betaine transport annotation, and is any
    betaine flux physiologically relevant?
suggested_experiments:
- description: Electrophysiological and radiotracer substrate-profiling of human SNAT2 in a
    heterologous system (e.g. oocytes or HEK cells) across the full neutral amino-acid set plus
    glutamate/aspartate and glycine betaine, to quantitatively define substrate specificity and
    confirm the absence of acidic amino-acid and betaine transport.
- description: Polarized-epithelium (e.g. MDCK or Caco-2) surface-biotinylation and
    immunolocalization of tagged human SNAT2 to resolve apical vs basolateral targeting and test
    the brush-border annotation directly.
