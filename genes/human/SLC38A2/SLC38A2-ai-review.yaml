id: Q96QD8
gene_symbol: SLC38A2
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SLC38A2 (SNAT2/ATA2) is the ubiquitously expressed transporter responsible
  for amino acid transport "System A". It is an electrogenic, pH-sensitive, Li(+)-intolerant,
  Na(+)-coupled symporter that cotransports small neutral amino acids (alanine, glutamine,
  glycine, serine, proline, methionine, asparagine, histidine, threonine, and the diagnostic
  analogue MeAIB) together with Na(+) into the cell with a 1:1 Na(+):amino-acid stoichiometry,
  driven by the inwardly directed sodium electrochemical gradient. It is an 11-transmembrane
  protein of the SLC38 family that resides in the plasma membrane, with a reserve pool in the
  trans-Golgi network/endosomes from which insulin recruits it to the cell surface. SNAT2
  activity is adaptively upregulated by amino-acid deprivation (ATF4-dependent transcription
  plus eIF2alpha-phosphorylation/IRES-mediated translation) and by hypertonic stress, where
  the newly synthesised transporter restores intracellular amino-acid pools and cell volume.
  Glutamine is a physiologically dominant cargo, linking SNAT2 to mTORC1 signalling and to the
  neuronal glutamine/glutamate cycle; SNAT2 also contributes to amino-acid supply at the
  placenta, blood-brain barrier, and in muscle, and its abundance is controlled by NEDD4L- and
  RNF5-mediated ubiquitination.
