    summary: Proposed molecular function capturing CFAP65's role as a structural stabilizer of the
      axonemal C2a projection.
    action: NEW
    reason: CFAP65 has no informative molecular function in the current annotation set, only generic
      protein binding and an unverified RNA binding. In mouse it sits at the base of the C2a projection,
      binds the C2a proteins CFAP70 and MYCBPAP, and without it the projection disintegrates, so
      it contributes to the structural integrity of the axonemal cytoskeleton (PMID:39853433). The
      algal orthologue is a C2a component that co-precipitates with FAP70 (PMID:33988244). This is
      a function the protein performs as part of the structure, not merely a requirement. The evidence
      is mouse and alga, transferred to human by orthology, hence ISS. The same MF is used for other
      axonemal structural proteins reviewed in this set, such as CFAP43 and CFAP44.
