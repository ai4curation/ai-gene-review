id: Q6ZU64
gene_symbol: CFAP65
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'CFAP65 is a large protein of motile cilia and sperm flagella, built from a series of
  Ig-like (HYDIN/VesB/CFA65-like) domains, an MSP domain and a C-terminal coiled coil. It is a conserved
  structural component of the C2a projection of the axonemal central apparatus: it sits at the base
  of the projection, binds the C2a proteins CFAP70 and MYCBPAP, and is required for the projection
  to stay intact. CFAP65 is most highly expressed in the testis. Loss of CFAP65 in men and mice causes
  male infertility with multiple morphological abnormalities of the sperm flagellum, often with defects
  of the acrosome, sperm head shaping and mitochondrial sheath. In mice it also reduces ependymal
  ciliary flow and causes hydrocephalus, while respiratory cilia are only mildly affected. Earlier
  immunostaining placed the protein in the acrosome region, the flagellar midpiece and the cytoplasm
  of spermatids, and whether it acts directly in acrosome or mitochondrial-sheath formation remains
  unresolved.'
