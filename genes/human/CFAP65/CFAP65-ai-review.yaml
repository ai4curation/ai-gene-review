core_functions:
- description: CFAP65 is a structural component at the base of the C2a projection of the axonemal
    central apparatus. Together with CFAP70 and MYCBPAP it holds the projection together on the C2
    microtubule, which stabilizes the central apparatus and the axoneme of motile cilia and flagella.
    This structural role is essential for assembling an organized sperm axoneme and for sperm motility,
    and it supports ependymal ciliary flow. Respiratory cilia tolerate its loss better.
