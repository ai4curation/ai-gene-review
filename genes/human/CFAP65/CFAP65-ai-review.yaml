    summary: CFAP65 is needed for normal motility of ependymal cilia and sperm flagella through its
      role in the C2a projection.
    action: ACCEPT
    reason: Mouse Cfap65 knockouts lose the C2a projection. Ependymal ciliary bead flow is reduced,
      causing hydrocephalus, and sperm are immotile (PMID:39853433). This motility role is not limited
