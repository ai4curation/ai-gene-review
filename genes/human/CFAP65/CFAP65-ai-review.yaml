suggested_experiments:
- description: Use cryo-electron tomography of human sperm and airway cilia from CFAP65-null patients
    to test whether the C2a projection is absent in both tissues, and relate C2a loss to the tissue-specific
    motility defects.
  experiment_type: cryo-electron tomography
- description: Use immuno-electron microscopy with two independent CFAP65 antibodies on wild-type
    and Cfap65-null spermatids to resolve acrosomal versus axonemal localization, and protease-protection
    assays to test the predicted transmembrane topology.
  experiment_type: cell biology
