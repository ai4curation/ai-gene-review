knowledge_gaps:
- gap_statement: ARMC6 has no established molecular activity or biological process. The only functional
    data are in vitro binding to TRF2, telomerase and G-quadruplex nucleic acids, and overexpression-driven
    expression changes.
  boundary: 'Established: armadillo-repeat protein, cytosolic by antibody staining; a METTL9 methylation
    substrate. In vitro data: co-precipitates telomerase activity, binds TRF2, appears to bind G-quadruplex
    DNA/RNA. Database records: many proteome-scale interaction calls (BioGRID, IntAct). Genome-wide CRISPR
    screens record ARMC6 hits (BioGRID-ORCS), but none has been followed up. Not established: a characterized
    loss-of-function phenotype, an endogenous function at telomeres or promoters, or a physiological process.'
  gap_kind:
  - BIOLOGY
