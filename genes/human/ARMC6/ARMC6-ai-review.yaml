  label: Homo sapiens
description: ARMC6 is a 501-residue armadillo-repeat protein of unknown function, mainly cytosolic by
  antibody staining. In vitro it co-precipitates telomerase activity and interacts with the shelterin
  protein TRF2, and recombinant ARMC6 binds G-quadruplex-forming DNA promoter sequences and telomeric
  repeat RNA. Overexpression in human cell lines changes expression of oncogenic and telomerase-related
  genes. ARMC6 is a substrate of the histidine methyltransferase METTL9.
