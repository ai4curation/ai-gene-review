suggested_questions:
- question: Does endogenous ARMC6 reach the nucleus to bind telomeric or promoter G-quadruplexes, given
    that it is mainly cytosolic?
suggested_experiments:
- description: Measure G-quadruplex binding by purified ARMC6 against matched mutant sequences by EMSA
    or SPR, and test for TRF2 co-immunoprecipitation from untransfected cells.
