id: Q13740
gene_symbol: ALCAM
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ALCAM (activated leukocyte cell adhesion molecule, CD166) is a transmembrane immunoglobulin-superfamily
  adhesion receptor with five extracellular Ig domains. Its membrane-distal Ig domain binds CD6 on T cells
  with micromolar affinity, and it binds itself about 100-fold more weakly; the two interactions use the
  same surface and compete. On antigen-presenting cells ALCAM is recruited to the immunological synapse,
  where its engagement of CD6 stabilizes T cell-dendritic cell contacts and sustains T cell activation
  and proliferation. It is also expressed on endothelial, epithelial, hematopoietic stem and neural cells,
  where it supports lymphatic vessel formation and dendritic cell migration, and its chick and rodent
  orthologs (BEN/DM-GRASP) guide retinal axon growth. A splice variant lacking the transmembrane region
  is secreted and antagonizes the membrane form. ALCAM glycans are bound by galectins, which interfere
  with CD6 binding.
