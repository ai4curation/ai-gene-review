- term:
    id: GO:0007165
    label: signal transduction
  evidence_type: TAS
  original_reference_id: PMID:7760007
  qualifier: involved_in
  review:
    summary: Signal transduction, from the cloning paper. The essence is right - ALCAM engagement of CD6
      delivers a costimulatory signal to T cells - but the generic term misses it; modified to positive
      regulation of T cell proliferation.
    action: MODIFY
    reason: ALCAM is the CD6 ligand [PMID:7760007 "We prepared an ALCAM-Rg fusion protein and showed that
      it binds to COS cell transfectants expressing CD6, demonstrating that ALCAM is a CD6 ligand."],
      and its engagement of CD6 costimulates T cells [PMID:26146185 "revealing a costimulatory role for
      engagement of CD6 by CD166"]. Blocking it with antibodies or ALCAM-Fc suppresses DC-induced T cell
      proliferation [PMID:16352806 "the presence of CD6-blocking antibodies or recombinant ALCAM-Fc proteins
      results in a strong and sustained inhibition of T-cell proliferation"], and soluble CD166 inhibits
      antigen-specific responses [PMID:15048703 "soluble monomeric CD6 and CD166 inhibit antigen-specific
      human T cell responses"]. GO treats the surface-bound ligand as providing a costimulatory signal,
      and other costimulatory ligands carry descendants of positive regulation of T cell proliferation
      or activation (ICOSLG, CD70, CD47). GO:0042102 positive regulation of T cell proliferation names
      the measured outcome.
    supported_by:
    - reference_id: PMID:16352806
      supporting_text: the presence of CD6-blocking antibodies or recombinant ALCAM-Fc proteins results
        in a strong and sustained inhibition of T-cell proliferation
    - reference_id: PMID:15048703
      supporting_text: soluble monomeric CD6 and CD166 inhibit antigen-specific human T cell responses
    - reference_id: PMID:26146185
      supporting_text: revealing a costimulatory role for engagement of CD6 by CD166
    - reference_id: PMID:7760007
      supporting_text: We prepared an ALCAM-Rg fusion protein and showed that it binds to COS cell transfectants
        expressing CD6, demonstrating that ALCAM is a CD6 ligand.
    proposed_replacement_terms:
    - id: GO:0042102
      label: positive regulation of T cell proliferation
