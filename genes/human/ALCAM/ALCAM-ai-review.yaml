      binding CD6 with micromolar affinity [PMID:15048703 "We report that in human these proteins interact
      with a K(D) =0.4-1.0 microM"] and itself more weakly [PMID:15048703 "CD166 also interacts in a homophilic
      manner but with around 100-fold lower affinity"]. Blocking it disrupts T cell-dendritic cell contacts
      [PMID:16352806 "ALCAM-blocking antibodies interfere with DC-T-cell conjugate formation, demonstrating
      that CD6-ALCAM binding is essential for stable T-cell-APC contact."]. Participation: ALCAM''s own
      N-terminal Ig domain makes the trans contact. Comparator check: Ig-superfamily adhesion molecules
      in the same role (CNTN1, NRCAM, NFASC, DSCAM, CD47, CD200) carry GO:0098632 in human, while ALCAM
      has only signaling receptor binding and identical protein binding, neither of which is an ancestor
      or descendant of it.'
    supported_by:
