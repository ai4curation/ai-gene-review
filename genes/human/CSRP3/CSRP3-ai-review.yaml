id: P50461
gene_symbol: CSRP3
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CSRP3 encodes muscle LIM protein (MLP), a striated-muscle protein with two LIM domains in its full-length form. MLP binds and cross-links actin filaments and interacts with alpha-actinin and telethonin at the Z disc, supporting sarcomere integrity and the mechanical behavior of cardiac muscle. Nuclear MLP associates with myogenic transcription factors, while a short splice product shows distinct interaction and differentiation effects. Altered MLP function is associated with cardiomyopathy.
alternative_products:
- name: 1 (MLP-a)
  id: P50461-1
- name: 2 (MLP-b)
  id: P50461-2
  sequence_note: VSP_058575, VSP_058576
