    supporting_text: MLP binds directly to AFs via LIM2
functional_isoforms:
- id: CSRP3_FULL_LENGTH
  name: Full-length MLP-a
  type: SPLICE_VARIANT
  maps_to:
  - type: UNIPROT_ISOFORM
    ids:
    - P50461-1
  description: The current 194-residue product contains both LIM domains. Direct human recombinant assays support actin binding and bundling, while cellular and biochemical studies identify Z-disc and myogenic transcription-factor interactions. The older PMID:19752190 Methods call their full-length construct residues 1–195; its exact insert sequence was not recovered, whereas PMID:24860983 describes the reused construct as 1–194.
- id: CSRP3_SHORT_SPLICE_PRODUCT
  name: Short MLP-b splice class
  type: SPLICE_VARIANT
  maps_to:
  - type: UNIPROT_ISOFORM
    ids:
    - P50461-2
  description: The current official product is 58 residues, retaining the first 37 residues followed by a 21-residue alternative tail. The historical JN898958.1/AFH66949.1 construct in PMID:24860983 is 59 residues and adds one terminal histidine relative to the current sequence. That historical product binds MLP-a and associates with alpha-actinin/telethonin in tissue assays, but lacks the tested direct CFL2, MyoD and myogenin interactions and attenuates myogenic differentiation and MLP-a/CFL2 effects. These historical functional results are not assumed to be experimentally identical for the current 58-residue sequence.
suggested_questions:
- question: Which molecular interactions and mechanical-stress responses determine telethonin residence time at the Z disc, and does MLP also contribute to its initial delivery?
- question: Do the historical 59-residue and current 58-residue MLP-b sequences have measurably different stability or activity?
- question: Which preparation or assay features explain enhancement of cofilin-2 activity in the tagged-protein experiments versus protection of actin filaments by tag-cleaved MLP?
- question: Does MLP inhibit PKC-alpha through a regulatory interaction beyond competition as an alternative phosphoacceptor?
suggested_experiments:
- description: Compare sequence-verified 194-, 58- and historical 59-residue proteins in matched tag-cleaved actin-binding, bundling and cofilin assays, with equivalent stoichiometry and buffer conditions.
- description: Measure telethonin arrival and residence times at the Z disc after acute MLP perturbation to distinguish delivery from retention.
- description: Test PKC-alpha kinetics with phosphoacceptor-deficient MLP and substrate-concentration controls while measuring both MLP and competing-substrate phosphorylation.
status: DRAFT
