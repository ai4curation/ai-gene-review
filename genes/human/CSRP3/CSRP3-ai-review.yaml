- id: PMID:27353086
  title: MLP and CARP are linked to chronic PKCα signalling in dilated cardiomyopathy.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Genuine full source Methods/Results/Discussion read. Bacterial human GST-MLP reduces PKC-alpha autophosphorylation and phosphorylation of a competing phospholamban fragment while also serving as a substrate. Dedicated inhibitor action beyond phosphoacceptor competition remains unresolved. Human disease associations and mouse knockout findings are distinct from the biochemical assay.
  full_text_unavailable: false
- id: PMID:10555147
  title: Chronic phospholamban-sarcoplasmic reticulum calcium ATPase interaction is the critical calcium cycling defect in dilated cardiomyopathy.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete abstract and actual current mouse donor annotations read. The abstract reports calcium-cycling rescue in a genetic cardiomyopathy model; independently read PMID:12507422 identifies the MLP/PLN model and discusses structural rescue. Original full text remains unavailable; HTTP200 Elsevier response was metadata-only, not scientific main text. Exact developmental timing and detailed target-specific assays are not claimed.
  full_text_unavailable: true
core_functions:
- description: Full-length MLP binds and cross-links actin filaments and engages Z-disc partners to support muscle-fiber integrity and sarcomere organization. Its actin-regulatory effects depend on the assayed protein preparation and context.
  molecular_function:
    id: GO:0008307
    label: structural constituent of muscle
  directly_involved_in:
