    label: Z disc
  supported_by:
  - reference_id: PMID:24934443
    supporting_text: MLP functions as an actin-bundling protein in vitro
  - reference_id: PMID:12507422
  - reference_id: PMID:19752190
- description: Full-length human MLP directly binds actin filaments and cross-links them in assays using tag-cleaved recombinant protein and purified actin. This supplies a molecular activity underlying its muscle structural role. The result does not assign the same activity to the short splice product, and the differing cofilin effects in tagged versus tag-cleaved preparations remain unresolved.
  molecular_function:
