decision_projection:
- row: 0
  source:
    term:
      id: GO:0002026
      label: regulation of the force of heart contraction
    evidence_type: ISS
    original_reference_id: GO_REF:0000024
    qualifier: involved_in
    supporting_entities:
    - UniProtKB:P50462
  review:
    summary: Conserved modulation of cardiac force is a physiological context of MLP.
    action: KEEP_AS_NON_CORE
    reason: The literal mouse P50462 donor has the exact IGI annotation from PMID:10555147. Its complete abstract reports phospholamban-dependent rescue of calcium cycling and contractility in a genetic cardiomyopathy model; the original full text remains unavailable. The independently read PMID:12507422 identifies the MLP/PLN double knockout and discusses secondary relief of mechanical stress. Retain the curated physiological association, without assigning MLP a motor activity or direct control of the calcium pump. The compact core is its performed structural contribution.
    supported_by:
    - reference_id: GO_REF:0000024
    - reference_id: PMID:10555147
    - reference_id: PMID:12507422
    additional_reference_ids:
    - PMID:10555147
    - PMID:12507422
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
      - source_id: UniProtKB:P50462
        source_status: SUPPORTS_TRANSFER
        comment: Literal current donor join preserves 1 experimental exact-term record(s); complete records and identifiers are retained in the public evidence index.
- row: 1
  source:
    term:
      id: GO:0003300
      label: cardiac muscle hypertrophy
    evidence_type: IMP
    original_reference_id: PMID:12507422
    qualifier: involved_in
  review:
    summary: MLP participates in the cardiac response to mechanical load.
    action: KEEP_AS_NON_CORE
    reason: PMID:12507422 measures selective loss of stretch-induced BNP/ANF expression in neonatal mouse MLP-null cardiomyocytes, while hormonal responses remain. Those are markers of a hypertrophic program, not measurements of cardiomyocyte enlargement. Retain the contextual growth response with that endpoint limitation; a general cell-size-control activity is not established.
    supported_by:
    - reference_id: PMID:12507422
- row: 2
  source:
    term:
      id: GO:0005515
      label: protein binding
    evidence_type: IPI
    original_reference_id: PMID:12127981
    qualifier: enables
    supporting_entities:
    - UniProtKB:Q86WU2
  review:
    summary: The reported interaction with LDHD is retained.
    action: KEEP_AS_NON_CORE
    reason: The complete PMID:12127981 abstract explicitly reports interaction of mammalian D-lactate dehydrogenase proteins with CRP3/MLP, and the original human source identifies Q86WU2. The full experimental text was not recovered. This positive interaction does not transfer dehydrogenase activity or establish a dedicated metabolic-adaptor role. Retain supported generic binding under the project instruction.
    supported_by:
    - reference_id: PMID:12127981
- row: 3
  source:
    term:
      id: GO:0005515
      label: protein binding
    evidence_type: IPI
    original_reference_id: PMID:15205937
    qualifier: enables
    supporting_entities:
    - UniProtKB:P35609
  review:
    summary: The verified ACTN2 interaction supports muscle alpha-actinin binding.
    action: MODIFY
    reason: The original PMID:15205937 Methods use complete human MLP and alpha-actinin-2 cDNAs, with purified recombinant binding and competition assays. The literal source partner P35609 is ACTN2. GO:0051371 describes binding to muscle alpha-actinin isoforms and is more informative than generic protein binding. The recombinant ternary-complex evidence is not a native stoichiometry measurement.
    supported_by:
    - reference_id: PMID:15205937
      supporting_text_sha256: 43076aad0a0707ee13d6155e0e4defd9892bab68455566fe444426e1c82c7a1d
