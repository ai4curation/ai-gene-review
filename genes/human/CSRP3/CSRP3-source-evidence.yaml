    correctness: VERIFIED
    review_notes: Genuine Springer PDF recovered and its complete scientific Methods/Results/Discussion/captions read. Human full MLP/ACTN2 and N-RAP fragments were tested in purified recombinant binding and competition experiments. The existing repository cache remains abstract-only; no native-complex stoichiometry or image-pixel claim.
