- id: PMID:24860983
  title: Muscle lim protein isoform negatively regulates striated muscle actin dynamics and differentiation.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Genuine full cache read at the specified unique target Results/Methods. Historical MLP-b is the 59-aa JN898958 product, differing from current 58 by terminal H. Tissue pull-downs, purified overlays and human proteins expressed in mouse C2C12 are distinct. Results cardiac versus Methods skeletal extract wording remains unresolved. Identical backbone identifiers do not establish identical tested products.
