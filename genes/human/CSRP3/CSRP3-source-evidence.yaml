    correctness: VERIFIED
    review_notes: Complete abstract directly describes nuclear/cytoplasmic MLP, MyoD/MRF4/myogenin association and enhanced MyoD–E47 DNA binding without an intrinsic activation domain. Full original recovery failed; MyoD-specific results are not relabeled as a separate MRF4 assay.
