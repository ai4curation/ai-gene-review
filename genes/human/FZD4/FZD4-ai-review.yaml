references:
- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO terms
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The authentic official method describes curated InterPro signature-to-GO mappings. It
      explains the incoming IPR000539 membrane assertion; the method is not an independent localization
      experiment. Direct FZD4 surface evidence supports plasma membrane, whose direct is_a relationship
      to membrane was independently retained, so the broad existing membrane row is treated as too general.
- id: GO_REF:0000024
