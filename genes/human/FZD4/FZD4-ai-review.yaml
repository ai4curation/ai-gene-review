- id: UniProt:Q9ULV1
  findings: []
  title: 'UniProtKB Q9ULV1 (FZD4_HUMAN): Frizzled-4'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Official reviewed human FZD4 record confirms 537-aa precursor, signal peptide, cysteine-rich
