    judgment of sequence similarity
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The authentic official method describes curator-assessed transfer from experimentally
      annotated similar proteins. It explains the literal mouse Q61088 dendrite ISS source and preserves
      the original cell-type extension. The donor and same-term experimental row were verified, but the
      accessible PMID25424568 abstract does not resolve the precise localization assay; the method itself
      cannot remove that evidence-access limitation. Two other original FZD4 ISS rows instead name the
      nonhomologous WNT7B/P56706 ligand; separate source-defect records request a donor/evidence check.
      That does not invalidate the method or the correctly scoped mouse transfer.
- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'The authentic official phylogenetic method describes experimentally grounded ancestral
      assertions inherited along a curated family tree. The actual PTHR11309 target lineage and plasma-membrane
      IBD at AN0/PTN000139394 were independently verified, with no intervening negative event. Current
      incoming and retained global/main donor sets differ by one added worm and one omitted zebrafish
      donor; both source versions are preserved. Donor count and legitimate target self-membership are
      not treated as evidence of weak or circular propagation. Across the complete review, all six actual
      target-lineage IBD placements are verified: raw 36, 50, 65, 72 and 88 at PTN000139394, and raw 77
      at PTN002601720. Current incoming donor sets differ from retained main/global sets for raw 36, 65,
      72 and 88; raw 50 and 77 match. These source-version differences are retained independently of the
      biological decisions.'
- id: GO_REF:0000052
  title: Gene Ontology annotation based on curation of immunofluorescence data
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The authentic official method describes literature-supported antibody/confocal subcellular
      localization curation. The current official HPA FZD4 XML identifies supported main plasma-membrane
      localization and additional nucleoplasmic/ciliary contexts, with human cell-line/sample metadata.
      This review retains the incoming plasma-membrane assertion; individual HPA images were not independently
      scored and additional locations are not added merely from the metadata.
- id: GO_REF:0000107
  title: Automatic transfer of experimentally verified manual GO annotation data to orthologs using Ensembl
    Compara
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'The authentic official method explains Ensembl Compara transfer of eligible experimental
      annotations through orthology, with exclusions including NOT and generic protein-binding transfers.
      The literal mouse Q61088 source supports the specific synaptic, junctional and dendritic comparisons.
      Same-term donor records and selected original sources are considered separately: successful synaptic/junctional
      evidence is not generalized to the unresolved dendrite-localization assay. This method is automated
      orthology transfer, not a PAINT ancestral-node assertion.'
