id: Q9ULV1
gene_symbol: FZD4
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Frizzled-4 is a seven-pass cell-surface receptor with an extracellular cysteine-rich ligand-binding
  domain and cytoplasmic regions that recruit signaling proteins. It responds to Wnt ligands through canonical
  beta-catenin and context-dependent noncanonical pathways. It also recognizes Norrin, a ligand unrelated
  to Wnts, and transduces Norrin signals with an LRP coreceptor. These receptor activities regulate vascular
  development, especially in the retina, and contribute to neuronal morphogenesis in experimental systems.
  Pathogenic FZD4 variants can disrupt receptor trafficking or signaling and cause familial exudative
  vitreoretinopathy.
