core_functions:
- description: Recognizes Wnt ligands at the cell surface and transduces canonical beta-catenin and context-dependent
    noncanonical signals. Human receptor-rescue and Wnt5a reporter assays support canonical signaling;
    calcium-branch and neuronal experiments have distinct heterologous or rodent contexts.
  molecular_function:
    id: GO:0042813
    label: Wnt receptor activity
  directly_involved_in:
  - id: GO:0060070
    label: canonical Wnt signaling pathway
  - id: GO:0035567
    label: non-canonical Wnt signaling pathway
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:28733458
    supporting_text: Wnt9a signaled only via FZD4 and FZD10
  - reference_id: PMID:20802536
  - reference_id: PMID:12172548
  - reference_id: PMID:25424568
- description: Binds Norrin and, with an LRP coreceptor, activates beta-catenin-dependent signaling that
    controls retinal endothelial growth and vascular organization. FZD4 supplies the signal-reception
    step of this developmental program; human disease-associated receptor variants and cell-specific mouse
    experiments connect the receptor mechanism to retinal vascularization.
  molecular_function:
    id: GO:0004896
    label: cytokine receptor activity
  directly_involved_in:
  - id: GO:0110135
    label: Norrin signaling pathway
  - id: GO:0061299
    label: retina vasculature morphogenesis in camera-type eye
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:15035989
    supporting_text: the specificity and high affinity of Norrin-Fz4 binding
  - reference_id: PMID:17955262
  - reference_id: PMID:19837032
    supporting_text: Fz4 signaling specifically in the development of intra-retinal capillaries
  - reference_id: PMID:12172548
suggested_questions:
- question: Which FZD4-specific experiments establish recognition of amyloid-beta42 or its oligomeric
    complex? Available original figure legends establish beta40 binding by FZD4 but name FZD5 in the beta42/aggregate
    panels; full-text target evidence remains unresolved.
- question: How do ligand and cellular context determine whether FZD4 signals through canonical or noncanonical
    pathways? Norrin, functional Wnt-receptor assays, calcium signaling and neuronal morphogenesis are
    supported in distinct experimental systems; a particular G-protein mechanism is not established here.
