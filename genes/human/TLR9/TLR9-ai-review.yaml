    action: KEEP_AS_NON_CORE
    reason: True but very general; covered more precisely by innate immune response and the TLR9 signalling
      pathway.
    supported_by:
    - reference_id: PMID:11130078
      supporting_text: Here we show that cellular response to CpG DNA is mediated by a Toll-like receptor,
        TLR9.
