- term:
    id: GO:0008584
    label: male gonad development
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:M0RAA8
  - ensembl:ENSRNOP00000066453
  review:
    summary: Ensembl Compara transfer of male gonad development from rat Tlr9.
    action: MARK_AS_OVER_ANNOTATED
    reason: No evidence that TLR9 contributes to gonad development; the rat source is likely an expression-based
      observation. TLR9 knockout mice are fertile and the literature on TLR9 function concerns nucleic-acid
      sensing (PMID:11130078). Over-annotation propagated electronically.
    supported_by:
    - reference_id: PMID:11130078
      supporting_text: Here we show that cellular response to CpG DNA is mediated by a Toll-like receptor,
        TLR9.
- term:
