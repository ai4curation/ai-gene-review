- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - MGI:MGI:1932389
  - PANTHER:PTN002934106
  - UniProtKB:Q2EEY0
  - UniProtKB:Q9NR96
  - UniProtKB:Q9NR97
  - UniProtKB:Q9NYK1
  review:
    summary: PAINT IBA for plasma membrane at the TLR7/8/9 clade node; human TLR9 is among the descendant
      evidences.
    action: KEEP_AS_NON_CORE
    reason: 'TLR9 has been observed at the cell surface in several human cell types (polarized intestinal
      epithelium, PMID:17128265; melanocytes, PMID:19740627), so the location is defensible. It is not
      the compartment where TLR9 normally signals: TLR9 is ER-resident at rest, signals after ectodomain
      cleavage in endolysosomes, and forcing it to the cell surface renders it non-functional (PMID:18820679).
      Retained as a non-core location.'
    supported_by:
    - reference_id: PMID:17128265
      supporting_text: TLR9 activation through apical and basolateral surface domains have distinct transcriptional
        responses, evident by NF-kappaB activation and cDNA microarray analysis.
    - reference_id: PMID:18820679
      supporting_text: Furthermore, conditions that prevent receptor proteolysis, including forced TLR9
        surface localization, render the receptor non-functional.
