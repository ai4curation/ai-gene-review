        responses, evident by NF-kappaB activation and cDNA microarray analysis.
    - reference_id: PMID:11130078
      supporting_text: Thus, vertebrate immune systems appear to have evolved a specific Toll-like receptor
        that distinguishes bacterial DNA from self-DNA.
    - reference_id: PMID:14716310
      supporting_text: We show that CpG DNA binds directly to TLR9 in ligand-binding studies.
