- term:
    id: GO:0005576
    label: extracellular region
  evidence_type: NAS
  original_reference_id: PMID:11130078
  qualifier: located_in
  review:
    summary: NAS asserting TLR9 is located in the extracellular region, citing the TLR9 knockout paper.
    action: REMOVE
    reason: TLR9 is a single-pass type I membrane protein resident in the ER, Golgi and endolysosomal
      membranes; its ectodomain faces the lumen of these compartments, not the extracellular space. The
      cited paper is a knockout/function paper and contains no evidence for a secreted form. No experimental
      support; the ectodomain is not released.
    supported_by:
    - reference_id: PMID:14716310
      supporting_text: We have found that TLR9 is localized to the endoplasmic reticulum (ER) of dendritic
        cells (DCs) and macrophages.
    - reference_id: PMID:18820679
      supporting_text: The ectodomains of TLR9 and TLR7 are cleaved in the endolysosome, such that no
        full-length protein is detectable in the compartment where ligand is recognized.
