- term:
    id: GO:0007249
    label: canonical NF-kappaB signal transduction
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:1932389
  - PANTHER:PTN002934106
  - UniProtKB:Q9NYK1
  review:
    summary: PAINT IBA for canonical NF-kappaB signal transduction at the TLR7/8/9 node.
    action: ACCEPT
    reason: TLR9 ligation triggers IkappaBalpha degradation and NF-kappaB activation via MyD88/IRAK/TRAF6
      (PMID:17128265, PMID:17932028); the receptor initiates this cascade. Human TLR9 is within the clade;
      no evidence of divergence.
    supported_by:
    - reference_id: PMID:17128265
      supporting_text: Whereas basolateral TLR9 signals IkappaBalpha degradation and activation of the
        NF-kappaB pathway, apical TLR9 stimulation invokes a unique response
    - reference_id: PMID:17932028
      supporting_text: Here we report the endogenous interaction between Brutons's tyrosine kinase (Btk)
        and human TLR8 and TLR9 in the monocytic cell line THP1.
