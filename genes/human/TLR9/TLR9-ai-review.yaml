core_functions:
- description: Endolysosomal pattern recognition receptor for microbial CpG DNA. After UNC93B1-dependent
    transport and ectodomain cleavage in the endolysosome, ligand-bound TLR9 dimerizes and recruits MyD88
    through its TIR domain, initiating the TLR9 signalling pathway that activates NF-kappaB and type I
    interferon production.
  molecular_function:
    id: GO:0038187
    label: pattern recognition receptor activity
  directly_involved_in:
  - id: GO:0034162
    label: toll-like receptor 9 signaling pathway
  - id: GO:0032727
    label: positive regulation of interferon-alpha production
  locations:
  - id: GO:0036020
    label: endolysosome membrane
  - id: GO:0031901
    label: early endosome membrane
  supported_by:
  - reference_id: PMID:14716310
    supporting_text: We show that CpG DNA binds directly to TLR9 in ligand-binding studies.
  - reference_id: PMID:14716310
    supporting_text: TLR9 redistributes from the ER to CpG DNA-containing structures, which also accumulate
      MyD88.
  - reference_id: PMID:18820679
    supporting_text: only the processed form recruits MyD88 on activation, indicating that this truncated
      receptor, rather than the full-length form, is functional.
  - reference_id: PMID:18931679
    supporting_text: Here we show that TLR9 proteolytic cleavage is a prerequisite for TLR9 signaling.
  - reference_id: PMID:16286015
    supporting_text: We show here that IFN-alpha/beta and -lambda induction via TLR-7, TLR-8, and TLR-9
      was abolished in IRAK-4-deficient blood cells.
- description: Direct binding of DNA containing unmethylated CpG motifs, allowing discrimination of microbial
    DNA from largely methylated, CpG-poor host DNA. Agonistic CpG DNA is bound across two protomers in
    a 2:2 complex, whereas inhibitory DNA binds a monomer.
  molecular_function:
    id: GO:0045322
    label: unmethylated CpG binding
  directly_involved_in:
  - id: GO:0032490
    label: detection of molecule of bacterial origin
  locations:
  - id: GO:0036020
    label: endolysosome membrane
  supported_by:
  - reference_id: PMID:14716310
    supporting_text: We show that CpG DNA binds directly to TLR9 in ligand-binding studies.
  - reference_id: PMID:25686612
    supporting_text: Agonistic-CpG-DNA-bound TLR9 formed a symmetric TLR9-CpG-DNA complex with 2:2 stoichiometry,
      whereas iDNA-bound TLR9 was a monomer.
  - reference_id: PMID:11130078
    supporting_text: Thus, vertebrate immune systems appear to have evolved a specific Toll-like receptor
      that distinguishes bacterial DNA from self-DNA.
  - reference_id: PMID:11564765
    supporting_text: Cells that are not responsive to CpG DNA become responsive when transfected with
      hTLR9.
suggested_questions:
- question: Should siRNA binding (GO:0035197, IMP, PMID:15723075) remain on TLR9? The abstract attributes
    siRNA recognition to TLR7; what in the full text supports a TLR9 assignment?
- question: The IDA for positive regulation of type II interferon production (PMID:16286015) appears to
    reflect IFN-lambda (type III) data; can the curator confirm and move it to GO:0034346?
- question: Surface TLR9 is reported on intestinal epithelium and melanocytes, yet forced surface TLR9
    is non-functional in macrophages (PMID:18820679). Does surface TLR9 in these cells signal on its own,
    and is the ectodomain processed there?
- question: Is the MyD88-independent TLR9-SERCA2 pathway described in rodent cardiomyocytes (PMID:24610369)
    operative in human cells?
suggested_experiments:
- description: Direct binding assays of purified human TLR9 ectodomain with siRNA versus CpG DNA to test
    whether the siRNA binding annotation has any basis.
- description: Measure IFN-gamma versus IFN-lambda in purified human pDC and B cell cultures from TLR9-deficient
    or knockdown cells after CpG stimulation to separate direct from bystander interferon outputs.
