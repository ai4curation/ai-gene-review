id: Q9NR96
gene_symbol: TLR9
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: TLR9 (Toll-like receptor 9, CD289) is an endosomal pattern recognition receptor of the innate
  immune system that senses DNA containing unmethylated CpG dinucleotides, a feature enriched in bacterial
  and viral genomes. It is a single-pass type I membrane protein with a leucine-rich-repeat ectodomain
  and a cytoplasmic TIR domain. Newly made TLR9 is folded in the endoplasmic reticulum and trafficked
  with the chaperone UNC93B1 through the Golgi to endolysosomes, where proteolytic cleavage of the ectodomain
  generates the functional receptor. CpG DNA binding induces a 2:2 receptor-ligand dimer that recruits
  MyD88 through the TIR domain, assembling an IRAK4-IRAK1/2-TRAF6 complex that activates NF-kappaB and
  MAP kinases (pro-inflammatory cytokines) and, in plasmacytoid dendritic cells, IRF7 (type I interferon).
  TLR9 is expressed mainly in B cells and plasmacytoid dendritic cells, and also in epithelial and other
  cell types; it drives B cell proliferation and antibody secretion, and its intracellular localization
  limits responses to self DNA.
