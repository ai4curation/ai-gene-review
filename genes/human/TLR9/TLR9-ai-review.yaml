    action: ACCEPT
    reason: TLR9 is the receptor that distinguishes unmethylated CpG-containing bacterial DNA from self
      DNA (PMID:11130078) and binds CpG DNA directly (PMID:14716310). Detection of molecule of bacterial
      origin describes the receptor's recognition role.
