    label: endosome membrane
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-109699
  qualifier: located_in
  review:
    summary: Reactome reaction placing TLR9 (full length or processed C-terminal fragment) in the endosome
      membrane during ligand binding and myddosome assembly.
    action: ACCEPT
    reason: TLR9 binds CpG DNA and recruits MyD88 in endosomal/endolysosomal membranes (PMID:14716310,
      PMID:18820679). Correct, although endolysosome membrane (GO:0036020) is the more precise compartment.
      Reactome R-HSA-109699 (PI3K phosphorylates PIP2) is a generic reaction in which TLR9 is one of many
