id: P55287
gene_symbol: CDH11
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Cadherin-11 is a type II classical cadherin that mediates calcium-dependent homophilic cell
  adhesion, particularly in mesenchymal cells. Its extracellular cadherin repeats engage cadherin molecules
  on adjacent cells, while the canonical cytoplasmic tail recruits catenins at adherens junctions. These
  contacts coordinate cell organization and collective movement. A truncated splice isoform modulates
  the intact protein, and proteolytic release produces an extracellular fragment. CDH11 dysfunction perturbs
  craniofacial development; osteoblast and valve-cell studies also connect its adhesive role to tissue
  formation and remodeling.
