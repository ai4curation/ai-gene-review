  review:
    summary: CDH11 contributes to cell-substrate adhesion through focal-adhesion organization.
    action: KEEP_AS_NON_CORE
    reason: 'The original patient fibroblasts show altered spreading and immature paxillin-positive focal
      adhesions (Fig.5b–d), while initial substrate attachment is comparable to controls through 2 hours
      (Fig.S4C). The CDH11-Fc plate assay alone measures homophilic trans adhesion and is not the basis
      for this process. Independent PMID26952325 establishes a direct structural contribution in Xenopus
      neural crest: CDH11 transmembrane/cytoplasmic regions support fibronectin adhesion through a syndecan-4
      complex, with loss/rescue and force assays; syndecan-4 supplies the extracellular fibronectin recognition.
      That study also localizes endogenous CDH11 to focal adhesions in human HFF-1 fibroblasts. Together
      these support a conserved non-core contribution, while preserving the original IMP source and distinguishing
      ortholog mechanism from human localization. No intrinsic CDH11 fibronectin- or integrin-binding
      activity is inferred.'
    supported_by:
    - reference_id: PMID:33811546
    - reference_id: PMID:26952325
