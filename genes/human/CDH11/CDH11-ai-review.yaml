core_functions:
- description: Mediates calcium-dependent homophilic adhesion through its extracellular cadherin domains,
    establishing cohesive cell contacts. The direct human-protein assays include CDH11-bearing mouse L
    cells binding immobilized human CDH11 ectodomain. These adhesive contacts support cadherin-dependent
    movement along other cells, without implying a uniform direction of migration regulation.
  molecular_function:
    id: GO:0098641
    label: cadherin binding involved in cell-cell adhesion
  directly_involved_in:
  - id: GO:0044331
    label: cell-cell adhesion mediated by cadherin
  - id: GO:0016477
    label: cell migration
  locations:
  - id: GO:0005886
    label: plasma membrane
  - id: GO:0005912
    label: adherens junction
  supported_by:
  - reference_id: PMID:33811546
    supporting_text: L cells expressing CDH11-WT bound to hCadherin-11-Fc in a dose-dependent manner
  - reference_id: PMID:16525026
- description: The canonical cytoplasmic tail recruits beta-catenin into adhesive junctions, coupling
    CDH11 contacts to catenin-dependent junction organization. The tail-truncated splice isoform does
    not inherit this canonical linkage.
  molecular_function:
    id: GO:0008013
    label: beta-catenin binding
  directly_involved_in:
  - id: GO:0034332
    label: adherens junction organization
  locations:
  - id: GO:0005886
    label: plasma membrane
  - id: GO:0005912
    label: adherens junction
  in_complex:
    id: GO:0016342
    label: catenin complex
  supported_by:
  - reference_id: PMID:16525026
  - reference_id: PMID:10320525
  - reference_id: PMID:9556063
    supporting_text: bands corresponding to cadherins were coimmunoprecipitated by a beta-catenin antibody
