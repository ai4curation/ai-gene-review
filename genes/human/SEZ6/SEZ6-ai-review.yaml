gene_symbol: SEZ6
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SEZ6 (seizure-related 6 homolog) is a brain-enriched single-pass type I transmembrane glycoprotein
  whose large extracellular region is built from CUB domains and complement control protein (sushi) repeats,
  with a short cytoplasmic tail. It is expressed on neurons, where it is found on dendrites and in synaptic
  and postsynaptic fractions, and it is a prominent substrate of the secretase BACE1, so a soluble ectodomain
  is shed into the extracellular space and cerebrospinal fluid. SEZ6 is thought to act in cell-cell recognition
  and neuronal membrane signalling - it balances dendrite elongation against branching during arbor elaboration
  and is required for appropriate excitatory synaptic connectivity and motor coordination, with Sez6-family-null
  mice showing dendritic, synaptic and behavioural deficits. Its surface expression on small-cell lung
  cancer and neuroendocrine tumours has made it an antibody-drug-conjugate and T-cell-engager target.
