suggested_questions:
- question: What is the molecular activity of SEZ6 - does its CUB/sushi ectodomain bind a specific extracellular
    ligand or a trans-synaptic partner, and is a receptor or adhesion term justified?
- question: Is the BACE1-shed SEZ6 ectodomain biologically active, for example as a diffusible regulator
    of dendrite branching, or is shedding purely a down-regulation mechanism?
- question: How do SEZ6, SEZ6L and SEZ6L2 divide the dendritic and synaptic functions of the family, and
    what accounts for the human cerebellar ataxia phenotypes associated with SEZ6 variants?
suggested_experiments:
- description: Unbiased surface interactome screening (cell-surface two-hybrid or avidity-based extracellular
    interaction screening) with the SEZ6 ectodomain, to identify the ligand or trans-synaptic partner
    that would justify a specific molecular function term.
- description: Structure-function analysis of CUB versus sushi domain deletions re-expressed in SEZ6-null
    human neurons, scoring dendritic branching and excitatory synapse density.
- description: Acute application of purified shed SEZ6 ectodomain to developing neurons, with and without
    membrane-anchored SEZ6, to test whether the soluble fragment has signalling activity.
