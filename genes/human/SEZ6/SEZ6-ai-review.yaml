core_functions:
- description: Presents a CUB- and sushi-domain ectodomain at the surface of neuronal dendrites and spines,
    where it mediates cell-cell recognition and neuronal membrane signalling that balances dendrite elongation
    against branching and supports maturation of excitatory synapses; the ectodomain is shed by BACE1.
