  evidence_type: TAS
  original_reference_id: PMID:8660976
  qualifier: enables
  review:
    action: MODIFY
    summary: This is a receptor activity term, and ephrin-A4 is the ligand, not the
      receptor.
    reason: The term is defined as combining with a transmembrane ephrin to initiate a
      change in cell activity, which describes an Eph receptor tyrosine kinase. Ephrin-A4
      is a GPI-anchored ligand with no kinase domain and no transmembrane segment, and the
      cited paper describes LERK-1, LERK-3 and LERK-4 precisely as membrane-anchored
      ligands of the Eph kinases. The sound content of the row is that ephrin-A4 engages
      Eph receptors, so the correct term is ephrin receptor binding.
    proposed_replacement_terms:
    - id: GO:0046875
      label: ephrin receptor binding
