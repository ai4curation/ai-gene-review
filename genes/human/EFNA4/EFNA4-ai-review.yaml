core_functions:
- description: GPI-anchored surface ligand that binds EphA-class receptor tyrosine kinases
    on neighbouring cells, driving receptor clustering and activation and initiating
    contact-dependent bidirectional signalling between the two cells.
  molecular_function:
    id: GO:0046875
    label: ephrin receptor binding
  locations:
  - id: GO:0005886
    label: plasma membrane
  directly_involved_in:
  - id: GO:0048013
    label: ephrin receptor signaling pathway
  - id: GO:0007267
    label: cell-cell signaling
  supported_by:
  - reference_id: PMID:19836338
    supporting_text: We find that EphA4 has greatest affinity for ephrinA4 (KD = 36 nM)
  - reference_id: file:human/EFNA4/EFNA4-uniprot.txt
    supporting_text: Binds promiscuously Eph receptors residing on adjacent cells, leading
      to contact-dependent bidirectional signaling into neighboring cells.
  - reference_id: file:human/EFNA4/EFNA4-uniprot.txt
    supporting_text: Cell membrane; Lipid-anchor, GPI-anchor.
suggested_questions:
- question: Does the secreted isoform of ephrin-A4 act as a soluble antagonist of EphA
    signalling, or can it cluster and activate receptors the way the membrane-anchored
    form does?
- question: Given its expression in lymphoid tissue, what is the physiological EphA partner
    of ephrin-A4 in the interaction between activated B lymphocytes and dendritic cells?
- question: Does ephrin-A4 transduce reverse signals in the presenting cell, and if so
    through which GPI-anchor-associated machinery, since it has no cytoplasmic domain?
suggested_experiments:
- hypothesis: Membrane-anchored and secreted ephrin-A4 isoforms have opposite effects on
    EphA receptor activation.
  description: Compare EphA4 autophosphorylation and downstream RAC1 activation in cells
    exposed to clustered GPI-anchored ephrin-A4 presented on apposed cells versus purified
    soluble isoform 2, at matched concentrations.
- hypothesis: Ephrin-A4 is the principal A-class ligand engaged at the B-cell and
    dendritic-cell interface in tonsil.
  description: Surface-label and immunoprecipitate EphA receptors from tonsillar B cells
    and dendritic cells, identify bound ephrins by mass spectrometry, and test the
    requirement for EFNA4 by blocking antibodies in conjugate-formation assays.
- hypothesis: GPI anchoring is required for ephrin-A4 to activate EphA receptors in trans.
  description: Replace the GPI anchor of ephrin-A4 with a transmembrane segment or remove
    it with phospholipase C, then measure receptor clustering, phosphorylation and cell
    repulsion in co-culture assays.
