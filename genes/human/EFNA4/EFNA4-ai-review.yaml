id: P52798
gene_symbol: EFNA4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Ephrin-A4 is a GPI-anchored ligand for EphA-class receptor tyrosine kinases.
  The mature protein is attached to the outer leaflet of the plasma membrane through a
  glycosylphosphatidylinositol anchor, with no transmembrane segment, so its entire
  receptor-binding surface is exposed extracellularly. It binds EphA receptors on
  adjacent cells, including EphA1, EphA4 and EphA10, and EphA4 binds ephrin-A4 with the
  highest affinity among the ephrins tested. Engagement produces contact-dependent
  bidirectional signalling that underlies repulsion, adhesion and guidance during
  neuronal, vascular and epithelial development, and an alternatively spliced isoform is
  secreted rather than membrane-anchored.
