id: Q92508
gene_symbol: PIEZO1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  PIEZO1 is a large multi-pass plasma-membrane cation channel whose pore
  opens when the surrounding membrane is mechanically deformed. The channel directly
  converts membrane tension, indentation and fluid shear into Na+, K+, Ca2+ and other
  cation fluxes, depolarizing cells and raising cytosolic calcium. PIEZO1-dependent
  mechanotransduction is important in endothelial shear-stress responses, vascular
  development, red-cell volume homeostasis and muscle-cell morphogenesis; context-specific
  pools have also been reported in the endoplasmic reticulum, ER-Golgi intermediate
  compartment, lamellipodia and mouse hair-cell stereocilia.
