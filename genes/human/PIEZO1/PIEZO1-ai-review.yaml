suggested_questions:
- question: >-
    Which reported non-plasma-membrane PIEZO1 pools, especially the ER and ERGIC pools,
    are active channels rather than trafficking intermediates or overexpression-enriched
    storage compartments?
- question: >-
    Which native human tissues use PIEZO1 itself as the primary direct detector of force,
    and which use PIEZO1 as a downstream Ca2+ entry channel coupled to another mechanical
    sensor?
suggested_experiments:
- description: >-
    Endogenously tag human PIEZO1 in endothelial, erythroid and myoblast models and combine
    live localization with acute pressure-clamp, shear-stress and Yoda1 assays to separate
    channel-active plasma-membrane pools from ER/ERGIC trafficking pools.
