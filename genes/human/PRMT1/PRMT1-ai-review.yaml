  review:
    summary: methyl-CpG binding is not a supported direct PRMT1 function.
    action: REMOVE
    reason: PMID:25284789 identifies CHTOP as the methylcytosine-binding protein associated with
      the PRMT1-containing arginine methyltransferase complex; it does not support methyl-CpG
      binding by PRMT1 itself.
    supported_by:
    - reference_id: PMID:25284789
      supporting_text: Furthermore, we demonstrate that chromatin target of PRMT1 (CHTOP) binds
        to 5hmC. We found that CHTOP is associated with an arginine methyltransferase complex
    source_defects:
    - defect_type: WRONG_GENE_PRODUCT
      resource: UNIPROT
      slot: DB_Object_ID
      requested_change: DELETE_ROW
      asserted_value: PRMT1 enables GO:0008327 methyl-CpG binding with IDA evidence from
        PMID:25284789
      corrected_value: UniProtKB:Q9Y3Y2
      corrected_label: CHTOP
      confidence: CONFIRMED
      explanation: >-
        The PMID:25284789 abstract states that CHTOP, not PRMT1, binds 5hmC; PRMT1 is present as a
        component of the associated arginine methyltransferase complex, so the UniProt GOA row
        attaching methyl-CpG binding to PRMT1 should be deleted.
      supported_by:
      - reference_id: PMID:25284789
        supporting_text: Furthermore, we demonstrate that chromatin target of PRMT1 (CHTOP) binds
          to 5hmC. We found that CHTOP is associated with an arginine methyltransferase complex
