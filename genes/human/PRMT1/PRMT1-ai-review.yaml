core_functions:
- description: PRMT1 is the major type-I arginine methyltransferase that deposits mono- and
    asymmetric dimethylarginine marks on histone H4R3 and numerous non-histone substrates, providing
    direct methylation control over chromatin activation, DNA-damage signaling and
    nutrient-responsive mTORC1 activation.
  molecular_function:
    id: GO:0035242
    label: protein-arginine omega-N asymmetric methyltransferase activity
  directly_involved_in:
  - id: GO:0006338
    label: chromatin remodeling
  locations:
  - id: GO:0005634
    label: nucleus
  - id: GO:0005829
    label: cytosol
  - id: GO:0005765
    label: lysosomal membrane
  supported_by: *id005
suggested_questions:
- question: Which non-histone PRMT1 substrates are sufficiently direct and physiological to promote
    from cell-context-specific branches to core curated functions?
suggested_experiments:
- description: Use acute PRMT1 degron rescue with substrate-site arginine mutants and methylarginine
    proteomics to rank histone and non-histone substrates by direct physiological dependence on
    PRMT1.
