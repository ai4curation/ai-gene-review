- term:
    id: GO:0045727
    label: positive regulation of translation
  evidence_type: IDA
  original_reference_id: PMID:30765518
  qualifier: involved_in
  review:
    summary: positive regulation of translation is a supported but substrate- or context-specific
      PRMT1 branch.
    action: KEEP_AS_NON_CORE
    reason: PRMT1 methylates FMRP, and methylated FMRP LCR weakens phase separation that otherwise
      represses in vitro translation; this FMRP/RNA-granule branch is kept as non-core.
    supported_by:
    - reference_id: PMID:30765518
      supporting_text: Previous work has shown that the RGG motif of FMRP is methylated in vivo,
        which has been reported to weaken its binding to G-quadruplex mRNAs and oppose
        translational repression as a result of ribosome stalling ( 49 , 50 ). Thus, we hypothesized
        that methylation may regulate phase separation by modulating RGG-mediated RNA-binding
        interactions. To generate methylated FMRP LCR (Me-FMRP LCR ), we used protein arginine N
        -methyltransferase 1 (PRMT1), an enzyme known to methylate RG motifs of FMRP in vivo ( 51 ).
