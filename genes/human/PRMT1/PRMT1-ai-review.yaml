- term:
    id: GO:0030510
    label: regulation of BMP signaling pathway
  evidence_type: IDA
  original_reference_id: PMID:33667543
  qualifier: involved_in
  review:
    summary: regulation of BMP signaling pathway is a supported but substrate- or context-specific
      PRMT1 branch.
    action: KEEP_AS_NON_CORE
    reason: PRMT1 methylates Smad6 R81 after BMP4 stimulation and limits Smad1-driven transcription;
      this is a specific signaling branch outside the dominant H4R3 chromatin activity, so it is
      kept as non-core.
    supported_by:
    - reference_id: PMID:33667543
      supporting_text: In the present study, we show that BMP induces Smad6 methylation at R81 in
        the cytosol to facilitate its interaction with Smad1 and disruption of Smad1-Smad4
        complexes, resulting in repression of Smad1-driven transcription and inhibition of BMP
        responsiveness.
- term:
    id: GO:0031175
    label: neuron projection development
  evidence_type: IMP
  original_reference_id: PMID:18773938
  qualifier: involved_in
  review:
    summary: neuron projection development is a supported but substrate- or context-specific PRMT1
      branch.
    action: KEEP_AS_NON_CORE
    reason: PRMT1 depletion affects neurite outgrowth in Neuro2a cells; this supports a neuronal
      morphology branch but not promotion of neuron-projection development to PRMT1's core
      methyltransferase role.
