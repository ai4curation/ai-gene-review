id: Q99873
gene_symbol: PRMT1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'PRMT1 encodes the major mammalian type-I protein arginine methyltransferase, which monomethylates
  and asymmetrically dimethylates arginine residues on histone H4 and many non-histone substrates in the
  nucleus, cytosol and signal-dependent lysosomal membrane contexts to control chromatin activation, DNA-damage
  signaling, RNA-protein regulation and amino-acid sensing.'
