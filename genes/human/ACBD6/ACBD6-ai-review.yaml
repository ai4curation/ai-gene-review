- term:
    id: GO:0008289
    label: lipid binding
  evidence_type: IMP
  original_reference_id: PMID:37951597
  qualifier: enables
  review:
    summary: >-
      Broad lipid binding annotation from PMID:37951597; refine to the specific experimentally
      established child term GO:0000062 fatty-acyl-CoA binding.
    action: MODIFY
    reason: >-
      Human ACBD6 does not bind free fatty acids or general lipids indiscriminately; its
      N-terminal ACB domain specifically binds medium- and long-chain fatty-acyl-CoA
      thioesters (GO:0000062, already carried by Q9BR61 on IMP, IBA, and IEA evidence;
      PMID:18268358, PMID:26290611, PMID:37951597). Per GO specificity rules, generic
      GO:0008289 lipid binding is modified to GO:0000062 fatty-acyl-CoA binding.
    proposed_replacement_terms:
    - id: GO:0000062
      label: fatty-acyl-CoA binding
    supported_by:
    - reference_id: file:human/ACBD6/ACBD6-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: >-
        Binds long-chain acyl-coenzyme A molecules with a strong preference for unsaturated
        C18:1-CoA, lower affinity for unsaturated C20:4-CoA, and very weak affinity for
        saturated C16:0-CoA. Does not bind fatty acids.
core_functions:
- description: >-
    Cytosolic carrier of medium- and long-chain fatty-acyl-CoA thioesters (preferentially
    unsaturated C18:1-CoA, C18:2-CoA, and C20:4-CoA over C16:0-CoA) via the N-terminal ACB
    domain, buffering free acyl-CoAs and regulating acyl-donor transfer to membrane
    lysophosphatidylcholine acyltransferases (LPCATs) for phosphatidylcholine acyl-chain
    remodeling.
  molecular_function:
    id: GO:0000062
    label: fatty-acyl-CoA binding
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:18268358
    supporting_text: >-
      ACBD6 binds long-chain acyl-CoAs with a strong preference for unsaturated, C18:1-CoA
      and C20:4-CoA, over saturated, C16:0-CoA, acyl species.
  - reference_id: PMID:26290611
    supporting_text: >-
      The acylation rate of lysophosphatidylcholine into PC catalyzed by the red cell
      lysophosphatidylcholine-acyltransferase 1 protein was limited by the transfer of the
      acyl-CoA substrate from ACBD6 to the acyltransferase enzyme.
  - reference_id: PMID:36551154
    supporting_text: >-
      Whereas the formation of acyl-CoAs was not altered in ACBD6.KO cells, lipid acylation
      processes were significantly reduced. The defect in PC formation from LPC by the LPCAT
      enzymes resulted in reduced lipid droplets content.
- description: >-
    Allosteric activator and competitive protector of cytosolic N-myristoyltransferases NMT2
    and NMT1: the C-terminal ANK-repeat domain binds the C-terminal region of NMT2/NMT1 to
    prevent competitive active-site occupancy by abundant palmitoyl-CoA, while acyl-CoA
    binding and Ser106/Ser108 phosphorylation in the N-terminal ACB domain allosterically
    enhance NMT catalytic activity for co- and post-translational protein N-myristoylation.
  molecular_function:
    id: GO:0008047
    label: enzyme activator activity
  locations:
  - id: GO:0005829
    label: cytosol
  substrates:
  - id: UniProtKB:O60551
    label: Glycylpeptide N-tetradecanoyltransferase 2
  - id: UniProtKB:P30419
    label: Glycylpeptide N-tetradecanoyltransferase 1
  supported_by:
  - reference_id: PMID:26621918
    supporting_text: >-
      We determined that the acyl-CoA binding protein, acyl-CoA binding domain (ACBD)6,
      stimulated the NMT reaction of NMT2. This stimulatory effect required interaction
      between ACBD6 and NMT2, and was enhanced by binding of ACBD6 to its ligand, C 18:2
      -CoA. ACBD6 also interacted with the second human NMT enzyme, NMT1.
  - reference_id: PMID:32108178
    supporting_text: >-
      Interaction of ANK with human NMT2 was necessary and sufficient to provide protection.
      Fusion of the ANK module to the acyl-CoA binding protein ACBD1 was sufficient to
      confer the NMT-stimulatory property of ACBD6 to the chimera.
knowledge_gaps:
- gap_statement: >-
    The molecular function and physiological binding partners of the nuclear pool of human
    ACBD6 remain unknown, as does the mechanism by which Chlamydia trachomatis triggers
    exhaustive nuclear export of host ACBD6 during infection.
  boundary: >-
    Nuclear alongside cytosolic localization of ACBD6 in uninfected mammalian cells is
    established by endogenous immunofluorescence and Myc-ACBD6 imaging (PMID:25604091,
    PMID:37951597), whereas all characterized ACBD6 partner enzymes (NMT1, NMT2, LPCAT1)
    were assayed in cytosolic or membrane fractions.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    Clarifying whether nuclear ACBD6 regulates nuclear acyl-CoA signaling, chromatin
    acylation, or post-translational N-myristoylation of nuclear-translocating caspase
    substrates could explain tissue-selective neurological vulnerability in NEDPM.
  resolution: >-
    Perform subcellular fractionation coupled to proximity proteomics (TurboID) of
    nuclear-targeted versus nuclear-excluded ACBD6 in human neural progenitor cells.
  provenance:
  - reference_id: PMID:25604091
    supporting_text: >-
      hACBD6 was exhaustively removed from the nucleus of the infected host cells and was
      translocated into the lumen of the inclusion apparently in association with LDs.
  - reference_id: PMID:37951597
    supporting_text: >-
      Myc-ACBD6 localizes to the nucleus and the cytoplasm in COS-7 cells.
- gap_statement: >-
    Why ACBD6 deficiency reduces bulk [3H]-myristate incorporation in HeLa knockouts and two
    patient fibroblast lines (PMID:32108178, PMID:36551154) yet increases YnMyr click-probe
    incorporation across dozens of substrates in patient fibroblasts and zebrafish/Xenopus
    models (PMID:37951597) is mechanistically unresolved.
  boundary: >-
    In vitro reconstitution proves that ACBD6 shields NMT2 from palmitoyl-CoA competition
    (PMID:26621918, PMID:32108178), and chemical proteomics identifies specific depleted
    neurodevelopmental targets alongside globally elevated YnMyr labeling in vivo
    (PMID:37951597).
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  resolution: >-
    Quantify endogenous N-terminal C14:0 versus off-target C16:0/YnMyr N-acyl occupancy by
    native N-terminomics mass spectrometry (without exogenous alkyne probe) in isogenic
    ACBD6-knockout human neurons and patient fibroblasts.
  provenance:
  - reference_id: PMID:37951597
    supporting_text: >-
      Proteins co- and post-translationally N-myristoylated with YnMyr were detected in
      significantly higher abundance in the patient-derived fibroblasts compared to the
      healthy sibling (Supplementary Fig. 18E), suggesting ACBD6 deficiency provokes
      increased incorporation of YnMyr, potentially through increased N-myristoylation or
      upregulation of lipid salvage pathways leading to increased YnMyr import (Fig. 6D).
suggested_questions:
- question: >-
    Does loss of ACBD6 in patient cells permit promiscuous N-terminal palmitoylation or
    unsaturated N-acylation by NMT1/NMT2 in vivo when the competitive-protection shield is
    absent, and does upregulated acyl-CoA salvage explain the elevated YnMyr click labeling
    reported in PMID:37951597?
  experts:
  - Eric Soupene
  - Frans A. Kuypers
  - Ed Tate
  - Reza Maroofian
- question: >-
    Which kinase phosphorylates human ACBD6 at Ser106 and Ser108 during mitosis and in
    post-mitotic neurons, and does preventing Ser106/Ser108 phosphorylation impair neuronal
    N-myristoylation?
  experts:
  - Eric Soupene
  - Matthias Mann
suggested_experiments:
- hypothesis: >-
    Absence of ACBD6 removes steric/allosteric gating of NMT1/NMT2 in cells, causing both
    selective loss of low-affinity N-myristoylated neurodevelopmental substrates and
    compensatory upregulation of exogenous fatty-acid/YnMyr import via ACSL salvage.
  description: >-
    Measure label-free endogenous N-terminal myristoyl (C14:0) versus palmitoyl (C16:0)
    modification stoichiometry by N-terminomics LC-MS/MS alongside [13C14]-myristate uptake
    flux in isogenic wild-type and ACBD6-knockout human iPSC-derived neurons.
  experiment_type: quantitative N-terminomics mass spectrometry and stable-isotope flux
- hypothesis: >-
    Nuclear ACBD6 buffers intranuclear long-chain acyl-CoA pools independently of cytosolic
    NMT1/NMT2 holoenzyme activation.
  description: >-
    Compare rescue of lipid remodeling, N-myristoylome profiles, and transcriptomes in
    ACBD6-knockout cells reconstituted with NES-tagged (strictly cytosolic) versus
    NLS-tagged (nuclear-enriched) ACBD6 variants.
  experiment_type: compartment-restricted genetic rescue and lipidomics
