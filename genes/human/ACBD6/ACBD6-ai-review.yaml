  title: Affinage mechanistic annotation for ACBD6 (human)
  findings: []
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: >-
      Affinage external LLM synthesis passed automated trust gates (uniprot_accession
