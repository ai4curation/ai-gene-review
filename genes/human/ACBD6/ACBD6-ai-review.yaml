id: Q9BR61
gene_symbol: ACBD6
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  ACBD6 encodes a soluble 282-residue monomeric acyl-CoA-binding protein that pairs an
  N-terminal four-helix acyl-CoA-binding (ACB) domain (residues 42-127) with two C-terminal
  ankyrin (ANK) repeats (residues 191-220 and 224-253) and lacks any transmembrane segment
  or organellar targeting signal. In uninfected human cells ACBD6 localizes to the cytosol
  and nucleus, with no peroxisomal or steady-state lipid-droplet residence. Through its
  N-terminal ACB pocket (including Phe46, Tyr69, Lys73, Lys95, and Tyr114), ACBD6 binds
  medium- and long-chain fatty-acyl-CoA thioesters (C6-C20) with a strong preference for
  unsaturated long-chain species such as oleoyl-CoA (C18:1-CoA), linoleoyl-CoA (C18:2-CoA),
  and arachidonoyl-CoA (C20:4-CoA) over saturated palmitoyl-CoA (C16:0-CoA), while excluding
  unesterified fatty acids. In parallel, its C-terminal ANK-repeat module binds directly to
  the C-terminal catalytic domain of N-myristoyltransferases NMT2 and NMT1, shielding the
  myristoyl-CoA active site from competitive inhibition by abundant cellular palmitoyl-CoA;
  ligand occupancy of the ACB domain acts as a positive allosteric effector of NMT catalysis,
  and phosphorylation of Ser106 and Ser108 in the ACB loop further strengthens acyl-CoA
  binding and NMT activation. Outside the NMT complex, cytosolic ACBD6 buffers free
  acyl-CoAs and regulates acyl-donor transfer to membrane lysophospholipid acyltransferases
  such as LPCAT1 during phosphatidylcholine acyl-chain remodeling (the Lands cycle),
  supporting neutral lipid droplet homeostasis without participating in de novo acyl-CoA
  synthesis or protein S-palmitoylation. During Chlamydia trachomatis infection, host ACBD6
  is depleted from the nucleus, recruited onto lipid droplets, and translocated into the
  bacterial inclusion lumen where it buffers acyl-CoAs for the bacterial acyltransferase
  CT775. Bi-allelic loss-of-function truncations and ANK-domain missense variants in ACBD6
  cause an autosomal recessive neurodevelopmental syndrome with progressive and complex
  movement disorders (NEDPM), accompanied by dysregulated co- and post-translational protein
  N-myristoylation.
