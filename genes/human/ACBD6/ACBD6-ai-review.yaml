      Mutagenesis of conserved residues across the four helices of the human ACBD6 ACB
      domain identified Phe46 in helix alpha1 and Tyr114 in helix alpha4 as the two
      aromatic pocket residues most critical for fatty-acyl-CoA binding.
    supporting_text: >-
      Site-directed mutagenesis of conserved residues in the four α helices of ACBD6
      identified two aromatic residues, Phe46 of αH1 and Tyr114 of αH4, whose substitution
      to alanine had the most influence in acyl-CoA binding ( 27 ).
