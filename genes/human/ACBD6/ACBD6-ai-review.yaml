- id: PMID:36551154
  title: Dual Role of ACBD6 in the Acylation Remodeling of Lipids and Proteins.
  findings:
  - statement: >-
      CRISPR/Cas9 ACBD6-knockout HeLa cells display significantly reduced protein
      N-myristoylation and heightened NMT competitor sensitivity without any defect in
      protein S-palmitoylation or de novo acyl-CoA formation.
    supporting_text: >-
      The absence of the ACBD6/NMT complex in ACBD6.KO cells increased the sensitivity of
      the cells to competitors and significantly reduced myristoylation of proteins.
      Protein palmitoylation was not altered in those cells.
  - statement: >-
      ACBD6 knockout impairs LPCAT-mediated re-acylation of lysophosphatidylcholine into
      phosphatidylcholine and lowers cellular lipid droplet abundance.
    supporting_text: >-
      Whereas the formation of acyl-CoAs was not altered in ACBD6.KO cells, lipid acylation
      processes were significantly reduced. The defect in PC formation from LPC by the
      LPCAT enzymes resulted in reduced lipid droplets content.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text read. Cleanly separates ACBD6's two physiological branches in human knockout
      cells: NMT-mediated protein N-myristoylation and LPCAT-mediated phosphatidylcholine
      acyl-chain remodeling.
- id: PMID:37951597
  title: Bi-allelic ACBD6 variants lead to a neurodevelopmental syndrome with progressive
    and complex movement disorders.
  findings:
  - statement: >-
      Myc-ACBD6 expressed in mammalian COS-7 cells localizes to the cytoplasm and nucleus
      and shows no peroxisomal localization under standard culture conditions, in direct
      contrast to peroxisomal Myc-ACBD5.
    supporting_text: >-
      In addition, expression of a Myc-ACBD6 construct in COS-7 cells confirmed a
      cytoplasmic and nuclear localization of Myc-ACBD633 but did not provide evidence for
      a peroxisomal localization under standard culture conditions (Fig. 6C).
  - statement: >-
      Chemical proteomics with the myristate analog YnMyr in ACBD6-deficient patient
      fibroblasts detected significantly higher abundance of co- and post-translationally
      YnMyr-labeled proteins than in unaffected sibling fibroblasts, pointing to
      dysregulated N-myristoylation specificity or compensatory lipid-salvage uptake rather
      than uniform loss of labeling.
    supporting_text: >-
      Proteins co- and post-translationally N-myristoylated with YnMyr were detected in
      significantly higher abundance in the patient-derived fibroblasts compared to the
      healthy sibling (Supplementary Fig. 18E), suggesting ACBD6 deficiency provokes
      increased incorporation of YnMyr, potentially through increased N-myristoylation or
      upregulation of lipid salvage pathways leading to increased YnMyr import (Fig. 6D).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Landmark clinical, cellular, and cross-species zebrafish/Xenopus study of 45 affected
      individuals from 28 families with bi-allelic ACBD6 variants (full text read). Confirms
      cytosolic/nuclear (non-peroxisomal) localization, unsaturated acyl-CoA binding, and
      substrate-specific dysregulation of the N-myristoylome.
