    - reference_id: PMID:30642881
      supporting_text: >-
        The phosphorylation of two serine residues of the acyl-CoA binding domain of human
        ACBD6 improves ligand binding capacity, prevents competition by unbound acyl-CoAs,
        and further enhances the activity of NMT.
    - reference_id: PMID:32108178
      supporting_text: >-
        Fusion of the ANK module to the acyl-CoA binding protein ACBD1 was sufficient to
        confer the NMT-stimulatory property of ACBD6 to the chimera.
    - reference_id: file:human/ACBD6/ACBD6-deep-research-affinage.md
      supporting_text: >-
        Its ankyrin-repeat (ANK) domain is necessary and sufficient for direct interaction
        with N-myristoyltransferases NMT1 and NMT2, stimulating their catalytic activity and
        protecting them from competitive inhibition by abundant acyl-CoAs such as
        palmitoyl-CoA; the acyl-CoA-binding (ACB) domain is dispensable for this protection
        but acts as a positive allosteric effector when loaded with acyl-CoA, and grafting
        the ANK module onto ACBD1 confers NMT-stimulatory activity to the chimera
        [PMID:26621918, PMID:32108178].
