- id: PMID:12650615
  title: Membrane localization of Arabidopsis acyl-CoA binding protein ACBP2.
  full_text_unavailable: true
  findings:
  - statement: >-
      Arabidopsis Class-II ACBPs ACBP1 and ACBP2 localize to the endoplasmic reticulum and
      plasma membrane strictly via a plant-specific N-terminal transmembrane domain,
      explaining why PAINT node PTN001191022 over-propagates ER and plasma-membrane IBAs
      onto soluble transmembrane-less human ACBD6.
    supporting_text: >-
      By means of particle gene bombardment, ACBP2-GFP and ACBP1-GFP fusion proteins were
      observed transiently expressed at the plasma membrane and at the endoplasmic reticulum
      in onion epidermal cells. GFP fusions with deletion derivatives of ACBPI or ACBP2
      lacking the transmembrane domain were impaired in membrane targeting.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Plant ACBP1/ACBP2 localization study (cached abstract-only) cited here strictly to
      document the N-terminal transmembrane requirement of the Arabidopsis PAINT seeds
      behind the false ER and plasma-membrane IBA rows on Q9BR61.
- id: PMID:18268358
  title: Characterization of an acyl-coenzyme A binding protein predominantly expressed
    in human primitive progenitor cells.
  findings:
  - statement: >-
      Human ACBD6 is a soluble modular 282-aa monomer with an N-terminal acyl-CoA-binding
      domain (residues 42-125) and two C-terminal ankyrin repeats, enriched in primitive
      hematopoietic progenitor cells, placenta, and spleen.
    supporting_text: >-
      Human acyl-coenzyme A binding domain-containing member 6 (ACBD6) is a modular protein
      that carries an acyl-CoA binding domain at its N terminus and two ankyrin motifs at
      its C terminus.
  - statement: >-
      Purified human ACBD6 binds long-chain fatty-acyl-CoAs with strong selectivity for
      unsaturated oleoyl-CoA (C18:1-CoA) and arachidonoyl-CoA (C20:4-CoA) over palmitoyl-CoA
      (C16:0-CoA), and deletion of both C-terminal ankyrin repeats does not impair
      acyl-CoA binding.
    supporting_text: >-
      ACBD6 binds long-chain acyl-CoAs with a strong preference for unsaturated, C18:1-CoA
      and C20:4-CoA, over saturated, C16:0-CoA, acyl species.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Founding biochemical characterization of human ACBD6 (full text read; omitted by
      Affinage). Establishes monomeric soluble state, domain sufficiency of the N-terminal
      ACB module for acyl-CoA binding, and selectivity for unsaturated long-chain acyl-CoAs.
- id: PMID:20068231
  title: Quantitative phosphoproteomics reveals widespread full phosphorylation site
    occupancy during mitosis.
  full_text_unavailable: true
  findings:
  - statement: >-
      Quantitative mitotic phosphoproteomics in human cells established widespread
      high-occupancy mitotic phosphorylation across proteome sites, providing the in vivo
      human phosphoproteomic evidence curated by UniProt for ACBD6 Ser106 phosphorylation.
    supporting_text: >-
      We determined site-specific stoichiometry of more than 5000 sites and found that most
      of the up-regulated sites phosphorylated by cyclin-dependent kinase 1 (CDK1) or CDK2
      were almost fully phosphorylated in mitotic cells.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Proteome-wide mitotic phosphoproteomics study (cached abstract-only; ACBD6 Ser106 is
      in supplementary tables and curated in Q9BR61 FT MOD_RES 106). Directly motivated the
      functional Ser106/Ser108 phosphoprotein study in PMID:30642881.
- id: PMID:25604091
  title: Remodeling of host phosphatidylcholine by Chlamydia acyltransferase is regulated
    by acyl-CoA binding protein ACBD6 associated with lipid droplets.
  findings:
  - statement: >-
      In uninfected human cells ACBD6 is present in the nucleus and cytosol and does not
      associate with lipid droplets, whereas Chlamydia trachomatis infection exhaustively
      depletes ACBD6 from the host nucleus and recruits it onto lipid droplets translocating
      into the bacterial inclusion lumen.
    supporting_text: >-
      hACBD6 was exhaustively removed from the nucleus of the infected host cells and was
      translocated into the lumen of the inclusion apparently in association with LDs.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text read. Crucial for distinguishing uninfected steady-state localization
      (cytosol and nucleus, explicitly NOT lipid droplets) from pathogen-hijacked lipid
      droplet and bacterial inclusion recruitment during C. trachomatis infection.
- id: PMID:26290611
  title: Ligand binding to the ACBD6 protein regulates the acyl-CoA transferase reactions
    in membranes.
  full_text_unavailable: true
  findings:
  - statement: >-
      Human ACBD6 binds C6-C20 acyl-CoAs as a monomer without ligand-induced dimerization
      and controls the rate of lysophosphatidylcholine re-acylation into phosphatidylcholine
      by limiting acyl-CoA transfer to membrane LPCAT1.
    supporting_text: >-
      The acylation rate of lysophosphatidylcholine into PC catalyzed by the red cell
      lysophosphatidylcholine-acyltransferase 1 protein was limited by the transfer of the
      acyl-CoA substrate from ACBD6 to the acyltransferase enzyme.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Cached abstract-only; abstract directly states C6-C20 chain-length range, absence of
      ligand-induced dimerization, and rate-limiting acyl-CoA transfer to erythroid LPCAT1
      during phosphatidylcholine remodeling.
- id: PMID:26621918
  title: Association of NMT2 with the acyl-CoA carrier ACBD6 protects the N-myristoyltransferase
    reaction from palmitoyl-CoA.
  findings:
  - statement: >-
      ACBD6 physically interacts via its C-terminal domain with human NMT2 (stronger) and
      NMT1 in human cells, stimulating NMT2 myristoyltransferase catalysis and protecting
      the active site from competitive inhibition by palmitoyl-CoA (C16:0-CoA).
    supporting_text: >-
      We determined that the acyl-CoA binding protein, acyl-CoA binding domain (ACBD)6,
      stimulated the NMT reaction of NMT2. This stimulatory effect required interaction
      between ACBD6 and NMT2, and was enhanced by binding of ACBD6 to its ligand, C 18:2
      -CoA. ACBD6 also interacted with the second human NMT enzyme, NMT1.
  - statement: >-
      Alanine substitution of Tyr114 (Y114A) or the conserved pocket motif (FKKY-AAAA) in
      the N-terminal ACB domain abolishes acyl-CoA-dependent stimulation of NMT2.
    supporting_text: >-
      Compared with ACBD6, two ACBD6 mutant forms, Y 114 A and FKKY-AAAA (dubbed FKKY mut
      ), with defects in acyl-CoA binding ( 19 ) failed to stimulate the reaction in the
      presence of C 14 -CoA, thus acyl-CoA binding of ACBD6 is required for the stimulatory
      effect on NMT2.
    residue_mappings:
    - as_reported:
        accession: UniProtKB:Q9BR61
        position: 114
        residue: Y
        sequence_version: 1
      note: Tyr114 in helix alpha4 of canonical 282-aa human ACBD6 (Q9BR61 SV=1).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Primary mechanistic study (full text read) establishing physical interaction of human
      ACBD6 with NMT2 and NMT1, competitive protection from palmitoyl-CoA, and requirement
      for Tyr114-mediated acyl-CoA binding in NMT stimulation.
