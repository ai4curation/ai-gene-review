- id: PMID:32108178
  title: 'Requirement of the acyl-CoA carrier ACBD6 in myristoylation of proteins:
    Activation by ligand binding and protein interaction.'
  findings:
  - statement: >-
      The C-terminal ANK module of ACBD6 is necessary and sufficient for NMT2 binding and
      competitor protection, and fusing the ANK module to ACBD1 confers NMT-stimulatory
      activity onto the chimera, while acyl-CoA bound to the ACB domain acts as a positive
      allosteric effector.
    supporting_text: >-
      Interaction of ANK with human NMT2 was necessary and sufficient to provide
      protection. Fusion of the ANK module to the acyl-CoA binding protein ACBD1 was
      sufficient to confer the NMT-stimulatory property of ACBD6 to the chimera.
  - statement: >-
      Primary skin fibroblasts from two unrelated individuals with neurodevelopmental
      disorder carrying homozygous loss-of-function ACBD6 mutations showed reduced bulk
      protein N-myristoylation and hypersensitivity to NMT competitor analogs.
    supporting_text: >-
      Skin-derived fibroblasts of two unrelated individuals with neurodevelopmental
      disorder and carrying loss of function mutations in the ACBD6 gene were deficient in
      protein N-myristoylation.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text read. Dissects modular division of labor between the ANK (NMT docking and
      protection) and ACB (allosteric ligand effector) domains and provides the first
      patient-fibroblast evidence linking ACBD6 loss to defective N-myristoylation.
