gene: DBT
accession: P11182
scope: Authored source guide to the 42 preserved historical assertions; links and raw identifiers are
  navigation to evidence, not independent experimental proof.
curation_date: '2026-10-16'
biology:
  core: One integrated E2 acyltransferase unit performs the CoA-transfer step in all three branched-chain
    substrate pathways. E1 decarboxylation and E3 NAD reduction remain distinct component activities.
  context: PPM1K docking, Parkin association and nucleoid localization are retained with their source-specific
    assay limits; no new biological-process annotation is proposed.
