functional_isoforms:
- id: DBT_MATURE_E2
  name: Mature mitochondrial E2 chain
  type: CLEAVAGE_PRODUCT
  maps_to:
  - type: UNIPROT_CHAIN
    ids:
    - PRO_0000020489
    residues: 62-482
  description: Mature mitochondrial E2 chain mapped to the official PRO_0000020489 feature at residues
    62–482 (421 residues). The transit-peptide boundary is prediction-based. The 2002 native lipoyl-domain
    segment maps to residues 62–145, and the 2023 recombinant interaction construct spans 62–482. Construct
    mapping supports product interpretation without independently determining the endogenous cleavage
    site; the historical coordinate discrepancy is detailed in the primary-source note.
suggested_questions:
- question: How do the reported human E2 N-terminal sequence and historical UniProt reference coordinates
    map onto the current precursor, and is Gly62 the dominant endogenous mature N terminus?
  experts:
  - Mitochondrial protein processing specialists
- question: What fraction of native human DBT associates with nucleoids or membrane-proximal assemblies,
    and does this association affect local metabolism without conferring a DNA-maintenance activity?
  experts:
  - Mitochondrial nucleoid and branched-chain metabolism specialists
suggested_experiments:
- description: Map endogenous human DBT N termini by targeted N-terminomics and peptide sequencing, comparing
    the 482-residue precursor with the predicted 62–482 chain.
- description: Quantify endogenous DBT distribution between matrix, membrane-associated and nucleoid fractions
    with orthogonal fractionation, cross-linking and DNase controls, while measuring BCKDH activity.
