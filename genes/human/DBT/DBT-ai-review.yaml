id: P11182
gene_symbol: DBT
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: DBT encodes the lipoylated E2 acyltransferase of the mitochondrial branched-chain alpha-ketoacid
  dehydrogenase complex. It transfers the branched-chain acyl groups derived from leucine, isoleucine
  and valine from its lipoyl arm to coenzyme A. Its cubic 24-subunit core organizes the other catalytic
  components, while its mobile domain carries the lipoyl cofactor on Lys105 in precursor numbering and
  channels intermediates between active sites. The lipoyl-domain linker also docks regulatory proteins.
  The precursor is imported into mitochondria and processed to a mature matrix enzyme. Pathogenic DBT
  variants can impair complex activity and cause maple syrup urine disease.
