core_functions:
- description: Neural plate border specifier (amniote Pax3/7 border factor). Expressed in the border region from gastrulation,
    PAX7 is required for crest specifier expression and, with Msx1/2, directly activates FoxD3 crest enhancers (with Ets1
    cranially and Zic1 in the trunk); it contributes mainly to cranial crest.
