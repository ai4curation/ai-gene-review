suggested_questions:
- question: PAX7 directly occupies and is required for the FoxD3 NC1 crest enhancer (chick ChIP), but no gain-of-function
    sufficiency for crest induction has been shown. Is direct binding at one specifier enhancer enough to annotate GO:0014034
    neural crest cell fate commitment, as frog Pax3 carries from Pax3+Zic1 sufficiency data, or should border factors stay
    at GO:0014029?
- question: Frog uses Pax3 and chick uses Pax7 as the leading border factor, while mouse shows Pax3/Pax7 redundancy. Is the
    border role of the Pax3/7 pair partitioned differently between lineages after the vertebrate duplication of the single
    amphioxus Pax3/7, and should GO coverage treat the two paralogs symmetrically?
- question: Basch et al. 2006 and Simoes-Costa et al. 2012 (chick Pax7) are uncurated. Chick PAX7 (O42349, unreviewed) carries
    only ISS terms. Should these be curated directly (IMP/IDA) on a chick PAX7 entry?
- question: Mouse Pax7-null cephalic crest phenotype (PMID:8631261) is curated to embryonic skeletal system development (GO:0048706)
    rather than to a neural crest term; is that the intended representation?
suggested_experiments:
- description: CUT&RUN for endogenous PAX7 in human pluripotent stem cell-derived neural plate border/crest cultures, to test
    whether the chick FoxD3 NC1/NC2 inputs are conserved at the human FOXD3 locus and whether PAX7 co-occupies sites with
    ZIC1, MSX1 and TFAP2A.
- description: 'Gain-of-function test of sufficiency: ectopic PAX7 (with or without ZIC1) in chick non-neural ectoderm or
    human ectodermal explants, scoring SNAI2, FOXD3 and SOX10, to decide whether PAX7 induces crest fate like frog Pax3+Zic1.'
- description: Test whether amphioxus Pax3/7 can substitute for Pax7 in the chick NC1 enhancer assay, to separate protein
    evolution from cis-regulatory evolution of the border-to-crest link.
