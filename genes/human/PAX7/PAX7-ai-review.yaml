id: P23759
gene_symbol: PAX7
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Paired box protein Pax-7 is a nuclear transcription factor of the Pax3/7 subgroup. It binds DNA through an N-terminal
  paired domain and a paired-type homeodomain, as a monomer or as a heterodimer with its paralog PAX3, and mainly activates
  its targets, acting as a pioneer factor that can open closed enhancers. In the early embryo, PAX7 is a neural plate border
  specifier. It is expressed in the border region from gastrulation, before neural crest specifier genes. It is required for
  their expression and, with MSX1/2, directly activates FOXD3 enhancers, together with ETS1 cranially and ZIC1 in the trunk.
  Pax7-expressing cells contribute mainly to cranial neural crest, and its loss in mouse disrupts crest-derived facial structures.
  PAX7 is also expressed in dorsal neural tube progenitors, where, redundantly with PAX3, it restricts ventral neuronal identity.
  In skeletal muscle, PAX7 specifies and maintains satellite (muscle stem) cells. It is required for their formation, self-renewal
  and expansion, and hence for muscle regeneration, and activates targets such as MYF5 and ID3. Biallelic loss-of-function
  variants cause a congenital myopathy with satellite cell exhaustion, and the PAX7-FOXO1 fusion from t(1;13) drives alveolar
  rhabdomyosarcoma. Pax3/7 expression at the neural plate border is conserved in amphioxus, so PAX7's border role belongs
  to an ancestral chordate layer of the neural crest regulatory network.
