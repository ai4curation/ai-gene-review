- term:
    id: GO:0014029
    label: neural crest formation
  evidence_type: ISS
  original_reference_id: PMID:16688176
  review:
    summary: Pax7 is a neural plate border specifier in amniotes. In chick it marks the gastrula epiblast region specified
      to form crest. It is required for Slug, Sox9, Sox10 and HNK-1, and with Msx1/2 it binds and activates the FoxD3 NC1/NC2
      enhancers directly. Pax7-null mice have cephalic crest defects.
    action: NEW
    reason: 'Human PAX7 has no neural crest term. The combined evidence places PAX7 in the border layer. It is expressed at
      the border before crest specifiers and is required for their expression (chick translation-blocking morpholinos). It
      directly occupies a specifier enhancer (FoxD3 NC1, ChIP), and mouse Pax7-/- shows cephalic crest derivative dysgenesis,
      with Pax3 redundancy. Lineage tracing shows Pax7 descendants contribute mainly to cranial crest. Term level: GO:0014029,
      following the border-gene convention used for frog pax3-a, zic1, MSX1 and TFAP2A. GO:0014034 commitment was not added.
      Frog Pax3 earned it from Pax3+Zic1 sufficiency to induce crest, and no equivalent sufficiency is shown for Pax7. Pax7+
      border cells are not all crest-fated, and its effects on Sox10 are indirect. GO:0014036 is for the downstream specifiers.
      Participation: PAX7 does part of the work, as a DNA-binding activator at specifier enhancers. Comparator (QuickGO 2026-10-08):
      no Pax7 in any species carries an NC-branch term. Chick PAX7 (O42349) has only ISS muscle/neural-tube terms (Basch 2006
      is uncurated), mouse Pax7''s crest phenotype paper was curated to GO:0048706, and same-layer frog pax3 and zic1 carry
      GO:0014029 by IMP. This is a coverage gap, not a convention. ISS, because the experiments are in chick and mouse.'
    additional_reference_ids:
    - PMID:23284303
    - PMID:8631261
    - PMID:22848431
    - PMID:18562679
    supported_by:
    - *id010
    - &id012
      reference_id: PMID:16688176
      supporting_text: In chicken embryos, Pax7 is required for neural crest formation in vivo, because blocking its translation
        inhibits expression of the neural crest markers Slug, Sox9, Sox10 and HNK-1.
    - *id002
    - *id004
    - *id006
    - reference_id: PMID:22848431
      supporting_text: we found a higher contribution of Pax7 descendants in the cranial compared to either cardiac or trunk
        neural crest
    - &id013
      reference_id: PMID:18562679
      supporting_text: Ectodermal Zic and Pax3/7 expression marks the neural plate border, and amphioxus SoxB1-a expression
        labels the entire neural plate.
- term:
    id: GO:0001228
    label: DNA-binding transcription activator activity, RNA polymerase II-specific
  evidence_type: ISS
  original_reference_id: PMID:23284303
  review:
    summary: 'Pax7 binds and activates cis-regulatory elements: the FoxD3 NC1 enhancer in chick crest (ChIP, knockdown abolishes
      enhancer activity) and melanotrope enhancers that it opens as a pioneer in mouse pituitary.'
    action: NEW
    reason: 'The existing MF rows stop at GO:0000981. In every well-characterised context PAX7 acts as an activator of its
      direct targets. In chick, Pax7 knockdown abolishes NC1/NC2 enhancer activity and endogenous FoxD3, and Pax7 occupies
      NC1 in vivo. In mouse pituitary, Pax7 opens and activates a melanotrope enhancer repertoire. This matches the GO:0001228
      added to the frog Pax3 paralog (pax3-a, IDA). Comparator: among Pax3/7 proteins none carries GO:0001228 in GOA (they
      sit at GO:0000981); the pax3-a review added it as NEW. ISS from chick/mouse orthologs.'
    additional_reference_ids:
    - PMID:29358650
    supported_by:
    - *id002
    - *id004
    - *id005
    - *id001
- term:
    id: GO:0043403
    label: skeletal muscle tissue regeneration
  evidence_type: ISS
  original_reference_id: PMID:24065826
  review:
    summary: Pax7 is required in adult satellite cells for their expansion and for muscle regeneration; human PAX7 deficiency
      exhausts the satellite cell pool.
    action: NEW
    reason: Mouse Pax7 (P47239) carries GO:0043403 by IMP (PMID:9608680), but this did not project to human. Adult conditional
      deletion causes satellite cell cell-cycle arrest and a profound regeneration deficit, and PAX7 myopathy patients show
      satellite cell exhaustion. PAX7 does the work inside the regenerating stem cells as their identity and expansion transcription
      factor. The more specific GO:0014834 (satellite cell maintenance in regeneration) was considered, but no Pax7 in any
      species carries it; its carriers are niche/signalling genes (Wnt7a, Fzd7, Igf1, Ezh2, Selenon). So the mouse convention
      was followed.
    additional_reference_ids:
    - PMID:31092906
    supported_by:
    - &id014
      reference_id: PMID:24065826
      supporting_text: Here, we demonstrate that Pax7 is an absolute requirement for satellite cell function in adult skeletal
        muscle.
    - reference_id: PMID:24065826
      supporting_text: Maintenance of Pax7 deletion through continuous tamoxifen administration prevented regrowth of Pax7-expressing
        satellite cells and a profound muscle regeneration deficit that resembles the phenotype of skeletal muscle following
        genetically engineered ablation of satellite cells.
    - *id008
