    LMTK2 phosphorylates PP1C at Thr320 and, in human airway epithelial cells, CFTR
    at Ser737; purified LMTK2 also phosphorylates serine/threonine residues in other
    protein substrates. Its active site operates on the cytoplasmic face of endosomal
    membranes.
