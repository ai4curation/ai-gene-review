- id: PMID:38191649
  title: A revised nomenclature for the lemur family of protein kinases.
  full_text_unavailable: false
  findings:
  - statement: >-
      The field consensus recognizes LMTK proteins as serine/threonine rather than
      tyrosine kinases.
    supporting_text: >-
      However, experimental data conducted by several laboratories independently
      have proved that LMTK1, LMTK2 and LMTK3 solely phosphorylate serine and
      threonine residues and do not target tyrosine residue
    reference_section_type: DISCUSSION
  - statement: >-
      The consensus connects the historical KPI-2, CPRK, BREK, AATYK2, KIAA1079, and
      LMR2 names to LMTK2.
    supporting_text: >-
      For example, LMTK2 is a membrane-anchored serine/threonine kinase formerly
      known as kinase/phosphatase/inhibitor-2 (KPI-2), Cdk5/p35-regulated kinase
      (Cprk), brain-enriched kinase (BREK), apoptosis-associated tyrosine kinase-2
      (AATYK2), KIAA1079 and LMR2
    reference_section_type: DISCUSSION
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Current expert nomenclature review and useful alias reconciliation. Use primary
      experiments for catalytic and mechanistic assertions.
