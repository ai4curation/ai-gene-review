id: Q8IWU2
gene_symbol: LMTK2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  LMTK2 is a 1,503-amino-acid, two-pass integral membrane serine/threonine
  protein kinase whose amino terminus, carboxyl-terminal tail, and kinase active
  site face the cytoplasm. It functions on early and Rab11-positive recycling
  endosomes. LMTK2 docks protein phosphatase 1 catalytic subunits and associates
  with PPP1R2/inhibitor-2, phosphorylating PP1C at Thr320 to inhibit phosphatase
  activity. Through direct binding to unconventional myosin VI/MYO6, it supports
  cargo delivery from early endosomes to the endocytic recycling compartment.
  In human airway epithelial cells, LMTK2 also binds and phosphorylates CFTR at
  Ser737 and promotes CFTR endocytosis. Kinesin-linked axonal transport is
  supported in orthologous mouse and rat neuronal models, whereas TGF-beta/Smad
  signaling is supported in human airway epithelium; neither is established as a
  universal LMTK2 function.
