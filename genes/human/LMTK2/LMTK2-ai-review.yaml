- id: PMID:18029400
  title: Myosin VI and its interacting protein LMTK2 regulate tubule formation and
    transport to the endocytic recycling compartment.
  full_text_unavailable: false
  findings:
  - statement: LMTK2 directly binds the WWY site in the unconventional myosin-VI tail.
    supporting_text: >-
      In this paper we have identified a new myosin-VI-binding partner, lemur tyrosine
      kinase 2 (LMTK2), which is the first transmembrane protein and kinase that
      directly binds to myosin VI. LMTK2 binds to the WWY site in the C-terminal
      myosin VI tail, the same site as the endocytic adaptor protein Dab2.
    reference_section_type: ABSTRACT
  - statement: >-
      LMTK2 depletion blocks transferrin-receptor delivery from early endosomes to
      the recycling compartment.
    supporting_text: >-
      When either myosin VI or LMTK2 is depleted by siRNAs, the transferrin receptor
      (TfR) is trapped in swollen endosomes and tubule formation in the endocytic
      recycling pathway is dramatically reduced, showing that both proteins are
      required for the transport of cargo, such as the TfR, from early endosomes to
      the endocytic recycling compartment.
    reference_section_type: ABSTRACT
  - statement: >-
      LMTK2 localizes on early endosomes and the Rab11-positive recycling compartment.
    supporting_text: >-
      Double labelling experiments show that LMTK2 is present on a subset of early
      endosomes as revealed by colocalisation with Rab5 and EEA1 (Fig. 4, d-j) and
      also associated with the Rab11-positive endocytic recycling compartment
      (Fig. 4, k-m).
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Direct human-cell trafficking and interaction evidence. The paper supports
      unconventional MYO6/myosin VI, Q9UM54. GOA's P13533 WITH/FROM is MYH6 and is
      a source-entity miscitation, not evidence against the GO term.
