proposed_new_terms: []
suggested_questions:
- question: >-
    Which direct LMTK2 substrate or noncatalytic interaction couples the LMTK2-MYO6
    module to endosomal tubule formation and general receptor-cargo recycling beyond
    the demonstrated airway-epithelial CFTR substrate?
- question: >-
    Which sequence signal and cytosolic targeting factor deliver ER-exported LMTK2 to
    early and recycling endosome membranes, and is this targeting regulated by PP1C,
    MYO6, or phosphorylation of LMTK2 itself?
- question: >-
    How broadly do the CFTR-endocytosis, KLC1/2-dependent axonal-transport, and
    TGF-beta/Smad signaling mechanisms operate across human tissues, and which are
    physiological cargo-specific roles rather than shared functions of LMTK2?
suggested_experiments:
- hypothesis: >-
    LMTK2 kinase activity and its PP1C- and MYO6-binding interfaces make separable
    contributions to early-to-recycling-endosome transport.
  description: >-
    Introduce an acute endogenous LMTK2 degron in human cells and rescue with wild-type,
    kinase-dead, PP1C-docking-motif, or MYO6-binding-region mutants. Quantify transferrin
    receptor flux, Rab11/EHD tubule dynamics, and endosome morphology by pulse-chase and
    live imaging, then couple each rescue to phosphoproteomics to identify candidate
    trafficking substrates.
  experiment_type: >-
    endogenous acute-depletion, separation-of-function rescue, live-cell trafficking,
    and phosphoproteomics
- hypothesis: >-
    A post-ER targeting factor recognizes LMTK2 downstream of its di-acidic export motif
    and is required for stable delivery to early and recycling endosome membranes.
  description: >-
    Compare endogenous-proximity labeling and quantitative interactomes of wild-type
    LMTK2 with an ER-export-motif mutant and endosome-targeting-defective truncations;
    validate candidate targeting factors by knockout, rescue, and organelle-resolved
    trafficking assays.
  experiment_type: proximity labeling, domain mapping, and organelle trafficking
- hypothesis: >-
    LMTK2-dependent CFTR Ser737 phosphorylation is sufficient to tune CFTR endocytosis
    and surface stability in differentiated human airway epithelium.
  description: >-
    Generate isogenic airway organoids carrying endogenous CFTR-S737A together with
    LMTK2 knockout or kinase-dead knock-in, then measure CFTR internalization,
    recycling, apical surface lifetime, and chloride transport with wild-type rescue.
  experiment_type: endogenous genome editing and airway-organoid transport physiology
knowledge_gaps:
- gap_statement: >-
    The mechanism that targets newly synthesized LMTK2 from the endoplasmic reticulum
    specifically to early and recycling endosome membranes remains unknown.
  boundary: >-
    LMTK2 is established as a two-pass integral membrane protein with a cytoplasmic
    kinase domain, and a di-acidic motif is required for ER export. What is unresolved
    is the post-ER signal, adaptor, or membrane interaction that specifies its terminal
    endosomal destination.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    Endosomal targeting is prerequisite for the MYO6-linked recycling function and for
    placing LMTK2 near cargo-specific substrates such as CFTR.
  resolution: >-
    Identify proteins or lipids that bind the cytoplasmic tail or transmembrane region
    after ER exit, and test candidate factors with endogenous localization and
    recycling assays using targeting-defective separation-of-function alleles.
  provenance:
  - reference_id: PMID:23114966
    supporting_text: >-
      Precisely what targets LMTK2 to organelles of the endosomal and recycling system
      exclusively is not known.
  - reference_id: PMID:26559041
    supporting_text: >-
      Subsequently, it is likely that other, as yet undetermined, signals will be
      required for the final targeting of LMTK2 to its final endosomal destination.
- gap_statement: >-
    The direct effector mechanism by which the LMTK2-MYO6 module drives endosomal
    tubule formation and broad cargo movement is unresolved; MYO6 binding is proven,
    but MYO6 has not been shown to be an LMTK2 substrate, and known PP1C and CFTR
    phosphorylation events do not yet explain the general recycling phenotype.
  boundary: >-
    Direct LMTK2-MYO6 binding, early/recycling-endosome localization, and knockdown
    defects in transferrin-receptor delivery and tubulation are firmly established.
    PP1C Thr320 and CFTR Ser737 are direct substrates in defined contexts.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    Resolving this link would distinguish catalytic signaling from motor recruitment
    and explain how one membrane kinase controls the physical remodeling of the
    recycling compartment.
  resolution: >-
    Use kinase-dead, PP1C-docking-deficient, and MYO6-binding-deficient endogenous
    alleles with live tubulation assays, cargo flux, and compartment-resolved
    phosphoproteomics; test candidate substrates by phosphosite knock-in rescue.
  provenance:
  - reference_id: PMID:18029400
    supporting_text: >-
      Whether myosin VI and LMTK2 are involved in the formation of transport vesicles
      or tubules or whether they play a role in recruitment of proteins/cargo into
      transport carriers or whether myosin VI transports LMTK2 to its target proteins
