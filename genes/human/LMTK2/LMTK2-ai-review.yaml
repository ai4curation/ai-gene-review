- id: PMID:12393858
  title: A novel transmembrane Ser/Thr kinase complexes with protein phosphatase-1
    and inhibitor-2.
  full_text_unavailable: true
  findings:
  - statement: >-
      KPI-2/LMTK2 is a membrane-targeted 1,503-residue kinase with two predicted
      N-terminal helices.
    supporting_text: >-
      KPI-2 is a 1503-residue protein with two predicted transmembrane helices at the
      N terminus, a kinase domain, followed by a C-terminal domain. The transmembrane
      helices were sufficient for targeting proteins to the membrane.
    reference_section_type: ABSTRACT
  - statement: Human KPI-2/LMTK2 displays serine/threonine kinase activity.
    supporting_text: >-
      However, it only exhibited serine/threonine kinase activity in
      autophosphorylation reactions or with added substrates.
    reference_section_type: ABSTRACT
  - statement: >-
      LMTK2 binds and inhibits PP1C through phosphorylation of PP1C Thr320 and also
      binds inhibitor-2.
    supporting_text: >-
      KPI-2 kinase domain phosphorylated protein phosphatase-1 (PP1C) at Thr(320),
      which attenuated PP1C activity. KPI-2 C-terminal domain directly associated
      with PP1C, and this required a VTF motif. Inh2 associated with KPI-2 C-terminal
      domain with and without PP1C.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Foundational direct human biochemical evidence. The abstract does not identify
      the PP1C catalytic isoform, so the GOA/IntAct and UniProt records are needed to
      resolve P36873 specifically. Abstract only.
- id: PMID:12832520
  title: Identification of a novel, membrane-associated neuronal kinase, cyclin-dependent
    kinase 5/p35-regulated kinase.
  full_text_unavailable: false
  findings:
  - statement: CPRK/LMTK2 binds CDK5R1/p35 and colocalizes with it at the Golgi.
    supporting_text: >-
      Cprk interacts with p35 in the yeast-two hybrid system, binds to p35 in
      glutathione S-transferase fusion pull-down assays, and colocalizes with p35 in
      cultured neurons and transfected cells. In these cells, cprk is present with
      p35 in the Golgi apparatus.
    reference_section_type: ABSTRACT
  - statement: CDK5/p35 phosphorylates LMTK2 and inhibits its kinase activity.
    supporting_text: >-
      Cprk displays catalytic activity in in vitro kinase assays and is itself
      phosphorylated by cdk5/p35. Cdk5/p35 inhibits cprk activity.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Direct support for the p35 interaction, Golgi localization, and CDK5/p35
      regulation. Its dual-specificity description was predictive, not a substrate
      specificity result, and is superseded by direct serine/threonine assays.
- id: PMID:16887929
  title: Peptide microarray analysis of substrate specificity of the transmembrane
    Ser/Thr kinase KPI-2 reveals reactivity with cystic fibrosis transmembrane conductance
    regulator and phosphorylase.
  full_text_unavailable: true
  findings:
  - statement: Recombinant human KPI-2/LMTK2 is strictly serine/threonine-directed.
    supporting_text: >-
      We found that KPI-2 is strictly a Ser/Thr kinase that reacts with Ser either
      preceded by or followed by Pro residues but unlike other Pro-directed kinases
      does not strictly require an adjacent Pro residue.
    reference_section_type: ABSTRACT
  - statement: >-
      CFTR Ser737 and the recombinant CFTR R domain are preferred in-vitro substrates.
    supporting_text: >-
      The most reactive peptide in the library corresponds to Ser-737 of cystic
      fibrosis transmembrane conductance regulator, and the recombinant R domain of
      cystic fibrosis transmembrane conductance regulator was a preferred substrate.
