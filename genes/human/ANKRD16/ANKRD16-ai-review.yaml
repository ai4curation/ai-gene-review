id: Q6P6B7
gene_symbol: ANKRD16
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ANKRD16 (ankyrin repeat domain-containing 16) is a vertebrate-specific protein of nine ankyrin
  repeats that safeguards the fidelity of alanyl-tRNA synthetase (AlaRS, AARS1). It binds the AlaRS catalytic
  domain directly and accepts serine that AlaRS has misactivated onto its own lysine side chains (Lys102,
  Lys135 and Lys165 in mouse, all conserved in human), so the seryl-adenylate is consumed before serine
  can be charged onto tRNA(Ala). It acts before tRNA charging and does not deacylate mischarged Ser-tRNA(Ala).
  In mice, loss of ANKRD16 alone is tolerated, but in an AlaRS editing-defective background it causes
  protein aggregation and neuron loss, and complete loss in that background is embryonic lethal. It is
  cytoplasmic and also nuclear.
