- term:
    id: GO:0006400
    label: tRNA modification
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:A2AS55
  - ensembl:ENSMUSP00000052056
  review:
    summary: tRNA modification (IEA, from the mouse IDA). ANKRD16 does not alter tRNA nucleotides; it
      prevents serine from reaching tRNA(Ala) by accepting misactivated serine from AlaRS. The process
      is translational-fidelity editing of aminoacyl-tRNA formation.
    action: MODIFY
    reason: GO:0006400 is the covalent alteration of tRNA nucleotides. ANKRD16 instead acts at the aminoacylation
      step [PMID:29769718 "Serine that is misactivated by AlaRS is captured by the lysine side chains
      of ANKRD16, which prevents the charging of serine adenylates to tRNAAla and precludes serine misincorporation
      in nascent peptides."] [PMID:29769718 "Thus, ANKRD16 acts prior to formation of mischarged tRNA
      to enhance translational fidelity."] It does not act on the charged tRNA [PMID:29769718 "ANKRD16
      had no effect on subsequent steps of tRNA mischarging including deacylation of mischarged Ser-tRNAAla"]
      GO:0106074 aminoacyl-tRNA metabolism involved in translational fidelity covers processes that keep
      tRNAs charged with the correct amino acid, and ANKRD16 does part of that work itself [PMID:29769718
      "These results suggest that ANKRD16 functions as an alternative to water or tRNAAla, accepting misactivated
      serine."]. UniProt's function text says ANKRD16 promotes [file:human/ANKRD16/ANKRD16-uniprot.txt
      "tRNA(Ala) by promoting the hydrolysis of Ser-mischarged tRNA(Ala),"], but the paper found no effect
      of ANKRD16 on that step; the hydrolysis it stimulates is serine-dependent ATP hydrolysis before
      charging.
    proposed_replacement_terms:
    - id: GO:0106074
      label: aminoacyl-tRNA metabolism involved in translational fidelity
    supported_by:
    - reference_id: PMID:29769718
      supporting_text: Serine that is misactivated by AlaRS is captured by the lysine side chains of ANKRD16,
        which prevents the charging of serine adenylates to tRNAAla and precludes serine misincorporation
        in nascent peptides.
    - reference_id: PMID:29769718
      supporting_text: Thus, ANKRD16 acts prior to formation of mischarged tRNA to enhance translational
        fidelity.
    - reference_id: PMID:29769718
      supporting_text: ANKRD16 had no effect on subsequent steps of tRNA mischarging including deacylation
        of mischarged Ser-tRNAAla
    - reference_id: PMID:29769718
      supporting_text: These results suggest that ANKRD16 functions as an alternative to water or tRNAAla,
        accepting misactivated serine.
    - reference_id: file:human/ANKRD16/ANKRD16-uniprot.txt
      supporting_text: tRNA(Ala) by promoting the hydrolysis of Ser-mischarged tRNA(Ala),
