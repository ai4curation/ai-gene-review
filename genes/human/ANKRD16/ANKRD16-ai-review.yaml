suggested_questions:
- question: Does human ANKRD16 capture misactivated serine from human AlaRS (AARS1), and are ANKRD16 levels
    relevant to AARS1 editing-domain variants in human neurological disease?
- question: Does ANKRD16 have a role in the nucleus, where it is also detected?
suggested_experiments:
- description: Reconstitute human AARS1 with human ANKRD16 (wild type and K102R/K135R/K165R) and measure
    serine-dependent ATP hydrolysis and Ser-tRNA(Ala) formation, to confirm the mouse mechanism in the
    human proteins.
