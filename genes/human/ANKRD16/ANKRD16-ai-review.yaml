proposed_new_terms:
- proposed_name: misactivated amino acid acceptor activity
  proposed_definition: Accepting the aminoacyl group of a non-cognate aminoacyl-adenylate formed by an
    aminoacyl-tRNA synthetase onto a residue of the acceptor protein, so that the misactivated amino acid
    is not transferred to tRNA.
  justification: ANKRD16 neither hydrolyses mischarged tRNA nor acts as a deacylase; it accepts misactivated
    serine from AlaRS onto its own lysines. No GO molecular function describes a protein acting as the
    acceptor for a misactivated amino acid. GO:0002161 aminoacyl-tRNA deacylase activity and GO:0002196
    Ser-tRNA(Ala) deacylase activity act on the charged tRNA, which ANKRD16 does not.
  proposed_parent:
    id: GO:0030234
    label: enzyme regulator activity
  supported_by:
  - reference_id: PMID:29769718
    supporting_text: These results suggest that ANKRD16 functions as an alternative to water or tRNAAla,
      accepting misactivated serine.
  - reference_id: PMID:29769718
    supporting_text: highly conserved lysines - K102, K135, and K165 - shifted by 87 Da (the mass of serine)
  - reference_id: PMID:29769718
    supporting_text: Our data collectively reveal ANKRD16 as a co-regulator of AlaRS that protects against
      assaults on translation fidelity and proteostasis in mammalian neurons.
  - reference_id: PMID:29769718
    supporting_text: ANKRD16 had no effect on subsequent steps of tRNA mischarging including deacylation
      of mischarged Ser-tRNAAla
