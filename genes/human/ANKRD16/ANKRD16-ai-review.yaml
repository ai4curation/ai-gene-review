- id: PMID:29769718
  title: ANKRD16 prevents neuron loss caused by an editing-defective tRNA synthetase.
  findings:
  - statement: ANKRD16 binds the AlaRS catalytic domain directly.
    supporting_text: ANKRD16, a vertebrate-specific protein that contains ankyrin repeats, binds directly
      to the catalytic domain of AlaRS.
  - statement: ANKRD16 lysines capture misactivated serine.
    supporting_text: Serine that is misactivated by AlaRS is captured by the lysine side chains of ANKRD16,
      which prevents the charging of serine adenylates to tRNAAla and precludes serine misincorporation
      in nascent peptides.
  - statement: ANKRD16 acts before tRNA mischarging.
    supporting_text: Thus, ANKRD16 acts prior to formation of mischarged tRNA to enhance translational
      fidelity.
  - statement: ANKRD16 does not deacylate Ser-tRNA(Ala).
    supporting_text: ANKRD16 had no effect on subsequent steps of tRNA mischarging including deacylation
      of mischarged Ser-tRNAAla
  - statement: K102, K135 and K165 carry the serine adduct.
    supporting_text: highly conserved lysines - K102, K135, and K165 - shifted by 87 Da (the mass of serine)
  - statement: ANKRD16 is nuclear and cytoplasmic in brain.
    supporting_text: ANKRD16 was widely expressed in the brain and was detected in the nucleus as well
      as the cytoplasm
  - statement: Ankrd16 loss is lethal in the AlaRS editing-defective background.
    supporting_text: However, loss of Ankrd16 in Aarssti/sti mice resulted in early embryonic lethality
      (Extended Data Fig. 7e).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text; mouse. The only functional study of ANKRD16 and the source of the mouse IDA
      rows behind every human annotation. A publisher correction (PMID:29925958) only relabels figure
      lanes and molecular mass markers; it does not change the findings.
