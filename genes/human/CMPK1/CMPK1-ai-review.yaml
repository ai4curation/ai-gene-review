- term:
    id: GO:0004849
    label: uridine kinase activity
  evidence_type: TAS
  original_reference_id: PMID:10462544
  qualifier: enables
  review:
    summary: TAS uridine kinase activity.
    action: REMOVE
    reason: Uridine kinase (uridine + ATP to UMP) is catalysed by UCK1/UCK2. The cited paper characterises
      CMPK1 as a nucleoside monophosphate kinase that phosphorylates CMP, dCMP and UMP; it does not report
      uridine phosphorylation. The term is the wrong reaction (one step upstream).
    supported_by:
    - reference_id: PMID:10462544
      supporting_text: We showed that the recombinant UMP-CMP kinase phosphorylated CMP, dCMP, and UMP
        with highest efficiency and dUMP, AMP, and dAMP with lower efficiency.
