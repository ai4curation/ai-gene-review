- term:
    id: GO:0004550
    label: nucleoside diphosphate kinase activity
  evidence_type: IDA
  original_reference_id: PMID:23416111
  qualifier: enables
  review:
    summary: NDP kinase activity reported for adenylate-kinase-family enzymes in a study of AK9.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'Amiri et al. found that several previously characterised adenylate-kinase-family enzymes
      also produce triphosphates from diphosphates in vitro. This is real in vitro activity of unknown
      physiological relevance: human cells have dedicated, highly active NDP kinases (NME1-4), and CMPK1
      is defined by its UMP/CMP kinase activity. Kept, but marked as over-annotated.'
    supported_by:
    - reference_id: PMID:23416111
      supporting_text: A number of previously characterized adenylate kinases were also tested and found
        to possess a broad phosphotransferase activity similar to AK9.
