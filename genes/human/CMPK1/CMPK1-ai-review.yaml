id: P30085
gene_symbol: CMPK1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CMPK1 encodes cytosolic UMP-CMP kinase, a monomeric adenylate-kinase-family nucleoside monophosphate
  kinase that transfers the gamma-phosphate of ATP to UMP, CMP and dCMP, forming UDP, CDP and dCDP. It
  supplies the pyrimidine diphosphates for RNA and DNA synthesis, linking de novo UMP synthesis and pyrimidine
  salvage to the NDP kinases that make UTP and CTP, and it phosphorylates the monophosphates of deoxycytidine
  analogue drugs such as cytarabine and gemcitabine. The protein is mainly cytoplasmic with a small nuclear
  fraction and is ubiquitously expressed.
