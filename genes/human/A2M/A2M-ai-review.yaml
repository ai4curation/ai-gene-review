- id: PMID:33964423
  title: Structural Investigations of Human A2M Identify a Hollow Native Conformation
    That Underlies Its Distinctive Protease-Trapping Mechanism.
  findings:
  - statement: Bait-region cleavage rearranges A2M's disulfide-linked dimers and
      collapses the tetramer around an internal protease-trapping cavity.
    supporting_text: These changes collapse the tetramer into a more compact
      conformation, which encloses an interior protease-trapping cavity.
