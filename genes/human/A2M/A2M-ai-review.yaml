  - statement: LRP1 recognizes activated A2M conformations but not native A2M.
    supporting_text: Native A2M does not interact with LRP1, whereas both A2M-MA
      and A2M-protease complexes do.
    reference_section_type: INTRODUCTION
  reference_review:
    relevance: HIGH
