core_functions:
- description: >-
    Broad-spectrum extracellular endopeptidase inhibition by conformational
    trapping. Protease cleavage of A2M's exposed bait region collapses the
    disulfide-linked tetramer around the enzyme, sequestering it from protein
    substrates; the internal thioester can additionally capture the protease
    covalently. Because susceptibility is determined largely by the bait
    sequence, A2M inhibits endopeptidases from multiple catalytic classes.
  molecular_function:
    id: GO:0004866
    label: endopeptidase inhibitor activity
  directly_involved_in:
  - id: GO:0010951
    label: negative regulation of endopeptidase activity
  locations:
  - id: GO:0005576
    label: extracellular region
  supported_by:
  - reference_id: PMID:33964423
    supporting_text: These changes collapse the tetramer into a more compact
      conformation, which encloses an interior protease-trapping cavity.
  - reference_id: PMID:34139236
    supporting_text: As the wild-type bait region is permissive to cleavage by
      most human proteases, A2M is accordingly a broad-spectrum protease
      inhibitor.
  - reference_id: PMID:18485748
    supporting_text: Furthermore, a(2)M inhibited both ADAMTS-7- and
      ADAMTS-12-mediated COMP degradation in a concentration (or dose)-dependent
      manner.
- description: >-
    Sequesters bait-cleaving proteases inside the collapsed A2M tetramer so they
    cannot reach protein substrates. This steric trap is mechanistically
    distinct from active-site blockade and can persist without covalent
    protease attachment.
  molecular_function:
    id: GO:0140311
    label: protein sequestering activity
  locations:
  - id: GO:0005576
    label: extracellular region
  supported_by:
  - reference_id: PMID:34139236
    supporting_text: A2M has a unique mechanism of inhibition where it collapses
      around proteases and irreversibly sequesters them from protein substrates
      (5).
  - reference_id: PMID:34139236
    supporting_text: Protease trapping is associated with covalent conjugation
      of the protease by a thiol ester bond that is initially buried within A2M
      and exposed upon its proteolysis-induced conformational change; although
      covalent conjugation is required for protease trapping by the monomeric
      αMs, tetramers such as A2M can trap proteases noncovalently (8, 9, 10, 11).
  - reference_id: PMID:33964423
    supporting_text: Protease inhibition by A2M and other αMs is enacted by a
      unique trapping mechanism whereby proteases are sequestered inside the αM
      protease inhibitor, restricting their access to protein substrates (2).
- description: >-
    Binds LRP1 only after bait cleavage or chemical activation exposes the
    receptor-binding determinant. This conformation-dependent interaction
    targets activated A2M and A2M-protease complexes for receptor-mediated
    internalization and degradation.
  molecular_function:
    id: GO:0050750
    label: low-density lipoprotein particle receptor binding
  locations:
  - id: GO:0005576
    label: extracellular region
  supported_by:
  - reference_id: PMID:1691187
    supporting_text: The purified 420-kD protein binds to the conformationally
      altered forms of alpha 2M that are known to specifically interact with
      alpha 2M receptors and does not bind to native alpha 2M.
  - reference_id: PMID:34139236
    supporting_text: As a consequence of its conformational change, A2M reveals
      a binding site that interacts with a scavenger receptor, low-density
      lipoprotein receptor-related protein 1 (LRP1), and this interaction quickly
      removes A2M-protease complexes from circulation through internalization and
      endosomal degradation, primarily in the liver (12, 13).
proposed_new_terms: []
suggested_questions:
- question: >-
    What fraction of physiological A2M inhibition requires thioester-mediated
    covalent attachment rather than noncovalent entrapment by the tetramer for
    each major class of circulating or extracellular protease?
- question: >-
    In which fluid-phase or tissue contexts, if any, does A2M materially restrain
    MASP1 without suppressing surface lectin-pathway complement activation?
- question: >-
    Which protease-bound A2M complexes dominate LRP1-dependent hepatic clearance
    under normal, inflammatory, and tissue-injury conditions?
- question: >-
    Which reported cytokine, growth-factor, and plasma-enzyme interactions occur
    with native A2M at physiological concentrations, and which require an
    activated or chemically modified conformation?
suggested_experiments:
- hypothesis: >-
    Native tetrameric A2M inhibits many proteases without thioester-mediated
    covalent attachment, whereas bait cleavage and conformational collapse are
    universally required.
  description: >-
    Compare wild-type A2M with bait-resistant, thioester-deficient, and
    collapse-defective recombinant variants across representative serine,
    cysteine, metallo, and aspartic endopeptidases. Measure bait cleavage,
    conformational change, covalent adduct formation, protease capture, and
    residual cleavage of protein substrates under plasma-like conditions.
- hypothesis: >-
    Only activated A2M and A2M-protease complexes undergo efficient
    LRP1-dependent hepatic uptake and degradation.
  description: >-
    Quantify uptake, endosomal delivery, and degradation of labeled native A2M,
    methylamine-activated A2M, and defined A2M-protease complexes in primary
    human hepatocytes or liver organoids with LRP1 knockout and receptor-rescue
    controls.
- hypothesis: >-
    A2M can trap soluble MASP1 without measurably suppressing activator-surface
    lectin-pathway signaling in human serum.
  description: >-
    Compare fluid-phase MASP1 complex formation, protease activity, and C3/C4
    deposition on defined activator surfaces in A2M-depleted human serum,
    matched untreated serum, and depleted serum reconstituted with purified
    wild-type or bait-resistant A2M.
