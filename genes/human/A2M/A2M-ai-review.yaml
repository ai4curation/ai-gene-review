id: P01023
gene_symbol: A2M
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  A2M encodes alpha-2-macroglobulin, an abundant secreted plasma glycoprotein
  assembled as a disulfide-linked homotetramer. It is a broad-spectrum
  endopeptidase inhibitor whose exposed bait region is cleaved by many
  proteases. Bait cleavage triggers a large conformational collapse that
  encloses the protease and restricts its access to protein substrates. An
  internal thioester can additionally form a covalent adduct with the trapped
  enzyme, although tetrameric A2M can entrap proteases without covalent linkage.
  The activated conformation exposes an LRP1-binding site that targets
  A2M-protease complexes for receptor-mediated uptake and degradation. A2M also
  binds several growth factors, cytokines, and plasma enzymes in
  conformation-dependent contexts, but these are secondary to its protease-trap
  function.
