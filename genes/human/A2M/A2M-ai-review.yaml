    review_notes: Full text is cached. The combined structural study directly
      supports the native-to-collapsed transition and independently summarizes
      the established activation dependence of LRP1 binding.
- id: PMID:34139236
  title: Development of selective protease inhibitors via engineering of the bait
    region of human α(2)-macroglobulin.
  findings:
  - statement: A2M collapses around proteases and sequesters them from protein
      substrates rather than blocking the catalytic site directly.
    supporting_text: A2M has a unique mechanism of inhibition where it collapses
      around proteases and irreversibly sequesters them from protein substrates
      (5).
    reference_section_type: INTRODUCTION
  - statement: The permissive wild-type bait region makes A2M a broad-spectrum
      inhibitor, while engineered substrate sequences redirect its protease
      selectivity.
    supporting_text: As the wild-type bait region is permissive to cleavage by
      most human proteases, A2M is accordingly a broad-spectrum protease
      inhibitor.
    reference_section_type: ABSTRACT
  - statement: Proteolytic activation exposes an LRP1-binding site that targets
      A2M-protease complexes for internalization and degradation.
    supporting_text: As a consequence of its conformational change, A2M reveals
      a binding site that interacts with a scavenger receptor, low-density
      lipoprotein receptor-related protein 1 (LRP1), and this interaction quickly
      removes A2M-protease complexes from circulation through internalization and
      endosomal degradation, primarily in the liver (12, 13).
    reference_section_type: INTRODUCTION
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text is cached. Bait specificity is established
      experimentally in this study; the LRP1-clearance statement summarizes
      earlier work and is corroborated by PMID:1691187 and PMID:15226301.
