- term:
    id: GO:0001656
    label: metanephros development
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P41133
  - ensembl:ENSMUSP00000008016
  review:
    summary: metanephros development is over-asserted from expression evidence.
    action: MARK_AS_OVER_ANNOTATED
    reason: The mouse Id3 source shows expression in organ anlagen, which is spatially suggestive, but the cached abstract does not support asserting that ID3 directly participates in metanephros development.
    supported_by:
    - reference_id: PMID:7655079
      supporting_text: Expression of Id3 in embryos was detected in brain, spinal cord, olfactory system, branchial arches, limbs, sclerotome, endocardiac cushions, the outer lining of the gut, lung, retina, the collecting system of the kidney, and in tooth anlagen
    additional_reference_ids:
    - PMID:7655079
- term:
    id: GO:0003714
    label: transcription corepressor activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - FB:FBgn0000575
  - PANTHER:PTN000919548
  review:
    summary: PAINT corepressor activity is better represented as transcription-regulator inhibitor activity.
    action: MODIFY
    reason: ID3 is not known to act as a promoter-bound corepressor; it inhibits DNA-binding bHLH transcription regulators by HLH-mediated sequestration, so GO:0140416 captures the conserved ID-family activity more precisely.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN000919548
        source_label: PTN000919548
        source_status: SUPPORTS_TRANSFER
        comment: The ID-family PAINT node supports conserved transcription inhibition, but GO:0140416 better captures HLH-mediated sequestration than promoter-bound corepression.
    proposed_replacement_terms:
    - id: GO:0140416
      label: transcription regulator inhibitor activity
    supported_by:
    - reference_id: PMID:25248477
      supporting_text: Id proteins do not possess the basic amino acids adjacent to the HLH motif necessary for DNA binding, Id proteins inhibit the function of E protein homodimers
