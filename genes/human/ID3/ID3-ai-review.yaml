id: Q02535
gene_symbol: ID3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ID3 is a nuclear helix-loop-helix transcriptional regulator inhibitor that lacks a basic DNA-binding region. It inhibits E proteins and other DNA-binding bHLH transcription factors by HLH-mediated dimerization, thereby regulating Pol II transcription and context-specific differentiation, proliferation, myogenic, circadian, and developmental programs.
