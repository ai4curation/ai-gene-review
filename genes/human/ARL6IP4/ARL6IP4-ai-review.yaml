suggested_questions:
- question: Does ARL6IP4 bind pre-mRNA directly at the splice sites whose choice it changes, or does it
    act only through SC35?
- question: Is ARL6IP4 an SRPK1/SRPK2 substrate, and does SR-domain phosphorylation control its movement
    between nucleoli and speckles?
suggested_experiments:
- description: CLIP-seq of endogenous ARL6IP4 combined with RNA-seq after knockdown, to map its direct
    RNA targets and the splicing events it controls.
