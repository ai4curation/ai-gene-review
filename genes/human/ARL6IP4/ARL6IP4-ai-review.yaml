  review:
    summary: RNA splicing (TAS). The cloning paper only proposed a splicing role. Later minigene reporter
      assays showed that ARL6IP4 changes alternative 5' and 3' splice-site choice. It is a regulator of
      splice-site selection, not a demonstrated core spliceosome component, so the row is modified to
      regulation of alternative mRNA splicing, via spliceosome.
    action: MODIFY
    reason: '[PMID:10708573 "Based on the presence of many nuclear localizing signals and a similarity
      to RNA splicing proteins, SR-25 is strongly suggested to be a nuclear protein and may contribute
      to RNA splicing."] [PMID:19582790 "we found that SRrp37 modulated alternative 5'' and 3'' splicing
      in vivo."] [PMID:19582790 "Together, SRrp37 may participate directly in splicing regulation or indirectly
      through interaction with SC35."]'
