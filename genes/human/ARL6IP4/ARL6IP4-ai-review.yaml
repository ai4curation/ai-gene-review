id: Q66PJ3
gene_symbol: ARL6IP4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ARL6IP4 (SR-25, SRrp37) is a small, largely disordered nuclear serine/arginine-related protein
  with an SR-dipeptide domain, a polyserine stretch and a basic nucleolar localization signal. It localizes
  to nucleoli and nuclear speckles, binds the SR splicing factor SC35 (SRSF2), and modulates alternative
  5' and 3' splice-site selection in minigene reporter assays. It has also been reported to inhibit herpes
  simplex virus pre-mRNA splicing. It is recovered in mRNA-bound proteome captures and co-purifies with
  the SR-protein kinases SRPK1 and SRPK2. It also binds cyclophilin A through the cyclophilin's isomerase
  domain. Multiple splice isoforms exist, and its transcript is subject to A-to-I RNA editing.
