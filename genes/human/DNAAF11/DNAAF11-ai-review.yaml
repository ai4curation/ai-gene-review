    supporting_text: absence of ODAs and IDAs in cilia or flagella
  - reference_id: PMID:23527195
    supporting_text: LRRC6 plays a role in dynein arm assembly
  - reference_id: PMID:30561330
    supporting_text: LRRC6 labeled foci (red) are enriched in Dnai1
  - reference_id: PMID:27353389
  - reference_id: PMID:37328841
suggested_questions:
- question: Which cell type, differentiation state or assay conditions explain the positive human ciliary
    LRRC6 staining versus its absence from axonemes in another airway preparation?
- question: Does the natural 414-residue product retain the assembly, stability and localization properties
    of the canonical 466-residue protein?
- question: Does DNAAF11 directly participate in gonad development, beyond meiotic expression and infertility
    caused by defective sperm motility?
- question: Which molecular step does DNAAF11 perform within DynAPs, and how does that step connect to
    context-dependent FOXJ1 nuclear accumulation?
