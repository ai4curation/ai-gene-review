- id: PMID:10775177
  title: Identification of a novel testis-specific leucine-rich protein in humans and mice.
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Identifier and complete abstract checked. Human and mouse cDNAs were identified; the
      explicitly reported cytoplasmic meiotic expression is in mouse. The full original was not recovered,
      so expression is not equated with a demonstrated developmental mechanism.
- id: PMID:23122589
  title: Loss-of-function mutations in LRRC6, a gene essential for proper axonemal assembly of inner and
    outer dynein arms, cause primary ciliary dyskinesia.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Human primary study supports deficient outer and inner dynein arms and impaired beating.
      Control nasal-brush LRRC6 staining includes cytoplasm and cilia, with mutant loss as a specificity
      control. These positive observations are retained alongside the different airway localization result
      in PMID:23527195.
- id: PMID:23527195
  title: LRRC6 mutation causes primary ciliary dyskinesia with dynein arm defects.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Human airway cultures, affected individuals and LRRC6 knockdown support dynein-arm assembly
      and targeting. Cilia remain after knockdown while arms are lost. This study finds cytoplasmic/basal-body-proximal
      LRRC6 but no axonemal signal; reduced dynein transcripts do not demonstrate direct LRRC6 DNA binding.
- id: PMID:23891469
  title: ZMYND10 is mutated in primary ciliary dyskinesia and interacts with LRRC6.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected original Results and Methods establish tagged human LRRC6–ZMYND10 association
      and CS-region interaction, with separate rat tissue and Xenopus localization experiments. Host species
      and coding-construct identity are distinguished. Reporter effects do not establish an autonomous
      LRRC6 signaling or chaperone activity.
- id: PMID:23891471
  title: Mutations in ZMYND10, a gene essential for proper axonemal assembly of inner and outer dynein
    arms in humans and flies, cause primary ciliary dyskinesia.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The normal cache remains abstract-only. The recovered PMC3738835 primary Results passage
      accompanying Figure 4F/G and Figure S7 describes human cDNA yeast two-hybrid tests and GST-ZMYND10
      versus GST pull-down of in-vitro-translated Myc-LRRC6. The relevant text sections and identity were
      verified, with public locators and short original-only anchors in the notes; complete downloaded-original
      or image reanalysis is not claimed.
- id: PMID:25036637
  title: A quantitative chaperone interaction network reveals the architecture of cellular protein homeostasis
    pathways.
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Publication identity and the available primary extract were checked. The target-resolved
      IntAct record EBI-9394895 identifies the LRRC6–SCRIB anti-tag association in HEK293T. The short
      full-text-marked cache does not expose every original Methods/table section, and co-complex association
      is not called a direct binary interface.
- id: PMID:29601588
  title: ZMYND10 stabilizes intermediate chain proteins in the cytoplasmic pre-assembly of dynein arms.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected original mouse tissue and tagged-host experiments support ZMYND10-dependent
      stabilization of LRRC6. The direction of stabilization is preserved. Later endogenous-negative versus
      tagged-positive findings in PMID:29916806 qualify detection context without negating all positive
      results.
- id: PMID:32296183
  title: A reference map of the human binary protein interactome.
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The genuine original main text and exact target MITAB records were read. Nine human
      partners have validated two-hybrid plus two screen-stage records. Main-text quadruplicate retesting
      and sequence verification are distinguished from pair-specific orthogonal confirmation; no uninspected
      supplementary threshold is claimed.
- id: PMID:33403504
  title: The effect of a novel LRRC6 mutation on the flagellar ultrastructure in a primary ciliary dyskinesia
    patient.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The normal cache remains abstract-only. Independently recovered primary text at PMC7910352,
      Immunofluorescence staining Methods, Results on the loss-of-function variant/Figure 2c and Expression
      of LRRC6 in various germ cells/Figure 4, distinguishes human sperm-flagellum staining from mouse
      germ-cell cytoplasm. Public section locators and a short original-only anchor are in the notes;
      no figure-pixel reanalysis is claimed.
- id: PMID:33961781
  title: Dual proteome-scale networks reveal cell-specific remodeling of the human interactome.
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The publication identity, available primary extract and exact target IntAct record EBI-54631541
      were checked. Human LRRC6–SCRIB anti-tag affinity purification supports association; direct binary
      contact and polarity activity of LRRC6 are not established.
- id: PMID:27353389
  title: Transport of the outer dynein arm complex to cilia requires a cytoplasmic protein Lrrc6.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete abstract and literal mouse MGI donor annotations were checked; the original
      full text was not recovered. The mouse knockout disrupts outer-arm targeting despite preserved 9+2
      architecture and IC1–IC2 association. Cytosol IDA annotations remain curator-supported rather than
      a newly verified human fractionation result.
- id: PMID:29916806
  title: ZMYND10 functions in a chaperone relay during axonemal dynein assembly.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected original Results and Methods distinguish negative endogenous mouse testis association
      from positive transient human LRRC6/mouse Zmynd10 assays. The proposed chaperone relay does not
      itself establish autonomous protein folding by LRRC6.
- id: PMID:30561330
  title: A liquid-like organelle at the root of motile ciliopathy.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Original human airway endogenous LRRC6/DNAI1 foci support DynAP localization. Tagged
      colocalization, dynamics and construct Methods are separately Xenopus experiments. DynAP is a membraneless
      organelle; these foci alone do not prove an additional diffuse soluble pool.
- id: PMID:33263282
  title: Functional partitioning of a liquid-like organelle during assembly of axonemal dyneins.
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Original tagged Xenopus LRRC6 localization and construct Methods corroborate DynAP organization.
      These experiments are not relabeled as endogenous human imaging.
- id: PMID:37328841
  title: LRRC6 regulates biogenesis of motile cilia by aiding FOXJ1 translocation into the nucleus.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected original mouse organoid and tagged HeLa experiments support LRRC6-dependent
      FOXJ1 nuclear accumulation. The authors leave the direct mechanism unresolved and do not establish
      a native human PCD mechanism. No transport-adaptor or DNA-binding activity is inferred for LRRC6.
