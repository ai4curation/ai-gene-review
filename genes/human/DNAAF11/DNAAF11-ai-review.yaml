core_functions:
- description: Facilitates cytoplasmic assembly and correct axonemal incorporation of outer and inner
    dynein arms that power motile cilia and sperm flagella. In human airway multiciliated cells, DNAAF11
    associates with dynein-containing DynAPs alongside other assembly factors.
  directly_involved_in:
