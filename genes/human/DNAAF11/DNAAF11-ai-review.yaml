  review:
    summary: Reject the electronic extracellular-location inference.
    action: REMOVE
    reason: The source is an electronic located_in assertion whose with/from fields are the extracellular-fluid-movement
      processes GO:0003351 and GO:0060287. Those processes describe fluid moved by cilia; they do not
      locate the assembly factor outside the plasma membrane. Direct human experiments place LRRC6 in
      cytoplasm and dynein-containing intracellular foci, with separate cell-type-dependent ciliary observations.
      Neither a membrane-enclosed cilium nor its effect on extracellular fluid establishes extracellular
      LRRC6. This is a source-role mismatch, not an inference from absence of a signal peptide.
