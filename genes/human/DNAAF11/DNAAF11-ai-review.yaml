- term:
    id: GO:0044458
    label: motile cilium assembly
  evidence_type: IMP
  original_reference_id: PMID:23122589
  qualifier: involved_in
  review:
    summary: Accept participation in assembling functional motile cilia through dynein-arm formation.
    action: ACCEPT
    reason: The human source identifies absent outer and inner dynein arms, which are components of motile
      cilia. GO:0044458 covers assembly of components into a motile cilium; persistence of the ciliary
      projection after LRRC6 loss does not refute participation in that process. The current ontology
      does not make this term an is_a/part_of ancestor of the two arm-assembly terms, so replacing it
      would discard valid coverage. PMID:37328841 additionally links LRRC6 to FOXJ1 nuclear accumulation
      in mouse organoids and transfected HeLa cells, while leaving the direct LRRC6–FOXJ1 connection unresolved.
      Retain the original assembly assertion together with the more specific arm contributions, without
      inferring autonomous nuclear-import activity.
