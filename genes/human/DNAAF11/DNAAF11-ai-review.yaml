id: Q86X45
gene_symbol: DNAAF11
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: DNAAF11 (LRRC6) is a leucine-rich-repeat and CS-domain protein that supports assembly and
  axonemal incorporation of the outer and inner dynein arms required for motile-cilia and sperm-flagellar
  beating. It associates with other dynein assembly factors and localizes to cytoplasmic dynein axonemal
  particles (DynAPs). Human airway and sperm studies also report ciliary or flagellar localization, with
  differences between airway preparations. Loss of DNAAF11 disrupts dynein-arm formation and causes primary
  ciliary dyskinesia, often with laterality defects and impaired fertility.
alternative_products:
- name: '1'
  id: Q86X45-1
  description: Canonical 466-residue protein containing leucine-rich repeats and a CS domain.
- name: '2'
  id: Q86X45-2
  sequence_note: VSP_015862, VSP_015863
  description: The 414-residue product retains canonical residues 1–408, including the annotated CS domain,
    replaces residues 409–414 with SYSTGF and lacks residues 415–466. Its distinct distal tail has not
    been shown to confer equivalent assembly, stability or localization activity.
