gene_symbol: FN1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Fibronectin is a secreted, modular glycoprotein that links cells to the extracellular matrix
  and helps organize fibrillar matrix. Characterized full-length forms assemble as disulfide-linked dimers
  and can be incorporated into cell-organized fibrils. Its type I, type II and type III modules provide
  distinct interaction surfaces for integrins, collagen or gelatin, proteoglycans, heparin and fibrin.
  The RGD-containing type III-10 module and neighboring contacts mediate recognition by integrins such
  as α5β1, coupling matrix attachment to junction assembly, cell spreading and signaling. Fibronectin
  also supplies a physical scaffold that supports the retention and organization of other extracellular
  matrix components. These activities contribute to tissue maintenance, wound repair and developmental
  cell migration. Alternative splicing and extracellular processing change the available interaction regions;
  the functions of characterized full-length proteins and experimental fragments are not necessarily shared
  by every product.
