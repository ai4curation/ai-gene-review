alternative_products:
- name: '15'
  id: P02751-15
  description: The displayed 2477-amino-acid fibronectin sequence contains both extra domains A and B.
    Displayed-sequence status does not identify a plasma-specific product or assign the localization of
    every fibronectin preparation to this isoform.
- name: '1'
  id: P02751-1
  sequence_note: VSP_060347
  description: A fibronectin splice product lacking extra domain B through the VSP_060347 sequence change.
- name: 2 (MSF-FN70, Migration stimulation factor FN70)
  id: P02751-2
  sequence_note: VSP_060343, VSP_060344, VSP_060345
  description: A truncated 70 kDa form called Migration Stimulation Factor (MSF-FN70). Secreted by fetal
    and tumor fibroblasts. Has distinct bioactivity promoting cell migration. Important in tumor microenvironment.
- name: 3 (V89)
  id: P02751-3
  sequence_note: VSP_060347, VSP_060353
  description: The V89 splice product lacks extra domain B and has the V-region deletion specified by
    VSP_060353.
- name: 4 (Fibronectin III-15X)
  id: P02751-4
  sequence_note: VSP_060347, VSP_060351, VSP_060354, VSP_060355
  description: The Fibronectin III-15X splice product lacks extra domain B, has a V-region deletion, and
    contains an altered C-terminal sequence followed by truncation.
- name: 5 (Fibronectin (V+I-10)-)
  id: P02751-5
  sequence_note: VSP_060347, VSP_060351, VSP_060356
  description: The Fibronectin (V+I-10)- splice product has combined V-region and type-I-10 deletions,
    together with loss of extra domain B.
- name: 6 (Fibronectin (V+III-15)-)
  id: P02751-6
  sequence_note: VSP_060347, VSP_060350
  description: The Fibronectin (V+III-15)- splice product has the combined V-region/type-III-region change
    described by VSP_060350, together with loss of extra domain B.
- name: 7 (Fibronectin containing EDB domain)
  id: P02751-7
  sequence_note: VSP_060353
  description: A fibronectin splice product retaining extra domain B and carrying the V-region deletion
    specified by VSP_060353. The sequence does not by itself establish a tissue-restricted expression
    pattern.
- name: 8 (Fibronectin not containing EDA domain)
  id: P02751-8
  sequence_note: VSP_060347, VSP_060349
  description: A fibronectin splice product lacking extra domains A and B through VSP_060349 and VSP_060347,
    respectively.
- name: 9 (Fibronectin not containing EDA and EDB domains and uses V64 variant of IIICS region)
  id: P02751-9
  sequence_note: VSP_060347, VSP_060349, VSP_060352, VSP_060353
  description: A fibronectin splice product lacking extra domains A and B and using the V64 variant of
    the IIICS region.
- name: '10'
  id: P02751-10
  sequence_note: VSP_060347, VSP_060349, VSP_060351
  description: A less characterized isoform lacking EDA domain with additional variations.
- name: 11 (Fibronectin containing EDB domain, exon x+2)
  id: P02751-11
  sequence_note: VSP_060348
  description: A fibronectin splice product retaining extra domain B and carrying the 1367–1457 deletion
    specified by VSP_060348. Its official synonyms include exon x+2.
- name: '12'
  id: P02751-12
  sequence_note: VSP_060346, VSP_060349, VSP_060352, VSP_060353
  description: A less characterized isoform. Functional role not well established.
- name: '13'
  id: P02751-13
  sequence_note: VSP_060349, VSP_060351
  description: A less characterized isoform lacking EDA domain. Functional role not well established.
- name: '14'
  id: P02751-14
  sequence_note: VSP_060347, VSP_060349, VSP_060353
  description: A fibronectin splice product lacking extra domains A and B and carrying the V-region deletion
    specified by VSP_060353.
- name: 16 (Migration stimulation factor, MSF)
  id: P02751-16
  sequence_note: VSP_060344, VSP_060345
  description: Migration Stimulation Factor (MSF). A truncated bioactive form that promotes cell migration.
    Produced by fetal fibroblasts and some tumors. Has distinct functions from full-length fibronectin
    in promoting motility.
- name: '17'
  id: P02751-17
  sequence_note: VSP_060347, VSP_060352, VSP_060353
  description: A fibronectin splice product lacking extra domain B and carrying the two V-region changes
    specified by VSP_060352 and VSP_060353.
