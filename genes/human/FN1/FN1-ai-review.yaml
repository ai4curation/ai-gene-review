core_functions:
- molecular_function:
    id: GO:0005201
    label: extracellular matrix structural constituent
  description: Fibronectin contributes structural material to cell-organized fibrils and maintains a scaffold
    supporting other extracellular matrix components. In human fibroblasts and smooth-muscle cells, blocking
    fibronectin polymerization disrupts the established fibronectin matrix. Separate reconstitution and
    matrix-maintenance experiments show that a polymerized fibronectin scaffold supports the organization
    and retention of thrombospondin and collagen fibrils.
  locations:
  - id: GO:0031012
    label: extracellular matrix
  directly_involved_in:
  - id: GO:0030198
    label: extracellular matrix organization
  supported_by:
  - reference_id: PMID:12388756
  - reference_id: file:human/FN1/FN1-uniprot.txt
- molecular_function:
    id: GO:0005178
    label: integrin binding
  description: Fibronectin binds integrins and supplies an extracellular adhesive ligand for cell-matrix
    attachment, junction formation, spreading and associated signaling. Human α5β1 recognition involves
    the RGD region in FNIII10, the FNIII9 synergy region and additional contacts; native FN10 also supports
    αVβ3 engagement and activation. Different integrins recognize different fibronectin surfaces, so the
    FNIII10 RGD mechanism is not assigned to every receptor. Domain and engineered-ligand experiments
    do not establish equivalent activity across all natural products.
  locations:
  - id: GO:0031012
    label: extracellular matrix
  directly_involved_in:
  - id: GO:0007160
    label: cell-matrix adhesion
  - id: GO:0007044
    label: cell-substrate junction assembly
  - id: GO:0034446
    label: substrate adhesion-dependent cell spreading
  - id: GO:0007229
    label: integrin-mediated signaling pathway
  supported_by:
  - reference_id: PMID:19126672
  - reference_id: PMID:10075919
  - reference_id: PMID:33962943
    supporting_text: Structural insights into integrin α(5)β(1) opening by fibronectin ligand
  - reference_id: PMID:24658351
    supporting_text: Structural basis for pure antagonism of integrin αVβ3 by a high-affinity form of
      fibronectin
- molecular_function:
    id: GO:0005518
    label: collagen binding
  description: Fibronectin recognizes collagen-derived ligands through a gelatin-binding region containing
    the six modules 6FNI–1FNII–2FNII–7FNI–8FNI–9FNI. Human recombinant-fragment binding to gelatin and
    structural work on this region establish the molecular capacity. The available assays distinguish
    gelatin or defined collagen peptides from an unrestricted claim about every collagen type, and domain
    behavior is not automatically assigned to every natural product.
  locations:
  - id: GO:0031012
    label: extracellular matrix
  supported_by:
  - reference_id: PMID:3024962
  - reference_id: PMID:20541508
- molecular_function:
    id: GO:0008201
    label: heparin binding
  description: Fibronectin binds heparin through basic interaction surfaces, including the characterized
    FNIII12–14 region. Human structural and mutational work places an important surface in FNIII13 with
    an additional contribution from FNIII14. This is a distinct glycosaminoglycan-binding capacity; it
    does not establish identical affinity for every sulfated glycan or require that every fibronectin
    interaction with a proteoglycan uses that surface.
  locations:
  - id: GO:0031012
    label: extracellular matrix
  supported_by:
  - reference_id: PMID:10075919
  - reference_id: file:human/FN1/FN1-uniprot.txt
- molecular_function:
    id: GO:0043394
    label: proteoglycan binding
  description: Fibronectin directly recognizes proteoglycan partners in the extracellular environment.
    Human plasma fibronectin binds recombinant human lubricin/PRG4 regions in a solid-phase assay, with
    an important contribution from the lubricin C-terminal region; human cartilage proximity observations
    provide a complementary biological setting. This establishes a defined partner-recognition capacity
    without equating every proteoglycan interaction with heparin binding or extending the assay to all
    FN1 products.
  locations:
  - id: GO:0031012
    label: extracellular matrix
  supported_by:
  - reference_id: PMID:29030641
