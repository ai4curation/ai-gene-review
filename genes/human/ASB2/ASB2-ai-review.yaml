- id: PMID:15590664
  title: ASB2 is an Elongin BC-interacting protein that can assemble with Cullin 5 and Rbx1 to reconstitute
    an E3 ubiquitin ligase complex.
  findings:
  - statement: ASB2 assembles with Elongin BC and Cullin 5.
    supporting_text: Here we show that ASB2, by interacting with the Elongin BC complex, can assemble
      with Cullin5.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only; leukemia cells.
  full_text_unavailable: true
- id: PMID:21737450
  title: Functional and structural insights into ASB2alpha, a novel regulator of integrin-dependent adhesion
    of hematopoietic cells.
  findings:
  - statement: ASB2-alpha targets filamins for degradation.
    supporting_text: ASB2α is the specificity subunit of an E3 ubiquitin ligase complex that targets filamins
      to proteasomal degradation.
  - statement: Filamin A degradation enhances adhesion to fibronectin.
    supporting_text: We show that ASB2α, through filamin A degradation, enhances adhesion of hematopoietic
      cells to fibronectin, the main ligand of β1 integrins.
  - statement: The N-terminal region and ankyrin repeats 1-10 bind filamin A.
    supporting_text: Furthermore, we demonstrate that a short N-terminal region specific to ASB2α, together
      with ankyrin repeats 1 to 10, is necessary for association of ASB2α with filamin A.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only; hematopoietic cells.
  full_text_unavailable: true
- id: PMID:19300455
  title: The E3 ubiquitin ligase specificity subunit ASB2beta is a novel regulator of muscle differentiation
    that targets filamin B to proteasomal degradation.
  findings:
  - statement: ASB2-beta targets FLNB for proteasomal degradation.
    supporting_text: ASB2beta is part of an active E3 ubiquitin ligase complex and targets the actin-binding
      protein filamin B (FLNb) for proteasomal degradation.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text; muscle cells.
- id: PMID:24052262
  title: ASB2α, an E3 ubiquitin ligase specificity subunit, regulates cell spreading and triggers proteasomal
    degradation of filamins by targeting the filamin calponin homology 1 domain.
  findings:
  - statement: The FLNA CH1 domain suffices for ASB2-alpha-mediated degradation.
    supporting_text: Here, we show that the calponin homology domain 1 (CH1), within the filamin A (FLNa)
      actin-binding domain, is the minimal fragment sufficient for ASB2α-mediated degradation.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text.
- id: PMID:24044920
  title: Phosphorylation of serine 323 of ASB2α is pivotal for the targeting of filamin A to degradation.
  findings:
  - statement: Ser-323 phosphorylation is needed for FLNA targeting.
    supporting_text: Indeed, using mass spectrometry, we showed for the first time that ASB2α is phosphorylated
      and that phosphorylation of serine-323 (Ser-323) of ASB2α is crucial for the targeting of the actin-binding
      protein filamin A (FLNa) to degradation.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only.
  full_text_unavailable: true
- id: PMID:22916308
  title: Filamins but not Janus kinases are substrates of the ASB2α cullin-ring E3 ubiquitin ligase in
    hematopoietic cells.
  findings:
  - statement: ASB2-alpha does not degrade JAK proteins in hematopoietic cells.
    supporting_text: Here, we show that neither endogenous nor exogenously expressed ASB2α induces degradation
      of JAK proteins in hematopoietic cells.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text; contests JAK2 as an ASB2 substrate.
- id: PMID:34845242
  title: ASB2 is a novel E3 ligase of SMAD9 required for cardiogenesis.
  findings:
  - statement: ASB2 ubiquitylates SMAD9 for degradation.
    supporting_text: Here, we report for the first time that SMAD9, but not the other SMADs, is ubiquitylated
      by the E3 ligase ASB2 and targeted for proteasomal degradation.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text; mouse and human cells.
