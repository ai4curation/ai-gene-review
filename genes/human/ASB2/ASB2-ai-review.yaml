    label: regulation of barbed-end actin filament capping
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN001192160
  - UniProtKB:P58546
  - dictyBase:DDB_G0268038
  review:
    summary: Regulation of barbed-end actin filament capping (IBA). The node is seeded by myotrophin (MTPN/V-1),
      a small ankyrin-repeat protein that binds capping protein, and by a Dictyostelium homolog. ASB2
      affects actin by degrading filamins, not by regulating capping protein, and no ASB2-capping protein
      interaction is known. The shared ankyrin-repeat fold does not carry this specific activity; removed.
    action: REMOVE
    reason: '[PMID:21737450 "ASB2α is the specificity subunit of an E3 ubiquitin ligase complex that targets
      filamins to proteasomal degradation."] [PMID:24052262 "Here, we show that the calponin homology
      domain 1 (CH1), within the filamin A (FLNa) actin-binding domain, is the minimal fragment sufficient
      for ASB2α-mediated degradation."]'
    supported_by:
    - reference_id: PMID:21737450
      supporting_text: ASB2α is the specificity subunit of an E3 ubiquitin ligase complex that targets
        filamins to proteasomal degradation.
    - reference_id: PMID:24052262
      supporting_text: Here, we show that the calponin homology domain 1 (CH1), within the filamin A (FLNa)
        actin-binding domain, is the minimal fragment sufficient for ASB2α-mediated degradation.
    propagation_review:
      root_cause: PROPAGATION_BAD
      residue_claims_not_applicable: No residue-level claim is propagated.
      source_entities:
      - source_id: PANTHER:PTN001192160
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Ankyrin-repeat node seeded by human MTPN (UniProtKB:P58546; IDA) and a Dictyostelium
          protein. The capping-protein regulation is a property of the myotrophin lineage, not of SOCS-box
          ASB proteins.
- term:
    id: GO:1990756
    label: ubiquitin-like ligase-substrate adaptor activity
  evidence_type: IDA
  original_reference_id: PMID:21737450
  qualifier: enables
  review:
    summary: Ubiquitin-like ligase-substrate adaptor activity (NEW, IDA). ASB2-alpha is the specificity
      subunit of a CRL5 E3 that targets filamins for degradation. Its N-terminal region and ankyrin repeats
      1-10 bind filamin A, which is recruited through its CH1 domain. ASB2-beta targets FLNB, and ASB2
      also targets SMAD9.
    action: NEW
    reason: '[PMID:21737450 "ASB2α is the specificity subunit of an E3 ubiquitin ligase complex that targets
      filamins to proteasomal degradation."] [PMID:21737450 "Furthermore, we demonstrate that a short
      N-terminal region specific to ASB2α, together with ankyrin repeats 1 to 10, is necessary for association
      of ASB2α with filamin A."] [PMID:24052262 "Here, we show that the calponin homology domain 1 (CH1),
      within the filamin A (FLNa) actin-binding domain, is the minimal fragment sufficient for ASB2α-mediated
      degradation."] [PMID:19300455 "ASB2beta is part of an active E3 ubiquitin ligase complex and targets
      the actin-binding protein filamin B (FLNb) for proteasomal degradation."]'
    supported_by:
    - reference_id: PMID:21737450
      supporting_text: ASB2α is the specificity subunit of an E3 ubiquitin ligase complex that targets
        filamins to proteasomal degradation.
    - reference_id: PMID:21737450
      supporting_text: Furthermore, we demonstrate that a short N-terminal region specific to ASB2α, together
        with ankyrin repeats 1 to 10, is necessary for association of ASB2α with filamin A.
    - reference_id: PMID:24052262
      supporting_text: Here, we show that the calponin homology domain 1 (CH1), within the filamin A (FLNa)
        actin-binding domain, is the minimal fragment sufficient for ASB2α-mediated degradation.
    - reference_id: PMID:19300455
      supporting_text: ASB2beta is part of an active E3 ubiquitin ligase complex and targets the actin-binding
        protein filamin B (FLNb) for proteasomal degradation.
