      C-Cullin-SOCS box)-type E3 ubiquitin ligase complex."] [file:human/ASB2/ASB2-uniprot.txt "CC   -!-
      DOMAIN: The SOCS box domain mediates the interaction with the Elongin"]'
    supported_by:
