  evidence_type: TAS
  original_reference_id: PMID:9419338
  qualifier: involved_in
  review:
    summary: Signal transduction (TAS, cited to the paper that defined the SOCS box family). The signalling
      term is inherited from the cytokine-signalling SOCS proteins. In ASB2 the SOCS box recruits Elongin
      BC-Cullin 5 to form a ubiquitin ligase. ASB2 affects signalling only by degrading specific proteins
      (for example in Notch-induced E2A turnover), which is regulation rather than participation in signal
      transduction. Marked as over-annotated, matching the repo's treatment of this mapping.
