- id: PMID:16325183
  title: ASB proteins interact with Cullin5 and Rbx2 to form E3 ubiquitin ligase complexes.
  findings:
  - statement: ASB-Cul5-Rbx2 complexes have E3 activity.
    supporting_text: Furthermore, all three tested ASB complexes containing Cul5-Rbx2 were found to have
      E3 Ub ligase activity.
- id: PMID:21119685
  title: Notch-induced Asb2 expression promotes protein ubiquitination by forming non-canonical E3 ligase
    complexes.
  findings:
  - statement: Asb2 promotes Notch-induced ubiquitination of E2A and JAK2.
    supporting_text: Asb2 promotes the ubiquitination of Notch targets such as E2A and Janus kinase (Jak)
      2, and a dominant-negative (DN) mutant of Asb2 blocks Notch-induced degradation of these proteins.
- id: PMID:32179481
  title: Loss of Asb2 Impairs Cardiomyocyte Differentiation and Leads to Congenital Double Outlet Right
    Ventricle.
  findings:
  - statement: ASB2 is required for human cardiomyocyte differentiation.
    supporting_text: Finally, using CRISPR/Cas9 genome editing, we demonstrate Asb2 requirement for human
      cardiomyocyte differentiation suggesting a conserved mechanism between mice and humans.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text.
- id: PMID:9419338
  title: Twenty proteins containing a C-terminal SOCS box form five structural classes.
  findings:
  - statement: The SOCS box defined a family including ASB proteins.
    supporting_text: By using the SOCS box amino acid sequence consensus, we have searched DNA databases
      and have identified a further 16 proteins that contain this motif.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Full text; family discovery paper, no ASB2 function.
