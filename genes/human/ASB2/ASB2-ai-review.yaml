id: Q96Q27
gene_symbol: ASB2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ASB2 is an ankyrin repeat and SOCS box protein that serves as the substrate-recognition subunit
  of an Elongin B/C-Cullin 5-RBX E3 ubiquitin ligase (CRL5). Two isoforms differ at the N terminus. Hematopoietic
  ASB2-alpha, induced by retinoic acid, binds filamin A through its N-terminal region and ankyrin repeats
  and targets filamins A and B for proteasomal degradation, which enhances hematopoietic cell adhesion
  to fibronectin; Erk-dependent phosphorylation of Ser-323 is needed for filamin A targeting. Muscle ASB2-beta
  targets filamin B, and in mouse also desmin, and localizes to the sarcomeric Z line. ASB2 also ubiquitinates
  SMAD9 for degradation and, downstream of Notch, promotes degradation of E2A via SKP2. It is required
  for cardiomyocyte differentiation in mouse and human cells. In mouse, ASB2-mediated filamin degradation
  supports cardiomyocyte maturation and dendritic-cell podosome formation and migration.
alternative_products:
