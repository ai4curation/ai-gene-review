suggested_questions:
- question: Is JAK2 a genuine ASB2 substrate, given Notch-induced degradation in T-cell progenitors but
    no JAK degradation in hematopoietic cell lines?
- question: How do the alpha and beta N-terminal regions select FLNA versus FLNB, and does Ser-323 phosphorylation
    gate substrate selection in vivo?
suggested_experiments:
- description: Map isoform-specific ASB2 substrates by ubiquitin-remnant proteomics in hematopoietic versus
    muscle cells, with Ser-323 phospho-mutants.
