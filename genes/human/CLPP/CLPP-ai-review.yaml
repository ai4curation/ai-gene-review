id: Q16740
gene_symbol: CLPP
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CLPP is the proteolytic subunit of the mitochondrial ClpXP protease, a serine peptidase of
  the S14 (ClpP) family inherited from the bacterial ancestor of mitochondria. It is imported into the
  matrix via an N-terminal transit peptide, and fourteen mature subunits assemble as two stacked heptameric
  rings that enclose the Ser153/His178/Asp catalytic sites in a sequestered chamber. On its own CLPP is
  largely a heptamer with very low peptidase activity; ATP-bound hexamers of the AAA+ unfoldase CLPX dock
  onto each face, stabilize the tetradecamer, open the axial pores and allosterically activate it, so
  that CLPX selects, unfolds and threads substrates that CLPP cleaves into short peptides. ClpXP degrades
  a range of matrix proteins, including the 12S rRNA chaperone ERAL1, whose timely removal is needed for
  mitoribosome small-subunit maturation and normal mitochondrial translation, the core subunits of the
  complex I N-module (supporting a salvage pathway that renews the NADH-oxidizing module of complex I),
  heme-bound ALAS1, and other respiratory chain and metabolic proteins; substrate selection is made by
  CLPX, in part through phosphoserine degrons. In C. elegans the ortholog CLPP-1 is needed to signal the
  mitochondrial unfolded protein response, but mammalian CLPP is not required for that response. Biallelic
  CLPP variants, which variously impair catalysis, CLPX docking or oligomerization, cause Perrault syndrome
  3 (sensorineural hearing loss with ovarian insufficiency, sometimes with neurological features), and
  Clpp-null mice are infertile and hearing-impaired. CLPP is the direct target of imipridones (ONC201/dordaviprone,
  ONC212) and related small molecules, which bind hydrophobic pockets between CLPP subunits (the CLPX
  docking sites) and hyperactivate CLPP into an unregulated protease that degrades respiratory chain proteins
  and kills cancer cells. Comparative proteomics suggests that the last eukaryotic common ancestor had
  both ClpXP and the unrelated ClpYQ (HslUV) protease; humans retain only ClpXP, whereas several protist
  pathogens keep ClpYQ.
