- term:
    id: GO:0004252
    label: serine-type endopeptidase activity
  evidence_type: EXP
  original_reference_id: PMID:15522782
  qualifier: enables
  review:
    summary: Serine-type endopeptidase activity is the core catalytic activity of CLPP (active-site nucleophile
      Ser153, catalytic His178). Experimental support for the human enzyme comes from mutagenesis and
      activity assays.
    action: ACCEPT
    reason: Core molecular function. Human CLPP S153A/C abolishes protease activity, and N-terminal mutations
      reduce ClpX-mediated degradation, confirming a serine peptidase that is active within ClpXP.
    supported_by:
    - reference_id: PMID:15522782
      supporting_text: with the proteolytic active sites sequestered within an aqueous chamber formed
        by face-to-face assembly of the two heptameric rings
      reference_section_type: ABSTRACT
    - reference_id: file:human/CLPP/CLPP-uniprot.txt
      supporting_text: 'S->A,C: Abolishes protease activity.'
      reference_section_type: DATABASE_ENTRY
    - reference_id: PMID:15522782
      supporting_text: Mutation or deletion of these residues causes a drastic decrease in ClpX-mediated
        protein and peptide degradation.
      reference_section_type: ABSTRACT
