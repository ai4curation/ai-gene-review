id: Q16740
gene_symbol: CLPP
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CLPP is the proteolytic subunit of the mitochondrial ClpXP protease. Its precursor is imported
  into the mitochondrial matrix, where mature CLPP assembles into heptameric rings that stack face to
  face into a tetradecameric barrel with the serine-protease (Ser-His-Asp) active sites sequestered inside.
  Alone, CLPP heptamers have very low peptidase and no protease activity; ATP-dependent binding of hexameric
  rings of the AAA+ unfoldase CLPX stabilizes the tetradecamer, allosterically activates the active sites
  and supplies unfolded substrates, which CLPX selects. ClpXP degrades unfolded, damaged or regulated
  matrix proteins and so contributes to mitochondrial protein quality control. Recessive CLPP mutations
  cause Perrault syndrome (sensorineural hearing loss with ovarian failure), and Clpp-null mice are infertile
  and deaf and accumulate CLPX and mtDNA. Although its C. elegans orthologue CLPP-1 is required to signal
  the mitochondrial unfolded protein response, loss of CLPP in mouse heart neither prevents nor alters
  the mammalian UPRmt.
