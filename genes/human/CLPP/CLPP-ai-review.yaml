core_functions:
- description: Serine proteolysis within mitochondrial ClpXP. CLPP forms the catalytic chamber and binds
    the CLPX ATPase, which selects and unfolds substrates and supplies ATP-driven translocation. Direct
    human reconstitution and mutagenesis establish CLPP cleavage; model-system ERAL1 and respiratory-complex
    turnover studies place this chemistry in mitochondrial protein quality control. CLPX docking is part
    of this integrated function, not a second independent catalytic activity of CLPP.
  molecular_function:
    id: GO:0004252
    label: serine-type endopeptidase activity
  directly_involved_in:
  - id: GO:0035694
    label: mitochondrial protein catabolic process
  - id: GO:0006515
    label: protein quality control
