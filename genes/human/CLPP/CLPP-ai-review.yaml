suggested_questions:
- question: Is the protease-activity-independent or peptide-export-dependent UPRmt signalling described
    for C. elegans CLPP-1 present in any mammalian cell type, or has signalling shifted entirely to OMA1-DELE1-HRI
    and ATF4/ATF5?
- question: Which physiological ClpXP substrates explain the Perrault-syndrome gonadal and auditory phenotypes?
suggested_experiments:
- hypothesis: CLPP-generated peptides are not required for ATF5/ATF4 induction in human cells under matrix
    protein-folding stress.
  description: Compare CLPP knockout and catalytic-dead (S153A) knock-in human cells under deltaOTC expression
    or LONP1 inhibition, measuring ATF5-dependent HSPD1/HSPA9 induction and DELE1 cleavage.
  experiment_type: genetic perturbation / transcriptional readout
