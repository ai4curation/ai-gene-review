core_functions:
- description: Serine peptidase of the mitochondrial ClpXP protease. CLPP tetradecamers form the proteolytic
    chamber into which CLPX-unfolded matrix proteins are translocated and cleaved into short peptides,
    providing ATP-dependent turnover of mitochondrial matrix proteins (for example ERAL1, complex I N-module
    subunits and heme-bound ALAS1).
