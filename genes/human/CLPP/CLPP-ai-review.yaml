suggested_questions:
- question: Should CLPP carry a process term for mitochondrial ribosome (small subunit) assembly? Clpp-null
    mouse cells accumulate ERAL1 on the 28S subunit and assemble fewer 55S mitoribosomes, and wild-type
    but not catalytically dead CLPP restores assembly. That is a step (removal of an assembly factor)
    that the protease itself performs, but the effect may also be a regulatory input rather than a part
    of the assembly pathway, and the evidence is from mouse.
  experts:
  - Trifunovic lab
  - GO mitochondrial translation curators
- question: Does mammalian CLPP have any role in the mitochondrial unfolded protein response? C. elegans
    CLPP-1 is needed for UPRmt signalling, and Reactome repeats this by inference, but cardiac Clpp deletion
    in DARS2-deficient mice showed CLPP is neither required for nor regulates UPRmt. Inference of GO:0034514
    to human CLPP from worm data should be avoided unless new mammalian evidence appears.
- question: Should the ATP-dependent peptidase activity (GO:0004176) on CLPP carry contributes_to? ATP
    hydrolysis is performed solely by CLPX, and CLPP alone has minimal peptidase activity; CLPX already
    carries GO:0004176 with contributes_to. Consistent treatment across ClpP/ClpX in PAINT would help.
- question: Is direct cleavage of PINK1 by ClpXP established, or does ClpXP act on PINK1 fragments after
    PARL/MPP processing? This decides whether membrane protein proteolysis (GO:0033619) is appropriate
    for CLPP.
suggested_experiments:
- hypothesis: ClpXP directly extracts and degrades ERAL1 from the human 28S small subunit.
  description: Reconstitute human CLPX/CLPP with purified ERAL1-bound 28S particles, and compare wild-type
    CLPP with the catalytic S153A mutant and with Perrault variants (T145P, C147S), measuring ERAL1 release
    and degradation.
  experiment_type: biochemical
- hypothesis: Perrault syndrome CLPP variants impair CLPX docking or tetradecamer stability rather than
    catalysis.
  description: Purify variant CLPP proteins and measure heptamer/tetradecamer equilibrium, CLPX binding,
    casein degradation and ONC201 responsiveness, and test in patient fibroblasts for ERAL1 and mitoribosome
    assembly defects.
  experiment_type: biochemical
