- term:
    id: GO:0004176
    label: ATP-dependent peptidase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000043558
  - UniProtKB:P0A6G7
  - UniProtKB:P80244
  review:
    summary: ATP-dependent peptidase activity is the defining activity of Clp proteases (EC 3.4.21.92,
      endopeptidase Clp). PAINT placed this at the ClpP family node (PTN000043558), which includes bacterial
      ClpP and human CLPP.
    action: ACCEPT
    reason: CLPP carries the catalytic Ser/His/Asp triad of the ATP-dependent ClpXP protease; the ATPase
      energy comes from the partner CLPX. GO and EC conventionally attribute the ATP-dependent endopeptidase
      activity to the ClpP proteolytic subunit (EC 3.4.21.92 is the ClpP enzyme), and human CLPP sits
      squarely inside the ClpP clade with no evidence of loss. Human CLPP alone has very low peptidase
      activity and needs CLPX for protein degradation, so contributes_to would also be defensible, but
      the node placement is sound.
    supported_by:
    - *id001
    - *id002
    - reference_id: PMID:16115876
      supporting_text: The hClpXP complex has protease activity and greatly increased peptidase activity
      reference_section_type: ABSTRACT
