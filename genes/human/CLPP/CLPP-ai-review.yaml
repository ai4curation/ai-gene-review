id: Q16740
gene_symbol: CLPP
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'CLPP is the serine-protease subunit of mitochondrial ClpXP. After import into the matrix,
  mature CLPP subunits assemble proteolytic rings whose active sites face an enclosed chamber. CLPX docks
  to CLPP and uses ATP to recognize, unfold and translocate protein substrates; CLPP cleaves the delivered
  polypeptides. Oligomeric stability and activity depend on the preparation and activation state. This
  division of labor supports mitochondrial protein turnover and quality control. Mouse studies implicate
  ClpXP in ERAL1 turnover during mitoribosome maturation and in renewal of respiratory complex I N-module
  proteins. Human biochemical experiments establish CLPP catalysis, CLPX coupling and activation by imipridone
  compounds. Phosphoserine-dependent substrate recognition is supplied by CLPX. Biallelic CLPP variants
  cause Perrault syndrome, with sensorineural hearing loss and ovarian dysfunction; tested variants affect
  catalytic activity, oligomerization or CLPX coupling differently. CLPP-dependent mitochondrial stress
  signaling varies by model: the worm ortholog contributes to the mitochondrial unfolded-protein response,
  whereas the tested mouse Dars2-deficient cardiac and human SPG7-depletion systems can mount the assayed
  response without CLPP.'
