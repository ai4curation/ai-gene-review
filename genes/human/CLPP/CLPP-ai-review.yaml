suggested_questions:
- question: How should the existing enables ATP-dependent peptidase assertion for CLPP be represented
    alongside the experimentally separable ATPase and substrate-translocation activities of CLPX?
- question: Which CLPP screen interactions occur in native cellular compartments, and which depend on
    the recorded isoforms, mutations or fragments?
- question: How do residual catalytic activity, assembly and human CLPX coupling differ among patient
    CLPP alleles in their native mitochondrial context?
- question: Which stress conditions require human CLPP for UPRmt signaling beyond the specific mouse cardiac
    and human SPG7-depletion models already tested?
suggested_experiments:
- hypothesis: Patient alleles with distinct defects in isolated assays differ in residual proteolysis
    and CLPX coupling after mitochondrial import.
  description: Compare imported patient variants with wild-type CLPP in matched human cells, measuring
    maturation, oligomeric state, CLPX association and substrate turnover. Include catalytically inactive
    and expression-matched controls so assembly defects are distinguished from loss of proteolysis.
- hypothesis: Some positive screen pairs depend on the assayed fragment or mutation rather than the native
    full-length partner.
  description: Select representative retained screen pairs and compare the exact screened constructs with
    their native full-length counterparts using orthogonal interaction assays and compartment controls.
    Test direct binding separately from colocalization or proximity.
