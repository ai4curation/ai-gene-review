  original_reference_id: PMID:22354088
  qualifier: enables
  review:
    summary: Endopeptidase activity is correct for CLPP, the serine peptidase subunit of mitochondrial
      ClpXP. The cited RNAi screen implicates ClpXP in PINK1 cleavage; the cached text is partial, but
      CLPP endopeptidase activity is independently established biochemically for the human protein.
