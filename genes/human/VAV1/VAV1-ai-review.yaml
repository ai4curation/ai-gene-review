id: P15498
gene_symbol: VAV1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'VAV1 is the hematopoietic member of the VAV family of cytoplasmic Rho/Rac
  guanine nucleotide exchange factors. It couples antigen, Fc, cytokine and growth-factor
  receptor tyrosine-kinase signals to Rac/Rho-family GTPases through phosphotyrosine-dependent
  recruitment, membrane PIP3 engagement and relief of autoinhibition of its DH catalytic
  domain, thereby regulating actin remodeling and lymphoid or myeloid receptor signaling.'
alternative_products:
- name: '1'
  id: P15498-1
- name: '2'
  id: P15498-2
  sequence_note: VSP_047563
existing_annotations:
- term:
    id: GO:0001784
    label: phosphotyrosine residue binding
  evidence_type: IPI
  original_reference_id: PMID:20624904
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q6GX35
  review:
    summary: Kept SH2-mediated phosphotyrosine binding.
    action: KEEP_AS_NON_CORE
    reason: The C-terminal SH2 domain lets VAV proteins bind phosphorylated
      receptors and adaptors. That phosphotyrosine-dependent recruitment is a
      real molecular function, but secondary to the core DH-domain GEF activity.
    supported_by: &id004
    - reference_id: file:genes/human/VAV1/VAV1-uniprot.txt
      record_section: ["FT:DOMAIN"]
      supporting_text: /note="SH2"
- term:
    id: GO:0002768
    label: immune response-regulating cell surface receptor signaling pathway
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN008462184
  - RGD:3951
  - UniProtKB:Q9UKW4
  review:
    summary: Immune-response receptor signalling is a recurring VAV context but
      not a distinct core activity.
    action: KEEP_AS_NON_CORE
    reason: Human NKG2D-DAP10 signalling requires the Grb2-VAV1 intermediate,
      and the PTN008462184 PAINT node independently transfers an
      immune-receptor context. This supports immune response-regulating cell
      surface receptor signalling as a receptor-specific readout downstream of
      the core VAV1 Rho/Rac GEF activity.
    supported_by:
    - reference_id: file:interpro/panther/PTHR45818/PTHR45818-paint.tsv
      supporting_text: "PTHR45818\tPTN008462184\tGO:0002768\tP\tIBD\tfalse"
    - reference_id: PMID:16582911
      supporting_text: For full calcium release and cytotoxicity to occur, both
        Grb2-Vav1 and p85 had to bind to DAP10
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
      - source_id: PANTHER:PTN008462184
        source_status: SUPPORTS_TRANSFER
        comment: PTN008462184 is seeded by rat Vav1 and human VAV3
          (UniProtKB:Q9UKW4), not by mouse Vav genes; it supports transfer of
          this non-core immune-receptor context across the human VAV family.
