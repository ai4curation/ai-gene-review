  - ensembl:ENSMUSP00000005889
  review:
    summary: Cell-cell junction covers the VAV1 pool recruited to immune
      synapses.
    action: KEEP_AS_NON_CORE
    reason: Primary T-cell imaging shows VAV1 recruitment to TCR microclusters
      and to the immunological synapse through SLP76-dependent SH2/SH3
      interactions; this supports the broad cell-cell junction placement as a
      non-core location for the immune-contact pool.
    supported_by:
    - reference_id: PMID:22956543
      supporting_text: We now show that it is recruited to microclusters and to
        the IS in primary CD4(+) and CD8(+) T cells
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
