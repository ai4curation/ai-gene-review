core_functions:
- description: 'VAV1 is the hematopoietic VAV-family GEF: after immune-receptor and
    cytokine-receptor tyrosine-kinase signaling it is recruited from cytosol to receptor-proximal
    membranes and catalyzes Rho/Rac-family GDP-GTP exchange, with direct biochemical
    support for phosphotyrosine-dependent Rac1 exchange.'
