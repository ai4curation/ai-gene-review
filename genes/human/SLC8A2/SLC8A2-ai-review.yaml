id: Q9UPR5
gene_symbol: SLC8A2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SLC8A2 (NCX2) is one of three mammalian plasma-membrane sodium/calcium
  exchangers. It is a multi-pass membrane protein of the Ca(2+):cation antiporter (CaCA,
  TC 2.A.19) family that catalyses electrogenic exchange of one Ca(2+) ion for three
  Na(+) ions across the cell membrane. Driven in the forward (Ca(2+)-extrusion) mode
  by the inward Na(+) electrochemical gradient, it rapidly lowers cytoplasmic Ca(2+)
  after cellular activation, and its direction reverses with membrane potential and
  the transmembrane Na(+)/Ca(2+) gradients. Transport is secondarily regulated by
  intracellular Ca(2+) acting at two cytoplasmic Calx-beta domains. NCX2 expression
  is largely restricted to brain and spinal cord, where it localizes to neuronal plasma
  membrane, cell body/perikaryon, dendrites, dendritic spines, axons and synaptic
  terminals. Through rapid Ca(2+) extrusion it contributes to neuronal calcium homeostasis
  and shapes Ca(2+)-dependent neuronal processes including synaptic plasticity, learning
  and memory.
