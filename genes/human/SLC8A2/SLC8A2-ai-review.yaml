    record_section: ["CC:CATALYTIC ACTIVITY"]
    supporting_text: Reaction=Ca(2+)(in) + 3 Na(+)(out) = Ca(2+)(out) + 3 Na(+)(in);
  - reference_id: PMID:8021246
    supporting_text: NCX2 was expressed in Xenopus oocytes and Na(+)-Ca2+ exchange
      activity was analyzed electrophysiologically by the giant inside-out, excised
      patch technique.
proposed_new_terms: []
suggested_questions:
- question: Does human NCX2 operate predominantly in the Ca(2+)-extrusion (forward)
    mode in neurons under physiological conditions, and under what conditions does it
    reverse to mediate Ca(2+) influx?
- question: Is the brain-restricted NCX2 subject to regulation by its cytoplasmic
    Calx-beta domains and putative calmodulin-binding region in the same way as the
    better-characterized NCX1, and does this tune synaptic Ca(2+) clearance?
suggested_experiments:
- description: Patch-clamp and Ca(2+)-imaging of NCX2-null versus wild-type neurons
    to quantify the specific contribution of NCX2 to recovery of cytosolic Ca(2+)
    after depolarization/glutamate stimulation, distinguishing it from NCX1/NCX3.
- description: Structure-function analysis (mutagenesis of the Calx-beta Ca(2+)-binding
    residues such as positions 407/443/469/598/600) to test how regulatory Ca(2+)
    binding controls human NCX2 exchange activity.
knowledge_gaps:
- gap_statement: The direction and physiological set-point of NCX2 transport in intact
    human neurons (forward Ca(2+) extrusion versus reverse Ca(2+) entry), and how it
    is tuned by membrane potential and local Na(+)/Ca(2+) gradients, remain experimentally
    undetermined for this isoform.
  gap_kind:
  - BIOLOGY
