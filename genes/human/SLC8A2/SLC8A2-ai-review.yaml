core_functions:
- description: Electrogenic plasma-membrane Na(+)/Ca(2+) antiporter that extrudes one
    Ca(2+) in exchange for three Na(+), driven by the inward Na(+) electrochemical
    gradient, thereby rapidly lowering cytosolic Ca(2+) and maintaining neuronal Ca(2+)
    homeostasis.
  molecular_function:
    id: GO:0005432
    label: calcium:sodium antiporter activity
  directly_involved_in:
