- id: file:human/CACNA1D/CACNA1D-uniprot.txt
  title: UniProtKB Q01668 CAC1D_HUMAN source record
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Authenticated normal Reviewed human record read for identity, channel mechanism, interaction
      partners and four named products. Names, IDs and sequence notes are preserved literally. Additional
      splice products can exist; the four records are not represented as four individually assayed native
      proteins in every tissue.
core_functions:
- description: CaV1.3 couples membrane depolarization to calcium entry through the alpha1D pore. Relatively
    negative activation within the L-type family supports sinoatrial pacemaker depolarization and calcium-triggered
    transmitter release from cochlear inner hair cells. Auxiliary subunits, calmodulin and C-terminal
    splice variation tune this same channel unit. Human channel reconstitution and SANDD electrophysiology
    complement native mouse and clinical evidence for these tissue roles.
  molecular_function:
    id: GO:0008331
    label: high voltage-gated calcium channel activity
  directly_involved_in:
