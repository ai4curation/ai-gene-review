suggested_questions:
- question: Which donor experiments resolve positive adenylate-cyclase regulation and the specific GPCR
    pathway, distinguishing calcium-to-cAMP feedback from cAMP-dependent modulation of the channel?
- question: Which native tissues and splice products support the precise Z-disc, T-tubule and synaptic-ribbon
    assignments, as distinct from nearby plasma-membrane channel pools?
- question: How do the four named human products and additional C-terminal splice variants partition channel
    gating and partner binding among auditory, pacemaker, neuronal and endocrine cells?
suggested_experiments:
- description: Compare defined human CaV1.3 splice products in matched pacemaker and sensory-cell models,
    measuring surface abundance, calcium-dependent and voltage-dependent inactivation, and coupled secretion
    with validated endogenous localization controls.
