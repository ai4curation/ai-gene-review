    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:36115835
  qualifier: enables
  supporting_entities:
  - UniProtKB:A4D2P6
  review:
    summary: CACNA1D-derived motif binding to a PDZ domain of GRID2IP is supported by the curated fragment-interaction
      record.
    action: MODIFY
    reason: PMID:36115835 measures binding between protein-derived PDZ-binding motifs and recombinant
      human PDZ domains by equilibrium holdup assays. GOA and the UniProt IntAct list both identify the
      exact CACNA1D–GRID2IP (A4D2P6) interaction. Together, the dedicated domain-binding assay framework
      and the curated target edge support refinement to PDZ domain binding. The main Results and selected
      Methods were read; the individual CACNA1D supplementary data row was not inspected. Therefore no
      target-specific affinity, domain number, motif sequence, orthogonal validation, full-length native
      interaction, or effect on channel physiology is asserted. The listed correction repairs figure values/labels/layout
      and does not state that this target interaction was withdrawn.
    proposed_replacement_terms:
    - id: GO:0030165
      label: PDZ domain binding
    supported_by:
    - reference_id: PMID:36115835
      supporting_text: "PDZ \ndomains and their target PDZ-binding motifs"
    - reference_id: file:human/CACNA1D/CACNA1D-uniprot.txt
