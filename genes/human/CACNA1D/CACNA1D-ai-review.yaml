id: Q01668
gene_symbol: CACNA1D
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CACNA1D encodes the pore-forming alpha1D subunit of CaV1.3, an L-type voltage-gated calcium
  channel. Calcium entry through the channel couples membrane depolarization to electrical and secretory
  responses. Its relatively negative activation range within the L-type family supports sinoatrial pacemaking
  and calcium-dependent neurotransmitter release from cochlear inner hair cells, with additional functions
  in neurons and endocrine cells. Beta and alpha2delta subunits regulate channel expression and gating,
  and intracellular partners organize local signaling. C-terminal alternative splicing changes activation
  and calcium-dependent inactivation. Loss-of-function variants can impair hearing and sinoatrial-node
  function, whereas activating variants can perturb adrenal and neuronal calcium signaling.
