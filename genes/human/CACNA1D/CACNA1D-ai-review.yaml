  evidence_type: IMP
  original_reference_id: PMID:23913001
  qualifier: enables
  review:
    summary: Human WT and adrenal-disease-associated mutant channels directly support channel activity.
    action: ACCEPT
    reason: Selected complete primary Results and Methods describe human CACNA1D WT and pore-region variants
      coexpressed with beta2a and alpha2delta1 in HEK293T cells. Mutations shift activation and alter
      inactivation; current-density effects differ among variants. Increased calcium influx in adrenal
      disease is mechanistically interpreted from these assays, not an aldosterone-synthetic activity
      of alpha1D.
    supported_by:
    - reference_id: PMID:23913001
      supporting_text: channel activation at less depolarized potentials
- term:
    id: GO:0005262
    label: calcium channel activity
  evidence_type: IMP
  original_reference_id: PMID:25620733
  qualifier: enables
  review:
    summary: The human channel conducts calcium and is altered by A749G and G407R.
    action: ACCEPT
    reason: The complete abstract and selected Methods/Results describe human long-C-terminal alpha1D
      in tsA-201 cells with calcium as charge carrier. A749G shifts gating and increases peak current,
      whereas G407R can reduce peak amplitude while greatly prolonging current. The two effects support
      calcium-channel activity without collapsing all gain-of-function mechanisms into increased peak
      current.
    supported_by:
    - reference_id: PMID:25620733
      supporting_text: 'pronounced slowing of

        current inactivation during depolarizing stimuli'
- term:
    id: GO:0005262
    label: calcium channel activity
  evidence_type: IMP
  original_reference_id: PMID:28472301
  qualifier: enables
  review:
    summary: WT and V401L splice-variant recordings substantiate calcium-channel activity.
    action: ACCEPT
    reason: The inspected Methods/Results compare human long and short 43s channel constructs in tsA-201
      cells. V401L increases calcium entry through gating and inactivation changes that depend on splice
      context. The short 43s construct is not automatically equated with the separately named 42A product.
      Clinical risk interpretation is kept separate from the measured channel activity.
    supported_by:
    - reference_id: PMID:28472301
      supporting_text: 'shifted voltage dependence of activation and inactivation to more negative

        voltages'
