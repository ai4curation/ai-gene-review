  qualifier: enables
  supporting_entities:
  - UniProtKB:Q9BYB0-1
  review:
    summary: Cav1.3 binds Shank SH3 domains through a channel-derived region; the curated source specifies
      SHANK3-1.
    action: MODIFY
    reason: PMID:30058071 directly describes binding between Shank SH3 domains and a Cav1.3 region containing
      a cluster of arginine residues. This supports SH3 domain binding rather than only generic protein
      binding. The exact human CACNA1D–SHANK3-1 edge is also retained in the UniProt IntAct list. The
      complete abstract and publisher supplementary-information descriptions were read, but the full main
      text and underlying figures were not accessible/read. Preserve Q9BYB0-1 as the curated partner;
      do not infer that this interaction is unique to that isoform or that the isolated-domain experiment
      establishes a native full-channel scaffold complex.
    proposed_replacement_terms:
    - id: GO:0017124
      label: SH3 domain binding
    supported_by:
    - reference_id: PMID:30058071
      supporting_text: the SH3 domains binds to a Cav1.3 region
