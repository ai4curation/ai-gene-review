- id: PMID:11160515
  title: Biophysical properties, pharmacology, and modulation of human, neuronal L-type (alpha(1D), Ca(V)1.3)
    voltage-dependent calcium currents.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete canonical abstract read. Human neuronal alpha1D with alpha2delta1/beta3a in
      HEK293 cells; calcium and barium currents, voltage dependence and dihydropyridine pharmacology.
      Selected Gi/o receptor/G-protein manipulations fail to modulate this preparation, which is not a
      general exclusion of all native GPCR signaling. Full Methods/figures not inspected.
  full_text_unavailable: true
- id: PMID:1309651
  title: Structure and functional expression of alpha 1, alpha 2, and beta subunits of a novel human neuronal
    calcium channel subtype.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete canonical abstract read. Human neuronal alpha1D with beta2 and alpha2b in Xenopus
      oocytes supports L-type channel reconstitution; absence of current without beta2 is specific to
      the tested system. Canonical cache preserved despite a fetched whitespace/metadata variant. Full
      Methods/figures not inspected.
  full_text_unavailable: true
- id: PMID:17110593
  title: Molecular coupling of a Ca2+-activated K+ channel to L-type Ca2+ channels via alpha-actinin2.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete canonical abstract read. CaV1.3 and CaV1.2 associate with alpha-actinin2, which
      links them to SK2 without direct SK2-L-type channel binding. CaV1.3 deletion perturbs SK2 and atrial
      repolarization. Full construct-level Methods and images were not inspected; the original human partner
      assertion is retained with curator deference, and the deletion physiology is not called an endogenous
      human experiment.
  full_text_unavailable: true
- id: PMID:18482979
  title: Modulation of voltage- and Ca2+-dependent gating of CaV1.3 L-type calcium channels by alternative
    splicing of a C-terminal regulatory domain.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete abstract and selected unique Methods/Results/Discussion read. Human channel
      backbone with rat exon42A sequence identical to the human amino-acid sequence, HEK/tsA-201 recordings,
      C-terminal fragments and FRET test splice-dependent gating and calmodulin modulation. Mouse tissue
      expression and human RT-PCR are separated from heterologous functional assays. Images and all supplementary
      data were not inspected; 42A is not automatically equated with the distinct 43s construct used in
      a later paper.
- id: PMID:21131953
  title: Loss of Ca(v)1.3 (CACNA1D) function in a human channelopathy with bradycardia and congenital
    deafness.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete normal abstract and official publisher identity read. Human SANDD families
      and nonconducting glycine-insertion channel, with explicit mouse SAN and hair-cell mechanism context.
      Canonical text is abstract-only; a publisher cookie redirect prevented direct full-text access.
      No direct human SAN-cell recording or full Methods/image inspection is claimed. Existing broad and
      tissue-context annotations use this convergent evidence with curator deference.
  full_text_unavailable: true
- id: PMID:21859974
  title: Defects in ankyrin-based membrane protein targeting pathways underlie atrial fibrillation.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete abstract plus selected unique Methods, Results and Discussion read. Mouse atrial/fibroblast
      targeting and electrophysiology, CaV1.3 fragment/motif binding, human atrial lysates/expression
      and computational action-potential modeling are distinguished. The channel construct/motif numbering
      is not silently remapped to the current canonical human sequence. Supplementary Methods and images
      were not inspected; ankyrin-dependent targeting is not the sole membrane-delivery route.
- id: PMID:23913001
  title: Somatic and germline CACNA1D calcium channel mutations in aldosterone-producing adenomas and
    primary aldosteronism.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete abstract and selected primary functional Results/Methods read. Human WT and
      pore-region variants coexpressed with beta2a/alpha2delta1 in HEK293T cells show altered activation/inactivation.
      Peak-current differences vary among variants and are interpreted cautiously by the authors. Adrenal
      disease interpretation is distinguished from direct channel measurement; no aldosterone-synthetic
      enzyme function is transferred to alpha1D. Images/supplements not inspected.
- id: PMID:25620733
  title: CACNA1D de novo mutations in autism spectrum disorders activate Cav1.3 L-type calcium channels.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete abstract and selected unique Methods/Results/Discussion read. Human long-C-terminal
      channel constructs in tsA-201 cells, calcium-current recordings and WT/mutant coexpression show
      distinct A749G and G407R mechanisms. Reduced peak amplitude can coexist with persistent current
      gain. Historical ASD-risk interpretation is not promoted to an independently updated disease-validity
      or treatment claim. Supplementary figures not inspected.
- id: PMID:28472301
  title: New gain-of-function mutation shows CACNA1D as recurrently mutated gene in autism spectrum disorders
    and epilepsy.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete abstract and selected unique Methods/Results/Discussion read. Human long and
      43s short splice constructs carrying V401L were compared in tsA-201 cells; gating, inactivation
      and inferred surface-expression effects depend on splice context. The 43s construct is not relabeled
      as current named product42A. Historical clinical interpretation is kept separate from directly measured
      channel function. Images and supplements not inspected.
- id: PMID:30058071
  title: Solution structures of the SH3 domains from Shank scaffold proteins and their interactions with
    Cav1.3 calcium channels.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete canonical abstract and bounded consultant publisher-access assessment read.
      Shank SH3 domains bind a channel-derived arginine-rich region; the exact human SHANK3-1 edge is
      also present in GOA/UniProt. The consultant inspected supplementary descriptions, not underlying
      experiments; main text/figures were inaccessible. Domain binding does not imply native full-channel
      scaffold assembly or isoform-exclusive binding.
  full_text_unavailable: true
- id: PMID:36115835
  title: Quantitative fragmentomics allow affinity mapping of interactomes.
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Complete canonical abstract and bounded consultant assessment of selected primary Results/Methods
      read. Protein-derived motifs and recombinant human PDZ domains were tested by equilibrium holdup
      assays; exact GOA/UniProt edges identify the supported target interactions. Individual CACNA1D supplement
      values, domain numbers, motif sequence and pair-specific orthogonal validation were not inspected.
      The complete indexed official correction DOI:10.1038/s41467-022-35177-6 repairs omitted correlation
      values/axis labels, a Figure4a column and Figure5 labels/panel ordering; corrected images were not
      inspected. It does not state withdrawal of the target interactions. The canonical cache is preserved
      despite an alternate metadata/whitespace variant.
