- id: file:human/JAK3/JAK3-uniprot.txt
  title: UniProt record P52333 (JAK3)
core_functions:
- description: Gamma c receptor-associated non-receptor tyrosine kinase that, with JAK1, phosphorylates
    IL-2-family cytokine receptors and STAT5 at the cytoplasmic face of the plasma membrane, transducing
    IL-2, IL-4, IL-7, IL-9, IL-15 and IL-21 signals required for lymphocyte development and function.
  molecular_function:
    id: GO:0004715
    label: non-membrane spanning protein tyrosine kinase activity
  locations:
  - id: GO:0031234
    label: extrinsic component of cytoplasmic side of plasma membrane
  - id: GO:0005829
    label: cytosol
  directly_involved_in:
  - id: GO:0038110
    label: interleukin-2-mediated signaling pathway
  - id: GO:0038111
    label: interleukin-7-mediated signaling pathway
  - id: GO:0007259
    label: cell surface receptor signaling pathway via JAK-STAT
  supported_by:
  - *id009
  - *id006
  - *id001
suggested_questions:
- question: What determines JAK3's strict specificity for the gamma c chain versus other cytokine receptor
    box1 motifs?
suggested_experiments:
- description: Swap FERM domains between JAK3 and JAK2 and test binding to IL2RG versus GHR/EPOR and rescue
    of IL-2 and GH signaling in JAK3-null lymphocytes.
  experiment_type: domain swap and complementation
