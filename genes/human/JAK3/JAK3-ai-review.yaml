  review:
    summary: JAK3 is the gamma c-associated kinase that transduces IL-2-family cytokine signals via STATs.
    action: ACCEPT
    reason: Direct human evidence shows JAK3 association with and activation by IL-2, IL-4, IL-7, IL-9
      and IL-15 receptors, and its kinase activity is needed for STAT5 phosphorylation; JAK3 deficiency
      causes SCID.
    supported_by: &id010
    - *id009
    - *id006
    - &id020
      reference_id: PMID:7568001
      supporting_text: JAK1 and JAK3 were tyrosine-phosphorylated in response to IL-2 and IL-15.
    - &id012
      reference_id: PMID:9182906
      supporting_text: Jak3 is highly expressed in double negative (CD4- CD8-) cells, one of the earliest
        stages of thymocyte differentiation, and can be activated via the IL-7 receptor.
    - &id011
      reference_id: PMID:7538655
      supporting_text: Coimmunoprecipitation of JAK3 with the IL4R suggests a physical association which
        exists prior to IL4R complex stimulation.
    - *id001
