- term:
    id: GO:0005131
    label: growth hormone receptor binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - MGI:MGI:96628
  - PANTHER:PTN002521566
  - RGD:2939
  - RGD:69056
  - UniProtKB:P29597
  review:
    summary: Growth hormone receptor binding propagated from the Janus-kinase family.
    action: MARK_AS_OVER_ANNOTATED
    reason: The JAK family as a whole binds GH receptor, but JAK3 is specialized for the common gamma
      chain of IL-2-family receptors; growth hormone signaling is mediated predominantly by JAK2, and
      there is no direct evidence that JAK3 binds GHR as a physiological partner.
    supported_by:
    - &id003
      reference_id: file:human/JAK3/JAK3-uniprot.txt
      supporting_text: In the cytoplasm, plays a pivotal role in signal transduction via its association
        with type I receptors sharing the common subunit gamma such as IL2R, IL4R, IL7R, IL9R, IL15R and
        IL21R.
    - &id006
      reference_id: PMID:7973658
      supporting_text: Jak1 and Jak3 associated with IL-2R beta and gamma c, respectively
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN002521566
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Ancestral node seeded by JAK2/Jak2 GHR evidence; JAK3 diverged to pair with gamma c receptors.
      - source_id: MGI:MGI:96628
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Mouse Jak2 GHR binding is well supported but does not establish JAK3 binding.
