- term:
    id: GO:0002731
    label: negative regulation of dendritic cell cytokine production
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q62137
  review:
    summary: Immune regulatory phenotype of JAK3 deficiency or inhibition.
    action: KEEP_AS_NON_CORE
    reason: Mouse knockout and inhibitor studies show altered dendritic cell cytokine production, T helper
      differentiation and T cell activation; these are context-dependent consequences of gamma c (and
      other) cytokine signaling rather than core activities.
    supported_by: &id015
    - reference_id: PMID:20696842
      supporting_text: Functional experiments in Th17 cultures demonstrated that the selective inhibition
        of Jak3 activation enhanced the transcription of RORγt.
