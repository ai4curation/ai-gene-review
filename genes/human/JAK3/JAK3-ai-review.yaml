id: P52333
gene_symbol: JAK3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: JAK3 is a Janus-family non-receptor tyrosine kinase expressed mainly in hematopoietic cells,
  especially lymphocytes and NK cells. Through its N-terminal FERM domain it binds the cytoplasmic tail
  of the common gamma chain (IL2RG) shared by the receptors for IL-2, IL-4, IL-7, IL-9, IL-15 and IL-21,
  and it acts together with JAK1, which binds the partner receptor chains. Cytokine binding activates
  JAK3 by autophosphorylation, after which JAK1/JAK3 phosphorylate the receptor tails and recruited STATs,
  chiefly STAT5, which dimerize and enter the nucleus to regulate transcription. JAK3 is a cytoplasmic
  protein that acts at the inner face of the plasma membrane. Inactivating JAK3 mutations cause autosomal
  recessive T-B+NK- severe combined immunodeficiency, mirroring IL2RG-deficient X-linked SCID.
