  review:
    summary: >-
      Inherited from PTN002930416. GO:0070139 is defined as hydrolysis of peptide bonds within
      SUMO itself (alpha-carboxyl to alpha-amino), which is the precursor-maturation reaction.
      It is not the isopeptidase (deconjugation) reaction.
    action: KEEP_AS_NON_CORE
    reason: >-
      SENP6 can process SUMO precursors, but at much lower rates than SENP2, and in cells it has
      little processing activity. Its main activity is isopeptide deconjugation of SUMO2/3
      chains, captured by the NEW GO:0016929 deSUMOylase activity. GO:0016929 is neither an
      ancestor nor a descendant of GO:0070139. The PAINT inheritance is not contradicted: SENP6
      keeps the catalytic triad and measurable precursor cleavage. The term describes a real
      but minor capacity, not the core function.
    supported_by:
    - reference_id: PMID:18799455
      supporting_text: In contrast, SENP6 and SENP7 exhibit lower rates for processing pre-SUMO1,
        pre-SUMO2, or pre-SUMO3 in comparison with SENP2.
    - reference_id: PMID:17000875
      supporting_text: our observations imply that SUSP1 has little processing activity (Fig. 6)
        but is important for SUMO2/3 deconjugation
