  review:
    summary: UniPathway mapping from the UniProt PATHWAY line "Protein modification; protein
      sumoylation".
    action: REMOVE
    reason: >-
      SENP6 performs the opposite reaction. It removes SUMO2/3 chains from conjugated proteins
      and is a poor SUMO precursor-maturation enzyme, so it does not contribute to conjugation.
