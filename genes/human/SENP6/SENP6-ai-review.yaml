- id: PMID:20212317
  title: The SUMO protease SENP6 is essential for inner kinetochore assembly.
  findings:
  - statement: SENP6 depletion removes the CENP-H/I/K complex from inner kinetochores and causes
      spindle and congression defects. SENP6 deconjugates poly-SUMO-2/3 from CENP-I, protecting
      it from RNF4-mediated degradation.
    supporting_text: SENP6 promotes the deconjugation of multiply sumoylated CENP-I, whereas
      RNF4 promotes its proteasome-mediated proteolysis
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached (PMC2835930). Source of the GOA IMP/IDA/IPI rows; the human
      HeLa siRNA study.
- id: PMID:17000875
  title: SUSP1 antagonizes formation of highly SUMO2/3-conjugated species.
  findings:
  - statement: SENP6 (SUSP1) is nucleoplasmic and is a SUMO2/3-biased isopeptidase that prefers
      substrates bearing three or more SUMO2/3 moieties. It has little precursor-processing
      activity.
    supporting_text: our observations imply that SUSP1 has little processing activity (Fig. 6)
      but is important for SUMO2/3 deconjugation, especially from species containing three or
      more SUMO moieties
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached; SUSP1 is a synonym of SENP6 (UniProt Q9GZR1).
- id: PMID:16912044
  title: Negative modulation of RXRalpha transcriptional activity by small ubiquitin-related
    modifier (SUMO) modification and its reversal by SUMO-specific protease SUSP1.
  findings:
  - statement: SENP6 (SUSP1) co-localises with RXRalpha in the nucleus and removes SUMO-1 from
      RXRalpha.
    supporting_text: SUSP1 co-localized with RXRalpha in the nucleus and removed SUMO-1 from
      RXRalpha
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract only. An early SUMO1-substrate report; later work shows a strong
      SUMO2/3 polymer preference.
- id: PMID:18799455
  title: Structure of the human SENP7 catalytic domain and poly-SUMO deconjugation activities
    for SENP6 and SENP7.
  findings:
  - statement: Purified SENP6 prefers SUMO2/3 and cleaves di- and poly-SUMO2/3 chains efficiently,
      but processes pre-SUMO precursors poorly compared with SENP2.
    supporting_text: In contrast, SENP6 and SENP7 exhibit lower rates for processing pre-SUMO1,
