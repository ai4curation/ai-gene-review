core_functions:
- description: >-
    Poly-SUMO2/3 chain-editing deSUMOylase. SENP6 is a nuclear C48 cysteine isopeptidase that
    trims or removes SUMO2/3 polymers, and mixed SUMO1-SUMO2/3 chains, from groups of
    chromatin-associated substrates. It processes SUMO precursors poorly. This activity is
    established experimentally for the human protein, and PAINT places it at the
    SENP6/SENP7/fungal Ulp2 node (PTN002930416).
  molecular_function:
    id: GO:0016929
    label: deSUMOylase activity
  directly_involved_in:
  - id: GO:0016926
    label: protein desumoylation
  locations:
  - id: GO:0005654
    label: nucleoplasm
  supported_by:
  - reference_id: PMID:18799455
    supporting_text: Biochemical assays show that SENP6 and SENP7 prefer SUMO2 or SUMO3 in
      deconjugation reactions with rates comparable with those catalyzed by SENP2
  - reference_id: PMID:17000875
    supporting_text: we found that SUSP1 has a strong paralogue bias toward SUMO2/3 and that it
      acts preferentially on substrates containing three or more SUMO2/3 moieties
- description: >-
    Maintains the inner kinetochore and centromere (CCAN, CENP-H/I/K, CENP-T/W, CENP-A
    deposition factors) by deSUMOylating their subunits. This opposes RNF4-dependent turnover
    and sets their centromere residency. Established for human SENP6. PAINT asserts it only at
    the vertebrate SENP6-specific node PTN002930429, which excludes SENP7 and fungal Ulp2.
  molecular_function:
    id: GO:0016929
    label: deSUMOylase activity
  directly_involved_in:
  - id: GO:0090234
    label: regulation of kinetochore assembly
  locations:
  - id: GO:0005654
    label: nucleoplasm
  supported_by:
  - reference_id: PMID:20212317
    supporting_text: SENP6 promotes the deconjugation of multiply sumoylated CENP-I, whereas
      RNF4 promotes its proteasome-mediated proteolysis
  - reference_id: PMID:31485003
    supporting_text: Accumulation of CENP-T, CENP-W and CENP-A to centromeres is impaired in
      the absence of SENP6.
suggested_questions:
- question: >-
    Is the kinetochore/CCAN role specific to the vertebrate SENP6 lineage, as the PAINT node
    placement (PTN002930429) implies, or do SENP7 and fungal Ulp2 orthologs such as S. pombe
    ulp2 also deSUMOylate inner-kinetochore proteins?
- question: >-
    Does the N-terminal multi-SIM region bind SUMO polymers directly (GO:0032184 SUMO polymer
    binding), and is this region conserved outside vertebrate SENP6?
- question: >-
    Is there a functionally relevant cytoplasmic pool of human SENP6 (e.g. for NEMO or other
    reported non-nuclear substrates), given that direct imaging shows minimal cytoplasmic signal?
suggested_experiments:
- description: >-
    Measure binding of the purified SENP6 N-terminal SIM-containing region to defined SUMO2
    monomers and polymers (ITC or SPR). Compare with SIM-mutant variants and the equivalent
    region of SENP7.
  experiment_type: biophysical binding assay
- description: >-
    Complement SENP6-depleted human cells with SENP7 or with chimeras carrying the S. pombe
    ulp2 catalytic domain, and test rescue of CENP-I stability and CENP-T/W centromere loading.
    This would show whether the kinetochore role is subfamily-specific.
  experiment_type: genetic complementation and imaging
