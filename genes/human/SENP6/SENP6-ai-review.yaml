gene_symbol: SENP6
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  SENP6 (sentrin-specific protease 6, also called SUSP1) is a large (1112 aa) nuclear cysteine
  protease of the peptidase C48 (SENP/Ulp) family. Together with its paralog SENP7 it forms the
  most divergent SENP subclass, marked by insertions in the catalytic domain (notably Loop 1)
  that set its preference for SUMO2/3 over SUMO1. Its N-terminal region carries several
  SUMO-interacting motifs that target it to SUMO chains. SENP6 is mainly an isopeptidase that
  trims or removes SUMO2/3 polymers, and mixed SUMO1-SUMO2/3 chains, from conjugated
  substrates. It processes SUMO precursors only weakly. It is nucleoplasmic and associates with
  chromatin, where it acts on groups of functionally related proteins rather than single
  targets. These include the constitutive centromere-associated network (CENP-I, CENP-C, CENP-T,
  CENP-W), the CENP-A loading factors MIS18BP1 and MIS18A, PML, RPA1, cohesin, and DNA damage
  response factors such as BRCA1-BARD1, 53BP1 and BLM. By keeping these proteins hypo-SUMOylated,
  SENP6 opposes poly-SUMO-dependent targeting by the SUMO-targeted ubiquitin ligase RNF4 and
  controls how long these complexes stay on chromatin. In this way it maintains centromere and
  inner-kinetochore integrity, CENP-A chromatin, PML nuclear body size and the timing of DNA
  damage responses. Loss of SENP6 causes defective inner-kinetochore assembly, chromosome
  congression defects, G2/M accumulation, micronuclei and genome instability.
