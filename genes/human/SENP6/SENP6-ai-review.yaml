- term:
    id: GO:0090169
    label: regulation of spindle assembly
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN002930429
  - UniProtKB:Q9GZR1
  review:
    summary: >-
      Inherited from PTN002930429. This node is restricted to the vertebrate SENP6 subfamily
      (SENP6 orthologs, including fish senp6a/senp6b) and excludes SENP7 and fungal Ulp2. Human
      SENP6 (IMP) is the donor.
    action: KEEP_AS_NON_CORE
    reason: >-
      The spindle defects after SENP6 depletion follow from loss of the CENP-H/I/K inner
      kinetochore. The paper found no gross change in k-fibre assembly or stability. Spindle
      regulation is therefore a downstream consequence of SENP6's kinetochore role, not a
      separate activity. PAINT deliberately placed this at a vertebrate SENP6-only node and not
      at the SENP6/7/Ulp2 node, so it should not be transferred to SENP7 or to fungal Ulp2.
    supported_by:
    - reference_id: PMID:20212317
      supporting_text: Cells lacking SENP6 showed defects in spindle assembly and metaphase
        chromosome congression.
