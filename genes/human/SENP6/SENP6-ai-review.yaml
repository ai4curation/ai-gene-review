- term:
    id: GO:0016929
    label: deSUMOylase activity
  evidence_type: IDA
  original_reference_id: PMID:18799455
  qualifier: enables
  review:
    summary: >-
      Proposed core molecular function. Purified SENP6 catalytic domain cleaves isopeptide-linked
      di-SUMO2/3 and poly-SUMO2/3 chains at rates comparable with SENP2. In cells, SENP6 removes
      SUMO2/3 polymers, and mixed SUMO1-SUMO2/3 chains, from substrates.
    action: NEW
    reason: >-
      GO:0016929 (thiol-dependent isopeptidase that cleaves SUMO from a conjugated target) is the
      precise description of SENP6's demonstrated catalytic activity. GOA currently has only
      GO:0070139 (precursor maturation), which SENP6 does poorly, and the generic
      cysteine-type peptidase activity. The activity is shown in vitro with purified protein
      and SUMO2/3 chain substrates and in cells, so the gene does the work itself.
    supported_by:
    - reference_id: PMID:18799455
      supporting_text: Biochemical assays show that SENP6 and SENP7 prefer SUMO2 or SUMO3 in
        deconjugation reactions with rates comparable with those catalyzed by SENP2,
        particularly during cleavage of di-SUMO2, di-SUMO3, and poly-SUMO chains composed of
        SUMO2 or SUMO3.
    - reference_id: PMID:21148299
      supporting_text: we further investigate the substrate specificity of SENP6 and show that it
        is also capable of cleaving mixed chains of SUMO-1 and SUMO-2/3
    - reference_id: PMID:17000875
      supporting_text: we found that SUSP1 has a strong paralogue bias toward SUMO2/3 and that it
        acts preferentially on substrates containing three or more SUMO2/3 moieties
