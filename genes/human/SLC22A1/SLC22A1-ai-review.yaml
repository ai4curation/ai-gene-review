id: O15245
gene_symbol: SLC22A1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'SLC22A1 encodes Organic Cation Transporter 1 (OCT1/hOCT1), a 554-residue, 12-transmembrane-helix polyspecific plasma-membrane transporter of the SLC22 family within the major facilitator superfamily. OCT1 is an electrogenic, voltage-dependent, Na(+)- and pH-independent, bidirectional facilitated uniporter (not a coupled symporter): cation uptake or efflux is driven by the membrane potential and the substrate concentration gradient. It transports a broad range of small organic cations, including endogenous bioactive amines and neurotransmitters (dopamine, serotonin, histamine, adrenaline, N-1-methylnicotinamide), the vitamin thiamine (vitamin B1), acetylcholine, choline, natural polyamines (spermidine, agmatine, putrescine), and some non-amine compounds (prostaglandins E2 and F2-alpha). It is expressed most highly in liver, where it resides in the sinusoidal/basolateral membrane of hepatocytes and mediates hepatic uptake and clearance of cationic compounds from the blood; it
  is also expressed in intestine, kidney proximal tubule, airway ciliated epithelium, testis and elsewhere with tissue-dependent (apical, basolateral or lateral) polarity. Physiologically, hepatic thiamine uptake by OCT1 regulates hepatic lipid and energy metabolism. OCT1 is a major drug-uptake transporter and pharmacogene: it mediates the hepatic uptake of metformin (a key determinant of its glucose-lowering action), and transports many cationic drugs and xenobiotics including MPP+, cisplatin/oxaliplatin, tetraethylammonium, quinidine and lamivudine; common OCT1 polymorphisms alter drug disposition and response.'
