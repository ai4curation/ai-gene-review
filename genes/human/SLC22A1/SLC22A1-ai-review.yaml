suggested_questions:
- question: What is the correct GO molecular-function representation for OCT1's defining polyspecific organic cation uniport activity, now that the grouping term GO:0015101 is obsolete? Currently the function is fragmented across substrate-specific terms.
- question: Does human OCT1 transport norepinephrine? An IDA (PMID:24688079) asserts norepinephrine uptake, but a later careful study (PMID:34040533) and the UniProt CAUTION state human OCT1 does not transport noradrenaline - the discrepancy is unresolved.
- question: What is the physiological (apical vs basolateral) polarity of OCT1 in enterocytes and renal proximal tubule? UniProt flags contradictory localizations; the answer determines whether OCT1's role there is absorption/secretion from the lumen or uptake from blood.
- question: How physiologically significant is OCT1-mediated prostaglandin (PGE2/PGF2alpha) transport, given its high affinity (nM Km) but the protein's predominant role as an organic cation transporter?
suggested_experiments:
- description: Reconstitute purified human OCT1 in proteoliposomes and measure electrogenic uptake of a panel of organic cations (MPP+, TEA, thiamine, metformin) under voltage clamp and controlled ion gradients, to confirm Na(+)-independent uniport and rank substrate affinity/capacity.
- description: Directly compare human OCT1 transport of carnitine, acylcarnitines (isobutyrylcarnitine) and noradrenaline side-by-side in the same heterologous system to resolve the carnitine/noradrenaline negatives and the acylcarnitine-biomarker finding.
- description: Use polarized human hepatocyte, enterocyte and proximal-tubule organoid models with endogenous tagging to resolve OCT1 membrane polarity and directional substrate flux in each epithelium.
- description: Leverage the cryo-EM structures (PDB 8ET6-8ET8, 8SC1-8SC6) with mutagenesis of the TMH 2/4/10/11 substrate-binding region to map how a single site accommodates chemically diverse organic cations.
