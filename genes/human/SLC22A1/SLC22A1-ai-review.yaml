core_functions:
- description: Polyspecific, electrogenic, Na(+)-independent facilitated uniport of endogenous monoamine neurotransmitters and related organic cations (dopamine, serotonin, histamine, adrenaline, N-1-methylnicotinamide) across the hepatocyte sinusoidal/basolateral plasma membrane - the defining molecular function of OCT1. No live GO grouping term for organic cation transport exists (GO:0015101 is obsolete), so the monoamine substrate-class term is used.
