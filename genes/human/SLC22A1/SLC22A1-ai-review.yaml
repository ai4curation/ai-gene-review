  review:
    summary: 'Xenobiotic metabolic process: OCT1 transports xenobiotics, it does not metabolize them.'
    action: MARK_AS_OVER_ANNOTATED
    reason: OCT1 mediates cellular uptake of xenobiotic cations (first step of hepatic drug disposition) but performs no metabolic chemistry. Transport activity is captured elsewhere (xenobiotic transport); the 'metabolic process' framing over-states OCT1's role.
