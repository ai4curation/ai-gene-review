id: O14678
gene_symbol: ABCD4
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ABCD4 (cblJ complementation group; formerly PMP69/P70R/PXMP1-L) is a half-size
  ATP-binding cassette (ABC) transporter of subfamily D that exports cobalamin (vitamin B12)
  from the lysosomal lumen to the cytosol in an ATP-dependent manner. Unlike its peroxisomal
  paralogs ABCD1-ABCD3, ABCD4 lacks the N-terminal hydrophilic region associated with peroxisomal
  targeting; it is co-translationally inserted into the endoplasmic reticulum membrane and requires
  the lysosomal escort protein LMBD1 (LMBRD1) to translocate to and localize at the lysosomal
  membrane, where it functions as a homodimer. After transcobalamin-bound cobalamin is endocytosed
  and degraded in the lysosome, ABCD4 (in concert with LMBD1 and the cytosolic processing protein
  MMACHC) delivers free cobalamin to the cytosol for conversion to methylcobalamin and adenosylcobalamin,
  the cofactors of methionine synthase and methylmalonyl-CoA mutase. Loss-of-function mutations
  cause methylmalonic aciduria and homocystinuria type cblJ (MAHCJ), characterized by failure
  to release cobalamin from lysosomes and reduced levels of both cobalamin cofactors.

