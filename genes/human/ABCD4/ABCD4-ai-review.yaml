- term:
    id: GO:0005777
    label: peroxisome
  evidence_type: IDA
  original_reference_id: PMID:14533738
  qualifier: located_in
  review:
    summary: The 2003 paper reports peroxisomal targeting of GFP-labelled ABCD4 fragments, whereas
      later work places full-length ABCD4 in ER and lysosomes.
    action: UNDECIDED
    reason: PMID:14533738 explicitly includes human PMP69 fragments; it must not be dismissed
      because its title foregrounds ABCD1. Fragment targeting can coexist with full-length targeting
      determined by the N terminus, so the later negative localization assays do not by themselves
      falsify the reported construct result. The cached source is abstract-only; reconciliation
      requires the exact ABCD4 construct and localization evidence before deciding how that experimental
      observation should annotate the intact gene product.
    supported_by:
    - reference_id: PMID:14533738
      supporting_text: "Green fluorescent protein-labeled fragments of human \nperoxisomal membrane\
        \ protein 69"
- term:
    id: GO:0005777
    label: peroxisome
  evidence_type: IDA
  original_reference_id: PMID:9302272
  qualifier: located_in
  review:
    summary: The early peroxisomal assignment is contradicted for intact human ABCD4 by later
      direct targeting and localization experiments.
    action: REMOVE
    reason: This is not a claim that the original paper assayed the wrong gene. PMID:27456980
      explicitly revisits the older antibody-based rat hepatic peroxisome result and contrasts
      it with human ABCD4 expression/localization, then establishes endogenous ER/lysosome pools.
      Together with the targeting experiments in PMID:19010322, this supports withdrawing the
      general native-human peroxisome assignment. Species, antibody and construct context remain
      limitations of reconciling the historical experiment, whose full text is unavailable here.
    supported_by:
    - reference_id: PMID:27456980
      supporting_text: ABCD4 does not localize to peroxisomes
    - reference_id: PMID:19010322
      supporting_text: "only P70R lacks the region and is translated with NH(2)-terminal \nhydrophobic\
        \ TMS1."
