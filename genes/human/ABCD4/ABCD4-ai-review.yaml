  review:
    summary: The inherited long-chain fatty acid transmembrane transporter activity assertion
      needs assessment independently of ABCD4 cobalamin transport and peroxisome exclusion.
    action: UNDECIDED
    reason: The relevant IBD is at PTN004256010 in PTHR11384. Direct B12 transport establishes
      one substrate, but is not a negative assay for every fatty-acid transport activity. Likewise,
      an ER/lysosomal protein can in principle affect peroxisome organization or lipid metabolism
