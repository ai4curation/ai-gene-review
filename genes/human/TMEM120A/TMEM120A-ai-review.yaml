- term:
    id: GO:0005637
    label: nuclear inner membrane
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  review:
    summary: Phylogenetic propagation of the original NET29 nuclear-envelope assignment across the
      TMEM120 family.
    action: KEEP_AS_NON_CORE
    reason: 'The inner nuclear membrane assignment rests on real experiments - nuclear envelope proteomics
      and imaging in adipocytes (PMID:26024229), plus a genome-organisation phenotype in adipocyte-specific
      knockout mice (PMID:35027552) - and the INM is continuous with the ER, so this is not simply
      wrong. But the compartment is explicitly contested: the two most recent mechanistic studies
      place the protein in the bulk ER, by fractionation and imaging in adipocytes (PMID:41423633)
      and by endogenous tagging in C. elegans plus TurboID proximity labelling in human cells (PMID:42098142).
      All functional partners now identified (ACSL1, ACSL3, GPAT4, CHP1, STING1) are ER proteins.
      Retained as a secondary/disputed location rather than a core one.'
    supported_by:
    - reference_id: PMID:26024229
      supporting_text: Here we present two nuclear envelope trans-membrane proteins TMEM120A and
        TMEM120B that are paralogs encoded by the Tmem120A and Tmem120B genes.
    - reference_id: PMID:42098142
      supporting_text: Intriguingly, a consensus has yet to emerge regarding the subcellular localization
        of TMEM120A.
