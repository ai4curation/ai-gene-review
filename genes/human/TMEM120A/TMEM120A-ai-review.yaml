- term:
    id: GO:0120225
    label: coenzyme A binding
  evidence_type: IDA
  original_reference_id: PMID:34374645
  qualifier: enables
  review:
    summary: Direct demonstration that purified TMEM120A carries a bound coenzyme A molecule in a
