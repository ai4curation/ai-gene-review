core_functions:
- molecular_function:
    id: GO:0120225
    label: coenzyme A binding
  description: TMEM120A binds a molecule of coenzyme A in a deep, cytosol-facing cavity enclosed
    by a six-transmembrane alpha-barrel, one per protomer of the symmetric homodimer. The fold is
    homologous to the fatty acid elongase ELOVL7 but the cavity lacks a hydrophobic tunnel able to
    accommodate a long acyl chain, and no elongase activity is detectable, so the protein is a CoA-binding
    accessory factor rather than an enzyme. The site is functionally load-bearing - substituting
    the central tryptophan (W193) abolishes both CoA binding and the interactions through which TMEM120A
    acts - and it places the protein at the point in the endoplasmic reticulum where coenzyme A is
    handed to acyl-CoA synthetases.
  directly_involved_in:
  - id: GO:0045017
    label: glycerolipid biosynthetic process
  locations:
  - id: GO:0005789
    label: endoplasmic reticulum membrane
  supported_by:
  - reference_id: PMID:34374645
    supporting_text: Instead, the six TMs form an α-barrel with a deep pocket where a coenzyme A
      (CoA) molecule is bound.
  - reference_id: PMID:34409941
    supporting_text: Within the transmembrane domain, a CoASH molecule is hosted in a deep cavity
      and forms specific interactions with nearby amino acid residues.
  - reference_id: PMID:41423633
    supporting_text: Here, we identify TMEM120A as an ER-resident CoA-binding protein that regulates
      intracellular FA metabolism.
- molecular_function:
    id: GO:0008047
    label: enzyme activator activity
  description: At the endoplasmic reticulum membrane TMEM120A binds the glycerol-3-phosphate acyltransferase
    GPAT4 and, together with myristoylated CHP1, synergistically increases GPAT4 catalytic activity,
    driving medium- and long-chain acyl-CoA into lysophosphatidic acid and onward into glycerolipid.
    It also binds the acyl-CoA synthetases ACSL1 and ACSL3 in a CoA-site-dependent manner and retains
    them at the ER, supporting local long-chain acyl-CoA production and the re-esterification of
    fatty acids into triacylglycerol during lipolysis. TMEM120A performs no catalysis itself; it
    acts as a positive regulator of the acyltransferase step, and this is the function conserved
    from Caenorhabditis elegans to mammals. A dedicated child term for glycerol-3-phosphate O-acyltransferase
    activator activity is proposed, since GO currently offers only the generic parent.
  directly_involved_in:
  - id: GO:0045017
    label: glycerolipid biosynthetic process
  - id: GO:0019432
    label: triglyceride biosynthetic process
  locations:
  - id: GO:0005789
    label: endoplasmic reticulum membrane
  supported_by:
  - reference_id: PMID:42098142
    supporting_text: Here, we have used genetic, biochemical, and imaging techniques to identify
      TMEM120A as GPAT4-activating protein.
  - reference_id: PMID:42098142
    supporting_text: We show that ER-localized TMEM120A and CHP1 synergistically activate GPAT4 and
      promote the incorporation of medium and long chain acyl-CoA into glycerolipid.
  - reference_id: PMID:42098142
    supporting_text: Taken together, our results indicate that TMEM120A and CHP1 act synergistically
      to enhance GPAT4 activity.
  - reference_id: PMID:41423633
    supporting_text: TMEM120A interacts with the ER-localized acyl-CoA synthetase ACSL1 and ACSL3
      to promote long-chain acyl-CoA synthesis and channeling into the ER, thereby facilitating FA
      re-esterification and lipid cycling during lipolysis.
proposed_new_terms:
- proposed_name: glycerol-3-phosphate O-acyltransferase activator activity
  proposed_definition: Binding to and increasing the activity of a glycerol-3-phosphate O-acyltransferase,
    an enzyme that catalyses the transfer of an acyl group from acyl-CoA to sn-glycerol 3-phosphate
    to form lysophosphatidic acid.
  justification: 'TMEM120A acts on GPAT4 exactly as an enzyme activator: it binds the enzyme at the
    endoplasmic reticulum membrane and, synergistically with myristoylated CHP1, increases its acyltransferase
    activity in a reconstituted in vitro assay, without itself catalysing any reaction. GO has no
    term at this specificity - a QuickGO search returns no glycerol-3-phosphate O-acyltransferase
    activator activity - so the only available option is the generic GO:0008047 enzyme activator
    activity, which loses the identity of the regulated enzyme and therefore the biology. There is
    direct precedent for acyltransferase-specific activator children, notably GO:0060228 phosphatidylcholine-sterol
    O-acyltransferase activator activity. The term would also fit CHP1, the only previously known
    GPAT4 activator, so it is not a single-gene term.'
  proposed_parent:
    id: GO:0008047
    label: enzyme activator activity
  supported_by:
  - reference_id: PMID:42098142
    supporting_text: Here, we have used genetic, biochemical, and imaging techniques to identify
      TMEM120A as GPAT4-activating protein.
  - reference_id: PMID:42098142
    supporting_text: We reproduced the observation that CHP1 enhanced GPAT4 activity23, and so did
      TMEM120A (Fig.
  - reference_id: PMID:42098142
    supporting_text: The lipid-modified, myristoylated form of calcineurin B homologous protein (CHP)
      1 is the only known GPAT4 activator thus far23.
suggested_questions:
- question: Where does endogenous, untagged TMEM120A actually reside in a human cell - the bulk endoplasmic
    reticulum, the inner nuclear membrane, or both in a cell-type-dependent way? The two accounts
    are supported by different laboratories using different systems, and the answer determines whether
    the genome-organisation phenotype of the knockout mouse is a direct nuclear function or a downstream
    consequence of disturbed lipid flux.
  experts:
  - Eric C Schirmer
  - Yun-Hee Lee
  - Ho Yi Mak
- question: What is the sign of TMEM120A's effect on mechanical nociception, and can it be explained
    entirely by glycerolipid signalling? Nociceptor-specific knockout reduces behavioural responses
    to painful mechanical stimuli, whereas knockdown increases PIEZO2 current amplitudes and lowers
    their thresholds. Both cannot be complete accounts, and neither requires TMEM120A to be a channel.
  experts:
  - Tibor Rohacs
  - Reza Sharif-Naeini
- question: Does TMEM120A move coenzyme A across the endoplasmic reticulum membrane, or does it only
    present bound coenzyme A to partner enzymes? The phrase "CoA channeling" has been used for the
    adipocyte phenotype, but the authors hedge the mechanism, and no transport assay has been reported.
    A reconstituted flux measurement would decide whether a transporter molecular function term is
    ever warranted.
  experts:
  - Yun-Hee Lee
- question: Is the activation of GPAT4 by TMEM120A direct and stoichiometric, and does bound coenzyme
    A participate in it? The W193A and G195E mutations disrupt both CoA binding and partner interactions,
    leaving open whether CoA is a cofactor for the activation step or merely a structural requirement
    for the fold.
  experts:
  - Ho Yi Mak
- question: Do TMEM120A and TMEM120B form a genuine heterodimer in cells, and if so does it have
    different activity toward GPAT4 or the ACSLs than either homodimer? All structures to date resolve
    homodimers only.
  experts:
  - Eric C Schirmer
suggested_experiments:
- hypothesis: TMEM120A increases GPAT4 catalytic turnover by direct binding, and the effect requires
    an intact coenzyme A site.
  description: Reconstitute purified human GPAT4, CHP1 and wild-type or W193A TMEM120A into nanodiscs
    of defined lipid composition and measure glycerol-3-phosphate acyltransferase kinetics (Km and
    kcat for acyl-CoA and for sn-glycerol 3-phosphate) with and without each partner. Deplete or
    add back free coenzyme A to test whether the bound cofactor is required for activation as opposed
    to for folding.
  experiment_type: reconstituted enzyme kinetics
- hypothesis: The mechanical-pain phenotype of TMEM120A loss is mediated by reduced phosphatidic
    acid and lysophosphatidic acid rather than by loss of a channel.
  description: In nociceptor-specific Tmem120a knockout mice, quantify phosphatidic acid and lysophosphatidic
    acid in dorsal root ganglia by lipidomics, record PIEZO2-mediated and high-threshold mechanically
    activated currents, and test whether intracellular delivery of phosphatidic acid or the non-hydrolysable
    analogue restores wild-type mechanical thresholds. A GPAT4 loss-of-function allele should phenocopy
    the TMEM120A knockout if the lipid route is the operative one.
  experiment_type: in vivo lipidomics plus patch-clamp rescue
- hypothesis: Endogenous TMEM120A is an endoplasmic reticulum protein in most cell types, with any
    inner nuclear membrane pool being a minor subfraction.
  description: Knock a small epitope tag into the endogenous TMEM120A locus in a human adipocyte
    model and in a sensory-neuron model, then compare localisation by Airyscan or expansion microscopy
    against calnexin, lamin B1 and an inner nuclear membrane marker, with quantitative subcellular
    fractionation and split-GFP topology reporters as orthogonal readouts. Avoid overexpression throughout,
    since it is the principal confound in the existing literature.
  experiment_type: endogenous tagging and quantitative imaging
- hypothesis: No ion flux is attributable to TMEM120A under conditions where a genuine mechanosensitive
    channel would be detected.
  description: Perform a blinded, multi-site electrophysiological comparison of TMEM120A against
    a positive control (PIEZO1 or TMEM63A) and an empty vector, in Piezo1-knockout HEK cells, in
    native dorsal root ganglion neurons, and in proteoliposomes, using a common poking and stretch
    protocol agreed in advance. This directly addresses the residual disagreement rather than adding
    another single-laboratory report.
  experiment_type: blinded multi-laboratory electrophysiology
