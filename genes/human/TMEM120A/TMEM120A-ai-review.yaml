- term:
    id: GO:0050966
    label: detection of mechanical stimulus involved in sensory perception of pain
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  review:
    summary: Ensembl Compara projection from mouse of the nociceptor mechanical-pain phenotype, framed
      as stimulus detection.
    action: MODIFY
    reason: 'The organismal phenotype behind the mouse annotation is real - nociceptor-specific inducible
      knockout reduced behavioural responses to painful mechanical stimuli (PMID:32084332) - and
      independent rodent work supports a contribution to mechanical hyperalgesia. What has been refuted
      is the mechanism: this term asserts that the gene product receives and transduces the mechanical
      stimulus, which is exactly the channel claim negated three times in GOA. The current model
      is indirect modulation: TMEM120A inhibits PIEZO2 (PMID:35819364), and the mediator is a glycerolipid,
      since TMEM120A expression raises phosphatidic acid and lysophosphatidic acid, which inhibit
      PIEZO2 (PMID:39147733) - and lysophosphatidic acid is the product of the GPAT4 reaction that
      TMEM120A activates (PMID:42098142). A regulation term is the defensible altitude. Flagged honestly:
      the sign of the effect is unresolved, since knockout reduces mechanical pain behaviour whereas
      knockdown increases PIEZO2 current amplitudes.'
    proposed_replacement_terms:
    - id: GO:0051930
      label: regulation of sensory perception of pain
    supported_by:
    - reference_id: PMID:35819364
      supporting_text: Our data identify TMEM120A as a negative modulator of PIEZO2 channel activity,
        and do not support TMEM120A being a mechanically activated ion channel.
    - reference_id: PMID:39147733
      supporting_text: Here we find that TMEM120A expression elevates cellular levels of phosphatidic
