id: Q9BXJ8
gene_symbol: TMEM120A
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Six-transmembrane protein of the endoplasmic reticulum membrane that forms a symmetric
  homodimer and binds a molecule of coenzyme A in a deep, cytosol-facing cavity within each protomer.
  Its fold resembles the very-long-chain fatty acid elongase ELOVL7, but the pocket cannot accommodate
  a long acyl chain and no elongase activity has been detected; the protein is a CoA-binding accessory
  factor of glycerolipid synthesis rather than an enzyme. TMEM120A associates with the ER acyl-CoA
  synthetases ACSL1 and ACSL3 and promotes their retention at the ER, supporting local long-chain
  acyl-CoA production and the re-esterification of fatty acids into triacylglycerol during lipolysis;
  it also binds the glycerol-3-phosphate acyltransferase GPAT4 and, together with myristoylated CHP1,
  synergistically stimulates GPAT4 activity, driving acyl-CoA into glycerolipid. Both activities
  require an intact CoA-binding site. The protein is enriched in adipose tissue, where its loss causes
  defective fatty acid re-esterification, ER stress and a lipodystrophy-like metabolic phenotype,
  and the role in glycerolipid synthesis is conserved in Caenorhabditis elegans. TMEM120A was originally
  described as a nuclear envelope protein (NET29) and later, under the name TACAN, as a plasma membrane
  mechanosensitive ion channel of nociceptors; the channel assignment is contradicted by four independent
  structural and electrophysiological studies that could not detect mechanically evoked currents,
  and the protein instead modulates mechanical sensitivity indirectly by raising cellular phosphatidic
  acid and lysophosphatidic acid, which inhibit PIEZO2. Additional reported roles include promotion
  of STING trafficking from the ER during the antiviral response and inhibition of the PKD2 channel.
