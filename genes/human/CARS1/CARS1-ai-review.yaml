suggested_questions:
- question: Does human CARS1 itself catalyze cysteine persulfide synthase activity in cells, or is the reported mammalian persulfide synthesis predominantly a CARS2-dependent mitochondrial activity?
  experts: []
suggested_experiments:
- description: Assay purified human CARS1 under the same LC-MS/MS persulfide-detection conditions used for human CARS2, and complement the in vitro result with selective CARS1 knockdown or rescue in CARS2-proficient human cells.
  hypothesis: Human CARS1 has CARS-family PLP-dependent persulfide synthase activity, but the relative cytosolic contribution is smaller than the mitochondrial CARS2 contribution reported in cells.
