id: P49589
gene_symbol: CARS1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CARS1 is the cytosolic class I cysteinyl-tRNA synthetase. The homodimeric enzyme activates cysteine with ATP and transfers cysteine to cytosolic tRNA(Cys), producing Cys-tRNA(Cys) for cytosolic protein synthesis. Its anticodon-binding and eukaryote-specific C-terminal regions tune recognition of the cytosolic tRNA(Cys) substrate, and biallelic hypomorphic or truncating variants reduce tRNA charging and cause a multisystem recessive disorder with developmental delay, microcephaly, brittle hair and brittle nails.
