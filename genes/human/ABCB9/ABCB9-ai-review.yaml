- term:
    id: GO:0005765
    label: lysosomal membrane
  evidence_type: EXP
  original_reference_id: PMID:15577206
  qualifier: located_in
  review:
    summary: Lysosomal membrane is the established steady-state location of ABCB9.
    action: ACCEPT
    reason: Several independent lines of evidence place ABCB9 in the lysosomal limiting membrane. It colocalizes
      with LAMP1/LAMP2 and LysoTracker, it cofractionates with lysosomal markers, it appears in the proteome
      of placental lysosomal membranes, and transport assays on isolated lysosomes show its activity there.
      TMD0 carries the lysosomal sorting signal. The protein does not reside at the plasma membrane; only
      the core domain without TMD0 is diverted to the cell surface.
    supported_by:
    - reference_id: PMID:10748049
      supporting_text: ABCB9 protein colocalized with the lysosomal markers, LAMP1 and LAMP2, in transfected
        cells.
    - reference_id: PMID:17977821
      supporting_text: TAPL was detected in the lysosomal compartment co-localizing with the lysosome-associated
        membrane protein LAMP-2
    - reference_id: PMID:21212514
      supporting_text: TAPL-GFP was co-sedimented with lysosomal marker cathepsin D on Percoll density
        gradient centrifugation.
    - reference_id: PMID:20377823
      supporting_text: in contrast to the full-length transporter, the core translocation complex is targeted
        preferentially to the plasma membrane
