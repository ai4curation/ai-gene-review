- term:
    id: GO:0005764
    label: lysosome
  evidence_type: IDA
  original_reference_id: PMID:22641697
  qualifier: located_in
  review:
    summary: Lysosomal localization. The protein is an integral component of the lysosomal limiting membrane.
    action: MODIFY
    reason: The localization is correct, but ABCB9 is a multi-pass membrane protein of the lysosomal limiting
      membrane, not a luminal lysosomal protein. Lysosomal membrane (GO:0005765), which the gene already
      carries with many experimental rows, is the more specific supported term.
    proposed_replacement_terms:
    - id: GO:0005765
      label: lysosomal membrane
    supported_by:
    - reference_id: PMID:22641697
      supporting_text: LAMP proteins retain TAPL on the limiting membrane of endosomes and prevent its
        sorting to intraluminal vesicles
