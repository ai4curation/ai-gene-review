- term:
    id: GO:0005769
    label: early endosome
  evidence_type: IDA
  original_reference_id: PMID:17977821
  qualifier: located_in
  negated: true
  review:
    summary: NOT early endosome. ABCB9 is not resident in early endosomes at steady state.
    action: ACCEPT
    reason: Quantitative immunofluorescence and subcellular fractionation placed TAPL in the LAMP-2-positive
      lysosomal compartment. A later RUSH trafficking study showed that newly made TAPL passes through
      the Golgi to lysosomes by a direct route, so any time in early endosomes is transient. This supports
      the negated steady-state claim.
    supported_by:
    - reference_id: PMID:17977821
      supporting_text: by using quantitative immunofluorescence and subcellular fractionation, TAPL was
        detected in the lysosomal compartment
    - reference_id: PMID:30877195
      supporting_text: we demonstrate that TAPL takes the direct route to lysosomes
- term:
    id: GO:0005783
    label: endoplasmic reticulum
  evidence_type: IDA
  original_reference_id: PMID:17977821
  qualifier: located_in
  negated: true
  review:
    summary: NOT endoplasmic reticulum. ABCB9 does not reside in the ER at steady state.
    action: ACCEPT
    reason: Endogenous TAPL in dendritic cells and macrophages is lysosomal and does not reconstitute
      ER peptide loading. The ER is only a biosynthetic transit compartment; TAPL is retained there only
      when TMD0 charged residues are mutated.
    supported_by:
    - reference_id: PMID:17977821
      supporting_text: TAPL alone or in combination with single TAP subunits does not form a functional
        transport complex required for peptide loading of MHC I in the endoplasmic reticulum
    - reference_id: PMID:30877195
      supporting_text: Substitutions of these residues retained TAPL in the endoplasmic reticulum (ER)
        or Golgi.
- term:
    id: GO:0005789
    label: endoplasmic reticulum membrane
  evidence_type: IDA
  original_reference_id: PMID:11011155
  qualifier: located_in
  review:
    summary: ER membrane localization reported from early transient overexpression of TAPL-GFP in COS-1
      and other cells.
    action: MARK_AS_OVER_ANNOTATED
    reason: The early GFP-fusion overexpression studies saw PDI/ER-marker colocalization. Later work with
      endogenous protein, stable expression and fractionation established that steady-state ABCB9 is in
      the lysosomal membrane, and that ER residence is either transient biosynthetic transit or a result
      of overexpression or misfolding. A curated NOT ER annotation (PMID:17977821) also exists. The ER
      membrane is therefore not a functional location of ABCB9.
    supported_by:
    - reference_id: PMID:11011155
      supporting_text: The TAPL-GFP fusion protein transiently expressed in Cos-1 cells was co-localized
        with PDI, suggesting that TAPL is inserted into endoplasmic reticulum membrane.
    - reference_id: PMID:21212514
      supporting_text: These results indicated that TAPL is a lysosomal ABC transporter but not a mitochondrial
        one.
    - reference_id: PMID:30877195
      supporting_text: we demonstrate that TAPL takes the direct route to lysosomes
- term:
    id: GO:0005789
    label: endoplasmic reticulum membrane
  evidence_type: IDA
  original_reference_id: PMID:1101155
  qualifier: located_in
  review:
    summary: ER membrane IDA attributed to PMID:1101155, which is a 1975 paper on alpha-1-antitrypsin
      in chronic obstructive lung disease.
    action: MARK_AS_OVER_ANNOTATED
    reason: The cited PMID is clearly a mis-keyed reference. The cached abstract is about Pi phenotype
      and alpha-1-antitrypsin in COPD patients and does not mention TAPL. The intended paper is almost
      certainly PMID:11011155 (Kobayashi et al. 2000, TAPL-GFP colocalized with PDI), one digit longer.
      The claim itself is given the same action as the other ER membrane rows, over-annotation, because
      steady-state ABCB9 is lysosomal.
    supported_by:
    - reference_id: PMID:1101155
      supporting_text: The authors studied 79 patients with chronic obstructive lung disease.
    - reference_id: PMID:11011155
      supporting_text: The TAPL-GFP fusion protein transiently expressed in Cos-1 cells was co-localized
        with PDI
    source_defects:
    - defect_type: WRONG_REFERENCE
      resource: MGI
      slot: DB:Reference
      requested_change: REPOINT
      asserted_value: PMID:1101155
      corrected_value: PMID:11011155
      cause: IDENTIFIER_TRANSPOSITION
      confidence: PROBABLE
      explanation: The ER-membrane IDA row for human ABCB9 cites PMID:1101155, a 1975 French study of
        alpha-1-antitrypsin phenotypes in COPD that does not concern TAPL. PMID:11011155 (Kobayashi et
        al. 2000, J Biochem), one digit longer, reports TAPL-GFP colocalization with PDI and is the likely
        intended reference.
      supported_by:
      - reference_id: PMID:1101155
        supporting_text: The authors studied 79 patients with chronic obstructive lung disease.
