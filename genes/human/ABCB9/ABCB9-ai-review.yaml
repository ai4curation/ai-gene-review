- term:
    id: GO:0005524
    label: ATP binding
  evidence_type: IDA
  original_reference_id: PMID:15863492
  qualifier: enables
  review:
    summary: ATP binding by the nucleotide-binding domain.
    action: ACCEPT
    reason: ABCB9 has a canonical ABC nucleotide-binding domain. Purified TAPL binds ATP-agarose, and
      its transport needs ATP hydrolysis. ATP binding is part of how the transporter works.
    supported_by:
    - reference_id: PMID:18175933
      supporting_text: Solubilized TAPL bound ATP-agarose and adenosine 5'-diphosphate (ADP)-agarose but
        not adenosine 5'-monophosphate (AMP)-agarose.
    - reference_id: PMID:15863492
      supporting_text: Different nucleotides bind and energize the transport with a slight predilection
        for purine bases.
