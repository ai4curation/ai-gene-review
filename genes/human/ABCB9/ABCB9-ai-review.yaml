core_functions:
- description: Homodimeric ATP-driven peptide translocase in the lysosomal limiting membrane. It moves
    cytosolic peptides of 6 to about 59 residues into the lysosomal lumen, preferring peptides with basic,
    aromatic or hydrophobic terminal residues. The protein is lysosomal and not at the cell surface; the
    TMD0 domain carries the lysosomal targeting signal and anchors LAMP-1/LAMP-2.
  molecular_function:
    id: GO:0015440
    label: ABC-type peptide transporter activity
  locations:
  - id: GO:0005765
    label: lysosomal membrane
  directly_involved_in:
  - id: GO:0015833
    label: peptide transport
  supported_by:
  - reference_id: PMID:15863492
    supporting_text: The peptide specificity is very broad, ranging from 6-mer up to at least 59-mer peptides
      with a preference for 23-mers.
  - reference_id: PMID:17977821
    supporting_text: we demonstrate a TAPL-specific translocation of peptides into isolated lysosomes,
      which strictly requires ATP hydrolysis
  - reference_id: PMID:20377823
    supporting_text: TMD0 alone, comprising a putative four transmembrane helix bundle, traffics to lysosomes.
suggested_questions:
- question: Which physiological peptide pools does ABCB9 deliver into lysosomes, and does its activity
    feed lysosomal MHC class II or TAP-independent cross-presentation pathways in dendritic cells?
- question: Does ABCB9 have a specialized role in Sertoli cells, where it is most highly expressed?
suggested_experiments:
- description: Peptidomics of lysosomes purified from ABCB9-knockout versus wild-type dendritic cells
    or macrophages, to define endogenous substrates and test for effects on MHC class II and cross-presentation.
- description: Surface biotinylation together with lysosome immunoprecipitation (LysoIP) of endogenous
    ABCB9, to confirm that no detectable cell-surface pool exists.
