id: Q9NP78
gene_symbol: ABCB9
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ABCB9 (TAPL, transporter associated with antigen processing-like) is a half-size ATP-binding
  cassette transporter of the ABCB subfamily that assembles as a homodimer in the limiting membrane of
  lysosomes and late endosomes. Each subunit has an N-terminal four-helix TMD0 domain, a six-helix core
  transmembrane domain and a cytosolic nucleotide-binding domain. The core dimer uses ATP hydrolysis to
  translocate a broad range of peptides (about 6 to 59 residues) from the cytosol into the lysosomal lumen,
  where they can be degraded. TMD0 carries the lysosomal targeting information and binds LAMP-1 and LAMP-2,
  which stabilize the transporter; it also binds YIF1B, which assists exit from the ER. ABCB9 is broadly
  expressed, with high levels in testis (Sertoli cells), and is induced when monocytes differentiate into
  dendritic cells and macrophages. Unlike TAP1/TAP2 it does not supply peptides for MHC class I loading
  in the ER.
