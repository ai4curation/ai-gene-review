- term:
    id: GO:0006518
    label: peptide metabolic process
  evidence_type: IDA
  original_reference_id: PMID:25646430
  qualifier: involved_in
  review:
    summary: Peptide metabolic process. ABCB9 delivers cytosolic peptides into lysosomes, where lysosomal
      hydrolases degrade them.
    action: MARK_AS_OVER_ANNOTATED
    reason: The cited papers measure ABCB9 peptide translocation and ATPase coupling in proteoliposomes.
      They do not show that ABCB9 catalyses any metabolic conversion of peptides. Lysosomal proteases
      carry out the degradation. ABCB9's contribution is transmembrane transport, which peptide transport
      and oligopeptide transmembrane transport already capture.
    supported_by:
    - reference_id: PMID:31417173
      supporting_text: TAPL forms a homodimeric transport complex, which translocates oligo- and polypeptides
        into the lumen of lysosomes driven by ATP hydrolysis.
