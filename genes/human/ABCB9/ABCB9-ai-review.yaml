- term:
    id: GO:0015421
    label: ABC-type oligopeptide transporter activity
  evidence_type: EXP
  original_reference_id: PMID:17977821
  qualifier: enables
  review:
    summary: ATP-dependent peptide translocation into lysosomes. This is the core activity of ABCB9.
    action: ACCEPT
    reason: TAPL activity has been shown in reconstituted proteoliposomes, single-liposome assays, isolated
      lysosomes and membrane vesicles, and it strictly requires ATP hydrolysis. Many substrates are in
      the oligopeptide range (the 9-mer reporter peptides). Substrates longer than 20 residues are also
      transported, so the sibling term ABC-type peptide transporter activity is equally apt. Both are
      kept.
    supported_by:
    - reference_id: PMID:15863492
      supporting_text: TAPL forms a homodimeric complex, which translocates peptides across the membrane.
        Peptide transport strictly requires ATP hydrolysis.
    - reference_id: PMID:17977821
      supporting_text: we demonstrate a TAPL-specific translocation of peptides into isolated lysosomes,
        which strictly requires ATP hydrolysis
    - reference_id: Reactome:R-HSA-5223317
      supporting_text: is a homodimeric ATP-dependent low affinity peptide transporter
