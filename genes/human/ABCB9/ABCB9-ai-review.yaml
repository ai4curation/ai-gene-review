existing_annotations:
- term:
    id: GO:0002474
    label: antigen processing and presentation of peptide antigen via MHC class I
  evidence_type: IDA
  original_reference_id: PMID:17977821
  qualifier: involved_in
  negated: true
  review:
    summary: NOT annotation. ABCB9 cannot replace TAP to load peptides onto MHC class I in the ER.
    action: ACCEPT
    reason: The cited study shows that TAPL does not restore MHC class I surface expression in TAP-deficient
      cells. That supports the negated claim. A possible lysosomal role in cross-presentation is still
      speculative and does not contradict this NOT annotation.
    supported_by:
    - reference_id: PMID:17977821
      supporting_text: TAPL does not, however, restore MHC class I surface expression in TAP-deficient
        cells
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:21194361
  qualifier: enables
  supporting_entities:
  - UniProtKB:P11279
  - UniProtKB:P13473
  review:
    summary: Generic protein binding (LAMP-1, LAMP-2, YIF1B and their orthologs) through the TMD0 domain.
    action: REMOVE
    reason: The protein-binding policy treats bare GO:0005515 as uninformative. The interactions with
      LAMP-1/LAMP-2 (which stabilize TAPL in the lysosomal limiting membrane) and with YIF1B (which assists
      ER-to-Golgi trafficking) are real. However, no specific molecular-function term describes them better,
      and the interaction alone gives no evidence for one. Removing the rows does not dispute that the
      interactions happen.
    supported_by:
    - reference_id: PMID:22641697
      supporting_text: The interaction interface with LAMP was mapped to the four-transmembrane helices
        constituting the N-terminal domain of TAPL (TMD0).
    - reference_id: PMID:30877195
      supporting_text: An interactome analysis revealed that Yip1-interacting factor homolog B membrane-trafficking
        protein (YIF1B) interacts with TAPL.
