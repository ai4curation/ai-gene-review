id: Q8TE99
gene_symbol: PXYLP1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  PXYLP1 is a type II Golgi membrane 2-phosphoxylose phosphatase that dephosphorylates xylose
  in the proteoglycan glycosaminoglycan-protein linkage region. This xylose dephosphorylation
  step allows efficient chondroitin sulfate and heparan sulfate chain initiation and elongation
  after linker synthesis.
