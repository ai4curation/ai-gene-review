proposed_new_terms:
- proposed_name: 2-phosphoxylose phosphatase activity
  proposed_definition: Catalysis of the dephosphorylation of a 2-O-phosphorylated xylose
    residue in the glycosaminoglycan-protein linkage region of a proteoglycan, yielding 
    a dephosphorylated xylose residue and phosphate.
  justification: >-
    Human PXYLP1 catalyzes a specific Golgi reaction in the proteoglycan linkage region, but
    the closest asserted GO molecular-function term is the uninformative parent phosphatase
    activity.
  proposed_parent:
    id: GO:0016791
    label: phosphatase activity
