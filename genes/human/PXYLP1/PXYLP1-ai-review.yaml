    label: positive regulation of heparan sulfate proteoglycan biosynthetic process
  evidence_type: IMP
  original_reference_id: PMID:24425863
  qualifier: involved_in
  review:
    summary: >-
      The heparan sulfate regulation row overstates PXYLP1's catalytic step.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      XYLP knockdown reduced glycosaminoglycan chains including heparan sulfate
      chains by leaving phosphorylated linker intermediates that block
      polymerization. PXYLP1 catalyzes that linkage-region maturation step rather
      than acting as a generic upstream positive regulator of heparan sulfate
      proteoglycan biosynthesis.
    supported_by:
    - reference_id: PMID:24425863
      supporting_text: >-
        Here, we identified a novel protein that dephosphorylates the Xyl residue and designated
        it 2-phosphoxylose phosphatase.
