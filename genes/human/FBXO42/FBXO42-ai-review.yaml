- term:
    id: GO:0031146
    label: SCF-dependent proteasomal ubiquitin-dependent protein catabolic process
  evidence_type: IDA
  original_reference_id: PMID:36129980
  qualifier: involved_in
  review:
    summary: >-
      The cited paper's main finding is non-degradative K63-linked ubiquitination of RBPJ
      ("K175 ubiquitination did not affect the turnover rate of RBPJ"); it reiterates the
      earlier p53-degradation function and shows p53 levels in FBXO42 KO cells. The process term
      is nonetheless well supported for FBXO42 by other human studies: SCF(FBXO42) degrades p53
      (PMID:19509332, PMID:21127074) and holoenzyme-free PP2Ac (PMID:41986709).
    action: ACCEPT
    reason: >-
      The claim that FBXO42 takes part in SCF-dependent proteasomal protein catabolism is true:
      FBXO42 depletion lengthens PP2Ac half-life, and PP2Ac is ubiquitinated by reconstituted
      SCF(FBXO42) in vitro (PMID:41986709). The curator had the full text and may have relied
      on the p53 data in the KO cells. Because the evidence is adequate elsewhere, the row is
      accepted rather than second-guessed, but the RBPJ modification it is best known for is
      explicitly non-degradative.
    supported_by:
    - reference_id: PMID:41986709
      supporting_text: Under normal conditions in HOP-62 cells, the PP2Ac half-life is
        approximately 36 h; FBXO42 depletion extends the PP2Ac half-life to nearly 60 h
    - reference_id: PMID:41986709
      supporting_text: suggesting that PP2Ac is targeted by FBXO42 for proteasomal degradation
    - reference_id: PMID:19509332
      supporting_text: We showed that JFK promotes ubiquitination and degradation of p53.
