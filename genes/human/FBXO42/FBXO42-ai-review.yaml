- term:
    id: GO:1990756
    label: ubiquitin-like ligase-substrate adaptor activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - FB:FBgn0034704
  - PANTHER:PTN002924600
  review:
    summary: >-
      PAINT assertion at the FBXO42 node PTN002924600; human FBXO42 is a descendant (PTHR46432:SF1).
      Substrate-adaptor activity is experimentally established for the human protein itself with
      several substrates.
    action: ACCEPT
    reason: >-
      The F-box links FBXO42 to SKP1-CUL1 and the Kelch domain binds substrates (RBPJ NTD,
      phospho-p53, the methylated PP2Ac tail). Deleting either domain abolishes substrate
      ubiquitination (PMID:36129980, PMID:41986709). This is the core molecular function.
    supported_by:
    - reference_id: PMID:36129980
      supporting_text: The FBXO42 F-box domain, which links FBXO42 to other components in the SCF
        complex, was required for RBPJ polyubiquitination
    - reference_id: PMID:41986709
      supporting_text: FBXO42 contains an N-terminal F-box motif that binds to the SKP1–CUL1–RBX1
        scaffold, and a C-terminal Kelch β-propeller to recognize putative substrate proteins for
        ubiquitination
- term:
    id: GO:1990756
    label: ubiquitin-like ligase-substrate adaptor activity
  evidence_type: IDA
  original_reference_id: PMID:36129980
  qualifier: enables
  review:
    summary: >-
      FBXO42 binds RBPJ directly, both in vitro and in cells, through its Kelch domain, and it
      needs both its F-box and its Kelch domain to promote K63-linked polyubiquitination of RBPJ
      at Lys175. The neddylation inhibitor MLN4924 blocks this, which shows that cullin-RING
      ligase activity is required.
    action: ACCEPT
    reason: >-
      This is direct evidence that FBXO42 bridges a substrate to the SCF ligase. Activity is
      F-box-dependent and Kelch-dependent and requires neddylation. The cryo-EM and in vitro
      reconstitution with PP2Ac corroborate it (PMID:41986709).
    supported_by:
    - reference_id: PMID:36129980
      supporting_text: Together, these data demonstrated the direct interaction between RBPJ and
        FBXO42 both in vitro and in cells, which was mediated by the NTD of RBPJ and the Kelch domain
        of FBXO42.
    - reference_id: PMID:36129980
      supporting_text: The Kelch domain of FBXO42, which mediates its interaction with RBPJ, was
        also required for RBPJ polyubiquitination
    - reference_id: PMID:41986709
      supporting_text: In an in vitro ubiquitination reaction, we observed that the FBXO42(Δ1BC)
        mutant can partially ubiquitinate PP2Ac, while the FBXO42(Δ2BC) and deletion combination
        fully abrogated activity
- term:
    id: GO:0070534
    label: protein K63-linked ubiquitination
  evidence_type: IDA
  original_reference_id: PMID:36129980
  review:
    summary: >-
      Proposed new annotation. SCF(FBXO42) mediates K63-linked (not K48-linked)
      polyubiquitination of RBPJ at Lys175. The modification does not change RBPJ turnover; it
      strengthens RBPJ binding to chromatin and chromatin-remodelling complexes.
    action: NEW
    reason: >-
      The participation test is met. As the substrate-recognition subunit, FBXO42 does part of
      the work of the ubiquitination step: its Kelch domain binds the RBPJ NTD, and both the
      F-box and the Kelch domain are required. Linkage specificity was shown with
      single-lysine ubiquitin mutants. This is a separate claim from proteasomal catabolism and
      is not covered by any existing row. It is non-core: it describes one substrate's outcome.
    supported_by:
    - reference_id: PMID:36129980
      supporting_text: we found only overexpressing K63 ubiquitin with FBXO42 promoted substantial
        RBPJ polyubiquitylation, indicating that FBXO42 specifically promotes RBPJ K63-linked
        polyubiquitination
    - reference_id: PMID:36129980
      supporting_text: K175 ubiquitination did not affect the turnover rate of RBPJ, indicating that
        it does not mediate RBPJ proteolytic degradation
- term:
    id: GO:0045747
    label: positive regulation of Notch signaling pathway
  evidence_type: IMP
  original_reference_id: PMID:36129980
  review:
    summary: >-
      Proposed new annotation. In FBXO42-knockout cells, Notch target-gene activation is reduced,
      and only wild-type FBXO42 restores it. A ubiquitination-defective RBPJ K175R mutant does not
      support it. FBXO42 depletion also attenuates Notch-driven leukaemia in vivo.
    action: NEW
    reason: >-
      FBXO42 acts directly on the pathway's core transcription factor RBPJ, modifying it so that
      it binds chromatin, and the authors show the effect on Notch output is mechanistically
      linked to that modification. The regulation is therefore direct rather than an indirect
      phenotype. It is kept non-core because it is one of several substrate-specific outcomes,
      and so far it is supported by a single study.
    supported_by:
    - reference_id: PMID:36129980
      supporting_text: Together, these findings suggested that FBXO42 positively regulated Notch
        signaling by promoting K63-linked polyubiquitination of RBPJ at K175.
