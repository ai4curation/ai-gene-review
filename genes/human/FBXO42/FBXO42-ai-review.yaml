gene_symbol: FBXO42
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  FBXO42 (also called JFK, "just one F-box and Kelch domain-containing protein") is a
  717-residue F-box protein with an N-terminal F-box (residues 44-93) followed by a six-bladed
  Kelch beta-propeller (Pfam Beta-prop_FBX42) and a largely disordered C-terminal region. It is
  the substrate-recognition subunit of an SCF (SKP1-CUL1-RBX1) cullin-RING ubiquitin ligase:
  the F-box binds SKP1, and the Kelch propeller binds substrates. Several human substrates are
  established. SCF(FBXO42) recognises p53 after phosphorylation of its core domain by the
  COP9 signalosome-associated kinase and promotes its ubiquitination and degradation. It also
  degrades holoenzyme-free PP2A catalytic subunit (PP2Ac): the coiled-coil protein CCDC6 forms
  a dimeric template that presents PP2Ac, and the carboxy-methylated PP2Ac C-terminal tail is
  read in the central pore of the Kelch propeller, as shown by a cryo-EM structure. Some of its
  ubiquitination is non-degradative. It mediates lysine-63-linked polyubiquitination of the
  Notch transcriptional effector RBPJ at Lys175, which strengthens RBPJ association with
  chromatin and chromatin remodellers and supports Notch target-gene activation. It also
  ubiquitinates the PP4C-PP4R2-PP4R3 phosphatase complex, mainly with non-degradative chains,
  and so restrains PP4 activity. FBXO42 is mostly nuclear. In cancer-cell CRISPR screens, cells
  lacking it are hypersensitive to antimitotic drugs and ATR inhibitors and show aberrant
  mitoses.
