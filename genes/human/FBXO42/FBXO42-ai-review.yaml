      (PMID:36129980), and SCF(FBXO42) with RBX1 was reconstituted and solved by cryo-EM with its
      CCDC6-PP2Ac substrate (PMID:41986709). The node placement is therefore correct for the
      human protein.
    supported_by:
    - reference_id: PMID:21127074
      supporting_text: JFK destabilizes p53 through the assembly of a Skp1-Cul1-F-box complex
    - reference_id: PMID:41986709
      supporting_text: FBXO42 contains an N-terminal F-box motif that binds to the SKP1–CUL1–RBX1
        scaffold, and a C-terminal Kelch β-propeller to recognize putative substrate proteins for
        ubiquitination
