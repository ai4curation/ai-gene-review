suggested_questions:
- question: >-
    What decides whether SCF(FBXO42) builds degradative chains (on p53 and PP2Ac) or
    non-degradative chains (K63 on RBPJ, K33-preferring on PP4C)? Is the choice set by the
    substrate's presentation (for example the CCDC6 template) or by the E2 enzymes that are
    recruited?
- question: >-
    Mouse Fbxo42 is reported (by similarity in UniProt) to target ACAA2 in hepatocytes. Does
    human FBXO42 regulate ACAA2 and fatty-acid beta-oxidation, and is this conserved across the
    PTHR46432:SF1 clade that includes fly Fbxo42?
- question: >-
    Is the antimitotic-drug hypersensitivity of FBXO42-null cells explained by unrestrained PP4
    and PP2A activity during mitosis, or does FBXO42 have a direct mitotic substrate?
suggested_experiments:
- description: >-
    Ubiquitin-linkage profiling (Ub-AQUA or linkage-specific binders) of the products of
    reconstituted SCF(FBXO42) with p53, PP2Ac-CCDC6, RBPJ and PP4C, using a defined panel of
    E2 enzymes, to determine whether the substrate or the E2 dictates chain type.
- description: >-
    Kelch-pore mutants (W192A, G284F) that separate PP2Ac tail recognition from RBPJ or p53
    binding, tested by rescue in FBXO42-knockout cells, to assign which substrate accounts for
    the mitotic and fitness phenotypes.
