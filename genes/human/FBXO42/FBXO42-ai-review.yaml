  review:
    summary: >-
      PAINT placed SCF-complex membership at PTN002924600, the FBXO42 node of PTHR46432; human
      FBXO42 (PTHR46432:SF1, together with mouse Q6PDJ6 and fly Q9W281) descends from it. Human
