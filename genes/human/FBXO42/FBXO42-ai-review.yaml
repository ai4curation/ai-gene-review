core_functions:
- description: >-
    Substrate-recognition (F-box/Kelch) subunit of the nuclear SCF(FBXO42) cullin-RING ubiquitin
    ligase. The Kelch propeller binds substrates and the F-box binds SKP1, which brings substrates
    to CUL1-RBX1 for polyubiquitination. Substrates whose ubiquitination leads to proteasomal
    degradation are p53 phosphorylated by the CSN-associated kinase, and holoenzyme-free,
    carboxy-methylated PP2Ac presented on a CCDC6 template.
  molecular_function:
    id: GO:1990756
    label: ubiquitin-like ligase-substrate adaptor activity
  locations:
  - id: GO:0005634
    label: nucleus
  in_complex:
    id: GO:0019005
    label: SCF ubiquitin ligase complex
  directly_involved_in:
  - id: GO:0031146
    label: SCF-dependent proteasomal ubiquitin-dependent protein catabolic process
  supported_by:
  - reference_id: PMID:41986709
    supporting_text: Here we show a key role for the ubiquitin-proteasome system in regulating
      PP2Ac through the SCFFBXO42 complex.
  - reference_id: PMID:21127074
    supporting_text: JFK destabilizes p53 through the assembly of a Skp1-Cul1-F-box complex
- description: >-
    SCF(FBXO42) substrate adaptor for non-degradative K63-linked polyubiquitination of the Notch
    transcriptional effector RBPJ at Lys175. The modification promotes RBPJ chromatin binding
    and Notch target-gene activation.
  molecular_function:
    id: GO:1990756
