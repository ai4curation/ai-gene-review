    action: KEEP_AS_NON_CORE
    reason: >-
      This is the weakest row in the set. It maps UniProt-SubCell SL-0162, whose only basis
      is the entry line "Membrane {ECO:0000255}; Single-pass membrane protein
      {ECO:0000255}" - a sequence prediction from TRANSMEM 103..123, with no experimental tag
      anywhere. Two considerations keep it from being marked over-annotated. First, the
      predicted helix is well placed rather than arbitrary: the alignment in
      ADCK2-bioinformatics/ shows ADCK2 preserves the transmembrane-helix then KxGQ then
      kinase-domain arrangement of COQ8A, whose own membrane anchor is annotated at the
      corresponding position, and the yeast orthologue Cqd1 has been shown experimentally to
      be an inner membrane protein. Second, nothing contradicts it: the protease-protection
      experiment on endogenous human ADCK2 is explicitly indecisive between the matrix and
      the inner membrane, so it neither confirms nor refutes membrane association. The honest
      position is that GO:0016020 is plausible and unmeasured, so it is kept but excluded
      from the core function statement, and resolving the sub-mitochondrial location is filed
      as a suggested experiment. No more specific term is proposed, because doing so would
      mean transferring the yeast IDA onto the human protein.
