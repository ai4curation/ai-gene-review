      mitochondrial membrane
  - reference_id: PMID:34362905
    supporting_text: Loss of Cqd1 skews cellular CoQ distribution away from mitochondria
  - reference_id: PMID:27499294
    supporting_text: >-
      Even with a nucleotide bound, the KxGQ motif is positioned to occlude the typical
      peptide substrate binding site and preclude in trans protein phosphorylation.
proposed_new_terms:
- proposed_name: intracellular coenzyme Q distribution
  proposed_definition: >-
    The directed movement and partitioning of coenzyme Q (ubiquinone) between the
    mitochondrial inner membrane, where it is synthesised, and other cellular membranes,
    resulting in the establishment or maintenance of the relative sizes of the mitochondrial
    and extramitochondrial coenzyme Q pools.
  proposed_parent:
    id: GO:0032365
    label: intracellular lipid transport
  justification: >-
    GO can currently express only the synthesis and breakdown of ubiquinone. The absence was
    established by two complementary sweeps that could each have returned a hit, in
    ADCK2-bioinformatics/coq_transport_term_check.py. A label sweep retrieves all 102 GO
    terms whose label mentions ubiquinone, coenzyme Q, quinone or quinol. Every
    transport-flavoured term among them is set aside on one of two grounds, both printed by
    the script with the candidate they apply to. Most are electron-transport terms, where
    the electron is the cargo and the quinone merely the acceptor. One, GO:1903222
    quinolinic acid transmembrane transport, is a genuine transport process and is excluded
    instead because it matched only through a substring accident - quinol is contained in
    quinolinic - and quinolinic acid is a tryptophan-pathway NAD precursor unrelated to
    coenzyme Q. A branch sweep enumerates the descendants of GO:0006869 lipid transport,
    GO:0010876 lipid localization, GO:0032365 intracellular lipid transport, GO:0120009
    intermembrane lipid transfer and GO:0006810 transport - 2584 distinct terms, the roots
    being nested - and finds no ubiquinone-specific child. So no GO term describes the
    movement or partitioning of coenzyme Q itself. Yet that is precisely the
    characterised activity of a whole UbiB sub-branch: Cqd1 and Cqd2
    reciprocally control where CoQ ends up in the cell, and loss of Cqd1 shifts it away from
    mitochondria. Curators of those two yeast genes therefore have no term that states what
    was measured, and the same gap is why the human ADCK2 evidence has to be recorded as
    regulation of a biosynthetic process even though the paper's own conclusion is a
    trafficking defect. The immediate holders of this term would be yeast Cqd1 and Cqd2, not
    ADCK2 - human ADCK2 has not been shown to distribute CoQ and is proposed only as a
    candidate once the orthology is tested functionally.
  supported_by:
  - reference_id: PMID:34362905
    supporting_text: >-
      we identify two highly conserved but poorly characterized mitochondrial proteins,
      Ypl109c (Cqd1) and Ylr253w (Cqd2), that reciprocally affect this process
  - reference_id: PMID:34362905
    supporting_text: Loss of Cqd1 skews cellular CoQ distribution away from mitochondria
  - reference_id: PMID:31480808
    supporting_text: >-
      which indicated a defect in intracellular trafficking of isoprenoid and cholesterol
      from the cytoplasm
suggested_questions:
- question: >-
    Should UniProt withdraw EC=2.7.11.- and the Serine/threonine-protein kinase keyword from
    Q7Z695? The entry currently asserts protein-serine/threonine kinase activity in three
    machine-readable fields - the EC number in the RecName, the keyword set, and the
    keyword-derived DR GO line for GO:0004674 - while its own FUNCTION comment states that it
    is not known whether the protein has protein kinase activity or what residue class it
    would phosphorylate. EC 2.7.11.- specifically means protein-serine/threonine kinase, so
    the machine-readable layer is more committed than any evidence supports, and more
    committed than the curated prose in the same entry. The family context makes this
    sharper: GOA records NOT|enables GO:0004672 for both characterised members on the basis
    of PMID:27499294. Note that GOA itself no longer carries the keyword-derived rows, so
    this defect is invisible from the GO annotation set and can only be fixed upstream. The
    ask is deliberately scoped to the protein-kinase claims and does not extend to the
    ATP-binding and Nucleotide-binding keywords or their GO:0005524 cross-reference: this
    review's own alignment finds the beta3 lysine, the catalytic aspartate and asparagine
    and the DFG-equivalent aspartate all intact, so nucleotide binding is the best-supported
    part of the keyword set. It is still not demonstrated for ADCK2, and the family gives a
    concrete reason for caution about the ligand's identity rather than its existence, since
    COQ8A binds ADP in preference to ATP and carries GO:0043531 rather than GO:0005524. So
    GO:0005524 should be re-examined on ligand identity, not withdrawn as unfounded.
  experts:
  - UniProt curation
  - GO Consortium
- question: >-
    Can the GO record for GO:0004672 on COQ8A and COQ8B be reconciled? Both genes
    simultaneously hold a NOT|enables IDA from PMID:27499294 and a positive assertion: COQ8B
    an enables IDA from PMID:38425362, which reports in vitro phosphorylation of COQ3, and
    COQ8A an enables ISS propagated from COQ8B under GO_REF:0000024. A gene asserting both
    that it does and does not enable the same molecular function is a contradiction that
    downstream consumers cannot resolve, and it directly affects how confidently anything can
    be said about kinase activity elsewhere in the family, including ADCK2.
  experts:
  - GO Consortium
  - UniProt curation
- question: >-
    Is human ADCK2 the functional orthologue of yeast Cqd1 for coenzyme Q distribution, and
    is ADCK1 the orthologue of Cqd2? PANTHER places ADCK2 with YPL109C/Cqd1 in PTHR45890:SF1
    and ADCK1 with YLR253W/Mcp2/Cqd2 in PTHR43173:SF19, matching the assignment proposed by
    the authors who characterised the two yeast genes. A residue-level check agrees: in the
    alignment in ADCK2-bioinformatics/, the position equivalent to COQ8A A339 carries
    glycine in exactly two of the eight UbiB proteins examined, ADCK2 and Cqd1, while all
    six others including Cqd2 and ADCK1 carry the suppressor alanine - so a single residue
    reproduces the pairing. This is a second sequence-based line agreeing with the genetics
    rather than a third independent line, because PANTHER's subfamily assignment is itself
    sequence-derived; and it is specific to that column, since the adjacent A-rich position
    carries glycine in four proteins and cuts across the pairing. Because Cqd1 and Cqd2 have
    reciprocal effects
    on CoQ partitioning, this predicts that ADCK2 and ADCK1 should act in opposite directions
    in human cells - a prediction that has not been tested and that matters for whether the
    two genes should ever receive shared annotations.
  experts:
  - Coenzyme Q biology
  - PAINT curation
- question: >-
    Where in the mitochondrion does human ADCK2 sit? The only human measurement is protease
    protection, which is explicitly indecisive between the matrix and the inner membrane,
    while yeast Cqd1 has been localised to the inner membrane at an inner-outer contact site
    with Por1 and Om14, and the authors expect that arrangement to be conserved to human.
    Resolving this would decide whether GO:0016020 should become GO:0005743 or GO:0044289 and
    whether ADCK2 belongs to a human counterpart of that contact site.
  experts:
  - Mitochondrial cell biology
suggested_experiments:
- hypothesis: >-
    ADCK2 is an unorthodox protein-kinase-like enzyme that hydrolyses ATP but does not
    phosphorylate protein substrates in trans, as shown for COQ8A and COQ8B.
  description: >-
    Purify recombinant human ADCK2 lacking its N-terminal membrane segment, as was done for
    COQ8A, and measure nucleotide binding, ATPase activity, and phosphotransfer to generic
    peptide substrates. Compare wild type with the catalytic-site mutants identified by this
    review's alignment - K311 in the beta3 strand, D445 the proton acceptor, and D493 in the
    DFG-equivalent motif - to establish that any activity observed is ADCK2's own rather than
    a contaminating kinase. This is the single missing measurement behind almost every open
    question on this gene, and it is the assay that resolved the equivalent question for
    COQ8A.
  experiment_type: in vitro enzymology
- hypothesis: >-
    ADCK2's A-rich loop, which carries glycine where COQ8A carries the alanines that suppress
    phosphotransfer, makes the ADCK2 branch of the family more permissive for
    autophosphorylation than the COQ8 branch, without conferring in-trans protein kinase
    activity while the KxGQ motif remains intact.
  description: >-
    On purified ADCK2, compare autophosphorylation and peptide phosphorylation for wild type
    against a G207A/G209A variant that installs the COQ8A-like suppressor alanines, and
    against a KxGQ mutant at K147. The prediction that discriminates the two readings is that
    the glycine-to-alanine swap should reduce autophosphorylation while leaving in-trans
    activity absent in every variant that retains the KxGQ motif. Stated explicitly as a
    hypothesis: the sequence divergence found here is suggestive and has not been tested.
  experiment_type: structure-function mutagenesis
- hypothesis: >-
    Human ADCK2 acts on the delivery of CoQ precursors into mitochondria rather than on the
    biosynthetic reactions, and does so in the direction opposite to ADCK1.
  description: >-
    Repeat the 3H-mevalonate partitioning experiment in isogenic ADCK2 and ADCK1 knockouts in
    the same human cell line, measuring labelled CoQ and cholesterol separately in whole-cell
    and mitochondrial fractions, and quantify the mitochondrial versus extramitochondrial CoQ
    pools directly by lipidomics. The reciprocal-orthologue model predicts opposite shifts in
    the mitochondrial CoQ fraction for the two knockouts; a same-direction result would
    falsify the Cqd1/Cqd2 mapping in human cells.
  experiment_type: isotope labelling and subcellular lipidomics
- hypothesis: >-
    ADCK2 occupies an inner-membrane contact site analogous to the yeast Cqd1-Por1-Om14
    complex.
  description: >-
    Determine ADCK2's sub-mitochondrial location and topology in human cells by carbonate
    extraction and by protease protection of mitoplasts rather than intact mitochondria,
    which is the step that would discriminate matrix from inner membrane where the published
    experiment could not, and test by proximity labelling whether VDAC family proteins, the
    human counterparts of Por1, are enriched around ADCK2.
  experiment_type: subcellular fractionation and proximity labelling
