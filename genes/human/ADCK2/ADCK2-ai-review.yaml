        mRNA and protein levels in dermal fibroblasts
    - reference_id: PMID:34362905
      supporting_text: Loss of Cqd1 skews cellular CoQ distribution away from mitochondria
core_functions:
- description: >-
    ADCK2 sustains the mitochondrial pool of coenzyme Q, most critically in skeletal muscle.
    Loss of one functional allele in human, and heterozygous disruption in mouse, lower
    muscle CoQ and produce a lipid-storage mitochondrial myopathy that CoQ10 supplementation
    partly corrects. The point at which it acts is delivery rather than synthesis: isotope
    labelling of ADCK2-deficient cells shows normal total cellular production of isoprenoid
    and cholesterol with depletion confined to the mitochondrial fraction, so ADCK2 sets how
    much precursor reaches the organelle and therefore modulates the rate and extent of
    mitochondrial CoQ accumulation, rather than catalysing a step of the pathway as COQ8A and
    COQ8B do. Its budding-yeast orthologue Cqd1 governs the same partitioning in the same
    direction, and human ADCK2 restores CoQ synthesis to yeast lacking that gene. The
    impaired fatty-acid beta-oxidation seen in patient and mouse tissue is a downstream
    consequence of the CoQ deficit, not a separate activity. ADCK2 acts inside mitochondria,
    where endogenous protein is protease-protected and is either in the matrix or bound to
    the inner membrane. No molecular function is asserted here: the protein preserves an
    intact protein-kinase-like catalytic site but also the UbiB-specific KxGQ motif that
    occludes the peptide-substrate groove in COQ8A, and it has never been purified or
    assayed, so neither a protein kinase, a small-molecule kinase, nor an ATPase activity can
    be claimed for it.
  directly_involved_in:
  - id: GO:0010795
    label: regulation of ubiquinone biosynthetic process
