- term:
    id: GO:0010795
    label: regulation of ubiquinone biosynthetic process
  evidence_type: IDA
  original_reference_id: PMID:31480808
  qualifier: involved_in
  review:
    summary: >-
      Correct, and correct at the right level. The curator's choice of the regulation term
      over the biosynthetic-process term is confirmed by the paper's own isotope-labelling
      experiment, which shows total synthesis is unaffected and only the mitochondrial pool
      is depleted. This is the gene's core biological role.
    action: ACCEPT
    reason: >-
      Three independent systems support involvement in maintaining the CoQ pool: a human
      nonsense allele (R333*, matching UniProt VARIANT 333..626 Missing) that lowers CoQ10 in
      patient fibroblasts and is rescued by re-expressing wild-type ADCK2; Adck2 heterozygous
      mice with reduced CoQ9 and CoQ10 in skeletal muscle; and heterologous complementation
      in which human ADCK2 restores CoQ6 synthesis to yeast lacking YPL109C. The choice of
      GO:0010795 over GO:0006744 ubiquinone biosynthetic process, which COQ8A and COQ8B
      correctly hold, was tested rather than assumed and is right: 3H-mevalonate labelling
      found total cellular CoQ and cholesterol synthesis unchanged in Adck2-deficient cells,
      with only the mitochondrial fraction depleted, so ADCK2 modulates the rate and extent
      of mitochondrial CoQ accumulation rather than catalysing a pathway step. That reading
      is reinforced by the orthologue, since loss of yeast Cqd1 shifts CoQ away from
      mitochondria. One observation for the record rather than a proposed change: the assays
      behind this row are loss-of-function and complementation rather than a direct assay of
      purified ADCK2, so the underlying experiments are IMP-shaped, but the term itself is
      right and the evidence code is the assigning curator's call on the full text.
