id: Q7Z695
gene_symbol: ADCK2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  ADCK2 (aarF domain-containing kinase 2) is a mitochondrial protein of the UbiB family,
  an ancient group of atypical protein-kinase-like enzymes that also contains COQ8A/ADCK3,
  COQ8B/ADCK4, ADCK1 and ADCK5. It is required to maintain the mitochondrial pool of
  coenzyme Q (ubiquinone) in skeletal muscle. Human haploinsufficiency for ADCK2, and
  heterozygous loss of Adck2 in mouse, lower muscle CoQ, impair mitochondrial fatty acid
  beta-oxidation and produce a lipid-storage mitochondrial myopathy with hepatic steatosis
  that is partly corrected by CoQ10 supplementation; the beta-oxidation defect follows from
  the CoQ deficit rather than from a separate lipid-handling activity. Isotope labelling
  shows that total cellular synthesis of isoprenoids and CoQ is normal in ADCK2-deficient
  cells and that only the mitochondrial pool is depleted, so ADCK2 acts on the delivery of
  CoQ precursors to the organelle rather than catalysing a step of the biosynthetic pathway;
  consistent with this, its budding-yeast orthologue Cqd1 (YPL109C) controls the
  partitioning of CoQ between mitochondria and the rest of the cell, and human ADCK2
  restores CoQ synthesis to yeast lacking YPL109C. The protein is confined to mitochondria,
  where protease protection places it in the matrix or bound to the inner membrane, and it
  carries a predicted single-pass transmembrane helix in the position occupied by the
  membrane anchor of COQ8A. ADCK2 retains an intact protein-kinase-like catalytic site
  together with the UbiB-specific KxGQ motif that, in COQ8A, occludes the peptide-substrate
  groove; no catalytic activity, substrate or nucleotide preference has been measured for
  ADCK2 itself.
references:
- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PAINT phylogenetic propagation, supporting the single IBA row. All four WITH/FROM
      tokens were resolved against UniProt and each non-self source was queried in QuickGO
      for its own evidence for the propagated term. The node PTN000059786 was also queried
      directly: it propagates 49 annotations over 49 distinct gene products (counts verified
      equal, result unpaginated) to exactly one term, GO:0005739, and its reach is the
      ADCK2/Cqd1 orthologue group - yeast YPL109C is under it, yeast Mcp2/Cqd2, the ADCK1
      donor, is not. No propagation defect found in either direction.
- id: GO_REF:0000044
  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot Subcellular Location
    vocabulary mapping, accompanied by conservative changes to GO terms applied by
    UniProt
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Maps two UniProt SUBCELLULAR LOCATION tokens to GO. The mitochondrion mapping
      (SL-0173) rests on the entry line "SUBCELLULAR LOCATION: Mitochondrion
      {ECO:0000269|PubMed:33988507}", so it is experimentally grounded and redundant with
      three independent experimental rows. The membrane mapping (SL-0162) rests on
      "Membrane {ECO:0000255}; Single-pass membrane protein {ECO:0000255}", a sequence
      prediction only, which makes it the weakest row in this review even though the
      predicted helix is well placed.
- id: PMID:27499296
  title: Mitochondrial Protein Interaction Mapping Identifies Regulators of Respiratory
    Chain Function.
  findings:
  - statement: >-
      Affinity-enrichment mass spectrometry survey of 50 poorly characterised mitochondrial
      proteins, in which ADCK2 was one of the baits. ADCK2 is not discussed anywhere in the
      article text; the SLC25A5 interaction it supplies lives in the supplementary dataset,
      so the paper offers no interpretation of it.
    supporting_text: >-
      we assessed condition-specific protein-protein interactions for 50 select MXPs using
      affinity enrichment mass spectrometry
    reference_section_type: ABSTRACT
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Correctly cited and a genuine experiment, but a weak basis for a GO annotation on this
      gene. Expanding the IntAct records shows UniProt's NbExp=4 is one anti-tag co-IP
      counted four times (three of the four spoke-expanded, MI-score 0.35), and the partner
      SLC25A5 carries 385 IntAct interaction evidences of its own.
- id: PMID:31480808
  title: ADCK2 Haploinsufficiency Reduces Mitochondrial Lipid Oxidation and Causes
    Myopathy Associated with CoQ Deficiency.
  findings:
  - statement: >-
      Endogenous ADCK2 fractionates with mitochondrial markers in HEK293 cells and is absent
      from ER and cytosol.
    supporting_text: >-
      The presence of ADCK2 was not detected in the endoplasmic reticulum and cytosolic
      fraction.
    reference_section_type: RESULTS
  - statement: >-
      Protease protection places ADCK2 inside the organelle but does not discriminate matrix
      from inner membrane, so it supports mitochondrion and is compatible with membrane
      without licensing a mitochondrial inner membrane annotation.
    supporting_text: >-
      consistent with its presence in the mitochondrial matrix or bound to the inner
      mitochondrial membrane
    reference_section_type: RESULTS
  - statement: >-
      The experiment that fixes the level of the biological-process term: total cellular
      synthesis of isoprenoid and cholesterol is unchanged in Adck2-deficient cells and only
      the mitochondrial fraction is depleted, so ADCK2 governs precursor delivery rather
      than catalysing a biosynthetic step.
    supporting_text: >-
      which indicated a defect in intracellular trafficking of isoprenoid and cholesterol
      from the cytoplasm
    reference_section_type: RESULTS
  - statement: >-
      Heterologous complementation establishes functional orthology between human ADCK2 and
      yeast YPL109C (Cqd1) and shows the human protein is competent to restore CoQ synthesis.
    supporting_text: >-
      yeast strain with wild type YPL109c or human ADCK2 construct rescued CoQ6 biosynthesis
    reference_section_type: RESULTS
  - statement: >-
      Deleting the yeast orthologue lowers CoQ, the phenotype the human allele complements.
    supporting_text: >-
      The deletion of YPL109c, the S. cerevisiae homolog of human ADCK2, caused a 40%
      decrease in the production of CoQ6
    reference_section_type: RESULTS
  - statement: >-
      The human allele is a nonsense variant reducing transcript and protein, matching
      UniProt VARIANT 333..626 Missing; the assay behind the GO:0010795 row is therefore
      loss-of-function plus rescue rather than a direct assay of purified ADCK2.
    supporting_text: >-
      The mutation produced a termination codon that led to a significant decrease in ADCK2
      mRNA and protein levels in dermal fibroblasts
    reference_section_type: RESULTS
  - statement: >-
      Fatty acid oxidation is impaired in Adck2-deficient cells. This is a phenotype of the
      CoQ deficit, partially rescued by CoQ10, and is not by itself evidence of a molecular
      function in lipid metabolism.
    supporting_text: >-
      palmitate-dependent OCR decreased in permeabilized MEFs lacking Adck2 compared to WT
      cells
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The only paper that characterises ADCK2 itself, and the source of both experimental
      rows attributed to it. Combines a human nonsense allele with patient fibroblasts, a
      heterozygous mouse, and yeast complementation. Checked as a possible complex-level
      projection (the ACTR8 pattern) and it is not one: the reference annotates only two
      entities, human ADCK2 and mouse Adck2, two terms each. No retraction, erratum or
      expression of concern.
- id: PMID:33988507
  title: A subcellular map of the human kinome.
  findings:
  - statement: >-
      Kinome Atlas imaged epitope-tagged, ectopically expressed kinases rather than
      endogenous protein, so this row corroborates the mitochondrial localisation but is not
      load-bearing for it.
    supporting_text: >-
      456 epitope-tagged kinases, representing 85% of the human kinome, were expressed in
      HeLa cells and imaged by immunofluorescent microscopy
    reference_section_type: ABSTRACT
  - statement: The authors state the overexpression caveat themselves.
    supporting_text: >-
      Although limited by possible mislocalization due to overexpression or epitope tagging
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Systematic imaging survey. Its conclusion for ADCK2 agrees with subcellular
      fractionation of endogenous protein in PMID:31480808 and with the MitoCoP proteome, so
      the overexpression caveat does not change the verdict. Note this paper is also the sole
      ECO:0000269 support for UniProt's SUBCELLULAR LOCATION line.
- id: PMID:34800366
  title: Quantitative high-confidence human mitochondrial proteome and its dynamics
    in cellular context.
  findings:
  - statement: >-
      MitoCoP is a curated high-confidence mitochondrial proteome, so inclusion is a
      filtered result rather than a raw detection; HTP is the appropriate evidence code.
    supporting_text: >-
      We classified >8,000 proteins in mitochondrial preparations of human cells and defined
      a mitochondrial high-confidence proteome of >1,100 proteins (MitoCoP).
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Proteome-scale survey; the QuickGO result for this reference is paginated (1235
      annotations), so an entity count is unavailable and the projection test is unreliable
      for it. That is not a defect here: HTP already signals the scale of the experiment.
- id: PMID:25498144
  title: Mitochondrial ADCK3 employs an atypical protein kinase-like fold to enable coenzyme
    Q biosynthesis.
  findings:
  - statement: >-
      Crystal structure of the family's archetype establishes that UbiB proteins carry
      features that suppress, rather than support, canonical protein kinase activity.
    supporting_text: >-
      we show that UbiB proteins adopt an atypical PKL fold with multiple UbiB-specific
      features positioned to inhibit protein kinase activity
    reference_section_type: ABSTRACT
  - statement: >-
      An alanine of the UbiB A-rich loop actively suppresses phosphotransfer; the A339G
      substitution removes that suppression.
    supporting_text: >-
      Collectively, these results demonstrate that ADCK3 A339 inhibits protein kinase
      activity in vitro.
    reference_section_type: RESULTS
  - statement: >-
      Relevant to ADCK2 because ADCK2 naturally carries glycine at both A-rich-loop positions
      where COQ8A carries the suppressor alanines.
    supporting_text: >-
      The A339G and A337G,A339G double mutations both enabled autophosphorylation
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Not an ADCK2 paper, but the structural basis for judging what the aarF/UbiB domain does
      and does not imply. Supplies the reference feature positions used by this review's own
      alignment in ADCK2-bioinformatics/.
- id: PMID:27499294
  title: Cerebellar Ataxia and Coenzyme Q Deficiency through Loss of Unorthodox Kinase
    Activity.
  findings:
  - statement: >-
      The family's two characterised members were shown not to carry canonical protein kinase
      activity. This is the curated basis for the NOT|enables GO:0004672 annotations that
      COQ8A and COQ8B both hold.
    supporting_text: >-
      Collectively, these results demonstrate that the enzymatic activities of mammalian
      COQ8A and yeast Coq8p are highly similar, and that neither catalyzes canonical protein
      kinase activity.
    reference_section_type: RESULTS
  - statement: >-
      The mechanism is steric occlusion by the KxGQ motif, which ADCK2 retains.
    supporting_text: >-
      Even with a nucleotide bound, the KxGQ motif is positioned to occlude the typical
      peptide substrate binding site and preclude in trans protein phosphorylation.
    reference_section_type: RESULTS
  - statement: >-
      The authors extend the inference to the whole family on the basis of the KxGQ motif,
      which is the specific reason this paper bears on ADCK2 rather than only on COQ8.
    supporting_text: >-
      we predict uPKL functionality to be conserved throughout this ancient protein family
    reference_section_type: DISCUSSION
  - statement: >-
      Guard against over-reading the A-rich loop divergence in ADCK2: the activity that loop
      suppresses is cis autophosphorylation, and it is dispensable in vivo.
    supporting_text: >-
      showing that the autophosphorylation observed in vitro is dispensable for function in
      vivo
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The primary source for the family-level negative on canonical protein kinase activity.
      Note it is PMID:27499294, one digit from PMID:27499296 (the unrelated AP-MS paper that
      supplies this gene's GO:0005515 row); both were fetched and read separately.
- id: PMID:38425362
  title: In vitro construction of the COQ metabolon unveils the molecular determinants of
    coenzyme Q biosynthesis.
  findings:
  - statement: >-
      A 2024 in vitro reconstitution reports that COQ8B does phosphorylate a protein
      substrate, partly contesting the earlier family-level negative. GOA now carries both a
      NOT|enables and an enables IDA for GO:0004672 on COQ8B as a result.
    supporting_text: >-
      COQ3, but not COQ6, is phosphorylated by COQ8B at multiple sites
    reference_section_type: RESULTS
  reference_review:
    relevance: MEDIUM
    correctness: DISPUTED
    review_notes: >-
      Correctly cited and methodologically substantial, but its central claim about protein
      kinase activity stands in direct contradiction to PMID:27499294 and UniProt records it
      only as "may act as a protein kinase". Included here specifically so that this review
      does not assert an unqualified family-level negative that the literature no longer
      supports.
- id: PMID:34362905
  title: UbiB proteins regulate cellular CoQ distribution in Saccharomyces cerevisiae.
  findings:
  - statement: >-
      Identifies ADCK2's yeast orthologue Cqd1 (YPL109C) and ADCK1's orthologue Cqd2
      (YLR253W) as UbiB proteins with reciprocal effects on where CoQ ends up in the cell.
    supporting_text: >-
      we identify two highly conserved but poorly characterized mitochondrial proteins,
      Ypl109c (Cqd1) and Ylr253w (Cqd2), that reciprocally affect this process
    reference_section_type: ABSTRACT
  - statement: >-
      The direction of the Cqd1 defect matches the human and mouse ADCK2 phenotype, in which
      only the mitochondrial CoQ pool is depleted.
    supporting_text: Loss of Cqd1 skews cellular CoQ distribution away from mitochondria
    reference_section_type: ABSTRACT
  - statement: >-
      The orthology assignment used throughout this review is the authors' own, and it
      matches PANTHER's node structure exactly.
    supporting_text: >-
      it will be important to determine if functional conservation exists between Cqd1 and
      Cqd2 and their putative human orthologs, ADCK2 and ADCK1/5, respectively
    reference_section_type: DISCUSSION
  - statement: >-
      Cqd1's dependence on catalytic residues is genetic, not biochemical - the protein has
      never been purified, so no direct activity measurement exists for this branch of the
      family.
    supporting_text: Unlike COQ8, Cqd1 is recalcitrant to recombinant protein purification
    reference_section_type: RESULTS
  - statement: Rescue by Cqd1 requires the canonical phosphotransfer residues.
    supporting_text: depended on core protein kinase-like (PKL) family residues
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The strongest functional characterisation available for ADCK2's own orthologous branch,
      and the source of the ontology gap proposed below. Its orthology statement was checked
      independently against PANTHER family membership (ADCK2 and YPL109C share PTHR45890:SF1;
      ADCK1 and Mcp2/YLR253W share PTHR43173:SF19) rather than taken on the authors' word.
- id: PMID:37073556
  title: The UbiB family member Cqd1 forms a novel membrane contact site in mitochondria.
  findings:
  - statement: >-
      Places ADCK2's yeast orthologue in the inner membrane at an inner-outer contact site,
      which is the sub-mitochondrial location human ADCK2's own data cannot yet resolve.
    supporting_text: >-
      we identified a novel mitochondrial contact site in Saccharomyces cerevisiae that is
      formed by the inner membrane protein Cqd1 and the outer membrane proteins Por1 and Om14
    reference_section_type: ABSTRACT
  - statement: The authors expect the arrangement to be conserved to human.
    supporting_text: >-
      Cqd1 is highly conserved, suggesting that this complex is conserved in form and
      function from yeast to human
    reference_section_type: ABSTRACT
  - statement: A second lipid-related role for the orthologue, beyond CoQ.
    supporting_text: Our data suggest that Cqd1 is additionally involved in phospholipid
      homeostasis.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Yeast only. Cited to explain why the yeast donor on the IBA row carries a more specific
      location term than the target does, and as the basis for a suggested experiment - not
      used to assert an inner-membrane location for human ADCK2.
- id: PMID:35936917
  title: Calorie Restriction Rescues Mitochondrial Dysfunction in Adck2-Deficient Skeletal
    Muscle.
  findings: []
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Mouse dietary intervention on the Adck2 heterozygote. Supports the physiological
      picture but adds no molecular function and no GO term; cited as context only.
- id: PMID:39354863
  title: Prenatal and progressive coenzyme Q(10) administration to mitigate muscle dysfunction
    in mitochondrial disease.
  findings: []
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Mouse developmental and supplementation study. Shows the muscle phenotype has an
      embryonic origin and responds to CoQ10, reinforcing that the fatty-acid defect is
      downstream of the CoQ deficit, but it establishes no molecular activity.
- id: PMID:35205819
  title: ADCK2 Knockdown Affects the Migration of Melanoma Cells via MYL6.
  findings: []
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      siRNA and overexpression phenotypes in melanoma lines with a correlative MYL6 link and
      no mechanism connecting it to ADCK2 biochemistry. Supplied by the affinage record;
      supports no GO term and none is proposed from it.
- id: PMID:36439873
  title: Identification of the mitochondrial protein ADCK2 as a therapeutic oncotarget of
    NSCLC.
  findings: []
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Knockout and overexpression in NSCLC lines and xenografts. The mitochondrial
      dysfunction it reports is the expected consequence of losing a mitochondrial protein
      and does not localise a molecular activity. Supplied by the affinage record; no GO term
      proposed from it.
- id: PMID:22355351
  title: Kinome-wide functional genomics screen reveals a novel mechanism of TNFalpha-induced
    nuclear accumulation of the HIF-1alpha transcription factor in cancer cells.
  findings: []
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      ADCK2 appears only as one of four hits in an siRNA kinome screen, with no follow-up on
      this gene. Supplied by the affinage record; too indirect to support any annotation.
- id: file:human/ADCK2/ADCK2-deep-research-affinage.md
  title: Affinage mechanistic annotation for ADCK2 (human)
  findings:
  - statement: >-
      The record passed its own gates and cites five numeric PMIDs with no bioRxiv
      identifiers in PMID-shaped fields, but its central framing conflates CoQ biosynthesis
      with CoQ delivery. The isotope-labelling experiment in the paper it cites shows total
      cellular synthesis is unchanged and only the mitochondrial pool is depleted, so
      biosynthesis is not the step ADCK2 acts on.
    supporting_text: >-
      establishing CoQ biosynthesis as the core function from which the metabolic and
      developmental phenotypes derive
    reference_section_type: OTHER
  - statement: >-
      Its own summary concedes that no mechanism is available, which is consistent with this
      review asserting no molecular function.
    supporting_text: >-
      No structural model, direct kinase substrate, or biochemical mechanism linking ADCK2 to
      the CoQ pathway has been characterized in the available corpus.
    reference_section_type: OTHER
  reference_review:
    relevance: MEDIUM
    correctness: LOW_QUALITY
    review_notes: >-
      Machine-generated provider record, gates_passed True. Used only to widen the literature
      search: it surfaced the three cancer papers and the 2024 mouse study, all of which were
      then read and judged on their own. No provider sentence is quoted as evidence for any
      mechanistic claim in this review, per the campaign rule, and no annotation verdict
      rests on it. Marked LOW_QUALITY rather than MISCITED because its citations are sound
      and it is the interpretation layer that over-reaches.
- id: file:human/ADCK2/ADCK2-bioinformatics/RESULTS.md
  title: 'ADCK2 bioinformatics: retention of UbiB / uPKL motifs relative to the characterised
    family members'
  findings:
  - statement: >-
      ADCK2 retains the UbiB-specific KxGQ motif that occludes the peptide-substrate groove
      in COQ8A, and also retains all four canonical catalytic positions, so it is neither a
      conventional protein kinase nor a pseudokinase by residue loss.
    supporting_text: >-
      ADCK2 has an intact phosphotransfer-competent active site inside a UbiB/uPKL
      architecture.
    reference_section_type: OTHER
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      This review's own reproducible analysis: Clustal Omega MSA with COQ8A as projection
      reference and PKA as negative control, reporting residue identity and landing on the
      target's own annotated sites as separate conditions. A fresh run reproduces both
      RESULTS.md and results.json byte-for-byte, and the script aborts if the reference
      feature positions have drifted from UniProt.
existing_annotations:
- term:
    id: GO:0005739
    label: mitochondrion
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - MGI:MGI:1889336
  - PANTHER:PTN000059786
  - SGD:S000006030
  - UniProtKB:Q7Z695
  review:
    summary: >-
      Correct and well supported by the donors' own experimental evidence. The node is
      clean, the term is the right level for a heterogeneous donor set, and the row records
      a PAINT curator judging mitochondrial localisation core to this orthologue group.
    action: ACCEPT
    reason: >-
      Every WITH/FROM token was resolved and queried for its own evidence for the propagated
      term. Both non-self donors carry experimental support: mouse Adck2 (Q6NSR3, Swiss-Prot)
      has HDA from PMID:18614015 plus IDA from PMID:31480808, and yeast YPL109C/Cqd1 (Q02981,
      Swiss-Prot) has three independent HDA annotations. So the "the sources only carry the
      same family-level inference" objection is factually false here. The ACRV1 test for a
      propagation landing above its donor was run and does not apply: the donor set is
      heterogeneous in specificity, because Cqd1 additionally holds IDA for GO:0005743
      mitochondrial inner membrane and GO:0044289 from PMID:37073556 while mouse Adck2 holds
      only mitochondrion. With donors that disagree, GO:0005739 is the correct least common
      ancestor, and a downward MODIFY would mean arbitrarily preferring the yeast donor over
      the mouse one. The node itself was queried directly and is coherent: PTN000059786
      propagates 49 annotations over 49 distinct gene products to this single term, its reach
      is the ADCK2/Cqd1 orthologue group, and yeast Mcp2/Cqd2, which is the donor for ADCK1
      under a different PANTHER family, is absent from it.
    supported_by:
    - reference_id: PMID:31480808
      supporting_text: >-
        The presence of ADCK2 was not detected in the endoplasmic reticulum and cytosolic
        fraction.
    - reference_id: PMID:34362905
      supporting_text: >-
        we identify two highly conserved but poorly characterized mitochondrial proteins,
        Ypl109c (Cqd1) and Ylr253w (Cqd2), that reciprocally affect this process
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: MGI:MGI:1889336
        source_label: mouse Adck2 (Q6NSR3, Swiss-Prot, 617 aa)
        source_status: SUPPORTS_TRANSFER
        comment: >-
          True one-to-one orthologue. QuickGO shows it carries its own HDA for GO:0005739
          from PMID:18614015 (mouse mitochondrial protein compendium) and IDA from
          PMID:31480808, so the transfer is not circular with the target's own evidence even
          though the two share one reference. The MGI cross-reference is ambiguous, also
          resolving to four TrEMBL entries; only the Swiss-Prot entry carries annotations.
      - source_id: SGD:S000006030
        source_label: S. cerevisiae YPL109C / Cqd1 (Q02981, Swiss-Prot, 657 aa)
        source_status: SUPPORTS_TRANSFER
        comment: >-
          The yeast orthologue, sharing PANTHER subfamily PTHR45890:SF1 with ADCK2, and the
          strain used for the complementation experiment in PMID:31480808. Carries three
          independent HDA annotations for GO:0005739 and, more specifically, IDA for
          GO:0005743 and GO:0044289 from PMID:37073556. Holding a more specific term than the
          one propagated is why this donor set is heterogeneous rather than agreeing.
      - source_id: PANTHER:PTN000059786
        source_label: PANTHER internal tree node
        source_status: NOT_RELEVANT
        comment: >-
          Not a protein but the ancestral node PAINT annotated. Queried directly rather than
          dismissed: it propagates exactly one term to 49 distinct gene products, all
          orthologues of ADCK2/Cqd1.
      - source_id: UniProtKB:Q7Z695
        source_label: ADCK2 itself (self-referential)
        source_status: SUPPORTS_TRANSFER
        comment: >-
          The target appears in its own WITH/FROM list. This is a valid PAINT construct
          recording that the curator judged the term core to the gene, not circular evidence.
- term:
    id: GO:0005739
    label: mitochondrion
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  review:
    summary: >-
      Correct. Automatic mapping of UniProt's SUBCELLULAR LOCATION line, which itself rests
      on experimental evidence; redundant with the experimental rows but not wrong.
    action: ACCEPT
    reason: >-
      Derived from UniProt-SubCell SL-0173, which maps the entry line "SUBCELLULAR LOCATION:
      Mitochondrion {ECO:0000269|PubMed:33988507}". The underlying assertion is therefore
      experimentally grounded rather than predicted, and it is independently confirmed by
      subcellular fractionation of endogenous protein and by the MitoCoP high-confidence
      proteome. It adds no information over the IDA rows, but there is no defect to correct.
    supported_by:
    - reference_id: PMID:33988507
      supporting_text: >-
        456 epitope-tagged kinases, representing 85% of the human kinome, were expressed in
        HeLa cells and imaged by immunofluorescent microscopy
- term:
    id: GO:0016020
    label: membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  review:
    summary: >-
      Retained but non-core. The term rests on a pure sequence prediction, and although the
      predicted helix sits where COQ8A's experimentally supported anchor sits, no measurement
