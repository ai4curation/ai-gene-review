- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:27499296
  qualifier: enables
  review:
    summary: >-
      An uninformative term resting on a single unreplicated, spoke-expanded affinity-capture
      run against one of the most abundant and promiscuous proteins of the inner membrane.
      Kept in the record but marked over-annotated; there is no informative molecular
      function to replace it with.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The partner is UniProtKB:P05141, SLC25A5/ANT2, resolved as the reviewed canonical
      Swiss-Prot entry with no length discrepancy, so this is not an ORFeome-fragment
      substitution. The evidence was then expanded rather than counted. UniProt states
      NbExp=4, but all four IntAct evidences come from one publication, PMID:27499296, by one
      method (anti tag coip), with ADCK2 as bait and SLC25A5 as prey, at MI-score 0.35, and
      three of the four are spoke expansions of a co-complex pulldown rather than
      demonstrated binary interactions. NbExp=4 is therefore one experiment counted four
      times, the same pattern already seen on ACRV1 and ADAMTSL5. Promiscuity compounds it:
      SLC25A5 carries 385 IntAct interaction evidences, and ADCK2 itself has 83 distinct
      partners across 7 publications. The topological objection that carried the ACRV1 case
      is explicitly absent here and is recorded as a negative result - both proteins face the
      matrix side of the inner membrane, so the interaction is physically possible - but
      possibility is not support. The cached full text of the source paper never mentions
      ADCK2, so no author interpretation exists to weigh. Per the curation guidelines, bare
      protein binding should be replaced by an informative molecular function where the
      partner is real; here the partner is a plausible but unreplicated screen hit and no
      informative term is warranted, so the row is marked over-annotated rather than modified
      or removed.
