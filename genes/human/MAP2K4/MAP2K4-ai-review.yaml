core_functions:
- description: 'MKK4 is a dual-specificity MAP2K of the JNK cascade: once activated by stress/cytokine MAP3Ks (MEKK1, TAK1,
    MLK3, ASK1) it docks onto JNK1-3 via its N-terminal D-site and phosphorylates the JNK Thr-Pro-Tyr activation motif, preferentially
    on Tyr185, cooperating with MKK7 (which prefers Thr183) for full JNK activation.'
  molecular_function:
    id: GO:0008545
    label: JUN kinase kinase activity
  directly_involved_in:
  - id: GO:0007254
    label: JNK cascade
  locations:
  - id: GO:0005829
    label: cytosol
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:7716521
    supporting_text: A dual-specificity kinase that activates JNK, named JNKK, was identified that functions between MEKK
      and JNK.
  - reference_id: PMID:12788955
    supporting_text: inhibited both MKK4/JNK binding and MKK4-mediated phosphorylation of JNK1
  - reference_id: Reactome:R-HSA-168162
    supporting_text: MKK4 shows a striking preference for the tyrosine residue (Tyr-185)
  - reference_id: PMID:16533805
    supporting_text: Optimal activation of JNK requires the activity of both MKK4 and MKK7
  - reference_id: file:human/MAP2K4/MAP2K4-uniprot.txt
    supporting_text: Tyr residue and MAP2K7/MKK7 for the Thr residue.
  - reference_id: Reactome:R-HSA-450337
    supporting_text: JNK and p38 MAPK activities were decreased by around 80% and 20%, respectively, following deletion of
      the mkk4 gene.
- description: MKK4 also phosphorylates and activates p38 MAPKs (docking p38alpha/beta through the same promiscuous D-site),
    making it the only MAP2K that feeds both the JNK and p38 stress-activated cascades; its contribution to p38 activation
    is smaller than that of MKK3/MKK6.
  molecular_function:
    id: GO:0004708
    label: MAP kinase kinase activity
  directly_involved_in:
  - id: GO:0038066
    label: p38MAPK cascade
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:7839144
    supporting_text: Two human MAP kinase kinases (MKK3 and MKK4) were cloned that phosphorylate and activate p38 MAP kinase.
  - reference_id: PMID:34439869
    supporting_text: One exception is MKK4 that contains an 86-amino acid disordered domain with a docking site motif that
      can recruit both the JNK and p38 kinases.
  - reference_id: file:human/MAP2K4/MAP2K4-uniprot.txt
    supporting_text: exclusively activates JNKs, MAP2K4/MKK4 additionally activates the p38
suggested_questions:
- question: What is the source publication for the IEP "cellular response to mechanical stimulus" annotation currently attributed
    to PMID:19593445 (a BAD/prostate cancer paper that does not mention MKK4), and does MKK4 respond to mechanical stimuli?
- question: Under which physiological stimuli and in which cell types does MKK4 make a non-redundant contribution to p38 activation
    relative to MKK3 and MKK6?
- question: Is MKK4 activity in the nucleus functionally significant, or is its nuclear pool a reservoir with JNK/p38 phosphorylation
    occurring mainly in the cytosol?
suggested_experiments:
- description: Acute MKK4 depletion (degron) versus kinase-inactive knock-in in human cells, combined with MKK7 loss, to quantify
    MKK4-specific JNK Tyr185 and p38 TGY phosphorylation across stresses (UV, osmotic, oxidative, cytokine).
- description: Compartment-restricted MKK4 (NES/NLS-tagged) rescue in MKK4-null cells to determine where MKK4 must reside
    to activate JNK and p38.
