id: P45985
gene_symbol: MAP2K4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: MAP2K4 (MKK4, SEK1, JNKK1, MEK4) is a dual-specificity protein kinase of the STE group that, together with MKK7,
  forms the MAP kinase kinase tier of the JNK stress-activated MAPK cascade, and in addition contributes to activation of
  p38 MAPKs. It is activated by phosphorylation of Ser257 and Thr261 in its activation loop by many MAP3Ks, including MEKK1
  (MAP3K1), TAK1 (MAP3K7), ASK1 (MAP3K5) and the mixed-lineage kinases, which dock onto its C-terminal DVD site. Activated
  MKK4 docks onto its substrates through an intrinsically disordered N-terminal D-site that binds JNK1-3 and p38alpha/beta
  with comparable affinity, and phosphorylates the threonine and tyrosine of the MAPK activation-loop motif, with a marked
  preference for the tyrosine (Tyr185) of the JNK Thr-Pro-Tyr motif; MKK7 prefers the threonine, so the two kinases cooperate
  for full JNK activation. MKK4 does not activate ERK. It is a soluble protein found in the cytoplasm and nucleus and is activated
  by UV and ionizing radiation, heat shock, hyperosmolarity, oxidative stress and inflammatory cytokines, relaying these signals
  through JNK and p38 to transcriptional programmes controlling stress adaptation, apoptosis and proliferation. MAP2K4 is
  recurrently inactivated in some epithelial cancers, and its N terminus is cleaved by anthrax lethal factor.
