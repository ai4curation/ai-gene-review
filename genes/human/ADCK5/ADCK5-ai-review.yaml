id: Q3MIX3
gene_symbol: ADCK5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  ADCK5 is a 580-residue human member of the ancient UbiB (aarF-domain) family of atypical
  protein-kinase-like proteins, one of five human paralogs alongside ADCK1, ADCK2 and the two
  characterised coenzyme Q factors COQ8A (ADCK3) and COQ8B (ADCK4). In eukaryotes UbiB
  proteins are found exclusively in mitochondria and plastids, and ADCK5 is detected in
  high-confidence human mitochondrial proteome surveys and co-purifies predominantly with
  mitochondrial proteins; a hydrophobic segment at residues 50-67 is predicted to anchor it in
  a membrane. Its protein-kinase-like domain retains the complete catalytic and
  nucleotide-positioning core of the fold - the beta3 lysine, the alphaC glutamate, the
  catalytic-loop aspartate and asparagine, and the DFG aspartate - so it is not a degenerate
  pseudokinase. At the same time it retains both UbiB-specific features that distinguish this
  family from conventional kinases: the invariant KxGQ motif, whose N-terminal domain occludes
  the pocket that conventional kinases use to bind peptide substrates, and an alanine-rich loop
  in place of the canonical glycine-rich nucleotide loop, which in the characterised relatives
  produces an unusual preference for ADP over ATP. No catalytic activity, substrate or
  physiological process has been established for ADCK5 by direct assay. In the two relatives
  that have been assayed the fold does not support generic protein phosphorylation in trans,
  yet COQ8B does phosphorylate one specific partner protein, so a restricted,
  substrate-selective activity for ADCK5 remains an open possibility rather than an excluded
  one. Reported cellular roles - promotion of lung cancer cell invasion and migration via a
  SOX9/PTTG1 axis, and induction of airway epithelial senescence - rest on overexpression and
  knockdown studies without accompanying enzymology.
existing_annotations:
- term:
    id: GO:0016020
    label: membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0162
  review:
    summary: >-
      Correct but weakly grounded, and less informative than the available evidence. This row is
      the automatic mapping of UniProt SubCell SL-0162 (Membrane) to GO:0016020, and that
      SubCell assignment traces to a SUBCELLULAR LOCATION line reading "Membrane {ECO:0000305};
      Single-pass membrane protein {ECO:0000305}" - a curator inference drawn from a purely
      predicted transmembrane helix at residues 50-67 (ECO:0000255). There is no experimental
      membrane measurement for ADCK5. The statement is nonetheless very likely true: UniProt
      records COQ8A as Mitochondrion membrane, single-pass, and ADCK1 as Mitochondrion, and
      ADCK5 is independently placed in the mitochondrion by the HTP row below. Kept as
      ACCEPT because a general parent term that is true should not be removed, and because
      refining it to GO:0031966 mitochondrial membrane would mean joining an experimental
      mitochondrion call to a predicted membrane call - a composite inference this review
      declines to make on ADCK5's behalf. The substantive issue is upstream and not fixable in
      GO: ADCK1 and ADCK2 receive SL-0173 (Mitochondrion) from the same UniProt pipeline while
      ADCK5 receives only SL-0162. That difference is not arbitrary - ADCK1 and ADCK2 each have
      an experimental mitochondrial localisation of their own (ECO:0000269|PubMed:33988507)
      that ADCK5 lacks - but the reason ADCK5 lacks it is that it was never tested: that study
      states its kinome library did not contain ADCK5. Raised as a UniProt correction request
      in suggested_questions, on ADCK5's own evidence rather than on parity with its
      paralogs.
    action: ACCEPT
    reason: >-
      A true but prediction-derived parent term. Retained rather than removed because ADCK5 is
      almost certainly membrane-associated, and rather than refined because its submitochondrial
      placement has never been measured.
    supported_by:
    - reference_id: PMID:25498144
      supporting_text: they contain predicted single-pass transmembrane (TM) domains that could
        limit solubility
    - reference_id: PMID:27499294
      supporting_text: endogenous COQ8A is partially buried in the inner mitochondrial membrane
        with its C-terminus facing the matrix
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:25416956
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q7Z3S9
  review:
    summary: >-
      Bare "protein binding" supported by a single yeast two-hybrid partner, NOTCH2NLA
      (Q7Z3S9), from the Rolland/CCSB proteome-scale interactome screen. Expanding the IntAct
      records shows this one screen is logged three separate times under three sub-method
      labels - two hybrid array, two hybrid prey pooling approach, and validated two hybrid -
      which is what inflates UniProt's NbExp to 4. It is one experiment, not three, and across
      all 54 IntAct records for Q3MIX3 there is no orthogonal assay for this pair (MI score
      0.67 throughout). The compartments also sit awkwardly together: NOTCH2NLA is a reviewed
      236-residue human-specific protein annotated Secreted and Cytoplasm that acts on neural
      progenitor proliferation, whereas ADCK5 is a mitochondrial UbiB-family protein whose only
      large interaction dataset returns 17 of 25 partners annotated to the mitochondrion. That
      compartment argument is a supporting consideration rather than a decisive one, and it is
      stated here as an assumption: it holds if ADCK5's kinase-like domain faces the matrix, as
      COQ8A's C-terminus is measured to do, but ADCK5's own sidedness has never been determined
      and an outer-membrane anchor presenting the domain to the cytosol is not excluded - which
      is the same uncertainty that stops this review proposing GO:0031966. The verdict does not
      depend on it: the method-replication argument stands alone. Marked as
      over-annotated rather than removed: this is an experimental IPI whose primary data this
      review has not seen, and the term is not positively contradicted, merely unreplicated by
      any independent method and uninformative as written. Not modified to a more specific
      molecular-function term because there is no characterised activity to modify it to. The
      partner-identity check ran clean - Q7Z3S9 is the reviewed, canonical, full-length
      Swiss-Prot entry, not a TrEMBL or partial-ORFeome substitute.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      One yeast two-hybrid screen triple-logged under three sub-method labels, with no
      orthogonal assay for this pair anywhere in IntAct, and a bare term that names no activity.
    supported_by:
    - reference_id: PMID:27499294
      supporting_text: endogenous COQ8A is partially buried in the inner mitochondrial membrane
        with its C-terminus facing the matrix
    - reference_id: file:human/ADCK5/ADCK5-bioinformatics/RESULTS.md
      supporting_text: MI score 0.67 on every row; no orthogonal assay anywhere in IntAct.
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:31515488
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q7Z3S9
  review:
    summary: >-
      Same partner as the row above, NOTCH2NLA (Q7Z3S9), from a second two-hybrid study that
      screens the effect of genetic variants on interactions. Judged separately per partner and
      per reference as required, and it reaches the same verdict for a reason specific to it:
      this is not independent corroboration of the Rolland hit. It is a two hybrid array
      experiment from the same CCSB resource lineage, i.e. method replication within one assay
      class rather than orthogonal validation. It inherits the same compartment consideration as
      the row above - a secreted and cytoplasmic human-specific neural regulator paired with a
      mitochondrial UbiB protein - and it inherits that consideration's limits too: ADCK5's
      membrane sidedness has never been measured, so this supports the verdict without being
      required by it. Had this been a different method, the two rows together would have
      justified MODIFY to an informative molecular-function term; as it stands there is no
      characterised binding activity to name.
      Over-annotated rather than removed, on the same grounds as the previous row.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      A second two-hybrid screen from the same CCSB resource lineage, so method replication
      within one assay class rather than the orthogonal validation this partner would need.
    supported_by:
    - reference_id: file:human/ADCK5/ADCK5-bioinformatics/RESULTS.md
      supporting_text: MI score 0.67 on every row; no orthogonal assay anywhere in IntAct.
- term:
    id: GO:0005739
    label: mitochondrion
  evidence_type: HTP
  original_reference_id: PMID:34800366
  qualifier: located_in
  review:
    summary: >-
      Well supported, and the single most informative annotation ADCK5 has. The reference is
      MitoCoP, a quantitative high-confidence human mitochondrial proteome, and the identical
      row is carried by ADCK1 and ADCK2. It is corroborated from three independent directions:
      the UbiB family is mitochondrial throughout eukaryotes; ADCK5's largest interaction
      dataset (PMID:27499296, the mitochondrial protein interaction map) returns 25 distinct
      partners of which 17 are UniProt-annotated to the mitochondrion; and the protein carries
      an N-terminal basic, hydroxylated-residue-rich segment of the kind that directs
      mitochondrial import. The complex-to-subunit projection failure mode was checked and does
      not apply here - PMID:34800366 is a proteome-wide localisation census that assigns no
      functional or phenotype term, so there is no phenotype able to spread across a complex,
      unlike the ComplexPortal-derived case documented on INO80 subunits.
    action: ACCEPT
    reason: >-
      High-confidence mitochondrial proteome membership, corroborated independently by the
      family's exclusively mitochondrial distribution in eukaryotes and by an interactome
      dominated by mitochondrial proteins.
    supported_by:
    - reference_id: PMID:25498144
      supporting_text: In eukaryotes, UbiB homologs are found exclusively in mitochondria
suggested_questions:
- question: >-
    UniProt correction request (1 of 2). Q3MIX3 carries EC=2.7.11.-, the
    Serine/threonine-protein kinase keyword, and consequently the cross-reference "GO:0004674;
    F:protein serine/threonine kinase activity; IEA:UniProtKB-KW", while the same entry states
    that the function of this protein is not yet clear and that it is not known whether it has
    protein kinase activity at all. UniProt has already applied exactly this correction to the
    two family members whose activity was measured: COQ8A and COQ8B were moved to the generic
    EC 2.7.-.- and lost the Ser/Thr-kinase keyword after Stefely et al. showed they lack
    canonical protein kinase activity in trans. ADCK5 and ADCK2 were not. Because GOA no longer
    imports keyword-derived annotations, today's GO record is unaffected - but any consumer
    reading UniProt directly still sees an activity assertion the entry's own FUNCTION line
    disclaims. Should ADCK5 be downgraded to EC 2.7.-.- with the Ser/Thr-kinase keyword removed?
  experts:
  - UniProt/Swiss-Prot curation
- question: >-
    UniProt correction request (2 of 2). Q3MIX3's SUBCELLULAR LOCATION is only Membrane,
    single-pass, inferred from a predicted TM helix, so its SubCell mapping is SL-0162 and it
    gains only GO:0016020 - no mitochondrial term. ADCK1 and ADCK2 both carry SL-0173
    (Mitochondrion), each on an experimental annotation ECO:0000269|PubMed:33988507 from the
    subcellular kinome atlas. ADCK5 has no such annotation, and the reason is worth stating
    precisely: that study reports that ADCK5 was absent from its kinome library, so this is
    untested rather than tested-and-negative. Meanwhile ADCK5 has mitochondrial evidence of its
    own - it is in the MitoCoP high-confidence mitochondrial proteome (PMID:34800366), 17 of the
    25 partners in its mitochondrial-interactome dataset are themselves mitochondrial, and every
    characterised eukaryotic UbiB protein is mitochondrial. Should Mitochondrion be added to
    ADCK5's SUBCELLULAR LOCATION on that basis? Posed on ADCK5's own evidence, not on parity
    with paralogs whose annotation rests on an assay ADCK5 never received.
  experts:
  - UniProt/Swiss-Prot curation
- question: >-
    PAINT/PAN-GO coverage. ADCK5 is the only one of the five human UbiB genes with no
    evolutionary-model annotation at all; UniProt records that Q3MIX3 has 0 GO annotations based
    on evolutionary models. PTHR43173, the family containing both ADCK1 (SF19) and ADCK5 (SF28),
    has exactly one annotated node, PTN005148758, seeded by a single yeast protein (MCP2,
    SGD:S000004243, itself SF19) and carrying GO:0005743, GO:0007005 and GO:0055088. ADCK1
    inherits all three; ADCK5 inherits none, because the node lies inside the SF19 clade. This is
    a reach/coverage gap rather than a mis-propagation, and it is deliberately raised as a
    question and not acted on: a single yeast seed is thin support for extending three terms
    across the whole family, and ADCK5 already has direct HTP evidence for the mitochondrion.
    Should a family-level PTHR43173 node carry the mitochondrial localisation that is true of
    every characterised eukaryotic UbiB protein?
  experts:
  - GO Consortium PAINT curation
- question: >-
    Should GO be able to record the UbiB/ADCK atypical-kinase architecture at all? There is
    currently no way to state "protein-kinase-like fold with an occluded substrate pocket and an
    ADP-selective nucleotide loop, catalytic activity undetermined". For ADCK5 the honest GO
    position is simply the absence of a molecular-function term, which is what GOA now has - but
    the same gap pushed COQ8A's annotation into the generic GO:0016301 kinase activity for what
    is really ATP hydrolysis. The sharpest evidence of the cost is on COQ8B, not on ADCK5: GOA
    carries both NOT|enables GO:0004672 (IDA, PMID:27499294) and enables GO:0004672 (IDA,
    PMID:38425362) for that gene, so read as terms alone it asserts and negates protein kinase
    activity at once. That is an expressivity limit, not a curation error - COQ8B's reviewer
    reconciled the two explicitly in free text, recording that the negation refers to general
    in-trans behaviour and does not contradict the specific COQ3 phosphorylation. The
    reconciliation is correct and simply cannot be said in terms: GO offers no way to express
    "no activity in trans toward general substrates, but yes toward this one specific
    substrate". Raised as an ontology-coverage observation, not a request to create a term for
    this gene, and not an action on COQ8B, which is out of scope here.
  experts:
  - GO ontology development
suggested_experiments:
- hypothesis: >-
    ADCK5 binds adenine nucleotides with the ADP-over-ATP preference that the retained A-rich
    loop alanine A209 confers in COQ8A and yeast Coq8p.
  description: >-
    Differential scanning fluorimetry (thermal shift) on purified ADCK5 lacking the predicted
    transmembrane segment, against a panel of ADP, ATP and non-hydrolysable analogues, exactly
    as was done for COQ8A. This tests the single best-founded prediction about the protein and
    would decide between GO:0043531 ADP binding and GO:0005524 ATP binding. This review proposes
    neither term, because neither has been measured for ADCK5.
  experiment_type: biochemical assay
- hypothesis: >-
    ADCK5 has ATP hydrolysis activity modulated by lipids and CoQ intermediates, as COQ8A does.
  description: >-
    ATPase assay on purified ADCK5 in the presence and absence of cardiolipin and CoQ
    biosynthetic intermediates. A positive result would distinguish a conserved family ATPase
    from a genuinely divergent activity, and would support GO:0016887.
  experiment_type: enzyme assay
- hypothesis: >-
    Like COQ8B, ADCK5 phosphorylates a specific mitochondrial partner protein rather than
    generic substrates.
  description: >-
    The COQ8B precedent shows the productive experiment is not a generic peptide-substrate panel
    - which is what failed for COQ8A - but a search for a specific partner. Run an ATP-dependent
    phosphorylation screen with intact-protein mass spectrometry against ADCK5's own
    co-purifying mitochondrial partners (CHCHD2, CHCHD3, IMMT, PMPCB and the other mitochondrial
    hits of PMID:27499296), rather than a generic kinase assay.
  experiment_type: biochemical assay
- hypothesis: >-
    The KxGQ/A-rich autoinhibitory architecture is functional in ADCK5, not merely present in
    sequence.
  description: >-
    Mutate the A-rich loop alanine A209 to glycine and test whether nucleotide selectivity flips
    toward ATP and autophosphorylation is enabled, as A339G does in COQ8A and A197G in yeast
    Coq8p. A positive result would establish that the occluded-pocket mechanism operates in
    ADCK5, which is currently inferred from sequence alone.
  experiment_type: mutagenesis
- hypothesis: >-
    ADCK5 is anchored in the mitochondrial inner membrane via the predicted 50-67 helix, with the
    kinase-like domain facing the matrix, as COQ8A is.
  description: >-
    Carbonate extraction and protease-protection assays on isolated mitochondria, with
    submitochondrial fractionation. This is the measurement that would justify GO:0031966
    mitochondrial membrane or GO:0005743 mitochondrial inner membrane in place of the current
    generic GO:0016020; its absence is why this review proposes neither.
  experiment_type: cell fractionation
- hypothesis: >-
    The reported ADCK5-SOX9-PTTG1 pathway involves direct phosphotransfer by ADCK5 to SOX9
    Ser181.
  description: >-
    PMID:32277958 infers the Ser181 site from mutagenesis of the substrate plus a motif-match
    argument, with no in vitro kinase assay reported. Perform a recombinant ADCK5 plus
    recombinant SOX9 kinase assay with a catalytically dead control mutating the DFG aspartate
    D382, to distinguish direct phosphorylation from an indirect consequence of overexpression.
  experiment_type: biochemical assay
knowledge_gaps:
- gap_statement: >-
    ADCK5 has never been assayed. Its catalytic activity, its substrate and its physiological
    process are all undetermined: whether it transfers a phosphate to a protein, to a small
    molecule, or hydrolyses ATP without transferring anything at all, and whether it prefers ADP
    or ATP, are open questions with no measurement on either side. UniProt states the gap in its
    own FUNCTION line, and the paper that resolved the equivalent question for COQ8A explicitly
    set ADCK5 aside.
  boundary: >-
    Established: mitochondrial localisation (MitoCoP high-confidence proteome, HTP), an
    interactome dominated by mitochondrial proteins, and a UbiB-family protein-kinase-like fold
    that retains the complete catalytic and nucleotide-positioning core (beta3 K228, alphaC E281,
    catalytic-loop D360 and N365, DFG D382) behind both UbiB-specific features that occlude the
    conventional substrate route (KxGQ K147, A-rich loop A209). Not established: any measured
    activity, any nucleotide preference, any substrate, any physiological process, and the
    submitochondrial compartment and membrane topology. Note the fold argument constrains but
    does not close the question in either direction - COQ8A was shown to lack canonical protein
    kinase activity in trans, yet COQ8B phosphorylates COQ3, so an activity restricted to one
    specific partner remains live.
  gap_kind:
  - BIOLOGY
  dark_aspect: WHOLLY_DARK
  status: OPEN
  significance: >-
    ADCK5 is Pharos Tdark and is the only one of the five human UbiB genes with no
    evolutionary-model (IBA) annotation at all, so it inherits nothing from its family and has
    contributed nothing to it. After this review its entire GO record is one prediction-derived
    membrane term, one high-throughput mitochondrion term and two bare protein binding rows from
    a single two-hybrid pairing - the deep-unknome signature. The two characterised relatives
    both turned out to do something the family name did not predict, which is a reason to expect
    the same here rather than to assume ADCK5 is a redundant paralog.
  provenance:
  - reference_id: PMID:27499294
    supporting_text: More distantly related COQ8A/B homologs (ADCK1, ADCK2, and ADCK5) could
      also play a role
  - reference_id: PMID:25498144
    supporting_text: The human genome contains five UbiB family genes
  - reference_id: file:human/ADCK5/ADCK5-bioinformatics/RESULTS.md
    supporting_text: The kinase label on ADCK5 is a **fold-derived name, not a measured
      activity**
- gap_statement: >-
    GO cannot express what is actually known about this protein's molecular architecture: a
    protein-kinase-like fold whose conventional peptide-substrate pocket is occluded by its own
    N-terminal KxGQ domain and whose glycine-rich nucleotide loop is replaced by an
    alanine-rich, ADP-selective one, with the catalytic core intact but no activity determined.
    The only faithful GO position available is silence, so an architecture that is conserved
    from bacteria to humans and is the defining feature of an entire kinase-like family is
    unrepresentable.
  boundary: >-
    Established: the UbiB-specific features are defined, quantified across the family, and
    structurally interpreted, and ADCK5 retains them. Missing: any term between GO:0016301
    kinase activity, which asserts an activity ADCK5 has not been shown to have, and no term at
    all. The cost is visible on the characterised paralogs too - COQ8A's demonstrated ATP
    hydrolysis is recorded as generic GO:0016301 kinase activity alongside a NOT annotation to
    GO:0004672, which is an accurate but awkward way to describe an enzyme, and COQ8B ends up
    carrying enables GO:0004672 and NOT|enables GO:0004672 at the same time because the ontology
    cannot distinguish a generic activity from a single-substrate one. In COQ8B's case the
    curator reconciled the two correctly in prose; the point is that no arrangement of GO terms
    could have carried that reconciliation.
  gap_kind:
  - ONTOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: >-
    This is a family-level gap rather than an ADCK5-specific one; it affects all five human ADCK
    genes and their orthologs throughout eukaryotes and bacteria. No new term is proposed here,
    because for ADCK5 specifically there is no measured activity for such a term to record - the
    gap is raised so that it is visible when a member is eventually characterised.
  provenance:
  - reference_id: PMID:25498144
    supporting_text: an atypical AAAS motif in an alanine-rich (A-rich) loop that replaces the
      canonical glycine-rich (G-rich) nucleotide-binding loop
  - reference_id: PMID:25498144
    supporting_text: the KxGQ domain is likely to be an autoinhibitory domain because it fills
      the space normally occupied by peptide or protein substrates in typical protein kinases
  - reference_id: PMID:27499294
    supporting_text: neither catalyzes canonical protein kinase activity
references:
- id: GO_REF:0000044
  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot Subcellular Location
    vocabulary mapping, accompanied by conservative changes to GO terms applied by
    UniProt
  findings:
  - statement: >-
      The pipeline behind the GO:0016020 row. Its input for ADCK5 is SubCell SL-0162 (Membrane),
      which resolves to GO:0016020 and nothing more specific.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Correctly applied - SL-0162 does map to GO:0016020, confirmed against the UniProt
      locations endpoint. The weakness is in the pipeline's input, not its operation: ADCK5's
      SUBCELLULAR LOCATION line is itself an ECO:0000305 inference from a predicted TM helix.
      ADCK1 and ADCK2 feed the same pipeline SL-0173 and gain GO:0005739 - but that is not a
      like-for-like comparison and must not be read as one: their SL-0173 rests on an
      experimental localisation (ECO:0000269|PubMed:33988507) from a kinome-wide imaging screen
      whose library did not contain ADCK5. The asymmetry is therefore untested versus tested,
      not identical evidence handled differently.
- id: PMID:25416956
  title: A proteome-scale map of the human interactome network.
  findings:
  - statement: >-
      Source of the first GO:0005515 row. Reports an ADCK5-NOTCH2NLA interaction by yeast
      two-hybrid, logged in IntAct three times under three sub-method labels of the same screen.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      The citation is correct and the screen is a legitimate large-scale resource; the caution is
      about weight, not identity. Counting its three IntAct sub-method rows as independent
      replication would triple-count one experiment - the same artefact previously documented on
      ACRV1 and ADAMTSL5.
- id: PMID:31515488
  title: Extensive disruption of protein interactions by genetic variants across the
    allele frequency spectrum in human populations.
  findings:
  - statement: >-
      Source of the second GO:0005515 row; recovers the same ADCK5-NOTCH2NLA pair by two hybrid
      array from the same CCSB resource lineage, so it is method replication rather than
      orthogonal validation.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
- id: PMID:34800366
  title: Quantitative high-confidence human mitochondrial proteome and its dynamics
    in cellular context.
  findings:
  - statement: >-
      MitoCoP places ADCK5 in the high-confidence human mitochondrial proteome; this is the
      source of the GO:0005739 HTP row, and the identical row is carried by ADCK1 and ADCK2.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Checked for the complex-to-subunit projection pattern and cleared: this is a proteome-wide
      localisation census with no functional or phenotype term attached, so no phenotype can
      spread across a complex from it.
- id: PMID:25498144
  title: Mitochondrial ADCK3 employs an atypical protein kinase-like fold to enable
    coenzyme Q biosynthesis.
  findings:
  - statement: >-
      Defines the UbiB-specific sequence features, including the invariant KxGQ motif and the
      AAAS alanine-rich loop that replaces the canonical glycine-rich nucleotide-binding loop.
      Both are retained in ADCK5, at K147 and A209.
    supporting_text: an atypical AAAS motif in an alanine-rich (A-rich) loop that replaces the
      canonical glycine-rich (G-rich) nucleotide-binding loop
  - statement: >-
      Argues that the KxGQ domain is positioned to inhibit protein kinase activity by occupying
      the site conventional kinases use for peptide substrates.
    supporting_text: the KxGQ domain is likely to be an autoinhibitory domain because it fills
      the space normally occupied by peptide or protein substrates in typical protein kinases
  - statement: >-
      Establishes that eukaryotic UbiB proteins are mitochondrial, corroborating ADCK5's HTP
      mitochondrion row independently of the proteomics.
    supporting_text: In eukaryotes, UbiB homologs are found exclusively in mitochondria
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The structural basis for this review's central call. Every residue number taken from it
      (COQ8A K276, A339, D488, D507) was asserted against the downloaded Q8NI60 sequence before
      use, and all four matched.
- id: PMID:27499294
  title: Cerebellar Ataxia and Coenzyme Q Deficiency through Loss of Unorthodox Kinase
    Activity.
  findings:
  - statement: >-
      Demonstrates that COQ8A and yeast Coq8p lack canonical protein kinase activity in trans;
      the source of the NOT|enables GO:0004672 and NOT|involved_in GO:0006468 annotations carried
      by both COQ8A and COQ8B.
    supporting_text: neither catalyzes canonical protein kinase activity
  - statement: >-
      Attributes the loss of generic protein-kinase function to the KxGQ domain blocking the
      peptide substrate site.
    supporting_text: which occludes the canonical peptide substrate pocket
  - statement: >-
      Explicitly leaves ADCK1, ADCK2 and ADCK5 uncharacterised, so nothing in this paper is
      direct evidence about ADCK5.
    supporting_text: More distantly related COQ8A/B homologs (ADCK1, ADCK2, and ADCK5) could
      also play a role
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Central to the family argument but deliberately not treated as evidence about ADCK5 itself
      - the paper says in terms that ADCK5 was not studied. It constrains what the fold does
      generically; it does not establish what ADCK5 does.
- id: PMID:38425362
  title: In vitro construction of the COQ metabolon unveils the molecular determinants
    of coenzyme Q biosynthesis.
  findings:
  - statement: >-
      COQ8B phosphorylates a specific protein substrate, COQ3, at multiple sites - the result
      that stops this review concluding that the UbiB fold is incapable of phosphorylating a
      protein.
    supporting_text: COQ3, but not COQ6, is phosphorylated by COQ8B at multiple sites
  - statement: >-
      The same study excludes small-molecule kinase activity for COQ8B, narrowing the family's
      plausible activities.
    supporting_text: GC/MS analyses did not detect any phosphorylated CoQ intermediates,
      suggesting that the enzyme is not a small-molecule kinase
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Cited specifically to avoid the mirror error of inferring absence of an activity from the
      family's reputation. Weighted with a caveat that is easy to miss: the COQ8 proteins used
      were ancestral-sequence reconstructions of the tetrapod enzymes rather than the extant
      human proteins, so this is strong evidence that the fold can phosphorylate a protein and
      weaker evidence about human COQ8B specifically.
- id: PMID:33988507
  title: A subcellular map of the human kinome.
  findings:
  - statement: >-
      The subcellular kinome atlas underpins the experimental mitochondrial localisation
      (ECO:0000269|PubMed:33988507) that UniProt gives every human UbiB protein except ADCK5 -
      though not to the same degree, and the difference matters. For ADCK1 and ADCK2 it is the
      SOLE cited evidence, so there it supplied the annotation. For COQ8A and COQ8B it is one
      tag among several and the latest of them (COQ8A also cites PubMed:11888884 from 2002 and
      PubMed:25498144; COQ8B also cites PubMed:24270420 from 2013), so there it corroborated an
      annotation that already existed. ADCK5 has no tag from it at all, because it states that
      ADCK5 was not present in the screened library - so ADCK5's missing annotation reflects
      absence of testing rather than a negative result, which is what makes the UniProt
      correction request reasonable rather than a request to overrule data. The four genes the
      screen did cover are the entire rest of the human UbiB family; ADCK5 is the only member
      it could not assess. The supplied/corroborated split is computed in
      family_census.json under mitochondrial_localisation_provenance, not asserted from memory.
    supporting_text: ADCK5 and OBSCN were absent from the library
  - statement: >-
      Stronger than a bare absence. The sentence sits in a passage reconciling the screen's 22
      mitochondrial kinases against the MitoCarta2.0 mitochondrial proteome, and that passage
      lists two distinct kinds of exception. ADCK5 and OBSCN are in the first kind: absent from
      the library, so never assessed. FASTK and PAK5 are in the second and opposite kind: they
      were in the library, were tested, and were called non-mitochondrial. ADCK5 belongs to the
      first group only - a mitochondrial candidate the assay never reached, not one it examined
      and rejected.
    supporting_text: 14 of them have been documented in mitochondrial proteome database
      MitoCarta2.0
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Not the source of any ADCK5 GOA row - QuickGO returns 0 annotations for Q3MIX3 from this
      reference, consistent with the paper's own statement that ADCK5 was not in the library.
      Cited to establish why the paralogs' UniProt mitochondrial annotation does not extend to
      ADCK5, after an earlier draft of this review wrongly asserted the three genes rested on
      identical evidence.
- id: PMID:27499296
  title: Mitochondrial Protein Interaction Mapping Identifies Regulators of Respiratory
    Chain Function.
  findings:
  - statement: >-
      Contributes 40 of ADCK5's 54 IntAct records, yielding 25 distinct partners of which 17 are
      UniProt-annotated to the mitochondrion. Independent corroboration of the mitochondrion row,
      and the source of the compartment consideration that sits alongside - but is not required
      by - the method-replication argument against the NOTCH2NLA pairing.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Not the source of any GOA row for ADCK5; used only as corroborating interactome context.
      The 17-of-25 figure was measured against each partner's UniProt subcellular location rather
      than asserted - an earlier draft claimed all 25 were mitochondrial and the measurement
      refused it.
- id: PMID:32277958
  title: aarF domain containing kinase 5 gene promotes invasion and migration of lung
    cancer cells through ADCK5-SOX9-PTTG1 pathway.
  findings:
  - statement: >-
      The only ADCK5-specific functional study. Proposes that ADCK5 phosphorylates SOX9 at Ser181
      to upregulate PTTG1 and drive invasion and migration, but states the central claim as a
      possibility rather than a demonstration.
    supporting_text: showed that ADCK5 might regulate the expression of tumor oncogene human
    full_text_unavailable: true
  - statement: >-
      The Ser181 assignment rests on mutagenesis of the substrate plus a motif-match argument,
      not on a direct kinase assay.
    supporting_text: The serine 181 site of SOX9 is in a
    full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: LOW_QUALITY
    review_notes: >-
      Not miscited and not disputed in the literature, but methodologically thin for the weight
      placed on it elsewhere: the abstract hedges every step ("might regulate", "might be
      required"), reports no in vitro kinase assay, and full text is unavailable. The affinage
      record restates it as an established fact that ADCK5 phosphorylates SOX9 at serine 181,
      which the abstract does not support. No GOA row depends on it, so nothing in the GO record
      needed changing on this account.
- id: file:human/ADCK5/ADCK5-bioinformatics/RESULTS.md
  title: ADCK5 (Q3MIX3) - is the "protein serine/threonine kinase" assignment supported?
  findings:
  - statement: >-
      MAFFT alignment of the five human UbiB proteins, yeast Coq8p, E. coli UbiB and PKA Calpha
      shows ADCK5 retains both UbiB inhibitory features (KxGQ K147; A-rich loop A209) and the
      complete catalytic core (K228, E281, D360, N365, D382). Published reference residues are
      asserted before use, and the two independently anchored A-rich-loop columns resolve to the
      same alignment column.
  - statement: >-
      Census of the five human UbiB genes: ADCK5 is the only one with zero IBA annotations, and
      the EC downgrade to 2.7.-.- with loss of the Ser/Thr-kinase keyword has been applied only
      to COQ8A and COQ8B, the two members actually assayed.
  - statement: >-
      All 54 IntAct records for Q3MIX3 were retrieved without truncation; the NOTCH2NLA
      interaction is one Y2H screen logged under three sub-method labels plus one further Y2H
      from the same resource lineage, with no orthogonal assay.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Analyses committed alongside this review and reproducible from the gene folder. Guards were
      break-tested in both directions via --self-test, and the anchor guard caught a real error
      during development: PKA Calpha residue numbers taken from the classical Knighton convention
      are offset by one from UniProt P17612's numbering.
