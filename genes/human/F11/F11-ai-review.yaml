core_functions:
- description: Activated factor XIa catalyzes sequential internal cleavage of factor IX to produce active
    factor IXa, directly performing zymogen activation in blood coagulation. The catalytic light chain
    performs hydrolysis, while the A3 region of the heavy chain supports efficient substrate recognition.
    This activity occurs in extracellular plasma and can be organized at the external platelet surface.
    The homodimeric assembly and its substrate-binding regions support this catalytic unit; neither the
    inactive precursor nor an untested shorter splice product is assumed to have the same activity.
  molecular_function:
    id: GO:0004252
    label: serine-type endopeptidase activity
  directly_involved_in:
  - id: GO:0031638
    label: zymogen activation
  - id: GO:0007596
    label: blood coagulation
  locations:
  - id: GO:0005576
    label: extracellular region
  - id: GO:0009897
    label: external side of plasma membrane
  supported_by:
