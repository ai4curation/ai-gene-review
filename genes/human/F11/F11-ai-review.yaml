suggested_questions:
- question: Does the 571-residue platelet-associated splice product form a secreted, correctly processed
    dimer, and how do its platelet association, activation and factor IX-cleaving activity compare with
    the 625-residue precursor?
- question: Under which physiological conditions, if any, does factor XIa's measured plasminogen-activating
    capacity contribute appreciably to fibrinolysis relative to its factor IX-dependent coagulation role?
suggested_experiments:
- description: Express sequence-verified 625- and 571-residue F11 products in the same system and measure
    secretion, chain processing and oligomeric state. Compare matched zymogen and activated preparations
    for binding to washed human platelets with controlled kininogen or prothrombin, and quantify factor
    IX cleavage after normalizing to active-site concentration. Include catalytic-site controls and distinguish
    protein detection from transcript abundance.
- description: Compare factor IX activation, plasmin generation and fibrin-clot lysis across physiological
    concentrations of purified FXIa in defined plasma systems. Include FXI-depleted plasma and add-back,
    active-site inhibition, plasminogen depletion, and controls for kallikrein and activating-enzyme carryover.
    Quantify both coagulation and lysis over matched time courses to determine whether the specialized
    in-vitro capacity contributes under conditions that support clotting.
