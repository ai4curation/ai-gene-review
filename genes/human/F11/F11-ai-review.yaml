id: P03951
gene_symbol: F11
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: F11 encodes coagulation factor XI, a secreted plasma zymogen that forms a disulfide-linked
  homodimer. Proteolytic activation generates factor XIa, with each subunit containing an apple-domain
  heavy chain and a catalytic light chain linked by a disulfide bond. Factor XIa activates factor IX by
  cleaving two internal peptide bonds, sustaining the protease cascade that produces a blood clot. Its
  A3 apple domain contributes to recognition of factor IX, while the serine-protease domain performs bond
  hydrolysis. Factor XI also associates peripherally with the external surface of platelets through receptor-
  and cofactor-dependent interactions. Deficiency of factor XI causes a bleeding disorder, particularly
  after injury or surgery.
