  review:
    summary: 'IBA: cell differentiation, from the ETS family node.'
    action: MODIFY
    reason: 'True but general. The specific differentiation process SPI-C drives is known: Spic-/- mice have a cell-autonomous
      defect in red pulp macrophage development that retroviral Spi-C rescues, and also lack VCAM1-high bone marrow macrophages;
      heme-induced Spic drives monocytes to pre-RPM and RPM. As a transcription factor whose target program (e.g. VCAM1) defines
      the lineage, SPI-C does regulatory work in this differentiation rather than only being required for it. Comparator:
      mouse PU.1 (Sfpi1, P17433) carries GO:0030225. GO has no red-pulp-macrophage-specific child, so macrophage differentiation
      is the most specific available term.'
    proposed_replacement_terms:
    - id: GO:0030225
      label: macrophage differentiation
    supported_by:
    - &id011
      reference_id: PMID:19037245
      supporting_text: Spic(-/-) mice have a cell-autonomous defect in the development of red pulp macrophages that is corrected
        by retroviral Spi-C expression in bone marrow cells, but have normal monocyte and other macrophage subsets
    - &id012
      reference_id: PMID:24630724
      supporting_text: Spic−/− mice were found to be deficient in F4/80hi VCAM1hi BMM in addition to the previously reported
        loss of RPM
    - &id013
      reference_id: PMID:24630724
      supporting_text: These results demonstrate the role of heme in generating pre-RPM and RPM from monocytes.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN000218930
        source_label: ETS family tree node
        source_status: SUPPORTS_TRANSFER
        comment: A family-wide node can only assert generic cell differentiation because ETS members specify different lineages;
          SPIC's own lineage (red pulp and bone marrow iron-recycling macrophages) is known from mouse knockout data, so the
          issue is granularity, not divergence.
