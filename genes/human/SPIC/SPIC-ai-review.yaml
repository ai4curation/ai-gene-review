core_functions:
- description: Sequence-specific DNA-binding transcription factor of the ETS/SPI subgroup that binds PU-box/Ets elements in
    RNA polymerase II promoters and enhancers and activates or represses target genes (e.g. activates VCAM1; antagonizes PU.1/SPI-B
    at shared sites).
  molecular_function:
    id: GO:0000981
    label: DNA-binding transcription factor activity, RNA polymerase II-specific
  directly_involved_in:
  - id: GO:0006357
    label: regulation of transcription by RNA polymerase II
  locations:
  - id: GO:0005634
    label: nucleus
  - id: GO:0000785
    label: chromatin
  supported_by:
  - *id002
  - *id003
  - *id004
  - *id001
- description: 'Lineage-determining transcription factor for iron-recycling macrophages: heme-induced SPI-C drives monocytes
    to differentiate into splenic red pulp macrophages and VCAM1-high bone marrow macrophages, which clear senescent erythrocytes
    and recycle iron.'
  molecular_function:
    id: GO:0000981
    label: DNA-binding transcription factor activity, RNA polymerase II-specific
  directly_involved_in:
  - id: GO:0030225
    label: macrophage differentiation
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - *id011
  - *id012
  - *id013
suggested_questions:
- question: Is human SPIC required for red pulp / iron-recycling macrophage identity as mouse Spic is, and do human loss-of-function
    variants associate with splenic iron accumulation or altered erythrocyte clearance?
- question: Does BACH1 bind the SPIC locus directly, and is heme-BACH1 de-repression of SPIC conserved in human monocytes
    beyond the induction seen with heme-loaded red-cell vesicles?
- question: Is SPI-C repression of PU.1/SPI-B targets (Nfkb1, Rag1, Igkappa) intrinsic repressor activity, or competitive
    occupancy of PU-box sites without recruiting PU.1 partners such as IRF4/PIP?
- question: Beyond VCAM1, which genes of the red pulp macrophage program (CD163, SLC40A1, HMOX1) are direct SPI-C targets
    in vivo, given that SPI-C expression in RAW264.7 induced VCAM-1 but not CD163 or ferroportin?
suggested_experiments:
- description: SPIC ChIP-seq or CUT&RUN combined with RNA-seq in Spic-deficient versus wild-type heme-treated monocyte-derived
    red pulp macrophage precursors to define the direct target set of the iron-recycling macrophage program.
- description: CRISPR knockout of SPIC in human monocyte-derived macrophages exposed to heme or senescent erythrocytes, measuring
    VCAM1, CD163 and ferroportin expression and erythrophagocytic capacity.
- description: Mutational analysis (acidic transactivation domain D-to-A mutants; ETS-domain DNA-binding mutants) at reporter
    and endogenous loci to test whether repression of PU.1 targets needs only DNA binding or also corepressor recruitment.
