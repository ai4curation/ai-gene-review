gene_symbol: SPIC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'SPIC (Spi-C) is an ETS-family transcription factor of the SPI subgroup, related to PU.1 (SPI1) and SPI-B, that
  binds purine-rich PU-box/Ets elements as a monomer through its C-terminal ETS domain and activates transcription through
  an N-terminal acidic transactivation domain. It is expressed mainly in spleen, lymph node, bone marrow and fetal liver.
  In mouse, Spi-C is the lineage-determining factor for iron-recycling macrophages: it is required cell-autonomously for development
  of splenic red pulp macrophages and VCAM1-high bone marrow macrophages, which phagocytose senescent erythrocytes, and Spic-deficient
  mice accumulate iron in the splenic red pulp. Spic is induced in monocytes by heme released from engulfed erythrocytes,
  which inactivates the repressor BACH1; it is also induced by TLR/NF-kB signalling in activated macrophages, where it dampens
  pro-inflammatory cytokine expression and promotes ferroportin expression. VCAM1 is a known direct target. In B cells, Spi-C
  antagonizes PU.1 and SPI-B at shared sites, repressing targets such as Nfkb1, Rag1 and Igkappa and modulating pre-B and
  mature B cell differentiation.'
