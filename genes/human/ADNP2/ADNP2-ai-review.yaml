- term:
    id: GO:0006357
    label: regulation of transcription by RNA polymerase II
  evidence_type: IEA
  original_reference_id: GO_REF:0000108
  qualifier: involved_in
  supporting_entities:
  - GO:0000981
  review:
    summary: >-
      Directionally under-specified, and resting on an antecedent this review removes. GO_REF:0000108 is
      logical inference between ontologies, and the WITH/FROM names GO:0000981 - so this row is a
      mechanical consequence of the TFClass row that is being modified above, and it inherits that row's
      weakness rather than adding evidence. It nonetheless states something true: the retrotransposon
      families that ADNP2 silences are transcribed from LTR promoters by RNA polymerase II, and their
      RNA rises when ADNP2 is removed, so ADNP2 does modulate polymerase II transcription. That
      independent basis is what the term is kept on - and it is also directional, which the term as
      written is not. Every functional observation on ADNP2 or its orthologues is a
      de-repression: ADNP2 loss raises ERV and LINE1 RNA in mouse ES cells, and zebrafish adnp2
      directly occupies and suppresses ved/vent/vox. Nothing reports ADNP2 activating a polymerase II
      gene. So the direction is not merely permitted by the data, it is the only direction the data
      show.
    action: MODIFY
    reason: >-
      Replaced by GO:0000122, which is both better supported and independent of the inference chain
      that produced this row. Two things follow from the change. First, direction: the cited evidence
      is a de-repression result, so the negative-regulation child states what was measured while the
      undirected parent discards it. Second, provenance: as written this row's only stated antecedent
      is GO:0000981, the term this review is modifying, so leaving it in place would leave a row
      hanging off a premise the same review rejects; GO:0000122 rests on the mouse and zebrafish
      loss-of-function data instead. Verified against QuickGO that GO:0000122 is a descendant of
      GO:0006357, so this is a refinement within the branch, and that it neither subsumes nor is
      subsumed by the NEW GO:0010526 row - the two are non-redundant statements, one about the
      polymerase II process and one about the transposon outcome.
    proposed_replacement_terms:
    - id: GO:0000122
      label: negative regulation of transcription by RNA polymerase II
    supported_by:
    - reference_id: PMID:38960717
      supporting_text: In contrast, MMERVK10C derepression was exclusively ADNP2-sensitive despite also being weakly bound by ADNP
    - reference_id: PMID:41822989
      supporting_text: "Adnp2 functions as a transcriptional repressor, and directly occupies \nand suppresses the BMP-related ved/vent/vox homeobox genes"

# ---------------------------------------------------------------- HP1 interactions (one verdict per partner)
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:21888893
  qualifier: enables
  supporting_entities:
  - UniProtKB:P83916
  review:
    summary: >-
      Partner is P83916 CBX1_HUMAN, HP1beta, reviewed Swiss-Prot, 185 aa, matching the canonical entry.
      This is the most informative of the nine interaction rows because the study is a focused HP1
      interactome rather than a proteome-scale screen: tandem affinity purification of the three human
      HP1 isotypes followed by mass spectrometry, annotating only nine entities in all of GOA. HP1beta
      is the physiologically preferred ADNP2 partner, recovered as one of the top two enrichments in
      ADNP2 immunoprecipitations, and full-length human ADNP2 and human HP1beta form a defined complex
      when reconstituted from purified protein.
    action: MODIFY
    reason: >-
      Bare protein binding says nothing. HP1 proteins are engaged through a PxVxL motif docking on the
      chromo shadow domain, and for ADNP2 this is established by mutation rather than by motif-spotting:
      PxVxL point mutants fail to bind HP1beta and lose chromatin occupancy. GO:0070087 records the
      surface actually used, and matches the term the merged ADNP review assigned to the equivalent rows
      on the paralogue, keeping the family consistent.
    proposed_replacement_terms:
    - id: GO:0070087
      label: chromo shadow domain binding
    supported_by:
    - reference_id: PMID:21888893
      supporting_text: "Our analysis identified with \nhigh confidence about 30-40 proteins co-eluted with CBX1 and CBX3"
    - reference_id: PMID:38960717
      supporting_text: As expected, wild-type ADNP2 was able to pull down HP1β and CHD4, whereas ADNP2PxVxL mutants were unable to bind HP1β above background levels

- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:21888893
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q13185
  review:
    summary: >-
      Partner is Q13185 CBX3_HUMAN, HP1gamma, reviewed Swiss-Prot, 183 aa, matching the canonical entry.
      Same focused HP1 interactome as the CBX1 row above, which recovered ADNP2 with both CBX1 and CBX3.
      HP1gamma binding is real but secondary: in ADNP2 immunoprecipitations ADNP2 preferentially binds
      HP1beta over HP1gamma, the reverse of the preference reported for the ADNP-containing ChAHP
      complex.
    action: MODIFY
    reason: >-
      All HP1 paralogues present the same chromo shadow domain to a PxVxL ligand, so the informative
      molecular function is identical for CBX1 and CBX3; what differs is affinity, which the row cannot
      express and which is recorded here instead. Recorded separately from the CBX1 row so that the
      preference is not lost by collapsing partners.
    proposed_replacement_terms:
    - id: GO:0070087
      label: chromo shadow domain binding
    supported_by:
    - reference_id: PMID:21888893
      supporting_text: "Our analysis identified with \nhigh confidence about 30-40 proteins co-eluted with CBX1 and CBX3"
    - reference_id: PMID:38960717
      supporting_text: with the notable difference that ADNP2 preferentially binds HP1β over HP1γ

- term:
