      zebrafish adnpa GO:0005634 IDA PMID:32533114). The term is independently true of ADNP2: ChIP-seq
      of endogenously tagged ADNP2 recovers thousands of chromatin sites, and full-length human ADNP2
      assembles with human HP1beta and human CHD4 into a nuclear chromatin complex.
