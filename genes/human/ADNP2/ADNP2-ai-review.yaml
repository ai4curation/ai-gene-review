  review:
    summary: >-
      Kept, but not as a core function, and the route is thinner than it looks. This is the gene's only
      Ensembl Compara row, and its donor Q8CHC8 is mouse Adnp2 - the true one-to-one orthologue, not the
      ADNP paralogue - so no ADNP-specific or peptide-derived material enters here. What the donor holds
      for this term, however, is a single IEP from PMID:18179478, an inference from expression pattern:
      mouse Adnp2 mRNA is enriched in embryonic brain and rises when P19 cells differentiate. That is an
      expression correlation transferred across species, the weakest experimental code supporting the
      whole chain. The conclusion is nonetheless supported from elsewhere: zebrafish adnp2a/adnp2b
      mutants show reduced pan-neuronal markers, and adnp2 loss impairs neural induction through direct
      repression of ved/vent/vox.
    action: KEEP_AS_NON_CORE
    reason: >-
      A real organismal role for the ADNP2 orthologue group, but not what the human protein does at the
      molecular level, and nothing in the human literature addresses it. Retained rather than removed
      because independent loss-of-function data in a second vertebrate support the conclusion the IEP
      only gestures at.
    supported_by:
    - reference_id: PMID:18179478
      supporting_text: "During development, a relatively \nhigh level of ADNP2 gene expression was found in the embryonic mouse brain"
    - reference_id: PMID:41822989
