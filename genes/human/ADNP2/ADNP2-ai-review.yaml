- id: PMID:38960717
  title: ChAHP2 and ChAHP control diverse retrotransposons by complementary activities.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The single most important reference for this gene and the source of every mechanistic claim in this
      review. PubMed-verified, PMC11293393, full text cached. No retraction, erratum or expression of
      concern on the PubMed record. Note that the in vitro reconstitution used full-length HUMAN ADNP2,
      HP1beta and CHD4, so the complex-assembly evidence applies directly to the human protein, while all
      cellular and functional experiments are in mouse ES cells.
  findings:
  - statement: >-
      ADNP2 immunoprecipitations recover CHD4 and HP1beta as the top two enrichments, defining a ChAHP2
      complex; ADNP2 prefers HP1beta over HP1gamma, the reverse of ADNP's preference, and ADNP and ADNP2
      do not co-purify with one another.
    supporting_text: The bait protein (ADNP2) was strongly enriched in the ADNP2 IPs compared with control, copurifying CHD4 and HP1β as the top two significantly enriched interactors
  - statement: >-
      ChAHP2 reaches chromatin through HP1beta reading H3K9me3, not through DNA sequence recognition by
      ADNP2; mutating the PxVxL motif nearly abolishes binding to H3K9me3 target regions while leaving the
      mark itself intact.
    supporting_text: Mutations in the PxVxL motif resulted in a near-complete loss of ChAHP2 binding to H3K9me3-modified target regions, while H3K9me3 levels remained unchanged
  - statement: >-
      No sequence motif could be defined that explains ADNP2's ChIP-seq distribution, and its peaks are
      overwhelmingly in repeats rather than at transcription start sites.
    supporting_text: In line with this sequence-agnostic recruitment mechanism, we were unable to define a sequence motif that would broadly explain the distribution and specificity of the ADNP2 ChIP-seq signal.
  - statement: >-
      ADNP2 loss de-represses ERV and LINE1 families without reducing H3K9me3, placing ChAHP2 downstream of
      heterochromatin rather than in its establishment.
    supporting_text: H3K9me3 levels at ADNP and ADNP2 peaks were not reduced by either individual or combined removal of these factors

- id: PMID:18179478
  title: Silencing of the ADNP-family member, ADNP2, results in changes in cellular viability under oxidative
    stress.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The sole evidence behind both GO:0007399 rows on this gene, via a mouse Adnp2 IEP. Abstract-only in
      the cache, so nothing here is asserted beyond what the abstract states. Worth noting that the
      abstract's functional result is an siRNA experiment about hydrogen peroxide toxicity, not about
      nervous system development; the nervous-system annotation rests on the expression data in the same
      abstract.
  findings:
  - statement: >-
      Mouse Adnp2 mRNA is enriched in embryonic brain and rises on P19 neuronal/glial differentiation -
      the expression pattern behind the GO:0007399 IEP that both human rows transfer.
    supporting_text: "During development, a relatively \nhigh level of ADNP2 gene expression was found in the embryonic mouse brain"
  - statement: siRNA knockdown of ADNP2 alters hydrogen peroxide toxicity in P19 embryonic carcinoma cells.
    supporting_text: "ADNP2 deficiency significantly changed the toxicity \ninduced by hydrogen peroxide in P19 embryonic carcinoma cells"

- id: PMID:23071114
  title: Novel evolutionary-conserved role for the activity-dependent neuroprotective protein (ADNP) family
    that is important for erythropoiesis.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Abstract-only in the cache. The source of UniProt's by-similarity "May interact with SMARCA4/BRG1"
      SUBUNIT line, and of the erythroid phenotype. The BRG1 interaction is reported for ADNP2 explicitly
      in the abstract, so this is not an ADNP result misattributed to the paralogue - but note that the
      later ChAHP2 proteomics recovered CHD4 rather than SMARCA4, and the two findings have not been
      reconciled.
  findings:
  - statement: BRG1/SMARCA4 was reported to interact with ADNP2, not only with ADNP.
    supporting_text: "Brg1, an ADNP-interacting \nchromatin-remodeling protein involved in erythropoiesis through regulation of \nthe globin locus, was shown here to interact also with ADNP2."
  - statement: Knockdown of ADNP2 blocks erythroid maturation in zebrafish embryos and in mouse erythroleukemia
      cells.
    supporting_text: "Down-regulation/silencing of ADNP or ADNP2 in zebrafish embryos or \nmouse erythroleukemia cells inhibited erythroid maturation"

- id: PMID:41822989
  title: Adnp2 promotes neural induction by antagonizing the ved and vent homeobox genes.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Abstract-only in the cache; nothing is asserted here beyond the abstract. Zebrafish adnp2a/adnp2b, so
      it supports the orthologue group's nervous-system role rather than a human function. Note the
      abstract's own framing is an indirect role in neuroectoderm formation, so it should not be read as
      ADNP2 acting within the neural programme itself.
  findings:
  - statement: Zebrafish adnp2a/adnp2b are required for neural induction and act as transcriptional repressors
      of ved/vent/vox.
    supporting_text: "Adnp2 functions as a transcriptional repressor, and directly occupies \nand suppresses the BMP-related ved/vent/vox homeobox genes"

- id: PMID:15314252
  title: NAP mechanisms of neuroprotection.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Cited here only to characterise a donor annotation, not to support anything about ADNP2. This is the
      reference behind rat Adnp's GO:0010629 IDA, which is one of the two IBD seed contributions to ADNP2's
      GO:0010468 IBA row. Its subject is the synthetic octapeptide NAPVSIPQ, not the Adnp gene product -
      the defect class the merged ADNP review classified SOURCE_BAD plus ROLE_CONFLATION. Abstract-only in
      the cache, which is sufficient for this purpose since the title and abstract establish the molecule
      assayed.
  findings:
  - statement: >-
      The paper's subject is the synthetic eight-residue peptide NAPVSIPQ, a fragment of ADNP supplied
      exogenously, rather than the ADNP protein.
    supporting_text: "An 8-amino-acid peptide, NAPVSIPQ (NAP), was identified as the smallest active \nelement of activity-dependent neuroprotective protein"

- id: PMID:32533114
  title: ADNP promotes neural differentiation by modulating Wnt/β-catenin signaling.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Cited only as donor evidence. Supplies mouse Adnp's GO:0010468 IMP and zebrafish adnpa's GO:0005634
      IDA, that is, the gene-product experiments that carry ADNP2's two IBA rows. About ADNP, not ADNP2.

- id: PMID:17222401
  title: Activity-dependent neuroprotective protein (ADNP) differentially interacts with chromatin to regulate
    genes essential for embryogenesis.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Cited only as donor evidence: mouse Adnp's GO:0000981 and GO:0006357 IDA rows, both in the GO:0010468
      subtree. About ADNP, not ADNP2.

- id: PMID:29795351
  title: Activity-dependent neuroprotective protein recruits HP1 and CHD4 to control lineage-specifying genes.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      The ChAHP paper. Cited as the donor evidence behind human ADNP's GO:0090575 IDA, which seeds ADNP2's
      nucleus IBA, and as the comparator establishing that ADNP's complex is ADNP-CHD4-HP1. About ADNP, not
      ADNP2.

- id: PMID:21888893
  title: Analysis of the human HP1 interactome reveals novel binding partners.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The most informative of the six interaction references: a focused tandem-affinity-purification study
      of the three human HP1 isotypes, annotating only nine distinct entities across all of GOA, that
      recovers ADNP2 with both CBX1 and CBX3. Abstract-only in the cache, so the ADNP2-specific detail is
      taken from the GOA rows rather than from the text.

- id: PMID:24981860
  title: Human-chromatin-related protein interactions identify a demethylase complex required for chromosome
    segregation.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Chromatin-focused affinity-purification survey; 314 distinct entities in GOA. Corroborates the
      ADNP2-HP1beta pair. Abstract-only in the cache.

- id: PMID:27705803
  title: A High-Density Map for Navigating the Human Polycomb Complexome.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Polycomb complexome interaction map; 135 distinct entities in GOA. Recovers ADNP2 with both CBX1 and
      CBX3. Abstract-only in the cache.

- id: PMID:32296183
  title: A reference map of the human binary protein interactome.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      HuRI systematic yeast two-hybrid. 85343 annotations in GOA, so a reference-projection test is
      uninformative for it by construction and no independence claim is made from it. Its value is that a
      binary method agrees with the affinity-purification references on CBX3.

- id: PMID:33961781
  title: Dual proteome-scale networks reveal cell-specific remodeling of the human interactome.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      BioPlex; 9514 annotations in GOA. Corroborative only, for both CBX1 and CBX3.

- id: PMID:35271311
  title: 'OpenCell: Endogenous tagging for the cartography of human cellular organization.'
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Endogenous tagging, so free of the over-expression objection that applies to HuRI and to
      transfection-based pulldowns. This is the strongest single line of human cellular evidence for the
      ADNP2-HP1beta interaction.

- id: PMID:39273418
  title: Genetic and Environmental Factors Co-Contributing to Behavioral Abnormalities in adnp/adnp2 Mutant
    Zebrafish.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Returned by the affinage record. Zebrafish adnp/adnp2 mutants; supports a nervous-system role for the
      orthologue group but nothing at the molecular level and nothing human. No GO annotation on ADNP2
      rests on it.

- id: PMID:39251453
  title: Sex-Specific ADNP/NAP (Davunetide) Regulation of Cocaine-Induced Plasticity.
  reference_review:
    relevance: NONE
    correctness: VERIFIED
    review_notes: >-
      Returned by the affinage record and deliberately not used. Its own title names NAP/davunetide: it is
      a study of the synthetic ADNP-derived peptide, and its only ADNP2 content is a transient change in
      Adnp2 mRNA after cocaine injection in mice. Using it would import exactly the peptide-pharmacology
      confusion that the merged ADNP review identified, into a gene that does not even contain the peptide.
      Recorded here so that the exclusion is deliberate and visible rather than silent.

- id: file:human/ADNP2/ADNP2-bioinformatics/RESULTS.md
  title: 'ADNP2 bioinformatics: NAP-peptide propagation audit, PxVxL motif with its compositional null,
    and IBD-seed evidence resolution'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Generated by the committed analyze_adnp2_propagation.py, which re-derives every number at run time
      and asserts its own preconditions: the NAP scan fails loudly unless the ADNP orthologue positive
      controls carry the octapeptide, and the PxVxL scan refuses to report ADNP2's column unless it first
      reproduces the merged ADNP review's published figures exactly. Note that the repo's reference
      validator does not check file: quotes, so the three quotations of this document were verified by
      hand with a literal substring match and a single-physical-line requirement.
