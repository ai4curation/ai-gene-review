    reason: >-
      A nuclear chromatin factor by direct observation. Node PTN000405125 spans 44 ADNP and ADNP2
      orthologues and propagates exactly two terms to all of them (this one and GO:0010468), which is
      an appropriately conservative last-common-ancestor call for a node whose two halves have
