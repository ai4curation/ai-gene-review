    summary: >-
      Accepted as a core localisation. Every seed named in the WITH/FROM is an ADNP-clade gene rather
      than an ADNP2 orthologue - UniProtKB:Q9H2P0 is human ADNP and ZFIN:ZDB-GENE-061215-112 is
      zebrafish adnpa - but PANTHER:PTN000405125 is the node ancestral to both paralogue clades, so a
      paralogue seed is the correct construction here rather than a defect, and both seeds carry their
