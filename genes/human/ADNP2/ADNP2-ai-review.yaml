# ---------------------------------------------------------------- proposed addition
- term:
    id: GO:0010526
    label: transposable element silencing
  evidence_type: ISS
  original_reference_id: PMID:38960717
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q8CHC8
  review:
    summary: >-
      Proposed addition. ADNP2's best-characterised biological role has no representation in its GO
      record at all: the gene's only biological-process rows are a general regulation-of-gene-expression
      IBA and a nervous-system-development transfer. Ablating Adnp2 in mouse embryonic stem cells
      de-represses specific ERV and LINE1 families, with MMERVK10C responding to ADNP2 alone and L1MdA
      only when ADNP is removed as well, and ADNP2 ChIP-seq places the protein on exactly those
      elements. Proposed as ISS from mouse Adnp2 rather than as a direct annotation, because the
      loss-of-function experiments are in mouse; the human protein contributes only the in vitro
      complex reconstitution.
    action: NEW
    reason: >-
      GO:0010526 and not its child GO:0141005 transposable element silencing by heterochromatin
      formation, which would be the reflexive choice and is wrong on the definition: GO:0141005 requires
      the silencing mechanism to involve heterochromatin assembly, and H3K9me3 at ADNP2 sites is
      unchanged by single or combined removal of ADNP and ADNP2. ChAHP2 reads the heterochromatin mark
      and does not deposit it, so the parent term is the most specific one the evidence permits. The
      absence of a term for reader-mediated, assembly-independent silencing is recorded as an ontology
      gap.
    supported_by:
    - reference_id: PMID:38960717
      supporting_text: In contrast, MMERVK10C derepression was exclusively ADNP2-sensitive despite also being weakly bound by ADNP
    - reference_id: PMID:38960717
      supporting_text: H3K9me3 levels at ADNP and ADNP2 peaks were not reduced by either individual or combined removal of these factors
    - reference_id: PMID:38960717
      supporting_text: In contrast to ChAHP, ChAHP2 does not bind euchromatic SINEs but is instead targeted to H3K9me3-modified LTR and LINE1 elements.

core_functions:
# Deliberately ONE core function rather than two. An earlier draft split the HP1
# docking and the repressive output, and put GO:0140110 in molecular_function on
# the second - which asserts that ADNP2 enables transcription regulator activity
# independently, contradicting this review's own position that the repressive step
# may belong to CHD4. Merged, with GO:0140110 moved to
# contributes_to_molecular_function, which is the slot for a complex-level activity
# a subunit does not independently have.
- description: >-
    Docks the HP1 proteins into the ChAHP2 assembly, and thereby brings the complex's repressive
    activity to heterochromatic retrotransposons. ADNP2's short C-terminal tail carries a PxVxL motif
    immediately after the homeodomain, and this is the motif HP1 chromo shadow domains read: point
    mutation of it abolishes HP1beta binding and, with it, ChAHP2's occupancy of H3K9me3-marked
    chromatin, while leaving CHD4 binding and H3K9me3 itself intact. HP1beta is the preferred partner and
    HP1gamma is bound less well. Because ADNP2 has no demonstrable sequence read-out of its own, this
    interaction is the gene's targeting mechanism rather than one interaction among many, and it is the
    point at which ADNP2 diverges functionally from ADNP, which reaches euchromatic SINEs by binding DNA
    directly. The downstream consequence is repression: removing ADNP2 raises the RNA of specific ERV and
    LINE1 classes - MMERVK10C responds to ADNP2 alone, L1MdA only when ADNP is removed as well - without
    lowering H3K9me3 at those loci, so ADNP2 operates downstream of the heterochromatin mark rather than
    helping to place it. That repressive output is recorded as a contributed, complex-level activity
    rather than one ADNP2 enables: the molecular step by which the bound complex represses is unresolved,
    the authors propose CHD4 remodelling without testing it, and ADNP2's own established role is holding
    HP1beta and CHD4 together.
  molecular_function:
    id: GO:0070087
    label: chromo shadow domain binding
  contributes_to_molecular_function:
    id: GO:0140110
    label: transcription regulator activity
  directly_involved_in:
  - id: GO:0010526
    label: transposable element silencing
  - id: GO:0000122
    label: negative regulation of transcription by RNA polymerase II
  locations:
  - id: GO:0005634
    label: nucleus
  - id: GO:0000785
    label: chromatin
  # in_complex is intentionally unfilled: ADNP2's defining identity is membership of
  # ChAHP2, and GO has no term for it. See proposed_new_terms[0]; fill this slot when
  # that term is created.
  supported_by:
  - reference_id: PMID:38960717
    supporting_text: As expected, wild-type ADNP2 was able to pull down HP1β and CHD4, whereas ADNP2PxVxL mutants were unable to bind HP1β above background levels
  - reference_id: PMID:38960717
    supporting_text: Overall, these data demonstrate that HP1β-mediated binding of H3K9me3 nucleosomes targets ChAHP2 to heterochromatinized retrotransposons
  - reference_id: PMID:38960717
    supporting_text: In contrast, the C-terminal HP1 interaction motif (PxVxL) (Thiru et al. 2004; Mosch et al. 2011) is well conserved.
  - reference_id: PMID:38960717
    supporting_text: In contrast, MMERVK10C derepression was exclusively ADNP2-sensitive despite also being weakly bound by ADNP
  - reference_id: PMID:38960717
    supporting_text: H3K9me3 levels at ADNP and ADNP2 peaks were not reduced by either individual or combined removal of these factors
  - reference_id: PMID:38960717
    supporting_text: Given that loss of ChAHP/ChAHP2 does not result in compromised H3K9 trimethylation, the most likely mechanism that would confer repressive activities to ChAHP complexes is chromatin remodeling by CHD4.

knowledge_gaps:
- gap_statement: >-
    What ADNP2 itself contributes catalytically or allosterically inside ChAHP2 is unknown. Its
    established roles are structural - it holds HP1beta and CHD4 together and is dispensable for the
    H3K9me3 mark - and the repressive step is attributed to CHD4 remodelling on the strength of
    elimination rather than of a direct test. ADNP2 may be a pure scaffold.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  boundary: >-
    Known: ADNP2 binds HP1beta through PxVxL and co-assembles with CHD4 from purified human protein;
    ADNP2 loss de-represses ERVs and LINE1s. Unknown: whether ADNP2 does anything to chromatin beyond
    positioning the other two subunits.
  provenance:
  - reference_id: PMID:38960717
    supporting_text: Given that loss of ChAHP/ChAHP2 does not result in compromised H3K9 trimethylation, the most likely mechanism that would confer repressive activities to ChAHP complexes is chromatin remodeling by CHD4.

- gap_statement: >-
    Whether ADNP2 binds DNA at all has never been measured. It carries a homeodomain and nine C2H2 zinc
    fingers with intact zinc-coordinating residues, so GO:0003677 is annotated from the fold, but no
    binding assay has been reported, the residues that would set zinc-finger specificity differ from
    ADNP's, and no sequence motif explains its genome-wide occupancy. The generic term is unrefuted; the
    specific one is contradicted.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  boundary: >-
    Known: the DNA-binding folds are present and detected by four independent signatures; chromatin
    occupancy is HP1beta-dependent and motif-free. Unknown: whether the homeodomain or the zinc fingers
    contact DNA in any context, for instance at the minority of ADNP2 sites that are not repeats.
  provenance:
  - reference_id: PMID:38960717
    supporting_text: the residues that normally determine sequence specificity of zinc fingers vary between ADNP and ADNP2

- gap_statement: >-
    Two experimentally reported human ADNP2 interactions are absent from GOA. CHD4 co-purifies with
    ADNP2 as one of the top two enrichments and forms a defined complex with purified full-length human
    ADNP2 and human HP1beta, yet no GO:0005515 row names it; SMARCA4/BRG1 was reported to interact with
    ADNP2 and reaches UniProt only as a by-similarity SUBUNIT line. All nine of ADNP2's interaction rows
    name an HP1 paralogue.
  gap_kind:
  - CURATION
  status: OPEN
  boundary: >-
    Known: both interactions are in the primary literature. Unknown to GOA: neither is annotated, so the
    ChAHP2 complex cannot be reconstructed from ADNP2's GO record.
  provenance:
  - reference_id: PMID:38960717
    supporting_text: For cloning, cDNA encoding full-length human ADNP2 (amino acid residues 1–1131) was PCR-amplified
  - reference_id: PMID:23071114
    supporting_text: "Brg1, an ADNP-interacting \nchromatin-remodeling protein involved in erythropoiesis through regulation of \nthe globin locus, was shown here to interact also with ADNP2."

- gap_statement: >-
    GO has no term for the ChAHP2 complex, nor for ChAHP, and no term for silencing that is targeted by
    heterochromatin without establishing it. ADNP2's defining biological identity therefore cannot be
    recorded as complex membership, and its silencing role can only be recorded at the bare parent
    GO:0010526, since the obvious child GO:0141005 asserts a heterochromatin-assembly mechanism the data
    exclude.
  gap_kind:
  - ONTOLOGY
  status: OPEN
  boundary: >-
    Known: composition (ADNP2 plus HP1beta plus CHD4), reconstituted from purified human proteins with
    defined stoichiometry by SEC-MALS; silencing is downstream of an H3K9me3 mark ADNP2 does not place.
    Missing: a cellular-component term for the complex, and a biological-process term for reader-mediated
    silencing.
  provenance:
  - reference_id: PMID:38960717
    supporting_text: Finally, to directly confirm that ADNP2, HP1β, and CHD4 form a stable complex, we performed in vitro reconstitutions.
  - reference_id: PMID:38960717
    supporting_text: H3K9me3 levels at ADNP and ADNP2 peaks were not reduced by either individual or combined removal of these factors

- gap_statement: >-
    The whole functional description of ADNP2 rests on mouse embryonic stem cells and zebrafish. Human
    ADNP2 has never been depleted in a human cell line, so whether it silences human retrotransposons,
    and which ones, is untested; correspondingly the human gene has no experimental annotation to any
    biological process.
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  status: NARROWING
  boundary: >-
    Known for human: the protein exists (PE 1), is nuclear, and assembles with HP1beta and CHD4 in vitro
    from human sequences. Unknown for human: every functional consequence.
  provenance:
  - reference_id: PMID:38960717
    supporting_text: Genetic ablation of ADNP2 alleviates ERV

proposed_new_terms:
- proposed_name: ChAHP2 complex
  proposed_definition: >-
    A protein-containing complex composed of ADNP2, a heterochromatin protein 1 paralogue (predominantly
    HP1beta/CBX1) and the CHD4 nucleosome remodeller, recruited to H3K9-trimethylated heterochromatin
    through the HP1 subunit, where it represses endogenous retroviruses and LINE1 elements. Distinct in
    composition and chromatin targeting from the ADNP-containing ChAHP complex, with which it does not
    exchange subunits.
  proposed_parent:
    id: GO:0032991
    label: protein-containing complex
  justification: >-
    Directly reconstituted from purified full-length human ADNP2, human HP1beta and human CHD4 and
    characterised by SEC-MALS, and recovered by affinity purification of endogenously tagged ADNP2 in
    mouse ES cells. ADNP and ADNP2 do not co-purify, so the two complexes are separate entities rather
    than variants of one. Should be created alongside the ChAHP complex term proposed by the merged ADNP
    review.
  supported_by:
  - reference_id: PMID:38960717
    supporting_text: Finally, to directly confirm that ADNP2, HP1β, and CHD4 form a stable complex, we performed in vitro reconstitutions.
  - reference_id: PMID:38960717
    supporting_text: Importantly, no ADNP was copurified with ADNP2 and vice versa, suggesting that their interaction networks are separate.

suggested_questions:
- question: >-
    For PAINT, first of two. PANTHER node PTN000405125 spans 44 gene products covering both the ADNP and
    ADNP2 orthologue clades and propagates two terms, GO:0005634 and GO:0010468. One of the two IBD seeds
    named for GO:0010468 is rat Adnp (RGD:71030), whose only experimental annotation in that term's
    subtree is GO:0010629 IDA citing PMID:15314252, a paper whose subject is the synthetic ADNP-derived
    octapeptide NAPVSIPQ and not the Adnp gene product. Should a seed annotation derived from a synthetic
    peptide fragment count toward an IBD? The row survives here only because the co-seed, mouse Adnp,
    carries a genuine gene-product IMP for the same term.
  experts:
  - GO Central / PAINT curators
- question: >-
    For PAINT, second of two, and stated once here for both genes rather than repeated on each.
    PTN000405125 is the ONLY node in PTHR15740 annotated by PAINT, so human ADNP and human ADNP2 receive
    byte-identical IBA rows - same two terms, same node, same WITH/FROM strings - and the IBA record
    cannot distinguish the paralogues at all. Two consequences. (1) The containment of the peptide-derived
    material to ADNP is not a fine-grained PAINT judgement about the paralogues; it follows from Ensembl
    Compara projecting along orthologues, while PAINT simply annotated the shared ancestor generically.
    (2) It leaves a coverage gap in both directions: ADNP's sequence-specific DNA binding and ADNP2's
    HP1-mediated heterochromatin targeting are each well characterised and clade-restricted, and neither
    reaches its own clade. The concrete suggestion is that GO:0070087 chromo shadow domain binding is a
    good candidate for the FAMILY node rather than a clade node - the PxVxL motif is conserved between
    the two paralogues and across vertebrates, ADNP and ADNP2 both bind HP1, and this review and the
    merged ADNP review independently assigned that same term - whereas the DNA-sequence-specificity and
    the euchromatic-SINE versus heterochromatic-ERV target split are exactly the things that should NOT
    be placed at the shared node, since the two halves demonstrably diverge there.
  experts:
  - GO Central / PAINT curators
- question: >-
    For NTNU_SB and TFClass. Would you consider adding ADNP2 to the GO_REF:0000113 exclusion set - the
    18 entities that already receive GO:0000785 without GO:0000981? ADNP2's GO:0000981 arrives by ISA
    from tfclass:3.1.8, whose reach is 14 human zinc-finger/homeodomain proteins that all receive the
    identical term pair. But the only genome-wide study of ADNP2 occupancy reports that no sequence
    motif explains its ChIP-seq signal, that its peaks are overwhelmingly repeats with few at
    transcription start sites, and that chromatin binding is nearly abolished by mutating its
    HP1-docking motif; GO:0003700 requires binding a specific sequence within a cis-regulatory region.
    Two precedents already inside the import, and they do different work. HMBOX1 (Q6NT76) carries a
    DNA_BIND feature annotated "Homeobox" at 267-341 - the identical note to ADNP2's "Homeobox" at
    1043-1102, i.e. an intact domain, not a degenerate one - and it receives GO:0000785 without
    GO:0000981. That is the fold-symmetry precedent. HOPX (Q9BPY8) carries the biological one: UniProt
    describes it as an "Atypical homeodomain protein which does not bind DNA" and it too is excluded -
    but its DNA_BIND note reads "Homeobox; degenerate", so it does NOT establish that an intact domain
    can be excluded, and citing it alone would invite exactly that reply. Every figure in this question
    is reproducible from the committed
    ADNP2-bioinformatics/analyze_adnp2_propagation.py, which emits the node's gene list and the
    chromatin-only exclusion set as sets rather than counts, so the 18 members are diffable rather than
    a number to be taken on trust; it also asserts that HOPX really is in that set, that both proteins
    really do carry a DNA_BIND feature, and that at least one excluded entity has a NON-degenerate
    domain, refusing to report if any of those is false. To be explicit about what carries the ask: the
    positive argument for ADNP2 is the measured failure to find a motif, not symmetry of fold with any
    excluded protein - the exclusion set only shows that this import has a mechanism for withholding
    GO:0000981 and already applies it to an intact-domain homeodomain protein. Worth adding that this
    repo already adjudicates HMBOX1: projects/TRANSCRIPTION_FACTORS/dbTF-discrepancy-analysis.md lists it
    among proteins "correctly excluded", with the reason "Telomere binding, not gene regulation", under
    the heading DBD != dbTF. So HMBOX1 is not excluded for failing to bind DNA - it does bind DNA, at
    telomeric repeats - but for not being a DNA-binding transcription factor. That is a closer fit to
    ADNP2 than "does not bind DNA" would be, and it is why GO:0003677 is retained here while GO:0000981
    is not: the homeodomain and zinc fingers are intact and unrefuted, and what the ChIP-seq refutes is
    specifically the sequence-specific polymerase II transcription-factor reading. Finally, the ask needs
    no new mechanism. The import operates at two granularities - of the 11 nodes reaching an excluded
    entity, 7 withhold GO:0000981 from a strict subset while the rest of the node keeps it, and 4
    withhold it from every member - and the one ADNP2 needs is the first, which class 3.1 already
    supplies twice: HOPX is excluded alone out of the 47 members of tfclass:3.1.3, and HMBOX1 alone out
    of the 19 members of tfclass:3.1.10, while ADNP2's own node tfclass:3.1.8 stands at 14/14. So this
    would take one node from 14/14 to 13/14 and would not touch ADNP, whose sequence-specific binding is
    measured and whose GO:0000981 should stay. That granularity is measured in the committed script
    rather than assumed, because had it come out the other way the correct request would have been a
    different one. The
    GO:0000785 assignment on ADNP2 is correct and should be kept either way.
  experts:
  - NTNU_SB curators
- question: >-
    For UniProt. The Q6IQ32 entry's FUNCTION and SUBUNIT lines are entirely ECO:0000250 by-similarity
    statements from mouse Adnp2 and predate the ChAHP2 work, so the entry does not mention HP1beta, CHD4
    or retrotransposon silencing, and its SIMILARITY line places ADNP2 only in the krueppel C2H2-type
    zinc-finger protein family. The entry also still carries GO:0003677, GO:0008270 and GO:0006351 as
    IEA:UniProtKB-KW keyword mappings, a route GOA no longer imports, so the keyword-derived claims are
    now visible only in UniProt.
  experts:
  - UniProt curators
- question: >-
    For GO. Is a term needed for silencing that is targeted by, but does not establish, heterochromatin?
    GO:0141005 transposable element silencing by heterochromatin formation is the obvious term for ChAHP2
    and is wrong for it: H3K9me3 is unchanged when ADNP2 is removed, so the complex reads the mark rather
    than depositing it. The only correct available term is the bare parent GO:0010526, which loses the
    mechanism entirely.
  experts:
  - GO ontology editors

suggested_experiments:
- description: >-
    Deplete ADNP2 in a human cell line and sequence the repeat transcriptome. Every functional claim
    about ADNP2 currently comes from mouse ES cells or zebrafish; the human protein has only ever been
    assayed biochemically. Human ERV and LINE1 families differ substantially from mouse, so whether
    ChAHP2's target set is conserved is an open question, not a formality. Pair with an ADNP double
    depletion, since the mouse data show that some elements are de-repressed only when both paralogues
    are lost.
- description: >-
    Test whether ADNP2 contacts DNA. An in vitro binding assay with purified full-length human ADNP2 -
    already produced in this system - against naked DNA, and a SELEX or protein-binding-microarray screen
    on the isolated homeodomain and zinc-finger clusters, would settle whether GO:0003677 is supportable
    on measurement rather than on the fold. A negative would be as informative as a positive and would
    justify removing the term.
- description: >-
    Ask whether ADNP2 is required to bridge HP1beta and CHD4, or merely co-resident with them. The
    published reconstitution mixed ADNP2/HP1beta with separately expressed CHD4, which does not exclude a
    direct HP1beta-CHD4 contact. Reconstituting HP1beta with CHD4 in the absence of ADNP2 is the missing
    control, and it is what would convert the scaffold description into an adaptor activity annotation.
- description: >-
    Determine whether ADNP2's second PxVxL candidate, PPVLV at 662-666, is functional. The C-terminal
    PSVLL at 1107-1111 is the one that aligns to ADNP's motif and the one mutated in the published work;
    the internal candidate has no ADNP counterpart. A double mutant would show whether HP1 binding is
    fully accounted for by the C-terminal site.

