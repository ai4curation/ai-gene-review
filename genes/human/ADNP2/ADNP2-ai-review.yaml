id: Q6IQ32
gene_symbol: ADNP2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  ADNP2 is a nuclear, chromatin-associated protein of 1131 residues built from nine C2H2 zinc fingers
  arranged in two N-terminal clusters and a single C-terminal homeodomain, followed by a short tail
  carrying a PxVxL motif. It is the defining subunit of ChAHP2, a three-protein assembly of ADNP2, the
  HP1 paralogue HP1beta/CBX1 and the CHD4 nucleosome remodeller, which can be reconstituted from
  purified full-length human ADNP2, HP1beta and CHD4. ADNP2 docks HP1 through its PxVxL motif, and it
  is HP1beta's recognition of H3K9-trimethylated nucleosomes, rather than any sequence read-out by
  ADNP2 itself, that determines where the complex sits: ADNP2 occupies several thousand sites that are
  overwhelmingly heterochromatic repeats - endogenous retroviruses and LINE1 elements - with few peaks
  at transcription start sites, and no DNA sequence motif accounts for its distribution. Losing ADNP2
  de-represses those retrotransposons without lowering H3K9me3, so ADNP2 acts downstream of
  heterochromatin rather than establishing it. Its paralogue ADNP forms the compositionally similar
  ChAHP complex but occupies euchromatic SINEs through sequence-specific DNA binding; the two proteins
  do not co-purify, their target classes barely overlap, and some elements are silenced only when both
  are removed, so the two complexes divide retrotransposon control between them. Outside chromatin,
  reducing ADNP2 alters the sensitivity of cultured cells to hydrogen peroxide, and loss of the
  zebrafish orthologues impairs erythroid maturation and neural induction, the latter through direct
  repression of BMP-related ventralising homeobox genes.

