- term:
    id: GO:0010468
    label: regulation of gene expression
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:1338758
  - PANTHER:PTN000405125
  - RGD:71030
  review:
    summary: >-
      Accepted, but this is the one ADNP2 row whose donor set contains NAP-peptide pharmacology, so the
      provenance and the soundness have to be stated separately. RGD:71030 is rat Adnp, and its only
      experimental annotation anywhere in this term's subtree is GO:0010629 IDA from PMID:15314252, a
      paper titled "NAP mechanisms of neuroprotection" whose subject is the synthetic octapeptide
      NAPVSIPQ rather than the gene product - the same defect class the merged ADNP review classified
      SOURCE_BAD plus ROLE_CONFLATION. That is provenance, and on its own it supports no verdict. The
      substantive question is whether the chain is empty of gene-product evidence, and it is not: the
      co-seed MGI:MGI:1338758 is mouse Adnp, which carries GO:0010468 IMP from PMID:32533114 and two
      IDA rows (GO:0000981, GO:0006357) from PMID:17222401, all perturbations of the protein. So one of
      two seeds contributes peptide pharmacology and the other contributes gene-product experiments,
      and the row stands on the second.
    action: ACCEPT
    reason: >-
      Independently true of ADNP2 regardless of the donor set: ablating ADNP2 in mouse ES cells raises
      the RNA of specific retrotransposon families, with MMERVK10C responding to ADNP2 alone. The
      general term is the right depth for a node that also covers ADNP, whose regulatory targets and
      recruitment mechanism are different. The row-level root cause is therefore NO_FAILURE_CORE even
      though one of its three source entities is marked SOURCE_BAD; that combination is deliberate and
      is the point of the row. The rat seed's peptide-derived contribution is recorded so it is visible
      if this row is revisited, and it is worth reporting upstream: a seed annotation resting on a
      synthetic peptide should not be counted toward an IBD.
    supported_by:
    - reference_id: PMID:38960717
      supporting_text: In contrast, MMERVK10C derepression was exclusively ADNP2-sensitive despite also being weakly bound by ADNP
    - reference_id: PMID:15314252
      supporting_text: "An 8-amino-acid peptide, NAPVSIPQ (NAP), was identified as the smallest active \nelement of activity-dependent neuroprotective protein"
    - reference_id: file:human/ADNP2/ADNP2-bioinformatics/RESULTS.md
      supporting_text: "Human and mouse ADNP2 contain **no NAPVSIPQ and not one `NAP` tripeptide** in 1131 / 1165 residues."
    - reference_id: file:human/ADNP2/ADNP2-bioinformatics/RESULTS.md
      supporting_text: "ADNP's rat-Compara block covers **19 terms**. Terms from that block that also appear on ADNP2: **none**."
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: MGI:MGI:1338758
        source_status: SUPPORTS_TRANSFER
        comment: >-
          Mouse Adnp, resolves to Q9Z103 ADNP_MOUSE, reviewed (Swiss-Prot), 1108 aa. Carries its own
          GO:0010468 IMP (PMID:32533114) plus GO:0000981 and GO:0006357 IDA (PMID:17222401). These are
          experiments on the protein, and they are what the row rests on.
      - source_id: PANTHER:PTN000405125
        source_status: SUPPORTS_TRANSFER
        comment: >-
          PANTHER internal tree node covering both the ADNP and ADNP2 orthologue clades; not a protein.
      - source_id: RGD:71030
        source_status: SOURCE_BAD
        comment: >-
          Rat Adnp, resolves to Q9JKL8 ADNP_RAT, reviewed (Swiss-Prot), 1103 aa. Its sole experimental
          annotation in this subtree, GO:0010629 IDA, cites PMID:15314252, which assays the synthetic
          NAPVSIPQ octapeptide rather than the Adnp gene product. Marked SOURCE_BAD at the entity level
          because that is what it is, while the row as a whole is sound because the co-seed supplies
          gene-product evidence for the same term.

# ---------------------------------------------------------------- domain- and classification-derived
- term:
    id: GO:0003677
    label: DNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR001356
  review:
    summary: >-
      Kept, but not as a core function. The signature is genuine and intact: ADNP2 carries a homeodomain
      at 1043-1102 detected independently by InterPro IPR001356, SMART HOX, PROSITE PRU00108 and SUPFAM
      Homeodomain-like, alongside nine C2H2 zinc fingers whose zinc-coordinating residues are conserved.
      GO:0003677 asserts only that the protein interacts selectively with DNA, with no claim of sequence
      specificity, so nothing in the ADNP2 literature contradicts it. What is missing is any positive
      measurement: no direct DNA-binding assay on ADNP2 has been published, and the one genome-wide
      occupancy study attributes ADNP2's chromatin distribution to HP1beta reading H3K9me3 and reports
      that no sequence motif explains it. Untested rather than refuted.
    action: KEEP_AS_NON_CORE
    reason: >-
      A fold-derived generic term that survives on its own terms - the fold is present and the definition
      makes no specificity claim - but it cannot be presented as what ADNP2 does, because the protein's
      measured route to chromatin runs through a partner rather than through its own DNA contacts.
      Contrast the paralogue ADNP, where sequence-specific binding is measured and the corresponding
      term is core.
    supported_by:
    - reference_id: PMID:38960717
      supporting_text: The domain architecture of ADNP2 resembles that of ADNP, with nine zinc fingers distributed in two N-terminal clusters and one C-terminal homeodomain.
    - reference_id: PMID:38960717
      supporting_text: In line with this sequence-agnostic recruitment mechanism, we were unable to define a sequence motif that would broadly explain the distribution and specificity of the ADNP2 ChIP-seq signal.

- term:
    id: GO:0000981
    label: DNA-binding transcription factor activity, RNA polymerase II-specific
  evidence_type: ISA
  original_reference_id: GO_REF:0000113
  qualifier: enables
  supporting_entities:
  - tfclass:3.1.8
  review:
    summary: >-
      Over-specific in a way the definition makes decisive. GO:0000981 inherits from GO:0003700, whose
      definition requires modulating transcription "via selective and non-covalent binding to a specific
      double-stranded genomic DNA sequence (sometimes referred to as a motif) within a cis-regulatory
      region". Three independent observations from the only genome-wide study of ADNP2 occupancy run
      against each clause: the authors could not define any sequence motif explaining the ChIP-seq
      signal; the peaks are overwhelmingly in repeats with few at transcription start sites, that is,
      not at cis-regulatory regions; and recruitment tracks HP1beta binding H3K9me3, since mutating the
      PxVxL motif nearly abolishes chromatin binding. The zinc fingers reinforce the point - their
      zinc-coordinating residues are conserved with ADNP but the residues that set sequence specificity
      are not. The assignment route is a structural classification (TFClass 3.1.8, a homeodomain family),
      so this is a fold read as an activity, and the homeodomain is exactly the feature the measurement
      declines to convert into sequence-specific binding.
    action: MODIFY
    reason: >-
      ADNP2 genuinely controls transcription - deleting it raises retrotransposon RNA - so the right
      correction is to drop the sequence-specificity claim rather than the regulatory one. GO:0140110
      transcription regulator activity is the ancestor that keeps what is measured and drops what is
      not; it is also the correct term while the mechanism is unresolved, which it is, the authors
      offering CHD4 remodelling as the likely but untested explanation. Verified against QuickGO that
      GO:0000981 is a descendant of both GO:0003700 and GO:0140110, so this is a generalisation within
      one branch and not a move sideways. The node-reach measurement makes this stronger than a
      one-gene objection: tfclass:3.1.8 reaches exactly 14 human gene products - ADNP, ADNP2, HOMEZ,
      TSHZ1/2/3, ZEB1/2, ZFHX2/3/4, ZHX1/2/3 - and gives every one of them the identical pair
      {GO:0000785, GO:0000981}, so the term is a property of being in the class rather than a judgement
      about ADNP2. Two of those genes cannot both be right here: ADNP's GO:0000981 is independently
      supported by a measured motif, and ADNP2's is contradicted by the failure to find one.
    proposed_replacement_terms:
    - id: GO:0140110
      label: transcription regulator activity
    supported_by:
    - reference_id: PMID:38960717
      supporting_text: In line with this sequence-agnostic recruitment mechanism, we were unable to define a sequence motif that would broadly explain the distribution and specificity of the ADNP2 ChIP-seq signal.
    - reference_id: PMID:38960717
      supporting_text: Intriguingly, the majority of ADNP2 peaks were found in repeat regions, while few overlapped transcription start sites (TSSs)
    - reference_id: PMID:38960717
      supporting_text: the residues that normally determine sequence specificity of zinc fingers vary between ADNP and ADNP2
    - reference_id: PMID:38960717
      supporting_text: Mutations in the PxVxL motif resulted in a near-complete loss of ChAHP2 binding to H3K9me3-modified target regions, while H3K9me3 levels remained unchanged
    - reference_id: file:human/ADNP2/ADNP2-bioinformatics/RESULTS.md
      supporting_text: "`tfclass:3.1.8` reaches **14** human gene products (28 annotations)."
    - reference_id: file:human/ADNP2/ADNP2-bioinformatics/RESULTS.md
      supporting_text: "Of those entities, **709** receive `GO:0000785`+`GO:0000981`, **18** receive `GO:0000785` alone, and 0 carry some other signature."
    - reference_id: file:human/ADNP2/ADNP2-bioinformatics/RESULTS.md
      supporting_text: "ADNP2's own feature is 1043-1102 (Homeobox). So the fold-symmetry precedent is **HMBOX1** — annotated with the identical note — and not HOPX, whose domain UniProt calls **degenerate**"
    propagation_review:
      root_cause: SOURCE_WEAK_OR_INFERRED
      failure_modes:
      - GRANULARITY_MISMATCH
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: tfclass:3.1.8
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: >-
          TFClass 3.1.8 is a structural classification of homeodomain-bearing proteins, not an
          observation about ADNP2. Placing ADNP2 there is defensible as taxonomy; converting it into a
          sequence-specific RNA polymerase II transcription factor is the step the ChIP-seq data decline
          to support. The same node also supplies this gene's GO:0000785 row, which is correct - so the
          classification is not wrong, only over-read in the molecular-function direction. The whole
          GO_REF:0000113 import is 1436 annotations over 727 entities, 100% ISA, of which 709 receive
          the identical {GO:0000785, GO:0000981} pair - but 18 receive chromatin ALONE. That exclusion
          set is the pipeline's own negative control, and it shows the discrimination already exists.

- term:
    id: GO:0000785
    label: chromatin
  evidence_type: ISA
  original_reference_id: GO_REF:0000113
  qualifier: located_in
  supporting_entities:
  - tfclass:3.1.8
  review:
    summary: >-
      Accepted. This row arrives by the same TFClass classification as the GO:0000981 row above, and the
      two are being treated differently on purpose: the classification's premise, that ADNP2 is a
      chromatin-binding homeodomain protein, supports the location and does not support the
      sequence-specific activity. Chromatin association is directly observed - several thousand ADNP2
      ChIP-seq peaks, all of the well-characterised targets being repeat chromatin.
