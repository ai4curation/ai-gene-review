        of biogenic amines, with the polyamines Spm and Spd eliciting the largest response
    - reference_id: PMID:40836097
      supporting_text: the human SLC45A4 protein shares only about 26% sequence identity with the
        A. thaliana SUC1 transporter
    - reference_id: PMID:41266324
