id: Q5BKX6
gene_symbol: SLC45A4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'Polyamine transporter of the SLC45 family, a 12-transmembrane protein with the major
  facilitator superfamily fold and an inserted regulatory plug domain that places two conserved basic
  residues into an electronegative central cavity forming the polyamine binding site. SLC45A4 recognises
  and translocates putrescine, cadaverine, spermidine and spermine, with highest affinity for the
  shorter diamines and lowest for spermine; it does not transport amino acids, and neither GABA nor
  sucrose binds the purified protein, despite the family having been named for sequence similarity
  to plant sucrose transporters. Transport is optimal at slightly alkaline pH. In the nervous system
  the protein is enriched across dorsal root ganglion sensory neuron subtypes including nociceptors,
  where it supports the excitability of C-polymodal nociceptors and contributes to the perception
  of noxious heat and tonic chemical pain; common variants at the human locus associate with chronic
  pain intensity. In transformed epithelial cells it supports the de novo synthesis of GABA from
  ornithine through the arginine-ornithine-putrescine pathway by supplying putrescine for oxidation
  by diamine oxidases, without itself transporting GABA. Its subcellular location is disputed: work
  on overexpressed protein in neurons and cell lines places it in the plasma membrane, while work
  on endogenous protein in lung-cancer lines places it in the peroxisomal membrane, and it is not
  yet known whether the difference reflects cell type, expression level, or a protein with two pools.
  Beyond the transporter domain, the C-terminus binds a wide range of PDZ-domain scaffolding proteins.'
