      The title names SLC25A45, not SLC45A4, so the GOA citation looks transposed - it is not. SLC45A4
      is a co-equal subject of the paper, named in the abstract as a candidate plasma-membrane polyamine
      transporter and validated by isotope tracing in HEK293T knockout cells. Relevance marked MEDIUM
      rather than HIGH because the SLC45A4 evidence is metabolite-pool based, the authors state that
      definitive oocyte and proteoliposome assays remain to be done, and their observed direction
      (acetylpolyamine efflux) is not obviously the uptake the annotations imply.'
