core_functions:
- molecular_function:
    id: GO:0015203
    label: polyamine transmembrane transporter activity
  description: 'SLC45A4 is a 12-transmembrane MFS-fold carrier that recognises and translocates the
    biogenic polyamines putrescine, cadaverine, spermidine and spermine. Selectivity is for polyamines
    as a class - amino acids including L-lysine, L-ornithine and L-arginine do not compete, and neither
    GABA nor sucrose binds the purified protein - but it is not selective among individual polyamines,
    with affinities running from putrescine and cadaverine (highest) to spermine (lowest). A cryo-EM
    structure shows a regulatory plug domain inserted between the two six-helix MFS bundles, placing
    Lys450 and Arg453 into a strongly electronegative central cavity that forms the polyamine recognition
    site. Transport is optimal at pH 7.5-8.5. Where the protein performs this activity is genuinely
    unsettled: the neuronal work localises it to the plasma membrane of dorsal root ganglion sensory
    neurons, where it supports C-polymodal nociceptor excitability and pain sensation, whereas work
    on endogenous protein in lung-cancer lines localises it to the peroxisomal membrane, where it
    supplies putrescine for oxidative GABA synthesis. Both compartments are listed here because the
    two datasets use incomparable systems and a transporter with two pools would reconcile them;
    a reader should not take their co-listing as a claim that both are established.'
