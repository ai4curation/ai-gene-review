    action: REMOVE
    reason: 'Removed for the same reasons as its molecular-function counterpart, and with an additional
      biological argument that applies specifically at the process level: there is no cellular sucrose
      transport process in mammals for this protein to participate in. Dietary sucrose is hydrolysed
      to glucose and fructose by brush-border sucrase-isomaltase before absorption, and sucrose is
