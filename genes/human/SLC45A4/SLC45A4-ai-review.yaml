- term:
    id: GO:0015203
    label: polyamine transmembrane transporter activity
  evidence_type: IDA
  original_reference_id: PMID:40836097
  qualifier: enables
  review:
    summary: Purified human SLC45A4 is destabilised by biogenic amines but not by GABA or sucrose;
      14C-spermidine uptake into cells expressing SLC45A4 is competed by putrescine, cadaverine,
      spermidine and spermine but not by L-lysine, L-ornithine or L-arginine; cryo-EM resolves a
      polyamine-recognition site.
    action: ACCEPT
    reason: 'The core molecular function and the single claim on which all three 2025 studies agree.
      Note the paper uses "selective" in two senses that look contradictory in isolation: selective
      FOR polyamines over amino acids and sugars, but non-selective AMONG polyamines. This is also
      why the apparent substrate dispute in the two paper titles (polyamine versus putrescine) is
      largely illusory - putrescine is a polyamine and is in fact the highest-affinity ligand in
