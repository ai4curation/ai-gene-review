suggested_questions:
- question: Which membrane does endogenous SLC45A4 occupy, and does the answer depend on cell type?
    PMID:40836097 and PMID:41075780 place it at the plasma membrane using overexpressed tagged constructs
    in sensory neurons, N2a and HEK293T cells; PMID:41266324 places endogenous protein at the peroxisomal
    membrane in A549 and H1299 cells using a validated antibody plus two peroxisome isolation methods.
    The decisive experiment is endogenous-protein localisation in dorsal root ganglion neurons with
    a peroxisomal marker included, which neither group has done.
  experts:
  - Simon Newstead
  - David L Bennett
  - Xiaoyang Su
  - Joanne L Parker
- question: Can the two models be unified as one transporter with two pools? A surface pool importing
    polyamines into the neuronal cytosol and a peroxisomal pool delivering putrescine to luminal
    diamine oxidase are not mutually exclusive, and the cryo-EM plug domain is an obvious candidate
    regulator of trafficking. Is there a targeting signal, splice variant (Q5BKX6 has three isoforms)
    or PDZ interaction that partitions SLC45A4 between the two?
  experts:
  - Simon Newstead
  - Xiaoyang Su
- question: Which direction does SLC45A4 move polyamines, and what is the coupling ion? The Nature
    study measured spermidine uptake into cells with a pH optimum of 7.5-8.5, whereas the Cell Metab
    data show intracellular acetylspermidine depletion and acetylputrescine accumulation in the medium,
    which reads as export. Reconstitution into proteoliposomes with imposed gradients would settle
    both the direction and whether transport is proton-coupled as the SLC45 family name implies.
  experts:
  - Simon Newstead
  - Kivanc Birsoy
  - Joanne L Parker
- question: Should the mouse Slc45a2, Slc45a3 and Slc45a4 IDAs for GO:0008506 (sucrose:proton symporter
    activity), all from PMID:25164149, be re-curated? The human IBA and ISS both trace to them, and
    the human protein has now been shown not to bind sucrose. If the mouse annotations stand, the
    phylogenetic node will keep re-propagating a term that direct experiment on the human orthologue
    contradicts.
  experts: []
- question: Does the uniformly PDZ-scaffold interactome of SLC45A4 (DLG1-4, GRIP1/2, MPDZ, PATJ,
    PDZK1, MAGI1, LNX1/2, WHRN, NHERF4) reflect a functional C-terminal PDZ-binding motif in neurons,
    and does disrupting it change surface expression or the pain phenotype? This would also test
    whether PDZ anchoring is what distinguishes the plasma-membrane pool from any intracellular pool.
  experts:
  - David L Bennett
suggested_experiments:
- hypothesis: Endogenous SLC45A4 occupies different membranes in sensory neurons and in transformed
    epithelial cells.
  description: Knock a small epitope tag into the endogenous SLC45A4 locus (e.g. HiBiT or 3xHA by
    CRISPR knock-in) in both a DRG-derived neuronal model and A549 cells, then image against plasma-membrane
    (Na+/K+-ATPase, E-cadherin) and peroxisomal (ABCD3, catalase, PEX14) markers in parallel in the
    two backgrounds, with identical antibodies and acquisition settings. Quantify by Manders/Pearson
    coefficients rather than by representative images. Run peroxisome immunoprecipitation (PEX26-HA)
    and surface biotinylation on the same lysates to give orthogonal, quantitative partitioning.
  experiment_type: endogenous epitope knock-in, confocal colocalisation, surface biotinylation, organelle
    immunoprecipitation
- hypothesis: SLC45A4 is a proton-coupled polyamine antiporter whose net direction depends on the
    imposed gradients, which would reconcile the uptake and efflux observations.
  description: Purify human SLC45A4 (the construct used for cryo-EM) and reconstitute into proteoliposomes.
    Measure 14C-putrescine and 14C-spermidine flux under imposed pH gradients of both signs, with
    and without internal unlabelled polyamine to test for counter-transport, and with valinomycin/K+
    to clamp membrane potential and test electrogenicity. Test acetylspermidine and acetylputrescine
    as substrates directly, since those are the species that changed in the Cell Metab cellular data.
  experiment_type: proteoliposome reconstitution, radiolabelled flux, gradient and potential clamping
- hypothesis: The peroxisomal pool of SLC45A4 supplies putrescine to luminal diamine oxidase for
    GABA synthesis, and is dispensable in cells lacking peroxisomes.
  description: Compare 2H6-ornithine to 2H6-GABA flux in SLC45A4 knockout versus wild-type cells
    on a PEX-deficient background (e.g. PEX19 or PEX5 knockout, which mislocalises peroxisomal matrix
    and membrane proteins). If the SLC45A4 requirement for ornithine-derived GABA disappears when
    peroxisome biogenesis is blocked, the peroxisomal pool is the functional one for this pathway.
    Include a plasma-membrane-restricted SLC45A4 variant (peroxisomal targeting disrupted) as a rescue
    arm.
  experiment_type: stable isotope tracing with epistatic peroxisome-biogenesis knockouts, targeted-variant
    rescue
- hypothesis: Sucrose is not a substrate of human SLC45A4 under any condition, including the glucose-free
    condition that PMID:41266324 could not exclude.
  description: Repeat the yeast complementation and 14C-sucrose uptake design of PMID:25164149 side
    by side for human SLC45A4, mouse Slc45a4 and a plant SUC positive control, in glucose-free medium,
    and in parallel test 14C-sucrose flux in the reconstituted proteoliposome system above. A clean
    negative in both formats would justify retiring the sucrose annotations across the mammalian
    SLC45 family rather than only on human SLC45A4.
  experiment_type: yeast heterologous uptake replication, proteoliposome flux
