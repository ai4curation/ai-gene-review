    reason: 'Proposed because this is the only biological process to which SLC45A4 has been tied
      by loss-of-function experiments outside the nervous system, and GOA has no process annotation
      covering it. The differential result is what makes the claim mechanistically specific rather
      than a generic metabolic knock-on: knockout blocks GABA made from ornithine-derived (intracellular)
      putrescine but not from extracellular putrescine, which is what a transporter delivering putrescine
      to an intracellular oxidative compartment would predict. Two limitations to note. SLC45A4 is
      not itself a GABA transporter, so the involvement is upstream substrate delivery, not GABA
      handling; and directionality of putrescine flux across the peroxisomal membrane was inferred
      from metabolite pools, not measured. A curator preferring acts_upstream_of_or_within to involved_in
      would be justified.'
