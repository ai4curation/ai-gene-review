  review:
    summary: eGFP-tagged human SLC45A4 electroporated into mouse DRG neurons traffics to the plasma
      membrane, and cell-based uptake assays measure transport across the surface membrane of intact
      N2a cells.
    action: ACCEPT
    reason: 'This is the contested half of the record and GOA carries only this side of it. Kept,
      for three reasons: the uptake assays only work if a functional pool reaches the surface; a
      third study independently reports plasma-membrane polyamine transport (PMID:41075780); and
      is_active_in is the right qualifier for what was measured. But the conflict is real and should
      not be hidden. PMID:41266324 localises ENDOGENOUS SLC45A4 in A549/H1299 cells to the peroxisome
      membrane by antibody immunofluorescence (co-localising with ABCD3, not with actin, E-cadherin,
      giantin, calnexin or Mitotracker) and confirms it biochemically by PEX26-HA peroxisome immunoprecipitation
      and by density-gradient peroxisome isolation. Methodologically that is the stronger localisation
      dataset, since it uses endogenous protein; the plasma-membrane evidence rests on overexpressed
      tagged constructs, which routinely saturate organellar targeting. The two are not formally
      incompatible - a polyamine carrier could have both a surface pool and a peroxisomal pool, and
      the cell types differ completely (sensory neurons versus transformed lung epithelium). I therefore
      keep this annotation and propose GO:0005778 alongside it rather than replacing it.'
