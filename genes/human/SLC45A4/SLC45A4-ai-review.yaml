- term:
    id: GO:0008506
    label: sucrose:proton symporter activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: Family-level assertion that SLC45A4 is a proton-coupled sucrose symporter. Two independent
      2025 studies tested sucrose directly against the human protein and found no interaction and
      no sucrose catabolism.
    action: REMOVE
    reason: 'Donor tracing shows this is NOT a simple plant-to-animal leak, which is the usual reason
      such a term is challenged. The IBA WITH/FROM list mixes plant SUC transporters (Arabidopsis
      AT1G71880 etc., rice SUT1/SUT5) with three mouse SLC45 paralogs, and those mouse genes (Slc45a2
      P58355, Slc45a3 Q8K0H7, Slc45a4 Q0P5V9) each carry their own IDA for GO:0008506. So the PAINT
      node placement is internally coherent. The failure lies in the seed evidence: all three mouse
      IDAs come from one heterologous yeast-expression study (PMID:25164149) reporting a Km of about
      5 mM, an affinity with no physiological meaning for a disaccharide that mammals hydrolyse in
      the intestinal lumen and never expose to the cytosolic face of a membrane. The human protein
      has now been tested directly: purified SLC45A4 is not thermally stabilised by sucrose while
      polyamines destabilise it strongly (PMID:40836097), the cryo-EM structure resolves an acidic
      polyamine-recognition site rather than a sugar site, and isotope tracing found no sucrose catabolism
      attributable to SLC45A4 (PMID:41266324). UniProt has already added a CAUTION to Q5BKX6 on this
      point. The mouse IDAs on Slc45a2/3/4 should be revisited by the relevant curators for the same
      reason.'
