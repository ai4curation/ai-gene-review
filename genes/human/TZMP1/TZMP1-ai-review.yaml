core_functions:
- description: >-
    Structural component of the MKS module of the ciliary transition zone, recruited downstream
    of TMEM67 and required for a late step of cilium assembly (ciliary membrane growth and
    axoneme extension after ciliary vesicle formation). No molecular activity has been measured,
    so no molecular function term is asserted.
