id: A0A1B0GUW7
gene_symbol: TZMP1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  TZMP1 (transition zone microprotein 1; formerly SMIM27, C9orf133, TOPORS-AS1) is a 55-amino-acid
  vertebrate microprotein with a single predicted transmembrane helix, encoded on chromosome 9 by
  a transcript antisense to and partially overlapping TOPORS that was previously annotated as a
  long non-coding RNA. The protein localizes to the ciliary transition zone, just distal to FAM92A
  and the distal-appendage protein CEP164, and co-purifies with components of the MKS
  (Meckel syndrome) transition-zone module, including MKS1, B9D1/2, TCTN1/2/3, TMEM231, TMEM17
  and CC2D2A. Its transition-zone localization depends on TMEM67, whereas FAM92A, MKS1 and TCTN1
  remain at the transition zone without it, placing TZMP1 downstream in the MKS module
  hierarchy. In human RPE1 cells TZMP1 is required for primary cilium assembly at a late step:
  mother-centriole uncapping, intraflagellar transport recruitment and ciliary vesicle
  formation occur, but ciliary membrane growth and axoneme extension fail. Loss of the mouse
  orthologue impairs ciliogenesis in fibroblasts, and depletion of the Xenopus tropicalis
  orthologue reduces and immobilizes motile cilia of epidermal multiciliated cells and disrupts
  left-right patterning. No molecular activity has been defined.
existing_annotations:
- term:
    id: GO:0035869
    label: ciliary transition zone
  evidence_type: IMP
  original_reference_id: PMID:41270742
  qualifier: located_in
  review:
    summary: >-
      A rescue-validated, epitope-tagged TZMP1 transgene localizes to the base of the cilium and,
      by expansion microscopy, to the transition zone just distal to FAM92A and CEP164. The
      localization requires TMEM67.
    action: ACCEPT
    reason: >-
      The term is correct and is the core location of TZMP1. The evidence is direct imaging of a
      functional tagged protein, so IDA would describe it better than IMP, but the assertion
      itself is sound. All MKS-module comparators checked (TMEM67, MKS1, CEP290, TCTN1, TMEM231,
      B9D1) carry the same term.
    supported_by:
    - reference_id: PMID:41270742
      supporting_text: we found that SMIM27 localizes at the transition zone, just distal to
        transition zone protein FAM92A and centriolar distal appendage protein CEP164
    - reference_id: PMID:41270742
      supporting_text: knockout of TMEM67, an MKS gene not strictly required for ciliogenesis
        (Figure 4D–E), led to loss of SMIM27-2xMyc localization at the transition zone
- term:
    id: GO:0060170
    label: ciliary membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0305
  review:
    summary: >-
      UniProt subcellular-location mapping (cilium membrane), based on the transition-zone
      localization in PMID:41270742 together with a predicted single transmembrane helix.
    action: ACCEPT
    reason: >-
      The transition zone membrane is a specialized domain of the ciliary membrane, and TZMP1 is a
      predicted single-pass membrane protein that co-purifies with membrane-anchored MKS-module
      proteins (TMEM231, TMEM17, TCTN1-3). The mapping is consistent, and comparators TMEM67 and
      TMEM231 carry the same term. The membrane topology itself is predicted, not tested, and the
      transition zone term is the more precise location.
    supported_by:
    - reference_id: PMID:41270742
      supporting_text: recently shown to encode a 55 amino acid protein with a single predicted
        transmembrane domain
- term:
    id: GO:0060271
    label: cilium assembly
  evidence_type: IMP
  original_reference_id: PMID:41270742
  qualifier: involved_in
  review:
    summary: >-
      TZMP1 knockout in RPE1 cells (sgRNAs in exon 2, not overlapping TOPORS) causes a severe loss
      of cilia that is fully rescued by an sgRNA-resistant transgene. The block is at a late step:
      ciliary vesicle formation, CP110 removal and IFT recruitment proceed, but ciliary membrane
      growth and axoneme extension fail. Mouse fibroblast knockout and Xenopus morphants confirm a
      conserved requirement.
    action: ACCEPT
    reason: >-
      Clean knockout/rescue evidence that excludes the overlapping TOPORS gene. On participation:
      TZMP1 is a structural component of the transition-zone MKS module at the site where the
      ciliary membrane grows, the same role in which MKS1, TMEM67, TCTN1, TMEM231, B9D1 and CEP290
      all carry GO:0060271. So the annotation follows the established convention for
      transition-zone components and is not a downstream-necessity inference.
    supported_by:
    - reference_id: PMID:41270742
      supporting_text: SMIM27 KO cells exhibited a severe loss of cilia labeled by Arl13b or
        polyglutamylated tubulin, and these defects were fully rescued by an sgRNA-resistant
        SMIM27-2xMyc transgene
    - reference_id: PMID:41270742
      supporting_text: Thus, the ciliary vesicle can likely form in the absence of TZMP1, but ciliary
        membrane growth and axoneme extension fail to occur.
    - reference_id: PMID:41270742
      supporting_text: we knocked out Smim27 in mouse NIH-3T3 cells and observed impaired ciliogenesis,
        although to a lesser degree than in RPE1 cells
- term:
    id: GO:0036038
    label: MKS complex
  evidence_type: IDA
  original_reference_id: PMID:41270742
  qualifier: part_of
  review:
    summary: >-
      Affinity purification and mass spectrometry of tagged TZMP1 from knockout-rescued RPE1 cells
      recovered many MKS-complex components (MKS1, B9D1/2, TCTN1/2/3, TMEM231, TMEM17, CC2D2A),
      scored as specific when found in two replicate TZMP1 purifications but not in a negative
      control purification. TZMP1 co-localizes with these proteins at the
      transition zone and depends on TMEM67 for its localization.
    action: NEW
    reason: >-
      The basis is direct evidence for TZMP1 itself. Tagged TZMP1 co-purified MKS1, B9D1/2,
      TCTN1-3, TMEM231, TMEM17 and CC2D2A by mass spectrometry, it localizes to the
      transition zone where the MKS module sits and needs TMEM67 to get there, and UniProt
      records the subunit relationship
      (SUBUNIT, ECO:0000269 PubMed:41270742) without a corresponding GO row. The evidence is
      co-purification plus transition-zone localization rather than reconstitution or a structure, so
      confidence is moderate. It is the authors' explicit conclusion and the same kind of
      evidence on which other MKS-module members were assigned. As a consistency check, TMEM67,
      MKS1, CEP290, TCTN1, TMEM231 and B9D1 all carry part_of GO:0036038.
    supported_by:
    - reference_id: PMID:41270742
      supporting_text: mass spectrometry of proteins co-purifying with SMIM27-HRV3C-2xMyc revealed
        many components of the MKS protein complex
    - reference_id: PMID:41270742
      supporting_text: Specific interactors of SMIM27 were defined as proteins found in two
        replicate purifications of SMIM27 but not in a negative control purification
    - reference_id: PMID:41270742
      supporting_text: Thus, SMIM27 is a transition zone microprotein component of the MKS complex,
        and we propose the revised name TZMP1.
