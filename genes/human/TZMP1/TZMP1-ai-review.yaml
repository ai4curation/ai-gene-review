    label: MKS complex
  supported_by:
  - reference_id: PMID:41270742
    supporting_text: Thus, SMIM27 is a transition zone microprotein component of the MKS complex,
      and we propose the revised name TZMP1.
  - reference_id: PMID:41270742
    supporting_text: TZMP1 is required for cilium assembly subsequent to initial steps of
      ciliogenesis and has a relatively downstream role in the hierarchy of MKS module proteins
proposed_new_terms: []
suggested_questions:
- question: >-
    Does TZMP1 bind the MKS module directly, and through which partner (e.g. TMEM67, TMEM231 or
    TMEM17)? AP-MS cannot distinguish direct from indirect association, and the answer would
    support or replace the MKS complex assignment.
- question: >-
    Is TZMP1 a Meckel-Gruber, Joubert or related ciliopathy gene? The authors name it a candidate,
    but no patient variants have been reported, and the small antisense locus is easily missed by
    exome pipelines.
- question: >-
    Is the TOPORS-AS1 RNA function reported in ovarian cancer cells separable from the encoded
    peptide, or do those overexpression results partly reflect TZMP1 protein?
suggested_experiments:
- description: >-
    Determine membrane topology and test whether the transmembrane helix is required for
    transition-zone targeting and ciliogenesis rescue (helix-swap or deletion mutants in TZMP1
    knockout RPE1 cells).
- description: >-
    Map direct partners within the MKS module by pairwise co-immunoprecipitation in cells lacking
    individual MKS genes, or by crosslinking mass spectrometry.
- description: >-
    Generate a Tzmp1 knockout mouse to test for ciliopathy phenotypes (cystic kidney, polydactyly,
    CNS malformation, laterality defects).
