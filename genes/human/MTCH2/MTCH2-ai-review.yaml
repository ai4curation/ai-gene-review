      supporting_text: >-
        The cryoelectron microscopy structure of the 33-kilodalton human MTCH2 revealed that
        evolution of its insertase activity required loss of a transmembrane helix, which
        created a lipid-accessible hydrophilic groove stabilized by its unique, structured C
        terminus.
