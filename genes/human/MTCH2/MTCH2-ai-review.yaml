id: Q9Y6C9
gene_symbol: MTCH2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  MTCH2 is a polytopic protein of the mitochondrial outer membrane and the defining member
  of a holozoan family of outer-membrane protein insertases. It mediates insertion of
  alpha-helical transmembrane proteins - tail-anchored, signal-anchored and multipass - into
  the outer membrane, but not of beta-barrel proteins, which are handled by the SAM
  machinery; in human cells it is the functional counterpart of the evolutionarily unrelated
  yeast Mim1/Mim2 (MIM) complex. Cryo-electron microscopy of the 33 kDa human protein shows
  that MTCH2 retains the SLC25 (mitochondrial carrier) scaffold but carries only five
  transmembrane helices instead of six: loss of one helix opens a lipid-accessible
  hydrophilic groove, stabilised by a C-terminal domain unique to the MTCH family, which
  lowers the energetic barrier to moving a substrate's soluble domain across the bilayer.
  The family has also lost the interhelical salt bridges that canonical carriers use for
  alternating access. Despite the gene name "mitochondrial carrier homolog", no transported
  substrate has ever been demonstrated for MTCH2 and there is no evidence that it is a
  carrier. Its paralogue MTCH1 shares the fold and also has insertase activity, and MTCH1
  alone can replace the yeast MIM complex, whereas MTCH2 expressed in yeast is toxic and
  mislocalises largely to the endoplasmic reticulum, so the two paralogues are not
  interchangeable in every context. MTCH2 has a second, genetically separable role in
  apoptosis: it concentrates next to BAX and BAK assemblies specifically under apoptotic
  conditions and promotes their higher-order oligomerisation and apoptotic pore growth, with
  consequences for mitochondrial DNA release and cGAS-STING signalling. This activity
  persists with an insertase-dead MTCH2 mutant, is not shared by MTCH1, and is restored by
  exogenous lysophosphatidic acid, indicating a lipid-dependent rather than
  insertion-dependent mechanism. MTCH2 additionally serves as a platform for recruitment of
  tBID to mitochondria, cooperates with MFN2 and lysophosphatidic acid synthesis in
  mitochondrial fusion, and binds carnitine palmitoyltransferase 1 directly, lowering its
  sensitivity to malonyl-CoA and thereby restraining mitochondrial fatty-acid influx and
  energy expenditure in adipocytes. Mouse loss-of-function phenotypes include altered lipid
  homeostasis and adipocyte biology, changed mitochondrial fusion, haematopoietic stem cell
  cycling and the embryonic stem cell naive-to-primed transition.
