core_functions:
- molecular_function:
    id: GO:0032977
    label: membrane insertase activity
  description: >-
    MTCH2 is an insertase of the mitochondrial outer membrane that mediates insertion of
    alpha-helical proteins - signal-anchored, tail-anchored and multipass substrates - into
    the outer membrane, and does not act on beta-barrel proteins, which use the SAM
    machinery. It is the metazoan functional counterpart of the evolutionarily unrelated yeast
    Mim1/Mim2 complex, identified through genome-wide CRISPRi screens and established by
    reconstitution of purified protein into proteoliposomes. Mechanistically, MTCH2 retains a
    diverged SLC25 carrier scaffold from which one transmembrane helix has been lost, leaving
    five helices and a lipid-accessible hydrophilic groove stabilised by a C-terminal domain
    unique to the MTCH family; the hydrophobicity, charge and size of the residues lining that
    groove set the insertion rate. The family has also lost the interhelical salt bridges
    canonical carriers use for alternating access, and no transported substrate has been
    demonstrated. The paralogue MTCH1 performs the same activity and is partially redundant
    with MTCH2.
  directly_involved_in:
  - id: GO:0045040
    label: protein insertion into mitochondrial outer membrane
  locations:
  - id: GO:0005741
    label: mitochondrial outer membrane
  supported_by:
  - reference_id: PMID:36264797
    supporting_text: >-
      we have demonstrated that MTCH2 is a defining member of a family of membrane protein
      insertases that are necessary and sufficient for insertion of TAs into human
      mitochondria.
  - reference_id: PMID:42308315
    supporting_text: >-
      The cryoelectron microscopy structure of the 33-kilodalton human MTCH2 revealed that
      evolution of its insertase activity required loss of a transmembrane helix, which
      created a lipid-accessible hydrophilic groove stabilized by its unique, structured C
      terminus.
  - reference_id: PMID:42308315
    supporting_text: >-
      However, they have also lost several transporter elements, such as the characteristic
      salt bridges between helices, important for the alternating access mechanism used for
      solute transport.
  - reference_id: file:human/MTCH2/MTCH2-deep-research-falcon.md
    supporting_text: >-
      MTCH2 is a mitochondrial outer membrane, SLC25-fold–related multi-pass protein whose
      most strongly supported primary molecular function is to act as an OMM insertase
      enabling biogenesis of a subset of α-helical outer membrane proteins (including
      tail-anchored substrates).
knowledge_gaps:
- gap_statement: >-
    The molecular function through which MTCH2 promotes BAX and BAK higher-order self-assembly
    and apoptotic pore growth is undetermined. It is not the insertase activity, and no
    alternative activity - lipid scramblase, lipid transfer, or direct BAX/BAK binding - has
    been demonstrated, so the process is annotatable but its enabling molecular function is
    not.
  boundary: >-
    Established: MTCH2 concentrates near BAX and BAK assemblies specifically during apoptosis;
    its loss delays their oligomerisation and reduces apoptotic sensitivity, sublethal
    permeabilisation, mitochondrial DNA release and cGAS-STING activation; an insertase-dead
    mutant still supports the effect; MTCH1, which has insertase activity, does not; and
    exogenous lysophosphatidic acid restores assembly kinetics in MTCH2-null cells. What is
    unknown is which biochemical activity of MTCH2 the lipid dependence reflects.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: >-
    Without a defined molecular function, the proapoptotic role cannot be raised from a
    regulatory biological process to a core function, and it cannot be modelled causally in a
    GO-CAM. It also determines whether MTCH2 should be regarded as a one-activity protein with
    pleiotropic consequences or a genuinely bifunctional one.
  resolution: >-
    Demonstration in a defined reconstituted system of a second MTCH2 activity - for example
    lipid scrambling or lysophosphatidic acid handling at the outer membrane - that is retained
    by the insertase-dead mutant and absent from MTCH1, together with the corresponding
    molecular-function term.
  provenance:
  - reference_id: PMID:42056306
    supporting_text: >-
      Together, these results suggest that it is not the protein insertase activity of MTCH2
      but its function associated with lipid metabolism that may promote the high-order
      assembly of BAX and BAK during apoptosis.
  - reference_id: PMID:42056306
    supporting_text: >-
      Altogether, these data indicate that, while the insertase activity of MTCH2 might have a
      role, it is not essential for the effect of MTCH2 on the regulation of BAX and BAK
      high-order oligomers.
- gap_statement: >-
    No substrate transported by MTCH2 has ever been identified, and it is not established
    whether the ancestral SLC25 transport activity was lost outright or has simply never been
    assayed for MTCH2 under conditions that would detect it.
  boundary: >-
    Established: MTCH2 retains the SLC25 fold but has five rather than six transmembrane
    helices and has lost the interhelical salt bridges that canonical carriers use for
    alternating access; restoring those salt bridges does not reduce insertase activity. The
    protein name "mitochondrial carrier homolog 2" and the UniProt "Transport" keyword
    nonetheless assert a carrier function. GOA carries no transmembrane transporter
    molecular-function term for MTCH2, and that absence is the defensible position.
  gap_kind:
  - BIOLOGY
  - CURATION
  dark_aspect: MF_DARK
  status: OPEN
  significance: >-
    A name and a keyword that assert an undemonstrated activity propagate into electronic
    annotation pipelines and into the literature. Either a demonstration of transport or a
    published negative result would settle how the family should be described.
  resolution: >-
    Proteoliposome transport assays with purified MTCH2 against the canonical SLC25 substrate
    panel, with a working insertion assay on the same preparation as an activity control; and,
    if negative, retirement of the "Transport" keyword.
  provenance:
  - reference_id: PMID:42308315
    supporting_text: >-
      However, they have also lost several transporter elements, such as the characteristic
      salt bridges between helices, important for the alternating access mechanism used for
      solute transport.
  - reference_id: PMID:42308315
    supporting_text: Mutations restoring these salt bridges do not reduce MTCH2’s function
suggested_questions:
- question: >-
    MTCH2 retains the SLC25 carrier fold and is named "mitochondrial carrier homolog 2", yet no
    transported substrate has ever been reported and the family has lost the salt bridges
    needed for alternating access. GOA carries no transporter molecular-function term for
    MTCH2, which appears correct - but should the UniProt "Transport" keyword and the protein
    name be retired, or is transport simply unassayed?
  experts:
  - Voorhees RM
  - Guna A
- question: >-
    Which molecular activity of MTCH2 promotes BAX and BAK self-assembly? The effect survives
    an insertase-dead mutant and is rescued by lysophosphatidic acid, which points at lipid
    handling, but lipid scrambling or transfer by MTCH2 has not been measured directly. Is
    there a second molecular function that GO should be able to express?
  experts:
  - Garcia-Saez AJ
  - Flores-Romero H
- question: >-
    Why does MTCH1, but not MTCH2, complement the yeast Mim1/Mim2 complex, even though MTCH2 is
    the better-characterised insertase in human cells? The authors attribute the failure to
    toxicity and endoplasmic reticulum mislocalisation in yeast rather than to a lack of
    activity. Does the asymmetry nevertheless imply non-identical substrate ranges for the two
    paralogues in human cells?
  experts:
  - Rapaport D
- question: >-
    Is the MTCH2-CPT1 interaction, which lowers CPT1 sensitivity to malonyl-CoA, a distinct
    regulatory activity, or a consequence of MTCH2 controlling the insertion or local lipid
    environment of CPT1 in the outer membrane? An insertase-dead MTCH2 would separate the two.
  experts:
  - Wolfrum C
- question: >-
    Do MTCH1 and MTCH2 have distinct physiological substrate sets in human cells, and does
    MTCH2 loss produce phenotypes that MTCH1 overexpression cannot rescue?
  experts: []
suggested_experiments:
- hypothesis: >-
    MTCH2 has no transport activity and the SLC25-derived "carrier" assignment should be
    formally retired.
  description: >-
    Reconstitute purified MTCH2 into proteoliposomes and screen for transport of the standard
    SLC25 substrate panel (nucleotides, carboxylates, amino acids, carnitine, phosphate) under
    the conditions used for canonical carriers, with a positive-control SLC25 carrier and, on
    the same preparation, the validated split-GFP insertion assay as an activity control. A
    negative result from a demonstrably active preparation would be publishable evidence for
    loss of transport.
  experiment_type: reconstituted transport assay
- hypothesis: >-
    MTCH2 promotes BAX and BAK oligomerisation through a lipid-handling activity that is
    separable from insertion.
  description: >-
    Reconstitute purified wild-type MTCH2, the insertase-dead D189R mutant, hyperactive groove
    mutants and MTCH1 into liposomes of defined composition and assay lipid scrambling and
    lysophosphatidic acid handling directly, alongside BAX/BAK pore formation in the same
    vesicles. A scrambling or lipid-transfer activity retained by D189R and absent from MTCH1
    would match the cellular genetics and supply the missing molecular function.
  experiment_type: reconstitution with defined lipids
- hypothesis: >-
    The MTCH2-CPT1 effect on fatty-acid influx is independent of insertase activity.
  description: >-
    Reconstitute MTCH2-null adipocytes with wild-type MTCH2 or the insertase-dead mutant at
    matched levels and measure CPT1 malonyl-CoA sensitivity, palmitate oxidation and oxygen
    consumption, with CPT1 outer-membrane levels and topology controlled for. Retention of the
    CPT1 effect by the insertase-dead protein would establish a third separable activity; loss
    of it would fold the lipid phenotype back into protein biogenesis.
  experiment_type: structure-function allele series in adipocytes
