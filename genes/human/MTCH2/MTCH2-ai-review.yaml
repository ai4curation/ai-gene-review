    supported_by:
    - reference_id: PMID:36264797
      supporting_text: >-
        Cumulatively, the requirement for MTCH2 in vivo and in vitro for TA insertion,
        together with its reconstituted insertase activity and physical association with
        substrates, rigorously establishes MTCH2 as an insertase for α-helical mitochondrial
        outer membrane proteins.
