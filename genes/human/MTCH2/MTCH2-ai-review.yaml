- term:
    id: GO:0043065
    label: positive regulation of apoptotic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: >-
      Phylogenetic propagation of the proapoptotic role. MTCH2 is a genuine positive regulator
      of intrinsic apoptosis, acting both as a platform for tBID recruitment to the outer
      membrane and, separately, by promoting BAX and BAK higher-order self-assembly and
      apoptotic pore growth.
    action: KEEP_AS_NON_CORE
    reason: >-
      Retained, but the rationale has changed with the 2026 evidence, and the earlier reading
      recorded here - that the apoptotic phenotype is a downstream consequence of impaired
      outer-membrane protein biogenesis - is no longer tenable. Flores-Romero et al. show the
      effect on BAX/BAK oligomerisation survives an insertase-dead MTCH2 mutant, is not
      reproduced by MTCH1 (which has insertase activity), and is rescued by exogenous
      lysophosphatidic acid, implicating lipid handling rather than protein insertion. So this
      is a second, separable activity of comparable biological importance to the insertase
      role, not a knock-on effect of it. It is nonetheless kept as non-core rather than
      promoted, because it is a regulatory biological process whose underlying molecular
      function is not yet defined - there is no molecular-function term that can presently be
      asserted for it (see knowledge_gaps).
    supported_by:
    - reference_id: PMID:42056306
      supporting_text: >-
        we map the protein environment of the apoptotic pore using in situ proximity labeling
        and identify the mitochondrial carrier homolog protein MTCH2 localizing nearby BAX and
        BAK assemblies specifically under apoptotic conditions
    - reference_id: PMID:42056306
      supporting_text: >-
        The effect of MTCH2 on BAX and BAK oligomerization is independent of its protein
        insertase activity.
