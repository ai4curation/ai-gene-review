- id: PMID:36264797
  title: MTCH2 is a mitochondrial outer membrane protein insertase.
  findings:
  - statement: >-
      Established MTCH2 as an insertase necessary and sufficient for insertion of alpha-helical
      mitochondrial outer membrane proteins, using genome-wide CRISPRi, in vitro insertion into
      mitochondria from knockout cells, and reconstitution of purified MTCH2 into
      proteoliposomes.
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Science 2022;378:317-322). The landmark paper for the core molecular
      function; it is also the source of the MTCH1 annotations, where the evidence is thinner
      (see the MTCH1 review).
