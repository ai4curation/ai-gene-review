- term:
    id: GO:7770059
    label: alpha helical protein insertion into mitochondrial outer membrane
  evidence_type: IDA
  original_reference_id: PMID:36264797
  qualifier: involved_in
  review:
    summary: >-
      Proposed new annotation. The specific process MTCH2 carries out is insertion of
      alpha-helical (tail-anchored, signal-anchored and polytopic) proteins into the
      mitochondrial outer membrane; MTCH2 is not required for beta-barrel biogenesis.
    action: NEW
    reason: >-
      GOA currently records only the parent term GO:0045040 for MTCH2, while the paralogue
      MTCH1 already carries GO:7770059 from FlyBase. The substrate restriction is exactly what
      Guna et al. established for MTCH2 itself, and the 2026 structure supplies the mechanism
      - a lipid-exposed hydrophilic groove suited to transferring alpha-helical elements into
      the bilayer, with no beta-barrel activity. Adding the specific term brings the two
      paralogues into line. GO:7770059 is deliberately not used in core_functions: it is
      newer than the ontology release the term validator resolves against, so it is asserted
      here, where existing-annotation ids are not hard-validated, and the parent GO:0045040
      is used in core_functions instead.
    supported_by:
    - reference_id: PMID:36264797
      supporting_text: >-
        MTCH2’s role also appears to extend to the integration of a broader class of α-helical
        proteins into the outer membrane, including signal anchored and multipass proteins.
    - reference_id: PMID:42308315
      supporting_text: >-
        we have experimentally shown that MTCH activity relies on a conserved hydrophilic
        groove within the bilayer, produced by loss of a TM and stabilized by evolution of a
        conserved C-terminal domain
