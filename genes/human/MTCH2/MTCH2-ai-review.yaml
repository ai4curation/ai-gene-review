- id: PMID:40704594
  title: The mammalian protein MTCH1 can function as an insertase.
  findings:
  - statement: >-
      MTCH1, but not MTCH2, complements loss of the yeast Mim1/Mim2 complex. High-level MTCH2
      expression is toxic in yeast and the protein is found mainly in the endoplasmic reticulum
      in mim1-delta cells; lowering expression improves viability but does not restore
      complementation.
    reference_section_type: RESULTS
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (J Cell Sci 2025;138:jcs263736, PMC12401536). Awkward for a framing in
      which MTCH2 is "the" insertase, but it does not contradict MTCH2 insertase activity: the
      authors attribute the failure to complement to toxicity and endoplasmic-reticulum
      mislocalisation in yeast, and MTCH2 activity rests on reconstitution with purified
      protein, which this heterologous assay does not test. Read the same way in the MTCH1
      review.
- id: PMID:41044057
  title: MTCH2 modulates CPT1 activity to regulate lipid metabolism of adipocytes.
  findings:
  - statement: >-
      MTCH2 binds carnitine palmitoyltransferase 1 directly and lowers its sensitivity to
      malonyl-CoA, restraining mitochondrial fatty-acid influx; adipocyte-specific ablation in
      mouse improves mitochondrial function and raises whole-body energy expenditure
      independently of UCP1.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Nat Commun 2025, PMC12494973). Gives the lipid-homeostasis annotation a
      concrete mechanism - a direct CPT1 interaction - rather than leaving it as an unexplained
      knockout phenotype. Whether the effect is separable from insertase activity was not
      tested.
- id: PMID:42056306
  title: MTCH2 promotes BAX and BAK self-assembly and apoptotic pore growth.
  findings:
  - statement: >-
      In situ proximity labelling places MTCH2 next to BAX and BAK assemblies specifically
      under apoptotic conditions; MTCH2 loss delays BAX and BAK oligomerisation and reduces
      apoptotic sensitivity, sublethal permeabilisation, mitochondrial DNA release and
      cGAS-STING activation.
    reference_section_type: RESULTS
  - statement: >-
      The effect is independent of insertase activity: it persists with the insertase-dead
      D189R mutant, MTCH1 (which has insertase activity) does not reproduce it, and exogenous
      lysophosphatidic acid rescues the assembly defect, implicating lipid metabolism.
    reference_section_type: RESULTS
  - statement: >-
      MTCH2 acts on BAX and BAK directly, in addition to its established role in recruiting
      tBID to mitochondria.
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Nat Struct Mol Biol 2026;33:824-837, PMC13186707). The key paper for
      this update: it refutes the assumption, made in the previous version of this review, that
      the apoptotic role of MTCH2 is downstream of its insertase activity, and shows instead
      that it is a separable, lipid-linked function. The molecular activity responsible is
      still undefined.
- id: PMID:42308315
  title: Structural evolution of the MTCH family of mitochondrial insertases.
  findings:
  - statement: >-
      Cryo-EM structure of human MTCH2 shows five transmembrane helices rather than the
      canonical six of SLC25 carriers; the missing helix creates a lipid-accessible hydrophilic
      groove stabilised by a C-terminal domain unique to the MTCH family, and the residues
      lining the groove set the insertion rate.
    reference_section_type: RESULTS
  - statement: >-
      The MTCH family has lost transporter elements including the interhelical salt bridges
      required for alternating access; restoring those salt bridges does not reduce insertase
      activity.
    reference_section_type: RESULTS
  - statement: >-
      MTCH1 partially rescues loss of MTCH2 for several alpha-helical outer-membrane substrates
      in human cells, and the same groove architecture identifies a plant outer-membrane
      insertase.
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Sci Adv 2026;12:eaeh2957, PMC13274618). Supplies the structural
      mechanism for the insertase activity and the strongest evidence that the MTCH family has
      diverged from SLC25 transport rather than retaining it.
- id: file:human/MTCH2/MTCH2-deep-research-falcon.md
  title: Falcon deep research report for human MTCH2
  findings:
  - statement: MTCH2 is an integral mitochondrial outer membrane protein whose most
      strongly supported primary function is insertion of alpha-helical outer
      membrane proteins.
  - statement: MTCH2 can facilitate BID/tBID-associated mitochondrial apoptosis,
      but this is best treated as non-core relative to the insertase function.
  - statement: Recent work links MTCH2 to mitochondrial fusion and lipid metabolism,
      including MFN2/LPA-associated fusion plasticity, as secondary or emerging
      functional contexts.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Machine-generated literature synthesis, current to roughly 2025. Useful for the insertase
      framing and the LPA/fusion link; it predates the 2026 structural and BAX/BAK work, and
      its treatment of the apoptotic role as secondary to insertion has since been superseded.
