- term:
    id: GO:0032977
    label: membrane insertase activity
  evidence_type: IDA
  original_reference_id: PMID:36264797
  qualifier: enables
  review:
    summary: >-
      Guna et al. 2022 showed MTCH2 is necessary and sufficient for insertion of alpha-helical
      outer-membrane proteins, using genome-wide CRISPRi screens, in vitro insertion into
      mitochondria from knockout cells, and reconstitution of purified MTCH2 into
      proteoliposomes. This is the core molecular function.
    action: ACCEPT
    reason: >-
      The best-supported activity of MTCH2, and now with a structural mechanism. The 2026
      cryo-EM structure shows that insertase activity in this family arose by loss of one of
