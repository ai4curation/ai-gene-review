id: Q96QG7
gene_symbol: MTMR9
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: MTMR9 is a catalytically inactive myotubularin-family protein that binds active myotubularins
  and regulates their activity, substrate preference and stability. Association with MTMR6 favors phosphatidylinositol-3,5-bisphosphate
  turnover, whereas association with MTMR8 regulates phosphatidylinositol-3-phosphate and autophagy. Its
  GRAM and phosphatase-like regions provide a conserved noncatalytic regulatory architecture.
