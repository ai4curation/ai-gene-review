    label: cytoplasm
  evidence_type: EXP
  original_reference_id: PMID:19038970
  qualifier: located_in
  review:
    summary: MTMR9 is a soluble intracellular protein found in the cytoplasm, partly on membranes.
    action: ACCEPT
    reason: Cytoplasmic localization of human MTMR9 is experimentally recorded (PMID:16787938, PMID:19038970, both
      cited as ECO:0000269 in UniProt), MTMR9 has no transmembrane segment or signal peptide, and PAINT propagated
      cytoplasm from a deep node with broad experimental seeding including MTMR9 itself. This is where it engages
      its active partners.
    supported_by:
    - reference_id: PMID:19038970
      supporting_text: human MTMR6 forms a heteromer with an enzymatically inactive member myotubularin-related
        protein 9 (MTMR9), both in vitro and in cells
