- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:12890864
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q59HJ6
  review:
    summary: Generic protein binding from the mouse MTMR7/MTMR9 characterisation study; the GOA partner identifier
      resolves to bovine LONP1.
    action: REMOVE
    reason: Bare protein binding is uninformative, and removal does not mean the interaction is false. PMID:12890864
      identified MTMR9 as the MTMR7-binding protein, a phosphatase-binding claim already captured by the MTMR7 rows
      modified to GO:0019902. The partner accession recorded in GOA (UniProtKB:Q59HJ6) currently resolves to bovine
      LONP1 (Lon protease), which the cached abstract does not mention; this looks like a stale or remapped accession,
      but the full text was not read, so no stronger claim is made.
    supported_by:
    - reference_id: PMID:12890864
      supporting_text: The coiled-coil domain of MTMR9 was sufficient for binding to MTMR7
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:16189514
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q96EF0
  review:
    summary: Interaction of MTMR9 with the active myotubularin lipid phosphatase MTMR8 (UniProtKB:Q96EF0) reported
      in PMID:16189514.
    action: MODIFY
    reason: Bare protein binding is uninformative. The partner MTMR8 is a catalytically active myotubularin phosphoinositide
      3-phosphatase, and targeted studies show that MTMR9 heterodimerizes with MTMR8 and raises its catalytic output,
      so the interaction is better captured as phosphatase binding (GO:0019902). The regulatory consequence is captured
      separately by phosphatase activator activity (GO:0019211). The proteome-scale screen that GOA cites is an
      independent detection of the same pair; the replacement term is supported by the focused studies quoted here.
    proposed_replacement_terms:
    - id: GO:0019902
      label: phosphatase binding
    supported_by:
    - reference_id: PMID:16787938
      supporting_text: 'identified novel heteromeric interactions: MTMR8 with MTMR9'
    - reference_id: PMID:22647598
      supporting_text: MTMR8, all of which dimerize with the catalytically inactive MTMR9
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:16189514
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q9Y6C2
  review:
    summary: Generic protein binding with EMILIN1 (UniProtKB:Q9Y6C2) from a high-throughput interaction screen (PMID:16189514).
    action: REMOVE
    reason: Bare protein binding is uninformative and removal does not mean the interaction is false. The EMILIN1
      interaction comes from a proteome-scale binary or affinity screen; no follow-up study connects it to MTMR9's
      established role as a noncatalytic regulator of MTMR6/MTMR7/MTMR8 phosphoinositide phosphatases, so there
      is no informative molecular-function term to substitute.
