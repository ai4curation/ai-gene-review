- term:
    id: GO:0006661
    label: phosphatidylinositol biosynthetic process
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-1660499
  qualifier: involved_in
  review:
    summary: Reactome places MTMR9 in 'Synthesis of PIPs at the plasma membrane' through the MTMR9-bound MTMR6/MTMR8
      dephosphorylation reactions.
    action: MODIFY
    reason: The Reactome pathway groups all phosphoinositide interconversions under 'synthesis of PIPs', which maps
      to phosphatidylinositol biosynthetic process. The specific reactions in which MTMR9 participates are 3-dephosphorylation
      of PI3P and PI(3,5)P2 by MTMR9-bound MTMR6 or MTMR8; MTMR9 contributes as the activating, stabilizing subunit
      of the dimer that performs the step. The precise process is phosphatidylinositol dephosphorylation (GO:0046856),
      which the gene already carries by IBA; PAINT deliberately retained that process at the MTMR9 node while marking
      loss of the catalytic activities.
    proposed_replacement_terms:
    - id: GO:0046856
      label: phosphatidylinositol dephosphorylation
    supported_by:
    - reference_id: Reactome:R-HSA-1660499
      supporting_text: Enzymatically inactive myotubularin family members can heterodimerize with catalytically
        active mytotubularins to regulate their stability, activity and/or substrate specificity
    - reference_id: Reactome:R-HSA-6809320
      supporting_text: Formation of a complex with MTMR9 results in a 30-fold increase of phosphatidylinositol-(3,5)-bisphosphate
        3-phosphatase catalytic activity of MTMR6
    - reference_id: Reactome:R-HSA-6809325
      supporting_text: Formation of a complex with MTMR9 results in a 4-fold increase of the phosphatidylinositol-3-phosphatase
