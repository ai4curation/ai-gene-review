id: Q96QG7
gene_symbol: MTMR9
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'MTMR9 (myotubularin-related protein 9) is a catalytically inactive member of the myotubularin family
  of phosphoinositide 3-phosphatases. It has an N-terminal PH-GRAM domain, a myotubularin phosphatase-like domain
  in which the catalytic cysteine and arginine of the CX5R motif are replaced, and a C-terminal coiled coil that
  mediates dimerization. It acts as a regulatory subunit for the active myotubularins MTMR6, MTMR7 and MTMR8, forming
  heterodimers that stabilize the active partner, increase its catalytic rate and set its substrate preference:
  the MTMR6-MTMR9 dimer favours phosphatidylinositol 3,5-bisphosphate, producing PI5P, whereas MTMR8-MTMR9 favours
  phosphatidylinositol 3-phosphate. MTMR9 is a soluble cytoplasmic protein that associates with intracellular membranes,
  perinuclear regions, and membrane ruffles during macropinocytosis. Through these partner phosphatases it influences
  autophagy, resistance to DNA damage-induced apoptosis and macropinocytosis in cultured cells.'
