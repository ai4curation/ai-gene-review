    label: protein stabilization
  locations:
  - id: GO:0005737
    label: cytoplasm
  supported_by:
  - reference_id: PMID:19038970
    supporting_text: human MTMR6 forms a heteromer with an enzymatically inactive member myotubularin-related protein
      9 (MTMR9), both in vitro and in cells
  - reference_id: PMID:19038970
    supporting_text: the formation of this heteromer in cells resulted in increased protein levels of both MTMR6
      and MTMR9
  - reference_id: PMID:16787938
    supporting_text: 'identified novel heteromeric interactions: MTMR8 with MTMR9'
suggested_questions:
- question: Should binding of an inactive myotubularin to an active myotubularin lipid phosphatase be annotated
    to GO:0019903 protein phosphatase binding, as PAINT does for MTMR9 and MTMR3/MTMR4, or to the parent GO:0019902
    phosphatase binding? The children of GO:0019903 all name protein-substrate phosphatases.
- question: Is the reported ER-Golgi intermediate compartment/Golgi localization of MTMR9 and its effect on VSVG
    and WNT3A secretion (described in secondary sources but not in the cached primary literature) reproducible with
    endogenous protein, and does it depend on MTMR6/MTMR8?
- question: What is the MTMR9 homodimer for, and does MTMR9 partition between MTMR6, MTMR7 and MTMR8 in cells where
    all are expressed?
suggested_experiments:
- hypothesis: MTMR9 sets the substrate preference of MTMR6 and MTMR8 through its coiled-coil dimer interface.
  description: Reconstitute MTMR6-MTMR9 and MTMR8-MTMR9 with coiled-coil swap and point mutants and measure PI3P
    and PI(3,5)P2 3-phosphatase kinetics on liposomes; determine a dimer structure by cryo-EM.
  experiment_type: biochemical assay
- hypothesis: Endogenous MTMR9 restrains autophagy by limiting a PI3P pool via MTMR8.
  description: MTMR9 knockout and MTMR9/MTMR8 double knockout cells rescued with wild-type or dimerization-defective
    MTMR9, scoring PI3P (FYVE probe), LC3 flux and p62 turnover.
  experiment_type: genetic perturbation
