    action: ACCEPT
    reason: Heterodimer formation raises MTMR6 and MTMR9 protein levels (PMID:19038970) and slows MTMR8 turnover
      (PMID:22647598, cycloheximide chase per UniProt). Stabilizing the active partner is part of how MTMR9 sets
      their output, and MTMR9 does this work directly by binding.
    supported_by:
    - reference_id: PMID:19038970
      supporting_text: the formation of this heteromer in cells resulted in increased protein levels of both MTMR6
        and MTMR9
    - reference_id: Reactome:R-HSA-6809254
      supporting_text: MTMR8 binds to MTMR9, an enzymatically inactive myotubularin family member, which results
        in increased stability and increased catalytic activity of MTMR8
- term:
