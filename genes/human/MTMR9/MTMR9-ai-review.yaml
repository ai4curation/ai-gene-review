      supporting_text: human MTMR6 forms a heteromer with an enzymatically inactive member myotubularin-related
        protein 9 (MTMR9), both in vitro and in cells
    - reference_id: PMID:22647598
      supporting_text: MTMR8, all of which dimerize with the catalytically inactive MTMR9
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
