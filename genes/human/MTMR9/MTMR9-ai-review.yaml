- term:
    id: GO:0010507
    label: negative regulation of autophagy
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN002246859
  - UniProtKB:Q96QG7
  review:
    summary: MTMR8-MTMR9 complex lowers cellular PI3P and suppresses autophagy in HeLa-cell experiments.
    action: KEEP_AS_NON_CORE
    reason: 'PMID:22647598 shows that co-expressing MTMR8 with MTMR9 lowers PI3P and inhibits autophagic flux, with
      reciprocal effects after combined knockdown; MTMR9 therefore does part of the work of regulating autophagy
      by controlling the MTMR8 PI3P phosphatase. The PAINT node (PTN002246859) was seeded only by MTMR9 itself,
      which is expected and not circular. The term is kept but as non-core: it is a downstream consequence of PI3P-pool
      control, the evidence is cultured-cell over-expression/RNAi, and MTMR9-only perturbation has not consistently
      reproduced the phenotype.'
    supported_by:
    - reference_id: PMID:22647598
      supporting_text: the MTMR8/R9 complex inhibits autophagy
    - reference_id: PMID:22647598
      supporting_text: the MTMR8/R9 complex reduces cellular PtdIns(3)P levels
