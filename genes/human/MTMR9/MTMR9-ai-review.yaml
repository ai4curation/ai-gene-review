core_functions:
- description: 'Noncatalytic activating subunit of the myotubularin lipid phosphatases MTMR6, MTMR7 and MTMR8: heterodimerizes
    with them, raises their catalytic rate and sets their substrate preference (PI(3,5)P2 for MTMR6, PI3P for MTMR8),
    thereby regulating 3-phosphoinositide turnover.'
  molecular_function:
    id: GO:0019211
    label: phosphatase activator activity
  directly_involved_in:
  - id: GO:0060304
    label: regulation of phosphatidylinositol dephosphorylation
  - id: GO:0046856
    label: phosphatidylinositol dephosphorylation
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:19038970
    supporting_text: MTMR9 increased the 3-phosphatase activity of MTMR6 up to 6-fold
  - reference_id: PMID:22647598
    supporting_text: Complex formation between the active myotubularins and MTMR9 increases their catalytic activity
      and alters their substrate specificity
  - reference_id: PMID:22647598
    supporting_text: the MTMR8/R9 complex reduces cellular PtdIns(3)P levels
  - reference_id: file:human/MTMR9/MTMR9-bioinformatics/RESULTS-rereview.md
    supporting_text: MTMR9 lacks both the catalytic cysteine and the catalytic arginine
- description: Binds and stabilizes its active myotubularin partners (MTMR6, MTMR8), increasing their protein levels
    by slowing degradation.
  molecular_function:
    id: GO:0019902
    label: phosphatase binding
  directly_involved_in:
