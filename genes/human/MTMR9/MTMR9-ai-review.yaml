  review:
    summary: MTMR9 regulates phosphatidylinositol dephosphorylation by controlling the activity and substrate preference
      of MTMR6 and MTMR8.
    action: ACCEPT
    reason: Core process. MTMR9 shifts MTMR6 toward PI(3,5)P2 and MTMR8 toward PI3P and changes the cellular levels
      of PI5P and PI3P accordingly (PMID:22647598).
    supported_by:
    - reference_id: PMID:22647598
      supporting_text: Complex formation between the active myotubularins and MTMR9 increases their catalytic activity
        and alters their substrate specificity
    - reference_id: PMID:22647598
      supporting_text: the MTMR8/R9 complex reduces cellular PtdIns(3)P levels
