  - UniProtKB:Q96QG7
  review:
    summary: MTMR9 binds the myotubularin lipid phosphatases MTMR6 and MTMR8 (and MTMR7).
    action: MODIFY
    reason: 'The binding is well established (PMID:16787938, PMID:19038970, PMID:22647598) and PAINT propagated
      this term from MTMR9''s own experimental annotation, which is correct and expected. The issue is the term:
      ''protein phosphatase binding'' and its children (PP1, PP2A, PP2B binding, etc.) denote enzymes that dephosphorylate
      proteins, whereas MTMR6, MTMR7 and MTMR8 are phosphoinositide 3-phosphatases. The parent phosphatase binding
      (GO:0019902) states the supported claim without implying a protein substrate. The same replacement is applied
      to every MTMR6/7/8 protein-binding row so the claim is consistent; the question is also raised in suggested_questions.'
    proposed_replacement_terms:
    - id: GO:0019902
