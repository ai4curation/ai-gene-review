- term:
    id: GO:0034612
    label: response to tumor necrosis factor
  evidence_type: IMP
  original_reference_id: PMID:20444755
  qualifier: involved_in
  review:
    summary: >-
      Removed. The sole supporting paper is a pharmacogenetic association study of patients'
      clinical response to TNF-blocking drugs. There is no TNF stimulus anywhere in it, no
      perturbation of the AFF3 gene product, and no cellular assay of any kind.
    action: REMOVE
    reason: >-
      This is the failure mode a disease-susceptibility gene invites, and the full text was read
      rather than the title. Three independent grounds. First, definitional - GO:0034612 requires
      a change in state or activity of a cell or organism as a result of a tumor necrosis factor
      stimulus, whereas the study administers TNF blockade to rheumatoid arthritis patients, the
      opposite perturbation, and never applies TNF to anything. Second, the evidence code - IMP
      requires a mutant phenotype, and the study genotypes eighteen common tag SNPs and regresses
      a six-month change in a clinical disease-activity score on them, which is neither a mutant
      nor a phenotype of the gene product. Third, there is no assay - the paper contains no
      cellular or biochemical experiment on AFF3 at all. Querying QuickGO by reference confirms
      this is the only annotation the paper carries anywhere in GOA, so nothing else depends on
      it, and it has already propagated - mouse Aff3 holds GO:0034612 solely by ISO with
      UniProtKB:P51826, that is, from this human row - so retracting the human row retracts the
      term from both species. The distinction being drawn is between the gene's normal molecular
      function and a statistical association between one of its variants and a drug response in
      patients. AFF3 does have a real, mechanistically characterised immunological function, in
      immunoglobulin class switch recombination, and that is proposed as a separate row on
      separate evidence; nothing here is a claim that AFF3 is uninvolved in immunity.
    supported_by:
    - reference_id: PMID:20444755
      supporting_text: Eighteen single nucleotide polymorphisms (SNPs) mapping to 11 genetic loci
        were genotyped in 1012 patients with RA receiving treatment with etanercept, infliximab
        or adalimumab
    - reference_id: PMID:20444755
      supporting_text: using the absolute change in 28 joint count disease activity score (DAS28)
        between baseline and 6-month follow-up as the outcome variable
    - reference_id: PMID:20444755
      supporting_text: SNPs mapping to AFF3 and CD226 had a statistically significant association
        with the response to anti-TNF treatment
    - reference_id: file:human/AFF3/AFF3-bioinformatics/RESULTS.md
      supporting_text: '| `PMID:20444755` | 1 | 1 | `GO:0034612` IMP on P51826 | no |'
- term:
    id: GO:0035116
    label: embryonic hindlimb morphogenesis
  evidence_type: IMP
  original_reference_id: PMID:18616733
  qualifier: involved_in
  review:
    summary: >-
      Kept as non-core. My first reading was that a single case report of a microdeletion could
      not carry a gene-specific IMP; that was wrong, because an independent paper establishes the
      deletion contains only AFF3, and three further lines of evidence converge on the lower limb
      specifically.
    action: KEEP_AS_NON_CORE
    reason: >-
      The concern that this is a contiguous-gene deletion is answered directly - PMID:25162227
      states that the 500 kb 2q11.1 microdeletion encompasses only the LAF4 gene. The phenotype
      is lower-limb and mesomelic, matching the term rather than its parent - the patient has
      fibular agenesis and triangular tibiae, the same paper's mouse in-situ shows expression in
      the limb buds and the zeugopod, an independent study reports mouse expression in the
      developing brain, somites and limb buds, and knockin mice modelling the KINSSHIP
      microdeletion reproduce lower mesomelic limb deformities while homozygous Aff3 knockouts
      show skeletal anomalies. GO:0035116's definition is simply the generation and organisation
      of the hindlimbs, the posterior limbs of an animal, so there is no taxon or anatomy problem
      for a human lower limb. On the direction of effect - AFF3's limb phenotypes arise both from
      loss of the gene and from stabilisation of the protein by degron variants, and a gene whose
      increase and decrease both disrupt limb development is participating in limb development
      either way, so involved_in is right. What the gain-of-function data do not license is any
      claim about a new molecular activity of the variant protein, and none is made here - the
      KINSSHIP substitutions confer resistance to degradation, not a new function. Marked
      non-core because AFF3's core activity is transcriptional and this is a downstream
      developmental role.
    supported_by:
    - reference_id: PMID:25162227
      supporting_text: A human microdeletion of 500 kb on chromosome 2q11.1 encompassing only the
        LAF4 gene has been detected by array comparative genomic hybridization on peripheral
        lymphocytes
    - reference_id: PMID:18616733
      supporting_text: We report on a girl with fibular agenesis, severely abnormal, triangular
        tibiae
    - reference_id: PMID:18616733
      supporting_text: In situ hybridization analysis of Laf4 in mouse embryos revealed expression
        in the developing brain, in the limb buds and in the zeugopod corresponding to the limb
        phenotype
    - reference_id: PMID:33961779
      supporting_text: Whereas homozygous Aff3 knockout mice display skeletal anomalies, kidney
        defects, brain malformations, and neurological anomalies
    - reference_id: PMID:33961779
      supporting_text: knockin animals modeling one of the microdeletions and the most common of
        the missense variants identified in affected individuals presented with lower mesomelic
        limb deformities like KINSSHIP-affected individuals and early lethality
    - reference_id: PMID:24763282
      supporting_text: By whole-mount in situ hybridization the mouse AFF3 ortholog shows strong
        regional expression in the developing brain, somites and limb buds in 9.5-12.5dpc mouse
        embryos
- term:
    id: GO:0003711
    label: transcription elongation factor activity
  evidence_type: IDA
  original_reference_id: PMID:22547686
  qualifier: contributes_to
  review:
    summary: >-
      Proposed. The purified AFF3-containing SEC-L3 carries high polymerase II C-terminal domain
      kinase activity, which is an activity of the assembled complex that AFF3 contributes to
      rather than one AFF3 has alone - hence the contributes_to qualifier.
    action: NEW
    reason: >-
      The catalytic subunit of SEC-L3 is CDK9, not AFF3, so the elongation-stimulating activity
      belongs to the complex; contributes_to is the qualifier GO provides for exactly this case.
      The activity was measured on the purified complexes rather than inferred, and the same
      paper defines SEC-L3's composition. GO:0003711 was checked not to be redundant with the
      GO:0003712 row - the two are siblings under GO:0140110, and neither ancestor closure
      contains the other - so this is an additional statement rather than a refinement. Note the
      paper's own negative in the same sentence, which is respected here - only AFF4-containing
      SEC, not SEC-L3, is required for stress induction of HSP70, so no claim is made that SEC-L3
      substitutes for SEC. One step in this is an interpretation rather than a measurement and
      is flagged as such - what was measured is polymerase II C-terminal domain kinase activity
      of the purified complexes, and reading that as elongation-factor activity relies on the
      established role of CTD Ser2 phosphorylation in releasing paused polymerase rather than on
