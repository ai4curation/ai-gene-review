knowledge_gaps:
- gap_statement: >-
    No structure of AFF3 in complex with any partner exists, so which segments of AFF3 contact
    P-TEFb, ENL and AF9 is unknown, in contrast to AFF1 and AFF4 where the cyclin T1 and ELL
    interfaces are mapped.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    The adaptor activity is asserted here from simultaneous complex membership rather than from
    mapped surfaces. Interface mapping would also determine whether the four AFF paralogues bind
    the shared modules through the same or different segments, which is the structural question
    behind their non-redundancy.
  provenance:
  - reference_id: PMID:22547686
    supporting_text: biochemical isolation of SEC-like 2 (SEC-L2) and SEC-like 3 (SEC-L3)
      containing AFF2 and AFF3 in association with P-TEFb, ENL/MLLT1, and AF9/MLLT3
- gap_statement: >-
    Whether human AFF3 binds immunoglobulin switch regions and promotes AID recruitment in human
    B cells has not been tested; the mechanism is established in mouse, and the human arm of the
    same study is an expression association only.
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  status: OPEN
  significance: >-
    The isotype switching row proposed here is ISS for that reason. AFF3 is a shared rheumatoid
    arthritis and type 1 diabetes susceptibility locus, so whether the switching mechanism
    operates in human cells bears directly on how the association is interpreted.
  provenance:
  - reference_id: PMID:36001653
    supporting_text: One AFF3 risk allele for rheumatoid arthritis is associated with high mRNA
      expression of AFF3, IGHG2, and IGHA2 in human B cells
- gap_statement: >-
    GO has no term for maintenance of allele-specific silencing by a protein that reads DNA
    methylation at a differentially methylated region, which is what AFF3 does at the XIST DMR
    and at imprinted gametic DMRs.
  gap_kind:
  - ONTOLOGY
  status: OPEN
  significance: >-
    The behaviour is captured here only as negative regulation of transcription, which loses both
    the allele specificity and the methylation-reading mechanism. It is recorded as a gap rather
    than resolved with a term request, because the boundary against genomic imprinting, whose own
    definition already covers propagation of imprints through life, would need curator input.
  provenance:
  - reference_id: PMID:30535390
    supporting_text: In addition, the binding of AFF3 to the XIST DMR relies on DNA methylation
      and also regulates DNA methylation level at DMR region
suggested_questions:
- question: >-
    PMID:22547686 is the paper that isolated the AFF3-containing SEC-L3, and its only annotation
    anywhere in GOA is GO:0006354 EXP on AFF1, the paralogue it contrasts SEC-L3 against. AFF3
    receives the term back only as an IBA whose WITH/FROM points at AFF1. This is the second
    instance of the same shape in this family - the merged AFF4 review found that PMID:20159561,
    titled for AFF4, likewise produced one annotation and it was on AFF1. Should the family be
    re-swept for papers whose annotations landed on AFF1 rather than on the paralogue they
    characterise, and should AFF3 receive direct IDA or IPI rows for super elongation complex
    membership and for elongation from this paper?
  experts:
  - GO Central
  - PAINT curators
- question: >-
    AFF3's UniProt entry carries GO:0003700 DNA-binding transcription factor activity by
    IEA:Ensembl, projected from mouse Aff3, and GOA does not. The mouse source rows rest on
    ChIP-qPCR of over-expressed HA-tagged Laf4 at a single promoter, which the authors themselves
    frame as testing a potential direct transcriptional regulator, and GO:0003700's usage comment
    warns against this case. AFF3 has no sequence motif, binds double-stranded DNA
    indiscriminately in vitro, and is recruited by ZFP281 and ZFP57. Should the Ensembl-projected
    GO:0003700 cross-reference be retracted in favour of GO:0003712, which AFF3 already holds?
    Note that the companion projection on the same entry, GO:0003690, is correct and is missing
    from GOA - the two should move in opposite directions.
  experts:
  - UniProt curators
  - Ensembl Compara
- question: >-
    On the GO:0050877 nervous system process node, both protein donors' own experimental term is
    GO:0007611 learning or memory, two levels below the propagated term, while the recipient AFF3's
    documented nervous-system role is developmental and sits in a branch not reachable from
    GO:0050877 at all. Is a node-level split warranted, keeping the behavioural term where the
    behavioural evidence is and giving the AFF3 branch a developmental term instead?
  experts:
  - PAINT curators
- question: >-
    Mouse Aff3 holds GO:0016604 nuclear body and GO:0005829 cytosol by ISO GO_REF:0000119 with
    UniProtKB:P51826, while human AFF3 currently carries neither term. These look like reflections
    of human annotations that have since been withdrawn. The same projection route has a live
    consequence for the GO:0034612 removal proposed here - mouse Aff3 holds response to tumor
    necrosis factor solely by ISO from the human row, so retracting the human row should retract
    the mouse one, and there is no other support for it in either species. Should ISO projections
    be re-checked against their current source, does the pipeline retract a projection when its
    source annotation disappears, and can the GO:0034612 pair be withdrawn together?
  experts:
  - MGI
  - GO Central
  - BHF-UCL
- question: >-
    AFF4's merged review asks whether GO:0032783 should reach AFF3 at all, on the premise that
    AFF3 has not been shown to be a subunit of the super elongation complex. That premise is
    refuted by AFF3's own literature - PMID:22547686 reports the biochemical isolation of
    AFF3-containing SEC-L3 together with P-TEFb, ENL/MLLT1 and AF9/MLLT3, and PMID:26214578
    immunoprecipitates endogenous AFF3 from human nuclear extracts and recovers CDK9 and cyclin
    T1, with the reciprocal pull-down also on endogenous protein. GO:0032783's definition
    explicitly admits an AFF family protein, so SEC-L3 falls inside the term as written. Should
    that question be withdrawn for AFF3, and should the complex-membership row be upgraded from
    IBA to a direct experimental annotation rather than restricted to an AFF1/AFF4 node? The
    same correction does not obviously extend to AFF2, which was not examined here.
- question: >-
    The nine-residue AFF3 degron whose variants cause KINSSHIP syndrome is not a feature in
    UniProt - the entry records the individual VARIANT rows at positions 231, 233 and 235 but no
    corresponding region feature. Should a degron or short-sequence-motif feature be added, given
    that the region is the mechanistic basis of a named syndrome and of the gene's dosage
    sensitivity?
  experts:
  - UniProt curators
suggested_experiments:
- hypothesis: >-
    AFF3 bridges the P-TEFb kinase module and the ENL/AF9 proteins through non-overlapping
    segments, as AFF1 and AFF4 do, so single segment deletions should separate the two contacts.
  description: >-
    Map the CDK9/cyclin T1 and ENL/AF9 binding regions of AFF3 by co-immunoprecipitation from a
    deletion series expressed at near-endogenous level in an AFF3-knockout human line, then test
    whether a variant that loses only the P-TEFb contact still assembles SEC-L3 and whether one
    that loses only the ENL/AF9 contact does. This would convert the adaptor activity proposed
    here from a complex-membership inference into a mapped bridging function.
  experiment_type: interaction mapping
- hypothesis: >-
    AFF3 promotes elongation at its own target genes, which the current evidence shows only for
    the complex rather than for the gene.
  description: >-
    Perform PRO-seq or NET-seq before and after acute degradation of endogenous AFF3, using a
    degron tag rather than shRNA so that direct and adaptive effects are separable, in a human
    line, and ask whether pausing index rises and Ser2-phosphorylated polymerase II falls
    specifically at AFF3-occupied genes. This is the measurement that would justify a positive
    regulation of transcription elongation term for AFF3, which is deliberately not proposed in
    this review.
  experiment_type: genomics
- hypothesis: >-
    Human AFF3 binds immunoglobulin switch regions and promotes AID recruitment, as the mouse
    orthologue does.
  description: >-
    In primary human B cells stimulated to switch, perform AFF3 ChIP-qPCR at the IgM and IgG
    switch regions and measure AID occupancy and switching efficiency after AFF3 knockdown. This
    would replace the ISS row proposed here with human experimental evidence, and would test
    whether the risk-allele expression association has a mechanistic counterpart.
  experiment_type: immunology
- hypothesis: >-
    The AFF3 zinc-finger recruitment model generalises - AFF3 has no intrinsic sequence
    specificity and its genomic distribution is set entirely by partner factors.
  description: >-
    Compare AFF3 ChIP-seq peaks in a human line with and without depletion of candidate
    recruiters, taking ZNF281 and ZFP57 first and then factors whose motifs are enriched under
    AFF3 peaks, and in parallel test purified AFF3 for sequence preference by SELEX or protein
    binding microarray. A null result in vitro combined with recruiter-dependent loss in vivo
    would settle the coregulator-versus-transcription-factor question that the UniProt GO:0003700
    cross-reference turns on.
  experiment_type: genomics
