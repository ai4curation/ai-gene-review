      specific term the evidence supports is already present, and modifying this row would
      merely duplicate it. That is the same rule applied to the GO:0006354 row above, where the
      specific term was absent and MODIFY therefore did add information. Note that the two
      sibling reviews split on this row - AFF1 modified it to GO:0006355 and AFF4 accepted it -
