core_functions:
- description: >-
    AFF3 is the scaffolding subunit of super elongation complex-like 3. It holds the P-TEFb
    kinase module and the ENL/AF9 proteins together in one assembly, and that bridging is what
    the complex needs from the AFF subunit - the purified complex then carries high polymerase II
    C-terminal domain kinase activity and releases paused polymerase into productive elongation.
    In human cells AFF3 localises to nuclear speckles, the compartment where CDK9 and cyclin T1
    independently form foci; their redistribution to AFF3-occupied sites was seen only under
    strong AFF3 over-production and is not treated here as a native co-concentration.
    The bridging is established at the level of simultaneous complex membership in human cells,
    replicated across 5 independent publications and 3 detection methods for the
    CDK9 contact, rather than
    at the level of mapped interfaces, for which there is no AFF3 structure with a partner bound.
  supported_by:
  - reference_id: PMID:22547686
    supporting_text: biochemical isolation of SEC-like 2 (SEC-L2) and SEC-like 3 (SEC-L3)
      containing AFF2 and AFF3 in association with P-TEFb, ENL/MLLT1, and AF9/MLLT3
  - reference_id: PMID:22547686
    supporting_text: The SEC family members demonstrate high levels of polymerase II (Pol II)
      C-terminal domain kinase activity; however, only SEC is required for the proper induction
      of the HSP70 gene upon stress
  - reference_id: PMID:26214578
    supporting_text: To determine whether AFF3 is present in SEC in adrenocortical cells, AFF3
      was immunoprecipitated from nuclear extracts. CDK9 and cyclin T1, both components of
      P-TEFb, co-immunoprecipitated with AFF3
  - reference_id: PMID:33961779
    supporting_text: The ALF transcription factor paralogs, AFF1, AFF2, AFF3, and AFF4, are
      components of the transcriptional super elongation complex that regulates expression of
      genes involved in neurogenesis and development
  molecular_function:
