references:
- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO terms
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      The interpro2go route. Which signature supplies which term was measured rather than
      assumed, by fetching each of AFF3's three InterPro entries individually - IPR007797
      (AF4/FMR2 family, 5800 proteins) maps to GO:0010468, IPR043640 (C-terminal homology
      domain, 4950) maps to GO:0005634, and IPR043639 (AF4 interaction motif, 3235) maps to
      nothing. No molecular-function term is produced by any of them. This reproduces the
      merged AFF4 review's measurement exactly.
- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PAINT/PAN-GO, the source of five of AFF3's eleven rows. Every WITH/FROM token on all five
      rows was resolved to a reviewed UniProt entry and then queried for its own evidence on the
      propagated term. The critical resolution is MGI:MGI:106927, which is mouse Aff3 (P51827),
      the genuine orthologue, holding GO:0006355 by both IDA and IMP - so the family-level rows
      are not resting on paralogues alone.
- id: GO_REF:0000052
  title: Gene Ontology annotation based on curation of immunofluorescence data
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Human Protein Atlas immunofluorescence, supplying the nucleoplasm IDA. Consistent with the
      antibody localisation reported in PMID:8555498 and with the nuclear-speckle localisation
      in PMID:26214578, speckles being a nucleoplasmic sub-compartment.
- id: GO_REF:0000120
  title: Combined Automated Annotation using Multiple IEA Methods
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Correct for the nucleus, but its three WITH/FROM tokens are not three independent
      witnesses. ARBA00026330 was fetched from rest.uniprot.org/arba - of its 1309 condition
      sets exactly one reaches AFF3, and that set is IPR007797 AND IPR043640 AND Eukaryota, so
      the InterPro:IPR043640 token is the same signature the rule already uses. The third
      token, UniProtKB-SubCell:SL-0191, derives from UniProt's own SUBCELLULAR LOCATION line,
      which carries no evidence tag. One signature counted twice plus UniProt citing itself.
- id: PMID:8555498
  title: LAF-4 encodes a lymphoid nuclear protein with transactivation potential that is homologous
    to AF-4, the gene fused to MLL in t(4;11) leukemias.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The gene's founding paper and the only direct assay of the human protein's DNA binding.
      Abstract-only in the cache, and the abstract carries all three load-bearing statements
      used here - nuclear localisation by antibody staining, strong binding of in-vitro
      translated LAF-4 to double-stranded DNA cellulose, and transactivation by a GAL4 fusion.
      Read as a whole it supports a recruited coregulator rather than a sequence-specific
      transcription factor, because the transactivation was measured only when the protein was
      tethered by a heterologous DNA-binding domain.
- id: PMID:18616733
  title: Triangular tibia with fibular aplasia associated with a microdeletion on 2q11.2 encompassing
    LAF4.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Sole support for the embryonic hindlimb morphogenesis IMP. A single case report, which
      would normally be weak, but PMID:25162227 independently confirms the deletion encompasses
      only AFF3, so it is not a contiguous-gene event. The same paper's mouse embryo in-situ was
      curated separately and correctly as IEP on mouse Aff3.
- id: PMID:20444755
  title: Investigation of rheumatoid arthritis susceptibility genes identifies association of
    AFF3 and CD226 variants with response to anti-tumour necrosis factor treatment.
  reference_review:
    relevance: LOW
    correctness: MISCITED
    review_notes: >-
      Correctly identified and internally consistent, but it does not support the annotation it
      is cited for. It is a pharmacogenetic association study - 18 tag SNPs genotyped in RA
      patients receiving TNF-blocking drugs, with change in DAS28 as the outcome - and it
      contains no TNF stimulus and no experiment on the AFF3 gene product. PubMed records an
      ErratumIn reference to Ann Rheum Dis 2011;70(8):1519 whose PubMed id is null; it could not
      be resolved through Crossref (empty relation/update-to/updated-by on the DOI) or Europe
      PMC (no hits for the journal, year and page, nor for a citing Published Erratum), so its
      scope is unestablished. The REMOVE verdict does not depend on it.
- id: PMID:22547686
  title: 'The super elongation complex family of RNA polymerase II elongation factors: gene target
    specificity and transcriptional output.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The paper that defines AFF3 biochemically, and the single most under-used reference on
      this gene. Querying QuickGO by reference shows it has produced exactly one annotation in
      the whole of GOA - GO:0006354 EXP on UniProtKB:P51825, the paralogue AFF1 - so the paper
      whose headline result is the isolation of AFF3-containing SEC-L3 gave AFF3 nothing, and
      AFF3 receives the term back only as an IBA pointing at AFF1. Abstract-only in the cache;
      every claim used here is in the abstract.
- id: PMID:25162227
  title: Laf4/Aff3, a gene involved in intellectual disability, is required for cellular migration
    in the mouse cerebral cortex.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text available and read. Two distinct uses. First, it is the only functional study of
      the gene in the nervous system and supports the proposed cerebral cortex cell migration
      row. Second, it independently establishes that the PMID:18616733 deletion encompasses only
      AFF3. Its ChIP result, which is the source of mouse Aff3's GO:0003700 IDA and hence of
      UniProt's Ensembl-projected GO:0003700 on human AFF3, is over-read by that annotation -
      the assay is ChIP-qPCR of over-expressed HA-tagged Laf4 at a single locus, and the authors
      themselves frame it as testing a potential direct transcriptional regulator.
- id: PMID:26214578
  title: Combined transcriptome studies identify AFF3 as a mediator of the oncogenic effects of
    β-catenin in adrenocortical carcinoma.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text available and read. Despite a cancer-focused title it contains the best human
      cell-biological data on AFF3 - endogenous AFF3 immunoprecipitated from nuclear extracts
      brings down CDK9 and cyclin T1, with the reciprocal co-IP done on endogenous protein, and
      AFF3 colocalises with the speckle marker SC35. The speckle-disruption and CDK9
      redistribution results are from strong over-production and are treated here as such, not
      as native-level observations.
- id: PMID:28180295
  title: A permissive chromatin state regulated by ZFP281-AFF3 in controlling the imprinted Meg3
    polycistron.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text available. Mouse embryonic stem cells, so ISS-grade for human, but it is the
      clearest statement of the mechanism that distinguishes AFF3 from AFF1 and AFF4 - AFF3 is
      recruited to specific regulatory elements by sequence-specific zinc-finger proteins rather
      than binding a motif itself. Used for the coregulator molecular function rather than for a
      new imprinting annotation.
- id: PMID:30535390
  title: AFF3-DNA methylation interplay in maintaining the mono-allelic expression pattern of
    XIST in terminally differentiated cells.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text available and read. Human throughout - HEK293T and IMR-90 - with shRNA
      knockdown, AFF3 ChIP-qPCR, ChIP-seq and MeDIP. Supplies the human evidence for direct,
      methylation-dependent binding of AFF3 to a defined CpG island and for transcriptional
      repression, and is the basis of the proposed negative-regulation row.
- id: PMID:33961779
  title: Variants in the degron of AFF3 are associated with intellectual disability, mesomelic
    dysplasia, horseshoe kidney, and epileptic encephalopathy.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract-only in the cache, and everything used here is in the abstract - the homozygous
      Aff3 knockout phenotype including kidney defects, and the knockin animals reproducing
      lower mesomelic limb deformities. Care is taken not to treat the KINSSHIP variants'
      consequences as AFF3's normal activity - they are degradation-resistance defects, so they
      establish that the gene is dosage-critical in limb and kidney development without
      licensing any claim about a new molecular function.
- id: PMID:36001653
  title: AFF3, a susceptibility factor for autoimmune diseases, is a molecular facilitator of
    immunoglobulin class switch recombination.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text available. Mouse knockout plus switch-region binding by the AFF3 C-terminal
      domain and reduced AID recruitment, so ISS-grade for human. GO:0045190's own usage comment
      directs mechanism-level participants such as this to the process term rather than to the
      regulation branch, which is why isotype switching rather than positive regulation of
      isotype switching is proposed.
- id: PMID:24763282
  title: FRA2A is a CGG repeat expansion associated with silencing of AFF3.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
