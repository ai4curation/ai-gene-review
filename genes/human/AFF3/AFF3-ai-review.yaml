- description: >-
    AFF3 is a transcription coregulator that is delivered to its target elements by other
    proteins rather than by its own sequence recognition. Sequence-specific zinc-finger factors
    recruit it to distinct regulatory elements - ZFP281 to the Meg3 enhancer, ZFP57 to the
    intergenic differentially methylated region of the same imprinted locus - and at the XIST
    locus it binds a methylated CpG island directly, in a manner lost on demethylation, and holds
    that allele silent. Its own DNA binding is to double-stranded DNA without sequence
    preference, and its internal transactivating segment was demonstrated only when tethered by a
    heterologous DNA-binding domain, so its regulatory output is set by what recruits it and can
    be either permissive or repressive.
  supported_by:
  - reference_id: PMID:28180295
    supporting_text: ZFP281 recruits AFF3 to the Meg3 enhancer within the imprinted Dlk1-Dio3
      locus, thus regulating the allele-specific expression of the Meg3 polycistron
  - reference_id: PMID:28180295
    supporting_text: Our study suggests that different zinc finger proteins can recruit AFF3 to
      different regulatory elements and differentially regulate the function of AFF3 in a
      context-dependent manner
