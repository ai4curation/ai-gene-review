- term:
    id: GO:0030674
    label: protein-macromolecule adaptor activity
  evidence_type: IPI
  original_reference_id: PMID:26214578
  qualifier: enables
  supporting_entities:
  - UniProtKB:P50750
  - UniProtKB:O60563
  review:
    summary: >-
      Proposed. AFF3 is simultaneously in complex with both modules SEC-L3 joins - the P-TEFb
      kinase and the ENL/AF9 proteins - in human cells, and holding those modules together is
      what the complex needs from the AFF subunit.
    action: NEW
    reason: >-
      The evidence is complex-level rather than interface-level, and that is stated plainly
      rather than hedged. Endogenous AFF3 immunoprecipitated from human nuclear extracts brings
      down CDK9 and cyclin T1, with the reciprocal co-immunoprecipitation also performed on
      endogenous protein; the purified AFF3-containing SEC-L3 contains P-TEFb together with
      ENL/MLLT1 and AF9/MLLT3; and IntAct independently records CDK9 in 6 records across
      5 distinct publications and 3 distinct methods (anti tag coip, pull down, tap), with MI scores of
      0.35 and 0.73, plus MLLT1 in two records from one publication. What is not established for AFF3,
      in contrast to AFF1 and
      AFF4, is which residues form each interface - there is no AFF3 structure with a partner
      bound - so the claim is made at the level of the activity and not of the surface.
      GO:0030674 was verified NOT to be a descendant of GO:0005515 - its only ancestors are
      GO:0003674 and GO:0060090 - so this is a move into the molecular-adaptor branch rather
      than a refinement of protein binding. AFF3 has no GO:0005515 rows in GOA at all, which is
      why this is proposed as a new row rather than as a replacement, and it is a coverage gap
      rather than a correction - two of AFF3's replicated IntAct partners are the very SEC
      modules it bridges and GOA has curated neither. The scale of that gap was measured within
      the family in a single QuickGO call, so a zero could not be a rejected query - AFF4 carries
      15 GO:0005515 rows and AFF1 carries 3, while AFF3 carries none, which is a coverage
      asymmetry rather than a biological one given that AFF3's CDK9 contact is the most
      replicated of the three in IntAct. For IPI the WITH/FROM field takes the
      interacting partners, so it names CDK9 (UniProtKB:P50750) and cyclin T1
      (UniProtKB:O60563), the two proteins the co-immunoprecipitation actually brought down;
      both were confirmed to be reviewed human entries by asserting primaryAccession on the
      fetch. Making the row ISS on AFF1 and AFF4 instead, whose bridging interfaces are
      structurally mapped, was considered and declined - the assay here is a
      co-immunoprecipitation of AFF3 itself from human cells, so IPI is the correct code and
      what was missing was the entity rather than the code. The unmapped-interface caveat
      belongs in this reason and in the knowledge gap, which is where it is, not in a weaker
      evidence code.
