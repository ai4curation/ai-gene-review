taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  AFF3 (also called LAF-4) is a 1226-residue, almost entirely intrinsically disordered nuclear
  protein of the four-member AF4/FMR2 (ALF) family, and the scaffolding subunit of super
  elongation complex-like 3 (SEC-L3), which it forms together with the P-TEFb kinase module
  (CDK9 and cyclin T1) and the ENL/AF9 proteins. Like its paralogues AFF1 and AFF4 it holds an
  elongation-competent assembly together on RNA polymerase II, and the purified complex carries
  high polymerase II C-terminal-domain kinase activity. Where AFF3 differs from those paralogues
  is in how it reaches chromatin. It has no DNA sequence preference of its own - the isolated
  protein binds double-stranded DNA indiscriminately in vitro, while a separate internal segment
  activates transcription strongly when tethered by a heterologous DNA-binding domain - and it
  is instead delivered to particular regulatory elements by sequence-specific zinc-finger
  proteins, ZFP281 to the Meg3 enhancer of the imprinted Dlk1-Dio3 locus and ZFP57 to the same
  locus's intergenic differentially methylated region. In human cells it binds the methylated CpG
  island downstream of the XIST promoter in a DNA-methylation-dependent manner and keeps XIST
  expression monoallelic. It concentrates in nuclear speckles, the compartment in which CDK9 and
  cyclin T1 also form foci.
  In B cells it binds immunoglobulin switch-region DNA through its C-terminal region and promotes
  recruitment of the deaminase AID, biasing class switch recombination toward the IgG isotypes.
  Expression is highest in lymphoid tissue and, during development, in the brain, somites and
  limb buds; loss of the gene in mouse impairs migration of cortical neurons, and mouse null
  animals additionally show skeletal, kidney and brain malformations. AFF3 protein abundance is
  set by a short degron that directs ubiquitin-dependent degradation, and the gene is unusually
  dosage-sensitive in both directions: heterozygous deletion, or promoter GCC-repeat expansion
  with hypermethylation and silencing, and stabilising degron variants all produce overlapping
  human syndromes featuring intellectual disability, seizures, mesomelic dysplasia of the lower
  limbs and horseshoe kidney. The gene is also a recurrent fusion partner of KMT2A/MLL and of
  RUNX1 in acute lymphoblastic leukaemia.
