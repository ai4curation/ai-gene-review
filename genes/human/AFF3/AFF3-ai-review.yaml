- id: file:human/AFF3/AFF3-deep-research-affinage.md
  title: Affinage mechanistic annotation for AFF3 (human)
  reference_review:
    relevance: LOW
    correctness: LOW_QUALITY
    review_notes: >-
      Adjudicated and deliberately not quoted as evidence anywhere in this review; recorded here
      so the judgement lives in the repository. Its gates_passed True and faith_pct 100.0 concern
      PRECISION only - all 15 citations are well-formed numeric PMIDs with no preprint ids in
      PMID-shaped fields, and none of them is retracted or carries an expression of concern. They
      say nothing about recall, and recall was measured rather than estimated - the record omits
      PMID:22547686, the paper that isolated AFF3-containing SEC-L3 and that this review's
      sharpest finding turns on, and it omits both PMID:18616733 and PMID:20444755, the sole
      support for AFF3's only two experimental biological-process rows. So it returned the gene's
      notable literature and not the annotation-relevant literature, which is the same
      characterisation the ADIPOQ review reached. Its own GO grounding was also not imported -
      it offers GO:0140110 where GO:0003712 is the term AFF3's evidence actually supports.
existing_annotations:
- term:
    id: GO:0006355
    label: regulation of DNA-templated transcription
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - FB:FBgn0041111
  - MGI:MGI:106927
  - MGI:MGI:1100819
  - PANTHER:PTN000829417
  - UniProtKB:P51825
  review:
    summary: >-
      Accepted as core. This is the best-founded of AFF3's five IBA rows, and the only one whose
      WITH/FROM includes the gene's genuine mouse orthologue - mouse Aff3 holds this exact term
      by both IDA and IMP.
    action: ACCEPT
    reason: >-
      All five tokens were resolved and each protein donor queried for its own evidence, so the
      usual objection that IBA donors carry nothing but the same family-level inference is
      testable here and is false - four of the four protein donors hold their own experimental
      annotation to this term or a descendant. MGI:MGI:106927 resolves to P51827, mouse Aff3,
      the true orthologue, which holds GO:0006355 by IDA and IMP from PMID:25162227. The
      remaining donors are paralogues, which is legitimate for an IBA - Drosophila lilli
      (Q9VQI9, the single fly AFF protein and therefore co-orthologue of all four human
      paralogues) by IMP and IGI, mouse Aff1 (O88573) by IDA to GO:0045893, human AFF1 (P51825)
      by IMP to GO:0032786 and GO:0032968. The row is kept at the unsigned parent rather than
      refined, and the reason is the recipient rather than the donors. Every signed donor term
      here is in fact POSITIVE - mouse Aff1's term IS GO:0045893, and human AFF1's GO:0032786 and
      GO:0032968 were each verified to sit under it - and GO:0045893 is itself a descendant of
      GO:0006355, so a positive child was available and unused. The earlier wording claimed all
      three were verified under GO:0045893, which was vacuous for GO:0045893 itself and untrue of
      GO:0032968, whose claim was missing from the guard until round 2 added it. An earlier draft of this reason argued instead that the donors
      disagreed in sign, misreading GO:0032786 as negative by proximity to GO:0032785; that was
      wrong and the ancestry guard refuted it. What actually forbids refining the row is that
      AFF3's own output runs in both directions - it represses XIST from the silent allele in
      two human cell lines, while with ZFP281 it establishes a permissive state at the Meg3
      enhancer and its over-expression raises 84% of the transcripts it changes in mouse
      cortical cells. A positive-only term would be false for the repressive half, which is why
      the specific negative instance is proposed as a separate GO:0045892 row instead.
    supported_by:
    - reference_id: PMID:22547686
      supporting_text: SEC-L2 and SEC-L3 control the expression of different subsets of genes
    - reference_id: PMID:30535390
      supporting_text: Knockdown of AFF3 leads to de-repression of the inactive allele of XIST
        in terminally differentiated cells
    - reference_id: PMID:28180295
      supporting_text: ZFP281 recruits AFF3 to the Meg3 enhancer within the imprinted Dlk1-Dio3
        locus, thus regulating the allele-specific expression of the Meg3 polycistron
    - reference_id: file:human/AFF3/AFF3-bioinformatics/RESULTS.md
      supporting_text: '| `GO:0006355` regulation of DNA-templated transcription | 5 | 4 | 4 |'
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN000829417
        source_label: PANTHER tree node covering the AF4/FMR2 family
        source_status: SUPPORTS_TRANSFER
        comment: A tree node, not a gene product, so it cannot be queried for its own evidence.
          It is the inference structure rather than an evidence source.
      - source_id: FB:FBgn0041111
        source_label: Drosophila lilli (Q9VQI9, Swiss-Prot, 1673 aa)
        source_status: SUPPORTS_TRANSFER
        comment: Holds GO:0006355 by its own IMP and GO:0045944 by IMP and IGI. The sole AF4/FMR2
          family member in Drosophila, hence co-orthologue of all four human paralogues. Three
          candidate accessions were returned for this FlyBase id and the reviewed one was used;
          the count is recorded rather than the first hit silently taken.
      - source_id: MGI:MGI:106927
        source_label: mouse Aff3 (P51827, Swiss-Prot) - the true orthologue
        source_status: SUPPORTS_TRANSFER
        comment: Holds GO:0006355 by both IDA and IMP from PMID:25162227. Ten candidate
          accessions were returned for this MGI id and the single reviewed one was used.
      - source_id: MGI:MGI:1100819
        source_label: mouse Aff1 (O88573, Swiss-Prot)
        source_status: SUPPORTS_TRANSFER
        comment: Holds the descendant GO:0045893 by IDA from PMID:9365243. A paralogue. Its
          term is POSITIVE regulation, as are human AFF1's GO:0032786 and GO:0032968, so the
          donor set agrees in sign - an earlier draft of this review asserted the opposite and
          was refuted by the ancestry guard.
      - source_id: UniProtKB:P51825
        source_label: human AFF1
        source_status: SUPPORTS_TRANSFER
        comment: Holds the descendants GO:0032786 and GO:0032968 by IMP. A paralogue of the
          recipient, not the recipient itself.
- term:
    id: GO:0003712
    label: transcription coregulator activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - FB:FBgn0041111
  - PANTHER:PTN000829417
  review:
    summary: >-
      Accepted as AFF3's core molecular function, and kept rather than replaced. The single
      protein donor holds this exact term by its own IMP, and the term's own usage guidance
      describes AFF3's mode of DNA engagement precisely.
    action: ACCEPT
    reason: >-
      Drosophila lilli (Q9VQI9) holds GO:0003712 by IMP from PMID:11171404, so the propagation
      lands exactly on its donor's experimental term rather than above or beside it. More
      importantly the term is right on AFF3's own evidence, and it is right for a specific
      reason. GO:0003712's usage comment states that most transcription coregulators do not bind
      DNA and that those which do usually bind it non-specifically or indirectly, whereas
      GO:0003700 requires selective binding of a specific genomic sequence motif within a
      cis-regulatory region. AFF3 matches the first description and fails the second - the
      isolated protein binds double-stranded DNA cellulose without sequence preference, its
      transactivating segment was only shown to activate transcription when tethered by a
      heterologous GAL4 DNA-binding domain, and at its two best-characterised targets it is
      delivered by sequence-specific zinc-finger proteins (ZFP281 at the Meg3 enhancer, ZFP57 at
      the IG-DMR) rather than recognising the element itself. The two terms were checked to be
      siblings - neither GO:0003700 nor GO:0003712 is an ancestor of the other - so this is a
