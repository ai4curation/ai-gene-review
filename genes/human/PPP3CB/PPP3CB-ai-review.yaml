suggested_questions:
- question: Which calcineurin catalytic isoform (PPP3CA or PPP3CB) carries NFAT dephosphorylation downstream of the TCR in human T cells, and are they redundant there? Most T cell studies use pan-calcineurin
    inhibitors that do not distinguish the isoforms.
- question: Calcineurin anchoring at damaged lysosomes (LGALS3-SMURF1) and at the plasma membrane (AKAP5) is well described; should a conditional lysosomal membrane localization be annotated for PPP3CB,
    or does GO prefer to record it only on the anchoring proteins?
- question: Does Ca2+/calmodulin fully displace the autoinhibitory domain from the active site, as the canonical model holds, or only reorient it, as the CnA-beta structure suggests (PMID:26794871)?
suggested_experiments:
- description: Isoform-selective deletion or degron knock-in of PPP3CA and PPP3CB in primary human CD4 and CD8 T cells, followed by TCR stimulation and measurement of NFATC1/NFATC2 dephosphorylation, nuclear
    import and IL2 production, to assign isoform contributions to TCR-driven calcineurin-NFAT signaling.
- description: Phosphoproteomics after acute PPP3CB versus PPP3CA depletion in Ca2+-stimulated cells to define isoform-preferred substrates, testing whether the CnA-beta proline-rich N-terminus confers
    distinct substrate selection in vivo.
