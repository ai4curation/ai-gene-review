id: P16298
gene_symbol: PPP3CB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: PPP3CB encodes calcineurin A beta (CnA-beta), one of three catalytic subunits of calcineurin (protein phosphatase 2B, PP2B), the Ca2+/calmodulin-dependent serine/threonine protein phosphatase
  of the PPP family. The catalytic subunit binds an Fe/Zn binuclear metal centre and forms an obligate heterodimer with the Ca2+-binding regulatory subunit calcineurin B (PPP3R1, or PPP3R2 in testis); Ca2+
  binding to calcineurin B and Ca2+/calmodulin binding to the catalytic subunit relieve autoinhibition by an autoinhibitory segment and the C-terminal autoinhibitory domain. A proline-rich N-terminal extension
  unique to the beta isoform contributes to substrate recognition and gives CnA-beta the lowest Km of the isoforms toward tested protein substrates. Calcineurin docks substrates and regulators through PxIxIT
  and LxVP short linear motifs. Its best-characterized substrates are the NFAT transcription factors, whose dephosphorylation drives their nuclear import in Ca2+-dependent signaling, including T cell receptor
  signaling, and the lysosomal/autophagy transcription factor TFEB, which PPP3CB dephosphorylates in response to lysosomal Ca2+ release through MCOLN1. PPP3CB is largely cytosolic and can be recruited to
  membranes by anchoring proteins such as AKAP5 and, after lysosomal damage, by a galectin-3-SMURF1 complex. Calcineurin is the target of the immunosuppressants cyclosporin A and tacrolimus (FK506), which
  act as complexes with cyclophilin and FKBP12.
