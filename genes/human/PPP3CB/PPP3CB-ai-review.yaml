    summary: 'PPP3CB performs the regulatory step itself: it dephosphorylates TFEB (PPP3CB-specific siRNA and constitutively active PPP3CB 1-474), driving TFEB nuclear import and a lysosomal/autophagy gene
      program, and PPP3CB/PPP3R1 silencing lowers autophagic flux. A regulation term is appropriate for the enzyme that does the dephosphorylation (comparator: the TFEB kinase MTOR carries regulation-of-autophagy
      terms for the opposing phosphorylation). Kept non-core relative to the phosphatase activity; the existing IDA rows for positive regulation of lysosome organization and of protein localization to nucleus
      describe the same mechanism.'
