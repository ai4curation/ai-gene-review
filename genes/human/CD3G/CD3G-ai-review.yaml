- id: PMID:2470098
  title: The CD4 and CD8 antigens are coupled to a protein-tyrosine kinase (p56lck) that phosphorylates
    the CD3 complex.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete cached abstract supports phosphorylation of CD3 chains by CD4/CD8-associated
      LCK. The cache reports full_text_available:false despite a partial full-text heading. It does not
      make CD3G a kinase.
- id: PMID:8187769
  title: CD3 gamma contains a phosphoserine-dependent di-leucine motif involved in down-regulation of
    the T cell receptor.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete abstract supports serine/dileucine-mutant effects on PKC-induced receptor down-modulation
      in the CD3G-deficient Jurkat system and its transfectants. Historical residue numbers refer to the
      mature chain. AP-2 peptide-binding controls are provided by a separate primary source.
- id: PMID:1535555
  title: A novel di-leucine motif and a tyrosine-based motif independently mediate lysosomal targeting
    and endocytosis of CD3 chains.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Complete abstract uses Tac/CD3-tail chimeras to resolve endocytosis and lysosomal-targeting
      motifs. This is not a direct full-length endogenous CD3G ubiquitination or constitutive-necessity
      assay.
- id: PMID:15136729
  title: Crystal structure of the human T cell receptor CD3 epsilon gamma heterodimer complexed to the
    therapeutic mAb OKT3.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete abstract and selected primary Methods/Results read. Human gamma/epsilon extracellular
      domains were joined by an experimental peptide linker, refolded and crystallized with OKT3. The
      native interface is noncovalent; the engineered linker does not establish a natural interchain disulfide.
- id: PMID:17277165
  title: Differential biological role of CD3 chains revealed by human immunodeficiencies.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Complete human immunodeficiency abstract read. Supports variable receptor-expression
      and lymphocyte phenotypes, not an absolute loss of surface TCR in all CD3G-deficient patients.
- id: PMID:38657677
  title: Structures of human γδ T cell receptor-CD3 complex.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete abstract plus selected XML Methods/Results/captions read. Reconstituted human
      Vgamma9Vdelta2 and Vgamma5Vdelta1 complexes and Jurkat76 functional tests support human CD3 gamma-epsilon
      membership. ExpiHEK293F expression and tagged constructs are distinct from endogenous patient receptors;
      dimeric whole TCR does not mean CD3G homodimerization.
- id: PMID:15778375
  title: Plasticity and rigidity in adaptor protein-2-mediated internalization of the TCR:CD3 complex.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete abstract supports motif-context restrictions in AP-2-mediated TCR internalization.
      Full experimental Methods were not read; its conserved mature-chain K128 and motif positioning are
      not converted into a universal requirement across all physiological uptake routes.
- id: PMID:8647168
  title: The protein interactions of the immunoglobulin receptor family tyrosine-based activation motifs
    present in the T cell receptor zeta subunits and the CD3 gamma, delta and epsilon chains.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete abstract directly includes doubly phosphorylated gamma/delta/epsilon ITAMs
      and ZAP70/other effector binding. Supports signaling docking; no intact-cell PI3K catalytic or universal
      pathway-specific claim is added.
- id: PMID:29653965
  title: Patients with CD3G mutations reveal a role for human CD3γ in T(reg) diversity and suppressive
    function.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete abstract and selected human-cohort Methods/Results read, including sorted Treg/effector
      suppression controls. Supports deficient regulatory function in that cohort, without generalizing
      to every CD3G genotype.
- id: PMID:31921117
  title: A Novel CD3G Mutation in a Taiwanese Patient With Normal T Regulatory Function Presenting With
    the CVID Phenotype Free of Autoimmunity-Analysis of all Genotypes and Phenotypes.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Complete abstract describes the Taiwanese CVID-like case with preserved regulatory-T-cell
      suppression. Normal full-body availability is preserved, but whole body was not read. This limits
      universal autoimmunity claims.
