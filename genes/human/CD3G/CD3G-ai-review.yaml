core_functions:
- description: CD3 gamma supplies receptor-assembly contacts in the gamma-epsilon module and a cytoplasmic
    ITAM that recruits signaling effectors after phosphorylation. These activities couple an assembled
    membrane TCR to intracellular signaling; antigen specificity belongs to the clonotypic receptor chains.
