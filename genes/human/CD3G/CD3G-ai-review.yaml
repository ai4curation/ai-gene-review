id: P09693
gene_symbol: CD3G
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CD3G encodes CD3 gamma, a single-pass signaling subunit of the T cell antigen receptor. Its
  extracellular immunoglobulin-like domain pairs noncovalently with CD3 epsilon, and extracellular and
  transmembrane contacts help organize the receptor complex. Human alpha-beta and reconstituted gamma-delta
  TCR complexes contain this gamma-epsilon module. The cytoplasmic tail carries one ITAM whose phosphorylation
  permits signaling-effector recruitment, including ZAP70, while a separate dileucine sorting signal engages
  endocytic adaptors and helps control receptor internalization. CD3 gamma promotes normal surface receptor
  abundance and efficient ligand- or PKC-stimulated trafficking; some mature human T cells retain surface
  receptors and constitutive internalization without it. Biallelic defects cause variable immunodeficiency,
  sometimes accompanied by autoimmunity and altered regulatory-T-cell function.
