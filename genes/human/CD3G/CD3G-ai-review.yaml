- term:
    id: GO:0004888
    label: transmembrane signaling receptor activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000060280
  - UniProtKB:P04234
  - UniProtKB:P07766
  - UniProtKB:P09693
  review:
    summary: CD3G carries a single cytoplasmic ITAM that is tyrosine-phosphorylated by LCK upon TCR engagement,
      transmitting the antigen-recognition signal from the TCR alpha/beta (or gamma/delta) ligand-binding
      chains across the membrane.
    action: ACCEPT
    reason: PAINT node PTN000060280 (CD3 gamma/delta family) places this activity on the CD3 gamma/delta
      clade; CD3G is inside that clade and there is no evidence of loss. CD3G does not bind peptide-MHC
      itself; strictly it contributes to the receptor activity of the TCR-CD3 complex (it is the signal-transducing,
      not the ligand-binding, part), which is how it is recorded in core_functions. The annotation is
      nonetheless accepted as the standard GO representation for CD3 chains.
    supported_by:
    - &id002
      reference_id: PMID:2470098
      supporting_text: we demonstrate directly that members of the CD3 complex, including the gamma, delta,
        and epsilon chains, as well as a putative zeta subunit, can be phosphorylated at tyrosine residues
        by the CD4/CD8.p56lck complex.
    - &id003
      reference_id: Reactome:R-HSA-202165
      supporting_text: the TCR complex include 10 ITAMs with one ITAM in each of the CD3 chains including
        the three tandem ITAMs in each zeta chains
