- term:
    id: GO:0015031
    label: protein transport
  evidence_type: IMP
  original_reference_id: PMID:12794121
  qualifier: involved_in
  review:
    summary: CD3G-deficient mature T cells show reduced surface TCR, impaired early ligand-induced TCR
      endocytosis and no phorbol-ester-induced TCR down-modulation, restored by CD3G transduction.
    action: MODIFY
    reason: 'Protein transport is too vague. The specific process in which CD3G does work is internalization
      of the TCR from the cell surface: its cytoplasmic PKC-phosphorylated S126 plus di-leucine motif
      (L131/L132) is the sorting signal recognized for clathrin-mediated endocytosis of the receptor.
      CD3G therefore supplies the sorting motif (a structural contribution) rather than being a passive
      cargo, which satisfies the participation test. Receptor internalization (GO:0031623) is proposed.'
    supported_by:
    - &id020
      reference_id: PMID:12794121
      supporting_text: Kinetic confocal analysis indicated that early ligand-induced endocytosis was impaired.
    - &id019
      reference_id: PMID:8187769
      supporting_text: Point mutation analyses confirmed this observation and demonstrated that a membrane-proximal
        di-leucine motif (L131 and L132) in the cytoplasmic tail of CD3 gamma was required for PKC-mediated
        TCR down-regulation in addition to phosphorylation at S126.
    - &id010
      reference_id: PMID:8187769
      supporting_text: indicating that the TCR was down-regulated by endocytosis via clathrin coated pits
    proposed_replacement_terms:
    - id: GO:0031623
      label: receptor internalization
