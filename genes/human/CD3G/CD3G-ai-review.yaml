id: P09693
gene_symbol: CD3G
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CD3G encodes CD3 gamma, an invariant single-pass type I transmembrane subunit of the T cell
  antigen receptor (TCR)-CD3 complex. It has an extracellular Ig-like domain that pairs side-to-side with
  CD3 epsilon to form the CD3 gamma-epsilon heterodimer, which docks onto the TCR beta (and TCR alpha)
  chains via extracellular and transmembrane contacts; together with CD3 delta-epsilon and the CD3 zeta
  homodimer it forms the octameric TCR-CD3 complex (TCRab:CD3ge:CD3de:CD3zz, 1:1:1:1), and in gamma-delta
  T cells CD3 gamma-epsilon is usually the only CD3 gamma/delta-family dimer present. Its cytoplasmic
  tail carries a single immunoreceptor tyrosine-based activation motif (ITAM) that is phosphorylated by
  LCK after antigen recognition, contributing to recruitment of ZAP70 and initiation of TCR signalling.
  The tail also contains a PKC-phosphorylated serine (S126 of the mature chain) and an adjacent di-leucine
  sorting motif that mediate clathrin/AP-2-dependent internalization and down-regulation of the TCR after
  PKC activation and contribute to constitutive TCR cycling. CD3G is required for normal TCR assembly
  and surface expression; biallelic loss-of-function causes immunodeficiency 17 (IMD17), with partial
  TCR-CD3 expression defects, T lymphopenia and variable severity from SCID-like disease to autoimmunity.
