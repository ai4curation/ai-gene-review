core_functions:
- description: 'Invariant signal-transducing subunit of the TCR-CD3 complex: pairs with CD3E and supports
    assembly of the receptor complex, and its single ITAM is phosphorylated by LCK upon antigen recognition
    to propagate TCR signalling across the plasma membrane.'
