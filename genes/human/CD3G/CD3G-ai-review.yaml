- term:
    id: GO:0002250
    label: adaptive immune response
  evidence_type: NAS
  original_reference_id: PMID:29789755
  qualifier: involved_in
  review:
    summary: CD3G is an invariant signal-transducing subunit of the TCR-CD3 complex, the antigen receptor
      of T cells; it therefore acts in the adaptive immune response.
    action: ACCEPT
    reason: Author statement from a TCR signalling review is consistent with the well-established role
      of the TCR-CD3 complex in antigen-specific T cell responses; human CD3G deficiency (IMD17) causes
      T lymphopenia and poor antigen responses.
    supported_by:
    - &id014
      reference_id: PMID:29789755
      supporting_text: The remarkable T cell receptor (TCR) performs essential functions in the initiation
        of intracellular signals required for T cell development, repertoire selection and effector responses
        to foreign antigens.
    - &id001
      reference_id: PMID:17277165
      supporting_text: All tested patients shared similar immunological features such as a partial TCR/CD3
        expression defect, mild alphabeta and gammadelta T lymphocytopenia, poor in vitro proliferative
        responses to Ags and mitogens at diagnosis
