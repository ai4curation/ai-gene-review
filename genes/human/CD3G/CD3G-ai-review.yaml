  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The authenticated normal cache provides full XML text. Complete header/abstract and
      selected original Methods/Results were read, including human Jurkat-cytosol binding to immobilized
      CD3 gamma peptides, LLAA and spacing controls, and the separate mouse-CD4/human-tail chimera and
