suggested_questions:
- question: How much do CD3G-dependent assembly, ITAM signaling and regulated trafficking separately explain
    the variable immunodeficiency and regulatory-T-cell phenotypes in patients?
- question: How closely do the CD3 dimer composition and stoichiometry of endogenous human gamma-delta
    TCR subsets match the reconstituted Vgamma9Vdelta2 and Vgamma5Vdelta1 structures?
- question: Should the preserved enables qualifiers on the four transmembrane signaling receptor activity
    annotations be curated as contributes_to for CD3 gamma, given its assembly and ITAM signaling role
    within the antigen-recognizing TCR complex?
suggested_experiments:
- description: Compare wild-type CD3G with separate ITAM, phosphoserine and dileucine-motif mutants in
    a matched human T-cell background, measuring receptor assembly, surface abundance, ligand-triggered
    internalization and recycling alongside signaling. Report precursor versus mature-chain numbering
    and receptor-expression controls.
