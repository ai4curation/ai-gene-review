suggested_questions:
- question: Should the di-leucine-dependent TCR internalization role of CD3G be captured with a process
    term such as receptor internalization (GO:0031623)? Comparator antigen-receptor signalling subunits
    (CD3D, CD3E, CD79A, CD79B) currently carry no internalization terms, and GO:0036300 B cell receptor
    internalization has no T cell receptor counterpart.
- question: Should transmembrane signaling receptor activity on CD3 chains be recast as contributes_to,
    given that ligand binding is performed by the clonotypic TCR chains and CD3G supplies the signal-transducing
    ITAM?
- question: Why is human CD3G deficiency milder than CD3D or CD3E deficiency (CD3delta >> CD3gamma hierarchy),
    and does CD3D partially substitute for CD3G in alpha-beta TCR assembly in humans?
suggested_experiments:
- description: Knock-in of di-leucine (L131A/L132A) or S126A CD3G into CD3G-deficient primary human T
    cells, followed by quantitative TCR internalization, recycling and signalling-strength assays, to
    separate CD3G ITAM signalling from its trafficking role.
