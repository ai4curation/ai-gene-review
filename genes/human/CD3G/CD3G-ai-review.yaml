- term:
    id: GO:0032395
    label: MHC class II receptor activity
  evidence_type: IDA
  original_reference_id: PMID:1323144
  qualifier: contributes_to
  review:
    summary: Contributes-to MHC class II receptor activity, from a paper on activation-induced ubiquitination
      of TCR subunits.
    action: MARK_AS_OVER_ANNOTATED
    reason: The TCR-CD3 complex recognizes peptide bound to either MHC class I or class II depending on
      the TCR clone; the class II specificity is a property of the particular clonotypic TCR used in the
      experiment, not of CD3G. CD3G does not contact MHC. The contributes_to qualifier is respected and
      the annotation is not strictly wrong for a subunit of a class II-restricted TCR, but it adds little
      beyond TCR complex membership (consistent with the treatment of the same row on CD247). Cached text
      is abstract-only.
    supported_by:
    - &id016
      reference_id: PMID:1323144
      supporting_text: at least one other TCR subunit, CD3 delta, was also ubiquitinated after activation
        of the receptor
