    label: establishment or maintenance of cell polarity
  evidence_type: IMP
  original_reference_id: PMID:12407027
  qualifier: involved_in
  review:
    summary: CD3G-deficient human T cell lines showed defective adhesion and polarization on ICAM-1 after
      TCR engagement.
    action: KEEP_AS_NON_CORE
    reason: This is a downstream cellular phenotype of reduced/altered TCR signalling (necessity), not
      a step that CD3G itself performs; polarization is executed by integrin and cytoskeletal machinery.
      Experimental annotation from an abstract-only paper is not overruled, but it is not a core function.
    supported_by:
    - &id018
      reference_id: PMID:12407027
      supporting_text: In contrast, other physiological responses like the specific adhesion and concomitant
        cell polarization on ICAM-1-coated dishes were selectively defective, and activation-induced cell
        death was increased.
