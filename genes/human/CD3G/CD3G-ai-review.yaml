    label: positive thymic T cell selection
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:88331
  - PANTHER:PTN000060280
  review:
    summary: IBA from the CD3 gamma/delta family node (donor mouse Cd3d).
    action: KEEP_AS_NON_CORE
    reason: Positive selection is driven by TCR signalling in response to self peptide-MHC, and CD3 chains
      are part of the signalling receptor, so CD3G does contribute to the signal. However, the evidence
      behind the node is knockout phenotype (necessity), and the process-level outcome is several steps
      downstream of the CD3G activity; the core process is T cell receptor signaling pathway. Kept as
      non-core.
