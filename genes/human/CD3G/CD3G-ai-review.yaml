  evidence_type: NAS
  original_reference_id: PMID:12794121
  qualifier: enables
  review:
    summary: CD3G pairs with CD3E and, through extracellular and transmembrane interaction sites, docks
      the CD3 gamma-epsilon dimer onto the TCR chains, providing physical support for assembly of the
      multisubunit TCR-CD3 receptor signalling complex; its phospho-ITAM recruits ZAP70.
