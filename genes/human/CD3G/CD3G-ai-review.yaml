- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:32296183
  qualifier: enables
  supporting_entities:
  - UniProtKB:E9PQX1
  review:
    summary: High-throughput binary Y2H interaction (HuRI) between CD3G and UniProtKB:E9PQX1.
    action: REMOVE
    reason: Bare protein binding from a proteome-scale yeast two-hybrid screen is uninformative about
      CD3G function; most partners (EMP1, PMP22, MAL, TMEM proteins, KTN1) are membrane proteins typical
      of Y2H membrane-protein background, and the result does not support a more specific molecular function.
      Removal does not mean the interaction is false. The informative CD3G interactions (with CD3E and
      TCR chains) are captured by complex membership (GO:0042105) and signaling receptor complex adaptor
      activity.
    supported_by:
    - &id004
      reference_id: PMID:32296183
      supporting_text: Here we present a human 'all-by-all' reference interactome map of human binary
        protein interactions
