  title: Panky, a novel photoreceptor-specific ankyrin repeat protein, is a transcriptional cofactor that
    suppresses CRX-regulated photoreceptor genes.
  findings:
  - statement: PANKY is nuclear and cytoplasmic.
    supporting_text: Subcellular localization of PANKY-A was observed in the nucleus and cytoplasm.
  - statement: CRX induces Panky expression in photoreceptors and pineal.
    supporting_text: Panky-A was specifically expressed in retinal photoreceptors and the pineal gland,
      and its expression was directly up-regulated by the CRX transcription factor.
  - statement: PANKY suppresses CRX-activated genes.
    supporting_text: transactivation analysis suggested that PANKY-A is a transcriptional cofactor that
      suppresses CRX-activated photoreceptor genes.
  - statement: PANKY reduces CRX DNA binding.
    supporting_text: we found by an electrophoretic mobility shift assay that PANKY inhibited the DNA-binding
      activity of CRX.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only; mouse. Source of the mouse EXP localization behind the human ISS row.
  full_text_unavailable: true
- id: PMID:42463452
  title: Transcriptional Corepressors Panky and Panky-Like Modulate Ganglioside Levels and Are Essential
    for Retinal Cone Photoreceptor Structure and Survival.
  findings:
  - statement: Single Panky or Panky-like knockouts are normal.
    supporting_text: Single knock-out (KO) mouse retinas of Panky or Panky-like did not show significant
      alterations at both histological and functional levels compared with those of control mice.
  - statement: Panky/Panky-like double knockouts lose cone structure and function.
    supporting_text: PPL DKO mice exhibited decreased light-evoked activities detected by electroretinogram
      (ERG), impaired cone photoreceptor morphology revealed by immunohistochemistry
  - statement: PANKY/PANKY-LIKE suppress Crx transactivation of Cerkl.
    supporting_text: Transcriptional assays showed that PPL suppressed Crx-mediated transactivation of
      Cerkl
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only; mouse. Defines the in vivo role; Affinage did not retrieve it.
  full_text_unavailable: true
