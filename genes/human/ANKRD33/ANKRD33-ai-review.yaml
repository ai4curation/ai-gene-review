description: 'ANKRD33 (PANKY; ankyrin repeat domain-containing 33) is a photoreceptor- and pineal-specific
  ankyrin-repeat protein. CRX induces its expression, and it in turn represses CRX-activated photoreceptor
  genes and reduces CRX DNA binding, forming a negative-feedback loop. It is found in both the nucleus
  and the cytoplasm. In mice it is redundant with its paralog ANKRD33B (Panky-like): single knockouts
  are normal, but double knockouts have deformed cone outer segments and synaptic terminals, raised retinal
  gangliosides through derepression of the CRX target Cerkl, and later cone death.'
