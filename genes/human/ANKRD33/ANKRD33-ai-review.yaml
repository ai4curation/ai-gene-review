suggested_questions:
- question: Does ANKRD33 bind CRX directly, or does it reduce CRX DNA binding through another partner?
- question: Do human ANKRD33 and ANKRD33B variants contribute to cone dystrophy, given the mouse double-knockout
    phenotype?
suggested_experiments:
- description: Test direct ANKRD33-CRX binding with purified proteins and map the interaction surface,
    then test whether disrupting it abolishes repression of Cerkl.
