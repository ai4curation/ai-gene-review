knowledge_gaps:
- gap_statement: 'How ANKRD33 represses CRX targets is unknown: whether it acts as a corepressor bound
    to CRX at promoters or as an inhibitor that keeps CRX off DNA.'
  boundary: Mouse PANKY suppresses CRX-activated promoters and reduces CRX DNA binding in EMSA, and with
    its paralog represses Cerkl. Direct ANKRD33-CRX binding is not reported in either abstract. The full
    texts could not be retrieved (no open-access full text of PMID:42463452 was available from Europe
    PMC or PMC-OA), so neither GO:0003714 transcription corepressor activity (acts at the locus) nor GO:0140416
    transcription regulator inhibitor activity (prevents DNA binding by direct binding) can yet be assigned.
    Human ANKRD33 has high-throughput interactions with MBD3 (a NuRD subunit) and ANKRD11, which would
    fit a chromatin-level corepressor if confirmed.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: The distinction decides which molecular function term applies, and whether ANKRD33 acts
    on chromatin or before CRX reaches it.
  resolution: Test direct ANKRD33-CRX binding with purified proteins, and use ChIP to test whether ANKRD33
    occupies CRX-bound promoters such as Cerkl.
