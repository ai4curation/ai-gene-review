id: Q92519
gene_symbol: TRIB2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: TRIB2 (Tribbles homolog 2) is a pseudokinase of the Tribbles subfamily of the CAMK group.
  Its kinase-like domain binds ATP weakly and autophosphorylates only at a low, metal-independent level,
  and its main known role is as a scaffold. A C-terminal motif binds the E3 ubiquitin ligase COP1, and
  the kinase-like domain binds substrates. In this way TRIB2 couples COP1 to transcription factors such
  as C/EBPalpha and C/EBPbeta, and to the mitotic phosphatase CDC25C, promoting their ubiquitination and
  proteasomal degradation. Like the other Tribbles proteins it also binds MAPK kinases and modulates MAPK
  and AKT/FOXO signalling. TRIB2 is found in the cytoplasm and nucleus. It is highly expressed in leukocytes
  and in several cancers, where it promotes C/EBPalpha-dependent leukemogenesis, FOXO repression, proliferation
  and glycolytic metabolism in melanoma, and drug resistance.
existing_annotations:
- term:
    id: GO:0000166
    label: nucleotide binding
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q28283
  negated: true
  review:
    summary: NOT nucleotide binding, transferred from an ortholog by sequence similarity.
    action: REMOVE
    reason: Direct biochemistry on human TRIB2 contradicts this negative annotation. Recombinant TRB2
      binds ATP in the absence of divalent cations, and mutating the conserved beta3 lysine (K90M/K90A)
      abolishes this binding (PMID:25583260). The affinity is low, but nucleotide binding is present,
      so the NOT claim is wrong for the human protein.
    supported_by:
    - reference_id: PMID:25583260
      supporting_text: we report that the human pseudokinase TRB2 retains the ability to both bind and
        hydrolyse ATP weakly in vitro
    - reference_id: PMID:25583260
      supporting_text: considerable stability (ΔTm ∼6°C compared with a TRB buffer control) was imparted
        upon WT TRB2 in the presence of both 1 mM ATP and 2 mM EDTA (Figure 2C), demonstrating that it
        bound to ATP under these conditions
- term:
    id: GO:0004672
    label: protein kinase activity
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q28283
  negated: true
  review:
    summary: NOT protein kinase activity, transferred by sequence similarity.
    action: UNDECIDED
    reason: UniProt describes the kinase-like domain as predicted to be catalytically inactive, and every
      cellular function of TRIB2 that has been described is a scaffold or adaptor function. However, human
      TRB2 autophosphorylates weakly, without metal, in vitro, and this needs the catalytic lysine (PMID:25583260).
      No trans-phosphorylation of a substrate has been shown. Whether this residual activity should defeat
      a NOT protein kinase activity claim is a judgement GO has not settled for pseudokinases. The answer
      is left open here rather than removing or endorsing the negation.
    supported_by:
    - reference_id: PMID:25583260
      supporting_text: Kinase activity is metal-independent and involves a catalytic lysine residue, which
        is conserved in TRB proteins throughout evolution alongside several unique amino acids in the
        active site.
    - reference_id: file:human/TRIB2/TRIB2-uniprot.txt
      record_section: ["CC:DOMAIN"]
      supporting_text: The protein kinase domain is predicted to be catalytically inactive.
