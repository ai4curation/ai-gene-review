core_functions:
- description: Pseudokinase adaptor that binds the E3 ligase COP1 (C-terminal motif) and substrate proteins
    (C/EBPalpha, C/EBPbeta, CDC25C) to promote their ubiquitination and proteasomal degradation
  molecular_function:
    id: GO:0055106
    label: ubiquitin-protein transferase regulator activity
  directly_involved_in:
  - id: GO:0032436
    label: positive regulation of proteasomal ubiquitin-dependent protein catabolic process
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:20805362
    supporting_text: Together, our data demonstrate that Trib2 can bind both COP1 and C/EBP-α, leading
      to degradation of C/EBP-α.
  - reference_id: PMID:27563873
    supporting_text: Overexpression of TRIB2 promotes K48 linked polyubiquitination and degradation of
      CDC25C via the nuclear proteasome.
suggested_questions:
- question: Does TRIB2 control glycolysis in melanoma through a defined substrate (for example by degrading
    a transcriptional regulator of PDK4), or is the reduced glycolytic flux in TRIB2-KO cells a secondary
    consequence of reduced AKT/FOXO signalling and proliferation?
- question: Should GO regard weak, metal-independent in vitro autophosphorylation as enough to defeat
    a NOT protein kinase activity annotation on a pseudokinase?
suggested_experiments:
- description: Re-express wild-type TRIB2, a COP1-binding mutant and a kinase-domain (catalytic loop)
    mutant in TRIB2-KO UACC-62 cells, and measure ECAR, glucose uptake and PDK4. This would test whether
    the glycolytic phenotype needs the adaptor function.
  experiment_type: rescue with structure-function mutants and Seahorse metabolic flux analysis
