suggested_questions:
- question: How is IKK-beta substrate selectivity (IkappaB versus RELA, NFKB1, TBK1, IKBKE) controlled
    within and beyond the IKK complex?
- question: What distinguishes membrane-raft/receptor-recruited IKK-beta activity from the bulk cytosolic
    pool?
suggested_experiments:
- description: Analog-sensitive IKK-beta plus phosphoproteomics to define its direct substrate set in
    different receptor contexts.
  experiment_type: proteomics
- description: Reconstitute the IKK complex (IKKA/IKKB/NEMO) and measure IkappaB phosphorylation kinetics
    with and without upstream activating kinases.
  experiment_type: biochemistry
