id: O14920
gene_symbol: IKBKB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: IKBKB encodes IKK-beta, the principal catalytic serine/threonine kinase subunit of the IkappaB
  kinase (IKK) complex. Acting in the cytoplasm (with recruitment to receptor signaling complexes at the
  inner face of the plasma membrane and in membrane rafts), it phosphorylates the inhibitory IkappaB proteins
  on two critical serines, triggering their ubiquitin-dependent degradation and releasing NF-kappaB to
  enter the nucleus. It thereby transduces signals from inflammatory cytokine, Toll-like, antigen and
  other immune receptors into canonical NF-kappaB activation, controlling immunity, inflammation, proliferation
  and survival.
