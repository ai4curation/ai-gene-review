id: P11168
gene_symbol: SLC2A2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: GLUT2 is a low-affinity, high-capacity facilitative (uniporter) hexose
  transporter of the major facilitator superfamily (MFS) glucose-transporter subfamily
  (class I GLUTs). It mediates energy-independent, bidirectional facilitated diffusion
  of D-glucose, D-fructose and D-galactose across the plasma membrane, and additionally
  transports dehydroascorbic acid (oxidized vitamin C) and urate. It is expressed in
  liver, pancreatic beta cells, and the basolateral membrane of small-intestinal and
  renal proximal-tubule epithelia, where it completes transcellular sugar movement begun
  by apical Na(+)/glucose symporters. In hepatocytes it supports bidirectional glucose
  flux (uptake and glucose output); in rodent beta cells it contributes to the
  glucose-sensing step upstream of insulin secretion. Loss-of-function variants cause
  Fanconi-Bickel syndrome, with hepatorenal glycogen accumulation, proximal renal tubular
  dysfunction, and impaired glucose and galactose utilization.
