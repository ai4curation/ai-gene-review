- id: PMID:23396969
  title: Intestinal dehydroascorbic acid (DHA) transport mediated by the facilitative
    sugar transporters, GLUT2 and GLUT8.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct oocyte demonstration that GLUT2 transports dehydroascorbic acid
      (Km 3.23 mM); also the glucose/fructose Vmax reference. Supports the DHA-transport rows.
- id: PMID:28083649
  title: Reassessment of GLUT7 and GLUT9 as Putative Fructose and Glucose Transporters.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Confirms GLUT2 as a fructose and glucose transporter in oocytes and NIH-3T3
      fibroblasts; p.I322V reduces fructose transport. Title foregrounds GLUT7/GLUT9 but GLUT2
      is directly assayed as the positive control.
- id: PMID:29548810
  title: Differential patterns of inhibition of the sugar transporters GLUT2, GLUT5
    and GLUT7 by flavonoids.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: GLUT2-mediated glucose and fructose transport directly measured in oocytes and
      shown to be inhibited by flavonoids (quercetin, EGCG, apigenin).
- id: PMID:40209957
  title: GLUT2/SLC2A2 is a bi-directional urate transporter.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cell-based assays demonstrate bidirectional urate transport by GLUT2 (uptake
      and efflux), inhibited by GLUT2 inhibitors; basis for the NEW urate transport annotations.
- id: PMID:8027028
  title: A mutation in the Glut2 glucose transporter gene of a diabetic patient abolishes
    transport activity.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: NIDDM variant V197I abolishes GLUT2 glucose transport in oocytes; supports the
      glucose-transporter activity and plasma-membrane localization rows.
- id: PMID:8457197
  title: 'Kinetic analysis of the liver-type (GLUT2) and brain-type (GLUT3) glucose
