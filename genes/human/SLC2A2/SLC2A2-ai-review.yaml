  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:95758
  - PANTHER:PTN008599990
  - RGD:2711
  - RGD:3704
  - RGD:3706
  - UniProtKB:P11166
  - UniProtKB:P11169
  - ZFIN:ZDB-GENE-030131-1213
  - ZFIN:ZDB-GENE-030131-3158
  review:
    summary: Phylogenetic inference of glucose import across the plasma membrane.
    action: ACCEPT
    reason: GLUT2 imports glucose (beta-cell uptake, basolateral absorptive uptake). As a
      facilitative uniporter it is bidirectional, so it also exports glucose (e.g. hepatocyte
      glucose output); the import term captures one genuine, well-supported direction and is
      consistent with the conserved family function.
