- term:
    id: GO:0015143
    label: urate transmembrane transporter activity
  evidence_type: IDA
  original_reference_id: PMID:40209957
  qualifier: enables
  review:
    summary: NEW. GLUT2 transports urate (Km approx 4.6 mM), demonstrated by radiolabeled urate
      uptake into GLUT2-expressing cells that is blocked by GLUT2 inhibitors; GWAS links SLC2A2 to
      serum urate.
    action: NEW
    reason: Direct cell-based assay establishes urate as a GLUT2 substrate; the transporter itself
      performs the transport step (passes the participation test). Not currently captured by any
      existing molecular-function annotation.
    supported_by:
    - reference_id: PMID:40209957
      supporting_text: demonstrating that GLUT2 is a urate transporter
      reference_section_type: ABSTRACT
- term:
    id: GO:0015747
    label: urate transport
  evidence_type: IDA
  original_reference_id: PMID:40209957
  qualifier: involved_in
  review:
    summary: NEW. Biological-process counterpart of GLUT2 urate transport; GLUT2 is a
      bidirectional urate transporter (uptake and efflux demonstrated).
    action: NEW
    reason: Urate transport by GLUT2 is directly demonstrated in both directions. GLUT2 executes
      the transport step itself, satisfying the participation test. Not captured by existing
      process annotations.
    supported_by:
    - reference_id: PMID:40209957
      supporting_text: a bi-directional urate transporter
      reference_section_type: ABSTRACT
