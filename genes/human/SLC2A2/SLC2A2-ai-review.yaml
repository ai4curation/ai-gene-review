  review:
    summary: Phylogenetic inference placing GLUT2 at the brush border (apical) membrane.
    action: MARK_AS_OVER_ANNOTATED
    reason: In polarized intestinal and renal epithelia GLUT2 is canonically a basolateral
      transporter, paired with apical SGLT1 for transcellular sugar absorption. Apical or
      brush-border GLUT2 is a conditional, debated phenomenon (transient recruitment under
      high luminal glucose, largely from rodent studies) rather than the steady-state site of
      function; the IBA over-propagates this non-canonical location.
    propagation_review:
