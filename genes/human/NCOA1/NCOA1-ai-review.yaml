id: Q15788
gene_symbol: NCOA1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: NCOA1 (SRC-1) is a p160-family nuclear transcriptional coactivator with bHLH/PAS domains,
  receptor-interaction motifs and activation regions that recruit additional cofactors. It potentiates
  steroid and other nuclear receptor transcription and can also cooperate with non-receptor transcription
  factors. Recruitment depends on receptor domains, ligands, promoter context and SRC1 splice isoform;
  androgen receptor AF1 contacts can differ from the classical LXXLL–AF2 interaction. SRC1 helps assemble
  chromatin-modifying and basal transcription machinery. Intrinsic histone H3/H4 acetyltransferase activity
  has been reported, although its physiological contribution relative to recruited acetyltransferases
  is less clear. Its endocrine, developmental and metabolic effects reflect tissue-specific transcriptional
  programs.
