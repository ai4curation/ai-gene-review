id: O76039
gene_symbol: CDKL5
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CDKL5 is a serine/threonine protein kinase with an N-terminal catalytic domain and a long
  regulatory C-terminal region. It phosphorylates cytoskeletal regulatory proteins and supports dendritic
  microtubule dynamics and excitatory postsynaptic organization. Human neuronal models link loss of CDKL5
  to reduced substrate phosphorylation and abnormal synaptic structure. A nuclear pool participates in
  transcriptional repression near induced DNA breaks, while additional centrosomal, midbody and ciliary
  functions have been demonstrated in defined cell-culture contexts. Alternative C-terminal products differ
  in expression and regulation. Pathogenic variants cause CDKL5 deficiency disorder, characterized by
  early seizures and severe neurodevelopmental impairment.
