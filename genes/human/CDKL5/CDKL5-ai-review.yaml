- term:
    id: GO:0034244
    label: negative regulation of transcription elongation by RNA polymerase II
  evidence_type: IDA
  original_reference_id: PMID:34605059
  qualifier: involved_in
  review:
    summary: Retain damage-associated RNAPII repression while leaving its inhibited stage unresolved.
    action: MODIFY
    reason: 'Human U2OS assays establish CDKL5-dependent repression after DNA breaks, with WT but not
      K42R rescue. The elongation model has real support: ELOA is an elongation factor and RNAPII-directed
      E3-ligase component, CDKL5 phosphorylates ELOA Ser311, and DRB blocks recruitment of both proteins.
      Earlier ATM/DNA-PK studies establish elongating-RNAPII responses to breaks. However, these findings
      do not identify the CDKL5-regulated step: DRB tests recruitment, ELOA recruitment persists without
      Ser311 phosphorylation, and the Discussion leaves the effect of this phosphorylation on ELOA function
      and repression open. The MS2 silencing Methods induce FokI for 3 h before adding doxycycline; the
      separate recruitment protocol activates transcription first. Endogenous SLCO5A1/RYR2 RNA measurements
      establish repression but not its stage. Therefore propose GO:0000122 for the demonstrated RNAPII
      inhibition without rejecting the plausible elongation mechanism. Live QuickGO closure excludes GO:0000122
      from GO:0034244 ancestors: this is an intentional lateral replacement of narrower mechanistic wording,
      not a formal parent move.'
    supported_by:
    - reference_id: PMID:34605059
      supporting_text: CDKL5 facilitates the transcriptional silencing of genes at or close to DSB
    - reference_id: PMID:20550933
    - reference_id: PMID:22343725
    proposed_replacement_terms:
    - id: GO:0000122
      label: negative regulation of transcription by RNA polymerase II
