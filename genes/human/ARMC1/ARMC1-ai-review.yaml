id: Q9NVT9
gene_symbol: ARMC1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ARMC1 is a 282-residue protein with an N-terminal armadillo-motif helical domain, a heavy
  metal-associated-like domain that lacks metal-coordinating cysteines, and a conserved C-terminal domain
  that attaches it peripherally to the mitochondrial outer membrane. It shuttles between the cytosol and
  mitochondria. On mitochondria it is recruited by the trafficking adaptor MIRO and assembles MIRO with
  the fission regulator MTFR (MTFR1L), stabilizing MTFR. The resulting complexes oppose retrograde mitochondrial
  movement. A separate complex with DNAJC11 releases ARMC1 to the cytosol. ARMC1 also co-purifies with
  MICOS/MIB components. Loss of ARMC1 fragments mitochondria and collapses them into the perinuclear region
  without affecting cristae or respiration. The C. elegans ortholog ARCP-1 is a dendritic scaffold for
  the phosphodiesterase PDE-1.
