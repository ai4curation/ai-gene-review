core_functions:
- description: Processes DNA from a 5′ end by hydrolytic cleavage, with defined human FAN1 assays resolving
    distributive, predominantly three-nucleotide excision on phosphorylated nick or short-flap substrates.
    Flap-DNA recognition and terminal-phosphate contacts position the substrate for cleavage; they are
    part of this coordinated nuclease mechanism. This chemistry can continue past a defined synthetic
    interstrand crosslink and unhook it from one strand. Human damage-site recruitment and cellular crosslink-repair
    phenotypes provide the repair context, while the physiological ordering with other nucleases remains
    unresolved. The activity is demonstrated with full-length and engineered C-terminal human preparations,
    not the natural 533-residue product.
  molecular_function:
    id: GO:0008409
    label: 5'-3' exonuclease activity
  directly_involved_in:
  - id: GO:0036297
    label: interstrand cross-link repair
  locations:
  - id: GO:0090734
    label: site of DNA damage
  supported_by:
  - reference_id: PMID:20603015
  - reference_id: PMID:20603073
  - reference_id: PMID:24981866
  - reference_id: PMID:25430771
- description: Incises 5′-flap-containing DNA internally at the branch-associated duplex region, a substrate-selective
    endonuclease activity supported by purified human FAN1 and catalytic-mutant controls. This is the
    second catalytic facet of the same DNA-processing machinery, coordinated with subsequent 5′-end processing
    in interstrand-crosslink repair rather than a separate pathway or a second enzyme. Direct flap recognition
    positions the DNA substrate for this reaction. Damage-site accumulation depends on the recruitment
    machinery; neither this activity label nor the tested substrates establish Okazaki-fragment maturation,
    Holliday-junction resolution or constitutive fork occupancy. The natural 533-residue product is not
    equated with the assayed enzyme.
