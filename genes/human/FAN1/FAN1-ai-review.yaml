- description: Incises structured DNA internally, including the independently established 5′-flap reaction
    and cleavage near small CAG/CTG extrahelical extrusions. These are substrate-dependent reactions of
    one endonuclease, not separate enzymes. With purified full-length human FAN1 and catalytic controls,
    RFC-loaded PCNA and ATP permit strand-directed extrusion incision on nicked circular DNA at near-physiological
    ionic strength; PCNA alone stimulates the corresponding linear-substrate reaction, and intrinsic FAN1
    catalysis does not require ATP. FAN1 depletion/add-back in human nuclear extracts links incision to
    short-patch extrusion removal, providing a direct contribution to trinucleotide-repeat maintenance
    alongside its crosslink-repair role. MutSβ competes for extrusion occupancy; MutLα binding does not
    establish canonical mismatch-repair participation. The extract reaction does not assign DNA synthesis
    or ligation to FAN1. Damage-site localization describes the established crosslink-repair context rather
    than constitutive fork residence or the location of every extrusion reaction. No equivalent activity
    is assigned to the natural 533-residue product.
