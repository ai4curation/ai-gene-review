core_functions:
- description: Processes DNA from a 5′ end by hydrolytic cleavage, with defined human FAN1 assays resolving
    distributive, predominantly three-nucleotide excision on phosphorylated nick or short-flap substrates.
    Flap recognition and terminal-phosphate contacts position DNA for cleavage. Processing can continue
    past a defined synthetic interstrand crosslink and unhook it from one strand. This exonuclease reaction
    and the internal-incision reaction below are coordinated facets of the same enzyme. Whole-enzyme nuclease
    activity also restrains HU-stressed replication forks, but the cellular rescue experiments do not
    distinguish exonuclease from endonuclease contributions or demonstrate fork reversal. Full-length
    and engineered C-terminal human preparations establish the chemistry; the natural 533-residue product
    is not equated with them.
  molecular_function:
    id: GO:0008409
    label: 5'-3' exonuclease activity
  directly_involved_in:
