suggested_questions:
- question: Which DNA substrate and which catalytic mode account for FAN1-dependent restraint of HU-stressed
    replication forks? How does UBZ/FANCD2-dependent recruitment select this function separately from
    crosslink repair, without presupposing fork reversal or restart?
- question: Which additional nuclease, polymerase and ligase activities complete FAN1-dependent short-patch
    extrusion removal, and how do PCNA orientation and competition with MutSβ control pathway choice in
    repeat-bearing human chromatin?
- question: Can the ontology distinguish DNA-specific 5′ exonucleolysis yielding short oligonucleotides
    from the mononucleotide-only definition of GO:0035312, and represent 5′-flap cleavage without the
    substrate-exclusivity and Okazaki-processing wording of GO:0017108?
- question: Does UBZ-dependent recognition of monoubiquitinated FANCD2 also organize a defined third-protein
    interaction, or does it primarily recruit FAN1 itself to DNA? How do the observed MutL associations
    relate to that recruitment and repair chemistry?
- question: Where is the natural 533-residue FAN1 product expressed, and does it have a regulatory or
    recognition role distinct from the 1017-residue nuclease?
suggested_experiments:
- description: Compare sequence-verified human FAN1 catalytic and UBZ mutants in matched U2OS rescue experiments
    with and without HU, measuring nascent-track length, chromosome abnormalities and crosslink resistance
    separately. In parallel, map cleavage on defined stalled-fork structures and characterize separation-of-function
    mutants in both exonuclease and internal-incision assays. Link cellular rescue to verified catalytic
    selectivity and expression rather than treating a nuclease-dead mutant as evidence for one cleavage
    mode.
  hypothesis: FANCD2-dependent recruitment and particular DNA-cleavage reactions may account for stress-dependent
    restraint independently of the recruitment requirements of crosslink repair; the existing data do
    not identify that reaction or prove fork reversal.
- description: Extend purified human FAN1–PCNA–RFC extrusion-incision reactions to complete short-patch
    repair by adding candidate polymerases and ligases individually. Vary nick strand, extrusion size
    and sequence, ionic strength and PCNA loading; include D960A, no-ATP and PCNA-alone linear-DNA controls.
    Measure incision products, excision length, repair synthesis and restored duplex sequence separately,
    then test the resolved pathway in matched human repeat reporters with defined MutSβ and MutLα status.
  hypothesis: Incision by FAN1 can initiate a short-patch route, while other enzymes complete removal,
    synthesis and sealing. Substrate occupancy and clamp orientation may determine competition with mismatch
    repair without making FAN1 a polymerase, ligase or obligatory MMR component.
- description: Reconstitute FAN1 recruitment using defined unmodified and monoubiquitinated FANCD2–FANCI,
    DNA, and candidate third partners. Measure recruitment and binary binding separately from formation
    of a ternary interaction and from nuclease output. Include UBZ, FANCD2 ubiquitination-site and catalytic
    controls, and test cellular co-association without assuming that every recovered partner contacts
    FAN1 directly.
  hypothesis: Recruitment alone can explain the current UBZ dependence. A distinct adaptor role would
    require evidence that FAN1 coordinates the modified target with another protein beyond its own localization
    to DNA.
- description: Establish product-specific endogenous expression with validated transcript and protein
    measurements, then compare matched amounts of sequence-verified 1017- and 533-residue products in
    localization, binding, nuclease and repair-rescue assays. Use reagents recognizing shared and product-specific
    regions; the existing C-terminal HPA antigen cannot detect the short product. Distinguish native products
    from engineered C-terminal fragments and control protein stability.
  hypothesis: Loss of the C-terminal nuclease region predicts a different catalytic capacity, but does
    not establish absence of all recognition, recruitment or regulatory function in the short product.
