gene_symbol: FAN1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: FAN1 is a structure-selective DNA nuclease that recognizes branched DNA and contributes directly
  to repair of DNA interstrand crosslinks. Its C-terminal nuclease region supports 5′-flap incision and
  5′-to-3′ exonucleolytic processing, including successive three-nucleotide excision on suitable phosphorylated
  DNA ends. An N-terminal ubiquitin-binding zinc finger promotes recruitment through monoubiquitinated
  FANCD2 at sites of DNA damage. FAN1 also occupies a broader nucleoplasmic pool and associates with FANCI
  and MutL-family proteins, although these associations do not define a single obligatory repair complex.
  The 1017-residue protein and the natural 533-residue product have different C-terminal sequences; the
  shorter product lacks the nuclease region, and its biological activity and localization remain unresolved.
