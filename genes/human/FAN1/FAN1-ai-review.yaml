gene_symbol: FAN1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: FAN1 is a nuclear structure-selective DNA nuclease that contributes to interstrand-crosslink
  repair, replication-stress control and maintenance of trinucleotide repeats. It recognizes branched
  DNA and catalyzes both 5′-to-3′ exonucleolytic processing and internal incision of flaps or extrahelical
  DNA extrusions. Recruitment through ubiquitinated FANCD2 supports nuclease-dependent restraint of stressed
  replication forks, but this recruitment can be dispensable for crosslink resistance. DNA-loaded PCNA
  stimulates strand-directed cleavage near CAG or CTG extrusions, enabling a short-patch removal pathway
  that can compete with MutSβ-dependent mismatch repair. FAN1 deficiency causes karyomegalic interstitial
  nephritis, and human variation in FAN1 modifies Huntington disease onset. The 1017-residue protein and
  natural 533-residue product differ in their C-terminal sequences; the shorter product lacks the nuclease
  region, and its biological activity and localization remain unresolved.
