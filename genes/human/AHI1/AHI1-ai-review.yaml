      species.
    action: NEW
    reason: >-
      This is a coverage gap, not an over-annotation. Three papers over three years
      establish the interaction, and QuickGO returns zero annotations under GO:0016055,
      GO:0060070, GO:0090263 or GO:0008013 for human AHI1 (37 annotations), mouse Ahi1
      (75) or rat Ahi1 (63). The affinage deep-research record for this gene never
      mentions Wnt, beta-catenin or CTNNB1 across its 31 findings - consistent with the
      campaign's measured recall problem, and here the decisive papers are titled for
      cystic kidney disease and for the primary cilium rather than for AHI1.

      Evidence. In the originating study, GFP-tagged jouberin expressed in human 293T cells
      pulled down endogenous beta-catenin, with GFP empty vector as the negative control,
      and the reciprocal co-immunoprecipitation was done from tissue. In the paper cited
      here, the interaction was retested with three Joubert disease alleles and V443D
      selectively lost it.

      Species reasoning, stated rather than assumed. UniProt lists this interaction in the
