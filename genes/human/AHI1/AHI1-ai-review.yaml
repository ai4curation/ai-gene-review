        source_label: Mus musculus Ahi1, Jouberin (Swiss-Prot, 1047 aa)
        source_status: SUPPORTS_TRANSFER
        comment: Holds GO:0007169 by IMP from PMID:20956301, a neuron-specific Cre-loxP
          knockout. Four of this gene's ISS rows trace to that one paper.
