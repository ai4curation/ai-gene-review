      human, mouse or rat.
    resolution: >-
      A reporter and nuclear-beta-catenin measurement in isogenic AHI1-knockout human RPE1
      or HEK293 cells with human AHI1 rescue, which would supply a human IMP and settle the
      construct-species question.
- description: >-
    Self-associates into dimers and tetramers. This is the molecular property that the
    rest of the protein's behaviour is built on: the defined assemblies AHI1 forms with
    its partners are AHI1(2):NPHP1(2) and AHI1(2):HAP1(2) heterotetramers, so a
    homo-oligomer is the unit that engages them. Shown directly in human cells by
    co-immunoprecipitation of two differently tagged copies of human AHI1 from HEK293
    lysates, and independently by gel filtration, which resolves AHI1 dimers and tetramers
    as discrete species. It is given its own entry because it is one of only two
    molecular activities of the human protein measured in human cells, and because the
    Joubert allele V443D - which destroys the AHI1:NPHP1 tetramer - leaves
    self-association intact, so the two are separable properties rather than one.
