suggested_questions:
- question: Can the original human GO:0060271 IMP provenance from PMID:21959375 be reconciled
    with its mouse/zebrafish experimental systems, or should independent human fibroblast
    evidence from PMID:23532844 supply the direct experimental source?
- question: Which transition-zone proteins require AHI1 for transport to or maintenance at that
    zone, as distinct from delivery into the ciliary membrane? Complex membership can support
    structural participation, but the exact GO:1904491 contribution remains unresolved.
- question: Which tissue, allele and genetic-background differences explain preservation of
    cilia in some Ahi1-null models and assembly failure in others?
- question: Can the original Jouberin expression-construct records resolve direct-human coding
    of beta-catenin binding and support coordinated mouse/human curation of the Wnt process?
    The proposed GO:0090263 ISS requires an established donor assertion or direct human
    experimental provenance; the measured response remains part of the biological synthesis.
- question: Can mouse OTUD1–TYK2 recruitment in PMID:35821088 be curated for the donor, or
    can the corresponding AHI1-dependent bridge be demonstrated directly in human cells?
    Human A549 association and TYK2 stability alone do not establish the specific bridging
    dependency needed to recode the prior GO:0030674 proposal as direct human IDA/IMP.
- question: Does the PAINT alignment/tree provide additional functional conservation or
    divergence evidence around PTN002893387? The present source-access limitation should not be
