id: Q8N157
gene_symbol: AHI1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  AHI1 encodes Jouberin, a 1196-residue modular protein with no catalytic domain, no
  nucleotide- or metal-binding site and no assigned EC number. Its architecture is
  entirely built from interaction modules: an N-terminal coiled coil (residues 13-45),
  a long disordered region, seven WD40 repeats (607-926) and a C-terminal SH3 domain
  (1051-1111). The coiled coil is present in the human protein but absent from the
  mouse orthologue.

  Jouberin is concentrated at the base of the primary cilium. It occupies a ring-shaped
  domain at the distal end of the mother centriole and is a subunit of the MKS
  (tectonic-like) transition-zone complex, the assembly that forms the Y-shaped links
  between the axonemal microtubules and the ciliary membrane and acts as a diffusion
  barrier separating the ciliary compartment from the rest of the cell. It is also
  found at the centrosome and at epithelial adherens junctions, and a non-ciliary
  cytoplasmic pool exists.

  The molecular activities that have been measured are all protein-protein
  associations, each through a different part of the chain. The WD40 repeats bind
  nephrocystin-1, and the two proteins assemble into a defined heterotetramer and
  heterodimer; a region between the coiled coil and the WD40 repeats (141-434) binds
  huntingtin-associated protein 1; the SH3 domain binds the large GTPase dynamin-2;
  and Jouberin self-associates into dimers and tetramers. In the interferon pathway
  it acts as a genuine adaptor, holding the deubiquitinase OTUD1 against the kinase
  TYK2 so that TYK2 is deubiquitinated and stabilised - the association of OTUD1 with
  TYK2 is lost when Jouberin is absent, while the Jouberin-TYK2 association survives
  loss of OTUD1. Jouberin also binds beta-catenin and carries it into the nucleus
  through its own nuclear-localisation signals, amplifying an already-activated
  canonical Wnt response rather than initiating one; the primary cilium opposes this
  by sequestering Jouberin away from the nucleus.

  Loss of Jouberin disrupts ciliogenesis and ciliary cargo delivery: cilia are fewer,
  ARL13B fails to accumulate in the remaining cilia, RAB8A is destabilised and lost
  from the basal body, and photoreceptor outer segments fail to form with opsin
  mislocalised throughout the cell. Biallelic AHI1 mutations cause Joubert syndrome
  type 3, a cerebello-oculo-renal ciliopathy defined by cerebellar vermis hypoplasia
  and the molar tooth sign, with variable retinal dystrophy and nephronophthisis, and
  missense alleles in the WD40 repeats also cause non-syndromic retinitis pigmentosa.
