  knowledge_gaps:
  - gap_statement: >-
      The adaptor activity assigned here is inferred from a single bridging experiment in
      a different pathway and a different species; no bridging has been tested at the
      transition zone itself.
    boundary: >-
      Firmly established: AHI1 binds at least five partners through at least three
      separate surfaces, assembles defined heterotetramers with NPHP1 and with HAP1, and
      is required in mouse macrophages for OTUD1 to associate with TYK2 (with the
      reciprocal control). Absent: any demonstration that two transition-zone proteins
      require AHI1 to associate with one another.
    gap_kind:
    - BIOLOGY
    dark_aspect: MF_DARK
    status: OPEN
    significance: >-
      Determines whether AHI1 organises the transition-zone complex or merely occupies a
      position in it, which is the difference between a structural role and a regulatory
      one in Joubert syndrome.
    resolution: >-
      Pairwise association assays among MKS-module and NPHP-module proteins in isogenic
      AHI1-knockout versus rescued human RPE1 cells, with reciprocal controls.
- description: >-
    Carries beta-catenin into the nucleus and thereby amplifies an already-activated
    canonical Wnt response. AHI1 binds beta-catenin directly and supplies the nuclear
    localisation signals that beta-catenin lacks; it is not a pathway initiator, since
    expressing it alone neither activates a Wnt reporter nor is sufficient to trigger a
    transcriptional response. The primary cilium opposes this activity by sequestering
    AHI1 away from the nucleus, which is how a transition-zone protein becomes a
    context-dependent Wnt regulator. Loss of this activity is the proposed mechanism for
    the cerebellar vermis hypoplasia of Joubert syndrome, and all three Joubert missense
    alleles tested fail to potentiate the pathway.
