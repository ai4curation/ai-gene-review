core_functions:
- description: 'Jouberin supports ciliary organization and vesicular cargo trafficking from the
    basal-body/transition-zone region as an MKS-complex-associated protein. Conserved cilium assembly
    includes motile and non-motile systems; the individual experimental models do not establish
    activity in every native human ciliated tissue. Mouse Ahi1 depletion disrupts Golgi-directed
    vesicle transport and transferrin recycling, while human fibroblast and construct assays establish
    ciliary cargo organization. Human AHI1 self-associates and interacts with ciliary partners,
    but its native stoichiometry and exact physical contribution to the transition-zone assembly
    remain unresolved. Its loss can reduce cilium formation or alter the composition of cilia that
    remain, including ARL13B and neuronal receptor localization. Outcomes vary with the model and
    allele: in human hTERT-RPE1 cells, tested WD40-domain variants reduce basal-body enrichment
    without significantly changing cilium frequency or length, and fibroblasts from one patient
    with retinitis pigmentosa retain ciliation. Similar localization defects in the tested RP and
    Joubert variants do not explain their different clinical phenotypes.'
