    label: cytosol
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-5617816
  qualifier: located_in
  review:
    summary: The cytosolic compartment is compatible with AHI1-containing ciliary-base assemblies.
    action: ACCEPT
    reason: Reactome places AHI1 within a cytosolic basal-body/transition-zone participant in RAB3IP-mediated
      nucleotide exchange on RAB8A. This is a curated participant-compartment assertion, not a direct
      microscopy assay or an assertion that AHI1 catalyzes the named reaction. Cytoplasmic AHI1 and
      its ciliary-base assemblies support the broad compartment. Retain it at the modeled resolution;
