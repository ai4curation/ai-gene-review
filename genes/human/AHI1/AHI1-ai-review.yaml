- term:
    id: GO:0043066
    label: negative regulation of apoptotic process
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q8K3E5
  review:
    summary: >-
      The photoreceptor death in Ahi1-null mice is a downstream consequence of opsin
      mislocalisation, not a regulatory activity of AHI1 - the same paper shows the death
      is delayed by reducing opsin dosage.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The donor annotation itself is not in dispute: mouse Ahi1 holds GO:0043066 by IMP
      from PMID:20081859, and the observation is real. What does not transfer is the
      implication that AHI1 regulates apoptosis.

      The source paper supplies its own disproof of that reading. Photoreceptors die
      between 2 and 4 weeks in Ahi1-null mice, and the death is significantly delayed by
      halving opsin dosage - i.e. the apoptosis is the cell's response to mislocalised
      opsin accumulating where it does not belong, which in turn follows from the failure
      to build an outer segment. Remove the mislocalised cargo and the death is deferred
      without restoring AHI1. That is a causal chain of at least two steps, and the
      structural failure at the head of it is already annotated as GO:0035845.

      No human evidence of any kind exists for AHI1 in apoptosis regulation. Marked as
      over-annotated rather than removed because the genetic relationship is genuine and
      an acts_upstream_of qualifier would make it defensible; it is the involved_in
      qualifier and the implied mechanism that overreach.
