- id: PMID:18633336
  title: Jouberin localizes to collecting ducts and interacts with nephrocystin-1.
  findings:
  - statement: The abstract reports junctional/ciliary-base localization in mIMCD3 and
      Jouberin-GFP centrosomal localization in MDCK; full construct provenance remains
      unresolved.
    supporting_text: Jouberin is expressed at cell-cell junctions, primary cilia and basal body
      of mIMCD3 cells
    reference_section_type: ABSTRACT
  - statement: Endogenous and exogenous NPHP1 association was measured in HEK293 cells.
    supporting_text: We show that Jouberin interacts with nephrocystin-1 as determined by
      yeast-2-hybrid system and this was confirmed by exogenous and endogenous
      co-immunoprecipitation in HEK293 cells.
    reference_section_type: ABSTRACT
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached primary abstract supports endogenous/exogenous NPHP1
      co-immunoprecipitation in HEK293 and identifies mouse mIMCD3 and canine MDCK localization
      systems. Host-cell species does not establish the species of an exogenous Jouberin
      construct. Original full methods were not recovered; human construct localization is
      independently corroborated by PMID:23532844.
- id: PMID:19625297
  title: Ahi1, whose human ortholog is mutated in Joubert syndrome, is required for Rab8a
    localization, ciliogenesis and vesicle trafficking.
  findings:
  - statement: Mouse Ahi1 localizes to the basal body of primary cilia.
    supporting_text: Ahi1 immunostaining mapped to the base of the primary non-motile cilium,
      specifically the basal body
  - statement: Ahi1 depletion lowers Rab8a abundance and basal-body accumulation.
    supporting_text: In contrast, in Ahi1-knockdown cells, Rab8a expression was significantly
      lower, and it could not be detected at the basal body
  - statement: The HEK293 interaction experiment uses mouse Ahi1 in a human host-cell
      background.
    supporting_text: Since our mouse Ahi1 antibody cannot recognize human AHI1 in HEK293 cells,
      we used this cell line for testing whether Ahi1 and Rab8a form a complex.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full cached primary source explicitly uses mouse Ahi1 constructs, including
      in human HEK293 host cells. It directly establishes Rab8a stability/localization and
      selective vesicular-trafficking/ciliogenesis defects. Its ciliation results are
      context-specific, not proof that every Ahi1-null cell must lack cilia.
  full_text_unavailable: false
- id: PMID:19718039
  title: Impaired Wnt-beta-catenin signaling disrupts adult renal homeostasis and leads to
    cystic kidney ciliopathy.
  findings:
  - statement: GFP-Jouberin co-immunoprecipitates endogenous beta-catenin in 293T cells; this
      is complex association, not purified binary binding.
    supporting_text: We subjected 293T cells transfected with GFP-tagged Jbn to
      immunoprecipitation with a GFP-specific antibody followed by immunoblotting for
      endogenous β-catenin. This method revealed an interaction between β-catenin and GFP-Jbn
      but not GFP empty vector
  - statement: Jouberin alone does not activate the Wnt reporter in the tested cells.
    supporting_text: HEK293T cells transfected with this construct and Jbn alone did not show
      activation of the Wnt pathway, indicating that Jbn is not an activator of the pathway
  - statement: Ciliogenesis is preserved in the knockout contexts examined in this study.
    supporting_text: We therefore concluded that Jbn is not necessary for proper ciliogenesis,
      suggesting alternative mechanisms for the defects in these mice.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full cached Results support Jouberin–beta-catenin association, nuclear
      accumulation and potentiation of stimulated Wnt reporter/endogenous cyclin D1 expression.
      Cilia remain in the tested knockout contexts. Supplementary construct-species details
