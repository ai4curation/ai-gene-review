- term:
    id: GO:0050795
    label: regulation of behavior
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q8K3E5
  review:
    summary: >-
      A whole-animal behavioural phenotype of a mouse conditional knockout, transferred to
      a human protein with no behavioural data. The most distal of the four terms this one
      paper contributes.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Donor evidence is real - mouse Ahi1 holds GO:0050795 by IMP from PMID:20956301, where
      neuron-specific Ahi1 loss produces a depressive phenotype reversible by
      antidepressants or amygdalar TrkB overexpression.

      But the distance between the molecular event and the annotated process is the whole
      of neurobiology. The chain is: AHI1 loss, then reduced TrkB in brain, then altered
      TrkB signalling, then a behavioural readout in a mouse. Annotating a human protein as
      involved_in regulation of behavior on that basis conflates an organismal phenotype
      with a molecular process, and it is the same category error that makes disease
      phenotypes unsuitable as biological processes.

      Marked over-annotated rather than removed: an acts_upstream_of_or_within qualifier on
      the mouse row is a reasonable curation, and human AHI1 variants are genuinely
      associated with neuropsychiatric traits. What is not supportable is involved_in on
      the human protein.
