- term:
    id: GO:1904491
    label: protein localization to ciliary transition zone
  evidence_type: NAS
  original_reference_id: PMID:22179047
  qualifier: involved_in
  review:
    summary: >-
      A complex-level property distributed to every subunit. Fifteen entities hold this
      term from this one reference, all by NAS, with zero experimental support anywhere -
      and the knockouts in the cited paper were of other genes.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Queried by reference rather than by gene. PMID:22179047 supplies 211 annotations
      across 36 entities. GO:1904491 accounts for 15 of those entities and every single
      annotation is NAS from ComplexPortal - not one IDA, IMP or IGI, in any organism.
      The 15 are exactly ComplexPortal:CPX-2531 plus its 14 subunits, so this is the
      complex's own annotation copied onto each member, which is ComplexPortal's documented
      convention.

      The discriminator that separates a projection from parallel curation is whether the
      functional term spreads with the membership or stays on the perturbed gene, and here
      it spreads: the same reference's GO:0036038 MKS complex has 18 IDA annotations, so
      membership was measured, while this process term has none. The paper's own
      perturbations were knockouts of B9D1 and TMEM231 - Ahi1 was never mutated in it.
      Mouse Ahi1 does not carry GO:1904491 at all.

      There is no AHI1-specific evidence that AHI1 delivers or retains other proteins at
      the transition zone. The related, well-evidenced claims run in other directions:
      CBY1 is required to recruit AHI1 to the transition zone, and AHI1 is required for
      ARL13B and MCHR1 to reach the cilium - which is why GO:0061512 is proposed in place
      of GO:0008104 rather than this term being defended.

      Cross-checked against a sibling subunit rather than diverging silently. The merged
      human CC2D2A review on main ACCEPTs this same NAS row from this same reference - and
      that is correct for CC2D2A, because the evidence is not comparable. QuickGO returns
      three GO:1904491 annotations for human CC2D2A (Q9P2K1): IBA from GO_Central, IEA
      from Ensembl Compara, and the ComplexPortal NAS; its IBA/Compara chain reaches mouse
      Cc2d2a (Q8CFW7, Swiss-Prot, 1633 aa), which carries the term by IMP. Human AHI1
      returns exactly one annotation for GO:1904491 - the ComplexPortal NAS - and mouse
      and rat Ahi1 carry none at all. So the same row is redundant-but-supported on one
      subunit and unsupported on this one, and the two reviews differ on evidence rather
      than on method.

      Not removed: AHI1 is a genuine subunit of the complex that forms the barrier, so it
      plausibly contributes. Over-annotated because the annotation asserts a gene-level
      process on complex-level grounds with no experiment behind it.
    supported_by:
    - reference_id: PMID:22179047
      supporting_text: 'Mouse knockouts of B9D1'
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      - SOURCE_EVIDENCE_WEAK
