suggested_questions:
- question: >-
    Should the GO:0060271 IMP on human AHI1 be recoded, or re-referenced? PMID:21959375
    contains no human experiment - its mammalian work is siRNA against mouse Ahi1 in mouse
    IMCD3 cells, and its other system is zebrafish morpholinos. GOA already carries the
    species-correct encoding of the same mouse evidence as a GO:0060271 ISS row from
    UniProtKB:Q8K3E5. The internal tell is that the same curator gave GO:0034329 from this
    paper to mouse Ahi1 alone while giving GO:0060271 to mouse and human. PMID:23532844
    would support a genuine human IMP, since it measured ciliation in Joubert-patient
    fibroblasts.
  experts:
  - John A Sayer
  - Joseph G Gleeson
- question: >-
    Should ComplexPortal's complex-level GO:1904491 be projected onto all 14 MKS-complex
    subunits? Every one of the 15 annotations this reference supplies for that term is NAS;
    there is no experimental annotation for it in any organism, and the paper's own
    knockouts were of B9D1 and TMEM231. The membership term GO:0036038 from the same
    reference is backed by 18 IDA annotations, so the two should not be treated alike.
  experts:
  - Ben Chih
  - Andrew S Peterson
- question: >-
    Is AHI1 required for ciliogenesis, or only for ciliary cargo delivery? Two
    independently derived Ahi1-null mouse lines disagree - one reports 10% versus 57%
    ciliated MEFs, the other reports indistinguishable cilia and concludes the protein is
    dispensable - and the discrepancy has been attributed to strain background without
    being resolved. Human Joubert-patient fibroblasts fall on the "required" side.
  experts:
  - Madeline A Lancaster
  - Joseph G Gleeson
  - Ching-Hsien Hsiao
- question: >-
    Why has the jouberin-beta-catenin axis produced no GO annotation in any species? Three
    papers establish it, UniProt cites one of them at ECO:0000269 in both the FUNCTION and
    SUBUNIT blocks of the human entry, and QuickGO returns zero Wnt or beta-catenin
    annotations for human AHI1, mouse Ahi1 or rat Ahi1.

    Filling it needs two steps in order, because an ISS cannot point at a donor that lacks
    the term. Step one: annotate mouse Ahi1 (UniProtKB:Q8K3E5, MGI:87971) with GO:0090263
    by IMP from PMID:21623382, on the Ahi1-null x BATgal reporter cross, the reduced
    midline proliferation and the lithium rescue. Step two: the human GO:0090263 ISS row
    proposed here then has a valid WITH target. GO:0008013 beta-catenin binding is
    independent of that ordering and can be made directly on the human entry, since
    UniProt already records the interaction there at ECO:0000269.
  experts:
  - Madeline A Lancaster
  - Joseph G Gleeson
- question: >-
    Does GO:0002092 positive regulation of receptor internalization match what
    PMID:20956301 measured? The abstract describes degradation of TrkB that has already
    been endocytosed, which is post-endocytic sorting rather than internalization. The
    cached record is abstract-only, so a curator with the full text should check whether an
    internalization measurement supports the mouse IMP that the human ISS row transfers.
  experts:
  - Xin Xu
  - Xiao-Jiang Li
- question: >-
    Should a PAINT curator reconsider GO:0044458 motile cilium assembly at node
    PTN002893387? Its only non-node donor is zebrafish ahi1, whose evidence is one
    morpholino IMP in Kupffer's vesicle - a transient motile-cilium organ - while human and
    mouse AHI1 are annotated to non-motile cilium and UniProt describes the protein as
    required for formation of the primary non-motile cilium. The sibling IBA from the same
    node, GO:0036064, is well founded.
  experts:
  - Roslyn J Simms
  - John A Sayer
- question: >-
    Should endogenous human interaction data that GOA has never taken up be curated? AHI-1
    co-immunoprecipitates BCR-ABL from human K562 cells at endogenous levels with a
    BCR-ABL-negative control line, and AHI1 associates with OTUD1 and TYK2 in human A549
    cells and patient PBMCs. Neither appears in GOA for human AHI1.
