- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:25825872
  qualifier: enables
  supporting_entities:
  - UniProtKB:O43184
  review:
    summary: >-
      An in vitro SH3-domain phage-display hit against an ADAM12 peptide, never validated
      with full-length proteins or in cells, on a peptide the authors themselves show is
      promiscuous.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      O43184 resolves to ADA12_HUMAN, reviewed Swiss-Prot, 909 aa - so the partner
      identity is not the problem. The evidence is.

      What was assayed was the isolated AHI1 SH3 domain against the cytoplasmic tails of
      seven ADAM proteins in a phage-display library, plus recombinant GST-SH3 on peptide
      arrays. IntAct's only two records for this pair are "peptide array" and "phage
      display" - there is no cellular assay, no full-length AHI1, and no
      co-immunoprecipitation anywhere. In the same paper, only ADAM8 was taken forward to
      full-length proteins in cells; AHI1 was not.

      Three statements in the paper undercut the specificity of the hit. The ADAM12 site
      that all the strongest interactions converge on binds most SH3 domains tested,
      including ones ADAM12 never selected from the library. AHI1's SH3 is itself
      described as a generic Src-family-motif binder shared with several other domains.
      And the authors frame the biological relevance as an open question rather than a
      finding.

      Finally, QuickGO by reference shows PMID:25825872 supplying GO:0005515 to 24
      distinct entities in 48 annotations, all IPI from IntAct - the annotation footprint
      of a screen. Over-annotated rather than removed: the binding preference is real
      in vitro, it is simply not evidence of a cellular interaction.
    supported_by:
    - reference_id: PMID:25825872
      supporting_text: a preference for canonical motifs typical for SFK was shared by many
        SH3 domains, such as nephrocystin, AHI1, OSTF1, intersectin1(III), and Grb2(II).
