- term:
    id: GO:0007169
    label: cell surface receptor protein tyrosine kinase signaling pathway
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q8K3E5
  review:
    summary: >-
      Transfer of a neuronal TrkB phenotype from the mouse conditional knockout. Real but
      distal, tissue-restricted, and remote from AHI1's ciliary function.
    action: KEEP_AS_NON_CORE
    reason: >-
      The donor holds GO:0007169 by its own IMP from PMID:20956301, so the transfer is
      structurally sound. The finding is that neuron-specific Ahi1 loss lowers brain TrkB
      levels and reduces TrkB signalling.

      Non-core rather than over-annotated: AHI1 plausibly acts on receptor trafficking,
      and receptor-tyrosine-kinase signalling is the pathway that reads out. But the
      annotation describes a downstream consequence in one cell type of one species, and
      AHI1 is not itself a component of the RTK pathway. Note that four of this gene's ISS
      rows - GO:0002092, GO:0007169, GO:0045944 and GO:0050795 - all trace to this single
      mouse paper.

      Why this one is kept while two of its three siblings are marked over-annotated, since
      they share a donor and a paper. The line drawn is not "how far downstream" but
      "whether the annotated process is the one the protein's measured activity acts on."
      AHI1's established activity is controlling where membrane proteins end up - it is
      required for ARL13B and MCHR1 to reach the cilium and for RAB8A to be retained at the
      basal body. The measured defect here is the same kind of thing one step further out:
      endocytosed TrkB is degraded instead of being sorted onward, so receptor levels fall
      and signalling falls with them. Receptor trafficking is the protein's own business,
      so the pathway it feeds is a legitimate if generic involved_in.

      GO:0045944 and GO:0050795 are not one step further out, they are a different kind of
      claim. Transcription by RNA polymerase II is not a process AHI1 acts on - it has no
      DNA-binding or chromatin-associated domain, and nothing connects it to a promoter by
      this evidence chain. Regulation of behavior is an organismal readout scored on a
      mouse, several causal layers above any molecular property. Those assert AHI1 as a
      participant in machinery it does not touch; this row asserts it as an upstream
      contributor to machinery its own cargo-handling activity demonstrably feeds.

      GO:0002092, the fourth sibling, is held here too, but for a different reason - the
      concern there is that the term's direction may not match what was measured, and the
      cached record is abstract-only, so it is deferred to the curator rather than decided.
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      failure_modes:
      - CONTEXT_OR_TISSUE_MISMATCH
      source_entities:
