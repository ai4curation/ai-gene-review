id: Q8N157
gene_symbol: AHI1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'AHI1 encodes Jouberin, a multidomain protein containing WD40 repeats, an SH3 domain
  and an N-terminal interaction region. Jouberin concentrates at the distal mother centriole, ciliary
  basal body and transition zone, where it associates with the MKS complex and supports cilium formation
  and the localization of ciliary proteins. Its effects vary with cell type: loss can reduce ciliation
  or alter the composition and signaling of cilia that remain. Human Joubert-syndrome fibroblasts
  have reduced ciliation and reduced ciliary ARL13B, while animal models show defects in photoreceptor
  outer segments and receptor delivery to neuronal cilia.

  Jouberin interacts with nephrocystin-1, HAP1 and other partners and can self-associate; the precise
  native oligomeric stoichiometry is unresolved. It also has functions outside the ciliary base.
  Association with beta-catenin promotes beta-catenin nuclear accumulation and amplifies stimulated
  canonical Wnt signaling, while ciliary sequestration constrains this activity. In immune-cell models,
  Jouberin recruits the deubiquitinase OTUD1 to TYK2, maintaining TYK2 stability and type I interferon
  responsiveness. Biallelic pathogenic AHI1 variants cause Joubert syndrome, with variable retinal
  and renal involvement.'
