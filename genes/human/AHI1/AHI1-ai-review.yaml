core_functions:
- description: >-
    Structural subunit of the MKS (tectonic-like) transition-zone complex, held in a
    ring-shaped domain at the distal end of the mother centriole. Through this position
    AHI1 is required for primary cilia to form and for ciliary cargo to be delivered and
    retained: cells lacking it make fewer cilia, and the cilia they do make fail to
    accumulate ARL13B, while RAB8A is destabilised and lost from the basal body. The
    binding activities that place it there are its own - the WD40 beta-propeller binds
    nephrocystin-1 into a defined AHI1(2):NPHP1(2) heterotetramer, and the protein
    self-associates into dimers and tetramers.

    The molecular_function slot should be read as inferred by transfer, not as
    demonstrated at this location. The only bridging assay in the AHI1 literature -
    AHI1 holding OTUD1 against TYK2, with the reciprocal control - was done in mouse
    macrophages in an interferon pathway, and no experiment has tested whether AHI1 is
    required for any two transition-zone proteins to associate with each other. What is
    established at the ciliary base is the position, the partner binding and the
    requirement; the adaptor mechanism there is an extrapolation from a different
    compartment.
