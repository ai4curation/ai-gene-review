suggested_experiments:
- description: >-
    Build an isogenic AHI1-knockout human RPE1 line with doxycycline-inducible wild-type
    and Joubert-allele rescue, and score ciliation, cilium length, and ARL13B/ARL3/INPP5E
    ciliary content side by side. This settles the ciliogenesis-versus-cargo question on a
    single human genetic background and would convert most of this gene's ISS rows into
    human experimental annotations.
- description: >-
    Test AHI1 adaptor function where the protein actually works: measure pairwise
    association among MKS-module and NPHP-module transition-zone proteins in AHI1-knockout
    versus rescued cells, with the reciprocal control used in the OTUD1/TYK2 study - show
    that losing each partner does not abolish its own AHI1 binding. This would establish or
    refute GO:0030674 at the transition zone rather than by transfer from a macrophage
    pathway.
- description: >-
    Resolve the beta-catenin activity in human cells: a canonical Wnt reporter plus
    nuclear/cytoplasmic beta-catenin fractionation in isogenic AHI1-knockout HEK293 or RPE1
    cells, with and without Wnt3A, rescued by tagged human AHI1 and by the three
    nuclear-localisation-signal mutants. This supplies the human loss-of-function
    experiment the Wnt story has never had.
- description: >-
    Map the AHI1 interactome by proximity labelling from the ciliary base in human cells,
    comparing serum-starved (ciliated) and cycling states, and intersect with the existing
    BioID dataset that already places AHI1 near OFD1, PCM1, IQCB1 and SSX2IP. Partners that
    change with ciliation would distinguish the transition-zone scaffold pool from the
    cytoplasmic beta-catenin-carrier pool.
- description: >-
    Determine whether the AHI1 WD40 beta-propeller and the SH3 domain can be occupied
    simultaneously, by size-exclusion chromatography with multi-angle light scattering on
    purified AHI1 with NPHP1 and a DNM2 proline-rich peptide. Simultaneous occupancy is the
    minimal biophysical requirement for the scaffold model and has never been tested.
