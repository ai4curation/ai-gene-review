  review:
    summary: Ahi1 supports receptor internalization and subsequent TrkB sorting in neurons.
    action: KEEP_AS_NON_CORE
    reason: The mouse Q8K3E5 donor IMP traces to PMID:20956301 in the MGI comparative
      annotation snapshot. The primary full Results include a
      surface-crosslinking/internalization assay and reduced intracellular BDNF after Ahi1
      depletion, as well as accelerated degradation of internalized TrkB. Thus internalization
      was actually investigated. Retain the orthology inference as a neuronal trafficking
      context; the degradation assay alone would not establish internalization, and the
      phenotype is not evidence that AHI1 is itself an endocytic receptor.
