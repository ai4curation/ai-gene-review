- term:
    id: GO:0090263
    label: positive regulation of canonical Wnt signaling pathway
  evidence_type: ISS
  original_reference_id: PMID:21623382
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q8K3E5
  review:
    summary: >-
      Proposed as ISS, not IMP. Jouberin amplifies an already-activated canonical Wnt
      response by carrying beta-catenin into the nucleus; the in vivo demonstration is
      entirely in Ahi1-null mice.
    action: NEW
    reason: >-
      Deliberately coded ISS rather than IMP or IDA. The functional demonstrations are
      mouse: Ahi1-null embryos crossed to the BATgal Wnt reporter show reduced Wnt activity
      specifically at the cerebellar midline, with reduced proliferation there, and the
      phenotype is partially rescued by lithium. The cell-based evidence is a transfected
      reporter, and the species of the jouberin construct is not stated in either paper's
      accessible text. An experimental code would assert a human perturbation experiment
      that nobody performed.

      The claim must be stated at the right strength, because the neighbouring sentences
      qualify it in both papers. Jouberin is not a pathway activator: 293T cells expressing
      jouberin alone show no Wnt activation, and raising nuclear beta-catenin by jouberin
      overexpression is explicitly not sufficient to trigger a transcription response.
      What it does is amplify a response that Wnt3A or DVL1 has already initiated - a
      1.6-fold increase over vector in the reporter. GO:0090263's definition (increases the
      rate, frequency, or extent) accommodates an amplifier; a term implying initiation
      would not.

      Human-side support, short of an experimental code: all three Joubert disease alleles
      tested - human mutations in human numbering - failed to potentiate the reporter, which
      ties the activity to residues that cause human disease when lost. And the ciliary
      counterpart of the mechanism has been published separately: the cilium sequesters
      jouberin away from the nucleus, which is how a ciliopathy protein ends up regulating
      Wnt.

      Q8K3E5 is named as the supporting entity because the Ahi1-null mouse carries the
      functional demonstration, even though it holds no Wnt GO term itself - which is
      precisely the gap being filled.

      That makes this a two-step ask rather than a one-step one, and it should be
      implemented in order: mouse Ahi1 (UniProtKB:Q8K3E5, MGI:87971) should first receive
      GO:0090263 by IMP from PMID:21623382 - the BATgal reporter cross showing reduced Wnt
      activity at the cerebellar midline in Ahi1-null embryos, the reduced proliferation
      there, and the partial lithium rescue - and the human ISS row then follows from a
      donor that actually holds the term. A curator cannot make an ISS whose WITH target
      lacks the annotation, so proposing the human row alone would be unimplementable.
    supported_by:
    - reference_id: PMID:21623382
      supporting_text: Overexpression of wild-type Jbn in these cells resulted in a 1.6-fold
        increase in reporter activity over vector control
    - reference_id: PMID:21623382
      supporting_text: In contrast, none of the mutants exhibited significantly increased Wnt
        activity compared with control.
    - reference_id: PMID:19718039
      supporting_text: HEK293T cells transfected with this construct and Jbn alone did not
        show activation of the Wnt pathway, indicating that Jbn is not an activator of the
        pathway
- term:
    id: GO:0030674
    label: protein-macromolecule adaptor activity
  evidence_type: ISS
  original_reference_id: PMID:35821088
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q8K3E5
  review:
    summary: >-
      Proposed as ISS. AHI1 is universally described as a scaffold on the strength of its
      domain architecture; exactly one study has actually tested bridging, with the correct
      reciprocal control, and it did so in mouse macrophages.
    action: NEW
    reason: >-
      The term this gene most conspicuously lacks. Five GO:0005515 rows record that AHI1
      binds five partners through at least three separate surfaces - NPHP1 via the WD40
      repeats, HAP1 via residues 141-434, DNM2 via the SH3 domain - and none of them says
      what AHI1 does with those partners. "Scaffolding protein" appears throughout the
      literature purely as a presumption from domain content; in the RAB8A paper it is an
      introduction-level citation to somebody else's review, not a result.

      One study measured it properly. AHI1 holds the deubiquitinase OTUD1 against the kinase
      TYK2: the OTUD1-TYK2 association is abolished in AHI1-knockout macrophages, while the
      reciprocal control shows OTUD1 loss does not affect the AHI1-TYK2 association. That
      asymmetry is what distinguishes an adaptor from a ternary complex member, and it
      satisfies GO:0030674's definition of bringing two macromolecules together so they can
      act in a coordinated way.

      Coded ISS because the bridging assay was performed in peritoneal macrophages from
      Ahi1-null mice. The same paper's human material (A549 cells, patient PBMCs) supports
      only the binary AHI1-OTUD1 and AHI1-TYK2 interactions, not the dependency, and the
      species of its Myc-AHI1 plasmid is not stated.

      Two candidate bridging claims were checked and rejected. The AHI-1/BCR-ABL/JAK2
      complex is a genuine endogenous human co-immunoprecipitation, but the paper never
      tests whether BCR-ABL-JAK2 association requires AHI-1, and its own domain assignment
      is explicitly speculative - so it supports partner binding, not adaptor activity. The
      AHI1-RAB8A relationship is stabilisation and localisation, not bridging, and it was
      measured with mouse Ahi1.
    supported_by:
    - reference_id: PMID:35821088
      supporting_text: but affected the interaction between OTUD1 and Tyk2, as shown by the
        abolishment of the OTUD1-Tyk2 interaction upon AHI1 knockout in primary macrophages
    - reference_id: PMID:35821088
      supporting_text: However, OTUD1 deficiency did not strongly affect the AHI1-Tyk2 interaction
    - reference_id: PMID:23532844
      supporting_text: We determined that a smaller region of AHI1-F2, denoted as AHI1-F3 (141
    knowledge_gaps:
    - gap_statement: >-
        No adaptor function has been demonstrated for AHI1 at the ciliary transition zone,
        where it actually works - the only bridging test was done in a macrophage
        interferon pathway.
      boundary: >-
        Firmly established: AHI1 binds NPHP1, HAP1, DNM2, beta-catenin and itself through
        at least three distinct surfaces, and in mouse macrophages it is required for OTUD1
        to associate with TYK2. Absent: any test of whether AHI1 is required for two
        transition-zone proteins to associate with each other.
      gap_kind:
      - BIOLOGY
      dark_aspect: MF_DARK
      status: OPEN
      significance: >-
        AHI1 is the only MKS-complex subunit with both a WD40 beta-propeller and an SH3
        domain. If it bridges within the complex, it is a structural organiser; if not, its
        role there may be purely positional.
      resolution: >-
        Test pairwise association of transition-zone proteins - NPHP1 with MKS module
        members, or CEP290 with TMEM67 - in isogenic AHI1-knockout versus rescued human
        RPE1 cells, with the reciprocal control that loss of each partner does not abolish
        its AHI1 binding.
