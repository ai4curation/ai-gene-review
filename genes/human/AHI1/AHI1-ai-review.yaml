- term:
    id: GO:0016192
    label: vesicle-mediated transport
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q8K3E5
  review:
    summary: Vesicular trafficking is a supported component of AHI1 cargo-localization biology.
    action: ACCEPT
    reason: 'The mouse Q8K3E5 donor is grounded in PMID:19625297: cholera-toxin-B-positive vesicles
      fail to reach the Golgi efficiently and transferrin recycling is impaired after Ahi1 depletion.
      Vesicle formation and internalization are not globally absent. Together with Rab8a stabilization/localization
      and ciliary cargo phenotypes, these results support the broad transport process by orthology;
      the evidence spans routes and does not justify narrowing every assay to a single cargo.
      Vesicular cargo organization is part of the principal cellular role summarized in the
      ciliary/trafficking core; source-specific refinement of a separate opsin-localization
      annotation does not make this multi-route transport evidence non-core.'
    supported_by:
    - reference_id: PMID:19625297
      supporting_text: Whereas control cells recycled the Tf/TfR back to the plasma membrane
        after 60 min, Ahi1-knockdown cells accumulated Tf/TfR vesicles in the perinuclear
        region, indicating that vesicle recycling to the plasma membrane is disrupted
