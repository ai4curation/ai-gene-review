- term:
    id: GO:1904491
    label: protein localization to ciliary transition zone
  evidence_type: NAS
  original_reference_id: PMID:22179047
  qualifier: involved_in
  review:
    summary: Complex membership is established; AHI1-specific participation in maintaining
      proteins at the transition zone remains insufficiently resolved.
    action: UNDECIDED
    reason: GO:1904491 includes transport to or maintenance within the transition zone. The
      complex in PMID:22179047 has interdependent subunit localization, and Ahi1 is genuinely
      recovered as a member; therefore absence of an Ahi1 knockout in that paper is not by
      itself a reason to reject structural participation. However, the resolved AHI1-specific
      cargo experiments chiefly measure delivery into the ciliary membrane, not localization of
      other proteins within the transition zone. PMID:25103236 places Ahi1 downstream of Cby1
      recruitment, and the recovered full text of PMID:28118669 reports preserved
      Cc2d2a/Cep290 connecting-cilium localization in mutant zebrafish photoreceptors,
      although Cc2d2a signal intensity is reduced. Those
      contextual findings do not exclude other substrates or tissues. Retain uncertainty about
      this exact process rather than declaring the complex projection false. The full
      original NAS source and an AHI1-specific dependency for transition-zone recruitment
      remain incompletely resolved; the negative results for two proteins in one retinal
      model do not establish over-annotation across all transition-zone substrates.
    supported_by: []
