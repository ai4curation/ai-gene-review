id: P56856
gene_symbol: CLDN18
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'CLDN18 (claudin-18) is a tetraspan tight-junction protein of the claudin family: four transmembrane
  helices, two extracellular loops and cytoplasmic N- and C-termini, the latter ending in a PDZ-binding
  motif that engages ZO proteins. Two mutually exclusive first exons give tissue-restricted isoforms:
  CLDN18.1 (A1) in lung alveolar epithelium and CLDN18.2 (A2) in gastric mucosa; they differ in the first
  transmembrane segment and the first extracellular loop, the region recognized by the CLDN18.2-specific
  therapeutic antibody zolbetuximab, and CLDN18.2 is aberrantly expressed in gastric, pancreatic and other
  adenocarcinomas. As a structural component of tight-junction strands, claudin-18 seals the paracellular
  space: it is required for the alveolar epithelial barrier and alveolar fluid homeostasis and for the
  gastric barrier against acid. Its cytoplasmic tail also binds ZO-1/ZO-2 and phosphorylated YAP1, which
  links the junction to control of epithelial progenitor proliferation and organ size. Almost all human
  annotations are inferred from the well-studied mouse orthologue.'
