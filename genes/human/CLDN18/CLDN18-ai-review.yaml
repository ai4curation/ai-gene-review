    supporting_text: Interacts with YAP1 (phosphorylated); the
suggested_questions:
- question: How do the CLDN18.1 and CLDN18.2 first extracellular loops differ in trans-interaction partners
    and in ion/water selectivity of the strands they form?
- question: Is the YAP1-sequestering activity of the claudin-18 tail direct in human cells, and does loss
    of CLDN18.2 in gastric cancer contribute to tumour growth by releasing YAP1?
suggested_experiments:
- hypothesis: The two CLDN18 isoforms build strands with different paracellular selectivity because of
    their divergent first extracellular loop.
  description: Express each isoform, and loop-swapped chimeras, in claudin-deficient MDCK cells and measure
    transepithelial resistance and ion and small-solute permeability, with freeze-fracture or super-resolution
    imaging of strand architecture.
- hypothesis: Human CLDN18.2 directly retains phosphorylated YAP1 at the junction.
  description: Test the interaction in human gastric epithelial cells by co-immunoprecipitation and proximity
    ligation with and without the C-terminal tail, and quantify nuclear YAP1 and target gene expression
    on CLDN18 knockout and tail-deletion rescue.
