core_functions:
- description: 'Structural component of epithelial tight-junction strands: its four transmembrane helices
    and two extracellular loops polymerize in cis and interact in trans with claudins on the adjacent
    cell, sealing the paracellular space of lung alveolar (isoform A1) and gastric (isoform A2) epithelium
    and so controlling fluid and solute permeability.'
