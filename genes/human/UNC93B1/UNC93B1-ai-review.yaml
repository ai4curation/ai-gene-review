suggested_questions:
- question: Should a dedicated trafficking chaperone such as UNC93B1 be annotated as involved_in the
    downstream TLR signaling pathways it enables, or is acts_upstream_of / a protein-carrier +
    trafficking representation more accurate?
- question: What structural features of UNC93B1 determine its selectivity among TLR7, TLR9 and the
    cell-surface receptor TLR5, and how is the TLR9-over-TLR7 trafficking preference set?
- question: How does UNC93B1 balance enabling antimicrobial nucleic-acid sensing against restraining
    recognition of self nucleic acids, and how do disease-associated variants shift that balance?
- question: Should UNC93B1-dependent negative regulation of TLR7/TLR8 signalling (syntenin-1-mediated
    sorting of TLR7 into multivesicular bodies; gain-of-function lupus variants in negative regulatory
    regions, PMID:38780621, PMID:38869500) be represented with a negative-regulation process term, and
    is the same true for its reported attenuation of cGAS-STING signalling via lysosomal delivery of
    STING (PMID:35577759, single-laboratory report)?
suggested_experiments:
- description: Cryo-EM of UNC93B1 bound to TLR5 and to TLR9 to define the structural basis of its
    differential targeting to the plasma membrane versus endolysosomes
- description: Proximity-labeling proteomics (e.g. BioID/APEX) along the ER-to-endolysosome route to
    distinguish functional trafficking partners from high-throughput binary-interactome noise
- description: Separation-of-function UNC93B1 mutants that retain TLR binding but fail trafficking, to
    test whether receptor binding alone contributes to TLR signalling independent of delivery
