- id: PMID:35577759
  title: UNC93B1 attenuates the cGAS-STING signaling pathway by targeting STING for autophagy-lysosome degradation.
  findings:
  - statement: UNC93B1 interacts with STING and promotes its autophagy-lysosome degradation in a
      trafficking-dependent manner, attenuating cGAS-STING-induced IFN-beta responses.
    supporting_text: UNC93B1 interacts with STING and suppresses STING-activated downstream signaling by delivering STING to the lysosomes for degradation, depending on its trafficking capability
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only in cache (Europe PMC DOI lookup confirms PMID). Single-laboratory
      report, largely overexpression/HEK293T-based plus Unc93b1-/- macrophages; surfaced by the Falcon
      deep-research cross-check. Not used to add annotations; raised as a suggested question.
- id: PMID:38780621
  title: Large-scale mutational analysis identifies UNC93B1 variants that drive TLR-mediated autoimmunity in mice and humans.
  findings:
  - statement: Alanine-scanning of UNC93B1 identifies positive and negative regulatory regions for
      TLR3, TLR7 and TLR9; heterozygous human T93I and R336C variants in negative regulatory regions
      enhance TLR7/8 responses and cause autoimmune/inflammatory disease.
    supporting_text: identified both negative and positive regulatory regions affecting TLR3, TLR7,
      and TLR9 responses
    reference_section_type: ABSTRACT
  reference_review:
