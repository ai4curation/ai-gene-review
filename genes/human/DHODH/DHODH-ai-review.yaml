core_functions:
- description: Mitochondrial inner-membrane flavoenzyme that oxidizes dihydroorotate to orotate, performing
    an upstream catalytic step in de novo UMP and UDP biosynthesis. Bound FMN receives electrons from the
    substrate and transfers them to ubiquinone, linking pyrimidine synthesis to the mitochondrial quinone
    pool. The experimental mouse tracer endpoint is UMP; inclusion of the established UDP pathway assertion
    does not assign UMP-to-UDP kinase activity to DHODH.
  molecular_function:
    id: GO:0106430
    label: dihydroorotate dehydrogenase (quinone) activity
  directly_involved_in:
  - id: GO:0044205
    label: '''de novo'' UMP biosynthetic process'
  - id: GO:0006225
    label: UDP biosynthetic process
  locations:
  - id: GO:0005743
    label: mitochondrial inner membrane
  supported_by:
  - reference_id: PMID:8925840
  - reference_id: PMID:10673429
  - reference_id: PMID:10727948
    supporting_text: DHODH is an integral membrane protein exposed to the intermembrane space
  - reference_id: Reactome:R-HSA-73569
  - reference_id: PMID:30449682
proposed_new_terms: []
suggested_questions:
- question: Which human cellular contexts show a DHODH-dependent ferroptosis-protective contribution after
    separating quinone metabolism from direct FSP1 inhibition by drugs?
- question: Do the verified TTPA and RNF19B-fragment associations occur with native DHODH in a shared
    physiological compartment, and what function do they serve?
- question: What original donor experiment generated the historical mouse dihydroorotase assertion transferred
    to human DHODH?
suggested_experiments:
- description: Compare matched DHODH genetic loss/rescue and chemically distinct inhibitors across defined
    ferroptosis conditions while measuring FSP1 inhibition, quinone redox state and pyrimidine rescue.
