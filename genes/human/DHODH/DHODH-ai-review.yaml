    label: dihydroorotase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  review:
    summary: Reject the electronic dihydroorotase assignment on reaction and target-family evidence.
    action: REMOVE
    reason: GO:0004151 describes hydrolytic opening of dihydroorotate to carbamoyl-aspartate (EC 3.5.2.3),
      whereas human DHODH catalyses quinone-dependent oxidation to orotate. The target matches class-2 DHODH
      IPR005719 at residues 39–394 and its catalytic domain IPR005720 at 77–377; human enzyme kinetics and
      structures establish the FMN/quinone mechanism. This is incompatible with transferring the separate
      zinc-dependent dihydroorotase function, represented in human CAD by its DHOase-family machinery. The
      combined reaction, domain and structural evidence supports removal of this electronic inference without
      demanding experimental exclusion of every hypothetical secondary activity. The historical mouse donor
      record no longer has this term in the complete 2026-10-17 12:34:11 UTC snapshot, but the exact cause
      of the historical transfer remains untraced; no name-confusion or wrong-paralog claim is made.
    supported_by:
    - reference_id: PMID:8925840
    - reference_id: PMID:10673429
    - reference_id: file:human/DHODH/DHODH-uniprot.txt
    - reference_id: file:human/DHODH/DHODH-evidence-guide.md
