        comment: The dihydroorotase assertion is absent from the complete mouse O35435 GOA snapshot completed
          2026-10-17 12:34:11 UTC. The historical donor experiment is untraced. This provenance limit is distinct
          from the target reaction/domain evidence that supports REMOVE.
