id: Q02127
gene_symbol: DHODH
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: DHODH is a mitochondrial, FMN-dependent class-2 enzyme that oxidizes (S)-dihydroorotate to orotate using
    ubiquinone as electron acceptor. This catalytic step links de novo pyrimidine synthesis to the mitochondrial
    quinone pool. The protein associates with the inner mitochondrial membrane, with its catalytic domain
    facing the intermembrane space. FMN and quinone binding are components of the same catalytic mechanism.
    DHODH-dependent quinone reduction has also been investigated in ferroptosis defence, with contributions
    that depend on experimental context and remain contested in relation to inhibitor specificity. Biallelic
    DHODH variants cause Miller syndrome.
