  review:
    summary: TET1 contains zinc-chelating CXXC and Cys-rich domains.
    action: ACCEPT
    reason: 'The CXXC domain carried by vertebrate TET1 is a binuclear zinc-chelating DNA-binding fold,
      so the InterPro zinc-ion-binding inference and the CXXC-domain IDA row are both compatible with
      the protein architecture rather than with the Fe(II)/2-oxoglutarate catalytic cofactor.'
    supported_by:
