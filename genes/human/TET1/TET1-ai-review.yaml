suggested_questions:
- question: Which TET1 recruitment partners determine where its catalytic core oxidizes 5mC in endogenous
    human cell types?
suggested_experiments:
- description: Rescue a TET1-null human cell model with catalytic-dead and recruitment-defective alleles,
    then map 5hmC/5fC/5caC and nascent transcription to separate direct demethylation effects from downstream
    expression changes.
