  - UniProtKB:Q8NFU7
  review:
    summary: TET1 can regulate RNA polymerase II transcription through chromatin demethylation, but
      the process is downstream of its catalytic activity.
    action: KEEP_AS_NON_CORE
    reason: TET1-driven 5mC oxidation can change DNA demethylation and subsequent gene expression,
      supporting this transcriptional-regulation context. The row is kept as non-core because TET1
      does not act on RNA polymerase II directly; its conserved molecular function is chromosomal
      DNA 5mC oxidation.
    supported_by:
    - reference_id: PMID:21496894
      supporting_text: TET1, by converting 5mCs to 5-hydroxymethylcytosines (5hmCs), promotes DNA
        demethylation in mammalian cells
