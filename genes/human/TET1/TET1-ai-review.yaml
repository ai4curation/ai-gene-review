- id: PMID:19372391
  title: Conversion of 5-methylcytosine to 5-hydroxymethylcytosine in mammalian DNA by MLL partner
    TET1.
  findings:
  - statement: Purified human TET1 catalytic domain converts 5mC in double-stranded DNA to 5hmC in a
      Fe(II)- and 2-oxoglutarate-dependent reaction.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary paper establishing human TET1 as a DNA 5mC dioxygenase; used for
      catalytic, iron-binding, DNA-binding, and nuclear-function support.
- id: PMID:21496894
  title: Hydroxylation of 5-methylcytosine by TET1 promotes active DNA demethylation in the adult
    brain.
  findings:
  - statement: TET1 converts 5mC to 5hmC and promotes active DNA demethylation coupled to
      gene-expression changes.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct TET1 demethylation paper; the cache is abstract-only, but the abstract
      supports the TET1 5mC oxidation and expression-regulation rows used here.
- id: PMID:22865885
  title: Family with sequence similarity 60A (FAM60A) protein is a cell cycle-fluctuating regulator
    of the SIN3-HDAC1 histone deacetylase complex.
  findings:
  - statement: FAM60A is a cell-cycle-regulated SIN3-HDAC complex subunit that influences gene
      expression.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Background for the SIN3/FAM60A complex context; it does not by itself establish a
      TET1 core function.
- id: PMID:22984288
  title: 'Human family with sequence similarity 60 member A (FAM60A) protein: a new subunit of the Sin3
    deacetylase complex.'
  findings:
  - statement: FAM60A is a SIN3 deacetylase-complex subunit whose depletion changes TGF-beta
      signaling gene expression and cell migration.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Supports the SIN3 complex context only indirectly; the cell-migration and TGF-beta
      signaling effects are treated as over-annotations for TET1.
- id: PMID:25284789
  title: 5-Hydroxymethylcytosine plays a critical role in glioblastomagenesis by recruiting the
    CHTOP-methylosome complex.
  findings:
  - statement: TET1-mediated 5hmC promotes glioblastoma-cell tumorigenicity by recruiting
      CHTOP-methylosome machinery.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Direct TET1/5hmC chromatin-effector paper in glioblastoma; useful for a
      disease-cell context but not for making chromatin remodeling a TET1 core process.
- id: PMID:27251462
  title: OGG1 is essential in oxidative stress induced DNA demethylation.
  findings:
  - statement: TET1 and OGG1 participate in oxidative-stress-induced DNA demethylation.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only direct TET1 stress-demethylation paper; supports keeping the
      oxidative-stress response row as a non-core context.
- id: PMID:28554894
  title: Fam60a defines a variant Sin3a-Hdac complex in embryonic stem cells required for
    self-renewal.
  findings:
  - statement: In embryonic stem cells, a FAM60A-defined SIN3A-HDAC complex contains TET1 and OGT
      and is required for self-renewal.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Supports TET1 association with a SIN3A-HDAC regulatory complex in ES cells, while
      self-renewal outcomes remain downstream and non-core.
- id: PMID:29276034
  title: DNA Sequence Recognition of Human CXXC Domains and Their Structural Determinants.
  findings:
  - statement: The human CXXC-domain study systematically compared DNA-binding selectivities of CXXC
      domains, but the cached abstract does not state the TET1 or TET3 methyl-CpG preferences.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only structural genomics paper. It should not be used alone to replace
      TET1 or TET3 curator methyl-CpG rows with unmethylated CpG binding.
- id: PMID:33833093
  title: QSER1 protects DNA methylation valleys from de novo methylation.
  findings:
  - statement: QSER1 works with TET1 to protect DNA methylation valleys from de novo methylation.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct TET1/QSER1 chromatin paper that supports chromosomal localization and
      TET1-dependent protection of methylation valleys.
- id: PMID:34667079
  title: PROSER1 mediates TET2 O-GlcNAcylation to regulate DNA demethylation on UTX-dependent
    enhancers and CpG islands.
  findings:
  - statement: PROSER1 bridges UTX, OGT, and TET enzymes at enhancers and CpG islands and promotes
      TET2 O-GlcNAcylation.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Chromatin-regulator interactome paper; useful for OGT/PROSER1 context and the bare
      protein-binding rows are removed per policy.
- id: PMID:36056023
  title: Isoform-specific and ubiquitination dependent recruitment of Tet1 to replicating
    heterochromatin modulates methylcytosine oxidation.
  findings:
  - statement: A short catalytically active TET1 isoform is recruited to replicating heterochromatin
      and can oxidize 5mC there.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct localization and activity paper for human TET1 isoforms.
