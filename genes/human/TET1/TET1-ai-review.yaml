id: Q8NFU7
gene_symbol: TET1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: TET1 is a nuclear methylcytosine dioxygenase that uses Fe(II) and 2-oxoglutarate to
  iteratively oxidize 5-methylcytosine in genomic DNA to 5-hydroxymethylcytosine, 5-formylcytosine,
  and 5-carboxylcytosine. Its N-terminal CXXC zinc finger contributes CpG-DNA targeting, while its
  catalytic cysteine-rich and double-stranded beta-helix domains execute 5mC oxidation on chromatin.
  TET1 thereby participates in active DNA demethylation, CpG-island protection, and context-specific
  activation or repression of transcription through DNA modification and recruitment of
  chromatin-regulatory complexes.
