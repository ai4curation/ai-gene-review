    label: ATPase-coupled monoatomic cation transmembrane transporter activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: P5A ATPases retain a P-type transport cycle but have a protein-helix substrate pocket
      distinct from characterized ion pumps.
    action: MODIFY
    reason: The original GOA WITH/FROM traces this assertion to PTN001944130. The current PTHR45630
      PAINT slice retains transport/dislocase annotations but lacks these old ion-activity assertions.
      More importantly, PMID:32973005 directly demonstrates ATP13A1-dependent helix extraction
      and identifies a large membrane-accessible Spf1 pocket lacking the metal-coordination geometry
      expected for ion pumping. This is mechanistic evidence against the assigned substrate, not
      merely discovery of a preferred alternative activity. Replace with the experimentally established
      dislocase function; version drift alone does not prove why PAINT changed.
    proposed_replacement_terms:
    - id: GO:0140567
      label: membrane protein dislocase activity
    propagation_review:
      root_cause: UNRESOLVED
      source_entities:
      - source_id: PANTHER:PTN001944130
