id: Q9HD20
gene_symbol: ATP13A1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ATP13A1 is a multipass endoplasmic-reticulum membrane P5A-type ATPase that uses
  an ATP-driven phosphorylated-aspartate cycle to dislocate transmembrane helices. It extracts
  mistargeted mitochondrial tail-anchored proteins and corrects the orientation of selected
  ER membrane proteins and atypical signal sequences, allowing folding-competent clients to
  escape degradation and complete productive membrane insertion or translocation. Demonstrated
  contexts include ABCG2 topogenesis and delivery of corrected signal-sequence substrates to
  SEC61. Its membrane-protein biogenesis function also influences organelle protein composition
  and ion homeostasis; structural and biochemical studies favor polypeptide transport over direct
  inorganic-cation pumping.

