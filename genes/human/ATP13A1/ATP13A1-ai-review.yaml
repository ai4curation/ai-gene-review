        source_status: SOURCE_STALE_OR_MISSING
        comment: Original GOA node recovered directly. The current family slice lacks the old
          ion activity; structural and biochemical evidence, rather than disappearance alone,
          supports correcting substrate scope.
    supported_by:
    - reference_id: PMID:32973005
