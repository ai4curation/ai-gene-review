- term:
    id: GO:0000710
    label: meiotic mismatch repair
  evidence_type: IDA
  original_reference_id: PMID:16873062
  qualifier: involved_in
  review:
    summary: PMID:16873062 supports somatic MutLalpha mismatch repair, not meiotic mismatch repair.
    action: MODIFY
    reason: The cited paper reconstitutes somatic nick-directed mismatch repair by human MutLalpha.
      PMS2 has independent meiotic roles, but this Complex Portal row should use the parent mismatch
      repair term rather than GO:0000710 meiotic mismatch repair.
    supported_by:
    - &id001
      reference_id: PMID:16873062
      supporting_text: 'We show that human

        MutLalpha is a latent endonuclease that is activated in a mismatch-, MutSalpha-,

        RFC-, PCNA-, and ATP-dependent manner.'
    proposed_replacement_terms:
    - id: GO:0006298
      label: mismatch repair
    source_defects:
    - defect_type: WRONG_TERM
      resource: COMPLEX_PORTAL
      slot: GO_ID
      requested_change: REPOINT
      asserted_value: GO:0000710
      corrected_value: GO:0006298
      corrected_label: mismatch repair
      cause: CONTEXT_NOT_ASSAYED
      confidence: CONFIRMED
      explanation: PMID:16873062 reconstitutes somatic human MLH1-PMS2 MutLalpha
        endonuclease-dependent mismatch repair. It supports GO:0006298 mismatch repair for the
        MLH1-PMS2 complex, not the meiotic mismatch repair term.
      supported_by:
      - reference_id: PMID:16873062
        supporting_text: "We show that human\nMutLalpha is a latent endonuclease that is activated in
          a mismatch-, MutSalpha-,\nRFC-, PCNA-, and ATP-dependent manner."
- term:
    id: GO:0003677
    label: DNA binding
  evidence_type: IDA
  original_reference_id: PMID:10871409
  qualifier: enables
  review:
    summary: PMID:10871409 supports PMS2-dependent repair but not direct PMS2 DNA binding.
    action: KEEP_AS_NON_CORE
    reason: PMS2 participates in DNA-bound MutLalpha and has a separate non-core single-stranded
      DNA-binding row, so the parent DNA binding claim is biologically plausible; the defect is that
      PMID:10871409 is a cellular PMS2-deficiency study rather than a direct binding assay.
    supported_by:
    - reference_id: PMID:11574484
      supporting_text: The monomeric form of NhPMS2 is active both in ATP hydrolysis and DNA
        binding.
    source_defects:
    - defect_type: WRONG_REFERENCE
      resource: HGNC_UCL
      slot: DB:Reference
      requested_change: CHECK
      asserted_value: PMID:10871409
      cause: SPECULATION_AS_ASSERTION
      confidence: CONFIRMED
      explanation: PMID:10871409 shows that PMS2-deficient HeLa variants fail mismatch repair and
        acquire a mutator phenotype, but it does not assay direct PMS2 DNA binding. Please re-check
        the reference supporting the GO:0003677 row or retire the row if no direct binding assay was
        used.
