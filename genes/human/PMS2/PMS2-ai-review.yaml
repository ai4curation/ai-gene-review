        DQHA(X)(2)E(X)(4)E motif.'
    - &id003
      reference_id: PMID:16143102
      supporting_text: 'The reconstituted system includes MutSalpha or

        MutSbeta, MutLalpha, RPA, EXO1, HMGB1, PCNA, RFC, polymerase delta, and ligase

        I.'
