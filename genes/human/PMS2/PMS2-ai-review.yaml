id: P54278
gene_symbol: PMS2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: PMS2 is the catalytic endonuclease subunit of the nuclear MLH1-PMS2 MutLalpha
  heterodimer. During post-replicative mismatch repair, MutSalpha or MutSbeta recruits MutLalpha to
  mismatched DNA, and the conserved PMS2 DQHA(X)2E(X)4E metal-binding motif incises the daughter
  strand to initiate excision and repair synthesis.
