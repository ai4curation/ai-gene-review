  - UniProtKB:O76050
  review:
    summary: >-
      Regulation of Notch signaling via ligand ubiquitination (PTN000276953; Drosophila neur).
    action: ACCEPT
    reason: >-
      The IBA reflects the conserved Neuralized function in ligand endocytosis. In mammals
      the effect is modest/redundant with MIB1, and human data show NEURL1 reduces JAG1 and
      Notch target expression; the direction-neutral term is appropriate.
    supported_by:
    - reference_id: file:human/NEURL1/NEURL1-uniprot.txt
      supporting_text: >-
        Can function as an E3 ubiquitin-protein ligase to activate monoubiquitination of JAG1
        (in vitro), thereby regulating the Notch pathway.
    - reference_id: PMID:20847082
      supporting_text: >-
        Notch pathway inhibition occurred on the exogenous expression of NEURL1, as shown
        by decreased expression of the Notch ligand, Jagged1, and the target genes, HES1 and
        HEY1.
    - reference_id: PMID:20847082
      supporting_text: >-
        Neuralized (Neurl) is a highly conserved E3 ubiquitin ligase, which in Drosophila
        acts upon Notch ligands to regulate Notch pathway signaling.
