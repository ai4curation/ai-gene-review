id: O76050
gene_symbol: NEURL1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  NEURL1 (Neuralized E3 ubiquitin protein ligase 1) is the human ortholog of Drosophila Neuralized,
  a RING-type E3 ubiquitin-protein ligase (EC 2.3.2.27) with two Neuralized homology repeat
  (NHR) domains that bind substrates and a C-terminal RING domain. Like Drosophila Neur, it
  can bind and monoubiquitinate Notch ligands (JAG1, DLL1) and associates with the plasma
  membrane via N-terminal myristoylation; in mammals, however, MIB1 rather than NEURL1 is
  the dominant ligand E3. Ectopic NEURL1 reduces JAG1 levels and Notch target expression in
  medulloblastoma cells, where it behaves as a candidate tumor suppressor. In neurons, NEURL1
  localizes to perikarya, apical dendrites and postsynaptic densities, where it ubiquitinates
  the translational regulator CPEB3, promoting GRIA1/GRIA2 translation, spine formation and
  hippocampal synaptic plasticity and memory.
