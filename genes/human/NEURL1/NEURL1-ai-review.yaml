core_functions:
- description: >-
    RING E3 ubiquitin ligase of the Neuralized family that monoubiquitinates Notch ligand
    cytoplasmic tails (JAG1) at the plasma membrane, modulating ligand levels/endocytosis
    and thereby Notch signaling; minor/redundant with MIB1 in mammals.
  molecular_function:
    id: GO:0061630
    label: ubiquitin protein ligase activity
  directly_involved_in:
  - id: GO:0006513
    label: protein monoubiquitination
  - id: GO:0008593
    label: regulation of Notch signaling pathway
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: file:human/NEURL1/NEURL1-deep-research-falcon.md
    supporting_text: >-
      NEURL1 functions redundantly with its paralog NEURL2, such that single knockout of either
      gene does not produce overt memory deficits
  - reference_id: file:human/NEURL1/NEURL1-uniprot.txt
    supporting_text: >-
      Can function as an E3 ubiquitin-protein ligase to activate monoubiquitination of JAG1
      (in vitro), thereby regulating the Notch pathway.
  - reference_id: PMID:20847082
    supporting_text: >-
      Notch pathway inhibition occurred on the exogenous expression of NEURL1, as shown by
      decreased expression of the Notch ligand, Jagged1, and the target genes, HES1 and HEY1.
  - reference_id: PMID:20847082
    supporting_text: >-
      In NEURL1-expressing cells, the 2 proteins appear to colocalize mostly in fine intracellular
      punctate staining and few distinct punctate clusters at the cell membrane.
- description: >-
    In hippocampal neurons (mouse), ubiquitinates CPEB3 to derepress GRIA1/GRIA2 translation,
    promoting spine formation and long-term synaptic plasticity.
  molecular_function:
    id: GO:0061630
    label: ubiquitin protein ligase activity
  directly_involved_in:
  - id: GO:0048170
    label: positive regulation of long-term neuronal synaptic plasticity
  locations:
  - id: GO:0014069
    label: postsynaptic density
  supported_by:
  - reference_id: file:human/NEURL1/NEURL1-uniprot.txt
    supporting_text: >-
      Promotes ubiquitination of CPEB3, and hence induces CPEB3-dependent mRNA translation
      activation of glutamate receptor GRIA1 and GRIA2.
  - reference_id: file:human/NEURL1/NEURL1-uniprot.txt
    supporting_text: >-
      Plays a role in hippocampal-dependent synaptic plasticity, learning and memory.
proposed_new_terms: []
suggested_questions:
- question: >-
    Does endogenous human NEURL1 contribute measurably to Notch ligand ubiquitination in any
    tissue, or is its Notch role fully redundant with MIB1?
- question: >-
    Does NEURL1 promote or inhibit ligand signaling activity (endocytosis-driven activation
    versus degradation of JAG1) in human cells?
suggested_experiments:
- description: >-
    Compare ligand ubiquitination and sender activity in MIB1-knockout human cells with and
    without NEURL1/NEURL1B re-expression.
