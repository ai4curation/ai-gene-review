- id: PMID:20847082
  title: Neuralized1 causes apoptosis and downregulates Notch target genes in medulloblastoma.
  findings:
  - statement: >-
      NEURL1 expression reduces JAG1 and HES1/HEY1 and induces apoptosis in medulloblastoma
      cells.
    supporting_text: >-
      Notch pathway inhibition occurred on the exogenous expression of NEURL1, as shown by
      decreased expression of the Notch ligand, Jagged1, and the target genes, HES1 and HEY1.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Main human functional study; overexpression-based.
