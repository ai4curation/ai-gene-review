    reason: PDIA4 is a classic UPR-inducible ER foldase, strongly up-regulated when misfolded disulfide-bonded proteins accumulate (e.g. mutant matrilin-3 models), and it acts on those misfolded clients. The IBA is reasonable at the family level, but the term mostly reflects stress-inducible expression and folding capacity rather than a distinct signalling role; non-core.
    supported_by:
    - reference_id: PMID:23956175
      supporting_text: Interestingly, of the 20 most significantly up-regulated genes, three were members of the PDIA protein family, namely Pdia3/Erp57, Pdia4/Erp72 and Pdia6/P5
