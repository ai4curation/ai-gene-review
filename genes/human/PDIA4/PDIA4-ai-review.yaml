id: P13667
gene_symbol: PDIA4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: PDIA4 (ERp72) is a soluble protein disulfide isomerase family member of the endoplasmic reticulum lumen. The mature protein has five thioredoxin-like domains arranged a0-a-b-b'-a', of which the a0, a and a' domains carry CGHC redox-active sites, an acidic N-terminal stretch, and a C-terminal KEEL ER-retention signal. It catalyses thiol-disulfide exchange reactions (oxidation, reduction and isomerization of disulfide bonds) on client proteins, assisting the oxidative folding of a relatively narrow set of secretory proteins, binding misfolded disulfide-containing proteins such as mutant matrilin-3, and favouring ER retention of misfolded substrates. It associates with other ER chaperones and foldases, including cyclophilin B, with which it accelerates immunoglobulin folding, but unlike ERp57 it does not bind calnexin. PDIA4 is induced by ER stress. A fraction is released from platelets and relocates to the activated platelet surface, where its a and a' active sites support platelet
  aggregation and thrombosis. It is also a host factor for human astrovirus genome uncoating.
