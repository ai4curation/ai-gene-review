    reason: The paper showed that deleting KEEL causes ERp72 itself to be secreted, i.e. ERp72 was the cargo whose secretion was measured, and its retention depends on the KDEL-receptor system. This does not show that ERp72 performs any step of protein secretion. The function of the KEEL motif is retention, not secretion.
