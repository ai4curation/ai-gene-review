core_functions:
- description: 'Thiol-disulfide oxidoreductase/isomerase of the ER lumen: the three CGHC active sites (a0, a, a'') catalyse formation, reduction and rearrangement of disulfide bonds in client proteins. Human biochemistry establishes the thiol-disulfide oxidase chemistry; isomerase activity in human rests on subfamily orthology (PTHR18929:SF210) with experimentally characterised mouse/rat ERp72.'
