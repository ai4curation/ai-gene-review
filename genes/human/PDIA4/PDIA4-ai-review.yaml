suggested_questions:
- question: Which endogenous human client proteins depend specifically on ERp72, given its narrow substrate specificity and lack of calnexin binding?
- question: Should human PDIA4 carry a platelet-function process term? Mouse Pdia4 has acts_upstream_of_or_within IMP annotations to platelet aggregation and blood coagulation (PMID:28576878) that PAINT did not propagate; is the integrin alphaIIb-beta3 thiol modification a direct catalytic step that would justify involved_in?
- question: Is the ER chaperone multiprotein complex membership (GO:0034663; mouse IDA) also established for human PDIA4?
suggested_experiments:
- description: Substrate-trapping (CXXA) ERp72 proteomics in human secretory cells (e.g. hepatocytes, plasma cells) to define its specific clients.
- description: Direct disulfide isomerization assays (e.g. scrambled RNase A refolding) on purified human ERp72 and single active-site mutants to establish isomerase activity in the human protein.
