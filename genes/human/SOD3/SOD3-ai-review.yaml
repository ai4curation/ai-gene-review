id: P08294
gene_symbol: SOD3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'SOD3 encodes extracellular Cu/Zn superoxide dismutase, a secreted glycoprotein
  that assembles as a homotetramer and dismutates superoxide in the extracellular matrix and
  other extracellular spaces. It binds copper and zinc at a SOD1-like active site, is copper-loaded
  in the secretory pathway by ATOX1 and ATP7A-dependent trafficking, and can be retained on
  heparan sulfate proteoglycans or stored in vesicles of inflammatory cells for acute release.'
