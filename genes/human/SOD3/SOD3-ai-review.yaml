suggested_questions:
- question: Which human inflammatory-cell storage vesicle releases catalytically active
    SOD3 after LPS stimulation?
  experts:
  - Petersen SV
suggested_experiments:
- hypothesis: Macrophage-stored SOD3 controls the acute LPS cytokine profile through
    extracellular superoxide removal rather than through a noncatalytic binding role.
  description: Rescue SOD3-null human macrophages with catalytic-site and ECM-binding
    mutants, then measure vesicular storage, stimulated release, extracellular
    superoxide, nitric-oxide preservation, and early cytokine induction.
  experiment_type: structure-function rescue in human macrophages
