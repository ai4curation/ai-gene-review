  qualifier: involved_in
  review:
    summary: Macrophage vesicular SOD3 modulates acute inflammatory signaling.
    action: KEEP_AS_NON_CORE
    reason: Human macrophages can acutely release stored SOD3 after LPS stimulation,
      affecting the LPS-induced inflammatory profile. This is a real but
      context-specific role downstream of extracellular SOD activity.
    supported_by:
    - reference_id: PMID:31326693
      supporting_text: human macrophages release SOD3 from an intracellular compartment
        within 30 min following LPS stimulation
