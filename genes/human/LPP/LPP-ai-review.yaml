  full_text_unavailable: true
  findings:
  - statement: Palladin binds the first two LPP LIM domains through its N terminus in yeast-two-hybrid, in-vitro, and cellular assays.
    supporting_text: The palladin interacting region of LPP was mapped to the first and second LIM domains. The N-terminus of palladin interacted with LPP both in vitro and in vivo, but not solely through its FPLPPP and FPPPP motifs.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: LPP and palladin promote smooth-muscle-cell migration and spreading, with expression responsive to FAK, PRX1, angiotensin II, actin dynamics, and vascular injury.
    supporting_text: Both LPP and palladin enhanced cell migration and spreading.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified primary palladin-interaction and smooth-muscle migration study; accessible cache is abstract only.
- id: PMID:18511849
  title: Smooth muscle expression of lipoma preferred partner is mediated by an alternative intronic promoter that is regulated by serum response factor/myocardin.
  full_text_unavailable: true
  findings:
  - statement: An intron-2 alternative promoter drives smooth-muscle-enriched LPP transcription and is directly regulated by SRF/myocardin.
    supporting_text: Quantitative RT-PCR shows that this alternative promoter directs transcription specifically to smooth muscle containing tissues in vivo.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: The alternative promoter is transcriptionally active in an SRF/myocardin- and CArG-box-dependent reporter assay.
    supporting_text: In reporter experiments, we show that the alternative promoter has transcriptional capacity that is dependent on SRF/myocardin and that the promoter associated CArG box is required for that activity.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified promoter-regulation study; it supports transcript regulation, not a distinct protein isoform function.
- id: PMID:19205907
  title: Mechanical properties of the extracellular matrix alter expression of smooth muscle protein LPP and its partner palladin; relationship to early atherosclerosis and vascular injury.
  findings:
  - statement: Rat R518 aortic smooth-muscle cells on denatured collagen or a rigid substrate up-regulate LPP and palladin together with pFAK and robust stress fibers.
    supporting_text: SMCs cultured on denatured collagen or on a rigid substrate, up regulated expression of LPP, its partner palladin, tenascin C (TN-C), phosphorylated focal adhesion kinase (pFAK) and exhibited robust stress fibers.
    reference_section_type: ABSTRACT
  - statement: LPP/palladin abundance is context-dependent across rat R518 substrate and oxidative-stress assays, human HIVS-125 endothelial/smooth-muscle co-culture flow, ApoE-null mouse atherosclerosis, and Sprague-Dawley rat vascular injury.
    supporting_text: In conclusion, expression of LPP and palladin are modulated by a mix of mechanical cues, oxidative stress and substrate composition which translate into their up or down regulation in vessel wall injury and early atherogenesis.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full-text primary mixed-species mechanobiology study. Rigidity/collagen and oxidative-stress assays used rat R518 aortic smooth-muscle cells; flow used human endothelial cells with HIVS-125 smooth-muscle cells; arterial injury used Sprague-Dawley rats; atherosclerosis used ApoE-null mice.
- id: PMID:21423176
  title: Analysis of the myosin-II-responsive focal adhesion proteome reveals a role
    for β-Pix in negative regulation of focal adhesion maturation.
  findings:
  - statement: The seeded HDA source is a broad human fibroblast focal-adhesion proteomics dataset in which protein abundance was compared with and without myosin-II inhibition.
    supporting_text: We identified 905 focal adhesion proteins, 459 of which changed in abundance with myosin II inhibition, defining the myosin-II-responsive focal adhesion proteome.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed- and full-text-verified source of the seeded HDA focal-adhesion annotation; the main article focuses on β-Pix and is not direct LPP mechanism evidence.
- id: PMID:23447672
  title: A complex containing LPP and α-actinin mediates TGFβ-induced migration and invasion of ErbB2-expressing breast cancer cells.
  findings:
  - statement: In human HER2-positive HCC1954 breast-cancer cells, transient LPP knockdown abolishes the TGFβ-induced increase in migration and invasion.
    supporting_text: Transient knockdown of LPP was sufficient to ablate the TGFβ-induced increase in migration (Fig. 1D) and invasion (Fig. 1E) seen in HCC1954 cells transfected with control siRNAs.
    reference_section_type: RESULTS
  - statement: In mouse NMuMG-ErbB2 breast-cancer cells, TGFβ drives Lpp recruitment to focal adhesions and Lpp-dependent focal-adhesion turnover.
    supporting_text: We show that LPP re-localizes to focal adhesion complexes upon TGFβ stimulation and is a critical determinant in TGFβ-mediated focal adhesion turnover.
    reference_section_type: ABSTRACT
  - statement: In mouse NMuMG-ErbB2 cells, an intact alpha-actinin-binding domain in Lpp is required for the TGFβ-induced migration and invasion phenotype.
    supporting_text: Taken together, these data demonstrate that the ability of LPP to promote TGFβ-induced migration and invasion requires its interaction with α-Actinin at focal adhesions.
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full-text mechanistic study. Human HCC1954 knockdown directly supports TGFβ-induced migration/invasion; focal-adhesion-turnover FRAP and alpha-actinin-binding-domain rescue used mouse NMuMG-ErbB2 cells. These experimental arms must retain their species and HER2/TGFβ context.
- id: PMID:37759537
  title: Characterisation of Lipoma-Preferred Partner as a Novel Mechanotransducer in Vascular Smooth Muscle Cells.
  findings:
  - statement: Mouse Lpp-null aortic VSMCs proliferate and invade more in culture, while native mesenteric arteries specifically show attenuated pressure-induced myogenic responses without loss of agonist-evoked contraction.
    supporting_text: In contrast, the myogenic response of LPP-KO MA segments was significantly attenuated while zyxin-deficient MA segments displayed a normal myogenic response.
    reference_section_type: ABSTRACT
  - statement: Mechanical stretch redistributes LPP toward stress fibers and the nucleus in mouse VSMCs.
    supporting_text: In response to stretching, LPP redistributed towards stress fibres and the nucleus.
    reference_section_type: DISCUSSION
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full-text mouse knockout/mechanotransduction study. It provides organism- and vascular-context evidence and must not be represented as direct human physiology.
