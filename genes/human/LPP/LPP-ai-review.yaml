id: Q93052
gene_symbol: LPP
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  LPP encodes lipoma-preferred partner, a zyxin-family adhesion adaptor with a
  proline-rich N-terminal region and three C-terminal LIM domains. Intact LPP
  localizes to focal adhesions, stress fibers, and cell-cell contacts, where it
  connects cytoskeletal and junctional proteins through several mapped
  interaction surfaces. Its partners include VASP, the central rod of ACTN1,
  the N terminus of palladin, and the PDZ domains of SCRIB; the SCRIB interaction
  is mediated by the extreme LPP C terminus and is not required to target either
  protein to cell-cell contacts. Cooperative action of the three LIM domains,
  including the linker between LIM domains 1 and 2, supports robust focal-
  adhesion targeting.

  LPP also undergoes regulated nucleocytoplasmic shuttling. Nuclear export
  depends on an N-terminal leucine-rich export signal, whereas the mechanism of
  nuclear import is unresolved. LPP can activate a heterologous GAL4 reporter,
  but an endogenous transcriptional target or sequence-specific DNA-binding
  activity has not been established. In rat aortic smooth-muscle cells, human
  endothelial/smooth-muscle co-culture, rat vascular injury, ApoE-null mouse
  atherosclerosis, and human or mouse cancer-model contexts, mechanical cues,
  TGFβ, and adhesion signaling alter LPP abundance or localization and influence
  adhesion turnover, spreading, migration, or invasion in context-specific ways.
  Chromosomal rearrangements can produce HMGA2-LPP or KMT2A-LPP fusion proteins
  that retain two or three LPP LIM domains joined to regions of the respective
  nuclear partner proteins; these chimeras show predominantly nuclear behavior.
