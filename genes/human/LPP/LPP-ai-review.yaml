knowledge_gaps:
- gap_statement: >-
    The endogenous composition, stoichiometry, and exchange kinetics of LPP-
    organized adhesion assemblies are unknown, including whether VASP, ACTN1,
    palladin, and SCRIB bind simultaneously or in mutually exclusive contexts.
- gap_statement: >-
    The mechanism that imports intact LPP into the nucleus, the signals that
    regulate import versus CRM1-dependent export, and any endogenous nuclear
    binding partners or transcriptional targets remain unresolved.
- gap_statement: >-
    It is unclear how force, matrix stiffness, phosphorylation, or other
    modifications change the accessibility and partner preferences of LPP's
    proline-rich region, LIM domains, and terminal PDZ-binding sequence.
- gap_statement: >-
    Human physiological requirements for LPP in vascular smooth muscle and other
    normal tissues remain incompletely defined; pressure-dependent vascular
    phenotypes currently rely substantially on mouse knockout evidence.
- gap_statement: >-
    An intronic promoter produces smooth-muscle-enriched LPP transcripts, but it
    is unknown whether these transcripts alter the protein product, translation,
    localization, or molecular function.
proposed_new_terms: []
suggested_questions:
- question: >-
    Which LPP partner combinations occupy focal adhesions, stress fibers, and
    cell-cell junctions in unperturbed human cells?
- question: >-
    What molecular mechanism imports intact LPP into the nucleus, and which
    physiological stimuli control its import-export balance?
- question: >-
    Does nuclear LPP regulate endogenous transcription or chromatin-associated
    processes independently of the reporter transactivation seen in GAL4 assays?
- question: >-
    How do force and matrix stiffness alter LPP conformation, modification, and
    selection among VASP, ACTN1, palladin, and SCRIB?
- question: >-
    Do smooth-muscle-enriched transcripts initiated from the intronic promoter
    produce a distinguishable LPP protein species or only change abundance?
suggested_experiments:
- description: >-
    Perform endogenous LPP proximity labeling and quantitative cross-linking mass
    spectrometry in human epithelial and vascular smooth-muscle cells under low
    and high tension, with interaction-motif mutants analyzed in parallel.
  hypothesis: >-
    Mechanical context reorganizes LPP partner occupancy, and distinct mapped
    motifs recruit separable VASP-, ACTN1-, palladin-, and SCRIB-containing modules.
- description: >-
    Use single-molecule imaging and fluorescence recovery measurements of
    endogenously tagged LPP at focal adhesions, stress fibers, and cell-cell
    junctions while selectively disrupting each interaction determinant.
  hypothesis: >-
    LPP is a dynamic adaptor rather than an obligate complex subunit, and each
    partner-binding surface makes a distinct contribution to adhesion residence time.
- description: >-
    Map nuclear import determinants by CRISPR tiling mutagenesis of endogenous
    LPP, coupled to live-cell import/export measurements with and without CRM1
    inhibition and mechanical stimulation.
  hypothesis: >-
    A regulated import determinant distinct from the known leucine-rich export
    signal controls stimulus-dependent nuclear accumulation.
- description: >-
    Compare chromatin occupancy, nascent transcription, and nuclear interactomes
    after acute endogenous LPP degradation and rescue with export-defective or
    adhesion-targeting-defective variants.
  hypothesis: >-
    If intact LPP has a physiological nuclear function, nuclear retention will
    produce reproducible endogenous transcriptional or chromatin-associated effects.
- description: >-
    Resolve transcripts initiated from the canonical and intronic promoters by
    long-read RNA sequencing and ribosome profiling in human smooth-muscle cells,
    followed by N-terminomics of endogenous LPP.
  hypothesis: >-
    The intronic promoter primarily changes tissue-specific LPP abundance unless
    it generates a translated protein species with a distinct N terminus.
