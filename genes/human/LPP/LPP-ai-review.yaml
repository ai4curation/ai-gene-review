- id: PMID:8812423
  title: LPP, the preferred fusion partner gene of HMGIC in lipomas, is a novel member of the LIM protein gene family.
  full_text_unavailable: true
  findings:
  - statement: The original cloning study identified LPP as the chromosome 3-derived partner of HMGIC/HMGA2 in lipoma and defined a proline-rich protein with three C-terminal LIM domains.
    supporting_text: Nucleotide sequence analysis of a composite cDNA of LPP revealed an open reading frame of 1836 nucleotides encoding a proline-rich protein containing a leucine-zipper motif in its amino-terminal region and three LIM domains in its carboxy-terminal region.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: The tumor-derived fusion transcripts retain either two or three LPP LIM domains, so these are rearrangement products rather than evidence for normal LPP isoform-specific functions.
    supporting_text: Two alternative HMGIC/LPP hybrid transcripts have been detected; the difference between them is mainly the presence of either two or three LIM domains in the predicted HMGI-C/LPP fusion proteins.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified original human cloning and lipoma-translocation study; abstract only, and its alternative transcripts are tumor fusion products.
- id: PMID:10637295
  title: LPP, an actin cytoskeleton protein related to zyxin, harbors a nuclear export signal and transcriptional activation capacity.
  full_text_unavailable: true
  findings:
  - statement: Human LPP localizes to focal adhesions and cell-cell contacts and binds VASP.
    supporting_text: LPP localizes in focal adhesions as well as in cell-to-cell contacts, and it binds VASP, a protein implicated in the control of actin organization.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: Leptomycin-B trapping and mutational analysis support CRM1-dependent nuclear export through an N-terminal leucine-rich export sequence.
    supporting_text: The nuclear export of LPP depends on an N-terminally located leucine-rich sequence that shares sequence homology with well-defined nuclear export signals.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: LPP has transcriptional activation capacity in a heterologous GAL4 reporter assay, which supports nuclear signaling potential but does not identify an endogenous target gene.
    supporting_text: Moreover, LPP displays transcriptional activation capacity, as measured by GAL4-based assays.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified foundational human LPP localization, VASP-binding, nuclear-export, and reporter-transactivation study; accessible cache is abstract only.
- id: PMID:11433529
  title: Human LPP gene is fused to MLL in a secondary acute leukemia with a t(3;11) (q28;q23).
  full_text_unavailable: true
  findings:
  - statement: A secondary AML case carried reciprocal KMT2A/MLL-LPP fusion transcripts, with the predicted MLL-LPP product retaining the two last LPP LIM domains.
    supporting_text: The predicted MLL-LPP fusion protein includes the A/T hook motifs and methyltransferase domain of MLL joined to the two last LIM domains of LPP.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified primary human leukemia fusion report; relevant to rearrangement biology, not to the normal cellular function of intact LPP.
- id: PMID:12441356
  title: The focal adhesion and nuclear targeting capacity of the LIM-containing lipoma-preferred partner (LPP) protein.
  full_text_unavailable: true
  findings:
  - statement: The three LPP LIM domains cooperate in robust focal-adhesion targeting, with a pivotal contribution from the LIM1-LIM2 linker.
    supporting_text: All of the LIM domains of LPP cooperate in order to provide robust targeting to focal adhesions, and the linker between LIM domains 1 and 2 plays a pivotal role in this targeting.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: The proline-rich region contains separable focal-adhesion and stress-fiber targeting information beyond its α-actinin- and VASP-binding sites.
    supporting_text: The proline-rich region of LPP contains targeting sites for focal adhesions and stress fibers that are distinct from the alpha-actinin and VASP binding sites, and the LPP LIM domains are dispensable for targeting LPP to the nucleus.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified direct domain-mapping study; abstract only in the project cache.
- id: PMID:12615977
  title: The lipoma preferred partner LPP interacts with alpha-actinin.
  full_text_unavailable: true
  findings:
  - statement: Direct and cellular interaction assays map LPP binding to the central spectrin-repeat rod of α-actinin and to a conserved N-terminal LPP motif.
    supporting_text: This site was mapped to the central rod of alpha-actinin, which contains spectrin-like repeats 2 and 3. In the case of LPP, a conserved motif present at the N-terminus was shown to be responsible for the interaction.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: LPP binds α-actinin more weakly than zyxin in the quantitative two-/three-hybrid assays, limiting simple transfer of zyxin interaction behavior to LPP.
    supporting_text: Quantitative data obtained with the two-hybrid and the three-hybrid system suggest that LPP has a lower affinity for alpha-actinin than zyxin.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified direct LPP-alpha-actinin interaction and binding-site study; accessible cache is abstract only.
- id: PMID:15649318
  title: The tumor suppressor Scrib interacts with the zyxin-related protein LPP,
    which shuttles between cell adhesion sites and the nucleus.
  findings:
  - statement: Scrib is a direct LPP partner, with binding mediated by Scrib PDZ domains and the LPP C terminus.
    supporting_text: The binding between Scrib and LPP is mediated by the PDZ domains of Scrib and the carboxy-terminus of LPP.
    reference_section_type: ABSTRACT
  - statement: In MDCKII and CV-1 cells, both proteins occupy cell-cell contacts, but Scrib is not required to target LPP to either focal adhesions or cell-cell contacts.
    supporting_text: Furthermore, our investigations indicate that Scrib is dispensable for targeting LPP to focal adhesions and to cell-cell contacts, and that LPP is not necessary for localizing Scrib in cell-cell contacts.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full-text primary interaction study with direct in vitro and cellular assays; species and cell-system details are explicit in the cached article.
