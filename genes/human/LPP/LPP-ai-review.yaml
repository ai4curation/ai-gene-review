core_functions:
- description: >-
    Binds alpha-actinin through a conserved N-terminal LPP determinant at focal
    adhesions and stress fibers. In human HER2-positive HCC1954 breast-cancer
    cells, LPP knockdown abolishes TGFβ-induced migration. Complementary mouse
    NMuMG-ErbB2 experiments show that the alpha-actinin-binding region of Lpp is
    required for the migration phenotype and that reducing Lpp blocks TGFβ-
    enhanced focal-adhesion turnover. Thus, the human migration phenotype and the
    mouse alpha-actinin/turnover mechanism are experimentally distinct context-
    specific observations. Direct actin binding and an obligate stable bridging
    complex have not been observed.
  molecular_function:
    id: GO:0051393
    label: alpha-actinin binding
  directly_involved_in:
