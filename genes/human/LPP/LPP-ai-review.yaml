  - reference_id: PMID:23447672
    supporting_text: Transient knockdown of LPP was sufficient to ablate the TGFβ-induced increase in migration (Fig. 1D) and invasion (Fig. 1E) seen in HCC1954 cells transfected with control siRNAs.
  - reference_id: PMID:23447672
    supporting_text: Taken together, these data demonstrate that the ability of LPP to promote TGFβ-induced migration and invasion requires its interaction with α-Actinin at focal adhesions.
- description: >-
    Binds the PDZ domains of SCRIB through the extreme C-terminal sequence of LPP.
    LPP and SCRIB can co-occupy cell-cell contacts, while each protein retains its
    junctional localization when their interaction is disrupted. Separately mapped
    LPP interactions with VASP and palladin support broader adhesion-site scaffold
    behavior; whether these partner-bound states coexist or exchange dynamically
    remains unresolved.
  molecular_function:
