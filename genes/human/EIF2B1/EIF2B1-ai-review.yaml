id: Q14232
gene_symbol: EIF2B1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: EIF2B1 encodes the alpha subunit of the cytosolic eukaryotic translation initiation factor
  eIF2B. Alpha homodimers participate in assembly and regulation of the eIF2B complex, which exchanges
  GDP for GTP on eIF2 to regenerate the initiation factor for protein synthesis. This complex links translation
  initiation to stress signaling because phosphorylation of eIF2alpha inhibits its nucleotide-exchange
  activity. EIF2B1 contributes to complex function through its structural and regulatory role.
