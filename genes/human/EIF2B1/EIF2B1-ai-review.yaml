      and Figure 2h also describe a human eIF2/eIF2B comparator in a reconstituted HCV-IRES translation
      assay. This supports participation of the human complex in cytoplasmic initiation. Alpha is a regulatory
      and structural subunit; the assay is not an isolated-alpha exchange measurement.
