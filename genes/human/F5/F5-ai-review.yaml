    action: KEEP_AS_NON_CORE
    reason: 'The author-labeled BioPlex 2.0 293T directed-edge table records OLR1 (GeneID 4973) as bait
      and F5 (GeneID 2153) as prey. Online Experimental Methods describe human ORFeome constructs with
      C-terminal HA-FLAG tags and anti-HA AP-MS. This supports the imported cellular association. GO:0005124
      was considered, but its signaling-receptor-binding parent adds a receptor-ligand interpretation
      that this co-isolation alone does not establish. This is not a requirement that every binding paper
      measure downstream signaling: the unresolved point is whether F5 itself occupies that functional
      receptor-binding role rather than associating indirectly. Retain generic binding as non-core under
      the campaign supported-binding exception. No purified binary interface, uptake, plasma interaction,
      exact historical insert or processed F5 species is established. The explicitly labeled 2.0 directed
      table, not a generic v2 filename, identifies the assay direction.'
