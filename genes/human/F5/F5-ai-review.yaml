  review:
    summary: Retain measured copper binding as a supporting biochemical property.
    action: KEEP_AS_NON_CORE
    reason: 'The actual IPR011707-to-GO mapping includes copper ion binding, but family membership alone
      is not decisive: its general description even excludes FV/FVIII from copper binding. The original
      human-plasma FV preparation in PMID:6490642 contained approximately one copper ion per protein by
      atomic absorption and emission spectroscopy after extensive dialysis, alongside bovine preparations
      and buffer/prothrombin controls. Retain this positive property without inferring oxidase activity
      or a demonstrated requirement for copper in FV cofactor function; the paper leaves its functional
      role unresolved. The preserved UniProt P12259 record also lists Cu-cation binding at displayed residues
      1843 and 1845 and a copper keyword. Those two site assertions carry ECO:0000250 and are homology-based
      corroboration, not target-residue measurements from the human copper assay.'
