gene_symbol: F5
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'Factor V is a secreted coagulation procofactor present in plasma and platelet alpha granules.
  Proteolytic activation produces factor Va, whose associated heavy and light chains bind factor Xa on
  negatively charged membrane surfaces and greatly enhance prothrombin conversion to thrombin. Factor
  Xa supplies the protease activity; Va supplies the cofactor activity that supports fibrin-clot formation.
  Activated protein C limits this activity by cleaving Va, and impaired inactivation of the Leiden variant
  prolongs thrombin generation. Factor V also has state-dependent anticoagulant activity: FV-short and
  protein S cooperate to enhance TFPIalpha-mediated inhibition of Xa, whereas intact factor V is less
  efficient and thrombin activation of FV-short removes this cofactor effect. FV-short is a splice-derived
  form, distinct from proteolytic FV intermediates and the heavy and light chains of Va. Factor V deficiency
  causes a bleeding disorder, while resistance to activated protein C can predispose to thrombosis.'
