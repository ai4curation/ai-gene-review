- term:
    id: GO:0030195
    label: negative regulation of blood coagulation
  evidence_type: IDA
  original_reference_id: PMID:30046712
  qualifier: involved_in
  review:
    summary: FV-short provides an experimentally tested, state-dependent anticoagulant cofactor contribution.
    action: NEW
    reason: 'PMID:30046712 directly measures synergistic enhancement of TFPIalpha-mediated Xa inhibition
      by FV-short and protein S in purified-component S2765 assays and suppression of plasma thrombin
      generation with antibody and cleavage controls. Intact human plasma-derived or recombinant FV is
      less efficient; thrombin cleavage removes the FV-short synergistic effect. F5 therefore performs
      cofactor work in the inhibitory assembly rather than merely being necessary or serving as an APC
      substrate. TFPIalpha supplies the direct inhibitory contact. Recombinant FV-short, cleavage-resistant
      R709Q/R1545Q QQ, intact FV and proteolytic Reactome intermediates remain distinct; no natural-product
      equivalence or universal anticoagulant activity is asserted. This regulatory process is not an is_a/part_of
      ancestor or descendant of retained coagulation/clot-formation terms. Same-role anticoagulant cofactors
      and the production GO-CAM APC-input models were inspected: those substrate models do not themselves
      support this separate TFPIalpha cofactor assertion.'
