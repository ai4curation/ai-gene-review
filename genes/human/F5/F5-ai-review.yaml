    reason: Human normal and Leiden plasma FV preparations in the reconstituted coagulation system of
      PMID:9252393 support Xa-dependent prothrombin activation on PC/PS membranes, measured by thrombin
      activity and protein-cleavage analysis. The established human Xa/Va assembly is independently represented
      by Reactome 140686 and its prothrombinase reaction 140664. Activated Va supplies the binding/cofactor
      contribution that enhances the endopeptidase; Xa supplies proteolysis. This matches the current
      GO:0061133 definition and is not inferred merely from FV necessity or from FV being cleaved. Same-role
