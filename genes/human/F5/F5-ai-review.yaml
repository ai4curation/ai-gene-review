core_functions:
- description: Activated factor Va binds Xa in membrane-associated prothrombinase and increases Xa-dependent
    prothrombin activation. The calcium/phospholipid-supported complex thereby promotes thrombin generation
    and fibrin-clot formation. Va is the nonenzymatic cofactor; Xa performs the cleavage. Human plasma
    factor V reconstitution and the prolonged activity of the Leiden variant establish this role and its
    regulation by activated protein C, without assigning protease activity to F5.
  molecular_function:
    id: GO:0061133
    label: endopeptidase activator activity
  directly_involved_in:
  - id: GO:0072378
    label: blood coagulation, fibrin clot formation
  locations:
  - id: GO:0009897
    label: external side of plasma membrane
  supported_by:
  - reference_id: PMID:9252393
  - reference_id: Reactome:R-HSA-140664
  - reference_id: Reactome:R-HSA-140686
- description: 'FV-short cooperates with protein S to enhance TFPIalpha inhibition of Xa on negatively
    charged phospholipids. Purified-component assays and plasma thrombin generation demonstrate the anticoagulant
    contribution: intact plasma-derived or recombinant FV is less efficient, and thrombin-cleaved FV-short
    loses the synergistic cofactor activity. TFPIalpha supplies the inhibitory interaction with the protease;
    F5 contributes to the inhibitory assembly. The tested recombinant FV-short and cleavage-resistant
    QQ construct are not equated with all natural F5 products or with the proteolytic FV intermediate
    modeled by Reactome.'
  contributes_to_molecular_function:
    id: GO:0004867
    label: serine-type endopeptidase inhibitor activity
  directly_involved_in:
  - id: GO:0030195
    label: negative regulation of blood coagulation
  supported_by:
  - reference_id: PMID:30046712
  - reference_id: Reactome:R-HSA-9931624
  - reference_id: Reactome:R-HSA-9931628
suggested_questions:
- question: How do the abundance and cleavage state of native full-length FV, FV-short and proteolytic
    FV intermediates determine the balance between Xa cofactor activity and TFPIalpha cofactor activity
    on human platelet and endothelial surfaces?
- question: Does the OLR1-associated F5 detected in cellular interaction screens represent an intact precursor,
    a processed species or an indirect complex, and what functional consequence follows from that association?
suggested_experiments:
- description: Resolve native human FV species by sequence-specific mass spectrometry and cleavage-sensitive
    immunoblotting, then compare defined preparations in matched Xa/prothrombin and TFPIalpha/protein-S
    inhibition assays. Include omission controls, matched phospholipid surfaces and direct cleavage measurements
    so that cofactor enhancement is separated from protease turnover and product loss.
  hypothesis: The exposed B-domain region and proteolytic state govern the relative procoagulant and TFPIalpha-cofactor
    activities; activity cannot be inferred from F5 antigen concentration alone.
- description: Reconstitute OLR1 association using sequence-verified F5 preparations and purified receptor,
    alongside receptor-null and rescue cells. Identify the bound F5 species and test binding separately
    from uptake or signaling, retaining indirect-association controls for the original AP-MS observations.
  hypothesis: OLR1 association depends on a particular F5 state or an additional cellular partner, rather
    than establishing equivalent receptor binding by every F5 product.
