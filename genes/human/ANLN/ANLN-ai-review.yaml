- term:
    id: GO:0007096
    label: regulation of exit from mitosis
  evidence_type: TAS
  original_reference_id: PMID:10931866
  qualifier: involved_in
  review:
    summary: Regulation of exit from mitosis (TAS). The cited paper characterizes anillin localization
      and cytokinesis and does not address mitotic exit. Anillin is degraded by APC/C-Cdh1 during exit,
      which makes it a substrate of the exit machinery, not a regulator of the CDK-inactivation transition
      the term describes. Removed.
    action: REMOVE
    reason: '[PMID:16040610 "Ubiquitination of anillin required a destruction-box and was mediated by
      Cdh1, an activator of APC/C."] None of the anillin studies reviewed here (including the cited one)
      show anillin controlling the conversion from high to low mitotic CDK activity; its documented late-mitotic
      roles are in furrow ingression and abscission: [PMID:15496454 "Human cells depleted for anillin
      fail to properly regulate contraction by myosin II late in cytokinesis and fail in abscission."]'
    supported_by:
    - reference_id: PMID:16040610
      supporting_text: Ubiquitination of anillin required a destruction-box and was mediated by Cdh1,
        an activator of APC/C.
    - reference_id: PMID:15496454
      supporting_text: Human cells depleted for anillin fail to properly regulate contraction by myosin
        II late in cytokinesis and fail in abscission.
