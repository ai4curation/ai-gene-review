  qualifier: enables
  review:
    summary: Cadherin binding (HDA). The source is an E-cadherin BioID proximity-biotinylation screen,
      which reports vicinity, not binding. Anillin does have a role at human epithelial junctions, but
      no direct cadherin interaction has been shown; removed.
    action: REMOVE
    reason: '[PMID:25468996 "Examples of such proteins are the receptor SCARB1, the RhoGAP ARHGAP1, and
