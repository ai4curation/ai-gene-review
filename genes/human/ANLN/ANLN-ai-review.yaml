- term:
    id: GO:1904172
    label: positive regulation of bleb assembly
  evidence_type: IMP
  original_reference_id: PMID:23870127
  qualifier: involved_in
  review:
    summary: 'Positive regulation of bleb assembly (IMP). In the cited HeLa study, anillin depletion caused
      premature blebs in metaphase and large blebs in anaphase, and local reduction of anillin promotes
      polar membrane expansion. Loss of anillin increases blebbing, so the direction is the opposite:
      modified to negative regulation of bleb assembly, as a non-core cortical role.'
    action: MODIFY
    reason: '[PMID:23870127 "global Anillin depletion resulted in premature bleb formation during metaphase
      (Fig. 6F), which was never observed in control cells, and the formation of large membrane blebs
      during anaphase (Fig. 6G)."] [PMID:23870127 "Asymmetric membrane elongation is promoted by chromosome-derived
      Ran-GTP signals that locally reduce Anillin at the growing cell cortex."] The phenotype could partly
      reflect failed bleb retraction, which anillin marks, but either way anillin restrains blebbing.'
