- question: Is anillin's role at epithelial junctions a direct structural one (cadherin complex) or secondary
    to its RhoA scaffolding of perijunctional actomyosin?
- question: Do the FSGS ANLN variants act through loss of CD2AP binding, gain of motility, or altered
    podocyte RhoA signalling?
