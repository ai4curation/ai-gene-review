id: Q9NQW6
gene_symbol: ANLN
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ANLN (anillin) is a conserved multidomain scaffold of the cytokinetic contractile ring. It
  has an N-terminal myosin-binding region and actin-binding domain, and a C-terminal anillin homology
  region made of a cryptic C2 domain, a Rhotekin-like Rho-binding domain and a PH domain. During interphase
  it is held in the nucleus. After nuclear envelope breakdown it moves to the cortex and concentrates
  in the cleavage furrow, then at the midbody. There it binds F-actin, nonmuscle myosin II, active RhoA,
  PI(4,5)P2 and septins, linking RhoA signalling and the membrane to the actomyosin ring and the septin
  cytoskeleton. Anillin keeps active myosin in the equatorial plane, stabilizes furrow ingression and
  is needed for intercellular-bridge maturation and abscission. Its loss causes cytokinesis failure and
  multinucleation. Anillin is degraded by APC/C-Cdh1 at mitotic exit. It also supports epithelial junction
  integrity, and missense variants (R431C, G618C) cause familial focal segmental glomerulosclerosis.
