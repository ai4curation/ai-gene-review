core_functions:
- molecular_function:
    id: GO:0004198
    label: calcium-dependent cysteine-type endopeptidase activity
  description: Catalyzes calcium-dependent proteolysis, with self-cleavage directly demonstrated in full-length
    human CAPN5 assays. Intracellular membrane association promotes activation in these assays. The physiological
    function of self-cleavage, the activity of its fragments and native substrate specificity remain incompletely
    established; self-cleavage is not assumed to mature or activate the enzyme.
  directly_involved_in:
  - id: GO:1990092
    label: calcium-dependent self proteolysis
  locations:
  - id: GO:0005737
    label: cytoplasm
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:33811937
    supporting_text: 'Mutation of the catalytic Cys81 to Ala or addition of EGTA

      prevented autolysis.'
suggested_questions:
- question: Which endogenous retinal substrates are directly cleaved by CAPN5 under physiological calcium
    conditions?
- question: How do full-length CAPN5 and isolated protease-core constructs differ in the effects of individual
    vitreoretinopathy variants?
- question: Can the original BioPlex target records and focal-adhesion/exosome detections be recovered,
    and can the independently corroborated STIP1 coassociation be resolved into a direct or indirect mechanism?
- question: Does calcium-dependent CAPN5 self-cleavage regulate native enzyme activity or turnover, and
    do its resulting fragments retain catalytic or signaling functions?