  - InterPro:IPR022684
  review:
    action: MODIFY
    summary: Refine the electronic proteolysis summary to directly demonstrated calcium-dependent self
      proteolysis.
    reason: 'The InterPro mapping correctly captures broad proteolytic capacity, but it does not itself
      establish self-cleavage. Independent full-length human CAPN5 experiments in PMID:33811937 supply
      the more specific evidence: calcium-triggered processing in SH-SY5Y cells depends on catalytic Cys81
      and is blocked by EGTA; tagged and untagged constructs were examined. GO:1990092 describes calcium-dependent
      cleavage of the protein''s own peptide bonds without requiring maturation into a more functional
      product. That outcome fits these assays, whereas GO:0016540 protein autoprocessing inherits a maturation
      requirement through protein processing that was not established. This is an evidence-backed refinement
      of one existing broad electronic row, not an inference from the InterPro domain alone, a claim that
      CAPN5 cannot cleave other substrates, or a change to the preserved broad PAINT proteolysis assertion.
      No redundant NEW descendant is added. The physiological purpose, cleavage-site identities and cis-versus-trans
      mechanism remain unresolved.'
    proposed_replacement_terms:
    - id: GO:1990092
      label: calcium-dependent self proteolysis
    additional_reference_ids:
    - PMID:33811937
- term:
    id: GO:0007165
    label: signal transduction
  evidence_type: TAS
  original_reference_id: PMID:9339374
  qualifier: involved_in
  review:
    action: UNDECIDED
    summary: The accessible family-level signaling hypothesis does not resolve the complete historical
      CAPN5 TAS basis.
    reason: 'The complete accessible abstract of PMID:9339374 introduces signal transduction as a proposed
      property of calpains and then reports CAPN5/6 cloning, sequence comparisons and expression. That
      visible statement alone would not substantiate a CAPN5-specific signaling assignment. However, the
      original full paper and the curator''s supporting passage remain inaccessible: an abstract opening
      is not proof that the entire TAS basis is visible or speculative. Therefore retain UNDECIDED rather
      than mark the historical assertion over-annotated on incomplete source access. Later mouse-myoblast
      intervention/rescue work (PMID:39357823) and human co-IP/in-vitro cleavage studies (PMID:41597217)
      offer mechanistic leads but do not resolve the particular human signaling response behind this assertion.
      In contrast, the sibling calcium-dependent protease TAS is independently corroborated by direct
      human CAPN5 assays (PMID:33811937); its ACCEPT does not verify the unread 1997 passage. Retinal
      disease alone does not identify the signaling step performed by CAPN5.'
