description: Calpain-5 is a non-classical calcium-regulated cysteine protease with a calpain catalytic
  core and a C-terminal C2 domain. It occurs in intracellular soluble and membrane-associated pools; C2-domain
  residues and S-acylation contribute to membrane association. Full-length human CAPN5 undergoes calcium-dependent
  autoproteolysis. Pathogenic variants cause neovascular inflammatory vitreoretinopathy, but their biochemical
  effects depend on the variant and experimental construct. Candidate interaction partners and in-vitro
  substrates have been reported; the physiological substrates and pathways underlying its retinal function
  remain incompletely defined.
