description: 'SLC41A2 is a plasma-membrane magnesium transporter of the SLC41/MgtE family that mediates cellular Mg2+ transport; in heterologous systems it can also conduct other divalent cations (Ba2+ > Ni2+ > Co2+ > Fe2+ > Mn2+). It is widely expressed and contributes to cellular magnesium balance.'
