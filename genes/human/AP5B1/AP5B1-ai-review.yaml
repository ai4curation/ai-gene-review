    platform subdomain, unlike the AP-4 beta subunit, which has only the platform, or the AP-1 gamma
    subunit, which has only the sandwich; the corresponding domains in the AP-1 and AP-2 beta subunits
    are docking platforms for accessory proteins. Also established: the recurrent founder allele
    p.Leu785Pro falls inside this region, within Pfam PF21590 (781-873). Not established: any binding
    partner for it, or any consequence of the substitution beyond the genetic association.'
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: Retaining both appendage subdomains is a conspicuous feature for a complex that has
    no known accessory proteins. If the appendage has ligands, they would be the missing regulatory
    layer of AP-5; if it does not, the retention is a puzzle. Either answer bears directly on how
    a missense change in it causes macular dystrophy while truncating alleles cause the same phenotype.
  resolution: Appendage-domain pulldowns from brain or RPE lysate, as were used to find the AP-1
    and AP-2 ear ligands, with the p.Leu785Pro appendage as a paired bait; and a stability and complex-assembly
    assay comparing wild-type and p.Leu785Pro AP5B1.
  provenance:
  - reference_id: PMID:22022230
    supporting_text: although DKFZp761E198 lacks a long unstructured linker separating the solenoid
      and appendage domains, its appendage domain contains both the β-sandwich subdomain and the
      α/β platform domain
  - reference_id: PMID:42568187
    supporting_text: These findings further support AP5B1 as a cause of macular dystrophy, identify
      p.Leu785Pro as a relatively frequent pathogenic allele in individuals of European and Ashkenazi
      Jewish ancestry
- gap_statement: Why AP-5 subunit loss produces a retinal phenotype in some genes and a spastic paraplegia
    phenotype in others is unexplained, and for AP5B1 specifically no spastic paraplegia has been
    reported despite bi-allelic null alleles.
  boundary: 'Established: AP5Z1 loss of function causes hereditary spastic paraplegia SPG48, and
    bi-allelic loss of function in AP5Z1, AP5M1 and AP5B1 causes recessive macular dystrophy. Established
    for AP5B1 in particular: at least five distinct truncating alleles across three cohorts, plus
    the recurrent p.Leu785Pro, all presenting with retinal disease. The subunits are obligate members
    of one complex, so a purely complex-level model predicts one shared phenotype, and that is not
    what is observed.'
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  status: NARROWING
  significance: A subunit-specific phenotype in an obligate complex implies either a function outside
    the complex for one or more subunits, or quantitative differences in residual complex assembly
    between subunit nulls. Distinguishing these would change how the gene's core functions should
    be scoped.
  resolution: Side-by-side null cell lines for each of the four subunits, in RPE and in neurons,
    with quantitative assembly of the residual complex measured and the CIMPR retrieval assay as
    a common readout.
  provenance:
  - reference_id: PMID:42568187
    supporting_text: The fifth adaptor protein (AP-5) complex mediates protein sorting within late
      endosomal trafficking pathways and contributes to lysosomal homeostasis.
  - reference_id: PMID:41830174
    supporting_text: Our findings provide additional evidence that AP5Z1 and AP5B1 are critical for
      retinal function, and their deficiency leads to retinal degeneration, with or without extra-retinal
      phenotypes.
suggested_questions:
- question: Does AP-5 recognise a sorting signal in cargo directly, or only through spastizin and
    spatacsin? Fifteen years after the complex was described, no motif and no direct cargo contact
    has been reported, and the one proposed link runs through spastizin.
  experts:
  - Jennifer Hirst
  - Margaret S. Robinson
- question: Why has no accessory protein been found for the beta-5 appendage, which uniquely retains
    both the beta-sandwich and the platform subdomain, when the equivalent domains of the AP-1 and
    AP-2 beta subunits are among the busiest interaction platforms in membrane traffic?
  experts:
  - Margaret S. Robinson
  - Jennifer Hirst
- question: Why do bi-allelic null alleles of AP5B1 give macular dystrophy without the spastic paraplegia
    seen with AP5Z1 loss, when the two proteins are obligate partners in the same complex?
  experts:
  - Carlo Rivolta
  - Petra Liskova
  - Rui Chen
- question: Which subunit of the AP-5/SPG11/SPG15 assembly contributes the curvature-sensing surface
    that drives membrane remodelling in vitro, and is beta-5 part of it or purely structural?
  experts:
