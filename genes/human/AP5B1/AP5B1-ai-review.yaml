- description: 'Stoichiometric component of the AP-5/SPG11/SPG15 assembly, the form in which AP-5
    acts on membranes. The four AP-5 subunits co-purify with spatacsin and spastizin at roughly 1:1:1:1:1:1
    from both cytosol and detergent-extracted membranes, and knocking down any of the six produces
    the same cargo-trapping phenotype, so the functional unit is a hexamer rather than the tetramer.
    Within it the division of labour is asymmetric: spastizin''s FYVE domain reads phosphatidylinositol
    3-phosphate and docks the assembly, spatacsin provides a clathrin-heavy-chain-like scaffold,
    and AP-5 contributes the sorting module, with recruitment gated by coincidence detection of PI3P
    and Rag GTPases and enhanced on starvation. The assembled complex binds PI3P, senses membrane
    curvature and drives membrane remodelling in vitro, and is required for the initiation of autolysosome
    tubulation; when it is lost, cells accumulate aberrant multilamellar endolysosomes severe enough
    for AP-5 deficiency to be classed as a lysosomal storage disease. AP5B1 contributes to these
    activities as a structural member of the assembly; the membrane-binding and scaffolding determinants
    sit on its partners.

    No contributes_to_molecular_function is asserted here, and the omission is deliberate. The obvious
    candidate, GO:0140090 membrane curvature sensor activity, was considered and rejected on three
    counts: the curvature sensing was measured for the hexamer, while the only complex term GO has
    for this protein is the tetramer, so the assertion would be attached to the wrong assembly; the
    same study also solved SPG11-SPG15 without AP-5, so AP-5 may be dispensable for the activity
    and the cache is abstract-only, which means that cannot be ruled out; and GO:0140090''s definition
    names an amphipathic-helix insertion mechanism that has not been tested for this complex at all.
    An omitted slot says "not established"; a filled one says something a downstream tool will believe.
    The gap is recorded below instead.'
