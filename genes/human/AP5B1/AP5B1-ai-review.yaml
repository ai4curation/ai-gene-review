  supporting_entities:
  - UniProtKB:O43299
  review:
    summary: AP5B1 co-purifies with AP5Z1 (zeta-5), the other large subunit of AP-5. The evidence
      is reciprocal BAC-tagged immunoprecipitation followed by shotgun LC-MS/MS in which AP5B1, then
      called DKFZp761E198, was itself one of the baits, so the association is established in both
      directions rather than as a one-way prey hit. This is one of the two studies that between them
      defined the four-subunit AP-5 core.
    action: MODIFY
    reason: 'Bare protein binding conveys nothing about what AP5B1 does. The informative content
      of this row is that AP5B1 is a stoichiometric structural subunit of AP-5: it is the beta-adaptin-fold
      trunk that holds the complex together, its N-terminal quarter makes the canonical beta-mu contact,
      and depleting it destabilises mu-5. GO:0005198 structural molecule activity is defined as the
      action of a molecule that contributes to the structural integrity of a complex, which is exactly
      this claim and is the most specific molecular function GO currently offers for an adaptor-complex
      subunit. The complex membership itself is separately captured by GO:0044599. Note for whoever
      implements this: nine IPI rows on this gene carry the same proposed replacement and should
      collapse into a single GO:0005198 annotation rather than nine. That collapse also implies a
      re-code, because IPI is an odd evidence code for structural molecule activity - what actually
      supports the term is the mapped beta-mu interface (IDA) and the loss of mu-5 protein when beta-5
      is depleted (IMP), both from PMID:22022230.'
