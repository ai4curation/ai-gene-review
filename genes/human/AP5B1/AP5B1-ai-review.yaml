- term:
    id: GO:0016197
    label: endosomal transport
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN002145545
  - UniProtKB:Q2VPB7
  review:
    summary: A self-referential IBA, and correctly so. The PAINT slice for PTHR34033 contains exactly
      one node, PTN002145545, placed at taxon:2759 (Eukaryota), carrying two IBD assertions, and
      the only seed of both is UniProtKB:Q2VPB7 - human AP5B1 itself. The two terms are precisely
      the two experimental annotations AP5B1 held in 2017, the IMP for this term and the IDA for
      GO:0030119, both from PMID:22022230. The target appearing in its own WITH/FROM is the expected
      signature of a node seeded by the target's own experimental evidence.
    action: ACCEPT
    reason: 'Kept at the general term, deliberately and divergently from the IMP row for the same
      term, which is refined to GO:0042147. The direction of the transport step is established in
      human HeLa cells only; propagating retrograde endosome-to-Golgi transport to every eukaryotic
      AP5B1 orthologue would assert more than the evidence supports, whereas ''endosomal transport''
      is exactly the level at which the ancestral claim is safe. That is a deliberate divergence
      of action on one GO term, made on biological grounds rather than by evidence code. Correct
      and core. What the IBA adds over the IMP it derives from is a phylogenetic judgement: the curator
      placed the assertion at the eukaryotic root of the family rather than on the human branch,
      i.e. endosomal transport is the ancestral function of the AP5B1 clade rather than a primate
      innovation. The comparative genomics in the same paper supports that placement, with AP-5 subunits
      found in all five eukaryotic supergroups. Human AP5B1 is trivially inside the inheriting clade,
      since it is the seed; there is no IRD or IKR anywhere in the family; and the four other reviewed
      members of PTHR34033:SF1 are full-length orthologues of 876-883 residues with no sign of degeneration.
      A one-donor WITH/FROM here is not weak evidence, it is the whole family''s experimental grounding.'
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN002145545
        source_label: PTHR34033 AP-5 COMPLEX SUBUNIT BETA-1 IBD node at taxon:2759
        source_status: SUPPORTS_TRANSFER
        comment: The only node in the PTHR34033 PAINT slice, placed at taxon:2759 (Eukaryota) and
          carrying exactly two IBD assertions, of which this is one. Its seed list is a single entry,
          UniProtKB:Q2VPB7, so the node encodes the judgement that AP5B1's experimentally demonstrated
          endosomal transport role is ancestral to the whole eukaryotic AP5B1 clade. Human AP5B1
          is inside that clade by construction.
      - source_id: UniProtKB:Q2VPB7
        source_label: AP5B1 (human, the target)
        source_status: SUPPORTS_TRANSFER
        comment: 'The target''s own accession, and the sole gene-level seed of the IBD. Its IMP for
          this term (PMID:22022230, four independent siRNAs causing CIMPR and Vps26 to accumulate
          in enlarged puncta) is the descendant evidence the PAINT curator used. Expected and valid,
          not circular: it marks that the family''s experimental grounding sits on the target itself.'
      residue_claims_not_applicable: The question is whether an ancestral trafficking role transfers
        within a single-orthologue-group family, not whether any residue was gained or lost. AP5B1
        has no catalytic or ligand-binding residues annotated in UniProt at all - no ACT_SITE, no
        BINDING, no CAUTION - so there is no residue-level claim to make or to test.
    supported_by:
    - reference_id: file:human/AP5B1/AP5B1-uniprot.txt
      supporting_text: DR   PANTHER; PTHR34033; AP-5 COMPLEX SUBUNIT BETA-1; 1.
    - reference_id: PMID:22022230
      supporting_text: AP-5 subunits can be found in all five eukaryotic supergroups, but they have
        been co-ordinately lost in many organisms.
    - reference_id: PMID:22022230
      supporting_text: Thus, AP-5 is an evolutionarily ancient complex, which is involved in endosomal
        sorting, and which has links with hereditary spastic paraplegia.
