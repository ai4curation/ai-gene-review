  review:
    summary: 'AP5B1 is a macular dystrophy gene, established since the GOA snapshot and annotated
      nowhere. Bi-allelic AP5B1 variants cause recessive inherited retinal disease in three independent
      cohorts: two families in the 2025 study that first linked three AP-5 subunit genes to hereditary
      macular dystrophy, five probands in an independent 2026 replication, and 22 affected individuals
      from 20 families in a 2026 cohort defined by the recurrent p.Leu785Pro founder allele. The
      AP5B1 alleles in the first cohort are truncating and remove more than two-thirds of the protein.
      The same study localised AP5B1 protein in human retinal pigment epithelium with a subunit-specific
      antibody, where it is punctate and overlaps Rab7 and TGN46.'
    action: NEW
    reason: 'A well-evidenced human loss-of-function phenotype with a matching expression and localisation
      pattern in the affected tissue, from three independent groups, and entirely absent from GOA.
      Coded IMP against human variant evidence, which is the appropriate code here because the evidence
      is human rather than a model organism. Stated plainly so the basis is not mistaken later: the
      IMP rests on human genetic association - bi-allelic truncating and founder missense alleles
      segregating with the phenotype across three cohorts - plus subunit-specific localisation in
      the affected tissue, not on an engineered mutant or a knockout cell line. That is standard
      GOA practice for inherited retinal disease genes, and a curator who prefers a weaker code should
      read it as such rather than as an unsupported claim. This is deliberately recorded as a tissue-level,
      non-core consequence rather than a molecular core function: what AP5B1 does is contribute to
      endolysosomal retrieval as a structural subunit of AP-5, and RPE degeneration is what happens
      downstream when that fails in a post-mitotic, phagocytosis-loaded cell type. Noted for completeness:
      unlike AP5Z1, which causes spastic paraplegia SPG48, AP5B1 has not been reported as a hereditary
      spastic paraplegia gene, and p.Leu785Pro falls inside the C-terminal appendage domain PF21590
      (781-873).'
