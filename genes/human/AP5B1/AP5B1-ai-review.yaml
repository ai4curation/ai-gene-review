id: Q2VPB7
gene_symbol: AP5B1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'AP5B1 encodes beta-5 adaptin, the large scaffolding subunit of AP-5, the fifth and
  most recently identified heterotetrameric adaptor protein complex. It is an 878-residue protein
  built on the beta-adaptin plan, an N-terminal alpha-helical solenoid trunk followed by a C-terminal
  appendage that retains both the beta-sandwich and the alpha/beta platform subdomains. Its N-terminal
  quarter binds the medium subunit mu-5 in the same arrangement that beta subunits use in AP-1 and
  AP-2, and mu-5 protein is destabilised when beta-5 is depleted, so beta-5 holds the complex together.
  Together with zeta-5, mu-5 and sigma-5 it forms the AP-5 core, and in cells that core is found
  in a larger, stoichiometric assembly with spatacsin (SPG11) and spastizin (ZFYVE26/SPG15), in which
  spastizin docks the assembly onto membranes through a FYVE domain that reads phosphatidylinositol
  3-phosphate, and spatacsin is thought to provide a clathrin-like scaffold. Recruitment to late
  endosomes and lysosomes is by coincidence detection of PI3P and Rag GTPases and is enhanced when
  cells are starved, tying the complex to nutrient signalling.

  Unlike the beta subunits of AP-1 and AP-2, beta-5 carries no usable clathrin-recruitment apparatus:
  it lacks the type-II LLDLL box and the tryptophan-based W-box, its single clathrin-box consensus
  match lies buried inside a folded C-terminal domain rather than in an exposed linker, and the trunk-to-appendage
  linker that carries the box in AP1B1 and AP2B1 is roughly a third as long. AP-5 correspondingly
  does not associate with clathrin and is insensitive to brefeldin A.

  Functionally, AP-5 acts in a retrieval step out of late endosomes back to the Golgi, in parallel
  with and as a backup to retromer. Depleting beta-5 traps the cation-independent mannose 6-phosphate
  receptor and the retromer subunit Vps26 in enlarged perinuclear compartments and produces swollen
  multivesicular bodies with emanating tubules; loss of AP-5 more broadly causes retrieval defects
  for GOLIM4 and GOLM1 as well, and leads to the accumulation of aberrant multilamellar endolysosomes.
  The assembled AP-5/SPG11/SPG15 complex binds PI3P, senses membrane curvature and remodels membranes
  in vitro, and is required to initiate autolysosome tubulation. Bi-allelic loss-of-function and
  recurrent missense alleles of AP5B1 cause recessive macular dystrophy, and the protein is present
  in human retinal pigment epithelium in puncta that overlap Rab7-positive late endosomes and, partly,
  the trans-Golgi network.'
references:
- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO terms
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: 'The InterPro2GO pipeline reference behind the single IEA row. Checked at source
      rather than assumed: the InterPro API returns IPR038741 as a family-type entry named "AP-5
      complex subunit beta-1" whose only GO mapping is GO:0016197 endosomal transport. The signature
      is AP5B1-specific, not a pan-adaptin one, so the mapping cannot reach proteins outside this
      orthologue group.'
- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The PAINT reference behind both IBA rows. The committed family slice interpro/panther/PTHR34033/PTHR34033-paint.tsv
      shows a single node, PTN002145545, at taxon:2759, carrying exactly the two IBD assertions that
      appear as IBAs here, each seeded by UniProtKB:Q2VPB7 alone.
- id: PMID:17897319
  title: Integral and associated lysosomal membrane proteins.
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Source of the HDA lysosomal-membrane row. Abstract-only in the cache. A broad proteomics
      projection - QuickGO returns 246 annotations across 242 distinct entities for this reference
      - so it would be weak on its own, but the assignment it made in 2007 for a then-anonymous protein
      has since been confirmed three times by targeted work on AP-5. The abstract's "12 novel proteins
      of unknown functions" is where AP5B1 sat at the time. Missed by the deep research report.
- id: PMID:20613862
  title: A genome-scale DNA repair RNAi screen identifies SPG48 as a novel gene associated with hereditary
    spastic paraplegia.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Supplies four of the twelve IPI rows and is the study that identified zeta-5 and
      sigma-5. Its title is about a DNA repair screen, which is exactly why it is easy to dismiss:
      the full text shows reciprocal BAC-tagged immunoprecipitations in which AP5B1 (as DKFZp761E198)
      was itself one of the baits, establishing a five-protein complex. It also contains a measured
      negative for this gene - AP5B1 knockdown had no effect in the homologous-recombination assay,
      unlike three of its complex partners - which is why no DNA repair annotation belongs here.
      Not cited by the deep research report.'
- id: PMID:22022230
  title: The fifth adaptor protein complex.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'The single most important paper for this gene and the source of every AP5B1-specific
      experiment in GOA: the two-hybrid interaction mapped to residues 16-229, the destabilisation
      of mu-5 on AP5B1 knockdown, the CIMPR/Vps26 knockdown phenotype with four independent siRNAs,
      the electron microscopy, the clathrin-motif analysis, and the renaming of the protein to beta-5.
      It also corrected the database sequence, adding the missing N-terminal 57 residues to give
      the 878 aa entry that UniProt now carries. Has a published erratum (PLoS Biol 2012;10(3)) which
      does not touch any claim used here. Not cited by the deep research report, which cites the
      2013 follow-up instead.'
- id: PMID:23167973
  title: 'Adaptor protein complexes AP-4 and AP-5: new players in endosomal trafficking and progressive
    spastic paraplegia.'
  full_text_unavailable: true
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: A review, cited by the deep research report as its lowest-confidence item. Resolves
      to the paper described and is accurate, but it is secondary and pre-dates everything that decides
      this review. Retained for provenance of the deep-research assessment; no claim rests on it.
- id: PMID:23825025
  title: Interaction between AP-5 and the hereditary spastic paraplegia proteins SPG11 and SPG15.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Establishes the native hexamer and its 1:1:1:1:1:1 stoichiometry, the shared CIMPR
      phenotype across all six knockdowns, the late endosomal/lysosomal colocalisation, and the coat
      model in which AP-5 sorts, spastizin docks and spatacsin scaffolds. Abstract-only in the cache,
      but every claim used here is stated in the abstract. A narrow reference - QuickGO returns 8
      annotations across 4 entities - so it is a targeted study, not a projection.
- id: PMID:25416956
  title: A proteome-scale map of the human interactome network.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Proteome-scale binary yeast two-hybrid map; source of the CAMK2B and NIF3L1 IPI
      rows. Correctly cited and methodologically sound, but a 937-entity projection (24,599 annotations)
      in which AP5B1 contributes two cells. Neither partner appears anywhere in the AP-5 literature,
      which is why both rows are marked over-annotated rather than promoted or removed.
- id: PMID:26085577
  title: 'Loss of AP-5 results in accumulation of aberrant endolysosomes: defining a new type of
    lysosomal storage disease.'
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: 'Cited by the deep research report and independently verified. Supplies the loss-side
      counterpart to the lysosome-organisation annotation: patient fibroblasts and siRNA-treated
      HeLa cells accumulate multilamellar endolysosomal storage material. The evidence is on AP-5
      zeta and mu, not on beta-5 specifically, so it supports the complex-level claim and is used
      that way.'
- id: PMID:27392064
  title: Human Immunodeficiency Virus Type 2 (HIV-2) Gag Is Trafficked in an AP-3 and AP-5 Dependent
    Manner.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Cited by the deep research report; resolves to the paper described and its finding
      is real. Deliberately not annotated. The siRNA used is against AP5M1 ("AP-5u ON-TARGETplus
      AP5M1 J-015523-09"), not AP5B1, and a virus exploiting a host trafficking route is not a function
      of the host gene product. Recorded so that a later reviewer does not add a viral-process term
      on the strength of the title.
- id: PMID:29381698
  title: Role of the AP-5 adaptor protein complex in late endosome-to-Golgi retrieval.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The paper that resolved the direction of the trafficking defect, by CRISPR knockout
      of AP5Z1 with subcellular fractionation profiling and quantitative mass spectrometry. It is
      the basis for refining endosomal transport to retrograde transport, endosome to Golgi. It is
      also the clearest statement of what remains unknown - that nothing was known about AP-5's cargo
      - which is what keeps a cargo-adaptor molecular function out of this review. Evidence is at
      the level of the complex (AP5Z1 knockout), not of AP5B1.
- id: PMID:33464297
  title: Rag GTPases and phosphatidylinositol 3-phosphate mediate recruitment of the AP-5/SPG11/SPG15
    complex.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'The recruitment mechanism, and the paper that names AP5B1 explicitly as one of
      the four AP-5 subunits assembling with SPG11 into the SPG15-GFP complex. Important for what
      it places elsewhere: the PI3P contact is made by the spastizin FYVE domain, so no lipid-binding
      function is attributed to AP5B1 here. Also useful for its honest survey of conflicting localisation
      reports for this complex.'
- id: PMID:33961781
  title: Dual proteome-scale networks reveal cell-specific remodeling of the human interactome.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: BioPlex affinity-purification mass spectrometry; source of two IPI rows. A 2,196-entity
      projection across 9,514 annotations. Its SPG11 row is treated as informative only because that
      partner is independently established by four targeted studies; its CAMK2B row is marked over-annotated,
      as is the two-hybrid row for the same partner. Agreement between two high-throughput methods
      is not the same as independent functional support.
- id: PMID:40081374
  title: Bi-allelic variants in three genes encoding distinct subunits of the vesicular AP-5 complex
    cause hereditary macular dystrophy.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The newest reference the deep research report caught, and the basis for the NEW
      retina homeostasis row. Two families with bi-allelic AP5B1 alleles, all truncating and removing
      more than two-thirds of the protein, within a 19-family AP-5 cohort. It also contains the first
      subunit-specific localisation of AP5B1 protein, by immunofluorescence in human RPE explants
      and iPSC-RPE, showing puncta overlapping Rab7 and partially TGN46.
- id: PMID:40175557
  title: Structural basis for membrane remodeling by the AP5-SPG11-SPG15 complex.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Cryo-EM of the SPG11-SPG15 and AP5-SPG11-SPG15 assemblies; AP5B1 residues 1-878
      are chain B of PDB 8YAB and 8YAH. Source of the in vitro membrane-remodelling and curvature-sensing
      activity and of the autolysosome-tubulation role, and the reference ComplexPortal cites for
      four of the six NAS rows. Abstract-only in the cache, which is a real limitation here: it is
      why this review does not state which subunit provides the curvature-sensing surface or which
      one contacts SPG11.'
- id: PMID:41830174
  title: Bi-allelic variants in AP5Z1 and AP5B1 lead to retinal degeneration.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Independent replication cohort, five probands from Europe and Iran, including two
      carrying the recurrent AP5B1 p.Leu785Pro allele and one compound heterozygote with a frameshift.
      Published after the deep research run and found by independent Europe PMC searching. Corroborates
      the NEW row without being its primary citation.
- id: PMID:42568187
  title: The AP5B1 p.Leu785Pro variant is a frequent cause of late-onset macular dystrophy with variable
    extraocular manifestations.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The largest AP5B1-specific cohort, 22 affected individuals from 20 families, and
      the paper that establishes p.Leu785Pro as a founder allele in European and Ashkenazi Jewish
      populations with an odds ratio of 11.9 against gnomAD controls. Published after the deep research
      run and found by independent Europe PMC searching; it is the strongest single piece of human
      evidence that AP5B1 loss of function has a phenotype.
- id: file:human/AP5B1/AP5B1-uniprot.txt
  title: UniProtKB Q2VPB7 (AP5B1_HUMAN) flat file
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The curated record, checked to be the expected accession and not a merged one.
      Used for the 878-residue length, the PANTHER family assignment (PTHR34033, not the beta-adaptin
      family PTHR11134), the four AP5B1-specific InterPro/Pfam signatures, the ComplexPortal CPX-5181
      cross-reference, the PDB 8YAB chain assignment, the IntAct NbExp counts used to weigh the IPI
      rows, and the absence of any ACT_SITE or BINDING feature. Its FUNCTION line is notably hedged
      ("a probable fifth adaptor protein complex it may be involved in endosomal transport"), which
      matches how little is established about the molecular activity.
- id: file:human/AP5B1/AP5B1-deep-research-affinage.md
  title: Affinage mechanistic annotation for AP5B1 (human)
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: 'Machine-fetched provider record used as a lead, not as evidence. Trust gates clear
      (self_evaluation_pairwise win, faith 100%), the accession matches the local UniProt entry,
      the narrative describes the right protein with no symbol collision, and all seven citations
      are numeric PMIDs that resolve to the papers described. Its mechanism_profile GO grounding
      was not imported and would have been wrong if it had been: it proposes GO:0060090 molecular
      adaptor activity, which overstates what has been shown, given that AP-5''s cargo interaction
      is explicitly unknown. Recall was the weak point - it missed PMID:22022230 and PMID:20613862,
      the two papers containing every AP5B1-specific experiment in GOA, and the two 2026 disease
      cohorts. No supporting_text anywhere in this review cites this file, which leaves the "no annotations
      reference available deep research files" best-practice warning standing deliberately: a provider
      synthesis is a lead, and every claim it suggested was re-anchored to the primary source or
      to the UniProt record before being used.'
- id: file:human/AP5B1/AP5B1-bioinformatics/RESULTS.md
  title: 'AP5B1 (beta-5 adaptin): does it carry the beta-adaptin clathrin-binding apparatus?'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Analysis written for this review, fetching sequences from UniProt and domain boundaries
      and structural features from InterPro and UniProt at run time, with the four classical beta
      adaptins as controls. It re-tests the four 2011 claims about clathrin binding rather than repeating
      them, confirms three, and qualifies the fourth: the AP5B1 WDW is not in the solenoid on current
      records, though the validated W-box consensus PWxxW is absent and the conclusion is unchanged.
      It also establishes the PANTHER family separation that makes beta-adaptin term leakage impossible
      on this gene. States its own caveat about comparing family-specific and pan-family Pfam models.'
