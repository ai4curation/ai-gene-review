core_functions:
- description: 'Structural subunit of the AP-5 adaptor complex, and the component that holds it together.
    AP5B1 is the beta adaptin of AP-5: a long alpha-solenoid trunk whose N-terminal quarter, residues
    16-229, binds the medium subunit mu-5 in the same arrangement that beta subunits use in AP-1
    and AP-2, followed by an appendage that retains both the beta-sandwich and platform subdomains.
    The interaction is not merely physical - depleting AP5B1 lowers mu-5 protein levels, and the
    two knockdowns produce the same cellular phenotype - so AP5B1 contributes to the integrity of
    the complex rather than simply residing in it. In this position it acts in retrieval out of late
    endosomes back to the Golgi, a pathway that runs in parallel with retromer and takes over when
    retromer is compromised: knocking AP5B1 down traps the cation-independent mannose 6-phosphate
    receptor and the retromer subunit Vps26 in enlarged perinuclear compartments, and loss of the
    complex impairs return of CIMPR, GOLIM4 and GOLM1 to the Golgi. What AP5B1 does not do, despite
    the fold, is recruit clathrin: the complex is clathrin-independent and brefeldin A-insensitive,
    and AP5B1 has no clathrin-binding motif in an accessible position.'
  supported_by:
