  - Min-Yuan Su
suggested_experiments:
- hypothesis: AP-5 binds cargo directly through a mu-5 pocket homologous to the tyrosine-motif pocket
    of mu-1 and mu-2, and the retrieval defect on AP5B1 loss reflects failure of that recognition
    rather than failure of coat assembly alone.
  description: Express and purify the AP-5 core and the full AP-5/SPG11/SPG15 assembly, and test
    binding to the cytosolic tails of CIMPR, GOLIM4, GOLM1 and sortilin by ITC or biolayer interferometry.
    Use a mu-5 pocket mutant, and an AP5B1 subunit-deletion complex, as specificity controls. A positive
    result would license GO:0140312 cargo adaptor activity for the complex, which the present evidence
    does not.
  experiment_type: in vitro reconstitution and binding
- hypothesis: The beta-5 appendage is a functional accessory-protein docking platform, and p.Leu785Pro
    disrupts it rather than destabilising the whole protein.
  description: Use the isolated beta-5 appendage (approximately residues 690-878) as a GST or biotinylated
    bait against brain and iPSC-RPE lysate with quantitative mass spectrometry, running the p.Leu785Pro
    appendage as a paired bait. In parallel, express full-length wild-type and p.Leu785Pro AP5B1
    in AP5B1-null cells and measure protein stability, AP-5 assembly by blue-native PAGE, and rescue
    of CIMPR retrieval. This distinguishes a hypomorphic interface allele from a folding null.
  experiment_type: affinity proteomics plus structure-function rescue
- hypothesis: The subunit-specific phenotype spectrum reflects quantitative differences in residual
    complex assembly rather than moonlighting functions of individual subunits.
  description: Generate isogenic null lines for each of AP5Z1, AP5B1, AP5M1 and AP5S1 in both iPSC-RPE
    and iPSC-derived cortical neurons. Measure, for each, the abundance and assembly state of the
    remaining subunits and of SPG11 and SPG15, CIMPR retrieval, and endolysosomal morphology by electron
    microscopy. If all four nulls are equivalent in both cell types, the phenotype difference is
    not cell-autonomous complex biology and must be sought in expression or in modifier alleles.
  experiment_type: isogenic knockout panel with proteomic and morphological readouts
- hypothesis: AP-5 recruitment and autolysosome tubulation are the step that fails first in AP5B1-null
    retinal pigment epithelium, before any degeneration is visible.
  description: In AP5B1-null iPSC-RPE monolayers fed photoreceptor outer segments, follow autolysosome
    tubulation by live imaging after a starvation-refeeding protocol, with SPG15-GFP as the recruitment
    reporter and LAMP1 tubule counts as the readout. Compare with wild-type and with AP5Z1-null lines.
    This tests whether the disease-relevant defect is the reformation step identified in vitro, in
    the cell type that actually degenerates.
  experiment_type: live-cell imaging in a disease-relevant cell model
