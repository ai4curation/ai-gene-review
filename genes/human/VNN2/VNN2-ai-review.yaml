id: O95498
gene_symbol: VNN2
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: VNN2 encodes a second human vanin ectoenzyme, pantetheine hydrolase
  VNN2/GPI-80. Like VNN1, its displayed product has an N-terminal signal peptide,
  a nitrilase-like catalytic domain and a C-terminal GPI-anchor signal, placing the
  mature pantetheinase on the cell surface where it hydrolyses D-pantetheine to pantothenate
  and cysteamine. Alternative transcripts encode six UniProt isoforms, several of
  which are predicted to be degraded by nonsense-mediated decay.
