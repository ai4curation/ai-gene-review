- id: PMID:21785412
  title: A conformational switch in complexin is required for synaptotagmin to trigger synaptic fusion.
  findings:
  - statement: Human complexin binds a partially zippered SNARE complex via its central helix; a
      conformational switch of the accessory helix is required for synaptotagmin-Ca2+ to trigger fusion from
      the clamped state.
    supporting_text: In the structure, hCPX binds one partially-zippered SNARE complex via its central helix
      (CPXcen, residues 48–75)
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached full text; companion paper to PMID:21785414.
- id: PMID:21785414
  title: Complexin cross-links prefusion SNAREs into a zigzag array.
  findings:
  - statement: 'Crystal structure of complexin bound to a prefusion SNARE complex mimetic: the central helix binds
      one SNARE complex and the accessory helix bridges to a second, forming a zigzag array incompatible with fusion.'
    supporting_text: The 'central helix' of complexin is anchored to one SNARE complex, while its 'accessory
      helix' extends away at ~45° and bridges to a second complex
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached full text; uses human complexin-1 (source of UniProt's function statement).
- id: PMID:7553862
  title: 'Complexins: cytosolic proteins that regulate SNAP receptor function.'
  findings:
  - statement: Complexins are cytosolic proteins that bind strongly to the assembled SNARE core complex and
      compete with alpha-SNAP.
    supporting_text: Complexins bind weakly to syntaxin alone and not at all to synaptobrevin and SNAP-25, but
      strongly to the SNAP receptor-core complex composed of these three molecules.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only cache; discovery paper.
