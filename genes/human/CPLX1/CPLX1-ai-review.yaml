id: O14810
gene_symbol: CPLX1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'Complexin-1 (synaphin-2) is a small (134 aa), largely disordered, soluble presynaptic protein of the
  complexin/synaphin family, expressed in the nervous system and enriched in inhibitory neurons of hippocampus and
  cerebellum. Its central alpha-helix binds with high affinity and selectivity to the groove of the assembled neuronal
  SNARE complex (syntaxin-1, SNAP-25 and VAMP2/synaptobrevin-2) at the last step before membrane fusion. The N-terminal
  region promotes fast calcium-triggered synchronous neurotransmitter release in cooperation with synaptotagmin-1,
  while the accessory helix and the membrane-curvature-sensing C-terminal region suppress premature or spontaneous
  fusion; in the crystal structure of human complexin-1 with a prefusion SNARE mimetic, the accessory helix cross-links
  neighbouring SNARE complexes into a zigzag array. In mice, loss of complexins reduces the calcium sensitivity
  of release, and complexin-1 knockout causes ataxia; complexin-1 has also been implicated in glucose-induced insulin
  secretion. Biallelic loss-of-function variants cause developmental and epileptic encephalopathy 63.'
