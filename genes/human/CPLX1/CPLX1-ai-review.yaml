  - RGD:70945
  review:
    summary: SNARE binding. Complexin-1 binds the assembled syntaxin-1/SNAP-25/VAMP2 core complex through its
      central helix; this is the defining activity of the protein, shown with human complexin-1 crystallised
      on a prefusion SNARE complex mimetic.
    action: ACCEPT
    reason: Core molecular function, well supported by structural and biochemical work including on the human
      protein (PMID:21785414, PMID:21785412) and by the original binding studies (PMID:7553862). The IBA
      reflects a PAINT placement for the complexin family and is consistent.
    supported_by:
    - reference_id: PMID:21785412
      supporting_text: In the structure, hCPX binds one partially-zippered SNARE complex via its central helix
        (CPXcen, residues 48–75)
    - reference_id: file:human/CPLX1/CPLX1-uniprot.txt
      record_section: ["CC:SUBUNIT"]
      supporting_text: Binds to the SNARE core complex containing SNAP25, VAMP2 and STX1A.
