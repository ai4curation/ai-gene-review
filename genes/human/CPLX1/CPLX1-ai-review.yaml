- term:
    id: GO:0006836
    label: neurotransmitter transport
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR008849
  review:
    summary: Neurotransmitter transport (InterPro2GO from the Synaphin domain). True in the sense that
      complexin acts in neurotransmitter release by exocytosis, but general.
    action: MODIFY
    reason: Complexin does not transport neurotransmitter; its role is in the synaptic vesicle exocytosis that
      releases it. GO:0016079 synaptic vesicle exocytosis is a descendant of neurotransmitter transport and is
      already carried by the gene.
    proposed_replacement_terms:
    - id: GO:0016079
      label: synaptic vesicle exocytosis
    supported_by:
    - reference_id: file:human/CPLX1/CPLX1-deep-research-claude-code.md
      supporting_text: a dramatically reduced transmitter release efficiency due to decreased Ca2+ sensitivity
        of the synaptic secretion process
- term:
    id: GO:0006887
    label: exocytosis
  evidence_type: TAS
  original_reference_id: PMID:7553862
  qualifier: involved_in
  review:
    summary: Exocytosis and chemical synaptic transmission (TAS, McMahon et al. 1995). Correct but general.
    action: MODIFY
    reason: The paper and later work place complexin in synaptic vesicle exocytosis specifically. GO:0016079
      synaptic vesicle exocytosis is a descendant of both exocytosis and chemical synaptic transmission and is
      already carried by the gene, so it is the appropriate refinement.
    proposed_replacement_terms:
    - id: GO:0016079
      label: synaptic vesicle exocytosis
    supported_by:
    - reference_id: PMID:7553862
      supporting_text: suggesting that the complexins regulate the sequential interactions of alpha-SNAP and
        synaptotagmins with the SNAP receptor during exocytosis
