core_functions:
- description: Binds the assembled neuronal SNARE complex (syntaxin-1, SNAP-25, VAMP2) through its central
    helix and regulates the final, calcium-triggered step of synaptic vesicle fusion with the presynaptic
    active-zone membrane, both promoting fast synchronous release and restraining premature (spontaneous)
    fusion.
  molecular_function:
    id: GO:0000149
    label: SNARE binding
  directly_involved_in:
  - id: GO:0031630
    label: regulation of synaptic vesicle fusion to presynaptic active zone membrane
  - id: GO:0016079
    label: synaptic vesicle exocytosis
  locations:
  - id: GO:0098793
    label: presynapse
  - id: GO:0005829
    label: cytosol
  in_complex:
    id: GO:0070032
    label: synaptobrevin 2-SNAP-25-syntaxin-1a-complexin I complex
  supported_by:
  - reference_id: PMID:21785412
    supporting_text: In the structure, hCPX binds one partially-zippered SNARE complex via its central helix
      (CPXcen, residues 48–75)
  - reference_id: PMID:7553862
    supporting_text: Complexins bind weakly to syntaxin alone and not at all to synaptobrevin and SNAP-25, but
      strongly to the SNAP receptor-core complex composed of these three molecules.
  - reference_id: file:human/CPLX1/CPLX1-deep-research-claude-code.md
    supporting_text: a dramatically reduced transmitter release efficiency due to decreased Ca2+ sensitivity
      of the synaptic secretion process
suggested_questions:
- question: Does complexin-1 act as a true clamp of spontaneous fusion at mammalian central synapses, given
    that knockdown studies report increased spontaneous release while constitutive and acute knockouts report
    reduced spontaneous and evoked release?
- question: Why does biallelic CPLX1 loss cause severe infantile epilepsy in humans while Cplx1 knockout mice
    show ataxia without a comparable seizure phenotype?
- question: Is the reported postsynaptic role of complexin in AMPA-receptor exocytosis during long-term
    potentiation a property of complexin-1 itself, and of the endogenous protein in dendrites?
suggested_experiments:
- description: Express DEE63 patient variants (C-terminal truncations 105-134 and 108-134, and Leu128Met) in
    Cplx1/Cplx2 double-knockout mouse or human iPSC-derived neurons and measure evoked synchronous release,
    calcium sensitivity and spontaneous release frequency by patch clamp.
  hypothesis: Loss of the C-terminal membrane-binding region abolishes the inhibitory (clamping) function of
    complexin-1 and alters calcium sensitivity of release, accounting for network hyperexcitability.
- description: Acute, conditional deletion of CPLX1 in human iPSC-derived inhibitory interneurons with
    measurement of spontaneous and evoked GABA release.
  hypothesis: Complexin-1 is required for high-fidelity release at inhibitory synapses, and its loss reduces
    inhibition more than excitation.
