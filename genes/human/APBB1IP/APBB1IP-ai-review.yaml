      unmasking of talin triggers integrin activation."] [PMID:26337492 "RIAM deficiency results in a
      loss of β2 integrin activation in multiple leukocyte populations, impaired leukocyte adhesion to
      inflamed vessels, and accumulation in the circulation."] [PMID:26324702 "These in vivo results confirm
      a role for RIAM in the regulation of some, but not all, leukocyte integrins"]'
