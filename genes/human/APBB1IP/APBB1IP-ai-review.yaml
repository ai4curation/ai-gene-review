  findings:
  - statement: ADAP/SKAP-55 relocalizes RIAM and Rap1 after TCR activation.
    supporting_text: Mechanistic studies revealed that the ADAP/SKAP-55 module relocalized RIAM and Rap1
      to the plasma membrane following TCR activation to facilitate integrin activation.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text; T cells.
- id: PMID:24287201
  title: The structure of Rap1 in complex with RIAM reveals specificity determinants and recruitment mechanism.
  findings:
  - statement: Rap1-RIAM crystal structure; Glu212 is the specificity determinant.
    supporting_text: Lys31 forms a salt bridge with RIAM residue Glu212, making it the key specificity
      determinant of the interaction.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text.
- id: PMID:25520155
  title: Conformational activation of talin by RIAM triggers integrin-mediated cell adhesion.
  findings:
  - statement: RIAM unmasks talin to trigger integrin activation.
    supporting_text: We further provide functional evidence that such RIAM-mediated steric unmasking of
      talin triggers integrin activation.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text.
- id: PMID:26419705
  title: A RIAM/lamellipodin-talin-integrin complex forms the tip of sticky fingers that guide cell migration.
  findings:
  - statement: RIAM-talin-integrin complexes sit at the tips of protrusions.
    supporting_text: This complex localizes at the tips of growing actin filaments in lamellipodial and
      filopodial protrusions, thus corresponding to the tips of the 'sticky fingers.'
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text.
- id: PMID:26337492
  title: Loss of the Rap1 effector RIAM results in leukocyte adhesion deficiency due to impaired β2 integrin
    function in mice.
  findings:
  - statement: RIAM-deficient mice lose leukocyte beta2-integrin activation.
    supporting_text: RIAM deficiency results in a loss of β2 integrin activation in multiple leukocyte
      populations, impaired leukocyte adhesion to inflamed vessels, and accumulation in the circulation.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text; mouse knockout.
- id: PMID:26324702
  title: Rap1 and its effector RIAM are required for lymphocyte trafficking.
  findings:
  - statement: RIAM-deficient mice have defective lymphocyte trafficking.
    supporting_text: These in vivo results confirm a role for RIAM in the regulation of some, but not
      all, leukocyte integrins
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text; mouse knockout.
- id: PMID:22946047
  title: Focal adhesion disassembly is regulated by a RIAM to MEK-1 pathway.
  findings:
  - statement: RIAM is needed for focal adhesion disassembly.
    supporting_text: RIAM depletion also weakened the association between FA proteins, suggesting that
      it has important adaptor roles in the correct assembly of adhesion complexes.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only; melanoma and breast carcinoma cells.
