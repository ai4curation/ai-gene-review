id: Q7Z5R6
gene_symbol: APBB1IP
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: APBB1IP (RIAM, Rap1-GTP-interacting adaptor molecule) is a cytoplasmic adaptor of the MRL
  (Mig-10/RIAM/lamellipodin) family. It has N-terminal talin-binding amphipathic helices, a Ras-association
  (RA) and pleckstrin-homology (PH) module, and proline-rich motifs that bind profilin and Ena/VASP. The
  RA-PH module binds GTP-bound Rap1 and membrane PIP2, bringing RIAM to the plasma membrane. There it
  recruits talin and, by binding the talin head, unmasks its integrin-binding site, driving inside-out
  integrin activation. RIAM localizes with talin and active integrins at the tips of lamellipodial and
  filopodial protrusions and regulates focal-adhesion turnover. In T cells it binds SKAP-55, linking the
  ADAP/SKAP-55 module to Rap1 after TCR stimulation. RIAM-deficient mice lose beta2-integrin activation
  in leukocytes and have defective lymphocyte adhesion and trafficking, while platelet integrin function
  is intact.
