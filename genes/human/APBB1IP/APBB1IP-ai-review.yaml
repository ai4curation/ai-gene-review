  original_reference_id: PMID:19098287
  qualifier: involved_in
  review:
    summary: Positive regulation of integrin activation (NEW, IMP). RIAM recruits and unmasks talin to
      activate integrins; mutants unable to bind Rap1 or talin fail to do so. RIAM-deficient mice lose
      leukocyte beta2-integrin activation. RIAM performs the recruitment step itself, matching RAP1B's
      annotation to this term.
