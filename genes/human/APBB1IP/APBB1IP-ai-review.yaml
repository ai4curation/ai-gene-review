core_functions:
- description: Rap1 effector adaptor that binds GTP-Rap1 and PIP2 at the plasma membrane, recruits talin
    and unmasks its integrin-binding site, driving inside-out integrin activation, notably of leukocyte
    beta2 integrins.
  molecular_function:
    id: GO:0030674
    label: protein-macromolecule adaptor activity
  directly_involved_in:
  - id: GO:0033625
    label: positive regulation of integrin activation
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:19098287
    supporting_text: MRL proteins function as scaffolds that connect the membrane targeting sequences
      in Ras GTPases to talin, thereby recruiting talin to the plasma membrane and activating integrins.
  - reference_id: PMID:19098287
    supporting_text: RIAM-induced integrin activation required both its capacity to bind to Rap1 and to
      talin.
  - reference_id: PMID:25520155
    supporting_text: We further provide functional evidence that such RIAM-mediated steric unmasking of
      talin triggers integrin activation.
  - reference_id: PMID:26337492
    supporting_text: RIAM deficiency results in a loss of β2 integrin activation in multiple leukocyte
      populations, impaired leukocyte adhesion to inflamed vessels, and accumulation in the circulation.
proposed_new_terms: []
suggested_questions:
- question: Is RIAM's actin-regulatory arm (profilin and Ena/VASP binding, lamellipodia formation) a separable
    function from talin recruitment, or a consequence of it? The current core function captures only the
    integrin-activation arm.
- question: Why do leukocyte beta2 integrins depend on RIAM while platelet integrins and alpha4beta1 do
    not, given talin is shared?
suggested_experiments:
- description: In human leukocytes, compare integrin activation after RIAM knockout versus mutants that
    cannot bind talin, Rap1, or PIP2.
