- id: PMID:33275877
  title: Phosphorylation of RIAM by src promotes integrin activation by unmasking the PH domain of RIAM.
  findings:
  - statement: PH-domain PIP2 binding brings RIAM to the membrane.
    supporting_text: This process requires the association of the pleckstrin homology (PH) domain of RIAM
      with the membrane PIP2.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text.
