core_functions:
- description: Golgi-resident subtilisin-like serine endopeptidase that performs the first (lumenal, RxxL-directed)
    cleavage in regulated intramembrane proteolysis of membrane-bound bZIP transcription factors, principally
    SREBP-1/-2 (sterol-regulated lipid synthesis) and ATF6/ATF6B (ER unfolded protein response), as well
    as CREB3-family transducers; the cleaved intermediates are then substrates for site-2 protease (MBTPS2).
  molecular_function:
    id: GO:0004252
    label: serine-type endopeptidase activity
  directly_involved_in:
  - id: GO:0031293
    label: membrane protein intracellular domain proteolysis
  - id: GO:0036500
    label: ATF6-mediated unfolded protein response
  - id: GO:0045542
    label: positive regulation of cholesterol biosynthetic process
  locations:
  - id: GO:0000139
    label: Golgi membrane
  supported_by:
  - *id011
  - *id018
  - *id017
  - *id021
  - *id002
- description: Proprotein convertase-type processing of non-transcription-factor substrates in the Golgi,
    notably cleavage of the GNPTAB alpha/beta precursor that activates GlcNAc-1-phosphotransferase for
    mannose-6-phosphate tagging of lysosomal enzymes, and removal of the FAM20C propeptide required for
    FAM20C secretion and kinase activity.
  molecular_function:
    id: GO:0004252
    label: serine-type endopeptidase activity
  directly_involved_in:
  - id: GO:0016485
    label: protein processing
  locations:
  - id: GO:0000139
    label: Golgi membrane
  supported_by:
  - *id012
  - *id013
  - *id015
  - reference_id: PMID:36096887
    supporting_text: MBTPS1 encodes site-1 protease (S1P), a Golgi-resident serine protease that is responsible
      for the proteolytic cleavage of multiple substrates, including GNPTAB, SREBP1/2, and ATF6
suggested_questions:
- question: Should the S1P/S2P proteases carry GO:0032933 SREBP signaling pathway? In human, mouse and
    rat it is held by SCAP, INSIG1/2, SREBF1/2 and ERLIN1/2 but by no protease, while the parallel ATF6
    pathway term (GO:0036500) is annotated to S1P and S2P.
- question: How does a mitochondrial pool of S1P arise given its ER signal peptide and lumenal catalytic
    domain, and is the reported protease-independent stabilization of ETFA/ETFB reproducible in other
    cell types?
- question: What determines substrate selection in SEDKF patients with about 1% residual S1P, where SREBP
    processing is preserved but BBF2H7 and GNPTAB processing fail?
suggested_experiments:
- description: Titrate S1P activity (inducible knockdown or graded inhibitor PF-429242) in chondrocytes
    and fibroblasts and quantify processing of SREBP2, ATF6, CREB3L2 and GNPTAB in parallel to define
    substrate-specific sensitivity thresholds.
- description: Use protease-protection and organelle fractionation with epitope-tagged endogenous MBTPS1
    to test for, and map the topology of, the proposed mitochondrial S1P pool and its association with
    ETFA/ETFB.
