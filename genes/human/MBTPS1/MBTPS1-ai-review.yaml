id: Q14703
gene_symbol: MBTPS1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'MBTPS1 encodes site-1 protease (S1P, also SKI-1 or PCSK8), a Ca2+-dependent subtilisin-like
  serine protease of the proprotein convertase family. It is a type I membrane protein with a lumenal
  peptidase S8 catalytic domain, made as a zymogen whose propeptide is removed autocatalytically in the
  ER. The mature enzyme acts mainly in the Golgi membrane, and a soluble form is also shed. Unlike the
  basic-residue-directed convertases, S1P cleaves after hydrophobic or small residues in R-X-hydrophobic-X
  motifs. It makes the first, lumenal cleavage in the regulated intramembrane proteolysis of membrane-bound
  transcription factors: SREBP-1 and SREBP-2 (after SCAP escorts them to the Golgi when sterols are low),
  ATF6 and ATF6B during the unfolded protein response, and the CREB3 family (LUMAN, OASIS/CREB3L1, BBF2H7/CREB3L2,
  CREB-H/CREB3L3). Site-2 protease (MBTPS2) then cuts within the membrane to release the transcriptionally
  active N-terminal domains. S1P also processes non-transcription-factor proproteins. Its cleavage of
  the GNPTAB alpha/beta precursor activates GlcNAc-1-phosphotransferase for mannose-6-phosphate tagging
  of lysosomal enzymes. It also processes FAM20C, the secretory-pathway kinase, as well as pro-BDNF and
  arenavirus glycoproteins. Through these substrates S1P controls lipid synthesis, the ER stress response,
  lysosome biogenesis, collagen export and skeletal development. Biallelic hypomorphic variants cause
  spondyloepiphyseal dysplasia Kondo-Fu type. A mitochondrial pool that stabilizes the ETFA/ETFB complex
  has also been reported, and variants are linked to CAOP syndrome.'
