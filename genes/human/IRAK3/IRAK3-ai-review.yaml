id: Q9Y616
gene_symbol: IRAK3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: IRAK3, also called IRAK-M, is an IRAK-family pseudokinase that regulates Toll-like and interleukin-1
  receptor signaling. It participates in receptor-associated signaling assemblies and restrains inflammatory
  activation by stabilizing MyD88-associated IRAK complexes. Its death domain and kinase-like domain mediate
  protein interactions, and its effects depend on cellular context and stimulus history.
