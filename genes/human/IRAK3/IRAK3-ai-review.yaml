- term:
    id: GO:0000287
    label: magnesium ion binding
  evidence_type: IDA
  original_reference_id: PMID:10383454
  qualifier: enables
  review:
    summary: Human IRAK3 lacks the Mg2+-coordinating DFG motif (replaced by DFA) and recombinant pseudokinase domain
      shows no thermal shift with MgCl2 or Mg-ATP.
    action: REMOVE
    reason: Magnesium ion binding in kinases is a property of the catalytic Mg-ATP complex. The IRAK3 structure
      paper shows the DFG motif is altered to DFA, the catalytic HRD is replaced by CGS, and MgCl2 or MgCl2 plus
      ATP produced no thermal stabilisation of the IRAK3 pseudokinase domain, whereas IRAK2 was stabilised. The
      1999 report itself describes only negligible autophosphorylation. This is a directly contradicted claim rather
      than an absence of evidence, so the term is removed for both the IDA and the ARBA/Compara-derived IEA row.
    supported_by:
    - &id001
      reference_id: PMID:33238146
      supporting_text: The canonical catalytic “HRD”-motif is missing entirely in IRAK3 and replaced with “CGS,”
        whereas the Mg2+-coordinating “DFG”-motif is slightly altered to “DFA.”
    - &id002
      reference_id: PMID:33238146
      supporting_text: In agreement with the structure-guided predictions, MgCl2 and ATP did not induce significant
        thermal shifts in IRAK3, while the addition of staurosporine resulted in a +7.9°C shift of the melting temperature.
    - &id006
      reference_id: PMID:10383454
      supporting_text: Although IRAK-M and IRAK-2 exhibit only a negligible autophosphorylation activity, they can
        reconstitute the IL-1 response in a 293 mutant cell line lacking IRAK.
