id: Q9Y616
gene_symbol: IRAK3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: IRAK3 (IRAK-M) is a member of the IL-1 receptor-associated kinase family composed of an N-terminal
  death domain, a central pseudokinase domain and a C-terminal region with a TRAF6-binding motif. Unlike IRAK1 and
  IRAK4 it lacks the catalytic HRD aspartate (replaced by CGS) and an intact Mg-binding DFG motif, binds ATP only
  weakly and has no established kinase activity. Expressed mainly in monocytes, macrophages, dendritic cells and
  lung epithelium and induced by Toll-like receptor stimulation, IRAK3 is incorporated into MyD88-IRAK4 receptor-proximal
  complexes, where it retains IRAK1 and IRAK4 on MyD88, blocks IRAK1-TRAF6 coupling and redirects signaling to a
  MEKK3-dependent second wave of NF-kB that induces inhibitory genes. The net effect is negative feedback on TLR
  and IL-1 receptor signaling, limiting cytokine production by macrophages and contributing to endotoxin tolerance.
  Its pseudokinase domain forms a head-to-head homodimer and transiently engages phosphorylated IRAK4. In IL-33-stimulated
  dendritic cells, PIN1 isomerisation of phospho-Ser110 IRAK3 promotes its nuclear translocation and induction of
  selected inflammatory genes. IRAK3 is primarily cytoplasmic. Variants are associated with early-onset persistent
  asthma.
