  evidence_type: EXP
  original_reference_id: PMID:29686383
  qualifier: located_in
  review:
    summary: IRAK3 is detected in the nucleus in resting cells and translocates there on IL-33/PIN1 signaling.
    action: KEEP_AS_NON_CORE
    reason: IRAK3 is present in both cytoplasm and nucleus in resting cells and becomes exclusively cytoplasmic
      after Pam3CSK4, while IL-33 stimulation drives PIN1-dependent nuclear translocation in dendritic cells. Nuclear
      localisation is a stimulus-specific mode rather than the main site of action at receptor-proximal complexes,
      so it is kept as non-core. The IBA (PTN000784925) is a deep kinase node; it agrees with the direct observations.
