- term:
    id: GO:0005524
    label: ATP binding
  evidence_type: IDA
  original_reference_id: PMID:10383454
  qualifier: enables
  review:
    summary: IRAK3 binds ATP only weakly (Kd about 196 uM) and Mg-independently; the pocket may be nucleotide-occupied
      at cellular ATP levels.
    action: KEEP_AS_NON_CORE
    reason: Thermal shift and isothermal analyses show weak ATP binding (estimated Kd 196 uM), with the authors
      concluding the pocket may be nucleotide-bound at cellular millimolar ATP; UniProt records low-affinity ATP
      binding from this work. ATP binding is therefore supported but is not catalytic and not the core function,
      so it is kept as non-core.
    supported_by:
    - &id010
      reference_id: PMID:33238146
      supporting_text: while IRAK3 is a weak ATP-binder with an estimated Kd of 196 ± 19 μM at 45°C
    - &id011
      reference_id: PMID:33238146
      supporting_text: Collectively, our results therefore suggest that the ATP-binding pocket of IRAK3 may be nucleotide-bound
        at cellular ATP concentrations.
    - &id012
      reference_id: file:human/IRAK3/IRAK3-uniprot.txt
      record_section: ["CC:DOMAIN"]
      supporting_text: The nucleotide binding domain binds ATP with low affinity.
