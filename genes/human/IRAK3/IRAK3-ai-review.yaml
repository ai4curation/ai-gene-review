suggested_questions:
- question: Does IRAK3 have physiologically relevant guanylate cyclase activity in its pseudokinase domain, and
    does cGMP production contribute to its inhibition of NF-kB?
- question: Is the proposed IRAK3-IRAK4 C-lobe hetero-oligomer the mechanism by which IRAK3 retains IRAK4 on MyD88
    in cells?
- question: What does nuclear IRAK3 do after IL-33/PIN1 signaling, and is nuclear translocation conserved in human
    dendritic cells?
suggested_experiments:
- description: Reconstitute IRAK3-deficient human macrophages with dimer-disrupting (L210E) or IRAK4-interface (C-lobe)
    mutants and measure IRAK1 release from MyD88 and cytokine output.
- description: Quantify cGMP production by purified full-length IRAK3 versus guanylate-cyclase-centre mutants under
    physiological nucleotide concentrations.
