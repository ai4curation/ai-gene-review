  review:
    summary: Context-specific positive effect on cytokine expression, transferred from mouse Irak3 by Ensembl Compara.
    action: KEEP_AS_NON_CORE
    reason: The predominant physiological role of IRAK3 is to restrain TLR/IL-1R-induced cytokine production, but
