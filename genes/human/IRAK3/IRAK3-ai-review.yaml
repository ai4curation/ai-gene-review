  qualifier: enables
  supporting_entities:
  - UniProtKB:Q9NWZ3
  review:
    summary: 'protein kinase binding: The human IRAK3 structural study establishes homodimerization and
      an interaction surface involved in IRAK4 regulation. Protein association rather than catalysis supplies
      the molecular mechanism.'
    action: ACCEPT
    reason: The human IRAK3 structural study establishes homodimerization and an interaction surface involved
      in IRAK4 regulation. Protein association rather than catalysis supplies the molecular mechanism.
    supported_by: &id016
    - reference_id: PMID:33238146
      supporting_text: 'IRAK3

        dimerizes in a unique way through a head-to-head arrangement not observed in any

        other kinases. Multiple conserved cysteine residues imply a potential redox

        control of IRAK3 conformation and dimerization. By analyzing asthma-associated

        mutations, we identify an evolutionarily conserved surface on IRAK3 that could

        form an interaction interface with IRAK4, suggesting a model for the negative

        regulation of IRAK4 by IRAK3.'
    - *id006
