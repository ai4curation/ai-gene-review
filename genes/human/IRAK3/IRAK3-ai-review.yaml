  review:
    summary: IRAK3 acts within MyD88-dependent TLR signaling as a component of the MyD88-IRAK4 receptor complex.
    action: ACCEPT
    reason: IRAK3 is induced by TLR stimulation, binds the MyD88-IRAK4 complex through its death domain (Trp74 surface),
      forms an IRAK-M myddosome that drives MEKK3-dependent second-wave NF-kB activation, and prevents release of
      IRAK1/IRAK4 from MyD88. It therefore does part of the work of the MyD88-dependent pathway (as a feedback component),
      which justifies participation. The original 1999 paper showed IRAK-M reconstitutes IL-1 responses and that
      IRAK family members are required for LPS signal transduction.
    supported_by:
    - *id004
    - &id014
      reference_id: PMID:38268724
      supporting_text: Surface 1, with central residue Trp74, binds to MyD88/IRAK-4.
    - &id015
      reference_id: PMID:23376919
      supporting_text: IRAK-M was also able to interact with MyD88-IRAK-4 to form IRAK-M Myddosome to mediate TLR7-induced
        MEKK3-dependent second wave NFκB activation
    - &id020
      reference_id: PMID:10383454
      supporting_text: In addition, we show for the first time that members of the IRAK family are indispensable
        elements of lipopolysaccharide signal transduction.
- term:
    id: GO:0004672
    label: protein kinase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q8K4B2
  - ensembl:ENSMUSP00000020448
  review:
    summary: 'IRAK3 is a pseudokinase: the catalytic HRD aspartate is replaced (CGS, Ser-293), Mg-binding DFG is
      DFA, and only negligible autophosphorylation was reported.'
    action: REMOVE
    reason: Protein kinase activity requires a catalytic aspartate that IRAK3 lacks (HRD replaced by CGS), and this
      substitution is conserved across 134 vertebrate IRAK3 orthologues. The discovery paper reports only negligible
      autophosphorylation, the structure paper describes IRAK3 as a pseudokinase lacking catalytic activity, and
      no physiological phosphorylation substrate has been identified. UniProt flags the active-site substitution
      in a curated CAUTION. The kinase-domain fold is used for protein interaction (head-to-head homodimer, transient
      complex with phosphorylated IRAK4), not phosphotransfer. Transfer of protein kinase activity from the catalytically
      active IRAK1/IRAK4 subfamilies is not justified for the IRAK3 subfamily (PTHR24419:SF7). Removed for all rows
      of this claim.
    supported_by:
    - &id007
      reference_id: PMID:33238146
      supporting_text: In contrast to the active kinases IRAK1 and IRAK4, IRAK2 and IRAK3 are pseudokinases lacking
        catalytic activity and their functions are poorly understood.
    - *id001
    - &id008
      reference_id: file:human/IRAK3/IRAK3-uniprot.txt
      record_section: ["CC:CAUTION"]
      supporting_text: Ser-293 is present instead of the conserved Asp which is expected to be an active site residue.
