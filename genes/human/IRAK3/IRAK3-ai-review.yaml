      the catalytic residues are absent.
    action: REMOVE
    reason: 'Protein kinase activity requires a catalytic aspartate that IRAK3 lacks (HRD replaced by CGS), and
      this substitution is conserved across 134 vertebrate IRAK3 orthologues. The discovery paper reports only negligible
      autophosphorylation, the structure paper describes IRAK3 as a pseudokinase lacking catalytic activity, and
      no physiological phosphorylation substrate has been identified. UniProt flags the active-site substitution
      in a curated CAUTION. The kinase-domain fold is used for protein interaction (head-to-head homodimer, transient
      complex with phosphorylated IRAK4), not phosphotransfer. Transfer of protein kinase activity from the catalytically
      active IRAK1/IRAK4 subfamilies is not justified for the IRAK3 subfamily (PTHR24419:SF7). Removed for all rows
      of this claim. The same reasoning applies to protein phosphorylation as a process: IRAK3 regulates phosphorylation
      of other IRAKs indirectly (by retaining IRAK1/IRAK4 on MyD88), which is captured by the regulatory process
      terms, but it does not perform phosphorylation.'
    supported_by:
    - *id006
    - *id007
    - *id001
