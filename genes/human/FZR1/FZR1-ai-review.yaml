- id: file:human/FZR1/FZR1-uniprot.txt
  title: UniProtKB record for human FZR1 (Q9UM11)
  findings:
  - statement: >-
      UniProt describes FZR1 as the substrate-specific adapter that associates with the APC/C in
      late mitosis, replacing CDC20, and activates it during anaphase and telophase; it is phosphorylated
      at G1/S and dissociates from the APC/C.
  - statement: >-
      Isoform 2 (major) is nuclear and isoform 3 (minor) is cytoplasmic; FZR1 is deacetylated by
      SIRT2 at Lys-69/Lys-159, dephosphorylated by CDC14B after DNA damage, and ubiquitinated by
      SCF(CCNF).
- id: file:human/FZR1/FZR1-deep-research-falcon.md
  title: Falcon (Edison) deep-research report for human FZR1
  findings:
  - statement: >-
      Synthesis describing FZR1 as the non-catalytic WD40 substrate receptor/coactivator of the APC/C
      active from late mitosis through G1 and in post-mitotic cells, with dynamic nuclear/chromatin
      and cytosolic localisation.
  - statement: >-
      Notes that some proposed neuronal APC/C-Cdh1 substrates were not confirmed when the core subunit
      APC4 was deleted, so FZR1-only phenotypes should not be assumed to reflect the ligase.
core_functions:
- description: >-
    Substrate receptor of the APC/C: the FZR1 WD40 propeller recognises D-box, KEN-box and ABBA degrons
    on cell-cycle proteins (mitotic cyclins, PLK1, AURKA, CDC20, SKP2, CDC6, geminin, TK1, RRM2,
    claspin, cyclin F, HECW2, SASS6) and, with APC10, forms the bipartite D-box receptor that presents
    them to the APC2-APC11 catalytic module for K11-linked polyubiquitination and proteasomal degradation.
  molecular_function:
