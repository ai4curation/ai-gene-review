    reference_section_type: ABSTRACT
- description: >-
    APC/C coactivator: unphosphorylated FZR1 binds the APC/C through its C-box and IR tail from late
    anaphase through G1 (replacing CDC20 as CDK1 activity falls), repositioning the catalytic module
    and increasing APC/C affinity for its E2 enzymes, so that mitotic regulators are cleared, mitotic
    exit is completed and G1 is maintained; the interaction is blocked by cyclin A/CDK2 phosphorylation
    and EMI1, and promoted by CDC14B dephosphorylation, SIRT2 deacetylation and nuclear PTEN.
