  review:
    summary: >-
      IPI with RRM2 (ribonucleotide reductase M2). The cached abstract covers the cyclin F/G2 arm
      of RRM2 turnover; RRM2 is an established KEN-box APC/C-Cdh1 substrate in late mitosis/G1 (mouse
      R2), and the curator, who read the full text, recorded the FZR1-RRM2 interaction from this
      paper. The functional content of this interaction is degron-dependent substrate recruitment
      by the FZR1 WD40 propeller for APC/C-mediated ubiquitination.
    action: MODIFY
