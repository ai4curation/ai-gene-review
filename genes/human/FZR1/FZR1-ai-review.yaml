- term:
    id: GO:0007095
    label: mitotic G2 DNA damage checkpoint signaling
  evidence_type: IDA
  original_reference_id: PMID:18662541
  qualifier: involved_in
  review:
    summary: >-
      After genotoxic stress in G2, Cdc14B dephosphorylates Cdh1, re-activating APC/C-Cdh1 to degrade
      PLK1; loss of PLK1 stabilises Claspin and Wee1 and enforces the G2 checkpoint. A constitutively
      active Cdh1(4xA) mutant bypasses the need for Cdc14B. FZR1 does the work of the step (substrate
      recognition of PLK1) rather than merely being required for it.
    action: ACCEPT
    reason: >-
      Well-controlled IDA with full text cached; a specific, mechanistically defined checkpoint role
      of the FZR1-APC/C ligase, also reflected in UniProt's function annotation.
    supported_by:
    - reference_id: PMID:18662541
      supporting_text: >-
        in response to genotoxic stress in G2, the phosphatase Cdc14B translocates from the nucleolus
        to the nucleoplasm and induces the activation of the ubiquitin ligase APC/C(Cdh1), with the
        consequent degradation of Plk1, a prominent mitotic kinase
      reference_section_type: ABSTRACT
    - reference_id: PMID:18662541
      supporting_text: >-
        Cdh1-dependent degradation of Plk1 is required for an efficient DNA damage-induced G2 checkpoint
      reference_section_type: RESULTS
- term:
    id: GO:0007346
    label: regulation of mitotic cell cycle
  evidence_type: NAS
  original_reference_id: PMID:15678131
  qualifier: involved_in
  review:
    summary: >-
      Review-derived statement that APC/C-Cdh1 regulates the mitotic cell cycle. True but very general;
      the specific, well-evidenced cell-cycle role of FZR1 not otherwise captured is that APC/C-Cdh1
      keeps cyclin A/SKP2/CDC6 and other S-phase promoters low during G1, so that Cdh1 overexpression
      imposes a G1 block and Cdh1 inactivation (CDK phosphorylation, Emi1) is required for S-phase
      entry.
    action: MODIFY
    reason: >-
      The generic term should be replaced by the more specific GO:2000134 negative regulation of
      G1/S transition of mitotic cell cycle, which the pombe ortholog srw1/ste9 already carries (IGI),
      and which is supported here by Cdh1-overexpression G1 arrest and by the requirement to inhibit
      APC/C-Cdh1 for S-phase entry.
    proposed_replacement_terms:
    - id: GO:2000134
      label: negative regulation of G1/S transition of mitotic cell cycle
    additional_reference_ids:
    - PMID:11988738
    - PMID:18662541
    supported_by:
    - reference_id: PMID:11988738
      supporting_text: >-
        hEmi1 overexpression accelerates S phase entry and can override a G1 block caused by overexpression
        of Cdh1
      reference_section_type: ABSTRACT
    - reference_id: PMID:18662541
      supporting_text: >-
        in late M, Cdc20 is replaced by Cdh1, the second activator of APC/C. During G1, APC/CCdh1
        remains active to ensure that certain positive regulators of the cell cycle do not accumulate
        prematurely
      reference_section_type: INTRODUCTION
    - reference_id: PMID:20802534
      supporting_text: Cdh1-activated APC leads to the exit of mitosis and maintenance of a stable
        G1 phase
      reference_section_type: INTRODUCTION
- term:
    id: GO:0008284
    label: positive regulation of cell population proliferation
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q9R1K5
  - ensembl:ENSMUSP00000114203
  review:
    summary: >-
      Ensembl Compara transfer of a mouse IMP (PMID:21241890) in which Cdh1 knockdown affected proliferation
      of Pten-deficient MEFs. The direct molecular role of APC/C-Cdh1 is to restrain cell-cycle entry
      (G1 maintenance, degradation of SKP2, cyclin A, CDC6); proliferation phenotypes in knockout
      cells arise indirectly through senescence, genome instability and checkpoint effects.
