      Generic protein binding is uninformative. The cited work documents RRM2 (ribonucleotide reductase
      M2) as an APC/C-Cdh1 substrate whose recognition by FZR1 leads to ubiquitination and proteasomal
      degradation, which is exactly the ubiquitin-like ligase-substrate adaptor activity (GO:1990756)
      that FZR1 already carries by IDA (PMID:14701726). Removing the generic term does not dispute
      the interaction.
