    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:10548110
  qualifier: enables
  supporting_entities:
  - UniProtKB:P30260
  review:
    summary: >-
      IPI with the APC/C core subunit CDC27 (ANAPC3). Lukas et al. showed that non-phosphorylatable
      Cdh1 assembles with APC even in S phase, defining the CDK-phosphorylation switch that controls
      Cdh1-APC/C association. The informative molecular function behind this interaction is FZR1's
      docking onto the APC/C as its coactivator, i.e. anaphase-promoting complex binding.
    action: MODIFY
    reason: >-
      Generic protein binding carries no functional information. The CDC27 interaction is the coactivator-APC/C
      association through which FZR1 exerts every one of its functions (C-box/IR-tail docking onto
      APC3/APC8, structurally resolved in PMID:26083744 and PMID:27120157), so the row is better
      expressed as GO:0010997 anaphase-promoting complex binding, which the gene already carries
      by IBA/IEA.
    proposed_replacement_terms:
    - id: GO:0010997
      label: anaphase-promoting complex binding
    supported_by:
    - reference_id: PMID:10548110
      supporting_text: >-
        Phosphorylation-deficient mutant Cdh1 or immunodepletion of cyclin A resulted in assembly
        of active Cdh1-APC even in S-phase cells
