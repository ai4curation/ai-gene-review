- term:
    id: GO:0005680
    label: anaphase-promoting complex
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: part_of
  supporting_entities:
  - FB:FBgn0001086
  - FB:FBgn0262699
  - PANTHER:PTN000460086
  - SGD:S000002971
  - SGD:S000003084
  - SGD:S000003457
  review:
    summary: >-
      PAINT node PTN000460086 (Cdc20/Fizzy family) assigns APC/C membership to the coactivators.
      FZR1 is the transiently bound substrate-recognition coactivator rather than a constitutive
      core subunit; GO conventionally uses part_of APC/C for Cdc20-family activators (compare slp1,
      CDC20, yeast CDH1), and human FZR1 has been resolved bound to the APC/C by cryo-EM (PDB 4UI9).
    action: ACCEPT
    reason: >-
      Phylogenetic inference agrees with direct structural and biochemical evidence that FZR1 assembles
      with the APC/C to form the active APC/C-Cdh1 ligase.
    supported_by:
    - reference_id: file:human/FZR1/FZR1-uniprot.txt
      supporting_text: STRUCTURE BY ELECTRON MICROSCOPY (3.60 ANGSTROMS) IN COMPLEX WITH APC/C
    - reference_id: PMID:27120157
      supporting_text: >-
        both coactivators associate with the APC/C through their common C-box and Ile-Arg tail motifs
      reference_section_type: ABSTRACT
