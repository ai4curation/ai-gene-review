suggested_questions:
- question: >-
    GO represents FZR1's activation of the APC/C both as a molecular function (GO:1990757 ubiquitin
    ligase activator activity, IBA) and as a process (GO:1904668 positive regulation of ubiquitin
    protein ligase activity, IDA). Should the process-level term be retired for direct coactivators
    in favour of the MF term plus GO:1905786, as proposed here?
- question: >-
    Several APC/C-Cdh1 substrates are recorded on FZR1 only as generic IPI protein-binding rows (PLK1,
    CLSPN, RAD17, RRM2, SKP2, HECW2, CCNF, SASS6). Would curators support converting these to GO:1990756
    ubiquitin-like ligase-substrate adaptor activity with 'has input' extensions, so that the substrate
    relationships become machine-readable?
- question: >-
    The neuronal and post-mitotic roles of FZR1 (chromatin-protein clearance, neurodevelopment, DEE109)
    are documented mainly in mouse and Drosophila. Which, if any, should be annotated to human FZR1
    given that some proposed neuronal substrates were not confirmed when the core subunit APC4 was
    deleted?
suggested_experiments:
- hypothesis: >-
    DEE109 missense variants (D187G/N, N333K) impair APC/C-Cdh1 substrate-adaptor and coactivator
    activity by disrupting the WD40 degron-binding surface or the APC/C-docking interface.
  description: >-
    Reconstitute human APC/C with wild-type and variant FZR1, measure APC/C binding (C-box/IR-tail
    dependent) and D-box/KEN-box peptide affinity, and quantify ubiquitination of PLK1, TK1 and INCENP
    with UBE2C/UBE2S; complement with rescue of FZR1-null cells for G1 length and mitotic-protein
    clearance.
  experiment_type: in vitro reconstitution and mutational rescue
- hypothesis: >-
    The cyclin F/APC/C-Cdh1 reciprocal circuit sets the timing of S-phase entry in human cells.
  description: >-
    Use degron-mutant FZR1 (N-terminal D-box/Cy motif) and non-degradable cyclin F in single-cell
    live imaging of APC/C-Cdh1 activity reporters to test whether disrupting either arm of the feedback
    advances or delays G1/S.
  experiment_type: live-cell imaging with degron mutants
