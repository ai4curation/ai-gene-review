id: Q9UM11
gene_symbol: FZR1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  FZR1 (Cdh1, fizzy-related protein 1) is one of the two WD40 beta-propeller coactivators of the
  anaphase-promoting complex/cyclosome (APC/C), the multisubunit RING E3 ubiquitin ligase that drives
  mitotic exit and G1. FZR1 docks onto the APC/C core through its N-terminal C-box and C-terminal
  IR tail, which repositions the APC2-APC11 catalytic module and raises the affinity of the APC/C
  for its E2 enzymes, and it recognises D-box, KEN-box and ABBA degrons on substrates through its
  propeller, forming a bipartite D-box receptor with APC10. It is not itself catalytic. APC/C-Cdh1
  takes over from APC/C-Cdc20 in late anaphase once CDK1 activity falls and remains active through
  telophase and G1, directing ubiquitination (largely K11-linked chains built by UBE2C/UBE2S) and
  proteasomal degradation of mitotic cyclins, PLK1, Aurora kinases, CDC20, SKP2, CDC6, geminin, TK1,
  RRM2, claspin and many other cell-cycle regulators, thereby keeping CDK activity low, completing
  mitotic exit and restraining S-phase entry. Its activity is switched off at G1/S by cyclin A/CDK2
  phosphorylation, which dissociates it from the APC/C, by the pseudosubstrate inhibitor EMI1/FBXO5,
  and by SCF(cyclin F)-mediated degradation; it is re-engaged by CDC14B dephosphorylation, SIRT2
  deacetylation and nuclear PTEN. After DNA damage in G2, Cdc14B-dependent reactivation of APC/C-Cdh1
  degrades PLK1 to enforce the G2 checkpoint, and Cdh1-directed turnover of RAD17 and CtIP shapes
  checkpoint termination and DNA-repair pathway choice. FZR1 is predominantly nuclear with a smaller
  cytoplasmic pool. Beyond proliferating cells, APC/C-Cdh1 acts in quiescent and post-mitotic cells,
  including neurons, to clear mitotic and chromatin proteins and support differentiation and neuronal
  development; heterozygous de novo loss-of-function FZR1 variants cause developmental and epileptic
  encephalopathy (DEE109).
