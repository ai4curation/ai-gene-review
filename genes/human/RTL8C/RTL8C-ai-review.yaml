- term:
    id: GO:0045732
    label: positive regulation of protein catabolic process
  evidence_type: IMP
  original_reference_id: PMID:40680123
  qualifier: involved_in
  review:
    summary: >-
      RTL8 is required for UBQLN2-mediated turnover of PEG10: adding RTL8C back to RTL8-knockout
      cells lowers PEG10 gag-pol, and after RTL8 knockdown UBQLN2 no longer reduces PEG10.
    action: NEW
    reason: >-
      RTL8 is the essential adaptor enabling UBQLN2-dependent degradation of PEG10, contributing
      the bridging activity the catabolic step depends on. Supported by loss/add-back experiments.
      Applies by paralog identity.
    supported_by:
    - reference_id: PMID:40680123
      supporting_text: RTL8 is an essential partner for the UBQLN2-mediated turnover of PEG10
