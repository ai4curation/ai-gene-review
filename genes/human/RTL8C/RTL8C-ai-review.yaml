id: A6ZKI3
gene_symbol: RTL8C
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  RTL8C (retrotransposon Gag-like protein 8C; also CXX1, FAM127A, MAR8/MAR8C) is one of three
  near-identical X-linked human paralogs (RTL8A/B/C, the FAM127 family) domesticated from a
  Ty3/gypsy sushi-ichi-related LTR retrotransposon, and is the paralog most used as the
  representative in functional studies. The ~113-residue protein corresponds to a single truncated
  retroviral Gag capsid (CA)-like domain and lacks the CCHC knuckle, protease and
  reverse-transcriptase/integrase regions, so it is a non-catalytic capsid-derived
  protein-interaction module. RTL8 proteins bridge the retroelement capsid protein PEG10 and the
  ubiquitin-proteasome shuttle factor UBQLN2: RTL8 binds the PEG10 N-terminal capsid and is
  incorporated into PEG10 virus-like particles while inhibiting their formation/release; it binds
  UBQLN2 and promotes its translocation to nucleoli and stress granules; and it is required for
  UBQLN2-mediated regulation and turnover of PEG10. The three paralogs are nearly identical and
  are studied collectively.
