core_functions:
- description: >-
    Capsid-derived protein-macromolecule adaptor that bridges the retroelement capsid protein
    PEG10 and the ubiquitin-proteasome shuttle factor UBQLN2, promoting UBQLN2 translocation to
    nucleoli and stress granules and enabling UBQLN2-mediated regulation and turnover of PEG10.
  molecular_function:
    id: GO:0030674
    label: protein-macromolecule adaptor activity
  directly_involved_in:
  - id: GO:1900182
    label: positive regulation of protein localization to nucleus
  - id: GO:0045732
    label: positive regulation of protein catabolic process
  locations:
  - id: GO:0005730
    label: nucleolus
  - id: GO:0010494
    label: cytoplasmic stress granule
  supported_by:
  - reference_id: PMID:40680123
    supporting_text: RTL8 confers on UBQLN2 the ability to complex with and regulate PEG10
  - reference_id: PMID:35247097
    supporting_text: RTL8 promotes nuclear translocation of UBQLN2
  knowledge_gaps:
  - gap_statement: >-
      Whether this RTL8 paralog has any function distinct from its siblings, and the structural
      basis and regulation of its PEG10/UBQLN2 bridging, are undetermined; functional work could
      not resolve the individual paralogs.
    gap_kind:
    - BIOLOGY
proposed_new_terms: []
suggested_questions:
- question: >-
    Do the three near-identical RTL8 paralogs have distinct expression or functions, or are they
    functionally redundant dosage copies?
- question: >-
    Is RTL8's inhibition of PEG10 VLP formation mechanistically separable from its promotion of
    UBQLN2-mediated PEG10 turnover?
suggested_experiments:
- hypothesis: >-
    RTL8 acts as an adaptor whose N terminus couples UBQLN2 to PEG10.
  description: >-
    Reconstitute RTL8, UBQLN2 and PEG10 (wild-type vs RTL8 N-terminal deletion) and measure
    complex formation, PEG10 VLP output and UBQLN2-mediated PEG10 degradation.
- hypothesis: >-
    Individual RTL8 paralogs differ functionally.
  description: >-
    Generate paralog-specific knockouts/knock-ins and compare PEG10/UBQLN2 handling, localization
    and neuronal phenotypes.
