id: O14965
gene_symbol: AURKA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: AURKA (Aurora kinase A) is a mitotic serine/threonine kinase concentrated at centrosomes
  and spindle-pole microtubules from late G2 to anaphase. Activated by autophosphorylation in its activation
  loop and by cofactors such as TPX2, BORA and Ajuba, it drives centrosome maturation and separation,
  bipolar spindle assembly, and mitotic entry. Among other routes, it initiates CDK1 activation at centrosomes
  and activates PLK1. It phosphorylates many substrates, including TPX2, TACC3, NDEL1, CDC25B, BRCA1,
  p53 and HURP. Outside mitosis it acts at the ciliary basal body, where NEDD9-activated AURKA phosphorylates
  HDAC6 to disassemble the primary cilium, and it phosphorylates RALA to promote mitotic mitochondrial
  fission. AURKA is frequently amplified and overexpressed in cancers.
