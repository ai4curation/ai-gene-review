suggested_questions:
- question: How much of AURKA's ciliary-disassembly activity in vivo depends on HDAC6 versus other basal-body
    substrates (e.g. KIF2A-associated pathways, INPP5E, or Ca2+/calmodulin-dependent activation), and
    is the HEF1/NEDD9 activator required in all ciliated cell types or only in serum-stimulated cultured
    cells?
- question: AURKA binds and stabilizes N-Myc independently of catalytic activity. Should this non-catalytic
    scaffold/protein-stabilization role be represented by a GO molecular function or process term for
    AURKA, and which entity performs the stabilizing step (AURKA by competing with FBXW7)?
- question: GO has no specific 'centrosome maturation' term; AURKA's best-documented centrosomal role
    is annotated to the broader 'centrosome cycle'. Would a dedicated term be warranted for AURKA, PLK1,
    CEP192 and pericentrin?
suggested_experiments:
- description: Analog-sensitive AURKA in ciliated RPE1 cells with acute inhibition during serum-induced
    resorption, combined with basal-body proximity proteomics and phosphoproteomics, to identify direct
    ciliary substrates beyond HDAC6 and separate ciliary from mitotic roles.
- description: Kinase-dead versus N-Myc-binding-deficient AURKA separation-of-function alleles in MYCN-amplified
    neuroblastoma cells to quantify catalytic versus scaffold contributions to N-Myc stability.
