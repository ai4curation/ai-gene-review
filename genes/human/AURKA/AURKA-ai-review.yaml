id: O14965
gene_symbol: AURKA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Aurora kinase A (AURKA, Aurora-A/STK15/BTAK) is a serine/threonine protein kinase of the
  Aurora/Ipl1 family whose levels and activity peak in G2 and mitosis and which is degraded by the APC/C-Cdh1
  at mitotic exit. It is activated by autophosphorylation on Thr288 in its activation loop, promoted by
  binding partners TPX2, Ajuba, BORA and others. At centrosomes AURKA drives centrosome maturation and
  separation and initiates mitotic entry by phosphorylating PLK1 (with BORA) and promoting CDK1-cyclin
  B1 activation; on spindle-pole microtubules, TPX2-bound AURKA promotes microtubule nucleation and bipolar
  spindle assembly through substrates such as TACC3, HURP and MCRS1. AURKA also phosphorylates p53, BRCA1,
  CDC25B and other substrates and stabilizes N-Myc in a kinase-independent manner. Outside mitosis, AURKA
  is activated at the ciliary basal body by NEDD9/HEF1 and Pitchfork and phosphorylates HDAC6 to trigger
  primary cilium disassembly. AURKA is frequently amplified or overexpressed in cancers, where it causes
  centrosome amplification and aneuploidy, and is a target of clinical inhibitors such as alisertib.
