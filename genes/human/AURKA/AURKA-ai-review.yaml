- term:
    id: GO:0000212
    label: meiotic spindle organization
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR030611
  review:
    summary: Meiotic spindle organization (IEA). In mouse oocytes, AURKA inhibition with MLN8237 shortens
      the meiotic spindle and disrupts acentriolar MTOC organization. AURKA activity is therefore needed
      for meiotic spindle-pole focusing. This is mammalian ortholog evidence, and the mitotic roles remain
      the core ones, so it is kept as non-core.
    action: KEEP_AS_NON_CORE
    reason: '[PMID:31895686 "Taken together, our current data reveal a critical role for AURKA activity
      in regulating microtubule dynamics, spindle pole focusing, and the maintenance of oocyte aMTOC organization
      at assembled meiotic spindles."] [PMID:31895686 "MI oocytes treated with MLN8237 showed similar
      alterations, exhibiting significantly shorter spindles with highly focused poles, as well as loss
      of aMTOC organization with bright CEP215 and increased chromosome misalignment (Supplemental Fig.
      1)."]'
    supported_by:
    - reference_id: PMID:31895686
      supporting_text: Taken together, our current data reveal a critical role for AURKA activity in regulating
        microtubule dynamics, spindle pole focusing, and the maintenance of oocyte aMTOC organization
        at assembled meiotic spindles.
    - reference_id: PMID:31895686
      supporting_text: MI oocytes treated with MLN8237 showed similar alterations, exhibiting significantly
        shorter spindles with highly focused poles, as well as loss of aMTOC organization with bright
        CEP215 and increased chromosome misalignment (Supplemental Fig. 1).
