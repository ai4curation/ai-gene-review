- id: file:human/AURKA/AURKA-deep-research-affinage.md
  title: Affinage mechanistic annotation for AURKA (human)
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: 'Trust gates clear; the mitotic and ciliary mechanisms match UniProt curation. Three
      of its citations were cached and used directly: PMID:31895686 (meiotic rows), PMID:37083534 (CEP192)
      and PMID:26782714 (nuclear hnRNP K role).'
core_functions:
- description: Mitotic serine/threonine kinase at centrosomes and spindle poles that drives centrosome
    maturation and separation, bipolar spindle assembly and mitotic entry.
  molecular_function:
    id: GO:0004674
    label: protein serine/threonine kinase activity
  directly_involved_in:
  - id: GO:0007052
    label: mitotic spindle organization
  - id: GO:0007100
    label: mitotic centrosome separation
  - id: GO:0046605
    label: regulation of centrosome cycle
  - id: GO:0000086
    label: G2/M transition of mitotic cell cycle
  locations:
  - id: GO:0005813
    label: centrosome
  - id: GO:0000922
    label: spindle pole
  supported_by:
  - reference_id: file:human/AURKA/AURKA-uniprot.txt
    supporting_text: 'CC   -!- FUNCTION: Mitotic serine/threonine kinase that contributes to the'
  - reference_id: file:human/AURKA/AURKA-uniprot.txt
    supporting_text: CC       the establishment of mitotic spindle, centrosome duplication,
  - reference_id: file:human/AURKA/AURKA-uniprot.txt
    supporting_text: CC       centrosome separation as well as maturation, chromosomal alignment,
  - reference_id: file:human/AURKA/AURKA-uniprot.txt
    supporting_text: 'CC   -!- SUBCELLULAR LOCATION: Cytoplasm, cytoskeleton, microtubule organizing'
  - reference_id: PMID:13678582
    supporting_text: We found that initial activation of Aurora-A in late G2 phase of the cell cycle is
      essential for recruitment of the cyclin B1-Cdk1 complex to centrosomes, where it becomes activated
      and commits cells to mitosis.
  - reference_id: PMID:18566290
    supporting_text: Bora accumulates in the G2 phase and promotes Aur-A-mediated activation of Polo-like
      kinase 1 (Plk1), leading to the activation of cyclin-dependent kinase 1 and mitotic entry.
  - reference_id: PMID:37083534
    supporting_text: Here, we identified a conserved region of CEP192, the major cofactor of AURKA, that
      mediates the interaction with AURKA.
- description: At the ciliary basal body, NEDD9-activated AURKA phosphorylates HDAC6 to drive primary
    cilium disassembly.
  molecular_function:
    id: GO:0004674
    label: protein serine/threonine kinase activity
  directly_involved_in:
  - id: GO:0061523
    label: cilium disassembly
  locations:
  - id: GO:0036064
    label: ciliary basal body
  supported_by:
  - reference_id: PMID:17604723
    supporting_text: Here, we show that interactions between the prometastatic scaffolding protein HEF1/Cas-L/NEDD9
      and the oncogenic Aurora A (AurA) kinase at the basal body of cilia causes phosphorylation and activation
      of HDAC6, a tubulin deacetylase, promoting ciliary disassembly.
  - reference_id: file:human/AURKA/AURKA-uniprot.txt
    supporting_text: CC       outgrowth (By similarity). Required for cilia disassembly via
proposed_new_terms: []
suggested_questions:
- question: Which AURKA functions depend on its catalytic activity and which on scaffolding (for example
    N-Myc stabilization, or nuclear hnRNP K-dependent MYC transactivation), and are the latter separable
    in cells?
- question: How do the TPX2 and CEP192 activation routes divide AURKA activity between the spindle and
    the centrosome?
- question: Does AURKA have a direct role in human oocyte meiotic spindle assembly comparable to that
    shown in mouse oocytes?
suggested_experiments:
- description: Compare kinase-dead and analog-sensitive AURKA alleles in human cells for centrosome, spindle,
    cilium-disassembly and N-Myc-stabilization phenotypes.
- description: Express AURKA variants that cannot bind TPX2 or CEP192 to separate the spindle and centrosomal
    activation pools.
