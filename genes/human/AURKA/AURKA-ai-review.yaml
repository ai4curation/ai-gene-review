core_functions:
- description: 'Mitotic entry and centrosome maturation kinase: activated by Thr288 autophosphorylation
    with Ajuba/BORA/TPX2 at centrosomes in late G2, AURKA phosphorylates PLK1 (Thr210), enables centrosomal
    CDK1-cyclin B1 activation, and drives centrosome maturation and separation.'
  supported_by:
  - *id003
  - *id004
  - *id020
  - reference_id: file:human/AURKA/AURKA-deep-research-falcon.md
    supporting_text: Human AURKA is best annotated as a *spatially regulated serine/threonine kinase that
      drives mitotic entry and constructs a functional bipolar spindle*
