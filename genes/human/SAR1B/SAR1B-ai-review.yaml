      supporting_text: Secretion-associated Ras-related GTPase 1 (SAR1) is a small GTPase that is part of COPII
        and, upon GTP binding, recruits the other COPII proteins to the endoplasmic reticulum membrane.
- term:
    id: GO:0003924
    label: GTPase activity
  evidence_type: EXP
  original_reference_id: PMID:32358066
  qualifier: enables
  review:
    summary: SAR1B is a small GTPase of the SAR1/ARF family; GTP hydrolysis drives COPII coat turnover (EXP).
    action: ACCEPT
    reason: GTP binding and hydrolysis are the core enzymatic activity of SAR1B. Human SAR1B GTPase activity was
      measured directly (PMID:32358066; PMID:36369712, which reports a Vmax and crystal structures of SAR1B with
      GDP and GTP), and SEC23 acts as its GAP during coat cycling.
