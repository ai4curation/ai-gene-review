    - reference_id: PMID:32358066
      supporting_text: Secretion-associated Ras-related GTPase 1 (SAR1) is a small GTPase that is part of COPII
        and, upon GTP binding, recruits the other COPII proteins to the endoplasmic reticulum membrane.
    - reference_id: PMID:36369712
      supporting_text: the alarmone ppGpp could bind to and inhibit the GTPase activity of human Sar1a but could
        not inhibit the GTPase activity of human Sar1b.
    - reference_id: PMID:36594468
      supporting_text: SEC23 also functions as the GTPase-activating protein for SAR1 and stimulates SAR1 GTP hydrolysis.
