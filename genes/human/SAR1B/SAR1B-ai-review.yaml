  supported_by:
  - reference_id: PMID:32358066
    supporting_text: Secretion-associated Ras-related GTPase 1 (SAR1) is a small GTPase that is part of COPII and,
      upon GTP binding, recruits the other COPII proteins to the endoplasmic reticulum membrane.
  - reference_id: PMID:36369712
    supporting_text: the alarmone ppGpp could bind to and inhibit the GTPase activity of human Sar1a but could not
      inhibit the GTPase activity of human Sar1b.
  - reference_id: PMID:36594468
    supporting_text: GTP-bound SAR1 inserts its hydrophobic N-terminus into the ER membrane and recruits SEC23-SEC24
      heterodimers to the ER exit site
  - reference_id: PMID:36594468
    supporting_text: SEC23 also functions as the GTPase-activating protein for SAR1 and stimulates SAR1 GTP hydrolysis.
  - reference_id: PMID:23433038
    supporting_text: We report that depletion of these two mammalian forms of Sar1 disrupts COPII assembly and the
      cells fail to organize transitional elements that coordinate classical ER-to-Golgi protein transfer.
- description: 'Paralog-specific role in ER export of large apolipoprotein B-containing lipoproteins: SAR1B, with
    the cargo receptor SURF4, is required for COPII-dependent export of pre-chylomicrons from enterocyte ER and
    of VLDL from hepatocytes. SAR1A does not substitute for it.'
  molecular_function:
    id: GO:0003924
    label: GTPase activity
  directly_involved_in:
  - id: GO:0042953
    label: lipoprotein transport
  - id: GO:0090110
    label: COPII-coated vesicle cargo loading
  locations:
  - id: GO:0070971
    label: endoplasmic reticulum exit site
  supported_by:
  - reference_id: PMID:32358066
    supporting_text: SAR1B knockdown caused loss of lipoprotein secretion, overexpression of SAR1B but not of SAR1A
      could restore secretion, and a divergent cluster adjacent to the SEC31/SEC23-binding site was critical for
      this SAR1B function.
  - reference_id: PMID:33186557
    supporting_text: Here, we show that this process is quantitatively governed by the GTPase SAR1B and SURF4, a
      high-efficiency cargo receptor.
  - reference_id: PMID:33186557
    supporting_text: hepatic inactivation of either mouse Sar1b or Surf4 selectively depletes plasma lipids to near-zero
      and protects the mice from atherosclerosis.
  - reference_id: PMID:12692552
    supporting_text: Our data suggest that chylomicrons, which vastly exceed the size of typical COPII vesicles,
      are selectively recruited by the COPII machinery for transport through the secretory pathways of the cell.
  - reference_id: PMID:28982670
    supporting_text: SAR1B deletion resulted in significantly decreased secretion of triglycerides (≈40%), apolipoprotein
      B-48 (≈57%), and chylomicron (≈34.5%).
- description: 'Leucine sensor upstream of mTORC1, independent of GTPase activity: in leucine deficiency SAR1B binds
    GATOR2 (via MIOS) and inhibits mTORC1; leucine binding changes its conformation and releases GATOR2.'
  molecular_function:
    id: GO:0140785
    label: amino acid sensor activity
  directly_involved_in:
  - id: GO:1904262
    label: negative regulation of TORC1 signaling
  - id: GO:1990253
    label: cellular response to leucine starvation
  locations:
  - id: GO:0005829
    label: cytosol
  - id: GO:0005765
    label: lysosomal membrane
  supported_by:
  - reference_id: PMID:34290409
    supporting_text: Under conditions of leucine deficiency, SAR1B inhibits mTORC1 by physically targeting its activator
      GATOR2.
  - reference_id: PMID:34290409
    supporting_text: In conditions of leucine sufficiency, SAR1B binds to leucine, undergoes a conformational change
      and dissociates from GATOR2, which results in mTORC1 activation.
suggested_questions:
- question: How does SAR1B, together with SURF4 and other export factors, generate carriers large enough for pre-chylomicrons
    and VLDL, given that these particles far exceed the size of a typical COPII vesicle?
- question: Are the COPII and leucine-sensing roles of SAR1B separable in enterocytes and hepatocytes, and does
    leucine availability affect lipoprotein export?
- question: What sets the partial redundancy between SAR1A and SAR1B in intestinal chylomicron export, and why does
    upregulation of SAR1A in patient duodenum fail to compensate?
suggested_experiments:
- description: Reconstitute SEC12-dependent SAR1B and SAR1A loading and SEC23A recruitment on liposomes with matched
    patient missense alleles (e.g. D137N, S179R, G185V), measuring nucleotide exchange, GTP hydrolysis, SEC23 binding
    and membrane insertion.
  hypothesis: Chylomicron retention disease missense alleles disrupt distinct steps of the SAR1B GTPase cycle or
    its SEC23 interaction.
  experiment_type: in vitro biochemical reconstitution
