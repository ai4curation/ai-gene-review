    label: antigen processing and presentation of peptide antigen via MHC class I
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-983169
  qualifier: involved_in
  review:
    summary: Reactome places COPII-dependent ER export within its class I MHC antigen processing pathway.
    action: MARK_AS_OVER_ANNOTATED
    reason: SAR1B is included because general COPII ER export is a step in MHC class I trafficking in the Reactome
      pathway. It has no specific role in antigen processing or presentation, and this inherits a pathway-level
      label onto a general secretory component.
    supported_by:
