id: Q9Y6B6
gene_symbol: SAR1B
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'SAR1B is a small GTPase of the SAR1/ARF family that starts the formation of COPII-coated transport
  carriers at endoplasmic reticulum exit sites. GDP-bound SAR1B is cytosolic; the ER-membrane guanine nucleotide
  exchange factor PREB/SEC12 loads it with GTP, and GTP-bound SAR1B inserts an N-terminal amphipathic helix into
  the ER membrane and recruits the SEC23-SEC24 inner coat, which captures cargo and recruits the SEC13-SEC31 outer
  coat. SEC23 then stimulates GTP hydrolysis, driving coat turnover. Compared with its close paralog SAR1A, SAR1B
  binds SEC23A more strongly and is specifically required, together with the cargo receptor SURF4, for ER export
  of large apolipoprotein B-containing lipoproteins: chylomicrons in enterocytes and VLDL in hepatocytes. Biallelic
  loss-of-function variants cause chylomicron retention disease (Anderson disease). Independently of its GTPase
  activity, SAR1B also binds leucine and, when leucine is scarce, associates with GATOR2 to inhibit mTORC1 signalling.'
