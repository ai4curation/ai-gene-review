core_functions:
- description: 'GTP-switch GTPase that nucleates the COPII coat at ER exit sites: SEC12-loaded SAR1B-GTP inserts
    into the ER membrane and recruits SEC23-SEC24 (then SEC13-SEC31), initiating cargo capture and carrier budding
    for ER-to-Golgi transport; SEC23-stimulated GTP hydrolysis drives coat turnover.'
