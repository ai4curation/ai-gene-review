  - bytes: 3257
    sha256: 992475baee3fb5a3300d9d66add04ec7c256242a4bb63f958faf14425f6f69d9
    blob: b4371360b4854ed0369f12bf2f245c93eecc1497
    mode: '100644'
    relative_path: reactome/R-HSA-190704.md
    header:
      stable_id: R-HSA-190704
      display_name: Oligomerization of connexins into connexons
      species: Homo sapiens
      summary: The mechanism of connexin assembly into connexons has been well characterized. Two different
        types of connexons can be formed. A connexon containing six identical connexin molecules is referred
        to as an homomeric connexon, while a connexon containing at least two different connexin molecules
        is referred to as an heteromeric connexon. The connexin molecules making up an heteromeric connexon
        appear to belong to only one subgroup (alpha or beta); heteromeric connexons containing both alpha
        and beta subunits have not yet been observed. Indeed, an intrinsic signal in four amino acid positions
        appears to confer different physicochemical characteristics to certain connexins in the alpha and beta
        groups (Lagr et al., 2003). These intrinsic signals are Cx specific, however (see Gemel et al., 2006).
        Therefore, additional yet unknown signals are required to regulate connexin compatibility and hetero-oligomerization.
        <br>The identification of the subcellular location at which gap junction assembly occurs has proven
        difficult. One explanation for this difficulty may be that the location of oligomerization  for each
        connexon varies depending upon Cx type or cell type. Oligomerization has been observed after ER membrane
        insertion (Cx43, Cx32, Cx26) (Falk et al., 1997; Ahmad et al., 1999; Ahmad and Evans, 2002), in the
        ER-Golgi-intermediate compartment (ERGIC) (Cx32) (Diez et al. 1999)  and inside the trans-Goligi network
        (Cx43) (Musil and Goodenough, 1993).
  - bytes: 1566
    sha256: 8e6ebd8875a8ae93fa53f8f5042b84c07fa519e64556fc7b2f22be301c1f2aae
    blob: 99a1686a20a6b1ffb0b9d65b0a41f2da0af42a26
    mode: '100644'
    relative_path: reactome/R-HSA-190827.md
    header:
      stable_id: R-HSA-190827
      display_name: Transport of connexins along the secretory pathway
      species: Homo sapiens
      summary: 'Connexins follow the classical secretory transport route from the ER to the plasma membrane:
        ER -> ERGIC -> Golgi -> TGN (Trans Golgi Network)  -> PM (Plasma Membrane).  All connexins assemble
        or oligomerize into hexameric connexons. The site of  assembly  varies and depends on Cx isoform, or
        cell type (see Koval et al., 2006).<br>Oligomerization of connexins has been observed during ER membrane
        insertion (Cx32), just after exit from the ER,  in the ER-Golgi-intermediate compartment (Cx26) and
        inside the  Trans-Golgi Network  (Cx43) (Falk et al. 1997; Ahmad et al. 1999; Musil and Goodenough
        1993; Diez et al. 1999). '
  - bytes: 1545
    sha256: 8d0f4a241fd9b626f151dbacd2223894693bc1da8e28f6ffd913e366bbe4a763
    blob: 8c45dd2a0a4638fe3daa620afd35300524e33e04
    mode: '100644'
    relative_path: reactome/R-HSA-190861.md
    header:
      stable_id: R-HSA-190861
      display_name: Gap junction assembly
      species: Homo sapiens
      summary: The assembly of gap junctions involves (1) synthesis of connexin polypeptides at endoplasmic
        reticulum membranes, (2) oligomerization into homomeric- and heteromeric gap junction connexons (hemi-channels),
        (3) passage through the Golgi stacks, (4) intracellular storage within Trans Golgi membranes, (5) trafficking
        along microtubules, (6) insertion of connexons into the plasma membrane, (7) lateral diffusion of connexons
        in the plasma membrane, (8) aggregation of individual gap junction channels into plaques, and (9) stabilization
        of peripheral microtubule plus-ends by binding to Cx43-based gap junctions (see Segretain and Falk,
        2004.)
  - bytes: 1531
    sha256: e23e44c884847a2030e1aa48e29cc80f0e4e790063b58fae8362774d976d98f0
    blob: a440babf3747d0949e2b0b3742916a11e5178f06
    mode: '100644'
    relative_path: reactome/R-HSA-190872.md
    header:
      stable_id: R-HSA-190872
      display_name: Transport of connexons to the plasma membrane
      species: Homo sapiens
      summary: Following connexon oligomerization, the hemichannels must be transported to the plasma membrane.
        This has been shown to occur in transport vesicles called "cargo containers".  Most of post-Golgi cargo
        containers have a diameter of of 50- 200 nm (Lauf et al., 2002). Recently direct transport of connexins
        to GJ assembly sides has been described (Shaw et al., 2007). Besides microtuble-dependent trafficking,
        a microtubule-independent delivery pathway may exist as concluded from  studies using the secretory
        transport inhibitor, Brefeldin A  (Musil and Goodenough 1993; De Sousa et al. 1993; Laird et al. 1995).
  - bytes: 1133
    sha256: b656c5942b5d83dbc90d195328af1e2c5f70508a14b117148fdbc2df37f591f5
    blob: 82821376ac5ad0bc2bda2f7634999d903edd82f3
    mode: '100644'
    relative_path: reactome/R-HSA-451056.md
    header:
      stable_id: R-HSA-451056
      display_name: Microtubule-independent trafficking of connexons to the plasma membrane
      species: Homo sapiens
      summary: Connexons may also traffic using a microtubule-independent mechanism. A few studies suggest
        that rough ER membranes can directly transfer connexons to the plasma membrane (Martin et al. 2001;
        Bloom and Goldstein 1998). Other cytoskeletal components, such as actin filaments, might be involved
        in the delivery of connexons to gap junction plaques (Thomas et al. 2001; Gilleron et al. 2006).
