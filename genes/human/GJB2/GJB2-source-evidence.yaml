      header:
        stable_id: R-HSA-190861
        display_name: Gap junction assembly
        species: Homo sapiens
        summary: The assembly of gap junctions involves (1) synthesis of connexin polypeptides at endoplasmic
          reticulum membranes, (2) oligomerization into homomeric- and heteromeric gap junction connexons (hemi-channels),
          (3) passage through the Golgi stacks, (4) intracellular storage within Trans Golgi membranes, (5)
          trafficking along microtubules, (6) insertion of connexons into the plasma membrane, (7) lateral
          diffusion of connexons in the plasma membrane, (8) aggregation of individual gap junction channels
          into plaques, and (9) stabilization of peripheral microtubule plus-ends by binding to Cx43-based
          gap junctions (see Segretain and Falk, 2004.)
