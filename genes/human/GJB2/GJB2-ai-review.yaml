description: GJB2 encodes connexin-26, a 226-residue membrane protein with four transmembrane helices. It assembles
  into connexons that dock between neighboring cells, forming channels for ionic and small-molecule exchange.
  These channels support electrical and metabolic communication. Pathogenic variants cause hearing loss and,
  in some allelic contexts, skin disorders.
