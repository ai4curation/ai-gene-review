    relevance: HIGH
    correctness: VERIFIED
    review_notes: Authentic event transports a human Cx26 hexamer from ERGIC to plasma membrane. Both complexes
      resolve to six P29033 subunits, residues 1–226. No catalyst is represented. This is a cargo relationship
      and compartment transition; the reaction-level cytosol label is not a soluble localization of its membrane-embedded
      cargo.
