suggested_questions:
- question: Which complete historical HuRI clone sequence corresponds to the incoming TBXA2R accession Q0VAB0,
    given the K7ER80 source product and C136/R136 difference?
- question: Does the original rat developmental-expression source establish participation in inner-ear development
    beyond spatial and temporal expression, and how should that evidence constrain the inherited human annotation?
- question: Can the reported nuclear role of connexin-26 be reproduced with resolved sample and genome-alignment
    provenance, and separated from indirect effects of altered intercellular coupling?
- question: Under endogenous conditions, which Cx26-dependent signals use docked junctions versus undocked
    connexons, and how can extracellular ATP-mediated effects be separated experimentally?
suggested_experiments:
- description: Test endogenous nuclear localization and any transcriptional effect with validated compartment
    controls and separation-of-function channel variants; distinguish chromatin association from purified sequence-specific
    DNA contact.
  experiment_type: Localization, controlled functional separation and direct binding
