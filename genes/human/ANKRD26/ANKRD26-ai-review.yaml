  review:
    summary: ANKRD26 docks PIDD1 at centriolar distal appendages.
    action: NEW
    reason: Two independent studies map a PIDD1-binding region and separate ANKRD26 centriolar localization
      from PIDD1 recruitment by deletion and rescue experiments. This establishes a physical recruiting
      activity. ANKRD26 is not assigned PIDD1 autoproteolysis or caspase-2 chemistry, and is not established
      as an integral scaffold holding the mature PIDDosome together. The generic adaptor term captures
      the demonstrated docking mechanism without inventing a partner-specific term.
    additional_reference_ids:
