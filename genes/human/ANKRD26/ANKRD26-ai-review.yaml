  id: NCBITaxon:9606
  label: Homo sapiens
description: ANKRD26 is an ankyrin-repeat-containing protein with distinct membrane-associated and centriolar
  functions. Its N-terminal region binds membranes through an amphipathic element and senses membrane
  curvature through ankyrin repeats. At mature centrioles, a coiled-coil region recruits PIDD1 to distal
  appendages, coupling centrosome number to PIDDosome signaling. ANKRD26 also affects cytokine-receptor
  internalization and signaling in hematopoietic cells. Regulatory-region variants that disrupt its normal
  downregulation during megakaryocyte differentiation cause inherited thrombocytopenia with predisposition
  to myeloid malignancy. Its interaction with transcriptional coregulators and effects on adipocyte differentiation
  provide additional cellular contexts.
