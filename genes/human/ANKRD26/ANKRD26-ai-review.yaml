- term:
    id: GO:0140090
    label: membrane curvature sensor activity
  evidence_type: IDA
  original_reference_id: PMID:38493476
  qualifier: enables
  review:
    summary: The ANKRD26 ankyrin-repeat region preferentially binds more strongly curved membranes.
    action: NEW
    reason: Purified human residues 45–217 bind small unilamellar vesicles more strongly than large ones
      in the original Figure 3 assay; Methods distinguish human and mouse constructs. This directly tests
      curvature preference. It is distinct from membrane bending, and the AML-associated truncated repeat
      region retains sensing despite impaired anchoring and shaping. The fragment assay does not specify
      a physiological lipid ligand or establish that the entire protein always occupies curved membranes.
    supported_by:
    - reference_id: PMID:38493476
