  review:
    summary: ANKRD26 localizes to the centrosomal region, including mature-centriolar distal appendages.
    action: ACCEPT
    reason: 'The available extraction of the original proteomics paper omits candidate-specific tables
      and the ANKRD26 localization image. Retain the experimental curator’s broad centrosome assertion:
      independent human-cell localization, recruitment and complementation experiments directly corroborate
