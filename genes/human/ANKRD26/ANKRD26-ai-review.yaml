    supporting_text: 'The distal appendage protein ANKRD26 is found to interact with and recruit the

      PIDDosome component PIDD1 to centriole distal appendages'
  - reference_id: PMID:33350486
- description: Senses membrane curvature through its N-terminal ankyrin repeats. An adjacent amphipathic
    element anchors the protein at the cytoplasmic plasma-membrane surface. Curvature sensing, anchoring
    and membrane shaping are experimentally distinguishable properties of this region.
  molecular_function:
    id: GO:0140090
    label: membrane curvature sensor activity
  locations:
  - id: GO:0009898
    label: cytoplasmic side of plasma membrane
  supported_by:
  - reference_id: PMID:38493476
suggested_questions:
- question: Which endogenous ANKRD26 interactions directly control type I cytokine-receptor internalization,
    as opposed to indirect associations detected by co-immunoprecipitation and proximity assays?
- question: How do ANKRD26 pools at centriolar distal appendages and the plasma membrane exchange during
    differentiation, and how do the two annotated alternative products differ?
- question: Does endogenous full-length ANKRD26 relocalize GPS2 or CCDC85B in human adipocyte precursors,
    reproducing the C-terminal-fragment effects observed in mouse 3T3-L1 cells?
suggested_experiments:
- description: Compare endogenous ANKRD26 rescue with membrane-anchor and PIDD1-binding mutants at matched
    expression, resolving receptor internalization, centriolar PIDD1 recruitment and differentiation phenotypes
    separately.
