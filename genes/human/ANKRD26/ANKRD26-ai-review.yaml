core_functions:
- description: Recruits PIDD1 to the distal appendages of mature centrioles, providing a docking step
    upstream of PIDDosome activation in response to excess centrosomes. The ANKRD26 recruitment region
    can be separated from its centriolar localization by deletion and complementation.
  molecular_function:
    id: GO:0030674
    label: protein-macromolecule adaptor activity
  locations:
  - id: GO:0005813
    label: centrosome
  supported_by:
