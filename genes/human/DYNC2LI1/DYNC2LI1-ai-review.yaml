id: Q8TCX1
gene_symbol: DYNC2LI1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'DYNC2LI1 (D2LIC, LIC3) is the light intermediate chain of cytoplasmic dynein-2, the retrograde
  intraflagellar transport (IFT) motor. It is a ~40 kDa protein with a Ras-like globular core that retains
  a P-loop nucleotide-binding pocket. It binds the tail of each dynein-2 heavy chain (DYNC2H1) to form
  the heavy-chain/light-intermediate-chain ("H1") subcomplex, stabilising the heavy-chain tails and the
  heavy chain itself. DYNC2LI1 is a non-catalytic accessory subunit: it is needed for dynein-2 stability
  and therefore for retrograde IFT, for clearance of IFT-B proteins from the ciliary tip, for control
  of primary cilium length, and for Hedgehog pathway regulation (repression of ciliary Smoothened entry,
  GLI3 processing). The protein is found in the cytoplasm, around centrosomes/basal bodies and the transition
  zone, and along the axoneme. Biallelic DYNC2LI1 variants cause short-rib thoracic dysplasia 15 with
  or without polydactyly. An early study also reported colocalisation with DHC2 at the Golgi apparatus.'
