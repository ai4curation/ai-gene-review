core_functions:
- description: Non-catalytic light intermediate chain of cytoplasmic dynein-2. It binds and stabilises
    the heavy-chain (DYNC2H1) tails, which is required for dynein-2 integrity. It contributes to the minus-end-directed
    motor activity that drives retrograde IFT from the ciliary tip to the base.
  contributes_to_molecular_function:
    id: GO:0008569
    label: minus-end-directed microtubule motor activity
  directly_involved_in:
  - id: GO:0035721
    label: intraciliary retrograde transport
  locations:
  - id: GO:0005930
    label: axoneme
  - id: GO:0036064
    label: ciliary basal body
  in_complex:
    id: GO:0005868
    label: cytoplasmic dynein complex
  supported_by:
  - reference_id: PMID:26077881
    supporting_text: We show that DYNC2LI1 is essential for dynein-2 complex stability, is expressed in
      the cartilage growth plate, and plays critical roles in the regulation of primary cilium length,
      retrograde IFT, and Hedgehog signaling.
  - reference_id: PMID:31451806
    supporting_text: LIC3 binds in a similar way to DHC2-A and -B, stabilizing the portion of the tail
      distal to the hinge sites
- description: Direct binding to the dynein-2 heavy-chain tail, forming the heavy-chain/LIC ("H1") subcomplex
    that the intermediate-chain/light-chain block then bridges into the asymmetric holoenzyme.
  molecular_function:
    id: GO:0045504
    label: dynein heavy chain binding
  in_complex:
    id: GO:0005868
    label: cytoplasmic dynein complex
  supported_by:
  - reference_id: PMID:29742051
    supporting_text: the H1 subcomplex (the heavy chain DYNC2H1 directly interacting with the light intermediate
      chain DYNC2LI1)
- description: As part of the IFT motor, it is needed for intraciliary transport during cilium assembly
    and maintenance. Loss causes IFT-B accumulation in cilia, loss of cilium length control and abnormal
    Hedgehog signalling (ciliary SMO, GLI3 processing).
  directly_involved_in:
  - id: GO:0035735
    label: intraciliary transport involved in cilium assembly
  supported_by:
  - reference_id: PMID:26077881
    supporting_text: Using SRPS fibroblasts we show that DYNC2LI1 mutations result in loss of cilia length
      regulation, ciliary accumulation of IFT components, and aberrant Hedgehog pathway activity.
proposed_new_terms: []
suggested_questions:
- question: Does the conserved P-loop/nucleotide-binding pocket of DYNC2LI1's Ras-like core bind nucleotide,
    and does nucleotide state regulate dynein-2 activation at the ciliary tip?
- question: Is the Golgi localization reported for D2LIC in 2002 reproducible with validated antibodies
    and knockout controls, or does it reflect the pericentrosomal ciliary-base pool?
suggested_experiments:
- hypothesis: Nucleotide binding by the DYNC2LI1 Ras-like domain is required for retrograde IFT.
  description: Express P-loop mutant DYNC2LI1 in DYNC2LI1-knockout RPE1 cells and test rescue of dynein-2
    stability, IFT88 ciliary accumulation and live retrograde IFT velocities.
  experiment_type: mutant rescue and live imaging
