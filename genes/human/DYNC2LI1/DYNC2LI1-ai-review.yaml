  review:
    summary: NAS annotation to male germ cell nucleus, citing a study of DYNLRB1/DYNLRB2-defined dynein-1
      complexes.
    action: REMOVE
    reason: The cited full text concerns dynein-1 complexes containing DYNLRB1 or DYNLRB2 in mitosis and
      male meiosis. It never mentions DYNC2LI1 or dynein-2, and its dynein acts on the cytoplasmic face
      of the nuclear envelope, not in the nucleus. No evidence places the dynein-2 light intermediate
      chain in the germ cell nucleus. This is a non-experimental statement unsupported by the cited text.
    supported_by:
