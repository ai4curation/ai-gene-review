taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: PADI3 is a calcium-dependent protein-arginine deiminase expressed in hair follicles and epidermis. It citrullinates structural hair-shaft substrates, working with transglutaminase 3 and trichohyalin in hair-shaft formation; loss-of-function variants in PADI3 cause autosomal-recessive uncombable hair syndrome.
