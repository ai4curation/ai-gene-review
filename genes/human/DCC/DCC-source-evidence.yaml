  role_limit: DCC is a receptor, recruitment platform or regulated substrate. CASP3, FYN, RhoGEFs and
    other effectors supply the catalytic activities in the corresponding models; component membership
    does not transfer those activities.
additional_context:
  HPA: The inspected Human Protein Atlas data record reports Approved immunofluorescence reliability,
    Golgi apparatus as a main location, and centrosome as an additional location. The underlying images
    were not inspected. This record was not substituted for the imported plasma-membrane evidence and
    did not generate a new annotation.
  GO_CAM: The protected current index was checked for P43146; no target model was present in this intake
    boundary.
core_synthesis: >-
  Netrin receptor activity at the plasma membrane drives axon guidance. A second core
  records receptor-associated recruitment in ligand-absence apoptotic signaling,
  retaining GO:0097192 and the plasma-membrane location without assigning a distinct
  adaptor molecular function. PMID11248093 supports complex-dependent caspase activation
  but leaves additional coordinating components unresolved. FAS, TNFRSF1A and NGFR
  provide suggestive receptor-role comparators lacking the adaptor term or descendants;
  this is not a universal annotation rule. No is_a redundancy was found between
  GO:0035591 and the nine existing/proposed molecular functions, so redundancy is not
  the reason for omitting it. The prior adaptor interpretation is corrected; all 51
  imported source assertions/actions remain and no NEW row is introduced.
provenance: Reviewer-authored navigation, not independent primary evidence. Source caches and current
  raw database records remain immutable; ordinary normal-source validation is run on all 51 imported assertions.
