id: P43146
gene_symbol: DCC
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  DCC (deleted in colorectal cancer) is a single-pass transmembrane netrin receptor with
  extracellular immunoglobulin-like and fibronectin type III domains and a cytoplasmic
  signaling tail. Netrin-responsive DCC assemblies recruit intracellular effectors that
  regulate neuronal migration, axon extension and guidance. The receptor also associates
  with translation machinery and supports synaptic signaling in mature neuronal
  circuits. In the absence of netrin, its intracellular region can organize a
  caspase-dependent apoptotic signaling platform. This dependence-receptor behavior
  underlies its proposed role as a candidate tumor suppressor. Proteolytic processing
  distinguishes a membrane-retained proximal signaling region from a released distal
  tail.
