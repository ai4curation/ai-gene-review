id: P00973
gene_symbol: OAS1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'OAS1 encodes a dsRNA-activated 2-5A synthetase that polymerizes ATP into 2-5A second messengers for RNASEL activation. The major p42 and p46 isoforms differ in their C termini: p42 is diffusely cytosolic, while prenylated p46 is endomembrane associated and can sense viral dsRNA at replication organelles.'
alternative_products:
