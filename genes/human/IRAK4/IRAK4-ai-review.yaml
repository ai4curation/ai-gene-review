suggested_questions:
- question: Which IRAK4 outputs in human myeloid cells require its kinase activity and which require only
    its scaffold function, given that IRAK4 kinase inhibition in human macrophages spares most cytokine
    production but impairs IRF5 activation?
- question: Should GO provide a cellular component term for the Myddosome (MyD88-IRAK4-IRAK2/IRAK1 helical
    death-domain assembly), rather than the generic serine/threonine protein kinase complex?
- question: Does IRAK4 act directly in IL-33 (IL1RL1) and IL-18 receptor signalling in human cells, and
    is there primary evidence suitable for pathway-specific annotation?
- question: Should PAINT node PTN000701353 carry GO:0008063 Toll signaling pathway at a level that propagates
    to vertebrate IRAKs, given that GO:0008063 is defined by the Drosophila Toll receptor and is not an
    ancestor of the toll-like receptor signaling pathway term?
suggested_experiments:
- description: Compare kinase-dead (D311N or K213/214A) and IRAK4-null human primary macrophages across
    TLR1/2, TLR4, TLR5, TLR7/8 and IL-1R stimuli with phosphoproteomics to separate kinase from scaffold
    outputs.
- description: Test IRAK4 recruitment and requirement in IL-33 and IL-18 signalling in IRAK4-deficient
    patient cells complemented with wild-type or kinase-dead IRAK4.
- description: Map in vivo IRAK4 substrates in human cells using analog-sensitive IRAK4 and thiophosphate
    labelling.
