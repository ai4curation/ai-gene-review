  - UniProtKB:Q8TF76
  - UniProtKB:Q9Y616
  review:
    summary: IBA (PTN000784925) transferring nuclear localization from IRAK1, IRAK3 and other Pelle-family
      kinases.
    action: MARK_AS_OVER_ANNOTATED
    reason: There is no IRAK4-specific evidence for nuclear activity in the reviewed literature; UniProt
      records IRAK4 as cytoplasmic and all characterized IRAK4 functions occur at receptor-proximal complexes
      and in the cytosol. Nuclear roles reported for family members (e.g. IRAK1) appear lineage-specific
      rather than inherited by IRAK4.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN000784925
        comment: Deep Pelle/IRAK/plant receptor-like kinase node; nuclear localization of some descendants
          (e.g. IRAK1) is not documented for IRAK4, whose characterized activity is receptor-proximal
          and cytosolic.
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
      - source_id: UniProtKB:P51617
        source_label: IRAK1
        comment: IRAK1 nuclear localization is a family-member property not shown for IRAK4.
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
