id: Q9NWZ3
gene_symbol: IRAK4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: IRAK4 (interleukin-1 receptor-associated kinase 4) is a cytosolic serine/threonine protein
  kinase of the Pelle/IRAK family and the closest human homolog of Drosophila Pelle. It has an N-terminal
  death domain and a C-terminal kinase domain. Upon activation of Toll-like receptors (except TLR3) and
  IL-1 family receptors, MyD88 death domains recruit IRAK4, which in turn recruits IRAK2 or IRAK1 to form
  the helical Myddosome. Clustered IRAK4 trans-autophosphorylates and phosphorylates IRAK1, IRAK2 and
  Pellino E3 ligases, leading to TRAF6 activation and downstream NF-kappaB, MAPK and IRF signalling and
  inflammatory cytokine and type I interferon production. IRAK4 also acts as a kinase-independent scaffold,
  for example integrating MYD88 and TRIF signals downstream of TLR4. Inherited IRAK-4 deficiency abolishes
  most TLR and IL-1R responses and causes susceptibility to invasive pyogenic bacterial infections in
  childhood.
