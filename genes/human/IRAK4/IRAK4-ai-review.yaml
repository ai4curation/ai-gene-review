- term:
    id: GO:0008063
    label: Toll signaling pathway
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - FB:FBgn0003882
  - FB:FBgn0010441
  - PANTHER:PTN000701353
  review:
    summary: IBA (PTN000701353) from Drosophila Tube (FBgn0003882) and Pelle (FBgn0010441) to GO:0008063
      Toll signaling pathway.
    action: MODIFY
    reason: GO:0008063 is defined by ligand binding to the Drosophila receptor Toll (activated by cleaved
      Spaetzle) and is not an ancestor of the vertebrate toll-like receptor signaling pathway term (GO:0002224,
      under pattern recognition receptor signaling). The conserved node function (death-domain kinase
      downstream of a TIR receptor via MyD88) is real, but for a human protein it is expressed as MyD88-dependent
      TLR signaling, which IRAK4 already carries with experimental support. IRAK4 is the closest human
      homolog of Pelle (PMID:11960013).
    proposed_replacement_terms:
    - id: GO:0002755
      label: MyD88-dependent toll-like receptor signaling pathway
    supported_by:
    - reference_id: PMID:11960013
      supporting_text: IRAK-4 is the closest human homolog to Pelle.
    - reference_id: PMID:20485341
      supporting_text: Assembly of this helical signalling tower is hierarchical, in which MyD88 recruits
        IRAK4 and the MyD88-IRAK4 complex recruits the IRAK4 substrates IRAK2 or the related IRAK1.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - LINEAGE_OR_TAXON_MISMATCH
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN000701353
        comment: Node grounded by Drosophila Tube and Pelle experimental annotations; the conserved function
          (death-domain kinase module downstream of a TIR receptor and MyD88) is real, but GO:0008063
          is defined by the Drosophila Toll receptor and in vertebrates the equivalent is toll-like receptor
          signaling.
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
      - source_id: FB:FBgn0010441
        source_label: pll
        comment: Pelle acts in Drosophila Toll signaling; correct for the source.
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
      - source_id: FB:FBgn0003882
        source_label: tub
        comment: Tube acts in Drosophila Toll signaling; correct for the source.
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
