core_functions:
- description: Apical Ser/Thr protein kinase of the Myddosome that phosphorylates IRAK1, IRAK2 and Pellino
    proteins to propagate TLR and IL-1 receptor signals.
  molecular_function:
    id: GO:0004674
    label: protein serine/threonine kinase activity
  directly_involved_in:
  - id: GO:0002755
    label: MyD88-dependent toll-like receptor signaling pathway
  - id: GO:0070498
    label: interleukin-1-mediated signaling pathway
  locations:
  - id: GO:0005829
    label: cytosol
  in_complex:
    id: GO:1902554
    label: serine/threonine protein kinase complex
  supported_by:
  - reference_id: PMID:11960013
    supporting_text: Here we show that recombinant IRAK-1 is a substrate for IRAK-4, whereas IRAK-1 is
      not able to phosphorylate IRAK-4 in vitro
  - reference_id: PMID:11960013
    supporting_text: T387 and S376 are the main sites of phosphorylation by both IRAK-1 and IRAK-4
  - reference_id: PMID:19264966
    supporting_text: The E3 ubiquitin ligase Pellino can be activated by phosphorylation in vitro, catalyzed
      by IL-1 receptor-associated kinase 1 (IRAK1) or IRAK4.
  - reference_id: PMID:12860405
    supporting_text: Pellino2 is one of the first substrates identified for IRAK1 and IRAK4.
  - reference_id: Reactome:R-HSA-446694
    supporting_text: in vitro kinase assays indicate that IRAK1 can be a direct substrate of IRAK4
