core_functions:
- description: Membrane anchor of the GTPase-activating complexes of the ON-bipolar mGluR6 cascade. At the dendritic
    tips GPR179 binds RGS7-Gbeta5 and R9AP and holds RGS7/RGS11 at the postsynaptic membrane, where they deactivate
    Go so that TRPM1 can open at light onset; required for the ON response in mouse, zebrafish and human. No ligand
    or G protein activation is known.
  molecular_function:
    id: GO:0043495
    label: protein-membrane adaptor activity
  directly_involved_in:
  - id: GO:0072659
    label: protein localization to plasma membrane
  - id: GO:0007216
    label: G protein-coupled glutamate receptor signaling pathway
  locations:
  - id: GO:0044292
    label: dendrite terminus
  - id: GO:0045211
    label: postsynaptic membrane
  supported_by:
  - reference_id: PMID:22689652
    supporting_text: The loss of GPR179 in a mouse model of night blindness prevented targeting of RGS to the postsynaptic
      compartment of bipolar neurons in the retina
  - reference_id: PMID:26961947
    supporting_text: 'It contains two Regulator of G-protein Signaling (RGS) proteins RGS7 and RGS11 that directly
      act on Go and two adaptor subunits: RGS Anchor Protein (R9AP) and the orphan receptor, GPR179.'
suggested_questions:
- question: Does GPR179 have a ligand, and does ligand binding change its effect on RGS7 activity as glycine does
    for GPR158?
- question: Beyond anchoring, does GPR179 allosterically raise RGS7/RGS11 GAP activity in ON-bipolar cells?
suggested_experiments:
- hypothesis: GPR179 binding increases the catalytic GAP activity of RGS7-Gbeta5 on Galpha-o, not only its localization.
  description: Reconstitute purified GPR179 (in nanodiscs) with RGS7-Gbeta5 and Galpha-o and measure single-turnover
    GTP hydrolysis with and without GPR179, testing CSNB1E missense variants.
