  review:
    summary: G protein-coupled receptor activity; family-level inference not shown for this orphan, whose established
      activity is RGS anchoring.
    action: MARK_AS_OVER_ANNOTATED
    reason: InterPro maps the class C 7TM signature to GPCR activity, but GPR179 has no known ligand and no ligand-induced
      G protein activation has been shown. What the evidence shows is that it recruits R7 RGS complexes to the membrane
      and augments their activity, the opposite side of the G protein cycle. Not excluded, so not removed, but it
      over-states what is known.
    supported_by:
    - reference_id: PMID:22689652
      supporting_text: We show that GPR158/179 recruited RGS complexes to the plasma membrane and augmented their
        ability to regulate GPCR signaling.
