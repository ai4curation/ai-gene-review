id: Q6PRD1
gene_symbol: GPR179
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'GPR179 is an orphan class C G protein-coupled receptor of the GPR158/GPR179 group, with an N-terminal
  extracellular region, seven transmembrane helices and a very large intracellular C-terminal domain; no ligand
  is known. It is expressed by retinal ON (depolarizing) bipolar cells and concentrated at their dendritic tips,
  in the postsynaptic membrane of the photoreceptor synapse, alongside mGluR6, TRPM1 and nyctalopin. Rather than
  being shown to activate G proteins, it acts as a membrane anchor for the GTPase-activating complexes of the mGluR6
  cascade: it binds RGS7 (in complex with Gbeta5) and R9AP and is required for RGS7 and RGS11 to accumulate at the
  dendritic tips, where they deactivate Go when light reduces glutamate release, enabling the TRPM1-mediated ON
  response. Its extracellular region binds heparan sulfate proteoglycans, including pikachurin released by photoreceptors,
  which with the dystroglycan complex positions GPR179 across the synapse. Loss of GPR179 abolishes the electroretinogram
  b-wave in nob5 mice and zebrafish, and biallelic human variants cause autosomal recessive complete congenital
  stationary night blindness (CSNB1E).'
