id: Q9NZN3
gene_symbol: EHD3
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: EHD3 (PAST3) is a C-terminal Eps15 homology domain-containing (EHD) dynamin-related ATPase
  closely related to EHD1 (about 86-87% identity), with which it hetero-oligomerizes. It has an N-terminal
  ATP-binding G-like domain, a helical membrane-binding region and a C-terminal EH domain with an EF-hand
  that binds NPF-motif partners such as MICAL-L1, rabenosyn-5 and Rab11-FIP2. EHD3 resides on tubular
  and vesicular membranes of the endocytic recycling compartment and supports the stability of tubular
  recycling endosomes; it regulates transport from early endosomes to the recycling compartment and early
  endosome-to-Golgi retrieval (needed for mannose 6-phosphate receptor return and normal Golgi morphology).
  EHD3 is enriched in brain and heart; in cardiomyocytes it binds ankyrin-B and is required for targeting
  of membrane proteins such as the Na/Ca exchanger NCX1 and Cav1.2, influencing cardiac excitability and
  conduction. Together with EHD1, EHD3 localizes to preciliary membranes and the ciliary pocket and contributes,
  partly redundantly with EHD1, to ciliary vesicle formation at the onset of primary ciliogenesis.
