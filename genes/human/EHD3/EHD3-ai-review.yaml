core_functions:
- description: Membrane-associated EHD ATPase (hetero-oligomerizing with EHD1) on tubular recycling endosomes
    that stabilizes recycling tubules and supports early endosome-to-recycling compartment and endosome-to-Golgi
    transport (non-ciliary core role).
  directly_involved_in:
