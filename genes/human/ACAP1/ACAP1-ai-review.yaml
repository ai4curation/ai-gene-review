- id: file:human/ACAP1/ACAP1-deep-research-affinage.md
  title: Affinage mechanistic annotation for ACAP1 (human)
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: >-
      Machine-fetched Affinage record; its self_evaluation_pairwise is win and all ten citations are genuine numeric
      PMIDs, with no bioRxiv DOIs in PMID-shaped fields. Its narrative is broadly accurate and it
      correctly surfaced the two papers this review had not otherwise reached, PMID:36917255
      (Rab10-ACAP1-ARF6 cascade on the M4 muscarinic receptor) and PMID:37505213 (ACAP1 bridging
      PTPN9 and FGFR2). Marked UNVERIFIED rather than VERIFIED because no sentence from it is used as
      supporting text anywhere in this review: every mechanistic claim here is quoted from a primary
      PMID or from the UniProt record instead. Its own GO grounding should not be imported - it
      offers GO:0005198 structural molecule activity and GO:0060090 molecular adaptor activity where
      the specific GO:0140312 cargo adaptor activity and GO:0180020 membrane bending activity are
      available, and omits the GAP activity that is the protein's defining function.
suggested_questions:
- question: >-
    Why does ACAP1 have no experimental GO annotation? All seven of its primary papers -
    PMID:11062263, PMID:16256741, PMID:17398097, PMID:17664335, PMID:22645133, PMID:25284369 and
    PMID:25225293 - return zero ACAP1 annotations on QuickGO, so the ARF6 GAP activity, the integrin
    and GLUT4 recycling, the clathrin coat membership and the membrane-bending mechanism are all
    absent. UniProt has read every one of them, with ECO:0000269 throughout. The annotations most
    clearly warranted are GO:0005096 IDA with has_input ARF6 from PMID:11062263, GO:0055038 IDA from
    PMID:16256741, and GO:0032456 endocytic recycling IMP from PMID:17664335 or PMID:25225293.
- question: >-
    Should the ACAP2 IDAs from PMID:11062263 be mirrored onto ACAP1? That paper produced three IDAs
    on ACAP2 - GTPase activator activity, actin filament-based process and ruffle - and none on
    ACAP1, although ACAP1 is first in the title, was assayed in the same figures, and is described as
    the more effective of the two at inhibiting protrusions. As it stands, ACAP1's GAP activity
    reaches ACAP1 only as an IBA whose WITH/FROM cites ACAP2, which inverts the normal direction of
    paralog inference.
- question: >-
    How should ARF6 substrate specificity be recorded now that GO:0008060 ARF GTPase activator
    activity has been merged into GO:0005096? The merge was deliberate and applied to the Rab, Ras
    and Rho GAP terms too, so the intended mechanism is presumably an annotation extension. If so,
    has_input UniProtKB:P62330 should be treated as required rather than optional on GAP annotations,
    otherwise the distinction between an ARF6 GAP, an ARF1 GAP and a Rho GAP is lost at the point
    where it matters most.
- question: >-
    Is there a GO representation for a coat that acts on the recycling route rather than at
    endocytosis? ACAP1's clathrin coat is regulated by ARF6 and operates on recycling endosomes,
    which is not the clathrin-coated pit of endocytosis. GO:0030118 clathrin coat is the only
    available complex term and is silent on which step it serves.
- question: >-
    Which ACAP1 interactions deserve annotation? Not one of its validated partners - ARF6, ITGB1,
    CLTC, GULP1, SLC2A4 - appears anywhere in the GO record, while eleven protein binding rows record
    screen hits including two mitochondrial complex III subunits and three nuclear chromatin or LIM
    proteins. Among the screen hits only FCHSD2, an F-BAR protein of the clathrin pathway, and GRB2,
    which recurs in two orthogonal assays, look worth pursuing.
- question: >-
    Does ACAP1 have a haematopoietic function? Expression is enhanced in bone marrow, intestine and
    lymphoid tissue, and the original survey found the highest levels in lung and spleen, yet every
    mechanistic experiment has been done in HeLa, COS-7, NIH 3T3 or adipocytes. Integrin recycling
    matters a great deal in leukocytes, so the native setting may be where the phenotype is.
suggested_experiments:
- hypothesis: >-
    ACAP1 and ACAP2 are not interchangeable on the recycling route, and the annotation asymmetry
    between them reflects which was assayed rather than a biological difference.
  description: >-
    Knock out ACAP1 and ACAP2 singly and together in a cell line expressing both, and measure
    integrin beta-1 and GLUT4 recycling kinetics with surface-biotinylation and antibody-uptake
    assays, then attempt cross-rescue with each paralog including the GAP-dead R448Q equivalents. A
    clean cross-rescue would justify shared annotation; failure to rescue would mean the two genes
    need annotating separately and would make the current reliance on ACAP2 in ACAP1's IBA WITH/FROM
    inappropriate.
  experiment_type: genetics
- hypothesis: ACAP1's catalytic activity acts on the endosome while its plasma-membrane pool is non-catalytic.
  description: >-
    Combine live-cell imaging of endogenously tagged ACAP1 with an ARF6 activity biosensor, and
    compare wild type with R448Q, which is reported to lose the tubular endosome pool while retaining
    plasma-membrane protrusion association. Localising the actual ARF6 hydrolysis event would settle
    whether is_active_in plasma membrane is warranted or whether located_in is the correct qualifier
    there.
  experiment_type: imaging
- hypothesis: >-
    The cargo range of the ACAP1 coat extends beyond integrin beta-1 and GLUT4, as the M4 muscarinic
    receptor result suggests.
  description: >-
    Perform proximity labelling from endogenously tagged ACAP1 in a cell type where it is natively
    abundant, such as a myeloid or lymphoid line, before and after Akt activation, then test candidate
    transmembrane cargoes for the phospho-Ser-554-dependent binding that defines a genuine ACAP1
    sorting substrate. This distinguishes cargo from bystander far better than Y2H and would populate
    the interaction record with partners that mean something.
  experiment_type: proteomics
- hypothesis: FCHSD2 and ACAP1 collaborate on membrane deformation in the clathrin pathway.
  description: >-
    Test the HuRI hit directly, by co-immunoprecipitation of endogenous proteins, by mapping which
    FCHSD2 SH3 domain engages the ACAP1 proline-rich 538-549 region, and by asking whether FCHSD2
    depletion changes ACAP1-dependent endosomal tubulation. This is the one screen interaction whose
    mechanism is predictable, so it is the one whose confirmation would convert a bare protein binding
    row into an informative annotation.
  experiment_type: biochemistry
- hypothesis: >-
    Akt-phosphorylated Ser-554 is the switch that couples growth-factor signalling to integrin
    recycling in a physiological setting.
  description: >-
    Introduce S554A and S554D at the endogenous ACAP1 locus by knock-in rather than by
    overexpression, then measure integrin beta-1 surface delivery, focal adhesion turnover and
    migration with and without growth-factor stimulation. All the existing evidence for the switch
    comes from transfected constructs, so a knock-in would establish whether the autoinhibition
    operates at native expression levels.
  experiment_type: genetics
