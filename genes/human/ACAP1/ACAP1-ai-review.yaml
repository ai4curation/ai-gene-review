- term:
    id: GO:0180020
    label: membrane bending activity
  evidence_type: IDA
  original_reference_id: PMID:25284369
  qualifier: enables
  review:
    summary: >-
      Proposed new annotation. Purified ACAP1 binds and deforms liposomes, and Pang et al. localised
      the activity precisely: the BAR domain can do neither on its own and the neighbouring PH domain
      performs both membrane binding and curvature generation, with the BAR domain instead
      oligomerising ACAP1 into the lattice that bends the bilayer. The F280 mutagenesis series in
      UniProt scores the activity residue by residue - F280A reduces membrane binding and liposome
      tubulation, F280E almost abolishes binding, F280W preserves both.

      IDA: liposome tubulation with purified protein is a direct in vitro assay of the activity. The
      cellular counterpart in PMID:17010122 is weaker evidence because it depends on co-overexpression
      of PIP5K1C.

      The domain attribution is the part of this row most likely to be got wrong, so it is worth
      stating twice and in the negative. The BAR domain is not the bending element. In the liposome
      assay the isolated BAR domain shows little affinity for liposomes of any size, and in the cryoEM
      reconstruction of coated tubules there is no significant interaction between the BAR domain and
      the underlying membrane at all. The bilayer contact and the curvature both come from the PH
      domain, and specifically from Loop1, whose distal aromatic F280 inserts into one leaflet: F280A
      reduces both binding and tubulation, F280E effectively abolishes binding, and the conservative
      F280W preserves both. What the BAR domain does instead is bind the BAR domains of neighbouring
      ACAP1 molecules. So "the BAR-PH module tubulates membrane" is the right answer for the fragment
      and the wrong answer for the mechanism, and "its BAR domain bends membrane" - the phrasing a
      reader would default to for any other BAR protein - is simply false for ACAP1.

      GO:0180020 was created in June 2023, after all of ACAP1's primary literature, which is a likely
      reason the activity is unannotated. It is also still very sparsely used: a QuickGO query for the
      term and its descendants in human returns four annotations over three gene products - CHMP2A and
      CHMP3 (ESCRT-III, PMID:36604498) and OPA1 (PMID:32228866, PMID:37612504) - all IDA, and none of
      them a BAR-domain protein. ACAP1 would be the first BAR-domain entry on the term, which is a
      reason to state the PH-domain attribution explicitly rather than let the term be read as a
      routine BAR-protein annotation.
    action: NEW
    reason: >-
      A distinct, directly assayed molecular function with an unusual mechanism worth recording, and a
      term that did not exist when the work was published. The activity belongs to the PH domain: the
      BAR domain neither binds membrane nor imparts curvature, and contributes only the BAR-BAR contacts
      that cluster ACAP1 on the bilayer.
