  - reference_id: file:human/ACAP1/ACAP1-uniprot.txt
    supporting_text: 'CC   -!- ACTIVITY REGULATION: GAP activity stimulated by phosphatidylinositol'
- description: >-
    Cargo-selective adaptor within an ARF6-regulated clathrin coat that packages transmembrane cargo
    for return from recycling endosomes to the cell surface. ACAP1 bridges the three elements a coat
    adaptor must connect: it binds clathrin heavy chain directly, it reads a sorting signal in the
    cytoplasmic tail of integrin beta-1 and the third cytoplasmic loop of SLC2A4/GLUT4, and it
    deforms the membrane itself. Cargo capture is gated rather than constitutive - Akt
    phosphorylation of Ser-554 relieves a local autoinhibition, S554A abolishes both ITGB1 binding
    and integrin-dependent migration while the phosphomimetic S554D enhances binding - which makes
    this the step at which growth-factor signalling is coupled to the recycling route. The two
    physiological outputs are integrin-dependent cell migration and insulin-stimulated GLUT4
    delivery.
