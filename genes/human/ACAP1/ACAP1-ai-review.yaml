- id: PMID:25284369
  title: A PH domain in ACAP1 possesses key features of the BAR domain in promoting membrane curvature.
  findings:
  - statement: ACAP1's BAR domain cannot bind membrane or impart curvature and depends on the neighbouring
      PH domain for both.
    supporting_text: Here, we show that this BAR domain can neither bind membrane nor impart curvature,
      but instead requires a neighboring PH (Pleckstrin Homology) domain to achieve these functions.
  - statement: Specific PH-domain residues mediate both membrane binding and curvature generation.
    supporting_text: Specific residues within the PH domain are responsible for both membrane binding
      and curvature generation.
  - statement: The BAR domain instead oligomerises ACAP1 by binding BAR domains of neighbouring molecules.
    supporting_text: The BAR domain adjacent to the PH domain instead interacts with the BAR domains of
      neighboring ACAP1 proteins to enable clustering at the membrane.
  - statement: The isolated ACAP1 BAR domain has little affinity for liposomes of any size, whereas the
      tandem BAR-PH fragment binds them.
    supporting_text: the BAR domain of ACAP1 also showed little affinity to the generated liposomes, regardless
      of their size
  - statement: Purified ACAP1 BAR-PH tubulates liposomes in vitro, visualised by negative-stain electron
      microscopy - the direct assay of the bending activity.
    supporting_text: We next found that ACAP1BAR-PH also induces membrane curvature, as reflected by the
      tubulation of liposomes, which was visualized by negative-stain electron microscopy (EM)
  - statement: Phe-280 in PH-domain Loop1 is required for curvature induction, with F280A reducing tubulation
      and the conservative F280W preserving it.
    supporting_text: In particular, mutation of this residue to alanine (F280A) reduced the ability of
      ACAP1BAR-PH to induce liposome tubulation, while a more conservative mutation (F280W) preserved
      the ability to tubulate liposomes.
  - statement: In the cryoEM reconstruction of a coated tubule the BAR domain makes no significant contact
      with the membrane, contributing packing interfaces between molecules instead.
    supporting_text: Second, there is no significant interaction between the BAR domain and the underlying
      membrane.
  - statement: The BAR domain's role is to form the interfaces that pack ACAP1 molecules into the membrane
      coat.
    supporting_text: Instead, the BAR domain contributes to the packing interfaces among ACAP1BAR-PH protein
      in assembling the coating on liposome membrane.
  - statement: ACAP1 BAR-PH is a dimer in solution, confirmed by size exclusion chromatography with light
      scattering.
    supporting_text: Dimerization of ACAP1BAR-PH was confirmed from size exclusion chromatography and light
      scattering
  - statement: The dimerisation dissociation constant is below 5 micromolar, tighter than that reported
      for the N-BAR protein endophilin A2.
    supporting_text: The in vitro disassociation constant of the dimerization was calculated to be below
      5 µM, according to the quantitative gel-filtration experiment
  - statement: The crystallographic dimer interface is large and mainly hydrophobic.
    supporting_text: The dimer interface has a large area (4100 Å2), and contains mainly hydrophobic residues
      that likely mediate dimerization.
  - statement: A single PH domain per dimer suffices for membrane insertion and curvature generation.
    supporting_text: this additional finding suggests that one PH domain is sufficient to confer the ability
      of the ACAP1BAR-PH dimer to insert into membrane and impart curvature
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Cached title matches, and full text is available from PMC4198613, so every quote above is checked
      against the article body. Corrected from an earlier reading of this reference as abstract-only:
      the cache carries full_text_available true with an XML extraction, and the Results section
      supplies the direct in vitro assay (liposome binding and negative-stain EM tubulation of purified
      BAR-PH), the negative BAR-domain result in both the liposome assay and the cryoEM reconstruction,
