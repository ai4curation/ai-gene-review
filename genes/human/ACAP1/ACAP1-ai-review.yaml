  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Cached title matches the citation. Reports that Rab10-GTP recruits ACAP1 to inactivate ARF6 and
      thereby hold the M4 muscarinic receptor in early endosomes. Consistent with the established
      mechanism - a third cargo handled by the same ARF6-GAP step - and it would extend ACAP1's cargo
