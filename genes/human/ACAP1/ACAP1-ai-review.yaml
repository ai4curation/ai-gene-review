id: Q15027
gene_symbol: ACAP1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  ACAP1 is a multidomain, phosphoinositide-regulated GTPase-activating protein for the small GTPase
  ARF6 and a component of the coat that sorts cargo out of recycling endosomes. Its four domains
  divide the work unconventionally: an N-terminal BAR domain that oligomerises ACAP1 into a lattice
  on the membrane rather than binding membrane itself, a pleckstrin-homology domain that binds
  phosphoinositides and performs the membrane binding and curvature generation a BAR domain would
  normally perform, a C4 zinc-finger Arf-GAP catalytic domain that accelerates GTP hydrolysis on
  ARF6 in preference to ARF1 and ARF5, and three ankyrin repeats. GAP activity is stimulated by
  phosphatidylinositol 4,5-bisphosphate and phosphatidic acid, so catalysis is coupled to lipid
  composition. ACAP1 is largely cytosolic at rest and is recruited by ARF6-GTP both to tubular
  recycling endosomes and to the cell surface during ruffling. On the endosome it forms part of an
  ARF6-regulated clathrin coat that packages cargo for return to the plasma membrane: it binds
  clathrin heavy chain directly and captures the cytoplasmic tails of integrin beta-1 and of the
  glucose transporter GLUT4/SLC2A4, thereby supporting integrin-dependent cell migration and
  insulin-stimulated glucose uptake. Cargo capture is a switch rather than a constitutive activity.
  Akt phosphorylation of Ser-554 relieves a local autoinhibition and licenses binding to a sorting
  signal in the integrin beta-1 tail, which couples growth-factor signalling directly to the
  recycling step. Because ARF6 also governs peripheral actin, ACAP1 acting on ARF6 dampens membrane
  protrusions, dorsal ruffles and focal adhesions; the PTB-domain adaptor GULP1 opposes this by
  sequestering ACAP1 in a complex with GDP-bound ARF6. ACAP1 is expressed most strongly in
  haematopoietic and lymphoid tissue, and is one of three paralogous human ACAPs together with
  ACAP2 and ACAP3.
existing_annotations:
- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  review:
    summary: >-
      Phylogenetic inference that ACAP1 is active at the plasma membrane. Retained, and unusually for
      an IBA on a location, it can be checked directly against human data rather than argued from the
      family.

      Jackson et al. imaged ACAP1 itself and found a genuine surface pool that is ARF6-dependent:
      ACAP1 localises to dorsal ruffles and to the edge of protrusive cells, and recruitment to both
      the endosome and the plasma membrane fails when ARF6 is locked in its GDP form. So this is not
      a compartment mismatch imported from other species; the human protein does go to the plasma
      membrane, under ARF6-GTP control.

      Two details argue that it is not the principal site of catalysis, which is why this is kept as
      non-core rather than accepted as core. First, ACAP1's steady-state location in UniProt is the
      recycling endosome membrane, peripheral, on the cytoplasmic side. Second, the GAP-dead R448Q
      mutant loses the tubular-endosome pool but is still found on plasma-membrane protrusions -
      surface recruitment and catalysis are separable, and it is the endosomal pool that tracks with
      GAP function. The sorting and coat work that defines ACAP1 happens on the endosome; the surface
      pool is where its substrate ARF6 is activated.
    action: KEEP_AS_NON_CORE
    reason: >-
      Correct and independently supported by human imaging, but peripheral to the gene's core
      activity. ACAP1's coat and cargo-sorting function operates on the tubular recycling endosome,
      and the catalytically dead mutant retains the surface pool while losing the endosomal one.
      Note on the relation: is_active_in asserts that the function is carried out here, and that is
      the part of this annotation least well supported. Because R448Q keeps the surface pool while
      losing the endosomal one, the plasma-membrane pool may be recruitment without catalysis, in
      which case located_in would be the better relation. Retained as is_active_in because ARF6 is
      activated at the plasma membrane and no experiment has yet localised the hydrolysis event; a
      curator revisiting this row should treat the relation, not the term, as the open question.
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
      - source_id: UniProtKB:Q15057
        source_label: ACAP2 (human paralog)
        source_status: SUPPORTS_TRANSFER
        comment: >-
          Human ACAP2, a paralog rather than an ortholog, with plasma membrane by IDA. Within-family
          support of an ancestral node is legitimate PAINT practice, and plasma-membrane residence is
          ancestral across the ACAP clade, so this is not a bad transfer.
      - source_id: WB:WBGene00000565
        source_label: cnt-1 (C. elegans)
        source_status: SUPPORTS_TRANSFER
        comment: >-
          Carries plasma membrane by EXP plus cytoplasmic side of plasma membrane, apical and
          basolateral plasma membrane by IDA - the most finely localised member of the family.
      - source_id: PomBase:SPBC17G9.08c
        source_label: csx2 (S. pombe)
        source_status: SUPPORTS_TRANSFER
        comment: Plasma membrane by IDA.
      - source_id: dictyBase:DDB_G0279649
        source_label: Dictyostelium Q54WI0
        source_status: SUPPORTS_TRANSFER
        comment: >-
          A full-architecture ACAP (BAR + PH + Arf-GAP by UniProt domain annotation) with plasma
          membrane by IDA.
      - source_id: AGI_LocusCode:AT5G61980
        source_label: Arabidopsis AGD1
        source_status: SUPPORTS_TRANSFER
        comment: ADP-ribosylation factor GTPase-activating protein AGD1.
      - source_id: AGI_LocusCode:AT5G13300
        source_label: Arabidopsis AGD3
        source_status: SUPPORTS_TRANSFER
        comment: ADP-ribosylation factor GTPase-activating protein AGD3.
      - source_id: PANTHER:PTN001142372
        source_label: PTHR23180 ancestral node
        source_status: SUPPORTS_TRANSFER
        comment: The CENTAURIN/ARF family node from which the assignment was made.
    supported_by:
    - reference_id: PMID:11062263
      supporting_text: During PDGF stimulation of NIH 3T3 cells, ACAP1, ACAP2, and ASAP1 colocalized
        in dorsal ruffles and at the edge of resting and protrusive HeLa cells.
    - reference_id: PMID:11062263
      supporting_text: ACAP1 remained cytosolic and was not recruited to the endosome or the plasma
        membrane in cells expressing the dominant-negative Arf6, T27N, even in the presence of AlF4
    - reference_id: PMID:11062263
      supporting_text: A point mutant of ACAP1 that lacked GAP activity was not observed on the tubular
        endosomes, but rather was associated with the plasma membrane protrusions
    - reference_id: file:human/ACAP1/ACAP1-uniprot.txt
      supporting_text: 'CC   -!- SUBCELLULAR LOCATION: Recycling endosome membrane'
- term:
    id: GO:0005096
    label: GTPase activator activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: >-
      The core molecular function, and correct - but arrived at by the wrong route, which is the
      central finding of this review.

      ACAP1's GAP activity was measured directly, on ACAP1, in the paper that named the family:
      recombinant ACAP1 preferred ARF6 over ARF1 and ARF5, the activity required
      phosphatidylinositol 4,5-bisphosphate, and the arginine-finger mutant R448Q was catalytically
      dead. That is textbook IDA evidence, and UniProt records it with ECO:0000269|PubMed:11062263.

      GO has none of it. A QuickGO query for ACAP1 annotations from PMID:11062263 returns zero. The
      same paper produced three IDAs on the paralog ACAP2 (GO:0005096 GTPase activator activity,
      GO:0030029 actin filament-based process, GO:0001726 ruffle). ACAP1 - first-named in the title,
      assayed in the same figures, and described in the text as the more potent of the two at
      inhibiting protrusions - received nothing. The consequence is an inversion of the usual paralog
      hazard: ACAP1's GAP activity now reaches ACAP1 only as a phylogenetic inference whose WITH/FROM
      cites ACAP2, for an activity that was measured on ACAP1 itself in the source paper.

      Accepted as core, because the function is right and the IBA is well founded. What is needed is
      an IDA on ACAP1 from PMID:11062263, which would make this IBA redundant rather than
      load-bearing.

      One ontology note. Substrate specificity cannot be expressed in the term. GO:0008060 ARF GTPase
      activator activity is now a secondary id of GO:0005096, merged along with the Rab, Ras and Rho
      GAP terms, so the best-established fact about this protein - that it is an ARF6 GAP with a
      measured preference over ARF1 and ARF5 - has to be carried by an annotation extension. Any
      experimental annotation of this term on ACAP1 should carry has_input UniProtKB:P62330 (ARF6).
    action: ACCEPT
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: UniProtKB:Q15057
        source_label: ACAP2 (human paralog)
        source_status: SUPPORTS_TRANSFER
        comment: >-
          Human ACAP2, with GTPase activator activity by IDA from PMID:11062263 - the same paper and
          the same experiment in which ACAP1's own GAP activity was measured. A legitimate source for
          the ancestral node, but its presence here records that ACAP1's direct evidence was captured
          on the paralog and not on ACAP1.
      - source_id: MGI:MGI:2153589
        source_label: Acap3 (mouse paralog)
        source_status: SUPPORTS_TRANSFER
        comment: >-
          Mouse Acap3, a paralog. Legitimate for an ancestral GAP-activity node. Note that the mouse
          Acap3-specific annotations (neuron migration, regulation of neuron projection development)
          hang off a different PANTHER node, PTN002754173, and correctly did not reach ACAP1.
      - source_id: SGD:S000002932
        source_label: AGE1 (S. cerevisiae YDR524C)
        source_status: SUPPORTS_TRANSFER
        comment: Yeast Arf-GAP AGE1, showing the activity is ancestral well beyond the metazoa.
      - source_id: dictyBase:DDB_G0279649
        source_label: Dictyostelium Q54WI0
        source_status: SUPPORTS_TRANSFER
        comment: Full-architecture ACAP with GTPase activator activity by IDA.
      - source_id: AGI_LocusCode:AT5G13300
        source_label: Arabidopsis AGD3
        source_status: SUPPORTS_TRANSFER
        comment: ADP-ribosylation factor GTPase-activating protein AGD3.
      - source_id: PANTHER:PTN001142372
        source_label: PTHR23180 ancestral node
        source_status: SUPPORTS_TRANSFER
        comment: >-
          The CENTAURIN/ARF node. Arf-GAP catalytic activity is the defining feature of the family,
          so the ancestral assignment is secure.
    supported_by:
    - reference_id: PMID:11062263
      supporting_text: In vitro, ACAP1 and ACAP2 preferred Arf6 as a substrate, rather than Arf1 and
        Arf5, more so than did ASAP1.
    - reference_id: PMID:11062263
      supporting_text: '[R448Q]ACAP1 and [R442Q]ACAP2 had no detectable activity using Arf6 as a substrate'
    - reference_id: PMID:11062263
      supporting_text: ACAP1 and ACAP2 are preferentially activated by phosphatidylinositol 4,5-bisphosphate
        [PIP2; not shown] and do contain GAP activity.
    - reference_id: file:human/ACAP1/ACAP1-uniprot.txt
      supporting_text: 'CC   -!- FUNCTION: GTPase-activating protein (GAP) for ADP ribosylation factor
        6'
- term:
    id: GO:0010008
    label: endosome membrane
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  review:
    summary: >-
      Correct, and the site where ACAP1's core activity happens. Accepted.

      The human evidence is direct: ACAP1 is recruited from the cytosol onto tubular portions of the
      ARF6 endosomal compartment, and Chen et al. place it specifically on a tubular recycling
      endosome distinct from the ARAP2/APPL1-positive compartment. The GAP-dead mutant is absent from
      these tubules, tying the endosomal pool to catalysis.

      A more specific term exists and is already annotated on this gene by a different route:
      GO:0055038 recycling endosome membrane, from the UniProt SubCell mapping. This IBA is not
      modified to that term, because an IBA states what the ancestral node supports and the family is
      not uniformly recycling-endosomal - cnt-1 carries early endosome membrane by IDA as well as
      recycling endosome membrane. Endosome membrane is the right generality for a phylogenetic
      inference. The specificity belongs on the experimental annotation that is missing.
    action: ACCEPT
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: RGD:1562939
        source_label: Acap2 (rat paralog)
        source_status: SUPPORTS_TRANSFER
        comment: >-
          Rat Acap2, a paralog. Its RGD record describes involvement in endocytic recycling and
          location in endosome membrane, consistent with the transfer.
      - source_id: WB:WBGene00000565
        source_label: cnt-1 (C. elegans)
        source_status: SUPPORTS_TRANSFER
        comment: >-
          Carries both early endosome membrane and recycling endosome membrane by IDA, which is why
          the generic endosome-membrane term is the correct level for the node.
      - source_id: PANTHER:PTN001142372
        source_label: PTHR23180 ancestral node
        source_status: SUPPORTS_TRANSFER
        comment: The CENTAURIN/ARF family node.
    supported_by:
    - reference_id: PMID:11062263
      supporting_text: In untreated cells, although ACAP1 and ACAP2 were primarily cytosolic, they could
        be observed on tubular portions of the Arf6 endosomal compartment
    - reference_id: PMID:25225293
      supporting_text: ARAP2 formed a complex with APPL1 and colocalized with Arf6 and APPL in a compartment
        distinct from the Arf6/ACAP1 tubular recycling endosome.
    - reference_id: PMID:11062263
      supporting_text: A point mutant of ACAP1 that lacked GAP activity was not observed on the tubular
        endosomes, but rather was associated with the plasma membrane protrusions
- term:
    id: GO:0030036
    label: actin cytoskeleton organization
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: >-
      Real but indirect, and downstream of the GAP activity rather than a function in its own right,
      so kept as non-core.

      For human ACAP1 the actin readouts exist: overexpression blocks ARF6-dependent protrusions in
      HeLa cells, and reduces focal adhesions. But these are consequences of removing active ARF6,
      which is itself a well-known regulator of peripheral actin. ACAP1 does not act on actin; it
      switches off the GTPase that does. Both experiments are overexpression, and the knockdown
      phenotype that ACAP1 does have is a traffic phenotype - accelerated integrin beta-1
      internalisation - not an actin one.

      The WITH/FROM merits a note, because one source is a poor match for this gene even though the
      annotation survives it. FB:FBgn0004133 is Drosophila blown fuse (blow), which PANTHER places in
      PTHR23180 subfamily SF399, but blow has only a PH domain: UniProt annotates no BAR, no Arf-GAP
      and no ankyrin repeats on any of its isoforms (A1Z714, P91678, E1JGZ4, Q8MSU1). Its actin
      annotation is a myoblast-fusion IMP, a lineage-specific developmental phenotype. A
      domain-truncated family member is exactly the kind of source that produces a bad transfer when
      it is the only one. Here it is not: the two Dictyostelium sources are genuine ACAPs, and
      DDB_G0279649 in particular carries actin cytoskeleton organization by both IMP and IGI, plus
      regulation of filopodium assembly by IMP, filamentous actin by IDA and cell cortex by IMP. The
      ancestral inference is therefore sound; it is the role, not the evidence, that makes this
      non-core.
    action: KEEP_AS_NON_CORE
    reason: >-
      A genuine but indirect consequence of ARF6 inactivation, shown by overexpression. ACAP1's own
      activity is GAP catalysis and cargo sorting on the recycling endosome; actin remodelling is
      what ARF6 does when ACAP1 is not acting on it.
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
      - source_id: FB:FBgn0004133
        source_label: blow (blown fuse, Drosophila)
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Placed in PTHR23180 subfamily SF399 but has only a PH domain - no BAR, no Arf-GAP, no ANK
          repeats - so it is not an ACAP and cannot act through ARF6 GAP catalysis. Its GO:0030036 is
          an IMP tied to Drosophila myoblast fusion. Supports an actin role for blow, but should not
          on its own support one for a human Arf-GAP.
      - source_id: dictyBase:DDB_G0279649
        source_label: Dictyostelium Q54WI0
        source_status: SUPPORTS_TRANSFER
        comment: >-
          Full-architecture ACAP (BAR + PH + Arf-GAP) with actin cytoskeleton organization by IMP and
          IGI, regulation of filopodium assembly by IMP, filamentous actin by IDA and cell cortex by
          IMP. This is what actually carries the ancestral inference.
      - source_id: dictyBase:DDB_G0276395
        source_label: Dictyostelium Q551Q8
        source_status: SUPPORTS_TRANSFER
        comment: PH + Arf-GAP architecture, with actin cytoskeleton organization by IGI.
      - source_id: PANTHER:PTN001142372
        source_label: PTHR23180 ancestral node
        source_status: SUPPORTS_TRANSFER
        comment: The CENTAURIN/ARF family node.
    supported_by:
    - reference_id: PMID:11062263
      supporting_text: In HeLa cells, overexpression of either ACAP blocked the formation of Arf6-dependent
        protrusions.
    - reference_id: PMID:25225293
      supporting_text: ARAP2 overexpression promoted large FAs, but ACAP1 overexpression reduced FAs.
    - reference_id: PMID:25225293
      supporting_text: ARAP2 knockdown slowed, whereas ACAP1 knockdown accelerated, integrin β1 internalization.
- term:
    id: GO:0005096
    label: GTPase activator activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: >-
      InterPro2GO mapping from IPR001164 (Arf-GAP domain) and IPR045258 (ACAP1/2/3-like). Both
      signatures match ACAP1 correctly - UniProt annotates the Arf-GAP domain at 405-527 with a
      C4-type zinc finger at 420-443 - and the inferred activity is the one that was measured
      directly on this protein. Accepted.

      Worth recording that IPR045258 is the ACAP1/2/3-specific signature, so this electronic
      annotation is more discriminating than the family-level Arf-GAP one and is not a case of a
      domain match over-reaching. It is also, together with the IBA above, the only thing standing
      between this gene and having no molecular function in GO at all.
    action: ACCEPT
    supported_by:
    - reference_id: file:human/ACAP1/ACAP1-uniprot.txt
      supporting_text: 'DR   InterPro; IPR045258; ACAP1/2/3-like.'
    - reference_id: file:human/ACAP1/ACAP1-uniprot.txt
      supporting_text: 'FT                   /note="Arf-GAP"'
    - reference_id: PMID:11062263
      supporting_text: In vitro, ACAP1 and ACAP2 preferred Arf6 as a substrate, rather than Arf1 and
        Arf5, more so than did ASAP1.
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: located_in
  review:
    summary: >-
      InterPro2GO mapping from IPR004148, the BAR domain, to cytoplasm. The mapping itself is
      uninformative - a BAR domain implies peripheral membrane binding and deformation, not a
      compartment - but the conclusion is true of this protein for a reason the mapping does not
      know: ACAP1 is genuinely a soluble cytosolic protein at rest, and only becomes membrane-bound
      when ARF6-GTP recruits it. Jackson et al. describe it as primarily cytosolic in untreated
      cells, and it stays cytosolic when ARF6 is locked off.

      Retained rather than modified. A more specific term would be recycling endosome membrane, which
      GOA already carries from the SubCell route, but replacing cytoplasm with it would discard a
      pool of the protein that is real and, for a GAP recruited on demand, functionally meaningful.
      The two annotations describe different states of the same protein rather than competing for one
      answer.

      Kept as non-core rather than accepted: the cytosolic pool is where ACAP1 waits, not where it
      works. None of the core functions below lists cytoplasm as a location - all four are sited on
      the recycling endosome membrane - so marking this core would overstate it, and it would be
      inconsistent to grade the generic term above the more informative plasma-membrane annotation,
      which is also non-core.
    action: KEEP_AS_NON_CORE
    reason: >-
      True and experimentally corroborated - ACAP1 is primarily cytosolic until ARF6-GTP recruits it -
      but it records the resting state rather than a site of action, and it derives from an
      InterPro2GO mapping (BAR domain to cytoplasm) that carries no compartment information.
    supported_by:
    - reference_id: PMID:11062263
      supporting_text: In untreated cells, although ACAP1 and ACAP2 were primarily cytosolic, they could
        be observed on tubular portions of the Arf6 endosomal compartment
    - reference_id: PMID:11062263
      supporting_text: ACAP1 remained cytosolic and was not recruited to the endosome or the plasma
        membrane in cells expressing the dominant-negative Arf6, T27N, even in the presence of AlF4
- term:
    id: GO:0055038
    label: recycling endosome membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  review:
    summary: >-
      The best and most informative location on the gene, and the one place where the experimental
      literature did reach GO - though only by accident of routing.

      This row is an electronic mapping of UniProt SubCell SL-0231. But UniProt's underlying
      statement is not a prediction: it is ECO:0000269|PubMed:16256741, a curator's reading of a
      primary experiment, and it specifies the topology as well as the compartment - peripheral
      membrane protein, cytoplasmic side. So the evidence code understates the evidence. The same
      compartment is independently supported by the ARF6-dependent tubular endosome imaging and by
      the tubular recycling endosome assignment in Chen et al.

      Accepted as core. It should be an experimental annotation from PMID:16256741 rather than an
      IEA, which is the same gap as for the molecular function.
    action: ACCEPT
    supported_by:
    - reference_id: file:human/ACAP1/ACAP1-uniprot.txt
      supporting_text: 'CC   -!- SUBCELLULAR LOCATION: Recycling endosome membrane'
    - reference_id: file:human/ACAP1/ACAP1-uniprot.txt
      supporting_text: 'CC       {ECO:0000269|PubMed:16256741}; Peripheral membrane protein'
    - reference_id: PMID:25225293
      supporting_text: ARAP2 formed a complex with APPL1 and colocalized with Arf6 and APPL in a compartment
        distinct from the Arf6/ACAP1 tubular recycling endosome.
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:17474147
  qualifier: enables
  supporting_entities:
  - UniProtKB:P62993
  review:
    summary: >-
      Partner resolved: UniProtKB:P62993 = GRB2. The assay is a peptide-array screen, in which 12 SH3
      domains from eight proteins were run against 1536 immobilised peptides and yielded 921
      interactions.

      Judged against ACAP1's own biology, an SH3 hit is chemically plausible - ACAP1 has a
      proline-rich stretch at 538-549 within its disordered 525-581 region, the kind of PxxP context
      an SH3 domain reads. But an array of synthetic peptides tests a motif, not a protein, and this
      particular pair was not among the ones the authors carried forward to co-immunoprecipitation.
      No functional consequence of an ACAP1-GRB2 association has been reported since.

      Marked over-annotated for what the term records rather than for the partner being impossible.
      Bare protein binding conveys nothing about ACAP1's function, and there is no informative
      molecular-function term to modify it to, because nothing is known about what the interaction
      would do. GRB2 is nonetheless the one screen partner that recurs across two orthogonal assays
      (see PMID:25814554 below), which makes it the one worth testing directly.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Uninformative bare protein binding from a synthetic-peptide array screen that was not validated
      for this pair. Retained in the record as a lead on GRB2 rather than as a statement of function.
    supported_by:
    - reference_id: PMID:17474147
      supporting_text: 'A group of 12 Src homology (SH) 3 domains from eight human proteins (Swiss-Prot
        ID: SRC, PLCG1, P85A, NCK1, GRB2, FYN, CRK) were used to screen a peptide target array composed
        of 1536 potential ligands, which led to the identification of 921 binary interactions between
        these proteins and 284 targets.'
    - reference_id: file:human/ACAP1/ACAP1-uniprot.txt
      supporting_text: 'FT                   /note="Pro residues"'
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:25814554
  qualifier: enables
  supporting_entities:
  - UniProtKB:P62993
  review:
    summary: >-
      Partner resolved: UniProtKB:P62993 = GRB2 again, this time from a phosphotyrosine-dependent
      yeast two-hybrid network in which human kinases were co-expressed to generate pY sites,
      yielding 292 pY-dependent interactions.

      GRB2 recurring in a second, mechanistically different assay is the strongest signal in ACAP1's
      whole interaction record. The difficulty is that the assay premise does not fit what is known
      about the protein: a pY-dependent GRB2 interaction implies a phosphotyrosine on ACAP1 for the
      GRB2 SH2 domain, and no tyrosine phosphorylation of ACAP1 is on record in UniProt. The only
      annotated tyrosine modification is 3'-nitrotyrosine at 485, from a pituitary-adenoma
      nitroproteome, and Y712 was mutated to F with no effect on cargo binding. So the two GRB2 hits
      may not even be reporting the same binding mode - one an SH3-PxxP contact, the other nominally
      SH2-pY.

      Marked over-annotated on the same grounds as the peptide-array row: bare protein binding, no
      functional follow-up, and nothing specific enough to modify it to.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Uninformative bare protein binding from a large-scale pY-dependent Y2H screen whose premise - a
      phosphotyrosine on ACAP1 - has no independent support in the UniProt record.
    supported_by:
    - reference_id: PMID:25814554
      supporting_text: We extended an established yeast two-hybrid system employing human protein kinases
        for the analyses of phospho-tyrosine (pY)-dependent PPIs in a direct experimental, large-scale
        approach.
    - reference_id: PMID:25814554
      supporting_text: We identified 292 mostly novel pY-dependent PPIs
    - reference_id: file:human/ACAP1/ACAP1-uniprot.txt
      supporting_text: 'FT                   /note="3''-nitrotyrosine"'
