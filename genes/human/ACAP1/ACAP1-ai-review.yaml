- description: >-
    Membrane deformation, carried out by the PH domain rather than by the BAR domain that would
    normally do it. ACAP1's BAR domain can neither bind membrane nor impart curvature on its own;
    specific PH-domain residues perform both, while the BAR domain instead binds the BAR domains of
    neighbouring ACAP1 dimers to build the lattice that deforms the bilayer. Banana-shaped homodimers
    assemble laterally into tetramers that pack helically onto the membrane, with only one PH domain
    per dimer inserting. The bending element is Loop1 of the PH domain, between strands beta-1 and
    beta-2, whose distal aromatic residue Phe-280 inserts into a single leaflet: purified protein binds
    and tubulates liposomes in vitro, F280A reduces both binding and tubulation, F280E effectively
    abolishes binding, and the conservative F280W preserves both. In the cryoEM reconstruction of a
    coated tubule the BAR domain makes no significant contact with the bilayer at all. In cells,
    tubulation of endosomal membranes requires both domains and is greatly enhanced when
    phosphoinositide supply is raised by co-expressing PIP5K1C.
