- term:
    id: GO:0042803
    label: protein homodimerization activity
  evidence_type: IDA
  original_reference_id: PMID:25284369
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q15027
  review:
    summary: >-
      Proposed new annotation, and the other half of the domain division of labour recorded on
      GO:0180020 above. The one function ACAP1's BAR domain does have is self-association: it binds the
      BAR domain of another ACAP1 molecule. UniProt states this as a domain property with experimental
      evidence for this paper - the BAR domain mediates homodimerization - and its SUBUNIT line
      describes the protein as a banana-shaped homodimer.

      The evidence resolves stoichiometry, which is what makes the term annotatable rather than merely
      suggestive. Three orthogonal readouts agree on a dimer: the 2.2 angstrom crystal structure
      contains a banana-shaped dimer in one asymmetric unit, with a 4100 square-angstrom and largely
      hydrophobic interface; size exclusion chromatography with light scattering confirms dimerisation
      in solution; and quantitative gel filtration puts the dissociation constant below 5 micromolar,
      tighter than the published value for the N-BAR protein endophilin A2. This is the distinction
      that matters for a self-association term - an affinity-capture or co-immunoprecipitation
      experiment reports co-complex membership and cannot report stoichiometry, whereas
      crystallography, light scattering and a measured Kd do.

      Two things are deliberately not claimed. First, the higher-order assembly. The paper also
      describes lateral packing of dimers into tetramers and helical packing of those tetramers on the
      tubule, and calls the BAR-BAR function clustering at the membrane - but the tetramer and the
      lattice come from fitting the crystal structure into cryoEM maps of roughly 14 and 17 angstrom
      resolution, and clustering of an unspecified number of subunits is not a dimer. So the defensible
      dimer term is used and the lattice is left in prose, rather than reaching for an oligomerisation
      or complex-assembly claim the resolution does not support. Second, the assays used the BAR-PH
      fragment - residues 1-377 in the cryoEM work, 1-364 modelled in the crystal - and not full-length
      ACAP1, so this is a domain-attributed statement about ACAP1 rather than a demonstration on the
      intact protein.

      This is kept out of core_functions deliberately. Homodimerisation is the structural precondition
      for the curved scaffold rather than an output of the protein, and it is already described inside
      the membrane-bending core function; promoting it would give a prerequisite the same weight as the
      GAP activity and the cargo-sorting activity.
    action: NEW
    reason: >-
      The only demonstrated function of ACAP1's BAR domain, and the fact that makes the PH-domain
      attribution of GO:0180020 legible rather than surprising. Annotated at the dimer level because
      dimer stoichiometry is what the crystallography, the light scattering and the measured
      dissociation constant establish; the tetramer and the helical lattice are cryoEM-fitted models
      and are left in prose. Not proposed as a core function.
    supported_by:
    - reference_id: PMID:25284369
      supporting_text: Dimerization of ACAP1BAR-PH was confirmed from size exclusion chromatography and
        light scattering
    - reference_id: PMID:25284369
      supporting_text: The dimer interface has a large area (4100 Å2), and contains mainly hydrophobic
        residues that likely mediate dimerization.
    - reference_id: PMID:25284369
      supporting_text: The in vitro disassociation constant of the dimerization was calculated to be below
        5 µM, according to the quantitative gel-filtration experiment
    - reference_id: PMID:25284369
      supporting_text: The BAR domain adjacent to the PH domain instead interacts with the BAR domains
        of neighboring ACAP1 proteins to enable clustering at the membrane.
    - reference_id: file:human/ACAP1/ACAP1-uniprot.txt
      supporting_text: 'CC   -!- DOMAIN: The BAR domain mediates homodimerization, it can neither bind'
    - reference_id: file:human/ACAP1/ACAP1-uniprot.txt
      supporting_text: 'CC   -!- SUBUNIT: Banana-shaped homodimer laterally assembling into tetramers,'
