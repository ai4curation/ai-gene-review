- id: PMID:11062263
  title: ACAPs are arf6 GTPase-activating proteins that function in the cell periphery.
  findings:
  - statement: ACAP1 is a GAP that prefers ARF6 over ARF1 and ARF5 as substrate.
    supporting_text: In vitro, ACAP1 and ACAP2 preferred Arf6 as a substrate, rather than Arf1 and Arf5,
      more so than did ASAP1.
  - statement: The Arg-448 arginine-finger mutant of ACAP1 is catalytically dead against ARF6.
    supporting_text: '[R448Q]ACAP1 and [R442Q]ACAP2 had no detectable activity using Arf6 as a substrate'
  - statement: ACAP1 GAP activity is stimulated by phosphatidylinositol 4,5-bisphosphate.
    supporting_text: ACAP1 and ACAP2 are preferentially activated by phosphatidylinositol 4,5-bisphosphate
      [PIP2; not shown] and do contain GAP activity.
  - statement: ACAP1 is largely soluble at rest but is present on tubular parts of the ARF6 endosome.
    supporting_text: In untreated cells, although ACAP1 and ACAP2 were primarily cytosolic, they could
      be observed on tubular portions of the Arf6 endosomal compartment
  - statement: Recruitment of ACAP1 to both endosome and plasma membrane requires ARF6-GTP.
    supporting_text: ACAP1 remained cytosolic and was not recruited to the endosome or the plasma membrane
      in cells expressing the dominant-negative Arf6, T27N, even in the presence of AlF4
  - statement: ACAP1 localises to dorsal ruffles and the edge of protrusive cells.
    supporting_text: During PDGF stimulation of NIH 3T3 cells, ACAP1, ACAP2, and ASAP1 colocalized in
      dorsal ruffles and at the edge of resting and protrusive HeLa cells.
  - statement: GAP-dead ACAP1 loses the endosomal pool but retains the plasma-membrane pool, separating
      catalysis from surface recruitment.
    supporting_text: A point mutant of ACAP1 that lacked GAP activity was not observed on the tubular
      endosomes, but rather was associated with the plasma membrane protrusions
  - statement: Overexpressed ACAP1 blocks ARF6-dependent membrane protrusions, an actin readout.
    supporting_text: In HeLa cells, overexpression of either ACAP blocked the formation of Arf6-dependent
      protrusions.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Cached title matches the citation and full text was retrieved from PMC2185579, so every quote
      above is checked against the article body rather than an abstract. The founding paper for the
      gene and the pivot of this review: it establishes ACAP1's ARF6 GAP activity, its lipid
      dependence, the R448Q catalytic mutant, and the ARF6-dependent endosomal and surface pools. It
      is also the paper whose evidence GO captured on the paralog ACAP2 (three IDAs) and not on ACAP1
      (zero annotations, confirmed by QuickGO query), which is the finding this review reports.
