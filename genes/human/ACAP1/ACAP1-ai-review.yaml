core_functions:
- description: >-
    Phosphoinositide-stimulated GTPase-activating protein for ARF6, acting on the cytoplasmic face of
    tubular recycling endosomes to terminate ARF6 signalling. Recombinant ACAP1 accelerates GTP
    hydrolysis on ARF6 in preference to ARF1 and ARF5; activity requires phosphatidylinositol
    4,5-bisphosphate together with phosphatidic acid, and is abolished by mutation of the
    arginine-finger residue Arg-448. Recruitment to the membrane is itself ARF6-GTP dependent, so the
    GAP is delivered to its own substrate, and the catalytically dead mutant is the one form absent
    from the endosomal tubules. Substrate specificity cannot be stated in the term because the
    ARF-specific GAP term was merged into the generic one, so an annotation of this function should
    carry has_input UniProtKB:P62330 (ARF6).
