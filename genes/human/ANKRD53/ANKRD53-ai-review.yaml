- id: PMID:26820536
  title: ANKRD53 interacts with DDA3 and regulates chromosome integrity during mitosis.
  findings:
  - statement: ANKRD53 binds DDA3 and is recruited by it to the spindle.
    supporting_text: Although ANKRD53 is recruited to the mitotic spindle by DDA3, it counteracts the
      activity of DDA3 for spindle MT polymerization.
  - statement: ANKRD53 depletion lowers spindle MT polymerization.
    supporting_text: In addition, spindle MT polymerization decreased and the spindle assembly checkpoint
      (SAC) was concomitantly activated by the decreased spindle dynamics in ANKRD53-depleted cells.
  - statement: ANKRD53 depletion causes unaligned chromosomes and binucleation.
    supporting_text: Furthermore, ANKRD53 depletion increased the number of bi-nuclei and polylobed nuclei.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only; HeLa siRNA study. Source of every experimental row and of all IBA seeds.
  full_text_unavailable: true
- id: PMID:41654016
  title: ANKRD53 is downregulated in human obesity and coordinates lipolysis with mitochondrial oxidative
    metabolism in adipocytes.
  findings:
  - statement: ANKRD53 binds ACSL1 and promotes its mitochondrial localization.
    supporting_text: Mechanistically, ANKRD53 interacted with ACSL1 and promoted its mitochondrial localization,
      channeling lipolysis-derived FFAs into β-oxidation; silencing ACSL1 abrogated ANKRD53's effects.
  - statement: ANKRD53 levels set lipolysis and respiration in adipocytes.
    supporting_text: In human adipocytes, ANKRD53 overexpression enhanced forskolin-stimulated lipolysis
      and mitochondrial respiration, whereas silencing impaired these processes.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text; human adipocytes and mouse adipose tissue. A second, metabolic role; no GO
      term is drawn from a single study.
