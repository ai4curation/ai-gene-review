id: Q8N9V6
gene_symbol: ANKRD53
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ANKRD53 (ankyrin repeat domain-containing 53) is an ankyrin-repeat protein recruited to the
  mitotic spindle by DDA3 (PSRC1). It is phosphorylated in mitosis and localizes around the centrosome
  and then at the spindle poles. There it counteracts DDA3 to sustain spindle microtubule polymerization;
  its depletion delays mitosis, leaves chromosomes unaligned, activates the spindle checkpoint and increases
  binucleate cells. In adipocytes, ANKRD53 binds ACSL1 and promotes its mitochondrial localization, coupling
  lipolysis to fatty-acid oxidation, and its expression falls in obesity.
