core_functions:
- description: 'KRTAP6-3 is a high glycine-tyrosine (HGT) KAP6 family keratin-associated protein that acts as a structural matrix component of the hair fibre: it is deposited between trichocyte keratin intermediate filaments in the keratinizing zone and becomes cross-linked to them, mainly through disulfide bonds (HS/UHS KAPs) or additional non-covalent interactions (HGT KAPs), giving the hair shaft its rigidity and resistance.'
  molecular_function: *id002
  directly_involved_in:
  - id: GO:0031424
    label: keratinization
  locations:
  - *id003
  anatomical_locations:
  - id: UBERON:0002074
    label: hair shaft
  supported_by:
  - *id001
  - reference_id: PMID:18721477
    supporting_text: 'KRTAP contains two major groups: high/ultrahigh cysteine (HS) and high glycine-tyrosine (HGT) that are considered to have originated independently, and are essential for the formation of rigid and resistant hair shafts through their extensive disulfide bond cross-linking with the abundant cysteine residues of hair keratins or hydrophobic interactions with keratins [23,26-28].'
  - reference_id: PMID:28820492
    supporting_text: This suggests that variation in ovine KRTAP6-3 affect MFD, FDSD, and PF
suggested_questions:
- question: Does KAP6.3 bind trichocyte keratin head domains non-covalently, as shown for the HGT protein KAP8.1, and does this explain its association with fibre diameter?
- question: GO lacks a cellular component term for the keratin-associated interfilamentous matrix of the hair cortex/cuticle; should one be requested, as keratin filament is only an approximation?
suggested_experiments:
- hypothesis: KAP6.3 binds trichocyte keratin head domains.
  description: Isothermal titration calorimetry and pull-down assays with recombinant KAP6.3 against K85 and K35 head domains and assembled filaments.
  experiment_type: binding assay
