  review:
    summary: High-throughput binary interaction (IPI, PMID:32296183) of KRTAP6-3 with FCHO1 (UniProtKB:A0A0C3SFZ9), annotated only as bare protein binding.
    action: REMOVE
    reason: Bare protein binding (GO:0005515) is uninformative and is removed under the project protein-binding policy. This row comes from a high-throughput binary interaction screen (yeast two-hybrid or a related assay). Small cysteine-rich keratin-associated proteins are among the most frequently recovered preys in these screens, and they are recovered with hundreds of unrelated partners that are not expressed in hair-forming trichocytes. Removal does not mean the reported interaction is false. The informative function of this protein is its structural role in the disulfide cross-linked hair keratin matrix, which is captured elsewhere in this review.
    supported_by:
