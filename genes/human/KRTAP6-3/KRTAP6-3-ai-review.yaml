id: Q3LI67
gene_symbol: KRTAP6-3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Keratin-associated protein 6-3 (KAP6.3) is a 110-residue high glycine-tyrosine (HGT) keratin-associated protein of the KAP6 family, encoded in the chromosome 21q22.1 KAP gene domain. HGT KAPs are rich in glycine and tyrosine with comparatively few cysteines and are thought to interact with hair keratin intermediate filaments through hydrophobic and other non-covalent interactions as well as limited disulfide bonding. As a component of the interfilamentous matrix of the hair cortex it contributes to the structure of the keratinized hair shaft. In sheep and goats, KRTAP6-3 variants are associated with mean fibre diameter and related wool and cashmere traits.
