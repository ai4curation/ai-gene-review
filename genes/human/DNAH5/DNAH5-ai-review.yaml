id: Q8TE73
gene_symbol: DNAH5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  DNAH5 (dynein axonemal heavy chain 5) is the gamma-type heavy chain of the outer dynein
  arm (ODA), the multi-subunit ATPase motor that attaches every 24 nm to the A-tubule of each
  outer doublet in motile cilia and powers ciliary beating by sliding adjacent doublets. It
  is a ~4,600-residue protein with an N-terminal tail that assembles with the ODA intermediate
  and light chains and a C-terminal motor head of six AAA+ modules and a microtubule-binding
  stalk; it moves toward microtubule minus ends. DNAH5 is present along the whole length of
  respiratory cilia, where it pairs with the beta heavy chain DNAH11 in proximal (type 1)
  ODAs and with DNAH9 in distal (type 2) ODAs, and it is also found in ependymal and embryonic
  nodal cilia. Human sperm flagella use DNAH8 instead. ODAs are preassembled in the cytoplasm
  with chaperones such as ZMYND10 before transport into the cilium, and DNAH5 is needed for
  the whole arm to form: without it the intermediate chain DNAI2 is not incorporated. Biallelic
  loss-of-function variants cause primary ciliary dyskinesia 3 (CILD3), the most common genetic
  cause of PCD with ODA defects. Respiratory cilia are immotile, mucociliary clearance fails,
  and about half of patients have situs inversus because nodal cilia do not beat. Dnah5 mutant
  mice reproduce PCD with situs inversus and develop hydrocephalus because ependymal flow
  is lost.
