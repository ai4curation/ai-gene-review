core_functions:
- description: >-
    Gamma heavy chain and motor of both proximal and distal outer dynein arms in respiratory,
    ependymal and nodal motile cilia; hydrolyses ATP to walk towards microtubule minus ends,
    generating the doublet sliding that drives ciliary beating and the fluid flows of mucociliary
    clearance and nodal left-right patterning. Required for the outer dynein arm to assemble.
  molecular_function:
    id: GO:0008569
    label: minus-end-directed microtubule motor activity
  directly_involved_in:
  - id: GO:0003351
    label: epithelial cilium movement involved in extracellular fluid movement
  - id: GO:0036158
    label: outer dynein arm assembly
  locations:
  - id: GO:0005930
    label: axoneme
  in_complex:
    id: GO:0036157
    label: outer dynein arm
  supported_by:
  - reference_id: PMID:15750039
    supporting_text: >-
      Cilia with complete axonemal DNAH5 deficiency were immotile, whereas cilia with distal
      DNAH5 deficiency showed residual motility.
  - reference_id: PMID:18950741
    supporting_text: >-
      Respiratory cilia contain at least two distinct ODA types: type 1, DNAH9 negative and
      DNAH5 positive (proximal ciliary axoneme); and type 2, DNAH9 and DNAH5 positive (distal
      ciliary axoneme).
  - reference_id: PMID:18950741
    supporting_text: >-
      demonstrating in a complementary manner that DNAH5 is also essential for the axonemal
      assembly of the ODA protein DNAI2 within ODA types 1 and 2.
  - reference_id: PMID:11788826
    supporting_text: >-
      Sequence analysis in individuals with PCD with randomization of LR asymmetry identified
      mutations resulting in non-functional DNAH5 proteins.
  - reference_id: PMID:15269178
    supporting_text: >-
      The axonemal dynein heavy chain gene Mdnah5 is specifically expressed in ependymal cells,
      and is essential for ultrastructural and functional integrity of ependymal cilia.
  - reference_id: PMID:31178125
    supporting_text: >-
      the outer dynein arms (ODAs), through ATPase activity of their heavy chains (HCs), play
      a major role for cilia and flagella beating
suggested_questions:
- question: >-
    Why do DNAH5-mutant patients sometimes report reduced male fertility when DNAH5 is not
    detected in the human sperm axoneme (DNAH8 is the sperm gamma chain)? Is there a minor
    sperm pool of DNAH5, or are fertility effects secondary (e.g. efferent duct cilia)?
- question: >-
    Do human DNAH5 patients have ependymal flow defects comparable to the hydrocephalus of
    Dnah5 mutant mice, and should cerebrospinal fluid circulation be annotated to the human
    gene?
- question: >-
    PANTHER (UniProt cross-reference) classifies DNAH5 in PTHR46532:SF13, a subfamily named
    after cytoplasmic dynein 1 heavy chain, whereas its PAINT IBAs come from the outer-arm
    gamma heavy chain node PTN002472868. Is the current PANTHER subfamily assignment of DNAH5
    correct?
- question: >-
    Is the IBA for dynein light intermediate chain binding (node PTN000743491) placed too
    deep, given that only cytoplasmic dynein complexes contain light intermediate chains?
suggested_experiments:
- description: >-
    Cryo-ET of DNAH5-deficient human airway cilia (or Dnah5 knockout mouse trachea) to define
    which ODA subunits are retained and whether DNAH9/DNAH11 can dock without the gamma chain.
  experiment_type: cryo-electron tomography
- description: >-
    Immunostaining of human and mouse ependymal cilia and efferent duct cilia for DNAH5, with
    high-speed videomicroscopy in DNAH5 patient-derived ependymal or brain organoid models,
    to test a conserved ependymal role.
  experiment_type: immunofluorescence and videomicroscopy
