proposed_new_terms: []
suggested_questions:
- question: GOA currently carries both a NOT|enables GO:0008508 bile acid:sodium symporter activity row
    (IMP, PMID:23589386) and an involved_in GO:0015721 bile acid and bile salt transport row (IBA, PANTHER:PTN000040761)
    for SLC10A4. These are mutually contradictory. Should PAINT revisit the placement of the bile acid
    transport assertion so that the orphan SLC10 branches (SLC10A3, SLC10A4, SLC10A5, SLC10A7) are excluded,
    and is there a mechanism for an experimental NOT annotation to block an incoming IBA automatically?
  experts: []
- question: Is there an appropriate way in GO to record "orphan carrier, substrate unidentified" as a
    positive curatorial statement rather than as the absence of a child term? At present the only honest
    molecular function for SLC10A4 is the bare parent GO:0022857, which is indistinguishable from an uncurated
    annotation, even though in this case the shallowness reflects an extensively documented negative result.
  experts: []
- question: SLC10A4 dose changes synaptic vesicle lumenal acidification and dopamine loading efficiency
    [PMID:25176177], and mast cell granule ATP retention and mediator release [PMID:28439090]. Should
    these be annotated as regulation of vesicle acidification or of vesicular transmitter loading, or
    does the participation test exclude them because the V-ATPase performs the acidification and VMAT2
    performs the amine loading, with SLC10A4's own role not yet resolved into either a transport step
    or a regulatory interaction?
  experts:
  - Klas Kullander
  - Jenny Hallgren
- question: SLC10A4 heterodimerizes with NTCP and reduces NTCP plasma-membrane abundance and taurocholate
    uptake [PMID:22029531, PMID:31256060]. The sign is negative, the system is forced co-expression, and
    native expression of the two genes barely overlaps (brain and intestine versus hepatocyte). Is there
    any tissue in which both are expressed, and if not, should this be treated purely as a heterologous-system
    artifact and left unannotated?
  experts:
  - Joachim Geyer
  - Stan F J van de Graaf
- question: A HuRI yeast two-hybrid hit pairs SLC10A4 with VMA12/TMEM199, an ER protein of the V-ATPase
    assembly pathway [PMID:32296183], which is suggestive given the vesicle acidification phenotype. Is
    this interaction reproducible in an orthogonal assay, and would it change how the acidification phenotype
    should be annotated?
  experts: []
- question: Does the proteolytic cleavage of the long extracellular N-terminus of SLC10A4 [PMID:23589386]
    occur in native neurons or mast cells, and if so should the cleaved form be treated as a distinct
    functional species for annotation purposes?
  experts: []
suggested_experiments:
- hypothesis: SLC10A4 translocates an unidentified solute across the synaptic vesicle membrane, and previous
    negative results reflect the wrong candidate list rather than the absence of transport.
  description: Proteoliposome reconstitution of purified human SLC10A4, with and without N-terminal proteolytic
    cleavage, assayed against an unbiased metabolomic panel by LC-MS/MS rather than a candidate list.
    Every negative result so far comes from whole-cell or oocyte uptake, so a defined system with imposed
    ion and pH gradients is the test that could either identify the substrate or establish that the protein
    does not translocate anything.
  experiment_type: in vitro transport assay with untargeted metabolomic readout
- hypothesis: If SLC10A4 transports a solute into synaptic vesicles, the lumenal abundance of that solute
    will track SLC10A4 gene dose.
  description: Comparative lumenal metabolomics and proteomics of immunoisolated synaptic vesicles from
    wild-type, Slc10a4-null and Slc10a4-overexpressing mice. If SLC10A4 moves a solute, the lumenal content
    of that solute should track its dose in the same way acidification and dopamine loading already do,
    which would convert the modulatory phenotype into a substrate identification.
  experiment_type: comparative organelle metabolomics
- hypothesis: SLC10A4 provides a counter-ion or shunt conductance that the vesicular V-ATPase requires,
    making the acidification change primary and the monoamine loading change secondary to it.
  description: Separate the acidification phenotype from the loading phenotype by measuring V-ATPase-driven
    proton pumping, membrane potential and ATP-dependent dopamine uptake on the same immunoisolated vesicle
    preparations, with and without SLC10A4. This addresses whether SLC10A4 supplies a counter-ion or shunt
    conductance that the V-ATPase needs, which would make it a participant in vesicle acidification, or
    whether it acts upstream of vesicle physiology altogether.
  experiment_type: vesicle electrophysiology and uptake assay
- hypothesis: SLC10A4 acts on vesicle acidification through a physical association with V-ATPase assembly
    machinery rather than by transporting a solute.
  description: Test whether SLC10A4 physically interacts with V-ATPase assembly factors by orthogonal
    co-immunoprecipitation and proximity labelling in neurons and mast cells, following up the HuRI TMEM199
    hit. A reproducible interaction would give a mechanistic route from the protein to the acidification
    phenotype that is currently only a correlation.
  experiment_type: interaction proteomics
- hypothesis: The BASS translocation pathway is structurally degenerate in SLC10A4, which would explain
    twenty years of negative transport assays and argue that even the generic transporter activity term
    is too generous.
  description: Determine the cryo-EM structure of human SLC10A4 and compare its substrate cavity with
    the solved NTCP structures. The BASS fold is retained, so a structure would show whether the translocation
    pathway is intact, occluded, or degenerate, which is the single most direct way to decide whether
    GO:0022857 is the right molecular function or an over-generous one.
  experiment_type: cryo-EM structure determination
