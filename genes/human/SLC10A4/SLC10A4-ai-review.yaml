- id: PMID:18355966
  title: 'Cloning and molecular characterization of the orphan carrier protein Slc10a4: expression in
    cholinergic neurons of the rat central nervous system.'
  findings:
  - statement: Slc10a4 is a 437-residue seven-transmembrane protein with an extracellular N-terminus and
      cytoplasmic C-terminus.
    supporting_text: The rat Slc10a4 protein consists of 437 amino acids and exhibits a seven transmembrane
      domain topology with N(exo)/C(cyt)trans-orientation of the N- and C-terminal ends.
  - statement: Slc10a4 transports none of the NTCP substrates in HEK293 cells or Xenopus oocytes.
    supporting_text: Despite its close phylogenetic relationship to Ntcp, Slc10a4 showed no transport
      activity for the Ntcp substrates taurocholate, estrone-3-sulfate, dehydroepiandrosterone sulfate,
      and pregnenolone sulfate when expressed in HEK293 cells or Xenopus laevis oocytes.
  - statement: Slc10a4 does not transport choline either, excluding the obvious candidate suggested by
      its cholinergic expression.
    supporting_text: Slc10a4 also did not transport choline, which is a substrate of CHT1.
  - statement: Slc10a4 is expressed in cholinergic neurons, co-localizing with ChAT, VAChT and CHT1.
    supporting_text: Co-localization studies with the cholinergic marker proteins choline acetyltransferase
      (ChAT), vesicular acetylcholine transporter (VAChT), and high-affinity choline transporter (CHT1)
      demonstrated expression of Slc10a4 in cholinergic neurons.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified; cited in the UniProt entry for TISSUE SPECIFICITY. Establishes the
      topology, the cholinergic-neuron expression, and a second independent negative transport result.
      Abstract-only in the cache but the assays are named explicitly.
- id: PMID:21742018
