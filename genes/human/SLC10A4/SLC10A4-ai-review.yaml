- id: PMID:32296183
  title: A reference map of the human binary protein interactome.
  findings:
  - statement: HuRI is a proteome-scale yeast two-hybrid screen, so its hits are binary interaction detections
      rather than evidence of any particular molecular function.
    supporting_text: Specifically, yeast two-hybrid (Y2H) represents the only binary PPI assay that can
