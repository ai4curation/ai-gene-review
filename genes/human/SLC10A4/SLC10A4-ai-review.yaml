id: Q96EP9
gene_symbol: SLC10A4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SLC10A4 is a seven-transmembrane integral membrane protein of the SLC10 / bile acid:sodium
  symporter (BASS, TC 2.A.28) family, the family whose characterized members are the hepatic bile salt
  carrier NTCP (SLC10A1) and the ileal bile salt carrier ASBT (SLC10A2). Despite that close phylogenetic
  relationship, SLC10A4 is an orphan carrier whose substrate has not been identified; it has no measurable
  transport activity for bile salts, steroid sulfates, choline, acetylcholine, monoamines, amino-acid
  neurotransmitters or ATP in CHO, HEK293, CAD or Xenopus oocyte systems, and an engineered chimera that
  restores its delivery to the plasma membrane remains inactive [PMID:17106928, PMID:18355966, PMID:26084360].
  Rather than residing in the bulk plasma membrane like NTCP, the protein is concentrated in the membranes
  of synaptic vesicles in cholinergic and monoaminergic neurons of the central and peripheral nervous
  system, where it co-localizes with synaptophysin, the vesicular acetylcholine transporter VAChT and
  the vesicular monoamine transporter VMAT2, and in the secretory granules of mast cells [PMID:18355966,
  PMID:21742018, PMID:25176177]; this distribution gives it its alternative name VAAT, vesicular aminergic-associated
  transporter. In the human brain it is most prominent in cholinergic and monoaminergic neurons and the
  lateral geniculate body [PMID:23948907]. Its reported biology is modulatory rather than directly transport-defining;
  synaptic vesicles lacking it load dopamine less efficiently while vesicles from overexpressing mice
  are more acidic, null mice have reduced striatal monoamine content, elevated dopamine turnover and slowed
  dopamine clearance, hippocampal slices show spontaneous gamma oscillations and cholinergic hypersensitivity,
  neuromuscular junctions are structurally and functionally remodelled, and mast cells release fewer granule-associated
  mediators after IgE/antigen stimulation [PMID:25176177, PMID:23022458, PMID:25410831, PMID:28439090].
  It also heterodimerizes with NTCP in co-expression systems and reduces NTCP plasma-membrane abundance
  and taurocholate uptake, a negative effect on a partner's trafficking rather than bile salt transport
  of its own [PMID:22029531, PMID:31256060]. The protein carries an unusually long extracellular N-terminus
  relative to SLC10A1/A2/A6 that can be cleaved by thrombin [PMID:23589386].
