  - statement: In the brain SLC10A4 is exclusively expressed in presynaptic vesicles of monoaminergic
      and cholinergic neurons and has a regulatory role in dopamine homeostasis.
    supporting_text: Here we report that the orphan transporter SLC10A4, which in the brain is exclusively
      expressed in presynaptic vesicles of monoaminergic and cholinergic neurons, has a regulatory role
      in dopamine homeostasis.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified; abstract-only. The most informative functional study. Note that it
      explicitly reports failure to demonstrate direct dopamine transport, so despite the word transporter
      in its title it supports a modulatory role rather than a dopamine transporter annotation.
