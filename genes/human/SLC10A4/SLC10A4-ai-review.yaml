    id: GO:0022857
    label: transmembrane transporter activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - AGI_LocusCode:AT2G26900
  - AGI_LocusCode:AT4G12030
  - AGI_LocusCode:AT4G22840
  - PANTHER:PTN000040756
  - RGD:3681
  - RGD:3682
  - UniProtKB:Q14973
  review:
    summary: PAINT places generic transmembrane transporter activity deep in the BASS family, at node
      PANTHER:PTN000040756, a node whose descendants include the Arabidopsis BASS carriers as well as
      the mammalian SLC10 bile salt transporters. The curator therefore judged that carrier activity arose
      at or before the divergence of plants and animals, and deliberately asserted it only at the uninformative
      parent level, without committing to a substrate. SLC10A4 inherits it.
    action: ACCEPT
    reason: 'This is exactly the right annotation for this protein, and its shallowness is the point rather
      than a defect to be fixed. SLC10A4 is an orphan carrier. It retains the BASS fold and the seven-transmembrane
      carrier architecture [PMID:18355966], but no substrate has been found for it despite systematic
      effort across bile acids, steroid sulfates, monoamines, acetylcholine, choline, amino-acid transmitters
      and ATP, in four expression systems, and including a chimera engineered to reach the plasma membrane
      [PMID:17106928, PMID:18355966, PMID:26084360]. A parent term that asserts carrier-type activity
      without naming a cargo is the only honest molecular-function statement available, and it should
      NOT be deepened to `GO:0008508` or any other substrate-specific child unless and until a substrate
      is identified — note that this same GOA record already carries an explicit negation of `GO:0008508`.
      The alternative objection, that even the parent overstates matters because SLC10A4 may act as a
      vesicular regulator rather than a carrier, is not pursued here. Reviewing an IBA means arguing with
      the node placement, the fold and topology are demonstrably retained, and there is no target-specific
      evidence of structural loss of the transport pathway. Failure to identify a substrate in the assays
      tried is not evidence that no substrate exists, as the authors of the most systematic screen are
      careful to say ("at least in the transport assays used"). Structural check added after this review
      was first written: a family-wide comparison against the ligand-bound NTCP cryo-EM structures finds
      every side-chain sodium ligand conserved in SLC10A4 (the one substitution, C260 to S338, is at a
      main-chain-only contact) and all three polar anchors of the bile-salt pocket retained, with the
      hydrophobic lining remodelled (T203 to F281). That replaces the earlier assertion that the fold
      and pathway are retained with a coordinate-level observation, and argues against both deepening
      and further downgrading this term: the capability is structurally present, the cargo is unknown.
      Two OpenScientist runs, blind to this analysis, independently returned the same verdict [file:human/SLC10A4/SLC10A4-bioinformatics/RESULTS.md].'
    additional_reference_ids:
    - PMID:17106928
    - PMID:26084360
    supported_by:
    - reference_id: PMID:18355966
      supporting_text: The rat Slc10a4 protein consists of 437 amino acids and exhibits a seven transmembrane
        domain topology with N(exo)/C(cyt)trans-orientation of the N- and C-terminal ends.
    - reference_id: PMID:26084360
      supporting_text: SLC10A4 failed to show transport activity for dopamine, serotonin, norepinephrine,
        histamine, acetylcholine, choline, acetate, aspartate, glutamate, gamma-aminobutyric acid, pregnenolone
        sulfate, dehydroepiandrosterone sulfate, estrone-3-sulfate, and adenosine triphosphate, at least
        in the transport assays used.
    - reference_id: file:human/SLC10A4/SLC10A4-bioinformatics/RESULTS.md
      supporting_text: 'SLC10A4 **retains the sodium-coordinating machinery intact** — all

        12 side-chain ligands conserved — so its orphan status is **not** explained by

        degeneration of the ion-coupling site.'
    propagation_review:
      root_cause: NO_FAILURE_CORE
