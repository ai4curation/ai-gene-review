      - source_id: PANTHER:PTN000040756
        source_status: SUPPORTS_TRANSFER
        comment: Deep BASS-family node asserting only substrate-agnostic carrier activity; this is the
          correct level of specificity for an orphan carrier and must not be deepened to a substrate-specific
          child.
