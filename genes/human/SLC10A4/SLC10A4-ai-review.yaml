- id: PMID:31256060
  title: Homo- and heterodimerization is a common feature of the solute carrier family SLC10 members.
  findings:
  - statement: SLC10A4 is one of four orphan carriers in the SLC10 family.
    supporting_text: the steroid sulfate transporter SOAT as well as four orphan carriers (SLC10A3, SLC10A4,
