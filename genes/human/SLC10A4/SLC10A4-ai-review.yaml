  findings:
  - statement: Slc10a4 resides in synaptic vesicles, co-localizing with synaptophysin, VAChT and VMAT2
      in rat brain vesicle preparations.
    supporting_text: Western blot and immunoprecipitation experiments with rat brain vesicle preparations
      revealed that the Slc10a4 protein was expressed in synaptic vesicles where it co-localized with
      synaptophysin, VAChT and VMAT2.
  - statement: Slc10a4 is also present in the secretory granules of peritoneal and tissue mast cells.
    supporting_text: Slc10a4 expression was also detected in granules of rat peritoneal and tissue mast
