- id: PMID:25176177
  title: SLC10A4 is a vesicular amine-associated transporter modulating dopamine homeostasis.
  findings:
  - statement: SLC10A4 is on the same synaptic vesicles as VAChT or VMAT2.
    supporting_text: We show that SLC10A4 is localized on the same synaptic vesicles as either vesicular
