  review:
    summary: Direct observation of SLC10A4 at the cell membrane in PMID:23589386, the study in which thrombin
      cleaves the protein's extracellular N-terminus — an experiment that requires at least some of the
      protein to be surface-exposed. UniProt records the same conclusion in its SUBCELLULAR LOCATION field
      as Cell membrane with ECO:0000269|PubMed:23589386. An earlier overexpression study reached a similar
      split conclusion in CHO cells [PMID:17106928].
    action: KEEP_AS_NON_CORE
    reason: 'The annotation is retained. The cached record for PMID:23589386 is abstract-only (`full_text_available:
      false`), so the full images and fractionations the UniProt curator saw are not available to this
      review, and the annotation is not second-guessed; the thrombin-cleavage design independently implies
      surface exposure, and an independent group reports plasma-membrane plus intracellular staining in
      transfected CHO cells [PMID:17106928]. It is marked non-core rather than accepted because the plasma
      membrane is not where this protein does its known biology. Its principal steady-state location in
      native tissue is the synaptic vesicle membrane and the mast cell granule membrane [PMID:21742018,
      PMID:25176177], the surface signal is reported from heterologous overexpression systems, and PMID:26084360
      found that wild-type SLC10A4 required an NTCP C-terminal swap to reach the plasma membrane at all
      in neuronal and HEK293 cells. A minority surface pool is a real but peripheral localization for
      this carrier, which is why this `located_in` row is kept while the `is_active_in` IBA row for the
      same term is modified.'
