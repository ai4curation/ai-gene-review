- term:
    id: GO:0008508
    label: bile acid:sodium symporter activity
  evidence_type: IMP
  original_reference_id: PMID:23589386
  qualifier: enables
  negated: true
  review:
    summary: This is a **negated** annotation (`NOT|enables`, ECO:0000315) — GOA asserts that SLC10A4
      does NOT have bile acid:sodium symporter activity, on the basis of PMID:23589386. The negation is
      the correct reading of that paper and of the wider literature. The paper's own opening statement
      is that the protein has no bile acid transport activity, and its positive conclusion is heavily
      hedged and conditional on proteolytic activation.
    action: ACCEPT
    reason: The annotation is accepted exactly as asserted — as a negation. PMID:23589386 is abstract-only
      in the cache, and its title ("SLC10A4 is a protease-activated transporter that transports bile acids")
      reads as a positive claim, so it is worth being precise about what the study shows. It reports that
      thrombin treatment of TE671 cells increases lithocholic and taurocholic acid accumulation and LCA
      cytotoxicity, and that siRNA knockdown of SLC10A4 abolishes that increment — an SLC10A4-dependent,
      protease-dependent uptake phenotype in whole cells. It does not report sodium dependence, transport
      stoichiometry, saturation kinetics, or activity in a reconstituted or defined heterologous system,
      which is what `GO:0008508` requires, namely "bile acid(out) + Na+(out) = bile acid(in) + Na+(in)".
      The baseline the authors themselves state is no activity, and their conclusion is phrased as "may
      have low activity but becomes activated". The UniProt curator, who read the full text, drew the
      same conclusion and recorded it twice — as this negated GO row and as the FUNCTION comment "No significant
      bile acid transporter activity could be measured despite its similarity to bile acid:sodium symporters"
      (ECO:0000269|PubMed:23589386). Four independent studies agree, with no taurocholate uptake in CHO
      cells [PMID:17106928], none for any NTCP substrate in HEK293 or Xenopus oocytes [PMID:18355966],
      none across a fourteen-substrate screen including a plasma-membrane-targeted chimera [PMID:26084360],
      and the field's own summary that the substrate remains unknown [PMID:28439090]. Accepting the negation
      is therefore both faithful to the curator and the best-supported position; the GOA record's remaining
      problem is the `GO:0015721` IBA that contradicts this negation, which is handled on that row.
    additional_reference_ids:
    - PMID:17106928
    - PMID:18355966
    - PMID:26084360
    - PMID:28439090
    supported_by:
    - reference_id: PMID:23589386
      supporting_text: SLC10A4 belongs to the sodium bile acid cotransporter family, but has no transport
        activity for bile acids.
    - reference_id: PMID:23589386
      supporting_text: Therefore, SLC10A4 may have low activity but becomes activated by proteases, including
        thrombin, following cleavage.
    - reference_id: PMID:17106928
      supporting_text: Functional analysis of SLC10A4 showed no significant taurocholate uptake in the
        presence of sodium when compared to untransfected CHO cells.
    - reference_id: PMID:18355966
      supporting_text: Despite its close phylogenetic relationship to Ntcp, Slc10a4 showed no transport
        activity for the Ntcp substrates taurocholate, estrone-3-sulfate, dehydroepiandrosterone sulfate,
        and pregnenolone sulfate when expressed in HEK293 cells or Xenopus laevis oocytes.
    - reference_id: PMID:28439090
      supporting_text: In spite of significant efforts, the substrate(s) of SLC10A4 still essentially
        remains unknown
- term:
    id: GO:0015721
    label: bile acid and bile salt transport
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000040761
  - RGD:3681
  - RGD:3682
  review:
    summary: PAINT places participation in bile acid and bile salt transport at node PANTHER:PTN000040761,
      seeded by the experimentally characterized rat SLC10 bile salt carriers, and propagates it to SLC10A4.
      The assertion is directly contradicted by experiment on SLC10A4 itself — including by a negated
      annotation in this same GOA record — and by four independent transport studies in four expression
      systems.
    action: REMOVE
    reason: This is an over-propagation to a family member that lost (or never had) the family activity,
      and it creates an internal contradiction in the GOA record, because `NOT|enables GO:0008508 bile
      acid:sodium symporter activity` (IMP) and `involved_in GO:0015721 bile acid and bile salt transport`
      (IBA) cannot both stand. The experimental side wins, and it is not a single study. No taurocholate
      uptake in CHO cells [PMID:17106928]; none for taurocholate, estrone-3-sulfate, DHEA-sulfate or pregnenolone
      sulfate in HEK293 cells or Xenopus oocytes [PMID:18355966]; a systematic fourteen-substrate screen
      with positive controls found nothing, and — crucially closing the trafficking escape hatch — an
      SLC10A4-NTCP chimera that does reach the plasma membrane was still inactive, with or without the
      N-terminal domain [PMID:26084360]; and reviews of the family place SLC10A4 among the orphan carriers
      [PMID:31256060]. The challenge here is to the node placement and not to donor strength. The rat
      donors are well-characterized bile salt carriers and a short donor list is not weak support, but
      there is strong target-specific evidence of divergence. SLC10A4 kept the BASS fold and seven-TM
      topology while losing the bile-acid sub-activity, and relocated from the plasma membrane to synaptic
      vesicles and secretory granules [PMID:21742018]. Its only reported connection to bile salt handling
      is indirect and of the opposite sign, since heterodimerization with NTCP in forced co-expression
      reduces NTCP surface abundance and taurocholate uptake [PMID:22029531, PMID:31256060] — a negative
      effect on a partner's trafficking, in systems where the two proteins are artificially co-expressed,
      and in native tissue SLC10A4 (brain, intestine) and NTCP (hepatocyte) barely overlap. That is not
      participation in bile acid transport, and it is far too indirect to justify a regulation-of-transport
      term either; it is raised under suggested_questions instead.
    additional_reference_ids:
    - PMID:17106928
    - PMID:18355966
    - PMID:23589386
    - PMID:26084360
    - PMID:31256060
    supported_by:
    - reference_id: PMID:26084360
      supporting_text: But this chimera also did not show any transport activity, even when the N-terminal
        domain of SLC10A4 was deleted by mutagenesis.
    - reference_id: PMID:18355966
      supporting_text: Despite its close phylogenetic relationship to Ntcp, Slc10a4 showed no transport
        activity for the Ntcp substrates taurocholate, estrone-3-sulfate, dehydroepiandrosterone sulfate,
        and pregnenolone sulfate when expressed in HEK293 cells or Xenopus laevis oocytes.
    - reference_id: PMID:17106928
      supporting_text: To date, we have shown that this protein has no capacity to transport taurocholate
        relative to SLC10A1
    - reference_id: PMID:23589386
      supporting_text: SLC10A4 belongs to the sodium bile acid cotransporter family, but has no transport
        activity for bile acids.
    - reference_id: PMID:31256060
      supporting_text: the steroid sulfate transporter SOAT as well as four orphan carriers (SLC10A3,
        SLC10A4, SLC10A5 and SLC10A7)
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      - PSEUDO_OR_SUBACTIVITY_LOSS
      source_entities:
      - source_id: PANTHER:PTN000040761
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Ancestral SLC10 bile salt transport node is well founded for the NTCP/ASBT clade, but
          SLC10A4 is an orphan branch with direct experimental negation of the activity.
      - source_id: RGD:3681
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Rat SLC10 bile salt carrier donor; the donor annotation is sound and the transfer is
          what fails.
      - source_id: RGD:3682
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Rat SLC10 bile salt carrier donor; the donor annotation is sound and the transfer is
          what fails.
      residue_claims_not_applicable: The loss of bile-acid handling is established by direct transport
        assays in four expression systems and by a plasma-membrane-targeted chimera that remains inactive,
        not by any residue-substitution argument; no catalytic or substrate-contact position is claimed
