- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - MGI:MGI:1201406
  - PANTHER:PTN000040759
  - RGD:3681
  - RGD:3682
  - UniProtKB:Q14973
  - UniProtKB:Q96EP9
  review:
    summary: PAINT places plasma-membrane localization at ancestral node PANTHER:PTN000040759 in the SLC10/BASS
      family, and SLC10A4 inherits it as an `is_active_in` assertion. The node is sound for the family's
      characterized members — NTCP (UniProtKB:Q14973) and the rodent bile salt carriers are bona fide
      plasma-membrane transporters — but SLC10A4 diverged to a vesicular compartment. Its steady-state
      pool is in the membranes of synaptic vesicles of cholinergic and monoaminergic neurons and in mast
      cell granules [PMID:21742018, PMID:25176177], and every functional effect ever measured for it (vesicular
      dopamine loading efficiency, vesicle acidification, granule mediator release) was measured on those
      vesicles, not at the cell surface.
    action: MODIFY
    reason: The quarrel here is with the compartment, not with the node placement or the donor set; this
      is a genuine case of functional and compartmental divergence within a family rather than a weak
      inference. `is_active_in` is the strong form of a localization assertion — it claims the gene product
      executes its molecular function at that location — and for SLC10A4 no activity has been demonstrated
      at the plasma membrane or anywhere else. What is positively established is vesicular residence,
      by immunoprecipitation from rat brain vesicle preparations with synaptophysin, VAChT and VMAT2 [PMID:21742018],
      co-localization on VAChT- or VMAT2-positive synaptic vesicles [PMID:25176177], and a vesicle-like
      pattern in neuronal cell lines [PMID:26084360]. Indeed PMID:26084360 shows the wild-type protein
      does NOT reach the plasma membrane efficiently in CAD/HEK293 cells — plasma-membrane expression
      had to be engineered by swapping in the NTCP C-terminus. The term is therefore replaced with `GO:0030672
      synaptic vesicle membrane`, the compartment for which the evidence is direct. Note that the surface
      pool reported in heterologous overexpression is not being denied; it is retained by the two separate
      `located_in plasma membrane` rows (IDA and IEA), which this review keeps as non-core — the differing
      actions across the three GO:0005886 rows are deliberate and track the difference between claiming
      the protein is merely present at the surface and claiming it acts there. Note also that SLC10A4
      appears in its own WITH/FROM list (UniProtKB:Q96EP9); that is correct and expected, because its
      own IDA plasma-membrane annotation is one of the descendant evidences the PAINT curator used to
      place the IBD, and it is not circular.
    proposed_replacement_terms:
    - id: GO:0030672
      label: synaptic vesicle membrane
    additional_reference_ids:
    - PMID:21742018
    - PMID:25176177
    - PMID:26084360
    supported_by:
    - reference_id: PMID:21742018
      supporting_text: Western blot and immunoprecipitation experiments with rat brain vesicle preparations
        revealed that the Slc10a4 protein was expressed in synaptic vesicles where it co-localized with
        synaptophysin, VAChT and VMAT2.
    - reference_id: PMID:25176177
      supporting_text: We show that SLC10A4 is localized on the same synaptic vesicles as either vesicular
        acetylcholine transporter or vesicular monoamine transporter 2.
    - reference_id: PMID:26084360
      supporting_text: When the C-terminus of SLC10A4 was replaced by the homologous sequence of NTCP,
        the SLC10A4-NTCP chimeric protein revealed clear plasma membrane expression in CAD and HEK293
        cells.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN000040759
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Ancestral SLC10/BASS node; plasma-membrane localization is right for the carrier members
          but SLC10A4 relocated to synaptic vesicle and secretory granule membranes.
      - source_id: UniProtKB:Q14973
        source_label: SLC10A1
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: NTCP is a genuine basolateral plasma-membrane bile salt symporter; the compartment does
          not transfer to its vesicular paralog.
      - source_id: UniProtKB:Q96EP9
        source_label: SLC10A4
        source_status: SUPPORTS_TRANSFER
        comment: Self-reference is the target's own IDA plasma-membrane annotation feeding the IBD; it
          grounds a surface pool and is not circular, but it supports located_in rather than is_active_in.
      residue_claims_not_applicable: The divergence argued here is a change of subcellular compartment,
        established by immunolocalization and vesicle fractionation, not a substitution at any particular
        position.
