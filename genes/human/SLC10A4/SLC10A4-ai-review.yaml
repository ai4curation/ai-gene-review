  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified; abstract-only. Knockout-phenotype evidence extending the modulatory
      role to the peripheral cholinergic synapse. Necessity evidence only, so no process annotation is
      proposed from it.
- id: PMID:26084360
  title: Expression, sorting and transport studies for the orphan carrier SLC10A4 in neuronal and non-neuronal
    cell lines and in Xenopus laevis oocytes.
  findings:
  - statement: A systematic fourteen-substrate screen with positive controls found no transport activity
      for SLC10A4.
    supporting_text: SLC10A4 failed to show transport activity for dopamine, serotonin, norepinephrine,
      histamine, acetylcholine, choline, acetate, aspartate, glutamate, gamma-aminobutyric acid, pregnenolone
      sulfate, dehydroepiandrosterone sulfate, estrone-3-sulfate, and adenosine triphosphate, at least
