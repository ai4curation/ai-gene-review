- id: file:human/SLC10A4/SLC10A4-bioinformatics/RESULTS.md
  title: 'SLC10 pocket-conservation analysis: NTCP sodium and preS1 sites across the human family'
  findings:
  - statement: 'SLC10A4 retains every side-chain sodium ligand of NTCP: 11 of 12 sodium-contacting positions
      are identical and the single substitution (C260 to S338) is at a position that contacts sodium only
      through a main-chain atom, so its orphan status is not explained by degeneration of the ion-coupling
      site.'
    supporting_text: '**SLC10A4''s single substitution is C260→S338, and position 260 is a main-chain

      contact — so every side-chain sodium ligand is conserved.**'
  - statement: In the NTCP bile-salt pocket (defined from bound glycochenodeoxycholate in 7ZYI) SLC10A4
      keeps all three polar anchors N103, N262 and Q264 but remodels the hydrophobic lining, including
      T203 to F281 which introduces a bulky aromatic.
    supporting_text: 'So SLC10A4 keeps the polar recognition triad but remodels the hydrophobic

      lining, with T203→F281 placing a bulky aromatic in the pocket'
  - statement: The myristoyl/preS1 pocket of NTCP is not retained in any human paralogue, consistent with
      HBV receptor function being NTCP-specific.
    supporting_text: 'The myristoyl

      (HBV preS1 anchor) pocket is NTCP-specific; no paralogue retains it.'
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Local reproducible analysis written for this review round; sites are defined from ligand
      contacts in experimental NTCP cryo-EM structures and the residue correspondence passes a method
      control on the SLC10A1 model itself. Two OpenScientist hypothesis jobs run blind to this analysis
      reached the same verdict (REFUTED for the degeneration hypothesis). It supports the structural premise
      of the GO:0022857 argument; it is prediction-based for every paralogue and no review action rests
      on it.
core_functions:
- description: Substrate-agnostic carrier activity in the membranes of synaptic vesicles and secretory
    granules. SLC10A4 retains the full bile acid:sodium symporter (BASS) fold and seven-transmembrane
    carrier architecture of the SLC10 family, but it is an orphan carrier and no substrate has been identified
    for it. Systematic screens across bile salts, steroid sulfates, monoamines, acetylcholine, choline,
    acetate, amino-acid neurotransmitters and ATP, in CHO, HEK293, CAD and Xenopus oocyte systems, found
    no transport activity, and an SLC10A4-NTCP chimera engineered to reach the plasma membrane remained
    inactive, which excludes mislocalization as the explanation. Unlike its paralogs NTCP and ASBT, which
    work at the plasma membrane, SLC10A4 is concentrated on synaptic vesicles of cholinergic and monoaminergic
    neurons, alongside VAChT and VMAT2, and on mast cell secretory granules, with only a minority surface
    pool seen in overexpression. Its reported biology is modulation of those vesicles rather than a defined
    translocation event, in that vesicular dopamine loading efficiency and lumenal acidification scale
    with SLC10A4 dose, and granule mediator release depends on it. Whether that modulation is itself the
    transport of an unidentified lumenal solute, or a non-transport effect of the protein on vesicle physiology,
    is the central open question for this gene. The molecular function is therefore deliberately left
    at the uninformative parent, which should not be deepened to any substrate-specific child — least
    of all to bile acid:sodium symporter activity, which this gene product is explicitly annotated NOT
    to have.
  molecular_function:
    id: GO:0022857
    label: transmembrane transporter activity
  locations:
  - id: GO:0030672
    label: synaptic vesicle membrane
  knowledge_gaps:
  - gap_statement: The solute translocated by SLC10A4 is undetermined, and it is not established that
      the protein translocates anything at all rather than acting on vesicle physiology by a non-transport
      mechanism.
    boundary: Firmly established is that SLC10A4 retains the BASS fold and a seven-transmembrane carrier
      topology, that it resides on synaptic vesicle and secretory granule membranes alongside VAChT and
      VMAT2, and that its gene dose changes vesicular monoamine loading efficiency, lumenal acidification
      and granule mediator release. At least fourteen candidate solutes have been excluded in CHO, HEK293,
      CAD and Xenopus oocyte assays, and a plasma-membrane-targeted SLC10A4-NTCP chimera excludes mislocalization
      as the explanation for those negatives.
    gap_kind:
    - BIOLOGY
    dark_aspect: MF_DARK
    status: OPEN
    significance: Without a substrate the molecular function cannot be stated beyond the bare parent term,
      which leaves a replicated set of neuronal and mast cell phenotypes with no mechanistic account and
      makes the gene look under-curated when it is in fact genuinely unknown.
    resolution: Reconstitution of purified SLC10A4 in proteoliposomes with an untargeted metabolomic readout,
      or comparative lumenal metabolomics of immunoisolated vesicles across the null, wild-type and overexpressing
      states, so that a candidate solute tracks gene dose as acidification and dopamine loading already
      do.
