- term:
    id: GO:0016020
    label: membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  supporting_entities:
  - ARBA:ARBA00028763
  - InterPro:IPR002657
  review:
    summary: Automatic annotation from the InterPro bile acid:sodium symporter signature IPR002657 together
      with an ARBA rule, placing SLC10A4 in a membrane. SLC10A4 is a seven-transmembrane integral membrane
      protein, so this is correct irrespective of which membrane it occupies.
    action: ACCEPT
    reason: The inference is sound and uncontroversial. SLC10A4 has a demonstrated seven-transmembrane
      topology with an extracellular N-terminus and cytoplasmic C-terminus [PMID:18355966], and UniProt
      records it as a multi-pass membrane protein. `GO:0016020 membrane` is deliberately unspecific, which
      is a virtue here rather than a defect, because the protein is distributed between synaptic vesicle
      and secretory granule membranes, intracellular compartments, and a minority plasma-membrane pool,
      and the specific compartments are captured by the other cellular-component rows and by the proposed
      `GO:0030672` replacement. The signature is the right one — IPR002657 is the BASS family domain,
      which SLC10A4 genuinely carries — so there is no propagation defect to correct.
    additional_reference_ids:
    - PMID:18355966
    supported_by:
    - reference_id: PMID:18355966
      supporting_text: The rat Slc10a4 protein consists of 437 amino acids and exhibits a seven transmembrane
        domain topology with N(exo)/C(cyt)trans-orientation of the N- and C-terminal ends.
