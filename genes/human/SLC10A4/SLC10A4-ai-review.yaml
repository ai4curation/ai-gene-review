  - statement: Wild-type SLC10A4 does not reach the plasma membrane efficiently in CAD or HEK293 cells;
      plasma-membrane delivery had to be engineered by replacing its C-terminus with that of NTCP.
    supporting_text: When the C-terminus of SLC10A4 was replaced by the homologous sequence of NTCP, the
