id: Q8NB16
gene_symbol: MLKL
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  MLKL (mixed lineage kinase domain-like) is a cytosolic pseudokinase that executes necroptosis, a
  lytic, caspase-independent form of programmed cell death. It has an N-terminal four-helix bundle
  (4HB) executioner domain, a two-helix brace and a C-terminal pseudokinase domain. The pseudokinase
  domain binds ATP without divalent cations but has no protein kinase activity; it acts as a
  phosphorylation-controlled molecular switch. During necroptosis RIPK3, within the RIPK1-RIPK3
  necrosome, phosphorylates the MLKL activation loop (T357/S358 in human). This releases the 4HB
  domain, and activated MLKL self-associates into oligomers, a step that also depends on highly
  phosphorylated inositol phosphates. The oligomers move to the plasma membrane, where a basic patch
  on the 4HB binds phosphatidylinositol phosphates, preferentially PI(4,5)P2, and MLKL compromises
  membrane integrity, leading to ion influx and cell lysis. In mouse cells MLKL can also act in the
  nucleus during ZBP1-dependent responses to influenza virus.
