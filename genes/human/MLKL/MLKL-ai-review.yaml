  review:
    summary: 'NOT annotation (ISS) asserting that MLKL lacks protein kinase activity. MLKL is a pseudokinase:
      its kinase-like domain binds ATP and RIPK3 but is catalytically inactive.'
    action: ACCEPT
    reason: The negated annotation is correct. Structural and biochemical work established MLKL as a catalytically
      inactive pseudokinase whose pseudokinase domain functions as a phospho-regulated switch/latch. An
      early report of in vitro MLKL kinase activity (PMID:22421439) was not borne out.
