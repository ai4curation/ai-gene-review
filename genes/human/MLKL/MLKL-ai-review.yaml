  qualifier: enables
  review:
    summary: Recombinant human MLKL directly permeabilizes liposomes, the biochemical basis of its role in
      necroptotic plasma membrane rupture.
    action: NEW
    reason: MLKL itself performs the step. Recombinant MLKL alone permeabilizes PIP-containing liposomes
      in dye-release assays, and monomer-stabilized pseudokinase mutants lose both permeabilization and
      killing. In the comparator check, other membrane-disrupting cell-death executioners carry this
      term (NINJ1, IDA), and GSDMD carries the related wide pore channel activity. Whether MLKL forms a
      discrete pore is unresolved, so the general term is proposed rather than a channel term.
