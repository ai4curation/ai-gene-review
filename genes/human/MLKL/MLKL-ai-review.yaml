suggested_questions:
- question: How is the pore or lesion formed by human MLKL tetramers or higher-order oligomers
    organized at the plasma membrane, and is it a proteinaceous pore or a lipid-disrupting assembly?
- question: Does nuclear MLKL have a function of its own, or is the nuclear pool simply the
    phosphorylated protein in transit before membrane translocation?
suggested_experiments:
- hypothesis: Human MLKL oligomers permeabilize membranes in a PI(4,5)P2-dependent manner.
  description: Reconstitute phosphorylated human MLKL with liposomes of defined PIP composition,
    and measure dye release alongside oligomeric state (native PAGE, cryo-EM).
