id: Q8NB16
gene_symbol: MLKL
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: MLKL (mixed lineage kinase domain-like protein) is the terminal executioner of necroptosis,
  a lytic, caspase-independent form of programmed cell death. It consists of an N-terminal four-helix
  bundle (4HB) "killer" domain joined by brace helices to a C-terminal pseudokinase domain that binds
  ATP but lacks catalytic activity. In resting cells MLKL is a soluble cytoplasmic protein held inactive
  by its pseudokinase domain. Following death-receptor (e.g. TNFR1), Toll-like receptor or ZBP1 signaling,
  the kinase RIPK3 binds MLKL within the necrosome and phosphorylates its activation loop (T357/S358 in
  human), triggering a conformational switch that, together with binding of highly phosphorylated soluble
  inositol phosphates (e.g. IP6), releases the 4HB domain. Activated MLKL homo-oligomerizes, binds phosphatidylinositol
  phosphates through a basic surface patch, translocates to the plasma membrane (and intracellular membranes)
  and directly compromises membrane integrity, accompanied by Ca2+ and Na+ influx, phosphatidylserine
  exposure and, ultimately, cell lysis with release of damage-associated molecular patterns. ESCRT-III-mediated
  membrane repair can counteract limited MLKL activation. MLKL-deficient mice develop normally but are
  resistant to necroptosis; in mice MLKL-dependent necroptosis also contributes to antiviral defense,
  including a nuclear form during influenza infection.
