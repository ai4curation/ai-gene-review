    label: plasma membrane
  supported_by:
  - reference_id: PMID:26853145
    supporting_text: PI(4,5)P2 is the preferred PIP-binding partner
- description: 'Activation: binding of highly phosphorylated soluble inositol phosphates (IP6 and related)
    to the N-terminal region of cytosolic MLKL is required, together with RIPK3 phosphorylation, for MLKL
    oligomerization and plasma membrane recruitment.'
  molecular_function:
    id: GO:0000822
