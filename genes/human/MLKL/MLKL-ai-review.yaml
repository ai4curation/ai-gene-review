core_functions:
- description: 'Executioner of necroptosis: after RIPK3 phosphorylation and inositol-phosphate-assisted
    release of its four-helix bundle domain, MLKL homo-oligomerizes, binds plasma membrane phosphatidylinositol
    phosphates through a basic patch on the 4HB domain, and directly disrupts plasma membrane integrity,
    causing ion influx and lytic necroptotic cell death.'
  molecular_function:
    id: GO:1901981
    label: phosphatidylinositol phosphate binding
  directly_involved_in:
  - id: GO:0097528
    label: execution phase of necroptosis
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - *id006
  - *id015
  - *id016
  - *id005
  - *id009
  - *id017
- description: 'Activation step: binding of highly phosphorylated soluble inositol phosphates (IP6 and
    related) to the N-terminal region of cytosolic MLKL destabilizes its auto-inhibitory region and is
    required, together with RIPK3 phosphorylation, for MLKL oligomerization and plasma membrane recruitment.'
  molecular_function:
    id: GO:0000822
    label: inositol hexakisphosphate binding
  directly_involved_in:
  - id: GO:0097528
    label: execution phase of necroptosis
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by: *id018
suggested_questions:
- question: Does MLKL form a bona fide proteinaceous pore, an ion channel, or disrupt membranes by a non-pore
    mechanism, and what is the functional oligomeric state (trimer, tetramer, higher-order assemblies)
    at the plasma membrane?
  experts:
  - necroptosis structural biologists
  - membrane biophysicists
- question: GO lacks a molecular function term for a protein that permeabilizes the membrane of its own
    cell (GO:0140911 pore-forming activity is restricted to the membrane of another cell). Should a term
    covering cell-autonomous membrane disruption by death effectors (MLKL, gasdermins acting on their
    own cell) be created or the existing definition broadened?
  experts:
  - GO editors
- question: How general is the nuclear (ZBP1-driven) necroptosis described in mouse influenza infection
    for human MLKL?
  experts:
  - virologists
  - innate immunity experts
suggested_experiments:
- description: Reconstitute purified phosphorylated human MLKL with IP6 into supported bilayers or giant
    unilamellar vesicles of defined phosphoinositide composition and use single-molecule imaging and electrophysiology
    to determine oligomer stoichiometry and whether discrete conductance (pore/channel) events occur.
  experiment_type: in vitro reconstitution / electrophysiology
