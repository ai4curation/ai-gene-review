core_functions:
- description: >-
    MLKL is the terminal effector of necroptosis. Once RIPK3 phosphorylates its pseudokinase
    domain, MLKL oligomerizes, and its N-terminal four-helix bundle engages plasma-membrane
    phosphatidylinositol phosphates, preferentially PI(4,5)P2, then permeabilizes the membrane.
    The pseudokinase domain binds ATP but has no catalytic activity; it acts as a
    phosphorylation-controlled switch.
  molecular_function:
    id: GO:0140912
    label: membrane destabilizing activity
  directly_involved_in:
  - id: GO:0097528
    label: execution phase of necroptosis
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:29930286
    supporting_text: Wild-type hMLKL assembled into tetramers in vitro, robustly permeabilized liposomes
  - reference_id: PMID:24316671
    supporting_text: the membrane localization of MLKL is essential for
      Ca(2+) influx
- description: >-
    The N-terminal four-helix bundle binds phosphatidylinositol phosphates, with PI(4,5)P2 the
    preferred partner, which targets activated MLKL to the plasma membrane.
  molecular_function:
    id: GO:0005546
    label: phosphatidylinositol-4,5-bisphosphate binding
  locations:
