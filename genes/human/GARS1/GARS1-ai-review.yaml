id: P41250
gene_symbol: GARS1
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: GARS1 encodes glycyl-tRNA synthetase, a homodimeric class II aminoacyl-tRNA synthetase that
  uses ATP to attach glycine to tRNA(Gly). Its activity supplies glycyl-tRNA for cytosolic and mitochondrial
  protein synthesis. Alternative translation initiation yields a 739-residue precursor and a 685-residue
  product lacking the N-terminal 54 residues; initiation and targeting mechanisms influence their compartmental
  distribution without establishing mutually exclusive pools. Human GlyRS also synthesizes diadenosine
  tetraphosphate from ATP in biochemical assays, although its contribution to physiological Ap4A homeostasis
  remains unresolved. Neuronal and axonal pools and extracellular release have been reported; dominant
  neuropathy-associated variants can gain abnormal interactions, whereas biallelic loss of charging capacity
  causes broader cellular dysfunction.
alternative_products:
- id: P41250-1
  name: '1'
  sequence_note: Displayed 739-residue product; alternative initiation, not alternative splicing. The
    1–36 transit-peptide feature is predicted; processing is distinct from initiation at residue 55.
  description: The longer precursor has an N-terminal mitochondrial targeting region. Official localization
    includes mitochondria and cytoplasm; transcript-leader experiments do not imply an exclusively mitochondrial
    protein pool.
- id: P41250-2
  name: '2'
  sequence_note: 'Described 685-residue product: exact canonical residues 55–739, deleting residues 1–54
    through alternative initiation (VSP_060970). Direct official FASTA equals the coordinate reconstruction.'
  description: The shorter product lacks the upstream targeting extension and is associated with cytoplasmic/axonal
    localization. Source labels mRNA1/mRNA2 are transcript leaders, not these protein isoform numbers.
    Engineered structural fragments are not automatically this natural product.
