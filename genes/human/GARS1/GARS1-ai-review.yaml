- id: file:human/GARS1/GARS1-bioinformatics/A61/RESULTS.md
  title: Historical A61 sequence versus current mouse Gars1
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Offline comparison of three unmodified official records, with scripts, pinned Biopython
      dependency, exact translations, all four optimal reverse-complement fits, independent literal-block
      checks and self-comparison control. This is a reproducible nucleotide/translation analysis, not
      identification of the purified historical protein, a genome-wide uniqueness search or an assertion
      of wrong gene, clone error or natural antisense transcription.
suggested_questions:
- question: Does purified human GARS1 catalyze Ap4A hydrolysis independently of its ATP-condensation reaction,
    and under which substrate and cofactor conditions?
- question: What fraction of cellular Ap4A synthesis is attributable to GARS1 when physiological tRNA
    concentrations compete with the ATP-condensation reaction?
- question: Can sequence-resolved proteomics establish the identity of the historical 23-kDa A61-reactive
    secretory-granule protein and its relationship, if any, to current mouse Gars1 products?
suggested_experiments:
- hypothesis: Ap4A synthesis and any hydrolysis can be distinguished from separate phosphatase reagents
    and tRNA competition.
  description: Assay sequence-verified human GARS1 with separately supplied ATP or purified Ap4A, matched
    enzyme-free and reagent controls, and quantitative product identification across a tRNA titration.
- hypothesis: The historical granule-protein identity can be resolved at the peptide rather than database-alias
    level.
  description: Recover the A61-reactive granule fraction and identify multiple unique peptides against
    both current mouse Gars1 products and the original submitted A61 translation, retaining stimulation
    and fraction-purity controls.
status: DRAFT
knowledge_gaps:
- gap_statement: Whether human GARS1 itself catalyzes asymmetric Ap4A hydrolysis under defined conditions
    is not established by the synthesis assays inspected here.
  boundary: ATP-dependent Ap4A synthesis is directly demonstrated; a separately added inorganic pyrophosphatase
    and a bacterial hydrolase discussion do not establish human GARS1 hydrolysis.
  gap_kind:
  - BIOLOGY
  resolution: Separate ATP-fed synthesis from purified-Ap4A hydrolysis assays with matched enzyme-free
    and phosphatase controls and quantitative product identification.
  provenance:
  - reference_id: PMID:19710017
- gap_statement: The molecular identity of the A61-reactive 23-kDa mouse granule protein, and its relationship
    to current Gars1 products, remains unresolved.
  boundary: Original fractionation, stimulated release and peptide observations are positive. The historical
    nucleotide fragment corresponds in reverse-complement orientation to current Gars1 CDS, but its declared
    plus-strand translation is not a contiguous current Gars1 peptide.
  gap_kind:
  - BIOLOGY
  - CURATION
  resolution: Identify multiple unique peptides from the A61-reactive granule material against both the
    historical submitted translation and current Gars1 products.
  provenance:
  - reference_id: PMID:8939962
  - reference_id: file:human/GARS1/GARS1-bioinformatics/A61/RESULTS.md
