    sha256: 4fcda9186b9c022e67a4a6a452b5d76dad8cc836cdc382181a4729ba0ebf34f8
    header: &id042
      stable_id: R-HSA-379716
      display_name: Cytosolic tRNA aminoacylation
      species: Homo sapiens
      summary: Cytosolic tRNA synthetases catalyze the reactions of tRNAs encoded in the nuclear genome,
        their cognate amino acids, and ATP to form aminoacyl-tRNAs, AMP, and pyrophosphate. Eight of the
        tRNA synthetases, those specific for arginine, aspartate, glutamate and proline, glutamine, isoleucine,
        leucine, lysine, and methionine, associate to form a complex with three accessory proteins. Each
        of the component synthetases is active in vitro as a purified protein; complex formation is thought
        to channel aminoacylated tRNAs more efficiently to the site of protein synthesis in mRNA:ribosome
        complexes (Quevillon et al. 1999; Wolfe et al. 2003, 2005).
