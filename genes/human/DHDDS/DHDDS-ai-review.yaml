      native topology and physiological role remain unresolved.
- id: PMID:25066056
  title: Mutation of Nogo-B receptor, a subunit of cis-prenyltransferase, causes a congenital disorder
    of glycosylation.
  findings:
  - statement: Paired human DHDDS and NgBR support long-chain cis-prenyltransferase activity; co-translation
      and the subunit interface influence formation of an active complex.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Selected original main Methods/Results were read in the genuine full cache: human-pair
      triple-knockout yeast complementation, co-translation assays, and NgBR/DHDDS mutant tests. The extended
      supplementary protocol was not independently inspected.'
- id: PMID:28842490
  title: A conserved C-terminal RXG motif in the NgBR subunit of cis-prenyltransferase is critical for
    prenyltransferase activity.
  findings:
  - statement: DHDDS and the NUS1 C-terminal RXG motif cooperate in substrate binding and catalysis of
      the human cis-prenyltransferase reaction.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: An independent core consultation read the genuine original Methods/Results separately
