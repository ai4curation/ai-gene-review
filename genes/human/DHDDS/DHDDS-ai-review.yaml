      is claimed.
- id: PMID:32817466
  title: Structural elucidation of the cis-prenyltransferase NgBR/DHDDS complex reveals insights in regulation
    of protein glycosylation.
  findings:
  - statement: The DHDDS–NUS1 interface forms a functional cis-prenyltransferase unit. Product-chain distribution
      and phospholipid stimulation depend on the tested conditions.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: An independent core consultation read the genuine original Methods/Results and captions;
      the normal cache remains abstract-only. Human DHDDS 1–333 and NgBR 79–293 form the crystallized
      heterodimer. IPP occupies both crystal sites; FPP was an assay substrate, not the bound crystal
      ligand.
- id: PMID:33077723
  title: Structural basis of heterotetrameric assembly and disease mutations in the human cis-prenyltransferase
    complex.
  findings:
  - statement: A dimer of DHDDS–NUS1 heterodimers supports catalysis; the NUS1 tail completes the DHDDS
      active site and substantially enhances physiological-complex activity.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The independent core consultation read complete selected original structural/biochemical
      Methods and Results. Human DHDDS 1–333 and engineered soluble NgBR constructs were used. Native
      MS, SEC-MALS and crosslinking support 2:2 assembly; the crystal shows FPP/Mg and phosphate at the
      other site, not bound IPP there.
