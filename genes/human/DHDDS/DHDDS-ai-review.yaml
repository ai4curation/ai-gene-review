id: Q86SQ9
gene_symbol: DHDDS
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: DHDDS is the catalytic subunit of the human cis-prenyltransferase complex at the endoplasmic reticulum
    membrane. Together with NUS1 (NgBR), it extends farnesyl diphosphate by successive Mg2+-dependent additions
    of isopentenyl diphosphate to form long-chain, unsaturated polyprenyl diphosphates. These products supply
    dolichol and dolichyl phosphate biosynthesis, providing lipid carriers for N-linked glycosylation, O-mannosylation
    and GPI-anchor biosynthesis in the ER. DHDDS contains the substrate-binding pocket, completed by the
    C-terminal tail of NUS1; the active assembly is a heterotetramer consisting of two DHDDS–NUS1 pairs.
    Human pathogenic variants can cause retinitis pigmentosa, developmental and epileptic encephalopathy,
    or severe glycosylation defects.
