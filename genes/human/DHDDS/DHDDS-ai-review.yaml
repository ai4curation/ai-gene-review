core_functions:
- description: Catalytic subunit of the ER-associated DHDDS–NUS1 cis-prenyltransferase complex. The substrate-binding
    active-site pocket lies in DHDDS, while the NUS1 C-terminal RxG motif contributes across the interface.
    This cooperative site catalyzes Mg2+-dependent extension of farnesyl diphosphate with isopentenyl diphosphate.
    The resulting unsaturated long-chain polyprenyl diphosphates provide precursors for dolichyl diphosphate
    and monophosphate biosynthesis; DHDDS does not perform the subsequent reduction or phosphorylation steps.
  molecular_function:
    id: GO:0045547
    label: ditrans,polycis-polyprenyl diphosphate synthase [(2E,6E)-farnesyl diphosphate specific] activity
  directly_involved_in:
