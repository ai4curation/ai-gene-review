id: O60663
gene_symbol: LMX1B
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  LMX1B is a nuclear LIM-homeodomain DNA-binding transcriptional activator that
  recognizes regulatory DNA and works with context-dependent transcriptional
  coregulators. It establishes and maintains tissue-selective gene-expression
  programs in podocytes, the dorsal limb, and neuronal lineages including
  midbrain dopaminergic and central serotonergic neurons. In human cells, LMX1B
  directly promotes macroautophagy-gene expression and autophagic flux and binds
  ATG8-family
  ubiquitin-like proteins; this nutrient- and compartment-sensitive interaction
  enhances its transcriptional output and cellular stress resilience. Pathogenic
  LMX1B variants cause nail-patella syndrome and kidney-limited glomerular disease.
