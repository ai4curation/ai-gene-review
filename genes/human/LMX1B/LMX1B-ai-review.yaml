- id: PMID:37014324
  title: ATG8-dependent LMX1B-autophagy crosstalk shapes human midbrain dopaminergic
    neuronal resilience.
  findings:
  - statement: Endogenous human LMX1B occupies regulatory regions of multiple core
      autophagy and selective-autophagy genes.
    supporting_text: >-
      Using an arbitrary twofold cut-off for targets of interest, promoter occupancy
      was confirmed for several core autophagy genes, including ULK1, ATG3, ATG16L1,
      UVRAG, as well as the autolysosomal transcription factor TFEB and the receptors
      and/or mitophagy genes, NDP52, OPTN, and PINK1 (Fig. 1 A).
    reference_section_type: RESULTS
  - statement: LMX1B promotes basal and nutrient-stress-induced autophagic flux in
      human cells.
    supporting_text: >-
      Together, these data demonstrate that LMX1B contributes to the control of
      autophagy gene expression in HEK293T cells, and that LMX1B depletion dampens
      basal/housekeeping and nutrient stress-induced autophagic flux responses.
    reference_section_type: RESULTS
  - statement: LMX1B controls an autophagy transcriptional program in human
      iPSC-derived midbrain dopaminergic neurons.
    supporting_text: >-
      Importantly, shRNA suppression of either LMX1A or LMX1B significantly reduced
      levels of ULK1, ATG2B, ATG7, ATG16L1, NDP52, OPTN, PINK1, and TFEB transcripts
      in mDANs, but ATG3 and p62 were not affected (Fig. 2 I).
    reference_section_type: RESULTS
  - statement: A region spanning LMX1B residues 308-317 is required for robust ATG8
      binding, target-gene transcription, and rotenone-stress protection.
    supporting_text: >-
      Δ308-317 LMX1B bound poorly to all ATG8s, failed to rescue autophagy gene
      expression, was unable to stimulate FLAT-promoter luciferase reporter
      expression, and crucially, failed to protect against rotenone in HEK293T
      cells and iPSC-derived human mDANs.
    reference_section_type: DISCUSSION
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Cached PubMed/PMC record identity and local full text verified. Strongest direct human functional
      study: combines endogenous ChIP, perturbation/rescue, autophagic-flux assays,
      human iPSC-derived mDAN phenotypes, and mechanistic ATG8-binding mutants.
