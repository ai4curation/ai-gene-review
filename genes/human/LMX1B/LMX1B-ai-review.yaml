suggested_experiments:
- hypothesis: >-
    Acute loss of LMX1B in human podocytes directly alters an actin-regulatory
    transcriptional program before secondary loss of differentiation markers.
  description: >-
    Engineer an endogenous degron in human iPSC-derived podocytes and perform a
    short time course of LMX1B CUT&RUN, PRO-seq, single-cell RNA-seq, quantitative
    cytoskeletal imaging, and filtration-barrier assays. Rescue with wild-type LMX1B
    and edit candidate ABRA/ARL4C enhancers to distinguish direct effectors from
    secondary target changes.
  experiment_type: acute perturbation, chromatin occupancy, and podocyte functional rescue
- hypothesis: >-
    A defined endogenous ATG8 paralog and compartment-specific interaction with
    LMX1B are required to couple transcriptional activation to autophagic flux and
    stress resilience in human midbrain dopaminergic neurons.
  description: >-
    Introduce endogenous LMX1B interaction-interface mutations and paralog-selective
    ATG8 knockouts in isogenic human iPSC-derived midbrain dopaminergic neurons;
    quantify compartment-resolved binding, LMX1B chromatin occupancy, nascent target-gene
