      and is inappropriate for this gene-product annotation.
    proposed_replacement_terms:
    - id: GO:0001221
      label: transcription coregulator binding
    supported_by:
    - reference_id: PMID:12792813
      supporting_text: By the yeast two-hybrid screening we detected the CLIM2
        gene as a LMX1B interactor, confirming previous reports which described
        the same interaction by biochemical methods.
