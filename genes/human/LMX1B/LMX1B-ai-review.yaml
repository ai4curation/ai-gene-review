  review:
    summary: The LMX1B-LDB1 interaction is supported, but bare protein binding is
      uninformative; from LMX1B's perspective this is binding to a transcriptional
      coregulator.
    action: MODIFY
    reason: LDB1/CLIM2 is a LIM-homeodomain transcriptional coregulator. GO:0001221
