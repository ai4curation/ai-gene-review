core_functions:
- description: >-
    LMX1B binds sequence-specific regulatory DNA through its homeodomain and acts
    as an RNA polymerase II transcriptional activator. In human cells this activity
    directly drives an autophagy-gene program and promotes macroautophagic flux.
    ATG8-family binding is a context-dependent regulatory input that enhances this
    transcriptional output, rather than a separate conserved core function. LMX1B's
    podocyte, dorsal-limb, and neuronal developmental programs are supported principally
    by mouse loss-of-function and orthology evidence and are not treated as universal
    direct human target-gene relationships.
  molecular_function:
    id: GO:0001228
    label: DNA-binding transcription activator activity, RNA polymerase II-specific
  directly_involved_in:
  - id: GO:0045944
    label: positive regulation of transcription by RNA polymerase II
  - id: GO:0016239
    label: positive regulation of macroautophagy
  locations:
  - id: GO:0005634
    label: nucleus
  - id: GO:0000785
    label: chromatin
  supported_by:
  - reference_id: PMID:10767331
    supporting_text: >-
      Mutant LMX1B proteins containing human mutations affecting each of the helices
      or the N-terminal arm of the homeodomain abolished transactivation, while LIM
      B and truncation mutations retained residual activity.
  - reference_id: PMID:37014324
    supporting_text: >-
      Using an arbitrary twofold cut-off for targets of interest, promoter occupancy
      was confirmed for several core autophagy genes, including ULK1, ATG3, ATG16L1,
      UVRAG, as well as the autolysosomal transcription factor TFEB and the receptors
      and/or mitophagy genes, NDP52, OPTN, and PINK1 (Fig. 1 A).
  - reference_id: PMID:37014324
    supporting_text: >-
      Together, these data demonstrate that LMX1B contributes to the control of
      autophagy gene expression in HEK293T cells, and that LMX1B depletion dampens
      basal/housekeeping and nutrient stress-induced autophagic flux responses.
  - reference_id: PMID:37014324
    supporting_text: >-
      Δ308-317 LMX1B bound poorly to all ATG8s, failed to rescue autophagy gene
      expression, was unable to stimulate FLAT-promoter luciferase reporter expression,
      and crucially, failed to protect against rotenone in HEK293T cells and
      iPSC-derived human mDANs.
knowledge_gaps:
- gap_statement: >-
    The endogenous LMX1B target genes that are necessary and sufficient for human
    podocyte differentiation and adult maintenance remain unresolved; in particular,
    COL4A3, COL4A4, NPHS2, and CD2AP should not be treated as a universal direct
    LMX1B target set.
  boundary: >-
    Mouse null and conditional-knockout studies establish Lmx1b-dependent podocyte
    differentiation, adult maintenance, and actin-cytoskeleton organization, and
    human-podocyte assays show LMX1B occupancy at ABRA and ARL4C regulatory regions.
    However, severely affected human nail-patella syndrome kidneys retained the
    classic collagen and slit-diaphragm proteins, and adult conditional-knockout
    work supports an alternative actin-centered mechanism.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    Resolving this target network is necessary to connect LMX1B's established
    transcription-factor activity to human glomerular disease without overgeneralizing
    reporter assays or mouse developmental phenotypes.
  resolution: >-
    Combine acute endogenous LMX1B degradation with CUT&RUN, nascent-transcription
    profiling, and morphology/filtration-barrier phenotyping in human iPSC-derived
    podocytes, followed by target-specific rescue and enhancer editing.
  provenance:
  - reference_id: PMID:12819019
    supporting_text: >-
      The expression of the alpha3 and alpha4 chains of type IV collagen, and of
      podocin and CD2AP, was found to be normal in the seven patients.
    reference_section_type: ABSTRACT
  - reference_id: PMID:23990680
    supporting_text: >-
      Together with the facts that LMX1B failed to activate an NPHS2 promoter fragment
      in reporter assays and that the endogenous NPHS2 gene was not upregulated in
      stably transfected HeLa cells inducibly producing LMX1B, 13 this finding at
      least casts doubt on the hypothesis that NPHS2 is a target gene of LMX1B.
    reference_section_type: DISCUSSION
- gap_statement: >-
    It is not known which ATG8-family paralogs are endogenous LMX1B cofactors in
    human midbrain dopaminergic neurons, how their contributions differ between
    basal nuclear and starvation-induced cytosolic binding, or what interaction
    stoichiometry produces the transcriptional effect.
  boundary: >-
    Human HEK293T experiments demonstrate endogenous LMX1B-LC3B co-immunoprecipitation,
    tagged interaction with all six human ATG8-family proteins, compartment- and
    nutrient-dependent LC3B binding, and loss of transcriptional and stress-protective
    output from an LMX1B 308-317 deletion mutant.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    Defining the endogenous cofactor species and compartmental mechanism would
    explain how ubiquitin-like protein binding modulates LMX1B's core transcriptional
    activity in the neuronal context most relevant to stress resilience.
  resolution: >-
    Endogenously tag LMX1B and individual ATG8 paralogs in human iPSC-derived
    midbrain dopaminergic neurons, then combine paralog-selective perturbation,
    compartment-resolved interaction assays, LMX1B chromatin occupancy, nascent RNA,
    autophagic-flux measurements, and rotenone-stress rescue.
  provenance:
  - reference_id: PMID:37014324
    supporting_text: >-
      GFP-TRAP immunoprecipitation (IP) of lysates of HEK293T cells co-transfected
      with human GFP-ATG8 and LMX1B-FLAG revealed that LMX1B-FLAG was enriched in
      all GFP-ATG8 fractions (Fig. 5 C).
    reference_section_type: RESULTS
  - reference_id: PMID:37014324
    supporting_text: >-
      Importantly, we observed coIP of endogenous LC3B using antibodies against
      native LMX1B in HEK293T cells (Fig. 5 E).
    reference_section_type: RESULTS
- gap_statement: >-
    Whether the three annotated human LMX1B splice isoforms differ in regulatory-DNA
    selection, coregulator binding, ATG8 binding, localization, or tissue-specific
    biological output has not been established.
  boundary: >-
    UniProtKB records three human isoforms, but the current GOA source annotations
    are not isoform-specific and the direct human autophagy study does not establish
    an isoform-exclusive function.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    Functional isoform resolution could reveal tissue-selective mechanisms while
    preventing experimentally tested constructs from being interpreted as proof
    that a function is unique to one isoform.
  resolution: >-
    Use isoform-selective splice editing and endogenous tagging in human podocytes
    and iPSC-derived midbrain dopaminergic neurons, with matched DNA-occupancy,
    interactome, transcriptome, localization, autophagic-flux, and rescue assays.
  provenance:
  - reference_id: file:human/LMX1B/LMX1B-uniprot.txt
    supporting_text: Event=Alternative splicing; Named isoforms=3;
    reference_section_type: OTHER
