  findings:
  - statement: >-
      SLC7A4 is a plasma-membrane L-leucine transporter whose activity is
      activated by acidic extracellular pH; it does not transport cationic
      amino acids.
    reference_section_type: RESULTS
    supporting_text: Human SLC7A4 is a pH-regulated leucine transporter
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Definitive functional and structural characterization (cryo-EM of plant
      homologue CAT4, transport assays, MD). Establishes SLC7A4 as a pH-gated
      L-leucine transporter and rules out cationic amino acid transport.
      PubMed/PMC verified.
- id: PMID:9598310
  title: The gene encoding a cationic amino acid transporter (SLC7A4) maps to the
    region deleted in the velocardiofacial syndrome.
  findings:
  - statement: >-
      Oocyte microinjection of SLC7A4 mRNA was reported to stimulate cationic
      amino acid transport; SLC7A4 was named a CAA transporter by homology to
      SLC7A1/SLC7A2.
    reference_section_type: ABSTRACT
    supporting_text: >-
      Microinjection of SLC7A4 mRNA into Xenopus laevis oocytes demonstrates a
      significant stimulation of CAA transport.
    finding_review:
      finding_status: OVERTURNED
      superseded_by:
      - PMID:41904136
      review_notes: >-
        This early oocyte CAA-transport claim was not reproduced. Direct assays
        show SLC7A4 does not transport arginine or lysine; it is an L-leucine
        transporter. The "cationic amino acid transporter" name is homology-based.
      supported_by:
      - reference_id: PMID:41904136
        reference_section_type: INTRODUCTION
        supporting_text: >-
          human SLC7A4 does not transport the cationic amino acids arginine or
          lysine
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Correctly cited 1998 cloning and mapping paper; source of the TAS basic
      amino acid transporter annotation and of the CAT-4 name. Its oocyte
      CAA-transport result is superseded (see finding_review). Abstract-only in
      cache.
