core_functions:
- description: >-
    pH-regulated L-leucine transporter of the plasma membrane. SLC7A4 mediates
    import of L-leucine across the plasma membrane, with transport activity
    strongly potentiated by acidic extracellular pH (optimum around pH 5.5 to
    6.5) via a TM3 glutamate (Glu125) pH sensor. Unlike its CAT paralogs it does
    not transport cationic amino acids.
