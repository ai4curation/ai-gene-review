gene_symbol: SLC7A4
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  SLC7A4 (CAT-4) is a multi-pass plasma-membrane protein of the SLC7 family,
  within the amino acid-polyamine-organocation (APC) superfamily (LeuT fold).
  By sequence it groups with the cationic amino acid transporters SLC7A1-A3
  and was long named "cationic amino acid transporter 4", but unlike its
  paralogs it does not transport arginine or lysine. It is a single-chain
  transporter (not a heteromeric SLC3-associated light chain). Functionally it
  acts as a pH-regulated L-leucine transporter: it mediates L-leucine uptake
  across the plasma membrane with activity strongly enhanced at acidic
  extracellular pH (optimum around pH 5.5 to 6.5), with a conserved TM3
  glutamate (Glu125) acting as the pH sensor. The gene lies in the 22q11.2
  region deleted in velocardiofacial syndrome, and the transporter is enriched
  in choroid plexus and testis, tissues where local acid-base handling could
  gate its leucine-transport activity.
