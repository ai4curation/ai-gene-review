    supporting_text: Human SLC7A4 is a pH-regulated leucine transporter
  - reference_id: PMID:41904136
    reference_section_type: RESULTS
    supporting_text: >-
      we observed a substantial increase in L-Leu uptake at pH 6.5 and 5.5
      compared to pH 7.5 in HCT-116 cells, indicating that SLC7A4 is activated
      at acidic pH
proposed_new_terms:
- proposed_name: pH-gated L-leucine transmembrane transport
  proposed_definition: >-
    The directed movement of L-leucine across a membrane via a transporter whose
    activity is gated by (strongly potentiated at) low extracellular or
    periplasmic pH, such that proton concentration acts as an allosteric
    activating signal for leucine translocation.
  justification: >-
    GO has GO:1903801 (L-leucine import across plasma membrane) and GO:0015190
    (L-leucine transmembrane transporter activity), but no term captures the
    acid-activated, pH-gated regulation of leucine transport that is the
    defining feature of SLC7A4. A term (or a regulation-of term) for
    acidic-pH-activated amino acid transport would let this mechanism be
    annotated explicitly. Lower priority: the existing leucine-transport terms
    already cover the substrate and direction.
  supported_by:
  - reference_id: PMID:41904136
    reference_section_type: RESULTS
    supporting_text: >-
      we observed a substantial increase in L-Leu uptake at pH 6.5 and 5.5
      compared to pH 7.5 in HCT-116 cells, indicating that SLC7A4 is activated
      at acidic pH
suggested_questions:
- question: >-
    What is the physiological role of pH-gated L-leucine import by SLC7A4 in
    the choroid plexus and testis, tissues with distinctive acid-base handling?
- question: >-
    Does acidic-pH-activated leucine uptake by SLC7A4 feed amino-acid-sensing
    pathways (e.g. mTORC1) in its expressing tissues?
suggested_experiments:
- description: >-
    Generate SLC7A4 knockout in a choroid plexus or testis-derived model and
    measure pH-dependent L-leucine uptake and downstream amino-acid signalling
    to establish the endogenous physiological role.
- description: >-
    Determine whether SLC7A4-mediated leucine transport is electrogenic,
    proton-coupled, or exchange-based, and quantify kinetics across the pH
    range, to define the transport mechanism beyond the current facilitative
    model.
