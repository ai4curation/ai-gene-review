- term:
    id: GO:0015174
    label: basic amino acid transmembrane transporter activity
  evidence_type: TAS
  original_reference_id: PMID:9598310
  qualifier: enables
  review:
    summary: >-
      This activity rests on the 1998 cloning paper, which named SLC7A4 a
      cationic amino acid transporter by homology and reported preliminary
      oocyte stimulation of CAA transport. That claim was not reproduced:
      direct assays show SLC7A4 does not transport arginine or lysine.
    action: REMOVE
    reason: >-
      Genuinely contradicted function. Subsequent transport assays (Wolf 2002;
      Kolokouris 2026) demonstrate that human SLC7A4 does not transport the
      cationic amino acids arginine or lysine; its physiological substrate is
      L-leucine. The basic-amino-acid activity is a superseded, family-name-based
      inference, not a measured SLC7A4 activity. (A V332S/L336S/L394M triple
      mutant gains L-Arg affinity, confirming the wild-type pocket is
      leucine-selective.)
    supported_by:
    - reference_id: PMID:41904136
      reference_section_type: INTRODUCTION
      supporting_text: >-
        human SLC7A4 does not transport the cationic amino acids arginine or
        lysine
