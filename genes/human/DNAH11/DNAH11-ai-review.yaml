id: Q96DT5
gene_symbol: DNAH11
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  DNAH11 (dynein axonemal heavy chain 11) is a beta-type heavy chain of the outer dynein arm
  (ODA), the ATPase motor that powers ciliary beating by sliding outer doublet microtubules
  towards their minus ends. In human respiratory cilia DNAH11 is found only in the proximal
  part of the axoneme, where it forms proximal (type 1) ODAs with the gamma chain DNAH5; its
  paralog DNAH9 takes this place in distal ODAs. Its mouse orthologue, left-right dynein (lrd,
  Dnah11), is present in the motile monocilia of the embryonic node and is needed for the
  leftward nodal flow that breaks left-right symmetry; iv/iv mice carrying lrd mutations show
  randomized situs. DNAH11 interacts with CFAP45, which joins a proximal axonemal module with
  CFAP52 and adenylate kinase AK8 that is thought to regulate local adenine nucleotide levels.
  Biallelic loss-of-function variants cause primary ciliary dyskinesia 7 (CILD7). This is
  one of the commonest forms of PCD with normal ciliary ultrastructure on standard electron
  microscopy: tomography reveals only a partial proximal ODA loss, and cilia beat in a stiff,
  hyperkinetic pattern with reduced amplitude. Situs abnormalities are frequent. DNAH11 is
  not detected in the human sperm axoneme, and male fertility can be preserved.
