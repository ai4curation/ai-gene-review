    label: regulation of cilium beat frequency
  evidence_type: IMP
  original_reference_id: PMID:18022865
  qualifier: acts_upstream_of_or_within
  review:
    summary: >-
      DNAH11-mutant respiratory cilia have normal ultrastructure but a stiff, hyperkinetic
      beat with reduced bending.
    action: MODIFY
    reason: >-
      The phenotype is real and distinctive, but it reflects loss of the proximal ODA motor
      rather than a regulatory activity of DNAH11: DNAH11 is a force-generating motor subunit,
      not a regulator of beat frequency. The process these IMP data actually support is the
      motility itself, so the term is replaced with epithelial cilium movement involved in
      extracellular fluid movement, the same replacement used for the GO:0060294 row and the
      process in core_functions. DNAH11 has no cilium movement row in GOA, so this replacement
      carries the real process onto the gene.
    proposed_replacement_terms:
    - id: GO:0003351
      label: epithelial cilium movement involved in extracellular fluid movement
    supported_by:
    - reference_id: PMID:18022865
      supporting_text: >-
        Respiratory ciliated cells from the affected individuals showed an abnormal nonflexible
        beating pattern with a reduced cilium bending capacity and a hyperkinetic beat.
