- term:
    id: GO:0120229
    label: protein localization to motile cilium
  evidence_type: IMP
  original_reference_id: PMID:33139725
  qualifier: involved_in
  review:
    summary: >-
      In the CFAP45 study, CFAP45 (and CFAP52) localization in respiratory cilia was abnormal
      or undetectable in several DNAH11-mutant subtypes; CFAP45 co-immunoprecipitates DNAH11.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The cached record of PMID:33139725 is abstract-only and does not mention DNAH11, so no
      cached quote supports this annotation. The full text (Europe PMC, PMC7606486) reports
      that CFAP45 ciliary localization is abnormal or undetectable in DNAH11-mutant
      respiratory cilia, and that CFAP45 co-immunoprecipitates DNAH11; that sentence is
      recorded below as full-text support. The observation shows that a binding partner of the
      proximal ODA depends on DNAH11 for its axonemal position, which fits DNAH11 acting as a
      structural anchor within the ODA. It does not show that DNAH11 takes part in a protein
      localization process (targeting or transport to the cilium); DNAH11 itself is a motor
      subunit. The term therefore goes beyond what the evidence supports for this gene.
    supported_by:
    - reference_id: PMID:33139725
      full_text_unavailable: true
      supporting_text_fulltext: >-
        In contrast, CFAP45 ciliary localization was abnormal or undetectable in respiratory
        cilia from several genetically distinct DNAH11-mutant subtypes
- term:
    id: GO:0036157
    label: outer dynein arm
  evidence_type: IDA
  original_reference_id: PMID:26909801
  qualifier: part_of
  review:
    summary: >-
      DNAH11 is a beta-type heavy chain of the proximal outer dynein arm in respiratory cilia,
      but it carries no outer dynein arm annotation, only the generic dynein complex.
    action: NEW
    reason: >-
      Proximal ODAs are partially lost in DNAH11-deficient cilia, DNAH11 co-fractionates with
      ODA components, and it is the beta heavy chain paralog of DNAH9 (distal ODA) and DNAH17
      (sperm ODA). Its paralogs DNAH9 and DNAH17 and the gamma chain DNAH5 all carry this
      term, and the comparator check fits: DNAH11 stands in the same structural role. PAINT
      gives the beta heavy chains only the generic dynein complex term, which explains the
      gap.
    supported_by:
    - reference_id: PMID:26909801
      supporting_text: >-
        TEM tomography detected a partial reduction of ODAs in DNAH11-deficient cilia.
    - reference_id: PMID:26909801
      supporting_text: >-
        DNAH11 mutations result in a subtle ODA defect in only the proximal region of respiratory
        cilia, which is detectable by IFM and TEM tomography.
    - reference_id: PMID:31178125
      supporting_text: >-
        However, the contribution of the different HCs (γ-type: DNAH5 and DNAH8 and β-type:
        DNAH9, DNAH11, and DNAH17) in ODAs from both organelles is unknown.
core_functions:
- description: >-
    Beta heavy chain and motor of the proximal (type 1) outer dynein arms of respiratory cilia
    and of the outer arms of motile embryonic node cilia (as mouse lrd); minus-end-directed
    microtubule motor whose loss gives a stiff hyperkinetic beat and randomized left-right
    asymmetry because nodal flow fails.
  molecular_function:
    id: GO:0008569
    label: minus-end-directed microtubule motor activity
  directly_involved_in:
  - id: GO:0003351
    label: epithelial cilium movement involved in extracellular fluid movement
  locations:
  - id: GO:0120134
    label: proximal portion of axoneme
  in_complex:
    id: GO:0036157
    label: outer dynein arm
  supported_by:
  - reference_id: PMID:26909801
    supporting_text: >-
      IFM analysis demonstrated native DNAH11 localization in only the proximal region of
      wild-type human respiratory cilia
  - reference_id: PMID:26909801
    supporting_text: >-
      DNAH11 mutations result in a subtle ODA defect in only the proximal region of respiratory
      cilia, which is detectable by IFM and TEM tomography.
  - reference_id: PMID:18022865
    supporting_text: >-
      Respiratory ciliated cells from the affected individuals showed an abnormal nonflexible
      beating pattern with a reduced cilium bending capacity and a hyperkinetic beat.
  - reference_id: PMID:12859898
    supporting_text: >-
      Nodal flow is generated by motile node cell monocilia and requires the axonemal dynein,
      left-right dynein (lrd).
  - reference_id: PMID:9353118
    supporting_text: >-
      Here we report the positional cloning of an axonemal dynein heavy-chain gene, left/right-dynein
      (lrd), that is mutated in both lgl and iv.
  - reference_id: PMID:31178125
    supporting_text: >-
      However, the contribution of the different HCs (γ-type: DNAH5 and DNAH8 and β-type:
      DNAH9, DNAH11, and DNAH17) in ODAs from both organelles is unknown.
suggested_questions:
- question: >-
    How does loss of a proximal ODA beta heavy chain produce a faster (hyperkinetic) rather
    than slower beat? Does DNAH11 normally impose a load or regulatory brake on proximal bending?
- question: >-
    DNAH11 lacks an outer dynein arm annotation in GOA; should PAINT propagate outer dynein
    arm membership to the beta heavy chain clade (DNAH9/DNAH11/DNAH17)?
- question: >-
    Is the CFAP45-CFAP52-AK8 nucleotide homeostasis module specifically anchored through DNAH11-containing
    proximal ODAs, and does DNAH11 itself bind CFAP45 directly?
suggested_experiments:
- description: >-
    Measure single-cilium waveform and beat frequency in DNAH11-null airway cells with optical
    tweezers or high-speed imaging under varying viscosity to explain the hyperkinetic phenotype
    mechanistically.
  experiment_type: biophysical ciliary beat analysis
- description: >-
    Cryo-ET of proximal versus distal segments of DNAH11-deficient airway cilia to determine
    which ODA heavy chains and associated proteins (CFAP45, CFAP52, AK8) are lost proximally.
  experiment_type: cryo-electron tomography
