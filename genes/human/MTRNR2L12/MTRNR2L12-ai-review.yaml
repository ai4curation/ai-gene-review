      source_entities:
      - source_id: UniProtKB:Q8IVG9
        source_label: MT-RNR2
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: 'Humanin, the mitochondrially encoded peptide. Its secreted location is directly observed
          and the source annotation is sound. What does not transfer is the premise: this nuclear MT-RNR2-like
          sequence is a paralogous genomic copy rather than an ortholog of a protein-coding gene, and
          no peptide product of it has been observed, let alone observed outside the cell. The residues
          required for secretion are, unusually for this family, all present.'
