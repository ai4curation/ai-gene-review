id: P0DMP1
gene_symbol: MTRNR2L12
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'MTRNR2L12 is a nuclear human locus on chromosome 3 (3q11.2) that resembles the humanin
  small open reading frame of the mitochondrial large-subunit rRNA gene MT-RNR2, one of thirteen such
  MT-RNR2-like sequences in the human genome that are generally interpreted as nuclear insertions of
  mitochondrial DNA and are classed by HGNC as pseudogenes. Its predicted product, humanin-like 12 (HN12),
  is a 24-residue peptide (MAPRGFSCLLLSTSEIDLPVKRRA) that matches humanin at 23 of 24 aligned positions,
  differing only by Leu12->Ser, and is identical in sequence to the predicted product of MTRNR2L8; a
  coding polymorphism at this position would make it identical to humanin itself. Every residue humanin
  is known to require for activity or secretion is retained. The locus is the most frequently named of
  the thirteen in transcriptomic studies, appearing as a differentially expressed transcript or co-expression
  hub in blood mononuclear cells of adults with Down syndrome and in platelets during COVID-19, where
  it groups with the mitochondrially encoded transcripts MT-ND1 and MT-ND5. UniProt lists it at protein
  existence level 3 (inferred from homology), and whether a peptide is made from it, and what it would
  do, is unestablished: no HN12 peptide has been detected in human tissue or fluid, no molecular activity
  has been measured for it, and no binding partner or receptor interaction has been reported. The humanin
  peptide from which it is named is cytoprotective and antiapoptotic, binds BAX, BID, BIM and IGFBP3
  intracellularly and signals through FPRL1/FPR2 and a CNTFR-alpha/WSX-1/gp130 complex when secreted,
  but those properties were measured on the mitochondrially encoded peptide and on synthetic analogues
  of it, not on this gene product.'
existing_annotations:
- term:
    id: GO:0005576
    label: extracellular region
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0243
  review:
    summary: Electronic mapping of UniProt's Secreted subcellular-location line for P0DMP1. That line
      is itself annotated ECO:0000250 by similarity to humanin (UniProtKB:Q8IVG9), so the row carries
      no observation made on MTRNR2L12.
    action: MARK_AS_OVER_ANNOTATED
    reason: "MTRNR2L12 is known only by homology (UniProt protein existence level 3); no peptide from
      this locus has been detected in any compartment, by mass spectrometry or otherwise. UniProt's Secreted
      and Cytoplasm lines for P0DMP1 are themselves ECO:0000250 by-similarity statements transferred
      from humanin (file:human/MTRNR2L12/MTRNR2L12-uniprot.txt), so both the ISS row (donor UniProtKB:Q8IVG9)
      and the subcellular-location IEA row state the same humanin claim, once directly and once via the
      controlled-vocabulary mapping. Secretion of humanin is not a generic property of the sequence:
      it depends on Leu9-Leu11 and on Pro19-Val20 [PMID:35372353], and Bodzioch et al. proposed on the
      alignment that position 19 is what decides whether a nuclear isoform is secreted at all [PMID:19477263].
      In MTRNR2L12 both of those segments are intact - this is the closest of the thirteen copies to
      humanin, differing at Leu12 only - so unlike the diverged loci there is no residue-level argument
      against secretion, and I do not remove the row. What is wrong with it is that it is asserted of
      this locus on the strength of humanin alone, for a gene product that has never been shown to exist.
      The transcriptomic literature naming this locus measures RNA, not peptide, and does not demonstrate
      locus specificity against the near-identical copies or the mitochondrial rRNA."
    supported_by:
    - reference_id: PMID:35372353
      supporting_text: HN was found to be an extracellularly secreted factor whereby two amino acid
        structures, Leu9-Leu11, and Pro19-Va120, appear to be essential for the secretion of HN
        peptide
    - reference_id: PMID:19477263
      supporting_text: Proline vs serine in position 19 may determine whether the peptide is
        secreted or not, while threonine in position 13 may be important for cell surface receptor
        binding.
    - reference_id: file:human/MTRNR2L12/MTRNR2L12-uniprot.txt
      supporting_text: 'SUBCELLULAR LOCATION: Secreted'
- term:
    id: GO:0005576
    label: extracellular region
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: located_in
  supporting_entities:
  - UniProtKB:Q8IVG9
  review:
    summary: Curator transfer of humanin's secreted location to MTRNR2L12 on sequence similarity.
      Humanin's own extracellular annotations are IDA/EXP from several studies, so the donor side is
      sound; the question is only whether the transfer is safe.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'MTRNR2L12 is known only by homology (UniProt protein existence level 3); no peptide from
      this locus has been detected in any compartment. The sequence argument that defeats this transfer
      in several sibling loci does not apply here: HN12 retains Leu9-Leu11 and Pro19-Val20, the two segments
      humanin needs for secretion [PMID:35372353], and differs from humanin at Leu12 only. So the claim
      may well be right if the peptide exists. But an ISS asserts that a donor observation holds for
      the target, and here the premise that there is a target gene product at all is untested, which
      makes the row an over-reach rather than an error. Note also that the two most-cited studies naming
      this locus report transcript abundance in blood mononuclear cells [PMID:25720405] and in platelets
      [PMID:35421970]; neither localises a peptide, and the second finds the transcript clustering with
      the mitochondrially encoded MT-ND1 and MT-ND5, which is what read mis-assignment from the parent
      mitochondrial locus would look like.'
    supported_by:
    - reference_id: PMID:35372353
      supporting_text: HN was found to be an extracellularly secreted factor whereby two amino acid
        structures, Leu9-Leu11, and Pro19-Va120, appear to be essential for the secretion of HN
        peptide
    - reference_id: PMID:35372353
      supporting_text: It is predicted that these various isoforms might contribute to differential
        neuroprotective effects and receptor binding, but their individual roles remain to be
        investigated.
    - reference_id: PMID:35421970
      supporting_text: Regarding the magenta module, MT-ND1, MT-ND5, and MTRNR2L12 were selected as
        hub genes.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
