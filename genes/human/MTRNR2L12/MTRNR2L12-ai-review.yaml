- id: PMID:25720405
  title: 'MTRNR2L12: A Candidate Blood Marker of Early Alzheimer''s Disease-Like Dementia in Adults
    with Down Syndrome.'
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: DISPUTED
    review_notes: 'PubMed-verified (J Alzheimers Dis 2015;46:145-150, PMCID PMC4878308), full text cached.
      The only paper named after this locus. Its primary result is sound as far as it goes: microarray
      plus SYBR Green RQ-PCR in blood mononuclear cells of 48 adults with Down syndrome identified MTRNR2L12
      transcript as the single discriminating gene. Three caveats make it unusable as functional evidence.
      First, it measures transcript, not peptide. Second, it designed its own primers from ENST00000600213
      because no commercial assay exists, and does not demonstrate specificity against the twelve near-identical
      nuclear copies or the mitochondrial rRNA. Third, and the reason for the DISPUTED flag, its discussion
      asserts without any citation that the presence of the MTRNR2L12 peptide has been confirmed in brain
      tissue; I could find no primary report of an HN12 peptide, and that sentence should not be propagated
      into annotation.'
- id: PMID:35421970
  title: Co-expression analysis to identify key modules and hub genes associated with COVID-19 in
    platelets.
  findings: []
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: PubMed-verified (BMC Med Genomics 2022;15:83, PMCID PMC9008611), full text cached.
      WGCNA of platelet transcriptomes in COVID-19; MTRNR2L12 is a hub gene of the magenta module
      alongside the mitochondrially encoded MT-ND1 and MT-ND5. Cited here only as a transcript-level
      observation and as an illustration of the interpretive risk - a nuclear copy of a mitochondrial
      rRNA segment co-clustering with mitochondrial transcripts in a short-read analysis is what
      read mis-assignment looks like. No peptide, localisation or activity data.
