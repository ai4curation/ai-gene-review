- term:
    id: GO:0016787
    label: hydrolase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: Controlled mouse CRMP3 preparations show a distinct deacetylation activity, but
      intrinsic catalysis and transfer to human DPYSL4 remain unresolved.
    action: UNDECIDED
    reason: 'PMID:23443259 provides positive mouse-CRMP3-associated deacetylation evidence: full-length
      protein, p54 and D-domain preparations were active, with full-length strongest; HEK293 EGFP fusions
      were purified using anti-EGFP, while Sf9 His6/S-tagged proteins used nickel affinity purification.
      EGFP/empty-vector, inactive C-terminal fragment, CRMP4-negative and HDAC6-positive controls, dose
      dependence and selective H4 effects strengthen the observation. However, the native-histone assay
      used a cell-lysate substrate preparation and the purified fractions were not shown to exclude another
      associated deacetylase; intrinsic catalytic attribution remains unresolved. The commercial Abnova
      reagent listed in Materials is not unambiguously linked to a particular assay/species, so it does
      not establish direct human-protein activity. The focused OpenScientist report correctly identifies
      enzyme-attribution and replication gaps, but its truncation-only account and host/tag conflation
      are incorrect. TSA sensitivity raises a possible associated-HDAC explanation without proving it.
      Loss of dihydropyrimidinase activity, including its curated NOT, does not negate every broader hydrolase
      activity. Retain UNDECIDED for this specific attribution question, rather than remove the term based
      on missing human tests or loss of the ancestral metal center.'
    supported_by:
    - reference_id: PMID:23443259
      supporting_text: Here we found that mouse CRMP3 has robust histone H4 deacetylase activity.
    - reference_id: PMID:23443259
      supporting_text: purified full-length CRMP3 had the strongest HDAC activity, followed by that
        from the D domain and p54.
