- id: PMID:23373749
  title: 'Insights into the oligomerization of CRMPs: crystal structure of human collapsin response mediator
    protein 5.'
  findings:
  - statement: CRMP5 was directly tested for amidohydrolase activity and showed none; this is
      comparative, not a direct assay of the present target. CRMP1/2 oligomerization was also
      compared.
    supporting_text: "CRMP-5 does not have any detectable amidohydrolase\nactivity."
- id: file:human/DPYSL2/DPYSL2-hypotheses/function-hypothesis-go-0016812/openscientist.md
  title: openscientist.md evidence for DPYSL4
  findings:
  - statement: The report supports loss of cyclic-amide catalysis from missing metal-center residues
      and CRMP2 structural evidence. The CRMP5 negative assay is paralog evidence. Neither loss of
      this reaction nor a noncatalytic alternative role proves exclusion from all broader metabolic
      processes.
- id: PMID:23443259
  title: Collapsin response mediator protein 3 deacetylates histone H4 to mediate nuclear
    condensation and neuronal death.
  findings:
  - statement: Mouse CRMP3 full-length and fragment preparations exhibit deacetylation in two
      expression systems, with specificity controls. Exclusive intrinsic enzyme attribution and the
      identity of a listed commercial reagent remain unresolved.
    supporting_text: Here we found that mouse CRMP3 has robust histone H4 deacetylase activity.
  - statement: The full-length protein, not only the cleaved form, was tested and had the strongest
      reported activity.
    supporting_text: purified full-length CRMP3 had the strongest HDAC activity, followed by that
      from the D domain and p54.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PMID/title and full article verified against PMC/Nature. Directly supports
      controlled mouse-CRMP3-associated deacetylation. This verifies the source and reported
      findings, not exclusive intrinsic catalytic attribution or an unambiguous human reagent assay.
- id:
    file:human/DPYSL4/DPYSL4-hypotheses/crmp3-deacetylase-and-broad-hydrolase-activity/openscientist.md
  title: OpenScientist assessment of CRMP3 deacetylase and broad hydrolase activity
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: Read entire report and compared Methods/Results to the full primary article.
      Enzyme-attribution and replication uncertainties are useful, but full-length constructs were
      tested; HEK293 and Sf9 tags/purification differ; TSA sensitivity does not demonstrate
      contamination; NOT dihydropyrimidinase does not negate parent hydrolase terms. Exact reported
      sequence identities/residue maps lack delivered code or alignment artifacts and are not
      adopted as independently verified measurements.
  findings:
  - statement: The focused report identifies absence of an intrinsic catalytic-site test and
      independent replication, helping define the unresolved enzyme-attribution question. Its
      absolute negative recommendation and proposed broad NOT are not supported by the primary
      control data.
