suggested_questions:
- question: What is the role of CRMP3 (DPYSL4) and its filamin interaction in dendritic/neurite
    development, and how does it differ functionally from the other CRMPs within hetero-tetramers?
- question: Can orthogonal purification, composition analysis and a mechanistically justified
    catalytic-site perturbation distinguish intrinsic DPYSL4/CRMP3 H4 deacetylation from an
    associated enzyme, and does the activity extend to defined human DPYSL4 protein?
suggested_experiments:
- hypothesis: DPYSL4 contributes to dendritic development via filamin-dependent cytoskeletal
    coupling.
  description: Test dendrite/neurite outgrowth with wild-type vs filamin-binding-deficient DPYSL4
    and in DPYSL4-depleted neurons.
