description: Dihydropyrimidinase-related protein 4 (DPYSL4/CRMP3), a cytoplasmic CRMP-family protein
  involved in class-3 semaphorin signaling and cytoskeletal remodeling during neuronal development.
  A pseudoenzyme with respect to the ancestral dihydropyrimidinase reaction, it lacks the conserved
  metal-cofactor residues and has no dihydropyrimidinase activity. It binds filamin, forms homo- and
  hetero-tetramers with other CRMPs, and contributes to neurite outgrowth and dendritic development.
  A separate study of mouse CRMP3 and recombinant preparations reports histone H4 deacetylation,
  particularly after nuclear translocation of an N-terminally cleaved form; the extent of that
  activity in human DPYSL4 remains unresolved.
