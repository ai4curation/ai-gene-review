id: P45381
gene_symbol: ASPA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ASPA is a zinc-dependent aspartoacylase that hydrolyzes the amide bond of N-acetyl-L-aspartate,
  producing acetate and L-aspartate. Its soluble catalytic activity contributes directly to aspartate
  and acetate metabolism. The enzyme also accepts selected other N-acyl-L-aspartates in vitro. Its active
  site lies between an N-terminal metallohydrolase-like domain and a C-terminal domain that shapes substrate
  access. ASPA is expressed in brain white matter, where loss of its activity causes Canavan disease,
  a leukodystrophy with white-matter degeneration.
