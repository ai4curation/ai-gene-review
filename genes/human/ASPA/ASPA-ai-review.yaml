suggested_questions:
- question: What evidence in the source interaction records establishes the ten remaining ASPA partner
    pairs, and do any have a reproducible effect on catalysis or localization?
- question: How do native nuclear, cytosolic and myelin-associated ASPA pools differ in activity and assembly?
- question: Does the current InterPro mapping to ester-bond hydrolysis reflect a family-level mapping
    error for ASPA?
suggested_experiments:
- description: Measure NAA hydrolysis by purified human ASPA with and without MYO1D tail under matched
    conditions, independently controlling for protein concentration and zinc availability.
  hypothesis: MYO1D binding may modulate ASPA activity, but the existing physical interaction experiments
    do not establish regulation.
