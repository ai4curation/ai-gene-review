- term:
    id: GO:0008270
    label: zinc ion binding
  evidence_type: IDA
  original_reference_id: PMID:17194761
  qualifier: enables
  review:
    action: NEW
    summary: Human ASPA directly coordinates a catalytic zinc ion.
    reason: Human ASPA crystal structures identify zinc-coordinating residues, and human active-site mutagenesis
      independently identifies His21, Glu24 and His116 as zinc ligands. This is a physical binding function
      of ASPA itself, distinct from its existing catalytic-reaction annotations. The zinc supports the
      single aspartoacylase mechanism rather than a separate physiological function.
    supported_by:
    - reference_id: PMID:17194761
    - reference_id: PMID:17027983
