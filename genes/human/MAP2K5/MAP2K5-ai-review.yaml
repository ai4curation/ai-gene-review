      cardiomyocyte apoptosis, attenuated in cardiac-specific constitutively active MEK5alpha transgenic mice. UniProt likewise
      describes MEK5 as a negative regulator of apoptosis in cardiomyocytes. Negative regulation of cardiac muscle cell apoptotic
      process (GO:0010667) better reflects the evidence; the role is indirect (via ERK5) and non-core. The cached record
      is abstract-only, but the open full text (PMC2992371) was checked during review: all MEK5 experiments use neonatal
      rat cardiomyocytes or cardiac-specific CA-MEK5alpha transgenic hearts, and smooth muscle cells are not studied, so the
      smooth muscle term in the rat source appears to be a term-selection slip.'
