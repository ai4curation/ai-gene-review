core_functions:
- description: 'MEK5 is the dedicated dual-specificity MAP kinase kinase of the ERK5 cascade: activated by MEKK2/MEKK3 through
    PB1-PB1 heterodimerisation and Ser311/Thr315 phosphorylation, it docks ERK5 via its N-terminal region and phosphorylates
    the Thr and Tyr of the ERK5 TEY activation motif, without activating ERK1/2, JNK or p38.'
  molecular_function: *id006
  directly_involved_in:
  - *id020
  supported_by:
  - *id003
  - *id007
  - *id011
  - *id023
  - *id005
  - *id004
  - reference_id: PMID:7499418
    supporting_text: MEK5 does not phosphorylate the ERK/MAP kinase family members ERK1, ERK2, ERK3, JNK/SAPK, or p38/HOG1
- description: In endothelial cells MEK5 transduces laminar shear stress into ERK5 activation and MEF2-dependent induction
    of KLF2 (and KLF4), driving an atheroprotective, anti-inflammatory, pro-survival endothelial program.
  molecular_function: *id006
  directly_involved_in:
  - id: GO:0071499
    label: cellular response to laminar fluid shear stress
  supported_by:
  - *id002
  - *id022
  - *id021
suggested_questions:
- question: Should MEK5 carry MAP kinase scaffold activity (GO:0005078) in addition to MAP kinase kinase activity, given that
    its PB1 domain co-recruits MEKK2/3 and ERK5 into one complex, or is that term reserved for non-catalytic scaffolds?
- question: Which UniProt isoforms correspond to the historical MEK5alpha and MEK5beta, and is MEK5beta a dominant-negative
    regulator or an independently active kinase in vivo?
- question: Is endogenous human MEK5 predominantly cytosolic or membrane/cytoskeleton-associated (particulate), and does it
    accompany ERK5 to the nucleus?
- question: Does MEK5 have any physiological substrate other than ERK5, or functions independent of ERK5 (e.g. via SQSTM1/aPKC
    PB1 complexes)?
suggested_experiments:
- description: Endothelial-specific Map2k5 conditional knockout in adult mice to test whether MEK5 loss phenocopies Mapk7
    loss in vascular integrity and shear-stress-induced KLF2/KLF4 expression.
- description: Quantitative phosphoproteomics after acute chemical-genetic or degron-mediated MEK5 inactivation in human endothelial
    cells to identify any direct substrates beyond ERK5.
- description: Isoform-resolved localization (endogenous tagging) and in vitro kinase assays for each UniProt MAP2K5 isoform
    against ERK5.
