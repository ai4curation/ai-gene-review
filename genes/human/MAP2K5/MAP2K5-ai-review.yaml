id: Q13163
gene_symbol: MAP2K5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: MAP2K5 (MEK5, MKK5) is a dual-specificity protein kinase of the STE7/MAP kinase kinase family and the dedicated,
  non-redundant activator of the atypical MAP kinase ERK5 (MAPK7). It combines an N-terminal PB1 domain with a C-terminal
  kinase domain. The PB1 domain heterodimerises with the PB1 domains of the MAP3Ks MEKK2 (MAP3K2) and MEKK3 (MAP3K3), which
  phosphorylate MEK5 on Ser311 and Thr315 of its activation loop, while an adjacent acidic docking motif in the N-terminal
  region binds ERK5; MEK5 thereby co-recruits activator and substrate into a MEKK2/3-MEK5-ERK5 signalling complex. Active
  MEK5 phosphorylates the threonine and tyrosine of the ERK5 Thr-Glu-Tyr activation motif; it does not activate ERK1/2, JNK
  or p38. MEK5 is largely cytoplasmic, and activated ERK5 carries the signal to the nucleus, where it activates MEF2 transcription
  factors and induces KLF2 and KLF4. The MEK5-ERK5 pathway relays growth factor, oxidative/osmotic stress and laminar shear
  stress signals, and is central to endothelial mechanotransduction, endothelial survival and anti-inflammatory programs;
  loss of Mek5 in mice causes embryonic death around E10.5 with cardiovascular defects. Alternative splicing yields a full-length
  MEK5alpha and an N-terminally truncated MEK5beta, which can interfere with ERK5 activation.
