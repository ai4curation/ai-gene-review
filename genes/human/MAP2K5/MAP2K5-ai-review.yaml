- term:
    id: GO:0005819
    label: spindle
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: located_in
  supporting_entities:
  - UniProtKB:Q9WVS7
  - ensembl:ENSMUSP00000034920
  review:
    summary: Ensembl Compara transfer of spindle localization from mouse Map2k5 (mouse IDA, PMID:15509711).
    action: UNDECIDED
    reason: The mouse source (PMID:15509711) is a phospho-antibody immunocytochemistry survey of many kinases and transcription
      factors during M phase in trophoblast stem cells, a placental cell line and embryos, in which most phosphoproteins appeared
      to associate with the spindle complex. The cached record is abstract-only and does not name MEK5, and the full text
      is not openly available, so the MEK5-specific observation the mouse curator used cannot be checked here. No other
      study places MEK5 on the spindle or implicates it in mitosis; its characterised signalling occurs in a cytoplasmic
      MEKK2/3-MEK5-ERK5 complex. Left undecided rather than removed; at most this is a non-core, phospho-epitope-based
      observation.
    supported_by:
    - reference_id: PMID:15509711
      supporting_text: Most phosphoproteins appeared to associate
        with the spindle complex during M phase
    - reference_id: PMID:7499418
      supporting_text: MEK5 beta is ubiquitously distributed and primarily cytosolic
