description: 'ABHD18 is a mitochondrial alpha/beta-hydrolase-fold enzyme that deacylates cardiolipin.
  It removes one acyl chain from tetra-acylated cardiolipin to give the tri-acylated intermediate monolysocardiolipin,
  preferring substrates with shorter, saturated fatty acyl chains. That reaction is the long-sought first
  half of cardiolipin acyl-chain remodelling: nascent cardiolipin is deacylated by ABHD18 and then re-acylated
  by tafazzin with longer, unsaturated chains, and repeated cycles of hydrolysis and reacylation give
  mature cardiolipin the acyl composition required for inner-membrane and respiratory-chain function.
  The identity of the deacylase had remained unknown until ABHD18 was found in a genetic suppressor screen.
  That screen also gives the gene direct clinical significance: Barth syndrome is caused by inactivating
  mutations in tafazzin and is characterised by accumulation of monolysocardiolipin, so inactivating the
  upstream deacylase relieves the block. Loss of ABHD18 rescues mitochondrial defects in Barth syndrome
  cells and rescues morbidity and mortality in mouse models, and a selective covalent ABHD18 inhibitor
  rescues tafazzin-mutant phenotypes in patient fibroblasts and fish embryos.'
