description: 'ABHD18 is a mitochondrial alpha/beta-hydrolase-fold enzyme that deacylates cardiolipin.
  It hydrolyses acyl chains from tetra-acylated cardiolipin, first giving the tri-acylated intermediate
  monolysocardiolipin and then continuing stepwise to dilyso-cardiolipin, and it prefers substrates with
  shorter, saturated chains - species with more than five double bonds resist it. It is functionally homologous
  to yeast Cld1. That reaction is the long-sought first half of cardiolipin acyl-chain remodelling: nascent
  cardiolipin is deacylated by ABHD18 and then re-acylated by tafazzin with longer, unsaturated chains,
  and repeated cycles of hydrolysis and reacylation give mature cardiolipin the acyl composition required
  for inner-membrane and respiratory-chain function. Whether that pairing is best read as a remodelling
  cycle or as degradation opposed by tafazzin is framed differently by the two 2025 studies that characterised
  the enzyme. The identity of the deacylase had remained unknown until ABHD18 was found in a genetic suppressor
  screen. That screen also gives the gene direct clinical significance: Barth syndrome is caused by inactivating
  mutations in tafazzin and is characterised by accumulation of monolysocardiolipin, so inactivating the
  upstream deacylase relieves the block. Loss of ABHD18 rescues mitochondrial defects in Barth syndrome
  cells and rescues morbidity and mortality in mouse models, and a selective covalent ABHD18 inhibitor
  rescues tafazzin-mutant phenotypes in patient fibroblasts and fish embryos.'
