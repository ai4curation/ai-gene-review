proposed_new_terms:
- proposed_name: cardiolipin deacylase activity
  proposed_definition: Catalysis of the hydrolysis of an acyl chain from cardiolipin, producing monolysocardiolipin
    and a fatty acid.
  justification: 'GO covers the rest of cardiolipin metabolism at substrate-specific resolution - cardiolipin
    synthase activity (GO:0008808), cardiolipin synthase (CMP-forming) activity (GO:0043337), cardiolipin
    phospholipase D activity (GO:0035755), cardiolipin dehydrogenase (NAD+) activity (GO:0160241) - but
    has no term for the deacylation step, even though that step is half of the cycle described by GO:0035965
    cardiolipin acyl-chain remodeling. The gap is historical: the responsible enzyme was unidentified
    until ABHD18 was described, so the most specific molecular function available is the generic GO:0004620
    glycerophospholipase activity, which conveys neither substrate nor product. The reaction is registered
    in Rhea as RHEA:32935 and recorded in UniProt with that cross-reference, so the chemistry is unambiguous.
    A term at this granularity would also let the deacylase and the reacylase (tafazzin) be distinguished
    by molecular function rather than only by their shared process term.'
  proposed_parent:
    id: GO:0004620
    label: glycerophospholipase activity
  supported_by:
  - reference_id: PMID:40903572
    supporting_text: 'ABHD18 converts CL into monolysocardiolipin (MLCL) in vitro, and

      its inactivation in cells and mice results in a shift to nCL in serum and

      tissues.'
