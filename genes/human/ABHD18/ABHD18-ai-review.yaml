core_functions:
- description: Cardiolipin deacylation, the first half of cardiolipin acyl-chain remodelling. ABHD18 hydrolyses
    one acyl chain from tetra-acylated cardiolipin to give tri-acylated monolysocardiolipin, preferring
    substrates with shorter, saturated chains - that is, preferring the nascent cardiolipin newly made
    by cardiolipin synthase. Tafazzin then re-acylates the product with longer, unsaturated chains, and
    repeated cycles of this hydrolysis and reacylation pair establish the acyl composition mature cardiolipin
    needs for inner-membrane and respiratory-chain function. ABHD18 is the enzyme that had been missing
    from this cycle.
