- id: PMID:40378955
  title: ABHD18 degrades cardiolipin by stepwise hydrolysis of fatty acids.
  findings:
  - statement: ABHD18 is functionally homologous to yeast Cld1 and is the long-sought lipase that hydrolyses
      cardiolipin in mice and flies.
    supporting_text: "we \ndemonstrate that α/β-hydrolase domain 18 (ABHD18), a highly conserved protein\
      \ of \nplants, animals, and humans, is functionally homologous to Cld1."
  - statement: Deacylation is stepwise rather than removal of a single fatty acid, proceeding past monolysocardiolipin.
    supporting_text: "Rather than removing just one fatty acid, we show \nthat ABHD18 deacylates CL further."
  - statement: ABHD18 catalyses the breakdown of cardiolipin while tafazzin protects cardiolipin from
      degradation.
    supporting_text: "Thus, ABHD18 catalyzes the breakdown of CL, \nwhereas TAZ protects CL from degradation."
  - statement: Abhd18 knockdown decreased monolysocardiolipin in murine Taz-knockout myoblasts, and Drosophila
      inactivation increased cardiolipin abundance.
    supporting_text: "Knockdown of \nAbhd18 decreased the concentration of MLCL in murine, Taz-knockout\
      \ myoblasts."
  - statement: The authors explicitly dissent from the orthodox remodelling mechanism and place ABHD18's
      degradative activity outside it, while still describing ABHD18 as participating in TAZ-catalysed
      remodelling - which is why GO:0035965 is retained rather than removed.
    supporting_text: This is inconsistent with the orthodox remodeling mechanism but suggests that ABHD18
      and TAZ have opposing effects on CL metabolism.
  - statement: The same Discussion states the participation directly, so the dissenting paper itself
      supports retaining the remodelling process annotation.
    supporting_text: Apart from its participation in TAZ-catalyzed remodeling, ABHD18 alters the CL species
      composition by species-selective degradation.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached record title matches the citation, and the cache has full text (Results and
      Discussion), not abstract only - an earlier draft of this entry wrongly carried
      full_text_unavailable. Added after PR review pointed out that the affinage record cited it while
      this review neither used nor adjudicated it - a fair catch, since it materially qualifies the
      framing. It corrects 'removes one acyl chain' to stepwise deacylation past monolysocardiolipin,
      supplies the yeast Cld1 homology, adds loss-of-function evidence in Drosophila and murine myoblasts
      that corroborates the GO:0035965 IMP, and frames the ABHD18/tafazzin relationship as degradation
      opposed by protection rather than as a partnership. The disagreement is sharper than a difference
      of framing - the Discussion calls the orthodox cycle 'inconsistent' with their backbone-turnover
      data and calls ABHD18's degradation 'a function that is separate from CL remodeling'. GO:0035965
      is nonetheless retained, on this paper's own words - 'Apart from its participation in TAZ-catalyzed
      remodeling' concedes the participation.
core_functions:
- description: Cardiolipin deacylation, the first half of cardiolipin acyl-chain remodelling. ABHD18 removes
    acyl chains from tetra-acylated cardiolipin stepwise - first to tri-acylated monolysocardiolipin and,
    on further hydrolysis, past it to dilyso-cardiolipin - preferring
    substrates with shorter, saturated chains - that is, preferring the nascent cardiolipin newly made
    by cardiolipin synthase. Tafazzin then re-acylates the product with longer, unsaturated chains, and
    repeated cycles of this hydrolysis and reacylation pair establish the acyl composition mature cardiolipin
    needs for inner-membrane and respiratory-chain function. ABHD18 is the enzyme that had been missing
    from this cycle.
