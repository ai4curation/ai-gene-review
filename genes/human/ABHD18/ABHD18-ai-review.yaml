proposed_new_terms:
- proposed_name: cardiolipin deacylase activity
  proposed_definition: Catalysis of the hydrolysis of acyl chains from cardiolipin, producing monolysocardiolipin
    and, on further hydrolysis, dilyso-cardiolipin, with release of fatty acids. Registered in Rhea as
    RHEA:32935 for the first step.
  justification: 'GO covers the rest of cardiolipin metabolism at substrate-specific resolution - cardiolipin
    synthase activity (GO:0008808), cardiolipin synthase (CMP-forming) activity (GO:0043337), cardiolipin
    phospholipase D activity (GO:0035755), cardiolipin dehydrogenase (NAD+) activity (GO:0160241) - but
    has no term for the deacylation step, even though that step is half of the cycle described by GO:0035965
    cardiolipin acyl-chain remodeling. The gap is historical: the responsible enzyme was unidentified
    until ABHD18 was described, so the most specific molecular function available is
    GO:0004623 phospholipase A2 activity - and even that conveys neither substrate nor product, while
    its generic parent GO:0004620 glycerophospholipase activity conveys less still. The reaction is
    registered in Rhea as RHEA:32935 and recorded in UniProt with that cross-reference, so the chemistry
    is unambiguous; RHEA:32935 also places the removed chain at sn-2, which is why the A2-type term is
    used as the interim parent - though that placement is a Rhea reaction representation behind a UniProt
    ECO:0000305 curator inference rather than measured regiospecificity. The activity is conserved - ABHD18 is functionally homologous to yeast Cld1 - and it is stepwise
    rather than single-turnover, proceeding past monolysocardiolipin to dilyso-cardiolipin, so a term
    naming only the first product would itself be incomplete. A term at this granularity would also let
    the deacylase and the reacylase (tafazzin) be distinguished by molecular function rather than only
    by their shared process term.'
  proposed_parent:
    id: GO:0004623
    label: A2-type glycerophospholipase activity
