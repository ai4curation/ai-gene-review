  review:
    summary: 'Proposed new annotation. Cardiolipin acyl-chain remodelling is the cycle in which nascent
      cardiolipin is deacylated and then re-acylated with longer, unsaturated chains; ABHD18 performs
      the deacylation and tafazzin the reacylation. Tafazzin already carries this term, so annotating
      ABHD18 completes a process that until 2025 had only one identified enzyme.


      Two independent 2025 studies frame the same enzymology differently and the difference is worth recording.
      PMID:40903572 presents ABHD18 as the missing deacylase of the remodelling pathway. PMID:40378955
      presents it as a degradative lipase functionally homologous to yeast Cld1, concluding that ABHD18
      catalyses the breakdown of cardiolipin whereas tafazzin protects cardiolipin from degradation -
      and shows the deacylation is stepwise, proceeding past monolysocardiolipin to dilyso-cardiolipin,
      with species carrying more than five double bonds resistant.


      GO:0035965 is retained because both accounts agree ABHD18 supplies the deacylation step of the ABHD18/tafazzin
      pair, and because GO has no cardiolipin catabolic process term to express the degradative reading.
      A curator taking the PMID:40378955 framing at face value would want one; that gap is noted in suggested_questions.'
    action: NEW
    reason: Places the gene in the pathway its catalytic activity belongs to, using the term its partner
      enzyme already carries; GOA currently records no biological process for ABHD18.
