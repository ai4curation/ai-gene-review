    supporting_text: 'ABHD18 converts CL into monolysocardiolipin (MLCL) in vitro, and

      its inactivation in cells and mice results in a shift to nCL in serum and

      tissues.'
  - reference_id: file:human/ABHD18/ABHD18-uniprot.txt
    supporting_text: 'CC   -!- FUNCTION: Catalyzes the hydrolysis of an acyl chain from the tetra-'
  - reference_id: PMID:40378955
    supporting_text: "Rather than removing just one fatty acid, we show \nthat ABHD18 deacylates CL further."
suggested_questions:
- question: Where in the mitochondrion does ABHD18 act? Cardiolipin remodelling happens at the inner membrane,
    and its partner tafazzin is annotated to both the inner and outer mitochondrial membranes, but ABHD18's
    only localisation evidence is an unqualified "mitochondrion" from a proteomic survey. Submitochondrial
    localisation would sharpen the cellular component annotation and constrain how the deacylase and the
    reacylase meet their shared substrate.
- question: Is ABHD18 the only cardiolipin deacylase, or one of several? It was found as a suppressor
    of tafazzin loss rather than by a systematic search, so other contributing enzymes may exist. That
    matters therapeutically, since redundancy would limit how completely an ABHD18 inhibitor can normalise
    the monolysocardiolipin-to-cardiolipin ratio in Barth syndrome.
- question: What determines the acyl-chain preference? ABHD18 prefers cardiolipin with shorter, saturated
    chains, which is what makes the remodelling cycle directional - nascent species are consumed and mature
    ones spared. The structural basis is unknown, and it is the key to designing inhibitors that spare
    mature cardiolipin.
- question: Does ABHD18 have substrates besides cardiolipin? It is an alpha/beta-hydrolase, a fold with
    broad substrate range across the family, and only cardiolipin has been tested. A selective covalent
    inhibitor now exists, so off-target lipid changes can be surveyed directly.
- question: Is ABHD18 better described as remodelling or as degradation, and does GO need a cardiolipin
    catabolic process term? PMID:40903572 presents ABHD18 as the missing deacylase of the remodelling
    cycle; PMID:40378955 concludes that ABHD18 catalyses the breakdown of cardiolipin whereas tafazzin
    protects it, and shows deacylation continues past monolysocardiolipin to dilyso-cardiolipin. GO has
    cardiolipin biosynthetic process and cardiolipin acyl-chain remodeling but no catabolic term, so the
    degradative reading currently cannot be expressed.
suggested_experiments:
- hypothesis: ABHD18 acts at the mitochondrial inner membrane, in proximity to tafazzin and cardiolipin
    synthase.
  description: Determine the submitochondrial localisation and topology of ABHD18 by protease protection
    on isolated mitochondria and mitoplasts combined with immuno-electron microscopy, and test for proximity
    to tafazzin and CRLS1 by split-reporter or proximity-labelling assays.
  experiment_type: cell biology
- hypothesis: ABHD18's preference for short, saturated acyl chains is what makes cardiolipin remodelling
    directional.
  description: Measure kinetics of purified ABHD18 against a defined panel of cardiolipin species varying
    systematically in chain length and unsaturation, then test whether that selectivity, modelled together
    with tafazzin's known reacylation preferences, is sufficient to explain the observed steady-state
    cardiolipin composition.
  experiment_type: enzymology
- hypothesis: ABHD18 is the sole non-redundant cardiolipin deacylase.
  description: Compare the lipidomic consequences of complete ABHD18 loss with those of the covalent inhibitor
    at saturating concentration; residual monolysocardiolipin production in the null background would
    indicate additional deacylases and set an upper bound on what inhibition can achieve therapeutically.
  experiment_type: lipidomics and genetics
