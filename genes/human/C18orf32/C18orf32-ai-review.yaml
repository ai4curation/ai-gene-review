core_functions:
- description: >-
    ER-anchored small membrane protein that also moves onto lipid droplets. It is required
    for efficient PGAP1-dependent removal of the inositol acyl chain from GPI-anchored
    proteins in the ER, but the molecular basis of this requirement is unknown. No molecular
    function term is assigned.
  locations:
  - id: GO:0005783
    label: endoplasmic reticulum
  - id: GO:0005811
    label: lipid droplet
  supported_by:
  - reference_id: PMID:29275994
    supporting_text: Together, these findings indicate that c18orf32 is an ER protein that
      traffics to emerging LDs.
  - reference_id: PMID:29255114
    supporting_text: Their KO caused partial resistance of GPI-APs against PIPLC,
      suggesting that they were required for efficient GPI-inositol deacylation.
  - reference_id: PMID:29255114
    supporting_text: C18orf32 is a small protein with 76 amino acids, and its molecular
      function has not been reported.
proposed_new_terms: []
suggested_questions:
- question: >-
    How does C18orf32 support GPI-inositol deacylation by PGAP1? PMID:29255114 found PGAP1
    expression, stability and localisation unchanged in knockout cells. Does C18orf32 bind
    PGAP1 or GPI-anchored protein precursors, or act indirectly, for example through ER
    lipid or calnexin-cycle homeostasis? The answer decides whether a GPI-anchor processing
    process term would describe participation or only necessity.
  experts:
  - Morihisa Fujita
  - Taroh Kinoshita
- question: >-
    Is the lipid droplet pool of C18orf32 functional, or is it a by-product of ER
    partitioning of a hairpin-like protein that is normally removed by ERAD? Can the
    secretory autophagy and lipid droplet secretion role proposed in PMID:41351175 be
    reproduced independently?
  experts:
  - James A Olzmann
suggested_experiments:
- hypothesis: >-
    C18orf32 acts directly on the PGAP1 deacylation step rather than indirectly through ER
    homeostasis.
  description: >-
    In C18orf32 knockout cells, test proximity labelling or co-immunoprecipitation of tagged
    C18orf32 with PGAP1 and with inositol-acylated GPI-AP precursors. Measure PGAP1
    activity in vitro on microsomes from wild-type and knockout cells, with and without
    recombinant C18orf32. Ask whether the N-terminal ER-anchoring region or the disordered
    C-terminal tail is needed to rescue PIPLC sensitivity.
  experiment_type: biochemical reconstitution and genetic rescue
