- term:
    id: GO:0043123
    label: positive regulation of canonical NF-kappaB signal transduction
  evidence_type: HMP
  original_reference_id: PMID:12761501
  qualifier: involved_in
  review:
    summary: C18orf32 was one of ~300 cDNAs that activated an NF-kappaB luciferase reporter
      when overexpressed in HEK293 cells in a genome-scale screen of 150,000 cDNAs.
    action: MARK_AS_OVER_ANNOTATED
    reason: The only evidence is a hit in an overexpression reporter screen, which shows
      that excess protein can activate a reporter, not that the endogenous protein acts in
      NF-kappaB signalling. The cached record is abstract-only, so gene-level data could not
      be inspected, and the result is not contradicted. However, no study in the 23 years
      since has linked C18orf32 to NF-kappaB signalling. Every later functional study places
      it in the ER and on lipid droplets, in GPI-anchor processing, ERAD and lipid
      handling. Overexpression of an ER membrane protein that is normally degraded by ERAD
      could plausibly activate NF-kappaB indirectly through ER stress. The term is kept but
      flagged as not representing the gene's function.
    supported_by:
    - reference_id: PMID:12761501
      supporting_text: For analysis of the NF-kappaB signaling pathway, we introduced each
        of the cDNAs into human embryonic kidney 293 cells and examined whether it
        activated the transcription of a luciferase reporter gene driven by a promoter
        containing the consensus NF-kappaB binding sites.
