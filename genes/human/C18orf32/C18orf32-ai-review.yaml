id: Q8TCD1
gene_symbol: C18orf32
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  C18orf32 encodes a 76-residue protein of the UPF0729 family (DUF4512) with an N-terminal
  hydrophobic segment and a disordered C-terminal tail. The N-terminal region anchors the
  protein in the endoplasmic reticulum, and when cells are loaded with fatty acids a fraction
  moves onto nascent and mature lipid droplets. The protein turns over constitutively by
  ER-associated degradation through the E3 ligase gp78 (AMFR), derlin-1, VCP and the
  proteasome. In a genetic screen, C18orf32 was one of a small set of ER factors required for
  efficient removal of the inositol acyl chain from newly made GPI-anchored proteins by the
  deacylase PGAP1, and a homozygous frameshift variant causes an autosomal recessive
  GPI-biosynthesis-defect neurodevelopmental disorder (GPIBD25) with loss of this activity. How
  C18orf32 supports GPI-inositol deacylation is unknown, and it has no known enzymatic
  activity. A single recent study also places it on SEC22B-positive secretory autophagosomes
  with a role in lipid droplet secretion. An early overexpression screen reported that it can
  activate an NF-kappaB reporter, but this has not been followed up.
