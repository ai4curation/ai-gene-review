- id: file:human/DNAJC16/DNAJC16-hypotheses/kgap-dnajc16-erdj8-jdomain-vs-redox/openscientist.md
  title: OpenScientist report on DNAJC16 J-domain and TRX activity
  findings:
  - statement: >-
      A focused report found that DNAJC16 has no demonstrated HSP70
      co-chaperone or thioredoxin-like redox activity despite the conserved
      J-domain and TRX-like domain architecture.
    supporting_text: >-
      **No molecular function annotation for DNAJC16/ERdj8 is currently supported
      by direct biochemical evidence.**
  - statement: >-
      The report interprets UniProt's predicted type IV topology as placing
      DNAJC16's J domain on the cytoplasmic face of the ER and therefore excluding
      a direct ER-luminal BiP/HSPA5 partnership; this topology conflicts with the
      sole primary study's ER-luminal wording and remains unresolved.
    supporting_text: >-
      **BiP/HSPA5, the ER-luminal HSP70 chaperone, cannot be the J-domain's
      functional partner.**
    finding_review:
      finding_status: DISPUTED
      superseded_by:
      - PMID:32492081
      review_notes: >-
        The report follows the UniProt type-IV/cytoplasmic topology prediction, but
        PMID:32492081 calls ERdj8 a type 1 membrane protein and places the DnaJ/TRX
        domains on the ER luminal side. No dedicated topology experiment has resolved
        the conflict.
      supported_by:
      - reference_id: PMID:32492081
        supporting_text: >-
          ERdj8/DNAJC16 is a type 1 membrane protein that contains a single transmembrane
          stretch along with DnaJ and thioredoxin-like domains
      - reference_id: PMID:32492081
        supporting_text: >-
          The DnaJ and TRX domains of ERdj8 on the ER luminal side were important for
          the function of ERdj8 in the regulation of autophagy
      - reference_id: file:human/DNAJC16/DNAJC16-uniprot.txt
        supporting_text: Single-pass type IV membrane protein
      - reference_id: file:human/DNAJC16/DNAJC16-uniprot.txt
        supporting_text: /note="Cytoplasmic"
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: >-
      Focused hypothesis review; its core topological premise follows UniProt's
      predicted type-IV topology for residues 26-535, but that conflicts with
      PMID:32492081's type-1 and ER-luminal wording and UniProt also retains a
      predicted cleaved signal peptide that is difficult to reconcile with a
      cytoplasmic 26-535 region. Treat the topology as unresolved pending direct
      experimental mapping.
core_functions:
- description: ER membrane DnaJ/HSP40 protein that regulates the size of forming autophagosomes, enabling autophagic engulfment of large targets; activity requires both its J domain and its thioredoxin domain.
  locations:
  - id: GO:0005789
    label: endoplasmic reticulum membrane
