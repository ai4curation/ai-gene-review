    - reference_id: file:human/DNAJC16/DNAJC16-hypotheses/kgap-dnajc16-erdj8-jdomain-vs-redox/openscientist.md
      supporting_text: >-
        **BiP/HSPA5, the ER-luminal HSP70 chaperone, cannot be the J-domain's
