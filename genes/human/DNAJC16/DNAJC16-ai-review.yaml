proposed_new_terms: []
suggested_questions:
- question: What is the direct molecular activity of ERdj8 - if its J domain is ER-luminal, does it recruit and stimulate BiP/HSPA5, and if it is cytoplasmic, does it recruit and stimulate HSPA8/HSPA1A or another cytosolic HSP70; is its thioredoxin-like domain redox-active or scaffolding?
- question: How does ERdj8 mechanistically couple the ER subdomain (with phosphatidylinositol synthase) to the control of autophagosome membrane size?
suggested_experiments:
- description: Determine the membrane orientation of the ERdj8 J and thioredoxin-like domains directly, using protease protection of microsomes, glycosylation-site insertion mapping, or a split-fluorescent-protein topology reporter to resolve the type-I versus type-IV topology conflict.
- description: Reconstitute and assay ERdj8 J-domain-stimulated ATPase activity with topology-appropriate HSP70 candidates, comparing ER-luminal BiP/HSPA5 and cytosolic HSPA8/HSPA1A if the J domain is accessible, and test the redox activity of its thioredoxin-like domain in vitro, using H57Q and C171A/C174A mutants as controls, to define the molecular function underlying autophagosome-size regulation.
- description: Proximity labeling (BioID/APEX) from ERdj8 at the ER-phagophore subdomain to identify its HSP70 partner(s) and Atg/lipid-synthesis machinery it engages during autophagosome formation.

knowledge_gaps:
- gap_statement: >-
    The direct molecular activity of DNAJC16/ERdj8 is unresolved: it is not known whether
    its J domain directly recruits and stimulates a specific HSP70 partner, whether its
    TRX domain has redox activity, or whether these domains support autophagosome-size
    control through another effector mechanism.
  boundary: >-
    ERdj8 is experimentally localized to an ER membrane subdomain and regulates
    autophagosome size; both the DnaJ/J domain and TRX domain are required for the
    overexpression phenotype. The primary study places those domains on the ER luminal
    side and leaves BiP among the possible effectors, whereas UniProt and the
    OpenScientist report place them on the cytoplasmic side. The missing steps are the
    experimentally mapped topology and the biochemical activity linking those domains to
    the autophagosome-size readout.
  gap_kind:
    - BIOLOGY
    - CURATION
  dark_aspect: MF_DARK
  status: OPEN
  significance: >-
    The gene has a solid biological-process annotation but no experimentally supported
    molecular-function annotation. Adding HSP70 binding or TRX activity by domain
    inference alone would overstate the evidence.
  resolution: >-
    In vitro ERdj8 J-domain assays for HSP70 ATPase stimulation and binding, direct
    identification of the relevant HSP70/effector partner, and biochemical testing of
    TRX-domain redox activity with H57Q and C171A/C174A controls.
  provenance:
    - reference_id: PMID:32492081
      supporting_text: >-
