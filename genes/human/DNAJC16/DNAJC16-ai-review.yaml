description: DNAJC16 (ERdj8, "ER-resident protein ERdj8") is a large, single-pass endoplasmic reticulum membrane protein of the DnaJ/HSP40 subfamily C. It has an N-terminal cleaved signal peptide, an N-terminal J domain and an adjacent thioredoxin (TRX) domain, followed by a C-terminal transmembrane anchor; the orientation of the J/TRX region is unresolved because UniProt predicts a cytoplasmic type IV topology while the sole primary study describes these domains on the ER luminal side. ERdj8 localizes to a meshwork-like ER subdomain together with phosphatidylinositol synthase and autophagy-related (Atg) proteins, and functions in autophagosome biogenesis where it regulates the size of forming autophagosomes, enabling engulfment of large targets; both its J domain and TRX domain are required for this activity. It is otherwise poorly characterized, and its direct molecular activity (presumed J-domain co-chaperone and/or redox function) has not been biochemically defined. An alternative splice isoform lacks the J and thioredoxin domains.
