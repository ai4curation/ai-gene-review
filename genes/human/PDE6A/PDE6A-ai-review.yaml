      domain
suggested_questions:
- question: Are the PDE6A and PDE6B active sites kinetically equivalent within the native heterodimer, given that
    the first transducin bound gives very low activity at both sites and a second is needed for full activation?
- question: Does cGMP occupancy of the GAFa sites change during light adaptation in human rods?
suggested_experiments:
- hypothesis: The two active sites of native rod PDE6 contribute unequally to light-stimulated cGMP hydrolysis.
  description: Introduce a catalytic-site (metal-binding) substitution into PDE6A or PDE6B alone in a knock-in mouse
    or Xenopus rod and measure transducin-stimulated PDE6 activity and flash response kinetics.
