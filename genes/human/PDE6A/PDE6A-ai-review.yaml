- term:
    id: GO:0030553
    label: cGMP binding
  evidence_type: ISS
  original_reference_id: PMID:33007200
  review:
    summary: Non-catalytic cGMP binding by the GAFa domain, an allosteric site.
    action: NEW
    reason: In the cryo-EM structure of native bovine rod PDE6 each GAFa domain carries a cGMP in its allosteric
      site, covered by the PDE6G N-terminus; the human residues are annotated by similarity to bovine PDE6A (P11541).
      The evidence is on bovine PDE6, not on the human protein, hence ISS. The site is regulatory and likely permanently
      occupied in rods, so this is a non-core binding function distinct from catalytic cGMP hydrolysis.
    supported_by:
    - reference_id: PMID:33007200
      supporting_text: In the GαT·GTP-PDE6 complex, the N-terminus of each PDEγ subunit forms similar interactions
        with each GAFa domain that has an allosteric site occupied by a cGMP molecule.
    - reference_id: PMID:30068566
      supporting_text: features N-terminal tandem GAF domains that are likely to be permanently occupied by cGMP
        in mammalian rod cells
