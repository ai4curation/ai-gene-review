- term:
    id: GO:0047555
    label: 3',5'-cyclic-GMP phosphodiesterase activity
  evidence_type: IDA
  original_reference_id: PMID:20940301
  qualifier: contributes_to
  review:
    summary: cGMP phosphodiesterase activity, the core molecular function.
    action: ACCEPT
    reason: The human PDE6A catalytic domain, expressed as a homodimeric chimera with PDE6C GAF domains in Xenopus
      rods, hydrolyses cGMP with Km 20-23 uM and kcat 4200-5100 per s, the same as the PDE6B chimera, so PDE6A carries
      its own active site. Natively it works only within the PDE6A/PDE6B heterodimer, whose two active sites are
      each blocked by one PDE6G subunit (bovine cryo-EM). The IDA row uses contributes_to and the IEA/ISS rows enables;
      both describe the same true activity, and this review records it as the subunit's own activity exercised in
      the rod PDE6 complex.
    supported_by: &id008
    - reference_id: PMID:20940301
      supporting_text: In this study, we have demonstrated that the catalytic PDE6A and PDE6B subunits are enzymatically
        equivalent.
    - reference_id: PMID:33007200
      supporting_text: The C-terminus of each PDEγ subunit binds at the entrance of the active site of each catalytic
        domain
    - reference_id: Reactome:R-HSA-74059
      supporting_text: activated PDE6 hydrolyzes thousands of cGMP molecules per second
