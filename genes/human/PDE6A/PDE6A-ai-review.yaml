id: P16499
gene_symbol: PDE6A
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: PDE6A encodes the alpha catalytic subunit of the rod photoreceptor cGMP phosphodiesterase (PDE6), a
  heterotetramer of one PDE6A, one PDE6B and two inhibitory PDE6G subunits. Each catalytic subunit has two N-terminal
  GAF domains, the first of which binds cGMP at a non-catalytic allosteric site, and a C-terminal two-metal (Zn2+/Mg2+)
  phosphodiesterase domain with its own active site that hydrolyses 3',5'-cyclic GMP to GMP. PDE6A ends in a CaaX
  motif that is farnesylated and carboxymethylated, anchoring the enzyme to the cytoplasmic surface of the outer
  segment disc membranes, concentrated at the disc rims; delivery to the outer segment is assisted by the prenyl-binding
  protein PDE6D, and folding and assembly of the subunits depend on the chaperone AIPL1. In darkness the PDE6G C-termini
  block both active sites; light-activated transducin alpha (GNAT1-GTP), two molecules per enzyme, displaces them,
  and the burst of cGMP hydrolysis closes the cGMP-gated channels and hyperpolarises the rod. Biallelic loss-of-function
  variants cause autosomal recessive retinitis pigmentosa (RP43).
