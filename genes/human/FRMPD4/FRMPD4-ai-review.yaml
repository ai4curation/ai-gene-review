  - reference_id: PMID:30126976
  - reference_id: PMID:36115835
- description: Binds phosphatidylinositol-4,5-bisphosphate through the FERM region, contributing a membrane-interaction
    component to spine targeting together with the protein-binding modules. The direct assay uses a human
    recombinant fragment; the cellular targeting experiments use human constructs in rodent neurons.
  molecular_function:
