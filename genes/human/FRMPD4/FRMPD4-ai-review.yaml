- id: file:human/FRMPD4/FRMPD4-source-evidence.yaml
  title: FRMPD4 original annotation contexts, source measurements and genuine mapping
core_functions:
- description: Binds partner PDZ domains through its C-terminal motif as a molecular component of a dendritic-spine
    scaffold. Human construct targeting, domain perturbation and rescue in rat neurons connect this interaction
    to regulation of spine structure; quantified contacts with additional isolated PDZ domains do not
    make every partner a demonstrated physiological core complex.
  molecular_function:
    id: GO:0030165
    label: PDZ domain binding
  directly_involved_in:
