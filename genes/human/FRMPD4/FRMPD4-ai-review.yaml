  review:
    action: MODIFY
    summary: Refine the demonstrated DLG4/PSD-95 interaction to PDZ domain binding.
    reason: PMID:19118189 assays human Preso/FRMPD4 and its terminal motif against PSD-95-family proteins,
      including the exact original partner P78352 (DLG4/PSD-95). Yeast two-hybrid, pull-down and heterologous
      co-immunoprecipitation, together with C-terminal deletion/mutation, identify the target motif binding
      partner PDZ domains. This is positive, oriented support for GO:0030165, a more informative molecular
      function than generic protein binding. Rat brain recovery and neuronal phenotypes are distinct evidence
      contexts; they do not establish every human endogenous complex or a function unique to a natural
      isoform.
