  review:
    action: KEEP_AS_NON_CORE
    summary: Retain direct binding of the FRMPD4 internal segment to GPSM2/LGN.
    reason: PMID:22074847 identifies binding between FRMPD4 residues 978–1025 and the LGN/GPSM2 TPR region
      (13–414), including competition with mInsc in the selected main-article assays. The 2011 crystal
      structure concerns mInsc–LGN, so it is not a FRMPD4 structure. Independent PMID:25664792 explicitly
      tests the human FRMPD4 segment, resolves its LGN complex at 1.5 Å and tests interface substitutions.
      These support the exact P81274 association, without transferring mInsc spindle-orientation physiology
      or interpreting the bound LGN TPR as a PDZ domain.
