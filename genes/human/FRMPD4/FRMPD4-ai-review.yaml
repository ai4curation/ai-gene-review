  review:
    action: MODIFY
    summary: Refine the FRMPD4 C-terminal peptide interaction with P78352/DLG4 to PDZ domain binding.
    reason: 'PMID:30126976 uses human C-terminal nine-residue peptides in phage-display selections against
      PDZ domains. The exact original partner P78352/DLG4, PDZ region 313–388, is represented with FRMPD4
      residues 1314–1322 in the retained IntAct record(s). Original Figure5A was independently viewed:
      the WT LPKIKETTV red bar is positive in the DLG4 PDZ3 panel, with the T1320E blue bar lower. No
      numerical value is extracted from the image. This is the target peptide binding the partner PDZ
      domain, not merely the presence of a PDZ domain in either protein. WT selections support GO:0030165;
      the T1320E library comparison is a phosphomimetic experiment, not proof of endogenous FRMPD4 phosphorylation
      or a cellular kinase mechanism. No full-length physiological interaction is inferred.'
