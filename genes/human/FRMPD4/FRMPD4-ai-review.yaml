    action: KEEP_AS_NON_CORE
    summary: Retain measured FRMPD4 PDZ binding to the MERS coronavirus E peptide.
    reason: 'Although PMID:33864728 foregrounds SARS-CoV-2, its original Table 1 explicitly contains the
      MERS E–FRMPD4 result: binding intensity 0.31 and estimated Kd 43 µM. The original K9N5R3 partner
      is the MERS coronavirus E protein; the assay uses its C-terminal peptide and human FRMPD4 PDZ residues
      67–160. The in-vitro holdup measurement supports binding. It does not establish human infection
      participation, and the orientation does not demonstrate FRMPD4 binding a partner PDZ domain. Separate
      SARS-CoV-2 and infection-perturbation results are not substituted for this exact interaction.'
