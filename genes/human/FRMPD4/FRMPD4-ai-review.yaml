  review:
    action: KEEP_AS_NON_CORE
    summary: Retain the ARHGEF7/βPix association without assigning its exchange activity to FRMPD4.
    reason: The exact Q14155 partner is βPix/ARHGEF7. PMID:19118189 reports cellular co-immunoprecipitation
      and loss of binding with the FRMPD4 PDZ-site R102A mutant. This supports a scaffold-associated interaction,
      while βPix performs guanine-nucleotide exchange. The experiment does not show FRMPD4 binding a partner
      PDZ domain, nor a new FRMPD4 catalytic activity. Retain this positive association as non-core; preserve
      its original partner and source.
