id: Q14CM0
gene_symbol: FRMPD4
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: FRMPD4 (Preso/Preso1) is a multidomain neuronal scaffold containing WW, PDZ and FERM domains
  and a C-terminal PDZ-binding motif. Its C-terminal motif binds PSD-95-family and other PDZ domains,
  while its FERM region binds phosphatidylinositol-4,5-bisphosphate, linking protein interactions to membrane
  and dendritic-spine localization. Human FRMPD4 constructs regulate spine density in rodent neurons,
  and human loss-of-function variants are associated with X-linked intellectual disability. Separate rat
  and mouse studies connect Preso1 to Homer–metabotropic glutamate receptor organization and regulation
  of receptor phosphorylation. Binding of purified fragments defines additional molecular contacts but
  does not by itself establish their endogenous physiological roles.
