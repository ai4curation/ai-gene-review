approved_synthesis:
  description: FRMPD4 (Preso/Preso1) is a multidomain neuronal scaffold containing WW, PDZ and FERM domains
    and a C-terminal PDZ-binding motif. Its C-terminal motif binds PSD-95-family and other PDZ domains,
    while its FERM region binds phosphatidylinositol-4,5-bisphosphate, linking protein interactions to
    membrane and dendritic-spine localization. Human FRMPD4 constructs regulate spine density in rodent
    neurons, and human loss-of-function variants are associated with X-linked intellectual disability.
    Separate rat and mouse studies connect Preso1 to Homer–metabotropic glutamate receptor organization
    and regulation of receptor phosphorylation. Binding of purified fragments defines additional molecular
    contacts but does not by itself establish their endogenous physiological roles.
  core_functions:
  - description: Binds partner PDZ domains through its C-terminal motif as a molecular component of a
      dendritic-spine scaffold. Human construct targeting, domain perturbation and rescue in rat neurons
      connect this interaction to regulation of spine structure; quantified contacts with additional isolated
      PDZ domains do not make every partner a demonstrated physiological core complex.
    molecular_function:
      id: GO:0030165
      label: PDZ domain binding
    directly_involved_in:
    - id: GO:0051835
      label: positive regulation of synapse structural plasticity
    locations:
    - id: GO:0043197
      label: dendritic spine
    supported_by:
    - reference_id: PMID:19118189
    - reference_id: PMID:24550280
    - reference_id: PMID:30126976
    - reference_id: PMID:36115835
  - description: Binds phosphatidylinositol-4,5-bisphosphate through the FERM region, contributing a membrane-interaction
      component to spine targeting together with the protein-binding modules. The direct assay uses a
      human recombinant fragment; the cellular targeting experiments use human constructs in rodent neurons.
    molecular_function:
      id: GO:0005546
      label: phosphatidylinositol-4,5-bisphosphate binding
    locations:
    - id: GO:0043197
      label: dendritic spine
    supported_by:
    - reference_id: PMID:19118189
  suggested_questions:
  - question: Which domain–motif interactions measured with purified fragments assemble into endogenous
      FRMPD4 complexes in human neurons, and which are restricted by localization, abundance or competing
      partners?
  - question: How do the PIP2-binding FERM region, internal PDZ module and C-terminal PDZ-binding motif
      cooperate to control spine targeting and structural plasticity?
  - question: How does endogenous human FRMPD4 organize Homer and metabotropic glutamate receptor signaling,
      and how closely does that mechanism follow the rat and mouse Preso1 experiments?
  - question: For pathogenic truncations, how much of the neuronal phenotype reflects loss of transcript
      or protein versus effects of a stable truncated product?
  suggested_experiments:
  - description: Use endogenous tagging and reciprocal complex recovery in human neuronal models to test
      selected contacts with domain-specific rescue constructs; measure spine localization and density
      alongside protein abundance.
  - description: Perturb the lipid-binding region and terminal PDZ-binding motif separately and together,
      with controlled expression and membrane-localization measurements, to separate independent and cooperative
      contributions.
  - description: Measure endogenous FRMPD4, Homer and receptor association together with receptor phosphorylation
      in human neurons, using kinase and binding-site controls; do not infer that FRMPD4 catalyzes phosphorylation.
  - description: Compare patient-derived transcript stability and endogenous protein abundance with sequence-verified
      rescue in neuronal models before interpreting overexpressed truncation phenotypes.
  natural_products: []
  natural_product_scope: The official current record supplies one 1322-residue canonical sequence and
    no alternative-products declaration. Rodent bands and experimental truncations are not promoted to
    natural human isoforms.
  source_followup_questions:
  - Clarify how the PMID:36115835 quantitative import produced kd:1.0x10(molar) and negative=false for
    original below-threshold measurements, while retaining all 22 unresolved curated contexts.
  - Resolve any additional supporting measurements for the 22 source-specific unresolved partners without
    treating present curated records or author composite zero as physical affinity or evidence of absence.
  - Recover exact original clone identity for the Homer1c reagent and complete supplementary details where
    selected original text did not establish them.
  new_annotations: 0
  new_quotes: 0
