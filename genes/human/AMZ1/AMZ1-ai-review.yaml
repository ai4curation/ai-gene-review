  label: Homo sapiens
description: AMZ1 (archaemetzincin-1) is a member of the archaemetzincin family (peptidase M54) within
  the metzincin superfamily. Family members occur in archaea and vertebrates. AMZ1 has the family's four
  conserved cysteines, but its catalytic motif has asparagine in place of the third zinc-binding histidine.
  A 2005 report that recombinant AMZ1 cleaves peptides was later withdrawn, so whether AMZ1 is an active
  protease is unknown. Its substrates, cellular location and biological role are also uncharacterized.
