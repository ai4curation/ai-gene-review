description: AMZ1 (archaemetzincin-1) is a zinc metalloprotease, the founding human member of the archaemetzincin
  family within the metzincin superfamily. The family is named for its close relatives in archaea; it
  is widespread in archaea and vertebrates but absent from many model organisms. AMZ1's catalytic domain
  has a HEXXHXXG zinc-binding motif with the metzincin methionine and four distinctive cysteines. The
  purified recombinant enzyme hydrolyzes synthetic substrates and bioactive peptides, and metalloprotease
  inhibitors block it. It is expressed mainly in liver and heart. Its physiological substrates, cellular
  location and biological role are unknown.
