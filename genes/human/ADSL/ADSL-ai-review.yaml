  review:
    summary: The hypoxia-response transfer traces to rat renal purine nucleotide-cycle experiments.
    action: UNDECIDED
    reason: The rat donor study PMID:8887278 assays cortical and medullary cytosol under simulated
      low oxygen conditions. Its cached abstract reports increased AMP deamination in both
      compartments and decreased IMP reamination in cortex; ADSL activity exceeds adenylosuccinate
      synthetase activity severalfold, and the authors identify synthetase activity and AMP supply
      as the main limits on cycle activity. These findings specify the measured pathway response
      but do not establish that the non-limiting ADSL step is unregulated. Full experiments remain
      unavailable to resolve the ADSL-specific response and its conservation. Human
      hypoxia-dependent purinosome organization (PMID:32439803) and ADSL-dependent fumarate/STING
      effects (PMID:40033100) occur in distinct contexts and do not establish the exact rat
      transfer. Retain the unresolved judgment.
