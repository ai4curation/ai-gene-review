  review:
    summary: ADSL activity is nutritionally regulated in rat liver and spleen during starvation and
      refeeding.
    action: KEEP_AS_NON_CORE
    reason: The cached abstract of PMID:690130 reports loss of hepatic and splenic
      adenylosuccinase activity during prolonged rat starvation and restoration of liver activity
