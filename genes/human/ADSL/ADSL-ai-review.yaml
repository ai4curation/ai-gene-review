- term:
    id: GO:0009060
    label: aerobic respiration
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  review:
    summary: Purine-cycle support of respiratory substrates does not establish that ADSL executes
      aerobic respiration.
    action: MARK_AS_OVER_ANNOTATED
    reason: The traced rat donor study PMID:3777158 reports impaired muscle energetics after
      AICAriboside and interprets the purine nucleotide cycle as an anaplerotic supplier of
      citric-acid-cycle intermediates. That metabolic connection is credible. GO:0009060, however,
      denotes energy release coupled to oxygen as terminal electron acceptor, under cellular
      respiration and energy derivation by oxidation. ADSL cleaves adenylosuccinate to AMP and
      fumarate in purine metabolism; the supplied fumarate is subsequently used by respiratory
      enzymes. The source does not place the ADSL purine-cycle reaction within the oxygen-coupled
      respiratory pathway, rather than supplying intermediates to it. A bona fide pathway
      participant need not itself catalyze a redox reaction; the distinction here is pathway role,
      not reaction chemistry alone. Mark the transferred involved_in assertion as over-annotated,
      without denying the rat energetic phenotype or claiming that the pharmacological study is
      false. Full source controls remain unavailable, and no replacement regulation term is
      manufactured.
    supported_by:
    - reference_id: PMID:3777158
      supporting_text: The results of this study indicate that disruption of the purine nucleotide
        cycle at the level of the synthetase and lyase reactions is associated with skeletal
        muscle dysfunction, and suggest that the cycle plays an anapleurotic role in providing
        citric acid cycle intermediates that enhance aerobic energy production in contracting
        skeletal muscle.
    additional_reference_ids:
    - PMID:3777158
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      source_entities:
      - source_id: UniProtKB:A0A8I5ZTN5
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: Rat Adsl/RGD:1307617 traces to PMID:3777158. Its reported anaplerotic contribution
          supports a metabolic connection, but does not place the purine-cycle lyase reaction within
          the respiratory pathway that consumes its products.
      - source_id: ensembl:ENSRNOP00000081561
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: Rat Adsl/RGD:1307617 traces to PMID:3777158. Its reported anaplerotic contribution
          supports a metabolic connection, but does not place the purine-cycle lyase reaction within
          the respiratory pathway that consumes its products.
      failure_modes:
      - ROLE_CONFLATION
