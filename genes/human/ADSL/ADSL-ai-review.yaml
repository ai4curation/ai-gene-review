id: P30566
gene_symbol: ADSL
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Adenylosuccinate lyase (ADSL; adenylosuccinase; EC 4.3.2.2) is a cytosolic homotetramer
  that catalyses two fumarate-releasing beta-elimination reactions in purine metabolism. It converts
  SAICAR to AICAR in the shared pathway that produces IMP and supplies both adenine and guanine
  nucleotides. It also converts adenylosuccinate to AMP in the IMP-to-AMP branch, including
  nucleotide recycling through the purine nucleotide cycle. The two substrates use the same
  active-site region, with residues from three subunits contributing to each of four active sites.
  ADSL can associate with other de novo purine synthesis enzymes in the purinosome. Biallelic
  loss-of-function variants cause adenylosuccinate lyase deficiency, a neurodevelopmental disorder
  with developmental delay, intellectual disability, epilepsy and variable autistic features,
  accompanied by accumulation of SAICA-riboside and succinyladenosine in body fluids.
