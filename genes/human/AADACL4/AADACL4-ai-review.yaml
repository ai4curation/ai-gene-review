- term:
    id: GO:0016020
    label: membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0162
  - InterPro:IPR017157
  - ARBA:ARBA00028763
  review:
    summary: >-
      The same conclusion as the IBA row, reached from AADACL4's own predicted topology
      rather than from donor localisation. Kept, with the caveat that its basis is the softer
      of the two and that the closest paralogs do not share the feature call.
    action: ACCEPT
    reason: >-
      This row traces to the UniProt subcellular-location line, which is an ECO:0000305
      curator inference over an ECO:0000255 TRANSMEM prediction; SL-0162, ARBA00028763 and
      IPR017157 are the controlled-vocabulary, automatic-annotation and family handles for
      that same statement. The conclusion agrees with the independently derived IBA row and
      with the family, so it is retained. What is worth recording is how soft the underlying
      feature call is: among paralogs that share the catalytic register exactly, UniProt
      calls a signal anchor for AADACL4, a cleaved signal peptide for AADACL2 (which is
      consequently annotated Secreted), and nothing at all for AADACL3 despite a comparably
      hydrophobic N-terminal segment. All of those are sequence-analysis predictions, and
      mean hydropathy cannot discriminate a cleaved signal peptide from an uncleaved type II
      anchor, so no attempt was made to overturn the call from sequence alone. The two
      membrane rows are only partly independent: the IBA leans on experimentally localised
      donors, whereas this row leans on AADACL4's own topology prediction plus family
      similarity. So they are not simply duplicates, but neither contributes experimental
      evidence for AADACL4 itself, and this is the weaker of the two.
    supported_by:
    - reference_id: file:human/AADACL4/AADACL4-uniprot.txt
      supporting_text: "SUBCELLULAR LOCATION: Membrane {ECO:0000305}; Single-pass type II"
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: UniProtKB-SubCell:SL-0162
        source_label: UniProt subcellular location - Membrane
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: >-
          Encodes an ECO:0000305 curator inference over an ECO:0000255 topology prediction;
          no experimental localisation exists for AADACL4.
      - source_id: InterPro:IPR017157
        source_label: Arylacetamide deacetylase family signature
        source_status: SUPPORTS_TRANSFER
        comment: >-
          The subfamily is membrane-anchored or secreted throughout, which is consistent
          with membrane but does not by itself pick a compartment.
