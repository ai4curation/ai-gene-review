      Accept, and accept it at this general level. The donors are the AADAC/NCEH1 clade, all
      single-pass type II membrane proteins, but they disagree about which membrane, so
      membrane is the correct call rather than a lapse into an over-general parent.
    action: ACCEPT
    reason: >-
      This is the narrower of the two PANTHER nodes used for AADACL4: PTN009058713 is
      supported by mouse Aadac (Q99PG0), mouse Nceh1 (Q8BLF1) and human AADAC (P22760), all
