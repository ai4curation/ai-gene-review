- id: file:human/AADACL4/AADACL4-uniprot.txt
  title: UniProtKB entry Q5VUY2 (ADCL4_HUMAN), Arylacetamide deacetylase-like 4
  findings:
  - statement: >-
      UniProt assigns AADACL4 to the GDXG lipolytic enzyme family by curator inference.
    supporting_text: Belongs to the 'GDXG' lipolytic enzyme family.
  - statement: >-
      The membrane localisation is a curator inference over a predicted N-terminal signal
      anchor, with no experimental support.
    supporting_text: "SUBCELLULAR LOCATION: Membrane {ECO:0000305}; Single-pass type II"
  - statement: >-
      The single transmembrane segment is annotated as a signal anchor for a type II
      membrane protein, placing the catalytic domain on the lumenal or extracellular face.
    supporting_text: "Helical; Signal-anchor for type II membrane protein"
  - statement: >-
      UniProt records no protein-level detection for AADACL4; the entry is inferred from
      homology.
    supporting_text: "PE   3: Inferred from homology;"
  - statement: AADACL4 is classified as a dark target with no chemical or functional probes.
    supporting_text: Pharos; Q5VUY2; Tdark.
  - statement: >-
      Transcript expression is described as choroid-enhanced, with broad low-level
      expression across many tissues.
    supporting_text: HPA; ENSG00000204518; Tissue enhanced (choroid).
  - statement: >-
      The PAN-GO human reference-genome effort contributes no evolutionary-model annotations
      to this entry, in contrast to the two GO_Central IBA rows in GOA.
    supporting_text: PAN-GO; Q5VUY2; 0 GO annotations based on evolutionary models.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The primary source for the family assignment, the feature table and the evidence codes
      behind the membrane annotations. Every quote above was checked against a single
      physical line of the cached file.
- id: file:human/AADACL4/AADACL4-bioinformatics/RESULTS.md
  title: Is human AADACL4 a catalytically competent GDXG hydrolase?
  findings:
  - statement: >-
      The three UniProt-annotated active-site positions of AADACL4 are genuinely serine,
      aspartate and histidine, so the catalytic triad is present rather than merely
      inherited as an annotation.
    supporting_text: "Triad residues in sequence order: **SDH**"
  - statement: >-
      The nucleophilic serine lies in a canonical G-x-S-x-G elbow, as required for an active
      alpha/beta-hydrolase.
    supporting_text: "Nucleophile elbow pentapeptide around Ser193: `GESVG`"
  - statement: The GDXG oxyanion-hole motif is present upstream of the nucleophile.
    supporting_text: "Residues 119-121: `HGG` (the GDXG oxyanion-hole motif)"
  - statement: >-
      The donors of the membrane IBA row do not agree on a specific compartment, which is
      why the general membrane term is the correct level for AADACL4.
    supporting_text: "Distinct specific locations across the donors: **4**"
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Analysis written for this review. Every sequence, feature and comment is fetched from
      the UniProt REST API at run time and the report is regenerated by the script, so a fresh
      run reproduces the committed file; no value is hard-coded. The script also verifies each
      non-PANTHER WITH/FROM resolution against the resolved entry's own UniProt
      cross-references and aborts on a mismatch, so the donor identities in this review are
      checked rather than asserted.
