- id: PMID:21696217
  title: The metabolic serine hydrolases and their functions in mammalian physiology
    and disease.
  findings:
  - statement: >-
      AADACL4 is grouped with AADAC and AADACL2 among the metabolic serine hydrolases that
      are too poorly characterised to predict a substrate, and is described as completely
      unannotated.
    supporting_text: >-
      AADAC is highly homologous to several related lipases, AADACL1, 2, and 4, the latter
      two of which remain completely unannotated.
  - statement: >-
      No candidate substrate, selective inhibitor or knockout mouse had been described for
      AADACL4 or its closest relatives.
    supporting_text: >-
      Candidate endogenous substrates, selective inhibitors, or knockout mice have not, to
      our knowledge, been described for AADAC or the related enzymes AADACL2 and AADACL4.
  - statement: >-
      The founding family member AADAC is a membrane-associated hydrolase acting on
      arylacetamide xenobiotics, which frames the substrate classes worth testing for
      AADACL4.
    supporting_text: >-
      AADAC is a 45 kDa membrane-associated hydrolase highly expressed in the human liver
      that has been implicated in the hydrolysis of arylacetamide xenobiotics including
      flutamide and phenacetin.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      A review, not a primary study of AADACL4, and it mentions the gene only within a
      section on poorly characterised hydrolases - hence MEDIUM rather than HIGH. It is
      nonetheless the only publication located that discusses AADACL4 as a gene rather than
      as a row in a genomics table, and it is the authoritative statement that no functional
      characterisation existed. Verified from the cached PMC full text; the AADACL1 in the
      quoted sentence is NCEH1/KIAA1363.
