  - MGI:MGI:2443191
  review:
    summary: >-
      Accept, and accept it at this general level. The donors are the AADAC/NCEH1 clade, all
      single-pass type II membrane proteins, but they disagree about which membrane, so
      membrane is the correct call rather than a lapse into an over-general parent.
    action: ACCEPT
    reason: >-
      This is the narrower of the two PANTHER nodes used for AADACL4: PTN009058713 is
      supported by mouse Aadac (Q99PG0), mouse Nceh1 (Q8BLF1) and human AADAC (P22760), all
      of which are UniProt single-pass type II membrane proteins detected at protein level,
      and AADACL4 carries an equivalent predicted N-terminal signal anchor (its own
      TRANSMEM 5-25) with its catalytic domain and both predicted N-glycosylation sites on
      the far side. The
      is_active_in qualifier is appropriate for a membrane-anchored enzyme. The term should
      not be refined: the donors resolve to four distinct specific locations - endoplasmic
      reticulum membrane and microsome membrane for the two Aadac orthologues, cell membrane
      and microsome for Nceh1 - so choosing endoplasmic reticulum membrane or plasma
      membrane for AADACL4 would mean picking one donor over the other with no AADACL4 data
      to justify it.
