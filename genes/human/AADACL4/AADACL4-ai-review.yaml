      source_entities:
      - source_id: InterPro:IPR013094
        source_label: AB_hydrolase_3 domain
        source_status: CIRCULAR_OR_REDUNDANT
        comment: >-
          A pan-family fold signature whose GO mapping is necessarily the general hydrolase
          parent; adds no information beyond the IPR017157-derived GO:0052689 row on the
