id: Q5VUY2
gene_symbol: AADACL4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  AADACL4 is a 407-residue member of the 'GDXG' lipolytic enzyme family and one of five
  human arylacetamide deacetylase-related proteins: AADAC, NCEH1/AADACL1 and AADACL2 lie on
  chromosome 3, while AADACL3 and AADACL4 sit adjacent to one another at 1p36.21 and are the
  closest pair, sharing both length and catalytic-residue register. It has the
  alpha/beta-hydrolase fold-3 architecture of the family with an intact Ser-Asp-His
  catalytic triad (Ser193 in a GESVG nucleophile
  elbow, Asp347, His377) and the HGG oxyanion-hole motif that stabilises the acyl-enzyme
  intermediate, so it is predicted to be a functional carboxylic ester hydrolase rather
  than a catalytically dead fold relative. A hydrophobic N-terminal segment is predicted to
  act as a signal anchor that places the catalytic domain, together with two predicted
  N-glycosylation sites, on the lumenal or extracellular face of a membrane; the
  characterised relatives sit in the endoplasmic reticulum membrane (AADAC) or the plasma
  membrane (NCEH1), while AADACL2 is secreted, so which membrane AADACL4 occupies is not
  established. No substrate, inhibitor, knockout phenotype or biochemical assay has been
  reported for the protein, and UniProt records it as inferred from homology rather than
  detected. Transcript expression is described as enhanced in choroid, with broader
  low-level expression across tissues including omental fat.
