  review:
    summary: >-
      Correct but uninformative. The donor PANTHER node is functionally heterogeneous, so
      hydrolase activity is the right last-common-ancestor call there, but AADACL4's own
      subfamily signature supports the specific ester-hydrolase term already asserted on
      this protein.
    action: MODIFY
    reason: >-
      All 17 WITH/FROM tokens were resolved. The node (PTN009058710) reaches back past the
      plant/fungal/bacterial split and mixes nine ester hydrolases with two arylformamidases
      that cleave an amide bond (mouse Afmid Q8K4H1 and yeast BNA7 Q04066, EC 3.5.1.9) and a
      2-hydroxyisoflavanone dehydratase also classified as a lyase (soybean HIDH Q5NUF3,
      EC 4.2.1.105), whose annotated nucleophile is a threonine rather than a serine. At
      that depth the general hydrolase parent is the correct inference and not an error. For
      AADACL4 specifically, however, the narrower arylacetamide-deacetylase signature
      (InterPro IPR017157, PIRSF037251) applies, and the catalytic machinery it implies is
      demonstrably intact: the annotated Ser193, Asp347 and His377 really are Ser, Asp and
      His, the nucleophile sits in a canonical GESVG elbow, the HGG oxyanion-hole motif is
      present at 119-121, and all seven AADAC-family relatives project their own annotated
      triads onto exactly those three residues. So the appropriate term for this protein is
      GO:0052689, which is already asserted on it from IPR017157; this row adds only a
      redundant ancestor. This is a granularity call, not a correction - nothing here is
      biologically wrong, and the replacement term is a statement about what AADACL4's
      annotation set should contain rather than a claim that PTN009058710 could itself
      support the child term; the specific term has to come from the subfamily signature or
      from a deeper node. Neither GO:0016787 nor GO:0016020 is in gocheck_do_not_annotate
      (both are usage Unrestricted), so this rests on redundancy and informativeness, not on
      a rule violation.
