- term:
    id: GO:0052689
    label: carboxylic ester hydrolase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR017157
  review:
    summary: >-
      The best-supported statement about AADACL4 and the one molecular-function term worth
      keeping. The subfamily signature is backed by a demonstrably complete GDXG catalytic
      apparatus, though no substrate has ever been tested.
    action: ACCEPT
    reason: >-
      IPR017157 is the arylacetamide-deacetylase family signature rather than a generic
      fold, and the activity it implies was checked against the sequence rather than taken
      on trust. AADACL4's UniProt active-site positions 193, 347 and 377 are genuinely Ser,
      Asp and His; Ser193 lies in a canonical GESVG nucleophile elbow; the HGG oxyanion-hole
      motif is present at 119-121; and the annotated triads of all seven AADAC-family
      relatives - AADACL3, AADACL2, human, rat and mouse AADAC, human and mouse NCEH1 -
      project onto exactly those three AADACL4 residues by global alignment with matching
      residue identity. This rules out the fold-retaining pseudoenzyme reading, so the
      annotation is a statement about an intact active site rather than a domain name
      transcribed into an activity. It remains an unverified homology inference: no
      substrate, inhibitor or activity assay has been reported, which is why the term is
      kept at this substrate-agnostic level and no child term is proposed.
    supported_by:
    - reference_id: file:human/AADACL4/AADACL4-bioinformatics/RESULTS.md
      supporting_text: "Triad residues in sequence order: **SDH**"
    - reference_id: file:human/AADACL4/AADACL4-uniprot.txt
      supporting_text: "Belongs to the 'GDXG' lipolytic enzyme family."
    - reference_id: PMID:21696217
      supporting_text: >-
        Candidate endogenous substrates, selective inhibitors, or knockout mice have not, to
        our knowledge, been described for AADAC or the related enzymes AADACL2 and AADACL4.
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: InterPro:IPR017157
        source_label: Arylacetamide deacetylase family signature
        source_status: SUPPORTS_TRANSFER
        comment: >-
          Subfamily-level rather than fold-level, and independently corroborated by the
          intact Ser193-Asp347-His377 triad and HGG oxyanion hole.
core_functions:
- description: >-
    Predicted carboxylic ester hydrolase of the GDXG lipolytic enzyme family, anchored in a
    membrane by an N-terminal signal anchor with its catalytic domain on the lumenal or
    extracellular face. The catalytic apparatus - Ser193 in a GESVG nucleophile elbow,
    Asp347, His377, and the HGG oxyanion hole - is complete and in register with the
    characterised family members AADAC and NCEH1, so hydrolysis of carboxylic esters is the
    well-founded inference. This remains homology-grade: no substrate, product, inhibitor or
    assay has been reported for AADACL4, and no compartment more specific than membrane is
    supported, because the closest characterised relatives sit in different membranes.
  molecular_function:
    id: GO:0052689
    label: carboxylic ester hydrolase activity
  locations:
  - id: GO:0016020
    label: membrane
  supported_by:
  - reference_id: file:human/AADACL4/AADACL4-bioinformatics/RESULTS.md
    supporting_text: "Triad residues in sequence order: **SDH**"
  - reference_id: file:human/AADACL4/AADACL4-uniprot.txt
    supporting_text: "Belongs to the 'GDXG' lipolytic enzyme family."
knowledge_gaps:
- gap_statement: >-
    No substrate is known for AADACL4 - neither a physiological acyl donor nor an in vitro
    surrogate ester has been tested - so the activity cannot be refined below the
    substrate-agnostic parent term.
  boundary: >-
    What is firmly established is the catalytic apparatus itself: Ser193 in a GESVG
    nucleophile elbow, Asp347, His377 and an HGG oxyanion hole, in register with the
    annotated triads of all seven AADAC-family relatives. The gap is about specificity, not
    about whether the protein can catalyse anything.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: >-
    The family spans very different chemistries - arylacetamide xenobiotics and
    triacylglycerol for AADAC, cholesteryl esters and 2-acetyl monoalkylglycerol ether for
    NCEH1 - so without a substrate the annotation cannot say which of those biologies, if
    any, AADACL4 participates in.
  resolution: >-
    A graded in vitro substrate panel against the purified lumenal domain, with S193A,
    D347A and H377A controls, plus activity-based profiling with a fluorophosphonate probe
    to confirm the nucleophile is used at all.
  provenance:
  - reference_id: PMID:21696217
    supporting_text: >-
      Candidate endogenous substrates, selective inhibitors, or knockout mice have not, to
      our knowledge, been described for AADAC or the related enzymes AADACL2 and AADACL4.
  - reference_id: file:human/AADACL4/AADACL4-bioinformatics/RESULTS.md
    supporting_text: "Triad residues in sequence order: **SDH**"
- gap_statement: >-
    Which membrane AADACL4 occupies, and whether its N-terminal hydrophobic segment is an
    uncleaved type II signal anchor at all rather than a cleaved signal peptide, are both
    undetermined.
  boundary: >-
    The segment itself is real and strongly hydrophobic, and every characterised member of
    the subfamily is either membrane-anchored or secreted, so an association with the
    secretory pathway is not in doubt. What is undetermined is the topology and the
    compartment.
  gap_kind:
  - BIOLOGY
  - CURATION
  dark_aspect: CC_DARK
  status: OPEN
  significance: >-
    An endoplasmic reticulum enzyme, a cell-surface enzyme and a secreted enzyme act on
    different substrate pools, so the compartment is a prerequisite for interpreting any
    activity that is found. The curation component is separable and actionable: UniProt
    makes three different N-terminal calls across AADACL4, AADACL2 and AADACL3 despite
    identical catalytic registers, all from sequence analysis alone.
  resolution: >-
    Protease-protection and selective-permeabilisation topology assays, together with
    glycan-occupancy tests at the two predicted N-glycosylation sites, which are only
    accessible to a lumenal or extracellular domain; plus co-staining against endoplasmic
    reticulum and plasma-membrane markers.
  provenance:
  - reference_id: file:human/AADACL4/AADACL4-uniprot.txt
    supporting_text: "SUBCELLULAR LOCATION: Membrane {ECO:0000305}; Single-pass type II"
  - reference_id: file:human/AADACL4/AADACL4-bioinformatics/RESULTS.md
    supporting_text: "Distinct specific locations across the donors: **4**"
- gap_statement: >-
    No biological process is known for AADACL4, and it has no protein-level detection: there
    is no cell or tissue in which the protein has been shown to be present, no loss-of-
    function phenotype, and no pathway assignment.
  boundary: >-
    Transcript-level expression is documented, with choroid enhancement and broad low-level
    expression, and the gene is protein-coding with a MANE-Select transcript and a CCDS
    entry. So the gap is not about whether the locus is expressed but about whether and
    where the protein acts.
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  status: OPEN
  significance: >-
    GOA carries no biological-process annotation for AADACL4 at all, and that absence is
    correct rather than an oversight; a process term will only become available once the
    protein is detected somewhere and a substrate pool is identified.
  resolution: >-
    Targeted proteomic or immunohistochemical detection in the tissues with the highest
    transcript signal, followed by knockout lipidomics with a catalytically dead knock-in
    control.
  provenance:
  - reference_id: file:human/AADACL4/AADACL4-uniprot.txt
    supporting_text: "PE   3: Inferred from homology;"
  - reference_id: file:human/AADACL4/AADACL4-uniprot.txt
    supporting_text: Pharos; Q5VUY2; Tdark.
suggested_questions:
- question: >-
    Is the AADACL4 protein expressed at all in human tissue, and if so where? UniProt
    classifies it as inferred from homology and Pharos as Tdark, yet the transcript is
    reported as choroid-enhanced with broad low-level expression, so a targeted proteomic or
    immunohistochemical detection would be the first thing worth doing.
  experts: []
- question: >-
    Is the AADACL4 N-terminal hydrophobic segment an uncleaved type II signal anchor or a
    cleaved signal peptide? UniProt makes three different calls across three paralogs that
    share the catalytic register exactly - signal anchor for AADACL4, cleaved signal peptide
    plus Secreted for AADACL2, and no feature at all for AADACL3 despite a comparably
    hydrophobic segment - and all of them are ECO:0000255 predictions. The AADACL3 gap in
    particular looks like a UniProt annotation inconsistency worth reporting upstream.
  experts: []
- question: >-
    Which membrane does AADACL4 occupy? The phylogenetic annotation's own donors split
    between the endoplasmic reticulum membrane (AADAC orthologues) and the plasma membrane
    (NCEH1), which is why the annotation stops at membrane.
  experts: []
- question: >-
    Why does UniProt cross-reference PAN-GO as contributing zero evolutionary-model
    annotations for Q5VUY2 while GOA carries two GO_Central IBA rows for the same protein?
    Clarifying whether the human PAN-GO effort deliberately declined to annotate AADACL4
    would say how much weight the IBA rows should carry.
  experts: []
- question: >-
    Chicken AADACL4B is upregulated during keratinocyte differentiation and enriched in
    interscale epidermis, and the secreted human paralog AADACL2 is skin-enriched. Is the
    avian gene a true orthologue of human AADACL4 or a bird-specific duplicate, and is there
    a shared role for this subfamily in epidermal lipid ester turnover?
  experts:
  - Lachner J
- question: >-
    Does AADACL4 carry any activity toward arylacetamide xenobiotics, given that the
    family's founder AADAC deacetylates flutamide and phenacetin? A negative result would be
    as useful as a positive one for scoping the family's pharmacological relevance.
  experts:
  - Long JZ
  - Cravatt BF
suggested_experiments:
- hypothesis: >-
    AADACL4 is a catalytically active serine hydrolase, so its Ser193 nucleophile should be
    labelled by an active-site-directed fluorophosphonate probe in a tissue that expresses
    it, and the S193A mutant should not be.
  description: >-
    Apply activity-based protein profiling with a fluorophosphonate probe to lysates from
    choroid or adipose tissue and to cells overexpressing tagged wild-type AADACL4 and an
    S193A mutant, then identify labelled species by mass spectrometry. This platform already
    labels the large majority of mammalian metabolic serine hydrolases, so a failure to
    label wild-type AADACL4 would itself be informative about whether the intact triad is
    used.
  experiment_type: activity-based protein profiling
- hypothesis: >-
    AADACL4 hydrolyses carboxylic esters, with a substrate preference that can be placed
    relative to AADAC (arylacetamide xenobiotics, triacylglycerol) and NCEH1 (cholesteryl
    esters, 2-acetyl monoalkylglycerol ether).
  description: >-
    Express and purify the lumenal domain and assay it against a graded panel:
    para-nitrophenyl esters of increasing acyl chain length, tributyrin and triolein,
    cholesteryl oleate, 1-O-hexadecyl-2-acetyl-sn-glycerol, and the arylacetamide drugs
    flutamide and phenacetin. Run the S193A, D347A and H377A mutants in parallel so that any
    activity observed is attributable to the triad rather than to a contaminating esterase.
  experiment_type: in vitro enzyme assay
- hypothesis: >-
    AADACL4 is a type II single-pass membrane protein whose catalytic domain faces the lumen
    or the extracellular space, in which case Asn168 and Asn269 should be N-glycosylated.
  description: >-
    Express epitope-tagged AADACL4 with tags at each terminus and test topology by
    protease-protection of sealed microsomes and by selective permeabilisation
    immunofluorescence. In parallel test glycan occupancy at the two predicted sites by
    PNGase F sensitivity and by N168Q/N269Q substitution, since glycosylation is only
    available to a lumenal or extracellular domain. This distinguishes the signal-anchor and
    cleaved-signal-peptide readings that UniProt applies inconsistently across the paralogs,
    and pairs with co-staining for endoplasmic reticulum and plasma-membrane markers to
    settle which membrane.
  experiment_type: membrane topology and glycosylation mapping
- hypothesis: >-
    Loss of AADACL4 perturbs a lipid ester pool in the tissue where it is expressed.
  description: >-
    Knock out AADACL4 in a model expressing it - guided first by a protein-level detection
    experiment, since the transcript-level choroid enrichment is the only current lead - and
    profile neutral lipids, ether lipids and cholesteryl esters by untargeted lipidomics
    against wild type, using an S193A knock-in as a catalytically dead control to separate
    scaffolding from catalytic contributions.
  experiment_type: knockout lipidomics
