- id: file:human/AADACL4/AADACL4-bioinformatics/RESULTS.md
  title: Is human AADACL4 a catalytically competent GDXG hydrolase?
  findings:
  - statement: >-
      The three UniProt-annotated active-site positions of AADACL4 are genuinely serine,
      aspartate and histidine, so the catalytic triad is present rather than merely
      inherited as an annotation.
    supporting_text: "Triad residues in sequence order: **SDH**"
  - statement: >-
      The nucleophilic serine lies in a canonical G-x-S-x-G elbow, as required for an active
      alpha/beta-hydrolase.
    supporting_text: "Nucleophile elbow pentapeptide around Ser193: `GESVG`"
  - statement: The GDXG oxyanion-hole motif is present upstream of the nucleophile.
    supporting_text: "Residues 119-121: `HGG` (the GDXG oxyanion-hole motif)"
  - statement: >-
      The donors of the membrane IBA row do not agree on a specific compartment, which is
      why the general membrane term is the correct level for AADACL4.
    supporting_text: "Distinct specific locations across the donors: **4**"
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Analysis written for this review. Every sequence, feature and comment is fetched from
      the UniProt REST API at run time and the report is regenerated by the script, so a fresh
      run reproduces the committed file; no value is hard-coded. The script also verifies each
      non-PANTHER WITH/FROM resolution against the resolved entry's own UniProt
      cross-references and aborts on a mismatch, so the donor identities in this review are
      checked rather than asserted, and it derives the alignment-reliability cut from the
      computed percent identity rather than from a hand-labelled set, aborting if any panel
      member lands within 0.75 points of the threshold.
- id: file:human/AADACL2/AADACL2-bioinformatics/NODE_PTN009058710.md
  title: >-
    PANTHER node PTN009058710: which GO term is true of every donor? (shared node-level audit
    for AADACL2, AADACL3 and AADACL4)
  findings:
  - statement: >-
      No candidate term below GO:0016787 survives every donor of PTN009058710, so the generic
      term PAINT chose is the exact least common ancestor of the donor set rather than an
      under-specific approximation to it.
    supporting_text: >-
      No donor refutes `GO:0016787`, and every more specific candidate is refuted by at least
      one donor.
  - statement: >-
      The two more specific candidates fail on different axes: the two kynurenine formamidases
      put GO:0052689 out of reach, and soybean HIDH's threonine nucleophile puts GO:0017171
      out of reach.
    supporting_text: "GO:0052689 carboxylic ester hydrolase activity: TRUE 14, FALSE 2, UNDETERMINED 0"
  - statement: >-
      Soybean HIDH is bifunctional rather than a pure lyase, holding an IDA carboxylesterase
      annotation as well as its dehydratase activity, so it does not threaten the hydrolase
      parent at all.
    supporting_text: >-
      So HIDH is a genuine, if physiologically minor, carboxylic-ester hydrolase; it refutes
      the *serine* term only.
  - statement: >-
      The mechanism term is true of every donor PAINT cites at the family node PTN009058713 and
      held by IDA in all three of them, which is where it should be placed instead of at the deep
      node.
    supporting_text: "all three carry `GO:0017171` by IDA"
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Node-level audit shared by the three paralogs that carry this identical row, kept in the
      AADACL2 bioinformatics folder and reproducible with audit_node_PTN009058710.py there.
      The WITH/FROM sets are read from the committed GOA TSVs and, independently, fetched per
      accession from QuickGO for all three paralogs, with the two sources cross-checked and a gene
      covered by neither treated as a hard error; every
      donor's chemistry, nucleophile and GO ancestry is fetched at run time, and the mechanism
      verdict comes with a sensitivity analysis over the positional nucleophile rule. It corrects one premise this review had relied on: soybean HIDH is a bifunctional
      dehydratase/carboxylesterase, not a non-hydrolase, so it refutes only the serine
      mechanism term and not the hydrolase parent.
