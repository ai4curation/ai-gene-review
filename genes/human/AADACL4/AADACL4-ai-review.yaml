- term:
    id: GO:0016787
    label: hydrolase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR013094
  review:
    summary: >-
      Redundant general parent, and correctly scoped for its own signature. IPR013094 is the
      generic Abhydrolase_3 domain, which can only be mapped to hydrolase activity, while the
      same protein also matches the subfamily-specific IPR017157 that yields the informative
      term.
    action: MODIFY
    reason: >-
      InterPro2GO maps IPR013094 (alpha/beta hydrolase fold-3 domain) to GO:0016787 because
      that domain occurs in enzymes with different bond specificities; the mapping is
      correct for the domain and redundant for the protein. AADACL4 also matches
      IPR017157 (arylacetamide deacetylase) and PIRSF037251, which support the ester-bond
      specialisation, and its catalytic triad and oxyanion hole are intact, so GO:0052689 -
      already present on this protein from IPR017157 - is the term the evidence supports. As
      with the IBA hydrolase row, this is a granularity replacement, not a claim that the
      annotation is wrong - and specifically not a recommendation to change the
      IPR013094-to-GO:0016787 InterPro2GO mapping itself. That domain genuinely does occur in
      amidases as well as esterases, and in soybean HIDH, whose nucleophile is a threonine
      and whose physiologically important reaction is a dehydration, so the mapping is right
      for the domain and should stay. The replacement is a statement about what AADACL4's own
      annotation set should contain, where a subfamily-level signature is available too, and
      the classification matches the IBA row above: EVIDENCE_CIRCULAR_OR_REDUNDANT, with no
      failure mode, because the signature's own scope is correct and only its redundancy on
      this record is at issue: the fold genuinely spans amidases, esterases and a
      threonine-nucleophile dehydratase, so GO:0016787 is the right mapping for it.
      GRANULARITY_MISMATCH is deliberately not recorded here for the same reason as on the IBA
      row - the mode describes the biological shape of a propagation issue, and a signature whose
      own member set is heterogeneous has no granularity defect to record.
    proposed_replacement_terms:
    - id: GO:0052689
      label: carboxylic ester hydrolase activity
    supported_by:
    - reference_id: file:human/AADACL4/AADACL4-bioinformatics/RESULTS.md
      supporting_text: "Residues 119-121: `HGG` (the GDXG oxyanion-hole motif)"
    propagation_review:
