  label: Homo sapiens
description: LYPD3 (C4.4A) is a glycosylphosphatidylinositol (GPI)-anchored cell-surface glycoprotein
  of the Ly6/uPAR family, a structural homologue of the urokinase receptor (PLAUR) with two Ly6/uPAR domains
  followed by a heavily O-glycosylated Ser/Thr/Pro-rich stalk. The mature protein is displayed entirely
  on the outer face of the plasma membrane and can be released by GPI-anchor cleavage. It is expressed
  in placenta, suprabasal keratinocytes of skin and urothelium, is upregulated in migrating keratinocytes
  during wound re-epithelialization, and is overexpressed in many carcinomas and metastases. Unlike uPAR
  it does not bind urokinase; reported partners include laminins and galectin-3 (from rat studies) and
  the ER folding factors AGR2 and AGR3. Its molecular function is poorly defined, but it is thought to
  support cell-matrix interactions and cell migration.
