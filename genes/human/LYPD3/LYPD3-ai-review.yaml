core_functions:
- description: GPI-anchored cell-surface Ly6/uPAR-family glycoprotein whose ectodomain is displayed on
    the outer leaflet of the plasma membrane of keratinocytes, urothelium and carcinoma cells, where it
    is thought to mediate cell-matrix (laminin) interactions supporting cell migration. Its precise molecular
    activity remains undefined.
  locations:
  - id: GO:0009897
    label: external side of plasma membrane
  supported_by:
  - reference_id: PMID:15012588
    supporting_text: By immunohistochemistry we observed a pronounced surface staining for C4.4A in suprabasal
      keratinocytes of chronic human wounds
  - reference_id: file:human/LYPD3/LYPD3-uniprot.txt
    supporting_text: 'SUBUNIT: Binds laminin-1 and laminin-5. Interacts with LGALS3 (By similarity).'
suggested_questions:
- question: Does human LYPD3 bind laminin-332 or laminin-111 directly, and is this binding required for
    its pro-migratory effect on keratinocytes?
- question: What fraction of LYPD3 is shed from the cell surface in vivo (by GPLD1 or proteases at the
    Tyr200-Arg204 site), and does soluble LYPD3 have its own activity?
- question: Is the AGR2/AGR3 interaction a chaperone-client relationship in the ER, or does it also occur
    extracellularly?
suggested_experiments:
- description: Surface plasmon resonance or solid-phase binding of purified human LYPD3 ectodomain to
    laminin isoforms, galectin-3 and AGR2, coupled with keratinocyte scratch-wound migration assays in
    LYPD3-knockout cells rescued with wild-type or binding-deficient mutants.
- description: PI-PLC release and surface biotinylation of endogenous LYPD3 in keratinocytes to quantify
    the GPI-anchored versus shed pools.
