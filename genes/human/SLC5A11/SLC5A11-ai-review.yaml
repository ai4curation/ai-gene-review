description: Sodium/myo-inositol cotransporter 2 (SMIT2, also called SGLT6 or KST1), a multi-pass integral
  membrane protein of the sodium:solute symporter (SSF) family (SLC5/SGLT family, TC 2.A.21). It is a
  secondary active transporter that uses the inward electrochemical Na+ gradient to drive cellular uptake
  of myo-inositol, co-transporting two Na+ ions per inositol molecule (2:1 Na+:inositol stoichiometry).
  Unlike the related SMIT1 (SLC5A3), SMIT2 also transports the myo-inositol epimer D-chiro-inositol with
  similar high affinity. It resides in the plasma membrane, concentrated at the apical (brush-border)
  surface of transporting epithelia, where it mediates apical myo-inositol absorption in the intestine
  and myo-inositol/D-chiro-inositol reabsorption in the renal proximal tubule, thereby helping to set
  serum inositol levels. Transport is inhibited by phlorizin and competitively by millimolar glucose,
  and the inositol-uptake pathway is upregulated by insulin, linking SMIT2 to inositol metabolism in diabetes,
  insulin resistance and polycystic ovary syndrome. Although a member of the sodium/glucose cotransporter
  family, human SMIT2 does not transport glucose at physiological concentrations.
