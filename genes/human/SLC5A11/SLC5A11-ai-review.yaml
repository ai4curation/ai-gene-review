- term:
    id: GO:0005412
    label: D-glucose:sodium symporter activity
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q28728
  review:
    summary: By-similarity transfer of glucose symporter activity from the rabbit ortholog (Q28728); directly
      contradicted for human SMIT2 by experimental data.
    action: REMOVE
    reason: This activity was transferred by sequence similarity from rabbit SMIT2, which stereospecifically
      transports D-glucose/D-xylose. However, human SMIT2 was directly shown not to transport glucose
      or glucose analogs even at high concentration (glucose only competes, with low affinity Ki ~6.1
      mM, without being internalized). Reactome likewise notes there is no evidence for glucose transport
      by SGLT6. The glucose:sodium symporter claim is therefore demonstrably wrong for the human gene
      and should be removed, not kept as a non-core or over-annotated activity.
    supported_by:
    - reference_id: PMID:19032932
      supporting_text: human SMIT2 transfection did not enhance glucose uptake
    - reference_id: PMID:19032932
      supporting_text: SMIT2 functions as an inositol rather than as a glucose transporter
    - reference_id: Reactome:R-HSA-429571
      supporting_text: It was thought SGLT6 could transport glucose but there is no evidence for this
        so far
