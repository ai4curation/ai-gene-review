proposed_new_terms: []
suggested_questions:
- question: Does human SMIT2 warrant a dedicated GO molecular-function term for D-chiro-inositol:sodium
    symporter activity, given that it transports D-chiro-inositol with affinity comparable to myo-inositol
    and distinct from SMIT1 (which does not transport D-chiro-inositol)?
- question: Is the insulin-dependent upregulation of SMIT2-mediated inositol uptake due to transcriptional
    induction, increased surface trafficking, or direct post-translational regulation of the transporter?
suggested_experiments:
- description: Electrophysiological (two-electrode voltage clamp) and radiotracer flux assays on endogenously
    expressed human SMIT2 to confirm the 2:1 Na+:inositol stoichiometry and define relative transport
    rates and affinities for myo-inositol versus D-chiro-inositol in a human epithelial context.
- description: Surface-biotinylation and total-transporter measurements in insulin-treated cells to determine
    whether insulin increases SMIT2 inositol uptake by promoting plasma-membrane trafficking versus increasing
    intrinsic transport activity.
knowledge_gaps:
- gap_statement: 'The molecular mechanism by which insulin upregulates SMIT2-mediated inositol (DCI/MI)
    uptake is undetermined: it is unknown whether insulin acts by transcriptional induction, by promoting
    plasma-membrane trafficking of SMIT2, or by direct post-translational modulation of transporter activity.'
  boundary: It is established that human SMIT2 is a high-affinity Na+-coupled myo-inositol/D-chiro-inositol
    symporter at the apical plasma membrane and that insulin raises cellular DCI uptake ~18-fold in L6
    cells.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  significance: Reduced SMIT2 inositol transport is implicated in diabetes, insulin resistance and polycystic
    ovary syndrome, so the regulatory mechanism bears on altered inositol metabolism in these conditions.
  provenance:
  - reference_id: PMID:19032932
    supporting_text: DCI transport appears to be up regulated by insulin
