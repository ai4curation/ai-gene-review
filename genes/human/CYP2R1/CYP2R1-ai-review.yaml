id: Q6VVX0
gene_symbol: CYP2R1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'CYP2R1 (vitamin D 25-hydroxylase) is a microsomal cytochrome P450 monooxygenase, anchored on the cytoplasmic
  face of the endoplasmic reticulum membrane and expressed mainly in liver (also testis), that catalyses the first
  step of vitamin D activation: hydroxylation at C-25 of vitamin D3 (calciol) and vitamin D2 to give 25-hydroxyvitamin
  D (calcidiol), the main circulating vitamin D metabolite and the substrate of renal CYP27B1 1-alpha-hydroxylase.
  Electrons are supplied by NADPH via cytochrome P450 reductase and the heme iron activates molecular oxygen. Unlike
  many CYP2 enzymes it has a narrow, secosteroid-specific active site (crystal structure with bound vitamin D3).
  Biallelic loss-of-function variants (e.g. L99P) cause vitamin D-dependent rickets type 1B with low 25-hydroxyvitamin
  D; Cyp2r1-null mice have >50% lower serum 25-hydroxyvitamin D, showing CYP2R1 is the major but not the only 25-hydroxylase
  in vivo.'
