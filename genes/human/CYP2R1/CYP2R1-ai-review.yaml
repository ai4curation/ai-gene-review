  qualifier: enables
  review:
    summary: Vitamin D 25-hydroxylase activity is the defining catalytic activity of CYP2R1, converting vitamin
      D3/D2 to 25-hydroxyvitamin D.
    action: ACCEPT
    reason: Established by expression cloning (PMID:12867411), kinetic analysis with purified enzyme (PMID:15465040),
      the substrate-bound structure (PMID:18511070) and loss of activity in the VDDR1B L99P allele (PMID:15128933).
      Core function.
    supported_by:
    - reference_id: PMID:12867411
      supporting_text: identify an evolutionarily conserved microsomal cytochrome P450 (CYP2R1) with vitamin D 25-hydroxylase
        activity
    - reference_id: PMID:12867411
      supporting_text: indicated that the secosteroid product of CYP2R1 was 25-hydroxyvitamin D3
    - reference_id: PMID:15465040
      supporting_text: These results strongly suggest that CYP2R1 plays a physiologically important role in the
        vitamin D 25-hydroxylation in humans.
    - reference_id: PMID:18511070
      supporting_text: confirmed the enzyme as a vitamin D 25-hydroxylase, and solved the crystal structure of CYP2R1
        in complex with vitamin D3
    - reference_id: PMID:15128933
      supporting_text: eliminated vitamin D 25-hydroxylase enzyme activity
