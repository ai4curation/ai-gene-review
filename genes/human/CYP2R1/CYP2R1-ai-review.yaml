suggested_questions:
- question: Which enzyme accounts for the residual (~50%) 25-hydroxyvitamin D production in Cyp2r1/Cyp27a1 double-null
    mice?
- question: Does CYP2R1 contribute to vitamin D activation outside the liver (e.g. testis) in a physiologically
    meaningful way?
