suggested_questions:
- question: Which basal or induced pexophagy conditions explain the different ACBD5-depletion results
    across HeLa, Ntera-2 and hTERT-RPE1 cells?
- question: How is bound very-long-chain acyl-CoA delivered to peroxisomal transport machinery, independently
    of the separable VAP-dependent tethering function?
- question: Which native ACBD5 isoforms were assayed in the older proteomic and localization experiments,
    and is the NK-cell peptide evidence recoverable?
- question: Does the experimentally attributed UniProt pexophagy-receptor wording denote a direct
    mammalian cargo-receptor mechanism, or the requirement observed in the original depletion assays?
suggested_experiments:
- hypothesis: The effect of ACBD5 loss on pexophagy depends on cell background and basal versus induced
    autophagy conditions.
  description: Compare matched ACBD5 depletion and knockout with isoform-defined wild-type rescue
    in HeLa, Ntera-2 and hTERT-RPE1 cells. Measure basal, MLN4924-induced and CMPD-39-induced peroxisome
    delivery using the same flux reporter and a lysosomal-inhibition control, alongside peroxisome
    abundance, reporter expression and viability. Include an orthogonal peroxisomal-protein turnover
    assay to distinguish degradation from biogenesis or reporter effects.
  experiment_type: Matched-cell pexophagy flux and rescue comparison
- hypothesis: ACBD5 promotes acyl-CoA delivery to peroxisomal transport machinery through its lipid-binding
    domain independently of VAP-mediated tethering.
  description: Compare isoform-defined wild-type, lipid-binding-defective and FFAT-defective ACBD5
    at matched abundance and peroxisomal localization. Measure labeled VLCFA oxidation together with
    a membrane-import or purified donor-to-acceptor transfer assay that separates acyl-CoA capture
    from translocation. In a reconstituted system, include transporter-only, ACBD5-only and combined
    components and test VAP-dependent tethering separately. This tests a possible handoff mechanism
    without assuming that ACBD5 itself is a transporter.
  experiment_type: Separation-of-function rescue and acyl-CoA transfer/import assays
