    label: peroxisome-endoplasmic reticulum membrane tether activity
  evidence_type: IDA
  original_reference_id: PMID:28108524
  qualifier: enables
  review:
    summary: ACBD5 binds ER-resident VAP proteins to physically tether the peroxisomal membrane to
      the ER.
    action: NEW
    reason: Direct recombinant interaction, FFAT-mutant experiments and membrane-contact measurements
      in PMID:28108524, independently supported by PMID:28108526, establish ACBD5 as the peroxisomal
      component of this physical bridge. QuickGO verifies this active molecular-function term, absent
      from the 18 native contexts and the current gene/term query. Its ancestor set does not overlap
      the existing fatty-acyl-CoA-binding term. No ACBD5 entry was found in the local GO-CAM index.
      The assignment is restricted to membrane tethering; it adds no downstream process or lipid-transfer
      activity.
