gene_symbol: ACBD5
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ACBD5 is a tail-anchored peroxisomal membrane protein with a cytosol-facing acyl-CoA-binding
  domain and an FFAT-like motif that binds endoplasmic-reticulum-resident VAP proteins. It binds
  fatty acyl-CoAs, preferentially very-long-chain species, and supports their efficient peroxisomal
  metabolism. Separately, its interaction with VAPA and VAPB physically tethers peroxisomes to the
  endoplasmic reticulum, supporting organelle contact and membrane homeostasis. Its acyl-CoA-binding
  and VAP-dependent tethering activities can be experimentally separated. A distinct interaction
  with PTPIP51 tethers peroxisomes to mitochondria, with increased contact during mitochondrial oxidative
  stress. Biallelic loss of ACBD5 causes retinal dystrophy and white-matter disease.
