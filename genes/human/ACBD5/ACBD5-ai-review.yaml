- term:
    id: GO:0000425
    label: pexophagy
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR016347
  review:
    summary: The family-based pexophagy inference is not resolved by the available human evidence.
    action: UNDECIDED
    reason: PMID:24535825 includes human HeLa and Ntera-2 ACBD5-depletion experiments showing impaired
      delivery of peroxisomes to lysosomes; it is not yeast-only or a wrong-gene citation. PMID:27799409
      reports no pexophagy effect in ACBD5-deficient human material/cells. PMID:36810161 finds induced
      pexophagy insensitive to ACBD5 depletion in hTERT-RPE1 cells. These different systems and induction
      conditions leave the general role unresolved. Preserve the reported observation for assessment
      while leaving the annotation unresolved; it does not settle a universal requirement or a mammalian
      cargo-receptor mechanism. Yeast Atg37 evidence alone does not settle this human assignment.
      The native UniProt CC:FUNCTION calls ACBD5 a peroxisome receptor for pexophagy, with ECO:0000269
      citing PMID:24535825. This curated experimental statement is considered explicitly. The human
      experiments in that paper demonstrate localization and a depletion phenotype, whereas the detailed
      Atg30/Atg11 interaction mechanism is studied in yeast. Those human results do not independently
      establish direct cargo recognition or recruitment of the mammalian autophagic machinery by
      ACBD5; the receptor interpretation remains unresolved.
    supported_by:
    - reference_id: GO_REF:0000002
    - reference_id: PMID:24535825
      supporting_text: ACBD5 is required for the autophagic delivery of peroxisomes to the lysosomes.
      reference_section_type: RESULTS
    - reference_id: PMID:27799409
      supporting_text: No effect on pexophagy was found.
      reference_section_type: ABSTRACT
    - reference_id: PMID:36810161
      supporting_text: The increased pexophagy after CMPD-39 is insensitive to BNIP3/NIX or ACBD5
        depletion
      reference_section_type: RESULTS
    - reference_id: file:human/ACBD5/ACBD5-uniprot.txt
      record_section:
      - CC:FUNCTION
      supporting_text: receptor for pexophagy
