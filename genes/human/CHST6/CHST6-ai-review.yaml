- id: PMID:11181564
  title: Chromosomal localization and genomic organization for the galactose/ N-acetylgalactosamine/N-acetylglucosamine
    6-O-sulfotransferase gene family.
  findings:
  - statement: The genomic study separates human GST-4alpha and GST-4beta into adjacent
      open reading frames and describes the family as Golgi-resident glycan sulfotransferases.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected normal abstract and authentic author-upload sequence/organization
      legends were read. Full Methods/Results were not recovered. GST-4alpha and GST-4beta
      are distinct CHST5/CHST6 gene products, not two CHST6 splice products. No native
      CHST6 imaging assay is claimed.
  full_text_unavailable: true
- id: PMID:11278593
  title: Human corneal GlcNac 6-O-sulfotransferase and mouse intestinal GlcNac 6-O-sulfotransferase
    both produce keratan sulfate.
  findings:
  - statement: Human corneal GlcNAc-6 sulfotransferase transfers sulfate to GlcNAc
      C6 in synthetic acceptors and cooperates with the Gal-6 enzyme to produce keratan-reactive
      glycans in cells.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Normal cache is abstract-only. Authentic indexed author-upload
      full-text Methods and Results were independently read: pcDNA3 intact human enzyme
      and soluble catalytic-domain construct with secretion/polyhistidine cassette,
      expressed in HeLa cells. Lysate and concentrated-medium assays, mock controls,
      glycosidase/HPLC product identification and 5D4 coexpression distinguish GlcNAc
      from Gal sulfation. Mouse intestinal enzyme is a separate comparator. No figure
      pixels or exact current-product sequence alignment is claimed.'
- id: PMID:11352640
  title: Sulfation of endothelial mucin by corneal keratan N-acetylglucosamine 6-O-sulfotransferase
    (GST-4beta).
  findings:
  - statement: Human corneal GST-4beta/CHST6 sulfates GlyCAM-1 in COS-7 coexpression;
      this establishes a mucin-glycan substrate capability without demonstrating an
      endogenous adhesion role.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Genuine normal abstract explicitly identifies CHST6 and the positive
      COS-7 assay. Bounded publisher/API attempts recovered no full body. No detailed
      purification, product mapping or physiological homing experiment beyond the
      accessible source is claimed.
  full_text_unavailable: true
- id: PMID:17690104
  title: Enzymes responsible for synthesis of corneal keratan sulfate glycosaminoglycans.
  findings:
  - statement: CGn6ST cooperates with beta3GnT7 and beta4GalT4 to synthesize extended
      GlcNAc-sulfated chains; subsequent Gal-6 sulfation produces highly sulfated
      keratan.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Normal cache is abstract-only. Authentic indexed author-upload Methods
      and selected Results were independently read. Human CGn6ST constructs explicitly
      reuse the 2001 study; Lec20 is the expression host, not the target species.
      Concentrated soluble-enzyme mixtures and sequential Gal sulfation establish
      performed catalysis. Cellular siRNA targets the two glycosyltransferases, not
      CHST6. No entire-paper or figure-pixel read is claimed.
