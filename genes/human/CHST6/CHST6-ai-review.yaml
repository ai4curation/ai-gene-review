core_functions:
- description: CHST6 transfers sulfate from PAPS to GlcNAc C6 during keratan-sulfate
    proteoglycan biosynthesis in the Golgi. Its sulfation step cooperates with glycosyltransferase-mediated
    chain elongation and the separate Gal-6 sulfotransferase reaction.
  molecular_function:
    id: GO:0001517
    label: N-acetylglucosamine 6-O-sulfotransferase activity
  locations:
  - id: GO:0000139
    label: Golgi membrane
  directly_involved_in:
  - id: GO:0018146
    label: keratan sulfate proteoglycan biosynthetic process
  supported_by:
  - reference_id: PMID:11278593
  - reference_id: PMID:17690104
suggested_questions:
- question: Which native non-keratan glycans are physiological CHST6 substrates outside
    the cornea, given the positive GlyCAM-1 coexpression result?
- question: What direct localization and phylogenetic evidence resolve CHST6 trans-Golgi
    activity at PTN002581838 relative to the broader Golgi membrane localization?
- question: How does CHST6 coordinate with glycosyltransferases and Gal-6 sulfotransferase
    to control keratan-chain length and sulfation without conflating their catalytic
    steps?
- question: Should the Gal-6-specific exact synonym of GO:0045130 be revised to match
    its broader official EC2.8.2.21 scope, which includes both Gal and GlcNAc sulfation?
suggested_experiments:
- description: Use sequence-verified human CHST6 with chemically defined short and
    extended glycan acceptors, positional sulfate-product analysis and matched inactive
    controls, then compare with endogenous glycan products after cell-specific complementation.
    Distinguish GlcNAc-6 transfer from Gal-6 sulfation and chain elongation.
