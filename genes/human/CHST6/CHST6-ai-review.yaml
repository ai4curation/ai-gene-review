id: Q9GZX3
gene_symbol: CHST6
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CHST6 encodes corneal N-acetylglucosamine 6-O-sulfotransferase, a type
  II Golgi membrane enzyme that transfers sulfate from PAPS to the 6-hydroxyl group
  of GlcNAc in glycan acceptors. This reaction contributes to keratan sulfate chain
  biosynthesis and the sulfation pattern of corneal proteoglycans. The human enzyme
  can also sulfate mucin glycans in a heterologous expression assay. Biallelic loss
  of CHST6 function or cornea-specific expression causes macular corneal dystrophy.
