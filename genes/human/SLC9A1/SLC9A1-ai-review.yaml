  qualifier: located_in
  review:
    summary: Reported cytoplasmic localization; the cited reference is mis-keyed to an
      unrelated paper.
    action: UNDECIDED
    reason: >-
      NHE1 is a polytopic plasma-membrane protein with a large cytoplasmic
      C-terminal domain, so a cytoplasm assignment could reflect either the
      cytoplasmic domain or a biosynthetic/overexpression pool. The cited
      PMID:21553168 does not support the claim because it is mis-keyed: the cached
      record resolves to an unrelated pharmaceutics paper on controlled-release
      solid dispersions, not an NHE1 study (recorded as a source defect below and
      in reference_review). With no usable reference for this localization, the
      row is left UNDECIDED rather than adjudicated.
    source_defects:
    - defect_type: WRONG_REFERENCE
      resource: UNIPROT
      slot: Reference
      requested_change: CHECK
      asserted_value: PMID:21553168
      confidence: CONFIRMED
      explanation: 'The UniProt-assigned IDA rows for GO:0005737 (cytoplasm) and
        GO:0005886 (plasma membrane) both cite PMID:21553168, whose cached record
        resolves to "Controlled release systems containing solid dispersions:
        strategies and mechanisms." (Pharm Res, 2011) — a pharmaceutics review with
        no content on NHE1 or on protein localization. The citation is therefore
        wrong; the intended paper is unknown, so no corrected_value is proposed and
        a CHECK is requested rather than a repoint.'
