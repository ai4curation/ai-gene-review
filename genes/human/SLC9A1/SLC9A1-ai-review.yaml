proposed_new_terms: []
suggested_questions:
- question: Does the direction wording in the current UniProt FUNCTION line (extrudes Na(+)
    in exchange for external protons) accurately convey the physiological transport direction?
    The catalytic-activity Rhea reaction and the consensus stoichiometry (one Na+ in, one H+
    out) indicate NHE1 imports Na+ and exports H+; the FUNCTION prose risks being read as net
    Na+ extrusion.
- question: Should a dedicated sodium:proton exchanger complex (or NHE1-CHP complex) cellular
    component term be created, given ComplexPortal entries CPX-26449/26462/26464 and the
    structurally defined NHE1-CHP1 complex? The current best available term is the generic
    GO:1990351 transporter complex.
suggested_experiments:
- description: Directly test whether human NHE1 can mediate any K+/H+ exchange under
    physiological conditions, to confirm or refute the K+-transport annotations propagated from
    the broad CPA1 family node (currently marked as over-annotations for NHE1).
- description: Define the physiological relevance of the intrinsic calcium-binding motif in the
    NHE1 disordered C-terminal tail (residues 680-815) identified by DisProt, independent of
    CHP/calmodulin, e.g. by mutating the motif and assaying pHi set-point and regulation.
