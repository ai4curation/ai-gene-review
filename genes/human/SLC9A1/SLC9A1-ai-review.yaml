id: P19634
gene_symbol: SLC9A1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SLC9A1 (NHE1) is the ubiquitously expressed, housekeeping isoform of the
  plasma-membrane Na(+)/H(+) exchanger family. It is an electroneutral secondary active
  transporter that imports one extracellular Na(+) in exchange for one intracellular H(+)
  (1:1 stoichiometry), driven by the inward sodium chemical gradient, and can also exchange
  Li(+) for H(+). The protein comprises an N-terminal membrane domain of 12-13 transmembrane
  segments that carries out ion translocation and a large C-terminal cytoplasmic regulatory
  tail. Its activity is steeply pH-dependent, being essentially off at neutral intracellular
  pH and switched on as the cytosol acidifies, making NHE1 the principal regulator of
  intracellular pH (pHi) and, through coupled osmotic water movement, of cell volume. NHE1
  functions as an obligate homodimer and depends on the calcium-binding regulatory subunits
  CHP1/CHP2/CHP3(tescalcin) for maturation, surface expression and pH sensitivity. Its
  cytoplasmic tail is extensively phosphorylated and binds phosphoinositides, calmodulin,
  calcineurin and ERM proteins; beyond ion transport, NHE1 therefore acts as a membrane
  anchor and scaffold that links the plasma membrane to the actin cytoskeleton and to
  signaling complexes. By setting pHi, NHE1 influences cell proliferation, migration,
  survival and, in cardiac and other muscle, stretch and hypertrophic responses. In most
  polarized epithelia NHE1 resides in the basolateral membrane (luminal in choroid plexus).
  Loss-of-function variants cause the autosomal-recessive neurological disorder
  Lichtenstein-Knorr syndrome (ataxia with sensorineural deafness).
