  review:
    summary: Phylogenetic inference of K(+)/H(+) antiporter activity from the broad CPA1 node.
    action: MARK_AS_OVER_ANNOTATED
    reason: The IBD node (PTN008493947) spans both Na(+)/H(+) exchangers and K(+)-transporting
      NHA/plant/yeast antiporters, so K(+)/H(+) antiporter activity propagates to NHE1 even
      though human NHE1 is characterized as a Na(+)/H(+) (and Li(+)/H(+)) exchanger, not a
      K(+)/H(+) exchanger. For NHE1 specifically this is an over-annotation inherited from the
      broad node; it is not a core or demonstrated activity of this gene product. It is marked
      over-annotated rather than removed because K(+) handling by mammalian plasma-membrane NHEs
      has not been definitively excluded.
