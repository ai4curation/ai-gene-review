proposed_new_terms: []
suggested_questions:
- question: Is ANKRD20A1 translated from its own locus, as distinct from the 97-99% identical ANKRD20A2P/A3P/A4P/A8P
    copies, and does any copy-specific peptide occur in human proteomes?
- question: Does the cortical-plate antibody signal reported in midfetal brain colocalize with deep-layer
    neurons because of ANKRD20A1 or a paralog?
suggested_experiments:
- description: Use locus-specific long-read RNA sequencing and targeted mass spectrometry for ANKRD20A1-unique
    peptides in fetal cortex, to establish which ANKRD20A copies are expressed as protein.
