knowledge_gaps:
- gap_statement: ANKRD20A1's molecular activity, partners, location and biological role are unknown, and
    existing protein-level observations cannot be assigned to ANKRD20A1 rather than its near-identical
    paralogs.
  boundary: The only GO annotation, a single high-throughput plasma membrane localization, cannot be verified
    and is left UNDECIDED. PAN-GO assigns no annotations, and fetching PAINT data for PTHR24147 returned
    no annotated nodes. The one functional-context paper reports antibody staining in the developing cortex.
  gap_kind:
  - BIOLOGY
  dark_aspect: WHOLLY_DARK
  status: OPEN
  significance: ANKRD20A1 is a haploinsufficiency-intolerant candidate in a neurodevelopmental-disorder
    structural variant, but without locus-specific evidence its contribution cannot be separated from
    its paralogs'.
  resolution: Detect ANKRD20A1-specific peptides by mass spectrometry, or tag the endogenous locus, and
    then test localization and loss of function.
