id: Q5TYW2
gene_symbol: ANKRD20A1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ANKRD20A1 (ankyrin repeat domain-containing 20A1) is an uncharacterized 823-residue protein
  with five N-terminal ankyrin repeats and long C-terminal coiled-coil regions. It is 97-99% identical
  across its full length to the ANKRD20A2P, ANKRD20A3P, ANKRD20A4P and ANKRD20A8P copies. Its protein
  has been detected only with a polyclonal antibody, in the cortical plate and subplate of the midfetal
  human cortex. No molecular activity, partner or biological role is known.
