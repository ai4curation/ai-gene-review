id: P81133
gene_symbol: SIM1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SIM1 (single-minded homolog 1) encodes a class I bHLH-PAS transcription
  factor that binds DNA and regulates RNA polymerase II transcription as an obligate
  heterodimer with a class II bHLH-PAS partner, ARNT or (in the hypothalamus) ARNT2.
  It is expressed in the developing paraventricular (PVN), anterior periventricular
  and supraoptic nuclei of the hypothalamus, where it is required for terminal differentiation
  of oxytocin, vasopressin, TRH, CRH and somatostatin neuroendocrine neurons, acting
  upstream of BRN2 (POU3F2) and SIM2; it is also expressed in developing kidney, somites
  and other tissues. SIM1-expressing PVN neurons lie downstream of leptin-melanocortin
  (MC4R) signalling in the control of food intake, and heterozygous loss of SIM1 in
  mice and humans causes hyperphagic early-onset obesity, sometimes with Prader-Willi-like
  features.
