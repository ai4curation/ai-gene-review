    review_notes: Cited in suggested_questions for the postnatal, non-developmental requirement.
      Fetched and verified against PubMed on 2026-10-11; the abstract supports each clause used
      (CaMKII-Cre conditional deletion after birth, dosage-dependent hyperphagic obesity,
      stereological counting against global PVN hypocellularity, normal retrograde tracing to the
      dorsal vagal complex and median eminence, and the decrease in hypothalamic Oxt and PVN Mc4r
      mRNA). Mouse genetics, so it establishes the separability of the postnatal role rather than
      the human mechanism.
core_functions:
- description: bHLH-PAS transcription factor that, as an obligate heterodimer with
    ARNT2 (or ARNT), binds RNA polymerase II regulatory regions in the nucleus and
    drives terminal differentiation of neuroendocrine neurons of the hypothalamic
    paraventricular and supraoptic nuclei.
  molecular_function:
    id: GO:0000981
    label: DNA-binding transcription factor activity, RNA polymerase II-specific
