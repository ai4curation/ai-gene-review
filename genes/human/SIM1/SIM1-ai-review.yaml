- term:
    id: GO:0021979
    label: hypothalamus cell differentiation
  evidence_type: IMP
  original_reference_id: PMID:9784500
  qualifier: involved_in
  review:
    summary: Sim1-null mice lack oxytocin, vasopressin, TRH, CRH and somatostatin
      neurons of the PVN, aPV and SON; SIM1 controls their terminal differentiation
      upstream of Brn2. Sim1 heterozygosity reduces PVN cell number and causes hyperphagic
      obesity, and human SIM1 loss of function causes obesity.
    action: NEW
    reason: SIM1 directly drives this differentiation programme as a transcription
      factor; mouse loss-of-function evidence, consistent with the human obesity phenotype.
    supported_by:
    - *id004
    - *id005
    - reference_id: PMID:11448938
      supporting_text: Sim1 heterozygous mice are viable but develop early-onset obesity,
        with increased linear growth, hyperinsulinemia and hyperleptinemia
