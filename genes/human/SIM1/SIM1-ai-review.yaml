  - *id002
  - *id004
  - *id005
suggested_questions:
- question: Postnatal CNS deletion of Sim1 in mouse is by itself sufficient to cause
    hyperphagic obesity, with reduced hypothalamic Oxt and PVN Mc4r and without global
    PVN hypocellularity or loss of the examined projections [PMID:20220015], so the
    postnatal role is separable from the developmental one. What remains open is the
    mechanism. Is the adult requirement direct transcriptional maintenance of Oxt and
    Mc4r in those neurons, or maintenance of the neuronal identity that keeps them
    expressed, and does the same hold in human carriers?
  experts:
  - hypothalamic neuroendocrinology experts
- question: Which SIM1:ARNT2 target genes in PVN neurons mediate the obesity phenotype?
  experts:
  - transcriptional regulation experts
suggested_experiments:
- description: CUT&RUN for SIM1 and ARNT2 in human iPSC-derived PVN-like neurons combined
    with RNA-seq of SIM1 heterozygous lines.
  experiment_type: genomics
  hypothesis: SIM1:ARNT2 directly regulates genes of the melanocortin-responsive PVN
    neuron programme (e.g. MC4R pathway components).
