    supporting_text: Human, porcine, and Rhodobacter sphaeroides ETF-QO each contain a single [4Fe-4S](2+,1+)
      cluster and one equivalent of FAD
  - reference_id: PMID:17050691
  locations:
  - id: GO:0005743
    label: mitochondrial inner membrane
- description: In the fatty-acid oxidation context of the same quinone-reductase activity, performs the
    ETF-to-ubiquinone redox step downstream of acyl-CoA dehydrogenation. The human MCAD–ETF–ETFDH coupled
    assay links octanoyl-CoA oxidation to ubiquinone reduction and therefore demonstrates executed electron-transfer
    work in this branch. Human disease and acylcarnitine evidence provide physiological context; they
    are not used alone to infer the catalytic step or complete fatty-acid oxidation flux.
  molecular_function:
