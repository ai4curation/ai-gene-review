core_functions:
- description: Catalyzes oxidation of reduced ETF coupled to reduction of ubiquinone at the mitochondrial
    inner membrane. Human ETFDH expressed from a full-length cDNA in Sf9 cells supports MCAD/ETF/octanoyl-CoA-dependent
    ubiquinone reduction, with FAD and a 4Fe–4S cluster providing the enzyme’s redox centers. The native
    porcine structure supplies complementary cofactor and membrane-association information. These results
    establish the ETF-to-quinone step without fixing a compulsory internal electron-transfer order or
    demonstrating complete respiratory flux in the soluble assay.
  molecular_function:
    id: GO:0004174
    label: electron-transferring-flavoprotein dehydrogenase activity
  directly_involved_in:
  - id: GO:0022904
    label: respiratory electron transport chain
  locations:
  - id: GO:0005743
    label: mitochondrial inner membrane
  supported_by:
  - reference_id: PMID:12049629
    supporting_text: a component of an electron-transfer system that links 10 different mitochondrial
      flavoprotein dehydrogenases to the mitochondrial bc1 complex via electron transfer flavoprotein
      (ETF) and ubiquinone
  - reference_id: PMID:17050691
    supporting_text: It catalyzes ubiquinone (UQ) reduction by ETF, linking oxidation of fatty acids and
      some amino acids to the mitochondrial respiratory chain.
  - reference_id: PMID:18037314
  - reference_id: PMID:8306995
- description: Binds ubiquinone at the quinone-reduction site. Human enzyme kinetics and quinone-analog
    binding are consistent with a single class of quinone site per enzyme molecule, while the native porcine
    structure resolves bound ubiquinone. The broader quinone-binding annotation remains supported by tested
    alternative quinones; their activity in vitro does not establish them as physiological acceptors.
  molecular_function:
    id: GO:0048039
    label: ubiquinone binding
  locations:
  - id: GO:0005743
    label: mitochondrial inner membrane
  supported_by:
  - reference_id: PMID:14640977
    supporting_text: consistent with one ubiquinone-binding site per ETF-QO monomer
  - reference_id: PMID:17050691
- description: Binds one FAD cofactor as a redox center of ETFDH. Spectroscopic characterization of purified
    human enzyme supports the bound flavin and its semiquinone state, with complementary structural placement
    from the porcine enzyme. This cofactor-binding facet is part of the same ETF-to-ubiquinone catalytic
    system, without specifying a universal order of electron passage between its cofactors.
  molecular_function:
    id: GO:0050660
    label: flavin adenine dinucleotide binding
  supported_by:
  - reference_id: PMID:18037314
    supporting_text: each contain a single [4Fe-4S](2+,1+) cluster and one equivalent of FAD
  - reference_id: PMID:12049629
  - reference_id: PMID:17050691
  locations:
  - id: GO:0005743
    label: mitochondrial inner membrane
- description: Binds a single 4Fe–4S cluster that participates in the ETFDH redox system. Human Sf9-derived
    enzyme has direct EPR evidence for the reduced cluster; the native porcine structure resolves its
    cysteine coordination. The porcine residue labels are not automatically assigned to current human
    sequence coordinates, and this binding facet does not imply a separate iron-sulfur-cluster biosynthesis
    activity.
  molecular_function:
    id: GO:0051539
    label: 4 iron, 4 sulfur cluster binding
  supported_by:
