taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ETFDH encodes electron-transfer flavoprotein-ubiquinone oxidoreductase, an iron-sulfur flavoprotein
  associated with the mitochondrial inner membrane. It oxidizes reduced electron-transfer flavoprotein,
  the soluble ETFA–ETFB heterodimer, and reduces ubiquinone to ubiquinol. This reaction connects fatty-acid
  beta-oxidation and amino-acid/choline catabolism to the respiratory ubiquinone pool. Each mature enzyme
  contains one FAD and one 4Fe–4S cluster as redox cofactors. The canonical 617-residue precursor contains
  an N-terminal mitochondrial targeting sequence; the alternative 570-residue product lacks canonical
  residues 12–58. Biallelic pathogenic variants cause multiple acyl-CoA dehydrogenase deficiency, also
  called glutaric aciduria type II, and can be associated with secondary coenzyme Q10 deficiency.
