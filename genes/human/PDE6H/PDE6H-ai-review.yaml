id: Q13956
gene_symbol: PDE6H
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: PDE6H encodes the inhibitory gamma subunit of the cone photoreceptor cGMP phosphodiesterase (cone Pgamma),
  a small intrinsically disordered protein of 83 residues expressed specifically in retinal cones. Two copies bind
  the PDE6C catalytic homodimer on the cone outer segment disc membranes; the C-terminus of each blocks access to
  a catalytic site, and inhibition is more dynamic than in rods, consistent with the higher basal activity and faster
  kinetics of cone phototransduction. Light-activated cone transducin alpha (GNAT2-GTP) relieves the inhibition,
  allowing cGMP hydrolysis and closure of the cone cGMP-gated channels. Biallelic loss-of-function variants cause
  a form of achromatopsia (ACHM6). Like the rod gamma subunit, cone Pgamma can enhance growth factor-stimulated
  ERK signalling when expressed in cultured non-retinal cells.
