id: Q8WU20
gene_symbol: FRS2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: FRS2 (fibroblast growth factor receptor substrate 2, also FRS2alpha or SNT-1) is a membrane-anchored
  docking protein that couples receptor tyrosine kinases, principally the FGF receptors, to intracellular
  signalling. N-terminal myristoylation anchors it to the cytoplasmic face of the plasma membrane, and
  its IRS-type phosphotyrosine-binding (PTB) domain binds constitutively to a non-phosphorylated juxtamembrane
  motif of FGFRs and, in an activation-dependent manner, to phosphorylated NPXpY sites on Trk neurotrophin
  receptors (where it competes with SHC) and other RTKs including ALK and RET. On receptor activation
  its long disordered C-terminal tail is phosphorylated on multiple tyrosines that serve as SH2 docking
  sites for GRB2 and the phosphatase SHP2/PTPN11, assembling GRB2-SOS complexes that activate Ras-MAPK
  signalling and GRB2-GAB1 complexes that recruit PI3K and activate AKT. ERK-mediated threonine phosphorylation
  and CBL-dependent ubiquitination of FRS2 provide negative feedback. FRS2 is broadly expressed and is
  required for many FGF-dependent developmental processes; its paralog FRS3 shares the same architecture.
existing_annotations:
- term:
    id: GO:0005068
    label: transmembrane receptor protein tyrosine kinase adaptor activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - MGI:MGI:1100860
  - PANTHER:PTN008575506
  review:
    summary: FRS2 is a myristoyl-anchored PTB-domain docking protein that binds the FGFR juxtamembrane
      region and, once tyrosine-phosphorylated by the receptor, recruits GRB2-SOS, SHP2 and (via GRB2-GAB1)
      PI3K. This is the canonical transmembrane RTK adaptor activity (IBA).
    action: ACCEPT
    reason: The term definition (a binding activity that brings together a transmembrane RTK and other
      molecules so they function coordinately) is exactly what FRS2 does for FGFRs and, in an activation-dependent
      way, for TrkA/Trk receptors, ALK and EGFR. Direct PTB-FGFR1 binding and downstream effector recruitment
      are experimentally established; the IBA placement at the FRS2/FRS3 node is phylogenetically sound
      and the ortholog IEA transfer is from mouse Frs2 IDA.
    supported_by:
    - reference_id: PMID:9660748
      supporting_text: we show that FRS2/SNT-1 and a newly isolated SNT-2 protein directly bind to FGF
        receptor-1 (FGFR-1)
    - reference_id: PMID:9660748
      supporting_text: Our findings establish SNTs as direct protein links between FGFR-1 and multiple
        downstream pathways
    - reference_id: PMID:9182757
      supporting_text: FRS2 functions as a lipid-anchored docking protein that targets signaling molecules
        to the plasma membrane in response to FGF stimulation to link receptor activation with the MAPK
        and other signaling pathways essential for cell growth and differentiation
    - reference_id: PMID:9632781
      supporting_text: These experiments demonstrate that FRS2 recruits Grb2 molecules both directly and
        indirectly via complex formation with Shp2
    - reference_id: PMID:11353842
      supporting_text: we demonstrate that tyrosine phosphorylation of FRS2alpha leads to Grb2-mediated
        complex formation with the docking protein Gab1 and its tyrosine phosphorylation, resulting in
        the recruitment and activation of PI3-kinase
    - reference_id: file:human/FRS2/FRS2-deep-research-falcon.md
      supporting_text: FRS2 functions as a lipid-anchored signaling scaffold that couples activated receptor
        tyrosine kinases—principally FGFRs—to intracellular signaling cascades
