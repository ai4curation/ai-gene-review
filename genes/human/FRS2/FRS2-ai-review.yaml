- term:
    id: GO:0005829
    label: cytosol
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-170964
  qualifier: located_in
  review:
    summary: Reactome (Reactome:R-HSA-170964) places FRS2 in the cytosol for neurotrophin (TrkA/TrkB)
      receptor reactions, whereas the FGFR reactions place it at the plasma membrane.
    action: MARK_AS_OVER_ANNOTATED
    reason: FRS2 is N-myristoylated and myristoylation is required for its membrane localization and signalling;
      its signalling pool acts at the cytoplasmic face of the plasma membrane bound to receptors, not
      free in the cytosol. The cytosol compartment in these Reactome events reflects compartment modelling
      of the soluble reaction partners rather than evidence for a cytosolic FRS2 pool.
    supported_by:
    - reference_id: PMID:9182757
      supporting_text: We find that FRS2 is myristylated and that this modification is essential for membrane
        localization, tyrosine phosphorylation, Grb2/Sos recruitment, and MAPK activation
    - reference_id: PMID:9182757
      supporting_text: FRS2 functions as a lipid-anchored docking protein that targets signaling molecules
        to the plasma membrane in response to FGF stimulation to link receptor activation with the MAPK
        and other signaling pathways essential for cell growth and differentiation
