- term:
    id: GO:0005168
    label: neurotrophin TRKA receptor binding
  evidence_type: IPI
  original_reference_id: PMID:15488758
  qualifier: enables
  supporting_entities:
  - UniProtKB:P04629
  review:
    summary: FRS2 binds ligand-activated TrkA through its PTB domain at the phosphorylated NPXpY (Y490/Y496)
      site shared with SHC. The cited Tacconelli et al. 2004 abstract (TrkAIII splice variant) does not
      mention FRS2, so the IPI presumably derives from full-text data; the interaction itself is independently
      well supported.
    action: ACCEPT
    reason: Deferring to the curator for the IPI (cached paper is abstract-only). TrkA binding is independently
      established by Meakin et al. 1999, Ong et al. 2000 and the Dhalluin et al. 2000 NMR study, and is
      the receptor-recognition step of FRS2's adaptor role in neurotrophin signalling.
    supported_by:
    - reference_id: PMID:10092678
      supporting_text: we demonstrate that the phosphotyrosine binding domain of FRS-2 directly binds
        the Trk receptors at the same phosphotyrosine residue that binds the signaling adapter Shc
    - reference_id: PMID:10629055
      supporting_text: While FGFR1 interacts with FRS2 constitutively, independent of ligand stimulation
        and tyrosine phosphorylation, NGF receptor (TrkA) binding to FRS2 is strongly dependent on receptor
        activation
    - reference_id: PMID:11090629
      supporting_text: The SNT-1 phosphotyrosine binding (PTB) domain recognizes activated TRKs at a canonical
        NPXpY motif and, atypically, binds to nonphosphorylated FGFRs in a region lacking tyrosine or
        asparagine
    - reference_id: Reactome:R-HSA-170964
      supporting_text: FRS2 binds to TRKA through the same motif (NPXY) around the TRKA phospho-tyrosine
        residue Y496 to which SHC proteins bind.
    additional_reference_ids:
    - PMID:10092678
    - PMID:10629055
    - PMID:11090629
