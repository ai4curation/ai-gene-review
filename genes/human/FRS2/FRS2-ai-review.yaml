  review:
    summary: FRS2 is a peripheral membrane protein on the cytoplasmic face of the plasma membrane; cytoplasm
      is a broad but not incorrect location transferred from mouse Frs2.
    action: ACCEPT
    reason: Broad IEA location consistent with its cytoplasmic-face membrane association; plasma membrane
      is the more informative location.
