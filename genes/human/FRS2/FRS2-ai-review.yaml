- id: file:human/FRS2/FRS2-deep-research-falcon.md
  title: Falcon deep research report on FRS2
  findings: []
core_functions:
- description: 'Membrane-anchored RTK docking/adaptor: the PTB domain binds the FGFR juxtamembrane region
    (constitutively) or phosphorylated NPXpY sites on Trk and other RTKs; the receptor then phosphorylates
    the FRS2 tail, creating SH2 docking sites that assemble GRB2-SOS (Ras-MAPK) and GRB2-GAB1-PI3K (AKT)
    complexes at the plasma membrane.'
  molecular_function:
    id: GO:0005068
    label: transmembrane receptor protein tyrosine kinase adaptor activity
  directly_involved_in:
  - id: GO:0008543
    label: fibroblast growth factor receptor signaling pathway
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:9660748
    supporting_text: we show that FRS2/SNT-1 and a newly isolated SNT-2 protein directly bind to FGF receptor-1
      (FGFR-1)
  - reference_id: PMID:9660748
    supporting_text: Our findings establish SNTs as direct protein links between FGFR-1 and multiple downstream
      pathways
  - reference_id: PMID:9182757
    supporting_text: FRS2 functions as a lipid-anchored docking protein that targets signaling molecules
      to the plasma membrane in response to FGF stimulation to link receptor activation with the MAPK
      and other signaling pathways essential for cell growth and differentiation
  - reference_id: PMID:9632781
    supporting_text: These experiments demonstrate that FRS2 recruits Grb2 molecules both directly and
      indirectly via complex formation with Shp2
  - reference_id: PMID:11353842
    supporting_text: we demonstrate that tyrosine phosphorylation of FRS2alpha leads to Grb2-mediated
      complex formation with the docking protein Gab1 and its tyrosine phosphorylation, resulting in the
      recruitment and activation of PI3-kinase
- description: 'Receptor recognition: direct, phosphotyrosine-independent binding of the FRS2 PTB domain
    to a conserved juxtamembrane motif of FGFRs, which pre-positions FRS2 for receptor-mediated phosphorylation.'
  molecular_function: *id001
  directly_involved_in:
  - id: GO:0008543
    label: fibroblast growth factor receptor signaling pathway
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:10629055
    supporting_text: While FGFR1 interacts with FRS2 constitutively, independent of ligand stimulation
      and tyrosine phosphorylation, NGF receptor (TrkA) binding to FRS2 is strongly dependent on receptor
      activation
  - reference_id: PMID:11090629
    supporting_text: The SNT-1 phosphotyrosine binding (PTB) domain recognizes activated TRKs at a canonical
      NPXpY motif and, atypically, binds to nonphosphorylated FGFRs in a region lacking tyrosine or asparagine
  - reference_id: PMID:9660748
    supporting_text: FGFR-mediated SNT tyrosine phosphorylation in vivo requires these segments of receptor
      and SNT
suggested_questions:
- question: Should FRS2 carry GO:0048011 neurotrophin TRK receptor signaling pathway? Meakin et al. 1999
    shows FRS-2 reconstitutes NGF-induced differentiation, which is participation evidence, yet comparable
    Trk adaptors (SHC1) and mouse Frs2 lack the term; is this a deliberate convention or a gap?
- question: What fraction of FRS2 signalling in vivo goes through non-FGFR RTKs (TrkA/B/C, RET, ALK, EGFR),
    and is FRS2 redundant with FRS3 or SHC1 at these receptors?
- question: Does binding of bisphosphorylated FRS2 directly stimulate SHP2 catalytic activity, or does
    SHP2 act only as a GRB2-recruiting adaptor in the FRS2 complex?
- question: Is the adherens-junction proximity of FRS2 functionally relevant (e.g. FGFR-cadherin crosstalk),
    or a by-product of plasma-membrane localization?
suggested_experiments:
- description: Knock-in of PTB-domain mutants that selectively abolish FGFR (non-pY) versus Trk (NPXpY)
    binding, to separate FRS2's FGFR and neurotrophin adaptor roles in neurons.
- description: Purified-component assay of SHP2 phosphatase activity in the presence of tyrosine-phosphorylated
    FRS2 tail peptides to test whether FRS2 has phosphatase activator activity.
- description: Conditional combined FRS2/FRS3 deletion in RET-dependent enteric neural crest or kidney
    to test whether FRS2 is required for GDNF-RET signalling in vivo.
