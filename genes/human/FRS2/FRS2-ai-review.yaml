- term:
    id: GO:0005104
    label: fibroblast growth factor receptor binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN008575506
  - UniProtKB:O43559
  - UniProtKB:Q8WU20
  review:
    summary: Direct binding of the FRS2 PTB domain to a conserved non-phosphotyrosine juxtamembrane motif
      of FGFR1 is well established by yeast two-hybrid, in vitro binding, mutagenesis and NMR (IBA).
    action: ACCEPT
    reason: FGFR binding is the receptor-recognition half of FRS2's adaptor activity and is informative
      (receptor-specific, constitutive, PTB-mediated). Retained as a core-supporting MF alongside GO:0005068.
    supported_by:
    - reference_id: PMID:9660748
      supporting_text: we show that FRS2/SNT-1 and a newly isolated SNT-2 protein directly bind to FGF
        receptor-1 (FGFR-1)
    - reference_id: PMID:10629055
      supporting_text: While FGFR1 interacts with FRS2 constitutively, independent of ligand stimulation
        and tyrosine phosphorylation, NGF receptor (TrkA) binding to FRS2 is strongly dependent on receptor
        activation
    - reference_id: PMID:11090629
      supporting_text: The SNT-1 phosphotyrosine binding (PTB) domain recognizes activated TRKs at a canonical
        NPXpY motif and, atypically, binds to nonphosphorylated FGFRs in a region lacking tyrosine or
        asparagine
