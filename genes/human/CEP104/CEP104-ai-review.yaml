- term:
    id: GO:0140778
    label: microtubule stabilizing activity
  evidence_type: IDA
  original_reference_id: PMID:39856351
  qualifier: enables
  review:
    summary: Full-length human CEP104 stabilizes microtubule plus ends.
    action: NEW
    reason: Purified full-length CEP104 directly suppresses microtubule shortening and persistently blocks
      plus ends in single-filament reconstitution assays (Figures 1–3). Recruitment partners enhance its
      activity; TOGARAM1 can overcome growth inhibition. This measured stabilizing activity is distinct
      from the isolated TOG-domain bulk-polymerization assay and is not an ancestor or descendant of the
      existing binding terms. No new biological-process annotation is proposed.
    supported_by:
    - reference_id: PMID:39856351
      supporting_text: inhibit both tubulin addition and removal from these ends in a TOG-domain-dependent
        manner
