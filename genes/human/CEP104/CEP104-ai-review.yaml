id: O60308
gene_symbol: CEP104
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CEP104 is a TOG-domain-containing microtubule regulator at distal centrioles and ciliary
  tips. Its TOG domain binds tubulin, while full-length human CEP104 can stabilize microtubule plus ends
  by suppressing both growth and shortening. Recruitment by EB proteins and ciliary partners such as CCDC66
  and CSPP1 shapes this activity; TOGARAM1 can overcome growth inhibition within the tip-protein network.
  CEP104 supports normal cilium length and architecture, and biallelic variants cause Joubert syndrome.
