proposed_new_terms: []
suggested_questions:
- question: >-
    Should a UniProt entry rated PE1 on antibody evidence alone carry molecular-function
    annotations when the underlying locus is classified by HGNC as a long non-coding RNA and
    mass spectrometry of the authors' own pull-downs did not detect the protein?
  experts: []
- question: >-
    Is there a GO term, or should there be one, for a non-GPCR single-pass peptide receptor?
    Both GO:0004962 endothelin receptor activity and GO:0086100 endothelin receptor signaling
    pathway are defined in terms of heterotrimeric G-protein activation, which leaves no
    endothelin-specific term available for a protein reported to bind ET-1 without a
    demonstrated G-protein mechanism.
  experts: []
- question: >-
    Can GO express "binds the signal peptide of VEGF-A but not mature VEGF-A"? GO:0038085
    vascular endothelial growth factor binding conflates the two, and GO:0005048 signal
    sequence receptor activity carries intracellular-targeting connotations from the SRP
    receptor literature.
  experts: []
suggested_experiments:
- description: >-
    Targeted mass spectrometry (parallel reaction monitoring with heavy-labelled synthetic
    peptides for the tryptic peptides downstream of codon 14) on membrane fractions of
    DEspR-high cells, with ADAR1 knockout cells as the negative control, to establish protein
    existence independently of antibodies.
- description: >-
    Radioligand binding on membranes from cells expressing an epitope-tagged construct, giving
    Kd and Bmax for 125I-ET-1 and for synthetic VEGF-A signal peptide, with competition by
    BQ123 and BQ788 to test whether the sites are pharmacologically distinct from ETA and ETB.
- description: >-
    A mechanism test for signal transmission: BRET or NanoBiT assays for G-protein recruitment
    and beta-arrestin recruitment on ligand addition, alongside a search for a transducing
    partner by proximity labelling of the 48-residue cytoplasmic tail, to determine how an
    85-residue single-pass protein could transmit a ligand signal.
- description: >-
    Independent replication, in a laboratory with no stake in the receptor claim, of the
    ligand-displacement FACS and of the ET-1-induced phosphorylation signature, using gene
    knockout rather than only antibody blockade as the specificity control.
