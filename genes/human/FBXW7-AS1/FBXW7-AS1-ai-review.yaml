      supporting_text: 7c5b2-immunostaining of DEspR+Cos1 cell transfectants was effectively
        blocked by the antigenic peptide and by ET1
    - reference_id: PMID:24465725
      supporting_text: Collectively, these findings support the functionality of VEGFsp- and
        ET1-binding to DEspR.
    - reference_id: PMID:26956245
      supporting_text: Current evidence only supports the existence of two subtypes, ETA and
        ETB, according to NC-IUPHAR nomenclature
    - reference_id: PMID:21081213
      supporting_text: All these data come from one group of scientists, and the physiology and
        pharmacology of DEAR has not been studied in depth.
