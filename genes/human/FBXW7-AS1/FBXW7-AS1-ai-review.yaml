  review:
    summary: >-
      Phosphoproteomic profiling of DEspR-expressing Cos1 transfectants after addition of the
      VEGF-A signal peptide shows ligand-specific activation of angiogenesis-associated
      phosphoproteins, partly overlapping and partly distinct from VEGF-VEGFR2 signalling.
    action: MODIFY
    reason: >-
      The term is defined as "The series of molecular signals initiated by vascular endothelial
      growth factor (VEGF) binding its receptor on the surface of the target cell". The ligand
      used here is the cleaved VEGF-A signal peptide, not VEGF-A itself, and UniProt records
      that the protein does not bind mature VEGF-A; the paper itself describes the resulting
      signalling as "distinct from VEGF-VEGFR2". The assertion that is actually supported is a
      cell-surface receptor signalling pathway initiated by an extracellular peptide ligand, so
      the generic parent is proposed instead.
