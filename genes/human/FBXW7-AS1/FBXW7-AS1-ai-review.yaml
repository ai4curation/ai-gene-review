id: B0L3A2
gene_symbol: FBXW7-AS1
product_type: PROTEIN
status: COMPLETE
aliases:
- DEAR
- DEspR
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  B0L3A2 is an 85-amino-acid single-pass membrane protein, named DEspR (dual
  endothelin-1/VEGF signal peptide receptor), encoded on the locus that HGNC classifies as the
  long non-coding RNA FBXW7-AS1, antisense to exon 5 of FBXW7 on chromosome 4q31.3. In the
  reference genome the reading frame is interrupted at codon 14 by a TGA; expression of the
  full-length protein is reported to depend on ADAR1-mediated adenosine-to-inosine editing of
  that codon to tryptophan. The protein has a short extracellular N terminus, one
  transmembrane helix and a cytoplasmic C-terminal tail, is N-glycosylated, and is detected at
  the plasma membrane of tumour cells, cancer stem-like cells, endothelial cells and a subset
  of circulating neutrophils, where it is internalised after antibody binding. It is reported
  to bind endothelin-1 and the signal peptide of VEGF-A - but not mature VEGF-A - and to
  trigger intracellular phosphorylation events overlapping only partly with VEGFR2 signalling;
  the rat orthologue was originally described as also binding angiotensin II, an activity not
  found in mouse or human. Mice lacking the gene die in mid-gestation with impaired
  angiogenesis and disordered neuroepithelial development. Protein-level detection rests on
  monoclonal antibodies rather than mass spectrometry, and the receptor pharmacology has not
  been taken up independently of the originating laboratory, so both the existence and the
  ligand specificity of the protein remain contested.
existing_annotations:
- term:
    id: GO:0004962
    label: endothelin receptor activity
  evidence_type: IDA
  original_reference_id: PMID:24465725
  qualifier: enables
  review:
    summary: >-
      Anti-DEspR monoclonal antibody binding to DEspR-expressing Cos1 transfectants and to
      Panc1 cancer stem-like cells is displaced by endothelin-1, and ET-1 addition elicits a
      distinct intracellular phosphorylation signature, supporting an ET-1-binding,
      signal-transmitting surface protein.
    action: MODIFY
    reason: >-
      The experiments support ET-1 binding and ligand-initiated transmembrane signalling, and
      that claim is kept. The term itself, however, is defined as "Combining with endothelin
      and transmitting the signal across the membrane by activating an associated G-protein;
      promotes the exchange of GDP for GTP on the alpha subunit of a heterotrimeric G-protein
      complex". No G-protein coupling has been demonstrated for this 85-residue single-pass
      protein: the original rat study showed Ca2+ mobilisation (PMID:9508787) and the human
      study phosphoproteomics (PMID:24465725), neither a GDP/GTP exchange assay. The
      endothelin field also does not list DEspR among endothelin receptors - the IUPHAR review
      states that only ETA and ETB are recognised (PMID:26956245), and two further reviews note
      that the pharmacology of this receptor has not been developed and that the data come
      from a single laboratory (PMID:19907001, PMID:21081213). Rather than remove an
      experimental annotation whose full text was read by the curator, the claim is restated
      with terms that do not assert G-protein coupling.
    proposed_replacement_terms:
    - id: GO:0004888
      label: transmembrane signaling receptor activity
    - id: GO:0017046
      label: peptide hormone binding
    additional_reference_ids:
