- id: PMID:9508787
  title: Molecular characterization of a dual endothelin-1/Angiotensin II receptor.
  findings:
  - statement: >-
      A rat brain cDNA isolated with antisense oligonucleotide probes was reported to encode a
      single-transmembrane polypeptide with separate ET-1 and angiotensin II binding domains,
      coupling both ligands to Ca2+ mobilisation.
    supporting_text: Structural analysis revealed a receptor
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: >-
      PubMed-verified original characterisation of the rat orthologue (Mol Med 1998),
      abstract-only in cache. The angiotensin II half of the dual-receptor claim was
      subsequently restricted to the Dahl salt-sensitive rat and does not hold in mouse or
      human (UniProt CAUTION, PMID:16293765), and the receptor identification rests on a
      sequence-complementarity hypothesis rather than on expression cloning.
- id: PMID:16293765
  title: 'Embryonic lethality in Dear gene-deficient mice: new player in angiogenesis.'
  findings:
  - statement: >-
      Mouse Dear binds ET-1 and the VEGF signal peptide with comparable affinities but does not
      bind angiotensin II, and Dear-null mice die by embryonic day 12.5 with impaired
      angiogenesis and disordered neuroepithelial development.
    supporting_text: to Dahl R/JRHS rat Dear, but binds ET-1 and vascular endothelial growth
      factor
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Physiol Genomics 2005), abstract-only in cache. Source of the
      reassignment of the second ligand from angiotensin II to the VEGF signal peptide, and of
      the knockout phenotype; mouse data, and no ISS row to the human entry exists in GOA.
- id: PMID:17446437
  title: 'Association of ATP1A1 and dear single-nucleotide polymorphism haplotypes
    with essential hypertension: sex-specific and haplotype-specific effects.'
  findings:
  - statement: >-
      SNP haplotypes at human ATP1A1 and at the DEAR locus associate with essential
      hypertension in a Sardinian case/control cohort, with sex-specific effects.
    supporting_text: Here we report the association of human ATP1A1 (P<0.000005) and Dear (P<0.03)
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: >-
      PubMed-verified citation (Circ Res 2007), abstract-only in cache. The abstract describes
      a genetic association study with no protein-interaction experiment, yet GOA uses it as
      the IPI reference for protein binding with EDN1 and VEGFA, and UniProt cites it for the
      dual-ligand FUNCTION statement. Full text was not available here, so the interaction
      evidence it is said to carry could not be checked.
- id: PMID:19907001
  title: 'Endothelin receptors: what''s new and what do we need to know?'
  findings:
  - statement: >-
      The DEAR polypeptide is atypical among endothelin receptors in having a single
      transmembrane region, and its pharmacology and physiology have not been developed.
    supporting_text: The pharmacology and physiology of DEAR has not been developed.
    reference_section_type: RESULTS
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full text in cache; an endothelin-field review that describes DEAR without endorsing it
      as an established receptor. Used for the state-of-the-field caveat, not for function.
- id: PMID:21081213
  title: The cardiovascular physiology and pharmacology of endothelin-1.
  findings:
  - statement: >-
      Mouse DEAR binds ET-1 and the VEGF signal peptide rather than angiotensin II, and all the
      DEAR data derive from a single research group whose physiology and pharmacology have not
      been studied in depth.
    supporting_text: All these data come from one group of scientists, and the physiology and
      pharmacology of DEAR has not been studied in depth.
    reference_section_type: RESULTS
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full text in cache; independent review summarising the DEAR literature and stating its
      single-laboratory provenance. Basis for the DISPUTED framing of the receptor rows.
- id: PMID:24465725
  title: 'DEspR roles in tumor vasculo-angiogenesis, invasiveness, CSC-survival and
    anoikis resistance: a ''common receptor coordinator'' paradigm.'
  findings:
  - statement: >-
      Anti-DEspR antibody binding to DEspR-expressing Cos1 transfectants and to Panc1 cancer
      stem-like cells is displaced by endothelin-1 and by the VEGF-A signal peptide, and each
      ligand elicits a distinct phosphoprotein signature that overlaps only partly with
      VEGF-VEGFR2 signalling.
    supporting_text: Collectively, these findings support the functionality of VEGFsp- and
      ET1-binding to DEspR.
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: >-
      PubMed-verified (PLoS One 2014, with a 2014 erratum), full text in cache. Source of five
      of the nine GOA rows. The experiments are internally consistent, but they are
      ligand-displacement and phosphoproteomic assays from the originating laboratory; no
      radioligand binding constants for the human protein, no G-protein coupling assay, and no
      independent replication of the receptor function.
- id: PMID:26956245
  title: Endothelin.
  findings:
  - statement: >-
      The IUPHAR review of the endothelin system recognises only two endothelin receptors, ETA
      and ETB, and reports no further Family A GPCRs that bind endothelin peptides.
    supporting_text: Current evidence only supports the existence of two subtypes, ETA and ETB,
      according to NC-IUPHAR nomenclature
    reference_section_type: RESULTS
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full text in cache. Authoritative statement that the field does not count DEspR as an
      endothelin receptor. Note the scope of the quoted sentences is Family A GPCRs, so they do
      not directly test an 85-residue single-pass protein; cited as field consensus, not as a
      refutation.
- id: PMID:27301377
  title: Confirmation of translatability and functionality certifies the dual endothelin1/VEGFsp
    receptor (DEspR) protein.
  findings:
  - statement: >-
      Anti-DEspR monoclonal antibodies against two distinct epitopes detect the same 17.5 kDa
      glycosylated protein in pull-downs from isolated cell membranes, which is deglycosylated
      by PNGase F, while mass spectrometry of the same pull-downs does not detect DEspR
      peptides.
    supporting_text: We note that although DEspR was detected consistently in denatured
      conditions via Western blot analysis of membrane protein pull-down products using 5g12e8
      and 6g8g7 anti-DEspR mAbs, MS did not detect DEspR-specific peptides.
    reference_section_type: DISCUSSION
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: >-
      PubMed-verified (BMC Mol Biol 2016), full text in cache. The paper is explicitly a
      rebuttal of the pseudogene/lncRNA designation of this locus and is the basis of the
      UniProt PE1 rating; its protein-existence evidence is antibody-based and the authors
      report that mass spectrometry failed to detect the protein, which they attribute to the
      known difficulty of small glycosylated single-transmembrane proteins.
- id: PMID:33853558
  title: Humanized anti-DEspR IgG4(S228P) antibody increases overall survival in a
    pancreatic cancer stem cell-xenograft peritoneal carcinomatosis rat(nu/nu) model.
  findings:
  - statement: >-
      Anti-DEspR antibodies bind the surface of pancreatic tumour and cancer stem-like cells and
      are internalised, and CRISPR/Cas9 knockout of ADAR1 abolishes DEspR protein expression,
      attributing the reference-genome stop codon at position 14 to A-to-I RNA editing.
    supporting_text: Blocking anti-DEspR murine precursor and humanized antibodies bind
      cell-surface DEspR, internalize, and co-translocate with gal1/gal3 nuclear shuttling
      proteins to the nucleus, subsequently inducing apoptosis in vitro and in vivo.
    reference_section_type: DISCUSSION
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (BMC Cancer 2021), full text in cache. Cited here for surface
      localisation and for the RNA-editing mechanism that UniProt records; the therapeutic
      efficacy claims are outside the scope of this review.
- id: PMID:34789851
  title: DEspR(high) neutrophils are associated with critical illness in COVID-19.
  findings:
  - statement: >-
      Flow cytometry of fresh whole blood detects cell-surface DEspR on a subset of circulating
      neutrophils, whose abundance tracks with COVID-19 severity.
    supporting_text: To determine the cell surface expression of DEspR on circulating immune
      cells, we used flow cytometric analysis.
    reference_section_type: RESULTS
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Sci Rep 2021), full text in cache. A second laboratory detecting the
      protein at the cell surface in a different cell type, which strengthens the
      plasma-membrane annotation; note the originating investigators are co-authors, so this is
      a collaboration rather than fully independent replication, and it tests localisation
      only, not ligand binding.
core_functions:
- description: >-
    Cell-surface single-pass membrane protein that binds extracellular peptide ligands -
    endothelin-1 and the signal peptide of VEGF-A, but not mature VEGF-A - and transmits a
    signal into the cell, producing a phosphorylation response that includes FAK, PKC-alpha and
    ERK1/2 and that is only partly shared with VEGFR2 signalling. No G-protein coupling has
    been demonstrated, so the activity is recorded as a transmembrane signalling receptor
    rather than as an endothelin receptor, and the whole activity rests on work from one
    laboratory.
