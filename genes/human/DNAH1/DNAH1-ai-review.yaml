id: Q9P2D7
gene_symbol: DNAH1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  DNAH1 (dynein axonemal heavy chain 1; also HDHC7/DNAHC1, mouse ortholog Mdhc7/Dnah1) is
  a 4265-residue heavy chain of a single-headed inner dynein arm (IDA) of the motile axoneme.
  It has the usual dynein heavy chain layout: an N-terminal stem that anchors it within the
  arm, and a motor head of six AAA modules (four with ATP-binding P-loops) with a coiled-coil
  stalk that carries the microtubule-binding domain. Like other axonemal dyneins it is expected
  to use ATP to generate force toward microtubule minus ends, driving doublet sliding. DNAH1
  is expressed mainly in testis and trachea. In human sperm it lies along the whole flagellum,
  and in respiratory epithelium along the full length of the ciliary axoneme, where PCD studies
  assign it to IDA d. It associates with the axonemal light intermediate chain DNALI1, and
  with the flagellar proteins TTC29 and ZMYND12; DNALI1, DNAH3 and DNAH12 are each needed
  for DNAH1 to reach the sperm flagellum. Biallelic DNAH1 loss of function in men causes asthenoteratozoospermia
  with multiple morphological abnormalities of the sperm flagella (MMAF; spermatogenic failure
  18), with loss of inner dynein arms, disorganized doublets and frequent loss of the central
  pair, usually without respiratory disease. One consanguineous family with a homozygous missense
  variant had primary ciliary dyskinesia (CILD37). Dnah1-null mice are infertile, with poorly
  progressive sperm and a roughly 50% reduction in tracheal ciliary beat frequency, but their
  axonemes look grossly normal, possibly because a shorter Dnah1 isoform partly substitutes.
  DNAH1 therefore acts as a force-generating IDA motor whose loss most strongly affects the
  sperm flagellum.
