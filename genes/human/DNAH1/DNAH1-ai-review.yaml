core_functions:
- description: >-
    ATP-driven, minus-end-directed microtubule motor heavy chain of a single-headed inner
    dynein arm (IDA d). Within the sperm flagellar axoneme it generates sliding force needed
    for normal flagellar beating, and it is required for the inner dynein arms to assemble
    there. It also sits along respiratory ciliary axonemes, where its loss reduces beat frequency
    in mice.
  molecular_function:
    id: GO:0008569
    label: minus-end-directed microtubule motor activity
  directly_involved_in:
  - id: GO:0030317
    label: flagellated sperm motility
  locations:
  - id: GO:0036126
