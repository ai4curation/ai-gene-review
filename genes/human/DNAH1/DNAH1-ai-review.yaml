suggested_questions:
- question: >-
    Why does DNAH1 loss disrupt the whole axoneme (including the central pair) in human sperm
    but leave mouse axonemes grossly intact? Does the short Dnah1 isoform described in mice
    exist and compensate in human testis?
- question: >-
    Why is DNAH1 deficiency mostly confined to the sperm flagellum in humans, when the protein
    is present along respiratory ciliary axonemes? Is the single PCD family (CILD37, p.Lys1154Gln)
    a distinct allele class, or is another heavy chain compensating in respiratory cilia?
- question: >-
    What is the order of assembly among DNAH1, DNALI1, DNAH3, DNAH12, TTC29 and ZMYND12 in
    the sperm IDA, given that each of the others is needed for DNAH1 to reach the flagellum?
- question: >-
    The ferf1 missense allele gives motile but zona-penetration-defective sperm. Does this
    reflect a change in waveform (hyperactivation) rather than in basic motility?
suggested_experiments:
- description: >-
    Cryo-ET of the 96-nm repeat in DNAH1-mutant human sperm and Dnah1-null mouse sperm, to
    confirm that DNAH1 is the IDA d heavy chain and to measure which other arms are lost secondarily.
  experiment_type: cryo-electron tomography
- description: >-
    Recombinant DNAH1 motor domain in microtubule gliding and ATPase assays, including the
    CILD37 p.Lys1154Gln and ferf1 variants, to test direct effects on motor activity.
  experiment_type: in vitro motility assay
