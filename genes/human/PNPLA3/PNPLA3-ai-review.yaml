- term:
    id: GO:0004806
    label: triacylglycerol lipase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: Triacylglycerol lipase activity, the activity PNPLA3 shares with its closest paralogue PNPLA2/ATGL.
    action: ACCEPT
    reason: Core molecular function. TG hydrolysis by purified PNPLA3 has been measured independently
      by four groups (Jenkins 2004, He 2010, Huang 2011, Wang 2025); the I148M substitution reduces it
      by ~80% and the activity is stimulated by ABHD5/CGI-58 exactly as ATGL's is. Johnson et al. add
      a substrate preference for polyunsaturated triacylglycerols and an in vivo readout. What is contested
      is not whether PNPLA3 is a lipase but how much the lipase step matters - Pnpla3-null mice show no
      hepatic phenotype even on lipogenic diets, and Wang et al. argue that the loss of catalytic activity
      in 148M is not what causes steatosis. Retained as core because the activity is directly and repeatedly
      demonstrated.
    supported_by:
    - reference_id: PMID:20034933
      supporting_text: In vitro assays using recombinant PNPLA3 partially purified from Sf9 cells confirmed
        that the wild type enzyme hydrolyzes emulsified triglyceride and that the I148M substitution abolishes
        this activity.
