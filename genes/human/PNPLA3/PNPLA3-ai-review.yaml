- term:
    id: GO:0003841
    label: 1-acylglycerol-3-phosphate O-acyltransferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: 1-acylglycerol-3-phosphate O-acyltransferase (LPAAT) activity, one side of a direct experimental
      contradiction.
    action: MARK_AS_OVER_ANNOTATED
    reason: PNPLA3 was reported to be a CoA-dependent lysophosphatidic acid acyltransferase (LPA + acyl-CoA
      -> phosphatidic acid) by Kumari et al., who also found the activity increased rather than decreased
      by I148M. Huang et al. assayed the same reaction with purified and with immunoisolated PNPLA3, using
      CGI-58 as a positive control, and detected none. A protein cannot physiologically be both the hydrolase
      and the synthetase of the same acyl linkage, and GOA currently asserts both. Separately, the GOA
      row carrying this term with evidence code EXP cites PMID:21878620 - the paper reporting the negative
      result - with a plain enables qualifier; that annotation looks like it should either carry NOT or
      cite a different reference, and it is traceable to UniProt's EC 2.3.1.51 block, which tags both
      PubMed:21878620 and PubMed:22560221 as ECO:0000269 evidence although only the latter is positive.
