- id: PMID:21878620
  title: Expression and characterization of a PNPLA3 protein isoform (I148M) associated with nonalcoholic
    fatty liver disease.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (J Biol Chem 2011;286:37085-93), full text available. The most complete
      substrate survey of purified PNPLA3. It reports the glycerolipid hydrolase activities and explicit
      negatives for GPAT, LPAAT, DGAT, phospholipids, cholesteryl esters and retinyl esters. The citation
      itself is correct; what is wrong is GOA's use of it as EXP evidence for GO:0003841, a reaction this
      paper could not detect.
- id: PMID:22560221
  title: Adiponutrin functions as a nutritionally regulated lysophosphatidic acid acyltransferase.
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: PubMed-verified (Cell Metab 2012;15:691-702). Correctly cited, but the central claim
      - that PNPLA3 is a CoA-dependent LPA acyltransferase, and that I148M increases that activity - is
      directly contradicted by PMID:21878620, which assayed the same reaction with CGI-58 as a positive
      control and detected nothing. The disagreement also runs the opposite way on the direction of the
      variant's effect. Retained; the annotations derived from it are marked over-annotated rather than
      removed.
- id: PMID:23398201
  title: PNPLA3/adiponutrin functions in lipid droplet formation.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified (Biol Cell 2013;105:219-233). Cached record is abstract-only. Supports
      lipid droplet targeting and the effect of PNPLA3 dosage on droplet size; also an early report that
      co-expressed ABHD5/CGI-58 reverses PNPLA3-induced droplet enlargement.
- id: PMID:24511104
  title: PNPLA3 mediates hepatocyte triacylglycerol remodeling.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (J Lipid Res 2014;55:739-46). The cellular evidence for acyl-chain remodelling,
      and for the shift of I148M protein towards lipid droplets.
- id: PMID:38844467
  title: PNPLA3 is a triglyceride lipase that mobilizes polyunsaturated fatty acids to facilitate hepatic
    secretion of large-sized very low-density lipoprotein.
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: PubMed-verified (Nat Commun 2024;15:4847). Not cited by any current GOA row; added here
      because it is the loss-of-function pole of the dispute. Its in vivo findings - hepatic Pnpla3 knockout
      aggravating steatosis and lowering VLDL-TG - are explicitly contradicted by PMID:39550037, which
      reports no hepatic phenotype in Pnpla3-null mice and increased rather than decreased phospholipid
      PUFA in 148M animals. Cited as one side of an open disagreement.
- id: PMID:39550037
  title: PNPLA3(148M) is a gain-of-function mutation that promotes hepatic steatosis by inhibiting ATGL-mediated
    triglyceride hydrolysis.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (J Hepatol 2025;82:871-881), full text available. The strongest current
      evidence for the ABHD5-sequestration model, and also the first demonstration that ABHD5 directly
      activates PNPLA3's own TG hydrolase activity. Its central claim is a gain-of-function interpretation
      that PMID:38844467 rejects, so it is scientifically contested even though the citation is sound.
- id: PMID:39814233
  title: Lipid droplet targeting of the lipase coactivator ABHD5 and the fatty liver disease-causing variant
    PNPLA3 I148M is required to promote liver steatosis.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (J Biol Chem 2025;301:108186), full text available. Independent support
      for the ABHD5 interaction and for lipid droplet targeting being required for it. Reports greater
      association of I148M than wild-type PNPLA3 with ABHD5, which PMID:39550037 attributes largely to
      higher I148M protein levels.
- id: PMID:39892821
  title: 'Loss or gain of function: The functional complexity of the PNPLA3 I148M variant.'
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified (J Hepatol 2025;82:778-780), an editorial accompanying PMID:39550037.
      PubMed holds no abstract and no full text is available, so it is cited only as evidence that the
      loss-of-function versus gain-of-function question is recognised as unresolved by the field, with
      no supporting_text quoted from it.
  full_text_unavailable: true
- id: PMID:41046517
  title: PNPLA3-I148M is a neomorph that interferes with two primary hepatic triglyceride clearance pathways.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (Cell Rep 2025;44:116371). Cached record is abstract-only, so claims
      are anchored to the abstract. Proposes a third mechanism distinct from both loss- and gain-of-function,
      converging on ABHD5/CGI-58 and adding impaired ApoB/VLDL secretion.
