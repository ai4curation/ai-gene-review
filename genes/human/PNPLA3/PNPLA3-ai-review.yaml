- term:
    id: GO:0051265
    label: diolein transacylation activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: Phylogenetic assertion of CoA-independent transacylase activity.
    action: ACCEPT
    reason: Directly measured for purified PNPLA3 by Jenkins et al. and consistent with the cellular acyl-chain
      remodelling phenotype reported by Ruhanen et al. This is a CoA-independent acyl transfer between
      acylglycerols, and is therefore not in conflict with the hydrolase activity the way the acyl-CoA-dependent
      LPAAT claim is; both can be run by the same Ser47 nucleophile with water or an acylglycerol hydroxyl
      as the acceptor. Secondary to TAG hydrolysis but not an over-annotation. The node is seeded by PNPLA3's
      own experimental annotation, which is the expected marker of experimental grounding rather than
      circularity.
    supported_by:
    - reference_id: PMID:15364929
      supporting_text: iPLA2epsilon, iPLA2zeta, and iPLA2eta also possess acylglycerol transacylase activity
        utilizing mono-olein as an acyl donor which, in the presence of mono-olein or diolein acceptors,
        results in the synthesis of diolein and triolein, respectively.
