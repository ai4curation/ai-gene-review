core_functions:
- molecular_function:
    id: GO:0004806
    label: triacylglycerol lipase activity
  description: PNPLA3 hydrolyses acyl esters of glycerol at the lipid droplet surface using a Ser47/Asp166
    catalytic dyad, acting on triacylglycerol, diacylglycerol and monoacylglycerol with a preference for
    oleate and for polyunsaturated acyl chains, and it can resolve the acyl-enzyme intermediate onto another
    acylglycerol instead of water, giving CoA-independent transacylation. The net job in a hepatocyte
    is fatty-acid-selective remodelling of the triacylglycerol pool rather than bulk lipolysis. The activity
    is stimulated by ABHD5/CGI-58, as ATGL's is, and is reduced roughly fivefold by the I148M substitution.
    Its quantitative importance in vivo is disputed - Pnpla3-null mice have no hepatic phenotype in one
    set of laboratories while another reports aggravated steatosis and reduced VLDL-triglyceride secretion
    on hepatic knockout.
  directly_involved_in:
  - id: GO:0019433
    label: triglyceride catabolic process
  - id: GO:0036153
    label: triglyceride acyl-chain remodeling
  locations:
  - id: GO:0005811
    label: lipid droplet
  - id: GO:0005789
    label: endoplasmic reticulum membrane
  supported_by:
  - reference_id: PMID:15364929
    supporting_text: we demonstrate that each possesses abundant TAG lipase activity
  - reference_id: PMID:21878620
    supporting_text: Maximal hydrolytic activity of PNPLA3 was observed against the three major glycerolipids,
      TAG, diacylglycerol, and monoacylglycerol, with a strong preference for oleic acid as the acyl moiety.
  - reference_id: PMID:38844467
    supporting_text: we show that PNPLA3 preferentially hydrolyzes polyunsaturated triglycerides, mobilizing
      polyunsaturated fatty acids for phospholipid desaturation and enhancing hepatic secretion of triglyceride-rich
      lipoproteins.
  - reference_id: PMID:39550037
    supporting_text: We concluded from these experiments that PNPLA3, as well as ATGL, is activated by
      ABHD5 and that this effect occurs in the absence of other proteins.
  - reference_id: PMID:24511104
    supporting_text: This study reveals a function of PNPLA3 in FA-selective TAG remodeling, resulting
      in increased TAG saturation.
- molecular_function:
    id: GO:0140311
    label: protein sequestering activity
  description: On the lipid droplet surface PNPLA3 binds ABHD5/CGI-58, the obligatory co-activator of
    the major triglyceride lipase ATGL/PNPLA2, more avidly than ATGL does, and competes with ATGL for
    it; PNPLA3 recruits and retains ABHD5 on droplets more effectively than ATGL can. The consequence
    is reduced ATGL-mediated triglyceride hydrolysis, so the molecular activity is sequestration of a
    lipase activator and the functional outcome is lipase inhibition. This is a property of wild-type
    PNPLA3, not only of the variant - I148M and wild-type protein bind ABHD5 with similar characteristics
    - but the variant escapes ubiquitin-mediated degradation and reaches roughly fortyfold higher levels
    on hepatic droplets, which is what converts the activity into steatosis. Whether wild-type PNPLA3
    at endogenous abundance measurably restrains ATGL in normal liver is not established, and this arm
    of PNPLA3 function is currently absent from GO annotation altogether.
  directly_involved_in:
  - id: GO:0010897
    label: negative regulation of triglyceride catabolic process
  locations:
  - id: GO:0005811
    label: lipid droplet
  supported_by:
  - reference_id: PMID:39550037
    supporting_text: ABHD5 interacted preferentially with PNPLA3 relative to ATGL in cultured hepatocytes.
  - reference_id: PMID:39550037
    supporting_text: luciferase reconstitution assays were used in cultured hepatocytes to show that ABHD5
      binds preferentially to PNPLA3 over ATGL
  - reference_id: PMID:39550037
    supporting_text: These findings support the premise that PNPLA3(148M) is a gain-of-function mutation
      that promotes hepatic steatosis by accumulating on lipid droplets and inhibiting ATGL-mediated lipolysis
      in an ABHD5-dependent manner.
  - reference_id: PMID:39814233
    supporting_text: PNPLA3 148M functions to sequester ABHD5 and prevent coactivation of PNPLA2, which
      has implications for initiating MASLD
  - reference_id: PMID:41046517
    supporting_text: 'We propose that I148M is a neomorph that exacerbates fatty liver risk by simultaneously
      impeding two major CGI-58-dependent pathways for liver triglyceride clearance: lipolysis and secretion.'
proposed_new_terms:
- proposed_name: lipase activator sequestering activity
  proposed_definition: Binding to a protein that activates a lipase, preventing that activator from interacting
    with the lipase and thereby reducing lipase activity.
  justification: PNPLA3 reduces ATGL/PNPLA2-mediated triglyceride hydrolysis without binding ATGL, by
    out-competing it for the co-activator ABHD5/CGI-58 on the lipid droplet surface. Neither existing
    term is a good fit on its own - GO:0055102 lipase inhibitor activity implies binding the lipase itself,
    while GO:0140311 protein sequestering activity says nothing about what the sequestration achieves.
    A term with both as parents would let this widely replicated mechanism be annotated as a molecular
    function instead of being invisible in GOA, and would also serve other droplet proteins reported to
    titrate ABHD5, such as the perilipins.
  proposed_parent:
    id: GO:0140311
    label: protein sequestering activity
  supported_by:
  - reference_id: PMID:39550037
    supporting_text: ABHD5 interacted preferentially with PNPLA3 relative to ATGL in cultured hepatocytes.
  - reference_id: PMID:39814233
    supporting_text: PNPLA3 148M functions to sequester ABHD5 and prevent coactivation of PNPLA2, which
      has implications for initiating MASLD
suggested_questions:
- question: Is PNPLA3's physiologically relevant molecular function catalytic at all? Its triglyceride
    hydrolase activity is well measured in vitro but dispensable in Pnpla3-null mice, while its competition
    with ATGL for ABHD5/CGI-58 accounts for the human genetic signal. If the sequestration arm is the
    dominant one, the appropriate molecular function is an enzyme-regulator term rather than a hydrolase
    term.
  experts:
  - Helen H Hobbs
  - Jonathan C Cohen
  - David E Cohen
  - Raymond J Deshaies
- question: Is PNPLA3 an acyltransferase? Kumari et al. report a CoA-dependent lysophosphatidic acid acyltransferase
    activity and Huang et al. report none for the same reaction with CGI-58 as a positive control. GOA
    currently asserts both the hydrolysis and the synthesis of the same acyl linkage. What accounts for
    the discrepancy - protein preparation, detergent state, or assay configuration?
  experts:
  - Rudolf Zechner
  - Robert Zimmermann
  - Helen H Hobbs
- question: Why does GOA carry GO:0003841 1-acylglycerol-3-phosphate O-acyltransferase activity with evidence
    code EXP and PMID:21878620 as the reference, without a NOT qualifier, when that paper reports the
    reaction as undetectable? Should the annotation be negated or re-referenced, and should UniProt's
    EC 2.3.1.51 evidence block stop citing PubMed:21878620?
  experts: []
- question: Does wild-type PNPLA3, at its endogenous abundance, measurably restrain ATGL-mediated lipolysis
    in normal liver, or does the sequestration effect only become significant when I148M accumulates on
    droplets? This decides whether the ABHD5-sequestration molecular function belongs to the gene product
    or only to the variant.
  experts:
  - Helen H Hobbs
  - James G Granneman
  - Emilio P Mottillo
- question: How can hepatic Pnpla3 knockout aggravate steatosis and reduce VLDL-triglyceride secretion
    in one laboratory while Pnpla3-null mice show hepatic triglyceride comparable to wild type, even on
    high-carbohydrate diets, in another? Dietary composition has been suggested but not tested head to
    head.
  experts:
  - Jun Liu
  - Helen H Hobbs
  - Jonathan C Cohen
- question: Does PNPLA3 have measurable phospholipase A2 activity, or is the 'iPLA2-epsilon' designation
    purely a sequence-motif classification? Huang et al. found little or no hydrolysis of phospholipids
    by purified PNPLA3.
  experts:
  - Richard W Gross
  - Christopher M Jenkins
suggested_experiments:
- hypothesis: The physiologically decisive activity of PNPLA3 is sequestration of ABHD5, not its own triglyceride
    hydrolase activity.
  description: Generate knock-in mice carrying a PNPLA3 allele that is catalytically dead (S47A) but retains
    ABHD5 binding, and a separate allele that retains full hydrolase activity but carries C-terminal substitutions
    that abolish lipid droplet targeting and hence the ABHD5 interaction, each on both the wild-type and
    the 148M background. Phenotype hepatic triglyceride, VLDL-triglyceride secretion and ATGL-dependent
    lipolysis on a high-sucrose diet. If steatosis tracks with ABHD5 binding and not with catalysis, the
    enzyme-regulator function is the physiological one.
  experiment_type: Separation-of-function knock-in mouse genetics
- hypothesis: The disagreement over lysophosphatidic acid acyltransferase activity is an assay artefact
    rather than a real difference in the protein.
  description: Run a blinded head-to-head assay in which the Zechner and Hobbs laboratory preparations
    of recombinant PNPLA3 and PNPLA3-I148M are exchanged and each is assayed by both groups' protocols,
    with CGI-58 as a positive control and a catalytically dead S47A protein as a negative control, reading
    out phosphatidic acid formation by mass spectrometry rather than radiolabel incorporation alone. Include
    a parallel triglyceride hydrolase readout on the same preparations so that activity ratios rather
    than absolute rates are compared.
  experiment_type: Inter-laboratory blinded enzymology
- hypothesis: Wild-type PNPLA3 restrains ATGL at endogenous expression levels.
  description: In primary human hepatocytes from I148I homozygotes, titrate endogenous PNPLA3 with siRNA
    across a range that stays within physiological abundance, and measure ABHD5-dependent ATGL activity
    and triglyceride turnover with stable-isotope tracing under both fasted-like and lipogenic conditions.
    A dose-dependent increase in ATGL activity as wild-type PNPLA3 falls would establish the sequestration
    function for the wild-type protein.
  experiment_type: Graded knockdown with stable-isotope flux measurement
- hypothesis: PNPLA3 acts as a transacylase rather than a net lipase in intact hepatocytes.
  description: Use dual stable-isotope labelling (distinct labels on the glycerol backbone and on the
    acyl donor) in hepatocytes expressing wild-type PNPLA3, S47A and I148M to separate hydrolysis, re-esterification
    and direct acyl transfer, quantifying positional acyl-chain exchange in triacylglycerol without net
    change in triacylglycerol mass. This would establish whether GO:0051264 and GO:0051265 transacylation,
    rather than net lipolysis, describe what PNPLA3 does in cells.
  experiment_type: Dual-label lipid flux analysis
