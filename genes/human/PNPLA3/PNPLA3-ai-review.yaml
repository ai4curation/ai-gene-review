- term:
    id: GO:0140311
    label: protein sequestering activity
  evidence_type: IDA
  original_reference_id: PMID:39550037
  qualifier: enables
  review:
    summary: Proposed new annotation. PNPLA3 binds ABHD5/CGI-58 in preference to ATGL and competes with
      ATGL for it, retaining the co-activator on the lipid droplet surface and so limiting ATGL-mediated
      triglyceride hydrolysis.
    action: NEW
    reason: This activity is absent from GOA entirely, yet it is the molecular event on which all three
      current models of the I148M variant converge, and it has been demonstrated independently by two
      laboratories using luciferase complementation, co-immunoprecipitation, imaging and fluorescence
      cross-correlation spectroscopy. Wild-type and I148M protein bind ABHD5 with similar characteristics,
      so this is a property of the gene product rather than only of the variant; what the variant adds
      is roughly fortyfold greater abundance on hepatic droplets. GO:0140311 is the closest existing term
      - it describes binding a protein to prevent it interacting with other partners - but it does not
      record that the sequestered protein is a lipase activator, so a more specific child is proposed
      in proposed_new_terms. An enzyme-regulator term of this kind, rather than a hydrolase term, may
      be the correct representation of PNPLA3's physiologically decisive molecular function.
    supported_by:
    - reference_id: PMID:39550037
      supporting_text: ABHD5 interacted preferentially with PNPLA3 relative to ATGL in cultured hepatocytes.
    - reference_id: PMID:39550037
      supporting_text: luciferase reconstitution assays were used in cultured hepatocytes to show that
        ABHD5 binds preferentially to PNPLA3 over ATGL
    - reference_id: PMID:39814233
      supporting_text: Here, we demonstrate that LD targeting of both ABHD5 and PNPLA3 I148M is required
        for the interaction.
- term:
    id: GO:0010897
    label: negative regulation of triglyceride catabolic process
  evidence_type: IDA
  original_reference_id: PMID:39550037
  qualifier: involved_in
  review:
    summary: Proposed new annotation. By holding ABHD5 on the droplet surface, PNPLA3 lowers ATGL-dependent
      triglyceride hydrolysis; overexpressing ABHD5 reverses the hepatic steatosis of Pnpla3 148M knock-in
      mice.
    action: NEW
    reason: The biological consequence of the sequestration activity, and the step that links the molecular
      event to the human phenotype. Inhibition requires ATGL to be present and PNPLA3 to be on the lipid
      droplet, which is what distinguishes it from a simple loss of PNPLA3's own lipase activity. Note
      this sits alongside, and is not a contradiction of, the GO:0019433 triglyceride catabolic process
      annotations - PNPLA3 hydrolyses triglyceride itself while restraining the larger ATGL-dependent
      flux.
    supported_by:
    - reference_id: PMID:39550037
      supporting_text: These findings support the premise that PNPLA3(148M) is a gain-of-function mutation
        that promotes hepatic steatosis by accumulating on lipid droplets and inhibiting ATGL-mediated
        lipolysis in an ABHD5-dependent manner.
    - reference_id: PMID:41046517
      supporting_text: 'We propose that I148M is a neomorph that exacerbates fatty liver risk by simultaneously
        impeding two major CGI-58-dependent pathways for liver triglyceride clearance: lipolysis and secretion.'
