      it is not relied on here.
core_functions:
- description: >-
    GALNT1 initiates mucin-type O-glycosylation, transferring GalNAc from UDP-GalNAc in an
    alpha linkage onto serine and threonine residues of acceptor polypeptides to form the
    Tn antigen. It acts as a manganese-dependent type II membrane enzyme in the Golgi stack
    membrane, and its peptide acceptor preference, which overlaps only partly with those of
    the other nineteen human GalNAc-transferases, helps determine which sites on a substrate
    are glycosylated.
  molecular_function:
    id: GO:0004653
    label: polypeptide N-acetylgalactosaminyltransferase activity
  directly_involved_in:
  - id: GO:0016266
    label: protein O-linked glycosylation via N-acetylgalactosamine
  locations:
  - id: GO:0000139
    label: Golgi membrane
  - id: GO:0032580
    label: Golgi cisterna membrane
  supported_by:
  - reference_id: PMID:9295285
    supporting_text: The enzymes have distinct but partly overlapping specificities with short
      peptide acceptor substrates
  - reference_id: PMID:9295285
    supporting_text: GalNAc-T1 and -T3 showed strict donor substrate specificities for UDP-GalNAc
suggested_questions:
- question: >-
    Should host glycosyltransferases acquire viral-process annotations when a pathway model
    includes them modifying a viral protein? GALNT1 carries viral protein processing solely
    because Reactome models it glycosylating SARS-CoV-2 ORF3a. The enzyme's activity is unchanged
    by the origin of its acceptor, and the same reasoning would give every constitutively
    expressed Golgi enzyme a virus-specific annotation.
- question: >-
    How should acceptor specificity be represented for the twenty human GalNAc-transferases?
    The family IBA correctly asserts the shared transferase activity, but what distinguishes
    these paralogues is which peptide sites each prefers, and that distinction is currently
    invisible in GO. This is the axis on which paralogue over-annotation in this family would
    occur.
- question: >-
    Should GO:0005576 be retained on GALNT1 at all? The annotation derives entirely from an
    evidence-free UniProt 'Secreted' keyword attached to a curated soluble-form chain, and
    the SPPL3 shedding work that characterises this phenomenon for Golgi enzymes validates
    GALNT2 rather than GALNT1. Only 2 of 10 human GALNT paralogues carry the term, so it is
    not a family-wide convention either.
suggested_experiments:
- description: >-
    Isoform-resolved glycoproteomics in cells lacking GALNT1 alone versus combinations of
    GALNT paralogues, to establish which O-glycosylation sites depend specifically on this
    enzyme rather than on the family as a whole.
- description: >-
    Quantify the functional significance of the secreted soluble GalNAc-T1 ectodomain: whether
    it is catalytically active in the extracellular space on physiological acceptors, or whether
    the extracellular region annotation reflects shedding without a function there.
