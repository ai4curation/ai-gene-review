  title: 'OpenScientist hypothesis report: GALNT1 has extracellular region (GO:0005576)'
  findings:
  - statement: >-
      Independent blinded assessment returned weakly supported and recommended downgrading
      the annotation to non-core or removing it, on the grounds that it is IEA-only, auto-derived
      from an evidence-free UniProt keyword, and unsupported by any GALNT1-specific experiment.
    supporting_text: UniProt attaches that "Secreted" keyword **without any PubMed evidence**
      of its own
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Run as a neutral function-assignment hypothesis; it overturned this review's earlier
      ACCEPT. Its checkable claims were verified independently: the absence of an ECO code
      on the UniProt Secreted line was confirmed in the local record, and PMID:35279766 was
      fetched and searched, confirming GALNT2 rather than GALNT1 as the validated shed substrate.
