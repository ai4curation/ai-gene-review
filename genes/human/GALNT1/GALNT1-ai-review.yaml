id: Q10472
gene_symbol: GALNT1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  GALNT1 (polypeptide N-acetylgalactosaminyltransferase 1, GalNAc-T1; EC 2.4.1.41) is a Golgi-resident
  type II membrane glycosyltransferase that catalyses the first and committed step of mucin-type
  O-glycosylation. It transfers N-acetylgalactosamine from UDP-GalNAc in an alpha linkage
  onto the hydroxyl group of serine or threonine residues in acceptor polypeptides, creating
  the Tn antigen (GalNAc-alpha1-O-Ser/Thr) from which all mucin-type O-glycans are subsequently
  built. Catalysis requires a divalent manganese ion coordinated by the GT-A fold, and the
  enzyme carries a C-terminal ricin-type lectin domain that recognises already-glycosylated
  substrate and contributes to the dense, ordered glycan arrays characteristic of mucins.
  GALNT1 is one of twenty human polypeptide GalNAc-transferases, an unusually large family
  whose members differ in tissue expression and in peptide acceptor preference; which sites
  on a given protein become glycosylated is determined by the particular repertoire of isoforms
  a cell expresses rather than by any one enzyme. GALNT1 itself is widely expressed and is
  strict for UDP-GalNAc as donor. The enzyme resides in the Golgi stack membrane, with a proteolytically
  released soluble ectodomain also found in the extracellular space, and it undergoes COPI-independent
  retrograde traffic to the endoplasmic reticulum.
