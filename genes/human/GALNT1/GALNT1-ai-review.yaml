    reason: >-
      Viral protein processing is a process of the viral replication cycle. GALNT1 does not
      acquire a new activity when its acceptor happens to be virally encoded; it performs
      the same GalNAc transfer it performs on host mucins, and the O-glycosylation it carries
      out is already annotated. Attributing the viral process to the host enzyme is the guilt-by-substrate
      pattern applied to an infection pathway model, and it would make a constitutively expressed
      Golgi enzyme appear in queries for virus-specific functions. The modification event
      itself is not disputed.
    supported_by: *id002
- term:
    id: GO:0030145
    label: manganese ion binding
  evidence_type: IDA
  original_reference_id: PMID:9295285
  qualifier: enables
  review:
    summary: >-
      Manganese ion binding assayed alongside the transferase activity. GalNAc-transferases
      have a GT-A fold with a DXD motif that coordinates a divalent metal, and UniProt records
      that the enzyme's N-terminal domain A (GT1 motif) is involved in manganese coordination
      and substrate binding.
    action: ACCEPT
    reason: >-
      A genuine cofactor requirement rather than incidental metal binding: Mn2+ coordination
      is mechanistically necessary for nucleotide-sugar donor positioning in this enzyme class.
      Correct and informative.
    supported_by: *id002
- term:
    id: GO:0032580
    label: Golgi cisterna membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0136
  review:
    summary: >-
      Mapped from the UniProt Golgi stack membrane subcellular-location keyword, which is
      the compartment UniProt assigns to the membrane-bound enzyme.
    action: ACCEPT
    reason: >-
      More specific than the general Golgi membrane term and directly supported by the UniProt
      location for this chain. Retaining both is appropriate, since they describe the same
      location at different granularity.
    supported_by: *id001
- term:
    id: GO:0033116
    label: endoplasmic reticulum-Golgi intermediate compartment membrane
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-9683760
  qualifier: located_in
  review:
    summary: >-
      From the Reactome reaction 'GalNAc is transferred onto 3a', part of the SARS-CoV-2 pathway,
      which models GALNT1 acting on the viral ORF3a protein in the ER-Golgi intermediate compartment.
    action: KEEP_AS_NON_CORE
    reason: >-
      Unlike the viral protein processing row, this is a location rather than a process claim,
      and GalNAc-transferases do cycle through the ERGIC. The compartment is plausible and
      specific to the modelled infection context, so it is worth keeping, but the enzyme's
      core functional location remains the Golgi stack membrane where its constitutive mucin-type
      substrates are glycosylated.
    supported_by: *id001
- term:
    id: GO:0048471
    label: perinuclear region of cytoplasm
  evidence_type: IDA
  original_reference_id: PMID:12506059
  qualifier: located_in
  review:
    summary: >-
      Perinuclear cytoplasmic localisation observed by immunofluorescence with the isoform-specific
      antibody panel, consistent with the juxtanuclear position of the Golgi ribbon in the
      epithelial cells examined.
    action: ACCEPT
    reason: >-
      Correct as an observation, and not in conflict with the Golgi annotations; the perinuclear
      region is where the Golgi sits in these cells. It is the least informative of this gene's
      location annotations, but it is accurate and reflects what was seen.
    supported_by: *id001
