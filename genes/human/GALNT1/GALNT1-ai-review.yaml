  review:
    summary: >-
      Phylogenetic propagation across a very large, well-sampled node: the WITH/FROM field
      spans ten Drosophila genes, six mouse genes, three C. elegans genes, Xenopus, rat and
      fourteen human GALNT paralogues. The polypeptide GalNAc-transferase family is ancient
      and its defining activity is shared across it.
    action: ACCEPT
    reason: >-
      The node placement is exceptionally well supported and the term is at the correct specificity
      for the family-level activity. The target's own accession appearing among the sources
      is expected: GALNT1's direct assays are among the descendant evidences the PAINT curator
      used, so its presence marks experimental grounding on the target rather than circularity.
      Note that this IBA asserts the shared family activity, not GALNT1's individual acceptor
      preference, which is what distinguishes the paralogues from one another.
