- term:
    id: GO:0005576
    label: extracellular region
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0243
  review:
    summary: >-
      Mapped from the UniProt Secreted subcellular-location keyword via GO_REF:0000044. UniProt
      records a curated 'Polypeptide N-acetylgalactosaminyltransferase 1 soluble form' chain
      (residues 41-559, PRO_0000012257) cleaved in the stem just after the transmembrane anchor,
      and the Secreted location is attached to that chain. On closer inspection that location
      line carries no evidence code at all, unlike the experimentally grounded lines elsewhere
      in the same entry, so the curated chain is the whole of the support.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      An earlier draft of this review accepted this row, reasoning that UniProt models the
      soluble form as a separate chain rather than as an alternative location for the intact
      enzyme, and that this made it a deliberate curatorial act rather than an artefact. That
      reasoning treated the chain as evidence of shedding when it is really an assertion of
      it. Three things count against the annotation. First, the UniProt 'Secreted' line has
      no ECO evidence code, so nothing in the entry points to an experiment. Second, no GALNT1-specific
      secretion or extracellular-localisation study could be found. Third, and most tellingly,
      the shedding mechanism that would justify the term has been characterised for this enzyme
      family, and GALNT1 is not among the enzymes it was shown for: SPPL3-mediated intramembrane
      proteolysis releases soluble Golgi enzymes into blood, and the GALNT family member validated
      by immunoblot as an SPPL3 substrate in that work is GALNT2. GALNT1 is not mentioned
      in it. The term is therefore not wrong in principle, since Golgi glycosyltransferases
      genuinely are shed, but as applied to this gene it runs ahead of the evidence. Retained
      rather than removed because the mechanism is real and a shed GALNT1 species remains
      plausible; marked over-annotated so it does not read as an established location.
    supported_by:
    - reference_id: PMID:35279766
      supporting_text: >-
        Secretion of soluble Golgi enzymes that are released from their membrane anchor by
        endoprotease activity is a wide-spread yet largely unexplored phenomenon
    - reference_id: PMID:35279766
      supporting_text: >-
        secretion of select novel substrates such as the key mucin-type O-glycosylation enzyme
        GALNT2 is dependent on endogenous SPPL3 protease activity
    - reference_id: file:human/GALNT1/GALNT1-hypotheses/function-hypothesis-go-0005576/openscientist.md
      supporting_text: UniProt attaches that "Secreted" keyword **without any PubMed evidence**
        of its own
- term:
    id: GO:0005789
    label: endoplasmic reticulum membrane
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-8849353
  qualifier: located_in
  review:
    summary: >-
      This row comes from the Reactome reaction 'Dynein drives COPI-independent retrograde
      traffic from the Golgi to the ER', in which GALNT1 appears as retrograde cargo. It records
      a compartment the protein passes into during retrograde transport, not the compartment
      in which it does its work.
    action: KEEP_AS_NON_CORE
    reason: >-
      Retrograde relocation of GalNAc-transferases to the ER is a real and biologically interesting
      phenomenon, so the annotation should not be discarded. But it describes a trafficking
      itinerary rather than the enzyme's functional site: UniProt places the active enzyme
      in the Golgi stack membrane, and every direct assay and localisation study concerns
      the Golgi pool. Kept as a genuine but non-core location.
    supported_by: *id001
