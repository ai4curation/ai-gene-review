    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:25416956
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q9UMX0
  review:
    summary: >-
      Yeast two-hybrid hit between SMIM2 and UBQLN1 from the HI-II-14 proteome-scale
      interactome map. Bare protein binding conveys no function.
    action: REMOVE
    reason: >-
      Ubiquilins are cytosolic chaperones that capture exposed transmembrane domains of
      membrane proteins (PMID:27345149). Binding of UBQLN1 to SMIM2's single hydrophobic
      helix in yeast is what that client-recognition activity predicts, so the hit tells us
      that SMIM2 has a transmembrane domain, not what SMIM2 does. No more informative
      molecular function is supported, so the row is removed rather than modified. Removal
      does not imply that the interaction is false.
    supported_by:
    - reference_id: PMID:25416956
      supporting_text: A proteome-scale map of the human interactome network.
    - reference_id: PMID:27345149
      supporting_text: We show that Ubiquilin family proteins bind transmembrane domains in
        the cytosol to prevent aggregation and temporarily allow opportunities for membrane
        targeting.
