description: >-
  SMIM2 (formerly C13orf44) is an 85-amino-acid protein with a single predicted helical
  transmembrane segment (residues 21-43) followed by a polar, disordered C-terminal tail
  (residues 51-85). It is classed as a single-pass membrane protein on the basis of this
  sequence feature; its membrane topology and the organelle in which it resides have not
  been determined experimentally. Its mRNA is largely restricted to testis. SMIM2 has its
  own protein family (InterPro IPR062622) with no characterized members. Its only reported
  partners are the cytosolic ubiquilins UBQLN1 and UBQLN2, which were found in
  proteome-scale yeast two-hybrid screens. No molecular function, biological process or
  loss-of-function phenotype has been reported.
existing_annotations:
- term:
