suggested_questions:
- question: >-
    Is SMIM2 translated in testis, and in which membrane does it reside? The protein has a
    single predicted transmembrane helix and testis-restricted mRNA, but neither its
    expression at the protein level in germ cells nor its organelle has been established.
suggested_experiments:
- hypothesis: SMIM2 is a germ-cell membrane protein required for spermatogenesis or sperm function.
  description: >-
    Raise an antibody or tag the endogenous locus in mouse to determine the cell stage and
    membrane compartment in which SMIM2 is expressed, and assess male fertility, sperm
    count and sperm morphology in a knockout.
  experiment_type: knockout mouse with localization
