  review:
    assessment: NPI
    confidence_score: 0
    error_type: PARALOG_OVERANNOTATION
    summary: >-
      Rank 2 (score 8.80). Vesicle scission is the membrane-fission step performed by dynamins and
      ESCRT machinery. HTT is a HEAT/ARM solenoid scaffold with no enzymatic activity and no fission
      role; its vesicular function is coupling cargo to dynein/dynactin motors, which is a different
      physical operation on the same organelles.
