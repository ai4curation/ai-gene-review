description: >-
  ProTrek sequence-to-text retrieval for huntingtin. Top-1 scores 10.00 and the rest fall to 8.18
  - the second-lowest band in the cohort, alongside LRRK2, TOR1 and BRCA2, the other very large multi-domain
  proteins. The free-text channel scores 8.85 and returns a GC-box transcriptional activator and an
  origin recognition complex subunit, neither related. None of this review's four core functions -
  autophagy scaffolding, motor-adaptor coupling, ciliogenesis, spindle orientation - is retrieved,
  although rank 5 lands on cilium assembly by coincidence of vocabulary rather than of evidence. Assessment:
  1 uncertain (UNC), 2 nonparalog incorrect (NPI).
