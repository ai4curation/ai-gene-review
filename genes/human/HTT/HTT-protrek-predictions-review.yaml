  review:
    assessment: UNC
    confidence_score: 1
    summary: >-
      Top-ranked hit (score 10.00, at the abstention boundary identified in the other cohort). The
      omegasome is the PI3P-enriched ER subdomain from which autophagosomes form, and HTT is a scaffold
      for selective autophagy that assembles ULK1 and p62 - so the compartment is in the right pathway.
      But HTT is not an omegasome constituent, the call is not annotated, and at this score the list
      carries little information. A near-miss on the right biology; left uncertain.
