      reference_id: file:human/TMEM216/TMEM216-deep-research-falcon.md
      supporting_text: It is **not established as an enzyme, an ion transporter, or a transporter with
        a defined substrate**; the domain annotation predicts membrane topology, not catalytic or substrate
        specificity.
