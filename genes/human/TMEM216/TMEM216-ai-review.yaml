  review:
    summary: TMEM216 localizes to the ciliary base and the transition zone as an MKS-module membrane protein.
    action: ACCEPT
    reason: Core location. Mouse Tmem216 is found at the TZ/basal body (Garcia-Gonzalo 2011), human TMEM216
      at the ciliary base (Lee 2012; Valente 2010), and MKS-complex components including TMEM216 sit between
