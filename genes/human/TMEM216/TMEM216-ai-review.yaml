suggested_questions:
- question: Is TMEM216 a stoichiometric core subunit of the mammalian MKS complex (as MKS-2 is in C. elegans)
    or a peripheral, substoichiometric member, as suggested by its weak co-purification with TCTN1?
  experts: []
- question: What is the functional relationship between the TMEM216 vesicle pool (with TMEM138/TRAPPII)
    and its transition-zone pool, i.e. is TMEM216 delivered to the TZ on these vesicles?
  experts: []
suggested_experiments:
- hypothesis: TMEM216 is required for transition-zone ultrastructure (Y-links/necklace) in mammalian cells,
    as MKS-module members are in C. elegans.
  description: Generate TMEM216 knockout RPE1 or IMCD3 cells and assess TZ ultrastructure by cryo-ET/EM,
    TZ recruitment of TMEM67, TCTN1/2, TMEM231 and MKS1 by super-resolution microscopy, and ciliary membrane
    diffusion by FRAP.
  experiment_type: knockout + ultrastructure/imaging
