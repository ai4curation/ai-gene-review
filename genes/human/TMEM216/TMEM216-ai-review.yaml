    - &id004
      reference_id: PMID:21725307
      supporting_text: Tmem216 occasionally localized to the transition zone, but more typically localized
        to the basal body or axoneme.
    - &id005
      reference_id: PMID:26982032
      supporting_text: Since MKS-1/MKSR-1/MKSR-2/MKS-2/TMEM-231 all depend on each other for their TZ
        localisation
