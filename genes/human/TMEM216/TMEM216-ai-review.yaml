  review:
    summary: High-confidence interaction of TMEM216 with TMEM107 reported in a study defining TMEM107
      as an MKS-module transition zone protein.
    action: REMOVE
    reason: Generic protein binding is uninformative; the TMEM107 association reflects co-membership of
      the MKS transition-zone module, which is already captured by the MKS complex (GO:0036038) and ciliary
      transition zone annotations. Removal does not dispute the interaction. No specific molecular activity
      can be inferred from it.
    supported_by:
    - reference_id: PMID:26595381
      supporting_text: Furthermore, nematode TMEM-107 occupies an intermediate layer of the TZ-localized
        MKS module by organizing recruitment of the ciliopathy proteins MKS-1, TMEM-231 (JBTS20) and JBTS-14
        (TMEM237).
