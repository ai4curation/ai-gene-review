id: Q9P0N5
gene_symbol: TMEM216
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: TMEM216 is a small tetraspan transmembrane protein of the MKS (tectonic) module of the ciliary
  transition zone. It localizes to the ciliary base/transition zone between the axonemal microtubules
  and the ciliary membrane, and also marks post-Golgi vesicles that move toward the ciliary base together
  with TMEM138-positive vesicles. It associates with TCTN1, meckelin (TMEM67), TMEM107 and other MKS-module
  proteins, and is required for primary ciliogenesis, for apical docking of the centrosome/basal body
  in polarized epithelial cells, and for cilium-dependent signalling including Hedgehog signalling. Loss-of-function
  variants cause Joubert syndrome 2, Meckel syndrome 2 and related disorders (including oral-facial-digital
  type VI), and retinitis pigmentosa.
