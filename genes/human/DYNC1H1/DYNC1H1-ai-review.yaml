  evidence_type: HDA
  original_reference_id: PMID:22658674
  qualifier: enables
  review:
    summary: Human HeLa UV-crosslinking and oligo(dT) capture positively detect DYNC1H1 in the mRNA interactome.
    action: KEEP_AS_NON_CORE
    reason: The original PMID:22658674 Table S1 contains ENSG00000197102/DYNC1H1 (physical row 809), with
      ion-count adjusted P=0.00162134388789347 and presence in crosslinked material but not its control.
      The original Methods use complementary UV protocols, stringent oligo(dT) purification and RNase/proteomic
      analysis. This is positive RNA-contact evidence despite the absence of a conventional RNA-binding
      domain; it does not identify the contacted transcript, binding site or physiological RNA-recognition
      mechanism. Retain as a contextual molecular activity rather than treating transport adaptors as
      disproof.
    supported_by:
    - reference_id: PMID:22658674
      supporting_text: Employing two complementary protocols for covalent UV crosslinking of RBPs to RNA
