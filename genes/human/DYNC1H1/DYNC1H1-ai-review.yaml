- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:15161933
  qualifier: enables
  supporting_entities:
  - UniProtKB:P63104
  review:
    summary: Protein binding (IPI). 14-3-3 zeta (YWHAZ) affinity proteomics hit from HeLa extracts (abstract-only
      cache).
    action: REMOVE
    reason: GO:0005515 protein binding is uninformative about DYNC1H1 function. The reported interaction
      may well be real, but it does not identify a molecular activity of the heavy chain; the functionally
      meaningful dynein interactions (intermediate chain, light intermediate chain, dynactin/adaptor assembly)
      are captured by more specific terms.
    supported_by:
    - reference_id: PMID:15161933
      supporting_text: 14-3-3-binding proteins were purified from extracts of interphase and mitotic HeLa
        cells using specific peptide elution from 14-3-3 zeta affinity columns.
