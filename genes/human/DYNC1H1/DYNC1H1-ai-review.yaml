id: Q14204
gene_symbol: DYNC1H1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: DYNC1H1 encodes the force-generating heavy chain of cytoplasmic dynein-1. Its motor region
  couples ATP hydrolysis to movement toward microtubule minus ends, while its tail assembles with accessory
  subunits that connect the motor to cargo and regulatory proteins. Dynein-1 transports organelles and
  other cellular cargo, including cargo moving toward neuronal cell bodies, and supplies forces for nuclear
  movement and mitotic spindle organization. Recruitment to the cell cortex helps position the spindle.
  Long-range processive movement is regulated by dynactin and activating adaptors; the isolated motor
  is not constitutively highly processive.
