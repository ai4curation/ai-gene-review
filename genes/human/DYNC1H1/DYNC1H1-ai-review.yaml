  evidence_type: HDA
  original_reference_id: PMID:19056867
  qualifier: located_in
  review:
    summary: Extracellular exosome (HDA) from exosome proteomics.
    action: KEEP_AS_NON_CORE
    reason: >-
      Abundant cytoplasmic proteins, including dynein heavy chain, are routinely recovered in exosome
      preparations. There is no evidence that exosomal packaging is part of DYNC1H1 function.
      OMICS_EVIDENCE disposition (2026-10-06): a vesicle-type location (exosome, extracellular
      vesicle, microparticle) from a bulk vesicle or body-fluid proteome records detection in secreted
      cargo, not where the protein acts, so it is kept as non-core by default (previous action:
      MARK_AS_OVER_ANNOTATED). See projects/OMICS_EVIDENCE.md.
    supported_by:
    - *id003
