id: Q14204
gene_symbol: DYNC1H1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: DYNC1H1 encodes the ~530 kDa heavy chain of cytoplasmic dynein 1, the principal minus-end-directed
  microtubule motor of eukaryotic cells. Two heavy chains dimerize through their N-terminal tails, which
  also bind the intermediate, light intermediate and light chains; each C-terminal motor domain is a ring
  of six AAA+ modules that hydrolyses ATP (mainly at AAA1) and couples it, via the linker and a coiled-coil
  stalk ending in a microtubule-binding domain, to stepping toward microtubule minus ends. Isolated dynein
  is autoinhibited; processive motility requires dynactin and a coiled-coil cargo adaptor (e.g. BICD2,
  HOOK3, BICDR1, JIP3), with LIS1 and NDE1/NDEL1 promoting assembly. Through this motor activity dynein
  1 carries vesicles, organelles, mRNPs, misfolded-protein aggregates and viruses toward the cell centre,
  drives retrograde axonal transport, positions the Golgi and nucleus (including nucleokinesis in migrating
  neurons), and in mitosis focuses spindle poles, separates centrosomes, positions the spindle from the
  cell cortex and strips checkpoint proteins from kinetochores. Dominant DYNC1H1 variants cause axonal
  Charcot-Marie-Tooth disease type 2O, lower-extremity-predominant spinal muscular atrophy and malformations
  of cortical development with intellectual disability.
existing_annotations:
- term:
    id: GO:0001673
    label: male germ cell nucleus
  evidence_type: NAS
  original_reference_id: PMID:36973253
  qualifier: located_in
  review:
    summary: Male germ cell nucleus (NAS) from a mouse DYNLRB2 meiosis paper; the paper places DYNC1H1
      at spindle poles of spermatocytes, not in the nucleus.
    action: MARK_AS_OVER_ANNOTATED
    reason: Cytoplasmic dynein 1 is a cytoplasmic motor. In spermatocytes it acts at spindle poles and
      on the cytoplasmic face of the nuclear envelope; no intranuclear pool is described. The NAS statement
      does not support a nuclear location as a meaningful annotation.
    supported_by:
    - reference_id: PMID:36973253
      supporting_text: the localization of the dynein–dynactin subunits DYNC1H1, DYNLL1, and p150 at spindle
        poles were not affected in Dynlrb2−⁄− spermatocytes
    - &id003
      reference_id: file:human/DYNC1H1/DYNC1H1-uniprot.txt
      supporting_text: Cytoplasm, cytoskeleton
- term:
    id: GO:0003723
    label: RNA binding
  evidence_type: HDA
  original_reference_id: PMID:22658674
  qualifier: enables
  review:
    summary: RNA binding from high-throughput mRNA interactome capture.
    action: MARK_AS_OVER_ANNOTATED
    reason: DYNC1H1 was recovered in a UV-crosslinking mRNA-interactome screen. The heavy chain has no
      known RNA-binding domain; RNA transport by dynein occurs through adaptors (e.g. BICD2/Egalitarian-like
      complexes) rather than direct RNA binding by the motor. The HDA hit is not evidence of an RNA-binding
      function.
    supported_by:
    - reference_id: PMID:22658674
      supporting_text: Employing two complementary protocols for covalent UV crosslinking of RBPs to RNA
