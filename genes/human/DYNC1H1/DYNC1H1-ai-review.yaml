  review:
    summary: DYNC1H1 is a candidate mRNA-associated protein in the human HEK293 PAR-CL/SILAC study.
    action: KEEP_AS_NON_CORE
    reason: 'The genuine author thesis associated with PMID:22681889 preserves the study Methods and Table
      S1. Its DYNC1H1 entry is in candidate group III: the reported log2 ratios include -0.46, NA, -2.62,
      1.54 and 4.92, so enrichment is not uniform across protocols. The group is a positive candidate
      class, not an exclusion list. Photo-crosslinking, oligo(dT) purification and non-crosslinked controls
      support retaining the reported RNA association with lower source-specific confidence; independent
      human HeLa capture in PMID:22658674 corroborates the broad activity. No sequence-specific RNA function
      is inferred.'
