core_functions:
- description: DYNC1H1 supplies the ATP-driven minus-end motor activity of the dynein-1 complex. Recombinant
    human motor preparations establish directionality, and reconstitution with dynactin and an activating
    adaptor establishes regulated processive transport. The same force-generating activity supports cytoplasmic
    cargo transport, nuclear movement, and spindle organization rather than representing separate molecular
    activities in each setting. During mitosis, cortical recruitment and transport toward spindle poles
    contribute to spindle positioning and removal of checkpoint proteins. Nuclear-migration evidence includes
    dynein-complex perturbation in mouse neurons; checkpoint-silencing evidence includes perturbation
    of an accessory dynein subunit and is not presented as a heavy-chain-specific assay.
