core_functions:
- description: 'Catalytic heavy chain of cytoplasmic dynein 1: ATP-driven minus-end-directed movement
    along microtubules, activated for processive transport by dynactin and cargo adaptors; carries vesicles,
    organelles and other cargo toward the cell centre, including retrograde axonal transport.'
