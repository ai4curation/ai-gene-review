  review:
    summary: Mouse meiotic nuclear-envelope/telomere-associated dynein supports a contextual male-germ-cell
      nuclear location.
    action: KEEP_AS_NON_CORE
    reason: PMID:36973253 Supplementary Figure 4A directly stains DYNC1H1 at telomere-associated sites
      in mouse pachytene spermatocytes; the original also discusses dynein on the cytoplasmic face of
      the nuclear envelope. Nuclear envelope is part of nucleus, so an outer-face pool does not by itself
      refute this broad anatomical assertion. Retain the NAS annotation with explicit mouse-ortholog and
      nuclear-envelope scope; neither human intranucleoplasmic localization nor a nuclear catalytic activity
      is established.
