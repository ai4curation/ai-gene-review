suggested_questions:
- question: Which DYNC1H1 variants selectively alter motor activation, cargo-adaptor assembly and neuronal
    nuclear movement, rather than causing a uniform reduction of all dynein-dependent transport?
- question: Does the curated mouse filopodium observation reflect a reproducible human DYNC1H1 pool, and
    which target-specific assay supports the Reactome azurophil-granule lumen placement?
- question: What RNAs contact the heavy chain in UV-capture experiments, and do these contacts contribute
    to cargo transport or another regulated cellular role?
suggested_experiments:
- description: Compare matched human DYNC1H1 variants in reconstituted dynein–dynactin–adaptor motility
    assays and human neuronal cargo/nuclear-movement imaging, with controls for motor-complex abundance,
    assembly and adaptor recruitment.
- description: Test the reported extracellular-vesicle and narrow compartment pools with target-specific
    imaging, quantitative purification controls and protease-protection assays, distinguishing particle
    association from lumenal cargo and unrelated co-isolation.
