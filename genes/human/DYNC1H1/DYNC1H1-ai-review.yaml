suggested_questions:
- question: Which DYNC1H1 disease variants (tail vs motor domain) selectively impair nucleokinesis in
    migrating cortical neurons versus retrograde axonal transport, and does this explain the split between
    cortical malformation and CMT2O/SMALED1 phenotypes?
- question: Should the GO-annotated mitotic "regulation" terms (positive regulation of spindle assembly,
    regulation of metaphase plate congression) be replaced by direct participation terms, given that dynein
    itself does the mechanical work?
suggested_experiments:
- description: Knock-in of patient MCD-associated DYNC1H1 motor-domain variants in mouse or human iPSC-derived
    neurons with live imaging of centrosome-nucleus coupling and nuclear translocation, paired with single-molecule
    motility of reconstituted dynein-dynactin-BICD2 carrying the same variants.
