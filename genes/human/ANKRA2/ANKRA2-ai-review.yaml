id: Q9H9E1
gene_symbol: ANKRA2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'ANKRA2 (ankyrin repeat family A protein 2) is a small ankyrin-repeat protein that reads
  PxLPxI/L motifs. Its ankyrin repeats bind this motif in class IIa histone deacetylases (HDAC4, HDAC5,
  HDAC9), the endocytic receptor megalin, the transcription factors RFX5 and RFX7, and the 3M-syndrome
  protein CCDC8. It acts as a transcriptional corepressor: the AhR repressor recruits ANKRA2 together
  with HDAC4 and HDAC5 to silence CYP1A1, and ANKRA2 knockdown relieves that repression. It is found in
  the cytosol, on membranes near megalin in kidney epithelia, and in the nucleus. Its close paralog RFXANK
  uses the same motif recognition in the MHC class II enhanceosome.'
