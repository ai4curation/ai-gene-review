- term:
    id: GO:0035725
    label: sodium ion transmembrane transport
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000177662
  - UniProtKB:O18875
  - UniProtKB:P30531
  review:
    summary: DAT cotransports Na+ as the driving ion; a mechanistic co-substrate, not the
      core biological point.
    action: KEEP_AS_NON_CORE
    reason: Na+ is the co-transported driving ion of DAT symport (two Na+ per dopamine), so
      sodium ion transmembrane transport is genuinely part of the mechanism. It is kept as
      non-core because DAT's biological role is dopamine clearance, not sodium handling; the
      Na+ movement is obligatory co-transport. The IBD (node PTN000177662) correctly places
      Na+ coupling across the NSS clade.
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
      - source_id: PANTHER:PTN000177662
        source_status: SUPPORTS_TRANSFER
        comment: Ancestral NSS node; Na+ coupling is a conserved, experimentally established
          property of the family including human DAT.
