- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: TAS
  original_reference_id: PMID:10823899
  qualifier: located_in
  review:
    summary: DAT is an integral plasma-membrane protein; a bare cytoplasm location is an
      over-annotation reflecting internalized/trafficking pools.
    action: MARK_AS_OVER_ANNOTATED
    reason: DAT is a 12-TM integral membrane transporter whose functional site is the plasma
      membrane. The cytoplasm assignment (from an amphetamine-induced internalization study)
      reflects endocytosed/recycling pools rather than a cytosolic localization, and is
      uninformative/misleading for a membrane transporter; the specific plasma-membrane and
      endosomal trafficking are better captured by other rows.
