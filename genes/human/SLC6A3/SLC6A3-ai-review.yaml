  review:
    summary: DAT is the direct molecular target of xenobiotic psychostimulants (cocaine,
      amphetamine); a peripheral, non-core process.
    action: KEEP_AS_NON_CORE
    reason: DAT directly binds and is inhibited by xenobiotic drugs (cocaine, amphetamine,
      methylphenidate), giving a genuine basis for participating in the cellular response to
