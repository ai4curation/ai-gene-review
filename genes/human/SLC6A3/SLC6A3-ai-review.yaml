suggested_questions:
- question: What are the precise ion-to-substrate coupling stoichiometries and their functional
    consequences under physiological conditions, given the cryo-EM evidence for both 1 Na+ and
    2 Na+ coupled reactions for human DAT?
- question: How do the many PDZ-scaffold and regulatory interactions (PICK1, SCRIB, MAGI,
    flotillin-1, RIT2, PP2A, D2R) combine to set DAT surface density and trafficking in
    dopaminergic terminals in vivo?
suggested_experiments:
- description: Measure electrogenic transport and ion coupling of purified human DAT
    reconstituted in defined lipid environments (solid-supported membrane electrophysiology or
    voltage-clamp in oocytes) to resolve the physiological sodium-chloride-dopamine
    stoichiometry.
- description: Use knock-in mice or human dopaminergic neurons with endogenously tagged DAT and
    super-resolution/surface-biotinylation assays to quantify how specific interactors
    (flotillin-1, RIT2, PP2A, D2R) control DAT microdomain localization and PKC-regulated
    internalization.
