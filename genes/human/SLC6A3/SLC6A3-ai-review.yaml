  review:
    summary: Core location - DAT acts at the (presynaptic) plasma membrane. Phylogenetically
      well supported across the SLC6 family.
    action: ACCEPT
    reason: The IBD placing plasma-membrane activity across the NSS/SLC6 clade (node
      PTN000177662) is sound - all characterized family members are plasma-membrane
      transporters. The target Q01959 appears in the WITH/FROM, which marks experimental
      grounding on DAT itself (expected, not circular). This is DAT's core functional
      location.
    supported_by:
    - reference_id: PMID:21399631
      supporting_text: some SLC6 members, such as the DAT, localize primarily to the plasma
        membrane
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN000177662
        source_status: SUPPORTS_TRANSFER
        comment: Ancestral NSS/SLC6 node; plasma-membrane activity is established across the
          family and directly supported for human DAT.
