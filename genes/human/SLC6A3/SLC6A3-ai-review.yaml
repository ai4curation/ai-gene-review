core_functions:
- description: Sodium- and chloride-dependent (secondary-active) symport of dopamine across
    the presynaptic plasma membrane, clearing released dopamine from the synaptic/extracellular
    space and recycling it into presynaptic dopaminergic neurons to terminate dopaminergic
    signalling.
