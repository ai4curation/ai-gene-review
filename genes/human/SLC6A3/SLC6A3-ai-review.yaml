    label: neurotransmitter uptake
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q61327
  - ensembl:ENSMUSP00000022100
  review:
    summary: DAT performs reuptake of dopamine, a neurotransmitter, so neurotransmitter
      uptake is a correct broad statement of its process.
    action: ACCEPT
    reason: DAT itself executes the uptake step, carrying dopamine (a neurotransmitter)
      across the membrane. The term is broader than dopamine uptake (GO:0090494), but OLS
      shows GO:0090494 is NOT an is_a descendant of neurotransmitter uptake (dopamine uptake
      sits under organic-hydroxy/nitrogen-compound transport, a parallel branch), so this is
      a correct broad term rather than one entailed by a more specific asserted row; an IEA
      at this level is acceptable.
    supported_by:
    - reference_id: PMID:1406597
      supporting_text: the human clone is able to induce a saturable, time- and
        sodium-dependent, dopamine uptake
