id: Q01959
gene_symbol: SLC6A3
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SLC6A3 encodes the dopamine transporter (DAT), a 12-transmembrane integral
  plasma-membrane protein of the SLC6 neurotransmitter:sodium symporter (NSS/SNF) family.
  DAT is a sodium- and chloride-dependent secondary-active symporter that clears dopamine
  from the extracellular/synaptic space and recycles it into presynaptic dopaminergic
  neurons, thereby terminating dopaminergic neurotransmission and maintaining dopamine
  homeostasis. Transport is driven by the inward Na+ electrochemical gradient, with a
  stoichiometry of roughly two Na+ and one Cl- cotransported per dopamine molecule
  (symport, in the same direction). It is highly expressed on the axons and presynaptic
  terminals of midbrain dopaminergic neurons (substantia nigra, striatum). DAT is the
  molecular target of psychostimulants such as cocaine and amphetamines and of numerous
  antidepressant/ADHD drugs, and biallelic loss-of-function variants cause infantile-onset
  parkinsonism-dystonia.
