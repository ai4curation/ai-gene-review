  review:
    summary: DAT is a monoamine (dopamine) transporter, not an amino-acid transporter; this
      IBA over-propagates from the amino-acid-transporter branch of the SLC6 family.
    action: REMOVE
    reason: The SLC6/NSS family contains two functionally distinct branches - amino-acid
      transporters and monoamine/GABA neurotransmitter transporters. DAT belongs to the
      monoamine branch and transports dopamine, a decarboxylated catecholamine that is not an
      amino acid; there is no evidence DAT transports amino acids. The IBD node
      (PTN000907004) groups amino-acid transporters and the term is mis-propagated onto DAT.
      Its paralogs NET (SLC6A2) and SERT (SLC6A4) are likewise monoamine, not amino-acid,
      transporters.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN000907004
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Ancestral node reflecting the amino-acid-transporter branch of SLC6; amino
          acid transport holds for those members but does not transfer to the
          monoamine-transporter subfamily (DAT/NET/SERT).
