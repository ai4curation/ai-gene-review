  review:
    summary: Yeast two-hybrid identification of TESK1 as a SPRY4 partner, confirmed by co-immunoprecipitation
      (abstract-only cached).
    action: MODIFY
    reason: The interaction with TESK1 is well established (later shown to inhibit TESK1 kinase activity,
      PMID:15584898). 'protein binding' is uninformative; this paper establishes binding to a protein
      kinase, so protein kinase binding is the evidence-backed refinement for this reference. The functional
      consequence (kinase inhibition) is captured by GO:0004860 from PMID:15584898.
    proposed_replacement_terms:
