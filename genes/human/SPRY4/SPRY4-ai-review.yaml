core_functions:
- description: Inducible negative-feedback inhibitor of RTK-Ras-ERK signalling (notably downstream of
    FGFR). SPRY4 binds RAF1 through its C-terminal cysteine-rich Sprouty domain and blocks Ras-independent
    RAF1 activation, and (Tyr75-dependent) limits Ras activation upstream of Ras by associating with SOS1
    and reducing GRB2-SOS1 recruitment to FRS2. The kinase-inhibitor MF captures the RAF1 arm; the SOS1/GRB2
    arm is better described as sequestration and has weaker (co-IP) support. SPRY4 lacks the C-terminal
    PxxPxR GRB2 SH3-binding motif that is unique to SPRY2 (OpenScientist ortholog scan; grafting the motif
    onto SPRY4 confers GRB2-dependent inhibition), so any GRB2 effect of SPRY4 is not via direct SH3
    binding, while the RAF1-binding cysteine-rich domain is conserved in all paralogs. Direct
    kinase-inhibition evidence is strongest for TESK1.
