    label: protein kinase inhibitor activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000961788
  - UniProtKB:O43597
  - UniProtKB:Q9C004
  review:
    summary: PAINT-propagated protein kinase inhibitor activity from the Sprouty family node PTN000961788
      (SPRY2 donor and SPRY4 itself).
    action: ACCEPT
    reason: Human SPRY4 directly inhibits the cofilin kinase TESK1 in vitro through its C-terminal cysteine-rich
      (Sprouty) domain, and mammalian Spry4 binds RAF1 through the same domain, binding that is required
      to suppress Ras-independent RAF1/ERK activation. The family-level node placement is therefore consistent
      with SPRY4-specific experimental evidence; SPRY4 appearing among the WITH/FROM sources reflects
      its own experimental grounding, not circularity. The term is appropriately general because SPRY4
      acts on more than one kinase (TESK1, RAF1 activation).
    additional_reference_ids:
    - PMID:12717443
    supported_by:
    - &id001
      reference_id: PMID:15584898
      supporting_text: we show that Spry4 inhibits the kinase activity of TESK1 by binding to it through
        the C-terminal cysteine-rich region
    - &id009
      reference_id: PMID:12717443
      supporting_text: Sprouty4 binds to Raf1 through its carboxy-terminal cysteine-rich domain, and this
        binding is necessary for the inhibitory activity of Sprouty4
- term:
    id: GO:0004860
    label: protein kinase inhibitor activity
  evidence_type: IMP
  original_reference_id: PMID:15584898
  qualifier: enables
  review:
    summary: Tsumura et al. 2005 showed GST-SPRY4 dose-dependently inhibits immunoprecipitated TESK1 kinase
      activity toward cofilin in vitro, via the C-terminal cysteine-rich region.
    action: ACCEPT
    reason: Direct in vitro kinase assays with purified GST-SPRY4 and mutant analysis (Spry4-C active,
      Spry4-N inactive) support a genuine kinase-inhibitor molecular function. TESK1 is a Ser/Thr kinase,
      so GO:0030291 would be a more specific alternative, but the existing term is correct and also covers
      SPRY4's inhibition of RAF1 activation.
    supported_by:
    - *id001
    - &id002
      reference_id: PMID:15584898
      supporting_text: the kinase activity of TESK1 was inhibited by GST–Spry4 in a dose-dependent manner,
        but not by GST
