suggested_questions:
- question: 'Which mechanism dominates SPRY4 inhibition of FGFR-ERK signalling in physiological settings:
    SOS1/GRB2 sequestration (Tyr75-dependent) or RAF1 binding via the cysteine-rich domain, and is the
    SPRY4-SOS1 association direct?'
- question: Does SPRY4 directly reduce RAF1 catalytic activity, or only prevent its Ras-independent activation
    (e.g. by blocking a PKC-dependent input)? This determines whether 'protein kinase inhibitor activity'
    or 'protein sequestering activity' is the more accurate MF for the Ras-ERK arm.
- question: Is the high-throughput SPRY4-FGFR3 interaction functionally relevant to feedback at the receptor
    level?
suggested_experiments:
- hypothesis: SPRY4 directly inhibits RAF1 kinase activity through its cysteine-rich domain.
  description: In vitro kinase assays with purified RAF1 (activated by Ras-GTP or by PKC phosphorylation)
    and recombinant full-length SPRY4, SPRY4 cysteine-rich domain, and RAF1-binding-deficient mutants,
    measuring MEK phosphorylation.
  experiment_type: in vitro kinase assay
- hypothesis: Endogenous SPRY4 provides ERK-dependent negative feedback on FGFR signalling in non-transformed
    human cells.
  description: CRISPR knockout of SPRY4 (alone and with SPRY1/SPRY2) in human fibroblasts or iPSC-derived
    progenitors, followed by FGF2 time-course phospho-ERK and Ras-GTP measurements and rescue with Y75A
    or cysteine-rich-domain mutants.
  experiment_type: genetic knockout with rescue
