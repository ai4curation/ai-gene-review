id: Q9C004
gene_symbol: SPRY4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'Sprouty homolog 4 (SPRY4) is a small intracellular, non-enzymatic member of the Sprouty
  family that acts as an inducible negative-feedback inhibitor of receptor tyrosine kinase (RTK) signalling
  to the Ras-RAF-MEK-ERK cascade. Its expression is induced by growth-factor/ERK signalling (e.g. downstream
  of FGFR), and the protein then dampens ERK activation by at least two routes: it limits Ras activation
  at or upstream of Ras (associating with SOS1 and, with SPRY1, reducing recruitment of GRB2-SOS1 to FRS2
  after FGF stimulation; this requires phosphorylation of the conserved N-terminal Tyr75), and it binds
  RAF1 through its C-terminal cysteine-rich Sprouty domain to block Ras-independent RAF1 activation, e.g.
  by VEGF. Through the same cysteine-rich domain SPRY4 binds and inhibits the cofilin kinase TESK1, suppressing
  integrin-mediated cofilin phosphorylation and cell spreading independently of ERK. SPRY4 is mainly cytoplasmic/cytosolic,
  often in vesicular puncta, and can associate with membranes. It also influences migration and focal
  adhesion formation (an MDM2-SPRY4-RhoA axis in p53-deficient cancer cells) and its expression correlates
  with favourable prognosis in some tumours.'
