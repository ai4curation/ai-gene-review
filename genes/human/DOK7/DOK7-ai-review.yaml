core_functions:
- description: DOK7 activates MUSK by binding its phosphorylated juxtamembrane region and promoting receptor
    dimerization, which supports MUSK trans-autophosphorylation and neuromuscular junction assembly. Human
    PH-PTB fragments form complexes with the MUSK cytoplasmic domain; direct kinase-stimulation and cellular
    tests in the structural study used mouse Dok7.
  molecular_function:
    id: GO:0030296
    label: protein tyrosine kinase activator activity
  directly_involved_in:
  - id: GO:0061098
    label: positive regulation of protein tyrosine kinase activity
  - id: GO:0007528
    label: neuromuscular junction development
  locations:
  - id: GO:0045211
    label: postsynaptic membrane
  supported_by:
  - reference_id: PMID:20603078
    supporting_text: the rate of MuSK Tyr754 autophosphorylation is substantially increased
  - reference_id: PMID:16794080
- description: DOK7 couples activated MUSK to downstream signaling by using its phosphorylated C-terminal
    tail to recruit CRK and CRKL. Mouse myotube experiments separate this recruitment and acetylcholine-receptor
    clustering function from the stronger PH-PTB-mediated kinase-activation mechanism. The corresponding
    human adaptor role is supported by orthology.
  molecular_function:
    id: GO:0005068
    label: transmembrane receptor protein tyrosine kinase adaptor activity
  directly_involved_in:
  - id: GO:0007528
    label: neuromuscular junction development
  locations:
  - id: GO:0045211
    label: postsynaptic membrane
  supported_by:
  - reference_id: PMID:21041412
    supporting_text: 'recruitment of two adapter proteins: Crk and Crk-L.'
suggested_questions:
- question: How do the four natural DOK7 products differ in stability, receptor activation, adaptor recruitment
    and cellular distribution?
- question: What is the molecular role of the nucleoplasmic and mitochondrial DOK7 pools observed in human
    cell lines, and are these pools present in differentiated skeletal muscle?
- question: Which exchange factors directly connect DOK7–CRK/CRKL signaling to Rac regulation in muscle?
suggested_experiments:
- description: Compare accession-resolved natural DOK7 products at matched expression in muscle cells,
    measuring MUSK binding and activation, CRK/CRKL recruitment, AChR clustering and localization. Include
    sequence-confirmed controls that distinguish changes in abundance from altered signaling.
