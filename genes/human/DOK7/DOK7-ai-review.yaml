id: Q18PE1
gene_symbol: DOK7
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: DOK7 is an intracellular signaling protein that organizes neuromuscular junction formation
  through the muscle receptor tyrosine kinase MUSK. Its N-terminal pleckstrin-homology and phosphotyrosine-binding
  regions promote receptor pairing and activation, while phosphorylation of the C-terminal tail enables
  recruitment of CRK-family adaptors for downstream synaptic differentiation. DOK7 is associated with
  the muscle postsynaptic compartment; additional nucleoplasmic and mitochondrial pools have been observed
  in human cell lines. Biallelic pathogenic variants cause congenital myasthenic syndromes, and severe
  disruption can cause fetal akinesia. Alternative transcripts encode products that differ in their receptor-binding
  regions or signaling tails.
alternative_products:
- name: '1'
  id: Q18PE1-1
  description: Canonical 504-residue product containing the annotated PH domain at residues 4–109, IRS-type
    PTB domain at 105–210 and C-terminal signaling tail. Human residues 1–220 have been studied as an
    engineered soluble fragment; those experiments do not compare all natural products.
- name: '2'
  id: Q18PE1-2
  sequence_note: VSP_020633, VSP_020634
  description: Predicted 366-residue product lacking canonical residues 1–138 and replacing residues 139–178.
    It loses the annotated PH domain and changes much of the PTB region. Its stability, localization and
    residual signaling activity are not established by the canonical-fragment experiments.
- name: '4'
  id: Q18PE1-4
  sequence_note: VSP_047252, VSP_047253
  description: Predicted 255-residue product replacing canonical residues 175–255 and lacking residues
    256–504. The change alters part of the PTB region and removes the canonical distal signaling tail.
    Functional equivalence or complete inactivity has not been established.
- name: '3'
  id: Q18PE1-3
  sequence_note: VSP_020635
  description: Predicted 608-residue product in which canonical residues 500–504 are replaced by a 109-residue
    extension. It retains the annotated PH/PTB spans and most of the canonical tail; the effect of its
    alternative C terminus on signaling remains unresolved.
