    isObsolete: false
    name: catalytic activity
    definition:
      text: Catalysis of a biochemical reaction at physiological temperatures. In biologically catalyzed reactions, the reactants are
        known as substrates, and the catalysts are naturally occurring macromolecular substances known as enzymes. Enzymes possess specific
        binding sites for substrates, and are usually composed wholly or largely of protein, but RNA that has catalytic activity (ribozyme)
        is often also regarded as enzymatic.
