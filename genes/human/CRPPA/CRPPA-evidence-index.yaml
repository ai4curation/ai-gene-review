  scope: Literal A4D126 or CRPPA target search of the protected production index found no activity. No new process assertion is proposed
    on that absence.
limits:
- Neither the official 401-residue splice product nor its catalytic consequence is established by the engineered 43–451 or patient exon-3-deletion
  experiments.
- Human basal MEP turnover is preserved; loss of the bacterial-pathway assignment is a biological process judgment, not universal catalytic
  negation.
- The earlier PAINT IBD release was genuinely captured and reused with its fixed hash; it is not described as freshly downloaded.
