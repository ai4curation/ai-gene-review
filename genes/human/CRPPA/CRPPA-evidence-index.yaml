    reason: All 67 current ARBA00027560 condition sets were evaluated against official target features and lineage. Only branch 26 matches,
      through FunFam 3.90.550.10:FF:000080 and Euteleostomi, and it emits GO:0009101. This broad source assertion remains valid. Current
      ontology ancestry places GO:0035269 beneath GO:0009101, and direct human donor-synthesis experiments plus the existing experimental
      glycan-pathway assertions establish this more informative process. CRPPA synthesizes the activated CDP-ribitol donor used in elongation
      of the mannose-initiated alpha-dystroglycan glycan; it does not itself catalyze the initial mannose transfer or the downstream
      FKTN/FKRP transfer. Refine the review to GO:0035269 while preserving the literal rule output and positive transfer status.
  homodimer_scope:
    source_row: 10
    action: KEEP_AS_NON_CORE
    reason: 'The human 43–451 recombinant crystal forms a homodimer through the extended arm; the original reports consistent solution
      gel filtration, with those solution data not shown. This is positive homotypic association evidence, not proof of endogenous cellular
      stoichiometry for every splice product. Retain the structural association as non-core: the available dimer experiments characterize
      the enzyme assembly but do not establish an additional primary molecular activity distinct from the catalytic donor-synthesis
      function.'
    primary_url: https://hdl.handle.net/2066/152310
    locator: Printed page1645, structural Results; human43–451 crystal and reported solution gel filtration, data not shown.
  product_descriptions_moved_to_notes:
  - id: A4D126-1
    description: The displayed 451-residue product contains the cytidylyltransferase region and C-terminal domain. Human full-length
      protein and distinct engineered 43–451 constructs support the biochemical activity; construct and expression-host differences
      remain source-specific.
  - id: A4D126-2
    description: The official 401-residue product lacks displayed-sequence residues 179–228 (VSP_044044), including the region containing
      the structural dimer arm. This sequence change does not by itself establish its catalytic activity, dimerization or physiological
      contribution. The tested 43–451 truncation is a different construct. The patient exon-3 deletion in PMID:22522420 is not equated
      with this numbered product without exact sequence correspondence.
