      Radboud and target Results/Methods read independently. Human full-length and 43–451 constructs,
      cytosolic tagged-cell fractionation, reported solution dimer data not shown, basal MEP activity
      and unchanged knockout dolichols are explicitly scoped. No supplement/pixel read is claimed.
