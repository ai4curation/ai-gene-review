      without shown data.
  - statement: Two independently generated HAP1 knockout clones have defective glycosylation with unchanged
      measured dolichol species and levels; basal MEP turnover in vitro does not establish an operating
      human MEP pathway.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
