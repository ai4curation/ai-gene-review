id: A4D126
gene_symbol: CRPPA
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CRPPA is a cytosolic cytidylyltransferase that synthesizes CDP-ribitol from D-ribitol 5-phosphate
  and CTP. This activated donor supplies ribitol phosphate for elaboration of the O-mannosyl glycan on
  alpha-dystroglycan by FKTN and FKRP, enabling its extracellular-matrix ligand-binding function. Recombinant
  human CRPPA forms a homodimer and also accepts ribose and ribulose phosphates in vitro. Loss of CRPPA
  activity causes dystroglycanopathies with muscular and variable brain and eye involvement. The enzyme
  is distinct from the bacterial IspD function in the methylerythritol isoprenoid pathway.
