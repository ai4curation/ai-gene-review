id: P08172
gene_symbol: CHRM2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CHRM2 encodes the M2 muscarinic acetylcholine receptor, a seven-transmembrane receptor that
  preferentially activates Gi/o proteins. It mediates inhibitory cyclic-AMP signaling, regulates cardiac
  rate and excitability, and acts as a neuronal autoreceptor controlling transmitter release. G-protein
  beta-gamma signaling is an important component of its physiological responses. Phosphorylation and arrestin
  recruitment regulate receptor desensitization and internalization. Human M2 can also engage Gs and Gq/11
  in expression systems, depending on agonist and concentration.
