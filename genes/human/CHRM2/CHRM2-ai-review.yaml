core_functions:
- description: Binds acetylcholine and activates heterotrimeric G proteins, preferentially engaging Gi/o-linked
    signaling with inhibition of cyclic-AMP production. Coupling depends on ligand, receptor abundance
    and cellular effector context; the receptor does not itself catalyse the downstream enzymatic reaction.
