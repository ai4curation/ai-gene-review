id: P50613
gene_symbol: CDK7
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CDK7 is a CMGC-family serine/threonine protein kinase that, with cyclin H and the RING-finger
  assembly factor MAT1, forms the trimeric CDK-activating kinase (CAK). In this complex it phosphorylates
  the activation-loop (T-loop) threonine of cell-cycle CDKs, including CDK1, CDK2, CDK4 and CDK6, and
  is the principal CAK of metazoan cells, required to establish CDK1/CDK2 activity and to maintain CDK4/CDK6
  activity during G1. The same trimer is the TFIIK kinase module of the general transcription factor TFIIH,
  where CDK7 phosphorylates Ser5 and Ser7 of the RNA polymerase II CTD heptad repeats at promoters during
  initiation and promoter escape, promoting capping-enzyme recruitment, promoter-proximal pausing and,
  through T-loop phosphorylation of CDK9 and phosphorylation of SPT5, the transition to productive elongation.
  Other substrates include p53 (Ser33). CDK7 is predominantly nuclear, with a minor cytoplasmic pool.
  It is a conserved single-copy ortholog across eukaryotes (Kin28 in budding yeast, Mcs6 in fission yeast).
