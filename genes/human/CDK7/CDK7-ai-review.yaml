  - *id029
  - *id027
  - *id030
- description: 'TFIIH CTD kinase: within holo-TFIIH, phosphorylates Ser5 (and Ser7) of the RNA polymerase
    II CTD at promoters during initiation, enabling promoter escape, capping-enzyme recruitment and pausing.'
  molecular_function: *id005
  directly_involved_in:
