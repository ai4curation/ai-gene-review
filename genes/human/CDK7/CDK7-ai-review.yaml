core_functions:
- description: 'CDK-activating kinase: as the CDK7-cyclin H-MAT1 trimer, phosphorylates the T-loop threonine
    of CDK1, CDK2, CDK4 and CDK6, licensing their activity for G1/S and G2/M progression.'
  molecular_function: *id002
  directly_involved_in:
