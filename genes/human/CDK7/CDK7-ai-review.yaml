suggested_questions:
- question: GO has no specific molecular function for CDK-activating kinase activity (T-loop phosphorylation
    of another CDK); should a child of GO:0004672 be created so that CAK activity of CDK7, budding-yeast
    Cak1 and S. pombe Csk1 can be captured distinctly from the cyclin-dependent activity of the substrate
    CDKs?
- question: Should the GO:0008094 and GO:0000439 rows derived from purified TFIIH be redistributed to
    the XPB/XPD and core subunits rather than every co-purifying subunit?
suggested_experiments:
- description: Use analog-sensitive CDK7 with phosphoproteomics in G1-synchronised cells to separate the
    contributions of CAK (CDK4/6/2 T-loop) and TFIIH CTD kinase activity to S-phase entry.
  experiment_type: chemical genetics / phosphoproteomics
