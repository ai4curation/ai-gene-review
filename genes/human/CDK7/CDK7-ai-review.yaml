        CC       dependent kinase, CDK7 is activated by the binding to cyclin-H/CCNH and

        CC       the CDK-activating kinase assembly factor MAT1 (PubMed:41100585).

        CC       Catalytic subunit of the CDK-activating kinase (CAK) complex, a master

        CC       regulator of CDK activity by catalyzing the activating threonine

        CC       phosphorylation of CDKs (PubMed:41100585). CAK activates major

        CC       mediators of cell cycle control, including CDK1, CDK2, CDK4 and CDK6,

        CC       and plays a key role in regulating cell cycle progression

        CC       (PubMed:41100585). CAK complexed to the core-TFIIH basal transcription

        CC       factor activates RNA polymerase II by serine phosphorylation of the CTD

        CC       of POLR2A, allowing its escape from the promoter and elongation of the

        CC       transcripts (PubMed:9852112). Initiates transcription by RNA polymerase

        CC       II by mediating phosphorylation of POLR2A at ''Ser-5'' of the repetitive

