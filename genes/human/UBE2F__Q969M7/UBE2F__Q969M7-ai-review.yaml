  review:
    summary: Interaction of UBE2F with UBA3, the catalytic subunit of the NEDD8-activating enzyme
      (E1). The UBE2F N-terminal region docks onto UBA3 so that the E1 can load NEDD8 onto the
      E2.
    action: REMOVE
    reason: Bare protein binding says nothing about function. The E1-E2 contact is part of how
      UBE2F accepts NEDD8 from the E1, and the activity it serves is already captured by NEDD8
      conjugating enzyme activity (GO:0061654). No more informative binding term is warranted for
      an enzyme binding its own upstream enzyme in a thioester-transfer cascade. Removing the row
      does not dispute the interaction.
