gene_symbol: UBE2F
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  UBE2F is a 185-residue NEDD8-conjugating enzyme (E2) with a UBC core domain (residues
  32-185) and a short N-terminal extension that docks onto the NEDD8-activating enzyme
  UBA3-NAE1. The E1 transfers NEDD8 onto the UBE2F active-site Cys116, forming a thioester,
  and UBE2F then transfers NEDD8 to a lysine on a cullin. UBE2F pairs with the RING protein
  RBX2 (RNF7, also called SAG) and selectively neddylates cullin-5 (CUL5). The parallel E2
  UBE2M pairs with RBX1 and neddylates CUL1 to CUL4. UBE2F is also the E2 for CUL9-RBX1.
  Its initiator methionine is N-acetylated; DCN1-like co-E3s (DCUN1D1-5) recognise this
  acetylated N-terminus and promote NEDD8 transfer to cullins. Neddylation activates
  cullin-RING ubiquitin ligase 5 (CRL5) complexes, which ubiquitylate substrates such as
  the pro-apoptotic protein NOXA. HIV-1 Vif hijacks CRL5 to degrade APOBEC3G, which makes
  this pathway depend on UBE2F during infection. A non-cullin substrate, RHEB, has also been
  reported. UBE2F is a soluble cytosolic enzyme expressed in many tissues, and UBE2M-dependent
  ubiquitylation controls its abundance. UBE2F orthologs form a metazoan PANTHER subfamily
  distinct from the UBE2M/UBC12 subfamily; both descend from an ancestral NEDD8-E2 lineage.
