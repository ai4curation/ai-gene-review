core_functions:
- description: NEDD8-conjugating E2 enzyme. UBE2F accepts NEDD8 from the UBA3-NAE1 E1 onto its
    active-site Cys116 as a thioester and, together with the RING protein RBX2, transfers it to a
    lysine on cullin-5 (and on CUL9-RBX1). This activates CRL5 ubiquitin ligases. DCNL co-E3s that
    bind the N-acetylated UBE2F N-terminus stimulate the transfer.
  molecular_function:
    id: GO:0061654
    label: NEDD8 conjugating enzyme activity
  directly_involved_in:
  - id: GO:0045116
    label: protein neddylation
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:19250909
    supporting_text: the previously uncharacterized E2 UBE2F is a NEDD8-conjugating enzyme in vitro
      and in vivo
  - reference_id: PMID:23300442
    supporting_text: CUL5 is completely NEDD8ylated by UBE2F
  - reference_id: PMID:23201271
    supporting_text: the PONY domains from all 5 DCNL family members potently stimulated NEDD8
      transfer from UBE2FNAc to RBX2-associated CUL5CTD
  - reference_id: PMID:38605244
    supporting_text: CUL9 as unique among RBX1-bound cullins in dependence on the metazoan-specific
      UBE2F neddylation enzyme
suggested_questions:
- question: How broad is the non-cullin substrate range of UBE2F? RHEB K169 neddylation has been
    reported by one laboratory; are other non-cullin substrates neddylated by UBE2F-RBX2 under
    physiological NEDD8 levels rather than in NEDD8 overexpression conditions?
- question: How do UBE2F and RBX1 cooperate in CUL9 neddylation, given that UBE2F otherwise pairs
    with RBX2?
- question: Do any of the alternatively spliced UBE2F isoforms that alter the N-terminal
    UBA3-binding region (residues 1-29) lack E1 charging or DCNL binding, and are they expressed
    as proteins?
suggested_experiments:
- hypothesis: UBE2F neddylates RHEB directly and specifically.
  description: Reconstitute RHEB neddylation in vitro with purified UBA3-NAE1, UBE2F (wild type and
    C116S) and RBX2, at near-physiological NEDD8 concentrations, and compare with UBE2M-RBX1. Map
    the modified lysine by mass spectrometry and test whether ubiquitin can replace NEDD8.
  experiment_type: biochemical reconstitution
- hypothesis: The UBE2F splice isoforms that lack the N-terminal extension cannot be charged by
    the NEDD8 E1.
  description: Express individual isoforms with an epitope tag in UBE2F-knockout cells and measure
    E1-dependent NEDD8 thioester formation (non-reducing gels) and rescue of CUL5 neddylation.
  experiment_type: genetic complementation
