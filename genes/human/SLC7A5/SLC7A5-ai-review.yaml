core_functions:
  - description: Catalytic light chain of the LAT1-SLC3A2 (4F2hc) heteromeric amino acid transporter;
      an obligatory, sodium- and pH-independent antiporter that exchanges large neutral, branched-chain
      and aromatic L-amino acids (Leu, Ile, Val, Phe, Tyr, Trp, His, Met) at 1:1 stoichiometry across
      the plasma membrane, producing net essential-amino-acid import coupled to efflux of intracellular
      amino acids. Transport requires the disulfide-linked SLC3A2 partner.
    molecular_function:
      id: GO:0015297
      label: antiporter activity
    directly_involved_in:
      - id: GO:0015804
        label: neutral amino acid transport
      - id: GO:0089718
        label: amino acid import across plasma membrane
      - id: GO:1903801
        label: L-leucine import across plasma membrane
    locations:
      - id: GO:0005886
        label: plasma membrane
    in_complex:
      id: GO:1990184
      label: amino acid transport complex
    substrates:
      - id: CHEBI:15603
        label: L-leucine
      - id: CHEBI:17295
        label: L-phenylalanine
      - id: CHEBI:16828
        label: L-tryptophan
    supported_by:
      - reference_id: PMID:11847106
        supporting_text: "Quantification of amino acid influx and efflux by HPLC demonstrated an obligatory amino acid exchange with 1:1 stoichiometry"
      - reference_id: PMID:30867591
        supporting_text: "catalyses the cross-membrane flux of large neutral amino acids in a sodium- and pH-independent"
  - description: Secondary transporter activity for thyroid hormones and iodothyronines (T3, T4, rT3,
      3,3'-T2, and iodotyrosines MIT/DIT), exchanged for neutral/aromatic L-amino acids; contributes to
      cellular thyroid-hormone uptake. Also transports L-DOPA and amino-acid-mimetic drugs
      (gabapentin, pregabalin, melphalan), underlying its role in CNS/tumor drug delivery.
    molecular_function:
      id: GO:0015349
      label: thyroid hormone transmembrane transporter activity
    directly_involved_in:
      - id: GO:0070327
        label: thyroid hormone transport
    locations:
      - id: GO:0005886
        label: plasma membrane
    in_complex:
      id: GO:1990184
      label: amino acid transport complex
    supported_by:
      - reference_id: PMID:26305885
        supporting_text: "LAT1 and LAT2 are known to facilitate TH transport"
      - reference_id: PMID:11564694
        supporting_text: "Thyroid hormone transport by the heterodimeric human system L amino acid"
proposed_new_terms:
  - proposed_name: neutral L-amino acid:neutral L-amino acid antiporter activity
    proposed_definition: Enables the obligatory, electroneutral 1:1 exchange of one neutral L-amino acid
      on one side of a membrane for another neutral L-amino acid on the opposite side, i.e. antiport of
      neutral L-amino acids. This combines the antiporter mechanism (GO:0015297) with the neutral L-amino
      acid substrate class (GO:0015175).
    justification: GO has the generic GO:0015297 (antiporter activity) and the substrate-class
      GO:0015175 (neutral L-amino acid transmembrane transporter activity), but no term combining the
      obligatory-exchange mechanism with the neutral L-amino acid substrate class for system-L type
      transporters (LAT1/LAT2). A term analogous to GO:0015327 (cystine:glutamate antiporter activity)
      would let LAT1 (and LAT2/SLC7A8) be annotated to a single precise MF that encodes both mechanism
      and substrates, mirroring the many Rhea exchange reactions recorded in UniProt.
    supported_by:
      - reference_id: PMID:11847106
        supporting_text: "obligatory amino acid exchange with 1:1 stoichiometry"
suggested_questions:
  - question: What determines the strong asymmetry of LAT1 substrate affinities (high outside, low/mM
      inside) and how is intracellular substrate availability coupled to the net direction of essential
      amino acid import in different cell types?
suggested_experiments:
  - description: Reconstitute purified LAT1-SLC3A2 in proteoliposomes with defined internal/external
      amino-acid pools to measure exchange stoichiometry, substrate selectivity and the kinetic basis of
      net leucine accumulation, and to quantify thyroid-hormone/drug exchange against neutral amino acids.
