id: Q01650
gene_symbol: SLC7A5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SLC7A5 (LAT1, L-type amino acid transporter 1; 4F2 light chain) is the catalytic
  light chain of a heteromeric amino-acid transporter. It is a 12-transmembrane protein of the
  amino acid-polyamine-organocation (APC) superfamily that forms a disulfide-linked heterodimer
  with the heavy chain SLC3A2 (4F2hc/CD98hc), which is required for its folding, stability and
  delivery to the plasma membrane. The heterodimer is an obligatory, sodium- and pH-independent
  amino-acid antiporter that exchanges large neutral, branched-chain and aromatic L-amino acids
  (leucine, isoleucine, valine, phenylalanine, tyrosine, tryptophan, histidine, methionine) at
  1:1 stoichiometry across the plasma membrane. It also transports thyroid hormones and
  iodothyronines (T3, T4, rT3), L-DOPA, and pharmaceutical substrates (gabapentin, pregabalin,
  melphalan), and is a route for amino-acid-mimicking toxicants. Because it is an exchanger, net
  cellular accumulation of essential amino acids such as leucine is driven by efflux of other
  intracellular amino acids; this supplies amino acids for cell growth and for mTORC1 signalling,
  including a lysosomal pool delivered when LAPTM4B recruits the transporter to the lysosomal
  membrane. LAT1 is highly expressed in proliferating cells and tumors and at barrier epithelia
  (blood-brain barrier, placenta), making it a target for anti-cancer drugs and CNS drug delivery.
