    review:
      summary: PAINT assertion of L-amino acid transmembrane transporter activity across the SLC7 L-type clade.
      action: TOO_GENERAL
      reason: Correct but broader than the evidence supports - LAT1 specifically transports neutral and aromatic L-amino acids. Entailed by the accepted neutral L-amino acid transmembrane transporter activity (GO:0015175) and antiporter activity (GO:0015297).
