  # ---------------- IBA (PAINT) rows ----------------
  - term:
      id: GO:0003333
      label: amino acid transmembrane transport
    evidence_type: IBA
    original_reference_id: GO_REF:0000033
    qualifier: involved_in
    review:
      summary: Phylogenetic (PAINT) assertion that LAT1 is involved in amino acid transmembrane transport; the target appears in its own WITH/FROM, marking experimental grounding on LAT1 itself.
      action: TOO_GENERAL
      reason: True of LAT1 but uninformative - entailed by the specific substrate transport and neutral-amino-acid transport terms accepted in this review. The node placement is sound (system L transporters broadly transport amino acids); this is a refinement, not a removal.
  - term:
      id: GO:0005886
      label: plasma membrane
    evidence_type: IBA
    original_reference_id: GO_REF:0000033
    qualifier: is_active_in
    review:
      summary: PAINT assertion that LAT1 is active in the plasma membrane, consistent with its role as a cell-surface amino-acid exchanger.
      action: ACCEPT
      reason: Plasma membrane is the primary site of LAT1-4F2hc transport activity, confirmed by many direct studies. The IBA node placement agrees with the direct human evidence (LAT1 appears in its own WITH/FROM).
      supported_by:
        - reference_id: PMID:30867591
          supporting_text: "essential for the stability of LAT1 and for its localization to the plasma"
  - term:
