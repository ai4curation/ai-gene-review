core_functions:
- description: Mitochondrial 25-hydroxyvitamin D 1-alpha-hydroxylase producing hormonally active calcitriol from
    calcidiol, the rate-limiting step of vitamin D activation (renal proximal tubule for circulating hormone; extrarenal
    cells for local autocrine/paracrine action)
  molecular_function:
    id: GO:0004498
    label: calcidiol 1-monooxygenase activity
  directly_involved_in:
  - id: GO:1901755
    label: vitamin D3 biosynthetic process
  locations:
  - id: GO:0005743
    label: mitochondrial inner membrane
  supported_by:
  - reference_id: PMID:9415400
    supporting_text: Mammalian cells transfected with the cloned P450c1 alpha cDNA exhibit robust 1 alpha-hydroxylase
      activity.
  - reference_id: PMID:22862690
    supporting_text: CYP27B1 is a mitochondrial cytochrome P450 that catalyses the hydroxylation of 25-hydroxyvitamin
      D3 at the C1α-position to give the hormonally active form of vitamin D3, 1α,25-dihydroxyvitamin D3.
  - reference_id: PMID:10518789
    supporting_text: These results strongly suggest that the mutations found in the patients with PDDR completely
      abolished 1alpha-hydroxylase activity
  - reference_id: PMID:9415400
    supporting_text: These findings establish the molecular genetic basis of VDDR-1
proposed_new_terms: []
suggested_questions:
- question: How much of circulating 1,24,25(OH)3D3 is produced by CYP27B1 acting on CYP24A1 products, and does it
    have a distinct physiological role?
- question: What is the relative contribution of extrarenal CYP27B1 (macrophage, keratinocyte, bone) to systemic
    calcitriol in granulomatous disease versus health?
suggested_experiments:
- description: Cell-type-specific Cyp27b1 deletion (renal proximal tubule versus myeloid versus osteoblast) with
    measurement of serum and tissue calcitriol to partition endocrine versus local contributions.
