id: O15528
gene_symbol: CYP27B1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CYP27B1 (25-hydroxyvitamin D 1-alpha-hydroxylase) is a mitochondrial cytochrome P450, embedded in the
  inner mitochondrial membrane and supplied with electrons from NADPH through adrenodoxin reductase (FDXR) and adrenodoxin
  (FDX1). It catalyses the rate-limiting step of vitamin D activation, 1-alpha-hydroxylation of 25-hydroxyvitamin
  D3 (calcidiol) to 1-alpha,25-dihydroxyvitamin D3 (calcitriol), the hormonal ligand of the vitamin D receptor;
  it also 1-alpha-hydroxylates 25-hydroxyvitamin D2 and 24R,25-dihydroxyvitamin D3 and other CYP24A1 pathway intermediates.
  Its principal site of action for circulating calcitriol is the renal proximal tubule, where expression is induced
  by PTH and repressed by calcitriol and FGF23, but it is also expressed in keratinocytes, macrophages/dendritic
  cells, osteoblasts and other extrarenal cells where locally produced calcitriol acts in an autocrine/paracrine
  manner. Biallelic loss-of-function variants cause vitamin D-dependent rickets type 1A (pseudovitamin D-deficiency
  rickets).
