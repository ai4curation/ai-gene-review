suggested_questions:
- question: What is the transport mechanism and ion/counter-substrate coupling of
    CT2 for each substrate class? Carnitine transport is reported as only partially
    Na(+)-dependent and bidirectional; is CT2 a facilitated transporter, a
    Na(+)-cotransporter, or a polyamine-carnitine antiporter (as proposed for sperm
    capacitation), and what is the stoichiometry for spermidine and for drug cations?
- question: Does CT2 have an organismal phenotype on loss of function in humans? The
    sperm-maturation and fertilization annotations rest on expression/localization
    and substrate physiology rather than a human or mouse knockout; is SLC22A16 loss
    associated with carnitine-dependent sperm defects or subfertility?
- question: How general is CT2's role as a chemotherapy determinant? Beyond
    doxorubicin and bleomycin-A5, which clinically used cationic/polyamine-analogue
    drugs does CT2 import, and does tumor CT2 expression predict treatment response
    across germ-cell, hematologic and gynecologic cancers?
suggested_experiments:
- description: Reconstitute purified human CT2 in proteoliposomes and measure uptake
    and efflux of L-carnitine, spermidine, doxorubicin and bleomycin-A5 while
    independently controlling trans-side Na+ and the membrane potential, with
    electrophysiology, to define the coupling ion(s), stoichiometry, directionality
    and electrogenicity per substrate.
- description: Generate SLC22A16 knockout and knock-in (M409T) human testicular
    germ-cell and leukemic cell lines (and, where feasible, a mouse model) and
    quantify L-carnitine, spermidine, doxorubicin and bleomycin-A5 flux together
    with drug sensitivity, to test CT2 as a causal determinant of chemosensitivity
    and of carnitine-dependent sperm physiology.
- description: Map CT2 substrate recognition by mutagenesis of the carnitine- and
    polyamine-binding residues predicted from the SLC22 fold and the reported
    structure-activity relationship, correlating binding and transport of carnitine,
    spermidine and drug cations to distinguish shared from substrate-specific
    determinants.
