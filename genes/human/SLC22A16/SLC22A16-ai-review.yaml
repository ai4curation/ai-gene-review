id: Q86VW1
gene_symbol: SLC22A16
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SLC22A16 encodes CT2 (carnitine transporter 2; also OCT6, FLIPT2,
  "organic cation/carnitine transporter 6"), a 577-residue, 12-transmembrane
  plasma-membrane solute carrier of the SLC22 / major facilitator superfamily
  organic cation transporter family (TC 2.A.1.19). Its physiologically defining,
  high-affinity substrate is L-carnitine, and it is most strongly and specifically
  expressed in testis (Sertoli cells and the luminal membrane of epididymal
  epithelium) and in bone marrow and hematopoietic cells. In the male reproductive
  tract CT2-mediated L-carnitine secretion/uptake across the epididymal and
  Sertoli-cell membranes supplies the high luminal carnitine required for
  maturation and energy metabolism of spermatozoa. CT2 is polyspecific; beyond
  carnitine it mediates partially Na(+)-dependent, high-affinity transport of the
  polyamine spermidine (KM ~0.35 uM) and the uptake of xenobiotic organic cations
  and anticancer drugs, notably doxorubicin (adriamycin, KM ~5.2 uM) and the
  spermidine-bearing bleomycin-A5. Because these drugs enter cells through CT2,
  its expression level is a determinant of chemosensitivity in leukemic, germ-cell
  and other tumor cells.
