- term:
    id: GO:0046717
    label: acid secretion
  evidence_type: IDA
  original_reference_id: PMID:12089149
  qualifier: involved_in
  review:
    summary: IDA for acid secretion, derived from CT2-mediated secretion of
      L-carnitine (a carboxylate) into the epididymal lumen.
    action: MARK_AS_OVER_ANNOTATED
    reason: The observation behind this row is active L-carnitine secretion into the
      epididymal lumen, already captured by the carnitine-transport rows. L-carnitine
      is a zwitterion, not a secreted acid, so mapping it to the generic "acid
      secretion" term is an over-/mis-annotation that adds no correct information.
    source_defects:
    - defect_type: WRONG_TERM
      resource: UNIPROT
      requested_change: REPOINT
      slot: term.id
      asserted_value: 'GO:0046717 acid secretion (IDA, PMID:12089149) for
        CT2-mediated L-carnitine secretion into the epididymal lumen'
      corrected_value: 'GO:0015879 carnitine transport'
      cause: OTHER
      confidence: PROBABLE
      explanation: The paper shows active secretion of L-carnitine (a zwitterionic
        carboxylate) into the epididymal lumen; this is carnitine transport, not acid
        secretion. The "acid secretion" term appears to be an over-literal mapping of
        the carboxyl group and should be repointed to carnitine transport (already
        annotated).
