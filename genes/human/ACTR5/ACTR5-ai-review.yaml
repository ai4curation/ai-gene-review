core_functions:
- description: The nucleosome grip point of INO80's catalytic C-module. ARP5, paired obligately with IES6/INO80C,
    binds the nucleosome on the face opposite the Ino80 motor domains, its DNA-binding domain contacting
    the nucleosomal DNA phosphate backbone in the minor groove at superhelical location -3 (state N-7)
    or -2 (state N-6), and near the dyad on a hexasome. The contact is sequence-independent and is the
    anchor against which the motor pumps DNA.
