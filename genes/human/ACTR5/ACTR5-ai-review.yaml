knowledge_gaps:
- gap_statement: The surface by which human ARP5 binds H2A-H2B, and whether that binding occurs at physiological
    concentrations, are undetermined.
  boundary: 'Purified human ARP5 does capture untagged H2A-H2B dimers in vitro, and yeast Arp5 binds free
    H2A-H2B dimers through a mapped hydrophobic/acidic Leu-Asp patch. What is not established for human
    ARP5 is which residues mediate it: human ARP5''s insertion domain lacks the acidic-patch-binding foot
    present in fungal Arp5, the human pull-down is a single experiment at 20 uM bait and 40 uM prey, and
    the adjacent panel of the same figure shows ARP5 alone fails to bind nucleosomes at in-vivo-relevant
    concentrations.'
