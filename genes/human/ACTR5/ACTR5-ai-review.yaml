suggested_questions:
- question: 'PAINT recommendation for node PTN000233752 (ARP5 subfamily within PTHR11937), stated once
    for the whole node rather than per gene. Three changes are warranted. (1) The GO:0005737 cytoplasm
    annotation should carry located_in, not is_active_in: the compartment is real for ACTR5 and for Arabidopsis
    ARP5, but no ARP5 molecular function has been demonstrated outside the nucleus in any organism. (2)
    A nucleosome-binding molecular function should propagate from this node: budding-yeast ARP5 (SGD:S000005004),
    a WITH/FROM donor on four of ACTR5''s five IBA rows, carries GO:0031491 nucleosome binding by IDA
    (PMID:39676660), yet no other ARP5 ortholog has received it, and human ACTR5 has its own direct structural
    evidence for the more specific GO:0031492 nucleosomal DNA binding. (3) A nucleotide-binding molecular
    function is missing family-wide: checked in QuickGO, none of human ACTR5, fly Arp5, budding-yeast
    ARP5, fission-yeast arp5 or Arabidopsis ARP5 carries any term under GO:0000166, despite the ASKHA_NBD_Arp5
    fold and ADP resolved in the ARP5 chain of three human INO80 structures. That third gap is the same
    one the ACTR1A, ACTR1B and ACTR10 reviews reported independently for the dynactin ARPs, which suggests
    it is systematic across the actin family rather than specific to ARP5.'
  experts:
  - GO_Central PAINT curators
  - PANTHER
- question: ComplexPortal projects complex-level annotations onto every subunit while retaining the original
    evidence code. Five of ACTR5's rows are IMP on experiments in which ACTR5 was not the perturbed gene
    product; for PMID:25016522 this is verifiable, because the cached full text contains zero occurrences
    of "Arp5" or "ACTR5" and the knockdowns were of INO80 and ARP8. Should such projections carry IC (inferred
    by curator) with the complex as the with/from, reserving IMP for subunits that were themselves perturbed?
    The projections themselves look right; only the evidence code overstates directness.
  experts:
  - ComplexPortal
  - GO Consortium evidence-code working group
- question: Is GO:0030234 enzyme regulator activity, or any of its descendants, the right shape for a
    subunit that regulates the catalytic subunit of its own complex? ARP5 is not a separate factor acting
    on INO80; it is part of INO80. This review keeps a regulator term (refined to GO:0060590 ATPase regulator
    activity, which the donor's own IDA supports) and adds contributes_to GO:0140658, but GO may prefer
    only the latter. A general convention would help, because the same question arises for IES2/INO80B
    and for the RuvBL1/2 module.
  experts:
  - GO Consortium molecular-function working group
- question: Human ARP5 lacks the fungal grappler's acidic-patch-binding foot, and human INO80 nonetheless
    slides both nucleosomes and hexasomes, with only reduced rather than abolished dependence on the H2A
    acidic patch. Has the anchoring role of the ARP5 insertion domain been redistributed in metazoans
    -- to IES2's arginine anchor, or to the DNA-mediated ARP5/IES6 contacts -- and does that change which
    nucleosome substrates human INO80 can act on?
  experts:
  - Chromatin remodelling structural biologists
- question: ARP5 interacts with DDB1 and is recruited to UV-damaged DNA before incision. Is that recruitment
    DDB1/UV-DDB-dependent, and does ARP5's nucleosomal-DNA grip participate in exposing the lesion, or
    only in repositioning nucleosomes after recognition? This would decide whether a damage-recognition
    term, as well as GO:0070914, is warranted.
  experts:
  - Nucleotide excision repair community
suggested_experiments:
- hypothesis: Human ARP5's DBD loop residues that contact nucleosomal DNA in the minor groove at SHL -2/-3
    are required for INO80 nucleosome sliding, as their fungal equivalents are.
  description: Reconstitute human INO80 with ARP5 carrying substitutions of the DBD loop residues identified
    in the 2026 nucleosome and hexasome structures, and assay nucleosome and hexasome sliding and ATPase
    side by side, using the published IES6 G135A/K136A/K137A mutant as an internal positive control. A
    sliding defect with retained ATPase would validate contributes_to GO:0031492 functionally, not just
    structurally.
  experiment_type: structure-function mutagenesis with in vitro remodelling assays
- hypothesis: 'The ADP in ACTR5''s actin cleft is structural rather than catalytic: it does not turn over,
    and its loss destabilises the protein rather than abolishing an activity.'
  description: Measure nucleotide content and exchange kinetics on purified human ARP5 and ARP5-IES6 (HPLC
    or fluorescent nucleotide analogues), test for ATP hydrolysis with and without nucleosomes, and determine
    a structure from a preparation with no nucleotide analogue in the buffer. Compare thermal stability
    of wild-type ARP5 with substitutions in the phosphate-binding loops (G38/S39/R43) predicted from the
    alignment to beta-actin.
  experiment_type: biochemistry and cryo-EM
- hypothesis: Human ARP5 binds H2A-H2B through the surface equivalent to the hydrophobic/acidic Leu-Asp
    patch mapped in yeast Arp5, and does so at physiological concentrations.
  description: Quantify ARP5 and ARP5-IES6 binding to H2A-H2B dimers by MST or ITC across a sub-micromolar
    to micromolar range, then mutate the candidate patch identified by aligning human ARP5 to the yeast
    region. Include the nucleosome EMSA from the same figure as the concentration control, so the affinity
    is interpreted against a known threshold.
  experiment_type: quantitative binding assays with targeted mutagenesis
- hypothesis: ARP5 and IES6 do not exist as a functional module outside the INO80 complex, so the reported
    HepG2-selective dependency reflects differential redundancy rather than an INO80-independent activity.
  description: In HepG2 cells, size-fractionate nuclear extract and ask whether any ARP5-IES6 species
    elutes free of the Ino80 motor and RuvBL1/2 (crosslinking mass spectrometry on the fractions). Then
    test whether the ARP5 requirement for proliferation survives acute degron depletion of the Ino80 ATPase.
    Absence of a free module plus loss of the ARP5 requirement on Ino80 depletion would settle the question
    against INO80-independence.
  experiment_type: biochemical fractionation plus degron genetics
- hypothesis: ARP5's role in the double-strand break response is repair, not only damage signalling.
  description: Run homologous-recombination (DR-GFP) and end-joining (EJ5-GFP) reporter assays in ARP5-depleted
    cells, with rescue by wild-type ARP5 and by a DBD-loop mutant. Read out repair efficiency rather than
    gamma-H2AX, so that signalling and repair are separated.
  experiment_type: DNA repair reporter assays with structure-guided rescue
