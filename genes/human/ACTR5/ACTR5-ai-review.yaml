- id: file:human/ACTR5/ACTR5-bioinformatics/RESULTS.md
  title: 'ACTR5 (ARP5) actin-fold audit: nucleotide site and filament interface'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'This review''s own reproducible analysis: nucleotide ligands in the ARP5 chain of all
      six deposited human INO80 structures, a reciprocal test that the site is the canonical actin cleft,
      the actin catalytic positions, and the F-actin protomer interface with ARP1 as a positive control.
      Regenerating it reproduces the committed report byte-for-byte, and four deliberate break-tests confirm
      the guards fail loudly.'
