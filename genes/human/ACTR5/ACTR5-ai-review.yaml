description: 'ACTR5 (ARP5) is a nuclear actin-related protein and an obligate subunit of the human INO80
  ATP-dependent chromatin-remodelling complex. It belongs to the actin family, ARP5 subfamily: it retains
  the actin fold and an occupied nucleotide cleft -- ADP is resolved inside the ARP5 chain in three cryo-EM
  structures of the human complex -- but it has lost most of the actin ATP-hydrolysis machinery and the
  filament protomer interface, so it neither hydrolyses the bound nucleotide nor polymerises. Within INO80
  it sits in the catalytic C-module alongside the Ino80 Snf2 motor, IES6/INO80C, IES2/INO80B and the RuvBL1-RuvBL2
  heterohexamer, and it forms an obligate pair with IES6. Together they bind the nucleosome on the face
  opposite the motor domains, ARP5''s DNA-binding domain gripping the nucleosomal DNA phosphate backbone
  in the minor groove around superhelical location -2 to -3. That grip is the anchor against which the
  motor pumps DNA, and it is what couples ATP hydrolysis to directional nucleosome sliding rather than
  to futile turnover; ARP5 also binds free H2A-H2B dimers in vitro. Human ARP5 has a much smaller insertion
  domain than its fungal counterparts and lacks the foot that grips the H2A/H2B acidic patch, so its nucleosome
  engagement is predominantly DNA-mediated. Through INO80, ARP5 acts in transcriptional regulation, DNA
  replication and DNA repair; its own loss-of-function phenotypes include impaired removal of UV photolesions,
  to which it is recruited before incision and where it interacts with DDB1, and impaired growth and gamma-H2AX
  accumulation after double-strand break induction, with reduced chromatin-bound INO80. It is predominantly
  nuclear, excluded from nucleoli and released from chromosomes as mitosis progresses, but shuttles between
  nucleus and cytoplasm. In hepatocellular carcinoma cells ARP5 occupies the CDKN2A promoter and is required
  to keep it silenced, sustaining CDK/E2F-driven proliferation.'
