  - UniProtKB:O60437
  review:
    summary: A single high-throughput two-hybrid screen logged three ways, pairing a nuclear chromatin-remodelling
      subunit with a desmosomal plakin cytolinker; no orthogonal assay and no follow-up.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'Querying IntAct directly for Q9H9F9 shows this interaction recorded under three method names
      from the same HuRI publication -- two hybrid array, two hybrid prey pooling approach and validated
      two hybrid -- which is where UniProt''s NbExp=3 for PPL comes from. They are sub-methods of one
      experiment, not three experiments; the same trap was documented on ACRV1. Periplakin (O60437, reviewed,
      1756 aa) is a plakin-family cytolinker of desmosomes and the cornified envelope, with no reported
      nuclear or chromatin function, and ACTR5 is a subunit of a nuclear remodelling complex. Nothing
      in ACTR5''s own literature mentions periplakin. Marked as over-annotated rather than removed: an
      unreplicated screen hit is weak, not demonstrably false, and both accessions are canonical reviewed
      entries so there is no misidentification to argue from.'
