- term:
    id: GO:0005515
    label: protein binding
  qualifier: enables
  evidence_type: IPI
  original_reference_id: PMID:18163988
  supporting_entities:
  - UniProtKB:Q9H981
  review:
    summary: A real, targeted binary interaction with a distinct biological point -- the ARP5-ARP8 association
      is present in interphase and lost in metaphase -- but protein binding is still an uninformative
      term.
    action: KEEP_AS_NON_CORE
    reason: 'Unlike the whole-complex co-purifications, this is a hypothesis-driven reciprocal co-immunoprecipitation,
      and UniProt reads it as evidence that the INO80 complex may dissociate in mitosis. The same paper
      is the source of a useful negative for ACTR5: ARP8, not ARP5, accumulates on mitotic chromosomes,
      and ARP5 depletion does not misalign chromosomes -- so no chromosome-segregation function should
      be inferred for this gene. Kept as non-core because GO:0005515 names no activity; the functionally
      informative MF for ACTR5''s role in the module is contributes_to GO:0031492 nucleosomal DNA binding,
      proposed below. Partner accession Q9H981 resolves to reviewed Swiss-Prot ACTR8, 624 aa, the canonical
      entry.'
    supported_by:
    - reference_id: PMID:18163988
      supporting_text: Here we report that hArp8, but not hArp5, accumulates on mitotic chromosomes
      reference_section_type: ABSTRACT
    - reference_id: PMID:18163988
      supporting_text: depletion of hIno80 and hArp5 did not cause misalignment of chromosomes
      reference_section_type: ABSTRACT
