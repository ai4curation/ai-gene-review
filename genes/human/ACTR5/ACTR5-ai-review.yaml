- description: 'Mechanochemical coupling within the INO80 remodeller. ARP5 is required for the complex''s
    ATP-dependent nucleosome-remodelling activity and, specifically, for coupling the Ino80 motor''s ATP
    hydrolysis to productive, directional nucleosome movement rather than to futile turnover: adding the
    Arp5-Ies6 module back stimulates both ATPase and sliding, whereas deleting ARP5''s insertion domains
    leaves ATP hydrolysis intact but uncoupled from sliding. Through this activity ARP5 acts in chromatin-dependent
    DNA repair, including removal of UV photolesions and the response to double-strand breaks.'
