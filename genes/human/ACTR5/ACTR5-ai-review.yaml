  qualifier: is_active_in
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: The compartment is real -- hARP5 shuttles -- but is_active_in asserts that ACTR5 carries
      out its molecular function there, and nothing has ever been shown for the cytoplasmic pool beyond
      its existence in transit.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'This is a qualifier defect, not a term defect, and not a source defect. The donors are sound:
      Arabidopsis ARP5 (Q940Z2) has its own cytoplasm IDA (PMID:19679120) and ACTR5 has its own (PMID:19014934),
      reporting genuine nucleo-cytoplasmic shuttling of a predominantly nuclear protein. But is_active_in
      is the strong CC relation: it claims the gene product executes its MF in that compartment. Every
      characterised ARP5 activity is nuclear -- nucleosomal DNA binding at SHL -2/-3, assembly into the
      INO80 C-module, chromatin remodelling, the double-strand-break and UV-lesion phenotypes -- and no
      cytoplasmic activity, partner or complex has been reported for ARP5 in any organism. Recommended
      fix at node PTN000233752: change is_active_in to located_in. The two located_in cytoplasm rows are
      kept.'
    supported_by:
    - reference_id: PMID:19014934
      supporting_text: We show here that hArp5 shuttles between the nucleus and the cytoplasm
      reference_section_type: ABSTRACT
