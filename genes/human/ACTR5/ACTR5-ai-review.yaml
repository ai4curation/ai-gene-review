- term:
    id: GO:0030234
    label: enzyme regulator activity
  qualifier: enables
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: The regulatory relationship is real but the term names neither the enzyme nor the activity;
      replace with ATPase regulator activity plus, with contributes_to, the remodeler activity of the
      complex ACTR5 is part of.
    action: MODIFY
    reason: 'The single non-node donor is budding-yeast ARP5 (P53946), whose own IDA for this term (PMID:26306040)
      measured something specific: adding back the Arp5-Ies6 module stimulates the INO80 ATPase and nucleosome
      sliding, and an insertion-domain deletion uncouples the two. The regulated enzyme is therefore an
      ATP hydrolysis activity, which GO:0060590 ATPase regulator activity names and GO:0030234 does not.
      Hierarchy checked in QuickGO and confirmed in OLS rather than assumed: GO:0060590''s only is_a parent
      is GO:0060589 nucleoside-triphosphatase regulator activity, which is_a GO:0030234, so GO:0060590
      is a descendant two steps below the current term rather than a direct child; and GO:0001671 ATPase
      activator activity''s only is_a parent is GO:0140677 molecular function activator activity, so GO:0001671
      is not in the GO:0030234 branch at all, and moving there would leave the branch rather than refine
      within it. GO:0001671 is nevertheless the term the yeast add-back would license, and it is named
      here as the available alternative rather than dismissed: a curator who weights PMID:26306040''s
      explicit stimulation result above the human coupling data should use it. This review prefers the
      direction-neutral GO:0060590 because the yeast result is an ectopic reconstitution add-back of the
      whole Arp5-Ies6 module, and because in human INO80 the mutations that break the ARP5/IES6-side nucleosome
      contacts lose sliding while retaining robust ATPase -- so what the human evidence isolates is coupling,
      not stimulation. GO:0140658 is added as a second replacement because a regulator term is arguably
      the wrong shape for an obligate subunit of the same complex: with contributes_to, GO:0140658 states
      ACTR5''s participation in the machine''s own catalytic activity, which PMID:21303910 shows requires
      the complete conserved subunit set. The donor is not weak -- it carries a real IDA -- so this is
      a term-scoping issue, not a source problem.'
    proposed_replacement_terms:
    - id: GO:0060590
      label: ATPase regulator activity
    - id: GO:0140658
      label: ATP-dependent chromatin remodeler activity
    supported_by:
