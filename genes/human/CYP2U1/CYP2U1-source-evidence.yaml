synthesis_limits:
- No steroid function is rejected solely from missing assays.
- No respiratory, folate, contact-site or vitamin-oxidation NEW process is inferred from perturbations
  or binding.
- The physiological role of lipidated-serotonin oxidation and native mitochondrial subcompartment remain
  open.
- 'The first two fatty-acid cores include mitochondrial localization with an explicit knowledge gap: compartment-specific
  catalytic flux was not measured. Their established chemistry is not recast as a direct isolated-mitochondrial
  turnover experiment.'
