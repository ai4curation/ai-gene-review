    steroid assertions remain uncertain without inventing loss.
  - The xenobiotic IBD at PTN000670347 is independently corroborated by human target turnover in PMID:41946119.
    Cytoplasm is broad and includes organelles; it does not mean soluble cytosol.
  - The heme and flavoprotein-donor IBDs at PTN008612736 agree with direct CYP2U1 chemistry. Target self-evidence
    is legitimate experimental grounding, not circularity.
