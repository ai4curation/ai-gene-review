    20-HETE.
  limits: DHA products were unresolved hydroxy versus epoxy species. Ketoconazole/17-ODYA are inhibitors,
    not demonstrated substrates. No steroid-turnover panel was inspected. Microsomal expression is not
    native human topology.
- reference: PMID:24563460
  url: https://pubmed.ncbi.nlm.nih.gov/24563460/
  repository_cache: ../../../publications/PMID_24563460.md
  original_locator: https://www.eatris.cz/sites/default/files/publication/impact/868-oxidation-of-endogenous-n-arachidonoylserotonin-by-human-cytochrome-p450-2u1.pdf
  access: Normal cache contains full text. Independent chemistry consultation read institutional-manuscript
    Methods/Results/Discussion and inspected Figures 3, 5 and 11.
  assay: Human recombinant preparations with POR/NADPH produce arachidonate hydroxylation and structurally
    identified 2-oxo-N-arachidonoylserotonin.
  limits: Bacterial N-terminally proteolyzed forms start at 34/36/43; their separate activities were not
    determined. They are not the 168-aa splice product. Substrate/product FAAH pharmacology does not establish
    endogenous CYP2U1 regulation of FAAH. Inconsistent catalase-sensitive melatonin signals are not a
    universal xenobiotic negative.
- reference: PMID:23176821
  url: https://pubmed.ncbi.nlm.nih.gov/23176821/
  repository_cache: ../../../publications/PMID_23176821.md
  access: Complete selected cached main-text Methods/Results/Discussion were personally read; Figure S7
    pixels/supplement were not available.
  assay: Human GFP-CYP2U1 in HeLa cells partially colocalizes with SDHA and calregulin; human patient
    fibroblast/lymphoblast bioenergetic assays and separate mouse expression experiments are distinguished.
  limits: The microscopy supports the mitochondrial organelle but does not resolve its inner membrane
    or native-protein topology. It does not directly measure fatty-acid turnover in an isolated mitochondrial
    CYP2U1 pool. Disease perturbations do not identify a direct respiratory-chain reaction catalyzed by
    CYP2U1.
- reference: PMID:34546337
  url: https://pubmed.ncbi.nlm.nih.gov/34546337/
  original_locator: https://pmc.ncbi.nlm.nih.gov/articles/PMC8480666/
  repository_cache: ../../../publications/PMID_34546337.md
  access: Genuine full XML and normal cache; selected complete Results/Methods/captions read, no figure
    pixels.
  assay: Mouse knockout brain and patient fibroblasts show reduced ER–mitochondria contacts; mouse/patient
    metabolic analyses and formate supplementation support disease context. Recombinant human CYP2U1 quenches
    riboflavin fluorescence, apparent Kd 9 µM, with docking models.
  limits: The vitamin-B2 section heading is stronger than the demonstrated binding/modeling. No identified
    enzymatic riboflavin product or direct turnover assay was inspected. Contact loss is not proof of
    CYP2U1 inner-membrane location or a structural tether function.
- reference: PMID:41946119
  url: https://pubmed.ncbi.nlm.nih.gov/41946119/
  original_locator: https://pmc.ncbi.nlm.nih.gov/articles/PMC13169326/
  repository_cache: ../../../publications/PMID_41946119.md
  access: Genuine normally fetched XML-derived full text; selected complete Methods/Results/Discussion
    and captions read, no figure pixels.
  assay: N-terminally modified His-tagged human CYP2U1 in nanodiscs with CPR/NADPH forms sorafenib N-oxide
    and N-desethyl sunitinib, analyzed by chromatography/mass spectrometry against standards with measured
    formation rates.
  limits: Supports existing contextual xenobiotic metabolism. Clinical clearance, thymus-specific efficacy
    and the 168-aa product are not established by this reconstitution. Methods and Results report different
    incubation temperatures; that discrepancy does not erase product identification.
