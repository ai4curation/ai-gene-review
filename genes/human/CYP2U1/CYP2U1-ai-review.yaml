    supporting_text: identified as 19- and 20-hydroxy-modified arachidonic acids
  - reference_id: PMID:24563460
  - reference_id: PMID:23176821
  knowledge_gaps:
  - gap_statement: The contribution of the mitochondrial CYP2U1 pool to this fatty-acid reaction remains
      unmeasured.
    boundary: Mitochondrial location reflects tagged-protein colocalization in human cells; the inspected
      studies do not directly measure this turnover in isolated mitochondria or resolve native submitochondrial
      topology.
    provenance:
