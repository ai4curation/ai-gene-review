id: Q7Z449
gene_symbol: CYP2U1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CYP2U1 is a membrane-associated, heme-containing cytochrome P450 expressed in the thymus
  and brain and localized to the endoplasmic reticulum and mitochondria. It uses NADPH-derived electrons
  delivered by cytochrome P450 reductase to hydroxylate long-chain fatty acids, forming 19- and 20-HETE
  from arachidonic acid. It also oxidizes the indole ring of N-arachidonoylserotonin, and recombinant
  enzyme can metabolize sorafenib and sunitinib. Biallelic loss of function causes hereditary spastic
  paraplegia 56; patient and mouse studies associate deficiency with disturbed mitochondrial physiology,
  lipid balance and folate-related metabolism.
alternative_products:
- name: '1'
  id: Q7Z449-1
  description: The displayed 544-residue product contains the complete P450 catalytic region. The original
    Sf9 biochemical study used a 544-residue human construct; later bacterial preparations and nanodisc
    constructs have distinct experimental N-terminal modifications.
- name: '2'
  id: Q7Z449-2
  sequence_note: VSP_026222, VSP_026223
  description: The official 168-residue splice product replaces residues 164–168 and lacks canonical residues
    169–544. Catalytic activity, localization and physiological role of this short product were not established
    by the inspected assays; it is distinct from N-terminal proteolysis of long bacterial constructs.
