core_functions:
- description: Heme-dependent terminal hydroxylation of long-chain fatty acids produces omega-hydroxy
    lipids, including 20-HETE from arachidonate, using oxygen and NADPH-derived electrons delivered by
    P450 reductase.
  molecular_function:
    id: GO:0102033
    label: long-chain fatty acid omega-hydroxylase activity
