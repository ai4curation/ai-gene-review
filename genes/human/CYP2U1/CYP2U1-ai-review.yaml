- description: CYP2U1 oxygenates the C2 position of the indole ring of N-arachidonoylserotonin to form
    its 2-oxo product. This biochemical transformation uses the heme/P450-reductase oxygenation system
    and differs from oxidation of the substrate’s fatty-acid chain.
  proposed_molecular_function: N-arachidonoylserotonin 2-monooxygenase activity
  locations:
  - id: GO:0005789
    label: endoplasmic reticulum membrane
  supported_by:
  - reference_id: PMID:24563460
    supporting_text: oxygenation at C-2 of the indole ring.
  knowledge_gaps:
  - gap_statement: The contribution of this measured reaction to endogenous human lipid signaling and
      FAAH regulation remains unresolved.
    boundary: The 2-oxo product is structurally established in recombinant assays; its FAAH inhibitory
      potency differs from the substrate.
    provenance:
    - reference_id: PMID:24563460
proposed_new_terms:
- proposed_name: N-arachidonoylserotonin 2-monooxygenase activity
  proposed_definition: 'Catalysis of the reaction: N-arachidonoylserotonin + reduced NADPH–hemoprotein
    reductase + O2 = 2-oxo-N-arachidonoylserotonin + oxidized NADPH–hemoprotein reductase + H2O + H+.
    Oxygen is incorporated at indole C2.'
  justification: Human CYP2U1 forms the structurally characterized 2-oxo product, represented by literal
    RHEA:50296 on the official protein record. Bounded current GO/OLS substrate and reaction searches
    did not identify a precise activity term. GO:0036190 instead describes free indole to indolin-2-one
    and cannot be substituted for the lipidated-serotonin reaction. This requests a specific term without
    asserting exhaustive ontology absence or a new physiological process.
  proposed_parent:
    id: GO:0016712
    label: oxidoreductase activity, acting on paired donors, with incorporation or reduction of molecular
      oxygen, reduced flavin or flavoprotein as one donor, and incorporation of one atom of oxygen
  proposed_mappings:
  - predicate: skos:exactMatch
    target_term:
      id: RHEA:50296
      label: N-arachidonoylserotonin oxygenation to its 2-oxo product
  supported_by:
  - reference_id: PMID:24563460
  - reference_id: file:human/CYP2U1/CYP2U1-uniprot.txt
suggested_questions:
- question: Which endogenous substrate transformations account for the mitochondrial and neurodevelopmental
    consequences of CYP2U1 loss?
- question: Does the 168-residue splice product have a stable endogenous protein product and a function
    distinct from the complete P450?
- question: What is the native submitochondrial location of CYP2U1, and is its ER-associated pool enriched
    at organelle contact sites?
- question: Does human CYP2U1 retain any steroid-hydroxylating substrate range inferred at the ancestral
    PAINT node?
- question: Does CYP2U1 catalyze riboflavin oxidation, and what product is formed, beyond the demonstrated
    binding and modeling observations?
suggested_experiments:
- hypothesis: Endogenous human CYP2U1 contributes to cellular conversion of N-arachidonoylserotonin to
    its 2-oxo product.
  description: In a human neural cell model with measurable endogenous CYP2U1 and substrate, compare wild-type
    cells, an isogenic CYP2U1 knockout and rescue with the full-length product at matched expression.
    Quantify endogenous substrate and 2-oxo product by targeted LC-MS/MS using authentic standards and
    isotope-labeled internal standards, with a low-dose stable-isotope substrate tracing arm to distinguish
    turnover from altered substrate abundance. Confirm rescue protein abundance and localization. A loss-and-rescue
    effect on product flux would support cellular participation; a negative result would remain specific
    to the tested cell state and substrate availability.
  experiment_type: Isogenic loss-and-rescue with targeted isotope-tracing lipidomics
