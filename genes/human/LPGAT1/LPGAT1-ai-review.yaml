- id: PMID:15485873
  title: Identification and characterization of a gene encoding human LPGAT1, an endoplasmic
    reticulum-associated lysophosphatidylglycerol acyltransferase.
  findings:
  - statement: Recombinant human LPGAT1 increased lysophosphatidylglycerol acyltransferase activity
      in two heterologous expression systems.
    supporting_text: Expression of the LPGAT1 cDNA in Sf9 insect and COS-7 cells led to a significant
      increase in LPG acyltransferase activity.
  - statement: The original study reported no detectable activity against several other lysophospholipid
      classes under its assay conditions.
    supporting_text: In contrast, no significant acyltransferase activities were detected against
      glycerol 3-phosphate or a variety of lysophospholipids, including lysophosphatidylcholine,
      lysophosphatidylethanolamine, lysophosphatidylinositol, and lysophosphatidylserine.
  - statement: The recombinant human enzyme preferred long-chain saturated acyl-CoAs and oleoyl-CoA
      among tested donors.
    supporting_text: The recombinant human LPGAT1 enzyme recognized various acyl-CoAs and LPGs
      as substrates but demonstrated clear preference to long chain saturated fatty acyl-CoAs
      and oleoyl-CoA as acyl donors
  - statement: Human LPGAT1 localized to the endoplasmic reticulum by fractionation and immunohistochemistry.
    supporting_text: LPGAT1 was localized to the endoplasmic reticulum by subcellular fractionation
      and immunohistochemical analyses.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: Direct human enzyme and ER-localization study, verified from the PubMed abstract.
      Its LPG substrate interpretation is now disputed by position-resolved studies, especially
      PMID:42173283, which proposes LPG acyl migration as the source of the historical assignment
      and finds no significant PG remodeling in vivo. The ER localization remains strong.
