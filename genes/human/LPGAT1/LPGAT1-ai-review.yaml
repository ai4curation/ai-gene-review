suggested_questions:
- question: >-
    Is lysosomal degradation the dominant source of LPGAT1 substrates in intact
    human tissues, and which PLA1/export components supply them?
- question: >-
    What are the endogenous LPC, LPE, LPS, and acyl-CoA preference hierarchies of
    human LPGAT1 across cell types?
- question: >-
    Can rigorously position-defined assays reproduce any direct LPGAT1-dependent LPG
    acylation or PG remodeling in human cells?
- question: >-
    Does human LPGAT1 directly catalyze monoacylglycerol acylation, or are
    triglyceride phenotypes secondary to altered membrane-lipid salvage?
- question: >-
    Which regenerated PC, PE, or PS species account for mitochondrial and hepatic
    phenotypes, and is PHB/TIMM14 association causal or transient?
- question: >-
    Are any endogenous LPGAT1 isoforms, orientations, or stable regulatory partners
    functionally distinct?
suggested_experiments:
- hypothesis: >-
    Endocytic lysosomal PLA1 processing supplies most endogenous unsaturated
    1-lyso-2-acyl substrates to ER-localized LPGAT1 in human cells.
  description: >-
    Combine isotope-labeled endocytic PC/PE/PS pulse-chase experiments with
    endogenous knockout/rescue of LPGAT1, PLA1 candidates, PLA2G15, PLBD2, and SPNS1
    in primary human hepatic and cardiac models, tracking positional lysolipids and
    regenerated phospholipids across lysosome and ER fractions.
  experiment_type: lysosome-to-ER phospholipid salvage tracing
- hypothesis: >-
    Native human LPGAT1 preferentially installs stearate into unsaturated
    1-lyso-2-acyl LPC and LPE, with weaker but genuine LPS flux.
  description: >-
    Use endogenous LPGAT1 knockout and expression-matched rescue with wild-type or
    catalytic-null protein, then quantify kinetic competition among position-defined
    LPC/LPE/LPS acceptors and C18:0-, C16:0-, and C18:1-CoA donors by targeted
    fluxomics.
  experiment_type: endogenous positional substrate competition
- hypothesis: >-
    Historical LPG activity reflects acyl migration rather than physiological PG
    remodeling.
  description: >-
    Prepare stabilized, analytically verified 1- and 2-acyl LPG isomers, monitor acyl
    migration throughout the assay, and compare product formation by purified and
    native human LPGAT1 with PG flux after knockout and genomic rescue.
  experiment_type: disputed LPG activity resolution
- hypothesis: >-
    LPGAT1-dependent triglyceride changes arise from lipid-flux repartitioning rather
    than direct human MGAT catalysis.
  description: >-
    Measure direct monoacylglycerol-to-diacylglycerol conversion alongside
    lysophospholipid reacylation in purified preparations and endogenous human-cell
    perturbations, then use isotope tracing to distinguish catalytic MGAT flux from
    secondary triglyceride accumulation.
  experiment_type: MGAT versus salvage-flux discrimination
- hypothesis: >-
    Loss of stearoyl-unsaturated PC/PE/PS regeneration, rather than defective PG
    remodeling, causes mitochondrial dysfunction after LPGAT1 loss.
  description: >-
    Restore individual positional PC/PE/PS species or PG in LPGAT1-null human liver
    and cardiac organoids, compare catalytic and PHB/TIMM14-interface rescue, and
    quantify membrane transfer, crista structure, respiration, cardiolipin synthesis,
    and stress responses.
  experiment_type: causal mitochondrial lipid-species rescue
