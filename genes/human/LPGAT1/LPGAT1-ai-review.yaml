id: Q92604
gene_symbol: LPGAT1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'LPGAT1, increasingly termed LPLAT7, is an integral endoplasmic-reticulum membrane
  lysophospholipid acyltransferase that restores saturated fatty acids to the sn-1 position
  of membrane phospholipids. Position-resolved human-enzyme assays show preferential use of
  unsaturated 1-lyso-2-acyl lysophosphatidylcholine and lysophosphatidylethanolamine acceptors,
  weaker activity toward lysophosphatidylserine, and a strong preference for stearoyl-CoA over
  palmitoyl- or oleoyl-CoA. Human Huh7 knockout and tracer experiments indicate that lysosomal
  phospholipid degradation is a major source of these substrates: PLA1 products generated from
  endocytosed phospholipids are delivered to ER-localized LPGAT1 and reacylated to 1-stearoyl-2-unsaturated
  PC, PE, and PS. This salvage reaction couples lysosomal phospholipid turnover to ER membrane
  regeneration and partitions lipid flux away from triglyceride and lipid-droplet accumulation
  in the tested hepatic-cell and mouse systems. Historical studies also report LPG acylation
  and mouse monoacylglycerol acyltransferase activity. Their efficiencies and physiological
  contributions differ among expression systems and experimental conditions; strong PC/PE preference
  does not establish absolute loss of these secondary capacities.'
