    review_notes: Reactome provides pathway provenance for PG Lands-cycle remodeling. LPGAT1 participation is contested by newer position-resolved biochemistry and Huh-7/mouse lipidomics, so the pathway record should not outweigh the direct evidence.
- id: PMID:20018982
  title: Novel acyl-coenzyme A:monoacylglycerol acyltransferase plays an important role in hepatic triacylglycerol secretion.
  findings:
  - statement: This mouse study identified LPGAT1 as a monoacylglycerol acyltransferase candidate.
    supporting_text: >-
      In this study, we identified a novel MGAT gene, which is identical with lysophosphatidylglycerol acyltransferase1 (LPGAT1).
  - statement: Liver-directed Lpgat1 shRNA in db/db mice lowered serum triacylglycerol and cholesterol while raising hepatic cholesterol.
    supporting_text: >-
      treatment with LPGAT1 shRNA adenovirus caused a marked reduction in serum triacylglycerol and cholesterol levels and a significant increase in hepatic cholesterol level.
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: DISPUTED
    review_notes: PubMed identity and abstract were verified. The evidence is a mouse diabetic-liver shRNA study, and later biochemical work defines lysophospholipid reacylation as the robust activity; reviewed UniProt describes MGAT activity as weak and a direct triglyceride-synthesis role as unlikely.
- id: PMID:30831319
  title: Defective Phosphatidylglycerol Remodeling Causes Hepatopathy, Linking Mitochondrial Dysfunction to Hepatosteatosis.
  findings:
  - statement: Whole-body Lpgat1 knockout in mice protected against diet-induced obesity but caused hepatopathy, insulin resistance, NAFLD, and mitochondrial defects.
    supporting_text: >-
      LPGAT1 deficiency protected mice from diet-induced obesity, but led to hepatopathy, insulin resistance, and NAFLD as a consequence of oxidative stress, mitochondrial DNA depletion, and mitochondrial dysfunction.
  - statement: The authors interpreted the mouse phenotype as a role for PG remodeling in obesity and NAFLD.
    supporting_text: >-
      This study identified an unexpected role of PG remodeling in obesity, linking mitochondrial dysfunction to NAFLD.
  reference_review:
    relevance: MEDIUM
    correctness: DISPUTED
    review_notes: The knockout phenotypes are direct mouse evidence, but the attribution to defective PG remodeling is challenged by PMID:42173283, which reports unchanged PG composition and proposes a broader phospholipid-regeneration defect instead.
- id: PMID:35131264
  title: LPGAT1 controls the stearate/palmitate ratio of phosphatidylethanolamine and phosphatidylcholine in sn-1 specific remodeling.
  findings:
  - statement: The study identifies LPGAT1 as an sn-1 acyltransferase controlling stearate/palmitate ratios in PE and PC.
    supporting_text: >-
      Here, we demonstrate that lysophosphatidylglycerol acyltransferase 1 (LPGAT1) is an sn-1 specific acyltransferase that controls the stearate/palmitate ratio of phosphatidylethanolamine (PE) and phosphatidylcholine.
  - statement: Bacterially expressed mouse LPGAT1 preferred sn-1 LPE and stearoyl-CoA rather than LPG under the reported assay conditions.
    supporting_text: >-
      Bacterially expressed murine LPGAT1 transferred saturated acyl-CoAs specifically into the sn-1 position of lysophosphatidylethanolamine (LPE) rather than lysophosphatidylglycerol and preferred stearoyl-CoA over palmitoyl-CoA as the substrate.
  - statement: Mouse knockout abolished 1-LPE:stearoyl-CoA activity and shifted PE, dimethyl-PE, and PC from stearate toward palmitate species.
    supporting_text: >-
      genetic ablation of LPGAT1 in mice abolished 1-LPE:stearoyl-CoA acyltransferase activity and caused a shift from stearate to palmitate species in PE, dimethyl-PE, and phosphatidylcholine.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full-text primary biochemical and knockout evidence. The purified-expression assay is murine and bacterial, and the physiological lipidomics are from mouse, so transfer to human is supported by PMID:36049524 rather than assumed from this study alone.
- id: PMID:37917582
  title: LPGAT1 controls MEGDEL syndrome by coupling phosphatidylglycerol remodeling with mitochondrial transport.
  findings:
  - statement: The authors report an interaction-based model coupling ER PG remodeling by LPGAT1 to mitochondrial transport through prohibitin/TIMM14 machinery.
    supporting_text: >-
      We show that PG remodeling by LPGAT1 at the ER is closely coordinated with mitochondrial transport through interaction with the prohibitin/TIMM14 mitochondrial import motor.
  - statement: Lpgat1 or Timm14 ablation caused abnormal fatty-acyl composition, ER retention of newly remodeled PG, and mitochondrial structural and respiratory defects in the reported systems.
    supporting_text: >-
      ablation of LPGAT1 or TIMM14 not only causes aberrant fatty acyl compositions but also ER retention of newly remodeled PG, leading to profound loss in mitochondrial crista structure and respiration.
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: Full-text mouse and cell-based mechanistic study. Its PG-specific transport model is directly challenged by PMID:42173283, which found no significant PG remodeling role and instead linked mitochondrial effects to general PC/PE/PS regeneration; the interaction and phenotype observations remain relevant but context-bounded.
- id: PMID:42173283
  title: LPLAT7 reutilizes unsaturated 1-lysophospholipids formed during lysosomal phospholipid degradation.
  findings:
  - statement: LPLAT7/LPGAT1 is an ER acyltransferase that reacylates lysosome-derived unsaturated 1-lysophospholipids.
    supporting_text: >-
      We found that LPLAT7 (LPGAT1), an acyltransferase of the endoplasmic reticulum, reacylates specifically lysosome-derived 1-lysophospholipids that carry an unsaturated chain.
  - statement: Its reported native substrate selectivity is for stearoyl-CoA and unsaturated 1-lyso-2-acyl positional isomers.
    supporting_text: >-
      The enzymatic activity of LPLAT7 was specific for stearoyl-CoA and 1-lyso-2-acyl positional isomers of unsaturated lysophospholipids.
  - statement: Mouse knockout lowered 1-stearoyl-2-unsaturated PC, PE, and PS and impaired membrane regeneration.
    supporting_text: >-
      In mice, Lplat7 knockout increased the concentration of unsaturated lysophospholipids, reduced the abundance of 1-stearoyl-2-unsaturated species of phosphatidylcholine, phosphatidylethanolamine, and phosphatidylserine, and inhibited the regeneration of cellular membranes.
  - statement: The authors attribute the historical LPG assignment to possible intramolecular acyl migration and report no in-vivo PG support.
    supporting_text: >-
      We speculate that LPLAT7 was misidentified as LPGAT1 (6) because LPG, having 3 unesterified hydroxyl groups, is prone to intramolecular acyl migration. As a result, 1-lyso-PG may become available when 2-lyso-PG is used as substrate. However, our lipidomics data do not demonstrate any involvement of LPLAT7 with PG in vivo.
  - statement: Lysosomal phospholipid degradation is proposed as the principal source of LPLAT7 substrates.
    supporting_text: >-
      Our data suggest that lysosomal phospholipid degradation is the principal source of LPLAT7 substrates.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Latest full-text, position-resolved study combining human Huh-7 knockout/tracing with mouse knockout lipidomics and recombinant assays. It is the strongest current source for acceptor position, head-group scope, stearoyl-CoA preference, lysosomal-substrate provenance, and the lack of a significant PG-remodeling role.
core_functions:
- description: >-
    Acts at the endoplasmic-reticulum membrane as an sn-1-selective
    lysophospholipid acyltransferase that preferentially transfers stearate from
    stearoyl-CoA to unsaturated 1-lyso-2-acyl LPC and LPE, with LPS also supported,
    regenerating 1-stearoyl-2-unsaturated PC, PE, and PS. In human Huh7 tracer and
    perturbation experiments, the substrates arise predominantly from PLA1-type
    lysosomal degradation of endocytosed phospholipids and are reacylated at the ER;
    this substrate provenance does not imply lysosomal localization. The products
    support cellular and mitochondrial membrane regeneration in the tested human-cell
    and mouse systems. Historical LPG/PG remodeling and mouse monoacylglycerol/
    triglyceride-synthesis claims are disputed or weak side activities and are not
    included in the core molecular function.
  molecular_function:
    id: GO:0071617
    label: lysophospholipid acyltransferase activity
