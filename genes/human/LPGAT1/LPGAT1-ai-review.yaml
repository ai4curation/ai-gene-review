- term:
    id: GO:0036148
    label: phosphatidylglycerol acyl-chain remodeling
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-1482925
  qualifier: involved_in
  review:
    summary: Retain reported PG remodeling as a secondary capacity whose physiological importance
      differs among models.
    action: KEEP_AS_NON_CORE
    reason: Human expression experiments in PMID:15485873 directly increase LPG acylation, while
      full PMID:36049524 reports poor LPG acceptance and reduced residual LPG-directed activity
      in knockout tissue. PMID:37917582 provides the competing PG-remodeling/mitochondrial model.
      PMID:42173283 finds no significant PG lipidomic contribution in its tested systems and explicitly
      speculates about acyl migration; it does not demonstrate that the original LPG reaction
      was artifactual. Acyl migration could alter positional interpretation while leaving PG formation
      real. The focused report reasonably retains secondary PG activity. Keep this existing process
      non-core without presenting the contested PG-specific disease mechanism as settled.
    supported_by:
    - reference_id: PMID:15485873
      supporting_text: 'Expression of the LPGAT1 cDNA

        in Sf9 insect and COS-7 cells led to a significant increase in LPG

        acyltransferase activity.'
    - reference_id: PMID:42173283
      supporting_text: We speculate that LPLAT7 was misidentified as LPGAT1
