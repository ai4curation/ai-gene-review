- id: PMID:20018982
  title: Novel acyl-coenzyme A:monoacylglycerol acyltransferase plays an important role in hepatic
    triacylglycerol secretion.
  findings:
  - statement: This mouse study identified LPGAT1 as a monoacylglycerol acyltransferase candidate.
    supporting_text: In this study, we identified a novel MGAT gene, which is identical with
      lysophosphatidylglycerol acyltransferase1 (LPGAT1).
  - statement: Liver-directed Lpgat1 shRNA in db/db mice lowered serum triacylglycerol and cholesterol
      while raising hepatic cholesterol.
    supporting_text: treatment with LPGAT1 shRNA adenovirus caused a marked reduction in serum
      triacylglycerol and cholesterol levels and a significant increase in hepatic cholesterol
      level.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Full PMC HTML fetched and read: mouse construct expressed in CHO lysates
      gives fivefold MGAT increase, favors sn-2 MAG, and shRNA lowers hepatic MGAT. Serum TAG
      decreases while hepatic TAG slightly increases nonsignificantly. TAG synthesis/secretion
      interpretation remains an author model without isotope flux; do not call these opposite
      hepatic phenotypes.'
- id: PMID:30831319
  title: Defective Phosphatidylglycerol Remodeling Causes Hepatopathy, Linking Mitochondrial
    Dysfunction to Hepatosteatosis.
  findings:
  - statement: Whole-body Lpgat1 knockout in mice protected against diet-induced obesity but
      caused hepatopathy, insulin resistance, NAFLD, and mitochondrial defects.
    supporting_text: LPGAT1 deficiency protected mice from diet-induced obesity, but led to
      hepatopathy, insulin resistance, and NAFLD as a consequence of oxidative stress, mitochondrial
      DNA depletion, and mitochondrial dysfunction.
  - statement: The authors interpreted the mouse phenotype as a role for PG remodeling in obesity
      and NAFLD.
    supporting_text: This study identified an unexpected role of PG remodeling in obesity, linking
      mitochondrial dysfunction to NAFLD.
  reference_review:
    relevance: MEDIUM
    correctness: DISPUTED
    review_notes: The knockout phenotypes are direct mouse evidence, but the attribution to
      defective PG remodeling is challenged by PMID:42173283, which reports unchanged PG composition
      and proposes a broader phospholipid-regeneration defect instead.
- id: PMID:35131264
  title: LPGAT1 controls the stearate/palmitate ratio of phosphatidylethanolamine and phosphatidylcholine
    in sn-1 specific remodeling.
  findings:
  - statement: The study identifies LPGAT1 as an sn-1 acyltransferase controlling stearate/palmitate
      ratios in PE and PC.
    supporting_text: Here, we demonstrate that lysophosphatidylglycerol acyltransferase 1 (LPGAT1)
      is an sn-1 specific acyltransferase that controls the stearate/palmitate ratio of phosphatidylethanolamine
      (PE) and phosphatidylcholine.
  - statement: Bacterially expressed mouse LPGAT1 preferred sn-1 LPE and stearoyl-CoA rather
      than LPG under the reported assay conditions.
    supporting_text: Bacterially expressed murine LPGAT1 transferred saturated acyl-CoAs specifically
      into the sn-1 position of lysophosphatidylethanolamine (LPE) rather than lysophosphatidylglycerol
      and preferred stearoyl-CoA over palmitoyl-CoA as the substrate.
  - statement: Mouse knockout abolished 1-LPE:stearoyl-CoA activity and shifted PE, dimethyl-PE,
      and PC from stearate toward palmitate species.
    supporting_text: genetic ablation of LPGAT1 in mice abolished 1-LPE:stearoyl-CoA acyltransferase
      activity and caused a shift from stearate to palmitate species in PE, dimethyl-PE, and
      phosphatidylcholine.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full-text primary biochemical and knockout evidence. The purified-expression
      assay is murine and bacterial, and the physiological lipidomics are from mouse, so transfer
      to human is supported by PMID:36049524 rather than assumed from this study alone.
- id: PMID:37917582
  title: LPGAT1 controls MEGDEL syndrome by coupling phosphatidylglycerol remodeling with mitochondrial
    transport.
  findings:
  - statement: The authors report an interaction-based model coupling ER PG remodeling by LPGAT1
      to mitochondrial transport through prohibitin/TIMM14 machinery.
    supporting_text: We show that PG remodeling by LPGAT1 at the ER is closely coordinated with
      mitochondrial transport through interaction with the prohibitin/TIMM14 mitochondrial import
      motor.
  - statement: Lpgat1 or Timm14 ablation caused abnormal fatty-acyl composition, ER retention
      of newly remodeled PG, and mitochondrial structural and respiratory defects in the reported
      systems.
    supporting_text: ablation of LPGAT1 or TIMM14 not only causes aberrant fatty acyl compositions
      but also ER retention of newly remodeled PG, leading to profound loss in mitochondrial
      crista structure and respiration.
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: Full-text mouse and cell-based mechanistic study. Its PG-specific transport
      model is directly challenged by PMID:42173283, which found no significant PG remodeling
      role and instead linked mitochondrial effects to general PC/PE/PS regeneration; the interaction
      and phenotype observations remain relevant but context-bounded.
- id: PMID:42173283
  title: LPLAT7 reutilizes unsaturated 1-lysophospholipids formed during lysosomal phospholipid
    degradation.
  findings:
  - statement: LPLAT7/LPGAT1 is an ER acyltransferase that reacylates lysosome-derived unsaturated
      1-lysophospholipids.
    supporting_text: We found that LPLAT7 (LPGAT1), an acyltransferase of the endoplasmic reticulum,
      reacylates specifically lysosome-derived 1-lysophospholipids that carry an unsaturated
      chain.
  - statement: Its reported native substrate selectivity is for stearoyl-CoA and unsaturated
      1-lyso-2-acyl positional isomers.
    supporting_text: The enzymatic activity of LPLAT7 was specific for stearoyl-CoA and 1-lyso-2-acyl
      positional isomers of unsaturated lysophospholipids.
  - statement: Mouse knockout lowered 1-stearoyl-2-unsaturated PC, PE, and PS and impaired membrane
      regeneration.
    supporting_text: In mice, Lplat7 knockout increased the concentration of unsaturated lysophospholipids,
      reduced the abundance of 1-stearoyl-2-unsaturated species of phosphatidylcholine, phosphatidylethanolamine,
      and phosphatidylserine, and inhibited the regeneration of cellular membranes.
  - statement: The authors attribute the historical LPG assignment to possible intramolecular
      acyl migration and report no in-vivo PG support.
    supporting_text: We speculate that LPLAT7 was misidentified as LPGAT1 (6) because LPG, having
      3 unesterified hydroxyl groups, is prone to intramolecular acyl migration. As a result,
      1-lyso-PG may become available when 2-lyso-PG is used as substrate. However, our lipidomics
      data do not demonstrate any involvement of LPLAT7 with PG in vivo.
  - statement: Lysosomal phospholipid degradation is proposed as the principal source of LPLAT7
      substrates.
    supporting_text: Our data suggest that lysosomal phospholipid degradation is the principal
      source of LPLAT7 substrates.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Latest full-text, position-resolved study combining human Huh-7 knockout/tracing
      with mouse knockout lipidomics and recombinant assays. It is the strongest current source
      for acceptor position, head-group scope, stearoyl-CoA preference, lysosomal-substrate
      provenance, and the lack of a significant PG-remodeling role.
- id: file:human/LPGAT1/LPGAT1-hypotheses/secondary-acylation-capacities-and-lipid-pathway-scope/openscientist.md
  title: 'LPGAT1 secondary acylation capacities and lipid pathway scope: OpenScientist focused
    report'
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: Read full report. Correctly retains secondary capacity and distinguishes mouse
      MGAT provenance, but PI-paralog attribution is speculative and omits the actual ancestral
      node; absence of a UniProt LPI reaction is not loss evidence. It conflates lower serum
      TAG in 20018982 with liver TAG, which slightly increased, and overreads 2026 accumulation
      as excluding a biosynthetic role. RHEA labels alone do not settle LPS sn-position; primary
      LPS is moderate, not simply weak. Human Huh7 experiments in42173283 must not be collapsed
      into mouse-only evidence.
core_functions:
- description: Acts at the endoplasmic-reticulum membrane as an sn-1-selective lysophospholipid
    acyltransferase that preferentially transfers stearate from stearoyl-CoA to unsaturated
    1-lyso-2-acyl LPC and LPE, with LPS also supported, regenerating 1-stearoyl-2-unsaturated
    PC, PE, and PS. In human Huh7 tracer and perturbation experiments, the substrates arise
    predominantly from PLA1-type lysosomal degradation of endocytosed phospholipids and are
    reacylated at the ER; this substrate provenance does not imply lysosomal localization. The
    products support cellular and mitochondrial membrane regeneration in the tested human-cell
    and mouse systems.
  molecular_function:
    id: GO:0071617
    label: lysophospholipid acyltransferase activity
  directly_involved_in:
  - id: GO:0036151
    label: phosphatidylcholine acyl-chain remodeling
  - id: GO:0036152
    label: phosphatidylethanolamine acyl-chain remodeling
  - id: GO:0036150
    label: phosphatidylserine acyl-chain remodeling
  locations:
  - id: GO:0005789
    label: endoplasmic reticulum membrane
  supported_by:
  - reference_id: PMID:36049524
    supporting_text: In vitro, we found LPLAT7 mainly incorporated several fatty acids into
      the sn-1 position of lysophosphatidylcholine (LPC) and lysophosphatidylethanolamine (LPE),
      with weak activities toward other lyso-PLs.
  - reference_id: PMID:42173283
    supporting_text: The enzymatic activity of LPLAT7 was specific for stearoyl-CoA and 1-lyso-2-acyl
      positional isomers of unsaturated lysophospholipids.
  - reference_id: PMID:42173283
    supporting_text: Our data suggest that lysosomal phospholipid degradation is the principal
      source of LPLAT7 substrates.
knowledge_gaps:
- gap_statement: >-
    The contribution of lysosome-to-ER phospholipid salvage to endogenous LPGAT1
    activity in intact human tissues is unknown.
  boundary: >-
    Human Huh7 knockout, isotope tracing, and lysosomal-phospholipase perturbations
    directly support lysosome-derived LPC salvage, but Huh7 is a transformed hepatic
    cell line. The broader PC/PE/PS membrane-regeneration phenotype is strongly
    supported in mouse knockout tissues.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    Native flux through this pathway will determine whether lysosomal degradation is
    the dominant LPGAT1 substrate source in liver, heart, brain, placenta, and other
    human tissues.
  resolution: >-
    Perform pulse-chase positional lipidomics after endogenous LPGAT1, PLA1,
    PLA2G15, PLBD2, and SPNS1 perturbation in primary or organoid human tissues, with
    genomic rescue and matched endocytic-lipid inputs.
- gap_statement: >-
    The quantitative acceptor and acyl-donor specificity of endogenous human LPGAT1
    across PC, PE, and PS is incompletely resolved.
  boundary: >-
    Recombinant and membrane-fraction assays favor unsaturated 1-lyso-2-acyl LPC/LPE
    and stearoyl-CoA, while PS activity is weaker and some substrate rankings differ
    across human and murine expression systems.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: >-
    Substrate competition determines which membrane species are regenerated and how
    LPGAT1 controls the stearate-to-palmitate/oleate ratio.
  resolution: >-
    Measure endogenous isotope-resolved flux through position-defined LPC, LPE, and
    LPS panels with stearoyl-, palmitoyl-, and oleoyl-CoA in multiple human cell
    types, using catalytic-null and expression-matched rescue controls.
- gap_statement: >-
    Whether human LPGAT1 has physiologically meaningful LPG acyltransferase or PG
    remodeling activity remains disputed.
  boundary: >-
    The 2004 human heterologous-expression study reported LPG-specific activity, but
    newer position-defined studies favor LPC/LPE/LPS, find no in-vivo PG remodeling,
    and propose that intramolecular LPG acyl migration confounded the historical
    assay.
  gap_kind:
  - BIOLOGY
  - CURATION
  status: OPEN
  significance: >-
    This conflict changes interpretation of the gene name, Reactome LPG reactions,
    and mitochondrial phenotypes attributed to PG remodeling.
  resolution: >-
    Reassay purified and native human LPGAT1 with rigorously stabilized positional
    LPG isomers and isotope-defined products, then test endogenous PG flux after
    knockout/rescue without extrapolating from total PG abundance alone.
- gap_statement: >-
    The reported monoacylglycerol acyltransferase activity and triglyceride-synthesis
    role have not been established as direct human LPGAT1 functions.
  boundary: >-
    The supporting studies primarily use mouse diabetic liver, orthology transfer,
    and bulk MGAT assays. Modern human and mouse evidence instead shows robust
    lysophospholipid reacylation, and LPGAT1 loss can increase triglyceride and lipid
    droplets by redirecting lipid flux.
  gap_kind:
  - BIOLOGY
  - CURATION
  status: OPEN
  significance: >-
    Distinguishing direct MGAT catalysis from secondary flux redistribution prevents
    an incorrect triglyceride-biosynthesis core assignment.
  resolution: >-
    Test purified and endogenous human LPGAT1 against position-defined
    monoacylglycerols with direct diacylglycerol product quantification, catalytic
    mutants, and parallel lysophospholipid competition assays.
- gap_statement: >-
    The mechanism linking LPGAT1-dependent membrane regeneration to mitochondrial
    dysfunction, hepatopathy, and survival phenotypes is unresolved.
  boundary: >-
    Mouse knockout phenotypes are reproducible, but a PG-specific
    PHB/TIMM14-associated transport model is challenged by newer evidence that PC,
    PE, and PS regeneration is impaired while PG composition is not substantially
    remodeled. Corresponding causal human disease evidence is absent.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: >-
    Resolving the mechanism is necessary before linking human LPGAT1 to MEGDEL-like
    disease or assigning stable mitochondrial-transport complex membership.
  resolution: >-
    Compare wild-type, catalytic-dead, and interaction-interface rescue in
    tissue-specific mouse models and human liver/cardiac organoids while measuring
    PC/PE/PS salvage, PG/cardiolipin synthesis, organelle lipid transfer, respiration,
    and PHB/TIMM14 interaction stoichiometry.
- gap_statement: >-
    Functionally distinct endogenous LPGAT1 protein isoforms, membrane topology, and
    constitutive protein-complex membership are not established.
  boundary: >-
    Human isoform 1 was the construct tested in one study, but that does not prove
    isoform-restricted activity. The reviewed record supports a multi-pass ER enzyme,
    while exact orientation and stable complex assembly remain unresolved.
  gap_kind:
  - BIOLOGY
  - CURATION
  status: OPEN
  significance: >-
    Isoform or complex assumptions could incorrectly explain tissue-specific flux or
    conflate transient lipid-transfer interactions with obligatory catalytic
    machinery.
  resolution: >-
    Reconcile full-length transcripts by long-read sequencing and proteomics, map ER
    topology experimentally, and quantify endogenous interaction dynamics with
    reciprocal validation and catalytic rescue.
