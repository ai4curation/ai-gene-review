- id: PMID:23749231
  title: MicroRNA-30c reduces hyperlipidemia and atherosclerosis in mice by decreasing lipid
    synthesis and lipoprotein secretion.
  findings:
  - statement: Hepatic miR-30c expression reduced Lpgat1 transcript abundance in mice, and the
      same direction was observed in human Huh-7 cells.
    supporting_text: Analysis of hepatic mRNA showed that miR-30c reduced Lpgat1, Elovl5, Stard3
      and Mboat1 mRNA levels
  - statement: LPGAT1 knockdown reduced de novo lipogenesis in the Huh-7 experimental context.
    supporting_text: siELOVL5 and siLPGAT1 reduced de novo lipogenesis
  - statement: LPGAT1 knockdown did not itself reduce secreted apoB, separating the lipid-synthesis
      phenotype from the MTP-dependent secretion effect.
    supporting_text: siLPGAT1 had no effect on media apoB
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Correctly cited regulatory and knockdown evidence from mouse liver and human
      Huh-7 cells. It supports a lipid-synthesis context and miR-30c regulation, but does not
      define LPGAT1 substrate chemistry or a direct apoB-secretion role.
- id: PMID:36049524
  title: Identification and characterization of LPLAT7 as an sn-1-specific lysophospholipid
    acyltransferase.
  findings:
  - statement: LPLAT7/LPGAT1 incorporated fatty acids mainly into the sn-1 position of LPC and
      LPE in vitro.
    supporting_text: In vitro, we found LPLAT7 mainly incorporated several fatty acids into
      the sn-1 position of lysophosphatidylcholine (LPC) and lysophosphatidylethanolamine (LPE),
      with weak activities toward other lyso-PLs.
  - statement: Loss of LPLAT7 specifically reduced C18:0-containing PC and PE in mutant cells
      and knockout-mouse tissues.
    supporting_text: only C18:0-containing phosphatidylcholine (PC) and phosphatidylethanolamine
      (PE) were specifically reduced in the LPLAT7-mutant cells and tissues from knockout mice,
      with a concomitant increase in the level of C16:0- and C18:1-containing PC and PE.
  - statement: 'The study resolved three biochemical preferences: unsaturated sn-2 LPC acceptors,
      choline/ethanolamine head groups, and C18:0/C16:0 acyl-CoA donors.'
    supporting_text: 'In the present study, we identified three biochemical preferences of LPLAT7:
      (1) sn-2-rich LPCs with unsaturated fatty acids as acyl acceptors (Fig. 4I), (2) choline
      and ethanolamine as head groups of lyso-PLs (Fig. 4E), and (3) C18:0-CoA and C16:0-CoA
      as acyl donors (Fig. 4G).'
  - statement: Human isoform 1 was assayed in HEK293A-cell membrane fractions, but that construct
      choice does not establish isoform-specific biology.
    supporting_text: cDNA for human LPLAT7 (hLPGAT1 isoform1; NCBI accession number NM_014873)
      was amplified by PCR using PrimeStar HS Polymerase (TAKARA BIO Inc) and HEK293A cell cDNA
      as a template.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full-text direct biochemical evidence, including human isoform-1 expression
      in HEK293A cells and cellular/mouse loss-of-function lipidomics. It establishes sn-1 lysophospholipid
      remodeling but does not show that the activity is unique to an isoform.
