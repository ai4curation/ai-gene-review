- term:
    id: GO:0019432
    label: triglyceride biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  review:
    summary: Retain a context-dependent triacylglycerol-biosynthesis contribution through the
      reported MGAT step.
    action: KEEP_AS_NON_CORE
    reason: MGAT converts monoacylglycerol to DAG, a catalytic step feeding the TAG pathway; it
      need not perform the final DGAT reaction. Full PMID:20018982 combines mouse-expression MGAT
      assays and reduced hepatic MGAT after shRNA with lower serum TAG. Hepatic TAG instead slightly
      increased nonsignificantly, so the report’s comparison with later hepatic accumulation does
      not establish opposite results. The original synthesis/secretion interpretation remains
      a model without direct isotope flux. PMID:42173283 supports a predominant phospholipid-salvage
      role and altered lipid partitioning, which can coexist with a secondary MGAT pathway contribution.
      Retain the existing transfer as non-core, without claiming predominant human TAG synthesis.
    supported_by:
    - reference_id: PMID:20018982
      supporting_text: MGAT activity was 5-fold higher than that in the lysates of cells transfected
        with the empty vector
    - reference_id: PMID:20018982
      supporting_text: Hepatic TAG level slightly increased in LPGAT1 shRNA adenovirus-treated
        animals; however, this increase was not statistically significant
  supporting_entities:
  - UniProtKB:Q91YX5
  - ensembl:ENSMUSP00000106479
