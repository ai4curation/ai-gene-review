      assays and reduced hepatic MGAT after shRNA with lower serum TAG. Hepatic TAG instead slightly
      increased nonsignificantly, so the report’s comparison with later hepatic accumulation does
      not establish opposite results. The original synthesis/secretion interpretation remains
      a model without direct isotope flux. PMID:42173283 supports a predominant phospholipid-salvage
      role and altered lipid partitioning, which can coexist with a secondary MGAT pathway contribution.
      Retain the existing transfer as non-core, without claiming predominant human TAG synthesis.
    supported_by:
