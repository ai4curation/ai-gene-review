id: Q92604
gene_symbol: LPGAT1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  LPGAT1, increasingly termed LPLAT7, is an integral endoplasmic-reticulum
  membrane lysophospholipid acyltransferase that restores saturated fatty acids to
  the sn-1 position of membrane phospholipids. Position-resolved human-enzyme assays
  show preferential use of unsaturated 1-lyso-2-acyl lysophosphatidylcholine and
  lysophosphatidylethanolamine acceptors, weaker activity toward
  lysophosphatidylserine, and a strong preference for stearoyl-CoA over palmitoyl-
  or oleoyl-CoA. Human Huh7 knockout and tracer experiments indicate that
  lysosomal phospholipid degradation is a major source of these substrates: PLA1
  products generated from endocytosed phospholipids are delivered to ER-localized
  LPGAT1 and reacylated to 1-stearoyl-2-unsaturated PC, PE, and PS. This salvage
  reaction couples lysosomal phospholipid turnover to ER membrane regeneration and
  partitions lipid flux away from triglyceride and lipid-droplet accumulation in
  the tested hepatic-cell and mouse systems.

  The historical LPGAT1 name derives from LPG acylation measured with recombinant
  human protein in Sf9 and COS-7 cells. Newer position-defined assays, zebrafish and
  mouse lipidomics, and human Huh7 data do not support a substantial physiological
  role in PG remodeling and suggest that LPG acyl migration may have confounded the
  original substrate assignment. Likewise, monoacylglycerol acyltransferase and
  triglyceride-biosynthesis claims derive mainly from mouse liver studies, where
  the reported monoacylglycerol activity was weak. Mouse
  mitochondrial, hepatopathy, and survival phenotypes are consistent with impaired
  membrane regeneration but do not establish human MEGDEL syndrome or a PG-specific
  mechanism. A reported PHB/TIMM14 association and mitochondrial transport model
  remains disputed. No functionally distinct endogenous LPGAT1 protein isoforms
  have been established.
