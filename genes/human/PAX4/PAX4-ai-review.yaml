id: O43316
gene_symbol: PAX4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  PAX4 is a vertebrate paired-box transcription factor of the Pax4/6 class,
  encoded on chromosome 7q32. It binds DNA through an N-terminal paired domain
  (PAI and RED subdomains) and a paired-type homeodomain, and it acts mainly as
  a sequence-specific transcriptional repressor of RNA polymerase II genes. Its
  repression of the insulin and glucagon promoters and of its own promoter has
  been shown in human reporter assays, and it also has a weaker,
  context-dependent activating potential. In human beta-cell models it occupies
  more than a thousand genomic sites, including the insulin promoter and
  regulatory regions of islet developmental genes. PAX4 is expressed
  transiently in NEUROG3-derived endocrine progenitors of the developing
  pancreas and in intestinal enteroendocrine progenitors, and at low levels in
  adult islets and gut mucosa. In the pancreas it biases endocrine progenitors
  toward the beta-cell fate and keeps alpha-cell genes such as ARX and GCG
  repressed. Unlike in mouse, it is not essential for human beta-cell
  formation. PAX4-null human stem-cell-derived islets still form but contain
  polyhormonal cells with less insulin. Children with complete PAX4 loss have
  transient neonatal diabetes that remits and later relapses. In the human
  small intestine PAX4 is the effector through which ZNF800 restrains
  serotonin-producing enterochromaffin cells: PAX4 promotes enterochromaffin
  differentiation and suppresses ARX-dependent enteroendocrine subtypes such as
  L cells. Heterozygous coding variants (for example rs2233580, reported as R192H) raise
  type 2 diabetes risk in East Asians. Its earlier designation as the cause of
  MODY9 is not supported by recent population-genetic analyses. An
  alternatively spliced isoform found in insulinoma antagonises the full-length
  repressor.
