  review:
    summary: Forebrain development, inherited from the Euteleostomi node PTN002900580. Its seeds are mouse
      and rat Pax6 and zebrafish pax6a and pax6b only.
    action: REMOVE
    reason: >-
      Every seed is a Pax6 ortholog. Human PAX4 inherits the term only because PANTHER 19 draws the
      PAX4/PAX6 split below this node twice, at a Mammalia duplication (PTN000676674, above the human
      PAX4 clade PTN000676639) and separately at a Neopterygii duplication for fish pax4. This is
      contrary to the single 2R origin of Pax4, Pax6 and Pax10 shown by synteny. In a species-reconciled
      tree the PAX4 orthology group would branch above the node that carries this Pax6-seeded IBD.
      Independently, no PAX4 ortholog has a forebrain phenotype, and human complete-loss patients have
      no reported extra-pancreatic features. Human Bgee has low fetal ganglionic-eminence presence
      (CONSISTENT tier) and absence from all stage-merged forebrain entities where PAX6 is present. This
      shows expression, not function. The same action is taken in the mouse review.
    supported_by:
