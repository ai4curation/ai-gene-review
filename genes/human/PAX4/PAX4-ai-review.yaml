  review:
    summary: Retina development, inherited from the Euteleostomi node PTN002900580. Its seeds are mouse
      and rat Pax6, zebrafish pax6a, pax6b and pax10, and rat Pax4 (RGD:620433), whose seed annotation
      is an IEP.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The only Pax4 seed is the rat IEP from PMID:19012751. That paper found Pax4 absent from the fetal
      eye and present in photoreceptors only postnatally, highest in the adult. Its authors concluded
      that this timing argues against a developmental role. The node placement is also suspect for the
      reason given on the forebrain row, since the PAX4/PAX6 split is drawn twice below this node. No
      PAX4 ortholog has an eye phenotype, and comparative work states that mammalian and teleost Pax4
      are not implicated in eye development. Human data are consistent. Two complete-loss patients
      surviving into childhood had no reported extra-pancreatic features. Bgee has PAX4 absent from
      retinal pigmented layer and palpebral conjunctiva where PAX6 is present at the top of its profile;
      these are stage-merged, so they show consistency only. No human neural-retina or pineal sample has
      a PAX4 call. As in mouse, the row is marked rather than removed because a late photoreceptor
      role has not been tested, and the patients' report describes no eye examination. A blinded
      OpenScientist run, given only this hypothesis, the GO term and the IBA reference (no papers, no
      review decision, no expression data), independently judged the term over-annotated and pointed
      to a PAINT-level fix, from the same rat photoreceptor and complete-loss evidence it found itself.
