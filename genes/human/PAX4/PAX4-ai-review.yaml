    summary: From the ZNF800 CRISPR study in adult human small-intestinal organoids. PAX4 is the effector
      of ZNF800 and suppresses ARX-dependent enteroendocrine lineages.
    action: ACCEPT
    reason: >-
      The cached paper is abstract-only. UniProt's curated FUNCTION text, tied to this paper, says PAX4
      represses ARX in this system, and the authors' commentary describes a unilateral inhibition of
      ARX by PAX4. Neither source shows PAX4 binding at ARX, so the curator's full-text reading is
