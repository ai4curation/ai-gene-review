    supporting_text: restricts enterochromaffin cell differentiation by directly controlling an endocrine
      TF network centered on PAX4
  - reference_id: PMID:38279896
    supporting_text: only the knockout of PAX4 resulted in the reversal of EEC differentiation, shifting
      from ECs to other rare EEC subtypes
  - reference_id: PMID:38279896
    supporting_text: indicating PAX4 is responsible for EC lineage specification by suppressing other lineages
proposed_new_terms: []
suggested_questions:
- question: >-
    PAINT node placement for PTHR45636. PANTHER 19 separates PAX4 from PAX6 twice below the Euteleostomi
    node PTN002900580, at a Mammalia duplication (PTN000676674, above the human PAX4 clade PTN000676639)
    and at a Neopterygii duplication (PTN009180006). Synteny instead places one origin of Pax4, Pax6 and
    Pax10 in the 2R duplications (PMID:24951566). As a result, the Pax6-seeded IBDs for retina development
    (GO:0060041) and forebrain development (GO:0030900) at PTN002900580, and for brain development
    (GO:0007420) and sensory organ development (GO:0007423) at the Bilateria node PTN008693041, all reach
    human PAX4. Should PAINT add IRDs for these terms on the PAX4 clades (PTN000676639 in mammals,
    PTN009180007 in ray-finned fishes) while keeping GO:0003309, which both paralogs support? Or should
    the tree be reconciled so that one PAX4 orthology group branches above PTN002900580?
- question: Does human PAX4 repress ARX directly? ARX rises in PAX4-null hiPSC endocrine progenitors and
    falls with PAX4 overexpression, but falls with PAX4 knockdown in EndoC-betaH1 cells, and the intestinal
    organoid study reports a unilateral inhibition without, as far as the cached text shows, direct binding.
- question: Why is PAX4 essential for beta-cell formation in mouse but not in human, where complete
    loss gives transient neonatal diabetes with remission and later relapse (PMID:40614820)? Does the
    relapse reflect a role in adult beta-cell maintenance or expansion, as the R192H knock-in mouse suggests
    (PMID:42210309)?
- question: Is the dominant-negative isoform 2 (PAX4v, PMID:11263967) produced in normal human islet or
    intestinal development, or only in insulinoma?
- question: Should MODY9 remain a disease designation for PAX4, given that variant- and gene-level population
    evidence does not support PAX4 as a high-penetrance MODY gene (PMID:35108381, PMID:36208030)?
suggested_experiments:
- hypothesis: Human PAX4 directly represses ARX and alpha-cell genes in endocrine progenitors and in intestinal
    enteroendocrine progenitors.
  description: CUT&RUN for endogenously epitope-tagged PAX4 in hiPSC-derived pancreatic endocrine progenitors
    and in ZNF800-deficient human small-intestinal organoids, integrated with single-cell RNA-seq of PAX4-null
    lines, and deletion or mutation of candidate PAX4 sites at the ARX locus.
  experiment_type: genome-wide occupancy and enhancer mutagenesis
- hypothesis: PAX4 has no role in human eye or forebrain development, so the inherited IBA terms reflect
    paralog biology only.
  description: Differentiate PAX4-null and isogenic control hiPSCs into retinal and cortical organoids,
    with PAX6-null lines as positive controls, and score lamination, photoreceptor maturation and regional
    identity. In parallel, record ophthalmological findings in any further complete-loss patients.
  experiment_type: organoid phenotyping
- hypothesis: PAX4 sustains adult human beta-cell identity under metabolic stress.
  description: Transplant PAX4-null, R192H and corrected hiPSC-derived islets into immunodeficient mice,
    challenge the hosts with high-fat feeding, and follow insulin secretion, hormone co-expression and
    alpha-cell gene derepression over time.
  experiment_type: xenotransplant functional assay
knowledge_gaps:
- gap_statement: Whether human PAX4 represses ARX by binding ARX regulatory DNA, and why ARX responds
    in opposite directions to PAX4 loss in endocrine progenitors and in a mature beta-cell line, is unknown.
  boundary: PAX4 is a sequence-specific repressor of the insulin, glucagon and PAX4 promoters. ARX rises
    in PAX4-null hiPSC endocrine progenitors and falls with PAX4 overexpression in hESC-derived progenitors.
    In EndoC-betaH1 cells, PAX4 knockdown lowers ARX. In intestinal organoids PAX4 inhibits ARX unilaterally.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: It decides whether the PAX4-ARX antagonism that allocates endocrine fates in mouse is a direct
    repressor-target relationship in human cells or an indirect network effect.
  resolution: Occupancy of endogenously tagged PAX4 at the ARX locus in human progenitors and enteroendocrine
    cells, with site mutagenesis (see suggested_experiments).
  provenance:
  - reference_id: PMID:40614820
    supporting_text: large upregulation of ARX, one of the primary drivers of alpha cell fate specification
  - reference_id: PMID:37777536
    supporting_text: loss of PAX4 led to a decrease in ARX expression in EndoC-βH1 cells
- gap_statement: What allows human beta cells to form without PAX4, and what PAX4 contributes after birth
    that explains diabetes relapse in complete-loss patients, is unknown.
  boundary: Complete PAX4 loss in two children gave transient neonatal diabetes that remitted and relapsed
    in childhood. PAX4-null hiPSC-derived islets form beta-like cells with polyhormonal features.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: It defines the human-specific role of PAX4 that differs from mouse, where the gene is essential
    for beta-cell formation.
  resolution: Longitudinal functional study of PAX4-null hiPSC-derived islets in vivo under metabolic stress
    (see suggested_experiments).
  provenance:
  - reference_id: PMID:40614820
    supporting_text: the observed transient remission suggests that PAX4 may contribute to beta cell proliferation
