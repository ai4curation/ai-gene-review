  supporting_entities:
  - GO:0001227
  review:
    summary: Inferred from the IDA repressor-activity annotation (GO:0001227) by the GO inter-ontology
      link between repressor activity and negative regulation of Pol II transcription.
    action: ACCEPT
    reason: The inference is sound and the process is the core transcriptional output of PAX4. Human PAX4
      represses the insulin and glucagon promoters in reporter assays (a MODY-associated variant lost
      this activity), represses its own promoter through high-affinity sites, and knockdown in the human
      beta-cell line EndoC-betaH1 derepresses GCG. This matches the mouse review, where the same term
      is accepted on IDA.
    supported_by:
    - reference_id: PMID:17426099
      supporting_text: R164W segregated with diabetes in the family of the proband and in vitro studies
        showed that it impairs the repressor activity of PAX4 on the insulin and glucagon promoters
    - reference_id: PMID:10967107
      supporting_text: PAX4 itself has at least two high affinity binding sites within the promoter through
        which it exerts a strong negative autoregulatory effect
