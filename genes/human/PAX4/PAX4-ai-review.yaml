- term:
    id: GO:0007420
    label: brain development
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - FB:FBgn0005558
  - MGI:MGI:97490
  - PANTHER:PTN008693041
  - RGD:3258
  - ZFIN:ZDB-GENE-001031-1
  - ZFIN:ZDB-GENE-990415-200
  review:
    summary: Brain development, inherited from the Bilateria node PTN008693041. Its seeds are Drosophila
      eyeless and twin of eyeless and vertebrate Pax6 genes (mouse, rat, zebrafish pax6a and pax6b). No
      PAX4 gene is a seed.
    action: REMOVE
    reason: >-
      PAX4 descends from PTN008693041 under any topology, so the question is whether the PAX4 lineage
      kept the ancestral neural developmental role. The evidence says it diverged, and nothing says it
      kept it. (1) No study of any PAX4 ortholog reports a brain phenotype or function. In human, two
      children with complete PAX4 loss, followed into childhood, had no reported extra-pancreatic
      features. This is evidence on the target species itself, which the mouse review could only
      borrow. (2) Pax4 and Pax6 are not interchangeable where both are expressed, and comparative work
      describes lineage-specific Pax4 roles against a conserved Pax6 program. (3) Human Bgee data
      differ from mouse. PAX4 has low fetal present calls in ganglionic eminence (RNA-seq, fourth and
      fifth lunar months, scores about 42-48) and ventricular zone, which give a CONSISTENT tier. All
      stage-merged forebrain calls are absent where PAX6 is present. Low fetal presence is expression,
      not participation (projects/BGEEDB_EXPRESSION.md rules 1-2), so it does not change the decision.
      `just paint-losses` finds no IRD on the lineage, so the cached IBA is current. This is an
      over-propagated IBA, and the same action is taken in the mouse review. An IRD on the mammalian PAX4
      clade PTN000676639 is suggested (see suggested_questions).
    supported_by:
    - reference_id: PMID:40614820
      supporting_text: No extra pancreatic features were reported in either patient.
    - reference_id: PMID:10364449
      supporting_text: The gene-targeting experiments revealed that Pax-4 and Pax-6 cannot substitute for
        each other in tissue with overlapping expression of both genes.
    - reference_id: PMID:24951566
      supporting_text: This indicates evolutionarily conserved roles of Pax6 and lineage-specific differences
        in the roles of Pax4 during pancreas development among vertebrates.
    - reference_id: file:human/PAX4/PAX4-bioinformatics/RESULTS.md
      supporting_text: '| GO:0007420 brain development | brain | CONSISTENT (UBERON:0004023 ganglionic eminence
        (45.2)) | ENRICHED (UBERON:0003053 ventricular zone (99.3)) |'
    - reference_id: file:human/PAX4/PAX4-deep-research-claude-code.md
      supporting_text: The existing IBA annotations to brain, forebrain, retina and sensory organ development
        probably reflect PAX6-clade biology and deserve scrutiny for PAX4.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN008693041
        source_label: PTN008693041
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Bilateria speciation node seeded by Drosophila ey and toy and vertebrate Pax6 genes. Human
          PAX4 descends from it through the mammalian PAX4 clade PTN000676639, which has no brain evidence.
      - source_id: MGI:MGI:97490
        source_label: mouse Pax6
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Pax6 brain development is well established. Pax4 cannot substitute for Pax6 (PMID:10364449).
