    summary: Sensory organ development, inherited from the Bilateria node PTN008693041. The only Pax4 among
      its seeds is rat Pax4 (RGD:620433), whose relevant annotation is an IEP for retina development
      (PMID:19012751).
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Apart from rat Pax4, the seeds resolved in the mouse review are Pax6-lineage genes and zebrafish
      pax10. The one Pax4 seed is an expression pattern: rat Pax4 mRNA appears in photoreceptors only
      after birth, and the authors themselves argue against a developmental role. No eye or other
      sense-organ phenotype has been reported for any PAX4 ortholog, and comparative work states that
      mammalian and teleost Pax4 genes are not implicated in eye development. Human evidence adds two
      surviving complete-loss patients with no reported extra-pancreatic features. In Bgee, PAX4 is
      absent from the sampled sense-organ tissues (stage-merged, so consistency only). The row is marked
      rather than removed, as in mouse, because the clinical report describes no eye examination and a
      late photoreceptor-maturation role has never been tested. The claim exceeds the evidence but is not
      contradicted.
