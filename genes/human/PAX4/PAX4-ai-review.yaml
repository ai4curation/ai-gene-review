- term:
    id: GO:0003309
    label: type B pancreatic cell differentiation
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:97488
  - MGI:MGI:97490
  - PANTHER:PTN002900580
  - RGD:3258
  - ZFIN:ZDB-GENE-001031-1
  review:
    summary: Beta-cell differentiation inherited from the Euteleostomi node PTN002900580, seeded by mouse
      Pax4, mouse and rat Pax6 and zebrafish pax6b.
    action: ACCEPT
    reason: >-
      The node placement is sound here, as in the mouse review. Both paralogs below the node have
      beta-cell evidence, so the term holds for PAX4 whichever way the PAX4/PAX6 split is drawn. Human
      data now support it directly but differ from mouse in degree. PAX4-null hiPSC-derived islets
      still form beta-like cells, but they show derepressed alpha-cell genes, polyhormonal cells and
      low insulin. Re-analysis of the knockout progenitors shows ARX up-regulation and loss of beta-cell
      gene expression. Children with complete PAX4 loss have transient, not permanent, neonatal
      diabetes. So human PAX4 biases progenitors toward the beta-cell fate without being essential for
      beta-cell formation. Participation is still met: PAX4 is a DNA-binding repressor acting in the
      progenitors whose fate it sets. Bgee calls PAX4 present in islet of Langerhans but absent in its type
      B pancreatic cell samples (gold quality), where PAX6 scores 99. That absence is the
      developmental-term artifact: Bgee's calls merge all stages, and PAX4 expression is highest in
      the embryonic pancreas and markedly reduced after birth (PMID:42210309), so these calls cannot
      test a differentiation role. They did not affect the action.
    supported_by:
    - reference_id: PMID:40614820
      supporting_text: human PAX4 expression is important for endocrine cell development and has a key role
        in directing progenitor cells toward a beta cell fate
    - reference_id: PMID:37777536
      supporting_text: we found that PAX4 deficiency and/or loss-of-function to result in derepression of
        alpha cell genes, leading to the formation of polyhormonal endocrine cells in vitro, with reduced
        total insulin content
    - reference_id: PMID:40614820
      supporting_text: demonstrating that in contrast to mouse models, PAX4 is not essential for the development
        of human pancreatic beta-cells
    - reference_id: PMID:9121556
      supporting_text: We propose that the early expression of Pax4 in a subset of endocrine progenitors
        is essential for the differentiation of the beta and delta cell lineages.
    - reference_id: PMID:42210309
      supporting_text: Pax4 is highly expressed in embryonic pancreas and its expression is markedly reduced
        after birth
    - reference_id: file:human/PAX4/PAX4-bioinformatics/RESULTS.md
      supporting_text: '| GO:0003309 type B pancreatic cell differentiation | type B pancreatic cell | CONSISTENT
        (UBERON:0000006 islet of Langerhans (50.6)) | ENRICHED (CL:0000169 type B pancreatic cell (99.3)) |'
    - reference_id: file:human/PAX4/PAX4-bioinformatics/RESULTS.md
      supporting_text: 'type B pancreatic cell absent (gold, 49); body of pancreas absent (gold, 30); islet
        of Langerhans present (gold, 51)'
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN002900580
        source_label: PTN002900580
        source_status: SUPPORTS_TRANSFER
        comment: Euteleostomi speciation node. Pax4 and Pax6 below it both have experimental beta-cell evidence,
          and human PAX4 has its own stem-cell and patient data.
      - source_id: MGI:MGI:97488
        source_label: mouse Pax4
        source_status: SUPPORTS_TRANSFER
        comment: Mouse Pax4 knockout (PMID:9121556) is the ortholog seed. In human the role is retained
          but not essential.
