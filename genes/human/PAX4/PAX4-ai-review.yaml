core_functions:
- description: PAX4 is a sequence-specific RNA polymerase II transcriptional repressor. Through its paired
    domain and homeodomain it binds cis-regulatory sites in islet hormone gene promoters (insulin, glucagon)
    and in its own promoter, which it autorepresses, and represses them. It occupies more than a thousand
    genomic sites in human beta cells.
  molecular_function:
    id: GO:0001227
    label: DNA-binding transcription repressor activity, RNA polymerase II-specific
  directly_involved_in:
  - id: GO:0000122
    label: negative regulation of transcription by RNA polymerase II
  locations:
  - id: GO:0000785
    label: chromatin
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:10967107
    supporting_text: PAX4 itself has at least two high affinity binding sites within the promoter through
      which it exerts a strong negative autoregulatory effect
  - reference_id: PMID:17426099
    supporting_text: in vitro studies showed that it impairs the repressor activity of PAX4 on the insulin
      and glucagon promoters
  - reference_id: PMID:40614820
    supporting_text: The binding of PAX4 to the INS gene promoter is direct evidence for the importance
      of the gene in insulin secretion
- description: In pancreatic endocrine progenitors, PAX4 biases differentiation toward the beta-cell fate
    and keeps alpha-cell genes (ARX, GCG) repressed. In human cells it contributes to, but is not essential
    for, beta-cell formation. Its loss gives polyhormonal, insulin-poor islet cells and transient neonatal
    diabetes.
  molecular_function:
    id: GO:0001227
    label: DNA-binding transcription repressor activity, RNA polymerase II-specific
  directly_involved_in:
  - id: GO:0003309
    label: type B pancreatic cell differentiation
  - id: GO:7770019
    label: negative regulation of enteroendocrine cell differentiation
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:40614820
    supporting_text: human PAX4 expression is important for endocrine cell development and has a key role
      in directing progenitor cells toward a beta cell fate
  - reference_id: PMID:37777536
    supporting_text: we found that PAX4 deficiency and/or loss-of-function to result in derepression of
      alpha cell genes, leading to the formation of polyhormonal endocrine cells in vitro, with reduced
      total insulin content
  - reference_id: PMID:25483960
    supporting_text: it did reduce the number of glucagon-positive cells and increased the number of unihormonal
      insulin-positive cells
- description: In the human small intestine, PAX4 is the effector through which ZNF800 restrains enteroendocrine
    commitment. It promotes serotonin-producing enterochromaffin cell differentiation and suppresses ARX-dependent
    subtypes such as L cells.
  molecular_function:
