taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: LYPD1 (LY6/PLAUR domain-containing protein 1) is a GPI-anchored member of the Ly6/uPAR family
  with a snake-toxin-like three-finger fold, related to the prototypic nicotinic receptor modulator lynx1.
  It is attached to the extracellular leaflet of the plasma membrane by a GPI anchor. LYPD1 behaves as
  an endogenous modulator of neuronal nicotinic acetylcholine receptors. It interacts with CHRNA4 and
  alpha4-beta2- and alpha7-containing nAChRs, increases receptor desensitization, lowers their apparent
  affinity for acetylcholine, and may limit their surface expression. It is implicated in the control
  of anxiety behavior.
