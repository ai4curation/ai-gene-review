id: Q14571
gene_symbol: ITPR2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'ITPR2 encodes inositol 1,4,5-trisphosphate receptor type 2, a multi-pass
  endoplasmic-reticulum membrane protein that forms tetrameric IP3-gated calcium release
  channels. IP3 binding gates calcium efflux from the ER lumen to the cytosol, and
  channel opening is further tuned by cytosolic calcium, calmodulin, ATP and cAMP-dependent
  regulation. ITPR2 also appears in specialized calcium-store membranes, including
  human platelet dense tubular membranes and secretory-vesicle membranes, but its
  central molecular role is ER calcium release.'
