id: P22413
gene_symbol: ENPP1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ENPP1 is a type-II membrane ectoenzyme with extracellular nucleotide-hydrolyzing
  domains and a soluble processed form. It converts extracellular ATP to AMP and inorganic pyrophosphate,
  thereby controlling mineral deposition in bone and soft tissues. ENPP1 also hydrolyzes extracellular
  cyclic GMP–AMP, influencing the availability of this intercellular immune signal. Its catalytic
  architecture contains zinc ions and a separate calcium-binding structural domain. Protein
  interactions and expression-dependent effects on insulin signaling, adipocyte maturation and
  pigmentation have been observed in specific cell and disease contexts.
