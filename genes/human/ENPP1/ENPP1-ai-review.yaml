suggested_questions:
- question: Which ENPP1 constructs and natural oligonucleotide substrates in PMID:22285541 and
    the older phosphodiesterase-I studies establish cleavage directionality and product identity,
    distinct from synthetic-substrate hydrolysis?
- question: What experiments support direct ENPP1-dependent PPi movement, as distinct from extracellular
    PPi generation or uptake of supplied PPi, in the GO:0030505 source chain?
- question: Does the Cole-disease melanocyte phenotype reflect altered differentiation, mature-cell
    pigmentation, or both, and which ENPP1 biochemical or interaction function mediates it?
- question: Which ENPP1 enrichment and validation data in the PMID:17897319 supplementary tables
    support lysosomal-membrane localization?
- question: What are the abundance, cleavage site and oligomeric state of the natural soluble
    human ENPP1 product, and how do its substrate activities compare with membrane-anchored
    ENPP1?
- question: Can the historical reagent composition used in PMID:25344812 and the human constructs
    used in PMID:28011303 be documented well enough to assign substrate kinetics to defined
    ENPP1 products?
- question: Which existing GO process best represents ENPP1-derived pyrophosphate restraining
    ectopic soft-tissue calcification, separately from its context-dependent effects on bone
    mineralization?
- question: Does natural ENPP1 encounter and cleave physiological oligonucleotide substrates
    at relevant extracellular concentrations, and which products and signaling consequences
    result?
- question: For the PMID:28592560 GO:0010467 assertion, is an experiment beyond Fig. 2C–F and
    the Discussion/Fig. 7 regulatory model intended to demonstrate ENPP1 participation in producing
    a gene product, rather than measuring ENPP1 expression or downstream regulation?
