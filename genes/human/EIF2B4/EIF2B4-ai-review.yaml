id: Q9UI10
gene_symbol: EIF2B4
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: EIF2B4 encodes the delta subunit of eukaryotic translation initiation factor 2B, the cytosolic
  complex that promotes GDP release from eIF2 and regenerates active eIF2 for translation initiation.
  Delta forms part of the regulatory assembly with the alpha and beta subunits and contributes to complex
  organization and regulation by phosphorylated eIF2 and the small molecule ISRIB. The epsilon subunit
  contains the principal catalytic exchange activity. Human delta variants can impair whole-complex exchange
  and cause vanishing white matter disease, sometimes accompanied by ovarian dysfunction. Three natural
  delta protein products are recorded, but their assembly and regulatory properties have not all been
  directly compared.
