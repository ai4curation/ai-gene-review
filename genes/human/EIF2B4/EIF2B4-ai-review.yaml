suggested_questions:
- question: Do the sequence-verified 523-, 543- and 522-residue human EIF2B4 products differ in eIF2B
    assembly, nucleotide exchange or responsiveness to phosphorylated eIF2 at matched near-endogenous
    expression? The 543-residue construct called V1 in PMID:37014850 is not assigned to a natural UniProt
    product by length alone.
- question: In the human cell contexts studied in PMID:37014850, does elevated delta alter phosphorylated-eIF2
    sequestration by a free delta pool, the abundance of gamma/epsilon subcomplexes, or another assembly
    state? The reported gradient, co-immunoprecipitation and extract exchange measurements do not distinguish
    these mechanisms.
suggested_experiments:
- hypothesis: Natural EIF2B4 products may differ in complex assembly or phosphorylation-sensitive regulation;
    sequence differences alone do not establish an effect or its direction.
  description: Compare sequence-verified 523-, 543- and 522-residue products in matched-expression rescue
    and reconstituted human eIF2B. Quantify free subunits and assembled-complex stoichiometry together
    with eIF2 binding, GDP release and responses to phosphorylated eIF2. Include canonical-product rescue,
    delta omission and matched assembled-complex concentrations to distinguish altered assembly from changes
    in regulation.
  experiment_type: Matched-product rescue and biochemical reconstitution
