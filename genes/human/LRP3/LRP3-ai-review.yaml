core_functions:
- description: >-
    LRP3 is a type-I single-pass LDLR-family membrane protein whose extracellular
    repeat-containing region and cytoplasmic tyrosine-based internalization signal are
    compatible with receptor trafficking. No physiological ligand, cargo-uptake
    activity, or proximal signaling reaction has yet been established, so no specific
    molecular-function term is assigned.
  locations:
