description: >-
  LRP3 encodes a poorly characterized 770-amino-acid member of the low-density
  lipoprotein receptor family. The protein has a signal peptide, an extracellular
  repeat-containing region, a single transmembrane segment, and a proline-rich
  cytoplasmic region with a tyrosine-based internalization signal, consistent with a
  type-I membrane topology. LRP3 transcript is broadly detected in human tissues. In
  immortalized human bone-marrow stromal cells, LRP3 expression and perturbation
  support a context-dependent role that favors osteoblast differentiation and opposes
  adipocyte differentiation, with LRP3 mRNA regulated by miR-4739. Its physiological
  ligand, transported cargo, proximal signaling mechanism, and general relevance
  outside this stromal-cell model remain unknown; transfected CHO cells did not bind
  beta-migrating VLDL or receptor-associated protein under the reported conditions.
