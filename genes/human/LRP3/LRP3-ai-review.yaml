suggested_questions:
- question: >-
    What physiological ligand or extracellular partner, if any, engages human LRP3,
    given that beta-migrating VLDL and receptor-associated protein did not bind in the
    reported CHO-cell assay?
  experts:
  - H. Ishii
  - T. T. Yamamoto
- question: >-
    Does the cytoplasmic tyrosine-based signal drive constitutive or ligand-induced
    LRP3 internalization, and what cargo and adaptor machinery are involved?
  experts:
  - H. Ishii
  - T. T. Yamamoto
- question: >-
    Which proximal LRP3-dependent signaling event shifts immortalized human
    bone-marrow stromal cells between osteogenic and adipogenic differentiation, and
    does the same mechanism operate in primary human stromal cells?
  experts:
  - M. Elsafadi
  - A. Mahmood
  - M. Kassem
suggested_experiments:
- hypothesis: >-
    Human LRP3 recognizes a ligand distinct from beta-migrating VLDL and LRPAP1 and
    internalizes it through the cytoplasmic tyrosine-based signal.
  description: >-
    Use purified human LRP3 ectodomain for unbiased cell-surface and secreted-protein
    ligand capture, then test candidate binding and uptake in matched LRP3-null cells
    rescued with wild-type LRP3 or a tyrosine-signal mutant. Quantify surface loss,
    cargo internalization, endosomal delivery, and competition with soluble
    ectodomain.
  experiment_type: ligand discovery and internalization-rescue assay
- hypothesis: >-
    The cytoplasmic tyrosine-based signal recruits endocytic adaptors and is required
    for LRP3 movement from the plasma membrane into coated vesicles.
  description: >-
    Compare endogenous or equivalently expressed wild-type and tyrosine-signal-mutant
    LRP3 by surface biotinylation pulse-chase and live-cell imaging, coupled to
    proximity labeling or immunoprecipitation of adaptor proteins. Include expression,
    topology, and plasma-membrane delivery controls so a trafficking defect is not
    confused with misfolding.
  experiment_type: motif separation-of-function trafficking assay
- hypothesis: >-
    The stromal differentiation phenotype is caused by a proximal LRP3-dependent
    signaling pathway rather than nonspecific effects of the original knockdown.
  description: >-
    Generate independent LRP3 knockout clones in primary human bone-marrow stromal
    cells from multiple donors, rescue them with wild-type LRP3, and profile early
    phosphoproteomic and transcriptional responses before lineage markers diverge.
    Compare osteogenic and adipogenic differentiation with matched proliferation and
    viability controls, and test whether miR-4739 effects are rescued by an LRP3 cDNA
    lacking its 3' UTR.
  experiment_type: primary-cell knockout-rescue and pathway-identification study
knowledge_gaps:
- gap_statement: >-
    The direct molecular activity and physiological extracellular ligand of LRP3 are
    unknown.
  boundary: >-
    LRP3 has a type-I LDLR-family membrane topology and extracellular repeat domains,
    but transfected CHO cells did not bind beta-migrating VLDL or receptor-associated
    protein. Family membership does not identify an LRP3 ligand.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: >-
    Without a direct ligand or activity, receptor-family terminology cannot be turned
    into an informative molecular-function annotation.
  resolution: >-
    Direct biochemical ligand binding followed by LRP3-dependent cellular response or
    uptake, with knockout and rescue controls, would resolve this gap.
  provenance:
  - reference_id: PMID:9693042
    supporting_text: |-
      Despite
      the presence of the ligand-binding repeats, CHO cells transfected with LRP3 did
      not bind beta-migrating very-low-density lipoprotein or receptor-associated
      protein.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
- gap_statement: >-
    It is unknown whether the cytoplasmic tyrosine-based signal mediates LRP3
    endocytosis, which adaptors it recruits, and whether any physiological cargo is
    internalized.
  boundary: >-
    The cloned sequence contains an internalization-compatible motif, and automated
    family annotations support membrane and broad vesicle-trafficking placement, but
    the accessible primary abstract reports no cargo-uptake experiment.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: >-
    Resolving this distinction determines whether LRP3 is an endocytic receptor, a
    signaling membrane protein, or both.
  resolution: >-
    Quantitative internalization assays with wild-type and motif-mutant LRP3, an
    identified cargo, and adaptor perturbations would resolve the mechanism.
  provenance:
  - reference_id: PMID:9693042
    supporting_text: |-
      region with a tyrosine-based internalization signal.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
- gap_statement: >-
    The proximal pathway connecting LRP3 to osteogenic-versus-adipogenic fate and the
    generality of this phenotype beyond immortalized human stromal-cell clones are
    unknown.
  boundary: >-
    LRP3 knockdown and miR-4739 perturbation alter lineage differentiation and marker
    expression in immortalized human bone-marrow stromal cells, but the abstract does
    not identify a ligand or early signaling event.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    A proximal mechanism is needed to distinguish an evolved LRP3 signaling role from
