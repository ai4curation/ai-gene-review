gene_symbol: ABCG2
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  ABCG2 (breast cancer resistance protein, BCRP) is a plasma-membrane ATP-binding
  cassette (ABC) transporter of the ABCG subfamily. It is a "half transporter"
  carrying a single N-terminal nucleotide-binding domain followed by a single
  six-helix transmembrane domain, and it assembles into a disulfide-linked
  homodimer (the minimal functional unit) that further oligomerizes into
  homotetramers and higher-order species. Powered by ATP binding and hydrolysis
  at its nucleotide-binding domains, ABCG2 actively extrudes a chemically broad
  range of substrates from the cytoplasm to the extracellular space. Its
  physiological cargo includes uric acid (ABCG2 is a high-capacity urate exporter
  mediating renal and intestinal urate excretion), the vitamin riboflavin
  (secreted into milk), porphyrins such as protoporphyrin IX and heme,
  sphingosine-1-phosphate, sulfate- and glucuronide-conjugated steroids (e.g.
  estrone-3-sulfate, dehydroepiandrosterone sulfate, estradiol glucuronides), and
  itaconate in inflammatory macrophages. ABCG2 also effluxes a wide spectrum of
  unrelated xenobiotics and chemotherapeutics (mitoxantrone, methotrexate,
  topotecan and other camptothecins, anthracyclines, tyrosine-kinase inhibitors),
  conferring multidrug resistance. It is expressed at the apical/luminal membrane
  of polarized epithelial and endothelial cells of placenta, intestine, liver
  canaliculi, the kidney proximal-tubule brush border, and the blood-brain
  barrier, where it limits tissue penetration of drugs and toxins. Loss-of-function
  variants (notably Q141K) raise serum urate and cause hyperuricemia and gout, and
  null alleles define the Junior (Jr) blood group.
