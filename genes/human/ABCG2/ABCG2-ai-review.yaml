        concentration gradient
core_functions:
- description: >-
    ATP-driven efflux of structurally diverse xenobiotics and chemotherapeutic
    drugs (mitoxantrone, methotrexate, camptothecins, anthracyclines, etc.) across
    the plasma membrane, lowering their intracellular concentration and conferring
    multidrug resistance. ABCG2 couples ATP binding/hydrolysis at its single NBD
    to substrate translocation and functions as a disulfide-linked homodimer that
    oligomerizes into homotetramers.
  molecular_function:
    id: GO:0008559
    label: ABC-type xenobiotic transporter activity
  directly_involved_in:
  - id: GO:1990961
    label: xenobiotic detoxification by transmembrane export across the plasma membrane
  - id: GO:1990748
    label: cellular detoxification
  - id: GO:0140115
