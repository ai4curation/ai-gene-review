  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:1347061
  - PANTHER:PTN002710469
  review:
    summary: >-
      Phylogenetic inference of inorganic sulfite export by the mammalian ABCG2
      clade.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      There is no direct experimental evidence that human ABCG2 exports inorganic
      sulfite. Its well-characterized anionic substrates are organic sulfate- and
      glucuronide-conjugates (e.g. estrone-3-sulfate, DHEA-sulfate), urate,
      riboflavin and porphyrins, which are chemically distinct from free sulfite.
      The IBA likely over-propagates an ancestral/paralog activity; retained but
      flagged as a probable over-annotation for the human gene.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN002710469
        comment: >-
          Ancestral ABCG node from which the sulfite-export assertion descends. No
          target-specific (human ABCG2) experimental evidence supports inorganic
          sulfite export; the characterized human anionic substrates are organic
          sulfate/glucuronide conjugates, so the inherited term appears mis-scoped
          for this gene.
        source_status: SOURCE_WEAK_OR_INFERRED
