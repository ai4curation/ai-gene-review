  locations:
  - id: GO:0005886
    label: plasma membrane
  - id: GO:0016324
    label: apical plasma membrane
  supported_by:
  - reference_id: PMID:9861027
    supporting_text: >-
      BCRP is a xenobiotic transporter that appears to play a major role in the
      multidrug resistance phenotype of MCF-7/AdrVp human breast cancer cells
  - reference_id: PMID:30405239
    supporting_text: >-
      Powered by ATP, it translocates endogenous substrates, affects the
      pharmacokinetics of many drugs and protects against a wide array of
      xenobiotics
- description: >-
    High-capacity ATP-driven urate export. At the apical brush-border membrane of
    kidney proximal-tubule cells (and in intestine) ABCG2 secretes uric acid,
    contributing to renal and extrarenal urate excretion; common loss-of-function
    variants (Q141K) reduce transport and raise serum urate, causing hyperuricemia
    and gout.
  molecular_function:
    id: GO:0015143
    label: urate transmembrane transporter activity
  directly_involved_in:
  - id: GO:0097744
    label: renal urate salt excretion
  - id: GO:0015747
    label: urate transport
  - id: GO:0046415
    label: urate metabolic process
  locations:
  - id: GO:0016324
    label: apical plasma membrane
  - id: GO:0031526
    label: brush border membrane
  supported_by:
  - reference_id: PMID:19506252
    supporting_text: >-
      native ABCG2 is located in the brush border membrane of kidney proximal
      tubule cells, where it mediates renal urate secretion
  - reference_id: PMID:36749388
    supporting_text: >-
      an intestinal and renal urate exporter
- description: >-
    ATP-driven secretion of the vitamin riboflavin (vitamin B2) across the apical
    membrane; in lactating mammary gland ABCG2 concentrates riboflavin into milk,
    and elsewhere it increases intestinal excretion of riboflavin and its
    derivative lumichrome.
  molecular_function:
    id: GO:0032217
    label: riboflavin transmembrane transporter activity
  directly_involved_in:
  - id: GO:0032218
    label: riboflavin transport
  locations:
  - id: GO:0016324
    label: apical plasma membrane
  supported_by:
  - reference_id: PMID:17145775
    supporting_text: >-
      BCRP is responsible for pumping riboflavin (vitamin B(2)) into milk
- description: >-
    ATP-driven export of porphyrins. ABCG2 exports protoporphyrin IX (and heme),
    contributing to cellular porphyrin homeostasis; a mitochondrial pool exports
    PpIX from mitochondria to the cytosol and reduces ALA-mediated PpIX
    accumulation.
  molecular_function:
    id: GO:0015232
    label: heme transmembrane transporter activity
  directly_involved_in:
  - id: GO:0140115
    label: export across plasma membrane
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:23189181
    supporting_text: >-
      the mitochondrial ABCG2 regulates ALA-mediated PpIX level through PpIX export
      from mitochondria to the cytosol
suggested_questions:
- question: >-
    Does human ABCG2 export inorganic sulfite (as opposed to organic
    sulfate/glucuronide conjugates), as implied by the GO:0160244 IBA, and if so in
    which tissue?
- question: >-
    What is the physiological significance of the minor mitochondrial pool of
    ABCG2 relative to its dominant plasma-membrane function?
suggested_experiments:
- description: >-
    Direct transport assay (membrane vesicles or polarized cells) testing
    radiolabeled inorganic sulfite efflux by wild-type human ABCG2 versus an
    inactive (E211Q) control to confirm or refute the sulfite-export inference.
