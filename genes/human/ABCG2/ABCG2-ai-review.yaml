- term:
    id: GO:0015232
    label: heme transmembrane transporter activity
  evidence_type: IDA
  original_reference_id: PMID:23189181
  qualifier: enables
  review:
    summary: >-
      ABCG2 exports porphyrins (protoporphyrin IX) and heme; a mitochondrial pool
      exports PpIX to the cytosol and the plasma-membrane tetramer effluxes heme
      from cytosol to the extracellular space.
    action: NEW
    reason: >-
      ABCG2's porphyrin/heme export is a well-supported molecular function not
      represented in the current GOA set. ABCG2 itself performs the transport step
      (it is the efflux pump), satisfying the participation requirement for a NEW
      annotation. Supported by direct PpIX-export data and the curated Reactome
      heme-export reaction.
