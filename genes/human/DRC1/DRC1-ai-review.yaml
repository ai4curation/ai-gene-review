core_functions:
- description: DRC1 is an integral structural subunit of the axonemal nexin-dynein regulatory complex. Its
    conserved coiled-coil architecture with DRC2 and DRC4 provides the scaffold supporting other N-DRC subunits.
    Detailed scaffold contacts are resolved in the algal complex; human respiratory-axoneme models place the
    human homologues in the corresponding complex using cryo-EM density and predicted subcomplex structures.
    Human loss-of-function and ortholog experiments establish a requirement for N-DRC integrity, coordinated
    ciliary beating and sperm-axoneme organization. DRC1 loss causes later disorganization of initially formed
    mouse sperm axonemes, whereas respiratory cilia can retain the gross dynein-arm and radial-spoke arrangements.
    The scaffold role does not imply autonomous dynein motor activity, and the specific requirement for human
    IDAe docking remains unresolved.
