suggested_questions:
- question: Which selected human inner-dynein-arm docking steps depend on DRC1, and how do these differ between
    respiratory cilia and sperm flagella?
- question: Does human DRC1 have a diffuse cytosolic pool under the conditions represented by the mouse donor
    annotation, distinct from axonemal and primary-cilium transition-zone localization?
- question: Which DRC1–N-DRC subunit contacts are direct in sequence-authenticated human preparations, and
    which are mediated by other complex components?
suggested_experiments:
- description: Combine DRC1 loss and matched rescue with quantitative axonemal proteomics and cryo-electron
    tomography in human respiratory and sperm models, resolving individual inner-arm species rather than relying
    only on gross arm markers.
- description: Use endogenous tagging or independently validated antibodies with genetic specificity controls
    and soluble/axonemal fractionation to distinguish cytosolic, transition-zone and axonemal DRC1 pools.
- description: Reconstitute defined human DRC1-containing subcomplexes with authenticated sequences and test
    pairwise contact and complex stability separately from cellular co-immunoprecipitation.
