- id: PMID:23354437
  title: The nexin-dynein regulatory complex subunit DRC1 is essential for motile cilia function in algae and
    humans.
  findings:
  - statement: DRC1 loss disrupts N-DRC integrity and ciliary beating in human respiratory cells; algal mutants
      additionally reveal selective inner-arm and associated-complex defects.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Original Methods, Results, Discussion and relevant captions were independently read. The
      study combines human respiratory cilia and algal pf3/DRC1 experiments. Human N-DRC links and associated
      components are lost while gross dynein-arm markers remain; selective inner-arm assembly defects are demonstrated
      in algae. These species-specific results support structural regulation and a conserved assembly contribution
      without claiming wholesale human dynein-arm loss.
- id: PMID:34169321
  title: Loss of DRC1 function leads to multiple morphological abnormalities of the sperm flagella and male
    infertility in human and mouse.
  findings:
  - statement: DRC1 loss causes severe sperm-flagellum abnormalities and infertility, with later disorganization
      of initially formed mouse spermatid axonemes.
  - statement: Tagged co-immunoprecipitation detects DRC1 association with DRC2, DRC3, DRC4 and DRC5 under
      the reported expression conditions.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Original Methods, Results, relevant figure captions, the Figure 4 blot and the genuine supplementary
      document were independently read. Human infertility/MMAF and mouse sperm-axoneme instability are distinguished
      from respiratory-cilium findings. Controlled HA-DRC1/Flag-DRC2/3/4/5 co-immunoprecipitation supports
      association. The accessible main and supplementary methods do not authenticate the transfected ORF species
      or sequence; the human cell host alone does not do so.
- id: PMID:37258679
  title: Axonemal structures reveal mechanoregulatory and disease mechanisms.
  findings:
  - statement: The human respiratory-axoneme structural inventory includes DRC1 and its N-DRC partners. Detailed
      algal scaffold architecture informs the homologous human placement without settling every human dynein-docking
      dependency.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Original structural Results and operative Methods, human Supplementary Table 3 header and
      target rows, and the selected table-page image were read. Human respiratory ALI axonemes and algal structures
