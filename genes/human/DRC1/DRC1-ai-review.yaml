      whereas its human respiratory cilia retain gross dynein arms, DNALI1 and CCDC39. These human observations
      do not exclude subtle or context-dependent assembly contributions. Conserved N-DRC structural participation
      and the distinct mouse sperm phenotype in PMID:34169321 support the gene-level curated process. Accept
      with curator deference and the explicit limit that the inspected human experiments do not establish wholesale
      arm loss or a specific human IDAe docking reaction.
    additional_reference_ids:
    - PMID:34169321
    - PMID:37258679
    supported_by:
    - reference_id: PMID:23354437
    - reference_id: PMID:34169321
    - reference_id: PMID:37258679

