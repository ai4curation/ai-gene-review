id: Q96MC2
gene_symbol: DRC1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: DRC1 is a coiled-coil structural protein of the nexin-dynein regulatory complex in motile ciliary
  and sperm flagellar axonemes. Together with other core subunits, it supports the complex architecture that
  couples neighboring axonemal microtubule doublets and coordinates dynein-driven bending. It is required for
  N-DRC integrity and stable sperm-axoneme organization; the structural consequences of its loss differ between
  respiratory cilia and sperm flagella. Biallelic pathogenic variants cause primary ciliary dyskinesia and
  can cause male infertility with abnormal sperm flagella.
