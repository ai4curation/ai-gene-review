taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'DERL3 is a multi-pass endoplasmic-reticulum membrane Derlin-family ERAD factor that helps
  remove misfolded luminal glycoproteins. It hetero-oligomerizes with DERL2, associates with VCP/p97 and
  EDEM1, is induced by the unfolded protein response, and binds SRP/SRPR during ER stress-induced pre-emptive
  quality control.'
