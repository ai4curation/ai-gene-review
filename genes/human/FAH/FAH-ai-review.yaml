- term:
    id: GO:0009072
    label: aromatic amino acid metabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: >-
      InterPro2GO electronic annotation to the broad aromatic amino acid metabolic process
      grouping term.
    action: MODIFY
    reason: >-
      Tyrosine and phenylalanine are aromatic amino acids, so FAH's catabolic role legitimately
      falls under this grouping term, but it is less specific than the evidence supports. Both
      L-tyrosine catabolic process (GO:0006572) and L-phenylalanine catabolic process
      (GO:0006559) are is_a descendants (via aromatic amino acid catabolic process) and are
      already annotated to FAH, so the term is refined to both.
    proposed_replacement_terms:
    - id: GO:0006572
      label: L-tyrosine catabolic process
    - id: GO:0006559
      label: L-phenylalanine catabolic process
    supported_by:
    - reference_id: PMID:9305902
      supporting_text: >-
        HT1 is due to mutations in the fumarylacetoacetate hydrolase gene Fah, encoding the
        last enzyme in the tyrosine catabolic pathway.
