- term:
    id: GO:0006559
    label: L-phenylalanine catabolic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: >-
      Phylogenetically inferred involvement in L-phenylalanine catabolism. Phenylalanine is
      catabolized via conversion to tyrosine, so FAH is the terminal step of both pathways.
    action: ACCEPT
    reason: >-
      UniProt places FAH as the final step (step 6/6) of L-phenylalanine degradation to
      acetoacetate and fumarate (UniPathway UPA00139). The annotation is correct, though the
      phenylalanine framing is one metabolic conversion removed from FAH's direct substrate;
      the more direct role is captured by L-tyrosine catabolic process.
    supported_by:
    - reference_id: PMID:1998338
      supporting_text: >-
        having enzymatic activity as shown by the hydrolysis of the natural substrate
        fumarylacetoacetate
    - reference_id: file:interpro/panther/PTHR43069/PTHR43069-paint.tsv
      supporting_text: "PTHR43069\tPTN002453799\tGO:0006559\tP\tIBD\tfalse"
- term:
    id: GO:1902000
    label: homogentisate catabolic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: >-
      Phylogenetically inferred involvement in homogentisate catabolism. Homogentisate is
      ring-cleaved by HGD to maleylacetoacetate, isomerized by GSTZ1 to
      4-fumarylacetoacetate, and FAH hydrolyzes that to fumarate and acetoacetate, completing
      homogentisate breakdown.
    action: ACCEPT
    reason: >-
      A catabolic process term covers every step from the named substrate to its end
      products, so FAH, which catalyzes the final hydrolytic step of the homogentisate
      branch, does part of the work of homogentisate catabolism. This is the same logic by
      which FAH is accepted for L-tyrosine catabolic process (where it acts five steps after
      tyrosine), and GO:1902000 is in fact the narrowest pathway term describing FAH's step.
      The PAINT IBD node PTN002453799 is seeded by the experimentally characterized
      Arabidopsis FAH, and the bacterial ortholog HmgB is experimentally placed in the
      homogentisate central pathway (PMID:15262943). Accepted as core; an earlier draft had
      this as non-core, which was inconsistent with accepting the tyrosine-catabolic terms.
    supported_by:
    - reference_id: file:interpro/panther/PTHR43069/PTHR43069-paint.tsv
      supporting_text: "PTHR43069\tPTN002453799\tGO:1902000\tP\tIBD\tfalse"
    - reference_id: Reactome:R-HSA-71181
      supporting_text: >-
        Fumarylacetoacetase catalyzes the hydrolysis of 4-fumarylacetoacetate (4FAA) to form
        fumarate and acetoacetate.
