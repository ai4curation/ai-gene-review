  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR036036
  review:
    summary: Intracellular signal transduction (IEA, InterPro SOCS box). In ASB proteins the SOCS box
      is the Elongin B/C-Cullin 5-binding module of a ubiquitin-ligase substrate receptor. The signalling
      mapping is inherited from the cytokine-signalling SOCS proteins. Any effect ASB14 has on signalling
      would come from degrading signalling components, which is regulation rather than participation in
      signal transduction. Marked as over-annotated, matching the repo's treatment of this InterPro mapping.
    action: MARK_AS_OVER_ANNOTATED
