  label: Homo sapiens
description: ASB14 is an ankyrin repeat and SOCS box protein of the ASB family, whose members serve as
  substrate receptors of Elongin B/C-Cullin 5 E3 ubiquitin ligases. It is little studied. In mouse heart,
  ASB14 is down-regulated during regeneration, and its loss slows degradation of the microtubule plus-end
  protein MAPRE2, promotes cardiomyocyte nuclear proliferation and preserves cardiac function after infarction.
  Overexpression in a human cardiomyocyte line promotes apoptosis and impairs mitochondrial function.
