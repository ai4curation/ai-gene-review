core_functions:
- description: Acts at the plasma membrane as an LPA-activated GPCR, coupling ligand occupancy to Gi/Go,
    Gq, and G12/13 heterotrimeric G proteins. Proximal outputs include Gi-mediated inhibition of adenylyl
    cyclase and local cAMP signaling, phospholipase-C-dependent inositol-phosphate production and cytosolic
    calcium elevation through Gi and Gq inputs, and a G12/13-linked Rho signaling branch. The resulting
    effects on ion transport, adhesion, migration, survival, and disease phenotypes are cell- and tissue-context
    outputs rather than additional core molecular activities. The terminal DSTL PDZ-binding motif can
    tune these branches by recruiting NHERF2/PLCB3 or MAGI3, but those regulated assemblies are contextual
    and are not an obligate stable receptor complex. Recombinant human EDG4 can also potentiate forskolin-driven
    cAMP in Sf9 cells; contextual inhibitory signaling does not establish universal absence of activation.
