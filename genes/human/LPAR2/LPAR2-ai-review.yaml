- id: PMID:10729222
  title: Genomic characterization of the lysophosphatidic acid receptor gene, lp(A2)/Edg4,
    and identification of a frameshift mutation in a previously characterized cDNA.
  findings:
  - statement: Human and mouse LPAR2 transcripts are encoded by three exons, with an intron interrupting the region encoding transmembrane domain VI.
    supporting_text: Sequence analysis of genomic clones demonstrated that both mouse and human transcripts were encoded by three exons, with an intron separating the coding region for transmembrane domain VI.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  - statement: The frameshift in the initially characterized human EDG4 cDNA was a tumor-derived sequence variant, not evidence for a normal LPAR2 protein isoform.
    supporting_text: One such variant (a G deletion) in the initially characterized Edg4 cDNA clone (derived from an ovarian tumor) results in a frameshift mutation near the 3' end of the coding region.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Primary genomic study that resolves the historical EDG4 frameshift and prevents a tumor-cDNA artifact from being treated as a normal isoform.
- id: PMID:10922489
  title: Lysophosphatidic acid (LPA) receptors of the EDG family are differentially
    activated by LPA species. Structure-activity relationship of cloned LPA receptors.
  findings:
  - statement: Recombinant EDG4/LPAR2 responds broadly to LPA molecular species, while discriminating between shorter saturated acyl chains.
    supporting_text: In contrast, EDG2 and EDG4 showed broad ligand specificities, although EDG2 and EDG4 discriminated between 14:0 (myristoyl) and 16:0 (palmitoyl), and 12:0 (lauroyl) and 14:0 LPAs, respectively.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct receptor structure-activity study; assays were performed in recombinant Sf9 cells and support ligand-species responsiveness rather than native-tissue selectivity.
- id: PMID:14688263
  title: TRIP6 enhances lysophosphatidic acid-induced cell migration by interacting
    with the lysophosphatidic acid 2 receptor.
  findings:
