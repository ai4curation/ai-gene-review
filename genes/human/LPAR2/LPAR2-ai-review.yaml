- id: PMID:33961781
  title: Dual proteome-scale networks reveal cell-specific remodeling of the human interactome.
  findings:
  - statement: BioPlex 3.0 provides cell-line-specific AP-MS interaction networks and shows that interaction
      context can differ between cell lines.
    supporting_text: Through affinity-purification mass spectrometry, we have created two proteome-scale,
      cell-line-specific interaction networks.
    full_text_unavailable: false
