id: Q9HBW0
gene_symbol: LPAR2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  LPAR2 is a class-A seven-transmembrane G protein-coupled receptor that binds
  extracellular lysophosphatidic acid at the plasma membrane and converts ligand
  occupancy into heterotrimeric G-protein signaling. Human receptor studies
  establish Gi- and Gq-dependent phospholipase-C activation, inositol-phosphate
  production, and cytosolic calcium mobilization; integrated evidence also supports
  Gi/Go-mediated inhibition of adenylyl cyclase and coupling to G12/13-linked Rho
  signaling. The receptor's terminal DSTL sequence is a PDZ-binding motif that
  recruits regulatory scaffolds: NHERF2 links LPAR2 selectively to PLCB3 and, in
  polarized intestinal epithelium, organizes spatial coupling to CFTR, while MAGI3
  modulates ERK and RhoA outputs in a colon-cancer-cell context. TRIP6 instead binds
  the carboxyl-terminal tail through LIM domains and connects activated LPAR2 to
  focal-adhesion signaling. These scaffold contacts regulate the receptor in
  particular cellular settings and are not evidence for one constitutive LPAR2
  complex. GRK2-dependent desensitization and agonist-associated endocytic
  localization further regulate signaling. RalA associates with LPAR2, whereas
  agonist-driven RalA activation and Ral-dependent PLC activity were demonstrated
  for LPAR1 rather than LPAR2. The reviewed human
  protein is a 348-residue receptor with no established alternative protein
  isoforms; an early ovarian-tumor cDNA frameshift is a sequence variant/artifact,
  not a normal isoform. Proteome-scale LGALS3 and RAMP interactions remain
  screen-level observations without an established LPAR2-specific signaling role.
