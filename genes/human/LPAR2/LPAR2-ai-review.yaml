id: Q9HBW0
gene_symbol: LPAR2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: LPAR2 is a class-A seven-transmembrane receptor for extracellular lysophosphatidic acid.
  At the plasma membrane it activates heterotrimeric G-protein signaling, including phospholipase-C-dependent
  calcium mobilization, contextual Gi-mediated inhibition of adenylyl cyclase, and Rho signaling. Recombinant
  human EDG4 also potentiates forskolin-stimulated cAMP accumulation in an insect-cell assay, indicating
  that the direction of cyclic-nucleotide responses depends on the signaling environment. Its C-terminal
  PDZ-binding motif recruits NHERF2 and MAGI3, while TRIP6 binds through LIM domains. These partners connect
  the receptor to spatially organized calcium, ion-transport, adhesion and migration responses. LPAR2
  undergoes phosphorylation, desensitization and endocytic trafficking. RalA associates with LPAR2, although
  the demonstrated agonist-driven RalA activation in the original comparative study was LPA1-specific.
  Proteomic studies also detect associations with LGALS3 and RAMP proteins whose effects on receptor signaling
  remain incompletely characterized.
