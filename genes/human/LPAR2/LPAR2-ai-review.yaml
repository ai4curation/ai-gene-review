- id: PMID:39083597
  title: Multiplexed mapping of the interactome of GPCRs with receptor activity-modifying proteins.
  findings:
  - statement: LPAR2 showed strong evidence for complex formation with RAMP1, RAMP2, and RAMP3 across
      all capture-detection methods in the heterologous screen.
    supporting_text: 'Nine GPCRs showed evidence for complex formation with all three RAMPs across all
      capture-detection methods: GABBR1, GPR143, GPR21, GPR61, HTR4, LPAR2, MTNR1A, OXER1, and P2RY11
      (see table S1 for the corresponding GPCR UniProt IDs).'
    full_text_unavailable: false
    reference_section_type: RESULTS
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Direct systematic evidence for LPAR2-RAMP1/2/3 complex formation under ectopic coexpression;
      no LPAR2-specific trafficking, pharmacology, or native-tissue consequence was established.
- id: PMID:9525886
  title: Characterization of a novel subtype of human G protein-coupled receptor for lysophosphatidic
    acid.
  findings:
  - statement: Human EDG4/LPAR2 expression confers concentration-dependent, LPA-specific signaling and
      increases specific radiolabeled-LPA binding sites.
    supporting_text: When overexpressed in Jurkat T cells, the Edg4 protein mediated LPA-induced activation
      of a serum response element reporter gene with LPA concentration dependence (EC50 of 10 nM) and
      specificity.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  - statement: The founding receptor assay supports both pertussis-toxin-sensitive Gi input and Rho-dependent
      signaling downstream of LPAR2.
    supporting_text: This LPA-induced reporter gene activation could be partially inhibited by pretreatment
      with pertussis toxin or C3 exoenzyme, suggesting requirements for both a Gi protein and Rho GTPase.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  - statement: Two differently distributed EDG4 mRNA sizes were observed, but the abstract does not establish
      distinct protein isoforms.
    supporting_text: Northern blots revealed that two edg4 mRNA transcripts of 1.8 and 8 kilobases are
      distributed very differently from edg2 mRNAs in adult human tissues and several cancer cell lines.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Founding direct human receptor characterization. The two transcript sizes are expression
      observations, not evidence for functionally distinct protein isoforms.
- id: PMID:9804623
  title: Recombinant human G protein-coupled lysophosphatidic acid receptors mediate intracellular calcium
    mobilization.
  findings:
  - statement: Recombinant human EDG4/LPAR2 mobilizes calcium through PLC-generated IP3.
    supporting_text: The coincident production of inositol phosphates and the inhibition of Ca2+ mobilization
      by the phospholipase C inhibitor U73122 strongly suggested that Edg2 and Edg4 mobilize Ca2+ through
      inositol trisphosphate generated by phospholipase C activation.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  - statement: LPAR2 calcium mobilization requires both pertussis-toxin-sensitive Gi and Gq inputs.
    supporting_text: Pertussis toxin almost completely blocked LPA-induced Ca2+ mobilization by Edg2 but
      only partially blocked that by Edg4, which suggests that Edg2 transduces Ca2+ mobilization largely
      through pertussis toxin-sensitive Gi proteins, whereas Edg4 requires both Gi and Gq.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct recombinant human receptor evidence that resolves the PLC/IP3/calcium mechanism
      and mixed Gi/Gq coupling of LPAR2.
