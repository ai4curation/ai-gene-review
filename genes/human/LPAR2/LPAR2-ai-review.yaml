- id: PMID:10729222
  title: Genomic characterization of the lysophosphatidic acid receptor gene, lp(A2)/Edg4, and identification
    of a frameshift mutation in a previously characterized cDNA.
  findings:
  - statement: Human and mouse LPAR2 transcripts are encoded by three exons, with an intron interrupting
      the region encoding transmembrane domain VI.
    supporting_text: Sequence analysis of genomic clones demonstrated that both mouse and human transcripts
      were encoded by three exons, with an intron separating the coding region for transmembrane domain
      VI.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  - statement: The frameshift in the initially characterized human EDG4 cDNA was a tumor-derived sequence
      variant, not evidence for a normal LPAR2 protein isoform.
    supporting_text: One such variant (a G deletion) in the initially characterized Edg4 cDNA clone (derived
      from an ovarian tumor) results in a frameshift mutation near the 3' end of the coding region.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Primary genomic study that resolves the historical EDG4 frameshift and prevents a tumor-cDNA
      artifact from being treated as a normal isoform.
- id: PMID:10922489
  title: Lysophosphatidic acid (LPA) receptors of the EDG family are differentially activated by LPA species.
    Structure-activity relationship of cloned LPA receptors.
  findings:
  - statement: Recombinant EDG4/LPAR2 responds broadly to LPA molecular species, while discriminating
      between shorter saturated acyl chains.
    supporting_text: In contrast, EDG2 and EDG4 showed broad ligand specificities, although EDG2 and EDG4
      discriminated between 14:0 (myristoyl) and 16:0 (palmitoyl), and 12:0 (lauroyl) and 14:0 LPAs, respectively.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct receptor structure-activity study; assays were performed in recombinant Sf9 cells
      and support ligand-species responsiveness rather than native-tissue selectivity.
- id: PMID:14688263
  title: TRIP6 enhances lysophosphatidic acid-induced cell migration by interacting with the lysophosphatidic
    acid 2 receptor.
  findings:
  - statement: LPA stimulation promotes a direct interaction between TRIP6 LIM domains and the LPAR2 carboxyl-terminal
      tail.
    supporting_text: Here we show that LPA stimulation promotes the interaction of the LPA(2) receptor
      with a focal adhesion molecule, TRIP6 (thyroid receptor interacting protein 6)/ZRP-1 (zyxin-related
      protein 1). TRIP6 directly binds to the carboxyl-terminal tail of the LPA(2) receptor through its
      LIM domains.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  - statement: TRIP6 recruitment links activated LPAR2 to focal adhesions, actin stress fibers, and enhanced
      cell migration.
    supporting_text: Overexpression of TRIP6 augments LPA-induced cell migration; in contrast, suppression
      of endogenous TRIP6 expression by a TRIP6-specific small interfering RNA reduces it in SKOV3 ovarian
      cancer cells.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct LPAR2 interaction and perturbation study; the migration consequence is demonstrated
      in SKOV3 ovarian cancer cells and should remain context-bounded.
- id: PMID:15143197
  title: NHERF2 specifically interacts with LPA2 receptor and defines the specificity and efficiency of
    receptor-mediated phospholipase C-beta3 activation.
  findings:
  - statement: LPAR2 specifically binds NHERF2 through its C-terminal PDZ-binding motif and the second
      PDZ domain of NHERF2.
    supporting_text: This study found that LPA(2), but not the other LPA receptor isoforms, specifically
      interacts with Na(+)/H(+) exchanger regulatory factor2 (NHERF2). In addition, the interaction between
      them requires the C-terminal PDZ domain-binding motif of LPA(2) and the second PDZ domain of NHERF2.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  - statement: NHERF2 scaffolds LPAR2 specifically to PLC-beta3 and potentiates receptor-driven PLC signaling.
    supporting_text: Using its second PDZ domain, NHERF2 was found to indirectly link LPA(2) to PLC-beta3
      to form a complex, and the other PLC-beta isozymes were not included in the protein complex. Consistently,
      LPA(2)-mediated PLC-beta activation was specifically inhibited by the gene silencing of PLC-beta3.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Decisive direct mechanistic source for the LPAR2 PDZ motif, NHERF2 specificity, and
      PLCB3 signaling complex; cached accessible content is abstract-level.
- id: PMID:16203867
  title: Lysophosphatidic acid inhibits cholera toxin-induced secretory diarrhea through CFTR-dependent
    protein interactions.
  findings:
  - statement: In intestinal epithelial cells, LPAR2 localizes apically and forms an NHERF2-mediated macromolecular
      complex with CFTR.
    supporting_text: Here we show, for the first time, that type 2 LPA receptors (LPA2) are expressed
      at the apical surface of intestinal epithelial cells, where they form a macromolecular complex with
      Na+/H+ exchanger regulatory factor-2 and CFTR through a PSD95/Dlg/ZO-1-based interaction.
    full_text_unavailable: false
    reference_section_type: ABSTRACT
  - statement: LPAR2 signals through Gi to inhibit CFTR activity in a spatially compartmentalized epithelial
      membrane domain.
    supporting_text: LPA inhibited CFTR-dependent iodide efflux through LPA2-mediated Gi pathway, and
      LPA inhibited CFTR-mediated short-circuit currents in a compartmentalized fashion.
    full_text_unavailable: false
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct human epithelial localization, complex-assembly, and Gi-functional evidence,
      complemented by mouse knockout physiology; species and epithelial-context boundaries remain explicit.
- id: PMID:16904289
  title: MAGI-3 regulates LPA-induced activation of Erk and RhoA.
  findings:
  - statement: MAGI3 binds LPAR2 specifically through its fifth PDZ domain and the receptor's terminal
      four residues.
    supporting_text: MAGI-3 specifically bound to LPA(2), but not to LPA(1) and LPA(3). This interaction
      was mediated via the fifth PDZ domain of MAGI-3 interacting with the carboxyl-terminal 4 amino acids
      of LPA(2), and mutational alteration of the carboxyl-terminal sequences of LPA(2) severely attenuated
      its ability to bind MAGI-3.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  - statement: MAGI3 promotes LPAR2-linked ERK and RhoA activation in SW480 colon cancer cells.
    supporting_text: These results demonstrate that MAGI-3 interacts directly with LPA(2) and regulates
      the ability of LPA(2) to activate Erk and RhoA.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct interaction, motif-mutagenesis, and signaling-perturbation evidence; downstream
      results are bounded to the SW480 colon cancer model.
- id: PMID:19306925
  title: Dual regulation of lysophosphatidic acid (LPA1) receptor signalling by Ral and GRK.
  findings:
  - statement: RalA associates with both LPAR1 and LPAR2 in HEK293 cells, but the accessible evidence
      assigns LPA-triggered RalA activation specifically to LPAR1.
    supporting_text: We show that the small GTPase RalA associates with both LPA(1) and LPA(2) in human
      embryonic kidney (HEK 293) cells and that stimulation of LPA(1) receptors with LPA triggers the
      activation of RalA.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  - statement: GRK2 is required for desensitization of both LPAR1 and LPAR2.
    supporting_text: Furthermore, we found that GRK2 is required for the desensitization of LPA(1) and
      LPA(2) and have identified a novel interaction between RalA and GRK2, which is promoted by LPA(1)
      receptor activity.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Despite the LPA1-focused title, the abstract directly assays LPAR2 association and desensitization.
      RalA activation and Ral-dependent PLC activity are LPAR1-specific and must not be transferred to
      LPAR2.
- id: PMID:28514442
  title: Architecture of the human interactome defines protein communities and disease networks.
  findings:
  - statement: BioPlex 2.0 is a large-scale human affinity-purification mass-spectrometry interaction
      map rather than a targeted LPAR2 mechanistic study.
    supporting_text: Here we present BioPlex 2.0 (Biophysical Interactions of ORFeome-derived complexes),
      which uses robust affinity purification-mass spectrometry methodology to elucidate protein interaction
      networks and co-complexes nucleated by more than 25% of protein-coding genes from the human genome,
