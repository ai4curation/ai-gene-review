suggested_questions:
- question: What are the relative Gi/Go, Gq, G12/13, and beta-arrestin coupling efficacies of endogenous
    human LPAR2 across tissues and LPA molecular species?
- question: Does the terminal DSTL motif mediate mutually exclusive or dynamic recruitment of NHERF2/PLCB3
    and MAGI3, and how does scaffold choice alter proximal signaling?
- question: Which aspects of TRIP6 recruitment, RalA association, GRK2-dependent desensitization, and
    endocytic trafficking operate at endogenous LPAR2 levels?
- question: Do LGALS3 or RAMP1-3 alter LPAR2 pharmacology or trafficking in native human cells, or are
    the reported contacts limited to interaction-screen conditions?
suggested_experiments:
- hypothesis: Native LPAR2 coupling weights vary by cell type and LPA molecular species, with distinct
    Gi/Go, Gq, and G12/13 contributions to cAMP, calcium, and Rho outputs.
  description: CRISPR-tag endogenous LPAR2 in epithelial and mesenchymal human models and use parallel
    conformational or BRET biosensors for Gi/o, Gq, G12/13, beta-arrestin, cAMP, IP3, calcium, and Rho.
    Resolve dose-response and time courses for defined LPA species with selective G-alpha knockout and
    rescue.
  experiment_type: endogenous multiplexed GPCR coupling analysis
- hypothesis: The terminal DSTL motif dynamically selects PDZ scaffolds that bias LPAR2 signaling and
    trafficking rather than forming one constitutive complex.
  description: Compare endogenous proximity labeling and quantitative coimmunoprecipitation for wild-type
    LPAR2 and a precise DSTL-disrupting knock-in before and after LPA. Perturb NHERF2, PLCB3, and MAGI3
    individually and measure coupling, local cAMP, PLC/calcium, ERK/Rho, internalization, and recycling.
  experiment_type: endogenous receptor-scaffold dynamics and genetic epistasis
- hypothesis: TRIP6 and GRK2 regulate separable LPAR2 states, whereas RalA association does not confer
    the LPAR1-specific Ral-dependent PLC mechanism on LPAR2.
  description: Use endogenous knockouts and interaction-defective rescue alleles for TRIP6, GRK2, and
    RalA in matched human cells. Measure receptor-proximal G-protein activation, PLC output, desensitization,
    endocytosis, focal-adhesion recruitment, and migration without extrapolating an LPAR1 result to LPAR2.
  experiment_type: paralog-aware receptor-regulator dissection
- hypothesis: A subset of the LGALS3 and RAMP1-3 screen contacts modulates LPAR2 only in cells with native
    coexpression.
  description: Select human cells with endogenous LPAR2 and candidate expression, verify membrane-proximal
    interactions by orthogonal assays, then perform knockout and add-back while measuring LPA binding,
    surface abundance, coupling bias, beta-arrestin recruitment, internalization, and desensitization.
  experiment_type: endogenous interaction validation and receptor pharmacology
