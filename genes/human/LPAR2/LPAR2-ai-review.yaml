  review:
    summary: Retain conditional adenylate-cyclase-activating signaling; inhibitory responses in other
      contexts do not refute this capacity.
    action: KEEP_AS_NON_CORE
    reason: Full PMID:10488122 Methods, Results and Fig.7 report LPA-dependent enhancement of forskolin-stimulated
      cAMP in human EDG4/LPAR2- and EDG7/LPAR3-expressing Sf9 cells with IBMX present. LPA alone did not
      produce this response. GO:0007189 requires activating cyclase signaling, not Gs coupling or a positive
      direction in every cell. The actual target descends from positive IBD PTN002733616, so a wrong-branch
      explanation is unsupported. PMID:10727522 contrasts mammalian-cell assays and proposes possible
      conditional cyclase/PKC mechanisms; PMID:16203867 directly establishes contextual LPAR2 Gi-mediated
      inhibition. Keep the activating capacity non-core while a shared focused adjudication examines construct
      sequence, assay mechanism and physiological scope. The early EDG4 C-terminal frameshift must be
      checked against individual constructs, not assumed for every experiment.
