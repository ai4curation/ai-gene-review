knowledge_gaps:
- gap_statement: >-
    The quantitative Gi/Go, Gq, and G12/13 coupling preferences of endogenous human
    LPAR2 remain unresolved across physiological cell types and LPA molecular
    species.
  boundary: >-
    Recombinant human studies directly resolve mixed Gi/Gq input to PLC-dependent
    calcium signaling and a Gi-dependent cAMP-inhibitory response. G12/13 coupling is
    supported by the reviewed UniProt synthesis and is consistent with Rho-sensitive
    outputs, but the audited sources do not provide matched quantitative coupling
    measurements for all three branches in native human cells.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    Coupling weights determine whether LPAR2 primarily changes cAMP, calcium, Rho
    signaling, or a combination in each physiological setting.
  resolution: >-
    Measure endogenous LPAR2 coupling with parallel Gi/o, Gq, G12/13,
    beta-arrestin, cAMP, IP3, calcium, and Rho biosensors across matched LPA dose,
    molecular-species, and time-course conditions.
- gap_statement: >-
    How the terminal DSTL motif partitions LPAR2 among NHERF2/PLCB3, MAGI3, and
    other PDZ scaffolds in native human tissues is unknown.
  boundary: >-
    Direct interaction and motif-mutagenesis studies establish NHERF2 and MAGI3 as
    LPAR2-selective partners, and NHERF2 can organize epithelial LPAR2-CFTR coupling.
    These experiments do not establish the occupancy, exchange kinetics, or
    universality of any one assembly at endogenous abundance.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    Dynamic scaffold selection may explain cell-specific PLCB3 efficiency,
    compartmentalized cAMP regulation, ERK/Rho output, and receptor trafficking
    without requiring a constitutive stable complex.
  resolution: >-
    Quantify endogenous motif-dependent interactions before and after LPA exposure,
    then test how partner-specific perturbation changes branch-resolved signaling,
    desensitization, internalization, and recycling.
  provenance:
  - reference_id: PMID:15143197
    supporting_text: >-
      This study found that LPA(2), but not the other LPA receptor isoforms, specifically interacts with Na(+)/H(+) exchanger regulatory factor2 (NHERF2). In addition, the interaction between them requires the C-terminal PDZ domain-binding motif of LPA(2) and the second PDZ domain of NHERF2.
  - reference_id: PMID:16904289
    supporting_text: >-
      MAGI-3 specifically bound to LPA(2), but not to LPA(1) and LPA(3). This interaction was mediated via the fifth PDZ domain of MAGI-3 interacting with the carboxyl-terminal 4 amino acids of LPA(2), and mutational alteration of the carboxyl-terminal sequences of LPA(2) severely attenuated its ability to bind MAGI-3.
- gap_statement: >-
    The endogenous regulatory roles of TRIP6, RalA, and GRK2 around LPAR2 are not
    fully separated from cell-model-specific signaling and trafficking effects.
  boundary: >-
    TRIP6 directly binds the LPAR2 tail and regulates migration in SKOV3 cells, and
    GRK2 is required for LPAR2 desensitization. RalA associates with LPAR2, but the
    accessible evidence assigns agonist-triggered RalA activation and Ral-dependent
    PLC activity to LPAR1, not LPAR2.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: >-
    Resolving these roles is necessary to distinguish direct LPAR2 regulatory
    mechanisms from paralog transfer and cancer-cell-specific downstream effects.
  resolution: >-
    Perturb TRIP6, RalA, and GRK2 individually at endogenous abundance in multiple
    human cell types while measuring LPAR2-proximal coupling, desensitization,
    internalization, recycling, focal-adhesion recruitment, and migration.
- gap_statement: >-
    The physiological consequences of screen-detected LPAR2 interactions with
    LGALS3 and RAMP1-3 are unknown.
  boundary: >-
    Proteome-scale AP-MS identifies LGALS3 and a systematic coexpression screen
    detects all three RAMPs, but the audited evidence does not establish native
    tissue interactions or LPAR2-specific changes in ligand affinity, surface
    delivery, coupling bias, or desensitization.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    Functional validation could reveal context-specific receptor modulators while
    preventing screen-level contacts from being mistaken for core components.
  resolution: >-
    Validate endogenous proximity and genetic dependence in human cells that
    naturally coexpress each candidate, followed by receptor pharmacology,
    trafficking, and branch-specific signaling assays.
