  review:
    summary: Retain the ortholog-supported photoreceptor outer segment pool.
    action: KEEP_AS_NON_CORE
    reason: The authenticated donor Q9Z309 is mouse Cib2; its current source is IDA/PMID:23023331. The
      actual study immunolocalizes endogenous CIB2 in mouse retinal outer segments, alongside other retinal
      compartments. Preserve this orthology-based location, without relabeling it as direct human microscopy.
      Later RPE-specific loss affects photoreceptor function, whereas rod-specific loss did not reproduce
      that phenotype; localization alone does not establish an autonomous photoreceptor maintenance mechanism.
