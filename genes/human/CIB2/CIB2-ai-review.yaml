  review:
    summary: Retain magnesium binding by the EF-hand protein.
    action: ACCEPT
    reason: The authentic original human CIB2 study explicitly reports purified-protein Mg binding. The
      later human CIB2–TMC1 domain structure assigns Mg to EF3 and EF4 under its crystallization conditions.
      This supports the molecular capability without assuming physiological saturation, a fixed metal
      preference in every compartment, or equivalent behavior of all four products. The curated PAINT
      assertion is corroborated by target evidence; historical ancestral placement was not reconstructed.
    supported_by:
    - reference_id: GO_REF:0000033
    - reference_id: PMID:22779914
    - reference_id: PMID:40000792
    - reference_id: file:human/CIB2/CIB2-source-evidence.json
