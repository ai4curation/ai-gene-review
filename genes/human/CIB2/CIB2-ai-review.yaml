id: O75838
gene_symbol: CIB2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CIB2 is a small intracellular EF-hand protein that binds calcium and magnesium and engages
  several protein partners. In sensory hair cells it associates with cytoplasmic regions of TMC channels
  and regulates the mechanotransduction apparatus at stereocilia. CIB2 also binds integrin cytoplasmic
  tails, and its C-terminal peptide recognizes PDZ domains. In a distinct signaling context, CIB2 associates
  with RHEB and Raptor and restrains mTORC1 signaling; loss in the retinal pigment epithelium impairs
  phagolysosomal processing and can secondarily compromise photoreceptor function. Calcium-dependent conformational
  changes influence partner interactions, while the precise connection between metal occupancy and channel
  gating remains unresolved. Alternative products differ in their N-terminal regions or C-terminal tail.
