core_functions:
- description: CIB2 binds intracellular regions of TMC channels and regulates the hair-cell mechanotransduction
    complex at stereocilia. Calcium and magnesium binding shape its conformation and partner interactions.
    Its auxiliary role includes control of channel localization and opening, with the exact coupling between
    metal occupancy and gating remaining unresolved.
  molecular_function:
    id: GO:0099106
    label: ion channel regulator activity
  locations:
  - id: GO:0032420
    label: stereocilium
  supported_by:
  - reference_id: PMID:34089643
    supporting_text: CIB2 regulates resting Po in TMC2-expressing OHCs
  - reference_id: PMID:40000792
  - reference_id: PMID:39773557
  - reference_id: PMID:28663585
- description: CIB2 binds the small GTPase RHEB and participates in Raptor-associated signaling complexes
    that restrain mTORC1 activity. This provides a molecular interaction context for its contribution
    to lysosomal and retinal pigment epithelial homeostasis; the precise nucleotide-regulatory mechanism
    remains unresolved.
  molecular_function:
    id: GO:0031267
    label: small GTPase binding
  locations:
  - id: GO:0005737
    label: cytoplasm
  supported_by:
  - reference_id: PMID:34162842
- description: CIB2 binds calcium and magnesium through its EF-hand region, with metal-dependent changes
    in conformation and partner binding. Purified human protein supports both ligand classes, and human
    CIB2–TMC1 assays resolve magnesium occupancy and calcium-sensitive interactions. CIB2 also attenuates
    ATP-evoked cytosolic calcium responses in transfected cells; buffering versus effects on calcium-release
    machinery remains unresolved.
  molecular_function:
    id: GO:0046872
    label: metal ion binding
  directly_involved_in:
  - id: GO:0055074
    label: calcium ion homeostasis
  supported_by:
  - reference_id: PMID:22779914
  - reference_id: PMID:40000792
  - reference_id: PMID:23023331
  - reference_id: PMID:26173970
suggested_questions:
- question: How do CIB2 metal occupancy and its two TMC-contact surfaces control opening of native human
    TMC1-containing channels, independently of changes in channel localization?
- question: Does CIB2 directly alter RHEB nucleotide exchange or hydrolysis, or does its effect on mTORC1
    require Raptor or another partner?
- question: Which full-length CIB2 products bind PDZ proteins in native tissues, and does the alternative
    O75838-2 tail redirect these interactions?
- question: What conditions permit CIB2 self-association, and can native complexes distinguish direct
    oligomerization from association through TMC or other partners?
- question: Can the original plasma-microvesicle target peptide table be recovered to resolve the source-specific
    CIB2 blood-microparticle annotation?
- question: 'Which hearing-process granularity best captures CIB2’s performed auxiliary channel work:
    regulation of mechanotransduction, broader sensory perception of sound, or GO:0050910 detection of
    mechanical stimulus involved in sensory perception of sound? Current same-role auxiliary comparators
    and target annotations do not settle that convention.'
suggested_experiments:
- description: Compare matched human TMC1 channel complexes containing wild-type or interface-selective
    CIB2 variants, measuring membrane abundance and mechanically evoked currents separately while controlling
    intracellular calcium and magnesium.
- description: Reconstitute purified human CIB2, RHEB and defined Raptor–mTORC1 complexes, independently
    measuring nucleotide exchange, hydrolysis, binding and substrate phosphorylation to distinguish binding
    from catalytic regulation.
- description: Test all authenticated CIB2 products with matched expression and metal conditions against
    selected PDZ domains, then verify the strongest full-length associations in cells with endogenous
    interaction assays.
