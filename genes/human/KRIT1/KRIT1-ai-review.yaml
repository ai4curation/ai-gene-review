- term:
    id: GO:0005576
    label: extracellular region
  evidence_type: HDA
  original_reference_id: PMID:22664934
  qualifier: located_in
  review:
    summary: Detection in a tear-fluid proteomics survey; not a physiological location of KRIT1.
    action: MARK_AS_OVER_ANNOTATED
    reason: The row comes from a high-throughput tear-fluid proteomics comparison; KRIT1 is not mentioned
      in the cached full text, so it is presumably in a supplementary list. KRIT1 has no signal peptide
      or transmembrane segment and every targeted study places it on microtubules, at the plasma membrane
      and at cell-cell junctions. Detection in tears most plausibly reflects shed epithelial cells or
      debris. The curated detection is not disputed, but extracellular region overstates KRIT1 biology.
    supported_by:
    - &id005
      reference_id: file:human/KRIT1/KRIT1-uniprot.txt
      supporting_text: Association with RAP1 relocalizes KRIT1 from microtubules to cell junction membranes.
