- term:
    id: GO:0033622
    label: integrin activation
  evidence_type: IDA
  original_reference_id: PMID:23317506
  qualifier: involved_in
  review:
    summary: KRIT1 releases ICAP1-mediated suppression of beta1 integrin activation.
    action: MODIFY
    reason: KRIT1 does not itself activate integrins; it binds ICAP1 through a bidentate surface, competes
      with the beta1 integrin tail for ICAP1, and so antagonizes ICAP1 inhibition of inside-out activation.
      That is a positive regulatory role, better captured by positive regulation of integrin activation.
