  review:
    summary: KRIT1 is a Rap1-specific effector in small GTPase signaling.
    action: ACCEPT
    reason: The original two-hybrid paper (abstract only) proposed a Krev-1/Rap1A link with a truncated
      clone; a later study failed to see the interaction with full-length KRIT1 (PMID:11741838), but GTP-dependent
      binding to the Rap1 effector loop was subsequently established biochemically, structurally and by
      mutagenesis. KRIT1 executes a step of Rap1 signaling as its effector, so the process term is accepted
      as core.
