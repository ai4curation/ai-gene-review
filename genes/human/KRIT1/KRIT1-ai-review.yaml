- term:
    id: GO:0030695
    label: GTPase regulator activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: enables
  supporting_entities:
  - ARBA:ARBA00026642
  review:
    summary: Direct Rap1 binding is established; intrinsic GTPase regulation is not the demonstrated mechanism.
    action: MODIFY
    reason: The early two-hybrid paper suggested KRIT1 might regulate Krev-1, but later direct binding
      and mutagenesis establish a GTP-dependent Rap1 effector. These experiments do not show nucleotide
      exchange or GTPase activation. Use small GTPase binding to express the demonstrated molecular interaction.
