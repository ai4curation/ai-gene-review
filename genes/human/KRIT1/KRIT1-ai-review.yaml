      II and KRIT1 FERM F1 and F2 lobes.
- description: 'Junctional adaptor of the CCM complex: the KRIT1 FERM domain binds the HEG1 cytoplasmic
    tail while its NPX(Y/F) motifs bind the CCM2 PTB domain, linking the KRIT1-CCM2-PDCD10 complex to
    endothelial junctions and restraining RhoA/Rho kinase signaling.'
