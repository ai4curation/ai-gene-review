id: O00522
gene_symbol: KRIT1
product_type: PROTEIN
status: IN_PROGRESS
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: KRIT1/CCM1 is a multidomain scaffold and Rap1 effector that organizes endothelial cell junctions
  and vascular signaling. Its N-terminal interaction motifs, ankyrin repeats and C-terminal FERM domain
  couple CCM-complex partners, integrin regulation, microtubule association and membrane recruitment.
  It supports vascular barrier integrity and endothelial polarity and restrains excessive angiogenic signaling.
  Human loss-of-function variants cause cerebral cavernous malformations.
