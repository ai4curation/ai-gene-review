- term:
    id: GO:0001937
    label: negative regulation of endothelial cell proliferation
  evidence_type: IMP
  original_reference_id: PMID:20616044
  qualifier: involved_in
  review:
    summary: CCM1 depletion increases human endothelial proliferation.
    action: KEEP_AS_NON_CORE
    reason: Primary human endothelial cells depleted of CCM1 show increased proliferation, migration,
      apoptosis, lumen formation and sprouting (PMID:20616044). These quiescence-maintaining effects are
      real and consistent with the IBA/IMP rows for negative regulation of angiogenesis, but they are
      downstream outputs of the junctional Rap1-effector and adaptor activities (via DLL4-NOTCH and MEKK3
      restraint), so they are kept as non-core.
    supported_by:
    - &id001
      reference_id: PMID:20616044
      supporting_text: CCM1 inhibits endothelial proliferation, apoptosis, migration, lumen formation,
        and sprouting angiogenesis in primary human endothelial cells.
- term:
    id: GO:0003158
    label: endothelium development
  evidence_type: NAS
  original_reference_id: PMID:17657516
  qualifier: involved_in
  review:
    summary: Endothelium development is a downstream developmental context of KRIT1 function.
    action: KEEP_AS_NON_CORE
    reason: This NAS row comes from a paper on CCM3-CCM2 binding that discusses the CCM genes in general.
      Independent evidence shows KRIT1-Rap1 binding is required for cardiovascular development and that
      KRIT1 maintains endothelial quiescence and junctions. Endothelium development is therefore a compatible
      but downstream organismal process for a junctional adaptor and is kept as non-core.
    supported_by:
    - reference_id: PMID:21633110
      supporting_text: Direct binding of KRIT1 to Rap1 stabilized endothelial cell-cell junctions in vitro
        and was required for cardiovascular development in vivo.
