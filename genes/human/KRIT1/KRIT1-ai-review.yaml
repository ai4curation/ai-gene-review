id: O00522
gene_symbol: KRIT1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: KRIT1 (CCM1) is a non-enzymatic adaptor of endothelial cells built from an N-terminal pseudo-Nudix
  domain, three NPX(Y/F) motifs, four ankyrin repeats and a C-terminal FERM domain. In its closed form
  the first NPAY motif binds the FERM domain; ICAP1 (ITGB1BP1) binding to that motif opens the protein,
  and KRIT1 competes with the beta1 integrin tail for ICAP1, relieving ICAP1 suppression of integrin activation.
  KRIT1 binds microtubules, and GTP-loaded Rap1 binding to the FERM F1/F2 lobes releases it from microtubules
  to PI(4,5)P2-containing plasma membrane at cell-cell junctions. There the FERM domain binds the cytoplasmic
  tail of the transmembrane protein HEG1, and the third NPX(Y/F) motif binds the PTB domain of CCM2, anchoring
  the KRIT1-CCM2-PDCD10 complex at VE-cadherin-based adherens junctions. Junctional KRIT1 stabilizes cell-cell
  contacts, suppresses RhoA/Rho kinase signaling and, through CCM2, restrains MEKK3-KLF2/4 signaling,
  keeping the endothelium quiescent and polarized; it also influences FOXO1/SOD2-dependent ROS homeostasis.
  Loss-of-function variants cause autosomal dominant cerebral cavernous malformations type 1.
