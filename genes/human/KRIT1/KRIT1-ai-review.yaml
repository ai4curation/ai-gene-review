- term:
    id: GO:0009948
    label: anterior/posterior axis specification
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN002665063
  - ZFIN:ZDB-GENE-030131-555
  review:
    summary: The anterior/posterior-axis IBA requires direct assessment of the ancestral developmental
      evidence.
    action: UNDECIDED
    reason: Vascular morphogenesis and polarity evidence do not by themselves establish anterior/posterior
      axis specification. The PAINT assertion is a curated phylogenetic judgment and is not rejected,
      but the pertinent developmental evidence has not been resolved in this review.
