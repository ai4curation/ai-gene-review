existing_annotations:
- term:
    id: GO:0001937
    label: negative regulation of endothelial cell proliferation
  evidence_type: IMP
  original_reference_id: PMID:20616044
  qualifier: involved_in
  review:
    summary: Human endothelial perturbation supports this antiangiogenic/developmental regulatory effect.
    action: KEEP_AS_NON_CORE
    reason: CCM1 perturbation directly changes endothelial proliferation, migration, apoptosis and sprouting
      in primary human endothelial cells. These are documented consequences of the junctional signaling
      regulator. Broad developmental-process annotations are retained as non-core; they do not identify
      a distinct enzyme function or germline piRNA mechanism.
    supported_by:
    - reference_id: PMID:20616044
      supporting_text: 'CCM1 inhibits

        endothelial proliferation, apoptosis, migration, lumen formation, and sprouting

        angiogenesis in primary human endothelial cells.'
- term:
    id: GO:0003158
    label: endothelium development
  evidence_type: NAS
  original_reference_id: PMID:17657516
  qualifier: involved_in
  review:
    summary: Vascular developmental regulation is supported by the CCM1 scaffold mechanism.
    action: KEEP_AS_NON_CORE
    reason: KRIT1 regulates endothelial organization and quiescence, with experimental vascular-development
      phenotypes. The generic developmental/regulatory term is compatible but less informative than the
      endothelial-junction and angiogenesis mechanisms.
    supported_by:
    - reference_id: PMID:20616044
      supporting_text: 'CCM1 inhibits

        endothelial proliferation, apoptosis, migration, lumen formation, and sprouting

        angiogenesis in primary human endothelial cells.'
