- term:
    id: GO:0009948
    label: anterior/posterior axis specification
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN002665063
  - ZFIN:ZDB-GENE-030131-555
  review:
    summary: Anterior/posterior axis specification is not a KRIT1 process; the propagation rests on a
      knockdown body-axis phenotype.
    action: REMOVE
    reason: The only seed for this PTN002665063 assertion is a ZFIN acts_upstream_of_or_within IGI annotation
      to zebrafish krit1 from PMID:26540726, where combined knockdown of ccm2l and ccm2 caused cardiac
      and circulation defects with secondary 'body axis abnormalities' that MEKK3 silencing rescued. That
      is a downstream organismal phenotype of vascular/cardiac CCM-MEKK3 dysregulation, not patterning
      of the A/P axis, and the upstream relationship is lost when the IBA is emitted as involved_in. No
      mammalian KRIT1 study implicates axis specification. The term is removed on biological grounds.
    supported_by:
    - reference_id: PMID:26540726
      supporting_text: A knockdown of ccm2l and ccm2 in zebrafish leads to a more severe "big heart" and
        circulation defects compared with loss of function of ccm2 alone, and also leads to substantial
        body axis abnormalities.
