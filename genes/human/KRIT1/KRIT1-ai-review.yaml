- term:
    id: GO:0005576
    label: extracellular region
  evidence_type: HDA
  original_reference_id: PMID:22664934
  qualifier: located_in
  review:
    summary: Retain extracellular proteomics detection as a non-core observation.
    action: KEEP_AS_NON_CORE
    reason: The HDA source records detection outside cells. KRIT1 is principally an intracellular scaffold;
      this observation alone does not establish a secreted physiological function. Detection is retained
      without inferring a secretion mechanism.
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: located_in
  supporting_entities:
  - UniProtKB:Q6S5J6
  - ensembl:ENSMUSP00000078985
  review:
    summary: Membrane/junctional and cytoplasmic pools are supported by KRIT1 recruitment experiments.
    action: ACCEPT
    reason: Rap1-dependent release from microtubules permits junctional recruitment, while CCM1 participates
      in the VE-cadherin polarity complex. The selected horse sequence retains the corresponding scaffold
      architecture and extensive sequence conservation, supporting transfer of these broad compartments.
    supported_by:
    - reference_id: PMID:20332120
      supporting_text: Both VEC and CCM1 control Rap1 concentration at cell-cell junctions.
    - reference_id: PMID:21633110
      supporting_text: Rap1 binding released KRIT1 from microtubules
- term:
    id: GO:0005856
    label: cytoskeleton
