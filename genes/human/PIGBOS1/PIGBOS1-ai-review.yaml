- term:
    id: GO:1900101
    label: regulation of endoplasmic reticulum unfolded protein response
  evidence_type: IMP
  original_reference_id: PMID:31653868
  qualifier: involved_in
  review:
    summary: >-
      siRNA knockdown or CRISPR knockout of PIGBOS1 heightens the response to tunicamycin,
      thapsigargin and brefeldin A (XBP1 splicing, ATF6 reporter, UPR target genes, ATF4 and
      CHOP protein); siRNA-resistant PIGBOS1 rescues, and overexpression dampens the UPR.
      Mitochondrial UPR is unaffected.
    action: MODIFY
    reason: >-
      The annotation is sound and captures the core biological role of PIGBOS1, but the
      evidence is directional in both senses - loss increases and gain decreases UPR
      output, with rescue - so the more specific child term GO:1900102 negative regulation
      of endoplasmic reticulum unfolded protein response is supported. PIGBOS1 participates
      as a regulator (its CLCC1-binding region is required for rescue), not merely as a
      necessary bystander.
    proposed_replacement_terms:
    - id: GO:1900102
      label: negative regulation of endoplasmic reticulum unfolded protein response
    supported_by:
    - reference_id: PMID:31653868
      supporting_text: Overexpression of PIGBOS in WT cells resulted in the desensitization
        of cells to UPR with decreased XBP1 splicing
    - reference_id: PMID:31653868
      supporting_text: Upon UPR induction with TM, the loss of PIGBOS led to dramatic
        increases in the levels of all UPR target genes measured, indicating increased UPR
        signaling across all the branches (IRE1, PERK, and ATF6)
    - reference_id: PMID:31653868
      supporting_text: Only full-length PIGBOS microprotein reversed the XBP1 splicing
        phenotype
core_functions:
- description: >-
    PIGBOS1 is a mitochondrial outer membrane microprotein whose cytosolic C-terminal region
    binds the ER chloride channel CLCC1 near ER-mitochondria contacts. Through this
    interaction it dampens the ER unfolded protein response: loss of PIGBOS1 heightens
    signalling through all three UPR branches and increases ER stress-induced apoptosis,
    overexpression lowers it, and only CLCC1-binding-competent PIGBOS1 rescues. It does not
    act as an ER-mitochondria tether.
