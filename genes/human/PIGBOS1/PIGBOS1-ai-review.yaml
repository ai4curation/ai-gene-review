description: >-
  PIGBOS1 (PIGB opposite strand 1, PIGBOS) is a 54-amino-acid microprotein encoded by a
  small open reading frame on the strand opposite the GPI-anchor biosynthesis gene PIGB.
  It is widely expressed and has no paralogs. PIGBOS1 is a signal-anchored, single-pass
  protein of the mitochondrial outer membrane: a short N-terminal segment faces the
  intermembrane space, a single transmembrane helix anchors it, and a C-terminal region of
  about 25 residues faces the cytosol. Through this cytosolic region (residues 30-36 are
  critical) it binds CLCC1, an endoplasmic reticulum chloride channel, and the interaction
  is concentrated where the ER lies close to mitochondria. PIGBOS1 does not tether the two
  organelles; loss of the protein leaves ER-mitochondria contacts unchanged. Its best-supported
  role is to dampen the ER unfolded protein response: cells lacking PIGBOS1 respond to ER
  stressors with stronger XBP1 splicing, ATF6 activity and UPR target-gene induction and
  undergo more ER stress-induced apoptosis, overexpression has the opposite effect, and
  rescue depends on the CLCC1-binding region. PIGBOS1 self-associates. A more recent study
  reports that the PIGBOS1-CLCC1 interaction also promotes ER calcium release, ER-to-mitochondria
  calcium transfer, store-operated calcium entry and mitochondrial respiration.
