suggested_questions:
- question: >-
    Is PIGBOS1 a regulator of CLCC1 channel activity? CLCC1 has chloride channel activity
    and a CLCC1-binding-dependent effect of PIGBOS1 on ER calcium release, ER-to-mitochondria
    calcium transfer and store-operated calcium entry has been reported (PMID:42351194), but
    whether PIGBOS1 changes CLCC1 conductance directly has not been measured. A positive
    answer would justify a channel regulator activity term in place of transporter binding.
- question: >-
    Should PIGBOS1 be annotated to GO:0044233 mitochondria-associated ER membrane contact
    site? The PIGBOS1-CLCC1 split-GFP signal lies between ER and outer membrane markers, and
    GOA gives CLCC1 this term from the same paper, but PIGBOS1 is not a tether and only a
    fraction of it is bound to CLCC1; outer-membrane contact-site partners such as RMDN3
    and MFN2 do not carry the term either.
- question: >-
    How does an outer membrane signal-anchor protein with about four intermembrane-space
    residues copurify HIGD2A and complex III/IV subunits in digitonin-solubilized
    mitochondria (PMID:34800366)? Is this a post-lysis association or evidence of a second
    pool?
suggested_experiments:
- description: >-
    Electrophysiology of reconstituted CLCC1 (planar bilayer or ER-targeted patch) with and
    without PIGBOS1 or its 30-36 alanine mutant, to test whether PIGBOS1 directly modulates
    CLCC1 conductance.
- description: >-
    Endogenous-level proximity labelling or super-resolution imaging of PIGBOS1 to measure
    what fraction resides at ER-mitochondria contacts, and whether the fraction changes
    under ER stress.
