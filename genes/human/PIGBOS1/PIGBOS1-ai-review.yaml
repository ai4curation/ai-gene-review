  review:
    summary: >-
      Interaction with CLCC1 (UniProtKB:Q96S66), shown by IP-MS with SAINT/CRAPome
      filtering, APEX proximity labelling, reciprocal co-immunoprecipitation and split-GFP
      complementation, and mapped to PIGBOS1 residues 30-36. GOA carries this row twice
      (UniProt and IntAct); both are covered here.
    action: MODIFY
    reason: >-
      The interaction is very well supported, but bare protein binding says nothing about
      it. CLCC1 is an ER chloride channel (it carries GO:0005254 chloride channel activity
      by IDA in GOA), so GO:0044325 transmembrane transporter binding states what was
      shown. The interaction is also functionally necessary: CLCC1-binding-deficient mutants
      fail to rescue the UPR phenotype of PIGBOS1-depleted cells.
