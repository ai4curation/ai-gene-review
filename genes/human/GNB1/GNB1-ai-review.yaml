core_functions:
- description: Structural beta subunit of heterotrimeric G proteins. The WD40 propeller binds Ggamma (obligate
    dimer) and GDP-bound Galpha, and contacts the activated receptor. This scaffolds the receptor-G protein
    complex and enables receptor-catalysed nucleotide exchange on Galpha in GPCR signaling.
  molecular_function:
    id: GO:0030159
    label: signaling receptor complex adaptor activity
  directly_involved_in:
  - *id012
  locations:
  - *id017
  in_complex:
    id: GO:0005834
    label: heterotrimeric G-protein complex
  supported_by:
  - *id001
  - *id005
  - *id006
  - *id009
  - *id010
- description: Free Gbeta1gamma, released after receptor activation, directly binds and opens G protein-gated
    inwardly rectifying K+ (GIRK/Kir3) channels at the plasma membrane, mediating inhibitory GPCR control
    of cardiac and neuronal excitability.
  molecular_function:
    id: GO:0099104
    label: potassium channel activator activity
  directly_involved_in:
  - *id012
  locations:
  - *id017
  supported_by:
  - *id018
  - *id011
- description: Free Gbeta1gamma directly stimulates phospholipase C-beta isozymes, increasing PIP2 hydrolysis
    downstream of GPCR activation.
  molecular_function:
    id: GO:0016004
    label: phospholipase activator activity
  directly_involved_in:
  - *id012
  locations:
  - *id017
  supported_by:
  - *id013
suggested_questions:
- question: Does Gbeta1 actively hold the open Galpha alpha-helical domain during receptor-catalysed nucleotide
    exchange? The smFRET study of muOR-Gi suggests the open AHD is affixed against Gbeta, and rhodopsin-transducin
    structures show the AHD contacting Gbetagamma. If so, is a GO MF term needed for this role beyond
    'G-protein alpha-subunit binding'?
- question: Do MRD42 GNB1 variants act mainly by weakening the Galpha interface (giving constitutive Gbetagamma
    signaling) or by impairing effector binding, and does this differ by residue?
- question: Is 'signaling receptor complex adaptor activity' the best GO MF representation of Gbeta's
    scaffolding role in the heterotrimer, or would 'G-protein alpha-subunit binding' plus 'G-protein gamma-subunit
    binding' be more accurate?
suggested_experiments:
- hypothesis: Gbeta1 surface residues that contact the open Galphai alpha-helical domain stabilise the
    open AHD state and speed GDP release.
  description: Mutate the predicted AHD-contacting residues on Gbeta1. In reconstituted muOR-Gi with labelled
    Galphai AHD, measure smFRET dwell times in the open state and GTPgammaS binding kinetics, comparing
    wild type and mutant Gbeta1gamma2.
  experiment_type: single-molecule FRET
- hypothesis: MRD42-associated GNB1 variants differentially affect Galpha binding versus GIRK/PLC-beta
    activation.
  description: Express patient GNB1 variants with Ggamma2 and measure Galphai binding (BRET), basal and
    agonist-evoked GIRK currents, and PLC-beta activation in heterologous cells and iPSC-derived neurons.
  experiment_type: electrophysiology and BRET
