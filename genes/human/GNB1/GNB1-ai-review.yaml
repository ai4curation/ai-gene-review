- term:
    id: GO:0003924
    label: GTPase activity
  evidence_type: IDA
  original_reference_id: PMID:1543505
  qualifier: enables
  review:
    summary: GTPase activity attributed to Gbeta1.
    action: REMOVE
    reason: Gbeta is a seven-bladed WD40 beta-propeller with no nucleotide-binding domain. GDP/GTP exchange
      and GTP hydrolysis take place on the Galpha subunit of the heterotrimer. Gbetagamma is needed for
      receptor coupling of Galpha but does not catalyse GTP hydrolysis. The cited papers are cDNA cloning
      studies (PMID:3095147, human Gbeta; PMID:1543505, mouse Gbeta4) and their abstracts report no GTPase
      assay on Gbeta. The activity of the heterotrimer is captured on GNB1 by its complex membership (GO:0005834)
      and its G-protein alpha-subunit binding.
    supported_by:
    - &id001
      reference_id: PMID:8521505
      supporting_text: Repeated WD motifs in beta form a circularized sevenfold beta propeller.
    - &id002
      reference_id: PMID:31300275
      supporting_text: activates the G-protein transducin (GT) by catalyzing GDP-GTP exchange on its α
        subunit (GαT)
    - &id003
      reference_id: PMID:1543505
      supporting_text: The beta and gamma subunits are thought to have a more passive role in G protein
        function
