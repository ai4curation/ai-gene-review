id: P62873
gene_symbol: GNB1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: GNB1 encodes guanine nucleotide-binding protein subunit beta-1 (Gbeta1), a seven-bladed WD40
  beta-propeller that forms an obligate dimer with a Ggamma subunit and, with a Galpha subunit, makes
  up the heterotrimeric G proteins that transduce signals from G protein-coupled receptors (GPCRs). Gbeta1
  is the most widely used Gbeta, found in Gi/o, Gs, Gq/11 and rod transducin heterotrimers. Within the
  heterotrimer it binds the switch II region of GDP-bound Galpha and contacts the receptor, which promotes
  receptor-catalysed GDP/GTP exchange on Galpha; Gbeta itself has no nucleotide-binding or GTPase activity.
  After activation, the released, membrane-anchored (Ggamma-prenylated) Gbeta1gamma dimer directly regulates
  effectors, including opening G protein-gated inwardly rectifying K+ (GIRK) channels and stimulating
  phospholipase C-beta. Germline de novo GNB1 missense variants that disrupt the Galpha or effector interfaces
  cause a neurodevelopmental disorder with hypotonia and seizures (MRD42), and recurrent somatic mutations
  occur in myeloid and lymphoid neoplasms.
