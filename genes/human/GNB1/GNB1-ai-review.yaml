id: P62873
gene_symbol: GNB1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: GNB1 encodes G protein subunit beta-1, a seven-bladed WD40 beta-propeller that forms an obligate
  heterodimer with a prenylated G-gamma subunit and, with a G-alpha subunit, the heterotrimeric G protein.
  Anchored to the cytoplasmic face of the plasma membrane through the geranylgeranyl or farnesyl group
  of its G-gamma partner, the G-beta-gamma dimer presents GDP-bound G-alpha to activated G protein-coupled
  receptors and is required for receptor-catalysed nucleotide exchange. After activation the released
  G-beta-gamma dimer itself signals by directly engaging effectors, including GIRK potassium channels,
  phospholipase C-beta isoforms, adenylyl cyclase isoforms, Ras-GRF and PI3K-gamma. GNB1 is the beta subunit
  of rod transducin in phototransduction and is broadly expressed; de novo heterozygous GNB1 variants
  cause a neurodevelopmental disorder.
