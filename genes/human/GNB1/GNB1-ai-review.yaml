    label: cytosol
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-1013012
  qualifier: located_in
  review:
    summary: Reactome places the Gbetagamma dimer in the cytosol compartment for this reaction.
    action: KEEP_AS_NON_CORE
    reason: Gbetagamma acts on the cytoplasmic side of membranes. The prenylated Gbetagamma dimer is anchored
      to the inner face of the plasma membrane, so 'cytosol' is only approximately right for the active
      dimer. Newly made Gbeta is folded and assembled with Ggamma in the cytosol, so the location is not
      wrong. Plasma membrane / heterotrimeric G-protein complex are the core locations.
    supported_by:
    - *id008
