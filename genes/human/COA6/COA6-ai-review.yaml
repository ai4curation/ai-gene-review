  evidence_type: HDA
  original_reference_id: PMID:22658674
  qualifier: enables
  review:
    summary: Retain the measured RNA-contact result as a non-core capability.
    action: KEEP_AS_NON_CORE
    reason: 'The authentic supplementary row places C1orf31/COA6 in the mRNA-interactome set: detected
      in crosslinked and control samples, p.adj.DESeq=1 and p.adj.IC=0.00267341282992018. These are
