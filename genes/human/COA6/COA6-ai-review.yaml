core_functions:
- description: COA6 reduces disulfides in copper-site assembly clients in the mitochondrial intermembrane
    space, enabling MT-CO2 CuA maturation and complex-IV biogenesis. Purified human protein reduces
    SCO1, SCO2 and COX2; cellular redox effects are demonstrated for SCO proteins with model-dependent
    substrate responses. Copper binding is experimentally supported, but autonomous copper delivery
    is not established.
  molecular_function:
    id: GO:0015035
    label: protein-disulfide reductase activity
  directly_involved_in:
  - *id002
  locations:
  - *id001
  supported_by:
