  - reference_id: PMID:32061935
  - reference_id: PMID:25959673
proposed_new_terms: []
suggested_questions:
- question: Under which cellular conditions, if any, does human COA6 carry copper directly rather
    than support CuA maturation through disulfide reduction?
- question: What supplies reducing equivalents to COA6, and why does SCO2 oxidation differ between
    COA6 patient fibroblasts and complete HEK293T knockout models?
- question: How do the three preserved COA6 products differ in mitochondrial import, abundance and
    activity, given that many structural assays use the 47–125 isoform-3 sequence?
- question: Do the RNA-contact signal and HuRI partner associations have reproducible native cellular
    consequences beyond the observed capture and binary assays?
suggested_experiments:
- description: Compare import-competent COA6 variants that selectively alter Cu(I) binding or redox
    turnover, measuring localization, folding, client cysteine redox state, COX2 maturation and complex-IV
    rescue in parallel. Avoid interpreting a mislocalized cysteine mutant as a selective copper-binding
    defect.
- description: Measure substrate-specific redox kinetics for SCO1, SCO2 and COX2 using purified COA6,
    then compare matched complete-knockout and patient-allele human cell systems with equivalent expression
    and mitochondrial targeting.
