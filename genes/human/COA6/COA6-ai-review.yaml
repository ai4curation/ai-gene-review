    label: copper ion binding
  evidence_type: IDA
  original_reference_id: PMID:26160915
  qualifier: enables
  review:
    summary: Retain demonstrated copper-binding capacity while leaving its physiological delivery
      role unresolved.
    action: KEEP_AS_NON_CORE
    reason: The original positive abstract reports copper binding. The later human isoform-3 experiments
      measure 1:1 Cu(I) binding after deliberate CuSO4 loading with reduced glutathione and test competition
      under reducing conditions, with cysteine-mutant controls. PMID:31851937 finds no endogenous
      copper in purified E. coli-expressed COA6 and no COA6-associated copper peak in yeast mitochondria,
      but observes binding after CuSO4/glutathione reconstitution and questions its physiological
      relevance. Retain measured capacity as non-core, not an established autonomous copper-delivery
      role. The cellular C58S/C90S rescue defect is additionally confounded by cytosolic mislocalization.
    supported_by:
    - reference_id: PMID:26160915
    - reference_id: PMID:31515291
      supporting_text: a Cu:protein stoichiometry of 1:1
    - reference_id: PMID:31851937
