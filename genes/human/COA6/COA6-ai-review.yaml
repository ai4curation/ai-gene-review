id: Q5JTJ3
gene_symbol: COA6
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: COA6 is a small CHCH-fold protein in the mitochondrial intermembrane space that supports
  maturation of the copper-containing MT-CO2 subunit and assembly of cytochrome c oxidase. Its disulfide-reductase
  activity maintains copper-site assembly proteins, including SCO1 and SCO2, in suitable redox states.
  COA6 associates with these proteins, nascent MT-CO2 and the COX20 chaperone during assembly. Copper-binding
  capacity has been demonstrated, while its physiological contribution to copper carriage remains
  unresolved. Biallelic pathogenic variants cause mitochondrial complex IV deficiency, nuclear type
  13 (MC4DN13), often with severe infantile cardiomyopathy.
