id: Q99677
gene_symbol: LPAR4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  LPAR4 is a class-A seven-transmembrane G protein-coupled receptor that binds
  extracellular lysophosphatidic acid at the plasma membrane. Direct binding and
  reporter assays with human P2Y9/GPR23 establish preferential recognition of LPA
  molecular species in the order 1-oleoyl, 1-stearoyl, 1-palmitoyl, 1-myristoyl,
  1-alkyl, and 1-alkenyl LPA; historical P2Y-like names do not indicate nucleotide
  receptor activity, because tested nucleotides and nucleosides did not activate the
  receptor. Recombinant human LPAR4 raises cytosolic calcium and stimulates
  adenylyl cyclase in CHO cells, whereas rat B103 transfectants show Gq/11-dependent
  calcium and G12/13-Rho signaling without an adenylyl-cyclase response. These
  heterologous results establish receptor capability but not fixed coupling weights
  or a universal cyclic-nucleotide output in native human tissues. LPAR4-dependent
  motility is likewise context opposing: ectopic expression suppresses migration
  and invasion in some human cancer cells, while fibrosarcoma models use an
  LPAR4-cAMP-EPAC-Rac1 route to promote invadopodia and metastasis. Human LPAR4 mRNA
  is reported as particularly abundant in ovary, and the reviewed record reports no
  detection in several surveyed brain regions. Mouse Lpar4-null fibroblast motility,
  pluripotent-stem-cell cardiac differentiation, and mouse infarct-repair phenotypes
  are bounded developmental or experimental outputs rather than separate core human
  receptor activities. RAMP1-3 contacts come from an ectopic multiplexed screen and
  do not establish an endogenous stable LPAR4 complex or functional modulation. No
  reviewed protein isoforms, receptor-specific trafficking mechanism, or
  experimentally determined LPAR4 structure are established; recorded sequence
  conflicts are not functional isoforms or alleles.
