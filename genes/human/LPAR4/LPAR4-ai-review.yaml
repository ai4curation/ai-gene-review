core_functions:
- description: >-
    Acts at the plasma membrane as an LPA-activated GPCR. Recombinant human LPAR4
    directly produces cytosolic calcium elevation, adenylyl-cyclase modulation, and
    a G12/13-Rho signaling branch. Gq/11-dependent calcium and G12/13-Rho responses
    are demonstrated in B103 transfectants; adenylyl-cyclase stimulation is observed
    in CHO cells but absent in the B103 system. These results establish a broad
    proximal coupling repertoire while leaving native human coupling weights and
    cyclic-nucleotide direction unresolved. Context-opposing migration, invasion,
    developmental, and repair phenotypes are downstream outputs rather than
    additional core molecular activities.
  molecular_function:
    id: GO:0070915
    label: lysophosphatidic acid receptor activity
  directly_involved_in:
