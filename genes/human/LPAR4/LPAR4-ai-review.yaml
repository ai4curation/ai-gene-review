  - reference_id: PMID:17172642
    supporting_text: In B103 cells stably expressing LPA(4), we observed G(q/11)-dependent calcium mobilization, but LPA did not affect adenylyl cyclase activity.
  - reference_id: PMID:17172642
    supporting_text: Thus, our results demonstrated that LPA(4) as well as LPA(1) couple to G(q/11) and G(12/13), whereas LPA(4) differs from LPA(1) in that it does not couple to G(i/o).
- description: >-
    Directly binds lysophosphatidic acid as the extracellular ligand-recognition
    step of LPAR4 signaling. Recombinant membrane binding establishes nanomolar
    1-oleoyl-LPA binding and a defined potency order among acyl and ether LPA
    species. This specific activity does not imply nucleotide receptor activity or
    indiscriminate binding to unrelated lipid classes.
