  - reference_id: PMID:12724320
    supporting_text: Competition binding and reporter gene assays showed that p2y9/GPR23 preferred structural analogs of LPA with a rank order of 1-oleoyl- > 1-stearoyl- > 1-palmitoyl- > 1-myristoyl- > 1-alkyl- > 1-alkenyl-LPA.
knowledge_gaps:
- gap_statement: >-
    The quantitative Gq/11, G12/13, Gs, Gi/o, and beta-arrestin coupling profile of
    endogenous human LPAR4 is unresolved across native cell types.
  boundary: >-
    Human LPAR4 constructs stimulate calcium and adenylyl cyclase in CHO cells,
    whereas B103 transfectants show Gq/11 calcium and G12/13-Rho responses without
    an adenylyl-cyclase effect and are interpreted as lacking Gi/o coupling. These
    heterologous results establish capability and context dependence, not a fixed
    native-human coupling hierarchy or universal Gi/o exclusion.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    Coupling weights determine whether LPAR4 changes calcium, cAMP, Rho, or arrestin
    signaling and may explain opposing phenotypes across tissues.
  resolution: >-
    Measure endogenous LPAR4 with parallel Gq/11, G12/13, Gs, Gi/o,
    beta-arrestin, calcium, cAMP, and Rho biosensors across matched LPA dose and
    time-course conditions in relevant human cells.
- gap_statement: >-
    Native LPAR4 affinity and efficacy across physiological LPA molecular species
    remain incompletely defined.
  boundary: >-
    Recombinant membrane binding and reporter assays define an LPA-species potency
    order and nanomolar 1-oleoyl-LPA binding, but do not establish whether the same
    ranking holds at endogenous receptor abundance in human tissues.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    Molecular-species selectivity could shape tissue responses and therapeutic
    pharmacology.
  resolution: >-
    Quantify binding and branch-resolved efficacy for defined LPA species in native
    human membranes and cells using LPAR4 knockout and genomic rescue controls.
- gap_statement: >-
    Why LPAR4 suppresses motility in some cancer-cell models but promotes
    invadopodia, invasion, and metastasis in fibrosarcoma is unresolved.
  boundary: >-
    Ectopic LPAR4 suppresses migration and invasion in some human cancer cells,
    whereas fibrosarcoma studies identify an LPAR4-cAMP-EPAC-Rac1 invasion pathway.
    These opposing disease-cell outputs cannot be generalized into a single normal
    human motility function.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    Resolving the switch would distinguish receptor-intrinsic coupling bias from
    differences in receptor abundance, LPA production, and signaling-network state.
  resolution: >-
    Compare endogenous LPAR4 perturbation across matched cancer and non-transformed
    human cells while measuring G-protein branches, EPAC-Rac1, Rho, Akt, migration,
    invadopodia, and invasion.
- gap_statement: >-
    The extent to which mouse Lpar4 and stem-cell-culture developmental phenotypes
    predict normal human tissue functions remains unclear.
  boundary: >-
    Initial Lpar4-null mice show no gross abnormality despite altered fibroblast
    motility. Sequential LPAR4 stimulation and inhibition improves mouse and human
    pluripotent-stem-cell cardiac differentiation in vitro, while infarct reduction
    and cardiac rescue are demonstrated in mice. These findings do not establish a
    constitutive adult-human cardiac or developmental core function.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: >-
    Careful conservation testing is needed before translating transient progenitor
    and mouse injury-repair effects into human physiology or therapy.
  resolution: >-
    Define endogenous LPAR4 timing and necessity during human cardiac-progenitor
    differentiation, then test mature human cardiac models with receptor-selective
    genetic controls before extrapolating the mouse repair phenotype.
- gap_statement: >-
    The physiological consequences of screen-detected LPAR4 interactions with
    RAMP1, RAMP2, and RAMP3 are unknown.
  boundary: >-
    All three contacts were detected after ectopic pairwise expression and membrane
    solubilization. The audited evidence does not establish endogenous coexpression,
    a stable complex, or an LPAR4-specific effect on surface delivery, ligand
    selectivity, coupling, or trafficking.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    RAMP-dependent modulation could explain cell-context differences, but
    screen-level contacts must not be treated as constitutive receptor components.
  resolution: >-
    Validate endogenous proximity in human cells that naturally coexpress LPAR4 and
    each RAMP, then use knockout and add-back to measure receptor pharmacology,
    surface abundance, signaling bias, and trafficking.
- gap_statement: >-
    LPAR4 structural determinants, receptor-specific trafficking regulation, and
    possible endogenous proteoform variation remain largely uncharacterized.
  boundary: >-
    No experimentally determined LPAR4 structure or direct receptor-specific
    internalization, desensitization, or recycling study was identified. The
    reviewed Q99677 record defines no alternative protein products, and its sequence
    conflicts are source discrepancies rather than validated functional isoforms or
    alleles.
  gap_kind:
  - BIOLOGY
  - CURATION
  status: OPEN
  significance: >-
    These missing data limit mechanistic interpretation of ligand selectivity,
    coupling bias, surface residence, and sequence-dependent functional variation.
  resolution: >-
    Determine ligand-bound LPAR4 structures with relevant G proteins, map
    agonist-dependent phosphorylation and arrestin recruitment at endogenous
    abundance, and reconcile candidate transcripts or variants before assigning
    isoform-specific function.
proposed_new_terms: []
suggested_questions:
- question: >-
    What are the quantitative Gq/11, G12/13, Gs, Gi/o, and beta-arrestin coupling
    profiles of endogenous LPAR4 in physiologically relevant human cells?
- question: >-
    Which physiological LPA molecular species bind and activate native human LPAR4
    most effectively?
- question: >-
    Which signaling-network features determine whether LPAR4 suppresses or promotes
    cancer-cell motility and invasion?
- question: >-
    Which transient cardiac-progenitor and mouse injury-repair effects of LPAR4 are
    conserved in genetically controlled human cardiac models?
- question: >-
    Do RAMP1-3 alter endogenous LPAR4 surface delivery, ligand pharmacology,
    coupling bias, or trafficking?
- question: >-
    What structural features control LPA recognition and coupling by LPAR4, and how
    is the receptor phosphorylated, internalized, recycled, or desensitized?
suggested_experiments:
- hypothesis: >-
    Native LPAR4 coupling weights vary by human cell type and differ from both CHO
    and B103 heterologous assays.
  description: >-
    CRISPR-tag endogenous LPAR4 in ovarian and additional native-expression human
    cell models and measure Gq/11, G12/13, Gs, Gi/o, beta-arrestin, calcium, cAMP,
    and Rho responses in parallel. Resolve dose and time courses with selective
    G-alpha knockout and rescue.
  experiment_type: endogenous multiplexed GPCR coupling analysis
- hypothesis: >-
    Native LPAR4 retains a measurable preference for 1-oleoyl-LPA but the complete
    LPA-species rank order differs from recombinant membrane assays.
  description: >-
    Measure direct binding and branch-resolved efficacy for acyl, alkyl, and alkenyl
    LPA species in wild-type, LPAR4-knockout, and genomically rescued human cells
    while controlling expression of other LPA receptors.
  experiment_type: receptor-specific native ligand pharmacology
- hypothesis: >-
    The direction of LPAR4-dependent motility is set by relative cAMP-EPAC-Rac1,
    Rho, and Akt pathway engagement rather than by one universal receptor output.
  description: >-
    Compare endogenous LPAR4 knockout and rescue across fibrosarcoma, other cancer,
    and non-transformed cells under matched LPA production. Quantify proximal
    coupling, EPAC-Rac1, Rho, Akt, focal structures, migration, and invasion.
  experiment_type: context-resolved motility signaling epistasis
- hypothesis: >-
    Transient LPAR4 activity has a stage-specific role in human cardiac progenitors
    but is dispensable or different in mature cardiomyocytes.
  description: >-
    Introduce inducible LPAR4 loss and rescue at defined stages of human pluripotent
    stem-cell cardiac differentiation, measure lineage trajectories and receptor
    signaling, and compare mature engineered heart tissues under injury-like stress.
  experiment_type: stage-resolved human cardiac differentiation
- hypothesis: >-
    At least one RAMP modifies LPAR4 only in human cells with native coexpression.
  description: >-
    Verify endogenous LPAR4-RAMP proximity, perturb each RAMP singly and in
    combination, and quantify receptor surface abundance, LPA affinity, coupling
    bias, internalization, and resensitization with interaction-defective add-back.
  experiment_type: endogenous RAMP genetic epistasis and receptor pharmacology
- hypothesis: >-
    Ligand-specific conformations and intracellular phosphorylation sites jointly
    determine LPAR4 coupling and surface residence.
  description: >-
    Determine structures of LPAR4 bound to representative LPA species and G-protein
    partners, map agonist-dependent phosphosites and arrestin recruitment, and test
    precise endogenous mutants for internalization, recycling, desensitization, and
    signaling bias.
  experiment_type: integrated receptor structural biology and trafficking
