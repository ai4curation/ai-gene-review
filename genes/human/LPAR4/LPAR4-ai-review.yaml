- id: PMID:9073069
  title: Cloning and chromosomal mapping of four putative novel human G-protein-coupled receptor genes.
  findings:
  - statement: GPR23, the gene later deorphanized as LPAR4, was initially isolated as a human putative GPCR and mapped to Xq13-q21.1.
    supporting_text: This resulted in the isolation of genes GPR21, GPR22 and GPR23.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  - statement: The initial human GPR23 study established chromosomal position but did not identify a ligand or signaling function.
    supporting_text: Fluorescence in situ hybridization (FISH) was used to map GPR20 to chromosome 8q, region 24.3-24.2, GPR21 to chromosome 9, region q33, GPR22 to chromosome 7, region q22-q31.1, and GPR23 to chromosome X, region q13-q21.1.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Primary human cloning and mapping paper for GPR23 identity; it predates LPA deorphanization and does not establish receptor function.
- id: PMID:9223435
  title: Cloning of a human heptahelical receptor closely related to the P2Y5 receptor.
  findings:
  - statement: The human receptor historically called P2Y5-like/P2Y9 was cloned as a 370-aa heptahelical GPCR.
    supporting_text: Starting from this partial sequence, we have isolated a complete clone and identified a 1113 base pair open reading frame encoding a new G-coupled receptor that we have called P2Y5-like.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  - statement: Forty tested nucleotides and nucleosides failed to activate the receptor in four signaling assays, arguing against interpreting the historical P2Y name as demonstrated purinergic activity.
    supporting_text: 'None of the 40 nucleotides and nucleosides tested was able to elicit a response in any of four functional assays: inositol phosphate formation, stimulation or inhibition of cAMP formation, and extracellular acidification measured with a microphysiometer.'
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary human cloning and negative ligand-screen evidence; important for the historical P2Y9 nomenclature boundary but superseded functionally by LPA deorphanization.
- id: PMID:12724320
  title: Identification of p2y9/GPR23 as a novel G protein-coupled receptor for lysophosphatidic acid, structurally distant from the Edg family.
  findings:
  - statement: Human p2y9/GPR23 was deorphanized as LPA4 by direct, saturable 1-oleoyl-LPA binding in membranes of receptor-expressing cells.
    supporting_text: Membrane fractions of RH7777 cells transiently expressing p2y9/GPR23 displayed a specific binding for 1-oleoyl-LPA with a Kd value of around 45 nm.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  - statement: LPAR4 discriminates among LPA molecular species, preferring 1-oleoyl-LPA in the reported rank order.
    supporting_text: Competition binding and reporter gene assays showed that p2y9/GPR23 preferred structural analogs of LPA with a rank order of 1-oleoyl- > 1-stearoyl- > 1-palmitoyl- > 1-myristoyl- > 1-alkyl- > 1-alkenyl-LPA.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  - statement: In heterologous CHO cells, LPA-bound LPAR4 elevated intracellular calcium and stimulated adenylyl cyclase.
    supporting_text: In Chinese hamster ovary cells expressing p2y9/GPR23, 1-oleoyl-LPA induced an increase in intracellular Ca2+ concentration and stimulated adenylyl cyclase activity.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  - statement: The original human tissue survey found LPAR4 transcript most abundant in ovary.
    supporting_text: Quantitative real-time PCR demonstrated that mRNA of p2y9/GPR23 was significantly abundant in ovary compared with other tissues.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Decisive primary human receptor study with direct ligand binding, ligand rank order, calcium and adenylyl-cyclase outputs, and tissue-expression context; signaling was measured in heterologous rodent cells.
- id: PMID:17172642
  title: LPA4/p2y9/GPR23 mediates rho-dependent morphological changes in a rat neuronal cell line.
  findings:
  - statement: LPAR4 drove Gq/11-dependent calcium mobilization in rat B103 neuroblastoma transfectants but did not alter adenylyl cyclase in that system.
    supporting_text: In B103 cells stably expressing LPA(4), we observed G(q/11)-dependent calcium mobilization, but LPA did not affect adenylyl cyclase activity.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  - statement: LPA induced Rho-dependent neurite retraction, aggregation, and cadherin-dependent adhesion through transfected LPAR4.
    supporting_text: In LPA(4) transfectants, LPA induced dramatic morphological changes, i.e. neurite retraction, cell aggregation, and cadherin-dependent cell adhesion, which involved Rho-mediated signaling pathways.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  - statement: The study inferred LPAR4 coupling to Gq/11 and G12/13 but not Gi/o in this rat neuronal-cell context.
    supporting_text: Thus, our results demonstrated that LPA(4) as well as LPA(1) couple to G(q/11) and G(12/13), whereas LPA(4) differs from LPA(1) in that it does not couple to G(i/o).
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct mechanistic LPAR4 signaling study in a rat neuroblastoma transfection system; valuable for coupling and Rho biology but not proof of native human neuronal function.
- id: PMID:18843048
  title: Role of LPA4/p2y9/GPR23 in negative regulation of cell motility.
  findings:
  - statement: Mouse Lpar4 loss enhanced LPA-driven fibroblast migration and shifted Akt/Rac/Rho signaling, whereas receptor reconstitution reduced motility.
    supporting_text: Consistent with negative modulation of the phosphatidylinositol 3 kinase pathway by LPA(4), LPA(4) deficiency potentiated Akt and Rac but decreased Rho activation induced by LPA. Reconstitution of LPA(4) converted LPA(4)-negative cells into a less motile phenotype.
    full_text_unavailable: false
    reference_section_type: ABSTRACT
  - statement: Ectopic LPAR4 inhibited migration and invasion in human cancer cells and antagonized LPA1-driven motility in receptor-null B103 cells.
    supporting_text: In support of the biological relevance of these observations, ectopic expression of LPA(4) strongly inhibited migration and invasion of human cancer cells. When coexpressed with LPA(1) in B103 neuroblastoma cells devoid of endogenous LPA receptors, LPA(4) attenuated LPA(1)-driven migration and invasion, indicating functional antagonism between the two subtypes of LPA receptors.
    full_text_unavailable: false
    reference_section_type: ABSTRACT
  - statement: The first targeted mouse Lpar4 knockout had no gross apparent phenotype, bounding strong developmental claims from this model.
    supporting_text: Although LPA(4)-deficient mice displayed no apparent abnormalities, LPA(4)-deficient mouse embryonic fibroblasts (MEFs) were hypersensitive to LPA-induced cell migration.
    full_text_unavailable: false
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary genetic and cell-biological evidence for negative regulation of motility; combines mouse knockout/MEF data with ectopic human cancer-cell assays, so neither context should be generalized to all native human tissues.
- id: PMID:20484039
  title: 'Autotaxin promotes cancer invasion via the lysophosphatidic acid receptor 4: participation of the cyclic AMP/EPAC/Rac1 signaling pathway in invadopodia formation.'
  findings:
  - statement: In fibrosarcoma cells, autotaxin-derived LPA signaled through LPAR4 to promote invadopodia through a cAMP-EPAC-Rac1 pathway.
    supporting_text: We further provide evidence that LPA(4) signaling in fibrosarcoma cells regulates invadopodia formation downstream of ATX, a process mediated through the activation of EPAC by cyclic AMP and subsequent Rac1 activation.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  - statement: LPAR4 knockdown supported a requirement for the receptor in invasion and in vivo metastasis formation in this cancer model.
    supporting_text: Results using LPA(4) shRNA support the requirement of the LPA(4) receptor for cell invasion and in vivo metastasis formation.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary disease-model evidence for an LPAR4-cAMP-EPAC-Rac1 invasion pathway. The abstract does not establish a normal-tissue role or identify the fibrosarcoma cells as a native human LPAR4 context, so the finding is kept explicitly model-bounded.
- id: PMID:20482379
  title: Strategy for the identification of GPR23/LPA4 receptor agonists and inverse agonists.
  findings:
  - statement: Human GPR23 expressed in CHO cells reproduced LPA-dependent cAMP and calcium responses.
    supporting_text: In Chinese hamster ovary cells expressing the human GPR23, LPA induced an increase in cellular cyclic adenosine monophosphate (cAMP) and calcium levels.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  - statement: Orthogonal reporter and radioligand-binding screens yielded LPAR4 agonists, inverse agonists, and a negative modulator.
    supporting_text: Here we report the identification of novel GPR23 agonists, inverse agonists, and a negative modulator from 2 high-throughput screens, a beta-lactamase reporter screen, and a [3H]LPA-binding screen.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  - statement: Candidate mechanisms and selectivity were tested with reporter, cAMP, and other LPA-receptor assays.
    supporting_text: Several screening hits were selected for mechanism of action studies using the beta-lactamase reporter assay and a cAMP assay. An evaluation of their selectivity at the other LPA receptors was also conducted.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary human-receptor pharmacology in engineered CHO cells; supports constitutive activity and ligand-tool development, not endogenous physiological responses.
- id: PMID:21050927
  title: Development of a GPR23 cell-based β-lactamase reporter assay.
  findings:
  - statement: An inducible reporter assay detected constitutive GPR23/LPAR4 activity.
    supporting_text: This report describes how a tetracycline-inducible system was utilized in conjunction with a sensitive β-lactamase reporter gene to develop an assay in which constitutive activity of the receptor could be monitored.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  - statement: Screening with the reporter identified the first reported small-molecule inverse agonists for GPR23.
    supporting_text: This assay was then utilized to screen a 1.1 million compound library to identify the first small molecule inverse agonists for the receptor.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Methods-focused primary pharmacology paper establishing assay-detectable constitutive activity and inverse agonists in an engineered system.
- id: PMID:33160074
  title: Lysophosphatidic Acid Receptor 4 Is Transiently Expressed during Cardiac Differentiation and Critical for Repair of the Damaged Heart.
  findings:
  - statement: LPAR4 expression transiently peaks in cardiac progenitors during both mouse and human PSC differentiation.
    supporting_text: During in vitro differentiation of mouse and human PSCs toward cardiac lineage, LPAR4 expression peaked after 3-7 days of differentiation in cardiac progenitors and then declined.
    full_text_unavailable: false
    reference_section_type: ABSTRACT
  - statement: Sequential LPAR4 stimulation and downstream p38 inhibition enhanced cardiac differentiation in mouse and human PSC cultures.
    supporting_text: Sequential stimulation and inhibition of LPAR4 using these agents enhanced the in vitro efficiency of cardiac differentiation from mouse and human PSCs.
    full_text_unavailable: false
    reference_section_type: ABSTRACT
  - statement: The in vivo cardiac-repair result was demonstrated in mice and should not be transferred directly to human physiology.
    supporting_text: Importantly, in vivo, this sequential stimulation and inhibition of LPAR4 reduced the infarct size and rescued heart dysfunction in mice.
    full_text_unavailable: false
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Mixed human/mouse PSC differentiation and mouse injury study; informs developmental context and an LPAR4-responsive progenitor state but not the receptor's universal core function or native adult-human cardiac mechanism.
- id: PMID:39083597
  title: Multiplexed mapping of the interactome of GPCRs with receptor activity-modifying
    proteins.
  findings:
  - statement: The RAMP interactome screen tested every GPCR-RAMP pair by ectopic coexpression and membrane-solubilization assays.
    supporting_text: All potential GPCR-RAMP interacting pairs were expressed ectopically, solubilized and analyzed using the multiplexed suspension bead array (SBA) strategy.
    full_text_unavailable: false
    reference_section_type: INTRODUCTION
  - statement: The library screen used one biological replicate per GPCR-only or GPCR-RAMP sample, with separate detection schemes supplying the two replicates.
    supporting_text: For the DuET library–based GPCR-RAMP interactome screen, we used one biological replicate of each of the four unique GPCR-containing samples (each GPCR alone and each GPCR with each of the three RAMPs) in two replicates. Each replicate represented one detection scheme.
    full_text_unavailable: false
    reference_section_type: RESULTS
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: IntAct/GOA reports LPAR4 partner rows for RAMP1, RAMP2, and RAMP3 from this multiplexed screen. The paper supports screen-level complex detection in engineered cells, not an endogenous LPAR4 complex or a demonstrated RAMP effect on LPAR4 trafficking or pharmacology.
- id: Reactome:R-HSA-379048
  title: Liganded Gq/11-activating GPCRs act as GEFs for Gq/11
  findings:
