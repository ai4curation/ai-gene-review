- term:
    id: GO:0007204
    label: positive regulation of cytosolic calcium ion concentration
  evidence_type: IDA
  original_reference_id: PMID:12724320
  qualifier: involved_in
  review:
    summary: Proposed as a new annotation for the directly demonstrated LPAR4-dependent calcium response.
    action: NEW
    reason: Human P2Y9/GPR23 expressed in CHO cells increases intracellular calcium after 1-oleoyl-LPA stimulation, and an independent B103 transfectant study resolves a Gq/11-dependent calcium response. The process is receptor proximal, while the heterologous-cell context remains explicit.
    supported_by:
    - reference_id: PMID:12724320
      supporting_text: In Chinese hamster ovary cells expressing p2y9/GPR23, 1-oleoyl-LPA induced an increase in intracellular Ca2+ concentration and stimulated adenylyl cyclase activity.
    additional_reference_ids:
    - PMID:17172642
- term:
    id: GO:0007188
    label: adenylate cyclase-modulating G protein-coupled receptor signaling pathway
  evidence_type: IDA
  original_reference_id: PMID:12724320
  qualifier: involved_in
  review:
    summary: Proposed as a new annotation for the directly demonstrated but cell-context-dependent adenylyl-cyclase response.
    action: NEW
    reason: LPA stimulates adenylyl cyclase in CHO cells expressing human LPAR4, whereas LPA does not alter adenylyl cyclase in B103 LPAR4 transfectants. The modulating parent term captures the demonstrated receptor connection without asserting that activation is universal across cellular contexts.
    supported_by:
    - reference_id: PMID:12724320
      supporting_text: In Chinese hamster ovary cells expressing p2y9/GPR23, 1-oleoyl-LPA induced an increase in intracellular Ca2+ concentration and stimulated adenylyl cyclase activity.
    additional_reference_ids:
    - PMID:17172642
- term:
    id: GO:0035025
    label: positive regulation of Rho protein signal transduction
  evidence_type: IDA
  original_reference_id: PMID:17172642
  qualifier: involved_in
  review:
    summary: Proposed as a new annotation for the directly supported G12/13-Rho branch of LPAR4 signaling.
    action: NEW
    reason: Human LPAR4 expressed in B103 cells couples to G12/13 and produces Rho-dependent neurite retraction, aggregation, and cadherin-dependent adhesion. This supports a proximal Rho signaling branch but does not generalize the cell-behavior outputs to native human tissues.
    supported_by:
    - reference_id: PMID:17172642
      supporting_text: In LPA(4) transfectants, LPA induced dramatic morphological changes, i.e. neurite retraction, cell aggregation, and cadherin-dependent cell adhesion, which involved Rho-mediated signaling pathways.
