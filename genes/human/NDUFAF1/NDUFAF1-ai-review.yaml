- term:
    id: GO:0051082
    label: unfolded protein binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  retired: true
  review:
    summary: >-
      Separately reviewed legacy propagated claim retained in the UniProt record as
      `IBA:GO_Central`; it is not one of the 27 current GOA signatures. GO:0051082 is
      now obsolete, and neither the current PAINT slice nor the NDUFAF1 literature
      supports direct binding to an unfolded client. Association with newly translated
      complex-I subunits during assembly does not establish their conformational state
      or an autonomous chaperone molecular function.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The assembly-factor biology is real, but this propagated molecular-function
      claim over-interprets “assembly chaperone” as unfolded-protein binding. Current
      PAINT for PTHR13194/PTN000324265 contains only GO:0005739 and GO:0032981 IBDs.
      GO:0044183 is not justified because autonomous folding was not assayed, and
      carrier-specific GO:0140309 is not justified because client escort was not shown.
    supported_by:
    - reference_id: file:human/NDUFAF1/NDUFAF1-uniprot.txt
      supporting_text: "F:unfolded protein binding; IBA:GO_Central."
    - reference_id: PMID:17557076
      supporting_text: >-
        human complex I assembly factor CIA30 (complex I intermediate associated protein)
        associates with newly translated mtDNA-encoded complex I subunits at early stages
        in their assembly before dissociating at a later stage.
    propagation_review:
      root_cause: SOURCE_STALE_OR_MISSING
      failure_modes:
