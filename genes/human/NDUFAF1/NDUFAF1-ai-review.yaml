        source_status: SOURCE_STALE_OR_MISSING
        comment: >-
          The retained current PAINT slice for PTHR13194 contains exactly two IBDs at
          this node, GO:0005739 and GO:0032981; GO:0051082 is absent. This classifies a
          stale historical transfer and does not challenge either current node placement.
      - source_id: UniProtKB:Q9Y375
        source_label: UniProtKB:Q9Y375
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: >-
          The UniProt flat file still preserves `F:unfolded protein binding;
          IBA:GO_Central`, but this is an inferred legacy cross-reference rather than
          independent experimental evidence for unfolded-client recognition.
core_functions:
- description: >-
    Non-catalytic assembly factor for mitochondrial respiratory-chain complex I. As
    a core subunit of the mitochondrial complex I intermediate assembly (MCIA)
    complex, NDUFAF1 associates with partner assembly factors and early membrane-arm
    intermediates to promote ND2-module assembly, then dissociates before formation
    of the mature holoenzyme. No autonomous molecular function has yet been resolved.
  directly_involved_in:
  - id: GO:0032981
    label: mitochondrial respiratory chain complex I assembly
  locations:
  - id: GO:0005759
    label: mitochondrial matrix
  in_complex:
    id: GO:0160295
    label: mitochondrial complex I intermediate assembly complex
  supported_by:
  - reference_id: file:human/NDUFAF1/NDUFAF1-uniprot.txt
    supporting_text: "As part of the MCIA complex, involved in the assembly of the"
  - reference_id: PMID:17557076
    supporting_text: >-
      CIA30 is a crucial component in the early assembly of complex I
  - reference_id: PMID:32320651
    supporting_text: >-
      The mitochondrial complex I intermediate assembly (MCIA) complex, containing
      assembly factors NDUFAF1, ECSIT, ACAD9, and TMEM126B, is required for building
      the intermediate ND2-module.
proposed_new_terms: []
suggested_questions:
- question: >-
    Which complex-I subunit or assembly-intermediate surfaces contact NDUFAF1 directly,
    and does NDUFAF1 stabilize those contacts without recognizing an unfolded state?
suggested_experiments:
- hypothesis: >-
    NDUFAF1 promotes ND2-module assembly through specific MCIA and nascent-subunit
    contacts rather than through autonomous foldase or unfolded-protein-binding activity.
  description: >-
    Reconstitute defined MCIA intermediates with purified NDUFAF1 and map direct contacts
    by cross-linking mass spectrometry and cryo-EM; compare wild-type and interface mutants
    in NDUFAF1-null cells, while separately assaying generic unfolded-protein binding and
    refolding to distinguish assembly scaffolding from chaperone activity.
  experiment_type: biochemical reconstitution, structural mapping, and genetic rescue
