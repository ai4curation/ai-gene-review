- term:
    id: GO:0030018
    label: Z disc
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0314
  review:
    action: UNDECIDED
    summary: The precise Z-disc localization of FHOD3 remains disputed.
    reason: The SL-0314 mapping agrees with the adult-heart Z-disc observations in PMID:21149568, obtained
      with an antibody against a region shared by the isoforms. PMID:22509354 instead reports sarcomeric
      doublets away from Z-lines in adult human ventricular tissue and rodent hearts, with distinct antibodies
      and mouse preadsorption controls. Antibody specificity, fixation, tissue state and experimental
      context may contribute to the discrepancy; recency alone does not settle it. Retain uncertainty
      rather than treating either study as definitive or inferring an isoform-specific annotation from
      the shared-region antibody.
    supported_by:
    - reference_id: GO_REF:0000044
    - reference_id: PMID:21149568
    - reference_id: PMID:22509354
