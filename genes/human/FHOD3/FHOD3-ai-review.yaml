id: Q2V2M9
gene_symbol: FHOD3
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: FHOD3 is a formin-family actin-organizing protein with FH1 and FH2 domains. Its interaction
  with actin filaments contributes to the organization and maintenance of cardiac myofibrils. FHOD3 is
  associated with the sarcomeric cytoskeleton, although studies disagree about its precise position within
  the sarcomere. Alternative splicing and phosphorylation affect targeting and SQSTM1/p62 association
  in experimental systems. Human FHOD3 variants segregate with hypertrophic cardiomyopathy.
alternative_products:
- name: '1'
  id: Q2V2M9-1
  description: Displayed 1422-residue product. The family MSA target sequence matches this product exactly.
    A distinct endogenous function relative to all other natural human products is not established by
    the reviewed experiments.
- name: '2'
  id: Q2V2M9-2
  sequence_note: VSP_024397, VSP_024398
  description: 1401-residue product reconstructed from both seeded alternative-sequence features. Historical
    short FHOS2 constructs do not establish a unique function for this exact human product without sequence
    mapping.
- name: '3'
  id: Q2V2M9-3
  sequence_note: VSP_024398
  description: 1439-residue product reconstructed from VSP_024398. Product-specific biochemical and localization
    differences from the other natural human products remain unresolved.
- name: '4'
  id: Q2V2M9-4
  sequence_note: VSP_044682, VSP_024398, VSP_044683
  description: 1622-residue product with the muscle-associated acidic FH2 insertion described in PMID:21149568.
    Thr1474/Thr1476 refer to this product rather than the displayed sequence. Human splice constructs
    tested in rat cardiomyocytes support regulated targeting and SQSTM1 association; the insertion does
    not establish a universal localization or polymerization switch, and the localization interpretation
    is contested by PMID:22509354.
