  review:
    action: KEEP_AS_NON_CORE
    summary: FHOD3 associates with SQSTM1/p62 in interaction assays.
    reason: PMID:21149568 uses a human heart-library two-hybrid screen, FH2-bait pull-down from transfected
      COS-1 lysates, and cellular co-immunoprecipitation to support the interaction. CK2 phosphorylation
      and the acidic insertion affect association. The pull-down is not a purified two-component reconstitution,
      and binding an autophagy adaptor does not make FHOD3 an adaptor or establish autophagy activity.
