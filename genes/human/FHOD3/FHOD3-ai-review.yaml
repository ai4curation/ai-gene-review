suggested_questions:
- question: Which endogenous human FHOD3 products occupy the Z-disc versus the central sarcomeric region,
    and do antibody specificity, fixation or tissue state explain the disagreement between PMID:21149568
    and PMID:22509354?
- question: Which cellular partners or conditions permit FHOD3-dependent actin organization despite the
    inhibitory assembly behavior of purified truncated mouse FHOD3 in PMID:19706596, and how does this
    vary among the four natural human products?
