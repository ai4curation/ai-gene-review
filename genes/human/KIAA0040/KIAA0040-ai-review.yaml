suggested_questions:
- question: Is KIAA0040 an integral membrane protein (as its hydrophobic segment predicts) or nucleoplasmic
    (as the HPA antibody suggests), and does the poly-lysine tail act as a nuclear localisation signal?
- question: 'How could a 99-residue single-pass protein enhance JAK2/STAT3 signalling: by binding a cytokine
    receptor or JAK2 directly, or indirectly?'
suggested_experiments:
- hypothesis: KIAA0040 is a membrane protein whose basic tail faces the cytosol.
  description: Localise endogenously tagged KIAA0040 in placental trophoblast (e.g. BeWo) cells by co-staining
    with organelle markers, test membrane integration by carbonate extraction, and immunoprecipitate it
    to identify partners, checking specifically for JAK2 or cytokine receptors.
