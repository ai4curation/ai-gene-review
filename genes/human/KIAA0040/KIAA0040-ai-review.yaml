  label: Homo sapiens
description: KIAA0040 encodes a 99-amino-acid protein of unknown function conserved among mammals (PANTHER
  PTHR40382, KIAA0040-like). It has a predicted single N-terminal transmembrane helix (residues 27-47)
  followed by a disordered, highly basic C-terminal tail containing a poly-lysine run. The transcript
  is broadly expressed and enriched in placenta, and is induced in primary immune cells by microbial stimuli.
  Common variants at the locus have been associated with alcohol dependence in genome-wide studies. One
  study in glioma cell lines reported that KIAA0040 is overexpressed in high-grade tumours and that its
  knockdown reduces proliferation, migration and invasion with lower JAK2/STAT3 activation. Its membrane
  of residence, topology, partners and molecular activity are unknown.
