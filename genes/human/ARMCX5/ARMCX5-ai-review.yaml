description: ARMCX5 is a 558-residue X-linked protein of the eutherian GPRASP/ARMCX family, related to
  the GPCR-associated sorting proteins. Its molecular function and location are uncharacterized. In mice,
  Armcx5 lies within a 0.35 Mb Xq22.1 region, with Gprasp1, Gprasp2 and Bhlhb9, whose deletion reproduces
  the respiratory failure, cleft palate and seizures of human Xq22.1 deletion syndrome. ARMCX5's own contribution
  has not been separated from that of its neighbours.
