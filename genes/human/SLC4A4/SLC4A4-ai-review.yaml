core_functions:
- description: >-
    Electrogenic sodium-bicarbonate cotransport. NBCe1 couples Na(+) to HCO3(-)
    movement across the plasma membrane with a 1 Na(+) : 2-3 HCO3(-) stoichiometry,
    carrying net negative charge so the transport is electrogenic (confirmed by the
    cryoEM-guided conversion of wild-type NBCe1 from an electrogenic Na+-coupled
    symporter to an electroneutral anion exchanger by a few substitutions). In the
    renal proximal tubule the kidney isoform sits at the basolateral membrane and
    exports reabsorbed Na(+)/HCO3(-) to the blood.
  molecular_function:
    id: GO:0008510
    label: sodium:bicarbonate symporter activity
