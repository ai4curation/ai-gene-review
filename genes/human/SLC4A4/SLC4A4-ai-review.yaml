proposed_new_terms: []
suggested_questions:
- question: >-
    What determines whether NBCe1 operates with 2 HCO3(-) versus 3 HCO3(-) per Na(+)
    in a given cell type, and how is the PKA-phosphorylation-driven stoichiometry
    switch deployed physiologically beyond the proximal tubule?
- question: >-
    Does NBCe1 mediate solute transport across the blood-brain barrier itself, or is
    its brain role confined to astrocytic pH/metabolic regulation (relevant to the
    unverified GO:0150104 annotation)?
suggested_experiments:
- description: >-
    Cell-type-resolved measurement of NBCe1 transport stoichiometry and direction
    (e.g. combined voltage-clamp and intracellular pH/Na+ imaging) in native
    proximal tubule, pancreatic duct, corneal endothelium and astrocytes, with and
    without CA2/CA4 and AHCYL1, to map how partners and phosphorylation tune the
    1:2 vs 1:3 mode in situ.
- description: >-
    Targeted localisation and flux assays at the neurovascular unit (astrocyte
    endfeet vs BBB endothelium) to test whether NBCe1 contributes to transcellular
    bicarbonate/pH handling across the blood-brain barrier.
