id: Q9Y6R1
gene_symbol: SLC4A4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  SLC4A4 encodes NBCe1, the electrogenic sodium-bicarbonate cotransporter 1, a
  multi-pass integral membrane protein of the SLC4 (anion exchanger, TC 2.A.31)
  family. It couples the inward or outward movement of Na(+) to that of HCO3(-)
  with a variable stoichiometry of 1 Na(+) : 2-3 HCO3(-); because the transported
  charge is unequal, the cotransport is electrogenic and both generates and
  responds to membrane potential, distinguishing NBCe1 from the electroneutral
  NBCn family. By carrying bicarbonate across the plasma membrane it is a major
  regulator of intracellular and transepithelial pH. The protein functions as a
  homodimer and its activity is modulated by cytoplasmic carbonic anhydrase 2
  (forming a bicarbonate-transport metabolon), extracellular carbonic anhydrase 4,
  the IP3-receptor-binding protein AHCYL1/IRBIT, and PKA phosphorylation (which
  shifts the HCO3(-):Na(+) stoichiometry from 3:1 to 2:1). The kidney-type isoform
  resides at the basolateral membrane of renal proximal tubule cells, where it
  mediates the bulk of bicarbonate reabsorption into the blood; the pancreatic/
  widely expressed isoform operates in pancreatic duct, eye (corneal endothelium),
  brain astrocytes and other tissues. Biallelic loss-of-function causes proximal
  renal tubular acidosis with ocular abnormalities (band keratopathy, cataracts,
  glaucoma) and growth and intellectual impairment.
