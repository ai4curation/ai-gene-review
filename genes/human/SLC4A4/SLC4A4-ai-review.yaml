- term:
    id: GO:0005452
    label: solute:inorganic anion antiporter activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR003020
  - InterPro:IPR003024
  review:
    summary: >-
      InterPro2GO maps the SLC4/anion-exchanger family signatures to antiporter
      (exchanger) activity, but NBCe1 is a Na(+)-coupled electrogenic symporter,
      not an anion:anion antiporter.
    action: MODIFY
    reason: >-
      The SLC4 family contains both electroneutral Cl(-)/HCO3(-) exchangers (the
      AE antiporters, e.g. SLC4A1) and Na(+)-coupled HCO3(-) cotransporters.
      NBCe1 belongs to the latter group: every functional study shows Na(+):HCO3(-)
      cotransport (symport), not anion exchange. The cryoEM/mutagenesis work even
      demonstrates that a few substitutions can convert NBCe1 from an electrogenic
      Na+-coupled symporter to an electroneutral anion exchanger, confirming the
      two activities are distinct and that wild-type NBCe1 is the symporter. The
      antiporter mapping is a family-level over-generalisation; the correct, better
      term is sodium:bicarbonate symporter activity (GO:0008510), already heavily
      supported here. This is a lateral mechanism correction, not a refinement.
    proposed_replacement_terms:
    - id: GO:0008510
      label: sodium:bicarbonate symporter activity
