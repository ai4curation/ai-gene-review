    review:
      summary: >-
        Orthology transfer from mouse Asgr1 (P34927) reflecting ASGR1 homo-oligomerization;
        retained as non-core structural property.
      action: KEEP_AS_NON_CORE
      reason: >-
        Human ASGR1 self-associates via its extracellular coiled-coil neck region into
        functional homo-oligomers capable of mediating endocytic uptake of
        GalNAc-conjugated ligands independently of ASGR2, in addition to forming
        ASGR1/ASGR2 hetero-oligomers. Because homo-oligomerization is a structural
        assembly property supporting the receptor's core C-type lectin and endocytic
        receptor activities rather than a standalone molecular function in
        core_functions, it is retained as KEEP_AS_NON_CORE.
      supported_by:
        - reference_id: PMID:29069408
          supporting_text: >-
            Interestingly, the parameters of conjugate uptake in cells expressing
            only ASGR1 were similar to those from cells expressing both ASGR1 and
            ASGR2, suggesting ASGR1 homooligomers are sufficient for GalNAc-mediated
            ASO uptake.
