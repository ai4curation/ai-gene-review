core_functions:
  - description: >-
      Major subunit of the hepatocyte cell-surface asialoglycoprotein receptor that
      binds terminal D-galactose and N-acetyl-D-galactosamine (GalNAc) residues on
      desialylated plasma glycoproteins via its extracellular C-type lectin domain and
      internalizes them via clathrin-dependent receptor-mediated endocytosis for
      lysosomal degradation.
    molecular_function:
      id: GO:0004873
      label: asialoglycoprotein receptor activity
    directly_involved_in:
      - id: GO:0006898
        label: receptor-mediated endocytosis
    locations:
      - id: GO:0005886
        label: plasma membrane
      - id: GO:0009897
        label: external side of plasma membrane
    supported_by:
      - reference_id: file:genes/human/ASGR1/ASGR1-uniprot.txt
        record_section: ["CC:FUNCTION"]
        supporting_text: >-
          Transmembrane protein predominantly expressed on hepatocytes that plays a
          key role in endocytosis of plasma glycoproteins that lack terminal sialic
          acid residues. Specifically recognizes terminal galactose and
          N-acetylgalactosamine residues, facilitating the clearance of desialylated
          glycoproteins from circulation.
      - reference_id: PMID:12171918
        supporting_text: >-
          The hepatic asialoglycoprotein receptor (ASGP-R) internalizes desialylated
          glycoproteins via the clathrin-coated pit pathway and mediates their
          delivery to lysosomes for degradation. The human ASGP-R contains two
          subunits, H1 and H2.
      - reference_id: PMID:29069408
        supporting_text: >-
          GalNAc conjugation confers high affinity binding to the Asialoglycoprotein
          Receptor (ASGR), a cell surface C-type lectin that functions as a scavenger
          receptor and is able to remove desialylated glycoproteins from circulation
suggested_questions:
  - question: >-
      What are the endogenous physiological glycoprotein substrates whose clearance by
      human ASGR1 homo-oligomers versus ASGR1/ASGR2 hetero-oligomers explains the
      cardioprotective reduction in non-HDL cholesterol observed in human ASGR1
      loss-of-function heterozygotes?
    experts:
      - Paul H Weigel
      - Martin Spiess
      - Punit P Seth
  - question: >-
      Does secreted soluble ASGR1 isoform H1b (sASGPR) act as a competitive decoy
      modulating hepatocyte clearance of desialylated glycoproteins in vivo?
    experts:
      - Martin Spiess
suggested_experiments:
  - hypothesis: >-
      ASGR1 homo-oligomers and ASGR1/ASGR2 hetero-oligomers differ in their affinity
      and endocytic uptake kinetics for bi-, tri-, and tetra-antennary endogenous
      desialylated plasma glycoproteins.
    description: >-
      Generate isogenic human hepatocyte lines expressing either ASGR1 alone or
      defined stoichiometric ratios of ASGR1 and ASGR2, and measure binding constants
      and clathrin-mediated internalization rates across a panel of defined
      multi-antennary Gal- and GalNAc-terminated glycopeptides and plasma
      glycoproteins.
    experiment_type: Surface plasmon resonance and quantitative live-cell endocytosis assay
  - hypothesis: >-
      Reversible S-palmitoylation of ASGR1 at Cys-36 dynamically regulates its
      partitioning into clathrin-coated pits and uncoupling of cargo in early sorting
      endosomes.
    description: >-
      Perform acyl-biotin exchange and pulse-chase endocytosis imaging in primary human
      hepatocytes expressing wild-type versus C36S mutant ASGR1 to quantify clathrin
      adaptor AP-2 recruitment and endosomal ligand-receptor dissociation rates.
    experiment_type: Acyl-biotin exchange and live-cell TIRF/confocal microscopy
