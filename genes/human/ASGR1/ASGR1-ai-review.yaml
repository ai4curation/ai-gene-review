  - id: PMID:10734069
    title: >-
      Basolateral sorting signals differ in their ability to redirect apical proteins
      to the basolateral cell surface.
    full_text_unavailable: true
    findings:
      - statement: >-
          ASGR1 (H1) is a basolateral plasma membrane protein whose cytoplasmic domain
          contains a basolateral sorting signal.
        supporting_text: >-
          We have generated chimeric proteins with the cytoplasmic domain of either the
          asialoglycoprotein receptor H1 or the transferrin receptor, two basolateral
          proteins, fused to the transmembrane and exoplasmic segments of
          aminopeptidase N, an apical protein, and analyzed them in Madin-Darby canine
          kidney cells.
        reference_section_type: ABSTRACT
  - id: PMID:11543633
    title: >-
      Cloning, mapping, and characterization of a human homologue of the yeast
      longevity assurance gene LAG1.
    full_text_unavailable: true
    findings:
      - statement: >-
          Yeast two-hybrid screening and GST pull-down assays identified interactions
          between LASS2 (CERS2) and membrane-associated receptors or transporters.
        supporting_text: >-
          Yeast two-hybrid screening and glutathione S-transferase pull-down assays
          showed that the LASS2 protein interacts with several membrane-associated
          receptors or transporters.
        reference_section_type: ABSTRACT
  - id: PMID:12171918
    title: >-
      Nonpalmitoylated human asialoglycoprotein receptors recycle constitutively but
      are defective in coated pit-mediated endocytosis, dissociation, and delivery of
      ligand to lysosomes.
    full_text_unavailable: true
    findings:
      - statement: >-
          The human hepatic asialoglycoprotein receptor (composed of subunits H1/ASGR1
          and H2/ASGR2) internalizes desialylated glycoproteins at the plasma membrane
          via the clathrin-coated pit pathway for lysosomal degradation.
        supporting_text: >-
          The hepatic asialoglycoprotein receptor (ASGP-R) internalizes desialylated
          glycoproteins via the clathrin-coated pit pathway and mediates their
          delivery to lysosomes for degradation. The human ASGP-R contains two
          subunits, H1 and H2.
        reference_section_type: ABSTRACT
      - statement: >-
          Palmitoylation of ASGR1 (Cys-36) and ASGR2 (Cys-54 and Cys-58) is required
          for efficient clathrin-dependent endocytosis, ligand dissociation, and
          lysosomal delivery.
        supporting_text: >-
          We conclude that palmitoylation of the ASGP-R is required for its efficient
          endocytosis of ligand by the clathrin-dependent endocytic pathway and, in
          particular, for the proper dissociation and delivery of ligand to lysosomes.
        reference_section_type: ABSTRACT
  - id: PMID:21988832
    title: >-
      Toward an understanding of the protein interaction network of the human liver.
    findings:
      - statement: >-
          High-throughput yeast two-hybrid screen of human liver proteins mapping
          binary protein-protein interactions.
        supporting_text: >-
          In this study, we map the interactions of an unbiased selection of 5026 human
          liver expression proteins by yeast two-hybrid technology and establish a
          human liver protein interaction network (HLPN) composed of 3484 interactions
          among 2582 proteins.
        reference_section_type: ABSTRACT
  - id: PMID:29069408
    title: >-
      Asialoglycoprotein receptor 1 mediates productive uptake of N-acetylgalactosamine-conjugated
      and unconjugated phosphorothioate antisense oligonucleotides into liver
      hepatocytes.
    findings:
      - statement: >-
          ASGR1 is a cell-surface C-type lectin receptor that binds terminal GalNAc
          and mediates receptor-mediated endocytosis of desialylated glycoproteins and
          GalNAc-conjugated antisense oligonucleotides into hepatocytes.
        supporting_text: >-
          GalNAc conjugation confers high affinity binding to the Asialoglycoprotein
          Receptor (ASGR), a cell surface C-type lectin that functions as a scavenger
          receptor and is able to remove desialylated glycoproteins from circulation
        reference_section_type: INTRODUCTION
      - statement: >-
          ASGR1 homo-oligomers are sufficient for GalNAc-mediated endocytosis at the
          cell surface, whereas co-expression of ASGR1 incorporates ASGR2 into
          ASGR1/ASGR2 heterodimers that are exported from the ER to the plasma
          membrane.
        supporting_text: >-
          This data parallels previous reports demonstrating that co-expression of
          ASGR1 results in ASGR2 incorporation into ASGR1/ASGR2 heterodimers that are
          then exported from the ER and are ultimately targeted to the plasma membrane
        reference_section_type: RESULTS
  - id: PMID:32296183
    title: A reference map of the human binary protein interactome.
    findings:
      - statement: >-
          High-throughput yeast two-hybrid interactome screen (HuRI) reporting binary
          protein interactions for human ORFs.
        supporting_text: >-
          Here we present a human 'all-by-all' reference interactome map of human
          binary protein interactions, or 'HuRI'.
        reference_section_type: ABSTRACT
  - id: PMID:8439566
    title: >-
      Determination of mouse major asialoglycoprotein receptor cDNA sequence.
    full_text_unavailable: true
    findings:
      - statement: >-
          Hepatic asialoglycoprotein receptors specifically recognize
          galactose-terminated glycoproteins and mediate their receptor-mediated
          endocytosis.
        supporting_text: >-
          Hepatic lectins (asialoglycoprotein receptors) specifically recognize
          galactose-terminated glycoproteins and mediate endocytosis of these
          molecules.
        reference_section_type: ABSTRACT
  - id: Reactome:R-HSA-8855711
    title: PALM-C36-ASGR1:PALM-C54,58-ASGR2 binds desialated glycoproteins
    findings: []
  - id: file:genes/human/ASGR1/ASGR1-uniprot.txt
    title: UniProtKB record for human ASGR1 (P07306)
    findings:
      - statement: >-
          ASGR1 is a hepatocyte transmembrane receptor that recognizes terminal
          galactose and N-acetylgalactosamine on desialylated plasma glycoproteins and
          mediates their endocytosis.
        record_section: ["CC:FUNCTION"]
        supporting_text: >-
          Transmembrane protein predominantly expressed on hepatocytes that plays a
          key role in endocytosis of plasma glycoproteins that lack terminal sialic
          acid residues. Specifically recognizes terminal galactose and
          N-acetylgalactosamine residues, facilitating the clearance of desialylated
          glycoproteins from circulation.
      - statement: >-
          Isoform H1a is a single-pass type II plasma membrane protein.
        record_section: ["CC:SUBCELLULAR LOCATION"]
        supporting_text: >-
          [Isoform H1a]: Cell membrane {ECO:0000269|PubMed:12171918}; Single-pass
          type II membrane protein.
      - statement: >-
          Calcium ions are required for ASGR1 carbohydrate ligand binding.
        record_section: ["CC:MISCELLANEOUS"]
        supporting_text: >-
          Calcium is required for ligand binding.
  - id: file:genes/human/ASGR1/ASGR1-notes.md
    title: Research and curation notes for human ASGR1
    findings: []
