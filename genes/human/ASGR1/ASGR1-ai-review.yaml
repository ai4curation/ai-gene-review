id: P07306
gene_symbol: ASGR1
product_type: PROTEIN
status: COMPLETE
aliases:
  - CLEC4H1
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  Asialoglycoprotein receptor 1 (ASGR1, also known as hepatic lectin H1 or HL-1) is
  a 291-amino-acid single-pass type II transmembrane C-type lectin that serves as the
  major subunit of the hepatic asialoglycoprotein receptor (Ashwell-Morell receptor)
  on the sinusoidal (basolateral) plasma membrane of hepatocytes. ASGR1 comprises an
  N-terminal cytoplasmic tail (residues 1-40) harboring a canonical tyrosine-based
  clathrin-coated pit internalization signal (YQDL, residues 5-8) and a palmitoylated
  cysteine (Cys-36), a single transmembrane signal-anchor helix (residues 41-61), an
  extracellular coiled-coil stalk region (residues 61-123) that mediates assembly into
  homo-oligomers and hetero-oligomers with the minor subunit ASGR2 (H2), and a
  C-terminal extracellular C-type lectin carbohydrate-recognition domain (residues
  161-278). Its carbohydrate-recognition domain coordinates three calcium ions and
  carries a conserved QPD (Gln240-Pro241-Asp242) motif that specifically recognizes
  terminal D-galactose and N-acetyl-D-galactosamine (GalNAc) residues on desialylated
  plasma glycoproteins. Upon ligand binding at the external face of the hepatocyte
  plasma membrane, ASGR1 mediates clathrin-dependent receptor-mediated endocytosis of
  cargo into sorting endosomes, where acidification and Ca2+ depletion trigger ligand
  dissociation for lysosomal degradation while the receptor recycles to the cell
  surface. In addition to the canonical membrane-anchored isoform H1a (P07306-1), an
  alternatively spliced isoform H1b (P07306-2) lacking the transmembrane region is
  secreted as soluble asialoglycoprotein receptor.
alternative_products:
  - name: H1a
    id: P07306-1
    description: >-
      Canonical 291-amino-acid membrane-anchored major subunit of the hepatic
      asialoglycoprotein receptor localized to the basolateral plasma membrane of
      hepatocytes.
  - name: H1b
    id: P07306-2
    sequence_note: VSP_044480
    description: >-
      Soluble secreted isoform (sASGPR) in which residues 24-63 spanning the
      transmembrane signal-anchor domain are replaced by a single Asp residue
      (24-63 -> D, VSP_044480) due to alternative splicing; secreted by
      hepatocytes and retains carbohydrate-binding activity in the extracellular space.
