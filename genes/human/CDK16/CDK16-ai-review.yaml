id: Q00536
gene_symbol: CDK16
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'CDK16 (PCTAIRE-1) is an atypical, cyclin-activated, proline-directed serine/threonine protein kinase of the PCTAIRE branch of the CDK family, highly expressed in brain and testis. It consists of a disordered N-terminal extension, a central kinase domain and a short C-terminal tail. Unlike classical CDKs it is activated by cyclin Y (CCNY) or cyclin Y-like 1 (CCNYL1): cyclin Y phosphorylated at Ser100/Ser326 and bound to a 14-3-3 dimer binds the CDK16 kinase domain and N-terminal extension, raising activity more than 100-fold, while phosphorylation of CDK16 Ser153 (PKA) blocks cyclin binding. Myristoylated cyclin Y recruits CDK16 from the cytoplasm to the inner face of the plasma membrane. CDK16 prefers substrates with Pro at +1 and a basic residue at +4; reported substrates include NSF Ser569, p27/CDKN1B Ser10, PRC1 Thr481 and cyclin Y Ser336. In rodents it modulates regulated exocytosis and early secretory traffic, dendrite and neurite growth, and insulin secretion, and in
  mouse it is required with CCNYL1 for male fertility (sperm annulus and spermiation). In human cells the cyclin Y/CDK16 complex acts downstream of AMPK to promote autophagy, and it supports proliferation of some cancer cell lines.'
