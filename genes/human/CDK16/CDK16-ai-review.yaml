suggested_questions:
- question: Which CDK16 substrate mediates its effect on autophagy in non-neuronal human cells, and is WIPI2B S395 phosphorylation conserved outside neurons?
- question: Should rodent-derived process annotations (exocytosis, neuron projection development, growth hormone secretion) be represented as regulation terms across the PCTAIRE PAINT node PTN004656776?
- question: Does CDK16 have any nuclear activity that would justify the CMGC-wide nucleus IBA, or is its nuclear absence a PCTAIRE-branch property?
suggested_experiments:
- description: Phosphoproteomics in CCNYL1/CDK16 knockout mouse spermatids, using analog-sensitive CDK16, to identify the substrates that act at the sperm annulus.
  hypothesis: CDK16-CCNYL1 phosphorylates septin-ring or annulus-associated proteins required for annulus positioning and spermiation.
  experiment_type: chemical-genetic phosphoproteomics
- description: Test whether endogenous human CDK16 phosphorylates NSF Ser569 in neurons or β-cells, and whether NSF S569A rescues the exocytosis phenotype of CDK16 loss.
  hypothesis: NSF Ser569 phosphorylation is the mechanism by which CDK16 restrains regulated exocytosis in human cells.
  experiment_type: phosphosite-specific rescue and secretion assay
