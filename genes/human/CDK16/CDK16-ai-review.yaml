  review:
    summary: PAINT IBA for nucleus (is_active_in) from the broad CMGC node PTN000623091, seeded by many CDKs and MAPKs.
    action: MARK_AS_OVER_ANNOTATED
    reason: There is no CDK16-specific evidence of nuclear activity. Endogenous and tagged CDK16 are cytoplasmic and are recruited to the plasma membrane by cyclin Y; CDK16 inhibition causes its substrate PRC1 to move into the nucleus rather than CDK16 acting there. The nuclear role belongs to other branches of the node (e.g. transcriptional CDKs).
    supported_by:
    - reference_id: PMID:10511311
      supporting_text: Indirect immunofluorescence indicated that PCTAIRE-1 exhibits cytoplasmic distribution throughout the cell cycle.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN000623091
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Broad CMGC ancestor whose nuclear IBD is grounded in transcriptional/cell-cycle CDKs and MAPKs; the PCTAIRE branch, including CDK16, has only cytoplasmic and plasma-membrane localisation evidence.
