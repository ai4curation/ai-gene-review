- term:
    id: GO:0015078
    label: proton transmembrane transporter activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR008386
  review:
    summary: Proton transmembrane transporter activity (IEA, InterPro ATP synthase subunit e family).
      UniProt describes the membrane proton channel as the whole F(o) domain, built from subunits c, a,
      8, e, f, g, k and j. The activity is a property of that assembled sector. The subunit e evidence
      is about dimer and oligomer stability (loss of e removes its partner subunit g and destabilizes
      dimers), not about proton conduction. For an accessory subunit, contributes_to rotary ATP synthase
      activity is the right statement; an unqualified 'enables' transporter activity overstates it. Over-annotation.
    action: MARK_AS_OVER_ANNOTATED
    reason: '[file:human/ATP5ME/ATP5ME-uniprot.txt "CC       a membrane F(0) domain - the membrane proton
      channel (subunits c, a, 8,"] [PMID:42138716 "ATP5I maintains the stability of F₁F₀-ATP synthase
      dimers, which is crucial for shaping cristae morphology."] [PMID:42138716 "The results show that
      all ATP5I knockout clones (ATP5I KO) did not express ATP5I or its partner ATP5L (subunit g in yeast)
      and had lower levels of ATP5O (oligomycin sensitivity-conferring protein, OSCP in yeast) (Figure
      2A)."]'
    supported_by:
    - reference_id: file:human/ATP5ME/ATP5ME-uniprot.txt
      supporting_text: CC       a membrane F(0) domain - the membrane proton channel (subunits c, a, 8,
    - reference_id: PMID:42138716
      supporting_text: ATP5I maintains the stability of F₁F₀-ATP synthase dimers, which is crucial for
        shaping cristae morphology.
    - reference_id: PMID:42138716
      supporting_text: The results show that all ATP5I knockout clones (ATP5I KO) did not express ATP5I
        or its partner ATP5L (subunit g in yeast) and had lower levels of ATP5O (oligomycin sensitivity-conferring
        protein, OSCP in yeast) (Figure 2A).
