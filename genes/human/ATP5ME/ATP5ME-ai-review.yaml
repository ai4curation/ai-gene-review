- term:
    id: GO:0033615
    label: mitochondrial proton-transporting ATP synthase complex assembly
  evidence_type: IMP
  original_reference_id: PMID:42138716
  qualifier: involved_in
  review:
    summary: Mitochondrial proton-transporting ATP synthase complex assembly (NEW, IMP). In ATP5I-knockout
      human cells, partner subunit g is lost, OSCP falls, dimeric and monomeric ATP synthase become scarce,
      and vestigial assembly intermediates accumulate. Re-expressing ATP5I restores the missing subunits.
      As a structural F(o) subunit at the dimer-forming membrane region, subunit e does part of the work
      of building the complete, oligomer-competent enzyme. This matches the in-repo ATP5MD (subunit k)
      review, which proposes the same term on similar evidence. GOA does not yet carry it for any F(o)
      accessory subunit.
    action: NEW
    reason: '[PMID:42138716 "The results show that all ATP5I knockout clones (ATP5I KO) did not express
      ATP5I or its partner ATP5L (subunit g in yeast) and had lower levels of ATP5O (oligomycin sensitivity-conferring
      protein, OSCP in yeast) (Figure 2A)."] [PMID:42138716 "This increase in assembly intermediates of
      the F₁F₀-ATP synthase upon metformin treatment mimics the phenotype of ATP5I knockout cells, where,
      in addition, the dimeric and monomeric forms of the enzyme are also scarce (Figure 2G)."] [PMID:42138716
      "Notably, metformin disrupts F₁F₀-ATP synthase oligomerization, leading to the accumulation of vestigial
      assembly intermediates in pancreatic and osteosarcoma cancer cells, a phenotype also observed upon
      ATP5I inactivation in pancreatic cancer cells."]'
    supported_by:
    - reference_id: PMID:42138716
