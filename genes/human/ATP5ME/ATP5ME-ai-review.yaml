- id: PMID:42138716
  title: The role of ATP synthase subunit e (ATP5I) in mediating the metabolic and antiproliferative effects
    of metformin in cancer cells.
  findings:
  - statement: ATP5I stabilizes ATP synthase dimers for cristae shape.
    supporting_text: ATP5I maintains the stability of F₁F₀-ATP synthase dimers, which is crucial for shaping
      cristae morphology.
  - statement: ATP5I knockout loses subunit g and lowers OSCP.
    supporting_text: The results show that all ATP5I knockout clones (ATP5I KO) did not express ATP5I
      or its partner ATP5L (subunit g in yeast) and had lower levels of ATP5O (oligomycin sensitivity-conferring
      protein, OSCP in yeast) (Figure 2A).
  - statement: ATP5I knockout alters morphology and inhibits OXPHOS.
    supporting_text: We demonstrate that ATP5I interacts with a biguanide analogue in vitro, and disabling
      its expression by CRISPR-Cas9 in pancreatic cancer cells leads to the same phenotype as biguanide-treated
      cells, including mitochondrial morphology alterations, reduction of the NAD+/NADH ratio, inhibition
      of oxidative phosphorylation (OXPHOS), rescue of respiration by uncouplers, and a compensatory increase
      in glycolysis.
  - statement: ATP5I loss leaves oligomerization intermediates.
    supporting_text: Notably, metformin disrupts F₁F₀-ATP synthase oligomerization, leading to the accumulation
      of vestigial assembly intermediates in pancreatic and osteosarcoma cancer cells, a phenotype also
      observed upon ATP5I inactivation in pancreatic cancer cells.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text; human cancer-cell knockout study.
