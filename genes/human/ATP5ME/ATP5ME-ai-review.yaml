id: P56385
gene_symbol: ATP5ME
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ATP5ME (ATP5I) encodes subunit e of mitochondrial F1F0 ATP synthase (complex V). It is a
  small accessory subunit of the membrane F(o) domain and assembles with the stator-stalk subunits b and
  g. Subunit e stabilizes ATP synthase dimers and higher oligomers, which bend the inner membrane at cristae
  ridges. Its loss in human cells destabilizes oligomers, leaves assembly intermediates, alters mitochondrial
  morphology and inhibits oxidative phosphorylation. It has been implicated as a target through which
  biguanides such as metformin affect complex V.
