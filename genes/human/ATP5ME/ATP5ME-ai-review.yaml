suggested_questions:
- question: Should dimer-stabilizing F(o) subunits (e, g, k) carry a cristae formation or ATP synthase
    dimerization process term? None of them do at present, although loss of subunit e destabilizes oligomers
    and alters cristae.
suggested_experiments:
- description: Use cryo-ET of ATP5ME-knockout mitochondria to quantify ATP synthase dimer rows and cristae
    curvature, and test whether metformin binding to subunit e directly loosens dimer contacts in purified
    complex V.
