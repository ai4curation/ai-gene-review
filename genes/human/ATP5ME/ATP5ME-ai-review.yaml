  review:
    summary: Proton motive force-driven atp synthesis (IEA). As a complex V subunit that stabilizes ATP
      synthase dimers, subunit e takes part in oxidative ATP synthesis. Its knockout inhibits OXPHOS.
      Core process.
    action: ACCEPT
    reason: '[file:human/ATP5ME/ATP5ME-uniprot.txt "CC   -!- FUNCTION: Subunit e, of the mitochondrial
      membrane ATP synthase complex"] [PMID:42138716 "We demonstrate that ATP5I interacts with a biguanide
      analogue in vitro, and disabling its expression by CRISPR-Cas9 in pancreatic cancer cells leads
      to the same phenotype as biguanide-treated cells, including mitochondrial morphology alterations,
      reduction of the NAD+/NADH ratio, inhibition of oxidative phosphorylation (OXPHOS), rescue of respiration
      by uncouplers, and a compensatory increase in glycolysis."]'
