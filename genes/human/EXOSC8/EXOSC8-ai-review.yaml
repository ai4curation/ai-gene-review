core_functions:
  - description: EXOSC8 is a non-catalytic RNase PH-like scaffold subunit of the Exo-9 RNA exosome
      core, contributing to substrate engagement by DIS3-, DIS3L- and EXOSC10-containing exosome
      complexes that process and degrade RNAs in the nucleoplasm, nucleolus and cytosol.
    in_complex:
      id: GO:0000178
      label: exosome (RNase complex)
    directly_involved_in:
      - id: GO:0006401
        label: RNA catabolic process
      - id: GO:0006396
        label: RNA processing
      - id: GO:0071028
        label: nuclear mRNA surveillance
      - id: GO:0071035
        label: nuclear polyadenylation-dependent rRNA catabolic process
    locations:
      - id: GO:0005654
        label: nucleoplasm
      - id: GO:0005730
        label: nucleolus
      - id: GO:0005829
        label: cytosol
    supported_by:
      - *id001
      - *id007
      - *id005
    molecular_function:
      id: GO:0035925
      label: mRNA 3'-UTR AU-rich region binding
