id: Q96B26
gene_symbol: EXOSC8
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: EXOSC8 encodes the human RRP43/OIP2 subunit of the catalytically inert nine-subunit RNA
  exosome core. EXOSC8 pairs with EXOSC5 in the RNase PH-like ring, helps form the RNA-binding
  scaffold used by DIS3-, DIS3L-, and EXOSC10-containing exosome complexes, and its RNase PH domain
  can bind AU-rich RNA elements.
