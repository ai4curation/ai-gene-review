  - term:
      id: GO:0000467
      label: exonucleolytic trimming to generate mature 3'-end of 5.8S rRNA from tricistronic rRNA
        transcript (SSU-rRNA, 5.8S rRNA, LSU-rRNA)
    evidence_type: IBA
    original_reference_id: GO_REF:0000033
    qualifier: involved_in
    supporting_entities:
      - PANTHER:PTN000120504
      - SGD:S000000631
      - SGD:S000002269
      - SGD:S000002688
    review:
      summary: Accept this conserved RNA exosome processing or decay process.
      action: ACCEPT
      reason: As a core RNA exosome component, the protein contributes to nuclear and cytoplasmic
        RNA processing and 3-to-5 decay. The term is consistent with the PAINT placement and with
        the human exosome core acting as the substrate-binding scaffold for catalytic subunits.
      supported_by:
        - *id001
        - reference_id: file:interpro/panther/PTHR11097/PTHR11097-paint.tsv
          supporting_text: "PTHR11097\tPTN000120504\tGO:0000467\tP\tIBD\tfalse"
  - term:
      id: GO:0001650
      label: fibrillar center
    evidence_type: IDA
    original_reference_id: GO_REF:0000052
    qualifier: located_in
    review:
      summary: Keep the more specialized nuclear localization as non-core.
      action: KEEP_AS_NON_CORE
      reason: The row records a more specialized nuclear signal for an RNA exosome core subunit. It
        is compatible with a nucleoplasmic/nucleolar exosome protein, but the conserved core
        function is best represented by the nuclear and nucleolar RNA exosome complex rows.
      supported_by:
        - *id001
  - term:
      id: GO:0004532
      label: RNA exonuclease activity
    evidence_type: IDA
    original_reference_id: PMID:17174896
    qualifier: enables
    negated: true
    review:
      summary: Accept the NOT RNA exonuclease row for this catalytically inert core subunit.
      action: ACCEPT
      reason: The six RNase PH-like subunits in the human Exo-9 core are catalytically inert;
        hydrolytic activity comes from associated DIS3, DIS3L and EXOSC10/RRP6 catalytic subunits.
      supported_by:
        - &id007
          reference_id: PMID:20531386
          supporting_text: It consists of a nine-subunit catalytically inert core that serves a
            structural function and participates in substrate recognition.
