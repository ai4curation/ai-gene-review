id: P25054
gene_symbol: APC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: APC is a large, multidomain tumor suppressor that coordinates beta-catenin turnover and cytoskeletal
  organization. Its central repeats bind beta-catenin and its SAMP motifs engage AXIN in the cytoplasmic
  destruction complex, helping recruit and present beta-catenin to kinases and ubiquitination machinery.
  Its C-terminal regions bind microtubules, associate with microtubule-end proteins and directly recruit
  actin monomers to nucleate filaments. These activities contribute to cell polarity, migration and accurate
  mitosis. APC also binds regulatory partners, including Asef-family nucleotide-exchange factors, whose
  autoinhibition it can relieve. APC occupies cytoplasmic, cortical, junctional and nuclear pools; truncating
  variants disrupt several of these separable functions and underlie familial adenomatous polyposis and
  many sporadic colorectal cancers.
