- id: PMID:10656683
  title: The APC-hDLG complex negatively regulates cell cycle progression from the G0/G1 to S phase.
  findings:
  - statement: APC–DLG interaction contributes to cell-cycle suppression; perturbing the APC C-terminal
      motif weakens the effect.
    supporting_text: 'mutant APC lacking the S/TXV motif exhibited

      weaker cell cycle blocking activity than the intact APC'
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete abstract read. Overexpression and domain-mutant phenotypes support the existing
      cell-cycle context, without an autonomous APC cyclin-kinase inhibitor claim.
- id: PMID:10773885
  title: Regulation and function of the interaction between the APC tumour suppressor protein and EB1.
  findings:
  - statement: The APC basic microtubule-binding region and its EB1-binding region make distinguishable
      contributions to microtubule association.
    supporting_text: the APC basic domain did not contribute to EB1 binding
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete abstract read. C-terminal bacterial fusion, HCT116 and SW480 experiments are
      distinguished; precise fusion-species provenance is not inferred from host cells.
- id: PMID:10811618
  title: Structural basis of the Axin-adenomatous polyposis coli interaction.
  findings:
  - statement: Structures map the APC-binding surface of AXIN to a distinct surface of its RGS-like domain.
    supporting_text: the Axin-APC interaction occurs at a conserved groove
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The complete normal abstract and targeted original indexed Results, Fig2/3/5/6 legends
      and GST pull-down Methods were inspected. The original AXIN RGS-domain/APC SAMP3 experiment and
      official PDB1EMU AXIN organism field and APC peptide mapping to human P25054 support domain-specific
      binding. The canonical cache remains abstract-only; the RGS-like fold does not assign APC G-protein-regulatory
      activity.
- id: PMID:10947987
  title: Asef, a link between the tumor suppressor APC and G-protein signaling.
  findings:
  - statement: APC binding enhances Asef nucleotide-exchange activity; APC is the regulator, not the exchange
      catalyst.
    supporting_text: 'APC enhanced the

      GEF activity of Asef'
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete abstract and targeted indexed original binding Results read. Mouse colon/neuronal
      colocalization and canine MDCK morphological assays are explicit; source construct identity and
      modern partner-isoform correspondence are not fully reconstructed.
- id: PMID:11035805
  title: Adenomatous polyposis coli protein contains two nuclear export signals and shuttles between the
    nucleus and cytoplasm.
  findings:
  - statement: APC has intrinsic nuclear-export signals and shuttles between nucleus and cytoplasm.
    supporting_text: 'mutation of both APC NESs

      resulted in the nuclear accumulation of the full-length'
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete abstract read. Reporter/NES mutation and leptomycin observations directly support
      the localization context; no independent transcription-factor activity is inferred.
- id: PMID:11166179
  title: Binding of the adenomatous polyposis coli protein to microtubules increases microtubule stability
    and is regulated by GSK3 beta phosphorylation.
  findings:
  - statement: APC binding stabilizes microtubules and is modulated by GSK3-mediated APC phosphorylation.
    supporting_text: 'binding of APC to microtubules increases microtubule

      stability in vivo and in vitro'
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete abstract read. Direct binding and stabilization are explicitly reported, but
      detailed original reagent provenance was not reconstructed.
- id: PMID:11283619
  title: A role for the Adenomatous Polyposis Coli protein in chromosome segregation.
  findings:
  - statement: APC participates in kinetochore-associated microtubule organization and associates with
      checkpoint components.
    supporting_text: 'APC localizes to the ends of microtubules embedded in kinetochores and

      forms a complex with the checkpoint proteins Bub1 and Bub3'
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete abstract read. Min truncation, kinetochore localization and Bub-complex association
      are explicit. The separate centrosomal annotation remains unadjudicated; Bub association does not
      make APC a kinase.
