suggested_questions:
- question: Which unresolved interaction records establish a source-specific APC domain or regulatory
    mechanism, and which reflect indirect coassembly? Independent positive experiments do not establish
    the exact assay in an unread screen.
- question: How are APC beta-catenin destruction, microtubule organization, actin nucleation and Asef
    activation coordinated between cellular pools and endogenous isoforms?
- question: Which APC constructs and cellular conditions reconcile the intact-destruction-complex model
    with proposed component-disassembly models?
- question: What direct target-specific evidence places APC at centrosomes or in receptor-associated Wnt
    signalosomes, beyond movement of its partners or broad pathway membership?
- question: Would the purified human APC basic-domain filament binding and bundling reported in PMID:17293347
    justify refining broad actin binding to actin filament binding (GO:0051015)? Keep monomer recruitment
    for nucleation distinct from filament binding, and avoid adding a redundant parent/child NEW pair
    without resolving their separate evidence scopes.
suggested_experiments:
- description: Compare matched full-length human APC and separation-of-function mutants in endogenous
    rescue, measuring beta-catenin turnover, actin nucleation, microtubule organization and Asef activation
    separately, with isoform and expression controls.
