- id: PMID:28663347
  title: Adenomatous polyposis coli nucleates actin assembly to drive cell migration and microtubule-induced
    focal adhesion turnover.
  findings:
  - statement: Purified nucleation assays and human full-length separation-of-function rescue distinguish
      APC actin assembly from its microtubule functions.
    supporting_text: Silencing APC led to a significant reduction in F-actin density (fluorescence intensity
      per area) in cells, and these defects were rescued by expression of FL-APC (WT) but not FL-APC (m4)
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete abstract and targeted Results/Fig1–2 plus plasmid-construction and protein-purification
      Methods read. Methods explicitly identify RNAi-refractory full-length human APC/Addgene16507; U2OS
      human hosts, E.coli-expressed APC fragments and rabbit skeletal-muscle actin are distinct. Results
      call m4 L2539A/I2541A whereas Methods call it L2539A/P2541A twice; this within-paper discrepancy
