  label: Homo sapiens
description: 'NTF3 encodes neurotrophin-3, a secreted cystine-knot growth factor that preferentially activates
  NTRK3/TrkC and can also signal through NTRK2 in some contexts. NT-3 supports neuronal survival and neurite
  outgrowth and directly activates TrkC-dependent Ras, MAPK and PI3K-AKT signaling in responsive cells.'
