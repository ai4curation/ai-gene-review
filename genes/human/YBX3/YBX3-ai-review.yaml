id: P16989
gene_symbol: YBX3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: YBX3, also called DbpA or ZONAB, is a cold-shock-domain nucleic-acid-binding protein
  with cytoplasmic, nuclear and junction-associated pools. Its canine ZONAB ortholog binds defined
  RNA motifs in the CDKN1A/p21 3-UTR downstream of Rho-family stress signaling to stabilize p21 mRNA
  and enhance p21 translation, while human dbpA was originally described as a Y-box/DNA-binding
  cold-shock-domain protein.
