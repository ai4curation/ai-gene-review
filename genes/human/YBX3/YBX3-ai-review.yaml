suggested_questions:
- question: Which human mRNAs besides CDKN1A are direct YBX3/ZONAB targets during Rho- and
    GEF-H1-dependent epithelial stress responses?
suggested_experiments:
- description: Combine YBX3 CLIP-seq with RhoA or GEF-H1 perturbation and transcript half-life
    measurements to define direct 3'-UTR targets of the cytoplasmic stress-response pathway.
