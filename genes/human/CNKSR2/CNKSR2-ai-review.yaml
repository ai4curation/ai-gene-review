  review:
    summary: Refine the EGFR interaction to epidermal growth factor receptor binding.
    action: MODIFY
    reason: Actual human-library Methods and Results identify Cnk2 as a positive EGFR-WT interactor in
      the mammalian membrane two-hybrid assay and confirm the pair by tagged coimmunoprecipitation. Cnk2
      has similar binding patterns with wild-type and tested oncogenic EGFR variants. The exact two MINT
      records retain the assay and construct tags. The detailed TACC3-dependent cancer mechanisms in the
      same paper are not assigned to CNKSR2.
