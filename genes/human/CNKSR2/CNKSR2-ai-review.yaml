core_functions:
- description: CNKSR2 acts as an organizing component of postsynaptic protein complexes. Long-form MAGUIN
    self-association and its terminal PDZ-binding motif enable Densin–PSD-95 assembly; complementary neuronal
    experiments show recruitment of signaling partners to membranes and organization of postsynaptic specializations.
    The direct ternary-assembly mechanism is established with rat fragments following a human-library
    screen, while mouse/rat neuronal studies support conserved function. The human short products lacking
    the long C terminus do not inherit every tested interaction. The scaffold does not itself supply kinase,
    GEF or GAP catalysis.
  molecular_function:
    id: GO:0140378
    label: protein complex scaffold activity
  directly_involved_in:
  - id: GO:0099084
    label: postsynaptic specialization organization
  locations:
  - id: GO:0099147
    label: extrinsic component of postsynaptic density membrane
  supported_by:
  - reference_id: PMID:12390249
  - reference_id: PMID:24656827
  - reference_id: PMID:32235845
  - reference_id: PMID:36803960
suggested_questions:
- question: Which human CNKSR2 products assemble endogenous Densin–PSD-95 complexes, and which retain
    the membrane-recruitment functions independently of the long C-terminal motif?
- question: How does CNKSR2 partition Vilse, TNIK and Raf/Rlf signaling complexes in native human neurons,
    and which interactions coexist within the same assembly?
suggested_experiments:
- description: Replace endogenous CNKSR2 in human neurons with matched-expression long and short products,
    then quantify endogenous Densin/PSD-95 complex recovery, partner localization and postsynaptic protein
    clusters. Include terminal-motif and self-association-region mutants and an unrescued knockout control.
  hypothesis: Long-tail-dependent PDZ assembly and membrane recruitment use separable interfaces, allowing
    selected short products to retain some scaffold functions while losing Densin/PSD-95 assembly.
