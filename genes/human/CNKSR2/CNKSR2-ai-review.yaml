id: Q8WXI2
gene_symbol: CNKSR2
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CNKSR2 is a multidomain neuronal scaffold that organizes postsynaptic protein assemblies
  and positions signaling partners near membranes. Its long C-terminal form binds PDZ-containing proteins
  through a terminal motif and supports complexes containing Densin and PSD-95. Mammalian neuronal studies
  link CNK2-mediated recruitment of regulators such as Vilse and TNIK to postsynaptic organization and
  spatial control of signaling. Human CNK2 also binds Raf, Rlf and EGFR. Alternative products differ in
  internal domains and the long C-terminal interaction region, so these activities are not established
  uniformly for every product. Pathogenic variants cause Houge-type X-linked syndromic intellectual developmental
  disorder, with developmental and speech delay and early-onset seizures.
