  - UniProtKB:Q8ML92
  review:
    summary: Refine the positive cross-species SAM-fragment interaction to SAM domain binding.
    action: MODIFY
    reason: Purified human CNK2 residues 5–84 bind the Drosophila HYP SAM domain (residues 21–98). Original
      pull-down controls, size exclusion, surface plasmon resonance, crystallography and interface mutations
      establish the SAM-domain contact directly. GO:0032093 identifies the experimentally recognized domain
      class; the observed discrete 1:1 heterodimer remains a property of this same assay rather than a
      second replacement. The original fly partner and human fragment scope are preserved. Cellular RAF-pathway
      rescue uses fly proteins and does not establish a native human HYP/KSR complex or human kinase activity.
    supported_by:
    - reference_id: PMID:18287031
    proposed_replacement_terms:
    - id: GO:0032093
      label: SAM domain binding
