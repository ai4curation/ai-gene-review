  review:
    summary: Refine the Densin interaction to PDZ-domain binding.
    action: MODIFY
    reason: The original human brain-library screen recovered human MAGUIN-1 fragments with the Densin
      C-terminal PDZ region; the exact positive MINT record preserves that source pair. Subsequent binding-site
      and ternary-complex experiments used rat MAGUIN-1 fragments, with loss of binding after deleting
      terminal THV. This supports the specific domain interaction while preserving human screening versus
      rat mechanistic scope. The terminal motif is absent from current human products Q8WXI2-2 and -4.
    supported_by:
    - reference_id: PMID:12390249
      supporting_text: the ternary complex assembly of these proteins
