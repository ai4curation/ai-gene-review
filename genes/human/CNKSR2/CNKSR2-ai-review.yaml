- id: PMID:12390249
  title: Densin-180, a synaptic protein, links to PSD-95 through its direct interaction with MAGUIN-1.
  findings:
  - statement: MAGUIN-1 connects Densin and PSD-95 through terminal PDZ binding and self-association.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'The selected cache remains abstract-only. Authentic indexed original Results/Methods
      were inspected separately: a human brain-library screen preceded mechanistic assays using rat MAGUIN-1
      668–1032 with human Densin/PSD-95. Tail deletion, self-association-region deletion and absence-of-MAGUIN
      controls establish ternary assembly; dimer versus multimer is unresolved. The positive MINT pair
      has a Densin-region mapping discrepancy relative to the primary negative control; the underlying
      positive experiment remains valid.'
- id: PMID:14597674
  title: Human homologue of Drosophila CNK interacts with Ras effector proteins Raf and Rlf.
  findings:
  - statement: Human CNK2 occupies membrane and cytoplasmic fractions and binds Raf and Rlf signaling
      proteins.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The complete authentic abstract and a separately recovered original first-page excerpt
      support the positive human CNK2 findings. Complete Methods/Results were not recovered after bounded
      attempts. Detailed phosphorylation mechanism, native stoichiometry and full construct equivalence
      are not inferred.
- id: PMID:18287031
  title: CNK and HYP form a discrete dimer by their SAM domains to mediate RAF kinase signaling.
  findings:
  - statement: Human CNK2 and fly HYP SAM fragments form a discrete heterodimer, with explicit cross-species
      limits.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The main-selected abstract is preserved. Genuine fresh normal full text was inspected
      separately, including human CNK2 5–84/fly HYP 21–98 recombinant Methods, binding and structural
      Results. Functional S2 signaling assays use fly proteins; human 2–485 plus fly HYP does not bind
      fly KSR in the reported assay.
