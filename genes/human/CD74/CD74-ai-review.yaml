id: P04233
gene_symbol: CD74
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'CD74, the MHC class II-associated invariant chain (Ii), is a type II transmembrane glycoprotein
  with a short cytoplasmic N-terminal tail carrying dileucine endosomal sorting motifs, a single transmembrane
  segment and a large lumenal C-terminal region containing the CLIP segment and a trimerization domain.
  In the endoplasmic reticulum, Ii trimers nucleate the assembly of nine-chain complexes with MHC class
  II alpha-beta dimers: the CLIP segment occupies the peptide-binding groove, preventing premature peptide
  loading, while the cytoplasmic tail routes the complex through the Golgi to endosomal MHC class II compartments,
  where Ii is proteolytically degraded and CLIP is exchanged for antigenic peptide by HLA-DM. A minor
  fraction of CD74 escapes to the plasma membrane, where its lumenal domain is displayed extracellularly
  and serves as the receptor for the cytokine MIF; MIF signalling requires CD74 together with CD44 and
  can involve the chemokine receptors CXCR2 and CXCR4, activating ERK and NF-kB and promoting cell survival
  and inflammatory responses. CD74 is thus both an intracellular chaperone of antigen presentation and
  a cell-surface cytokine receptor, and it is also modified as a chondroitin sulfate proteoglycan.'
