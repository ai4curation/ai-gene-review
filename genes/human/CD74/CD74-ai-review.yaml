    label: macrophage migration inhibitory factor receptor complex
  supported_by:
  - reference_id: PMID:17045821
    supporting_text: CD74 alone mediated MIF binding; however, MIF-induced ERK1 and ERK2 kinase phosphorylation
      required the coexpression of full-length CD44
  - reference_id: PMID:12782713
    supporting_text: MIF signal transduction initiated by binding to CD74
suggested_questions:
- question: What proportion of total CD74 reaches the plasma membrane in different cell types, and what
    controls escape from ER retention and endosomal routing?
- question: Does surface CD74 signal as an autonomous receptor, or always as part of heteromeric complexes
    with CD44, CXCR2 or CXCR4?
suggested_experiments:
- hypothesis: Surface CD74 requires a partner transmembrane receptor for every signalling output, and
    alone is only a binding subunit.
  description: Reconstitute CD74 in cells lacking CD44, CXCR2 and CXCR4, measure MIF binding and each
    downstream output (ERK, AKT, NF-kB), and restore partners individually.
