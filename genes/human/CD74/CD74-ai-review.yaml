core_functions:
- description: 'MHC class II chaperone: trimeric CD74 assembles with class II alpha-beta dimers in the
    ER, its CLIP segment occupying the peptide-binding groove to block premature peptide binding, and
    its cytoplasmic dileucine motifs route the complex through the Golgi to endosomal/lysosomal loading
    compartments where CD74 is degraded and CLIP is exchanged for antigenic peptide.'
  molecular_function:
    id: GO:0044183
    label: protein folding chaperone
  directly_involved_in:
  - id: GO:0019882
    label: antigen processing and presentation
  - id: GO:0006886
    label: intracellular protein transport
  - id: GO:0065003
    label: protein-containing complex assembly
  locations:
  - id: GO:0005789
    label: endoplasmic reticulum membrane
  - id: GO:0032588
    label: trans-Golgi network membrane
  - id: GO:0005765
    label: lysosomal membrane
  supported_by:
  - reference_id: PMID:1448172
    supporting_text: The invariant chain, which associates with the major histocompatibility complex (MHC)
      class II molecules in the endoplasmic reticulum, serves two functions important in antigen processing
  - reference_id: PMID:7477400
    supporting_text: The structure shows that the CLIP fragment binds to DR3 in a way almost identical
      to that in which antigenic peptides bind class II histocompatibility glycoproteins
- description: 'Cell-surface receptor for the cytokine MIF: the minor plasma-membrane pool of CD74 binds
    MIF through its exposed lumenal domain and, with CD44 and the chemokine receptors CXCR2/CXCR4, transduces
    the signal to the ERK1/2 cascade and NF-kB, driving survival and inflammatory gene expression.'
  molecular_function:
