core_functions:
  - description: >-
      Cytosolic Hippo scaffold/adaptor activity that brings MST1/2 into SAV1- and WWC-containing complexes,
      promotes MST2 trans-autophosphorylation and shields activated MST2 from STRIPAK-SLMAP PP2A, thereby
      enabling MST1/2-dependent LATS1/2 activation and downstream YAP/TAZ inhibition.
    molecular_function:
      id: GO:0030674
      label: protein-macromolecule adaptor activity
    directly_involved_in:
      - id: GO:0035329
        label: hippo signaling
    locations:
      - id: GO:0005829
        label: cytosol
      - id: GO:0005737
        label: cytoplasm
    supported_by:
      - *id005
      - *id004
      - *id011
  - description: >-
      Positive regulation of the Hippo serine/threonine kinase cascade. SAV1 is not a catalytic kinase
      but activates MST1/2 and LATS1/2 signaling by assembling MST-containing complexes with WWC/LATS
      proteins and by protecting MST2 activation-loop phosphorylation.
    molecular_function:
      id: GO:0043539
      label: protein serine/threonine kinase activator activity
    directly_involved_in:
      - id: GO:0035329
        label: hippo signaling
    locations:
      - id: GO:0005737
        label: cytoplasm
    supported_by:
      - *id005
      - *id004
proposed_new_terms: []
suggested_questions:
  - question: >-
      Should SAV1's Mst2/Nek2A centrosome-disjunction branch be curated with a process annotation, and
      if so should that capture centrosome disjunction itself or the upstream recruitment of Nek2A to
      centrosomes?
  - question: >-
      Does the abstract-only MST2/SAV1/ESR1 study support a direct positive regulation of RNAPII transcription
      annotation, or is the ESR1 transactivation result better treated as a peripheral nuclear-receptor
      branch until the full text is reviewed?
