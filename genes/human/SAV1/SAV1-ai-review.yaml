    evidence_type: EXP
    original_reference_id: PMID:29063833
    qualifier: located_in
    review:
      summary: >-
        SAV1 is a cytoplasmic Hippo scaffold that brings MST1/2 into the WWC-LATS activation module.
      action: ACCEPT
      reason: >-
        Correct core location. SAV1 was detected in the cytoplasm, inhibits the cytoplasmic STRIPAK-SLMAP
