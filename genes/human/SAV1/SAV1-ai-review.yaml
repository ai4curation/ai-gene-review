id: Q9H4B6
gene_symbol: SAV1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  SAV1/WW45 is a WW- and SARAH-domain scaffold protein in the Hippo tumor-suppressor pathway. In the cytosolic
  Hippo kinase cascade, SAV1 binds MST1/2 through SARAH-domain interactions, assembles SAV1-MST2 heterotetramers
  that favor MST2 trans-autophosphorylation, antagonizes STRIPAK-SLMAP PP2A-mediated MST2 dephosphorylation,
  and links MST kinases to WWC-organized LATS1/2 activation modules. These scaffold and kinase-activator
  functions allow upstream Hippo signals to activate LATS1/2 and restrain YAP/TAZ-dependent transcription.
  SAV1 can also localize to the nucleus and has additional reported roles in MST-dependent apoptosis and
  PPARγ-dependent adipocyte differentiation.
