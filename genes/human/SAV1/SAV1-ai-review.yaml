        in the cytoplasm in the WWC/LATS/MST module.
      supported_by: &id003
        - *id002
        - &id004
          reference_id: PMID:29063833
          supporting_text: >-
            SAV1 directly binds to STRIPAK and inhibits its phosphatase activity, protecting MST2 activation-loop
            phosphorylation.
        - &id005
          reference_id: PMID:35429439
          supporting_text: >-
            WWC proteins (WWC1/2/3) directly interact with LATS1/2 and SAV1, and SAV1, in turn, brings
            in MST1/2 to phosphorylate and activate LATS1/2.
