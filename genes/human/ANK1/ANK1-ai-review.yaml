- term:
    id: GO:0006887
    label: exocytosis
  evidence_type: NAS
  original_reference_id: PMID:1833445
  qualifier: involved_in
  review:
    summary: The original localization study does not demonstrate an exocytotic step.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'The original bovine chromaffin-cell paper was inspected beyond its abstract: anti-rat erythrocyte
      ankyrin immunolabeling maps antigen to cytoskeletal filaments and coated membrane, but the authors
      explicitly leave its functional significance unresolved and consider membrane retrieval as well
      as secretion. They do not demonstrate ankyrin performing vesicle tethering, docking, fusion or content
      release, which define exocytosis. The source-specific NAS assertion therefore extends a localization-based
      hypothesis into a process assignment. This does not deny that ANK1 participates in selective cargo
      trafficking supported independently, and it does not identify the bovine antigen as a different
      ankyrin gene. The original-body access and primary URL are documented in the notes; the cached abstract-only
      flag is retained.'
    supported_by:
    - reference_id: PMID:1833445
    - reference_id: file:human/ANK1/ANK1-notes.md
      supporting_text: The bovine chromaffin study maps ankyrin-reactive antigen to filaments and coated
        membrane and leaves secretion versus membrane retrieval unresolved.
    additional_reference_ids:
    - file:human/ANK1/ANK1-notes.md
