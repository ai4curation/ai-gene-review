id: P16157
gene_symbol: ANK1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ANK1 encodes ankyrin-1, also called ankyrin-R, a set of membrane-associated cytoskeletal
  adaptor isoforms generated by alternative promoters and splicing. In erythrocytes, large ankyrin-1 proteins
  bind beta-spectrin and integral membrane proteins including band 3 and Rhesus-complex components, organizing
  the connection between the lipid bilayer and the spectrin–actin skeleton. This linkage supports membrane
  shape and mechanical stability, and ANK1 defects cause hereditary spherocytosis. Ankyrin-R also assists
  trafficking and surface organization of selected membrane proteins and organizes membrane proteins in
  subsets of neurons. Short muscle isoforms associate with the sarcoplasmic reticulum and bind obscurin
  near the contractile apparatus, supporting SR organization through an architecture distinct from the
  large erythroid products.
