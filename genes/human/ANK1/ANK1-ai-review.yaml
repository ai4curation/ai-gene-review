- id: file:human/ANK1/ANK1-notes.md
  title: ANK1 original-paper evidence and follow-up notes
  findings: []
core_functions:
- description: Physically links membrane proteins to the spectrin cytoskeleton and organizes their membrane
    association. The best-defined example is the native human erythrocyte ankyrin-1 complex; cargo binding
    also supports selective delivery of proteins to the plasma membrane.
  molecular_function:
    id: GO:0008093
    label: cytoskeletal anchor activity
  locations:
  - id: GO:0009898
    label: cytoplasmic side of plasma membrane
  in_complex:
    id: GO:0170014
    label: ankyrin-1 complex
  directly_involved_in:
  - id: GO:0007010
    label: cytoskeleton organization
  - id: GO:0072659
    label: protein localization to plasma membrane
  supported_by:
  - *id001
  - *id003
  - *id004
- description: Short muscle isoforms bind obscurin through their cytoplasmic region while associating
    with SR membranes, supporting a membrane-to-cytoskeleton anchoring model distinct from the large erythroid
    spectrin linkage. Independent knockdown/rescue demonstrates network-SR maintenance, although the contribution
    of this particular tether to that phenotype is not fully isolated.
  molecular_function:
    id: GO:0008093
    label: cytoskeletal anchor activity
  locations:
  - id: GO:0016529
    label: sarcoplasmic reticulum
  supported_by:
  - reference_id: PMID:16962094
    supporting_text: 'was able to bind to obscurin in

      yeast two-hybrid assay and in pull-down experiments.'
  - reference_id: PMID:9024692
    supporting_text: These results indicate that the small ankyrins associate tightly and preferentially
      with the sarcoplasmic reticulum of mammalian skeletal muscle.
  - reference_id: PMID:22045734
    supporting_text: Our results show that sAnk1 stabilizes the nSR and that its absence causes the nSR
      to fragment into distinct membrane compartments.
suggested_questions:
- question: Which human ANK1 splice products underlie the rat-derived Z-disc, A-band, sarcolemmal, axolemmal
    and postsynaptic-membrane annotations, and what original experiments support those transfers?
- question: Does an ANK1-specific basolateral epithelial pool support the annotation citing PMID:12409278,
    whose inspected localization experiments use AnkG190-specific antibodies?
- question: How do the historical small-muscle ank1.5/ank1.9 constructs map by sequence to the current
    human alternative-product records?
suggested_experiments:
- description: Use sequence-defined endogenous isoform tagging and isoform-selective rescue to distinguish
    erythroid, neuronal and short muscle ankyrin-1 localization and partner recruitment.
