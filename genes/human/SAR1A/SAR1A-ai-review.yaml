  - InterPro:IPR005225
  - InterPro:IPR006687
  - InterPro:IPR006689
  review:
    summary: SAR1A is a guanine-nucleotide switch protein, so the InterPro GTP
      binding annotation is correct.
    action: ACCEPT
    reason: The small-GTPase and SAR1-family domains support GTP binding, and
      purified human SAR1A has directly measured nucleotide-dependent switching
      and GTP hydrolysis.
    additional_reference_ids:
    - file:human/SAR1A/SAR1A-notes.md
    - PMID:36369712
    supported_by:
    - reference_id: PMID:36369712
      supporting_text: Like other small GTPases, Sar1 functions as a molecular switch controlled by the exchange of GDP and GTP.
    - reference_id: file:human/SAR1A/SAR1A-notes.md
      supporting_text: InterPro small-GTPase and SAR1-family signatures support SAR1A GTP binding, GTPase activity, and ER-to-Golgi protein transport; the InterPro intracellular protein transport parent term is true but GO:0006888 is the more informative child for SAR1A.
