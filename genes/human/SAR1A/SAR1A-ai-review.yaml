core_functions:
- description: >-
    Hydrolyzes GTP as a COPII small-GTPase switch; in the GTP-bound,
    ER-membrane-inserted state, SAR1A recruits SEC23/SEC24 and SEC13/SEC31 to
    build a COPII coat at ER exit sites, couple cargo loading to coat assembly,
    and drive ER-to-Golgi vesicle-mediated transport.
