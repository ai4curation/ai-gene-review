- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:19181664
  qualifier: enables
  supporting_entities:
  - UniProtKB:O35789
  review:
    summary: The physical interaction may be real, but generic protein binding does not
      describe SAR1A's molecular function.
    action: REMOVE
    reason: Protein binding is non-informative here. The cited experiment reports an
      interaction, but SAR1A should be represented by its COPII coat cycle activity and
      by specific trafficking processes rather than by the generic parent binding term.
    supported_by:
    - reference_id: file:human/SAR1A/SAR1A-notes.md
      supporting_text: 'Generic protein binding annotations are removed because SAR1A functions
        as a regulated COPII small GTPase and has many real coat, cargo-adaptor, and high-throughput
        contacts, but GO:0005515 does not capture the informative activity: GTP-dependent
        recruitment and regulation of COPII coat assembly.'
