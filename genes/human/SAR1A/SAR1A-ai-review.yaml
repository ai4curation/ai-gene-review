id: Q9NR31
gene_symbol: SAR1A
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  SAR1A is a conserved COPII-associated small GTPase that cycles between a
  cytosolic GDP-bound state and a GTP-bound state that inserts into the
  endoplasmic reticulum membrane at ER exit sites. GTP-bound SAR1A recruits
  SEC23/SEC24 inner-coat cargo adaptors and SEC13/SEC31 outer-coat components,
  coupling COPII coat assembly, cargo loading, and ER-to-Golgi vesicle-mediated
  transport; biochemical comparisons with SAR1B show paralog-specific
  differences in SEC23/SEC31 engagement and membrane oligomerization. A reported
  leucine/GATOR2/TORC1 signaling role is peripheral to this canonical COPII coat
  cycle.
alternative_products:
- name: '1'
  id: Q9NR31-1
- name: '2'
  id: Q9NR31-2
  sequence_note: VSP_056220
existing_annotations:
- term:
    id: GO:0003924
    label: GTPase activity
  evidence_type: EXP
  original_reference_id: PMID:32358066
  qualifier: enables
  review:
    summary: Direct biochemical work supports SAR1A GTPase activity as part of
      the COPII small-GTPase switch.
    action: ACCEPT
    reason: The cited SAR1 paralog study used purified human SAR1 proteins to
      compare GTP loading and hydrolysis. Its data support SAR1A as a COPII
      small GTPase whose active GTP-bound state recruits COPII components to ER
      membranes.
    supported_by:
    - reference_id: PMID:32358066
      supporting_text: we probed the SAR1 paralogs for GTP hydrolysis using the tryptophan fluorescence assay
    - reference_id: PMID:32358066
      supporting_text: upon GTP binding, recruits the other COPII proteins
- term:
    id: GO:0003924
    label: GTPase activity
  evidence_type: EXP
  original_reference_id: PMID:36369712
  qualifier: enables
  review:
    summary: Purified SAR1A hydrolyzes GTP and its GTPase activity can be
      inhibited by ppGpp in vitro.
    action: ACCEPT
    reason: This biochemical and structural study directly measured intrinsic
      SAR1A GTP hydrolysis and showed that the bacterial alarmone ppGpp binds
      the nucleotide pocket and inhibits SAR1A, confirming the EC 3.6.5.2
      GTPase activity.
    supported_by:
    - reference_id: PMID:36369712
      supporting_text: the intrinsic GTPase activity of Sar1aic was poor
    - reference_id: PMID:36369712
      supporting_text: ppGpp could bind to and inhibit the GTPase activity of human Sar1a
- term:
    id: GO:0003924
    label: GTPase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - CGD:CAL0000177161
  - PANTHER:PTN000195056
  - SGD:S000006139
  - UniProtKB:Q9NR31
  - UniProtKB:Q9Y6B6
  review:
    summary: The PAINT IBA places SAR1A in the conserved Sar1 small-GTPase clade
      for GTPase activity.
    action: ACCEPT
    reason: This IBA is anchored at PANTHER:PTN000195056 and includes SAR1A,
      SAR1B, yeast Sar1 and Candida Sar1 descendants. The placement is
      consistent with direct SAR1A GTPase assays and no SAR1A-specific loss of
      the catalytic GTPase cycle is evident.
    additional_reference_ids:
    - file:human/SAR1A/SAR1A-notes.md
    - file:human/SAR1A/SAR1A-deep-research-openscientist.md
    supported_by:
    - reference_id: file:human/SAR1A/SAR1A-notes.md
      supporting_text: IBA PTN000195056 places SAR1A in a conserved Sar1 clade with experimentally supported GTP hydrolysis, COPII coat membership, COPII vesicle organization, ER-to-Golgi traffic, and ER exit site localization; no SAR1A-specific loss or divergence argues against this placement.
    - reference_id: file:human/SAR1A/SAR1A-deep-research-openscientist.md
      supporting_text: Initiator and mechanical organizer of COPII-coated vesicle budding
- term:
    id: GO:0003924
    label: GTPase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR006689
  review:
    summary: InterPro small-GTPase signatures correctly identify SAR1A as a
      GTPase.
    action: ACCEPT
    reason: The InterPro ARF/SAR and SAR1-family mappings agree with the direct
      SAR1A biochemical evidence for GTP hydrolysis and with the conserved
      small-GTPase switch that drives COPII coat assembly.
    additional_reference_ids:
    - file:human/SAR1A/SAR1A-notes.md
    supported_by:
    - reference_id: file:human/SAR1A/SAR1A-notes.md
      supporting_text: InterPro small-GTPase and SAR1-family signatures support SAR1A GTP binding, GTPase activity, and ER-to-Golgi protein transport; the InterPro intracellular protein transport parent term is true but GO:0006888 is the more informative child for SAR1A.
- term:
    id: GO:0003925
