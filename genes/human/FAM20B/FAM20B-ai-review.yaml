      supporting_text: Fam20B has a unique active site for recognizing Galβ1-4Xylβ1, the initiator disaccharide
        within the tetrasaccharide linker region of proteoglycans
    - reference_id: PMID:29572475
      supporting_text: mutations of the equivalent residues in the human Fam20B protein significantly diminish kinase
        activity
