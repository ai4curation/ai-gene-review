- term:
    id: GO:0016773
    label: phosphotransferase activity, alcohol group as acceptor
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - MGI:MGI:2136853
  - PANTHER:PTN000966557
  - RGD:1311980
  - UniProtKB:O75063
  - UniProtKB:Q8IXL6
  - WB:WBGene00010356
  review:
    summary: Phylogenetic propagation from PANTHER node PTN000966557, a deep node in PTHR12450 whose descendants
      include both FAM20B (SF14) and FAM20C (SF11). Their phosphotransferase activities have been characterised
      experimentally.
    action: ACCEPT
    reason: 'The node placement is sound. FAM20B and FAM20C are catalytically active members whose activities transfer
      a phosphate to a hydroxyl: on xylose for FAM20B, and on Ser/Thr for FAM20C. FAM20B appears among the sources
      because it has its own IDA for this term, and that is expected. The term is general, but GO has no child for
      the linkage-region xylose 2-O-kinase reaction (RHEA:19461). It is therefore the most precise existing term;
      a new term is proposed below.'
    supported_by:
    - &id002
      reference_id: PMID:19473117
      supporting_text: we identified FAM20B as a kinase that phosphorylates the xylose residue in the linkage region
    - reference_id: PMID:29572475
      supporting_text: Similarly to human Fam20B, aqFam20 and hmFam20 are monomers
    - reference_id: file:interpro/panther/PTHR12450/PTHR12450-entries.csv
      supporting_text: O75063,Glycosaminoglycan xylosylkinase,protein,9606,Homo sapiens,Homo sapiens (Human),FAM20B,409,PTHR12450:SF14,GLYCOSAMINOGLYCAN
