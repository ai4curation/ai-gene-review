- term:
    id: GO:0030166
    label: proteoglycan biosynthetic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN002488224
  - ZFIN:ZDB-GENE-040724-125
  review:
    summary: Phylogenetic propagation of proteoglycan biosynthetic process from PTN002488224 on the FAM20B branch
      of PTHR12450 (SF14). Zebrafish fam20b is the experimental donor.
    action: MODIFY
    reason: 'The claim is sound, and FAM20B lies inside the clade that carries it. Human FAM20B catalyses a covalent
      step in building the GAG-protein linkage tetrasaccharide. It 2-O-phosphorylates Xyl in the Gal-Xyl and Gal-Gal-Xyl
      intermediates, which raises B3GALT6 and B3GAT3 activity. Knockout cells cannot complete the linker. FAM20B
      is one of the five enzymes in a reconstituted one-pot linker synthesis, so it does part of the work of the
      process and passes the participation test. GO:0120532 glycosaminoglycan-protein linkage region biosynthetic
      process is part_of chondroitin, dermatan and heparan sulfate proteoglycan biosynthesis, and therefore lies
      below GO:0030166. Its current human annotations are the other linker enzymes: XYLT1, XYLT2, B4GALT7 and B3GALT6.
      The more specific term is recommended. GO:0030166 remains true for every SF14 member, so the IBA itself is
      not wrong.'
    proposed_replacement_terms:
    - id: GO:0120532
      label: glycosaminoglycan-protein linkage region biosynthetic process
    additional_reference_ids:
    - PMID:25331875
    - PMID:37828045
    - PMID:24425863
    supported_by:
    - &id003
      reference_id: PMID:25331875
      supporting_text: Proteoglycans from FAM20B knockout cells contain a truncated tetrasaccharide linkage region
        consisting of a disaccharide capped with sialic acid
    - reference_id: PMID:37828045
      supporting_text: co-incubation of the peptide with all the GAG linker enzymes (XT1, B4GALT7, B3GALT6, B3GAT3
        and FAM20B), their cognate UDP-sugars and ATP
    - reference_id: PMID:37828045
      supporting_text: Next, the galactosyltransferase B4GALT7 adds Gal and the kinase FAM20B phosphorylates Xyl
        to form Gal-Xyl-2-phosphate
    - reference_id: PMID:24425863
      supporting_text: The phosphorylation of Xyl residues by FAM20B enhances the formation of the linkage region.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN002488224
        source_status: SUPPORTS_TRANSFER
        comment: FAM20B-branch (SF14) node; human FAM20B lies inside it and has direct evidence for a linkage-region
          biosynthetic step. The propagated term is correct but broader than GO:0120532.
      - source_id: ZFIN:ZDB-GENE-040724-125
        source_label: fam20b
        source_status: SUPPORTS_TRANSFER
        comment: Zebrafish experimental donor in the same SF14 subfamily.
- term:
    id: GO:1902729
    label: negative regulation of proteoglycan biosynthetic process
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-9941039
  qualifier: involved_in
  review:
    summary: Reactome assigns FAM20B to negative regulation of proteoglycan biosynthesis, based on the statement
      that xylose phosphorylation makes the linker chain unavailable for GAG biosynthesis.
    action: REMOVE
    reason: 'FAM20B is a biosynthetic enzyme of the linkage region, not a negative regulator of proteoglycan synthesis.
      Loss of FAM20B leaves a truncated linker that cannot be elongated and reduces CS and HS (PMID:25331875, PMID:19473117,
      PMID:40422215). Its phosphorylation accelerates linker synthesis and the initiation of both HS and CS (PMID:37828045).
      The fact Reactome cites is real but narrow: polymerases do not extend the phosphorylated tetrasaccharide.
      This is a transient intermediate that PXYLP1 dephosphorylates during normal synthesis (PMID:24425863). Excess
      phosphorylation can lower GAG output when FAM20B is overexpressed or PXYLP1 is lost, and EXTL2 can cap the
      phosphorylated linker (PMID:40422215, PMID:23395820). Those are imbalance effects of a pathway enzyme, and
      the authors describe them as a phosphorylation/dephosphorylation balance. The gene''s normal role is positive
      and required, so the negative-regulation assertion is contradicted by the loss-of-function data.'
    additional_reference_ids:
    - PMID:25331875
    - PMID:40422215
    - PMID:24425863
    - PMID:23395820
    - PMID:37828045
    supported_by:
    - *id003
    - reference_id: PMID:40422215
      supporting_text: In line with previous reports, we found that FAM20B loss-of-function reduced GAG chain synthesis.
    - reference_id: PMID:40422215
      supporting_text: suggesting that a balance between phosphorylation and dephosphorylation of the xylose by
        FAM20B and XYLP, respectively, is probably an essential factor for the regulation of the rate of PG synthesis
    - reference_id: Reactome:R-HSA-9941039
      supporting_text: making the chain unavailable for the biosynthesis of heparan/chondoitin/dermatan
