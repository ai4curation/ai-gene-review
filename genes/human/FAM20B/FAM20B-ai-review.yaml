core_functions:
- description: Lumenal ATP-dependent 2-O-phosphorylation of the xylose residue of the glycosaminoglycan-protein
    linkage region. The preferred acceptor is the Galbeta1-4Xylbeta1-O-Ser intermediate on proteoglycan core proteins.
    Experimentally established for human FAM20B with recombinant protein and in cells.
  molecular_function:
    id: GO:0016773
    label: phosphotransferase activity, alcohol group as acceptor
  directly_involved_in:
  - id: GO:0120532
    label: glycosaminoglycan-protein linkage region biosynthetic process
  locations:
  - id: GO:0000139
    label: Golgi membrane
  supported_by:
  - reference_id: PMID:19473117
    supporting_text: we identified FAM20B as a kinase that phosphorylates the xylose residue in the linkage region
  - reference_id: PMID:29572475
    supporting_text: Fam20B has a unique active site for recognizing Galβ1-4Xylβ1, the initiator disaccharide within
      the tetrasaccharide linker region of proteoglycans
  - reference_id: PMID:37828045
    supporting_text: Next, the galactosyltransferase B4GALT7 adds Gal and the kinase FAM20B phosphorylates Xyl to
      form Gal-Xyl-2-phosphate
  - reference_id: PMID:25331875
    supporting_text: Proteoglycans from FAM20B knockout cells contain a truncated tetrasaccharide linkage region
      consisting of a disaccharide capped with sialic acid
  - reference_id: file:human/FAM20B/FAM20B-uniprot.txt
    record_section: ["CC:SUBCELLULAR LOCATION"]
    supporting_text: 'SUBCELLULAR LOCATION: Golgi apparatus membrane'
proposed_new_terms:
- proposed_name: glycosaminoglycan-protein linkage region xylose 2-O-kinase activity
  proposed_definition: 'Catalysis of the reaction: 3-O-(beta-D-galactosyl-(1->3)-beta-D-galactosyl-(1->4)-beta-D-xylosyl)-L-seryl-[protein]
    + ATP = 3-O-(beta-D-galactosyl-(1->3)-beta-D-galactosyl-(1->4)-beta-D-2-O-phosphoxylosyl)-L-seryl-[protein]
    + ADP + H+, and the equivalent phosphorylation of the Gal-Xyl disaccharide linkage intermediate (RHEA:19461).'
  justification: FAM20B and its SF14 orthologs have a well-defined glycan kinase activity on linkage-region xylose.
    The only existing GO term is the general GO:0016773. GO:0019200 carbohydrate kinase activity is not an is_a
    ancestor of GO:0016773 and mainly covers free sugars. A specific term would separate the FAM20B glycan-kinase
    branch from the FAM20C protein kinases.
  proposed_parent:
    id: GO:0016773
    label: phosphotransferase activity, alcohol group as acceptor
  supported_by:
  - reference_id: PMID:19473117
    supporting_text: we identified FAM20B as a kinase that phosphorylates the xylose residue in the linkage region
  - reference_id: PMID:29572475
    supporting_text: mutations of the equivalent residues in the human Fam20B protein significantly diminish kinase
      activity
suggested_questions:
- question: Should FAM20B be annotated to GO:0120532 glycosaminoglycan-protein linkage region biosynthetic process?
    Its phosphate does not remain in the mature linker, but FAM20B catalyses a covalent step on the linker intermediate
    during its assembly.
- question: Is the Reactome event R-HSA-9941039 summary ("making the chain unavailable") meant to describe the transient
    phosphorylated intermediate? If so, should its GO mapping to negative regulation of proteoglycan biosynthesis
    be withdrawn?
- question: Is FAM20B activity itself regulated in vivo, for example by GlcAT-I/B3GAT3 complex formation or by core-protein
    context? Or is the extent of xylose phosphorylation set mainly by PXYLP1?
suggested_experiments:
- description: Quantitative kinetic comparison of human FAM20B on Xyl-, Gal-Xyl- and Gal-Gal-Xyl-glycopeptides,
    with and without B3GALT6/B3GAT3, to define the physiological acceptor and test for complex-dependent activation.
- description: Express Drosophila CG3631 and test it in the reconstituted linker-synthesis system, to confirm experimentally
    that SF14 xylosylkinase activity is conserved in insects.
