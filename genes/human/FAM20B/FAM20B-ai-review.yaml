id: O75063
gene_symbol: FAM20B
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'FAM20B (glycosaminoglycan xylosylkinase) is a Golgi-resident, single-pass type II membrane kinase
  of the FAM20 family of atypical secretory-pathway kinases. Its lumenal kinase domain transfers phosphate from
  ATP to the C2 hydroxyl of the xylose that links glycosaminoglycan (GAG) chains to serine residues of proteoglycan
  core proteins. Its preferred substrate is the Galbeta1-4Xylbeta1 disaccharide intermediate, recognised through
  a dedicated active-site pocket. FAM20B acts as a monomeric enzyme, unlike the FAM20C protein kinase and its pseudokinase
  partner FAM20A. Xylose 2-O-phosphorylation stimulates the galactosyltransferase B3GALT6 and the glucuronyltransferase
  B3GAT3, which complete the GlcA-Gal-Gal-Xyl linkage tetrasaccharide. The phosphate is transient: the phosphatase
  PXYLP1 removes it before chondroitin or heparan sulfate polymerisation begins. FAM20B is therefore required to
  assemble both chondroitin/dermatan sulfate and heparan sulfate chains. Cells lacking it make a truncated, sialylated
  Gal-Xyl linker that cannot be elongated, while imbalance between FAM20B and PXYLP1 also lowers GAG output. In
  mouse and zebrafish, loss of Fam20b disrupts cartilage, bone, tooth and craniofacial development. Biallelic loss-of-function
  variants in humans cause a lethal neonatal short-limb skeletal dysplasia resembling Desbuquois dysplasia.'
