  evidence_type: IDA
  original_reference_id: PMID:19473117
  qualifier: enables
  review:
    summary: Direct biochemical demonstration that human FAM20B transfers phosphate from ATP to the 2-OH of xylose
      in the GAG-protein linkage region.
    action: ACCEPT
    reason: This is the defining activity of FAM20B. Koike et al. 2009 identified it, and later studies confirmed
      it with recombinant human protein, including the Gal-Xyl disaccharide specificity and catalytic-residue mutants
      (Zhang et al. 2018). The acceptor is an alcohol group on a glycan-linked sugar, so GO:0016773 is accurate.
      It is the most specific existing GO term.
    supported_by:
