core_functions:
- description: CYB5A provides a heme-dependent electron relay to partner redox enzymes.
    The ER-anchored product exposes its heme domain to the cytoplasm, while the soluble
    erythrocyte product supports a distinct cellular redox context. Human CYB5A enhances
    CYP17A1 17,20-lyase activity; reconstituted mammalian cytochrome-b5 systems demonstrate
    electron donation and substrate-dependent conformational effects. The directly
    measured nanodisc electron-transfer experiment used rabbit b5 with human CYP17A1
    and rat reductase, so it is mechanistic ortholog support rather than an assay
    of all three human splice products. Binding to a P450 alone does not establish
    enhancement of that enzyme.
  molecular_function:
    id: GO:0009055
    label: electron transfer activity
  locations:
  - id: GO:0005789
    label: endoplasmic reticulum membrane
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:22170710
    supporting_text: CYP17A1 17,20 lyase activity was greatly reduced in the presence
      of p.H44L CYB5A
  - reference_id: PMID:27297105
  - reference_id: PMID:29888793
    supporting_text: direct electron transfer from ferrous b5 to the oxy-complex of
      CYP17A1
  - reference_id: PMID:33656879
  - reference_id: PMID:4030743
  - reference_id: file:human/CYB5A/CYB5A-source-evidence.json
proposed_new_terms: []
suggested_questions:
- question: Which cytochrome-b5 gene/product and experimental localization justify
    the mitochondrial P00167 entities in Reactome 198824 and 198845, given the distinction
    between ER type A and mitochondrial type B in their cited literature?
- question: How do the three human CYB5A products differ in redox-partner specificity
    and substrate-dependent enhancement when heme occupancy and membrane anchoring
    are measured independently?
- question: Can the peptide-level CYB5A identification in the NK-cell membrane proteome
    be recovered, and is its membrane assignment distinguishable from co-fractionation?
suggested_experiments:
- description: Compare sequence-verified human CYB5A products with matched heme occupancy
    in reconstituted partner assays; measure electron-transfer kinetics and product
    formation separately, including membrane-anchor controls and both CYP17A1 lyase
    substrates.
status: DRAFT
