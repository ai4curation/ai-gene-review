id: P00167
gene_symbol: CYB5A
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CYB5A encodes cytochrome b5 type A, a small heme-containing electron
  carrier. Its membrane-bound form is anchored in the endoplasmic reticulum, with
  a cytoplasmic heme domain that interacts with redox partner enzymes; an alternatively
  spliced erythrocyte form lacks the membrane anchor. Cytochrome b5 supports lipid
  and steroid metabolism and the maintenance of reduced hemoglobin. Human CYB5A enhances
  CYP17A1 17,20-lyase activity, and disruption of CYB5A can cause methemoglobinemia
  and impaired androgen synthesis. Its effects on P450 enzymes depend on the partner
  and substrate, combining electron transfer with conformational effects rather than
  universally increasing every bound enzyme's activity.
alternative_products:
- name: 1 (Liver, Membrane-bound)
  id: P00167-1
  description: The displayed 134-residue product contains the heme-binding domain
    and the C-terminal transmembrane segment at residues 109–131. The official mature
    chain is 2–134 after initiator methionine removal. Heme ligands are His44 and
    His68. Membrane-associated redox functions are principally assigned to this product,
    with experimental construct limits retained for individual sources.
- name: 2 (Erythrocyte, Cytoplasmic)
  id: P00167-2
  sequence_note: VSP_001240, VSP_001241
  description: The 98-residue product is independently reconstructed by VSP_001240
    (Thr98Pro) and VSP_001241 (residues 99–134 absent). It lacks the membrane anchor.
    The historical erythrocyte sequence in PMID:4030743 has 97 residues after initiator
    methionine removal; that numbering is not a different 98-residue precursor sequence.
    The official record notes possible low-level expression through nonsense-mediated
    decay. It is not equated with arbitrary soluble constructs used in P450 assays.
- name: '3'
  id: P00167-3
  sequence_note: VSP_045367
  description: The 124-residue product is independently reconstructed by VSP_045367,
    deleting canonical residues 86–95. It retains the heme-ligating residues and membrane-anchor
    sequence, but this structural compatibility does not establish equal partner specificity,
    abundance or catalytic support relative to product 1.
