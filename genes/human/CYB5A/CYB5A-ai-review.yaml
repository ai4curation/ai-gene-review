  evidence_type: ISS
  original_reference_id: PMID:29888793
  supporting_entities:
  - UniProtKB:P00169
  review:
    summary: Propose the conserved cytochrome-b5 electron-transfer activity with explicit
      homolog evidence.
    action: NEW
    reason: PMID:29888793 directly measures oxidation of full-anchor rabbit cytochrome
      b5 coupled to reduction of the human CYP17A1 oxy-complex in nanodiscs, with
      rat reductase as the other redox partner. Official rabbit P00169 is CYB5A; its
      134-residue sequence shares 121 positions with human P00167, including 75 of
      77 heme-domain positions and both axial histidines. This supports a manual ISS
      inference of the conserved activity, corroborated by human WT/H44L CYB5A functional
      assays in PMID:22170710 and redox-active versus Mn-b5 experiments in PMID:27297105.
      The human assay measures lyase output, not electron-transfer kinetics or H44L
      heme loss. Neither the exact experimental rabbit plasmid sequence nor equal
      activity of all human splice products is inferred. The function describes electron
      movement and is distinct from the existing heme/enzyme/protein-binding terms;
      substrate-dependent allostery can coexist.
    supported_by:
    - reference_id: PMID:29888793
    - reference_id: PMID:22170710
    - reference_id: PMID:27297105
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: UniProtKB:P00169
