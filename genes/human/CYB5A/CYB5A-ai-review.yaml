    summary: Refine the demonstrated cytb5 membrane insertion to ER membrane.
    action: MODIFY
    reason: The indexed original Results explicitly test cytb5-ops28 integration into
      the ER, using a C-terminal glycosylation reporter, and report no loss of insertion
      after Sec61 depletion (Figure 2D and Table 1). The Methods describe reticulocyte-lysate
      translation, semipermeabilized cells, glycosylation and protease-protection
      assays. This supports ER membrane rather than an unspecified membrane. The exact
      species/sequence of the supplied cytb5-ops28 construct is not established in
      the read text; the curated human assignment is retained with that limitation,
      not inferred from a human host. The canonical cache contains Abstract/Introduction
      despite its full-text flag; the substantive Results/Methods were read separately
      from the indexed original.
