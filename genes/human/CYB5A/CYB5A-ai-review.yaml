id: P00167
gene_symbol: CYB5A
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CYB5A encodes cytochrome b5 type A, a small heme-containing electron
  carrier. Its membrane-bound form is anchored in the endoplasmic reticulum and exposes
  a cytoplasmic heme domain to redox partners. An alternatively spliced erythrocyte
  form lacks the membrane anchor and occurs in the cytosol. Cytochrome b5 supports
  lipid and steroid metabolism and the maintenance of reduced hemoglobin. Human CYB5A
  enhances CYP17A1 17,20-lyase activity; disruption can cause methemoglobinemia and
  impaired androgen synthesis. Electron donation and substrate-dependent conformational
  effects contribute to its interactions with P450 enzymes.
alternative_products:
- name: 1 (Liver, Membrane-bound)
  id: P00167-1
  description: The displayed 134-residue product contains a heme-binding domain with
    axial ligands His44 and His68 and a C-terminal membrane anchor at residues 109–131.
    Its mature chain is 2–134 after initiator methionine removal.
- name: 2 (Erythrocyte, Cytoplasmic)
  id: P00167-2
  sequence_note: VSP_001240, VSP_001241
  description: The 98-residue erythrocyte product has Thr98Pro and lacks residues
    99–134, including the membrane anchor. The sequenced mature human erythrocyte
    protein has 97 residues after initiator methionine removal. Its transcript may
    be expressed at low levels because of nonsense-mediated decay.
- name: '3'
  id: P00167-3
  sequence_note: VSP_045367
  description: The 124-residue product lacks canonical residues 86–95 while retaining
    both axial heme ligands and the membrane-anchor sequence. Its partner specificity
    and activity remain uncharacterized.
