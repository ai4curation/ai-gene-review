  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-198824
  qualifier: located_in
  review:
    summary: The modeled mitochondrial location requires source-specific resolution.
    action: UNDECIDED
    reason: The actual Reactome 198824 target path contains P00167 residues 2–134
      in mitochondrial-outer-membrane cytochrome-b5/heme entities (198781 within 198772/198808);
      the annotation is not an accession-free pathway inference. However, the accessible
      abstract of PMID:8513896 distinguishes separate genes for ER and mitochondrial
      cytochrome b5, whereas dual localization of the reductase is attributed to one
      gene. PMID:7668255 measures reductase deficiency and ascorbate regeneration,
      without resolving the CYB5A product at this location in the accessible text.
      Full originals were not recovered. The model/source identity and compartment
      tension remains unresolved; no wrong-gene removal or universal exclusion of
      CYB5A from mitochondria is inferred from abstracts. Reactome 198824 attributes
      the myristoyl anchor specifically to CYB5R3, so that mechanism cannot establish
      a CYB5A membrane anchor. In contrast, the 198845 summary explicitly places CYB5A
      at the mitochondrial outer membrane, as do the actual target entities. This
      disagreement between the model and accessible literature remains unresolved;
      the reductase mechanism alone does not prove a misassigned CYB5A annotation.
