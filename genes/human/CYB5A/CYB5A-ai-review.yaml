suggested_questions:
- question: Which cytochrome-b5 gene/product and experimental localization justify
    the mitochondrial P00167 entities in Reactome 198824 and 198845, given the distinction
    between ER type A and mitochondrial type B in their cited literature?
- question: How do the three human CYB5A products differ in redox-partner specificity
    and substrate-dependent enhancement when heme occupancy and membrane anchoring
    are measured independently?
- question: Can the peptide-level CYB5A identification in the NK-cell membrane proteome
    be recovered, and is its membrane assignment distinguishable from co-fractionation?
- question: Does the product-specific human evidence warrant GO:0006702 androgen biosynthetic
    process for CYB5A as the electron-donating cofactor of CYP17A1, after comparison
    with other redox partners in the same role? The rabbit-b5 electron-transfer experiment
    establishes participation in chemistry, but does not itself define every human
    product or tissue context.
suggested_experiments:
- description: Compare sequence-verified human CYB5A products with matched heme occupancy
    in reconstituted partner assays; measure electron-transfer kinetics and product
    formation separately, including membrane-anchor controls and both CYP17A1 lyase
    substrates.
functional_isoforms:
- id: CYB5A_MEMBRANE_BOUND
  name: ER-anchored cytochrome b5
  type: SPLICE_VARIANT
  maps_to:
  - type: UNIPROT_ISOFORM
    ids:
    - P00167-1
  description: The 134-residue liver/membrane-bound product exposes its heme domain
    on the cytoplasmic face of the ER and supports membrane-associated redox partners.
    Its nascent tail-anchored form also passes through a cytosolic SGTA-bound biogenesis
    intermediate.
- id: CYB5A_SOLUBLE_ERYTHROCYTE
  name: Soluble erythrocyte cytochrome b5
  type: SPLICE_VARIANT
  maps_to:
  - type: UNIPROT_ISOFORM
    ids:
    - P00167-2
  description: The 98-residue splice product lacks the membrane anchor and forms the
    soluble erythrocyte cytochrome b5 pool involved in hemoglobin redox maintenance.
    Human erythrocyte protein sequencing identifies its cytosolic mature 97-residue
    chain. This class is distinct from the transient cytosolic precursor of the membrane-bound
    product.
