core_functions:
- description: CYB5A relays electrons through its heme to partner redox enzymes. The
    ER-anchored form presents its heme domain to cytoplasmic partners, while the mature
    soluble erythrocyte form supports cytosolic redox metabolism. CYP17A1 17,20-lyase
    enhancement combines electron donation with substrate-dependent conformational
    effects.
  molecular_function:
    id: GO:0009055
    label: electron transfer activity
  locations:
  - id: GO:0005789
    label: endoplasmic reticulum membrane
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:22170710
    supporting_text: CYP17A1 17,20 lyase activity was greatly reduced in the presence
      of p.H44L CYB5A
  - reference_id: PMID:27297105
  - reference_id: PMID:29888793
  - reference_id: PMID:33656879
  - reference_id: PMID:4030743
