id: P14778
gene_symbol: IL1R1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Interleukin-1 receptor type 1 (IL1R1, CD121a) is the signalling receptor for the IL-1 agonists
  IL-1alpha and IL-1beta and also binds the antagonist IL-1Ra (IL1RN). It is a single-pass type I transmembrane
  glycoprotein with three extracellular immunoglobulin-like domains that bind ligand and a cytoplasmic
  Toll/IL-1 receptor (TIR) domain. Agonist binding recruits the co-receptor IL1RAP; the paired TIR domains
  then recruit MYD88, IRAK4 and IRAK1/2 (and TOLLIP), leading through TRAF6 and TAK1 to NF-kappaB and
  p38, ERK and JNK MAPK activation and inflammatory gene expression. IL-1Ra occupies the binding site
  without recruiting IL1RAP and so blocks signalling. IL1R1 is broadly expressed (fibroblasts, endothelial
  and epithelial cells, T cell subsets, especially Th1 and Th17), mediates IL-1 costimulation of IFN-gamma
  production by Th1 cells, can be phosphorylated on Tyr-496 to recruit PI3K, and can associate with PDGFRB
  in vascular smooth muscle cells. A soluble ectodomain is released by shedding. Gain-of-function variants
  cause autosomal dominant chronic recurrent multifocal osteomyelitis.
