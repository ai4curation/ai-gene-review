core_functions:
- description: Ligand-binding signalling subunit of the IL-1 receptor complex at the plasma membrane.
    Binds IL-1alpha or IL-1beta, recruits IL1RAP, and via the paired TIR domains nucleates MYD88/IRAK
    signalling that activates NF-kappaB and MAPK pathways.
  molecular_function:
    id: GO:0004909
    label: interleukin-1, type I, activating receptor activity
  locations:
  - id: GO:0005886
    label: plasma membrane
  in_complex:
    id: GO:0045323
    label: interleukin-1 receptor complex
  directly_involved_in:
  - id: GO:0070498
    label: interleukin-1-mediated signaling pathway
  supported_by:
  - reference_id: PMID:2950091
    supporting_text: the initial translation product of IL-1 alpha mRNA can bind to the IL-1 receptor
      without further proteolytic processing
  - reference_id: file:human/IL1R1/IL1R1-uniprot.txt
    record_section:
    - CC:FUNCTION
    supporting_text: After binding to interleukin-1 associates with the coreceptor IL1RAP to form the
      high affinity interleukin-1 receptor complex which mediates interleukin-1-dependent activation of
      NF-kappa-B, MAPK and other pathways
  - reference_id: PMID:2530587
    supporting_text: Both are integral membrane proteins possessing a single membrane-spanning segment.
suggested_questions:
- question: Does the IL1R1 TIR domain have any measurable NAD+ hydrolase activity, or is the ProRule-based
    catalytic activity an over-extension from SARM1-type TIR domains?
- question: Should complex-membership process annotations from antagonist or decoy complexes be propagated
    to IL1R1, the receptor being blocked?
suggested_experiments:
- description: Assay NAD+ consumption and cADPR production by purified, dimerised IL1R1 and IL1RAP TIR
    domains alongside SARM1 TIR as a positive control.
