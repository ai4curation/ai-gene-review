proposed_new_terms:
- proposed_name: protein oligomerization limiting activity
  proposed_definition: A molecular function in which a protein binds the self-association interface
    of another protein and limits the size of the oligomer or condensate that partner forms, without
    preventing its binding to other partners, displacing it from its site of action, or targeting
    it for degradation.
  justification: 'AHNAK''s nuclear activity has no MF term. It binds the 53BP1 oligomerization domain
    and caps 53BP1 multimerisation and phase separation; in its absence 53BP1 nuclear bodies enlarge
    and the p53 response is amplified (PMID:33961796). The two candidate existing terms both fail
    on their differentia. GO:0140311 protein sequestering activity is defined as binding a protein
    ''to prevent it from interacting with other partners or to inhibit its localization to the area
    of the cell or complex where it is active'' - but AHNAK does neither: 53BP1 stays on chromatin
    and stays active, it simply assembles less far. GO:0060090 molecular adaptor activity is the opposite
    direction, bringing molecules together. This is not an AHNAK-specific gap: the same shape recurs
    wherever a chaperone-like binder tunes the extent of a biomolecular condensate rather than blocking
    its formation, and that class of regulator is growing faster than the ontology''s vocabulary for
    it. A biological-process parallel already exists (GO:0032460 negative regulation of protein oligomerization),
    which this review uses; what is missing is the activity that carries it out. Parenting is the
    hard part, and the difficulty is itself the gap. The obvious homes do not hold: GO:0140678 molecular
    function inhibitor activity and GO:0098772 molecular function regulator activity both presume
    the thing being regulated is a molecular function, and 53BP1 oligomerization is not one - GO models
    it as a biological process (GO:0051260 protein homooligomerization). GO:0140313 molecular sequestering
    activity fails on the same differentia as its child GO:0140311. So the term is proposed under
    GO:0005515 protein binding, which is where it structurally belongs and which is deliberately uninformative,
    to make the point: GO''s molecular-function regulator vocabulary is built to regulate molecular
    functions, and has no way to say that an activity modulates a partner''s self-assembly. If GO
    were willing to read limiting a partner''s self-association as regulating its function, GO:0098772
    would become the natural parent; that is a decision for an ontology editor rather than something
    this review should assume.'
