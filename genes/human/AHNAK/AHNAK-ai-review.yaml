  - UniProtKB:Q15418
  review:
    summary: RPS6KA1. The only AHNAK partner whose entire evidence is one holdup measurement, and
      the weakest-scoring of the eight.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'One of eight GO:0005515 rows imported from a single holdup screen (PMID:36115835). That
      screen expressed a recombinant library of all 266 human PDZ domains and tested them against
      a synthetic library of 448 C-terminal 10-mer PDZ-binding motifs; IntAct holds 415 AHNAK records
      from it, every one with detection method ''holdup assay'' and AHNAK as the prey. So this row
      reports an affinity between AHNAK''s isolated ~80-residue PDZ domain and a 10-residue peptide,
      not an interaction of the 5,890-residue protein. RPS6KA1 is the one partner of the eight with
      no orthogonal record anywhere in IntAct - no co-IP, no proximity labelling, no crosslink - and
      it carries the lowest MI-score of the block (0.44 against 0.57-0.67 for the others). Stated
      as a reusable rule rather than left as a judgement call: within a set of rows that share one
      experiment and one method, single out the row that has no orthogonal record in any other publication
      AND sits below the rest of the set on the database''s own confidence score. Both conditions
      are needed - the first alone would catch honest singletons, the second alone would catch ordinary
      scatter. Here exactly one of eight meets both. A single isolated-domain affinity against a synthetic
      decapeptide, at the bottom of the screen''s own confidence range, should not stand as a GO protein-binding
      annotation on its own. Marked over-annotated rather than removed because the measurement is
      real and reproducible in principle; what is missing is any evidence that it happens between
      the full-length proteins in a cell.'
