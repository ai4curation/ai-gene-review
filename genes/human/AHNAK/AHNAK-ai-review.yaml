- term:
    id: GO:0030674
    label: protein-macromolecule adaptor activity
  evidence_type: IDA
  original_reference_id: PMID:12153988
  qualifier: enables
  review:
    summary: 'Proposed. The molecular function the whole AHNAK literature converges on: a scaffold
      that holds separate partners together so they act as a unit. GOA currently gives this gene no
      molecular function beyond protein binding, cadherin binding, S100 protein binding, RNA binding
      and a disputed elasticity term.'
    action: NEW
    reason: GO:0030674 is defined as 'An adaptor activity that brings together two or more macromolecules
      in contact, permitting those molecules to function in a coordinated way', with the definition
      explicitly covering both two proteins and a protein plus a lipid. The generic parent GO:0060090
      molecular adaptor activity would also be true, but the child is supported and more informative,
      and there is no heterogeneous-donor argument for staying broad here because this is a direct
      measurement on the protein itself. AHNAK satisfies that definition with measured, mapped, simultaneous
      binding sites rather than by analogy. One and the same C-terminal region binds the Cav-beta2
      channel subunit with nanomolar affinity and binds G- and F-actin, which is precisely a link
      between two otherwise unconnected partners (PMID:12153988); a defined 20-residue motif in that
      region binds the annexin A2/S100A10 heterotetramer, with the crystal structure showing both
      protomers contacted at once and neither sufficient alone (PMID:22940583, PMID:16984913); and
      knocking down annexin 2/S100A10 removes AHNAK from the plasma membrane while knocking down AHNAK
      leaves that complex in place but blocks cortical actin reorganisation (PMID:14699089). The protein
      has no catalytic activity, no enzyme motif, and a feature table that is one PDZ domain plus
      26-30 tandem 128-residue repeats and long disordered stretches - adaptor activity is not a fallback
      here, it is the architecture.
    supported_by:
    - reference_id: PMID:12153988
      supporting_text: These results suggest that ahnak provides a structural basis for the subsarcolemmal
        cytoarchitecture and confers the regulatory role of the actin-based cytoskeleton to the L-type
        Ca2+ channel.
    - reference_id: PMID:14699089
      supporting_text: The S100A10 subunit serves to mediate the interaction between annexin 2 and
        the COOH-terminal regulatory domain of AHNAK.
