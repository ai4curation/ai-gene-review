existing_annotations:
- term:
    id: GO:0003723
    label: RNA binding
  evidence_type: HDA
  original_reference_id: PMID:22658674
  qualifier: enables
  review:
    summary: RNA binding, from mRNA interactome capture. Kept as non-core with the caveat the source
      paper itself supplies.
    action: KEEP_AS_NON_CORE
    reason: 'Interactome capture is a stringent method - covalent UV crosslinking to poly(A) RNA followed
      by oligo-dT capture - so the datum is not dismissed. But the paper''s own headline caveat describes
      AHNAK exactly: it reports that many proteins in the HeLa mRNA interactome are highly intrinsically
      disordered and enriched in short repetitive motifs, and AHNAK is the extreme case of that architecture,
      with 26-30 tandem 128-residue repeats and MobiDB-lite disorder called across the protein. No
      orthogonal evidence for AHNAK RNA binding exists; the one nucleic-acid measurement in the literature
      reports weak DNA binding (PMID:15177040). Kept, not removed - the full text was not available
      and the curator''s HDA stands - but it should not be read as a molecular function of AHNAK.'
    supported_by:
    - reference_id: PMID:22658674
      supporting_text: we find that many proteins of the HeLa mRNA interactome are highly intrinsically
        disordered and enriched in short repetitive amino acid motifs
