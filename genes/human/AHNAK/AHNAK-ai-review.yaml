  - UniProtKB:O75923
  review:
    summary: Dysferlin. A direct, domain-mapped, Ca-independent interaction - the strongest IPI on
      this gene. Accepted despite the uninformative term.
    action: ACCEPT
    reason: 'This row is everything the screen-derived GO:0005515 rows are not: the interaction was
      found by co-immunoprecipitation from skeletal muscle, the binding sites were mapped to the dysferlin
      C2A domain and the AHNAK C-terminal domain by GST pulldown, and UniProt records it with an experimental
      evidence tag. It is normally right to replace bare ''protein binding'' with an informative child,
      and it is not done here because GO has no term for binding a ferlin or a membrane-repair C2
      protein; GO:0019904 protein domain specific binding would be technically true and no more informative.
      The scaffolding conclusion this interaction supports is recorded in core_functions instead,
      and the missing term is raised in suggested_questions.'
    supported_by:
    - reference_id: PMID:17185750
      supporting_text: We defined the binding sites in dysferlin and AHNAK as the C2A domain in dysferlin
        and the carboxyterminal domain of AHNAK by glutathione S-transferase (GST)-pull down assays.
