- description: 'Nuclear restraint of 53BP1. AHNAK binds the 53BP1 oligomerization domain and limits
    how far 53BP1 multimerises. In AHNAK-null human cells 53BP1 hyper-accumulates on chromatin, its
    nuclear bodies enlarge, its phase separation is enhanced and the p53 response is amplified, driving
    senescence in non-transformed cells. Access to this pool is regulated: AHNAK carries several nuclear
    localisation signals, and PKB/Akt phosphorylation drives nuclear export through an adjacent export
    signal. No molecular function is asserted for this activity, because what has been measured is
    the consequence of the interaction rather than a characterised biochemical activity of AHNAK on
    53BP1.'
