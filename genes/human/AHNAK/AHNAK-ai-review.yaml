    id: GO:0005515
    label: protein binding
  supported_by:
  - reference_id: PMID:33961796
    supporting_text: We demonstrate that AHNAK binds to the 53BP1 oligomerization domain and controls
      its multimerization potential.
  - reference_id: PMID:33961796
    supporting_text: Loss of AHNAK results in hyper-accumulation of 53BP1 on chromatin and enhanced
      phase separation, culminating in an elevated p53 response
