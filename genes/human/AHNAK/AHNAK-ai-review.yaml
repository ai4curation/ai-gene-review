    - reference_id: PMID:36115835
      supporting_text: we expressed a recombinant PDZome library covering all the 266 known human
        PDZs
    - reference_id: PMID:36115835
      supporting_text: we used the holdup method, a high-throughput comparative chromatographic retention
        assay that we developed previously
