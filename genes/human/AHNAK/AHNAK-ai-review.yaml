- term:
    id: GO:0005246
    label: calcium channel regulator activity
  evidence_type: IDA
  original_reference_id: PMID:16319140
  qualifier: enables
  review:
    summary: Proposed. AHNAK binds the CACNB2 (Cav-beta2) subunit of the L-type voltage-gated calcium
      channel and acts as a brake on L-type current that PKA phosphorylation relieves. GOA records
      nothing about calcium channels on this gene.
    action: NEW
    reason: 'This is AHNAK''s most thoroughly dissected activity and it is entirely absent from the
      GO record. The interaction is mapped and quantified with recombinant AHNAK fragments: the C-terminal
      region binds beta2a with Kd 55 nM (PMID:12153988), the most C-terminal 188 residues carry a
      PxxP motif that binds Cav-beta2 with Kd ~60 nM and lose ~20-fold affinity when the prolines
      are mutated (PMID:20607281), and binding is to the SH3-HOOK-GK core of Cav-beta2 and is tuned
      by PKA phosphorylation of Cav-beta2 Ser-296 (PMID:22497893). The functional consequence was
      established with a naturally occurring human AHNAK variant, Ile5236Thr in the 5,643-residue
      sequence used in that study: the mutant fragment halves beta2 binding, mimics the PKA effect
      on I(CaL) and blocks further up-regulation by isoprenaline, from which the authors conclude
      the ahnak C1 domain is a physiological brake on the current (PMID:16319140). The specificity
      control is strong - neither wild-type nor mutant fragment affects I(CaL) in ahnak1-deficient
      cardiomyocytes, so the effect requires endogenous AHNAK rather than being a peptide artefact.
      Evidence code IDA: the binding and the electrophysiology are direct assays on defined AHNAK
      fragments. The electrophysiology itself was performed in rat and mouse cardiomyocytes.'
    supported_by:
    - reference_id: PMID:16319140
      supporting_text: Hence, we suggest the ahnak-C1 domain serves as physiological brake on I(CaL).
    - reference_id: PMID:12153988
      supporting_text: Equilibrium sedimentation analysis revealed Kd values of 55 +/- 11 nM and 328
        +/- 24 nM for carboxyl-terminal (aa 195-606) and amino-terminal (aa 1-200) truncates of the
        beta2a subunit, respectively.
    - reference_id: PMID:20607281
      supporting_text: In vitro binding studies revealed that 188-PSTP conferred high-affinity binding
        to Cavbeta(2) (K (d) approximately 60 nM).
