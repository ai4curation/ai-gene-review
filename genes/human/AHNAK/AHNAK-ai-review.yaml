suggested_experiments:
- description: Settle the membrane-repair question properly. Repeat the laser-wounding assay on AHNAK-knockout
    human myotubes and on a non-muscle cell type, with FM1-43 dye entry quantified against dysferlin-
    and annexin A2-knockout controls in the same experiment. The existing negative is a single assay
    in mouse skeletal fibres; the existing positive annotation rests on no assay at all.
- description: Measure AHNAK's mechanical properties directly rather than inferring them from fibre
    stiffness. Single-molecule force spectroscopy on a recombinant construct of several tandem 128-residue
    central repeats would establish whether the repeat region is elastomeric, which is the claim GO:0097493
    makes and which has never been tested.
- description: Establish which interactions of the full-length protein are real. All eight of the
    holdup GO:0005515 rows measure AHNAK's isolated PDZ domain against a synthetic decapeptide. Endogenous
    AHNAK immunoprecipitation followed by quantitative mass spectrometry, with an AHNAK-knockout line
    as the specificity control, would separate real partners from the 608 accumulated IntAct associations
    of a very large, very abundant cortical protein.
- description: Test whether the splicing-regulation activity is isoform-restricted, as the annotation
    implicitly assumes. Express the short isoform Q09666-2 and the full-length protein separately
    in AHNAK-null cells and assay splicing at the endogenous AHNAK locus; the current GO record attaches
    the activity to the canonical 700 kDa accession.
- description: Perturb AHNAK in a human excitable cell and measure L-type current. Knockout or acute
    degron depletion in human iPSC-derived cardiomyocytes, with whole-cell I(CaL) recorded before
    and after beta-adrenergic stimulation, would convert the strongest claim about AHNAK from a cross-species
    inference into a human measurement.
- description: Ask whether AHNAK's 53BP1 activity is separable from its cortical one. A C-terminal
    truncation that removes the annexin A2/S100A10 and actin-binding region, or a nuclear export signal
    mutant that traps AHNAK in the nucleus, expressed in AHNAK-knockout U2OS cells, would show whether
    restraining 53BP1 requires membrane-derived regulation or is an independent activity of the nuclear
    pool.
