core_functions:
- description: 'Cortical membrane scaffold. Through a defined 20-residue motif in its C-terminal domain,
    AHNAK is recruited to the inner leaflet of the plasma membrane by the annexin A2/S100A10 heterotetramer,
    and through the same C-terminal region it binds monomeric actin and cosediments with filaments.
    Holding those two otherwise unconnected partners together is what organises the cortical actin
    layer beneath the membrane: depleting annexin A2/S100A10 removes AHNAK from the membrane, while
    depleting AHNAK leaves that complex in place and blocks the cortical actin reorganisation that
    sets epithelial cell height. The complex concentrates at calcium-dependent cell-cell contacts
    and partitions into detergent-resistant membrane microdomains.'
