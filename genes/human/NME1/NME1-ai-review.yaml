id: P15531
gene_symbol: NME1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: NME1 encodes nucleoside diphosphate kinase A (NDPK-A, NM23-H1), a ubiquitous, mainly cytosolic
  group I NDP kinase that forms homo- and heterohexamers with NME2. It transfers the gamma-phosphate of
  ATP to ribo- and deoxyribonucleoside diphosphates through an autophosphorylated His118 intermediate,
  sustaining GTP, UTP, CTP and dNTP pools (including the UDP-to-UTP step of pyrimidine nucleotide synthesis)
  and supplying local GTP to dynamin during endocytosis. The same phosphohistidine enables phosphotransfer
  to histidines of other proteins. Its activity is inhibited by oxidation of Cys109, disulfide-driven
  hexamer dissociation and CoA binding. NME1 was the first metastasis-suppressor gene described; its loss
  correlates with metastatic potential and it restrains tumour cell motility. A minor nuclear pool, released
  from the inhibitor SET by granzyme A, acts as a Mg2+-dependent DNase that nicks DNA during cytotoxic-lymphocyte
  attack, and 3'-5' exonuclease activity has been reported in vitro.
