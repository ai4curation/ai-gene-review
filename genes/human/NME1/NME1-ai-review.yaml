    label: chromatin
  evidence_type: NAS
  original_reference_id: PMID:16818237
  qualifier: located_in
  review:
    summary: NAS chromatin location inferred from the GzmA-triggered nuclear translocation of the SET
      complex.
    action: MARK_AS_OVER_ANNOTATED
    reason: The paper shows that the ER-associated SET complex translocates to the nucleus after granzyme
