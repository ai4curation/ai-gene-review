- id: file:human/NME1/NME1-uniprot.txt
  title: UniProtKB P15531 NDKA_HUMAN record
core_functions:
- description: 'Cytosolic NDP kinase: phosphohistidine (His118) ping-pong transfer of the ATP gamma-phosphate
    to (d)NDPs, producing GTP, UTP, CTP and dNTPs and maintaining nucleoside triphosphate pools.'
  molecular_function:
    id: GO:0004550
    label: nucleoside diphosphate kinase activity
  directly_involved_in:
  - id: GO:0009142
    label: nucleoside triphosphate biosynthetic process
  - id: GO:0006228
    label: UTP biosynthetic process
  - id: GO:0006183
    label: GTP biosynthetic process
  - id: GO:0006241
    label: CTP biosynthetic process
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:9488696
    supporting_text: Nucleoside-diphosphate kinases (NDKs) catalyze the transfer of gamma-phosphoryl groups
      from NTPs via an active site histidine to NDPs using a ping-pong mechanism.
  - reference_id: PMID:1851158
    supporting_text: The phosphorylation site on the enzyme is located at His-118.
  - reference_id: Reactome:R-HSA-482619
    supporting_text: Three human cytosolic nucleoside diphosphate kinase proteins, NME1, 2, and 3, have
      been characterized biochemically
suggested_questions:
- question: Which metastasis- and motility-suppressive effects of NME1 require NDP kinase activity, histidine
    phosphotransfer, or neither (P96S and S120G mutants retain NDPK activity but lose motility suppression)?
- question: Is the DNase/3'-5' exonuclease activity of NM23-H1 intrinsic under physiological enzyme:substrate
    ratios, and does it act outside the granzyme A pathway?
- question: Should PAINT add an IRD for mitochondrion on the vertebrate cytosolic NME1/NME2 branch below
    PTN000142925?
suggested_experiments:
- hypothesis: Local GTP production by NME1/NME2 at clathrin-coated pits, not bulk NTP supply, underlies
    their endocytic role.
  description: Rescue NME1/NME2-depleted cells with wild-type or H118F NME1 targeted or untargeted to
    membranes and measure dynamin-dependent endocytosis and cellular GTP pools.
- hypothesis: The nuclease activity attributed to NM23-H1 is intrinsic and separable from the kinase site.
  description: Assay highly purified wild-type, K12Q and H118F NM23-H1 from a eukaryotic expression system
    for nicking and 3'-5' exonuclease activity at catalytic (sub-stoichiometric) enzyme concentrations.
