      supporting_text: SET and NM23-H1 reside in an endoplasmic reticulum-associated complex (the SET
        complex) that translocates to the nucleus in response to superoxide generation by granzyme A.
    - reference_id: PMID:12628186
      supporting_text: After GzmA loading or CTL attack, SET and NM23-H1 translocate to the nucleus and
        SET is degraded, allowing NM23-H1 to nick chromosomal DNA.
