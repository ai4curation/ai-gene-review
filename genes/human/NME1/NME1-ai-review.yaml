  review:
    summary: IBA (is_active_in mitochondrion) from PAINT node PTN000142925, placed at the eukaryotic NDK
      node and seeded by NME3, NME4, yeast YNK1, Dictyostelium ndkM, Arabidopsis NDPK3 and rat Nme1/Nme2.
    action: MARK_AS_OVER_ANNOTATED
    reason: The organelle claim does not hold for NME1. Mitochondrial NDPK activity in vertebrates is
      supplied by NME4 (matrix/intermembrane space) and NME3 (outer membrane); Boissan et al. describe
      NM23-H4 as the mitochondria-specific NDPK and show that silencing NM23-H1/H2 does not affect mitochondrial
      morphology. The curated UniProt location for NME1 is cytoplasm and nucleus. The eukaryotic node
      placement is defensible for the ancestral dual cytosolic/intermembrane-space NDK (yeast YNK1 has
      a small IMS pool), but the vertebrate cytosolic NME1/NME2 branch did not retain it; see the PTHR11349
      family review (node assessment NEEDS_PRUNING). No PAINT IRD currently blocks this branch.
    supported_by:
    - reference_id: PMID:24970086
      supporting_text: NM23-H4, a mitochondria-specific NDPK, colocalized with mitochondrial dynamin-like
        OPA1
    - reference_id: PMID:24970086
      supporting_text: silencing of NM23-H4 but not NM23-H1/H2 resulted in mitochondrial fragmentation
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN000142925
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Eukaryotic NDK node seeded by NME3, NME4, yeast YNK1 (IMS pool), Dictyostelium ndkM,
          Arabidopsis NDPK3 and rat Nme1/Nme2. The mitochondrial seeds are genuine, but the vertebrate
          cytosolic NME1/NME2 branch has no mitochondrial pool; NME4 is the mitochondria-specific paralog
          (PMID:24970086). No IRD on the NME1 lineage.
