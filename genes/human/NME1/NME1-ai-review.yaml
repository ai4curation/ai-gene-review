- term:
    id: GO:0000287
    label: magnesium ion binding
  evidence_type: IDA
  original_reference_id: PMID:11555662
  qualifier: enables
  review:
    summary: Mg2+ dependence of the SET-complex nuclease (later identified as NM23-H1) and, more broadly,
      Mg2+ as the cofactor of Mg-nucleotide phosphotransfer.
    action: KEEP_AS_NON_CORE
    reason: The cited paper reports a Mg2+-dependent 25-kDa nuclease in the SET complex, subsequently
      shown to be NM23-H1 (PMID:12628186); the 3'-5' exonuclease is also Mg2+-dependent (PMID:14960567).
      Metal binding is real but is a cofactor requirement supporting the catalytic activities rather than
      a function in its own right, so it is kept as non-core.
    supported_by:
    - reference_id: PMID:11555662
      supporting_text: The SET complex contains a 25-kDa Mg(2+)-dependent nuclease that degrades calf
        thymus DNA and plasmid DNA.
    - reference_id: PMID:14960567
      supporting_text: The activity is dependent upon the presence of Mg(2+), is most pronounced with
        single-stranded substrates
- term:
