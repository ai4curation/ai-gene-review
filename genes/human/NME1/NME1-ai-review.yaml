  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - AGI_LocusCode:AT4G11010
  - PANTHER:PTN000142925
  - RGD:619877
  - RGD:70497
