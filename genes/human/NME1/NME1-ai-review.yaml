- term:
    id: GO:0004520
    label: DNA endonuclease activity
  evidence_type: IDA
  original_reference_id: PMID:11694515
  qualifier: enables
  review:
    summary: NM23-H1 acts as a Mg2+-dependent DNA endonuclease (GzmA-activated DNase that nicks DNA; cleavage
      of PDGF-A promoter elements).
    action: KEEP_AS_NON_CORE
    reason: Experimental evidence from three independent studies supports single-strand nicking/cleavage
      of DNA by recombinant or SET-complex NM23-H1, with silencing protecting cells from GzmA-mediated
      DNA damage. The activity is context-specific (released from SET inhibition during granzyme A attack)
      and not the evolutionarily conserved function of the NDK family, so it is kept as non-core rather
      than core.
    supported_by:
    - reference_id: PMID:11694515
      supporting_text: Recombinant human NM23-H1 cleaved within the 3'-portions of both 5'-SHS strands
        in either single-stranded or duplex forms.
