- term:
    id: GO:0005634
    label: nucleus
  evidence_type: EXP
  original_reference_id: PMID:12628186
  qualifier: located_in
  review:
    summary: NME1 has a minor nuclear pool that increases after DNA damage or granzyme A attack.
    action: KEEP_AS_NON_CORE
    reason: NME1 is predominantly cytoplasmic but a nuclear fraction is consistently observed and is where
      its nuclease activities act (PMID:12628186, PMID:16313181). The nuclear location is real but peripheral
      to the core cytosolic NDP kinase function.
    supported_by:
    - reference_id: PMID:12628186
      supporting_text: After GzmA loading or CTL attack, SET and NM23-H1 translocate to the nucleus and
        SET is degraded, allowing NM23-H1 to nick chromosomal DNA.
- term:
    id: GO:0005634
    label: nucleus
  evidence_type: EXP
  original_reference_id: PMID:16442775
  qualifier: located_in
  review:
    summary: NME1 has a minor nuclear pool that increases after DNA damage or granzyme A attack.
    action: KEEP_AS_NON_CORE
    reason: NME1 is predominantly cytoplasmic but a nuclear fraction is consistently observed and is where
      its nuclease activities act (PMID:12628186, PMID:16313181). The nuclear location is real but peripheral
      to the core cytosolic NDP kinase function. The assayed protein was the NM23-LV read-through product
      (UniProt isoform 3, listed under P22392-2), which carries the NM23-H1 N-terminus fused to complete
      NM23-H2.
    supported_by:
    - reference_id: PMID:16442775
      supporting_text: In neuroblastoma cells, the NM23-LV protein has mainly a cytoplasmic localization,
        but some nuclear staining was observed as well.
