- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:16760425
  qualifier: enables
  supporting_entities:
  - UniProtKB:P0DP23
  review:
    summary: Protein binding (IPI) with calmodulin, from the study showing that CP110 binds calmodulin
      and centrin.
    action: MODIFY
    reason: The interaction partner is calmodulin, and the study shows a functional calmodulin-binding
      region in CP110 whose mutation causes cytokinesis failure; the informative molecular function term
      is calmodulin binding.
    proposed_replacement_terms:
    - id: GO:0005516
      label: calmodulin binding
    supported_by:
    - reference_id: PMID:16760425
      supporting_text: we report that CP110 interacts with two different Ca2+-binding proteins, calmodulin
        (CaM) and centrin, in vivo
    - reference_id: PMID:16760425
      supporting_text: Importantly, expression of a CP110 mutant unable to bind CaM also promotes cytokinesis
        failure and binucleate cell formation.
    - reference_id: file:human/CCP110/CCP110-deep-research-falcon.md
      supporting_text: CP110 also binds calmodulin directly through multiple regions; a CaM-binding-defective
        CP110 mutant still localized to centrosomes but increased binucleate cells, linking this interaction
        to cytokinesis and genome stability
