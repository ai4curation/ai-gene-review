core_functions:
- description: 'Distal centriole cap: binds microtubule plus ends at the distal tips of centrioles, blocking
    growth and depolymerization and (with CPAP) setting centriole length.'
  molecular_function:
    id: GO:0051010
    label: microtubule plus-end binding
  directly_involved_in:
  - id: GO:1903722
    label: regulation of centriole elongation
  locations:
  - id: GO:0005814
    label: centriole
  supported_by:
  - reference_id: PMID:39847124
    supporting_text: We found that whereas CEP97 does not bind to microtubules directly, CP110 autonomously
      binds microtubule plus ends, blocks their growth, and inhibits depolymerization.
- description: With CEP97 (anchored via MPHOSPH9/KIF24), the CP110 cap on the mother centriole suppresses
    primary cilium formation in proliferating cells; TTBK2-dependent removal of the cap licenses basal
    body conversion and axoneme growth.
  directly_involved_in:
  - id: GO:1902018
    label: negative regulation of cilium assembly
  locations:
  - id: GO:0005814
    label: centriole
  supported_by:
  - reference_id: PMID:17719545
    supporting_text: suggesting that Cep97 and CP110 collaborate to inhibit a ciliogenesis program
  - reference_id: PMID:23141541
    supporting_text: TTBK2 acts at the distal end of the basal body, where it promotes the removal of
      CP110, which caps the mother centriole
- description: Required for centriole duplication (procentriole formation and PLK4-driven amplification),
    with abundance controlled by CDK phosphorylation, SCF(cyclin F) degradation and USP33 deubiquitination.
  directly_involved_in:
  - id: GO:0007099
    label: centriole replication
  locations:
  - id: GO:0005814
    label: centriole
  supported_by:
  - reference_id: PMID:12361598
    supporting_text: RNAi-mediated depletion of CP110 indicates that this protein plays an essential role
      in centrosome duplication.
  - reference_id: PMID:20596027
    supporting_text: CP110 is ubiquitylated by the SCF(Cyclin F) ubiquitin ligase complex, leading to
      its degradation
suggested_questions:
- question: HPA detects CCP110 only at centriolar satellites (Approved) and not at the centriole/basal
    body, which contrasts with the extensive literature placing CP110 at distal centriole ends; is this
    an antibody/epitope accessibility issue or a genuine satellite pool?
- question: How are the suppressive (cultured cycling cells) and promoting (Cp110-null mouse tissues)
    roles of CP110 in ciliogenesis reconciled mechanistically, e.g. via subdistal appendage assembly versus
    cap removal timing?
suggested_experiments:
- description: Separation-of-function CP110 mutants defective in microtubule plus-end binding but competent
    for CEP97 binding, tested for centriole length control, cap retention and ciliogenesis suppression
    in CP110-null RPE1 cells.
- description: Validate the HPA centriolar-satellite signal with an independent CP110 antibody and endogenous
    tagging, co-staining for PCM1 and distal centriole markers.
