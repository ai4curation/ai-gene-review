- term:
    id: GO:0045724
    label: positive regulation of cilium assembly
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q7TSH4
  - ensembl:ENSMUSP00000102167
  review:
    summary: Positive regulation of cilium assembly (IEA), transferred from mouse Cp110.
    action: KEEP_AS_NON_CORE
    reason: Cp110-null mice fail to form cilia in several tissues, showing an in vivo requirement for
      CP110 in early ciliogenesis (subdistal appendages, ciliary vesicle docking). This coexists with
      the better-established suppressive role of the cap in cycling cultured cells; retained as a genuine
      but context-dependent, non-core annotation.
    supported_by:
    - reference_id: PMID:26965371
      supporting_text: Here, we demonstrate that CP110 promotes cilia formation in vivo, in contrast to
        findings in cultured cells.
    - reference_id: PMID:26965371
      supporting_text: We suggest that CP110 has unique context-dependent functions, acting as both a
        suppressor and a promoter of ciliogenesis.
