- term:
    id: GO:0008017
    label: microtubule binding
  evidence_type: IDA
  original_reference_id: PMID:39847124
  qualifier: enables
  review:
    summary: Microtubule binding (IDA) from in vitro reconstitution with purified CP110.
    action: ACCEPT
    reason: CP110 autonomously binds microtubule plus ends, blocks their growth and inhibits depolymerization;
      this direct activity underlies its capping function. The more specific microtubule plus-end binding
      term would also be appropriate.
