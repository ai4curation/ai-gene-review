      supporting_text: Plk4 is required--in cooperation with Cdk2, CP110 and Hs-SAS6--for the precise
        reproduction of centrosomes during the cell cycle
    - reference_id: PMID:17681131
      supporting_text: Plk4, hSas-6, CPAP, Cep135, gamma-tubulin, and CP110 were required at different
        stages of procentriole formation
