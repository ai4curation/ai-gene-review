- term:
    id: GO:0051010
    label: microtubule plus-end binding
  evidence_type: IDA
  original_reference_id: PMID:39847124
  review:
    summary: 'Proposed: CP110 binds microtubule plus ends directly (in vitro reconstitution and cryo-ET).'
    action: NEW
    reason: The existing IDA microtubule binding annotation from the same study is correct but less specific;
      the study shows plus-end-specific binding at the luminal side of the plus end, which is the basis
      of the capping activity.
    supported_by:
    - reference_id: PMID:39847124
      supporting_text: We found that CP110 can specifically bind to MT plus ends and block their growth,
        whereas CEP97 does not interact with MTs directly.
    - reference_id: PMID:39847124
      supporting_text: Cryo-electron tomography revealed that CP110 associates with the luminal side of
        microtubule plus ends and suppresses protofilament flaring.
- term:
    id: GO:1903722
    label: regulation of centriole elongation
  evidence_type: IDA
  original_reference_id: PMID:39847124
  review:
    summary: 'Proposed: CP110 controls centriole elongation by capping microtubule plus ends.'
    action: NEW
    reason: 'CP110 itself performs the step: it binds centriolar microtubule plus ends, blocks their growth
      and is counteracted by CPAP, and disrupting the CP110-CPAP interaction alters centriole elongation.
      Centrioles elongate underneath the CP110 cap. Orthologous CCP110 proteins in other species already
      carry the child term negative regulation of centriole elongation; the parent regulation term is
      proposed for human because CP110 can both restrain and, with CPAP, permit elongation.'
    supported_by:
    - reference_id: PMID:39847124
      supporting_text: CP110 directly interacts with CPAP, which acts as a microtubule polymerase that
        overcomes CP110-induced growth inhibition.
    - reference_id: PMID:39847124
      supporting_text: Disruption of CP110-CPAP interaction in cells inhibits centriole elongation and
        increases incidence of centriole defects.
    - reference_id: PMID:17681131
      supporting_text: centrioles elongate through insertion of alpha-/beta-tubulin underneath a CP110
        cap
