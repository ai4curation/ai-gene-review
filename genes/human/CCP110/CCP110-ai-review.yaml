id: O43303
gene_symbol: CCP110
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CCP110 (CP110) is a coiled-coil centriolar protein that caps the distal ends of centrioles.
  CP110 binds microtubule plus ends directly, associates with their luminal side, blocks their growth
  and suppresses depolymerization; together with CPAP it controls the slow, limited elongation of centriolar
  microtubules. CP110 is recruited early to nascent procentrioles and is required for centriole duplication,
  including PLK4-driven centriole amplification; its levels are set by CDK phosphorylation, SCF(cyclin
  F)-mediated ubiquitination and USP33 deubiquitination. With its partner CEP97, and with KIF24 and MPHOSPH9,
  CP110 forms a cap on the mother centriole that suppresses primary cilium formation in proliferating
  cells, partly by restraining CEP290; TTBK2 activity at the distal appendages triggers loss of the cap
  at cilium initiation. In mice CP110 is also required in vivo for subdistal appendage assembly, ciliary
  vesicle docking and cilium formation, so its role in ciliogenesis is context dependent. CP110 also binds
  calmodulin and centrin and is required for completion of cytokinesis.
