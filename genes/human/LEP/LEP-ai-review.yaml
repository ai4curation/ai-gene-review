id: P41159
gene_symbol: LEP
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'Leptin is a 146-residue secreted four-helix-bundle cytokine-like peptide hormone produced
  mainly by white adipocytes in proportion to fat mass. Circulating leptin binds the class I cytokine
  receptor LEPR, assembling ligand-receptor complexes that activate JAK2-STAT3 and other pathways. Its
  principal physiological role is as the afferent signal of energy stores to the hypothalamus: in the
  arcuate nucleus it activates anorexigenic POMC neurons and inhibits orexigenic AgRP/NPY neurons, suppressing
  appetite and supporting energy expenditure. Falling leptin signals starvation and permits the neuroendocrine
  adaptations to it, so leptin is also required permissively for gonadotropin secretion, puberty and fertility,
  for thyroid axis activity, and for normal T cell number and function. Peripheral LEPR signalling mediates
  additional pleiotropic effects on immune cells, endothelium, bone and other tissues. Biallelic loss-of-function
  LEP variants cause congenital leptin deficiency with severe early-onset hyperphagic obesity, hypogonadotropic
  hypogonadism and immune dysfunction, all reversed by recombinant leptin (metreleptin).'
