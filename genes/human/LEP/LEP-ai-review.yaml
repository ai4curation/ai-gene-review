- term:
    id: GO:0000122
    label: negative regulation of transcription by RNA polymerase II
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P41160
  - ensembl:ENSMUSP00000067046
  review:
    summary: Ortholog-transferred annotation to negative regulation of Pol II transcription.
    action: MARK_AS_OVER_ANNOTATED
    reason: Leptin is a secreted hormone without nuclear function; transcriptional effects are mediated
      by LEPR-activated STAT3 in target cells. Leptin acts on this process only indirectly, as an extracellular
      ligand that activates LEPR-JAK2 signalling in target cells. The annotation is not wrong as a regulatory
      effect, but it is one of many pleiotropic downstream consequences of receptor activation and does
      not describe the hormone's own activity.
    supported_by:
    - &id004
      reference_id: file:human/LEP/LEP-uniprot.txt
      supporting_text: has central and peripheral effects by binding LEPR
    - &id015
      reference_id: PMID:17344214
      supporting_text: leptin induced Stat3-phosphorylation-dependent proliferation of MCF7 cells
