  review:
    summary: CPOX supplies an upstream catalytic contribution to the heme-A pathway.
    action: KEEP_AS_NON_CORE
    reason: The current pathway definition includes reactions leading to heme A, and the exact mouse P36552
      IDA cites PMID:8407975. That original measures recombinant mouse coproporphyrinogen-oxidase activity
      and mitochondrial import, not heme-A production or terminal heme modification. A complete current
      human/mouse/rat QuickGO query nevertheless shows experimentally annotated upstream comparators including
      Alad, Hmbs, Uros, Urod, Ppox, Fech and Alas1 alongside Cpox. Thus the annotation convention is not
      restricted to COX10/COX15. CPOX performs the shared precursor-forming chemistry itself; retain the
      existing broader downstream contribution as non-core while the compact core remains on the directly
      characterized heme-B pathway. No human heme-A measurement or terminal synthase activity is claimed.
    additional_reference_ids:
