- union_index: 3
  retired: false
  term:
    id: GO:0004109
    label: coproporphyrinogen oxidase activity
  review:
    summary: Coproporphyrinogen oxidase is the defining catalytic activity of CPOX.
    action: ACCEPT
    reason: 'The combined electronic assertion has distinct, traceable premises: current ARBA00087102
      branch 0 matches the official FunFam and Metazoa predicates; three InterPro signatures identify
      the enzyme family; EC 1.3.3.3 and RHEA:18257 specify its oxidative-decarboxylation reaction; and
      the two ortholog identifiers map to actual mouse and rat records. These premises converge on GO:0004109
      and agree with direct human activity. The source-specific comments separate rule matching, family
      recognition, chemistry and ortholog evidence.'
    additional_reference_ids:
    - PMID:8159699
    - PMID:16176984
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: ARBA:ARBA00087102
        source_status: SUPPORTS_TRANSFER
        comment: Current ARBA00087102 zero-based branch 0 matches both FunFam 3.40.1500.10:FF:000002 and
          Metazoa (33208) in the official human record. This is a current predicate trace, not reconstruction
          of an earlier rule release.
      - source_id: UniProtKB:P36552
        source_status: SUPPORTS_TRANSFER
        comment: The exact mouse P36552 source has same-term IDA records including PMID:8407975, whose
          recombinant mouse activity was read in the independent original-source consultation. No direct
          human experiment is attributed to this mouse donor.
      - source_id: ensembl:ENSMUSP00000055455
        source_status: SUPPORTS_TRANSFER
        comment: The official mouse cross-reference resolves this Ensembl protein to P36552. It is an
          alternative identifier of that donor, not an independent experiment; the P36552 source comment
          states the actual assay scope.
      - source_id: UniProtKB:Q3B7D0
        source_status: SUPPORTS_TRANSFER
        comment: The rat Q3B7D0 query contains the exact same-term experimental record(s), PMID:11079369
          (IDA) and PMID:666752 (EXP). Those donor records were inspected; their original full papers
          were not independently read here. The transfer is corroborated by human catalysis, not by an
          invented ARBA match on this donor.
      - source_id: ensembl:ENSRNOP00000002257
        source_status: SUPPORTS_TRANSFER
        comment: The official rat cross-reference resolves this Ensembl protein to Q3B7D0. It is an alternative
          identifier of that donor, not an additional assay; the Q3B7D0 source comment distinguishes record
          inspection from primary-paper access.
      - source_id: InterPro:IPR001260
        source_status: SUPPORTS_TRANSFER
        comment: The official human record contains InterPro:IPR001260, representing the coproporphyrinogen
          III oxidase family. This family/signature premise is consistent with direct catalytic evidence;
          it is distinct from an ARBA branch or direct assay.
      - source_id: InterPro:IPR018375
        source_status: SUPPORTS_TRANSFER
        comment: The official human record contains InterPro:IPR018375, representing the conserved coproporphyrinogen
