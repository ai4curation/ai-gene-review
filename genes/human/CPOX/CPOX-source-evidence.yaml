    - 'DISEASE: Hereditary coproporphyria (HCP) [MIM:121300]: A form of porphyria. Porphyrias are inherited
      defects in the biosynthesis of heme, resulting in the accumulation and increased excretion of porphyrins
      or porphyrin precursors. They are classified as erythropoietic or hepatic, depending on whether
      the enzyme deficiency occurs in red blood cells or in the liver. Hereditary coproporphyria is an
      acute hepatic porphyria characterized by skin photosensitivity, attacks of abdominal pain, neurological
      disturbances, and psychiatric symptoms. Most attacks are precipitated by drugs, alcohol, caloric
      deprivation, infections, or endocrine factors. Hereditary coproporphyria is biochemically characterized
      by overexcretion of coproporphyrin III in the urine and in the feces. {ECO:0000269|PubMed:12181641,
      ECO:0000269|PubMed:15896662, ECO:0000269|PubMed:16398658, ECO:0000269|PubMed:7757079, ECO:0000269|PubMed:7849704,
      ECO:0000269|PubMed:8012360, ECO:0000269|PubMed:8990017, ECO:0000269|PubMed:9048920, ECO:0000269|PubMed:9298818,
      ECO:0000269|PubMed:9888388}. Note=The disease is caused by mutations affecting the gene represented
      in this entry.'
