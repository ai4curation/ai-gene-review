      hypomorphic mouse Cpox, reduced enzyme activity, porphyrin accumulation and transgenic rescue, while
      leaving the opacity mechanism unresolved. GO:0005212 requires an activity contributing to lens structural
      integrity; the evidence read does not distinguish a structural moonlighting role from metabolic
      protection of the lens. Preserve the positive mouse phenotype and unresolved function/transfer rather
      than infer a wrong gene or biological absence. The current exact-term cross-species query confirms
      the Cpox donor but does not determine its mechanism. Reduced enzyme activity and rescue cannot,
      by themselves, exclude a second structural activity.
