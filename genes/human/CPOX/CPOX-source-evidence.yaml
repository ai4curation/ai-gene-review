  term:
    id: GO:0006783
    label: heme biosynthetic process
  review:
    summary: CPOX performs a catalytic step in heme biosynthesis.
    action: ACCEPT
    reason: Oxidative decarboxylation of coproporphyrinogen III to protoporphyrinogen IX is performed
      by CPOX itself. This is pathway participation, not merely a requirement or an effect on a downstream
      product. Human functional expression and the existing GO-CAM activity support the broad heme pathway
      assertion.
    additional_reference_ids:
    - PMID:8159699
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN000079415
        source_status: SUPPORTS_TRANSFER
        comment: The actual current PTN000079415 IBD is on the target path, the 454-residue human MSA
          is exact, and extant target/ortholog experimental records provide positive context. Historical
          placement is not reconstructed.
