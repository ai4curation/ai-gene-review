    summary:
    - dbId: 189418
      displayName: O2-dependent coproporpyrinogen oxidase (CPO) catalyzes the c...
      text: O2-dependent coproporpyrinogen oxidase (CPO) catalyzes the conversion of coproporphyrinogen
        III (COPRO3) to protoporphyrinogen IX (PPGEN9) (Martasek et al. 1994). The localization of the
        human enzyme to the mitochondrial intermembrane space is inferred from studies of the homologous
        rat enzyme (Elder and Evans 1978). The human enzyme functions as a homodimer (Lee et al. 2005).
        Enzyme deficiency is associated with hereditary coproporphyria in vivo.
