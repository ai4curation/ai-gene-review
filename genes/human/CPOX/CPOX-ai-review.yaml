id: P36551
gene_symbol: CPOX
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CPOX is an oxygen-dependent coproporphyrinogen-III oxidase that catalyzes successive oxidative
  decarboxylations of two propionate side chains to form protoporphyrinogen IX in heme biosynthesis. The
  characterized human enzyme is a homodimer and does not require a metal or organic cofactor. Its mitochondrial
  precursor is processed to a mature enzyme in the intermembrane space; rat fractionation additionally
  identifies a loosely inner-membrane-associated fraction. Pathogenic variants cause hereditary coproporphyria
  or harderoporphyria.
alternative_products:
- name: '1'
  id: P36551-1
- name: '2'
  id: P36551-2
  sequence_note: VSP_057182, VSP_057183
