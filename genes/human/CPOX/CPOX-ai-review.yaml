core_functions:
- description: The characterized human CPOX homodimer catalyzes oxygen-dependent oxidative decarboxylation
    of coproporphyrinogen III to protoporphyrinogen IX in the mitochondrial intermembrane-space heme pathway.
    It performs the chemical step itself; the shorter annotated product has not been shown to retain equivalent
    catalysis.
  molecular_function:
    id: GO:0004109
    label: coproporphyrinogen oxidase activity
  directly_involved_in:
  - *id001
  locations:
  - *id002
  supported_by:
  - reference_id: PMID:16176984
    supporting_text: "deletion of residues (392-418) encoded by exon \nsix disrupts dimerization"
  - reference_id: file:human/CPOX/CPOX-uniprot.txt
    record_section: ["CC:FUNCTION"]
    supporting_text: Catalyzes the aerobic oxidative decarboxylation of propionate
suggested_questions:
- question: Does the 287-residue alternative product retain measurable activity or form dimers, given
    its altered 272–287 segment and loss of residues 288–454?
- question: Does CPOX contribute directly to lens structural integrity, or does its metabolic activity
    protect transparency through control of porphyrin/heme balance, and how does the mouse phenotype translate
    to humans?
- question: How is flux from the CPOX reaction partitioned into heme A versus other heme products in different
    human tissues?
- question: How do mitochondrial import, peripheral membrane association and metabolite transfer to PPOX
    vary across human tissues and assay conditions?
suggested_experiments:
- description: Compare purified canonical mature CPOX and the reconstructed alternative product for folding,
    oligomerization and coproporphyrinogen conversion, with product-specific localization in cells.
- description: Separate catalytic rescue from a putative noncatalytic lens role using expression-matched
    catalytically impaired and structurally intact variants, measuring porphyrin accumulation and lens
    transparency.
