  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  review:
    summary: The inherited cytoplasm annotation is compatible with mitochondrial localization but can
      be made more specific.
    action: MODIFY
    reason: Current GO:0005737 includes organelles, so mitochondrial targeting does not contradict this
      IBA. The actual current PTN000079415 IBD lies on the human target path and its aligned sequence
      exactly matches the canonical product. Refine the broad location to the established mitochondrial
      intermembrane space, without claiming it is the sole possible location or treating the target among
      its own extant evidence as circular.
    additional_reference_ids:
    - PMID:31872
    - PMID:8407975
    proposed_replacement_terms:
    - &id002
      id: GO:0005758
