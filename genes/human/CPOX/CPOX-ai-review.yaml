- term:
    id: GO:0016020
    label: membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: located_in
  review:
    summary: Membrane association is retained with distinct mouse-fraction and rat-attachment evidence.
    action: KEEP_AS_NON_CORE
    reason: The exact mouse P36552 IMP donor cites PMID:20080761. Its original Table 1 identifies CPOX
      among mitochondrial proteins enriched in Atg7-null erythrocyte ghosts, but retained mitochondria
      make that preparation nondiscriminating for CPOX membrane attachment. Independent rat PMID:31872
      supports a peripheral inner-membrane-associated fraction through salt/pH release and sonication,
      while reporting that binding was not retained on isolated membranes. GO:0016020 includes attached
      proteins; intermembrane-space localization alone does not imply bilayer association. Retain broad
      membrane association as non-core on the combined ortholog evidence, without a direct human attachment
      assay, integral topology or plasma-membrane claim.
