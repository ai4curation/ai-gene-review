id: P36551
gene_symbol: CPOX
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CPOX is an oxygen-dependent coproporphyrinogen-III oxidase that catalyzes successive oxidative
  decarboxylations of two propionate side chains to form protoporphyrinogen IX, an intermediate in heme
  biosynthesis. The characterized human enzyme is a homodimer and does not require a metal or organic
  cofactor. Its mitochondrial precursor is processed to a mature enzyme associated with the intermembrane-space
  pathway; a loosely inner-membrane-associated fraction is supported by rat fractionation experiments.
  Pathogenic variants cause hereditary coproporphyria or harderoporphyria. The shorter annotated alternative
  product lacks much of the C-terminal catalytic and dimerization region, and equivalent catalytic function
  has not been established.
alternative_products:
- name: '1'
  id: P36551-1
- name: '2'
  id: P36551-2
  sequence_note: VSP_057182, VSP_057183
