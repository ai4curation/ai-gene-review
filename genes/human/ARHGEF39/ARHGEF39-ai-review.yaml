  review:
    summary: Guanyl-nucleotide exchange factor activity (IEA, InterPro DH domain). ARHGEF39 is a minimal
      Dbl-family GEF (DH-PH only). In FRET biosensor assays it activates RhoA but not Rac1 or Cdc42. A
      lung cancer study calls it a Rac-GEF, but there its knockdown did not significantly lower global
      Rac1-GTP. Accepted as core, with RhoA as the demonstrated substrate.
    action: ACCEPT
    reason: '[PMID:22327280 "we showed that C9orf100, a new member of the Dbl-family GEFs with a minimal
      catalytic unit, may contribute to hepatocellular carcinoma (HCC)."] [PMID:35959104 "Activation of
      CDC42 or RAC1 were not observed at any ratio. In contrast, RHOA showed significant activation when
      ARHGEF39 was overexpressed at a 1:5 transfection ratio to the biosensor (p = 0.000001) (Figure 1B)."]
      [PMID:34731623 "revealed that only FARP1 depletion reduced Rac1-GTP levels significantly (Figure
      S4C)."]'
    supported_by:
    - reference_id: PMID:22327280
      supporting_text: we showed that C9orf100, a new member of the Dbl-family GEFs with a minimal catalytic
        unit, may contribute to hepatocellular carcinoma (HCC).
