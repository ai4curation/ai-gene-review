- id: PMID:35959104
  title: ARHGEF39, a Gene Implicated in Developmental Language Disorder, Activates RHOA and Is Involved
    in Cell De-Adhesion and Neural Progenitor Cell Proliferation.
  findings:
  - statement: ARHGEF39 activates RhoA but not Rac1 or Cdc42.
    supporting_text: Activation of CDC42 or RAC1 were not observed at any ratio. In contrast, RHOA showed
      significant activation when ARHGEF39 was overexpressed at a 1:5 transfection ratio to the biosensor
      (p = 0.000001) (Figure 1B).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text; FRET biosensors in HEK293FT cells.
- id: PMID:34731623
  title: FARP1, ARHGEF39, and TIAM2 are essential receptor tyrosine kinase effectors for Rac1-dependent
    cell motility in human lung adenocarcinoma.
  findings:
  - statement: ARHGEF39 is required for growth-factor-stimulated lung cancer cell migration.
    supporting_text: Here, we identify FARP1, ARHGEF39, and TIAM2 as essential Rac-GEFs responsible for
      Rac1-mediated lung cancer cell migration upon EGFR and c-Met activation.
  - statement: ARHGEF39 knockdown abolishes EGF-dependent Rac1 activation measured by FRET.
    supporting_text: Remarkably, FRET experiments determined that silencing any of the three GEFs abolished
      EGF-dependent Rac1 activation (Figure 4B; videos in Data S2).
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text; supports a Rac1 role by FRET (knockdown), while the global PBD pull-down
      showed no significant change.
- id: PMID:32203420
  title: Systems analysis of RhoGEF and RhoGAP regulatory proteins reveals spatially organized RAC1 signalling
    from integrin adhesions.
  findings: []
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    review_notes: Family-wide RhoGEF biosensor screen (Müller et al. 2020); per PMID:35959104 it detected
      no significant RHOA, RAC1 or CDC42 activation by ARHGEF39. Abstract-only here, so the ARHGEF39-specific
      result is taken from that secondhand description.
