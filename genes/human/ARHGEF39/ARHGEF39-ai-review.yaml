id: Q8N4T4
gene_symbol: ARHGEF39
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ARHGEF39 (C9orf100) is a small (335-residue) Dbl-family Rho guanine nucleotide exchange factor
  consisting essentially of a DH-PH catalytic unit. In one cell-based FRET biosensor study it activated
  RhoA but not Rac1 or Cdc42, and high expression causes cells to detach; a lung cancer study instead
  places it upstream of Rac1. It is cytosolic at rest and moves to the plasma membrane and ruffles on
  growth-factor stimulation. In cancer cell lines it promotes proliferation and migration and is required
  for growth-factor-stimulated lung adenocarcinoma cell migration. It is a marker of proliferating neural
  progenitor cells and has been implicated in developmental language disorder.
