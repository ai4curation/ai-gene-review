id: Q8N4T4
gene_symbol: ARHGEF39
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ARHGEF39 (C9orf100) is a small (335-residue) Dbl-family Rho guanine nucleotide exchange factor
  consisting essentially of a DH-PH catalytic unit. In cell-based FRET biosensor assays it activates RhoA
  but not Rac1 or Cdc42, and high expression causes cells to detach. It localizes to the plasma membrane
  and focal adhesions. In cancer cell lines it promotes proliferation and migration and is required for
  growth-factor-stimulated lung adenocarcinoma cell migration. It is a marker of proliferating neural
  progenitor cells and has been implicated in developmental language disorder.
