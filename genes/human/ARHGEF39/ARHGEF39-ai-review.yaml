- term:
    id: GO:0005085
    label: guanyl-nucleotide exchange factor activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR000219
  review:
    summary: Guanyl-nucleotide exchange factor activity (IEA, InterPro DH domain). ARHGEF39 is a minimal
      DH-PH Dbl-family GEF; GO:0005085 is the only GEF term because GO:0005089 (Rho GEF activity) was
      merged into it. Its substrate is contested. RhoA is recorded as the substrate because overexpression
      directly activates a RhoA biosensor, whereas the Rac1 evidence is a knockdown requirement compatible
      with an indirect route. Accepted as core.
    action: ACCEPT
    reason: 'For RhoA: [PMID:35959104 "Activation of CDC42 or RAC1 were not observed at any ratio. In
      contrast, RHOA showed significant activation when ARHGEF39 was overexpressed at a 1:5 transfection
      ratio to the biosensor (p = 0.000001) (Figure 1B)."] Caveats: [PMID:35959104 "A significant effect
      on RHOA activation was only observed at the highest ratio (1:5) and not at the lower ratios (1:1
      or 1:3)."] [PMID:35959104 "A family-wide screen of Rho GTPase activation by RhoGEFs using biosensors
      in HEK293T cells previously did not detect any significant activity of RHOA, RAC1, or CDC42 by ARHGEF39
      (Müller et al., 2020)."] For Rac1: [PMID:34731623 "Remarkably, FRET experiments determined that
      silencing any of the three GEFs abolished EGF-dependent Rac1 activation (Figure 4B; videos in Data
      S2)."] [PMID:35959104 "Another previous study exploring the interaction partners of ARHGEF39 identified
      RAC1, but not RHOA (or CDC42) in a pulldown assay from lung cancer cells overexpressing ARHGEF39
      (Zhou et al., 2018)."] The global pull-down showed no significant drop in Rac1-GTP after ARHGEF39
      knockdown, [PMID:34731623 "revealed that only FARP1 depletion reduced Rac1-GTP levels significantly
      (Figure S4C)."] but the authors considered that assay insensitive. Overexpression activating RhoA
      is closer to direct exchange than knockdown abolishing Rac1 activation, which is compatible with
      an indirect RhoA-to-Rac1 route; purified-protein assays are needed.'
    supported_by:
    - reference_id: PMID:22327280
      supporting_text: we showed that C9orf100, a new member of the Dbl-family GEFs with a minimal catalytic
        unit, may contribute to hepatocellular carcinoma (HCC).
    - reference_id: PMID:35959104
      supporting_text: Activation of CDC42 or RAC1 were not observed at any ratio. In contrast, RHOA showed
        significant activation when ARHGEF39 was overexpressed at a 1:5 transfection ratio to the biosensor
        (p = 0.000001) (Figure 1B).
    - reference_id: PMID:35959104
      supporting_text: A significant effect on RHOA activation was only observed at the highest ratio
        (1:5) and not at the lower ratios (1:1 or 1:3).
    - reference_id: PMID:35959104
      supporting_text: A family-wide screen of Rho GTPase activation by RhoGEFs using biosensors in HEK293T
        cells previously did not detect any significant activity of RHOA, RAC1, or CDC42 by ARHGEF39 (Müller
        et al., 2020).
    - reference_id: PMID:34731623
      supporting_text: Remarkably, FRET experiments determined that silencing any of the three GEFs abolished
        EGF-dependent Rac1 activation (Figure 4B; videos in Data S2).
    - reference_id: PMID:35959104
      supporting_text: Another previous study exploring the interaction partners of ARHGEF39 identified
        RAC1, but not RHOA (or CDC42) in a pulldown assay from lung cancer cells overexpressing ARHGEF39
        (Zhou et al., 2018).
