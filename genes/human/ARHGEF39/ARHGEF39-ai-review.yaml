suggested_questions:
- question: Is ARHGEF39 a RhoA-specific GEF, as FRET biosensors indicate, or does it also act on Rac1
    in local pools, as the lung cancer study proposes?
suggested_experiments:
- description: Measure nucleotide exchange by purified ARHGEF39 on RhoA, Rac1 and Cdc42 in vitro, and
    compare RhoA and Rac1 biosensor responses in the same cell type (the RhoA data are from HEK293FT,
    the Rac1 data from A549 cells).
