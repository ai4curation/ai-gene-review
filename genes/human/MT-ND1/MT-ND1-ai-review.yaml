- term:
    id: GO:0008137
    label: NADH dehydrogenase (ubiquinone) activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - RHEA:29091
  - EC:7.1.1.2
  review:
    summary: >-
      IEA annotation with the enables qualifier to NADH dehydrogenase (ubiquinone) activity, the EC 7.1.1.2
      activity of the whole complex (NADH + Q + 5H+ in = NAD+ + QH2 + 4H+ out).
    action: MODIFY
    reason: >-
      The activity belongs to the assembled holoenzyme: NADH oxidation, the flavin and Fe-S cofactors
      and the terminal electron donor N2 are all in nuclear-encoded peripheral-arm subunits. ND1 lines
      the ubiquinone-binding channel at the junction with the peripheral arm and contributes the first
      part of the E-channel, so it is required for, and contributes to, the complex activity but does
      not carry it alone. The term is right; the qualifier should be contributes_to. Its own subunit-level
      activity is captured in core_functions.
    proposed_replacement_terms:
    - id: GO:0008137
      label: NADH dehydrogenase (ubiquinone) activity
    supported_by:
    - reference_id: file:human/MT-ND1/MT-ND1-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Essential for the catalytic activity and assembly of complex I
    - reference_id: PMID:15250827
      supporting_text: Mitochondria-encoded ND (NADH dehydrogenase) subunits, as components of the hydrophobic
        part of complex I, are essential for NADH:ubiquinone oxidoreductase activity.
