- term:
    id: GO:0048039
    label: ubiquinone binding
  evidence_type: ISS
  original_reference_id: PMID:35589726
  qualifier: enables
  review:
    summary: >-
      Proposed new annotation: ND1 enables ubiquinone binding, as part of the Complex I quinone-binding
      channel.
    action: NEW
    reason: >-
      Mammalian Complex I structures show the ubiquinone-10 isoprenoid chain running along the ND1-NDUFS7
      interface and leaving the complex through ND1, with ND1 loops forming part of the Q-binding site.
      Patient-cell biochemistry is consistent: the ND1 m.3460G>A variant selectively lowers rotenone-sensitive,
      ubiquinone-dependent electron transfer. Evidence is from the conserved mammalian enzyme (sheep/mouse/bovine
      structures), so ISS. This is ND1's subunit-level contribution to the complex activity.
    supported_by:
    - reference_id: PMID:35589726
      supporting_text: then extending, as the isoprenoid chain, along the NDUFS2-NDUFS7 then ND1-NDUFS7
        interfaces to exit from ND1
    - reference_id: PMID:32747785
      supporting_text: ubiquinone is thought to worm its way up a channel at the hydrophilic/hydrophobic
        domain interface of the NDUFS2, NDUFS7, ND1 and ND3 subunits
    - reference_id: PMID:1959619
      supporting_text: This is in accordance with the proposal that the ND1 subunit interacts with rotenone
        and ubiquinone.
core_functions:
- description: >-
    Core membrane-arm subunit of Complex I at the junction with the peripheral arm. ND1 lines the exit
    of the ubiquinone-binding channel, where the isoprenoid tail of ubiquinone leaves the complex, and
    its loops shape the quinone site. It also contributes to the E-channel, the first proton-translocation
    unit. It contributes to the complex's proton-pumping NADH:ubiquinone oxidoreductase activity.
  molecular_function:
    id: GO:0048039
    label: ubiquinone binding
  contributes_to_molecular_function:
