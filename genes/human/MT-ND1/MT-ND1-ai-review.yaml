id: P03886
gene_symbol: MT-ND1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  MT-ND1 encodes NADH-ubiquinone oxidoreductase chain 1 (ND1), one of the seven mitochondrial-DNA-encoded
  core subunits of respiratory Complex I (NADH:ubiquinone oxidoreductase). This 318-residue, eight-helix
  protein in the inner mitochondrial membrane sits where the membrane arm meets the peripheral arm. Its
  loops line the ubiquinone-binding channel, and its glutamates start the E-channel, the first of four
  proton-translocation units. ND1 enters Complex I early in assembly and anchors the Q-module intermediate
  to the membrane. It is required for Complex I to oxidise NADH, reduce ubiquinone and pump protons. Pathogenic
  variants cause Leber hereditary optic neuropathy (m.3460G>A), MELAS and other complex I deficiencies.
