  - term:
      id: GO:0120045
      label: stereocilium maintenance
    evidence_type: IMP
    original_reference_id: DOI:10.1091/mbc.e21-10-0491
    review:
      summary: >-
        Loss of Baiap2l2 destabilizes transducing stereocilia and leads to deafness
        in mouse models, indicating a role in stereocilia maintenance. Evidence from
        deep research review.
      action: NEW
      reason: >-
        Halford et al. 2022 cites prior work showing that loss of Baiap2l2 destabilizes
        transducing stereocilia and causes deafness, indicating the protein functions
        in maintaining stereocilia structure and mechanotransduction apparatus.
      supported_by:
        - reference_id: file:human/BAIAP2L2/BAIAP2L2-deep-research-falcon.md
          supporting_text: >-
            Prior work summarized by Halford et al. indicates that loss of Baiap2l2
            destabilizes
            transducing stereocilia and leads to deafness, linking BAIAP2L2 to maintenance
            of
