- id: PMID:21401524
  title: Functional analysis of Dictyostelium IBARa reveals a conserved role of the I-BAR domain in
    endocytosis.
  findings:
  - statement: Human BAIAP2L2 co-localizes with clathrin plaques, supporting role in endocytosis
    supporting_text: human BAIAP2L2 (brain-specific angiogenesis inhibitor 1-associated protein 2-like
      2) also tightly co-localizes with clathrin plaques
  - statement: I-BAR proteins help generate membrane curvature for endocytosis
    supporting_text: The results from the present study suggest that I-BAR-containing proteins help
      generate the membrane curvature required for endocytosis and implies an unexpected role for
      IRSp53 family proteins in vesicle trafficking.
- id: PMID:21743456
  title: Pinkbar is an epithelial-specific BAR domain protein that generates planar membrane structures.
  findings:
  - statement: Pinkbar is expressed in intestinal epithelial cells
    supporting_text: We show that a previously uncharacterized member of the I-BAR subfamily, Pinkbar,
      is specifically expressed in intestinal epithelial cells
  - statement: Localizes to RAB13-positive vesicles and plasma membrane at intercellular junctions
    supporting_text: where it localizes to Rab13-positive vesicles and to the plasma membrane at intercellular
      junctions
  - statement: I-BAR domain has flat lipid-binding interface generating planar rather than tubular
      membrane structures
    supporting_text: Structural and mutagenesis analyses reveal that the BAR domain of Pinkbar has
      a relatively flat lipid-binding interface
  - statement: Forms sheet-like oligomers in crystals and solution
    supporting_text: it assembles into sheet-like oligomers in crystals and in solution, which may
      explain its unique membrane-deforming activity
  - statement: Promotes planar membrane sheet formation
    supporting_text: Notably, the BAR domain of Pinkbar does not induce membrane tubulation but promotes
      the formation of planar membrane sheets
