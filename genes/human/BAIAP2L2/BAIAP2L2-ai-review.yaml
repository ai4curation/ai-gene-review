  title: OpenScientist focused report on BAIAP2L2/Pinkbar nucleoplasm localization
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: The report adds a current-database absence check and summarizes direct membrane/vesicle/stereocilia
      localization. Its own limitations admit that missing nuclear annotations, null HPA fields and
      a heuristic NLS scan do not exclude a nuclear pool; these data do not justify the stronger refuted
      verdict. The historical GOA source is known (PTN001022094), although absent from the current
      cache. Its suggested clathrin cross-organism misattribution is contradicted by the PMID:21401524
      abstract, which explicitly tests human BAIAP2L2.
core_functions:
  - description: >-
      Generation of planar membrane structures through the I-BAR domain. Unlike other
      I-BAR family members that induce membrane tubulation, Pinkbar's relatively flat
      lipid-binding interface and sheet-like oligomerization generate planar membrane
      sheets at epithelial cell junctions and vesicle membranes.
    molecular_function:
      id: GO:0005543
      label: phospholipid binding
    supported_by:
      - reference_id: PMID:21743456
        supporting_text: >-
          Notably, the BAR domain of Pinkbar does not induce membrane tubulation but
          promotes
          the formation of planar membrane sheets.
    directly_involved_in:
      - id: GO:0061024
        label: membrane organization
      - id: GO:0097753
        label: membrane bending
    locations:
      - id: GO:0005886
        label: plasma membrane
      - id: GO:0012506
        label: vesicle membrane
  - description: >-
      Scaffolding function in stereocilia tip complex. BAIAP2L2 forms a tripartite
      complex with MYO15A and EPS8 for transport to and retention at stereocilia tips.
      Loss of function leads to destabilization of transducing stereocilia and deafness.
    molecular_function:
      id: GO:0005543
      label: phospholipid binding
    supported_by:
      - reference_id: file:human/BAIAP2L2/BAIAP2L2-deep-research-falcon.md
        supporting_text: >-
          BAIAP2L2 becomes highly enriched at the tips of stereocilia (with row-specific
          enrichment)
          in cochlear hair cells. Tip localization requires functional mechanotransduction
          (MET)
          channels and is lost upon acute pharmacological channel block or intracellular
          Ca2+ chelation
    directly_involved_in:
      - id: GO:0120045
        label: stereocilium maintenance
    locations:
      - id: GO:0032426
        label: stereocilium tip
  - description: >-
      Role in clathrin-mediated endocytosis. Co-localization with clathrin plaques
      suggests BAIAP2L2 contributes to membrane curvature generation during vesicle
      formation, representing a conserved I-BAR domain function.
    molecular_function:
      id: GO:0005543
      label: phospholipid binding
    supported_by:
      - reference_id: PMID:21401524
        supporting_text: >-
          human BAIAP2L2 (brain-specific angiogenesis inhibitor 1-associated protein
          2-like
          2)
          also tightly co-localizes with clathrin plaques
    in_complex:
      id: GO:0071439
      label: clathrin complex
proposed_new_terms: []
suggested_questions:
  - question: Does BAIAP2L2 directly regulate actin dynamics through its SH3 domain
      interactions, or is its role primarily in membrane organization with indirect
      effects on actin?
  - question: What is the functional significance of the oncogenic roles reported
      in HCC and other cancers - is this related to normal membrane/cytoskeletal functions
      or represents gain-of-function?
  - question: What are the specific phosphoinositide binding preferences of Pinkbar's
      I-BAR domain compared to other family members?
suggested_experiments:
  - description: Liposome tubulation/deformation assays with purified BAIAP2L2 I-BAR
      domain to directly characterize membrane shaping activity and confirm planar
      structure generation
  - description: SH3 domain interactome characterization to identify actin regulatory
      binding partners in epithelial cells
  - description: Cryo-EM of BAIAP2L2-membrane complexes to visualize the planar oligomeric
      arrangement predicted from crystal structures
