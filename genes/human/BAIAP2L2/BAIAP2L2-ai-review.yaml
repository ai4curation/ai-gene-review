# Suggested new annotations based on literature review
  - term:
      id: GO:0032426
      label: stereocilium tip
    evidence_type: IDA
    original_reference_id: DOI:10.1091/mbc.e21-10-0491
    review:
      summary: >-
        Halford et al. 2022 demonstrates Ca2+-dependent localization of BAIAP2L2 to
        stereocilia tips in hair cells, where it is retained via mechanotransduction
        channel activity. Evidence from deep research review.
      action: NEW
      reason: >-
        Experimental evidence from Halford et al. 2022 (Mol Biol Cell) shows BAIAP2L2
        localizes to stereocilia tips in a Ca2+-dependent manner. This localization
        requires functional mechanotransduction channels and is mediated by the
        MYO15A-EPS8-BAIAP2L2 complex.
      supported_by:
        - reference_id: file:human/BAIAP2L2/BAIAP2L2-deep-research-falcon.md
          supporting_text: >-
            BAIAP2L2 becomes highly enriched at the tips of stereocilia (with row-specific
            enrichment)
            in cochlear hair cells. Tip localization requires functional mechanotransduction
            (MET)
            channels and is lost upon acute pharmacological channel block or intracellular
            Ca2+ chelation
  - term:
      id: GO:0097753
      label: membrane bending
    evidence_type: IDA
    original_reference_id: PMID:21743456
    review:
      summary: >-
        Pinkbar's I-BAR domain generates planar membrane structures, a specialized
        form
        of membrane deformation distinct from tubulation.
      action: NEW
      reason: >-
