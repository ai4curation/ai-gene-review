  review:
    summary: Lysosomal-membrane localization is very likely paralog-derived over-propagation from TMEM106B, not a bona fide location for TMEM106A.
    action: MARK_AS_OVER_ANNOTATED
    reason: This IBA sits on the TMEM106-family PAINT node (PANTHER:PTN002822587), whose
      lysosomal-membrane character derives from the extensively studied paralog TMEM106B,
      a well-characterized lysosomal membrane protein (the WITH/FROM even lists the human
      paralog UniProtKB:Q9NUM4 = TMEM106B). TMEM106A itself is curated by UniProt to the
      cell membrane (single-pass membrane protein, by similarity to mouse Q8VC04), and its
      documented function - macrophage activation via cell-surface signaling - operates at
      the plasma membrane. This is target-specific evidence that TMEM106A has diverged in
      localization from the family node, so lysosomal membrane should not be treated as a
      core location. Rather than assert an alternative id on an is_active_in row, flag it
      as over-annotated (paralog-derived); the plasma-membrane location is captured by the
      GO:0005886 annotations.
