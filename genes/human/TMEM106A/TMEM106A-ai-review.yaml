suggested_questions:
- question: >-
    What is the molecular activity of TMEM106A at the plasma membrane — does it
    function as a receptor, co-receptor, signaling adaptor, or transporter, and
    what is its physiological ligand?
- question: >-
    How mechanistically distinct is TMEM106A from its lysosomal paralog TMEM106B,
    and to what extent (if any) does TMEM106A also access endolysosomal
    compartments in specific cell types?
- question: >-
    Is the reported tumor-suppressor phenotype a cell-intrinsic consequence of
    TMEM106A signaling or an indirect effect mediated through macrophage/immune
    activation in the tumor microenvironment?
suggested_experiments:
- description: >-
    Define the TMEM106A interactome in macrophages with proximity labeling
    (BioID/TurboID) or co-immunoprecipitation-MS from differentiated macrophages,
    to move beyond generic binary-interactome hits toward a specific molecular
    function.
- description: >-
    Test the requirement of TMEM106A for M1 polarization directly using CRISPR
    knockout in human macrophages, reading out MAPK and NF-kB pathway activation,
    surface CD80/CD86/MHC-II, and cytokine output after pro-inflammatory
    stimulation.
- description: >-
    Determine subcellular localization at endogenous levels (knock-in tag or
    validated antibody) with confocal/immuno-EM to test plasma-membrane versus
    endolysosomal residence and directly address the paralog-derived
    lysosomal-membrane annotation.
