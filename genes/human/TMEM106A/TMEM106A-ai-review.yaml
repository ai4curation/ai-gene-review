core_functions:
- description: >-
    Positive regulation of macrophage activation and M1-like polarization. As a
    plasma-membrane protein, TMEM106A engages MAPK and NF-kB signaling to drive a
    pro-inflammatory macrophage program, up-regulating co-stimulatory molecules
    (CD80, CD86, CD69) and MHC class II and inducing cytokines and nitric oxide.
    This is the conserved function of the TMEM106 family, established
    experimentally in the mouse ortholog and supported for human TMEM106A by both
    orthology and primary literature. No specific biochemical/molecular activity
    has yet been assigned, so only the process and location are captured here.
