  label: Homo sapiens
description: >-
  TMEM106A is a type II single-pass transmembrane protein of the TMEM106 family,
  a paralog of the lysosomal protein TMEM106B. It localizes to the plasma
  membrane, with a short N-terminal cytoplasmic segment and a large
  C-terminal extracellular/lumenal domain. Its best-characterized role is as a
  positive regulator of macrophage activation: it promotes polarization toward a
  pro-inflammatory M1-like state through MAPK and NF-kB signaling, up-regulating
  surface CD80, CD86, CD69 and MHC class II and inducing pro-inflammatory
  mediators such as TNF, IL1B, IL6, CCL2 and nitric oxide. TMEM106A also behaves
  as a candidate tumor suppressor in several epithelial cancers, where its
  promoter is frequently hypermethylated; restoring its expression inhibits
  proliferation, migration and invasion, induces apoptosis, and represses
  epithelial-mesenchymal transition and PI3K/AKT/NF-kB signaling. The specific
  biochemical activity of the protein at the membrane is not yet defined.
