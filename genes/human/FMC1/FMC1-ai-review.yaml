gene_symbol: FMC1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  FMC1 (formerly C7orf55) is a small (113 aa) nuclear-encoded mitochondrial protein
  with a single LYR_2 (Complex1_LYR_2) motif domain and a disordered C-terminal tail.
  It localizes to mitochondria and is required for normal levels of the
  mitochondrial F1Fo ATP synthase (complex V). In human cells lacking FMC1 the F1
  subunits ATP5F1A and ATP5F1B are reduced, less fully assembled complex V is present,
  and complex V ATPase activity falls, while the other respiratory complexes are
  unaffected; all of these defects are rescued by re-expressing FMC1. FMC1 binds
  ATPAF2, the chaperone for the F1 alpha subunit, which places it in the F1 assembly
  pathway as an assembly factor or cofactor for ATPAF2. It has no known enzymatic
  activity. Its exact molecular role is not known, and it is not known whether it
  acts during assembly or stabilizes the assembled F1 sector. FMC1 belongs to an
  animal-specific PANTHER family (PTHR31716). The yeast protein Fmc1p, which supports
  F1 assembly through Atp12p at high temperature, has the same LYR_2 domain but falls
  in a separate PANTHER family.
