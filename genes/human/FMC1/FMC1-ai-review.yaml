- term:
    id: GO:0033615
    label: mitochondrial proton-transporting ATP synthase complex assembly
  evidence_type: IMP
  original_reference_id: PMID:28719601
  qualifier: involved_in
  review:
    summary: CRISPR knockout of C7orf55/FMC1 in K562 cells reduced the F1 subunits
      ATP5A/ATP5B and fully assembled complex V on BN-PAGE, and lowered in-gel ATPase
      activity. Re-expressing CRISPR-resistant FMC1 rescued all of these defects.
    action: ACCEPT
    reason: 'This is the core process. Three independent sgRNAs were used, the defect
      was specific to complex V among the five OXPHOS complexes, and rescue was
      complete. Taken alone, knockout data show only necessity. Here they come with a
      physical interaction with ATPAF2, a dedicated F1 assembly chaperone, which
      supports FMC1 doing part of the assembly work as a cofactor of the assembly
      machinery rather than being needed indirectly. One caveat: steady-state BN-PAGE
      cannot fully separate a defect in assembly from instability of the assembled
      complex. The authors frame the result as "assembly or regulation", and UniProt
      describes the function as "assembly/stability". GO:0033615 remains the
      best-fitting term.'
    supported_by:
    - reference_id: PMID:28719601
      supporting_text: 'In agreement with our prediction, in the absence of C7orf55 we
        observed a specific destabilization of the mitochondrial complex V using three
        assays: (i) the steady-state levels of the F1 ATP synthase subunits ATP5A and
        ATP5B were reduced in a denaturing SDS-PAGE gel (Fig 6B); (ii) the abundance
        of the fully-assembled complex V was reduced in a blue-native PAGE (Fig 6C, top
        panel); and (iii) the activity of complex V was reduced in an in-gel ATPase
        activity assay (Fig 6C, bottom panel).'
    - reference_id: PMID:28719601
      supporting_text: These experiments confirm the validity of CLIC’s functional prediction
        that C7orf55 is required for mitochondrial ATP synthase function and specifically
        that C7orf55 binds a known assembly factor of this complex.
