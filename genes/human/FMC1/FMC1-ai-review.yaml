suggested_questions:
- question: Does human FMC1 act during F1 assembly (for example by modulating ATPAF2
    binding to the F1 alpha subunit), or does it stabilize the assembled F1 sector?
    Is its requirement conditional on temperature, as for yeast Fmc1p?
- question: Is the functional parallel between yeast Fmc1p-Atp12p and human
    FMC1-ATPAF2 the result of true orthology that PANTHER does not resolve (PTHR28015
    vs PTHR31716, linked only by the LYR_2 domain), or of convergent recruitment of an
    LYR-motif protein?
- question: Like other LYR-motif proteins, does FMC1 bind the acyl-carrier protein
    NDUFAB1 (ACPM), and is that binding needed for its role in complex V?
suggested_experiments:
- description: Run pulse-chase or SILAC-based complex V assembly kinetics in FMC1-knockout
    versus rescued cells, with and without mild heat stress, to tell an assembly defect
    from instability of the assembled complex.
  experiment_type: complexome profiling / assembly kinetics
- description: Map the FMC1-ATPAF2 interface by mutating residues predicted by the
    coevolution/AlphaFold model, then test whether interface mutants still rescue complex
    V levels in knockout cells.
  experiment_type: structure-guided mutagenesis and rescue
- description: Determine the sub-mitochondrial localization of FMC1 (protease protection,
    carbonate extraction, APEX2 proximity labelling), and test whether its LYR motif
    binds NDUFAB1.
  experiment_type: sub-mitochondrial fractionation and interaction mapping
