core_functions:
- description: Mitochondrial assembly cofactor for the F1Fo ATP synthase (complex V).
    FMC1 binds the F1 alpha-subunit assembly chaperone ATPAF2 and is required for
    normal levels of F1 subunits and of fully assembled, active complex V. No
    molecular activity has been measured. Its MF is therefore left unassigned, and it
    is not known whether FMC1 acts during assembly or stabilizes the assembled
    complex.
