core_functions:
- description: Supplies alpha-1(II) chains for type-II collagen homotrimers and the alpha-3 chain of type-XI
    collagen, contributing to extracellular fibril assembly and tensile matrix support. Chain association
    and cross-linked incorporation are parts of this integrated structural role. Propeptide cleavage and
    other enzymatic processing are performed by other proteins; the short alternative product is not assumed
    to reproduce full-length fibril function.
  molecular_function:
    id: GO:0030020
    label: extracellular matrix structural constituent conferring tensile strength
  directly_involved_in:
  - id: GO:0030199
    label: collagen fibril organization
  locations:
  - id: GO:0031012
    label: extracellular matrix
  in_complex:
    id: GO:0005585
    label: collagen type II trimer
  supported_by:
  - reference_id: PMID:8660302
  - reference_id: PMID:24113490
  - reference_id: PMID:9832566
suggested_questions:
- question: Which current human alternative products assemble into type-II and type-XI collagen in each
    tissue, and what extracellular role does the short C-terminal product perform?
- question: How do collagen-II matrix architecture and mechanical properties influence chondrocyte differentiation,
    and which effects depend on the N-terminal splice product?
- question: Which of the positive C-terminal-fragment screen interactions occur with naturally processed
    collagen species in their native compartments?
- question: Can the original source or later direct experiments resolve COL2A1 homodimerization separately
    from homotrimer assembly and II–IX matrix cross-links?
suggested_experiments:
- hypothesis: Human alternative products differ in assembly partners and extracellular matrix incorporation.
  description: Compare sequence-verified products in a human chondrocyte secretion system with chain-specific
    mass spectrometry, nonreducing assembly analysis and extracellular fibril imaging; separately assay
    the short product and include endogenous expression controls.
- hypothesis: A subset of the recorded C-terminal-fragment interactions is retained in native processed
    collagen contexts.
  description: Test the exact screen fragments alongside full procollagen and isolated processed propeptides,
    with purified-partner binding and compartment-appropriate cellular controls. Distinguish physical
    binding from effects on the partner activity.
status: DRAFT
