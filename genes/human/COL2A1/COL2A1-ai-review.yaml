  evidence_type: IMP
  original_reference_id: PMID:7829510
  qualifier: involved_in
  review:
    summary: The precise chondrocyte-differentiation assertion remains unresolved.
    action: UNDECIDED
    reason: The complete human achondrogenesis abstract reports replacement of type-II collagen by types
      I and III, but the original full experimental evidence for the differentiation step was not recovered.
      A production GO-CAM models COL2A1 structural activity in this process using the same reference;
      this considered curator assertion is retained, not treated as independent experimental confirmation.
      Mouse Col2a1-null cartilage can differentiate and hypertrophy despite disorganized matrix, which
      does not rule out a context-dependent matrix contribution. Preserve the source pending a direct
