id: P02458
gene_symbol: COL2A1
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: COL2A1 encodes the pro-alpha-1(II) collagen chain, a major structural component of cartilage
  and vitreous extracellular matrices. Alpha-1(II) chains assemble into type-II collagen homotrimers and
  also supply the alpha-3 chain of type-XI collagen. Following secretion and removal of propeptides by
  extracellular procollagen proteinases, collagen molecules assemble into cross-linked fibrils that organize
  and support the matrix. Alternative splicing produces forms with different N-terminal sequences and
  a shorter C-terminal product. Disruption of collagen-II abundance or architecture causes skeletal dysplasias
  and connective-tissue disease with ocular and auditory manifestations.
