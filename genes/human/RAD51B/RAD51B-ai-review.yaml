proposed_new_terms:
- proposed_name: DNA recombinase loader activity
  proposed_definition: >-
    Binding to a DNA strand exchange protein (recombinase) and to single-stranded DNA so as to promote
    nucleation and extension of the recombinase nucleoprotein filament, including displacement of the
    single-stranded DNA-binding protein that otherwise occludes the substrate. The loader is not itself
    a strand exchange protein and does not catalyse strand exchange.
  justification: >-
    Same proposal as in the RAD51C review. GO has the process GO:0000730 DNA recombinase assembly but
    no molecular function for the mediator activity that carries it out. As a result, the RAD51 paralogs
    carry borrowed terms such as GO:0140664 ATP-dependent DNA damage sensor activity, which describes
    a sensor rather than a loader. BCDX2, in which RAD51B provides one of the two coupled ATPase sites,
    is a defining example.
  proposed_parent:
    id: GO:0003697
    label: single-stranded DNA binding
  supported_by:
  - reference_id: PMID:37344587
    supporting_text: BCDX2 stimulates the nucleation and extension of RAD51
  - reference_id: PMID:11751636
    supporting_text: The competition by RPA for substrate binding can be partially alleviated by Rad51B-Rad51C
suggested_questions:
- question: >-
    Why are RAD51B-deficient human cells much less affected than cells lacking RAD51C, RAD51D or XRCC2,
    when RAD51B is essential in mice? Can RAD51B-independent X3CDX2 or CX3 complexes partly substitute
    for BCDX2 in RAD51 filament assembly?
- question: >-
    Does the flexible RAD51B C-terminal domain contact RAD51 directly during filament nucleation, and
    how does RAD51B ATP hydrolysis change that contact?
- question: >-
    Is the reported specificity of the BC subcomplex for FANCM-remodelled forks, as opposed to DX2/CX3
    at FBH1-remodelled forks, a property of BC acting outside BCDX2, or of the intact tetramer?
suggested_experiments:
- description: >-
    Reconstitute BCDX2 with RAD51B catalytic (E144A) or C-terminal-domain deletion mutants and measure
    RAD51 filament nucleation and protection of reversed forks against MRE11 in single-molecule assays.
  hypothesis: >-
    The RAD51B C-terminal domain and its ATPase site are needed for efficient RAD51 nucleation, and RAD51C
    provides the dominant catalytic contribution.
  experiment_type: biochemical reconstitution
- description: >-
    Combine RAD51B knockout with XRCC3 or FANCM depletion in human cells and measure HR (DR-GFP), RAD51
    foci and nascent-strand degradation.
  hypothesis: >-
    Mild RAD51B-null phenotypes reflect compensation by RAD51B-independent paralog complexes; the double
    defects will be synergistic.
  experiment_type: genetic interaction
