- term:
    id: GO:0008094
    label: ATP-dependent activity, acting on DNA
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN008708481
  - UniProtKB:O15315
  review:
    summary: ATP-dependent activity, acting on DNA (IBA); RAD51B is a DNA-stimulated ATPase.
    action: ACCEPT
    reason: >-
      Isolated RAD51B hydrolyses ATP in a DNA-dependent manner, and in BCDX2 RAD51B is one of two catalytically
      active ATPase subunits (with RAD51C). It has the catalytic glutamate (E144) that RAD51D and XRCC2
      lack. The IBA is therefore well grounded for RAD51B. The RAD51C ATPase is the more critical of the
      two, since BCDX2 with an inactive RAD51B site keeps partial activity.
    supported_by:
    - *id006
    - *id007
    - reference_id: PMID:37344587
      supporting_text: >-
        ATPase deficient BCE161ADX2 and BE144ACE161ADX2 complexes failed to promote RAD51AF488 assembly,
        whereas BE144ACDX2 retained partial stimulation relative to wild-type
