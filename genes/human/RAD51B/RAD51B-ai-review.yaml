core_functions:
- description: >-
    As the BCDX2-specific subunit, RAD51B forms the BC subcomplex with RAD51C. Their coupled ATPase cycle
    drives high-affinity single-stranded DNA binding by BCDX2, which then acts as a recombination mediator:
    it stimulates nucleation and extension of RAD51 filaments on RPA-coated ssDNA, downstream of BRCA2
    and upstream of RAD51 loading, during homologous recombination repair of DNA double-strand breaks.
