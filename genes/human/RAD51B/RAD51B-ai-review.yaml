id: O15315
gene_symbol: RAD51B
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  RAD51B (RAD51L1, REC2) is one of the five human RAD51 paralogs, RecA/RAD51-family proteins with Walker
  A/B ATP-binding motifs that work as accessory factors to the RAD51 recombinase. It is found only in
  the heterotetrameric BCDX2 complex (RAD51B-RAD51C-RAD51D-XRCC2), where it pairs with RAD51C as the BC
  subcomplex. RAD51B is not part of the RAD51C-XRCC3 (CX3) or XRCC3-RAD51C-RAD51D-XRCC2 (X3CDX2) complexes.
  Purified RAD51B binds single- and double-stranded DNA, prefers Holliday-junction DNA, and hydrolyses
  ATP in a DNA-dependent manner. Within BCDX2 it is one of two catalytically active ATPase subunits. The
  coupled ATPases of RAD51B and RAD51C drive high-affinity binding of BCDX2 to single-stranded DNA, and
  BCDX2 then stimulates nucleation and extension of RAD51 nucleoprotein filaments on RPA-coated DNA. Its
  flexible C-terminal domain is thought to engage RAD51 during filament nucleation. BCDX2 acts in the
  BRCA1-BRCA2-dependent homologous recombination pathway, downstream of BRCA2 recruitment and upstream
  of RAD51 loading. It also binds replication-fork and Holliday-junction DNA and, together with RAD51,
  protects stalled and reversed replication forks from nucleolytic degradation. Rad51b loss is embryonic
  lethal in mice. In human cell lines RAD51B-deficient cells have the mildest homologous recombination
  defects of the five paralogs. RAD51B is a breast cancer susceptibility locus and a recurrent translocation
  partner of HMGA2 in uterine leiomyoma.
