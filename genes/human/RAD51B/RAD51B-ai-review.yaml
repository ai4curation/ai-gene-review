- term:
    id: GO:0097435
    label: supramolecular fiber organization
  evidence_type: IDA
  original_reference_id: PMID:37344587
  qualifier: involved_in
  review:
    summary: >-
      Supramolecular fiber organization (IDA): BCDX2 promotes RAD51 filament nucleation and extension.
    action: MODIFY
    reason: >-
      The experiment shows that BCDX2 increases the number and length of RAD51 nucleoprotein filaments
      in a way that depends on ATP hydrolysis by RAD51B and RAD51C. GO:0000730 DNA recombinase assembly
      ('the aggregation, arrangement and bonding together of strand exchange proteins (recombinases) into
      higher order oligomers on single-stranded DNA') describes this precisely. The same replacement is
      made in the RAD51C and XRCC2 reviews.
    proposed_replacement_terms:
    - id: GO:0000730
      label: DNA recombinase assembly
    supported_by:
    - reference_id: PMID:37344587
      supporting_text: >-
        we found that BCDX2 increases both the quantity (nucleation) and length (growth) of RAD51 filaments
    - reference_id: PMID:37344587
      supporting_text: >-
        Together, these results show that BCDX2 promotes RAD51 filament nucleation and growth in an ATP
        hydrolysis dependent manner
- term:
    id: GO:0140664
    label: ATP-dependent DNA damage sensor activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR020588
  review:
    summary: ATP-dependent DNA damage sensor activity (IEA, InterPro RecA/RAD51 domain mapping).
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      This term describes a molecule that recognises damaged DNA and initiates a signalling response.
      RAD51B's ATPase drives high-affinity ssDNA binding of BCDX2 and RAD51 filament assembly (a mediator
      or loader role), not damage signalling. The sibling RAD51C and XRCC2 reviews make the same call
      for the same InterPro-derived row. The mediator activity has no GO molecular function and is filed
      as a proposed new term.
    supported_by:
    - reference_id: PMID:37344587
      supporting_text: BCDX2 stimulates the nucleation and extension of RAD51
- term:
    id: GO:0031297
    label: replication fork processing
  evidence_type: IDA
  original_reference_id: PMID:37843130
  review:
    summary: >-
      BCDX2 (including RAD51B) works with RAD51 filaments to protect stalled or reversed fork DNA from
      MRE11 and EXO1.
    action: NEW
    reason: >-
      Fork protection is a distinct, well-supported role of BCDX2 beyond DSB repair. Purified BCDX2 has
      no fork-reversal activity of its own, but it acts directly with RAD51 to protect the regressed arm.
      The trigger review assigns the BC subcomplex specifically to protecting FANCM-remodelled forks.
      RAD51B therefore does some of the work (stabilising the protective RAD51 filament) and is not just
      required for it. Comparator: RAD51C carries GO:0031297. The more specific GO:0071932 replication
      fork reversal is not proposed, because BCDX2 lacks reversal activity in vitro.
    additional_reference_ids:
    - PMID:42682019
    - PMID:32669601
    supported_by:
    - reference_id: PMID:37843130
      supporting_text: >-
        BCDX2 significantly synergizes with RAD51 to protect DNA against attack by the nucleases MRE11
        and EXO1
    - reference_id: PMID:37843130
      supporting_text: both RAD51 paralog complexes lack fork reversal activities
    - reference_id: PMID:42682019
      supporting_text: >-
        The DX2 and CX3 complexes stabilize forks that have been remodeled by FBH1, while the BC subcomplex
        protects forks remodeled by the FANCM translocase
