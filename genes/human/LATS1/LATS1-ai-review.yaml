  review:
    summary: Hippo signaling.
    action: ACCEPT
    reason: 'LATS1 is the core downstream kinase of the Hippo cascade: activated by MST1/2 (via SAV1/WWC
      and MOB1), it phosphorylates YAP/TAZ, causing their cytoplasmic retention and degradation. Human
      LATS1 is one of the experimental seeds of the PANTHER IBD at PTN002390470, and the Warts-dependent
      cytoplasmic retention of Yorkie is conserved in Capsaspora.'
    supported_by:
    - reference_id: PMID:35429439
      supporting_text: WWC proteins (WWC1/2/3) directly interact with LATS1/2 and SAV1, and SAV1, in turn,
        brings in MST1/2 to phosphorylate and activate LATS1/2.
    - reference_id: PMID:18158288
      supporting_text: LATS1 inactivates YAP oncogenic function by suppressing its transcription regulation
        of cellular genes via sequestration of YAP in the cytoplasm after phosphorylation of YAP.
    - reference_id: PMID:38517944
      supporting_text: Loss of either kinase results in increased nuclear localization of coYki, showing
        that the regulatory activity of the Hippo kinase cascade is conserved.
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN002390470
        source_status: SUPPORTS_TRANSFER
        comment: IBD seeded by fly wts, mouse Lats1/Lats2 and human LATS1/LATS2; human LATS1 has its own
          IDA evidence and appears legitimately among the seeds.
