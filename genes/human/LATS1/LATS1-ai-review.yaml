- term:
    id: GO:0000082
    label: G1/S transition of mitotic cell cycle
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:1354386
  - PANTHER:PTN002390470
  - UniProtKB:Q9NRM7
  review:
    summary: IBA from PANTHER node PTN002390470 (seeded by mouse Lats2 and human LATS2) asserting LATS1
      participates in the mitotic G1/S transition.
    action: MARK_AS_OVER_ANNOTATED
    reason: Human LATS1 evidence concerns mitotic progression and the G1 tetraploidy checkpoint after
      mitotic slippage (a p53-dependent block to S-phase entry of tetraploid cells), not the G1/S transition
      itself. The IBD seeds are LATS2 only. LATS1 is not part of the G1/S machinery; any effect is via
      checkpoint signalling or YAP/TAZ output. The same node over-reaches into choanoflagellate Warts,
      where warts loss slows rather than accelerates growth.
    supported_by:
    - reference_id: PMID:15122335
      supporting_text: WARTS thus plays a critical role in maintenance of ploidy through its actions in
        both mitotic progression and the G(1) tetraploidy checkpoint.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - WRONG_ORTHOLOG_OR_PARALOG
      source_entities:
      - source_id: PANTHER:PTN002390470
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: IBD seeded only by LATS2 (mouse Lats2, human LATS2); the G1/S role is LATS2 evidence
          and human LATS1 evidence concerns the G1 tetraploidy checkpoint, not the transition itself.
- term:
    id: GO:0000086
    label: G2/M transition of mitotic cell cycle
  evidence_type: IDA
  original_reference_id: PMID:15122335
  qualifier: involved_in
  review:
    summary: IDA for G2/M transition from Iida et al. 2004 (WARTS in mitotic progression and G1 tetraploidy
      checkpoint).
    action: KEEP_AS_NON_CORE
    reason: The cached abstract shows that kinase-inactive WARTS causes mitotic delay and that LATS1 is
      activated in mitosis; LATS1 also complexes with CDC2 and negatively regulates CDC2/cyclin A (Tao
      et al. 1999). The curator read the full text; we accept a cell-cycle role but it is peripheral to
      the core Hippo kinase function.
    additional_reference_ids:
    - PMID:9988268
    supported_by:
    - reference_id: PMID:15122335
      supporting_text: Here we show that WARTS is activated during mitosis in mammalian cells, and that
        overexpression of a kinase-inactive WARTS in Rat1 fibroblasts significantly induced mitotic delay.
    - reference_id: PMID:9988268
      supporting_text: These biochemical observations indicate that LATS is a novel negative regulator
        of CDC2/cyclin A
