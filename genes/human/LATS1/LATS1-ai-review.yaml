id: O95835
gene_symbol: LATS1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'LATS1 (large tumor suppressor kinase 1; h-warts) is a serine/threonine protein kinase of
  the NDR/LATS subfamily of AGC kinases, with an N-terminal region containing a ubiquitin-associated domain
  and PPxY motifs, a MOB1-binding region, and a C-terminal kinase domain with activation-loop (Ser-909)
  and hydrophobic-motif (Thr-1079) regulatory sites. It is the core downstream kinase of the Hippo pathway:
  MST1/2 (STK4/STK3, scaffolded by SAV1 and WWC proteins) and MAP4K kinases phosphorylate and activate
  LATS1 in complex with its coactivator MOB1A/B, and LATS1 then phosphorylates the transcriptional coactivators
  YAP1 and WWTR1/TAZ on HXRXXS motifs (for example YAP1 Ser-127 and Ser-381), creating 14-3-3 binding
  sites that retain them in the cytoplasm and promote their degradation, thereby restraining YAP/TAZ-TEAD
  transcription that drives proliferation and organ growth. Signals that tune LATS1 activity include cell
  density and polarity complexes, NF2/merlin at the plasma membrane, GPCR signalling, energy stress and
  hypoxia. LATS1 is cytoplasmic, with a nuclear pool inhibited by CRL4-DCAF1, and it localizes to centrosomes
  in interphase and to spindle poles, spindle and midbody in mitosis, where it contributes to mitotic
  progression, inhibition of CDK1/cyclin A, the tetraploidy checkpoint and cytokinesis (by binding and
  inhibiting LIMK1). It also promotes kinase-independent, DCAF1-dependent degradation of estrogen receptor
  alpha in breast epithelium and phosphorylates NLRP3 at the microtubule organizing center to promote
  inflammasome activation. Warts/LATS kinases predate animals: in the unicellular filasterean Capsaspora
  the Warts ortholog keeps the Yorkie ortholog out of the nucleus and shapes cell contractility and packing
  without restricting proliferation, and in the choanoflagellate Salpingoeca rosetta loss of warts enlarges
  rosette colonies, so control of YAP/TAZ localization is ancestral whereas proliferation and organ-size
  control are animal-specific outputs.'
