- description: Mitotic apparatus-associated regulator of mitosis and cytokinesis. LATS1 localizes to centrosomes,
    spindle poles and the midbody, complexes with CDK1/CDC2 to restrain CDK1/cyclin A, and binds and inhibits
    LIMK1 at the contractile ring, limiting cofilin phosphorylation and supporting cytokinesis and ploidy
    maintenance. A role in actomyosin/cytoskeletal control is also the best-supported premetazoan function
    of Warts kinases.
