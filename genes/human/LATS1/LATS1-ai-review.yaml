  review:
    summary: Protein serine/threonine kinase activity.
    action: ACCEPT
    reason: LATS1 is an NDR/LATS-family AGC kinase that directly phosphorylates YAP1 and TAZ on HXRXXS
      motifs (e.g. YAP S127), is activated by MST1/2 and MAP4Ks, and also phosphorylates NLRP3. This is
      the core molecular function.
    supported_by:
    - reference_id: PMID:18158288
      supporting_text: we have provided convincing evidence that the LATS1 tumor suppressor can bind to
        and phosphorylate transcription regulator and oncogene YAP in vitro and in vivo.
    - reference_id: PMID:22863277
      supporting_text: Lats1/2 inhibit YAP by direct phosphorylation at S127, which results in YAP binding
        to 14-3-3 and cytoplasmic sequestration
    - reference_id: PMID:35429439
      supporting_text: The activity of YAP/TAZ is strictly repressed upon phosphorylation by LATS1/2 tumor
        suppressors.
