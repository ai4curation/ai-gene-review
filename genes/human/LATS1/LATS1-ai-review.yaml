- term:
    id: GO:0030833
    label: regulation of actin filament polymerization
  evidence_type: IDA
  original_reference_id: PMID:15220930
  qualifier: involved_in
  review:
    summary: IDA regulation of actin filament polymerization (Yang et al. 2004).
    action: ACCEPT
    reason: LATS1 binds and inhibits LIMK1 at the actomyosin contractile ring, reducing cofilin phosphorylation;
      LATS1 inactivation (antibody injection, RNAi, mouse knockout) impairs cytokinesis. Accepted as part
      of LATS1's mitotic/cytokinesis core function; notable because cytoskeletal regulation is the best-supported
      premetazoan function of Warts kinases.
    supported_by:
    - reference_id: PMID:15220930
      supporting_text: Here we show that human LATS1 binds to LIMK1 in vitro and in vivo and colocalizes
        with LIMK1 at the actomyosin contractile ring during cytokinesis.
    - reference_id: PMID:15220930
      supporting_text: Our findings indicate that LATS1 is a novel cytoskeleton regulator that affects
        cytokinesis by regulating actin polymerization through negative modulation of LIMK1.
