core_functions:
- description: Hippo pathway effector kinase. Activated by MST1/2-SAV1-WWC and MOB1, LATS1 directly phosphorylates
    YAP1 and WWTR1/TAZ on HXRXXS motifs, causing their 14-3-3-mediated cytoplasmic retention and degradation
    and so repressing YAP/TAZ-TEAD transcription. Cytoplasmic retention of the Yorkie ortholog by Warts
    is conserved in the unicellular Capsaspora; coupling of this module to proliferation and organ-size
    control is animal-specific. The same kinase activity phosphorylates NLRP3 at the MTOC to promote inflammasome
    assembly.
  molecular_function:
    id: GO:0004674
    label: protein serine/threonine kinase activity
