suggested_questions:
- question: Which LATS1 functions are ancestral? Warts orthologs in Capsaspora and S. rosetta control
    Yorkie localization and colony/aggregate architecture but do not restrict (or even promote) proliferation;
    is the human LATS1-LIMK1-cofilin cytoskeletal axis a direct remnant of an ancestral, YAP-independent
    cytoskeletal role?
- question: Should the PANTHER IBDs for regulation of organ growth, positive regulation of apoptotic process
    and G1/S transition be moved from PTN002390470 to a metazoan descendant node so that choanoflagellate
    Warts kinases do not inherit them, while vertebrate LATS1/2 retain them?
- question: How much of the ERalpha-degradation and mitotic phenotypes are specific to LATS1 versus redundant
    with LATS2, and which require kinase activity?
- question: What is the source of the ISS nucleus annotation whose WITH/FROM is YAP1 (P46937) rather than
    a LATS ortholog, and should it be re-sourced to direct evidence for nuclear LATS1?
suggested_experiments:
- hypothesis: Ancestral Warts kinases can substitute for human LATS1 in YAP/TAZ control but not in animal-specific
    functions.
  description: Express Capsaspora coWts or S. rosetta Warts in LATS1/2 double-knockout human cells and
    score YAP S127 phosphorylation and localization, ERalpha stability, NLRP3 Ser-265 phosphorylation
    and cytokinesis failure.
  experiment_type: cross-species complementation
- hypothesis: LATS1 regulates LIMK1 at the contractile ring independently of YAP/TAZ.
  description: In YAP/TAZ double-knockout cells, compare cytokinesis, cofilin phosphorylation and multinucleation
    after LATS1 depletion with rescue by wild-type versus kinase-dead LATS1.
  experiment_type: genetic epistasis and rescue
