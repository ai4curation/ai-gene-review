id: Q9UGL1
gene_symbol: KDM5B
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'KDM5B/PLU-1 is a nuclear JARID1-family H3K4me2/me3 demethylase and transcriptional corepressor.
  It binds chromatin through an ARID DNA-binding domain and PHD histone-tail reader domains, represses
  developmental transcription factors such as FOXG1/BF-1 and PAX9, and is recurrently studied in breast,
  prostate and myeloma systems where KDM5 inhibition raises H3K4me3 at transcription start sites.'
