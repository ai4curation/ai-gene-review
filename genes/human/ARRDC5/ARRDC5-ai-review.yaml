  review:
    summary: 'Endosome (IBA). The node''s only seed is ARRDC3, a somatic alpha-arrestin at the plasma
      membrane and endosomes. ARRDC5 is testis-restricted and acts in spermatid protein trafficking and
      cytoplasmic-droplet biogenesis. ARRDC5 is the divergent family member: it lacks the PY motifs, has
      a divergent sequence, and is testis-restricted, and it was set apart from the alpha-arrestins whose
      plasma-membrane and vesicle localization was characterized. No ARRDC5 localization to this compartment
      has been reported. The transfer is neither supported nor contradicted by ARRDC5 data.'
    action: UNDECIDED
    reason: The only seed (ARRDC3) is a somatic PY-motif alpha-arrestin; ARRDC5 differs on each count.
      [PMID:23236378 "Five of six mammalian aArrs, but not ARRDC5 (which has overall divergent protein
      sequence, no PY motifs, and testis-predominant expression), are broadly expressed, suggesting they
      may be promiscuous like bArrs."] [PMID:37069147 "Multispecies testicular tissue transcriptome profiling
      indicates that expression of Arrdc5 is testis enriched, if not specific, in mice, pigs, cattle,
      and humans."]
    supported_by:
