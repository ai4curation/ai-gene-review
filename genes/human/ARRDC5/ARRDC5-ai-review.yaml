  review:
    summary: 'Molecular adaptor activity (IBA, alpha-arrestin node). ARRDC5 acts as a scaffold in sperm
      maturation: it binds TEX38 and forms a complex with CLGN and PDILT, and it controls trafficking
      of the head-tail coupling proteins NDC1 and SUN5. What is shown is complex membership and a trafficking
      effect, not a demonstrated bridging step. Because ARRDC5 lacks PY motifs, the family''s HECT-ligase
      recruitment mechanism does not apply. A protein scaffold remains the best fit; modified to protein-macromolecule
      adaptor activity.'
    action: MODIFY
    reason: '[PMID:41420860 "Here, we demonstrate that two proteins with testis-specific expression, arrestin
      domain-containing 5 (ARRDC5) and testis expressed 38 (TEX38), physically interact, are required
      for normal sperm maturation, and play a critical role in CD formation and function."] [PMID:40783453
      "Immunoprecipitation-mass spectrometry identified TEX38 and ARRDC5 interact with CLGN and PDILT."]
      [PMID:37997706 "We further found that ARRDC5 might affect the vesicle-trafficking protein SEC22A-mediated
      transport and localization of NDC1, SUN5 and other head-tail coupling apparatus-related proteins
      that are responsible for initiating the attachment of the sperm head and tail."] [PMID:23236378
      "With the exception of ARRDC5, all mammalian aArrs have a pair of PY motifs."]'
    proposed_replacement_terms:
    - id: GO:0030674
      label: protein-macromolecule adaptor activity
    supported_by:
    - reference_id: PMID:41420860
      supporting_text: Here, we demonstrate that two proteins with testis-specific expression, arrestin
        domain-containing 5 (ARRDC5) and testis expressed 38 (TEX38), physically interact, are required
        for normal sperm maturation, and play a critical role in CD formation and function.
    - reference_id: PMID:40783453
      supporting_text: Immunoprecipitation-mass spectrometry identified TEX38 and ARRDC5 interact with
        CLGN and PDILT.
    - reference_id: PMID:37997706
      supporting_text: We further found that ARRDC5 might affect the vesicle-trafficking protein SEC22A-mediated
        transport and localization of NDC1, SUN5 and other head-tail coupling apparatus-related proteins
        that are responsible for initiating the attachment of the sperm head and tail.
    - reference_id: PMID:23236378
      supporting_text: With the exception of ARRDC5, all mammalian aArrs have a pair of PY motifs.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      residue_claims_not_applicable: No residue-level claim is propagated.
      source_entities:
      - source_id: PANTHER:PTN000127176
        source_status: SUPPORTS_TRANSFER
        comment: Alpha-arrestin node; ARRDC5 is not among the seeds. A scaffold role transfers, but the
          seeds' PY-motif ligase recruitment does not, as ARRDC5 lacks PY motifs. ARRDC5 has its own complex-membership
          evidence in sperm.
