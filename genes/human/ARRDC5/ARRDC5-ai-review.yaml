suggested_questions:
- question: Lacking PY motifs, how does ARRDC5 sort cargo, and does its V-type ATPase interaction underlie
    cytoplasmic-droplet or acrosome function?
- question: Which process terms should capture ARRDC5's post-testicular roles in cytoplasmic-droplet migration
    and ADAM3-dependent sperm migration to the oviduct?
suggested_experiments:
- description: Localize endogenous ARRDC5 in human spermatids, and test whether ARRDC5 variants occur
    in men with asthenoteratozoospermia.
