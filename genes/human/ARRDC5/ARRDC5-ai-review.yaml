id: A6NEK1
gene_symbol: ARRDC5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ARRDC5 is a testis-enriched alpha-arrestin (arrestin domain-containing) protein required
  for male fertility. Arrdc5-null mice are male-sterile, with defective spermiogenesis that yields few,
  immotile and malformed sperm. ARRDC5 influences SEC22A-mediated trafficking of the head-tail coupling
  proteins NDC1 and SUN5, binds TEX38 to drive biogenesis and migration of the sperm cytoplasmic droplet,
  and forms a complex with TEX38, CLGN and PDILT needed for ADAM3 maturation and sperm migration to the
  oviduct.
