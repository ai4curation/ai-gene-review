- id: PMID:37069147
  title: ARRDC5 expression is conserved in mammalian testes and required for normal sperm morphogenesis.
  findings:
  - statement: Arrdc5 knockout causes male sterility with defective spermiogenesis.
    supporting_text: Spermiogenesis, the final phase of spermatogenesis when round spermatids transform
      to spermatozoa, is defective in testes of Arrdc5 deficient mice.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text; mouse.
- id: PMID:37997706
  title: ARRDC5 deficiency impairs spermatogenesis by affecting SUN5 and NDC1.
  findings:
  - statement: ARRDC5 affects SEC22A-mediated trafficking of NDC1 and SUN5.
    supporting_text: We further found that ARRDC5 might affect the vesicle-trafficking protein SEC22A-mediated
      transport and localization of NDC1, SUN5 and other head-tail coupling apparatus-related proteins
      that are responsible for initiating the attachment of the sperm head and tail.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only; mouse.
  full_text_unavailable: true
- id: PMID:41420860
  title: Biogenesis and migration of the sperm cytoplasmic droplet require ARRDC5 and TEX38.
  findings:
  - statement: ARRDC5 binds TEX38 and is needed for cytoplasmic droplet biogenesis.
    supporting_text: Here, we demonstrate that two proteins with testis-specific expression, arrestin
      domain-containing 5 (ARRDC5) and testis expressed 38 (TEX38), physically interact, are required
      for normal sperm maturation, and play a critical role in CD formation and function.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text; mouse.
- id: PMID:40783453
  title: Disruption of TEX38 impairs sperm morphogenesis and the migration of sperm into the oviduct.
  findings:
  - statement: ARRDC5 and TEX38 interact with CLGN and PDILT.
    supporting_text: Immunoprecipitation-mass spectrometry identified TEX38 and ARRDC5 interact with CLGN
      and PDILT.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text; mouse.
- id: PMID:23236378
  title: Mammalian α arrestins link activated seven transmembrane receptors to Nedd4 family e3 ubiquitin
    ligases and interact with β arrestins.
  findings:
  - statement: ARRDC5 alone among mammalian alpha-arrestins lacks PY motifs.
    supporting_text: With the exception of ARRDC5, all mammalian aArrs have a pair of PY motifs.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text; family-level comparison of alpha-arrestin localization.
- id: PMID:38270169
  title: Comparative interactome analysis of α-arrestin families in human and Drosophila.
  findings:
  - statement: The ARRDC5 interactome includes V-type ATPase components.
    supporting_text: Additionally, the interactome for an uncharacterized human α-arrestin ARRDC5 uncovered
      multiple components in the V-type ATPase, which plays a key role in bone resorption by osteoclasts.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Full text; comparative alpha-arrestin interactome in HEK293 cells.
