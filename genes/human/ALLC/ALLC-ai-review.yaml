  review:
    summary: 'Allantoin catabolic process, from InterPro. Humans have no allantoin catabolic pathway:
      allantoin is not produced and the downstream enzymes are lost; removed.'
    action: REMOVE
    reason: 'Allantoicase activity is absent from mammalian tissues even though the gene is retained [PMID:12036579
      "In mammals, as well as in birds and reptiles, the activity of allantoicase is absent; notwithstanding,
      we recently cloned human and mouse cDNA sequences with high similarity with previously characterized
      allantoicases."], and the uricolytic pathway that would supply allantoate was dismantled during
      vertebrate evolution [PMID:12036579 "The enzymes of this catabolic pathway (i.e. allantoinase, allantoicase,
      ureidoglycolate lyase and urease) were lost during vertebrate evolution and the causes for this
      loss are still unclear."]. UniProt names the human protein as probably inactive [file:genes/human/ALLC/ALLC-uniprot.txt
      "DE   RecName: Full=Probable inactive allantoicase;"]. A process annotation for a pathway absent
      from the organism is a pathway-context error, independent of whether the protein retains any residual
      catalytic activity.'
