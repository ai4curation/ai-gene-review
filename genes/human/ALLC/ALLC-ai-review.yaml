  label: Homo sapiens
description: ALLC is the human gene related to allantoicase, the enzyme that hydrolyzes allantoate to
  ureidoglycolate and urea in the uric acid degradation pathway of bacteria, fungi and non-amniote vertebrates
  such as amphibians. Amniotes lost that pathway, and allantoicase activity is absent from mammals, birds
  and reptiles; nevertheless ALLC is retained and transcribed in human testis, prostate, kidney and fetal
  spleen, with alternative transcripts, one lacking the first exon. The protein is detected by proteomics;
  UniProt names it probably inactive, an inference from the absence of tissue activity rather than an
  assay of the protein, and no function has been established for it.
