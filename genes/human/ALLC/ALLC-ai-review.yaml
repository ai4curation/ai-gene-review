gene_symbol: ALLC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ALLC is the human gene related to allantoicase, the enzyme that hydrolyzes allantoate to
  ureidoglycolate and urea in the uric acid degradation pathway of fungi, plants and amphibians. That
  pathway was lost during vertebrate evolution, and allantoicase activity is absent from mammals, birds
  and reptiles; nevertheless ALLC is retained and transcribed in human testis, prostate, kidney and fetal
  spleen, with alternative transcripts, one lacking the first exon. The protein is predicted to be catalytically
  inactive, and no function has been established for it.
