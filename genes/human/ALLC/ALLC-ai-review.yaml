knowledge_gaps:
- gap_statement: 'ALLC is wholly uncharacterized: its protein product''s activity, if any, and its role
    in mammals are unknown.'
  boundary: The ancestral allantoicase activity is absent from mammalian tissues and its substrate is
    not produced enzymatically, yet the gene is conserved, transcribed in several tissues and detected
    as protein by proteomics. Its tissue-resolved abundance, whether it retains residual activity on any
    substrate, and why it is retained are untested.
  gap_kind:
  - BIOLOGY
  dark_aspect: WHOLLY_DARK
  status: OPEN
  significance: A conserved, expressed paralog of a lost metabolic enzyme may have been repurposed; ALLC
    is one of few retained genes of the vertebrate uricolytic pathway.
  resolution: Assay recombinant human ALLC on allantoate and related ureides, test protein expression
    in testis and kidney, and compare catalytic-site conservation with active amphibian allantoicase.
