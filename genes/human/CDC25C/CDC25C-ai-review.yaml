core_functions:
- description: Dual-specificity protein phosphatase that dephosphorylates CDK1 (Cdc2) on the inhibitory Thr14 and Tyr15 residues, activating cyclin B-CDK1 to trigger the G2/M transition of the mitotic cell cycle.
