id: P30307
gene_symbol: CDC25C
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'CDC25C (M-phase inducer phosphatase 3) is a cysteine-dependent, dual-specificity protein phosphatase (EC 3.1.3.48) of the CDC25 family that drives entry into mitosis. It removes the inhibitory Thr14 and Tyr15 phosphates from CDK1 (Cdc2), reversing the WEE1/PKMYT1 kinases and activating the cyclin B-CDK1 complex at the G2/M transition. Catalysis uses a C-terminal rhodanese-like domain bearing the HCX5R protein-tyrosine-phosphatase motif and an essential active-site cysteine that forms a phosphocysteine intermediate; the divergent, disordered N-terminal region carries the regulatory phosphorylation sites. CDC25C activity is switch-like and self-amplifying: CDK1 and PLK1 phosphorylate and activate it, generating positive feedback, while CHK1/CHK2, MARK3/C-TAK1 and MAPK14 phosphorylate Ser216 to create a 14-3-3 binding site that sequesters CDC25C in the cytoplasm and blocks nuclear import during the G2 DNA-damage checkpoint. The protein shuttles between the cytoplasm (predominant in interphase, maintained by CRM1-dependent nuclear export) and the nucleus, where it accesses cyclin B-CDK1 at mitotic onset. Its physiological substrate preference is CDK1-cyclin B over CDK2-cyclin A. Multiple splice isoforms exist that differ in the N-terminal regulatory region. In mammals CDC25C function overlaps with the paralogues CDC25A and CDC25B, which can compensate for its loss.'
