proposed_new_terms: []
suggested_questions:
- question: Given that Cdc25c-null and Cdc25b/Cdc25c double-null mice are viable, what non-redundant role, if any, does CDC25C retain in specific human tissues or stress contexts?
- question: Which CDK-cyclin complexes besides cyclin B-CDK1 are genuine physiological CDC25C substrates, and does CDC25C have measurable activity toward CDK2-cyclin A in vivo?
suggested_experiments:
- description: Quantitative phosphoproteomics of CDK1 Thr14/Tyr15 after acute, isoform-specific CDC25C depletion (versus CDC25A/B) to resolve the paralogue division of labour at mitotic entry.
- description: Live-cell imaging of endogenously tagged CDC25C to map the timing of 14-3-3 release, nuclear import and substrate engagement relative to PLK1/CDK1 activation during an unperturbed G2/M.
