  evidence_type: TAS
  original_reference_id: PMID:11139144
  qualifier: involved_in
  review:
    summary: CDC25C activates cyclin-dependent kinases by removing inhibitory phosphates; regulating CDK activity is its defining role.
    action: ACCEPT
    reason: 'Well established: CDC25C dephosphorylates CDK1 (Cdc2) Thr14/Tyr15 to control CDK-cyclin B activity at G2/M. TAS is appropriate and this is a core function.'
    supported_by:
