- term:
    id: GO:0010972
    label: negative regulation of G2/M transition of mitotic cell cycle
  evidence_type: IDA
  original_reference_id: PMID:9543386
  qualifier: involved_in
  review:
    summary: During the G2 DNA-damage checkpoint, Ser216 phosphorylation of CDC25C creates a 14-3-3 binding site; 14-3-3 binding sequesters CDC25C in the cytoplasm and blocks nuclear import, preventing activation of cyclin B-CDK1 and thereby negatively regulating the G2/M transition.
    action: NEW
    reason: "CDC25C itself does the work of this negative regulation: sequestration of the CDK1-activating phosphatase away from its nuclear substrate is the mechanism that delays mitosis. This complements the positive-regulation annotations (GO:0010971) already present and is directly supported by 14-3-3/Ser216 biochemistry and checkpoint studies. Proposed conservatively as the inhibitory counterpart of CDC25C's well-established activating role."
    supported_by:
    - reference_id: PMID:9543386
      supporting_text: Serine 216 phosphorylation mediates the binding of 14-3-3 protein to Cdc25C
    - reference_id: PMID:12941695
      supporting_text: |-
        Disruption of the Cdc25C-C-TAK1 interaction resulted in 
        reduced 14-3-3-binding site phosphorylation and nuclear accumulation of Cdc25C 
        in interphase cells
