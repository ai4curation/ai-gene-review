- description: Phosphorylation of Ser216 by checkpoint and interphase kinases (CHK1, CHK2, MARK3/C-TAK1, MAPK14) creates a 14-3-3 binding site; 14-3-3 binding sequesters CDC25C in the cytoplasm and blocks nuclear import, restraining mitotic entry during the G2 DNA-damage checkpoint (negative regulation of the G2/M transition).
