id: P34947
gene_symbol: GRK5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: GRK5 is a serine/threonine kinase that phosphorylates activated G protein-coupled receptors
  and regulates their signaling. Phospholipid interactions and a C-terminal amphipathic region support
  its plasma-membrane association. GRK5 also enters the nucleus and phosphorylates non-receptor substrates,
  including p53, giving it context-dependent roles in stress responses, survival and proliferation. Its
  receptor recruitment differs from GRK2, and kinase activity does not imply the same regulatory outcome
  for every receptor or cell type.
