id: P26038
gene_symbol: MSN
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'Moesin is a canonical ezrin-radixin-moesin cortical linker that switches from a closed cytosolic
  conformation to an activated, phosphorylated plasma-membrane form that binds F-actin and FERM-domain
  membrane partners. It organizes actin-rich apical, microvillar, filopodial, and leukocyte/endothelial
  cortical structures, binds adhesion molecules such as ICAM1 and VCAM1, contributes to lymphocyte adhesion,
  migration, proliferation, and immunological synapse formation, and also participates with HOPS/Vps11
  in early-to-late endosome maturation.'
