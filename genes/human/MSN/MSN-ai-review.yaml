core_functions:
- description: Phosphoregulated ERM linker activity at the cytoplasmic face of the plasma membrane, 
    where the FERM domain binds membrane partners and the C-terminal tail binds F-actin to organize 
    apical, microvillar, and protrusive cortical domains.
  molecular_function:
    id: GO:0003779
    label: actin binding
  directly_involved_in:
