proposed_new_terms: []
suggested_questions:
- question: Which reported MSN membrane partners are endogenous direct effectors in lymphocyte and 
    endothelial cells, and which are overexpression or two-hybrid interactions with no dedicated MSN
    molecular function?
- question: Should PAINT restrict the PTHR23281 HOPS/endosome rows to the canonical ERM subclade so 
    they no longer propagate to Merlin/NF2 recipients?
suggested_experiments:
- description: Use acute, paralog-resolved endogenous degrons for EZR, RDX, and MSN in endothelial 
    and lymphoid cells, followed by rescue with F-actin-binding and FERM-domain mutants, to separate
    MSN-specific adhesion-molecule binding, endosome maturation, and cortical-shape outputs from 
    redundant ERM effects.
