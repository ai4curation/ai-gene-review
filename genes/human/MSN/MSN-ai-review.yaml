    label: cytoskeleton organization
  - id: GO:0008360
    label: regulation of cell shape
  locations:
  - id: GO:0005886
    label: plasma membrane
  - id: GO:0005902
    label: microvillus
  - id: GO:0030175
    label: filopodium
  supported_by:
  - reference_id: file:genes/human/MSN/MSN-uniprot.txt
    record_section:
    - CC:FUNCTION
    supporting_text: Ezrin-radixin-moesin (ERM) family protein that connects the actin cytoskeleton 
      to the plasma membrane
