    reference_section_type: DATABASE_ENTRY
  reference_review:
    relevance: LOW
    correctness: UNVERIFIED
    review_notes: Generic Gi-cycle provenance attached to an LPAR5 pathway model. The audited direct LPAR5 studies establish Gq, G12/13, and Gs outputs but do not provide equally decisive Gi coupling evidence, so this entry should not be treated as direct support for LPAR5-Gi coupling.
- id: Reactome:R-HSA-419389
  title: LPA-binding receptors bind LPA
  findings:
  - statement: The cached Reactome summary describes LPA binding by the EDG-family LPA1-3 receptors, not LPAR5 specifically.
    supporting_text: The LPA-binding EDG receptors all bind to the ligand lysophosphatidic acid (LPA), a phospholipid derivative that acts as a potent signaling molecule.
    full_text_unavailable: false
    reference_section_type: DATABASE_ENTRY
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Reactome participant provenance supports placement of LPAR5 in this plasma-membrane ligand-binding event. The cached prose narrates LPA1-3 and supplies no LPAR5-specific mechanism, so direct LPAR5 ligand and structure papers remain the receptor-specific evidence.
