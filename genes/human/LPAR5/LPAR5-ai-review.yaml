knowledge_gaps:
- gap_statement: >-
    The quantitative Gq/11, G12/13, Gs, Gi/o, and beta-arrestin coupling profile of
    endogenous human LPAR5 is unresolved across native cell types and ligands.
  boundary: >-
    Heterologous assays establish Gq, G12/13, and Gs capability and ligand-dependent
    branch use; the LPA-bound structure directly resolves Gq coupling. Seeded
    Reactome Gi events are pathway models, while the audited primary studies do not
    establish receptor-specific Gi coupling.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    Native coupling weights determine how LPAR5 controls phosphoinositides, cAMP,
    cytoskeletal signaling, and tissue-specific physiology.
  resolution: >-
    Measure endogenous LPAR5 with parallel Gq/11, G12/13, Gs, Gi/o,
    beta-arrestin, phosphoinositide, cAMP, calcium, and Rho biosensors across matched
    LPA, FPP, and NAG dose and time courses.
- gap_statement: >-
    The physiological competition and relative importance of LPA, FPP, NAG, and
    alkyl glycerol phosphate as endogenous LPAR5 agonists are unknown.
  boundary: >-
    Recombinant assays support all four ligand classes and reveal different potency
    or pathway profiles, but do not establish their local concentrations, receptor
    occupancy, or dominant native-tissue effects.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: >-
    Physiological ligand identity may determine signaling bias and reconcile
    divergent tissue phenotypes.
  resolution: >-
    Combine quantitative lipidomics with endogenous LPAR5 knockout/rescue and
    branch-resolved pharmacology in intestinal immune, sensory, and platelet-lineage
    human cells.
- gap_statement: >-
    The endogenous mechanism and consequences of LPA-induced LPAR5 internalization
    are unresolved.
  boundary: >-
    Tagged recombinant LPAR5 internalizes selectively after LPA exposure, but the
    route, phosphorylation sites, arrestin dependence, recycling, degradation, and
    native-cell kinetics have not been established.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    Trafficking controls signal duration and may vary with ligand and tissue context.
  resolution: >-
    Endogenously tag LPAR5 and perturb candidate kinases, arrestins, and endocytic
    machinery while quantifying ligand-specific internalization, recycling,
    degradation, and signaling resensitization.
- gap_statement: >-
    The conservation and human relevance of Lpar5-dependent neuropathic-pain
    physiology remain uncertain.
  boundary: >-
    Mouse Lpar5 deletion protects against injury-induced neuropathic pain without a
    gross baseline phenotype, and human DRG expresses LPAR5, but causal human sensory
    neuron evidence is lacking.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: >-
    Establishing conservation is essential before assigning a constitutive human
    pain role or pursuing receptor-directed analgesia.
  resolution: >-
    Test LPAR5 loss and rescue in human sensory-neuron models with injury-associated
    lipid mixtures and compare neuronal excitability and CREB-pathway outputs with
    the mouse phenotype.
- gap_statement: >-
    The native roles of LPAR5 in human platelet-lineage, intestinal immune, plaque,
    and cancer contexts require further separation.
  boundary: >-
    Megakaryocytic-cell knockdown supports receptor-specific LPA responses, whereas
    mature platelet pharmacology is less genetically tractable. Intestinal T-cell
    enrichment, plaque-induced shape change, and nasopharyngeal-carcinoma migration
    each establish distinct contexts rather than a universal cellular function.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: >-
    Context resolution will distinguish normal receptor physiology from disease- or
    lineage-specific signaling.
  resolution: >-
    Use endogenous knockout/rescue in primary or stem-cell-derived platelet,
    intestinal immune, vascular-plaque, and epithelial tumor models with matched
    ligand and coupling measurements.
- gap_statement: >-
    Whether LPAR5 has functionally distinct endogenous protein isoforms or stable
    receptor-specific partners is unknown.
  boundary: >-
    Transcript databases list multiple accessions, but the reviewed protein record
    and audited literature do not establish isoform-specific function. No decisive
    stable endogenous receptor partner was identified; the LPA-bound Gq structure is
    an activated signaling state, not evidence of constitutive complex membership.
  gap_kind:
  - BIOLOGY
  - CURATION
  status: OPEN
  significance: >-
    Unverified isoforms or partners should not be used to explain tissue-specific
    signaling without direct evidence.
  resolution: >-
    Reconcile full-length transcripts by long-read sequencing and proteomics, then
    combine endogenous proximity labeling with genetic perturbation to identify
    reproducible signaling or trafficking partners.
