id: Q9H1C0
gene_symbol: LPAR5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  LPAR5 is a class-A seven-transmembrane G protein-coupled receptor that binds
  extracellular lysophosphatidic acid at the plasma membrane. Recombinant human
  receptor studies establish nanomolar LPA binding and activation of Gq-linked
  phosphoinositide signaling, G12/13-Rho signaling, and Gs-linked cAMP production.
  Farnesyl pyrophosphate and N-arachidonylglycine can also activate LPAR5 in
  heterologous assays, with ligand-dependent differences in Gq/11 and Gs branch use;
  these activities do not establish which agonists dominate in native tissues. A
  2.96-angstrom cryo-EM structure captures 1-oleoyl-LPA-bound LPAR5 coupled to Gq,
  defining polar recognition of the phosphate headgroup, burial of the acyl tail,
  and a noncanonical receptor–Gq interface. This structure represents the activated
  signaling state rather than a constitutive stable complex. LPA also induces LPAR5
  internalization in a tagged-receptor system. LPAR5 is expressed in multiple human
  tissues and is enriched in small-intestinal intraepithelial CD8-positive T cells,
  sensory dorsal-root ganglia, and platelet-lineage cells. Mouse Lpar5 loss protects
  against injury-induced neuropathic pain without a gross baseline phenotype, while
  human megakaryocytic-cell perturbation supports LPAR5-dependent LPA responses in
  the platelet lineage. Reduced LPAR5 expression promotes LPA-induced migration in
  EBV-associated nasopharyngeal carcinoma cells. These pain, platelet,
  atherosclerotic-plaque, and cancer phenotypes are tissue-, species-, or
  disease-context outputs of receptor signaling rather than additional core
  molecular activities.
