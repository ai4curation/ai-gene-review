  findings:
  - statement: A 2.96-Å cryo-EM structure captured LPAR5 bound to 1-oleoyl-LPA in complex with Gq.
    supporting_text: Here, we report the cryo-EM structure of LPAR5 bound to 1-oleoyl-lysophosphatidic acid (LPA) in complex with Gq at 2.96 Å resolution, revealing a distinct mode of receptor activation and G protein coupling.
