    supporting_text: Numerous functionally unrelated GPCRs couple with the Gq G-protein subtype.
    full_text_unavailable: false
    reference_section_type: DATABASE_ENTRY
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Generic curated Gq-binding step consistent with direct LPAR5 functional and structural evidence; it does not independently establish the LPAR5-Gq complex.
