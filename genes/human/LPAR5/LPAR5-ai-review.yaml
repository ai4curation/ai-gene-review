core_functions:
- description: >-
    Acts at the plasma membrane as an LPA-activated GPCR. Recombinant human LPAR5
    activates Gq-linked phosphoinositide signaling, G12/13 signaling, and Gs-linked
    cAMP production. LPA and FPP activate both Gq/11 and Gs branches, whereas NAG
    activates Gq/11 in the tested systems, showing ligand-dependent signaling bias.
    The LPA-bound LPAR5–Gq cryo-EM structure directly defines an activated coupling
    state with a noncanonical G-alpha-q interface; it does not imply a constitutive
    stable receptor–G-protein complex. Pain, platelet-lineage, immune, plaque, and
    cancer phenotypes are bounded downstream outputs rather than additional core
    molecular activities.
