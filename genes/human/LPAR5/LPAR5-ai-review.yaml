  title: Liganded Gi-activating GPCR acts as a GEF for Gi
  findings:
  - statement: Reactome describes nucleotide exchange as the proximal activation step for a Gi-coupled GPCR.
    supporting_text: This stimulates the exchange of GDP for GTP in the G-protein alpha subunit, activating the G-protein.
