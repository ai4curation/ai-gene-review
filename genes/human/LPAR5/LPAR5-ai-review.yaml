suggested_questions:
- question: >-
    What are the endogenous Gq/11, G12/13, Gs, Gi/o, and beta-arrestin coupling
    weights of human LPAR5 in its major native cell types?
- question: >-
    Which of LPA, FPP, NAG, and alkyl glycerol phosphate occupies and activates
    LPAR5 under physiological conditions?
- question: >-
    How is ligand-specific LPAR5 internalization controlled, and does it alter
    signaling bias or resensitization?
- question: >-
    Is the Lpar5-dependent neuropathic-pain mechanism conserved in human sensory
    neurons?
- question: >-
    Which LPAR5 outputs are specific to platelet-lineage, intestinal immune, plaque,
    or nasopharyngeal-carcinoma contexts?
- question: >-
    Are any endogenous LPAR5 isoforms or stable regulatory partners functionally
    distinct?
suggested_experiments:
- hypothesis: >-
    Native LPAR5 coupling weights and ligand bias differ across intestinal immune,
    sensory-neuron, and platelet-lineage cells.
  description: >-
    CRISPR-tag endogenous LPAR5 and measure Gq/11, G12/13, Gs, Gi/o,
    beta-arrestin, phosphoinositide, cAMP, calcium, and Rho responses to LPA, FPP,
    NAG, and alkyl glycerol phosphate with selective G-alpha knockout and rescue.
  experiment_type: endogenous multiplexed coupling and ligand-bias analysis
- hypothesis: >-
    Local lipid abundance determines which agonist class dominates native LPAR5.
  description: >-
    Combine targeted extracellular and membrane lipidomics with LPAR5 knockout,
    genomic rescue, and receptor-occupancy or functional competition assays in
    native-expression human cells.
  experiment_type: native ligand competition and lipidomics
- hypothesis: >-
    LPA and alternative agonists produce distinct LPAR5 trafficking and
    resensitization states.
  description: >-
    Endogenously tag LPAR5, map agonist-dependent phosphorylation and arrestin
    recruitment, and quantify internalization, recycling, degradation, and signaling
    recovery after matched agonist pulses.
  experiment_type: endogenous ligand-resolved receptor trafficking
- hypothesis: >-
    Human sensory-neuron LPAR5 reproduces the injury-dependent CREB and excitability
    program inferred from Lpar5-null mice.
  description: >-
    Perturb LPAR5 in human iPSC-derived sensory neurons, apply injury-associated
    lipid mixtures, and measure excitability, calcium, cAMP, Rho, and CREB responses
    with genetic rescue and comparison to mouse neurons.
  experiment_type: mouse-to-human pain-mechanism conservation
- hypothesis: >-
    LPAR5 uses different coupling branches in platelet-lineage, intestinal immune,
    and epithelial tumor cells.
  description: >-
    Perform matched endogenous knockout/rescue and branch-resolved signaling in
    primary or stem-cell-derived models, then connect proximal responses to shape
    change, activation, immune effector behavior, plaque response, or migration.
  experiment_type: lineage-resolved receptor physiology
- hypothesis: >-
    Only one predominant LPAR5 proteoform is expressed, while a small set of
    inducible partners controls tissue-specific signaling.
  description: >-
    Reconcile transcripts by targeted long-read sequencing and proteomics, then use
    endogenous proximity labeling before and after agonist exposure followed by
    partner knockout and signaling/trafficking rescue assays.
  experiment_type: proteoform reconciliation and endogenous interactome validation
