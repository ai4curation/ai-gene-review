    supporting_text: The phosphate headgroup of LPA forms extensive polar interactions with residues from extracellular loop 2 and transmembrane helices TM5-TM7, while the lipid tail inserts into a deep hydrophobic cavity formed by TM3-TM5. Site-directed mutagenesis confirms the functional importance of these interactions.
