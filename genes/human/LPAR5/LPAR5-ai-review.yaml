  title: Liganded Gi-activating GPCRs bind inactive heterotrimeric G-protein Gi
  findings:
  - statement: Reactome describes the canonical Gi consequence of reduced cAMP production.
    supporting_text: The G-alpha (i) subunit inhibits the production of cAMP from ATP.
    full_text_unavailable: false
    reference_section_type: DATABASE_ENTRY
  reference_review:
    relevance: LOW
    correctness: UNVERIFIED
    review_notes: Generic Gi-binding pathway context. Human LPAR5 deorphanization studies instead report increased cAMP, so receptor-specific Gi use requires independent direct evidence before acceptance.
- id: PMID:16651401
  title: Lysophosphatidic acid binds to and activates GPR92, a G protein-coupled receptor highly expressed in gastrointestinal lymphocytes.
  findings:
  - statement: GPR92 bound LPA with nanomolar affinity and LPA activation increased phosphoinositide hydrolysis and cAMP production.
    supporting_text: The binding of LPA to GPR92 was of high affinity (K(D) = 6.4 +/- 0.9 nM) and led to an increase in both phosphoinositide hydrolysis and cAMP production.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  - statement: The reported human tissue survey found GPR92 broadly expressed and particularly abundant in gastrointestinal intraepithelial cytotoxic T cells.
    supporting_text: It is the most abundant GPCR activated by LPA found in the small intestinal intraepithelial CD8+ cytotoxic T cells.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Decisive primary deorphanization study with direct high-affinity LPA binding, phosphoinositide and cAMP outputs, and human gastrointestinal-lymphocyte expression context.
- id: PMID:16774927
  title: GPR92 as a new G12/13- and Gq-coupled lysophosphatidic acid receptor that increases cAMP, LPA5.
  findings:
  - statement: Heterologously expressed GPR92 showed specific membrane LPA binding and LPA-dependent internalization.
    supporting_text: LPA-dependent receptor internalization following exposure to LPA but not related lysophospholipids was observed.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  - statement: LPA activated G12/13 and Gq through GPR92 and increased cAMP in the receptor-expression systems.
    supporting_text: Furthermore, LPA induced concentration-dependent activation of G(12/13) and G(q) and increased cAMP levels.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  - statement: LPAR5 expression was enriched in small intestine and sensory dorsal-root ganglia in the reported tissue survey.
    supporting_text: Northern blot and reverse transcriptase-PCR studies indicated a broad low level of expression in many tissues including embryonic brain and enrichment in small intestine and sensory dorsal root ganglia, as well as embryonic stem cells.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Independent primary LPAR5 identification and coupling study using heterologous tagged-receptor systems; establishes receptor capability, not fixed native-human coupling weights.
- id: PMID:18499677
  title: Identification of farnesyl pyrophosphate and N-arachidonylglycine as endogenous ligands for GPR92.
  findings:
  - statement: FPP, N-arachidonylglycine, and LPA activated GPR92, with ligand-dependent differences in Gq/11 and Gs pathway use.
    supporting_text: FPP and lysophosphatidic acid were able to activate both G(q/11)- and G(s)-mediated signaling pathways, whereas NAG activated only the G(q/11)-mediated signaling pathway.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  - statement: Mutagenesis implicated four GPR92 residues in recognition of FPP and N-arachidonylglycine.
    supporting_text: Computer-simulated modeling combined with site-directed mutagenesis of GPR92 indicated that Thr(97), Gly(98), Phe(101), and Arg(267) of GPR92 are responsible for the interaction of GPR92 with FPP and NAG.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  - statement: GPR92 was detected in mouse and human dorsal-root ganglia with substantial TRPV1 colocalization.
    supporting_text: Immunohistochemical analysis revealed that GPR92 is largely co-localized with TRPV1, a nonspecific cation channel that responds to noxious heat, in mouse and human DRG.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary alternative-ligand and mutagenesis study. It supports receptor activation by FPP and NAG in assay systems, but does not establish their dominant endogenous ligand status across human tissues.
- id: PMID:19366702
  title: Unique ligand selectivity of the GPR92/LPA5 lysophosphatidate receptor indicates role in human platelet activation.
  findings:
  - statement: Mutagenesis identified four residues required for full LPAR5 activation by LPA-related ligands.
    supporting_text: 'Four residues involved in ligand recognition in LPA(5) were identified as follows: R2.60N mutant abolished receptor activation, whereas H4.64E, R6.62A, and R7.32A greatly reduced receptor activation.'
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  - statement: LPAR5 preferred alkyl glycerol phosphate over LPA, farnesyl phosphates, and N-arachidonoylglycine in the reported structure-activity series.
    supporting_text: SAR revealed that the rank order of agonists is alkyl glycerol phosphate > LPA > farnesyl phosphates >> N-arachidonoylglycine.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  - statement: Non-lipid LPAR5 antagonists inhibited human platelet activation.
    supporting_text: Because LPA(5) transcripts are abundant in human platelets, we tested its antagonists on platelet activation and found that these non-lipid LPA(5) antagonists inhibit platelet activation.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary ligand-recognition, pharmacology, and human platelet study; antagonist effects support an LPAR5 contribution but are less definitive than receptor-selective genetic perturbation.
- id: PMID:21106562
  title: GPR92/LPA₅ lysophosphatidate receptor mediates megakaryocytic cell shape change induced by human atherosclerotic plaques.
  findings:
  - statement: LPA caused rapid Rho-kinase-dependent shape change in human megakaryocytic cell lines, with an LPA-species rank order resembling platelets.
    supporting_text: 'They showed upon LPA stimulation a rapid, Rho-kinase-mediated shape change similar to that of human platelets.'
    full_text_unavailable: false
    reference_section_type: ABSTRACT
  - statement: Selective knockdown showed LPAR5, rather than the other assayed LPA receptors, mediated LPA activation of the megakaryocytic cells.
    supporting_text: Knock-down of individual LPA receptors by siRNA showed that LPA-mediated activation of MK cells was mediated by LPA₅, but not by LPA₁₋₄,₆,₇.
    full_text_unavailable: false
    reference_section_type: ABSTRACT
  - statement: LPAR5 silencing inhibited megakaryocytic-cell shape change induced by human atherosclerotic plaque material.
    supporting_text: Importantly, we found that human atherosclerotic plaque and lipid-rich core induced shape change of Dami cells, and that this effect was inhibited after LPA₅ silencing.
    full_text_unavailable: false
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full-text primary human megakaryocytic-cell and plaque study with receptor-selective knockdown; supports a platelet-lineage context but does not directly manipulate LPAR5 in anucleate platelets.
- id: PMID:22461625
  title: Targeted deletion of LPA5 identifies novel roles for lysophosphatidic acid signaling in development of neuropathic pain.
  findings:
  - statement: Lpar5-null mice lacked obvious baseline defects but were protected from neuropathic pain after partial sciatic nerve ligation.
    supporting_text: Homozygous null mutants did not show obvious base-line phenotypic defects. However, following PSNL, LPA(5)-deficient mice were protected from developing neuropathic pain.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  - statement: Lpar5 loss reduced dorsal-horn phosphorylated CREB without preventing induction of other pain-associated markers.
    supporting_text: They also showed reduced phosphorylated cAMP response element-binding protein expression within neurons of the dorsal horn despite continued up-regulation of the characteristic pain-related markers Caα(2)δ(1) and glial fibrillary acidic protein, results that were distinct from those previously observed for LPA(1) deletion.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary mouse knockout evidence for neuropathic-pain development and the key source underlying pain-related transfer; it is not direct evidence for a constitutive human pain role.
- id: PMID:25294670
  title: Down-regulation of LPA receptor 5 contributes to aberrant LPA signalling in EBV-associated nasopharyngeal carcinoma.
  findings:
  - statement: LPAR5 was downregulated in primary nasopharyngeal carcinoma, and reduced LPAR5 promoted LPA-induced migration in NPC cell lines.
    supporting_text: Focusing on the first of these phenotypes, we show that one of the LPA receptors, LPA receptor 5 (LPAR5), is down-regulated in primary NPC tissues and that this down-regulation promotes the LPA-induced migration of NPC cell lines.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  - statement: EBV infection or its LMP2A protein was sufficient to reduce LPAR5 in NPC cells.
