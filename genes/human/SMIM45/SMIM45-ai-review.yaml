references:
- id: GO_REF:0000044
  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot Subcellular Location
    vocabulary mapping, accompanied by conservative changes to GO terms applied by
    UniProt
  findings: []
- id: PMID:36593289
  title: De novo genes with an lncRNA origin encode unique human brain developmental
    functionality.
  findings:
  - statement: The protein studied (localization, knockout, over-expression, mouse
      knock-in) is the 107-amino-acid hominoid-specific ORF of ENSG00000205704, not the
      68-amino-acid upstream ORF that UniProt A0A590UK83 now represents.
    supporting_text: which encodes a putative protein of 107 amino acids located in both
      cytoplasm and nucleus
  reference_review:
    relevance: HIGH
    correctness: MISCITED
    review_notes: Full text read (PMC9911349). Sound study, correctly cited for the
      107-residue product, but miscited for the current 68-residue A0A590UK83 sequence,
      which replaced the studied sequence in UniProt 2023_03 after the GO rows were made.
- id: PMID:38612733
  title: Evolution of a Human-Specific De Novo Open Reading Frame and Its Linked
    Transcriptional Silencer.
  findings:
  - statement: The 68-aa ORF is ultra-conserved to cartilaginous fish and is the ORF
      translated in somatic brain tissue; the 107-aa ORF arose de novo in primates.
    supporting_text: In somatic brain tissues, only the 68 aa ORF is translated and not
      the 107 aa ORF [3]; thus, there is no translational readthrough.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (Int J Mol Sci 2024;25:3924), full text cached.
      Evolutionary analysis establishing the bicistronic structure; no functional data.
- id: PMID:42194976
  title: Diverse Processes Drive the Origination and Maturation of an Array of Enhancers
    and Silencers During a Vast Evolutionary Timescale of a Bicistronic Gene.
  findings:
  - statement: SMIM45 encodes an ancient 68-aa microprotein and a de novo 107-aa protein.
    supporting_text: SMIM45 is also a bicistronic gene, encoding both an ancient 68 aa
      microprotein and a human-specific, de novo 107 aa protein [7].
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified (Genes 2026;17:519). Regulatory-element evolution; no
      functional data on either protein.
- id: PMID:41219895
  title: -A novel peptide SMIM45-107aa promotes HCC progression via MTDH pathways and its
    anticancer peptide derivative.
  findings:
  - statement: The 107-aa product (SMIM45-107aa) binds and stabilises MTDH in
      hepatocellular carcinoma cells and is cytoplasmic there.
    supporting_text: Immunofluorescent staining further demonstrated SMIM45-107aa and
      MTDH was co-located in the cytoplasm of HCC cells
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified (J Transl Med 2025;23:1266). Concerns the 107-residue
      product only, so it is relevant to the bicistronic interpretation but supplies no
      function for the 68-residue protein of this entry.
- id: file:human/SMIM45/SMIM45-bioinformatics/RESULTS.md
  title: SMIM45 ORF check (UniProt sequence versions mapped to Ensembl transcripts)
  findings:
  - statement: Both ORFs lie on every Ensembl SMIM45 transcript without overlap; the
      knockout and qPCR primers of PMID:36593289 map inside the 107-aa ORF only.
core_functions: []
suggested_questions:
- question: >-
    Should UniProt give the 107-residue downstream-ORF product of SMIM45 its own accession
    (as for other alternative-ORF peptides) and move the PMID:36593289 FUNCTION,
    SUBCELLULAR LOCATION and GO rows onto it, leaving A0A590UK83 for the conserved
    68-residue protein?
- question: >-
    What does the ultra-conserved 68-residue SMIM45 microprotein do, and in which membrane
    does it reside? Conservation back to cartilaginous fish implies strong constraint on a
    protein for which there is no functional data.
suggested_experiments:
- hypothesis: The 68-residue SMIM45 protein is a single-pass integral membrane protein of
    a specific organelle.
  description: >-
    Express epitope-tagged 68-residue SMIM45 at endogenous level (knock-in tag) in neural
    and non-neural human cells; determine localization by co-staining with organelle
    markers, carbonate extraction and protease protection; identify partners by
    proximity labelling. Test loss of function with a knockout that disrupts the 68-residue
    ORF while leaving the downstream 107-residue ORF intact.
  experiment_type: localization and loss-of-function
