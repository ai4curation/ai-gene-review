- term:
    id: GO:0042551
    label: neuron maturation
  evidence_type: IMP
  original_reference_id: PMID:36593289
  qualifier: involved_in
  review:
    summary: Knockout and over-expression of the hominoid-specific 107-amino-acid ORF of
      ENSG00000205704 changed the pace of neuronal maturation in cortical organoids (knockout
      accelerated it, over-expression and a mouse knock-in delayed it).
    action: REMOVE
    reason: >-
      The perturbed ORF is the 107-residue downstream ORF, not the 68-residue protein this
      accession now represents. The knockout genotyping primer begins at the start codon of
      the 107-residue ORF and the over-expression construct carried that ORF, while neither
      touches the 68-residue ORF (SMIM45-bioinformatics/RESULTS.md). The row was made on
      sequence version 1 (107 aa) and survived the 2023_03 sequence replacement. For the
      107-residue product itself the observed effect is negative regulation (loss speeds
      maturation), so a regulation term would be the more accurate choice once that
      product has its own accession.
    supported_by:
