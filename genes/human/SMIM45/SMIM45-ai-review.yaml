  review:
    summary: Nuclear localization reported in PMID:36593289 for the protein encoded by
      ENSG00000205704. The protein studied was the 107-amino-acid downstream-ORF product,
      not the 68-amino-acid protein that A0A590UK83 now represents.
    action: REMOVE
    reason: >-
      The annotation was made (GOA date 2023-02-14) while A0A590UK83 carried sequence
      version 1, the 107-residue protein that the paper explicitly describes. In UniProt
      release 2023_03 the entry's sequence was replaced by the unrelated, ultra-conserved
      68-residue upstream ORF, and the experimental rows were carried over unchanged. The
      two ORFs share no sequence (SMIM45-bioinformatics/RESULTS.md). The curator's
      reading of the paper was correct for the sequence at the time; the row is now
      attached to the wrong gene product. The localization belongs to the 107-residue
      product, which currently has no UniProtKB accession.
    supported_by:
