  review:
    summary: UniProt predicts a single helical transmembrane segment (residues 7-27) in the
      current 68-residue sequence, mapped to membrane.
    action: ACCEPT
    reason: This is the only annotation derived from the sequence the entry now
      represents. The hydrophobic segment VYLVISVLILVGFGACIYYF is a clear transmembrane
