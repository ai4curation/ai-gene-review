id: A0A590UK83
gene_symbol: SMIM45
product_type: PROTEIN
status: COMPLETE
aliases:
- LINC00634
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  SMIM45 (formerly the long non-coding RNA LINC00634, chromosome 22) is a bicistronic
  locus. Its upstream open reading frame encodes the 68-amino-acid protein represented by
  this entry, a predicted single-pass membrane microprotein with one hydrophobic helix
  near the N terminus. This 68-residue ORF is ultra-conserved across vertebrates, is
  supported by ribosome-profiling evidence of translation, and has no reported molecular
  function, partner or subcellular localization from experiment. A second,
  non-overlapping downstream ORF on the same mRNA encodes a 107-amino-acid protein that
  arose de novo in hominoids; that separate product is expressed in fetal brain, is found
  in both nucleus and cytoplasm, delays neuronal maturation when over-expressed in
  cortical organoids and mice, and in hepatocellular carcinoma cells binds and stabilises
  metadherin (MTDH). The functions reported for the 107-residue product have not been
  shown for the 68-residue protein.
