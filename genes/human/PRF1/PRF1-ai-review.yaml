- term:
    id: GO:0001771
    label: immunological synapse formation
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN002918660
  - UniProtKB:P14222
  review:
    summary: Phylogenetic propagation of a role in immunological synapse formation to the perforin clade.
      The claim is that perforin helps build the synapse, which it does not.
    action: REMOVE
    reason: 'Perforin does none of the work of forming the immunological synapse. The term''s own definition
      specifies the mechanism - clustering of signalling and adhesion molecules and their associated membrane
      rafts on both the lymphocyte and the target cell - and perforin is neither a signalling nor an adhesion
      molecule; it is a soluble granule protein that is not in the plasma membrane at all until degranulation.
      Thiery et al. state the order of events explicitly: killer cells act by releasing granule contents
      into the synapse that has already formed with the target cell. Perforin-null lymphocytes are present
      in normal numbers and conjugate with targets, and what they fail to do is lyse them, so the lesion
      is in lysis rather than in synapse assembly. This is the participation test rather than a complaint
      about evidence strength: being delivered into a structure is not contributing to building it. The
      observation that genuinely underlies these rows - perforin-stained lytic granules at the synapse
      - is a localisation result, and this review keeps it as the cellular-component annotation GO:0001772
      immunological synapse, which is where it belongs. As a phylogenetic assertion this row is a judgement
      about where a function arose, and the descendant evidence behind the PAINT node for this term includes
      this gene''s own IDA, the row below, so the node placement rests on the same reading of the same
      paper. What is inherited across the vertebrate perforin clade is the pore-forming function, not
      a role in assembling the synapse, and the clade''s conserved function is already captured by GO:0022829
      and GO:0001913.'
    supported_by:
    - &id001
      reference_id: PMID:21685908
      supporting_text: releasing the contents of cytotoxic granules1 into the immune synapse formed with
        their target cell
    - &id002
      reference_id: PMID:8164737
      supporting_text: These mice are viable and fertile and have normal numbers of CD8+ T cells and natural
        killer cells which do not lyse virus-infected or allogeneic fibroblasts or natural killer target
        cells in vitro.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - ROLE_CONFLATION
      source_entities:
      - source_id: PANTHER:PTN002918660
        source_status: SOURCE_BAD
        comment: The ancestral node is the right node for perforin's conserved pore-forming function,
          and this review accepts its GO:0022829 and GO:0001913 propagations. For this term the node's
          descendant evidence is the human IDA disputed below, in which perforin is a lytic-granule marker
          in a Syntaxin-7 study; the scoping error is inherited rather than introduced by the propagation.
      residue_claims_not_applicable: This row concerns process participation, not a residue-level claim.
