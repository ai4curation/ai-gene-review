- term:
    id: GO:0010008
    label: endosome membrane
  evidence_type: IDA
  original_reference_id: PMID:21685908
  qualifier: is_active_in
  review:
    summary: 'Proposed annotation for perforin''s second site of action: the membrane of the enlarged
      target-cell endosome, where it perforates from the lumenal side to release granzymes.'
    action: NEW
    reason: 'The gene already carries endosome lumen (GO:0031904) as a location, but the functionally
      important claim is that perforin is active in the bounding membrane of that compartment, which is
      the cellular-component counterpart of the pore-forming activity accepted here and parallels the
      existing is_active_in plasma membrane rows. Thiery et al. show it directly rather than as a model:
      perforin forms pores in the gigantosome membrane, allowing endosomal cargo including granzymes to
      be released, with cargo release in the cytosol coinciding in time with perforin multimerisation
      in that membrane. A gigantosome is an enlarged EEA1-positive early endosome, so endosome membrane
      is the correct compartment term; proposed at that level rather than at early endosome membrane because
      the gigantosome is a perforin-induced fusion product whose identity as a canonical early endosome
      is not something this review should over-specify. This matters beyond bookkeeping: whether granzymes
      enter through plasma-membrane or endosomal pores is the long-running mechanistic dispute about perforin,
      and the annotations should record that both membranes are sites of activity.'
    supported_by:
    - *id017
    - *id018
    - *id003
