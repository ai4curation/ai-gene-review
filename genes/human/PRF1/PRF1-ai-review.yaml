- term:
    id: GO:0005509
    label: calcium ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - UniProtKB:P10820
  - ensembl:ENSMUSP00000151354
  - InterPro:IPR037300
  review:
    summary: Calcium binding by the C-terminal C2 domain, the step that licenses membrane engagement.
    action: ACCEPT
    reason: A real, directly measured molecular function and mechanistically upstream of everything else
      perforin does. Yagi et al. titrated calcium into the isolated C2 domain by NMR and crystallography
      and showed multiple ions binding within the calcium-binding regions, with occupancy of the weakest
      site driving the rearrangement that lets the domain engage lipid; Law et al. assign the same role
      to the C2 domain structurally. The functional dependence is absolute - Praper et al. saw no permeabilisation
      of vesicles without calcium. Mouse Prf1 carries this term by IDA three times over, so the ISS transfer
      rests on experiment.
    supported_by:
    - &id007
      reference_id: PMID:26306037
      supporting_text: Calcium titrations, together with dodecylphosphocholine micelle experiments, confirmed
        that multiple Ca(2+) ions bind within the calcium-binding regions, activating perforin with respect
        to membrane binding.
    - &id008
      reference_id: PMID:21037563
      supporting_text: A C-terminal C2 domain mediates initial, Ca(2+)-dependent membrane binding.
    - &id009
      reference_id: PMID:20889983
      supporting_text: In the absence of Ca2+, no permeabilization of GUVs was observed
    additional_reference_ids:
    - PMID:26306037
    - PMID:21037563
    - PMID:20889983
