  review:
    summary: Umbrella term for contact-dependent killing by a leukocyte, assigned from the perforin-1
      C2 InterPro signature.
    action: ACCEPT
    reason: 'Accurate, and deliberately kept rather than refined away. Perforin is the shared pore-forming
      effector of several cytotoxic leukocyte lineages - CD8 T cells, NK cells and NKT cells - so the
      parent term that spans them says something the lineage-specific children individually do not. The
      review asserts the T cell child (GO:0001913) and proposes the NK child (GO:0042267); this parent
      remains the correct statement for the NKT-cell killing reported by Takahashi et al. and for the
      lineages that have no child term of their own. Not marked TOO_GENERAL because it is not merely a
      redundant ancestor here: it is the level at which perforin''s effector role is lineage-independent.'
