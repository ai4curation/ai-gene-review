- molecular_function:
    id: GO:0005509
    label: calcium ion binding
  description: 'Calcium binding by the C-terminal C2 domain, the switch that licenses every downstream
    step. Multiple calcium ions bind within the domain''s calcium-binding regions; occupancy of the weakest
    site drives a structural rearrangement in the first calcium-binding region that lets the domain engage
    phospholipid, which is the initial and obligatory contact with the target membrane. The dependence
    is absolute rather than modulatory: without calcium, purified human perforin permeabilises no vesicles
    and forms no pores. This activity is why perforin is inert in the low-calcium granule lumen and becomes
    active on release into the extracellular cleft.'
  directly_involved_in:
