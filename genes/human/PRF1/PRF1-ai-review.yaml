  review:
    summary: Perforin-dependent killing of transformed cells; a genuine arm of perforin function rather
      than an inferred extrapolation.
    action: ACCEPT
    reason: 'Supported directly by the knockout phenotype: perforin-null mice eliminate fibrosarcoma cells
      with reduced efficiency, and the tumour-surveillance role is the basis of the lymphoma predisposition
      seen in perforin-deficient mice and in humans with hypomorphic PRF1 alleles. Perforin does the work
      of this process - it is the effector that breaches the tumour cell''s membrane - so it satisfies
      participation rather than mere necessity.'
