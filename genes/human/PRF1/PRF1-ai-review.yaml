suggested_questions:
- question: Through which membrane do granzymes actually reach the cytosol during physiological killing
    - the target cell's plasma membrane, or the membrane of the enlarged endosome into which perforin
    and granzymes are internalised? Both are documented, and the GO annotations should record whichever
    predominates as the site of the delivery step rather than leaving the question implicit.
  experts:
  - Judy Lieberman
  - Jerome Thiery
  - Joseph A Trapani
- question: Can perforin deliver granzyme B as a serglycin complex without forming a detectable pore,
    as Metkar et al. reported? If so, perforin would have a translocator function distinct from its channel
    activity, and the molecular-function annotations would need a term that is not a channel term.
  experts:
  - Sunil S Metkar
  - Christopher J Froelich
  - Judy Lieberman
- question: Should perforin carry GO:0005544 calcium-dependent phospholipid binding in addition to calcium
    ion binding? The C2 domain's measured activity is calcium-dependent engagement of lipid membranes,
    which is more informative than calcium binding alone, but neither the human nor the mouse record carries
    the term and this review did not want to add it unilaterally.
  experts:
  - Raymond S Norton
  - James C Whisstock
- question: Is the perforin-dependent killing of intracellular Mycobacterium tuberculosis by granulysin
    a distinct annotatable role - perforin granting a second effector access to an intracellular pathogen
    - or is it simply the pore-forming activity acting on a different cargo? No defense-response-to-bacterium
    annotation was proposed here because the paper attributes the killing to granulysin.
  experts:
  - Steffen Stenger
  - Robert L Modlin
  - Alan M Krensky
- question: GO:0022829 wide pore channel activity and GO:0140911 pore-forming activity sit in unrelated
    branches with no relationship between them, yet GO:0022829 holds the experimentally annotated MACPF/CDC
    and gasdermin pore-formers while GO:0140911 is populated almost entirely by defensins. Should the
    two be related in the ontology, so that proteins like perforin do not end up on both by different
    routes?
  experts:
  - Pascale Gaudet
  - David Hill
suggested_experiments:
- hypothesis: The endosomal membrane, not the plasma membrane, is the principal site at which perforin
    releases granzymes into the cytosol during cell-mediated killing.
  description: In target cells expressing a cytosolic granzyme-activity reporter, block perforin-triggered
    endocytosis (dynasore, dynamin and clathrin knockdown, Rab5 dominant negative) and separately block
    endosomal escape, during killing by primary CTLs rather than with soluble perforin. Quantify the time
    to cytosolic reporter cleavage against perforin multimerisation imaged simultaneously at both membranes.
    Partitioning delivery between the two routes under physiological attack would settle which membrane
    should carry the is_active_in annotation.
  experiment_type: Live-cell imaging with route-specific blockade during cell-mediated killing
- hypothesis: Perforin can translocate granzyme B-serglycin complexes without forming a conductive pore,
    i.e. it has a translocator activity separable from its channel activity.
  description: Use structure-guided perforin mutants that bind membrane and oligomerise but fail to insert
    the transmembrane hairpins, alongside wild type, and assay in parallel for single-channel conductance
    in planar bilayers and for delivery of granzyme B-serglycin into the cytosol of intact cells. A mutant
    that delivers cargo with no measurable conductance would establish the separable activity and would
    require a molecular-function term outside the channel branch; a mutant that loses both would support
    the simple pore model.
  experiment_type: Separation-of-function mutagenesis with paired electrophysiology and delivery assays
- hypothesis: Perforin's contribution to natural killer cell mediated cytotoxicity is direct and separable
    from its contribution to T cell killing, warranting the lineage-specific annotation proposed here.
  description: In primary human NK cells from healthy donors, knock out PRF1 by CRISPR and reconstitute
    with wild type or pore-dead perforin, then measure killing of standard NK targets (K562, 721.221)
    and antibody-dependent killing, with degranulation and synapse formation measured in parallel as controls.
    Showing intact degranulation and synapse assembly with abolished lysis would both support GO:0042267
    for human PRF1 and independently confirm that perforin plays no part in immunological synapse formation.
  experiment_type: CRISPR knockout and reconstitution in primary human NK cells
- hypothesis: Perforin plays no role in immunological synapse formation, and the existing annotations
    to GO:0001771 should be retired.
  description: 'Form conjugates between perforin-null and wild-type CTLs and matched targets and quantify
    synapse assembly directly: TCR, LFA-1 and talin clustering at the interface, central and peripheral
    supramolecular activation cluster architecture by confocal and TIRF imaging, conjugate stability,
    and granule polarisation to the MTOC and the interface. Equivalent synapse architecture in the absence
    of perforin, with killing abolished, would be the direct negative result; the current argument rests
    on the term''s definition and on perforin being synapse cargo rather than on a published measurement
    of synapse assembly in perforin-null cells.'
  experiment_type: Quantitative synapse imaging in perforin-null versus wild-type cytotoxic lymphocytes
