      than quietly downgrading it, because the full text is not in the local cache and a curator who has
      read it may have seen something the abstract does not report; the argument above does not depend
      on the full text, since it turns on what the term means and on perforin being cargo rather than
      synapse scaffold. GO has already placed a NOT annotation on this term for human CORO1A, so the term
      is actively policed.'
