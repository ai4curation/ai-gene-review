  - PANTHER:PTN002918660
  review:
    summary: Perforin-dependent clearance of virus-infected cells.
    action: ACCEPT
    reason: 'Supported by the knockout phenotype directly: perforin-null mice fail to clear lymphocytic
      choriomeningitis virus, and their CTLs and NK cells do not lyse virus-infected fibroblasts. Perforin
      performs the effector step - killing the infected cell - so this is participation rather than mere
      requirement. Note that the defence is indirect in the sense that perforin acts on the infected host
      cell rather than on the virus; that is how cell-mediated antiviral defence works and is what the
      term covers.'
