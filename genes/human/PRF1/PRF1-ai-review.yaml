- term:
    id: GO:0022829
    label: wide pore channel activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - MGI:MGI:97551
  - PANTHER:PTN002918660
  - UniProtKB:P14222
  review:
    summary: Phylogenetic propagation of the pore-forming channel activity across the perforin clade.
    action: ACCEPT
    reason: 'This is perforin''s core molecular function and the term is the one GO uses for this protein
      class. A comparator check settles what initially looked like a term-choice problem: every structurally
      related human pore-former carries GO:0022829, and almost all of them by IDA - the complement membrane-attack
      components C6, C7, C8A, C8B, C8G and C9, which are perforin''s own family (UniProt: ''Belongs to
      the complement C6/C7/C8/C9 family''), the macrophage perforin MPEG1, and the gasdermins GSDMD and
      GSDME. GO:0140911 pore-forming activity, which reads like the better fit from its definition, is
      in practice a defensin term: its human annotations are DEFA1-DEFA6 plus two electronic rows, one
      of them this gene''s. Proposing a move would have made perforin the only member of its own family
      on a different term, so the existing annotation is left alone. As a phylogenetic assertion this
      is the clade''s defining function, so the node placement is as secure as it gets; the gene''s own
      appearance among the node''s descendant evidence marks that the assertion is experimentally grounded
      on perforin itself.'
