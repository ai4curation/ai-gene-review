  review:
    summary: Phylogenetic propagation from the perforin clade node; perforin is the pore-forming effector
      of CD8 T-cell killing.
    action: ACCEPT
    reason: 'Core, and soundly placed. The function was established by the two independent perforin knockout
      mouse lines, in which CTL killing is lost or sharply reduced while the cells themselves develop
      normally, and it holds in human cells: patients with biallelic PRF1 mutations have defective lymphocyte
      cytotoxicity. Mouse Prf1 carries the same term by IDA and IMP, so the transfer is from experimental
      grounding rather than from another prediction. The human record has no experimental row of its own
      for this term, which is a curation gap rather than a reason to doubt the claim.'
