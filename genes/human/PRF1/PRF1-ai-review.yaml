id: P14222
gene_symbol: PRF1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'Pore-forming effector protein of cytotoxic lymphocytes and the agent that makes granule-mediated
  killing possible. Perforin is a 67 kDa, signal-peptide-bearing glycoprotein built from an N-terminal
  MACPF/cholesterol-dependent-cytolysin domain, an EGF-like domain that forms a central shelf, and a C-terminal
  C2 domain; it belongs to the complement C6/C7/C8/C9 family. It is synthesised by CD8 T cells, natural
  killer cells and NKT cells and stored as soluble cargo in the lumen of secretory lysosomes known as
  cytolytic granules, together with granzymes and granulysin. When a killer cell engages a target, these
  granules polarise to the immunological synapse and release their contents into the cleft between the
  two cells. There the C2 domain binds the target cell''s membrane in a strictly calcium-dependent manner,
  perforin oligomerises into a ring through a membrane-bound pre-pore intermediate, and each subunit deploys
  two amphipathic beta-hairpins that span the bilayer, producing large aqueous pores of heterogeneous
  size with single-channel conductances spanning two orders of magnitude. The pores are not indiscriminate
  holes: they favour cationic cargo and pass anionic and neutral molecules poorly, which is attributed
  to an anionic lumen conserved among MACPF proteins. Their function is to deliver granzymes into the
  target cell cytosol, where granzyme proteolysis triggers the death programme. Delivery is not confined
  to the plasma membrane: membrane damage also triggers clathrin- and dynamin-dependent endocytosis that
  internalises perforin and granzymes into enlarged early endosomes, and perforin then perforates that
  endosomal membrane to release granzymes into the cytosol, so both membranes are sites of activity and
  the balance between the two routes remains debated. Perforin is the principal effector of cytotoxic
  lymphocyte killing of virus-infected and transformed cells: perforin-null mice fail to clear lymphocytic
  choriomeningitis virus and clear tumour cells poorly, and biallelic loss-of-function mutations in humans
  cause familial haemophagocytic lymphohistiocytosis type 2, in which cytotoxic T and NK cell activity
  is reduced or absent and the resulting failure to terminate immune responses produces uncontrolled lymphocyte
  and macrophage activation. Hypomorphic alleles predispose to lymphoma. Because the protein kills the
  cell it inserts into, its activity is also the target of membrane repair responses in the attacked cell.'
