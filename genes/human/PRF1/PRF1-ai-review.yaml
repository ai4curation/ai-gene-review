- molecular_function:
    id: GO:0042802
    label: identical protein binding
  description: 'Homo-oligomerisation, which for perforin is not an incidental interaction but the act
    of building the functional unit: the pore is the assembled oligomer, a ring of roughly twenty subunits,
    and monomeric perforin has no channel activity. Assembly proceeds through a membrane-bound pre-pore
    that sits atop an unperturbed bilayer before concerted insertion, and incomplete arcs can also form
    pores lined by protein on one side and lipid on the other. In cells, perforin multimerisation in the
    endosomal membrane coincides in time with release of cargo into the cytosol.'
