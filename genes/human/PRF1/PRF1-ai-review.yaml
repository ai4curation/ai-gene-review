- id: PMID:7972104
  title: A null mutation in the perforin gene impairs cytolytic T lymphocyte- and natural killer cell-mediated
    cytotoxicity.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (Proc Natl Acad Sci USA 1994;91:11571-5). The independent perforin null
      mouse line, confirming impaired CTL and NK killing. Notably reports that roughly a third of killing
      activity survives, i.e. perforin-independent lytic mechanisms also exist, which is a useful constraint
      on how strongly the cytotoxicity annotations should be read.
- id: PMID:8164737
  title: Cytotoxicity mediated by T cells and natural killer cells is greatly impaired in perforin-deficient
    mice.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'PubMed-verified (Nature 1994;369:31-7). One of the two original perforin knockout mouse
      lines. Reports the lineage-resolved phenotype used here: CD8 T cells and NK cells present in normal
      numbers but unable to lyse targets, failure to clear LCMV, and reduced clearance of fibrosarcoma
      cells. Mouse rather than human.'
- id: PMID:9756476
  title: An antimicrobial activity of cytolytic T cells mediated by granulysin.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified (Science 1998;282:121-5). Primarily a granulysin paper; perforin's role
      in it is to give granulysin access to intracellular Mycobacterium tuberculosis. Appropriate support
      for the cytolytic granule location, but a poor choice of reference for GO:0140507 granzyme-mediated
      programmed cell death, which it does not address; flagged in that row as a re-referencing suggestion.
- id: PMID:10583959
  title: Perforin gene defects in familial hemophagocytic lymphohistiocytosis.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (Science 1999;286:1957-9). Identified PRF1 mutations as the cause of
      10q21-22-linked familial haemophagocytic lymphohistiocytosis, with defective cytotoxic activity
      and little or no perforin in patient granules. The human loss-of-function evidence and the basis
      for the granule-location annotations.
- id: PMID:10779745
  title: Analysis of human V alpha 24+ CD4+ NKT cells activated by alpha-glycosylceramide-pulsed monocyte-derived
    dendritic cells.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified (J Immunol 2000;164:4458-64). An NKT-cell characterisation whose relevant
      finding is that invariant V alpha 24+ NKT cytotoxicity against U937 targets runs mainly through
      the perforin pathway. Supports perforin's role in NKT-lineage killing; a weak basis for the broad
      apoptotic process and cellular defense response rows it was used for, both of which this review
      re-levels.
- id: PMID:11179007
  title: Spectrum of perforin gene mutations in familial hemophagocytic lymphohistiocytosis.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (Am J Hum Genet 2001;68:590-7). Surveys perforin mutations across 34
      further FHL families. Cited here for its statement that cytotoxic T and NK cell activity is markedly
      reduced or absent in these patients, which is the human lineage-resolved support for the proposed
      GO:0042267 annotation. That statement sits in the paper's framing of prior work rather than being
      its own new measurement, so it is corroborative alongside the mouse knockouts rather than a standalone
      demonstration.
- id: PMID:11911826
  title: 'Cytotoxic cell granule-mediated apoptosis: perforin delivers granzyme B-serglycin complexes
    into target cells without plasma membrane pore formation.'
  reference_review:
    relevance: MEDIUM
    correctness: DISPUTED
    review_notes: 'PubMed-verified (Immunity 2002;16:417-28). Correctly cited, but the claim is contested:
      it argues that perforin and perforin-serglycin complexes deliver granzyme B-serglycin into the cytosol
      without producing detectable plasma-membrane pores, against the prevailing pore model. Marked DISPUTED
      on that basis, not because of any citation defect. Used here only as the source of the GZMB protein-binding
      row, and recorded as an open mechanistic question.'
- id: PMID:19946888
  title: Defining the membrane proteome of NK cells.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: PubMed-verified (J Mass Spectrom 2010;45:1-25). Shotgun proteomic survey of the membrane
      fraction of the YTS NK-like line. Perforin's appearance is incidental to the study and cannot resolve
      a specific membrane; adequate for a generic membrane row only.
- id: PMID:20038786
  title: Perforin activates clathrin- and dynamin-dependent endocytosis, which is required for plasma
    membrane repair and delivery of granzyme B for granzyme-mediated apoptosis.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (Blood 2010;115:1582-93). Shows perforin triggering clathrin- and dynamin-dependent
      endocytosis that clears perforin and granzymes from the plasma membrane into early endosomes, and
      that blocking it converts granzyme B death from apoptosis to necrosis. The basis for the endosomal
      locations and for protein import.
- id: PMID:20889983
  title: Human perforin employs different avenues to damage membranes.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'PubMed-verified (J Biol Chem 2011;286:2946-55). Native human perforin, which makes
      it the key biophysical reference for the human protein: single-pore conductances of 0.15-21 nS,
      absolute calcium dependence, and cryo-EM resolution of pre-pore and pore states. Performed entirely
      in model membranes (giant unilamellar vesicles, planar bilayers, liposomes), so it supports membrane
      insertion and channel properties but not, by itself, a plasma-membrane location.'
- id: PMID:21037563
  title: The structural basis for membrane binding and pore formation by lymphocyte perforin.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (Nature 2010;468:447-51). The crystal structure of monomeric perforin
      plus a cryo-EM reconstruction of the whole pore; the primary structural basis for the pore-forming
      activity, the C2 domain's calcium-dependent membrane binding, and the inside-out MACPF orientation
      relative to bacterial cholesterol-dependent cytolysins. The structural work is on murine perforin,
      which is relevant when weighing it as support for the human protein.
- id: PMID:21438968
  title: Syntaxin7 is required for lytic granule release from cytotoxic T lymphocytes.
  reference_review:
    relevance: LOW
    correctness: MISCITED
    review_notes: PubMed-verified (Traffic 2011;12:890-901). The paper is sound and its subject is Syntaxin-7,
      which it shows to be required for lytic granule release and accumulation at the immunological synapse;
      perforin appears as the antibody marker for lytic granules. Marked MISCITED with respect to the
      annotation it supports here, GO:0001771 immunological synapse formation for perforin, which the
      paper does not establish. The full text was not available in the local cache, so a curator with
      access may be able to justify the row; the review's argument against it rests on the term's definition
      and on perforin being synapse cargo, not on the paper.
- id: PMID:21685908
  title: Perforin pores in the endosomal membrane trigger the release of endocytosed granzyme B into the
    cytosol of target cells.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (Cell Death Differ 2011;18:1835-43). The direct demonstration that perforin
      forms pores in the membrane of the enlarged endosome ('gigantosome') to release endocytosed granzyme
      B into the cytosol, with multimerisation in that membrane coincident with cargo release. The evidence
      for the proposed endosome membrane annotation, and its introduction states plainly that granule
      contents are released into a synapse already formed with the target cell, which is the basis for
      rejecting the synapse-formation annotations.
- id: PMID:24088571
  title: Arf-like GTPase Arl8b regulates lytic granule polarization and natural killer cell-mediated cytotoxicity.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified (Mol Biol Cell 2013;24:3721-35). An Arl8b study in which perforin is
      the lytic-granule marker, with clean colocalisation against granzyme B and LAMP-1 and exclusion
      from EEA1-positive early endosomes. Good support for the cytolytic granule location.
- id: PMID:24558045
  title: The perforin pore facilitates the delivery of cationic cargos.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (J Biol Chem 2014;289:9172-81). Establishes that the pore is cargo-selective,
      favouring cationic molecules including human granzyme B, and attributes this to a conserved anionic
      lumen. Qualifies the channel annotation rather than merely restating it.
- id: PMID:25416956
  title: A proteome-scale map of the human interactome network.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: PubMed-verified (Cell 2014;159:1212-26). Proteome-scale binary interactome map. Supports
      only a bare protein-binding row, removed under the protein-binding policy.
- id: PMID:26306037
  title: Structural Basis for Ca2+-mediated Interaction of the Perforin C2 Domain with Lipid Membranes.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (J Biol Chem 2015;290:25213-26). NMR and crystallographic dissection
      of calcium binding by the perforin C2 domain; the direct measurement behind the calcium ion binding
      annotation.
- id: PMID:32296183
  title: A reference map of the human binary protein interactome.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: PubMed-verified (Nature 2020;580:402-408). The HuRI binary interactome map. Source of
      three bare protein-binding rows, all removed under the protein-binding policy; none of the recorded
      partners has a described relationship to perforin biology.
- id: PMID:35148176
  title: The pore conformation of lymphocyte perforin.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (Sci Adv 2022;8:eabk3147). A 4-Angstrom cryo-EM structure of the perforin
      pore and cryo-tomography of prepores on membranes; the current structural reference for the oligomeric
      pore.
- id: PMID:35705808
  title: Caspase-7 activates ASM to repair gasdermin and perforin pores.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified (Nature 2022;606:960-967). Shows caspase-7 acting downstream of perforin
      attack to activate acid sphingomyelinase and repair perforin and gasdermin pores, with the model
      that caspase-7 exits through those pores. The source, via mouse Prf1, of the protein secretion annotation
      that this review re-levels to protein transmembrane transport.
- id: Reactome:R-HSA-9851131
  title: NPM1-ALK-stimulated PRF1 gene expression
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: A Reactome gene-expression event, cited for the cytolytic granule lumen location. The
      location is correct; the Reactome entry itself concerns NPM1-ALK-driven transcription of PRF1 rather
      than the protein's localisation, so the supporting link is indirect.
core_functions:
- molecular_function:
    id: GO:0022829
    label: wide pore channel activity
  description: 'Calcium-dependent formation of a large aqueous transmembrane pore in the plasma membrane
    of a second cell, and in the membrane of the endosome into which perforin is subsequently internalised.
    Secreted perforin binds the target bilayer through its C-terminal C2 domain once calcium is bound,
    assembles into a ring via a membrane-bound pre-pore intermediate, and inserts two amphipathic beta-hairpins
    per subunit to span the membrane. The resulting channels are heterogeneous in size, with single-pore
    conductances from 0.15 to 21 nS, and are cargo-selective rather than indiscriminate, favouring cationic
    molecules including granzyme B. GO:0022829 is the term GO uses for this protein class: perforin''s
    own family members C6, C7, C8A, C8B, C8G and C9, the macrophage perforin MPEG1, and the gasdermins
    GSDMD and GSDME all carry it by direct assay. The gene also carries GO:0140911 pore-forming activity,
    which is accepted alongside it since the two terms are in unrelated branches of the ontology.'
