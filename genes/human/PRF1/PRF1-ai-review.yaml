  review:
    summary: Direct-assay row asserting that perforin participates in forming the immunological synapse,
      taken from a study of Syntaxin-7 in which perforin is the lytic-granule marker.
    action: REMOVE
    reason: 'Perforin does none of the work of forming the immunological synapse. The term''s own definition
      specifies the mechanism - clustering of signalling and adhesion molecules and their associated membrane
      rafts on both the lymphocyte and the target cell - and perforin is neither a signalling nor an adhesion
      molecule; it is a soluble granule protein that is not in the plasma membrane at all until degranulation.
      Thiery et al. state the order of events explicitly: killer cells act by releasing granule contents
      into the synapse that has already formed with the target cell. Perforin-null lymphocytes are present
      in normal numbers and conjugate with targets, and what they fail to do is lyse them, so the lesion
      is in lysis rather than in synapse assembly. This is the participation test rather than a complaint
