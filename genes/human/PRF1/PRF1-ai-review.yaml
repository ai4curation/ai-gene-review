- term:
    id: GO:0140507
    label: granzyme-mediated programmed cell death signaling pathway
  evidence_type: IDA
  original_reference_id: PMID:9756476
  qualifier: involved_in
  review:
    summary: Direct-assay row for the granzyme-mediated death pathway, cited to the granulysin antimicrobial
      paper.
    action: ACCEPT
    reason: 'Correct and core: this term names precisely perforin''s position in the killing pathway -
      it delivers the granzymes whose proteolysis triggers the target cell''s death programme. Perforin
      contributes the delivery step rather than the proteolysis, which is what the term''s definition
      accommodates, and it is the step without which the pathway does not run. The claim is not in doubt.
      The reference, however, is a poor fit for this particular term: the cited paper is about granulysin''s
      antimicrobial activity against Mycobacterium tuberculosis, where perforin''s contribution is to
      give granulysin access to intracellular bacteria, and it does not itself demonstrate granzyme-mediated
      programmed cell death. The full text is not in the local cache, so this is recorded as a re-referencing
      suggestion for a curator rather than asserted as an error; the support for the term comes from the
      other rows and from the structural and cell-biological work cited here.'
