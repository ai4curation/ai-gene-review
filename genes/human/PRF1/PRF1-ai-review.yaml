  review:
    summary: Bare protein binding recording the perforin-granzyme B association, from the study of granzyme
      B-serglycin complexes.
    action: REMOVE
    reason: 'Bare protein binding carries no functional information and is removed under the project''s
      protein-binding policy. Removal says the annotation is uninformative, not that the interaction is
      false. The partner here is GZMB (UniProtKB:P10144) and the association is functionally real and
      important - it is the cargo relationship at the heart of perforin''s job - but what matters about
      it is captured far better by the transport and cell-death annotations this review accepts (GO:0071806,
      GO:0017038, GO:0140507) than by a term that says only that two proteins touch. No more informative
      molecular function is proposed from this paper, because its actual claim cuts the other way: Metkar
      et al. argue that perforin delivers granzyme B-serglycin complexes without forming detectable plasma-membrane
      pores, a mechanism that remains contested and that the review records as an open question rather
      than as an annotation.'
    supported_by:
    - reference_id: PMID:11911826
      supporting_text: Contrary to the view that PFN acts as a gateway for granzymes through the plasma
        membrane, monomeric PFN and, strikingly, PFN-SG complexes were shown to mediate cytosolic delivery
        of macromolecular GrB-SG without producing detectable plasma membrane pores.
