- term:
    id: GO:0042267
    label: natural killer cell mediated cytotoxicity
  evidence_type: IMP
  original_reference_id: PMID:11179007
  qualifier: involved_in
  review:
    summary: Proposed annotation for the NK-cell arm of perforin-mediated killing, which the human record
      currently leaves implicit.
    action: NEW
    reason: 'The human record carries the T-cell child (GO:0001913) and the parent (GO:0001909) but not
      the NK-cell child, even though NK killing is one of the two canonical settings for perforin and
      the one in which its loss is diagnostically assayed. Participation is clear and is not a necessity
      artefact: perforin is the effector that breaches the target membrane, not a substrate of the process,
      so the question of which entity performs the step has perforin as the answer. The comparator check
      supports proposing it rather than reading the absence as a convention: GZMB, the granule effector
      in the same role as perforin, carries GO:0042267 by both IDA and IMP, and the term''s 33 human genes
      include proteins more peripheral to the killing step than perforin is - the granule-trafficking
      factors ARL8B, KIF5B and PLEKHM2 all hold it by IMP. Evidence: in FHL patients with perforin mutations
      NK activity is markedly reduced or absent, and both independent perforin knockout mouse lines show
      the NK defect specifically, with NK cells present in normal numbers but unable to lyse NK target
      cells. Offered with the caveat that the lineage-resolved demonstrations are in mouse and in patient
      cells rather than in a human cell-line assay, so a curator may prefer a different evidence code.
      Noting also that mouse Prf1 lacks this term, so the gap is not human-specific and the mouse record
      may warrant the same addition.'
    supported_by:
