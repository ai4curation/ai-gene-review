- id: file:human/CHM/CHM-source-evidence.json
  title: CHM source-linked escort, interaction, localization, donor and ontology evidence
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Authored source-scope paraphrases are separated from literal fetched fields, original
      publication access and immutable-input hashes. This is an evidence extraction artifact, not a new
      biological experiment.
core_functions:
- description: REP1 directly binds Rab proteins and escorts prenylated Rab to cellular membranes. It supplies
    substrate presentation to Rab geranylgeranyltransferase and therefore contributes to that complex
    activity without independently catalyzing geranylgeranyl transfer. GDP-release inhibition is an experimentally
    demonstrated property of the Rab-bound escort. Original reconstitution separates human, canine and
    rat assay contexts; later experiments explicitly use recombinant human REP1. The evidence does not
    establish identical activity of both current CHM products, obligatory complex stoichiometry or a universal
    in-vivo Rab recycling role.
  molecular_function:
    id: GO:0140318
    label: protein transporter activity
  contributes_to_molecular_function:
    id: GO:0004663
    label: Rab geranylgeranyltransferase activity
  directly_involved_in:
  - id: GO:0006612
    label: protein targeting to membrane
  - id: GO:0018344
    label: protein geranylgeranylation
  locations:
  - id: GO:0005829
    label: cytosol
  in_complex:
    id: GO:0005968
    label: Rab-protein geranylgeranyltransferase complex
  supported_by:
  - reference_id: PMID:7957092
    supporting_text: chaperone newly prenylated rab proteins
  - reference_id: PMID:18532927
suggested_questions:
- question: Should the original enables Rab geranylgeranyltransferase activity assertion be changed by
    curators to contributes_to, preserving REP1 accessory work while distinguishing the catalytic heterodimer?
- question: What molecular activity is carried out by the reported nuclear REP1 pool, and what assay supports
    the ancestral active-in assignment beyond localization?
- question: How do the two current human CHM products compare in Rab recognition, prenyltransferase association
    and membrane delivery?
- question: Which endogenous Rab clients depend preferentially on REP1 rather than REP2 in retinal cells,
    and how much in-vivo Rab recycling is performed by REP1 after initial prenylation?
suggested_experiments:
- hypothesis: REP1 products differ in escort efficiency or Rab-client preference.
  description: Compare sequence-verified human products in matched purified Rab-binding, GDP-release,
    prenylation-support and membrane-delivery assays, then rescue CHM-deficient retinal cells at matched
    expression with REP2 and binding-interface controls.
- hypothesis: Nuclear REP1 has a separable activity from cytosolic Rab escort.
  description: Validate endogenous nuclear localization using orthogonal antibodies and a functional endogenous
    tag, then perturb nuclear access without disrupting Rab/RGGT binding and measure nuclear interactors
    and specific biochemical outputs.
