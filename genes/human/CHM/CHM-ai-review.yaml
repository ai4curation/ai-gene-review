  id: P24386-1
- name: '2'
  id: P24386-2
  sequence_note: VSP_042817, VSP_042818
existing_annotations:
- term:
    id: GO:0004663
    label: Rab geranylgeranyltransferase activity
  evidence_type: TAS
  original_reference_id: PMID:8380507
  qualifier: enables
  review:
    summary: Retain the prenyltransferase contribution but flag the autonomous enables relation.
    action: MARK_AS_OVER_ANNOTATED
    reason: REP1 is the Rab-binding accessory component of the Rab geranylgeranyltransferase machinery.
      The catalytic heterodimer performs geranylgeranyl transfer; REP1 presents substrate and escorts
      the prenylated product. Original PMID:8380507 is accessible at abstract level, while the recovered
      full reconstitution in PMID:7957092 and human REP1 experiments in PMID:18532927 establish this distinction.
      The preserved enables relation overstates autonomous catalytic activity. A curator change to contributes_to
      is appropriate; the core records the genuine complex contribution without altering this source object
      or inventing a replacement-qualifier field.
    supported_by:
    - reference_id: PMID:8380507
    - reference_id: PMID:7957092
      supporting_text: accessory component
    - reference_id: PMID:18532927
    - reference_id: file:human/CHM/CHM-source-evidence.json
      supporting_text: The seeded enables GO:0004663 assertion is preserved. REP1 supplies substrate presentation
        and escort work, whereas the RABGGTA–RABGGTB catalytic component transfers geranylgeranyl groups;
        complex contribution is distinct from independent catalysis.
- term:
    id: GO:0005092
    label: GDP-dissociation inhibitor activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR018203
  review:
    summary: Refine GDP-release inhibition to the measured Rab-specific activity.
    action: MODIFY
    reason: The family/domain inference is not rejected because REP1 differs from conventional RabGDI.
      Figure 7 of the full primary measures time- and concentration-dependent inhibition of Rab5 GDP release
      by REP1, including both prenylated and unprenylated Rab5, with BSA and RabGDI comparisons. GO:0005093
      is the verified Rab-specific child of GO:0005092. No GTPase hydrolysis or GDP/GTP exchange catalysis
      is inferred.
    supported_by:
    - reference_id: PMID:7957092
      supporting_text: inhibit the release of GDP
    - reference_id: GO_REF:0000002
    - reference_id: file:human/CHM/CHM-source-evidence.json
      supporting_text: Original Fig. 7 measures REP1-dependent retention of Rab5-bound GDP; the BSA control
        does not reproduce it. REP1 inhibits GDP release from unprenylated Rab5 as well as the modified
        protein, unlike the conventional RabGDI comparator.
    proposed_replacement_terms:
    - id: GO:0005093
      label: Rab GDP-dissociation inhibitor activity
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      source_entities:
      - source_id: InterPro:IPR018203
        source_status: SUPPORTS_TRANSFER
        comment: The original family-domain source is compatible with the measured GDP-inhibitory activity.
          The proposed change specifies the experimentally demonstrated Rab substrate class rather than
          rejecting the family assignment.
