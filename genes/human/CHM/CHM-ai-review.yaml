id: P24386
gene_symbol: CHM
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CHM encodes Rab escort protein 1 (REP1), a soluble Rab-binding protein that couples Rab geranylgeranylation
  to membrane delivery. REP1 presents Rab substrates to the RABGGTA–RABGGTB catalytic machinery, remains
  associated with prenylated Rab products and delivers them to intracellular membranes. It also inhibits
  GDP release from Rab proteins in biochemical assays. Its defining work is substrate recognition and
  escort rather than autonomous geranylgeranyl-transfer chemistry. A cytosolic pool supports this trafficking
  cycle; nuclear localization has also been reported, with its functional significance unresolved. Loss
  of REP1 causes choroideremia, linking defective Rab processing and trafficking to retinal degeneration.
