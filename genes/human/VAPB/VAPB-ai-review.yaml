      recruitment of the partner by the VAPB MSP domain. This row aggregates seven partners (STARD3, RB1CC1, MIGA2, RMDN3,
      OSBPL1A, KCNB1, KCNB2) whose binding to VAPB depends on conventional or phospho-FFAT motifs, as shown by peptide pulldown,
      SPR and K43L mutagenesis of VAPB.
    action: MODIFY
    reason: Bare protein binding carries no functional information. For this partner the interaction is mediated by an FFAT
      (or phospho-FFAT) motif in the partner bound by the VAPB MSP domain, which is VAPB's core molecular activity. The informative
      replacement is GO:0033149 FFAT motif binding, which VAPB already carries (IDA, IMP, IPI).
    proposed_replacement_terms:
    - *id001
    supported_by:
    - &id006
      reference_id: PMID:33124732
      supporting_text: The FFAT of ORP1 efficiently pulled down VAP‐A and VAP‐B from the whole cell protein extract
    - *id002
    - &id004
      reference_id: PMID:33124732
      supporting_text: Similarly to VAP‐A K50L, VAP‐B K43L interacted with the conventional FFAT of ORP1, but not with the
        Phospho‐FFAT of STARD3, while wild‐type VAP‐B interacted equally with the two types of FFAT motifs.
