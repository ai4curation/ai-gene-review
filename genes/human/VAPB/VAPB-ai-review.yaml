suggested_questions:
- question: Which FFAT partners are VAPB-selective rather than shared with VAPA, given that the two paralogs sit in sister
    PANTHER subfamilies (SF12 vs SF155) and bind FFAT peptides with similar affinity?
- question: Is the IRE1/XBP1-potentiating activity of VAPB seen with overexpression a physiological function, or a secondary
    effect of ER membrane reorganisation?
- question: Should GO:0160214 endoplasmic reticulum-plasma membrane adaptor activity be broadened to cover protein-mediated
    bridging (FFAT binding of Kv2 channels or PITPNM1), as its definition currently requires membrane lipid binding?
- question: What is the physiological role, if any, of the cleaved and secreted VAPB MSP domain in human serum?
suggested_experiments:
- hypothesis: VAPB and VAPA have partially non-overlapping FFAT partner sets that explain the distinct ALS8 phenotype.
  description: Quantitative proximity labelling (TurboID) of endogenously tagged VAPA and VAPB in VAPA/VAPB double-knockout
    human iPSC-derived motor neurons rescued with each paralog, followed by FFAT-peptide competition, to define paralog-selective
    partners.
  experiment_type: interaction proteomics
- hypothesis: VAPB-P56S impairs ER-mitochondria Ca2+ transfer by altering PTPIP51 tethering rather than by loss of FFAT binding.
  description: Measure PTPIP51 phospho-FFAT binding affinity of purified wild-type and P56S MSP domains by SPR, and quantify
    ER-mitochondria contacts and mitochondrial Ca2+ uptake in knock-in motor neurons.
  experiment_type: biochemical and cell imaging
