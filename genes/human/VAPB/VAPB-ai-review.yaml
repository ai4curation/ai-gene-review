id: O95292
gene_symbol: VAPB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'VAPB (vesicle-associated membrane protein-associated protein B) is a ubiquitously expressed, tail-anchored protein
  of the endoplasmic reticulum membrane. Its N-terminal MSP (major sperm protein) domain faces the cytosol and binds short
  FFAT (two phenylalanines in an acidic tract) and phosphorylation-dependent phospho-FFAT motifs in partner proteins; a central
  coiled-coil and C-terminal transmembrane helix mediate homodimerisation and heterodimerisation with its paralog VAPA. By
  recruiting FFAT-bearing proteins anchored on other organelles, VAPB acts as an ER-side receptor that builds membrane contact
  sites: with PTPIP51 (RMDN3) at ER-mitochondria contacts, where it supports Ca2+ transfer; with STARD3, STARD3NL and WDR44
  at ER-endosome contacts; with OSBP/ORP proteins, CERT and FAPP1-Sac1 at ER-trans-Golgi contacts; and with Kv2 channels and
  PITPNM1 at ER-plasma membrane junctions. These contacts host non-vesicular lipid transfer (sterol, ceramide, phosphoinositides)
  carried out by the recruited partners. VAPB also modulates the IRE1/XBP1 branch of the unfolded protein response and is
  co-opted by hepatitis C virus NS5A/NS5B for viral RNA replication; a short splice isoform, VAP-C, lacks the coiled-coil
  and transmembrane region and antagonises HCV replication. The MSP domain can be cleaved and secreted and binds Eph receptors
  in vitro. Dominant missense variants in the MSP domain (P56S, T46I) cause ALS8 and late-onset spinal muscular atrophy, producing
  insoluble aggregates that trap wild-type VAPB.'
