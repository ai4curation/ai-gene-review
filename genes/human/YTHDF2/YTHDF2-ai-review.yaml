        substantial effect on SG formation (Fig. 2b and Supplementary Fig. 7d), overexpression of
        this protein also restored SG formation in YTHDF1/3 knockdown cells (Fig. 2e and
        Supplementary Fig. 9d), potentially because the effect of YTHDF2 is weak at the
        physiological concentration but substantial at elevated concentrations.
