  review:
    summary: YTHDF2 is a cytoplasmic YTH-domain m6A reader.
    action: TOO_GENERAL
    reason: Correct but broad once the review also asserts cytosol, P-body and cytoplasmic stress
      granule; the specific child terms are more informative.
    supported_by:
    - reference_id: PMID:32451507
      supporting_text: To further confirm the effect of YTHDF proteins in SG formation, we
        overexpressed individual YTHDF proteins to compensate for the effect of YTHDF1/3 knockdown.
        Overexpression of YTHDF1/3 indeed restored SG formation (Fig. 2d,e and Supplementary Figs.
        8, 9), and a higher YTHDF1 expression level correlates with a stronger SG formation
        (Supplementary Fig. 9e). Interestingly, although knocking down endogenous YTHDF2 did not
        show a substantial effect on SG formation (Fig. 2b and Supplementary Fig. 7d),
        overexpression of this protein also restored SG formation in YTHDF1/3 knockdown cells (Fig.
        2e and Supplementary Fig. 9d), potentially because the effect of YTHDF2 is weak at the
        physiological concentration but substantial at elevated concentrations.
