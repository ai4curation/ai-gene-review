id: Q9Y5A9
gene_symbol: YTHDF2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: YTHDF2 is a cytoplasmic YTHDF-family N6-methyladenosine reader that binds m6A-modified
  RNAs and promotes their degradation. It can recruit the CCR4-NOT deadenylase through CNOT1 and, in
  sequence contexts containing an HRSP12/RIDA binding site, connect methylated transcripts to RNase
  P/MRP endoribonucleolytic cleavage. YTHDF2 partitions into P-bodies and cytoplasmic stress
  granules with m6A-marked RNAs, can relocalize to the nucleus during heat shock to preserve 5' UTR
  methylation on stress-induced transcripts, and has a reported weaker activity toward
  5-methylcytosine in RNA. Developmental, stem-cell and innate immune phenotypes are downstream
  contexts of its RNA-turnover function.
