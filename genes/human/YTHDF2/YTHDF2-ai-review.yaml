- id: file:human/YTHDF2/YTHDF2-deep-research-manual.md
  title: YTHDF2 manual evidence synthesis
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Manual synthesis used after Falcon and Perplexity-lite were unavailable.
core_functions:
- molecular_function:
    id: GO:1990247
    label: N6-methyladenosine-containing RNA reader activity
  description: YTHDF2 binds m6A-marked mRNAs in the cytoplasm and promotes their decay. It routes
    methylated transcripts to P-bodies and decay factors, recruiting CCR4-NOT through CNOT1 for
    deadenylation and, on HRSP12/RIDA-compatible targets, linking bound RNAs to RNase P/MRP
    endoribonucleolytic cleavage. With YTHDF1 and YTHDF3 it also contributes redundantly to the
    shared destabilization of the m6A-modified transcript pool.
  directly_involved_in:
  - id: GO:0006402
    label: mRNA catabolic process
  - id: GO:0061157
    label: mRNA destabilization
  - id: GO:0043488
    label: regulation of mRNA stability
  locations:
  - id: GO:0005829
    label: cytosol
  - id: GO:0000932
    label: P-body
  supported_by:
  - reference_id: PMID:24284625
    supporting_text: We further establish the role of YTHDF2 in RNA metabolism, showing that binding
      of YTHDF2 results in the localization of bound mRNA from the translatable pool to mRNA decay
      sites, such as processing bodies.
  - reference_id: PMID:27558897
    supporting_text: We further show that YTHDF2 recruits the CCR4-NOT complex through a direct
      interaction between the YTHDF2 N-terminal region and the SH domain of the CNOT1 subunit, and
      that this recruitment is essential for the deadenylation of m(6)A-containing RNAs by CAF1 and
      CCR4.
  - reference_id: PMID:30930054
    supporting_text: HRSP12 functions as an adaptor to bridge YTHDF2 and RNase P/MRP, eliciting
      rapid degradation of YTHDF2-bound RNAs.
  - reference_id: PMID:32492408
    supporting_text: Instead, the DF paralogs act redundantly to mediate mRNA degradation and
      cellular differentiation.
suggested_questions:
- question: Which YTHDF2 targets are routed through CCR4-NOT deadenylation versus HRSP12/RNase P/MRP
    cleavage, and does the route depend only on the HRSP12 motif around the m6A site?
  experts:
  - RNA decay
  - Epitranscriptomics
- question: Is the reported C5-methylcytidine RNA reader activity physiologically meaningful for
    endogenous YTHDF2, given that its affinity for m5C is much lower than for m6A?
  experts:
  - Analytical nucleic acid chemistry
  - Structural biology of RNA readers
suggested_experiments:
- hypothesis: YTHDF2 uses separable sequence and cofactor rules to choose CCR4-NOT deadenylation or
    HRSP12/RNase P/MRP cleavage for individual m6A transcripts.
  description: Combine YTHDF2 iCLIP, HRSP12 iCLIP, CNOT1 proximity labeling and 5' monophosphate end
    mapping after acute YTHDF2, CNOT1 and HRSP12 depletion in the same cell type, then test
    motif-swapped reporters with single engineered m6A sites.
  experiment_type: acute depletion with iCLIP and end-mapping RNA-seq
