suggested_questions:
- question: How should the explicit C3a GO-CAM chemokine/leukocyte-chemotaxis placements be reconciled
    with the original negative PMID:342601 abstract and its correction, and with modern C3AR1
    ligand assays?
- question: Which defined ASP/C3a-desArg preparations and receptor-expression conditions explain
    the conflicting C5L2/C5AR2 binding reports, and do any directly establish G-protein signaling?
- question: Can the exact PTN000151285 PAINT release and individual C3 exosome/microparticle or
    viral-gp13 target assays be retrieved to resolve the remaining source-specific uncertainty?
