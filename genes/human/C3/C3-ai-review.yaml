core_functions:
- description: C3b attaches to target surfaces through its exposed thioester and binds complement
    partners to assemble and regulate convertases. C3b-containing fragments also present recognition
    ligands that promote phagocytic engulfment. This nonenzymatic complement-effector unit serves
    several activation pathways, including the GZMK pathway; Bb or activated C2 supplies convertase
    proteolysis.
