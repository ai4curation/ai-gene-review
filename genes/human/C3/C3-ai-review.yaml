id: P01024
gene_symbol: C3
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: C3 is a secreted central component of the complement system whose proteolytic and
  chemical processing creates functionally distinct effectors. Activated C3b uses an internal
  thioester to attach covalently to nearby surfaces, provides a nonenzymatic platform for complement
  convertases, and marks targets for recognition by complement receptors. Further processing produces
  iC3b and C3d-containing fragments that connect opsonic recognition to phagocytes and B-cell
  co-receptors. Soluble C3a activates the G-protein-coupled receptor C3AR1 and elicits context-dependent
  inflammatory responses. These activities support microbial defense and removal or remodeling
  of tagged material; complement-dependent neural pruning and metabolic effects of the distinct
  C3a-desArg product depend on experimental and tissue context.
