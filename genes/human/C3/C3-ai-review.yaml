- term:
    id: GO:0004866
    label: endopeptidase inhibitor activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR001599
  - InterPro:IPR002890
  review:
    summary: Reject inhibitor activity propagated through shared macroglobulin domains onto complement
      C3.
    action: REMOVE
    reason: The IPR001599/IPR002890 hits identify shared macroglobulin architecture, not the functional
      specificity of every member. Primary structural descriptions distinguish the complement
      anaphylatoxin segment from the protease-cleavable bait sequence of alpha-macroglobulin inhibitors.
      In the inhibitor mechanism, cleavage triggers steric trapping of the attacking protease;
      C3 instead exposes its thioester for attachment to complement-activating surfaces. The human
      C3 experiments in PMID:6903192 directly support that surface-attachment chemistry and convertase
      assembly, while PMID:39914456 supports its complement-platform role. The domain-based inhibitor
      transfer therefore crosses a documented functional divergence and should be removed. This
      rejects this electronic mapping rather than proving that C3 cannot affect any protease under
      any condition. It does not depend on a claim that the unavailable historical PAINT node
      explicitly excluded C3, nor on treating an inherited domain name as proof of a functional
      bait sequence.
    supported_by:
    - reference_id: PMID:6903192
    - reference_id: PMID:39914456
    propagation_review:
      root_cause: PROPAGATION_BAD
      source_entities:
      - source_id: InterPro:IPR001599
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: The shared macroglobulin domain is a genuine structural match. Inhibitory function
          of bait-cleavage/protease-trapping family members does not transfer to the complement
          surface-attachment mechanism of C3.
      - source_id: InterPro:IPR002890
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: The shared macroglobulin domain is a genuine structural match. Inhibitory function
          of bait-cleavage/protease-trapping family members does not transfer to the complement
          surface-attachment mechanism of C3.
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
