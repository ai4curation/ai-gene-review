id: Q6UX04
gene_symbol: CWC27
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CWC27 (NY-CO-10/SDCCAG10) is a nuclear spliceosomal pseudoenzyme with an N-terminal cyclophilin-like
  domain and a long C-terminal interaction region. It participates in major and minor pre-mRNA splicing
  as a transient component of activated spliceosomes, contacting the endonuclease-like domain of PRP8
  and leaving during spliceosome activation. Its C-terminal region binds the splicing factor CWC22 and
  stabilizes a CWC22–EIF4A3 assembly associated with exon junction complex recruitment. Human-cell association
  studies also connect CWC27 to assembled EJC components, within a recruitment network that can engage
  EIF4A3 before spliceosome activation. CWC27 depletion disrupts splicing in human retinal pigment epithelial
  cells. The full-length 472-residue product binds CWC22; the 390-residue splice product lacks most of
  the C-terminal interaction region. Biallelic disruptive variants cause retinal degeneration with or
  without additional developmental anomalies.
