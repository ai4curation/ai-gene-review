proposed_new_terms: []
suggested_questions:
- question: Does the cyclophilin domain perform a noncatalytic folding or chaperone function distinct
    from its demonstrated peptide binding and absence of activity on the tested tetrapeptides?
- question: What preparation or stage dependence accounts for the target-positive post-first-step C-complex
    mass spectrometry versus the loss of CWC27 during Bact activation in later structures?
- question: Which EJC recruitment events require CWC27 itself, and how do the early CWC27-independent
    associations and the CWC27–CWC22 pathway contribute in different transcript contexts?
- question: What endogenous functions and expression contexts belong to the 390-residue splice product
    that fails recombinant CWC22 retention?
- question: Should GO distinguish pre-branching major and minor activated Bact complexes beneath GO:0005684
    and GO:0005689 from the catalytically active or post-first-cleavage states? The source preparations
    resolve this distinction, but the word activated is already used in synonyms for existing catalytic
    terms.
suggested_experiments:
- description: Compare endogenous CWC27 occupancy across matched major and minor spliceosomal preparations
    with RNA-stage measurements and isoform-resolving peptides, separating enrichment purity from protein
    stoichiometry.
- description: Use matched depletion/rescue of the official full-length and 390-residue products, CWC22-binding
    mutants and cyclophilin-domain mutants to distinguish splicing, protein-stabilization and EJC-deposition
    effects.
- description: Test purified CWC27 domains in noncatalytic folding or anti-aggregation assays with defined
    substrates and controls, separately from the established tetrapeptide isomerase assays.
