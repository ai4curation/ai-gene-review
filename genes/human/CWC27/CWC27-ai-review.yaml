  description: The displayed 472-residue product, independently matched to the official FASTA. Full-length
    human CWC27 and its C-terminal fragments bind CWC22 in PMID:32329775; this interaction is noncatalytic.
    Structural complex preparations do not resolve every detected molecule to this product.
- name: '2'
