core_functions:
- description: CWC27 contributes to major and minor pre-mRNA splicing through noncatalytic contacts in
    the spliceosome and direct CWC22 binding. Its C-terminal region binds CWC22 and stabilizes a CWC22–EIF4A3
    complex; the full-length 472-residue product supports this interaction, whereas the tested 390-residue
    splice product does not. Human co-association and inhibitor experiments additionally support a CWC27–CWC22
    recruitment module associated with EIF4A3 and EJC components, without establishing direct CWC27–EIF4A3
    binding or a single obligatory recruitment route. Stage-resolved structures place CWC27 predominantly
    in Bact, with release during activation; its detection in an older post-first-step preparation remains
    a context-dependent observation. No intrinsic RNA-cleavage or PPIase catalytic activity is assigned.
  supported_by:
  - reference_id: PMID:29360106
  - reference_id: PMID:33509932
  - reference_id: PMID:32329775
    supporting_text: this isoform (CWC27-iso2) is not retained by CBP-CWC22-S whether or not eIF4A3 is
      added
  - reference_id: PMID:42635127
    supporting_text: PB did not decrease the co-IP of CWC27 and CWC22 with EIF4A3
  - reference_id: PMID:11991638
