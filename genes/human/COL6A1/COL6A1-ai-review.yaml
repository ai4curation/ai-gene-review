- id: PMID:2551668
  title: Sequence analysis of alpha 1(VI) and alpha 2(VI) chains of human type VI
    collagen reveals internal triplication of globular domains similar to the A domains
    of von Willebrand factor and two alpha 2(VI) chain variants that differ in the
    carboxy terminus.
  findings:
  - statement: The mature human alpha1(VI) and alpha2(VI) chains are 1009 and 998 residues,
      determined by cDNA sequencing and Edman degradation.
    supporting_text: Amino acid sequences of human collagen alpha 1(VI) and alpha 2(VI) chains
      were completed by cDNA sequencing and Edman degradation demonstrating that the mature
      polypeptides contain 1009 and 998 amino acid residues respectively.
    reference_section_type: ABSTRACT
  - statement: Each chain has N-terminal and C-terminal globular domains joined by a 335-336
      residue triple-helical segment, the architecture of a collagen VI subunit.
    supporting_text: Both chains show 31% identity in the N-terminal (approximately 235 residues)
      and C-terminal (approximately 430 residues) globular domains which are connected by a triple
      helical segment (335-336 residues).
    reference_section_type: ABSTRACT
  - statement: The globular domains resemble the collagen-binding A domains of von Willebrand
      factor and contact triple-helical segments during microfibril formation, which is the
      structural basis of the chain's matrix role.
    supporting_text: Since the globular domains of collagen VI come into close contact with triple
      helical segments during the formation of tissue microfibrils it suggests that the globular
      domains bind to collagenous structures in a manner similar to the binding of vWF to collagen
      I.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Original PMC scanned pages were recovered and read in the bounded
      core consultation. Human fibroblast/placental sequence and human-amnion peptide
      work establish target identity; canonical stoichiometry is background. The two
      C-terminal variants are alpha2(VI), not COL6A1.
