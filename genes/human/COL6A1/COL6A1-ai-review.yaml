- id: PMID:20551380
  title: Proteomics characterization of extracellular space components in the human
    aorta.
  findings:
  - statement: Human aortic extracellular proteins were enriched by decellularization, solubilized
      and deglycosylated before mass spectrometry, giving 103 extracellular proteins including
      alpha1(VI).
    supporting_text: The approach is based on (a) effective decellularization to enrich for scarce
      extracellular proteins, (b) successful solubilization and deglycosylation of ECM proteins,
      and (c) relative estimation of protein abundance using spectral counting.
    reference_section_type: ABSTRACT
  - statement: One third of the 103 extracellular proteins identified had not previously been
      reported in vascular proteomics, so this is a composition survey rather than a functional
      assay.
    supporting_text: Our three-step extraction approach resulted in the identification of 103
      extracellular proteins of which one-third have never been reported in the proteomics
      literature of vascular tissues.
