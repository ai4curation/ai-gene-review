  review:
    summary: Rising COL6A1 abundance during osteoblast induction is an expression correlate, not a
      demonstrated step that alpha1(VI) performs in differentiation.
    action: MARK_AS_OVER_ANNOTATED
    reason: Human hMSC-TERT membrane proteomics measures increased COL6A1 abundance
      during calcitriol-induced osteoblast differentiation; the displayed collagen
      immunofluorescence assays type I, not VI. This is positive evidence for differentiation-associated
      matrix remodeling, but the source-specific osteoblast-process attribution is
      stronger than the demonstrated COL6A1 function. Mark the process annotation
      as over-annotated while retaining the genuine HDA observation. A structural
      matrix contribution remains plausible; the unresolved mechanism belongs in the
      biological questions, and no requirement for intrinsic cell-fate control is
      imposed.
