id: P12109
gene_symbol: COL6A1
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: COL6A1 encodes the alpha1 chain of collagen VI, a secreted extracellular
  matrix protein with a short triple-helical region flanked by von Willebrand factor
  A domains. Alpha1(VI) assembles with other collagen VI chains into triple-helical
  units that form disulfide-linked dimers and tetramers and extracellular beaded microfibrils.
  The canonical complex contains alpha1(VI), alpha2(VI) and alpha3(VI); alternative
  long chains support additional assembly contexts. Collagen VI provides matrix architecture
  around cells and connects tissue mechanics with cell adhesion and survival. Pathogenic
  COL6A1 variants cause collagen VI-related muscular dystrophies, including Bethlem
  and Ullrich phenotypes.
