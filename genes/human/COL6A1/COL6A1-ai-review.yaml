      connective tissues, including cartilage, bone, tendon, muscles and cornea, where it forms
      abundant and structurally unique microfibrils organized into different suprastructural
      assemblies.
    reference_section_type: ABSTRACT
  - statement: The canonical collagen VI trimer is built from the three genetically distinct
      chains alpha1(VI), alpha2(VI) and alpha3(VI) encoded by COL6A1, COL6A2 and COL6A3.
    supporting_text: Three genetically distinct collagen VI chains, α1(VI), α2(VI) and α3(VI),
      encoded by the COL6A1. COL6A2 and COL6A3 genes, were first described more than 20 years ago.
    reference_section_type: ABSTRACT
  - statement: Collagen VI is most abundant in the interstitial matrix and is often found in close
      association with basement membranes, which is why both locations are annotated.
    supporting_text: The precise role of collagen VI is not clearly defined although it is most
      abundant in the interstitial matrix of tissues and often found in close association with
      basement membranes.
