  title: Integral and associated lysosomal membrane proteins.
  findings:
  - statement: Proteomic analysis of membranes purified from human placental lysosomes identified
      58 known lysosomal membrane proteins, establishing the fraction's identity.
    supporting_text: In membranes purified from placental lysosomes, we identified 58 proteins,
      known to reside at least partially in the lysosomal membrane.
