- id: PMID:16210410
  title: Differential expression profiling of membrane proteins by quantitative proteomics
    in a human mesenchymal stem cell line undergoing osteoblast differentiation.
  findings:
  - statement: Quantitative membrane proteomics compared a human mesenchymal stem cell line before
      and after short-term osteoblast induction, the experiment that reports increased COL6A1
      abundance.
    supporting_text: Thus, we used MS to characterize changes in expression of membrane protein
      markers before and after short-term induction of osteoblast (OB) differentiation in a cell
      model of hMSCs established by overexpression of human telomerase reverse-transcriptase gene.
    reference_section_type: ABSTRACT
  - statement: Apart from alkaline phosphatase, protein-level and transcript-level changes during
      osteoblast differentiation were discordant, which underlines that abundance change is not a
      functional role.
    supporting_text: However, with the exception of ALP, no concordance was detected between the
      changes in levels of gene and protein expression during OB differentiation.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Original indexed Wiley human hMSC-TERT membrane-fraction Methods,
      Results, COL6A1 table row and Discussion were read separately from the preserved
      abstract cache. Type I immunofluorescence is not a type VI image. Positive expression/fraction
      association is clear; a performed osteoblast-differentiation step is unresolved.
