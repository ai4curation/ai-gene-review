  - statement: Individually expressed recombinant alpha1(VI) and alpha2(VI) chains appear mainly
      as monomers and dimers linked through their C-terminal globular domains, so a single chain
      does not form a triple helix on its own.
    supporting_text: Both chains showed a distinct affinity for heparin but failed to bind to
      various collagen types.
    reference_section_type: ABSTRACT
  - statement: Both chains bind heparin but neither bound the collagen types tested, so alpha1(VI)
      collagen binding is specific to collagen VI partners rather than general.
    supporting_text: Both chains appeared mainly as monomers together with some dimers that were
      disulfide linked through their C-terminal globular domains.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Original author-uploaded indexed Methods/Results read in the core
      consultation. Isolated human alpha1 and alpha2 chains differ in the solid-phase
      ligand panel; both bind heparin-Sepharose. Isolated non-triple-helical-chain
      assays do not disprove multichain coassembly. A listed erratum text was not
      recovered; its scope is not claimed. Normal abstract remains unchanged.
- id: PMID:31837950
  title: Collagen VI Deficiency Results in Structural Abnormalities in the Mouse Lung.
  findings:
  - statement: Collagen VI is present throughout the basement-membrane region of mouse lung
      tissue, which supports the basement-membrane location.
    supporting_text: We confirmed the presence of COL6 throughout the basement membrane region of
      mouse lung tissue.
    reference_section_type: ABSTRACT
  - statement: Col6a1-null mice show alveolar and airway abnormalities with larger and fewer
      alveoli, a tissue-architecture consequence of losing the collagen VI matrix.
    supporting_text: The Col6a1-/- mouse displayed histopathologic alveolar and airway
      abnormalities.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Actual mouse lung Methods/Results and collagen VI localization/antibody-control
      passages read, including basal epithelial/subendothelial distribution. Tissue
      architecture/injury responses are not an isolated molecular catalytic assay.
- id: PMID:28604699
  title: CMG2/ANTXR2 regulates extracellular collagen VI which accumulates in hyaline
    fibromatosis syndrome.
  findings:
  - statement: CMG2/ANTXR2 regulates collagen VI homeostasis, so collagen VI turnover depends on a
      separate receptor rather than on an activity of the chain itself.
    supporting_text: Here we show that CMG2 is an important regulator of collagen VI homoeostasis.
    reference_section_type: ABSTRACT
  - statement: Loss of CMG2 function causes collagen VI to accumulate in patients and form
      subcutaneous nodules, the degradative route behind the lysosome annotation.
    supporting_text: CMG2 loss of function promotes accumulation of collagen VI in patients,
      leading in particular to nodule formation.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Actual collagen VI binding and uptake/degradation Methods/Results
      read. Binding reagent is pepsinized human-tissue collagen VI; the gifted uptake
      tetramers have unspecified species. Human RPE1/patient-fibroblast lysosomal
      cargo evidence is retained without relabeling every preparation as mouse or
      human.
- id: PMID:22024752
  title: Physical exercise stimulates autophagy in normal skeletal muscles but is
    detrimental for collagen VI-deficient muscles.
  findings:
  - statement: Impaired autophagic flux in Col6a1-null mice leads to accumulation of dysfunctional
      mitochondria and altered sarcoplasmic reticulum, so the sarcoplasmic-reticulum phenotype is
      a downstream effect of matrix loss rather than a site where alpha1(VI) resides.
    supporting_text: Impairment of the autophagic flux in collagen VI null (Col6a1–/–) mice causes
      accumulation of dysfunctional mitochondria and altered sarcoplasmic reticulum, leading to
      apoptosis and degeneration of muscle fibers.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Actual mouse knockout muscle ultrastructure and physiological Methods/Results
      read in the localization consultation. SR dilation is pathology; a target-protein
      SR localization experiment is not established by that result.
- id: PMID:20716577
  title: Oxidative stress by monoamine oxidases is causally involved in myofiber damage
    in muscular dystrophy.
  findings:
  - statement: Oxidation of myofibrillar proteins was detected in Col6a1-null and mdx muscle, so
      the myofibril phenotype is oxidative damage downstream of matrix loss rather than evidence
      that alpha1(VI) is a myofibril component.
    supporting_text: Indeed, oxidation of myofibrillar proteins, as probed by formation of
      disulphide cross-bridges in tropomyosin, was detected in both Col6a1(-/-) and mdx muscles.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Recovered original author-uploaded indexed Methods/Results read
      in the localization consultation. Mouse tropomyosin oxidation, MAO and contractile
      phenotypes do not establish COL6A1 localization within myofibrils. Original
      normal abstract and failed publisher access are preserved.
- id: PMID:16810681
  title: Developmental regulation of biglycan expression in muscle and tendon.
  findings:
  - statement: Collagen VI colocalizes with biglycan in tendon at embryonic day 18, the basis of
      the cell-surface and sarcolemma-adjacent localization.
    supporting_text: Finally, at E18 collagen VI colocalizes with biglycan in tendon.
    reference_section_type: ABSTRACT
  - statement: Biglycan binds collagen VI, and collagen VI mutations cause a congenital muscular
      dystrophy that also features connective-tissue abnormalities.
    supporting_text: Biglycan also binds to collagen VI, mutations of which cause a congenital
      muscular dystrophy (Ullrich's; UCMD) that is also characterized by connective tissue
      abnormalities.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Complete authentic abstract concerns biglycan/muscle development,
      including collagen VI context. Exact mouse same-term sarcolemma record is verified,
      but full original localization image/Methods were not recovered. GO sarcolemma
      includes extracellular covering matrix.
  full_text_unavailable: true
- id: PMID:24357721
  title: Annexin A2 mediates secretion of collagen VI, pulmonary elasticity and apoptosis
    of bronchial epithelial cells.
  findings:
  - statement: In annexin A2-null fibroblasts collagen VI is retained within intracellular
      vesicles instead of being secreted, which is the basis of the intracellular-vesicle
      localization.
    supporting_text: In vitro, AnxA2(-/-) fibroblasts retained COL6 within intracellular vesicles
      and adhered poorly to their matrix unless ANXA2 expression was restored.
    reference_section_type: ABSTRACT
  - statement: Collagen VI anchors cells to basement membranes and, unlike other collagens,
      multimerizes before secretion, which is why its secretory route involves large vesicles.
    supporting_text: COL6 serves to anchor cells to basement membranes and, unlike other
      collagens, undergoes multimerization prior to secretion.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Authentic full PMC HTML was recovered in the localization consultation.
      Actual mouse bronchial epithelial immunogold, microsome, VAMP2 and mouse Col6a1-GFP
      secretion assays were read, distinguishing WT vesicle presence from KO accumulation.
      No selected-cache rewrite.
- id: PMID:21037586
  title: Autophagy is defective in collagen VI muscular dystrophies, and its reactivation
    rescues myofiber degeneration.
  findings:
  - statement: Skeletal muscle of Col6a1-null mice has impaired autophagic flux with reduced
      beclin-1 and Bnip3 induction, a downstream consequence of losing the collagen VI matrix.
    supporting_text: Skeletal muscles of collagen VI-knockout (Col6a1(-/-)) mice had impaired
      autophagic flux, which matched the lower induction of beclin-1 and BCL-2/adenovirus
      E1B-interacting protein-3 (Bnip3) and the lack of autophagosomes after starvation.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete original abstract reports mouse collagen VI deficiency,
      altered autophagy/myofiber integrity and rescue, with human biopsy context.
      Full original Methods were not recovered; no direct COL6A1 autophagy-enzyme
      activity is inferred.
  full_text_unavailable: true
- id: PMID:34992716
  title: Multiple Mechanisms Converging on Transcription Factor EB Activation by the
    Natural Phenol Pterostilbene.
  findings:
  - statement: Pterostilbene improved function in a zebrafish model of collagen VI-related
      myopathy, which concerns a pharmacological rescue of the disease phenotype rather than a
      COL6A1 molecular activity.
    supporting_text: Pt afforded significant functional improvements in a zebrafish embryo model
      of ColVI-related myopathy, a pathology which also involves defective autophagy.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Actual zebrafish col6a1 morpholino and rescue Methods/Results, muscle
      birefringence/motility and TFEB-context passages were read. This is a direct
      vertebrate muscle perturbation study, not a human COL6A1 catalytic assay.
core_functions:
- description: Alpha1(VI) supplies structural elements of collagen VI trimers and
    higher-order beaded microfibrils, helping organize the extracellular matrix around
    cells. Around skeletal muscle fibers, the collagen VI network provides a structural
    connection to surrounding matrix; this anchoring context is integrated with its
    matrix role rather than assigned a separate catalytic activity. Canonical alpha1/alpha2/alpha3
    assembly is distinct from experimentally secreted alpha1/alpha2/mouse-alpha4 constructs.
    VWA-domain interactions and chain assembly are integrated into this structural
    role; the chain is not the enzyme that modifies or degrades collagen. Isolated-chain
    ligand behavior, growth-factor binding and intracellular cargo observations remain
    contextual rather than separate universal core activities.
  molecular_function:
    id: GO:0005201
    label: extracellular matrix structural constituent
  in_complex:
    id: GO:0005589
    label: collagen type VI trimer
  locations:
  - id: GO:0031012
    label: extracellular matrix
  supported_by:
  - reference_id: PMID:2551668
    supporting_text: Since the globular domains of collagen VI come into close contact with triple
      helical segments during the formation of tissue microfibrils it suggests that the globular
      domains bind to collagenous structures in a manner similar to the binding of vWF to collagen
      I.
    reference_section_type: ABSTRACT
  - reference_id: PMID:18400749
    supporting_text: In cell transfection and immunoprecipitation experiments, mouse
      alpha4(VI)N6-C2 chain co-assembled with endogenous alpha1(VI) and alpha2(VI) chains to form
      trimeric collagen VI molecules that were secreted from the cell.
    reference_section_type: ABSTRACT
  - reference_id: PMID:23869615
    supporting_text: Collagen VI is a component of the extracellular matrix of almost all
      connective tissues, including cartilage, bone, tendon, muscles and cornea, where it forms
      abundant and structurally unique microfibrils organized into different suprastructural
      assemblies.
    reference_section_type: ABSTRACT
  - reference_id: PMID:8168508
    supporting_text: Both chains appeared mainly as monomers together with some dimers that were
      disulfide linked through their C-terminal globular domains.
    reference_section_type: ABSTRACT
  - reference_id: PMID:22024752
    supporting_text: Impairment of the autophagic flux in collagen VI null (Col6a1–/–) mice causes
      accumulation of dysfunctional mitochondria and altered sarcoplasmic reticulum, leading to
      apoptosis and degeneration of muscle fibers.
    reference_section_type: ABSTRACT
suggested_questions:
- question: Which human tissues contain alpha1/alpha2 trimers with alternative long
    collagen VI chains, and how do these assemblies differ from canonical alpha1/alpha2/alpha3
    microfibrils?
- question: Which alpha1(VI) domains contribute to PDGF retention in native matrix,
    and how does this compare with binding by isolated chains or modified collagen
    preparations?
- question: What proportions of intracellular or vesicle-associated COL6A1 represent
    secretory precursors, endocytosed intact assemblies or degradation fragments?
- question: Does collagen VI itself contribute a defined matrix-dependent step to
    osteoblast or endoderm differentiation beyond the observed expression change?
- question: How does extracellular collagen VI architecture influence muscle autophagy
    and contractile integrity without requiring the collagen chain to reside in SR
    or myofibrils?
suggested_experiments:
- description: Reconstitute sequence-defined human alpha1/alpha2 with each long-chain
    partner, and separately measure trimer composition, disulfide-linked oligomers,
    secretion and extracellular microfibril architecture.
  hypothesis: Alternative long chains alter higher-order assembly without changing
    the basic structural contribution of alpha1(VI).
- description: Combine domain-specific pulse-chase imaging, extracellular labeling
    and protease protection with intact-chain mass spectrometry in secretory and uptake
    models.
  hypothesis: Intracellular COL6A1 signals comprise distinguishable precursor, uptake
    and degradation pools.
- description: Perturb COL6A1 and rescue with sequence-defined assembled collagen
    VI in the original osteoblast/endoderm induction systems while controlling matrix
    abundance and receptor engagement.
  hypothesis: Expression changes can be separated from a matrix-performed differentiation
    step.
- description: Measure PDGF binding to purified human alpha1(VI), defined heterotrimers
    and microfibrils with matched preparation and competition controls.
  hypothesis: Growth-factor retention depends on chain assembly and accessible domains
    rather than a single pooled collagen affinity.
status: DRAFT
