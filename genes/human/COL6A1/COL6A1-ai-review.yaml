core_functions:
- description: Alpha1(VI) supplies structural elements of collagen VI trimers and
    higher-order beaded microfibrils, helping organize the extracellular matrix around
    cells. Around skeletal muscle fibers, the collagen VI network provides a structural
    connection to surrounding matrix; this anchoring context is integrated with its
    matrix role rather than assigned a separate catalytic activity. Canonical alpha1/alpha2/alpha3
    assembly is distinct from experimentally secreted alpha1/alpha2/mouse-alpha4 constructs.
    VWA-domain interactions and chain assembly are integrated into this structural
    role; the chain is not the enzyme that modifies or degrades collagen. Isolated-chain
    ligand behavior, growth-factor binding and intracellular cargo observations remain
    contextual rather than separate universal core activities.
  molecular_function:
    id: GO:0005201
    label: extracellular matrix structural constituent
  in_complex:
    id: GO:0005589
    label: collagen type VI trimer
  locations:
  - id: GO:0031012
    label: extracellular matrix
  supported_by:
  - reference_id: PMID:2551668
    supporting_text: Since the globular domains of collagen VI come into close contact
      with triple helical segments during the formation of tissue microfibrils
    reference_section_type: ABSTRACT
  - reference_id: PMID:18400749
    supporting_text: trimeric collagen VI molecules that were secreted from the cell
    reference_section_type: ABSTRACT
  - reference_id: PMID:23869615
    supporting_text: Collagen VI is a component of the extracellular matrix of almost
      all connective tissues, including cartilage, bone, tendon, muscles and cornea,
      where it forms abundant and structurally unique microfibrils organized into
      different suprastructural assemblies.
    reference_section_type: ABSTRACT
  - reference_id: PMID:8168508
    supporting_text: Both chains appeared mainly as monomers together with some dimers
      that were disulfide linked through their C-terminal globular domains.
    reference_section_type: ABSTRACT
  - reference_id: PMID:22024752
    supporting_text: we found that defective activation of the autophagic machinery
      plays a key role in the pathogenesis of muscular dystrophies linked to collagen
      VI
    reference_section_type: ABSTRACT
suggested_questions:
- question: Which human tissues contain alpha1/alpha2 trimers with alternative long
    collagen VI chains, and how do these assemblies differ from canonical alpha1/alpha2/alpha3
    microfibrils?
- question: Which alpha1(VI) domains contribute to PDGF retention in native matrix,
    and how does this compare with binding by isolated chains or modified collagen
    preparations?
- question: What proportions of intracellular or vesicle-associated COL6A1 represent
    secretory precursors, endocytosed intact assemblies or degradation fragments?
- question: Does collagen VI itself contribute a defined matrix-dependent step to
    osteoblast or endoderm differentiation beyond the observed expression change?
- question: How does extracellular collagen VI architecture influence muscle autophagy
    and contractile integrity without requiring the collagen chain to reside in SR
    or myofibrils?
suggested_experiments:
- description: Reconstitute sequence-defined human alpha1/alpha2 with each long-chain
    partner, and separately measure trimer composition, disulfide-linked oligomers,
    secretion and extracellular microfibril architecture.
  hypothesis: Alternative long chains alter higher-order assembly without changing
    the basic structural contribution of alpha1(VI).
- description: Combine domain-specific pulse-chase imaging, extracellular labeling
    and protease protection with intact-chain mass spectrometry in secretory and uptake
    models.
  hypothesis: Intracellular COL6A1 signals comprise distinguishable precursor, uptake
    and degradation pools.
- description: Perturb COL6A1 and rescue with sequence-defined assembled collagen
    VI in the original osteoblast/endoderm induction systems while controlling matrix
    abundance and receptor engagement.
  hypothesis: Expression changes can be separated from a matrix-performed differentiation
    step.
- description: Measure PDGF binding to purified human alpha1(VI), defined heterotrimers
    and microfibrils with matched preparation and competition controls.
  hypothesis: Growth-factor retention depends on chain assembly and accessible domains
    rather than a single pooled collagen affinity.
status: DRAFT
