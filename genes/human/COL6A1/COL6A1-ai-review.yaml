- id: PMID:18400749
  title: Three novel collagen VI chains, alpha4(VI), alpha5(VI), and alpha6(VI).
  findings:
  - statement: The newly identified alpha4(VI) chain co-assembles with endogenous alpha1(VI) and
      alpha2(VI) into trimeric collagen VI molecules that are secreted, a direct demonstration
      that alpha1(VI) binds other collagen VI chains.
    supporting_text: In cell transfection and immunoprecipitation experiments, mouse
      alpha4(VI)N6-C2 chain co-assembled with endogenous alpha1(VI) and alpha2(VI) chains to form
      trimeric collagen VI molecules that were secreted from the cell.
    reference_section_type: ABSTRACT
  - statement: Antibodies to a collagen VI chain stain the extracellular matrix of human skeletal
      and cardiac muscle, lung and the territorial matrix of articular cartilage.
    supporting_text: Antibodies to the alpha6(VI) chain stained the extracellular matrix of human
      skeletal and cardiac muscle, lung, and the territorial matrix of articular cartilage.
    reference_section_type: ABSTRACT
  - statement: The alpha4(VI)N6-C2 construct carries all the elements needed for trimerization
      with alpha1(VI) and alpha2(VI), whereas alpha5(VI) and alpha6(VI) constructs accumulated
      intracellularly instead.
    supporting_text: We conclude that the alpha4(VI)N6-C2 chain contains all the elements
      necessary for trimerization with alpha1(VI) and alpha2(VI).
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Original author-uploaded indexed full Methods/Results and Figure
      9 legends were read in the bounded core consultation. Human SaOS-2 alpha1/alpha2
      associate with mouse alpha4 N6–C2; alpha3 is absent from that assembly. No full
      local-PDF claim; selected normal abstract is preserved.
