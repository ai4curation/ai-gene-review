  evidence_type: IDA
  original_reference_id: PMID:39603239
  qualifier: involved_in
  review:
    summary: PNUTS-PP1 promotes RNAPII pause release / transition into productive elongation.
    action: ACCEPT
    reason: Within PNUTS-PP1, PPP1CA dephosphorylates CDK9, MEPCE, NCBP1, SUPT6H and other pausing regulators,
      promoting release of promoter-proximally paused RNAPII. PPP1CA performs the catalytic step, so it
      participates directly. Two independent 2024 studies agree. GO has no dedicated pause-release term;
      the curators chose promoter clearance (transition from initiation to elongation) alongside positive
      regulation of elongation, which is defensible.
    supported_by:
    - &id010
      reference_id: PMID:39603239
      supporting_text: Here, we discover that the mouse PNUTS-PP1 phosphatase complex plays an essential
        role in controlling transcription pause release
