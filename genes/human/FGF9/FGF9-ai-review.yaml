  review:
    summary: FGF9 is a secreted extracellular ligand.
    action: ACCEPT
    reason: The positive PAINT ancestry is consistent with human secretion experiments. The explicit PMID:8321227
      abstract reports secretion from transfected COS cells; recovered original Results around Figure 5 characterize
      mitogenic CHO-derived secreted products. The non-cleaved secretion signal is compatible with ER entry; absence
      of a conventional cleaved signal peptide is not evidence for cytosolic confinement.
    supported_by:
    - reference_id: PMID:8321227
    - reference_id: PMID:10506195
    - reference_id: PMID:10713129
