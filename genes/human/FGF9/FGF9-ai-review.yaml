id: P31371
gene_symbol: FGF9
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: FGF9 is a secreted, heparin-binding fibroblast growth factor that activates responsive FGFR splice
  forms and promotes proliferation and other cell responses. It uses an atypical secretion signal rather than a
  conventionally cleaved signal peptide. Reversible homodimerization, heparan-sulfate association and receptor compatibility
  regulate the availability and spatial range of signaling-competent ligand. Developmental effects depend on tissue
  and receptor context, including skeletal, gonadal and ocular development. Human FGF9 variants are associated with
  multiple synostoses syndrome; altered ligand distribution and altered receptor potency need not have the same
  direction.
existing_annotations:
- term:
    id: GO:0001654
    label: eye development
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P54130
  - ensembl:ENSMUSP00000022545
  review:
    summary: FGF9 signaling contributes to eye development.
    action: KEEP_AS_NON_CORE
    reason: The mouse P54130 donor has an IMP annotation from PMID:21858205. Its Fgf9 Y162C allelic study documents
      prenatal and postnatal lens-growth abnormalities (Results, Figures 8–9), with normal retinal measurements
      in that model. Retain the orthology-based developmental inference as a contextual ligand function; this is
      not a human lens experiment or proof that the neomorphic allele simply abolishes normal FGF9 activity.
    supported_by:
    - reference_id: PMID:21858205
