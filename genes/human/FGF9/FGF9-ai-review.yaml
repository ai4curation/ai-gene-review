core_functions:
- description: Secreted FGF9 binds responsive fibroblast growth factor receptors and stimulates receptor-dependent
    signaling and proliferation. Human FGF9 construct experiments resolve receptor recognition and ERK activation;
    the original receptor panel used mouse FGF9. Dimerization and heparan-sulfate binding modulate active ligand
    availability and tissue distribution, so potency varies with ligand state and receptor splice form.
