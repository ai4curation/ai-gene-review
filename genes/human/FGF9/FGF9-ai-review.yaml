  review:
    summary: Broad intracellular residence is compatible with FGF9 biosynthesis.
    action: KEEP_AS_NON_CORE
    reason: The cytoplasm IBD is inherited on the verified FGF9 path. GO:0005737 includes cytoplasmic organelles,
      so the demonstrated secretory route does not contradict this broad location. Rat FGF9 microsomal glycosylation/protection
      and COS-cell secretion were assayed in PMID:10506195; PMID:10713129 reports ER/Golgi transit. These do not
      establish a distinct soluble-cytosolic signaling activity of human FGF9. Retain the positive broad location
      outside the extracellular ligand core.
    supported_by:
    - reference_id: PMID:10506195
    - reference_id: PMID:10713129
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
      - source_id: PANTHER:PTN000160075
        source_status: SUPPORTS_TRANSFER
        comment: The complete PTHR11486 tree places the sequence-matched human FGF9 leaf PTN002479527 below this
          positive IBD. All 35 saved PAINT rows were checked; no IRD lies on the FGF9 path. See FGF9-phylogeny.yaml.
