  review:
    summary: FGF9 binds fibroblast growth factor receptors.
    action: ACCEPT
    reason: The inherited PAINT assertion is supported by direct receptor-binding and signaling experiments with
      human FGF9 constructs in PMID:28757146 (Results, Figures 1 and 4–5; STAR Methods). Receptor splice form, ligand
      truncation and engineered receptor mutations affect the measured specificity. The older PMID:8663044 panel
      used mouse FGF9 and measured receptor-dependent mitogenesis, not direct affinity. FGFR binding is the molecular
      recognition step of the growth-factor core.
    supported_by:
    - reference_id: PMID:28757146
    - reference_id: PMID:8663044
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
