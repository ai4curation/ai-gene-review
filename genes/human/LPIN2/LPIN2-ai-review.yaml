- id: PMID:22908270
  title: Mouse lipin-1 and lipin-2 cooperate to maintain glycerolipid homeostasis in liver and aging cerebellum.
  full_text_unavailable: true
  findings:
  - statement: Mouse Lpin2 deficiency induces tissue-specific compensatory Lpin1 and reveals hepatic and cerebellar lipid-homeostasis roles.
    supporting_text: By using lipin-2-deficient mice, we uncovered a functional relationship between lipin-1 and lipin-2 that operates in a tissue-specific and age-dependent manner.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: The mouse model recapitulates anemia but not osteomyelitis, limiting direct transfer of its disease physiology to human Majeed syndrome.
    supporting_text: Similar to patients with Majeed syndrome, lipin-2-deficient mice developed anemia, but did not show evidence of osteomyelitis, suggesting that additional environmental or genetic components contribute to the bone abnormalities observed in patients.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
