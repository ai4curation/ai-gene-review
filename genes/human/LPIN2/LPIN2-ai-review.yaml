core_functions:
- description: >-
    Catalyzes magnesium-dependent hydrolysis of phosphatidic acid to
    1,2-diacylglycerol and orthophosphate. This PA-specific PAP1 reaction is the
    best-supported core activity of LPIN2 and supplies diacylglycerol for
    triacylglycerol and major glycerophospholipid synthesis. LPIN2 partitions between
    soluble and tightly membrane-associated pools; its catalytic state is modeled at
    the ER membrane, while stable ER association is less directly demonstrated for
    LPIN2 than for LPIN1. Human-cell knockdown induces LPIN1 compensation, so total
    cellular PAP1 activity can rise after LPIN2 loss and must not be interpreted as
    the intrinsic direction of LPIN2 catalysis.
  molecular_function:
    id: GO:0008195
    label: phosphatidate phosphatase activity
  directly_involved_in:
  - id: GO:0019432
    label: triglyceride biosynthetic process
  locations:
  - id: GO:0005829
    label: cytosol
  - id: GO:0005789
    label: endoplasmic reticulum membrane
  supported_by:
  - reference_id: PMID:17158099
    supporting_text: >-
      Consistent with this possibility, recombinant lipin-2 and lipin-3 possess
      PAP1 activity.
  - reference_id: PMID:17158099
    supporting_text: >-
      Each of the three lipin family members showed Mg2+-dependent activity that
      was specific for phosphatidate under the conditions employed.
  - reference_id: Reactome:R-HSA-75899
    supporting_text: >-
      The activities of LPIN1 and LPIN2 have been established experimentally
      (Grimsey et al. 2008); that of LPIN3 is inferred from its structural
      similarities both to its human paralogues and to its mouse ortholog (Donkor et
      al. 2007).
- description: >-
    Acts in the nucleus as a noncatalytic transcriptional coactivator for
    PPAR-response-element-dependent gene expression. Mutation studies separate this
    coactivator output from phosphatidate phosphatase catalysis. This is a conserved
    lipin-family activity supported for mouse lipin-2 and by phylogenetic transfer;
    endogenous human LPIN2 occupancy, partners, and target-gene programs remain less
    directly established than its phosphatidate phosphatase activity.
  molecular_function:
    id: GO:0003713
    label: transcription coactivator activity
  directly_involved_in:
  - id: GO:0045944
    label: positive regulation of transcription by RNA polymerase II
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:19717560
    supporting_text: >-
      We also determined that lipin-2 has transcriptional coactivator activity for
      peroxisome proliferator-activated receptor-response elements similar to
      lipin-1 and that this activity is not affected by mutating the conserved
      serine.
knowledge_gaps:
- gap_statement: >-
    The quantitative contribution of LPIN2 to PA-to-DAG flux in native human tissues
    is unresolved because LPIN1 and LPIN3 can compensate in a tissue- and state-
    dependent manner.
  boundary: >-
    Recombinant LPIN2 directly has Mg-dependent PA-specific PAP1 activity, while
    LPIN2 depletion in HeLa cells increases LPIN1 and total PAP1 activity. Mouse
    knockout phenotypes vary by tissue, age, sex, and diet.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    Paralog-resolved flux is required to connect intrinsic LPIN2 catalysis to DAG,
    triglyceride, phospholipid, and inflammatory lipid-state phenotypes.
  resolution: >-
    Quantify isotope-resolved PA-to-DAG and downstream glycerolipid flux after single
    and combinatorial endogenous LPIN1/2/3 perturbation and genomic rescue in primary
    human liver, macrophage, erythroid, and bone-lineage models.
- gap_statement: >-
    The membrane-recruitment mechanism, exact ER topology, and in-vivo regulation of
    human LPIN2 catalytic activity are incompletely defined.
  boundary: >-
    Human HeLa experiments show a tightly membrane-associated LPIN2 pool and
    biochemical studies support charge-sensitive PA binding. Reactome places the
    reaction at the ER membrane but notes that stable ER association was directly
    shown only for LPIN1. Phosphorylation effects differ between mitotic-cell and
    isolated biochemical contexts.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: >-
    Recruitment and phosphorylation determine when cytosolic LPIN2 gains access to
    membrane PA and may explain context-specific catalytic output.
  resolution: >-
    Endogenously tag LPIN2, map PA-dependent membrane dwell times and orientation,
    and combine site-specific phosphoproteomics with PAP flux measurements across
    cell-cycle, insulin, fatty-acid, and inflammatory stimuli.
- gap_statement: >-
    Endogenous human LPIN2 transcriptional coactivator partners, genomic targets, and
    dependence on catalytic state remain insufficiently established.
  boundary: >-
    Mouse lipin-2 coactivates PPAR-response elements independently of PAP catalysis,
    and human LPIN2 retains the conserved interaction motif. Direct endogenous human
    chromatin occupancy and target-gene causality have not been demonstrated in the
    reviewed evidence.
  gap_kind:
  - BIOLOGY
  - CURATION
  status: OPEN
  significance: >-
    This distinction is essential for deciding whether nuclear coactivation is a
    conserved LPIN2 core function in humans or a model-dependent moonlighting role.
  resolution: >-
    Compare wild-type, catalytic-dead, and LXXIL-interaction-defective genomic rescue
    in human cells using nuclear proteomics, CUT&RUN, nascent RNA sequencing, and
    PPAR/PPARGC1A perturbation.
- gap_statement: >-
    The causal pathway from LPIN2 loss to the bone inflammation, dyserythropoietic
    anemia, and dermatosis of Majeed syndrome is unresolved.
  boundary: >-
    Human recessive genetics establishes disease causality. Macrophage studies link
    LPIN2-dependent lipid state to JNK/c-Jun, P2X7/NLRP3, IL-1β, and interferon
    responses, but these do not fully explain lineage-specific bone and erythroid
    pathology; Lpin2-null mice develop anemia without osteomyelitis.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: >-
    Mechanistic resolution would distinguish catalytic lipid imbalance from
    coactivator or immune-regulatory contributions and guide pathway-specific
    treatment.
  resolution: >-
    Generate isogenic patient-variant and catalytic/coactivator-separation models in
    human macrophage, osteoclast/osteoblast, and erythroid organoids, then combine
    lipidomics, cytokine profiling, inflammasome assays, and cross-lineage co-culture.
- gap_statement: >-
    The extent to which LPIN2 directly restrains human macrophage inflammation versus
    indirectly changing membrane lipid composition remains uncertain.
  boundary: >-
    Primary human macrophage perturbations support effects on P2X7/NLRP3, IL-1β, and
    interferon-associated responses, while cholesterol restoration can normalize
    P2X7 currents. No evidence establishes LPIN2 as a physical inflammasome or P2X7
    component.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: >-
    Separating catalytic lipid-state effects from direct signaling interactions will
    prevent over-annotation and clarify anti-inflammatory mechanisms.
  resolution: >-
    Use catalytic-dead and coactivator-defective endogenous rescue in primary human
    macrophages, with PA/DAG/cholesterol lipidomics, membrane biophysics, P2X7
    currents, inflammasome assembly, cytokine release, and proximity-interaction
    controls.
- gap_statement: >-
    Functionally distinct endogenous LPIN2 protein isoforms and obligatory stable
    LPIN2-containing complexes have not been established.
  boundary: >-
    Multiple transcript accessions do not demonstrate isoform-specific function, and
    the “three mammalian lipin isoforms” in oligomerization work refers to LPIN1,
    LPIN2, and LPIN3. β-TRCP binding and lipin oligomerization are supported
    interactions but do not prove constitutive complex membership.
  gap_kind:
  - BIOLOGY
  - CURATION
  status: OPEN
  significance: >-
    Incorrect isoform or complex assumptions could confound paralog compensation,
    turnover, localization, and catalytic regulation.
  resolution: >-
    Reconcile full-length LPIN2 transcripts by long-read sequencing and proteomics,
    then quantify endogenous oligomer and β-TRCP interaction stoichiometry, lifetime,
    stimulus dependence, and functional rescue.
proposed_new_terms: []
suggested_questions:
- question: >-
    How much PA-to-DAG flux is supplied by LPIN2 rather than LPIN1 or LPIN3 in each
    native human tissue and activation state?
- question: >-
    What controls LPIN2 recruitment to ER membranes and reconciles the reported
    context-dependent effects of phosphorylation?
- question: >-
    Which endogenous human transcription factors, coactivators, and target genes
    require nuclear LPIN2 independently of PAP catalysis?
- question: >-
    Which catalytic, transcriptional, and macrophage lipid-state defects cause the
    distinct manifestations of Majeed syndrome?
- question: >-
    Does LPIN2 regulate P2X7/NLRP3 and interferon responses entirely through lipid
    composition, or also through direct signaling interactions?
- question: >-
    Are any endogenous LPIN2 splice isoforms or stable oligomeric/regulatory
    complexes functionally distinct?
suggested_experiments:
- hypothesis: >-
    LPIN2 supplies a tissue-specific fraction of glycerolipid PAP flux that is masked
    by inducible LPIN1 compensation.
  description: >-
    Perform single and combinatorial LPIN1/2/3 endogenous knockouts with genomic
    rescue in primary human hepatic, macrophage, erythroid, and bone-lineage models,
    using isotope-resolved PA-to-DAG, TAG, PC, and PE flux plus paralog abundance and
    localization measurements.
  experiment_type: paralog-resolved glycerolipid flux analysis
- hypothesis: >-
    PA charge, membrane composition, and stimulus-specific phosphorylation jointly
    control LPIN2 ER recruitment and catalytic output.
  description: >-
    Endogenously tag LPIN2 and combine single-molecule membrane tracking,
    phosphosite editing, defined PA species, membrane charge manipulation, and PAP
    flux measurements across mitosis, insulin, and fatty-acid exposure.
  experiment_type: membrane recruitment and phosphoregulation
- hypothesis: >-
    Human LPIN2 coactivates a bounded PPAR/PPARGC1A transcriptional program
    independently of its PAP catalytic motif.
  description: >-
    Compare wild-type, catalytic-dead, and LXXIL-defective genomic rescue with
    nuclear interactomics, CUT&RUN, nascent transcriptomics, and reporter-independent
    validation in human liver and macrophage models.
  experiment_type: catalytic-versus-coactivator separation
- hypothesis: >-
    Majeed inflammatory and erythroid phenotypes arise from distinct lineage-specific
    consequences of altered PA/DAG and cholesterol state.
  description: >-
    Introduce representative patient variants into isogenic human macrophage,
    osteogenic, and erythroid organoids, rescue catalytic and coactivator functions
    separately, and quantify lipid flux, JNK, P2X7/NLRP3, cytokines, differentiation,
    and cross-lineage effects.
  experiment_type: Majeed syndrome mechanism dissection
- hypothesis: >-
    β-TRCP binding and lipin-family oligomerization regulate LPIN2 abundance or
    localization transiently rather than defining an obligatory stable complex.
  description: >-
    Measure endogenous interaction stoichiometry and lifetime by quantitative
    proximity labeling and live-cell complementation, perturb β-TRCP degrons and
    lipin interfaces, and test effects on turnover, membrane recruitment, PAP flux,
    and inflammatory outputs.
  experiment_type: dynamic interaction and complex-boundary analysis
