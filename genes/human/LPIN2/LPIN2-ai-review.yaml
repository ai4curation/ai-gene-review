  title: Lipin-2 regulates the antiviral and anti-inflammatory responses to interferon.
  findings:
  - statement: Interferon induces Lpin2 through STAT1-dependent regulation in the experimental macrophage systems.
    supporting_text: Here, we reveal that lipin-2, a phosphatidic acid phosphatase whose mutations produce an autoinflammatory syndrome known as Majeed syndrome in humans, is regulated by IFN in a STAT-1-dependent manner.
    reference_section_type: ABSTRACT
  - statement: LPIN2 depletion in primary human macrophages augments IL1B expression after extracellular poly(I:C) stimulation.
