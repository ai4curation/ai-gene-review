- id: PMID:18694939
  title: Temporal and spatial regulation of the phosphatidate phosphatases lipin 1
    and 2.
  findings:
  - statement: Human-cell experiments distinguish LPIN2 from LPIN1 and identify a tightly membrane-associated LPIN2 pool.
    supporting_text: The two lipins display distinct intracellular localization in HeLa M cells, with a pool of lipin 2 exhibiting a tight membrane association.
    reference_section_type: ABSTRACT
  - statement: LPIN2 depletion in HeLa cells triggers compensatory LPIN1 accumulation and increased total PAP1 activity, so whole-cell PAP changes do not directly measure LPIN2 catalysis in isolation.
    supporting_text: Small interfering RNA-mediated silencing of lipin 1 leads to a dramatic decrease of the cellular PAP1 activity in HeLa M cells, whereas silencing of lipin 2 leads to an increase of lipin 1 levels and PAP1 activity.
    reference_section_type: ABSTRACT
  - statement: Lipin-2 protein and PAP1 activity are regulated during mitosis, but the cell-cycle result is a cultured-cell context rather than a constitutive localization claim.
    supporting_text: Finally, we show that the PAP1 activity of both lipins is inhibited by phosphorylation during mitosis, leading to a decrease in the cellular PAP1 activity during cell division.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text verifies human HeLa localization, depletion, and PAP assays, with mouse 3T3-L1 experiments clearly separable from the human-cell results.
- id: PMID:17158099
  title: Three mammalian lipins act as phosphatidate phosphatases with distinct tissue expression patterns.
  full_text_unavailable: true
  findings:
  - statement: Recombinant lipin-2 directly possesses phosphatidate phosphatase type-1 activity.
    supporting_text: Consistent with this possibility, recombinant lipin-2 and lipin-3 possess PAP1 activity.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: Lipin family PAP activity is magnesium-dependent and phosphatidate-specific under the tested conditions.
