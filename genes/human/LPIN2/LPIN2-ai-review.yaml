    supporting_text: At the endoplasmic reticulum (ER) membrane, phosphatidate phosphatase 1-3 (LPIN) dephosphorylates phosphatidic acid (PA) to form diacylglycerol (DAG) (Grimsey et al. 2008, Donkor et al. 2007).
