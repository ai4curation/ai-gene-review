- term:
    id: GO:0032869
    label: cellular response to insulin stimulus
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: The insulin-response transfer overgeneralizes regulation established for other lipins to LPIN2.
    action: MARK_AS_OVER_ANNOTATED
    reason: The phylogenetic source set includes mouse Lpin1 rather than direct LPIN2 insulin-response evidence. PMID:24811178
      instead reports that lipin-2 phosphorylation is not induced by insulin signaling and that its localization is unchanged during
      insulin stimulation. A generic cellular-response assignment therefore overstates the available LPIN2 evidence.
    supported_by:
    - reference_id: PMID:24811178
      supporting_text: However, unlike lipin 1, the phosphorylation of lipin 2 is not induced by insulin signaling nor is it sensitive to inhibition of the mammalian target of rapamycin.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: FB:FBgn0263593
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Family-level insulin-response biology does not establish an LPIN2 response and conflicts with direct lipin-2
          phosphoregulation evidence.
      - source_id: MGI:MGI:1891340
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: This source is mouse Lpin1, whose insulin-responsive phosphorylation differs directly from lipin-2 regulation.
      - source_id: PANTHER:PTN000953144
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: The broader lipin-family node does not preserve the paralog-specific insulin-regulation distinction.
      - source_id: RGD:1307646
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Ortholog/family context alone is insufficient because direct lipin-2 data show no insulin-induced phosphorylation
          or localization change.
