id: Q92539
gene_symbol: LPIN2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  LPIN2 is a bifunctional lipin-family protein whose best-established molecular
  activity is magnesium-dependent phosphatidate phosphatase type 1 activity.
  Through its conserved DXDXT catalytic motif, LPIN2 hydrolyzes phosphatidic acid to
  diacylglycerol and orthophosphate. A soluble cytosolic pool can associate tightly
  with membranes, and curated pathway evidence places the catalytic reaction at the
  endoplasmic-reticulum membrane, where the resulting diacylglycerol supplies
  triacylglycerol, phosphatidylcholine, and phosphatidylethanolamine synthesis.
  Human HeLa-cell depletion reveals substantial LPIN1 compensation: loss of LPIN2
  raises LPIN1 abundance and total PAP1 activity, so whole-cell phosphatase changes
  do not report isolated LPIN2 catalysis. PA binding and catalytic regulation differ
  from LPIN1 in biochemical systems, and reported phosphorylation effects vary with
  cell-cycle and assay context.

  LPIN2 can also act independently of catalysis as a nuclear transcriptional
  coactivator for PPAR-response-element programs, but direct functional separation
  and target-gene evidence come chiefly from mouse lipin-2 and heterologous assays;
  endogenous human nuclear dynamics remain less firmly established. Biallelic LPIN2
  loss causes Majeed syndrome, characterized by early chronic recurrent multifocal
  osteomyelitis, dyserythropoietic anemia, and inflammatory dermatosis. Macrophage
  perturbation studies connect LPIN2-dependent lipid state to restrained JNK/c-Jun,
  P2X7/NLRP3, and interferon-associated inflammatory responses in defined human and
  mouse systems, but do not make LPIN2 a direct inflammasome enzyme or receptor
  component. Mouse knockout phenotypes show tissue-, age-, diet-, and paralog-
  dependent glycerolipid homeostasis and do not fully reproduce human osteomyelitis.
  β-TRCP-mediated ubiquitination and lipin-family oligomerization are supported
  regulatory interactions, not evidence that LPIN2 is an obligate subunit of a
  stable complex. References to multiple lipin “isoforms” in oligomerization studies
  denote LPIN1, LPIN2, and LPIN3 family proteins; functionally distinct LPIN2 splice
  isoforms have not been established.
