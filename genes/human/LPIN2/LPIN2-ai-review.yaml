- id: PMID:19717560
  title: A conserved serine residue is required for the phosphatidate phosphatase activity but not the transcriptional coactivator functions of lipin-1 and lipin-2.
  full_text_unavailable: true
  findings:
  - statement: In mouse lipin-2, mutation of the serine equivalent to human Majeed variant S734L abolishes PAP activity without disrupting microsomal association.
    supporting_text: mutation of the equivalent serine in mouse lipin-1 and lipin-2 to leucine or aspartate abolishes PAP activity but does not impair lipin association with microsomal membranes, the major site of glycerolipid synthesis.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: Lipin-2 can coactivate PPAR-response-element transcription, and this assay readout is separable from PAP catalysis.
    supporting_text: We also determined that lipin-2 has transcriptional coactivator activity for peroxisome proliferator-activated receptor-response elements similar to lipin-1 and that this activity is not affected by mutating the conserved serine.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: Tissue-expression mapping in this paper was performed in mouse and must not be represented as direct human tissue evidence.
    supporting_text: To characterize sites of lipin-2 action, we detected lipin-2 expression by in situ hybridization on whole mouse sections and by quantitative PCR of tissues relevant to Majeed syndrome.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Strong catalytic-versus-coactivator separation, but the functional mutation and tissue assays described in the abstract use mouse lipin proteins/tissues.
- id: PMID:24811178
  title: Lipin 2 binds phosphatidic acid by the electrostatic hydrogen bond switch mechanism independent of phosphorylation.
  findings:
  - statement: Lipin-2 preferentially binds the dianionic form of phosphatidic acid and has a lower catalytic rate than lipin-1 in the tested biochemical system.
    supporting_text: We provide evidence that lipin 2, like lipin 1, binds PA via the electrostatic hydrogen bond switch mechanism but has a lower rate of catalysis.
    reference_section_type: ABSTRACT
  - statement: Unlike lipin-1, lipin-2 membrane binding and PAP activity were not negatively regulated by phosphorylation in the tested system.
    supporting_text: Importantly, phosphorylation of lipin 2 does not negatively regulate either membrane binding or PAP activity.
    reference_section_type: ABSTRACT
  - statement: The study directly notes that earlier relative activity measurements used human lipin-2 in cell lysates, while its own localization experiments include mouse 3T3-L1 adipocytes.
    supporting_text: The relative PAP activity of human lipin 2 has been previously determined in cell lysates ( 17 , 18 ).
    reference_section_type: INTRODUCTION
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full-text biochemical study of lipin-2 substrate binding, kinetics, and phosphorylation; its purified/cell-culture systems do not alone prove a universal in-vivo regulatory state.
- id: PMID:20735359
  title: Lipin proteins form homo- and hetero-oligomers.
  findings:
  - statement: Lipin-1 formed stable hetero-oligomers with lipin-2 and lipin-3 in the study's interaction systems.
    supporting_text: In the present study, using various approaches, we revealed that lipin 1 formed stable homo-oligomers with itself and hetero-oligomers with lipin 2/3.
    reference_section_type: ABSTRACT
  - statement: The paper's phrase “mammalian lipin isoforms” refers to the LPIN1/LPIN2/LPIN3 family members, not splice isoforms of LPIN2.
    supporting_text: The present study provides evidence that lipin proteins function as oligomeric complexes and that the three mammalian lipin isoforms can form combinatorial units.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Supports lipin-family oligomerization in experimental systems; it does not establish a required endogenous LPIN2 complex or LPIN2 splice-isoform biology.
- id: PMID:22334674
  title: Lipin-2 reduces proinflammatory signaling induced by saturated fatty acids in macrophages.
  full_text_unavailable: true
  findings:
  - statement: LPIN2 depletion enhances saturated-fatty-acid-driven inflammatory gene expression through JNK1/c-Jun in murine and human macrophage systems.
    supporting_text: Depletion of lipin-2 promotes the increased expression of the proinflammatory genes Il6, Ccl2, and Tnfα, which depends on the overstimulation of the JNK1/c-Jun pathway by saturated fatty acids.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: LPIN2 loss reduces triacylglycerol content specifically in saturated-fatty-acid-overloaded macrophages.
    supporting_text: Metabolically, the absence of lipin-2 reduces the cellular content of triacylglycerol in saturated fatty acid-overloaded macrophages.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct macrophage perturbation evidence in murine and human systems, bounded to saturated-fatty-acid challenge rather than basal organism-wide inflammation.
- id: PMID:28031477
  title: Lipin-2 regulates NLRP3 inflammasome by affecting P2X7 receptor activation.
  findings:
  - statement: LPIN2 restrains excessive IL-1β production in primary human and mouse macrophages through inflammasome priming and activation mechanisms.
    supporting_text: We show here that lipin-2 controls excessive IL-1β formation in primary human and mouse macrophages by several mechanisms, including activation of the inflammasome NLRP3.
    reference_section_type: ABSTRACT
  - statement: LPIN2 loss lowers macrophage cholesterol, and cholesterol restoration attenuates P2X7 currents and downstream IL-1β-generating events.
    supporting_text: In fact, restoration of cholesterol concentrations in cells lacking lipin-2 decreases ion currents through the P2X7 receptor, and downstream events that drive IL-1β production.
    reference_section_type: ABSTRACT
  - statement: The evidence supports indirect control of P2X7/NLRP3 through cellular lipid state, not direct LPIN2 receptor binding or inflammasome catalytic activity.
    supporting_text: Reduced levels of lipin-2 in macrophages lead to a decrease in cellular cholesterol levels.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full-text primary human/mouse macrophage evidence connects LPIN2-dependent lipid state to P2X7 and NLRP3; mechanistic wording should remain regulatory, not physical interaction.
- id: PMID:32008742
  title: Lipin-2 degradation elicits a proinflammatory gene signature in macrophages.
  full_text_unavailable: true
  findings:
  - statement: β-TRCP binds LPIN2 and promotes its ubiquitination and proteasomal degradation.
    supporting_text: Here, we demonstrate that Lipin-2 interacts with β-TRCP, a substrate receptor subunit of the SCFβ-TRCP E3 ligase, and undergoes ubiquitination and proteasomal degradation.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: β-TRCP knockout caused LPIN2 accumulation and suppressed LPS-induced inflammatory signaling in a mouse macrophage cell line.
    supporting_text: β-TRCP-knockout in RAW264.7 macrophages resulted in Lipin-2 accumulation, leading to the suppression of LPS-induced MAPK activation and subsequent proinflammatory gene expression.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
