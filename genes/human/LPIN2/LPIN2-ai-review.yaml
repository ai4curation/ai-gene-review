    correctness: VERIFIED
    review_notes: PubMed abstract directly establishes mammalian recombinant lipin-2 PAP1 activity; assay-detail interpretation is limited to the abstract.
- id: PMID:15994876
  title: Homozygous mutations in LPIN2 are responsible for the syndrome of chronic recurrent multifocal osteomyelitis and congenital dyserythropoietic anaemia (Majeed syndrome).
  full_text_unavailable: true
  findings:
  - statement: Homozygous LPIN2 mutations segregated with Majeed syndrome in the two studied families.
    supporting_text: Examination of genes in this interval led to the identification of homozygous mutations in LPIN2 in affected individuals from the two families.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: The original human expression survey found LPIN2 broadly expressed.
    supporting_text: LPIN2 was found to be expressed in almost all tissues.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: This discovery study established disease causality but did not establish the inflammatory mechanism.
    supporting_text: The function of LPIN2 and its role in inflammation remains unknown.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
