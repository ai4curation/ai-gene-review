  - UniProtKB:P60520
  - UniProtKB:Q582K6
  - UniProtKB:Q9GZQ8
  - UniProtKB:Q9H492
  review:
    summary: GABARAP-subfamily proteins on the phagophore contribute to autophagosome biogenesis.
    action: ACCEPT
    reason: Atg8-family proteins promote efficient autophagosome formation (loss of all six gives smaller,
      slower-forming autophagosomes). GABARAP mainly acts at later steps, but its participation in assembly
      at the membrane is supported and consistent with the IBA.
    supported_by:
    - reference_id: PMID:27864321
      supporting_text: loss of all Atg8s yields smaller autophagosomes and a slowed initial rate of autophagosome
        formation
    - reference_id: PMID:20418806
      supporting_text: our results indicate that LC3s are involved in elongation of the phagophore membrane
        whereas the GABARAP/GATE-16 subfamily is essential for a later stage in autophagosome maturation
