- id: file:human/GABARAP/GABARAP-uniprot.txt
  title: UniProtKB entry O95166 (GABARAP)
  findings: []
core_functions:
- description: Atg8-family ubiquitin-like protein conjugated to phosphatidylethanolamine on autophagic
    membranes, where it recruits LIR-containing partners such as PLEKHM1 to drive autophagosome maturation
    and fusion with lysosomes, and engages receptors in mitophagy and ER-phagy.
  molecular_function:
    id: GO:0008429
    label: phosphatidylethanolamine binding
  directly_involved_in:
  - id: GO:0097352
    label: autophagosome maturation
  - id: GO:0000045
    label: autophagosome assembly
  - id: GO:0000423
    label: mitophagy
  locations:
  - id: GO:0000421
    label: autophagosome membrane
  supported_by:
  - reference_id: PMID:15169837
    supporting_text: two other mammalian homologues of yeast Atg8, gamma-aminobutyric-acid-type-A-receptor-associated
      protein (GABARAP) and Golgi-associated ATPase enhancer of 16 kDa (GATE16) also generate form II,
      which are recovered in membrane fractions
  - reference_id: PMID:15169837
    supporting_text: Generation of the form II correlates with autophagosome association of GABARAP and
      GATE16.
  - reference_id: PMID:27864321
    supporting_text: We find that the GABARAP subfamily promotes PLEKHM1 recruitment and governs autophagosome-lysosome
      fusion, whereas the LC3 subfamily plays a less prominent role in these processes.
  - reference_id: PMID:27864321
    supporting_text: identify GABARAP subfamily members as primary contributors to PINK1/Parkin mitophagy
      and starvation autophagy
- description: Membrane-conjugated GABARAP sequesters the FLCN-FNIP complex through an FNIP LIR, inhibiting
    its GAP activity toward RagC/D and enabling TFEB/TFE3 activation and lysosome biogenesis.
  molecular_function:
    id: GO:0140311
    label: protein sequestering activity
  directly_involved_in:
  - id: GO:1905673
    label: positive regulation of lysosome organization
  locations:
  - id: GO:0000421
    label: autophagosome membrane
  supported_by:
  - reference_id: PMID:34597140
    supporting_text: GABARAP directly binds to a previously unidentified LC3-interacting motif (LIR) in
      the FLCN/FNIP tumor suppressor complex and mediates sequestration to GABARAP-conjugated membrane
      compartments.
  - reference_id: PMID:34597140
    supporting_text: the membrane conjugation of GABARAP, but not LC3, is required for activation of TFEB/TFE3
      to control lysosomal capacity
  - reference_id: PMID:34597140
    supporting_text: This disrupts FLCN/FNIP GAP function toward RagC/D, resulting in impaired substrate-specific
      mTOR-dependent phosphorylation of TFEB.
- description: Binds the GABA(A) receptor gamma2 subunit and tubulin, and has been implicated in intracellular
    trafficking of GABA(A) receptors in neurons.
  molecular_function:
    id: GO:0050811
    label: GABA receptor binding
  supported_by:
  - reference_id: PMID:9892355
    supporting_text: GABARAP binds to GABA(A) receptors both in vitro and in vivo, and co-localizes with
      the punctate staining of GABA(A) receptors on cultured cortical neurons.
  - reference_id: PMID:9892355
    supporting_text: The interactions among GABA(A) receptors, GABARAP and tubulin suggest a mechanism
      for the targeting and clustering of GABA(A) receptors.
suggested_questions:
- question: Is the GABA(A) receptor trafficking role of GABARAP lipidation-dependent, and does it use
    the same LIR-docking site as autophagy partners?
- question: Which GABARAP functions (PLEKHM1 recruitment, FLCN-FNIP sequestration) are shared with GABARAPL1
    and GABARAPL2, and which are specific to GABARAP?
suggested_experiments:
- description: Re-express GABARAP alone, or LIR-docking-site mutants, in Atg8 hexa-knockout cells and
    measure PLEKHM1 recruitment, autophagosome-lysosome fusion and TFEB nuclear translocation.
  hypothesis: GABARAP alone is sufficient to restore fusion and FLCN-FNIP-dependent TFEB activation.
