id: O95166
gene_symbol: GABARAP
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: GABARAP (gamma-aminobutyric acid receptor-associated protein) is a ubiquitin-like protein
  of the Atg8 family (GABARAP subfamily). Like other Atg8 proteins it is processed by ATG4 to expose a
  C-terminal glycine (Gly116) and is conjugated by ATG7, ATG3 and the ATG12-ATG5-ATG16L1 complex to phosphatidylethanolamine
  on phagophore and autophagosome membranes (form II). Its hydrophobic LIR-docking site binds LC3-interacting
  region motifs, with a preference for GABARAP-interaction motifs, in autophagy receptors and effectors.
  GABARAP-subfamily proteins contribute to autophagosome formation and are the main Atg8 proteins for
  autophagosome-lysosome fusion, where they recruit PLEKHM1, and for PINK1/Parkin mitophagy; GABARAP also
  binds ER-phagy receptors such as UBAC2 and TEX264. On conjugated endolysosomal and autophagic membranes
  it sequesters the FLCN-FNIP complex through an LIR in FNIP, blocking RagC/D activation and so allowing
  TFEB/TFE3 nuclear entry and lysosome biogenesis. GABARAP was first identified as a binding partner of
  the GABA(A) receptor gamma2 subunit that also binds tubulin and is linked to receptor trafficking in
  neurons; it additionally scaffolds the CUL3-KBTBD6/7 ubiquitin ligase on membranes to degrade the RAC1
  activator TIAM1.
