id: O15511
gene_symbol: ARPC5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ARPC5 (p16-Arc) is the smallest subunit of the Arp2/3 complex, the nucleator of branched
  actin networks, and lies peripheral to the ARPC2-ARPC4 core. Mammals assemble alternative complexes
  with ARPC5 or its paralog ARPC5L. ARPC5-containing complexes are less active in actin assembly and less
  protected by cortactin from coronin-mediated disassembly than ARPC5L complexes, and the two isoforms
  shape lamellipodial protrusion differently. ARPC5 complexes drive cytoplasmic actin dynamics in T cells,
  while ARPC5L complexes drive nuclear actin polymerization. Biallelic ARPC5 loss causes an actinopathy
  with recurrent infections, autoimmunity and impaired cytokine signalling.
