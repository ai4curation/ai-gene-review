- term:
    id: GO:0005634
    label: nucleus
  evidence_type: EXP
  original_reference_id: PMID:29925947
  qualifier: located_in
  review:
    summary: Nucleus (EXP). The Arp2/3 complex is recruited to damaged chromatin for homology-directed
      repair. In T cells, nuclear actin polymerization uses ARPC5L-containing complexes, while ARPC5 drives
      cytoplasmic actin dynamics. A specialized nuclear role; kept as non-core.
    action: KEEP_AS_NON_CORE
    reason: '[PMID:29925947 "Here, using Xenopus laevis cell-free extracts and mammalian cells, we establish
      that nuclear actin, WASP, and the actin-nucleating ARP2/3 complex are recruited to damaged chromatin
      undergoing homology-directed repair."] [PMID:37162507 "In contrast, ARPC5 is evenly expressed in
      CD4 T cell populations and is required for cytoplasmic actin dynamics."]'
