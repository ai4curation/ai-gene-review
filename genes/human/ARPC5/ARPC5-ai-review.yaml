suggested_questions:
- question: What sets the balance between ARPC5- and ARPC5L-containing complexes in a given cell, and
    does it determine nuclear versus cytoplasmic actin assembly?
suggested_experiments:
- description: Swap ARPC5 for ARPC5L in patient-derived ARPC5-null cells and test rescue of migration
    and IL-6 signalling.
