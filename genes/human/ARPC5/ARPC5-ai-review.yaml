    label: lamellipodium
  - id: GO:0015629
    label: actin cytoskeleton
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:11741539
    supporting_text: Here we report the reconstitution of active human Arp2/3 complex after expression
      of all seven subunits in insect cells.
  - reference_id: PMID:26655834
    supporting_text: We found that Arp2/3 complexes containing ARPC1B and ARPC5L are significantly better
      at promoting actin assembly than those with ARPC1A and ARPC5, both in cells and in vitro.
  - reference_id: PMID:9359840
    supporting_text: Mammalian actin-related protein 2/3 complex localizes to regions of lamellipodial
      protrusion and is composed of evolutionarily conserved proteins.
