- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0086
  review:
    summary: Cytoplasm localization is true but too general; refine to cytosol and
      endosome membrane.
    action: MODIFY
    reason: VPS29 partitions between a soluble cytosolic pool and the cytoplasmic
      surface of endosomal membranes within retromer and retriever complexes; refine
      GO:0005737 (cytoplasm) to GO:0005829 (cytosol) and GO:0010008 (endosome membrane).
    proposed_replacement_terms:
    - id: GO:0005829
      label: cytosol
    - id: GO:0010008
      label: endosome membrane
    supported_by:
    - &id003
      reference_id: PMID:11102511
      supporting_text: 'We report the cloning and characterization of human orthologs
        of three additional components of the complex: Vps26p, Vps29p, and Vps35p.
        ... Furthermore, hVps35, hVps29, and hVps26 have been found in membrane-associated
        and cytosolic compartments.'
    - &id001
      reference_id: PMID:15078903
      supporting_text: In particular, retromer is associated with tubular-vesicular
        profiles that emanate from early endosomes or from intermediates in the maturation
        from early to late endosomes.
