    of the retromer cargo-selective complex (VPS35-VPS26-VPS29) that stabilizes the
    C-terminal solenoid of VPS35, recruits TBC1D5 and VARP via its Leu152 hydrophobic
    pocket, and contributes to cargo adaptor activity in endosome-to-Golgi retrieval
    and endocytic recycling.
