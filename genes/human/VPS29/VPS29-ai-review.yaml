- id: PMID:15078903
  title: Role of the mammalian retromer in sorting of the cation-independent mannose
    6-phosphate receptor.
  findings:
  - statement: Human VPS26, VPS29, and VPS35 localize to tubular domains of early
      endosomes where CI-MPR is concentrated prior to transport to the TGN.
    supporting_text: In particular, retromer is associated with tubular-vesicular
      profiles that emanate from early endosomes or from intermediates in the maturation
      from early to late endosomes.
  - statement: RNAi depletion of retromer subunits causes missorting and lysosomal
      turnover of CI-MPR.
    supporting_text: Depletion of retromer by RNA interference increases the lysosomal
      turnover of the CI-MPR, decreases cellular levels of lysosomal hydrolases, and
      causes swelling of lysosomes.
- id: PMID:21602791
  title: SNX27 mediates retromer tubule entry and endosome-to-plasma membrane trafficking
    of signalling receptors.
  findings:
  - statement: SNX27 serves as an essential adaptor protein linking beta2-adrenergic
      receptors to Rab4-positive retromer tubules for endosome-to-plasma-membrane
      recycling.
    supporting_text: Here we show that sequence-directed sorting occurs at the level
      of entry into retromer tubules and that retromer tubules are associated with
      Rab4. Furthermore, we show that sorting nexin 27 (SNX27) serves as an essential
      adaptor protein linking β2ARs to the retromer tubule.
- id: file:human/VPS29/VPS29-uniprot.txt
  title: UniProtKB record for human VPS29
  findings:
  - statement: VPS29 is a shared scaffolding subunit of both the retromer cargo-selective
      complex and the retriever complex.
    supporting_text: Component of the retromer cargo-selective complex (CSC). The
      CSC is believed to be the core functional component of retromer or respective
      retromer complex variants acting to prevent missorting of selected transmembrane
      cargo proteins into the lysosomal degradation pathway.
    record_section:
