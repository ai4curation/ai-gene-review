- id: PMID:24603492
  title: TBC1D5 and the AP2 complex regulate ATG9 trafficking and initiation of autophagy.
  findings:
  - statement: Although TBC1D5 binds the retromer subunit VPS29 on endosomes, TBC1D5
      and the clathrin adaptor AP2 complex regulate the rerouting of ATG9-containing
      vesicular carriers toward sites of autophagosome formation via association with
      ATG9 and the active ULK1 complex.
    supporting_text: The RabGAP protein TBC1D5 controls cellular endomembrane trafficking
      processes and binds the retromer subunit VPS29 and the ubiquitin-like protein
      ATG8 (LC3). Here, we describe that TBC1D5 also associates with ATG9 and the
      active ULK1 complex during autophagy. Moreover, ATG9 and TBC1D5 interact with
      clathrin and the AP2 complex. ... Taken together, our data show that TBC1D5
      and the AP2 complex are important novel regulators of the rerouting of ATG9-containing
      vesicular carriers toward sites of autophagosome formation.
