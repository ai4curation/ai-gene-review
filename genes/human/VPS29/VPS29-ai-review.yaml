id: Q9UBQ0
gene_symbol: VPS29
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'Vacuolar protein sorting-associated protein 29 (VPS29) is a catalytically
  inactive metallophosphoesterase-fold scaffolding subunit shared between two endosomal
  cargo-coat complexes: the heterotrimeric retromer cargo-selective complex (VPS35-VPS26-VPS29)
  and the retriever complex (VPS35L-VPS26C-VPS29, part of Commander). Bound in a C-terminal
  alpha-helical solenoid cradle of VPS35 (or VPS35L), VPS29 presents a conserved hydrophobic
  surface (centered on Leu152) that recruits regulatory cofactors including the Rab7
  GTPase-activating protein TBC1D5 and the VARP adaptor, supporting both endosome-to-Golgi
  retrograde retrieval and endosome-to-plasma-membrane recycling.'
