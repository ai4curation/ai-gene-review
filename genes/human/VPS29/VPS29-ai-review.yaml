suggested_questions:
- question: What cellular mechanisms partition the shared VPS29 subunit pool between
    VPS35 (retromer) and VPS35L (retriever), and how does competition for the VPS29
    Leu152 hydrophobic pocket among TBC1D5, VARP, and Commander subunits regulate
    endosomal tubule fission?
suggested_experiments:
- description: Measure competitive binding kinetics of TBC1D5, VARP, and CCC complex
    subunits to VPS29 assembled in purified retromer vs retriever heterotrimers using
    surface plasmon resonance and cryo-EM.
