      protein. Endosome membrane {ECO:0000250|UniProtKB:Q9QZ88}; Peripheral membrane
      protein {ECO:0000250|UniProtKB:Q9QZ88}. Early endosome {ECO:0000305}. Late
      endosome {ECO:0000305}.'
