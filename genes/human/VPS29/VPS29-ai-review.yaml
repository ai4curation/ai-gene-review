- id: PMID:11102511
  title: 'Human orthologs of yeast vacuolar protein sorting proteins Vps26, 29, and
    35: assembly into multimeric complexes.'
  findings:
  - statement: Human VPS35, VPS29, and VPS26 assemble into a cytosolic and membrane-associated
      multimeric retromer complex.
    supporting_text: 'We report the cloning and characterization of human orthologs
      of three additional components of the complex: Vps26p, Vps29p, and Vps35p. ...
      Furthermore, hVps35, hVps29, and hVps26 have been found in membrane-associated
      and cytosolic compartments.'
- id: PMID:16732284
  title: The retromer subunit Vps26 has an arrestin fold and binds Vps35 through its
    C-terminal domain.
  findings:
  - statement: VPS26 adopts an arrestin-like two-lobed beta-sandwich fold and binds
      the N-terminus of VPS35.
    supporting_text: The structure of human Vps26A at 2.1-A resolution reveals two
      curved beta-sandwich domains connected by a polar core and a flexible linker.
      Vps26 has an unpredicted structural relationship to arrestins. The Vps35-binding
      site on Vps26 maps to a mobile loop spanning residues 235-246, near the tip
      of the C-terminal domain.
- id: PMID:17891154
  title: Functional architecture of the retromer cargo-recognition complex.
  findings:
  - statement: The C-terminal alpha-helical solenoid of VPS35 wraps around the metallophosphoesterase
      fold of VPS29 to form the rigid scaffold of the retromer cargo-recognition complex.
    supporting_text: Here we report the crystal structure of a VPS29-VPS35 subcomplex
      showing how the metallophosphoesterase-fold subunit VPS29 (refs 14, 15) acts
      as a scaffold for the carboxy-terminal half of VPS35. VPS35 forms a horseshoe-shaped,
      right-handed, alpha-helical solenoid, the concave face of which completely covers
      the metal-binding site of VPS29, whereas the convex face exposes a series of
      hydrophobic interhelical grooves.
