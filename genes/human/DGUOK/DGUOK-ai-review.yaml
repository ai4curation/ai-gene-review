id: Q16854
gene_symbol: DGUOK
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: DGUOK encodes a homodimeric mitochondrial deoxyribonucleoside kinase that uses ATP to phosphorylate
  deoxyguanosine and deoxyadenosine. The precursor has an N-terminal mitochondrial targeting sequence.
  These reactions initiate purine nucleoside salvage in the matrix and help maintain the nucleotide supply
  for mitochondrial DNA synthesis. Deoxyinosine and several nucleoside analogues are also substrates.
  The enzyme favors purine substrates, although low deoxycytidine phosphorylation has been measured in
  vitro. Disease-associated loss of DGUOK activity can compromise mitochondrial DNA maintenance, causing
  mitochondrial DNA depletion syndrome or progressive external ophthalmoplegia with mitochondrial DNA
  deletions.
