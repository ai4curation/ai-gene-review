  original_reference_id: PMID:8692979
  qualifier: involved_in
  review:
    summary: Use the deoxyribonucleoside process matching the assayed substrates.
    action: MODIFY
    reason: The original study assays deoxyguanosine, deoxyadenosine and deoxyinosine phosphorylation.
      The current GO:0008617 definition concerns guanosine/guanine riboside, whereas GO:0046122 explicitly
