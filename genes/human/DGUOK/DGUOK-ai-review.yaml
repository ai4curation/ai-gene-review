- id: PMID:11687801
  title: Mutant mitochondrial thymidine kinase in mitochondrial DNA depletion myopathy.
  findings:
  - statement: Mitochondrial deoxynucleoside salvage supplies precursors for mtDNA synthesis; the DGUOK-specific
      experimental scope is not reconstructed from the abstract alone.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The verified abstract concerns TK2-associated disease and explicitly describes mitochondrial
      dGK purine phosphorylation. Full original assay detail remains inaccessible; independent DGUOK biochemical
      evidence supports the imported annotation without assuming a wrong-gene citation.
- id: PMID:17073823
  title: Kinetic properties of mutant deoxyguanosine kinase in a case of reversible hepatic mtDNA depletion.
  findings:
  - statement: Human DGUOK-dependent dA and dG phosphorylation is directly measurable in mitochondrial-enriched
      preparations; disease variants reduce activity and can alter kinetic behavior.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Original Methods and Results independently read through PMC. Normal cache remains abstract-only.
      Radiochemical dA/dG assays used mitochondria-enriched human fibroblast preparations, with excess
      dC to suppress DCK interference.
- id: PMID:19221117
  title: In vitro supplementation with dAMP/dGMP leads to partial restoration of mtDNA levels in mitochondrial
    depletion syndromes.
  findings:
  - statement: Supplying dAMP and dGMP can partly restore mtDNA in DGUOK-deficient human cell models,
      consistent with bypassing the deficient salvage step.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The verified abstract describes DGUOK-deficient human myotubes and dAMP/dGMP supplementation.
      Original publisher PDF and HTML access failed. The imported localization and salvage assertions
      are assessed with curator deference plus independently established DGUOK chemistry and compartment.
- id: PMID:21630459
  title: Proteomic characterization of the human sperm nucleus.
  findings:
  - statement: DGUOK was detected in isolated mature human sperm nuclei. This is a specialized proteomic
      observation, without an established nuclear catalytic role or isoform assignment.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The paper abstract and the coauthor thesis Appendix 8.2/Table 8.1 were read. The appendix
      explicitly identifies the original supporting catalogue and contains Q16854, 13.4% coverage and
      two peptides, printed page 198. The full paper main text was not recovered.
- id: PMID:23043144
  title: Next-generation sequencing reveals DGUOK mutations in adult patients with mitochondrial DNA multiple
    deletions.
  findings:
  - statement: DGUOK variants reduce normalized deoxyguanosine kinase activity in patient muscle, supporting
      the established enzyme function.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Original Methods, biochemical Results and Table 2 independently read through PMC. Normal
      cache remains abstract-only. Human muscle extracts were assayed with radiolabeled dG and controls
      for DCK interference and specimen quality.
- id: PMID:33961781
  title: Dual proteome-scale networks reveal cell-specific remodeling of the human interactome.
  findings:
  - statement: Tagged DCK and DGUOK co-associate in human cell-line AP-MS; the measurements do not establish
      purified direct binding or a native mitochondrial heterodimer.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The normal cache declares full text but contains only selected sections; complete original
      Methods were separately recovered and read. Four literal IntAct records identify canonical human
      DCK/DGUOK associations, including reciprocal bait orientation in HEK293T.
- id: PMID:34800366
  title: Quantitative high-confidence human mitochondrial proteome and its dynamics in cellular context.
  findings:
  - statement: Complementary human proteomic approaches provide mitochondrial localization evidence; specific
      matrix placement is supplied by independent DGUOK sources.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Genuine cached original strategy and selected Results were read. The DGUOK-specific
      supplementary row was not independently extracted; the curator-assigned mitochondrial localization
      agrees with independent human biochemical evidence. The study alone is not claimed to resolve matrix
      localization.
- id: PMID:40205054
  title: Multimodal cell maps as a foundation for structural and functional genomics.
  findings:
  - statement: The U2OS AP-MS map independently recovers a DCK-DGUOK association, supporting a kinase-partner
      binding classification with co-complex assay limits.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Original U2OS AP-MS Methods and the public study-released NDEx network were read. Exact
      edge 578496 joins DCK bait to DGUOK prey. The fresh IntAct response lacks this PMID, so the study
      network is the independent pair-level source.
- id: PMID:8692979
  title: Cloning and expression of human deoxyguanosine kinase cDNA.
  findings:
  - statement: Human recombinant DGUOK phosphorylates dGuo, dAdo and dIno, with low but measurable dCyd
      activity. Purine preference does not mean absolute exclusion of dCyd.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The independent core consultation visually read all five scanned original pages. The
      unchanged normal cache is abstract-only. Table 1 and Methods establish human recombinant substrate
      phosphorylation; the historical 780-bp ORF is not equated to all modern natural isoforms.
- id: PMID:8706825
  title: Cloning and expression of human mitochondrial deoxyguanosine kinase cDNA.
  findings:
  - statement: Human DGUOK catalyzes purine deoxyribonucleoside phosphorylation in mitochondrial salvage.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Verified abstract and official human identity; full original methods were not recovered.
      The abstract establishes recombinant human enzyme purification, substrate profile and matrix context;
      exact construct details require the official sequence mapping or further original access.
- id: Reactome:R-HSA-74207
  title: dA, dG, or dI + ATP => dAMP, dGMP, or dIMP + ADP (DGUOK)
  findings:
  - statement: DGUOK catalyzes ATP-dependent dA/dG/dI phosphorylation in mitochondrial matrix.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Public event, catalyst activity, dimer and Q16854 component were individually inspected.
      Event R-HSA-74207 → catalyst 74206 → dimer R-HSA-74205 → component R-HSA-53573 explicitly places
      the human catalyst in mitochondrial matrix.
- id: file:human/DGUOK/DGUOK-uniprot.txt
  title: UniProtKB entry Q16854 (DGUOK_HUMAN), Deoxyguanosine kinase, mitochondrial
  findings: []
- id: PMID:11427893
  title: Structural basis for substrate specificities of cellular deoxyribonucleoside kinases.
  findings:
  - statement: Structural comparison distinguishes human dGK from Drosophila dNK and informs substrate
      recognition; it does not establish equal activity of all human alternative products.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Original abstract only; the independent consultation recovered and read the genuine
      two-page erratum. The correction retains dGK Arg118 and corrects a table and unit-cell dimension.
      No uninspected original structural detail is used to negate measured dCyd turnover.
- id: PMID:18007665
  title: Identification of new kinase clusters required for neurite outgrowth and retraction by a loss-of-function
    RNA interference screen.
  findings:
  - statement: Loss-of-function screening links DGUOK to neurite phenotypes, supporting a contextual neuronal
      effect without establishing a protein-kinase signaling mechanism.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The primary abstract and public supplementary figure legends were read. They identify
      DGUOK in the inhibitory-neurite screen and document SH-SY5Y siRNA/neurite measurement. The original
      main text and DGUOK-specific rat validation panel were not recovered; the literal RGD donor IMP
      is preserved.
- id: PMID:30404003
  title: A Screen Using iPSC-Derived Hepatocytes Reveals NAD(+) as a Potential Treatment for mtDNA Depletion
    Syndrome.
  findings:
  - statement: DGUOK loss reduces mtDNA-encoded respiratory proteins, respiration and ATP. Restoration
      by DGUOK expression or downstream interventions demonstrates metabolic dependence, not direct electron-transfer
      catalysis by DGUOK.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete selected original Methods/Results were read. Human CRISPR knockout/rescue and
      rat liver assays separate nucleotide-supply defects from their respiratory consequences.
- id: PMID:10455141
  title: Cloning and characterization of mouse deoxyguanosine kinase. Evidence for a cytoplasmic isoform.
  findings:
  - statement: Mouse Dguok has a mitochondrial form and an N-terminally truncated form with cytoplasmic
      localization, supporting a carefully delimited ortholog source.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The verified primary abstract and current official mouse record were read. The full
      original was not recovered. Mouse full-length and N-terminally truncated forms have distinct localization;
      they are not assigned to human natural product IDs.
- id: file:human/DGUOK/DGUOK-source-guide.md
  title: DGUOK source guide
  findings:
  - statement: Public source and original-assay locators distinguish direct chemistry, contextual observations,
      inferred placement and access limits.
