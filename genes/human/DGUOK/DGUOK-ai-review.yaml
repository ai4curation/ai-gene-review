- term:
    id: GO:0046122
    label: purine deoxyribonucleoside metabolic process
  evidence_type: IDA
  original_reference_id: PMID:8706825
  qualifier: involved_in
  review:
    summary: Purine deoxyribonucleoside phosphorylation is direct pathway participation.
    action: ACCEPT
    reason: DGUOK catalyzes the conversion of purine deoxyribonucleosides to their monophosphates. It
      therefore performs the chemical work of the annotated metabolic process, rather than merely being
      required for a downstream phenotype. The source abstract and independent human substrate assays
      support the activity.
    additional_reference_ids:
