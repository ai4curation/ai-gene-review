    summary: Specify matrix using the combined localization evidence.
    action: MODIFY
    reason: The original PMID:8692979 predicts mitochondrial targeting from the N-terminal sequence and
      prior mitochondrial purification studies; it does not report a new DGUOK imaging experiment. Its
      mitochondrial conclusion is supported independently, and PMID:8706825 plus the human Reactome catalyst
      establish the more precise matrix location. Preserve the original source claim while making the
      combined basis of the refinement explicit.
