- term:
    id: GO:0042775
    label: mitochondrial ATP synthesis coupled electron transport
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  review:
    summary: DGUOK sustains respiratory capacity indirectly through nucleotide supply and mtDNA maintenance.
    action: MARK_AS_OVER_ANNOTATED
    reason: The exact D3ZDE4 donor has valid IMP evidence from PMID:30404003. Its original human knockout/rescue
      experiments and rat liver assays show that DGUOK loss reduces mtDNA-encoded respiratory proteins,
      oxygen consumption and ATP, with restoration by DGUOK expression or downstream interventions. DGUOK
      itself phosphorylates deoxynucleosides; the measured electron transport is performed by respiratory
      complexes. Thus the phenotype is real, but assigning execution of mitochondrial ATP synthesis coupled
      electron transport to the salvage kinase is mechanistically broader than demonstrated. This is an
      assessment of the process assignment, not a rejection of the source experiment or orthology. Unlike
      a negative-regulation term, GO:0042775 explicitly describes transfer of electrons between donors
      and acceptors; nucleotide-supply dependence alone does not establish that role.
    additional_reference_ids:
    - PMID:30404003
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      source_entities:
      - source_id: UniProtKB:D3ZDE4
        source_status: SOURCE_BAD
        comment: RGD IMP/PMID:30404003 measures impaired respiratory complexes and ATP after loss of Dguok.
          The source experimental result is valid, but interpreting that phenotype as the kinase performing
          electron transport conflates upstream nucleotide supply with respiratory chemistry.
        source_label: Dguok
      failure_modes:
      - ROLE_CONFLATION
    supported_by:
    - reference_id: PMID:30404003
      supporting_text: treatment with dAMP and dGMP reversed mtDNA depletion
