- term:
    id: GO:0098554
    label: cytoplasmic side of endoplasmic reticulum membrane
  evidence_type: IC
  original_reference_id: PMID:35926457
  qualifier: located_in
  review:
    summary: >-
      Proposed sub-compartment. UFSP2 is a soluble protease with no transmembrane segment
      or signal peptide that is held on the cytosolic face of the ER membrane by its
      integral-membrane partner ODR4, and it acts there on ER-bound 60S ribosomes. The
      existing annotations stop at the organelle.
    action: NEW
    reason: >-
      Added under the tethering route of ORGANELLES rule 7 (2026-11-11), beside the three
      root GO:0005783 rows, which are kept. GO:0098554 is defined to include proteins
      peripherally associated with the cytoplasmic leaflet and is part_of GO:0005789, so
      it is the more specific statement of where UFSP2 sits. The route's three conditions
      are met. (a) The endogenous protein is at the ER: the curated IDA row from
      PMID:35926457 (UniProt "Endoplasmic reticulum", ECO:0000269). (b) A named integral
      partner binds it: ODR4 is a conserved tail-anchored transmembrane protein, and
      ODR-4 and ODR-8/UfSP2 form a complex at the ER membrane, with human ODR4 and UfSP2
      also co-immunoprecipitating (PMID:24603482, Chen et al. 2014, overexpressed
      proteins). (c) Dependence, shown two ways: worm ODR-8 is released from
      digitonin-permeabilised HeLa cells when expressed alone but partly retained with
      ODR-4 (PMID:24603482, Fig 8F), a partner-dependent release test that also places
      it on the cytosolic face, since digitonin opens only the plasma membrane; and
      endogenous human UFSP2 is markedly reduced in ODR4 knockout cells, which phenocopy
      UFSP2 knockout for RPL26 UFMylation (PMID:35926457). (d) UniProt annotates no
      transmembrane, signal-peptide or transit feature, so UFSP2 is made in the cytosol
      and the cytoplasmic leaflet is the only face it can reach, where its substrate,
      membrane-associated 60S uL24, sits (PMID:38383785). Attribution: the anchoring statements in PMID:35926457
      ("thought to anchor") and PMID:38383785 ("membrane anchor ODR4", ref. 2) both rest
      on Chen et al., so they are not independent corroboration. Caveats - the release
      test used overexpressed worm proteins in HeLa cells, while the human result is
      destabilisation rather than release; the cached text of PMID:35926457
      describes membrane, cytosol and nuclear fractions but no ER-marker control for
      UFSP2 itself; and UniProt also lists cytoplasm and nucleus by similarity to mouse.
      Hence IC rather than IDA, and located_in rather than is_active_in: the is_active_in
      claim is carried by the root IDA and IBA rows, and the face-level location is an
      inference from topology and the partner.
    supported_by:
    - reference_id: PMID:24603482
      supporting_text: ODR-4 is a conserved tail-anchored transmembrane protein
    - reference_id: PMID:24603482
      supporting_text: Thus, ODR-4 and ODR-8 form a physical complex at the ER membrane.
    - reference_id: PMID:24603482
      supporting_text: The physical interaction between human ODR4 and UfSP2 suggests that this
    - reference_id: PMID:24603482
      supporting_text: This was confirmed by demonstrating that ODR-8 was efficiently released from cells by permeabilization of the plasma membrane, but partially retained when co-expressed with ODR-4
    - reference_id: PMID:35926457
      supporting_text: UFSP2 interacts with odorant response abnormal protein-4 (ODR4), a transmembrane protein that is localized to the ER membrane
    - reference_id: PMID:35926457
