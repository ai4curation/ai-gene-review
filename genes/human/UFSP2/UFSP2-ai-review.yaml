- description: UFM1-specific cysteine (thiol-dependent) protease that removes UFM1 from conjugated substrates (deUFMylation), most prominently RPL26/uL24 on ER-associated 60S ribosomal subunits, and also processes pro-UFM1; catalytic residue Cys302.
