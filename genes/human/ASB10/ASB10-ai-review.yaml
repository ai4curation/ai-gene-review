  review:
    summary: The curated HuRI IPI annotation reports ASB10 binding to LCN2. Retain this supported association
      as non-core protein binding; no more specific ASB10 molecular function is established for this pair.
    action: KEEP_AS_NON_CORE
    reason: The preserved IntAct-derived GOA row identifies P80188, and the reviewed ASB10 UniProt record
      carries the same IntAct-derived partner edge with NbExp=3. This is pair-specific curated interaction
      metadata, not an independent source or proof of three independent physiological replications. The
      HuRI paper describes human ORF yeast two-hybrid screening, pairwise retesting and sequence confirmation.
      Its exact ASB10 target-table row, construct orientation and pair-specific orthogonal controls were
      not independently inspected; the study-level quote supports the screening protocol only. The association
      does not establish that LCN2 is an ASB10 ubiquitination substrate or that ASB10 has receptor or
      transporter activity. In the absence of contrary evidence or a supported finer molecular-function
      assignment, the source-specific association is retained under the standing project instruction for
      correct generic binding.
    supported_by:
    - reference_id: PMID:32296183
      supporting_text: followed by pairwise verification by quadruplicate retesting and sequence confirmation.
