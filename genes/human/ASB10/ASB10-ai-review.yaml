id: Q8WXI3
gene_symbol: ASB10
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ASB10 is an ankyrin-repeat and SOCS-box protein, a substrate-recognition subunit of an Elongin-Cullin5-SOCS-box
  (ECS) E3 ubiquitin ligase. It ubiquitylates the tumour endothelial marker TEM8 for degradation in breast
  cancer cells. In the eye it is expressed in the trabecular meshwork, ciliary body and retinal ganglion
  cells, with cytoplasmic and nuclear pools. Its silencing reduces aqueous outflow facility, and ASB10
  variants are associated with primary open-angle glaucoma. In mouse heart it promotes pathological hypertrophy
  by stabilizing HSP70.
