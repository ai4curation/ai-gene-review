    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text; primary human trabecular meshwork cells.
- id: PMID:40399264
  title: Asb10 accelerates pathological cardiac remodeling by stabilizing HSP70.
  findings:
  - statement: Asb10 stabilizes HSP70 by competitively inhibiting STUB1-mediated degradation, exacerbating
      cardiac hypertrophy.
    supporting_text: Collectively, these findings demonstrate that Asb10 stabilizes HSP70 via competitively
      inhibiting STUB1-mediated ubiquitin-dependent degradation, thereby exacerbating cardiac hypertrophy,
      highlighting the role of Asb10 in hemodynamic stress-induced cardiac hypertrophy and heart failure.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text; mouse heart and rat cardiomyocytes.
