      aggresomes (histone deacetylase 6 [HDAC6] and heat shock protein 70 [HSP70]), autophagosomes (light
      chain 3 [LC3] and p62), amphisomes (Rab7), and lysosomes (lysosomal-associated membrane protein
      1 [LAMP1]).'
