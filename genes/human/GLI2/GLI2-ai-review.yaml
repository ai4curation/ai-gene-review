core_functions:
- description: GLI2 is the activator-forming effector of Hedgehog signaling. Once Smoothened 
    activation releases it from Suppressor of fused and it enters the nucleus, GLI2 binds GLI 
    consensus sites in target promoters and activates RNA polymerase II transcription, converting 
    the amount and duration of Hedgehog ligand exposure into target-gene output. GLI1 is a direct 
    target, establishing the amplifying feedback loop that sustains the response.
  molecular_function:
    id: GO:0001228
    label: DNA-binding transcription activator activity, RNA polymerase II-specific
  directly_involved_in:
  - id: GO:0007224
    label: smoothened signaling pathway
  - id: GO:0045944
    label: positive regulation of transcription by RNA polymerase II
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:15994174
    supporting_text: Zinc finger-containing Gli proteins mediate responsiveness to Hedgehog (Hh) 
      signaling, with Gli2 acting as the major transcriptional activator in this pathway in mice.
  - reference_id: PMID:12165851
    supporting_text: Detailed time course experiments monitoring the transcriptional response of 
      keratinocytes either to GLI1 or to GLI2 suggest that GLI1 is a direct target of GLI2, while 
      activation of GLI2 by GLI1 is likely to be indirect.
  - reference_id: PMID:15175043
    supporting_text: These data suggest that GLI2 directly activates GLI1 and that retrovirally 
      expressed GLI2 induces expression of endogenous GLI1 in human primary keratinocytes.
  - reference_id: PMID:38968120
    supporting_text: Overall, these results indicate that the DYRK2-dependent phosphorylation of 
      GLI2 and GLI3 facilitates their dissociation from SUFU and their subsequent nuclear 
      translocation at a step downstream of SMO, resulting in the activation of Hh signaling.
- description: The five tandem C2H2 zinc fingers of GLI2 recognise the GLI consensus sequence in RNA
    polymerase II cis-regulatory regions. This has been shown on naked DNA by band shift and EMSA at
    the GLI1 and FAM38B promoters and in chromatin by ChIP, and it is the DNA-binding capability 
    that both the activating and the repressing outputs of GLI2 depend on.
  molecular_function:
    id: GO:0000978
    label: RNA polymerase II cis-regulatory region sequence-specific DNA binding
  directly_involved_in:
  - id: GO:0006357
    label: regulation of transcription by RNA polymerase II
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:15175043
    supporting_text: Using band shift and luciferase reporter assays, we now show that GLI2 binds 
      the GLI-binding consensus sequence in the GLI1 promoter.
  - reference_id: PMID:26565916
    supporting_text: Synthesized biotin-labeled 21bp oligos containing the wild-type or mutant 
      Gli2-binding site in the FAM38B promoter were used as the probes.
  - reference_id: PMID:26565916
    supporting_text: Using the chromatin immunoprecipitation (ChIP) assay, we found that FOXC1 
      enhanced the binding of Gli2 to the FAM38B promoter in MDA-MB-231 cells, and this enhancement 
      was eliminated by Gli2-knockdown (Figure 5A).
proposed_new_terms: []
suggested_questions:
- question: Should the processed GLI2R chain carry its own GO:0001227 (DNA-binding transcription 
    repressor activity, RNA polymerase II-specific) annotation, or is the existing GO:0000122 on 
    full-length GLI2 the right representation? UniProt defines GLI2R as a separate chain but asserts
    its generation only by similarity to mouse Gli2, and calls it the minor form.
  experts: []
- question: GLI2 is the substrate of several pathway kinases (STK36, ULK3, DYRK2, CDK1) and of the 
    SCF(BTRC) and SPOP:CUL3 ligases. GO has no mechanism for asserting a substrate relationship on 
    the substrate; it lives on the enzyme as has_input. Is the enzyme-side modelling in the cached 
    GO-CAMs (693b3c0900001575, 696022cd00001523, 696022cd00001645) considered complete for GLI2, or 
    should the regulatory inputs be made discoverable from the GLI2 record too?
  experts: []
- question: GLI2 currently carries five distinct extranuclear compartments (cilium, ciliary tip, 
    ciliary base, ciliary basal body, centrosome) plus cytosol and cytoplasm, from a mixture of 
    immunofluorescence curation, Reactome reactions and ARBA. Would a single transit-step 
    representation be more informative than seven independent CC rows, none of which is where GLI2 
    exerts its molecular function?
  experts: []
suggested_experiments:
- hypothesis: The nucleolar signal reported for GLI2 by immunofluorescence curation (GO_REF:0000052)
    is an imaging artefact rather than a functional localisation.
  description: Repeat the immunofluorescence with two independent GLI2 antibodies plus a 
    GLI2-knockout or knockdown control in the same cell line, and test whether any nucleolar signal 
    survives. Pair this with GLI2 ChIP-seq to ask whether any rDNA or Pol I-transcribed locus is 
    bound. A signal that disappears on knockdown and no rDNA occupancy would settle the row as an 
    artefact.
  experiment_type: immunofluorescence and ChIP-seq
- hypothesis: The increase in keratinocyte DNA synthesis on GLI2 expression (PMID:12165851) is a 
    consequence of GLI2-driven target-gene transcription and not of any GLI2 activity at replication
    origins.
  description: Compare wild-type GLI2 with a DNA-binding-deficient zinc-finger mutant and with a 
    transactivation-domain deletion in the same keratinocyte proliferation assay, and run GLI2 
    ChIP-seq alongside origin mapping. If DNA synthesis tracks transactivation competence and GLI2 
    shows no enrichment at origins, the positive regulation of DNA replication annotation is 
    confirmed as a downstream proliferation readout.
  experiment_type: structure-function and genomics
