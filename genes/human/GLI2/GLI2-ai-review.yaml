- term:
    id: GO:0000122
    label: negative regulation of transcription by RNA polymerase II
  evidence_type: IMP
  original_reference_id: PMID:15994174
  qualifier: involved_in
  review:
    summary: 'Full-length GLI2 carries an N-terminal repressor domain: in reporter assays the full-length
      protein is up to 30-fold less active than GLI2DeltaN, and disease-associated mutants that retain
      this domain behave dominant-negatively. GLI2 therefore has a genuine repressive output on RNA polymerase
      II transcription (PMID:15994174).'
    action: KEEP_AS_NON_CORE
    reason: The repressive activity is real and experimentally demonstrated, but it is the minor arm
      of GLI2 function. UniProt states that the activator form 'constitutes the major form of GLI2' 
      while the processed repressor chain GLI2R 'plays a minor role', and the division of labour in 
      the family assigns the principal repressor role to GLI3. Retained, but off the core set so 
      that the activator terms are not diluted.
    supported_by:
    - reference_id: PMID:15994174
      supporting_text: In vitro, transcriptional activity of full-length GLI2 is up to 30 times 
        lower than that of GLI2DeltaN (previously thought to represent the entire GLI2 protein), 
        revealing the presence of an amino-terminal repressor domain in the full-length protein.
    - reference_id: PMID:15994174
      supporting_text: Our results establish the presence of an amino-terminal transcriptional 
        repressor domain that plays a critical role in modulating the function of wild-type GLI2 and
        is essential for dominant-negative activity of a GLI2 mutant associated with human disease.
