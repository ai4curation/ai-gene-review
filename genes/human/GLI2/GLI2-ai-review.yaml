id: P10070
gene_symbol: GLI2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'GLI2 encodes a 1586-residue C2H2 zinc-finger transcription factor, one of three vertebrate
  paralogs of Drosophila Cubitus interruptus and the principal activator-forming member of the family.
  Five tandem zinc fingers (one degenerate) bind the GLI consensus sequence in RNA polymerase II cis-regulatory
  regions; an N-terminal region confers transcriptional repressor activity while the C-terminal region
  mediates activation, so the protein is bifunctional and its output depends on which form predominates.
  GLI2 is the terminal effector of Hedgehog signaling. In unstimulated cells Suppressor of fused sequesters
  full-length GLI2 in the cytoplasm, and protein kinase A-primed phosphorylation followed by CK1 and GSK3B
  phosphorylation, SCF(BTRC)-dependent ubiquitination and limited proteolysis convert a minor fraction
  into the repressor form GLI2R while degrading the rest. When a Hedgehog ligand activates Smoothened,
  GLI2 accumulates transiently at the tip of the primary cilium, is phosphorylated on conserved serines
  by Fused-family kinases (STK36, ULK3), DYRK2 and CDK1, dissociates from Suppressor of fused and enters
  the nucleus, where it binds target promoters and activates transcription. Direct targets include GLI1,
  which amplifies the response, and the pathway''s own negative regulators PTCH1 and HHIP. Among the vertebrate
  paralogs GLI2 supplies most of the activator output while GLI3 supplies most of the repressor output,
  and GLI1 is itself a GLI2 target rather than an upstream input. Through this activity GLI2 contributes
  to ventral midline and floor-plate formation, dorsoventral patterning of the neural tube, and development
  of the pituitary, skeleton, lung, gut, tooth, kidney, mammary gland and hair follicle. Heterozygous
  loss-of-function variants cause holoprosencephaly 9 and Culler-Jones syndrome, both featuring anterior
  pituitary deficiency, and sustained GLI2 activity drives Hedgehog-dependent tumors including basal cell
  carcinoma.'
