  review:
    summary: Retain the targeted DNAAF2 assembly-factor interaction.
    action: KEEP_AS_NON_CORE
    reason: Full-length pairwise yeast two-hybrid and tagged HEK293 co-immunoprecipitation establish the
      human DNAAF4–DNAAF2 interaction; PMID:29844425 independently finds strong association for experimental
      DYX1C1 iso-a. GO:0051087 concerns binding to a chaperone partner, not folding activity of DNAAF4.
      DNAAF2 is established here as an assembly factor and HSP-associated cofactor; these experiments
      do not establish that DNAAF2 itself recognizes nascent or unfolded clients as specified by that
      partner class. Retain this positive pair as non-core protein binding. Separate DNAAF4 associations
      with HSP70/HSP90 support the chaperone-binding core, without changing this source partner or implying
      a motor activity.
    supported_by:
    - reference_id: PMID:23872636
    - reference_id: PMID:29844425
