- id: file:human/DNAAF4/DNAAF4-source-guide.md
  title: DNAAF4 evidence and assay scope
  findings: []
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Authored navigation to the cited primary sources and their assay/access limits. The
      guide is not independent experimental evidence and is not used in supported_by.
core_functions:
- description: Associates with protein-folding chaperones while supporting cytoplasmic preassembly of
    outer and inner axonemal dynein arms with DNAAF2 and other assembly factors. Human-cell HSP70/HSP90
    associations and mouse tissue chaperone co-immunoprecipitation support the binding function; they
    do not establish an autonomous folding reaction or a purified direct interface. DynAP localization
    is supported by tagged Xenopus ortholog experiments.
  directly_involved_in:
  - id: GO:0036158
    label: outer dynein arm assembly
  - id: GO:0036159
    label: inner dynein arm assembly
  locations:
  - id: GO:0005829
    label: cytosol
  - id: GO:0120293
    label: dynein axonemal particle
  supported_by:
  - reference_id: PMID:23872636
    supporting_text: showed disruptions of outer and inner dynein arms
  - reference_id: PMID:23872636
    supporting_text: DYX1C1 and DNAAF2 interact directly by yeast two-hybrid assay
  - reference_id: PMID:29844425
    supporting_text: all the TPR-containing proteins interacted with HSP70, HSP90 and STIP1
  - reference_id: PMID:30561330
  molecular_function:
    id: GO:0051087
    label: protein-folding chaperone binding
  knowledge_gaps:
  - gap_statement: The direct client-contact and chaperone-cycle steps through which DNAAF4 promotes dynein-arm
      preassembly remain unresolved. It is not established whether DNAAF4 recruits clients, organizes
      assembly-factor contacts, changes HSP70/HSP90 cycling, or combines these contributions.
    boundary: Dynein-arm assembly defects, specific DNAAF2 association and controlled HSP70/HSP90 association
      are established. The cited DNAAF4 experiments measure association and assembly phenotypes rather
      than purified client folding or an ATPase-regulatory reaction. The R2SP client assays in PMID:29844425
      concern PIH1D2, not DNAAF4.
    gap_kind:
    - BIOLOGY
    dark_aspect: RESIDUAL_SUBGAP
    status: OPEN
    significance: A defined mechanism would connect the measured chaperone associations to productive
      dynein assembly without assigning an unmeasured catalytic activity.
    resolution: Separate DNAAF4-dependent physical contacts from chaperone-cycle and client-assembly effects
      in a defined reconstitution, then test interaction-selective variants in an airway-cell rescue assay.
    provenance:
    - reference_id: PMID:23872636
    - reference_id: PMID:29844425
suggested_questions:
- question: Which endogenous cell types use DNAAF4-dependent estrogen-receptor regulation, and is that
    role mechanistically separate from dynein preassembly?
- question: How do the natural 381- and 376-residue products differ in dynein assembly, localization and
    stability beyond the paper-specific interaction assays?
- question: Does endogenous human DNAAF4 partition into DynAPs with the same dynamics as the tagged Xenopus
    protein?
- question: How do cell context, protein processing and perturbation timing explain the different nuclear-localization
    and neuronal-migration observations?
suggested_experiments:
- hypothesis: Specific DNAAF4 contacts with chaperones and assembly factors promote productive dynein
    preassembly.
  description: Reconstitute human DNAAF4 with DNAAF2, HSP70/HSP90 and defined dynein clients. Measure
    direct association, chaperone ATP turnover, client solubility/folding and assembly as separate outputs,
    with no-DNAAF4 and chaperone-only controls. Compare contact-selective CS/TPR variants while checking
    their abundance and folding. Test whether the same variants rescue dynein-arm incorporation and beating
    in DNAAF4-deficient human airway cultures; a change in one output should not be assumed to establish
    the others.
  experiment_type: Defined biochemical reconstitution followed by human airway-cell rescue
