  evidence_type: IPI
  qualifier: enables
  original_reference_id: PMID:29844425
  review:
    summary: Controlled human-cell experiments support DNAAF4 association with protein-folding chaperones.
    action: NEW
    reason: Human DYX1C1 constructs were tested with HSP70 and HSP90 in pairwise LUMIER co-immunoprecipitation
      assays in HEK293 cells. Unrelated-protein and no-antibody controls support specific association
      despite low co-IP efficiencies. This supplies the chaperone-binding assertion represented in the
      existing assembly core; it does not establish a purified direct interface, DNAAF4 folding activity
      or chaperone ATPase regulation. The assayed isoform labels are not assigned to official accessions
      without complete clone-sequence authentication. The imported DNAAF2, DNAAF6 and ZMYND10 source pairs
      remain distinct.
