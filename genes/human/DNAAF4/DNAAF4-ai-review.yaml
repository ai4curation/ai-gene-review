id: Q8WXU2
gene_symbol: DNAAF4
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: DNAAF4, also known as DYX1C1, is a CS-domain and tetratricopeptide-repeat protein that supports
  cytoplasmic preassembly of outer and inner axonemal dynein arms. It associates with DNAAF2, other assembly
  factors and protein-folding chaperones. Tagged Xenopus ortholog experiments support localization to
  dynein axonemal particles, where dyneins and chaperones concentrate. Deficient assembly impairs motile-ciliary
  beating and causes primary ciliary dyskinesia, often with laterality defects. DNAAF4 also has context-dependent
  nuclear and neuronal localization; cellular experiments support association with estrogen receptors
  and CHIP, accompanied by reduced estrogen-receptor abundance and signaling.
alternative_products:
- name: '1'
  id: Q8WXU2-1
  description: Canonical 420-residue protein with an N-terminal CS domain and three C-terminal TPR repeats.
    The 2018 experimental iso-a has the same length and domain organization.
- name: '2'
  id: Q8WXU2-2
  sequence_note: VSP_011822, VSP_011823
  description: A 381-residue product retaining the CS domain, with an alternative distal TPR-region sequence
    and tail. The 2018 iso-c has matching length and domain organization, but complete experimental-clone
    sequence equivalence was not established.
- name: '3'
  id: Q8WXU2-3
  sequence_note: VSP_041379
  description: A 376-residue product retaining the CS domain, with an alternative sequence replacing the
    distal TPR region and tail. The 2018 iso-b has matching length and domain organization; its dynein-assembly
    activity is not established by the interaction comparison alone.
