      construct species and full Methods remain unresolved.
    supporting_text: 'the ANXA11

      Ct directly binds lipid vesicles and RNA simultaneously.'
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete actual frontmatter and abstract only; no claim of inspected original full Methods,
      construct species or numerical affinities. Abstract reports calcium-dependent simultaneous C-terminal
      RNA and lipid-vesicle binding using complementary biochemical/biophysical assays. It challenges
      an exclusive N-terminal RNA-interaction model, but unresolved construct species and inaccessible
      Methods prevent using it as the sole direct-human evidence.
- id: PMID:42574611
  title: Sorcin couples Annexin A11 recruitment to ESCRT-III assembly for plasma membrane repair.
  full_text_unavailable: false
  findings:
  - statement: ANXA11 recruits sorcin to model membranes in a purified calcium-containing system, alongside
      human-cell recruitment evidence.
    supporting_text: sorcin binds directly and specifically to ANXA11 and that ANXA11 is sufficient to
      recruit sorcin to membranes in the presence of Ca2+
    full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete actual frontmatter and abstract; original Results through Figures 6-8, sequential
      recruitment, purified liposome flotation and full Discussion; targeted cell culture, constructs,
      CRISPRi, membrane injury, microscopy, siRNA, protein purification, endogenous HCT116 co-IP and liposome-flotation
      Methods. Earlier original Results through Figure 6 opening were read externally. Supplementary image
      pixels and uninspected screening-table entries remain outside scope. Human U2OS injury recruitment
      and ANXA11 knockdown support a damage-associated plasma-membrane pool. Actual Figure 8 adds purified
      calcium-dependent ANXA11 recruitment of sorcin to liposomes, with sorcin alone and ANXA2 comparison
      controls; this extends the previously read co-IP evidence. Recombinant His6-ANXA11 is described
      as purchased from Bio-Techne without species/catalogue in the inspected passage, so HeLa-derived
      human constructs in 40118863 remain the strongest species-resolved NEW anchor. Endogenous HCT116
      co-IP is human. A Discussion domain-assignment sentence reverses the ANXA11/ALIX sorcin-domain assignments
      stated in the Abstract/Results; avoid propagating that isolated reversal and keep unnecessary domain
      mapping out of the review. Viral-budding and calpain suggestions are not demonstrated ANXA11 process
      activities.
