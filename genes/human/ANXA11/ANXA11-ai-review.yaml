id: P50995
gene_symbol: ANXA11
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Annexin A11 is a calcium-responsive, peripheral phospholipid-binding protein with a long
  low-complexity N-terminal region and a C-terminal annexin-repeat domain. It associates dynamically with
  nuclear, cytoplasmic and membrane compartments, forms condensates, and couples ribonucleoprotein granules
  to lysosomal membranes. ALG-2 and S100A6 modulate its membrane-associated condensates, and it recruits
  sorcin to damaged plasma membrane during repair. In dividing human cells it is a stable component of
  the midbody and contributes to completion of cytokinesis. Pathogenic ANXA11 variants are associated
  with amyotrophic lateral sclerosis and can perturb protein assembly and intracellular trafficking.
