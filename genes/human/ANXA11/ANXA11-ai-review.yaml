    label: protein-membrane adaptor activity
  evidence_type: IDA
  original_reference_id: PMID:40118863
  qualifier: enables
  review:
    summary: Human ANXA11 directly couples protein-containing RNA granules to lipid membranes.
    action: NEW
    reason: The original Methods identify full-length ANXA11 cloned from HeLa cDNA and purified after
      tag cleavage. Full-length ANXA11-coated giant unilamellar vesicles recruit isolated G3BP1-marked
      RNP granules; naked vesicles, annexin-repeat-domain-coated vesicles and purified G3BP1 alone do
      not reproduce this coupling. ANXA11 therefore performs the membrane-adaptor step, rather than merely
      being necessary for transport. This single specific molecular function covers the direct protein-complex/membrane
      connection; no generic adaptor ancestor or new biological process is added. Independent PMID:31539493
      reconstitutes granule-liposome tethering, and PMID:42574611 demonstrates sorcin recruitment to liposomes,
      with their individual construct and assay limits retained.
