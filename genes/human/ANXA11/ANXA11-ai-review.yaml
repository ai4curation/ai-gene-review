- id: PMID:31539493
  title: RNA Granules Hitchhike on Lysosomes for Long-Distance Transport, Using Annexin A11 as a Molecular
    Tether.
  full_text_unavailable: false
  findings:
  - statement: ANXA11 and calcium directly enable isolated RNP granules to contact model lipid membranes.
    supporting_text: addition of both ANXA11 and calcium promoted contact between G3BP1-positive RNA granules
      and liposomes
    full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete actual frontmatter and abstract; targeted original Results/Figure 2 and Figure
      6 captions on phase separation, lipid binding and direct RNP-liposome tethering; original plasmid,
      protein-expression/purification, droplet, RNA-granule/liposome-reconstitution and liposome-preparation
      Methods. Not the entire duplicated extraction, all neuronal Methods, supplementary tables or image
      pixels. Purified ANXA11 plus calcium permits isolated G3BP1 granules to bind phosphoinositide-containing
      liposomes, whereas either alone does not. The reconstitution is distinct from neuronal cotransport.
      Methods identifies SH-SY5Y granule cores and ANXA11 1-505 constructs; explicit human P50995 modeling
      and human imaging-plasmid corroboration do not independently identify every purified reagent. Figure
      6/Results name PI3P, while the generic liposome-preparation recipe names PI(3,5)P2; retain assay-specific
      descriptions or use phosphoinositide-containing liposomes rather than silently merging formulations.
- id: PMID:40118863
  title: ANXA11 biomolecular condensates facilitate protein-lipid phase coupling on lysosomal membranes.
  full_text_unavailable: false
  findings:
  - statement: Purified human ANXA11 couples isolated RNP granules to model membranes, with full-length
      and negative-control dependence.
    supporting_text: Co-incubation of the FAPS-purified RNP granules with ANXA11-coated GUVs results in
      accumulation of the RNP granules onto the GUV surface
    full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete actual frontmatter and abstract; original Methods on HeLa-cDNA constructs,
      purification and targeted phase assays; Results/Figure 6 on isolated RNP-granule recruitment to
      GUVs, ALG2/CALC effects, mechanics and living U2OS lysosome experiments. Earlier publisher targeted
      Results/Methods including FAPS and lipid recipes also read. Supplementary image pixels and every
      structural/analysis detail not inspected. Original Methods explicitly derives ANXA11 1-505, LCD
      1-185 and ARD 186-505 from HeLa cDNA. Full-length purified ANXA11 coats GUVs and recruits FAPS-isolated
      G3BP1-marked RNP granules; naked GUVs, ARD-coated GUVs and purified G3BP1 alone do not reproduce
      that coupling. This directly supports human protein-membrane adaptor activity, not merely necessity.
      ALG2 and CALC regulate coupling; mixed-membrane DOPE measurements do not establish phosphatidylethanolamine
      specificity. Hypotonic lysosome swelling is an experimental perturbation; inferred axonal resistance
      to shear remains a physiological interpretation.
- id: PMID:42364743
  title: Annexin A11 C-terminal domain reveals calcium-dependent co-binding to RNA and lipid vesicles.
  full_text_unavailable: true
  findings:
