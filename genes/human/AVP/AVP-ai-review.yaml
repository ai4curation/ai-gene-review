id: P01185
gene_symbol: AVP
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: AVP encodes the vasopressin-neurophysin 2-copeptin preprohormone,
  which is processed in neurosecretory vesicles to the nonapeptide
  Arg-vasopressin, its carrier neurophysin 2, and copeptin. Mature
  Arg-vasopressin is stored in posterior-pituitary dense-core granules until
  secretion and then acts extracellularly as an antidiuretic and vasoactive
  neurohypophyseal hormone by binding AVPR2, AVPR1A and AVPR1B. Its V2 receptor
  activity drives renal collecting-duct water reabsorption through Gs and cAMP,
  while V1 receptors couple the hormone to vasoconstriction and selected central
  neuroendocrine and behavioral responses.
