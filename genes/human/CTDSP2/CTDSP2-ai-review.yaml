  review:
    summary: CTD dephosphorylation contributes directly to regulation of RNA polymerase II transcription.
    action: ACCEPT
    reason: The CTD phosphorylation cycle controls transcriptional progression, and SCP-family phosphatase
      perturbation alters transcription. The inferred process is consistent with CTDSP2 catalysis rather
      than being a generic phenotype-only association.
    supported_by:
