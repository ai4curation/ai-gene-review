core_functions:
- description: Mg2+-dependent, aspartate-nucleophile dephosphorylation of phospho-Ser5 in the RNA polymerase
    II CTD heptad repeats at promoters, restraining promoter clearance and repressing transcription of
    target genes (for example AR- and REST-regulated genes).
