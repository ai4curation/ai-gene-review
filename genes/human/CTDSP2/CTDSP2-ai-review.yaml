- term:
    id: GO:0030514
    label: negative regulation of BMP signaling pathway
  evidence_type: IDA
  original_reference_id: PMID:16882717
  review:
    summary: CTDSP2 terminates BMP signaling by dephosphorylating the receptor-phosphorylated C-terminus
      of Smad1 in the nucleus.
    action: NEW
    reason: 'Participation test: CTDSP2 itself performs the inactivating step (removal of the activating
      C-terminal phosphates of Smad1), so this is not a substrate or necessity claim. Human SCP2 selectively
      dephosphorylated Smad1 and inhibited BMP/Smad1-dependent transcription, and SCP1/SCP2 depletion
      prolonged BMP-induced Smad1 phosphorylation in human cells. The only GOA row from this paper is
      an IntAct IPI, so the absence of a process annotation reflects absent GO curation rather than a
      curator decision. Comparator check: the Smad2/3 C-terminal phosphatase PPM1A carries the analogous
      negative regulation of transforming growth factor beta receptor signaling pathway (GO:0030512, IDA,
      PMID:16751101), while no SCP paralog yet carries the BMP term; flagged as a suggested question.
      Part of the loss-of-function data combine SCP1 and SCP2 knockdown.'
    supported_by:
    - *id001
    - *id010
