id: O14595
gene_symbol: CTDSP2
product_type: PROTEIN
status: IN_PROGRESS
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CTDSP2 is a small C-terminal-domain phosphatase of the FCP/SCP family. Its aspartate-dependent
  phosphatase domain removes phosphate from serine residues of the RNA polymerase II C-terminal heptad
  repeats, with preference for Ser5. It acts in nuclear transcriptional regulation and belongs to the
  SCP phosphatases associated with REST-dependent repression of neuronal genes in non-neuronal cells.
