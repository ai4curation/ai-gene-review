  - RHEA:47004
  - EC:3.1.3.16
  review:
    summary: Protein serine/threonine phosphatase activity is correct and is the most precise existing
      term that covers both known substrate classes (RNA polymerase II CTD and Smad1 C-terminal phosphoserines).
    action: ACCEPT
    reason: CTDSP2 carries the FCP1-homology HAD-family catalytic domain (residues 97-255) with the DXDX(T/V)
      nucleophile Asp107 and proton donor Asp109, and SCP-family enzymes dephosphorylate phosphoserine
      in the RNA polymerase II CTD heptad repeats (PMID:12721286). Human SCP2 also dephosphorylates the
      C-terminal SSXS phosphoserines of Smad1 (PMID:16882717), a non-CTD protein substrate for which GO
      has no substrate-specific child term. GO:0008420 (is_a this term) captures the CTD activity; this
      broader term remains as precise as warranted for the Smad1 activity, so it is not refined away.
