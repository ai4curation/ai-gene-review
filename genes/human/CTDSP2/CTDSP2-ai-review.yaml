suggested_questions:
- question: None of the SCP paralogs (CTDSP1, CTDSP2, CTDSPL) carries a BMP-signalling process annotation
    despite PMID:16882717; should GO curators annotate negative regulation of BMP signaling pathway to
    the family, and is it inherited from the SCP ancestral node?
- question: Which genes in non-neuronal cells depend specifically on CTDSP2 rather than on redundant CTDSP1/CTDSPL
    for CTD Ser5 dephosphorylation?
suggested_experiments:
- description: CTDSP2-only knockout (versus CTDSP1/CTDSPL single and compound knockouts) in a BMP-responsive
    cell line, with phospho-Smad1 kinetics and catalytic-dead (D107A) rescue, to separate CTDSP2-specific
    from redundant SCP activity.
