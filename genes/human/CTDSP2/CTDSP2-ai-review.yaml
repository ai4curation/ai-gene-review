    summary: RNA polymerase II CTD heptapeptide repeat phosphatase activity is the defining catalytic
      activity of the small CTD phosphatases.
    action: ACCEPT
    reason: Yeo et al. (2003) describe the SCP family as RNAPII CTD phosphatases that prefer phospho-Ser5;
      UniProt cites this paper (ECO:0000269) for the CTDSP2 Ser5 CTD phosphatase function. The cached
      abstract foregrounds SCP1 and full text is not available locally, so the experimental annotation
