id: O14595
gene_symbol: CTDSP2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CTDSP2 (SCP2, OS4, NIF2) is a small nuclear protein phosphatase of the FCP/SCP branch of
  the haloacid dehalogenase (HAD) superfamily. Its C-terminal FCP1-homology domain uses a Mg2+-dependent
  DXDX(T/V) motif, with Asp107 forming a phosphoaspartyl intermediate, to hydrolyse phosphoserine on protein
  substrates. Like its paralogs CTDSP1 and CTDSPL, it dephosphorylates the C-terminal heptad repeats of
  the RNA polymerase II largest subunit with a preference for phospho-Ser5, and it is recruited to promoters
  by transcription factors such as the androgen receptor and REST, where it restrains promoter clearance
  and contributes to silencing of neuronal genes in non-neuronal cells. CTDSP2 also removes the activating
  C-terminal phosphates from Smad1 in the nucleus, terminating BMP signalling. CTDSP2 is a FOXO target
  gene, and its intron hosts miR-26a-2.
