- term:
    id: GO:0006357
    label: regulation of transcription by RNA polymerase II
  evidence_type: IEA
  original_reference_id: GO_REF:0000108
  qualifier: involved_in
  supporting_entities:
  - GO:0008420
  review:
    summary: CTDSP2 regulates RNA polymerase II transcription, and the evidence indicates the direction
      is negative.
    action: MODIFY
    reason: This IEA is a logical inference from GO:0008420 and is correct but less specific than the
      evidence. CTDSP2 attenuates androgen- and glucocorticoid-receptor-dependent transcription and its
      silencing increases PSA transcription with earlier Ser5 CTD phosphorylation (PMID:16724108); SCPs
      recruited by REST silence RE-1-containing neuronal genes (PMID:15681389); UniProt summarizes CTDSP2
      as a negative regulator of RNA polymerase II transcription. CTDSP2 does the work in these processes
      by dephosphorylating the polymerase CTD, so negative regulation of transcription by RNA polymerase
      II is the supported refinement.
    supported_by:
    - *id003
    - &id009
      reference_id: PMID:16724108
      supporting_text: Ser 5 phosphorylation of the RNA polymerase II CTD, a process necessary for initiation
        of transcription elongation, occurred significantly earlier in SCP2-silenced than parental LNCaP
        cells.
    - *id004
    - reference_id: file:human/CTDSP2/CTDSP2-uniprot.txt
      supporting_text: Negatively regulates RNA polymerase II transcription
    proposed_replacement_terms:
    - id: GO:0000122
      label: negative regulation of transcription by RNA polymerase II
