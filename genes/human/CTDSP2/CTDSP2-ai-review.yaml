- term:
    id: GO:0008420
    label: RNA polymerase II CTD heptapeptide repeat phosphatase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000954535
  - UniProtKB:O14595
  - UniProtKB:Q9GZU7
  review:
    summary: RNA polymerase II CTD heptapeptide repeat phosphatase activity is the defining catalytic
      activity of the small CTD phosphatases.
    action: ACCEPT
    reason: The PAINT IBD for GO:0008420 sits at PANTHER node PTN000954535, seeded by experimental annotations
      of human CTDSP2 (O14595) and CTDSP1 (Q9GZU7); CTDSP2 descends from that node (PTHR12210 subfamily
      SF187, whereas CTDSP1 is SF139 and CTDSPL SF43, all inside the SCP clade). The target appearing
      in its own WITH/FROM is the expected marker that it has its own experimental grounding (PMID:12721286),
      not circularity. The catalytic Asp107/Asp109 DXDX(T/V) motif is intact, so there is no evidence
      of loss in this lineage. PAINT propagated only the MF from this node and no process or location
      terms; that restraint is respected here.
    supported_by:
    - &id008
      reference_id: file:human/CTDSP2/CTDSP2-uniprot.txt
      supporting_text: Preferentially catalyzes the dephosphorylation of 'Ser-5' within the tandem 7 residue
        repeats in the C-terminal domain (CTD) of the largest RNA polymerase II subunit POLR2A.
    - *id005
    - *id006
    - *id007
