- term:
    id: GO:0005504
    label: fatty acid binding
  evidence_type: IDA
  original_reference_id: PMID:16687662
  qualifier: enables
  negated: true
  review:
    summary: 'NOT annotation: Lucke et al. found no high-affinity specific fatty-acid binding sites in
      alpha-synuclein by NMR.'
    action: KEEP_AS_NON_CORE
    reason: The paper excludes FABP-like specific fatty acid binding and concludes alpha-synuclein is
      not an intracellular FA carrier, while showing interaction with negatively charged FA aggregates
      as membranes. The negative statement is supported; peripheral to core function.
    supported_by:
    - reference_id: PMID:16687662
      supporting_text: We conclude that alphaS is not likely to act as an intracellular FA carrier.
    - reference_id: PMID:16687662
      supporting_text: Binding to negatively charged membranes, however, appears to be an intrinsic property
        of alphaS that is most likely related to its physiological role(s) in the cell.
