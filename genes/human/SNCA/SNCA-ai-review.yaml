existing_annotations:
- term:
    id: GO:0000122
    label: negative regulation of transcription by RNA polymerase II
  evidence_type: TAS
  original_reference_id: PMID:24252804
  qualifier: involved_in
  review:
    summary: TAS from a review of oxidative stress in PD; the review mentions stress-induced nuclear alpha-synuclein
      binding the PGC1alpha promoter.
    action: MARK_AS_OVER_ANNOTATED
    reason: Repression of RNA polymerase II transcription rests on a stress-induced nuclear pool of alpha-synuclein
      reported in a few studies and summarized in this review; alpha-synuclein has no DNA-binding domain
      and its established physiological activities are presynaptic membrane and SNARE chaperone functions.
      Nuclear effects on gene expression are a disease-context observation, so the process claim exceeds
      the evidence.
    supported_by:
    - &id001
      reference_id: PMID:24252804
      supporting_text: PD causing gene products including DJ-1, PINK1, parkin, alpha-synuclein and LRRK2
        also impact in complex ways mitochondrial function leading to exacerbation of ROS generation and
        susceptibility to oxidative stress.
    - &id003
      reference_id: PMID:16959795
      supporting_text: alpha-synuclein localizes to the nucleus and presynaptic nerve terminals
- term:
    id: GO:0000149
    label: SNARE binding
  evidence_type: IDA
  original_reference_id: PMID:20798282
  qualifier: enables
  review:
    summary: Burre et al. showed direct binding of alpha-synuclein to the SNARE protein VAMP2 (synaptobrevin-2)
      and promotion of SNARE-complex assembly.
    action: ACCEPT
    reason: Direct binding to VAMP2 via the C-terminal tail is the molecular basis of the best-supported
      physiological activity of alpha-synuclein, the nonclassical SNARE-chaperone function. SNARE binding
      is a core molecular function.
    supported_by:
    - &id015
      reference_id: PMID:20798282
      supporting_text: α-synuclein directly bound to the SNARE-protein synaptobrevin-2/vesicle-associated
        membrane protein 2 (VAMP2) and promoted SNARE-complex assembly
- term:
    id: GO:0000287
    label: magnesium ion binding
  evidence_type: IDA
  original_reference_id: PMID:11850416
  qualifier: enables
  review:
    summary: Golts et al. used tyrosine fluorescence to show Mg2+-induced conformational change and Mg2+
      inhibition of aggregation in vitro.
    action: KEEP_AS_NON_CORE
    reason: Binding of Mg2+ is shown only indirectly (fluorescence change at sub-mM to mM concentrations)
      and relates to aggregation in vitro. The binding claim is acceptable but peripheral to function.
    supported_by:
    - &id002
      reference_id: PMID:11850416
      supporting_text: we show that iron and magnesium both interact with alpha-synuclein
    - &id009
      reference_id: PMID:11850416
      supporting_text: These data suggest that the conformation of alpha-synuclein can be modulated by
        metals, with iron promoting aggregation and magnesium inhibiting aggregation.
- term:
    id: GO:0000976
    label: transcription cis-regulatory region binding
  evidence_type: TAS
  original_reference_id: PMID:24252804
  qualifier: enables
  review:
    summary: TAS from a review of oxidative stress in PD; sequence-specific DNA binding by alpha-synuclein
