suggested_questions:
- question: What is the physiological stoichiometry and functional role of the proposed helical alpha-synuclein
    tetramer versus the disordered monomer, and how does the monomer/multimer equilibrium control SNARE
    chaperoning versus aggregation?
  experts:
  - alpha-synuclein structural biologist
  - presynaptic biology expert
- question: Does the high-affinity N-terminal copper site have a defined physiological role (copper buffering
    or redox modulation) distinct from its contribution to metal-promoted aggregation?
  experts:
  - metalloprotein biochemist
  - Parkinson disease neurochemist
- question: Which of the many reported monoamine-transporter and enzyme modulations (DAT, SERT, NET, tyrosine
    hydroxylase) reflect direct endogenous presynaptic functions rather than overexpression artifacts?
  experts:
  - dopaminergic neurotransmission expert
  - membrane transporter biochemist
- question: Is nuclear alpha-synuclein a regulated physiological pool with a defined function (e.g. histone
    binding) or primarily a stress/disease redistribution?
  experts:
  - chromatin biology expert
  - neurodegeneration cell biologist
suggested_experiments:
- description: Use endogenous-locus, fragment- and multimer-selective alpha-synuclein alleles (and synuclein
    triple-knockout rescue) in neurons to separate SNARE-chaperone, vesicle-priming, fusion-pore and endocytic-recycling
    functions of the monomer versus the membrane-bound multimer.
  hypothesis: The membrane-bound multimer performs SNARE chaperoning while soluble monomer promotes priming/fusion;
    these are separable physiological activities.
  experiment_type: endogenous allele engineering and presynaptic physiology
- description: Quantify copper occupancy of endogenous alpha-synuclein in neurons and test copper-binding-site
    mutants for effects on redox state, aggregation kinetics and neuronal survival.
  hypothesis: Physiological copper binding buffers or redox-modulates alpha-synuclein independently of
    its role in metal-promoted aggregation.
  experiment_type: metalloprotein biochemistry and cell-based copper-handling assays
