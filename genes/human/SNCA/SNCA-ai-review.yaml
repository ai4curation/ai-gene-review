- term:
    id: GO:0004860
    label: protein kinase inhibitor activity
  evidence_type: TAS
  original_reference_id: PMID:30194957
  qualifier: enables
  review:
    summary: TAS from a C. elegans single-copy-transgene study that mentions, as background, earlier yeast
      work showing alpha-synuclein inhibits Cdc5/Plk2 signalling.
    action: MARK_AS_OVER_ANNOTATED
    reason: The cited paper does not test kinase inhibition; the statement refers to a yeast study. In
      mammalian neurons PLK2 phosphorylates alpha-synuclein (PMID:23983262), i.e. alpha-synuclein is a
      kinase substrate, and direct kinase inhibitor activity has not been established.
    source_defects:
    - defect_type: WRONG_REFERENCE
      resource: ARUK_UCL
      requested_change: CHECK
      asserted_value: PMID:30194957
      confidence: PROBABLE
      explanation: TAS 'protein kinase inhibitor activity' cites a C. elegans PD-model paper that only
        mentions in its discussion that alpha-synuclein can disrupt stress signalling by inhibiting yeast
        Cdc5/Plk2. Please check whether the primary yeast study should be cited, or whether the annotation
        should be withdrawn.
      slot: DB:Reference
    supported_by:
    - reference_id: PMID:30194957
      supporting_text: previous work has shown that α-synuclein can disrupt stress signaling through the
        inhibition of the kinase Cdc5/Plk2
    - reference_id: PMID:23983262
      supporting_text: PLK2 overexpression reduces intraneuronal human α-synuclein accumulation
