- term:
    id: GO:0001774
    label: microglial cell activation
  evidence_type: TAS
  original_reference_id: PMID:24252804
  qualifier: involved_in
  review:
    summary: 'TAS from a review: extracellular aggregated, nitrated or mutant alpha-synuclein released
      from neurons activates microglia.'
    action: MARK_AS_OVER_ANNOTATED
    reason: Microglial activation is a response of microglia to pathological extracellular alpha-synuclein
      species (e.g. as a TLR2 agonist); it is a disease mechanism rather than a normal function of the
      neuronal protein, so the process annotation is an over-annotation.
    supported_by:
    - *id001
- term:
    id: GO:0001921
    label: positive regulation of receptor recycling
  evidence_type: IDA
  original_reference_id: PMID:18980610
  qualifier: involved_in
  review:
    summary: Ben Gedalya et al. showed that alpha-synuclein with PUFAs enhances clathrin-mediated endocytosis
      and transferrin internalization.
    action: MARK_AS_OVER_ANNOTATED
    reason: The paper measures internalization (FM1-43, transferrin) rather than receptor recycling back
      to the surface; the endocytosis-related terms (receptor internalization, positive regulation of
      endocytosis) capture the finding. Positive regulation of receptor recycling goes beyond what was
      measured.
    supported_by:
    - &id013
      reference_id: PMID:18980610
      supporting_text: alphaS expression coupled with exposure to physiological levels of certain PUFAs
        enhanced clathrin-mediated endocytosis in neuronal and non-neuronal cultured cells
    - &id018
      reference_id: PMID:18980610
      supporting_text: We suggest that alphaS and PUFAs normally function in endocytic mechanisms and
        are specifically involved in SV recycling upon neuronal stimulation.
