      asserted_value: GO:0004869
      confidence: PROBABLE
      explanation: IDA 'cysteine-type endopeptidase inhibitor activity' from PMID:10818098. The abstract
        measures caspase activation in cells overexpressing alpha-synuclein after staurosporine, etoposide
        or ceramide; it does not report direct inhibition of a caspase by purified alpha-synuclein. Please
        check the full text; if no direct assay, a process term such as negative regulation of apoptotic
        process (already annotated) is the appropriate capture.
    supported_by:
    - reference_id: PMID:10818098
      supporting_text: wt alpha-synuclein drastically reduces the caspase activation of TSM1 neurons upon
