core_functions:
- description: Alpha-synuclein binds curved, negatively charged phospholipid membranes through its N-terminal
    amphipathic KTKEGV-repeat helix, and in its membrane-bound multimeric state binds the v-SNARE VAMP2
    to act as a nonclassical chaperone that promotes SNARE-complex assembly at the presynaptic plasma
    membrane, sustaining neurotransmitter release during aging.
