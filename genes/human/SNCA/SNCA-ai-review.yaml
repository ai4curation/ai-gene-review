      supporting_text: The N-terminal region of alphaS binds to synthetic lipid vesicles and detergent
        micelles in vitro and adopts a highly helical conformation
    - &id006
      reference_id: PMID:17222866
      supporting_text: Most of these contained a mutation to either proline or glutamic acid that caused
        a defect in membrane binding.
