id: P37840
gene_symbol: SNCA
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'SNCA encodes alpha-synuclein, a small (140-residue), highly conserved, intrinsically disordered
  neuronal protein that is abundant at presynaptic nerve terminals and also present in the neuronal cytosol
  and nucleus. Its N-terminal region contains imperfect 11-residue KTKEGV repeats that fold into an amphipathic
  alpha-helix upon binding curved, negatively charged phospholipid membranes, while the acidic C-terminal
  tail remains unstructured and binds calcium and other ligands; a high-affinity N-terminal copper site
  (Met1, Asp2, His50) is a robust biochemical feature. At the presynapse, membrane-bound multimeric alpha-synuclein
  acts as a nonclassical chaperone that binds the v-SNARE VAMP2/synaptobrevin-2 and promotes assembly
  of the SNARE complex, cooperating with CSPalpha/DNAJC5; synuclein triple-knockout mice show age-dependent
  neurological decline and reduced SNARE assembly. Alpha-synuclein modulates synaptic vesicle trafficking,
  priming, exocytotic fusion-pore dilation and endocytic recycling, and regulates dopaminergic neurotransmission,
  in part by modulating the dopamine transporter and other monoamine transporters. It binds tubulin and
  influences microtubule dynamics, and interacts with tau. Alpha-synuclein is the principal component
  of Lewy bodies and glial cytoplasmic inclusions: it self-associates into oligomers and amyloid fibrils,
  and point mutations (A30P, E46K, H50Q, A53T) or SNCA multiplication cause familial Parkinson disease,
  with aggregated forms central to Parkinson disease, dementia with Lewy bodies and multiple system atrophy.'
