- id: PMID:16825292
  title: The homeoprotein Alx3 expressed in pancreatic beta-cells regulates insulin gene transcription
    by interacting with the basic helix-loop-helix protein E47.
  findings:
  - statement: Mouse Alx3 occupies insulin-promoter chromatin and activates a defined regulatory element
      with E47; these experiments support the conserved transcriptional mechanism without assigning a
      measured human target promoter.
    supporting_text: 'Alx3 transactivates the insulin

      promoter by acting on the E2A3/4 enhancer'
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Official PubMed abstract and DOI 10.1210/me.2005-0472 verified. Mouse MIN6/islet ChIP,
      EMSA and promoter/cofactor assays support the conserved transcriptional mechanism. Human HeLa reporter
      host does not establish a human protein construct. Full article not recovered. The normal recovered
      cache contains the abstract only.
  full_text_unavailable: true
- id: PMID:19409524
  title: Frontorhiny, a distinctive presentation of frontonasal dysplasia caused by recessive mutations
    in the ALX3 homeobox gene.
  findings:
  - statement: Seven families with homozygous ALX3 variants establish a human craniofacial disease association.
      The reported loss of function is predicted from the variant classes, not a direct DNA-binding assay
      in this study.
    supporting_text: 'In total, we identified seven different homozygous

      pathogenic mutations in seven families.'
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary PMC2681074 indexed Results inspected. Seven homozygous mutations across seven
      families; predicted mutant DNA-binding effects, not a direct assay. Human ALX3 embryo ISH did not
      exceed background. Craniofacial disease evidence is not neuron maturation. The normal recovered
      cache contains the abstract only.
  full_text_unavailable: true
- id: PMID:20534379
  title: Alx3-deficient mice exhibit folic acid-resistant craniofacial midline and neural tube closure
    defects.
  findings:
  - statement: Alx3 loss affects cranial neural-tube closure and survival of head-region cells in mice.
      These outcomes do not by themselves identify a neuron-maturation step.
    supporting_text: 'Alx3-deficient mice exhibit increased failure of cranial neural tube closure and

      increased cell death in the craniofacial region'
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Primary PubMed abstract inspected. Mouse head mesenchyme and cranial closure/apoptosis;
      no direct human neuron-development or folate-binding claim. The normal recovered cache contains
      the abstract only.
  full_text_unavailable: true
- id: PMID:38600112
  title: DNA binding analysis of rare variants in homeodomains reveals homeodomain specificity-determining
    residues.
  findings:
  - statement: Human ALX3 homeodomain protein-binding microarray measurements detect reduced DNA affinity
      for L168V. The assay uses an isolated GST-fusion DNA-binding domain and does not measure full-length
      occupancy in human cells.
    supporting_text: ALX3 L168V shows reduced affinity across all significantly bound 8-mers.
    full_text_unavailable: false
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary Results, Table 1 and Methods independently inspected through indexed PMC11006913.
      ALX3 L168V/N203S homeodomain variants alter affinity. N-terminal GST-fusion DNA-binding domains
      were expressed using PURExpress in vitro transcription/translation and compared as matched mutant/reference
      series at 200 nM in protein-binding microarrays. This is domain biochemistry, not native full-length
      human chromatin occupancy. The recovered XML body now independently confirms the cited Results/Table
      1/Figure 4 and Methods passages; uninspected supplemental data are not claimed as read.
  full_text_unavailable: false
- id: PMID:39129011
  title: Alx3 deficiency disrupts energy homeostasis, alters body composition, and impairs hypothalamic
    regulation of food intake.
  findings:
  - statement: The adult constitutive mouse-knockout study links Alx3 to metabolic regulation and identifies
      arcuate-neuron expression; neuron-specific causal attribution remains to be established.
    supporting_text: the use of a constitutive knock out model represents a limitation
    full_text_unavailable: false
    reference_section_type: DISCUSSION
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Primary identity and recovered XML abstract, selected neuronal/innervation Results,
      Methods and Discussion limitations inspected. Male mice aged 16–20 weeks in a constitutive knockout
      support adult hypothalamic physiology. Neuron-specific inactivation is explicitly still needed;
      this is not direct evidence of neuron maturation. The entire paper and supplements were not reviewed.
  full_text_unavailable: false
core_functions:
- description: Binds sequence-specific regulatory DNA through its homeodomain and regulates nuclear RNA
    polymerase II transcription. Human DNA-binding measurements and mouse promoter/cofactor experiments
    support this conserved activity; the tissue-specific human target network remains incompletely defined.
  molecular_function:
