suggested_questions:
- question: Which direct human ALX3 target genes and cofactors connect its DNA-binding activity to craniofacial
    development?
- question: Which experimental ancestral-clade evidence supports the PAINT neuron-development assertion,
    and does ALX3 regulate neuronal maturation rather than only adult neuronal physiology?
- question: How do the measured affinities of disease-associated ALX3 homeodomain variants affect full-length
    protein occupancy and transcription in human developmental cell models?
