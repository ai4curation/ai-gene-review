id: O95076
gene_symbol: ALX3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ALX3 is a paired-class homeodomain transcription factor that binds regulatory DNA and modulates
  gene expression in the nucleus. Its DNA-binding homeodomain is conserved, and human homeodomain variants
  can alter DNA-binding affinity. ALX3 is required for normal craniofacial development; biallelic loss-of-function
  variants cause frontonasal dysplasia. Mouse studies additionally establish tissue-specific transcriptional
  roles in pancreatic endocrine cells and hypothalamic physiology.
