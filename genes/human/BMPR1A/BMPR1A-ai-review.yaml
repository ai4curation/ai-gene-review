    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: Identifier/title match the cached source and original GOA assertion; the target-specific
      inference described in the finding remains unresolved. No claim of a wrong identifier or wrong
      gene.
- id: PMID:11580864
  title: Bone morphogenetic protein-5 (BMP-5) promotes dendritic growth in cultured sympathetic neurons.
  findings:
  - statement: Selected primary Results/Discussion use soluble BMPR-IA-Fc to inhibit BMP5-induced
      dendrites; endogenous neuronal receptor binding remains an explicit limitation.
- id: PMID:12065756
  title: SB-431542 is a potent and specific inhibitor of transforming growth factor-beta superfamily
    type I activin receptor-like kinase (ALK) receptors ALK4, ALK5, and ALK7.
  findings:
  - statement: The abstract includes BMP-receptor comparators and indexed publisher Methods identify
      activated human ALK3. Full construct-specific ATP/SMAD assays were not retrieved; the ALK4/5/7
      title does not establish a wrong-gene citation.
- id: PMID:12368913
  title: Requirement of Bmpr1a for Müllerian duct regression during male sexual development.
  findings:
  - statement: Conditional mouse mesenchymal deletion supports Bmpr1a participation in AMH-dependent
      Müllerian-duct regression, not a direct human purified-ligand binding experiment.
- id: PMID:15064755
  title: Molecular recognition of BMP-2 and BMP receptor IA.
  findings:
  - statement: The abstract describes structural/mutational evidence for the BMP2–BRIA interface,
      with ligand L51P specifically disrupting type I receptor binding.
- id: PMID:15657086
  title: Dynamics and interaction of caveolin-1 isoforms with BMP-receptors.
  findings:
  - statement: The abstract supports BRIa localization in caveolin-associated domains. Caveolin isoforms
      and BRII immunoprecipitation conclusions must be distinguished from BMPR1A-specific results.
- id: PMID:16127465
  title: Activating and deactivating mutations in the receptor interaction site of GDF5 cause symphalangism
    or brachydactyly type A2.
  findings:
  - statement: The abstract compares GDF5 wild-type and disease-variant binding to BMPR1A/BMPR1B
      ectodomains; variants can decrease or increase BMPR1A affinity.
- id: PMID:16672363
  title: Structure of the ternary signaling complex of a TGF-beta superfamily member.
  findings:
  - statement: The abstract describes BMP2/type I/type II receptor ectodomain assembly with distinct
      ligand-binding surfaces and no direct contact between receptor ectodomains.
- id: PMID:16886151
  title: Association of polymorphisms of IGF1R and genes in the transforming growth factor- beta
    /bone morphogenetic protein pathway with bacteremia in sickle cell anemia.
  findings:
  - statement: The abstract reports candidate polymorphism/bacteremia associations in sickle-cell
      anemia; the direct immune-response role of BMPR1A remains unresolved.
