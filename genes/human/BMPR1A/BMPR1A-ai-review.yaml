- term:
    id: GO:0005025
    label: transforming growth factor beta receptor activity, type I
  evidence_type: IDA
  original_reference_id: PMID:9136927
  qualifier: enables
  review:
    summary: BMPR1A is the BMP type I receptor represented by this experimental type I receptor annotation.
    action: KEEP_AS_NON_CORE
    reason: PMID:9136927 establishes receptor-dependent direct SMAD1 phosphorylation; the exact construct-specific
      full text was not independently retrieved. The same evidence is repeatedly used for BMPR1A
      in curated GO-CAMs. Preserve the assertion with curator deference, distinguish the broad superfamily
      convention from specific TGF-beta ligand reception, and synthesize the established BMP receptor
      activity separately.
