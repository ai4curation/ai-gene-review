id: P36894
gene_symbol: BMPR1A
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: BMPR1A (ALK3) is a single-pass cell-surface BMP receptor with an extracellular ligand-binding
  domain and an intracellular serine/threonine kinase domain. It recognizes BMP-family ligands in
  complexes with type II receptors; activation of its kinase couples extracellular signals to receptor-regulated
  SMADs. Ligand preference and output depend on receptor partners and cellular context. This signaling
  supports skeletal and cardiovascular development, differentiation and hepatic hepcidin regulation.
  BMPR1A also supplies type I receptor signaling in the AMH pathway during Müllerian-duct regression.
