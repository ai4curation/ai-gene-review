  - InterPro:IPR008271
  review:
    summary: BMPR1A has intrinsic protein kinase activity.
    action: ACCEPT
    reason: The InterPro-derived kinase annotation fits the cytoplasmic catalytic domain and established
      type I receptor phosphorylation mechanism. The broader term is correct alongside the more specific
      receptor serine/threonine kinase and BMP receptor terms; it need not be deleted as redundant.
    additional_reference_ids:
    - file:human/BMPR1A/BMPR1A-uniprot.txt
    - PMID:9136927
- term:
    id: GO:0004674
    label: protein serine/threonine kinase activity
  evidence_type: IDA
  original_reference_id: PMID:12065756
  qualifier: enables
  review:
    summary: BMPR1A is a catalytically active serine/threonine kinase (PMID:12065756).
    action: ACCEPT
    reason: The inhibitor paper includes BMP-receptor comparators, and indexed publisher Methods
      identify activated human ALK3. Its ALK4/5/7-focused title is not a wrong-gene argument. Retain
      the established kinase activity with curator deference; the original construct-specific biochemical
      results were not independently read in full.
    additional_reference_ids:
    - PMID:9136927
    - Reactome:R-HSA-201476
- term:
    id: GO:0004675
    label: transmembrane receptor protein serine/threonine kinase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - InterPro:IPR000333
  - InterPro:IPR000472
  - InterPro:IPR003605
  - RHEA:18673
  - EC:2.7.11.30
  review:
    summary: BMPR1A is a transmembrane receptor serine/threonine kinase.
    action: ACCEPT
    reason: The integrated electronic annotation matches the ligand-binding extracellular domain,
      single membrane helix and intracellular kinase domain of human P36894. Type II receptors activate
      the type I receptor, which supplies the subsequent SMAD-directed catalytic step.
    additional_reference_ids:
    - file:human/BMPR1A/BMPR1A-uniprot.txt
    - Reactome:R-HSA-201476
- term:
    id: GO:0004675
    label: transmembrane receptor protein serine/threonine kinase activity
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-201476
  qualifier: enables
  review:
    summary: Activated BMPR1A performs the type I receptor kinase step upstream of SMADs.
    action: ACCEPT
    reason: R-HSA-201476 explicitly describes phosphorylation of R-SMAD1/5/8 by activated type I
      receptors. This is BMPR1A catalytic activity, distinct from the upstream phosphorylation of
      BMPR1A by a type II receptor.
- term:
    id: GO:0005025
    label: transforming growth factor beta receptor activity, type I
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - MGI:MGI:107191
  - PANTHER:PTN000584016
  - UniProtKB:P36894
  review:
    summary: The PAINT assertion uses the conventional TGF-beta-superfamily type I receptor designation.
    action: KEEP_AS_NON_CORE
    reason: PANTHER:PTN000584016 records a curator phylogenetic inference; target P36894 among its
      supporting entities is legitimate experimental grounding, not circularity. All six cached BMPR1A
      GO-CAM activities also use GO:0005025. Retain this curated usage, while using GO:0098821 BMP
      receptor activity for the core and flagging the current ligand-specific term definition for
      clarification. It should not be read as new evidence for direct TGF-beta-ligand binding.
    additional_reference_ids:
