  title: Bone morphogenetic proteins signal through the transforming growth factor-beta type III
    receptor.
  findings:
  - statement: The abstract focuses on the type III BMP co-receptor. The existing BMPR1A/BMP2 binding
      assertion is retained with curator deference and independent receptor-structure support.
- id: PMID:18326817
  title: Hemojuvelin regulates hepcidin expression via a selective subset of BMP ligands and receptors
    independently of neogenin.
  findings:
  - statement: The canonical abstract supports HJV signaling through selected BMP receptors. Selected
      archived full text identifies ALK3-dependent reporter/hepcidin-promoter responses in cell-specific
      settings; this is signaling-dependent transcription, not BMPR1A DNA binding.
- id: PMID:18436533
  title: BMP-2/4 and BMP-6/7 differentially utilize cell surface receptors to induce osteoblastic
    differentiation of human bone marrow-derived mesenchymal stem cells.
  findings:
  - statement: Selected canonical Methods/Results distinguish human mesenchymal-cell receptor RNAi
      from full-length human receptor BRET experiments in HEK-293 cells and from ligand-induced mineralization.
      BMPR1A preferentially mediates BMP2/4 responses in that mesenchymal-cell system.
- id: PMID:18667463
  title: SM22alpha-targeted deletion of bone morphogenetic protein receptor 1A in mice impairs cardiac
    and vascular development, and influences organogenesis.
  findings:
  - statement: Selected canonical primary passages distinguish SM22alpha-Cre mouse developmental
      phenotypes from human pulmonary smooth-muscle RNAi. Loss of BMPR1A increases basal migration
      but impairs PDGF-BB-directed migration; early myocardial proliferation defects occur without
      enhanced apoptosis in the tested model.
- id: PMID:19229295
  title: Crystal structure analysis reveals a spring-loaded latch as molecular mechanism for GDF-5-type
    I receptor specificity.
  findings:
  - statement: The abstract explains higher-affinity GDF5 recognition by BMPR1B through a receptor-loop
      conformation; this does not establish absence of lower-affinity BMPR1A binding.
- id: PMID:19726563
  title: The transforming growth factor-beta type III receptor mediates distinct subcellular trafficking
    and downstream signaling of activin-like kinase (ALK)3 and ALK6 receptors.
  findings:
  - statement: The abstract distinguishes TGFBR3-dependent ALK3 surface retention from ALK6 internalization
      and downstream trafficking differences.
- id: PMID:19804412
  title: The pro-form of BMP-2 interferes with BMP-2 signalling by competing with BMP-2 for IA receptor
    binding.
  findings:
  - statement: The abstract directly reports proBMP2 binding to BMPR1A ectodomain and cell-surface
      receptor without mature-BMP2-like osteogenic activity.
- id: PMID:20860622
  title: DIP2 disco-interacting protein 2 homolog A (Drosophila) is a candidate receptor for follistatin-related
    protein/follistatin-like 1--analysis of their binding with TGF-β superfamily proteins.
  findings:
  - statement: Selected publisher Results, Figure 8 caption and SPR Methods were read. They directly
      examine BMP2/BMP4 interactions with soluble BMPR1A and FSTL1. The local cache remains abstract-only.
- id: PMID:21054789
  title: WFIKKN1 and WFIKKN2 bind growth factors TGFβ1, BMP2 and BMP4 but do not inhibit their signalling
    activity.
  findings:
  - statement: Publisher Figure 3, Results and Methods identify human BMPR1A ectodomain expressed
      in Pichia and direct BMP2/BMP4 SPR assays. The local cache remains abstract-only.
- id: PMID:21543859
  title: Purification, crystallization and preliminary data analysis of the ligand-receptor complex
    of the growth and differentiation factor 5 variant R57A (GDF5R57A) and BMP receptor IA (BRIA).
  findings:
  - statement: Selected primary Methods/Results describe crystallization of human BRIA ectodomain
      with engineered high-affinity GDF5 R57A. The construct is not a natural receptor isoform.
- id: PMID:21791611
  title: TSC-22 promotes transforming growth factor β-mediated cardiac myofibroblast differentiation
    by antagonizing Smad7 activity.
  findings:
  - statement: The accessible abstract emphasizes TSC22D1 regulation of TGF-beta signaling; UniProt
      explicitly cites it for the target BMPR1A–TSC22D1 interaction. Complete target-assay detail
      remains unread.
- id: PMID:21976273
  title: 'New insights into the molecular mechanism of multiple synostoses syndrome (SYNS): mutation
    within the GDF5 knuckle epitope causes noggin-resistance.'
  findings:
  - statement: The accessible abstract emphasizes GDF5 S94N, noggin resistance and receptor specificity.
      The exact assays behind the BMPR1A/GDF5 and BMPR1A/BMPR2 source rows remain unresolved.
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: Identifier/title match the cached source and original GOA assertion; the target-specific
      inference described in the finding remains unresolved. No claim of a wrong identifier or wrong
      gene.
- id: PMID:24098149
  title: A GDF5 point mutation strikes twice--causing BDA1 and SYNS2.
  findings:
  - statement: Selected primary Results/Methods compare wild-type GDF5 with W414R binding to BMPR1A
      ectodomain; both ligand identity and altered affinity must be retained.
- id: PMID:24882581
  title: MicroRNA-885-3p inhibits the growth of HT-29 colon cancer cell xenografts by disrupting
    angiogenesis via targeting BMPR1A and blocking BMP/Smad/Id1 signaling.
  findings:
  - statement: The abstract connects BMPR1A perturbation to BMP/SMAD/ID1 signaling and angiogenesis
      in a colon-cancer xenograft context.
- id: PMID:24904118
  title: HFE interacts with the BMP type I receptor ALK3 to regulate hepcidin expression.
  findings:
  - statement: The abstract supports HFE–ALK3 association, receptor stabilization and surface accumulation.
      Indexed primary Discussion proposes a larger HFE/TFR2/HJV/ALK3 assembly; its full assembly
      and supplemental evidence were not independently established.
- id: PMID:25938661
  title: Repulsive guidance molecule is a structural bridge between neogenin and bone morphogenetic
    protein.
  findings:
  - statement: Selected primary Results and Methods directly measure human BMPR1A ectodomain binding
      to BMP2 by SPR. RGM bridging and soluble-receptor ligand interception are distinct mechanisms.
- id: PMID:33308444
  title: SCUBE3 loss-of-function causes a recognizable recessive developmental disorder due to defective
    bone morphogenetic protein signaling.
  findings:
  - statement: The abstract and target-specific UniProt annotation support SCUBE3-dependent BMP signaling
      and BMPR1A association; SCUBE3 scaffold/co-receptor activity must not be assigned to BMPR1A.
- id: PMID:36641752
  title: The Integrator complex desensitizes cellular response to TGF-β/BMP signaling.
  findings:
  - statement: The abstract includes human as well as Drosophila signaling; indexed primary Discussion
      identifies human Alk3 QD. The exact ligand-specific TGF-beta pathway interpretation remains
      unresolved.
- id: PMID:8397373
  title: 'Activin receptor-like kinases: a novel subclass of cell-surface receptors with predicted
    serine/threonine kinase activity.'
  findings:
  - statement: The abstract reports cloning of human ALK3 and predicts its single-pass receptor kinase
      topology; TGF-beta-superfamily membership alone does not establish a specific TGF-beta ligand
      pathway.
- id: PMID:9136927
  title: The TGF-beta family mediator Smad1 is phosphorylated directly and activated functionally
    by the BMP receptor kinase.
  findings:
  - statement: The abstract directly establishes BMP type I receptor phosphorylation of the SMAD1
      C-terminal motif. Construct-specific full text was not independently retrieved; repeated human
      BMPR1A GO-CAM assignments provide curator evidence.
- id: PMID:9389648
  title: Dual role of the Smad4/DPC4 tumor suppressor in TGFbeta-inducible transcriptional complexes.
  findings:
  - statement: Selected canonical Methods explicitly use activated BMPR-IA(Q233D) and BMP4. Receptor-activated
      SMAD transcriptional mechanisms are distinct from receptor kinase activity.
- id: Reactome:R-HSA-201443
  title: Type II receptor phosphorylates type I receptor
  findings:
  - statement: Type II receptor phosphorylation activates the type I receptor.
- id: Reactome:R-HSA-201451
  title: Signaling by BMP
  findings:
  - statement: BMP receptors transduce ligand binding through SMAD signaling.
- id: Reactome:R-HSA-201453
  title: Phospho-R-Smad1/5/8 dissociates from the receptor complex
  findings:
  - statement: The event title names BMP R-SMAD1/5/8 dissociation, while the cached summary describes
      TGF-beta/SMAD2/3. Plasma-membrane location has independent support; this source mismatch is
      not silently corrected.
  reference_review:
    relevance: MEDIUM
    correctness: DISPUTED
    review_notes: Internal title/body mismatch in the cached Reactome record; this flags source specificity,
      not a retraction or evidence against BMPR1A membrane localization.
- id: Reactome:R-HSA-201457
  title: BMP2 binds to the receptor complex
  findings:
  - statement: BMP2 engages the receptor complex.
- id: Reactome:R-HSA-201475
  title: I-Smad competes with R-Smad1/5/8 for type I receptor
  findings:
  - statement: I-SMAD competes with R-SMAD access to type I receptor.
- id: Reactome:R-HSA-201476
  title: Activated type I receptor phosphorylates R-Smad1/5/8 directly
  findings:
  - statement: Activated type I receptors phosphorylate R-SMAD1/5/8.
- id: Reactome:R-HSA-201648
  title: An anchoring protein, Endofin, recruits R-Smad1/5/8
  findings:
  - statement: Endofin recruits R-SMADs to the receptor.
- id: Reactome:R-HSA-201821
  title: I-Smad binds to type I receptor, preventing Smad1/5/8 from being activated
  findings:
  - statement: I-SMAD/Smurf regulation promotes receptor inhibition/degradation; the receptor is
      a substrate, not the E3 ligase.
- id: Reactome:R-HSA-202604
  title: Formation of a heteromeric BMP receptor complex
  findings:
  - statement: Heteromeric BMP receptor complexes may be preformed or ligand induced.
- id: file:human/BMPR1A/BMPR1A-uniprot.txt
  title: 'UniProtKB P36894: Bone morphogenetic protein receptor type-1A (human BMPR1A)'
  findings:
  - statement: Human P36894 is a 532-residue single-pass receptor with extracellular ligand recognition
      and intracellular serine/threonine kinase activity. The source record documents BMP-family
      and regulatory interactions; its mature chain is not a newly established splice isoform.
core_functions:
- description: Recognizes BMP-family ligands at the cell surface and, after activation within a type
    I/type II receptor complex, uses its intracellular serine/threonine kinase to transmit the signal
    to R-SMADs. Ligand recognition, receptor assembly and ATP-dependent catalysis form one coupled
    receptor mechanism.
  molecular_function:
    id: GO:0098821
    label: BMP receptor activity
  directly_involved_in:
  - id: GO:0030509
    label: BMP signaling pathway
  locations:
  - id: GO:0005886
    label: plasma membrane
  in_complex:
    id: GO:0043235
    label: receptor complex
  supported_by:
  - reference_id: PMID:9136927
    supporting_text: 'BMP receptors phosphorylate and activate Smad1

      directly'
  - reference_id: file:human/BMPR1A/BMPR1A-uniprot.txt
    supporting_text: Receptor for BMP2, BMP4, GDF5 and GDF6.
suggested_questions:
- question: How should the GO:0005025 ligand-specific definition be reconciled with its repeated
    use for BMPR1A in curated BMP and AMH GO-CAM activities?
- question: What assembly-specific evidence establishes simultaneous ALK3, HFE and a transferrin
    receptor in the GO:1990712 complex, beyond pairwise interactions and the proposed multicomponent
    model?
- question: Which exact donor experiments and conditional-deletion stages support the two negated
    developmental source assertions?
- question: Does PMID:11580864 or subsequent source evidence distinguish an endogenous neuronal BMPR1A
    requirement from inhibition by a soluble BMP-binding receptor trap?
- question: What direct BMPR1A immune-response mechanism, if any, supports the bacteremia-associated
    annotation from PMID:16886151?
