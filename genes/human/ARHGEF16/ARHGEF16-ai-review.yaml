    supporting_text: phosphorylation of a conserved tyrosine residue in its N-terminal inhibitory domain and association of PDZ proteins with its C-terminal PDZ-binding motif may respectively relieve the two autoinhibitory modes in Ephexin4
  - reference_id: PMID:21139582
    supporting_text: Tax-interacting-protein 1 was shown to interact with ARHGEF16 by its carboxyl PDZ binding motif.
knowledge_gaps:
- gap_statement: 'GO has no term in which to state that this protein''s exchange substrate is RhoG and only RhoG. Every substrate-specific handle has been merged into a general parent: GO:0005089 Rho guanyl-nucleotide exchange factor activity, GO:0030676 Rac and GO:0005088 Ras into GO:0005085; GO:0017048 Rho GTPase binding into GO:0031267; GO:0032860 and GO:0032861 activation of Rho and Rac GTPase activity into GO:0090630. None of the four general parents has an is_a child.'
  boundary: 'The biology is not in doubt. Exchange on RhoG was measured on purified DH-PH protein, and the negatives for Rac1, Cdc42 and RhoA were measured in the same paper with Dock180, Zizimin1 and Ephexin1 as positive controls. What is missing is a place to put it: the fact separates ARHGEF16 from four RhoA-GEF siblings that share its GO molecular function verbatim.'
  gap_kind:
  - ONTOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: 'A family-level IBA at GO:0005085 is unfalsifiable for substrate: it transfers the same term from three RhoA GEFs to the one family member that does not act on RhoA, and nothing in the record registers the difference. The structural analysis shows the sequence cannot fill the gap either. Holding the GEF constant and changing the bound GTPase barely changes the surface - the Dbs contact sets from the Cdc42-bound and RhoA-bound structures share a Jaccard of 0.73 and move ARHGEF16''s score by 0.06 - so the panel ranks by GEF-to-GEF similarity rather than by substrate, and would name Cdc42 for a protein whose measured substrate is RhoG.'
  resolution: 'No new term is proposed; GO merged these deliberately, and re-proposing them would argue with a decision rather than record a gap. The available mechanism is the annotation extension: has_input on the GO:0005085 and GO:0090630 rows, which this review supplies. If GO wants substrate recoverable without extensions, the decision to revisit is the merge itself.'
  provenance:
  - reference_id: PMID:20679435
    supporting_text: Although the DH-PH domain of Ephexin4 did not exchange nucleotide on Rac1, it possessed GEF activity of RhoG in vitro
  - reference_id: PMID:30445756
    supporting_text: however, Ephexin4 displays GEF activity for RhoG, rather than for RhoA
- gap_statement: Almost nothing in this protein's literature has reached GO. Of the 26 PubMed records naming Ephexin4 or ARHGEF16, exactly two produced a GO annotation on the human or mouse protein. The autoinhibition mechanism, the anoikis role, the EphA2-Ser897 input, the efferocytosis work and the mitotic phenotype are all uncurated.
  boundary: 'This is a curation gap, not an evidence gap. The uncurated papers include three structural or biochemical studies of the autoinhibition mechanism, two anoikis papers with knockdown and rescue in human cells, and a 2025 study with knockdown, rescue and a phospho-mimic allele. Mouse Arhgef16 has no experimental GO annotation of any kind: its entire record is projected from human by ISO and Ensembl Compara, which means the mouse efferocytosis work has nowhere to land either.'
  gap_kind:
  - CURATION
  dark_aspect: BP_DARK
  status: OPEN
  significance: 'The gene reads as sparsely characterised when it is not. It also makes the record fragile: with only two curated papers, the single mis-typed molecular function from one of them has been projected to 83 annotations across 81 taxa.'
  resolution: Curation of PMID:21621533, PMID:23772378, PMID:28667327, PMID:30445756, PMID:33597305 and PMID:39675713 on human ARHGEF16, and of PMID:25063526 on mouse Arhgef16. This review proposes only the anoikis term as NEW; the others need decisions about term choice that are better made by a curator with the full datasets.
  provenance:
  - reference_id: PMID:39675713
    supporting_text: however, the regulation of Ephexin4 during M phase remains unknown.
- gap_statement: Where in the cell ARHGEF16 sits has never been measured. Both cellular-component terms on the gene are inferences - cytoplasm from a UniProt keyword mapping and cytosol from an ARBA rule and two Reactome reactions - and UniProt's own SUBCELLULAR LOCATION line carries ECO:0000305, an author-inferred code, not an experimental one.
  boundary: 'The functional geography is partly known even though the localisation is not: the protein acts on RhoG at the plasma membrane, its knockdown reduces RhoG localization there, and its activity assembles a complex with EPHA2 at the tips of cortactin-rich protrusions. What is missing is a direct observation of where ARHGEF16 itself is, and whether it is recruited to the membrane or acts on RhoG from a cytoplasmic pool.'
  gap_kind:
  - BIOLOGY
  - CURATION
  dark_aspect: CC_DARK
  status: OPEN
  significance: The two autoinhibitory modes are relieved by membrane-proximal events - ELMO binding and PDZ-scaffold binding - so whether the protein is recruited before or after de-repression is the difference between two mechanistic models of how this GEF is switched on.
  resolution: Endogenous-tagging plus imaging, with and without EPHA2 Ser897 phosphorylation, would settle it; a curated IDA for the localisation would follow.
  provenance:
  - reference_id: PMID:39675713
    supporting_text: The Ephexin4 knockdown caused chromosome misalignment and reduced the RhoG localization to the plasma membrane.
suggested_questions:
- question: GO:0005096 GTPase activator activity is annotated by IDA to ARHGEF16 from PMID:21139582, a paper that measured nucleotide exchange. The protein has no GAP domain, and the same curator chose the correct process term from the same paper. Should the molecular function be retyped to GO:0005085 with CDC42 as has_input? The row has already been projected to 83 annotations across 81 taxa, including two on mouse Arhgef16, which has no experimental annotation of its own.
  experts:
  - BHF-UCL
  - GO Central
  - UniProt
- question: Every GO term that could state which GTPase a Rho-family regulator acts on has been merged away - the Rho/Rac/Ras GEF terms into GO:0005085, the substrate-specific GAP terms into GO:0005096, Rho GTPase binding into GO:0031267. For a family where one member's whole distinguishing feature is its substrate, is has_input on the activity row the intended replacement, and should it be expected rather than optional for GEF and GAP annotations?
  experts:
  - GO Central
  - GO ontology editors
- question: PMID:21139582 reports in vitro exchange on Cdc42, enhanced by Tip-1 and HPV16 E6, while PMID:20679435 reports no cellular Cdc42 activation and no binding to nucleotide-free Cdc42. Is the Cdc42 arm best curated as a cofactor-conditional activity, and if so should the GO:0032489 annotations carry an annotation extension naming the HPV16 E6 context rather than standing unqualified?
  experts:
  - BHF-UCL
  - GO Central
- question: PMID:39675713 shows that Ephexin4 knockdown prolongs metaphase, activates the spindle assembly checkpoint and causes chromosome misalignment, rescued by wild-type and S41E but not S41A. This review deliberately did not propose GO:0051310 metaphase chromosome alignment, because the entity that positions chromosomes is the spindle and kinetochore machinery and ARHGEF16 acts through cortical RhoG. Is there a regulation-level term that fits a cortical input to chromosome alignment, or is this a genuine expressivity gap?
  experts:
  - GO Central
  - cell-division curators
- question: Efferocytosis by Ephexin-4 is established for the mouse protein - murine cDNA NM_001112744 expressed in LR73 phagocytes, synergistic with ELMO1 and abolished without it - across three papers, yet mouse Arhgef16 has no experimental GO annotation at all. Should GO:0043277 apoptotic cell clearance be curated on mouse Arhgef16, from which it would then project to human by the same ISO route that currently projects the erroneous GAP term?
  experts:
  - MGI
  - GO Central
- question: Isoform Q5VV41-2 lacks residues 1-288, removing the entire N-terminal autoinhibitory region while retaining the exchange surface essentially intact (within 0.04 of the canonical at all six structural anchors tested). If the intermolecular autoinhibition model holds, this isoform should be constitutively de-repressed. Is it expressed as protein, and is it a physiologically active GEF?
  experts:
  - Katoh laboratory
  - Park laboratory
  - UniProt
suggested_experiments:
- hypothesis: Ephexin-4 is a strictly RhoG-specific exchange factor, and the specificity resides in the DH-PH cassette rather than in the regulatory regions.
  description: Side-by-side in vitro exchange kinetics of the purified ARHGEF16 DH-PH cassette against a panel of Rho-family GTPases - RhoG, Rac1, Rac2, Rac3, Cdc42, RhoA, RhoB, RhoC, RhoQ, RhoJ - with the equivalent cassette from Ephexin-1 as the promiscuous comparator and a catalytically dead DH mutant as the negative. Mant-GDP release rates give a quantitative specificity profile rather than a binary answer, and would establish whether the cell-based negatives reflect true catalytic selectivity or a failure of the autoinhibited full-length protein to open.
  experiment_type: biochemical
- hypothesis: The E291A substitution (human numbering; murine E295A) de-represses ARHGEF16 by disrupting the intermolecular autoinhibition interface, and the de-repressed protein is more active without being differently specific.
  description: Introduce E291A into human ARHGEF16 - the published mutant is murine, and human position 295 is a serine - and compare wild type, E291A, and the PDZ-motif deletion for RhoG-GTP levels, oligomer formation by chemical cross-linking, and rate of exchange on purified protein. Including the substrate panel above on the de-repressed protein tests whether relieving autoinhibition also broadens specificity, which is the alternative explanation for the Cdc42 result obtained with Tip-1 and E6 present.
  experiment_type: biochemical
- hypothesis: The Cdc42 activity reported in PMID:21139582 is conditional on TAX1BP3 and HPV16 E6 rather than intrinsic, which would reconcile it with the Cdc42 negatives in PMID:20679435.
  description: Repeat the CRIB pull-down for Cdc42-GTP in cells expressing ARHGEF16 alone, ARHGEF16 plus TAX1BP3, ARHGEF16 plus HPV16 E6, and all three, in the same cell background and with Zizimin1 as the positive control used in the original negative experiment. A conditional result would let the GO:0032489 annotations be qualified rather than left contradicting the RhoG paper.
  experiment_type: cell biology
- hypothesis: Isoform 2 (Q5VV41-2), which begins after the autoinhibitory region, is a constitutively active RhoG exchange factor.
  description: Confirm endogenous protein expression of isoform 2 by isoform-resolved mass spectrometry or an N-terminus-specific antibody, then compare isoform 1 and isoform 2 for basal RhoG-GTP, responsiveness to ELMO1 and to PDZ-protein co-expression, and oligomerisation. A constitutively active isoform would make the autoinhibition mechanism a splice-controlled switch rather than only a partner-controlled one.
  experiment_type: cell biology
- hypothesis: ARHGEF16 contributes to metaphase chromosome alignment through cortical RhoG rather than through any spindle-associated activity.
  description: In Ephexin4-knockdown cells, test whether constitutively active RhoG targeted to the plasma membrane rescues chromosome alignment while a cytoplasmically restricted active RhoG does not, and whether the rescue survives in cells whose cortical actomyosin is separately perturbed. This distinguishes a cortical-rigidity mechanism from a direct mitotic one and would determine which GO process term, if any, is appropriate.
  experiment_type: cell biology
