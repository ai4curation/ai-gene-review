  supporting_entities:
  - UniProtKB:Q05BK6
  review:
    summary: Binary yeast two-hybrid interaction with TFG (unreviewed TrEMBL entry Q05BK6, 366 aa) from a proteome-scale human interactome map.
    action: KEEP_AS_NON_CORE
    reason: 'A systematic binary screen result with no follow-up and no mechanistic account for this gene. TFG carries no PDZ domain, so unlike the bulk of this gene''s GO:0005515 rows it cannot be attributed to the C-terminal PDZ-binding motif, and there is no more informative molecular-function term to move it to. Kept because it is a real measurement, marked non-core because nothing in the ARHGEF16 literature builds on it. Note that this row and the Q92734 row in the same reference are the same protein under two accessions: Q05BK6 is the unreviewed TrEMBL entry (Q05BK6_HUMAN, 366 aa, from EMBL clone BC041600) and Q92734 is the reviewed Swiss-Prot entry (TFG_HUMAN, 400 aa). Both carry gene name TFG and a single PB1 domain; neither is Tensin-3, which is Q68CZ2 and lists no secondary accessions. GOA therefore counts one binding partner twice here, which is a duplicate-partner artefact rather than two findings.'
