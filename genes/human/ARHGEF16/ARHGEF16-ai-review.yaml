id: Q5VV41
gene_symbol: ARHGEF16
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'ARHGEF16, also called Ephexin-4 and originally cloned as the neuroblastoma candidate gene NBR, is a Dbl-family Rho guanine nucleotide exchange factor built from a long regulatory N-terminus, a tandem DH-PH catalytic cassette, an SH3 domain and a C-terminal PDZ-binding motif. Its direct substrate is the Rho-family GTPase RhoG: the purified DH-PH cassette loads GTP onto RhoG and not onto Rac1, and in cells the protein raises RhoG-GTP without raising Rac1, Cdc42 or RhoA. That makes it the exception within its own family, whose other four members - Ephexin-1 (NGEF), Ephexin-2 (ARHGEF19), Ephexin-3 (ARHGEF5) and Ephexin-5 (ARHGEF15) - are RhoA exchange factors. Rac1 is activated downstream of ARHGEF16 indirectly: active RhoG recruits its effector ELMO2 together with the Rac exchange factor DOCK4 to the plasma membrane, and the resulting complex assembles with the receptor tyrosine kinase EPHA2 at the tips of cortactin-rich protrusions. Through that route ARHGEF16 supports ligand-independent cell migration and invasion toward EGF, suppresses anoikis via RhoG-dependent PI3K and Akt signalling, and contributes to cortical organisation during mitosis. In mouse, Ephexin-4 also promotes engulfment of apoptotic cells in cooperation with ELMO1. The exchange activity is held off by two independent autoinhibitory modes, an N-terminal intermolecular one in which the SH3 domain of one molecule occludes the N-terminal region of another, and a C-terminal one involving the PDZ-binding motif; ELMO proteins relieve the first and PDZ-domain proteins such as TAX1BP3 relieve the second, so the same partners that act downstream of the GTPase also license the reaction that produces it. Upstream, EPHA2 phosphorylated on Ser897 recruits ARHGEF16, placing it on the ligand-independent, Akt-driven arm of Eph receptor signalling that is associated with tumour progression.'
