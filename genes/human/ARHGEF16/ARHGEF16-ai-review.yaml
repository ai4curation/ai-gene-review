    id: GO:0005515
    label: protein binding
  qualifier: enables
  evidence_type: IPI
  original_reference_id: PMID:20679435
  supporting_entities:
  - UniProtKB:Q96JJ3
  review:
    summary: Interaction with ELMO2, the RhoG effector. In PMID:20679435 active RhoG recruits ELMO2 together with the Rac GEF Dock4 to form a complex with EphA2 at the tips of cortactin-rich protrusions, which is how Rac1 gets activated downstream of a GEF that does not itself touch Rac1.
    action: KEEP_AS_NON_CORE
    reason: A real, mechanistically important interaction, but GO:0005515 says nothing about it and there is no informative molecular-function term for 'binds the effector of the GTPase I load'. ELMO proteins are on both sides of this protein's biology - downstream effector here, and upstream de-repressor in PMID:28667327, where Elmo1 competes the SH3 domain off the N20 region and makes Ephexin4 accessible to RhoG - so the interaction is better captured in core_functions and in the notes than by replacing this row.
    supported_by:
    - reference_id: PMID:28667327
      supporting_text: Elmo1 relieves the steric hindrance of Ephexin4 generated by the intermolecular interaction of the SH3 domain and makes Ephexin4 more accessible to RhoG.
