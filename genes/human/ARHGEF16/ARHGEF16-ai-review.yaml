core_functions:
- description: 'Catalyses guanine-nucleotide exchange on the Rho-family GTPase RhoG through its DH-PH cassette, converting RhoG-GDP to RhoG-GTP. The activity was measured on purified DH-PH protein, and the same experiment shows it does not exchange on Rac1; in cells, expression of Ephexin4 raises RhoG-GTP without raising Rac1, Cdc42 or RhoA. Substrate identity is recorded here and as a has_input extension because GO no longer has a term for it: the Rho-, Rac- and Ras-specific exchange-factor terms were all merged into GO:0005085, which now has no is_a children on any of three services.'
