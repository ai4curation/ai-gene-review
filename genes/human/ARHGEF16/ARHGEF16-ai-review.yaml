  - reference_id: PMID:30445756
    supporting_text: however, Ephexin4 displays GEF activity for RhoG, rather than for RhoA
- description: Couples the receptor tyrosine kinase EPHA2 to RhoG activation. ARHGEF16 binds EPHA2 through the region UniProt delimits as 275-481, which is also the region required for RhoG activation, and the interaction is strengthened by EPHA2 phosphorylation on Ser897 - the ligand-independent, Akt-driven arm of Eph signalling. An EPHA2 S897A mutant abolishes EphA2/Ephexin4-mediated RhoG activation, so the receptor interaction is a functional input to the exchange reaction rather than a bystander contact.
