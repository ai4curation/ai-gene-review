    supporting_text: S897 phosphorylation of EphA2 strengthens the interaction between EphA2 and Ephexin4, a guanine nucleotide exchange factor for the small GTPase RhoG.
  - reference_id: PMID:23772378
    supporting_text: S897A mutation of EphA2 abolished the EphA2/Ephexin4-mediated RhoG activation, promotion of cell migration, and resistance to anoikis.
- description: 'Binds PDZ-domain proteins through its C-terminal PDZ-binding motif (UniProt MOTIF 707-709, sequence ...ETDV). This is not an incidental contact: crystal structures show Ephexin4 is held shut by two independent autoinhibitory modes, and association of PDZ proteins with this motif relieves the C-terminal one, opening access for RhoG. The motif accounts for 42 of the gene''s 57 generic protein-binding rows, all contributed by PDZ-domain screens, and for the curated TAX1BP3 interaction.'
