- term:
    id: GO:0005096
    label: GTPase activator activity
  qualifier: enables
  extensions:
  - predicate: RO:0002233
    term:
      id: UniProtKB:P60953
      label: CDC42 (the GTPase assayed in PMID:21139582)
  evidence_type: IDA
  original_reference_id: PMID:21139582
  review:
    summary: 'A GTPase-activating-protein molecular function annotated to a guanine-nucleotide exchange factor. PMID:21139582 measured nucleotide exchange, not GTP hydrolysis: ''In vitro kinetic analysis confirmed that recombinant ARHGEF16 activates Cdc42''. GO:0005096 is the GAP term - ''Binds to and increases the activity of a GTPase, an enzyme that catalyzes the hydrolysis of GTP'' - whose synonyms are Rho GAP activity, Rac GAP activity and Ras GAP activity, and whose alternative ids are the merged substrate-specific GAP terms. A GAP accelerates hydrolysis and switches the GTPase off; a GEF loads GTP and switches it on. The word ''activates'' has been routed to the activator term.'
    action: MODIFY
    reason: 'This is a term-choice error, not a doubt about the experiment or the gene: the paper''s own title calls ARHGEF16 a GEF, the protein has no GAP domain (UniProt lists DH, PH and SH3 only; the InterPro signatures are IPR000219 and IPR047271), and the same curator on the same paper chose the correct BP term GO:0032489. The trap is that GO:0090630 ''activation of GTPase activity'', which this gene also carries and which IS correct, has a name that reads like the GAP molecular function while its definition is exchange-based (''replacement of GDP by GTP''). Both definitions were pinned on two services. The replacement is GO:0005085, with CDC42 as has_input, which preserves everything the experiment showed. The blast radius is the reason to fix it rather than note it: QuickGO returns 83 annotations across 81 taxa carrying UniProtKB:Q5VV41 in WITH/FROM for GO:0005096, all by Ensembl Compara IEA (GO_REF:0000107) or ISO (GO_REF:0000119), and mouse Arhgef16 - which has no experimental annotation of its own - carries it twice.'
    proposed_replacement_terms:
    - id: GO:0005085
      label: guanyl-nucleotide exchange factor activity
    supported_by:
    - reference_id: PMID:21139582
      supporting_text: In vitro kinetic analysis confirmed that recombinant ARHGEF16 activates Cdc42 and this was increased by the addition of recombinant Tip-1 and E6.
    - reference_id: PMID:20679435
      supporting_text: Although the DH-PH domain of Ephexin4 did not exchange nucleotide on Rac1, it possessed GEF activity of RhoG in vitro
    - reference_id: file:human/ARHGEF16/ARHGEF16-bioinformatics/RESULTS.md
      supporting_text: The single human row has been projected to 83 orthologs in 81 species.
