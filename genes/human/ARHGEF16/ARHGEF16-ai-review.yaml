  - UniProtKB:P63104
  review:
    summary: Recovery of ARHGEF16 as a YWHAZ/14-3-3 zeta interactor in a 14-3-3 proteomic screen.
    action: MODIFY
    reason: 'The partner is a 14-3-3 protein and GO:0071889 ''14-3-3 protein binding'' is active and describes the interaction exactly, so the uninformative generic term should be replaced rather than removed. The assignment is consistent with the protein''s phosphorylation state: UniProt maps ten phosphosites on ARHGEF16 (S6, S41, S107, S174, S191, S208, S227, S230, S240 and T226), and 14-3-3 capture is phospho-dependent. Seven GO:0005515 rows across five references report this one binding mode. This row comes from an affinity-purification dataset, the same method class as the GO:0045296 cadherin row that this review marks over-annotated, so the different verdict needs saying. Two things separate them. The retyped term here names the partner class actually recovered (a 14-3-3 protein), whereas GO:0045296 asserts contact with cadherin specifically, which an E-cadherin complex pulldown cannot distinguish from capture via the eleven junctional PDZ scaffolds ARHGEF16 does bind. And the 14-3-3 result is replicated across five independent references and three partners with an independent mechanistic basis in the protein''s ten mapped phosphosites, whereas the cadherin row is a single dataset. The generic-to-specific retyping is therefore a change of label on a reproduced observation, not a new claim of directness.'
    proposed_replacement_terms:
    - id: GO:0071889
      label: 14-3-3 protein binding
