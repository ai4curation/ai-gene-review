- term:
    id: GO:0005515
    label: protein binding
  qualifier: enables
  evidence_type: IPI
  original_reference_id: PMID:30126976
  supporting_entities:
  - UniProtKB:Q12959
  review:
    summary: Interaction with the PDZ-domain protein DLG1, reported by a screen that assays PDZ-domain binding.
    action: MODIFY
    reason: 'ARHGEF16 ends in ...ETDV, a canonical class I PDZ-binding motif that UniProt annotates as MOTIF 707-709, and every partner in this group carries PDZ domains. Forty-two GO:0005515 rows across three references therefore report one C-terminal binding determinant measured many times, not forty-two independent findings. GO:0030165 PDZ domain binding says what the interaction is and is already on this gene from PMID:21139582 (TAX1BP3), so the generic term should be replaced rather than kept. The replacement is not decoration: PMID:33597305 shows that association of PDZ proteins with this motif relieves one of the two autoinhibitory modes that hold the DH domain shut, which makes PDZ binding a regulator of the gene''s own catalytic activity rather than an incidental contact. The partition is checked rather than asserted, in both directions: pdz_partner_check.py reads this review and fetches each partner live from UniProt, confirming that all 38 partners on the PDZ side carry a PDZ domain - 147 between them, including TAX1BP3, the one partner GOA itself already types GO:0030165 - and that none of the 11 accessions outside that set does. Those 11 accessions are 10 distinct proteins: TFG appears twice, as the reviewed Q92734 and the unreviewed Q05BK6.'
    proposed_replacement_terms:
    - id: GO:0030165
      label: PDZ domain binding
    supported_by:
    - reference_id: PMID:33597305
      supporting_text: phosphorylation of a conserved tyrosine residue in its N-terminal inhibitory domain and association of PDZ proteins with its C-terminal PDZ-binding motif may respectively relieve the two autoinhibitory modes in Ephexin4
    - reference_id: file:human/ARHGEF16/ARHGEF16-bioinformatics/RESULTS.md
      supporting_text: Every partner on the PDZ side carries at least one PDZ domain
