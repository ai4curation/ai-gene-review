- description: 'A-kinase anchoring. Through the GOLD domain ACBD3 binds PKA regulatory subunits RIalpha
    and RII, positioning PKA at the Golgi, where it governs cargo-triggered PKA activation controlling
    KDEL-receptor retrograde trafficking. ACBD3 also positions PKA at mitochondria, coupling cholesterol
    transport to hormone-stimulated steroidogenesis, but that location is deliberately not listed below:
    UniProt''s steroidogenesis statement is ECO:0000250 by similarity, and the mitochondrion annotation
    is kept non-core for the same reason.'
