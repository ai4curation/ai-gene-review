- term:
    id: GO:0000149
    label: SNARE binding
  evidence_type: IPI
  original_reference_id: PMID:38134218
  qualifier: enables
  review:
    action: NEW
    summary: 'Proposed new annotation. ACBD3 binds the v-SNARE SEC22B, and the interaction is mapped on
      both sides: co-immunoprecipitation of GFP-ACBD3 with HaloTag-SEC22B, narrowed by truncation to ACBD3
      328-528 (the unique region plus the GOLD domain) and, on SEC22B, to the longin domain alone - the
      SNARE and transmembrane domains do not bind.


      This is worth annotating for two reasons. First, the gene has no informative molecular-function
      term for any SNARE-pathway interaction, while six of its interactions sit under bare GO:0005515;
      SNARE binding is exactly the kind of specific term those rows should have. Second, it settles the
      question of whether the GOLD domain is a viral-only surface: it now has two host partners, the SEC22B
      longin domain here and PKA RIIalpha in PMID:37044218, alongside picornaviral 3A.


      Deliberately narrower than the paper''s own wording. The authors conclude ACBD3 "is part of the
      SNARE complex involving the SM protein SCFD1 and the v-SNARE SEC22B", but the assays are binary
      co-IPs from overexpressing HEK-293T cells, and the cytosolic MWT374-376>AAA mutant binds SEC22B
      more strongly than wild type - so complex membership is not established and no complex or fusion
      term is proposed, only the binding.


      Two limits worth stating. The SEC22B knockout in the same screen "caused a drastic loss of Golgi
      organization resulting in Golgi fragmentation", so SEC22B''s specific requirement for ACBD3 recruitment
      is confounded by a general Golgi defect - another reason to annotate the binding and not a requirement.
      And this is not proposed as a core function: the interaction serves ACBD3''s own delivery to the
      cis-Golgi, upstream of what ACBD3 then does for the cell, whereas core_functions record its two
      outputs - PI4KB recruitment and PKA anchoring. An informative molecular-function term for a real,
      surface-mapped interaction does not have to be a core function.'
    reason: 'Fills a real gap: SEC22B is an ACBD3 partner with the interaction surface mapped on both
      proteins, and no annotation on this gene records any SNARE-pathway interaction. IPI because the
      evidence is reciprocal co-immunoprecipitation with domain mapping. Restricted to the binding term
      rather than complex membership, which the co-IP data do not establish.'
    supported_by:
    - reference_id: PMID:38134218
      supporting_text: We thus conclude that the UR and GOLD domain of ACBD3 interacts with the longin
        domain of SEC22B
    - reference_id: PMID:38134218
      supporting_text: The SNARE and transmembrane domain did not interact with ACBD3 (328-528); however,
        the longin domain alone does interact with ACBD3 (328-528).
    - reference_id: PMID:38134218
      supporting_text: Loss of TMED10 and SEC22B caused a drastic loss of Golgi organization resulting
        in Golgi fragmentation.
- term:
    id: GO:0034067
    label: protein localization to Golgi apparatus
  evidence_type: IMP
  original_reference_id: PMID:38134218
  qualifier: involved_in
  review:
    action: NEW
    summary: 'Proposed new annotation. ACBD3''s whole documented output is bringing other proteins to
      Golgi membranes - PI4KB, PKA regulatory subunits, FAPP2, PPM1L - yet the gene carries no protein-localisation
      process term at all. GO:0043495 protein-membrane adaptor activity records the molecular function;
      this is its biological-process counterpart.


      The evidence is a loss-of-function phenotype with the direction controlled: CRISPR-knockout of ACBD3
      causes loss of PI4KIIIbeta from the Golgi apparatus, whereas knockout of PI4KIIIbeta leaves ACBD3
      localisation unaffected. The same paper shows the dependency propagates upstream - SCFD1 knockout
      loses both ACBD3 and PI4KIIIbeta - which is what places ACBD3 between the two.


      GO:0034067 rather than a regulation term: ACBD3 is the adaptor that does the localising, not a modulator
      of someone else''s localisation machinery.'
    reason: 'Fills a real gap: the gene''s defining activity is recruiting client proteins to the Golgi,
      the molecular function is annotated but the process is not. IMP because the evidence is the ACBD3-knockout
      phenotype, with the reciprocal PI4KB knockout as the direction control.'
