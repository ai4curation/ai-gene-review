      by NMR of ACBD3 residues 241-308. Bare protein binding conveys none of this.


      Note the domain assignment specifically, since it is easy to get wrong: ACBD3 is named for its acyl-CoA-binding
      domain, and the GOLD domain is the one usually discussed, but neither carries the PI4KB interaction.
      UniProt is explicit that the Q domain binds PI4KB and TBC1D22A/B, while the GOLD domain (384-526)
      binds picornaviral 3A proteins. The viral 3A interaction covered by this same row therefore uses
      a different surface from the host kinase interaction - which is why 3A can clamp ACBD3 onto replication
      organelles without displacing PI4KB.'
