- term:
    id: GO:0000062
    label: fatty-acyl-CoA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: 'Fatty-acyl-CoA binding, assigned by InterPro from the ACB (acyl-CoA binding) domain at residues
      83-174. This is a domain-implies-function inference with no functional support for this gene, and
      the case against it is unusually clear.


      ACBD3''s characterised activities reside in its Q domain, its unique region and its GOLD domain,
      not in the ACB domain: the Q domain recruits PI4KB, and the unique region together with the GOLD
      domain binds the golgins giantin and golgin-45 (at MWT374-376), the SEC22B longin domain, PKA regulatory
      subunit RII and picornaviral 3A proteins - the last three converging on residues 380-381. No acyl-CoA
      ligand, binding affinity or acyl-CoA-dependent activity has been reported. A dense, gates-passed
      literature synthesis for this gene citing more than thirty primary papers does not mention acyl-CoA
      once - across the whole Golgi scaffolding, steroidogenesis, sphingolipid, STING and picornavirus
      literature.


      Marked over-annotated rather than removed: the ACB domain is genuinely present and PROSITE-recognised,
      so a ligand may yet be found, and ACBD-family members do vary in whether the domain retains binding.
      But the annotation should not be read as characterised - it is the name of a domain, not a demonstrated
      activity.'
    action: MARK_AS_OVER_ANNOTATED
    reason: Domain-based inference with no gene-specific evidence. The characterised functions map to
      the Q domain, the unique-region MWT374-376 motif and the GOLD domain; no acyl-CoA ligand has ever
      been reported, and a thirty-plus-citation synthesis of this gene's literature never mentions acyl-CoA.
    supported_by:
    - reference_id: file:human/ACBD3/ACBD3-uniprot.txt
      supporting_text: FT   DOMAIN          83..174
    - reference_id: file:human/ACBD3/ACBD3-deep-research-affinage.md
      supporting_text: Its central scaffolding output is the direct recruitment of the lipid kinase PI4KB
        to membranes
    - reference_id: file:human/ACBD3/ACBD3-uniprot.txt
      supporting_text: Recruits PI4KB to the Golgi apparatus membrane; enhances the enzyme
