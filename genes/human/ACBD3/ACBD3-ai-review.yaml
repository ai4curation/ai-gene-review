      (O91464, a kobuvirus), poliovirus type 1 Mahoney (P03300) and coxsackievirus B3 Woodruff (Q66282),
      both enteroviruses. That set is the paper''s argument, not a screen dragnet: it is titled for the
      observation that ACBD3-TBC1D22 binding is affected differently by enteroviral than by kobuviral
      3A.


      Two mechanisms sit behind it, on two different surfaces. PI4KB and TBC1D22A/B compete for the same
      Q domain (residues 241-308) - UniProt states the two interactions are mutually exclusive - so that
      domain is a switch between lipid-kinase recruitment and Rab-directed traffic. The viral 3A proteins
      bind elsewhere, at the GOLD domain and the unique region upstream of it, which is why 3A can clamp
      ACBD3 without displacing PI4KB while still modulating the Rab-GAP arm.


      Bare protein binding records none of this, and it is the same MODIFY as the other uninformative
      rows: every partner here engages ACBD3 as a membrane-recruitment adaptor.'
    action: MODIFY
    reason: 'Uninformative term for a paper whose whole point is which surface each partner uses: PI4KB
      and TBC1D22A/B competing for the Q domain, and enteroviral versus kobuviral 3A proteins engaging
      the GOLD/unique-region surface with different consequences for the Rab-GAP arm. All nine collapsed
      WITH/FROM accessions were resolved and all are real, mechanistically relevant partners, so this
      is a term problem rather than an evidence problem.'
