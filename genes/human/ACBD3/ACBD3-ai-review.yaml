gene_symbol: ACBD3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'ACBD3 (GCP60, PAP7) is a peripheral membrane scaffolding protein of the Golgi and trans-Golgi
  network. It is recruited to Golgi membranes through a short MWT motif that binds the golgins giantin
  and golgin-45, and it organises lipid-modifying and signalling machinery there and at ER-Golgi contact
  sites. Its central activity is recruitment of the lipid kinase PI4KB through its GOLD domain: the interaction
  anchors PI4KB to the membrane and stimulates the enzyme by raising the local concentration of its substrate,
  maintaining Golgi PI4P homeostasis. Through the same GOLD domain ACBD3 acts as an A-kinase anchoring
  protein, binding PKA regulatory subunits to position the kinase at the Golgi and at mitochondria, where
  it couples cholesterol transport to hormone-stimulated steroidogenesis and controls cargo-triggered
  PKA activation governing KDEL-receptor retrograde traffic. ACBD3 is required for Golgi stack integrity
  - its loss gives enlarged, unstacked Golgi - and for FAPP2-mediated glucosylceramide transport and ER-to-Golgi
  sphingolipid flux. The same membrane-coupling activity is extensively exploited by pathogens: picornavirus
  3A proteins clamp ACBD3 onto replication-organelle membranes to recruit and activate PI4KB for viral
  phosphoinositide synthesis. Despite its name and an intact acyl-CoA binding domain, no acyl-CoA ligand
  or acyl-CoA-dependent activity has been reported for the protein.'
