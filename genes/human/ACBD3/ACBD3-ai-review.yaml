- term:
    id: GO:0006888
    label: endoplasmic reticulum to Golgi vesicle-mediated transport
  evidence_type: IMP
  original_reference_id: PMID:37044218
  qualifier: involved_in
  review:
    summary: 'ER-to-Golgi vesicle-mediated transport by mutant phenotype, from PMID:37044218 - the experimental
      counterpart of the IBA above. Worth being precise about what the paper shows, because the term names
      the anterograde leg while the paper''s subject is the retrograde one.


      ACBD3 holds the PKA holoenzyme at the Golgi through RII. Arrival of anterograde cargo from the ER
      releases the catalytic subunit, activating PKA; ACBD3 depletion reduces Golgi RII and makes that
      activation - and KDEL-receptor retrograde transport - constitutive and independent of cargo influx.
      So ACBD3 is the element that couples the two directions, making retrograde recycling responsive
      to forward flux.


      ACCEPT: the loss-of-function phenotype does perturb traffic between ER and Golgi, and ACBD3 acts
      in the early secretory pathway, so the term is not wrong. But it captures the trigger rather than
      the regulated process, which is why a retrograde regulation term is proposed as a NEW annotation
      below - additively, not as a replacement for a curator''s experimental call.'
    action: ACCEPT
    supported_by:
    - reference_id: file:human/ACBD3/ACBD3-uniprot.txt
      supporting_text: 'CC   -!- FUNCTION: Involved in the maintenance of Golgi structure by interacting'
    - reference_id: PMID:37044218
      supporting_text: "Forward \ntrafficking of proteins from the ER triggers activation of PKA by releasing\
