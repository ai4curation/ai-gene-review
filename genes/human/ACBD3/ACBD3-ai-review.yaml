    summary: 'Interaction with TBC1D22B (UniProtKB:Q9NU19 - this row''s only WITH/FROM accession; the
      companion PMID:33961781 row carries both TBC1D22A and TBC1D22B), a Rab GTPase-activating protein.
      These are easy to mistake for uncharacterised screen hits, but UniProt shows the interaction is
