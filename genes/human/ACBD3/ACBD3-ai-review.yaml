    review_notes: 'Gates passed with pairwise = win, and its breadth is genuinely useful - it synthesises
      30+ primary papers, and its most valuable contribution here was negative, never mentioning acyl-CoA
      and so supporting the GO:0000062 call. But it states that PI4KB is recruited ''through its GOLD
      domain'', and that is wrong: UniProt is explicit that the Q domain (241-308) binds PI4KB and TBC1D22A/B
      while the GOLD domain (384-526) binds picornaviral 3A proteins. An earlier draft of this review
      propagated that error into seven places by quoting the provider verbatim as supporting_text instead
      of checking it against UniProt. Marked MISCITED for that specific claim; the quote has been removed
      from every supported_by block. The lesson is the campaign''s own rule applied to itself - a provider
      sentence is a lead, not evidence, even when the record is otherwise strong.'
core_functions:
- description: Membrane adaptor that recruits PI4KB to the Golgi. ACBD3 binds PI4KB directly through its
    Q domain (residues 241-308), anchoring the lipid kinase to Golgi membranes and stimulating its activity
    by raising the local concentration of its substrate, thereby maintaining Golgi PI4P homeostasis. The
    same activity is hijacked by picornaviruses, whose 3A proteins clamp ACBD3 onto replication-organelle
    membranes to build viral PI4P pools. The same Q domain binds TBC1D22A and TBC1D22B mutually exclusively
    with PI4KB, so the domain acts as a switch; picornaviral 3A proteins engage the separate GOLD domain,
    which is why viral clamping does not displace the kinase.
  molecular_function:
    id: GO:0043495
    label: protein-membrane adaptor activity
  directly_involved_in:
