  findings:
  - statement: ACBD3 binds SREBP1 directly and blocks its intracellular maturation - not by disrupting
      the SREBP1-SCAP-Insig1 complex, but by engaging the regulator itself.
    supporting_text: ACBD3 blocked intracellular maturation of SREBP1 probably through directly binding
      with the lipid regulator rather than disrupted SREBP1-SCAP-Insig1 interaction
  - statement: 'The FUNCTIONAL effect is attributed to the ACB-domain-containing N-terminal region, and
      only partially: deleting it attenuates ACBD3''s suppression of the FASN promoter (40% vs 76%) without
      abolishing it, and the paper''s own wording is "plays an important role", not "maps to". The SREBP1
      co-IP itself was done with full-length ACBD3 and carries no domain mapping at all. So the ACB region
      contributes to a function that is separate from acyl-CoA binding as such, without being shown to
      be where that function resides.'
    supporting_text: Taken together, these results suggest that ACB domain-containing N-terminal sequence
      of ACBD3 plays an important role in its regulatory effects on SREBP1.
  - statement: 'The lipogenic output, stated with the paper''s own timing caveat: de novo palmitate synthesis
      is unchanged at 48 h of ACBD3 overexpression and reduced only at 72 h and at higher doses. An overexpression
      phenotype, so IMP-grade at best, and quoted here at the resolution the experiment supports.'
    supporting_text: if allowing overexpressed ACBD3 to be present in the cells for longer time (72 hours),
      we could see the reduction of palmitate synthesis
  - statement: The binding assay, for the record, is full-length ACBD3 against the SREBP1 precursor -
      specific for the precursor over the mature nuclear form, but with no domain resolution.
    supporting_text: GST-tagged ACBD3 co-immunoprecipitated with endogenous precursor fSREBP1 but not
      mature nSREBP1
  - statement: The N-terminal deletion attenuates rather than abolishes, which is why the domain attribution
      is reported as partial.
    supporting_text: significantly attenuated ACBD3-mediated suppression of FASN promoter activity, (40%
      vs. 76%, Figure 5A)
  - statement: And the residual activity is stated explicitly by the authors.
    supporting_text: its disruptive effect was still smaller than that mediated by full-length ACBD3
  - statement: 'The loss-of-function direction: nuclear SREBP1 rises when endogenous ACBD3 is depleted,
      in two cell lines. Together with the overexpression result this makes the perturbation bidirectional.'
    supporting_text: More strikingly, after knocking down endogenous ACBD3, nuclear SREBP1 expression
      was enhanced in both HEK293T and Hep G2 cells
  - statement: With the authors' conclusion, and the word they choose - "intrinsically".
    supporting_text: All these results strongly suggest that ACBD3 intrinsically plays a negative role
      in SREBP1 protein maturation.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Fetched in round 9 after a reviewer flagged that PMID:30755512's results section attributes
      two functions to the ACB domain and cites primary papers for both. This is that paper's SREBP1 reference.
      It refutes this review's earlier claim that the ACB domain has no gene-specific evidence. The perturbation
      is bidirectional - overexpression and shRNA knockdown, the latter in two cell lines with a specificity
      control - so the strength is better than a single-direction overexpression study, though it is still
      one paper and the palmitate effect appears only at 72 h. A round-10 version of this note said all
      assays were overexpression-based; that was an error from reading the Figure 3 legend rather than
      the paragraph reporting its result.
- id: PMID:23572552
  title: ACBD3 interaction with TBC1 domain 22 protein is differentially affected by enteroviral and kobuviral
    3A protein binding.
  findings:
  - statement: 'The Q-domain switch is this paper''s central result, mapped rather than asserted: fine-scale
      mapping shows the TBC1D22A/B and PI4KB binding determinants within ACBD3 are the same.'
    supporting_text: Fine-scale mapping of binding determinants within ACBD3 revealed that the interaction
      domains for TBC1D22A/B and PI4KB are identical.
  - statement: And the two interactions are mutually exclusive, which is what makes the domain a switch
      rather than a shared dock. This is the primary source behind UniProt's mutual-exclusivity statement
      and behind the MODIFY on the TBC1D22 rows.
    supporting_text: Affinity purification confirmed that PI4KB and TBC1D22A/B interactions with ACBD3
      are mutually exclusive, suggesting a possible regulatory mechanism for recruitment of PI4KB.
  - statement: 'The differential effect that gives the paper its title: enteroviral and kobuviral 3A proteins
      engage ACBD3 with different consequences for TBC1D22A/B and PI4KB recruitment - which is why the
      nine WITH/FROM accessions on this row span both virus groups and both host partners.'
    supporting_text: we also find that the enterovirus and kobuvirus 3A interactions with ACBD3 are functionally
      distinct with respect to TBC1D22A/B and PI4KB recruitment
- id: PMID:26290611
  title: Ligand binding to the ACBD6 protein regulates the acyl-CoA transferase reactions in membranes.
  findings:
  - statement: 'The reference behind ACBD3 acyl-CoA binding, reached via PMID:38134218. Its subject is
      ACBD6, and the ACBD3 datum survives here only inside a contrastive clause: ligand binding dimerises
      ACBD1 and ACBD3 but not ACBD6. Deliberately not stated more strongly than that - the record is abstract-only,
      so whether ACBD3 was assayed in this work or the contrast points at prior literature cannot be determined
      from what is readable. The weight of the claim is carried instead by PMID:38134218''s discussion,
      where an independent 2024 group asserts of this same reference that ACBD3 has been demonstrated
      to oligomerise with C18:1-CoA or C16:0-CoA.'
    supporting_text: In contrast to ACBD1 and ACBD3, ligand binding did not result in the dimerization
      of ACBD6.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Abstract-only in the cache (PMC blocks full text), so the ACBD3 data are quotable here
      only through the contrast drawn with ACBD6, and the ligand identities come from PMID:38134218''s
      restatement of this work. Title-verified against PubMed. Note the paper is titled and framed around
      ACBD6 - which is exactly why a title-level scan missed it, and why the campaign rule about not treating
      a silent record as evidence of absence applies. Round 10: the finding no longer says the contrast
      "establishes" the binding - the cached abstract cannot carry that. The claim now leans on PMID:38134218''s
      discussion, where an independent group asserts of this reference that ACBD3 has been demonstrated
      to oligomerise with those ligands.'
- id: PMID:27009356
  title: Structural insights and in vitro reconstitution of membrane targeting and activation of human
    PI4KB by the ACBD3 protein.
  findings:
  - statement: 'The structural basis of ACBD3''s core molecular function: an NMR structure of the ACBD3:PI4KB
      complex. This is structural support for the Q-domain assignment, but not independent of it: the
      paper follows Greninger''s mammalian two-hybrid mapping (PMID:23572552) and describes itself as
      confirming it, so the constructs were chosen from that result. Methodologically independent, evidentially
      downstream. UniProt''s DOMAIN line cites PubMed:23572552, not this paper.'
    supporting_text: Here, we present an NMR structure of the complex of PI4KB and its interacting partner,
      Golgi adaptor protein acyl-coenzyme A binding domain containing protein 3 (ACBD3).
  - statement: 'The construct fixes the domain: the NMR complex is ACBD3 residues 241-308 - the Q domain
      - with the PI4KB N-terminus, not the GOLD domain. Worth recording explicitly, since an earlier draft
      of this review mis-assigned the interaction to GOLD on a provider sentence.'
    supporting_text: We expressed the Q domain of ACBD3 (residues 241–308) and the N-terminal region of
      PI4KB (residues 1–68)
  - statement: 'The functional consequence, and the basis of GO:0043495 plus the proposed GO:0034067:
      ACBD3 recruits PI4KB to membranes in vitro and in vivo, recruitment raises the kinase''s activity,
      and the complex is required for normal Golgi function.'
    supporting_text: We show that ACBD3 is capable of recruiting PI4KB to membranes both in vitro and
      in vivo, and that membrane recruitment of PI4KB by ACBD3 increases its enzymatic activity and that
      the ACBD3:PI4KB complex formation is essential for proper function of the Golgi.
  - statement: The provenance, in the paper's own words - it localises the interaction to the Q domain
      following Greninger and colleagues.
    supporting_text: Using a mammalian two-hybrid assay Greninger and colleagues20 localized this interaction
      to the Q domain of ACBD3
- id: PMID:28514442
  title: Architecture of the human interactome defines protein communities and disease networks.
  findings:
  - statement: BioPlex 2.0, a proteome-scale affinity-purification/mass-spectrometry survey rather than
      a study of ACBD3. Its contribution here is one WITH/FROM accession, TBC1D22B (Q9NU19), corroborating
      a partner that PMID:23572552 characterised mechanistically. Screen-scale support, and treated as
      such.
    supporting_text: we present BioPlex 2.0 (Biophysical Interactions of ORFeome-derived complexes), which
      uses robust affinity purification-mass spectrometry methodology to elucidate protein interaction
      networks and co-complexes nucleated by more than 25% of protein-coding genes from the human genome
- id: PMID:29750412
  title: ACBD3 is required for FAPP2 transferring glucosylceramide through maintaining the Golgi integrity.
  findings:
  - statement: ACBD3 is a FAPP2 interacting partner - the primary source for the FAPP2 arm, fetched after
      a reviewer noted that PMID:38134218 attributes FAPP2 recruitment to the ACBD domain while this review
      credited it to the gene with no domain attached.
    supporting_text: we identify a Golgi-resident protein, acyl-coenzyme A binding domain containing 3
      (ACBD3), as an interacting partner of FAPP2
  - statement: 'The mechanism as this paper frames it is INDIRECT, which matters for how the ACB attribution
      should be read: ACBD3 knockdown fragments the Golgi, and FAPP2 dispersal follows from that. The
      title says the same - "through maintaining the Golgi integrity". So "the ACBD domain recruits FAPP2"
      is PMID:38134218''s compression of this work, not a domain mapping made here; the cached abstract
      contains no ACB-domain assignment at all.'
    supporting_text: We find that ACBD3 knockdown leads to dramatic Golgi fragmentation, which subsequently
      causes FAPP2 dispersal throughout the cytoplasm and a decreased localization at trans-Golgi network
  - statement: With the rescue control that makes the knockdown interpretable.
    supporting_text: the expression of siRNA-resistant full-length ACBD3 can rescue these defects caused
      by ACBD3 knockdown
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Abstract-only in the cache. Cited for the FAPP2/glucosylceramide and Golgi-integrity
      arm. Note the gap between the two sources: PMID:38134218''s introduction says the ACBD domain "recruits
      the membrane-shaping protein FAPP2" citing this paper, but nothing in this abstract maps the interaction
      to the ACB domain, and its own model is indirect - Golgi fragmentation causing FAPP2 dispersal.
      The domain attribution is therefore reported as PMID:38134218''s, not as this paper''s, and the
      ACB entry in the notes'' domain map is hedged accordingly.'
- id: PMID:30755512
  title: ACBD3 Is an Essential Pan-enterovirus Host Factor That Mediates the Interaction between Viral
    3A Protein and Cellular Protein PI4KB.
  findings:
  - statement: 'Read the results paragraph, not the abstract: it opens by assigning the ACB domain TWO
      functions with primary citations - long-chain acyl-CoA binding (ref 29) and SREBP1 binding with
      reduced de novo palmitate synthesis (ref 30, = PMID:23166793). The acyl-CoA half is family-level
      (ACBD1 to ACBD7) and hedged as "suggested", but both resolve to real primary evidence, and together
      they are why GO:0000062 is now KEEP_AS_NON_CORE rather than MARK_AS_OVER_ANNOTATED. The abstract,
      which this review originally quoted from, carries neither.'
    supporting_text: The ACB domain, which is relatively conserved among all known ACBD proteins (ACBD1
      to ACBD7), has been suggested to be important for binding to long-chain acyl-CoA (29) and for binding
      to sterol regulatory element binding protein 1 (SREBP1), causing reduction of de novo palmitate
      synthesis (30).
  - statement: 'The sufficiency form of the domain result, tighter than "ACB and CAR are dispensable":
      the Q and GOLD domains together suffice to support enterovirus replication.'
    supporting_text: we dissected the different domains of ACBD3 and uncovered that the glutamine-rich
      region (Q) and Golgi dynamics domain (GOLD) together suffice to support enterovirus replication
  - statement: 'And the internal negative control in the same figure: GOLD alone rescues neither replication
      nor PI4KB recruitment. So it is Q+GOLD, not GOLD - which independently requires the Q domain for
      PI4KB recruitment, consistent with PMID:27009356''s NMR mapping.'
    supporting_text: mut3, which contains only the GOLD domain, could not rescue virus replication (Fig.
      7B) or PI4KB recruitment (Fig. 7C)
  - statement: 'Independent corroboration for the shared-surface conclusion, which otherwise rests on
      PMID:38134218 alone: this paper states that enterovirus and kobuvirus 3A proteins bind the GOLD
      domain most probably at the same site as giantin. Hedged as "most probably", and recorded as such.'
    supporting_text: Enterovirus and kobuvirus 3A proteins bind to the GOLD domain, most probably at the
      same site as giantin (7, 18).
  - statement: 'ACBD3 is upstream of PI4KB recruitment in the viral setting: no PI4KB recruitment occurs
      without ACBD3. Consistent with the reciprocal-knockout direction control in PMID:38134218 and with
      the proposed GO:0034067 annotation.'
    supporting_text: PI4KB recruitment was not observed in the absence of ACBD3.
  - statement: 'The ACBD3-PI4KB interaction itself, not merely ACBD3''s presence, is what the virus needs:
      an ACBD3 mutant unable to bind PI4KB restores 3A localisation but not replication.'
    supporting_text: an ACBD3 mutant that cannot bind to PI4KB restored 3A localization, but not virus
      replication
- id: PMID:31381608
  title: Convergent evolution in the mechanisms of ACBD3 recruitment to picornavirus replication sites.
  findings:
  - statement: Structures of ACBD3 bound to the 3A proteins of four enteroviruses (poliovirus, EV-A71,
      EV-D68, rhinovirus B14), which is the structural basis for treating the GOLD/UR surface as the viral
      interface.
    supporting_text: we present a structural characterization of the interaction between ACBD3 and the
      non-structural 3A proteins of four representative enteroviruses (poliovirus, enterovirus A71, enterovirus
      D68, and rhinovirus B14)
  - statement: 'The convergence result: enteroviruses and kobuviruses, distinct picornavirus groups, arrive
      independently at the same ACBD3-based recruitment mechanism. That recurrence is the argument that
      ACBD3''s membrane-adaptor activity, not an incidental surface, is what is being hijacked.'
    supporting_text: These structures uncovered a striking convergence in the mechanisms of how enteroviruses
      and kobuviruses, members of a distinct group of picornaviruses that also rely on ACBD3, recruit
      ACBD3 and its downstream effectors to the sites of viral replication.
- id: PMID:33961781
  title: Dual proteome-scale networks reveal cell-specific remodeling of the human interactome.
  findings:
  - statement: BioPlex 3.0 plus an HCT116 network - again proteome-scale rather than ACBD3-specific. It
      contributes two WITH/FROM accessions, TBC1D22A (Q8WUA7) and TBC1D22B (Q9NU19), so it corroborates
      both paralogs where the PMID:28514442 row carries only TBC1D22B.
    supporting_text: The first, BioPlex 3.0, results from affinity purification of 10,128 human proteins-half
      the proteome-in 293T cells and includes 118,162 interactions among 14,586 proteins.
- id: PMID:37044218
  title: An A-kinase anchoring protein (ACBD3) coordinates traffic-induced PKA activation at the Golgi.
  findings:
  - statement: The GOLD domain of ACBD3 binds PKA regulatory subunit RIIalpha and recruits the PKA holoenzyme
      to the Golgi; RIalpha is not detected in the same GST pull-down. The authors do not treat that as
      excluding RI - see the next finding. What the result does contradict is UniProt's (By similarity)
      assertion that ACBD3 does NOT interact with RII-alpha.
    supporting_text: Our results indicate that ACBD3 interacts specifically with the RII, but not RI subunit.
  - statement: 'The paper reconciles its own RII-only pull-down with RI binding, so the two records are
      not in flat conflict: a typical dual-specific AKAP binds RI 10-100 fold more weakly than RII, RIalpha
      binding may therefore sit below the assay''s detection limit, and the authors attribute the organelle
      difference to RI and RII being enriched at mitochondria and the Golgi respectively.'
    supporting_text: it is possible that ACBD3 binds RIα in such low affinity that this binding is below
      the detection limit in our assay.
  - statement: The compartment split stated explicitly - which is also why GO:0005739 is kept non-core
      and excluded from the AKAP core function's locations.
    supporting_text: The discrepancy between ACBD3’s preference for the R subunit at different organelles
      may be explained by the fact that RI and RII are highly enriched at the mitochondria and the Golgi
      apparatus, respectively
  - statement: 'ACBD3 makes retrograde transport cargo-dependent: its depletion reduces Golgi RII and
      renders PKA activation and KDEL-receptor retrograde transport constitutive, independent of cargo
      influx from the ER. This is the basis of the proposed GO:2000156 annotation.'
    supporting_text: "depletion of ACBD3 \nreduces the Golgi fraction of RII, resulting in moderate, but\
      \ constitutive \nactivation of PKA and KDELR retrograde transport, independent of cargo influx \n\
      from the ER"
  - statement: 'What the mutagenesis establishes is the alpha helix, not a residue. The scan is a proline
      scan of the single alpha helix at the unique-region/GOLD boundary: K381P greatly reduces RIIalpha
      binding, Q379P and I380P have almost no effect, and the authors read this as K381P disrupting the
      helical structure that carries the interface. So the RIIalpha-binding interface is that helix, spanning
      roughly 379-383; the scan identifies no individual contact residue.'
    supporting_text: K381P mutation greatly reduced the interaction between RIIα and the GOLD domain,
      while Q379P and I380P had almost no effect, suggesting that K381P disrupts the helical structure
      and the RIIα-binding interface.
  - statement: 'Why the scan cannot name a contact even in principle: the substitutions are prolines,
      chosen because proline breaks helices, so a loss of binding reports on secondary structure rather
      than on a side-chain contact.'
    supporting_text: we generated GST-tagged GOLD mutants (Q379P, I380P, or K381P) for pulldown assays
      since proline is known to be a potent helix breaker
  - statement: 'Ile380 is the authors'' proposed contact within that helix, and it is an inference rather
      than a measurement: it comes from inspecting the crystal structure of the GOLD domain alone, with
      no R subunit bound, is hedged as "likely", and is offered to explain why the buried Phe383 does
      not make ACBD3 RI-selective. Its only direct test in the same paper, I380P, had almost no effect
      - so I380 is a hypothesis about the contact, not a mapped one.'
    supporting_text: the side chain of Ile380 is mostly available for protein interactions, likely involved
      in binding the shallow hydrophobic groove on RII surface
  - statement: The structure inspected is apo ACBD3 GOLD (PDB 5LZ1), which is why the Ile380 argument
      is a solvent-accessibility inference rather than an observed interface.
    supporting_text: Structural illustration is generated by PyMOL using the crystal structure file 5LZ1.
  - statement: The GOLD domain carries a single alpha helix, which is why "the helix" and "the RIIalpha-binding
      interface" are the same object in this paper.
    supporting_text: The crystal structure of the GOLD domain consists of one α helix and 11 β strands
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached and read. Primary human experimental source for ACBD3's AKAP function.
      Its RIIalpha result does not actually conflict with the curated RIalpha IPI once the paper's own
      caveats are read - it allows RIalpha binding below its detection limit and explains the organelle
      difference by RI/RII enrichment at mitochondria and Golgi. The one real conflict is with UniProt's
      (By similarity) negative for RII-alpha, recorded as a UniProt correction to report.
- id: PMID:38134218
  title: Recruitment of PI4KIIIβ to the Golgi by ACBD3 is dependent on an upstream pathway of a SNARE
    complex and golgins.
  findings:
  - statement: Alanine scanning of the 21-residue unique region (UR) immediately upstream of the GOLD
      domain identifies MWT374-376 as the Golgi-targeting motif; MWT374-376>AAA relocalises ACBD3 to the
      cytosol. The paper calls this locus "the UR of the GOLD domain", so "MWT motif" and "GOLD domain
      region" are two resolutions of one site, not rival claims.
    supporting_text: We thus demonstrated that the residues MWT374-376 in the UR of the GOLD domain of
      ACBD3 participate in a protein–protein interaction that recruits ACBD3 to the Golgi apparatus.
  - statement: 'Giantin and golgin-45 recruit ACBD3 redundantly through that motif: single giantin knockout
      does not displace ACBD3, only the giantin/golgin-45 double knockout does, and the MWT374-376>AAA
      mutant co-immunoprecipitates neither golgin. This is what reconciles the older giantin model with
      the observation that giantin loss alone has no effect.'
    supporting_text: the MWT374-376>AAA mutation that prevents the localization of ACBD3 to the Golgi
      apparatus does not interact with either of the golgins.
  - statement: 'The redundancy is stated directly: loss of both golgins, not either alone, removes ACBD3
      from the Golgi.'
    supporting_text: KO of both golgin-45 and giantin drastically affects the localization of endogenous
      ACBD3 at the Golgi apparatus
  - statement: 'The paper places UniProt''s GOLD-domain/giantin attribution in context: it originates
      in a yeast two-hybrid interaction (Sohda 2001, PMID:11590181), and giantin knockdown does not abolish
      ACBD3 Golgi recruitment. So the UniProt DOMAIN line is not contradicted so much as refined - same
      locus, finer resolution, and a redundant second golgin.'
    supporting_text: Initially, based on a yeast two-hybrid interaction, the golgin giantin was proposed
      to recruit ACBD3
  - statement: 'SCFD1 (SLY1), a Sec1/Munc18 protein, is a previously unrecognised and essential upstream
      recruitment factor: its CRISPR knockout strips ACBD3 from the Golgi, and with it PI4KIIIbeta.'
    supporting_text: Loss of SCFD1, however, resulted in the almost complete loss of ACBD3 from the Golgi
      apparatus
  - statement: The GOLD domain plus its unique region binds the longin domain of the v-SNARE SEC22B; the
      SNARE and transmembrane domains do not bind. Basis of the proposed GO:0000149 annotation, and evidence
      that GOLD is not a viral-only surface.
    supporting_text: We thus conclude that the UR and GOLD domain of ACBD3 interacts with the longin domain
      of SEC22B
  - statement: 'The two mechanisms are sequential rather than parallel: ACBD3-giantin binding falls in
      SCFD1-knockout cells while ACBD3-SCFD1 binding is unaffected in the golgin double knockout, putting
      SCFD1 upstream.'
    supporting_text: This suggests that the recruitment of ACBD3 via SCFD1 is upstream of the interaction
      with the golgins, and ACBD3 is recruited to the Golgi in a two-step process.
  - statement: 'ACBD3 is required for PI4KIIIbeta to reach the Golgi, and the dependency is one-way: PI4KIIIbeta
      knockout does not move ACBD3. Basis of the proposed GO:0034067 annotation.'
    supporting_text: the abrogation of ACBD3 caused a loss of localization of PI4KIIIβ to the Golgi apparatus
  - statement: 'The picornaviral 3A peptide binds the SAME locus as the golgins, not a separate one: the
      paper places 3A recruitment at "the UR of the GOLD domain", its Figure 1D puts the 3A contact residues
      I380/K381 within the unique region a few residues from MWT374-376, and the study''s whole premise
      is that 3A must outcompete the endogenous Golgi anchor. Combined with PMID:37044218, whose RIIalpha-binding
      interface is the single alpha helix spanning roughly 379-383, residues 374-381 are a shared hub
      for the golgins, PKA RII and 3A - overlapping surfaces, not an identified common contact residue
      - so the hijack is best read as competition with ACBD3''s own anchors, while Q-domain PI4KB binding
      is untouched.'
    supporting_text: We reasoned that the 3A peptide must outcompete the endogenous Golgi-localized ACBD3
      recruitment factor.
  - statement: 'Figure 1D names both picornaviral 3A contact residues explicitly, and both lie inside
      the alpha helix that PMID:37044218 identifies as the RIIalpha-binding interface - so the PKA and
      viral sites overlap as surfaces. Whether they share a contact residue is untested: I380 is that
      paper''s proposed RII contact, but its own I380P substitution had almost no effect.'
    supporting_text: in red (I380/K381; AlphaFold2)
  - statement: 'A limit on the upstream step: SCFD1 knockout is clean (ACBD3 becomes cytosolic), but SEC22B
      knockout in the same screen fragments the Golgi, so SEC22B''s specific requirement for ACBD3 recruitment
      is confounded. The review therefore annotates ACBD3-SEC22B binding but attributes the requirement
      to SCFD1 only.'
    supporting_text: Loss of TMED10 and SEC22B caused a drastic loss of Golgi organization resulting in
      Golgi fragmentation.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Fetched and read in full (PMC7615549) in response to review, having previously been
      asserted only through the affinage narrative. It is the primary source for the MWT374-376/unique-region
      targeting motif, the giantin/golgin-45 redundancy, the SCFD1-SEC22B upstream step, the GOLD-SEC22B
      longin interaction and the two-step sequential model. It reconciles with UniProt''s DOMAIN line
      rather than contradicting it: the paper itself calls the motif''s location "the UR of the GOLD domain"
      and notes that UniProt''s giantin attribution rests on a yeast two-hybrid result (PMID:11590181)
      whose recruitment model giantin knockdown did not support.'
- id: Reactome:R-HSA-8874979
  title: ACBD3 binds GOLGB1
  findings: []
- id: file:human/ACBD3/ACBD3-deep-research-affinage.md
  title: Affinage mechanistic annotation for ACBD3 (human)
  findings:
  - statement: 'Machine-fetched Affinage record synthesising 30+ primary papers on ACBD3. It does not
      mention acyl-CoA anywhere - which earlier versions of this review wrongly treated as evidence that
      none had been reported. It is a coverage gap, not a finding: see the reference_review below.'
    supporting_text: ACBD3 (GCP60/PAP7) is a peripheral Golgi-membrane scaffolding protein that organizes
      lipid-modifying and signaling machinery on Golgi/TGN membranes and at ER–Golgi contact sites
  reference_review:
    relevance: MEDIUM
    correctness: MISCITED
    review_notes: 'Gates passed with pairwise = win, and its breadth is genuinely useful - it synthesises
      30+ primary papers, though what this review took to be its most valuable contribution - the absence
      of acyl-CoA - turned out to be its most damaging. But it states that PI4KB is recruited ''through
      its GOLD domain'', and that is wrong: UniProt is explicit that the Q domain (241-308) binds PI4KB
      and TBC1D22A/B while the GOLD domain (384-526) binds picornaviral 3A proteins. An earlier draft
      of this review propagated that error into seven places by quoting the provider verbatim as supporting_text
      instead of checking it against UniProt. Marked MISCITED for that specific claim; the quote has been
      removed from every supported_by block. The lesson is the campaign''s own rule applied to itself
      - a provider sentence is a lead, not evidence, even when the record is otherwise strong. Follow-up:
      the other domain claim in the same paragraph - the MWT374-376 motif binding giantin and golgin-45,
      and the two-step SCFD1/SEC22B-then-golgins mechanism - was checked against its cited primary paper
      (PMID:38134218) in a later round and is substantively correct. So the record''s error rate on domain
      assignments is real but not uniform; the defect on the MWT claim was this review citing the provider
      narrative rather than the primary paper, not the claim itself. MISCITED is retained for the GOLD/PI4KB
      sentence specifically. Second follow-up, and the more damaging one: this review repeatedly cited
      the record''s silence on acyl-CoA - "synthesises 30+ primary papers and never mentions acyl-CoA
      once" - as support for calling GO:0000062 an over-annotation. That was a misuse of the source and
      it reached the wrong answer. ACBD3 acyl-CoA binding is reported (PMID:26290611) and the ACB domain
      has a gene-specific SREBP1 function (PMID:23166793); the record simply does not cover them. The
      campaign''s own rule says an empty or silent record is not evidence that literature is absent, and
      I applied the rule to other people''s records while breaking it with this one. Its coverage claim
      should be treated as a lead, never as a negative result.'
core_functions:
- description: 'Membrane adaptor that recruits PI4KB to the Golgi. ACBD3 binds PI4KB directly through
    its Q domain (residues 241-308), anchoring the lipid kinase to Golgi membranes and stimulating its
    activity by raising the local concentration of its substrate, thereby maintaining Golgi PI4P homeostasis.
    The same activity is hijacked by picornaviruses, whose 3A proteins clamp ACBD3 onto replication-organelle
    membranes to build viral PI4P pools. The same Q domain binds TBC1D22A and TBC1D22B mutually exclusively
    with PI4KB, so the domain acts as a switch; picornaviral 3A proteins engage a different surface, the
    GOLD domain together with the unique region just upstream of it, which is why viral clamping leaves
    the kinase in place. That surface is neither viral-only nor a set of private sites: it also carries
    the SEC22B longin domain and PKA RII, and the 3A contact residues I380/K381 sit in the same unique
    region as the golgin-binding MWT374-376 motif, and both of those residues lie inside the single alpha
    helix (roughly 379-383) that the PKA study identifies as the RII-binding interface - so the PKA and
    viral sites overlap as surfaces, though whether they share a contact residue is untested. So the hijack
    most likely works by outcompeting giantin, golgin-45 and PKA for one shared surface rather than by
    occupying an unused one - which is the paper''s own stated premise, that 3A must outcompete the endogenous
    Golgi anchor. ACBD3 is required for PI4KB to reach the Golgi at all: ACBD3 knockout loses Golgi PI4KB,
    while PI4KB knockout leaves ACBD3 in place.'
