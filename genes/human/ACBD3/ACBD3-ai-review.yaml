suggested_questions:
- question: Does ACBD3 bind acyl-CoA at all? It carries a PROSITE-recognised ACB domain at residues 83-174
    and is named for it, but no ligand, affinity or acyl-CoA-dependent activity has ever been reported,
    and a synthesis citing more than thirty primary papers on this gene never mentions acyl-CoA. Direct
    binding measurements against an acyl-CoA panel would either substantiate GO:0000062 or establish that
    the domain is vestigial for this member of the family.
- question: Why do six protein-binding rows record PI4KB, TBC1D22A/B and viral 3A proteins as bare GO:0005515
    when the gene already carries an informative protein-membrane adaptor term and an informative PKA-regulatory-subunit-binding
    term? The uninformative rows are the ones from the focused mechanistic papers, which is the opposite
    of what one would expect.
- question: What does ACBD3 do with TBC1D22A and TBC1D22B? These Rab GAPs are recovered by interactome
    screens and appear in the picornavirus work as part of the ACBD3-organised complex, but no study has
    characterised the functional consequence of the interaction.
- question: Is the mitochondrial pool a distinct targeting event or spillover from the Golgi pool? ACBD3
    positions PKA at both compartments, but both of its characterised targeting mechanisms - the SCFD1-dependent
    step and the MWT374-376 motif binding giantin and golgin-45 - are Golgi-specific, and UniProt's mitochondrial
    statement is (By similarity) via PBR with no human experimental localisation. PMID:37044218 suggests
    the answer may be trivial - RI and RII are themselves enriched at mitochondria and Golgi respectively
    - but no study has tested how ACBD3 itself reaches mitochondria.
- question: 'Should UniProt''s (By similarity) negative for RII-alpha be revised, and is the R-subunit
    preference simply compartmental? The curated GO:0034237 IPI is against PRKAR1A (RIalpha, UniProtKB:P10644)
    and UniProt states RI-alpha binding with no RII-alpha binding - but only (By similarity). PMID:37044218
    detects RIIalpha and not RIalpha in a human pull-down, yet its authors explicitly do not exclude RI:
    they note a dual-specific AKAP binds RI 10-100 fold more weakly and that RI and RII are enriched at
    mitochondria and the Golgi respectively, so the two records may simply describe one protein at two
    compartments. What does not survive that reconciliation is a by-similarity negative for RII-alpha
    standing against a human experimental positive, which looks like a UniProt correction to report.'
- question: Is ACBD3 a genuine subunit of the STX5-SEC22B SNARE complex or a client recruited alongside
    it? PMID:38134218 shows ACBD3 binds the SEC22B longin domain through its unique region and GOLD domain
    and that SCFD1 loss strips ACBD3 from the Golgi, and concludes ACBD3 is part of that SNARE complex
    - but the MWT374-376>AAA mutant and the UR-less truncation bind SCFD1 and SEC22B more strongly than
    wild type while sitting in the cytosol, so binding and Golgi residence are separable. Whether ACBD3
    influences SNARE-mediated fusion, or is only chaperoned to the cis-Golgi by it, is untested.
suggested_experiments:
- hypothesis: The ACB domain of ACBD3 no longer binds acyl-CoA.
  description: Measure binding of purified ACBD3 and of its isolated ACB domain (residues 83-174) against
    a panel of short-, medium- and long-chain acyl-CoAs by isothermal titration calorimetry, alongside
    a canonical acyl-CoA binding protein as positive control. A negative result would justify removing
    GO:0000062 outright rather than only flagging it.
  experiment_type: biophysics
- hypothesis: ACBD3 stimulates PI4KB purely by membrane recruitment rather than by allosteric activation.
  description: Compare PI4KB activity when recruited to membranes by ACBD3 against PI4KB artificially
    tethered to the same membranes at matched surface density, to separate the local-concentration effect
    from any conformational activation.
  experiment_type: in vitro reconstitution
- hypothesis: The SCFD1-SEC22B step and the golgin step deliver ACBD3 to different Golgi subcompartments
    rather than acting strictly in series.
  description: Image ACBD3 against cis- and trans-Golgi markers at Airyscan resolution in SCFD1-knockout
    cells and in giantin/golgin-45 double-knockout cells, and ask whether the MWT374-376>AAA mutant retains
    any SCFD1-dependent residual pool. The reported model is sequential, with SCFD1 upstream, but the
    mutant and the UR-less truncation bind SCFD1 and SEC22B more strongly than wild type, so the two mechanisms
    may instead serve different subcompartments - which the sequential model would need to accommodate.
  experiment_type: cell biology
- hypothesis: Picornaviral 3A hijacks ACBD3 by outcompeting its endogenous anchors - the golgins at MWT374-376
    and PKA RII at the 379-383 helix - all of which engage the unique region/GOLD surface, while PI4KB
    on the Q domain is untouched.
  description: 'The premise is the 2024 paper''s own: the 3A peptide must outcompete the endogenous Golgi-localised
    ACBD3 recruitment factor, and its Figure 1D places the 3A contact residues (I380/K381) in the same
    unique region as MWT374-376. Independently, PMID:37044218 places the RIIalpha-binding interface in
    the single alpha helix of the GOLD domain, roughly 379-383: K381P abolishes binding but is a helix-breaking
    proline, Q379P and I380P have almost no effect, and Ile380 is proposed as the contact only from inspecting
    the apo structure. So the PKA and viral sites overlap as surfaces across residues 374-381, and whether
    they share a contact residue is precisely what is untested. Compete purified 3A against giantin and
    golgin-45 fragments, and against PKA RIIalpha, using non-proline substitutions across the 379-383
    helix as separation-of-function probes - charge-reversal or bulk changes at I380 rather than I380P,
    which reported almost no effect and so cannot distinguish a non-contact from a tolerated substitution
    - for the ACBD3 328-528 fragment by quantitative pull-down or SPR, with PI4KB binding to the Q domain
    measured in parallel as the internal negative control. In infected cells, test whether the giantin-bound
    and RII-bound pools of Golgi ACBD3 fall while Golgi PI4KB is retained, and whether KDEL-receptor retrograde
    transport becomes constitutive as it does on ACBD3 depletion. A positive result would make the hijack
    a displacement of ACBD3''s own anchors rather than occupancy of a spare site, and would predict a
    specific collateral consequence for host PKA signalling.'
  experiment_type: biochemistry
