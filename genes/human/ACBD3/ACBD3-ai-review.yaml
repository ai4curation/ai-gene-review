- term:
    id: GO:0034237
    label: protein kinase A regulatory subunit binding
  evidence_type: IPI
  original_reference_id: PMID:17911601
  qualifier: enables
  review:
    summary: 'Protein kinase A regulatory subunit binding - an informative binding term, and the model
      for how the six bare protein-binding rows on this gene should look. The term is right and the anchoring
      function is well supported; the apparent argument over which R subunit is bound is largely reconciled
      inside the primary literature itself.


      The GOA row is an IPI whose WITH/FROM is UniProtKB:P10644 = PRKAR1A, so the curated interaction
      is with the type I-alpha regulatory subunit (RIalpha). UniProt''s SUBUNIT line agrees and adds a
      negative: it states ACBD3 interacts with PBR and RI-alpha and does NOT interact with RI-beta nor
      RII-alpha - but that whole statement carries (By similarity), i.e. ECO:0000250, not experimental
      evidence for human ACBD3.


      PMID:37044218, a human experimental study, detects RIIalpha and not RIalpha in a GST-ACBD3 pull-down
      and maps the interaction to the GOLD domain. Its authors do not read that as excluding RI: they
      note that a typical dual-specific AKAP binds RI 10-100 fold more weakly than RII and that ACBD3
      may bind RIalpha below their detection limit, and they attribute the organelle asymmetry to RI and
      RII being enriched at mitochondria and the Golgi respectively. On that reading the Golgi pool is
      RII-anchored and the mitochondrial pool RI-anchored, which is compatible with both records rather
      than in conflict with either. The same paper also sharpens the domain picture: the GOLD domain has
      host partners, RII here and the SEC22B longin domain in PMID:38134218, so it is not a viral-only
      surface.


      ACCEPT: GO:0034237 is agnostic about isoform, so it holds under any of these readings, and the curated
      IPI is an experimental annotation whose full text has not been read here. The one claim that does
      not survive the reconciliation is UniProt''s (By similarity) negative for RII-alpha, which a human
      pull-down contradicts directly; that is flagged in suggested_questions as a UniProt correction to
      report.'
    action: ACCEPT
    supported_by:
    - reference_id: file:human/ACBD3/ACBD3-uniprot.txt
      supporting_text: PBR and PKA regulatory subunit RI-alpha
    - reference_id: PMID:37044218
      supporting_text: His-RIIα, but not His-RIα, was readily detected in the pulldown fraction
    - reference_id: PMID:37044218
      supporting_text: "the GOLD domain of ACBD3 directly interacts with the regulatory subunit II \n\
        (RII) of PKA and effectively recruits PKA holoenzyme to the Golgi"
    - reference_id: PMID:37044218
      supporting_text: it is possible that ACBD3 binds RIα in such low affinity that this binding is below
        the detection limit in our assay.
    - reference_id: PMID:37044218
      supporting_text: The discrepancy between ACBD3’s preference for the R subunit at different organelles
        may be explained by the fact that RI and RII are highly enriched at the mitochondria and the Golgi
        apparatus, respectively
    reason: The term is correct under any reading of the subunit preference, and the curated IPI against
      UniProtKB:P10644 (PRKAR1A) is an experimental annotation whose full text I have not read, so it
      is not second-guessed. PMID:37044218 reconciles its own RII result with RI binding (affinity below
      detection; RI and RII enriched at mitochondria and Golgi respectively), so the record is reported
      as compartment-specific rather than contested. Only UniProt's by-similarity RII-alpha negative is
      flagged.
