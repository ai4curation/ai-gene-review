      to membranes through its GOLD domain
  - statement: ACBD3 acts as an A-kinase anchoring protein, binding PKA regulatory subunits via the GOLD
      domain to position PKA at the Golgi and mitochondria.
    supporting_text: ACBD3 acts as an A-kinase anchoring protein, binding PKA regulatory subunits (RIα
      and RII via the GOLD domain) to position PKA at the Golgi and at mitochondria
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'External precomputed LLM research, gates passed with self-evaluation pairwise = win;
      claims used were checked against UniProt''s curated ECO:0000269 FUNCTION and SUBUNIT blocks. Unusually
      dense - it synthesises more than thirty primary papers across Golgi structure, PI4KB recruitment,
      steroidogenesis, sphingolipid transport, STING trafficking and picornavirus biology. Its most useful
      contribution here was negative: across all of that literature it never once mentions acyl-CoA, which
      is the strongest available evidence that the GO:0000062 IEA is a domain-name inference rather than
      a characterised activity.'
core_functions:
- description: Membrane adaptor that recruits PI4KB to the Golgi. ACBD3 binds PI4KB directly through its
    GOLD domain, anchoring the lipid kinase to Golgi membranes and stimulating its activity by raising
    the local concentration of its substrate, thereby maintaining Golgi PI4P homeostasis. The same activity
    is hijacked by picornaviruses, whose 3A proteins clamp ACBD3 onto replication-organelle membranes
    to build viral PI4P pools.
