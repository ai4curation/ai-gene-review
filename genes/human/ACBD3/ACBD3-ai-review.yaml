- term:
    id: GO:2000639
    label: negative regulation of SREBP signaling pathway
  evidence_type: IMP
  original_reference_id: PMID:23166793
  qualifier: involved_in
  review:
    action: NEW
    summary: 'Proposed new annotation, and the answer to a fair question: this review now asserts an ACB-domain
      SREBP1 function in the biologist-facing description, so it should either annotate it or say why
      not.


      The evidence is a coherent set from one paper. ACBD3 co-immunoprecipitates the full-length SREBP1
      precursor but not the mature nuclear form; it blocks SREBP1 maturation by binding the regulator
      directly rather than by disrupting the SREBP1-SCAP-Insig1 complex; it attenuates the SREBP1 response
      to lipid deprivation; the ACB-domain-containing N-terminal region plays an important part in the
      effect, though deleting it attenuates rather than abolishes suppression (76% to 40%); and FASN transcript
      and protein fall, with de novo palmitate synthesis reduced at 72 h.


      The perturbation is bidirectional, which is the strongest form IMP takes. Overexpression suppresses
      SREBP1 maturation; shRNA knockdown of endogenous ACBD3 raises nuclear SREBP1 in two cell lines,
      HEK293T and HepG2, and the authors conclude ACBD3 "intrinsically plays a negative role in SREBP1
      protein maturation". A specificity control comes with it - knocking down ACBD3 does not change the
      SREBP-binding partners SCAP or Insig1.


      IMP rather than IDA or IPI because both directions are perturbations rather than direct assays of
      the process. Still one paper, so proposed rather than asserted - but not thin: two directions, two
      cell lines, a lipid-deprivation challenge, a specificity control and a domain-deletion series.


      Not proposed as a core function, for the same reason as GO:0000149. core_functions records this
      protein''s two scaffolding outputs - PI4KB recruitment at the Golgi and PKA anchoring - and SREBP1
      restraint is neither: it is a separate, lipogenesis-facing arm running through the ACB region, on
      single-paper evidence. An informative annotation need not be a core function, and saying so is cheaper
      than leaving a reader to infer it.'
    reason: 'Fills a gap the narrative already opens: the review states an ACB-domain SREBP1-regulatory
      function, and no annotation on this gene records any role in lipogenic transcriptional control.
      GO:2000639 is the specific term for the direction shown - ACBD3 blocks SREBP1 maturation and attenuates
      the lipid-deprivation response. IMP because the evidence is perturbation rather than direct assay
      - and it is bidirectional: overexpression suppresses SREBP1 maturation, knockdown of endogenous
      ACBD3 enhances it in two cell lines, with a specificity control. Single-paper, and flagged as such.'
    supported_by:
    - reference_id: PMID:23166793
      supporting_text: ACBD3 blocked intracellular maturation of SREBP1 probably through directly binding
        with the lipid regulator rather than disrupted SREBP1-SCAP-Insig1 interaction
    - reference_id: PMID:23166793
      supporting_text: When ACBD3-overexpressing cells were exposed to the lipid-deprivation condition,
        a prominent attenuation of the depletion-initiated SREBP1 feedback was observed
    - reference_id: PMID:23166793
      supporting_text: Taken together, these results suggest that ACB domain-containing N-terminal sequence
        of ACBD3 plays an important role in its regulatory effects on SREBP1.
    - reference_id: PMID:23166793
      supporting_text: More strikingly, after knocking down endogenous ACBD3, nuclear SREBP1 expression
        was enhanced in both HEK293T and Hep G2 cells
    - reference_id: PMID:23166793
      supporting_text: All these results strongly suggest that ACBD3 intrinsically plays a negative role
        in SREBP1 protein maturation.
    - reference_id: PMID:23166793
      supporting_text: knockdown of endogenous ACBD3 had no effect on the expression of these two SREBP-binding
        proteins, either (Figure S2)
