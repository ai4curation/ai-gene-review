suggested_questions:
- question: Does ACBD3 bind acyl-CoA at all? It carries a PROSITE-recognised ACB domain at residues 83-174
    and is named for it, but no ligand, affinity or acyl-CoA-dependent activity has ever been reported,
    and a synthesis citing more than thirty primary papers on this gene never mentions acyl-CoA. Direct
    binding measurements against an acyl-CoA panel would either substantiate GO:0000062 or establish that
    the domain is vestigial for this member of the family.
- question: Why do six protein-binding rows record PI4KB, TBC1D22A/B and viral 3A proteins as bare GO:0005515
    when the gene already carries an informative protein-membrane adaptor term and an informative PKA-regulatory-subunit-binding
    term? The uninformative rows are the ones from the focused mechanistic papers, which is the opposite
    of what one would expect.
- question: What does ACBD3 do with TBC1D22A and TBC1D22B? These Rab GAPs are recovered by interactome
    screens and appear in the picornavirus work as part of the ACBD3-organised complex, but no study has
    characterised the functional consequence of the interaction.
- question: Is the mitochondrial pool a distinct targeting event or spillover from the Golgi pool? ACBD3
    positions PKA at both compartments, but its characterised targeting mechanism - the MWT motif binding
    giantin and golgin-45 - is Golgi-specific, so how it reaches mitochondria is unexplained.
suggested_experiments:
- hypothesis: The ACB domain of ACBD3 no longer binds acyl-CoA.
  description: Measure binding of purified ACBD3 and of its isolated ACB domain (residues 83-174) against
    a panel of short-, medium- and long-chain acyl-CoAs by isothermal titration calorimetry, alongside
    a canonical acyl-CoA binding protein as positive control. A negative result would justify removing
    GO:0000062 outright rather than only flagging it.
  experiment_type: biophysics
- hypothesis: ACBD3 stimulates PI4KB purely by membrane recruitment rather than by allosteric activation.
  description: Compare PI4KB activity when recruited to membranes by ACBD3 against PI4KB artificially
    tethered to the same membranes at matched surface density, to separate the local-concentration effect
    from any conformational activation.
  experiment_type: in vitro reconstitution
- hypothesis: Picornaviral 3A proteins and PI4KB engage overlapping surfaces on the ACBD3 GOLD domain.
  description: Map the 3A and PI4KB binding sites on the GOLD domain by NMR and mutagenesis, then test
    whether GOLD-domain variants can be found that support host PI4KB recruitment while resisting 3A clamping
    - which would be the basis for a host-directed antiviral that spares the physiological function.
  experiment_type: structural biology
