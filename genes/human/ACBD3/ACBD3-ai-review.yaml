- description: 'A-kinase anchoring at the Golgi. ACBD3 binds a PKA regulatory subunit and positions the
    kinase at Golgi membranes, where PKA activity is held in check until anterograde cargo arrives from
    the ER; release of the catalytic subunit then controls KDEL-receptor retrograde recycling, which makes
    retrograde traffic responsive to forward flux. The subunit preference looks compartment-specific rather
    than contradictory: the curated IPI is against PRKAR1A (RIalpha, UniProtKB:P10644) and UniProt states
    RI-alpha binding with no RII-alpha binding, but only (By similarity), while a human experimental study
    finds GOLD-domain binding to RIIalpha at the Golgi, explicitly allows RIalpha binding below its detection
    limit, and attributes the asymmetry to RI and RII being enriched at mitochondria and the Golgi respectively.
    The anchoring function itself is well supported either way, and it is separable from ACBD3''s PI4KB-recruiting
    activity, which uses the Q domain rather than GOLD.


    Only the Golgi membrane is listed as a location for this function, even though ACBD3 also positions
    PKA at mitochondria to couple cholesterol transport to hormone-stimulated steroidogenesis. The mitochondrial
    pool rests entirely on UniProt''s by-similarity statement that ACBD3 is "also mitochondrial (via its
    interaction with PBR)" (ECO:0000250), with no human experimental localisation, and the human experimental
    work places the anchoring event at the Golgi with RII. GO:0005739 is therefore kept non-core and deliberately
    excluded here, keeping the core-function locations consistent with the annotation-level calls.'
