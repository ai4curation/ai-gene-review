- term:
    id: GO:2000156
    label: regulation of retrograde vesicle-mediated transport, Golgi to ER
  evidence_type: IMP
  original_reference_id: PMID:37044218
  review:
    action: NEW
    summary: 'Proposed new annotation. ACBD3 has no retrograde-transport annotation at all, yet regulating
      retrograde traffic is what PMID:37044218 actually establishes - the GOA record captures only the
      anterograde term the same paper supports less directly.


      The evidence is a loss-of-function phenotype on the process itself: depleting ACBD3 reduces the
      Golgi pool of PKA RII and renders PKA activation and KDEL-receptor retrograde transport constitutive
      rather than cargo-triggered. The term''s definition - any process that modulates the frequency,
      rate or extent of retrograde vesicle-mediated transport, Golgi to ER - fits that directly, and GO:2000156
      has no children, so it is the most specific available term. The regulation parent is the right choice
      over GO:0006890 itself: ACBD3 is not a transport machinery component, it sets whether the pathway
      runs constitutively.'
    reason: 'Fills a real gap rather than restating an existing row: the paper''s own conclusion is about
      retrograde transport control, and no annotation on this gene records it. IMP because the evidence
      is the ACBD3-depletion phenotype.'
    supported_by:
    - reference_id: PMID:37044218
      supporting_text: "depletion of ACBD3 \nreduces the Golgi fraction of RII, resulting in moderate,\
        \ but constitutive \nactivation of PKA and KDELR retrograde transport, independent of cargo influx\
        \ \nfrom the ER"
    - reference_id: PMID:37044218
      supporting_text: "these data demonstrate that ACBD3 coordinates the \nprotein secretory pathway\
        \ at the Golgi by facilitating KDELR/PKA-containing \nprotein complex formation"
