taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'ACBD3 (GCP60, PAP7) is a peripheral membrane scaffolding protein of the Golgi and trans-Golgi
  network. It is recruited to Golgi membranes through a short MWT motif that binds the golgins giantin
  and golgin-45, and it organises lipid-modifying and signalling machinery there and at ER-Golgi contact
  sites. Its central activity is recruitment of the lipid kinase PI4KB through its Q domain (residues
  241-308): the interaction anchors PI4KB to the membrane and stimulates the enzyme by raising the local
  concentration of its substrate, maintaining Golgi PI4P homeostasis. The same Q domain also binds the
  Rab GTPase-activating proteins TBC1D22A and TBC1D22B, and those interactions are mutually exclusive
  with PI4KB binding, making the domain a switch between lipid-kinase recruitment and Rab-directed traffic.
  A separate surface, the GOLD domain, is the one picornaviral 3A proteins engage. ACBD3 also acts as
  an A-kinase anchoring protein, binding PKA regulatory subunits to position the kinase at the Golgi and
  at mitochondria, where it couples cholesterol transport to hormone-stimulated steroidogenesis and controls
  cargo-triggered PKA activation governing KDEL-receptor retrograde traffic. ACBD3 is required for Golgi
  stack integrity - its loss gives enlarged, unstacked Golgi - and for FAPP2-mediated glucosylceramide
  transport and ER-to-Golgi sphingolipid flux. The same membrane-coupling activity is extensively exploited
  by pathogens: picornavirus 3A proteins clamp ACBD3 onto replication-organelle membranes to recruit and
  activate PI4KB for viral phosphoinositide synthesis. Despite its name and an intact acyl-CoA binding
  domain, no acyl-CoA ligand or acyl-CoA-dependent activity has been reported for the protein.'
