      signalling machinery at Golgi/TGN membranes and ER-Golgi contact sites.
    supporting_text: ACBD3 (GCP60/PAP7) is a peripheral Golgi-membrane scaffolding protein that organizes
      lipid-modifying and signaling machinery on Golgi/TGN membranes and at ER–Golgi contact sites
  - statement: Its central output is GOLD-domain-mediated recruitment of PI4KB to membranes, which both
      anchors and stimulates the kinase.
