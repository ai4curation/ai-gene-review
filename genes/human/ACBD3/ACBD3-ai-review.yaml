  id: NCBITaxon:9606
  label: Homo sapiens
description: 'ACBD3 (GCP60, PAP7) is a peripheral membrane scaffolding protein of the Golgi and trans-Golgi
  network. It reaches Golgi membranes by a two-step route: an SCFD1-dependent step is required upstream,
  with ACBD3 binding the SNARE SEC22B at that step, and the golgins giantin and golgin-45 then bind redundantly
  to an MWT374-376 motif in the unique region immediately upstream of the GOLD domain. From there it organises
  lipid-modifying and signalling machinery on those membranes and at ER-Golgi contact sites. Its central
  activity is recruitment of the lipid kinase PI4KB through its Q domain (residues 241-308): the interaction
  anchors PI4KB to the membrane and stimulates the enzyme by raising the local concentration of its substrate,
  maintaining Golgi PI4P homeostasis. The same Q domain also binds the Rab GTPase-activating proteins
  TBC1D22A and TBC1D22B, and those interactions are mutually exclusive with PI4KB binding, making the
  domain a switch between lipid-kinase recruitment and Rab-directed traffic. The GOLD domain together
  with that same unique region forms the second interaction surface, and it is a shared one rather than
  a set of private sites: the SEC22B longin domain and the PKA type II regulatory subunit bind there,
  and so do picornaviral 3A proteins, whose contact residues lie in the unique region only a few residues
  from the golgin-binding motif. Because that surface is distinct from the Q domain, viral engagement
  leaves PI4KB in place; because it overlaps the golgin and PKA sites, the likely mechanism of hijack
  is competition with ACBD3''s own Golgi anchors. ACBD3 acts as an A-kinase anchoring protein, binding
  PKA regulatory subunits to position the kinase at Golgi membranes, where it controls cargo-triggered
  PKA activation governing KDEL-receptor retrograde traffic. A second, mitochondrial pool has been proposed
  to act through the peripheral benzodiazepine receptor and to couple cholesterol transport to hormone-stimulated
  steroidogenesis, but it is inferred by similarity rather than localised directly in human cells. ACBD3
  is required for Golgi stack integrity - its loss gives enlarged, unstacked Golgi - and for FAPP2-mediated
  glucosylceramide transport and ER-to-Golgi sphingolipid flux. The same membrane-coupling activity is
  extensively exploited by pathogens: picornavirus 3A proteins clamp ACBD3 onto replication-organelle
  membranes to recruit and activate PI4KB for viral phosphoinositide synthesis. Despite its name and an
  intact acyl-CoA binding domain, no acyl-CoA ligand or acyl-CoA-dependent activity has been reported
  for the protein.'
