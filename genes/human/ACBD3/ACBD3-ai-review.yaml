  review:
    summary: 'Interaction with PI4KB (UniProtKB:Q9UBF8) and with the Aichi virus 3A protein and its processed
      chains (UniProtKB:O91464, four of this row''s five WITH/FROM accessions) - the paper recruits both
      to the same replication-site question. PI4KB is the central host partner of this protein and the
      one its molecular function is built on. ACBD3 binds PI4KB through its Q domain (residues 241-308),
      anchoring the kinase to Golgi membranes and stimulating its activity by raising the local substrate
      concentration, thereby maintaining Golgi PI4P homeostasis; the complex was defined structurally
      by NMR of ACBD3 residues 241-308. Bare protein binding conveys none of this.


      Note the domain assignment specifically, since it is easy to get wrong: ACBD3 is named for its acyl-CoA-binding
      domain, and the GOLD domain is the one usually discussed, but neither carries the PI4KB interaction.
      UniProt is explicit that the Q domain binds PI4KB and TBC1D22A/B, while the GOLD domain (384-526)
      binds picornaviral 3A proteins. The viral 3A interaction covered by this same row therefore uses
      a different surface from the host kinase interaction - which is why 3A can clamp ACBD3 onto replication
      organelles without displacing PI4KB.'
    action: MODIFY
    reason: Uninformative term for the structurally defined interaction that constitutes this protein's
      molecular function.
