  - reference_id: file:human/ACBD3/ACBD3-uniprot.txt
    supporting_text: CC       similarity). Interacts (via Q domain) with PI4KB (via N-terminus)
- description: 'A-kinase anchoring at the Golgi. ACBD3 binds a PKA regulatory subunit and positions the
    kinase at Golgi membranes, where PKA activity is held in check until anterograde cargo arrives from
    the ER; release of the catalytic subunit then controls KDEL-receptor retrograde recycling. The isoform
    is contested: the curated IPI is against PRKAR1A (RIalpha, UniProtKB:P10644) and UniProt states RI-alpha
    binding with no RII-alpha binding, but only (By similarity), while the 2023 human experimental study
    reports GOLD-domain binding to RII and explicitly not RI. Either way the anchoring function itself
    is well supported, and it is separable from ACBD3''s PI4KB-recruiting activity, which uses the Q domain
    rather than GOLD. ACBD3 also positions PKA at mitochondria, coupling cholesterol transport to hormone-stimulated
    steroidogenesis.'
