- term:
    id: GO:0000062
    label: fatty-acyl-CoA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: 'Fatty-acyl-CoA binding, assigned by InterPro from the ACB (acyl-CoA binding) domain at residues
      83-174.


      Corrected call. Earlier versions of this review marked this over-annotated, on the grounds that
      no acyl-CoA ligand had ever been reported for ACBD3. That was wrong, and the correcting source was
      already cited here: PMID:38134218''s introduction states that the ACBD domain oligomerizes upon
      binding C18:1-CoA or C16:0-CoA, citing Soupene and Kuypers 2015 (PMID:26290611), whose abstract
      records that ligand binding dimerises ACBD1 and ACBD3 while it does not dimerise ACBD6. So purified
      ACBD3 binds long-chain fatty acyl-CoAs, with ligand-induced oligomerisation as the readout - which
      is what the term asserts.


      The ACB region is also not functionless for this gene. PMID:23166793 shows ACBD3 blocks SREBP1 maturation
      by binding the regulator directly, with reduced FASN and reduced de novo palmitate synthesis following,
      and attributes an important part of that effect to the ACB-domain-containing N-terminal region.
      Only a part: deleting the N-terminus attenuates suppression of the FASN promoter (76% to 40%) without
      abolishing it, and the SREBP1 co-immunoprecipitation itself used full-length ACBD3, so the interaction
      is not domain-mapped. The ACB region therefore contributes to a gene-specific function that is distinct
      from acyl-CoA binding itself, without being where that function resides.


      KEEP_AS_NON_CORE rather than ACCEPT, and the reason is now the authors'' own rather than my inference.
      PMID:38134218''s discussion states that binding of ACBD3 to C18:1-CoA, C16:0-CoA or related acyl
      chains and the subsequent oligomerisation does not affect its recruitment to the Golgi, because
      deleting the ACBD domain does not prevent Golgi localisation - and lists effector recruitment among
      the possibilities that remain untested. Consistently, PMID:30755512 shows the ACB and CAR domains
      are dispensable for 3A-mediated PI4KB recruitment (assayed in the enteroviral setting, but scoring
      the Q-domain ACBD3-PI4KB interaction that the same paper shows is the step that matters), with Q
      and GOLD together sufficient. Note the framing: that assay is the viral one and host PI4KB recruitment
      without 3A was never tested, so it is corroboration rather than a second independent leg.


      Note this is a statement about the ligand, not about the domain. The ACB domain is not functionless:
      besides SREBP1 it is credited with recruiting FAPP2 (PMID:38134218 attributing PMID:29750412), so
      it is a third interaction surface alongside the Q domain and the UR/GOLD surface. What is absent
      is any demonstrated consequence of the acyl-CoA ligand itself. A real molecular function of this
      protein, but not its core one.'
    action: KEEP_AS_NON_CORE
    reason: 'Corrected from MARK_AS_OVER_ANNOTATED. Direct fatty-acyl-CoA binding by ACBD3 is reported
      - ligand-induced dimerisation with C18:1-CoA and C16:0-CoA (PMID:26290611, restated in PMID:38134218)
      - so the InterPro domain inference is corroborated, not speculative, and the ACB region additionally
      contributes to a gene-specific SREBP1-regulatory function - only in part, since the N-terminal deletion
      attenuates without abolishing it and the SREBP1 interaction was assayed only with full-length protein
      (PMID:23166793). Kept non-core on the authors'' own evidence: PMID:38134218 states that acyl-CoA
      binding and the resulting oligomerisation do not affect ACBD3''s Golgi recruitment, since deleting
      the ACBD domain does not prevent Golgi localisation, and PMID:30755512 shows the domain is dispensable
      for 3A-mediated PI4KB recruitment (assayed in the enteroviral setting, but scoring the Q-domain
      ACBD3-PI4KB interaction that the same paper shows is the step that matters). That bears on the ligand,
      not on the domain, which also recruits FAPP2.'
    supported_by:
    - reference_id: file:human/ACBD3/ACBD3-uniprot.txt
      supporting_text: FT   DOMAIN          83..174
    - reference_id: PMID:38134218
      supporting_text: The ACBD domain oligomerizes upon binding to C18:1-CoA or C16:0-CoA (Soupene and
        Kuypers, 2015) and recruits the membrane-shaping protein FAPP2
    - reference_id: PMID:38134218
      supporting_text: ACBD3 has been demonstrated to oligomerize in the presence of C18:1-CoA or C16:0-CoA
    - reference_id: PMID:38134218
      supporting_text: Our data suggest that the binding of ACBD3 to C18:1-CoA, C16:0-CoA or related fatty
        acyl chains and the subsequent oligomerization does not affect its recruitment to the Golgi as
        deletion of the ACBD domain does not prevent Golgi localization.
    - reference_id: PMID:38134218
      supporting_text: It is possible that this oligomerization regulates the conformational change of
        ACBD3, its effector recruitment, or represents an additional functional role of ACBD3, which could
        be explored in future studies.
    - reference_id: PMID:26290611
      supporting_text: In contrast to ACBD1 and ACBD3, ligand binding did not result in the dimerization
        of ACBD6.
    - reference_id: PMID:23166793
      supporting_text: Taken together, these results suggest that ACB domain-containing N-terminal sequence
        of ACBD3 plays an important role in its regulatory effects on SREBP1.
    - reference_id: PMID:30755512
      supporting_text: we show that acyl-coenzyme A binding (ACB) and charged-amino-acid region (CAR)
        domains are dispensable for 3A-mediated PI4KB recruitment and efficient enterovirus replication
    - reference_id: PMID:30755512
      supporting_text: we dissected the different domains of ACBD3 and uncovered that the glutamine-rich
        region (Q) and Golgi dynamics domain (GOLD) together suffice to support enterovirus replication
