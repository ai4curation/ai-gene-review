  review:
    summary: 'Interaction with TBC1D22A/TBC1D22B (UniProtKB:Q8WUA7, Q9NU19), Rab GTPase-activating proteins.
      These are easy to mistake for uncharacterised screen hits, but UniProt shows the interaction is
      mechanistically pointed. TBC1D22A/B bind the SAME Q domain as PI4KB, and UniProt states the two
      interactions are mutually exclusive. So ACBD3''s Q domain is a switch: it can hold either the lipid
      kinase or the Rab GAPs, not both.


      That makes these rows worth elevating rather than flagging. They record engagement of the same adaptor
      surface that defines the protein''s molecular function, and the competition is presumably how the
      Golgi decides between PI4P synthesis and Rab-directed traffic. Bare protein binding records none
      of it.'
    action: MODIFY
    reason: Uninformative term for an interaction at the same Q-domain surface that mediates PI4KB recruitment,
      and mutually exclusive with it - a documented competitive switch rather than an unexplained hit.
