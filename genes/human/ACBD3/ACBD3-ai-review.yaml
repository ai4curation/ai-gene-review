- term:
    id: GO:0034237
    label: protein kinase A regulatory subunit binding
  evidence_type: IPI
  original_reference_id: PMID:17911601
  qualifier: enables
  review:
    summary: 'Protein kinase A regulatory subunit binding - an informative binding term, and the model
      for how the six bare protein-binding rows on this gene should look. The term is right, but which
      R subunit ACBD3 binds is genuinely contested, and the two sources disagree.


      The GOA row is an IPI whose WITH/FROM is UniProtKB:P10644 = PRKAR1A, so the curated interaction
      is with the type I-alpha regulatory subunit (RIalpha). UniProt''s SUBUNIT line agrees and adds a
      negative: it states ACBD3 interacts with PBR and RI-alpha and does NOT interact with RI-beta nor
      RII-alpha - but that whole statement carries (By similarity), i.e. ECO:0000250, not experimental
      evidence for human ACBD3.


      PMID:37044218, a 2023 human experimental study, reports the opposite specificity, and does so as
      its central finding: the GOLD domain binds RII and recruits the PKA holoenzyme to the Golgi, and
      the authors state explicitly that ACBD3 interacts with RII but NOT RI. Note this also sharpens the
      domain picture: the GOLD domain, whose only other established partners are viral 3A proteins, turns
      out to have a host partner after all.


      ACCEPT stands because GO:0034237 is agnostic about isoform: both readings are protein kinase A regulatory
      subunit binding. What should not stand is UniProt''s by-similarity negation of RII-alpha, which
      a human experimental paper now contradicts; that is flagged in suggested_questions as a UniProt
      correction to report.'
