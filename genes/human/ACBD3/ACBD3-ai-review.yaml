  review:
    summary: 'This row collapses nine IntAct/UniProt IPI rows from a single paper, and the WITH/FROM accessions
      are what make it interpretable: PI4KB (Q9UBF8, plus the unreviewed isoform A0A0B4J1S8), TBC1D22A
