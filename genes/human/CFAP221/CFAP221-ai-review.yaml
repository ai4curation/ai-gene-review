id: Q4G0U5
gene_symbol: CFAP221
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'CFAP221, also called PCDP1, is a conserved ciliary and flagellar protein associated
  with the axonemal central apparatus. Ortholog biochemical studies establish calcium-dependent
  calmodulin binding, providing a molecular connection to control of ciliary beating. Human
  airway cells lacking detectable CFAP221 form motile cilia but show abnormal circular waveforms
  and impaired mucociliary transport. The requirement for flagellar assembly is context dependent:
  mouse loss-of-function disrupts sperm flagellar maturation, whereas a reported human patient
  retains sperm motility. CFAP221 also localizes to spermatid and sperm structures and has been
  detected at primary cilia and their tips. Its precise coupling of calmodulin to the dynein-driven
  beat and the functional differences among its alternative products remain unresolved.'
