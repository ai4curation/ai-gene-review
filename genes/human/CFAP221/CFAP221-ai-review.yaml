core_functions:
- description: CFAP221 is a calmodulin-binding component of the conserved ciliary central-apparatus
    system that supports normal beating. Calcium-dependent binding is directly established for
    mouse Pcdp1 and algal FAP221 fragments; human airway loss-of-function establishes a waveform
    and transport defect despite retained cilia. The specific biochemical link from calmodulin
    occupancy to dynein regulation remains unresolved, and no motor or catalytic activity is
    assigned.
