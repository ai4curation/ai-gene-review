  review:
    action: KEEP_AS_NON_CORE
    summary: The inherited assembly role is retained at its supported flagellar-maturation scope.
    reason: PMID:18039845 shows absent mature sperm flagella and occasional abortive tails in
      mouse loss-of-function, with BAC rescue; airway cilia remain assembled and ultrastructurally
      ordinary. PMID:32704025 adds source-linked mouse genetic interaction and aborted flagellar
      maturation, while motile cilia remain present. These data support a context-specific assembly/maturation
      role rather than a general requirement for initiating human airway ciliogenesis. Human
      patient cilia form in PMID:31636325, and sperm motility is retained in one PMID:40250778
      patient. The conserved central-apparatus association supplies a plausible structural contribution,
      but its exact assembly step is unresolved. The PAINT claim is a curated ancestral-node
      inference, not a pairwise transfer or weak donor-count assertion. PTN002507401 placement/history
      was not reconstructed.
