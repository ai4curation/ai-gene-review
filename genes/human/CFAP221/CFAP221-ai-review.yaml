  review:
    action: ACCEPT
    summary: Calmodulin binding is the experimentally supported conserved molecular function.
    reason: 'The exact mouse A9Q751 source carries a PMID:20421426 IDA. Its Figure 2 and cloning/overlay
      Methods test bacterial fragments: mouse Pcdp1 residues 447-530 bind calmodulin in high
      calcium, and algal FAP221 binding is abolished by mutations in the tested region. The
      predicted mouse IQ-motif fragment was negative. Retain the ortholog inference without
      describing a direct human assay or assigning all four human products the same binding
      affinity. FAP74, not FAP221, was the algal knockdown target; those phenotypes are complex-level
      context.'
