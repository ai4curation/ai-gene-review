proposed_new_terms: []
suggested_questions:
- question: >-
    What are the distinct physiological roles and regulation of the EAAT2
    astrocytic pool versus the smaller neuronal (axon-terminal) pool at
    glutamatergic synapses?
- question: >-
    How do the DEE41 variants (G82R, L85P, P289R) mechanistically impair
    transport or trafficking, and do they act by dominant-negative
    oligomerization with wild-type EAAT2?
suggested_experiments:
- description: >-
    Cell-type-specific conditional knockout/knock-in of SLC1A2 (astrocyte vs
    neuron drivers) with synaptic glutamate imaging (iGluSnFR) to quantify the
    contribution of each pool to cleft glutamate clearance.
- description: >-
    Electrophysiological and radiotracer-uptake characterization of DEE41 mutant
    EAAT2 expressed alone and co-expressed with wild-type to test for
    dominant-negative effects on the homotrimer, combined with cryo-EM of mutant
    trimers.
