- id: PMID:14506254
  title: Glutamate modifies ion conduction and voltage-dependent gating of excitatory
    amino acid transporter-associated anion channels.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Confirms EAAT2 mediates both coupled glutamate/Na+/K+/H+ transport and an
      uncoupled anion (Cl-) conductance; EAAT2 anion channels (unlike EAAT4) lack
      glutamate-modified voltage-dependent gating.
