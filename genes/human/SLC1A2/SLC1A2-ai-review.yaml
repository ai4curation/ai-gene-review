core_functions:
- description: >-
    High-affinity, Na+-coupled secondary active transport (symport) of
    L-glutamate across the plasma membrane: one glutamate is imported together
    with three Na+ and one H+, with countertransport of one K+. This is the
    defining activity of EAAT2 and underlies its physiological role in clearing
    extracellular/synaptic glutamate.
  molecular_function:
    id: GO:0015501
    label: glutamate:sodium symporter activity
  directly_involved_in:
  - id: GO:0098712
    label: L-glutamate import across plasma membrane
  - id: GO:0098810
    label: neurotransmitter reuptake
  locations:
  - id: GO:0005886
    label: plasma membrane
  - id: GO:0097449
    label: astrocyte projection
  - id: GO:0098978
    label: glutamatergic synapse
  supported_by:
  - reference_id: PMID:7521911
    supporting_text: The affinities of the EAAT subtypes for L-glutamate were
      similar, with Km determinations varying from 48 to 97 microM in the
      mammalian cell assay
  - reference_id: file:human/SLC1A2/SLC1A2-uniprot.txt
    record_section: ["CC:FUNCTION"]
    supporting_text: Functions as a symporter that transports one amino acid molecule
  - reference_id: Reactome:R-HSA-428015
    supporting_text: GLT1 is expressed mainly in the brain and is essential for
      terminating the postsynaptic action of glutamate by rapidly removing
      released glutamate from the synaptic cleft
- description: >-
    High-affinity L-glutamate transmembrane transporter activity; EAAT2 provides
    the bulk of CNS glutamate uptake and is the dominant glutamate transporter by
    expression level. The same transport pathway also imports L-aspartate and
    D-aspartate.
  molecular_function:
