id: P43004
gene_symbol: SLC1A2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  SLC1A2 (EAAT2 / GLT-1) is the dominant Na+-dependent high-affinity glutamate
  transporter of the mammalian central nervous system. It is a homotrimeric,
  multi-pass plasma-membrane carrier of the dicarboxylate/amino acid:cation
  symporter (DAACS) family that imports L-glutamate (and also L-aspartate and
  D-aspartate) into the cytosol, cotransporting three Na+ and one H+ and
  countertransporting one K+ per transport cycle; it additionally carries a
  thermodynamically uncoupled chloride conductance intrinsic to its transport
  pore. EAAT2 is expressed chiefly by astrocytes, where it concentrates in fine
  perisynaptic processes, with a smaller pool in neuronal axon terminals; it is
  largely brain-restricted but is also present at lower levels in tissues such
  as perivenous hepatocytes. It performs the bulk of glutamate clearance from
  the synaptic cleft and extracellular space, terminating glutamatergic
  signalling and protecting neurons from excitotoxicity. Loss-of-function
  variants cause autosomal-dominant developmental and epileptic encephalopathy
  type 41.
