  review:
    summary: 'Intracellular protein localization. Accepted, deferring to the curator: the localization
      in question is PKA''s, which AKAIN1 acts on by displacing it from AKAPs.'
    action: ACCEPT
    reason: 'The abstract describes AKAIN1 as acting on where PKA goes, by competing with AKAPs: [PMID:25653177
      "that of C18orf42 could block the AKAP-mediated subcellular localization of PKA."]. So AKAIN1 does
      participate in PKA''s intracellular localization, as a negative influence on it. The term carries
      no direction, and I considered MODIFY to GO:1903828 negative regulation of protein localization.
      I did not make that change, for a specific reason: the MGI curator reading the same paper for the
      mouse ortholog kept this very term AND separately added GO:0031333 negative regulation of protein-containing
      complex assembly (IDA) to capture the disruption. The full-text readers represent this as two statements,
      not one, so collapsing them would overrule a curation choice I cannot see the basis for. The human-side
      absence of GO:0031333 is recorded as a knowledge gap instead.'
    supported_by:
    - reference_id: PMID:25653177
      supporting_text: that of C18orf42 could block the AKAP-mediated subcellular localization of PKA.
    - reference_id: PMID:25653177
      supporting_text: may be a novel PKA signaling gene that serves as an endogenous disruptor peptide
