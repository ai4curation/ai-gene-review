  label: Homo sapiens
description: 'AKAIN1 (A-kinase anchor protein inhibitor 1, formerly C18orf42) is a 69-residue protein
  expressed preferentially in neural tissue that binds the type II regulatory subunits of cAMP-dependent
  protein kinase A, RIIalpha (PRKAR2A) and RIIbeta (PRKAR2B). Its RII-binding site is predicted to form
  an amphipathic helix, the same structural element A-kinase anchoring proteins (AKAPs) use to dock onto
  the dimerization/docking domain of the RII dimer. Unlike an AKAP, however, AKAIN1 has no targeting domain
  to carry PKA anywhere: occupying the docking surface instead competes with AKAPs, and expression of
  AKAIN1 blocks AKAP-mediated subcellular localization of PKA. It has therefore been proposed to act as
  an endogenous disruptor of PKA-AKAP interactions, a naturally occurring counterpart to the synthetic
  anchoring-disruptor peptides used experimentally. Endogenous AKAIN1 protein is translated and associates
  with PKA subunits, but whether it displaces PKA from AKAPs at physiological levels, and what that does
  in neurons, has not been established.'
