    action: REMOVE
    reason: 'This row records that AKAIN1 scored an interaction with ROPN1 (Q9HAT0) in HuRI [PMID:32296183
      "Here we present a human ''all-by-all''"], a proteome-scale screen rather than a study of AKAIN1.
