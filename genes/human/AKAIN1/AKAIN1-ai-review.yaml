      that the interaction is false, and HuRI does not characterise it well enough to support a more specific
      molecular function. It is worth flagging, though, because it may not be incidental: ROPN1 carries
      a ropporin dimerization/docking domain (InterPro IPR047844), and ropporins are AKAP-associated proteins.
      An amphipathic-helix PKA-RII binder hitting a docking-domain protein is the shape of interaction
      AKAIN1 is known for. Recorded under suggested_questions rather than asserted.'
