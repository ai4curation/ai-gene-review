proposed_new_terms: []
suggested_questions:
- question: Is the HuRI interaction with ROPN1 a docking-domain interaction? ROPN1 has a ropporin dimerization/docking
    domain and ropporins associate with AKAPs; an RII-binding amphipathic helix would be expected to bind
    such a domain. If so AKAIN1 may compete with sperm AKAPs as well as with PKA anchoring.
- question: Should human AKAIN1 carry GO:0031333 negative regulation of protein-containing complex assembly,
    which the mouse ortholog carries by IDA from the same paper?
- question: Does AKAIN1 prefer RIIalpha or RIIbeta, and how does its affinity compare with anchoring AKAPs?
    Whether it can compete at physiological concentrations depends on both.
suggested_experiments:
- description: Knock out AKAIN1 in neurons and test whether PKA localization at AKAP-defined sites increases,
    which would show displacement happens at endogenous levels.
- description: Measure AKAIN1 binding affinity for RIIalpha and RIIbeta dimers by fluorescence polarization
    against a reference AKAP helix.
- description: Test the AKAIN1-ROPN1 interaction directly and map it to the ropporin docking domain and
    the AKAIN1 amphipathic helix.
