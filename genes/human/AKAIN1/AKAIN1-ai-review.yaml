core_functions:
- description: Competitive binder of the PKA RII docking surface. AKAIN1 binds the type II regulatory
    subunits of PKA through a predicted amphipathic helix - the AKAP binding mode - but carries no targeting
    domain, so instead of anchoring PKA it occupies the site AKAPs need and, when expressed, displaces
    PKA from AKAP-defined compartments. The molecular activity is RII binding; displacement of PKA is
    its consequence. Both rest on a single study, and the endogenous-disruptor role in neurons is a proposal
    rather than an observation.
