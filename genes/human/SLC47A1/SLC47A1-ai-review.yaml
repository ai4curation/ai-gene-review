- term:
    id: GO:0015489
    label: putrescine transmembrane transporter activity
  evidence_type: IDA
  original_reference_id: PMID:21128598
  qualifier: enables
  review:
    summary: This annotation claims MATE1 transports putrescine, but the cited paper
      explicitly shows the opposite - hMATE1 does NOT transport putrescine; it transports
      the related guanidinium-containing polyamine agmatine.
    action: REMOVE
    reason: The full text of PMID:21128598 directly contradicts putrescine transport
      by MATE1. Putrescine accumulation was identical between mock and hMATE1 cells,
      whereas agmatine was significantly and saturably transported; the authors attribute
      the selectivity to recognition of the agmatine guanidine moiety. This is a wrong-substrate
      curation error (agmatine was mis-recorded as putrescine). The true substrate
      agmatine is a cationic amine covered by the core organic cation:proton antiporter
      activity (GO:0140968); no dedicated agmatine MF term currently exists.
    supported_by:
    - reference_id: PMID:21128598
      supporting_text: While putrescine was not transported by hMATE1, putrescine
        did display a much more robust uptake in mock-HEK cells than agmatine in either
        cell type
    - reference_id: PMID:21128598
      supporting_text: By contrast, putrescine accumulation was nearly identical between
        mock and hMATE1-HEK cells
    source_defects:
    - defect_type: WRONG_TERM
      resource: UNIPROT
      slot: GO_ID
      asserted_value: GO:0015489
      corrected_label: agmatine transmembrane transporter activity (no specific GO
        term exists; the demonstrated substrate is agmatine, subsumed by GO:0140968
        polyspecific organic cation:proton antiporter activity)
      requested_change: DELETE_ROW
      confidence: CONFIRMED
      explanation: PMID:21128598 shows hMATE1 transports agmatine but explicitly not
        putrescine ("While putrescine was not transported by hMATE1"). The IDA annotation
        to putrescine transmembrane transporter activity mis-assigns the substrate
        and should be removed; the correct substrate agmatine has no dedicated GO
        MF term and is captured by the organic cation:proton antiporter activity.
