proposed_new_terms:
- proposed_name: agmatine transmembrane transporter activity
  proposed_definition: Enables the transfer of agmatine (an endogenous guanidinium-containing
    polyamine, decarboxylated L-arginine) from one side of a membrane to the other,
    coupled to proton antiport.
  justification: MATE1 is directly and saturably shown to transport agmatine (Km ~240
    uM), and UniProt curates the agmatine(in) + H(+)(out) = agmatine(out) + H(+)(in)
    reaction (Rhea:RHEA:72127), yet no agmatine-specific GO molecular function term
    exists. The substrate was previously mis-recorded in GOA as putrescine, which
    PMID:21128598 explicitly shows is NOT transported by MATE1.
  proposed_parent:
    id: GO:0140968
    label: polyspecific organic cation:proton antiporter activity
  supported_by:
  - reference_id: PMID:21128598
    supporting_text: The intracellular accumulation of agmatine was significantly
      enhanced by hMATE1 over-expression, relative to mock-HEK cells
  - reference_id: file:human/SLC47A1/SLC47A1-uniprot.txt
    supporting_text: Reaction=agmatine(in) + H(+)(out) = agmatine(out) + H(+)(in)
    record_section:
    - CC:CATALYTIC ACTIVITY
suggested_questions:
- question: What is the physiological significance of MATE1-mediated efflux of endogenous
    substrates (creatinine, thiamine, agmatine, estrone-3-sulfate) relative to its
    well-characterized role in xenobiotic/drug clearance?
  experts: []
- question: Does MATE1 contribute functionally to organic-cation handling across the
    blood-testis barrier, where it is expressed in the adluminal compartment of seminiferous
    tubules?
  experts: []
suggested_experiments:
- hypothesis: MATE1 transports agmatine but not putrescine, and the selectivity is
    determined by recognition of the guanidinium moiety.
  description: Perform side-by-side cis-inhibition and trans-stimulation uptake assays
    of radiolabeled agmatine and putrescine in MATE1-expressing versus mock cells,
    with guanidinium-moiety competitors, to define the structural determinants of
    polyamine selectivity and to formally establish agmatine (not putrescine) as the
    GO-annotatable substrate.
  experiment_type: radiotracer transport assay
- hypothesis: The physiological direction of MATE1 L-arginine/ADMA transport is efflux,
    not import, with the in-vitro uptake reflecting the imposed proton gradient.
  description: Use proteoliposomes or polarized epithelial monolayers with controlled
    pH gradients to determine the net physiological direction and driving force of
    MATE1-mediated L-arginine/ADMA and organic-cation transport.
  experiment_type: vesicular/polarized-monolayer directional transport assay
