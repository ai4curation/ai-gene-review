id: Q96FL8
gene_symbol: SLC47A1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SLC47A1 (MATE1, multidrug and toxin extrusion protein 1) is a polytopic
  plasma-membrane protein of the multidrug and toxin extrusion (MATE/MOP flippase,
  TC 2.A.66.1) family that functions as an electroneutral H(+)/organic cation antiporter.
  It uses the inwardly directed transmembrane proton gradient to drive the efflux
  of structurally diverse organic cations and weak bases out of the cell. In the kidney
  it resides at the brush-border (apical) membrane of proximal tubule cells and in
  the liver at the bile canalicular (apical) membrane of hepatocytes, where it catalyses
  the final step of tubular and biliary secretion of its substrates into urine and
  bile respectively. Its substrates include the endogenous metabolites creatinine,
  thiamine (vitamin B1), agmatine and estrone-3-sulfate as well as many cationic drugs
  and toxins (the antidiabetic metformin, cimetidine, the model cations tetraethylammonium
  and 1-methyl-4-phenylpyridinium, the platinum agents cisplatin/oxaliplatin, procainamide,
  topotecan, acyclovir). It is a major determinant of the pharmacokinetics and renal/hepatic
  clearance of cationic drugs and, working together with the basolateral uptake transporters
  OCT1/OCT2, forms a vectorial secretion pathway for organic cations. The transporter
  is a multi-pass membrane protein whose conserved transmembrane glutamate residues
  (e.g. Glu273, Glu278) are essential for substrate recognition and transport.
