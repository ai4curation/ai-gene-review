id: Q8NCM8
gene_symbol: DYNC2H1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: DYNC2H1 (DHC2, DHC1b) is the heavy chain of cytoplasmic dynein-2, the minus-end-directed
  microtubule motor that powers retrograde intraflagellar transport (IFT) from the ciliary tip back to
  the base. Two copies of this ~490 kDa AAA+ ATPase form the catalytic core of the dynein-2 holoenzyme;
  each heavy chain comprises an N-terminal tail that binds the light intermediate chain DYNC2LI1 and one
  of the two distinct WD40 intermediate chains (WDR60/DYNC2I1 or WDR34/DYNC2I2), and a C-terminal ring
  of six AAA+ modules with a microtubule-binding stalk. The non-motor subunits force the two heavy chains
  into an asymmetric, autoinhibited arrangement that docks onto anterograde IFT-B trains, so that dynein-2
  is carried to the ciliary tip by kinesin-2 and is then activated to haul IFT trains and their cargoes
  back along the axonemal A-tubules. Dynein-2 is required for assembly and maintenance of primary and
  motile cilia and for ciliary Hedgehog signalling; biallelic DYNC2H1 variants are the most common cause
  of short-rib thoracic dysplasia (Jeune asphyxiating thoracic dystrophy / short-rib polydactyly syndromes).
  An early report placed DHC2 at the Golgi apparatus, but its established role is ciliary.
