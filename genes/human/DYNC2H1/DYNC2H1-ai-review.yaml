- id: file:human/DYNC2H1/DYNC2H1-uniprot.txt
  title: 'UniProtKB Q8NCM8: human DYNC2H1 sequence and alternative products'
  findings: []
core_functions:
- description: The DYNC2H1 heavy chain supplies ATP-driven minus-end-directed movement to the dynein-2
    complex during intraciliary retrograde transport. Human recombinant motor measurements establish
    polarity, and the human holoenzyme structure shows how its heavy-chain tails and accessory subunits
    organize an inhibited assembly. Tail binding to DYNC2LI1 and intermediate-chain subunits supports
    this motor assembly rather than defining a separate core activity. The 920-residue alternative
    product lacks the six AAA regions and stalk and is not assigned a complete motor function.
  molecular_function:
    id: GO:0008569
    label: minus-end-directed microtubule motor activity
  in_complex:
    id: GO:0005868
    label: cytoplasmic dynein complex
  locations:
  - id: GO:0005929
    label: cilium
  directly_involved_in:
  - id: GO:0035721
    label: intraciliary retrograde transport
  supported_by:
  - reference_id: PMID:21723285
  - reference_id: PMID:31451806
  - reference_id: PMID:29742051
  - reference_id: PMID:25830415
  - reference_id: PMID:30065109
  knowledge_gaps:
  - gap_statement: The retained molecular activity and physiological contribution of the 920-residue
      alternative product are not established by full-length motor or tail-association experiments.
    boundary: Its sequence retains canonical residues1–735 and4123–4307, while deleting the six AAA
      regions and microtubule-binding stalk. The recombinant full-length motor evidence cannot be
      applied to it.
    provenance:
    - reference_id: file:human/DYNC2H1/DYNC2H1-uniprot.txt
    - reference_id: PMID:31451806
proposed_new_terms: []
suggested_questions:
- question: Is the Golgi localization of DHC2 reported in 1996 reproducible with modern tagged alleles,
    and does dynein-2 have any non-ciliary role in Golgi organization?
- question: What triggers release of dynein-2 autoinhibition at the ciliary tip?
suggested_experiments:
- description: Endogenous tagging of DYNC2H1 in RPE1 cells with live imaging and expansion microscopy
    to quantify Golgi versus ciliary pools.
- description: Single-molecule motility assays of dynein-2 carrying SRTD3/Jeune patient mutations
    to relate motor defects to disease severity.
