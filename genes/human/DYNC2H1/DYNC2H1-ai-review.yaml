  review:
    action: REMOVE
    reason: 'GO:0060294 describes motor-mediated movement of cilia that moves a cell. DYNC2H1 is
      specialized as the cargo-transporting IFT heavy chain, distinct from the stationary axonemal
      dyneins that generate ciliary bending. The current target-containing tree and literal IBD confirm
      that this assertion really descends from the broad dynein root PTN000743491; the root is not
      a fabricated or mismatched node, and the available IRD exclusions lie on the dynein-1 sibling
      rather than the target path. The biological objection is that this broad ancestral placement
      carries a ciliary-beating role into the experimentally characterized IFT-motor branch. Retain
      cilium assembly, retrograde IFT and motile-cilium locations separately: none by itself establishes
      that DYNC2H1 executes the beating process. This judgment does not dismiss the experimental
      beating evidence on the axonemal donor proteins.'
