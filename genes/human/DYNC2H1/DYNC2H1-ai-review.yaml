core_functions:
- description: As the motor-domain-containing heavy chain of cytoplasmic dynein-2, DYNC2H1 hydrolyses ATP to move toward microtubule minus ends, powering retrograde intraflagellar transport of IFT trains and cargo from the ciliary tip to the base, which is required for cilium assembly and maintenance.
