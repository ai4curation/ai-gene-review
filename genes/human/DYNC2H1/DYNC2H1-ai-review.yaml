  review:
    summary: Cilium movement involved in cell motility, by phylogenetic inference from the dynein heavy
      chain family.
    action: MARK_AS_OVER_ANNOTATED
    reason: Axonemal dynein heavy chains drive ciliary beating, but dynein-2 is a cytoplasmic transport
      dynein that moves IFT trains. It is not part of the axonemal arms that generate ciliary motion.
      Any effect of dynein-2 loss on motility is indirect, through defective cilium assembly. The IBA
      most likely reflects a deep node shared with axonemal dyneins and is not a function of the dynein-2
      heavy-chain clade. The WITH/FROM donors in GOA are all axonemal dynein heavy chains (UniProtKB Q8TD57,
      Q8TE73, Q96DT5, Q9P2D7) together with Drosophila and mouse orthologs, which is consistent with this
      reading.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      - ROLE_CONFLATION
      source_entities:
      - source_id: PANTHER:PTN000743491
        source_label: PTN000743491
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: The IBD node is supported by axonemal dynein heavy chains (DNAH-type donors) that power
          ciliary beating. The cytoplasmic dynein-2 heavy chain is a retrograde IFT motor and has diverged
          from axonemal force generation, so it should be excluded from this transfer.
    supported_by:
    - reference_id: PMID:30065109
      supporting_text: Dynein-2 is carried as a passenger on anterograde IFT trains to the ciliary tip,
        and then, following IFT train remodeling, powers return transport to the ciliary base.
