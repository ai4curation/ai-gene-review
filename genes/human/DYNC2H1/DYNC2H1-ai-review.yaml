suggested_questions:
- question: Is the Golgi localization and Golgi-organization role reported for DHC2 in 1996 (antibody
    microinjection) reproducible with modern genetic loss-of-function, or should these annotations be
    retired in favour of the ciliary role?
- question: Should GO add a specific "cytoplasmic dynein-2 complex" term, distinct from dynein-1, given
    that its subunit composition (DYNC2H1, DYNC2LI1, WDR60, WDR34, TCTEX1D2) is now well defined?
suggested_experiments:
- hypothesis: DYNC2H1 heavy chain is dispensable for Golgi organization in non-ciliated or ciliated human
    cells.
  description: Compare Golgi morphology (GM130/TGN46 staining, live imaging of ER-to-Golgi transport)
    in DYNC2H1-knockout versus parental hTERT-RPE1 cells, with rescue by wild-type DYNC2H1.
  experiment_type: knockout phenotyping
