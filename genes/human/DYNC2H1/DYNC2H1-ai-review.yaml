  qualifier: located_in
  review:
    action: REMOVE
    reason: The cited study concerns cytoplasmic dynein-1 in mouse male germ cells. Its operative
      Methods identify the DYNC1H1 antibody, and Supplementary Figure 4 identifies DYNC1H1, DYNC1LI2
      and p150 at telomere attachment sites on the outside of the nuclear envelope. The separately
      inspected supplementary workbooks likewise name DYNC1H1, not DYNC2H1. These positive target
      and compartment identities do not support a DYNC2H1 annotation to the male germ cell nucleus.
      This is a source-specific miscitation judgment for the NAS assertion, not an inference from
      the paper title or a general denial of possible nuclear dynein-2 pools.
    supported_by:
