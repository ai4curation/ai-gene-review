id: Q8NCM8
gene_symbol: DYNC2H1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: DYNC2H1 is the heavy chain of cytoplasmic dynein-2 (C. elegans CHE-3), the AAA+ minus-end-directed microtubule motor that powers retrograde intraflagellar transport. Two DYNC2H1 copies, each bound to a light intermediate chain (DYNC2LI1), are held in an asymmetric arrangement by the WDR34-WDR60 intermediate chain heterodimer and a block of light chains (DYNLRB, DYNLL/LC8, TCTEX1D2/DYNLT). Dynein-2 is carried to the ciliary tip as autoinhibited cargo on anterograde IFT-B trains, with one heavy chain in a zig-zag conformation matching the IFT-B repeat; at the tip it is activated and moves IFT trains, with IFT-A, BBSome and membrane cargo, back to the ciliary base. DYNC2H1 is therefore required for cilium assembly, length control and ciliary signalling, including Hedgehog signalling. Early antibody studies also localized the heavy chain to the Golgi apparatus. Biallelic DYNC2H1 mutations cause Jeune asphyxiating thoracic dystrophy and short-rib thoracic dysplasia 3 with or without polydactyly (short-rib polydactyly syndrome type III).
