  review:
    summary: Cilium movement involved in cell motility (IBA). The supporting entities are largely axonemal dynein heavy chains; the inference appears to originate from a deep node of the dynein heavy chain family. Dynein-2 is the retrograde IFT motor and does not power axonemal beating.
    action: REMOVE
    reason: Dynein-2 is not an axonemal (beating) dynein; motility defects from dynein-2 loss are secondary to defective cilium assembly. The function arose in the axonemal dynein lineage, not in the DYNC2H1 lineage.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      - ROLE_CONFLATION
      source_entities:
      - source_id: PANTHER:PTN000743491
        comment: Deep dynein heavy chain node (also the source of the intermediate/light-intermediate chain binding IBAs). Ciliary beating is a property of the axonemal dynein descendants; the cytoplasmic dynein-2 lineage (PTHR46532:SF15) diverged to act as the retrograde IFT motor, so the motility process should not be inherited by DYNC2H1.
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
      - source_id: UniProtKB:Q8TE73
        comment: Axonemal outer-arm dynein heavy chain donor; its motility role is correct for itself but not transferable to dynein-2.
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
      - source_id: UniProtKB:Q96DT5
        comment: Axonemal dynein heavy chain donor; motility role does not transfer to the IFT motor.
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
