id: Q8NCM8
gene_symbol: DYNC2H1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: DYNC2H1 encodes the force-generating heavy chain of cytoplasmic dynein-2, the motor
  that returns intraflagellar transport trains and cargo from ciliary tips toward the cell body.
  Its C-terminal motor region couples ATP hydrolysis to movement toward microtubule minus ends, while
  its N-terminal tail assembles with light intermediate, intermediate and light chains. Dynein-2
  activity is controlled by interactions between its two heavy chains and associated subunits. The
  motor supports the construction and maintenance of sensory and motile cilia. Pathogenic biallelic
  variants cause skeletal ciliopathies. A short alternative product lacks the AAA motor ring and
  microtubule-binding stalk.
