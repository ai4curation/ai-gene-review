core_functions:
- description: Motor (catalytic) subunit of cytoplasmic dynein-2. Two DYNC2H1 copies supply the AAA+ ATPase
    motor domains that generate minus-end-directed movement along axonemal microtubules, powering retrograde
    intraflagellar transport of IFT trains and cargo from the ciliary tip to the base.
  molecular_function:
    id: GO:0008569
    label: minus-end-directed microtubule motor activity
  directly_involved_in:
  - id: GO:0035721
    label: intraciliary retrograde transport
  locations:
  - id: GO:0005930
    label: axoneme
  - id: GO:0005929
    label: cilium
  in_complex:
    id: GO:0005868
    label: cytoplasmic dynein complex
  supported_by:
  - reference_id: PMID:21723285
    supporting_text: This is the first demonstration of dynein-2 motor activity, which supports the retrograde
      intraflagellar transport role of dynein-2.
  - reference_id: PMID:31451806
    supporting_text: Dynein-2, the ubiquitous motor for retrograde IFT, is crucial for cilia biogenesis
- description: Assembly scaffold for the dynein-2 holoenzyme. The N-terminal tail of each heavy chain
    binds the light intermediate chain DYNC2LI1 and one of the two intermediate chains (WDR60 or WDR34).
    This yields an asymmetric, autoinhibited complex that is carried on anterograde IFT-B trains and is
    needed for cilium assembly.
  molecular_function:
    id: GO:0045505
    label: dynein intermediate chain binding
  directly_involved_in:
  - id: GO:0060271
    label: cilium assembly
  in_complex:
    id: GO:0005868
    label: cytoplasmic dynein complex
  supported_by:
  - reference_id: PMID:31451806
    supporting_text: DHC2TAIL-A and -B, are bound by the β-propeller of WDR60 and WDR34 respectively,
      mainly via bundle 3
  - reference_id: PMID:29742051
    supporting_text: In our predicted architectural model, WDR34 and WDR60 interact with distinct sets
      of light chains and in turn interact with DYNC2H1–DYNC2LI1.
