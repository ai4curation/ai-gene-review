id: P12830
gene_symbol: CDH1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: E-cadherin is a classical, calcium-dependent cell-surface adhesion protein prominent
  in epithelial tissues. Its five extracellular cadherin repeats form adhesive contacts with
  cadherins on neighboring cells, while its cytoplasmic tail associates with catenins and
  connects the adhesion complex to the cortical cytoskeleton. These interactions organize
  and stabilize adherens junctions and help maintain epithelial architecture. E-cadherin undergoes
  regulated endocytosis, recycling and proteolytic shedding, allowing junction strength and
  surface abundance to change during tissue remodeling. Loss or alteration of its adhesive
  function contributes to developmental defects and to the invasive behavior of several epithelial
  cancers.
