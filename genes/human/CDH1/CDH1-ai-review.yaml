    label: cell morphogenesis
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: IBA projection from the PANTHER classical cadherin family tree (PTHR24027) via
      GO_REF:0000033. E-cadherin contributes to epithelial cell morphogenesis because cadherin-mediated
      adhesion shapes epithelial cells and is required to establish and maintain epithelial
      architecture. However, cell morphogenesis is a broad downstream outcome of the core
      adhesion and junction-organizing activity rather than a distinct core function. The
      precise core CDH1 processes (calcium-dependent homophilic cell-cell adhesion, cadherin-mediated
      adhesion, adherens junction organization) are captured by other rows in this file.
    action: KEEP_AS_NON_CORE
    reason: Real but general developmental/cellular outcome downstream of the core adhesion
      function; the precise core processes (GO:0044331 cell-cell adhesion mediated by cadherin,
      GO:0034332 adherens junction organization) are ACCEPTed elsewhere in this review.
