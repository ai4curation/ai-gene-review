  title: Changes in E- and N-cadherin expression in developing rat adenohypophysis.
- id: PMID:23226367
  title: p250GAP is a novel player in the Cdh1-APC/Smurf1 pathway of axon growth regulation.
  reference_review:
    relevance: NONE
    correctness: MISCITED
    review_notes: Full Results/Figures 1–3 and Methods concern Cdh1-APC/Smurf1/p250GAP and
      rat neuronal Cdh1 RNAi. Exact plasmid/RNAi sequences were not independently authenticated;
      no WD40 assay is claimed for this source.
- id: PMID:12387456
  title: Differential regulation of cadherins and catenins during axonal reorganization in
    the adult rat CNS.
- id: PMID:16997938
  title: Investigation of the effects of heparin and low molecular weight heparin on E-cadherin
    and laminin expression in rat pregnancy by immunohistochemistry.
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: Original abstract supports the rat heparin-associated expression response.
      PubMed lists correction PMID:36723396/doi10.1093/humrep/dead022; its text could not
      be recovered, so its effect on the staining evidence remains unadjudicated. No retraction
      is inferred.
- id: PMID:21186356
  title: APC(Cdh1) mediates EphA4-dependent downregulation of AMPA receptors in homeostatic
    plasticity.
  reference_review:
    relevance: NONE
    correctness: MISCITED
    review_notes: 'Author-hosted full article and online Methods were inspected: Figures 5D,6,7
      test APC/C coactivator Cdh1, including a WD40 deletion, in postsynaptic/AMPA-receptor
      regulation. The rat E-cadherin donor mapping is therefore wrong for these three terms.'
- id: PMID:20501441
  title: Bifidobacterium bifidum improves intestinal integrity in a rat model of necrotizing
    enterocolitis.
- id: PMID:12700184
  title: 'Fer kinase/FerT and adherens junction dynamics in the testis: an in vitro and in
    vivo study.'
  reference_review:
    relevance: MEDIUM
    correctness: MISCITED
    review_notes: The abstract reports Fer association with N-cadherin but not E-cadherin.
      Independent human EGFR/FGFR1 associations retain the biological kinase-binding term;
      they do not repair this rat donor provenance.
- id: PMID:19340315
  title: HD-PTP is a catalytically inactive tyrosine phosphatase due to a conserved divergence
    in its phosphatase domain.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: 'Genuine normal full-text cache read, including Results/Figures 1–4: human
      PTPN23 WT is inactive against tested DiFMUP/pNPP substrates and S1394A restores activity.
      This assay-specific evidence contrasts with PMID:21724833; it does not negate the latter
      association assay.'
- id: PMID:10963665
  title: A role for alpha-and beta-catenins in bacterial uptake.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Authentic normal cache is abstract-only. Selected full primary PMC27655
      Methods, Results and legends were independently read externally: human E-cadherin variants
      in L2071 cells, cytoplasmic deletion and human/mouse alpha-catenin chimera, plus human
      epithelial-cell recruitment. Supports receptor coupling for InlA-mediated uptake, independently
      of the original rat Bifidobacterium source.'
