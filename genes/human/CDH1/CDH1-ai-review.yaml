      cytoplasmic tail is the defining interaction of the cadherin-catenin complex. Corroborated
      by IPI (PMID:18593713) and IDA (PMID:17620337) evidence on this exact term elsewhere
      in the file. Evolutionary note (action unchanged): the IBD sits on PANTHER node PTN008601603,
      which also covers a Monosiga brevicollis cadherin (A9V8Y4) that lacks the classical
      cadherin cytoplasmic domain (Pfam PF01049); classical cadherins and this domain are
