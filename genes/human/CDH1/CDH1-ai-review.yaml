      this interaction links the cadherin to the actin cytoskeleton via alpha-catenin and
      is the molecular basis of the cadherin-catenin complex. Independently supported within
      this file by IPI/IDA evidence on this same term (PMID:18593713, Smad7 stabilizes beta-catenin
      binding to the E-cadherin complex; PMID:17620337) and by Reactome TAS rows describing
      CDH1-CTNNB1 complex formation.
