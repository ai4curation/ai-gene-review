    label: cell-cell junction assembly
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: IBA projection from the PANTHER classical cadherin family tree (PTHR24027) via
      GO_REF:0000033. E-cadherin nucleates assembly of epithelial cell-cell junctions — homophilic
      trans-engagement of E-cadherin ectodomains initiates cell-cell contact, and the cytoplasmic
      tail recruits the catenins that build the adherens junction and template subsequent
      tight-junction and desmosome formation. This is a core, well-established CDH1 function,
