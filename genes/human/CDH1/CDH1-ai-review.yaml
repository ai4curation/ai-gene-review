- term:
    id: GO:0016477
    label: cell migration
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: IBA projection from the PANTHER cadherin family tree (PTHR24027) via GO_REF:0000033.
      E-cadherin participates in cell migration processes — it is retained at junctions during
      collective epithelial migration such as wound healing, and conversely its loss drives
      the epithelial-mesenchymal transition that licenses single-cell motility and invasion.
      The bare cell migration term carries no directionality, whereas the best-established
      directional CDH1 role is suppression of single-cell migration/invasion, separately captured
      by the IMP GO:0030336 (negative regulation of cell migration) row in this file (PMID:16882694).
      The generic involved_in cell-migration inference is therefore a real but non-core, context-dependent
      association.
    action: KEEP_AS_NON_CORE
    reason: Generic non-directional migration term; the core CDH1 activity is cell-cell adhesion
      rather than migration per se, and the directional regulatory role (suppression of migration/invasion)
      is captured by GO:0030336 elsewhere in the file.
  qualifier: involved_in
- term:
