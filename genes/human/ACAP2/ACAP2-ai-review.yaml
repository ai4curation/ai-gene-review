    label: GTPase activator activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: 'Correct, and this is the core molecular function. Again self-referential
      (UniProtKB:Q15057 appears in WITH/FROM), so a PAN-GO curator has affirmed it for the human
      protein, and it is redundant with the direct biochemistry in PMID:11062263. The term is retained
      unchanged rather than made more specific for an ontology reason, not a biological one:
      GO:0008060 "ARF GTPase activator activity" no longer exists as a distinct class. It is one of
      nine substrate-specific GAP terms (with GO:0005097 Rab, GO:0005098 Ran, GO:0005099 Ras,
      GO:0005100 Rho, GO:0005101, GO:0017123, GO:0030675, GO:0046582) merged into GO:0005096, which
      now has no substrate-specific children at all. So GO:0005096 is already the most precise term
      available, and ACAP2''s genuine ARF6-over-ARF1/ARF5 preference has to be recorded as a has_input
      annotation extension or in a GO-CAM instead - which is what this review does, on the IDA row for
