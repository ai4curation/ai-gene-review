- term:
    id: GO:0030036
    label: actin cytoskeleton organization
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: 'The conclusion that ACAP2 has something to do with actin is right, but both the term and
      its evidence chain are wrong in ways worth separating.


      On the term. ACAP2 is not part of the actin machinery. It is a GAP that switches ARF6 off, and
      ARF6 is what remodels cortical actin; the readouts are suppression of PDGF-induced dorsal ruffles
      and of ARF6-dependent protrusions, both abolished when GAP activity is removed. That is
      regulation of actin cytoskeleton organization (GO:0032956), one level up in role, not the process
      itself.


      On the evidence chain. This IBA''s four supporting entities are PANTHER:PTN001142372 plus two
      Dictyostelium proteins and Drosophila blow. The two Dictyostelium entries check out - Q54WI0
      (1333 aa) and Q551Q8 (843 aa) both carry Arf-GAP domains in genuine ACAP-like architectures, and
      Q54WI0 holds its own experimental actin annotations, so the term itself is properly supported.
      blow (blown fuse) does not check out. All four of its UniProt entries have exactly one annotated
      domain, a PH domain - A1Z714 204-307, P91678 204-307, E1JGZ4 197-300, Q8MSU1 92-195 - with no BAR
      domain, no ArfGAP catalytic domain and no ankyrin repeats on any isoform, and none of the four
      carries a PANTHER cross-reference in UniProt. PANTHER nonetheless assigns blow to PTHR23180
      subfamily SF399, so its experimental actin annotation - which comes from myoblast fusion - is
      propagated into ACAP2''s support set. Whatever blow does to actin, it cannot be doing it as an
      ARF GAP.


      The subfamily assignment is the sharper form of the problem. SF399 is not a domain-less outlier
      group that happens to contain blow; the cached PTHR23180 member table shows its other reviewed
      member is C. elegans cnt-1 (Q9XXH8, 826 aa, "Arf-GAP with ANK repeat and PH domain-containing
      protein"), a bona fide ACAP-family protein that this same review treats as ortholog-grade support
      on other rows. So a PH-domain-only protein has been placed inside a real ACAP subfamily, and the
      subfamily name PANTHER gives it - "BLOWN FUSE, ISOFORM A-RELATED" - takes its label from the
      member that lacks the catalytic domain rather than from the one that has it.


      PTN001142372 is also much deeper than the ACAP1/2/3 node. Querying QuickGO for annotations
      carrying that node returns 1000 annotations of the same four terms, on Brassica, Cucumis,
      Medicago, Theobroma, Zostera, Mimulus, Manihot, Sorghum and Helianthus genes, on the charophyte
      alga Klebsormidium, on yeast AGE1, and on Xenopus acap2.L - i.e. it predates the
      plant/fungal/animal split. GAP activity survives that depth; a specific actin process does not.


      Every identifier and domain assignment above was resolved programmatically; see
      ACAP2-bioinformatics/RESULTS.md and the script that generates it.


      MODIFY rather than REMOVE because the human protein has its own evidence for the regulatory
      role, so the right fix is the term and not deletion.'
    action: MODIFY
    reason: ACAP2 acts upstream of actin remodelling as an ARF6 GAP rather than participating in actin
      cytoskeleton organization itself, so the regulation term is the accurate role. The IBA's own
      support set is additionally weak - a pan-eukaryotic node plus Drosophila blow, a PH-domain-only
      protein with no ArfGAP domain whose actin annotation comes from myoblast fusion.
    proposed_replacement_terms:
    - id: GO:0032956
      label: regulation of actin cytoskeleton organization
    supported_by:
    - reference_id: PMID:11062263
      supporting_text: Overexpression of either ACAP inhibited the formation of PDGF-induced dorsal ruffles
    - reference_id: PMID:11062263
      supporting_text: The effects of ACAP1 and ACAP2 were dependent on GAP activity.
    - reference_id: file:human/ACAP2/ACAP2-bioinformatics/RESULTS.md
      supporting_text: '- `A1Z714` A1Z714_DROME, 644 aa, domains: PH 204-307, PANTHER xrefs in UniProt: NONE'
    - reference_id: file:human/ACAP2/ACAP2-bioinformatics/RESULTS.md
      supporting_text: '- PANTHER assignment: PTHR23180 / PTHR23180:SF399'
    - reference_id: file:human/ACAP2/ACAP2-bioinformatics/RESULTS.md
      supporting_text: '- `Q9XXH8` cnt-1 (Caenorhabditis elegans), 826 aa - Arf-GAP with ANK repeat and PH domain-containing protein cnt-1'
    - reference_id: file:human/ACAP2/ACAP2-bioinformatics/RESULTS.md
      supporting_text: '- QuickGO reports 1000 annotations citing this node.'
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - ROLE_CONFLATION
      - SOURCE_EVIDENCE_WEAK
      source_entities:
      - source_id: FB:FBgn0004133
        source_label: Drosophila blow (blown fuse)
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: PH domain only on all four isoforms (204-307, 204-307, 197-300, 92-195); no BAR, no
          Arf-GAP, no ANK, and no PANTHER xref in UniProt. PANTHER places it in PTHR23180:SF399 anyway,
          alongside the genuine ACAP protein cnt-1. Its own GO:0030036 annotation is experimental (IMP
          on A1Z714 and E1JGZ4), so the objection is not evidence quality - it is that a protein with no
          ArfGAP domain cannot be doing to actin what ACAP2 does, so its myoblast-fusion phenotype is
          not transferable support for ACAP2.
      - source_id: dictyBase:DDB_G0279649
        source_label: Dictyostelium Q54WI0
        source_status: SUPPORTS_TRANSFER
        comment: Verified BAR-PH-ArfGAP-ANK architecture, and it carries GO:0030036 by both IMP and IGI
          in its own right - this is the source that actually justifies the term.
      - source_id: dictyBase:DDB_G0276395
        source_label: Dictyostelium Q551Q8
        source_status: SUPPORTS_TRANSFER
        comment: Verified PH-ArfGAP architecture, PTHR23180:SF414, and carries GO:0030036 by IGI.
      - source_id: PANTHER:PTN001142372
        source_label: pan-eukaryotic centaurin/ArfGAP ancestral node
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Node spans plants, fungi and animals (same four terms appear on Brassica, Medicago,
          Zostera, yeast AGE1 and Xenopus acap2.L), too deep to carry a specific actin process term.
