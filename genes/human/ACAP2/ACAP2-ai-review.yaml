- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:33961781
  qualifier: enables
  review:
    summary: 'The partner is UniProtKB:Q96P50, ACAP3 - a close paralog of ACAP2 with the same
      BAR-PH-ArfGAP-ANK architecture and the same ARF6 preference. This is not a paralog transfer
      error; it is a measured physical interaction, recovered here by BioPlex 3.0 affinity-purification
      mass spectrometry, and independently by OpenCell (the PMID:35271311 row below). UniProt promotes
      it to an INTERACTION line with NbExp=4, so the pair is very likely real.


      It is nevertheless recorded under a term that conveys no function. Hetero-oligomerisation through
      the shared N-terminal BAR domain would be the obvious mechanism, and would matter - it could
      let two ARF6 GAPs with different recruitment logic act as one unit - but nothing about the
      interface, the stoichiometry or any functional consequence has been tested, and AP-MS cannot
      license a dimerisation molecular function. Marked over-annotated rather than modified for that
      reason; proposing GO:0046982 here would be inventing a mechanism the data do not contain.'
    action: MARK_AS_OVER_ANNOTATED
    reason: Bare protein binding from a proteome-scale AP-MS interactome. The ACAP2-ACAP3 pair is
      probably real (two orthogonal screens, UniProt NbExp=4) but functionally untested, and the term
      as recorded contributes nothing to understanding either protein.
    supported_by:
    - reference_id: file:human/ACAP2/ACAP2-uniprot.txt
      supporting_text: 'CC       Q15057; Q96P50: ACAP3; NbExp=4; IntAct=EBI-4401196, EBI-715726;'
    - reference_id: PMID:33961781
      supporting_text: Through affinity-purification mass spectrometry, we have created two
        proteome-scale, cell-line-specific interaction networks.
