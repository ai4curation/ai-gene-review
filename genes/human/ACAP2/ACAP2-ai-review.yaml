- term:
    id: GO:0032013
    label: negative regulation of ARF protein signal transduction
  evidence_type: IMP
  original_reference_id: PMID:11062263
  qualifier: involved_in
  review:
    summary: 'Proposed new annotation, and the main gap this review closes. GOA gives ACAP2 four
      biological processes - actin cytoskeleton organization (IBA), actin filament-based process (IDA),
      endocytic recycling (ISS) and cellular response to NGF (ISS) - and not one of them says that
      ACAP2 switches ARF6 off, which is the entirety of its characterised biology. The molecular
      function is annotated; the process the function serves is not.


      GO:0032013 exists, is not obsolete, and is exactly the right term. Support in human cells is
      direct. In HeLa cells, co-expression of ACAP2 with ARF6 suppressed the ARF6-dependent protrusions
      that AlF4 induces, halving the fraction of protruding cells, and the suppression required GAP
      activity. Three later studies describe the same relationship in words, calling ACAP2 an ARF6
      GTPase-activating protein recruited by GTP-RAB35, and the GTPase-activating protein that
      switches off Arf6 activity.


      IMP rather than IDA, deliberately. The cellular evidence is overexpression plus a GAP-dead point
      mutant, not a direct assay at native levels. The in vitro GAP assay in the same paper is the IDA,
      and it supports the molecular function row, not this process row.'
    action: NEW
    reason: ACAP2's only characterised job is to terminate ARF6 signalling, and GOA records no
      biological process to that effect. GO:0032013 is a live, non-obsolete term that states it, and it
      is the process under which the existing GO:0005096 molecular function should sit.
    supported_by:
