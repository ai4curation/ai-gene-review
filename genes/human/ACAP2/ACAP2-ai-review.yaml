- id: file:human/ACAP2/ACAP2-bioinformatics/RESULTS.md
  title: ACAP2 WITH/FROM resolution and domain-architecture check
  findings:
  - statement: Every one of the 22 WITH/FROM identifiers in ACAP2-goa.tsv resolves; the three ISS/IEA
      ortholog transfers come from rat and mouse Acap2, while MGI:MGI:2153589 is mouse Acap3, a paralog.
    supporting_text: '| `MGI:MGI:2153589` | Q6NXL5 Q6NXL5_MOUSE (Acap3) | Mus musculus | 833 | yes | GO:0005096 (IBA) |'
  - statement: Drosophila blow carries only a PH domain on all four of its UniProt entries and no
      PANTHER cross-reference, yet PANTHER places it in PTHR23180:SF399.
    supporting_text: '- `A1Z714` A1Z714_DROME, 644 aa, domains: PH 204-307, PANTHER xrefs in UniProt: NONE'
  - statement: SF399 is a real ACAP subfamily rather than a domain-less outlier group - its other
      reviewed member is C. elegans cnt-1, a bona fide Arf-GAP with ANK and PH domains.
    supporting_text: '- `Q9XXH8` cnt-1 (Caenorhabditis elegans), 826 aa - Arf-GAP with ANK repeat and PH domain-containing protein cnt-1'
  - statement: Every source with a resolvable UniProt accession holds its own experimental evidence for
      the term it donates, so none of these transfers is an inference recycling another inference.
    supporting_text: '| `dictyBase:DDB_G0279649` | Q54WI0 | GO:0030036 | IBAx1, IGIx1, IMPx1 (n=3) | **yes** |'
  - statement: PANTHER node PTN001142372 is pan-eukaryotic, propagating the same four terms across
      plants, a charophyte alga, fungi and vertebrates.
    supporting_text: '- QuickGO reports 1000 annotations citing this node.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Reproducible analysis written for this review, in response to PR feedback that the
      blow domain-architecture and MGI:MGI:2153589 claims were load-bearing but had no in-repo artifact.
      The script resolves every WITH/FROM token from primary APIs (UniProt, Alliance of Genome
      Resources, WormBase, FlyBase, PANTHER, QuickGO), reports domain architectures, and asks of each
      source what evidence it holds for the term it donates. Nothing is hardcoded; unresolvable tokens
      are reported as UNRESOLVED rather than guessed, and there are none in the current output. All five
      quotes above were grep-verified against the generated file.
- id: file:human/ACAP2/ACAP2-deep-research-affinage.md
  title: Affinage mechanistic annotation for ACAP2 (human)
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: LOW_QUALITY
    review_notes: 'Machine-fetched Affinage record; self_evaluation_pairwise win, faith 100%. Its value here was
      the reference list rather than the prose. It surfaced PMID:22045739, PMID:22344257,
      PMID:24600047, PMID:25694427, PMID:25853217, PMID:16806385 and PMID:40251363, four of which
      materially shaped this review, and none of which is cited by any GOA row. The prose is unreliable
      at residue resolution, which is the reason for the LOW_QUALITY mark: it presents Asn-610 and
      Asn-691 as residues "within the minimal Rab35-binding domain of ACAP2" without noting that
      PMID:25694427''s numbering does not correspond to the human sequence, whose ANK repeats span
      640-735 and whose RAB35-contact mutagenesis is at Asp-721, Arg-727, Met-731 and Asp-756. Its own
      GO grounding (catalytic activity acting on a protein, molecular function regulator activity) is
      also too coarse to import. No mechanistic or residue-level claim in this review is sourced from
      it.'
core_functions:
- description: ARF6 inactivation in the cell periphery. ACAP2's ArfGAP domain, spanning residues 399-520
    with a C4-type zinc finger and the catalytic arginine at 442, accelerates GTP hydrolysis on ARF6 in
    preference to ARF1 and ARF5, and R442Q abolishes the activity. Catalysis is conditional on membrane
    lipid - it needs phosphatidylinositol 4,5-bisphosphate together with phosphatidic acid - so ACAP2 is
    active only where those lipids are, on the tubular ARF6 endosome and at plasma-membrane protrusions
    and ruffles, and not at the Golgi. Because ARF6 drives cortical actin remodelling and the recycling
    route back to the plasma membrane, the consequence of ACAP2 acting is that ARF6-dependent protrusion
    and ruffling are damped and the recycling itinerary is regulated. GO cannot express the substrate
    identity, since the substrate-specific GAP terms were merged into GO:0005096, so ARF6 is recorded
    in the substrates slot below and as a has_input extension on the GO:0005096 IDA row rather than
    in the term itself.
  molecular_function:
    id: GO:0005096
    label: GTPase activator activity
  substrates:
  - id: UniProtKB:P62330
    label: ARF6
  directly_involved_in:
  - id: GO:0032013
    label: negative regulation of ARF protein signal transduction
  - id: GO:0032456
    label: endocytic recycling
  - id: GO:0032956
    label: regulation of actin cytoskeleton organization
  locations:
  - id: GO:0005886
    label: plasma membrane
  - id: GO:0010008
    label: endosome membrane
  - id: GO:0001726
    label: ruffle
  supported_by:
  - reference_id: PMID:11062263
    supporting_text: In vitro, ACAP1 and ACAP2 preferred Arf6 as a substrate, rather than Arf1 and Arf5,
      more so than did ASAP1.
  - reference_id: PMID:11062263
    supporting_text: '[R448Q]ACAP1 and [R442Q]ACAP2 had no detectable activity using Arf6 as a substrate'
  - reference_id: PMID:11062263
    supporting_text: Coexpression of Arf6 with either ACAP inhibited the formation of protrusions in
      response to AlF4 treatment
  - reference_id: PMID:11062263
    supporting_text: In addition, ACAP1 and ACAP2 were recruited to peripheral, tubular membranes, where
      activation of Arf6 occurs to allow membrane recycling back to the plasma membrane.
  - reference_id: file:human/ACAP2/ACAP2-uniprot.txt
    supporting_text: 'CC   -!- ACTIVITY REGULATION: GAP activity stimulated by phosphatidylinositol'
- description: RAB35 effector recognition, the recruitment arm of the same mechanism and a separable
    module of the protein. The third ankyrin repeat plus a following extended helix, within residues
    601-770, binds GTP-loaded RAB35 - a binding mode not previously described for either Rabs or ankyrin
    repeats - and the interaction is direct, nucleotide-state-dependent, and exclusive, since ACAP2
    recognises RAB35 and none of the other roughly sixty mammalian Rabs. Point mutations at Asp-721,
    Arg-727, Met-731 and Asp-756 grade or abolish the binding. ACAP2 does not act on RAB35
    catalytically, so this is recognition rather than regulation - RAB35 delivers ACAP2 to a membrane,
    and the ArfGAP domain then does the work. This is what makes ACAP2 a coincidence detector for an
    active Rab and a permissive lipid environment. Recorded as a second core function, with a binding
    term as its molecular_function, deliberately and with reservations. A binding term is normally a
    poor core function - it names no activity - and this could instead be folded into core function 1
    as a targeting determinant. It is kept separate because it is a distinct, structurally delimited
    module of the protein (residues 601-770, crystallised independently of the catalytic domain) whose
    defining property, nucleotide-state-specific recognition of one Rab out of about sixty, is not a
    property of the ArfGAP domain and would disappear if merged. What GO lacks is a non-binding term
    for effector recognition - an activity of the form "binds the active conformation of a specific
    GTPase and thereby localises an activity" - which is the same ontology gap as the missing
    substrate-specific GAP terms, seen from the other side.
  molecular_function:
    id: GO:0031267
    label: small GTPase binding
  locations:
  - id: GO:0005886
    label: plasma membrane
  - id: GO:0010008
    label: endosome membrane
  supported_by:
  - reference_id: PMID:30905672
    supporting_text: In the Rab35/ACAP2 complex structure, Rab35 binds to the terminal ankyrin repeat
      and a C-terminal extended
  - reference_id: PMID:25694427
    supporting_text: Centaurin-β2 is the only Rab35-binding protein reported thus far that exclusively
      recognizes Rab35 and does not recognize any of the other 59 Rabs identified in mammals
  - reference_id: file:human/ACAP2/ACAP2-uniprot.txt
    supporting_text: 'CC   -!- DOMAIN: The ANK domains are required for interaction with RAB35.'
  - reference_id: file:human/ACAP2/ACAP2-uniprot.txt
    supporting_text: 'CC       (ARF6). Doesn''t show GAP activity for RAB35 (PubMed:30905672).'
  - reference_id: file:human/ACAP2/ACAP2-uniprot.txt
    supporting_text: 'CC       interaction is direct and probably recruits ACAP2 to membranes'
suggested_questions:
- question: GO merged the nine substrate-specific GTPase activator terms (including GO:0008060 ARF
    GTPase activator activity) into GO:0005096, and merged GO:0017137 Rab GTPase binding into
    GO:0031267, leaving neither term with substrate-specific children. For a protein like ACAP2, whose
    entire identity is that of an ARF6 GAP which is not a RAB35 GAP but binds RAB35 exclusively, is the
    intended replacement a has_input annotation extension, a GO-CAM, or both - and should GOA rows
    carrying GO:0005096 without such an extension be treated as incomplete?
  experts: []
- question: Should ACAP2 carry an annotation to FcgammaR-mediated phagocytosis or phagocytic cup
    formation? PMID:22045739 shows GTP-RAB35-dependent recruitment of ACAP2 to the phagocytic cup, but
    the abstract states only that the work is in macrophages and the cached record is abstract-only, so
    the species could not be established and no transfer was proposed here. A curator with the full
    text could settle whether this is a human annotation, a mouse annotation transferable by ISS, or
    neither.
  experts: []
- question: Is the pro-apoptotic activity of ACAP2 reproducible, and is it separable from its ARF6-GAP
    function? PMID:25853217 reports that ACAP2 knockdown blocks 5-fluorouracil-induced apoptosis in
    human cancer cells and that ACAP2 has the same phosphoinositide-binding pattern as tCNT-1, yet also
    notes that ACAP2 is not a caspase substrate - so the mechanism established for the worm protein
    cannot be the mechanism here. Nothing in the annotation record reflects this activity.
  experts: []
- question: What is the functional meaning of the ACAP2-ACAP3 interaction? It is recovered by two
    orthogonal proteome-scale datasets and UniProt records NbExp=4, and both proteins are ARF6 GAPs with
    N-terminal BAR domains, but no interface, stoichiometry or functional consequence has been reported.
    Do ACAP paralogs hetero-oligomerise through their BAR domains, and does that pool their recruitment
    determinants?
  experts: []
- question: PANTHER assigns Drosophila blow (blown fuse) to PTHR23180 (CENTAURIN/ARF) as subfamily
    SF399 even though the protein has only a PH domain - no BAR, no ArfGAP catalytic domain, no ankyrin
    repeats - and its experimental actin annotation comes from myoblast fusion. Should a family member
    lacking the family's catalytic domain contribute to IBA support sets for process terms of the
    catalytic members?
  experts: []
suggested_experiments:
- hypothesis: ACAP2's PH domain is the phosphoinositide sensor that gates its ARF6-GAP activity, and
    the lipid it reads is PI(4,5)P2.
  description: Express and purify the isolated ACAP2 PH domain (residues 266-361) and the full-length
    protein, and measure binding to a defined phosphoinositide panel by liposome flotation or surface
    plasmon resonance rather than by protein-lipid overlay, which is prone to false positives. In
    parallel, mutate the canonical basic residues of the PH-domain binding pocket and ask whether the
    PIP2 dependence of GAP activity on ARF6 is lost while catalysis on a soluble substrate is retained.
    This would convert the current inference, that a PH domain plus lipid-dependent activity implies
    PH-mediated lipid binding, into a measurement, and would let the proposed GO:0035091 annotation be
    replaced with a specific child term.
  experiment_type: in vitro lipid binding and enzymology
- hypothesis: Endogenous ACAP2 restrains ARF6 activity at the plasma membrane, so that loss of ACAP2
    increases the ARF6-GTP pool and enhances ARF6-dependent protrusion.
  description: Knock out or degron-tag ACAP2 in a human cell line and measure the ARF6-GTP fraction by
    an effector pull-down or a GTP-ARF6 conformational biosensor, alongside quantification of membrane
    ruffling and protrusion. Rescue with wild-type ACAP2 and with the R442Q GAP-dead mutant. The
    existing cellular evidence for the process is entirely gain-of-function (overexpression plus a
    point mutant), which is why the proposed GO:0032013 annotation is IMP from an overexpression
    experiment; a loss-of-function result would upgrade it and would also settle whether the paralogs
    ACAP1 and ACAP3 buffer the loss.
  experiment_type: loss-of-function cell biology
- hypothesis: ACAP2 and ACAP3 form a heterodimer through their N-terminal BAR domains.
  description: Co-express tagged ACAP2 and ACAP3 BAR domains (ACAP2 residues 1-226) and test for
    heterodimer formation by size-exclusion chromatography with multi-angle light scattering, then
    validate in cells with a split-luciferase or proximity-ligation assay on endogenous protein. Ask
    whether a BAR-interface mutant loses the interaction without losing ARF6-GAP activity, and whether
    ACAP3 co-recruits with ACAP2 to GTP-RAB35 sites. A positive result would replace the two
    uninformative protein-binding rows with a defensible dimerisation function.
  experiment_type: biophysical reconstitution and cell-based interaction assay
- hypothesis: RAB35 binding and phosphoinositide binding are jointly required for ACAP2 recruitment,
    making ACAP2 a coincidence detector rather than a simple RAB35 effector.
  description: Compare recruitment of wild-type ACAP2 with the RAB35-binding-deficient mutant
    (Asp-721/Arg-727/Met-731/Asp-756 substitutions) and with a PH-domain lipid-binding mutant, in cells
    where PI(4,5)P2 can be acutely depleted with a recruitable phosphatase. If either lesion alone
    abolishes membrane targeting, the two inputs are ANDed; if recruitment survives loss of one, RAB35
    binding and lipid binding are redundant recruitment routes. This distinguishes the
    coincidence-detector model asserted in the core-function description from the simpler linear
    RAB35-recruitment model.
  experiment_type: live-cell recruitment with acute lipid depletion
