- term:
    id: GO:1990090
    label: cellular response to nerve growth factor stimulus
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: involved_in
  review:
    summary: 'Transferred from rat Acap2 (UniProtKB:Q5FVC7), and the rat evidence is solid and
      species-appropriate. The RAB35-ACAP2-ARF6 relay was worked out in NGF-stimulated rat PC12 cells,
      where RAB35 accumulates on ARF6-positive endosomes after NGF and recruits ACAP2 there, and where
      binding-deficient mutants of either partner fail to support neurite outgrowth. So the transfer is
      a legitimate ortholog transfer of a real finding.


      Kept as non-core rather than accepted because it describes one deployment of ACAP2 rather than
      what ACAP2 is. NGF responsiveness is a property of PC12 cells and of TrkA-expressing neurons; the
      same ACAP2 module is used in FcgammaR phagocytosis in macrophages and as a brake on
      oligodendrocyte differentiation, neither of which involves NGF. The invariant is
      RAB35-dependent recruitment and ARF6 inactivation; the NGF context is downstream of which cell
      type the protein happens to be in.'
    action: KEEP_AS_NON_CORE
    reason: A real, correctly transferred finding, but cell-type-specific context rather than a core
      property of the protein - ACAP2 performs the same RAB35-to-ARF6 relay in settings that have
      nothing to do with NGF.
    supported_by:
