    - PMID:24600047
- term:
    id: GO:0035091
    label: phosphatidylinositol binding
  evidence_type: IDA
  original_reference_id: PMID:25853217
  qualifier: enables
  review:
    summary: 'Proposed new annotation. ACAP2 has no lipid-binding annotation at all, which is a
      conspicuous absence for a protein whose catalytic activity is lipid-gated and which carries a PH
      domain at 266-361. Two independent strands support it. First the enzymology - ACAP2''s GAP
      activity is not merely faster in the presence of lipid but requires it, with half-maximal
      activity at 10-20 microM PIP2 in 380 microM phosphatidic acid, which UniProt records as an
      ACTIVITY REGULATION statement with an ECO:0000269 tag. Second a direct binding measurement -
      PMID:25853217 reports that ACAP2 has an identical phosphoinositide-binding pattern to that of
      tCNT-1, the caspase-cleaved form of its C. elegans counterpart.


      The generic parent term is used on purpose. That cache entry is abstract-only, so the individual
      phosphoinositide species and the assay format cannot be read off it, and GO:0035091 is defined to
      cover phosphatidylinositol and its phosphorylated derivatives, which is exactly the resolution
      the evidence supports. A child such as GO:0005546 (PI(4,5)P2 binding) would be a guess, because
      the PIP2 dependence in PMID:11062263 is a property of the enzymatic activity, and attributing it
      to direct PH-domain binding would be reading a mechanism into a domain name. Independent, weaker
      corroboration comes from a PI(3)P affinity proteomics screen that recovered ACAP2, though that
      screen pulled 681 proteins and is not on its own a basis for annotation.


      To be precise about what carries the annotation and what only motivates it: the IDA rests solely
      on PMID:25853217, the one source that reports a binding measurement. The lipid dependence of
      catalysis, from PMID:11062263 and the UniProt ACTIVITY REGULATION block, establishes that ACAP2
      works only in the presence of PIP2 and phosphatidic acid, which is why the absence of any
      lipid-binding annotation is conspicuous - but a lipid that gates an enzyme need not be bound by
      that enzyme, so those sources are context and are deliberately not listed as support below.'
    action: NEW
    reason: A protein whose GAP activity is strictly lipid-dependent and which has a direct
      phosphoinositide-binding measurement in the literature carries no lipid-binding annotation. The
      parent term is chosen because the specific lipid species cannot be established from the available
      evidence. The annotation rests on PMID:25853217 alone; the activity-regulation evidence is
      motivation, not support.
    supported_by:
    - reference_id: PMID:25853217
      supporting_text: We report here that ACAP2, a homolog of C. elegans CNT-1, has a pro-apoptotic
        function and an identical phosphoinositide-binding pattern to that of tCNT-1, despite not being
        an apparent target of caspase cleavage.
    additional_reference_ids:
    - PMID:11062263
    - PMID:23416715
