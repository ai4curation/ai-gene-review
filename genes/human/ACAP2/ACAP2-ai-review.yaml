    summary: 'This one should not stay as protein binding. The partner is UniProtKB:Q15286, RAB35, and
      the interaction is about as well characterised as a protein-protein interaction gets - a
      high-resolution crystal structure of the complex (PDB 6IF3, 1.50 A, ACAP2 residues 601-770),
      RAB35 engaging the terminal ankyrin repeat and a following extended helix, four point mutants
      that graded the binding, and exclusive specificity for RAB35 among the mammalian Rab family.
      Recording that as "protein binding" discards all of it.


      Two replacements are proposed rather than one because they capture different, both-verifiable
      facts. GO:0031267 records the identity of the partner as a small GTPase. GO:0030742 records the
      nucleotide dependence - ACAP2 binds the GTP-loaded form, which is what makes it an effector
      rather than a generic interactor, and, unusually, it binds without acting on it, since ACAP2 has
      no GAP activity towards RAB35.'
    action: MODIFY
