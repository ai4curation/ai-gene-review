id: Q15057
gene_symbol: ACAP2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'ACAP2 (centaurin-beta-2) is a multidomain GTPase-activating protein that terminates
  ARF6 signalling in the cell periphery. Its ARF-GAP domain, with a C4-type zinc finger and the
  catalytic arginine at position 442, accelerates GTP hydrolysis on ADP-ribosylation factor 6 in
  preference to ARF1 and ARF5, and that catalysis is gated by membrane lipid - it requires
  phosphatidylinositol 4,5-bisphosphate together with phosphatidic acid, so ACAP2 is only active
  where those lipids are. A separate module at the other end of the protein, the third of three
  ankyrin repeats plus a following extended helix, binds the GTP-loaded form of the small GTPase
  RAB35 - and only RAB35, none of the other roughly sixty mammalian Rabs. ACAP2 is not a GAP for
  RAB35. The two modules make ACAP2 a coincidence device - RAB35 recruits it onto a membrane, the
  local phosphoinositide licenses its catalysis, and ARF6 is switched off at that spot. Because
  ARF6 drives cortical actin remodelling and the fast recycling route back to the plasma membrane,
  the consequence of ACAP2 arriving is that ARF6-dependent membrane protrusion and ruffling are
  damped. At steady state most of the protein is soluble, with pools on the tubular ARF6 endosome
  and on plasma-membrane protrusive buds and ruffles; it does not affect the Golgi. The same
  RAB35-ACAP2-ARF6 relay has been captured in several settings - nerve-growth-factor-induced neurite
  outgrowth, formation of the actin-dependent phagocytic cup during FcgammaR-mediated phagocytosis,
  and oligodendrocyte differentiation and myelination, where ACAP2 acts as a brake. A separate line
  of work identifies ACAP2 as the human counterpart of Caenorhabditis elegans CNT-1 and reports a
  pro-apoptotic activity and direct phosphoinositide binding, although ACAP2 itself is not cleaved
  by caspases. Two close paralogs, ACAP1 and ACAP3, share the same domain architecture and ARF6
  preference; ACAP2 and ACAP3 are recovered together in proteome-scale interaction datasets.'
