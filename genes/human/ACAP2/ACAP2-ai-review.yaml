- id: PMID:22045739
  title: Rab35 regulates phagosome formation through recruitment of ACAP2 in macrophages
    during FcγR-mediated phagocytosis.
  findings:
  - statement: GTP-RAB35 recruits ACAP2, an ARF6 GAP, to the forming phagocytic cup.
    supporting_text: Furthermore, GTP-Rab35-dependent recruitment of ACAP2, an ARF6 GTPase-activating
      protein, was shown in the phagocytic cup formation.
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Cached title matches. Independent demonstration of the RAB35-to-ACAP2-to-ARF6 relay,
      cited in support of the proposed GO:0032013 annotation. Deliberately NOT used to propose a
      phagocytosis annotation, because the abstract says only that the work is in macrophages and the
      cache is abstract-only, so the species is not stated and an ISS transfer cannot be justified from
      it. The gap is recorded in suggested_questions instead.
- id: PMID:22344257
  title: Rab35 regulates Arf6 activity through centaurin-β2 (ACAP2) during neurite outgrowth.
  findings:
  - statement: ACAP2 acts both as a RAB35 effector and as an ARF6 GAP during neurite outgrowth of PC12
      cells.
    supporting_text: Here we show that centaurin-β2 (also known as ACAP2) functions both as a Rab35
      effector and as an Arf6-GTPase-activating protein (GAP) during neurite outgrowth of PC12 cells.
  - statement: NGF drives RAB35 onto ARF6-positive endosomes, and ACAP2 follows in a RAB35-dependent
      manner.
    supporting_text: We found that Rab35 accumulates at Arf6-positive endosomes in response to nerve
      growth factor (NGF) stimulation and that centaurin-β2 is recruited to the same compartment in a
      Rab35-dependent manner.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached title matches. The experiments are in rat PC12 cells, which is the donor
      evidence behind the rat Acap2 annotations that GOA transfers to human by ISS - so it is the paper
      that makes the GO:1990090 ISS row traceable, and the reason that row is judged real but
      cell-type-specific.
- id: PMID:24600047
  title: Rab35, acting through ACAP2 switching off Arf6, negatively regulates oligodendrocyte
    differentiation and myelination.
  findings:
  - statement: ACAP2 is the RAB35 effector that switches ARF6 off, and the pair acts as a brake on
      oligodendrocyte differentiation.
    supporting_text: We show that Rab35 and its effector, ACAP2, a GTPase-activating protein that
      switches off Arf6 activity, negatively regulate oligodendrocyte morphological differentiation.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Cached title matches and the cache has full text. Cited for the ARF6-inactivation
      relationship supporting the proposed GO:0032013 annotation, not for the differentiation
      phenotype, which is in rodent oligodendrocyte-lineage cells and so would need an ortholog-based
      transfer rather than a human annotation.
- id: PMID:25694427
  title: Structure-function analyses of the small GTPase Rab35 and its effector protein
    centaurin-β2/ACAP2 during neurite outgrowth of PC12 cells.
  findings:
  - statement: ACAP2 recognises RAB35 exclusively, and none of the other 59 mammalian Rabs.
    supporting_text: Centaurin-β2 is the only Rab35-binding protein reported thus far that exclusively
      recognizes Rab35 and does not recognize any of the other 59 Rabs identified in mammals
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached title matches. Establishes the specificity that GO:0031267 cannot express,
      since GO:0017137 Rab GTPase binding is now a secondary id of GO:0031267 and that term has no
      children. A caution is recorded in the notes file - the Asn-610/Asn-691 residues named in this
      paper are not on the same numbering as the human mutagenesis in PMID:30905672 (Asp-721, Arg-727,
      Met-731, Asp-756), so they must not be quoted as human positions. The affinage record does quote
      them as ACAP2 positions, which is why no residue-level claim in this review is sourced from it.
- id: PMID:25853217
  title: Human ACAP2 is a homolog of C. elegans CNT-1 that promotes apoptosis in cancer
    cells.
  findings:
  - statement: ACAP2 has a pro-apoptotic function and the same phosphoinositide-binding pattern as
      tCNT-1, but is not itself a caspase substrate.
    supporting_text: We report here that ACAP2, a homolog of C. elegans CNT-1, has a pro-apoptotic
      function and an identical phosphoinositide-binding pattern to that of tCNT-1, despite not being
      an apparent target of caspase cleavage.
  - statement: Knockdown of ACAP2 in human cancer cells blocks 5-fluorouracil-induced apoptosis.
    supporting_text: We show that knockdown of ACAP2 blocks apoptosis in cancer cells in response to
      the chemotherapeutic antimetabolite 5-fluorouracil
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Cached title matches. Used for one claim only, that ACAP2 binds phosphoinositides,
      which is stated in the abstract. Abstract-only, so neither the lipid species nor the assay format
      can be checked, which is why the proposed annotation uses the parent term GO:0035091 rather than
      a specific phosphoinositide child. The apoptosis result is deliberately NOT proposed as an
      annotation, being a single unreplicated study whose own authors note that ACAP2 is not
      caspase-cleaved, so the tCNT-1 mechanism does not carry over. Recorded as a knowledge gap and an
      experiment instead.
- id: PMID:16806385
  title: Vaccinia virus K1L protein supports viral replication in human and rabbit
    cells through a cell-type-specific set of its ankyrin repeat residues that are
    distinct from its binding site for ACAP2.
  findings:
  - statement: The ankyrin-repeat residues K1L needs for host-range function are distinct from those it
      uses to bind ACAP2, so ACAP2 binding is separable from the host-range activity.
    supporting_text: These substitutions, however, did not affect K1L's ability to bind ACAP2, a
      GTPase-activating protein for ARF6.
  - statement: The authors conclude that the host-range function of K1L is mediated by factors distinct
      from ACAP2.
    supporting_text: Our data support the hypothesis that surface residues of a few consecutive K1L
      ANKs mediate the host-range function by interacting with protein factors that are distinct from
      ACAP2.
  full_text_unavailable: true
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Cached title matches; cited by the affinage record, so adjudicated here rather than
      left unassessed. It is a real ACAP2 interaction but the paper's conclusion is that the host-range
      function of K1L is separable from ACAP2 binding, so it supports no inference about ACAP2's own
      function and is not used for any annotation. Not in GOA either.
- id: PMID:40251363
  title: RNF126 Promotes Ovarian Cancer Progression by Reprogramming Lipid Metabolism
    Through Degradation of ACAP2.
  findings:
  - statement: ACAP2 is a ubiquitination substrate of RNF126, and its abundance is negatively regulated
      by RNF126.
    supporting_text: Mechanistically, ACAP2 was identified as a ubiquitination substrate of RNF126, and
      its expression was negatively regulated by RNF126.
  full_text_unavailable: true
  reference_review:
    relevance: LOW
    correctness: UNVERIFIED
    review_notes: Cached title matches the citation, and it is adjudicated here because the affinage
      record cites it. Not used for any annotation, because ACAP2 is the substrate rather than the
      agent, so the finding concerns ACAP2's regulation and not its function, and it is a single 2026
      report that has not been independently replicated. Marked UNVERIFIED rather than VERIFIED because
      only the abstract is available and the mechanistic claims were not checked.
- id: PMID:23416715
  title: The PI(3)P interactome from a colon cancer cell.
  findings:
  - statement: A PI(3)P affinity-proteomics screen recovered 681 proteins, ACAP2 among them.
    supporting_text: Affinity/LC/MS/MS experiments allowed the identification of 681 proteins/protein
