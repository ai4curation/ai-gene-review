    review_notes: Cached title matches the citation and the cache carries full text, not just the
      abstract. This is the founding characterisation of ACAP2 and the source of three of its GOA
      annotations (GO:0005096 IDA, GO:0001726 IDA, GO:0030029 IDA). Every quantitative claim used here
      was read from the Results, including the HeLa (human) provenance of the ARF6 protrusion
      experiments, which matters for whether the process evidence is human.
