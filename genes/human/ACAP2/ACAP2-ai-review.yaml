- term:
    id: GO:0005096
    label: GTPase activator activity
  evidence_type: IDA
  original_reference_id: PMID:11062263
  qualifier: enables
  extensions:
  - predicate: RO:0002233
    term:
      id: UniProtKB:P62330
      label: ARF6
  review:
    summary: 'The primary experimental anchor for the whole review, and the best-supported annotation
      ACAP2 has. Recombinant ACAP2 accelerates GTP hydrolysis on ARF6 in vitro with measured preference
      over ARF1 and ARF5; the activity is abolished by R442Q, the conserved arginine of the ArfGAP
      domain; and it is lipid-gated, needing PIP2 together with phosphatidic acid, with half-maximal
      activity at 10-20 microM PIP2 in 380 microM PA. IDA is the right code here, because this is a
      direct in vitro assay on purified protein, unlike the cellular experiments in the same paper,
      which are overexpression-based.


      One curation observation worth recording, since it bears on whether these IDAs are over-called.
      PMID:11062263 assayed ACAP1 and ACAP2 side by side in the same figures, and by the paper''s own
      account ACAP1 was the more potent of the two in the protrusion assay. Yet QuickGO returns three
      annotations from this reference for ACAP2 (GO:0005096, GO:0030029, GO:0001726, all IDA) and zero
      for ACAP1 (UniProtKB:Q15027). The asymmetry is a curation artifact rather than a biological
      difference; ACAP2''s IDAs are not over-called, they are simply the half of a symmetric experiment
      that got recorded.


      Left as GO:0005096 only because no more specific term exists; GO:0008060 "ARF GTPase activator
      activity" has been merged into it. The measured substrate preference, which is the single most
      informative biochemical fact about this protein, therefore has to be captured outside the term -
      which is what the RO:0002233 has_input extension on this row does, mirrored by
      core_functions[0].substrates. Without that, a downstream consumer of this file would see only
      "GTPase activator activity" and lose the one fact the assay was designed to establish.'
    action: ACCEPT
    supported_by:
    - reference_id: PMID:11062263
      supporting_text: In vitro, ACAP1 and ACAP2 preferred Arf6 as a substrate, rather than Arf1 and
        Arf5, more so than did ASAP1.
    - reference_id: PMID:11062263
      supporting_text: '[R448Q]ACAP1 and [R442Q]ACAP2 had no detectable activity using Arf6 as a substrate'
    - reference_id: PMID:11062263
      supporting_text: ACAP1 and ACAP2 showed similar phospholipid dependencies when Arf6 was used as a
        substrate.
- term:
    id: GO:0030029
    label: actin filament-based process
  evidence_type: IDA
  original_reference_id: PMID:11062263
  qualifier: acts_upstream_of_or_within
  review:
    summary: 'The observation is sound but the term is a grandparent-level placeholder. What was
      actually shown is that ACAP2 suppresses two specific actin structures - PDGF-induced dorsal
      ruffles in fibroblasts, and ARF6/AlF4-induced actin-rich protrusions in human HeLa cells, where
      ACAP2 halved the fraction of protruding cells - and that both effects need GAP activity. That is
      a regulatory relationship, so GO:0032956 regulation of actin cytoskeleton organization states it
      properly, and the qualifier should become involved_in, since ACAP2 directly performs the
      regulation rather than merely acting somewhere upstream of it.


      One evidence-code point. These are overexpression and point-mutant experiments, so IMP would be
      the correct code for the process rather than IDA. IDA is right for the in vitro GAP assay in the
      same paper, but not for this cellular phenotype. Flagged rather than actioned, since the action
      vocabulary here covers terms and not codes.'
    action: MODIFY
    reason: GO:0030029 is too general and, more importantly, has the wrong role - ACAP2 regulates actin
      organization from upstream as an ARF6 GAP rather than participating in an actin filament-based
      process. GO:0032956 with involved_in states the demonstrated relationship. The supporting
      experiments are overexpression/point-mutant based, so IMP rather than IDA would fit the process.
    proposed_replacement_terms:
    - id: GO:0032956
      label: regulation of actin cytoskeleton organization
    supported_by:
    - reference_id: PMID:11062263
      supporting_text: Overexpression of either ACAP inhibited the formation of PDGF-induced dorsal ruffles
    - reference_id: PMID:11062263
      supporting_text: ACAP2 reduced the number of cells generating protrusions by 50%.
    - reference_id: PMID:11062263
      supporting_text: The effects of ACAP1 and ACAP2 were dependent on GAP activity.
- term:
    id: GO:0032456
    label: endocytic recycling
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: involved_in
  review:
    summary: 'Curator-judged transfer from UniProtKB:Q5FVC7, which resolves to rat Acap2 - the true
      ortholog, so this is a legitimate ortholog transfer and not a paralog leak. It is also supported
      in human cells independently of the transfer, since ACAP2 is recruited to the peripheral tubular
      membranes on which ARF6 is activated to drive recycling back to the plasma membrane, and ARF6 is
      the GTPase whose recycling function ACAP2 terminates. RAB35, which recruits ACAP2, is itself a
      rate-limiting regulator of the fast recycling pathway. Core.


      Why this is kept as participation while the actin rows are moved to a regulation term, since the
      two look superficially alike. The difference is how many steps separate ACAP2 from the process.
      For actin, ACAP2 never touches the cytoskeleton; ARF6-GTP recruits downstream effectors which
      remodel actin, so ACAP2 is at least two steps removed and the observable is a modulation of rate
      and extent - the signature of a regulator. For recycling, the ARF6 GTPase cycle is not upstream
      machinery, it is part of the trafficking step itself: nucleotide hydrolysis has to occur on the
      recycling tubule for the round to complete, and ACAP2 is the enzyme that performs it there. A
      GEF or GAP that turns over the GTPase of a trafficking step is conventionally annotated as
      involved_in that step, in the same way a Rab GAP is treated as part of its transport process
      rather than as its regulator. The direction of effect also differs - ACAP1, the paralog, is
      required for transferrin-receptor recycling, so a signed regulation term would be hard to justify
      here in a way it is not for the actin phenotype, where the observed effect is unambiguously
      suppression.'
    action: ACCEPT
    supported_by:
    - reference_id: PMID:11062263
      supporting_text: In addition, ACAP1 and ACAP2 were recruited to peripheral, tubular membranes,
        where activation of Arf6 occurs to allow membrane recycling back to the plasma membrane.
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: UniProtKB:Q5FVC7
        source_label: rat Acap2
        source_status: SUPPORTS_TRANSFER
        comment: Verified as ACAP2_RAT, the true ortholog. Its UniProt FUNCTION block is identical to
          the human one (ARF6 GAP, no RAB35 GAP activity), and it carries GO:0032456 by IMP in its own
          right, so this is a transfer of experimental evidence rather than of another inference.
