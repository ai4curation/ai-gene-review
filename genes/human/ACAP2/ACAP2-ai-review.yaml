    supporting_text: Through affinity-purification mass spectrometry, we have created two proteome-scale,
      cell-line-specific interaction networks.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Cached title matches. Correctly cited proteome-scale AP-MS resource. Its ACAP2 result
      (partner UniProtKB:Q96P50, ACAP3) is one of two orthogonal recoveries of that pair, so the
      interaction is probably real; the row is marked over-annotated because the term is uninformative,
