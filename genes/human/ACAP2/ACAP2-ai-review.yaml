- id: PMID:11062263
  title: ACAPs are arf6 GTPase-activating proteins that function in the cell periphery.
  findings:
  - statement: ACAP1 and ACAP2 are ARF6 GTPase-activating proteins.
    supporting_text: Here, we report the identification and characterization of two Arf6 GAPs, ACAP1
      and ACAP2.
  - statement: The GAP activity has genuine substrate preference for ARF6 over ARF1 and ARF5.
    supporting_text: In vitro, ACAP1 and ACAP2 preferred Arf6 as a substrate, rather than Arf1 and
      Arf5, more so than did ASAP1.
  - statement: GAP activity requires PIP2 together with phosphatidic acid.
    supporting_text: ACAP1 and ACAP2 showed similar phospholipid dependencies when Arf6 was used as a
      substrate.
  - statement: The conserved arginine of the ArfGAP domain is essential; R442Q abolishes ACAP2 activity.
    supporting_text: '[R448Q]ACAP1 and [R442Q]ACAP2 had no detectable activity using Arf6 as a substrate'
  - statement: ACAP2 overexpression suppresses PDGF-induced dorsal ruffles, and the protein is recruited
      to the ruffles that do form even when GAP-dead.
    supporting_text: The mutant ACAPs, like mutant ASAP1, were efficiently recruited to the actin-rich
      ruffles
  - statement: In human HeLa cells ACAP2 suppresses ARF6-dependent actin-rich protrusions, GAP-dependently.
    supporting_text: Coexpression of Arf6 with either ACAP inhibited the formation of protrusions in
      response to AlF4 treatment
  - statement: ACAP2 is largely cytosolic at steady state with a pool on tubular ARF6 endosomes.
    supporting_text: In untreated cells, although ACAP1 and ACAP2 were primarily cytosolic, they could
      be observed on tubular portions of the Arf6 endosomal compartment
  - statement: The ARF6 tubules ACAP2 occupies are the route for recycling back to the plasma membrane.
    supporting_text: In addition, ACAP1 and ACAP2 were recruited to peripheral, tubular membranes, where
      activation of Arf6 occurs to allow membrane recycling back to the plasma membrane.
  - statement: The effect is confined to the cell periphery; the Golgi is unaffected.
    supporting_text: Neither ACAP1, ACAP2, nor ASAP1 (Brown et al. 1998) caused changes in the
      morphology of the Golgi apparatus
  reference_review:
    relevance: HIGH
