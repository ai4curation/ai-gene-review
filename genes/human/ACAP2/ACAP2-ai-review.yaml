- id: PMID:35271311
  title: 'OpenCell: Endogenous tagging for the cartography of human cellular organization.'
  findings:
  - statement: Endogenous-tagging interactome and localisation atlas, measuring protein at near-native
      abundance; independently recovers the ACAP2-ACAP3 interaction.
    supporting_text: Genome-edited cells enable to examine protein function at near-native expression
