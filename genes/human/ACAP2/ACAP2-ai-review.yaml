- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: located_in
  review:
    summary: The conclusion happens to be true - ACAP2 is largely soluble at steady state, becoming
      membrane-associated when recruited - but the inference behind it is poor. The mapping comes from
      IPR004148, the BAR domain, and a BAR domain is a membrane-curvature-binding module; deducing
      cytoplasmic residence from it says nothing a curator would want. Kept because it is not
      incorrect, but non-core, because the informative locations for this protein are the plasma
      membrane, the ruffle and the endosome membrane, where the GAP actually works.
    action: KEEP_AS_NON_CORE
    reason: Correct but uninformative, and derived from a signature (BAR) whose implication is membrane
      binding rather than cytoplasmic residence. The specific membrane locations already carry the
      curatorially useful information.
    supported_by:
    - reference_id: PMID:11062263
      supporting_text: In untreated cells, although ACAP1 and ACAP2 were primarily cytosolic, they could
        be observed on tubular portions of the Arf6 endosomal compartment
