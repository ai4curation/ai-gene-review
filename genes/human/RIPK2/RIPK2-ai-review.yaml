  review:
    summary: JUN kinase kinase kinase activity (IBA).
    action: REMOVE
    reason: Mis-propagated IBA. RIPK2 belongs to the RIP kinase family and is a CARD-adaptor autokinase;
      it is not a MAP3K that phosphorylates MKK4/MKK7 to activate JNK. JNK/p38 activation downstream of
      NOD2 is executed by TAK1 (MAP3K7), recruited to ubiquitinated RIPK2. This is an over-propagated
      electronic/phylogenetic inference argued against on biological grounds.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN001147669
        comment: Ancestral node propagating JUN kinase kinase kinase (MAP3K) activity; RIPK2 is a RIP-family
          CARD adaptor autokinase, not a JNKKK. JNK/p38 activation downstream of NOD2 is executed by TAK1,
          not RIPK2.
