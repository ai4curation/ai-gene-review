id: O43353
gene_symbol: RIPK2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'RIPK2 (RIP2/RICK/CARDIAK) is a cytoplasmic signaling protein with an N-terminal kinase domain,
  a C-terminal caspase-recruitment domain (CARD), and an intermediate linker. It is the essential adaptor
  of the intracellular bacterial sensors NOD1 and NOD2: upon detection of peptidoglycan fragments (iE-DAP
  for NOD1, muramyl dipeptide for NOD2) the activated receptors oligomerize and recruit RIPK2 through
  homotypic CARD-CARD contacts, nucleating helical RIPK2 CARD filaments (RIPosomes). Recruited RIPK2 is
  then conjugated with K63-linked polyubiquitin (by XIAP and cIAP1/2) and M1/linear chains (by LUBAC,
  recruited via XIAP), and these chains on RIPK2 serve as docking platforms that recruit the TAK1-TAB
  and IKK/NEMO complexes, driving canonical NF-kappaB activation and MAPK (p38/JNK) signaling and the
  resulting proinflammatory cytokine program. RIPK2 is a bona fide dual-specificity autokinase (serine/threonine
  autophosphorylation at Ser176 and tyrosine autophosphorylation at Tyr474, with activation coupled to
  kinase-domain dimerization), but its catalytic activity is dispensable for NOD1/NOD2-driven NF-kappaB
  output; the kinase domain instead contributes a structural surface for XIAP binding. RIPK2 also transduces
  signals from TLR2/3/4 and the IL-1/IL-18 receptors and contributes to T-cell receptor signaling (BCL10
  phosphorylation) in adaptive immunity. It localizes to the cytosol and is recruited to the plasma membrane
  with NOD2, with a minor endoplasmic-reticulum pool. RIPK2 and NOD2 are central to intestinal immune
  homeostasis, and NOD2/XIAP pathway defects cause Crohn disease and X-linked lymphoproliferative syndrome
  type 2.'
