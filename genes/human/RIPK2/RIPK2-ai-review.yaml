suggested_questions:
- question: Is RIPK2 tyrosine autophosphorylation at Tyr474 required for NOD2 signaling in a way distinct
    from catalysis per se, given that kinase-dead K47R and D146N mutants (which cannot autophosphorylate)
    nonetheless fully restore NOD2 signaling?
  experts: []
suggested_experiments:
- description: Reconstitute RIPK2-knockout cells with wild-type, kinase-dead (K47R, D146N), and ubiquitination-site
    (K209R) RIPK2 and quantify NOD2-induced RIPK2 ubiquitination, TAK1/IKK recruitment, and NF-kappaB/cytokine
    output, to cleanly separate the catalytic contribution from the scaffold/ubiquitination contribution.
- description: Define the minimal determinants of the XIAP-BIR2 binding surface on the RIPK2 kinase N-lobe
    (beta2-beta3 loop) by structure-guided mutagenesis, and test whether disrupting XIAP binding without
    perturbing catalysis abolishes NOD2 signaling.
