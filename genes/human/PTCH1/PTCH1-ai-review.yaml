    reason: 'PTCH1 does govern where SMO ends up, so the term is not simply wrong, but the direction recorded
      here has not held up. The established statement is the opposite one: unliganded PTCH1 restricts
      SMO accumulation in the ciliary membrane, and it is PTCH1''s clearance that lets SMO in - UniProt
      states this from five independent studies, and the same mechanism is what the antibody work exploits.
      The original authors hedged the claim themselves. Flagged rather than removed, since a role in controlling
      SMO''s membrane localisation is real; the companion general term GO:0032880 is separately re-pointed
      to the specific negative statement.'
    supported_by:
