  - *id025
  - *id023
  - *id019
- description: Hedgehog ligand reception. PTCH1 binds Sonic, Indian and Desert hedgehog with comparable
    affinity through its two extracellular domains. The interface is dominated by the ligand's own lipids
    - the N-terminal palmitate inserting into a cavity between ECD1 and ECD2, the C-terminal cholesteroyl
    group binding ECD1 - and one ligand engages two receptors through chemically distinct epitopes, with
    higher-order tetramers observed. Ligand occupancy inactivates the receptor and thereby derepresses
    the pathway.
  molecular_function:
    id: GO:0008158
    label: hedgehog receptor activity
  directly_involved_in:
  - id: GO:0045879
    label: negative regulation of smoothened signaling pathway
  locations:
  - id: GO:0098804
    label: non-motile cilium membrane
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - *id001
  - *id021
  - *id010
  - *id022
- description: Direct cholesterol binding by the extracellular-domain cavity and the transmembrane sterol-sensing
    domain. Purified PTCH1 binds cholesterol, Hedgehog binding abolishes that binding, and cryo-EM resolves
    sterol density in the ECD cavity, in the sterol-sensing domain, and as ten molecules arrayed around
    the transmembrane region at both leaflets. Substrate recognition is the entry point of the transport
    cycle and the point at which ligand shuts it down.
  molecular_function:
    id: GO:0015485
    label: cholesterol binding
