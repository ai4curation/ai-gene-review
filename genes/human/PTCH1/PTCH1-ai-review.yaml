core_functions:
- description: Intramembrane cholesterol carrier activity in the plasma and primary-cilium membranes.
    PTCH1's twelve-helix transmembrane core contains a sterol-sensing domain, a pseudosymmetric counterpart,
    and a conduit through which cholesterol moves; by keeping the accessible cholesterol pool of the ciliary
    membrane low, the unliganded receptor denies Smoothened the sterol it needs for its active conformation.
    This transport activity, not a conformational signal, is the mechanism of Smoothened repression, and
    Hedgehog binding switches it off by closing the conduit.
  molecular_function:
    id: GO:0140303
    label: intramembrane lipid carrier activity
  directly_involved_in:
