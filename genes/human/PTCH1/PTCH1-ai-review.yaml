  - ensembl:ENSMUSP00000021921
  review:
    summary: Neural tube formation depends on graded Hedgehog signalling from the notochord and floor
      plate, and PTCH1 sets the gain of that gradient by repressing SMO in cells that have not received
      ligand. Loss of patched function in human NBCCS produces the developmental abnormalities of the
      syndrome, spina bifida among them.
    action: KEEP_AS_NON_CORE
    reason: The process is genuinely PTCH1-dependent, so the term is kept, but neural tube formation is
      a downstream organismal outcome of pathway derepression rather than an activity PTCH1 itself executes.
      This row reaches human by Ensembl-Compara transfer from mouse Ptch1; the mouse gene also carries
      neural tube closure by IMP, so the transfer lands on a real mouse phenotype even though the specific
      source row is an IDA in a paper about the Sonic hedgehog ligand.
    supported_by:
    - &id008
      reference_id: PMID:8681379
      supporting_text: We propose that a reduction in expression of the patched gene can lead to the developmental
        abnormalities observed in the syndrome and that complete loss of patched function contributes
        to transformation of certain cell types.
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
