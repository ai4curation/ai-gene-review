- term:
    id: GO:0000122
    label: negative regulation of transcription by RNA polymerase II
  evidence_type: IMP
  original_reference_id: PMID:16229683
  qualifier: involved_in
  review:
    summary: Rahnama et al. showed in human cells that PTCH1 suppresses GLI1-driven reporter and endogenous
      target-gene activation, and that this suppression survives cyclopamine and does not require SUFU,
      i.e. it is not routed through the canonical SMO cascade. Deletion mapping put the activity in residues
      180-786 and 1058-1210 rather than the C-terminal tail used for Hedgehog signalling.
    action: KEEP_AS_NON_CORE
    reason: The experiment is real and human, so it is retained, but it is kept off the core set for two
      reasons. PTCH1 is a 12-pass membrane protein with no DNA-binding or chromatin activity; whatever
      it does to GLI1-dependent transcription it does at a distance, and the assay is a transfection/overexpression
      readout. The core molecular function established by structure and transport biochemistry is sterol
      movement, and the core process is negative regulation of the smoothened signalling pathway, which
      this non-canonical arm sits alongside rather than inside.
    supported_by:
    - &id020
      reference_id: PMID:16229683
      supporting_text: We show that gene activation by GLI1, the transcriptional effector of the pathway,
        can be down-regulated by PTCH1 without involvement of the canonical cascade of HH signalling events.
- term:
