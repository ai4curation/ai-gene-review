- term:
    id: GO:0045892
    label: negative regulation of DNA-templated transcription
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q61115
  - ensembl:ENSMUSP00000021921
  review:
    summary: A transferred claim that PTCH1 negatively regulates DNA-templated transcription. The mouse
      source measures changes in hepatic Igf1/Igfbp1 transcription when Hedgehog signalling is perturbed.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'The effect is real but it is the pathway''s output, not PTCH1''s activity: PTCH1 is a twelve-pass
      membrane protein with no DNA-binding domain, and every transcriptional consequence of changing PTCH1
      is mediated by GLI factors several steps downstream. That this row is paired with its exact opposite
      on the same gene, from the same source, is the clearest sign that both describe pathway output rather
      than a property of the protein. Flagged rather than removed because the direction of the effect
      is not in dispute, and because GOA separately carries a more specific, human, experimentally grounded
      transcription row (GO:0000122) for the non-canonical GLI1 arm.'
    propagation_review: &id026
      root_cause: PROPAGATION_BAD
      failure_modes:
      - ROLE_CONFLATION
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: UniProtKB:Q61115
        source_label: Ptch1
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Mouse IMPs from a hepatic Hedgehog study measuring Igf1 and Igfbp1 serum and transcript
          levels after pathway perturbation - a downstream readout, not a PTCH1 activity at the promoter.
