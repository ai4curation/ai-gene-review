  - ensembl:ENSMUSP00000021921
  review:
    summary: 'As transferred, this asserts that PTCH1 binds a patched protein. PTCH1 is a patched protein,
      so the only non-vacuous reading is self-association - and that reading is directly established:
      one SHH-N molecule bridges two PTCH1 receptors through two chemically distinct epitopes, and higher-order
      cryo-EM shows four protomers arranged as a dimer of dimers.'
    action: MODIFY
    reason: The essence survives but the term does not. Traced back, this row comes by Ensembl-Compara
      transfer from a mouse Ptch1 annotation whose source paper measures Sonic hedgehog binding to Patched
      - the activity described by the term belongs to the entity that binds patched, and on the receptor
      itself it is self-referential. Rather than discard it, it is re-pointed at identical protein binding,
      which is what the human structural work actually shows and which carries the oligomerisation information
      that matters for how ligand inactivates the receptor.
