- term:
    id: GO:0048745
    label: smooth muscle tissue development
  evidence_type: IEP
  original_reference_id: PMID:17850284
  qualifier: involved_in
  review:
    summary: Immunohistochemistry of the developing human urinary tract found SHH in the urothelium of
      the nascent bladder and PTCH with SMO in the surrounding urogenital sinus, a pattern the authors
      read as long-range paracrine signalling accompanying detrusor smooth muscle differentiation.
    action: MARK_AS_OVER_ANNOTATED
    reason: The evidence is a static expression pattern in fixed human tissue, with no perturbation of
      PTCH1 and no functional assay, and the authors themselves present it as hypothesis-generating. Hedgehog-driven
      smooth muscle differentiation is well established from mouse genetics, so the underlying biology
      is likely right; what is over-stated is the step from 'PTCH1 protein is present where this happens'
      to 'PTCH1 is involved in it'.
    supported_by:
    - reference_id: PMID:17850284
      supporting_text: The expression patterns of the SHH-transducing proteins Patched (PTCH) and Smoothened
        (SMO) were consistent with long-range paracrine signalling associated with detrusor smooth muscle
        differentiation in the urogenital sinus.
    - &id031
      reference_id: PMID:17850284
      supporting_text: Collectively, these descriptive results generate new hypotheses regarding SHH signal
        transduction in human urinary tract development and help to explain the varied urinary tract malformation
        phenotypes noted in individuals with mutations in the SHH pathway.
