- term:
    id: GO:0005119
    label: smoothened binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000847539
  - UniProtKB:Q13635
  - UniProtKB:Q9Y6C5
  review:
    summary: 'The PAINT node places smoothened binding on the Patched clade, seeded by human PTCH1 and
      PTCH2, both of which were shown biochemically to form a complex with SMO. The node placement is
      sound: complex formation was demonstrated for both vertebrate paralogues in the same experiment.'
    action: KEEP_AS_NON_CORE
    reason: Kept rather than removed - the co-immunoprecipitation evidence is experimental and stands
      on its own - but marked non-core because of a real mechanistic tension. PTCH1 inhibits SMO sub-stoichiometrically
      and catalytically, by depleting the sterol pool SMO needs, not by occupying it; the structures resolve
      PTCH1 with Hedgehog and with sterols, never with SMO. The module (modules/hedgehog_signaling.yaml)
      and all six human GO-CAM models listed in gocams/index.tsv encode the PTCH1-to-SMO relationship
      as causal inhibition downstream of GO:0140303 intramembrane lipid carrier activity, not as a binding
      event, and this review follows that.
    supported_by:
    - &id001
      reference_id: PMID:9811851
      supporting_text: Biochemical analysis of PTCH and PTCH2 shows that they both bind to all hedgehog
        family members with similar affinity and that they can form a complex with SMO.
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
      - source_id: PANTHER:PTN000847539
        source_status: SUPPORTS_TRANSFER
        comment: Patched-clade ancestral node; PTCH1 appears in its own WITH/FROM because its experimental
