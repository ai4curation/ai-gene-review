id: Q13635
gene_symbol: PTCH1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'PTCH1 (Protein patched homolog 1) is the cell-surface receptor for the Hedgehog family of
  secreted morphogens - Sonic, Indian and Desert hedgehog - and the constitutive brake on the Hedgehog
  signalling pathway in vertebrates. It is a 1447-residue polytopic glycoprotein built from twelve transmembrane
  helices and two large extracellular domains, belonging to the RND-permease-like patched family whose
  founding member is the Drosophila segment-polarity gene ptc; human carries a paralogue, PTCH2. PTCH1
  resides in the plasma membrane and, functionally most importantly, in the membrane of the non-motile
  primary cilium. Its molecular activity is not classical signal transduction but lipid movement: the
  transmembrane core contains a sterol-sensing domain and a conduit through which cholesterol is carried,
  and by depleting accessible cholesterol from the ciliary membrane the unliganded receptor starves the
  class-F GPCR Smoothened of the sterol it needs to adopt an active conformation. Hedgehog ligands inactivate
  PTCH1 by a two-lipid grasp: the ligand''s N-terminal palmitate and C-terminal cholesteroyl group both
  insert into the receptor''s extracellular domains, closing the sterol conduit; two receptors engage
  one ligand through distinct epitopes, and the complex is then ubiquitinated, internalised and degraded,
  clearing PTCH1 from the cilium so that Smoothened can enter and signal to the GLI transcription factors.
  Because PTCH1 sets the threshold of this pathway, it shapes embryonic patterning across many tissues
  - the dorsoventral neural tube, limb bud, somites, pharyngeal arches, skin and urogenital tract - and
  it acts as a tumour suppressor in adult tissue. Germline loss-of-function variants cause nevoid basal
  cell carcinoma (Gorlin) syndrome and holoprosencephaly, and somatic inactivation drives sporadic basal
  cell carcinoma and medulloblastoma. Reported secondary activities include sequestration of phosphorylated
  cyclin B1 away from the nucleus and a Smoothened-independent dampening of GLI1-driven transcription.'
