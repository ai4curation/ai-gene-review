    reason: 'Removed because the bare term carries no functional information, not because the interaction
      is doubtful - it is well measured, and its loss in the holoprosencephaly variants is the paper''s
      point. No GO molecular function describes receptor-co-receptor association more informatively than
      GO:0005515 does: signaling receptor binding would mis-cast a co-receptor as a ligand, and protein-containing
