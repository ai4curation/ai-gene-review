    reason: 'Bare protein binding is uninformative, and the policy for GO:0005515 requires MODIFY where
      the cited paper supports a better molecular function. It does here: GRK2 is a serine/threonine protein
      kinase, so the measured association is protein kinase binding, a term that preserves the information
      the generic row throws away. Note that the functional consequence runs the other way (GRK2 binding
      displaces cyclin B1 from PTCH1), so no kinase-regulatory term is proposed.'
