suggested_questions:
- question: In which direction, and with what ion coupling, does PTCH1 move cholesterol in a native ciliary
    membrane? UniProt records the mechanism as unclear and offers outer-to-inner leaflet exchange against
    potassium or sodium export, while free-energy calculations model export coupled to one to three Na+
    or two to three K+. No measurement has been made on a native cilium.
- question: Does the PTCH1-SMO complex detected by co-immunoprecipitation have any role, given that PTCH1
    inhibits SMO sub-stoichiometrically and that no structure resolves the two proteins together? If the
    complex is real and functional, the module's purely causal PTCH1-to-SMO relation would need a binding
    component.
- question: Do the cyclin B1 sequestration and Smoothened-independent GLI1 repression arms operate at
    endogenous PTCH1 levels in human tissue, or are they properties of overexpression? Both currently
    rest on transfection experiments plus one endogenous co-immunoprecipitation.
- question: Do the four PTCH1 isoforms differ in ciliary targeting, sterol transport rate or ligand affinity?
    None of the GOA rows is isoform-scoped, so any isoform specialisation is invisible in the current
    annotation set.
suggested_experiments:
- hypothesis: PTCH1 exports cholesterol from the outer leaflet of the ciliary membrane, and the resulting
    depletion of accessible cholesterol - rather than any direct PTCH1-SMO contact - is what holds SMO
    inactive.
  description: Reconstitute purified human PTCH1 into asymmetric proteoliposomes with defined leaflet-specific
    cholesterol and a Na+/K+ gradient, and measure directional sterol movement with leaflet-selective
    probes (accessible-cholesterol sensors such as ALOD4 applied from each side) under ligand-free, SHH-N-bound
    and conduit-mutant conditions. Pair this with ALOD4 labelling of accessible cholesterol in the cilia
    of PTCH1-null human cells rescued with wild-type, transport-dead and ligand-binding-dead PTCH1, reading
    out SMO ciliary accumulation and GLI transcription.
  experiment_type: reconstituted transport assay with cell-based accessible-sterol imaging
- hypothesis: The cyclin B1 and GLI1-repression arms of PTCH1 are separable from its transport activity,
    and are dispensable at endogenous expression levels.
  description: 'Introduce separation-of-function PTCH1 alleles at the endogenous locus in human cells:
    one deleting the regions mapped as required for GLI1 repression (residues 180-786 and 1058-1210) without
    disturbing the sterol conduit, and one inactivating the conduit while leaving those regions intact.
    Measure Hedgehog reporter and endogenous GLI target transcription, ciliary SMO accumulation, cyclin
    B1 nuclear/cytoplasmic partitioning and proliferation, all at endogenous expression.'
  experiment_type: CRISPR knock-in separation-of-function alleles with signalling and cell-cycle readouts
- hypothesis: Human PTCH1 has no heparin-binding activity; the heparin-binding annotation propagated to
    it reflects a property of the Hedgehog ligand.
  description: Test purified recombinant human PTCH1 ectodomains, and full-length PTCH1 in detergent or
    nanodisc, for binding to immobilised heparin and to defined heparan sulfate oligosaccharides by surface
    plasmon resonance, with SHH-N as the positive control and its Cardin-Weintraub-motif mutant as the
    negative. A clean negative result would close out the propagated annotation on direct evidence rather
    than on argument.
  experiment_type: surface plasmon resonance binding assay
