  review:
    summary: Microtubule-based movement (IBA).
    action: KEEP_AS_NON_CORE
    reason: KIF2A's well-established activity is ATP-dependent microtubule depolymerization; kinesin-13
      proteins depolymerize microtubules without motile function. Mouse KIF2 was nonetheless reported
      to move microtubules plus-end-directionally in a gliding assay and to associate with axonal vesicles.
      The motor annotation is not demonstrably wrong, but it is not the core activity. GO lacks a microtubule
      depolymerase MF term (see proposed_new_terms).
    supported_by:
    - reference_id: PMID:15302853
      supporting_text: Kif2a has been shown to catalyze microtubule depolymerization in the absence of
        motile function (Desai et al., 1999)
    - reference_id: PMID:7535303
      supporting_text: Recombinant KIF2 exists as a dimer with a bigger head and plus-end directionally
        moves microtubules at a velocity of 0.47 +/- 0.11 microns/s
