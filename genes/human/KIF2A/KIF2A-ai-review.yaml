id: O00139
gene_symbol: KIF2A
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: KIF2A is a kinesin-13 family protein, related to KIF2B and KIF2C/MCAK, with a centrally placed
  kinesin motor domain. It uses ATP to remove tubulin subunits from microtubule ends, acting as a microtubule
  depolymerase rather than a processive transporter. Early work on mouse KIF2 also reported plus-end-directed
  motility and association with axonal vesicles. KIF2A acts in the cytoplasm at centrosomes and spindle
  poles. In mitosis it is recruited to the spindle and its poles by DDA3/PSRC1 and is regulated by PLK1
  and Aurora kinases. Its depolymerase activity at the poles balances MCAK at kinetochores to drive spindle
  bipolarity, spindle dynamics and chromosome movement. In neurons it depolymerizes microtubules at the
  growth-cone edge to suppress collateral branch extension, and loss of KIF2A causes cortical malformations
  (CDCBM3). In migrating cells, TTBK2-EB1/3 phosphorylation removes KIF2A from microtubule plus ends to
  tune microtubule dynamics. During cilium growth, TTBK2 phosphorylation restrains KIF2A at the mother
  centriole. In quiescent cells re-entering the cell cycle, PLK1 phosphorylates KIF2A at T554. This activates
  its depolymerase at the mother centriole/basal body to disassemble the primary cilium. Constitutive
  activation of this PLK1-KIF2A pathway impairs ciliogenesis in premature chromatid separation syndrome.
