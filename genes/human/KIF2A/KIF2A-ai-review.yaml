core_functions:
- description: ATP-dependent microtubule depolymerase (kinesin-13) that removes tubulin from microtubule
    ends; inhibited by TTBK2 phosphorylation.
  proposed_molecular_function: ATP-dependent microtubule depolymerase activity
  directly_involved_in:
  - id: GO:0007019
    label: microtubule depolymerization
  locations:
  - id: GO:0005813
    label: centrosome
  supported_by:
  - reference_id: PMID:15302853
    supporting_text: Kif2a has been shown to catalyze microtubule depolymerization in the absence of motile
      function (Desai et al., 1999)
  - reference_id: PMID:26323690
    supporting_text: Phosphorylation by TTBK2 decreased the MT-depolymerizing activity of KIF2A
  - reference_id: PMID:26323690
    supporting_text: TTBK2 inhibits the MT-depolymerizing activity of KIF2A by reducing the interaction
      between KIF2A and MTs
  - reference_id: PMID:29980677
    supporting_text: Kinesin-13 proteins are major microtubule (MT) regulatory factors that catalyze removal
      of tubulin subunits from MT ends
  - reference_id: PMID:29980677
    supporting_text: AMPPNP-bound Kif2A can form stable complexes with tubulin in solution and trigger
      MT depolymerization. We also demonstrate the importance of the neck in modulating ATP turnover and
      catalytic depolymerization of MTs
- description: At mitotic spindle poles, where it is recruited by DDA3/PSRC1, it depolymerizes microtubules
    to balance kinetochore MCAK. This drives bipolar spindle assembly and spindle dynamics.
  proposed_molecular_function: ATP-dependent microtubule depolymerase activity
  directly_involved_in:
  - id: GO:0090307
    label: mitotic spindle assembly
  - id: GO:0007052
    label: mitotic spindle organization
  locations:
  - id: GO:0000922
    label: spindle pole
  supported_by:
  - reference_id: PMID:15302853
    supporting_text: RNAi-induced knockdown of Kif2a expression inhibited cell cycle progression because
      cells assembled monopolar spindles
  - reference_id: PMID:15302853
    supporting_text: Thus, two KinI motors, MCAK and Kif2a, play distinct roles in mitosis, and MCAK activity
      at kinetochores must be balanced by Kif2a activity at poles for spindle bipolarity
  - reference_id: PMID:18411309
    supporting_text: Thus, DDA3 recruits Kif2a to the mitotic spindle and spindle poles and controls spindle
      dynamics
- description: When quiescent cells re-enter the cell cycle, PLK1-phosphorylated (T554) KIF2A depolymerizes
    microtubules at the mother centriole/basal body to disassemble the primary cilium. During cilium growth
    its activity at the mother centriole is restrained by TTBK2 phosphorylation, which supports cilium
    elongation.
  proposed_molecular_function: ATP-dependent microtubule depolymerase activity
  directly_involved_in:
  - id: GO:0061523
    label: cilium disassembly
  locations:
  - id: GO:0005814
    label: centriole
  supported_by:
  - reference_id: PMID:25660017
    supporting_text: we report that kinesin superfamily protein 2A (KIF2A), phosphorylated at T554 by
      PLK1, exhibits microtubule-depolymerizing activity at the mother centriole to disassemble the primary
      cilium in a growth-signal-dependent manner
  - reference_id: PMID:25660017
    supporting_text: KIF2A-deficient hTERT-RPE1 cells showed the impairment of primary cilia disassembly
      following growth stimulation
  - reference_id: PMID:39930500
    supporting_text: we link the defects in cilia growth to aberrant turnover of a microtubule-depolymerizing
      kinesin KIF2A, which we find restrained by TTBK2 phosphorylation
proposed_new_terms:
- proposed_name: ATP-dependent microtubule depolymerase activity
  proposed_definition: Catalysis of the removal of tubulin heterodimers from the end of a microtubule,
    driven by ATP hydrolysis, without translocation along the microtubule lattice.
  justification: Kinesin-13 (KIF2A, KIF2B, KIF2C/MCAK) and kinesin-8 depolymerases are annotated only
    with 'microtubule motor activity' and 'microtubule binding'. Neither describes their defining enzymatic
    activity. KIF2A catalyses MT depolymerization in vitro.
  proposed_parent:
    id: GO:0140657
    label: ATP-dependent activity
  supported_by:
  - reference_id: PMID:15302853
    supporting_text: Kif2a has been shown to catalyze microtubule depolymerization in the absence of motile
      function (Desai et al., 1999)
  - reference_id: PMID:26323690
    supporting_text: Phosphorylation by TTBK2 decreased the MT-depolymerizing activity of KIF2A
  - reference_id: PMID:29980677
    supporting_text: Kinesin-13 proteins are major microtubule (MT) regulatory factors that catalyze removal
      of tubulin subunits from MT ends
  - reference_id: PMID:29980677
    supporting_text: AMPPNP-bound Kif2A can form stable complexes with tubulin in solution and trigger
      MT depolymerization. We also demonstrate the importance of the neck in modulating ATP turnover and
      catalytic depolymerization of MTs
suggested_questions:
- question: Does PLK1-activated KIF2A depolymerize axonemal microtubules directly, or centriolar/basal-body
    microtubules that anchor the axoneme? How does this relate to AURKA-HDAC6-driven disassembly?
- question: Is the reported plus-end-directed motility of mouse KIF2 (1995) reproducible for human KIF2A?
    If not, should kinesin-13 motor-activity annotations be revisited?
- question: Should GO add an MF term for ATP-dependent microtubule depolymerase activity to capture kinesin-13/kinesin-8
    enzymology?
- question: Is KIF2A restraint by TTBK2 (S137/S140) during cilium growth and its activation by PLK1 (T554)
    during resorption a single switch at the mother centriole?
suggested_experiments:
- description: Rescue KIF2A-knockout RPE1 cells with T554A, T554E and depolymerase-dead KIF2A. Measure
    serum-induced cilium disassembly kinetics, separating this from mitotic effects.
- description: Single-molecule TIRF of purified human KIF2A to test for directional motility versus lattice
    diffusion and end depolymerization.
