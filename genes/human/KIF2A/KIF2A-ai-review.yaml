- term:
    id: GO:0060271
    label: cilium assembly
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - FB:FBgn0030268
  - FB:FBgn0034827
  - PANTHER:PTN002380633
  review:
    summary: Cilium assembly (IBA, kinesin-13 node).
    action: MODIFY
    reason: 'The kinesin-13 node conveys a role in organizing ciliary/centriolar microtubules. For human
      KIF2A the demonstrated role is cilium disassembly: PLK1-phosphorylated KIF2A depolymerizes microtubules
      at the mother centriole, and its loss impairs serum-induced disassembly. Defective ciliogenesis
      in PCS syndrome is due to constitutive (excess) KIF2A activity. That is not evidence that KIF2A
      builds cilia. Comparator: AURKA, NEDD9 and HDAC6 carry GO:0061523 for this pathway, and KIF2A, as
      the enzyme that depolymerizes, does the work of the step. Vyslouzil et al. 2025 show that excess
      KIF2A activity at the mother centriole (when TTBK2 restraint is lost) impairs cilium elongation.
      This again points to KIF2A as a negative (disassembling) factor, not a positive assembly factor.'
    proposed_replacement_terms:
    - id: GO:0061523
      label: cilium disassembly
    additional_reference_ids:
    - PMID:25660017
    supported_by:
    - reference_id: PMID:25660017
      supporting_text: we report that kinesin superfamily protein 2A (KIF2A), phosphorylated at T554 by
        PLK1, exhibits microtubule-depolymerizing activity at the mother centriole to disassemble the
        primary cilium in a growth-signal-dependent manner
    - reference_id: PMID:25660017
      supporting_text: KIF2A-deficient hTERT-RPE1 cells showed the impairment of primary cilia disassembly
        following growth stimulation
    - reference_id: PMID:25660017
      supporting_text: the PLK1-KIF2A pathway is constitutively active in cells from patients with premature
        chromatid separation (PCS) syndrome and is responsible for defective ciliogenesis in this syndrome
    - reference_id: PMID:39930500
      supporting_text: we link the defects in cilia growth to aberrant turnover of a microtubule-depolymerizing
        kinesin KIF2A, which we find restrained by TTBK2 phosphorylation
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - ROLE_CONFLATION
      source_entities:
      - source_id: PANTHER:PTN002380633
        source_label: PTN002380633
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Kinesin-13 node with Drosophila kinesin-13 members among its sources. A role in organizing
          ciliary/centriolar microtubule length is plausibly ancestral. For human KIF2A the experimentally
          supported role is depolymerase-driven cilium disassembly, not assembly.
