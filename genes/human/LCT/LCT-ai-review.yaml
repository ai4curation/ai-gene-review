id: P09848
gene_symbol: LCT
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'LCT encodes lactase-phlorizin hydrolase (LPH), a large single-pass type I glycoprotein of
  the small-intestinal enterocyte brush border. It is synthesised as pre-pro-LPH, dimerises in the endoplasmic
  reticulum, and is proteolytically matured and sorted to the apical membrane, where the catalytic ectodomain
  faces the intestinal lumen. Mature LPH carries two glycosyl hydrolase family 1 catalytic sites in one
  polypeptide: the lactase site (Glu-1749) hydrolyses lactose, the principal milk sugar, to D-glucose
  and D-galactose, and also cellobiose; the phlorizin hydrolase site (Glu-1273) hydrolyses beta-glucosides
  with hydrophobic aglycones such as phlorizin and dietary flavonoid glucosides. Lactose hydrolysis by
  LPH is required for absorption of milk carbohydrate; coding mutations cause congenital lactase deficiency,
  while cis-regulatory variation upstream of LCT, within MCM6 intron 13, determines whether expression
  persists after weaning (lactase persistence versus adult-type hypolactasia).'
