  review:
    action: MARK_AS_OVER_ANNOTATED
    summary: The iron-homeostasis function is established, but this source does not directly assay
      the annotated process.
    reason: The complete cached main Results and Methods of PMID:29695288 compare wildtype and p.Q118dup
      BMP6 localization and secretion in CHO and SK-HEP-1 cells, alongside patient genotyping and
      allele-frequency analysis. They do not experimentally connect a BMP6 perturbation to intracellular
      iron regulation. The paper discusses the established BMP6-hepcidin pathway using earlier references.
      Mark this source-specific IDA process assignment as exceeding the experiments reported; a benign
      variant result does not contradict the wildtype ligand function. The other iron-homeostasis
      assertions and GO-CAM pathway interpretation remain supported.
    supported_by:
    - reference_id: PMID:29695288
      supporting_text: no difference in the localization or secretion between the wildtype and p.Q118dup
        BMP6 variant
