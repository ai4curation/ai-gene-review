id: P22004
gene_symbol: BMP6
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: BMP6 is a secreted growth factor of the TGF-beta superfamily. Its processed ligand engages
  BMP type I and type II receptor complexes to initiate SMAD1/5/8-dependent and context-dependent noncanonical
  signaling. It promotes osteogenic differentiation and regulates hepatic hepcidin expression, connecting
  extracellular signaling with systemic iron balance. BMP6 can form an active heterodimer with BMP2 in
  experimental systems, and erythroferrone limits BMP6-containing ligand activity by binding extracellular
  ligand. Receptor use and cellular outcomes depend on tissue context.
