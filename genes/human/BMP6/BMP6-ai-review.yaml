  review:
    action: KEEP_AS_NON_CORE
    summary: BMP6 increases endothelial-cell yield in a defined mouse progenitor assay, supporting
      context-specific proliferation.
    reason: The observed mouse donor PMID:20406889 includes a BMP6 experiment despite its BMP9-focused
      title. Its Results and Figure 3B caption report increased cell number after two days in mouse
