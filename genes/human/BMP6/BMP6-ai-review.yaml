  review:
    action: KEEP_AS_NON_CORE
    summary: BMP6 signaling can repress smooth-muscle transcriptional programs in a defined cell
      context.
    reason: 'PMID:17030628 corroborates a ligand-mediated transcriptional effect: BMP2/4/6 treatment
      of rat vascular smooth-muscle cells precedes MSX induction and reduced smooth-muscle marker
      expression. Mouse 10T1/2 promoter experiments and MSX/myocardin/SRF interaction assays are
      separate mechanistic layers; they do not establish BMP6 DNA binding or transcription-factor
      activity. Retain the downstream regulatory process as non-core. The observed MGI donor graph
      links this term to PMID:19252488, whose accessible abstract does not independently resolve
      the particular repression endpoint; the corroborating experiment is not presented as that original
      donor source or as proof of the exact historical Ensembl snapshot.'
