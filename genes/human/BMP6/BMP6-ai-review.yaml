  review:
    action: KEEP_AS_NON_CORE
    summary: BMP6 contributes to inflammatory signaling in experimentally defined macrophage contexts.
    reason: The observed mouse donor PMID:12151307 reports BMP2/4/6 expression and SMAD1/5 signaling
      during allergic airway inflammation; this is expression evidence rather than an independently
      verified BMP6-specific airway perturbation. PMID:19191909 separately tests BMP6 treatment and
      receptor perturbation in murine RAW264.7 cells, demonstrating iNOS and TNF-alpha induction.
      The reported confirmation in primary mouse peritoneal macrophages and human THP-1 cells concerns
      proliferation and receptor expression, not every inflammatory-mediator or receptor-perturbation
      experiment. This corroborates a context-specific inflammatory contribution without establishing
      a universal pro-inflammatory effect, transferring macrophage results to airway epithelia, or
      resolving the separate bacteremia-associated immune-response annotation.
    supported_by:
    - reference_id: PMID:12151307
    - reference_id: PMID:19191909
