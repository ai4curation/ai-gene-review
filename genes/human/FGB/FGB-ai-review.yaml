      gels, secretion and cycloheximide controls. Beta-gamma intermediates and addition of beta chain to pre-existing
      alpha-gamma complexes establish structural participation; human hepatoma cells provide additional context.
      BHK recipients are not human cells. These are chain-combination studies, not natural splice or released fibrinopeptide-B
      comparisons. Only the original article portions specified were used; later citing items on the hosting page
      were excluded.
