    label: structural molecule activity
  evidence_type: IDA
  original_reference_id: PMID:8910396
  qualifier: enables
  review:
    summary: The beta chain supplies structure during fibrinogen assembly.
    action: ACCEPT
    reason: PMID:8910396 follows human fibrinogen chains expressed in BHK cells, with additional human hepatoma
      context. Beta-gamma intermediates and alpha-beta-gamma-containing fibrinogen are identified by immunoprecipitation
      and two-dimensional electrophoresis. Adding the beta chain to cells containing alpha-gamma intermediates permits
      assembly and secretion. This is direct structural participation, not merely a loss-of-function requirement.
      The broad structural term also covers soluble-complex assembly beyond matrix incorporation.
    supported_by:
    - reference_id: PMID:8910396
