      tree and MSA place human FGB leaf PTN002498958 beneath PTN000441162 and PTN002709771; the 491-residue ungapped
      sequence exactly matches canonical P02675. The older family is officially FIBRINOGEN/TENASCIN/ANGIOPOEITIN
