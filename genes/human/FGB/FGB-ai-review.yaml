id: P02675
gene_symbol: FGB
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: FGB encodes the beta chain of fibrinogen, a secreted plasma complex containing two copies each of the
  alpha, beta and gamma chains. The beta chain contributes to interchain assembly, the coiled coils and the terminal
  globular domains of the complex. Thrombin releases the N-terminal fibrinopeptide B, exposing a binding sequence
  used during fibrin assembly. Beta chains provide structure within the resulting extracellular fibrin network;
  thrombin and Factor XIII perform the proteolytic and cross-linking reactions. FGB-containing fibrinogen also participates
  in platelet-associated and extracellular-matrix interactions, whose experimental effects often depend on the assembled
  complex.
