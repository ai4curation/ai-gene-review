functional_isoforms:
- id: FGB_FIBRINOPEPTIDE_B
  name: Fibrinopeptide B
  type: CLEAVAGE_PRODUCT
  maps_to:
  - type: UNIPROT_CHAIN
    ids:
    - PRO_0000009070
    residues: 31-44
  description: UniProt defines fibrinopeptide B at precursor residues 31–44, released by thrombin cleavage before
    residue 45. This released peptide is distinct from the beta chain incorporated into fibrin. No independent molecular
    activity or product-specific location is assigned from parent-accession annotations or proteomic protein-name
    metadata.
- id: FGB_FIBRIN_BETA_CHAIN
  name: Fibrin beta chain after fibrinopeptide B release
  type: CLEAVAGE_PRODUCT
  maps_to:
  - type: UNIPROT_CHAIN
    ids:
    - PRO_0000009071
    residues: 45-491
  description: The official chain feature spans residues 45–491 of the displayed 491-residue precursor after fibrinopeptide
    B release. This beta chain contributes to fibrin structure. Imported annotations retain their parent P02675
    identities; experimental fragments, chemically modified chains and grouped protein accessions are not treated
    as additional natural splice products.
suggested_questions:
- question: Which receptor-binding and cell-response effects depend directly on beta-chain surfaces, and which arise
    through other chains of assembled fibrinogen?
- question: Do beta-chain structural changes alter fibrinolysis by changing fibrin architecture, by altering cofactor
    presentation elsewhere in the complex, or through a direct beta-chain contribution?
- question: Which extracellular-matrix and vesicle measurements resolve intact fibrinogen, mature beta chain or
    released fibrinopeptide B, and which reflect externally associated soluble material?
suggested_experiments:
- description: Reconstitute sequence-verified human fibrinogen with targeted beta-chain changes and matched alpha/gamma
    chains. Measure assembly and fibrin architecture before receptor-binding or cell-response assays, with intact-complex
    and isolated-chain controls.
  hypothesis: Some apparent beta-chain effects may arise from altered complex assembly rather than an autonomous
    beta-chain ligand activity.
  experiment_type: Chain-resolved biochemical reconstitution
- description: Use cleavage-specific peptide measurements and appropriate fraction-purity controls to distinguish
    fibrinopeptide B, mature beta chain and intact fibrinogen in extracellular-matrix and vesicle preparations.
    Combine protease protection with measurements of soluble and surface-associated material.
  hypothesis: Parent-accession protein groups may combine processing states and extracellular associations that
    have distinct locations.
  experiment_type: Processed-product and compartment-resolved proteomics
