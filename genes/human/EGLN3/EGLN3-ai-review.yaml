- term:
    id: GO:0110076
    label: negative regulation of ferroptosis
  evidence_type: IDA
  original_reference_id: PMID:40281343
  qualifier: acts_upstream_of
  review:
    summary: EGLN3-dependent GPX4 stabilization counteracts ferroptosis.
    action: NEW
    reason: >-
      The immediate EGLN3-catalyzed step is GPX4 proline hydroxylation, and the
      immediate process assignment is protein stabilization. The same step also
      suppresses ferroptosis by preventing HSC70/CMA-dependent GPX4 loss, so an
      acts_upstream_of negative regulation of ferroptosis row is justified
      without treating EGLN3 as a core ferroptosis effector. GO-CAM
      680ad14200007201 captures the same relationship by nesting the EGLN3
      protein-stabilization activity under negative regulation of ferroptosis.
    supported_by:
