suggested_questions:
- question: >-
    In which primary human cell types is GPX4 hydroxylation by EGLN3 a major
    determinant of GPX4 stability, rather than a tumor-context or IFN-gamma
    stress response?
- question: >-
    Which EGLN3 substrates besides HIF-alpha, GPX4, PKM2 and TELO2/HCLK2 are
    direct physiological targets, and what sequence or interaction features
    distinguish them from in vitro peptide substrates?
suggested_experiments:
- description: >-
    Perform endogenous EGLN3 rescue with hydroxylase-dead and substrate-binding
    mutants in GPX4 P159A and wild-type backgrounds, then measure GPX4
    hydroxylation, HSC70 binding, chaperone-mediated autophagic turnover and
    ferroptosis sensitivity.
  experiment_type: genome editing/proteostasis assay
  hypothesis: >-
    EGLN3 suppresses ferroptosis through direct GPX4 P159 hydroxylation rather
    than through a parallel HIF-dependent transcriptional response.
