id: Q9H6Z9
gene_symbol: EGLN3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: EGLN3, also known as PHD3, is a human Fe(II)- and 2-oxoglutarate-dependent protein prolyl
  4-hydroxylase. It couples oxygen availability to HIF-alpha regulation by hydroxylating prolines in oxygen-dependent
  degradation domains, which enables VHL-dependent ubiquitination and proteasomal turnover, and it also
  hydroxylates non-HIF substrates including ADRB2, PKM2, TELO2/HCLK2 and GPX4. Through those substrate-specific
  reactions, EGLN3 links dioxygenase chemistry to oxygen sensing, metabolic transcriptional control, DNA-damage
  signaling, GPX4 stabilization and suppression of ferroptosis in susceptible tumor cells. The enzyme
  is found in cytosolic and nuclear pools.
existing_annotations:
- term:
    id: GO:0005506
    label: iron ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR006620
  review:
    summary: The biologically relevant catalytic metal is Fe(II).
    action: MODIFY
    reason: The IPR006620 domain mapping genuinely places EGLN3 in the 2-oxoglutarate/Fe(II)-dependent
      oxygenase family, but the useful cofactor term is GO:0008198 ferrous iron binding. The UniProt record
      identifies one Fe(2+) ion per subunit through the prolyl-hydroxylase ProRule and the PAINT row already
      uses the ferrous-iron child term.
    proposed_replacement_terms:
    - id: GO:0008198
      label: ferrous iron binding
    supported_by:
    - reference_id: GO_REF:0000002
    - reference_id: file:human/EGLN3/EGLN3-uniprot.txt
      record_section:
      - CC:COFACTOR
      supporting_text: Binds 1 Fe(2+) ion per subunit
    additional_reference_ids:
    - GO_REF:0000033
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      source_entities:
      - source_id: InterPro:IPR006620
        source_status: SUPPORTS_TRANSFER
        comment: The domain mapping is authentic but stops at generic iron-ion binding; EGLN3 uses ferrous
          iron in the 2-oxoglutarate dioxygenase reaction.
      failure_modes:
      - GRANULARITY_MISMATCH
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:11598268
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q16665
  review:
    summary: Bare protein binding is not an informative EGLN3 molecular function.
    action: REMOVE
    reason: GO:0005515 records only that EGLN3 was recovered in a protein-interaction assay. The row does
      not specify a substrate-recognition, adaptor or regulatory molecular function; removal follows the
      project protein-binding policy and does not dispute the reported physical interaction. The characterized
      substrate and HIF-complex contacts are captured by the hydroxylase activity rows and by the UniProt
      SUBUNIT/INTERACTION record rather than by a bare binding function.
