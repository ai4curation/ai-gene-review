  qualifier: involved_in
  review:
    summary: GPX4 P159 hydroxylation by EGLN3 stabilizes GPX4 protein.
    action: NEW
    reason: >-
      The GPX4 work supports a direct stabilizing reaction: EGLN3/PHD3
      hydroxylates GPX4 at Pro159, disrupting HSC70 binding and
      chaperone-mediated autophagic degradation. This agrees with GO-CAM
      680ad14200007201, which places the EGLN3 activity part_of protein
      stabilization.
    supported_by:
    - reference_id: PMID:40281343
