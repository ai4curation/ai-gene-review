- description: >-
    Fe(II)- and 2-oxoglutarate-dependent 4-hydroxylation of protein proline
    residues. HIF-alpha oxygen-dependent degradation domains are the canonical
    oxygen-sensing substrates, and human PHD3/EGLN3 also hydroxylates GPX4,
    PKM2 and TELO2/HCLK2 in context-specific pathways.
