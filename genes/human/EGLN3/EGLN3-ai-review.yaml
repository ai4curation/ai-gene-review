  label: Homo sapiens
description: >-
  EGLN3, also known as PHD3, is a human Fe(II)- and 2-oxoglutarate-dependent
  prolyl 4-hydroxylase. Like other HIF prolyl hydroxylases, it couples oxygen
  availability to HIF-alpha regulation by hydroxylating prolines in
  oxygen-dependent degradation domains, enabling downstream VHL recognition.
  EGLN3 also hydroxylates non-HIF substrates, including PKM2, TELO2/HCLK2 and
  GPX4, linking the same dioxygenase chemistry to metabolic transcriptional
  regulation, the DNA damage response and GPX4 stabilization during ferroptosis
  suppression. The enzyme is detected in cytoplasmic and nuclear pools.
