    summary: EGLN3 performs protein prolyl hydroxylation.
    action: NEW
    reason: >-
      The experimentally demonstrated molecular function is direct
      post-translational 4-hydroxylation of protein proline residues, including
      HIF-alpha substrates and GPX4. GO:0018126 is the immediate biological
