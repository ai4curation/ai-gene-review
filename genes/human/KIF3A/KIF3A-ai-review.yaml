id: Q9Y496
gene_symbol: KIF3A
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'KIF3A is a kinesin-2 family motor subunit. It heterodimerizes with KIF3B through its central coiled-coil stalk and associates with the non-motor cargo-binding subunit KAP3 (KIFAP3) to form the heterotrimeric kinesin-II complex, an ATP-driven plus-end-directed microtubule motor (C. elegans KLP-20/KLP-11 with KAP-1). Its best-characterized role is driving anterograde intraflagellar transport: kinesin-II moves IFT-B/IFT-A trains carrying axonemal and membrane cargo from the ciliary base to the tip, and it is required for assembly of primary and motile cilia, for ciliary entry of Smoothened and for Hedgehog signal transduction. Outside cilia, kinesin-II transports membranous organelles and vesicles (for example N-cadherin-containing carriers, regulated by CaMKII/POPX2 phosphorylation of KIF3A Ser690, and late endosomes/lysosomes), localizes with spindle microtubules and centrosomes in mitosis, and, independently of IFT, KIF3A recruits the dynactin subunit p150Glued to subdistal appendages of the mother centriole, supporting centrosomal microtubule anchoring, centriole cohesion and basal foot formation.'
