id: Q9Y496
gene_symbol: KIF3A
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: KIF3A is a kinesin-2 family motor subunit. It heterodimerizes with KIF3B (or KIF3C) through
  its coiled-coil stalk, and the KIF3A/KIF3B heterodimer binds the non-motor accessory subunit KAP3 (KIFAP3)
  to form heterotrimeric kinesin-2 (kinesin II). Each motor subunit has an N-terminal kinesin motor domain
  that binds microtubules and hydrolyses ATP, and the complex moves processively toward microtubule plus
  ends. In cilia, heterotrimeric kinesin-2 is the principal anterograde intraflagellar transport (IFT)
  motor, carrying IFT trains (IFT-A, IFT-B, BBSome) and axonemal and membrane cargo from the basal body
  to the ciliary tip; it is therefore required for assembly of primary and motile cilia and for ciliary
  entry of Hedgehog pathway components such as Smoothened. Outside cilia, KIF3A/KIF3B drives plus-end-directed
  transport of membranous organelles and vesicles in neurons and epithelia (for example N-cadherin-containing
  carriers, regulated by phosphorylation of KIF3A Ser690). KIF3A also has a motor-independent, IFT-independent
  role at the mother centriole, recruiting dynactin p150Glued to organize subdistal appendages, microtubule
  anchoring and centriole cohesion. KIF3A localizes to the cilium (axoneme and tip), basal body/centrosome,
  mitotic spindle and cytoplasm.
