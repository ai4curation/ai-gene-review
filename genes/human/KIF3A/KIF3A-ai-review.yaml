core_functions:
- description: KIF3A, heterodimerized with KIF3B and bound to KAP3 in kinesin-II, is an ATP-driven plus-end-directed microtubule motor that powers anterograde intraflagellar transport, building primary and motile cilia and delivering signalling proteins such as Smoothened into the cilium.
