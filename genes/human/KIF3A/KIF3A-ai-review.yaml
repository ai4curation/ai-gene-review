  review:
    summary: microtubule motor activity.
    action: ACCEPT
    reason: KIF3A is a kinesin-2 motor subunit; the recombinant KIF3A/B complex shows plus-end-directed
      microtubule sliding activity. This is the core molecular activity, supported by domain, phylogenetic
      and experimental evidence.
    supported_by:
    - reference_id: PMID:7559760
      supporting_text: The recombinant KIF3A/B complex (approximately 50-nm rod with two globular heads
        and a single globular tail) demonstrated plus end-directed microtubule sliding activity in vitro.
    - reference_id: file:human/KIF3A/KIF3A-uniprot.txt
      supporting_text: Belongs to the TRAFAC class myosin-kinesin ATPase superfamily. Kinesin family.
        Kinesin II subfamily.
