suggested_questions:
- question: Which KIF3A-dependent centriolar functions (p150Glued recruitment to subdistal appendages) are conserved in human cells, given they were defined in mouse cells and appear independent of motor activity?
- question: What adaptor links kinesin-II to IFT-B trains in human cells (KAP3 versus direct IFT-B subunit contacts)?
suggested_experiments:
- description: Single-molecule imaging of reconstituted human KIF3A/KIF3B/KAP3 with purified IFT-B to define the motor-train coupling interface and its regulation by KIF3A phosphorylation (e.g. by CILK1).
- description: Motor-dead KIF3A rescue in KIF3A-knockout human RPE1 cells to separate IFT-dependent ciliogenesis from IFT-independent subdistal appendage organization.
