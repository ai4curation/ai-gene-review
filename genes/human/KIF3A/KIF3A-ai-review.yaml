suggested_questions:
- question: Should the motor-independent centriolar role of KIF3A (p150Glued recruitment to subdistal
    appendages) be captured with a specific molecular-function term, and does KIF3B or KAP3 share it?
  experts:
  - Reiter JF
- question: To what extent do KIF3A/KIF3B and KIF3A/KIF3C heterodimers divide anterograde IFT versus non-ciliary
    vesicle transport in human cells?
suggested_experiments:
- hypothesis: KIF3A Ser690 phosphorylation selectively regulates non-ciliary cargo transport without affecting
    anterograde IFT.
  description: Compare IFT train velocity/frequency and N-cadherin trafficking in KIF3A-KO RPE1 cells
    rescued with wild-type, S690A and S690D KIF3A.
  experiment_type: live-cell imaging
