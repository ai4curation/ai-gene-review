  - reference_id: Reactome:R-HSA-5625416
    supporting_text: Anterograde trains travel along the axoneme of the cilium at an estimated rate of 2 micrometers per second in an ATP- and kinesin-2-dependent fashion
- description: Kinesin-II containing KIF3A also carries membranous organelles and vesicles along cytoplasmic microtubules, e.g. N-cadherin carriers to cell-cell junctions, a process regulated by phosphorylation of KIF3A Ser690 by CaMKII and dephosphorylation by POPX2.
