description: >-
  SMIM11 (formerly C21orf51, FAM165B; also called SMIM11A) is a 58-amino-acid protein encoded
  on chromosome 21. It has a single predicted helical transmembrane segment near the N
  terminus (residues 10-32), followed by a lysine-rich segment predicted to form a coiled
  coil (residues 29-58). On this basis it is predicted to be a single-pass membrane protein
  with a short charged cytoplasmic or luminal tail. Its membrane, topology and oligomeric
  state have not been determined experimentally. The transcript is broadly expressed
  across tissues. Its only reported partners come from a proteome-scale yeast two-hybrid
  screen: the ER-membrane ceramide synthase CERS4, an isoform of aspartyl/asparaginyl
  beta-hydroxylase (ASPH), and the cytosolic ubiquilin UBQLN2. No molecular function,
  biological process or loss-of-function phenotype has been reported.
