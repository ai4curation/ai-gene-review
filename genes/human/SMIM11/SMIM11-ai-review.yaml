suggested_questions:
- question: >-
    Does the lysine-rich coiled-coil after the transmembrane helix of SMIM11 mediate
    homo-oligomerization, and on which side of the membrane does it lie?
suggested_experiments:
- hypothesis: SMIM11 is a single-pass membrane protein of the ER or plasma membrane whose
    coiled-coil tail faces the cytosol.
  description: >-
    Express tagged SMIM11 at endogenous levels and determine its membrane by co-localization
    with organelle markers and its topology by selective permeabilization or protease
    protection. Test oligomerization of the coiled-coil by crosslinking or native gel
    electrophoresis.
  experiment_type: localization and topology mapping
