id: Q15904
gene_symbol: ATP6AP1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ATP6AP1 encodes Ac45, a single-pass glycoprotein accessory subunit of
  the vacuolar H+-ATPase. Ac45 remains within the membrane V0 sector, where its contacts
  with other subunits support pump assembly and stability. Its assembly and compartment-targeting
  roles contribute to endolysosomal acidification and specialized secretory functions.
  In human hepatocytes it also localizes to the endoplasmic reticulum and ER-Golgi
  intermediate compartment. The lysosomal V-ATPase complex couples amino-acid availability
  to Ragulator/Rag-dependent mTORC1 signaling. Its cytosolic C-terminal tail also
  promotes Rheb GTP loading in biochemical and cellular experiments, a mechanism reported
  as unconventional GEF activity and linked to growth-factor-dependent mTORC1 signaling.
  Pathogenic ATP6AP1 variants cause an X-linked glycosylation disorder with immunodeficiency,
  hepatopathy and variable neurological features.
