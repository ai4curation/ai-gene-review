suggested_questions:
- question: Does ATP6AP1 have separable regulatory roles in mature lysosomal V-ATPase
    activity versus ER-localized V0 assembly in different human tissues?
  experts:
  - Jansen EJ
  - Wang L
- question: Does the ATP6AP1 C-terminal tail accelerate GDP dissociation from preloaded
    Rheb, or primarily alter nucleotide association and equilibrium loading?
suggested_experiments:
- hypothesis: ATP6AP1 disease variants differentially impair ER V0 assembly, lysosomal
    acidification, and mTORC1 amino-acid signaling.
  description: Introduce representative ATP6AP1 variants into an ATP6AP1-null human
    cell line and measure V-ATPase assembly, lysosomal/endosomal pH, glycosylation
    markers, and amino-acid-stimulated mTORC1 recruitment/phosphorylation in parallel.
  experiment_type: genome editing and cell biology
- hypothesis: ATP6AP1-dependent assembly and compartment targeting can be distinguished
    from direct regulation of ATP hydrolysis.
  description: Compare wild-type and assembly-defective ATP6AP1 in matched reconstituted
    V-ATPase preparations. Quantify subunit stoichiometry, ATP-hydrolysis rates and
    proton transport separately, and compare these measurements with compartment targeting
    in human cells.
  experiment_type: biochemical reconstitution and cell biology
- hypothesis: ATP6AP1 tail-dependent Rheb GTP loading can be resolved into nucleotide-release
    and nucleotide-association steps.
  description: Measure fluorescent GDP release from preloaded purified Rheb during
    an unlabeled nucleotide chase with matched WT, 3D/A and control peptides, alongside
    GTP-association measurements; compare a full-length membrane context where feasible.
  experiment_type: purified nucleotide release and association kinetics
