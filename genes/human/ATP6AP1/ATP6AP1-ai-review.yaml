core_functions:
- description: ATP6AP1/Ac45 supports the assembly and stability of the membrane V0
    sector through contacts with its c-ring and other subunits, and helps target V-ATPase
    to functional compartments. It thereby contributes to proton pumping by the assembled
    complex and to endolysosomal acidification. ER/ERGIC residence in human hepatocytes
    supports the early assembly/localization context; it does not establish acidification
    of the ER lumen.
  contributes_to_molecular_function:
    id: GO:0046961
    label: proton-transporting ATPase activity, rotational mechanism
  in_complex:
    id: GO:0033176
    label: proton-transporting V-type ATPase complex
  directly_involved_in:
  - id: GO:0007042
    label: lysosomal lumen acidification
  - id: GO:0048388
    label: endosomal lumen acidification
