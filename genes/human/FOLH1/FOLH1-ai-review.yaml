core_functions:
- description: Zinc-dependent glutamate carboxypeptidase anchored in the plasma membrane
    with its catalytic domain outside the cell. It removes the C-terminal glutamate from
    folyl-poly-gamma-glutamates in the intestinal lumen, generating the absorbable
    monoglutamate form of folate, and from the neuropeptide NAAG in the nervous system,
    releasing free glutamate.
  molecular_function:
    id: GO:0004181
    label: metallocarboxypeptidase activity
  locations:
  - id: GO:0005886
    label: plasma membrane
  - id: GO:0009986
    label: cell surface
  directly_involved_in:
  - id: GO:0098829
    label: intestinal folate absorption
  - id: GO:0097054
    label: L-glutamate biosynthetic process
  - id: GO:0006508
    label: proteolysis
  supported_by:
  - reference_id: file:human/FOLH1/FOLH1-uniprot.txt
    supporting_text: Release of an unsubstituted, C-terminal glutamyl residue, typically
      from Ac-Asp-Glu or folylpoly-gamma-glutamates.
  - reference_id: file:human/FOLH1/FOLH1-uniprot.txt
    supporting_text: In the intestine, required for the uptake of folate.
  - reference_id: PMID:12949938
    supporting_text: PSMA is a type II membrane glycoprotein with a short cytoplasmic
      N-terminal region, a transmembrane domain, and a 701 amino acid extracellular
      portion with 10 potential N-linked glycosylation sites.
suggested_questions:
- question: How much of the NAAG hydrolysed in human brain is handled by FOLH1 rather than
    by the paralogous NAALADase enzymes, and in which cell types?
- question: Does the cytoplasmic PSMA-prime isoform retain catalytic activity, and what
    substrates could it reach inside the cell?
- question: Why is FOLH1 so strongly upregulated in prostate carcinoma, and does the
    enzymatic activity contribute to tumour biology or is the protein simply a convenient
    surface marker?
suggested_experiments:
- hypothesis: Surface FOLH1 activity, rather than total protein, determines folate uptake
    capacity in intestinal epithelium.
  description: Measure folyl-poly-gamma-glutamate hydrolysis on intact polarised intestinal
    monolayers with and without a cell-impermeant inhibitor, alongside surface
    biotinylation to quantify the external pool.
- hypothesis: The PSMA-prime isoform is catalytically active but substrate-starved in the
    cytosol.
  description: Express tagged PSMA-prime in cells lacking endogenous FOLH1, purify it and
    assay NAAG and folyl-polyglutamate hydrolysis in vitro, then test whether cytosolic
    NAAG levels change in cells.
- hypothesis: Catalytic activity is dispensable for the tumour-associated functions of
    PSMA.
  description: Compare prostate carcinoma lines expressing wild-type or active-site-mutant
    FOLH1 for proliferation, migration and signalling, with the surface level of each
    construct matched by flow cytometry.
