id: Q04609
gene_symbol: FOLH1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: FOLH1, also called prostate-specific membrane antigen or glutamate
  carboxypeptidase II, is a zinc metallopeptidase anchored in the plasma membrane as a
  type II single-pass protein, with a short cytoplasmic N-terminus and a large
  glycosylated extracellular catalytic domain that faces outward and forms homodimers.
  It removes the C-terminal glutamate from its substrates, acting in the small intestine
  as a folate hydrolase that strips gamma-linked glutamates from dietary
  folyl-poly-gamma-glutamates so that folate can be absorbed, and in the nervous system as
  an N-acetylated-alpha-linked acidic dipeptidase that hydrolyses the neuropeptide NAAG
  to release glutamate. An alternatively spliced form lacking the membrane anchor is
  cytoplasmic. The accessible extracellular domain and its strong expression in prostate
  carcinoma make FOLH1 the target of PSMA imaging and radioligand therapy.
