core_functions:
- description: High-affinity, proton-coupled symport of di- and tripeptides (and peptidomimetic
    drugs) across the apical plasma membrane, driven by the inwardly directed H+ electrochemical
    gradient (2:1 or 3:1 H+:peptide stoichiometry).
  molecular_function:
    id: GO:0015333
    label: peptide:proton symporter activity
  directly_involved_in:
