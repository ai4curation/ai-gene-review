    label: apical plasma membrane
  supported_by:
  - reference_id: PMID:18367661
    supporting_text: Glycylsarcosine (Gly-Sar); the beta-lactam antibiotics ampicillin,
      amoxicillin, cephalexin, and cefadroxil; and the anti-neoplastics delta-aminolevulinic
      acid (delta-ALA) and bestatin induced inward currents, indicating that they are
      transported
  - reference_id: PMID:7756356
    supporting_text: Functional expression of the kidney cDNA in HeLa cells results in
      the induction of a H(+)-coupled transport system specific for small peptides and
      aminocephalosporins
proposed_new_terms: []
suggested_questions:
- question: Does PEPT2 at the choroid plexus epithelium constitute transport across a
    CNS barrier (blood-CSF barrier), and is the GO:0150104 blood-brain-barrier annotation
    the correct term, or should a blood-CSF-barrier-specific term be used?
- question: Beyond providing the NOD2 ligand MDP, does PEPT2 have any direct signaling
    or regulatory activity in the NOD2/NLR pathway, or is its role purely ligand delivery?
suggested_experiments:
- description: Cryo-EM/X-ray structures of human PEPT2 captured in distinct transport-cycle
    states with bound di-/tripeptides and representative drug substrates (beta-lactams,
    ACE inhibitors) to define the substrate-recognition and proton-coupling determinants.
- description: Quantitative transport assays in a polarized choroid plexus epithelial
    model to test whether PEPT2 mediates net transepithelial (barrier) peptide/drug flux
    versus apical uptake only.
- description: Endogenous co-immunoprecipitation and surface-biotinylation in renal proximal
    tubule cells to quantify the dependence of apical PEPT2 abundance and transport on
    PDZK1 and other PDZ-scaffold partners.
knowledge_gaps:
- gap_statement: Whether PEPT2's contribution to NOD2-dependent antibacterial immunity is
    physiologically significant in vivo is undetermined, given that RNA-interference loss-of-function
    was inconclusive and other SLC15 family members can compensate for MDP transport.
  gap_kind:
  - BIOLOGY
