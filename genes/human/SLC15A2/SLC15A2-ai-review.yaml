- term:
    id: GO:0150104
    label: transport across blood-brain barrier
  evidence_type: NAS
  original_reference_id: PMID:30280653
  qualifier: involved_in
  review:
    summary: "Over-annotated: PEPT2's documented CNS site is the blood-CSF barrier, not the blood-brain barrier."
    action: MARK_AS_OVER_ANNOTATED
    reason: "NAS citing a general blood-brain-barrier review. GO:0150104 is specifically transport across the blood-brain (endothelial) barrier, but PEPT2's documented CNS site is the apical membrane of the choroid plexus epithelium (the blood-CSF barrier), a distinct structure. The specific blood-brain-barrier framing is therefore not established for PEPT2; the annotation over-states the evidence (an author statement on a general review, with no direct demonstration of PEPT2 at the BBB endothelium). The correct CNS-barrier term would be a blood-CSF barrier transport process; GO:0150104 as written is an over-annotation."
