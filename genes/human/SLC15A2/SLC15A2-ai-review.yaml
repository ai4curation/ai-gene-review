id: Q16348
gene_symbol: SLC15A2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SLC15A2 (PEPT2) is a proton-coupled, high-affinity/low-capacity oligopeptide
  transporter of the SLC15 / proton-dependent oligopeptide transporter (POT/PTR; major
  facilitator superfamily) family. It is a multi-pass integral membrane protein that
  couples the inward movement of di- and tripeptides (and peptidomimetics) to the
  electrochemical proton gradient, operating as an electrogenic H(+)/peptide symporter
  with a 2:1 or 3:1 proton:peptide stoichiometry depending on substrate charge. It has
  broad substrate specificity across neutral, anionic and cationic di-/tripeptides and
  also transports many peptide-like drugs, including beta-lactam antibiotics
  (aminocephalosporins), ACE inhibitors, antivirals and the dipeptide carnosine.
  PEPT2 localizes to the apical (brush-border) membrane of epithelial cells, most
  prominently the renal proximal tubule, where it reabsorbs filtered di- and tripeptides
  from the glomerular filtrate; it is also expressed at the apical membrane of choroid
  plexus epithelium, lung and other tissues, and in macrophages. Transport activity
  requires an inwardly directed proton gradient and is stimulated by low extracellular
  pH. In myeloid/phagocytic cells PEPT2 additionally transports bacterial peptidoglycan
  fragments such as muramyl dipeptide (MDP) across the phagosome membrane, delivering
  these ligands toward cytosolic NOD-like receptors (notably NOD2), thereby contributing
  to innate immune sensing of bacteria.
