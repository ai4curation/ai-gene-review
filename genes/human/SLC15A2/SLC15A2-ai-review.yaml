- term:
    id: GO:0030165
    label: PDZ domain binding
  evidence_type: IPI
  original_reference_id: PMID:16738539
  qualifier: enables
  review:
    summary: "PEPT2's C-terminal PDZ-binding motif binds the PDZ domains of the scaffold PDZK1."
    action: NEW
    reason: "Replaces the uninformative generic protein-binding rows with an informative MF. PEPT2 carries a C-terminal class-I PDZ-binding motif (the crystallized C-terminal peptide, PDB 6EZI residues 720-729) that binds PDZK1's PDZ domains; this adaptor interaction increases PEPT2 surface expression and transport. The quantitative-fragmentomics screen (PMID:36115835) likewise maps PEPT2 to PDZ-domain scaffolds (DLG1, GRIP1/2, MAGI2, MPDZ, PATJ), consistent with this motif."
    supported_by:
    - reference_id: PMID:16738539
      supporting_text: "This interaction requires the PDZ motif of PEPT2-CT detected by a yeast two-hybrid assay, in vitro binding assay and co-immunoprecipitation"
    - reference_id: PMID:16738539
      supporting_text: "a significant increase in the V(max) of Gly-Sar transport via PEPT2 and it was also associated with the increased surface expression level of PEPT2"
