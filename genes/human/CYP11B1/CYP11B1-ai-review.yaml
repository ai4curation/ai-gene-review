    propagation_review:
      root_cause: UNRESOLVED
      source_entities:
      - source_id: PANTHER:PTN001547324
        source_status: UNRESOLVED
        comment: Current QuickGO identifies this ancestral source. Terminal-oxidase loss does not by itself
          resolve broad pathway participation; no new family-tree node-placement assertion is made.
