- term:
    id: GO:0047783
    label: corticosterone 18-monooxygenase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: Phylogenetic annotation to 18-monooxygenase activity. CYP11B1 has weak residual 18-hydroxylase
      activity (it is described as a steroid 11beta-, 18- and 19-hydroxylase with preferred 11beta regioselectivity)
      but this is a minor side activity; the physiologically dominant 18-hydroxylase/oxidase is CYP11B2.
    action: KEEP_AS_NON_CORE
    reason: Retain the specific phylogenetic assignment as secondary C18 hydroxylation. The inspected human
      study discusses 18-hydroxycorticosterone formation and directly demonstrates C18 hydroxylation of cortisol;
      the curated UniProt regioselectivity statement supplies corroborating homolog evidence. This does not
      equate 18-hydroxylation with the terminal 18-oxidase activity, nor claim the cortisol assay itself measured
      corticosterone turnover.
    supported_by:
    - reference_id: PMID:15356073
      supporting_text: 11β-hydroxylase is probably also the source of many circulating 18-hydroxysteroids,
        for example, 18-OH-DOC, 18-hydroxycorticosterone and 18-hydroxyprogesterone, in normal subjects.
    - reference_id: file:human/CYP11B1/CYP11B1-uniprot.txt
      record_section:
      - CC:FUNCTION
      supporting_text: 'Steroid 11beta, 18- and

        CC       19-hydroxylase with preferred regioselectivity at 11beta, then 18, and

        CC       lastly 19 (By similarity).'
