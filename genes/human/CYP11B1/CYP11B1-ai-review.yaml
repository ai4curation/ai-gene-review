- term:
    id: GO:0032342
    label: aldosterone biosynthetic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: The scope of broad CYP11B1 participation in aldosterone biosynthesis remains unresolved.
    action: UNDECIDED
    reason: Human CYP11B1 lacks the terminal 18-oxidase activity and does not complete aldosterone synthesis,
      but it does catalyze upstream formation of corticosterone and some 18-hydroxysteroids. Failure to make
      the final product alone does not disprove involvement in an earlier pathway step. The NRSF experiment
      changes both CYP11B genes and steroid outputs together; it does not isolate physiological CYP11B1 contribution
      to aldosterone flux. Retain uncertainty about this broad process rather than equate it with aldosterone-synthase
      activity. CYP11B1 is not assigned the terminal oxidation core function.
    supported_by:
    - reference_id: PMID:2256920
      supporting_text: "both enzymes catalyze \nthe formation of corticosterone and 18-hydroxy-11-deoxycorticosterone\
        \ using \n11-deoxycorticosterone as a substrate."
