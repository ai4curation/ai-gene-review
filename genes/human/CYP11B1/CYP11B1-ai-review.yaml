id: P15538
gene_symbol: CYP11B1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CYP11B1 is a heme-containing cytochrome P450 at the mitochondrial inner membrane of adrenal cortical
  cells. It catalyzes 11-beta hydroxylation of 11-deoxycortisol to cortisol and of deoxycorticosterone to corticosterone,
  using electrons delivered through the mitochondrial adrenodoxin system. It also hydroxylates androgen substrates
  and has secondary steroid 18-hydroxylase activity. Unlike human CYP11B2, it lacks effective terminal 18-oxidation
  needed to produce aldosterone. CYP11B1 is a major cortisol-producing enzyme in the zona fasciculata and reticularis;
  loss of activity causes congenital adrenal hyperplasia with deficient cortisol synthesis, androgen excess
  and frequently hypertension associated with accumulated steroid precursors.
