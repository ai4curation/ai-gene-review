id: Q01201
gene_symbol: RELB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: RELB encodes RelB, a Rel-homology-domain NF-kappaB transcription factor subunit that functions prominently with NFKB2 p52 in noncanonical NF-kappaB signaling. RelB-containing dimers are held in cytoplasmic p100 complexes, enter the nucleus after p100 processing, and bind kappaB cis-regulatory DNA to activate or repress RNA polymerase II transcription in immune, inflammatory and lymphocyte-development programs.
