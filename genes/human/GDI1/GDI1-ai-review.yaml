- term:
    id: GO:0005783
    label: endoplasmic reticulum
  evidence_type: IDA
  original_reference_id: PMID:35343654
  qualifier: is_active_in
  review:
    summary: The RNF115/TLR paper supports GDI1 recruitment to RAB1A and RAB13
      but does not localize GDI1 in the endoplasmic reticulum.
    action: MARK_AS_OVER_ANNOTATED
    reason: PMID:35343654 shows that RNF115-mediated RAB1A/RAB13 ubiquitination
      impairs GDI1 recruitment; it does not assay GDI1 residence in the ER. GDI1
      is a soluble cytosolic Rab extractor, so using this experiment to place
      the whole GDI1 activity in the ER overstates the localization evidence.
    supported_by:
    - reference_id: PMID:35343654
      supporting_text: Such a modification impairs the recruitment of guanosine
        diphosphate (GDP) dissociation inhibitor 1 (GDI1) to RAB1A and RAB13
    - reference_id: file:human/GDI1/GDI1-uniprot.txt
