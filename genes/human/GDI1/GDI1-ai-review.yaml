id: P31150
gene_symbol: GDI1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'GDI1, also called Rab GDP dissociation inhibitor alpha, is a soluble
  cytosolic Rab chaperone that binds prenylated GDP-bound Rab GTPases, inhibits nucleotide
  exchange, extracts inactive Rabs from membranes, and preserves a cytosolic Rab:GDI
  pool for reuse in vesicle trafficking. Its Rab-recycling activity supports many
  membrane-traffic routes, including RAB10-dependent GLUT4 trafficking and RAB1A/RAB13-dependent
  Toll-like receptor transport, and the protein is enriched in neural tissues where
  GDI1 defects cause X-linked intellectual developmental disorder.'
