    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:19570034
  qualifier: enables
  supporting_entities:
  - UniProtKB:P20338
  review:
    summary: The GLUT4-trafficking paper detects Rab substrate interactions that
      support small GTPase binding.
    action: MODIFY
    reason: PMID:19570034 detected GDI1 association with GDP-biased RAB10 and
      RAB4A constructs; the paper found GDI1 preferential for RAB10 whereas GDI2
      favored RAB4A, so this row supports the general small-GTPase-binding term
      but its GDI1/GDI2 Rab selectivity should be captured outside the term
      name.
    proposed_replacement_terms:
    - &id002
      id: GO:0031267
      label: small GTPase binding
    supported_by:
    - reference_id: PMID:19570034
      supporting_text: GDI-1 binds to Rab10 with higher affinity, whereas
        GDI-2 favours Rab4A
