id: Q8TCC7
gene_symbol: SLC22A8
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SLC22A8 encodes Organic Anion Transporter 3 (OAT3, hOAT3), a 542-residue,
  12-transmembrane-domain member of the SLC22/organic cation transporter family within
  the major facilitator superfamily. It is the principal basolateral organic anion
  uptake carrier of the renal proximal tubule and mediates the first, blood-to-cell
  step of renal organic anion secretion. OAT3 works as a tertiary-active organic
  anion/dicarboxylate antiporter, exchanging cellular uptake of an extracellular organic
  anion for efflux of an intracellular dicarboxylate (chiefly 2-oxoglutarate/alpha-ketoglutarate
  or glutarate); the outward dicarboxylate gradient is maintained by Na(+)-dicarboxylate
  cotransporters, so OAT3 is coupled to the sodium gradient only indirectly and is not
  itself Na(+)- or proton-coupled. It handles a very broad range of anionic substrates,
  including urate, estrone 3-sulfate and other sulfated steroids, cortisol, prostaglandins
  E2 and F2alpha, cyclic AMP, tryptophan metabolites (kynurenate, xanthurenate), uremic
  toxins (indoxyl sulfate, hippurate, indole-acetate, CMPF), biopterins, and a large
  set of anionic drugs and toxins (methotrexate, NSAIDs, beta-lactam antibiotics,
  loop and thiazide diuretics, antivirals, statins, p-aminohippurate, ochratoxin A).
  OAT3 is strongly expressed in kidney, with weaker expression in brain-capillary
  endothelium and choroid plexus, where it clears organic anions from brain and
  cerebrospinal fluid, and in the adrenal gland. Through these activities it governs
  renal and central handling of endogenous metabolites and the elimination of
  xenobiotics.
