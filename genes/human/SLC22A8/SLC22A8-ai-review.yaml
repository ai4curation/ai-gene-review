proposed_new_terms:
- proposed_name: organic anion:dicarboxylate antiporter activity
  proposed_definition: Enables the transfer of an organic anion from one side of a
    membrane to the other in exchange for a dicarboxylate (such as 2-oxoglutarate or
    glutarate) moving in the opposite direction.
  justification: The defining molecular function of OAT3 (and OAT1, URAT1 and related
    SLC22 anion exchangers) is the exchange of a broad range of organic anions for
    an intracellular dicarboxylate counter-substrate. The generic grouping MF terms
    that previously covered this - GO:0008514 (organic anion transmembrane transporter
    activity), GO:0015347 (sodium-independent organic anion transmembrane transporter
    activity) and GO:0015301 (anion:anion antiporter activity) - are all now obsolete
    with no replacement, and no organic-anion:dicarboxylate exchange MF term exists.
    This substrate-class exchange term would sit under GO:0015297 antiporter activity
    and give the SLC22 organic-anion exchangers a precise, non-obsolete mechanism term.
  proposed_parent:
    id: GO:0015297
    label: antiporter activity
suggested_questions:
- question: What is the definitive coupling stoichiometry of OAT3? The organic-anion/dicarboxylate
    (2-oxoglutarate) exchange is established, but the exact number of dicarboxylate
    molecules exchanged per organic anion, the electrogenicity, and the reported
    pH/chloride dependence of estrone-3-sulfate transport (and possible E1S/cGMP exchange)
    remain to be unified in a single mechanistic model.
- question: How is the broad polyspecific substrate recognition of OAT3 encoded structurally?
    A high-resolution structure in apo and substrate/dicarboxylate-bound states would
    explain how a single binding site accommodates urate, sulfated steroids, prostaglandins
    and chemically diverse drugs, and would rationalize the loss-of-function variants
    (R149S, I260R).
suggested_experiments:
- description: Reconstitute purified OAT3 in proteoliposomes preloaded with 2-oxoglutarate/glutarate
    and measure urate and estrone-3-sulfate uptake while independently controlling
    trans-side dicarboxylate, the pH gradient and chloride, with electrophysiology,
    to establish the exchange stoichiometry and electrogenicity unambiguously.
- description: Determine the OAT3 structure by cryo-EM in apo, substrate-bound and
    dicarboxylate-bound states to map the polyspecific substrate site and the dicarboxylate
    counter-substrate site.
- description: Use Slc22a8-knockout and humanized mouse models to quantify the in vivo
    contribution of OAT3 to renal secretion and plasma levels of urate, uremic toxins
    and representative anionic drugs, relative to OAT1.
