- term:
    id: GO:0005452
    label: solute:inorganic anion antiporter activity
  evidence_type: IDA
  original_reference_id: PMID:15037815
  qualifier: enables
  review:
    summary: Direct evidence for antiport (organic anion/dicarboxylate exchange) activity.
    action: MODIFY
    reason: OAT3's antiport mechanism is correct, but the "inorganic anion" qualifier
      is inaccurate for this gene - the counter-substrate it exchanges is the organic
      dicarboxylate 2-oxoglutarate/glutarate, not an inorganic anion (UniProt catalytic
      activities urate(in)+2-oxoglutarate(out), estrone-3-sulfate(out)+glutarate(in)).
      Generalize to the supported parent GO:0015297 antiporter activity, which OAT3
      already carries (IEA from mouse Oat3). This is a generalization of an overly
      specific/contorted term, not a false claim.
    proposed_replacement_terms:
    - id: GO:0015297
      label: antiporter activity
    supported_by:
    - &uni_exch
      reference_id: UniProtKB:Q8TCC7
      supporting_text: organic anion/dicarboxylate exchanger that couples organic anion
        uptake indirectly to the sodium gradient
      record_section:
      - CC:FUNCTION
