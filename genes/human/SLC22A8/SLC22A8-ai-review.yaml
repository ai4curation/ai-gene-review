core_functions:
- description: Tertiary-active organic anion/dicarboxylate antiport across the plasma
    membrane. OAT3 takes up a broad range of extracellular organic anions in exchange
    for efflux of an intracellular dicarboxylate (chiefly 2-oxoglutarate/alpha-ketoglutarate
    or glutarate); the outward dicarboxylate gradient is set by Na(+)-dicarboxylate
    cotransporters, so coupling to the sodium gradient is indirect and OAT3 is not
    itself Na(+)- or proton-coupled. This exchange mechanism is the mechanistic core
    underlying uptake of urate, sulfated steroids, prostaglandins, uremic toxins and
    many anionic drugs.
