suggested_questions:
- question: Is there a suitable GO biological-process term for sterol-regulated (non-quality-control) ER-associated
    degradation of a native enzyme such as HMGCR? GO:0036503 'ERAD quality control pathway' is defined for misfolded/aberrant
    proteins, so INSIG adaptor activity currently lacks a fitting process term.
- question: Does PCK1-mediated phosphorylation of INSIG1 Ser207 (PMID:32322062) occur in non-transformed hepatocytes,
    and does it reduce oxysterol binding directly or by altering the INSIG-SCAP interface?
- question: What determines the partition of INSIG1 between SCAP and HMGCR when both sterol-sensing-domain clients
    compete for the same site?
suggested_experiments:
- description: Reconstitute purified human INSIG1 with SCAP and HMGCR sterol-sensing domains in nanodiscs and measure
    25-hydroxycholesterol and cholesterol dependence of each complex by binding assays and cryo-EM.
  experiment_type: in vitro reconstitution / structural biology
  hypothesis: SCAP and HMGCR bind the same INSIG1 TM3/TM4 surface in a mutually exclusive, sterol-dependent manner.
- description: Knock in INSIG1 S207A/S207D in human hepatocyte lines and measure INSIG1 oxysterol binding, SCAP
    association and SREBP processing under insulin or AKT activation.
  experiment_type: genome editing
  hypothesis: Ser207 phosphorylation by PCK1 is a physiological switch for INSIG1 sterol sensing.
