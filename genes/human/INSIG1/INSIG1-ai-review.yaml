- term:
    id: GO:0008203
    label: cholesterol metabolic process
  evidence_type: NAS
  original_reference_id: PMID:12242332
  qualifier: involved_in
  review:
    summary: Annotated to cholesterol metabolic process; INSIGs restrain, rather than carry out, cholesterol synthesis.
    action: MODIFY
    reason: 'INSIGs perform no step of cholesterol synthesis or metabolism. They lower it by retaining SCAP-SREBP
      in the ER (so less SREBP-driven transcription of sterol-synthesis genes) and by adapting HMGCR to ER-associated
      degradation. The sound essence is regulatory, with a negative sign: GO:0045541 negative regulation of cholesterol
      biosynthetic process. Judged identically in the INSIG2 review (shared PAINT node / paralog function).'
    proposed_replacement_terms:
    - *id004
    supported_by:
    - reference_id: PMID:12242332
      supporting_text: By blocking this movement, insig-2, like the previously described insig-1, prevents the proteolytic
        processing of SREBPs by Golgi enzymes, thereby blocking cholesterol synthesis.
    - reference_id: PMID:12535518
      supporting_text: degradation of HMG CoA reductase is accelerated by the sterol-induced binding of its sterol-sensing
        domain to the ER protein insig-1
- term:
    id: GO:0032869
    label: cellular response to insulin stimulus
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN001033847
  - RGD:708457
  review:
    summary: Response to insulin, based on insulin-regulated expression of the INSIG genes.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'Insulin changes the abundance of INSIG transcripts: INSIG1 (the ''insulin-induced gene'', rat CL-6)
      is induced, and the liver-specific Insig-2a transcript is repressed. That is regulation of the gene by insulin,
      not a function the INSIG protein performs in an insulin response; the opposite signs in the two paralogs also
      argue that no shared, inherited protein function is involved. The IBA node (PTN001033847) rests on rat Insig1,
      whose own row for this term is an IEP (expression) annotation, so the propagated claim inherits an expression-pattern
      observation rather than a functional one. Judged identically in the INSIG2 review (shared PAINT node / paralog
      function).'
    supported_by:
    - reference_id: PMID:9268630
      supporting_text: Rat CL-6 is the most highly insulin-induced gene in a liver cell line
    - reference_id: PMID:12624180
      supporting_text: Insig-2a is the predominant transcript in livers of fed animals, and it is selectively down-regulated
        by insulin.
    propagation_review:
      root_cause: SOURCE_WEAK_OR_INFERRED
      failure_modes:
      - SOURCE_EVIDENCE_WEAK
      - ROLE_CONFLATION
      source_entities:
      - source_id: PANTHER:PTN001033847
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: Node placement covers both paralogs, but its only descendant evidence for this term is an expression-pattern
          observation.
      - source_id: RGD:708457
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: Rat Insig1 row for this term is IEP (insulin induction of the transcript), which does not show
          a protein function in the insulin response.
- term:
    id: GO:0032933
    label: SREBP signaling pathway
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN001033847
  - UniProtKB:O15503
  - UniProtKB:Q9Y5U4
  review:
    summary: INSIG1 is a sterol-sensing component of the SREBP pathway that blocks SCAP-SREBP export when sterols
      are high.
    action: ACCEPT
    reason: 'INSIGs act within the SREBP signaling pathway itself, at its first, sterol-gated step: transport of
      SCAP-SREBP from the ER to the Golgi. The more specific GO:0036316 SREBP-SCAP complex retention in endoplasmic
      reticulum is accepted as the core process; this pathway-level term still adds context and is kept. Judged
      identically in the INSIG2 review (shared PAINT node / paralog function).'
    supported_by:
    - reference_id: PMID:12242332
      supporting_text: This paper describes insig-2, a second protein of the endoplasmic reticulum that blocks the
        processing of sterol regulatory element-binding proteins (SREBPs) by binding to SCAP (SREBP cleavage-activating
        protein) in a sterol-regulated fashion, thus preventing it from escorting SREBPs to the Golgi.
