- term:
    id: GO:0140311
    label: protein sequestering activity
  evidence_type: IDA
  original_reference_id: PMID:15899885
  qualifier: enables
  review:
    summary: INSIG1 binds sterol-loaded SCAP and sequesters it from COPII, holding SCAP-SREBP in the ER.
    action: ACCEPT
    reason: Core molecular function. Insig binding makes SCAP's MELADL signal inaccessible to Sec23/24, so SCAP
      is prevented from entering COPII vesicles. This matches the GO:0140311 definition (binding a protein to stop
      its localization) and the GO-CAM model 6205c24300000880. Judged identically in the INSIG2 review (shared PAINT
      node / paralog function).
    supported_by:
    - reference_id: PMID:15899885
      supporting_text: This in vitro inhibition is dependent on the presence of Insig-1, an ER resident protein
        that is necessary for sterol-mediated inhibition of Scap/SREBP transport in intact cells.
    - reference_id: PMID:15899885
      supporting_text: addition of cholesterol or 25-hydroxycholesterol to microsomal membranes in vitro blocks
        Sar1-dependent binding of the Sec23/24 complex to Scap, the SREBP escort protein
    - reference_id: PMID:17428919
      supporting_text: Cholesterol and oxysterols block COPII binding to MELADL by binding to different intracellular
        receptors, cholesterol to Scap and oxysterols to Insig.
