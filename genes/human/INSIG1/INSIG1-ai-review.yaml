id: O15503
gene_symbol: INSIG1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: INSIG1 (insulin-induced gene 1) is a polytopic, six-transmembrane protein of the endoplasmic reticulum
  membrane and a sterol sensor in feedback control of cholesterol synthesis and uptake. When ER sterol levels rise,
  INSIG1 binds oxysterols such as 25-hydroxycholesterol (through a pocket formed with transmembrane helices 3 and
  4), or engages cholesterol-bound SCAP. It binds the sterol-sensing domain of SCAP and holds the SCAP-SREBP complex
  in the ER, making SCAP's MELADL sorting signal inaccessible to the COPII proteins Sec23/24. SREBP-1 and SREBP-2
  therefore are not carried to the Golgi for proteolytic activation. INSIG1 also binds the sterol-sensing domain
  of HMG-CoA reductase and acts as an adaptor that brings it to the ER ubiquitin ligases gp78/AMFR, TRC8/RNF139
  and RNF145 for sterol-accelerated ER-associated degradation; it similarly recruits ACAT2/SOAT2 to gp78. INSIG1
  is itself an SREBP target gene. When sterols are depleted, free INSIG1 is ubiquitinated (Lys156/Lys158) and degraded,
  which makes renewed feedback depend on new synthesis. A conserved juxtamembrane Asp205 is required for both SCAP
  and HMGCR functions. In hepatocellular carcinoma cells, phosphorylation at Ser207 by PCK1 has been reported to
  reduce sterol binding and release SCAP-SREBP.
