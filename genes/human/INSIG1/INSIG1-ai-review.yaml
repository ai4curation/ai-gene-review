- term:
    id: GO:0036315
    label: cellular response to sterol
  evidence_type: IMP
  original_reference_id: PMID:12202038
  qualifier: involved_in
  review:
    summary: INSIG1 is required for sterol-induced retention of SCAP-SREBP; INSIG1 overexpression sensitises cells
      to sterols.
    action: ACCEPT
    reason: 'INSIGs are sterol sensors: oxysterol binding to INSIG, or cholesterol binding to SCAP, triggers the
      INSIG-SCAP interaction that shuts down SREBP processing. A cellular response to sterol is the physiological
      frame of the core function. The same term is proposed for INSIG2 (by MODIFY of its response to lipid IEA).'
    supported_by:
    - reference_id: PMID:12202038
      supporting_text: Overexpression of INSIG-1 increases the sensitivity of cells to sterol-mediated inhibition
        of SREBP processing.
    - reference_id: PMID:12202038
      supporting_text: Mutant SCAP(Y298C) fails to bind INSIG-1 and is resistant to sterol-mediated inhibition of
        ER exit.
- term:
    id: GO:0036316
    label: SREBP-SCAP complex retention in endoplasmic reticulum
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN001033847
  - UniProtKB:O15503
  - UniProtKB:Q9Y5U4
  review:
    summary: INSIG1 retains the SCAP-SREBP complex in the ER when sterols are present.
    action: ACCEPT
    reason: Core process. Sterol-induced INSIG binding to SCAP prevents COPII from engaging SCAP's MELADL sorting
      signal, so SCAP-SREBP stays in the ER and SREBPs are not processed in the Golgi. The IBA node PTN001033847
      (vertebrate INSIG1/INSIG2) is well founded on experimental data for both paralogs. Judged identically in the
      INSIG2 review (shared PAINT node / paralog function).
    supported_by:
    - reference_id: PMID:12242332
      supporting_text: This paper describes insig-2, a second protein of the endoplasmic reticulum that blocks the
        processing of sterol regulatory element-binding proteins (SREBPs) by binding to SCAP (SREBP cleavage-activating
        protein) in a sterol-regulated fashion, thus preventing it from escorting SREBPs to the Golgi.
