core_functions:
- molecular_function:
    id: GO:0180020
    label: membrane bending activity
  description: 'CHMP2B performs membrane-deforming structural work in dynamic ESCRT-III assemblies. Human
    full-length WT/C-terminal-tag cellular tubulation and purified activated 1–154 protein after CHMP4B
    provide direct evidence, with tag, lipid, activation and geometry limits. The C-terminal MIM recruits
    VPS4 rather than supplying ATP hydrolysis. One structural activity contributes to endosomal sorting,
    abscission, cooperative nuclear-envelope reassembly and later stages of membrane repair; the evidence
    does not establish autonomous universal scission, direct phagophore closure, or a membrane-fenestration
    grommet. PMID:33832485 is condition-dependent countercontext: CHMP2B coats stiffen membranes under
    its tested conditions, so it is not used as affirmative evidence of bending. The 2021 full-length
    1–222 numbering does not match current 213-aa Q9UQN3 and is not silently assigned to an isoform.'
  directly_involved_in:
  - id: GO:0071985
    label: multivesicular body sorting pathway
  - id: GO:0061952
    label: midbody abscission
  - id: GO:0031468
    label: nuclear membrane reassembly
