gene_symbol: CHMP2B
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CHMP2B is a human ESCRT-III protein that assembles into membrane-associated polymers and
  contributes to endosomal sorting, cytokinetic abscission, nuclear-envelope reassembly and membrane repair.
  Its N-terminal membrane-interacting region and polymer-forming core support membrane deformation, while
  a C-terminal MIT-interacting motif recruits VPS4 ATPases for dynamic remodeling and recycling. The protein
  has a diffuse cytosolic pool and is transiently recruited to membranes; it is not itself an ATPase.
  Its functions can overlap with those of CHMP2A, with the extent of redundancy depending on the cellular
  process. Disease-associated C-terminal variants can alter assembly turnover, endolysosomal delivery
  and nuclear export, producing toxic effects that need not represent simple loss of every wild-type function.
