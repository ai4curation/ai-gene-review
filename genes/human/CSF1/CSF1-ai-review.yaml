id: P09603
gene_symbol: CSF1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CSF1 encodes macrophage colony-stimulating factor 1, a secreted and membrane-tethered
  disulfide-linked cytokine that binds CSF1R/FMS to activate receptor tyrosine kinase signaling
  controlling mononuclear phagocyte survival, proliferation and differentiation. Its conserved
  outputs include macrophage and osteoclast differentiation, with additional context-dependent
  roles in macrophage migration, inflammatory responses, foam-cell formation, reproduction
  and microglial biology.
