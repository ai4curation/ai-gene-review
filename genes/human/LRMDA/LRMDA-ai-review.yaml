    label: melanosome membrane
  supported_by:
  - reference_id: PMID:41038817
    supporting_text: |-
      Here, we identify
      leucine rich melanocyte differentiation associated (LRMDA) as a Commander
      binding protein. We reveal that LRMDA and SNX17 share a common mechanism of
      Commander association, and that LRMDA simultaneously associates with Commander
      and active RAB32, establishing distinct RAB32-LRMDA-Commander and
      SNX17-Commander assemblies.
    reference_section_type: ABSTRACT
  - reference_id: PMID:36334630
    supporting_text: |-
      Importantly, we found that OCA7 regulates
      premelanosome protein (PMEL) processing, impacting fibrillation and the
      striations that define transition from melanosome stage I to stage II.
      Furthermore, the melanosome lumen of OCA7-KO cells displays lower pH than
