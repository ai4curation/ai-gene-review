    supported_by:
    - reference_id: PMID:41038817
      supporting_text: |-
        Here, we identify
        leucine rich melanocyte differentiation associated (LRMDA) as a Commander
        binding protein. We reveal that LRMDA and SNX17 share a common mechanism of
        Commander association, and that LRMDA simultaneously associates with Commander
        and active RAB32, establishing distinct RAB32-LRMDA-Commander and
        SNX17-Commander assemblies.
      reference_section_type: ABSTRACT
