    reference_section_type: ABSTRACT
proposed_new_terms:
- proposed_name: RAB32-LRMDA-Commander complex
  proposed_definition: >-
    A protein-containing complex composed of active RAB32, the LRMDA adaptor, and the
    Commander complex that associates with melanosomal membranes and participates in
    melanosome biogenesis.
  justification: >-
    The named RAB32-LRMDA-Commander assembly is biochemically and functionally distinct
    from SNX17-Commander. A specific term would distinguish the LRMDA-containing
    pigment-organelle assembly from the constitutive Commander core and from other
    Commander adaptor complexes.
