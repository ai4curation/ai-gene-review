  - UniProtKB:Q7Z3J2
  review:
    summary: >-
      LRMDA acts as a non-catalytic adaptor linking active RAB32 to the
      VPS35L-containing Retriever subcomplex and the wider Commander assembly.
    action: NEW
    reason: >-
      The study demonstrates simultaneous association with active RAB32 and Commander,
      maps separable interaction regions, and functionally distinguishes the
      RAB32-LRMDA-Commander pathway in melanocytes. GO:0030674 captures the bridging
