    reference_section_type: ABSTRACT
knowledge_gaps:
- gap_statement: >-
    The relative expression and functional equivalence of the reviewed 198-residue
    Q9H2I8 protein and the 226-residue A0A087WWI0 proteoform are unknown.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    The 2022 RAB32/RAB38-binding and localization constructs and all 2025
    RAB32-Commander interaction and mutagenesis experiments used a 226-residue form.
    The proteins share the 177-residue C-terminal region but have alternative N termini,
    so construct-specific interface numbering and endogenous proteoform usage cannot
    be assumed for Q9H2I8.
  resolution: >-
    Quantify both proteoforms by long-read transcriptomics and targeted proteomics in
    primary human melanocytes, then compare their melanosome recruitment, RAB32 and
    Commander binding, and rescue of LRMDA-null cells at endogenous expression levels.
  provenance:
  - reference_id: PMID:36334630
    supporting_text: Attempts to amplify two potential transcript variants of OCA7 encoding a 226 or 198 amino acid protein from MNT1 complementary DNA (cDNA) were only successful for the first, suggesting it is the predominant variant.
    reference_section_type: RESULTS
  - reference_id: PMID:41038817
    supporting_text: >-
      LRMDA-GFP, LRMDA-GFP(ΔC) and LRMDA-GFP(ΔC) in pEGFP-N3 plasmid were a
      gift from Prof. Santiago di Pietro, and the wild-type sequence encoded the
      longer LRMDA isoform with Uniprot accession A0A087WWI0. This isoform was
      used in all experiments.
    reference_section_type: METHODS
- gap_statement: >-
    The cargo and trafficking steps through which RAB32-LRMDA-Commander control PMEL
    processing, melanosome fibrillation, and lumen pH remain unresolved.
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  status: OPEN
  significance: >-
    Knockout phenotypes establish organelle-level consequences, but they do not yet
    identify the membrane cargo whose sorting directly changes PMEL maturation or
    proton homeostasis.
  resolution: >-
    Combine acute endogenous LRMDA degradation with organelle-resolved proteomics,
    trafficking kinetics, and CRISPR rescue to identify Commander-dependent melanosome
