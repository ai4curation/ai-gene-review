core_functions:
- description: >-
    At the melanosome limiting membrane, LRMDA bridges active RAB32-family GTPases to
    the Retriever subcomplex and thereby recruits a distinct Commander assembly during
    melanosome biogenesis. In human melanocytic cells, LRMDA loss perturbs PMEL
    processing, fibril and striation formation, organelle pH, melanosome maturation,
    and melanin content. Direct RAB32/RAB38-binding, localization, and Commander
    interaction experiments used a longer 226-residue human proteoform, whereas the
    reviewed target is 198 residues; their shared C-terminal region preserves the
    mapped Commander-binding motif, but functional equivalence of the complete
    proteoforms has not been directly tested.
  molecular_function:
    id: GO:0030674
    label: protein-macromolecule adaptor activity
  directly_involved_in:
  - id: GO:0032438
    label: melanosome organization
  locations:
