id: Q9H2I8
gene_symbol: LRMDA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  LRMDA is a small leucine-rich-repeat protein that functions in pigment cells as a
  non-catalytic membrane-trafficking adaptor. At the limiting membrane of melanosomes,
  it binds active RAB32-family GTPases and the Retriever subcomplex of Commander,
  coupling Commander to RAB32-positive membranes during melanosome biogenesis. Human
  melanocytic-cell loss of LRMDA disrupts PMEL processing, stage-I-to-stage-II
  melanosome maturation, organelle pH, and melanin content. Biallelic human loss causes
  oculocutaneous albinism type 7, and zebrafish knockdown/rescue supports a conserved
  role in melanocyte differentiation. Nucleoplasmic staining is a secondary
  localization observation without an established nuclear activity. The reviewed
  human protein is 198 residues, whereas the direct RAB32/RAB38-binding,
  melanosome-localization, and Commander studies used a 226-residue human proteoform
  with an alternative N terminus; whether the two proteoforms are functionally
  identical remains unresolved.
