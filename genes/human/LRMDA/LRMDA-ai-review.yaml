- id: PMID:23395477
  title: Mutations in c10orf11, a melanocyte-differentiation gene, cause autosomal-recessive
    albinism.
  full_text_unavailable: true
  findings:
  - statement: >-
      Recessive human C10orf11/LRMDA loss-of-function alleles segregated with
      albinism in the studied families.
    supporting_text: >-
      The region contains five protein-coding genes, and sequencing of one of
      these, C10orf11 , revealed a nonsense mutation that segregated with the
      disease and showed a recessive inheritance pattern.
    reference_section_type: ABSTRACT
  - statement: >-
      In human fetal tissue, C10orf11 was detected in melanoblasts and
      melanocytes but not retinal pigment epithelial cells.
    supporting_text: |-
      Immunohistochemistry showed localization
      of C10orf11 in melanoblasts and melanocytes in human fetal tissue, but no
      localization was seen in retinal pigment epithelial cells.
    reference_section_type: ABSTRACT
  - statement: >-
      Zebrafish orthologue knockdown reduced pigmentation and apparent
      pigmented-melanocyte number, and wild-type but not mutant human C10orf11
      rescued the morphant phenotype.
    supporting_text: |-
      Knockdown of the
      zebrafish (Danio rerio) homolog with the use of morpholinos resulted in
      substantially decreased pigmentation and a reduction of the apparent number of
      pigmented melanocytes. The morphant phenotype was rescued by wild-type C10orf11,
      but not by mutant C10orf11.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Foundational primary evidence combining human genetics and fetal-tissue
      localization with zebrafish morpholino/rescue experiments. The functional
      perturbation is zebrafish, not human or mouse, and the result supports
      pigment-cell development/differentiation without isolating a direct
      melanin-synthesis reaction. The local cache is abstract-only.
- id: PMID:36334630
  title: OCA7 is a melanosome membrane protein that defines pigmentation by regulating
    early stages of melanosome biogenesis.
  findings:
  - statement: >-
      OCA7/LRMDA localizes to the limiting membrane of melanosomes in pigment
      cells.
    supporting_text: |-
      Here, we discover that OCA7 localizes to the
      limiting membrane of melanosomes, the specialized pigment cell organelles where
      melanin is synthesized.
    reference_section_type: ABSTRACT
  - statement: >-
      Recruitment of OCA7/LRMDA depends on the canonical effector-binding
      surface of melanosomal RAB32 and RAB38.
    supporting_text: |-
      We demonstrate that OCA7 is recruited through
      interaction with a canonical effector-binding surface of melanosome proteins
      Rab32 and Rab38.
    reference_section_type: ABSTRACT
  - statement: >-
      OCA7 knockout in human MNT1 cells altered melanin content by impairing
      melanosome maturation in a melanocyte-autonomous setting.
    supporting_text: |-
      Using newly generated OCA7-KO MNT1 cells, we show OCA7
      regulates overall melanin levels in a melanocyte autonomous manner by
      controlling melanosome maturation.
    reference_section_type: ABSTRACT
  - statement: >-
      OCA7 loss perturbed PMEL processing, stage-I-to-stage-II melanosome
      maturation, and melanosome lumen pH.
    supporting_text: |-
      Importantly, we found that OCA7 regulates
      premelanosome protein (PMEL) processing, impacting fibrillation and the
      striations that define transition from melanosome stage I to stage II.
      Furthermore, the melanosome lumen of OCA7-KO cells displays lower pH than
      control cells.
    reference_section_type: ABSTRACT
  - statement: >-
      The 2022 interaction and localization constructs used the 226-residue OCA7
      transcript amplified from MNT1 cells; the candidate 198-residue transcript did
      not amplify in that experiment.
    supporting_text: Attempts to amplify two potential transcript variants of OCA7 encoding a 226 or 198 amino acid protein from MNT1 complementary DNA (cDNA) were only successful for the first, suggesting it is the predominant variant.
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Direct human MNT1-cell evidence for melanosomal localization and a
      cell-autonomous role in organelle maturation and pigmentation. These data
      define a pigment-synthesis/biogenesis mechanism in differentiated cells;
      they do not independently establish embryonic melanocyte differentiation
      or normal in-vivo human physiology. Full text was reviewed. The direct
      RAB32/RAB38-binding and localization constructs used the 226-residue form
      amplified from MNT1 cells, not the reviewed 198-residue Q9H2I8 sequence;
      the knockout phenotype itself remains gene-level evidence.
- id: PMID:41038817
  title: Identification of a RAB32-LRMDA-Commander membrane trafficking complex reveals
    the molecular mechanism of human oculocutaneous albinism type 7.
  findings:
  - statement: >-
      LRMDA can bind Commander and active RAB32 simultaneously, defining a
      distinct RAB32-LRMDA-Commander assembly.
    supporting_text: |-
      Here, we identify
      leucine rich melanocyte differentiation associated (LRMDA) as a Commander
      binding protein. We reveal that LRMDA and SNX17 share a common mechanism of
      Commander association, and that LRMDA simultaneously associates with Commander
      and active RAB32, establishing distinct RAB32-LRMDA-Commander and
      SNX17-Commander assemblies.
    reference_section_type: ABSTRACT
  - statement: >-
      Functional experiments in melanocytes distinguish an
      LRMDA-dependent Commander pathway in melanosome biogenesis.
    supporting_text: |-
      Functional analysis in melanocytes reveals distinct
      roles for RAB32-LRMDA-Commander and SNX17-Commander in melanosome biogenesis.
    reference_section_type: ABSTRACT
  - statement: >-
      OCA7-causing LRMDA mutations disrupt RAB32 and Commander binding, providing
      a mechanistic link from variants to defective pigment-organelle biogenesis.
    supporting_text: |-
      We
      reveal how LRMDA mutations, causative for oculocutaneous albinism type 7, a
      hypopigmentation disorder accompanied by poor visual acuity, uncouple RAB32 and
      Commander binding thereby establishing the mechanistic basis of this disease.
    reference_section_type: ABSTRACT
  - statement: >-
      All experiments in this study used the longer 226-residue LRMDA proteoform
      represented by unreviewed UniProt accession A0A087WWI0, not the reviewed
      198-residue Q9H2I8 record.
    supporting_text: >-
      LRMDA-GFP, LRMDA-GFP(ΔC) and LRMDA-GFP(ΔC) in pEGFP-N3 plasmid were a
      gift from Prof. Santiago di Pietro, and the wild-type sequence encoded the
      longer LRMDA isoform with Uniprot accession A0A087WWI0. This isoform was
      used in all experiments.
    reference_section_type: METHODS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Direct biochemical, cell-biological, and mechanistic evidence for an
      RAB32-LRMDA-Commander adaptor complex in human-cell models. A critical
      proteoform boundary applies: every experiment used A0A087WWI0 (226 aa),
      whose alternative N terminus differs from reviewed Q9H2I8 (198 aa), even
      though the two records share the 177-residue C-terminal region and terminal
      IRDDQL motif. Sequence-numbered interfaces therefore belong directly to
      the tested longer construct and should not be asserted as isoform-specific
      endogenous Q9H2I8 results without further evidence.
