id: P04628
gene_symbol: WNT1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'WNT1 is a secreted, lipid-modified Wnt-family ligand that acts outside producer cells to
  bind Frizzled receptors and activate beta-catenin-dependent canonical Wnt signaling. In humans and vertebrate
  models this signaling module contributes to embryonic central nervous system patterning, midbrain dopaminergic
  neuron biology and osteoblast/bone homeostasis, while cell-culture studies show that WNT1 can drive
  canonical TCF/LEF transcriptional responses through several Frizzled receptors.'
