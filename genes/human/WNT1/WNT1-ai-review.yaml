suggested_questions:
- question: Which human WNT1 receptors and cell types carry the direct canonical ligand signal in
    osteoblast function, bone homeostasis, and midbrain or cerebellar patterning, as opposed to the
    broader proliferation and transcription phenotypes seen in overexpression models?
suggested_experiments:
- description: Use endogenous WNT1 perturbation and receptor-rescue assays in human osteoblast and
    neural progenitor models to connect secreted WNT1 to Frizzled/LRP-dependent beta-catenin
    signaling, bone markers and regional neural patterning readouts.
