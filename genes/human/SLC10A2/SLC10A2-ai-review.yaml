  - UniProtKB:O75841
  review:
    summary: The HuRI systematic binary interactome screen reports an interaction between SLC10A2 and
      UPK1B (UniProtKB:O75841) [PMID:32296183]. The annotation records only the generic term protein
      binding and says nothing about what SLC10A2 does.
    action: REMOVE
    reason: 'GO:0005515 protein binding is uninformative: it asserts that a binding event was seen
      without identifying a molecular function. The source is a proteome-scale yeast two-hybrid map
      [PMID:32296183] that assigns no function to either partner, and nothing in it supports a more
      specific molecular-function term for SLC10A2. Removal does not assert that the reported
      interaction is false; the informative molecular function of this protein is sodium-coupled bile
      acid symport [PMID:9458785, PMID:9856990].'
    supported_by:
    - reference_id: PMID:32296183
      supporting_text: Here we present a human 'all-by-all'
