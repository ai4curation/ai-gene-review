id: Q12908
gene_symbol: SLC10A2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SLC10A2 (ASBT, also IBAT/ISBT, apical sodium-dependent bile acid transporter)
  is the sodium-coupled bile acid uptake carrier of the intestinal and renal epithelium. It is a
  348-residue glycoprotein with a seven-transmembrane-helix topology, a member of the bile
  acid:sodium symporter (BASS, TC 2.A.28) family together with the hepatic carrier SLC10A1/NTCP
  [PMID:15350125]. The protein resides in the apical (brush-border, microvillar) plasma membrane of
  enterocytes of the terminal ileum, where it imports conjugated and unconjugated bile acids from
  the intestinal lumen into the cell [PMID:9856990, PMID:33222321]. Transport is strictly
  sodium-dependent and chloride-independent, electrogenic and bidirectional, and is best explained
  by cotransport of two Na+ ions per bile acid molecule [PMID:9458785, PMID:9856990]. Substrates
  include taurocholate, cholate and the glycine- and taurine-conjugated di- and trihydroxy bile
  acids, with micromolar affinities; unlike the multispecific hepatic carrier, substrate specificity
  is narrow and essentially restricted to bile acids [PMID:9458785]. Transcripts are most abundant
  in terminal ileum and kidney, with lower levels in cecum, and related carriers of the same family
  also operate in biliary and colonic epithelium [PMID:9458785, PMID:19498215]. By performing the
  apical uptake step, SLC10A2 begins the intestinal reclamation of bile acids that recovers the
  great majority of the bile salt pool and returns it to the liver, acting upstream of the
  cytosolic bile acid binding protein FABP6 and the basolateral organic solute transporter
  [PMID:19498215, Reactome:R-HSA-159418]. Loss-of-function variants cause primary bile acid
  malabsorption, with congenital diarrhea, steatorrhea, fecal bile acid wasting, interruption of the
  enterohepatic circulation and reduced plasma cholesterol; dysfunctional alleles such as P290S,
  L243P and T262M reach the plasma membrane normally yet abolish bile acid transport
  [PMID:7592981, PMID:9109432]. The transporter is also a pharmacological target, with ASBT
  inhibitors developed for cholestatic pruritus and metabolic disease [PMID:33222321].
references:
- id: PMID:7592981
  title: Identification of a mutation in the ileal sodium-dependent bile acid transporter gene that
    abolishes transport activity.
  findings:
  - statement: The ileal Na+/bile acid cotransporter mediates reabsorption of bile acids from the
      small intestine.
    supporting_text: The ileal Na+/bile acid cotransporter plays a critical role in the reabsorption
      of bile acids from the small intestine.
  - statement: The P290S substitution abolishes taurocholate transport without altering synthesis or
      subcellular distribution of the transporter, separating catalytic competence from trafficking.
    supporting_text: In transfected COS-1 cells, the single amino acid change abolished taurocholate
      transport activity but did not alter the transporter's synthesis or subcellular distribution.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cloning and first loss-of-function characterization of the human ileal transporter;
      directly supports the TAS transporter-activity and plasma-membrane annotations assigned by
      PINC. Abstract-only in the cache, but the assays named (chimeras, transfected COS-1 uptake,
      sequencing) match what was annotated.
- id: PMID:9109432
  title: Primary bile acid malabsorption caused by mutations in the ileal sodium-dependent bile acid
    transporter gene (SLC10A2).
  findings:
  - statement: SLC10A2 mutations cause primary bile acid malabsorption, establishing the gene's role
      in intestinal reclamation of bile acids.
    supporting_text: These findings establish that SLC10A2 mutations can cause PBAM and underscore
      the ileal Na+/bile acid cotransporter's role in intestinal reclamation of bile acids.
  - statement: The L243P and T262M disease alleles traffic normally to the plasma membrane but
      abolish transport of taurocholate and other bile acids.
    supporting_text: In transfected COS cells, the L243P, T262M, and double mutant (L243P/T262M) did
      not affect transporter protein expression or trafficking to the plasma membrane; however,
      transport of taurocholate and other bile acids was abolished.
  - statement: The clinical phenotype of SLC10A2 deficiency is interruption of the enterohepatic
      circulation of bile acids with diarrhea, steatorrhea and low plasma cholesterol.
    supporting_text: Primary bile acid malabsorption (PBAM) is an idiopathic intestinal disorder
      associated with congenital diarrhea, steatorrhea, interruption of the enterohepatic circulation
      of bile acids, and reduced plasma cholesterol levels.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Disease-gene paper for PBAM1 (MIM 613291) and the source of the PINC TAS rows for
      bile acid sodium symporter activity and plasma membrane. Abstract-only in the cache; the
      trafficking-versus-transport dissection stated in the abstract is exactly what the
      plasma-membrane annotation rests on.
- id: PMID:9458785
  title: Expression and transport properties of the human ileal and renal sodium-dependent bile acid
    transporter.
  findings:
  - statement: Human ileal transporter-mediated taurocholate uptake is strictly Na+-dependent and
      chloride-independent.
    supporting_text: In transiently transfected COS cells, ileal Na(+)-bile acid
      cotransporter-mediated taurocholate uptake was strictly Na+ dependent and chloride independent.
  - statement: Both conjugated and unconjugated bile acids are efficiently transported.
    supporting_text: Analysis of the substrate specificity in transfected COS or CHO cells showed
      that both conjugated and unconjugated bile acids are efficiently transported.
  - statement: The ileal/renal carrier has a narrow specificity for bile acids, in explicit contrast
      to the multispecific liver carrier which handles organic anion metabolites and xenobiotics.
    supporting_text: Whereas the multispecific liver Na(+)-bile acid cotransporter may participate in
      hepatic clearance of organic anion metabolites and xenobiotics, the ileal and renal Na(+)-bile
      acid cotransporter retains a narrow specificity for reclamation of bile acids.
  - statement: The transcript is detected in terminal ileum and kidney, and the kidney cDNA is
      identical to the ileal one.
    supporting_text: Using Northern blot analysis to determine its tissue expression, we readily
      detected the ileal Na(+)-bile acid cotransporter mRNA in terminal ileum and kidney.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary characterization of substrate specificity, ion dependence and tissue
      distribution of the human ileal/renal transporter. This is the reference that establishes the
      specificity contrast with SLC10A1/NTCP, and therefore why no xenobiotic- or organic-anion
      transport term is appropriate for SLC10A2.
- id: PMID:9856990
  title: Bile acid uptake via the human apical sodium-bile acid cotransporter is electrogenic.
  findings:
  - statement: Intestinal bile acid absorption depends on a sodium-bile acid cotransport protein
      located in the apical membrane of the ileal epithelial cell.
    supporting_text: Intestinal absorption of bile acids depends on a sodium-bile acid cotransport
      protein in the apical membrane of the ileal epithelial cell.
  - statement: Transport by the human apical transporter is electrogenic and bidirectional with a 2:1
      Na+ to bile acid coupling stoichiometry, measured in voltage-clamped single cells.
    supporting_text: These results indicate that the cotransport of bile acids and Na+ by human
      apical sodium-bile acid transporter is electrogenic and bidirectional and is best explained by a
      2:1 Na+:bile acid coupling stoichiometry.
  - statement: Lowering extracellular Na+ three-fold shifted the flux-voltage relationship by -52 mV,
      the shift expected for two Na+ per bile acid.
    supporting_text: A 3-fold reduction in extracellular Na+ produced a negative 52 mV shift of the
      flux-voltage relationship, consistent with a 2:1 Na+:bile acid coupling stoichiometry.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct electrophysiological determination of the sodium stoichiometry of the human
      protein in stably transfected CHO cells lacking other bile acid transporters. This is the
      evidence that the sodium leg of the symport is work the protein itself performs, and so the
      basis for the proposed GO:0098719 annotation. Abstract-only in the cache, but the abstract
      states the method, the result and the control.
- id: PMID:15350125
  title: Topology scanning and putative three-dimensional structure of the extracellular binding
    domains of the apical sodium-dependent bile acid transporter (SLC10A2).
  findings:
  - statement: ASBT facilitates the enterohepatic circulation of bile salts and is important for
      cholesterol metabolism.
    supporting_text: The apical sodium-dependent bile acid transporter (ASBT, SLC10A2) facilitates
      the enterohepatic circulation of bile salts and plays a key role in cholesterol metabolism.
  - statement: A seven-transmembrane topology was confirmed experimentally by glycosylation-scanning
      mutagenesis of inserted reporter sites.
    supporting_text: Membrane topology was further evaluated and confirmed by N-glycosylation-scanning
      mutagenesis, as reporter sites inserted in the putative extracellular loops 1 and 3 were
      glycosylated.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Supports the multi-pass membrane architecture and provides a structural
      rationalization of the P290S transport-null allele. Not the source of any GOA row; used here as
      corroborating structural context.
- id: PMID:19498215
  title: Bile acid transporters.
  findings:
  - statement: Bile acids are almost quantitatively reclaimed in the ileum by the apical
      sodium-dependent bile acid transporter after entering the small intestinal lumen.
    supporting_text: Following their movement with bile into the lumen of the small intestine, bile
      acids are almost quantitatively reclaimed in the ileum by the apical sodium-dependent bile acid
      transporter.
  - statement: Beyond hepatocytes and enterocytes, members of this transporter group act in biliary,
      renal and colonic epithelium.
    supporting_text: In addition to the hepatocyte and enterocyte, subgroups of these bile acid
      transporters are expressed by the biliary, renal, and colonic epithelium where they contribute
      to maintaining bile acid homeostasis and play important cytoprotective roles.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Authoritative review by the group that cloned the human transporter; used for the
      pathway position and tissue breadth statements rather than as primary evidence.
- id: PMID:33222321
  title: Targeting the Four Pillars of Enterohepatic Bile Salt Cycling; Lessons From Genetics and
    Pharmacology.
  findings:
  - statement: Conjugated bile salts enter primarily terminal ileal enterocytes through the apical
      sodium-dependent bile acid transporter encoded by SLC10A2, which is the first of four
      transporters of the enterohepatic cycle.
    supporting_text: conjugated bile salts cross the otherwise impermeable lipid bilayer of (primarily
      terminal ileal) enterocytes through the apical sodium-dependent bile acid transporter (gene
      SLC10A2)
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text available in the cache. Cited by UniProt for the statement that SLC10A2
      works together with NTCP, OST-alpha/beta and BSEP in enterohepatic recycling; also the source
      for ASBT as a drug target. Supports the apical localization of the human protein.
- id: PMID:32296183
  title: A reference map of the human binary protein interactome.
  findings: []
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: HuRI systematic yeast two-hybrid map; correctly cited but functionally
      uninformative, and the source of ten generic protein binding rows recommended for removal.
- id: PMID:33961781
  title: Dual proteome-scale networks reveal cell-specific remodeling of the human interactome.
  findings:
  - statement: The study is a proteome-scale affinity-purification mass spectrometry survey (BioPlex
      3.0 in 293T cells plus an HCT116 network), not a focused study of any one protein.
    supporting_text: Through affinity-purification mass spectrometry, we have created two
      proteome-scale, cell-line-specific interaction networks.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Verified as the Huttlin et al. Cell 2021 BioPlex 3.0/HCT116 paper, a proteome-wide
      AP-MS interactome resource. It is correctly cited for the SLC10A2-CLPTM1 co-purification but
      assigns no molecular function to SLC10A2, so it cannot license an informative replacement term.
- id: PMID:40355756
  title: The solute carrier superfamily interactome.
  findings:
  - statement: The study mapped protein-protein interactions of 396 solute carriers by interaction
      proteomics as a global survey, not as functional assignment for individual carriers.
    supporting_text: We aimed at obtaining a global survey of the SLC-protein interaction landscape
      and mapped the protein-protein interactions of 396 SLCs by interaction proteomics.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Interaction-proteomics survey of 396 SLCs; correctly cited, and it independently
      reproduces the SLC10A2-CLPTM1 interaction, but it assigns no molecular function to SLC10A2.
- id: Reactome:R-HSA-194187
  title: SLC10A2 transports bile salts and acids and Na+ from extracellular region to cytosol
  findings:
  - statement: ASBT is expressed on the apical surface of enterocytes and its transport reaction is
      the first step of intestinal bile salt reabsorption.
    supporting_text: In the body, ASBT is expressed on the apical surfaces of enterocytes, and this
      reaction is the first step in the process by which bile salts and acids are reaborbed from the
      intestinal lumen and returned to the liver
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Reactome reaction underlying the TAS rows for GO:0008508 and GO:0005886. One
      caveat that does not affect the GO terms: the reaction is written with a single sodium ion,
      whereas the human protein was measured at a 2:1 Na+ to bile acid stoichiometry [PMID:9856990]
      and UniProt''s curated RHEA reactions use two Na+.'
- id: Reactome:R-HSA-159418
  title: Recycling of bile acids and salts
  findings:
  - statement: Recycling of bile acids begins with uptake by enterocytes mediated by ASBT (SLC10A2),
      followed by FABP6-mediated cytosolic traversal and basolateral efflux.
    supporting_text: 'This recycling involves a series of transport processes: uptake by enterocytes
      mediated by ASBT (SLC10A2), traversal of the enterocyte cytosol mediated by ileal bile acid
      binding protein (I-BABP - FABP6), efflux from enterocytes mediated by MRP3 (ABCC3)'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Pathway-level Reactome entry supporting the TAS row for GO:0015721; places SLC10A2
      correctly as the apical uptake step of the enterohepatic cycle.
