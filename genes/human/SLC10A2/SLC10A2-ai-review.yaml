- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - MGI:MGI:1201406
  - PANTHER:PTN000040759
  - RGD:3681
  - RGD:3682
  - UniProtKB:Q14973
  - UniProtKB:Q96EP9
  review:
    summary: PAINT places plasma-membrane activity at an ancestral SLC10 node (PANTHER:PTN000040759)
