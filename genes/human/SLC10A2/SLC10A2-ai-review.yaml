- term:
    id: GO:0098719
    label: sodium ion import across plasma membrane
  evidence_type: IDA
  original_reference_id: PMID:9856990
  qualifier: involved_in
  review:
    summary: SLC10A2 carries sodium into the enterocyte as the coupling ion of bile acid symport.
      Voltage-clamp measurements on the human protein expressed in CHO cells lacking other bile acid
      transporters showed that transport is electrogenic and that lowering extracellular Na+
      three-fold shifted the flux-voltage relationship by -52 mV, indicating two Na+ translocated per
      bile acid [PMID:9856990]. No sodium-transport term is currently annotated to the gene.
    action: NEW
    reason: 'Participation test. The sodium leg of the symport is work the protein itself performs,
      because the same transport cycle moves the Na+ ions and the bile acid, and the ion movement was
      measured directly as current carried by the human transporter with non-transfected cells as the
      negative control [PMID:9856990]. This is not a necessity or substrate argument, since the
      protein is the entity that translocates the ion. Direction and location match the term
      definition (the directed movement of sodium ions from outside of a cell, across the plasma
      membrane and into the cytosol, per OLS), since uptake is from the intestinal lumen across the
      apical membrane into the enterocyte.

      Comparator check (QuickGO, 2026-10-04). Sodium-coupled symporters conventionally carry a
      sodium-transport process term alongside their solute term. SLC5A1/SGLT1 (UniProtKB:P13866)
      carries GO:0098719 by IDA, SLC34A1/NaPi-IIa (UniProtKB:Q06495) carries GO:0098719, and
      SLC5A5/NIS (UniProtKB:Q92911) carries GO:0006814 sodium ion transport by IBA and GO:0035725 by
      IEA. The term is therefore conventionally applied to exactly this role. Within SLC10 it is
      absent from SLC10A2, from SLC10A1 and from mouse Slc10a2 alike, i.e. a family-level gap rather
      than a cross-family convention that would argue against the term.

      Non-redundancy and scope. GO:0098719 is neither an ancestor nor a descendant of GO:0015721 bile
      acid and bile salt transport, and the plasma-membrane-specific import term was chosen over the
      broader GO:0035725 because both direction and compartment are experimentally established.
      gocams/index.tsv contains no model for SLC10A2 or Q12908, so no curator has already placed this
      gene in the pathway with a different term.'
    additional_reference_ids:
    - PMID:9458785
    supported_by:
    - reference_id: PMID:9856990
      supporting_text: These results indicate that the cotransport of bile acids and Na+ by human
        apical sodium-bile acid transporter is electrogenic and bidirectional and is best explained by
        a 2:1 Na+:bile acid coupling stoichiometry.
    - reference_id: PMID:9856990
      supporting_text: A 3-fold reduction in extracellular Na+ produced a negative 52 mV shift of the
        flux-voltage relationship, consistent with a 2:1 Na+:bile acid coupling stoichiometry.
    - reference_id: PMID:9458785
      supporting_text: In transiently transfected COS cells, ileal Na(+)-bile acid
        cotransporter-mediated taurocholate uptake was strictly Na+ dependent and chloride
        independent.
core_functions:
- description: Sodium-coupled import of conjugated and unconjugated bile acids across the apical
    (brush-border) plasma membrane of ileal enterocytes, and of renal proximal tubule cells. The human
    transporter is strictly Na+-dependent and chloride-independent, electrogenic and bidirectional,
    and co-transports approximately two Na+ ions per bile acid molecule, with micromolar affinity for
    taurocholate, cholate and the glyco-conjugated bile acids. This uptake step initiates the
    intestinal reclamation that returns the great majority of the bile salt pool to the liver, and its
    loss causes primary bile acid malabsorption.
