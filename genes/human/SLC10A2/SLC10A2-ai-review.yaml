      both conjugated and unconjugated bile acids are efficiently transported.
  - reference_id: PMID:9856990
    supporting_text: These results indicate that the cotransport of bile acids and Na+ by human apical
      sodium-bile acid transporter is electrogenic and bidirectional and is best explained by a 2:1
      Na+:bile acid coupling stoichiometry.
  - reference_id: PMID:9856990
    supporting_text: Intestinal absorption of bile acids depends on a sodium-bile acid cotransport
      protein in the apical membrane of the ileal epithelial cell.
  - reference_id: PMID:19498215
    supporting_text: Following their movement with bile into the lumen of the small intestine, bile
      acids are almost quantitatively reclaimed in the ileum by the apical sodium-dependent bile acid
      transporter.
  - reference_id: PMID:9109432
    supporting_text: These findings establish that SLC10A2 mutations can cause PBAM and underscore the
      ileal Na+/bile acid cotransporter's role in intestinal reclamation of bile acids.
proposed_new_terms: []
suggested_questions:
- question: GO has no process term for the enterohepatic circulation of bile acids (an OLS search
    returns no GO match for enterohepatic), so the apical ileal uptake step and the hepatic
    basolateral uptake step are both represented only by GO:0015721 bile acid and bile salt transport
    plus a location. Would a process term for intestinal bile acid reabsorption be useful, and is
    there a comparator set, for example the intestinal absorption terms already used for other
    nutrients, that would anchor it?
- question: SLC10A2 interacts with CLPTM1 (UniProtKB:O96005) reproducibly, by two independent methods
    and in two independent studies [PMID:33961781, PMID:40355756]. CLPTM1 is a putative lipid
    scramblase of internal membranes. Is there targeted evidence that this interaction affects ASBT
    folding, trafficking to the brush border, or activity, which would justify a specific functional
    or complex annotation in place of the removed generic protein binding rows?
- question: Should the sodium stoichiometry discrepancy between Reactome R-HSA-194187 (one Na+ per
    bile acid) and the experimental and UniProt/RHEA value (two Na+) be reconciled in the Reactome
    reaction, given that the 2 to 1 coupling was measured directly for the human protein
    [PMID:9856990]?
- question: UniProt records a renal proximal-tubule bile acid salvage role as Probable, resting on
    detection of an identical transcript in kidney [PMID:9458785] rather than on transport assays in
    renal cells. Is there sufficient evidence to annotate a kidney-specific role, and would GO want
    that expressed as a separate annotation or left to expression data?
- question: Within the SLC10 family neither SLC10A2 nor SLC10A1 carries any sodium-transport process
    term, although SGLT1, NaPi-IIa and NIS all do. Is this a deliberate convention for the bile
    acid sodium symporter family, or an omission that the PAINT node for the clade should be updated
    to cover?
suggested_experiments:
- description: Immunolocalization of endogenous human ASBT in terminal ileal biopsies with
    brush-border and basolateral markers, to provide human-specific evidence for the apical and
    microvillar localization that currently rests on orthologue transfer from mouse Slc10a2.
- description: Reconstitution of purified human ASBT in proteoliposomes with simultaneous
    radiolabelled bile acid flux and Na+ flux measurement, to fix the coupling stoichiometry
    independently of membrane-potential inference and to settle the Reactome versus RHEA discrepancy.
- description: Quantitative substrate profiling of human ASBT against a panel of bile acids, sulfated
    steroids and clinically used drugs side by side with human NTCP under identical conditions, to
    delimit how much narrower the ileal carrier's specificity really is than the hepatic one
    [PMID:9458785].
- description: CLPTM1 knockout or knockdown in an ASBT-expressing polarized intestinal epithelial
    model, for example differentiated Caco-2 cells or ileal enteroids, scoring ASBT surface
    abundance, apical polarity and taurocholate uptake, to test whether the reproducible CLPTM1
    interaction has a functional consequence.
- description: Deep mutational scanning of SLC10A2 in a transport-coupled selection assay, reporting
    separately on surface delivery and on transport activity, to classify variants of uncertain
    significance in primary bile acid malabsorption along the trafficking-competent but transport-null
    axis exemplified by P290S, L243P and T262M [PMID:7592981, PMID:9109432].
