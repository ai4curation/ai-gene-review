  review:
    summary: The BioPlex 3.0 / HCT116 proteome-scale affinity-purification mass spectrometry survey
      reports co-purification of SLC10A2 with CLPTM1 (UniProtKB:O96005) [PMID:33961781]. The
      annotation records only generic protein binding.
    action: REMOVE
    reason: 'PMID:33961781 is the Huttlin et al. dual proteome-scale AP-MS interactome resource, not
      a focused study of SLC10A2 or CLPTM1: it created two cell-line-specific networks covering half
      the proteome and assigns no molecular function to individual pairs [PMID:33961781]. CLPTM1 is
      a putative lipid scramblase of internal membranes and a common companion of multi-pass membrane
      proteins in affinity proteomics, so the co-purification does not license an informative
      replacement term for SLC10A2, whose characterized molecular function is sodium-coupled bile
      acid symport [PMID:9856990]. Per repo policy the generic term is removed as uninformative
      rather than marked over-annotated; this does not dispute the interaction, which is reproduced
      independently in PMID:40355756 and is worth following up (see suggested_questions).'
