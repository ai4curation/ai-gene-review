    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:40355756
  qualifier: enables
  supporting_entities:
  - UniProtKB:O96005
  review:
    summary: The solute carrier superfamily interactome survey independently reports the
      SLC10A2-CLPTM1 (UniProtKB:O96005) interaction [PMID:40355756], again as generic protein
      binding.
    action: REMOVE
    reason: As with the HuRI and BioPlex rows, GO:0005515 conveys no functional information. The
      cited study is an interaction-proteomics survey whose stated aim is a global map of SLC-protein
      interactions rather than functional assignment [PMID:40355756]. That the CLPTM1 interaction is
      reproduced by two independent methods makes it a credible interaction, but an interaction with
      a putative lipid scramblase does not by itself identify a molecular function for SLC10A2, and
      inventing one from interaction evidence alone is not permitted. Removal is a statement about
      the term, not about the interaction.
