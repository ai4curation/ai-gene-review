- id: PMID:37101575
  title: Radical SAM Enzymes Involved in Tetrapyrrole Biosynthesis and Insertion.
  findings:
  - statement: >-
      Review distinguishing the catalytic radical SAM enzymes of tetrapyrrole biosynthesis
      (CgdH/HemN, AhbC, AhbD, NirJ, BchE) from HemW, the structurally related cytoplasmic
      heme chaperone that inserts heme into enzymes.
    supporting_text: heme is inserted into enzymes by the cytoplasmic heme chaperone HemW, a radical
      SAM enzyme structurally highly related to CgdH
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full text available. Authoritative review from the Jahn and Layer groups placing HemW
      outside the biosynthetic enzymes; used as context for the family-level argument rather
      than for a human-specific claim.
- id: PMID:34311096
  title: Mycobacterium lepromatosis MLPM_5000 is a potential heme chaperone protein
    HemW and mis-annotation of its orthologues in mycobacteria.
  findings:
  - statement: >-
      HemW-like proteins lack the fourth cysteine of the HemN CX3CX2CXC motif, and genes
      annotated as mycobacterial HemN are in fact HemW orthologues, i.e. the HemN annotation
      of this clade is a systematic mis-annotation in protein databases.
    supporting_text: Therefore, the current annotations of mycobacterial HemN sequences should be
      corrected to heme chaperone 'HemW' in various protein databases
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified; abstract-only in the cache and bioinformatic and simulation-based rather
      than experimental, so it is cited only as corroboration of the HemN-to-HemW
      mis-annotation pattern that produced the coproporphyrinogen oxidase rows here.
