- id: PMID:42736308
  title: Redox cycling of viral RNA polymerase controls picornavirus replication.
  findings:
  - statement: >-
      RSAD1 is reported to catalyse methionine oxidation of the picornaviral 3D RNA polymerase
      (FMDV, EV71, EMCV), promoting its ubiquitination, aggregation and autophagic
      degradation; the effect requires the SAM domain and the cluster-binding cysteines, and
      Rsad1 knockout mice are more susceptible to picornavirus challenge.
    supporting_text: radical SAM domain-containing protein 1 (RSAD1) catalyzes methionine oxidation
      of FMDV 3D polymerase and promotes its aggregation and subsequent degradation through the
      autophagy-lysosome pathway
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: >-
      Full text available in the cache; title and content checked against PubMed. Flagged
      UNVERIFIED rather than VERIFIED for the functional claim: this is a single 2026 study,
      performed largely in porcine cells and mice with a viral substrate, proposing an
      unusual chemistry (net oxidation of a methionine thioether) for a radical SAM protein.
      It is recorded here as a lead for suggested experiments and is deliberately not used to
      assert a molecular function or a defence-response process annotation.
- id: PMID:31036833
  title: Exome sequencing in patients with chronic central serous chorioretinopathy.
  findings:
  - statement: >-
      Rare-variant burden testing associated RSAD1 (among PIGZ, DUOX1 and LAMB3) with chronic
      central serous chorioretinopathy in female patients only, an association the authors
      state requires replication.
    supporting_text: but replication of these findings in additional cohorts of cCSC patients is
      necessary
  reference_review:
    relevance: LOW
    correctness: LOW_QUALITY
    review_notes: >-
      PubMed-verified; abstract-only in the cache. Sex-stratified gene-based burden
      association in a small cohort with no functional follow-up and an explicit call for
