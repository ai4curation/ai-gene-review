  - statement: >-
      Purified HemW contains an Fe-S cluster, is dimeric when the cluster is intact, and binds
      haem b covalently at one haem per monomer; in vivo it occurs as a haem-free cytosolic
      form and a haem-loaded membrane-associated form, and membranes trigger haem release,
      suggesting a haem trafficking role.
