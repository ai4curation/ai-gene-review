id: Q9HA92
gene_symbol: RSAD1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  RSAD1 is a mitochondrial member of the radical S-adenosyl-L-methionine (SAM) superfamily
  and the human representative of the HemW subfamily of the anaerobic
  coproporphyrinogen-III oxidase (HemN-like) family. The protein carries a radical SAM core
  domain with the three-cysteine motif that ligates a single redox-active [4Fe-4S] cluster,
  which can be reduced to the [4Fe-4S]+ state, together with a C-terminal HemN_C domain and a
  predicted N-terminal mitochondrial transit peptide. Purified human RSAD1 binds
  protoporphyrin IX and its metal derivatives, including heme b, and the resulting
  [4Fe-4S]-heme protein binds the diatomic ligands oxygen and carbon monoxide as well as
  cyanide. Its bacterial orthologues (HemW of Escherichia coli and Lactococcus lactis) bind
  one heme per subunit, interact with heme-containing respiratory subunits and with
  bacterioferritins, and transfer their bound heme to a heme-depleted, inactive respiratory
  nitrate reductase in a manner requiring an intact iron-sulfur cluster, which is the basis
  for describing this protein family as heme chaperones that insert heme b into hemoproteins.
  Unlike the catalytic HemN proteins of the sister subfamily, HemW proteins lack
  oxygen-independent coproporphyrinogen III dehydrogenase (oxidase) activity, and no reaction
  catalysed by RSAD1 has been established: whether the human protein performs heme insertion
  itself, which hemoproteins it would serve, and whether it uses SAM-derived radical chemistry
  at all remain unknown. A single recent study reports that RSAD1 oxidizes methionine residues
  of picornaviral 3D RNA polymerases, destabilizing them, but this activity has not been
  confirmed independently. Rare variants in RSAD1 have been associated, in females only, with
  chronic central serous chorioretinopathy in an exome burden analysis awaiting replication.
