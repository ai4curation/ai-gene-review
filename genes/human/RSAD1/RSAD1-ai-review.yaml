      RSAD1 is a member of MitoCoP, a high-confidence human mitochondrial proteome of 1,134
      protein-coding genes assembled from subtractive proteomics, spatial proteomics,
      importomics and stringent curation.
    supporting_text: We defined a human mitochondrial high-confidence proteome (MitoCoP) of 1,134
      protein-coding genes
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full text available in the cache. High-throughput but stringently filtered; corroborates
