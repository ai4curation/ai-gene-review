core_functions:
- description: >-
    RSAD1 binds heme b (and protoporphyrin IX and other metalloporphyrins) in the
    mitochondrion, as a [4Fe-4S]-containing radical SAM-fold protein. In the bacterial
    orthologues this binding is the first step of heme chaperoning - transfer of the bound
    heme into apo-hemoproteins of the respiratory chain - but for the human protein only the
    binding, not the transfer, has been demonstrated, so no heme-insertion process term is
    asserted here.
