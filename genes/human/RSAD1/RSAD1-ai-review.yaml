  review:
    summary: >-
      Phylogenetic inference that RSAD1 participates in tetrapyrrole biosynthesis, propagated
      from an ancestral node whose descendant evidence comes from HemN-type bacterial and
      cyanobacterial proteins that catalyse the coproporphyrinogen III step of heme
      biosynthesis. RSAD1 belongs to the HemW subfamily, which does not perform that step
      (PMID:22142238; PMID:29282292), and whose characterized role - binding heme and
      delivering it to hemoproteins - lies downstream of porphyrin biosynthesis.
    action: REMOVE
    reason: >-
      This is an argument with the node placement, not with the number of donors. The
      biosynthetic function was placed at a node that subsumes both the catalytic HemN clade
      and the HemW clade, but HemW-like proteins form a distinct clade in which the
      coproporphyrinogen dehydrogenase chemistry is absent - demonstrated by direct in vivo
      and in vitro assay in L. lactis (PMID:22142238) and reflected in the loss of the fourth
      motif cysteine (PMID:34311096). RSAD1 is therefore outside the clade that inherited the
      biosynthetic step. Its own characterized property, heme binding and handover, acts on
      the finished tetrapyrrole and so does not place it in porphyrin biosynthesis either:
      the gene does none of the work of making a porphyrin.
