- id: PMID:29282292
  title: The radical SAM protein HemW is a heme chaperone.
  findings:
  - statement: >-
      Bacterial HemW binds one heme per subunit, requires an intact iron-sulfur cluster for
      dimerization and for heme transfer (but not for heme binding), interacts with
      bacterioferritins and with the heme-containing NarI subunit of respiratory nitrate
      reductase, and transfers its covalently bound heme to a heme-depleted, inactive nitrate
      reductase, restoring activity.
    supporting_text: Of note, heme that was covalently bound to HemW was actively transferred to a
  - statement: >-
      The human orthologue RSAD1 stably binds heme, leading the authors to conclude that the
      whole HemW/RSAD1 family acts as heme chaperones.
    supporting_text: domain-containing 1 (RSAD1) stably bound heme. In conclusion, our findings
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified; this is the reference GOA cites for the IDA heme binding annotation and
      the source of UniProt's "Putative heme chaperone" alternative name. Abstract-only in the
      cache (full_text_available: false), so quotes are from the abstract; the human
      experiment establishes heme binding, while the transfer and insertion experiments are on
      bacterial HemW.
- id: PMID:34800366
