suggested_questions:
- question: >-
    Does human RSAD1 transfer its bound heme into a specific mitochondrial apo-hemoprotein,
    as bacterial HemW does with respiratory nitrate reductase, and which protein is the
    acceptor?
  experts:
  - Dieter Jahn
  - Martina Jahn
  - Gunhild Layer
- question: >-
    Is the [4Fe-4S] cluster of RSAD1 used for radical SAM chemistry, or only for the
    dimerization and heme-handover function it serves in bacterial HemW?
  experts:
  - Joan B Broderick
  - William E Broderick
  - Squire J Booker
- question: >-
    Is the reported methionine-oxidation activity of RSAD1 on picornaviral 3D polymerases
    reproducible with a cluster-loaded human enzyme, and does it act on endogenous
    mitochondrial substrates?
  experts:
  - Joan B Broderick
  - Squire J Booker
- question: >-
    Does RSAD1 have a role in heme trafficking between the mitochondrion and the rest of the
    cell, given that its bacterial counterpart cycles between a heme-free cytosolic and a
    heme-loaded membrane-associated form?
  experts:
  - Dieter Jahn
  - Marc Solioz
suggested_experiments:
- hypothesis: >-
    RSAD1 is a mitochondrial heme chaperone that delivers heme b to one or more apo-subunits
    of the respiratory chain.
  description: >-
    Map the RSAD1 interactome in human mitochondria by proximity labelling and by
    immunoprecipitation from cells grown under heme-limiting and heme-replete conditions,
    then test cluster-dependent heme transfer in vitro from heme-loaded, reconstituted RSAD1
    to each candidate apo-hemoprotein, reading out restored holoprotein spectrum and
    enzymatic activity as was done for bacterial HemW and nitrate reductase.
  experiment_type: interactomics plus in vitro heme transfer assay
- hypothesis: RSAD1 performs reductive SAM cleavage and therefore has a genuine radical SAM activity.
  description: >-
    With anaerobically reconstituted human RSAD1, quantify 5'-deoxyadenosine and methionine
    formation under reducing conditions in the apo-, heme-loaded and partner-bound states,
    comparing wild type with cluster-ligand cysteine mutants, to establish whether SAM is
    cleaved at all and whether cleavage is coupled to heme handover.
  experiment_type: anaerobic enzymology / SAM cleavage assay
- hypothesis: Loss of RSAD1 impairs maturation of a mitochondrial hemoprotein.
  description: >-
    Generate RSAD1 knockout human cell lines and assay respiratory complex assembly and
    activity, cytochrome spectra, total and labile heme pools, and heme-dependent enzyme
    activities, with rescue by wild type versus cluster-binding and heme-binding mutants to
    establish which molecular property is required.
  experiment_type: cell-based loss-of-function with biochemical phenotyping
