    label: angiogenesis
  evidence_type: IMP
  original_reference_id: PMID:25705373
  qualifier: acts_upstream_of_or_within_positive_effect
  review:
    action: KEEP_AS_NON_CORE
    summary: Gamma-actin supports maintenance of capillary-like networks in endothelial culture.
    reason: In human HMEC-1 and BMH29L endothelial models, ACTG1 depletion impairs motility and maintenance
      of capillary-like networks. Tube formation can initiate before regression, so this does not
      establish failure of angiogenic initiation. Retain the culture-specific phenotype as non-core
      to ACTG1's broadly deployed cytoskeletal function.
    supported_by:
    - reference_id: PMID:25705373
- term:
    id: GO:0001738
    label: morphogenesis of a polarized epithelium
  evidence_type: IMP
  original_reference_id: PMID:22855531
  qualifier: involved_in
  review:
    action: KEEP_AS_NON_CORE
    summary: ACTG1 contributes to polarized epithelial cyst morphogenesis.
    reason: The original paper's Figure 11 shows impaired lumen-bearing cyst formation after gamma-actin
      depletion in human Caco-2 BBE cells. This supports the morphogenesis term, although apicobasal
      polarity in planar SK-CO15 monolayers was selectively beta-actin dependent. Retain this epithelial
      context as non-core.
    supported_by:
    - reference_id: PMID:22855531
