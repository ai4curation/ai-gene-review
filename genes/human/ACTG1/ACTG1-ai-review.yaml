core_functions:
- description: Polymerizes into actin filaments that provide cytoskeletal structure and contribute
    directly to cell movement; binds profilin within the actin assembly system. This structural role
    includes specialized actin networks such as stereocilia and the postsynaptic cytoskeleton.
