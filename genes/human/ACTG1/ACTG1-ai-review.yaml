id: P63261
gene_symbol: ACTG1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ACTG1 encodes cytoplasmic gamma-actin, a widely expressed actin isoform that polymerizes
  with cytoplasmic beta-actin into cytoskeletal filaments. These filaments provide structural support
  for cell shape, movement and junctional organization, and contribute to specialized structures including
  sensory hair-cell stereocilia and the postsynaptic actin cytoskeleton. ACTG1 binds profilin and
  other actin-associated proteins and undergoes intrinsic ATP hydrolysis as part of the nucleotide
  cycle coupled to filament assembly and turnover. Pathogenic ACTG1 variants cause autosomal dominant
  nonsyndromic sensorineural hearing loss (DFNA20/26) and Baraitser-Winter syndrome 2, a developmental
  disorder involving brain malformations and ocular coloboma.
