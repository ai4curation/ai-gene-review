suggested_questions:
- question: Does beta-actin expressed from the endogenous Actg1 locus preserve stereocilia integrity
    and auditory function beyond 16 weeks and during noise-induced damage, or do these conditions
    reveal a protein-sequence-dependent difference?
suggested_experiments:
- hypothesis: The functional substitution observed at 16 weeks may persist during aging and acoustic
    stress; a gamma-specific limitation under these conditions remains untested by the cited coding-replacement
    study.
  description: Compare wild-type and Actg1 coding-beta mice at later matched ages and after a defined
    acoustic challenge, using auditory brainstem responses and stereocilia ultrastructure. Measure
    total actin abundance and local filament distribution alongside function to distinguish differences
    in protein sequence from expression or localization effects.
  experiment_type: Longitudinal genetic replacement comparison with auditory physiology and stereocilia
    imaging
