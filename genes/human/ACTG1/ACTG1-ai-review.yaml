  title: Gamma-actin is required for cytoskeletal maintenance but not development.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Identifier/title checked against primary PubMed/PMC or publisher article; access
      scope and scientific limits below. Native abstract only; primary PMC full Results, Methods and
      figures inspected externally. The null-mouse developmental/maintenance comparison and noise-damage
      redistribution experiment use different species: mouse knockout versus noise-exposed guinea
      pig. Beta-actin also accumulates at core gaps; redistribution alone does not demonstrate gamma-exclusive
      repair. Whole-gene loss does not isolate an indispensable gamma protein sequence function; interpret
      alongside the 2025 Actg1 coding-beta replacement.'
- id: PMID:20308063
  title: Ion-dependent polymerization differences between mammalian beta- and gamma-nonmuscle actin
    isoforms.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Identifier/title checked against primary PubMed/PMC or publisher article; access
      scope and scientific limits below. Native abstract only; primary PMC Methods, Table 1 and polymerization/phosphate-release
      Results inspected externally. Baculovirus/Sf21 preparations contain 20–25% insect actin; not
      chemically pure human isoforms. Authors tested mixture controls. The phosphate-release assay
      does not by itself separate hydrolysis chemistry from product-release kinetics. Cation-dependent
      in vitro differences do not establish universal intracellular isoform segregation or an indispensable
      gamma-specific role. Actin ATP chemistry is distinct from myosin motor ATPase chemistry. Human
      coding constructs are described without a purification affinity tag. The abstract uses Asp1–3/Glu1–3
      and Val10/Ile10 numbering; other papers use precursor positions 2–4, so do not silently merge
      residue-number conventions.
