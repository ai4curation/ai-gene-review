    review_notes: Identifier/title checked against primary PubMed/PMC or publisher article; access
      scope and scientific limits below. Full native XML-derived text and primary publisher Results/Methods/Figures
      inspected. Coding replacement is not Actg1 gene deletion. It does not refute the earlier gene-null
      phenotype or negate normal gamma-actin structural participation. No lifetime, noise-injury,
      human, or every-neuronal-cell-type equivalence was established. Most other phenotypes were examined
      at 3 months; survival followed to P180. G:F actin ratio was not newly measured in these replacement
      MEFs; the authors inferred no need to measure it from prior null data and SRF/MRTF/YAP results.
      Do not report a new direct G:F assay.
