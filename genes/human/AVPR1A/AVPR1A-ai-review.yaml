id: P37288
gene_symbol: AVPR1A
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: AVPR1A encodes the V1a vasopressin receptor, a class A seven-transmembrane G protein-coupled
  receptor in the plasma membrane that binds the neurohypophysial nonapeptide arginine vasopressin (AVP)
  at its extracellular face. It couples to Gq/11, activating phospholipase C, producing inositol trisphosphate
  and mobilizing calcium. It is expressed in vascular smooth muscle, liver, heart, kidney, platelets and
  brain. It mediates the vasopressor (vasoconstrictor) action of AVP and hepatic glycogenolysis, and in
  the brain modulates social, affiliative and maternal behaviors. After agonist binding the receptor is
  internalized through beta-arrestin and rapidly recycled to the cell surface. It can form heteromers
  with V2R and with ACKR3 in vascular smooth muscle.
