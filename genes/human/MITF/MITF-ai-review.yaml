core_functions:
- description: 'Sequence-specific DNA-binding transcription activator: as a homo- or heterodimer (with
    TFE3/TFEB/TFEC), MITF binds E-box/M-box elements in RNA polymerase II cis-regulatory regions and activates
    transcription of target genes. Experimentally established for human MITF.'
  molecular_function:
    id: GO:0001228
    label: DNA-binding transcription activator activity, RNA polymerase II-specific
  directly_involved_in:
  - id: GO:0045944
    label: positive regulation of transcription by RNA polymerase II
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:27889061
    supporting_text: strong M-box (TCATGTG) and E-box (CACGTG) binding
  - reference_id: PMID:8995290
    supporting_text: MITF overexpression increased the expression of a reporter gene under the control
      of the human tyrosinase or TRP-1 gene promoter
- description: Master transcriptional regulator of the melanocyte (and RPE) differentiation program, directly
    activating melanogenic genes such as TYR, TYRP1 and MC1R. Established for MITF across tetrapods (PAINT
    node PTN000000820) and consistent with human pigmentation disorders caused by MITF variants.
  molecular_function:
    id: GO:0000978
    label: RNA polymerase II cis-regulatory region sequence-specific DNA binding
  directly_involved_in:
  - id: GO:0030318
    label: melanocyte differentiation
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: file:human/MITF/MITF-uniprot.txt
    record_section: ["CC:FUNCTION"]
    supporting_text: Transcription factor that acts as a master regulator of melanocyte survival and differentiation
      as well as melanosome biogenesis
  - reference_id: PMID:9647758
    supporting_text: MITF-A activated transcription of the tyrosinase and tyrosinase-related protein 1
      genes
suggested_questions:
- question: MITF-A is recruited to lysosomes by Rag GTPases like TFEB/TFE3, yet PAINT propagates lysosome
    organization and autophagy regulation only to the TFEB/TFE3 clade. Does MITF (outside melanoma) contribute
    measurably to CLEAR-network lysosomal gene activation in vivo?
- question: Which MITF isoform-specific N-terminal features determine target selectivity (e.g. MITF-M
    but not MITF-A activating PRKCB)?
suggested_experiments:
- hypothesis: MITF-A, but not MITF-M, contributes to nutrient-responsive lysosomal gene expression in
    non-melanocytic cells.
  description: Isoform-specific CRISPR deletion of MITF-A exon 1 in TFEB/TFE3 double-knockout RPE cells,
    followed by RNA-seq and CUT&RUN after Torin-1 treatment, to test whether MITF-A occupies and activates
    CLEAR elements.
  experiment_type: genomics
