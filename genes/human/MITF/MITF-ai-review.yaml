gene_symbol: MITF
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'MITF (microphthalmia-associated transcription factor) is a basic helix-loop-helix leucine-zipper
  (bHLH-LZ) transcription factor of the MiT/TFE family (with TFE3, TFEB and TFEC). It binds DNA as a homodimer
  or as a heterodimer with other MiT/TFE members, recognising E-box (CACGTG) and M-box (TCATGTG) elements,
  and predominantly activates RNA polymerase II transcription of target genes. In melanocytes and retinal
  pigment epithelium it is the master regulator of differentiation and pigmentation, directly activating
  the melanogenic genes TYR, TYRP1 and MC1R as well as genes for melanosome biogenesis and transport,
  survival and proliferation; it also acts in mast cell and osteoclast differentiation, and can repress
  some targets such as ZEB1. Alternative promoters generate isoforms with distinct N-termini (melanocyte-specific
  MITF-M; widely expressed MITF-A, -C, -H), which differ in target selectivity. MITF activity is controlled
  by signalling-dependent phosphorylation, sumoylation and ubiquitination: phosphorylation promotes 14-3-3-mediated
  cytoplasmic retention, and in nutrient-replete cells the N-terminally extended isoforms are recruited
  by Rag GTPases to the lysosomal surface and phosphorylated by mTORC1, promoting their degradation. Heterozygous
  MITF variants cause Waardenburg syndrome type 2A and Tietz albinism-deafness syndrome, biallelic dominant-negative
  combinations cause COMMAD syndrome, and the E318K variant predisposes to melanoma.'
