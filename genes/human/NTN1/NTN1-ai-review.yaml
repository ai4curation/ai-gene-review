    label: basement membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  review:
    summary: Basement-membrane-associated netrin is consistent with its core substrate-guidance mechanism.
    action: ACCEPT
    reason: Mouse studies directly place netrin1 on the pial surface as a local axon-growth substrate
      (PMID:28780049). Basement-membrane/ECM association is part of netrin guidance biology, not a competing
      alternative to extracellular localization; the earlier rationale demoting it because extracellular
      region was primary was incorrect.
