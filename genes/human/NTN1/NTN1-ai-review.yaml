    label: DNA-binding transcription factor activity, RNA polymerase II-specific
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: The POU-seeded DNA-binding-function transfer does not fit the netrin protein.
    action: REMOVE
    reason: The GOA source PTN000180816 has POU-transcription-factor experimental seeds, whereas the target
      has the laminin/EGF/NTR architecture and netrin receptor-ligand biology. The current PTHR10574 PAINT
      cache contains these POU-seeded rows, so the original claim of a demonstrated wrong-family tree
      placement is replaced by a provenance discrepancy requiring upstream inspection. These specific
      Pol II sequence-recognition/TF activities are not supported by the target architecture or source-to-target
      functional homology; removal is not based on secreted localization alone. PMID:22871610 demonstrates
      a truncated nucleolar NTN1 form associated with ribosomal-gene promoters; that finding concerns
      ribosome biogenesis and does not establish these Pol II-specific activities.
    supported_by:
    - reference_id: file:human/NTN1/NTN1-uniprot.txt
      supporting_text: Netrins control guidance of CNS commissural axons
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN000180816
        source_label: PTN000180816
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: The POU-seeded IBD rows are present in the cached PTHR10574 export; the target netrin
          domain architecture does not support inheritance of POU sequence-specific DNA recognition. Exact
          tree association/assembly requires upstream verification.
