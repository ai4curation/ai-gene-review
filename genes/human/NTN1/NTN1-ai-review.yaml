- id: file:human/NTN1/NTN1-deep-research-falcon.md
  title: Falcon deep research report for human NTN1
  findings:
  - statement: NTN1 encodes secreted Netrin-1, an extracellular matrix-associated ligand that signals
      through DCC, NEO1, UNC5-family receptors, and context-specific integrins.
  - statement: The report supports Netrin-1 extracellular localization through secretion, ECM association,
      HSPG-dependent cell-surface organization, and receptor engagement in the extracellular microenvironment.
