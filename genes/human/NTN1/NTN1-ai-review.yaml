id: O95631
gene_symbol: NTN1
product_type: PROTEIN
status: IN_PROGRESS
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Netrin-1 is a secreted laminin-related protein that functions as an axon guidance cue.
  It controls guidance of CNS commissural axons and peripheral motor axons through interactions with
  its receptors DCC and UNC5 family members. Binding to DCC leads to axon attraction, while binding
  to UNC5 receptors leads to axon repulsion. Netrin-1 also serves as a survival factor that prevents
  initiation of apoptosis, and is involved in tumorigenesis through regulation of apoptosis. The protein
  contains a laminin N-terminal domain, three laminin EGF-like domains, and a C-terminal NTR domain.
  It is primarily secreted but can also be found in the cytoplasm. Mutations in NTN1 cause congenital
  mirror movements (MRMV4) through disruption of corticospinal tract development. Some cancer cells
  also produce an N-terminally truncated, nucleolar form that associates with ribosomal-gene promoters
  and promotes ribosome biogenesis.
