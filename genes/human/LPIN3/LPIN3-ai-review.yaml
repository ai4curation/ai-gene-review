- id: Reactome:R-HSA-1483203
  title: PA is dephosphorylated to DAG by LPIN
  findings:
  - statement: Reactome models LPIN1, LPIN2, and LPIN3 at the ER membrane as catalysts
      of phosphatidate dephosphorylation to diacylglycerol.
    supporting_text: At the endoplasmic reticulum (ER) membrane, phosphatidate phosphatase
      1-3 (LPIN) dephosphorylates phosphatidic acid (PA) to form diacylglycerol (DAG)
      (Grimsey et al. 2008, Donkor et al. 2007).
    reference_section_type: DATABASE_ENTRY
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The reaction and LPIN3 participation are consistent with direct PAP1
      evidence, but the ER placement is a curated pathway model. Its cited localization
      paper directly examines lipin 1 and lipin 2, not lipin 3.
- id: PMID:17158099
  title: Three mammalian lipins act as phosphatidate phosphatases with distinct tissue
    expression patterns.
  findings:
  - statement: Recombinant lipin-3 has direct phosphatidate phosphatase type-1 activity.
    supporting_text: Consistent with this possibility, recombinant lipin-2 and lipin-3
      possess PAP1 activity.
    reference_section_type: ABSTRACT
  - statement: Lipin family PAP1 activities were magnesium-dependent and phosphatidate-specific
      under the tested conditions.
    supporting_text: Each of the three lipin family members showed Mg2+-dependent activity
      that was specific for phosphatidate under the conditions employed.
    reference_section_type: ABSTRACT
  - statement: The three mammalian lipins have distinct tissue-expression patterns.
    supporting_text: The different lipins showed distinct tissue expression patterns.
    reference_section_type: ABSTRACT
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Foundational direct biochemical evidence for lipin-3 PAP1 activity and
      the source cited by UniProt for gastrointestinal expression. Only the abstract was
      available in the project cache.
- id: PMID:28982975
  title: The phosphatidic acid-binding, polybasic domain is responsible for the differences
    in the phosphoregulation of lipins 1 and 3.
  findings:
  - statement: In vitro phosphorylation did not alter lipin-3 catalytic activity or
      association with phosphatidate.
    supporting_text: In the present study, we show that phosphorylation does not affect
      the catalytic activity of lipin 3 or its ability to associate with PA in vitro
    reference_section_type: ABSTRACT
  - statement: Lipin-1 and lipin-3 polybasic-domain swaps showed that their different
      polybasic domains determine their different phosphoregulation.
    supporting_text: We show that the different PBDs of lipins 1 and 3 are responsible
      for the presence of phosphoregulation on the former but not the latter enzyme.
    reference_section_type: ABSTRACT
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct mechanistic comparison of lipin 3 and lipin 1 using biochemical
      activity, phosphatidate association, and domain-swap assays. The cache is abstract-only.
- id: PMID:24634820
  title: Lipin-1 and lipin-3 together determine adiposity in vivo.
  findings:
  - statement: Mouse single- and double-knockout experiments support a cooperative role
      for Lpin3 and Lpin1 in adipogenesis and adiposity.
    supporting_text: Using lipin single- and double-knockout models we identified a cooperative
      relationship between lipin-3 and lipin-1 that influences adipogenesis in vitro and
      adiposity in vivo.
    reference_section_type: ABSTRACT
  - statement: Mouse tissue assays support joint lipin-1/lipin-3 contributions to PAP
      activity in adipose tissue and several other organs.
    supporting_text: Our findings establish that lipin-1 and lipin-3 cooperate in vivo
      to determine adipose tissue PAP activity and adiposity, and may have implications
      in understanding the protection of lipin-1-deficient humans from overt lipodystrophy.
    reference_section_type: ABSTRACT
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Strong Lpin3 physiology in mouse loss-of-function models, but it establishes
      cooperation with Lpin1 rather than a unique human LPIN3 role.
- id: PMID:30507612
  title: Lipin 2/3 phosphatidic acid phosphatases maintain phospholipid homeostasis to
    regulate chylomicron synthesis.
  findings:
  - statement: Mouse small intestine expresses lipin 2 and lipin 3 rather than lipin 1.
    supporting_text: One exception is the small intestine, which is unique in expressing
      exclusively lipin 2 and lipin 3.
    reference_section_type: ABSTRACT
  - statement: Combined lipin-2/lipin-3 deficiency perturbs phosphatidate, mTORC1 activity,
      membrane phospholipids, and chylomicron synthesis.
    supporting_text: Lipin 2/3 deficiency caused phosphatidic acid accumulation and mammalian
      target of rapamycin complex 1 (mTORC1) activation, which were associated with enhanced
      protein levels of a key phospholipid biosynthetic enzyme (CTP:phosphocholine cytidylyltransferase
      α) and altered membrane phospholipid composition.
    reference_section_type: ABSTRACT
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct mouse intestinal physiology, but the combined Lpin2/Lpin3 deficiency
      design does not isolate Lpin3 and should not be presented as direct human evidence.
- id: PMID:27344312
  title: Redundant roles of the phosphatidate phosphatase family in triacylglycerol synthesis
    in human adipocytes.
  findings:
  - statement: Depletion of each LPIN family member altered early adipogenic and lipid-biosynthetic
      gene expression in a human pre-adipocyte model.
    supporting_text: Depletion of every lipin family member in a human Simpson-Golabi-Behmel
      syndrome (SGBS) pre-adipocyte cell line, alters expression levels of adipogenic transcription
      factors and lipid biosynthesis genes in early stages of differentiation.
    reference_section_type: ABSTRACT
  - statement: Even combined lipin knockdown caused only mild effects on mature adipocyte
      triacylglycerol accumulation, indicating substantial pathway compensation.
    supporting_text: Even combinatorial knockdown of lipins shows mild effects on triacylglycerol
      accumulation in mature adipocytes.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Human-cell perturbation evidence that includes LPIN3, but its principal
      message is redundancy and compensatory triglyceride synthesis rather than an LPIN3-specific
      mechanism.
- id: PMID:20735359
  title: Lipin proteins form homo- and hetero-oligomers.
  findings:
  - statement: Lipin-1 formed hetero-oligomers with lipin-2 and lipin-3 in the experimental
      systems used.
    supporting_text: In the present study, using various approaches, we revealed that
      lipin 1 formed stable homo-oligomers with itself and hetero-oligomers with lipin
      2/3.
    reference_section_type: ABSTRACT
  - statement: Oligomerization can influence lipin-1 localization while individual lipin-1
      monomers retain independent PAP catalysis.
    supporting_text: We also show that lipin 1 subcellular localization can be influenced
      through oligomerization, and the individual lipin 1 monomers in the oligomer function
      independently in catalysing dephosphorylation of PA.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Supports physical association of lipin 3 with lipin 1. Localization
      and independent-monomer conclusions were demonstrated for lipin 1 and must not be
      automatically transferred to endogenous LPIN3.
- id: PMID:19717560
  title: A conserved serine residue is required for the phosphatidate phosphatase activity
    but not the transcriptional coactivator functions of lipin-1 and lipin-2.
  findings:
  - statement: Direct transcriptional-coactivation assays in this family study were performed
      for lipin-2, with comparison to lipin-1, not lipin-3.
    supporting_text: We also determined that lipin-2 has transcriptional coactivator activity
      for peroxisome proliferator-activated receptor-response elements similar to lipin-1
      and that this activity is not affected by mutating the conserved serine.
    reference_section_type: ABSTRACT
  - statement: The conserved serine was required for mouse lipin-1/lipin-2 PAP activity
      but not microsomal membrane association.
    supporting_text: Here we demonstrate that mutation of the equivalent serine in mouse
      lipin-1 and lipin-2 to leucine or aspartate abolishes PAP activity but does not impair
      lipin association with microsomal membranes, the major site of glycerolipid synthesis.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Useful negative boundary for LPIN3 curation. The paper establishes coactivation
      for lipin 1/2 and does not directly demonstrate that function for lipin 3.
- id: PMID:18245816
  title: Glucocorticoids and cyclic AMP selectively increase hepatic lipin-1 expression,
    and insulin acts antagonistically.
  findings:
  - statement: In rat and mouse hepatocytes, dexamethasone/cAMP increased lipin-1 but
      not lipin-2 or lipin-3 mRNA.
    supporting_text: Lipin-2 and lipin-3 mRNA were not increased by dex/cAMP, indicating
      that increased PAP1 activity is attributable specifically to enhanced lipin-1 expression.
    reference_section_type: ABSTRACT
  full_text_unavailable: true
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: A useful species- and paralog-specific regulatory boundary; it does
      not define a positive LPIN3 function.
- id: PMID:18694939
  title: Temporal and spatial regulation of the phosphatidate phosphatases lipin 1 and
    2.
  findings:
  - statement: This Reactome-cited study directly compared lipin-1 and lipin-2 localization
      and regulation in HeLa M cells, not lipin-3.
    supporting_text: The two lipins display distinct intracellular localization in HeLa
      M cells, with a pool of lipin 2 exhibiting a tight membrane association.
    reference_section_type: ABSTRACT
  - statement: Lipin-2 depletion increased lipin-1 abundance and cellular PAP1 activity,
      demonstrating compensatory regulation between those paralogs.
    supporting_text: Small interfering RNA-mediated silencing of lipin 1 leads to a dramatic
      decrease of the cellular PAP1 activity in HeLa M cells, whereas silencing of lipin
      2 leads to an increase of lipin 1 levels and PAP1 activity.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Correctly cited by Reactome for lipin-family ER/membrane context, but
      it provides no direct LPIN3 localization experiment.
core_functions:
- description: >-
    Hydrolyzes phosphatidic acid to diacylglycerol and orthophosphate through a
    magnesium-dependent PAP1 reaction. This membrane-accessed reaction supplies
    diacylglycerol for triacylglycerol and other glycerolipid biosynthesis; the
    endoplasmic-reticulum membrane is a curated catalytic context, not evidence that
    LPIN3 is a stable integral or constitutively associated membrane protein.
  molecular_function:
    id: GO:0008195
    label: phosphatidate phosphatase activity
  directly_involved_in:
  - id: GO:0019432
    label: triglyceride biosynthetic process
  locations:
  - id: GO:0005789
    label: endoplasmic reticulum membrane
  supported_by:
  - reference_id: PMID:17158099
    supporting_text: >-
      Consistent with this possibility, recombinant lipin-2 and lipin-3 possess PAP1
      activity.
  - reference_id: PMID:17158099
    supporting_text: >-
      Each of the three lipin family members showed Mg2+-dependent activity that was
      specific for phosphatidate under the conditions employed.
  - reference_id: Reactome:R-HSA-1483203
    supporting_text: >-
      At the endoplasmic reticulum (ER) membrane, phosphatidate phosphatase 1-3 (LPIN)
      dephosphorylates phosphatidic acid (PA) to form diacylglycerol (DAG) (Grimsey et
      al. 2008, Donkor et al. 2007).
knowledge_gaps:
- gap_statement: >-
    The quantitative contribution of endogenous human LPIN3 to phosphatidate-to-DAG
    flux relative to LPIN1 and LPIN2 is unknown across tissues. Recombinant activity is
    direct, but human adipocyte experiments reveal substantial paralog compensation.
- gap_statement: >-
    Native human LPIN3 membrane recruitment, residence time, and organelle specificity
    are unresolved. Cytosolic localization is observed and ER catalysis is modeled, but
    stable endogenous LPIN3 association with the ER has not been directly demonstrated.
- gap_statement: >-
    Lipin-3 phosphoregulation has been characterized in vitro, but the signals that
    control endogenous LPIN3 abundance, phosphatidate access, and catalytic output in
    human cells remain poorly defined and should not be inferred from LPIN1 insulin or
    glucocorticoid responses.
- gap_statement: >-
    LPIN3-specific contributions to human gastrointestinal lipid handling, adipogenesis,
    and lipoprotein production remain unresolved. Current physiology is derived mainly
    from mouse double-mutant or cooperative-paralog experiments.
- gap_statement: >-
    A direct transcriptional coactivator function has not been shown for LPIN3. The
    conserved LXXIL motif and nuclear localization are suggestive, but available direct
    family experiments establish coactivation for LPIN1 and LPIN2.
- gap_statement: >-
    No study has compared Q9BQK8-1 with the one-residue-insertion isoform Q9BQK8-2 for
    catalytic activity, localization, regulation, tissue expression, or partner binding.
- gap_statement: >-
    The stoichiometry, tissue distribution, and functional effect of endogenous LPIN3
    oligomerization are unknown. Experimental LPIN1-LPIN3 association does not establish
    a constitutive stable human complex.
proposed_new_terms: []
suggested_questions:
- question: >-
    What fraction of phosphatidate phosphatase activity and glycerolipid flux is supplied
    by LPIN3 in human gastrointestinal epithelium, adipocytes, liver, and other tissues?
- question: >-
    Which lipid, phosphorylation, or protein signals recruit endogenous LPIN3 from the
    cytosolic pool to phosphatidate-containing membranes?
- question: >-
    Does human LPIN3 directly coactivate a nuclear receptor or other transcription factor,
    and if so, which endogenous target genes and physiological contexts are involved?
- question: >-
    Which mouse intestinal and adipose phenotypes persist when Lpin3 is perturbed alone,
    rather than jointly with Lpin2 or Lpin1?
- question: >-
    Do Q9BQK8-1 and Q9BQK8-2 differ in expression, PAP kinetics, localization, regulation,
    or interaction with other lipins?
- question: >-
    Does endogenous LPIN3 form stable homo- or hetero-oligomers, or are the reported
    associations transient and context-dependent?
suggested_experiments:
- description: >-
    Generate paralog-resolved LPIN1, LPIN2, and LPIN3 single and combinatorial knockouts
    in human intestinal organoids and adipocytes, then quantify phosphatidate and
    diacylglycerol species, PAP activity, and isotope-traced triacylglycerol and
    phospholipid synthesis.
  hypothesis: >-
    LPIN3 makes a tissue-dependent contribution to PA-to-DAG flux that is masked by LPIN1
    or LPIN2 compensation in standard cultured cells.
- description: >-
    Endogenously tag LPIN3 and perform live-cell imaging with ER and phosphatidate sensors,
    coupled to acute lipid, nutrient, and phosphorylation perturbations and catalytic-dead
    controls.
  hypothesis: >-
    LPIN3 is recruited transiently from the cytosol to phosphatidate-rich ER domains rather
    than residing stably at the ER membrane.
- description: >-
    Compare purified and endogenously expressed Q9BQK8-1 and Q9BQK8-2 using kinetic,
    membrane-binding, phosphoproteomic, localization, and rescue assays.
  hypothesis: >-
    The one-residue insertion in isoform 2 has little effect on intrinsic PAP catalysis
    but may alter regulatory interactions or membrane recruitment.
- description: >-
    Test LPIN3-dependent nuclear-receptor coactivation with catalytic-dead and LXXIL-mutant
    rescue constructs, reporter assays, endogenous target-gene measurements, and chromatin
    occupancy in human gastrointestinal cells.
  hypothesis: >-
    If LPIN3 has a nuclear coactivator function, it will depend on the LXXIL motif and be
    separable from phosphatidate phosphatase catalysis.
- description: >-
    Measure endogenous LPIN3 self-association and association with LPIN1/LPIN2 by calibrated
    co-immunoprecipitation, proximity labeling, and single-molecule or cross-linking methods
    across tissues and metabolic states.
  hypothesis: >-
    LPIN3 oligomerization is regulated and context-dependent rather than a fixed stable
    complex required for PAP activity.
