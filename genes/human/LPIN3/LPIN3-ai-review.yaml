id: Q9BQK8
gene_symbol: LPIN3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  LPIN3 is a magnesium-dependent phosphatidate phosphatase of the mammalian lipin
  family. Its conserved DXDXT catalytic motif hydrolyzes phosphatidic acid to
  diacylglycerol and orthophosphate, supplying diacylglycerol for triacylglycerol
  and phospholipid synthesis. Recombinant lipin-3 has phosphatidate-specific PAP1
  activity under the tested conditions, and its catalytic activity and association
  with phosphatidate are comparatively insensitive to phosphorylation in vitro.
  LPIN3 is observed in a cytosolic pool, while pathway models place catalysis at the
  endoplasmic-reticulum membrane where the lipid substrate is accessible; stable
  endogenous human LPIN3 residence at that membrane has not been demonstrated.

  LPIN3 expression is prominent in intestine and other gastrointestinal regions.
  Human adipocyte perturbations indicate substantial functional redundancy among
  LPIN1, LPIN2, and LPIN3. Mouse genetics similarly shows cooperative Lpin1/Lpin3
  control of adipose PAP activity and combined Lpin2/Lpin3 control of intestinal
  phospholipid homeostasis and chylomicron production, rather than an isolated human
  LPIN3-specific role. LPIN3 can associate with LPIN1 in experimental oligomerization
  systems, but a constitutive endogenous complex is not established. Human LPIN3 has
  two curated splice isoforms; isoform 2 contains a one-residue insertion, with no
  demonstrated isoform-specific function. Although LPIN3 contains an LXXIL motif and
  can localize to the nucleus, transcriptional coactivation, fatty-acid catabolism,
  and insulin-response functions have not been shown directly for LPIN3.
