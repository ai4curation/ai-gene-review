- term:
    id: GO:0005634
    label: nucleus
  evidence_type: EXP
  original_reference_id: PMID:21029237
  qualifier: located_in
  review:
    summary: Nuclear localisation of PKR.
    action: KEEP_AS_NON_CORE
    reason: 'Nuclear PKR is real and functional, not a fractionation artefact, but the assays behind these
      rows (immunofluorescence, nuclear fractionation, proteomics of nuclear extracts) do not resolve
      a sub-nuclear compartment, so GO:0005634 is as precise as the evidence allows. Non-core: the eIF2alpha-kinase
      activity that defines PKR acts in the cytosol.'
    supported_by:
    - reference_id: PMID:21072047
      supporting_text: Biochemical analysis demonstrated that nuclear PKR is an active kinase that can
        respond to stress.
      reference_section_type: ABSTRACT
    - reference_id: PMID:21072047
      supporting_text: Whereas p-T451 PKR in low-risk patient samples or PTEN-positive acute leukemia
        cell lines was mostly cytoplasmic, in high-risk patient samples and acute leukemia cell lines
        deficient in PTEN, p-T451 PKR was mainly nuclear.
      reference_section_type: ABSTRACT
    - reference_id: file:human/EIF2AK2/EIF2AK2-uniprot.txt
      record_section: ["CC:SUBCELLULAR LOCATION"]
      supporting_text: Nuclear localization is elevated in acute leukemia, myelodysplastic syndrome (MDS),
        melanoma, breast, colon, prostate and lung cancer patient samples or cell lines
      reference_section_type: DATABASE_ENTRY
