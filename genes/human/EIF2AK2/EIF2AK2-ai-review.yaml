  supporting_entities:
  - UniProtKB:P05198
  review:
    summary: Protein binding, reported interaction with EIF2S1/eIF2-alpha and a vaccinia K3L-like pseudosubstrate.
    action: MODIFY
    reason: 'The partner is EIF2S1/eIF2-alpha, PKR''s catalytic substrate, and the interaction is structurally
      characterised: eIF2alpha docks on the C-terminal catalytic lobe and UniProt annotates the binding
      region at residues 379-496. Substrate recognition of a translation initiation factor is an informative
      molecular function, so this row is refined rather than dropped.'
    supported_by:
    - reference_id: PMID:16179258
      supporting_text: The structures reveal that eIF2alpha binds to the C-terminal catalytic lobe while
        catalytic-domain dimerization is mediated by the N-terminal lobe.
      reference_section_type: ABSTRACT
    - reference_id: file:human/EIF2AK2/EIF2AK2-uniprot.txt
      record_section: ["CC:SUBUNIT"]
      supporting_text: Interacts with EIF2S1/EIF-2ALPHA; this interaction induces a conformational change
        in EIF2S1 and its phosphorylation by EIF2AK2
      reference_section_type: DATABASE_ENTRY
    - reference_id: file:human/EIF2AK2/EIF2AK2-uniprot.txt
      record_section: ["FT:REGION"]
      supporting_text: REGION 379..496 /note="Interaction with EIF2S1/EIF-2ALPHA"
      reference_section_type: DATABASE_ENTRY
    - reference_id: file:human/EIF2AK2/EIF2AK2-uniprot.txt
      record_section: ["CC:DOMAIN"]
      supporting_text: binds EIF2S1/EIF2-alpha (PubMed:16179258).
      reference_section_type: DATABASE_ENTRY
    proposed_replacement_terms:
    - id: GO:0031369
      label: translation initiation factor binding
