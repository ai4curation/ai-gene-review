    reference_section_type: ABSTRACT
proposed_new_terms: []
suggested_questions:
- question: Which of PKR's signalling outputs survive when eIF2alpha phosphorylation is blocked? PMID:22948139
    shows the NF-kB/IFN-beta arm is explained by translational control of IkB-alpha; it is unresolved
    whether the p38/MKK6 and PP2A arms are genuinely eIF2alpha-independent.
- question: What does catalytically active nuclear PKR phosphorylate? Nuclear PKR is active and stress-responsive
    and accumulates in PTEN-deficient leukaemia, but no nuclear substrate is established.
- question: Is PKR a regulator of inflammasome assembly in human cells? Two mouse studies reach opposite
    conclusions, and the human evidence is interaction-based.
- question: How do the LEUDEN and DYT33 variants alter kinase behaviour - gain of basal activity, loss
    of dsRNA dependence, or altered substrate choice - and why is the phenotype restricted to the CNS?
suggested_experiments:
- hypothesis: PKR's p38 and NF-kB outputs are downstream of eIF2alpha phosphorylation rather than of separate
    adapter functions.
  description: Compare dsRNA-stimulated p38 and NF-kB activation in cells expressing wild-type PKR, kinase-dead
    K296R PKR, and wild-type PKR in an EIF2S1 S51A background; score MKK6 and IkB-alpha phosphorylation
    and IkB-alpha protein turnover with and without cycloheximide.
  experiment_type: genetic epistasis / signalling biochemistry
- hypothesis: Nuclear PKR has substrates distinct from the cytosolic pool.
  description: Compare nuclear and cytosolic phosphoproteomes of cells expressing compartment-restricted
    (NLS- or NES-tagged) PKR, with analogue-sensitive kinase labelling to identify direct substrates in
    each compartment.
  experiment_type: quantitative phosphoproteomics
- hypothesis: LEUDEN and DYT33 variants dysregulate the dsRNA-dependence of activation.
  description: Reconstitute purified variant and wild-type PKR and measure basal and dsRNA-stimulated
    autophosphorylation and eIF2alpha Ser51 kinetics across a poly(I:C) concentration series; confirm
    in patient-derived cells by phospho-eIF2alpha and ATF4 induction.
  experiment_type: biochemical reconstitution / patient cell assay
knowledge_gaps:
- gap_statement: No substrate of the nuclear PKR pool is known, so the molecular function of nuclear PKR
    is undetermined.
  boundary: It is established that nuclear PKR is catalytically active, exists in several post-translationally
    modified forms, responds to stress, and shifts from cytoplasm to nucleus in PTEN-deficient acute leukaemia
    cells. What it phosphorylates there is unknown; eIF2alpha acts on cytosolic initiation complexes and
    cannot be the nuclear substrate.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  significance: Nuclear accumulation tracks with high-risk disease, so the nuclear substrate would identify
    what PKR contributes to leukaemogenesis.
  provenance:
  - reference_id: PMID:21072047
    supporting_text: Biochemical analysis demonstrated that nuclear PKR is an active kinase that can respond
      to stress.
    reference_section_type: ABSTRACT
  - reference_id: PMID:21072047
    supporting_text: Whereas p-T451 PKR in low-risk patient samples or PTEN-positive acute leukemia cell
      lines was mostly cytoplasmic, in high-risk patient samples and acute leukemia cell lines deficient
      in PTEN, p-T451 PKR was mainly nuclear.
    reference_section_type: ABSTRACT
- gap_statement: Whether PKR is required for inflammasome assembly or activation in human cells is undetermined.
  boundary: PKR physically interacts with NLRP3, NLRP1, NLRC4 and AIM2, and inflammasome agonists trigger
    its autophosphorylation. But the requirement reported in PKR-deficient mouse macrophages did not reproduce
    in two independent PKR-deficient strains, where caspase-1 activation and IL-1beta secretion were normal;
    no human loss-of-function test has been reported.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  significance: PKR inhibitors are proposed as anti-inflammatory agents, which presumes the requirement
    holds.
  provenance:
  - reference_id: PMID:22801494
    supporting_text: PKR physically interacts with several inflammasome components, including NOD-like
      receptor (NLR) family pyrin domain-containing 3 (NLRP3), NLRP1, NLR family CARD domain-containing
      protein 4 (NLRC4), absent in melanoma 2 (AIM2), and broadly regulates inflammasome activation.
