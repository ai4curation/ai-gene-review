    - reference_id: PMID:11836380
      supporting_text: the proteins biochemically colocalize in the S100 ribosomal fraction
- term:
    id: GO:0006446
    label: regulation of translational initiation
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:1341830
  - MGI:MGI:1353448
  - PANTHER:PTN008511022
  - PomBase:SPAC20G4.03c
  - PomBase:SPAC222.07c
  - WB:WBGene00003970
  review:
    summary: IBA from PTHR11042 for regulation of translational initiation.
    action: ACCEPT
    reason: eIF2alpha phosphorylation by PKR blocks ternary-complex recycling and so inhibits translation initiation. This is the core process, and the regulation-level term is appropriate for the family.
    supported_by:
    - &id008
      reference_id: PMID:1695551
      supporting_text: On activation by dsRNA in the presence of ATP, the kinase becomes autophosphorylated and can catalyze the phosphorylation of the alpha subunit of eIF2, which leads to an inhibition of the initiation of protein synthesis
- term:
    id: GO:0008285
    label: negative regulation of cell population proliferation
  evidence_type: TAS
  original_reference_id: PMID:1351683
  qualifier: involved_in
  review:
    summary: 'TAS: dsRNA-binding mutants of PKR failed to cause slow growth in yeast.'
    action: KEEP_AS_NON_CORE
    reason: PKR has antiproliferative activity, a consequence of translational arrest and apoptosis signalling. True but not a core function.
    supported_by:
    - reference_id: PMID:1351683
      supporting_text: in an in vivo growth inhibition assay in the yeast Saccharomyces cerevisiae, these mutants failed to exhibit a slow-growth phenotype
    - reference_id: PMID:16373505
      supporting_text: tyrosine phosphorylation of PKR mediates the antiviral and antiproliferative properties of the kinase through its ability to control translation
