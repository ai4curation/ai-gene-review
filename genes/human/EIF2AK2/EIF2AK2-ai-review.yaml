    reason: 'PKR performs the initiating step of ISR signalling, eIF2alpha Ser51 phosphorylation, in response to dsRNA. Comparator check: the paralogous ISR kinase EIF2AK1/HRI carries this term (IDA), and PKR performs the same eIF2alpha Ser51 phosphorylation step as HRI, so it stands in the same role relative to the process. The term is not an ancestor or descendant of other terms the gene carries.'
    supported_by:
    - &id016
      reference_id: file:human/EIF2AK2/EIF2AK2-uniprot.txt
      record_section:
      - CC:FUNCTION
      supporting_text: Inhibits viral replication via the integrated stress response (ISR)
    - &id015
      reference_id: PMID:19189853
      supporting_text: transient expression of PKR inhibited HCV replication in a kinase-dependent manner with concomitant increase of eIF2alpha phosphorylation
    - &id014
      reference_id: PMID:1695551
      supporting_text: On activation by dsRNA in the presence of ATP, the kinase becomes autophosphorylated and can catalyze the phosphorylation of the alpha subunit of eIF2, which leads to an inhibition of the initiation of protein synthesis
