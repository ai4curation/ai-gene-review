id: P19525
gene_symbol: EIF2AK2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'EIF2AK2 (PKR, p68 kinase) is an interferon-inducible, cytosolic serine/threonine protein
  kinase and one of the four human eIF2alpha kinases. Two N-terminal double-stranded RNA-binding domains
  hold the enzyme latent until they engage duplex RNA - typically a viral replication intermediate - which
  drives back-to-back dimerisation and activation-loop autophosphorylation on Ser, Thr and Tyr residues.
  Activated PKR phosphorylates Ser51 of EIF2S1/eIF2-alpha, converting eIF2 into an inhibitor of its own
  guanine-nucleotide exchange factor eIF2B; cap-dependent initiation is shut down while ISR messages such
  as ATF4 are preferentially translated. This single catalytic activity accounts for most of PKR''s biology:
  restriction of a wide range of DNA and RNA viruses, amplification of interferon-beta induction through
  translational loss of IkB-alpha, and the growth-suppressive and pro-apoptotic effects of sustained activation.
  PKR also phosphorylates non-eIF2alpha substrates including MAP2K6, the PP2A regulatory subunit PPP2R5A/B56alpha,
  ILF3/NFAR, NPM1 and CDK1, linking it to p38 MAPK and NF-kB signalling, and it is held in check by cellular
  inhibitors (PRKRA/PACT activates it, while NPM1, NCK1, DNAJC3/p58IPK, ADAR, TARBP2 and the MBIP-MOCS2B
  pair restrain it) and by dedicated viral antagonists such as vaccinia K3L and E3, HCV E2 and NS5A, and
  HSV-1 US11. A pool of catalytically active PKR is also present in the nucleus, and is enriched there
  in acute leukaemia and other malignancies. De novo EIF2AK2 variants cause a dominant leukoencephalopathy
  with developmental delay and episodic neurologic regression, and other variants cause dystonia 33.'
