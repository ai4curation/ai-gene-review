- term:
    id: GO:1900225
    label: regulation of NLRP3 inflammasome complex assembly
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q03963
  - ensembl:ENSMUSP00000024884
  review:
    summary: Regulation of NLRP3 inflammasome complex assembly, transferred from mouse Eif2ak2.
    action: KEEP_AS_NON_CORE
    reason: 'The claim has direct human support (PKR interacts with NLRP3, NLRP1, NLRC4 and AIM2, and
      inflammasome agonists trigger PKR autophosphorylation), and UniProt records it. It is kept at the
      neutral ''regulation'' term deliberately: an independent study using two PKR-deficient mouse strains
      found PKR dispensable for caspase-1 activation and IL-1beta secretion, so a directional term would
      not be defensible.'
    supported_by:
    - reference_id: PMID:22801494
      supporting_text: PKR physically interacts with several inflammasome components, including NOD-like
        receptor (NLR) family pyrin domain-containing 3 (NLRP3), NLRP1, NLR family CARD domain-containing
        protein 4 (NLRC4), absent in melanoma 2 (AIM2), and broadly regulates inflammasome activation.
      reference_section_type: ABSTRACT
    - reference_id: PMID:22801494
      supporting_text: Exposure of macrophages to inflammasome agonists induced PKR autophosphorylation.
      reference_section_type: ABSTRACT
    - reference_id: PMID:23401008
      supporting_text: However, PKR was dispensable for caspase-1 activation, processing of pro-IL-1β/IL-18
        and secretion of IL-1β induced by stimuli that trigger the activation of NLRP3, NLRC4 and AIM2.
      reference_section_type: ABSTRACT
    - reference_id: PMID:23401008
      supporting_text: These results indicate that PKR is not required for inflammasome activation in
        macrophages.
      reference_section_type: ABSTRACT
    - reference_id: file:human/EIF2AK2/EIF2AK2-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Can regulate NLRP3 inflammasome assembly and the activation of NLRP3, NLRP1, AIM2
        and NLRC4 inflammasomes
      reference_section_type: DATABASE_ENTRY
