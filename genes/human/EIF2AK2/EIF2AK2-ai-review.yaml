core_functions:
- description: dsRNA-activated eIF2alpha kinase. Activated PKR phosphorylates EIF2S1 Ser51 in the cytosol, repressing translation initiation and triggering the integrated stress response to restrict viral protein synthesis and replication.
  molecular_function:
    id: GO:0004694
    label: eukaryotic translation initiation factor 2alpha kinase activity
  directly_involved_in:
  - id: GO:0140467
    label: integrated stress response signaling
  - id: GO:2000766
    label: negative regulation of cytoplasmic translation
  - id: GO:0140374
    label: antiviral innate immune response
  - id: GO:0045071
    label: negative regulation of viral genome replication
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - *id014
  - *id015
  - *id016
  - reference_id: PMID:22948139
    supporting_text: These results suggest that an eIF-2α-dependent translation inhibition mechanism is sufficient to explain the PKR-mediated amplification of IPS-1-dependent IFN-β induction by foreign RNA
- description: Sensing of double-stranded RNA by the two N-terminal dsRBMs. dsRNA binding drives PKR dimerization and autophosphorylation, coupling viral RNA detection to kinase activation.
  molecular_function:
    id: GO:0003725
    label: double-stranded RNA binding
  directly_involved_in:
  - id: GO:0140374
    label: antiviral innate immune response
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:1351683
    supporting_text: The double-stranded RNA (dsRNA)-binding domain of the human p68 kinase has been localized to the N-terminal half of the enzyme by using progressive deletion analysis and in vitro binding assays
  - reference_id: file:human/EIF2AK2/EIF2AK2-uniprot.txt
    record_section:
    - CC:ACTIVITY REGULATION
    supporting_text: Initially produced in an inactive form and is activated by binding to viral dsRNA, which causes dimerization and autophosphorylation in the activation loop and stimulation of function.
  - reference_id: PMID:16373505
    supporting_text: Site-specific tyrosine phosphorylation is essential for efficient dsRNA-binding, dimerization, kinase activation and eIF2alpha phosphorylation of PKR
suggested_questions:
- question: Is PKR required for NLRP3 inflammasome activation in human macrophages? The mouse knockout data are conflicting, and the NLRP3 regulation rows depend on them.
- question: Which of the many reported non-eIF2alpha substrates (MKK6, PPP2R5A, ILF3, TP53, CDK1, MAPT, SNCA) are phosphorylated by endogenous PKR at physiological levels?
- question: Should the IMP rows from PMID:25329545 (eIF2alpha kinase activity; cellular response to amino acid starvation) be checked against the full text? The abstract foregrounds PERK and GCN2.
suggested_experiments:
- description: Use phosphoproteomics in PKR-knockout versus kinase-dead knock-in human cells after dsRNA transfection to identify which secondary substrates depend on endogenous PKR activity, separate from the effects of eIF2alpha phosphorylation.
