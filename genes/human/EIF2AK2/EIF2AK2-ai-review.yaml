  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q03963
  - ensembl:ENSMUSP00000024884
  review:
    summary: Positive regulation of cytokine production, transferred from mouse Eif2ak2.
    action: KEEP_AS_NON_CORE
    reason: 'Supported: the mouse source annotation (UniProtKB:Q03963, IMP) rests on PKR-deficient mice
      that produced less inflammatory cytokine after RSV infection, and human PKR is documented as a positive
      input to cytokine and interferon gene induction. Non-core, and downstream: the PKR contribution
      to IFN-beta induction is attributable to eIF2alpha-mediated translational control of IkB-alpha rather
      than to a separate signalling activity.'
    supported_by:
    - reference_id: PMID:20038207
      supporting_text: Our data showed that bronchoalveolar lavage (BAL) fluid from infected PKR(-/-)
        mice had significantly lower levels of several innate inflammatory cytokines and chemokines.
      reference_section_type: ABSTRACT
    - reference_id: PMID:22948139
      supporting_text: These results suggest that an eIF-2α-dependent translation inhibition mechanism
        is sufficient to explain the PKR-mediated amplification of IPS-1-dependent IFN-β induction by
        foreign RNA.
      reference_section_type: RESULTS
