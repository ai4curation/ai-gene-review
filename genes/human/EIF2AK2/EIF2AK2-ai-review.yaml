  evidence_type: TAS
  original_reference_id: PMID:10390359
  qualifier: located_in
  review:
    summary: 'TAS: PKR is described in connection with ribosome-associated translational control (HCV E2 paper).'
    action: KEEP_AS_NON_CORE
