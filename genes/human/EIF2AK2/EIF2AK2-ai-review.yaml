- term:
    id: GO:0005840
    label: ribosome
  evidence_type: TAS
  original_reference_id: PMID:10390359
  qualifier: located_in
  review:
    summary: Ribosome association of PKR, traced from the HCV E2 study.
    action: KEEP_AS_NON_CORE
    reason: 'PKR''s association with ribosomes is long-reported and is consistent with its substrate being
      the initiation factor on the 43S complex; the cached record is abstract-only, so the curator''s
      traced statement is taken at face value per repository policy. Non-core and as precise as the evidence
      allows: this is an association with the translational machinery rather than a stable structural
      role in the ribosome.'
    supported_by:
    - reference_id: PMID:10390359
      supporting_text: E2 inhibited the kinase activity of PKR and blocked its inhibitory effect on protein
        synthesis and cell growth.
      reference_section_type: ABSTRACT
    - reference_id: PMID:21123651
      supporting_text: causing the NFARs to be retained on ribosomes, associate with viral transcripts,
        and impede viral replication
      reference_section_type: ABSTRACT
- term:
    id: GO:0006446
    label: regulation of translational initiation
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:1341830
  - MGI:MGI:1353448
  - PANTHER:PTN008511022
  - PomBase:SPAC20G4.03c
  - PomBase:SPAC222.07c
  - WB:WBGene00003970
  review:
    summary: 'PAINT IBA: regulation of translational initiation across the eIF2alpha-kinase family.'
    action: MODIFY
    reason: Correct but less specific than the family's defining mechanism. Every member of the node regulates
      initiation by phosphorylating eIF2alpha, which is exactly GO:0010998 - a strict descendant of this
      term, and the term GO itself recommends alongside GO:0004694. The node placement itself is not in
      question.
    supported_by:
    - reference_id: PMID:16179258
      supporting_text: In response to binding viral double-stranded RNA byproducts within a cell, the
        RNA-dependent protein kinase PKR phosphorylates the alpha subunit of the translation initiation
        factor eIF2 on a regulatory site, Ser51.
      reference_section_type: ABSTRACT
    - reference_id: PMID:1695551
      supporting_text: On activation by dsRNA in the presence of ATP, the kinase becomes autophosphorylated
        and can catalyze the phosphorylation of the alpha subunit of eIF2, which leads to an inhibition
        of the initiation of protein synthesis.
      reference_section_type: ABSTRACT
    - reference_id: file:human/EIF2AK2/EIF2AK2-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: IFN-induced dsRNA-dependent serine/threonine-protein kinase that phosphorylates
        the alpha subunit of eukaryotic translation initiation factor 2 (EIF2S1/eIF-2-alpha) and plays
        a key role in the innate immune response to viral infection
      reference_section_type: DATABASE_ENTRY
    proposed_replacement_terms:
    - id: GO:0010998
      label: regulation of translational initiation by eIF2 alpha phosphorylation
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
