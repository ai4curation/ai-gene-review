core_functions:
- description: 'Double-stranded RNA sensor: the two N-terminal DRBM domains bind duplex RNA, which relieves
    autoinhibition and drives dimerisation and activation-loop autophosphorylation, coupling detection
    of viral replication intermediates to kinase activation.'
  molecular_function:
    id: GO:0003725
    label: double-stranded RNA binding
  directly_involved_in:
  - id: GO:0051607
    label: defense response to virus
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:1351683
    supporting_text: The double-stranded RNA (dsRNA)-binding domain of the human p68 kinase has been localized
      to the N-terminal half of the enzyme by using progressive deletion analysis and in vitro binding
      assays.
    reference_section_type: ABSTRACT
  - reference_id: PMID:1351683
    supporting_text: Deletions in either of two 12-amino-acid-long and arginine- or lysine-rich regions
      abrogated binding to dsRNA.
    reference_section_type: ABSTRACT
  - reference_id: file:human/EIF2AK2/EIF2AK2-uniprot.txt
    record_section: ["CC:ACTIVITY REGULATION"]
    supporting_text: Initially produced in an inactive form and is activated by binding to viral dsRNA,
      which causes dimerization and autophosphorylation in the activation loop and stimulation of function.
    reference_section_type: DATABASE_ENTRY
  - reference_id: PMID:31246429
    supporting_text: Viral double-stranded RNAs induce PKR dimerization and autophosphorylation.
    reference_section_type: ABSTRACT
  - reference_id: file:human/EIF2AK2/EIF2AK2-uniprot.txt
    record_section: ["FT:DOMAIN"]
    supporting_text: DOMAIN 9..77 /note="DRBM 1"
    reference_section_type: DATABASE_ENTRY
- description: 'eIF2alpha kinase: phosphorylates Ser51 of EIF2S1, blocking eIF2B-mediated GDP/GTP exchange
    and shutting down cytoplasmic cap-dependent initiation while licensing ISR-specific translation. This
    is the activity that restricts viral protein synthesis and genome replication.'
  molecular_function:
    id: GO:0004694
    label: eukaryotic translation initiation factor 2alpha kinase activity
  directly_involved_in:
  - id: GO:0010998
    label: regulation of translational initiation by eIF2 alpha phosphorylation
  - id: GO:2000766
    label: negative regulation of cytoplasmic translation
  - id: GO:0045071
    label: negative regulation of viral genome replication
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:16179258
    supporting_text: In response to binding viral double-stranded RNA byproducts within a cell, the RNA-dependent
      protein kinase PKR phosphorylates the alpha subunit of the translation initiation factor eIF2 on
      a regulatory site, Ser51.
    reference_section_type: ABSTRACT
  - reference_id: PMID:16179258
    supporting_text: The structures reveal that eIF2alpha binds to the C-terminal catalytic lobe while
      catalytic-domain dimerization is mediated by the N-terminal lobe.
    reference_section_type: ABSTRACT
  - reference_id: PMID:1695551
    supporting_text: On activation by dsRNA in the presence of ATP, the kinase becomes autophosphorylated
      and can catalyze the phosphorylation of the alpha subunit of eIF2, which leads to an inhibition
      of the initiation of protein synthesis.
    reference_section_type: ABSTRACT
  - reference_id: PMID:19189853
    supporting_text: transient expression of PKR inhibited HCV replication in a kinase-dependent manner
      with concomitant increase of eIF2alpha phosphorylation
    reference_section_type: ABSTRACT
  - reference_id: file:human/EIF2AK2/EIF2AK2-uniprot.txt
    record_section: ["CC:FUNCTION"]
    supporting_text: converts EIF2S1/eIF-2-alpha in a global protein synthesis inhibitor, resulting to
      a shutdown of cellular and viral protein synthesis, while concomitantly initiating the preferential
      translation of ISR-specific mRNAs, such as the transcriptional activator ATF4
    reference_section_type: DATABASE_ENTRY
- description: Serine/threonine kinase acting on non-eIF2alpha substrates - MAP2K6, the PP2A regulatory
    subunit PPP2R5A/B56alpha, ILF3/NFAR1-2, NPM1 and NCK1 - which routes dsRNA sensing into the p38 MAPK
    cascade and into a ribosome-retention mechanism that impedes translation of viral transcripts. The
    NF-kB arm is deliberately not listed among the processes here, because PMID:22948139 attributes it
    to eIF2alpha-mediated loss of IkB-alpha and so to the eIF2alpha-kinase function above.
  molecular_function:
    id: GO:0004674
