id: O14763
gene_symbol: TNFRSF10B
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'TNFRSF10B, also called DR5 or TRAIL receptor 2, is a type I plasma-membrane TNF receptor superfamily
  death receptor. Its extracellular cysteine-rich domains bind TNFSF10/TRAIL, and ligand-bound receptor trimers
  recruit FADD and initiator caspases through the intracellular death domain to assemble a death-inducing signaling
  complex and initiate TRAIL-activated extrinsic apoptosis. DR5 can also signal contextual NF-kappaB activation,
  can be induced by TP53, CHOP, PU.1, and therapeutic stressors, and is inhibited by decoy TRAIL receptors and viral
  MARCHF8-dependent down-regulation.'
