id: P08631
gene_symbol: HCK
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: HCK (hematopoietic cell kinase) is a non-receptor, Src-family protein tyrosine kinase expressed
  mainly in myeloid and B-lymphoid hematopoietic cells. It is lipid-anchored (N-myristoylated and palmitoylated)
  to the cytoplasmic face of cellular membranes and exists as two translation-start isoforms, p59Hck (predominantly
  plasma membrane, caveolae, focal adhesions, cytosol) and p61Hck (lysosomes/azurophil granules). Held
  inactive by intramolecular SH3/SH2 interactions, it is activated downstream of Fc receptors, integrins
  and cytokine receptors, where it phosphorylates substrates such as CBL, VAV1 and WAS to drive phagocytosis,
  secretory-lysosome mobilization, degranulation, the NADPH-oxidase respiratory burst, and actin-cytoskeleton/podosome
  reorganization. Its SH2 domain binds phosphotyrosine and its SH3 domain engages partners including TP73.
