suggested_questions:
- question: Which substrate-phosphorylation events uniquely require HCK versus other myeloid Src-family
    kinases (LYN, FGR) in Fc-receptor phagocytosis?
- question: How do the lipid modifications and the SH4-U region partition p59Hck versus p61Hck between
    the plasma membrane and lysosomes to produce their distinct phenotypes?
suggested_experiments:
- description: Phosphoproteomics of HCK-null versus reconstituted phagocytes after Fc-gamma receptor engagement
    to map the HCK-specific substrate network.
  experiment_type: proteomics
- description: Live-cell imaging of palmitoylation-deficient HCK to test the requirement of membrane/caveolar
    targeting for podosome formation and the respiratory burst.
  experiment_type: cell biology
