- id: PMID:19273613
  title: Spatiotemporal control of mitosis by the conserved spindle matrix protein
    Megator.
  findings:
  - statement: >-
      In human cells TPR, MAD1, MAD2 and Mps1 co-immunoprecipitate from mitotic extracts
      and co-localize at the nuclear pore complex in interphase; Megator/TPR promotes
      timely recruitment of Mad2 and Mps1 to unattached kinetochores.
    supporting_text: >-
      Tpr, Mad1, Mad2, and Mps1 coimmunoprecipitate in mitotic enriched HeLa cell
      extracts prepared in the presence of nocodazole
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full text cached. Primarily a Drosophila Megator study with HeLa/human TPR
      validation; supports the TPR interaction and an interphase nuclear-pore pool of TTK,
      but not a molecular function of TTK.
