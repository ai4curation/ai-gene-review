  evidence_type: TAS
  original_reference_id: PMID:1639825
  qualifier: involved_in
  review:
    summary: >-
      The original TTK cloning paper reported that TTK mRNA is present in proliferating
      tissues (testis, thymus), tumours and rapidly proliferating cell lines, and absent
      from most quiescent tissues. This is an expression correlation with proliferation,
      not evidence that TTK positively regulates proliferation.
    action: REMOVE
    reason: >-
      The cited evidence is a correlation of transcript abundance with proliferative state
      (as expected for a mitotic kinase), which the annotation has converted into a
      regulatory function. TTK's established role is to restrain anaphase until
      chromosomes are attached and to correct faulty attachments; no step of a
