- id: PMID:22660415
  title: MPS1/Mph1 phosphorylates the kinetochore protein KNL1/Spc7 to recruit SAC
    components.
  findings:
  - statement: >-
      Mps1/Mph1 phosphorylates the MELT repeats of KNL1/Spc7 at unattached kinetochores to
      create the docking mark that recruits Bub1-Bub3 and initiates SAC signalling; the
      mechanism appears conserved in human cells.
    supporting_text: >-
      MPS1/Mph1 kinase locating at the unattached kinetochores initially creates a mark,
      which is crucial for SAC activation and chromosome bi-orientation. This mechanism
      seems to be conserved in human cells.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract-only in the cache; principally fission yeast with human validation.
      Establishes KNL1 MELT motifs as the primary SAC substrate of Mps1 kinases.
- id: PMID:25468996
  title: E-cadherin interactome complexity and robustness resolved by quantitative
    proteomics.
  findings:
  - statement: >-
      Proximity-biotinylation proteomics of the E-cadherin environment, with GFP tagging
      used to assign subcellular localization to candidate proteins; source of the TTK
      cytoplasm IDA.
    supporting_text: >-
      by tagging identified proteins with GFP (green fluorescent protein), we determined
      the subcellular localization of 83 putative E-cadherin-proximal proteins
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Full text cached; no TTK-specific finding in the text. Supports only the broad
      cytoplasmic localization, which is independently established.
- id: PMID:26068854
  title: CELL DIVISION CYCLE. Kinetochore attachment sensed by competitive Mps1 and
    microtubule binding to Ndc80C.
  findings:
  - statement: >-
      Human Mps1 binds the NDC80 complex directly through two interactions that use the
      microtubule-binding surfaces of Ndc80C and are inhibited by microtubules; disrupting
      one interaction causes checkpoint defects.
    supporting_text: >-
      Competition between Mps1 and microtubules for Ndc80C binding thus constitutes a
      direct mechanism for the detection of unattached kinetochores.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract-only in the cache. Defines the kinetochore-binding mechanism by which TTK
      senses attachment state; supports GO:0043515 and the kinetochore localization.
- id: PMID:28441529
  title: Mps1 Regulates Kinetochore-Microtubule Attachment Stability via the Ska Complex
    to Ensure Error-Free Chromosome Segregation.
  findings:
  - statement: >-
      Kinetochore-targeted Mps1 destabilises K-fibres independently of Aurora B;
      phosphoproteomics identifies Mps1-dependent Ser/Thr sites on KNL1, ROD, SKA3 and
      Mps1 itself; SKA3 Ser34 phosphorylation weakens end-coupled microtubule binding of
      the Ska complex, opposed by PP2A-B56.
    supporting_text: >-
      We also identify the Ska complex as a key effector of Mps1 at the
      kinetochore-microtubule interface, as mutations that mimic constitutive
      phosphorylation destabilized K fibers in vivo
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached. Primary evidence for Ser/Thr kinase activity, kinetochore
      localization dynamics and the error-correction function of human TTK.
- id: PMID:30785839
  title: Mps1 regulates spindle morphology through MCRS1 to promote chromosome alignment.
  findings:
  - statement: >-
      Mps1 binds and phosphorylates MCRS1 at Ser64/Ser65, enabling KIF2A localization to
      spindle microtubule minus ends and promoting chromosome alignment; phosphorylation
      is blocked by the Mps1 inhibitor reversine.
    supporting_text: >-
      Mps1 binds and phosphorylates MCRS1. This mechanism enables KIF2A localization to
      the minus end of spindle microtubules.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full text cached. Direct serine-kinase evidence (the EXP row) and support for a
      secondary spindle-organization role.
- id: PMID:7737118
  title: Yeast spindle pole body duplication gene MPS1 encodes an essential dual specificity
    protein kinase.
  findings:
  - statement: >-
      Budding-yeast Mps1p is an essential kinase that autophosphorylates and
      phosphorylates serine, threonine and tyrosine in vitro; a kinase-dead allele behaves
      as a null, and the gene was identified through spindle pole body duplication
      defects.
    supporting_text: >-
      Phosphoamino acid analysis of substrates phosphorylated by Mps1p indicates that this
      kinase can phosphorylate serine, threonine and tyrosine residues, identifying Mps1p
      as a dual specificity protein kinase.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Correct paper, but it concerns the S. cerevisiae orthologue; GOA uses it as TAS
      support for the human kinase-activity and mitotic spindle organization annotations,
      so it is orthologue-level evidence only.
