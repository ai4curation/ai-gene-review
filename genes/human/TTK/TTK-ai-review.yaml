  label: Homo sapiens
description: >-
  TTK (also called Mps1, monopolar spindle 1) is the human member of the Mps1 family of
  dual-specificity protein kinases and the apical kinase of the spindle assembly
  checkpoint (SAC). Although recombinant TTK can phosphorylate tyrosine in vitro, all of
  its established physiological substrates are phosphorylated on serine or threonine,
  with a preference for acidic residues near the target site. During prometaphase TTK is
  recruited to unattached kinetochores by direct binding to the NDC80 complex, using the
  same NDC80 surfaces that bind microtubules; microtubule occupancy therefore displaces
  the kinase, coupling kinetochore attachment state to checkpoint output. At unattached
  kinetochores TTK phosphorylates the MELT repeats of the scaffold KNL1 to create docking
  sites for BUB3-BUB1 and BUB3-BUB1B, then phosphorylates BUB1 and MAD1 to promote
  MAD1-MAD2 recruitment and CDC20 capture, catalysing assembly of the mitotic checkpoint
  complex (MCC) that inhibits APC/C-CDC20 and delays anaphase until every chromosome is
  bioriented. TTK also operates as an error-correction kinase at the
  kinetochore-microtubule interface: it phosphorylates Borealin (CDCA8) to support
  centromeric Aurora B activity, and phosphorylates SKA3 Ser34 and other outer-kinetochore
  substrates to destabilise improper attachments, in opposition to PP2A-B56 phosphatase.
  Additional reported roles include phosphorylation of MCRS1 to control KIF2A at spindle
  microtubule minus ends, an interphase pool at the nuclear pore in complex with
  TPR-MAD1-MAD2, MPS1-dependent phosphorylation of the BLM helicase in mitosis, and
  proposed contributions to centrosome duplication and the DNA-damage response. TTK is
  expressed in proliferating tissues and tumours, and is the target of clinical-stage
  kinase inhibitors (for example CFI-402257, BAY 1217389) that override the checkpoint and
  drive lethal chromosomal instability in cancer cells.
