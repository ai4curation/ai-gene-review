proposed_new_terms: []
suggested_questions:
- question: >-
    Is tyrosine phosphorylation by TTK physiologically relevant in human cells, and if so
    what are the tyrosine substrates? If none can be identified, should the stand-alone
    protein tyrosine kinase annotations be retired in favour of the dual-specificity and
    Ser/Thr terms?
- question: >-
    Does human TTK contribute to centrosome duplication as budding-yeast Mps1 does to
    spindle pole body duplication, or is that role restricted to yeast? Reports conflict
    and no GOA annotation currently records it.
- question: >-
    Which TTK functions are kinase-independent? Genetic depletion and catalytic
    inhibition give different phenotypes in some cancer lines, suggesting scaffolding
    roles for the N-terminal kinetochore-targeting region.
suggested_experiments:
- description: >-
    Phosphoproteomics of TTK-inhibited versus TTK-degraded (auxin-degron) mitotic cells
    with phosphotyrosine enrichment, to test whether any endogenous tyrosine phosphosite
    depends on TTK.
  hypothesis: >-
    TTK has no physiologically relevant tyrosine substrates; all TTK-dependent
    phosphosites in mitotic human cells are on serine or threonine.
  experiment_type: quantitative phosphoproteomics
- description: >-
    Compare rapid TTK degradation (degron) with catalytic inhibition (reversine,
    CFI-402257) for kinetochore recruitment of BUB1, MAD1 and the Ska complex, to
    separate scaffolding from catalytic contributions of TTK.
  hypothesis: >-
    The N-terminal region of TTK makes a kinase-independent scaffolding contribution at
    the kinetochore that partially sustains checkpoint protein recruitment.
  experiment_type: degron versus inhibitor comparison with quantitative immunofluorescence
