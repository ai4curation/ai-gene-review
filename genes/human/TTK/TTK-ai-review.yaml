core_functions:
- description: >-
    Apical spindle assembly checkpoint kinase: recruited to unattached kinetochores by
    direct binding to the NDC80 complex, TTK phosphorylates the KNL1 MELT motifs to
    create docking sites for BUB3-BUB1 and BUB3-BUB1B, then phosphorylates BUB1 and MAD1
    to promote MAD1-MAD2 recruitment and CDC20 capture, catalysing assembly of the
    mitotic checkpoint complex that inhibits APC/C-CDC20 and delays anaphase until all
    kinetochores are attached.
  supported_by:
  - reference_id: PMID:22660415
    supporting_text: >-
      MPS1/Mph1 kinase locating at the unattached kinetochores initially creates a mark,
      which is crucial for SAC activation and chromosome bi-orientation. This mechanism
      seems to be conserved in human cells.
    reference_section_type: ABSTRACT
  - reference_id: PMID:28441529
    supporting_text: >-
      Bub1 and BubR1 interact with Mps1-phosphorylated MELT motifs in KNL1 (CASC5), a
      large scaffold protein at the kinetochore
    reference_section_type: DISCUSSION
  - reference_id: PMID:26068854
    supporting_text: >-
      Elimination of one such interaction in human cells caused checkpoint defects
      expected from a failure to detect unattached kinetochores.
    reference_section_type: ABSTRACT
