- id: PMID:10366450
  title: Characterization of MAD2B and other mitotic spindle checkpoint genes.
  findings:
  - statement: >-
      Mapped the chromosomal locus of TTK (MPS1L1) alongside other spindle checkpoint
      genes and screened them for mutations in aneuploid colorectal tumours; the paper
      contains no localization or functional data on TTK.
    supporting_text: >-
      We determined the chromosomal localization of it and other spindle checkpoint
      genes, including MAD1L1, MAD2, BUB3, TTK (MPS1L1), and CDC20.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Correct paper, but a gene-mapping/mutation-screen study. It classifies TTK as a
      spindle checkpoint gene; it does not support the spindle localization or spindle
      organization annotations that cite it.
- id: PMID:1639825
  title: Expression of TTK, a novel human protein kinase, is associated with cell
    proliferation.
  findings:
  - statement: >-
      Cloning of human TTK; the recombinant kinase domain generates phosphoserine and
      phosphothreonine strongly and phosphotyrosine weakly, and TTK mRNA is restricted to
      proliferating tissues, tumours and cell lines.
    supporting_text: >-
      Escherichia coli expressing the complete kinase domain of TTK contain markedly
      elevated levels of phosphoserine and phosphothreonine as well as slightly
      increased levels of phosphotyrosine
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Original cloning paper; establishes dual-specificity kinase activity and
      proliferation-associated expression. Supports the kinase-activity annotations but
      only a correlation, not a regulatory role, for proliferation.
- id: PMID:18243099
  title: Mps1 phosphorylates Borealin to control Aurora B activity and chromosome
    alignment.
  findings:
  - statement: >-
      Human Mps1 directly phosphorylates Borealin/CDCA8 on residues required for Aurora B
      activity; cells without Mps1 kinase activity leave improper attachments uncorrected,
      and phosphomimetic Borealin restores alignment.
    supporting_text: >-
      Borealin/DasraB bearing phosphomimetic mutations restores Aurora B activity and
      alignment in Mps1-depleted cells
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract-only in the cache. Primary evidence for Ser/Thr kinase activity and the
      error-correction role; the generality of the Borealin route was later questioned by
      PMID:28441529, but the kinase activity and error-correction function stand.
