    Kinetochore-microtubule attachment error-correction kinase: at improperly attached
    kinetochores TTK phosphorylates outer-kinetochore substrates including SKA3 Ser34,
    reducing end-coupled microtubule binding by the Ska complex, and Borealin/CDCA8,
    supporting centromeric Aurora B activity; these activities destabilise erroneous
    attachments in opposition to PP2A-B56 so that chromosomes can become bioriented.
  supported_by:
  - reference_id: PMID:28441529
    supporting_text: >-
      We also identify the Ska complex as a key effector of Mps1 at the
      kinetochore-microtubule interface, as mutations that mimic constitutive
      phosphorylation destabilized K fibers in vivo
    reference_section_type: ABSTRACT
  - reference_id: PMID:18243099
    supporting_text: >-
      Borealin/DasraB, a member of the complex that regulates the Aurora B kinase, is
      directly phosphorylated by Mps1 on residues that are crucial for Aurora B activity
      and chromosome alignment
    reference_section_type: ABSTRACT
