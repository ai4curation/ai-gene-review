suggested_questions:
- question: How many Munc13-1 molecules make up a single release site in human synapses, and does the copy
    number per site set release probability in the way rodent nanocluster data suggest?
- question: Is the 2025 expression of concern on the C2B Ca2+/phosphoinositide study material to the model
    that C2B binding of PI(4,5)P2 offsets depression during trains, and has the finding been independently
    reproduced?
- question: Which UNC13A disease variants act through altered MUN-domain syntaxin opening versus altered
    regulatory (C1, C2B, calmodulin) input, and can these classes be predicted from structure?
suggested_experiments:
- description: Express human UNC13A disease variants in Munc13-1/2 double-knockout mouse neurons and measure
    readily releasable pool size, release probability and phorbol-ester potentiation, alongside in vitro
    syntaxin-1 opening assays with the purified MUN domain.
  hypothesis: Gain-of-function variants accelerate syntaxin-1 opening, whereas variants in regulatory domains
    leave basal priming intact but blunt second-messenger modulation.
- description: Quantify Munc13-1 protein and release-site number in human iPSC-derived motor neurons with and
    without TDP-43 knockdown, before and after antisense correction of the cryptic exon.
  hypothesis: Loss of Munc13-1 after TDP-43 depletion reduces the number of functional release sites and is
    reversed by restoring correct splicing.
