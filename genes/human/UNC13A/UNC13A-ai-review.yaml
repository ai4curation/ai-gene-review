core_functions:
- description: The MUN domain binds syntaxin-1 (weakly, through the syntaxin-1 SNARE motif and linker) and
    catalyses the transition from the closed syntaxin-1/Munc18-1 complex to the SNARE complex, the molecular
    step that primes docked synaptic vesicles for Ca2+-triggered fusion at the presynaptic active zone.
