  qualifier: involved_in
  review:
    summary: Positive regulation of dendrite extension (IDA) from a gain-of-function screen in which an
      adenoviral C2-domain library was overexpressed in mouse melan-a melanocytes and hits lengthened
      melanocyte dendrites.
    action: MARK_AS_OVER_ANNOTATED
    reason: The GO term dendrite is defined as a neuron projection, so melanocyte dendrites are not in its
      scope; the observation comes from overexpression of C2 domains in a screen, which does not show that
      endogenous Munc13-1 regulates such extensions; and Munc13-1 has no documented role in neuronal dendrite
      growth. The paper's full text was not available here, so the result itself is not disputed, only its
      reading as a physiological function.
