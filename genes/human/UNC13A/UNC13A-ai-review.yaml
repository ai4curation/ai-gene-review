id: Q9UPW8
gene_symbol: UNC13A
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'UNC13A encodes Munc13-1, a large (about 1,700 residues) multidomain peripheral membrane protein of
  the unc-13 family that is concentrated at the presynaptic active zone of most central synapses and is also present
  at neuromuscular junctions and in pancreatic beta cells. It is the principal synaptic vesicle priming factor:
  its central MUN domain binds syntaxin-1 and accelerates the transition of syntaxin-1 from the closed syntaxin-1/Munc18-1
  complex into the SNARE complex, so that docked vesicles become fusion competent and form the readily releasable
  pool. Its regulatory domains couple priming to second messengers and to the active-zone scaffold: an N-terminal
  C2A domain forms an autoinhibitory homodimer or a heterodimer with the RIM zinc finger, a calmodulin-binding region
  mediates Ca2+/calmodulin regulation, the C1 domain binds diacylglycerol and phorbol esters and recruits the protein
  to the plasma membrane, the C2B domain binds Ca2+ and phosphatidylinositol phosphates, and the C-terminal C2C
  domain contacts the vesicle membrane. Loss of Munc13-1 in mice abolishes evoked and spontaneous release at most
  glutamatergic synapses without affecting synapse formation, and Munc13-1 together with Munc13-2 is required for
  all fast synaptic release. Munc13-1 also promotes dense-core vesicle fusion and insulin granule priming. Biallelic
  and dominant variants cause neurodevelopmental disorders with seizures and impaired neuromuscular transmission,
  and TDP-43-dependent cryptic exon inclusion in UNC13A transcripts reduces the protein in ALS and frontotemporal
  dementia.'
