    membrane engage NOTCH1 on neighbouring cells but lack the DSL motif required for activation, so DLK1
    inhibits Notch signalling and holds progenitor cells in an undifferentiated state. The ectodomain
    is shed as soluble fetal antigen 1 and remains active.'
