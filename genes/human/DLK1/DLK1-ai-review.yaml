suggested_questions:
- question: Does DLK1 inhibit Notch by direct non-productive binding to NOTCH1, by competing with canonical
    DSL ligands in cis, or by a Notch-independent route in some cell types?
- question: How do membrane-bound DLK1 and the shed FA1 ectodomain differ in potency and range, and which
    dominates in tumours that are candidate targets for DLK1-directed therapy?
suggested_experiments:
- hypothesis: Shedding by ADAM17 converts DLK1 from a juxtacrine inhibitor into a diffusible one with
    a different target range.
  description: Compare Notch reporter activity, progenitor differentiation and tumour cell proliferation
    in cells expressing wild-type DLK1 versus a cleavage-resistant juxtamembrane mutant, with conditioned-medium
    transfer to assay the soluble component.
