id: P80370
gene_symbol: DLK1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: DLK1 (delta-like non-canonical Notch ligand 1, also called fetal antigen 1 or preadipocyte
  factor 1) is a single-pass type I membrane glycoprotein of the Delta/Serrate/LAG-2 family whose extracellular
  region consists of six EGF-like repeats but lacks the DSL motif required for canonical Notch activation,
  so it acts as a non-canonical, generally inhibitory modulator of Notch signalling. It is expressed from
  the paternally inherited allele of the imprinted DLK1-DIO3 locus, is abundant in fetal tissues, placenta,
  adrenal cortex, pancreatic islet beta cells and preadipocytes, and is re-expressed in neuroblastoma,
  small cell lung carcinoma, hepatoblastoma, hepatocellular carcinoma and other tumours, which makes its
  exposed ectodomain an antibody and CAR-T target. A juxtamembrane region is cleaved by ADAM17, releasing
  a soluble ectodomain (circulating FA1) that retains activity, so DLK1 signals both as a membrane protein
  in trans and as a secreted factor. Functionally it keeps progenitor cells undifferentiated, inhibiting
  adipogenesis and osteoblast differentiation while promoting osteoclastogenesis and bone resorption.
