suggested_questions:
- question: Is ARMC3 a true functional counterpart of yeast Vac8 despite belonging to a different PANTHER
    family? Does it bind class III PI3K complex I directly, and where in the spermatid is it anchored?
suggested_experiments:
- description: Localize endogenous ARMC3 in human spermatids and test direct binding of its ARM domain
    to ATG14 and PIK3C3 with purified proteins.
