id: Q5W041
gene_symbol: ARMC3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ARMC3 is an armadillo-repeat protein expressed mainly in testis and brain. In mouse spermatids
  it is required for autophagic degradation of cytosolic ribosomes (ribophagy), which supplies energy
  for mitochondria and flagellar beating. Armc3-null male mice are infertile with immotile sperm. Men
  homozygous for an ARMC3 splice-site variant have asthenozoospermia, with disrupted flagellar ultrastructure
  and vacuolated midpiece mitochondria, and a truncating ARMC3 variant in cattle causes a tail-stump sperm
  defect. Mouse ARMC3 is reported to recruit class III PI3-kinase complex I to the phagophore, as its
  proposed yeast counterpart Vac8 does, although PANTHER places ARMC3 and Vac8 in different families.
