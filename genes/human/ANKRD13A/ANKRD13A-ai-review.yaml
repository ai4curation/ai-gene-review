core_functions:
- description: UIM-containing adaptor that reads Lys63-linked polyubiquitin on membrane cargo such as
    activated EGFR and caveolin-1, restraining EGFR internalization at the plasma membrane and, with VCP/p97,
    routing ubiquitinated cargo from endosomes to lysosomes.
  molecular_function:
    id: GO:0140036
    label: ubiquitin-modified protein reader activity
  directly_involved_in:
  - id: GO:0048259
    label: regulation of receptor-mediated endocytosis
  locations:
  - id: GO:0005886
    label: plasma membrane
  - id: GO:0005770
    label: late endosome
  supported_by:
  - reference_id: PMID:22298428
    supporting_text: Stimulation of human HeLa cells with epidermal growth factor (EGF) rapidly induced
      direct binding of Ankrd 13 proteins to ubiquitinated EGF receptor (EGFR) via the UIMs.
  - reference_id: PMID:22298428
    supporting_text: Ankrd 13 proteins bound specifically to Lys-63-linked ubiquitin chains, which was
      consistent with a previous report that EGFR mainly undergoes Lys-63-linked polyubiquitination.
  - reference_id: PMID:22298428
    supporting_text: Ankrd 13 proteins were anchored, via the central region and UIMs, to the plasma membrane,
      where they colocalized with EGFR.
  - reference_id: PMID:22298428
    supporting_text: Finally, overexpression of wild-type as well as truncated-mutant Ankrd 13 proteins
      strongly inhibited rapid endocytosis of ubiquitinated EGFR from the surface in EGF-treated cells.
  - reference_id: PMID:26797118
    supporting_text: Collectively, our results suggest that Ankrd13 proteins cooperate with VCP to regulate
      the lysosomal trafficking of ubiquitinated Cav-1.
proposed_new_terms: []
suggested_questions:
- question: Is ANKRD13A's effect on internalization cargo-dependent, restraining EGFR internalization
    but promoting HLA class I internalization? The core function uses the direction-neutral GO:0048259
    for this reason.
- question: Is ANKRD13A's role in VCP recruitment (caveolin-1, mitophagy, pathogen vacuoles) a single
    general mechanism of reading Lys63 chains on membranes, and is it required at endogenous levels for
    EGFR trafficking?
suggested_experiments:
- description: Measure EGFR internalization and degradation in ANKRD13A/B/D triple-knockout cells, since
    the existing evidence comes from overexpression.
