  review:
    summary: Negative regulation of receptor internalization (IEA). ANKRD13 proteins bound to ubiquitinated
      EGFR restrain its rapid internalization; accepted.
    action: ACCEPT
    reason: '[PMID:22298428 "Ankrd 13 proteins were anchored, via the central region and UIMs, to the
      plasma membrane, where they colocalized with EGFR."] [PMID:22298428 "Finally, overexpression of
      wild-type as well as truncated-mutant Ankrd 13 proteins strongly inhibited rapid endocytosis of
      ubiquitinated EGFR from the surface in EGF-treated cells."] The direct evidence is from overexpression,
      which blocks rapid internalization of ubiquitinated EGFR. The direction may be cargo-dependent:
      in AML cells, raising ANKRD13A levels is reported to promote HLA class I internalization [PMID:34694569
      "USP30-AS1 induced HLA-I internalization from the cell membrane by up-regulating ANKRD13A, which
      might induce the immune escape of AML cells."].'
    supported_by:
    - reference_id: PMID:22298428
      supporting_text: Ankrd 13 proteins were anchored, via the central region and UIMs, to the plasma
        membrane, where they colocalized with EGFR.
    - reference_id: PMID:22298428
      supporting_text: Finally, overexpression of wild-type as well as truncated-mutant Ankrd 13 proteins
        strongly inhibited rapid endocytosis of ubiquitinated EGFR from the surface in EGF-treated cells.
    - reference_id: PMID:34694569
      supporting_text: USP30-AS1 induced HLA-I internalization from the cell membrane by up-regulating
        ANKRD13A, which might induce the immune escape of AML cells.
