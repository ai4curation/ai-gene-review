id: Q8IZ07
gene_symbol: ANKRD13A
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ANKRD13A (ankyrin repeat domain-containing 13A) is a ubiquitin-binding adaptor with C-terminal
  ubiquitin-interacting motifs (UIMs) that bind Lys63-linked polyubiquitin chains. At the plasma membrane
  it binds ubiquitinated, ligand-activated EGF receptor and restrains its rapid internalization; its own
  UIM-dependent monoubiquitination switches this binding off. On endosomes it works with the segregase
  VCP/p97 to traffic ubiquitinated caveolin-1 toward lysosomes, and in PINK1/Parkin mitophagy it recruits
  VCP to depolarized mitochondria to drive outer membrane rupture.
