id: P03973
gene_symbol: SLPI
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  SLPI (secretory leukocyte protease inhibitor, also antileukoproteinase/HUSI-I/
  WFDC4) is a small (~12 kDa), acid-stable, non-glycosylated, highly cationic
  protein secreted into mucosal fluids including saliva, airway sputum, cervical
  and seminal fluid, and found in neutrophil specific granules. It consists of two
  homologous WAP (whey acidic protein) four-disulfide-core domains. Its best
  characterized activity is canonical (Laskowski-type) reversible inhibition of
  serine proteases through a reactive-site loop in the C-terminal domain, with
  strong affinity for neutrophil elastase and cathepsin G and additional inhibition
  of chymotrypsin and trypsin; this protects epithelial and mucosal tissues from
  protease-mediated damage and contributes to wound healing. The cationic
  N-terminal domain carries antibacterial activity, and SLPI also has
  anti-inflammatory activity, downregulating macrophage responses to
  lipopolysaccharide and inhibiting NF-kappaB signalling, and antiviral activity
  against HIV-1 that is independent of its antiprotease function.
