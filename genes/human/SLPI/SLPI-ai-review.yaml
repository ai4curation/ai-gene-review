    antagonistic to bacterial lipopolysaccharide.'
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      SLPI is an LPS-induced macrophage product; transfection suppresses LPS-induced
      NF-kappaB activation and production of NO and TNF-alpha. Basis for the
      response-to-LPS and anti-inflammatory annotations (mouse, By similarity to
      human).
- id: PMID:8890201
