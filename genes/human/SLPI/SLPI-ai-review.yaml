    supported_by:
    - reference_id: PMID:9242546
      supporting_text: >-
        it most likely inhibits a step of viral infection that occurs after virus
        binding but before reverse transcription.
    - reference_id: PMID:19333378
      supporting_text: >-
        SLPI inhibits HIV-1 infection by modulating the interaction of the CD4
        receptor with PLSCRs
    additional_reference_ids:
    - PMID:9242546
