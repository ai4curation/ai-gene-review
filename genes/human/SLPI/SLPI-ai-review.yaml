- term:
    id: GO:0051851
    label: host-mediated perturbation of symbiont process
  evidence_type: IDA
  original_reference_id: PMID:2467900
  qualifier: involved_in
  review:
    summary: >-
      Annotation derived from the observation that SLPI is toxic to E. coli when
      overexpressed, inhibiting bacterial macromolecular synthesis.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The supporting reference (PMID:2467900) documents toxicity of SLPI to E. coli
      arising from high-level recombinant expression inside the bacterium, where the
      cationic protein binds the host nucleic acids nonspecifically and inhibits
      translation. The authors interpret this as a general artifact of overexpressing
      basic proteins in E. coli (lysozyme behaves identically), not as a biological
      host-pathogen interaction in which secreted human SLPI perturbs a symbiont
      process. SLPI does have genuine antibacterial activity, but that is captured by
      the antibacterial humoral response annotations; this symbiont-perturbation term
      over-interprets an expression artifact.
    supported_by:
    - reference_id: PMID:2467900
      supporting_text: >-
        high-level expression of basic recombinant proteins in E. coli may be
        problematic.
