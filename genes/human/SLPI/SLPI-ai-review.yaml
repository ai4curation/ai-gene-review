  qualifier: involved_in
  review:
    summary: >-
      SLPI inhibits HIV-1 infection; annotated as negative regulation of viral
      genome replication.
    action: MODIFY
    reason: >-
      SLPI's anti-HIV-1 activity acts at an early, host-cell-dependent step: it
      blocks infection after virus binding but before reverse transcription
      (PMID:9242546) by disrupting the PLSCR1-CD4 association (PMID:19333378). The
