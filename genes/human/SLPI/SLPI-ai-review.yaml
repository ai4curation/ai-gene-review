- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:12526812
  qualifier: enables
  supporting_entities:
  - UniProtKB:P28799
  review:
    summary: >-
      IPI annotation for the SLPI-progranulin (GRN, P28799) interaction, by which
      SLPI shields progranulin from elastase cleavage.
    action: REMOVE
    reason: >-
      Generic "protein binding" (GO:0005515) is uninformative as a molecular
      function. The underlying interaction with progranulin is real and biologically
      meaningful (it protects progranulin from elastase-mediated conversion), but
      that biology is captured by SLPI's serine-protease-inhibitor activity and the
      wound-healing process rather than by a bare protein-binding term; removal does
      not dispute the interaction.
    supported_by:
    - reference_id: PMID:12526812
      supporting_text: >-
        SLPI and PEPI form complexes, preventing elastase from converting PEPI to
        EPIs.
