existing_annotations:
- term:
    id: GO:0003677
    label: DNA binding
  evidence_type: IDA
  original_reference_id: PMID:2467900
  qualifier: enables
  review:
    summary: >-
      DNA binding attributed to SLPI from an experiment in which the cationic
      protein, overexpressed in E. coli, bound DNA via nonspecific charge
      interactions.
    action: KEEP_AS_NON_CORE
    reason: >-
      The original reference (PMID:2467900) documents charge-driven, nonspecific
      binding of overexpressed SLPI to DNA (and mRNA) in E. coli, which the authors
      themselves interpret as a recombinant-expression artifact shared by other
      basic proteins such as lysozyme, not a dedicated physiological DNA-binding
      function. However, later work shows nuclear SLPI binds NF-kappaB consensus
      DNA sites in a site-specific manner in monocytes (PMID:16352738), so a
      DNA-binding capability is genuine but peripheral to SLPI's core
      protease-inhibitor function; retained as non-core.
    supported_by:
    - reference_id: PMID:2467900
      supporting_text: >-
        SLPI bound to DNA in vitro, but transcription was not inhibited as strongly
        in cell-free reactions as it was in SGE61.
    - reference_id: PMID:16352738
      supporting_text: >-
        SLPI inhibition of NF-kappaB activation is mediated, in part, by competitive
        binding to the NF-kappaB consensus-binding site.
    additional_reference_ids:
    - PMID:16352738
- term:
    id: GO:0003729
    label: mRNA binding
  evidence_type: IDA
  original_reference_id: PMID:2467900
  qualifier: enables
  review:
    summary: >-
      mRNA binding attributed to SLPI from the same E. coli overexpression
      experiment, where the cationic protein bound mRNA via charge interactions and
      inhibited translation.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The single supporting reference (PMID:2467900) describes nonspecific,
      charge-driven binding of recombinantly overexpressed SLPI to mRNA, explicitly
      framed as an artifact of high-level expression of a basic protein in E. coli
      (behaving like egg-white lysozyme), not a physiological RNA-binding function
      of secreted SLPI. There is no evidence that extracellular/secreted SLPI binds
      mRNA in a biologically meaningful context, so the annotation over-states the
      function; retained but flagged as over-annotation.
    supported_by:
    - reference_id: PMID:2467900
      supporting_text: >-
        SLPI binds to nucleic acids via charge interactions and inhibits translation
        by competing with ribosomes for binding to mRNA.
- term:
    id: GO:0004866
    label: endopeptidase inhibitor activity
  evidence_type: IDA
  original_reference_id: PMID:12526812
  qualifier: enables
  review:
    summary: >-
      Endopeptidase inhibitor activity demonstrated by SLPI's ability to complex
      with proepithelin and block elastase-mediated proteolysis.
    action: MODIFY
    reason: >-
      The annotation is correct but more general than warranted: SLPI is a
      serine-type endopeptidase inhibitor, and the inhibited enzyme in this context
      (neutrophil elastase) is a serine protease. The more specific term
      GO:0004867 (serine-type endopeptidase inhibitor activity) is the appropriate
      molecular function and is already independently supported experimentally.
    proposed_replacement_terms:
    - id: GO:0004867
      label: serine-type endopeptidase inhibitor activity
    supported_by:
    - reference_id: PMID:12526812
      supporting_text: >-
        SLPI and PEPI form complexes, preventing elastase from converting PEPI to
        EPIs.
