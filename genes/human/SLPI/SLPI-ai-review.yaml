- id: PMID:2467900
  title: Secretory leukocyte protease inhibitor binding to mRNA and DNA as a possible
    cause of toxicity to Escherichia coli.
  findings: []
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Correctly cited, but describes a recombinant-overexpression artifact: the
      cationic SLPI binds mRNA and DNA via nonspecific charge interactions (like
      lysozyme) when overexpressed in E. coli, inhibiting translation and causing
      host toxicity. The authors frame this as a general problem of basic
      recombinant proteins, not a physiological nucleic-acid-binding function.
