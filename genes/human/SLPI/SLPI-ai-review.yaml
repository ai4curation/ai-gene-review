- id: PMID:16352738
  title: Secretory leucoprotease inhibitor binds to NF-kappaB binding sites in monocytes
    and inhibits p65 binding.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      SLPI enters monocytes, localizes to cytoplasm and nucleus, and inhibits
      NF-kappaB activation partly by binding NF-kappaB consensus DNA sites and
      blocking p65. Provides sequence-specific support for nuclear DNA binding
      distinct from the nonspecific charge binding of PMID:2467900.
- id: PMID:11017147
  title: Secretory leukocyte protease inhibitor mediates non-redundant functions necessary
    for normal wound healing.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Slpi-null mice show impaired cutaneous wound healing with increased
      inflammation and elastase activity and enhanced local TGF-beta activation.
- id: PMID:9039268
