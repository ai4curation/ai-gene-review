core_functions:
- description: >-
    Canonical reversible (Laskowski-type) inhibition of serine endopeptidases. SLPI
    uses the reactive-site loop of its C-terminal WAP domain (scissile Leu72-Met73
    bond, mature numbering) to form tight 1:1 complexes with neutrophil elastase and
    cathepsin G, and also inhibits chymotrypsin and trypsin. Acting in mucosal fluids
    and at sites of neutrophil activity, this limits excess protease activity and
    protects epithelial/mucosal tissue, contributing to wound healing and control of
    inflammation.
  molecular_function:
    id: GO:0004867
    label: serine-type endopeptidase inhibitor activity
  directly_involved_in:
  - id: GO:0010951
    label: negative regulation of endopeptidase activity
  locations:
  - id: GO:0005576
    label: extracellular region
  supported_by:
  - reference_id: PMID:3462719
    supporting_text: >-
      A potent inhibitor of human leukocyte elastase (EC 3.4.21.37) and cathepsin G
      (EC 3.4.21.20) and of human trypsin (EC 3.4.21.4) has been purified from human
      parotid secretions.
  - reference_id: PMID:3366116
    supporting_text: >-
      The reactive site loop of the second domain has elastase and chymotrypsin
      binding properties. It contains the scissile peptide bond between Leu72I and
      Met73I
  - reference_id: PMID:18421166
    supporting_text: >-
      P1 Leu72i and six hydrogen bonds between the main chains in the primary contact
      region have sufficient ability to inhibit HNE and PPE
proposed_new_terms: []
suggested_questions:
- question: >-
    To what extent do SLPI's antibacterial, anti-inflammatory (NF-kappaB) and
    antiviral activities depend on cellular uptake and intracellular localization
    versus its extracellular antiprotease activity, and are these separable by
    domain?
- question: >-
    Is the sequence-specific nuclear NF-kappaB-site DNA binding reported in
    monocytes a conserved physiological activity of SLPI across cell types, and what
    structural feature of this small WAP-domain protein mediates it?
suggested_experiments:
- hypothesis: >-
    The antibacterial activity of SLPI resides in the cationic N-terminal WAP domain
    and is mechanistically independent of the C-terminal antiprotease domain.
  description: >-
    Compare recombinant full-length SLPI, isolated N-terminal domain, isolated
    C-terminal domain, and active-site (P1) mutants in bactericidal assays against
    Gram-negative and Gram-positive species, measuring membrane permeabilization and
    killing kinetics, to dissociate antimicrobial from antiprotease function.
- hypothesis: >-
    SLPI inhibits HIV-1 at a post-binding, pre-reverse-transcription step by
    disrupting the PLSCR1-CD4 interaction at the host-cell surface, independent of
    its protease-inhibitory activity.
  description: >-
    Use protease-inactive (P1 mutant) and PLSCR-binding-deficient SLPI variants in
    HIV-1 infection assays of primary monocytes/T cells, combined with PLSCR1/PLSCR4
    knockdown and quantitative early reverse-transcription (PCR) readouts, to test
    whether receptor-complex disruption rather than antiprotease activity accounts
    for the antiviral effect.
