    supporting_text: Lamins provide a framework for the nuclear envelope
suggested_questions:
- question: Which lamin A/C phosphorylation events are best treated as causal regulators of nuclear-envelope
    organization rather than DNA-damage or mitotic pathway context?
- question: Can the IFFO1-lamin A/C DNA-break tethering mechanism be captured with existing GO terms without
    making DNA repair a core lamin A/C activity?
suggested_experiments:
- experiment_type: mechanical perturbation with rescue mutants
  description: Compare wild-type lamin A/C with assembly- and phosphorylation-site mutants in LMNA-null human
    cells for lamina meshwork formation, nuclear stiffness, and rupture under matched confinement.
- experiment_type: live-cell double-strand-break tracking
  description: In LMNA-null and IFFO1-null cells rescued with interaction-deficient mutants, track
    laser-induced DNA double-strand breaks relative to the lamina to separate immobilization from downstream
    repair phenotypes.
