core_functions:
- description: 'Nuclear-lamina scaffold: lamin A/C assembles into A-type lamin intermediate filaments in the nuclear
    lamina, forming a structural meshwork that organizes the nuclear envelope, anchors chromatin, and provides nuclear
    shape and stiffness.'
  molecular_function:
    id: GO:0160123
    label: structural constituent of nuclear lamina
  directly_involved_in:
  - id: GO:0006998
    label: nuclear envelope organization
