    supporting_text: Nuclear lamins form the major structural elements that comprise the nuclear lamina.
  - reference_id: PMID:2188730
    supporting_text: Bacterially expressed human nuclear lamin C, assembled in vitro into filaments
  - reference_id: file:human/LMNA/LMNA-uniprot.txt
    record_section:
