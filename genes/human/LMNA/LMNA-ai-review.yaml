id: P02545
gene_symbol: LMNA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'LMNA encodes A-type nuclear lamins, mainly lamin A and lamin C, which are type V intermediate-filament
  proteins that assemble into the nuclear lamina on the nucleoplasmic face of the inner nuclear membrane. Regulated
  lamin A/C assembly and disassembly provide a structural scaffold for nuclear-envelope organization, nuclear shape
  and nuclear stiffness, connect the lamina to chromatin and LINC-associated envelope proteins, and tune nuclear-envelope
  integrity under mechanical or DNA-damage stress. A smaller nucleoplasmic lamin A/C pool contributes to chromosome
  organization and DNA double-strand break immobilization through IFFO1, while disease mutations in LMNA perturb
  lamina architecture and give rise to laminopathies such as Emery-Dreifuss muscular dystrophy, cardiomyopathy,
  lipodystrophy and progeroid syndromes.'
alternative_products:
- name: A (Lamin-A)
  id: P02545-1
- name: C (Lamin-C)
  id: P02545-2
  sequence_note: VSP_002469, VSP_002470
- name: ADelta10 (Lamin ADelta10)
  id: P02545-3
  sequence_note: VSP_002468
- name: '4'
  id: P02545-4
  sequence_note: VSP_045977, VSP_045978, VSP_045979
- name: '5'
  id: P02545-5
  sequence_note: VSP_053503, VSP_053504
- name: 6 (Progerin)
  id: P02545-6
  sequence_note: VSP_053505
