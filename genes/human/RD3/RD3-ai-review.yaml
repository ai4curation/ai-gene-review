      to endosomal vesicles, and that the C terminus of GC1 is required for RD3 binding.
  - reference_id: PMID:23740938
    supporting_text: RD3 plays an essential role in the exit of guanylate cyclase from the ER
suggested_questions:
- question: Is the ER-export role of RD3 a direct chaperone or escort activity on the cyclase, separable from inhibition,
    and should GO gain a molecular function for it?
- question: Does RD3 regulate guanylate kinase in vivo, given that it stimulates purified GUK but does not change
    GMP phosphorylation in mouse retinal extracts?
suggested_experiments:
- hypothesis: RD3 binding is required for RetGC1 to be packaged into ER-exit (COPII) carriers.
  description: In photoreceptor-like cells or retinal explants expressing tagged RetGC1 with wild-type RD3 or binding-deficient
    RD3 mutants, follow RetGC1 export with an ER-release (RUSH) assay and COPII markers.
