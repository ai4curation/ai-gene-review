  evidence_type: IMP
  original_reference_id: PMID:21928830
  qualifier: involved_in
  review:
    summary: Protein transport; RD3 is needed to deliver the cyclase from the ER to the outer segment.
    action: MODIFY
    reason: RD3 mediates ER export of GC1 to endosomal vesicles in cultured cells, and in rd3 mice the cyclase is
      undetectable in photoreceptors until AAV-Rd3 moves it from the ER to rod and cone outer segments. RD3 travels
      with its cargo and is needed for its delivery; the specific process is protein localization to photoreceptor
      outer segment. The cited inhibition paper concludes that RD3 acts during cyclase maturation or incorporation
      into the outer segment.
