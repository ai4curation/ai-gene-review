- term:
    id: GO:0005634
    label: nucleus
  evidence_type: EXP
  original_reference_id: PMID:26100624
  qualifier: located_in
  review:
    summary: Nuclear staining in transfected cells and in human non-retinal tissues; not where RD3 acts.
    action: KEEP_AS_NON_CORE
    reason: A GFP fusion of RD3 shows subnuclear localization in transfected COS-1 cells, and a custom antibody
      stains nuclei and perinuclear areas in several human tissues. In native photoreceptors the protein is in the
      outer and inner segments with its cyclase partners, and no nuclear function has been demonstrated. Kept as
      non-core; the EXP row (PMID:26100624, abstract-only cache) is kept in deference to the curator.
    supported_by: &id006
    - reference_id: PMID:17186464
      supporting_text: the RD3-fusion protein shows subnuclear localization
    - reference_id: PMID:29030614
      supporting_text: Since RD3 is localized in both the nucleus and cytoplasm, immunoreactivity in both subcellular
        locations was counted together.
