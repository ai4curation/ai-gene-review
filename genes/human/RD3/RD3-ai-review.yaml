id: Q7Z3Z2
gene_symbol: RD3
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'RD3 (retinal degeneration protein 3) is a small, non-enzymatic, monomeric four-helix-bundle protein
  expressed mainly in rod and cone photoreceptors. It binds the photoreceptor membrane guanylyl cyclases RetGC1
  (GUCY2D) and RetGC2 (GUCY2F) and acts as a high-affinity allosteric inhibitor of them, suppressing both basal
  and GCAP-stimulated cyclase activity. The same interaction is needed for the cyclases to leave the endoplasmic
  reticulum and reach the photoreceptor outer segment: without RD3 the cyclases are not detected in rods and cones
  of the rd3 mouse, and RD3 re-expression restores their outer-segment localization. By keeping the cyclase inactive
  in the inner segment during its transport, RD3 protects photoreceptors from GCAP-driven cyclase activity, and
  its loss causes rapid rod and cone degeneration in the rd3 mouse and rcd2 dog and Leber congenital amaurosis type
  12 in humans. RD3 has also been reported to stimulate guanylate kinase in vitro and to be expressed, with nuclear
  and perinuclear staining, in several non-retinal human tissues, where its role is not established.'
