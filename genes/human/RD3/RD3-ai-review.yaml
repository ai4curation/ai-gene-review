core_functions:
- description: RD3 binds the photoreceptor guanylyl cyclases RetGC1 and RetGC2 and inhibits their basal and GCAP-stimulated
    activity, keeping the cyclase inactive in the inner segment during its transport (human recombinant proteins;
    mouse in vivo).
  molecular_function:
    id: GO:0030251
    label: guanylate cyclase inhibitor activity
  directly_involved_in:
  - id: GO:0031283
    label: negative regulation of guanylate cyclase activity
  locations:
  - id: GO:0001917
    label: photoreceptor inner segment
  supported_by:
  - reference_id: PMID:21928830
    supporting_text: We find that RD3 acts as a high-affinity allosteric inhibitor of RetGC, capable of both effectively
      competing with GCAPs and suppressing the catalytic activity of the cyclase.
  - reference_id: PMID:33539922
    supporting_text: the cyclase remaining in the inner segment becomes unprotected against activation by GCAPs,
      and this triggers the apoptotic process
- description: RD3 is required for the retinal guanylyl cyclases to leave the endoplasmic reticulum and reach rod
    and cone outer segments (mouse in vivo and cultured cells). No GO molecular function describes this escort role;
    it is recorded as the process.
  directly_involved_in:
