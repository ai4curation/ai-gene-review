  review:
    summary: Retina development; rd3 retinas develop normally and then degenerate.
    action: MODIFY
    reason: 'The IBA (PTN008623184, seeded by the mouse Rd3 annotation) and the ISS from mouse rest on the rd3 degeneration
      phenotype. That phenotype is a failure of photoreceptor maintenance, not of development: rd3 mouse retinas
      develop normally to postnatal day 14 before photoreceptors are lost. The claim is better expressed as retina
      homeostasis, which RD3 contributes to by suppressing toxic GCAP-driven cyclase activity in the inner segment.'
