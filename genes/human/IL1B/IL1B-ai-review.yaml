core_functions:
- description: Extracellular agonist cytokine for the type I IL-1 receptor. Pro-IL-1 beta is inactive in the
    cytosol until proteases such as CASP1, SpeB, or chymase generate mature IL-1 beta; the mature cytokine is
    released by unconventional secretion and binds IL1R1/IL1RAP to activate NF-kappaB and MAPK inflammatory
    signaling.
  molecular_function:
    id: GO:0005125
    label: cytokine activity
  locations:
  - id: GO:0005576
    label: extracellular region
  directly_involved_in:
  - id: GO:0070498
    label: interleukin-1-mediated signaling pathway
  - id: GO:0006954
    label: inflammatory response
  supported_by:
  - reference_id: PMID:2950091
    supporting_text: the initial translation product from IL-1 beta mRNA must be processed in order to bind to
      the IL-1 receptor and hence express biological activity
  - reference_id: PMID:1919436
    supporting_text: the inactive cytokine, 31 kD interleukin 1 beta (IL-1 beta), can be converted rapidly to
      an 18 kD biologically active species by human mast cell chymase
  - reference_id: PMID:33883744
    supporting_text: Cleaved GSDMD forms transmembrane pores to enable the release of IL-1 and to drive cell
      lysis through pyroptosis
suggested_questions:
- question: Can PHI-base and UniProt identify the intended supporting papers for the PMID:28720735 TAS rows
    and the PMID:19593445 mechanical-stimulus IEP row?
suggested_experiments:
- description: Compare IL1R1/IL1RAP signaling by caspase-1-, SpeB-, and chymase-matured IL-1 beta released
    through the same GSDMD-pore system to separate protease-specific maturation from extracellular cytokine
    potency.
