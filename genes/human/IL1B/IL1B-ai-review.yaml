    - reference_id: PMID:1919436
      supporting_text: the inactive cytokine, 31 kD interleukin 1 beta (IL-1 beta), can be converted rapidly
        to an 18 kD biologically active species by human mast cell chymase
    - reference_id: PMID:2950091
      supporting_text: the initial translation product from IL-1 beta mRNA must be processed in order to bind
        to the IL-1 receptor and hence express biological activity
