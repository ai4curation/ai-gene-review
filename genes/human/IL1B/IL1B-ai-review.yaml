- term:
    id: GO:0006954
    label: inflammatory response
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:107936
  - MGI:MGI:96542
  - MGI:MGI:96543
  - PANTHER:PTN002560644
  - RGD:2891
  - RGD:621159
  - UniProtKB:P01584
