id: P01584
gene_symbol: IL1B
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'Interleukin-1 beta (IL-1 beta) is a leaderless IL-1 family cytokine and IL1R1/IL1RAP agonist. It is
  synthesized as an inactive cytosolic pro-cytokine and activated by proteolytic removal of its N-terminal propeptide
  by caspase-1, microbial SpeB, mast-cell chymase, and other proteases. Mature IL-1 beta is released extracellularly
  through gasdermin D pores and other unconventional secretion routes, where it binds IL1R1, recruits IL1RAP, and
  triggers MYD88/IRAK/TRAF6/TAK1 signaling to activate NF-kappaB and MAPK inflammatory programs. It also binds alphaVbeta3
  and alpha5beta1 integrins, a secondary molecular activity that is distinct from its core IL-1 receptor agonist
  activity.'
