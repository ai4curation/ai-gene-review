- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: located_in
  supporting_entities:
  - UniProtKB:Q2Q5T5
  review:
    summary: >-
      Curator-judged sequence-similarity transfer from mouse Myomixer (Q2Q5T5). The human and
      mouse proteins are both 84 residues with a conserved N-terminal membrane anchor, and human
      MYMX is fusogenic in cells, which requires surface presentation.
    action: ACCEPT
    reason: >-
      The transfer is between close orthologs whose functional equivalence has been demonstrated
      directly: human MINION/MYMX ORFs rescue fusion in Minion-knockdown mouse myoblasts, and the
      human protein cooperates with MYMK in heterologous fusion assays.
    supported_by:
    - reference_id: PMID:28569745
      supporting_text: both untagged and C-terminally epitope-tagged human MINION ORFs strongly
        reconstituted cell fusion in MinionKD cells
    - reference_id: PMID:35642635
      supporting_text: In the presence of MYMK, MYMX WT strongly enhanced heterologous fusion,
        whereas the MYMX R46* variant had minimal fusogenicity
- term:
    id: GO:0007520
    label: myoblast fusion
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:3649059
  - PANTHER:PTN002222898
  - UniProtKB:A0A1B0GTQ4
  review:
    summary: >-
      The central process annotation for this gene, at the right level of specificity. MYMX is
      required for myoblast fusion in mouse, zebrafish and human cells, and its appearance in its
      own WITH/FROM list reflects the fact that human MYMX itself carries experimental evidence
      that the PAINT curator used in placing the IBD.
    action: ACCEPT
    reason: >-
      The function is ancestral to the whole vertebrate MYMX family: deletion abolishes fusion in
      mouse and in zebrafish, and orthologs from fish and reptiles substitute for the mammalian
      protein. The human gene sits squarely inside that clade and its loss-of-function variant
      causes a human fusion-deficiency myopathy, so there is no case for lineage-specific loss.
    supported_by:
    - reference_id: PMID:28386024
      supporting_text: Disruption of the Myomixer gene prevented fusion of C2C12 cells and
        primary mouse myoblasts but did not affect expression of myosin heavy chain, a marker for
        differentiation
    - reference_id: PMID:29078404
      supporting_text: abolishes myoblast fusion in vivo
