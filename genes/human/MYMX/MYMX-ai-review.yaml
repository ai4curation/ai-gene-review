  qualifier: is_active_in
  supporting_entities:
  - MGI:MGI:3649059
  - PANTHER:PTN002222898
  review:
    summary: >-
      Golgi membrane as a site of MYMX activity rests ultimately on one crude fractionation
      experiment in mouse, in which the microprotein was recovered in a membrane pellet that
      pooled plasma membrane, ER and Golgi. That fraction cannot discriminate among the three
      compartments, and every functional experiment places the working protein at the cell
      surface with its ectodomain outside.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The PAINT node inherits the mouse Myomixer/Myomerger localisation annotations, and among
      them the ER/Golgi calls derive from a mixed membrane fraction (PMID:28569745) rather than
      from imaging or marker co-localisation. Because MYMX acts on the outer leaflet of the
      plasma membrane from the extracellular side (PMID:30197239), a Golgi pool would at most
      represent biosynthetic transit and is not a site where the protein is active. The
      is_active_in qualifier therefore overstates the evidence. Not removed outright, since a
      single-pass membrane protein does traverse the secretory pathway.
    propagation_review:
      root_cause: SOURCE_WEAK_OR_INFERRED
      failure_modes:
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      - SOURCE_EVIDENCE_WEAK
      source_entities:
