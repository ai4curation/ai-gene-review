suggested_questions:
- question: >-
    Should GO acquire a child of GO:0140522 fusogenic activity for proteins that execute only the
    hemifusion-to-pore transition rather than the whole bilayer merger? MYMX cannot fuse membranes
    by itself in the absence of a hemifusion intermediate, so the parent term arguably overstates
    its activity, while no existing child matches its mechanism.
  experts:
  - Douglas P Millay
  - Leonid V Chernomordik
- question: >-
    Should the MYMX molecular function be modelled as membrane-curvature generation rather than as
    fusogenic activity? The measured biophysical property is a positive shift in outer-leaflet
    spontaneous curvature, which GO currently has no molecular-function term for.
  experts:
  - Michael M Kozlov
  - Leonid V Chernomordik
- question: >-
    Does human MYMX have a role in adult muscle regeneration comparable to the mouse satellite-cell
    requirement? All regeneration annotations on the human gene are transferred from mouse; the
    human patients described so far present with a congenital, developmental phenotype.
  experts:
  - Eric N Olson
  - Douglas P Millay
- question: >-
    Is MYMX present in the ER and Golgi beyond biosynthetic transit, and is any of its activity
    exerted there? The ER and Golgi annotations derive from a membrane fraction that pooled all
    three compartments, and no imaging has resolved them.
  experts:
  - Srihari C Sampath
  - Douglas P Millay
suggested_experiments:
- hypothesis: >-
    The purified MYMX ectodomain is sufficient to complete fusion of any pair of membranes already
    held at hemifusion, independently of cell type or of the protein that produced the hemifusion
    intermediate.
  description: >-
    Reconstitute hemifusion between protein-free liposomes of defined composition using
    polyethylene glycol or a minimal viral fusion peptide, then titrate recombinant human MYMX
    ectodomain (residues 26-84) and measure content mixing versus lipid mixing by dual fluorescent
    probes. Include the R46* truncation and phosphatidylserine-free liposomes as negative controls.
    A cell-free demonstration would establish fusogenic activity for the human protein directly
    rather than by orthology.
  experiment_type: in vitro liposome fusion assay with recombinant ectodomain
- hypothesis: >-
    Human MYMX is required for satellite-cell-mediated regeneration of adult human muscle, not only
    for developmental myogenesis.
  description: >-
    Generate MYMX-null and MYMX R46* human iPSC-derived or primary myoblast lines, engraft them into
    immunodeficient mice with cardiotoxin-injured muscle, and quantify donor-derived myonuclei in
    regenerated fibers. Rescue with wild-type MYMX and with base-edited R46* alleles. This tests the
    orthology-based regeneration annotations directly in human cells.
  experiment_type: xenograft regeneration assay
- hypothesis: >-
    MYMX resides at the plasma membrane and passes through the ER and Golgi only in transit, with no
    activity in those compartments.
  description: >-
    Combine surface biotinylation, protease protection of intact cells, and live-cell imaging of an
    extracellularly tagged MYMX with brefeldin A block and retention-using-selective-hooks release,
    to measure what fraction of the protein is ever resident in ER or Golgi and whether trapping it
    there affects fusion. A negative result would justify removing the ER and Golgi annotations
    rather than flagging them.
  experiment_type: trafficking and topology analysis
