          pooled plasma membrane, ER and Golgi (PMID:28569745); no imaging or marker
          co-localisation resolves the compartments.
      - source_id: PANTHER:PTN002222898
        source_label: MYMX family node
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: The node placement is sound - human MYMX lies inside the vertebrate MYMX clade -
