- term:
    id: GO:0140522
    label: fusogenic activity
  evidence_type: IDA
  original_reference_id: PMID:30197239
  qualifier: enables
  review:
    summary: >-
      GOA gives MYMX no molecular function at all, in either human or mouse, yet the protein is
      one of the few characterised non-viral fusogens. Its ectodomain, added in trans as a purified
      protein, restores fusion of MYMX-null myoblasts; it drives fusion pore formation and
      completion in a heterologous influenza-hemagglutinin system where MYMK is absent; and the
      isolated ectodomain generates positive spontaneous curvature in lipid monolayers, the
      physical change that resolves a hemifusion diaphragm into a pore. GO:0140522 fusogenic
      activity - the activity of joining two lipid bilayers to form a single membrane - is the
      closest existing term.
    action: NEW
    reason: >-
      Participation test: MYMX itself performs the step. The purified ectodomain acting from
      outside the cell is sufficient to convert hemifusion intermediates into complete fusion, and
      it does so in a system driven by an unrelated fusogen, so MYMX is not merely required for,
      or a substrate of, someone else's activity - it supplies the membrane-stressing activity
      that opens the pore. Comparator check: GO:0140522 and its children currently hold very few
      experimental annotations (for example Chlamydomonas HAP2 by IDA), and neither mouse Mymx nor
      Mymk carries any molecular function beyond protein binding. The absence is therefore not a
      convention excluding partial fusogens but a young branch of the ontology that has not been
      applied to the myoblast fusion machinery; no descendant of GO:0140522 fits MYMX, since the
      existing children specify GTPase-dependent, refolding-mediated and helical-bundle-zippering
      mechanisms. GO:0140912 membrane destabilizing activity was considered and rejected: its
      definition centres on increasing permeability and lysis, which is a side effect of MYMX
      overexpression rather than its function. The term is proposed at the parent level and the
      question of whether GO should add a pore-formation-specific child is raised in
      suggested_questions.
    supported_by:
    - reference_id: PMID:30197239
      supporting_text: This finding demonstrates that Myomerger drives fusion pore formation and
        fusion completion in a Myomaker-independent manner.
