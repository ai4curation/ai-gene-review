- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - MGI:MGI:3649059
  - PANTHER:PTN002222898
  review:
    summary: >-
      Correct, and the most informative location annotation on this gene. MYMX is a single-pass
      plasma membrane protein whose ectodomain faces the extracellular space, and its fusogenic
      activity is exerted on the outer leaflet of the plasma membrane, so is_active_in is exactly
      the right qualifier.
    action: ACCEPT
    reason: >-
      The PAINT node placement is well supported: mouse Myomixer is detected at the cell surface
      by immunostaining of intact myoblasts and by cell-impermeable surface biotinylation, and
      recombinant ectodomain added outside the cell rescues fusion of null myoblasts, which only
      makes sense for a surface-acting protein. MYMX orthologs from fish and reptiles are
      fusogenic in mammalian cells, so the function - and with it the surface localisation - is
      inherited across the clade the IBD covers.
    supported_by:
    - reference_id: PMID:28386024
      supporting_text: immunostaining of intact C2C12 myoblasts expressing Myomixer with FLAG tag
        at the C terminus revealed the presence of the protein on the cell surface
    - reference_id: PMID:30197239
      supporting_text: myoblast fusion depends on the interactions between the ectodomain of
        Myomerger and the plasma membrane of the myoblasts
