- term:
    id: GO:0014905
    label: myoblast fusion involved in skeletal muscle regeneration
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q2Q5T5
  - ensembl:ENSMUSP00000126690
  review:
    summary: >-
      Orthology transfer of the mouse regeneration annotation, which rests on tamoxifen-inducible
      deletion of Mymx in Pax7-positive satellite cells: satellite cell fusion and muscle
      regeneration after injury are abolished. Human MYMX is expressed in regenerative myogenesis
      and the orthology is unambiguous, so the projection is reasonable.
    action: KEEP_AS_NON_CORE
    reason: >-
      This is the same molecular activity as GO:0007520 applied in the adult injury context; it is
      a physiological setting for the core function rather than a second function. Retaining it is
      useful because it records the satellite-cell requirement, but the core annotation is plain
      myoblast fusion. Direct human evidence for post-injury regeneration is absent, so it is kept
      as non-core rather than accepted as core.
    supported_by:
    - reference_id: PMID:29581287
      supporting_text: abolishes satellite cell fusion and prevents muscle regeneration
    - reference_id: PMID:35642635
      supporting_text: Similarly, deletion of Mymx or Mymk in adult satellite cells prevents
        skeletal muscle regeneration in response to injury (13, 14).
- term:
    id: GO:0014905
    label: myoblast fusion involved in skeletal muscle regeneration
  evidence_type: IMP
  original_reference_id: PMID:35642635
  qualifier: involved_in
  review:
    summary: >-
      The cited paper is the human CFZS2 study, and it is the right paper for a human MYMX
      loss-of-function process annotation - but its experiments are developmental, not
      regenerative. Patient-derived iPSC myoblasts fail to fuse, knock-in mice carrying the human
      R46* allele die perinatally from absent multinucleated myofibers, and the truncated protein
      is stable but poorly fusogenic. Regeneration appears only in the introduction, citing the
      earlier mouse satellite-cell work.
    action: MODIFY
    reason: >-
      The experimental basis supports the parent term GO:0007520 myoblast fusion, in a
      developmental setting, and not the regeneration-restricted child. No injury model, satellite
      cell assay or adult regeneration experiment is reported here. This is a term-choice
      correction, not a challenge to the curator's reading of the gene: the same paper amply
      supports involvement in myoblast fusion, and the regeneration claim is separately carried by
      the mouse-derived IEA and ISS rows.
    proposed_replacement_terms:
    - id: GO:0007520
      label: myoblast fusion
    supported_by:
