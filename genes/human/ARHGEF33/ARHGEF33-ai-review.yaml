description: ARHGEF33 is a little-studied Rho guanine nucleotide exchange factor of 844 residues with
  a central Dbl-homology (DH) domain. The mouse ortholog, expressed in cultured cells, activates RhoA,
  induces cell contraction and inhibits neurite extension in a Rho-kinase-dependent manner. In the developing
  zebra finch retina its transcript is enriched in Müller glia at the parafovea, suggesting a role in
  foveal development. Its physiological substrates and regulation in human tissues are unknown.
