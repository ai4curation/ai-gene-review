suggested_questions:
- question: Endogenous TLR8 colocalises with EEA1 and an ER marker but not with late-endosome, 
    lysosome or Golgi markers (PMID:22164301). Should the endolysosome membrane (GO:0036020) and 
    Golgi membrane rows be replaced by early endosome membrane (GO:0031901), and should the Reactome
    TLR3/7/8/9 trafficking model be split so that TLR8 does not inherit the endolysosomal steps?
- question: GO:0009897 external side of plasma membrane (IDA, PMID:24942581) rests on a paper that 
    measured TLR8 by intracellular staining and calls it intracellular TLR8. Should this row be 
    retired?
- question: The two structurally defined TLR8 sites bind uridine and a short oligonucleotide 
    (PMID:25599397, PMID:31778653). GO has no term for uridine binding, and GO:0003727 
    single-stranded RNA binding does not describe site 1. Should a uridine binding term be created 
    under GO:0001884 pyrimidine nucleoside binding, in parallel with GO:1905108 guanosine binding, 
    which is what TLR7's equivalent site needs?
- question: GO:0003677 DNA binding (IDA, PMID:16123302) sits alongside TLR8's RNA-binding terms. Do 
    the G-rich oligodeoxynucleotide ligands used in that study bind TLR8 directly, or do they act 
    through another route? A direct binding measurement would settle whether the row should stand.
- question: GO:0016064 immunoglobulin mediated immune response (TAS) on TLR8 cites the regulatory T 
    cell paper, which does not address antibody responses. Is there a source for it, given that the 
    B-cell phenotype of TLR8 gain-of-function disease is impaired maturation rather than a positive 
    contribution?
- question: GO:0071260 cellular response to mechanical stimulus (IEP) on TLR8, TLR7 and TLR3 all 
    cite PMID:19593445, a paper on BAD and prostate cancer growth that never mentions TLRs. What was
    the intended reference?
- question: The TLR7/8/9 PAINT node carries is_active_in GO:0005886 plasma membrane, yet TLR8 cannot
    dimerise until endosomal proteases cleave its Z-loop. Should that assertion be retired or 
    demoted at the node?
- question: Z-loop cleavage by furin-like convertases and cathepsins is a prerequisite for TLR8 
    activation. Should TLR8 carry a term for protein maturation by peptidase-dependent cleavage as a
    target of that process, or is this better modelled on the proteases with TLR8 as has input?
suggested_experiments:
- description: Quantitative colocalisation of endogenous TLR8 with EEA1, Rab7, LAMP1, p115 and 
    calreticulin in primary human monocytes and monocyte-derived macrophages before and after 
    ssRNA40 stimulation, to establish whether the signalling-competent, Z-loop-cleaved receptor 
    stays in early endosomes or moves onward.
- description: Direct binding assays (ITC or SPR) of the cleaved TLR8 ectodomain against uridine, 
    cytidine, guanosine and the G-rich oligodeoxynucleotides used in PMID:16123302, to test whether 
    TLR8 binds DNA at either site and to calibrate site-1 nucleoside specificity against TLR7's.
- description: Side-by-side stimulation of TLR7- and TLR8-expressing reporter cells with RNase T2 
    and PLD3/PLD4 digestion products of the same RNA, to test directly whether the 
    guanosine/2',3'-cGMP versus uridine split between the two receptors' first sites holds for 
    physiologically generated ligands.
- description: Cell-surface versus intracellular flow cytometry of TLR8 in primary human monocytes 
    with and without permeabilisation, using a validated antibody and TLR8-knockout cells as a 
    control, to determine whether any surface pool exists at all.
- description: Measurement of IFN-gamma and IFN-lambda, separately and with the producing cell 
    identified, in human PBMC and purified monocyte cultures stimulated with a TLR8-selective 
    agonist, to test whether the type II and type III interferon annotations belong to TLR8 and in 
    which cells.
