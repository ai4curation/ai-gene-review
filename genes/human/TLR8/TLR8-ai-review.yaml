id: Q9NR97
gene_symbol: TLR8
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'TLR8 (Toll-like receptor 8, CD288) is an endosomal pattern recognition receptor of the innate
  immune system and the most highly expressed nucleic-acid-sensing Toll-like receptor of the human myeloid
  compartment, found in monocytes, macrophages and myeloid dendritic cells. It is a single-pass type I
  membrane glycoprotein whose horseshoe-shaped leucine-rich-repeat ectodomain faces the endosomal lumen
  and whose cytoplasmic TIR domain transmits the signal. TLR8 detects the degradation products of single-stranded
  RNA rather than intact RNA, using two distinct sites: uridine binds a pocket at the interface between
  the two protomers - the same pocket that accommodates synthetic imidazoquinolines such as R-848 - while
  a short oligonucleotide binds a second site on the concave LRR surface. Both sites must be occupied
  for activation. The ligands are generated in the same compartment by the lysosomal endoribonuclease
  RNase T2, which cleaves single-stranded RNA between purine and uridine residues, supplying catabolic
  uridine and purine-2'',3''-cyclophosphate-terminated oligoribonucleotides. Natural agonists include
  GU-rich single-stranded RNA sequences from HIV-1, SARS-CoV-1 and SARS-CoV-2 and endogenous RNAs such
  as microRNAs. Activation has two structural prerequisites: the receptor exists as a pre-formed dimer
  whose Z-loop, the insertion between leucine-rich repeats 14 and 15, must first be cleaved by furin-like
  proprotein convertases and cathepsins in endosomes - the uncleaved loop sterically blocks dimerisation
  - after which ligand binding reorganises the dimer so that the two C-termini and hence the two TIR domains
  come together. The apposed TIR domains recruit MyD88 and assemble the IRAK4-IRAK1/IRAK2-TRAF6 myddosome,
  activating canonical NF-kappaB and IRF7 and driving IL-1beta, IL-6, IL-12, TNF and type I interferon.
  Endogenous TLR8 resides in the early endosome and the endoplasmic reticulum, distinguishing it from
  TLR7 and TLR9, which occupy endolysosomes; it associates with the chaperone UNC93B1, which is required
  for its trafficking and signalling. Beyond cytokine induction, TLR8 signalling in CD4-positive regulatory
  T cells relieves their suppressive activity. X-linked gain-of-function variants, frequently present
  as somatic mosaicism, cause an inborn error of immunity with refractory neutropenia, lymphoproliferation,
  autoinflammation, impaired B-cell maturation and in some cases bone marrow failure.'
