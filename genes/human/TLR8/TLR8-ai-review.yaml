core_functions:
- description: TLR8 is the recognition receptor of the endosomal TLR8 signalling pathway. Its 
    ectodomain reads RNA degradation products in the endosomal lumen at two sites - uridine at the 
    interface between protomers and a short oligonucleotide on the concave leucine-rich-repeat 
    surface - and both must be occupied for activation. The receptor is a pre-formed dimer that is 
    held inactive until endosomal furin-like convertases and cathepsins cleave its Z-loop, which 
    otherwise blocks the two protomers from approaching each other; ligand binding then reorganises 
    the dimer so that the two C-termini and their TIR domains come together, recruiting MyD88 and 
    assembling the IRAK4-IRAK1/2-TRAF6 myddosome that activates canonical NF-kappaB and IRF7. 
    Because the ligands are ordinary RNA catabolites, specificity for microbial RNA rests on 
    compartment and on the local supply of RNase T2 cleavage products.
