    supporting_text: These results demonstrate that TLR8 is a sensor for both uridine and a short 
      oligonucleotide derived from RNA.
  - reference_id: PMID:26929371
    supporting_text: TLR8 with the uncleaved Z-loop is unable to form a dimer, which is essential 
      for activation, irrespective of the presence of agonistic ligands.
  - reference_id: PMID:23520111
    supporting_text: Thus, ligand binding induces reorganization of the TLR8 dimer, which enables 
      downstream signaling processes.
  - reference_id: PMID:22164301
    supporting_text: we demonstrate that TLR8 localized to the early endosome and the ER but not to 
      the late endosome or lysosome in human monocytes and HeLa transfectants
- description: "The second TLR8 ligand-binding site, on the concave face of the leucine-rich-repeat horseshoe,
    binds short single-stranded oligoribonucleotides - the purine-2',3'-cyclophosphate-terminated fragments
    left by RNase T2 cleavage - and this is how TLR8 reads viral RNA. GU-rich single-stranded sequences
    from HIV-1, SARS-CoV-1 and SARS-CoV-2, and endogenous RNAs such as microRNAs, act through this recognition
    to drive proinflammatory cytokine and type I interferon output from human myeloid cells. The requirement
    extends to the first site: single-stranded RNA activates TLR8 only when uridine also occupies the
    interface pocket, so RNA sensing by TLR8 is the joint occupancy of both sites by products of the same
    cleavage reaction."
