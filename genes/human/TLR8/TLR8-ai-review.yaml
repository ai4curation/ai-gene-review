  review:
    action: KEEP_AS_NON_CORE
    summary: PAINT IBA asserting that TLR8 is active in the plasma membrane, at the TLR7/8/9 clade 
      node.
    reason: 'Not where TLR8 acts. Endogenous TLR8 is found in the early endosome and the ER, and endosomal
      residence is a prerequisite rather than a detail: the Z-loop must be cleaved by endosomal furin-like
      convertases and cathepsins before the receptor can form the activation dimer at all. Retained as
      non-core because the node-level assertion covers three receptors, and the question of retiring it
      at the node is raised separately.'
