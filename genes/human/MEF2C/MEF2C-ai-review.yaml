  - reference_id: PMID:16043483
    supporting_text: MEF2/HAND1 interaction results in synergistic activation of MEF2-dependent promoters, and MEF2
      binding sites are sufficient to mediate this synergy
  - reference_id: PMID:15486975
    supporting_text: full-length MEF2C protein is able to interact with dHAND in vitro and in vivo
  - reference_id: PMID:19204083
    supporting_text: we report a physical interaction between TBX5 and MEF2C leading to a synergistic activation
      of the alpha-cardiac myosin heavy chain (MYH6)
  - reference_id: PMID:19204083
    supporting_text: they physically associate through their DNA-binding domains to form a complex on the MYH6 promoter
