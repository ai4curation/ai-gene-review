      the myogenic bHLH factors
  - reference_id: PMID:21556048
    supporting_text: phosphorylation of MEF2C on T(80) by skeletal myosin light chain kinase (skMLCK) enhances skeletal
      and not cardiac myogenesis
  - reference_id: PMID:21556048
    supporting_text: MEFT80A was deficient in recruitment of p300 to skeletal but not cardiac muscle promoters
  - reference_id: PMID:9770491
    supporting_text: Myogenic cells expressing the chimerical MEF2C/nlsSV40, but not wild-type MEF2C, retained this
      transcription factor in the nucleus and were resistant to the inhibitory action of TGF-beta
- description: Binds partner DNA-binding transcription factors through its MADS/MEF2 domain (HAND1/HAND2, TBX5,
    NKX2-5, myogenic bHLH, SOX10, SMAD2). It recruits or is recruited by them to composite promoters for synergistic
    activation of targets such as NPPA and MYH6.
  molecular_function:
