    label: MAPK cascade
  evidence_type: IDA
  original_reference_id: PMID:9858528
  qualifier: involved_in
  review:
    summary: MAPK cascade, based on p38 regulation of MEF2 factors.
    action: MARK_AS_OVER_ANNOTATED
    reason: MEF2C is a downstream substrate of p38 MAPK (p38 phosphorylation raises its transactivation activity).
      It does not act as a kinase tier in the cascade. Being acted on by a cascade is not participation in it. A
      response or regulation term would fit better, so this is an over-annotation. The cited paper mainly concerns
      MEF2A.
    supported_by:
    - reference_id: PMID:9858528
      supporting_text: We showed previously that the transactivation activity of MEF2C is stimulated by p38 mitogen-activated
        protein (MAP) kinase
