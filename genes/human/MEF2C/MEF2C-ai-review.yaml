core_functions:
- description: MADS-box Pol II DNA-binding transcription factor. It binds A/T-rich MEF2 cis-elements as a dimer
    and activates muscle, cardiac and other lineage target genes. It is the transcriptional effector of cardiac
    muscle cell differentiation downstream of, and in a positive loop with, NKX2-5, GATA4 and ISL1.
  molecular_function:
    id: GO:0000981
    label: DNA-binding transcription factor activity, RNA polymerase II-specific
  directly_involved_in:
  - id: GO:0045944
    label: positive regulation of transcription by RNA polymerase II
  - id: GO:0055007
    label: cardiac muscle cell differentiation
  - id: GO:0007507
    label: heart development
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:8455629
    supporting_text: The products of this gene have DNA-binding and trans-activating activities indistinguishable
      from those of the previously reported MEF2 factors
  - reference_id: PMID:9162005
    supporting_text: In mice homozygous for a null mutation of MEF2C, the heart tube did not undergo looping morphogenesis,
      the future right ventricle did not form, and a subset of cardiac muscle genes was not expressed
  - reference_id: PMID:9162005
    supporting_text: MEF2C is an essential regulator of cardiac myogenesis and right ventricular development
  - reference_id: PMID:9857019
    supporting_text: Similar to Nkx2-5, MEF2C expression initiated cardiomyogenesis, resulting in the up-regulation
      of Brachyury T, bone morphogenetic protein-4, Nkx2-5, GATA-4, cardiac alpha-actin, and myosin heavy chain
      expression
  - reference_id: PMID:9857019
    supporting_text: These findings indicate the presence of a positive regulatory network between Nkx2-5 and MEF2C
      and show that both factors can direct early stages of cell differentiation into a cardiomyogenic pathway
  - reference_id: PMID:19035347
    supporting_text: ventricular hypoplasia is the result of defective ventricular cell differentiation
- description: Pol II DNA-binding transcription factor that amplifies myogenic bHLH (MyoD/myogenin) activity to
    drive skeletal myoblast differentiation. skMLCK phosphorylation (T80) enables p300 recruitment to skeletal muscle
    promoters, and class II HDAC binding represses it.
  molecular_function:
