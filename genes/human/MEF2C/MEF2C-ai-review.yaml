      differentiation
  - reference_id: PMID:10983972
    supporting_text: These HDACs do not interact directly with MyoD, yet they suppress its myogenic activity through
      association with MEF2
  - reference_id: PMID:17336904
    supporting_text: Endochondral bone formation is exquisitely sensitive to the balance between MEF2C and the corepressor
      histone deacetylase 4 (HDAC4)
suggested_questions:
- question: Does MEF2C act in second heart field specification, or only in differentiation of SHF-derived right
    ventricle and outflow tract myocardium? Mef2c-null and Nkx2-5;Mef2c double mutants still express SHF markers.
- question: Which direct MEF2C target genes in excitatory neurons mediate its restraint of synapse number, and which
    of these explain the MEF2C haploinsufficiency syndrome?
- question: Should GO represent MEF2C as having input from p38/ERK5/skMLCK signalling (on the kinase) rather than
    annotating MEF2C to 'MAPK cascade'?
suggested_experiments:
- hypothesis: MEF2C binding at second heart field enhancers depends on ISL1/GATA4 co-occupancy and is needed for
    right-ventricular myocyte differentiation but not for SHF progenitor specification.
  description: Do CUT&RUN for MEF2C, ISL1 and GATA4 in staged human iPSC-derived SHF progenitors and right-ventricle-like
    cardiomyocytes. Combine with an inducible MEF2C knockout and single-cell RNA-seq to separate specification from
    differentiation defects.
  experiment_type: genome-wide DNA-binding and single-cell transcriptomic profiling
- hypothesis: Patient MEF2C missense variants in the MADS/MEF2 domain impair DNA binding or partner-TF/HDAC binding
    and reduce activation of neuronal synapse-pruning targets.
  description: Measure DNA binding (EMSA/SELEX), dimerization, partner binding (HAND2, TBX5, HDAC4/5) and reporter
    activation for a panel of NEDHSIL variants. Rescue synapse number in MEF2C+/- human iPSC-derived neurons.
  experiment_type: variant functional characterization
