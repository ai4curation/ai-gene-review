    reason: The exact mouse donor has an IDA annotation from PMID:23319608. Its promoter occupancy and
      regulatory work, together with human enhancer ChIP, support cis-regulatory-region binding. The inspected
      experiments do not establish intrinsic recognition of a specific DNA motif. GO:0000976 explicitly
