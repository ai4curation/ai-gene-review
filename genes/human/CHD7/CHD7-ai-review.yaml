core_functions:
- description: CHD7 couples ATP hydrolysis to nucleosome repositioning and altered DNA accessibility.
    This chromatin-remodeling activity supports context-dependent transcription and gene-expression regulation
    in nuclear chromatin. Nucleolar localization and rDNA occupancy add a ribosomal-gene regulatory context,
    while the exact remodeling step at rDNA remains a mechanistic model.
