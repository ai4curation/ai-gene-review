suggested_questions:
- question: What exact assay and patient endocrine findings support the original growth-hormone secretion
    assertion, as distinct from growth retardation or hormone deficiency?
- question: Which transported substrate and regulatory step underlie ARBA00027251 for CHD7?
- question: How do the four current products differ in ATPase/remodeling activity and nucleolar targeting,
    and which sequence was present in each published construct?
- question: Does CHD7 remodel rDNA promoter nucleosomes directly, and which cofactors connect its occupancy
    to reduced DNA methylation and increased rRNA expression?
- question: Which CHD7–CHD8 and PBAF associations occur between native full-length proteins in defined
    developmental cell states?
suggested_experiments:
- description: Compare sequence-verified current CHD7 products with matched ATPase, DNA-binding and nucleosome-remodeling
    assays and endogenous localization.
- description: Measure rDNA nucleosome position and accessibility after acute CHD7 depletion and rescue
    with wild-type versus ATP-site mutant protein.
- description: Combine endogenous partner tagging with domain-specific perturbation to distinguish direct
    binding from complex co-association in neural crest and neuroepithelial cells.
