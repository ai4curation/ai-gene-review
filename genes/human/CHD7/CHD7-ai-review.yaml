id: Q9P2D1
gene_symbol: CHD7
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CHD7 is an ATP-dependent chromatin remodeler that binds DNA and nucleosomes and changes histone–DNA
  contacts. Histone recognition and associations with other chromatin regulators help place its activity
  at cell-type-specific regulatory regions. CHD7 acts in nuclear chromatin and also has a nucleolar pool
  associated with active ribosomal DNA and rRNA expression. Human cell models establish roles in neural
  crest formation and neuroepithelial identity, while pathogenic variants cause CHARGE syndrome with variable
  craniofacial, sensory, cardiac, genital and neurodevelopmental abnormalities. Several alternative products
  are recorded, including a short nucleolar product; the full-length motor assays do not establish equivalent
  catalytic activity for every product.
