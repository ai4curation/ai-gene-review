  - reference_id: PMID:10625657
    supporting_text: Investigation of these two classes of mutant enzyme suggests that the integrity
      of the quaternary structure of aldolase B is critical for maintaining its full catalytic
      function.
  - reference_id: Reactome:R-HSA-71495
    supporting_text: In this freely reversible cytosolic reaction, DHAP (dihydroxyacetone phosphate)
      and GA3P (D-glyceraldehyde 3-phosphate) react to form F1,6PP (D-fructose 1,6-bisphosphate).
- description: ALDOB cleaves fructose 1-phosphate into dihydroxyacetone phosphate and glyceraldehyde
    in cytosol, enabling dietary fructose catabolism in liver, kidney and intestine. Its substantial
    F1P activity distinguishes its metabolic role from the other vertebrate aldolase isozymes.
  molecular_function:
