core_functions:
- description: The cytosolic ALDOB homotetramer catalyzes reversible aldol cleavage of fructose
    1,6-bisphosphate to dihydroxyacetone phosphate and glyceraldehyde 3-phosphate. This single
    reaction serves glycolysis in the cleavage direction and gluconeogenesis in the condensation
    direction.
  molecular_function:
    id: GO:0004332
    label: fructose-bisphosphate aldolase activity
  directly_involved_in:
  - id: GO:0061621
