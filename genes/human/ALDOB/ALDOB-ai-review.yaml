      this notes entry records external access and is not used as a primary-quote validation proxy.
suggested_questions:
- question: Should GO:0070061 be removed from ALDOB when the cited experiments concern fructose
    1-phosphate and fructose 1,6-bisphosphate rather than unphosphorylated fructose? A
    phosphate-sugar interaction term, if needed, must preserve ligand specificity rather than
    duplicate the catalytic annotations.
- question: How do the historical PAINT PTN000179343 annotations correspond to the current PTHR11627
    IBD at PTN004279385?
- question: What original ALDOB experiments support the source-specific EXP assignments to
    PMID:6696436 and the metadata-only PMID:12205126 record?
- question: How broadly do endogenous human ALDOB-G6PD-p53 scaffolding and ALDOB-dependent V-ATPase
    assembly operate outside the hepatic tumor models and heterologous yeast assays, respectively?
- question: Does endogenous ALDOB localize to defined centriolar satellites in physiologically
    expressing human cells, beyond the transfected-HeLa peripheral centrosomal pattern?
- question: Should ALDOA and PFKM fructose-binding judgments be revisited where they equate
    phosphorylated substrates with free fructose? Their existing ACCEPT reasons invoke F1,6BP or
    F6P, but GO:0070061 is on the monosaccharide-binding branch and GO:0070095 is on the
    carbohydrate-derivative-binding branch. The shared ARBA00092505 mapping also warrants
    source-level review. This is a scoped follow-up question, not an automatic reversal of those
    genes without their primary evidence.
suggested_experiments:
- description: Compare purified human ALDOB binding to free fructose, F1P and F1,6BP with
    catalysis-independent affinity measurements, using catalytic and oligomerization controls.
- description: Measure endogenous ALDOB-dependent G6PD-p53 complex formation and pentose-phosphate
    flux across primary human liver, kidney and intestinal cells, separating catalytic rescue from
    interaction-selective rescue.
