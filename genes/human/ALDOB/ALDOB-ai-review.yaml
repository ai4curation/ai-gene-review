    supporting_text: We describe the biochemical and biophysical characterization of seven natural
      human aldolase B variants, identified in patients suffering from hereditary fructose
      intolerance and expressed as recombinant proteins in E. coli, from which they were purified to
      homogeneity.
  - reference_id: PMID:10970798
