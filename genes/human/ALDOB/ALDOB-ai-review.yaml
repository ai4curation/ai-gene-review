id: P05062
gene_symbol: ALDOB
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ALDOB encodes liver-type fructose-bisphosphate aldolase, a cytosolic class I aldolase
  expressed prominently in liver, kidney and intestine. Its homotetramer catalyzes reversible
  cleavage of fructose 1,6-bisphosphate into dihydroxyacetone phosphate and glyceraldehyde
  3-phosphate, contributing to glycolysis and the reverse gluconeogenic reaction. The same enzyme
  efficiently cleaves fructose 1-phosphate into dihydroxyacetone phosphate and glyceraldehyde during
  dietary fructose catabolism. Biallelic loss of function causes hereditary fructose intolerance. In
  addition to these catalytic roles, ALDOB has experimentally supported interactions with the
  cytoskeleton and V-ATPase, and a reported noncatalytic scaffold activity that
  strengthens p53-mediated G6PD inhibition in hepatocellular carcinoma models.
