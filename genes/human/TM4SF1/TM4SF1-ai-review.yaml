suggested_questions:
- question: What is the molecular function of TM4SF1 in its surface complexes, and how does it promote
    endothelial and tumor-cell migration/angiogenesis?
suggested_experiments:
- description: Define the TM4SF1 surface interactome (partners in its high-molecular-weight complexes)
    by proximity labeling, and test migration/angiogenesis phenotypes after TM4SF1 knockdown in endothelial
    cells.
