  label: Homo sapiens
description: TM4SF1 (tumor-associated antigen L6) is a four-transmembrane glycoprotein of the L6/transmembrane-4
  L-six family. It has short cytoplasmic N- and C-termini and a large extracellular loop (EC2) that bears
  the N-glycosylation site and is exposed at the cell surface (the epitope of the L6 monoclonal antibody).
  TM4SF1 resides in the plasma membrane, concentrates apically in epithelia, and is found in high-molecular-weight
  surface complexes; its C-terminal cysteine binds the PDZ protein SDCBP2/SITAC. It is strongly overexpressed
  in carcinomas and on endothelial cells, where it has been implicated in cell migration and angiogenesis,
  though its precise molecular function is not established.
