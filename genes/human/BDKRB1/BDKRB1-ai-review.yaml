core_functions:
- description: Inflammation-inducible cell-surface Gq-coupled receptor for des-Arg kinin metabolites (des-Arg10-kallidin,
    des-Arg9-bradykinin). Ligand binding at the extracellular face activates phospholipase C and raises
    cytosolic calcium, driving inflammatory and vasoactive responses.
  molecular_function:
    id: GO:0004947
    label: bradykinin receptor activity
  locations:
  - id: GO:0005886
    label: plasma membrane
  directly_involved_in:
  - id: GO:0007200
    label: phospholipase C-activating G protein-coupled receptor signaling pathway
  supported_by:
  - reference_id: PMID:8063797
    supporting_text: The cloned B1 bradykinin receptor expressed in mammalian cells exhibits high affinity
      binding for 3H-labeled [des-Arg10]kallidin and low affinity for bradykinin.
  - reference_id: PMID:9930991
    supporting_text: Both receptors are found on the surface of infected cells where they display the
      same pharmacological profiles as their cognate receptors of native cells.
suggested_questions:
- question: What transcriptional mechanism drives the strong inflammatory induction of BDKRB1, and does
    the receptor resist desensitization because it lacks agonist-induced phosphorylation?
suggested_experiments:
- description: Compare surface expression and signaling of B1 vs B2 receptors in cytokine-treated human
    endothelial cells, with des-Arg-kinin agonists, and test B1-selective antagonists on leukocyte recruitment.
