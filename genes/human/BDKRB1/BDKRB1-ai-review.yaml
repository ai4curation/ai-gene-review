id: P46663
gene_symbol: BDKRB1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: BDKRB1 encodes the B1 bradykinin receptor, a class A seven-transmembrane G protein-coupled
  receptor in the plasma membrane with an extracellular ligand-binding face. Unlike the constitutive B2
  receptor, B1 is largely absent from healthy tissue and is strongly induced during inflammation, tissue
  injury and by cytokines/LPS. Its preferred agonists are the kinin metabolites des-Arg10-kallidin and
  des-Arg9-bradykinin (carboxypeptidase products of kallidin and bradykinin), rather than intact bradykinin.
  It couples to Gq/11, activating phospholipase C and raising intracellular calcium, and mediates inflammatory
  responses, leukocyte recruitment, vasodilation/blood-pressure effects and nociception. The B1 receptor
  shows little agonist-induced phosphorylation or desensitization compared with B2.
