suggested_questions:
- question: How much of DPM3-dependent human DPM1 activity reflects membrane positioning versus an additional
    conformational contribution, when expression and lipid access are matched?
- question: What molecular pool accounts for DPM1 peptides in the human sperm-nuclear preparation, and
    can its localization be independently resolved without assuming a nuclear catalytic role or contamination?
- question: Under which conditions do the experimentally detected TDO2 and MEOX2 associations occur in
    human cells, and do they affect DPM1 activity or stability?
suggested_experiments:
- description: Compare defined human DPM1, DPM1–DPM3 and DPM1–DPM2–DPM3 preparations in matched membranes,
    including an engineered anchor control, with expression-normalized product assays and lipid-access
    controls.
- description: Use endogenous tagging or independently validated antibodies with genetic specificity controls,
    orthogonal fractionation and ER/nuclear markers to localize the DPM1 species detected in sperm preparations.
- description: Test endogenous TDO2 and MEOX2 association under defined cellular conditions with reciprocal
    controls and matched DPM1 abundance, then measure any effect on Dol-P-Man formation rather than inferring
    a pathway from binding alone.
