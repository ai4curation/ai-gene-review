- id: PMID:32296183
  title: A reference map of the human binary protein interactome.
  findings:
  - statement: HuRI contains positive, validated DPM1–MEOX2 clone records. Independent sequence and partner-function
      evidence supports DNA-binding transcription-factor binding, without transferring MEOX2 transcriptional
      activity to DPM1.
    supporting_text: Here we present a human 'all-by-all' reference interactome map of human binary protein
      interactions, or 'HuRI'. With approximately 53,000 protein-protein interactions, HuRI has approximately
      four times as many such interactions as there are high-quality curated interactions from small-scale
      studies.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Genuine original platform Methods describe quadruplicate retesting and sequence confirmation.
      The three literal DPM1–MEOX2 clone records include validated two-hybrid evidence. Q6FHY5 matches
      the recorded sequence checksum and differs from P50222 only by one glutamine in an N-terminal repeat,
      outside the homeobox. The binding-class refinement does not imply transcriptional regulation by
