id: O60762
gene_symbol: DPM1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: DPM1 is the catalytic subunit of dolichol-phosphate mannose synthase at the endoplasmic reticulum
  membrane. It transfers mannose from GDP-mannose to dolichyl phosphate, generating the lipid-linked donor
  used in N-glycosylation, protein O- and C-mannosylation and GPI-anchor synthesis. DPM3 recruits and
  stabilizes DPM1 at the membrane, and DPM2 supports efficient complex activity. Biallelic defects cause
  DPM1 congenital disorder of glycosylation.
