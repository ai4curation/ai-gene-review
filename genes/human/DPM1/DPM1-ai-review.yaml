- id: PMID:9535917
  title: A homologue of Saccharomyces cerevisiae Dpm1p is not sufficient for synthesis of dolichol-phosphate-mannose
    in mammalian cells.
  full_text_unavailable: true
  findings:
  - statement: Human and mouse DPM1 encode 260-residue proteins that are ~30% identical to yeast Dpm1p
      but, unlike the yeast synthase, lack a hydrophobic transmembrane domain - the structural reason
      DPM1 must be tethered to the ER membrane by a partner subunit.
    supporting_text: We cloned human and mouse homologues of DPM1, termed hDPM1 and mDPM1, respectively,
      both of which encode proteins of 260 amino acids, having 30% amino acid identity with yeast Dpm1
      protein but lacking a hydrophobic transmembrane domain, which exists in the yeast synthase.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: Human DPM1 cDNA restores Dol-P-Man synthesis and GPI-anchored Thy-1 expression in DPM1-deficient
      class E mutant cells, direct functional evidence for DPM1 in Dol-P-Man synthesis and GPI anchor
      biosynthesis.
    supporting_text: Human and mouse DPM1 cDNA restored Dol-P-Man synthesis in mouse Thy-1-deficient mutant
      class E cells.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: Human and mouse DPM1 fail to rescue hamster Lec15 under the reported conditions, although
      they rescue mouse class E cells. This points to an additional membrane-associated requirement rather
      than disproving catalytic DPM1 identity.
    supporting_text: In contrast, hDPM1 and mDPM1 cDNA did not complement another Dol-P-Man synthesis
      mutant, hamster Lec15 cells, whereas yeast DPM1 restored both mutants.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: The paper describes Dol-P-Man supply to N-glycan and GPI synthesis and explicitly gives
      yeast as its O-linked-glycan example. Human O-mannosylation context has independent disease support.
    supporting_text: It donates four mannosyl residues in the N-linked oligosaccharide precursor and all
      three mannosyl residues in the core of the glycosylphosphatidylinositol anchor. In yeasts it also
      donates one mannose to the O-linked oligosaccharide.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The indexed author-uploaded original Methods and Results distinguish human/mouse DPM1
      constructs, mouse class E rescue, hamster Lec15 failure and human GST-DPM1 membrane fractionation.
      The measured product is Dol-P-Man, not new Dol-P synthesis. The abstract specifically assigns its
      O-linked-glycan example to yeast; independent human disease evidence informs the retained gene-level
      O-mannosylation context. Normal cache bytes and abstract-only flags are preserved.
- id: PMID:9724629
  title: 'DPM2 regulates biosynthesis of dolichol phosphate-mannose in mammalian cells: correct subcellular
    localization and stabilization of DPM1, and binding of dolichol phosphate.'
  full_text_unavailable: true
  findings:
  - statement: The original experiments show DPM2-dependent localization/stability and enhanced Dol-P
      association in their cellular system; later work identifies DPM3 as the DPM1 anchoring partner and
      demonstrates DPM2-independent activity under DPM3 overexpression.
    supporting_text: DPM2, an 84 amino acid membrane protein expressed in the endoplasmic reticulum (ER),
      makes a complex with DPM1 that is essential for the ER localization and stable expression of DPM1.
      Moreover, DPM2 enhances binding of dolichol phosphate, a substrate of DPM synthase.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: An engineered ER-anchored DPM1 fusion forms Dol-P-Man without DPM2. DPM3 was not removed
      in that experiment, so it does not establish isolated unanchored human DPM1 catalysis.
    supporting_text: Mammalian DPM1 is catalytic because a fusion protein of DPM1 that was stably expressed
      in the ER synthesized DPM without DPM2.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: Dol-P-Man is the required mannosyl donor for GPI and N-glycan precursor biosynthesis, linking
      DPM1 activity to both downstream pathways.
    supporting_text: Biosynthesis of glycosylphosphatidylinositol and N-glycan precursor is dependent
      upon a mannosyl donor, dolichol phosphate-mannose (DPM).
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The indexed original and continuation establish human DPM1 with rat DPM2 in hamster
      hosts, fractionation, and an engineered DPM1–rat microsomal ALDH membrane anchor. The fusion is
      active without DPM2, but DPM3 was not removed and isolated unanchored human catalysis was not demonstrated.
      The later three-subunit study refines the original interaction interpretation. Original Results/Methods
      were read separately from the unchanged abstract-only cache.
- id: Reactome:R-HSA-162699
  title: Synthesis of dolichyl-phosphate mannose
  findings:
  - statement: Dol-P-Man is the mannose donor for N-linked glycosylation, GPI anchor precursor synthesis,
      and protein O- and C-mannosylation, which is why DPM1 sits upstream of all four processes.
    supporting_text: Dolichyl-phosphate-mannose (DPM, DOLPman) is the donor of mannose groups in the synthesis
      of the dolichyl pyrophosphate-linked precursor oligosaccharide in asparagine-linked glycosylation,
      in the synthesis of the glycosyl phosphatidylinositol (GPI) anchor precursor, in protein O-mannosylation
      and in protein C-mannosylation.
    reference_section_type: DATABASE_ENTRY
  - statement: DPM is made on the cytosolic face of the ER membrane and then flips so its mannose faces
      the ER lumen, placing the DPM1-catalysed step on the cytosolic side of the ER membrane.
    supporting_text: First, cytosolic GDP-mannose reacts with dolichyl phosphate exposed on the cytosolic
      face of the endoplasmic reticulum membrane to form DPM with its mannose moiety oriented toward the
      cytosol.
    reference_section_type: DATABASE_ENTRY
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The public event, catalyst and entity chain was resolved to human O60762. Normal DPM1
      reaction and DPM1-, DPM3- or DPM2-variant failed-reaction contexts are distinguished; pathway membership
      does not assign the separate lipid-flipping step to DPM1.
