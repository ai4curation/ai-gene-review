      the ISS annotations of DPM1 to metal ion binding (GO:0046872) and dolichol phosphate mannose biosynthetic
      process (GO:0180047); the metal-binding call rests on the divalent-cation requirement of archaeal/bacterial
      DPM synthases recorded in UniProt as a By-similarity cofactor.
- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  findings:
  - statement: PAINT phylogenetic inference places DPM1 in the Dpm1/GT2 dolichyl-phosphate mannosyltransferase
      clade, supporting the IBA annotations to dolichyl-phosphate beta-D-mannosyltransferase activity
      (GO:0004582), endoplasmic reticulum membrane (GO:0005789) and dolichol-linked oligosaccharide biosynthetic
      process (GO:0006488).
- id: GO_REF:0000044
  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot Subcellular Location vocabulary mapping,
    accompanied by conservative changes to GO terms applied by UniProt
  findings:
