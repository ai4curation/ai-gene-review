  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Judit Castillo Corullón, doctoral thesis, Universitat de Barcelona. The institutional
      catalogue gives issue date 2014-09-19; the PDF prints July 2014. The catalogue item and its ORIGINAL
      bundle authenticate the same PDF bitstream. Its direct URL and SHA-256 are recorded in DPM1-source-evidence.md. Annex 8.2 identifies
      PMID:21630459 and its supplementary information. The table and relevant Methods were read in the
      original Catalan and paraphrased; no new quotation is reproduced. The derivative numerical extract
