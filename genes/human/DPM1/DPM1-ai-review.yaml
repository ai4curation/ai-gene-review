- id: https://diposit.ub.edu/dspace/handle/2445/60858
  title: Caracterització del contingut proteic del nucli de l’espermatozoïde humà i el seu potencial epigenètic
  findings:
  - statement: Table 8.1, printed page 193 (physical PDF page 194), reports DPM1/O60762 with 13.1% sequence
