- id: PMID:23856421
  title: Congenital disorder of glycosylation due to DPM1 mutations presenting with dystroglycanopathy-type
    congenital muscular dystrophy.
  full_text_unavailable: true
  findings:
  - statement: The patient-membrane assays report strongly reduced synthase activity without depressed
      apparent substrate affinity; altered abundance or assembly of active enzyme is a proposed explanation,
      not a direct enzyme-count measurement.
    supporting_text: DPM1 activity in fibroblasts was reduced by 80%, while affinity for the substrate
      was not depressed, suggesting a decrease in the amount of active enzyme.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: The p.Gly152Val substitution reduces DPM1 binding to DPM3, giving a mechanistic link between
      the DPM1-DPM3 interaction and disease and supporting the functional relevance of that protein-binding
      annotation.
    supporting_text: Transfected cells expressing tagged versions of wild type and the p.Gly152Val mutant
      displayed reduced binding to DPM3, an essential, non-catalytic subunit of the DPM complex, suggesting
      a mechanism for pathogenicity.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: Loss of DPM1 function produces a dystroglycanopathy phenotype with reduced alpha-dystroglycan
      glycoepitope staining, in vivo evidence that DPM1-derived Dol-P-Man feeds protein O-mannosylation
      and not only N-glycosylation.
    supporting_text: Muscle biopsy showed muscular dystrophy and reduced α-dystroglycan immunostaining
      with glycoepitope-specific antibodies in a pattern diagnostic of dystroglycanopathy.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The genuine PMC original establishes reduced patient-membrane synthase activity, controlled
      human WT/G152V DPM1–DPM3 co-immunoprecipitation and reduced muscle alpha-dystroglycan glycoepitope
      staining. Reduced binding is not complete loss. The source uses inconsistent patient-cell labels,
      so the biochemical preparation is described conservatively as patient membranes. The normal cache
      remains abstract-only.
- id: PMID:25416956
  title: A proteome-scale map of the human interactome network.
  findings:
  - statement: The systematic binary map contains sequence-confirmed, validated DPM1–TDO2 binding records.
      Enzyme-partner binding is supported without assigning a native metabolic regulatory function.
    supporting_text: Here, we describe a systematic map of ?14,000 high-quality human binary protein-protein
      interactions.
    reference_section_type: ABSTRACT
