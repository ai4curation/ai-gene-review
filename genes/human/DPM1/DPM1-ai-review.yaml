core_functions:
- description: DPM1 provides the catalytic component of the endoplasmic-reticulum dolichol-phosphate mannose
    synthase complex, transferring mannose from GDP-mannose to dolichyl phosphate. DPM3 anchors and stabilizes
    DPM1, while DPM2 increases activity and stabilizes DPM3. Purified human complexes reconstituted into
    liposomes produce the lipid-linked mannose donor used by downstream glycosyltransferases. Activity
    retained without DPM2 when DPM3 is overexpressed distinguishes regulation from an absolute three-subunit
    requirement; it does not establish activity of an isolated unanchored human protein.
