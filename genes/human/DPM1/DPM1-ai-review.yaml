      reticulum (GO:0005783), matching the UniProt SUBCELLULAR LOCATION line and the experimental ER localization
      shown by Maeda et al.
- id: GO_REF:0000117
  title: Electronic Gene Ontology annotations created by ARBA machine learning models
  findings:
