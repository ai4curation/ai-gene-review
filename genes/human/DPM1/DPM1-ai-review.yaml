      production because DPM1 transfers mannose to an existing lipid phosphate rather than phosphorylating
      dolichol.
- id: GO_REF:0000120
  title: Combined Automated Annotation using Multiple IEA Methods
  findings:
  - statement: Combined automated IEA pipelines supply the annotation of DPM1 to dolichyl-phosphate beta-D-mannosyltransferase
      activity (GO:0004582), redundant with but consistent with the EXP/IDA evidence for the same activity.
- id: PMID:10835346
  title: Human dolichol-phosphate-mannose synthase consists of three subunits, DPM1, DPM2 and DPM3.
  full_text_unavailable: true
  findings:
  - statement: Human DPM synthase contains catalytic DPM1 with DPM3-mediated anchoring and DPM2-dependent
      stabilization and enhancement. Under DPM3 overexpression, measurable activity persists without DPM2.
    supporting_text: We reported previously that mammalian DPM synthase contains catalytic DPM1 and regulatory
      DPM2 subunits, and that DPM1 requires DPM2 for its stable expression in the endoplasmic reticulum.
      Here we report that human DPM synthase consists of three subunits.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: DPM3 binds DPM1 through its C-terminal domain and DPM2 through its N-terminal portion,
      giving a stabilization chain in which DPM2 stabilizes DPM3 and DPM3 stabilizes DPM1 - the basis
      of the DPM1-DPM3 protein-binding annotation.
    supporting_text: The third subunit, DPM3, comprises 92 amino acids associated with DPM1 via its C-terminal
      domain and with DPM2 via its N-terminal portion.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: DPM2 also contributes to catalysis and not only to stability, since synthase activity is
      about ten-fold higher in its presence.
    supporting_text: DPM synthase activity was 10 times higher in the presence of DPM2, indicating that
      DPM2 also plays a role in the enzymatic reaction.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: The Dol-P-Man made by the DPM1-containing synthase is the mannosyl donor for GPI anchors,
      N-glycans, and protein O- and C-mannosylation, which is why DPM1 carries annotations across all
      of these downstream processes.
    supporting_text: Dolichol-phosphate-mannose (DPM) synthase generates mannosyl donors for glycosylphosphatidylinositols,
      N-glycan and protein O- and C-mannosylation.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The separately recovered indexed PMC original Results and Methods establish human DPM1-containing
      complex reconstitution in PC/PE liposomes and formation of lipid-linked mannose. The synthase assay
      was performed without exogenous Dol-P. Human DPM1/DPM3 and rat DPM2 in hamster-host experiments
      are distinct from purification of human complexes. DPM3 overexpression permits activity without
      DPM2, at lower specific activity. The normal cache and its abstract-only flags remain unchanged.
- id: PMID:10944123
  title: Initial enzyme for glycosylphosphatidylinositol biosynthesis requires PIG-P and is regulated
    by DPM2.
  full_text_unavailable: true
  findings:
  - statement: DPM2, a subunit of the DPM synthase that contains DPM1, also associates with and enhances
      GPI-N-acetylglucosaminyltransferase, implying co-regulation of GPI anchor initiation with the pathway
      that supplies its mannosyl donor.
    supporting_text: DPM2, but not two other components of dolichol-phosphate-mannose synthase, associates
      with GPI-GnT through interactions with PIG-A, PIG-C and GPI1.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: Figure 5A and the corresponding Results report controlled FLAG-DPM3/GST-DPM1 co-immunoprecipitation
      in human JY5 cells, including ALDH controls. The separate GPI-GnT association is specific to DPM2,
      not DPM1.
    reference_section_type: RESULTS
    full_text_unavailable: false
  reference_review:
