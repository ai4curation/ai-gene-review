      with controls. Its separate GPI-GnT association is specific to DPM2 and must not be transferred
      to DPM1. The normal cache remains abstract-only.
- id: PMID:16280320
  title: DPM1, the catalytic subunit of dolichol-phosphate mannose synthase, is tethered to and stabilized
    on the endoplasmic reticulum membrane by DPM3.
  full_text_unavailable: true
  findings:
  - statement: The abstract reports loss of detectable microsomal synthase activity and GPI-anchored proteins
      in the DPM3-defective CHO context; this establishes the requirement under those cellular conditions.
    supporting_text: CHO2.38 cells were negative for GPI-anchored proteins, and microsomes from these
      cells showed no detectable DPM synthase activity, indicating that DPM3 is an essential component
      of this enzyme.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: A coiled-coil domain near the DPM3 C terminus tethers the catalytic DPM1 subunit to the
      ER membrane and is required for activity - DPM1 itself lacks a transmembrane anchor, so its ER-membrane
      localization is conferred in trans.
    supporting_text: A coiled-coil domain near the C terminus of DPM3 was important for tethering DPM1,
      the catalytic subunit of the enzyme, to the endoplasmic reticulum membrane and, therefore, was critical
      for enzyme activity.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: Free DPM1 is rapidly degraded by the proteasome in the absence of DPM3 and associates with
      the E3 ligase CHIP, so complex assembly also controls DPM1 steady-state level.
    supporting_text: DPM1 was rapidly degraded by the proteasome in the absence of DPM3. Free DPM1 was
      strongly associated with the C terminus of Hsc70-interacting protein (CHIP), a chaperone-dependent
      E3 ubiquitin ligase
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The verified complete abstract positively reports DPM3-dependent anchoring/stability
      and free DPM1 association with CHIP followed by degradation. Original-body retrieval remained unsuccessful;
      exact CHIP assay, tag and construct details are not claimed. The literal current IntAct record instead
      concerns human DPM1 and hamster DPM3 in CHO cells. Independent human synthase studies corroborate
      the gene-level catalytic function.
