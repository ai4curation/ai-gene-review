      label: small GTPase binding
    supported_by:
    - reference_id: PMID:28428259
      supporting_text: >-
        We also show that RABL2 interacts, in its GTP-bound state, with the intraflagellar transport (IFT)-B
        complex via the IFT74-IFT81 heterodimer and that the interaction is disrupted by a mutation found
        in male infertile mice (Mot mice) with a sperm flagella motility defect.
