id: Q96LB3
gene_symbol: IFT74
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  IFT74 (originally capillary morphogenesis gene 1, CMG-1) is a coiled-coil core (IFT-B1) subunit of the
  intraflagellar transport B complex that heterodimerizes with IFT81. Its highly basic, disordered N-terminus
  binds the acidic C-terminal tail of beta-tubulin, enhancing tubulin binding by the IFT81 CH domain about
  18-fold, so that IFT74/IFT81 form the tubulin-transport module of anterograde IFT trains. The C-terminal
  coiled coils of IFT74/IFT81 also bind GTP-RABL2B at the ciliary base, and IFT74 is required for ciliogenesis.
  IFT74 localizes to the ciliary base/basal body, cilia and centriolar satellites, and is essential for
  sperm flagellum formation. Variants cause Bardet-Biedl syndrome 22, Joubert syndrome 40 and male infertility
  with multiple morphological abnormalities of the sperm flagellum.
