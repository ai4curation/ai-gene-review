core_functions:
- description: >-
    With IFT81, IFT74 forms the tubulin-binding module of IFT-B; its basic N-terminus binds the beta-tubulin
    C-terminal tail and greatly increases the affinity of the module for tubulin, supporting tubulin transport
    for axoneme extension and ciliogenesis.
  molecular_function:
    id: GO:0048487
    label: beta-tubulin binding
  directly_involved_in:
