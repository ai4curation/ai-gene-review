    label: intraciliary anterograde transport
  - id: GO:0035735
    label: intraciliary transport involved in cilium assembly
  locations:
  - id: GO:0036064
    label: ciliary basal body
  - id: GO:0005929
    label: cilium
  - id: GO:0097542
    label: ciliary tip
  in_complex:
    id: GO:0030992
    label: intraciliary transport particle B
  supported_by:
  - *id007
  - *id008
  - *id006
  - reference_id: PMID:33689014
    supporting_text: >-
      IFT74 encodes for a core component of the IFT machinery that is essential for the anterograde transport
      of tubulin.
  - reference_id: file:human/IFT74/IFT74-deep-research-falcon.md
    supporting_text: >-
      Selected IFT-B subunits, including IFT81, still co-precipitated with exon-2-deleted IFT74, whereas
      the deleted protein bound microtubules much less effectively in vitro.
suggested_questions:
- question: >-
    Does the IFT74 basic N-terminus have cargo specificity beyond beta-tubulin, and how do BBS22/JBTS40
    variants that spare the N-terminus impair IFT?
- question: >-
    Is the electronically transferred mouse 'chromatin binding'/nuclear localization of IFT74 reproducible
    for human IFT74?
suggested_experiments:
- description: >-
    Rescue of IFT74-knockout cells with N-terminal basic-region deletions to separate tubulin-binding
    from IFT-B assembly roles, combined with tubulin-transport imaging.
