  evidence_type: IPI
  original_reference_id: PMID:28428259
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q9UNT1
  review:
    summary: >-
      IPI with RABL2B (Q9UNT1). GTP-bound RABL2B binds the IFT-B complex through the IFT74-IFT81 heterodimer,
      an interaction thought to capture IFT-B at the ciliary base and gate its ciliary entry.
    action: MODIFY
    reason: >-
      Generic 'protein binding' is uninformative. The cited work shows that GTP-bound RABL2B, a small
      Ras-like GTPase, binds the C-terminal regions of IFT74 and IFT81 (distinct from their tubulin-binding
      N-termini); 'small GTPase binding' captures the informative content. This is a recruitment/regulatory
      interaction rather than the core cargo-binding activity.
