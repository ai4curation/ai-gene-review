    finding_review:
      finding_status: OVERTURNED
      superseded_by:
      - PMID:18515364
      review_notes: The later human XPNPEP1 crystal structure and metal-content
        assays showed two catalytic Mn(II) ions per subunit.
      supported_by:
      - reference_id: PMID:18515364
        supporting_text: which contrasts with the previous notion that each XPNPEP1
          subunit contains only one Mn(II) ion
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only cache. The paper cloned full-length human cytosolic
      AP-P/XPNPEP1, expressed it in E. coli and COS-1 cells, and directly measured
      manganese-dependent cleavage of bradykinin and substance P; its single-Mn(II)
      conclusion was superseded by the di-manganese structure in PMID:18515364.
