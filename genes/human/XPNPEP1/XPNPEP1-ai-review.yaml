id: Q9NQW7
gene_symbol: XPNPEP1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: XPNPEP1 encodes the soluble cytosolic member of the M24B Xaa-Pro aminopeptidase
  family. The homodimeric manganese-dependent metalloaminopeptidase removes an
  N-terminal residue from peptides when the second residue is proline, including
  bradykinin and related Xaa-Pro substrates, and thereby helps catabolize
  cytosolic proline-containing peptides. Chemical-genetic inhibition of XPNPEP1
  together with prolidase can allow proline-containing peptides to accumulate
  and secondarily activate CARD8 inflammasome signaling.
