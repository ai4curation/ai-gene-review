suggested_questions:
- question: Which endogenous cytosolic Xaa-Pro peptides accumulate when XPNPEP1 is
    lost alone, and how do they partition between general peptide recycling and
    CARD8 inflammasome sensitization?
suggested_experiments:
- description: Quantify Xaa-Pro peptides, longer proline-containing peptides, DPP8/9
    inhibition, and CARD8 pyroptosis in primary human myeloid cells after single
    XPNPEP1 loss, single PEPD loss, and combined acute inhibition.
