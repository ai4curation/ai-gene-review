id: Q8IVP5
gene_symbol: FUNDC1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: FUNDC1 (FUN14 domain-containing protein 1) is a small multi-pass integral protein of the
  mitochondrial outer membrane and belongs to the FUN14 family. Its N-terminal cytosolic region carries
  a Y18xxL21 LC3-interacting region (LIR) that binds Atg8-family proteins (MAP1LC3A, MAP1LC3B, GABARAP).
  Through this binding FUNDC1 acts as a ubiquitin-independent receptor for hypoxia-induced mitophagy,
  tethering mitochondria to forming autophagosomes. Phosphorylation controls the receptor. Under normoxia,
  SRC (Tyr18) and CK2 (Ser13) phosphorylation inhibits LC3 binding. Under hypoxia, the phosphatase PGAM5
  removes these phosphates, and ULK1, which translocates to mitochondria, phosphorylates Ser17; both changes
  enhance LC3 binding. FUNDC1 also gathers at ER-mitochondria contact sites (MAMs), where it binds calnexin
  and recruits DRP1 (DNM1L), promoting DRP1 oligomerization and mitochondrial fission before mitophagy.
  FUNDC1 is ubiquitinated, and USP19 stabilizes it at MAMs. Other reported roles in MAM formation, Ca2+
  signalling, angiogenesis and GPX4 import/ferroptosis are less well established.
