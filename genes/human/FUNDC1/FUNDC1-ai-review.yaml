core_functions:
- description: Ubiquitin-independent mitophagy receptor. FUNDC1 in the mitochondrial outer membrane binds
    LC3/GABARAP through its N-terminal LIR (Y18xxL21), recruiting autophagosomal membranes to mitochondria
    during hypoxia-induced mitophagy. Phosphorylation at Tyr18/Ser13 (SRC/CK2) inhibits this binding;
    dephosphorylation by PGAM5 and phosphorylation of Ser17 by ULK1 activate it.
  molecular_function:
    id: GO:0140580
    label: mitochondrion autophagosome adaptor activity
  directly_involved_in:
  - id: GO:0000423
    label: mitophagy
  locations:
  - id: GO:0005741
    label: mitochondrial outer membrane
  supported_by:
  - reference_id: PMID:22267086
    supporting_text: FUNDC1 interacted with LC3 through its typical LC3-binding motif Y(18)xxL(21), and
      mutation of the LC3-interaction region impaired its interaction with LC3 and the subsequent induction
      of mitophagy.
  - reference_id: PMID:22267086
    supporting_text: Knockdown of endogenous FUNDC1 significantly prevented hypoxia-induced mitophagy,
      which could be reversed by the expression of wild-type FUNDC1, but not LC3-interaction-deficient
      FUNDC1 mutants.
  - reference_id: PMID:24671035
    supporting_text: The translocated ULK1 interacts with its substrate FUNDC1 and phosphorylates FUNDC1
      at Ser-17.
- description: DRP1 adaptor at ER-mitochondria contact sites. Under hypoxia FUNDC1 gathers at MAMs, switches
    from binding calnexin to binding DRP1, and recruits DRP1 to drive mitochondrial fission, which links
    fission to mitophagy.
  molecular_function:
    id: GO:0043495
    label: protein-membrane adaptor activity
  directly_involved_in:
  - id: GO:0090141
    label: positive regulation of mitochondrial fission
  locations:
  - id: GO:0044233
    label: mitochondria-associated endoplasmic reticulum membrane contact site
  supported_by:
  - reference_id: PMID:27145933
    supporting_text: Taken together, these findings reveal that FUNDC1 is not only a novel MAM protein
      that acts as an adaptor for DRP1 during the mitochondrial fission process, but also involved in
      hypoxia‐induced mitophagy.
  - reference_id: PMID:27145933
    supporting_text: 'Further, we found that FUNDC1 is specifically required for mitochondrial fragmentation:
      It recruits DRP1 to drive mitochondrial fission in response to hypoxic stress.'
  - reference_id: PMID:33978709
    supporting_text: In response to hypoxia, USP19 tends to interact with FUNDC1, removing the ubiquitin
      chains from FUNDC1 at MAM and stabilizing FUNDC1 at ER-mitochondria contact sites, thereby facilitating
      the oligomerization of Drp1 at the ER-mitochondria contact sites to complete the fission events.
proposed_new_terms: []
suggested_questions:
- question: How do FUNDC1-mediated (receptor, ubiquitin-independent) and PINK1/Parkin-mediated (ubiquitin-dependent)
    mitophagy divide labour in vivo, and in which tissues is FUNDC1 required rather than redundant with
    BNIP3/NIX?
- question: Does FUNDC1 rescue of PINK1-deficient phenotypes act only through DRP1-dependent fission,
    or does it also affect mitochondrial fusion?
suggested_experiments:
- hypothesis: FUNDC1 LIR binding and DRP1 recruitment are separable activities that contribute independently
    to hypoxic mitochondrial clearance.
  description: Reconstitute FUNDC1-knockout cells with LIR mutant (Y18A/L21A) versus DRP1-binding-deficient
    FUNDC1 and measure hypoxic mitochondrial fission (live imaging) and mitophagy flux (mt-Keima) separately.
  experiment_type: structure-function rescue
