    action: ACCEPT
    reason: Core function, directly established in human cells (PMID:22267086) and consistent with the
      PANTHER (FUN14 family) IBA. The IDA/IMP/IGI rows from the same paper and the IBA are all appropriate.
    supported_by:
    - reference_id: PMID:22267086
      supporting_text: Here we report that FUNDC1, an integral mitochondrial outer-membrane protein, is
        a receptor for hypoxia-induced mitophagy.
    - reference_id: PMID:22267086
      supporting_text: Knockdown of endogenous FUNDC1 significantly prevented hypoxia-induced mitophagy,
        which could be reversed by the expression of wild-type FUNDC1, but not LC3-interaction-deficient
        FUNDC1 mutants.
