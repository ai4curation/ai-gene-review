    summary: Mitophagy (GO:0000423, the selective autophagy of mitochondria) is the core process in which
      FUNDC1 acts as an Atg8-binding receptor.
    action: ACCEPT
    reason: Consistent with the receptor function established in PMID:22267086. The IGI row comes from
      a study in which FUNDC1 was the only conserved LIR mitochondrial protein whose knockdown worsened
      PINK1/UCH-L1 double-null fly phenotypes; this genetic evidence agrees with the core role.
