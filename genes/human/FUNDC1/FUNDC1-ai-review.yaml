- term:
    id: GO:0008053
    label: mitochondrial fusion
  evidence_type: IGI
  original_reference_id: PMID:37931419
  qualifier: involved_in
  supporting_entities:
  - FB:FBgn0026479
  - FB:FBgn0029891
  - FB:FBgn0032200
  review:
    summary: The cited study (Drosophila genetics) reports that FUNDC1 suppresses PINK1-mutant phenotypes
      through Drp1 and mitochondrial fission, independent of its LIR. The abstract does not describe a
      role in mitochondrial fusion.
    action: UNDECIDED
    reason: Only the abstract is cached, and it presents the FUNDC1-PINK1 genetic interaction as acting
      through Drp1-dependent fission, not fusion. Fusion may be assayed in the full text (e.g. via Marf/Opa1
      genetics), so without the full text I cannot confirm or refute the fusion annotation and do not
      overrule the curator.
    supported_by:
    - reference_id: PMID:37931419
      supporting_text: Moreover, the absence of Drp1 affects the phenotypic restoration of PINK1 mediated
        by FUNDC1 in flies.
    - reference_id: PMID:37931419
      supporting_text: The restoration of PINK1-deficient phenotypes through FUNDC1 is not reliant on
        its LC3-binding motif Y (18)L (21) or autophagy-related pathway.
- term:
    id: GO:0090141
    label: positive regulation of mitochondrial fission
  evidence_type: IMP
  original_reference_id: PMID:27145933
  qualifier: involved_in
  review:
    summary: Under hypoxia, FUNDC1 at ER-mitochondria contact sites recruits DRP1 and promotes its oligomerization
      and activation to drive mitochondrial fission ahead of mitophagy; FUNDC1 knockdown prevents hypoxic
      fission.
    action: NEW
    reason: 'FUNDC1 does some of the work of this process: it is the outer-membrane adaptor that recruits
      DRP1 (comparable to the DRP1 receptors MFF and FIS1, which carry mitochondrial fission terms). Two
      independent human-cell studies support this (PMID:27145933, PMID:33978709).'
    supported_by:
    - reference_id: PMID:27145933
      supporting_text: 'Further, we found that FUNDC1 is specifically required for mitochondrial fragmentation:
        It recruits DRP1 to drive mitochondrial fission in response to hypoxic stress.'
    - reference_id: PMID:33978709
      supporting_text: In response to hypoxia, USP19 tends to interact with FUNDC1, removing the ubiquitin
        chains from FUNDC1 at MAM and stabilizing FUNDC1 at ER-mitochondria contact sites, thereby facilitating
        the oligomerization of Drp1 at the ER-mitochondria contact sites to complete the fission events.
- term:
    id: GO:0044233
    label: mitochondria-associated endoplasmic reticulum membrane contact site
  evidence_type: IDA
  original_reference_id: PMID:27145933
  qualifier: located_in
  review:
    summary: FUNDC1 accumulates at ER-mitochondria contact sites (MAMs) under hypoxia, where it binds
      calnexin and then DRP1.
    action: NEW
    reason: Directly shown by imaging and fractionation in PMID:27145933 and supported by PMID:33978709.
      This is the site of its fission-adaptor activity and is not captured by any existing annotation.
    supported_by:
    - reference_id: PMID:27145933
      supporting_text: Thus, FUNDC1 integrates mitochondrial fission and mitophagy at the interface of
        the MAM by working in concert with DRP1 and calnexin under hypoxic conditions in mammalian cells.
    - reference_id: PMID:33978709
      supporting_text: In response to hypoxia, USP19 tends to interact with FUNDC1, removing the ubiquitin
        chains from FUNDC1 at MAM and stabilizing FUNDC1 at ER-mitochondria contact sites, thereby facilitating
        the oligomerization of Drp1 at the ER-mitochondria contact sites to complete the fission events.
- term:
    id: GO:0043495
    label: protein-membrane adaptor activity
  evidence_type: IMP
  original_reference_id: PMID:27145933
  qualifier: enables
  review:
    summary: FUNDC1 acts as an outer-membrane adaptor that recruits cytosolic DRP1 to mitochondria at
      ER contact sites under hypoxia; silencing FUNDC1 sharply reduces DRP1 translocation to mitochondria.
    action: NEW
    reason: The authors describe FUNDC1 as a MAM adaptor for DRP1, and loss of FUNDC1 reduced DRP1 recruitment
      more than loss of MFF, FIS1 or MiD49/51. A specific adaptor MF is more informative than protein
      binding.
    supported_by:
    - reference_id: PMID:27145933
      supporting_text: Taken together, these findings reveal that FUNDC1 is not only a novel MAM protein
        that acts as an adaptor for DRP1 during the mitochondrial fission process, but also involved in
        hypoxia‐induced mitophagy.
    - reference_id: PMID:27145933
      supporting_text: 'Further, we found that FUNDC1 is specifically required for mitochondrial fragmentation:
        It recruits DRP1 to drive mitochondrial fission in response to hypoxic stress.'
