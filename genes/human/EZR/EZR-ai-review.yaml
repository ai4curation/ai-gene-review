id: P15311
gene_symbol: EZR
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: EZR encodes ezrin, a canonical ezrin/radixin/moesin FERM-domain adaptor that links the cytoplasmic face of the
  plasma membrane and specialized cortical membranes to filamentous actin. Closed cytosolic ezrin is activated by phosphoinositide
  binding and C-terminal phosphorylation, exposing membrane- and F-actin-binding surfaces. Active ezrin organizes apical microvilli,
  filopodia, ruffles, endothelial docking structures and receptor/transport complexes, and it also contributes to HOPS-dependent
  endosomal maturation and to specialized signaling scaffolds such as PKA anchoring in T cells.
existing_annotations:
- term:
    id: GO:0000122
    label: negative regulation of transcription by RNA polymerase II
  evidence_type: IMP
  original_reference_id: PMID:20551903
  qualifier: involved_in
  review:
    summary: Ezrin affects T-cell transcriptional outputs indirectly by organizing Dlg1, microtubules and NF-AT signaling
      at the immunological synapse.
    action: MARK_AS_OVER_ANNOTATED
    reason: The Dlg1 paper supports altered NF-AT/AP-1/NF-kappaB reporters after EZR knockdown, but transcription is downstream
      of the membrane-cytoskeleton adaptor role; keep the TCR and p38/ERK signaling rows rather than a generic Pol II transcription
      term.
    supported_by:
    - reference_id: PMID:20551903
      supporting_text: the membrane-microfilament linker ezrin has an important function in microcluster dynamics and in TCR
        signalling through its ability to set the microtubule network organization at the immunological synapse
- term:
    id: GO:0001726
    label: ruffle
  evidence_type: IDA
  original_reference_id: PMID:25554515
  qualifier: located_in
  review:
    summary: Ezrin localizes to membrane ruffles in stimulated epithelial cells and in cortical protrusions with IQGAP1.
    action: KEEP_AS_NON_CORE
    reason: Ruffle localization is a real stimulus-dependent location for activated ezrin but is not the main steady-state
      apical/plasma-membrane role.
    supported_by:
    - reference_id: PMID:25554515
      supporting_text: Ezrin and IQGAP1 colocalize in the submembraneous cytoskeleton and in cellular protrusions of human
        epithelial cells
