- index: 0
  source_annotation:
    term:
      id: GO:0001954
      label: positive regulation of cell-matrix adhesion
    evidence_type: IEA
    original_reference_id: GO_REF:0000107
    qualifier: involved_in
    supporting_entities:
    - UniProtKB:P59113
    - ensembl:ENSMUSP00000047616
  review:
    summary: Kindlin-1 promotes integrin-dependent cell-matrix adhesion.
    action: ACCEPT
    reason: The ortholog source in PMID:24681597 shows defective adhesion and spreading on alpha-v-beta-6-dependent
      substrates after mouse keratinocyte Fermt1 loss. Actual human kindlin-1 studies independently support integrin-tail
      association and matrix-dependent spreading (PMID:14634021) and cooperation with talin in integrin activation
      (PMID:19804783). This is a regulatory contribution to adhesion, not extracellular-matrix production. Retain
      the conserved core role without assigning the measured activity to all four natural splice products.
    additional_reference_ids:
    - PMID:24681597
    - PMID:14634021
    - PMID:19804783
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: UniProtKB:P59113
        source_status: SUPPORTS_TRANSFER
        comment: Actual mouse Fermt1 P59113 QuickGO record contains the matching IMP annotation from PMID:24681597;
          ENSMUSP00000047616 is the mouse 677-residue translation. Transfer is contextual orthology inference, not
          an experiment on every human splice product.
      - source_id: ensembl:ENSMUSP00000047616
        source_status: SUPPORTS_TRANSFER
        comment: Actual mouse Fermt1 P59113 QuickGO record contains the matching IMP annotation from PMID:24681597;
          ENSMUSP00000047616 is the mouse 677-residue translation. Transfer is contextual orthology inference, not
          an experiment on every human splice product.
