- index: 19
  source_annotation:
    term:
      id: GO:0042308
      label: negative regulation of protein import into nucleus
    evidence_type: IEA
    original_reference_id: GO_REF:0000107
    qualifier: involved_in
    supporting_entities:
    - UniProtKB:P59113
    - ensembl:ENSMUSP00000047616
  review:
    summary: The source establishes altered nuclear signaling-protein distribution, but the import-specific step
      is unresolved.
    action: UNDECIDED
    reason: The exact mouse donor IMP is recovered, and the full original PMID:24681597 Results and Figure 5 show
      increased nuclear beta-catenin/LEF1 after Fermt1 loss, with related observations in human Kindler-syndrome
      skin. The authors interpret this redistribution as nuclear translocation. GO:0042308 includes reducing the
      extent of cytoplasm-to-nucleus movement; it does not require a direct interaction with a nuclear pore or a
      particular kinetic assay. Nevertheless, the same study also changes Wnt ligand/receptor expression and discusses
      beta-catenin stabilization and junctional sequestration. Its steady-state nuclear staining does not resolve
      how altered import, export, retention and protein stability contribute. UNDECIDED explicitly flags this narrower
      mechanistic uncertainty after full-text access; it neither accepts the transport assertion nor declares it
      disproved or over-annotated. Retain the separately supported negative Wnt-signaling role (row 27).
    additional_reference_ids:
    - PMID:24681597
    propagation_review:
      root_cause: UNRESOLVED
      source_entities:
      - source_id: UniProtKB:P59113
        source_status: UNRESOLVED
        comment: The donor IMP is recovered, but its nuclear-distribution evidence does not resolve the specific
          transport step in the target.
      - source_id: ensembl:ENSMUSP00000047616
        source_status: UNRESOLVED
        comment: The donor IMP is recovered, but its nuclear-distribution evidence does not resolve the specific
          transport step in the target.
