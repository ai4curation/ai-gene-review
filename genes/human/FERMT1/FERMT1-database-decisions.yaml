  review:
    summary: Integrin binding is a core molecular function of kindlin-1.
    action: ACCEPT
    reason: The inherited IBD assertion is biologically consistent with human kindlin-1 association with beta-integrin
      cytoplasmic tails in PMID:14634021. That experiment uses recombinant tails and a human-kindlin-containing
      cell lysate, so it is not described as an isolated two-purified-protein affinity measurement. Independent
      human functional constructs in PMID:19804783 support the integrin coactivation mechanism. Literal PAINT joins
      are verified; the unreturned tree/MSA is a provenance limit rather than evidence of target divergence.
    additional_reference_ids:
    - PMID:14634021
    - PMID:19804783
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN001043969
        source_status: SUPPORTS_TRANSFER
        comment: Literal positive IBD term/node/donor identifiers match the accepted PTHR16160 PAINT TSV, and Q9BQL6
          is an official family member. Target-to-node topology and MSA retrieval timed out and remain unverified;
          no loss or divergence is inferred from that access limitation. Donor count and target self-WITH are not
          criticisms.
