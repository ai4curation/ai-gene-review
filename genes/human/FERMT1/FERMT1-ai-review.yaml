references:
- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO terms
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The actual target-specific InterPro response places IPR037837 (kindlin/fermitin PH domain) at
      370–493 and IPR037843 (kindlin/fermitin family) at 3–676 and lists GO:0007229 for both. The human integrin
      mechanism is corroborated by original PMID:14634021 and PMID:19804783. Domain/family mapping is not itself
      a physical assay, and other kindlin paralogs' developmental functions are not transferred by their names.
- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Exact PTHR16160 family membership, official FERMITIN 2-RELATED family label and FERMITIN FAMILY
      HOMOLOG 1 subfamily label were verified. Three literal positive IBD records match the term/node/seed identifiers
      for integrin binding, focal adhesion and cell-matrix adhesion. Tree, gene-info and MSA requests timed out;
      no target-to-node ancestry or alignment reconstruction is claimed. Target-specific human evidence supports
      these biological functions. The target in its own WITH/FROM is expected descendant evidence; donor count is
      not a weakness.
- id: GO_REF:0000044
  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot Subcellular Location vocabulary mapping, accompanied
    by conservative changes to GO terms applied by UniProt
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The literal Swiss-Prot location mappings SL-0090 and SL-0301 correspond to cytoskeleton and ruffle
      membrane in the accepted human UniProt record. PMID:14634021 original human localization supports actin-linked
      adhesion sites and conditional TGF-beta-induced ruffles. These GO_REF rows are not HPA-derived. The additionally
      inspected HPA XML does not supply a cell-line subcellular assay for these precise compartments; broad histological
      labels are not used to replace the Swiss-Prot source chain.
- id: GO_REF:0000107
  title: Automatic transfer of experimentally verified manual GO annotation data to orthologs using Ensembl Compara
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Actual mouse donor P59113 (Fermt1) and Ensembl protein ENSMUSP00000047616 were verified. Ten exact
      matching IMP GO records trace to PMID:24681597; actin-filament binding traces to PMID:16876785 IDA. The 2014
      full original distinguishes mouse perturbation from human skin observations, integrin-dependent latent TGF-beta
      activation from cytokine production, and nuclear protein distribution from a resolved import mechanism. The
      2006 full article in the author thesis supports tagged localization but leaves direct actin binding unresolved.
      The electronic mapping and all source identifiers are preserved. No universal activity across four human splice
      products is inferred.
- id: GO_REF:0000117
  title: Electronic Gene Ontology annotations created by ARBA machine learning models
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The actual ARBA00028907 rule has GO:0030335 as its consequent and multiple alternative family/taxon
      condition sets. Target-specific satisfaction of those alternatives was not independently recomputed. The biological
      migration role remains positive, but strict official GO data place the retained direct GO:1903691 wound-spreading
      annotation below GO:0030335. The proposed TOO_GENERAL action depends on retaining that positive descendant
      during integration; it is not an evidence-code preference or a claim of lost migration function.
- id: GO_REF:0000120
  title: Combined Automated Annotation using Multiple IEA Methods
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The combined source preserves mouse P59113, its Ensembl protein and SL-0118. Mouse focal-adhesion
      IDA PMID:16876785 is recovered separately from other inferred donor records; actual human localization in
      PMID:14634021 and PMID:19804783 independently supports the same compartment. Tagged mouse experiments, endogenous
      human staining and artificial human domain constructs are distinguished; none is generalized to all natural
      splice forms.
- id: PMID:17012746
  title: Kindlin-1 is a phosphoprotein involved in regulation of polarity, proliferation, and motility of epidermal
    keratinocytes.
  findings: []
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The cached record is abstract-only. Original author-uploaded article text was recovered at the
      ResearchGate record for DOI 10.1074/jbc.M606259200, corroborated by indexed JBC pages; ordinary publisher
      downloads returned 403. Read operative Experimental Procedures, Results, selected captions for Figures 1–7,
      the Figure 8 result description and relevant Discussion. Human primary keratinocytes and skin underpin matrix
      attachment, proliferation, migration and polarity findings. Figure 2C–D immunogold is intracellular near the
      basal membrane between hemidesmosomes; it is not biochemical cytosolic fractionation or specific cell-cell-junction
      localization. COS-7 expression validates antibody recognition rather than human tissue function. The 74/78-kDa
      forms are phosphorylation states, not assigned splice products. Figures 4/6 support proliferation phenotypes
      and Figures 7/8 support migration; broader mechanistic interpretations are bounded. No local full PDF or figure
      pixels were recovered.
- id: PMID:18528435
  title: Colocalization of kindlin-1, kindlin-2, and migfilin at keratinocyte focal adhesion and relevance to the
    pathophysiology of Kindler syndrome.
  findings: []
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Original full text in the immutable publication cache was read for Results, localization/co-immunoprecipitation
      methods and Discussion. Endogenous human normal keratinocytes show cytoplasmic and vinculin-positive focal-adhesion
      localization (Figure 3a); tagged HaCaT experiments corroborate colocalization (Figure 4), and normal skin
      shows basal peripheral staining (Figure 7a). Co-immunoprecipitation establishes cellular association with
      kindlin-2 and migfilin, not purified binary interactions. Residual staining and an unidentified approximately
      65-kDa band in affected cells are discussed cautiously and do not identify a natural splice product. Native
      and tagged experiments are distinguished; no new binding or nuclear annotation is proposed.
- id: PMID:21356350
  title: Kindlin-1 and -2 have overlapping functions in epithelial cells implications for phenotype modification.
  findings: []
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The immutable cache is labeled full text but contains abstract and Discussion without operative
      Methods/Results. Those missing sections and Figure 1/2 captions were read from the actual PMC3069810 original.
      Human normal and Kindler-syndrome-derived immortalized keratinocytes, with kindlin-2 depletion, distinguish
      single and combined deficiencies. Figure 2A quantifies active β1 integrin normalized to total receptor; Figure
      2B tests laminin-332/fibronectin attachment; Figure 2D–F measures monolayer gap closure and single-cell directionality.
      Single-deficient adhesion differences were not significant, while combined deficiency was severe. Kindlin-2
      has the stronger effect on cell-cell-junction formation in this context. The results support overlapping functions,
      not interchangeability, direct binary binding, every integrin subtype, or natural-splice-specific activity.
      Figure pixels and supplementary material were not read; claim support here is operative Results/Methods and
      original captions.
- id: PMID:14634021
  title: The Kindler syndrome protein is regulated by transforming growth factor-beta and involved in integrin-mediated
    adhesion.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Original human HaCaT localization, ruffle Results/Figures 4–6 and beta-integrin-tail association/spreading
      Results/Figures 8–9 were read from the author-uploaded article; relevant Methods identify human kindlin and
      cell context. The tail assay uses human-kindlin-containing CHO lysate, not two purified partners. Kindlin
      alone did not activate alphaIIbbeta3 in the reported experiment; later talin-cooperation evidence is distinct.
      This source supports conditional ruffle localization and adhesion biology, not direct actin binding. Captions/text
      were read; figure pixels and supplements were not independently inspected. The immutable normal remains abstract-only
      despite separate full-original access.
- id: PMID:19804783
  title: 'The structure of the N-terminus of kindlin-1: a domain important for alphaiibbeta3 integrin activation.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Actual full original Results/Discussion sections on the F0 domain, integrin activation and focal-adhesion
      targeting, and corresponding Methods were read. Cell-functional constructs are full-length or artificially
      truncated human kindlin-1 tested in CHO cells with mouse talin head; the purified structural F0 work uses
      mouse protein. Human full-length kindlin-1 coactivates integrins and localizes to adhesions, while F0/DeltaF0
      constructs fail to reproduce the full activity. Artificial deletion constructs are not assigned to the four
      natural splice products. Figures 4–5 captions were read separately; original figure pixels and supplementary
      data were not independently inspected.
- id: PMID:24681597
  title: Kindlin-1 controls Wnt and TGF-β availability to regulate cutaneous stem cell proliferation.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The genuine full original Methods, operative Results and Figures 4–5 captions were read. Mouse
      epidermal Fermt1 deletion supports integrin-dependent adhesion, latent extracellular TGF-beta1 activation,
      Wnt regulation, cutaneous stem-cell effects and hair-cycle timing; human Kindler-syndrome skin observations
      are corroborative and not relabeled as mouse intervention results. The TGF-beta assay measures latent-ligand
      availability rather than biosynthesis/secretion; nuclear beta-catenin/LEF1 distribution does not isolate nuclear-import
      kinetics. Wnt-related expression changes are mixed across genes. Main text and specified captions, not original
      figure pixels or separate supplements, were inspected. Exact normal bytes are reused from accepted main.
- id: PMID:16876785
  title: 'The Kindlins: subcellular localization and expression during murine development.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PMID/title/DOI are verified from the genuine repository PubMed fetch. The complete original article
      is available within the author thesis at journal pages 3142–3151; the operative Methods/Results and Figure
      6 caption were read. Tagged murine Kindlin-1 localizes to adhesion sites and F-actin-associated structures
      in fibroblasts/keratinocytes; the inspected study does not resolve direct actin-filament binding. The source
      describes a 637-residue historical construct, not independently sequence-remapped to the current 677-residue
      P59113 record. The author explicitly notes possible overexpression-related staining and unavailable specific
      Kindlin-1/2 antibodies. Original figure pixels were not read. The generated normal remains abstract-only,
      while the separate full original was recovered.
