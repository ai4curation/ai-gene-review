id: Q9BQL6
gene_symbol: FERMT1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: FERMT1 encodes kindlin-1, an intracellular FERM-domain adhesion protein that binds beta-integrin cytoplasmic
  tails and cooperates with talin to promote integrin activation at focal adhesions. In keratinocytes, it supports
  attachment and spreading on extracellular matrix and contributes to epithelial polarity and migration. Context-dependent
  regulation of Wnt and TGF-beta signaling links kindlin-1 to skin homeostasis, hair-follicle cycling and stem-cell
  behavior. Most mechanistic evidence concerns full-length kindlin-1; shorter natural splice products alter its
  domain architecture.
