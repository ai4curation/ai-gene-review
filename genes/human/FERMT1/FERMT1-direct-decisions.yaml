gene: FERMT1
index_convention: zero-based original imported annotation order
scope: Twelve direct-source reviews; machine source fields unchanged.
decisions:
- annotation_index: 2
  source_annotation:
    term:
      id: GO:0005737
      label: cytoplasm
    evidence_type: IDA
    original_reference_id: PMID:18528435
    qualifier: located_in
  review:
    summary: Kindlin-1 has a cytoplasmic pool in human keratinocytes.
    action: KEEP_AS_NON_CORE
    reason: PMID:18528435 Results, confocal-localization section and Figure 3a show diffuse cytoplasmic kindlin-1
      staining in normal human keratinocytes alongside vinculin-positive focal adhesions. Retain the observed broader
      pool as non-core rather than equating every cytoplasmic signal with an adhesion complex. Residual labeling
      in mutant or depleted cells and the unidentified approximately 65-kDa band do not establish a particular natural
      splice product.
    supported_by:
    - reference_id: PMID:18528435
  methods:
  - Confocal microscopy; normal human keratinocytes; Figure 3a
- annotation_index: 3
  source_annotation:
    term:
      id: GO:0005829
      label: cytosol
    evidence_type: IDA
    original_reference_id: PMID:17012746
    qualifier: located_in
  review:
    summary: The original immunogold evidence supports intracellular kindlin-1 adjacent to the basal plasma membrane.
    action: KEEP_AS_NON_CORE
    reason: PMID:17012746 Results and Figure 2C–D place gold labeling inside normal human basal keratinocytes near
      the membrane facing the basement membrane, between hemidesmosomes. The cytosol definition includes particulate
      protein complexes outside organelles; it does not require a freely soluble fraction. Retain the curated cytosolic
      localization as non-core with this microscopy scope. The paper does not provide biochemical separation of
      a soluble cytosolic pool or imply an exclusive compartment.
    supported_by:
    - reference_id: PMID:17012746
  methods:
  - Human skin immunoelectron microscopy; Figure 2C–D
- annotation_index: 6
  source_annotation:
    term:
      id: GO:0005925
      label: focal adhesion
    evidence_type: IDA
    original_reference_id: PMID:18528435
    qualifier: located_in
  review:
    summary: Kindlin-1 localizes to human keratinocyte focal adhesions.
    action: ACCEPT
    reason: PMID:18528435 directly shows endogenous kindlin-1 colocalization with vinculin in normal human keratinocytes
      (Figure 3a). Tagged kindlin-1 and migfilin, with kindlin-2 immunostaining in HaCaT cells, provide corroborating
      focal-adhesion colocalization (Figure 4). This is a principal site of its adhesion-related activity. Cellular
      co-immunoprecipitation supports association, not purified pairwise binding or identity of every complex component.
    supported_by:
    - reference_id: PMID:18528435
  methods:
  - Endogenous confocal colocalization; Figure 3a; tagged corroboration Figure 4
- annotation_index: 8
  source_annotation:
    term:
      id: GO:0007155
      label: cell adhesion
    evidence_type: IDA
    original_reference_id: PMID:17012746
    qualifier: involved_in
  review:
    summary: The measured adhesion phenotype concerns cell attachment to extracellular matrix.
    action: MODIFY
    reason: PMID:17012746 assays primary human control and Kindler-syndrome keratinocyte attachment to fibronectin
      and laminin 332; the deficient cells attach less efficiently (Figure 6D and adhesion Methods). GO:0007160
      cell-matrix adhesion describes that observed function more precisely than generic cell adhesion. The intracellular
      adhesion-associated protein contributes to attachment; it is not itself an extracellular matrix ligand. Keep
      the original source term and evidence code unchanged.
    supported_by:
    - reference_id: PMID:17012746
    proposed_replacement_terms:
    - id: GO:0007160
      label: cell-matrix adhesion
  methods:
  - Primary human keratinocyte matrix-attachment assay; Figure 6D
- annotation_index: 9
  source_annotation:
    term:
      id: GO:0007155
      label: cell adhesion
    evidence_type: IGI
    original_reference_id: PMID:21356350
    qualifier: involved_in
    supporting_entities:
    - UniProtKB:Q96AC1
  review:
    summary: Kindlin-1 and kindlin-2 contribute overlapping support to cell-matrix adhesion.
    action: MODIFY
    reason: PMID:21356350 Figure 2B compares human keratinocyte lines lacking kindlin-1, depleted of kindlin-2,
      or deficient in both, on laminin 332 and fibronectin. Single-deficient adhesion is approximately 80–90% of
      control and not significantly different, whereas double deficiency strongly impairs attachment and spreading.
      The genetic-interaction context supports cell-matrix adhesion, GO:0007160, without attributing the whole double-deficient
      phenotype solely to FERMT1. Cell-cell-junction defects in this study are particularly associated with kindlin-2.
    supported_by:
    - reference_id: PMID:21356350
    proposed_replacement_terms:
    - id: GO:0007160
      label: cell-matrix adhesion
  methods:
  - Human single/double-deficient keratinocytes; matrix adhesion Figure 2B
- annotation_index: 13
  source_annotation:
    term:
      id: GO:0030054
      label: cell junction
    evidence_type: IDA
    original_reference_id: PMID:17012746
    qualifier: located_in
  review:
    summary: Kindlin-1 occurs at the basal epithelial cell–matrix junction.
    action: KEEP_AS_NON_CORE
    reason: PMID:17012746 Figure 2A–D and its Results localize kindlin-1 to the dermal–epidermal junction region,
      intracellularly at the basal membrane between hemidesmosomes. GO:0030054 includes cell–matrix connections
      as well as cell–cell connections. Retain the positive junction annotation as non-core tissue context; it is
      not evidence that kindlin-1 is a hemidesmosome component or an adherens-junction component. Cultured focal
      adhesions are independently resolved in PMID:18528435, while the original skin localization is broader.
    supported_by:
    - reference_id: PMID:17012746
    - reference_id: PMID:18528435
  methods:
  - Human skin immunofluorescence and immunoelectron microscopy; Figure 2
- annotation_index: 17
  source_annotation:
    term:
      id: GO:0033625
      label: positive regulation of integrin activation
    evidence_type: IGI
    original_reference_id: PMID:21356350
    qualifier: involved_in
    supporting_entities:
    - UniProtKB:Q96AC1
  review:
    summary: Kindlin-1 promotes β1-integrin activation in human keratinocytes.
    action: ACCEPT
    reason: PMID:21356350 Figure 2A measures the activation-sensitive 12G10 signal normalized to total surface β1
      integrin detected by 4B7R. Activity falls to approximately 60% with kindlin-1 deficiency, 90% with kindlin-2
      depletion and 20% with combined deficiency. This directly measured receptor-activation readout supports the
      positive-regulation annotation and partial compensation between kindlins. It is not a purified binary-binding
      experiment or proof of a universal effect on every integrin.
    supported_by:
    - reference_id: PMID:21356350
  methods:
  - Flow cytometry; active/total β1 normalization; Figure 2A
- annotation_index: 20
  source_annotation:
    term:
      id: GO:0043616
      label: keratinocyte proliferation
    evidence_type: IDA
    original_reference_id: PMID:17012746
    qualifier: involved_in
  review:
    summary: Kindlin-1 supports normal keratinocyte proliferation in the studied human systems.
    action: KEEP_AS_NON_CORE
    reason: PMID:17012746 shows reduced Ki67 labeling in affected epidermis (Figure 4C–D) and slower expansion of
      cultured kindlin-1-deficient keratinocytes (Figure 6C). These are positive tissue and cell-context findings.
      Retain the imported process as non-core downstream biology rather than treating necessity for population expansion
      as evidence that kindlin-1 directly executes DNA replication or cell-cycle chemistry. Cultured-cell apoptosis
      was not increased in the reported assay.
    supported_by:
    - reference_id: PMID:17012746
  methods:
  - Human epidermal Ki67 and primary-cell growth; Figures 4C–D and 6C
- annotation_index: 22
  source_annotation:
    term:
      id: GO:0051546
      label: keratinocyte migration
    evidence_type: IDA
    original_reference_id: PMID:17012746
    qualifier: involved_in
  review:
    summary: Kindlin-1 supports directed keratinocyte migration.
    action: KEEP_AS_NON_CORE
    reason: 'PMID:17012746 Figure 7 and migration Methods compare human primary keratinocytes: deficient cells show
      slower monolayer closure, reduced velocity and less directed individual tracks. Figure 8 adds abnormal protrusion/retraction
      behavior. Retain the migration process as a contextual consequence of adhesion and cytoskeletal organization;
      this does not assign motor activity or generalize an in vitro closure assay to all stages of wound repair.'
    supported_by:
    - reference_id: PMID:17012746
  methods:
  - Human primary-cell tracking and monolayer closure; Figures 7–8
- annotation_index: 26
  source_annotation:
    term:
      id: GO:0071944
      label: cell periphery
    evidence_type: IDA
    original_reference_id: PMID:18528435
    qualifier: located_in
  review:
    summary: Kindlin-1 is enriched near the basal keratinocyte periphery in human skin.
    action: KEEP_AS_NON_CORE
    reason: PMID:18528435 Results and Figure 7a describe strong staining near the cell periphery of basal keratinocytes
      in normal frozen skin, with weaker labeling elsewhere in the epidermis. Retain this tissue-level location
      as non-core context. It does not establish insertion into the lipid bilayer, and the broader in situ signal
      is not restricted to the cultured focal adhesions independently resolved in Figures 3–4.
    supported_by:
    - reference_id: PMID:18528435
  methods:
  - Normal human skin immunofluorescence; Figure 7a
- annotation_index: 28
  source_annotation:
    term:
      id: GO:0090162
      label: establishment of epithelial cell polarity
    evidence_type: IDA
    original_reference_id: PMID:17012746
    qualifier: involved_in
  review:
    summary: Kindlin-1 contributes to normal epithelial polarity in human basal keratinocytes.
    action: KEEP_AS_NON_CORE
    reason: PMID:17012746 Figure 5 shows abnormal distribution of collagen XVII and α6 integrin in kindlin-1-deficient
      skin, while Figure 6A shows multipolar cultured cells. This supports the curated polarity process in the epidermal
      context. Retain it as non-core organization downstream of the adhesion-associated protein; the experiments
      do not isolate a dedicated polarity-establishment reaction or prove that all epithelial tissues and splice
      products behave identically.
    supported_by:
    - reference_id: PMID:17012746
  methods:
  - Human skin polarity-marker distributions and primary-cell morphology; Figures 5 and 6A
- annotation_index: 29
  source_annotation:
    term:
      id: GO:1903691
      label: positive regulation of wound healing, spreading of epidermal cells
    evidence_type: IGI
    original_reference_id: PMID:21356350
    qualifier: involved_in
    supporting_entities:
    - UniProtKB:Q96AC1
  review:
    summary: Kindlin-1 contributes to epithelial spreading and closure of a cultured wound gap.
    action: KEEP_AS_NON_CORE
    reason: PMID:21356350 Figure 2D–F and the cell-migration Methods show delayed gap closure and reduced directional
      movement with kindlin-1 deficiency, with more severe defects after combined kindlin-1/kindlin-2 deficiency.
      Retain the existing spreading-related wound-healing annotation as non-core and explicitly limited to human
      keratinocyte monolayers. The assay combines motility, adhesion and population behavior; it does not separately
      establish every in vivo wound-healing phase or a FERMT1-exclusive effect.
    supported_by:
    - reference_id: PMID:21356350
  methods:
  - Human keratinocyte monolayer gap closure and tracking; Figure 2D–F
