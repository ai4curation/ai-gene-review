suggested_questions:
- question: >-
    Does the MPG/AAG interaction give SSBP1 a direct mtDNA-repair role in vivo,
    or is the reported glycosylase inhibition a safeguard that prevents base
    removal when MPG/AAG encounters SSBP1-coated single-stranded mtDNA?
- question: >-
    Which SSBP1 surface residues contact POLG and TWNK in the human replisome,
    and do disease variants selectively perturb one partner interaction in vivo?
- question: >-
    Does the reported MISO1 interaction recruit SSBP1-bound mtDNA to SMEM
    domains for turnover through a direct bridging complex, or does MISO1 act
    upstream of nucleoid recruitment?
suggested_experiments:
- description: >-
    Reconstitute human POLG:TWNK:SSBP1 replication forks with SSBP1 variants
    that perturb either DNA binding, tetramerization or the metazoan-specific
    stimulation surfaces, then separately measure template coating, POLG
    synthesis and TWNK unwinding.
  hypothesis: >-
    SSBP1 has separable ssDNA-organizing and partner-specific stimulation
    surfaces that together tune mtDNA replication fork processivity.
  experiment_type: in vitro replisome reconstitution with separation-of-function variants
