    summary: >-
      The mtDNA-crosslinking study supports SSBP1 as an mtDNA nucleoid protein,
      not nuclear chromatin binding.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The accessible abstract describes formaldehyde cross-linking to determine
      which proteins are in close contact with mitochondrial DNA in nucleoids,
      where SSBP1 is an established ssDNA-binding component. The same study's
      mtDNA-proximal result supports SSBP1's accepted mitochondrial-nucleoid
      localization rather than nuclear chromatin binding. Because this row is an
      experimental UniProt annotation from an abstract-only cache, the
      chromatin-binding call is left as over-annotated rather than confidently removed.
    supported_by:
