id: Q04837
gene_symbol: SSBP1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  SSBP1 encodes the mature mitochondrial single-stranded DNA-binding protein
  after cleavage of an N-terminal mitochondrial targeting peptide. The protein
  acts as a homotetramer in the mitochondrial matrix and mitochondrial nucleoid,
  where it binds exposed single-stranded mitochondrial DNA at the replisome,
  keeps the template in a conformation that supports DNA polymerase gamma, and
  stimulates the TWNK mitochondrial helicase. Human SSBP1 variants destabilize
  oligomer formation or reduce replisome stimulation and cause optic atrophy
  with mtDNA depletion, supporting SSBP1 as a core mtDNA-maintenance factor.
