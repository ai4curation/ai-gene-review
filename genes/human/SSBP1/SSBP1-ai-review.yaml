  review: &dna_replication_review
    summary: SSBP1 participates in mtDNA replication.
    action: ACCEPT
    reason: >-
      The PTHR10302 family review marks the PTHR10302 root DNA-replication IBD
      as sound: bacterial SSBs and mitochondrial SSBs both bind exposed ssDNA at
      replication forks. Human SSBP1 is directly required for efficient
      mitochondrial DNA replication through POLG and TWNK stimulation. The broad
      DNA-replication term is correct as a family-level PAINT placement that
      covers bacterial and mitochondrial replication, so it is kept while
      mitochondrial DNA replication is accepted on separate human rows.
    supported_by:
    - reference_id: file:interpro/panther/PTHR10302/PTHR10302-review.yaml
    - reference_id: PMID:15167897
      supporting_text: >-
        We here reconstitute a minimal mammalian mitochondrial DNA (mtDNA)
        replisome in vitro.
