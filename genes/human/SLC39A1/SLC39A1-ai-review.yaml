- term:
    id: GO:0005789
    label: endoplasmic reticulum membrane
  evidence_type: EXP
  original_reference_id: PMID:11696349
  qualifier: located_in
  review:
    summary: Transient expression of EGFP-, FLAG-tagged or native hZip1 showed a vesicular
      intracellular distribution corresponding partially to the endoplasmic reticulum
      in COS-7 and several epithelial cell lines, and endogenous ZIP1 was intracellular
      in PC-3 cells. This is a real but non-core, cell-type-dependent location distinct
      from the plasma-membrane site of transport.
    action: KEEP_AS_NON_CORE
    reason: >-
      SLC39A1 is a multi-pass membrane protein whose core transport activity occurs at the plasma
      membrane; the ER/vesicular pool reflects trafficking and reserve localization that varies with cell
      type and adhesion, and is peripheral to the core function. Note that the ER pool was seen with
      tagged (EGFP/FLAG) or transiently overexpressed native hZip1 in COS-7 and epithelial lines, and
      endogenous ZIP1 in PC-3 cells showed only a general "intracellular localization"; the experimental
      evidence supports an intracellular/ER-associated location, so the row is kept but marked non-core
      rather than accepted as a core site of action.
    supported_by:
    - reference_id: PMID:11696349
      supporting_text: we observed that hZip1 has a vesicular localization in COS-7 cells
        or in several epithelial cell lines, corresponding partially to the endoplasmic
        reticulum.
