suggested_questions:
- question: What governs the cell-type-dependent partitioning of ZIP1 between the plasma
    membrane and the intracellular ER/vesicular pool, and is the intracellular pool
    a regulated reserve that redistributes to the plasma membrane on demand?
- question: Does ZIP1 transport divalent cations other than Zn2+ (e.g. physiologically
    relevant Cd2+ or Cu2+) under any conditions, given its membership in a broad metal-ion
    transporter family?
suggested_experiments:
- description: Measure endogenous ZIP1 surface versus intracellular distribution by
    surface biotinylation and quantitative imaging across cell types and zinc-status
    conditions, correlating surface levels with 65Zn uptake kinetics.
- description: Structure-function analysis (cryo-EM or AlphaFold-guided mutagenesis)
    of the transmembrane His residues and the His-rich inter-helical loop to define
    the Zn2+ permeation path and the proposed intermolecular zinc-exchange mechanism.
