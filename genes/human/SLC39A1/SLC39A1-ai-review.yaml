- term:
    id: GO:0005102
    label: signaling receptor binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: enables
  supporting_entities:
  - UniProtKB:B5DEF5
  - ensembl:ENSRNOP00000071120
  review:
    summary: Electronic transfer, via Ensembl Compara orthology, of a "signaling receptor
      binding" annotation from a rodent ortholog. There is no mechanistic or experimental
      support for ZIP1 acting as a ligand of a signaling receptor; its characterized
      function is Zn2+ import.
    action: REMOVE
    reason: This is an over-propagated orthology-based electronic inference that conflicts
      with the well-established role of SLC39A1 as a multi-pass zinc influx transporter.
      No study of human ZIP1 (or its orthologs) demonstrates a signaling-receptor-ligand
      activity, and the term adds a biologically implausible molecular function. Removal
      does not assert that no protein-protein contact exists, only that "signaling receptor
      binding" is unsupported and misleading for this transporter.
    source_defects:
    - defect_type: WRONG_TERM
      resource: ENSEMBL
      slot: GO_ID
      requested_change: CHECK
      asserted_value: GO:0005102
      cause: OVER_PROPAGATION
      confidence: PROBABLE
      explanation: >-
        The Ensembl Compara pipeline (GO_REF:0000107) transferred "signaling receptor binding"
        (GO:0005102) to human SLC39A1/ZIP1 from the rat ortholog (UniProtKB:B5DEF5,
        ensembl:ENSRNOP00000071120). ZIP1 is a multi-pass integral-membrane zinc influx transporter
        (SLC39/ZIP family); no experimental study of human ZIP1 or its orthologs demonstrates
        signaling-receptor-ligand activity, and the term is biologically implausible for this
        transporter. The donor annotation and its propagation should be checked and the transferred
        GO:0005102 row removed from ZIP1 (and reviewed on the rat ortholog) as an over-propagation.
