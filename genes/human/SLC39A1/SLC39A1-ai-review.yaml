id: Q9NY26
gene_symbol: SLC39A1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SLC39A1 (ZIP1) is a ubiquitously expressed, multi-pass integral membrane
  protein of the ZIP (Zrt-/Irt-like protein, SLC39) family of metal-ion transporters.
  It mediates the influx of Zn2+ from the extracellular space into the cytosol across
  the plasma membrane, acting as a zinc importer (as opposed to the SLC30/ZnT family,
  which exports zinc out of the cytosol). Zinc uptake is saturable (KM ~3.5 uM) and
  is inhibited by Ni2+ but not Fe2+. A histidine-rich loop between transmembrane domains
  III and IV, together with histidines within the transmembrane helices, participates
  in the transport mechanism. ZIP1 localizes principally to the plasma membrane; a
  vesicular, partly endoplasmic-reticulum-associated intracellular pool has been seen
  mainly with tagged or transiently overexpressed protein and varies with cell type and
  adhesion state (endogenous ZIP1 in prostate PC-3 cells shows only a general intracellular
  signal), consistent with regulated trafficking of the transporter. It is the major zinc uptake transporter responsible for the high
  zinc accumulation of normal prostate epithelium, and is down-regulated in prostate
  cancer.
