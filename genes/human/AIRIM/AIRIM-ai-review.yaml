- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:21516116
  qualifier: enables
  supporting_entities:
  - UniProtKB:O96006
  review:
    summary: Generic protein binding with ZBED1, from a high-throughput Y2H pilot, a systematic binary
      interactome screen. Uninformative as a function statement.
    action: REMOVE
    reason: 'This row records that AIRIM scored an interaction with ZBED1 in a high-throughput Y2H pilot,
      a proteome-scale binary interaction dataset rather than a study of AIRIM. Such datasets are valuable
      and the interaction is not being disputed here; the objection is to the GO term. GO:0005515 says
      only that two proteins touch, which for a gene carrying 174 such rows conveys nothing about what
      AIRIM does, and none of these partners is a 55LCC subunit or otherwise supports a more specific
      molecular function that could be proposed instead. Per the project''s curation policy, GO:0005515
      protein binding is removed as uninformative rather than marked over-annotated: the problem is that
      it conveys no functional information, not that it claims more than the evidence supports. Removing
      it does not assert that the interaction is false.'
