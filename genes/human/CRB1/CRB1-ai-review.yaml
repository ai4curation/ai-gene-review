core_functions:
- description: The canonical CRB1 C-terminal motif binds the PALS1/MPP5 PDZ domain
    within apical polarity assemblies, contributing to epithelial apicobasal organization
    and the retinal outer limiting membrane. This describes the experimentally established
    tail-bearing membrane form; the five official products are not assumed to have
    equal topology or function.
  molecular_function:
    id: GO:0030165
