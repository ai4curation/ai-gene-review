id: P82279
gene_symbol: CRB1
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CRB1 is a Crumbs-family membrane protein that helps organize the apical
  polarity architecture of retinal photoreceptors and Müller glia. Its canonical C-terminal
  PDZ-binding motif engages PALS1/MPP5, linking CRB1 to a larger polarity assembly
  at the outer limiting membrane. CRB1 supports epithelial apicobasal organization
  and maintenance of retinal cell contacts; biallelic defects cause a spectrum of
  inherited retinal dystrophies. Alternative products differ in extracellular sequence,
  membrane topology and cytoplasmic tail, and tissue-specific Crb1 forms have distinct
  functions in experimental models. Mouse work also implicates Crb1 in intestinal
  and retinal epithelial barriers, while human CRB1–CRB2 association has been demonstrated
  without resolving whether the interaction acts between or within cells.
alternative_products:
- name: '1'
  id: P82279-1
  description: The 1406-residue displayed product retains the annotated transmembrane segment
    and cytoplasmic GTY and terminal ERLI motifs. The canonical tail mediates EPB41L5 FERM-domain
    and PALS1 PDZ-domain binding. Its sequence matches the human CRB1-A sequence reported
    in PMID:32620864.
- name: '2'
  id: P82279-2
  sequence_note: VSP_014728, VSP_014729
  description: This 1376-residue product replaces canonical residues 1336–1376 and deletes
    1377–1406, altering the membrane-proximal C terminus and removing the canonical GTY and
    terminal ERLI motifs. Canonical tail-binding activity is not established for this product;
    its sequence is distinct from the published human CRB1-B sequence.
- name: '3'
  id: P82279-3
  sequence_note: VSP_014725
  description: This 1294-residue product deletes extracellular residues 218–329 while retaining
    the canonical transmembrane segment and GTY/ERLI-containing cytoplasmic tail. The retained
    motifs indicate potential tail interactions, but equivalent native activity has not been
    separately established.
- name: '4'
  id: P82279-4
  sequence_note: VSP_014724, VSP_014726, VSP_014727
  description: This 942-residue product has an altered N terminus and lacks canonical residues
    1294–1406, including the annotated transmembrane segment and GTY/ERLI-containing tail.
    Canonical membrane topology and tail-mediated binding cannot be transferred from the displayed
    product; secretion is not established by these sequence changes alone.
- name: '5'
  id: P82279-5
  sequence_note: VSP_045332
  description: This 870-residue product deletes extracellular residues 710–1245 while retaining
    the canonical transmembrane segment and GTY/ERLI-containing tail. The extensive extracellular
    deletion precludes assuming equivalent extracellular interactions or native function from
    the retained tail motifs alone.
