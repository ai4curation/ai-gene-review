  review:
    action: KEEP_AS_NON_CORE
    summary: Retain the supported product-dependent outer-segment location as a non-core context.
    reason: The old mixed mapping includes a mouse IDA record citing PMID:15316081, whose
      actual three-antibody and knockout-controlled experiment instead places the recognized
      Crb1 form in the subapical inner segment and explicitly disputes earlier cone outer-segment
      staining. That source conflict is real. However, PMID:32620864 subsequently authenticates
      a distinct CRB1-B antibody with a delB knockout and detects mouse CRB1-B in both outer
      and inner segments by tangential-section Western blotting after its antibody proved
      unsuitable for immunohistochemistry. The paper also identifies the conserved, abundant
      human retinal B transcript. This later positive isoform evidence supports retaining
      the existing gene-level orthology inference; it is not direct human protein localization,
      and the deposited human B sequence is not any of the five official products. Do not
      apply the older canonical-tail staining result to exclude all CRB1 products from outer
      segments. This product-dependent location is retained as non-core relative to the established
      canonical-tail apical-polarity function; the classification does not negate the mouse
      localization or the supported gene-level transfer.
