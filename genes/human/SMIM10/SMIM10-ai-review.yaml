suggested_questions:
- question: >-
    Is endogenous SMIM10 mitochondrial, and if so is it a tail-anchored protein of the
    outer membrane? The only localization claim comes from an overexpression study in
    melanoma cells (PMID:30237439).
- question: >-
    Is the mitochondrial damage seen on SMIM10 overexpression a specific activity, or a
    nonspecific effect of overloading a tail-anchored membrane protein?
suggested_experiments:
- hypothesis: Endogenous SMIM10 is a tail-anchored protein of the mitochondrial outer membrane.
  description: >-
    Tag the endogenous SMIM10 locus and test co-localization with outer- and inner-membrane
    markers, protease protection of isolated mitochondria, and carbonate extraction. Compare
    the mitochondrial and proliferation phenotypes of SMIM10 knockout cells with those of
    overexpression.
  experiment_type: subcellular fractionation and protease protection
