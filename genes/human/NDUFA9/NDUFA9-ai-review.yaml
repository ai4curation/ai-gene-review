core_functions:
- description: >-
    NDUFA9 is a structural accessory (supernumerary) subunit of mitochondrial
    respiratory Complex I. It sits at the junction of the peripheral (Q-module)
    and membrane arms and stabilizes the complex; it is non-catalytic and binds a
    structural NADPH dinucleotide cofactor that is not turned over. Through
    its structural role it is required for proper assembly of a functional
    Complex I and thereby contributes to mitochondrial electron transport from
    NADH to ubiquinone.
  molecular_function:
    id: GO:0005198
    label: structural molecule activity
  directly_involved_in:
  - id: GO:0006120
    label: mitochondrial electron transport, NADH to ubiquinone
  - id: GO:0032981
    label: mitochondrial respiratory chain complex I assembly
  locations:
  - id: GO:0005743
    label: mitochondrial inner membrane
  in_complex:
    id: GO:0045271
    label: respiratory chain complex I
  supported_by:
  - reference_id: file:human/NDUFA9/NDUFA9-uniprot.txt
    supporting_text: "involved in catalysis. Required for proper complex I assembly"
  - reference_id: PMID:27626371
    supporting_text: "25 subunits are strictly"
  - reference_id: PMID:9878551
    supporting_text: "the transport of electrons from NADH to ubiquinone, which is"
references:
- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  findings:
  - statement: >-
      Source of the PANTHER phylogenetically-inferred (IBA) annotations for NDUFA9,
      which correctly propagate mitochondrion, mitochondrial inner membrane,
      respiratory chain complex I and NADH-to-ubiquinone electron transport from
      characterised orthologues of the 39 kDa Complex I accessory subunit.
  - statement: >-
      The same IBA propagation also produced an incorrect ubiquinone biosynthetic
      process annotation for NDUFA9; Complex I consumes ubiquinone as an electron
      acceptor rather than synthesising it, so this term is an over-propagation
      rather than evidence of a biosynthetic role.
- id: GO_REF:0000044
  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot Subcellular Location
    vocabulary mapping, accompanied by conservative changes to GO terms applied by
    UniProt
  findings:
  - statement: >-
      Basis for the electronic mitochondrial inner membrane localization annotation,
      derived by mapping the UniProtKB Q16795 subcellular location statement onto GO;
      consistent with NDUFA9 being a nucleus-encoded subunit with a cleaved targeting
      presequence that resides in the inner membrane as part of Complex I.
- id: GO_REF:0000107
  title: Automatic transfer of experimentally verified manual GO annotation data to
    orthologs using Ensembl Compara
  findings:
  - statement: >-
      Basis for orthology-projected annotations transferred to human NDUFA9 from
      experimentally characterised mammalian orthologues; NDUFA9 is a highly conserved
      Complex I accessory subunit, so such projection is biologically reasonable but
      carries no independent experimental weight for the human protein.
- id: GO_REF:0000108
  title: Automatic assignment of GO terms using logical inference, based on on inter-ontology
    links
  findings:
  - statement: >-
      Basis for GO terms assigned by inter-ontology logical inference rather than by
      direct evidence; for NDUFA9 these are downstream consequences of the complex I
      and electron transport assertions and add no new experimental support.
- id: PMID:11112787
  title: Human complex I defects can be resolved by monoclonal antibody analysis into
    distinct subunit assembly patterns.
  full_text_unavailable: true
  findings:
  - statement: Monoclonal antibodies against the 39 kDa Complex I subunit (NDUFA9) were used to profile subunit assembly in Complex I deficient patients.
    supporting_text: we introduce a new set of monoclonal antibodies that react with 39-, 30-, 20-, 18-, 15-, and 8-kDa subunits of Complex I
    full_text_unavailable: true
  - statement: Subunit-level antibody profiling distinguishes catalytic from assembly defects in Complex I disease, the assay context in which NDUFA9 is detected.
    supporting_text: helps distinguish catalytic versus assembly defects and further distinguishes between mutations in different subunits
    full_text_unavailable: true
- id: PMID:12611891
  title: The subunit composition of the human NADH dehydrogenase obtained by rapid
    one-step immunopurification.
  full_text_unavailable: true
  findings:
  - statement: NDUFA9 was identified by mass spectrometry as one of the polypeptides of immunopurified human Complex I, supporting its assignment as a bona fide complex I subunit.
    supporting_text: we can resolve and identify the human homologues of 42 polypeptides detected so far in the more extensively studied beef heart complex I
    full_text_unavailable: true
- id: PMID:17209039
  title: Identification of mitochondrial complex I assembly intermediates by tracing
    tagged NDUFS3 demonstrates the entry point of mitochondrial subunits.
  full_text_unavailable: true
  findings:
  - statement: Complex I is built stepwise through discrete subcomplexes, the assembly framework in which the NDUFS2/NDUFS3/NDUFA9-containing Q-module intermediate is defined.
    supporting_text: Upon induction, six distinct NDUFS3-GFP-containing subcomplexes gradually appeared on a blue native Western blot also observed in wild type HEK293 mitochondria.
    full_text_unavailable: true
- id: PMID:17500595
  title: Huntingtin interacting proteins are genetic modifiers of neurodegeneration.
  findings:
  - statement: >-
      High-throughput yeast two-hybrid and pull-down screening for huntingtin-associated
      proteins; any NDUFA9 hit here is a large-scale interaction dataset entry and does
      not establish a molecular function for NDUFA9.
    supporting_text: This effort led to the identification of 234 high-confidence Htt-associated proteins, 104 of which were found with the yeast method and 130 with the pull downs.
- id: PMID:19103604
  title: hNOA1 interacts with complex I and DAP3 and regulates mitochondrial respiration
    and apoptosis.
  full_text_unavailable: true
  findings:
  - statement: hNOA1 was found by immunoprecipitation-mass spectrometry to associate with Complex I, the source of the NDUFA9 physical-interaction annotation.
    supporting_text: hNOA1 interacts with both Complex I of the electron transport chain and DAP3 (death-associated protein 3), a positive regulator of apoptosis
    full_text_unavailable: true
  - statement: The functional link between hNOA1 and Complex I was supported by a Complex I-dependent drop in respiration on hNOA1 knockdown, but this reflects complex-level rather than NDUFA9-specific function.
    supporting_text: Knockdown of hNOA1 reduces mitochondrial O(2) consumption approximately 20% in a Complex I-dependent manner, supporting a functional link between hNOA1 and Complex I.
    full_text_unavailable: true
- id: PMID:21630459
  title: Proteomic characterization of the human sperm nucleus.
  full_text_unavailable: true
  findings:
  - statement: >-
      Large-scale catalogue of proteins detected in isolated sperm nuclei; detection of
      a mitochondrial inner-membrane subunit such as NDUFA9 in this fraction is most
      parsimoniously explained as residual contamination and does not support a nuclear
      localization.
    supporting_text: With this approach, 403 different proteins have been identified from the isolated sperm nuclei.
    full_text_unavailable: true
- id: PMID:22309213
  title: 'Identification of a molecular component of the mitochondrial acetyltransferase
    programme: a novel role for GCN5L1.'
  full_text_unavailable: true
  findings:
  - statement: GCN5L1 promotes acetylation of respiratory chain proteins, the post-translational context in which NDUFA9 acetylation is reported; this concerns regulation of NDUFA9 rather than an activity of NDUFA9.
    supporting_text: GCN5L1 interacts with and promotes acetylation of SIRT3 respiratory chain targets
    full_text_unavailable: true
- id: PMID:23209302
  title: KIF14 negatively regulates Rap1a-Radil signaling during breast cancer progression.
  findings:
  - statement: >-
      Study of KIF14-Radil-Rap1 signalling in breast cancer; the subject matter is
      unrelated to Complex I, so any NDUFA9 entry derived from it is a large-scale
      affinity-capture by-product with no bearing on NDUFA9 function.
    supporting_text: We report here that the kinesin KIF14 associates with the PDZ domain of Radil and negatively regulates Rap1-mediated inside-out integrin activation by tethering Radil on microtubules.
- id: PMID:27626371
  title: Accessory subunits are integral for assembly and function of human mitochondrial
    complex I.
  full_text_unavailable: true
  findings:
  - statement: Systematic knockout of each human Complex I accessory subunit showed that most, including NDUFA9, are strictly required for assembly of a functional complex.
    supporting_text: We show that 25 subunits are strictly required for assembly of a functional complex and 1 subunit is essential for cell viability.
    full_text_unavailable: true
  - statement: Loss of an accessory subunit destabilises the other subunits of its structural module, the evidence underpinning the structural/assembly role assigned to NDUFA9.
    supporting_text: Quantitative proteomic analysis of cell lines revealed that loss of each subunit affects the stability of other subunits residing in the same structural module.
    full_text_unavailable: true
  - statement: The 14 core subunits shared with bacteria carry catalysis, whereas the 31 human accessory subunits such as NDUFA9 are non-catalytic.
    supporting_text: Bacterial and human complex I share 14 core subunits that are essential for enzymatic function
    full_text_unavailable: true
- id: PMID:28844695
  title: Architecture of Human Mitochondrial Respiratory Megacomplex I(2)III(2)IV(2).
  full_text_unavailable: true
  findings:
  - statement: Cryo-EM of the human respiratory megacomplex assigned individual Complex I subunits, placing NDUFA9 within the complex I module of a higher-order supercomplex.
    supporting_text: The structure not only reveals the precise assignment of individual subunits of human CI and CIII, but also enables future in-depth analysis of the electron transport chain as a whole.
    full_text_unavailable: true
  - statement: Complex I is present in higher-order assemblies with complexes III and IV, supporting the respirasome/supercomplex localization context for its subunits.
    supporting_text: The MCI2III2IV2 forms a circular structure with the dimeric CIII located in the center, where it is surrounded by two copies each of CI and CIV.
    full_text_unavailable: true
- id: PMID:28985504
  title: CLOCK Acetylates ASS1 to Drive Circadian Rhythm of Ureagenesis.
  full_text_unavailable: true
  findings:
  - statement: >-
      NDUFA9 was identified as an acetylation substrate of CLOCK; this describes a
      post-translational modification of NDUFA9 by another enzyme and does not assign
      NDUFA9 a role in circadian or ureagenesis pathways.
    supporting_text: Taken together, CLOCK modulates metabolic rhythmicity by acting as a rhythmic acetyl-transferase for metabolic enzymes.
    full_text_unavailable: true
- id: PMID:30030361
  title: Assembly of mammalian oxidative phosphorylation complexes I-V and supercomplexes.
  full_text_unavailable: true
  findings:
  - statement: Review establishing that OXPHOS supernumerary subunits such as NDUFA9 act in assembly, regulation and stability rather than catalysis.
    supporting_text: The human enzymes comprise core proteins, performing the catalytic activities, and a large number of 'supernumerary' subunits that play essential roles in assembly, regulation and stability.
    full_text_unavailable: true
  - statement: Complexes I, III and IV associate into respiratory supercomplexes, the higher-order context in which Complex I subunits operate.
    supporting_text: it is now well established that complexes I, III and IV interact with each other, forming the so-called respiratory supercomplexes or 'respirasomes'
    full_text_unavailable: true
- id: PMID:31536960
  title: Rewiring of the Human Mitochondrial Interactome during Neuronal Reprogramming
    Reveals Regulators of the Respirasome and Neurogenesis.
  findings:
  - statement: >-
      Co-fractionation mass spectrometry map of human mitochondrial protein assemblies;
      NDUFA9 appears as a member of respiratory chain assemblies in this dataset, which
      supports complex membership rather than a distinct molecular function.
    supporting_text: The resulting networks, encompassing 6,442 high-quality associations among 600 MPs, revealed widespread changes in mitochondrial interactions and site-specific phosphorylation during neuronal differentiation.
- id: PMID:32296183
  title: A reference map of the human binary protein interactome.
  findings:
  - statement: >-
      Systematic yeast two-hybrid reference interactome (HuRI); NDUFA9 entries derived
      from it are binary interaction data points and are not evidence for a specific
      molecular function of NDUFA9.
    supporting_text: Here we present a human 'all-by-all' reference interactome map of human binary protein interactions, or 'HuRI'.
- id: PMID:32814053
  title: Interactome Mapping Provides a Network of Neurodegenerative Disease Proteins
    and Uncovers Widespread Protein Aggregation in Affected Brains.
  full_text_unavailable: true
  findings:
  - statement: >-
      Large-scale yeast two-hybrid network centred on neurodegeneration-associated
      proteins; any NDUFA9 interaction reported here is a high-throughput screen hit
      without complex I-specific functional follow-up.
    supporting_text: Interactome maps are valuable resources to elucidate protein function and disease mechanisms.
    full_text_unavailable: true
- id: PMID:34800366
  title: Quantitative high-confidence human mitochondrial proteome and its dynamics
    in cellular context.
  findings:
  - statement: NDUFA9 is a member of the stringently defined human mitochondrial high-confidence proteome (MitoCoP), corroborating its mitochondrial localization.
    supporting_text: We classified >8,000 proteins in mitochondrial preparations of human cells and defined a mitochondrial high-confidence proteome of >1,100 proteins (MitoCoP).
- id: PMID:8486360
  title: Construction and evaluation of a hncDNA library of human 12p transcribed
    sequences derived from a somatic cell hybrid.
  full_text_unavailable: true
  findings:
  - statement: The human cDNA corresponding to the 39 kDa Complex I subunit (NDUFA9) was first isolated here and mapped to chromosome 12p.
    supporting_text: clone CC6 is a human homologue of the bovine 39-kDa nuclear-encoded NADH:ubiquinone oxidoreductase subunit
    full_text_unavailable: true
- id: PMID:9878551
  title: 'cDNA of eight nuclear encoded subunits of NADH:ubiquinone oxidoreductase:
    human complex I cDNA characterization completed.'
  full_text_unavailable: true
  findings:
  - statement: Defines the catalytic activity of the complex that NDUFA9 belongs to - electron transfer from NADH to ubiquinone coupled to proton translocation.
    supporting_text: Its main function is the transport of electrons from NADH to ubiquinone, which is accompanied by translocation of protons from the mitochondrial matrix to the intermembrane space.
    full_text_unavailable: true
  - statement: Complex I is a large multiprotein assembly of the inner mitochondrial membrane, the compartment in which NDUFA9 resides.
    supporting_text: NADH:ubiquinone oxidoreductase (complex I) is an extremely complicated multiprotein complex located in the inner mitochondrial membrane.
    full_text_unavailable: true
- id: Reactome:R-HSA-163217
  title: Complex I oxidises NADH to NAD+, reduces CoQ to CoQH2
  findings:
  - statement: >-
      Reactome reaction describing the catalytic output of Complex I - NADH oxidation
      with ubiquinone reduction coupled to proton pumping. NDUFA9 participates as a
      structural subunit of the complex catalysing this reaction, not as a catalytic
      component.
- id: Reactome:R-HSA-6799178
  title: Intermediate 1 binds HP subcomplex to form Intermediate 2
  findings:
  - statement: >-
      Reactome assembly step in which the hydrophobic protein (HP) fraction containing
      NDUFA9 joins Intermediate 1, supporting the mitochondrial respiratory chain
      complex I assembly annotation.
- id: Reactome:R-HSA-6799179
  title: Peripheral arm subunits bind the 815kDa complex to form a 980kDa complex
  findings:
  - statement: >-
      Late Complex I assembly step involving flavoprotein (FP) peripheral arm subunits.
      NDUFA9 is not one of the subunits added at this step; it is present in the earlier
      IP/Q-module intermediates.
- id: Reactome:R-HSA-6799191
  title: Intermediate 2 binds MT-ND1:NDUFAF5:NDUFAF6 to form a 315kDa subcomplex
  findings:
  - statement: >-
      Assembly step forming the 315 kDa subcomplex around the NDUFS2/NDUFS3 core, the
      Q-module intermediate to which NDUFA9 belongs and which it helps stabilise.
- id: Reactome:R-HSA-6799196
  title: The MCIA complex, NDUFAF2-7 all dissociate from the 980kDa complex, resulting
    in Complex I
  findings:
  - statement: >-
      Final step of Complex I biogenesis in which assembly factors dissociate to leave
      the mature complex containing NDUFA9.
- id: Reactome:R-HSA-6799197
  title: ND4, ND5 bind the 550kDa complex to form the 815kDa complex
  findings:
  - statement: >-
      Distal membrane-arm assembly step requiring DMAC1/DMAC2; downstream of the
      NDUFA9-containing intermediates and not a step in which NDUFA9 acts directly.
- id: Reactome:R-HSA-6799202
  title: The 315kDa subcomplex binds the 370kDa subcomplex to form the 550kDa complex
  findings:
  - statement: >-
      Assembly step joining the NDUFA9-containing 315 kDa subcomplex to the 370 kDa
      membrane-arm subcomplex.
- id: Reactome:R-HSA-6799203
  title: IP subcomplex binds NDUFAF3, NDUFAF4, TIMMDC1 to form Intermediate 1
  findings:
  - statement: >-
      Reactome step stating explicitly that NDUFS7, NDUFS8 and NDUFA9, together with
      NDUFS2 and NDUFS3, form an evolutionarily conserved hydrogenase module within the
      iron-sulfur protein (IP) subcomplex - the structural context of NDUFA9.
- id: Reactome:R-HSA-6800868
  title: NDUF subunits bind to form the IP subcomplex
  findings:
  - statement: >-
      Formation of the IP subcomplex in which NDUFA9 associates with NDUFS2, NDUFS3,
      NDUFS7 and NDUFS8 to build the conserved hydrogenase module, the primary evidence
      basis for the structural role of NDUFA9.
- id: file:human/NDUFA9/NDUFA9-uniprot.txt
  title: UniProtKB entry Q16795 (NDUA9_HUMAN)
  findings:
  - statement: UniProt states that NDUFA9 is an accessory Complex I subunit believed not to participate in catalysis but required for proper complex I assembly.
    supporting_text: "Accessory subunit of the mitochondrial membrane respiratory chain NADH dehydrogenase (Complex I), that is believed not to be involved in catalysis. Required for proper complex I assembly"
  - statement: UniProt places NDUFA9 in the hydrophobic protein fraction of the 45-subunit Complex I.
    supporting_text: "Complex I is composed of 45 different subunits."

suggested_questions:
- question: >-
    Is the NAD(P)H dinucleotide bound by the NDUFA9 Rossmann fold purely structural, or
    does its redox state act as a regulatory sensor that tunes Complex I stability or
    the active/deactive transition?
  experts: []
- question: >-
    Do the CLOCK-dependent acetylation sites on NDUFA9 alter Complex I assembly,
    stability or activity, or are they functionally silent marks?
  experts: []
- question: >-
    Which NDUFA9 missense variants found in MC1DN26 patients act by destabilising the
    Q-module junction versus by impairing cofactor binding, and does this distinction
    predict clinical severity?
  experts: []

suggested_experiments:
- hypothesis: >-
    The NADPH bound by NDUFA9 is a structural cofactor whose binding is required for
    Q-module stabilisation rather than for any redox chemistry.
  description: >-
    Generate NDUFA9 knockout cells reconstituted with wild-type NDUFA9 or with
    Rossmann-fold point mutants predicted to abolish dinucleotide binding, then compare
    Complex I assembly by blue native PAGE and complexome profiling, NADH:ubiquinone
    oxidoreductase activity, and thermal stability of the isolated complex.
  experiment_type: structure-function mutagenesis with blue native PAGE and enzyme assay
- hypothesis: >-
    Acetylation of NDUFA9 modulates Complex I assembly or activity.
  description: >-
    Map endogenous NDUFA9 acetylation sites by targeted mass spectrometry, then express
    acetyl-null (K to R) and acetyl-mimetic (K to Q) NDUFA9 variants in NDUFA9 knockout
    cells and measure Complex I assembly intermediates, holoenzyme levels, oxygen
    consumption rate and supercomplex distribution.
  experiment_type: site-directed PTM mimetic analysis with respirometry
- hypothesis: >-
    Patient NDUFA9 variants cause disease through destabilisation of the Q-module
    junction of Complex I.
  description: >-
    Introduce patient-derived NDUFA9 missense variants into an isogenic knockout
    background and determine the resulting Complex I structures by cryo-EM alongside
    quantitative complexome profiling, to localise the assembly block and correlate
    structural destabilisation with residual enzymatic activity.
  experiment_type: cryo-EM and complexome profiling of variant knock-in cells
