  - *id004
  - *id006
  - reference_id: PMID:30131441
    supporting_text: We show that the core appendage proteins Cep83 and SCLT1 recruit LRRC45 to the mother
      centriole.
suggested_questions:
- question: Is the rat CAP-1A role in limiting Nav1.8 surface density conserved for human SCLT1, and is
    it carried out by a non-centrosomal pool or by an alternative isoform?
- question: Does SCLT1 bind FBF1 and CEP164 directly, or does it recruit them through intermediates such
    as LRRC45?
suggested_experiments:
- description: Express human SCLT1 isoforms with Nav1.8 in human iPSC-derived sensory neurons and measure
    surface channel density and clathrin-dependent internalization, comparing with SCLT1-knockout cells,
    to test whether the rat linker function is conserved.
