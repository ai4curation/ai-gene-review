- term:
    id: GO:0045162
    label: clustering of voltage-gated sodium channels
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q8CJ99
  - ensembl:ENSRNOP00000019256
  - InterPro:IPR038911
  review:
    summary: >-
      IEA (ortholog/InterPro mapping) to clustering of voltage-gated sodium channels.
    action: REMOVE
    reason: >-
      The only functional data (rat CAP-1A) show that SCLT1 reduces Nav1.8 current density, consistent
      with removal of channels from the surface, not with clustering of channels at specific membrane
      domains such as nodes of Ranvier. No evidence supports a clustering role, so this mapping is not
      supported.
