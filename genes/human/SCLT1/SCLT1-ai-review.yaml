- term:
    id: GO:0071439
    label: clathrin complex
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: part_of
  supporting_entities:
  - UniProtKB:Q8CJ99
  - ensembl:ENSRNOP00000019256
  review:
    summary: >-
      IEA part_of clathrin complex transferred from rat CAP-1A.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The rat study shows CAP-1A can form a multiprotein complex with Nav1.8 and clathrin, i.e. it is
      a clathrin-binding adaptor. That does not make it a subunit of the clathrin complex (the triskelion
      of heavy and light chains). The clathrin binding annotation already captures the claim.
    additional_reference_ids:
    - PMID:15797711
    supported_by:
    - reference_id: PMID:15797711
      supporting_text: CAP-1A is abundantly expressed in DRG neurons and colocalizes with Na(v)1.8 and
        can form a multiprotein complex with Na(v)1.8 and clathrin.
