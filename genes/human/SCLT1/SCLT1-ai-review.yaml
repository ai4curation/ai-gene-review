id: Q96NL6
gene_symbol: SCLT1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  SCLT1 (sodium channel and clathrin linker 1) is a coiled-coil component of the distal appendages (ciliary
  transition fibers) of the mother centriole. Recruited by CEP83, it forms part of the appendage blade
  backbone and is required to recruit the more distal appendage components FBF1 and CEP164, as well as
  LRRC45. Through this scaffolding role SCLT1 is essential for docking of the mother centriole to membranes
  and for primary cilium assembly. Sclt1-null mice show ciliopathy phenotypes (cystic kidney, cleft palate,
  polydactyly), and SCLT1 variants are associated with oral-facial-digital syndrome. The rat orthologue
  (CAP-1A) was first described as an adaptor that binds the Nav1.8 sodium channel and clathrin and lowers
  Nav1.8 current density in sensory neurons, a role not yet examined in human cells.
