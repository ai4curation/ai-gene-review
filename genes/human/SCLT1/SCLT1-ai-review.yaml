- term:
    id: GO:0017080
    label: sodium channel regulator activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q8CJ99
  - ensembl:ENSRNOP00000019256
  review:
    summary: >-
      IEA from rat Sclt1 (CAP-1A), which links Nav1.8 to clathrin and reduces Nav1.8 current density in
      DRG neurons.
    action: KEEP_AS_NON_CORE
    reason: >-
      A single rat study supports a role in limiting Nav1.8 surface density, probably via clathrin-dependent
      internalization. This has not been tested for human SCLT1 and is unrelated to its well-established
      distal appendage role, which is the function supported by human genetics and cell biology. Retained
      as a non-core, ortholog-based activity.
    additional_reference_ids:
    - PMID:15797711
    supported_by:
    - &id002
      reference_id: PMID:15797711
      supporting_text: We have identified a novel protein, clathrin-associated protein-1A (CAP-1A), which
        contains distinct domains that bind Na(v)1.8 and clathrin.
    - &id003
      reference_id: PMID:15797711
      supporting_text: Coexpression of CAP-1A and Na(v)1.8 in DRG neurons reduces Na(v)1.8 current density
        by approximately 50% without affecting the endogenous or recombinant tetrodotoxin-sensitive currents.
