- term:
    id: GO:0005198
    label: structural molecule activity
  evidence_type: IDA
  original_reference_id: PMID:29789620
  review:
    summary: 'Proposed: SCLT1 contributes to the structural integrity of the distal appendage (ciliary
      transition fiber) blade, as one of the four proteins forming the blade backbone.'
    action: NEW
    reason: Super-resolution mapping shows the protein forms part of the backbone of the distal appendage
      blades, and loss-of-function abolishes recruitment of downstream appendage components. No enzymatic
