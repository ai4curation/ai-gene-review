core_functions:
- description: "Structural component of the mother-centriole distal appendage blades that acts downstream\
    \ of\n   CEP83 to recruit FBF1 and CEP164 (and LRRC45), enabling membrane docking of the mother centriole\
    \ and initiation of\n   primary cilium assembly."
