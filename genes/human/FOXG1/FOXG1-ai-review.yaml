id: P55316
gene_symbol: FOXG1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: FOXG1 is a nuclear forkhead transcription factor that recognizes DNA sequence motifs and
  regulates gene expression through interactions with TLE and KDM5B corepressors and FOXO–SMAD transcriptional
  complexes. It helps coordinate telencephalon development, and disruption of human FOXG1 causes a severe
  neurodevelopmental disorder. In human brain tumor-initiating cells, FOXG1 supports propagation and an
  undifferentiated state, coupling repression of CDKN1A and astroglial genes with maintenance of SOX2
  and BMI1 expression. Its effects depend on the cellular context and recruited partners.
