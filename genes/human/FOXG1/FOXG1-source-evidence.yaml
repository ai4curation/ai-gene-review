  - reference_id: PMID:24356439
  - reference_id: PMID:21280142
suggested_questions:
- question: How do TLE and KDM5B recruitment determine which FOXG1-bound genes are repressed in developing
    human neural cells?
- question: How do FOXG1 dosage and subnuclear distribution alter target-gene regulation across neural
    progenitor and differentiated states?
