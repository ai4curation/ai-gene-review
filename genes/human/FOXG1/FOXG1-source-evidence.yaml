reviewed_contexts:
- raw_index: 0
  forecast_tsv_row: 11
  review:
    action: ACCEPT
    summary: FOXG1 is a DNA-binding regulator of RNA polymerase II transcription.
    reason: 'The TFClass assertion agrees with the combined human evidence: target-specific HT-SELEX supports
      forkhead-site recognition, human BF-1 constructs repress a GAL4-tethered Pol II reporter, and endogenous
      FOXG1 occupies regulatory regions with TLE1 in human BT048 cells. These complementary assays support
      the gene-level activity without claiming that GAL4 tethering measures native FOXG1 DNA recognition
      or that ChIP establishes purified binding affinity.'
    supported_by:
    - reference_id: PMID:28473536
    - reference_id: PMID:12657635
    - reference_id: PMID:24356439
  stored_index: 1
- raw_index: 1
  forecast_tsv_row: 15
  review:
    action: TOO_GENERAL
    summary: Broad DNA binding is covered by FOXG1 sequence-specific double-stranded DNA binding.
    reason: Retain the original TAS reference while applying the same gene-level granularity judgment
      to both GO:0003677 rows. Independently verified target-specific HT-SELEX supports the existing GO:1990837
      annotations, an is_a descendant through GO:0043565. Selected original Methods in PMID:7957066 describe
      FREAC2/3/4/7 constructs; the exact FOXG1-specific support for this historical TAS row was not recovered.
      This source limitation does not establish a wrong-gene citation or contradict FOXG1 DNA binding.
    supported_by:
    - reference_id: PMID:28473536
  stored_index: 2
- raw_index: 2
  forecast_tsv_row: 17
  review:
    action: TOO_GENERAL
    summary: The historical DNA-binding assertion is less specific than the established double-stranded
      DNA-binding activity.
    reason: GO:1990837 is an is_a descendant of GO:0003677 and is independently supported for FOXG1. PMID:7959731
      has an authentic abstract describing human clones and developmental expression, but its exact DNA-binding
      assay was not recovered. Its historical HFK1/HFK2/HFK3 interpretation must not create present-day
      alternative products; current UniProt documents likely sequencing errors. The original TAS identifier
      remains unchanged, and this specificity judgment does not certify unseen Methods.
    supported_by:
    - reference_id: PMID:28473536
    - reference_id: PMID:17260156
  stored_index: 3
- raw_index: 3
  forecast_tsv_row: 3
  review:
    action: TOO_GENERAL
    summary: The generic DNA-binding transcription-factor term is covered by the retained Pol II-specific
      activity.
    reason: The InterPro inference is biologically sound, but GO:0000981 is an is_a child of this unrestricted
      term and is already present. Human reporter and endogenous promoter-occupancy evidence support the
      more informative Pol II-specific gene-level activity. The family-derived source assertion is preserved;
      it is not treated as erroneous because a more specific annotation is available.
    supported_by:
    - reference_id: PMID:12657635
    - reference_id: PMID:24356439
  stored_index: 4
- raw_index: 4
  forecast_tsv_row: 13
  review:
    action: MODIFY
    summary: FOXG1 interacts with the transcriptional corepressor PLU-1/KDM5B.
    reason: PMID:12657635 tests human BF-1 and PLU-1 using yeast two-hybrid and tagged reciprocal co-immunoprecipitation.
      BF-1 VP-motif mutations disrupt the interaction and PLU-1-mediated enhancement of repression while
      preserving basal BF-1 repression. Transcription corepressor binding therefore adds functional specificity
      to the original Q9UGL1 interaction. The assays use engineered constructs; the endogenous PAX9 experiment
      is not an endogenous BF-1 experiment, and no purified affinity is claimed. PLU-1 corepressor or
      demethylase activity is not assigned to FOXG1.
    supported_by:
    - reference_id: PMID:12657635
    proposed_replacement_terms:
    - id: GO:0001222
      label: transcription corepressor binding
  stored_index: 5
- raw_index: 5
  forecast_tsv_row: 8
  review:
    action: MODIFY
    summary: FOXG1 associates with TLE1 in a repression-related nuclear complex.
    reason: PMID:24356439 shows reciprocal endogenous FOXG1/TLE1 co-immunoprecipitation in human BT048
      cells and sequential ChIP at the p21 promoter. TLE knockdown and GRG6 antagonism provide functional
      context for this corepressor association, supporting transcription corepressor binding as a more
      informative description of the original Q04724 interaction. Co-complex recovery and co-occupancy
      do not establish purified binary affinity, stoichiometry, or a directly resolved interface. The
      tumor-cell setting is retained.
    supported_by:
    - reference_id: PMID:24356439
    proposed_replacement_terms:
    - id: GO:0001222
      label: transcription corepressor binding
  stored_index: 6
- raw_index: 6
  forecast_tsv_row: 7
  review:
    action: TOO_GENERAL
    summary: Sequence-specific DNA binding is covered by the existing double-stranded DNA-binding annotations.
    reason: GO:1990837 is an is_a child of GO:0043565. The authentic FOXG1 HT-SELEX rows and the independently
      traced positive PAINT ancestor support this more specific double-stranded DNA activity. Preserve
      the original Ensembl/InterPro donor assertions without treating their breadth as a propagation defect.
      The eDBD construct has two documented old-reference sequence conflicts outside the annotated forkhead
      domain; this does not establish their effects or a natural product.
    supported_by:
    - reference_id: PMID:28473536
  stored_index: 15
- raw_index: 7
  forecast_tsv_row: 2
  review:
    action: ACCEPT
    summary: FOXG1 inherits sequence-specific double-stranded DNA-binding activity from a supported PAINT
      ancestor.
    reason: The genuine PTHR46617 tree and MSA place the exact 489-aa human P55316 leaf PTN002483625 below
      PTN000216104, where a literal positive IBD asserts this activity. The IBD includes P55316 experimental
      grounding; this is expected descendant evidence, not circular transfer. The incoming row and donor
      list match the retained PAINT record, with no family negative record. Target-specific HT-SELEX corroborates
      the activity with its stated construct limits.
    supported_by:
    - reference_id: PMID:28473536
  stored_index: 17
- raw_index: 8
  forecast_tsv_row: 9
  review:
    action: ACCEPT
    summary: The FOXG1 forkhead-domain construct selects double-stranded DNA motifs.
    reason: PMID:28473536 workbook S2 rows 5118/5123 identify FOXG1 motifs; S1 row 266 uses the previous
      symbol FOXG1B and exact ENSG00000176165. Its 135-aa eDBD best aligns to canonical residues 163–297
      with R281P and R291A, matching documented historical sequence conflicts outside the annotated 181–275
      forkhead domain. The positive motif-selection result supports the existing activity, while no exact
      wild-type fragment identity, variant effect, full-length cellular affinity, or natural alternative
      product is inferred.
    supported_by:
    - reference_id: PMID:28473536
  stored_index: 18
- raw_index: 9
  forecast_tsv_row: 5
  review:
    action: TOO_GENERAL
    summary: Broad transcriptional regulation is covered by the retained Pol II-specific process.
    reason: GO:0006357 is an is_a child of GO:0006355 and is independently supported by human reporter
      and endogenous transcriptional evidence. The original ARBA/InterPro annotation is retained as source
      provenance, but the unrestricted parent adds less information than the existing Pol II process.
      This is a granularity judgment rather than a claim that the electronic mapping is biologically false.
    supported_by:
    - reference_id: PMID:12657635
    - reference_id: PMID:24356439
  stored_index: 10
- raw_index: 10
  forecast_tsv_row: 1
  review:
    action: ACCEPT
    summary: Regulation of Pol II transcription is an inherited and experimentally supported FOXG1 function.
    reason: The actual PTHR46617 tree/MSA places human FOXG1 below PTN000216104, and the incoming IBA
      joins its literal positive IBD for GO:0006357 with the original MGI donor unchanged. Human BF-1
      reporter repression and endogenous FOXG1/TLE1 promoter occupancy with expression changes independently
      support this regulatory role. The process remains direction-neutral at this ancestral level; the
      separate negative-regulation row records the demonstrated repressive context.
    supported_by:
    - reference_id: PMID:12657635
    - reference_id: PMID:24356439
  stored_index: 11
- raw_index: 11
  forecast_tsv_row: 6
  review:
    action: KEEP_AS_NON_CORE
    summary: FOXG1 contributes to brain development through its transcriptional role.
    reason: The broad ARBA brain-development inference is consistent with the reviewed human FOXG1 function,
      developmental expression and human neurodevelopmental disease evidence. Retain the process as a
      biological context rather than a separate molecular core. This does not treat expression alone as
      a functional perturbation, infer every developmental stage, or transfer tumor-cell proliferation
      endpoints into a new brain-development claim.
    supported_by:
    - reference_id: PMID:21280142
    - reference_id: PMID:7959731
  stored_index: 12
- raw_index: 12
  forecast_tsv_row: 18
  review:
    action: KEEP_AS_NON_CORE
    summary: The historical brain-development assertion is retained with its original source limitations.
    reason: The authentic PMID:7599184 abstract reports human fetal-brain expression and historical HBF1/HBF2
      clones; its full experimental context was not recovered. Developmental expression alone does not
      demonstrate participation, but the unrestricted gene-level brain-development claim is consistent
      with independent FOXG1 neurodevelopmental evidence and the reviewed biological function. Retain
      the original curator assertion as non-core without certifying an unseen functional assay or reproducing
      the superseded gene-duplication interpretation.
    supported_by:
    - reference_id: PMID:21280142
    - reference_id: PMID:17260156
  stored_index: 13
- raw_index: 13
  forecast_tsv_row: 16
  review:
    action: KEEP_AS_NON_CORE
    summary: Human and mouse developmental expression provides context for the established brain-development
      role.
    reason: PMID:7959731 describes human fetal-brain and mouse expression, including telencephalic neuronal
      expression. The accessed abstract does not establish a developmental perturbation assay, and the
      original full Methods remain unverified. The broad gene-level brain-development annotation is nevertheless
      biologically consistent with independently established FOXG1 neurodevelopmental involvement and
      is retained as non-core. Historical HFK clone differences are not interpreted as distinct current
      products.
    supported_by:
    - reference_id: PMID:21280142
