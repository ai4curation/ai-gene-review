    extraction
  - Methods S17 paragraph 29; S24 paragraph 36; S26 paragraph 38; S27 paragraph 39
  - Figure 6e–g, 7 and 8 captions
  selected_findings:
  - Human patient-derived BT048 cells provide reciprocal endogenous FOXG1/TLE1 co-immunoprecipitation
    and sequential FOXG1-then-TLE1 ChIP at the p21 promoter. Antibody and input controls are described.
  - Cross-linked chromatin fragments were 300–500 bp. Co-occupancy and co-complex recovery do not establish
    purified binary affinity or base-resolution direct DNA contact.
  - Separate human FOXG1/TLE1/TLE2 shRNAs support repression-associated control of p21 and BTIC proliferation.
    Human GRG6 overexpression antagonizes the complex; tagged U87MG GRG6/FOXG1 co-IP is a separate assay.
  - Human GBM-derived cells and mouse xenografts must remain distinct; cancer-cell propagation is not
    a new general developmental annotation.
- pmid: '21280142'
  doi: 10.1002/humu.21422
  public_url: https://onlinelibrary.wiley.com/doi/pdfdirect/10.1002/humu.21422
  access: Original publisher10-page PDF text accessed with the web reader; selected Methods/Results and
    Figures3–4 captions read. Ordinary direct PDF download returned 403, so no local PDF or pixel inspection
    is claimed. Exact returned text is retained as tool extraction, not a reconstructed article.
