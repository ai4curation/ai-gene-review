  - Methods E2028–E2030, PDF pages 2–4, tool lines 108–187
  - Results E2032–E2033, PDF pages 6–7, lines 225–264; Figures 3 and 4 captions
  selected_findings:
  - The human BC035020/IMAGE 4823883 ORF was cloned as an N-terminal EGFP fusion; the reported codon 82
    Pro-to-Arg difference was reversed before generating R244C, and constructs were sequence-checked.
    This does not establish exact equality to current P55316 or a natural alternative product.
  - Transfected HeLa and DAOY cells show dispersed nuclear WT signal excluding nucleoli; R244C forms foci
    partly overlapping SC35. Mutant speckles do not establish a normal FOXG1 speckle function.
  - Retinoic-acid-treated human SH-SY5Y cells were transfected, GFP-sorted and assayed for CDKN1A mRNA
    by qRT-PCR normalized to HPRT. The WT decrease is reported as data not shown; Figure 4 compares mutant
    and WT.
  - These are localization and expression endpoints, not a direct DNA-binding assay or proof of altered
    splicing.
