description: FOXG1 is a nuclear forkhead transcription factor that recognizes DNA sequence motifs and
  regulates gene expression through interactions with transcriptional corepressors, including TLE proteins
  and KDM5B. It helps coordinate the development of the telencephalon, and disruption of human FOXG1 causes
  a severe neurodevelopmental disorder. Its effects on target-gene expression depend on the cellular context
  and recruited partners.
core_functions:
- description: Sequence-specific regulation of RNA polymerase II transcription. Human FOXG1 supports repression-associated
    regulation through PLU-1/KDM5B and TLE partners; endogenous promoter association and perturbation
    evidence complement motif-selection and engineered reporter assays without making the individual assays
    interchangeable.
  molecular_function:
    id: GO:0000981
    label: DNA-binding transcription factor activity, RNA polymerase II-specific
  directly_involved_in:
  - id: GO:0006357
    label: regulation of transcription by RNA polymerase II
  locations:
