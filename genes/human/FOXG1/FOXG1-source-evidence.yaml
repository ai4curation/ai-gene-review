  original_xml_url: https://www.ebi.ac.uk/europepmc/webservices/rest/PMC3984242/fullTextXML
  access: Authentic original full XML recovered; selected Results, Methods and Figure 6–8 captions read.
    Figure pixels and supplementary data not independently inspected. Ordinary PMC HTML returned a browser
    challenge, retained separately.
  locators:
