core_functions:
- description: 'Collagen-activated receptor tyrosine kinase: the discoidin domain of plasma-membrane DDR1
    dimers binds native triple-helical fibrillar collagens (I-III) and collagen IV, triggering slow, sustained
    autophosphorylation that creates docking sites for SH2/PTB signalling proteins and initiates collagen-activated
    signalling.'
  molecular_function:
    id: GO:0038062
    label: protein tyrosine kinase collagen receptor activity
  locations:
  - id: GO:0005886
    label: plasma membrane
  directly_involved_in:
  - id: GO:0038063
    label: collagen-activated tyrosine kinase receptor signaling pathway
  supported_by:
  - reference_id: PMID:9659899
    supporting_text: Here, we show that the mammalian DDR receptors bind and are activated by specific
      types of collagen.
  - reference_id: PMID:21044884
    supporting_text: Triple-helical peptides containing the GVMGFO motif induced DDR1 transmembrane signalling
  - reference_id: PMID:21044884
    supporting_text: the basement membrane collagen IV being exclusively recognised by DDR1
suggested_questions:
- question: What DDR1 data in PMID:23382219 underlie the MGI IDA for signaling receptor complex, given
    that the study addresses PX-FERM binding to NPxY sorting motifs rather than receptor complex membership?
- question: Do DDR1a and DDR1b differ in which collagen-induced outputs they drive, given that only DDR1b
    carries the ShcA docking site?
suggested_experiments:
- description: Compare collagen I- versus collagen IV-induced DDR1 phosphorylation sites and adaptor recruitment
    in epithelial cells expressing DDR1a or DDR1b only, by quantitative phosphoproteomics.
