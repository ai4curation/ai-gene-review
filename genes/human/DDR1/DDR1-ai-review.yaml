id: Q08345
gene_symbol: DDR1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: DDR1 (discoidin domain receptor 1) is a single-pass type I receptor tyrosine kinase that
  is activated by native triple-helical collagen. Its N-terminal discoidin domain binds the GVMGFO motif
  of fibrillar collagens I-III and, unlike its paralog DDR2, also recognises basement-membrane collagen
  IV. DDR1 exists as ligand-independent dimers at the plasma membrane; collagen binding induces slow,
  sustained autophosphorylation of cytoplasmic tyrosines that recruit SH2- and PTB-domain signalling proteins
  such as ShcA (in the DDR1b splice form), Nck2 and SHP-2. DDR1 is expressed mainly in epithelial cells
  and regulates cell adhesion to collagen, migration, matrix-metalloproteinase expression and survival.
  Mouse knockouts show defects in mammary gland morphogenesis and lactation, blastocyst implantation and
  body size, and DDR1 is overexpressed in several carcinomas.
