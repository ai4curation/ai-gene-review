id: Q8NB46
gene_symbol: ANKRD52
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ANKRD52 (ankyrin repeat domain-containing 52; PP6-ARS-C) is one of three alternative ankyrin-repeat
  subunits of protein phosphatase 6, associating with PPP6C through a SAPS-domain subunit such as PPP6R1.
  The ANKRD52-PPP6C complex dephosphorylates Argonaute 2 after CK1alpha phosphorylates it on target engagement;
  this phosphorylation cycle resets AGO2 and keeps miRNA-mediated silencing efficient, and ANKRD52 loss
  derepresses miRNA targets. Unlike ANKRD28 and ANKRD44, it is not needed for PP6 function in mitosis.
  It is mainly cytoplasmic. ANKRD52 inactivation in tumours blunts interferon-gamma signaling by relieving
  miR-155 repression of SOCS1.
