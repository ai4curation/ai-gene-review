  title: An Argonaute phosphorylation cycle promotes microRNA-mediated silencing.
  findings:
  - statement: ANKRD52-PPP6C dephosphorylates AGO2.
    supporting_text: These experiments revealed that the ANKRD52-PPP6C phosphatase complex performs a
      critical function in the miRNA pathway by dephosphorylating a set of highly conserved amino acids
      in AGO2.
  - statement: ANKRD52 loss raises AGO2 phosphorylation.
    supporting_text: Deficiency of ANKRD52 or PPP6C in multiple human cell lines similarly led to accumulation
      of phosphorylated AGO2
  - statement: ANKRD52 knockout derepresses miRNA targets.
    supporting_text: Additional miRNA reporter constructs and endogenous let-7 targets22-24 were also
      de-repressed by ANKRD52 knockout
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text; genome-wide CRISPR screen and mechanistic follow-up. Defines ANKRD52's best-characterized
      function.
- id: PMID:21187329
  title: Protein phosphatase 6 regulates mitotic spindle formation by controlling the T-loop phosphorylation
    state of Aurora A bound to its activator TPX2.
  findings:
  - statement: ANKRD52 is not required for PP6 function in mitosis.
    supporting_text: The results presented here suggest that the ANKRD28 and 44 subunits are required
      for PP6 function in mitosis, whereas ANKRD52 is not.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text; distinguishes ANKRD52 from ANKRD28 and ANKRD44.
- id: PMID:34853298
  title: Tumor evolution selectively inactivates the core microRNA machinery for immune evasion.
  findings:
  - statement: ANKRD52 mutations dampen interferon-gamma signaling via miR-155/SOCS1.
    supporting_text: Genetic inactivation of the machinery or re-introduction of ANKRD52 frequent patient
      mutations dampens the JAK-STAT-interferon-γ signaling and antigen presentation in cancer cells,
      largely by abolishing miR-155-targeted silencing of suppressor of cytokine signaling 1 (SOCS1).
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text; tumour immune evasion through the miRNA machinery. No separate GO term drawn.
