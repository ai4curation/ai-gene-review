      The appropriate specificity is L-valine catabolism: ACAD8 directly dehydrogenates its isobutyryl-CoA
      intermediate. The lipid-metabolism term is broad rather than evidence of a separate straight-chain
      fatty-acid beta-oxidation role. This is a pathway-specific refinement based on later human
