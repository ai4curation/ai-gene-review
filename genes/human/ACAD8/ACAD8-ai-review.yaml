core_functions:
- description: Catalyzes FAD-dependent oxidation of isobutyryl-CoA to methacrylyl-CoA in the mitochondrial
    matrix, transferring electrons to electron-transfer flavoprotein during L-valine degradation.
    The mature enzyme functions as a homotetramer. Lower-efficiency alternate-substrate reactions
    do not establish an additional physiological pathway.
