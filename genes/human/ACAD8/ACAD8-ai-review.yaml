id: Q9UKU7
gene_symbol: ACAD8
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ACAD8 encodes mitochondrial isobutyryl-CoA dehydrogenase, a homotetrameric FAD-dependent
  enzyme that converts isobutyryl-CoA to methacrylyl-CoA during L-valine degradation. Electrons
  pass through the bound flavin to electron-transfer flavoprotein. Purified human enzyme also oxidizes
  (S)-2-methylbutyryl-CoA and propionyl-CoA, with lower catalytic efficiencies than for isobutyryl-CoA.
  The mature protein functions in the mitochondrial matrix following import of its precursor. Loss
  of ACAD8 activity causes isobutyryl-CoA dehydrogenase deficiency, associated with impaired valine
  oxidation and accumulation of C4 acylcarnitine and isobutyrylglycine.
