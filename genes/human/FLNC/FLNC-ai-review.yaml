  review:
    summary: FLNC peptides bind the ABL1 SH3-domain construct in an in-vitro array assay.
    action: MODIFY
    reason: MODIFY to SH3 domain binding (GO:0017124). Two exact positive PMID:17474147 IntAct records
      identify in-vitro peptide-array binding of human ABL1 residues 61-121 to FLNC peptides 260-273 and
      1749-1762. Official UniProt identifies the ABL1 construct region as its SH3 domain. Thus the existing
      measured peptide/domain interaction supports this specific binding class; it does not establish
      an endogenous full-length FLNC-ABL1 complex or FLNC kinase activity. The original abstract verifies
      the domain-peptide screening strategy but does not individually enumerate ABL1 in its protein list,
      so the exact pair/construct evidence remains attributed to IntAct. The reported validation rate
      for PLCgamma1 interactions is not transferred to this pair, and no natural-product-specific affinity
      is inferred. The tested 1749-1762 peptide falls within the annotated 1734-1766 deletion of Q14315-2,
      whereas the separately positive 260-273 peptide is outside that deletion. This sequence difference
      is not a demonstration that the full-length second product loses all binding.
    proposed_replacement_terms:
    - id: GO:0017124
      label: SH3 domain binding
    supported_by:
    - reference_id: PMID:17474147
