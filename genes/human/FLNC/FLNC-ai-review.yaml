  review:
    summary: Human FLNC fragments bind the Z-disc cytoskeletal component myotilin in biochemical and yeast
      assays.
    action: MODIFY
    reason: PMID:11038172 recombinant-fragment reciprocal immunoprecipitation and yeast assays establish
      the human FLNC–myotilin interaction. In the same primary work myotilin targets developing/mature
      Z-discs and its truncated fragment disrupts myofibrillar organization; official UniProt independently
      identifies it as a component of an actin cross-linking protein complex. This establishes the partner
      cytoskeletal-component class beyond a name or mere coincident localization. Refine the existing
      assertion to cytoskeletal protein binding without transferring myotilin function to FLNC or claiming
      a minimal isolated repeat-20 interface; the original autoactivation and construct/product limits
      remain. The developmental localization and myotilin-fragment perturbation experiments used mouse
      C2C12 host cells, separate from the recombinant human binding assay.
    proposed_replacement_terms:
    - id: GO:0008092
      label: cytoskeletal protein binding
    supported_by:
    - reference_id: PMID:11038172
    - reference_id: file:human/FLNC/FLNC-source-evidence.md
