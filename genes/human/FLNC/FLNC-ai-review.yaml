id: Q14315
gene_symbol: FLNC
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Filamin C is an actin-associated structural protein concentrated in striated muscle. Its
  actin-binding region and immunoglobulin-like repeats support cytoskeletal organization and contacts
  with muscle Z-disc and membrane-associated proteins, including myotilin, FATZ proteins, Xin and integrins.
  These interactions contribute to sarcomeric and costameric architecture and the connection of the contractile
  apparatus to the sarcolemma. Additional cytosolic and focal-adhesion pools occur in specific cellular
  contexts.
