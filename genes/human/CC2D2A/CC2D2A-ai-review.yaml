  review:
    action: ACCEPT
    summary: CC2D2A makes a structural contribution to cilium assembly.
    reason: Mouse loss-of-function disrupts subdistal appendages, microtubule anchoring and axoneme formation,
      while mother centrioles and selected proximal markers persist. A mouse Cc2d2a transgene rescues
      axoneme formation, and immuno-EM places the protein at the affected structure. Together these data
      support structural participation, beyond a disease association or necessity phenotype alone. This
      remains a mouse-derived human transfer.
