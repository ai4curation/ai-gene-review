  review:
    action: KEEP_AS_NON_CORE
    summary: CC2D2A is needed for Hedgehog signalling because it gates Smoothened entry into the cilium,
      not because it transduces the signal.
    reason: Mouse Cc2d2a is the 1:1 ortholog in the same PANTHER subfamily (PTHR20837:SF7). Cc2d2a-/- MEFs
      show strongly reduced ciliary Smoothened after SAG stimulation, and null embryos lose Shh-dependent
      ventral neural-tube fates. The contribution operates through transition-zone control of ciliary membrane
      composition. Gating Smoothened access is a real input into the pathway, so the term is not wrong,
      but CC2D2A has no ligand, receptor, kinase or transcription-factor role. Kept as non-core; it is
      not part of the core function.
    supported_by:
