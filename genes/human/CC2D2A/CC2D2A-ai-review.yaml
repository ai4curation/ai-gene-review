  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q8CFW7
  - ensembl:ENSMUSP00000048320
  review:
    action: ACCEPT
    summary: CC2D2A supports cilia-dependent Smoothened/Hedgehog signaling.
    reason: Cc2d2a-deficient mouse embryos show disrupted ventral neural patterning and Shh responses
      in association with defective cilia. This is participation through ciliary organization, not ligand
      or receptor activity.
    supported_by: &id002
    - reference_id: PMID:24947469
      supporting_text: the neural tube patterning defect of Cc2d2a-/- embryos mostly affects ventral cell
        fates, consistent with a perturbation of Shh signaling
    - &id005
      reference_id: PMID:24947469
      supporting_text: The mouse Cc2d2a transgene could rescue the axoneme assembly defect in Cc2d2a-/-
        MEFs
