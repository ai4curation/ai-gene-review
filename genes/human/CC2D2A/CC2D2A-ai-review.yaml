- term:
    id: GO:0060271
    label: cilium assembly
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q8CFW7
  - ensembl:ENSMUSP00000048320
  review:
    action: ACCEPT
    summary: CC2D2A does structural work in early ciliogenesis at the mother centriole; core process.
    reason: CC2D2A passes the participation test, not only the necessity test. The endogenous protein
      sits on the subdistal appendages it is needed to build (immunogold), loss abolishes subdistal appendage
      assembly, microtubule anchoring, vesicle docking and transition-zone elaboration while the mother
      centriole persists, and a Cc2d2a transgene rescues axoneme assembly. The requirement is tissue-dependent.
      Some Cc2d2a-/- MEFs in one study, and zebrafish photoreceptors, still form cilia. That is why the
      general term (which covers both motile nodal/tracheal and primary cilia) is correct here, alongside
      the more specific IBA non-motile cilium assembly.
    supported_by:
    - reference_id: PMID:24947469
      supporting_text: rescue the axoneme assembly defect
    - reference_id: PMID:24947469
      supporting_text: We therefore conclude that CC2D2A is needed for the assembly of SDA at mother centriole,
        for stable MT anchoring and docking of transport vesicles, and for further elaboration of the transition
        zone.
    - reference_id: PMID:21725307
      supporting_text: Thus, Cc2d2a shares tissue-specific ciliogenic functions with Tctn1 and Tctn2.
