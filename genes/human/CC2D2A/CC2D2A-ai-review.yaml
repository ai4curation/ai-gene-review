gene_symbol: CC2D2A
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CC2D2A (coiled-coil and C2 domain-containing protein 2A, also called MKS6) is a large
  (1,620 residues) non-catalytic structural protein of the ciliary base. It carries an N-terminal
  disordered region, central coiled coils, a CC2D2AN-C2 module, a transglutaminase-like (TGL) peptidase
  fold whose catalytic residues are lost throughout the CC2D2A clade, and a C2 domain. CC2D2A is a
  core subunit of the MKS/Tectonic module of the ciliary transition zone, together with TCTN1-3, MKS1,
  B9D1, B9D2, TMEM216, TMEM231 and TMEM67, and also concentrates at the basal body and the subdistal
  appendages of the mother centriole. Its localization at the transition zone and that of B9D1 and
  TMEM231 are mutually dependent. Loss of the protein impairs subdistal-appendage assembly, microtubule
  anchoring and docking of ciliary vesicles at the mother centriole, causing tissue-dependent failure
  of axoneme extension. Where cilia still form, it is required for the ciliary membrane to retain its
  distinctive composition (for example Arl13b, adenylyl cyclase 3, Pkd2 and Smoothened) and for normal
  Hedgehog signalling. In photoreceptors it sits at the connecting cilium and is needed for fusion of
  opsin-carrier vesicles at the periciliary membrane. It interacts with CEP290 and with NINL, which
  links it to RAB8-MICAL3 vesicle docking. Biallelic loss-of-function variants cause Meckel syndrome
  6, Joubert syndrome 9, COACH syndrome 2 and retinitis pigmentosa 93.
