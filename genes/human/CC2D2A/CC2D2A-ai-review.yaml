id: Q9P2K1
gene_symbol: CC2D2A
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CC2D2A is a large coiled-coil and C2-domain-containing protein of the ciliary base and transition-zone
  machinery. It contributes to the organization of the mother-centriole appendages and the MKS-associated
  protein assembly that establishes ciliary membrane composition. Its structural role supports axoneme
  formation and recruitment of proteins to the ciliary base. Defects in this organization disturb cilia-dependent
  signaling and development, producing the Joubert and Meckel ciliopathy spectrum.
