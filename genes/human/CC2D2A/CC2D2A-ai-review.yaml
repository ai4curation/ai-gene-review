        with the Hh pathway agonist SAG, an effect that was even stronger in Cc2d2a−/− MEFs
    - reference_id: PMID:24947469
      supporting_text: Thus, the neural tube patterning defect of Cc2d2a-/- embryos mostly affects ventral
        cell fates, consistent with a perturbation of Shh signaling.
