id: Q9P2K1
gene_symbol: CC2D2A
product_type: PROTEIN
status: IN_PROGRESS
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CC2D2A is a coiled-coil and C2-domain-containing component of the MKS ciliary transition-zone
  machinery. It organizes the ciliary base and helps recruit or retain proteins needed for axoneme formation
  and the ciliary membrane barrier. Its role in ciliogenesis supports Hedgehog signaling and normal embryonic
  patterning; pathogenic variants cause ciliopathies including Joubert and Meckel syndromes.
