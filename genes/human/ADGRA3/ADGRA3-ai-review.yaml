- term:
    id: GO:0004930
    label: G protein-coupled receptor activity
  evidence_type: TAS
  original_reference_id: PMID:15203201
  qualifier: enables
  review:
    summary: 'Right conclusion, weak provenance - kept because the conclusion has since been earned.


      This is a 2004 GDB annotation citing a bioinformatic repertoire paper. Its basis for calling GPR125
      a G protein-coupled receptor is sequence classification into the 33-member human adhesion GPCR family;
      no coupling assay appears anywhere in it, so as a Traceable Author Statement it traces to an inference
      rather than to a measurement. That is precisely the pattern this campaign is calibrated to distrust.


      The distrust is not warranted here, because the inference has since been tested and confirmed: ADGRA3
      activates Gi and Gs in human cell lines, and abolishing the stachel tethered agonist abolishes it.
      Accepted, with the recommendation that GOA re-evidence the term as IDA against PMID:40127866 rather
      than leaving a demonstrated molecular function resting on a TAS to a catalogue paper.'
    action: ACCEPT
    reason: Term is correct and now experimentally demonstrated; only the evidence provenance (TAS to
      a sequence-catalogue paper) is inadequate, and that is a re-evidencing recommendation, not a term
      error.
    supported_by:
    - reference_id: PMID:15203201
      supporting_text: The adhesion G-protein-coupled receptors (GPCRs) (also termed LN-7TM or EGF-7TM
        receptors) are membrane-bound proteins with long N-termini containing multiple domains.
      full_text_unavailable: true
