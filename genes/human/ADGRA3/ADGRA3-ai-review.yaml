      spindles are randomised relative to the apical-basal axis instead of lying perpendicular to it;
      siRNA knockdown of GPR125 or of Dlg1 reproduces the multilumen phenotype. That establishes the process
      for the gene product that was removed - endogenous canine Gpr125 (the nearest UniProt entity is
      the unreviewed TrEMBL entry A0A8I3MZC6, 1313 aa; there is no reviewed dog entry).


