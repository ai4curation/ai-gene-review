  review:
    summary: 'Correct, well founded on both sides of the propagation, and corroborated directly in human
      cells.


      The WITH/FROM field resolves to five gene products and one node: MGI:MGI:1917943 is mouse Adgra3
      (Q7TT36, Swiss-Prot) - the 1:1 orthologue; MGI:MGI:1925810 is mouse Adgra2 (Q91ZV8, Swiss-Prot);
      UniProtKB:Q96PE1 is human ADGRA2; ZFIN:ZDB-GENE-131003-2 is zebrafish adgra3 (S4X0Q8, Swiss-Prot);
      and ZFIN:ZDB-GENE-081104-363 is zebrafish adgra2 (E7FBY6 / AGRA2_DANRE, Swiss-Prot, 1367 aa). All
      five are reviewed entries. Worth recording as a resolver limit: UniProt''s xref:zfin- index returns
      only the unreviewed A0A0U2ULT4 / A0A8M1P7B9 for that ZFIN gene id and misses E7FBY6 entirely, so
      a lookup through that index alone would wrongly report the source as TrEMBL-only.


      Asking what those donors themselves carry for this term (QuickGO, goUsage=descendants) shows the
      propagation is not circular: human ADGRA2 has three EXP annotations plus an IDA, mouse Adgra2 has
      an EXP and an IDA, and zebrafish adgra3 has its own IDA from PMID:23821037. So real experimental
      plasma-membrane evidence exists in the clade.


      Independently of the propagation, human ADGRA3 itself is demonstrably a cell-surface protein: an
      N-terminally FLAG-tagged construct is detected at the surface of non-permeabilised HEK293 cells
      and internalises constitutively from there. The term is core: everything ADGRA3 is known to do -
      G protein coupling, PDZ-motif scaffolding, autoproteolysis-dependent maturation - happens at this
      membrane.'
    action: ACCEPT
    reason: Every non-node donor is a reviewed ADGRA family member and four of them carry their own EXP/IDA
      evidence for this term; human ADGRA3 is independently shown at the cell surface in HEK293 cells.
