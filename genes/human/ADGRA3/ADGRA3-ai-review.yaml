  review:
    summary: 'The biological-process twin of the GO:0004888 row, and resolved the same way for the same
      reason.


      IPR017981 supplies this gene three terms - GO:0004888, GO:0007166 and GO:0016020 - and two of them,
      this one and GO:0004888, are ancestors of terms the gene also holds from IPR000832. An earlier draft
      of this review modified GO:0004888 downward while accepting this row, which is opposite reasoning
      applied to one situation; that inconsistency was raised in review and is resolved here by accepting
      both.


      Why ACCEPT and not MODIFY-for-redundancy. IPR017981 is a **7TM-domain** signature, and a seven-transmembrane
      bundle on its own cannot tell you the receptor couples to a heterotrimeric G protein - many 7TM
      proteins do not. InterPro''s mapping to the non-committal parents GO:0004888 and GO:0007166 is therefore
      the most this signature can honestly support, not a curator stopping short. The specific children
      GO:0004930 and GO:0007186 arrive from a different and more specific signature, IPR000832 (GPCR family
      2, secretin-like), which does support them. Modifying a correctly-conservative signature mapping
      downward would be attributing to it evidence it does not carry.


      This is the discriminator applied throughout this review: a general term is ACCEPTed when it is
      the most its own source can support, and MODIFIED when the specific term is established for this
      gene and the general row merely restates a compartment or activity now known precisely. The three
      GO:0016020 rows fall on the other side of that line - they are superseded statements about where
      this protein is, and the ISS one additionally sits above the very donor it was drawn from.


      Accepting this row also keeps it consistent with the IBA row carrying the same term, where GO:0007166
      is the genuine least common ancestor of a clade spanning ADGRA1''s synaptic biology, ADGRA2''s Wnt
      biology and ADGRA3''s G protein coupling. Same term, same action, two independently sufficient reasons.'
