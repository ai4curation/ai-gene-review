      Human GPR125 carrying an N-terminal FLAG tag is quantified at the surface of non-permeabilised HEK293
      cells by ELISA, then shown to disappear from the surface over 30 min at 37 degrees and to appear
      in intracellular puncta that moderately overlap GFP-TfR1. Internalisation is unaffected in beta-arrestin-1/2
      double-knockout cells and proceeds to the same extent as agonist-driven internalisation of the control
      receptor GPR183. The authors'' conclusion is that this constitutive retrieval sets the receptor''s
      surface level, which matters here because surface level is what gates every other function ADGRA3
      has - G protein coupling and PDZ-scaffold engagement both happen at the plasma membrane.


      Two term choices were tested against their definitions rather than their labels. GO:0072583 clathrin-dependent
      endocytosis was rejected: in human it is annotated to 19 gene products and every one is endocytic
      machinery - AP2 subunits, FCHO1/2, PICALM, SGIP1, SNAP91, HSPA8 - so placing a cargo receptor there
      would be role conflation. GO:0031623 is the term GO actually uses for internalised receptors, including
      cargo: TFRC itself holds it involved_in by IDA, and TFRC is the constitutively recycling receptor
      used as the marker in this very experiment.


      One caveat is recorded rather than smoothed over. GO:0031623''s definition states that the process
      ''begins when cell surface receptors are monoubiquitinated following ligand-induced activation'',
      and ADGRA3''s internalisation is neither ligand-induced nor beta-arrestin-dependent. GO''s curated
      usage is plainly broader than that definition - TFRC is the proof - but the mismatch is real and
      is raised as an ontology point in suggested_questions.'
