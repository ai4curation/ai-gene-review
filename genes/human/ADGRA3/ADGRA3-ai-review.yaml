core_functions:
- description: Adhesion G protein-coupled receptor at the plasma membrane that self-cleaves within its
    GAIN domain during biosynthesis and thereby exposes an N-terminal stachel tethered agonist on the
    C-terminal fragment, through which it activates heterotrimeric Gs and Gi. Signalling is constitutive
    in the absence of any identified external ligand, is abolished by removing the first three residues
    of the C-terminal fragment, and persists in cells lacking all three Dishevelled paralogues, so it
    is a genuine G protein pathway rather than a Wnt/planar-cell-polarity readout. Surface levels are
    set by constitutive, beta-arrestin-independent, clathrin-dependent internalisation.
