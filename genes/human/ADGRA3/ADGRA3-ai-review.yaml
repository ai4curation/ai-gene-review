- question: 'PAINT node placement, and it is the reciprocal of the question this family invites. PANTHER
    node PTN002914494 has a reach of exactly the three ADGRA3 orthologues - human ADGRA3, mouse Adgra3,
    zebrafish adgra3 - and the single term it propagates to them is GO:0009897 external side of plasma
    membrane. Yet one member of that very node, zebrafish adgra3, carries GO:0060071 Wnt signaling pathway
    planar cell polarity pathway by IDA and GO:2000095 by IMP and IPI from PMID:23821037, and neither
    term reaches human or mouse. The terms are not IBA-ineligible: QuickGO returns 70 IBA annotations
    to GO:0060071 and 36 to GO:2000095 across many taxa, including human. Meanwhile the ADGRA2-only node
    PTN002914520 and the ADGRA1-only node PTN002914505 both do propagate their members'' specific biology
    (sprouting angiogenesis, Wnt signalosome assembly and positive regulation of canonical Wnt signalling
    for ADGRA2; postsynaptic density and glutamatergic synapse for ADGRA1). Is the ADGRA3 node''s silence
    a deliberate judgement that gastrulation PCP is fish-specific, or a coverage gap? If deliberate, an
    IRD or a recorded note would make it legible; if not, it is the one place in this family where PAINT
    under-transfers.'
  experts:
  - GO Central PAINT curators
- question: Family-wide ontology and curation gap. GAIN-domain cis-autoproteolysis is the defining biochemical
    feature of the adhesion GPCR class, and it is what liberates the stachel tethered agonist that these
    receptors signal through. A QuickGO census of GO:0016540 protein autoprocessing and its descendants
    in human returns 68 annotations over 36 gene products - caspases, hedgehog ligands, MYRF, PCSK9, SPRTN
    and so on - and not a single adhesion GPCR, although cleavage has been demonstrated for many of the
    33 human members. Is GO:0016540 the intended term for GAIN autoproteolysis, or is a dedicated child
    needed? Either way the class appears to be systematically unannotated for its own hallmark reaction.
  experts:
  - GO ontology editors
  - adhesion GPCR consortium (IUPHAR)
- question: 'Ontology definition versus curated usage on GO:0031623 receptor internalization. Its definition
    states that the process ''begins when cell surface receptors are monoubiquitinated following ligand-induced
    activation'', yet the term is curated onto receptors whose internalisation is constitutive and ligand-independent
