  review:
    summary: 'A real, replicated, functionally consequential interaction recorded under an uninformative
      term.


      PMID:24550280 is proteomic peptide-phage display: libraries of all human C-terminal peptides were
      screened against nine PDZ domains including those of DLG1. The ADGRA3 hit is therefore, by construction,
      a PDZ-domain/PDZ-binding-motif interaction - ADGRA3''s C-terminus is Glu-Thr-Thr-Val (1318-1321),
      the class I PBM that UniProt annotates as MOTIF 1319..1321.


      Unlike the other seventeen partners, DLG1 is corroborated well beyond peptide affinity. It was found
      by direct binding to the bacterially expressed GPR125 C-terminal tail in 2004 (the paper''s ''TEM5-like
      protein'' is ADGRA3, alongside TEM5 = ADGRA2), it co-immunoprecipitates with full-length GPR125
      from HEK293 cells, endogenous Dlg1 co-precipitates with GPR125 in MDCK cells, and both are lost
      when the ETTV tetrapeptide is deleted. IntAct records five evidences over three publications and
      four methods for this pair, against a single method for every other partner.


      Bare ''protein binding'' is uninformative; the informative term is GO:0030165, and it is exactly
      what was measured. Retain the partner machine-readably via the has_input extension.'
    action: MODIFY
    reason: 'Bare protein binding replaced by the specific, measured activity: this is a PDZ-domain/PBM
      interaction, and DLG1 is the one partner with independent cellular corroboration.'
