description: ADGRA3 (GPR125) is a 1321-residue adhesion G protein-coupled receptor of the ADGRA subfamily,
  built from a cleaved signal peptide, a large extracellular region containing four leucine-rich repeats,
  two immunoglobulin domains and a hormone-binding domain followed by a GAIN domain, a canonical seven-pass
  transmembrane bundle, and a cytoplasmic tail ending in the class I PDZ-binding motif Glu-Thr-Thr-Val.
  Despite an atypical GPCR proteolysis site (Ser-Leu-Ser rather than the canonical His-Leu/Ile-Ser/Thr),
  the receptor self-cleaves within the GAIN domain early in biosynthesis into N- and C-terminal fragments
  that remain associated; this exposes a stachel tethered agonist at the new N-terminus of the C-terminal
  fragment. Through it the receptor activates both Gs and Gi, constitutively and without any identified
  external ligand, and abolishing the first three residues of the tethered agonist abolishes signalling.
  The receptor reaches the cell surface with its ectodomain exposed and is continuously retrieved by beta-arrestin-independent,
  clathrin-dependent endocytosis. In polarised epithelium the C-terminal motif binds the PDZ domains of
  DLG1 and confines the receptor to the basolateral membrane, where it is required for correct mitotic
  spindle orientation and single-lumen morphogenesis; the same motif binds the PDZ domains of many other
  scaffolds in quantitative affinity assays. The zebrafish orthologue recruits Dishevelled and modulates
  planar cell polarity during gastrulation, although human ADGRA3 does not engage beta-catenin-dependent
  Wnt signalling and its G protein output is Dishevelled-independent. ADGRA3 is a marker of spermatogonial
  progenitor cells, and mice lacking it develop obstructive azoospermia or imperforate vagina; in adipocytes
  its constitutive Gs-PKA-CREB activity drives a thermogenic programme, and it also promotes osteoclast
  differentiation. Its endogenous ligand is unknown.
