- term:
    id: GO:0004888
    label: transmembrane signaling receptor activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR017981
  review:
    summary: 'Correct, and correctly cautious for the signature it comes from.


      IPR017981 is ''GPCR, family 2-like, 7TM'' and InterPro maps it to GO:0004888, GO:0007166 and GO:0016020.
      GO:0004888 transmembrane signaling receptor activity is a direct ancestor of GO:0004930 G protein-coupled
      receptor activity, which is separately annotated to ADGRA3 from IPR000832/IPR001879/IPR036445 and
      from a TAS row - and which has since been demonstrated experimentally, with ADGRA3 activating both
      Gi and Gs in human cell lines and losing that activity when the first three residues of the stachel
      tethered agonist are removed.


      GO:0004888 transmembrane signaling receptor activity is a direct ancestor of GO:0004930 G protein-coupled
      receptor activity, which this gene also holds - so the row is redundant in the GO record. Redundancy
      is not error, though, and it is worth being precise about which of the two is the defect.


      Why ACCEPT and not MODIFY-for-redundancy. IPR017981 is a **7TM-domain** signature, and a seven-transmembrane
      bundle on its own cannot tell you the receptor couples to a heterotrimeric G protein - many 7TM
      proteins do not. InterPro''s mapping to the non-committal parents GO:0004888 and GO:0007166 is therefore
      the most this signature can honestly support, not a curator stopping short. The specific children
      GO:0004930 and GO:0007186 arrive from a different and more specific signature, IPR000832 (GPCR family
      2, secretin-like), which does support them. Modifying a correctly-conservative signature mapping
      downward would be attributing to it evidence it does not carry.


      This is the discriminator applied throughout this review: a general term is ACCEPTed when it is
      the most its own source can support, and MODIFIED when the specific term is established for this
      gene and the general row merely restates a compartment or activity now known precisely. The three
      GO:0016020 rows fall on the other side of that line - they are superseded statements about where
      this protein is, and the ISS one additionally sits above the very donor it was drawn from.'
    action: ACCEPT
    reason: Correct and appropriately scoped to IPR017981, a 7TM-domain signature that cannot by itself
      support G protein coupling; the specific child GO:0004930 comes from the family-level IPR000832
      and is separately annotated. Redundant in the record but not a curation defect. Resolved identically
      to the IEA GO:0007166 row, the other parent this same signature supplies.
    supported_by:
    - reference_id: PMID:40127866
      supporting_text: We found low-level activation of Gi and Gs by ADGRA3 and slightly more by its CTF.
    - reference_id: PMID:40127866
      supporting_text: This resulted in abrogated G protein-mediated signaling, as observed for other
        aGPCRs.
- term:
    id: GO:0004930
    label: G protein-coupled receptor activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR000832
  - InterPro:IPR001879
  - InterPro:IPR036445
  review:
    summary: 'A domain-derived molecular function that has since been confirmed by direct measurement
      - the case where the fold-propagation suspicion is simply wrong.


      The three signatures are IPR000832 (GPCR family 2, secretin-like), IPR001879 (family 2 extracellular
      hormone receptor domain) and IPR036445 (its structural superfamily). Read on their own these are
      architecture, and until 2025 the gene was formally an orphan whose G protein coupling had never
