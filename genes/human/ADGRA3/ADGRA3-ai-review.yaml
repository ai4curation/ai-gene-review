- term:
    id: GO:0007166
    label: cell surface receptor signaling pathway
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN001738137
  - UniProtKB:Q96PE1
  - ZFIN:ZDB-GENE-081104-363
  - ZFIN:ZDB-GENE-131003-2
  review:
    summary: 'The general term is the right call here, and I checked the case for refining it and rejected
      it.


      Node PANTHER:PTN001738137 reaches all eight reviewed members of PTHR45930 - ADGRA1, ADGRA2 and ADGRA3
      in human and mouse, plus adgra2 and adgra3 in zebrafish, which has no adgra1 in the family - so
      it is the family-root node. Its three named seeds all carry experimental evidence for descendants
      of this term, but for *different* descendants: human ADGRA2 and zebrafish adgra2 have GO:0060070
      canonical Wnt signalling by IDA, while zebrafish adgra3 has GO:0060071 Wnt/planar-cell-polarity
      by IDA. The least common ancestor of just those two is GO:0016055 Wnt signaling pathway, one level
      below the term actually used, so a granularity objection is available.


      It does not hold. The node''s reach includes ADGRA1, whose only experimental biology is postsynaptic
      (GO:0014069, GO:0098978 at the ADGRA1-only node PTN002914505) with no Wnt evidence at all, so the
      clade is heterogeneous and GO:0016055 is not its LCA. More decisively, refining to a Wnt term would
      assert of human ADGRA3 something its own data declines to support: in HEK293 cells ADGRA3 produced
      no beta-catenin/TCF-LEF transcriptional response, and its G protein signalling persists in DVL1-3-null
      cells. GO:0007166 is therefore the correct conservative ancestor, not lazy curation.


      It is also now true for a reason PAINT could not have used in 2018: ADGRA3 has since been shown
      to be a genuine G protein-coupled receptor, and GO:0007186 - already on this gene from InterPro
      and GDB - is the descendant that its own experiments establish.'
    action: ACCEPT
    reason: Donor set is functionally heterogeneous (ADGRA1 synaptic, ADGRA2 canonical Wnt, zebrafish
      adgra3 Wnt/PCP), so GO:0007166 is the genuine LCA; and the target's own data argue against the Wnt
      refinement.
    supported_by:
    - reference_id: PMID:40127866
      supporting_text: No transcriptional activation was observed in an assay of downstream β-catenin
        activity.
    - reference_id: PMID:40127866
      supporting_text: Collectively, this suggests that ADGRA3 is capable of activating Gai signaling
        axes independently of DVL presence.
    - reference_id: PMID:40127866
      supporting_text: Collectively, this establishes classical G protein-mediated signaling for ADGRA3.
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN001738137
        source_label: PANTHER ancestral tree node, not a gene product; family-root node reaching all eight
          reviewed members (ADGRA1/2/3 in human and mouse, adgra2 and adgra3 in zebrafish), which is why
          the term sits at this generality
        source_status: NOT_RELEVANT
      - source_id: UniProtKB:Q96PE1
        source_label: human ADGRA2/GPR124 (reviewed/Swiss-Prot) - a paralogue; carries IDA to the descendant
          term GO:0060070 canonical Wnt signalling from PMID:30026314
        source_status: SUPPORTS_TRANSFER
      - source_id: ZFIN:ZDB-GENE-081104-363
        source_label: zebrafish adgra2 (UniProtKB E7FBY6 / AGRA2_DANRE, reviewed/Swiss-Prot) - a paralogue;
          carries IDA to the descendant term GO:0060070 from PMID:30026314
        source_status: SUPPORTS_TRANSFER
