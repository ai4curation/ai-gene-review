  review:
    summary: 'A clean single-orthologue transfer that lands on exactly the term its donor holds, with
      independent human corroboration.


      This row comes from a different node than the other two IBAs. PANTHER:PTN002914494 reaches exactly
      the three ADGRA3 orthologues - human ADGRA3, mouse Adgra3, zebrafish adgra3 - and carries only this
      one term. Its sole non-node donor, MGI:MGI:1917943, is mouse Adgra3 (Q7TT36), the true orthologue,
      and QuickGO shows that donor holds GO:0009897 by IDA from PMID:17882221. The propagation therefore
      neither gains nor loses precision relative to its source, which is the ACRV1 failure mode checked
      for and not found here.


      I also ran the reference-projection test on the donor''s paper. PMID:17882221 annotates five entities,
      which is the superficial shape of a complex-projection artefact, but the five are Adgra3, Cd34,
      Pou5f1, Vim and Acta2 and each receives a *different* compartment (GO:0009897 for Adgra3 and Cd34,
      nucleus for Pou5f1, intermediate filament for Vim, actin cytoskeleton for Acta2). No phenotype term
      spreads across the set. This is a marker-panel paper localising five distinct markers, not one finding
      projected onto five genes, so the donor IDA is its own.


      Human corroboration is independent: an N-terminally FLAG-tagged human GPR125 is detected on non-permeabilised
      HEK293 cells, i.e. the large N-terminal ectodomain faces the extracellular space, which is what
      this term asserts.'
    action: ACCEPT
    reason: Sole protein donor is the mouse orthologue and holds the identical term by IDA; the donor's
      paper passes the projection test (five entities, five different compartments, no phenotype spread);
      and human surface exposure of the ectodomain is independently shown.
