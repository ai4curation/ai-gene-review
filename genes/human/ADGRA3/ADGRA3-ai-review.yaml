  review:
    summary: 'One of eighteen partners from a single quantitative PDZ-domain affinity screen; modified
      from bare protein binding to the activity the assay actually measures.


      PMID:36115835 is a holdup assay measuring 65,000 PDZ-domain/PBM affinities. Its ADGRA3 bait is the
      C-terminal peptide, whose last four residues are Glu-Thr-Thr-Val - the class I PDZ-binding motif
      UniProt annotates as MOTIF 1319..1321. Every one of the eighteen partners GOA imported from this
      study is a reviewed Swiss-Prot canonical entry carrying between 2 and 13 PDZ domains, with no TrEMBL
      clone or partial ORFeome construct among them, so there is no partner-identity defect of the kind
      found on ACRV1. What the screen establishes is a property of the motif, not eighteen independent
      discoveries: IntAct holds 117 holdup evidences for ADGRA3 spanning 80 distinct PDZ proteins, of
      which GOA imported these 18.


      GRID2IP carries 2 PDZ domains and is a postsynaptic/neuronal scaffold. Worth flagging: the postsynaptic
      compartment is the characterised territory of the paralogue ADGRA1, which is the family member PAINT
      gives GO:0014069 postsynaptic density and GO:0098978 glutamatergic synapse at the ADGRA1-only node
      PTN002914505. There is no evidence placing ADGRA3 at a synapse. The most economical reading is that
      a class I PBM is recognised by class I PDZ domains regardless of where those scaffolds actually
      reside, which is what a domain-array affinity screen is designed to detect. Real biochemistry, unestablished
      cell biology.


      GO:0030165 PDZ domain binding states what was measured and is true of every row in this block; ''protein
      binding'' states nothing. The partner is preserved machine-readably in the has_input extension rather
      than being discarded by the term change.'
    action: MODIFY
    reason: 'Bare protein binding replaced by GO:0030165: the assay measured the affinity of the ADGRA3
      class I PBM for the PDZ domains of GRID2IP, which is the specific activity supported.'
