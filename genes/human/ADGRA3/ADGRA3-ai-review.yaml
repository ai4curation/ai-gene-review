suggested_questions:
- question: 'UniProt correction. The Q8IWK6 entry still states, under MISCELLANEOUS, that ''ADGRA3 is
    predicted non-cleavable because of the lack of a consensus catalytic triad sequence within GPS region''
    (ECO:0000305, a curator inference). PMID:36089063 tested that prediction and refuted it: human GPR125
    expressed in HEK293 and MDCK cells is cleaved into associated N- and C-terminal fragments, cleavage
    requires the GAIN domain, and alanine substitution of the atypical GPS tripeptide Ser736-Leu737-Ser738
    abolishes it. PMID:40127866 concurs that the ADGRA3 GPS is SL|S/G across vertebrates and builds its
    CTF constructs on that cleavage point. Should the MISCELLANEOUS line be replaced with a PTM/PROCESSING
    statement citing PMID:36089063, and a SITE or CHAIN feature added at the GPS?'
