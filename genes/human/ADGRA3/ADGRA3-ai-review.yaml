    target validation in both cases rests on constitutive activity rather than on a ligand-receptor pair.
    Without a ligand the ectodomain's adhesion-related domains cannot be assigned a binding function,
    which is the main reason the molecular-function half of this gene's GO record consists of one receptor-activity
    term and nineteen rows of bare protein binding.
  resolution: 'Deorphanisation: an unbiased extracellular-interactome screen against the purified ADGRA3
    ectodomain, combined with a comparison of full-length versus stachel-exposed constructs to distinguish
    a true agonist from a modulator of autoproteolysis or of tethered-agonist accessibility.'
