- term:
    id: GO:0016540
    label: protein autoprocessing
  evidence_type: IDA
  original_reference_id: PMID:36089063
  qualifier: involved_in
  review:
    summary: 'A demonstrated property of the human protein that contradicts the standing prediction, and
      a term no human adhesion GPCR currently carries.


      Human GPR125 expressed in HEK293 and MDCK cells is cleaved into an N-terminal and a C-terminal fragment
      that remain associated, cleavage is lost in GAIN-domain deletions, and substituting the GPS tripeptide
      Ser736-Leu737-Ser738 with alanines abolishes it. Cleavage occurs early in biosynthesis. This is
      GAIN-mediated cis-autoproteolysis, which GO:0016540 defines as processing a protein carries out
      on itself to generate its mature form.


      It matters twice over. First, it overturns the prediction that ADGRA3 is non-cleavable because its
      GPS tripeptide is Ser-Leu-Ser rather than the canonical His-Leu/Ile-Ser/Thr - a prediction UniProt
      still records. Second, autoproteolysis is what liberates the stachel tethered agonist whose removal
      abolishes ADGRA3''s G protein signalling, so it is mechanistically upstream of the receptor''s only
      demonstrated molecular function.


      A QuickGO census of GO:0016540 and its descendants in human returns 68 annotations across 36 gene
      products, and not one is an adhesion GPCR - so the defining biochemical feature of the aGPCR class
      is unannotated in GO for all 33 human members. Raised for the family in suggested_questions; proposed
      here for the gene where the experiment exists.'
    action: NEW
    reason: Direct demonstration of cis-autoproteolysis of human GPR125 at the atypical GPS motif Ser736-Leu737-Ser738,
      abolished by alanine substitution of the tripeptide; no human adhesion GPCR currently carries this
      term.
    supported_by:
    - reference_id: PMID:36089063
      supporting_text: In the present study, we show that human GPR125, expressed in kidney epithelial
        Madin-Darby canine kidney (MDCK) cells and embryonic kidney HEK293 cells, undergoes cis-autoproteolysis
        at the atypical GPS during an early stage of receptor biosynthesis.
    - reference_id: PMID:36089063
      supporting_text: GPR125 has been predicted to be noncleavable in the GAIN domain because of its
        atypical GPS motif (Ser736-Leu737-Ser738) but not the canonical one (His-Leu/Ile-Ser/Thr)
    - reference_id: file:human/ADGRA3/ADGRA3-uniprot.txt
      supporting_text: ADGRA3 is predicted non-cleavable
    - reference_id: PMID:40127866
      supporting_text: The GPS in most ADGRA3 vertebrate orthologs is SL|S/G (where | denotes the potential
        cleavage point).
