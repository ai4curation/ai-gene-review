suggested_experiments:
- hypothesis: ADGRA3's urogenital knockout phenotypes are caused by loss of PDZ-scaffold-dependent epithelial
    polarity rather than by loss of G protein signalling.
  description: 'Generate two knock-in mouse lines: Adgra3-DeltaETTV, which cannot bind PDZ scaffolds but
    retains autoproteolysis and G protein coupling, and Adgra3-GPS(AAA), which cannot self-cleave and
    therefore cannot expose the stachel agonist. Score both for the published null phenotypes - ejaculatory-duct
    obstruction in males, imperforate vagina in females - and for epithelial architecture in the affected
    ducts. The two alleles dissociate the receptor''s two demonstrated molecular capabilities, which no
    existing experiment does.'
  experiment_type: mouse genetics / separation-of-function alleles
- hypothesis: The apicobasal-polarity function demonstrated in canine MDCK cells is conserved in human
    epithelium and depends on the ETTV motif.
  description: Knock out ADGRA3 in a human polarised epithelial model (Caco-2 or human intestinal or kidney
    organoids), score lumen number and mitotic spindle orientation in 3D culture, then rescue with wild-type
    ADGRA3 versus the Delta-ETTV and GPS(AAA) mutants. This would convert the proposed GO:0045197 annotation
    from ISS to IMP on the human gene and would establish whether polarity requires the motif, the cleavage,
    or both.
  experiment_type: human organoid CRISPR knockout with structure-function rescue
- hypothesis: Human ADGRA3 retains the Dishevelled-dependent planar-cell-polarity output demonstrated
    for zebrafish adgra3, separately from its DVL-independent G protein coupling.
  description: 'In ADGRA3-null human cells and in Adgra3-null mice, assay a mammalian PCP readout that
    does not involve beta-catenin: asymmetric membrane localisation of VANGL2 and PRICKLE, oriented cell
    division in a PCP-dependent epithelium, and cochlear hair-cell stereocilia orientation. Pair with
    a DVL-binding-deficient ADGRA3 intracellular-domain mutant. This tests the one function UniProt asserts
    for the human protein and that GOA does not record, and it distinguishes the PCP branch from the canonical
    Wnt branch that ADGRA3 was already shown not to engage.'
  experiment_type: planar cell polarity readouts in mammalian cells and mouse
- hypothesis: ADGRA3 has an endogenous extracellular ligand or adhesion partner that modulates its constitutive
    activity.
  description: Screen the purified ADGRA3 ectodomain (LRR-Ig-HBD-GAIN, residues ~34-761) against an extracellular-protein
    interaction library by avidity-based extracellular interaction screening, and test hits for their
    effect on cAMP output of full-length ADGRA3 versus the constitutively active CTF. Comparing the two
    constructs separates a true agonist from a modulator of autoproteolysis or of tethered-agonist accessibility,
    and the ectodomain is the ~730-residue region for which no molecular function is currently assignable.
  experiment_type: extracellular interactome screen with functional counter-assay
- hypothesis: The eighteen PDZ partners imported into GOA from the holdup screen are largely in vitro
    consequences of the ETTV motif rather than cellular interactions of ADGRA3.
  description: Perform proximity labelling (TurboID or APEX2) from the ADGRA3 C-terminus in a polarised
    human epithelial line and in a cell type where ADGRA3 is natively expressed, and compare the recovered
    PDZ proteins with the 80 holdup partners and the 18 GOA-imported ones. Include the Delta-ETTV mutant
    as the specificity control. This would show which of the measured affinities are realised in a cell
    and would give GOA a principled basis for which partners to retain.
  experiment_type: proximity-dependent biotinylation with motif-deletion control
knowledge_gaps:
- gap_statement: ADGRA3 has no known ligand. Every signalling result to date is constitutive activity
    of the receptor or of its cleaved C-terminal fragment; nothing extracellular has been shown to bind
    the receptor and change its output. The large ectodomain - a leucine-rich-repeat block, two immunoglobulin
    domains, a hormone-binding domain and the GAIN domain, roughly 730 residues - is therefore functionally
    unassigned, and no GO molecular function describes what it does.
  boundary: 'What is established is the transduction machinery: cis-autoproteolysis at the atypical GPS
    Ser736-Leu737-Ser738, a stachel tethered agonist whose first three residues are required, and coupling
    to both Gs and Gi in human cells. What is missing is the input. A flavonoid, hesperetin, has been
    put forward as a candidate agonist in adipocytes, but that is a single pharmacological report and
    not an endogenous ligand.'
