      through its ETTV motif and co-immunoprecipitates DLG1. Human and dog ADGRA3 are close orthologues
      and the polarity machinery is shared, so the inference is sound - but calling it IMP would overstate
      which organism''s gene was perturbed, and this campaign has repeatedly paid for exactly that kind
      of slippage. Recorded honestly at ISS with the canine entity in supporting_entities, per the rule
      that ISS WITH/FROM takes the sequence-similar entity.'
