id: P40692
gene_symbol: MLH1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'MLH1 is the obligate scaffold MutL subunit that forms nuclear MutLalpha with PMS2, MutLbeta
  with PMS1, and MutLgamma with MLH3. The MLH1-PMS2 MutLalpha heterodimer is the major post-replicative
  mismatch-repair effector: after mismatch recognition by MutSalpha or MutSbeta, MutLalpha couples ATP-regulated
  complex assembly to PMS2-dependent incision of the newly synthesized DNA strand so EXO1 excision, polymerase
  delta resynthesis, and LIG1 ligation can replace the error-containing tract.'
