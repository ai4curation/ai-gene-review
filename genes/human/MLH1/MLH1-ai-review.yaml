- term:
    id: GO:0004520
    label: DNA endonuclease activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: contributes_to
  supporting_entities:
  - PANTHER:PTN000008164
  - UniProtKB:P40692
  review:
    summary: MLH1 contributes to the nuclear MutLalpha endonuclease that executes post-replicative
      mismatch repair.
    action: ACCEPT
    reason: MLH1 is the scaffolding, non-catalytic MutLalpha subunit; PMS2 carries the active
      endonuclease motif, but both subunits are required for the assembled MLH1-PMS2 mismatch-repair
      nuclease.
    supported_by:
    - *id002
    - &id003
      reference_id: PMID:33510387
      supporting_text: 'MutSα recruits MutLα to form a mismatch-bound complex, which initiates MMR by

        nicking the daughter strand 5'' to the mismatch.'
