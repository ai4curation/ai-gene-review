- term:
    id: GO:0000710
    label: meiotic mismatch repair
  evidence_type: IDA
  original_reference_id: PMID:16873062
  qualifier: involved_in
  review:
    summary: PMID:16873062 supports somatic MutLalpha mismatch repair, not meiotic mismatch repair.
    action: MODIFY
    reason: The cited paper reconstitutes somatic nick-directed mismatch repair by human MutLalpha.
      MLH1 has independent meiotic roles, but this Complex Portal row should use the parent mismatch
      repair term rather than GO:0000710 meiotic mismatch repair.
    supported_by:
    - &id002
      reference_id: PMID:16873062
      supporting_text: 'We show that human

        MutLalpha is a latent endonuclease that is activated in a mismatch-, MutSalpha-,

        RFC-, PCNA-, and ATP-dependent manner.'
    proposed_replacement_terms:
    - id: GO:0006298
      label: mismatch repair
    source_defects:
    - defect_type: WRONG_TERM
      resource: COMPLEX_PORTAL
      slot: GO_ID
      requested_change: REPOINT
      asserted_value: GO:0000710
      corrected_value: GO:0006298
      corrected_label: mismatch repair
      cause: CONTEXT_NOT_ASSAYED
      confidence: CONFIRMED
      explanation: PMID:16873062 reconstitutes somatic human MLH1-PMS2 MutLalpha
        endonuclease-dependent mismatch repair. It supports GO:0006298 mismatch repair for the
        MLH1-PMS2 complex, not the meiotic mismatch repair term.
      supported_by:
      - reference_id: PMID:16873062
        supporting_text: "We show that human\nMutLalpha is a latent endonuclease that is activated in
          a mismatch-, MutSalpha-,\nRFC-, PCNA-, and ATP-dependent manner."
