suggested_questions:
- question: What purified biochemical activity distinguishes human MLH1 from its MLH/PMS paralogs?
  experts:
  - DNA mismatch repair curators
suggested_experiments:
- description: Reconstitute the relevant MLH1-PMS2 heterodimer with MutSalpha/MutSbeta, RFC, PCNA,
    EXO1, RPA, polymerase delta, and LIG1 to test incision and repair on nicked and
    ribonucleotide-directed heteroduplex substrates.
  hypothesis: The direct repair activity of MLH1 is restricted to its cognate MutL heterodimer.
