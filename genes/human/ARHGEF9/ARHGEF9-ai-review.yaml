id: O43307
gene_symbol: ARHGEF9
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ARHGEF9 encodes collybistin, a Dbl-family guanine-nucleotide exchange factor and
  adaptor associated with inhibitory postsynaptic organization. Its exchange-factor activity
  promotes CDC42 activation. Through gephyrin and phosphoinositide interactions, collybistin
  recruits gephyrin to the postsynaptic membrane, helping organize inhibitory receptor scaffolds.
  This recruitment activity can operate independently of nucleotide exchange and is conformationally
  regulated through the SH3 and PH domains. Collybistin occupies cytosolic and postsynaptic
  pools. Pathogenic ARHGEF9 variants cause developmental and epileptic encephalopathy with intellectual
  disability; hyperekplexia and an exaggerated startle response occur in affected individuals.
