suggested_questions:
- question: Which current human ARHGEF9 isoforms reproduce the independently separable exchange-factor
    and membrane-adaptor activities demonstrated with the historical human and rat constructs?
- question: Do the original HuRI and neurodegeneration pair-level records verify the ten retained
    ARHGEF9 interactions, including the named partner isoforms?
- question: What experimental descendant evidence and ancestral placements underlie PTN002911494
    and PTN002911496, and which exact ARHGEF9 participants support the p75NTR, RhoA/B/C and
    GABA-conductance location records?
suggested_experiments:
- description: Compare accession-defined human ARHGEF9 isoforms in purified nucleotide-exchange
    assays and in cellular gephyrin recruitment assays, with separate loss-of-exchange and loss-of-lipid-binding
    mutants.
- description: Test endogenous human neuronal collybistin localization and gephyrin recruitment
    while separately measuring CDC42 activation, avoiding an assumption that these two activities
    are obligatorily coupled.
