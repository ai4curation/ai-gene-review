  review:
    summary: IPI with MAPK1 (ERK2). DUSP5 binds ERK2 through the KIM in its N-terminal noncatalytic domain.
    action: MODIFY
    reason: Generic protein binding is uninformative. The paper shows specific docking of ERK2 via the DUSP5 kinase interaction motif and the ERK2 common docking site; this binding both determines substrate specificity and, independently of catalysis, anchors ERK2 in the nucleus. Mitogen-activated protein kinase binding is the informative replacement.
    supported_by:
    - &id015
      reference_id: PMID:15713638
      supporting_text: DUSP5, an inducible nuclear phosphatase, interacts specifically with ERK2 via a kinase interaction motif (KIM) within its amino-terminal noncatalytic domain
    - &id016
      reference_id: PMID:15713638
      supporting_text: the expression of a catalytically inactive mutant of DUSP5 also tethers ERK2 within the nucleus
    proposed_replacement_terms:
    - &id014
      id: GO:0051019
      label: mitogen-activated protein kinase binding
