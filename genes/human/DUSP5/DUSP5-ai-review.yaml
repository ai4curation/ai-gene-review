- term:
    id: GO:0004722
    label: protein serine/threonine phosphatase activity
  evidence_type: EXP
  original_reference_id: PMID:7961985
  qualifier: enables
  review:
    summary: Experimental annotation from the original cloning paper, which showed phosphatase activity of recombinant DUSP5 catalytic domain on phosphoprotein substrates including phospho-ERK1.
    action: ACCEPT
    reason: DUSP5 is a dual-specificity phosphatase; dephosphorylation of the phospho-Thr of the ERK activation loop is one half of its catalytic activity (31P NMR shows both phosphates of the pT-E-pY tripeptide are removed). The serine/threonine facet is a true and experimentally supported activity. The integrated core function is captured by GO:0017017.
    supported_by:
    - reference_id: PMID:7961985
      supporting_text: A bacterially expressed recombinant protein containing the catalytic domain of B23 showed significant but consistently lower activity than VHR in vitro
    - *id002
    - *id003
