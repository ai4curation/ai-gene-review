id: Q16690
gene_symbol: DUSP5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'DUSP5 is an inducible, nuclear dual-specificity MAP kinase phosphatase of the class I MKP group, selective for the ERK1/2 MAP kinases. It has an N-terminal rhodanese-like (CH2) domain carrying a kinase interaction motif (KIM) and a nuclear localization signal, and a C-terminal DSPc catalytic domain with the HCXAGXXR signature and catalytic Cys263. Docking of ERK2 through the KIM confers substrate selectivity: DUSP5 dephosphorylates the activation-loop phospho-Thr and phospho-Tyr of ERK1/2, inactivating them, but does not act on JNK or p38. Independently of catalysis, DUSP5 binds and retains inactive ERK2 in the nucleus. DUSP5 transcription is induced by ERK1/2 activity (growth factors, serum, heat shock), the protein is phosphorylated by ERK and stabilised by ERK binding, and it acts as a nuclear negative-feedback regulator of ERK signalling; loss of DUSP5 in mouse cells increases nuclear phospho-ERK and in some oncogenic contexts changes cell fate.'
existing_annotations:
- term:
    id: GO:0000165
    label: MAPK cascade
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-5673001
  qualifier: involved_in
  review:
    summary: Reactome places DUSP5 in the RAF/MAP kinase cascade pathway as the nuclear phosphatase that dephosphorylates ERK1/2.
    action: MODIFY
    reason: DUSP5 does not transmit the MAPK cascade signal; it terminates it by dephosphorylating ERK1/2. Its role is negative regulation, and it is ERK1/2-selective (inactivates ERK2 but not JNK or p38), so the correct process term is negative regulation of ERK1 and ERK2 cascade.
    supported_by:
    - &id001
      reference_id: PMID:15713638
      supporting_text: This binding determines the substrate specificity of DUSP5 in vivo, as it inactivates ERK2 but not Jun N-terminal protein kinase or p38 MAP kinase
    - &id011
      reference_id: Reactome:R-HSA-5675373
      supporting_text: DUSP5 is specific for MAPK3 and 1, while the other class 1 enzymes have broad specificity.
    proposed_replacement_terms:
    - &id008
      id: GO:0070373
      label: negative regulation of ERK1 and ERK2 cascade
- term:
    id: GO:0001706
    label: endoderm formation
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000017039
  - ZFIN:ZDB-GENE-040426-709
  review:
    summary: IBA for endoderm formation propagated from PANTHER node PTN000017039, whose only experimental donor is zebrafish dusp4 (ZFIN:ZDB-GENE-040426-709), a morpholino phenotype.
    action: REMOVE
    reason: The sole experimental grounding for this node is a zebrafish dusp4 morpholino (IMP) phenotype in Nodal-dependent endoderm formation; DUSP4 is a different subfamily of the nuclear MKP clade from DUSP5 (PTHR10159:SF40). Endoderm formation is a downstream organismal outcome of altered ERK signalling, not a process in which a phosphatase performs a step, and there is no evidence of any role for DUSP5 in gastrulation in any species; Dusp5-null mice are viable and have been used for adult tumour and signalling studies. The propagation of a single morpholino developmental phenotype across DUSP1/2/4/5 is an over-propagation.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - WRONG_ORTHOLOG_OR_PARALOG
      - ROLE_CONFLATION
      source_entities:
      - source_id: PANTHER:PTN000017039
        comment: Node spans the nuclear class I MKPs DUSP1/2/4/5; its only experimental grounding is a zebrafish dusp4 morpholino phenotype, which is a different subfamily from DUSP5 SF40 and a downstream developmental outcome.
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
      - source_id: ZFIN:ZDB-GENE-040426-709
        source_label: dusp4
        comment: Zebrafish dusp4 (Q7SZF3) morpholino IMP for endoderm formation (PMID:18719100, checked in QuickGO); no DUSP5 evidence in any species.
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
    supported_by:
    - &id012
      reference_id: PMID:25489104
      supporting_text: MEFs) from DUSP5(-/-) mice show increased levels of nuclear phospho-ERK immediately after TPA stimulation and fail to accumulate total ERK in the nucleus
