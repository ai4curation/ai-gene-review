suggested_questions:
- question: Should the catalysis-independent nuclear anchoring of ERK2 by DUSP5 be captured with a process term such as GO:0051457 maintenance of protein location in nucleus, and is this anchoring conserved for ERK1?
- question: Is the high-affinity binding of PDZ domains to the DUSP5 C-terminal peptide reported by fragmentomics relevant to DUSP5 localisation or function in cells?
- question: Does the DUSP5 C197-C219 disulfide redox switch proposed from simulations regulate activity in cells under oxidative stress?
suggested_experiments:
- description: Re-express KIM, NLS and catalytic-dead (C263S) DUSP5 mutants in DUSP5-null human cells and quantify nuclear phospho-ERK1 versus ERK2 and nuclear ERK retention, separating catalytic inactivation from anchoring for each ERK isoform.
- description: Mutate the C-terminal PDZ-binding motif of DUSP5 and test whether binding to PDZ proteins (e.g. SCRIB, MAGI2, PATJ) alters DUSP5 localisation, stability or ERK regulation.
