knowledge_gaps:
- gap_statement: >-
    The extent to which endogenous human LRP8 couples Reelin binding to DAB1-dependent
    developmental and synaptic outputs in defined neural cell types remains unresolved.
  boundary: >-
    Human ApoER2 directly binds Reelin and receptor clustering has been studied in
    engineered HEK293 cells. Cortical layering, hippocampal development, dendritic
    spine, and synaptic phenotypes are established principally in mouse and often
    jointly with VLDLR.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    Resolving this boundary is necessary to distinguish conserved human receptor
    signaling from mouse developmental phenotypes and from redundant VLDLR activity.
  resolution: >-
    Perturb LRP8 and VLDLR separately and together in human neural lineage models,
    rescue with expression-matched human LRP8, and measure proximal DAB1 signaling,
    neuronal positioning, and synaptic maturation.
  provenance:
  - reference_id: PMID:10380922
    supporting_text: |-
      Inversion of
      cortical layers and absence of cerebellar foliation in these animals precisely
      mimic the phenotype of mice lacking Reelin or mDab1.
- gap_statement: >-
    Endogenous functions of the five curated human LRP8 splice isoforms are not
    resolved at protein, tissue, or signaling level.
  boundary: >-
    The isoforms alter LDL-receptor class A repeats, the O-glycan-rich region, or a
    large segment of the cytoplasmic tail. Human transcript studies establish
    alternative splicing, but most processing and adaptor-coupling claims are
    transferred from mouse and isoform 5 has no described reviewed sequence.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: >-
    Isoform composition could change ligand selectivity, surface retention,
    proteolysis, and intracellular signaling, so canonical-product annotations cannot
    automatically be assigned to every proteoform.
  resolution: >-
    Establish isoform-resolved transcripts and proteins in human tissues, then compare
    surface delivery, ligand binding, cleavage, internalization, DAB1 coupling, and
    cytoplasmic-adaptor recruitment at endogenous abundance.
- gap_statement: >-
    The architecture and stoichiometry of full-length LRP8 ligand complexes in a
    membrane remain unknown.
  boundary: >-
    Experimental structures cover isolated LDL-receptor class A modules or an
    ectodomain fragment, and HEK293 imaging supports ligand-dependent receptor
    rearrangement. No experimental structure includes the complete ectodomain,
    transmembrane helix, cytoplasmic tail, membrane, and signaling adaptors together.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: >-
    A full receptor assembly is needed to connect ligand-specific extracellular
    recognition to oligomerization and intracellular signaling.
  resolution: >-
    Reconstitute full-length human LRP8 in a membrane with Reelin or apoE particles
    and determine ligand-dependent stoichiometry and structure, coupled to interface
    mutagenesis and signaling assays.
- gap_statement: >-
    The physiological importance and tissue range of LRP8-mediated viral entry in
    humans remain incompletely defined.
  boundary: >-
    Direct cell-based evidence establishes receptor activity for several enveloped
    viruses, including a mapped tick-borne encephalitis virus interaction with the
    first two ligand-binding repeats. These specialized infection contexts do not
    establish that viral entry is an endogenous core function or define the relevant
    human tissues in vivo.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    Tissue expression, receptor isoform usage, and redundancy with related LDLR-family
    receptors will determine whether LRP8 is a useful antiviral target.
  resolution: >-
    Compare endogenous LRP8 dependence, isoform usage, and receptor redundancy in
    primary human neural and vascular models across viral strains, then validate
    receptor-interface mutants that preserve endogenous ligand functions.
proposed_new_terms: []
suggested_questions:
- question: >-
    Which human neural cell types require LRP8 rather than VLDLR for proximal Reelin-DAB1
    signaling and its developmental or synaptic outputs?
  experts: []
- question: >-
    Which of the five human LRP8 isoforms are translated endogenously, and how do the
    deleted ligand-binding, O-glycan-rich, and cytoplasmic segments alter receptor
    function?
  experts: []
- question: >-
    What is the full-length membrane architecture of Reelin-bound and apoE-particle-bound
    LRP8, and do the two ligand classes impose different receptor stoichiometries?
  experts: []
- question: >-
    In which primary human tissues and viral strains is LRP8 necessary rather than
    redundant for entry, and which receptor isoforms are used?
  experts: []
suggested_experiments:
- hypothesis: >-
    Human neural Reelin signaling has a cell-type-specific requirement for LRP8 that
    is only partly redundant with VLDLR.
  description: >-
    Generate isogenic LRP8-null, VLDLR-null, and double-null human neural progenitors
    and neurons, rescue with expression-matched receptors, and quantify Reelin binding,
    DAB1 phosphorylation, migration, dendritic maturation, and synaptic physiology.
  experiment_type: isogenic receptor-complementation signaling study
- hypothesis: >-
    Human LRP8 splice isoforms partition ligand uptake, Reelin signaling, and
    cytoplasmic-adaptor recruitment.
  description: >-
    Use long-read RNA sequencing and isoform-specific proteomics to identify endogenous
    products, then introduce each verified isoform at its native locus and compare
    surface delivery, ligand affinity, endocytosis, proteolysis, DAB1 signaling, and
    adaptor binding.
  experiment_type: isoform-resolved endogenous functional comparison
- hypothesis: >-
    Reelin and apoE-containing particles stabilize distinct full-length LRP8 assemblies.
  description: >-
    Reconstitute full-length human LRP8 in nanodiscs with defined ligands, measure
    stoichiometry by single-particle and biophysical methods, determine structures,
    and test interface mutants in matched cell-signaling and cargo-uptake assays.
  experiment_type: membrane-receptor reconstitution and structural analysis
- hypothesis: >-
    Viral entry depends on a separable LRP8 ligand-binding surface that can be disrupted
    without impairing Reelin or lipoprotein receptor functions.
  description: >-
    Map viral and endogenous ligand contacts across the human LRP8 ectodomain using
    binding assays and receptor mutants, then test separation-of-function alleles in
    primary human neural and vascular models while monitoring receptor trafficking and
    endogenous ligand responses.
  experiment_type: comparative receptor-interface and separation-of-function study
