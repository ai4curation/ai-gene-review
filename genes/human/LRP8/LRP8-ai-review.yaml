id: Q14114
gene_symbol: LRP8
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  LRP8 (ApoER2) is a type-I single-pass cell-surface receptor with seven
  LDL-receptor class A repeats, an extracellular beta-propeller and
  O-glycan-rich region, and a cytoplasmic signaling tail. It binds Reelin and
  apolipoprotein E-containing lipoproteins. Direct human assays establish
  high-affinity Reelin binding, while heterologous HEK293 experiments with
  murine ApoER2 provide mechanistic evidence that multivalent Reelin can cluster
  the receptor and initiate intracellular signaling. In parallel,
  lipoprotein binding supports receptor-mediated uptake. In neuronal systems,
  LRP8 cooperates with VLDLR and the adaptor DAB1 to control neuronal positioning
  and synaptic function, with many developmental outputs established most
  directly in mouse. Five curated human splice isoforms alter ligand-binding
  repeats, the O-glycan-rich region, or the cytoplasmic tail, but their endogenous
  functional partitioning remains incompletely defined. LRP8 can also serve as a
  cell-entry receptor for Semliki Forest, eastern equine encephalitis, and
  tick-borne encephalitis viruses.
