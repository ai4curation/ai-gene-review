core_functions:
- description: >-
    At the plasma membrane, LRP8 binds multivalent Reelin through its extracellular
    LDL-receptor class A repeats. Direct human evidence establishes Reelin binding
    and the interaction geometry of a human receptor fragment. Reelin-induced
    receptor clustering and adaptor signaling are supported mechanistically by
    heterologous HEK293 experiments with murine ApoER2, while neuronal positioning
    and synaptic outputs are supported most strongly by exact-ortholog mouse studies.
  molecular_function:
    id: GO:0038025
    label: reelin receptor activity
  directly_involved_in:
  - id: GO:0038026
    label: reelin-mediated signaling pathway
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:12899622
    supporting_text: |-
      By surface plasmon resonance we demonstrate that apoER2 exhibits
      6-fold higher affinity for Reelin than the very low density lipoprotein receptor
      (VLDLR), which also functions as a Reelin receptor (K(D) 0.2 nM versus K(D) 1.2
      nM).
  - reference_id: PMID:20223215
    supporting_text: |-
      Analysis of a 2.6 A crystal structure of the reelin
      receptor-binding fragment in complex with the LA1 of ApoER2 revealed that
      Lys2467 of reelin is recognized by both a conserved Trp residue and
      calcium-coordinating acidic residues from LA1, which together with Lys2360 plays
      a critical role in the interaction.
  - reference_id: PMID:30873003
    supporting_text: |-
      Upon binding of full length Reelin ApoER2 and VLDLR
      homo-oligomers are rearranged to higher order receptor clusters which leads to
      Dab1 phosphorylation.
- description: >-
    LRP8 binds apolipoprotein E-containing lipoprotein particles at the plasma
    membrane and internalizes the receptor-bound cargo. This directly demonstrated
    uptake activity is distinct from the receptor's Reelin-signaling role and is
    best represented by the specific very-low-density-lipoprotein-particle receptor
    activity rather than a blanket LDL-receptor assignment.
  molecular_function:
    id: GO:0030229
    label: very-low-density lipoprotein particle receptor activity
  directly_involved_in:
  - id: GO:0006897
    label: endocytosis
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:8626535
    supporting_text: |-
      LDL receptor deficient
      Chinese hamster ovary cells expressing human apoER2 bound apoE rich
      beta-migrating VLDL with high affinity and internalized. LDL was bound with much
      lower affinity to these cells.
  - reference_id: PMID:12950167
