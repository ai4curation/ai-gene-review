- term:
    id: GO:0015031
    label: protein transport
  evidence_type: NAS
  original_reference_id: PMID:38612882
  qualifier: involved_in
  review:
    summary: Statement in a review of vault RNAs that vaults may transport drugs or cargo.
    action: MARK_AS_OVER_ANNOTATED
    reason: Transport by vaults is a long-standing hypothesis but has not been demonstrated for any 
      defined protein cargo. MVP-/- fibroblasts show normal nuclear import/export kinetics, MVP-/- 
      mice are healthy and not sensitised to cytostatics, and the cited review phrases the role as 
      possible ('may be associated'). Recent structures show a lumen that can hold PARP4, NAD+ and, 
      in Dictyostelium, ribosomes, which keeps a carrier role plausible, but a protein transport 
      process is not established.
    supported_by:
    - reference_id: PMID:38612882
      supporting_text: The role of vaults in therapy resistance may be associated with their ability
        to transport drugs away from their intracellular targets
    - *id006
    - reference_id: PMID:12499273
      supporting_text: Our results suggest that MVP/vaults are not directly involved in the 
        resistance to cytostatic agents
