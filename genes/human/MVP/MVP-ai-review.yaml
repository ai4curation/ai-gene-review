- term:
    id: GO:0007165
    label: signal transduction
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000366423
  - UniProtKB:Q14764
  review:
    summary: PAINT IBA placing signal transduction at PTN000366423 in the major vault protein 
      family; the only experimental grounding is human MVP itself.
    action: KEEP_AS_NON_CORE
    reason: 'Human MVP has repeated experimental links to signalling: it binds phosphotyrosine-dependent
      SH2 partners (SRC, PTPN11), dampens EGF-dependent ERK activation and IFN-gamma/STAT1 signalling,
      and in mouse macrophages restrains TRAF6-dependent NF-kappaB activation. These are modulatory, mostly
      inhibitory effects, so MVP is a regulator of several pathways rather than a transducer, and none
      of this has been shown for non-vertebrate vaults. The broad term is kept as non-core: it is true
      of the human protein but is not the structural function of MVP. No PAINT loss is recorded on this
      lineage.'
    supported_by:
    - &id009
      reference_id: PMID:16441665
      supporting_text: MVP overexpression downregulates EGF-dependent ERK activation in Src 
        overexpressing cells
    - reference_id: PMID:16418217
      supporting_text: MVP-mediated IFN-gamma insensitivity was accompanied by significantly reduced
        STAT1 phosphorylation at Y701 and diminished translocation of STAT1 into the nucleus
    - reference_id: PMID:30996248
      supporting_text: MVP interacts with TRAF6 preventing its recruitment to IRAK1 and subsequent 
        oligomerization and ubiquitination
