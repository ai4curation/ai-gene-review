id: Q14764
gene_symbol: MVP
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'Major vault protein (MVP; also known as lung resistance-related protein, LRP) is the principal
  structural protein of vaults, barrel-shaped cytoplasmic ribonucleoprotein particles of about 13 MDa
  that are widespread in eukaryotes and thought to be ancestral to them. Each vault is a dimer of half-vaults,
  each built from 39 identical MVP chains; every chain has nine N-terminal repeat domains that form the
  thin barrel wall, a shoulder domain related to stomatin, a long cap-helix and a cap-ring. MVP alone
  is sufficient to assemble vault-like particles, which form on polyribosomes. The cage lumen houses the
  minor vault components PARP4 (vPARP), which binds MVP repeats 3-4, TEP1 and the small vault RNAs, and
  contains binding sites for NAD+ and ADP. Vaults are mostly cytosolic, with small fractions at the nuclear
  envelope and nuclear pore, near microtubules, at membranes and in extracellular vesicles. MVP is highly
  expressed in epithelia exposed to xenobiotics, in macrophages and in many multidrug-resistant tumours,
  and is induced by interferon-gamma and by viral infection. Its physiological function remains unclear:
  MVP-deficient mice are viable and not sensitised to cytostatic drugs, and no defect in nucleocytoplasmic
  transport was found. Reported roles are mainly modulatory, including binding of tyrosine-phosphorylated
  MVP to the SH2 domains of SRC and PTPN11 in EGF signalling, damping IFN-gamma/STAT1 signalling, restraining
  TRAF6-dependent NF-kappaB activation in macrophages, supporting type I interferon induction during viral
  infection, and aiding lipid-raft-dependent uptake and clearance of Pseudomonas aeruginosa by airway
  epithelial cells.'
