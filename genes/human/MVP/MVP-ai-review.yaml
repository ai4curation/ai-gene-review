core_functions:
- description: Structural shell protein of the vault. MVP self-assembles into the 78-mer 
    barrel-shaped cage (two half-vaults of 39 chains) whose lumen houses PARP4, TEP1 and vault RNAs 
    and binds NAD+/ADP. This is the one function of MVP established beyond doubt; what the assembled
    vault does for the cell is unknown.
  molecular_function:
    id: GO:0005198
    label: structural molecule activity
  locations:
  - id: GO:0005829
    label: cytosol
  in_complex:
    id: GO:1990904
    label: ribonucleoprotein complex
  supported_by:
  - reference_id: PMID:19150846
    supporting_text: the cage structure consists of a dimer of half-vaults, with each half-vault 
      comprising 39 identical major vault protein (MVP) chains
  - reference_id: PMID:11349122
    supporting_text: the expression of the rat MVP alone can direct the formation of particles that 
      have biochemical characteristics similar to endogenous rat vaults
  - reference_id: PMID:40691181
    supporting_text: The major vault protein (MVP) oligomerizes into an ovular cage, which contains 
      several minor vault components (MVCs)
  knowledge_gaps:
  - gap_statement: 'The physiological function of the vault particle is unknown: no cargo, transport activity
      or enzymatic role of the assembled cage has been demonstrated, and MVP-null mice are viable and
      healthy.'
    boundary: Structure, composition and assembly of the cage are known in atomic detail, and MVP 
      binds PARP4, NAD+ and several signalling proteins; proposed roles in drug resistance and 
      nucleocytoplasmic transport were not supported in knockout cells.
    gap_kind:
    - BIOLOGY
    status: OPEN
    significance: Without a defined function, every process annotation for MVP rests on indirect 
      modulatory phenotypes, and the reason the vault is conserved across eukaryotes remains 
      unexplained.
proposed_new_terms:
- proposed_name: vault complex
  proposed_definition: A barrel-shaped cytoplasmic ribonucleoprotein complex of about 13 MDa, formed
    by two half-vaults each made of multiple copies of the major vault protein, and containing the 
    minor vault components such as vault poly(ADP-ribose) polymerase, TEP1 and vault RNAs.
  justification: GO has no term for the vault, one of the largest and most abundant 
    ribonucleoprotein particles in eukaryotic cells; MVP, PARP4, TEP1 and the vault RNAs can only be
    annotated to the generic ribonucleoprotein complex. A specific complex term would let the vault 
    components be grouped and would anchor a 'structural constituent of vault' activity.
  proposed_parent:
    id: GO:1990904
    label: ribonucleoprotein complex
  supported_by:
  - reference_id: PMID:19150846
    supporting_text: the cage structure consists of a dimer of half-vaults, with each half-vault 
      comprising 39 identical major vault protein (MVP) chains
  - reference_id: PMID:10551828
    supporting_text: We show that while TEP1 is a component of the vault particle, vaults have no 
      detectable telomerase activity
suggested_questions:
- question: What, if anything, is carried inside the vault lumen in human cells? Proteomics of 
    vaults from PARP4-depleted cells and ribosome-containing vaults seen in Dictyostelium suggest 
    specific cargo, but no cargo has been shown to depend on vaults for its delivery or function.
- question: Do the NAD+/ADP sites inside the human vault cage have a function, for example in 
    supporting PARP4 activity, and is any cargo ADP-ribosylated inside the vault?
- question: Are the signalling effects of MVP (on SRC/ERK, STAT1, TRAF6/NF-kappaB and type I 
    interferon) properties of assembled vaults or of free MVP, and why do they differ in direction 
    between studies?
- question: Should the Reactome neutrophil degranulation cargo lists that place MVP in secretory and
    ficolin-1-rich granule lumen be revised, given that vaults are cytoplasmic particles without a 
    signal peptide?
suggested_experiments:
- hypothesis: Vaults deliver a specific set of proteins or RNAs to defined subcellular sites.
  description: In MVP-knockout human cells rescued with a cleavable or tagged MVP, compare the 
    vault-enclosed proteome and transcriptome (by proximity labelling inside the lumen) across 
    conditions, and test whether candidate cargo mislocalises or loses activity when vault assembly 
    is blocked.
  experiment_type: proteomics
- hypothesis: MVP's anti-inflammatory and antiviral effects require assembled vaults.
  description: Compare wild-type MVP with assembly-defective MVP mutants (cap-helix or shoulder 
    mutations that prevent cage formation) for their effects on TRAF6-dependent NF-kappaB activation
    and virus-induced type I interferon in MVP-null macrophages.
  experiment_type: genetic complementation
