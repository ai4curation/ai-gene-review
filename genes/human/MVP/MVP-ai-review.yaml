- term:
    id: GO:0005576
    label: extracellular region
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-6798748
  qualifier: located_in
  review:
    summary: Reactome neutrophil degranulation event (R-HSA-6798748) lists MVP as a granule lumen 
      cargo released to the extracellular region.
    action: MARK_AS_OVER_ANNOTATED
    reason: The neutrophil degranulation reactions draw their cargo lists from granule proteomics, 
      which pick up abundant cytoplasmic proteins. MVP has no signal peptide, vaults are cytoplasmic
      particles of about 13 MDa, and no study shows MVP inside neutrophil granules or secreted by 
      them. Extracellular MVP occurs mainly in exosomes and in serum of patients with infection or 
      cancer.
    supported_by:
    - &id001
      reference_id: PMID:16310186
      supporting_text: Immunofluorescence experiments showed that vaults are dispersed throughout 
        the cytoplasm; a small fraction is found in close proximity to microtubules
