      display_name: NuRD binds Ikaros family member proteins
      species: Homo sapiens
      summary: The Ikaros proteins are a family of Cys2His2 zinc finger transcription factors with roles in haematopoietic
        and lymphocyte development (reviewed in Heizmann et al, 2018; Georgopoulos et al, 2012). Family members
        Ikaros (IKZF1), Helios (IKZF2) and Aiolos (IKZF3) are expressed predominantly in haematopoietic cells, while
        two other family members, Eos (IKZF4) and Pegasus (IKZF5) are more broadly expressed. IKZF proteins are
        characterized by four N-terminal zinc fingers that contribute to the recognition of their GGGAA binding
        site in vitro and in vivo (Molnar and Georgopoulous, 1994; Hahm et al, 1998; Cobb et al, 2000; Perdomo et
        al, 2000; reviewed in Heizmann et al, 2018; Geogopoulos et al, 2012). Two C-terminal zinc fingers appear
        to contribute to dimerization, and Ikaros family proteins have been demonstrated to interact with each other
        (Molnar and Georgopoulous, 1994; Sun et al, 1996; McCarty et al, 2003). In addition, Ikaros family proteins
        have been shown to interact with the NuRD complex to repress transcription (Kim et al, 1999; Koipally et
        al, 1999; Sridharan and Smale, 2007; Caballero et al, 2007; Bottardi et al, 2014; Zhang et al, 2012; Wang
        et al, 2016; Liang et al, 2017; reviewed in Heizmann et al, 2018; Georgopoulos et al, 2012).
