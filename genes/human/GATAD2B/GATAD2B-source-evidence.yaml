      display_name: MBD3L2 binds MBD3 NuRD core complex
      species: Homo sapiens
      summary: MBD3L2 interacts with MBD3-containing NuRD complexes through the N-terminal region of MBD3 (Jin et
        al, 2005). MBD3L2 and homolog MBD3L1 are MBD2- and MBD3-related proteins that may modulate the repression
        activity of the NuRD complex (Jiang et al, 2002; Jiang et al, 2004l; Jin et al, 2005). MBD3L2 is more widely
        expressed and interacts with MBD3 through N-terminal regions in both proteins, but not with MBD2, as assessed
        by GST pulldowns in AD293 cells (Jin et al, 2005). MBD3L2 interacts with MBD3 through a region on MBD3 that
        partially overlaps with the MBD3-MBD2 interaction surface, suggesting a possible competitive binding model
        between MBD3L2 and MBD2 (Jin et al, 2005). This competition may play a role in displacing NuRD complexes
        from the DNA (Jin et al, 2005).
