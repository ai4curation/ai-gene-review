    blob: dfbe0cf9d40f3b56b0c309dd8d52c8168ca3541c
    mode: '100644'
    header:
      stable_id: R-HSA-8943724
      display_name: Regulation of PTEN gene transcription
      species: Homo sapiens
      summary: Transcription of the PTEN gene is regulated at multiple levels. Epigenetic repression involves the
        recruitment of Mi-2/NuRD upon SALL4 binding to the PTEN promoter (Yang et al. 2008, Lu et al. 2009) or EVI1-mediated
        recruitment of the polycomb repressor complex (PRC) to the PTEN promoter (Song et al. 2009, Yoshimi et al.
        2011). Transcriptional regulation is also elicited by negative regulators, including NR2E1:ATN1 (atrophin-1)
        complex, JUN (c-Jun), SNAIL and SLUG (Zhang et al. 2006, Vasudevan et al. 2007, Escriva et al. 2008, Uygur
        et al. 2015) and positive regulators such as TP53 (p53), MAF1, ATF2, EGR1 or PPARG (Stambolic et al. 2001,
        Virolle et al. 2001, Patel et al. 2001, Shen et al. 2006, Li et al. 2016).
