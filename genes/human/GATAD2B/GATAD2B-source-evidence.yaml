      stable_id: R-HSA-9941697
      display_name: ZNF827 and NR2C2,NR2F2 recruit NuRD to telomeric chromatin
      species: Homo sapiens
      summary: ZNF827 is a zinc-finger protein that, together with nuclear receptors NR2C2 and NR2F2 (also known
        as TR4 and COUP-TR2, respectively) is required for the recruitment of the NuRD complex to H4K5, H4K8 acetylated
        telomeres in cells undergoing ALT (alternative lengthening of telomeres) cells (Conomos et al, 2014; Yang
        et al, 2018; reviewed in Pickett and Reddel, 2015; Goo and Pickett, 2022). Interaction of ZNF827 and NuRD
        is mediated by an RRK motif in ZNF827 and a stretch of 14 amino acids at the N-terminal region of the NuRD
        subunit RBBP4, although contacts with other NuRD subunits also contribute (Conomos et al, 2014; Yang et
        al, 2018). Acetylation of H4K5 and H4K8 increases at telomeres after knockdown of ZNF827 and overexpression
        of ZNF827 causes deacteylation in a manner that is dependent on the RRK motif, consistent with a model where
        ZNF827-mediated recruitment of NuRD supports nucleosome deacetylation (Conomos et al, 2014). NuRD recruitment
        displaces the shelterin complex from telomeres and with its deacetylation activity, promotes chromatin compaction
        (Conomos et al, 2014; Yang et al, 2018; reviewed in reviewed in Pickett and Reddel, 2015; Goo and Pickett,
        2022). NuRD additionally contributes to ALT through the recruitment of homologous recombination factors
        such as MCPH1 (Conomos et al, 2014; reviewed in Pickett and Reddel, 2015; Goo and Pickett, 2022).
