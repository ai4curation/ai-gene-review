      display_name: Interaction of NuRD complexes with transcription factors
      species: Homo sapiens
      summary: Numerous histone and DNA-binding domains in CHD, MTA, MBD and RBBP proteins contribute to the recruitment
        of the NuRD complex to DNA, where it appears to interact simultaneously with two adjacent nucleosomes (reviewed
        in Asamamaw et al, 2024; Reid et al, 2023). Recruitment to specific target genes is additionally mediated
        by protein-protein interactions between NuRD complex components and sequence-specific transcription factors,
        some of which are represented in this pathway (reviewed in Reid et al, 2023).
