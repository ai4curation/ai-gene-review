    bytes: 4018
    sha256: 9710c51d913d78e4b49a8412c0b81054ceb46e79253d43d8162906357edfc44e
    blob: d4f6868383b84599f3015bde2ef317f6610ac90b
    mode: '100644'
    header:
      stable_id: R-HSA-9843940
      display_name: Regulation of endogenous retroelements by KRAB-ZFP proteins
      species: Homo sapiens
      summary: Krüppel-associated box domain (KRAB) zinc finger proteins (KRAB-ZFPs) contain a transcriptionally
        repressive N-terminal domain, the KRAB domain, and a C-terminal domain, the ZFP domain, that contains 2-40
        zinc fingers and binds specific sequences of DNA (reviewed in Ecco et al. 2017, Yang et al. 2017). The human
        genome contains about 352 (Lukic et al. 2014), 378 (de Tribolet-Hardy et al. 2023), or 423 (Huntley et al.
        2006) KRAB-ZFP genes, making them the largest family of transcription regulators.<br>About two thirds or
        more of KRAB-ZFPs bind transposable elements (Schmitges et al. 2016, Imbeault et al. 2017, de Tribolet-Hardy
        et al. 2023) and KRAB-ZFPs appear to coevolve with retroelements such that a KRAB-ZFP binds and transcriptionally
        silences a specific set of retroelements (reviewed in Ecco et al. 2017). The number of KRAB-ZFP genes correlates
        with the number of retroelements in mammalian genomes and younger retroelements bind fewer KRAB-ZFPs, suggesting
        an "arms race" in which the evolution of new KRAB-ZFPs is driven by and lags the appearance of new transposable
        elements (Thomas and Schneider 2011, Jacobs et al. 2014, Imbeault et al. 2017, reviewed in Ecco et al. 2017,
        Yang et al. 2017).<br>The repressive action of KRAB-ZFPs is mediated by the scaffold protein TRIM28 (also
        called KAP1), the RBCC domain of which binds the N-terminal KRAB domains of KRAB-ZFPs (Friedman et al. 1996).
        TRIM28 autoSUMOylates and recruits effectors, such as the histone H3 lysine-9 trimethyltransferase SETDB1
        (also called ESET) (Schultz et al. 2002) and the NuRD repressor complex (Schultz et al. 2001).<br>The HUSH
        complex (MPHOSPH8:TASOR:PPHLN1) plays a nonredundant role with TRIM28 in silencing some young LINE1 retroelements,
        which are only weakly repressed by TRIM28 or HUSH alone (Robbez-Masson et al. 2018).
  available_cache: null
- path: reactome/R-HSA-9844594.md
  main_present: false
  main_git_tree_line: null
  disposition: prospective_missing_only
  actual_native:
    bytes: 6154
    sha256: c7e055e9538b4a3951909967dd5efdab0d851ba4039bd15036b369e088ad67aa
    blob: e26f9acab0bb1736b71a55d24f8e8bba842aa142
    mode: '100644'
    header:
      stable_id: R-HSA-9844594
      display_name: Transcriptional regulation of brown and beige adipocyte differentiation by EBF2
      species: Homo sapiens
      summary: EBF2 (Early B-cell factor 2) is a transcription factor that marks committed brown and beige preadipocytes.
        EBF2 cooperates with PPARG, a master regulator of adipogenesis, to activate the brown/beige adipocyte thermogenic
        program (inferred from mouse homologs in Rajakumari et al. 2013). In white adipocytes, the activity of EBF2
        is negatively regulated by binding of the transcription factor ZNF423, a key transcription factor for white
        adipocyte differentiation. In brown/beige fate-committed cells, the interaction between ZNF423 and EBF2
        is impeded by BMP7, which acts as a positive regulator of brown/beige adipogenesis (inferred from mouse
        homologs in Shao et al. 2016; Shao et al. 2021). Direct transcriptional targets of EBF2 include PRDM16,
        UCP1, and PPARA genes. Other marker genes of brown/beige adipocytes, such as CIDEA, PPARGC1A, COX7A, and
        DIO2 are positively regulated by EBF2 and probably also direct targets of EBF2 (inferred from mouse homologs
        in Rajakumari et al. 2013; Wang et al. 2014; Stine et al. 2016; Shapira et al. 2017; Lai et al. 2017; Angueira
        et al. 2020). Based on mouse studies, EBF1 may function partially redundantly with EBF2 in regulation of
        thermogenesis genes (Angueira et al. 2020). Transcriptional activity of EBF2 is positively regulated by
        binding of the long noncoding RNA (lncRNA) Blnc1 (inferred from mouse homologs in Zhao et al. 2014; Mi et
        al. 2017). Based on mouse studies, EBF2 was reported to recruit the BAF chromatin remodeling complex to
        activate the transcription of target genes (Shapira et al. 2017; Liu et al. 2020). In addition to PPARG,
        based on mouse studies, EBF2 was reported to cooperate with other transcription factors such as SIX1 during
        brown/beige adipogenesis (Brunmeir et al. 2016). Besides ZNF423, based on mouse studies, other transcription
        factors, such as ID1 (Patil et al. 2017) and TLE3 (Pearson et al. 2019), have been reported to act as inhibitors
        of EBF2-mediated transcription. The transcription factor GATA6 was reported to directly stimulate EBF2 transcription
        during mouse beige/brown thermogenesis (Jun et al. 2023). Besides BPM7, BPM9-mediated upregulation of FGFR3
        (Yamamoto et al. 2022), and FGF11 (Jiang et al. 2023) have been reported as indirect activators of EBF2
        transcriptional activity in mouse and goat, respectively. ZAG (Zinc-alpha2-glycoprotein), a tumor secretory
        factor, has been reported to stimulate EBF2 expression, which contributes to white adipose tissue browning
        and energy wasting in cancer-related cachexia (Elattar et al. 2018). In the single cell atlas of human white
        adipose tissue (Emont et al. 2022) it was reported that the EBF2-positive hAd6 white adipocyte subpopulation
        with UCP1 expression, consistent with the beige profile, shows an association with increased BMI and visceral
        adiposity. For review, please refer to Wang and Seale 2016.
  available_cache: null
- path: reactome/R-HSA-9845323.md
  main_present: false
  main_git_tree_line: null
  disposition: prospective_missing_only
  actual_native:
    bytes: 4896
    sha256: 0d02fc7794a51eb382754a70b8c0c198b0610a374e31bcc9b14f18b469ad62ed
    blob: fdf88bd370e069481762dc05e4e8c4312bc49826
    mode: '100644'
    header:
      stable_id: R-HSA-9845323
      display_name: Regulation of endogenous retroelements by Piwi-interacting RNAs (piRNAs)
      species: Homo sapiens
      summary: 'PIWI-interacting RNAs (piRNAs) are short RNAs of 24-31 nucleotides that are produced by cleavage
        of longer RNAs and amplification by a "ping-pong" mechanism involving rounds of strand hybridization and
        cleavage (reviewed in Sun et al. 2022). The piRNAs are loaded onto PIWI proteins (PIWIL1, PIWIL2, PIWIL4)
        that are then guided by base-pairing of the piRNAs to nascent and mature transcripts, where the PIWI:piRNA
        complexes initiate transcriptional and post-transcriptional silencing, respectively (reviewed in Czech et
        al. 2018, Onishi et al. 2021, Wang et al. 2023).<br>In mice, sources of piRNAs include transposon RNAs,
        long non-coding RNAs, exon transcripts, and RNAs from unannotated regions of the genome (Aravin et al. 2007,
        2008). Two populations of piRNAs are observed during mouse development: pre-pachytene piRNAs and pachytene
        piRNAs (Aravin et al. 2008, Gan et al. 2011). Pre-pachytene piRNAs are present prenatally in prospermatogonial
        cells and postnatally in spermatogonial cells. Pachytene piRNAs are present in more mature postnatal spermatocytes
        and spermatids. The piRNAs derived from retroelements comprise about half (Aravin et al. 2008) or less (Gan
        et al. 2011) of the total pre-pachytene piRNAs and the portion falls sharply from pre-pachytene to pachytene
        (Gan et al. 2011).<br>In mice, PIWIL2 (MILI, Piwil2 gene) is first detected in primordial germ cells that
        have reached the genital ridge and expression persists through meiosis in adults. PIWIL4 (MIWI2, PIWIl4
        gene) is present in mouse germ cells during de novo DNA methylation shortly before and after birth. PIWIL1
        (MIWI, PIWIL1 gene) is present during later stages of meiosis after birth (Aravin et al. 2008). PIWIL4 and
        PIWIL2 participate in re-methylation of the genome in mouse germ cells and consequent repression of transposable
        elements (Carmell et al. 2007, Aravin et al. 2008, Kuramochi-Miyagawa et al. 2008, Zoch et al. 2020). In
        mice, the piRNAs bound by PIWIL4 bind nascent transcripts of transposable elements and connects to the de
        novo DNA methylation machinery via SPOCD1 and C19ORF84 to direct DNA methylation to the transposable elements
        (Zoch et al. 2020, 2024). Mutations in SPOCD1 are associated with infertility in men (Zoch et al. 2024)'
