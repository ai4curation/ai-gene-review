      stable_id: R-HSA-9944091
      display_name: NuRD hydrolyzes ATP to affect nucleosome organization
      species: Homo sapiens
      summary: This reaction shows a generic representation of the histone ATP hydrolysis activity of the NuRD complex
        on a non-specific acetylated chromatin template. The NuRD complex is recruited to specific regions in the
        genome by virtue of the DNA- and histone-binding properties of its components, as well as through protein-protein
        interactions with sequence-specific transcription factors, some of which are illustrated in this pathway
        (reviewed in Asmamaw et al, 2024; Alendar and Berns, 2021). NuRD binds to a di-nucleosome substrate and
        interacts with adjacent acetylated nucleosomes (Millard et al, 2013). ATP hydrolysis activity is provided
        by the CHD component of the NuRD complex, with slightly different outcomes depending on which subunit is
        present and in which genomic context. CHD3 and CHD4 predominantly use the energy of ATP hydrolysis to slide
        nucleosomes, while CHD5 disrupts nucleosomes without sliding (Lusser et al, 2005; Liu et al, 2014; Hoffmeister
        et al, 2017; Quan and Yusufzai, 2014; Manning and Yusufzai, 2017; reviewed in Clapier et al, 2017; Alendar
        and Berns, 2021). Although it has not been conclusively demonstrated, it is thought that ATP-dependent nucleosome
        repositioning may facilitate access to the chromatin to allow other interactions, including the interaction
        of the HDAC components of NuRD with their substrates. Consistent with this, the NuRD complex is only able
        to promote deacetylation of nucleosome in the presence of ATP (Xue et al, 1998; Tong et al, 1998; Verreault
        et al, 1998).
