    header:
      stable_id: R-HSA-9940462
      display_name: MBD2, MBD3 and GATAD2A, GATAD2B bind core NuRD complex
      species: Homo sapiens
      summary: The core deacetylase module of the NuRD complex consisting of HDAC, MTA and RBBP proteins next recruits
        a sub-module containing, minimally, MDB proteins 2 or 3 and GATAD2A or GATAD2B (Marhold et al, 2004; Brackertz
        et al, 2002; Brackertz et al, 2006; Gnanapragasam et al, 2011; Kloet et al, 2015; Desai et al, 2015; Spruijt
        et al, 2021; reviewed in Leighton and Williams, 2020). Some studies indicate that CHD3 or 4 is additionally
        recruited as part of this module (Low et al, 2020). Crosslinking, interaction and purification studies suggest
        that overall the complex has a stoichiometry of 4:2:2:1:1 (RBBP:MTA:HDAC:MBD:GATAD2), with the CHD subunit,
        when present, more loosely associated and sometimes substoichiometric (Tabar et al, 2017; Low et al, 2020).
        MBD2 and MBD3 are members of a family of methyl-binding domain proteins. MBD2 binds preferentially to methylated
        CpG islands while MBD3 has similar binding affinity for both methylated and unmethylated DNA (Cramer et
        al, 2014; Liu et al, 2019; Liu et al, 2018). MBD2 and MBD3 are mutually exclusive in the NuRD complex, with
        MBD2-containing NuRD complexes more prevalent at sites of repression and those with MBD3 more highly associated
        with gene activation (Le Guezennec et al, 2006; Gunther et al, 2013; Shimbo et al, 2013; reviewed in Leighton
        and Williams, 2020). MDB proteins interact with GATAD2A/GATAD2B (also known as p66 alpha and beta, respectively)
        through a coiled coil region in the GATAD2 proteins (Gnanapragasam et al, 2011; Brackertz et al, 2002; Brackertz
        et al, 2006; Walavalkar et al, 2013). The function of the GATAD2 proteins in the NuRD complex is not well
        established, but they appear to play a role in recruiting the CHD component of the complex (Torrado et al,
        2017; Zhang et al, 2016; Low et al, 2016; Low et al, 2020; Gnanapragasam et al, 2011; Brackertz et al, 2002;
        Spruijt et al, 2016; reviewed in Leighton and Williams, 2020). Although some studies indicate that the GATAD
        proteins may exist as homodimers (Spruijt et al, 2016), that is not depicted in this pathway to be consistent
        with the consensus on complex stoichiometry. MBD proteins appear to compete for MTA binding with PWWP2A
        and PWWP2B, chromatin binding proteins that form an alternative complex with the NuRD core, effectively
        decoupling the NuRD histone deacetylase complex from the ATPase-dependent chromatin repositioning  (Zhang
        et al, 2018; Link et al, 2018; reviewed in Reid et al, 2023).
