      display_name: GATAD2B is SUMOylated
      species: Homo sapiens
      summary: GATAD2B is SUMOylated at lysine residues K33 (Gong et al, 2006). SUMOylation of GATAD2B contributes
        to the repressive activity of the NuRD complex, and mutation of K33 reduces the interaction of GATAD2B with
        RBBP4 in HEK293 and NIH 3T3 cells (Gong et al, 2006). Post-translational modifications of NuRD components
        may alter the compositional bias of the complex and in this way affect function (reviewed in Reid et al,
        2023; Torchy et al, 2015).
