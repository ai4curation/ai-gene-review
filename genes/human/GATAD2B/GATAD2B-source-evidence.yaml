    header:
      stable_id: R-HSA-73762
      display_name: RNA Polymerase I Transcription Initiation
      species: Homo sapiens
      summary: During initiation the double-stranded DNA must be melted and transcription begins. SL1 forms and
        interacts with UBTF and the rDNA promoter. It is this platform that will recruit active RNA polymerase I
        to the SL1:phosphorlated UBTF:rDNA promoter complex.<p>Mammalian rRNA genes are preceded by a terminator
        element that is recognized by the SL1 complex. This SL1-modulated acetylation of the basal Pol I transcription
        machinery has functional consequences suggesting that the reversible acetylation may be one way to regulate
        rDNA transcription.
