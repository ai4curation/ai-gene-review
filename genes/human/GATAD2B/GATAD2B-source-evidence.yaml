    header:
      stable_id: R-HSA-9944706
      display_name: NuRD binds TCF19 at FBP1 gene
      species: Homo sapiens
      summary: 'NuRD is recruited to the promoter of genes involved in gluconeogenesis such as FBP1, PCK1 and G6PC
        by the transcription factor TCF19 (Sen et al, 2017). TCF19 binds to nucleosomes through an interaction of
        its plant homeodomain (PH) finger with H3K4me3 marks on the nucleosome, an interaction that is enhanced
        under high glucose conditions under which gluconeogenic genes are downregulated (Sen et al, 2017; Mondal
        et al, 2020). Expression of FBP1, PCK1 and G6PC is upregulated in TCF19 knockdown cells (Sen et al, 2017).
        <br>CHD4 and TCFC19 reciprocally co-immunoprecipitate in HePG2 cells under both high and low glucose conditions
        (Sen et al, 2017).  NuRD is recruited to gluconeogenic genes by TCF19, as occupancy of NuRD components such
        as CHD4, MTA1 and HDAC1 at these promoters is abrogated when TCF19 is knocked down, as assessed by ChIP
        (Sen et al, 2017). Recruitment of TCF19, and by extension, NuRD affects the acetylation marks at gluconeogenic
        genes: under low glucose conditions, gluconeogenic genes are enriched for epigenetic marks such as H4K5Ac,
        H4K8Ac and H3K9Ac associated with active chromatin; these marks are lost under high glucose conditions in
        a manner that depends on TCF19 (Sen et al, 2017).'
