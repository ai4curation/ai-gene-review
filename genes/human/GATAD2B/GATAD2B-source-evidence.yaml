      display_name: PHF6 binds NuRD
      species: Homo sapiens
      summary: 'PHF6 (Plant homeodomain finger 6) is an incompletely characterized C4HC3 zinc-finger-containing
        protein that has been shown to interact with components of the NuRD complex including CHD4, CHD3, RBBP4
        and HDAC1 (Todd and Picketts, 2012; Liu et al, 2014; Liu et al, 2015). PHF6 has two imperfect zinc finger
        PHD domains, demonstrated in other proteins to function as chromatin readers and as mediators of protein-protein
        interactions (reviewed in Gaurav and Kutateladze, 2023; Sanchez and Zhou, 2011). Consistent with this, PHF6
        has been shown to bind to histone H3 in B-ALL cells, to colocalize with sites of activating H3K27ac and
        H3K4me3 marks and to upregulate genes associated with B-cell lineage (Soto-Feliciano et al, 2017). In other
        contexts, however, PHF6 appears not to contact histones but rather to interact non-specifically with double-stranded
        DNA through a positively charged surface (Liu et al, 2014). PHF6 acts as a transcriptional repressor when
        tethered to a GAL4 DNA-binding domain in a reporter gene assay in HEK293 cells; knockdown of RBBP4 abrogated
        the transcriptional repression mediated by PHF6 (Liu et al, 2015).<br>Mutations in PHF6 are associated with
        the X-linked neurodevelopmental disorder Borjeson-Forssman-Lehman Syndrome as well as with T-cell acute
        lymphoblastic leukemia (T-ALL) and acute myeloid leukemia (AML) (reviewed in Jahani-Asl et al, 2016; Eisa
        et al, 2023; Fan et al, 2024). '
