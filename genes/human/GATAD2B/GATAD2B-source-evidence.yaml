    mode: '100644'
    header:
      stable_id: R-HSA-9940468
      display_name: CHD and CDK2AP subunits are recruited to NuRD
      species: Homo sapiens
      summary: Class II family CHD proteins CHD3, 4 and 5 appear to be more loosely associated with the fully formed
        NuRD complex (Zhang et al, 2016). Recruitment to the partial complex may be mediated by interaction of the
        C-terminal portion of CHD with a highly conserved region in the GATAD2 proteins (Torrado et al, 2017; Sher
        et al, 2019; reviewed in Leighton and Williams, 2020; Reid et al, 2023). <br>CHD3, CHD4 and CHD5 form distinct
        NuRD complexes with varied biological roles (Hoffmeister et al, 2017; Kolla et al, 2015; Miccio et al, 2010;
        reviewed in Alendar and Berns, 2021; Boulasiki et al, 2023; Eusterman et al, 2024; Asmamaw et al, 2024).
        CHD3 and CHD4 are widely expressed, while CHD5 is highly expressed in the nervous system and in testis (Zhuang
        et al, 2014, reviewed in Kolla et al, 2014; Reid et al, 2023). Studies in mouse suggest that changes in
        CHD component of the NuRD complex may regulate biological function during neuronal development (Nitarska
        et al, 2016).<br>Proteomic analysis identified CDK2AP1 or CDK2AP2 as additional members of the NuRD complex
        that, like CHD, are more loosely associated (Le Guezennec et al, 2006; Spruijt et al, 2010; Spruijt et al,
        2021). Interaction between CHD and CDK2AP appears to mediate the association with the NuRD complex (Le Guezennec
        et al, 2006; Spruijt et al, 2021). The role of the CDK2AP protein in the NuRD complex is not well elucidated.<br><br>
