id: Q8WXI9
gene_symbol: GATAD2B
product_type: PROTEIN
aliases:
- P66beta
- KIAA1150
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: GATAD2B encodes p66β, a nuclear chromatin-associated regulatory subunit of the nucleosome remodeling
  and deacetylase (NuRD) complex. It connects MBD proteins and histone tails to the remodeling machinery, supports
  transcriptional repression, and helps target MBD3 to discrete nuclear loci. GATAD2B supplies structural and regulatory
  interactions, while CHD and HDAC subunits carry out ATP-dependent remodeling and histone deacetylation. GATAD2A-
  and GATAD2B-containing assemblies can have distinct recruitment properties, including specialized p66β recruitment
  to telomeres in alternative-lengthening cells. Human loss-of-function variants cause GATAD2B-associated neurodevelopmental
  disorder (GAND), with intellectual disability and impaired speech development. Neuronal depletion of the fly ortholog
  disrupts learning and synaptic morphology; the specific human neuronal mechanism remains unresolved.
status: COMPLETE
