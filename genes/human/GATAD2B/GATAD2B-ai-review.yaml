suggested_questions:
- question: Does human GATAD2B directly recognize particular DNA sequences as inferred from the p66-family phylogeny,
    and, if so, which endogenous loci and how does that recognition cooperate with recruitment through transcription
    factors and MBD proteins?
- question: Which fate-specification, stem-cell differentiation and positive-transcription effects of NuRD are executed
    specifically by GATAD2B-containing assemblies rather than GATAD2A-containing assemblies?
- question: Do the p66β nuclear puncta described in early studies colocalize with established splicing-speckle markers,
    or represent distinct NuRD-associated chromatin domains?
- question: How do p66β-specific interactions organize the MBD/core-to-CHD connection, and which bridging details
    inferred from p66α domain experiments can be demonstrated directly for p66β?
- question: Which NuRD-dependent neuronal changes connect human GATAD2B loss of function to GAND, and which mechanisms
    explain the learning and synaptic phenotypes observed after fly simjang depletion?
suggested_experiments:
- description: Combine sequence-defined full-length human p66β and domain mutants with biochemical DNA-selection/binding
    assays and matched endogenous chromatin-occupancy measurements, separating direct recognition from recruitment
    by interacting proteins.
- description: Use acute paralog-selective depletion with expression-matched p66β rescue, NuRD composition measurements
    and nascent-transcription assays in the relevant differentiation or activating context to distinguish beta-specific
    participation from loss of another NuRD subunit.
- description: Test endogenous p66β localization with validated splicing-speckle markers and chromatin-associated
    NuRD markers, preserving cell type and perturbation conditions rather than classifying nuclear puncta by appearance
    alone.
