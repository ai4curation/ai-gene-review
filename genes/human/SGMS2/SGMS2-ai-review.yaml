  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: The demonstrated PE-dependent ceramide phosphoethanolamine synthesis needs a donor-correct
      term.
    action: MODIFY
    reason: The live GO:0002950 definition specifies CDP-ethanolamine as donor and CMP as a product. The
      SMS2 assays instead establish transfer from phosphatidylethanolamine (PE), producing diacylglycerol,
      so the reaction-specific identifier does not match the demonstrated chemistry. Retain the genuine
      PE-dependent activity through the broader phosphotransferase term and request a donor-specific ontology
      term. This is not evidence that SMS2 lost CPE synthesis. PMID:39510177 Fig. 3E reports about 46%
      relative PE-plus-ceramide DG production in detergent micelles; Fig. 4C reports about 6% in proteoliposomes,
      both relative to SMS plus PC-PLC DG production. Neither establishes an invariant 46% of SMS activity
      in cells.
