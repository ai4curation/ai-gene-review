proposed_new_terms:
- proposed_name: phosphatidylethanolamine:ceramide ethanolaminephosphotransferase activity
  proposed_definition: Catalysis of the transfer of phosphoethanolamine from a phosphatidylethanolamine
    to a ceramide, producing a ceramide phosphoethanolamine and a diacylglycerol.
  justification: GO:0002950 currently specifies the distinct CDP-ethanolamine-dependent reaction. SMS2
    has direct PE-dependent CPE synthesis evidence, including detergent-free reconstitution. OLS searches
    did not identify a GO molecular-function term specifying this donor/acceptor combination. The proposal
    distinguishes the phospholipid donor from a nucleotide-activated donor without assigning an invented
    GO identifier.
  proposed_parent:
    id: GO:0016780
    label: phosphotransferase activity, for other substituted phosphate groups
  supported_by:
  - reference_id: PMID:39510177
    supporting_text: SMS and CPES activities of SMS2 were clearly detected.
  - reference_id: file:human/SGMS2/SGMS2-uniprot.txt
    supporting_text: phosphoethanolamine head group of phosphatidylethanolamine
