- term:
    id: GO:0047493
    label: ceramide cholinephosphotransferase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: Phylogenetically inferred ceramide cholinephosphotransferase activity. The GO term GO:0047493
      is defined as the CDP-choline-dependent reaction (CDP-choline + ceramide -> CMP + sphingomyelin).
      SGMS2 explicitly does NOT use CDP-choline (or free phosphorylcholine) as donor; its donor is phosphatidylcholine.
      This is a mislabel of the true PC-dependent sphingomyelin synthase reaction.
    action: MODIFY
    reason: UniProt FUNCTION states the enzyme does not use free phosphorylcholine or CDP-choline as donors
      (PubMed:14685263). The correct PC-dependent term is GO:0033188 sphingomyelin synthase activity,
      not the CDP-choline-route GO:0047493.
    proposed_replacement_terms:
    - id: GO:0033188
      label: sphingomyelin synthase activity
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      source_entities:
      - source_id: PANTHER:PTN000480004
        source_label: PTN000480004
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: The positive node is an ancestor, but GO:0047493 specifies CDP-choline whereas the target
          experiments establish PC-dependent GO:0033188. This is a source/term chemistry mismatch, not
          a wrong-paralog propagation.
