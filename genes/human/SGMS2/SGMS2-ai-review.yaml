gene_symbol: SGMS2
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SGMS2 encodes sphingomyelin synthase 2 (SMS2), an integral membrane enzyme that transfers
  phosphocholine from phosphatidylcholine to ceramide, forming sphingomyelin and diacylglycerol. It acts
  mainly at the plasma membrane and also at the Golgi, maintaining membrane sphingomyelin and influencing
  local diacylglycerol and ceramide pools. The enzyme can catalyze the reverse transfer from sphingomyelin
  to diacylglycerol, regenerating ceramide and phosphatidylcholine. SMS2 also transfers phosphoethanolamine
  from phosphatidylethanolamine to ceramide and hydrolyzes phosphatidylcholine and phosphatidylethanolamine
  in purified-enzyme assays; the relative activities depend strongly on the membrane or detergent environment.
  Heterozygous pathogenic variants cause osteoporosis and skeletal dysplasia. Some variants retain catalytic
  activity but accumulate in the endoplasmic reticulum, disrupting the normal distribution of sphingomyelin
  across cellular membranes.
