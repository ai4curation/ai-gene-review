core_functions:
- description: Constitutively active class A G protein-coupled receptor that engages
    Galpha12/13 in the absence of any added agonist. Cryo-EM of the ligand-free receptor
    together with BRET2 G-protein profiling shows moderate basal activation of Galpha12
    with weaker Galphai/o coupling, and knockout of GPR50 in neural progenitor cells
    and hypothalamic tanycytes increases neurite outgrowth, motility and migration through
    loss of G12/13-RhoA signalling. This ligand-independent, growth-restraining output
    is the best-supported signalling function of the receptor; no endogenous agonist
    is agreed on.
  molecular_function:
    id: GO:0004930
    label: G protein-coupled receptor activity
  directly_involved_in:
  - id: GO:0035025
    label: positive regulation of Rho protein signal transduction
  - id: GO:0010977
    label: negative regulation of neuron projection development
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:41666959
    supporting_text: We showed that GPR50 exhibits moderate constitutive activity through
      interaction with Gα12.
  - reference_id: PMID:40091563
    supporting_text: Collectively, we show that GPR50 acts as an inhibitor of neurite
      growth and cell migration in the brain by activating the G12/13 protein-RhoA pathway.
  - reference_id: PMID:40091563
    supporting_text: Here, we generated GPR50 knockout (GPR50-KO) mice and show that
      the absence of GPR50 increases neurite outgrowth, cell motility and migration of
      isolated neural progenitor cells (NPCs) and hypothalamic radial glial cells (tanycytes).
- description: Negative regulator of the MT1 melatonin receptor. GPR50 heterodimerizes
    constitutively and specifically with MT1 and MT2; in the MT1 heterodimer it abolishes
    high-affinity agonist binding and G-protein coupling by the MT1 protomer, whereas
    MT2 function is unaffected. The large C-terminal tail is required for the inhibition
    but not for the heterodimerization itself. This is GPR50's only well-documented
    connection to melatonin biology, and it is inhibitory rather than a melatonin-sensing
    activity of its own.
  molecular_function:
    id: GO:0030547
    label: signaling receptor inhibitor activity
  directly_involved_in:
  - id: GO:0045744
    label: negative regulation of G protein-coupled receptor signaling pathway
  locations:
  - id: GO:0005886
    label: plasma membrane
  in_complex:
    id: GO:0038039
    label: G protein-coupled receptor heterodimeric complex
  supported_by:
  - reference_id: PMID:16778767
    supporting_text: We show that GPR50, an orphan GPCR, heterodimerizes constitutively
      and specifically with MT(1) and MT(2) melatonin receptors, using biochemical and
      biophysical approaches in intact cells.
  - reference_id: PMID:16778767
    supporting_text: Whereas the association between GPR50 and MT(2) did not modify MT(2)
      function, GPR50 abolished high-affinity agonist binding and G protein coupling
      to the MT(1) protomer engaged in the heterodimer.
- description: Releasable C-terminal signalling module. Calcium-activated calpain cleaves
    GPR50 between Phe-408 and Ser-409, liberating the long cytoplasmic C-terminal domain,
    which translocates into the nucleus using a 'DPD' motif and associates with the
    general transcription factor TFII-I/GTF2I to regulate FOS transcription. This is
    a transcriptional output of the receptor that does not require G proteins or arrestins,
    and it is why this gene carries a nuclear localisation annotation despite being
    a seven-transmembrane protein.
  directly_involved_in:
  - id: GO:0006357
    label: regulation of transcription by RNA polymerase II
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:31900622
    supporting_text: Here, we report an alternative signal transduction mode used by
      the orphan GPR50 that relies on the nuclear translocation of its carboxyl-terminal
      domain (CTD).
  - reference_id: PMID:31900622
    supporting_text: The cytosolic CTD then translocates into the nucleus assisted by
      its 'DPD' motif, where it interacts with the general transcription factor TFII-I
      to regulate c-fos gene transcription.
suggested_questions:
- question: Is Little-LEN (L-LEN), the ProSAAS-derived 10-mer proposed in 2026, the endogenous
    agonist of GPR50? The claim rests on a single laboratory using one method (genetically
    encoded photo-cross-linking from hypothalamic extract), and a cryo-EM study published
    five weeks later states that no endogenous agonist has been characterized without
    citing or engaging the L-LEN result. Independent replication in a second laboratory,
    ideally with a binding assay orthogonal to cross-linking, is needed before a ligand-specific
    molecular function term is justified.
- question: Which G protein does GPR50 actually use in vivo? The L-LEN study reports
    dominant Galphai coupling with pertussis-toxin-sensitive inhibition of forskolin-evoked
    cAMP, whereas both the cryo-EM/BRET2 study and the GPR50 knockout mouse work place
    the principal output on Galpha12/13-RhoA. These have not been reconciled in a common
    system, and they imply different downstream biology (metabolic cAMP signalling versus
    cytoskeletal growth restraint).
- question: Should InterPro:IPR000025 (melatonin receptor family) continue to generate
    a GO:0008502 melatonin receptor activity mapping for GPR50? The signature is a family
    signature and GPR50 is a documented non-binder; the mapping should either be blocked
    for this protein or the InterPro2GO rule narrowed to the signatures that actually
    imply melatonin binding.
- question: Is the constitutive activity seen in heterologous cells a property of the
    receptor itself or of overexpression? Distinguishing true agonist-independent activity
    from mass-action coupling matters for whether GPR50 should be modelled as a constitutively
    active receptor or as a receptor whose agonist has simply not been found.
- question: Does the calpain-released C-terminal domain act independently of the membrane-bound
    core, and is the proportion of receptor that is cleaved under physiological calcium
    large enough for the nuclear route to be a major output?
suggested_experiments:
- hypothesis: L-LEN is a genuine endogenous agonist of GPR50.
  description: Replicate the L-LEN pairing in an independent laboratory using assays
    that do not depend on covalent capture - saturation and competition binding with
    labelled L-LEN on membranes from GPR50-expressing and GPR50-null cells, plus a full
    TRUPATH G-protein panel comparing basal and L-LEN-stimulated coupling side by side
    for Galphai1/2/3, Galpha12 and Galpha13 in the same cells.
  experiment_type: pharmacology
- hypothesis: The Galphai (L-LEN) and Galpha12/13 (constitutive) readouts are both real
    and reflect ligand-directed coupling rather than a discrepancy between laboratories.
  description: In a single cell background, measure GPR50 coupling to Galphai and to
    Galpha12/13 with and without L-LEN, with and without pertussis toxin, and with the
    ECL2/TM6 variants that the chimera work identified as activation-critical, to see
    whether the ligand switches the receptor between transducers.
  experiment_type: signalling
- hypothesis: GPR50 does not bind melatonin under any condition relevant to the IEA
    annotation.
  description: Repeat the negative melatonin binding result on the modern reagents -
    saturation binding with 2-iodomelatonin on purified GPR50 in nanodiscs, alongside
    MT1 as a positive control, and a thermal-shift or mass-photometry ligand-binding
    readout. A clean, quantitative modern negative would let the InterPro2GO mapping
    be retired with a citable reference rather than a chain of assertions.
  experiment_type: biochemistry
- hypothesis: The G12/13-RhoA growth-restraining function is the physiological core function.
  description: In GPR50 knockout mice, test whether the neurite-outgrowth and tanycyte-migration
    phenotypes are rescued by wild-type GPR50 but not by a Galpha12/13-uncoupled receptor
    variant, and whether they are insensitive to loss of L-LEN/ProSAAS.
  experiment_type: mouse genetics
