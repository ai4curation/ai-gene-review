id: Q13585
gene_symbol: GPR50
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'Class A seven-transmembrane receptor of the melatonin-receptor subfamily,
  expressed mainly in hypothalamus (including tanycytes) and pituitary, and distinguished
  by the absence of N-glycosylation sites and by an exceptionally long (>300 residue)
  cytoplasmic C-terminal tail. Despite its family membership GPR50 does not bind melatonin:
  the receptor failed to bind radiolabelled melatonin when first expressed, and reciprocal
  swaps of the second extracellular loop between GPR50 and MT1 show that loop divergence
  is what makes GPR50 melatonin-unresponsive. A cryo-EM structure of the ligand-free
  receptor shows an inactive-like state with a putative pocket and ligand access channels
  unlike those of the melatonin receptors, together with moderate constitutive coupling
  to Galpha12 and weaker coupling to Galphai/o. Constitutive, agonist-independent signalling
  through G12/13 and RhoA restrains neurite outgrowth and cell migration in neural progenitor
  cells and tanycytes. GPR50 also heterodimerizes constitutively with the MT1 melatonin
  receptor and abolishes high-affinity agonist binding and G-protein coupling by the MT1
  protomer, and it interacts with NOGO-A/RTN4, KAT5/TIP60 and ADAM17. Calpain-1 cleaves
  the receptor between Phe-408 and Ser-409, releasing a C-terminal domain that translocates
  to the nucleus and acts with the transcription factor GTF2I on FOS transcription. Whether
  GPR50 has an endogenous agonist is disputed: the neuropeptide Little-LEN, derived from
  the ProSAAS precursor, has been proposed as its ligand in a single 2026 study reporting
  Galphai coupling and a role in energy expenditure and thermogenesis, while a cryo-EM
  study published weeks later states that no endogenous agonist has been characterized.
  Genetic variants at the locus have been associated with mood disorders and other neuropsychiatric
  phenotypes.'
