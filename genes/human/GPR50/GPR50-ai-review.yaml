  review:
    summary: Phylogenetic assertion that GPR50 is a functional G protein-coupled receptor.
      This is supported by direct evidence, although the activity observed so far is
      constitutive rather than agonist-driven.
    action: ACCEPT
    reason: Confirmed experimentally. A cryo-EM structure plus TRUPATH BRET2 profiling
      of the ligand-free receptor shows productive engagement of Galpha12 with weaker
