- term:
    id: GO:0008502
    label: melatonin receptor activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: An electronic assignment of melatonin receptor activity derived from the
      melatonin-receptor family signature InterPro:IPR000025. GPR50 is melatonin-related
      by sequence but does not bind melatonin, and this has been shown repeatedly and
      never contradicted.
    action: REMOVE
    reason: 'This is a family-signature mis-mapping that the primary literature directly
      contradicts. Three independent lines of evidence: (i) the paper that first cloned
      and expressed the receptor reported that it did not bind either iodinated or tritiated
      melatonin in COS-1 cells; (ii) Clement et al. showed by reciprocal chimeras that
      divergence of the second extracellular loop is the structural reason GPR50 is melatonin-unresponsive,
      and that restoring MT1 E2-loop residues confers melatonin responsiveness on GPR50
      - i.e. wild-type GPR50 is melatonin-blind by design; (iii) the 2026 cryo-EM structure
      restates that melatonin does not bind GPR50 and shows that its putative pocket
      and ligand access channels differ from those of the melatonin receptors. GPR50
      matches IPR000025 by descent, not by pharmacology. Because this is an unsupported
      electronic inference that can be argued against on direct biological grounds, REMOVE
      is the appropriate action rather than demotion. Note the irony that GPR50 does
      have a documented relationship to melatonin signalling, but an inhibitory one:
      in the GPR50-MT1 heterodimer it abolishes high-affinity agonist binding and G-protein
      coupling by MT1.'
    supported_by:
    - reference_id: PMID:8647286
      supporting_text: H9 transiently expressed in COS-1 cells did not bind [125I]melatonin
        or [3H]melatonin.
    - reference_id: PMID:28898928
      supporting_text: showing how evolutionary processes appear to have selected for
        modifications in the E2 loop in order to make GPR50 unresponsive to melatonin.
    - reference_id: PMID:41666959
      supporting_text: However, melatonin does not bind to GPR50 (Clement et al., 2017),
        and GPR50 is not directly involved in the melatonin-related pathways.
    - reference_id: PMID:40091563
      supporting_text: GPR50 is an orphan GPCRs belonging to the melatonin receptor subfamily
        and represents 45% sequence homology with melatonin MT1 and MT2 receptors in
        humans but does not bind melatonin or any other known ligand
