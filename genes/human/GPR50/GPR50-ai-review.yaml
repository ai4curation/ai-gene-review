- id: PMID:8647286
  title: Cloning of a melatonin-related receptor from human pituitary.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (FEBS Lett 1996;386:219-24, Reppert et al.). The founding
      description of GPR50/H9. Directly reports the absence of melatonin binding, which
      is the key evidence against the GO:0008502 IEA.
- id: PMID:16778767
  title: The orphan GPR50 receptor specifically inhibits MT1 melatonin receptor function
    through heterodimerization.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (EMBO J 2006;25:3012-23, Levoye et al.). Establishes
      the MT1-inhibitory heterodimer that underlies the core_functions entry.
- id: PMID:19699797
  title: GPR50 interacts with neuronal NOGO-A and affects neurite outgrowth.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified. Source of the postsynaptic-density localisation. Note
      that its overexpression result (GPR50 increases neurite length) is opposite in
      sign to the later knockout result; the loss-of-function direction is the more reliable
      one.
- id: PMID:21858214
  title: GPR50 interacts with TIP60 to modulate glucocorticoid receptor signalling.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified. Supports the plasma membrane EXP annotation and the
      KAT5/TIP60 interaction.
- id: PMID:25416956
  title: A proteome-scale map of the human interactome network.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: High-throughput interactome screen; the GPR50-ZNF572 pair has no follow-up.
- id: PMID:28898928
  title: Importance of the second extracellular loop for melatonin MT(1) receptor function
    and absence of melatonin binding in GPR50.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (Br J Pharmacol 2018;175:3281-97, Clement et al.). The
      mechanistic explanation for why GPR50 does not bind melatonin, and the basis for
      removing GO:0008502. The cached title is missing a space after 'MT' because the
      PubMed record drops the subscript.
- id: PMID:31900622
  title: 'GPR50-Ctail cleavage and nuclear translocation: a new signal transduction
    mode for G protein-coupled receptors.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified. Source of the nucleus EXP annotation and of the C-terminal
      domain core function.
- id: PMID:32405532
  title: GPR50 Promotes Hepatocellular Carcinoma Progression via the Notch Signaling
    Pathway through Direct Interaction with ADAM17.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Single-study cancer-cell result; recorded but not used for a core function.
- id: PMID:40091563
  title: Orphan GPR50 Restrains Neurite Outgrowth and Cell Migration by Activating the
    G(12/13) Protein-RhoA Pathway in Neural Progenitor Cells and Tanycytes.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (J Pineal Res 2025;77:e70041, Ahmad et al.). Knockout-mouse
      evidence for constitutive, ligand-independent G12/13-RhoA signalling.
- id: PMID:41495223
  title: Photo-cross-linking-assisted deorphanization deciphers GPR50-L-LEN pairing
    in metabolism.
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: PubMed-verified (Nat Chem Biol 2026;22:1132-43, Wu et al.). Technically
      strong single-laboratory deorphanization proposing L-LEN as the endogenous agonist,
      with Galphai coupling. Marked DISPUTED rather than VERIFIED because a cryo-EM study
      published five weeks later states that no endogenous agonist has been characterized
      without engaging this result, and because the reported transducer (Galphai) conflicts
      with the Galpha12/13 coupling reported by two other groups. No GO annotation has
      been made on this basis, and none should be until it is independently replicated.
- id: PMID:41666959
  title: Structure of the melatonin-related orphan receptor, GPR50.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (Mol Cells 2026;49:100331, Shin et al.). Cryo-EM structure
      of the ligand-free receptor plus BRET2 basal-activity profiling. Its statement
      that endogenous agonists have not been characterized is what puts it in direct
      tension with the L-LEN paper.
