  - ensembl:ENSMUSP00000021750
  review:
    summary: type B pancreatic cell apoptotic process overstates the beta-cell perturbation evidence for RYR2.
    action: MARK_AS_OVER_ANNOTATED
    reason: Johnson et al. found that inhibiting RyR2 increased apoptosis in human and mouse beta-cells and placed
      calpain-10 downstream of the ryanodine-induced death pathway; that supports a survival role for RyR2-dependent
      Ca2+ handling, but not direct execution of the apoptotic process itself.
