id: Q92736
gene_symbol: RYR2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: RYR2 encodes the cardiac ryanodine receptor, the homotetrameric Ca2+-release channel of junctional
  sarcoplasmic-reticulum membrane in cardiomyocytes. Ca2+ influx through L-type calcium channels activates RYR2 to
  release stored SR Ca2+ into the cytosol, driving cardiac excitation-contraction coupling and shaping heart rate,
  contractile force and calcium-dependent action-potential physiology.
