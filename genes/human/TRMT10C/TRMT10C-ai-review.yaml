id: Q7L0Y3
gene_symbol: TRMT10C
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  TRMT10C (MRPP1) is a nuclear-encoded mitochondrial matrix protein of the TRM10/SPOUT methyltransferase
  family. With the short-chain dehydrogenase HSD17B10 (MRPP2) it forms a subcomplex that methylates N1
  of guanosine or adenosine at position 9 of mitochondrial tRNAs, and the same subcomplex combines with
  the metallonuclease PRORP (MRPP3) to form proteinaceous mitochondrial RNase P, which excises tRNAs from
  polycistronic mtDNA transcripts by 5'-end cleavage. The MRPP1-MRPP2 subcomplex also acts as a tRNA maturation
  platform, retaining the tRNA for ELAC2-mediated 3'-end processing and presentation to the CCA-adding
  enzyme, and TRMT10C installs a single m1A in the MT-ND5 mRNA. Biallelic TRMT10C variants destabilise
  MRPP1, impair mitochondrial RNA processing and translation, and cause a fatal infantile multisystem
  disorder with combined respiratory-chain deficiency (COXPD30).
