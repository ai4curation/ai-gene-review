- term:
    id: GO:0004526
    label: ribonuclease P activity
  evidence_type: IDA
  original_reference_id: PMID:18984158
  qualifier: contributes_to
  review:
    summary: >-
      Proposed annotation not in GOA. TRMT10C is one of the three proteins whose combination reconstitutes
      mitochondrial RNase P activity, and the one that binds the pre-tRNA and holds it for cleavage; PRORP
      carries the metallonuclease moiety.
    action: NEW
    reason: >-
      The qualifier is contributes_to and not enables because TRMT10C does not do the chemistry -
      reconstitution requires all three subunits, and the nuclease activity is PRORP's - while TRMT10C is
      not merely present either: it binds the pre-tRNA and positions it, so in_complex GO:0030678 alone
      would understate it. GO:0004526 is absent from TRMT10C-goa.tsv, which carries the complex membership
      (GO:0030678, part_of) but no RNase P molecular function.

      This is how GO annotates the paralogous case. The nuclear RNase P holoenzyme's catalytic moiety is
      the RPPH1 RNA rather than any protein, and QuickGO splits GO:0004526 by qualifier accordingly:
      RPPH1 carries enables - as do ten further RNAcentral ncRNA ids, itemised in the notes, which are
      not themselves RPPH1 entries and three of which are lnc-* entries named against CCNB1IP1 and
      PDGFC, so those ten read as electronic propagation rather than as curated nuclear holoenzyme
      subunits. Two facts that could look like further marks against the ten are class-level and so
      differentiate nothing - all fourteen ncRNA enables rows are IEA, RPPH1's four included, and none
      of the fourteen is recorded as a member of the nucleolar complex - while
      the holoenzyme's ten protein subunits - POP1, POP4, POP5, POP7, RPP14,
      RPP21, RPP25, RPP30, RPP38 and RPP40 - carry contributes_to, every one by IDA. That is the
      comparator set CLAUDE.md asks for: ten gene products standing in this row's role, all carrying
      this row's term with this row's qualifier. The qualifier split follows the evidence code rather
      than being absolute - POP5, RPP30 and RPP40 each also carry an enables row, by IEA or TAS - but
      every IDA row on a nuclear protein subunit is contributes_to, and PRORP is the only protein in
      either complex carrying enables by direct assay, because in the mitochondrial complex the
      catalyst is a protein. So the experimental curation lines up behind contributes_to for the
      subunits and only the electronic and author-statement rows do not.
      The two mitochondrial accessory subunits are the outliers rather than the convention: neither
      TRMT10C nor HSD17B10 carries GO:0004526 in GOA.

      HSD17B10's review does make a recorded choice here, and a different one: its third core function
      models the same moonlighting subunit role as GO:0000049 tRNA binding with in_complex GO:0030678,
      and its proposed_new_terms is an explicit empty list. That review carries 101 reviewed rows and
      three authored core functions, so its status: INITIALIZED is stale metadata rather than a signal
      that nobody has looked. Under the nuclear comparator above it warrants the same contributes_to
      proposal; flagged rather than changed here, since HSD17B10 is outside this slice. The gap between
      the two reviews is narrower than a bare GO:0004526 comparison suggests: both carry GO:0000049
      and GO:0030678, and this row is the one addition.
    supported_by:
    - reference_id: PMID:18984158
      supporting_text: >-
        we identified the components of human mitochondrial RNase P and reconstituted the enzymatic activity
        from three recombinant proteins
    - reference_id: PMID:38824131
      supporting_text: >-
        reconstituted functional complexes containing human ELAC2 or TRNT1 enzymes with a mitochondrial
        pre-tRNA bound to TRMT10C/SDR5C1 complex
