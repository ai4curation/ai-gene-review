      MRPP1/2 is not only a component of the mitochondrial RNase P but that it retains the tRNA product
      from the 5'-processing step and significantly enhances the efficiency of ELAC2-catalyzed 3'-processing
      for 17 of the 22 tRNAs encoded in the human mitochondrial genome.
  - reference_id: PMID:29880640
    supporting_text: >-
      The entirety of MRPP1 interacts with MRPP2 to form the N1-methylation complex, whereas the MRPP1-MRPP2-MRPP3
      RNase P complex only assembles in the presence of precursor tRNA.
  - reference_id: PMID:27132592
    supporting_text: >-
      Analyses of fibroblasts from affected individuals harboring TRMT10C missense variants revealed decreased
      protein levels of MRPP1 and an increase in mt-RNA precursors indicative of impaired mt-RNA processing
      and defective mitochondrial protein synthesis.
suggested_questions:
- question: >-
    Why do the pathogenic TRMT10C variants impair RNase P processing while leaving m1R9 methyltransferase
    activity largely intact, and does reduced MRPP1 abundance limit one function more than the other in
    vivo?
- question: >-
    What is the physiological role of the tissue- and development-specific m1A in MT-ND5 mRNA catalysed
    by TRMT10C?
suggested_experiments:
- description: >-
    Separate the methyltransferase and RNase P scaffold functions in human cells by complementing TRMT10C-null
    cells with SAM-binding-site mutants versus tRNA-binding N-terminal mutants, and measure m1R9 levels,
    precursor accumulation, and mitochondrial translation.
