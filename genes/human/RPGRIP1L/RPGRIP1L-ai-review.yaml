core_functions:
- description: RPGRIP1L is the upstream assembly hub of the ciliary transition zone. It localizes to the
    TZ distal to CEP290 and binds NPHP4 directly within the NPHP1-NPHP4-NPHP8 module. It is required for
    recruitment of both MKS- and NPHP-module proteins (and, in worms, CEP-290) to the TZ, and so for TZ
    gate formation and cilium-dependent signalling. In photoreceptors it partners RPGR at the connecting
    cilium. It has no characterized enzymatic activity.
  directly_involved_in:
  - id: GO:1905349
    label: ciliary transition zone assembly
  - id: GO:1904491
    label: protein localization to ciliary transition zone
  locations:
  - id: GO:0035869
    label: ciliary transition zone
  in_complex:
    id: GO:1990957
    label: NPHP complex
  supported_by:
  - reference_id: PMID:26982032
    supporting_text: MKS-5 (mammalian Rprgrip1L/Rpgrip1 orthologue) is essential for the assembly of all
      known TZ proteins (including CEP-290)
  - reference_id: PMID:28401750
    supporting_text: A strong genetic interaction was also observed between MKS5/RPGRIP1L and components
      of both the MKS and NPHP modules which rely on it for their recruitment to the TZ
  - reference_id: PMID:21565611
    supporting_text: We find that NPHP4 directly binds both NPHP1 and NPHP8 in vitro
suggested_questions:
- question: Is human RPGRIP1L, like worm MKS-5, required for TZ localization of CEP290, or is the CEP290-RPGRIP1L
    hierarchy different in mammals?
- question: Does the RPGRIP1L-TBXA2R interaction occur at endogenous levels in ciliated cells, and is
    it relevant to ciliary GPCR handling?
suggested_experiments:
- description: In RPGRIP1L-knockout human RPE1 cells, quantify TZ recruitment of CEP290, NPHP1/4 and MKS-module
    proteins by STED/expansion microscopy, and rescue with coiled-coil and C2-domain deletion constructs.
