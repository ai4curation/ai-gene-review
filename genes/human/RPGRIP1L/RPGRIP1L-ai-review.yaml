suggested_questions:
- question: Is RPGRIP1L better described as a module 'scaffold' (bridging via NPHP4 to NPHP1) or as an
    'assembly factor' that is needed transiently to build TZ structure, and which domains (coiled-coil,
    C2, RID) carry each role in mammals?
  experts: []
- question: Is the RPGRIP1L-TBXA2R interaction (and negative regulation of thromboxane signalling) physiologically
    relevant, given that it was shown only by overexpression in non-ciliated contexts?
  experts: []
suggested_experiments:
- hypothesis: RPGRIP1L coiled-coil domain is sufficient for TZ assembly in mammalian cells, as in C. elegans,
    while the RID is required only for RPGR/proteasome functions.
  description: Rescue RPGRIP1L-/- RPE1 or NIH3T3 cells with domain-deletion constructs; quantify TZ recruitment
    of NPHP4, NPHP1, CEP290, MKS1 and TMEM67, Y-link ultrastructure by cryo-ET/expansion microscopy, ciliary
    PIP2/INPP5E levels and ciliary proteasome activity.
  experiment_type: domain rescue + ultrastructure
