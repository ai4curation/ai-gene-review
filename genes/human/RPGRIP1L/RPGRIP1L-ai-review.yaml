id: Q68CZ1
gene_symbol: RPGRIP1L
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'RPGRIP1L (also known as MKS5, NPHP8 or fantom) is a large coiled-coil and C2-domain protein
  with a C-terminal RPGR-interacting domain, a paralog of RPGRIP1. It localizes to the ciliary transition
  zone close to the axoneme, distal to CEP290, and to the basal body/centrosome. It acts as the foundational
  assembly factor of the transition zone: it is required for transition-zone recruitment of MKS-module
  and NPHP-module proteins and for proper levels of CEP290, NPHP1, NPHP4 and inversin. It is needed to
  build the Y-shaped axoneme-to-membrane connectors and to establish the ciliary gate, including a zone
  that excludes signalling proteins and limits ciliary PIP2. RPGRIP1L binds NPHP4 within the NPHP1-4-8
  module (also at epithelial junctions) and associates with RPGR at the photoreceptor connecting cilium.
  Via the proteasome subunit PSMD2 it regulates ciliary proteasome activity, and it influences Hedgehog,
  planar cell polarity and thromboxane receptor signalling. Mutations cause Joubert syndrome 7, Meckel
  syndrome 5 and COACH syndrome, and a common variant modifies retinal degeneration in ciliopathies.'
