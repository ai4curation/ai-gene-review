    label: NPHP complex
  evidence_type: NAS
  original_reference_id: PMID:17558407
  qualifier: part_of
  review:
    summary: RPGRIP1L (NPHP8) is a component of the NPHP1-NPHP4-RPGRIP1L complex, bound through NPHP4.
    action: ACCEPT
    reason: Biochemically established by LAP-tag purification; RPGRIP1L binds NPHP4 directly, and missense
      variants weaken this.
    supported_by:
    - *id003
    - reference_id: PMID:17558407
      supporting_text: We show that RPGRIP1L interacts with nephrocystin-4 and that mutations in the gene
        encoding nephrocystin-4 (NPHP4) that are known to cause SLSN disrupt this interaction.
- term:
    id: GO:1905349
    label: ciliary transition zone assembly
  evidence_type: ISS
  original_reference_id: PMID:26392567
  qualifier: involved_in
  review:
    summary: The C. elegans ortholog MKS-5 functions as a TZ assembly factor needed to form Y-link ultrastructure
      and to recruit both MKS and NPHP modules. In mouse cells Rpgrip1l governs TZ levels of Cep290, Nphp1,
      Nphp4 and inversin.
    action: NEW
    reason: 'Participation test: RPGRIP1L/MKS-5 is itself a TZ constituent and the foundation of the MKS
      and NPHP assembly pathways; it builds the structure rather than merely being required upstream.
      Comparator: CEP290, the other foundational TZ scaffold, carries GO:1905349 (IMP in mouse, IBA in
      human). The term replaces the obsoleted GO:0097711 and is sparsely used, so absence here is a gap,
      not a convention. This matches the module''s assignment of TZ assembly to the NPHP module. ISS because
      the ultrastructural evidence is from the worm ortholog, supported by mouse data.'
    additional_reference_ids:
    - PMID:33625872
    - PMID:26982032
    supported_by:
    - *id008
    - *id012
    - *id013
    - *id014
