gene_symbol: RPGRIP1L
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'RPGRIP1L (also called NPHP8, MKS5 or FTM) is a large coiled-coil and C2-domain protein of
  the ciliary transition zone, related to the photoreceptor protein RPGRIP1. It sits at the basal body
  and transition zone, distal to CEP290, and binds NPHP4 directly as part of the NPHP1-NPHP4-NPHP8 module.
  RPGRIP1L acts as the upstream scaffold for assembling the transition zone: MKS- and NPHP-module proteins
  depend on it to reach the transition zone and form the ciliary diffusion barrier. In photoreceptors
  it binds RPGR at the connecting cilium, and the common A229T variant, which weakens RPGR binding, modifies
  retinal degeneration. Loss of RPGRIP1L causes Joubert syndrome, Meckel syndrome and nephronophthisis.'
