core_functions:
- description: 'Foundational assembly factor/scaffold of the ciliary transition zone: required for TZ
    recruitment of MKS- and NPHP-module proteins (and proper TZ levels of CEP290), for Y-link ultrastructure,
    and hence for the ciliary gate that controls ciliary protein and lipid composition.'
