- term:
    id: GO:1905349
    label: ciliary transition zone assembly
  evidence_type: ISS
  original_reference_id: PMID:26982032
  qualifier: involved_in
  review:
    summary: RPGRIP1L/MKS-5 is the upstream scaffold required to assemble the transition zone.
    action: NEW
    reason: 'Participation test: MKS-5/RPGRIP1L does part of the work of TZ assembly as a structural scaffold.
      The other TZ proteins, CEP-290 included, depend on it for localization, so RPGRIP1L is more than
      a component the process uses. Comparator: CEP290 already carries GO:1905349 by IBA, and RPGRIP1L
      acts upstream of CEP290 in the same hierarchy. The direct evidence is from the C. elegans ortholog
      with mammalian genetic support. The assertion is made at the assembly-process level; the TZ-localization
      process term is already annotated.'
    supported_by:
    - reference_id: PMID:26982032
      supporting_text: MKS-5 (mammalian Rprgrip1L/Rpgrip1 orthologue) is essential for the assembly of
        all known TZ proteins (including CEP-290)
    - reference_id: PMID:26982032
      supporting_text: Another established TZ protein, MKS-5 (RPGRIP1L/MKS5), is thought to act as a “scaffold”
        or “assembly factor” for most, if not all, MKS and NPHP module proteins
    - reference_id: PMID:28401750
      supporting_text: A strong genetic interaction was also observed between MKS5/RPGRIP1L and components
        of both the MKS and NPHP modules which rely on it for their recruitment to the TZ
