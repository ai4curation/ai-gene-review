  supported_by:
  - reference_id: PMID:7542744
    supporting_text: We demonstrate that the PI domain of Shc binds the LXNPXpY motif that encompasses Y-1148 of the activated EGFR.
  - reference_id: PMID:7518560
    supporting_text: Both competition experiments with synthetic phosphopeptides and dephosphorylation protection analysis demonstrated that Y-1173 and Y-992 are major and minor binding sites, respectively, for Shc on the EGFR.
  - reference_id: PMID:16273093
    supporting_text: Here we use protein microarrays comprising virtually every Src homology 2 (SH2) and phosphotyrosine binding (PTB) domain encoded in the human genome to measure the equilibrium dissociation constant of each domain for 61 peptides representing physiological sites of tyrosine phosphorylation on the four ErbB receptors.
proposed_new_terms: []
suggested_questions:
- question: Is p66Shc a genuine redox enzyme (cytochrome c-dependent H2O2 production) or a stress-regulated adaptor that controls ROS indirectly, and should human SHC1 carry an isoform-specific (P29353-1) oxidative-stress process annotation such as cellular response to oxidative stress?
- question: 'Where does stress-activated p66Shc act: the mitochondrial intermembrane space or mitochondria-associated ER membranes? This determines which isoform-specific cellular component annotations are appropriate.'
- question: Should the Reactome-derived plasma membrane annotations be restricted to the receptor-bound, phosphorylated p46/p52 pool, given that most SHC1 is cytosolic at steady state?
suggested_experiments:
- description: Isoform-specific CRISPR knock-in in human cells (p66-null, p46/p52-null, and Y239/240/317F CH1 mutant) with rescue, measuring GRB2 recruitment, RAS-GTP and ERK kinetics after EGF, to separate adaptor activity of each isoform.
  experiment_type: genetic perturbation with signalling readout
- description: In vitro reconstitution of purified human p66Shc CH2/PTB with cytochrome c and redox-dead (E132Q/E133Q) mutants, measuring H2O2 production, to test whether p66Shc has intrinsic redox activity.
  experiment_type: biochemical reconstitution
