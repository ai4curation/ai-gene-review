id: P29353
gene_symbol: SHC1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SHC1 (ShcA) is a non-catalytic phosphotyrosine adaptor expressed from one gene as three major isoforms, p46Shc and p52Shc (alternative translation initiation) and p66Shc (alternative promoter, with an extra N-terminal CH2 region). All share an N-terminal PTB (PID) domain that recognises phosphorylated NPXpY motifs, a central collagen-homology (CH1) region, and a C-terminal SH2 domain. On activation of receptor tyrosine kinases (EGFR/ERBB family, insulin and IGF1 receptors, Trk, MET, KIT, ALK, Eph receptors and others), cytokine receptors and integrins, cytosolic SHC1 is recruited to receptor phosphotyrosines at the plasma membrane via its PTB and/or SH2 domain and is itself phosphorylated on CH1 tyrosines (Tyr239/Tyr240 and Tyr317, p52 numbering). These phosphotyrosines dock the GRB2 SH2 domain, bringing GRB2-SOS to the membrane to activate RAS and the RAF-MEK-ERK cascade, so p46/p52Shc act as receptor-to-RAS adaptors that support mitogenic and survival signalling; later-phase SHC1 complexes (for example with PEAK1/SgK269 and PTPN12) help reroute and terminate signalling. p46Shc carries an N-terminal mitochondrial targeting sequence and localises to the mitochondrial matrix. p66Shc does not promote RAS activation; after stress-induced Ser36 phosphorylation it moves to mitochondria and mitochondria-associated membranes, where it promotes hydrogen peroxide production and apoptosis in response to oxidative stress; in mice, loss of p66shc confers stress resistance and extends life span.
