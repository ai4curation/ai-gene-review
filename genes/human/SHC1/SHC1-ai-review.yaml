  title: UniProtKB entry P29353 (SHC1_HUMAN)
  findings: []
- id: file:human/SHC1/SHC1-deep-research-falcon.md
  title: Deep research report on human SHC1 (Falcon)
  findings: []
core_functions:
- description: 'p46/p52Shc couple activated receptor tyrosine kinases to GRB2-SOS: receptor-bound SHC1 is phosphorylated on CH1 tyrosines (Y239/Y240/Y317), which dock the GRB2 SH2 domain and thereby bring SOS to the membrane to activate RAS and the ERK cascade.'
  molecular_function:
    id: GO:0005068
    label: transmembrane receptor protein tyrosine kinase adaptor activity
  directly_involved_in:
  - id: GO:0007173
    label: epidermal growth factor receptor signaling pathway
  - id: GO:0008286
    label: insulin receptor signaling pathway
  - id: GO:0043410
    label: positive regulation of MAPK cascade
  locations:
  - id: GO:0005829
    label: cytosol
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:9544989
    supporting_text: In addition, Shc bound to the activated EGF receptor via the PTB domain dominantly interacts with Grb2-Sos complex and plays a major role in the Ras-signaling pathway.
  - reference_id: PMID:8939605
    supporting_text: Mutagenesis studies indicate that Y239/240 make an important contribution to the association of Shc with Grb2.
  - reference_id: UniProt:P29353
    supporting_text: Signaling adapter that couples activated growth factor receptors to signaling pathways.
- description: The N-terminal PTB (PID) domain recognises phosphorylated NPXpY motifs and the C-terminal SH2 domain recognises other phosphotyrosine motifs on activated receptors (EGFR pY1148/pY1173, INSR pY960, IGF1R pY950, Trk, EPHB1, ALK) and phosphorylated scaffolds (PEAK1, CEACAM1, APP).
  molecular_function:
