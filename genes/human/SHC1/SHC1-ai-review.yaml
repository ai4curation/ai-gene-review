  review:
    summary: Cell-permeable SHC1 Tyr317-region peptides bind the GRB2 SH2 domain even when unphosphorylated (WITH/FROM GRB2).
    action: REMOVE
    reason: This is a structural/biophysical study of the GRB2 SH2 domain bound to a synthetic SHC1-derived phosphopeptide (pY317 region). The binding activity belongs to GRB2; SHC1 only contributes the docking motif, and the peptide experiment does not demonstrate an activity of full-length SHC1 (no receptor bridging is shown). Removal of the bare protein binding term does not mean the reported interaction is false; the generic term carries no functional information about SHC1, whose informative activities are captured by the phosphotyrosine residue binding and RTK adaptor activity annotations.
