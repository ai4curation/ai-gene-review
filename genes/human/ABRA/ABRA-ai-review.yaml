- term:
    id: GO:0035025
    label: positive regulation of Rho protein signal transduction
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: 'Kept, but it is the weakest of the three IBA calls and deserves a caveat rather than a clean
      pass. The underlying mouse evidence is an IDA from PMID:11983702, whose claim is that STARS "activates
      Rho-signaling events" in transfected cells and that SRF stimulation "involves Rho GTPase activation".
      Both observations come from ectopic overexpression, and the later mechanistic paper frames RhoA
      as a requirement for the STARS effect rather than as its target: PMID:15798203 shows STARS-dependent
      MRTF import "requires RhoA and actin polymerization". ABRA has no DH/PH or other GEF module, so
      how it raises Rho signalling output - directly, or as a consequence of changing the actin monomer
      pool - is unresolved. GO:0035025 is a regulation term and its definition ("any process that activates
      or increases the frequency, rate or extent of Rho protein signal transduction") accommodates indirect
      regulation, so the annotation stands as written; the mechanism is what is missing, not the fact.'
    action: ACCEPT
    reason: Directly supported by the source experimental annotation in the mouse ortholog, and the term
      is a regulation term whose definition permits indirect action. The unresolved question of whether
      ABRA acts on a Rho GTPase or merely requires one is recorded in suggested_questions rather than
      being used to reject the term.
    supported_by:
    - reference_id: PMID:11983702
      supporting_text: STARS stimulates the transcriptional activity of SRF through a mechanism that requires
        actin binding and involves Rho GTPase activation.
