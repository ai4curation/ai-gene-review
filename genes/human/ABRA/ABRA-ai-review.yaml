- id: PMID:11983702
  title: STARS, a striated muscle activator of Rho signaling and serum response factor-dependent transcription.
  findings:
  - statement: 'The founding description of the protein: a striated-muscle actin-binding protein that
      localises to the sarcomeric I-band and to actin filaments, activates Rho signalling events, and
      stimulates SRF-dependent transcription in a manner requiring its actin binding. This one paper is
      the experimental basis for the actin binding, actin cytoskeleton, actin cytoskeleton organization
      and Rho signalling annotations on the human record, all of them reaching human by transfer from
      the mouse ortholog.'
    supporting_text: STARS binds to the I-band of the sarcomere and to actin filaments in transfected
      cells, where it activates Rho-signaling events.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached title matches. Cloned both the mouse and the human cDNA (the human clone AF503617
      is cited in the human UniProt entry), but the functional experiments are attributed by UniProt to
      the mouse protein, which is why the human record carries the results as ISS rather than IDA. Abstract-only
      in the cache; the localisation and Rho claims are taken as stated and the overexpression caveat
      is recorded rather than used to reject them.
- id: PMID:15798203
  title: Muscle-specific signaling mechanism that links actin dynamics to serum response factor.
  findings:
  - statement: 'Establishes the mechanism: STARS activates SRF by inducing nuclear translocation of the
      MRTFs, the process requires RhoA and actin polymerisation, and the actin-binding domain is necessary
      and sufficient. Includes loss-of-function evidence, so the conclusion does not rest on overexpression
      alone.'
    supporting_text: Here we show that STARS activates SRF by inducing the nuclear translocation of MRTFs.
  - statement: Knockdown of endogenous STARS reduces SRF activity in differentiated C2C12 myotubes and
      cardiac myocytes.
    supporting_text: A knockdown of endogenous STARS expression by using small interfering RNA significantly
      reduced SRF activity in differentiated C2C12 skeletal muscle cells and cardiac myocytes.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Cached title matches. The key paper for the proposed GO:0042307 addition, and the one
      that shows the mouse GO:0006606 protein import into nucleus annotation has the causation backwards
      - STARS causes MRTF import, it is not the imported cargo. Also the source of the caveat on GO:0035025:
      RhoA is described as required for the STARS effect, not as its target.'
- id: PMID:17194709
  title: Two novel members of the ABLIM protein family, ABLIM-2 and -3, associate with STARS and directly
    bind F-actin.
  findings:
  - statement: ABLIM2 and ABLIM3 were identified with STARS as bait, bind F-actin, and synergistically
      enhance STARS-dependent SRF activation; ABLIM knockdown blunts SRF-dependent transcription in C2C12
      cells. This paper is the source of the mouse IDA and three IGI rows behind the human positive-regulation-of-transcription
      IBA.
    supporting_text: these novel ABLIM proteins strongly bind F-actin, are localized to actin stress fibers,
      and synergistically enhance STARS-dependent activation of SRF
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Cached title matches. Worth noting for the record: these are ABRA''s best-supported
      protein interactions, with functional consequences in both directions, and none of them appears
      in the human GOA file - the only interaction annotation human ABRA has is the Y2H hit with PPP1R18.'
- id: PMID:17415416
  title: Modulation of adverse cardiac remodeling by STARS, a mediator of MEF2 signaling and SRF activity.
  findings:
  - statement: Describes STARS as Z-disc localised and as activating SRF-dependent transcription by inducing
      nuclear translocation of MRTF-A and MRTF-B; places STARS transcription downstream of MEF2 and shows
      that cardiac overexpression sensitises the heart to hypertrophic stress.
    supporting_text: activates serum response factor-dependent (SRF-dependent) transcription by inducing
      nuclear translocation of the myocardin-related SRF coactivators MRTF-A and -B
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached title matches. Independent statement of the MRTF nuclear-translocation step,
      supporting the proposed GO:0042307 addition. It is also the source of the Z-disc localisation that
      conflicts with the I-band report, which is why sarcomere is kept as the annotated compartment. Its
      regulatory findings concern control of STARS expression, which is deliberately not converted into
      a process annotation for ABRA.
- id: PMID:22815879
  title: STARS is essential to maintain cardiac development and function in vivo via a SRF pathway.
  findings:
  - statement: Morpholino knockdown of zebrafish STARS disrupts cardiac chamber dimensions and contractile
      function, and the phenotype is rescued by co-injected SRF mRNA, placing the requirement for STARS
      upstream of SRF in vivo.
    supporting_text: Co-injection of zsrf (serum response factor) mRNA rescues the cardiac phenotype of
      zSTARS knockdown
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Cached title matches, full text available. Strong in vivo support for the STARS-SRF
      axis in a third species, but a zebrafish morphant phenotype is not converted into a human cardiac
      development annotation here - the phenotype is organismal and the human record has no independent
      support for a developmental role.
- id: PMID:26903873
  title: Overexpression of Striated Muscle Activator of Rho Signaling (STARS) Increases C2C12 Skeletal
    Muscle Cell Differentiation.
  findings:
  - statement: STARS overexpression enhances C2C12 myotube differentiation, and blocking MRTF-A nuclear
      translocation with CCG-1423 does not abolish the effect, indicating an output that the canonical
      STARS-RhoA-MRTF-SRF axis does not account for.
    supporting_text: had no effect on myotube differentiation rate, suggesting that STARS regulates differentiation
      via a MRTF-A independent mechanism
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Cached title matches, full text available. Cited for the negative result, which is the
      interesting part - it is the one piece of evidence that ABRA does something the current mechanistic
      model does not explain. Its introduction is also the source of the "I-band, Z-disk and M-line" summary
      that motivates keeping the parent sarcomere term.
- id: PMID:19778941
  title: Actin-binding rho activating protein (Abra) is essential for fluid shear stress-induced arteriogenesis.
  findings:
  - statement: Abra is strongly upregulated by fluid shear stress in growing collateral vessels, its induction
      is nitric-oxide-dependent, it drives smooth muscle cell proliferation through a Rho-dependent mechanism,
      and targeted deletion in mice impairs arteriogenesis.
    supporting_text: targeted deletion of Abra in CL57BL/6 mice led to impaired arteriogenesis
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: 'Cached title matches. Important as a corrective to the muscle-specific framing carried
      by the older literature - ABRA has a functional role in vascular smooth muscle too. Deliberately
      not converted into an arteriogenesis process annotation for human ABRA: the loss-of-function is
      mouse, the mechanism runs through expression control by shear stress, and the human record has no
      independent support.'
- id: PMID:19255118
  title: Regulation of STARS and its downstream targets suggest a novel pathway involved in human skeletal
    muscle hypertrophy and atrophy.
  findings:
  - statement: In human quadriceps biopsies, STARS and its downstream pathway members rise with hypertrophy-inducing
