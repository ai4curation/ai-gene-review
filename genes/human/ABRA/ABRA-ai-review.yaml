  review:
    summary: 'Correct, and at the right level of precision. The PAINT node PTN001100454 sits in PANTHER
      PTHR22739, whose four reviewed members are all named ABRA (human, mouse, rat, pig) and all fall
      in the single subfamily PTHR22739:SF20 - a one-to-one ortholog group with no paralog available to
