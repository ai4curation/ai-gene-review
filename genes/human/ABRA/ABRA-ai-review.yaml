- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: IDA
  original_reference_id: GO_REF:0000054
  qualifier: located_in
  review:
    summary: 'This is the one annotation on the record that is not a rodent transfer, and it is the one
      that should not be believed. GO_REF:0000054 is the LIFEdb survey of GFP-tagged proteins expressed
      in cultured cells - a systematic overexpression screen, not a targeted assay at native levels, so
      "IDA" overstates what was done. Three independent checks argue against it. UniProt places ABRA at
      "Cytoplasm, myofibril, sarcomere" and "Cytoplasm, cytoskeleton" and nowhere else. ABRA carries none
      of the four membrane-targeting UniProt feature classes - Transmembrane, Intramembrane, Signal or
      Lipidation - queried explicitly for this review, and no membrane-anchoring partner is reported for
      it, whereas its F-actin binding offers a ready alternative reading of a GFP rim signal as cortical
      actin. And ABRA is a striated-muscle-enriched protein, so a fusion overexpressed in a non-muscle
      line has no sarcomere to localise to in the first place. The consequence has already propagated:
      mouse Abra now carries GO:0005886 twice, by Ensembl Compara IEA (GO_REF:0000107) and by ISO (GO_REF:0000119),
      and both cite UniProtKB:Q8N0Z2 - so one GFP image in a cell line is now the sole origin of a plasma-membrane
      annotation in two species. Marked over-annotated rather than removed because the fluorescence may
      genuinely have been at the cell periphery for the overexpressed fusion; what does not follow is
      that the endogenous protein resides in the plasma membrane.'
    action: MARK_AS_OVER_ANNOTATED
    reason: A single GFP-fusion overexpression localisation in a non-muscle cell line, contradicted by
      UniProt's subcellular location, unsupported by any membrane-targeting sequence feature, and readily
      explained by the protein's known cortical F-actin binding - yet already projected into the mouse
      record twice.
    supported_by:
    - reference_id: file:human/ABRA/ABRA-bioinformatics/RESULTS.md
      supporting_text: The single human GFP-overexpression image is the sole origin of a plasma-membrane
        annotation in two species.
    - reference_id: file:human/ABRA/ABRA-uniprot.txt
      supporting_text: '-!- SUBCELLULAR LOCATION: Cytoplasm, myofibril, sarcomere {ECO:0000250}.'
