- term:
    id: GO:0042307
    label: positive regulation of protein import into nucleus
  evidence_type: ISS
  original_reference_id: PMID:15798203
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q8BUZ1
  review:
    summary: 'Proposed addition. Driving MRTF-A and MRTF-B into the nucleus is the mechanistic centre
      of what ABRA does, and it is missing from the human record entirely, which jumps from actin binding
      straight to positive regulation of Pol II transcription with the causal middle absent. UniProt''s
      human FUNCTION line states the step explicitly, and PMID:15798203 demonstrates it in both directions
      - induction of MRTF nuclear translocation, and reduced SRF activity on knockdown of endogenous STARS.
      The reason the step never reached human is instructive: mouse Abra does carry an annotation from
      this paper, but to GO:0006606 protein import into nucleus, which asserts that STARS is itself imported.
      That is not what the paper shows - STARS causes the MRTFs to be imported - and the wrong-direction
      term is not one PAINT would propagate as a description of ABRA''s role. GO:0042307 is the correctly
      directed term. Entered as ISS because the demonstration is in the mouse ortholog, with the mouse
      protein as the supporting entity; the mouse GO:0006606 row should be re-termed at source.'
    action: NEW
    reason: 'The best-characterised activity of this protein has no human GO annotation, because the mouse
      source annotation used a term with the wrong direction of causation. Adding the correctly directed
      regulation term closes the mechanistic gap between ABRA''s actin binding and its transcriptional
      output. Q5 of the reproducible audit makes the basis checkable: mouse Q8BUZ1 carries GO:0006606
      as an IDA with an EMPTY WITH/FROM - primary evidence from PMID:15798203, not a transfer from human
      - and carries no GO:0042307 at all. So this proposal is anchored to a direct assay, and it uses
      the term the mouse row arguably should have used: ABRA is not the imported cargo, it promotes MRTF-A/B
      import.'
    supported_by:
    - reference_id: PMID:15798203
      supporting_text: Here we show that STARS activates SRF by inducing the nuclear translocation of
        MRTFs.
    - reference_id: PMID:17415416
      supporting_text: activates serum response factor-dependent (SRF-dependent) transcription by inducing
        nuclear translocation of the myocardin-related SRF coactivators MRTF-A and -B
    - reference_id: file:human/ABRA/ABRA-uniprot.txt
      supporting_text: '-!- FUNCTION: Acts as an activator of serum response factor (SRF)-dependent'
    - reference_id: file:human/ABRA/ABRA-bioinformatics/RESULTS.md
      supporting_text: '| GO:0006606 protein import into nucleus | yes | IDA | PMID:15798203 | *(none)*
        |'
core_functions:
- description: Binds filamentous actin at the sarcomere of cardiac and skeletal muscle. Two C-terminal
    actin-binding regions mediate the interaction, the first of them intrinsically disordered and the
    higher-affinity of the two; this binding is necessary and sufficient for everything downstream.
  molecular_function:
    id: GO:0051015
    label: actin filament binding
  locations:
  - id: GO:0030017
    label: sarcomere
  - id: GO:0015629
    label: actin cytoskeleton
  supported_by:
  - reference_id: PMID:11983702
    supporting_text: STARS binds to the I-band of the sarcomere and to actin filaments in transfected
      cells
  - reference_id: file:human/ABRA/ABRA-uniprot.txt
    supporting_text: Binds F-actin and ABLIM1, ABLIM2 and ABLIM3.
  directly_involved_in: []
- description: 'Converts the state of the muscle actin cytoskeleton into a transcriptional signal: by
    acting on the filamentous actin pool, in a manner requiring RhoA and actin polymerisation, it releases
    MRTF-A and MRTF-B from cytoplasmic sequestration so that they accumulate in the nucleus and coactivate
    SRF-dependent transcription of contractile, cytoskeletal and growth genes. Loss of the endogenous
    protein lowers SRF activity in differentiated myotubes and cardiac myocytes, and ABLIM2/ABLIM3 binding
    amplifies the output. Rho signalling is deliberately NOT listed among the processes ABRA is directly
    involved in: the GO:0035025 annotation is accepted in existing_annotations because that term''s definition
    permits indirect regulation, but the review''s own reading is that ABRA may merely require RhoA rather
    than act on it (PMID:15798203 frames RhoA as a requirement for the ABRA effect), and ABRA has no GEF
    module. Listing it here would assert a directness the evidence does not reach.'
  molecular_function:
    id: GO:0051015
    label: actin filament binding
  directly_involved_in:
  - id: GO:0042307
    label: positive regulation of protein import into nucleus
  - id: GO:0045944
    label: positive regulation of transcription by RNA polymerase II
  - id: GO:0030036
    label: actin cytoskeleton organization
  locations:
  - id: GO:0030017
    label: sarcomere
  supported_by:
  - reference_id: PMID:15798203
    supporting_text: The STARS-dependent nuclear import of MRTFs requires RhoA and actin polymerization,
      and the actin-binding domain of STARS is necessary and sufficient for this activity.
  - reference_id: PMID:15798203
    supporting_text: A knockdown of endogenous STARS expression by using small interfering RNA significantly
      reduced SRF activity in differentiated C2C12 skeletal muscle cells and cardiac myocytes.
suggested_questions:
- question: Does ABRA act on a Rho GTPase, or does it merely require one? GO:0035025 appears three times
    on this record, all tracing to one 2002 mouse experiment reporting that overexpressed STARS activates
    Rho-signaling events. ABRA has no DH/PH or other GEF module, and the later mechanistic work frames
    RhoA as a requirement for the STARS effect rather than its target. Whether ABRA raises Rho-GTP loading
    directly, or whether the apparent Rho activation is downstream of the change it makes to the actin
    monomer pool, determines whether the gene's own name describes its molecular function.
  experts:
  - Eric N. Olson
  - Koichiro Kuwahara
- question: Does the human protein behave like the rodent one? Fourteen of ABRA's sixteen GOA rows are
    transfers from mouse or rat, and the two that are not are a yeast two-hybrid hit and a GFP-overexpression
    localisation. No human experiment has established a molecular function, a biological process or a
    native subcellular location for this protein; the human literature is expression profiling in muscle
    biopsies. This is not a criticism of the transfers - the orthology is one-to-one and unambiguous -
    but it means the human record has no independent anchor at all.
- question: 'Where in the sarcomere is ABRA? The primary reports disagree: the I-band in PMID:11983702,
    the Z disc in PMID:17415416, and the I-band, Z-disk and M-line together as summarised in PMID:26903873.
    The parent term sarcomere is used here for that reason, but a definitive answer would allow a much
    more informative annotation and would constrain which sarcomeric actin pool the protein is reading.'
  experts:
  - Nilesh J. Samani
- question: What is the MRTF-A-independent route to myogenic differentiation? Blocking MRTF-A nuclear
    translocation with CCG-1423 did not abolish the differentiation-promoting effect of STARS overexpression
    in C2C12 cells, which implies a second output that the canonical STARS-RhoA-MRTF-SRF axis does not
    explain. Nothing in the current GO record represents it.
  experts:
  - Aaron P. Russell
  - Severine Lamon
- question: Is the ABRA-PPP1R18 interaction direct? Both proteins bind F-actin, and all the evidence is
    yeast two-hybrid from a single publication, so bridging by endogenous yeast actin is a live alternative.
    If the interaction is real it would be interesting - it would put a protein phosphatase 1 targeting
    subunit next to the actin sensor that controls MRTF release - but a Y2H hit alone does not establish
    it.
- question: Should ABRA's UniProt keywords be corrected? The entry carries Protein transport, Translocation
    and Transport, which appear to be a literal reading of the FUNCTION line's "inducing nuclear translocation
    of MKL1 or MKL2". ABRA is not a transporter and does not carry cargo; it regulates the localisation
    of other proteins. These keywords previously generated a GO:0015031 protein transport annotation through
    the SwissProt keyword pipeline.
suggested_experiments:
- hypothesis: ABRA increases Rho-GTP loading directly, rather than Rho signalling being a consequence
    of its effect on the actin pool.
  description: Measure RhoA-GTP by rhotekin pulldown in muscle cells after acute, near-physiological induction
    of ABRA, and compare with an actin-binding-deficient mutant and with conditions where the actin pool
    is manipulated independently (latrunculin, jasplakinolide). If Rho activation requires an intact actin-binding
    domain and is reproduced by pharmacological actin polymerisation alone, ABRA is not acting on Rho;
    if the mutant still activates Rho, it is. Either result settles whether GO:0035025 describes a direct
    or a downstream effect.
  experiment_type: biochemistry and cell signalling
- hypothesis: ABRA is not at the plasma membrane at endogenous levels in muscle.
  description: Localise endogenously tagged ABRA in human cardiomyocytes or myotubes by imaging and by
    membrane/cytoskeletal fractionation, alongside the LIFEdb-style overexpressed GFP fusion in a non-muscle
    line as a side-by-side control. This directly tests whether the plasma-membrane call reflects the
    protein or the assay, and would also resolve the sarcomeric sub-compartment. Because that call has
    already been projected into the mouse record twice, correcting it at source would clear annotations
    in two species.
  experiment_type: cell biology
- hypothesis: ABRA promotes actin filament polymerisation, rather than only requiring it.
  description: Run pyrene-actin polymerisation assays with purified ABRA and with each of its two actin-binding
    regions separately, and measure the G-actin/F-actin ratio in cells on ABRA induction. A positive result
    would justify GO:0030838 positive regulation of actin filament polymerization, which is currently
    asserted by review articles but not, so far as the primary abstracts go, demonstrated.
  experiment_type: in vitro biochemistry
- hypothesis: The MRTF-A-independent contribution of ABRA to myogenic differentiation runs through a distinct
    effector.
  description: Repeat the C2C12 differentiation experiment with ABRA induction under MRTF-A/MRTF-B double
    knockdown rather than pharmacological inhibition, and profile the transcriptome to separate SRF target
    genes from the residual response. Any coherent residual programme identifies the second output and
    would be the first genuinely new biological process annotation available for this gene.
  experiment_type: functional genomics
