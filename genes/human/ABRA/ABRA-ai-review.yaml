id: Q8N0Z2
gene_symbol: ABRA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'ABRA, also called STARS (striated muscle activator of Rho signaling) and MS1, is an actin-binding
  protein enriched in cardiac and skeletal muscle that couples the state of the actin cytoskeleton to
  muscle gene transcription. Roughly its N-terminal half is intrinsically disordered; the C-terminal half
  carries two actin-binding regions, of which the first binds filamentous actin with the higher affinity.
  In striated muscle the protein associates with the sarcomere - reported at the I-band, the Z-disc and
  the M-line by different studies - and when expressed in non-muscle cells it decorates actin filaments.
  Functionally it acts upstream of serum response factor rather than on DNA: by binding F-actin, and in
  a manner requiring RhoA and actin polymerisation, it drives the myocardin-related transcription factors
  MRTF-A and MRTF-B out of their cytoplasmic G-actin-bound pool and into the nucleus, where they coactivate
  SRF-dependent transcription of cytoskeletal, contractile and growth genes. Its actin-binding domain
  is necessary and sufficient for that activity, and knockdown of the endogenous protein lowers SRF activity
  in differentiated myotubes and cardiac myocytes. The actin-binding LIM proteins ABLIM2 and ABLIM3 bind
  it and synergistically enhance the SRF response. ABRA is itself a stress-responsive gene: it is induced
  by MEF2 and by PGC-1-alpha/ERR-alpha, repressed by GATA4, reinforced by an SRF-dependent feed-forward
  loop on its own promoter, and downregulated post-transcriptionally by miR-628-5p in ageing muscle. Its
  expression rises with cardiac pressure overload, with resistance and endurance exercise in human skeletal
  muscle, and in vascular smooth muscle of collateral vessels exposed to elevated fluid shear stress,
  falling again with de-training. Loss-of-function studies in animals implicate it in cardiac development
  and contractile function and in fluid-shear-stress-driven arteriogenesis, and gain of function in myotubes
  promotes myogenic differentiation partly through an MRTF-A-independent route.'
