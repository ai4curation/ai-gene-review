    supporting_text: Our results show that the STARS signalling pathway is responsive to changes in skeletal
      muscle loading and appears to play a role in both human skeletal muscle hypertrophy and atrophy.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Cached title matches, full text available. Representative of what the human literature
      on this gene actually consists of - expression profiling in muscle biopsies. Informative about physiological
      context, but it measures transcript and protein abundance rather than testing ABRA's function, so
      it supports no GO annotation on its own.
- id: PMID:27739650
  title: Striated muscle activator of Rho signalling (STARS) is reduced in ageing human skeletal muscle
    and targeted by miR-628-5p.
  findings:
  - statement: STARS protein is lower in skeletal muscle of older than of younger humans, and miR-628-5p
      binds the STARS 3'UTR and downregulates it.
    supporting_text: we established that miR-628-5p, a miRNA regulated by age and exercise, binds to the
      STARS 3'UTR to directly downregulate its transcription
  full_text_unavailable: true
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Cached title matches. Included for the description's account of how ABRA levels are
      controlled. Like the other human papers it is regulation of ABRA rather than function by ABRA, so
      it generates no annotation.
- id: PMID:20940261
  title: Costars, a Dictyostelium protein similar to the C-terminal domain of STARS, regulates the actin
    cytoskeleton and motility.
  findings:
  - statement: The Costars protein is 82 residues and resembles only the C-terminal region of STARS; its
      loss in Dictyostelium disturbs the actin cytoskeleton and motility, and the defects are rescued
      by the small human counterpart protein. The human counterpart of that 82-residue protein is ABRACL,
      not ABRA.
    supporting_text: The 82 amino acid Costars protein sequence appears highly conserved among diverse
      species, and significantly resembles the C-terminal region of the striated muscle activator of Rho
      signaling (STARS)
  full_text_unavailable: true
  reference_review:
    relevance: LOW
    correctness: MISCITED
    review_notes: Cached title matches and the paper is sound; the problem is the use made of it. The
      affinage record cites it for the claim that ABRA's actin-cytoskeleton-regulating activity is conserved
      through the C-terminal Costars domain. The rescue construct is the small standalone Costars protein,
      whose human counterpart is ABRACL (Q9P1F3, 81 aa) - and ABRACL and ABRA are the only two reviewed
      human proteins carrying Pfam PF14705, with ABRACL being essentially the domain alone. A phenotype
      for the domain-only protein is not a phenotype for ABRA, so nothing from this paper is used to support
      an ABRA annotation.
- id: file:human/ABRA/ABRA-bioinformatics/RESULTS.md
  title: Where does the human ABRA GO record come from, and does its one plasma-membrane call have any
    support?
  findings:
  - statement: Fourteen of ABRA's sixteen GOA rows are transfers, and mouse Abra alone accounts for eight
      of them under four different identifier styles, which makes the record look better-sourced than
      it is. Only two rows are experimental, and neither concerns what the protein does.
    supporting_text: fourteen of the sixteen rows trace to two rodent proteins, and the mouse entry supplies
      eight of them under four different identifier styles, which makes the record look better-sourced
      than it is
  - statement: The human GO:0005886 plasma membrane call has been projected back into the mouse ortholog
      by two separate pipelines, both citing the human accession, so a single GFP-fusion overexpression
      image is the sole origin of a plasma-membrane annotation in two species.
    supporting_text: The single human GFP-overexpression image is the sole origin of a plasma-membrane
      annotation in two species.
  - statement: PANTHER PTHR22739 contains four reviewed members, all named ABRA and all in subfamily SF20,
      so the IBA and ISS transfers carry no paralog hazard; and Pfam PF14705 is carried in human only
      by ABRA and by the 81-residue ABRACL, which is why Costars-domain phenotypes cannot be attributed
      to ABRA.
    supporting_text: Exactly two reviewed human proteins carry the Costars domain `PF14705`
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Analysis written for this review (audit_abra_record.py), re-runnable, with the annotation
      rows read from this gene's own ABRA-goa.tsv so they cannot drift from the record under review and
      all other data fetched from the UniProt, QuickGO and InterPro REST APIs at run time. Failed fetches
      are reported rather than counted as absence, and the membrane-feature check names the four feature
      classes queried so that an empty result cannot be misread as a question that was never asked.
- id: file:human/ABRA/ABRA-deep-research-affinage.md
  title: Affinage mechanistic annotation for ABRA (human)
  findings:
  - statement: Machine-fetched Affinage record (trust gates passed, all twelve citations resolvable numeric
      PMIDs). Its mechanistic narrative of the STARS-RhoA-MRTF-SRF axis and of the transcriptional control
      of ABRA itself is accurate and matches the primary abstracts.
    supporting_text: It localizes to the sarcomeric Z disc/I-band, binds actin filaments, and activates
      Rho-GTPase signaling, which in turn drives nuclear translocation of the MRTF-A/MRTF-B co-activators
      to stimulate SRF-dependent transcription
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: 'External precomputed LLM research, treated as a preliminary source; every claim used
      was re-checked against the cited PMIDs. Its self_evaluation_pairwise is win and no bioRxiv DOI appears
      in a PMID-shaped field. One over-attribution was found and is recorded against PMID:20940261: the record credits
      ABRA with the Costars-domain actin/motility phenotype, which belongs to the domain-only protein
      ABRACL. Its own mechanism_profile is coarse as expected - GO:0140110 transcription regulator activity
      would be an error for a protein that never touches DNA - and none of its GO ids were imported.'
