- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:32296183
  qualifier: enables
  review:
    summary: 'The single WITH/FROM accession resolves to Q6NYC8, human PPP1R18 (phostensin), whose UniProt
      function is to target protein phosphatase 1 to the F-actin cytoskeleton. Judged against ABRA''s
      own biology this is a compartment-consistent partner rather than screen noise - two F-actin-associated
      proteins - so there is no basis for calling it an artefact, and it is not treated as one here. Two
      things nonetheless keep it out of the core set. First, UniProt''s "NbExp=3" is not three independent
      lines of evidence: querying IntAct returns three rows for this pair, all from PMID:32296183, and
      all three are yeast two-hybrid variants (validated two hybrid, two hybrid array, two hybrid prey
      pooling) with an IntAct MI score of 0.56. That is one screen plus its internal re-testing, not orthogonal
      confirmation. Second, the very fact that both proteins bind F-actin supplies a specific alternative
      explanation that Y2H cannot exclude: yeast actin could bridge two F-actin-binding proteins into
      a reporter-activating complex without them touching each other. Beyond that, bare protein binding
      conveys nothing about what ABRA does, and no more informative molecular function term is available
      for this pair - PPP1R18 is a phosphatase-targeting subunit, so a phosphatase-binding term would
      misdescribe the relationship. Notably, ABRA''s best-supported interactions, with ABLIM2 and ABLIM3
      (PMID:17194709), are absent from the human GOA file altogether.'
    action: KEEP_AS_NON_CORE
    reason: A plausible, compartment-consistent interaction, but supported by a single publication using
      three variants of one technology, with an unexcluded actin-bridging explanation and no functional
      follow-up, recorded under a term that carries no functional information. Retained because the interaction
      may well be real; not promoted to a core function.
    supported_by:
    - reference_id: file:human/ABRA/ABRA-bioinformatics/RESULTS.md
      supporting_text: Every WITH/FROM protein accession is a genuine one-to-one ortholog of the gene
        under review (mouse or rat *Abra*), not a paralog
