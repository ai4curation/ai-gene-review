  review:
    summary: Mitochondrial tRNA wobble uridine modification, supported by loss of taum5U34 from mt-tRNAs
      in Mto1 knockout mouse ES cells.
    action: ACCEPT
    reason: Core process. Mto1 KO cells lack taum5(s2)U34 in mt-tRNAs, and the GTPBP3-MTO1 complex reconstitutes
      taum5U34 formation in vitro. MTO1 is a subunit of the modifying enzyme, so it performs the step
      rather than merely being required for it.
