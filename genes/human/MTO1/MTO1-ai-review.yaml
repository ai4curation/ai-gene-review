    label: mitochondrion
  in_complex:
    id: GO:7770010
    label: GTPBP3-MTO1 complex
  supported_by:
  - reference_id: PMID:29390138
    supporting_text: Here, we elucidated τm5U biogenesis by confirming that 5,10-methylene-tetrahydrofolate
      and taurine are metabolic substrates for τm5U formation catalyzed by MTO1 and GTPBP3.
  - reference_id: PMID:29390138
    supporting_text: We here clearly demonstrated that τm5(s2)U34 was absent from mt-tRNAs isolated from
      GTPBP3 KO cells, Mto1 KO cells, as well as fibroblasts of a patient with pathogenic mutations in
      GTPBP3.
  - reference_id: PMID:29390138
    supporting_text: Finally, we successfully reconstituted τm5U34 formation in mt-tRNA in vitro in a
      system consisting of GTPBP3 and MTO1 in the presence of taurine, the methylene-THF, guanosine triphosphate
      (GTP) and other co-factors.
  - reference_id: PMID:33619562
    supporting_text: Using an anti-hGTPBP3 antibody in Co-IP, we confirmed that endogenous hMTO1 was indeed
      coprecipitated (Figure 1E).
  - reference_id: PMID:22608499
    supporting_text: In both humans and yeast, MTO1 increases the accuracy and efficiency of mtDNA translation
      by catalyzing the 5-carboxymethylaminomethylation of the wobble uridine base in three mitochondrial
      tRNAs (mt-tRNAs).
proposed_new_terms: []
suggested_questions:
- question: Within the GTPBP3-MTO1 complex, does MTO1 alone carry out the FAD-dependent transfer of the
    methylene group from 5,10-methylene-THF to U34 and the taurine addition, as inferred from bacterial
    MnmG, or do both subunits contribute catalytic residues?
- question: Why do MTO1 variants present mainly with hypertrophic cardiomyopathy while GTPBP3 variants
    more often add encephalopathy, given that both abolish the same modification?
suggested_experiments:
- description: Reconstitute taum5U34 formation with purified human MTO1 carrying mutations in the FAD-binding
    site or in residues equivalent to MnmG catalytic cysteines, combined with wild-type GTPBP3, and measure
    product by LC-MS.
- description: Measure FAD binding and redox state of purified human MTO1 and the effect of COXPD10 missense
    variants (for example p.Ala428Thr) on FAD binding, complex formation with GTPBP3 and tRNA binding.
