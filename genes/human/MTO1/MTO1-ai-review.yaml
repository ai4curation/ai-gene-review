core_functions:
- description: FAD-dependent MnmG-family subunit of the mitochondrial GTPBP3-MTO1 complex, which installs
    5-taurinomethyluridine at U34 of mt-tRNAs Leu(UUR), Trp, Lys, Glu and Gln using 5,10-methylene-THF
    and taurine, supporting accurate decoding in mitochondrial translation.
  contributes_to_molecular_function:
    id: GO:0160236
