id: Q9Y2Z2
gene_symbol: MTO1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: MTO1 (mitochondrial tRNA translation optimization 1) is the human homolog of bacterial MnmG/GidA
  and yeast Mto1, an FAD-dependent enzyme of the MnmG family encoded in the nucleus and imported into
  mitochondria. With the GTPase GTPBP3 (the MnmE homolog) it forms the GTPBP3-MTO1 complex, which installs
  5-taurinomethyluridine (taum5U) at the wobble position U34 of five mitochondrial tRNAs (Leu(UUR), Trp,
  Lys, Glu and Gln), using 5,10-methylene-tetrahydrofolate and taurine as substrates and GTP, FAD and
  potassium as cofactors. The modification supports accurate and efficient decoding during mitochondrial
  translation; loss of MTO1 abolishes taum5U34 and reduces mtDNA-dependent respiratory chain activities.
  Biallelic MTO1 variants cause combined oxidative phosphorylation deficiency 10 (COXPD10), typically
  infantile hypertrophic cardiomyopathy with lactic acidosis. Human MTO1 complements the respiratory defect
  of yeast mto1 mutants.
