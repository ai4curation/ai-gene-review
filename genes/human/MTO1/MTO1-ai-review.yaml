    label: RNA binding
  evidence_type: HDA
  original_reference_id: PMID:22681889
  qualifier: enables
  review:
    summary: Generic RNA binding from mRNA interactome capture in HEK293 cells, which recovered MTO1 among
      ~800 poly(A) RNA-associated proteins.
    action: KEEP_AS_NON_CORE
    reason: The high-throughput capture shows that MTO1 associates with RNA, which is consistent with
      an enzyme whose substrates are mitochondrial tRNAs. The capture does not say which RNA is bound,
      and mRNA binding is not part of MTO1's known function. No human tRNA-binding assay was found that
      would justify a more specific term, so the generic term is kept as non-core rather than replaced.
    supported_by:
    - reference_id: PMID:22681889
      supporting_text: Application to a human embryonic kidney cell line identified close to 800 proteins.
    - reference_id: PMID:29390138
