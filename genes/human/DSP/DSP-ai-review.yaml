suggested_questions:
- question: How do the three natural rod-splice products differ in plaque mechanics, intermediate-filament
    linkage and EB1-dependent connexin targeting at endogenous abundance?
- question: Under which cell states is nuclear desmoplakin recruited to telomeres, and does its TRF2-dependent
    association alter telomere maintenance independently of junctional stress?
- question: What target-specific measurements support DSP in B-cell exosomes and ficolin-rich neutrophil
    granule membranes, and do these pools have a biological role distinct from junctional incorporation?
suggested_experiments:
- hypothesis: Natural rod-splice products differ in junctional mechanical coupling or trafficking while
    retaining terminal binding regions.
  description: Compare sequence-verified DPI, DPII and DSPIa at matched endogenous expression in DSP-deficient
    human keratinocytes and cardiomyocytes. Measure plaque recruitment, intermediate-filament anchorage,
    mechanical cohesion and EB1-dependent Cx43 targeting with rescue and expression controls.
  experiment_type: Isoform-resolved rescue and cell mechanics
- hypothesis: The nuclear DSP phenotype depends on a separable recruitment mechanism rather than secondary
    junctional disruption.
  description: Use endogenous localization tags and compartment-restricted rescue with matched expression
    to distinguish nuclear recruitment, TRF2 association and telomere damage from secondary changes in
    adhesion, cell cycle or DNA damage.
  experiment_type: Compartment-resolved perturbation and rescue
- hypothesis: DSP detected in extracellular or granule fractions is a reproducible physical pool with
    definable topology.
  description: Combine target-specific peptides with orthogonal antibody validation, fraction-purity controls
    and protease protection with and without detergent in the relevant human cell preparations. Keep intracellular
    carryover and surface-associated material distinguishable from protected vesicle cargo.
  experiment_type: Targeted proteomics and biochemical topology
