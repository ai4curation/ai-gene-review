id: P15924
gene_symbol: DSP
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Desmoplakin is a plakin-family structural protein that couples intracellular junctional plaques
  to intermediate-filament networks. Its N-terminal region engages plaque partners and its C-terminal
  tail binds filament proteins, organizing desmosomes and supporting the mechanical integrity of epithelial
  and cardiac tissues. Cytoplasmic assembly particles recruit desmoplakin to cell contacts, and cardiac
  pools also occupy mixed fascia-adherens-like junctions. Association with EB1 helps organize cortical
  microtubule ends and promotes connexin-43 localization to cell-cell junctions. Alternative splicing
  changes the central rod while retaining terminal interaction regions. Pathogenic DSP variants cause
  skin fragility, keratoderma and cardiomyopathy.
alternative_products:
- name: DPI (DP1)
  id: P15924-1
  description: The 2,871-residue DPI product has the full central rod between the terminal plaque-binding
    and intermediate-filament-binding regions. Its sequence supplies the reference for the shorter rod
    splice products. Domain assays do not establish identical activity or localization for every natural
    product.
- name: DPII (DP2)
  id: P15924-2
  sequence_note: VSP_005070
  description: The 2,272-residue DPII product lacks canonical residues 1195–1793 within the central rod
    and retains the terminal interaction regions. Historical constructs called DPII provide important
    cellular evidence, but a name alone does not establish exact sequence identity with this current natural
    product or functional equivalence in all tissues.
- name: DSPIa
  id: P15924-3
  sequence_note: VSP_053769
  description: The 2,428-residue DSPIa product lacks canonical residues 1351–1793 within the central rod
    and retains the terminal interaction regions. The effect of this rod splice choice on partner engagement,
    mechanical coupling and tissue-specific function remains incompletely resolved.
