core_functions:
- description: Desmoplakin couples intracellular, plasma-membrane-associated junctional plaques to intermediate-filament
    networks through complementary N-terminal plaque interactions and C-terminal filament-binding interfaces.
    This structural linkage organizes desmosomes and the spatial distribution of intermediate filaments,
    maintaining epithelial and cardiac tissue integrity. Cytoplasmic desmoplakin assembly particles are
    recruited to cell contacts; cardiac desmoplakin also occupies fascia-adherens-like mixed junctions.
    Its N-terminal association with EB1 supplies spatial cues for cortical microtubule ends and promotes
    connexin-43 localization to cell-cell junctions. Human keratinocyte experiments distinguish this EB1-dependent
    function from generalized loss of adhesion or intermediate-filament attachment. Natural splice products
    retain the terminal regions while differing in their central rod.
