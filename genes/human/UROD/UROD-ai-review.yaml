- term:
    id: GO:0006787
    label: porphyrin-containing compound catabolic process
  evidence_type: IDA
  original_reference_id: PMID:11069625
  qualifier: involved_in
  review:
    summary: 'IDA annotating UROD to porphyrin-containing compound CATABOLIC process. This is directionally incorrect: UROD is an anabolic enzyme. Its decarboxylation of uroporphyrinogen III to coproporphyrinogen III is a heme-biosynthetic step, not degradation of a porphyrin-containing compound.'
    action: MODIFY
    reason: >-
      Lateral correction of the process branch. The decarboxylation of uroporphyrinogen to coproporphyrinogen is a biosynthetic step on the route to heme, not the breakdown of a porphyrin-containing compound; the side reaction on the isomer I substrate yields coproporphyrinogen I, which is also not degradation. The essence (UROD acts in porphyrin metabolism via its decarboxylase activity) is right, so the row is modified to heme biosynthetic process rather than removed. The source is a PCT genetics study reporting deficient UROD activity.
    proposed_replacement_terms:
    - id: GO:0006783
      label: heme biosynthetic process
    supported_by:
    - reference_id: PMID:11069625
      supporting_text: Porphyria cutanea tarda is a skin disease caused by photosensitization by porphyrins whose accumulation is caused by deficiency of hepatic uroporphyrin- ogen decarboxylase activity.
    - reference_id: file:human/UROD/UROD-uniprot.txt
      supporting_text: Catalyzes the sequential decarboxylation of the four acetate side chains of uroporphyrinogen to form coproporphyrinogen and participates in the fifth step in the heme biosynthetic pathway
      record_section:
      - CC:FUNCTION
    source_defects:
