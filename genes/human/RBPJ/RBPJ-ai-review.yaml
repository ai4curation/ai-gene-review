- term:
    id: GO:0002193
    label: MAML1-RBP-Jkappa- ICN1 complex
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: part_of
  supporting_entities:
  - PANTHER:PTN002580211
  - UniProtKB:Q06330
  review:
    summary: >-
      RBPJ is the DNA-binding core of the CSL-NICD-MAML ternary activation complex.
    action: ACCEPT
    reason: >-
      Structurally and biochemically defined core complex (PTN002580211 for the IBA).
    supported_by:
    - reference_id: PMID:16530044
      supporting_text: >-
        We report here the crystal structure of a Notch transcriptional activation complex
        containing the ankyrin domain of human Notch1 (ANK), the transcription factor CSL
        on cognate DNA, and a polypeptide from the coactivator Mastermind-like-1 (MAML-1).
    - reference_id: PMID:19907488
      supporting_text: >-
        We demonstrate that direct, high-affinity binding of the hydrocarbon-stapled peptide
        SAHM1 prevents assembly of the active transcriptional complex.
    - reference_id: PMID:16510869
      supporting_text: >-
        MAML1's promyogenic effects were completely blocked upon activation of Notch signaling,
        which was associated with recruitment of MAML1 away from MEF2C to the Notch transcriptional
        complex.
