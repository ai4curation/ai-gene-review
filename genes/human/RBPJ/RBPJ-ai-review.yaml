    label: positive regulation of cell proliferation involved in heart morphogenesis
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P31266
  review:
    summary: Cardiac morphogenesis/EMT roles (mouse Rbpj).
    action: KEEP_AS_NON_CORE
    reason: >-
      Developmental role transferred from mouse Rbpj. RBPJ executes this process only as the
      transcription factor of Notch signaling in the relevant cells; it is a real but downstream,
      tissue-specific outcome, retained as non-core.
    supported_by:
    - reference_id: PMID:18663143
      supporting_text: >-
        We further demonstrate that Slug, but not Snail, is directly up-regulated by Notch
        in endothelial cells and that Slug expression is required for Notch-mediated repression
        of the vascular endothelial cadherin promoter
    - reference_id: PMID:20890042
      supporting_text: >-
        Notch deletion abrogates endocardial Hey gene transcription and extends Bmp2 expression
        to the ventricular endocardium.
