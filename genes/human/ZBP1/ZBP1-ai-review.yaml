core_functions:
- molecular_function:
    id: GO:0038187
    label: pattern recognition receptor activity
  description: 'Through its tandem Zalpha1 and Zalpha2 domains, ZBP1 recognises double-stranded RNA
    in the left-handed Z conformation and transduces that recognition into innate-immune cell-death
    signalling. Physiological ligands include Z-RNA generated during influenza A and herpes simplex
    virus infection, and host-encoded transcripts containing endogenous retroelements that accumulate
    when viruses disable transcription termination. Whether the Zalpha domains can themselves flip
    unmodified A-form RNA into the Z conformation is disputed: biophysical measurements indicate
    they cannot, and that they bind and stabilise the Z form only where a modification such as 8-oxoguanine,
    or torsional strain, has already lowered the energetic barrier. On that reading ZBP1 reads pre-formed
    Z-RNA rather than generating it, which also explains why the more efficient converter ADAR1 can
    suppress ZBP1 simply by competing for the same ligand pool. The precise term for this activity
    is GO:7770073 left-handed Z-RNA immune receptor activity, which is carried on the annotation
    record; the parent pattern recognition receptor activity is used here because the child term
    postdates the ontology release this review is validated against.'
  directly_involved_in:
  - id: GO:0140374
    label: antiviral innate immune response
  locations:
  - id: GO:0005829
    label: cytosol
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:41082924
    supporting_text: host cell-encoded Z-RNAs are major and sufficient ZBP1-activating ligands after
      infection by these two human pathogens
  - reference_id: PMID:32200799
    supporting_text: Here, we show that replicating IAV generates Z-RNAs, which activate ZBP1 in
      the nucleus of infected cells.
  - reference_id: PMID:42079158
    supporting_text: This functional difference likely restricts ZBP1 sensing to pre-Z-forming nucleic
      acids, preventing aberrant immune activation
- molecular_function:
    id: GO:0035591
    label: signaling adaptor activity
  description: ZBP1's three RIP homotypic interaction motifs nucleate a RHIM-dependent signalling
    complex, bringing RIPK1 and RIPK3 together so that they can initiate apoptosis and necroptosis.
    ZBP1 contributes no catalytic activity of its own; the RHIMs form amyloid-like assemblies that
    hold the kinases in a productive arrangement, and the same motifs are the target of viral RHIM
    decoys such as herpes simplex ICP6 and murine cytomegalovirus M45. In human cells the adaptor
    works largely through RIPK1 and requires all three RHIMs, with the C-terminal RHIM2/RHIM3 region
    determining assembly and potency; the mouse protein signals mainly through RIPK3 using RHIM1
    alone, so this is the step at which human and mouse ZBP1 diverge.
  directly_involved_in:
  - id: GO:0097527
    label: necroptotic signaling pathway
  - id: GO:0060545
    label: positive regulation of necroptotic process
  - id: GO:0043065
    label: positive regulation of apoptotic process
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:19590578
    supporting_text: we report the identification of two receptor-interacting protein (RIP) homotypic
      interaction motifs (RHIMs) in the DAI protein sequence, and show that these domains relay DAI-induced
      NF-kappaB signals through the recruitment of the RHIM-containing kinases RIP1 and RIP3
  - reference_id: PMID:42436309
    supporting_text: Unlike mZBP1, which primarily uses only its RHIM1 domain, hZBP1 requires all
      three RHIM domains (RHIM1, RHIM2, and RHIM3) to trigger cell death.
  - reference_id: PMID:42436309
    supporting_text: In contrast to mZBP1, which signals primarily through RIPK3, hZBP1-induced cell
      death depends on RIPK1 in a RIPK3-independent manner.
- molecular_function:
    id: GO:0003692
    label: left-handed Z-DNA binding
  description: Each of ZBP1's two Zalpha domains binds left-handed Z-DNA independently, and binding
    is substantially enhanced when the two are tethered. Unlike the RNA case, the domains are competent
    to convert and stabilise unmodified duplex DNA in the Z conformation, albeit more slowly than
    the ADAR1 Zalpha domain. The Zalpha1 domain also governs the protein's subcellular distribution,
    which is why the common splice isoform lacking exon 2 localises differently. Whether Z-DNA rather
    than Z-RNA is a physiological activating ligand is unsettled; the domain-level binding activity
    itself is not.
  locations:
  - id: GO:0005829
    label: cytosol
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:16990255
    supporting_text: both Zalpha domains can bind Z-DNA independently and that substrate binding
      is greatly enhanced when both domains are linked
  - reference_id: PMID:42079158
    supporting_text: While ZBP1's Zα domains are able to convert and stabilize unmodified dsDNA in
      the Z-conformation
suggested_questions:
- question: Can human ZBP1 be activated by unmodified duplex RNA under physiological conditions,
    or does activation strictly require RNA that is already predisposed to the Z form by chemical
    modification, base damage such as 8-oxoguanine, or negative supercoiling?
  experts:
  - Jeffrey B Krall
  - Beat Vögeli
  - Siddharth Balachandran
- question: Are the host Z-RNAs generated by disruption of transcription termination chemically modified
    or torsionally strained in a way that makes them competent ZBP1 ligands without requiring ZBP1-driven
    A-to-Z conversion?
  experts:
  - Chaoran Yin
  - Alan Herbert
  - Siddharth Balachandran
- question: Given that human ZBP1 signals through RIPK1 largely independently of RIPK3 and needs
    all three RHIMs, how many of the mouse-derived ISS annotations on the human record, in particular
    pyroptosis and antifungal defence, actually hold for the human protein?
  experts:
  - Fen Lu
  - Huifang Jiao
- question: Is there any human-cell context in which ZBP1 contributes non-redundantly to type I interferon
    induction, or is the interferon arm of the original DAI model best regarded as mouse-specific?
  experts:
  - Juliane Lippmann
  - Bastian Opitz
- question: Is Z-DNA, as distinct from Z-RNA, ever a physiological activating ligand for human ZBP1,
    or is Z-DNA binding a conserved biochemical property of the Zalpha fold with no separate signalling
    role?
  experts:
  - Nikolas Deigendesch
  - Stefan Rothenburg
suggested_experiments:
- hypothesis: Human ZBP1 activation requires Z-RNA ligands that are already predisposed to the Z
    conformation, rather than ligands converted by ZBP1 itself.
  description: 'Reconstitute ZBP1 activation in human cells with defined synthetic duplex RNAs delivered
    at matched concentrations: unmodified (CpG)n repeats, the same sequence bearing 8-oxoguanine
    or 8-methylguanine at the C8 position, and a scrambled non-Z-forming control. Read out ZBP1 puncta
    formation, RIPK1 recruitment by co-immunoprecipitation, MLKL phosphorylation and cell death.
    A requirement for the modified ligand would confirm in cells what the biophysics predicts, and
    would justify tightening the GO:7770073 annotation to pre-formed Z-RNA.'
  experiment_type: Defined-ligand reconstitution in human cells
- hypothesis: The mouse-derived ISS annotations for pyroptosis and antifungal defence do not transfer
    to human ZBP1.
  description: In human macrophage lines with ZBP1 knocked out and reconstituted with wild-type,
    Zalpha mutant, or individual RHIM mutant hZBP1, challenge with Candida albicans and with influenza
    A and measure gasdermin D cleavage, IL-1-beta release, caspase-1 activation and lytic death side
    by side with the same panel in mouse macrophages. This would test directly whether GO:0140639
    and GO:0050832 are supportable for the human protein or should be retired from the human record.
  experiment_type: Cross-species knockout-reconstitution comparison
- hypothesis: Human ZBP1 does not contribute non-redundantly to type I interferon induction.
  description: Using CRISPR knockouts rather than the siRNA approach available in 2008, compare IFN-beta
    induction in human cells lacking ZBP1, cGAS, or both, after stimulation with cytosolic dsDNA,
    influenza infection and herpes simplex infection. Include a ZBP1 RHIM-mutant reconstitution to
    separate any interferon contribution from the cell-death output. A null result would settle the
    GO:0060340 annotations; a positive result would identify the context in which the original DAI
    model applies to human cells.
  experiment_type: CRISPR epistasis in human cells
- hypothesis: ZBP1 acts as a non-catalytic signalling adaptor whose RHIM-dependent assembly is the
    rate-limiting step of activation.
  description: Determine the structure of the human ZBP1 RHIM assembly with RIPK1, by cryo-EM of
    the amyloid-like filaments formed on activation, and pair it with separation-of-function mutants
    in each of the three RHIM core tetrads. Quantifying which RHIM contacts which partner would provide
    the direct structural basis for a signaling adaptor activity annotation and explain why the human
    protein needs all three motifs while the mouse protein needs only one.
  experiment_type: Cryo-EM plus structure-guided mutagenesis
