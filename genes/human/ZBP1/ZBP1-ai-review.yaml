  qualifier: enables
  review:
    summary: 'Proposed new annotation capturing what ZBP1''s three RHIMs actually do: bring RIPK1
      and RIPK3 together into a death-signalling complex without any catalytic contribution of ZBP1''s
      own.'
    action: NEW
    reason: 'This is arguably the best-evidenced molecular function of the human protein, and GOA
      represents it only as bare protein binding. Rebsamen et al. identified the RHIMs in human DAI
      and showed they recruit RIPK1 and RIPK3 to relay signals to NF-kappaB; the 2026 EMBO Reports
      study shows that human ZBP1 requires all three RHIMs to trigger cell death and that the C-terminal
      RHIM2/RHIM3 region determines assembly and RIPK1 engagement. ZBP1 has no catalytic activity,
      which matches the GO definition of signaling adaptor activity: a molecule that brings together
      two or more molecules in a signaling pathway, itself without catalytic activity. Proposed with
      the caveat that the human and mouse proteins route the signal differently, so the adaptor''s
      preferred partner is RIPK1 in human cells.'
    supported_by:
    - reference_id: PMID:19590578
      supporting_text: we report the identification of two receptor-interacting protein (RIP) homotypic
        interaction motifs (RHIMs) in the DAI protein sequence, and show that these domains relay
        DAI-induced NF-kappaB signals through the recruitment of the RHIM-containing kinases RIP1
        and RIP3
    - reference_id: PMID:42436309
      supporting_text: Unlike mZBP1, which primarily uses only its RHIM1 domain, hZBP1 requires all
        three RHIM domains (RHIM1, RHIM2, and RHIM3) to trigger cell death.
