- term:
    id: GO:0060340
    label: positive regulation of type I interferon-mediated signaling pathway
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: Inherited from the original DAI-as-cytosolic-DNA-sensor model. The term describes regulation
      of signalling downstream of the interferon receptor, which is not what was reported, and the
      underlying interferon role specifically failed to replicate in human cells.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'Two independent problems. First, term scoping. GO:0060340 is regulation of the type
      I interferon-mediated signaling pathway, i.e. the response to interferon; what Takaoka et al.
      reported is DAI-dependent induction of interferon genes, which is interferon production (GO:0032481).
      The mouse PAINT seed for this term is an IMP from that same paper, so the mismatch was inherited
      rather than introduced by the transfer. Second, species specificity. Lippmann et al. tested
      this directly in human cells and found that multiple hZBP1 siRNAs failed to suppress IFN-beta
      responses to cytosolic poly(dA-dT) or to intracellular bacteria, while mouse Zbp1 siRNA did
      impair the response in L929 cells; cGAS was subsequently established as the dominant cytosolic
      DNA sensor. This is the kind of human/mouse divergence that the 2026 EMBO Reports study warns
      against transferring. Marked over-annotated rather than modified to GO:0032481, because asserting
      that human ZBP1 positively regulates type I interferon production would assert the very thing
      that was looked for in human cells and not found. Not removed: ZBP1 is itself interferon-inducible
      and can amplify IRF3-dependent reporter activity when overexpressed, so the term is not baseless.'
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - ROLE_CONFLATION
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: MGI:MGI:1927449
        source_label: Zbp1 (mouse)
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Mouse Zbp1 carries this term as an IMP from PMID:17618271, which measured induction
          of type I interferon genes (production), not potentiation of interferon receptor signalling.
          Human ZBP1 was subsequently shown not to be required for IFN-beta responses in human cells
          (PMID:18771559).
      - source_id: PANTHER:PTN008557399
        source_label: PAINT ancestral node for the ZBP1 family
        source_status: SUPPORTS_TRANSFER
        comment: The node placement itself is not challenged; human ZBP1 is the 1:1 ortholog of the
          mouse donor and sits inside the clade. The objection is to the GO term chosen and to this
          particular pathway role in human cells, not to the phylogeny.
    supported_by:
    - reference_id: PMID:18771559
      supporting_text: intracellular bacteria and cytosolic poly(dA-dT) activate IFNbeta responses
        in different human cells without requiring human ZBP1
    - reference_id: PMID:17618271
      supporting_text: DAI (DLM-1/ZBP1) binds to double-stranded DNA and, by doing so, enhances its
        association with the IRF3 transcription factor and the TBK1 serine/threonine kinase.
