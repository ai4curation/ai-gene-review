existing_annotations:
- term:
    id: GO:0003692
    label: left-handed Z-DNA binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: Phylogenetic transfer of Z-DNA binding to the Zalpha-domain protein the gene is named
      for. The assertion is correct and is independently demonstrated for the human protein.
    action: ACCEPT
    reason: 'Core molecular function. Worth noting how weakly GOA supports it: in the human record
      left-handed Z-DNA binding is carried only by this IBA and by an NAS, even though direct biophysical
      demonstration for human ZBP1 has existed since 2006, where circular dichroism and EMSA showed
      each Zalpha domain binds Z-DNA on its own and that linking them enhances binding. A 2026 preprint
      independently confirms that both human Zalpha domains convert and stabilise unmodified dsDNA
      in the Z form. The phylogenetic judgement is not in dispute and the human protein is the 1:1
      ortholog of the mouse donor, so the node placement is sound; the annotation should be upgraded
      to IDA rather than argued with.'
    supported_by:
    - reference_id: PMID:16990255
      supporting_text: both Zalpha domains can bind Z-DNA independently and that substrate binding
        is greatly enhanced when both domains are linked
    - reference_id: PMID:42079158
      supporting_text: While ZBP1's Zα domains are able to convert and stabilize unmodified dsDNA
        in the Z-conformation
- term:
    id: GO:0003723
    label: RNA binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: RNA binding transferred phylogenetically, with human ZBP1's own experimental annotation
      among the sources.
    action: ACCEPT
    reason: 'Correct, though generic. Human ZBP1 appears in this IBA''s WITH/FROM alongside mouse
      Zbp1 and the PANTHER node, which is expected and is a marker that experimental grounding exists
      on the target itself rather than a sign of circularity. The binding is real for both A-form
      and Z-form RNA: 2026 biophysical work finds the Zalpha domains engage unmodified duplex RNA
      in an A-form-like mode and stabilise the Z form once a Z-promoting modification lowers the
      barrier. The more informative term for the functional consequence, left-handed Z-RNA immune
      receptor activity, is separately annotated and is not an ontology ancestor of RNA binding,
      so the two coexist rather than one superseding the other.'
    supported_by:
