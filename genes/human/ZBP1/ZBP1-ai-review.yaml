id: Q9H171
gene_symbol: ZBP1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'Interferon-inducible innate-immune protein built from two N-terminal Z-nucleic-acid-binding
  (Zalpha1, Zalpha2) domains followed by three RIP homotypic interaction motifs (RHIMs). It is expressed
  at low levels at rest and strongly upregulated by immunostimulation, and is found predominantly
  in the cytosol, with a functionally important nuclear pool. ZBP1 recognises double-stranded nucleic
  acids that are in, or predisposed to adopt, the left-handed Z conformation, and converts that recognition
  into cell death by using its RHIMs to nucleate a signalling complex with the kinases RIPK1 and
  RIPK3, driving necroptosis, apoptosis and inflammatory cell death. Z-form RNA arising during influenza
  A and herpes simplex virus infection, including host transcripts generated when viruses disrupt
  transcription termination, is a physiological activating ligand, and the antagonism of ZBP1 by
  vaccinia E3 and by the Zalpha domain of ADAR1 places it in a competitive balance that determines
  cell survival versus death. Two aspects of its biology are actively disputed. Whether the Zalpha
  domains can themselves drive the A-to-Z conversion of unmodified double-stranded RNA is contested:
  biophysical work indicates they convert unmodified DNA but not unmodified RNA, and bind Z-form
  RNA only when a chemical modification or other strain has already lowered the energetic barrier,
  which would restrict the protein to reading pre-formed Z-RNA rather than generating it. The human
  and mouse proteins also differ mechanistically, the human protein requiring all three RHIMs and
  signalling through RIPK1 largely independently of RIPK3, whereas the mouse protein signals mainly
  through RIPK3 using RHIM1 alone. The early proposal that the protein acts as a general cytosolic
  DNA sensor driving type I interferon induction has not held up in human cells.'
