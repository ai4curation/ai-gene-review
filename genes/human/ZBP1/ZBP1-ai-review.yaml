- term:
    id: GO:7770073
    label: left-handed Z-RNA immune receptor activity
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: enables
  review:
    summary: 'The flagship molecular function, and the contested one. Retained: the disputed claim
      is that the Zalpha domains convert A-form RNA to Z-form, which is not what this term asserts.'
    action: ACCEPT
    reason: 'This annotation has to be read against the term''s actual definition, which is combining
      with a left-handed Z-RNA and transmitting the signal to initiate an innate immune response,
      i.e. binding plus signal transduction, with no requirement that the receptor generate the Z
      form itself. The 2026 bioRxiv preprint by Krall et al. (a preprint, not peer reviewed, and
      weighed as one) makes a narrower claim than it first appears: that the long-assumed A-to-Z
      conversion activity was never tested and does not occur for unmodified RNA, while the same
      experiments show the Zalpha domains do bind and stabilise Z-form RNA once a modification such
      as 8-methyl- or 8-oxoguanine lowers the energetic barrier. The authors'' own conclusion is
      that ZBP1 sensing is restricted to pre-Z-forming nucleic acids, which narrows the ligand set
      rather than abolishing the receptor function. On the other side, Yin et al. (Nature 2025) identify
      host-encoded Z-RNAs generated by virus-driven disruption of transcription termination as bona
      fide, sufficient ZBP1-activating ligands, and these fall squarely in the pre-Z-forming category;
      a Science Bulletin commentary (PMID:41580360) frames host Z-RNAs as the endogenous trigger.
      The two positions are therefore more compatible than the framing suggests, and UNDECIDED would
      overstate the disagreement. What is genuinely weak is the evidence code: for the function this
      gene is best known for, human GOA carries only ISS from mouse Zbp1 (UniProtKB:Q9QY24). Direct
      human evidence exists in the cited literature and this row should be upgraded to IDA/IMP.'
    supported_by:
    - reference_id: PMID:41082924
      supporting_text: host cell-encoded Z-RNAs are major and sufficient ZBP1-activating ligands
        after infection by these two human pathogens
    - reference_id: PMID:42079158
      supporting_text: This functional difference likely restricts ZBP1 sensing to pre-Z-forming
        nucleic acids, preventing aberrant immune activation
    - reference_id: PMID:32200799
      supporting_text: Here, we show that replicating IAV generates Z-RNAs, which activate ZBP1 in
        the nucleus of infected cells.
