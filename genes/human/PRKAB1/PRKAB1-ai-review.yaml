core_functions:
- description: PRKAB1 supplies a non-catalytic beta scaffold for AMPK alpha/beta/gamma heterotrimers.
    It binds the catalytic alpha subunit, bridges alpha to the gamma nucleotide-sensing subunit, and places
    a carbohydrate-binding module in the cytosolic and nuclear AMPK complex so the holoenzyme can sense
    cellular energy stress and participate in nutrient and energy signaling.
  molecular_function:
    id: GO:0019901
    label: protein kinase binding
  contributes_to_molecular_function:
    id: GO:0004679
    label: AMP-activated protein kinase activity
  directly_involved_in:
