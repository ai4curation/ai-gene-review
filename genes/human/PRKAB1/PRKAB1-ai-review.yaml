    label: cellular response to nutrient levels
  locations:
  - id: GO:0005829
    label: cytosol
  in_complex:
    id: GO:0031588
    label: nucleotide-activated protein kinase complex
  supported_by:
  - *id004
  - *id005
- description: PRKAB1 uses its conserved AMPK beta carbohydrate-binding module to bind glycogen, positioning
    the cytosolic AMPK complex at a carbohydrate-regulated interface.
  molecular_function:
    id: GO:2001069
    label: glycogen binding
  locations:
  - id: GO:0005829
    label: cytosol
  in_complex:
    id: GO:0031588
    label: nucleotide-activated protein kinase complex
