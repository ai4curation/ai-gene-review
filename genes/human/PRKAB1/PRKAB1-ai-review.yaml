id: Q9Y478
gene_symbol: PRKAB1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: PRKAB1 encodes the beta-1 scaffolding subunit of the AMP-activated protein kinase (AMPK)
  heterotrimer. AMPK beta subunits bridge the catalytic alpha subunit to the adenine-nucleotide-sensing
  gamma subunit, carry a carbohydrate-binding module, and help assemble cytosolic and nuclear AMPK complexes
  that couple low cellular energy to changes in metabolism, growth, autophagy, and mitochondrial quality
  control.
