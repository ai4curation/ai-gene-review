- term:
    id: GO:0005788
    label: endoplasmic reticulum lumen
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-9931292
  qualifier: located_in
  review:
    summary: ER lumen location propagated from a Reactome PD-L1 degradation event.
    action: REMOVE
    reason: PRKAB1/2 are cytosolic/nuclear AMPK subunits, not soluble ER-lumen proteins. Reactome:R-HSA-9931292
      describes AMPK-dependent phosphorylation of the ER/secretory substrate PD-L1/CD274, but the AMPK
      kinase remains on the cytosolic side of the substrate and should not receive GO:0005788 endoplasmic
      reticulum lumen.
    source_defects:
    - defect_type: WRONG_TERM
      resource: REACTOME
      record: Reactome:R-HSA-9931292
      slot: cellular_component
      requested_change: CHECK
      asserted_value: GO:0005788
      cause: CONTEXT_NOT_ASSAYED
      confidence: PROBABLE
      explanation: The Reactome event describes cytosolic AMPK phosphorylating the ER-localized substrate
        PD-L1/CD274 after metformin treatment. It does not support locating the PRKAB-containing AMPK
        heterotrimer in the endoplasmic reticulum lumen; the AMPK complex should remain cytosolic or,
        if Reactome needs a local ER context, on the cytosolic side rather than inside the lumen.
      supported_by:
      - &id001
        reference_id: Reactome:R-HSA-9931292
        supporting_text: AMP-activated protein kinase (AMPK), activated in response to metformin, directly
          binds with PD-L1 (CD274) and phosphorylates S195 of PD-L1.
    supported_by:
    - *id001
