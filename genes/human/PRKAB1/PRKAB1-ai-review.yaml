suggested_questions:
- question: Do PRKAB1- and PRKAB2-containing AMPK complexes differ in nuclear versus cytosolic substrate
    choice beyond known tissue and drug-sensitivity differences?
- question: How does PRKAB1 Gly2 N-myristoylation tune cytosolic AMPK membrane association, nucleotide-dependent
    activation and substrate selection in endogenous human beta-1 complexes?
suggested_experiments:
- description: Use matched PRKAB1 or PRKAB2 rescue in PRKAB1/PRKAB2-null human cells to compare alpha/gamma
    assembly, subcellular localization and phosphorylation of AMPK targets under energy stress.
