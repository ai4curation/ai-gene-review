- term:
    id: GO:0005654
    label: nucleoplasm
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-6805470
  qualifier: located_in
  review:
    summary: Nucleoplasmic AMPK beta-subunit pool in Reactome AMPK complexes.
    action: KEEP_AS_NON_CORE
    reason: The nucleoplasm row is a real secondary location for an AMPK pool in Reactome, but PRKAB1/2
      are not dedicated nuclear factors; the principal beta-subunit role is scaffolding the AMPK heterotrimer
      that also acts in the cytosol.
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - PANTHER:PTN000038857
  - PomBase:SPCC1919.03c
  - RGD:620905
  - SGD:S000000829
  - SGD:S000002830
  - SGD:S000003176
  - UniProtKB:Q57XE4
  review:
    summary: Cytoplasmic AMPK beta-subunit localization.
    action: ACCEPT
    reason: This PAINT row is placed at the broad cytoplasm level, matching conserved evidence for
      cytoplasmic fungal SNF1/AMPK beta subunits. PRKAB1 also has direct cytosol rows from Reactome,
      but the PAINT row's own evidence stops at cytoplasm and the broad term is true for cytosolic
      beta-containing AMPK complexes.
