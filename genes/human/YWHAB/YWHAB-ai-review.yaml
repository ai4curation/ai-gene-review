id: P31946
gene_symbol: YWHAB
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  YWHAB encodes 14-3-3 protein beta/alpha, a member of the conserved 14-3-3 dimeric phosphoprotein-binding
  family. 14-3-3 beta recognizes phosphorylated serine/threonine motifs in many cytosolic, nuclear and
  membrane-associated client proteins and changes their conformation, activity or localization. In Hippo
  signaling, LATS1/2 phosphorylation of YAP1 creates a 14-3-3 docking site, allowing YWHAB-containing
  dimers to bind phosphorylated YAP1 and sequester it in the cytoplasm, thereby limiting nuclear TEAD-dependent
  transcription. The same phosphoserine-dependent binding mechanism is used on other clients, including
  class II HDACs, BAD, RAF proteins, TSC2, CDC25 phosphatases and RNA-binding proteins.
