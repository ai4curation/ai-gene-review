core_functions:
  - description: >-
      Phosphoserine/phosphoprotein-binding adaptor activity. YWHAB-containing 14-3-3 dimers bind phosphorylated
      motifs in client proteins such as YAP1/YAP2 and HDAC4/5, converting client phosphorylation into
      altered localization, conformation or activity.
    molecular_function:
      id: GO:0050815
      label: phosphoserine residue binding
    directly_involved_in:
      - id: GO:0042308
        label: negative regulation of protein import into nucleus
    locations:
      - id: GO:0005829
        label: cytosol
      - id: GO:0005737
        label: cytoplasm
    supported_by:
      - &id002
        reference_id: PMID:17974916
        supporting_text: >-
          YAP2 interacts with 14–3–3, and this interaction is completely abolished by phosphatase treatment
      - reference_id: PMID:10869435
        supporting_text: >-
          The association of 14-3-3 with HDAC4 and HDAC5 results in the sequestration of these proteins
          in the cytoplasm.
      - &id003
        reference_id: Reactome:R-HSA-2028644
        supporting_text: >-
          YWHAB (14-3-3 beta/alpha) binds phosphorylated YAP1 proteins, sequestering them in the cytosol.
  - description: >-
      Protein sequestering activity in Hippo signaling. After LATS1/2 phosphorylate YAP1 on S127, YWHAB
      dimers bind phosphorylated YAP1 and contribute to its cytosolic retention, reducing import of
      active YAP1 into the nucleus.
    molecular_function:
      id: GO:0140311
      label: protein sequestering activity
    directly_involved_in:
      - id: GO:0042308
        label: negative regulation of protein import into nucleus
    locations:
      - id: GO:0005829
        label: cytosol
    supported_by:
      - *id002
      - *id003
proposed_new_terms: []
suggested_questions:
  - question: >-
      Which phosphorylated clients are genuinely 14-3-3 beta-specific rather than handled interchangeably
      by other 14-3-3 isoforms or heterodimers in the assayed cell type?
suggested_experiments: []
