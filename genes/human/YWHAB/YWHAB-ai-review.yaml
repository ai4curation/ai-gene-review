  - term:
      id: GO:0004860
      label: protein kinase inhibitor activity
    evidence_type: IDA
    original_reference_id: PMID:11555644
    qualifier: enables
    review:
      summary: >-
        14-3-3 beta binding inhibits TESK1 kinase activity and changes TESK1 localization after integrin
        stimulation.
      action: KEEP_AS_NON_CORE
      reason: >-
        Supported for the TESK1 branch, but peripheral to the core 14-3-3 phosphoprotein-binding and YAP/HDAC
        sequestration functions.
      supported_by:
        - reference_id: PMID:11555644
          supporting_text: Binding of 14-3-3beta inhibited the kinase activity of TESK1.
  - term:
      id: GO:0004864
      label: protein phosphatase inhibitor activity
    evidence_type: IDA
    original_reference_id: PMID:17255105
    qualifier: enables
    review:
      summary: >-
        14-3-3 beta protects phosphorylated PDE3B from dephosphorylation but does not directly inhibit
        a protein phosphatase.
      action: MARK_AS_OVER_ANNOTATED
      reason: >-
        The evidence supports sequestration or shielding of phosphorylated HSPDE3B from phosphatase-catalyzed
        inactivation, not direct inhibition of a protein phosphatase by YWHAB.
      supported_by:
        - reference_id: PMID:17255105
          supporting_text: >-
            the PKA-phosphorylated, 14-3-3 protein-bound, form of HSPDE3B is protected from phosphatase-dependent
            dephosphorylation and inactivation
