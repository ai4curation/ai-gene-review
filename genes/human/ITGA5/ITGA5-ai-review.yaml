id: P08648
gene_symbol: ITGA5
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'Integrin alpha-5 is a type I transmembrane integrin alpha subunit that pairs primarily with integrin
  beta-1 to form the alpha5beta1 fibronectin receptor. Its extracellular head binds RGD- and synergy-site-containing
  extracellular matrix ligands such as fibronectin and fibrillin-1, its membrane/cytoplasmic region pairs with
  beta1, and the liganded receptor clusters at plasma-membrane focal adhesions to connect matrix attachment
  to cytoskeletal and FAK/SRC signaling. Alpha5beta1 also has ligand-specific roles in angiogenesis, endoderm
  differentiation, wound responses, and specialized contacts with proteins such as CD40L and P-selectin, but
  those tissue outputs depend on the core cell-matrix adhesion receptor activity.'
