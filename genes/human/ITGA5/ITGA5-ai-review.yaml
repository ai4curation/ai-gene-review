suggested_questions:
- question: Which alpha5 cytoplasmic-tail interactions, as opposed to beta1-tail talin/kindlin contacts,
    are required for force-dependent maturation of alpha5beta1 fibrillar adhesions?
- question: Should GO model CD40L and P-selectin binding by alpha5beta1 as broad
    cytokine/cell-adhesion-molecule binding, or are narrower ligand-specific receptor terms needed for
    non-matrix alpha5beta1 ligands?
suggested_experiments:
- experiment_type: Rescue mutagenesis
  description: In ITGA5-null human fibroblasts or endothelial cells, compare wild-type ITGA5 with
    beta1-pairing or cytoplasmic-tail mutants for alpha5beta1 surface expression, fibronectin binding,
    focal-adhesion recruitment, fibrillogenesis, and FAK/SRC activation under matrix tension.
- experiment_type: Force-coupled ligand binding
  description: Use purified alpha5beta1 in a bead or optical-trap assay to test how fibronectin, CD40L,
    and CD62P differ in catch-bond behavior and whether the non-matrix ligands produce force-dependent
    integrin opening comparable to fibronectin.
