id: Q9P0L9
gene_symbol: PKD2L1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'PKD2L1 encodes the TRPP3 nonselective cation channel, which can function as a homomeric channel and
  as a pore-forming subunit in heteromeric channels with PKD1L1 or PKD1L3. Its activities include Ca(2+), Na(+),
  K(+) and Mg(2+) conductance, acid-gated PKD1L3/PKD2L1 channel activity, and ciliary PKD1L1/PKD2L1 channel function.'
alternative_products:
