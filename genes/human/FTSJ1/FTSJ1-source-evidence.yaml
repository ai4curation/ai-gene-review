    review_notes: Official UniProt records large-scale mass-spectrometry identification. The target peptide evidence and original kinome workflow were not independently inspected; no kinase activity is assigned from the citation title.
- id: PMID:19012053
  title: Genetic variations in FTSJ1 influence cognitive ability in young males in the Chinese Han population.
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: Official UniProt cites cognitive-ability genetic variation. Original cohort results remain unread and are not converted into a cell-type-specific mechanistic function.
- id: PMID:19413330
  title: Lys-N and trypsin cover complementary parts of the phosphoproteome in a refined SCX-based approach.
  reference_review:
    relevance: LOW
    correctness: UNVERIFIED
    review_notes: Official UniProt records large-scale proteomic identification in the Lys-N/trypsin study. Target-specific spectra and article Methods were not read; this remains detection provenance.
- id: PMID:21269460
  title: Initial characterization of the human central proteome.
  reference_review:
    relevance: LOW
    correctness: UNVERIFIED
    review_notes: Official UniProt records identification in a central-proteome survey. Original target spectra and assay details were not read; no new localization or process is derived.
- id: PMID:23186163
  title: Toward a comprehensive characterization of a human cancer cell phosphoproteome.
  reference_review:
    relevance: LOW
    correctness: UNVERIFIED
    review_notes: Official UniProt associates the cancer phosphoproteome source with Ser271 phosphorylation. The original target peptide and functional effect were not independently checked; the recorded site is not treated as a regulatory mechanism.
- id: PMID:25404562
  title: Conservation of an intricate circuit for crucial modifications of the tRNAPhe anticodon loop in eukaryotes.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Authentic original human-FTSJ1 yeast complementation and HPLC support Cm32; Gm34 remained undetectable in this host. Later human evidence supports that separate gene-level activity.
- id: PMID:26310293
  title: Defects in tRNA Anticodon Loop 2'-O-Methylation Are Implicated in Nonsyndromic X-Linked Intellectual Disability due to Mutations in FTSJ1.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Original patient-LCL tRNA HPLC supports human Cm32/Gm34 dependence and selective A26P Gm loss. Detailed partner/overexpression assays use yeast Trm7; supplementary construct tables remain unread.
- id: PMID:32198346
  title: 2,6-Diaminopurine as a highly potent corrector of UGA nonsense mutations.
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: Official UniProt records activity regulation, and the later PMID:36720500 original uses DAP with attribution to this source. Its original mechanism and specificity experiments were not independently read here; neuronal DAP evidence retains that limitation.
- id: PMID:32296183
  title: A reference map of the human binary protein interactome.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Retained authentic HuRI selected Methods and three exact official IntAct records support human FTSJ1–CERT1-2 yeast two-hybrid association. Pair-specific MAPPIT/GPCA, purified affinity and exact FTSJ1 natural-product identity are not established.
- id: PMID:32393790
  title: FTSJ1 regulates tRNA 2'-O-methyladenosine modification and suppresses the malignancy of NSCLC via inhibiting DRAM1 expression.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Selected original human NSCLC Methods/Results and Discussion were read. Bulk hydrolysed tRNA Am and DRAM1 expression were measured; the authors explicitly state protein synthesis was not assessed. No site-specific Am catalysis, direct DRAM1 contact or direct translation assay is inferred.
- id: PMID:32488007
  title: 'Correction: FTSJ1 regulates tRNA 2''-O-methyladenosine modification and suppresses the malignancy of NSCLC via inhibiting DRAM1 expression.'
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: The authentic original correction body was read. It corrects the author name Yuhuan Chen to Yuchen Chen; it states no experimental revision, retraction or PMID replacement. The biological evidence remains that of the original PMID:32393790 study.
- id: PMID:32558197
  title: Intellectual disability-associated gene ftsj1 is responsible for 2'-O-methylation of specific tRNAs.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected original human cell knockout, localization and FTSJ1-WDR6 reconstitution were read. Gm34 activity used appropriately modified Phe substrates; the binary reaction did not produce Cm32. SAM binding was measured by ITC. Its negative Trp result remains an assay-specific observation.
- id: PMID:33771871
  title: Loss of Ftsj1 perturbs codon-specific translation efficiency in the brain and is associated with X-linked intellectual disability.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected human patient-tRNA isolation/rescue, RNase-fragment/nucleoside MS and human FTSJ1-WDR6 Methods were read. Original supplementary S2/S3 caption text explicitly supports human Trp C34 reconstitution; no figure-pixel audit is claimed. Brain ribosome/phenotype evidence remains mouse-specific.
- id: PMID:36720500
  title: The ribose methylation enzyme FTSJ1 has a conserved role in neuron morphology and learning performance.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Original human patient-LCL RiboMethSeq and DAP-treated neuronal morphology were read. Raw cleavage-profile limitations and unchanged neuronal differentiation fraction are retained; fly memory assays remain separate.
- id: PMID:40483304
  title: Structural insights into tRNA recognition of the human FTSJ1-THADA complex.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected original human FTSJ1-THADA cryo-EM, interaction and activity Methods/Results were read. The 2.66-angstrom structure positions C32; the activity readout measures SAM-to-SAH coupled fluorescence rather than direct site-resolved Cm32 MS. Unmodeled residues are density limits, not natural deletions.
- id: Reactome:R-HSA-6782315
  title: tRNA modification in the nucleus and cytosol
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: The official UniProt cross-reference identifies this tRNA-modification pathway. The broad pathway entity was not independently read; the two incoming reaction entities were read separately and supply the specific catalyst context.
- id: Reactome:R-HSA-9024159
  title: FTSJ1 2'-O-methylates cytidine-32 in tRNA(Phe)
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Actual C32 reaction/catalyst entities identify human FTSJ1 residues 1–329 and THADA. The location summation uses yeast-homology inference; human localization independently corroborates cytosol. This model is not presented as a new human assay.
- id: Reactome:R-HSA-9024161
  title: FTSJ1 2'-O-methylates guanosine-34 in tRNA(Phe)
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Actual G34 reaction/catalyst entities identify FTSJ1 and cytosol. Its retained THADA requirement conflicts with the partner specificity established by later human WDR6 biochemistry; this model limitation is explicit and does not replace primary evidence. Cytosolic location is modeled by homology and independently corroborated.
- id: GO_REF:0000002
  title: InterPro-derived GO annotation
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Official incoming domain-based methyltransferase and tRNA-processing contexts are preserved. Actual target identity and human experiments corroborate their biology; official typed ancestry determines the broader-term dispositions.
- id: GO_REF:0000033
  title: Phylogenetic inference from PAINT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The actual PTHR10920 topology, MSA and literal IBD records were inspected. All four incoming annotations trace to AN2/PTN000100323 on the exact human target path. Single-donor and target-self evidence are valid; action granularity is evaluated separately.
- id: GO_REF:0000044
  title: UniProt subcellular-location mapping
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The original SL-0191 nuclear location mapping is preserved and corroborated by human tagged-protein imaging/fractionation. This does not establish isoform-specific nuclear function.
- id: GO_REF:0000052
  title: Human Protein Atlas subcellular annotation
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Official HPA25 metadata reports supported cytosol ICC/IF with HPA002718 in A-431, U-251MG and U2OS. Metadata and recorded locations were read, without image-pixel reinterpretation.
- id: GO_REF:0000104
  title: UniRule-derived GO annotation
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The original UR000166012 ribose-methylation and translation contexts remain literal. Human primary data establish the methylation chemistry; translation is retained as downstream context, not a direct ribosomal role.
- id: GO_REF:0000117
  title: ARBA-derived GO annotation
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Original ARBA donor identifiers are retained. Human enzymology supports the underlying broad methyltransferase/tRNA-methylation claims, whose official typed descendants are more informative.
- id: GO_REF:0000120
  title: Combined automated UniProt annotation
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: All original InterPro, UniRule, ARBA and UniProt location donors remain in their incoming order. Source identity is distinct from direct assay evidence; specificity is supported by independent primary data and official ontology paths.
- id: UniProt:Q9UET6
  title: UniProt reviewed Q9UET6 FTSJ1 record
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Official identity, two alternative-product declarations, residue 219–220 deletion and direct 329/327-aa FASTAs were independently reconciled. Functional consequences of the shorter product are unresolved. The PTHR10920 family label is not used to infer an rRNA substrate.
