approved_synthesis:
  id: Q9UET6
  gene_symbol: FTSJ1
  taxon:
    id: NCBITaxon:9606
    label: Homo sapiens
  description: 'FTSJ1 is an S-adenosylmethionine-dependent tRNA ribose methyltransferase that modifies the anticodon loop of cytoplasmic tRNAs. Partner proteins help specify its substrates: THADA supports methylation at position 32, whereas WDR6 supports wobble position 34 methylation. Established activities include cytidine 32, guanosine 34 and cytidine 34 2-prime-O-methylation, with substrate requirements that vary among the tested tRNAs and assay conditions. FTSJ1 acts predominantly in the cytosolic compartment, with a smaller nuclear pool also detected. Its modifications prepare tRNAs for decoding and can influence codon-specific translation and neuronal morphology. Pathogenic FTSJ1 variants are associated with X-linked intellectual disability and can differentially affect the two anticodon-loop positions. UniProt documents two protein products with 329 and 327 residues; the shorter sequence lacks residues 219–220 of the longer protein; the functional effect of this sequence difference
    remains unestablished.'
  alternative_products:
  - name: '1'
    id: Q9UET6-1
  - name: '2'
    id: Q9UET6-2
    sequence_note: VSP_041419
  core_functions:
  - description: Cytidine 32 ribose methylation of tRNAs uses SAM and the THADA partner. Human FTSJ1 complementation, patient-cell modification profiles and the human FTSJ1-THADA structure support this activity. The ribose-methylation process retains position 32 coverage distinct from the wobble-position process.
    molecular_function:
      id: GO:0106339
      label: tRNA (cytidine(32)-2'-O-ribose)-methyltransferase activity
    directly_involved_in:
    - id: GO:0002128
      label: tRNA nucleoside ribose methylation
    locations:
    - id: GO:0005829
      label: cytosol
    supported_by:
    - reference_id: PMID:25404562
    - reference_id: PMID:26310293
    - reference_id: PMID:36720500
    - reference_id: PMID:40483304
  - description: Guanosine 34 ribose methylation of tRNAPhe is catalysed by FTSJ1 with WDR6. Patient-cell profiles and human reconstitution establish this wobble-site activity; the prerequisite m1G37 modification observed in one reconstitution is retained as an assay-specific substrate requirement.
    molecular_function:
      id: GO:0106340
      label: tRNA (guanosine(34)-2'-O-ribose)-methyltransferase activity
    directly_involved_in:
    - id: GO:0002130
      label: wobble position ribose methylation
    locations:
    - id: GO:0005829
      label: cytosol
    supported_by:
    - reference_id: PMID:26310293
    - reference_id: PMID:32558197
    - reference_id: PMID:36720500
  - description: Cytidine 34 ribose methylation of human tRNATrp is supported by patient-cell rescue, fragment mass spectrometry and FTSJ1-WDR6 reconstitution. The inherited Cm34 assertion is on the actual human lineage. A prior negative Trp assay remains a distinct tested context rather than a universal substrate exclusion.
    molecular_function:
      id: GO:0141098
      label: tRNA (cytidine(34)-2'-O-ribose)-methyltransferase activity
    directly_involved_in:
    - id: GO:0002130
      label: wobble position ribose methylation
    locations:
