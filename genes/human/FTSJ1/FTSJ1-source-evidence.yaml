- id: Reactome:R-HSA-6782315
  title: tRNA modification in the nucleus and cytosol
  cache_metadata:
    stable_id: R-HSA-6782315
    display_name: tRNA modification in the nucleus and cytosol
    species: Homo sapiens
    summary: At least 92 distinct tRNA nucleotide base modifications have been found. The modifications are made post-transcriptionally by a large group of disparate enzymes located in the nucleus, cytosol, and mitochondria (reviewed in Boschi-Muller and Motorin 2013, Jackman and Alfonzo 2013, Gu et al. 2014, Helm and Alfonzo 2014, Li and Mason 2014). Modifications near the anticodon and near the 3' end affect interaction of the tRNA with ribosomes and tRNA synthetases, respectively, while modifications in other regions of the tRNA affect folding and stability of the tRNA (reviewed in Hou et al. 2015). Mutations in tRNA modification enzymes are associated with human diseases (reviewed in Sarin and Leidel 2014, Torres et al. 2014).
  source:
    path: reactome/R-HSA-6782315.md
    mode: '100644'
    blob: 55250ea814ad844dfe6faadb26d6c92af729951f
    bytes: 1766
    sha256: f6370d37d5fc3a91430d95ed95df916da1c429e1e3a5315dadfd994c9b9dfc00
  limit: Genuine repository Reactome cache; selected target/reaction interpretation remains separately documented.
- id: Reactome:R-HSA-9024159
  title: FTSJ1 2'-O-methylates cytidine-32 in tRNA(Phe)
  cache_metadata:
    stable_id: R-HSA-9024159
    display_name: FTSJ1 2'-O-methylates cytidine-32 in tRNA(Phe)
    species: Homo sapiens
    summary: FTSJ1 methylates the 2'‑hydroxyl group of cytidine‑32 and guanosine‑34 in the anticodon loop of tRNA(Phe), as well as C32 and N34 of other substrate tRNAs (Guy and Phizicky 2015a, Guy et al. 2015b). Based on the functional and sequence homology between human FTSJ1 and yeast Trm7 the reaction is inferred to occur in the cytosol. THADA is required together with FTSJ1 for the methylation reaction at C32,  based on its complementation of trm732 mutants in yeast,  but the function of THADA has not been directly demonstrated in human cells (Guy and Phizicky 2015a).
  source:
