taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: FTSJ1 is an S-adenosylmethionine-dependent tRNA ribose methyltransferase that modifies the anticodon loop of cytoplasmic tRNAs. THADA supports methylation at position 32, whereas WDR6 supports wobble position 34 methylation. Established catalytic activities include cytidine 32, guanosine 34 and cytidine 34 2-prime-O-methylation, with substrate requirements that differ among tRNAs and assay conditions. Cellular studies also show FTSJ1-dependent uridine 32 methylation in tRNAArg and position 34 ribose methylation in tRNASec; these dependencies extend its substrate scope beyond the separately reconstituted reactions. FTSJ1 acts predominantly in the cytosol, with a smaller nuclear pool. Its modifications prepare tRNAs for decoding and influence codon-specific translation. Loss of FTSJ1 disrupts neuronal function, and pathogenic variants cause X-linked intellectual disability; different variants can affect anticodon-loop positions unequally.
