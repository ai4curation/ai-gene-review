    action: MARK_AS_OVER_ANNOTATED
    reason: 'GO:0002181 describes ribosome-mediated formation of proteins in the cytoplasm. FTSJ1 catalyses prior tRNA modification rather than a ribosomal translation step. The consequence for translation is directly supported in human cells: PMID:32558197 Figure 7 compares wild-type and FTSJ1-knockout HEK293T cells using normalized dual-luciferase reporters and finds reduced UUU decoding without the corresponding UUC effect. This human result corrects the previous mouse-only evidence summary, but does not by itself establish that FTSJ1 executes the annotated translation process. Mark the process assignment as over-annotated while retaining the supported decoding phenotype and core tRNA-methylation function. The incoming UniRule IEA source remains unchanged; experimental corroboration of a downstream phenotype does not convert this row into a new experimental annotation.'
