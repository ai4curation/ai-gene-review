suggested_experiments:
- description: Compare sequence-verified 329-aa and 327-aa FTSJ1 proteins with THADA or WDR6 using matched substrates, site-resolved mass spectrometry and controlled protein abundance.
- description: Compare purified and cell-derived Phe and Trp tRNAs with defined pre-existing modifications across matched FTSJ1-WDR6 reactions, including catalytically inactive and partner-omission controls.
- description: Combine genetic FTSJ1 perturbation and rescue in human neuronal cells with site-resolved tRNA analysis, codon-sensitive translation measurements and separate differentiation-rate and neurite-morphology endpoints.
- description: Reconstitute candidate U32 and Sec34 reactions with sequence-verified human FTSJ1, defined partner proteins and appropriately modified substrates; use site-resolved mass spectrometry and catalytically inactive, partner-omission and substrate controls.
suggested_questions:
- question: How does the documented two-residue alternative product differ in partner recruitment, substrate selectivity or localization? Sequence identity is established, but none of the selected assays directly compares the 219–220 deletion product with the longer product.
- question: Which substrate features and assay conditions determine FTSJ1-WDR6 activity on different tRNAs? Human Trp results differ between tested 2020 and 2021 contexts, and a Phe reconstitution required prior m1G37 modification.
- question: Which tRNA-modification changes causally connect FTSJ1 loss to neuronal morphology and decoding? Human UUU reporter and patient-cell modification results, mouse brain ribosome profiling and human DAP-treated neuronal morphology address different endpoints. The human neuronal differentiation fraction was unchanged, and genetic perturbation/rescue is needed to distinguish FTSJ1-dependent morphology from other DAP effects.
- question: Which partner and substrate modifications are required for direct uridine 32 and tRNASec position 34 ribose methylation by human FTSJ1? Cellular knockout/patient data establish dependence; isolated, site-resolved reactions are needed before assigning those specific catalytic capacities.
- question: How do the composition and substrate occupancy of cytosolic FTSJ1-THADA and FTSJ1-WDR6 complexes change across tRNA maturation states? Both partner contexts are experimentally supported, but a generic tRNA methyltransferase complex term would not resolve their distinct composition or stoichiometry.
