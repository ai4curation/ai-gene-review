taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'FTSJ1 is an S-adenosylmethionine-dependent tRNA ribose methyltransferase that modifies the anticodon loop of cytoplasmic tRNAs. Partner proteins help specify its substrates: THADA supports methylation at position 32, whereas WDR6 supports wobble position 34 methylation. Established activities include cytidine 32, guanosine 34 and cytidine 34 2-prime-O-methylation, with substrate requirements that vary among the tested tRNAs and assay conditions. FTSJ1 acts predominantly in the cytosolic compartment, with a smaller nuclear pool also detected. Its modifications prepare tRNAs for decoding and can influence codon-specific translation and neuronal morphology. Pathogenic FTSJ1 variants are associated with X-linked intellectual disability and can differentially affect the two anticodon-loop positions. UniProt documents two protein products with 329 and 327 residues; the shorter sequence lacks residues 219–220 of the longer protein; the functional effect of this sequence difference
  remains unestablished.'
