suggested_experiments:
- description: Compare sequence-verified 329-aa and 327-aa FTSJ1 proteins with THADA or WDR6 using matched substrates, site-resolved mass spectrometry and controlled protein abundance.
- description: Compare purified and cell-derived Phe and Trp tRNAs with defined pre-existing modifications across matched FTSJ1-WDR6 reactions, including catalytically inactive and partner-omission controls.
- description: Combine genetic FTSJ1 perturbation and rescue in human neuronal cells with site-resolved tRNA analysis, codon-sensitive translation measurements and separate differentiation-rate and neurite-morphology endpoints.
suggested_questions:
- question: How does the documented two-residue alternative product differ in partner recruitment, substrate selectivity or localization? Sequence identity is established, but none of the selected assays directly compares the 219–220 deletion product with the longer product.
- question: Which substrate features and assay conditions determine FTSJ1-WDR6 activity on different tRNAs? Human Trp results differ between tested 2020 and 2021 contexts, and a Phe reconstitution required prior m1G37 modification.
- question: Which tRNA-modification changes causally connect FTSJ1 loss to altered neuronal morphology and decoding? Patient-cell methylation profiles, mouse translation effects and human DAP morphology provide different levels of evidence; the human neuronal differentiation fraction was unchanged.
