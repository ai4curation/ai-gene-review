- id: PMID:17880280
  title: Trimerization of collagen IX alpha-chains does not require the presence of the COL1 and NC1
    domains.
  findings:
  - statement: Collagen IX is a heterotrimer built from three alpha chains, each with three collagenous
      (COL1-COL3) and four non-collagenous (NC1-NC4) domains numbered from the C-terminus.
    supporting_text: Collagen IX is a heterotrimer of three alpha-chains, which consists of three
      COL domains (collagenous domains) (COL1-COL3) and four NC domains (non-collagenous domains)
      (NC1-NC4), numbered from the C-terminus.
    reference_section_type: ABSTRACT
  - statement: Chain association and triple-helix formation can proceed without the COL1 and NC1 domains,
      but the COL2-NC2 region alone is insufficient, so trimerization draws on multiple COL and NC
      domains.
    supporting_text: collagen IX alpha-chains can associate in the absence of COL1 and NC1 domains
      to form a triple helix, but the COL2-NC2 region alone is not sufficient for trimerization
    reference_section_type: ABSTRACT
  - statement: Folding of collagen IX is a co-operative, multi-domain process in which the COL1-NC1
      region supplies chain specificity.
    supporting_text: The results suggest that folding of collagen IX is a co-operative process involving
      multiple COL and NC domains and that the COL1-NC1 region is important for chain specificity.
    reference_section_type: ABSTRACT
  - statement: Deleting NC1 reduced the fidelity of chain selection, showing that the C-terminal non-collagenous
      region, rather than helix formation per se, governs which chains are chosen.
    supporting_text: Both long variants were able to associate with NC1 or NC2 at the C-terminus and
      form various disulfide-bonded trimers, but the specificity of chain selection was diminished
      compared with full-length chains.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Original indexed accepted postprint Methods, Results, Discussion and Figure3 caption
      were read at https://www.researchgate.net/publication/5963382 . Results lines592–641 and the
      short literal anchor at625–626 distinguish individually expressed full-length chains, including
      alpha3, from engineered deletions and the coexpressed heterotrimer. COL9A3-notes.md Public primary
      anchors and the source-evidence index supply the public locator and exact returned-source hash.
      The normal cache remains abstract-only; the externally available postprint supports the stated
      construct-specific facts. No final-publisher-PDF or pixel reading is claimed.
core_functions:
- description: Alpha3(IX) contributes structural chain interfaces and covalent matrix connections
    as part of the alpha1/alpha2/alpha3 collagen IX heterotrimer. Native human cartilage cross-links
    integrate it with collagen II and neighboring collagen IX molecules, while engineered NC2 structures
    resolve one chain-selection/stagger interface. This fibril-associated contribution supports matrix
    integrity and organization; the chain is not itself a modifying enzyme or an autonomous major
    fibril.
