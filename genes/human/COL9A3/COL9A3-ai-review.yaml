- id: PMID:25037231
  title: Extracellular matrix signatures of human primary metastatic colon cancers and their metastases
    to liver.
  findings:
  - statement: Sequential extraction of human colon and liver tissue yields an insoluble fraction
      enriched for extracellular matrix proteins and depleted of intracellular markers.
    supporting_text: The insoluble fraction remaining after serial extraction was enriched for ECM
      proteins and largely depleted for intracellular components.
    reference_section_type: RESULTS
  - statement: ECM-enriched fractions were characterized by mass spectrometry, with the matrisome
      subsets reported in the supplementary workbooks where COL9A3/Q14050 is listed.
    supporting_text: The complete proteomic data sets and the matrisome subsets (ECM and ECM-associated
      proteins) are presented in Additional files 2 and 3.
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected full human patient extraction/MS Methods, Results and original supplementary
      workbook were read. Both sheets row128 explicitly identify Q14050, with 14 total unique peptides;
      detection/classification is distinguished from a mechanical or cancer-causal assay.
- id: PMID:27897211
  title: Structural insight for chain selection and stagger control in collagen.
  findings:
  - statement: Three distinct type IX NC2 chains, including alpha3, assemble to place attached triple-helical
      sequences in defined leading, middle and trailing positions.
    supporting_text: Three distinct chains (α1, α2 and α3) of the non-collagenous domain 2 (NC2) of
      type IX collagen are assembled to guide triple-helical sequences in the leading, middle and
      trailing positions.
    reference_section_type: ABSTRACT
  - statement: The crystallized NC2 trimer is a parallel right-handed bundle of three unique chains,
      with a disulfide bond between the alpha1 and alpha3 chains.
    supporting_text: Three unique chains form a parallel α-helical right-handed bundle.
    reference_section_type: RESULTS
  - statement: The stagger of the central COL2 collagenous domain of type IX collagen is alpha2-alpha1-alpha3
      and is set by the NC2 domain.
    supporting_text: At least for type IX collagen we can conclude now that the stagger of the central
      collagenous domain (COL2) is α2α1α3 and it is determined by the NC2 domain.
    reference_section_type: DISCUSSION
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected complete Methods/Results/Discussion were read. The type IX NC2 heterotrimer
      is attached to engineered type I host–guest sequences. Alpha3 is directly present, but neither
      intact IX structure nor all full-chain behavior is inferred.
