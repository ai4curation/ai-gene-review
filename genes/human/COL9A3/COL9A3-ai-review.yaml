- id: Reactome:R-HSA-2022073
  title: Procollagen triple helix formation
  findings:
  - statement: Procollagen triple-helix formation starts from the aligned C-terminal prodomains and
      propagates C-to-N in the rough endoplasmic reticulum, which is why alpha3(IX) precursors are
      placed in the ER lumen.
    supporting_text: Alignment of the C-terminal prodomains initiates triple helix formation, which
      propagates in a zipper-like fashion in the C-to-N direction. This occurs in the rough endoplasmic
      reticulum
    reference_section_type: DATABASE_ENTRY
  - statement: The enzymatic and chaperone activities in this event belong to other proteins (the
      prolyl 3-hydroxylase complex, cyclophilin B, HSP47), not to the collagen chains themselves.
    supporting_text: Efficient folding involves additional collagen-specific chaperones such as Serpin
      H1
    reference_section_type: DATABASE_ENTRY
