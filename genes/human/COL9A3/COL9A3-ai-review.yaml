    reference_section_type: ABSTRACT
suggested_questions:
- question: What target-specific localization or ancestral placement supports the inherited COL9A3
    basement-membrane annotation, and does it concern the vitreoretinal interface rather than vitreous
    fibrils themselves?
- question: How do alpha3–alpha3 and alpha3–type II cross-links contribute separately to the mechanics
    and stability of the native cartilage and vitreous network?
- question: What is the physiological fate of alpha3-only dimers seen after recombinant expression,
    and how does coexpression of alpha1/alpha2 control their incorporation into collagen IX?
- question: How should current sequence-feature NC2/NC3 labels be reconciled with the experimentally
    named NC2 assembly domain spanning the alpha3 517–553 structural construct?
suggested_experiments:
- description: Map sequence-verified alpha3 chains and site-specific native cross-links in cartilage
    and vitreous, combining cross-link mass spectrometry with matrix mechanics after selective site
    substitution.
  hypothesis: Different alpha3 cross-links make distinguishable contributions to native matrix connectivity.
- description: Use alpha3-specific immunogold localization at the vitreoretinal interface with fibril
    and basement-membrane markers and chain-deficient controls.
  hypothesis: Target-specific localization can distinguish vitreous-fibril residence from a basement-membrane-associated
    pool.
