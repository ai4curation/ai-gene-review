      the basement-membrane functional premise remains unresolved.'
- id: PMID:25037231
  title: Extracellular matrix signatures of human primary metastatic colon cancers and their metastases
    to liver.
  findings:
  - statement: Human colon, tumour and liver samples were serially extracted to leave an insoluble
      ECM-enriched fraction, which was then analysed by LC-MS/MS; COL9A3/Q14050 is among the proteins
      identified in that fraction.
    supporting_text: leaving a final insoluble fraction enriched for ECM proteins
    reference_section_type: METHODS
  - statement: The study is a compositional survey of the extracellular matrix of human tissues; it
      measures protein presence and matrisome classification, not mechanical properties or any causal
      role for an individual collagen chain.
    supporting_text: 'METHODS: We have used enrichment of extracellular matrix (ECM) from human'
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected full human patient extraction/MS Methods, Results and original supplementary
      workbook were read. Both sheets row128 explicitly identify Q14050, with 14 total unique peptides;
      detection/classification is distinguished from a mechanical or cancer-causal assay.
- id: PMID:27897211
  title: Structural insight for chain selection and stagger control in collagen.
  findings:
  - statement: The assembly domain of type IX collagen contains three distinct chains, alpha1, alpha2
      and alpha3, each occupying a defined position (leading, middle, trailing) in the triple helix,
      so alpha3(IX) is a constituent chain of the type IX trimer and contributes a chain-selection
      interface.
    supporting_text: Three distinct chains (α1, α2 and α3) of the non-collagenous domain 2 (NC2) of
      type IX collagen are assembled to guide triple-helical sequences in the leading, middle and trailing
      positions
    reference_section_type: ABSTRACT
  - statement: Heterotrimeric collagens require mechanisms that select which chains assemble and in
      which register, which is the structural problem the type IX assembly domain solves.
    supporting_text: Thus there must be mechanisms that control composition and stagger during collagen
      folding
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected complete Methods/Results/Discussion were read. The type IX NC2 heterotrimer
      is attached to engineered type I host–guest sequences. Alpha3 is directly present, but neither
