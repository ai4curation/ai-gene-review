core_functions:
- description: Alpha3(IX) contributes structural chain interfaces and covalent matrix connections
    as part of the alpha1/alpha2/alpha3 collagen IX heterotrimer. Native human cartilage cross-links
    integrate it with collagen II and neighboring collagen IX molecules, while engineered NC2 structures
    resolve one chain-selection/stagger interface. This fibril-associated contribution supports matrix
    integrity and organization; the chain is not itself a modifying enzyme or an autonomous major
    fibril.
  molecular_function:
    id: GO:0030020
    label: extracellular matrix structural constituent conferring tensile strength
  in_complex:
    id: GO:0005594
    label: collagen type IX trimer
  locations:
  - id: GO:0031012
    label: extracellular matrix
  directly_involved_in:
  - id: GO:0030198
    label: extracellular matrix organization
  supported_by:
  - reference_id: PMID:8660302
    supporting_text: in human cartilage, type IX collagen is covalently cross-linked to type II collagen
      and to other molecules of type IX collagen
    reference_section_type: ABSTRACT
  - reference_id: PMID:27897211
    supporting_text: Three distinct chains (α1, α2 and α3) of the non-collagenous domain 2 (NC2) of
      type IX collagen are assembled to guide triple-helical sequences in the leading, middle and
      trailing positions.
    reference_section_type: ABSTRACT
  - reference_id: PMID:17880280
    supporting_text: The results suggest that folding of collagen IX is a co-operative process involving
      multiple COL and NC domains and that the COL1-NC1 region is important for chain specificity.
    reference_section_type: ABSTRACT
suggested_questions:
- question: What target-specific localization or ancestral placement supports the inherited COL9A3
    basement-membrane annotation, and does it concern the vitreoretinal interface rather than vitreous
    fibrils themselves?
- question: How do alpha3–alpha3 and alpha3–type II cross-links contribute separately to the mechanics
    and stability of the native cartilage and vitreous network?
- question: What is the physiological fate of alpha3-only dimers seen after recombinant expression,
    and how does coexpression of alpha1/alpha2 control their incorporation into collagen IX?
- question: How should current sequence-feature NC2/NC3 labels be reconciled with the experimentally
    named NC2 assembly domain spanning the alpha3 517–553 structural construct?
suggested_experiments:
- description: Map sequence-verified alpha3 chains and site-specific native cross-links in cartilage
    and vitreous, combining cross-link mass spectrometry with matrix mechanics after selective site
    substitution.
  hypothesis: Different alpha3 cross-links make distinguishable contributions to native matrix connectivity.
- description: Use alpha3-specific immunogold localization at the vitreoretinal interface with fibril
    and basement-membrane markers and chain-deficient controls.
  hypothesis: Target-specific localization can distinguish vitreous-fibril residence from a basement-membrane-associated
    pool.
