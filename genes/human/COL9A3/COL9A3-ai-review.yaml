id: Q14050
gene_symbol: COL9A3
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: COL9A3 encodes the alpha3 chain of collagen IX, a fibril-associated collagen with interrupted
  triple helices. It assembles with alpha1(IX) and alpha2(IX) in cartilage and vitreous extracellular
  matrix. Its collagenous and noncollagenous regions contribute to chain assembly, and alpha3(IX)
  forms covalent connections within the type II/type IX collagen network. These structural interactions
  help organize and stabilize the matrix. Pathogenic variants cause multiple epiphyseal dysplasia
  and recessive Stickler syndrome with skeletal, auditory and ocular manifestations.
