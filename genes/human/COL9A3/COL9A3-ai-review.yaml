- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  findings:
  - statement: PAINT phylogenetic inference supplies four of the COL9A3 rows under review, from nodes
      PTN008601345 (collagen type IX trimer), PTN001166351 (structural constituent conferring tensile
      strength), PTN002770636 (extracellular matrix organization) and PTN002770818 (basement membrane).
      The current PANTHER19 PTHR24023 topology places the sequence-verified COL9A3 leaf below all
      four, so the inheritance context is sound; only the basement-membrane location premise remains
      unresolved for this target.
    full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: 'The PAINT method reference is preserved. Actual dated IBD records and the PANTHER19
      target tree/alignment were inspected: Q14050 has an exact 684-residue sequence match, and the
      questioned tensile-strength node is deep Metazoa-Choanoflagellida rather than collagen-IV-specific.
      Current inheritance context is distinguished from a historical curator-session reconstruction;
      the basement-membrane functional premise remains unresolved.'
- id: PMID:25037231
  title: Extracellular matrix signatures of human primary metastatic colon cancers and their metastases
    to liver.
  findings:
  - statement: Serial extraction of human colon, tumour and liver tissue yields an insoluble fraction
      enriched for extracellular matrix proteins and depleted of intracellular markers, the fraction
      in which Q14050/COL9A3 was detected.
    supporting_text: The insoluble fraction remaining after serial extraction was enriched for ECM
      proteins and largely depleted for intracellular components.
    reference_section_type: RESULTS
  - statement: The proteins identified were classified into matrisome (ECM and ECM-associated) subsets
      reported in the supplementary workbook, where COL9A3 appears in both the complete-data and matrisome
      sheets.
    supporting_text: The complete proteomic data sets and the matrisome subsets (ECM and ECM-associated
      proteins) are presented in Additional files 2 and 3
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected full human patient extraction/MS Methods, Results and original supplementary
      workbook were read. Both sheets row128 explicitly identify Q14050, with 14 total unique peptides;
      detection/classification is distinguished from a mechanical or cancer-causal assay.
- id: PMID:27897211
  title: Structural insight for chain selection and stagger control in collagen.
  findings:
  - statement: The three distinct type IX collagen chains alpha1, alpha2 and alpha3 assemble through
      their NC2 assembly domain, which sets both chain composition and the leading/middle/trailing
      stagger of the triple helix.
    supporting_text: Three distinct chains (α1, α2 and α3) of the non-collagenous domain 2 (NC2) of
