- term:
    id: GO:0005351
    label: carbohydrate:proton symporter activity
  evidence_type: NAS
  original_reference_id: PMID:10860667
  qualifier: enables
  review:
    summary: Wrong transport mode. This NAS annotation derives from the original cloning
      paper, which identified SLC2A9 by homology as a member of the FACILITATIVE glucose
      transporter family, not as a proton-coupled symporter. GLUT9 is a facilitative,
      Na+-independent, voltage-driven transporter and no proton coupling has ever been
      demonstrated.
    action: MODIFY
    reason: The carbohydrate:proton symporter activity term asserts secondary active
      (proton-coupled) transport, which is mechanistically wrong for a facilitative
      GLUT. The cited paper only places SLC2A9 in the facilitative glucose transporter
      family. The defensible facilitative hexose term the paper supports is D-glucose
      transmembrane transporter activity; the proton-symport mode should be dropped.
    proposed_replacement_terms:
    - id: GO:0055056
      label: D-glucose transmembrane transporter activity
    supported_by:
    - reference_id: PMID:10860667
      supporting_text: Several lines of evidence suggest the existence of additional
        members of the mammalian facilitative glucose transporter family
- term:
    id: GO:0005353
    label: fructose transmembrane transporter activity
  evidence_type: IDA
  original_reference_id: PMID:18842065
  qualifier: enables
  review:
    summary: GLUT9 retains weak, low-capacity facilitative fructose transport, a genuine
      secondary activity inherited within the GLUT family but of uncertain physiological
      relevance relative to urate transport (urate is transported 45-60x faster than
      glucose, and a second group could not confirm sugar transport at all).
    action: KEEP_AS_NON_CORE
    reason: Direct assays support residual fructose/glucose facilitative transport,
      but this is minor and physiologically secondary to the gene's core urate-transport
      role; it is retained as a non-core activity rather than removed.
    supported_by:
    - reference_id: UniProtKB:Q9NRM0
      supporting_text: May have a residual high-affinity, low-capacity glucose and fructose
        transporter activity
    - reference_id: UniProtKB:Q9NRM0
      supporting_text: another group could not confirm transporter activity for glucose
        or fructose
