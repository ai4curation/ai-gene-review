core_functions:
- description: High-capacity, sodium-independent, voltage-driven facilitative urate
    uniport across the plasma membrane. In the renal proximal tubule the long isoform
    on the basolateral membrane exports reabsorbed urate from the tubular cell to the
    blood, making SLC2A9 a principal determinant of renal urate reabsorption and serum
    urate concentration.
  molecular_function:
    id: GO:0015143
    label: urate transmembrane transporter activity
  supported_by:
  - reference_id: PMID:18701466
    supporting_text: 'GLUT9-expressed Xenopus oocytes mediated saturable urate transport
      (K(m): 365+/-42 microm)'
  - reference_id: PMID:18842065
    supporting_text: We expressed both SLC2A9 splice variants in Xenopus laevis oocytes
      and found both isoforms mediate rapid urate fluxes at concentration ranges similar
      to physiological serum levels (200-500 microM)
  locations:
  - id: GO:0016323
    label: basolateral plasma membrane
  - id: GO:0016324
    label: apical plasma membrane
  - id: GO:0005886
    label: plasma membrane
proposed_new_terms: []
suggested_questions:
- question: Should GO provide a urate homeostasis (or regulation of urate transport)
    biological-process term? SLC2A9's GWAS-supported systemic role (influencing serum
    urate levels) is a transport-driven homeostatic phenotype currently forced into
    urate metabolic process (a metabolism-branch term), which does not accurately describe
    a transporter.
- question: Is the dehydroascorbic acid transport activity (inherited phylogenetically
    from class I GLUTs) actually present in SLC2A9, given that SLC2A9 does not transport
    reduced vitamin C?
suggested_experiments:
- description: Isoform-resolved electrophysiology (two-electrode voltage clamp) of SLC2A9-L
    vs SLC2A9-S in oocytes across physiological membrane potentials to quantify the
    voltage dependence and directionality (efflux vs influx) of urate transport and
    its modulation by intracellular/extracellular hexoses.
- description: Structure-guided mutagenesis of the urate-binding/permeation path (building
    on cryo-EM structures 8Y65/8ZXN) combined with urate and glucose flux assays to
    define residues that distinguish urate from hexose permeation.
