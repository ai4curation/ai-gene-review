id: Q9NRM0
gene_symbol: SLC2A9
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SLC2A9 (GLUT9) is a class II member of the SLC2 facilitative transporter
  family (major facilitator superfamily; 12 transmembrane helices) that functions principally
  as a high-capacity, sodium-independent, voltage-driven urate uniporter. In the kidney
  it drives transcellular urate reabsorption in the proximal tubule, exporting urate
  from the tubular epithelial cell to the blood, and is a major determinant of serum
  urate concentration; loss-of-function variants cause renal hypouricemia and common
  variants associate with serum urate levels and gout. Two splice isoforms that differ
  only at the N-terminus target different membrane domains of polarized renal epithelia
  (the long isoform to the basolateral membrane of proximal tubule, the short isoform
  to the apical membrane of collecting ducts). Having evolved within the GLUT family,
  it also retains weak, low-capacity facilitative glucose and fructose transport activity
  of uncertain physiological relevance.
