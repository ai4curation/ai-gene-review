- term:
    id: GO:0045095
    label: keratin filament
  evidence_type: TAS
  original_reference_id: PMID:16382671
  qualifier: located_in
  review:
    summary: Proposed keratin filament location for KRTAP19-1, the defining location of hair keratin-associated proteins.
    action: NEW
    reason: KRTAP19-1 is a member of a characterized hair KAP family; KAPs are matrix proteins that surround and cross-link hair keratin intermediate filaments in the hair fibre. GOA lacks any informative location for this gene (only cytosol), whereas related KAPs carry keratin filament via the InterPro keratin-matrix signature, which this sequence does not match. GO has no separate term for the keratin-associated matrix, so keratin filament is the closest location.
    supported_by:
    - reference_id: PMID:16382671
      supporting_text: Hair keratin-associated proteins (KAP) are a major component of the hair fiber, and play crucial roles in forming a strong hair shaft through a cross-linked network with keratin intermediate filaments (KIF), which are produced from hair keratins
    - reference_id: Reactome:R-HSA-6809663
      supporting_text: KAPs forming extensive disulfide cross-links with keratin filaments
    - reference_id: file:human/KRTAP19-1/KRTAP19-1-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: '[hair keratin-]associated proteins (KRTAP), which are essential for the formation of a rigid and resistant hair shaft through their extensive disulfide bond cross-linking with abundant cysteine residues of hair keratins'
    - reference_id: PMID:12359730
