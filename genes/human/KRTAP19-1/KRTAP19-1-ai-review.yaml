id: Q8IUB9
gene_symbol: KRTAP19-1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: KRTAP19-1 (keratin-associated protein 19-1, KAP19.1) is a small (90 aa) high glycine-tyrosine (HGT) hair keratin-associated protein of the KAP19 family, encoded in the chromosome 21q22.1 KAP gene domain. It is expressed in the upper portion of the hair cortex, where KAPs form the interfilamentous matrix around hair keratin intermediate filaments; HGT KAPs are thought to interact with keratins through disulfide bonds and hydrophobic interactions, contributing to the rigidity and resistance of the hair shaft. KRTAP19-1 has been reported within a multigene prognostic expression signature in head and neck squamous cell carcinoma, without functional follow-up.
