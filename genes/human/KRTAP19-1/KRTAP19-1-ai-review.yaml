- term:
    id: GO:0005829
    label: cytosol
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: located_in
  supporting_entities:
  - ARBA:ARBA00029243
  review:
    summary: "ARBA-rule cytosol placement; KAPs are synthesized in the cytoplasm of keratinizing cortical cells but act in the keratin matrix."
    action: KEEP_AS_NON_CORE
    reason: "Keratin-associated proteins are non-membrane proteins synthesized in the cytoplasm of differentiating (keratinizing) hair or wool cortical cells, so a cytoplasmic/cytosolic placement is true of the newly made protein. It is not the site of function: KAPs act in the interfilamentous matrix around trichocyte keratin intermediate filaments of the keratinized cell, which this review captures with keratin filament (GO:0045095). The placement is correct but peripheral, so it is kept as non-core rather than marked as over-annotated; ARBA IEA and Reactome TAS cytosol rows are treated identically across the KRTAP family reviews."
    supported_by:
    - reference_id: Reactome:R-HSA-6809663
      supporting_text: In the lower and middle cortex, keratin filaments are embedded in a matrix that consists of KAPs.
    - reference_id: file:human/KRTAP19-1/KRTAP19-1-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: '[hair keratin-]associated proteins (KRTAP), which are essential for the formation of a rigid and resistant hair shaft through their extensive disulfide bond cross-linking with abundant cysteine residues of hair keratins'
