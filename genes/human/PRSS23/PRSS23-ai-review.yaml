id: O95084
gene_symbol: PRSS23
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Secreted glycoprotein of the chymotrypsin-like (S1) peptidase fold, synthesised as a
  precursor with an N-terminal signal peptide and an extended prodomain and released from cells as
  a processed, N-glycosylated protease-homology domain. Despite retaining the canonical Ser-His-Asp
  catalytic triad (His175, Asp246, Ser316), PRSS23 lacks the Ile16-Asp194 zymogen activation switch
  that orders the activation-domain loops and builds the S1 substrate pocket and oxyanion hole of
  active S1 proteases; the substitutions that dismantle this switch are conserved across vertebrate
  orthologs. No serine hydrolase activity is detectable from the secreted protein by activity-based
  probe labelling or from the recombinant domain across a panel of chromogenic peptide substrates,
  and cellular phenotypes attributed to PRSS23 persist when the putative catalytic serine is mutated,
  so the protein is best understood as a serine pseudoprotease whose molecular activity has not been
  established. It is expressed in the ovary, where it marks atretic follicles and peri-ovulatory
  stroma and theca, and in the developing cardiovascular system, where loss of the zebrafish ortholog
  blocks endothelial-to-mesenchymal transition at the atrioventricular canal. High PRSS23 expression
  is associated with poor survival in ovarian cancer, and its depletion reduces proliferation, increases
  anoikis sensitivity and impairs peritoneal dissemination.
