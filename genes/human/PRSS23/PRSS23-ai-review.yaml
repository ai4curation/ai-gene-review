core_functions:
- description: 'Secreted serine pseudoprotease of the S1 (chymotrypsin-like) fold. PRSS23 is made
    as a signal-peptide-bearing precursor, processed at an RRKR motif, N-glycosylated and released
    as a ~36 kDa protease-homology domain. The Ser-His-Asp triad is intact but the Ile16-Asp194 zymogen
    activation switch that assembles a competent S1 active site is absent, and it is absent in vertebrate
    orthologs generally; no serine hydrolase activity is detectable from the secreted protein or
    the recombinant domain. Its molecular activity is therefore not established: the S1 fold is retained
    as a binding module of unknown specificity, of the kind that in other pseudoproteases serves
    as a receptor ligand, a non-catalytic cofactor in a protease cascade, or a scaffold. No molecular_function
    term is asserted here, because none can be supported.'
  locations:
  - id: GO:0005615
    label: extracellular space
  supported_by:
  - reference_id: PMID:41985786
    supporting_text: Endogenous epitope tagging demonstrated that PRSS23 is synthesized as a precursor
      and secreted as a processed, glycosylated protease homology domain that retains the catalytic
      triad yet lacks the canonical Ile16-Asp194 zymogen activation switch.
    reference_section_type: ABSTRACT
  - reference_id: PMID:41985786
    supporting_text: PRSS23 substitutes Gln at the predicted mature N terminus and Ala at the Asp194-equivalent
      position, eliminating the canonical Ile16-Asp194 salt bridge; the His40-equivalent residue
      is also substituted.
    reference_section_type: RESULTS
  - reference_id: PMID:41985786
    supporting_text: Together, these data support the hypothesis that PRSS23 functions as a secreted
      serine pseudoprotease whose prometastatic effects in ovarian cancer are mediated by nonproteolytic
      mechanisms.
    reference_section_type: DISCUSSION
suggested_questions:
- question: Should GOA record the negative result explicitly, as NOT|enables GO:0004252 serine-type
    endopeptidase activity with IDA evidence from PMID:41985786, rather than simply dropping the
    InterPro IEA? A NOT annotation would protect the gene against re-assertion the next time the
    S1 signature is re-mapped.
- question: What does the secreted PRSS23 protease-homology domain actually bind? The 2026 study
    frames the options - receptor ligand, non-catalytic cofactor or decoy in a protease cascade,
    or scaffold - but does not discriminate among them, and no molecular function can be annotated
    until one is established.
- question: How can a signal-peptide-bearing, glycosylated, secreted protein bind cytosolic eIF4E
    (PMID:39920289)? Is there a genuine unsecreted intracellular pool of PRSS23, or is that interaction
    an artefact of overexpression - and does the same question explain the LIFEdb nuclear localisation?
- question: Is the zebrafish EndoMT/Snail requirement (PMID:23213106) also protease-independent?
    The morpholino experiments predate the activity assays; repeating the rescue with a catalytic-serine
    mutant would settle whether the developmental role is non-proteolytic too.
- question: Do the paralogous S1 members that share the dismantled activation switch - PRSS35 is
    named in the 2026 paper, and in most species also substitutes Thr for the catalytic Ser - warrant
    the same reclassification, and how many other InterPro-driven S1 protease annotations rest on
    triad conservation alone?
suggested_experiments:
- description: 'Interactome of the secreted, endogenously tagged PRSS23 protease-homology domain:
    anti-HA immunoprecipitation from conditioned media (the same JHOC-5 system used for the activity-based
    probe work) followed by quantitative LC-MS/MS against the Ser316Ala line and an untagged control,
    to identify partners of the fold and discriminate the receptor-ligand, cofactor and scaffold
    models.'
- description: Reconstitute the activation switch. Introduce the Ile16 and Asp194 equivalents into
    recombinant PRSS23 (alone and combined) and re-assay with the activity-based probe and the chromogenic
    panel. Work on other pseudoproteases predicts that restoring switch residues will not restore
    activity; a negative result would show the fold has been remodelled beyond the switch, and a
    positive one would date the loss of catalysis precisely.
- description: 'Separate the protease-homology domain from the prodomain functionally: test whether
    purified secreted domain added exogenously to PRSS23-knockdown ovarian carcinoma spheroids rescues
    anoikis resistance and proliferation. This asks whether PRSS23 acts as a diffusible extracellular
    ligand at all, which is the premise behind proposing to intercept its secretion therapeutically.'
- description: 'Surface-binding screen for a receptor: label the recombinant domain and assay binding
    to mesothelial and ovarian carcinoma cell surfaces, with and without pre-treatment by heparinase
    and phospholipase C, then deconvolute any specific binding by proximity labelling. This directly
    tests the ligand-pseudoprotease model exemplified by HGF and MSP.'
- description: Endogenous catalytic-serine knock-in mouse (Prss23 S-to-A) compared with a Prss23
    null, phenotyped for ovarian follicular atresia and cardiac valve morphogenesis. If the catalytic
    mutant is normal and the null is not, the protease-independent model holds in normal physiology
    and not only in tumour cells.
