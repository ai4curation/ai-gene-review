existing_annotations:
- term:
    id: GO:0004252
    label: serine-type endopeptidase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: Electronic domain-match assignment that direct assay now contradicts; PRSS23 is a secreted
      serine pseudoprotease.
    action: REMOVE
    reason: 'This annotation has no experimental support anywhere in GOA. It is IEA only, derived
      from InterPro signatures IPR001254/IPR018114 via GO_REF:0000002, i.e. from the presence of
      an S1 protease fold and an intact Ser-His-Asp triad. Akhtar et al. 2026 assayed the protein
      directly and found no activity by two independent methods: a fluorophosphonate activity-based
      probe failed to label secreted PRSS23 in conditioned media in which multiple other secreted
      serine hydrolases labelled robustly, and the recombinant protease domain showed no catalytic-serine-dependent
      turnover across a panel of chromogenic pNA substrates spanning diverse P1 residues, judged
      against a matched Ser316Ala control. The structural basis is also identified: PRSS23 retains
      the triad but has lost every component of the Ile16-Asp194 zymogen activation switch that orders
      the activation-domain loops and creates the S1 pocket and oxyanion hole, and these substitutions
      are conserved across vertebrate orthologs. Consistently, the pro-tumorigenic phenotypes survive
      mutation of Ser316, and independent work in gastric cancer found eIF4E binding and progrowth
      phenotypes retained in catalytic triad mutants. The authors propose reclassification as a serine
      pseudoprotease. Removing an electronic inference that the only direct measurement refutes is
      exactly the case CLAUDE.md sanctions; no curator''s experimental judgment is being second-guessed
      here.'
    supported_by:
    - reference_id: PMID:41985786
      supporting_text: In complementary biochemical assays, PRSS23 showed no detectable serine hydrolase
        activity in either activity-based probe labeling of conditioned media or chromogenic peptide
        substrate assays using the recombinant protease domain.
      reference_section_type: ABSTRACT
    - reference_id: PMID:41985786
      supporting_text: Taken together with the disrupted Ile16-Asp194 activation switch inferred
        from sequence analysis, these findings indicate that secreted PRSS23 lacks detectable serine
        protease activity.
      reference_section_type: RESULTS
    - reference_id: PMID:41985786
      supporting_text: Multiple probe-reactive secreted hydrolases are detected in CM; however, no
        probe-reactive band corresponding to PRSS23 is detected at the expected molecular weight
        in either CM or anti-HA IP fractions.
      reference_section_type: RESULTS
- term:
    id: GO:0005576
    label: extracellular region
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  review:
    summary: 'Correct, and now directly demonstrated: endogenous epitope tagging shows a processed,
      glycosylated PRSS23 fragment in conditioned media.'
    action: MODIFY
    reason: 'The annotation derives from the UniProt SubCell mapping SL-0243 (Secreted), and endogenous
      3xHA tagging in ovarian carcinoma cells confirms it: the protein enters the secretory pathway
      as a precursor, is processed at the RRKR motif, and is released as a ~36 kDa N-glycosylated
      protease-homology domain recovered from conditioned media by immunoprecipitation and LC-MS/MS.
      Recovery from conditioned media places the mature fragment in extracellular fluid specifically,
      so the more informative child term GO:0005615 extracellular space is proposed in place of the
      parent.'
    proposed_replacement_terms:
    - id: GO:0005615
      label: extracellular space
    supported_by:
    - reference_id: PMID:41985786
      supporting_text: These data indicate that in ovarian cancer cells PRSS23 enters the secretory
        pathway as a precursor protein that is processed, likely at the canonical RRKR motif, and
        secreted as a glycosylated protease domain fragment after removal of the prodomain.
      reference_section_type: RESULTS
- term:
    id: GO:0006508
    label: proteolysis
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: The biological-process counterpart of the refuted catalytic annotation; falls with it.
    action: REMOVE
    reason: 'Same provenance as GO:0004252 - IEA from InterPro IPR001254/IPR018114 via GO_REF:0000002,
      with no experimental support in GOA. There is no evidence that PRSS23 cleaves any substrate:
      neither activity-based probe labelling of the secreted protein nor a chromogenic substrate
      panel applied to the recombinant domain detected catalytic-serine-dependent hydrolysis, and
      the Ile16-Asp194 activation switch required to assemble a competent S1 active site is absent
      and conserved absent across vertebrates. The paper draws the annotation moral explicitly for
      this gene.'
    supported_by:
    - reference_id: PMID:41985786
      supporting_text: Across this substrate panel, we did not observe reproducible substrate turnover
        above background that depended on the putative catalytic serine; WT and Ser316Ala preparations
        exhibited similar rates for all substrates tested
      reference_section_type: RESULTS
    - reference_id: PMID:41985786
      supporting_text: Thus, sequence-based annotation focused solely on the catalytic triad will
        tend to overestimate catalytic competence and underestimate the true prevalence of serine
        pseudoproteases, as appears to be the case for PRSS23.
      reference_section_type: DISCUSSION
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:32296183
  qualifier: enables
  review:
    summary: Bare protein binding from a systematic binary interactome screen; carries no functional
      information.
    action: REMOVE
    reason: >-
      No more informative molecular function is supportable from this evidence, so
      the row is removed rather than rewritten. The supporting datum is a single yeast-two-hybrid
      pair from the HuRI reference interactome (partner UniProtKB:Q9BY50, SEC11C, the catalytic
      subunit of the signal peptidase complex), which for a signal-peptide-bearing secretory protein
      is more plausibly a biogenesis contact than a functional partnership. Notably, the one direct
      partner reported from a focused study - eIF4E, bound through the trypsin-like domain - is not
      captured here, and even that interaction is hard to reconcile with a secreted protein. Removal
      does not imply the reported interaction is false.
- term:
    id: GO:0005788
    label: endoplasmic reticulum lumen
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-8952289
  qualifier: located_in
  review:
    summary: Secretory-pathway transit compartment, asserted because PRSS23 is a FAM20C phosphorylation
      substrate.
    action: KEEP_AS_NON_CORE
    reason: The Reactome reaction R-HSA-8952289 ("FAM20C phosphorylates FAM20C substrates") places
      PRSS23 among secreted proteins phosphorylated by the secretory-pathway kinase FAM20C; UniProt
      records the resulting Ser109 phosphosite (ECO:0000269|PubMed:26091039). The localisation is
      therefore real but reflects the route the protein takes to the outside of the cell rather than
      where it acts. Retained as non-core.
- term:
    id: GO:0070062
    label: extracellular exosome
  evidence_type: HDA
  original_reference_id: PMID:19199708
  qualifier: located_in
  review:
    summary: Detected in a parotid-gland exosome proteomics dataset; consistent with secretion but
      not an informative site of action.
    action: KEEP_AS_NON_CORE
    reason: A high-throughput mass-spectrometry identification in purified exosomes. It is compatible
      with the established secretion of PRSS23 and with its recovery from conditioned media, but
      exosomal co-purification is a common outcome for secreted proteins and does not establish that
      exosomes are where PRSS23 functions.
- term:
    id: GO:0005634
    label: nucleus
  evidence_type: IDA
  original_reference_id: GO_REF:0000054
  qualifier: located_in
  review:
    summary: Single fusion-protein localisation screen, hard to reconcile with a signal-peptide protein
      that endogenous tagging shows being secreted.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'GO_REF:0000054 is the LIFEdb resource, which annotates localisation of expressed fluorescent
      fusion proteins in living cells. PRSS23 has a cleaved signal peptide (UniProt SIGNAL 1..19),
      two N-glycosylation sequons, a FAM20C phosphosite acquired in the secretory pathway, and endogenous
      3xHA tagging demonstrates that the mature protein is processed and secreted; nuclear residence
      is difficult to reconcile with that itinerary, and overexpressed fusions of secretory proteins
      frequently mislocalise when the signal sequence is occluded or targeting is saturated. Flagged
      rather than removed: this is an IDA, I have not seen the primary images, and a minor unsecreted
      intracellular pool cannot be excluded - indeed the reported eIF4E interaction would require
      one.'
