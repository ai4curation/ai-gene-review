core_functions:
- description: Catalyzes calcium-dependent nucleoside-diphosphate hydrolysis in the secretory pathway,
    with UDP turnover supporting proteoglycan glycosaminoglycan synthesis. The nucleotide-recycling model
    couples removal of luminal UDP to UMP production for nucleotide-sugar exchange; CANT1 does not transfer
    sugars to the glycan chain.
