taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CANT1 is a calcium-dependent nucleoside diphosphatase of the secretory pathway. The full-length
  protein has an N-terminal type-II membrane anchor and a lumen-facing catalytic domain associated with
  the endoplasmic reticulum and Golgi; soluble processed forms can be secreted. It preferentially hydrolyzes
  UDP and also acts on GDP and IDP, with much lower ADP activity. Luminal UDP turnover is thought to support
  proteoglycan glycosaminoglycan synthesis by removing a glycosyltransferase product and supplying UMP
  for nucleotide-sugar exchange. Human loss-of-function variants impair glycan production and cause recessive
  skeletal dysplasias, including Desbuquois dysplasia type 1 and multiple epiphyseal dysplasia 7. Calcium-dependent
  homodimerization is a biochemical property of the enzyme.
