suggested_questions:
- question: Which endogenous human CANT1 forms reach the cell surface, and how does their activity differ
    from ER/Golgi and released soluble forms?
- question: How does loss of luminal CANT1 change UDP and UMP concentrations, nucleotide-sugar transport
    and GAG-chain elongation in human chondrocytes?
- question: Which CANT1 construct produced the NF-kappaB reporter-screen signal, and does physiological
    CANT1 perturbation reproduce that effect?
suggested_experiments:
- description: Measure compartment-resolved nucleotide pools and GAG production in human CANT1-deficient
    chondrocytes rescued with wild-type or catalytically inactive CANT1, separating catalytic turnover
    from protein abundance and trafficking.
- description: Compare endogenous surface labeling, ER/Golgi localization and secretion for the three
    CANT1 products while measuring nucleotidase activity, rather than inferring localization from bulk
    protein expression.
