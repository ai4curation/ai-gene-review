    enzyme belonging to a new family of extracellular nucleotidases.
  findings: []
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Human cloning/expression and substrate spectrum; abstract-only cache and unsuccessful
      full-text retrieval. Historical 371-residue precursor is distinguished from the current 401-residue
      canonical sequence. UniProt flags the original AAM94564.1 sequence as erroneous initiation with
      a truncated N-terminus. The 371-residue clone's cleavable-signal-peptide/soluble-product description
      therefore does not independently establish the membrane-anchor topology of the current 401-residue
