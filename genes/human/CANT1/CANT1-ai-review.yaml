- term:
    id: GO:1990003
    label: IDP phosphatase activity
  evidence_type: IDA
  original_reference_id: PMID:15248776
  qualifier: enables
  review:
    summary: IDP hydrolysis is part of the characterized human substrate spectrum.
    action: ACCEPT
    reason: The curated human UniProt reaction records IDP-to-IMP hydrolysis with PMID:15248776 as its
      experimental source. This is consistent with a diphosphate-preferring enzyme, although the cached
      abstract does not expose the substrate table. Retain the specific curator-supported chemistry without
      inventing an in vivo IDP concentration, flux or separate physiological pathway. The later human
      interface study independently assays IDP hydrolysis.
    supported_by:
    - reference_id: PMID:15248776
    - reference_id: PMID:18067325
- term:
    id: GO:1990003
    label: IDP phosphatase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000116
  qualifier: enables
  supporting_entities:
  - RHEA:35207
  review:
    summary: The IDP phosphatase mapping follows the experimentally curated reaction.
    action: ACCEPT
    reason: RHEA:35207 maps the human target reaction assigned to the mutagenesis study. It is chemically
      consistent with the characterized nucleoside-diphosphatase spectrum; the detailed kinetic table
      remains inaccessible and no stronger physiological IDP role is asserted. Direct IDP assays in the
      later human interface study corroborate this chemistry.
    supported_by:
    - reference_id: PMID:15248776
    - reference_id: PMID:18067325
