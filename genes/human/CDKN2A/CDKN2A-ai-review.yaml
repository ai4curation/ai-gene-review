core_functions:
- description: p16INK4a binds monomeric and cyclin D-bound CDK4 and CDK6 and inhibits their serine/threonine
    kinase activity. It binds beside the ATP pocket, distorts the catalytic cleft and blocks cyclin D
    activation, which prevents CDK4/6 from phosphorylating RB1 and arrests cells in G1. This activity
    carries the anti-proliferative and senescence-enforcing functions of p16INK4a, which depend on RB1.
    It is separate from the MDM2-p53 axis acted on by the alternative CDKN2A product p14ARF (Q8N726).
  molecular_function: *id001
  directly_involved_in:
  - id: GO:0045736
    label: negative regulation of cyclin-dependent protein serine/threonine kinase activity
  - *id002
  - *id003
  locations:
  - id: GO:0005634
    label: nucleus
  - id: GO:0005737
    label: cytoplasm
  supported_by:
  - reference_id: PMID:8259215
    supporting_text: demonstrate that p16 binds to CDK4 and inhibits the catalytic activity of the CDK4/cyclin
      D enzymes
  - reference_id: PMID:9751050
    supporting_text: The INK4 inhibitors also distort the kinase catalytic cleft and interfere with ATP
      binding, which explains how they can inhibit the preassembled Cdk4/6-cyclin D complexes as well.
  - reference_id: PMID:9751050
    supporting_text: Tumour-derived mutations in INK4a and Cdk4 map to interface contacts, solidifying
      the role of CDK binding and inhibition in the tumour suppressor activity of p16INK4a.
  - reference_id: PMID:7603984
    supporting_text: we show that overexpression of p16ink4 in certain cell types will lead to an arrest
      in the G1 phase of the cell cycle
  - reference_id: PMID:7603984
    supporting_text: p16ink4 can only suppress the growth of human cells that contain functional pRB
  - reference_id: PMID:10208428
    supporting_text: induced growth arrest, inhibited DNA synthesis, and prevented phosphorylation of
      the retinoblastoma protein (pRb) in cell lines expressing functional pRb
- description: By keeping CDK4/6 inhibited and RB1 hypophosphorylated, p16INK4a enforces the stable growth
    arrest of cellular senescence. This includes replicative (telomere-dependent) senescence and stress-
    or oncogene-induced (telomere-independent) senescence in human cells. p16INK4a expression rises in
    senescent cells and ageing tissues; the protein's contribution to senescence is the CDK4/6-RB1 arrest,
    not a separate senescence-specific activity.
  molecular_function: *id001
  directly_involved_in:
  - id: GO:0090398
    label: cellular senescence
  - id: GO:0090399
    label: replicative senescence
  - *id004
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:14720514
    supporting_text: These data provide the first direct evidence that p16(INK4a) is necessary for the
      initiation of both telomere-dependent and telomere-independent senescence in human cells.
  - reference_id: PMID:14720514
    supporting_text: Transfection of this siRNA into late-passage normal human diploid fibroblasts allowed
      at least temporary escape from entry into replicative senescence.
  - reference_id: PMID:9054499
    supporting_text: Inactivation of either p53 or p16 prevents ras-induced arrest in rodent cells
  - reference_id: PMID:16243918
    supporting_text: HUVECs transfected with p16-EGFP showed an increased proportion of senescent cells
  - reference_id: PMID:16243918
    supporting_text: suppression of Rb eliminated senescence initiated by either p16 or p21 overexpression
  - reference_id: PMID:22048312
    supporting_text: we made use of a biomarker for senescence, p16(Ink4a), to design a novel transgene,
      INK-ATTAC, for inducible elimination of p16(Ink4a)-positive senescent cells upon administration
      of a drug
suggested_questions:
- question: Should the ARF-derived annotations now on P42771 (spinophilin binding, PMID:11278317; the
    smooth-muscle and macrophage apoptosis ISS/IEA rows from the p19ARF knockout study, PMID:20381282)
    be moved to Q8N726 / mouse Q64364, and should the Ensembl Compara projection from mouse P51480 be
    corrected at its source?
  experts:
  - GO/UniProt curators handling multi-product loci
  - BHF-UCL curators
- question: Does p16INK4a protein localize to senescence-associated heterochromatin foci, or does it only
    promote SAHF formation upstream through RB1?
  experts:
  - chromatin and senescence biologists
- question: Are the non-CDK interactions reported for p16INK4a (PCNA, NF-kB p65, BRG1, ISOC2) physiologically
    relevant at endogenous expression levels, or are they overexpression artefacts?
  experts:
  - cell cycle biochemists
suggested_experiments:
- description: In human fibroblasts, replace endogenous p16INK4a with a CDK4/6-binding-deficient mutant
    (e.g. a melanoma interface variant) or with wild type, and test whether senescence entry and maintenance,
    NF-kB repression and SAHF formation all depend on CDK4/6 binding.
  hypothesis: All physiological p16INK4a functions, including the peripheral ones, can be traced to CDK4/6
    inhibition and RB1 hypophosphorylation.
  experiment_type: knock-in mutagenesis with senescence and transcriptional readouts
- description: Use endogenous tagging and super-resolution imaging in oncogene-induced senescent cells
    to test whether p16INK4a is present within SAHFs.
  hypothesis: p16INK4a promotes SAHF formation without being a structural component of SAHFs.
  experiment_type: endogenous tagging and imaging
