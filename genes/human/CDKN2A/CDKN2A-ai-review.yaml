id: P42771
gene_symbol: CDKN2A
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CDKN2A (INK4a/ARF locus, 9p21) encodes two unrelated tumour suppressor proteins from alternative
  first exons read in different frames. This entry (P42771) describes p16INK4a, a small ankyrin-repeat
  protein of the INK4 family that binds CDK4 and CDK6, alone or with D-type cyclins, and inhibits their
  kinase activity. p16INK4a binds next to the ATP site, distorts the catalytic cleft and prevents cyclin
  D activation. This blocks phosphorylation of the retinoblastoma protein (RB1), keeping E2F repressed
  and halting cells in G1. Growth suppression by p16INK4a requires functional RB1. p16INK4a is found in
  the nucleus and cytoplasm. It is induced by oncogenic stress and accumulates with age, and it enforces
  the stable growth arrest of replicative and oncogene-induced cellular senescence. Its expression is
  widely used as a marker of senescent cells in ageing tissues. Germline loss-of-function variants that
  disrupt CDK4/6 binding cause familial melanoma and melanoma-pancreatic cancer syndromes, and the locus
  is among the most frequently deleted in human cancer. The alternative product p14ARF (UniProt Q8N726),
  which has no sequence in common with p16INK4a, binds MDM2 and promotes its degradation, stabilizing
  p53; that function belongs to ARF, not p16INK4a.
