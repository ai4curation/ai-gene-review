- term:
    id: GO:0000122
    label: negative regulation of transcription by RNA polymerase II
  evidence_type: IDA
  original_reference_id: PMID:10353611
  qualifier: involved_in
  review:
    summary: p16INK4a binds NF-kB p65 and, when overexpressed, suppresses NF-kB-dependent transactivation
      (reporter assays).
    action: KEEP_AS_NON_CORE
    reason: Single overexpression study; transcriptional repression is an indirect consequence of p16
      sequestering/binding RelA rather than a DNA-binding repressor activity. Plausible but peripheral
      to p16's core CDK4/6-inhibitor role.
    supported_by:
    - reference_id: PMID:10353611
      supporting_text: The association of p16INK4 with NF-kappaBp65 is considerable in HeLa- or 293 cells
    - reference_id: PMID:10353611
      supporting_text: Overexpression of INK4 molecules suppresses the transactivational ability of NF-kappaB
        significantly.
- term:
    id: GO:0001953
    label: negative regulation of cell-matrix adhesion
  evidence_type: IMP
  original_reference_id: PMID:10205165
  qualifier: involved_in
  review:
    summary: p16INK4a overexpression (and INK4/CIP-derived peptides) blocks alphavbeta3 integrin-dependent
      spreading on vitronectin.
    action: KEEP_AS_NON_CORE
    reason: One overexpression/peptide study in a specific cell context; the effect is mediated through
      CDK6 and PKC-dependent integrin localization. Retained as a peripheral, non-core process.
    supported_by:
    - reference_id: PMID:10205165
      supporting_text: Expression of full-length p16(INK4a) blocks alphavbeta3 integrin-dependent cell
        spreading on vitronectin but not collagen IV.
