- term:
    id: GO:0001953
    label: negative regulation of cell-matrix adhesion
  evidence_type: IMP
  original_reference_id: PMID:10205165
  qualifier: involved_in
  review:
    summary: p16 inhibits integrin-dependent cell spreading in the reported matrix context.
    action: KEEP_AS_NON_CORE
    reason: 'The recovered full primary Results and Figure 10 test full-length p16 expression
      in human VUP15 melanoma cells: spreading and attachment on vitronectin are reduced at the
      12-hour endpoint, and CDK6 co-expression reverses the effect. Separate acute CKI-peptide
      experiments in hamster CS-1 and human HUVEC cells inhibit spreading while retaining initial
      attachment. Retain the existing negative cell-matrix adhesion regulation as non-core with
      these assay distinctions; p16 is not itself an integrin receptor or PKC enzyme.'
    supported_by:
