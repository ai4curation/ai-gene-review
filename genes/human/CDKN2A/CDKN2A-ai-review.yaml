  review:
    summary: p16 can repress NF-kappaB-dependent transcription in the tested human cells.
    action: KEEP_AS_NON_CORE
    reason: The full primary Figures 1–4 and associated text show p16–RELA association, a purified-protein
      overlay and reduced NF-kappaB luciferase reporter activity in HeLa/293 cells, including
      TNF stimulation. This is transcriptional regulation through a transcription factor, not
      direct DNA binding or an intrinsic polymerase activity. Retain this context-dependent activity
      outside the principal CDK4/6 inhibitory core.
