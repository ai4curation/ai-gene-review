        cell spreading on vitronectin but not collagen IV.
- term:
    id: GO:0003723
    label: RNA binding
  evidence_type: HDA
  original_reference_id: PMID:22681889
  qualifier: enables
  review:
    summary: A CDKN2A entry is present in the RNA-capture dataset, but the exact protein-product
      assignment remains unresolved.
    action: UNDECIDED
    reason: 'The authentic Baltz source reports CDKN2A as a class-III mRNA-capture candidate.
      The original table labels H1 as the label-swap experiment: L1/L2 crosslink the light channel,
      whereas H1 crosslinks the heavy channel. Normalizing raw H/L ratios to crosslinked/control
      therefore changes L1 -3.31 to +3.31 and retains H1 +1.39, giving the reported mean +2.35;
      L2 is missing. Thus two measured observations enrich, with only L1 exceeding the threefold
      cutoff. Class III is a screen-confidence category, not proof of a false interaction. The
      Methods identify IPI protein groups and then collapse isoforms; the inspected gene-level
      row does not provide CDKN2A-specific protein-group accessions or peptides that resolve P42771
      from the unrelated ARF product. No independent target-specific RNA-binding assay was established
      in the inspected material. Absence of a canonical RNA-binding domain does not disprove this
      broad activity. Retain source-specific uncertainty about product attribution and reproducibility
      rather than converting a real capture signal into a confident negative.'
    supported_by:
    - reference_id: PMID:22681889
    - reference_id: file:human/CDKN2A/CDKN2A-manual-evidence.md
    - reference_id: file:human/CDKN2A/CDKN2A-followup-evidence.json
