core_functions:
- description: p16INK4A binds and inhibits CDK4/6, limiting productive cyclin D-dependent kinase
    activity and RB phosphorylation. This restrains G1/S progression and cell population expansion
    and contributes to stable arrest in senescence contexts. The molecular activity is assigned
    to the p16 protein; p14ARF has a separate reading frame and mechanism.
  molecular_function:
    id: GO:0004861
    label: cyclin-dependent protein serine/threonine kinase inhibitor activity
  directly_involved_in:
  - id: GO:2000045
    label: regulation of G1/S transition of mitotic cell cycle
  - id: GO:0090398
    label: cellular senescence
