id: P42771
gene_symbol: CDKN2A
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CDKN2A encodes distinct tumor-suppressive proteins through alternative first exons
  and reading frames. The 156-residue p16INK4A protein (P42771) is an ankyrin-repeat inhibitor
  that binds CDK4 and CDK6, limits cyclin D-dependent kinase activity and restrains RB-dependent
  progression from G1 into S phase. Nuclear and cytoplasmic p16 pools contribute to control of
  proliferation and stable arrest in senescence contexts. The unrelated p14ARF protein (Q8N726-1)
  instead regulates the MDM2–p53 pathway. These proteins share a locus but do not share a primary
  sequence or interchangeable biochemical functions.
