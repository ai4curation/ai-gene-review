description: GRIA4 encodes GluA4, an AMPA receptor subunit that converts glutamate binding into postsynaptic
  cation currents. Human flip GluA4 channels show CACNG8-dependent resensitization. De novo variants cause
  neurodevelopmental disorder with variable seizures and gait abnormalities.
