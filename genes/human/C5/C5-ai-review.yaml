  label: Homo sapiens
description: >-
  Complement component C5 is a 1,676-residue secreted plasma glycoprotein of the
  alpha-2-macroglobulin/complement C3-C4-C5 family that circulates as a disulfide-linked
  two-chain precursor (beta chain residues 19-673 and alpha chain residues 678-1676)
  and serves as the central proteolytic bifurcation point of the terminal complement
  cascade. Cleavage of the alpha chain at Arg751-Leu752 by classical/lectin (C4b2a3b),
  alternative (C3bBb3b), or granzyme K-generated C5 convertases releases two functionally
  distinct effector products: the 74-residue C5a anaphylatoxin (residues 678-751)
  and the large C5b fragment (alpha' chain residues 752-1676 disulfide-linked to the
  beta chain). C5a is a four-helix bundle peptide ligand that directly binds and activates
  the seven-transmembrane G protein-coupled receptor C5aR1 (CD88) via a two-site mechanism
  (core H1-H3 bundle binding the receptor N-terminus and C-terminal Arg751 inserting
  into the transmembrane orthosteric pocket) to trigger Gi/o- and beta-arrestin-mediated
  signaling, leukocyte chemotaxis, degranulation, and acute inflammatory responses,
  while also engaging the non-G-protein-coupled seven-transmembrane receptor C5aR2
  (C5L2/GPR77) to modulate beta-arrestin recruitment and receptor scavenging; plasma
  carboxypeptidases rapidly cleave Arg751 to generate C5a des-Arg (residues 678-750)
  with reduced C5aR1 potency. Concurrently, nascent C5b undergoes a conformational
  rearrangement of its MG-ring, CUB, and TED domains that exposes a labile binding
  site for C6, initiating sequential non-enzymatic assembly with C6, C7, C8, and
  polymeric C9 to form the cytolytic membrane attack complex (MAC, C5b-9).
functional_isoforms:
- id: C5_C5A
  name: C5a anaphylatoxin
  type: CLEAVAGE_PRODUCT
  maps_to:
  - type: UNIPROT_CHAIN
    ids:
    - PRO_0000005988
    residues: 678-751
  description: >-
    74-residue N-terminal cleavage peptide of the C5 alpha chain (residues 678-751)
    released by C5 convertase cleavage at Arg751-Leu752. Folds as an antiparallel
    four-helix bundle stabilized by three disulfide bonds and acts as a high-affinity
    extracellular peptide agonist of the G protein-coupled receptor C5aR1 (CD88) and
    the beta-arrestin-biased seven-transmembrane receptor C5aR2 (C5L2), driving Gi
    activation, intracellular calcium mobilization, neutrophil and macrophage chemotaxis,
    and pro-inflammatory mediator release. Rapidly converted by plasma carboxypeptidases
    N and B2 to the 73-residue C5a des-Arg derivative (residues 678-750).
  isoform_specific_terms:
  - id: GO:0001664
    label: G protein-coupled receptor binding
  - id: GO:0038178
    label: complement component C5a signaling pathway
  - id: GO:0006935
    label: chemotaxis
  - id: GO:0060326
    label: cell chemotaxis
  - id: GO:0006954
    label: inflammatory response
- id: C5_C5B
  name: Complement C5b
  type: CLEAVAGE_PRODUCT
  maps_to:
  - type: UNIPROT_CHAIN
    ids:
    - PRO_0000005989
    - PRO_0000005985
    residues: 19-673,752-1676
  description: >-
    Two-chain terminal complement scaffold composed of the C5 beta chain (residues
    19-673, PRO_0000005985) disulfide-linked to the cleaved C5 alpha' chain (residues
    752-1676, PRO_0000005989). Release of C5a triggers movement of the TED and CUB
    domains relative to the MG-ring, exposing a metastable binding interface for C6
    to form the C5b6 complex and nucleate assembly of the C5b-9 membrane attack complex
    (MAC) on target membranes. Does not bind or activate C5aR1 or C5aR2.
  isoform_specific_terms:
  - id: GO:0005579
    label: membrane attack complex
existing_annotations:
- term:
    id: GO:0001664
    label: G protein-coupled receptor binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: enables
  supporting_entities:
  - ARBA:ARBA00027676
  review:
    summary: Core molecular function of the C5a anaphylatoxin fragment, which directly
      binds and activates the G protein-coupled receptors C5aR1 and C5aR2.
    action: ACCEPT
    reason: Cleavage of C5 at Arg751-Leu752 releases the 74-residue C5a anaphylatoxin
      (PRO_0000005988), which directly binds the orthosteric pocket and N-terminal
      sulfotyrosine domain of the G protein-coupled receptor C5aR1 (CD88) as well
      as the seven-transmembrane receptor C5aR2 (C5L2). High-resolution cryo-EM structures
      (PMID:36806352; PMID:37169960; PMID:37852260) and site-directed mutagenesis
      (PMID:8182049; PMID:9553099) define the direct two-site GPCR binding interface.
    supported_by:
    - reference_id: PMID:36806352
      supporting_text: The complement fragment C5a is one of its important effector
        components and exerts diverse physiological functions through activation of
        the C5a receptor 1 (C5aR1) and associated downstream G protein and β-arrestin
        signaling pathways.
    - reference_id: PMID:37169960
      supporting_text: The complement receptors C3aR and C5aR1, whose signaling is
        selectively activated by anaphylatoxins C3a and C5a, are important regulators
        of both innate and adaptive immune responses.
- term:
    id: GO:0004866
    label: endopeptidase inhibitor activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR001599
  - InterPro:IPR002890
  review:
    summary: Over-propagated InterPro2GO electronic annotation from alpha-2-macroglobulin
      superfamily domains; C5 lacks a protease-trapping bait region and thioester
      bond and is not an endopeptidase inhibitor.
    action: REMOVE
    reason: This IEA annotation derives from InterPro2GO mappings on the shared alpha-2-macroglobulin
      family domains (IPR001599, IPR002890). Unlike alpha-2-macroglobulin (A2M), which
      traps and inhibits endopeptidases via a bait region and an internal reactive
      thioester bond, complement C5 lacks an internal thioester bond and functions
      as a substrate cleaved by C5 convertases to generate C5a and C5b (PMID:19528535;
      PMID:22832194).
    supported_by:
    - reference_id: PMID:22832194
      supporting_text: C5 lacks the prototypical thioester present in this domain
        in other members of the C3/α2-macroglobulin protein family.
