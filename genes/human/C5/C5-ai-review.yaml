    Processed C5a anaphylatoxin fragment (residues 678-751, PRO_0000005988) directly
    binds and activates the seven-transmembrane receptors C5aR1 (CD88) and C5aR2 (C5L2)
    in the extracellular region to initiate the complement component C5a signaling
    pathway, driving leukocyte chemotaxis and acute inflammatory responses.
