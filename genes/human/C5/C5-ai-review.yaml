- id: PMID:106884
  title: 'Fifth component of human complement: purification from plasma and polypeptide
    chain structure.'
  findings: []
- id: PMID:10820279
  title: Differential ability of exogenous chemotactic agents to disrupt transendothelial
    migration of flowing neutrophils.
  findings:
  - statement: C5a acts as a potent non-chemokine chemoattractant for human neutrophils,
      distinct from CXC chemokines such as IL-8, ENA-78, and GRO-alpha.
    supporting_text: If neutrophils were treated with fMLP, IL-8, C5a, ENA-78, or
      GRO-alpha just before perfusion over this HUVEC, transmigration, but not adhesion,
      was abolished.
- id: PMID:14566334
  title: An animal model of age-related macular degeneration in senescent Ccl-2- or
    Ccr-2-deficient mice.
  findings:
  - statement: C5a induces CCL2 and VEGF production by retinal pigment epithelial
      and choroidal endothelial cells.
    supporting_text: RPE or choroidal endothelial production of Ccl-2 induced by complement
      C5a and IgG may mediate choroidal macrophage infiltration into aged wild-type
      choroids.
  - statement: Accumulation of C5a induces VEGF production by retinal pigment epithelial
      cells, promoting choroidal neovascularization.
    supporting_text: Impaired macrophage recruitment may allow accumulation of C5a
      and IgG, which induces vascular endothelial growth factor (VEGF) production
      by RPE, possibly mediating development of CNV.
- id: PMID:16452172
  title: Drusen complement components C3a and C5a promote choroidal neovascularization.
  findings:
  - statement: C5a induces VEGF expression in retinal pigment epithelial cells in
      vitro and in vivo, promoting choroidal neovascularization.
    supporting_text: Here we provide evidence that bioactive fragments of these complement
      components (C3a and C5a) are present in drusen of patients with AMD, and that
      C3a and C5a induce VEGF expression in vitro and in vivo.
- id: PMID:19056867
  title: Large-scale proteomics and phosphoproteomics of urinary exosomes.
  findings:
  - statement: LC-MS/MS proteomic profiling of human urinary exosomes identified 1,132
      proteins including C5.
    supporting_text: Here, we used LC-MS/MS to profile the proteome of human urinary
      exosomes. Overall, the analysis identified 1132 proteins unambiguously
- id: PMID:19528535
  title: Factor H-related protein 1 (CFHR-1) inhibits complement C5 convertase activity
    and terminal complex formation.
  findings:
  - statement: CFHR1 binds to C5 and C5b6 and inhibits C5 convertase activity and
      terminal MAC assembly.
    supporting_text: Here we identify CFHR1 as a novel inhibitor of the complement
      pathway that blocks C5 convertase activity and interferes with C5b surface deposition
      and MAC formation.
- id: PMID:21217642
  title: Substrate recognition by complement convertases revealed in the C5-cobra
    venom factor complex.
  findings:
  - statement: Crystal structure of human C5 in complex with the C3b homologue cobra
      venom factor (CVF) reveals how C5 is recognized by complement convertases.
    supporting_text: We determined the crystal structures of the C3b homologue cobra
      venom factor (CVF) in complex with C5, and in complex with C5 and the inhibitor
      SSL7 at 4.3 Å resolution.
- id: PMID:22832194
  title: Assembly and regulation of the membrane attack complex based on structures
    of C5b6 and sC5b9.
  findings:
  - statement: Cleavage of C5 into C5a and C5b exposes a labile C6-binding site on
      C5b that nucleates assembly of the membrane attack complex, and C5 lacks the
      internal thioester present in other C3/alpha2-macroglobulin family members.
    supporting_text: >-
      Upon complement activation, C5 is cleaved into C5a and C5b by the C5 convertase.
      C6 then captures a labile binding site in C5b (half-life: 2 min)
  - statement: C5 lacks the internal reactive thioester present in the TED domain
      of C3 and alpha-2-macroglobulin family proteins.
    supporting_text: C5 lacks the prototypical thioester present in this domain in
      other members of the C3/α2-macroglobulin protein family.
- id: PMID:23533145
  title: In-depth proteomic analyses of exosomes isolated from expressed prostatic
    secretions in urine.
  findings:
  - statement: Shotgun proteomics of EPS-urine exosomes detected complement activation
      proteins including C5.
    supporting_text: >-
      Global GO enrichment analyses of these 127 proteins revealed
      that the most significant functional categories were related to inflammation:
      immune response (27 proteins), response to wounding (21 proteins), defense response
      (19 proteins), inflammatory response (14 proteins) and complement activation
      (7 proteins) (Figure 1B).
- id: PMID:25416956
  title: A proteome-scale map of the human interactome network.
  findings: []
- id: PMID:30552328
  title: CryoEM reveals how the complement membrane attack complex ruptures lipid
    bilayers.
  findings:
  - statement: Cryo-EM structures of the open and closed human membrane attack complex
      reveal how C5b6 acts as a platform to direct assembly of the C5b-9 pore.
    supporting_text: CryoEM reconstructions reveal plasticity of the MAC pore and
      demonstrate how C5b6 acts as a platform, directing assembly of a giant β-barrel
      whose structure is supported by a glycan scaffold.
- id: PMID:32296183
  title: A reference map of the human binary protein interactome.
  findings: []
- id: PMID:36806352
  title: Mechanism of activation and biased signaling in complement receptor C5aR1.
  findings:
  - statement: Cryo-EM structures of C5aR1 in complex with C5a illustrate how the
      C5a anaphylatoxin activates C5aR1 and downstream G protein and beta-arrestin
      signaling pathways.
    supporting_text: The complement fragment C5a is one of its important effector
      components and exerts diverse physiological functions through activation of
      the C5a receptor 1 (C5aR1) and associated downstream G protein and β-arrestin
      signaling pathways.
- id: PMID:37169960
  title: Revealing the signaling of complement receptors C3aR and C5aR1 by anaphylatoxins.
  findings:
  - statement: Cryo-EM structures of Gi-coupled C5aR1 bound to C5a define selective
      activation of C5aR1 signaling by the C5a anaphylatoxin.
    supporting_text: The complement receptors C3aR and C5aR1, whose signaling is selectively
      activated by anaphylatoxins C3a and C5a, are important regulators of both innate
      and adaptive immune responses.
- id: PMID:37852260
  title: Molecular basis of anaphylatoxin binding, activation, and signaling bias
    at complement receptors.
  findings:
  - statement: Structural and functional analysis defines how the terminal complement
      anaphylatoxin C5a binds and activates the GPCR C5aR1.
    supporting_text: The complement system is a critical part of our innate immune
      response, and the terminal products of this cascade, anaphylatoxins C3a and
      C5a, exert their physiological and pathophysiological responses primarily via
      two GPCRs, C3aR and C5aR1.
- id: PMID:39914456
  title: Granzyme K activates the entire complement cascade.
  findings:
  - statement: Granzyme K cleaves C4 and C2 to form C3 and C5 convertases that cleave
      C5 into C5a and C5b, generating the C5a anaphylatoxin and the membrane attack
      complex.
    supporting_text: >-
      The nascent C4b and C2b fragments form a C3 convertase that cleaves C3, enabling
      the assembly of a C5 convertase that cleaves C5. The resulting convertases generate
      all the effector molecules of the complement cascade: the anaphylatoxins C3a
      and C5a, the opsonins C4b and C3b, and the membrane attack complex.
- id: PMID:690134
  title: Primary structural analysis of the polypeptide portion of human C5a anaphylatoxin.
    Polypeptide sequence determination and assignment of the oligosaccharide attachment
    site in C5a.
  findings:
  - statement: Establishes the complete 74-residue amino acid sequence and carbohydrate
      attachment of human C5a anaphylatoxin cleaved from serum C5.
    supporting_text: The C5a molecule is one of two spasmogenic fragments (i.e. C3a
      and C5a) released from serum components C3 and C5 during complement activation.
- id: PMID:8182049
  title: The amino terminus of the human C5a receptor is required for high affinity
    C5a binding and for receptor activation by C5a but not C5a analogs.
  findings:
  - statement: Establishes the two-site binding model in which the C5a core binds
      the C5aR1 N-terminal domain and the C5a C-terminal 8 residues engage the receptor
      transmembrane domain to trigger activation.
    supporting_text: The binding domain of the human C5a receptor consists of two
      distinct and physically separable subsites. One of these sites binds the C-terminal
      8 amino acids of C5a and is as yet undefined, while the second site lies in
      the N terminus of the receptor and interacts with the core of C5a.
- id: PMID:8759757
  title: C3a and C5a are chemotaxins for human mast cells and act through distinct
    receptors via a pertussis toxin-sensitive signal transduction pathway.
  findings:
  - statement: C5a acts as a potent chemotaxin for human mast cells via a pertussis
      toxin-sensitive Gi-coupled receptor signaling pathway.
    supporting_text: Here we report that C3a and C5a are, in fact, potent chemotaxins
      for the human mast cell line HMC-1.
- id: PMID:8898085
  title: In Xenopus oocytes the human C3a and C5a receptors elicit a promiscuous response
    to the anaphylatoxins.
  findings:
  - statement: Human C5aR1 expressed in Xenopus oocytes responds robustly to its cognate
      ligand C5a via a G protein-coupled signaling cascade.
    supporting_text: Oocytes expressing the anaphylatoxin C3a and C5a receptors responded
      to both agonists, in each case the response to the cognate ligand was substantially
      more robust than the response elicited by the other anaphylatoxin.
- id: PMID:9218605
  title: TNF-alpha-mediated expression of the receptor for anaphylatoxin C5a on neurons
    in experimental Listeria meningoencephalitis.
  findings:
  - statement: Detects the secreted C5a anaphylatoxin ligand in the cerebrospinal
      fluid of human patients with infectious meningitis.
    supporting_text: The finding of TNF-alpha-mediated C5aR expression on neurons
      in experimental Listeria meningitis and the detection of the ligand, C5a, in
      the cerebrospinal fluid of human patients with infectious meningitis present
      new directions in the investigation of the pathophysiologic sequelae leading
      to secondary brain damage.
- id: PMID:9590258
  title: 'Expression of receptors for C5a anaphylatoxin (CD88) on human bronchial
    epithelial cells: enhancement of C5a-mediated release of IL-8 upon exposure to
    cigarette smoke.'
  findings:
  - statement: Human bronchial epithelial cells express the C5a receptor (CD88/C5aR1)
      and respond to C5a stimulation by releasing IL-8.
    supporting_text: Control (untreated) HBECs responded to C5a (50 nM) by releasing
      the proinflammatory cytokine IL-8 at low but significant levels.
