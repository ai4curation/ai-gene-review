suggested_questions:
- question: >-
    How do the distinct intracellular conformations of C5aR2 (C5L2) bound to intact
    C5a versus C5a des-Arg selectively recruit beta-arrestin isoforms without engaging
    heterotrimeric Gi proteins, and how does C5aR1-C5aR2 heteromerization tune downstream
    pro- versus anti-inflammatory signaling in human myeloid cells?
- question: >-
    What is the quantitative contribution of convertase-independent C5 cleavage by
    lymphocyte granzyme K (GZMK) and coagulation/neutrophil proteases (thrombin, elastase)
    relative to canonical C4b2a3b/C3bBb3b convertases in chronic human tissue inflammation?
suggested_experiments:
- description: >-
    Determine high-resolution cryo-EM structures of human C5aR2 (C5L2) in complex
    with intact C5a, C5a des-Arg, and beta-arrestin-1/2 to compare the orthosteric
    pocket and intracellular core architecture with Gi- and beta-arrestin-bound C5aR1
    (PMID:36806352; PMID:37169960; PMID:37852260).
  hypothesis: >-
    Divergent residues in the DRY-like motif and intracellular loop 3 of C5aR2 occlude
     the Galpha_i C-terminal helix binding cleft while stabilizing a phosphorylated
    C-terminal tail conformation that supports high-affinity C5a and C5a des-Arg scavenging
    and beta-arrestin coupling.
- description: >-
    Perform quantitative mass-spectrometry cleavage-site profiling of C5 fragments
    in synovial fluid and bronchoalveolar lavage from patients with rheumatoid arthritis
    and severe asthma, paired with selective inhibition of GZMK versus canonical C3/C5
    convertases.
  hypothesis: >-
    Convertase-assembled C5 cleavage at Arg751-Leu752 (initiated either via canonical
    C1s/MASP/CFB or via GZMK-cleaved C4b2a3b) accounts for the majority of bioactive
    intact C5a(678-751), whereas non-convertase proteases generate distinct N- or
    C-terminally truncated C5 fragments with altered C5aR1/C5aR2 agonist potency.
