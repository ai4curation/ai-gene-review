  review:
    summary: Specify EVC2’s positive regulatory contribution to Smoothened signaling.
    action: MODIFY
    reason: Human Q86UK5 genuinely matches IPR022076 (Limbin; residues 244–749) and IPR026501 (Limbin/EvC
      complex member EVC; residues 60–1304), both mapped to GO:0007224. The combined mouse and Ensembl
      sources also resolve correctly. In PMID:21356043, Evc2 depletion in mouse LIGHT2/MC3T3 cells and
      Evc2-null MEFs reduces purmorphamine-induced Gli reporter or Ptch1 responses. In PMID:24582806,
      Evc2-null NIH/3T3 cells have impaired SAG-induced Gli1/Ptch1 activation and GLI3-repressor regulation,
      within the experimentally characterized ciliary EVC–EVC2 signaling assembly. This supports positive
      regulation of Smoothened signaling rather than receptor or enzymatic activity. The refinement is
      a signed regulatory role, not a claim that GO:0045880 is an is_a descendant of the regulated pathway.
      It is a conserved gene-level inference from mouse experiments, not an assay of all human products.
