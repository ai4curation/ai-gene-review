- id: PMID:24582806
  title: EFCAB7 and IQCE regulate hedgehog signaling by tethering the EVC-EVC2 complex to the base of
    primary cilia.
  findings: []
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Identifier/title/DOI verified against actual BioC original and Europe PMC. Read main
      Results/Discussion/Methods blocks 8–64 and main figure-caption blocks 96–109. Methods explicitly
      says all EvC constructs are mouse, including those expressed in human HEK293T. Evc2-null signaling,
      native mouse assembly, ciliary localization and W-peptide/EFCAB7 interaction are EVC2-relevant.
      EFCAB7, not EVC2, is the mapped adaptor to IQCE; scaffold action of the EVC–EVC2 assembly is discussed
      as a model. Engineered EVC2ΔW and FVFR substitutions are not natural human splice products. Purified
      GST-EVC2 tail was paired with wheat-germ translated EFCAB7, not two independently homogeneous proteins.
