    summary: Refine the broad plasma-membrane mapping to the supported ciliary membrane.
    action: MODIFY
    reason: 'The SL-0039 plasma-membrane mapping is correct but broad. PMID:21356043 uses mouse Evc/Evc2
      constructs and native mouse cells: the ciliary-localization and selective-permeabilization experiments
      place the Evc2 N terminus outside the cell and its C terminus inside, consistent with a ciliary
      membrane protein. The human HEK293 host used for interaction assays does not make those constructs
      human. PMID:24582806 independently localizes mouse EVC2 at the proximal ciliary membrane EvC zone.
      The current human Reactome event R-HSA-5633051 contains native Q86UK5 participant 5633038, modeled
      residues 27–1308, with its own ciliary-membrane compartment; this model does not experimentally
      establish processing or equivalence of the shorter human products. GO:0060170 specifies the portion
      of plasma membrane surrounding a cilium and is already present in the accepted source contexts at
      indices 9–11.'
