      natural human 1,228- or 1,246-residue products. These results support membrane-complex membership
      without assigning EFCAB7’s molecular function to EVC2 or imposing a fixed four-subunit stoichiometry
      in every condition. GO:0098797 covers a protein complex in plasma membrane, including the ciliary
      membrane assembly; no unverified EVC2-specific complex term is invented.
