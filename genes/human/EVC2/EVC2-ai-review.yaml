    reason: The actual PTHR16795 tree places human Q86UK5 leaf PTN002497664 below PTN000423571; its ungapped
      MSA exactly matches the current 1,308-residue human sequence. The source node has the relevant positive
      IBD and no target-path NOT record. Both source mouse products map through their official MGI identities
