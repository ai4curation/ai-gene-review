id: Q86UK5
gene_symbol: EVC2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: EVC2 (limbin) is a single-pass membrane protein that associates with EVC in a specialized
  region of proximal ciliary membrane. This assembly promotes Hedgehog signaling downstream of Smoothened
  and regulates GLI activator and repressor responses. The EVC2 C-terminal region engages EFCAB7, linking
  the EVC–EVC2 assembly to the EFCAB7–IQCE module that restricts its position within the cilium. Pathogenic
  EVC2 variants cause Ellis–van Creveld syndrome and Weyers acrofacial dysostosis.
