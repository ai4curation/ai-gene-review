  review:
    summary: EVC2 was detected in a human sperm nuclear proteomics preparation.
    action: KEEP_AS_NON_CORE
    reason: 'The source-specific positive identification is recoverable in coauthor Judit Castillo Corullón''s
      2014 thesis: Results 4.2.1 (printed page 130) explicitly links its 403-protein list to the Supporting
      Information of PMID:21630459, and Annex 8.2, Supplementary Table 8.1 (page 199) reports EVC2/Limbin,
      UniProt Q86UK5, with 3.7% protein coverage and three peptides. The thesis describes CTAB-isolated
      nuclei from human normozoospermic samples. This supports retaining the reported nuclear association
      as a specialized non-core localization. The journal''s complete text remains unavailable; the accessible
      author-restated protocol and reproduced target table are distinguished from it. Individual peptide
      sequences, peptide uniqueness for this target, EVC2-specific imaging and discrimination among the
      three natural UniProt products were not established in the material read. No nuclear mechanism or
      universal localization is inferred.'
    supported_by:
    - reference_id: PMID:21630459
