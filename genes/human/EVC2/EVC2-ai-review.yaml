core_functions:
- description: Promotes Smoothened-dependent Hedgehog signaling as an EVC-associated component of the
    proximal ciliary membrane complex. Its C-terminal W-peptide engages the EFCAB7-containing positioning
    module, while Evc2-dependent signaling supports GLI target-gene activation and regulation of the GLI3
    repressor. The molecular step linking this assembly to downstream signal transmission remains unresolved.
  directly_involved_in:
  - id: GO:0007224
    label: smoothened signaling pathway
  - id: GO:0045880
    label: positive regulation of smoothened signaling pathway
  locations:
  - id: GO:0060170
    label: ciliary membrane
  in_complex:
    id: GO:0098797
    label: plasma membrane protein complex
  supported_by:
  - reference_id: PMID:21356043
  - reference_id: PMID:24582806
  - reference_id: Reactome:R-HSA-5633051
  knowledge_gaps:
  - gap_statement: The EVC2-specific molecular activity that couples the ciliary assembly to downstream
      GLI regulation is unresolved despite experimentally mapped interactions and targeting determinants.
    boundary: Mouse Evc2 perturbation and Smoothened-agonist assays establish positive signaling participation.
      Mouse protein-interaction and localization experiments map the EVC2 W-peptide connection to EFCAB7,
      while EFCAB7 supplies the demonstrated adaptor connection to IQCE. A signal-organizing scaffold
      mechanism for the EVC–EVC2 assembly is proposed, rather than a distinct EVC2 molecular activity
      directly established by those experiments. These assays do not demonstrate equivalent function of
      the three natural human products.
    gap_kind:
    - BIOLOGY
    dark_aspect: MF_DARK
    status: OPEN
    significance: Resolving the EVC2-specific step would distinguish signal transmission from complex
      incorporation and positioning without assigning another subunit's molecular activity to EVC2.
    resolution: Separate EVC2-dependent signaling from complex abundance, EFCAB7 engagement and ciliary
      localization with controlled human-cell rescue, followed by a direct assay of the proposed molecular
      step.
    provenance:
    - reference_id: PMID:21356043
    - reference_id: PMID:24582806
suggested_questions:
- question: Which EVC2-specific molecular step links the positioned EVC–EVC2 assembly to GLI regulation,
    beyond maintaining its association with EVC and EFCAB7?
- question: Which of the three source-described human products are endogenously expressed, processed and
    incorporated into a signaling-competent ciliary complex?
- question: Where within the nuclear preparation is human EVC2 located, and does that pool contain the
    full-length protein or a distinct processed product?
- question: Should the EVC–EVC2 and EFCAB7–IQCE assemblies have a more specific complex representation
    than GO:0098797, distinguishing the two stable subcomplexes from their experimentally associated EvC
    assembly? The current annotation remains supported without assuming invariant four-subunit stoichiometry.
suggested_experiments:
- hypothesis: EVC2-dependent signaling can be experimentally separated from its complex incorporation
    and restriction to the proximal ciliary membrane.
  description: In ciliated human cells, compare endogenous EVC2 loss with matched-expression rescue and
    interaction-guided separation-of-function variants. Quantify EVC and EFCAB7 association, ciliary abundance
    and proximal-zone restriction together with Smoothened-agonist responses, GLI1/PTCH1 transcription
    and GLI processing or localization. Include a downstream GLI bypass control. Test any proposed scaffold,
    adaptor or catalytic step directly before assigning that molecular activity to EVC2.
  experiment_type: Controlled genetic rescue with interaction, localization and signaling assays
- hypothesis: The natural N-terminal deletion and C-terminal replacement alter processing, complex engagement
    or signaling differently from the engineered mouse Weyers truncation.
  description: Establish endogenous product-specific transcripts and peptides for Q86UK5-1, Q86UK5-2 and
    Q86UK5-3 before comparing their signal-peptide processing, membrane topology, EVC/EFCAB7 association
    and ciliary signaling at matched abundance. Keep the natural 1,308-, 1,228- and 1,246-residue sequences
    distinct from engineered mouse EVC2ΔW and motif mutants; an overexpression phenotype alone does not
    establish a physiological isoform role.
  experiment_type: Product-resolved transcriptomics and proteomics with controlled functional rescue
- hypothesis: The reported nuclear EVC2 signal represents a reproducible compartment-associated pool whose
    molecular form can be resolved independently of bulk nuclear isolation.
  description: Combine endogenous tagging and loss-of-function controls with rigorously separated nuclear-envelope,
    nucleoplasmic and cytoplasmic fractions in appropriate human cells. Use orthogonal compartment markers,
    microscopy and product-discriminating peptides to identify EVC2 and distinguish intact protein from
    processing products. For sperm preparations, verify target peptide uniqueness and the correspondence
    of the detected form to the reported nuclear association before testing a nuclear mechanism.
  experiment_type: Orthogonal localization and molecular-form analysis with genetic specificity controls
