description: RXFP1 encodes relaxin family peptide receptor 1, a plasma-membrane leucine-rich-repeat GPCR activated by relaxin peptides. It signals through G proteins and adenylate cyclase to increase cAMP, and its C-terminal tail assembles AKAP79- and beta-arrestin-containing signaling complexes that tune relaxin responses.
