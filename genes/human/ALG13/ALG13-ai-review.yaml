core_functions:
- description: ALG13 isoform 2 supplies the catalytic subunit of the membrane-associated ALG13–ALG14 enzyme,
    transferring GlcNAc from UDP-GlcNAc to GlcNAc-PP-dolichol to form the beta-1,4-linked chitobiose precursor
    during protein N-glycosylation. ALG14-dependent complex formation enables this activity on the cytoplasmic
    face of the ER.
