id: Q9NP73
gene_symbol: ALG13
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ALG13 encodes alternatively spliced proteins, including the short isoform 2 that supplies
  the catalytic subunit of the ALG13–ALG14 UDP-N-acetylglucosamine transferase. At the cytoplasmic face
  of the endoplasmic reticulum, this complex transfers the second, beta-1,4-linked N-acetylglucosamine
  from UDP-GlcNAc onto GlcNAc-PP-dolichol, forming GlcNAc2-PP-dolichol during assembly of the lipid-linked
  glycan precursor for protein N-linked glycosylation. ALG14 anchors the soluble catalytic subunit at
  the membrane, and the active enzyme requires their association. Human isoform 2 is 165 amino acids long;
  the 1137-amino-acid isoform 1 did not bind ALG14 or display this transferase activity in comparative
  cellular and biochemical assays. The long protein contains an OTU domain, but its physiological molecular
  function remains unresolved. Pathogenic ALG13 variants cause developmental and epileptic encephalopathy;
  several variants reduce transferase activity even when routine transferrin glycosylation measurements
  are near normal.
