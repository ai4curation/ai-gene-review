suggested_questions:
- question: Does GO:0043541 intentionally include the human ALG13–ALG14 dimer as used in ALG14 IDA curation,
    despite its multienzyme definition and phosphorus-transferase-complex ancestry, or should the DPAGT1-containing
    assembly and the dimer be distinguished?
- question: What physiological molecular activity is performed by human ALG13 isoform 1, and how do isoforms
    3 and 4 contribute to ALG13 biology?
- question: Which cell-specific glycosylation substrates or additional molecular activities connect ALG13
    variants to neuronal dysfunction when routine transferrin glycosylation is near normal?
suggested_experiments:
- description: Use isoform-specific endogenous tagging, quantitative complex purification and targeted
    glycosyltransferase assays in human cells to resolve ALG13 isoform composition, ALG14 recruitment
    and possible DPAGT1 association.
- description: Compare isogenic human neural cells bearing disease variants with isoform-specific rescue,
    measuring lipid-linked glycans and glycoprotein occupancy alongside neuronal phenotypes to distinguish
    catalytic defects from other isoform functions.
