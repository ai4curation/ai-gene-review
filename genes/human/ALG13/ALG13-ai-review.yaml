  - gap_statement: Whether the assayed human ALG13–ALG14 dimer participates in a native DPAGT1-containing
      multienzyme assembly is unresolved by these experiments.
    boundary: Human ALG13 isoform 2 forms an active complex with ALG14 in purified recombinant preparations
      and in HEK293 co-immunoprecipitation assays.
    provenance:
    - reference_id: PMID:36200043
      supporting_text: This experiment demonstrated that FLAG-tagged ALG14 completely failed to coprecipitate
        with HA-ALG13-iso1, although it efficiently interacted with HA-tagged ALG13-iso2 (Figure 4C).
  - gap_statement: The physiological molecular functions of long isoform 1 and isoforms 3 and 4 remain
      unresolved.
    boundary: Comparative human assays establish ALG13–ALG14 glycosyltransferase activity for isoform
      2 and no such activity for tested isoform 1; the OTU preparation also lacked activity in the diubiquitin
      assay.
    gap_kind:
