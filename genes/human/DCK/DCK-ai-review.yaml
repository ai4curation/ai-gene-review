id: P27707
gene_symbol: DCK
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: DCK encodes deoxycytidine kinase, a soluble DCK/DGK-family deoxyribonucleoside kinase
  that salvages deoxycytidine, deoxyadenosine and deoxyguanosine to the corresponding dNMPs in the
  cytosolic/nuclear nucleotide pool. The homodimeric enzyme has a broad natural and
  nucleoside-analog substrate spectrum and provides the first phosphorylation step for several
  anticancer and antiviral prodrugs. Its DCK/TK2/DGUOK paralogs share the deoxyribonucleoside-kinase
  fold but partition cytosolic DCK activity from mitochondrial TK2 and DGUOK salvage activities,
  while the related NDUFA10 branch has lost kinase activity and is a respiratory-complex-I accessory
  subunit.
