knowledge_gaps:
- gap_statement: The quantitative partitioning of DCK flux between cytosolic and nuclear pools in
    primary human cells remains unresolved.
  boundary: DCK localization is supported in the nucleus by GFP/NLS experiments and in the cytosol
    by Reactome pathway curation, but available GOA rows do not quantify how much endogenous enzyme
    activity occurs in either pool.
  gap_kind:
  - BIOLOGY
  dark_aspect: CC_DARK
  status: OPEN
  significance: Knowing the compartment where DCK phosphorylates natural substrates and prodrugs
    would clarify whether local nuclear dNMP synthesis is a core repair/replication role or a
    subsidiary pool.
  resolution: Measure endogenous DCK activity and substrate rescue with nuclear-excluded and
    nuclear-enforced DCK variants under deoxyribonucleoside salvage conditions.
  provenance:
  - reference_id: PMID:9342341
    supporting_text: Reconstitution of a deoxycytidine kinase-deficient cell line with the wild-type
      nuclear or the mutant cytosolic enzymes both restored sensitivity toward anticancer nucleoside
      analogs
suggested_questions:
- question: How much of endogenous human DCK deoxyribonucleoside salvage occurs in the cytosol
    versus the nucleus in proliferating and quiescent primary cells?
suggested_experiments:
- description: Create DCK-null human cells rescued with wild-type, NLS-disrupted and
    enforced-nuclear DCK, then compare deoxycytidine, deoxyadenosine and deoxyguanosine salvage,
    dNTP-pool balance and nucleoside-analog activation in cytosolic and nuclear fractions.
