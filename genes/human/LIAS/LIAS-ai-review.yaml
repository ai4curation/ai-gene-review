- description: 'Binding of two [4Fe-4S] clusters: the radical SAM cluster that cleaves SAM, and the auxiliary
    cluster that is the sacrificial sulfur donor. The auxiliary cluster is rebuilt after each turnover
    by NFU1 and related iron-sulfur carriers.'
  molecular_function: *id016
