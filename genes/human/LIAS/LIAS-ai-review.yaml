- term:
    id: GO:1904047
    label: S-adenosyl-L-methionine binding
  evidence_type: IC
  original_reference_id: PMID:36281303
  qualifier: enables
  review:
    summary: LIAS binds SAM as the radical-generating cosubstrate at the unique iron of its radical
      SAM [4Fe-4S] cluster. Human LIAS turns over an octanoyl peptide only when SAM is present.
    action: NEW
    reason: >-
      GOA has no SAM-binding row for LIAS, although the RADICAL_SAM project treats GO:1904047 as a core
      cosubstrate-binding function of every active radical SAM enzyme. This is a molecular function, not
      a process, so the participation test is met directly: LIAS itself binds and cleaves SAM. The HAMAP
      family rule records SAM as an exchangeable ligand of the radical SAM cluster, and the human enzyme
      carries out the SAM-dependent reaction in vitro (PMID:36281303). Comparator check, against GOA rather
      than against this project's own proposals: GOA does annotate GO:1904047 to radical SAM enzymes in
      exactly this role, by UniRule -- ECOLI/queE (UR000100349), ECOLI/moaA and PSEPK/moaA (UR000101305),
      METEA/pqqE and PSEPK/pqqE (UR000098303). So the absence here is patchy UniRule coverage, which rules
      happen to carry the term, not a GO convention against annotating a radical SAM enzyme's own cosubstrate.
      That is also why those five genes have an existing row to ACCEPT or MODIFY while this one needs
      a NEW row.
    supported_by:
    - *id013
    - *id014
