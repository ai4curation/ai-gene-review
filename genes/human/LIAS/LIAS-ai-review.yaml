id: O43766
gene_symbol: LIAS
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'LIAS encodes mitochondrial lipoyl synthase (EC 2.8.1.8), a radical S-adenosyl-L-methionine
  (SAM) enzyme that completes de novo synthesis of the lipoyl cofactor. Lipoate is built on its carrier
  protein: an octanoyl chain from mitochondrial fatty acid synthesis is first attached to a conserved
  lysine of a lipoyl domain (by LIPT2, mainly onto the glycine cleavage system H protein GCSH), and LIAS
  then inserts sulfur atoms at C6 and C8 of that octanoyl group to form the dihydrolipoyl group. LIPT1
  is thought to pass the lipoyl group on to the E2 subunits of the pyruvate, 2-oxoglutarate and branched-chain
  2-oxoacid dehydrogenase complexes. LIAS binds two [4Fe-4S] clusters. The radical SAM cluster reductively
  cleaves SAM to a 5''-deoxyadenosyl radical that abstracts hydrogen atoms from C6 and C8. An auxiliary
  cluster supplies the sulfur atoms and is destroyed in each reaction, so sustained activity depends on
  the mitochondrial iron-sulfur delivery machinery (NFU1, ISCA1/ISCA2, with BOLA3 implicated genetically)
  to rebuild it, and on ferredoxin FDX1, which binds LIAS and supplies electrons. The enzyme is imported
  into the mitochondrial matrix by an N-terminal transit peptide. Lipoylation is essential for pyruvate
  dehydrogenase, 2-oxoglutarate dehydrogenase, branched-chain ketoacid dehydrogenase and the glycine cleavage
  system. Biallelic LIAS variants cause hyperglycinemia, lactic acidosis and seizures (HGCLAS), a neonatal-onset
  encephalopathy with combined pyruvate oxidation and glycine cleavage defects. Loss of Lias in mice is
  embryonic lethal.'
