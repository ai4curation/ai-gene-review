core_functions:
- description: 'Lipoyl synthase: radical SAM-dependent insertion of two sulfur atoms at C6 and C8 of the
    octanoyl group on the lipoyl domain of mitochondrial lipoyl carrier proteins (chiefly octanoyl-GCSH),
    producing the protein-bound dihydrolipoyl cofactor needed by PDH, OGDH, BCKDH and the glycine cleavage
    system.'
