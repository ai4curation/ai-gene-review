suggested_questions:
- question: In human mitochondria, does LIAS act only on octanoyl-GCSH, with LIPT1 then relaying the
    lipoyl group to the E2 subunits of PDH, OGDH and BCKDH, or can LIAS also lipoylate octanoylated
    E2 lipoyl domains directly at a physiologically significant rate?
- question: Which iron-sulfur carrier (NFU1 alone, the NFU1-ISCA1 heterodimer, or ISCA2/ISCU)
    rebuilds the auxiliary cluster of LIAS in vivo, and at which step is BOLA3 required, given that
    it has no direct effect on cluster transfer in vitro?
suggested_experiments:
- hypothesis: LIAS lipoylates only GCSH in human cells, and E2 lipoylation depends on LIPT1-mediated
    transfer.
  description: In LIPT1-knockout human cells expressing an E2 lipoyl domain that is octanoylated in
    vivo (e.g. by a mitochondrially targeted bacterial LipB), measure whether LIAS converts
    octanoyl-E2 to lipoyl-E2 by targeted mass spectrometry, and compare with GCSH-knockout cells.
- hypothesis: NFU1 is the obligate in vivo donor for the auxiliary cluster of LIAS.
  description: Pulse-chase 57Fe or 34S labelling in NFU1-, ISCA1-, ISCA2- and BOLA3-depleted cells,
    followed by LIAS immunoprecipitation, Mossbauer or mass-spectrometric cluster analysis, and
    per-turnover lipoyl product isotope tracking.
