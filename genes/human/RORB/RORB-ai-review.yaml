suggested_questions:
- question: Does RORB transcriptional activity, rather than its expression as a lineage marker, contribute
    to the selective vulnerability of RORB+ entorhinal excitatory neurons to tau pathology in Alzheimer
    disease?
  experts:
  - neurodegeneration and selective vulnerability researchers
  - nuclear receptor biologists
- question: Should the melatonin receptor activity assertion at PANTHER node PTN008698560 be retracted
    for the ROR clade, given that RORB/RZR melatonin binding has not been upheld?
  experts:
  - PAINT/PANTHER curators
- question: Is the lengthened circadian period of Rorb knockout mice a direct clock function of RORB or
    a secondary consequence of retinal/SCN developmental defects?
  experts:
  - circadian biologists
suggested_experiments:
- description: In human iPSC-derived entorhinal-like excitatory neurons or a tauopathy mouse model, knock
    down or overexpress RORB (and express a DNA-binding-dead mutant), then measure tau accumulation, neuronal
    survival and the RORB-dependent transcriptome.
  hypothesis: RORB-driven gene expression programs, not merely RORB expression as a marker, modulate susceptibility
    of excitatory neurons to tau pathology.
  experiment_type: genetic perturbation in neuronal models
- description: Map genome-wide RORB occupancy (CUT&RUN/ChIP-seq) in human cortical layer IV-like neurons
    and retina organoids, with and without retinoid inverse agonists.
  hypothesis: Direct RORB target genes in neurons can be defined and are repressed by retinoid ligands.
  experiment_type: chromatin occupancy profiling
