id: Q92753
gene_symbol: RORB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'RORB (RAR-related orphan receptor beta, NR1F2) is a nuclear receptor transcription factor
  of the NR1 subfamily, expressed mainly in neural tissue: retina, pineal gland, thalamus, spinal cord
  and layer IV neurons of the neocortex. It binds DNA as a monomer through a C4 zinc-finger domain at
  ROR response elements (an AGGTCA half-site preceded by an A/T-rich sequence) and activates transcription
  constitutively. Its ligand-binding domain binds fatty acids, and all-trans retinoic acid and related
  retinoids bind it as inverse agonists that reduce its activity. Two isoforms arise from alternative
  promoters. In mouse, RORbeta drives rod photoreceptor development by inducing Nrl, activates the S-opsin
  gene in cones together with CRX, and its isoform RORbeta1 directs amacrine and horizontal interneuron
  differentiation by inducing Ptf1a with Foxn4. RORbeta also patterns layer IV barrel cytoarchitecture
  in the somatosensory cortex. Knockout mice have retinal degeneration, a duck-like gait and a lengthened
  circadian period. Overexpression suppresses osteoblast differentiation by antagonizing RUNX2. Heterozygous
  loss-of-function variants in human RORB cause generalized epilepsy, often with absence seizures.'
