- id: PMID:21164014
  title: The substrate of Greatwall kinase, Arpp19, controls mitosis by inhibiting
    protein phosphatase 2A.
  findings:
  - statement: Arpp19 and alpha-endosulfine are Greatwall substrates that, once phosphorylated,
      bind and inhibit PP2A to promote mitotic entry; endogenous Arpp19 is the relevant inhibitor
      in Xenopus egg extracts.
    supporting_text: We identified cyclic adenosine monophosphate-regulated phosphoprotein 19
      (Arpp19) and α-Endosulfine as two substrates of Gwl that, when phosphorylated by this
      kinase, associate with and inhibit PP2A, thus promoting mitotic entry.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified; abstract-only in cache. Founding paper for the Greatwall-ARPP19-
      PP2A axis (Xenopus egg extracts plus HeLa cells per MeSH); source of both IMP annotations.
- id: PMID:28167675
  title: ARPP-16 Is a Striatal-Enriched Inhibitor of Protein Phosphatase 2A Regulated
    by Microtubule-Associated Serine/Threonine Kinase 3 (Mast 3 Kinase).
  findings:
  - statement: The ARPP-16 splice isoform binds the PP2A A subunit and, when phosphorylated on
      Ser46 by MAST3, selectively inhibits B55alpha- and B56delta-containing PP2A; PKA
      phosphorylation of Ser88 is accompanied by Ser46 dephosphorylation.
    supporting_text: Activation of PKA in striatal slices leads to phosphorylation of Ser88, and
      this is accompanied by marked dephosphorylation of Ser46.
  - statement: The authors conclude that the function of the ARPP-16/19/ENSA family is limited to
      control of PP2A activity and note the lack of evidence for extracellular ENSA.
    supporting_text: suggest that the function of the ARPP-16/19/ENSA family of proteins is limited
      to control of PP2A activity.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified; full text cached. Mouse/rat ARPP-16 biochemistry and conditional
      knockout; the isoform is a product of the ARPP19 gene and the inhibitory site is equivalent
