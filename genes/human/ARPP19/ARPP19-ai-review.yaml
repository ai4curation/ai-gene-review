suggested_questions:
- question: Were the four GOA rows citing PMID:9653196 for ARPP19 (signaling receptor binding,
    potassium channel regulator activity, positive regulation of gluconeogenesis, positive
    regulation of D-glucose import) transferred from the alpha-endosulfine (ENSA) work because
    the paper is UniProt reference 1 for the ARPP-19 mRNA? If so they should be retired from
    P56211 and left on ENSA (O43768).
  experts:
  - UniProt GOA curators
- question: In human somatic cells, how is labour divided between ARPP19 and ENSA? Mouse
    genetics indicate ARPP19 is the non-redundant mitotic PP2A-B55 inhibitor while ENSA acts in S
    phase; is the same true in human cells, and does FAM122A initiate the inhibition that
    phospho-ARPP19 then takes over?
  experts:
  - Anna Castro
  - Thierry Lorca
  - Wolfgang Peti
- question: Does PKA phosphorylation of Ser104 have a physiological output in dividing human
    cells (as it does for prophase-I arrest in Xenopus oocytes and for MAST3 antagonism in
    striatal neurons), or is it restricted to non-dividing cells such as platelets and neurons?
  experts:
  - Angus C. Nairn
suggested_experiments:
- hypothesis: ARPP19, not ENSA, is the physiological MASTL effector for PP2A-B55 inhibition at
    mitotic entry in human cells.
  description: Acute degron (dTAG/AID) depletion of endogenous ARPP19 versus ENSA in synchronized
    human cells, with live imaging of mitotic entry/exit timing and quantitative phosphoproteomics
    of CDK1 substrates; rescue with wild-type, S62A and S104A ARPP19 to separate the MASTL and PKA
    sites.
  experiment_type: degron genetics / phosphoproteomics
- hypothesis: Endogenous ARPP19 is nucleocytoplasmic in interphase and its MASTL-site
    phosphorylation begins in the nucleus before nuclear envelope breakdown.
  description: Endogenous tagging of ARPP19 (CRISPR knock-in) with live imaging through the cell
    cycle, combined with a phospho-Ser62-specific antibody, to determine where and when the
    inhibitory form first appears relative to MASTL and PP2A-B55.
  experiment_type: cell biology / imaging
