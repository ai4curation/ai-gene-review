core_functions:
- description: MASTL/Greatwall-phosphorylated (Ser62) inhibitor of the PP2A-B55 phosphatase that
    binds B55 and the PP2A catalytic subunit through a tripartite interface, blocking removal of
    cyclin B-CDK1 phosphorylations so that the cell can commit to and remain in mitosis; its slow
    dephosphorylation by PP2A-B55 reactivates the phosphatase and helps time mitotic exit.
  molecular_function:
    id: GO:0004864
    label: protein phosphatase inhibitor activity
  directly_involved_in:
