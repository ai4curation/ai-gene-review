  evidence_type: IMP
  original_reference_id: PMID:21164014
  qualifier: involved_in
  review:
    summary: Greatwall-phosphorylated Arpp19 binds and inhibits PP2A to promote mitotic entry;
      endogenous Arpp19, not ENSA, is the PP2A inhibitor at mitotic entry in egg extracts.
    action: ACCEPT
    reason: This is the defining function of the gene. The primary evidence is Xenopus egg extract
      depletion/add-back (abstract-only in cache; the paper also used HeLa cells per its MeSH
      indexing), and the mechanism was subsequently reconstituted with purified human ARPP19 and
      human PP2A:B55 (PMID:38123684), whose authors state that inhibition of PP2A:B55 by ARPP19 is
      essential for mitotic entry. ARPP19 performs the inhibitory step itself, so this is
      participation, not mere necessity.
    supported_by:
    - &q_gharbi_substrate
      reference_id: PMID:21164014
      supporting_text: We identified cyclic adenosine monophosphate-regulated phosphoprotein 19
        (Arpp19) and α-Endosulfine as two substrates of Gwl that, when phosphorylated by this
        kinase, associate with and inhibit PP2A, thus promoting mitotic entry.
    - &q_gharbi_endogenous
      reference_id: PMID:21164014
      supporting_text: Although both proteins can inhibit PP2A, endogenous Arpp19, but not
        α-Endosulfine, is responsible for PP2A inhibition at mitotic entry in Xenopus egg extracts.
    - &q_padi_essential
      reference_id: PMID:38123684
      supporting_text: The inhibition of PP2A:B55 by two B55-specific inhibitors, FAM122A and
        ARPP19, is essential for mitotic entry
