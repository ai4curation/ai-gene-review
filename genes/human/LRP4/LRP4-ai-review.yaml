id: O75096
gene_symbol: LRP4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  LRP4 is a 1,905-residue type-I cell-surface receptor with a large extracellular
  LDL-receptor-family repeat region, one transmembrane helix, and a cytoplasmic tail.
  At the neuromuscular junction, its ectodomain binds neuronal AGRIN and MuSK and
  assembles them into a signaling complex that activates MuSK and promotes
  acetylcholine-receptor clustering and synapse formation. In osteoblast-lineage
  cells, LRP4 directly binds the secreted inhibitor sclerostin and facilitates its
  suppression of canonical Wnt signaling and bone formation. Human variants that
  perturb different surfaces of the third beta-propeller selectively disrupt these
  neuromuscular or bone-regulatory functions, causing congenital myasthenic syndrome,
  Cenani-Lenz syndactyly syndrome, or sclerosteosis-like bone overgrowth.
