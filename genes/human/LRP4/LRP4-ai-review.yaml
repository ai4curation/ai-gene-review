  supported_by:
  - reference_id: PMID:21471202
    supporting_text: |-
      Biochemical assays with recombinant proteins
      confirmed that sclerostin LRP4 interaction is direct. Interestingly, in vitro
      overexpression and RNAi-mediated knockdown experiments revealed that LRP4
      specifically facilitates the previously described inhibitory action of
      sclerostin on Wnt1/β-catenin signaling.
    reference_section_type: ABSTRACT
  - reference_id: PMID:21471202
    supporting_text: |-
      Notably,
      we identified two mutations in LRP4 (R1170W and W1186S) in patients suffering
      from bone overgrowth. We found that these mutations impair LRP4 interaction with
      sclerostin and its concomitant sclerostin facilitator effect.
    reference_section_type: ABSTRACT
  - reference_id: PMID:20381006
    supporting_text: |-
      By sequencing candidate genes, we identified recessive
      LRP4 mutations in 12 families with CLS. LRP4 belongs to the low-density
      lipoprotein (LDL) receptor-related proteins (LRPs), which are essential for
      various developmental processes. LRP4 is known to antagonize LRP6-mediated
      activation of canonical Wnt signaling, a function that is lost by the identified
      mutations.
    reference_section_type: ABSTRACT
proposed_new_terms: []
suggested_questions:
- question: >-
    How does full-length membrane-embedded human LRP4 couple the extracellular
    AGRIN-LRP4-MuSK assembly to MuSK activation and synaptic organization?
- question: >-
    How do distinct surfaces of LRP4 beta-propeller 3 select AGRIN/MuSK versus
    sclerostin/Wnt pathway partners in different tissues?
- question: >-
    Which PDZ-domain proteins bind the full-length LRP4 cytoplasmic tail endogenously,
    and do any regulate neuromuscular or bone signaling?
- question: >-
    Does human LRP4 directly facilitate DKK1 signaling in osteoblasts, or is its
    established human Wnt-inhibitory role specific to sclerostin?
- question: >-
    Does LRP4 undergo regulated cleavage, endocytosis, or recycling that changes the
    balance between its AGRIN/MuSK and sclerostin/Wnt functions?
suggested_experiments:
- description: >-
    Endogenously tag LRP4 and MuSK in human myotubes and combine ligand-timed
    single-molecule imaging, phosphoproteomics, and AChR-clustering assays with rescue
    by interface-specific LRP4 variants.
  hypothesis: >-
    AGRIN stabilizes a full-length LRP4-MuSK assembly whose geometry, rather than an
    intrinsic LRP4 catalytic activity, drives MuSK activation and AChR clustering.
  experiment_type: endogenous neuromuscular receptor-complex analysis
- description: >-
    Determine a membrane-context structure of full-length human LRP4 with AGRIN and
    MuSK by cryo-electron tomography or single-particle cryo-EM, including the
    transmembrane segments and cytoplasmic tails.
  hypothesis: >-
    Membrane anchoring and unresolved LRP4 regions impose additional geometry on the
    AGRIN-LRP4-MuSK complex that is absent from the soluble 21-1350 ectodomain structure.
  experiment_type: full-length membrane-protein structural analysis
- description: >-
    Introduce pathway-selective third-propeller variants into isogenic human osteoblasts
    and myotubes, then compare sclerostin/Wnt inhibition, AGRIN/MuSK activation, and
    receptor surface abundance.
  hypothesis: >-
    Spatially distinct third-propeller surfaces independently encode LRP4's bone and
    neuromuscular functions rather than causing a shared folding defect.
  experiment_type: separation-of-function variant analysis
- description: >-
    Validate candidate PDZ-tail partners by endogenous co-immunoprecipitation and
    proximity labeling in human myotubes and osteoblasts, followed by partner knockout
    and rescue assays in each signaling context.
  hypothesis: >-
    Only a subset of peptide-binding PDZ proteins forms physiological LRP4 complexes,
    with tissue-specific effects on receptor localization or signaling.
  experiment_type: endogenous cytoplasmic-tail interactome validation
knowledge_gaps:
- gap_statement: >-
    The architecture and signaling behavior of full-length membrane-embedded human
    LRP4 in the AGRIN-LRP4-MuSK complex remain unresolved.
  boundary: >-
    The human cryo-EM study used LRP4 residues 21-1350, and substantial extracellular
    regions, the transmembrane helix, and the entire cytoplasmic tail are absent or
    unresolved. It establishes extracellular partner recruitment, not the complete
    receptor activation mechanism.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: >-
    A full-length structure is needed to connect extracellular coreceptor assembly to
    membrane organization and intracellular MuSK activation.
  resolution: >-
    Resolve a membrane-context full-length human AGRIN-LRP4-MuSK complex and test
    structural predictions with interface-selective rescue assays.
  provenance:
  - reference_id: PMID:37252960
    supporting_text: |-
      The human MuSK-ECD and agrin-ECD were individually expressed by the Bac-to-Bac expression system. The human LRP4-ECD was expressed through the BacMam expression system. The MuSK-ECD (24-495aa) was subcloned into a pFastBac vector with a gp67 signaling sequence and N-terminal His tag for protein expression and secretion in Sf9 insect cells. Similarly, the agrin-ECD (1329-2068aa, Δ1897-1907aa) was subcloned into a pFastBac vector with a gp67 signaling sequence and C-terminal His tag for protein expression and secretion in sf9 cells. The LRP4-ECD (21-1350aa) was subcloned into a pACEMam1 vector with the LRP4 signaling sequence and a C-terminal Flag tag for protein expression and secretion in HEK293F cells.
    reference_section_type: METHODS
- gap_statement: >-
    Direct endogenous human-neuromuscular evidence for LRP4 complex dynamics and
    signaling is limited.
  boundary: >-
    Foundational functional experiments use mammalian cell lines and mouse muscle,
    while human evidence comes from a soluble-fragment structure and disease variants.
    These sources strongly support conserved mechanism but do not directly visualize
    full-length LRP4 signaling at a human neuromuscular junction.
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  status: OPEN
  significance: >-
    Human endogenous measurements are needed to define complex lifetime, pathway
    stoichiometry, and variant effects in the native synaptic context.
  resolution: >-
    Use patient-derived or engineered human neuromuscular cocultures for endogenous
    complex imaging, MuSK phosphosignaling, and AChR-clustering rescue.
- gap_statement: >-
    The molecular basis for pathway-selective effects of LRP4 beta-propeller variants
    is incomplete.
  boundary: >-
    Human variants and mutagenesis distinguish a MuSK-regulating edge from a
    Wnt-regulating central cavity, but folding, trafficking, partner occupancy, and
    tissue-specific effects have not been compared in one system.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    Resolving this distinction is essential for interpreting disease variants without
    assuming that every allele disrupts both core pathways.
  resolution: >-
    Compare surface expression, structure, AGRIN/MuSK binding, sclerostin binding, and
    downstream signaling for a systematic variant panel in matched human cell models.
  provenance:
  - reference_id: PMID:24234652
    supporting_text: |-
      The
      identified mutations in LRP4 are located at the edge of its 3rd beta-propeller
      domain and decrease binding affinity of LRP4 for both MuSK and agrin. Mutations
      in the LRP4 3rd beta-propeller domain were previously reported to impair Wnt
      signaling and cause bone diseases including Cenani-Lenz syndactyly syndrome and
      sclerosteosis-2. By analyzing naturally occurring and artificially introduced
      mutations in the LRP4 3rd beta-propeller domain, we show that the edge of the
      domain regulates the MuSK signaling whereas its central cavity governs Wnt
      signaling.
    reference_section_type: ABSTRACT
- gap_statement: >-
    The physiological LRP4 cytoplasmic-tail interactome and its contribution to either
    core pathway are unknown.
  boundary: >-
    Fragmentomics supports PDZ-domain binding by an LRP4 tail peptide, but the assay
    does not establish that every partner binds full-length LRP4 in cells or regulates
    neuromuscular or bone signaling.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: >-
    Partner validation is required before assigning specific scaffold complexes or
    downstream tail-mediated processes to LRP4.
  resolution: >-
    Test endogenous full-length LRP4 complexes and partner-specific functional effects
    in human myotubes and osteoblasts.
