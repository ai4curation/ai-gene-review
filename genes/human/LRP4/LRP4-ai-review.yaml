- id: PMID:20381006
  title: LRP4 mutations alter Wnt/beta-catenin signaling and cause limb and kidney
    malformations in Cenani-Lenz syndrome.
  findings:
  - statement: Recessive human LRP4 variants were identified in 12 Cenani-Lenz syndrome
      families with limb and kidney malformations, and tested variants lost LRP4's antagonism
      of LRP6-mediated canonical Wnt activation.
    supporting_text: |-
      By sequencing candidate genes, we identified recessive
      LRP4 mutations in 12 families with CLS. LRP4 belongs to the low-density
      lipoprotein (LDL) receptor-related proteins (LRPs), which are essential for
      various developmental processes. LRP4 is known to antagonize LRP6-mediated
      activation of canonical Wnt signaling, a function that is lost by the identified
      mutations.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct human genetic and functional evidence. Congenital malformations
      establish disease and developmental consequences; they do not by themselves define
      every normal-tissue molecular mechanism.
- id: PMID:21471202
  title: Bone overgrowth-associated mutations in the LRP4 gene impair sclerostin facilitator
    function.
  findings:
  - statement: Recombinant-protein assays established direct SOST-LRP4 binding, and
      perturbation experiments showed that LRP4 facilitates SOST inhibition of Wnt1/beta-catenin
      signaling.
    supporting_text: |-
      Biochemical assays with recombinant proteins
      confirmed that sclerostin LRP4 interaction is direct. Interestingly, in vitro
      overexpression and RNAi-mediated knockdown experiments revealed that LRP4
      specifically facilitates the previously described inhibitory action of
      sclerostin on Wnt1/β-catenin signaling.
  - statement: Human bone-overgrowth variants R1170W and W1186S impaired LRP4-SOST
      interaction and the SOST-facilitator effect.
    supporting_text: |-
      Notably,
      we identified two mutations in LRP4 (R1170W and W1186S) in patients suffering
      from bone overgrowth. We found that these mutations impair LRP4 interaction with
      sclerostin and its concomitant sclerostin facilitator effect.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct biochemical, perturbational, localization, mineralization,
      and human-variant evidence for the SOST/Wnt arm. The in-vitro assays and patient
      phenotypes should remain distinct from whole-organism proof of every proposed
      signaling step.
- id: PMID:24234652
  title: LRP4 third β-propeller domain mutations cause novel congenital myasthenia by
    compromising agrin-mediated MuSK signaling in a position-specific manner.
  findings:
  - statement: Two heteroallelic human LRP4 variants in a congenital-myasthenia patient
      reduced binding to both MuSK and agrin; domain mutagenesis separated the MuSK-signaling
      edge from the Wnt-regulating central cavity of beta-propeller 3.
    supporting_text: |-
      The
      identified mutations in LRP4 are located at the edge of its 3rd beta-propeller
      domain and decrease binding affinity of LRP4 for both MuSK and agrin. Mutations
      in the LRP4 3rd beta-propeller domain were previously reported to impair Wnt
      signaling and cause bone diseases including Cenani-Lenz syndactyly syndrome and
      sclerosteosis-2. By analyzing naturally occurring and artificially introduced
      mutations in the LRP4 3rd beta-propeller domain, we show that the edge of the
      domain regulates the MuSK signaling whereas its central cavity governs Wnt
      signaling.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct human disease genetics plus functional binding/signaling evidence.
      It is especially useful for separating AGRIN/MuSK-interface defects from SOST/Wnt-associated
      variants. The cache is abstract-only.
- id: PMID:28514442
  title: Architecture of the human interactome defines protein communities and disease
    networks.
  findings:
  - statement: BioPlex 2.0 used affinity-purification mass spectrometry in a proteome-scale
      human co-complex survey; candidate co-associations are discovery evidence rather
      than proof of direct binding.
    supporting_text: |-
      Here we present BioPlex 2.0
      (Biophysical Interactions of ORFeome-derived complexes), which uses robust
      affinity purification-mass spectrometry methodology to elucidate protein
      interaction networks and co-complexes nucleated by more than 25% of
      protein-coding genes from the human genome
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: Relevant as the source of a human LRP4 co-association annotation,
      but the cached article text does not expose the LRP4-SOST record itself. The targeted
      direct evidence is PMID:21471202.
- id: PMID:33961781
  title: Dual proteome-scale networks reveal cell-specific remodeling of the human
    interactome.
  findings:
  - statement: BioPlex 3.0 and its HCT116 companion network are cell-line-specific
      AP-MS interaction maps, so an LRP4 co-association is not automatically direct
      or physiologically general.
    supporting_text: |-
      Through affinity-purification
      mass spectrometry, we have created two proteome-scale, cell-line-specific
      interaction networks. The first, BioPlex 3.0, results from affinity purification
      of 10,128 human proteins-half the proteome-in 293T cells and includes 118,162
      interactions among 14,586 proteins. The second results from 5,522
      immunoprecipitations in HCT116 cells.
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: Relevant as screen provenance, but the cached article text does not
      expose the specific LRP4-SOST record. Targeted recombinant and functional support
      comes from PMID:21471202.
- id: PMID:36115835
  title: Quantitative fragmentomics allow affinity mapping of interactomes.
  findings:
  - statement: The study measured a large human PDZ-domain/PDZ-binding-motif interaction
      panel, providing fragment-level affinity evidence rather than evidence that every
      pair forms a physiological full-length complex.
    supporting_text: |-
      Here, we measure the affinities of 65,000 interactions involving PDZ
      domains and their target PDZ-binding motifs (PBM) within a human interactome
      region particularly relevant for viral infection and cancer.
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: Methodologically relevant to the LRP4 C-terminal PDZ-binding-motif
      annotation, but LRP4-specific records reside in the underlying dataset and are
      not named in the cached article prose. Interpret as motif-fragment binding, not
      universal in-cell complex formation.
- id: PMID:37252960
  title: Structural insights into the assembly of the agrin/LRP4/MuSK signaling complex.
  findings:
  - statement: A 3.8-A cryo-EM reconstruction showed a 1:1:1 extracellular agrin-LRP4-MuSK
      complex in which LRP4 simultaneously recruits agrin and MuSK.
    supporting_text: |-
      Here, we report the cryo-EM structure of the extracellular
      ternary complex of agrin/LRP4/MuSK in a stoichiometry of 1:1:1. This structure
      reveals that arc-shaped LRP4 simultaneously recruits both agrin and MuSK to its
      central cavity, thereby promoting a direct interaction between agrin and MuSK.
  - statement: The structure used human proteins but only an LRP4 extracellular fragment
      (residues 21-1350); LDLa repeats and several MuSK domains were unresolved, so
      PDB 8S9P is not a fully observed full-length LRP4 structure.
    supporting_text: |-
      The human MuSK-ECD and agrin-ECD were individually expressed by the Bac-to-Bac expression system. The human LRP4-ECD was expressed through the BacMam expression system. The MuSK-ECD (24-495aa) was subcloned into a pFastBac vector with a gp67 signaling sequence and N-terminal His tag for protein expression and secretion in Sf9 insect cells. Similarly, the agrin-ECD (1329-2068aa, Δ1897-1907aa) was subcloned into a pFastBac vector with a gp67 signaling sequence and C-terminal His tag for protein expression and secretion in sf9 cells. The LRP4-ECD (21-1350aa) was subcloned into a pACEMam1 vector with the LRP4 signaling sequence and a C-terminal Flag tag for protein expression and secretion in HEK293F cells.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct human-fragment structural and interface evidence, with functional
      AChR-clustering mutagenesis. The deposited polymer maps to O75096, but the experiment
      used a truncated soluble ectodomain and substantial regions were unresolved; it
      must not be described as a complete full-length receptor structure.
- id: PMID:41162706
  title: Multiple LDLR family members act as entry receptors for yellow fever virus.
  findings:
  - statement: Human-cell perturbations identified LRP4 as one of several LDLR-family
      proteins that can mediate yellow-fever-virus entry through its LDLa region; this
      is pathogen exploitation, not an endogenous core function.
    supporting_text: |-
      Here, using a surface protein-targeted CRISPR-Cas9 screen, we identified LRP4, a
      low-density lipoprotein receptor (LDLR) family member, as a candidate entry
      receptor for YFV. Genetic ablation of LRP4 impaired YFV infection of cells and,
      reciprocally, complementation or ectopic expression of LRP4 increased infection.
      Related viruses in the YFV antigenic complex also showed LRP4-dependent
      infection. LRP4 promoted YFV entry into cells through LDLR type A (LA) domain
      binding to domain III of the YFV envelope protein.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Direct modern evidence for a non-core microbial-entry role. The same
      study identifies LRP1 and VLDLR as additional receptors, so it does not justify
      transferring all LDLR-family biology to LRP4.
