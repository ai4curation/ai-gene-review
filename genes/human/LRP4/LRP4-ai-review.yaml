core_functions:
- description: >-
    At the skeletal-muscle neuromuscular junction, LRP4 functions as the
    extracellular coreceptor that binds neuronal AGRIN and MuSK and brings them into
    a ternary signaling complex. This enables AGRIN-dependent MuSK activation,
    acetylcholine-receptor clustering, and coordinated pre- and postsynaptic assembly.
    Mammalian cell and muscle experiments establish the mechanism, while a human
    extracellular-fragment cryo-EM structure directly resolves the 1:1:1 complex and
    human congenital-myasthenia variants impair AGRIN and MuSK binding. The evidence
    does not make LRP4 a kinase or establish that its cytoplasmic tail supplies the
    catalytic signal.
  molecular_function:
    id: GO:0015026
    label: coreceptor activity
  directly_involved_in:
  - id: GO:0051124
    label: synaptic assembly at neuromuscular junction
  - id: GO:1904395
    label: positive regulation of skeletal muscle acetylcholine-gated channel clustering
  locations:
  - id: GO:0031594
    label: neuromuscular junction
  - id: GO:0097060
    label: synaptic membrane
  supported_by:
  - reference_id: PMID:18957220
    supporting_text: |-
      report that LRP4, a low-density lipoprotein receptor (LDLR)-related protein, is
      expressed specifically in myotubes and binds to neuronal agrin. Its expression
      enables agrin binding and MuSK signaling in cells that otherwise do not respond
      to agrin. Suppression of LRP4 expression in muscle cells attenuates agrin
      binding, agrin-induced MuSK tyrosine phosphorylation, and AChR clustering. LRP4
      also forms a complex with MuSK in a manner that is stimulated by agrin.
    reference_section_type: ABSTRACT
  - reference_id: PMID:37252960
    supporting_text: |-
      Here, we report the cryo-EM structure of the extracellular
      ternary complex of agrin/LRP4/MuSK in a stoichiometry of 1:1:1. This structure
      reveals that arc-shaped LRP4 simultaneously recruits both agrin and MuSK to its
      central cavity, thereby promoting a direct interaction between agrin and MuSK.
    reference_section_type: ABSTRACT
  - reference_id: PMID:24234652
    supporting_text: |-
      The
      identified mutations in LRP4 are located at the edge of its 3rd beta-propeller
      domain and decrease binding affinity of LRP4 for both MuSK and agrin. Mutations
      in the LRP4 3rd beta-propeller domain were previously reported to impair Wnt
      signaling and cause bone diseases including Cenani-Lenz syndactyly syndrome and
      sclerosteosis-2. By analyzing naturally occurring and artificially introduced
      mutations in the LRP4 3rd beta-propeller domain, we show that the edge of the
      domain regulates the MuSK signaling whereas its central cavity governs Wnt
      signaling.
    reference_section_type: ABSTRACT
- description: >-
    In osteoblast-lineage cells, plasma-membrane LRP4 binds sclerostin and acts as a
    facilitator/coreceptor for its inhibition of canonical Wnt signaling. Direct
    recombinant-protein binding, LRP4 overexpression and knockdown, and human
    bone-overgrowth variants support this pathway. Mouse Lrp4-DKK1 and bone phenotypes
    provide additional in-vivo context, but the direct human evidence is strongest for
    sclerostin and should not be generalized to every Wnt antagonist or LDLR-family
    ligand.
