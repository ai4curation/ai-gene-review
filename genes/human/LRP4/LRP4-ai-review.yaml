    supporting_text: |-
      cells were stably transfected with Pgp or mLRP4, an LRP mini-receptor. When
      compared to empty vector-transfected cells, MDCK-Pgp cells did not transcytose
      radiolabeled Abeta in the basolateral-to-apical direction. MDCK-mLRP4 cells were
      found to endocytose and degrade, but not to trasncytose intact radiolabeled
      Abeta.
  reference_review:
    relevance: NONE
    correctness: MISCITED
    review_notes: This is a verified construct-name collision. “mLRP4” denotes a mini-receptor
      derived from LRP in a canine-cell BBB model, not human LRP4/O75096.
- id: PMID:18848351
  title: Lrp4 is a receptor for Agrin and forms a complex with MuSK.
  findings:
  - statement: The foundational study reports that Lrp4 binds agrin, complexes with
      MuSK, and mediates agrin-dependent MuSK activation at neuromuscular synapses.
    supporting_text: |-
      Here, we report that Lrp4, a member of the LDLR family,
      is a receptor for Agrin, forms a complex with MuSK, and mediates MuSK activation
      by Agrin.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct foundational AGRIN-LRP4-MuSK evidence. The cache is abstract-only
      and does not expose all construct/species details, so human-specific claims should
      rely on the later human structure and human genetics studies.
- id: PMID:18957220
  title: LRP4 serves as a coreceptor of agrin.
  findings:
  - statement: An independent foundational study showed that LRP4 binds neuronal agrin,
      complexes with MuSK, is required for agrin-dependent MuSK phosphorylation and
      AChR clustering, and can reconstitute agrin responsiveness in heterologous cells.
    supporting_text: |-
      report that LRP4, a low-density lipoprotein receptor (LDLR)-related protein, is
      expressed specifically in myotubes and binds to neuronal agrin. Its expression
      enables agrin binding and MuSK signaling in cells that otherwise do not respond
      to agrin. Suppression of LRP4 expression in muscle cells attenuates agrin
      binding, agrin-induced MuSK tyrosine phosphorylation, and AChR clustering. LRP4
      also forms a complex with MuSK in a manner that is stimulated by agrin.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct, independent AGRIN-coreceptor evidence using recombinant
      extracellular domains, C2C12 muscle cells, heterologous HEK293 cells, and mouse
      muscle. It is decisive for conserved mechanism but is not a direct human-physiology
      study.
- id: PMID:19936252
  title: Lrp4, a novel receptor for Dickkopf 1 and sclerostin, is expressed by osteoblasts
    and regulates bone growth and turnover in vivo.
  findings:
  - statement: In vitro assays showed Lrp4 binding to Dkk1 and sclerostin, while Lrp4-deficient
      mice had altered bone dimensions, density, and turnover markers.
    supporting_text: |-
      Here we show that Lrp4 is expressed in
      bone and cultured osteoblasts and binds Dkk1 and sclerostin in vitro. MicroCT
      analysis of Lrp4 deficient mutant mice revealed shortened total femur length,
      reduced cortical femoral perimeter, and reduced total femur bone mineral content
      (BMC) and bone mineral density (BMD).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary mouse in-vivo and cultured-osteoblast evidence for the bone
      pathway. It supports conserved LRP4 biology but is not direct human physiological
      evidence.
