suggested_questions:
- question: Does PACMP inhibit CUL3-KLHL15 ligase activity toward other KLHL15 substrates, or only occlude
    the CtIP-binding site? The answer decides between ubiquitin ligase inhibitor activity (GO:1990948)
    and the more neutral ubiquitin protein ligase binding.
- question: Is the PACMP-PARP1 interaction direct, or bridged by PAR chains on auto-modified PARP1? Does
    PACMP increase PARP1 catalytic activity in a purified system (an enzyme activator activity) or act by
    stabilising PAR chains?
- question: Does PACMP promote DNA end resection and homologous recombination specifically, as its CtIP-stabilising
    role predicts, which would support a more specific DNA repair term than positive regulation of DNA
    repair?
- question: Is the PACMP ORF conserved beyond primates, and has its translation been confirmed independently
    (ribosome profiling or mass spectrometry) outside the original study?
suggested_experiments:
- hypothesis: PACMP is a direct activator of PARP1 enzyme activity rather than only a PAR-chain binder.
  description: Reconstitute PARP1 automodification in vitro with purified PARP1, damaged DNA and synthetic
    PACMP peptide (wild type versus the 10A/4A PAR-binding mutants) and measure PAR synthesis kinetics.
  experiment_type: in vitro enzyme assay
- hypothesis: PACMP's tumour-suppressive DDR phenotype depends on the peptide rather than the host RNA.
  description: Introduce start-codon or frameshift mutations into the endogenous ORF while preserving the
    transcript, and test CtIP levels, end resection (RPA foci/ssDNA), PARylation and PARP-inhibitor sensitivity.
  experiment_type: genome editing and DNA repair assays
