    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (Mol Cell 2022;82:1297-1312, not Nature Chem Biol). The only paper on
      PACMP found by PubMed search; source of all experimental GOA rows. Not in PMC; cached record is abstract-only,
      so mechanistic details (KLHL15/PARP1 interaction, arginine mutants, nucleolar localisation) are taken
      from the UniProt entry. Single-lab study without independent replication.
