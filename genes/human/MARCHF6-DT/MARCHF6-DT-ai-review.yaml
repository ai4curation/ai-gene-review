    summary: Interaction of PACMP with PARP1 (P09874) reported in the primary characterisation paper; PACMP
      enhances PARP1-dependent poly(ADP-ribosyl)ation.
    action: MODIFY
    reason: Bare protein binding is uninformative. The partner is the enzyme PARP1, and the interaction
      is linked to PACMP's enhancement of PARP1 activity, so enzyme binding (GO:0019899) is a more informative
      term that stays within what the evidence shows. Whether the interaction is direct or bridged by
      PARP1 auto-PARylation chains is not resolved in the available text, so a PARP1 activator MF is
      not asserted.
