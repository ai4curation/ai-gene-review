  - statement: The lncRNA CTD-2256P15.2 (MARCHF6-DT) encodes the micropeptide PACMP, which maintains CtIP
      abundance by blocking CtIP-KLHL15 association and binds damage-induced PAR to enhance PARP1-dependent
      PARylation.
