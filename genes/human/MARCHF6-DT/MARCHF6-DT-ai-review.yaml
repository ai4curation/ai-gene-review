description: 'MARCHF6-DT encodes PACMP (PAR-amplifying and CtIP-maintaining micropeptide), a 44-amino-acid
  human microprotein translated from a small ORF in a transcript previously annotated as a long noncoding
  RNA (CTD-2256P15.2), the divergent transcript of MARCHF6 on chromosome 5. The peptide is predicted
  to be intrinsically disordered, with a strongly arginine/lysine-rich C-terminal half. PACMP localises
  to the nucleolus and to chromatin, and is recruited to sites of DNA damage by binding damage-induced
  poly(ADP-ribose) chains through its basic residues. It has two reported activities in the DNA damage
  response: it binds KLHL15, the substrate adaptor of a CUL3 ubiquitin ligase, and blocks KLHL15 association
  with the end-resection factor CtIP (RBBP8), thereby preventing CtIP ubiquitination and degradation;
  and it binds PAR chains and PARP1 to enhance PARP1-dependent poly(ADP-ribosyl)ation. Depletion of
  PACMP lowers CtIP levels and PARylation, inhibits tumour growth, and sensitises cancer cells to PARP,
  ATR and CDK4/6 inhibitors, ionizing radiation, epirubicin and camptothecin. All functional data come
  from a single study.'
