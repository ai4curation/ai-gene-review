id: Q9NTI2
gene_symbol: ATP8A2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ATP8A2 is a P4-type ATPase that couples ATP hydrolysis to the inward movement of aminophospholipids
  between membrane leaflets. Its principal substrate is phosphatidylserine, with weaker phosphatidylethanolamine
  transport. ATP8A2 forms a complex with the accessory subunit CDC50A/TMEM30A, which supports folding,
  exit from the endoplasmic reticulum and localization to Golgi and plasma membranes. Its lipid-transport
  activity maintains membrane asymmetry and supports neuronal and sensory-cell function.
