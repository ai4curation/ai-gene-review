    supporting_text: "ATP8A2 is a P4-ATPase (adenosine triphosphate) that actively flips \nphosphatidylserine\
      \ and phosphatidylethanolamine from the exoplasmic to the \ncytoplasmic leaflet"
  - reference_id: PMID:34403372
    supporting_text: WT hATP8A2 and hATP11C translocated NBD-PS, but not NBD-PC
    reference_section_type: RESULTS
suggested_questions:
- question: Can the ATP8A2-associated Rhea-to-GO phosphatidylserine direction mapping and the raw phosphatidylethanolamine
    reaction direction be reconciled with the experimentally supported inward flippase activity?
- question: Which full-length ATP8A2 splice products are expressed as functional CDC50A complexes in human
    neurons, and what is the biological status of the strongly truncated product listed with a frameshift
    caution?
suggested_experiments:
- description: Compare sequence-verified full-length human splice products in the same CDC50A-complemented
    system, measuring surface abundance and PS/PE lipid flux separately from ATP hydrolysis. Match expression
    before interpreting transport differences.
