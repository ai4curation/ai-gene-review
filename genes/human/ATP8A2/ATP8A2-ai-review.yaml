core_functions:
- description: ATP8A2 couples ATP hydrolysis to inward aminophospholipid translocation, principally phosphatidylserine
    with weaker phosphatidylethanolamine transport, as the catalytic P4-ATPase subunit of a CDC50A-containing
    complex. This activity maintains membrane lipid asymmetry; CDC50A supports complex assembly and exit
    from the endoplasmic reticulum.
