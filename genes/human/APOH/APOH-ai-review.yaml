id: P02749
gene_symbol: APOH
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: APOH (beta2-glycoprotein I, apolipoprotein H) is an abundant liver-derived plasma glycoprotein
  built from five complement control protein (sushi) domains; domain V carries a lysine-rich loop that
  binds anionic phospholipids. It binds negatively charged surfaces such as anionic phospholipids, heparin
  and dextran sulfate, and inhibits contact activation of the intrinsic coagulation pathway in plasma.
  It associates with serum lipoproteins, binds the ligand-binding modules of LDL-receptor-family proteins
  through domain V, forms complexes with platelet factor 4, apolipoprotein(a) and mannose-binding lectin,
  and acts as a cofactor for tPA-mediated plasminogen activation. Plasmin cleavage in domain V produces
  nicked beta2GPI, which binds plasminogen, inhibits plasmin generation and has anti-angiogenic activity.
  Its physiological function remains uncertain. beta2GPI is the main antigen of antiphospholipid antibodies
  in the antiphospholipid syndrome.
