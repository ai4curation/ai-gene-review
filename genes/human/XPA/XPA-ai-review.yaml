id: P23025
gene_symbol: XPA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'XPA encodes a nuclear nucleotide-excision repair scaffold and DNA-damage verification factor. It recognizes helix-distorting UV and bulky-adduct lesions, cooperates with RPA on damaged DNA, and recruits the ERCC1-XPF endonuclease to assemble the human NER pre-incision complex for dual incision of the damaged strand.'
