suggested_questions:
- question: Does human XPA make a direct, conserved contribution to interstrand cross-link repair, or should GO:1901255 be limited to non-metazoan Rad14/XPA proteins where that context has been demonstrated? The only PAINT seed for GO:1901255 in PTHR10142 is the fission yeast rhp14 annotation, whereas the human literature reviewed here supports the genus nucleotide-excision repair without a conserved ICL context.
suggested_experiments:
- description: Reconstitute FANCD2/SLX4-dependent human interstrand cross-link unhooking with and without purified XPA, separating any ERCC1-XPF recruitment effect from canonical nucleotide-excision repair damage verification.
  hypothesis: Human XPA is dispensable for the core ERCC1-XPF incision step in ICL repair outside canonical NER intermediates.
