- term:
    id: GO:0003684
    label: damaged DNA binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000015717
  - SGD:S000004814
  - UniProtKB:P23025
  - UniProtKB:P27088
  review:
    summary: Accept damaged DNA binding as the lesion-verification molecular activity of XPA.
    action: ACCEPT
    reason: Human XPA is a zinc-containing NER factor that preferentially binds UV- or chemical-carcinogen-damaged DNA and recognizes kinked DNA repair intermediates; this damaged-DNA binding step, reinforced by RPA, is central to damage verification during nucleotide-excision repair.
    supported_by:
    - reference_id: PMID:16491090
      supporting_text: excision is crucially dependent on the assembly of XPA protein with a sharp bending angle in the DNA substrate
    - reference_id: PMID:7700386
      supporting_text: a complex of RPA and XPA showed a striking cooperativity in binding to DNA lesions
    - reference_id: file:interpro/panther/PTHR10142/PTHR10142-paint.tsv
