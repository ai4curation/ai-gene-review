id: O75712
gene_symbol: GJB3
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: GJB3 encodes connexin-31, a four-pass membrane protein and subunit of connexons that dock
  between adjacent cells to form gap junction channels. These channels support intercellular ion and small-solute
  transfer. Variants are associated with erythrokeratodermia and dominant hearing loss.
references:
- id: PMID:10587579
  title: Mutations in connexin31 underlie recessive as well as dominant non-syndromic hearing loss.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Authentic PubMed title, identifiers and complete abstract read. Two Chinese families
      with recessive hearing loss carry GJB3 variants affecting residue141; the abstract proposes altered
      pore structure rather than reporting a measured channel assay. Supports clinical and allelic context,
      not a new sensory-process or transport-selectivity assertion. Full original uninspected.
  full_text_unavailable: true
- id: PMID:10594760
  title: Identification of a novel mutation R42P in the gap junction protein beta-3 associated with autosomal
    dominant erythrokeratoderma variabilis.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Authentic PubMed title, identifiers and complete abstract read. Familial segregation
      associates GJB3 R42P with erythrokeratoderma variabilis. The proposed conformational and voltage-gating
      consequences are not an experimentally measured endpoint in the abstract. Its description of arginine
      as negatively charged is not adopted. Full original uninspected.
  full_text_unavailable: true
- id: PMID:10757647
  title: Connexin mutations associated with palmoplantar keratoderma and profound deafness in a single
    family.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Authentic PubMed title, identifiers and complete abstract read. The family carries GJB2
      D66H/M34T and GJB3 R32W; D66H segregates with the skin disease, while contributions of the other
      variants are presented cautiously. Does not establish GJB3 as the sole cause or demonstrate a channel
      mechanism. Full original uninspected. PubMed records republication as PMID:10888284; its content
      is uninspected, so no replacement or invalidation is asserted.
  full_text_unavailable: true
- id: PMID:10790215
  title: Identification of seven novel SNPS (five nucleotide and two amino acid substitutions) in the
    connexin31 (GJB3) gene.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Authentic PubMed title, identifiers and complete abstract read. Variant survey includes
      deafness, neuropathy and controls, with several substitutions occurring at similar frequencies across
      groups. Preserves allelic context without equating every observed variant with pathogenicity or
      inferring altered channel function. Full original uninspected.
  full_text_unavailable: true
- id: PMID:10798362
  title: The spectrum of mutations in erythrokeratodermias--novel and de novo mutations in GJB3.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Authentic PubMed title, identifiers and complete abstract read. EKV families and sporadic
      cases support GJB3 disease association and distinguish a segregating R42P allele from a carboxy-terminal
      deletion also found in unaffected relatives. Assembly/gating effects are hypotheses in this access
      scope. No direct differentiation activity is assigned from the clinical phenotype. Full original
      uninspected.
  full_text_unavailable: true
- id: PMID:14702039
  title: Complete sequencing and characterization of 21,243 full-length human cDNAs.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Authentic PubMed identity and full abstract checked against the retained official GJB3
      citation. Describes the FLJ human cDNA resource; supports sequence provenance. No GJB3-specific
      functional experiment or target clone table was independently inspected.
  full_text_unavailable: true
- id: PMID:15489334
  title: 'The status, quality, and expansion of the NIH full-length cDNA project: the Mammalian Gene Collection
    (MGC).'
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Authentic PubMed identity and full abstract checked against the retained official GJB3
      citation. Describes the MGC full-ORF resource, clone quality and possible experimental sequence
      variants. Used for sequence provenance only; no target clone table or functional assay is claimed
      from this abstract-level reading.
  full_text_unavailable: true
- id: PMID:16710414
  title: The DNA sequence and biological annotation of human chromosome 1.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Authentic PubMed identity and full abstract checked against the retained official GJB3
      citation. Human chromosome1 reference-sequence study provides genomic context. No GJB3-specific
      channel, expression or disease mechanism is inferred from the chromosome-wide account.
  full_text_unavailable: true
- id: PMID:19283857
  title: Connexin mutations in Brazilian patients with skin disorders with or without hearing loss.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Authentic PubMed title, identifiers and complete abstract read. Clinical study illustrates
      heterogeneity across connexin genes in Brazilian patients with skin disorders and/or hearing loss.
      The accessible abstract does not isolate a GJB3 experimental mechanism; broad tissue and differentiation
      discussion is not treated as a new direct process assay. Full original uninspected.
  full_text_unavailable: true
- id: PMID:32296183
  title: A reference map of the human binary protein interactome.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Authentic PubMed identity, selected original Methods and the authentic HuRI target table
      were inspected. Thirty-six source records represent twelve positive GJB3 pairs in three method-labelled
      projections, not three independent physiological replications. The target ORF2665 is partially sequence-identified;
      source Q8IXB3 versus incoming A5PKU2 remains unresolved. Dataset-level benchmarking is not claimed
      as target-specific orthogonal validation.
  full_text_unavailable: false
- id: PMID:33961781
  title: Dual proteome-scale networks reveal cell-specific remodeling of the human interactome.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Authentic PubMed identity, selected original clone/AP-MS/network Methods and the authentic
      BioPlex3 293T table were inspected. Line34725 supports GJB3–PCYOX1 copurification. C-terminal FLAG-HA
      bait affinity purification does not alone establish a direct binary interface, physiological enzyme
      regulation or replication of this pair in the separate HCT116 network.
  full_text_unavailable: false
- id: PMID:9704026
  title: 'Human gap junction protein connexin31: molecular cloning and expression analysis.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Authentic PubMed title, identifiers and complete abstract verified; original full text
      remained unavailable after bounded access attempts. Establishes the human270-residue coding product
      and expression in HaCaT and E6/E7-transfected human keratinocytes, not an assumed HEK293 host. Transcript
      lengths do not identify separate protein isoforms. Independent16549784 evidence supports current
      channel/junction assertions without alleging that unread portions of this paper lack assays.
  full_text_unavailable: true
- id: PMID:9843209
  title: Mutations in the human connexin gene GJB3 cause erythrokeratodermia variabilis.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Authentic PubMed title, identifiers and complete abstract read. Human EKV families carry
      GJB3 missense variants; dominant inhibitory effects and consequences for epidermal differentiation
      are proposed from genetic evidence. The abstract’s confusing GJA4/connexin parenthetical is not
      used to redefine current gene identity. No direct GJB3 differentiation mechanism or channel measurement
      is inferred from this access scope. Full original uninspected.
  full_text_unavailable: true
- id: PMID:9843210
  title: Mutations in the gene encoding gap junction protein beta-3 associated with autosomal dominant
    hearing impairment.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Authentic PubMed title, identifiers and complete abstract read. Human GJB3 variants
      are associated with hearing loss in two families, while inner-ear expression is explicitly measured
      in rat tissue by RT-PCR. These distinct observations support disease context, not a directly assayed
      human auditory-process function. Full original uninspected. An erratum is listed without a PMID;
      its content is uninspected and no corrected identifier is guessed.
  full_text_unavailable: true
- id: PMID:16549784
  title: Properties of human connexin 31, which is implicated in hereditary dermatological disease and
    deafness.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Main text/captions and identity verified; images and supplement uninspected.
  full_text_unavailable: false
- id: PMID:7889986
  title: Differential expression of the gap junction proteins connexin45, -43, -40, -31, and -26 in mouse
    skin.
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Authentic PubMed identity and complete abstract checked. Mouse Cx31 antibody/expression
      study underlying current MGI cytoplasm and cell-cell-junction IDA assertions. The abstract identifies
      mouse Cx31 coding DNA in a human HeLa host and mouse skin/cell-line expression; precise subcellular
      panels and full methods remain unavailable. This is donor context, not direct human GJB3 localization
      evidence.
- id: PMID:14595769
  title: 'Gap junctions in the inner ear: comparison of distribution patterns in different vertebrates
    and assessement of connexin composition in mammals.'
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Authentic PubMed identity and complete abstract checked. Comparative vertebrate inner-ear
      study identifies Cx31 in cochlear type 2 fibrocytes and underlies a current mouse gap-junction IDA.
      Full article uninspected. The separately described Cx26/Cx30 co-IP and heteromeric-complex result
      is not evidence for a Cx31 mixed connexon.
- id: Reactome:R-HSA-190861
  title: Gap junction assembly
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Actual pathway summary and nested generic synthesis chain read. Human O75712 residues1–270
      occurs as a candidate protein product in the connexin ER set. General synthesis, trafficking and
      assembly descriptions include other connexins and are not direct GJB3 assays. Product/cargo roles
      do not establish that GJB3 catalyzes its own synthesis or transport.
- id: Reactome:R-HSA-9725554
  title: Differentiation of Keratinocytes in Interfollicular Epidermis in Mammalian Skin
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Actual lineage summary, four step input/output/regulation lists and target-bearing granular-cell
      marker chain read. GJB3 O75712 residues1–270 is a protein marker of granular keratinocytes; the
      database describes human plasma-membrane puncta and cites11676838, whose original was not inspected
      here. Marker expression does not demonstrate GJB3 performing the differentiation step.
- id: UniProtKB:A5PKU2
  title: TUSC5 protein
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Unreviewed TUSC5 entry and its current sequence were inspected. It differs from the
      HuRI Q8IXB3 source product at four residues; shared nomenclature does not establish complete historical
      clone equivalence.
- id: UniProtKB:O43561
  title: Linker for activation of T-cells family member 1
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Reviewed LAT signaling-adaptor and alternative-product records inspected. The incoming
      and source O43561-2 suffix is retained; its receptor-signaling role does not establish a GJB3 adaptor
      mechanism.
- id: UniProtKB:O43934
  title: UNC93-like protein MFSD11
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: 'Reviewed MFSD11 family and caution inspected: UNC93-related, despite the major-facilitator
      name. The source product is O43934-1; a GJB3 transporter-regulatory function is not inferred.'
- id: UniProtKB:O75712
  title: Gap junction beta-3 protein
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Official human identity, canonical 270-residue sequence, topology, location, family
      and disease accounts inspected. General connexon stoichiometry in the subunit account is an inference,
      not a newly verified target stoichiometry experiment.
- id: UniProtKB:P21964
  title: Catechol O-methyltransferase
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Reviewed COMT catalytic and alternative-initiation account inspected. Source P21964-1
      is retained; COMT catalysis alone does not make GJB3 an informative enzyme-binding factor.
- id: UniProtKB:P24593
  title: Insulin-like growth factor-binding protein 5
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Reviewed IGFBP5 growth-factor availability account inspected. This partner record is
      distinct from the HuRI pair evidence and does not assign growth-factor regulation to GJB3.
- id: UniProtKB:Q5BJF2
  title: Sigma intracellular receptor 2
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Reviewed TMEM97 receptor/sterol-trafficking account and historical PGRMC1 naming caution
      inspected. No GJB3 sterol sensing or receptor-regulatory role follows from the pair.
- id: UniProtKB:Q71RG4
  title: Transmembrane and ubiquitin-like domain-containing protein 2
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Reviewed TMUB2 identity and alternative products inspected; no FUNCTION comment was
      present. Source Q71RG4-2 is retained without interpreting the ubiquitin-like domain as a demonstrated
      GJB3 regulatory interaction.
- id: UniProtKB:Q8IXB3
  title: Trafficking regulator of GLUT4 1
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Reviewed TRARG1 entry, TUSC5 synonym and current sequence inspected. Its trafficking
      function is supported by similarity; neither that annotation nor its shared synonym repairs the
      four-residue A5PKU2/source-product discrepancy.
- id: UniProtKB:Q8TAF8
  title: LHFPL tetraspan subfamily member 5 protein
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Reviewed LHFPL5 mechanotransduction-complex account inspected; its functional paragraph
      is supported by similarity. This does not demonstrate a GJB3 mechanotransduction role.
- id: UniProtKB:Q8WVV5
  title: Butyrophilin subfamily 2 member A2
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Reviewed BTN2A2 immune-inhibitory account and alternative products inspected. Source
      Q8WVV5-1 is retained; the partner function does not establish immune regulation by GJB3.
- id: UniProtKB:Q96F15
  title: GTPase IMAP family member 5
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Reviewed GIMAP5 functional, family and product account inspected, with experimental
      and similarity evidence distinguished. Source Q96F15-1 does not establish a GJB3 GTPase-regulatory
      role.
- id: UniProtKB:Q9NS64
  title: Protein reprimo
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Reviewed RPRM account inspected; its proposed cell-cycle role is stated by similarity
      and with uncertainty. No GJB3 cell-cycle function is transferred.
- id: UniProtKB:Q9UHG3
  title: Prenylcysteine oxidase 1
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Reviewed PCYOX1 catalytic, alternative-product and historical lyase-naming caution inspected.
      Independent partner chemistry does not demonstrate a useful GJB3 enzyme-binding function from AP-MS
      association alone.
- id: UniProtKB:Q9Y6X1
  title: Stress-associated endoplasmic reticulum protein 1
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Reviewed SERP1 ER stress/protein-translocation account inspected with similarity evidence
      retained. The pair does not demonstrate GJB3 chaperone regulation.
- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO terms
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Incoming InterPro mapping and the actual human target family membership were inspected.
      The mapping is assessed against the current asserted function; no global InterPro rule regeneration
      was performed.
- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Actual PTHR11984 tree, alignment, leaf sequence and three IBD assertions place O75712
      beneath the cited ancestor. Literal donor sets and experimental grounding are retained; donor count
      and target self-donation are not treated as weaknesses.
- id: GO_REF:0000044
  title: Gene Ontology annotation based on UniProtKB subcellular location vocabulary mapping
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The actual UniProt subcellular-location vocabulary mappings were assessed with target
      localization and the independently retained donor evidence. The incoming assertion remains gene-level.
- id: GO_REF:0000052
  title: Gene Ontology annotation based on curation of immunofluorescence data
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Actual HPA target metadata identifies cell-junction staining in A431 and vesicle/cell-junction
      staining in HaCaT with antibody HPA074472. Image pixels and ultrastructure were not inspected.
- id: GO_REF:0000107
  title: Automatic transfer of experimentally verified manual GO annotation data to orthologs using Ensembl
    Compara
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Current Ensembl transfer rows were traced to literal mouse donor assertions and authentic
      donor abstracts. Human function is assessed separately; a human host cell does not change the donor
      construct species.
- id: GO_REF:0000108
  title: Automatic assignment of GO terms using logical inference, based on on inter-ontology links
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The logical inference and actual GO ancestor paths were inspected. A channel performs
      transport directly, rather than merely being required for a downstream outcome.
- id: GO_REF:0000120
  title: Combined Automated Annotation using Multiple IEA Methods
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The combined electronic mapping is evaluated using the actual incoming provenance and
      independent target evidence. Individual ARBA/InterPro branches were not all re-executed.
- id: file:human/GJB3/GJB3-external-evidence.md
