id: P81172
gene_symbol: HAMP
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: HAMP encodes the secreted hepcidin precursor, whose mature 25-residue peptide is a major
  endocrine regulator of iron absorption and distribution. Hepcidin binds the cell-surface iron exporter
  ferroportin (SLC40A1), directly inhibits its transport pathway and promotes ubiquitination-dependent
  internalization and degradation. This limits iron delivery to plasma from intestinal enterocytes, iron-recycling
  macrophages and tissue stores while increasing iron retention in exporting cells. The disulfide-rich
  precursor also yields shorter processed peptides, including hepcidin-20; synthetic N-terminal truncation
  strongly reduces ferroportin-regulatory activity. Human hepcidins have antibacterial and antifungal
  activity in vitro. Biallelic HAMP loss of function causes juvenile hemochromatosis.
