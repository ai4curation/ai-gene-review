core_functions:
- description: Acts as a circulating iron-regulatory hormone by binding and inhibiting ferroportin, directly
    occluding iron efflux and promoting ferroportin internalization and lysosomal degradation. This extracellular
    signaling activity controls cellular iron retention and whole-body iron availability, including intestinal
    delivery of dietary iron.
