    residues: 60-84
  description: Mature 25-residue endocrine peptide that binds ferroportin, directly inhibits iron export
    and promotes ubiquitination-dependent internalization and lysosomal degradation (PMID:29237594, PMID:32814342,
    PMID:22682227).
- id: HAMP_HEPCIDIN_20
  name: Hepcidin-20
  type: CLEAVAGE_PRODUCT
  maps_to:
  - type: UNIPROT_CHAIN
    ids:
    - PRO_0000013380
    residues: 65-84
  description: Naturally processed, N-terminally truncated peptide identified in human urine (PMID:11113131).
    Synthetic removal of hepcidin-25's first five residues abolished ferroportin-regulatory activity in
    the tested cell and mouse assays (PMID:16141345); the physiological contribution of endogenous hepcidin-20
    to antimicrobial defense remains unresolved.
