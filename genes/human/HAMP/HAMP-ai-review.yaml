- term:
    id: GO:0032436
    label: positive regulation of proteasomal ubiquitin-dependent protein catabolic process
  evidence_type: IDA
  original_reference_id: PMID:37277838
  qualifier: involved_in
  review:
    summary: The cited mechanism is ubiquitination-linked internalization and lysosomal, rather than proteasomal,
      degradation.
    action: MODIFY
    reason: The full text of PMID:37277838 explicitly describes lysosomal degradation of internalized
      ferroportin and uses PYR-41 inhibition of ubiquitination in the trafficking experiments. Ubiquitination
      does not by itself establish proteasomal destruction. GO:0032436 explicitly requires proteasome-mediated
      catabolism, whereas GO:1905167 matches promotion of the documented lysosomal route. PMID:22682227
      independently establishes ubiquitination as the signal for hepcidin-induced ferroportin endocytosis.
      This refinement preserves the regulatory role of hepcidin and does not assign protease activity
      to the peptide.
    supported_by:
    - reference_id: PMID:37277838
      supporting_text: thus signaling for its internalization and lysosomal degradation.
    - reference_id: PMID:22682227
      supporting_text: Our study demonstrates that ubiquitination is the functionally relevant signal
        for hepcidin-induced ferroportin endocytosis.
    proposed_replacement_terms:
    - id: GO:1905167
      label: positive regulation of lysosomal protein catabolic process
