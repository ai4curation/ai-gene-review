knowledge_gaps:
- gap_statement: The reviewed experiments do not establish the contribution of hepcidin-20 to antimicrobial
    defense at physiological human peptide concentrations and ionic conditions.
  boundary: Processed human hepcidins show antimicrobial activity in vitro (PMID:11113131). Synthetic
    removal of the five N-terminal residues abolishes ferroportin-regulatory activity in the tested cell
    and mouse assays (PMID:16141345), distinguishing that result from a demonstrated physiological human
    antimicrobial role.
  gap_kind:
  - BIOLOGY
  resolution: Compare authentic processed hepcidin-20 and hepcidin-25 in human extracellular fluids at
    measured physiological concentrations, separating direct microbial effects from iron sequestration.
  provenance:
  - reference_id: PMID:11113131
    supporting_text: antibacterial activity against Escherichia coli, Staphylococcus aureus, Staphylococcus
      epidermidis, and group B Streptococcus.
  - reference_id: PMID:16141345
    supporting_text: activity which was completely lost when 5 N-terminal aa's were deleted.
suggested_questions:
- question: Does the full experimental context of the mouse Hamp GO:0000122 annotation support a specific
    hepcidin-mediated transcription-regulatory function, or an indirect consequence of changed iron balance?
- question: Which physiological human contexts support antimicrobial effects of the naturally processed
    hepcidin-20 peptide independently of endocrine ferroportin regulation?
