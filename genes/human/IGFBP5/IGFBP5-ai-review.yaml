- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:15700281
  qualifier: enables
  supporting_entities:
  - UniProtKB:P07996
  review:
    summary: IGFBP-5 binds thrombospondin-1 (TS-1) with high affinity in smooth muscle cell ECM; binding
      blocks TS-1 association with integrin-associated protein (IAP/CD47) and attenuates TS-1 enhancement
      of IGF-I responses.
    action: REMOVE
    reason: The interaction is real and functionally meaningful, but GO has no 'thrombospondin binding'
      term (checked OLS) and generic protein binding is uninformative. The functional consequence is already
      captured by the process annotations from the same paper (negative regulation of cell migration).
      Suggest a new MF term or GO-CAM modelling (see suggested_questions) rather than retaining GO:0005515.
    supported_by:
    - &id011
      reference_id: PMID:15700281
      supporting_text: IGFBP-5 inhibits the binding of TS-1 to IAP, and this results in an alteration
        of the ability of TS-1 to modulate the disruption of the IAP/SHPS-1 interaction
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:25910212
  qualifier: enables
  supporting_entities:
  - UniProtKB:O43889-2
  review:
    summary: Yeast two-hybrid interaction with a CREB3 isoform (O43889-2) from a large-scale variant-perturbation
      interactome screen.
    action: REMOVE
    reason: Generic protein binding from a high-throughput Y2H screen. CREB3 is an ER-membrane-anchored
      transcription factor; there is no evidence that secreted IGFBP5 engages it physiologically, and
      no informative molecular function can be derived. Removal reflects lack of information content,
      not refutation of the binary interaction.
    supported_by:
    - reference_id: PMID:25910212
      supporting_text: Widespread macromolecular interaction perturbations in human genetic disorders.
