- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:32296183
  qualifier: enables
  supporting_entities:
  - UniProtKB:O15393-2
  review: &id004
    summary: High-throughput binary yeast two-hybrid interactome (HuRI) interaction reported as generic
      protein binding.
    action: REMOVE
    reason: GO:0005515 protein binding conveys no functional information. The HuRI partners of IGFBP5
      are overwhelmingly multipass membrane proteins (claudins, connexins, aquaporins, GPCRs, SLC transporters,
      TMEM proteins), which a secreted ECM/plasma IGF carrier is unlikely to engage physiologically; no
      informative MF can be derived from a single Y2H readout. Removal does not assert that the reported
      interaction is false, only that the generic annotation is uninformative.
    supported_by:
    - reference_id: PMID:32296183
      supporting_text: A reference map of the human binary protein interactome.
