id: P24593
gene_symbol: IGFBP5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: IGFBP5 encodes a secreted, highly conserved insulin-like growth factor binding protein that
  binds IGF-I and IGF-II with nanomolar affinity through a single N-terminal binding site. In the circulation
  it carries IGFs in binary complexes and in ternary complexes with the acid-labile subunit; in tissues
  its basic C-terminal region tethers it to extracellular matrix components (fibronectin, collagens, laminin),
  where it is protected from proteolysis and concentrates IGFs. By competing with IGF1R it inhibits IGF
  signalling (including as a secreted effector of mTORC1-driven feedback), while ECM-bound IGFBP5 can
  potentiate IGF action; proteolysis by PAPP-A/PAPP-A2 and C1s releases bound IGF. IGFBP5 also has IGF-independent
  activities, including promotion of ECM production in fibrotic fibroblasts, thrombospondin-1 binding,
  a reported ligand activity toward ROR1, and internalization and nuclear translocation via caveolin-1
  and nucleolin. Igfbp5 knockout mice have little phenotype owing to redundancy with other IGFBPs, whereas
  overexpression inhibits growth, bone accrual and muscle development.
existing_annotations:
- term:
    id: GO:0001649
    label: osteoblast differentiation
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q07079
  - ensembl:ENSMUSP00000027377
  review:
    summary: Ensembl Compara transfer from mouse Igfbp5, whose source annotation is an expression-pattern
      (IEP) observation during osteoblast differentiation.
    action: MARK_AS_OVER_ANNOTATED
    reason: IGFBP5 is expressed by and modulates osteoblasts (overexpression reduces bone mineral density
      and osteoblast function), but it acts as a secreted modulator of IGF availability rather than as
      a component executing the osteoblast differentiation program. An expression-based source does not
      establish participation.
    supported_by:
    - reference_id: PMID:15550514
      supporting_text: IGFBP-5 has a significant influence on BMD acquisition and maintenance that is
        dependent on gender and age.
    - reference_id: file:human/IGFBP5/IGFBP5-uniprot.txt
      supporting_text: Acts itself as a growth factor that can act independently of IGFs to regulate bone
        formation.
- term:
    id: GO:0001968
    label: fibronectin binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - MGI:MGI:96440
  - PANTHER:PTN002610775
  review:
    summary: IGFBP5 binds fibronectin and other ECM components (collagens III/IV, laminin) through its
      basic C-terminal region, which retains it in the ECM.
    action: ACCEPT
    reason: Direct binding of purified IGFBP-5 to fibronectin was shown for the human protein, and ECM
      retention is a defining feature distinguishing IGFBP-5 from IGFBP-3/-4. The IBA/IEA are consistent
      with this. ECM association protects IGFBP-5 from proteolysis and modulates IGF delivery.
    supported_by:
    - &id001
      reference_id: PMID:7683690
      supporting_text: IGFBP-5 was found to bind to types III and IV collagen, laminin, and fibronectin.
    - &id002
      reference_id: PMID:7683690
      supporting_text: IGFBP-5 is present in fibroblast ECM, where it is protected from degradation and
        can potentiate the biologic actions of IGF-I.
    - &id003
      reference_id: PMID:20345844
      supporting_text: IGFBP-5 in the ECM protects fibronectin from proteolytic degradation.
