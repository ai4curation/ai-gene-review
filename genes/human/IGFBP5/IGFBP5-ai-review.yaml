- id: file:human/IGFBP5/IGFBP5-deep-research-falcon.md
  title: Falcon deep research report for human IGFBP5
  findings:
  - statement: IGFBP5 is a secreted IGF-I/IGF-II binding regulator controlling IGF access to IGF1R, not an enzyme or
      receptor; soluble versus ECM-bound/proteolysed states inhibit or potentiate IGF action respectively.
    supporting_text: 'IGFBP-5 is a secreted ligand-binding regulator—not an enzyme or an IGF receptor.'
  - statement: The IGFBP5 profibrotic response in human fibroblasts is IGF-independent and does not require nuclear
      entry.
    supporting_text: 'These controlled experiments show that the tested profibrotic response **does not require IGF binding, nuclear entry or stable ECM association by IGFBP-5**.'
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: Generated late (after the review was drafted). Consistent with the review; no claims contradict
      existing actions. Key primary claims (Kalus 1998 PMID:9822601, Jones 1993 PMID:7683690, Su 2015 PMID:26103640)
      were already cited and verified in the review.
core_functions:
- description: Secreted high-affinity IGF-I/IGF-II binding protein that sequesters IGFs from IGF1R and
    forms binary and ALS-containing ternary complexes, thereby (mainly negatively) regulating IGF receptor
    signaling, including as an mTORC1-induced feedback inhibitor.
  molecular_function:
    id: GO:0005520
    label: insulin-like growth factor binding
  directly_involved_in:
  - id: GO:0043569
    label: negative regulation of insulin-like growth factor receptor signaling pathway
  locations:
  - id: GO:0005576
    label: extracellular region
  in_complex:
    id: GO:0042567
    label: insulin-like growth factor ternary complex
  supported_by:
  - reference_id: PMID:9822601
    supporting_text: IGFBP-5 inhibits the binding of IGFs to the IGF-I receptor, resulting in reduction
      of receptor stimulation and autophosphorylation.
  - reference_id: PMID:9497324
    supporting_text: human IGFBP-5, when occupied by IGF-I or IGF-II, forms ternary complexes of approximately
      130 kDa with the acid-labile subunit.
  - reference_id: PMID:26854565
    supporting_text: IGFBP5 is a potent inhibitor of both the signalling and functional outputs of IGF-1.
- description: Binding to extracellular matrix components (fibronectin, collagens, laminin) that retains
    IGFBP5 in the matrix, protects it from proteolysis and allows matrix-bound IGFBP5 to concentrate and
    potentiate IGF-I action.
  molecular_function:
    id: GO:0001968
    label: fibronectin binding
  directly_involved_in:
  - id: GO:0043567
    label: regulation of insulin-like growth factor receptor signaling pathway
  locations:
  - id: GO:0140149
    label: non-collagenous component of interstitial matrix
  supported_by:
  - reference_id: PMID:7683690
    supporting_text: IGFBP-5 was found to bind to types III and IV collagen, laminin, and fibronectin.
  - reference_id: PMID:7683690
    supporting_text: IGFBP-5 is present in fibroblast ECM, where it is protected from degradation and
      can potentiate the biologic actions of IGF-I.
  - reference_id: PMID:20345844
    supporting_text: IGFBP-5 in the ECM protects fibronectin from proteolytic degradation.
proposed_new_terms: []
suggested_questions:
- question: Should GO provide a 'thrombospondin binding' molecular function term (or should the IGFBP-5/TSP-1
    interaction be captured in GO-CAM) so that the functionally characterized IGFBP-5-TSP-1 interaction
    is not left as generic protein binding?
- question: Is IGFBP5 a physiological ROR1 ligand outside glioblastoma stem-like cells, and what is the
    binding affinity relative to Wnt5a?
- question: What is the receptor or mechanism for the IGF-independent profibrotic (ECM-inducing) activity
    of IGFBP5, given that it does not require IGF binding or nuclear translocation?
- question: Does the nuclear pool of IGFBP5 (imported via caveolin-1 and nucleolin) have a transcriptional
    or other nuclear function in normal physiology?
suggested_experiments:
- description: Surface plasmon resonance / BLI of purified IGFBP5 with ROR1 extracellular domain, with
    IGF-binding-deficient and heparin-binding-domain mutants, to define affinity and binding determinants
    of the putative ligand activity.
  experiment_type: biochemical binding assay
- description: Fibroblast-specific Igfbp5 knockout (or knock-in of an IGF-binding-deficient allele) in
    a bleomycin lung or skin fibrosis model to separate IGF-dependent and IGF-independent profibrotic
    actions in vivo.
  experiment_type: conditional knockout mouse model
