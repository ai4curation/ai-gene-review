      contamination by PMID:38683723, which studies Arabidopsis thaliana ABI1 (ABA INSENSITIVE 1, a clade
      A PP2C phosphatase in stomatal ABA signaling) rather than human ABI1/PTHR10460; (2) domain inversion
      in the summary sentence stating ''an N-terminal WAVE-binding domain of WAVE1'' whereas the WAB domain
      resides on ABI1 (PMID:15143189); (3) unflagged isoform coordinate Y398 from PMID:21320496, which
      maps to Tyr455 in the SH3 domain of canonical Q8IZP0-1 (508 aa), plus a publication-year typo (2012
      instead of 2022 for PMID:35198891) and non-human worm/Xenopus rows presented in a human table; and
      (4) coarse goslim_generic GO grounding (GO:0060090, GO:0098772, GO:0140110) that was not imported.'
