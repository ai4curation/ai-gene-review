id: Q8IZP0
gene_symbol: ABI1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Abl interactor 1 (ABI1, also known as E3B1 or Hssh3bp1) is a multidomain signaling adaptor
  protein and core structural subunit of the heteropentameric WAVE regulatory complex (WRC; WAVE1/2/3,
  ABI1/2/3, NCKAP1/NCKAP1L, CYFIP1/2, and BRK1) that couples Rac GTPase, phospholipid, and tyrosine kinase
  signals to Arp2/3-mediated branched actin filament nucleation at lamellipodia and filopodia tips. Its
  conserved N-terminal WAVE-binding (WAB) coiled-coil region assembles the WAVE:ABI:BRK1 trimer and stabilizes
  WRC subunits in the cytosol, whereas its central proline-rich/PxxDY region and C-terminal SH3 domain
  bridge non-receptor tyrosine kinases (ABL1, ABL2), Ena/VASP proteins, N-WASP, spectrin, TOCA-1, and
  the EPS8-ABI1-SOS1-PI3K(p85) Rac-GEF complex. ABI1 both promotes c-Abl-dependent phosphorylation of
  WAVE2 and ENAH/Mena via its linker-SH3 region and allosterically restrains nonmyristoylated c-Abl in
  trans via phospho-Tyr213 and a proximal PXXP motif, while phosphorylation at Ser88, Tyr213, and Ser216
  and PTEN-dependent dephosphorylation gate WRC stability, endocytosis, macropinocytosis, and postsynaptic
  spine maturation.
