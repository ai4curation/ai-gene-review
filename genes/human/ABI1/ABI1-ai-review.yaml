  review:
    summary: IBA annotation from Eumetazoa node PTN000825624 seeded by mouse Abi2 and C. elegans abi-1.
    action: KEEP_AS_NON_CORE
    reason: ABI family members participate in neuronal migration via WAVE regulatory complex (WRC)-dependent
      actin remodeling, established genetically for mouse Abi2 (PMID:15572692) and C. elegans abi-1 (PMID:19168673).
      Because neuronal migration is a downstream tissue-specific developmental outcome of core WRC adaptor
      activity, it is retained as non-core.
    supported_by:
    - reference_id: PMID:15572692
      supporting_text: Loss of Abi2 also resulted in cell migration defects in the neocortex and hippocampus,
        abnormal dendritic spine morphology and density, and severe deficits in short- and long-term memory.
    - reference_id: PMID:19168673
      supporting_text: ABI-1 and UNC-53 have an overlapping expression pattern, and display similar cell
        migration phenotypes in the excretory cell, and in mechanosensory and motoneurons.
