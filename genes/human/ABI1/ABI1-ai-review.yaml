suggested_questions:
- question: How is cellular ABI1 partitioned dynamically between the heteropentameric WRC, the EPS8-ABI1-SOS1
    Rac-GEF complex, and N-WASP endocytic assemblies within the same cell?
- question: Under what physiological stimuli does ABI1 switch between linker/SH3-mediated c-Abl substrate
    co-activation and pY213/PXXP-mediated trans-autoinhibition of nonmyristoylated c-Abl?
- question: How does alternative splicing of exon 10 remodel Rac1 engagement on intact human ABI1-containing
    WAVE regulatory complexes structurally?
suggested_experiments:
- description: Quantitative endogenous SEC-MS and cross-linking MS in resting versus EGF/PDGF-stimulated
    human cells to measure stoichiometric partitioning of ABI1 across WRC, EPS8-SOS1, and N-WASP complexes.
- description: Cryo-EM reconstruction of full-length human ABI1-WRC bound to c-Abl SH3-SH2-kinase module
    to resolve simultaneous substrate presentation and pY213 allosteric regulation.
- description: Isogenic CRISPR splice-switching of ABI1 exon 10 in human epithelial and myeloid cells
    paired with live-cell Rac1-FRET, lamellipodial kymography, and dextran macropinocytosis assays.
