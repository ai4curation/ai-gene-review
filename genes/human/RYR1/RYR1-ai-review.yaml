- term:
    id: GO:0042383
    label: sarcolemma
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - MGI:MGI:99659
  - PANTHER:PTN000346461
  - RGD:1586637
  - RGD:620314
  review:
    summary: sarcolemma overextends the reviewed RYR1 evidence.
    action: MARK_AS_OVER_ANNOTATED
    reason: The PAINT sarcolemma row projects a mature striated-muscle surface compartment from the same ancestral node
      that contains SR-membrane RYR pores. Direct human myotube evidence supports an immature plasma-membrane RYR1
      pattern and is kept on the GO:0005938 cell cortex row, but it does not rescue a conserved sarcolemma IBA assertion for the
      channel whose core pore is in the junctional sarcoplasmic reticulum.
