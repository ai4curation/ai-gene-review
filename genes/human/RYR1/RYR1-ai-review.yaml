- term:
    id: GO:0048763
    label: calcium-induced calcium release activity
  evidence_type: IMP
  original_reference_id: PMID:26115329
  qualifier: enables
  review:
    summary: calcium-induced calcium release is a real but secondary RYR1 gating mode in skeletal muscle.
    action: KEEP_AS_NON_CORE
    reason: Ca2+ can allosterically activate RYR1, but physiological skeletal-muscle excitation-contraction coupling is
      dominated by depolarization-induced activation through DHPR/Cav1.1; calcium-induced calcium release is therefore
      a supported regulatory mode rather than the core RYR1 execution step in mature skeletal muscle.
    supported_by:
    - reference_id: PMID:26115329
      supporting_text: The channel is also activated by Ca2+, i.e., Ca2+-induced Ca2+ release (CICR) [6, 7], although the
        rate of Ca2+ release via CICR is reported to be much lower than that via DICR under physiological conditions
