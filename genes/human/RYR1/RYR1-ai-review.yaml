- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: IDA
  original_reference_id: PMID:11206130
  qualifier: located_in
  review:
    summary: plasma membrane marks a developmental, immature human myotube RYR1 localization.
    action: MARK_AS_OVER_ANNOTATED
    reason: Tanaka et al. observed RyR and DHPR colocalization at peripheral junctions of developing human myotubes, but
      that evidence places RYR1 in subsarcolemmal junctional SR apposed to the surface membrane rather than in the
      plasma membrane itself.
    supported_by:
    - reference_id: PMID:11206130
      supporting_text: In innervated muscle fibers, alpha1S-DHPR and RyR were colocalized first along the plasma
        membrane and later in the cytoplasmic area and formed regular double rows of cross-striation.
