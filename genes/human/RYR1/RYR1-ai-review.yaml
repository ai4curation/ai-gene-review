- term:
    id: GO:0005245
    label: voltage-gated calcium channel activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: enables
  supporting_entities:
  - UniProtKB:E9PZQ0
  - ensembl:ENSMUSP00000137123
  review:
    summary: voltage-gated calcium channel activity misstates RYR1 gating by the Cav1.1 voltage sensor.
    action: REMOVE
    reason: The electronic mouse-derived row appears to conflate RYR1's activation by the voltage-sensing DHPR/Cav1.1
      channel in the T-tubule membrane with voltage-gated channel activity by RYR1 itself. RYR1 is the
      sarcoplasmic-reticulum Ca2+-release pore that opens after the DHPR conformational change; it is not itself the
      voltage sensor.
    supported_by:
    - reference_id: PMID:26115329
      supporting_text: RyR1 is activated by a conformational change of the voltage sensor in the dihydropyridine receptor
        (DHPR) upon depolarization of the T-tubule membrane
