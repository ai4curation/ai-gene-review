id: P21817
gene_symbol: RYR1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: RYR1 encodes the skeletal-muscle ryanodine receptor, a homotetrameric calcium-release channel in the
  junctional sarcoplasmic-reticulum membrane. Depolarization of the transverse tubule activates RYR1 through its
  coupling to the Cav1.1 voltage sensor, opening the channel and releasing stored Ca2+ into the cytosol to trigger
  skeletal-muscle contraction.
