suggested_questions:
- question: Which propagated non-muscle or developmental RYR1 GO annotations represent direct channel functions rather
    than downstream calcium phenotypes?
suggested_experiments:
- description: Introduce paralog-selective endogenous tags or channel-dead alleles in human cell models expressing RYR1
    and assay SR Ca2+ release, subcellular junctions and caffeine/ATP/calmodulin responses side by side.
