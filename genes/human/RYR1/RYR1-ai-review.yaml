      supporting_text: 'SUBCELLULAR LOCATION: Sarcoplasmic reticulum membrane'
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN000346461
        source_label: PTHR46399 PAINT node
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: The PAINT node covers the conserved RYR channel clade, but its sarcolemma placement is unsafe for
          reviewed human RYR1, whose channel pore is in sarcoplasmic-reticulum membrane.
