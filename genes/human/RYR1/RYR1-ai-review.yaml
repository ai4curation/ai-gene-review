core_functions:
- description: RYR1 encodes the skeletal-muscle ryanodine receptor, a homotetrameric calcium-release channel in the
    junctional sarcoplasmic-reticulum membrane that is activated by Cav1.1/DHPR-mediated T-tubule depolarization in
    skeletal-muscle excitation-contraction coupling.
  molecular_function:
    id: GO:0005219
    label: ryanodine-sensitive calcium-release channel activity
  directly_involved_in:
  - id: GO:0014808
    label: release of sequestered calcium ion into cytosol by sarcoplasmic reticulum
  locations:
  - id: GO:0014701
    label: junctional sarcoplasmic reticulum membrane
  - id: GO:0014802
    label: terminal cisterna
  in_complex:
    id: GO:1990425
    label: ryanodine receptor complex
  supported_by:
  - reference_id: file:human/RYR1/RYR1-uniprot.txt
    record_section:
    - CC:FUNCTION
    supporting_text: release of Ca(2+) from the sarcoplasmic reticulum into the cytosol and thereby plays a key role in
      triggering muscle contraction
  - reference_id: file:human/RYR1/RYR1-uniprot.txt
