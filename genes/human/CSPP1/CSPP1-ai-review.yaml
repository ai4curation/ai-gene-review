  description: The 1,221-aa long product is directly tested in modern microtubule reconstitution
    and in human CSPP-L-selective cytokinesis experiments. It suppresses shrinkage and catastrophe
    and induces microtubule pauses. The 1,256-aa displayed product differs by an internal 35-residue
    segment and is not assumed experimentally equivalent.
- id: CSPP1_SHORT
  name: Short CSPP-S
  type: SPLICE_VARIANT
  maps_to:
  - type: UNIPROT_ISOFORM
    ids:
    - Q1MSJ5-2
  description: 'The 876-aa short product is directly compared with CSPP-L in the 2023 study:
    it binds microtubules but has weaker shrinkage suppression and differs in pausing and outgrowth
    behavior. Two existing binary-screen annotations explicitly identify this product. These
    observations do not establish that all binding partners or cellular roles are unique to
    it.'
suggested_questions:
- question: Can the parent definition of GO:0140778 be clarified so that microtubule stabilization
    need not imply exclusion of a destabilizing protein? CSPP1 permits MCAK binding, and the
    term-defining SSNA1 study likewise permits spastin binding while blocking disassembly.
- question: How do the displayed 1,256-aa product and the experimentally established 1,221-aa
    long and 876-aa short products differ in endogenous expression, microtubule stabilization
    and ciliary versus mitotic functions?
- question: Which native molecular contacts organize the CSPP1–CEP104–CCDC66–ARMC9–TOGARAM1
    associations, and is CSPP1 self-association required for its microtubule-stabilizing activity?
- question: Can the original PMID:21399614 target-level supplementary evidence be made accessible
    to verify the precise CSPP1 centrosome identification route?
suggested_experiments:
- description: Compare sequence-verified 1,256-, 1,221- and 876-residue products at matched
    low expression and purified concentrations. Measure catastrophe, shrinkage, pausing and
    regrowth separately, and complement endogenous depletion in ciliated and mitotic human cells.
    This distinguishes product effects from overexpression and cell-state dependence.
status: DRAFT
