      full-length 1221-aa CSPP1 experiments in PMID:38389254 demonstrate catastrophe suppression
      and resistance to MCAK-mediated depolymerization, with additional cellular depletion support.
      This is a directly performed molecular activity absent from the 25 seeded source rows.
      The tested long isoform is recorded; the 1256-aa displayed product is not claimed equivalent.
      CSPP1 does not exclude MCAK binding. The stabilizer term is appropriate despite the parent
      definition wording: its own defining SSNA1 paper likewise reports stabilization while
      permitting the destabilizing enzyme to remain bound. No redundant binding or NEW process
      term is added. PMID:39856351 additionally measures reduced growth, pausing and regrowth
      with CSPP1, and cooperative regulation with other ciliary tip proteins. Those tagged-protein
      experiments use porcine brain tubulin and mouse TOGARAM1 among otherwise human module
      proteins; they do not establish identical behavior of every official CSPP1 product or
      directly reconstitute human axonemes.'
