id: Q1MSJ5
gene_symbol: CSPP1
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CSPP1 is a microtubule-associated protein that stabilizes microtubule ends and
  damaged lattices. The long CSPP-L product can act within the microtubule lumen, suppressing
  catastrophe and shrinkage and promoting pauses followed by renewed growth. CSPP1 occupies
  centrosomes, spindle poles, the central spindle and primary cilia in defined cellular contexts.
  It associates with ciliary microtubule regulators and promotes MyoGEF recruitment during cytokinesis.
  Biallelic loss-of-function variants cause Joubert-spectrum ciliopathy. The long and short
  products differ in their effects on microtubule dynamics.
