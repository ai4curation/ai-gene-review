core_functions:
- description: Binds and stabilizes microtubule ends and damaged lattices, limiting catastrophe
    and depolymerization and promoting pauses followed by regrowth. Reconstitution establishes
    luminal action of CSPP-L, while cellular experiments support control of microtubule-end
    dynamics. CSPP-L also localizes to primary cilia in human cells; the purified singlet-microtubule
    assays establish activity without directly reconstituting human axonemes.
  molecular_function:
    id: GO:0140778
    label: microtubule stabilizing activity
  locations:
  - id: GO:0005874
    label: microtubule
  - id: GO:0005929
    label: cilium
  supported_by:
  - reference_id: PMID:36752787
    supporting_text: prevents their shrinkage, and induces pausing
  - reference_id: PMID:38389254
    supporting_text: complete suppression of MT catastrophe
  - reference_id: PMID:39856351
- description: Promotes cytokinesis through recruitment or organization of MyoGEF at the central
    spindle in the tested human CSPP-L context. Depletion disrupts MyoGEF localization and produces
    furrow regression despite largely preserved central-spindle formation. This role does not
    establish CSPP1 as a guanine nucleotide exchange factor or show that its luminal stabilization
    activity causes MyoGEF recruitment.
  directly_involved_in:
  - id: GO:0032467
    label: positive regulation of cytokinesis
  locations:
  - id: GO:0005819
    label: spindle
  supported_by:
  - reference_id: PMID:19129481
