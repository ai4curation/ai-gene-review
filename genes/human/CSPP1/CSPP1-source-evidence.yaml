- index: 3
  source:
    term:
      id: GO:0005515
      label: protein binding
    evidence_type: IPI
    original_reference_id: PMID:25416956
    qualifier: enables
    supporting_entities:
    - UniProtKB:Q96HT8
    isoform: Q1MSJ5-2
  review:
    summary: CSPP1 isoform 2 has a positive binary interaction with MRFAP1L1.
    action: KEEP_AS_NON_CORE
    reason: PMID:25416956 generated a systematic human ORF yeast two-hybrid map, with fresh-colony
      pairwise retesting and sequence confirmation. Three exact curated assay records join the
      seeded Q1MSJ5-2–Q96HT8 pair, and both participant sequence checksums match official sequences.
      Dataset-level orthogonal validation is not a separate validation claim for this pair.
      MRFAP1L1 has no sufficiently established functional class here to justify a more specific
      partner-binding term. Retain the positive interaction as non-core under the project policy;
      neither expected compartment nor generic wording invalidates the assay.
- index: 4
  source:
    term:
      id: GO:0005515
      label: protein binding
    evidence_type: IPI
    original_reference_id: PMID:25416956
    qualifier: enables
    supporting_entities:
    - UniProtKB:Q96KN7
    isoform: Q1MSJ5-2
  review:
    summary: The short CSPP1 product interacts with RPGRIP1 in the binary screen.
    action: KEEP_AS_NON_CORE
    reason: The source explicitly identifies Q1MSJ5-2 and RPGRIP1/Q96KN7, supported by three
      exact PMID:25416956 yeast two-hybrid records with independently matched participant sequences.
      RPGRIP1 is distinct from RPGRIP1L. Its reviewed scaffolding/localization description does
      not establish a precise binding class for this assay; retain positive protein binding
      as non-core without inferring a native retinal complex, exclusivity to this isoform, or
      an RPGRIP1L experiment.
