- id: GO:0005929
  isObsolete: false
  name: cilium
  definition:
    text: A specialized eukaryotic organelle that consists of a filiform extrusion of the cell
      surface and of some cytoplasmic parts. Each cilium is largely bounded by an extrusion
      of the cytoplasmic (plasma) membrane, and contains a regular longitudinal array of microtubules,
      anchored to a basal body.
    xrefs:
    - dbCode: ISBN
      dbId: 0198547684
    - dbCode: PMID
      dbId: '16824949'
    - dbCode: PMID
      dbId: '17009929'
    - dbCode: PMID
      dbId: '20144998'
  comment: Note that we deem cilium and microtubule-based flagellum to be equivalent. In most
    eukaryotic species, intracellular sub-components of the cilium, such as the ciliary base
    and rootlet, are located near the plasma membrane. In Diplomonads such as Giardia, instead,
    the same ciliary parts are located further intracellularly. Also, 'cilium' may be used when
    axonemal structure and/or motility are unknown, or when axonemal structure is unusual. For
    all other cases, please refer to children of 'cilium'. Finally, note that any role of ciliary
    proteins in sensory events should be captured by annotating to relevant biological process
    terms.
