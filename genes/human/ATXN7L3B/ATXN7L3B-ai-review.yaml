suggested_questions:
- question: Is ATXN7L3B's ENY2 sequestration regulated, for example by signals that release ENY2 to the
    nucleus, and does it also affect ENY2's role in mRNA export (TREX-2)?
suggested_experiments:
- description: Map ENY2 partitioning between ATXN7L3B, ATXN7L3 and the TREX-2 component GANP across conditions,
    and test ATXN7L3B knockout effects on H2Bub1 and on mRNA export.
