description: ATXN7L3B (ataxin-7-like protein 3B) is a small cytoplasmic paralog of the SAGA deubiquitination-module
  subunit ATXN7L3. It binds ENY2 but no other SAGA subunit and competes with ATXN7L3 for ENY2, retaining
  it in the cytoplasm. A USP22-ATXN7L3B-ENY2 complex is a poor H2B deubiquitinase. By diverting ENY2,
  ATXN7L3B lowers nuclear SAGA deubiquitinase activity and raises histone H2B monoubiquitination. Its
  knockdown also reduces ENY2 levels, limits estrogen-receptor target gene expression, and inhibits breast
  cancer cell migration.
