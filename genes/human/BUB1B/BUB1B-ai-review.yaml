- description: At mitotic kinetochores, BUBR1 recruits PP2A-B56 through its KARD LxxIxE
    motif. This adaptor function positions phosphatase activity to oppose excessive
    Aurora B signaling, stabilize kinetochore–microtubule attachments and support
    chromosome congression and checkpoint silencing.
