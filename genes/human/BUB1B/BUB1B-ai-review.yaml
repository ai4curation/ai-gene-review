gene_symbol: BUB1B
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: BUB1B encodes BUBR1, a mitotic checkpoint protein that restrains chromosome segregation and helps establish stable kinetochore–microtubule attachments. In the mitotic checkpoint complex with BUB3, MAD2 and CDC20, BUBR1 uses degron-like motifs and its N-terminal TPR domain to inhibit APC/C substrate recognition and ubiquitination, delaying anaphase. A separate kinetochore function uses its central KARD region and LxxIxE motif to recruit PP2A-B56; this positions phosphatase activity to balance mitotic kinase signaling, promote chromosome alignment and facilitate checkpoint silencing. Human BUBR1 has a C-terminal kinase-like domain with important noncatalytic functions, while intrinsic kinase activity remains disputed because positive and negative biochemical studies use different constructs and assay conditions. BUBR1 is predominantly cytoplasmic in interphase, accumulates at mitotic kinetochores and can redistribute along the anaphase spindle. Biallelic pathogenic variants cause mosaic variegated aneuploidy syndrome 1, characterized by chromosome-segregation errors and developmental abnormalities.
