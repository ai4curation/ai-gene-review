core_functions:
- description: As the MAD3-like subunit of the mitotic checkpoint complex, BubR1 binds CDC20 through its
    KEN-box/ABBA/D-box degron-like motifs and TPR domain, blocking substrate recognition and UbcH10 engagement
    by APC/C-CDC20 so that securin and cyclin B are not ubiquitinated until all kinetochores are attached.
  molecular_function:
