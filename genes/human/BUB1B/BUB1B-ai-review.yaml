  review:
    summary: PAINT node PTN000361608 asserts nuclear localization, seeded largely by yeast Bub1/Mad3 (closed
      mitosis, so kinetochore proteins are nuclear) plus worm and human members. Human BUBR1 is predominantly
      cytoplasmic in interphase and acts on kinetochores of condensed chromosomes after nuclear envelope
      breakdown; UniProt lists a nuclear pool by inference and the protein carries an NLS motif.
    action: KEEP_AS_NON_CORE
    reason: Phylogenetically defensible (yeast orthologues are nuclear) and not wrong for human (a nuclear/nucleoplasmic
      pool and premitotic MCC assembly are plausible), but interphase immunofluorescence shows the bulk
      of human BUBR1 in the cytoplasm, and its functional sites are kinetochores and the mitotic cytosol.
    supported_by:
    - reference_id: PMID:9660858
      supporting_text: During interphase, hBubR1 was predominantly cytoplasmic
    - reference_id: PMID:9763420
      supporting_text: Examination of the subcellular distribution of hBUBR1 by immunofluorescence staining
        showed that it was concentrated in the cytoplasm of all interphase cells
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      failure_modes:
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN000361608
        source_label: PTN000361608
        source_status: SUPPORTS_TRANSFER
        comment: Nuclear localization is an open-vs-closed-mitosis compartment convention; for a human
          protein the corresponding functional site is the kinetochore.
