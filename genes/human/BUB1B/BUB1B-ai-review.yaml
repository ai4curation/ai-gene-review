taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'BUB1B encodes BubR1, the MAD3-related subunit of the mitotic checkpoint complex (MCC; MAD2-BUBR1-BUB3-CDC20),
  the diffusible inhibitor generated by the spindle assembly checkpoint. During prometaphase BubR1 is
  recruited to unattached outer kinetochores through its GLEBS motif-bound partner BUB3, a direct BUB1
  interaction and TPR-domain contacts with KNL1; MPS1-phosphorylated KNL1 and the MAD1-C-MAD2 template
  then drive incorporation of BubR1-BUB3 and MAD2-CDC20 into the MCC. Within the MCC, BubR1 KEN-box, ABBA-motif
  and D-box degron-like sequences occupy the substrate-recognition sites of CDC20, and its N-terminal
  TPR domain obstructs binding of the initiating E2 UbcH10, so that APC/C-CDC20 cannot ubiquitinate securin
  and cyclin B and anaphase is delayed until every kinetochore is attached. The MCC can also inhibit a
  second, APC/C-bound CDC20, and checkpoint silencing proceeds through p31comet/TRIP13-driven MCC disassembly
  and CDC20(MCC) autoubiquitination. A second, kinetochore-local function is mediated by the central kinetochore
  attachment regulatory domain (KARD): CDK1/PLK1 phosphorylation of the KARD LxxIxE motif recruits PP2A-B56,
  which counteracts Aurora B and MPS1 phosphorylation to stabilise correct kinetochore-microtubule attachments,
  support chromosome congression and promote checkpoint silencing. The C-terminal kinase-like domain of
  human BubR1 has degenerate catalytic motifs and is generally regarded as a pseudokinase that acts allosterically
  to support KARD function; a report that it phosphorylates CENP-E Ser2639 to switch the motor from lateral
  to end-on microtubule tracking remains contested. BubR1 is cytoplasmic in interphase, accumulates at
  kinetochores from prophase, and also decorates the spindle midzone in late anaphase. Its abundance is
  controlled by acetylation (PCAF, CBP, SIRT2) and APC/C-dependent degradation, and it declines with age
  in mouse tissues. Biallelic loss-of-function variants cause mosaic variegated aneuploidy syndrome 1,
  with premature chromatid separation, growth restriction, microcephaly and childhood cancer predisposition.'
