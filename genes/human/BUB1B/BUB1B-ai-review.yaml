  review:
    summary: 'PAINT node PTN000361607 asserts protein kinase activity for the Bub1/BubR1 ancestor, seeded
      by genuine kinases (yeast Bub1, human BUB1, worm bub-1) and by the disputed BUB1B/hBubR1 activity.
      Human BUBR1 retains a C-terminal kinase-like fold but has degenerate glycine-rich and catalytic-loop
      motifs, and its catalytic competence is disputed: early in vitro autophosphorylation and CENP-E-stimulated
      activity in immunoprecipitates could not exclude co-purifying kinases, kinase activity is dispensable
      for APC/C-CDC20 inhibition, and phylogenomic/structural/biochemical work classifies the domain as
      a pseudokinase whose role is allosteric (promoting KARD phosphorylation and PP2A-B56 recruitment).
      One 2019 study reports bona fide phosphotransfer by purified human BubR1 onto CENP-E Ser2639, so
      the activity cannot be called refuted, but it is not the established core function of the protein.'
    action: MARK_AS_OVER_ANNOTATED
    reason: 'The node placement is reasonable for the ancestral Bub1-like protein, but BUB1B is a paralog
      whose kinase domain has diverged: it lacks conserved catalytic-loop residues (PMID:9660858), kinase
      activity is not required for its APC/C-inhibitory function (PMID:11702782), and the field''s consensus
      (see deep research) is that human BubR1 is a pseudokinase, with a single contrary report of phosphotransfer
      (PMID:31201382). Not refuted, so not REMOVE; but it should not be read as a core function. The propagation
      issue is target-specific functional divergence (pseudokinase), not a bad source.'
    supported_by:
    - reference_id: PMID:9660858
      supporting_text: hBubR1 lacks several of the residues that are usually highly conserved among most
        protein kinases
    - reference_id: PMID:11702782
      supporting_text: Surprisingly, the kinase activity of BubR1 is not required for the inhibition of
        APCCdc20.
    - reference_id: PMID:31201382
      supporting_text: Despite prior experimental evidence that BubR1 has kinase activity, this has been
        highly controversial, as a widely held view is that BubR1 is an unusual pseudokinase containing
        modules to interact with Bub1, Bub3, PP2A-B56 and KNL.
    - reference_id: file:human/BUB1B/BUB1B-deep-research-falcon.md
      supporting_text: Phylogenomic, structural and direct biochemical analyses found no convincing intrinsic
        phosphotransfer activity.
