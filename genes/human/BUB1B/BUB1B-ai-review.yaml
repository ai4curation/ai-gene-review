  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - FB:FBgn0263855
  - PANTHER:PTN000361607
  - PomBase:SPCC1322.12c
  review:
    summary: PAINT node PTN000361607 asserts a role in meiotic centromeric cohesion, seeded by Drosophila
      BubR1 and fission yeast Bub1 (both required to protect centromeric cohesin/Shugoshin in meiosis).
      Human BUBR1 recruits PP2A-B56 through its KARD, and BubR1-PP2A-B56 is part of the cohesin-protection
      machinery, but there is no direct human meiotic evidence in GOA.
    action: KEEP_AS_NON_CORE
    reason: The phylogenetic placement is a considered judgment on a conserved Bub1/BubR1-shugoshin-PP2A
      module and is not contradicted for human BUBR1 (mouse oocyte studies support a BubR1 requirement
      in meiotic chromosome segregation), so the IBA is retained; it is graded non-core because the direct
      human evidence concerns mitosis and the shugoshin-recruiting kinase function of this module resides
      in the paralog BUB1.
    supported_by:
    - reference_id: file:human/BUB1B/BUB1B-deep-research-falcon.md
      supporting_text: The BUBR1–PP2A-B56 complex opposes Aurora B-driven destabilization of kinetochore–microtubule
        attachments.
    - reference_id: file:human/BUB1B/BUB1B-deep-research-falcon.md
      supporting_text: BUBR1 therefore acts as a targeting platform that positions PP2A-B56 where kinetochore
        phosphosignalling must be reversed.
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      failure_modes:
      - CONTEXT_OR_TISSUE_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN000361607
        source_label: PTN000361607
        source_status: SUPPORTS_TRANSFER
        comment: Node predates the Bub1/BubR1 split; the meiotic cohesion evidence comes from fly BubR1
          and pombe Bub1.
      - source_id: FB:FBgn0263855
        source_label: BubR1
        source_status: SUPPORTS_TRANSFER
        comment: Drosophila BubR1 is required for meiotic centromeric cohesion maintenance.
      - source_id: PomBase:SPCC1322.12c
        source_label: bub1
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Pombe Bub1 protects meiotic cohesion via H2A-S121 phosphorylation and Sgo1 recruitment,
          a kinase function carried in human by BUB1 rather than BUB1B.
