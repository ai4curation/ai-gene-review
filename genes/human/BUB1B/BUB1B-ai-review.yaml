    supporting_text: Mad2 and BubR1 interact cooperatively with Cdc20 (refs 9,13–18), and synergistically
      inhibit the APC/C in mitosis 14,19.
  - reference_id: PMID:27509861
    supporting_text: BubR1TPR interacts directly with the UbcH10 interface of Apc2WHB that repositions
      to contact BubR1TPR (Fig.
  - reference_id: PMID:11535616
    supporting_text: Purified GST–hBUBR1:MCC was found to inhibit ubiquitin ligase activity of the APC/C
      (Fig.
  - reference_id: PMID:25383541
    supporting_text: Here, we show that the MCC can inhibit a second CDC20 that has already bound and
      activated the APC/C.
  - reference_id: PMID:11702782
    supporting_text: In the absence of Mad2, BubR1 inhibits the activity of APC by blocking the binding
      of Cdc20 to APC.
- description: At unattached and maturing outer kinetochores, BubR1 (recruited via BUB3, BUB1 and KNL1)
    uses its CDK1/PLK1-phosphorylated KARD LxxIxE motif to recruit PP2A-B56, which opposes Aurora B/MPS1
    phosphorylation of kinetochore substrates, stabilises correct kinetochore-microtubule attachments,
    supports chromosome congression and enables checkpoint silencing.
  molecular_function:
    id: GO:0140483
    label: kinetochore adaptor activity
  directly_involved_in:
