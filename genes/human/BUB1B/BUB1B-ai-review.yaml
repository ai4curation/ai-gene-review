  review:
    action: UNDECIDED
    summary: The meiotic cohesion transfer is plausible but its target-level evolutionary and mechanistic scope remains unresolved.
    reason: The exact PTN000361607 IBD is seeded by FBgn0263855 and SPCC1322.12c. Official FlyBase identifies the former as BubR1 and links the exact centromeric meiotic-cohesion term to Malmanche et al. (2007) mutant evidence; PomBase identifies the latter as Bub1 with meiotic cohesion and H2A-kinase-related annotations. These are real donor assertions, not weak evidence merely because there are two donors. However, the relevant full donor experiments and complete ancestral tree/MSA were not inspected. Human mitotic PP2A recruitment or attachment control alone does not establish the specific meiotic process. Retain uncertainty without asserting target loss, a wrong node, or an unverified pre-duplication topology. This is uncertainty about the exact meiotic participation and inheritance scope, not a requirement for a separate human experiment or a rejection of phylogenetic inference. No contrary target experiment is asserted and the IBA is not removed.
