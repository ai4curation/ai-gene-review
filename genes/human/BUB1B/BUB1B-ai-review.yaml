  review:
    summary: Huang et al. report crystal structures of the Drosophila BubR1 kinase domain in an active
      conformation and enzymatic assays showing purified human BubR1 has catalytic activity (reduced by
      K795A/D911A/D882N) that phosphorylates CENP-E Ser2639, switching CENP-E from lateral to end-on microtubule
      tracking.
    action: MARK_AS_OVER_ANNOTATED
    reason: This is a direct experimental claim and must not be dismissed, but it contradicts a substantial
      body of phylogenomic, structural and biochemical evidence that human BubR1 is a pseudokinase, and
      the authors themselves note the active-kinase salt-bridge signature is not conserved in human BubR1.
      Treated as a disputed, non-core activity pending independent reconciliation; the reference is flagged
      DISPUTED in reference_review.
    supported_by:
    - reference_id: PMID:31201382
      supporting_text: Indeed, human BubR1 WT was found to have catalytic activity and our enzymatic assays
        confirmed that Lys795 and Asp911 are critical for that activity (Fig. 1e ).
    - reference_id: PMID:31201382
