  review:
    summary: Strong positive human kinase assays conflict with negative primary biochemical tests.
    action: UNDECIDED
    reason: The inspected human Sf9-derived preparations in PMID:31201382 show reduced activity with K795A/D911A, loss of CENP-E Ser2639 phosphorylation with D911A or D882N, and BRT-1-sensitive phosphorylation. BRT-1-binding-site variants retained activity and rescued drug-treated mitotic phenotypes, while the D882N analysis addressed the stability objection. These controls support taking intrinsic activity seriously; they are not dismissed as an untested contamination hypothesis. Nevertheless, PMID:22698286 reports no human bacterial kinase-domain activity with active BUB1 controls and persistence of cellular immunoprecipitate-associated activity after kinase-domain removal or mutation. The divergent constructs, expression systems and activity-attribution results have not been reconciled. Retain UNDECIDED for the biological catalytic assertion, rather than equating kinase dispensability with absence or converting an unresolved conflict into overannotation. The crystal structure is Drosophila; the human assays are distinct.
    supported_by:
    - reference_id: PMID:31201382
      supporting_text: human BubR1 WT was found to have catalytic activity
