    label: kinetochore
  supported_by:
  - reference_id: file:human/BUB1B/BUB1B-deep-research-falcon.md
    supporting_text: BUBR1 therefore acts as a targeting platform that positions PP2A-B56 where kinetochore
      phosphosignalling must be reversed.
  - reference_id: file:human/BUB1B/BUB1B-deep-research-falcon.md
    supporting_text: The BUBR1–PP2A-B56 complex opposes Aurora B-driven destabilization of kinetochore–microtubule
      attachments.
  - reference_id: file:human/BUB1B/BUB1B-deep-research-falcon.md
    supporting_text: Mutation of BUBR1 residues required for B56 binding disrupts chromosome congression;
      Aurora B inhibition can partially reverse this phenotype, supporting the proposed kinase–phosphatase
      balance.
  - reference_id: PMID:20220147
    supporting_text: BubR1 kinetochore enrichment is dependent on Bub1 and Bub3 (28, 29) and is required
      to sustain a SAC arrest, as well as for stable kinetochore-microtubule interactions (23).
proposed_new_terms: []
suggested_questions:
- question: Is human BubR1 catalytically active in cells? Independent reproduction of CENP-E Ser2639 phosphorylation
    by purified, kinase-contaminant-free human BubR1 (or a clean D882N/K795A knock-in) would settle whether
    the EC 2.7.11.1 and Rhea-derived kinase annotations should be retained or retired.
- question: Should the PP2A-B56 recruitment function be captured in GO for BUB1B (e.g. a PP2A-B56 binding/kinetochore
    adaptor activity with an attachment-stabilisation process), given that GOA currently carries no annotation
    for the KARD-dependent role?
- question: Does the IBA-derived meiotic centromeric cohesion term reflect a genuine human BUB1B (rather
    than BUB1) role, given that shugoshin recruitment by H2A-T120 phosphorylation is a BUB1 kinase function?
suggested_experiments:
- description: In vitro phosphotransfer assay with recombinant human BubR1 purified from a kinase-free
    system (e.g. E. coli) and CENP-E tail as substrate, side by side with the D882N and K795A mutants
    and with a PLK1-depleted control, to test the disputed intrinsic kinase activity.
  experiment_type: biochemical
- description: Separation-of-function analysis in human cells combining KEN1/KEN2/ABBA mutants (MCC/APC/C
    inhibition) with KARD LxxIxE mutants (PP2A-B56 recruitment) to quantify the independent contributions
    of the two functions to mitotic timing, chromosome alignment and aneuploidy, including MVA patient
    alleles.
  experiment_type: genetic
