    summary: Chan et al. 1998 isolated hBUBR1 in a yeast two-hybrid screen with the CENP-E kinetochore-binding
      domain and showed CENP-E and hBUBR1 co-immunoprecipitate from HeLa cells.
    action: REMOVE
    reason: Bare protein binding is uninformative. The CENP-E interaction is important biology (CENP-E
      stimulates BubR1 kinase activity in immunoprecipitates and is a proposed BubR1 substrate), but no
      settled molecular function of BUBR1 can be assigned from it given the disputed kinase activity;
      the interaction itself is not in doubt.
    supported_by:
    - reference_id: PMID:9763420
      supporting_text: This observation, coupled with the fact that CENP-E and hBUBR1 kinase can form
        a stable complex in vivo, raises the possibility that this complex might participate in the checkpoint
        pathway.
    - reference_id: PMID:10477750
      supporting_text: Although this interaction was initially identified in a yeast two-hybrid screen
        for proteins that associate with CENP-E, a stable complex of hBUBR1 and CENP-E was detected in
        Hela cells.
