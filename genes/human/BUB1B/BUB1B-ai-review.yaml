  review:
    summary: Chan et al. 1999 found hBUBR1 associated with the cyclosome/APC in mitotically arrested cells.
      BUBR1 is not a subunit of the APC/C; it binds APC/C-CDC20 as part of the mitotic checkpoint complex,
      forming the inhibited APC/C-MCC assembly.
    action: MODIFY
    proposed_replacement_terms:
    - id: GO:0033597
      label: mitotic checkpoint complex
    reason: 'Membership of the E3 ligase itself misrepresents the biology: BUBR1 is an inhibitor bound
      to the APC/C-CDC20 via the MCC. The complex term that BUBR1 is genuinely part of is GO:0033597 mitotic
      checkpoint complex (cryo-EM of APC/C-MCC, PMID:27509861).'
    supported_by:
    - reference_id: PMID:10477750
      supporting_text: As hBUBR1 appears to form a fairly stable complex with the cyclosome/APC in cells
        arrested in mitosis, its kinase activity may be labile.
    - reference_id: PMID:27509861
      supporting_text: Soluble C-Mad2 engages the N-terminus of Cdc20 (refs 10,11), the mitotic activating
        subunit of the APC/C, which then binds the BubR1-Bub3 dimer to form the MCC 12.
