suggested_questions:
- question: Which differences in human BUBR1 construct, purification, associated kinases
    and substrate account for the conflicting positive and negative intrinsic kinase
    assays?
- question: Does the ancestral meiotic centromeric-cohesion assertion reflect a conserved
    human BUBR1 mechanism? Full donor assays and PAINT node placement remain to be
    examined.
- question: Which source-specific screen interactions and the distinct centrosomal
    localization can be confirmed from original target-level records?
suggested_experiments:
- description: Compare full-length human BUBR1 and kinase-domain constructs purified
    from matched expression systems, with quantitative contaminant controls, catalytic-site
    and stability controls, and CENP-E and histone substrates. Separate phosphotransfer
    from protein-stability and PP2A-recruitment effects.
  experiment_type: biochemical
- description: Use separable CDC20-contact and KARD/B56-binding mutants in human cells
    to quantify checkpoint inhibition, phosphatase recruitment and attachment stabilization,
    with expression and kinetochore-localization controls.
  experiment_type: genetic
