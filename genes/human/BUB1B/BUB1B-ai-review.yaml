    summary: Intrinsic human BUBR1 kinase activity remains disputed.
    action: UNDECIDED
    reason: The source kinase IBD at PTN000361607 represents a phylogenetic assertion with legitimate human target evidence, not a pairwise similarity transfer. The complete ancestral tree/MSA and placement rationale were not inspected, so an erroneous pre-duplication placement or target-specific loss is not established. Positive human full-length assays in PMID:31201382 conflict with negative biochemical evidence in PMID:22698286. Preserve the inherited assertion as unresolved rather than declaring the self-source circular or the node wrong. The positive human Sf9-derived assays include active-site mutants and inhibitor-resistant rescue controls; these are substantive target evidence, not just transfer from the Drosophila structure. The human bacterial-domain and cellular immunoprecipitate controls in the negative study remain a genuine counterpoint with different preparation boundaries.
