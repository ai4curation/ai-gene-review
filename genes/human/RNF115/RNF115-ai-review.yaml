    id: GO:0005634
    label: nucleus
  evidence_type: EXP
  original_reference_id: PMID:24852021
  qualifier: located_in
  review:
    summary: Nuclear RNF115 localization is reported but peripheral to the best-established E3
      mechanisms.
    action: KEEP_AS_NON_CORE
    reason: UniProt curates the PMID:24852021 evidence as supporting RNF115 nuclear localization; the
      currently defined substrate-ubiquitination mechanisms act in the cytoplasm, at ER/Golgi
      membranes, or in endolysosomal trafficking contexts, so this location is peripheral.
    supported_by:
    - reference_id: file:human/RNF115/RNF115-uniprot.txt
      supporting_text: CC       ECO:0000269|PubMed:24852021}. Nucleus {ECO:0000269|PubMed:24852021}.
