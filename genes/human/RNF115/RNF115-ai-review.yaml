id: Q9Y4L5
gene_symbol: RNF115
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'RNF115, also called BCA2 or Rabring7, is an intracellular RING-H2 E3 ubiquitin ligase with
  an N-terminal ubiquitin-binding BZF domain and a C-terminal catalytic RING domain. It recruits E2 ubiquitin-conjugating
  enzymes and catalyzes substrate ubiquitination in several membrane-trafficking and innate-immune contexts.
  RNF115 is phosphorylated by AKT1 to permit 14-3-3-dependent recruitment to the ER and Golgi, where it
  catalyzes K11-linked ubiquitination of RAB1A and RAB13 to limit GDI1-dependent Rab recycling and restrain
  Toll-like receptor delivery from the ER to the Golgi and cell surface. Other reported substrates and
  client processes include K48-linked MAVS turnover, K63-linked STING/MITA ubiquitination, ubiquitin-dependent
  endosomal sorting of membrane receptors, HIV Gag turnover, and STX17-linked autophagosome maturation.'
