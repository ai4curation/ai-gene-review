  review:
    summary: The RAB7A interaction supports small GTPase binding rather than a bare protein-binding
      annotation.
    action: MODIFY
    reason: The PMID:16925951 row identifies RAB7A, the small GTPase that gave RNF115/Rabring7 its
      name and recruits GTP-bound RNF115 to late endosomes and lysosomes. GO:0031267 captures that
      partner class more informatively than bare GO:0005515.
    proposed_replacement_terms:
