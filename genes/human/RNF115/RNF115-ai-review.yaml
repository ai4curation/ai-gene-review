    label: ubiquitin-protein transferase activity
  evidence_type: IDA
  original_reference_id: PMID:18819927
  qualifier: enables
  review:
    summary: The older ubiquitin-protein transferase parent should be refined to ubiquitin protein
      ligase activity.
    action: MODIFY
    reason: PMID:18819927 showed E2-dependent, RING-dependent autoubiquitination of BCA2/RNF115, and
      UniProt cites the same paper for EC 2.3.2.27, supporting the more specific
      ubiquitin protein ligase activity term that RNF115 already carries.
    proposed_replacement_terms:
    - id: GO:0061630
      label: ubiquitin protein ligase activity
    supported_by:
    - reference_id: PMID:18819927
      supporting_text: wild type BCA2 is autoubiquitinated in the presence of UbcH5b
    - reference_id: file:human/RNF115/RNF115-uniprot.txt
      supporting_text: 'CC         EC=2.3.2.27; Evidence={ECO:0000269|PubMed:18819927};'
