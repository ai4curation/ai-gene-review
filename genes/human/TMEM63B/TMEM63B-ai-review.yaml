    action: MODIFY
    reason: 'Wrong mechanism class. GO:0120019 describes an intermembrane lipid-transfer protein: it ''removes
      phosphatidylcholine from a membrane or a monolayer lipid particle, transports it through the aqueous
      phase while protected in a hydrophobic pocket, and brings it to an acceptor membrane or lipid particle''.
      That is the STARD/CERT mode of action - a soluble carrier shuttling a lipid through the aqueous
      phase between two membranes. TMEM63B is an 11-transmembrane integral membrane protein that flips
