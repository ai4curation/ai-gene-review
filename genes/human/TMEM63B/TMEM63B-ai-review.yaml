- term:
    id: GO:0005227
    label: calcium-activated cation channel activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: Ca2+-permeable, stretch/osmolarity-gated cation channel annotated with a term that asserts
      gating by Ca2+ binding.
    action: MODIFY
    reason: 'The essence is right - TMEM63B is a Ca2+-permeable cation channel - but the term names the
      wrong gating stimulus. GO:0005227 is defined as a channel that opens ''when a calcium cation has
      been bound by the channel complex or one of its constituent parts'', and every experimental user
      of the term in GOA is a genuinely Ca2+-gated channel (KCNN4, SLO1/SLO2, TRPM4, TMEM16A). TMEM63B
      is gated by membrane stretch and hypo-osmolarity, with Ca2+ as a permeant ion. The provenance of
      the slip is visible: the mouse IDA that seeds the human ISS/IEA rows comes from a paper titled ''Overexpression
      of Osmosensitive Ca(2+)-Permeable Channel TMEM63B'' (PMID:31243992), and the InterPro family behind
      the IEA is named ''Calcium permeable stress-gated cation channel 1-like'' (IPR045122) yet is mapped
      to the calcium-activated term. Replace with the mechanosensitive cation channel term plus a plain
      calcium channel term, which together capture what was actually measured without asserting Ca2+ gating.'
    proposed_replacement_terms:
    - id: GO:0140135
      label: mechanosensitive monoatomic cation channel activity
    - id: GO:0005262
      label: calcium channel activity
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      source_entities:
