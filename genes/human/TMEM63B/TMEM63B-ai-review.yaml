core_functions:
- molecular_function:
    id: GO:0140135
    label: mechanosensitive monoatomic cation channel activity
  description: TMEM63B forms a monomeric, small-conductance, high-threshold cation channel that opens
    in response to membrane tension and to hypo-osmotic swelling. It is permeable to Ca2+, Na+, K+ and
    Mg2+, and gates by the force-from-lipids mechanism rather than by ligand binding, so the osmolarity-sensing
    description (GO:1990760) and the mechanosensitive description refer to one activity. In alveolar type
    2 cells this conductance converts lung inflation into the Ca2+ signal that drives lamellar body exocytosis.
  directly_involved_in:
  - id: GO:0098655
    label: monoatomic cation transmembrane transport
  locations:
  - id: GO:0005886
    label: plasma membrane
  - id: GO:0097233
    label: alveolar lamellar body membrane
  - id: GO:0005765
    label: lysosomal membrane
  supported_by:
  - reference_id: PMID:37543036
    supporting_text: Functional analyses demonstrated that TMEM63s are bona fide mechanosensitive ion
      channels, characterized by small conductance and high thresholds.
  - reference_id: PMID:38127458
    supporting_text: Activation of TMEM63A/B channels during cell stretch facilitated the release of surfactant
      and ATP from LBs fused with the plasma membrane.
  - reference_id: PMID:30382938
    supporting_text: Here, we show that various members of the OSCA and TMEM63 family of proteins from
      plants, flies, and mammals confer mechanosensitivity to naïve cells.
- molecular_function:
    id: GO:0017128
    label: phospholipid scramblase activity
  description: TMEM63B translocates phospholipids bidirectionally between the two leaflets of the bilayer
    through a membrane-spanning hydrophilic groove, without ATP, when membrane curvature and thickness
    change or when tension is applied. Scrambling dissipates plasma membrane lipid asymmetry, exposing
    phosphatidylserine and redistributing phosphatidylcholine and sphingomyelin. The lipid pathway is
    resolved in open and closed cryo-EM structures and lies in the same groove as the ion pore, but is
    controlled by different bottleneck residues, so the scramblase and channel activities are separable;
    pathogenic variants around the hydrophobic gate make the scrambling constitutive without enhancing
    ion conduction. It remains to be shown that wild-type scrambling is deployed at physiological force
    in vivo.
  directly_involved_in:
  - id: GO:0017121
    label: plasma membrane phospholipid scrambling
  locations:
  - id: GO:0005886
    label: plasma membrane
  - id: GO:0005765
    label: lysosomal membrane
  supported_by:
  - reference_id: PMID:39424995
    supporting_text: we show that transmembrane protein 63B (TMEM63B) functions as a membrane structure-responsive
      lipid scramblase localized at the PM and lysosomes, activating bidirectional lipid translocation
      upon changes in membrane curvature and thickness.
  - reference_id: PMID:39424995
    supporting_text: We determined the cryo-electron microscopy structures of TMEM63B in its open and
      closed conformations, uncovering a lipid translocation pathway formed in response to changes in
      the membrane environment.
  - reference_id: PMID:39217145
    supporting_text: Ca2+ stimulation-mediated PLS is suppressed by deletion of Tmem63b, while human disease-related
      Tmem63b mutants induce constitutive PLS.
  - reference_id: PMID:41617699
    supporting_text: We show that lipid scrambling in TMEM63 proteins can be activated by mechanical forces
      in the membrane, making these mechanically activated lipid scramblases.
proposed_new_terms:
- proposed_name: phosphatidylcholine scramblase activity
  proposed_definition: Catalysis of the movement of phosphatidylcholine from one leaflet of a membrane
    bilayer to the other, by an ATP-independent mechanism.
  justification: GO has no lipid-species-specific child of GO:0017128 phospholipid scramblase activity.
    Because of this gap, curators annotating the demonstration that TMEM63B redistributes phosphatidylcholine
    and sphingomyelin across the plasma membrane reached for GO:0120019 phosphatidylcholine transfer activity
    and GO:0140338 sphingomyelin transfer activity, which describe soluble intermembrane lipid-transfer
    proteins that shuttle a lipid through the aqueous phase in a hydrophobic pocket - a mechanism TMEM63B
    does not use. Species-specific scramblase children would let this evidence be captured without asserting
    the wrong mechanism.
  proposed_parent:
    id: GO:0017128
    label: phospholipid scramblase activity
  supported_by:
  - reference_id: PMID:39424995
    supporting_text: TMEM63B deficiency alters phosphatidylcholine and sphingomyelin distributions in
      the PM.
suggested_questions:
- question: Is the phospholipid scramblase activity of wild-type TMEM63B deployed physiologically in vivo,
    or is it only detectable in reconstituted vesicles and over-expressing cells? Zheng et al. state this
    explicitly as an open question.
  experts:
  - Jeffrey R Holt
  - Katsumori Segawa
  - Huanghe Yang
  - Jun Suzuki
- question: Are the channel and scramblase activities of TMEM63B ever engaged simultaneously in a native
    cell, or are they alternative outcomes of the same gating transition selected by the magnitude and
    kind of mechanical stimulus? The I475del variant, which potentiates scrambling under hypotonic stress,
    suggests the two can be coupled.
  experts:
  - Huanghe Yang
  - Charles D Cox
- question: Does the Tmem63b/Slc19a2 heterodimer requirement reported for Ca2+-stimulated scrambling in
    pro-B cells apply to the purified-protein and GUV systems, where TMEM63B scrambles on its own? If
    not, what does SLC19A2 contribute?
  experts:
  - Jun Suzuki
  - Katsumori Segawa
- question: Which of the two activities accounts for which part of the TMEM63B channelopathy phenotype
    - the neurological features, or the macrocytic anaemia and haemolysis seen in a subset of individuals?
  experts:
  - Renzo Guerrini
  - Annalisa Vetro
  - Huanghe Yang
suggested_experiments:
- hypothesis: Wild-type TMEM63B scrambles phospholipids in native cells only above a tension threshold
    that is reached during physiological mechanical stimulation.
  description: Apply calibrated membrane tension to cells expressing endogenous TMEM63B (for example alveolar
    type 2 cells or the subfornical organ neurons in which it is enriched) using high-speed pressure clamp
    or cyclic uniaxial stretch, while simultaneously recording annexin V binding and single-channel currents.
    Compare TMEM63B-null cells and cells rescued with scramble-dead but conduction-competent groove mutants.
