- term:
    id: GO:0120019
    label: phosphatidylcholine transfer activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: enables
  review:
    summary: Phosphatidylcholine handling annotated with an intermembrane lipid-transfer term rather than
      a scramblase term.
    action: MODIFY
    reason: 'Wrong mechanism class. GO:0120019 describes an intermembrane lipid-transfer protein: it ''removes
      phosphatidylcholine from a membrane or a monolayer lipid particle, transports it through the aqueous
      phase while protected in a hydrophobic pocket, and brings it to an acceptor membrane or lipid particle''.
      That is the STARD/CERT mode of action - a soluble carrier shuttling a lipid through the aqueous
      phase between two membranes. TMEM63B is an 11-transmembrane integral membrane protein that flips
      lipids between the two leaflets of a single bilayer through a membrane-spanning groove resolved
      by cryo-EM (PMID:39424995). The underlying observation is real - TMEM63B loss alters phosphatidylcholine
      and sphingomyelin distribution in the plasma membrane - but it was mapped to a transfer-protein
      term instead of a scramblase term. Replace with phospholipid scramblase activity, which the gene
      already carries with IDA and IMP evidence. GO currently has no lipid-species-specific scramblase
      child; a species-specific term is suggested in proposed_new_terms.'
    proposed_replacement_terms:
    - id: GO:0017128
      label: phospholipid scramblase activity
- term:
    id: GO:0140338
    label: sphingomyelin transfer activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: enables
  review:
    summary: Sphingomyelin handling annotated with an intermembrane lipid-transfer term rather than a
      scramblase term.
    action: MODIFY
    reason: 'Wrong mechanism class. GO:0140338 describes an intermembrane lipid-transfer protein: it ''removes
      a sphingomyelin from the outer leaflet of a donor membrane, transports it through the aqueous phase
      while protected in a hydrophobic pocket, and brings it to the outer leaflet of an acceptor membrane''.
      That is the STARD/CERT mode of action - a soluble carrier shuttling a lipid through the aqueous
      phase between two membranes. TMEM63B is an 11-transmembrane integral membrane protein that flips
      lipids between the two leaflets of a single bilayer through a membrane-spanning groove resolved
      by cryo-EM (PMID:39424995). The underlying observation is real - TMEM63B loss alters phosphatidylcholine
      and sphingomyelin distribution in the plasma membrane - but it was mapped to a transfer-protein
      term instead of a scramblase term. Replace with phospholipid scramblase activity, which the gene
      already carries with IDA and IMP evidence. GO currently has no lipid-species-specific scramblase
      child; a species-specific term is suggested in proposed_new_terms.'
    proposed_replacement_terms:
    - id: GO:0017128
      label: phospholipid scramblase activity
