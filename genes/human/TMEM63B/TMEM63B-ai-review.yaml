      by cryo-EM (PMID:39424995). The underlying observation is real - TMEM63B loss alters phosphatidylcholine
      and sphingomyelin distribution in the plasma membrane - but it was mapped to a transfer-protein
      term instead of a scramblase term. Replace with phospholipid scramblase activity, which the gene
      already carries with IDA and IMP evidence. GO currently has no lipid-species-specific scramblase
      child; a species-specific term is suggested in proposed_new_terms.'
