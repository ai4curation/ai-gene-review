- term:
    id: GO:0017128
    label: phospholipid scramblase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: enables
  review:
    summary: TMEM63B translocates phospholipids bidirectionally across the bilayer in response to changes
      in membrane curvature and thickness.
    action: ACCEPT
    reason: 'Core molecular function, and one of two core activities. Phospholipid scrambling by TMEM63B
      is supported by four independent groups using four different systems: an unbiased CRISPR scrambling
      screen in pro-B cells (PMID:39217145), purified protein plus open/closed cryo-EM structures resolving
      a lipid translocation pathway (PMID:39424995), a paralog/ortholog survey in a Tmem63b-null background
      (PMID:39716028), and reconstitution into giant unilamellar vesicles with coarse-grained MD (PMID:41617699).
      GOA already carries both this activity and mechanosensitive cation channel activity with experimental
      evidence, and the two are not the same measurement re-described: disease variants dissociate them
      (V44M and T481N confer constitutive scrambling with no obvious effect on mechanosensitive channel
      activity, PMID:42573579, PMID:40480214), and ion conduction and lipid translocation have distinct
      bottleneck residues in the same groove (PMID:41617699). TMEM16 proteins are the family precedent
      for one protein being both a channel and a scramblase. What remains open is whether wild-type scrambling
      operates in vivo at physiological force rather than only in reconstituted or over-expressing systems;
      that question is recorded in suggested_questions and does not warrant demotion from core.'
