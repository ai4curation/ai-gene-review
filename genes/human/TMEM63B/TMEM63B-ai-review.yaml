id: Q5T3F8
gene_symbol: TMEM63B
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'Mechanically activated, Ca2+-permeable cation channel of the TMEM63/OSCA (CSC1) family that
  also acts as a mechanically activated phospholipid scramblase. TMEM63B is an 11-transmembrane protein
  that, unusually for this structural superfamily, functions as a monomer with a single highly restricted
  pore, and it gates according to the force-from-lipids principle: membrane stretch or hypo-osmotic swelling
  opens a small-conductance, high-threshold cation conductance permeable to Ca2+, Na+, K+ and Mg2+. The
  same protein translocates phospholipids bidirectionally between bilayer leaflets when membrane curvature
  and thickness change, dissipating plasma membrane lipid asymmetry and altering the distribution of phosphatidylcholine
  and sphingomyelin; cryo-EM structures resolve a membrane-spanning lipid pathway that opens in the same
  groove as the ion pore, and distinct residues form the bottlenecks for ions and for lipids. This dual
  channel/scramblase behaviour parallels the TMEM16 family, to which TMEM63 proteins are structurally
  related. TMEM63B is found in the plasma membrane, lysosomal and early endosomal membranes, and the limiting
  membrane of alveolar lamellar bodies. Physiologically it is required for stretch-evoked pulmonary surfactant
  and ATP secretion from alveolar type 2 cells, and in rodents it contributes to osmosensing for thirst,
  to outer hair cell survival and hearing, and to intestinal stem cell homeostasis. Heterozygous de novo
  missense and in-frame variants clustered around the hydrophobic gate cause developmental and epileptic
  encephalopathy with progressive neurodegeneration, often with macrocytic anaemia and haemolysis; several
  of these variants act by converting the protein into a constitutive scramblase rather than by increasing
  ion leak. Whether the wild-type scramblase activity is deployed physiologically in vivo, as opposed
  to being measurable in reconstituted and over-expressing systems, is not yet settled.'
