id: O75179
gene_symbol: ANKRD17
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ANKRD17 is a large ankyrin-repeat protein with a type-1 KH domain that occupies nuclear and
  cytoplasmic pools. Its chromatin-associated pool supports DNA-replication and G1/S cell-cycle regulation
  and interacts with cyclin E/CDK2 and replication factors. In innate immune signaling, ANKRD17 promotes
  association of the RNA sensors RIG-I and MDA5 with MAVS and supports NOD1/NOD2-dependent inflammatory
  responses. It is also implicated in YAP protein stability. Heterozygous loss of function causes a neurodevelopmental
  syndrome characterized by intellectual disability, speech delay and dysmorphic features.
