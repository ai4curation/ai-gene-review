suggested_questions:
- question: Does ANKRD17 directly organize or load replication factors, or are the CDC6 and PCNA changes
    secondary to altered cell-cycle state and protein abundance?
- question: Which RNA targets and physiological mechanism depend on the ANKRD17 KH domain, and what is
    the exact supplementary evidence underlying the HDA RNA-binding annotation?
- question: Which exact PAINT IBD and donor complex-membership experiment justify GO:0090575 for ANKRD17,
    given the distinction between fly Mask-dependent Yki import, lack of intrinsic S2 GAL4 reporter activation,
    and human Mask2-dependent YAP stabilization?
- question: Which cell types and receptor stimuli account for the different RLR/Sendai phenotypes in the
    two immune-signaling studies?
suggested_experiments:
- description: Separate chromatin recruitment from cell-cycle and CDC6-abundance effects using endogenous
    ANKRD17 perturbations and matched cell-cycle populations; test purified replication-factor interactions
    before assigning a loader or bridging mechanism.
- description: Map endogenous human ANKRD17 RNA contacts and test KH-domain dependence while controlling
    protein abundance and localization.
