core_functions:
- description: Associates with nuclear chromatin and replication factors to regulate DNA synthesis and
    G1/S cell-cycle progression. The direct molecular step controlling PCNA loading remains unresolved;
    ANKRD17 is a cyclin E/CDK2 substrate rather than a demonstrated kinase or clamp loader.
  molecular_function:
    id: GO:0003682
    label: chromatin binding
  locations:
