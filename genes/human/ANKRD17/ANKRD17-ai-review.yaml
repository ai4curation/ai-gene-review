  - *id004
- description: Coordinates RIG-I/MDA5 association with MAVS to promote antiviral signaling. ANKRD17 also
    binds NOD2 and supports bacterial innate responses, although the NOD mechanism and cell-context dependence
    are distinct from the demonstrated receptor–MAVS coordination.
