  review:
    summary: The positive COL10A1–BANP pair supports an assay-scoped transcription-factor-binding refinement.
    action: MODIFY
    reason: 'The exact canonical human BANP product Q8N9N5 and COL10A1 precursor are present in three
      positive array, prey-pooling and validated Y2H records from PMID:25416956; sequence ROGIDs match
      the official proteins. BANP is a sequence-specific regulator of RNA polymerase II CGI promoters,
      independently established for mouse and human in the complete abstract of PMID:34234345. GO:0061629
      classifies the bound partner, without asserting that COL10A1 regulates transcription. The screen
      does not establish a native extracellular/nuclear interaction, mature collagen-trimer binding, a
      contacted BANP domain or pair-specific orthogonal validation. The refinement combines two inspected
      evidence types: the cited interaction study establishes the positive pair, while independent functional
      evidence establishes the bound protein class. It does not infer transcription-factor activity from
      the interaction itself. Applying the campaign instruction to use an evidence-backed specific term
      does not require both facts to originate in one paper. GO:0061629 describes the bound class without
      requiring transcriptional regulation by COL10A1; native compartment separation limits physiological
      interpretation but does not negate the measured heterologous association.'
    supported_by:
