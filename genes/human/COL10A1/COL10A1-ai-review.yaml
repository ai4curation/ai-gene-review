id: Q03692
gene_symbol: COL10A1
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: COL10A1 encodes the alpha-1 chain of type X collagen, a secreted short-chain collagen produced
  by hypertrophic chondrocytes in presumptive mineralization zones of hyaline cartilage. Three chains
  assemble through their C-terminal NC1 domains into homotrimers that contribute to extracellular matrix
  organization during skeletal development. Type X collagen forms higher-order networks in vitro and associates
  with collagen fibrils in tissues. Its isolated human NC1 trimer binds calcium. Dominant pathogenic COL10A1
  variants cause Schmid metaphyseal chondrodysplasia.
