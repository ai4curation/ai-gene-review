core_functions:
- description: Type X collagen chains assemble through their NC1 domains into homotrimers that contribute
    extracellular matrix structure and organization, particularly in hypertrophic cartilage. Higher-order
    networks form in vitro, while fibril-associated arrangements occur in vivo. The isolated human NC1
    trimer binds calcium, without an established calcium-driven mineral-nucleation mechanism.
  molecular_function:
    id: GO:0030020
    label: extracellular matrix structural constituent conferring tensile strength
  directly_involved_in:
  - id: GO:0030198
    label: extracellular matrix organization
  locations:
  - id: GO:0031012
    label: extracellular matrix
  in_complex:
    id: GO:0005599
    label: collagen type X trimer
  supported_by:
  - reference_id: PMID:11839302
    supporting_text: NC1 domain forms a stable homotrimer
  - reference_id: PMID:1860888
  - reference_id: PMID:25037231
  - reference_id: PMID:28344315
suggested_questions:
- question: How does full-length human type X collagen contribute to matrix mechanics and its organization
    relative to collagen II under native cartilage conditions?
  experts: []
- question: Does calcium occupancy of human NC1 alter trimer stability or higher-order assembly at extracellular
    ionic conditions, independently of mineral nucleation?
  experts: []
- question: Which screen-detected precursor interactions occur during collagen biosynthesis in relevant
    human cells, and which depend on the exact partner isoform or fusion construct?
  experts: []
suggested_experiments:
- hypothesis: NC1 calcium coordination affects human collagen-X assembly separately from mineral deposition.
  description: Compare sequence-verified full-length human COL10A1 and structurally controlled calcium-site
    variants under defined extracellular ionic conditions. Quantify secretion, NC1 folding, trimerization,
    higher-order assembly and calcium occupancy separately before testing matrix mechanics or mineral
    deposition.
- hypothesis: Some binary-screen interactions are specific to a collagen precursor or particular partner
    product.
  description: Test exact screen products against precursor, mature chain and assembled collagen-X preparations
    using reciprocal binding assays and controls for folding, tag orientation and secretory processing.
    Establish endogenous proximity in relevant human cells before assigning a native pathway role.
status: DRAFT
