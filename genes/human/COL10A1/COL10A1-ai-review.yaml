- term:
    id: GO:0005509
    label: calcium ion binding
  evidence_type: IDA
  original_reference_id: PMID:11839302
  qualifier: enables
  review:
    summary: The isolated recombinant human NC1 trimer binds calcium.
    action: NEW
    reason: PMID:11839302 provides a 2-angstrom structure with a buried calcium cluster and independent
      inductively coupled plasma analysis after Chelex-treated-buffer dialysis, with an EDTA pre-dialysis
      comparison. The protein is the human C-terminal 161-residue NC1 construct carrying an N-terminal
      His6 tag, produced in E. coli; the result is not a full-length/native-matrix calcium stoichiometry
      or mineral-nucleation assay. GO:0005509 has no ancestor/descendant overlap with any of the 34 seeded
      terms; its two narrower synaptic-buffering descendants do not fit these assays. This is a secondary
      binding capability, not another structural core or a new process. UniProt Q03692 records calcium-coordinating
      sites at residues 626, 627, 633 and 634 and cites this same study and PDB 1GR3; these features corroborate
      the structural assignment but are not a second independent calcium-binding experiment.
    supported_by:
    - reference_id: PMID:11839302
      supporting_text: buried cluster of calcium ions
