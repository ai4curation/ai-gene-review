- term:
    id: GO:0001501
    label: skeletal system development
  evidence_type: TAS
  original_reference_id: PMID:8554571
  qualifier: involved_in
  review:
    summary: Type X collagen contributes to the cartilage matrix involved in skeletal development.
    action: ACCEPT
    reason: 'PMID:8554571 reports a segregating human COL10A1 W651R substitution in Schmid metaphyseal
      chondrodysplasia. That clinical study does not directly measure mutant trimer assembly. The retained
      developmental role is consistent with the matrix-building protein itself: human NC1 assembly in
      PMID:11839302 and the positive chick type X matrix/self-assembly observations in PMID:1860888. No
      new developmental process is inferred from disease association alone. The available clinical and
      structural evidence supports this broad developmental contribution; it does not specifically establish
      the narrower conversion of cartilage to bone or the progression of cartilage during endochondral
      bone morphogenesis. The original TAS term is therefore retained rather than replaced solely from
      tissue expression.'
    supported_by:
    - reference_id: PMID:8554571
    - reference_id: PMID:11839302
    - reference_id: PMID:1860888
