- term:
    id: GO:0002281
    label: macrophage activation involved in immune response
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:1098776
  - PANTHER:PTN000053220
  - UniProtKB:P18428
  review:
    summary: LBP enhances macrophage activation by bacterial cell-wall ligands, downstream of its lipid- and
      cell-wall-binding carrier activity.
    action: KEEP_AS_NON_CORE
    reason: Macrophage activation is a real output of LBP-dependent LPS and pneumococcal cell-wall
      recognition, but it is a cellular response downstream of the core carrier/binding activity rather than a
      distinct core molecular function.
    supported_by:
    - reference_id: PMID:8409400
      supporting_text: LBP was shown to enhance LPS-induced TNF-alpha, IL-6, and IL-8 release by mononuclear
        phagocytic cells
    - reference_id: PMID:12932360
      supporting_text: LBP enhanced PCW-induced cell signaling and TNF-alpha release. LBP bound specifically
        to PCW multimers
    - reference_id: PMID:24120359
      supporting_text: lower cytokine concentrations in pneumonia
