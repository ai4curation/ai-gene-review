suggested_questions:
- question: Should LBP-mediated binding of pneumococcal peptidoglycan/cell wall multimers be captured by a
    specific GO molecular-function term, or is the direct ligand too chemically heterogeneous for a stable
    binding term?
- question: Do any human primary leukocytes or epithelia display a stable host cell-surface pool of LBP, or do
    existing cell-surface annotations conflate soluble LBP coating a bacterial surface with host
    plasma-membrane localization?
suggested_experiments:
- description: Reconstitute purified human LBP, CD14 and TLR2 heterodimers with defined lipoteichoic acid,
    diacylated lipopeptide and triacylated lipopeptide ligands, then measure ligand transfer and final
    receptor complexes by size-exclusion chromatography and native mass spectrometry.
  hypothesis: LBP uses the same mobile-carrier mechanism for LTA and both lipopeptide classes that was shown
    for triacylated lipopeptide delivery to TLR1-TLR2.
  experiment_type: in vitro biochemical reconstitution
- description: Compare fluorescently tagged endogenous human LBP in polarized airway epithelial infection
    assays with markers for bacterial surfaces, host plasma membrane and secreted extracellular fluid.
  hypothesis: LBP secreted by airway epithelia coats Gram-negative bacterial surfaces and does not form a
    stable host cell-surface compartment.
  experiment_type: endogenous tagging and quantitative microscopy
