- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:21988832
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q13162
  review:
    summary: Generic protein binding from the human liver interactome is uninformative for LBP function.
    action: REMOVE
    reason: The PRDX4 interaction comes from a large liver Y2H network and does not define a molecular
      function of LBP; bare GO:0005515 should be removed unless a specific functional binding term is
      justified.
    supported_by:
    - reference_id: PMID:21988832
      supporting_text: the interaction of PRDX4 with APOB, LBP, CYP27A1 and SULT2A1
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:32814053
  qualifier: enables
  supporting_entities:
  - UniProtKB:P23560-2
  review:
    summary: Generic protein binding from a neurodegenerative-disease interactome is uninformative for LBP
      function.
    action: REMOVE
    reason: The BDNF isoform interaction is a broad interactome import in IntAct/UniProt and does not identify
      a specific LBP molecular function; bare GO:0005515 should be removed under the protein-binding policy.
    supported_by:
    - reference_id: PMID:32814053
      supporting_text: Interactome Mapping Provides a Network of Neurodegenerative Disease Proteins
- term:
    id: GO:0005576
    label: extracellular region
  evidence_type: EXP
  original_reference_id: PMID:7517398
  qualifier: located_in
  review:
    summary: LBP is an extracellular secreted glycoprotein and performs its ligand-carrier activity outside
      the cell.
    action: ACCEPT
    reason: Human LBP was cloned as a trace plasma protein, purified recombinant LBP acts extracellularly, and
      the Reactome LPS-transfer reactions model LBP transferring extracellular LPS to soluble or GPI-anchored
      CD14. The STAT3 Reactome row is indirect but still asserts the established extracellular location.
    supported_by:
    - reference_id: PMID:2402637
      supporting_text: The primary structure of lipopolysaccharide binding protein (LBP), a trace plasma
        protein
    - reference_id: PMID:23430250
      supporting_text: LBP and sCD14 have redundant roles in driving TLR1·TLR2·lipopeptide ternary complex
        formation
    - reference_id: PMID:7517398
      supporting_text: LBP is a serum protein which participates in LPS-mediated activation of cells
