- term:
    id: GO:0002752
    label: cell surface pattern recognition receptor signaling pathway
  evidence_type: IDA
  original_reference_id: PMID:15294986
  qualifier: involved_in
  review:
    summary: LBP participates in TLR2 pattern-recognition signaling by handing lipopeptide agonists to CD14
      and the TLR2 receptor complexes.
    action: ACCEPT
    reason: The cited study shows LBP binding lipopeptides and transferring them to CD14 on human monocytes; a
      later reconstitution study showed that LBP itself can catalyze formation of the TLR1-TLR2-lipopeptide
      complex.
    supported_by:
    - reference_id: PMID:15294986
      supporting_text: LBP transfers lipopeptides to CD14 on human monocytes using FACS analysis
    - reference_id: PMID:23430250
      supporting_text: either LBP or sCD14 can drive ternary complex formation and TLR activation by acting as
        mobile carriers of triacylated lipopeptides or lipoproteins
    - reference_id: PMID:23430250
      supporting_text: neither LBP nor sCD14 was physically associated with the final ternary complex
- term:
    id: GO:0005102
    label: signaling receptor binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q61805
  - ensembl:ENSMUSP00000016168
  review:
    summary: LBP can bind a macrophage opsonin receptor and hand lipid cargo to signaling receptor systems,
      but this generic term is peripheral.
    action: KEEP_AS_NON_CORE
    reason: The rabbit LBP paper supports receptor-mediated recognition of LBP-LPS-coated particles by
      macrophages, and human LBP transiently transfers ligands to CD14 and TLR1-TLR2. GO:0005102 is generic
      compared with molecular carrier activity and LPS/lipopeptide binding, but the receptor handoff is real
      enough to keep as non-core.
    supported_by:
    - reference_id: PMID:2477488
      supporting_text: Binding of LBP-coated particles appears to be mediated by a receptor found on blood
        monocytes and MO
    - reference_id: PMID:15294986
      supporting_text: LBP transfers lipopeptides to CD14 on human monocytes using FACS analysis
    - reference_id: PMID:23430250
      supporting_text: neither LBP nor sCD14 was physically associated with the final ternary complex
