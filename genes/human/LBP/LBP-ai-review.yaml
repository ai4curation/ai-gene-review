id: P18428
gene_symbol: LBP
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'Lipopolysaccharide-binding protein (LBP) is a secreted BPI/LBP-family acute-phase glycoprotein found
  in serum and mucosal fluids. It binds bacterial amphiphiles including LPS, lipoteichoic acid and di- or triacylated
  lipopeptides, extracts them from aggregates or microbial surfaces, and transfers them to CD14 or directly to TLR1-TLR2
  to sensitize Toll-like receptor signaling. LBP can also opsonize LPS-bearing particles and, at high acute-phase
  concentrations, dampen LPS transfer to monocytes.'
existing_annotations:
- term:
    id: GO:0001530
    label: lipopolysaccharide binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - MGI:MGI:1098776
  - PANTHER:PTN002471180
  - RGD:1303179
  - RGD:61865
  - UniProtKB:P17213
  - UniProtKB:P18428
  review:
    summary: LBP binds bacterial lipopolysaccharide as a core ligand of its extracellular lipid-transfer
      function.
    action: ACCEPT
    reason: Direct human LPS competition and transfer studies, the 2013 structural/SNP study, and the rabbit
      ortholog transfer all support LBP binding LPS as a central molecular function; the PAINT and Ensembl
      transfers converge on the same claim.
    supported_by:
    - reference_id: PMID:8409400
      supporting_text: LBP and BPI have counteractive effects on LPS-induced mononuclear phagocytic cell
        cytokine release by competing for binding to LPS
    - reference_id: PMID:11739189
      supporting_text: an acute-phase protein recognizing lipopolysaccharide (LPS), catalyzes in low
        concentrations its transfer to the cellular LPS receptor consisting of CD14 and Toll-like receptor-4
    - reference_id: PMID:24120359
      supporting_text: reduced binding capacity for LPS and lipopeptides
    - reference_id: PMID:7517398
      supporting_text: purified recombinant human LBP can replace the serum requirement for both LPS binding
        to human monocytes and LPS-mediated secretion of tumor necrosis factor alpha from these cells
