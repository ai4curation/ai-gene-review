- term:
    id: GO:0051607
    label: defense response to virus
  qualifier: involved_in
  evidence_type: IMP
  original_reference_id: PMID:30510222
  review:
    summary: 'G3BP1 is required for efficient interferon responses to DNA virus infection: HSV-1-induced
      IFN-beta is greatly attenuated in G3BP1-deficient cells. It also participates in RIG-I sensing of
      viral RNA, and is targeted for cleavage or sequestration by a long list of viruses.'
    action: ACCEPT
    reason: Supported by infection experiments in G3BP1-deficient cells, not only by transfection surrogates.
      The breadth of viral countermeasures against G3BP1 (aphthovirus Lpro and enterovirus cleavage, alphavirus
      nsP3 sequestration, coronavirus N-protein capture) is independent corroboration that the antiviral
      role is real. Core, as the defence output of both the sensor-priming and the granule arms.
    supported_by:
    - reference_id: PMID:30510222
      supporting_text: We infected wild-type and G3BP1-deficient U937 cells with HSV-1 and found that
        the HSV-1-induced IFN-β production in G3BP1-deficient cells was greatly attenuated compared with
        that in wild-type U937 cells (Fig.
      reference_section_type: RESULTS
    - reference_id: PMID:30510222
      supporting_text: Our data also suggest that G3BP1 contributes to cGAS-mediated antiviral responses.
      reference_section_type: DISCUSSION
    - reference_id: PMID:30804210
      supporting_text: Thus, our current data revealed a role for G3BP1 in host anti-viral response by
        directly participating in RIG-I signaling and inducing IFN-β production.
      reference_section_type: DISCUSSION
    - reference_id: PMID:30404792
      supporting_text: Additionally, we show that L pro cleaves the known SG scaffold proteins G3BP1 and
        G3BP2 but not TIA-1.
      reference_section_type: ABSTRACT
- term:
    id: GO:0062029
    label: positive regulation of cytoplasmic stress granule assembly
  qualifier: involved_in
  evidence_type: NAS
  original_reference_id: PMID:36279435
  review:
    summary: A ComplexPortal NAS row projected from CPX-21432, the CAPRIN1-G3BP1 complex. CAPRIN1 binding
      to the G3BP1 NTF2 pocket promotes granule assembly, where USP10 binding to the same pocket suppresses
      it.
    action: KEEP_AS_NON_CORE
    reason: 'True as stated, and distinct from GO:0034063 (a regulation term is not an ancestor or descendant
      of the process it regulates), so this is added coverage rather than redundancy. Non-core because
      the regulatory polarity belongs to the partner: G3BP1 supplies the shared NTF2 pocket and is the
      thing being tuned, while CAPRIN1 and USP10 set the direction. The NAS code is apt, since the cited
      paper states the promoting role as background citing earlier work and contributes structures of
      the two GIM complexes.'
    supported_by:
    - reference_id: PMID:27022092
      supporting_text: "Caprin binding \npromotes, but USP10 binding inhibits, SG formation."
      reference_section_type: ABSTRACT
    - reference_id: PMID:36279435
      supporting_text: 'Caprin-1 and USP10 have antagonistic effects on SGs: Caprin-1 promotes SGs, whereas
        USP10 suppresses SGs (5, 22, 23).'
      reference_section_type: INTRODUCTION
    - reference_id: PMID:32302571
      supporting_text: For example, interaction of NTF2L with caprin-1 and UBAP2L promotes SG assembly,
        whereas interaction with USP10 limits assembly (Kedersha et al., 2016; Markmiller et al., 2018;
        Panas et al., 2015; Youn et al., 2018).
      reference_section_type: INTRODUCTION
- term:
    id: GO:0062030
    label: negative regulation of cytoplasmic stress granule assembly
  qualifier: involved_in
  evidence_type: IDA
  original_reference_id: PMID:27022092
  review:
    summary: A ComplexPortal row projected from CPX-26721, the G3BP1-USP10 complex. USP10 bound to the
      G3BP1 NTF2 pocket lowers G3BP1's effective valence, giving an assembly-incompetent state.
    action: KEEP_AS_NON_CORE
    reason: 'The negative claim is real and was directly assayed: CAPRIN1 and USP10 binding to G3BP1 are
      mutually exclusive, and the USP10-bound form inhibits granule formation. It does not contradict
      the accepted GO:0034063 row, because the two describe opposite states of the same switch. Non-core
      for the same reason as the positive-regulation row, and consistent with how USP10''s own negative-regulation
      rows are treated in this project.'
