- term:
    id: GO:0003729
    label: mRNA binding
  qualifier: enables
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  supporting_entities:
  - AGI_LocusCode:AT2G03640
  - AGI_LocusCode:AT3G25150
  - AGI_LocusCode:AT5G60980
  - MGI:MGI:1351465
  - PANTHER:PTN000074904
  - UniProtKB:Q587B0
  - ZFIN:ZDB-GENE-030131-7452
  review:
    summary: 'mRNA binding is the informative RNA-binding term for G3BP1 and is central to its mechanism:
      binding of unfolded, polysome-released mRNA is what releases the autoinhibited conformation and
      triggers condensation.'
    action: ACCEPT
    reason: Well supported and mechanistically core. The IBA sits at PANTHER node PTN000074904 with a
      broad donor set spanning Arabidopsis, mouse, zebrafish and fission yeast, and the claim is independently
      grounded in human by two mRNA interactome capture studies and by the 2020 reconstitution work on
      the RNA-dependent conformational switch.
    supported_by:
    - reference_id: PMID:32302572
      supporting_text: We show that G3BP1 adopts an autoinhibitory compact state under non-stress conditions
        that is stabilized by electrostatic interactions between the positively charged RG-rich region
        and a disordered acidic region.
      reference_section_type: RESULTS
    - reference_id: PMID:32302572
      supporting_text: This results in assembly of G3BP1 clusters that physically crosslink RNA molecules
        to form inhomogeneous G3BP1-RNA condensates of low protein density.
      reference_section_type: RESULTS
    - reference_id: PMID:22658674
      supporting_text: "we describe a systematic, unbiased, and comprehensive approach, termed \n\"interactome\
        \ capture,\" to define the mRNA interactome of proliferating human \nHeLa cells."
      reference_section_type: ABSTRACT
    - reference_id: file:human/G3BP1/G3BP1-uniprot.txt
      supporting_text: |-
        FT   DOMAIN          340..415
        FT                   /note="RRM"
      record_section:
      - FT:DOMAIN
