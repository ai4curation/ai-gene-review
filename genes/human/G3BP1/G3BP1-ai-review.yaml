- description: Scaffolding activator of cytosolic nucleic-acid sensors. G3BP1 promotes the formation of
    large cGAS complexes and thereby cGAS DNA binding, and binds RIG-I together with viral double-stranded
    RNA through its RG-rich region, in both cases raising type I interferon output. Cells lacking G3BP1
    show inefficient cGAS DNA binding, diminished IRF3 phosphorylation and attenuated interferon-beta
    on cytosolic DNA or virus infection. This is the same multivalent-clustering activity used on mRNA,
    applied to a sensor instead.
