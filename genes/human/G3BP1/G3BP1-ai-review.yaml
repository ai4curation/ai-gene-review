- term:
    id: GO:0140693
    label: molecular condensate scaffold activity
  qualifier: enables
  evidence_type: IDA
  original_reference_id: PMID:32302570
  review:
    summary: 'This is G3BP1''s core molecular function. G3BP1 is the central node of the stress-granule
      protein-RNA network and acts as an RNA-dependent switch: NTF2-mediated dimerisation plus the RG-rich
      region crosslink mRNA molecules into a networked condensate, with the acidic disordered region holding
      the protein in an autoinhibited state until unfolded mRNA outcompetes it.'
    action: ACCEPT
    reason: Five IDA rows from independent groups, including all three of the 2020 reconstitution papers,
      support exactly the term's definition (binding and bringing macromolecules together so they organize
      as a condensate). Deletion of either the NTF2L domain or the RNA-binding domain abolishes RNA-dependent
      phase separation, so both halves of the scaffold are required. The ARBA-derived IEA row is a prediction
      but agrees with the experimental rows, and consistency requires one action for the term.
    supported_by:
    - reference_id: PMID:32302571
      supporting_text: The central node of this network is G3BP1, which functions as a molecular switch
        that triggers RNA-dependent LLPS in response to a rise in intracellular free RNA concentrations.
      reference_section_type: ABSTRACT
    - reference_id: PMID:32302571
      supporting_text: Biophysical studies revealed details of how G3BP1 functions as a molecular switch
        that triggers RNA-dependent LLPS.
      reference_section_type: RESULTS
    - reference_id: PMID:32302572
      supporting_text: We show that G3BP1 adopts an autoinhibitory compact state under non-stress conditions
        that is stabilized by electrostatic interactions between the positively charged RG-rich region
        and a disordered acidic region.
      reference_section_type: RESULTS
    - reference_id: PMID:32302572
      supporting_text: This results in assembly of G3BP1 clusters that physically crosslink RNA molecules
        to form inhomogeneous G3BP1-RNA condensates of low protein density.
      reference_section_type: RESULTS
    - reference_id: PMID:32302572
      supporting_text: No phase separation was observed for G3BP1(ΔNTF), demonstrating that G3BP1 dimerization
        is also critical for RNA-independent assembly, presumably by doubling the valence of motifs that
        drive phase separation.
      reference_section_type: RESULTS
    - reference_id: PMID:32302571
      supporting_text: Deletion of NTF2L or the RBD abolished LLPS of G3BP1 in the presence of RNA (Figure
        3C–E).
      reference_section_type: RESULTS
    - reference_id: file:human/G3BP1/G3BP1-uniprot.txt
      supporting_text: |-
        Promotes formation of stress granules phase-separated membraneless
        CC       compartment by undergoing liquid-liquid phase separation (LLPS) upon
        CC       unfolded RNA-binding: functions as a molecular switch that triggers
        CC       RNA-dependent LLPS in response to a rise in intracellular free RNA
        CC       concentrations
      record_section:
      - CC:FUNCTION
    - reference_id: file:human/G3BP1/G3BP1-uniprot.txt
      supporting_text: |-
        Can mediate both protein-protein and protein-RNA interactions
        CC       via the NTF2 domain and RNA-binding domain RRM; protein-protein and
        CC       protein-RNA interactions are essential for undergoing liquid-liquid
        CC       phase separation (LLPS).
      record_section:
      - CC:DOMAIN
