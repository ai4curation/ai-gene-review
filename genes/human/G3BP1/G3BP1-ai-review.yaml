- term:
    id: GO:0005634
    label: nucleus
  qualifier: located_in
  evidence_type: EXP
  original_reference_id: PMID:11604510
  review:
    summary: A minor, phosphorylation-gated pool. G3BP1 is cytosolic and partially nuclear in resting
      cells, and a Ser149 phosphomimetic mutant relocates to the nucleus while the non-phosphorylatable
      mutant stays exclusively cytoplasmic.
    action: KEEP_AS_NON_CORE
    reason: 'Real and directly shown by mutant localisation, so retained, but peripheral: every characterised
      function of G3BP1 (condensate scaffolding, 40S association, sensor priming) happens in the cytosol,
      and no nuclear activity has been established. The TAS row from PMID:9889278 reflects that paper''s
      HeLa nuclear-extract purification rather than an independent localisation experiment, but the claim
      itself stands on PMID:11604510.'
    supported_by:
    - reference_id: PMID:11604510
      supporting_text: Furthermore, all double mutants that harbored the S149E mutation translocated to
        the nucleus (panels EE and EA), indicating that the phosphorylation of Ser-149 is important for
        G3BP nuclear entry.
      reference_section_type: RESULTS
    - reference_id: file:human/G3BP1/G3BP1-uniprot.txt
      supporting_text: |-
        Cytosolic
        CC       and partially nuclear in resting cells (PubMed:11604510).
      record_section:
      - CC:SUBCELLULAR LOCATION
