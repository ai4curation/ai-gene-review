- term:
    id: GO:0005829
    label: cytosol
  qualifier: is_active_in
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  supporting_entities:
  - FB:FBgn0015778
  - PANTHER:PTN000074904
  - SGD:S000005334
  - UniProtKB:Q13283
  - UniProtKB:Q9UN86
  review:
    summary: Where the switch sits before and between granules. Endogenous G3BP1 is diffusely cytoplasmic
      in unstressed cells and condenses out of that pool on stress; the is_active_in qualifier is apt,
      since the RNA-dependent conformational switch operates in the cytosol.
    action: ACCEPT
    reason: Multiple independent lines (IDA, a broadly seeded IBA, UniProt subcellular-location curation
      and a Reactome pathway placement) and mechanistically load-bearing rather than incidental.
    supported_by:
    - reference_id: PMID:20180778
      supporting_text: This process can be visualized by the change in intracellular localization of endogenous
        G3BP, from a diffuse distribution throughout the cytoplasm to the large stress granule structures.
      reference_section_type: RESULTS
    - reference_id: PMID:32302572
      supporting_text: We show that G3BP1 adopts an autoinhibitory compact state under non-stress conditions
        that is stabilized by electrostatic interactions between the positively charged RG-rich region
        and a disordered acidic region.
      reference_section_type: RESULTS
