- term:
    id: GO:0016579
    label: protein deubiquitination
  qualifier: involved_in
  evidence_type: IDA
  original_reference_id: PMID:34469731
  review:
    summary: A ComplexPortal row projected from CPX-26721, the G3BP1-USP10 deubiquitinase complex. The
      catalysis is USP10's; G3BP1's contribution is to hold the complex on its 40S substrate via the RG-rich
      region.
    action: KEEP_AS_NON_CORE
    reason: 'Kept because G3BP1 does part of the work: it associates preferentially with 40S subunits
      and carries USP10 bound to that pool, so it presents the substrate even though it has no catalytic
      domain. involved_in is therefore right and GO:0004843 cysteine-type deubiquitinase activity would
      be wrong for G3BP1. Non-core: this is one output of the NTF2-domain partner interactions, not what
      the protein is for. Note the cited paper (Garshott et al., iRQC) is about RNF10 and USP10 acting
      on uS3/uS5 and does not mention G3BP; that is expected for a complex-level assertion projected onto
      a member, and is not treated here as a misattribution.'
    supported_by:
    - reference_id: PMID:27022092
      supporting_text: Thus, G3BP associates preferentially to 40S ribosomal subunits rather than 80S
        ribosomes, and both Caprin1 and USP10 are bound to 40S-associated G3BP.
      reference_section_type: RESULTS
    - reference_id: PMID:27022092
      supporting_text: IP analysis reveals that the RGG region is required for association with the 40S
        subunits (Fig.
      reference_section_type: RESULTS
- term:
    id: GO:0016887
    label: ATP hydrolysis activity
  qualifier: enables
  evidence_type: EXP
  original_reference_id: PMID:9889278
  review:
    summary: ATP hydrolysis activity, asserted only as the energy source for the discredited helicase
      activity. G3BP1 has no Walker A or Walker B motif and no annotated nucleotide-binding site.
    action: REMOVE
    reason: 'The EXP row cites PMID:9889278 directly and the RHEA row derives from the UniProt CC CATALYTIC
      ACTIVITY line, whose only evidence tag is the same paper, so this is the helicase claim restated
      as its ATPase half. All twelve helicase/ATPase rows on this gene trace to one 1999 report (PMID:9889278)
      that purified an unwinding activity from HeLa nuclear extract and identified the band by microsequencing
      as G3BP. Microsequencing shows which protein is in the band, not which carries the activity, and
      the result has not been reproduced in the 27 years since. G3BP1 also has none of the machinery the
      activity requires: a motif and signature scan (file:human/G3BP1/G3BP1-bioinformatics/RESULTS.md)
      finds zero hits for Walker A/P-loop, Walker B, DExD/H box and three further SF1/SF2 motifs, no helicase
      or RecA/AAA/P-loop ATPase signature among the entry''s 19, and no annotated nucleotide-binding site,
      while the same test flags DDX3X, EIF4A3, BLM and UPF1 and clears the two folds G3BP1 is actually
      made of (NTF2, RRM+RGG). The annotated domains tile the whole 466-residue protein, leaving no room
      for the two RecA-like lobes. Removal is coordinated across the IDA, TAS, EXP, EC-based IEA and IBA
      rows, since they are one claim, not several.'
    supported_by:
    - reference_id: PMID:9889278
      supporting_text: |-
        Microsequencing of the
        polypeptide showed that this enzyme corresponds to G3BP, an element of the Ras
        pathway which binds specifically to the GTPase-activating protein.
      reference_section_type: ABSTRACT
    - reference_id: file:human/G3BP1/G3BP1-bioinformatics/RESULTS.md
      supporting_text: |-
        **All six motif searches return zero hits.** No Walker A/P-loop, no Walker B, no
          DExD/H box, no motif VI arginine finger, no motif III, no Q motif.
    - reference_id: file:human/G3BP1/G3BP1-bioinformatics/RESULTS.md
      supporting_text: |-
        **None of the entry's 19 domain/family signatures** names a helicase or a
          RecA/AAA/P-loop ATPase
    - reference_id: file:human/G3BP1/G3BP1-bioinformatics/RESULTS.md
      supporting_text: |-
        `controls_behave_as_expected: true` — all four positive controls are flagged, and
        neither fold-matched negative control is.
    - reference_id: file:human/G3BP1/G3BP1-bioinformatics/RESULTS.md
      supporting_text: |-
        leaving no unassigned region that could host the two
          RecA-like lobes an ATP-dependent helicase requires (each is ~200 residues).
    - reference_id: file:human/G3BP1/G3BP1-bioinformatics/RESULTS.md
      supporting_text: |-
        **Q13283 is the only member of the family, in any species, with experimental
          evidence for any helicase term.**
    - reference_id: file:human/G3BP1/G3BP1-bioinformatics/RESULTS.md
      supporting_text: |-
        **Helicase rows occur in exactly one subfamily, SF21** — the G3BP1 orthologs. The
          paralogous SF10 subfamily (G3BP2, in all three species that have a reviewed entry)
          has none, as do the fungal, nematode and plant members.
    - reference_id: PMID:9889278
      supporting_text: |-
        The enzyme shows ATP- and Mg2+-dependent
        activity is not stimulated by RPA, prefers partially unwound 3'-tailed
        substrates and moves along the bound strand in the 5' to 3' direction.
      reference_section_type: ABSTRACT
