- term:
    id: GO:0043024
    label: ribosomal small subunit binding
  qualifier: enables
  evidence_type: IDA
  original_reference_id: PMID:27022092
  review:
    summary: G3BP1 associates with 40S ribosomal subunits, preferentially over 80S ribosomes, through
      its RG-rich region, and that region is required for granule assembly. This is how stalled preinitiation
      complexes are brought into stress granules.
    action: ACCEPT
    reason: 'Specific, informative and directly assayed: immunoprecipitation maps the requirement to the
      RGG region, the same region whose deletion abolishes G3BP-mediated assembly. Part of the core scaffolding
      mechanism rather than a peripheral interaction.'
    supported_by:
    - reference_id: PMID:27022092
      supporting_text: IP analysis reveals that the RGG region is required for association with the 40S
        subunits (Fig.
      reference_section_type: RESULTS
    - reference_id: PMID:27022092
      supporting_text: Thus, G3BP associates preferentially to 40S ribosomal subunits rather than 80S
        ribosomes, and both Caprin1 and USP10 are bound to 40S-associated G3BP.
      reference_section_type: RESULTS
    - reference_id: PMID:27022092
      supporting_text: G3BP-mediated SG assembly is inhibited by serine 149 phosphorylation, regulated
        by mutually exclusive binding of Caprin1 and USP10, and requires its RGG region that allows interactions
        with 40S subunits.
      reference_section_type: RESULTS
