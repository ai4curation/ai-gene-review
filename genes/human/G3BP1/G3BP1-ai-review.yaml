references:
- id: PMID:9889278
  title: 'Human DNA helicase VIII: a DNA and RNA helicase corresponding to the G3BP protein, an element
    of the ras transduction pathway.'
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: 'Correctly cited: this really is the source of the DNA/RNA helicase and ATP hydrolysis
      annotations and of the UniProt EC numbers and the ''ATP-dependent DNA helicase VIII'' name. Marked
      DISPUTED rather than MISCITED because the problem is the claim, not the citation. The activity was
      purified from HeLa nuclear extract and assigned to G3BP by microsequencing of the band, which cannot
      distinguish the active protein from an abundant co-purifying one; it has not been reproduced in
      27 years; and G3BP1 has no Walker A, Walker B or DExD/H motif, no helicase or RecA/AAA/P-loop signature
      and no annotated nucleotide-binding site (see file:human/G3BP1/G3BP1-bioinformatics/RESULTS.md).
      Abstract-only in the cache.'
- id: PMID:8649363
  title: A Ras-GTPase-activating protein SH3-domain-binding protein.
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: 'The paper that discovered and named G3BP. Correctly cited for the RASA1 SH3-domain
      interaction, which is a real result. It does not establish a role in relaying Ras signals; the authors
      say the coimmunoprecipitation ''suggests'' complex recruitment. Relevance is MEDIUM: historically
      important and the origin of the gene name, but superseded as a guide to function.'
- id: PMID:32302571
  title: G3BP1 Is a Tunable Switch that Triggers Phase Separation to Assemble Stress Granules.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Yang et al., one of the three 2020 Cell papers. Directly establishes the core function:
      G3BP1 as the central network node and RNA-dependent switch, with the NTF2L and RNA-binding domains
      both required for LLPS and the G3BP1/2 double knockout devoid of granules. Verified against the
      cached full text. Note that the cached title for this PMID is the Yang ''tunable switch'' paper
      and the companion Guillen-Boixet paper is PMID:32302572, which is easy to transpose.'
- id: PMID:32302572
  title: RNA-Induced Conformational Switching and Clustering of G3BP Drive Stress Granule Assembly by
    Condensation.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Guillen-Boixet et al. Establishes the autoinhibited compact state, its release by unfolded
      mRNA, the requirement for NTF2-mediated dimerisation, and physical crosslinking of RNA into condensates.
      Verified against the cached full text.
- id: PMID:32302570
  title: Competing Protein-RNA Interaction Networks Control Multiphase Intracellular Organization.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Sanders et al. Correctly cited for the competing-network framework and the RNA-influx
      condensation model. Abstract-only in the cache, and the cached abstract does not name G3BP1, so
      G3BP1-specific claims in this review are anchored on PMID:32302571 and PMID:32302572 instead; this
      reference supports the general mechanism.
- id: PMID:27022092
  title: G3BP-Caprin1-USP10 complexes mediate stress granule condensation and associate with 40S subunits.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Kedersha et al. The key genetic and partner-mapping paper: G3BP1/2 double knockout
      cannot form granules on eIF2-alpha phosphorylation or eIF4A inhibition, CAPRIN1 and USP10 binding
      are mutually exclusive and opposite in effect, and the RGG region mediates 40S association and is
      required for assembly. Verified against the cached full text. Has a published erratum (J Cell Biol
      2020;219(1)) that does not affect these conclusions.'
- id: PMID:23279204
  title: Both G3BP1 and G3BP2 contribute to stress granule formation.
