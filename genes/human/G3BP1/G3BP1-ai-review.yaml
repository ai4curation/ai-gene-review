    label: focal adhesion
  qualifier: located_in
  evidence_type: HDA
  original_reference_id: PMID:21423176
  review:
    summary: A single high-throughput row from a 905-protein isolated-focal-adhesion proteome whose own
      authors state that half the list may be non-specific contaminants. No follow-up localises G3BP1
      to adhesions.
    action: MARK_AS_OVER_ANNOTATED
    reason: An abundant cytosolic condensate-forming protein appearing once in an isolated-adhesion preparation
      is what co-isolating background looks like. The source paper makes no claim about G3BP1 (it is not
      named in the available text, only in supplementary tables) and nothing in the focal-adhesion or
      stress-granule literature since has placed G3BP1 at adhesions. Not removed outright, because the
      mass spectrometry detection itself is not in doubt and adhesion-proximal translational control is
      not absurd; but the location should not be read as established.
    supported_by:
    - reference_id: PMID:21423176
      supporting_text: More importantly, we show that protein abundance of half (459/905) the FA proteome
        is altered by myosinII activity and half remain constant as core FA components or non-specific
        contaminants.
      reference_section_type: DISCUSSION
    - reference_id: PMID:21423176
      supporting_text: Our FA proteome contained 905 proteins, supporting the notion that FA are complex
        organelles.
      reference_section_type: RESULTS
- term:
    id: GO:0007265
    label: Ras protein signal transduction
  qualifier: involved_in
  evidence_type: TAS
  original_reference_id: PMID:8649363
  review:
    summary: A single TAS row from the 1996 paper that named the gene. G3BP1 binds the SH3 domain of the
      RasGAP RASA1 in proliferating cells, but no step at which G3BP1 relays a Ras signal has ever been
      identified.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'The term requires an intracellular signaling cassette in which a Ras-subfamily GTPase relays
      a signal. Binding the SH3 domain of a GAP does not show that G3BP1 relays anything, and the source
      paper itself only says the result ''suggests'' recruitment of a GAP-G3BP complex. Thirty years on,
      UniProt carries the RASA1 interaction as ''By similarity'' only, i.e. not from a human experiment.
      Not removed outright because a residual thread survives: HRAS-dependent dephosphorylation of G3BP1
      gates its recruitment to granules, so the gene is not wholly outside Ras signalling.'
    supported_by:
    - reference_id: PMID:8649363
      supporting_text: "G3BP physically associates with the SH3 domain of \nGAP, which previously had\
        \ been shown to be essential for Ras signaling."
      reference_section_type: ABSTRACT
    - reference_id: PMID:8649363
      supporting_text: "G3BP \ncoimmunoprecipitates with GAP only when cells are in a proliferating state,\
        \ \nsuggesting a recruitment of a GAP-G3BP complex when Ras is in its activated \nconformation."
      reference_section_type: ABSTRACT
    - reference_id: file:human/G3BP1/G3BP1-uniprot.txt
      supporting_text: |-
        Binds to the SH3 domain of Ras GTPase-
        CC       activating protein (RASA1) in proliferating cells (By similarity). No
        CC       interaction in quiescent cells (By similarity).
      record_section:
      - CC:SUBUNIT
