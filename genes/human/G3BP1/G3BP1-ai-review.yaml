suggested_questions:
- question: Has any laboratory reproduced ATP-dependent DNA or RNA unwinding by recombinant G3BP1? If
    not, should UniProt retire EC 3.6.4.12 and EC 3.6.4.13 and the 'ATP-dependent DNA helicase VIII' name
    outright, or replace them with a CAUTION? The two EC numbers currently generate IEA GO rows for DNA
    and RNA helicase activity, so the record change and the annotation change need to happen together.
  experts:
  - UniProt curators
  - GO Central
- question: Is the CA-specific endoribonuclease activity reported for G3BP1 real? The original authors
    state there is no direct in vivo proof, no catalytic residues have been assigned, and the activity
    has not been independently reproduced. GOA currently carries no endoribonuclease term for G3BP1, which
    seems right, but UniProt still describes the activity.
  experts:
  - RNA decay community
  - UniProt curators
- question: Is the Ser149-phosphorylated nuclear pool of G3BP1 functional, or an equilibrium consequence
    of charge neutralisation? The nucleus rows are kept here as non-core because no nuclear activity has
    been established.
  experts:
  - Stress granule community
- question: Would GO benefit from a way to say that one condensate-scaffold activity is deployed on different
    clients? G3BP1 uses the same multivalent clustering on mRNA (granule assembly) and on cGAS (sensor
    activation), and the only way to express the second at present is through a regulation-of-process
    term, which loses the mechanism.
  experts:
  - GO Central
  - condensate biology community
- question: Should the mutually exclusive CAPRIN1 and USP10 occupancy of the single G3BP1 NTF2 pocket
    be modelled as a GO-CAM with three states, rather than as separate positive- and negative-regulation
    rows on G3BP1? The two ComplexPortal complexes (CPX-21432 and CPX-26721) are alternative states of
    one switch, not two independent activities.
  experts:
  - GO-CAM curators
  - ComplexPortal
suggested_experiments:
- hypothesis: Recombinant human G3BP1 has no ATP-dependent helicase or ATPase activity; the 1999 HeLa
    nuclear-extract activity belonged to a co-purifying protein.
  description: Express and purify full-length human G3BP1 and the isolated NTF2 and RRM-RGG fragments
    from a heterologous host, and assay (i) ATP hydrolysis by malachite green or coupled NADH-depletion,
    and (ii) unwinding of the exact substrates used in the original report (17 bp duplexes with 3' and
    5'/3' tails, DNA/DNA, RNA/DNA and RNA/RNA), with a DEAD-box helicase such as EIF4A3 as a positive
    control and a catalytically dead Walker B mutant of it as a negative. Re-fractionate HeLa nuclear
    extract over the original scheme and identify every protein in the active fraction by modern mass
    spectrometry rather than by microsequencing a single band, to name the protein that actually carries
    the activity.
  experiment_type: biochemical reconstitution
- hypothesis: G3BP1 activates cGAS by the same multivalent-crosslinking mechanism it uses to build stress
    granules, so the separation-of-function mutants that block granule assembly should also block cGAS
    priming.
  description: In G3BP1/2 double-knockout cells, reconstitute with the mutant panel already characterised
    for granule assembly (NTF2L deletion, RG-rich deletion, acidic-region deletion, the phosphomimetic
    S149E, and the F33W pocket mutant that cannot bind CAPRIN1 or USP10) and measure in parallel arsenite-induced
    granule formation, cGAS-DNA binding, cGAMP production and IFN-beta induction. A mutant series in which
    the two readouts track each other would show one activity with two clients; divergence would mean
    the sensor arm is mechanistically separate and deserves its own molecular-function treatment.
  experiment_type: structure-function analysis
- hypothesis: G3BP1 is not located at focal adhesions; the single proteomics detection reflects co-isolation
    of an abundant cytosolic protein.
  description: Image endogenously tagged G3BP1 together with paxillin or vinculin in spreading and migrating
    fibroblasts, under unstressed conditions and after arsenite, using TIRF to restrict the volume to
    the ventral membrane. Quantify colocalisation against a cytosolic volume-marker control, which sets
    the expected background for an abundant soluble protein. If the row is to be kept, it needs an enrichment
    above that control.
  experiment_type: imaging
