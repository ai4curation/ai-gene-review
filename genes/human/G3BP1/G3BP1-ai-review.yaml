- term:
    id: GO:0034063
    label: stress granule assembly
  qualifier: involved_in
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  supporting_entities:
  - FB:FBgn0015778
  - PANTHER:PTN000074905
  - PomBase:SPBP8B7.11
  - SGD:S000005334
  - UniProtKB:Q13283
  - UniProtKB:Q9UN86
  review:
    summary: The core biological process. Cells lacking both G3BP1 and G3BP2 cannot form stress granules
      in response to eIF2-alpha phosphorylation or eIF4A inhibition, either paralog alone restores assembly,
      and G3BP1 overexpression nucleates granules without stress.
    action: ACCEPT
    reason: 'Converging evidence of every kind: double-knockout loss of function, single-paralog rescue,
      sufficiency on overexpression, and a reconstituted biophysical mechanism. The IBA sits at PANTHER
      node PTN000074905, seeded across fly, both fission and budding yeast and both human paralogs, so
      the inheritance claim is well grounded too. Note the requirement is stress-specific: the same study
      found cells remain granule-competent under severe heat or osmotic stress, so this is not an unconditional
      dependency.'
    supported_by:
    - reference_id: PMID:27022092
      supporting_text: "We now show that cells lacking both G3BP1 and G3BP2 \ncannot form SGs in response\
        \ to eukaryotic initiation factor 2α phosphorylation \nor eIF4A inhibition"
      reference_section_type: ABSTRACT
    - reference_id: PMID:32302571
      supporting_text: In contrast, cells with double knockout of G3BP1 and G3BP2 (hereafter referred
        to as G3BP1/2 dKO cells) were devoid of SGs (Figure 1G, Table S2), as previously reported (Kedersha
        et al., 2016).
      reference_section_type: RESULTS
    - reference_id: PMID:32302571
      supporting_text: Expression of GFP-G3BP1 or GFP-G3BP2 were each sufficient to restore SG assembly
        in response to arsenite in G3BP1/2 dKO cells based on 17 markers, indicating that these two proteins
        are redundant with respect to supporting SG assembly (Figure 1I–J, Table S2).
      reference_section_type: RESULTS
    - reference_id: PMID:23279204
      supporting_text: "Ras-GTPase-activating protein SH3 domain-binding protein 1 (G3BP1) is a \ncomponent\
        \ of SGs that initiates the assembly of SGs by forming a multimer."
      reference_section_type: ABSTRACT
    - reference_id: PMID:23279204
      supporting_text: "Although single knockdown of either G3BP1 or G3BP2 in 293T cells \npartially reduced\
        \ the number of SG-positive cells induced by arsenite, the \nknockdowns of both genes significantly\
        \ reduced the number."
      reference_section_type: ABSTRACT
    - reference_id: PMID:20180778
      supporting_text: The overexpression of G3BP1 alone resulted in mostly complete perinuclear stress
        granule formation.
      reference_section_type: RESULTS
    - reference_id: PMID:30404792
      supporting_text: Additionally, we show that L pro cleaves the known SG scaffold proteins G3BP1 and
        G3BP2 but not TIA-1.
      reference_section_type: ABSTRACT
