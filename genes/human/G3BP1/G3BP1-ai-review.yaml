- term:
    id: GO:0033677
    label: DNA/RNA helicase activity
  qualifier: enables
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  supporting_entities:
  - PANTHER:PTN002581351
  - UniProtKB:Q13283
  review:
    summary: DNA/RNA helicase activity, from the same single unreproduced 1999 report; G3BP1 has no nucleotide-binding
      core.
    action: REMOVE
    reason: 'All twelve helicase/ATPase rows on this gene trace to one 1999 report (PMID:9889278) that
      purified an unwinding activity from HeLa nuclear extract and identified the band by microsequencing
      as G3BP. Microsequencing shows which protein is in the band, not which carries the activity, and
      the result has not been reproduced in the 27 years since. G3BP1 also has none of the machinery the
      activity requires: a motif and signature scan (file:human/G3BP1/G3BP1-bioinformatics/RESULTS.md)
      finds zero hits for Walker A/P-loop, Walker B, DExD/H box and three further SF1/SF2 motifs, no helicase
      or RecA/AAA/P-loop ATPase signature among the entry''s 19, and no annotated nucleotide-binding site,
      while the same test flags DDX3X, EIF4A3, BLM and UPF1 and clears the two folds G3BP1 is actually
      made of (NTF2, RRM+RGG). The annotated domains tile the whole 466-residue protein, leaving no room
      for the two RecA-like lobes. Removal is coordinated across the IDA, TAS, EXP, EC-based IEA and IBA
      rows, since they are one claim, not several.'
    supported_by:
    - reference_id: PMID:9889278
      supporting_text: |-
        Microsequencing of the
        polypeptide showed that this enzyme corresponds to G3BP, an element of the Ras
        pathway which binds specifically to the GTPase-activating protein.
      reference_section_type: ABSTRACT
    - reference_id: file:human/G3BP1/G3BP1-bioinformatics/RESULTS.md
      supporting_text: |-
        **All six motif searches return zero hits.** No Walker A/P-loop, no Walker B, no
          DExD/H box, no motif VI arginine finger, no motif III, no Q motif.
    - reference_id: file:human/G3BP1/G3BP1-bioinformatics/RESULTS.md
      supporting_text: |-
        **None of the entry's 19 domain/family signatures** names a helicase or a
          RecA/AAA/P-loop ATPase
    - reference_id: file:human/G3BP1/G3BP1-bioinformatics/RESULTS.md
      supporting_text: |-
        `controls_behave_as_expected: true` — all four positive controls are flagged, and
        neither fold-matched negative control is.
    - reference_id: file:human/G3BP1/G3BP1-bioinformatics/RESULTS.md
      supporting_text: |-
        leaving no unassigned region that could host the two
          RecA-like lobes an ATP-dependent helicase requires (each is ~200 residues).
    - reference_id: file:human/G3BP1/G3BP1-bioinformatics/RESULTS.md
      supporting_text: |-
        **Q13283 is the only member of the family, in any species, with experimental
          evidence for any helicase term.**
    - reference_id: file:human/G3BP1/G3BP1-bioinformatics/RESULTS.md
      supporting_text: |-
        **Helicase rows occur in exactly one subfamily, SF21** — the G3BP1 orthologs. The
          paralogous SF10 subfamily (G3BP2, in all three species that have a reviewed entry)
          has none, as do the fungal, nematode and plant members.
    - reference_id: PMID:9889278
      supporting_text: |-
        HDH VIII
        can also unwind partial RNA/DNA and RNA/RNA duplexes.
      reference_section_type: ABSTRACT
    propagation_review:
      root_cause: SOURCE_BAD
      failure_modes:
      - SOURCE_EVIDENCE_WEAK
      source_entities:
      - source_id: PANTHER:PTN002581351
        source_label: PTN002581351
        source_status: SOURCE_BAD
        comment: 'The node this IBA descends from has no descendant experimental evidence other than the
          target''s own 1999 IDA, so the IBD placement stands or falls with that one annotation. A census
          of all 11 reviewed members of PTHR10693 (file:human/G3BP1/G3BP1-bioinformatics/RESULTS.md) shows
          helicase rows in exactly one subfamily, SF21, the G3BP1 orthologs, and shows Q13283 to be the
          only member in any species with experimental evidence for any helicase term: the mouse, cattle
          and orangutan rows are all ISO, ISS, IBA, IEA or RCA. The paralogous SF10 subfamily (G3BP2 in
          human, mouse and orangutan) has none, nor do the fungal, nematode and plant members. Contrast
          PTN000074905, the node behind this gene''s stress-granule assembly IBA, whose WITH/FROM spans
          fly, fission yeast, budding yeast and both human paralogs. This is an argument about node placement,
          not about a similarity score: the claim entered the family through one report rather than through
          comparative biology, and the family''s shared architecture (NTF2 plus RRM plus RG-rich) has
          no nucleotide-binding core at any depth of the tree.'
      - source_id: UniProtKB:Q13283
        source_label: G3BP1 (the target itself)
        source_status: SOURCE_BAD
        comment: 'The target appearing in its own WITH/FROM is correct and expected, and is not counted
          here as circular or redundant: it marks that the IBD curator used experimental evidence on the
          target. The problem is upstream of the propagation - that experimental annotation (IDA from
          PMID:9889278) is itself unsound, so the inheritance claim built on it inherits the error.'
      residue_claims_not_applicable: The argument is the absence of entire nucleotide-binding modules
        - Walker A, Walker B, the DExD/H box and the two RecA-like lobes they sit in - from a protein
        whose annotated domains already tile its full length. There is no retained fold from which specific
        catalytic residues were lost, so there is no position to assert a residue claim about.
