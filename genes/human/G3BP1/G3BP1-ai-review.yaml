- id: file:human/G3BP1/G3BP1-bioinformatics/RESULTS.md
  title: Does human G3BP1 have the sequence features of an ATP-dependent helicase?
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Bioinformatics analysis written for this review. Fetches UniProtKB records live and
      scans G3BP1 plus four positive controls (DDX3X, EIF4A3, BLM, UPF1) and two fold-matched negative
      controls (NUTF2, HNRNPA1) for canonical helicase/ATPase motifs and helicase family signatures. All
      numbers are computed by reproduce.py, not hardcoded; the controls separate cleanly, which is what
      makes the negative result on G3BP1 interpretable.
- id: file:human/G3BP1/G3BP1-uniprot.txt
  title: UniProtKB Q13283 (G3BP1_HUMAN) flat file
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Curated UniProt record. Used here for the feature table (NTF2 11-133, RRM 340-415, acidic
      and RG-rich regions), for curated CC FUNCTION, DOMAIN, SUBUNIT and SUBCELLULAR LOCATION statements
      tied to publications, and for the family cross-references. The helicase statements and the two EC
      numbers in this record are the subject of a source_defects entry on the GO:0003678 row.
existing_annotations:
- term:
    id: GO:0003676
    label: nucleic acid binding
  qualifier: enables
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  supporting_entities:
  - InterPro:IPR035979
  review:
    summary: 'InterPro-derived electronic row for the RRM''s nucleic-acid-binding fold. True but uninformative:
      the gene already carries mRNA binding, which is what the evidence actually shows.'
    action: MODIFY
    reason: nucleic acid binding is correct but less specific than the evidence supports. G3BP1's RRM
      and RG-rich region bind mRNA, and GO:0003729 mRNA binding (an is_a descendant) is already annotated
      to this gene by IBA and IEA, so the replacement is a term the gene already carries.
    proposed_replacement_terms:
    - id: GO:0003729
      label: mRNA binding
    supported_by:
    - reference_id: file:human/G3BP1/G3BP1-uniprot.txt
      supporting_text: |-
