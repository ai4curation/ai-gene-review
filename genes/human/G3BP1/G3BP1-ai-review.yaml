gene_symbol: G3BP1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'G3BP1 (Ras GTPase-activating protein-binding protein 1) is a ubiquitously expressed 466-residue
  cytosolic RNA-binding protein that nucleates cytoplasmic stress granules. Its architecture is modular:
  an N-terminal NTF2 domain (residues 11-133) that dimerises and provides a single hydrophobic pocket
  for the G3BP1-interacting motifs of CAPRIN1, USP10 and UBAP2L; a long acidic intrinsically disordered
  region (142-225) that is autoinhibitory and phosphoregulated at Ser149; an RRM (340-415); and a C-terminal
  arginine-glycine-rich region (410-466). Under normal conditions electrostatic contacts between the acidic
  region and the RG-rich region lock the protein in a compact, phase-separation-resistant state. When
  stress halts translation initiation and polysomes release unfolded, protein-free mRNA, that mRNA outcompetes
  the intramolecular contacts; the expanded protein clusters on RNA and physically crosslinks RNA molecules
  into a networked protein-RNA condensate. G3BP1 therefore acts as an RNA-concentration-sensing molecular
  switch and as the condensate scaffold itself, with CAPRIN1 lowering and USP10 raising the threshold
  for assembly through the shared NTF2 pocket. Its RG-rich region also binds 40S ribosomal subunits, bringing
  stalled preinitiation complexes into the granule. G3BP1 and its paralog G3BP2 are redundant for this
  role, and cells lacking both cannot assemble granules in response to eIF2-alpha phosphorylation or eIF4A
  inhibition, although they remain granule-competent under severe heat or osmotic stress. The same multivalent-scaffold
  chemistry is used in innate immunity, where G3BP1 promotes formation of large cGAS complexes and cGAS
  DNA binding and binds RIG-I and viral double-stranded RNA through its RG-rich region, enhancing type
  I interferon induction; G3BP1-deficient cells mount attenuated interferon responses to cytosolic DNA
  and to virus infection. Granule disassembly is imposed on G3BP1 rather than carried out by it: K63-linked
  ubiquitination of G3BP1 recruits the FAF2 adapter and the segregase VCP, which extracts G3BP1 and dissolves
  the granule. Because G3BP1 is the keystone of the network, it is a convergent target of viral antagonism,
  being cleaved by aphthovirus and enterovirus proteases, sequestered by alphavirus nsP3, and captured
  by the coronavirus nucleocapsid protein. Despite a long-standing annotation as ATP-dependent DNA helicase
  VIII, G3BP1 has no nucleotide-binding or helicase module and the 1999 report of that activity has never
  been reproduced.'
