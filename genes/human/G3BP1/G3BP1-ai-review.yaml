core_functions:
- description: RNA-concentration-sensing condensate scaffold that nucleates cytoplasmic stress granules.
    NTF2-mediated dimerisation and the RG-rich region give G3BP1 the valence to crosslink polysome-released,
    unfolded mRNA into a networked protein-RNA condensate, while the acidic disordered region holds the
    protein in an autoinhibited compact state until mRNA binding outcompetes it. The RG-rich region additionally
    recruits 40S ribosomal subunits, bringing stalled preinitiation complexes into the granule. CAPRIN1
    and USP10 tune the threshold in opposite directions through a single shared pocket on the NTF2 domain.
