- id: PMID:30804210
  title: The stress granule protein G3BP1 binds viral dsRNA and RIG-I to enhance interferon-β response.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Kim et al. Establishes the RIG-I arm: G3BP1 binds RIG-I and viral dsRNA via the RGG
      region and enhances IFN-beta induction. Verified against the cached full text. Two caveats recorded
      rather than treated as defects: the main gain-of-function evidence is overexpression in HEK293T
      rather than knockout, and the paper carries a published erratum (J Biol Chem 2019;294(24):9655).'
- id: PMID:34739333
  title: Ubiquitination of G3BP1 mediates stress granule disassembly in a context-specific manner.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Gwon et al. Correctly cited for ubiquitination-dependent, context-specific granule
      disassembly via FAF2 and VCP, and for the clean dissociation that assembly is independent of G3BP1
      ubiquitination. Verified against the cached full text. Worth flagging that this paper does not name
