id: Q9NQB0
gene_symbol: TCF7L2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: TCF7L2 is a nuclear HMG-box TCF/LEF transcription factor and beta-catenin
  partner. It binds RNA polymerase II cis-regulatory DNA, forms beta-catenin-TCF
  complexes on chromatin, and mediates canonical Wnt transcriptional outputs, with
  additional context-specific roles in intestinal epithelium, pancreatic beta cells,
  endocrine gene regulation, and epithelial-mesenchymal programs.
