suggested_questions:
- question: Which exact constructs and validation records support the 17 PMID:32814053 interaction
    pairs and the ATP1A3 extracellular-vesicle proteomics hit in PMID:24769233?
- question: Do the PMID:15260953 ER and Golgi localization panels distinguish normal biosynthetic
    transit from retention of specific disease variants?
- question: What evidence connects alpha3 specifically to adjacent-cell electrical coupling
    through intercellular channels, beyond pump-dependent cardiac contractility and calcium
    handling?
- question: Would a specific cardiac-glycoside-binding molecular function represent the directly
    measured ouabain interaction more informatively than the broad steroid-hormone-binding
    annotation, without adding a redundant term?
suggested_experiments:
- description: Compare defined human alpha3 splice products with matched beta/FXYD partners
    using surface abundance, ouabain-sensitive current and ATP-dependent transport measurements;
    distinguish impaired delivery from altered intrinsic pump activity.
