core_functions:
- description: Hydrolyzes ATP to export sodium and import potassium across the plasma membrane
    as the catalytic alpha3 subunit of the sodium-potassium pump. This coupled exchange sustains
    the ion gradients used for membrane potential and neuronal electrical stability.
  molecular_function:
