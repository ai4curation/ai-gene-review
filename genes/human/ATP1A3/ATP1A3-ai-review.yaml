id: P13637
gene_symbol: ATP1A3
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ATP1A3 encodes the catalytic alpha3 subunit of the sodium-potassium pump, a multipass
  plasma-membrane P-type ATPase that couples ATP hydrolysis to sodium export and potassium
  import. Alpha3 assembles with a beta subunit and can associate with an FXYD regulatory protein.
  Its activity sustains ion gradients and membrane potential in neurons and other expressing
  cells. Disease-associated variants can impair pump activity or stability, producing neurological
  disorders. Cardiac glycosides inhibit the pump, and pathological amyloid assemblies can
  bind alpha3 and disrupt neuronal ion homeostasis.
