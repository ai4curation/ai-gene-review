core_functions:
- description: PLP-dependent GAD67 decarboxylates L-glutamate to GABA and carbon dioxide, supplying basal GABA in the cytoplasm and inhibitory presynaptic compartments. Its catalytic homodimer is supported by the human GAD1 structure. A vesicle-associated pool is represented in the curated GAD1:GAD2 assembly, but GAD67 is not exclusively membrane-bound. This activity is established for full-length GAD67; GAD25 is inactive and untested products are not assigned the same activity.
