suggested_questions:
- question: What molecular role, if any, does inactive GAD25 perform independently of glutamate decarboxylation?
- question: What are the expression pattern, catalytic competence and assembly partners of the 425-residue product, and can the undescribed Q99259-2 product be molecularly resolved?
suggested_experiments:
- description: Compare sequence-verified full-length GAD67, GAD25 and the 425-residue product for PLP-dependent activity, oligomerization and binding in matched assays, with expression controls.
- description: Resolve endogenous GAD67 soluble, vesicle-associated and active-zone pools using isoform-resolved tagging and compartment controls, distinguishing protein localization from Gad1-locus cell reporters.
