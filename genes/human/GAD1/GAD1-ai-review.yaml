id: Q99259
gene_symbol: GAD1
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: GAD1 encodes glutamate decarboxylase 67 (GAD67), a pyridoxal-phosphate-dependent enzyme that converts L-glutamate to gamma-aminobutyric acid (GABA) and carbon dioxide. Catalytically active GAD67 forms a homodimer and supplies basal GABA for inhibitory neuronal signalling. It occurs in the cytoplasm and inhibitory presynaptic compartments, with a vesicle-associated pool represented in GAD1:GAD2 assemblies. Alternative splicing produces distinct proteins, including the inactive GAD25 form; enzyme activity and targeting are not uniform properties of every declared product.
