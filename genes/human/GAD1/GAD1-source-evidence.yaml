    sha256: ef183664f6f4454cf20eb13cb256f8637648ae7b3d3c2115b88e612c8de8da47
    blob: d0c3ea5fb420db6983ee6359a44eb65b2b02ad79
  native_header:
    stable_id: R-HSA-9022927
    display_name: MECP2 regulates transcription of genes involved in GABA signaling
    species: Homo sapiens
    summary: MECP2 regulates expression of several genes involved in GABA (gamma-aminobutyric acid) signaling. Transcription of GAD1 (GAD67) and GAD2 (GAD65) genes is directly positively regulated by MECP2. GAD1 and GAD2 are components of the glutamic acid decarboxylase complex involved in production of the neurotransmitter GABA. Mice lacking Mecp2 from GABA-releasing neurons have decreased GABA levels and exhibit multiple Rett syndrome features (Chao et al. 2010).<p>Mecp2 deletion in mouse GABAergic parvalbumin-expressing (PV) cells, cortical interneurons playing a key role in visual experience-induced ocular dominance plasticity, does not result in Rett-like phenotype, other than defects in motor coordination and motor learning. While functions of the visual cortex are preserved in mice lacking Mecp2 in GABAergic PV cells, the visual input-induced spiking responses are decreased. Mecp2 loss impairs maturation of membrane functions of cortical GABAergic PV cells. Mecp2 may be needed for
      PV cell-mediated cortical GABA inhibition. Mecp2-deficient cortical PV cells show reduced mRNA levels of several genes involved in GABA signaling, such as Parvalbumin, Gad2, Calretinin, Gabra1 and Gabra2, as well as reduced levels of Glu3, a glutamate receptor subunit, and Kv3.1, a potassium channel (He et al. 2014).
