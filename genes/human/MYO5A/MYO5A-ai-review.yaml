id: Q9Y4I1
gene_symbol: MYO5A
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: MYO5A encodes unconventional myosin-Va, a class V myosin heavy chain that dimerizes into
  a two-headed, processive actin-based motor. Each heavy chain has an N-terminal ATPase motor domain,
  a neck with six IQ motifs that bind calmodulin and light chains, a coiled-coil dimerization region and
  a C-terminal globular tail that binds cargo. Myosin-Va walks along actin filaments in large steps and
  transports and tethers membrane organelles in the actin-rich cell cortex. Its cargo adaptors include
  RAB27A-melanophilin for melanosome capture and transport in melanocytes, and direct interactions with
  several Rab GTPases (RAB3, RAB8, RAB10, RAB11 and others) for recycling-endosome, secretory and post-Golgi
  carriers in many cell types, including neurons, where it moves vesicles and smooth ER in dendrites and
  growth cones. At the onset of primary cilium formation, myosin-Va carries preciliary vesicles along
  a branched actin network from the pericentrosomal region to the distal appendages of the mother centriole,
  upstream of EHD1- and RAB11-dependent ciliary vesicle formation. Biallelic loss-of-function variants
  cause Griscelli syndrome type 1 (pigmentary dilution with neurological impairment).
