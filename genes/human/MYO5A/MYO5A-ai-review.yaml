core_functions:
- description: Processive, ATP-driven actin-based motor (dimeric myosin-Va) that moves along actin filaments.
  molecular_function:
    id: GO:0000146
    label: microfilament motor activity
  directly_involved_in:
  - id: GO:0030048
    label: actin filament-based movement
  locations:
  - id: GO:0015629
    label: actin cytoskeleton
  supported_by:
  - reference_id: PMID:10448864
    supporting_text: Here we provide direct evidence that myosin-V is indeed a processive actin-based
      motor that can move in large steps approximating the 36-nm pseudo-repeat of the actin filament.
- description: 'Rab-dependent cargo transport: binds Rab GTPases (RAB10, RAB11, RAB8, RAB3, RAB6) and
    the RAB27A-melanophilin adaptor to transport recycling-endosome, post-Golgi/secretory vesicles and
    melanosomes along cortical actin (pleiotropic, non-ciliary).'
  molecular_function:
    id: GO:0031267
    label: small GTPase binding
  directly_involved_in:
  - id: GO:0030050
    label: vesicle transport along actin filament
  - id: GO:0032402
    label: melanosome transport
  locations:
  - id: GO:0042470
    label: melanosome
  supported_by:
  - reference_id: PMID:24006491
    supporting_text: Rab10 and Rab11 appear to be the major determinants of its recruitment to intracellular
      membranes
  - reference_id: PMID:11980908
