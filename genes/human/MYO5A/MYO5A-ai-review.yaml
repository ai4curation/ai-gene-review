- term:
    id: GO:0060271
    label: cilium assembly
  evidence_type: IMP
  original_reference_id: PMID:29335527
  review:
    summary: 'Proposed: myosin-Va transports preciliary vesicles to the mother centriole distal appendages
      at the onset of primary cilium assembly.'
    action: NEW
    reason: 'Myosin-Va does part of the work of ciliogenesis: it is the motor that carries preciliary
      vesicles along branched actin to the distal appendages, and its depletion blocks vesicle attachment
      and reduces cilia assembly. EHD1 and EHD3, which act at the next step, already carry this term.
      The broader cilium assembly term is preferred to ciliary vesicle assembly because myosin-Va acts
      upstream of ciliary vesicle formation (delivery, not fusion/tubulation).'
    supported_by:
    - reference_id: PMID:29335527
      supporting_text: Here, we demonstrate that myosin-Va mediates the transportation of preciliary vesicles
        to the mother centriole and reveal the underlying mechanism.
    - reference_id: PMID:29335527
      supporting_text: Depletion of myosin-Va significantly inhibits the attachment of preciliary vesicles
        to the distal appendages of the mother centriole and decreases cilia assembly.
    - reference_id: PMID:29335527
      supporting_text: Myosin-Va functions upstream of EHD1- and Rab11-mediated ciliary vesicle formation.
