- term:
    id: GO:0015125
    label: bile acid transmembrane transporter activity
  evidence_type: IDA
  original_reference_id: PMID:41606314
  qualifier: contributes_to
  review:
    summary: Bile acid transmembrane transporter activity as a contributing subunit of the OSTalpha-OSTbeta heteromer.
      OSTalpha forms the bile acid recognition site, while OSTbeta is required for transport.
    action: ACCEPT
    reason: Core function. Human OSTalpha-OSTbeta transports taurocholate and other conjugated bile acids by facilitated
      diffusion; neither subunit is active alone, so contributes_to is the correct qualifier. The cryo-EM structures
      locate the substrate site in OSTalpha and mutagenesis of OSTalpha residues reduces bile acid transport.
    supported_by:
    - &id005
      reference_id: PMID:41606314
      supporting_text: OSTα adopts the G-protein-coupled-receptor (GPCR) fold and contains a unique cysteine-rich
        loop with seven palmitoylation sites; these cooperate with transmembrane helices 5 and 6, constituting a
        BA recognition site
    - &id006
      reference_id: PMID:12719432
      supporting_text: Human and mouse OSTalpha-OSTbeta also were able to mediate transport of taurocholate, digoxin,
        and prostaglandin E2
    - &id007
      reference_id: PMID:12719432
      supporting_text: None of the proteins elicited a transport signal when expressed individually in oocytes;
        however, all nine OSTalpha-OSTbeta combinations (i.e. OSTalpha-OSTbeta pairs from human, mouse, or skate)
        generated robust estrone 3-sulfate transport activity
    - &id008
      reference_id: PMID:16317684
      supporting_text: the oocytes demonstrated robust substrate efflux and trans-stimulation, indicating that transport
        occurs by facilitated diffusion
