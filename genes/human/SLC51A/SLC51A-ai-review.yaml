core_functions:
- description: As one subunit of the OSTalpha-OSTbeta heteromer, SLC51A provides the substrate recognition site
    for facilitated, electrochemical-gradient-driven movement of conjugated bile acids across the basolateral plasma
    membrane of enterocytes and other epithelia, exporting them toward the portal circulation. Transport requires
    OSTbeta, so the activity is contributed rather than independently possessed. Established experimentally for
    the human protein by oocyte and cell transport assays, cryo-EM structures with mutagenesis, and PFIC6 genetics;
    the in vivo intestinal requirement comes from mouse Ostalpha knockouts.
  contributes_to_molecular_function:
    id: GO:0015125
    label: bile acid transmembrane transporter activity
  directly_involved_in:
  - id: GO:0015721
    label: bile acid and bile salt transport
  - id: GO:0032782
    label: bile acid secretion
  locations:
  - id: GO:0016323
    label: basolateral plasma membrane
  supported_by:
  - reference_id: PMID:41606314
    supporting_text: contains a unique cysteine-rich loop with seven palmitoylation sites
  - reference_id: PMID:12719432
    supporting_text: None of the proteins elicited a transport signal when expressed individually in oocytes
  - reference_id: PMID:16317684
    supporting_text: the oocytes demonstrated robust substrate efflux and trans-stimulation, indicating that transport
      occurs by facilitated diffusion
  - reference_id: PMID:18292224
    supporting_text: These data indicate that Ostalpha-Ostbeta is essential for intestinal bile acid transport in
      mice
- description: SLC51A heterodimerizes with SLC51B through the single transmembrane helix of OSTbeta, and two such
    heterodimers assemble around an OSTalpha homodimeric core. Heterodimerization is needed for stability of both
    subunits and for delivery of the transporter to the plasma membrane.
  molecular_function:
    id: GO:0046982
    label: protein heterodimerization activity
  locations:
  - id: GO:0016323
    label: basolateral plasma membrane
  supported_by:
  - reference_id: PMID:41606314
    supporting_text: two OSTα units form the homodimeric core, with two OSTβ units bound to the periphery
  - reference_id: PMID:17650074
    supporting_text: The interaction between Ostalpha and Ostbeta was required not only for delivery of the proteins
      to the plasma membrane, but it increased their stability
suggested_questions:
- question: Should GO have a term for sulfated steroid (estrone 3-sulfate, dehydroepiandrosterone 3-sulfate) transmembrane
    transporter activity, so that the experimentally demonstrated steroid-conjugate transport of OSTalpha-OSTbeta
    can be captured?
- question: Do invertebrate OSTalpha-like proteins such as Drosophila CG6836 and the C. elegans osta genes, for
    which no OSTbeta partner has been identified, transport any substrate on their own, and is steroid or bile-acid-like
    transport ancestral or a vertebrate innovation tied to the acquisition of OSTbeta?
- question: Is a specific GO cellular component term for the organic solute transporter (OSTalpha-OSTbeta) complex
    warranted, given that the only complex term available is protein-containing complex?
suggested_experiments:
- description: Express Drosophila CG6836 alongside human SLC51A, with and without SLC51B, in Xenopus oocytes or
    HEK293 cells and measure uptake of taurocholate, estrone 3-sulfate and candidate insect sterol conjugates, to
    test whether the ancestral activity of the OSTalpha lineage requires a beta subunit.
- description: Determine the substrate spectrum of human OSTalpha-OSTbeta quantitatively (kinetics for individual
    conjugated bile acids, sulfated steroids and eicosanoids) in a defined proteoliposome system reconstituted from
    purified complex, so that transport claims currently inferred from mouse by similarity can be made directly
    for the human protein.
- description: Introduce the PFIC6 truncating variant and the structure-guided cysteine-rich-loop palmitoylation
    mutants into intestinal organoids from SLC51A knockout lines and assay basolateral taurocholate efflux, to connect
    the structural mechanism with the human disease phenotype.
