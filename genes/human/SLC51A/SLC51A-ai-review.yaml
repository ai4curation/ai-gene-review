id: Q86UW1
gene_symbol: SLC51A
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'SLC51A (OSTalpha) is the seven-transmembrane subunit of the heteromeric organic solute transporter
  OSTalpha-OSTbeta (SLC51A-SLC51B). In human the complex is a dimer of heterodimers: two OSTalpha subunits form
  the core and each binds one single-span OSTbeta. OSTalpha has a G protein-coupled receptor-like fold and a palmitoylated
  cysteine-rich loop that, together with transmembrane helices 5 and 6, forms the bile acid binding site. Neither
  subunit transports alone. Together they mediate sodium- and ATP-independent facilitated diffusion of conjugated
  bile acids such as taurocholate and of sulfated steroids such as estrone 3-sulfate and dehydroepiandrosterone
  3-sulfate; prostaglandin E2 and digoxin are also transported in oocyte assays. The complex resides in the basolateral
  plasma membrane of ileal enterocytes, renal proximal tubule cells and cholangiocytes, where it exports bile acids
  into the portal circulation during their enterohepatic recycling. Expression is induced by the bile acid receptor
  FXR. Biallelic loss of SLC51A causes progressive familial intrahepatic cholestasis type 6 with congenital diarrhea,
  and Ostalpha knockout mice lose most ileal bile acid transport. SLC51A belongs to the OSTalpha/TMEM184 family
  (PANTHER PTHR23423, subfamily SF11).'
