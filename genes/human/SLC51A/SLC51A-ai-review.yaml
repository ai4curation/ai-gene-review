  review:
    summary: Bile acid and bile salt transport. OSTalpha-OSTbeta mediates basolateral export of conjugated bile
      acids from ileal enterocytes into portal blood, and from renal and biliary epithelia.
    action: ACCEPT
    reason: Core process, directly executed by the transporter. Supported in human by heterologous transport assays
      and localisation, and in mouse by knockout of Ostalpha (orthologous, same PANTHER subfamily PTHR23423:SF11),
