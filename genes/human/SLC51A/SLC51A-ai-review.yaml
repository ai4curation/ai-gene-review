- term:
    id: GO:0005789
    label: endoplasmic reticulum membrane
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - MGI:MGI:2146634
  - PANTHER:PTN000603313
  review:
    summary: Endoplasmic reticulum membrane. OSTalpha is synthesised in the ER and depends on OSTbeta for efficient
      exit to the plasma membrane; the ER is a biosynthetic/transit compartment rather than where the transporter
      acts.
    action: KEEP_AS_NON_CORE
    reason: Mouse cell and knockout studies show that heterodimerization with Ostbeta is needed to deliver Ostalpha
      to the plasma membrane, so unpartnered OSTalpha accumulates intracellularly. The ER location is therefore
      true for a pool of the protein, but the transporter functions at the basolateral plasma membrane. Note that
      human OSTalpha did reach the oocyte plasma membrane when expressed alone (PMID:12719432), so ER retention
      is cell-context dependent. Kept as non-core; the IBA is_active_in qualifier overstates it, but the location
      claim itself is defensible.
    supported_by:
    - &id002
      reference_id: PMID:17650074
      supporting_text: The interaction between Ostalpha and Ostbeta was required not only for delivery of the proteins
        to the plasma membrane, but it increased their stability
