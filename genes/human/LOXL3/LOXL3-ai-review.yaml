- gap_statement: >-
    The biochemical reproducibility, physiological scope, and isoform dependence
    of the reported nuclear STAT3 deacetylation/deacetylimination activity remain
    unresolved.
  boundary: >-
    One abstract-only human study assigns the major STAT3-directed activities to
    N-terminal SRCR repeats rather than the canonical C-terminal oxidase domain;
    sv1 lacks SRCR domains 1-3 and sv2 lacks SRCR domain 2.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
