knowledge_gaps:
- gap_statement: >-
    The physiological human protein substrates and isoform-specific substrate
    preferences of LOXL3 are not established in vivo.
  boundary: >-
    Recombinant human full-length LOXL3 and LOXL3-sv1 oxidize collagen and elastin
    with different preferences, and recombinant sv2 oxidizes collagen I; mouse/model
    work identifies fibronectin, but direct oxidation of endogenous human substrates
    has not been mapped.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    Identifying native substrates is necessary to distinguish the conserved
    extracellular catalytic role from substrate assignments transferred from model
    organisms and to explain isoform-specific connective-tissue functions.
  resolution: >-
    Map LOXL3-dependent allysine sites in human extracellular matrices using
    isoform-selective knockout/rescue and quantitative carbonyl/allysine proteomics,
    followed by purified-enzyme validation of candidate substrates.
  provenance:
  - reference_id: PMID:17018530
    supporting_text: >-
      The recombinant LOXL3-sv1 protein showed a beta-aminopropionitrile-inhibitable
      amine oxidase activity toward elastin and collagen with substrate specificity.
  - reference_id: PMID:26954549
    supporting_text: >-
      We find that LoxL3 complexes with and directly oxidizes Fibronectin (FN), an
      ECM scaffold protein and integrin ligand enriched at the MTJ.
- gap_statement: >-
    Whether human LOXL3 undergoes a required extracellular proteolytic activation
    step, including cleavage by BMP1-family proteases, is unknown.
  boundary: >-
    Human LOXL3 contains a signal peptide and is secreted, but the reviewed record
    defines the chain after signal-peptide removal without a demonstrated LOXL3
    propeptide; one predicted splice form lacks a potential BMP-1 cleavage site.
  gap_kind:
  - BIOLOGY
  - CURATION
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    This determines whether secretion alone produces an active enzyme or whether
    tissue-specific proteolysis controls extracellular LOXL3 activity.
  resolution: >-
    Determine native N termini and cleavage products of endogenous secreted LOXL3
    isoforms by N-terminomics and intact-mass analysis, then test activity before
    and after candidate-protease treatment and cleavage-site editing.
  provenance:
  - reference_id: PMID:11284725
    supporting_text: >-
      Recombinant LOXL3, expressed in HT-1080 cells, was secreted into the culture
      medium but was not detected by immunofluorescence staining in nuclei.
  - reference_id: PMID:11386757
    supporting_text: >-
      The putative resulting protein retained the region encoding the structural
      and functional elements of the amine oxidase but the second and fourth SRCR
