- id: PMID:11284725
  title: Cloning and characterization of a fourth human lysyl oxidase isoenzyme.
  findings:
  - statement: Recombinant human LOXL3 expressed in HT-1080 cells was secreted into
      the culture medium and was not detected in nuclei by immunofluorescence.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
    supporting_text: Recombinant LOXL3, expressed in HT-1080 cells, was secreted
      into the culture medium but was not detected by immunofluorescence staining
      in nuclei.
  - statement: The cloned 753-residue human precursor has a 25-residue signal peptide,
      four N-terminal SRCR domains, and a C-terminal lysyl-oxidase domain containing
      predicted copper- and LTQ-forming residues.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
    supporting_text: The predicted polypeptide is 753 amino acids in length, including
      a signal peptide of 25 residues.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed identity and cached abstract verified. Direct human secretion
      evidence and sequence/domain characterization; it does not itself demonstrate
      catalytic activity or nuclear localization.
- id: PMID:11334717
  title: Cloning and characterization of a human lysyl oxidase-like 3 gene (hLOXL3).
  findings:
  - statement: Human LOXL3 cDNA was cloned from fetal-brain mRNA and was predicted
      to encode a signal-peptide-containing SRCR-family protein.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
    supporting_text: Using the PCR primers generated from human expressed sequence
      tag (EST), the cDNA of lysyl oxidase-like gene 3 (LOXL3), a new member of human
      lysyl oxidases gene family, was cloned from the human fetal brain mRNA.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed identity and cached abstract verified. Supports human transcript,
      domain, and expression information, not biochemical activity.
- id: PMID:11386757
  title: Central nervous system, uterus, heart, and leukocyte expression of the LOXL3
    gene, encoding a novel lysyl oxidase-like protein.
  findings:
  - statement: Human ESTs predicted an alternative LOXL3 form lacking exons 5 and
      8; the predicted product retains the amine-oxidase region but truncates SRCR
      domains 2 and 4 and lacks the potential BMP-1 cleavage site.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
    supporting_text: The putative resulting protein retained the region encoding
      the structural and functional elements of the amine oxidase but the second
      and fourth SRCR domains were truncated and the potential BMP-1 cleavage site
      was not present.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed identity and cached abstract verified. This is transcript/EST
      prediction, not expression or activity evidence for a fourth protein isoform.
- id: PMID:16096638
  title: A molecular role for lysyl oxidase-like 2 enzyme in snail regulation and
    tumor progression.
  findings:
  - statement: In epithelial/carcinoma models, LOXL3 interacted and cooperated with
      Snail to repress E-cadherin, and LOXL3 overexpression induced an EMT phenotype.
    reference_section_type: ABSTRACT
    full_text_unavailable: false
    supporting_text: Here we show that lysyl-oxidase-like 2 and 3 (LOXL2 and LOXL3),
      two members of the lysyl-oxidase gene family, interact and cooperate with Snail
      to downregulate E-cadherin expression.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed identity and full cached text verified. Direct LOXL3 cell-model
      evidence, but the paper's mechanistic and in-vivo emphasis is LOXL2; the LOXL3-Snail
      result is context-specific and does not establish a constitutive stable complex.
- id: PMID:16893474
  title: Elastic fibres in health and disease.
  findings: []
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: PubMed identity and abstract verified. General elastic-fibre review;
      its cached abstract does not specifically establish LOXL3 localization or function.
- id: PMID:17018530
  title: A tissue-specific variant of the human lysyl oxidase-like protein 3 (LOXL3)
    functions as an amine oxidase with substrate specificity.
  findings:
  - statement: Human LOXL3-sv1 lacks sequences corresponding to exons 1, 2, 3,
      and 5, encodes a 392-residue protein lacking SRCR domains 1-3, and retains
      the C-terminal catalytic region.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
    supporting_text: LOXL3-sv1 was predicted to encode a polypeptide of 392 amino
      acids that contains the C-terminal domains required for amine oxidase activity
      but lacks the N-terminal SRCR domains 1, 2, and 3.
  - statement: Recombinant human LOXL3-sv1 has BAPN-inhibitable amine-oxidase activity
      toward elastin and collagen, with substrate specificity distinct from full-length
      LOXL3.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
    supporting_text: The recombinant LOXL3-sv1 protein showed a beta-aminopropionitrile-inhibitable
      amine oxidase activity toward elastin and collagen with substrate specificity.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed identity and cached abstract verified. Principal direct human
      biochemical evidence for LOXL3/LOXL3-sv1 activity and isoform-dependent substrate
      preferences; cache is abstract-only.
- id: PMID:21244857
  title: Lysyl oxidase-like 3b is critical for cartilage maturation during zebrafish
    craniofacial development.
  findings:
  - statement: Zebrafish loxl3b loss-of-function disrupts craniofacial cartilage
      maturation and chondrogenic progenitor proliferation/differentiation.
    reference_section_type: ABSTRACT
    full_text_unavailable: false
    supporting_text: We now demonstrate that loxl3b is abundantly expressed within
      the head mesenchyme of the zebrafish and is critically important for maturation
      of neural crest derived cartilage elements.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed identity and full cached text verified. Useful ortholog evidence
      for a developmental ECM role, but zebrafish has loxl3a/loxl3b paralogs and this
      result is not direct evidence for human LOXL3 molecular activity.
- id: PMID:23962539
  title: Elastic fibres in health and disease.
  findings: []
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: PubMed identity and abstract verified. General elastic-fibre review;
      its cached abstract does not specifically establish LOXL3 localization or function.
- id: PMID:25663169
  title: LOXL3, encoding lysyl oxidase-like 3, is mutated in a family with autosomal
    recessive Stickler syndrome.
  findings:
  - statement: A LOXL3 missense variant identified by combined autozygome/exome analysis
      was proposed as the likely candidate cause of autosomal-recessive Stickler syndrome
      in one family.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
    supporting_text: we combined autozygome and exome analysis to identify a novel
      missense variant in LOXL3 as the likely candidate cause.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed identity and cached abstract verified. Human genetic disease
      evidence, not a direct substrate or catalytic assay.
- id: PMID:26218558
  title: The presence of lysyl oxidase-like enzymes in human control and keratoconic
    corneas.
  findings:
  - statement: Immunohistochemistry detected LOXL3 throughout control human corneal
      layers, limbus, and conjunctiva, with reduced stromal staining in keratoconus.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
    supporting_text: All four LOX-like enzymes were present in all layers of control
      corneas as well as in the limbus and conjunctiva.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed identity and cached abstract verified. Supports tissue-level
      human localization only; antibody staining does not resolve isoforms or prove
      catalytic activity.
- id: PMID:26307084
  title: Loss of lysyl oxidase-like 3 causes cleft palate and spinal deformity in mice.
  findings:
  - statement: Loxl3-null mice die perinatally with cleft palate and spinal deformity;
      loss lowers collagen content/cross-links in affected tissues without a detected
      elastin-cross-link change.
    reference_section_type: RESULTS
    full_text_unavailable: false
    supporting_text: In our study, a significant decrease in collagen-links from
      the lack of LOXL3 caused cleft palate and spinal deformity, while no obvious
      difference was observed in the elastin cross-links in the palate and spine.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed identity and full cached text verified. Strong in-vivo mouse
      evidence for collagen-matrix and developmental roles, but not direct human evidence.
- id: PMID:26954549
  title: Localized LoxL3-Dependent Fibronectin Oxidation Regulates Myofiber Stretch
    and Integrin-Mediated Adhesion.
  findings:
  - statement: In non-human developmental models, locally secreted LoxL3 complexes
      with and oxidizes fibronectin at the myotendinous junction, enhancing integrin
      activation and myofiber positioning/anchoring.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
    supporting_text: We find that LoxL3 complexes with and directly oxidizes Fibronectin
      (FN), an ECM scaffold protein and integrin ligand enriched at the MTJ.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed identity and cached abstract verified. Direct fibronectin
      mechanism, but it is ortholog/model-organism evidence rather than an assay of
      human P58215; transfer to human must remain explicitly qualified.
- id: PMID:26957899
  title: Exome sequencing identified null mutations in LOXL3 associated with early-onset
    high myopia.
  findings:
  - statement: Biallelic LOXL3 frameshift variants were found in two singleton human
      early-onset high-myopia cases; the authors explicitly classified LOXL3 as a
      candidate requiring confirmation.
    reference_section_type: ABSTRACT
    full_text_unavailable: false
    supporting_text: LOXL3 is a potential candidate gene for high myopia, but this
      possibility should be confirmed in additional studies.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed identity and full cached text verified. Human genetic evidence
      with an explicit candidate-level caveat; not direct evidence for catalytic mechanism.
- id: PMID:28065600
  title: Lysyl Oxidase 3 Is a Dual-Specificity Enzyme Involved in STAT3 Deacetylation
    and Deacetylimination Modulation.
  findings:
  - statement: The study reports nuclear LOXL3 association with STAT3 and both deacetylation
      and deacetylimination/oxidation of multiple acetyl-lysine sites, suppressing STAT3
      dimerization and transcriptional activity.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
    supporting_text: LOX-like 3 (Loxl3) associates with Stat3 in the nucleus to deacetylate
      and deacetyliminate Stat3 on multiple acetyl-lysine sites.
  - statement: The reported STAT3 deacetylation/deacetylimination activity maps mainly
      to the N-terminal SRCR repeats rather than the canonical C-terminal amine-oxidase
      domain.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
    supporting_text: Surprisingly, Loxl3 N-terminal scavenger receptor cysteine-rich
      (SRCR) repeats, rather than the C-terminal oxidase catalytic domain, represent
      the major deacetylase/deacetyliminase activity.
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: PMID/title/abstract identity verified and no retraction flag is present
      in the cached record. However, the cache is abstract-only and this unusual dual
      chemistry is a single-study claim without independent direct replication located
      in the reviewed source set; keep it distinct from established extracellular
      lysyl-oxidase activity.
- id: PMID:28112368
  title: LOXL3-sv2, a novel variant of human lysyl oxidase-like 3 (LOXL3), functions
    as an amine oxidase.
  findings:
  - statement: Human LOXL3-sv2 lacks exons 4 and 5, encodes a 608-residue protein
      missing SRCR domain 2, and retains the C-terminal catalytic apparatus.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
    supporting_text: The deletion of exons 4 and 5 do not change the open-reading
      frame of LOXL3 but results in deletion of the SRCR domain 2.
  - statement: Recombinant LOXL3-sv2 has BAPN-inhibitable amine-oxidase activity
      toward collagen type I.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
    supporting_text: The recombinant LOXL3-sv2 protein showed a β-aminopropionitrile-inhibitable
      amine oxidase activity toward collagen type I.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed identity and cached abstract verified. Direct human sv2 biochemical
      evidence; the assay used recombinant refolded protein and does not establish
      in-vivo substrate selectivity or localization.
- id: PMID:29229995
  title: Lysyl oxidase-like 3 is required for melanoma cell survival by maintaining
    genomic stability.
  findings:
  - statement: Canonical LOXL3 and LOXL3ΔE4E5 (probably sv2) are expressed in human
      melanoma cells; LOXL3 depletion impairs proliferation and DNA-damage responses
      and induces apoptosis.
    reference_section_type: RESULTS
    full_text_unavailable: false
    supporting_text: Both LOXL3 isoforms were found similarly expressed in most melanoma
      cells tested (Fig. 1f). LOXL3Δ isoform probably corresponds to the recently
      identified splice variant LOXL3-sv2 [27].
  - statement: Proteomics and follow-up assays identified associations with genome-integrity
      proteins including BRCA2 and MSH2, but did not define a stoichiometric stable
      LOXL3 complex or a catalytic substrate relationship.
    reference_section_type: ABSTRACT
    full_text_unavailable: false
    supporting_text: Consistent with these findings, LOXL3 binds to proteins involved
      in the maintenance of genome integrity, in particular BRCA2 and MSH2, whose
      levels dramatically decrease upon LOXL3 depletion.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed identity and full cached text verified. Direct human melanoma-cell
      evidence for context-specific intracellular roles and sv2 expression; it does
      not establish that these partners are oxidase substrates or members of a stable
      physiological complex.
- id: PMID:29758265
  title: Interactions between lysyl oxidases and ADAMTS proteins suggest a novel crosstalk
    between two extracellular matrix families.
