      These findings strongly indicate that LOXL3 encodes two variants, LOXL3 and
      LOXL3-sv1, both of which function as amine oxidases with distinct tissue and
      substrate specificities from one another.
  - reference_id: PMID:11284725
    supporting_text: >-
