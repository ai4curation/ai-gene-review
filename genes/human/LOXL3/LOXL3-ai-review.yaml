suggested_questions:
- question: >-
    Which endogenous human extracellular proteins and lysine sites are directly
    oxidized by canonical LOXL3, LOXL3-sv1, and LOXL3-sv2 in their native tissues?
- question: >-
    Does secreted human LOXL3 require proteolytic activation after signal-peptide
    removal, and if so which protease and cleavage site control its activity?
- question: >-
    Is the reported SRCR-dependent STAT3 deacetylation/deacetylimination chemistry
    independently reproducible, and which LOXL3 isoforms can perform it endogenously?
- question: >-
    Does the exon-5/exon-8-deleted EST transcript produce a stable protein, and how
    should sv2 and every observed product map to P58215 isoform identifiers?
suggested_experiments:
- hypothesis: >-
    Canonical LOXL3, sv1, and sv2 oxidize overlapping but distinct endogenous human
    extracellular-matrix substrates.
  description: >-
    Generate isoform-selective LOXL3 knockouts in human connective-tissue organoids,
    rescue with each isoform or an active-site mutant, and quantify extracellular
    allysine/carbonyl sites by enrichment mass spectrometry; validate direct
    candidates using purified enzymes and defined substrate panels.
  experiment_type: isoform-selective genome editing and redox proteomics
- hypothesis: >-
    Signal-peptide removal is sufficient for human LOXL3 activity and no obligatory
    BMP1-family propeptide cleavage is required.
  description: >-
    Endogenously tag LOXL3 in a secreting human cell type, identify secreted N termini
    and intact proteoforms by N-terminomics and top-down mass spectrometry, perturb
    BMP1-family proteases genetically and pharmacologically, and compare enzyme
    activity with cleavage-site mutants.
  experiment_type: endogenous proteoform mapping and protease perturbation
- hypothesis: >-
    Nuclear STAT3-directed chemistry requires specific SRCR domains and is absent
    from LOXL3-sv1 but retained or altered in canonical LOXL3 and sv2.
  description: >-
    Reconstitute reactions with purified cofactor-defined isoforms and SRCR-domain
    mutants, identify STAT3 reaction products by targeted mass spectrometry, and
    test endogenous STAT3 transcriptional rescue after isoform-selective LOXL3
    depletion in primary human CD4-positive T cells.
  experiment_type: comparative enzymology and endogenous rescue
- hypothesis: >-
    The exon-5/exon-8-deleted transcript is either a low-abundance regulated product
    or a non-productive EST artifact rather than a fourth functional LOXL3 protein.
  description: >-
    Apply targeted long-read RNA sequencing across tissues with high LOXL3 expression,
    validate complete transcript ends and translation by ribosome profiling and
    isoform-specific targeted proteomics, and measure secretion/localization only
    after endogenous protein detection.
  experiment_type: long-read transcriptomics and isoform-resolved proteomics
