id: P58215
gene_symbol: LOXL3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  LOXL3 encodes a secreted copper- and lysine-tyrosylquinone-dependent
  protein-lysine 6-oxidase of the lysyl oxidase family. Its C-terminal catalytic
  domain oxidatively deaminates peptidyl lysines in collagen and elastin
  precursors, generating allysine residues that can support extracellular-matrix
  cross-link formation. Recombinant human full-length LOXL3 and the shorter
  LOXL3-sv1 form have distinct preferences among collagen types and elastin;
  recombinant LOXL3-sv2 is active on collagen I. UniProt curates three products:
  canonical P58215-1, P58215-2 (LOXL3-sv1, lacking the first three SRCR domains),
  and P58215-3 (with the internal deletion corresponding structurally to the
  exon-4/exon-5-deleted sv2 form). A fourth exon-5/exon-8-deleted transcript form
  is predicted from ESTs, but its protein expression and activity have not been
  demonstrated. The canonical precursor has an N-terminal signal peptide and is
  experimentally secreted, but LOXL3-specific propeptide removal or BMP1-dependent
  activation has not been established, and LOXL3 is not supported as a membrane
  protein. Mouse and zebrafish studies implicate LOXL3 orthologs in collagen-matrix,
  fibronectin-integrin, and developmental functions. A separate single study
  reports nuclear LOXL3-dependent STAT3 deacetylation/deacetylimination and immune
  regulation; this context-specific intracellular activity is not established as
  the primary function of human LOXL3.
