core_functions:
- description: >-
    Secreted LOXL3 catalyzes copper- and lysine-tyrosylquinone-dependent oxidative
    deamination of peptidyl lysine residues to allysine in extracellular collagen
    and elastin precursors. This core chemistry is supported for recombinant human
    full-length LOXL3 and P58215-2/LOXL3-sv1, with isoform-dependent substrate
    preferences; the exon-4/exon-5-deleted sv2 form corresponding structurally to
    P58215-3 also retains collagen-I-directed activity.
  molecular_function:
    id: GO:0004720
    label: protein-lysine 6-oxidase activity
