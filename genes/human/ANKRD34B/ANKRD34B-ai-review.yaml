knowledge_gaps:
- gap_statement: ANKRD34B's molecular activity, partners and biological role are unknown; its cytosolic
    and neuronal nuclear locations are known.
  boundary: Locations come from HPA (cytosol) and mouse DP58 studies (cytosol in dendritic progenitors,
    nucleus in neurons). The pi-body IBA is a stale propagation from a germline protein now in another
    family. The functional literature is a knockdown that changes lineage markers.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: ANKRD34B is brain-enriched and differentially phosphorylated in neurons and myeloid progenitors,
    but what it does in either is unknown.
  resolution: Identify ANKRD34B partners in neurons, and test loss of function in neurons and dendritic-cell
    progenitors.
  provenance:
  - reference_id: file:human/ANKRD34B/ANKRD34B-uniprot.txt
    supporting_text: DR   GO; GO:0005829; C:cytosol; IDA:HPA.
  - reference_id: PMID:17485271
