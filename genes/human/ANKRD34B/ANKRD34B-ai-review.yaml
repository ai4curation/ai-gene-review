description: ANKRD34B (ankyrin repeat domain-containing 34B; DP58 in mouse) is an ankyrin-repeat phosphoprotein
  of the ANKRD34 family, with brain-enriched expression. Mouse DP58 was found as a cytosolic phosphoprotein
  rapidly induced when bone marrow cells commit to dendritic-cell progenitors, and as a constitutively
  expressed nuclear phosphoprotein in neurons. No molecular activity, partner or biological role has been
  established.
