      was found in this study to be constitutively expressed at a very high level in neuronal nuclei.
  - reference_id: PMID:20184659
    supporting_text: knockdown of Ankrd34b resulted in alteration of NF-H, PPARγ and PECAM1 expression.
  - reference_id: file:human/ANKRD34B/ANKRD34B-deep-research-affinage.md
    supporting_text: Beyond these expression and knockdown studies, the direct binding partners, catalytic
      context, and precise molecular mechanism of ANKRD34B have not been characterized in the available
      corpus.
