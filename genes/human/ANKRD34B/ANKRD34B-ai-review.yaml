suggested_questions:
- question: What controls the switch between the 52 kDa nuclear neuronal form and the 58 kDa inducible
    cytosolic form of DP58/ANKRD34B?
suggested_experiments:
- description: Map ANKRD34B partners in neuronal nuclei by proximity labelling, and test whether its ankyrin
    repeats bind NF-kB family proteins as the BCL3 similarity suggests.
