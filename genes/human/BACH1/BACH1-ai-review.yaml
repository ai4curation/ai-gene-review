  review:
    summary: IMP for DNA repair from Cantor et al. 2001, which characterizes the DEAH-box helicase
      BRCA1-associated C-terminal helicase 1, originally named BACH1 (now BRIP1/FANCJ, Q9BX63).
    action: REMOVE
    reason: Gene-product mis-attribution from a symbol collision. The cited abstract explicitly
      describes a DEAH helicase that binds BRCA1 BRCT repeats; O14867 is a BTB-bZIP transcription
      factor with no helicase domain. No evidence implicates the bZIP BACH1 in DNA repair.
    supported_by:
