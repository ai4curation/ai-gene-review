core_functions:
- description: 'Heme-regulated DNA-binding transcriptional repressor: as a heterodimer with small Maf
    proteins, BACH1 binds MARE/ARE elements in RNA polymerase II enhancers and represses heme catabolism,
    iron storage/export and antioxidant genes (HMOX1, FTL, FTH1, SLC40A1, GCLM, SLC7A11) and, in macrophage
    precursors, SPIC, antagonizing NRF2 at shared sites.'
  molecular_function:
    id: GO:0001227
    label: DNA-binding transcription repressor activity, RNA polymerase II-specific
  directly_involved_in:
  - id: GO:0000122
    label: negative regulation of transcription by RNA polymerase II
  locations:
  - id: GO:0005634
    label: nucleus
  - id: GO:0000785
    label: chromatin
  in_complex:
    id: GO:0090575
    label: RNA polymerase II transcription regulator complex
  supported_by:
  - reference_id: PMID:12356737
    supporting_text: Bach1 bound to the multiple Maf recognition elements (MAREs) of ho-1 enhancers
      with MafK in vitro and repressed their activity in vivo
  - reference_id: PMID:12511571
    supporting_text: We have identified a Maf recognition element in the human HO-1 gene that is
      required for repression of a reporter gene by hypoxia and targeted by Bach1.
  - reference_id: PMID:21555518
    supporting_text: The 59 BACH1 target genes identified by chromatin immunoprecipitation
      sequencing were found highly enriched in genes showing expression changes after BACH1
      knockdown, demonstrating the impact of BACH1 repression on transcription.
  - reference_id: PMID:24630724
    supporting_text: These results demonstrate that Bach1 is a transcriptional repressor of Spic
      that is inhibited by heme.
- description: 'Direct heme sensor: heme binds cysteine-proline motifs in the BACH1 C-terminal region,
    inhibiting DNA binding of the BACH1-small Maf heterodimer and triggering CRM1-dependent nuclear export
    and polyubiquitination/proteasomal degradation, so that rising heme derepresses BACH1 targets.'
  molecular_function:
    id: GO:0098531
    label: ligand-modulated transcription factor activity
  directly_involved_in:
  - id: GO:0000122
    label: negative regulation of transcription by RNA polymerase II
  locations:
