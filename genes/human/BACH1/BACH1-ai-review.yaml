    label: nucleus
  supported_by:
  - reference_id: PMID:11387216
    supporting_text: Mutations in all of the CP motifs of Bach1 abolished its interaction with heme.
  - reference_id: PMID:11387216
    supporting_text: The DNA-binding activity of Bach1 as a MafK hetero-oligomer was markedly
      inhibited by heme in gel mobility shift assays.
  - reference_id: PMID:15175654
    supporting_text: Inhibition of heme synthesis enhanced the nuclear accumulation of Bach1,
      whereas treating cells with hemin resulted in nuclear exclusion of Bach1.
  - reference_id: PMID:17682061
    supporting_text: These results suggest that heme within a cell regulates the polyubiquitination
      and degradation of Bach1.
  - reference_id: PMID:24630724
    supporting_text: heme-mediated induction of Spic proceeds via proteasome-dependent degradation
      of the transcriptional repressor Bach1, and are not dependent on Nrf2.
suggested_questions:
- question: Which of the four (mouse) or corresponding human C-terminal cysteine-proline motifs are
    required for heme-induced FBXO22 versus FBXL17 recognition, and does heme act by unmasking
    BTB-domain degrons or by a separate heme-dependent E3 (HOIL-1/RBCK1)?
- question: Does BACH1 directly occupy the human SPIC locus in monocytes, and is heme-induced BACH1
    degradation the rate-limiting step for human red pulp macrophage specification as in mouse?
- question: Is the reported activator function of BACH1 at pro-metastatic genes a direct DNA-binding
    activity (with which partner, and on which elements) or an indirect consequence of repressing
    other regulators?
- question: Should the CACAO DNA repair annotation from PMID:11301010 be moved from BACH1 (O14867)
    to BRIP1/FANCJ (Q9BX63), the helicase actually studied?
suggested_experiments:
- description: CUT&RUN for BACH1 and MAFK in primary human monocytes with and without heme, combined
    with BACH1 CRISPR knockout and RNA-seq, to define the direct heme-derepressed target set (SPIC,
    HMOX1, SLC40A1) in human cells.
- description: Reconstitute heme-dependent ubiquitination of purified human BACH1 (wild type vs
    CP-motif mutants) with SCF-FBXO22, SCF-FBXL17 and LUBAC/HOIL-1 to determine which E3 directly
    reads the heme-bound state.
- description: Measure heme-binding stoichiometry and affinity of human BACH1 C-terminal region
    (UV-vis/resonance Raman, ITC) for each CP motif mutant to define the sensing threshold relative
    to labile heme concentrations.
