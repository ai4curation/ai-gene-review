- term:
    id: GO:0005634
    label: nucleus
  evidence_type: HDA
  original_reference_id: PMID:16780588
  qualifier: colocalizes_with
  review:
    summary: Cell-array localization screen of chromosome 21 proteins (colocalizes_with).
    action: ACCEPT
    reason: BACH1 is a nuclear transcription repressor that occupies MAREs on chromatin; heme
      triggers its CRM1-dependent export, so nuclear localization is regulated but is where the core
      activity occurs. This overexpression screen saw BACH1 mainly cytosolic at interphase and near
      condensing chromatin in mitosis; the colocalizes_with nucleus row is consistent with
      nucleocytoplasmic shuttling.
    supported_by:
    - &id015
      reference_id: PMID:16780588
      supporting_text: At interphase, BACH1 was distributed in the entire cytosol. During the early
        phase of mitosis, however, the protein accumulated in the vicinity of condensing chromatin
    - &id012
      reference_id: PMID:15175654
      supporting_text: Inhibition of heme synthesis enhanced the nuclear accumulation of Bach1,
        whereas treating cells with hemin resulted in nuclear exclusion of Bach1.
