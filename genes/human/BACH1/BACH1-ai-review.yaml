  review:
    summary: In vitro bZIP coiled-coil interaction of BACH1 with MAFG (Reinke et al. 2010).
    action: MODIFY
    reason: Bare protein binding is uninformative. These coiled-coil array / in vitro dimerization
      assays measure leucine-zipper heterodimer formation between bZIP proteins, which is captured
      by protein heterodimerization activity. BACH1 functions as a heterodimer with small Maf
      proteins; the MAFG pairing is an assayed bZIP heterodimer.
    proposed_replacement_terms:
