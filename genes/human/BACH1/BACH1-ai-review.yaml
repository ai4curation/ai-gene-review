        heterointeractions with 33 representative human bZIPs
    - &id010
      reference_id: PMID:12356737
      supporting_text: While Bach1 forms heterodimers with the small Maf proteins (as does Nrf2),
        the resulting Bach1 heterodimers repress MARE-dependent transcription
