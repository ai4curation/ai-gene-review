    source_defects:
    - defect_type: WRONG_GENE_PRODUCT
      resource: OTHER
      slot: DB_Object_ID
      requested_change: REPOINT
      asserted_value: UniProtKB:O14867
      corrected_value: UniProtKB:Q9BX63
      corrected_label: BRIP1 (FANCJ; BRCA1-associated C-terminal helicase 1, legacy symbol BACH1)
      cause: SYMBOL_COLLISION
      confidence: CONFIRMED
      explanation: CACAO annotation GO:0006281 DNA repair (IMP, PMID:11301010) is attached to the
        bZIP transcription regulator BACH1 (O14867). The paper studies the DEAH helicase that binds
        BRCA1, originally named BACH1 and now BRIP1/FANCJ (Q9BX63). The annotation should be moved
        to Q9BX63 (which likely already carries equivalent annotation) and removed from O14867.
      supported_by:
      - reference_id: PMID:11301010
        supporting_text: BRCA1 interacts in vivo with a novel protein, BACH1, a member of the DEAH
          helicase family.
