id: O14867
gene_symbol: BACH1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'BTB and CNC homology 1 (BACH1) is a BTB-bZIP transcription factor of the CNC family that
  acts mainly as a heme-regulated transcriptional repressor. Through its bZIP domain it heterodimerizes
  with small Maf proteins (MAFK, MAFG, MAFF) and binds Maf recognition / antioxidant response elements
  (MARE/ARE) in RNA polymerase II enhancers, repressing genes of heme degradation, iron storage and export
  and redox defence (HMOX1, FTL, FTH1, SLC40A1, GCLM, SLC7A11) and, in macrophage precursors, the iron-recycling
  macrophage lineage factor SPIC; it antagonizes NRF2 (NFE2L2) at shared sites. Its N-terminal BTB domain
  mediates homodimerization and co-repressor recruitment. BACH1 is a direct heme sensor: heme binds cysteine-proline
  motifs in its C-terminal region, inhibits DNA binding, triggers CRM1-dependent nuclear export and promotes
  polyubiquitination and proteasomal degradation (SCF-FBXO22, SCF-FBXL17, and HOIL-1 in mouse cells),
  so rising heme derepresses its targets. Oxidative stress also releases it from chromatin and exposes
  BTB-domain degrons. In some cancer contexts BACH1 activates pro-metastatic genes.'
