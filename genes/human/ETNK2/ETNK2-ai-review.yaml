id: Q9NVF9
gene_symbol: ETNK2
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  ETNK2 (ethanolamine kinase 2, EC 2.7.1.82) is a cytosolic enzyme of the
  CDP-ethanolamine (Kennedy) branch of phosphatidylethanolamine (PE)
  biosynthesis. It catalyzes the first, committed step of this branch: the
  ATP-dependent phosphorylation of ethanolamine to phosphoethanolamine
  (ethanolamine + ATP = phosphoethanolamine + ADP + H+). ETNK2 is highly
  specific for ethanolamine and, unlike some family members, does not exhibit
  choline kinase activity. It belongs to the choline/ethanolamine kinase family.
  Compared with its paralog ETNK1, ETNK2 has a more restricted expression
  pattern, being enriched in kidney, liver, and reproductive tissues (ovary,
  testis, prostate). The phosphoethanolamine it produces is subsequently
  converted to CDP-ethanolamine and incorporated into phosphatidylethanolamine,
  a major membrane glycerophospholipid.
alternative_products:
- name: '1'
  id: Q9NVF9-1
  description: >-
    Canonical 386-residue isoform (sequence displayed in UniProt Q9NVF9). This is
    the form carrying the complete choline/ethanolamine kinase domain and the one
    to which the catalytic activity, pathway and tissue-specificity annotations
    refer.
- name: '2'
  id: Q9NVF9-2
  sequence_note: VSP_039098
  description: >-
    Alternatively spliced isoform in which the C-terminal 48 residues (339-386) of
    the canonical sequence are replaced by an unrelated 56-residue tail. Reported
    from full-length cDNA sequencing (PubMed:14702039); no isoform-specific
    activity, stability or localization has been measured, so no annotation is
    assigned to it.
- name: '3'
  id: Q9NVF9-3
  sequence_note: VSP_039558
  description: >-
    Alternatively spliced isoform lacking residues 173-213, an internal 41-residue
    deletion within the choline/ethanolamine kinase domain. Reported from
    full-length cDNA sequencing (PubMed:14702039). An in-frame deletion inside the
    catalytic domain would be expected to disrupt the fold, but this has not been
    tested, so no annotation is assigned to it.
existing_annotations:
- term:
    id: GO:0004305
    label: ethanolamine kinase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: >-
      Core molecular function. ETNK2 phosphorylates ethanolamine to
      phosphoethanolamine using ATP (EC 2.7.1.82). This IBA annotation from the
      choline/ethanolamine kinase phylogenetic tree is consistent with the
      UniProt-curated function and catalytic activity, which state the enzyme is
      highly specific for ethanolamine. Retain as a core function.
    action: ACCEPT
    reason: >-
      ACCEPT: this is the gene's defining molecular function, and enables is the
      right qualifier because ETNK2 performs the phosphoryl transfer itself rather
      than contributing to a multi-subunit active site. The node placement here is
      unusually well grounded for an IBA - the WITH/FROM list spans fourteen
      descendant evidences across fungi, nematode, fly, rodent and human
      (PANTHER:PTN000503516, with SGD:S000002554, SGD:S000004123, FB:FBgn0000536,
      WB:WBGene00000510, MGI:MGI:2443760, RGD:61944 and UniProtKB:Q9Y259 = human
      ETNK1 among them), so ethanolamine kinase activity is ancestral to the family
      rather than a recent, lineage-specific acquisition that might not have reached
      ETNK2.
    supported_by:
    - reference_id: file:human/ETNK2/ETNK2-uniprot.txt
      supporting_text: >-
        Catalyzes the ATP-dependent phosphorylation of ethanolamine
        to phosphoethanolamine
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  review:
    summary: >-
      ETNK2 acts in the cytosol, so this cytoplasm annotation is correct but
      less specific than warranted. Reactome (R-HSA-1483222) places the
      ethanolamine phosphorylation reaction in the cytosol. Modify to the more
      specific cytosol (GO:0005829), which is separately supported by the
      TAS/Reactome annotation.
    action: MODIFY
    reason: >-
      MODIFY on granularity, not correctness. Q9NVF9 has no signal peptide,
      transmembrane segment or organellar targeting sequence, and Reactome places
      the ETNK1/2-catalyzed reaction explicitly "in the cytosol", so GO:0005829 is
      both true and strictly more informative than its parent. The imprecision is a
      property of the ancestral node rather than of human ETNK2: the IBD was placed
      using descendants that include fungal and nematode members
      (PomBase:SPAC13G7.12c, WB:WBGene00000509), and cytoplasm is the most specific
      compartment the curator could assert across that whole clade. Nothing about
      the orthology or the compartment is in dispute.
    proposed_replacement_terms:
    - id: GO:0005829
      label: cytosol
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN000503516
        source_label: choline/ethanolamine kinase ancestral node
        source_status: SUPPORTS_TRANSFER
        comment: >-
          Soluble cytoplasmic localization is correct for the clade; only the
          granularity is suboptimal for human ETNK2, where Reactome supports the
          cytosol child.
    supported_by:
    - reference_id: Reactome:R-HSA-1483222
      supporting_text: >-
        In the cytosol, ethanolamine (ETA) is phosphorylated to
        phosphoethanolamine (PETA)
- term:
    id: GO:0006646
    label: phosphatidylethanolamine biosynthetic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: >-
      Core biological process. ETNK2 catalyzes the first step of the
      CDP-ethanolamine (Kennedy) pathway, producing phosphoethanolamine for
      downstream conversion to phosphatidylethanolamine. UniProt annotates the
      pathway as "phosphatidylethanolamine biosynthesis; phosphatidylethanolamine
      from ethanolamine: step 1/3". Retain as a core function.
    action: ACCEPT
    reason: >-
      ACCEPT because ETNK2 itself performs a step of the process: it catalyzes
      step 1/3 of the route from ethanolamine to phosphatidylethanolamine, so
      involved_in reflects participation rather than mere necessity or being acted
      upon. The committed nature of the step matters here - phosphoethanolamine has
      no other principal fate in this pathway, so the kinase is inside the
      biosynthetic route and not merely upstream of it.
    supported_by:
    - reference_id: file:human/ETNK2/ETNK2-uniprot.txt
      supporting_text: >-
        Phospholipid metabolism; phosphatidylethanolamine
- term:
    id: GO:0004305
    label: ethanolamine kinase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: >-
      Same core molecular function as the IBA annotation, here derived
      electronically from EC 2.7.1.82 / Rhea:RHEA:13069 mapping (and the mouse
      ortholog A7MCT6). Fully consistent with the curated catalytic activity.
      Retain as a core function.
    action: ACCEPT
    reason: >-
      ACCEPT: the electronic pipeline reaches the specific activity term from the
      reaction UniProt records for this entry (RHEA:13069, EC 2.7.1.82) plus the
      mouse ortholog A7MCT6, which is a different route to the same conclusion as
      the phylogenetic IBA. Both ultimately rest on ECO:0000250 transfer from mouse
      Etnk2 rather than on an assay of the human protein; that is a reason to flag
      the open experimental question, not to downgrade the annotation.
    supported_by:
    - reference_id: file:human/ETNK2/ETNK2-uniprot.txt
      supporting_text: >-
        Reaction=ethanolamine + ATP = phosphoethanolamine + ADP + H(+)
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:32296183
  qualifier: enables
  review:
    summary: >-
      Bare "protein binding" from the HuRI systematic yeast two-hybrid binary
      interactome screen (Luck et al. 2020), assigned by IntAct. This single review
      row stands for six IPI interactions in GOA (with ATN1, CYSRT1, HNRNPK,
      KRTAP12-2, MID2, STX1A), all also listed in the UniProt INTERACTION block.
      These are high-throughput binary interactions with no established
      relationship to ETNK2's ethanolamine kinase function; several partners (e.g.
      the keratin-associated protein KRTAP12-2) are the kind of frequently
      recovered Y2H hits. GO:0005515 is uninformative for molecular function.
    action: REMOVE
    reason: >-
      REMOVE per the generic-protein-binding policy: the defect is absence of
      functional information, not a claim exceeding the evidence, so
      MARK_AS_OVER_ANNOTATED is excluded for GO:0005515 by name. Removal does not
      assert the interactions are false - all six are recorded by UniProt with
      NbExp=3. MODIFY is not available: none of the six partners sits in lipid
      metabolism (ATN1 is a nuclear transcriptional corepressor, HNRNPK an RNA-binding
      protein, STX1A a SNARE, MID2 an E3 ligase, CYSRT1 and KRTAP12-2 small
      cysteine-rich keratin-associated proteins), and HuRI assigns no function to
      any of them with respect to ETNK2, so there is no evidence-backed, more
      informative molecular function to substitute. Whether any of the six is
      biologically real is raised under suggested_questions rather than asserted
      here.
    supported_by:
    - reference_id: PMID:32296183
      supporting_text: >-
        Here we present a human 'all-by-all' reference interactome map of human
        binary protein interactions, or 'HuRI'.
    - reference_id: file:human/ETNK2/ETNK2-uniprot.txt
      supporting_text: >-
        Q9NVF9; P59991: KRTAP12-2; NbExp=3; IntAct=EBI-751864, EBI-10176379;
- term:
    id: GO:0006646
    label: phosphatidylethanolamine biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000041
  qualifier: involved_in
  review:
    summary: >-
      Same core biological process as the IBA annotation, here derived from the
      UniPathway mapping (UPA00558) recorded in UniProt as "phosphatidylethanolamine
      biosynthesis; phosphatidylethanolamine from ethanolamine: step 1/3".
      Consistent and retained as a core function.
    action: ACCEPT
    reason: >-
      ACCEPT: the UniPathway mapping encodes the enzyme's position in the route
      (step 1/3), which is exactly the participation claim involved_in makes.
      Agreement with the phylogenetic IBA from an independent mapping is a reason to
      keep the row rather than prune it as duplicative.
    supported_by:
    - reference_id: file:human/ETNK2/ETNK2-uniprot.txt
      supporting_text: >-
        phosphatidylethanolamine from ethanolamine: step 1/3
- term:
    id: GO:0005829
    label: cytosol
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-1483222
  qualifier: located_in
  review:
    summary: >-
      Core cellular location. Reactome places the ETNK1/2-catalyzed
      phosphorylation of ethanolamine to phosphoethanolamine in the cytosol,
      consistent with a soluble cytosolic enzyme of the Kennedy pathway. Retain.
    action: ACCEPT
    reason: >-
      ACCEPT: this is the most specific supported location and is the one carried
      into core_functions, with the broader GO:0005737 IBA marked MODIFY in its
      favour. It is consistent with the protein's own features (no targeting or
      membrane-anchoring sequence in Q9NVF9) and with the topology of the Kennedy
      pathway, whose soluble first two steps precede the ER-membrane
      ethanolaminephosphotransferase step. No primary paper in this review measures
      ETNK2's subcellular fractionation directly, so the supporting quote is
      Reactome's own curated statement.
    supported_by:
    - reference_id: Reactome:R-HSA-1483222
      supporting_text: >-
        In the cytosol, ethanolamine (ETA) is phosphorylated to
        phosphoethanolamine (PETA)
- term:
    id: GO:0005524
    label: ATP binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000043
  qualifier: enables
  review:
    summary: >-
      Not present as a stand-alone row in the GOA TSV, but recorded in the
      UniProt cross-reference block as "GO:0005524; F:ATP binding;
      IEA:UniProtKB-KW" (from the ATP-binding keyword). ETNK2 uses ATP as the
      phosphate donor in the ethanolamine kinase reaction (ethanolamine + ATP =
      phosphoethanolamine + ADP + H+), so ATP binding is a genuine molecular
      activity of the protein. Surfaced here as a NEW row.
    action: NEW
    reason: >-
      NEW, and specifically not a case of adding what curators declined to add:
      the annotation already exists upstream. Q9NVF9's UniProt DR block carries
      "GO:0005524; F:ATP binding; IEA:UniProtKB-KW", and the reason it is missing
      from existing_annotations is that the GOA/QuickGO export used to seed this
      review contains no GO_REF:0000043 keyword-mapping rows at all for this gene.
      The comparator check confirms this is an export artefact rather than a
      curatorial judgment: ETNK1, CHKA and CHKB each likewise carry GO:0005524 in
      their UniProt DR block while their GOA exports contain zero GO_REF:0000043
      rows, so the whole choline/ethanolamine kinase family shows the same pattern.
      On the biology, the binding is performed by ETNK2 itself - ATP is the
      phosphoryl donor consumed in the reaction it catalyzes, and the Nucleotide-binding
      keyword is on the entry - so this is the cofactor/substrate-binding case rather
      than a necessity-only relationship. Evidence is kept as IEA (UniProtKB-KW), the
      code the upstream annotation actually carries; no ATP-binding residues are
      annotated on the human entry, which is why no residue-level claim is made.
    supported_by:
    - reference_id: file:human/ETNK2/ETNK2-uniprot.txt
      supporting_text: >-
        Reaction=ethanolamine + ATP = phosphoethanolamine + ADP + H(+)
    - reference_id: file:human/ETNK2/ETNK2-uniprot.txt
      supporting_text: >-
        GO; GO:0005524; F:ATP binding; IEA:UniProtKB-KW.
