suggested_questions:
- question: >-
    Every functional statement on the human entry - the activity, the
    ethanolamine specificity, the absence of choline kinase activity and the
    pathway position - is ECO:0000250 transfer from mouse Etnk2 (UniProtKB:A7MCT6).
    What are the steady-state kinetics and the choline/ethanolamine selectivity of
    purified human ETNK2, and is the human enzyme as strictly ethanolamine-specific
    as the mouse protein?
- question: >-
    Humans have two dedicated ethanolamine kinases with very different expression
    breadth: ETNK1 is broadly expressed, whereas ETNK2 is confined to kidney,
    liver and reproductive tissues. Are their roles non-redundant - does ETNK2 loss
    lower phosphatidylethanolamine synthesis in those tissues despite ETNK1 being
    present, and do the two isozymes differ in regulation or in Km for
    ethanolamine?
- question: >-
    Isoform 3 (Q9NVF9-3) carries a 41-residue in-frame deletion (173-213) inside
    the choline/ethanolamine kinase domain and isoform 2 (Q9NVF9-2) replaces the
    C-terminal 48 residues. Are either expressed as stable protein in the tissues
    where ETNK2 is enriched, and do they retain kinase activity or act as
    dominant-negative partners?
- question: >-
    All six reported ETNK2 interactors come from one all-by-all Y2H screen and
    none is a lipid-metabolic protein. Are any of them reproducible by an
    orthogonal method in cells that express ETNK2 endogenously, and does any of them
    affect ethanolamine kinase activity or ETNK2 abundance?
suggested_experiments:
- hypothesis: >-
    Purified human ETNK2 is a strictly ethanolamine-specific kinase, with no
    detectable choline kinase activity, matching the mouse ortholog from which its
    annotations are inherited.
  description: >-
    Express and purify recombinant human ETNK2, then measure phosphoryl transfer to
    ethanolamine and to choline in parallel under identical conditions, determining
    Km and kcat for each and the ATP Km, by coupled spectrophotometric assay or by
    LC-MS quantification of phosphoethanolamine and phosphocholine. Run human ETNK1
    and CHKA alongside as specificity benchmarks. This would convert the activity
    and the specificity claim from by-similarity inferences into direct human
    measurements and would also settle whether the EC 2.7.1.82 assignment should
    still be qualified.
  experiment_type: recombinant enzyme kinetics with paired substrate-specificity assay
- hypothesis: >-
    ETNK2 makes a non-redundant contribution to phosphatidylethanolamine synthesis
    in kidney and liver, so its loss reduces flux through the CDP-ethanolamine
    pathway even where ETNK1 is expressed.
  description: >-
    Knock out ETNK2 and ETNK1 singly and together in a hepatocyte or renal
    epithelial line, then follow the fate of deuterium- or 13C-labelled ethanolamine
    by LC-MS, quantifying phosphoethanolamine, CDP-ethanolamine and
    phosphatidylethanolamine species. Accumulation of free ethanolamine with reduced
    downstream label in the ETNK2 single knockout would establish a non-redundant
    role; rescue with wild-type but not with the isoform-3 deletion variant would tie
    the flux to the intact catalytic domain.
  experiment_type: stable-isotope lipid flux analysis in single and double knockouts
- hypothesis: >-
    The six HuRI-reported ETNK2 interactions are Y2H-specific and do not occur
    between endogenously expressed proteins, so no more informative molecular
    function is warranted in place of the removed protein-binding annotation.
  description: >-
    Attempt orthogonal validation of each of the six partners (ATN1, CYSRT1,
    HNRNPK, KRTAP12-2, MID2, STX1A) by reciprocal endogenous co-immunoprecipitation
    and by proximity labelling from tagged ETNK2 in a kidney or liver line, then test
    whether any validated partner alters ethanolamine kinase activity in vitro or
    ETNK2 protein half-life in cells. A uniformly negative result supports leaving
    the generic term removed; a positive one would identify the specific molecular
    function this review could not propose.
  experiment_type: orthogonal interaction validation with activity and stability readouts
references:
- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  findings:
  - statement: >-
      GO_Central phylogenetic inference supplies three ETNK2 annotations from node
      PANTHER:PTN000503516 - ethanolamine kinase activity (GO:0004305), the
      phosphatidylethanolamine biosynthetic process (GO:0006646) and cytoplasm
      (GO:0005737). The descendant evidences span fungi, nematode, fly, rodent and
      human (including SGD:S000002554, SGD:S000004123, WB:WBGene00000510,
      FB:FBgn0000536, MGI:MGI:2443760, RGD:61944 and human ETNK1
      UniProtKB:Q9Y259), so the activity is ancestral to the family rather than
      lineage-specific. The cytoplasm term reflects the most specific compartment
      assertable across that whole clade, which is why it is modified to cytosol
      for human ETNK2 rather than rejected.
    reference_section_type: DATABASE_ENTRY
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Correctly cited for the three IBA rows; node and WITH/FROM entries taken from
      the GOA rows. The donor list is broad and includes experimentally
      characterized fungal and human family members, so the node placement is not
      in question.
- id: GO_REF:0000043
  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot keyword mapping
  findings:
  - statement: >-
      The keyword-mapping pipeline is the source of the GO:0005524 ATP binding
      annotation that appears in Q9NVF9's UniProt DR block as "F:ATP binding;
      IEA:UniProtKB-KW". No GO_REF:0000043 rows appear in the GOA/QuickGO export
      used to seed this review - for ETNK2 or for its paralogs ETNK1, CHKA and
      CHKB, all of which carry the same DR line - so the absence of ATP binding
      from existing_annotations is an export artefact, not a curatorial decision.
      That is the basis for surfacing it as a NEW row.
    reference_section_type: DATABASE_ENTRY
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Correctly cited as the pipeline behind the UniProt keyword-derived ATP
      binding annotation. The family-wide comparison that establishes the export
      artefact was made against the committed GOA TSVs and UniProt entries for
      ETNK1, CHKA and CHKB in this repository.
- id: GO_REF:0000041
  title: Gene Ontology annotation based on UniPathway vocabulary mapping
  findings:
  - statement: >-
      Source of the GO:0006646 IEA row, derived from UniPathway UPA00558, which
      UniProt records as "phosphatidylethanolamine biosynthesis;
      phosphatidylethanolamine from ethanolamine: step 1/3". The mapping encodes
      ETNK2's position within the route, which is exactly the participation claim
      the involved_in qualifier makes.
    reference_section_type: DATABASE_ENTRY
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Correctly cited for the UniPathway-derived process row; the mapping reaches
      the appropriate process term and agrees with the phylogenetic IBA.
- id: GO_REF:0000120
  title: Combined Automated Annotation using Multiple IEA Methods
  findings:
  - statement: >-
      Combined multi-method electronic annotation reaches the specific catalytic
      term GO:0004305 from the Rhea reaction (RHEA:13069), the EC number
      (2.7.1.82) and the mouse ortholog (UniProtKB:A7MCT6,
      ensembl:ENSMUSP00000114272). Unlike a superfamily domain match, this pipeline
      arrives at the precise activity, and it agrees with the phylogenetic IBA.
    reference_section_type: DATABASE_ENTRY
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Correctly cited for the RHEA/EC/ortholog-derived activity row. Note that the
      mouse-ortholog component shares its ultimate source with UniProt's
      ECO:0000250 function statements, so this row is not fully independent of them.
- id: PMID:32296183
  title: A reference map of the human binary protein interactome.
  findings:
  - statement: >-
      HuRI is an all-by-all yeast two-hybrid reference map of roughly 53,000 human
      binary protein interactions. ETNK2 appears in it only as one node of that
      systematic screen, with six partners (ATN1, CYSRT1, HNRNPK, KRTAP12-2, MID2,
      STX1A); none is a lipid-metabolic protein and the study assigns no function
      to any of the associations, which is why no more informative molecular
      function could be substituted for the removed protein-binding term.
    reference_section_type: ABSTRACT
    supporting_text: >-
      Here we present a human 'all-by-all' reference interactome map of human
      binary protein interactions, or 'HuRI'.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      HuRI systematic all-by-all Y2H binary interactome (PubMed-verified). Source
      of six IntAct GO:0005515 protein-binding IPI annotations for ETNK2. These are
      high-throughput binary interactions with no established relevance to ETNK2's
      ethanolamine kinase function; contextual/background only.
- id: Reactome:R-HSA-1483222
  title: ETA is phosphorylated to PETA by CHK/ETNK
  findings:
  - statement: >-
      Reactome curates the phosphorylation of ethanolamine to phosphoethanolamine
      as a cytosolic reaction carried out either by a choline kinase (CHKA/CHKB)
      dimer or by ethanolamine kinase 1/2. This is the basis for the cytosol
      location annotation and for preferring GO:0005829 over the broader
      GO:0005737 from the phylogenetic transfer. It also records that the step is
      shared with the choline kinases, which is the context for asking what
      non-redundant role ETNK2 plays.
    reference_section_type: DATABASE_ENTRY
    supporting_text: >-
      In the cytosol, ethanolamine (ETA) is phosphorylated to phosphoethanolamine
      (PETA) by choline kinase (CHK) dimer or by ethanolamine kinase 1/2 (ETNK1/2)
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Reactome reaction placing the ETNK1/2-catalyzed step in the cytosol;
      supports the location annotation and the pathway context.
- id: file:human/ETNK2/ETNK2-uniprot.txt
  title: UniProtKB entry Q9NVF9 (EKI2_HUMAN), Ethanolamine kinase 2
  findings:
  - statement: >-
      ETNK2 catalyzes the ATP-dependent phosphorylation of ethanolamine to
      phosphoethanolamine (RHEA:13069, EC 2.7.1.82) and is highly specific for
      ethanolamine, without choline kinase activity. Critically, both the function
      and the catalytic-activity statements are ECO:0000250|UniProtKB:A7MCT6 -
      transferred from the mouse ortholog - so no claim in this review rests on an
      assay of the human protein.
    reference_section_type: DATABASE_ENTRY
    supporting_text: >-
      Catalyzes the ATP-dependent phosphorylation of ethanolamine
      to phosphoethanolamine
  - statement: >-
      The enzyme occupies step 1/3 of the route from ethanolamine to
      phosphatidylethanolamine (UniPathway UPA00558) and belongs to the
      choline/ethanolamine kinase family.
    reference_section_type: DATABASE_ENTRY
    supporting_text: >-
      phosphatidylethanolamine from ethanolamine: step 1/3
  - statement: >-
      Expression is restricted relative to the broadly expressed paralog ETNK1 -
      kidney, liver, ovary, testis and prostate, with experimental evidence
