- id: PMID:20865800
  title: Folding of Toll-like receptors by the HSP90 paralogue gp96 requires a substrate-specific
    cochaperone.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text is cached and directly characterizes mouse Cnpy3. It
      establishes direct, ATP-sensitive gp96 binding, cooperative TLR9 binding,
      substrate loading and a requirement for the gp96-Cnpy3 interaction in TLR
      folding. Human mechanistic attribution remains orthology-based.
  findings:
  - statement: Mouse Cnpy3 directly binds gp96 in vitro; nucleotide disrupts the
      interaction, and Cnpy3 was proposed to stabilize a substrate-loading conformation
      of gp96.
    reference_section_type: RESULTS
  - statement: Cnpy3 and gp96 depend on each other for efficient TLR9 binding, and
      loss of their interaction blocks TLR9 folding and maturation.
    reference_section_type: RESULTS
  - statement: Cnpy3 lacks intrinsic ATPase activity and does not significantly alter
      gp96 ATPase activity, supporting a substrate-loading co-chaperone rather than
      autonomous foldase mechanism.
    reference_section_type: RESULTS
- id: PMID:29394991
  title: Biallelic Variants in CNPY3, Encoding an Endoplasmic Reticulum Chaperone,
    Cause Early-Onset Epileptic Encephalopathy.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The cached record is abstract-only. It directly establishes biallelic
      human CNPY3 variants, markedly reduced CNPY3 in patient lymphoblastoid cells,
      and DEE60, but does not directly assay the human gp96-TLR folding mechanism.
  findings:
  - statement: Three affected individuals carried biallelic CNPY3 variants, and
      patient-derived lymphoblastoid cells from two siblings had severely reduced
      CNPY3 abundance.
    reference_section_type: ABSTRACT
