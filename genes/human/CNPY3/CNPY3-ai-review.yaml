core_functions:
- description: >-
    TLR-specific ER co-chaperone that binds HSP90B1/gp96 and promotes loading of
    TLR substrates into the gp96 folding cycle. Direct biochemical evidence is
    from mouse Cnpy3; the conserved human interaction is supported by orthology
    and reviewed UniProt annotation. CNPY3 is not an autonomous foldase, in-situ
    holdase, or carrier-holdase.
  molecular_function:
    id: GO:0051879
    label: Hsp90 protein binding
  supported_by:
  - reference_id: PMID:20865800
    supporting_text: >-
      We suggest that CNPY3 interacts with the ATP-sensitive conformation of gp96
      to promote substrate loading.
  - reference_id: file:human/CNPY3/CNPY3-uniprot.txt
    supporting_text: >-
      Interacts with HSP90B1; this interaction is disrupted in the presence of
      ATP.
- description: >-
    Promotes folding of TLRs in the ER and controls their exit from the ER to the
    cell surface (TLR1/2/4/5) or endosomes (TLR7/9), thereby enabling innate
    immune signaling. TLR3 folding is CNPY3-independent.
  directly_involved_in:
  - id: GO:0034975
    label: protein folding in endoplasmic reticulum
  - id: GO:0045087
    label: innate immune response
  locations:
  - id: GO:0005788
    label: endoplasmic reticulum lumen
  supported_by:
  - reference_id: PMID:20865800
    supporting_text: >-
      We conclude that both gp96 and CNPY3 must be present to complete the folding
      cycle of TLR9 to avoid the overloading and induction of the general molecular
      chaperone machinery in the ER.
  - reference_id: file:human/CNPY3/CNPY3-uniprot.txt
    supporting_text: Consequently, required for both innate and adaptive immune
      responses.
proposed_new_terms: []
suggested_questions:
- question: Does human CNPY3 directly bind the same TLR set (TLR1/2/4/5/7/9 but not TLR3) as established for mouse PRAT4A, and which TLR ectodomain regions are engaged by the saposin-like/ML domain?
- question: Is CNPY3 a general ER co-chaperone with additional non-TLR clients, or is its client repertoire restricted to TLRs?
- question: How does the DEE60-associated pathology relate to CNPY3 chaperone function - is it driven by impaired TLR trafficking/innate immunity, or by a separate neuronal client?
suggested_experiments:
- description: Co-immunoprecipitation and proximity-labeling (e.g. BioID/APEX) of endogenous CNPY3 in human immune cells to define its direct clients and confirm ATP-sensitive HSP90B1 binding.
- description: CNPY3 knockout/knockdown in human cells followed by flow cytometry and surface/endosomal trafficking assays for TLR1/2/4/5/7/9 (and TLR3 as a negative control) to quantify TLR maturation and ER exit.
- description: Functional reconstitution of DEE60 patient missense variants (e.g. Gly125Arg) to test effects on CNPY3 stability, HSP90B1 binding, and TLR folding/trafficking.
