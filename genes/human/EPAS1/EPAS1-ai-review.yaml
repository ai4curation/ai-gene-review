- term:
    id: GO:0001525
    label: angiogenesis
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:109169
  - PANTHER:PTN002745909
  review:
    summary: Angiogenesis is a real but context-specific EPAS1 output.
    action: KEEP_AS_NON_CORE
    reason: EPAS1 regulates endothelial and adipose angiogenic programs, including 
      VEGF-dependent adipose vascularization, but angiogenesis is a tissue-level output 
      of the core HIF-2alpha transcription-factor activity rather than the molecular 
      function itself.
    supported_by:
    - reference_id: PMID:26572826
      supporting_text: VEGF treatment reversed the enhanced weight of obese BAT due to 
        adipocyte HIF2α deficiency
- term:
    id: GO:0001666
    label: response to hypoxia
  evidence_type: IDA
  original_reference_id: PMID:11782478
  qualifier: acts_upstream_of_or_within
  review:
    summary: EPAS1 oxygen-regulated HIF-alpha transcriptional response.
    action: ACCEPT
    reason: EPAS1 is an oxygen-regulated HIF alpha subunit whose HIF-2alpha transcriptional
      responses are part of the cellular hypoxia response; this broad response-to-hypoxia row
      is true and consistent with more specific GO:0071456 rows elsewhere in this review.
    supported_by:
    - reference_id: PMID:30429208
      supporting_text: The two principal HIF-α isoforms, HIF-1α and HIF-2α, are 
        progressively stabilized in response to hypoxia and form heterodimers with 
        HIF-1β to activate a broad range of transcriptional responses.
- term:
    id: GO:0001974
    label: blood vessel remodeling
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:109169
  - PANTHER:PTN002745909
  review:
    summary: Blood-vessel remodeling is a developmental EPAS1 output.
    action: KEEP_AS_NON_CORE
    reason: The vascular-remodeling IBA follows the EPAS1 angiogenic/developmental PAINT
      node and is plausible for HIF-2alpha, but it is a context-specific organismal 
      output downstream of EPAS1 target-gene activation.
    supported_by:
    - reference_id: PMID:26572826
      supporting_text: VEGF treatment reversed the enhanced weight of obese BAT due to 
        adipocyte HIF2α deficiency
