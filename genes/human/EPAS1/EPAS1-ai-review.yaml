core_functions:
- description: EPAS1/HIF-2alpha heterodimerizes with ARNT/HIF-1beta to form a nuclear 
    HIF-2 RNA polymerase II transcription-regulator complex that binds HRE-containing 
    regulatory chromatin and activates hypoxia-responsive target genes through CBP/p300 
    coactivator recruitment.
  molecular_function:
    id: GO:0001228
    label: DNA-binding transcription activator activity, RNA polymerase II-specific
  directly_involved_in:
  - id: GO:0045944
    label: positive regulation of transcription by RNA polymerase II
  - id: GO:0071456
    label: cellular response to hypoxia
  locations:
  - id: GO:0000785
    label: chromatin
  in_complex:
    id: GO:0090575
    label: RNA polymerase II transcription regulator complex
  supported_by:
  - reference_id: PMID:9000051
    supporting_text: Like HIF-1alpha, EPAS1 binds to and activates transcription from a 
      DNA element originally isolated from the erythropoietin gene and containing the 
      sequence 5'-GCCCTACGTGCTGTCTCA-3'.
  - reference_id: PMID:9000051
    supporting_text: EPAS1 forms a heterodimeric complex with the aryl hydrocarbon 
      nuclear transporter prior to transcriptional activation of target genes.
  - reference_id: PMID:30429208
    supporting_text: The two principal HIF-α isoforms, HIF-1α and HIF-2α, are 
      progressively stabilized in response to hypoxia and form heterodimers with HIF-1β 
      to activate a broad range of transcriptional responses.
  - reference_id: PMID:30429208
    supporting_text: Here, we report on the pan-genomic distribution of isoform-specific
      HIF binding in response to hypoxia of varying severity and duration
proposed_new_terms: []
suggested_questions:
- question: Which EPAS1 angiogenic and erythropoietic process rows should be represented
    only through GO-CAM target-gene models rather than as direct gene-level 
    biological-process annotations?
- question: Do the mouse myoblast fate-commitment transfers reflect direct HIF-2alpha 
    transcriptional participation in myoblast specification, or are they indirect 
    developmental phenotypes?
suggested_experiments:
- hypothesis: Endogenous human EPAS1 directly controls a cell-type-specific subset of 
    HRE-containing enhancers that couple HIF-2 chromatin occupancy to Pol II 
    transcriptional activation.
  description: Perform EPAS1/HIF-2alpha and ARNT CUT&RUN or ChIP-seq with matched 
    nascent RNA profiling in EPAS1 knockout and rescue cells across graded hypoxia and 
    reoxygenation time courses to separate direct HIF-2 targets from downstream 
    tissue-specific outputs.
  experiment_type: endogenous HIF-2 CUT&RUN and nascent RNA-seq
