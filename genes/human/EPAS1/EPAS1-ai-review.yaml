id: Q99814
gene_symbol: EPAS1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'EPAS1/HIF-2alpha is an oxygen-regulated bHLH-PAS transcription factor alpha
  subunit that heterodimerizes with ARNT/HIF-1beta, binds hypoxia-response elements in regulatory
  chromatin, recruits CBP/p300 coactivators, and activates RNA polymerase II target-gene transcription.
  By controlling hypoxia-responsive gene-expression programs, EPAS1 supports cellular adaptation
  to low oxygen and context-specific angiogenic, erythropoietic, vascular, lung, adipose and
  thermogenic physiology.'
