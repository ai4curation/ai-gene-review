- description: Microglia-derived, extremely basic extracellular innate immune factor that accumulates
    on bacterial lipopolysaccharide in the brain, forming RTL6-cored complexes that trap LPS, and is required
    for its clearance; whether it binds LPS directly and how it signals to microglia remain open.
