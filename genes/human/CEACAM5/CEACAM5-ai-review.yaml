      of their anchorage to the extracellular matrix
  - reference_id: PMID:10931872
    supporting_text: the CEA, CEACAM1, or NCAM extracellular domains are sufficient to inhibit differentiation
      when attached specifically to a CEA GPI anchor
suggested_questions:
- question: How does a GPI-anchored protein with no cytoplasmic domain transmit the anti-anoikis and differentiation-blocking
    signals - through raft partitioning, a transmembrane co-receptor, or both?
- question: What distinguishes the apical, glycocalyx-restricted CEA of normal colon from the depolarized
    surface pool of carcinoma cells in terms of accessibility to therapeutic antibodies?
suggested_experiments:
- hypothesis: The anti-anoikis activity of CEA requires a transmembrane partner that couples the GPI-anchored
    ectodomain to intracellular survival signalling.
  description: Use proximity labelling from GPI-anchored CEA in detached colorectal carcinoma cells to
    identify raft-resident transmembrane partners, then test each by knockout for loss of anoikis resistance
    with CEA still expressed.
