id: P06731
gene_symbol: CEACAM5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CEACAM5 (carcinoembryonic antigen, CEA) is a heavily glycosylated member of the immunoglobulin
  superfamily built from an N-terminal IgV-like domain followed by three IgC2-like repeat domains, and
  attached to the outer leaflet of the plasma membrane by a glycosylphosphatidylinositol anchor. In normal
  colonic and other mucosal epithelium it is concentrated on the apical surface as a component of the
  glycocalyx; it is strongly overexpressed and distributed over the whole surface in colorectal, gastric,
  pancreatic, lung and breast carcinomas, where it is a classical serum tumour marker and a major antibody
  and CAR-T target. Its N-terminal domain mediates homophilic adhesion and heterophilic adhesion to other
  family members such as CEACAM6, driving cell aggregation. Overexpression blocks terminal differentiation
  (for example myoblast fusion), disrupts tissue architecture, and protects cells from apoptosis and from
  anoikis, functions that require the GPI anchor as well as the adhesive ectodomain. The exposed ectodomain
  is also exploited as an attachment receptor by pathogens, including Escherichia coli Dr adhesins and
  MERS coronavirus.
