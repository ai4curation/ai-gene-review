    label: GPI anchor binding
  evidence_type: IMP
  original_reference_id: PMID:10931872
  qualifier: enables
  review:
    summary: GPI anchor binding inferred from the chimera study of CEA's differentiation-blocking activity.
    action: REMOVE
    reason: The cited work shows that CEA's own GPI anchor carries the functional information needed to
      block myogenic differentiation; it does not show that CEA binds a GPI anchor as a ligand. The molecular-function
      term misreads a structural requirement as a binding activity.
    supported_by:
    - reference_id: PMID:10931872
      supporting_text: We therefore suggest that biologically significant functional information resides
        in the processed extreme COOH terminus of CEA and in the GPI anchor that it determines
    - reference_id: PMID:10931872
      supporting_text: the CEA, CEACAM1, or NCAM extracellular domains are sufficient to inhibit differentiation
        when attached specifically to a CEA GPI anchor
    source_defects:
    - defect_type: WRONG_TERM
      resource: UNIPROT
      slot: Evidence_Code
      requested_change: DELETE_ROW
      asserted_value: GO:0034235
      cause: OTHER
      confidence: PROBABLE
      explanation: PMID:10931872 uses CEA/CEACAM1/NCAM chimeras to show that the differentiation-blocking
        activity of CEA depends on its own GPI anchor, not on CEA binding a GPI anchor on another molecule.
        The IMP annotation of GO:0034235 (GPI anchor binding) to CEACAM5 therefore records a structural
        requirement as a binding function.
      supported_by:
      - reference_id: PMID:10931872
        supporting_text: Conversely, CEA could be converted into a neutral protein by exchanging its GPI
          anchor for the TM anchor of CEACAM1.
