      tail
- description: When overexpressed, as in carcinomas, CEA blocks terminal differentiation and protects
    cells from apoptosis on loss of matrix attachment (anoikis); both the adhesive ectodomain and the
    GPI anchor are required.
  directly_involved_in:
  - id: GO:2000811
    label: negative regulation of anoikis
  locations:
  - id: GO:0009986
    label: cell surface
