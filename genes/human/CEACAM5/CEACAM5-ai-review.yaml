core_functions:
- description: 'GPI-anchored immunoglobulin-superfamily adhesion molecule displayed on the external face
    of the plasma membrane (apical glycocalyx in normal epithelium): its N-terminal IgV domain self-associates
    and binds other CEACAMs, mediating homophilic and heterophilic intercellular adhesion and cell aggregation.'
  molecular_function:
    id: GO:0050839
    label: cell adhesion molecule binding
  directly_involved_in:
