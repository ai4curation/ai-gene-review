    supporting_text: >-
      Beyond this in vitro activation and transfer chemistry, no downstream pathway or in vivo
      role for AASDH has been established in the available corpus.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      External precomputed LLM research, treated as a preliminary source; every claim used was
      re-verified against PMID:24467666. Accurate and appropriately restrained - it identifies
      the beta-alanine specificity, the phosphopantetheine requirement and the domain carrying
      the activity, and states plainly that no downstream role is established rather than
      inventing one. Its GO grounding (GO:0140657 ATP-dependent activity, GO:0016874 ligase
      activity) is correct but two levels too general and was not imported. Notably it says
      nothing about fatty acids, which is consistent with removing the fatty-acid ISS here,
      though as with A1BG earlier in this campaign the provider gives no positive signal that a
      bad annotation exists - its silence only corroborates after the fact.
