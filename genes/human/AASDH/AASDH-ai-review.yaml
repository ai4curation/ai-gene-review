proposed_new_terms:
- proposed_name: beta-alanine--[carrier protein] ligase activity
  proposed_definition: >-
    Catalysis of the ATP-dependent activation of beta-alanine and its transfer to the
    phosphopantetheine prosthetic group of a carrier protein or carrier domain, forming a
    beta-alanyl thioester with release of AMP and diphosphate.
  justification: >-
    The most specific term currently available for AASDH is GO:0016878 acid-thiol ligase
    activity, which is correct but says nothing about either the substrate or the acceptor - the
    two facts that actually distinguish this enzyme. AASDH is the only characterised vertebrate
    beta-alanine-activating enzyme, its specificity is near-absolute among the standard amino
    acids, and the acceptor is its own phosphopantetheine arm rather than free coenzyme A, which
    is precisely what separates it from the acyl-CoA synthetase paralogs it is repeatedly
    confused with - including ACSF3, the source of the erroneous ISS removed in this review. GO
    already has substrate-and-carrier-specific ligase terms for other adenylating enzymes of
    this architecture, so the gap for beta-alanine appears historical. Note the proposed
    definition covers only the demonstrated half-reaction and deliberately names no downstream
    acceptor, since none has been identified.
  proposed_parent:
    id: GO:0016878
    label: acid-thiol ligase activity
  supported_by:
  - reference_id: PMID:24467666
    supporting_text: >-
      We conclude that ACSF4-U26 is a β-alanine-activating
      enzyme
  - reference_id: PMID:24467666
    supporting_text: >-
      The bond was
      not formed in a point mutant lacking the phosphopantetheine attachment site.
suggested_questions:
- question: >-
    What is the physiological acceptor of the activated beta-alanine? This is the central gap.
    The enzyme demonstrably loads beta-alanine onto its phosphopantetheine arm, but the only
    unloading observed in vitro was onto cysteine and other small thiols, which the authors
    judged physiologically irrelevant. Until the true acceptor is identified, no pathway or
    downstream process annotation can be justified, and the hypothesis of a rare
    post-translational or post-transcriptional beta-alanylation remains untested.
- question: >-
    What does the C-terminal PQQDH-related domain do? Its deletion does not abolish beta-alanine
    transfer onto thiols, so the adenylation domain carries that activity, but the domain is
    conserved and its function is uncharacterised. It is a plausible candidate for acceptor
    recognition, which would make it the route to answering the question above.
- question: >-
    Should UniProt's "Fatty acid metabolism" and "Lipid metabolism" keywords for AASDH be
    withdrawn? They appear to derive from the same paralog-based assumption as the GO ISS
    removed in this review, and they conflict with UniProt's own FUNCTION line describing
    beta-alanine activation.
- question: >-
    Does AASDH have a role in carnosine or pantothenate biology? Beta-alanine in vertebrates is
    principally consumed by carnosine synthesis and is a precursor of coenzyme A via
    pantothenate. Neither connection has been tested for AASDH, but they are the obvious places
    a beta-alanine-activating enzyme might act.
suggested_experiments:
- hypothesis: >-
    The activated beta-alanine is transferred to a specific macromolecular acceptor rather than
    to free thiols.
  description: >-
    Incubate loaded recombinant AASDH with cell lysate fractions and identify beta-alanylated
    products by mass spectrometry using isotopically labelled beta-alanine, separating protein,
    RNA and small-molecule acceptor fractions to test the post-translational versus
    post-transcriptional hypotheses directly.
  experiment_type: biochemistry and mass spectrometry
- hypothesis: >-
    The C-terminal PQQDH-related domain selects the physiological acceptor.
  description: >-
    Compare full-length AASDH with a PQQDH-domain deletion for acceptor usage in the assay
    above, and use the isolated domain as bait in pull-downs to identify what it binds. A domain
    that is dispensable for thiol transfer but required for a specific acceptor would identify
    both the domain's role and the acceptor.
  experiment_type: structure-function
- hypothesis: >-
    Loss of AASDH perturbs beta-alanine-dependent metabolism.
  description: >-
    Knock out AASDH in a human cell line and profile beta-alanine, carnosine, pantothenate and
    coenzyme A pools by targeted metabolomics, with isotope tracing from labelled beta-alanine
    to establish whether AASDH flux is quantitatively significant in any of these routes.
  experiment_type: metabolomics
