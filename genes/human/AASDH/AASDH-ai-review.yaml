existing_annotations:
- term:
    id: GO:0006631
    label: fatty acid metabolic process
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: involved_in
  review:
    summary: >-
      This is the only annotation AASDH has, and it describes a paralog's substrate rather than
      its own. The WITH/FROM field cites UniProtKB:Q4G176, which is ACSF3 - a human paralog, not
      an ortholog. ACSF3 is a genuine fatty-acid enzyme: malonyl-CoA synthetase, which catalyses
      the initial reaction of intramitochondrial fatty acid synthesis by activating malonate and
      methylmalonate. Fatty acid metabolic process is correct for ACSF3.

      AASDH is a different enzyme. Direct biochemistry on the recombinant protein shows it is a
      beta-alanine-activating enzyme, with near-absolute specificity for beta-alanine among the
      standard amino acids and a KM of about 5 micromolar, forming a covalent thioester through
      its phosphopantetheine group. Beta-alanine is a beta-amino acid, not a fatty acid, and no
      fatty-acid substrate has ever been reported for AASDH. What the two proteins share is the
      ATP-dependent AMP-binding adenylation fold and a family naming convention ("acyl-CoA
      synthetase family member 4" versus "member 3"), which is exactly the kind of resemblance
      that produces a wrong paralog transfer.

      Note that the same assumption has propagated into UniProt's keyword set, which lists
      "Fatty acid metabolism" and "Lipid metabolism" for AASDH even though UniProt's own
      FUNCTION line describes beta-alanine activation. That is worth correcting upstream too.
    action: REMOVE
    reason: >-
      A sequence-similarity inference from a paralog, contradicted by direct enzymology on the
      gene itself. This is a demonstrably wrong ISS argued on biological grounds, not the
      second-guessing of an experimental annotation.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - WRONG_ORTHOLOG_OR_PARALOG
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: UniProtKB:Q4G176
        comment: >-
          ACSF3, a human paralog rather than an ortholog. It is a genuine malonyl-CoA synthetase
          acting in intramitochondrial fatty acid synthesis, so the term is right for the source
          and wrong for the target; the two share only the adenylating-enzyme fold and an ACSF
          family label.
    supported_by:
    - reference_id: PMID:24467666
      supporting_text: >-
        We conclude that ACSF4-U26 is a β-alanine-activating
        enzyme
    - reference_id: PMID:24467666
      supporting_text: >-
        Competition experiments with various amino acids indicated that the reaction was
        almost specific for β-alanine, and a KM of ~ 5 μm was calculated for this
        reaction.
    - reference_id: file:human/AASDH/AASDH-uniprot.txt
      supporting_text: "CC   -!- FUNCTION: Covalently binds beta-alanine in an ATP-dependent manner to"
- term:
    id: GO:0016878
    label: acid-thiol ligase activity
  evidence_type: ISS
  supporting_entities:
  - UniProtKB:Q80WC9
  original_reference_id: PMID:24467666
  qualifier: enables
  review:
    summary: >-
      Proposed new annotation, and the core molecular function. Removing the incorrect
      fatty-acid ISS leaves AASDH with no annotations at all, yet its chemistry is directly
      demonstrated: in the presence of ATP, purified recombinant enzyme progressively formed a
      covalent bond with radiolabelled beta-alanine, and the bond was abolished in a point
      mutant lacking the phosphopantetheine attachment site. That is ATP-dependent formation of
      a thioester bond between a carboxylic acid and a thiol, which is what acid-thiol ligase
      activity denotes. The affinage grounding proposed GO:0016874 ligase activity and
      GO:0140657 ATP-dependent activity, both correct but two levels too general; GO:0016878 is
      the specific descendant the evidence supports. The assay is on the MOUSE protein
      ("purified mouse recombinant ACSF4-U26"), and UniProt annotates the human FUNCTION line
      as ECO:0000250|UniProtKB:Q80WC9, so the human annotation is an ortholog transfer.
    action: NEW
    reason: >-
      Supplies the molecular function the gene entirely lacks, at the level of specificity the
      enzymology supports. Evidence code is ISS with UniProtKB:Q80WC9 (mouse Acsf4) as the
      supporting entity, not IDA: the experiments are on the mouse protein. This is deliberate
      given what this review argues - it REMOVES an ISS for naming the wrong source (the
      paralog ACSF3/Q4G176), so asserting a direct human assay for evidence that is itself an
      ortholog transfer would apply the standard in only one direction. A genuine ortholog
      transfer with the correct source is exactly the contrast case. Further support: UniProt
      assigns EC=6.2.1.-, and 6.2.1 is the acid-thiol ligase subclass this term denotes.
    supported_by:
    - reference_id: PMID:24467666
      supporting_text: >-
        In the presence of ATP, purified mouse recombinant ACSF4-U26
        progressively formed a covalent bond with radiolabelled β-alanine.
    - reference_id: PMID:24467666
      supporting_text: >-
        The bond was
        not formed in a point mutant lacking the phosphopantetheine attachment site.
    - reference_id: file:human/AASDH/AASDH-uniprot.txt
      supporting_text: "DE            EC=6.2.1.-;"
