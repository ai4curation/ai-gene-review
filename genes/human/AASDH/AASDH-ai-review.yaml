core_functions:
- description: >-
    ATP-dependent activation of beta-alanine onto a phosphopantetheine carrier arm. AASDH
    adenylates beta-alanine and transfers it to the phosphopantetheine prosthetic group of its
    own carrier domain, forming a covalent acyl-enzyme thioester; the reaction requires the
    phosphopantetheine attachment site and is nearly specific for beta-alanine among the
    standard amino acids. The architecture - adenylation domain plus carrier domain - is that of
    a minimal non-ribosomal peptide synthetase module, which distinguishes AASDH from the
    acyl-CoA synthetase paralogs it shares a family name with. The physiological acceptor of the
    activated beta-alanine is unknown, so no downstream function is asserted.
