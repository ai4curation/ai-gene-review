id: Q4L235
gene_symbol: AASDH
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  AASDH (ACSF4-U26) is a beta-alanine-activating enzyme. It belongs to the
  ATP-dependent AMP-binding (adenylating) enzyme family and has the domain
  architecture of a minimal non-ribosomal peptide synthetase module: an adenylation
  domain, a carrier domain bearing a phosphopantetheine prosthetic group, and a
  C-terminal PQQDH-related domain of unknown role. The enzyme adenylates
  beta-alanine at the expense of ATP and then transfers it onto its own
  phosphopantetheine arm to form a covalent acyl-enzyme thioester; a point mutant
  lacking the phosphopantetheine attachment site cannot form that bond. Specificity
  is near-absolute for beta-alanine among the standard amino acids, with a KM of
  about 5 micromolar. That enzymology was established on the mouse orthologue; UniProt
  annotates the human FUNCTION line by similarity from mouse Acsf4 (Q80WC9), and no
  assay of the human protein has been reported. What happens next is unknown: the physiological acceptor of
  the activated beta-alanine has never been identified, transfer onto small thiols
  can be demonstrated in vitro but was judged physiologically irrelevant by the
  authors who observed it, and no downstream pathway or in vivo role has been
  established. AASDH is ubiquitously expressed in adult tissues. It has been
  suggested, but not shown, that the enzyme performs an infrequent
  post-translational or post-transcriptional beta-alanylation.
