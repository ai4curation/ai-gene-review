id: Q8TD57
gene_symbol: DNAH3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  DNAH3 (dynein axonemal heavy chain 3) is a 4116-residue heavy chain of a single-headed inner
  dynein arm (IDA). It has an N-terminal stem that anchors it in the axoneme and binds light
  intermediate chain, and a C-terminal motor head of six AAA+ modules with a coiled-coil stalk
  and microtubule-binding domain that generates minus-end-directed force between doublet microtubules.
  Cryo-EM of human respiratory axonemes identifies DNAH3 as the heavy chain of IDAc. DNAH3
  is expressed mainly in testis and trachea; in the testis it is cytoplasmic in spermatogonia
  and spermatocytes and moves into the flagellum of developing spermatids. In sperm, DNAH3
  forms a complex with the IDA light intermediate chain DNALI1 through its stem domain, and
  it is needed for the IDA heavy chains DNAH1, DNAH6 and DNAH10 and for DNALI1 to accumulate
  in the flagellum, while outer arm proteins are unaffected. Biallelic DNAH3 variants cause
  male infertility with asthenoteratozoospermia or MMAF, with IDA loss and, in some reports,
  central-pair, mitochondrial sheath and fibrous sheath defects. Dnah3 knockout male mice
  are infertile with severely reduced sperm motility and IDA loss; one knockout line was reported
  to have morphologically normal sperm with disturbed energy metabolism instead. Respiratory
  and ependymal cilia of Dnah3 knockout mice appear grossly normal and patients have not been
  reported with primary ciliary dyskinesia. ICSI overcomes the infertility in patients and
  mice.
