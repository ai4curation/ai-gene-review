      including DNAH1, DNAH6 and DNALI1.
suggested_questions:
- question: >-
    Why do Dnah3 knockout lines differ in sperm morphology? Two studies report MMAF-like flagellar
    defects and IDA loss, while another reports normal sperm morphology with disturbed energy
    metabolism (PMID:39774634). Do allele position, genetic background or residual truncated
    protein explain this?
- question: >-
    DNAH3 is the IDAc heavy chain in human respiratory axonemes, yet Dnah3 knockout airway
    cilia look normal and patients lack PCD. Is IDAc dispensable for airway ciliary beating,
    or is its loss compensated?
suggested_experiments:
- description: >-
    High-speed video and cryo-ET of airway cilia from Dnah3 knockout mice to test for subtle
    waveform changes and to confirm IDAc loss in situ.
  experiment_type: ciliary beat analysis and cryo-electron tomography
