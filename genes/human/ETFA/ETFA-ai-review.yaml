    label: mitochondrial matrix
  supported_by:
  - reference_id: PMID:9334218
    supporting_text: In this disease, electron transfer from nine primary flavoprotein dehydrogenases
      to the main respiratory chain is impaired.
  - reference_id: PMID:10423253
    supporting_text: Electron-transfer flavoprotein (ETF) serves as an intermediate electron carrier between
      primary flavoprotein dehydrogenases and terminal respiratory chains in mitochondria and prokaryotic
      cells.
  - reference_id: PMID:8962055
    supporting_text: They function as electron shuttles between primary flavoprotein dehydrogenases involved
      in mitochondrial fatty acid and amino acid catabolism and the membrane-bound electron transfer flavoprotein
      ubiquinone oxidoreductase.
  - reference_id: PMID:25416781
    supporting_text: ETF acts as a mobile electron carrier that shuttles electrons between several FAD-containing
      dehydrogenases present in the mitochondrial matrix and the membrane-bound ETF:quinone oxidoreductase
  - reference_id: Reactome:R-HSA-169260
