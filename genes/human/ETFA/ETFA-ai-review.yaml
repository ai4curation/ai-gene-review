gene_symbol: ETFA
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ETFA is the alpha subunit of electron-transfer flavoprotein (ETF), a soluble mitochondrial-matrix
  heterodimer with ETFB. ETFA coordinates much of the complex’s single FAD cofactor, while both subunits
  shape the electron carrier. ETF accepts electrons from mitochondrial dehydrogenases, including MCAD
  in fatty-acid oxidation and GCDH in amino-acid catabolism, and transfers them to the inner-membrane
  enzyme ETFDH. ETFDH then reduces ubiquinone, connecting these pathways to respiratory electron transport.
  Human heterodimer experiments directly demonstrate MCAD- and GCDH-coupled electron transfer, and the
  human structure resolves ETFA–FAD contacts. Pathogenic ETFA variants cause multiple acyl-CoA dehydrogenase
  deficiency. The canonical 333-residue precursor is processed for mitochondrial import; equivalent localization
  and activity of the 284-residue alternative product are not established.
