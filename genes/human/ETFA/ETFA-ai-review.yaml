core_functions:
- description: ETFA contributes to electron transfer by the soluble mitochondrial ETFA–ETFB heterodimer,
    whose FAD accepts reducing equivalents from matrix dehydrogenases and passes them to ETFDH. ETFA supplies
    much of the FAD-binding site within this composite carrier; ETFDH separately catalyzes transfer to
    ubiquinone at the inner membrane. Human heterodimer assays establish electron transfer to an artificial
    acceptor, not isolated-alpha activity or complete respiratory-chain flux.
  directly_involved_in:
  - id: GO:0022904
    label: respiratory electron transport chain
  in_complex:
    id: GO:0045251
    label: electron transfer flavoprotein complex
  locations:
