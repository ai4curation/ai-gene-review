suggested_questions:
- question: How is electron flux through ETF regulated in vivo, including by ETFRF1/LYRM5-dependent deflavination
    or MBTPS1-mediated stabilization, and does this change substrate preference or mainly the amount of
    active heterodimer?
- question: Does the 284-residue ETFA alternative product enter the mitochondrial matrix, assemble with
    ETFB and retain FAD binding and dehydrogenase-coupled electron transfer? The mature Δ19-alpha construct
    used in the human assay does not establish equivalence to this internally deleted product.
suggested_experiments:
- description: Quantitative flux analysis (e.g. stable-isotope tracing of fatty-acid and branched-chain
    amino-acid oxidation) in ETFA-null versus rescued cells to measure the contribution of ETF to each
    catabolic pathway and to respiratory-chain electron input.
