id: P13804
gene_symbol: ETFA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'ETFA is the alpha subunit of electron-transfer flavoprotein (ETF), a soluble mitochondrial-matrix
  heterodimer with ETFB. Each heterodimer contains one FAD and one AMP: ETFA supplies most of the FAD-binding
  site, while AMP is embedded in ETFB. ETF accepts electrons from fatty-acid acyl-CoA dehydrogenases,
  including MCAD and very-long-chain acyl-CoA dehydrogenase, and from dehydrogenases involved in amino-acid
  and choline catabolism, including GCDH, isovaleryl-CoA dehydrogenase, dimethylglycine dehydrogenase
  and sarcosine dehydrogenase. It passes these electrons to the inner-membrane enzyme ETFDH, which reduces
  ubiquinone. This route couples fatty-acid, amino-acid and choline oxidation to respiratory electron
  transport alongside electron entry through complexes I and II. The canonical 333-residue precursor is
  imported into mitochondria and processed to a 314-residue mature chain. Biallelic pathogenic ETFA variants
  cause multiple acyl-CoA dehydrogenase deficiency, also called glutaric aciduria type II.'
