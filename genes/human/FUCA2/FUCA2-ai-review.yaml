id: Q9BTY2
gene_symbol: FUCA2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  FUCA2 encodes plasma alpha-L-fucosidase, a secreted glycoside hydrolase
  family 29 exoglycosidase that hydrolyses terminal alpha-L-fucose from
  fucosylated glycans. Human FUCA2 is catalytically active on
  alpha-L-fucoside substrates and has been purified from the medium of
  Helicobacter pylori-infected gastric epithelial cells, where it releases
  fucose from host-cell glycans and modulates H. pylori adhesion and Lewis x
  production. In contrast to the paralogous lysosomal tissue alpha-L-fucosidase
  FUCA1, FUCA2 is primarily an extracellular or secretory-pathway enzyme.
