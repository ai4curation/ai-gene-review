core_functions:
- description: >-
    Secreted FUCA2 hydrolyses terminal alpha-L-fucose from extracellular
    fucosylated glycans; in gastric epithelial cocultures this activity releases
    fucose from host glycans for uptake by H. pylori and promotes bacterial
    Lewis x production.
  molecular_function:
    id: GO:0004560
    label: alpha-L-fucosidase activity
  directly_involved_in:
  - id: GO:0006004
    label: fucose metabolic process
  - id: GO:0016139
    label: glycoside catabolic process
  locations:
  - id: GO:0005576
    label: extracellular region
  supported_by:
  - reference_id: PMID:19666478
    supporting_text: >-
      The predominant 55-kDa band ( Fig. 2 D , arrow) was identified as FUCA2
      by in-gel tryptic digestion and LC-MS/MS
  - reference_id: PMID:19666478
    supporting_text: Additionally, we prepared and characterized human FUCA1 and FUCA2.
suggested_questions:
- question: >-
    What are the main endogenous extracellular FUCA2 substrates outside the
    H. pylori coculture system?
- question: >-
    Does FUCA2 provide a physiologically important route for releasing free
    fucose for cytosolic degradation or GDP-fucose salvage in any human tissue?
- question: >-
    Is the Reactome azurophil-granule FUCA2 location supported by endogenous
    neutrophil proteomics, and does granule release measurably contribute to
    extracellular fucosidase activity?
suggested_experiments:
- description: >-
    Profile extracellular fucosylated glycans and free fucose in FUCA2-null
    gastric epithelial cells before and after H. pylori challenge.
  experiment_type: glycomics
  hypothesis: >-
    FUCA2 is the infection-induced extracellular enzyme that releases terminal
    fucose from host glycans in H. pylori cocultures.
