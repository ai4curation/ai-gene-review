- id: PMID:29459785
  title: GlcNAc-1-P-transferase-tunicamycin complex structure reveals basis for inhibition of N-glycosylation.
  findings:
  - statement: The structure was interpreted as a Cys106-linked disulfide dimer.
    finding_review:
      finding_status: DISPUTED
      superseded_by:
      - PMID:30388443
      review_notes: This is a limited disagreement about the intersubunit bond. The later map and intact-mass
        experiments favor a predominantly noncovalent dimer in the tested preparations; they do not establish
        that a disulfide can never form. Dimer existence and catalytic activity remain supported.
      supported_by:
      - reference_id: PMID:30388443
        supporting_text: DPAGT1 exists predominantly as a non-covalent dimer in solution
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Genuine original Methods/Results establish purified full-length 408-aa human GPT activity
      after expression in Sf9 cells, radioactive Dol-P transfer and TLC, and tunicamycin-bound structure.
      The Cys106 disulfide interpretation is assessed separately as a disputed finding in light of PMID:30388443;
      this does not invalidate the catalytic data or dimer evidence.
- id: PMID:30388443
  title: Structures of DPAGT1 Explain Glycosylation Disease Mechanisms and Advance TB Antibiotic Design.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Genuine original Methods/Results establish full-length human enzyme chemistry with direct
      product/TLC and mass spectrometry, structural mechanism and variant measurements. Predominantly
      noncovalent dimers contrast with the earlier disulfide interpretation. Val264Gly/Gly160Ser can increase
      purified activity while causing abnormal TE671 exon-trap splicing; native patient muscle was unavailable.
      A resolved model spanning 7–400 and the extra N-terminal residue after TEV cleavage are not natural
      isoform definitions.
