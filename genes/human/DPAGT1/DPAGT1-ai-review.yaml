id: Q9H3H5
gene_symbol: DPAGT1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: DPAGT1 is a ten-pass endoplasmic-reticulum membrane phosphotransferase that initiates dolichol-linked
  oligosaccharide assembly for protein N-linked glycosylation. On the cytoplasmic face of the ER membrane,
  it transfers GlcNAc-1-phosphate from UDP-GlcNAc to dolichyl phosphate, producing GlcNAc-PP-dolichol
  and UMP. Other enzymes extend this lipid-linked precursor and transfer the completed glycan to nascent
  proteins. Human DPAGT1 forms dimers, requires magnesium for catalysis and is inhibited by tunicamycin.
  Biallelic pathogenic variants cause congenital disorders of glycosylation or congenital myasthenic syndromes;
  defects can involve catalytic activity, protein abundance or RNA splicing. Changes in DPAGT1 expression
  can alter E-cadherin glycosylation and epithelial junctions. Alternative transcripts encode proteins
  with different N termini, whose functional properties are not uniformly established.
alternative_products:
- name: '1'
  id: Q9H3H5-1
  description: The canonical 408-residue, ten-pass membrane protein. Full-length human constructs have
    direct GlcNAc-1-phosphate transfer activity in purified assays. Resolved structural boundaries and
    engineered variants are not distinct natural isoforms.
- name: '2'
  id: Q9H3H5-2
  sequence_note: VSP_001803
  description: This 400-residue product lacks canonical residues 1–8 and retains the annotated membrane
    spans. The historical functional human lung-fibroblast clone CAB04787.1 corresponds to these boundaries,
    but carries Leu25 instead of the current Arg at canonical position 33. Yeast complementation and membrane
    biochemistry support the historical clone; its sequence is not an exact match to the current product.
- name: '3'
  id: Q9H3H5-3
  sequence_note: VSP_008886
  description: This 301-residue product lacks canonical residues 1–107, removing the first two transmembrane
    spans and part of the third as well as N-terminal substrate-binding positions. Its biochemical activity
    and topology have not been established by the full-length assays; the deletion alone does not demonstrate
    inactivity.
