core_functions:
- description: DPAGT1 transfers GlcNAc-1-phosphate from UDP-GlcNAc to dolichyl phosphate, forming GlcNAc-PP-dolichol
    and UMP. This first glycosyl-unit transfer initiates dolichol-linked oligosaccharide assembly on the
    cytoplasmic face of the ER membrane. The full-length human protein is a ten-pass membrane enzyme whose
    purified activity is directly demonstrated; subsequent glycan extension and transfer to protein are
    performed by other enzymes.
  molecular_function:
    id: GO:0003975
    label: UDP-N-acetylglucosamine-dolichyl-phosphate N-acetylglucosaminephosphotransferase activity
  directly_involved_in:
  - id: GO:0006488
    label: dolichol-linked oligosaccharide biosynthetic process
  locations:
  - id: GO:0005789
    label: endoplasmic reticulum membrane
  supported_by:
  - reference_id: PMID:29459785
    supporting_text: catalyzes the first and committed step of N-linked glycosylation on the cytosolic
      face of endoplasmic reticulum (ER) membrane
  - reference_id: PMID:30388443
    supporting_text: It catalyzes the transfer of an N-acetyl-D-glucosamine-1-phosphoryl unit (GlcNAc-1-P)
      from UDP-N-acetyl glucosamine (UDP-GlcNAc) onto dolichyl phosphate (Dol-P)
