- term:
    id: GO:0004222
    label: metalloendopeptidase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - AGI_LocusCode:AT5G51740
  - MGI:MGI:1914263
  - PANTHER:PTN000506393
  - RGD:1304821
  - SGD:S000001795
  - UniProtKB:P66948
  - UniProtKB:Q96E52
  review:
    summary: OMA1 is an ATP-independent M48-family zinc metalloendopeptidase that cleaves OPA1, DELE1
      and other inner-membrane substrates in human cells.
    action: ACCEPT
    reason: Accepted as the core activity. Knockdown of OMA1 in mammalian cells abolishes stress-induced
      OPA1 cleavage [PMID:20038677], OMA1 knockdown or knockout blocks OPA1 cleavage during Bax/Bak-dependent
      apoptosis [PMID:25275009], and two independent genetic screens showed that OMA1 is required for
      stress-induced DELE1 cleavage [PMID:32132706, PMID:32132707]. The protein carries the M48 HExxH
      zinc-binding motif with the annotated catalytic Glu328. The IBA places this activity at a deep PANTHER
      node (PTN000506393) shared with yeast, plant and bacterial M48 members; human OMA1 sits inside that
      clade (PTHR22726:SF1), so the inherited activity is not in doubt. The endopeptidase term is as specific
      as GO allows (EC 3.4.24.-, no substrate-specific child term).
    supported_by:
    - reference_id: PMID:20038677
      supporting_text: we show that this inducible cleavage is mediated by a zinc metalloprotease called
        OMA1
    - reference_id: PMID:32132707
      supporting_text: OMA1 knockdown dramatically reduced DELE1S levels and blocked ATF4 induction (Fig.
        3f, Extended Data Fig. 2f) suggesting that OMA1 cleaves DELE1, which is necessary for ATF4 induction.
    - reference_id: file:human/OMA1/OMA1-uniprot.txt
      supporting_text: 'CC   -!- SIMILARITY: Belongs to the peptidase M48 family.'
