core_functions:
- description: OMA1 is a mitochondrial membrane zinc metalloprotease involved in stress-responsive protein
    processing and quality control. Its conserved catalytic architecture supports cleavage of mitochondrial
    substrates; mammalian OMA1 controls OPA1 processing and signals mitochondrial stress through DELE1.
