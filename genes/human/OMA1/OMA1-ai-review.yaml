- term:
    id: GO:0002024
    label: diet induced thermogenesis
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q9D8H7
  - ensembl:ENSMUSP00000045269
  review:
    summary: Thermogenic and energy-balance defects are whole-animal phenotypes of Oma1-knockout mice,
      secondary to altered OPA1 processing.
    action: MARK_AS_OVER_ANNOTATED
    reason: These rows are transferred from mouse Oma1, where knockout mice gain adipose mass, have decreased
      energy expenditure and impaired thermogenesis [PMID:22433842]. The same paper attributes the phenotype
      to loss of OMA1-dependent OPA1 inactivation. OMA1 does not perform any step of thermogenesis or
      energy homeostasis; it processes an inner-membrane GTPase, and the organismal outcome is a downstream
      consequence of disturbed mitochondrial dynamics. Under the participation test (CLAUDE.md "Do not
      add what curators deliberately declined to add"), necessity evidence of this kind does not establish
      involvement. The claim is not false for the mouse knockout, so these rows are marked as over-annotation
      rather than removed.
    supported_by:
    - reference_id: PMID:22433842
      supporting_text: Oma1-mutant mice exhibit an increase in body weight due to increased adipose mass,
        hepatic steatosis, decreased energy expenditure and impaired thermogenenesis
    - reference_id: PMID:22433842
      supporting_text: we provide in vivo evidence that the ATP-independent metalloprotease OMA1 plays
        an essential role in the proteolytic inactivation of the dynamin-related GTPase OPA1 (optic atrophy
        1)
