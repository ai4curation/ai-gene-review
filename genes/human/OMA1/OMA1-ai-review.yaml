  review:
    summary: Autocatalytic cleavage converts OMA1 to its stress-active short form.
    action: KEEP_AS_NON_CORE
    reason: UniProt (by similarity to mouse Oma1, same PANTHER subfamily SF1) states that OMA1 protease
      activity is activated upon autocatalytic cleavage after mitochondrial depolarization, and a human-cell
      study describes pre-activating and auto-proteolytic cleavage of OMA1 [PMID:29545505]. Because OMA1
