- term:
    id: GO:1990627
    label: mitochondrial inner membrane fusion
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q9D8H7
  - ensembl:ENSMUSP00000045269
  review:
    summary: OMA1 does not perform inner-membrane fusion; it regulates fusion by processing OPA1, and
      the documented effect of stress-activated OMA1 is inhibition of fusion.
    action: MARK_AS_OVER_ANNOTATED
    reason: The membrane-fusion machinery is OPA1 (with cardiolipin). OMA1 generates short OPA1, and reconstitution
      shows that stoichiometric short OPA1 cooperates with long OPA1 in pore opening while excess short
      OPA1 inhibits fusion [PMID:31922487]. That study used purified OPA1 forms without OMA1, so it does
      not show that OMA1 participates in fusion. In cells, OMA1 knockdown preserves fusion competence
      [PMID:20038677], which is the basis for the accepted negative regulation of mitochondrial fusion
      (GO:0010637). Any constitutive contribution of OMA1 to the S-OPA1 pool would at most be regulation
      of fusion. Participation in fusion is therefore an over-annotation.
    supported_by:
    - reference_id: PMID:31922487
      supporting_text: stoichiometric levels of the processed, short form of Opa1 (s-Opa1) work together
        with l-Opa1 to mediate efficient and fast membrane pore opening
    - reference_id: PMID:20038677
      supporting_text: OMA1 small interfering RNA inhibits inducible cleavage, helps retain fusion competence,
        and slows the onset of apoptosis, showing that OMA1 controls OPA1 cleavage and function
