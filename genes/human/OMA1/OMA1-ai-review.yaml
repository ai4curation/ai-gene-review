  review:
    summary: Mitochondrial localization is correct but the evidence supports the more specific inner-membrane
      location.
    action: MODIFY
    reason: 'OMA1 is an integral protein of the mitochondrial inner membrane: in vitro imported OMA1 resists
      carbonate extraction [PMID:20038677] and its substrates OPA1 and DELE1 are inner-membrane proteins.
      "Mitochondrion" is true but less specific than the evidence allows; replace with mitochondrial inner
      membrane (GO:0005743), which this gene already carries by IDA, IBA and TAS.'
    proposed_replacement_terms: &id001
    - id: GO:0005743
      label: mitochondrial inner membrane
    supported_by:
    - reference_id: PMID:34800366
      supporting_text: We classified >8,000 proteins in mitochondrial preparations of human cells and
        defined a mitochondrial high-confidence proteome of >1,100 proteins (MitoCoP).
