  review:
    summary: OMA1 is an integral inner-membrane protease; this is the compartment in which it acts.
    action: ACCEPT
    reason: Accepted. Mammalian OMA1 is an integral membrane protein of mitochondria [PMID:20038677],
      and its substrates (OPA1, DELE1, UQCC3, YME1L1) are inner-membrane proteins. The yeast ortholog
      Oma1 is likewise an integral inner-membrane protease [PMID:12963738], and the IBA node (PTN000506394)
      covering the eukaryotic OMA1 clade, including the human protein, is consistent with this being an
      ancestral location.
    supported_by:
    - reference_id: PMID:12963738
      supporting_text: Both peptidases are integral parts of the inner membrane and mediate the proteolytic
        breakdown of a misfolded derivative of the polytopic inner membrane protein Oxa1.
    - reference_id: PMID:20038677
      supporting_text: both 40- and 60-kD OMA1 proteins were pelleted, showing that these are integral
        membrane proteins
