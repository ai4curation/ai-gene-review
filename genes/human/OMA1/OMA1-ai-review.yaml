id: Q96E52
gene_symbol: OMA1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: OMA1 is an ATP-independent zinc metalloendopeptidase of the M48 family that is anchored in
  the mitochondrial inner membrane by a single transmembrane helix, with its HExxH catalytic domain facing
  the intermembrane space. It is largely latent in healthy mitochondria and is activated by membrane depolarization,
  ATP depletion, oxidative and proteotoxic stress, and Bax/Bak activation during apoptosis; activation
  involves self-cleavage, which also drives its turnover. Active OMA1 cleaves the long, fusion-competent
  forms of the dynamin-like GTPase OPA1 at the S1 site, which inhibits inner-membrane fusion, fragments
  the mitochondrial network and remodels cristae. It also cleaves DELE1; the released DELE1 fragment travels
  to the cytosol and activates the eIF2alpha kinase HRI (EIF2AK1), triggering the integrated stress response.
  Other reported substrates include UQCC3, YME1L1 and PINK1. The yeast ortholog Oma1 degrades misfolded
  inner-membrane proteins, indicating an ancestral role in inner-membrane protein quality control.
