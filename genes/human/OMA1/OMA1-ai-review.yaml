suggested_questions:
- question: How does OMA1 sense distinct stresses (depolarization, ROS, ATP loss, proteotoxicity) at the
    molecular level, and is the stress-sensor region the common input?
- question: Does human OMA1 retain the ancestral role of the yeast enzyme in degrading misfolded inner-membrane
    proteins, or is its substrate set limited to regulatory targets such as OPA1 and DELE1?
- question: Does constitutive OMA1 activity contribute to the short-OPA1 pool needed for efficient fusion
    under basal conditions, or is that pool generated only by YME1L1?
suggested_experiments:
- description: Reconstitute purified human OMA1 (wild type and E328Q) in proteoliposomes with OPA1 and
    DELE1 to measure direct cleavage, cleavage-site specificity and lipid (cardiolipin) dependence.
- description: Proteomic substrate trapping with catalytically inactive OMA1 in OMA1-null human cells
    under depolarization, to define the full stress-dependent substrate repertoire and test for misfolded-protein
    clearance.
