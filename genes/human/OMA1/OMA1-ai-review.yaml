- term:
    id: GO:0006515
    label: protein quality control
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000506394
  - SGD:S000001795
  - UniProtKB:Q96E52
  review:
    summary: Degradation of misfolded inner-membrane proteins is established for yeast Oma1 and inherited
      by the eukaryotic OMA1 clade; in human cells the best-studied OMA1 cleavages are regulatory rather
      than clearance of misfolded proteins.
    action: KEEP_AS_NON_CORE
    reason: GO:0006515 is the breakdown of misfolded or attenuated proteins. Yeast Oma1 degrades a misfolded
      Oxa1 derivative in the inner membrane [PMID:12963738], and the PAINT node PTN000506394, which spans
      yeast and human OMA1, carries this term; there is no evidence that the human protein has lost the
      activity, so the IBA is retained. The human IMP rests on Head et al., whose own framing is organelle-level
      quality control (inactivating OPA1 so damaged fragments cannot fuse again) rather than clearance
      of a misfolded substrate [PMID:20038677]. OMA1 also degrades YME1L1 and PINK1 under stress. The
      term holds but is peripheral to the regulatory OPA1/DELE1 processing that defines the human protein,
      so both rows are kept as non-core.
    supported_by:
    - reference_id: PMID:12963738
      supporting_text: Both peptidases are integral parts of the inner membrane and mediate the proteolytic
        breakdown of a misfolded derivative of the polytopic inner membrane protein Oxa1.
    - reference_id: PMID:12963738
      supporting_text: These results identify Oma1 as a novel component of the quality control system
        in the inner membrane of mitochondria.
