- term:
    id: GO:0140467
    label: integrated stress response signaling
  evidence_type: IDA
  original_reference_id: PMID:32132706
  qualifier: involved_in
  review:
    summary: OMA1 is the stress-activated protease that cleaves DELE1, the first step of the mitochondrial
      OMA1-DELE1-HRI integrated stress response relay.
    action: ACCEPT
    reason: Core process. Two independent genome-wide screens placed OMA1 upstream of DELE1 and HRI; OMA1
      cleaves DELE1, whose short form reaches the cytosol and activates HRI [PMID:32132706, PMID:32132707].
      OMA1 carries out a signalling step (signal-generating proteolysis), so it participates in the process
      rather than being merely required for it.
    supported_by:
    - reference_id: PMID:32132706
      supporting_text: Mechanistically, stress-induced activation of OMA1 causes DELE1 to be cleaved into
        a short form that accumulates in the cytosol, where it binds to and activates HRI via its C-terminal
        portion.
    - reference_id: PMID:32132706
      supporting_text: We show that the mitochondrial protease OMA1 and the poorly characterized protein
        DELE1, together with HRI, constitute the missing pathway that is triggered by mitochondrial stress.
