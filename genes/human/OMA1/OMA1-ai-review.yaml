- term:
    id: GO:0005758
    label: mitochondrial intermembrane space
  evidence_type: IDA
  original_reference_id: PMID:32132706
  qualifier: is_active_in
  review:
    summary: The catalytic domain of OMA1 faces the intermembrane space, where its OPA1 and DELE1 cleavage
      sites are accessible, but the protein itself is anchored in the inner membrane.
    action: KEEP_AS_NON_CORE
    reason: Kept as non-core. UniProt models the region C-terminal to the single transmembrane helix (including
      the HExxH catalytic motif) as intermembrane-space-facing, by similarity to mouse Oma1, and Reactome
      describes OMA1 at the inner membrane cleaving the N-terminal region of DELE1. The IDA row therefore
      records where the active site works. Mitochondrial inner membrane (GO:0005743) remains the primary
      location for the protein; this term is compatible with it rather than a replacement. The yeast ortholog
      was reported to expose its proteolytic centre to the matrix [PMID:12963738], so the IMS orientation
      should not be propagated beyond mammals without topology data.
    supported_by:
    - reference_id: file:human/OMA1/OMA1-uniprot.txt
      supporting_text: /note="Mitochondrial intermembrane"
    - reference_id: Reactome:R-HSA-9840408
