- term:
    id: GO:0033108
    label: mitochondrial respiratory chain complex assembly
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q9D8H7
  - ensembl:ENSMUSP00000045269
  review:
    summary: OMA1 has no demonstrated role as a respiratory chain assembly factor; supercomplex instability
      in its absence is an indirect effect.
    action: MARK_AS_OVER_ANNOTATED
    reason: The transferred annotation rests on mouse Oma1 data summarised by UniProt as "Required for
      the stability of the respiratory supercomplexes" (by similarity). Required-for-stability is necessity
      evidence and does not show that OMA1 aggregates or bonds components of respiratory complexes. A
      plausible indirect route is altered OPA1-dependent cristae structure, or turnover of assembly factors
      such as UQCC3, an OMA1 substrate [PMID:25605331]. No direct assembly activity is known, so the term
      is marked as over-annotation rather than removed.
