  - ensembl:ENSMUSP00000045269
  review:
    summary: Stress-activated OMA1 converts fusion-competent long OPA1 to short forms, inhibiting inner-membrane
      fusion.
    action: ACCEPT
    reason: Core process. OMA1 knockdown inhibits inducible OPA1 cleavage and helps retain fusion competence
      [PMID:20038677]; Oma1-null mice lose stress-induced OPA1 inactivation [PMID:22433842]. Reconstitution
      shows that excess short OPA1 inhibits fusion [PMID:31922487]. OMA1 acts on the fusion machinery,
