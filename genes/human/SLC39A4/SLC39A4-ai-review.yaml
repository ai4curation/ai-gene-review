- term:
    id: GO:0015701
    label: bicarbonate transport
  evidence_type: IEA
  original_reference_id: GO_REF:0000108
  qualifier: involved_in
  supporting_entities:
  - GO:0140410
  review:
    summary: Logically inferred from the monoatomic cation bicarbonate symporter activity
      annotation, which is itself an over-propagation to ZIP4. ZIP4 is a H(+)-coupled
      zinc uniporter, not a bicarbonate symporter.
    action: REMOVE
    reason: This bicarbonate-transport annotation is an inter-ontology inference from
      GO:0140410 (monoatomic cation bicarbonate symporter activity), which was propagated
      onto ZIP4 from the bona fide Zn(2+)/HCO3(-) symporters ZIP8 (SLC39A8) and ZIP14
      (SLC39A14). UniProt describes ZIP4's activity as Zn(2+) uniporter activity and
      shows the transport is stimulated by extracellular acidification (H(+)-coupled,
      pH optimum 5), not bicarbonate-coupled. Because the parent symporter activity
      does not hold for ZIP4, the derived bicarbonate-transport process does not either.
    supported_by:
    - reference_id: file:human/SLC39A4/SLC39A4-uniprot.txt
      record_section: ["CC:CATALYTIC ACTIVITY"]
      supporting_text: Reaction=Zn(2+)(in) = Zn(2+)(out)
    - reference_id: file:human/SLC39A4/SLC39A4-uniprot.txt
      record_section: ["CC:ACTIVITY REGULATION"]
      supporting_text: Extracellular acidification stimulated SLC39A4-dependent Zn(2+) uptake
