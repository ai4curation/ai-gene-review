proposed_new_terms: []
suggested_questions:
- question: Given that ZIP4's curated reaction is Zn(2+) uniport and its uptake is
    stimulated by extracellular acidification (ruling out the bicarbonate-coupled symport
    seen for ZIP8/ZIP14), what is the proton coupling and transport stoichiometry - does
    ZIP4 move Zn(2+) by electrodiffusive uniport, H(+)/Zn(2+) symport, or Zn(2+)/H(+)
    antiport? This is the remaining open mechanistic question; the absence of
    bicarbonate-coupled symport is already established.
- question: What are the distinct roles of the M1 and M2 sites of the binuclear metal
    center in transport versus zinc sensing? M1 is essential for transport while M2
    appears auxiliary, and the center is also implicated in zinc sensing.
suggested_experiments:
- description: Reconstitute purified human ZIP4 into proteoliposomes and measure zinc
    flux as a function of transmembrane pH and membrane potential to determine the
    coupling ion and stoichiometry (uniport vs H(+) symport/antiport), resolving the
    mechanistic ambiguity between uniporter and H(+)-coupled descriptions.
- description: Determine cryo-EM or crystallographic structures of human ZIP4 in apo,
    Zn(2+)-bound inward-facing and outward-facing states, combined with residue-resolved
    sensing assays, to map how transport-site zinc binding is relayed to the cytosolic
    LQL sorting motif to trigger endocytosis.
knowledge_gaps:
- gap_statement: The proton coupling and transport stoichiometry of human ZIP4, and
    whether its transport is electrogenic, are not established (its curated reaction is
    Zn(2+) uniport and its uptake is acid-stimulated; bicarbonate-coupled symport, unlike
    ZIP8/ZIP14, is excluded, so the open question is the H(+) relationship, not the
    bicarbonate one).
  gap_kind:
  - BIOLOGY
