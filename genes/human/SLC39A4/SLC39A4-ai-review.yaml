id: Q6P5W5
gene_symbol: SLC39A4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SLC39A4 (ZIP4) is the principal apical plasma membrane zinc importer
  of the mammalian intestinal enterocyte, mediating uptake of dietary Zn(2+) from
  the gut lumen into the cytosol. It is a member of the ZIP (SLC39)/LIV-1 transmembrane
  transporter family, with eight transmembrane helices, a large N-terminal extracellular
  domain and a long intrinsically disordered, histidine-rich cytosolic loop (ICL2/M3M4).
  Transport is zinc-selective, electrodiffusive and H(+)-coupled with a low-micromolar
  Km for Zn(2+); at higher concentrations ZIP4 also binds and transports other transition
  metals (Cu(2+), Cd(2+) and possibly Ni(2+)). A binuclear metal center formed halfway
  through the membrane (sites M1 and M2) constitutes the transport pathway. ZIP4 functions
  as a homodimer and behaves as a transceptor, in which zinc binding at the transport
  site and the cytosolic loop triggers conformational changes that drive zinc-regulated
  endocytosis and, at toxic zinc levels, ubiquitin-dependent degradation, so that cell-surface
  abundance rises in zinc deficiency and falls in zinc excess. Loss-of-function variants
  impair zinc uptake and/or cause ER retention and mistrafficking, producing the autosomal
  recessive disorder acrodermatitis enteropathica, zinc-deficiency type.
