  supported_by:
  - reference_id: file:human/ROS1/ROS1-uniprot.txt
    supporting_text: Upon endogenous stimulation by NELL2, ROS1 activates the intracellular signaling
      pathway and triggers epididymal epithelial differentiation and subsequent sperm maturation
  - reference_id: file:human/ROS1/ROS1-uniprot.txt
    supporting_text: Mediates the phosphorylation of PTPN11, an activator of this pathway.
  - reference_id: PMID:11094073
