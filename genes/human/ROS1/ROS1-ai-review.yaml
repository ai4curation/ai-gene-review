id: P08922
gene_symbol: ROS1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ROS1 is a large single-pass type I transmembrane receptor tyrosine kinase with an extensive
  extracellular region of fibronectin type III repeats and an intracellular kinase domain. It was long
  an orphan receptor; NELL2 is an endogenous ligand, and NELL2-ROS1 signalling drives regionalized differentiation
  of the proximal epididymal epithelium and consequent sperm maturation, which is why Ros1-null male mice
  are infertile. Activated ROS1 autophosphorylates and phosphorylates substrates including PTPN11/SHP-2
  and the guanine nucleotide exchange factor VAV3, engaging PI3K-AKT-mTOR, MAPK/ERK and STAT3 signalling
  to control cell growth, differentiation and survival; phosphotyrosines in its activation loop and tail
  also recruit the phosphatases PTPN6 and PTPN11. ROS1 is expressed in brain and epididymal epithelium,
  and chromosomal rearrangements that fuse its kinase domain to partners such as FIG/GOPC, CD74 or SLC34A2
  produce constitutively active, often cytoplasmic oncoproteins that drive glioblastoma, lung adenocarcinoma
  and other cancers and are targets of ROS1 kinase inhibitors.
