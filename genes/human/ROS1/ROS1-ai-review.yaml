core_functions:
- description: Acts at the plasma membrane as a ligand-activated receptor tyrosine kinase - NELL2 is an
    endogenous ligand - autophosphorylating and phosphorylating substrates including PTPN11 and VAV3,
    thereby engaging PI3K-mTOR, ERK and STAT3 signalling and driving regionalized differentiation of the
    epididymal epithelium.
  molecular_function:
    id: GO:0004714
