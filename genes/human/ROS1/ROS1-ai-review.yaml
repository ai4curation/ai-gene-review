      insulin receptor [IR], and insulin-like growth factor I receptor [IGFR]) led to tyrosine phosphorylation
      of Vav3
suggested_questions:
- question: Does NELL2 activate human ROS1 in tissues other than the epididymis, and are there additional
    ligands for the very large fibronectin-repeat ectodomain?
- question: Where do the common ROS1 fusion oncoproteins actually signal from, and how does losing the
    transmembrane anchor change the substrate repertoire relative to full-length receptor?
- question: What is the physiological role of ROS1 in human brain, where it is expressed and upregulated
    in glioma?
suggested_experiments:
- description: Phosphoproteomics of isogenic cells expressing full-length NELL2-stimulated ROS1 versus
    a FIG-ROS1 or CD74-ROS1 fusion, to compare substrate sets and identify fusion-specific signalling.
- description: Ligand-binding and cell-surface receptor activation assays with recombinant NELL2 on human
    epithelial cells expressing full-length ROS1, establishing the human (not only mouse) ligand-receptor
    relationship quantitatively.
- description: Conditional ROS1 loss in human epididymal or airway epithelial organoids, assaying regional
    differentiation markers and PI3K-mTOR pathway output.
