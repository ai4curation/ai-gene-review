core_functions:
- description: CNGA3 contributes cGMP-recognition and pore-forming elements to the cone cyclic nucleotide-gated
    channel. Together with CNGB3 it couples intracellular cGMP to cation flow across outer-segment membranes,
    supporting the electrical response underlying cone vision. CNGA3 functions within the physiological
    heteromer and can also form conductive homomeric channels in expression experiments.
