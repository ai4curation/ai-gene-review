    relevance: HIGH
    review_notes: 'Normal cache remains an abstract. Authentic indexed author-upload Methods and Results
      were recovered and read; human expression, GFP constructs, controls and ligand-response comparisons
      are explicit. RNA expression ratios are not measured channel stoichiometry. Public original full-text
      locator: https://www.researchgate.net/publication/10701064_Achromatopsia-associated_Mutation_in_the_Human_Cone_Photoreceptor_Cyclic_Nucleotide-gated_Channel_CNGB3_Subunit_Alters_the_Ligand_Sensitivity_and_Pore_Properties_of_Heteromeric_Channels.
      Abstract anchors and external full-text Methods/Results are explicitly distinct; full_text_unavailable
      remains false because authentic external full text was accessed. Stable publication identifier:
      https://doi.org/10.1074/jbc.M305102200. The author-uploaded URL records the actual external access
      route; the DOI is not a claim of newly accessed publisher full text.'
  full_text_unavailable: false
