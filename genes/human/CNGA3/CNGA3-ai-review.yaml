id: Q16281
gene_symbol: CNGA3
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CNGA3 is the ligand-binding and pore-forming alpha subunit of the cone photoreceptor cyclic
  nucleotide-gated cation channel. It assembles with CNGB3 in cone outer-segment membranes, where intracellular
  cGMP promotes cation entry; light-driven loss of cGMP closes the channel and contributes to the cone
  electrical response. Human reconstituted complexes contain three CNGA3 subunits and one CNGB3. CNGA3
  can also form conductive homomers and respond less effectively to cAMP. Biallelic CNGA3 variants cause
  achromatopsia and related cone dysfunction. Ortholog studies additionally report neuronal, glial and
  sensory-tissue expression and context-dependent protein interactions.
alternative_products:
- name: '1'
  id: Q16281-1
  description: Displayed 694-residue product; the NP_001289.1 accession specified for full-length human
    structural constructs maps to this product. Engineered N-terminal truncations used for nanodisc structures
    are distinct from natural products.
- name: '2'
  id: Q16281-2
  sequence_note: VSP_042525
  description: 676-residue alternative product in which canonical residues 132–150 are replaced by one
    arginine. Its sequence is verified, but separate native localization and channel properties were not
    established by the inspected studies.
- name: '3'
  id: Q16281-3
  sequence_note: VSP_057075
  description: 698-residue alternative product with a different N-terminal segment replacing canonical
    residues 1–71. Its sequence is verified; the reviewed channel assays do not establish equivalent behavior
    for this product.
