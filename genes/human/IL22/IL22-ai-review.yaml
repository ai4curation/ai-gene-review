      supported_by:
        - reference_id: PMID:10875937
          supporting_text: In contrast to IL-10, IL-22 does not inhibit the production
            of proinflammatory cytokines by monocytes in response to LPS nor does
            it impact IL-10 function on monocytes
        - reference_id: file:human/IL22/IL22-deep-research.md
          supporting_text: 'Importantly, IL-22’s effects are context-dependent: in an
            environment with ongoing infection or tissue stress, IL-22 is generally
            beneficial (enhancing antimicrobial immunity and repair), but in an already
            inflamed tissue without active infection, continual IL-22 signaling may
            contribute to **pathogenic inflammation**.'
