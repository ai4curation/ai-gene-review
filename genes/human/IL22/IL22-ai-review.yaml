      label: extracellular space
    evidence_type: IBA
    original_reference_id: GO_REF:0000033
    review:
      summary: IL-22 is definitively localized to the extracellular space as a secreted
        cytokine. The protein contains a signal peptide (aa 1-33) that directs it
        through the secretory pathway, and mature IL-22 functions in the extracellular
        environment where it binds to receptors on target cells. The IBA annotation
        is well-supported by phylogenetic conservation.
      action: ACCEPT
      reason: IL-22 is a secreted protein that functions in the extracellular space.
        Multiple structural and functional studies confirm its extracellular localization,
        including crystal structures of IL-22 bound to its receptor and functional
        assays showing it acts on cell surface receptors. This is a core aspect of
        IL-22 biology.
      supported_by:
        - reference_id: file:human/IL22/IL22-uniprot.txt
          supporting_text: 'CC   -!- SUBCELLULAR LOCATION: Secreted.'
        - reference_id: file:human/IL22/IL22-deep-research.md
          supporting_text: IL-22 is a secreted protein. It contains an N-terminal
            signal peptide (amino acids 1–33) that directs it into the endoplasmic
            reticulum/Golgi secretory pathway, after which the mature cytokine is
            released into the extracellular space.
  - term:
      id: GO:0050728
      label: negative regulation of inflammatory response
    evidence_type: IBA
    original_reference_id: GO_REF:0000033
    review:
      summary: IL-22 has complex, context-dependent effects on inflammation. While
        it can have anti-inflammatory effects through tissue protection and barrier
        maintenance, it also has well-documented pro-inflammatory activities in many
        contexts, particularly in autoimmune diseases like psoriasis and rheumatoid
        arthritis. The negative regulation annotation captures only one aspect of
        IL-22 function.
      action: MODIFY
      reason: IL-22 has dual pro- and anti-inflammatory effects depending on context.
        In acute injury, it promotes tissue repair and can limit inflammation through
        barrier protection. However, in chronic inflammation (psoriasis, IBD), IL-22
        often drives pathogenic inflammation. A more accurate annotation would be
        "regulation of inflammatory response" (GO:0050727) or maintaining both positive
        and negative regulation terms to capture this duality.
      proposed_replacement_terms:
        - id: GO:0050727
          label: regulation of inflammatory response
        - id: GO:0032103
          label: positive regulation of response to external stimulus
      propagation_review:
        root_cause: TERM_SCOPING_PROBLEM
        failure_modes:
