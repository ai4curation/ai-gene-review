          - CONTEXT_OR_TISSUE_MISMATCH
        source_entities:
          - source_id: PANTHER:PTN007703048
            source_label: IL22 ancestral node
            source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
            comment: IL-22 has context-dependent pro- and anti-inflammatory effects rather than strictly negative regulation.
        residue_claims_not_applicable: >-
          Regulatory sign and context refinement from negative regulation of inflammatory
          response (GO:0050728) to regulation of inflammatory response (GO:0050727); not
