core_functions:
  - description: >-
      Secreted cytokine that binds the heterodimeric IL22RA1/IL10RB receptor
      complex on epithelial cells and hepatocytes and thereby initiates the
      interleukin-22-mediated signaling pathway, which signals through the
      receptor-associated JAK kinases to activate STAT3 (and STAT1/STAT5).
      Downstream outcomes of this signaling, such as antimicrobial peptide
      production, acute-phase protein synthesis, and epithelial proliferation
      and repair, are consequences of the pathway rather than activities of
      IL22 itself and are not listed as directly_involved_in terms.
    molecular_function:
      id: GO:0005125
      label: cytokine activity
    directly_involved_in:
      - id: GO:0140865
        label: interleukin-22-mediated signaling pathway
      - id: GO:0007259
        label: cell surface receptor signaling pathway via JAK-STAT
    locations:
      - id: GO:0005576
        label: extracellular region
    supported_by:
      - reference_id: PMID:10875937
        supporting_text: A new member of the interferon receptor family, which we term
          IL-22R, functions as a second component together with CRF2-4 to enable IL-22
          signaling.
      - reference_id: PMID:10875937
        supporting_text: Cell lines were identified that respond to IL-22 by activation
          of STATs 1, 3, and 5
      - reference_id: PMID:10954742
        supporting_text: Recombinant human IL-TIF was found to activate signal transducer
          and activator of transcription factors-1 and -3 in several hepatoma cell
          lines.
      - reference_id: file:human/IL22/IL22-uniprot.txt
        record_section: ["CC:SUBCELLULAR LOCATION"]
        supporting_text: 'CC   -!- SUBCELLULAR LOCATION: Secreted.'
