  - term:
      id: GO:0050728
      label: negative regulation of inflammatory response
    evidence_type: IBA
    original_reference_id: GO_REF:0000033
    qualifier: involved_in
    review:
      summary: IL-22 has complex, context-dependent effects on inflammation. While
        it can have anti-inflammatory effects through tissue protection and barrier
        maintenance, it also has well-documented pro-inflammatory activities in many
        contexts, particularly in autoimmune diseases like psoriasis and rheumatoid
        arthritis. The negative regulation annotation captures only one aspect of
        IL-22 function.
      action: MODIFY
      reason: IL-22 has dual pro- and anti-inflammatory effects depending on context.
        In acute injury, it promotes tissue repair and can limit inflammation through
        barrier protection. However, in chronic inflammation (psoriasis, IBD), IL-22
        often drives pathogenic inflammation. A more accurate annotation would be
        "regulation of inflammatory response" (GO:0050727) or maintaining both positive
        and negative regulation terms to capture this duality.
      proposed_replacement_terms:
        - id: GO:0050727
          label: regulation of inflammatory response
        - id: GO:0032103
          label: positive regulation of response to external stimulus
      propagation_review:
        root_cause: TERM_SCOPING_PROBLEM
        failure_modes:
