core_functions:
  - description: >-
      Secreted cytokine that binds the heterodimeric IL-22RA1/IL-10RB receptor
      complex on epithelial cells and hepatocytes to initiate the interleukin-22-mediated
      JAK1/TYK2-STAT3 signaling pathway, driving antimicrobial peptide production,
      acute-phase protein synthesis, and epithelial barrier regeneration.
