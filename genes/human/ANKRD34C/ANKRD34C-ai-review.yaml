description: ANKRD34C (ankyrin repeat domain-containing 34C) is an uncharacterized ankyrin-repeat protein
  of the ANKRD34 family, with brain-enhanced expression. No molecular activity, location or biological
  role has been established. It has been reported as the partner gene of a RARA::ANKRD34C fusion in a
  case of acute promyelocytic leukemia.
