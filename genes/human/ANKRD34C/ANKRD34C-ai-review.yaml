knowledge_gaps:
- gap_statement: ANKRD34C's molecular activity, location, partners and biological role are unknown.
  boundary: The only GOA row, a pi-body IBA, is a stale propagation from a germline protein now in another
    family, and is removed. The current PAINT node for the ANKRD34 family asserts cytosol from ANKRD34A
    and ANKRD34B, but no ANKRD34C-specific data exist. The literature is one APL fusion case.
  gap_kind:
  - BIOLOGY
  dark_aspect: WHOLLY_DARK
  status: OPEN
  significance: ANKRD34C is brain-enhanced like its paralogs, but nothing is known of what it does.
  resolution: Localize endogenous ANKRD34C in neurons and identify its partners, then test loss of function.
  provenance:
  - reference_id: file:human/ANKRD34C/ANKRD34C-uniprot.txt
    supporting_text: DR   PAN-GO; P0C6C1; 1 GO annotation based on evolutionary models.
  - reference_id: file:human/ANKRD34C/ANKRD34C-uniprot.txt
    supporting_text: DR   HPA; ENSG00000235711; Tissue enhanced (brain).
  - reference_id: file:interpro/panther/PTHR24156/PTHR24156-entries.csv
    supporting_text: P0C6C1,Ankyrin repeat domain-containing protein 34C,protein,9606,Homo sapiens,Homo
      sapiens (Human),ANKRD34C,535,PTHR24156:SF6,ANKYRIN REPEAT DOMAIN 34C,True
  - reference_id: file:human/ANKRD34C/ANKRD34C-deep-research-affinage.md
    supporting_text: no mechanistic role for the canonical ANKRD34C protein — its molecular activity,
      localization, or pathway — has been characterized in the available corpus.
proposed_new_terms: []
suggested_questions:
- question: Does ANKRD34C share the cytosolic location asserted for ANKRD34A and ANKRD34B, and is it,
    like DP58/ANKRD34B, also nuclear in neurons?
suggested_experiments:
- description: Localize endogenous ANKRD34C in cultured neurons and test whether it interacts with ANKRD34A
    or ANKRD34B.
