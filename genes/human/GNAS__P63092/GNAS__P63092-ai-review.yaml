    label: positive regulation of NLRP3 inflammasome complex assembly
  evidence_type: IDA
  original_reference_id: PMID:35025664
  qualifier: involved_in
  review:
    summary: Octanal-induced NLRP3 activation in vascular macrophages is mediated by GNAL/ADCY3, not
      GNAS.
    action: REMOVE
    reason: PMID:35025664 reports that mouse Olfr2 and human OR6A2 signal through the olfactory
      G-alpha subunit GNAL to ADCY3 in vascular macrophages. The full text lists GNAL, not GNAS,
      among the human OR6A2 signaling components, so this NLRP3 assembly row is on the wrong G-alpha
      product.
    supported_by:
    - &id002
      reference_id: PMID:35025664
      supporting_text: OR6A2, GNAL, CNGA1, CNGA3, CNGA4, CNGB1, RTP1, and ADCY3 mRNA
    source_defects:
    - defect_type: WRONG_GENE_PRODUCT
      resource: UNIPROT
      requested_change: DELETE_ROW
      asserted_value: UniProtKB:P63092
      confidence: CONFIRMED
      explanation: PMID:35025664 places the OR6A2/Olfr2 macrophage response on the canonical
        olfactory pathway using GNAL/G-alpha-olf and ADCY3. The paper lists OR6A2, GNAL,
        cyclic-nucleotide-gated channels, RTP1 and ADCY3 as human macrophage signaling components
        and does not identify canonical Gs-alpha/P63092 as the G protein for NLRP3 activation.
      supported_by:
      - *id002
