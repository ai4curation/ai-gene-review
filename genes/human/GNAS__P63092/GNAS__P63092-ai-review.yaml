alternative_records:
- id: Q5JWF2
  relationship: REFERENCE_PROTEOME_LOCUS_COUNTERPART
  reference_proteome: UP000005640
  reviewed_on: '2026-11-25'
  reason: Q5JWF2 represents the XL-alpha-s proteins made from the GNAS XL first exon joined to
    exons 2-13. They share the GNAS locus and C-terminal coding exons with P63092 but have a
    distinct N terminus, so evidence that specifically assayed XL-alpha-s should not be transferred
    automatically to the canonical P63092 Gs-alpha products.
  evidence:
  - type: PROTEOME_MEMBERSHIP
    description: UniProt lists the Q5JWF2 XL-alpha-s isoforms as external alternative products in
      the P63092 GNAS entry.
    supported_by:
    - reference_id: file:human/GNAS__P63092/GNAS__P63092-uniprot.txt
      record_section:
      - CC:ALTERNATIVE PRODUCTS
      supporting_text: IsoId=Q5JWF2-1; Sequence=External
  - type: LOCUS_MAPPING
    description: GNAS-locus review literature places XL-alpha-s on an upstream first exon spliced
      onto downstream GNAS exons 2-13.
    supported_by:
    - reference_id: PMID:25219572
      supporting_text: Exon extra-large αs (XLαs), located 35 kb upstream from exon 1, can splice onto exons 2–13 to produce XLαs
- id: O95467
  relationship: REFERENCE_PROTEOME_LOCUS_COUNTERPART
  reference_proteome: UP000005640
  reviewed_on: '2026-11-25'
  reason: O95467 represents the NESP55 product of the GNAS locus. Its coding sequence is restricted
    to a separate NESP55 first exon while the shared downstream GNAS exons form untranslated sequence,
    so NESP55-specific secretory-granule annotations are not evidence for canonical P63092 Gs-alpha.
  evidence:
  - type: PROTEOME_MEMBERSHIP
    description: UniProt lists the O95467 NESP55 isoform as an external alternative product in the
      P63092 GNAS entry.
    supported_by:
    - reference_id: file:human/GNAS__P63092/GNAS__P63092-uniprot.txt
      record_section:
      - CC:ALTERNATIVE PRODUCTS
      supporting_text: IsoId=O95467-1; Sequence=External
  - type: LOCUS_MAPPING
    description: GNAS-locus review literature places NESP55 on another upstream first exon whose
      coding sequence is distinct from canonical Gs-alpha.
    supported_by:
    - reference_id: PMID:25219572
      supporting_text: The use of another first exon located 47 kb upstream of exon 1 produces NESP55
existing_annotations:
- term:
    id: GO:0001541
    label: ovarian follicle development
  evidence_type: TAS
  original_reference_id: PMID:36720854
  qualifier: involved_in
  review:
    summary: Gs-alpha participates in FSH/FSHR signaling that supports ovarian follicle development,
      but follicle development is pathway context rather than its core molecular function.
    action: KEEP_AS_NON_CORE
    reason: The FSHR cryo-EM paper places Gs in the active FSH-FSHR-Gs complex and connects
      glycoprotein hormone receptors, including FSHR, to Gs-mediated cAMP production. P63092 carries
      the generic Gs-alpha transducer activity in that receptor context; its standalone core function
      remains GPCR-to-cAMP signal transduction.
    supported_by:
    - reference_id: PMID:36720854
      supporting_text: There are three members of glycoprotein hormone receptors, FSHR, LHCGR and TSHR, which are activated to mainly couple the Gs protein and lead to up-regulation of the secondary message cAMP in cells
- term:
    id: GO:0001678
    label: intracellular glucose homeostasis
  evidence_type: IDA
  original_reference_id: PMID:40446798
  qualifier: involved_in
  review:
    summary: MRGPRE-Gs signaling affects glucose homeostasis as a receptor-specific context.
    action: KEEP_AS_NON_CORE
    reason: The microbial bile acid receptor MRGPRE uses Gs-cAMP signaling as one arm contributing
      to the glucose-homeostasis effects of Trp-CA. This is a valid receptor context for Gs-alpha
      but not the canonical core process of the ubiquitous transducer.
    supported_by:
    - reference_id: PMID:40446798
      supporting_text: "Both MRGPRE-Gs-cyclic AMP (cAMP) \nand MRGPRE-β-arrestin-1-aldolase A (ALDOA)
        signaling pathways contribute to the \nmetabolic benefits of Trp-CA"
