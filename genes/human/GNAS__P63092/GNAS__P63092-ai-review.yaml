id: P63092
gene_symbol: GNAS
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  Gs-alpha is the canonical stimulatory alpha subunit encoded by the complex imprinted GNAS locus. It
  is a lipid-anchored peripheral component of heterotrimeric G proteins at the cytoplasmic side of the
  plasma membrane, where activated G protein-coupled receptors promote GDP release and GTP binding. GTP-bound
  Gs-alpha stimulates transmembrane adenylyl cyclases to raise cAMP, and intrinsic GTP hydrolysis restores
  the inactive GDP-bound state to terminate the signal.
