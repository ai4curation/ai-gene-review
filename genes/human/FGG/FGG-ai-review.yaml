id: P02679
gene_symbol: FGG
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: FGG encodes the gamma subunit of fibrinogen, a secreted complex containing two alpha, two beta and
  two gamma chains. Gamma interfaces contribute to assembly and, after thrombin acts on the other chains, recognize
  exposed fibrin knobs to support the extracellular clot network. Gamma-containing fibrinogen also bridges activated
  platelets. Receptor-recognition regions contribute to contextual endothelial adhesion and signaling. Alternative
  C termini distinguish gamma-A from the longer gamma-B (gamma-prime) product; experimental fragments, multimerized
  preparations and clinical splice mutants do not establish equal activity of these natural products. Pathogenic
  FGG variants can impair assembly, secretion or clot properties, producing quantitative or qualitative fibrinogen
  disorders.
alternative_products:
