- id: file:human/FGG/FGG-uniprot.txt
  title: UniProtKB P02679 fibrinogen gamma chain
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Immutable official sequence/location/product record. Gamma-B P02679-1 is displayed, 453 aa; gamma-A
      P02679-2 replaces residues 434–453 by AGDV and is 437 aa. All annotations use parent accession; pathological
      or experimental fragments are not natural products.
core_functions:
- description: Gamma interfaces assemble with alpha and beta chains into fibrinogen and provide the a-pocket recognizing
    exposed alpha-chain knobs during fibrin polymer formation. Gamma receptor contacts also support bridging of
    activated platelets. The isolated platelet-active preparation was multimeric; shared structural participation
    does not imply identical C-terminal ligand recognition by gamma-A and gamma-B. Proteolytic activation and covalent
    crosslinking are performed by other enzymes.
  molecular_function:
    id: GO:0005198
    label: structural molecule activity
  directly_involved_in:
  - id: GO:0072378
    label: blood coagulation, fibrin clot formation
  - id: GO:0070527
    label: platelet aggregation
  locations:
  - id: GO:0005576
    label: extracellular region
  in_complex:
    id: GO:0005577
    label: fibrinogen complex
  supported_by:
  - reference_id: PMID:8910396
  - reference_id: PMID:6451630
  - reference_id: PMID:9207064
  - reference_id: PMID:6281794
  - reference_id: PMID:19296670
suggested_questions:
- question: Which gamma-chain contacts, if any, directly contribute to the fibrin template for tPA-mediated plasminogen
    activation, independently of effects on fibrin assembly and lysis susceptibility?
