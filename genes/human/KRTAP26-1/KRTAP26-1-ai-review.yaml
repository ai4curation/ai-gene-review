  supporting_entities:
  - UniProtKB:P03410
  review:
    summary: Systematic binary interaction screen (PMID:22458338) reported an interaction between KRTAP26-1 and UniProtKB:P03410.
    action: REMOVE
    reason: Bare GO:0005515 protein binding is uninformative and is removed under the project protein-binding policy; removal does not mean the reported interaction is false. Small cysteine- and glycine/tyrosine-rich KAPs are recurrent, promiscuous preys in high-throughput yeast two-hybrid screens (their recorded partners span unrelated transcription factors, LCE proteins and other KAPs), and the screen does not establish a more informative molecular function such as keratin filament binding.
