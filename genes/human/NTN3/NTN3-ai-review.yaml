- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  review:
    summary: A broad cytoplasmic assignment can include the intracellular secretory pathway.
    action: KEEP_AS_NON_CORE
    reason: Cytoplasm includes the endomembrane system, so this term is compatible with secretory
      trafficking; it does not require soluble mature netrin-3 in the cytosol. Primary extracellular
      function does not disprove an intracellular pool, although the present rule-derived assignment
      is not its core functional location.
    supported_by:
