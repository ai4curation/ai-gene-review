  findings:
  - statement: NTN1/NTN3 have erroneous IBA annotations from PANTHER node PTN000180816 which incorrectly
      grouped netrins with POU-domain TFs
  - statement: PTHR10574 proteins are secreted ECM/guidance proteins with no DNA-binding domains
