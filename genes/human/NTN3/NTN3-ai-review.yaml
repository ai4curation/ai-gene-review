core_functions:
- description: Netrin-3 is a secreted netrin-receptor ligand with a conserved role in axon guidance.
    Direct mouse ortholog assays establish binding to DCC, neogenin and UNC5-family receptors and
    axon outgrowth activity; DCC affinity is lower than affinity for the other tested receptors.
  molecular_function:
    id: GO:1990890
    label: netrin receptor binding
  directly_involved_in:
