- term:
    id: GO:0005576
    label: extracellular region
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  review:
    summary: This annotation is correct and represents a core localization for NTN3. The protein contains
      a signal peptide and is secreted to the extracellular space where it functions as an axon guidance
      cue.
    action: ACCEPT
    reason: NTN3 is a secreted protein (signal peptide residues 1-27) that localizes to the extracellular
      region, specifically the extracellular matrix. This is the primary functional localization for
      netrin family proteins where they establish chemotropic gradients for axon guidance.
    supported_by:
    - reference_id: UniProt:O00634
      supporting_text: '-!- SUBCELLULAR LOCATION: Secreted, extracellular space, extracellular matrix'
- term:
    id: GO:0005794
    label: Golgi apparatus
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  review:
    summary: This annotation is acceptable as NTN3 is a secreted protein that transits through the
      Golgi apparatus during biosynthesis. The annotation likely reflects Golgi localization during
      the secretory pathway.
    action: KEEP_AS_NON_CORE
    reason: As a secreted protein, NTN3 passes through the Golgi apparatus during biosynthesis and
      maturation. While this is not the final functional localization, it is a valid component of
      the secretory pathway that NTN3 uses. The annotation is not incorrect but represents transient
      localization rather than core function.
    supported_by:
    - reference_id: UniProt:O00634
      supporting_text: '-!- SUBCELLULAR LOCATION: Secreted, extracellular space, extracellular matrix'
- term:
    id: GO:0007411
    label: axon guidance
  evidence_type: NAS
  original_reference_id: PMID:9143507
  review:
    summary: This is a core annotation for NTN3 supported by the primary characterization paper. PMID:9143507
      describes NTN3 (then called NTN2L) as a member of the netrin family of chemotropic factors that
      play a central role in axon guidance. The annotation appropriately captures the primary biological
      function of this protein.
    action: ACCEPT
    reason: Axon guidance is the core biological function of netrin family proteins including NTN3.
      The cited paper (PMID:9143507) explicitly states that netrins play a central role in axon guidance.
      This is well-supported by the literature on netrin family function.
    supported_by:
    - reference_id: PMID:9143507
      supporting_text: The netrins define a family of chemotropic factors that have been shown to
        play a central role in axon guidance.
    - reference_id: UniProt:O00634
      supporting_text: '-!- FUNCTION: Netrins control guidance of CNS commissural axons and peripheral
        motor axons.'
    - *id001
