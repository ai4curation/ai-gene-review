- term:
    id: GO:0007409
    label: axonogenesis
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  review:
    summary: This annotation is appropriate but could be more specific. NTN3 is a netrin family member
      that functions in axon guidance, which is a subprocess of axonogenesis. The ARBA annotation
      captures a relevant biological process for this protein.
    action: ACCEPT
    reason: Netrins are well-established axon guidance cues that regulate axonogenesis by guiding
      the growth and direction of axons during neural development. While GO:0007411 (axon guidance)
      is more specific, axonogenesis is an appropriate broader term. The annotation aligns with established
      netrin family function.
    supported_by:
    - reference_id: UniProt:O00634
      supporting_text: '-!- FUNCTION: Netrins control guidance of CNS commissural axons and peripheral
        motor axons.'
    - reference_id: PMID:9143507
      supporting_text: The netrins define a family of chemotropic factors that have been shown to
        play a central role in axon guidance.
    - &id001
      reference_id: PMID:10366627
      supporting_text: murine netrin-3 protein binds to netrin receptors
