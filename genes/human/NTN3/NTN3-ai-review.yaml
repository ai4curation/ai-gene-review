  original_reference_id: GO_REF:0000033
  review:
    summary: The POU-seeded DNA-binding-function transfer does not fit the netrin protein.
    action: REMOVE
    reason: The GOA source PTN000180816 has POU-transcription-factor experimental seeds, whereas the
      target has the laminin/EGF/NTR architecture and netrin receptor-ligand biology. The current
      PTHR10574 PAINT cache contains these POU-seeded rows, so the original claim of a demonstrated
      wrong-family tree placement is replaced by a provenance discrepancy requiring upstream inspection.
      These specific Pol II sequence-recognition/TF activities are not supported by the target architecture
      or source-to-target functional homology; removal is not based on secreted localization alone.
