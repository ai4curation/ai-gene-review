id: O00634
gene_symbol: NTN3
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: NTN3 encodes netrin-3, a secreted laminin-related axon-guidance ligand containing an
  N-terminal laminin domain, laminin EGF-like repeats and a C-terminal NTR domain. Mouse netrin-3,
  the established ortholog of human NTN3/NTN2L, binds DCC, neogenin and UNC5 receptors, with lower
  affinity for DCC than the other tested receptors, and can promote commissural axon outgrowth. Mouse
  developmental expression and assays suggest a prominent role in peripheral nerve development; the
  original human gene study detected transcript in spinal cord without establishing exclusive expression
  there.
