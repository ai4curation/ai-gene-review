  title: Annotation inferences using phylogenetic trees
  findings:
  - statement: The IBA annotations for transcription factor activity propagated to NTN3 are erroneous
      due to phylogenetic tree construction error
- id: GO_REF:0000107
  title: Automatic transfer of experimentally verified manual GO annotation data to orthologs using
    Ensembl Compara
  findings:
  - statement: Ortholog-based transfer from mouse Ntn3 for cellular component and molecular function
      terms is appropriate
- id: GO_REF:0000117
  title: Electronic Gene Ontology annotations created by ARBA machine learning models
  findings:
  - statement: ARBA annotation for axonogenesis is appropriate; cytoplasm annotation is technically
      correct but not informative
- id: PMID:26190107
  title: A Floor-Plate Extracellular Protein-Protein Interaction Screen Identifies Draxin as a Secreted
    Netrin-1 Antagonist.
  findings:
  - statement: Demonstrates protein-protein interaction between netrins and DRAXIN
    supporting_text: The assembled floor-plate network contains 47 interactions including the hitherto-not-reported
      interaction between Netrin-1 and Draxin.
  - statement: DRAXIN competes with netrin receptors for binding to Netrin-1
    supporting_text: demonstrated that Draxin competes with Netrin receptors for binding to Netrin-1
  - statement: NTN3 interaction with DRAXIN confirmed by IntAct (2 experiments)
    supporting_text: The assembled floor-plate network contains 47 interactions including the hitherto-not-reported
      interaction between Netrin-1 and Draxin.
- id: PMID:9143507
  title: The NTN2L gene encoding a novel human netrin maps to the autosomal dominant polycystic kidney
    disease region on chromosome 16p13.3.
  findings:
  - statement: First description of human NTN3 (originally called NTN2L)
    supporting_text: We describe the characterization of a novel human netrin-2-like gene, designated
      NTN2L, and its transcript.
  - statement: Netrins are chemotropic factors central to axon guidance
    supporting_text: The netrins define a family of chemotropic factors that have been shown to play
      a central role in axon guidance.
  - statement: NTN3 has restricted expression pattern, detected in spinal cord by RT-PCR
    supporting_text: The NTN2L gene has a restricted pattern of expression; its transcript is undetectable
      by Northern analysis in all tissues examined, but can be recovered from spinal cord RNA by RT-PCR.
  - statement: Predicted 580-amino-acid protein with homology to chicken, Drosophila netrins and C.
      elegans UNC-6
    supporting_text: The NTN2L gene is predicted to encode a 580-amino-acid protein having homology
      to the chicken and Drosophila netrins and to Caenorhabditis elegans UNC-6.
- id: file:human/NTN3/NTN3-deep-research-falcon.md
  title: Falcon deep research report for human NTN3
  findings:
  - statement: NTN3 encodes secreted Netrin-3, a laminin-like extracellular guidance cue that binds
      canonical netrin receptors including DCC, NEO1, and UNC5-family receptors.
  - statement: Binding data summarized in the report support NTN3 as a netrin receptor ligand, with
      comparatively strong binding to UNC5B and UNC5C in available datasets.
