existing_annotations:
- term:
    id: GO:0000166
    label: nucleotide binding
  evidence_type: TAS
  original_reference_id: PMID:9765232
  qualifier: enables
  review:
    summary: ORC5 carries a conserved Walker A P-loop (residues 37-44) and binds ATP at the ORC5·3 AAA+
      interface of human ORC.
    action: MODIFY
    reason: 'Nucleotide binding is correct but general. The nucleotide is ATP: mutating the ORC5 ATP-binding
      site impairs human ORC assembly (Siddiqui and Stillman 2007) and cryoEM of human ORC resolves ATP
      at the ORC4·5 and ORC5·3 interfaces (Jaremko et al. 2020). The ATP at ORC5''s site is structural
      rather than hydrolysed (only the ORC1·4 site has demonstrated ATPase activity), so ATP binding,
      not an ATPase term, is the right refinement.'
    supported_by:
    - &id001
      reference_id: PMID:17716973
      supporting_text: Mutations in the ATP-binding sites of Orc4 or Orc5 impair complex assembly, whereas
        Orc1 ATP binding is not required.
    - &id011
      reference_id: PMID:32808929
      supporting_text: ATP-binding sites sandwiched between the ORC1·4, ORC4·5, and ORC5·3 AAA+ interfaces
    - &id012
      reference_id: PMID:32808929
      supporting_text: we conclude that ATP promotes the assembly and stability of the human ORC
    proposed_replacement_terms:
    - id: GO:0005524
      label: ATP binding
- term:
    id: GO:0000781
    label: chromosome, telomeric region
  evidence_type: HDA
  original_reference_id: PMID:19135898
  qualifier: located_in
  review:
    summary: Proteomics of isolated chromatin segments (PICh) of human telomeric chromatin recovered ORC
      subunits including ORC5.
    action: KEEP_AS_NON_CORE
    reason: A high-throughput proteomic identification at telomeric chromatin. ORC is chromatin-bound
      genome-wide, so presence at telomeres is plausible but is a location within its broad chromatin
      distribution, not a specific telomere function of ORC5.
    supported_by:
    - reference_id: PMID:19135898
      supporting_text: Purification of human telomeric chromatin
- term:
    id: GO:0000785
    label: chromatin
  evidence_type: IDA
  original_reference_id: PMID:31160578
  qualifier: located_in
  review:
    summary: Chromatin-bound ORC5 is detected by cell fractionation and is the S-phase substrate of the
      ubiquitin ligase OBI1.
    action: ACCEPT
    reason: 'Direct human evidence: wild-type and lysine-less ORC5 bind chromatin, and the chromatin-bound
      pool is ubiquitylated by OBI1. Chromatin is the functional location of an origin-binding initiator
      subunit; ORC5 chromatin association also depends on ORCA/LRWD1 and the ORC1 BAH domain.'
    supported_by:
    - &id006
      reference_id: PMID:31160578
      supporting_text: Functional characterisation of the lysine-less ORC3/5 variants showed that ORC3/5
        0 K could bind to chromatin
    - &id005
      reference_id: PMID:31160578
      supporting_text: OBI1 catalyses the multi-mono-ubiquitylation of a subset of chromatin-bound ORC3
        and ORC5 during S-phase
    - reference_id: PMID:22398447
      supporting_text: chromatin association of the ORC components ORC2, ORC3, ORC5 and ORC6 was compromised
        in cells expressing the ORC1 H4K20me2-binding pocket mutants
