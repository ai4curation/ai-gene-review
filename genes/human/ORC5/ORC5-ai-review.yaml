  - *id012
suggested_questions:
- question: Does the ORC5 beta-hairpin (H398) contribute to origin selection or DNA affinity of human
    ORC, given that human ORC shows little sequence specificity?
- question: How does OBI1-dependent multi-mono-ubiquitylation of ORC5 promote origin firing mechanistically,
    and which firing factors read the ubiquitylated ORC3/5?
- question: Does the ORC5T isoform, which binds ORC4 but not ORC2, form a regulatory or non-replicative
    ORC subcomplex in vivo?
suggested_experiments:
- description: Mutate the ORC5 beta-hairpin residues contacting DNA and measure DNA binding of reconstituted
    human ORC and MCM loading in vitro.
  experiment_type: Biochemical reconstitution
- description: Map OBI1 ubiquitylation sites on ORC5 and identify proteins that bind ubiquitylated ORC3/5
    at origins selected for firing.
  experiment_type: Proteomics and ubiquitin-site mutagenesis
