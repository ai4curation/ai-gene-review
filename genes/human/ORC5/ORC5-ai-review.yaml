id: O43913
gene_symbol: ORC5
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ORC5 is a subunit of the six-subunit origin recognition complex (ORC1-6), the eukaryotic
  replication initiator that binds replication origins on chromatin and, with CDC6 and CDT1, loads the
  MCM2-7 helicase to license origins in G1. ORC5 is an AAA+ family protein whose RecA-like domain binds
  ATP at the ORC5-ORC3 interface; in human ORC this ATP is structural rather than hydrolysed, and ATP
  binding by ORC4 and ORC5 is required for assembly of the complex. In the ORC-DNA structure, a beta-hairpin
  of ORC5 lies close to DNA in the central channel. ORC5 is nuclear and chromatin-associated; its recruitment
  depends on ORCA/LRWD1 and the ORC1 BAH domain. In S phase, the E3 ligase OBI1 multi-mono-ubiquitylates
  chromatin-bound ORC3 and ORC5, which promotes efficient origin firing. An alternatively spliced isoform
  (ORC5T) binds ORC4 but not ORC2. The gene lies at 7q22 in a region deleted in some uterine leiomyomas
  and myeloid malignancies.
