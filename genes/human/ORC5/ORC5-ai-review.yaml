core_functions:
- description: As a subunit of the nuclear origin recognition complex, ORC5 contributes to origin DNA
    binding (DNA-proximal beta-hairpin) and to the ATP-dependent architecture of ORC, which marks origins
    and supports replication initiation.
  contributes_to_molecular_function:
