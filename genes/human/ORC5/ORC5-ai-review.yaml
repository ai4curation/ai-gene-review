- term:
    id: GO:0003688
    label: DNA replication origin binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000295037
  - SGD:S000005205
  review:
    summary: IBA from PAINT node PTN000295037 (ORC5 family), seeded by budding yeast Orc5.
    action: ACCEPT
    reason: Human ORC5 is in PTHR12705:SF0, the single subfamily of the ORC5 family, inside the clade
      from which this PAINT node propagates. Origin DNA binding is a property of the ORC assembly, and
      human ORC5 contributes a DNA-contacting beta-hairpin (H398) in the human ORC-DNA cryoEM structures.
      Origin binding is the core molecular role of ORC.
    supported_by:
    - &id003
      reference_id: PMID:32808929
      supporting_text: The β-hairpin loop in ORC5 of HsORC also consists of a positively-charged residue
        H398 in close proximity to DNA
    - &id009
      reference_id: file:human/ORC5/ORC5-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Component of the origin recognition complex (ORC) that binds origins of replication.
        DNA-binding is ATP-dependent.
