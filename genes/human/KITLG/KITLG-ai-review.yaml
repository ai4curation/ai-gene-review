existing_annotations:
- term:
    id: GO:0001541
    label: ovarian follicle development
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P21581
  - ensembl:ENSRNOP00000008471
  review:
    summary: >-
      Electronic ortholog-transfer annotation (from rat Kitlg P21581) placing KITLG in
      ovarian follicle development. KIT/KITL signaling supports oocyte and follicle
      survival, so this reproductive developmental role is biologically plausible, but it
      is a downstream, tissue-specific consequence of KITLG's receptor-binding activity
      rather than a core molecular function.
    action: KEEP_AS_NON_CORE
    reason: >-
      Consistent with KITLG's established role as a germ-cell/gonadal niche cytokine, but
      the annotation is electronic and reflects a pleiotropic developmental process; keep
      as a non-core process annotation.
- term:
    id: GO:0003006
    label: developmental process involved in reproduction
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  supporting_entities:
  - ARBA:ARBA00026397
  review:
    summary: >-
      Broad ARBA machine-learning annotation. KITLG does contribute to reproduction (germ
      cell survival/migration in testis and ovary), but this term is very general and
      captures a pleiotropic developmental role rather than the core function.
    action: KEEP_AS_NON_CORE
    reason: >-
      Not incorrect, but a general electronic term; retained as a non-core developmental
      process annotation.
- term:
    id: GO:0005125
    label: cytokine activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: enables
  supporting_entities:
  - UniProtKB:P20826
  - ensembl:ENSMUSP00000100920
  review:
    summary: >-
      SCF is a bona fide hematopoietic cytokine/growth factor: it augments proliferation of
      myeloid and lymphoid progenitors and synergizes with colony-stimulating factors. This
      is a core molecular function of KITLG.
    action: ACCEPT
    reason: >-
      Well supported; SCF is a classic four-helix-bundle cytokine that acts as a receptor
      ligand/growth factor. Core molecular function.
    supported_by:
    - reference_id: PMID:2208279
      supporting_text: >-
        SCF is able to augment the proliferation of both myeloid and lymphoid hematopoietic
        progenitors in bone marrow cultures. SCF exhibits potent synergistic activities in
        conjunction with colony-stimulating factors
- term:
    id: GO:0005173
    label: stem cell factor receptor binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - UniProtKB:P20826
  - ensembl:ENSMUSP00000100920
  - InterPro:IPR003452
  review:
    summary: >-
      KITLG is the defining ligand for the KIT receptor; stem cell factor receptor binding
      is its central, defining molecular function. Supported electronically here and by
      structural and functional data (KIT dimerization driven by SCF binding).
    action: ACCEPT
    reason: >-
      This is the core molecular function of KITLG. Multiple independent lines of evidence
      (structural, functional expression) confirm KIT binding.
    supported_by:
    - reference_id: PMID:17662946
      supporting_text: >-
        The structures show that KIT dimerization is driven by SCF binding whose sole role
        is to bring two KIT molecules together.
- term:
    id: GO:0005173
    label: stem cell factor receptor binding
  evidence_type: TAS
  original_reference_id: PMID:2208279
  qualifier: enables
  review:
    summary: >-
      TAS annotation from the original SCF cloning/functional-expression paper. Recombinant
      human SCF was shown to be biologically active on hematopoietic progenitors via KIT,
      confirming stem cell factor receptor binding.
    action: ACCEPT
    reason: >-
      Core molecular function, supported by the primary functional-expression study.
    supported_by:
    - reference_id: PMID:2208279
      supporting_text: >-
        truncated forms of the rat and human proteins have been expressed in E. coli and
        mammalian cells and have been shown to possess biological activity
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:17662946
  qualifier: enables
  supporting_entities:
  - UniProtKB:P10721
  review:
    summary: >-
      IPI annotation recording a physical interaction with KIT (UniProtKB:P10721). The
      cited crystallographic study establishes that SCF binds and dimerizes KIT. The
      generic "protein binding" term is uninformative, but the interactant and the paper
      identify a specific, more informative molecular function.
    action: MODIFY
    reason: >-
      The interaction partner is KIT and the supporting paper defines the binding as the
      SCF/KIT ligand-receptor interaction; replace the uninformative generic term with the
      specific stem cell factor receptor binding function per curation policy.
    proposed_replacement_terms:
    - id: GO:0005173
      label: stem cell factor receptor binding
    supported_by:
    - reference_id: PMID:17662946
      supporting_text: >-
        The structures show that KIT dimerization is driven by SCF binding whose sole role
        is to bring two KIT molecules together.
