id: P21583
gene_symbol: KITLG
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  KITLG encodes Kit ligand (stem cell factor, SCF; also known as mast cell growth
  factor/MGF and Steel factor), the sole physiological ligand for the class III
  receptor tyrosine kinase KIT (CD117). It is a four-helix-bundle cytokine of the SCF
  family, synthesized as a single-pass type I transmembrane precursor that can either
  remain membrane-anchored to support juxtacrine signaling or be released as a soluble
  ectodomain (sKITLG) by regulated proteolytic shedding; alternative splicing of the
  protease-sensitive exon-6 region tunes the balance between the readily shed (SCF248)
  and predominantly membrane-bound (SCF220) forms. Biologically active as a non-covalent
  homodimer, KITLG binds two KIT ectodomains and brings the receptors together, driving
  KIT dimerization and trans-autophosphorylation and thereby activating PI3K-AKT,
  RAS-RAF-MAPK, PLCgamma and STAT signaling in the receiving cell. Through this receptor
  engagement KITLG functions as an essential niche and growth-factor signal controlling
  the survival, proliferation, migration and differentiation of KIT-expressing cells,
  including hematopoietic stem and progenitor cells, mast cells, melanocytes and germ
  cells. It is produced by supporting cells such as bone-marrow stromal and perivascular
  cells, keratinocytes, endothelial cells and gonadal Sertoli cells. Consistent with
  these roles, KITLG variants cause familial progressive hyperpigmentation, non-syndromic
  unilateral or asymmetric deafness and Waardenburg syndrome type 2F, and common variation
  at the locus underlies normal skin, hair and eye pigmentation variation.
