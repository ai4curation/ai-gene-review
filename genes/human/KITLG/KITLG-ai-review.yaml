- term:
    id: GO:0007155
    label: cell adhesion
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR003452
  review:
    summary: >-
      InterPro2GO mapping from the SCF domain (IPR003452). Membrane-bound SCF can promote
