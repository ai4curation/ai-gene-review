core_functions:
- description: >-
    Stem cell factor receptor binding: as a non-covalent homodimer, KITLG binds two
    molecules of the receptor tyrosine kinase KIT and brings them together, driving KIT
    dimerization and trans-autophosphorylation to initiate downstream signaling. Acts both
    as a membrane-anchored (juxtacrine) ligand and as a shed soluble ligand.
  supported_by:
  - reference_id: PMID:17662946
    supporting_text: >-
      The structures show that KIT dimerization is driven by SCF binding whose sole role is
      to bring two KIT molecules together.
