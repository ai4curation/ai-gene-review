  qualifier: enables
  supporting_entities:
  - UniProtKB:P16118
  review:
    summary: IPI 'protein binding' with PFKFB1 (PMID:10222032).
    action: REMOVE
    reason: Bare 'protein binding' carries no functional information about FBP1. The interaction
      may well be real (FBP1 is reported in large binary interactome screens), but it does
      not describe an activity of FBP1, and the source supports no more informative molecular
      function term for it. Removal does not mean the interaction is false. The cited abstract
      is a kinetic study reporting inhibition by fructose 2,6-bisphosphate (the PFKFB product)
      and AMP; it does not report physical binding to PFKFB in the abstract, so the partner
      cannot be verified here.
