  evidence_type: IDA
  original_reference_id: PMID:19881551
  qualifier: involved_in
  review:
    summary: Negative regulation of glycolysis (IDA, PMID:19881551).
    action: KEEP_AS_NON_CORE
    reason: FBP1 opposes glycolytic flux, partly because it catalyses the reverse of the phosphofructokinase
      step (futile-cycle direction) and, in ccRCC, partly through HIF repression. Real in
      the cancer-cell settings studied, but secondary to the gluconeogenic role.
    supported_by:
