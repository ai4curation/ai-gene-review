id: P09467
gene_symbol: FBP1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: FBP1 encodes fructose-1,6-bisphosphatase 1 (liver FBPase; EC 3.1.3.11), a cytosolic,
  Mg2+-dependent homotetrameric phosphatase that hydrolyses fructose 1,6-bisphosphate to fructose
  6-phosphate and inorganic phosphate. This irreversible reaction bypasses the phosphofructokinase
  step of glycolysis and is a committed, flux-controlling step of gluconeogenesis in liver
  and kidney, allowing glucose to be synthesised from lactate, glycerol and gluconeogenic
  amino acids. The enzyme is allosterically inhibited by AMP and competitively inhibited by
  fructose 2,6-bisphosphate, which together coordinate it reciprocally with phosphofructokinase-1.
  Hepatic FBP1 is also required for tolerance of dietary fructose. In some cancer cells, notably
  clear cell renal carcinoma, a nuclear FBP1 pool binds the HIF-alpha inhibitory domain and
  represses HIF target genes independently of catalytic activity, and FBP1 is frequently silenced
  in tumours. Biallelic loss-of-function variants cause autosomal recessive fructose-1,6-bisphosphatase
  deficiency, with episodic fasting- or illness-induced hypoglycemia and lactic acidosis.
