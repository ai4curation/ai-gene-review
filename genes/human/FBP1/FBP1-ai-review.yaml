core_functions:
- description: Mg2+-dependent hydrolysis of fructose 1,6-bisphosphate to fructose 6-phosphate
    in the cytosol, the irreversible, AMP- and fructose 2,6-bisphosphate-regulated step of
    gluconeogenesis in liver and kidney.
  molecular_function:
    id: GO:0042132
    label: fructose 1,6-bisphosphate 1-phosphatase activity
  directly_involved_in:
  - id: GO:0006094
    label: gluconeogenesis
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:7558035
    supporting_text: Fructose-1,6-bisphosphatase (EC 3.1.3.11) is a key regulatory enzyme
      of gluconeogenesis that catalyzes the hydrolysis of fructose-1,6-bisphosphate to generate
      fructose-6-phosphate and inorganic phosphate.
  - reference_id: PMID:8387495
    supporting_text: Approximately 50% of the expressed human fructose-1,6-bisphosphatase
      was soluble and enzymatically active
  - reference_id: Reactome:R-HSA-70479
    supporting_text: Cytosolic FBP (fructose-1,6-bisphosphatase) tetramers catalyze the physiologically
      irreversible hydrolysis of F1,6PP (fructose-1,6-bisphosphate) to form Fru(6)P (fructose-6-phosphate)
      and Pi (orthophosphate).
  - reference_id: PMID:20096900
    supporting_text: Transient transfection studies using COS-7 cells demonstrated that FBPase
      proteins with G164S or 838delT mutations were enzymatically inactive.
proposed_new_terms: []
suggested_questions:
- question: Is the nuclear, catalytic-activity-independent repression of HIF by FBP1 seen
    in ccRCC also operative in normal renal proximal tubule or hepatocytes, or only in tumour
    cells?
- question: Do FBP1-FBP2 hetero-oligomers, recurrently detected in binary interactome screens,
    form in tissues co-expressing both isozymes, and do they have distinct allosteric properties?
suggested_experiments:
- description: Chromatin immunoprecipitation and HIF reporter assays for FBP1 in primary human
    renal tubular epithelial cells under hypoxia, comparing wild-type and catalytically dead
    (e.g. G260R) FBP1, to test whether HIF repression is a physiological function outside
    cancer.
- description: Thermal-shift and pharmacological-chaperone screening of misfolding-class FBP1
    deficiency variants to test whether residual activity can be rescued.
