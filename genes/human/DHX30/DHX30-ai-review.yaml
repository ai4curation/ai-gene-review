id: Q7L2E3
gene_symbol: DHX30
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: DHX30 is an ATP-dependent RNA helicase with cytosolic and mitochondrial populations. It binds RNA and supports mitochondrial large ribosomal subunit assembly in association with mitochondrial RNA granules and nucleoids. Its endogenous RNA substrates and the remodeling step used during assembly remain unresolved. Pathogenic variants can impair RNA-dependent ATP hydrolysis or RNA unwinding, alter stress-granule behavior and disrupt neurodevelopment.
alternative_products:
- name: '1'
  id: Q7L2E3-1
  description: Canonical 1194-residue product, with the N-terminal DRBM region and the ATP-dependent helicase domains.
- name: '2'
  id: Q7L2E3-2
  sequence_note: VSP_022118
  description: 1222-residue product with a 69-residue N-terminal sequence replacing canonical residues 1–41 (VSP_022118); the downstream sequence is retained.
- name: '3'
  id: Q7L2E3-3
  sequence_note: VSP_036891, VSP_036892
  description: 1155-residue product lacking canonical residues 1–39 and replacing canonical residues 40–41 (SR) with MA (VSP_036891 and VSP_036892).
