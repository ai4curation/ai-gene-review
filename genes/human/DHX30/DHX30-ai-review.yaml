core_functions:
- description: DHX30 uses ATP to unwind RNA and has cytosolic and mitochondrial populations. Its mitochondrial RNA-granule-associated activity supports large ribosomal subunit assembly. RNA binding and ATP hydrolysis are components of this helicase mechanism. The specific endogenous RNA substrates and the molecular remodeling step during assembly remain unresolved.
  molecular_function:
    id: GO:0003724
    label: RNA helicase activity
  locations:
  - id: GO:0005739
    label: mitochondrion
  - id: GO:0005829
    label: cytosol
  directly_involved_in:
  - id: GO:1902775
    label: mitochondrial large ribosomal subunit assembly
  supported_by:
  - reference_id: PMID:34020708
    supporting_text: DHX30 indeed possesses the ATP-dependent RNA helicase activity
  - reference_id: PMID:25683715
    supporting_text: both helicases and FASTKD2 are required for mitochondrial ribosome biogenesis
  - reference_id: GO_REF:0000052
  knowledge_gaps:
  - gap_statement: The native RNA substrates and the helicase step performed during mitochondrial large-subunit assembly are unresolved.
    boundary: Direct purified-protein unwinding uses a synthetic RNA substrate; mitochondrial RNA immunoprecipitation did not establish a specific 16S-rRNA target for DHX30. Cytosolic and mitochondrial functions must not be assigned indiscriminately to all three natural products.
    resolution: Resolve endogenous, product-specific RNA contacts and test substrate remodeling during assembly in human cells.
    provenance:
    - reference_id: PMID:34020708
    - reference_id: PMID:25683715
suggested_questions:
- question: Which endogenous RNAs are remodeled by DHX30 during mitochondrial large-subunit assembly, and which remodeling step directly requires its ATP-dependent helicase activity?
- question: How do the three current natural sequence products partition between cytosol, mitochondria and nucleoid-associated RNA granules, and which historical transcript constructs correspond exactly to them?
- question: Do human DHX30 DNA-helicase and G-quadruplex-binding activities have physiological substrates distinct from its RNA-remodeling role?
- question: What target-level evidence in the supplementary poly(I:C)-capture list supports the DHX30 dsRNA-binding assignment?
- question: Which RNA-remodeling, structural or cofactor step does wild-type DHX30 perform during stress-granule formation, as distinct from its recruitment or indirect effects on translation and stress signaling?
suggested_experiments:
- description: Map endogenous product-specific RNA contacts together with mitochondrial large-subunit assembly intermediates, using selective depletion and rescue with sequence-verified wild-type and catalytic-defective products.
- description: Compare purified sequence-verified human products on matched RNA, DNA and G-quadruplex substrates, then test the identified contacts in intact cells without assuming that in-vitro substrate activity defines a physiological process.
- description: Rescue DHX30-depleted cells with matched, sequence-verified wild-type and catalytic or RNA-binding mutants while measuring translation, stress signaling and granule nucleation separately. Combine these measurements with defined RNA/protein assembly assays to identify any DHX30-performed step rather than infer it from granule counts alone.
status: DRAFT
