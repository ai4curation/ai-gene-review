sources:
- reference_id: PMID:16825194
  title: Human mitochondrial DNA nucleoids are linked to protein folding machinery and metabolic enzymes at the mitochondrial inner membrane.
  doi: 10.1074/jbc.M604501200
  url: https://doi.org/10.1074/jbc.M604501200
  cached_full_text_available: false
  assessment: Verified complete abstract only; full original not recovered. No exact product/construct mapping inferred.
  biological_finding: DHX30 peptides and antibody localization support a mitochondrial population associated with nucleoids.
- reference_id: PMID:17932509
  title: Proteomic and functional analysis of Argonaute-containing mRNA-protein complexes in human cells.
  doi: 10.1038/sj.embor.7401088
  url: https://pmc.ncbi.nlm.nih.gov/articles/PMC2247381/
  cached_full_text_available: false
  assessment: Identifier and cached abstract verified; independently accessed full PMC original, selected Table 1/Results Figure 3 and co-IP Methods read. Cache remains abstract-only.
  biological_finding: DHX30 associates with AGO1/AGO2-containing mRNPs in an RNA-sensitive manner.
- reference_id: PMID:18063578
  title: The layered structure of human mitochondrial DNA nucleoids.
  doi: 10.1074/jbc.M708444200
  url: https://doi.org/10.1074/jbc.M708444200
  cached_full_text_available: false
  assessment: Verified abstract plus independently accessed author-uploaded original Table 1 p3669, Methods and selected Results/Discussion. No direct nuclear-chromatin binding established.
  biological_finding: DHX30 is present in native and crosslinked mitochondrial nucleoid preparations, with target gradient-immunoblot corroboration.
- reference_id: PMID:21266579
  title: Raftlin is involved in the nucleocapture complex to induce poly(I:C)-mediated TLR3 activation.
  doi: 10.1074/jbc.M110.185793
  url: https://pmc.ncbi.nlm.nih.gov/articles/PMC3060521/
  cached_full_text_available: true
  assessment: Original main Methods/Results inspected; target-specific supplementary Table S2 remains unavailable. This source-specific gap is retained, while independent target-domain and full-length duplex-unwinding evidence supports non-core gene-level dsRNA binding.
  biological_finding: Sequential poly(U)/poly(I:C) affinity purification identifies a preferential dsRNA-associated proteome.
- reference_id: PMID:21903422
  title: Mapping a dynamic innate immunity protein interaction network regulating type I interferon production.
  doi: 10.1016/j.immuni.2011.06.014
  url: https://pmc.ncbi.nlm.nih.gov/articles/PMC3253658/
  cached_full_text_available: true
  assessment: Original human-cell AP-MS/validation Methods read; exact target-partner/source records independently reconstructed, including positive tagged co-IP. No purified interface or target signaling function inferred.
  biological_finding: DHX30 is associated with PKR, DHX58 and OAS3 in the curated interaction experiments.
- reference_id: PMID:22658674
  title: Insights into RNA biology from an atlas of mammalian mRNA-binding proteins.
  doi: 10.1016/j.cell.2012.04.031
  url: https://doi.org/10.1016/j.cell.2012.04.031
  cached_full_text_available: false
  assessment: Complete verified abstract; target supplementary table not independently recovered. Target RNA binding also has independent human experimental support.
  biological_finding: UV-crosslinked human mRNA-interactome capture supports the RNA-binding assignment.
- reference_id: PMID:22681889
  title: The mRNA-bound proteome and its global occupancy profile on protein-coding transcripts.
  doi: 10.1016/j.molcel.2012.05.021
  url: https://doi.org/10.1016/j.molcel.2012.05.021
  cached_full_text_available: false
  assessment: Complete verified abstract; full target-level table not independently read. Target assignment retained with curator deference and independent corroboration.
  biological_finding: Human mRNA-proteome capture supports RNA association without identifying a poly(A)-tail contact.
- reference_id: PMID:23275553
  title: Alternative translation initiation augments the human mitochondrial proteome.
  doi: 10.1093/nar/gks1347
  url: https://pmc.ncbi.nlm.nih.gov/articles/PMC3575844/
  cached_full_text_available: true
  assessment: Original Methods, Results and Figure 3 inspected. Figure 2C matrix fractionation is PABPC5, not DHX30; matrix curation is retained with that explicit distinction.
  biological_finding: DHX30 occurs in mitochondrial nucleic-acid-associated fractions and decreases after nucleic-acid depletion.
- reference_id: PMID:23455922
  title: Interlaboratory reproducibility of large-scale human protein-complex analysis by standardized AP-MS.
  doi: 10.1038/nmeth.2400
  url: https://doi.org/10.1038/nmeth.2400
  cached_full_text_available: false
  assessment: Complete verified abstract and exact positive IntAct target-pair record read; full target-level original controls unavailable. Association is not kinase activation.
  biological_finding: Kinase-complex capture supports DHX30 association with PKR.
- reference_id: PMID:25683715
  title: Mitochondrial RNA Granules Are Centers for Posttranscriptional RNA Processing and Ribosome Biogenesis.
  doi: 10.1016/j.celrep.2015.01.030
  url: https://doi.org/10.1016/j.celrep.2015.01.030
  cached_full_text_available: false
  assessment: Verified abstract plus independently accessed author-posted full original selected Methods/Results. RNA-IP was distributed across the mitochondrial transcriptome; no DHX30-specific 16S substrate or stable structural mtLSU membership established.
  biological_finding: DHX30 is associated with mitochondrial RNA granules and contributes to large ribosomal subunit assembly.
- reference_id: PMID:29100085
  title: De Novo Missense Mutations in DHX30 Impair Global Translation and Cause a Neurodevelopmental Disorder.
  doi: 10.1016/j.ajhg.2017.09.014
  url: https://pmc.ncbi.nlm.nih.gov/articles/PMC5673606/
  cached_full_text_available: true
  assessment: Full original selected Methods/Results read. This paper did not directly assay duplex unwinding; later PMID:34020708 does. Correction PMID:29304375 concerns an author surname only. Original publisher supplement page 15, Figure S5A/B caption and pixels, independently inspected.
  biological_finding: Human DHX30 exhibits RNA-dependent ATP hydrolysis and RNA association; disease variants perturb these functions and localization. Endogenous protein partially accumulates in ATXN2/DDX3X-positive stress granules after heat stress, distinct from mutant-driven foci.
- reference_id: PMID:30021884
  title: Histone Interaction Landscapes Visualized by Crosslinking Mass Spectrometry in Intact Cell Nuclei.
  doi: 10.1074/mcp.RA118.000924
  url: https://pmc.ncbi.nlm.nih.gov/articles/PMC6166682/
  cached_full_text_available: true
  assessment: Original nuclear-preparation/DSSO Methods and artifact discussion inspected; target pair separately verified in the literal curated record. Not evidence of a defined chromatin-regulatory mechanism.
  biological_finding: Nuclear crosslinking identifies physical proximity between DHX30 and linker histone H1-5.
- reference_id: PMID:32707033
  title: Kinase Interaction Network Expands Functional and Disease Roles of Human Kinases.
  doi: 10.1016/j.molcel.2020.07.001
  url: https://pmc.ncbi.nlm.nih.gov/articles/PMC7427327/
  cached_full_text_available: true
  assessment: Full cached original selected inducible-expression/AP-MS/control Methods read and exact source-pair record reconstructed.
  biological_finding: A human kinase interactome independently associates DHX30 with PKR.
- reference_id: PMID:33961781
  title: Dual proteome-scale networks reveal cell-specific remodeling of the human interactome.
  doi: 10.1016/j.cell.2021.04.011
  url: https://pmc.ncbi.nlm.nih.gov/articles/PMC8165030/
  cached_full_text_available: true
  assessment: Original FLAG-HA/ORFeome Methods and gene-level aggregation read; literal HEK293T pair verified. Natural DHX30 isoform identity is not inferred.
  biological_finding: Human affinity purification associates DHX30 with H1-5.
- reference_id: PMID:34800366
  title: Quantitative high-confidence human mitochondrial proteome and its dynamics in cellular context.
  doi: 10.1016/j.cmet.2021.11.001
  url: https://pmc.ncbi.nlm.nih.gov/articles/PMC8664129/
  cached_full_text_available: true
  assessment: Actual Table S1 A306/A307 and B279 read with raw identifiers and header semantics; selected original carbonate-extraction/sonication Methods inspected. Mixed canonical/isoform3 group differs from isoform2 group; compiled matrix annotations are not new experimental fractionation.
  biological_finding: DHX30 contains a mitochondrial-enriched protein group with peripheral membrane association.
- reference_id: PMID:35156780
  title: CFTR interactome mapping using the mammalian membrane two-hybrid high-throughput screening system.
  doi: 10.15252/msb.202110629
  url: https://pmc.ncbi.nlm.nih.gov/articles/PMC8842165/
  cached_full_text_available: true
  assessment: Full cached original selected constructs, controls and screening Methods read; exact pair reconstructed. No native channel regulation or universal product colocalization inferred.
  biological_finding: Mammalian split-ubiquitin screening supports the DHX30-CFTR pair.
- reference_id: PMID:36012204
  title: Differential CFTR-Interactome Proximity Labeling Procedures Identify Enrichment in Multiple SLC Transporters.
  doi: 10.3390/ijms23168937
  url: https://pmc.ncbi.nlm.nih.gov/articles/PMC9408702/
  cached_full_text_available: true
  assessment: Full cached original selected BioID/APEX/TurboID Methods read; exact source records distinguish proximity from binary binding. Independent MaMTH corroboration is kept separate.
  biological_finding: Tagged CFTR proximity labeling detects nearby DHX30-associated material.
- reference_id: PMID:34020708
  title: Genotype-phenotype correlations and novel molecular insights into the DHX30-associated neurodevelopmental disorders.
  doi: 10.1186/s13073-021-00900-3
  url: https://pmc.ncbi.nlm.nih.gov/articles/PMC8140440/
  cached_full_text_available: true
  assessment: Genuine full PMC original and publisher Supplementary Methods read; full-length bacterial His6-SUMO preparation, native PAGE and ATP/heat controls. Exact current-isoform endpoints unestablished.
  biological_finding: Purified full-length human DHX30 directly unwinds an RNA duplex in an ATP-dependent assay. Human HEK293T depletion and zebrafish knockout reduce stress-granule formation in the tested assays, without resolving the performed molecular assembly step.
- reference_id: PMID:29304375
  title: De Novo Missense Mutations in DHX30 Impair Global Translation and Cause a Neurodevelopmental Disorder.
  doi: 10.1016/j.ajhg.2017.12.016
  url: https://pmc.ncbi.nlm.nih.gov/articles/PMC5777981/
  cached_full_text_available: false
  assessment: Complete genuine correction inspected; no scientific correction or withdrawal.
  biological_finding: The notice corrects an author surname and does not change the reported DHX30 experiments.
- reference_id: PMID:25219788
  title: The novel helicase helG (DHX30) is expressed during gastrulation in mice and has a structure similar to a human DExH box helicase.
  doi: 10.1089/scd.2014.0077
  url: https://doi.org/10.1089/scd.2014.0077
  cached_full_text_available: false
  assessment: Complete verified abstract only; original assay details remain inaccessible. No human DNA substrate or current natural-product equivalence is inferred.
  biological_finding: Mouse DHX30/HelG supports neural development and the reported purified protein untwists DNA.
