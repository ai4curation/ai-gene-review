scope: All43 imported source identities are retained. Partner-class refinements describe supported physical partner classes, not activation, physiological regulation or target catalysis. RNA-dependent AGO and CFTR proximity observations remain conservative non-core associations under the scoped project instruction.
followup_evidence:
  double_stranded_RNA_binding:
    row: 10
    decision: KEEP_AS_NON_CORE
    domain_record: https://www.ebi.ac.uk/interpro/entry/InterPro/IPR056755/
    target_membership: https://www.ebi.ac.uk/interpro/protein/uniprot/Q7L2E3/
    Pfam: https://www.ebi.ac.uk/interpro/entry/pfam/PF24995/
    domain_scope: Current target match 48–123; UniProt DRBM feature 53–121. Domain membership is combined with direct duplex unwinding, not used as an isolated automatic functional verdict.
    structure: https://www.rcsb.org/structure/2DB2
    structure_scope: Protein-only solution NMR construct contains native residues 42–148 plus 12 terminal tag residues. No RNA polymer entity, bound-RNA contacts or binding affinity is established by this deposition.
    direct_assay: 'PMID:34020708 Figure 2c and Supplementary Methods, RNA duplex synthesis and RNA unwinding assay: purified full-length human His6-SUMO DHX30, radiolabeled RNA duplex, ATP and native-PAGE separation.'
    source_limit: PMID:21266579 supplementary target table remains unrecovered.
  stress_granule_localization:
    row: 25
    replacements:
    - GO:0005829
    - GO:0010494
    original: https://doi.org/10.1016/j.ajhg.2017.09.014
    supplement: https://ars.els-cdn.com/content/image/1-s2.0-S000292971730383X-mmc1.pdf
    locator: Supplement page 15, Figure S5B; main Results localization paragraph and Cell Culture, Transfection, and Immunocytochemistry Methods.
    observed: Human U2OS endogenous DHX30 partially redistributes into ATXN2- and DDX3X-positive granules after stress; unstressed and stressed panels were inspected.
    scope: Diffuse cytosol and stress-induced granules are distinct nonexclusive pools. No FMRP-specific granule identity is claimed. Current typed ancestry places both under cytoplasm but does not place stress granule under cytosol.
  stress_granule_assembly_adjudication:
    proposed_term: GO:0034063
    decision: No NEW process assertion
    positive_evidence: 'PMID:34020708 Figures 7/8 and corresponding heat-stress Methods/Results: reduced ATXN2-positive granules after DHX30 depletion in HEK293T cells and reduced TIAL1-positive foci in zebrafish dhx30-null embryos. PMID:29100085 also distinguishes endogenous recruitment from mutant-driven granule formation.'
    remaining_inference: Recruitment plus depletion dependence does not identify a DHX30-performed remodeling, structural or cofactor step; translation or stress-response effects remain possible. This is not a denial of granule biology.
    comparators: Current QuickGO queries for GO:0034063 return DDX3X IDA PMID:21883093 and DDX6 IBA, but no DHX36 or DHX30 result. This is not a universal exclusion convention or target-specific proof.
    GO_CAM: No DHX30/Q7L2E3 match in the inspected frozen local index.
    redundancy: 'No NEW component row: the existing PMID:29100085 cytoplasm assertion is refined to its supported diffuse and granule pools.'
  phylogeny_specificity:
    broad_node: PANTHER:PTN001053965
    broad_assertions:
    - GO:0002151
    - GO:0003678
    target_path: The Eumetazoa node lies on the human DHX30 path before the Bilateria duplication. Experimental descendant grounding includes DHX36; donor identity does not by itself invalidate that placement.
    narrow_sibling_node: PANTHER:PTN000433435
    narrow_assertion: GO:0051880
    scope: The narrower G-quadruplex DNA-binding IBD is outside the DHX30 path. No target-specific loss is inferred.
  CFTR_binding_adjudication:
    row20: Retain GO:0044325 refinement from the positive PMID:35156780 human MaMTH pair (EBI-40214855 / IM-29676-415).
    pair: https://www.ebi.ac.uk/intact/interaction/EBI-40214855
    methods: 'Original MaMTH-HTS screening and frequent-flier sections: tagged ORFs in HEK293 reporter cells, two technical sequencing replicates and nine control baits.'
    limits: Screen-level physical association does not establish native affinity or CFTR regulation. Separate PMID:36012204 BioID records remain proximity evidence and do not supply binary contact.
