  evidence_type: IPI
  original_reference_id: PMID:25036637
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q16543
  review:
    summary: The CDC37 association is supported; the narrower folding-chaperone binding class remains
      unresolved.
    action: KEEP_AS_NON_CORE
    reason: The literal PMID:25036637 DDR2–Q16543 LUMIER record documents a tagged-protein association
      in human HEK293T cells. CDC37 recognizes kinase clients and promotes their recruitment to HSP90,
      with resulting stabilization. The original study distinguishes co-chaperone recognition of flexible,
      partly recognizable domains from HSP70 recognition of unfolded polypeptides. The inspected evidence
      therefore supports this positive CDC37 association, but leaves unresolved whether CDC37 itself meets
      the complete nascent/unfolded-polypeptide folding-chaperone definition required by GO:0051087. Retain
      the generic interaction as non-core under the project policy for supported interactions without
      a justified narrower class. This does not imply DDR2 chaperone activity, activation of either partner,
      or a false interaction.
