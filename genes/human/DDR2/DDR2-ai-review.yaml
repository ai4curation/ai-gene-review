core_functions:
- description: Recognizes extracellular triple-helical collagen through its discoidin domain and couples
    collagen recognition to intracellular tyrosine kinase signaling. Src-dependent activation-loop phosphorylation
    and DDR2-performed autophosphorylation are distinct steps in this receptor mechanism.
  molecular_function:
    id: GO:0038062
    label: protein tyrosine kinase collagen receptor activity
  locations:
  - id: GO:0005886
    label: plasma membrane
  directly_involved_in:
  - id: GO:0038063
    label: collagen-activated tyrosine kinase receptor signaling pathway
  supported_by:
  - reference_id: PMID:20004161
    supporting_text: full-length DDR2 W52A expressed in 293 cells could not be activated by collagen
  - reference_id: PMID:9659899
  - reference_id: PMID:16186108
suggested_questions:
- question: Does endogenous human DDR2 occupy focal adhesions as a stable signaling component or as associated
    membrane material, and how does this depend on collagen and cell type?
- question: Which native human cell contexts support the rat-derived apical localization, stress-response
    and PI3K/Akt assertions, and which are tissue-restricted?
- question: Can the original smooth-muscle proliferation experiment underlying the rat donor annotation
    from PMID:16087782 be recovered and compared with the separately established fibroblast response?
- question: Does CDC37 itself meet the nascent/unfolded-polypeptide folding-chaperone definition of GO:0051087,
    or is a separate co-chaperone-binding class needed for the established DDR2–CDC37 association?
- question: Can the MINT 2.5 micromolar annotation for PMID:17703188 be reconciled with the original monomeric
    DDR2-domain SPR value of 2.5 × 10^-5 M (25 micromolar), while preserving the human-domain/bovine-collagen-II
    assay scope?
suggested_experiments:
- description: Compare endogenous DDR2 localization and collagen-triggered phosphorylation in matched
    human mesenchymal cell types using knockout-controlled imaging and biochemical fractionation; distinguish
    cell-surface, focal-adhesion-associated and internal receptor pools.
status: DRAFT
