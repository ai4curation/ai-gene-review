  review:
    summary: The NTRK3 association supports receptor tyrosine kinase binding.
    action: MODIFY
    reason: The PMID:35384245 literal DDR2–NTRK3 Q16288 pair has an AP-MS record and a separate anti-tag
      co-immunoprecipitation record (Figure EV1E, lane 18). The study used C-terminally MAC-tagged RTKs
      in HEK293-derived cells, with pervanadate treatment for the AP-MS screen; the separate RTK–RTK validation
      co-expressed MAC- and V5-tagged constructs in HEK293 cells. NTRK3 curated FUNCTION and kinase-family
      evidence establish that the partner is a receptor tyrosine kinase, satisfying the binding-partner
      class of GO:0030971. Tagged cellular co-complex capture does not establish a purified direct interface,
      native tissue colocalization, ligand-triggered DDR2–NTRK3 cross-talk, or activation of either receptor
      by the other. These limits qualify the positive association without negating the supported binding-class
      refinement.
    proposed_replacement_terms:
