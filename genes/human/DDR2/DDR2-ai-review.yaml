  review:
    summary: DDR2 signaling contributes to endochondral growth in the mouse ortholog.
    action: KEEP_AS_NON_CORE
    reason: The exact mouse Q62371 donor annotation traces to PMID:11375938. Ddr2-null mice have shortened
