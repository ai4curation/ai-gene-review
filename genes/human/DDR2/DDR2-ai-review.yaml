id: Q16832
gene_symbol: DDR2
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: DDR2 is a single-pass cell-surface receptor tyrosine kinase that recognizes triple-helical
  collagen through an extracellular discoidin domain. Its cytoplasmic kinase converts collagen recognition
  into tyrosine phosphorylation and downstream signaling that regulates cellular responses to the extracellular
  matrix, including matrix remodeling and mesenchymal cell behavior. DDR2 signaling contributes to skeletal
  growth and tissue remodeling; inherited loss-of-function and activating variants produce distinct skeletal
  and connective-tissue disorders.
