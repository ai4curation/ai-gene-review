core_synthesis:
  molecular_function: GO:0038062
  process: GO:0038063
  location: GO:0005886
  interpretation: One collagen-receptor signaling unit integrates ligand recognition and kinase chemistry.
    ATP and collagen binding are components; developmental and survival outputs are contextual. Src activation-loop
    phosphorylation is distinguished from receptor autophosphorylation.
  new_annotation_scope: No NEW SRC- or SHC1-binding annotation is added merely to enumerate pathway partners.
    Their recruitment/activation context is already represented in the collagen-receptor mechanism; the
    present review does not claim a new missing physiological function from pathway membership.
