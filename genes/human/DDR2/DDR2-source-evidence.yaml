      MINT interaction records. The experiment uses human DDR2 DS 26–186 and bovine collagen II; the imported
      human COL11A2 identifier is preserved as source metadata, not treated as the assayed ligand. The
      original SPR Results report 2.5 × 10^-5 M (25 micromolar) for the monomeric domain, whereas the
      MINT record says 2.5 micromolar. The original value is retained; the curated numerical discrepancy
      is unresolved and does not negate collagen binding.
