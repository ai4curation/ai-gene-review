unresolved_questions:
- row: 25
  reason: The accessible 1997 abstract demonstrates collagen binding and kinase activation, but does not
    describe a mammalian cell-adhesion assay. Its statement about aggregation concerns the Dictyostelium
    discoidin family background. Full original Methods/Results could not be recovered, so this TAS annotation
    is not rejected on abstract-only evidence. A role in attaching cells to matrix should be distinguished
    from sensing collagen and regulating downstream adhesion.
- row: 70
  reason: The exact B1WC09 donor IMP annotation points to PMID:16087782. The accessible abstract directly
    establishes stretch-dependent DDR2 expression in rat vascular smooth-muscle cells, but does not describe
    the proliferation experiment. Publisher full-text access failed. Other cell types provide proliferation
    evidence, but that does not recover this source-specific vascular assay; retain uncertainty rather
    than alleging a wrong annotation or transferring fibroblast results into it.
- row: 47
  reason: The exact rat B1WC09 donor is an IEP annotation from PMID:16087782. Its complete abstract reports
    increased DDR2 mRNA and protein after cyclic stretch of rat vascular smooth-muscle cells, with angiotensin/TGF-beta/p38/Myc-dependent
    induction. The GO definition includes changes in gene expression, and GO guidance permits response-to-stimulus
    IEP annotations in appropriate contexts; this positive rat observation is not a curator error merely
    because it concerns expression. The previous non-core retention is revised because the detailed original
    experiments and the biological basis for transferring this context-dependent response to human DDR2
    could not be verified. Full original Methods/Results remain inaccessible, so neither additional participation
    assays nor their absence can be established. Retain the rat observation while leaving the human inference
    undecided; lack of a direct human assay alone is not evidence of false orthology or functional loss.
- row: 63
  reason: The exact rat B1WC09 donor is an IEP annotation from PMID:16087782. Its complete abstract reports
    DDR2 induction after exogenous TGF-beta1 and inhibition of stretch-induced expression by a TGF-beta1
    antibody. The GO definition includes changes in gene expression, and GO guidance permits response-to-stimulus
    IEP annotations in appropriate contexts. The previous non-core retention is revised because the detailed
    original experiments and the basis for transferring this context-dependent response to human DDR2
    could not be verified. Full original Methods/Results remain inaccessible; the abstract does not establish
    whether further participation experiments were performed. Preserve the positive rat expression response
    without treating it as proof of a conserved human response, DDR2 TGF-beta-receptor activity, or a
    demonstrated annotation error.
