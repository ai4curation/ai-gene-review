- id: GO:0043296
  name: apical junction complex
  definition:
    text: A functional unit located near the cell apex at the points of contact between epithelial cells, which
      in vertebrates is composed of the tight junction, the zonula adherens, and desmosomes and in some invertebrates,
      such as Drosophila, is composed of the subapical complex (SAC), the zonula adherens and the septate junction.
      Functions in the regulation of cell polarity, tissue integrity and intercellular adhesion and permeability.
    xrefs:
    - dbCode: PMID
      dbId: '12525486'
    - dbCode: PMID
