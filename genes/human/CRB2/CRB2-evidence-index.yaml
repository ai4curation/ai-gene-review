    judgment: Mouse Crb2 deletion in the developing retina disrupts adherens junctions and the orientation of newly
      born photoreceptors; ectopic photoreceptors fail to form normal segments and can be immature, nonpolarized
      or misoriented (PMID:23001562, developmental Results). These findings support the formation component of epithelial
      apicobasal polarity in the existing mouse establishment assertion. Refine to GO:0045198 at that developmental
      inference scope. The study also reports maintenance defects and does not isolate a direct molecular initiation
      step. Human RPE PMID:34262913 independently supports maintenance and recovery, not de novo establishment,
      and is not used to establish this replacement. Repeated terms from distinct source assertions are allowed;
      avoiding duplicate coverage is not the justification for this refinement.
  predicted_secreted_class:
    id: CRB2_PREDICTED_SECRETED
    name: Predicted secreted splice product
    type: SPLICE_VARIANT
    maps_to:
    - type: UNIPROT_ISOFORM
      ids:
      - Q5IJ48-2
    description: Official isoform 2 is predicted secreted. It replaces canonical residues 1131–1176 and lacks residues
      1177–1285, including the canonical transmembrane helix and cytoplasmic interaction motifs. This class scopes
      the UniProt SL-0243 extracellular prediction; it does not claim a product-specific secretion assay or an established
      extracellular molecular activity. The annotation source does not specify an isoform, and its original source
      fields are retained.
    isoform_specific_terms:
    - id: GO:0005576
      label: extracellular region
  core_evidence_distinction: Membrane-associated CRB2 supplies a C-terminal PDZ-binding motif and a separate FERM-interaction
    region to the epithelial polarity system, supporting apical junction organization and maintenance. Direct human
    RPE depletion particularly impairs maintenance and recovery after junction disruption; developmental mouse retinal
    evidence adds tissue-organization context. Direct PDZ specificity is measured for the CRB2 1276–1285 peptide
    against isolated PDZ domains in PMID:36115835; the literal partner constructs are retained in the evidence index.
    PMID:38570189 separately detects MPP5 in the human CRB2–porcine retinal pull-down network and supplies target-specific
    complex context, not a direct PDZ-contact test. Neither result implies that every peptide-screen partner forms
    the same native complex. The FERM interaction is separately retained as domain-specific binding; the gamma-secretase-associated
    inhibitory pool is a positive contextual function outside this principal polarity unit. The predicted secreted
    second product lacks the canonical tail, and equivalent activity of product 3 is untested.
  literal_multiplicity: '76 literal GOA records become 74 source identities: GO0016324 ISS differs by date; GO0010718
    ISS retains UniProt2017-03-07 and CAFA2013-10-07 assignments. The raw GOA file is authoritative; the seeded
    source fields are unchanged.'
  finite_check_contract: Independent checks compare original source objects, every prior index value, product identities,
    source caches, new term responses, quote substrings/totals and notes-prefix preservation. No global schema is
    asserted.
