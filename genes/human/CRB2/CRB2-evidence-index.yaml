- id: GO:0072359
  name: circulatory system development
  definition:
    text: The process whose specific outcome is the progression of the circulatory system over time, from its formation
      to the mature structure. The circulatory system is the organ system that passes nutrients (such as amino acids
      and electrolytes), gases, hormones, blood cells, etc. to and from cells in the body to help fight diseases
      and help stabilize body temperature and pH to maintain homeostasis.
