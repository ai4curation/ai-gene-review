- term:
    id: GO:0030513
    label: positive regulation of BMP signaling pathway
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q80YA8
  - ensembl:ENSMUSP00000058007
  review:
    summary: The mouse source supports an indirect, contextual positive influence on BMP signaling.
    action: KEEP_AS_NON_CORE
    reason: The exact Q80YA8 IMP source is PMID:22072575. Original Results show reduced embryonic
      Bmp4 expression from E7 to E7.75, with Bmp4 retained in amnion/allantois and Brachyury/Fgf8
      expression unchanged; gross morphological abnormalities become apparent later in this interval.
      This stage- and region-selective response supports the existing indirect positive-regulation
      inference. It does not directly measure downstream BMP output or resolve how CRB2 affects Bmp4
      expression, and altered cell composition remains a possible contributor. Retain the ortholog-derived
      signaling context as non-core without requiring an autonomous CRB2 signaling reaction, asserting
      a pSMAD assay, or claiming a universal direct CRB2-to-BMP4 mechanism.
    additional_reference_ids:
    - PMID:22072575
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
      - source_id: UniProtKB:Q80YA8
        source_status: SUPPORTS_TRANSFER
        comment: Mouse Crb2 IMP source 22072575 has stage/region-selective Bmp4-expression changes
          with retained comparison markers. Indirect regulation is defensible; downstream output,
          mechanism and cell-composition contribution are unresolved.
