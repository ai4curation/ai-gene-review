core_functions:
- description: Membrane-associated CRB2 supplies a C-terminal PDZ-binding motif and a separate FERM-interaction
    region to the epithelial polarity system, supporting apical junction organization and maintenance.
    Direct human RPE depletion particularly impairs maintenance and recovery after junction disruption;
    developmental mouse retinal evidence adds tissue-organization context. Direct PDZ specificity
    is measured for the CRB2 1276–1285 peptide against isolated PDZ domains in PMID:36115835; the
    literal partner constructs are retained in the evidence index. PMID:38570189 separately detects
    MPP5 in the human CRB2–porcine retinal pull-down network and supplies target-specific complex
    context, not a direct PDZ-contact test. Neither result implies that every peptide-screen partner
    forms the same native complex. The FERM interaction is separately retained as domain-specific
    binding; the gamma-secretase-associated inhibitory pool is a positive contextual function outside
    this principal polarity unit. The predicted secreted second product lacks the canonical tail,
    and equivalent activity of product 3 is untested.
  molecular_function:
    id: GO:0030165
    label: PDZ domain binding
  directly_involved_in:
  - id: GO:0045197
    label: establishment or maintenance of epithelial cell apical/basal polarity
  locations:
  - id: GO:0016324
    label: apical plasma membrane
  - id: GO:0043296
    label: apical junction complex
  supported_by:
  - reference_id: PMID:38570189
    supporting_text: CRB2 retinal protein–protein interaction network included CRB1 and the core
      CRB complex members MPP5 and EPB41L5
  - reference_id: PMID:34262913
    supporting_text: CRB2 knockdown affects the reestablishment of tight junctions at the plasma
      membrane after Ca2+ depletion.
  - reference_id: PMID:26404741
    supporting_text: apicolateral membrane
suggested_questions:
- question: Which CRB2 PDZ/FERM contacts are required for junction recovery in human RPE, and how
    are they coordinated with actomyosin remodeling? Would a specific FERM-domain binding term better
    represent the experimentally supported EPB41L5 interaction than the current domain-specific binding
    term?
- question: Does the predicted secreted second product have a distinct extracellular role, and does
    product 3 preserve the polarity and gamma-secretase effects of the displayed membrane product?
- question: Which gamma-secretase component directly contacts CRB2, and how much of the endogenous
    human complex pool contains it?
suggested_experiments:
- description: Combine endogenous CRB2 depletion with matched-expression rescue by the displayed
    product, PDZ-motif/FERM-region mutants and official alternative products in polarized human RPE.
    Measure junction localization, ultrastructure and calcium-switch recovery separately from total
    barrier resistance.
- description: Resolve CRB2-containing gamma-secretase assemblies with endogenous crosslinking or
    structural approaches and calibrated stoichiometry, retaining native-cell and purified membrane-assay
    distinctions.
