id: Q5IJ48
gene_symbol: CRB2
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CRB2 is a Crumbs-family cell-surface protein with a large extracellular EGF-repeat and
  laminin-G-domain region and a short cytoplasmic tail. Its terminal PDZ-binding motif and separate
  FERM-binding region connect it to epithelial polarity proteins. Membrane-associated CRB2 supports
  apical junction organization, maintenance and recovery, with prominent retinal and renal epithelial
  roles. In vertebrate models, Crb2 also coordinates epithelial cell behavior during gastrulation
  and supports photoreceptor organization and survival. A separate transmembrane-dependent interaction
  modulates gamma-secretase activity in human cell systems. Alternative products differ substantially
  in their extracellular regions and retention of the membrane anchor and cytoplasmic binding motifs.
alternative_products:
- name: '1'
  id: Q5IJ48-1
  description: The displayed 1285-residue precursor retains the transmembrane helix and terminal
    PDZ/FERM interaction regions. Sequence architecture and gene-level membrane/polarity evidence
    are consistent; study-specific engineered truncations and tags are not independent official isoforms.
- name: '2'
  id: Q5IJ48-2
  sequence_note: VSP_014739, VSP_014740
  description: The 1176-residue product replaces the canonical sequence at 1131–1176 and lacks 1177–1285,
    removing the canonical membrane helix and cytoplasmic tail. UniProt predicts a secreted product.
    Its secretion and physiological function are not directly established by the membrane-product
    assays, and tail-mediated binding must not be transferred automatically.
- name: '3'
  id: Q5IJ48-3
  sequence_note: VSP_014737, VSP_014738
  description: The 953-residue product lacks the canonical first 332 residues and replaces 333–351,
    while retaining the downstream membrane helix and cytoplasmic tail. Its sequence is independently
    reconstructed from the official edits; retention of the tail does not establish experimental
    equivalence or a distinct physiological role.
existing_annotations:
- term:
    id: GO:0001707
    label: mesoderm formation
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q80YA8
  - ensembl:ENSMUSP00000058007
  review:
    summary: CRB2 supports mesoderm formation during gastrulation.
    action: KEEP_AS_NON_CORE
    reason: Mouse Crb2-null embryos have deficient mesoderm, and later live imaging shows that primitive-streak
      cells initiate apical constriction but fail to complete apical detachment and ingression (PMID:22072575;
      PMID:27870829). The protein participates in epithelial junction and cell-shape organization
      during the transition, rather than being merely a mesoderm marker. Retain the existing ortholog-derived
      developmental claim outside the principal polarity core; these are mouse experiments, not direct
      human embryonic perturbations.
    additional_reference_ids:
    - PMID:22072575
    - PMID:27870829
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
      - source_id: UniProtKB:Q80YA8
        source_status: SUPPORTS_TRANSFER
        comment: Mouse Crb2 ortholog; current same-term experimental records and source-specific
          primary access are separately recorded. Human cellular corroboration does not convert mouse
          assays to human experiments.
    supported_by:
    - reference_id: PMID:22072575
      supporting_text: impaired mesoderm and endoderm formation
