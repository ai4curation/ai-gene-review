- term:
    id: GO:0001756
    label: somitogenesis
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q80YA8
  - ensembl:ENSMUSP00000058007
  review:
    summary: Somite formation depends on the Crb2-dependent gastrulation context.
    action: KEEP_AS_NON_CORE
    reason: 'The actual mouse knockout source shows absent or severely reduced somites and mesodermal
      organization (PMID:22072575). The later Poglut1 comparison independently examines Crb2-null
      embryos: Meox1-positive paraxial mesoderm is reduced and unsegmented, while a Notch target
      can remain expressed (PMID:26496195). This supports the broad developmental participation claim,
      without assigning CRB2 a segmentation-clock or Notch-enzyme function.'
    additional_reference_ids:
    - PMID:22072575
    - PMID:26496195
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
