- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:17920587
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q9HCM4
  review:
    summary: The human retinal-cDNA intracellular CRB2 construct binds EPB41L5 in the actual 17920587
      yeast/GST assays.
    action: MODIFY
    reason: The human retinal-cDNA intracellular CRB2 construct binds EPB41L5 in the actual 17920587
      yeast/GST assays. The studied partner feature is its FERM domain; the detailed GTY deletion,
      truncated-FERM and retinal pull-down controls predominantly use CRB1, so do not relabel them
      as CRB2 perturbations. Domain-specific binding is justified; a finite current search did not
      establish a FERM-specific GO term. This is not PDZ binding to EPB41L5 and does not prove a
      cytoskeletal bridge.
    proposed_replacement_terms:
    - id: GO:0019904
      label: protein domain specific binding
    additional_reference_ids:
    - PMID:17920587
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:36115835
  qualifier: enables
  supporting_entities:
  - UniProtKB:A4D2P6
  review:
    summary: CRB2 terminal-peptide binding to GRID2IP PDZ domain constructs is directly measured.
    action: MODIFY
    reason: The 2 exact positive IntAct records from PMID:36115835 pair the biotin-tagged CRB2 residues
      1276–1285 with isolated IPR001478 PDZ constructs of GRID2IP (A4D2P6) in the holdup assay. The
      directly tested domain class supports GO:0030165 rather than generic binding. All literal features,
      tags, reference-sequence checksums and record joins are retained in the evidence index. Reference
      ROGID equality does not establish a full-length experimental construct, native cellular contact,
      or transfer of the partner protein's function to CRB2. Supplementary Data 1 was not recovered;
      the raw reported numeric affinity string is preserved without interpreting its missing exponent.
    proposed_replacement_terms:
