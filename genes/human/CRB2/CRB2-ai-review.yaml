- term:
    id: GO:0001895
    label: retina homeostasis
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q80YA8
  - ensembl:ENSMUSP00000058007
  review:
    summary: CRB2 contributes to retinal tissue homeostasis.
    action: KEEP_AS_NON_CORE
    reason: 'The exact mouse donor IMP in PMID:23001562 is supported by the original developmental
      conditional-knockout experiments: retinal disorganization, photoreceptor thinning, altered
      progenitor proliferation and cell death, and progressive functional impairment. Human RPE work
      separately supports junction maintenance (PMID:34262913). Retain the inherited tissue-homeostasis
      claim as non-core, with mouse tissue evidence distinguished from human cell assays.'
    additional_reference_ids:
    - PMID:23001562
    - PMID:34262913
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
      - source_id: UniProtKB:Q80YA8
        source_status: SUPPORTS_TRANSFER
        comment: Mouse Crb2 ortholog; current same-term experimental records and source-specific
          primary access are separately recorded. Human cellular corroboration does not convert mouse
          assays to human experiments.
    supported_by:
    - reference_id: PMID:23001562
      supporting_text: 'disruption of adherens junctions between photoreceptors,

        Müller glia and progenitor cells'
