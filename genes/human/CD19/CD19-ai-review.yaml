id: P15391
gene_symbol: CD19
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CD19 is a single-pass membrane glycoprotein of B lymphocytes that organizes signaling
  at the B-cell surface. It associates with CD21/CR2 and CD81 in a co-receptor complex, and
  its phosphorylated cytoplasmic tail recruits signaling proteins, including PI3K regulatory
  subunits and GRB2. This noncatalytic adaptor function adjusts the sensitivity of antigen-receptor
  signaling and supports effective humoral immune responses. Biallelic loss of CD19 function
  can cause antibody deficiency despite the presence of mature circulating B cells.
