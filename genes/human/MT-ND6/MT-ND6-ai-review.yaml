id: P03923
gene_symbol: MT-ND6
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  MT-ND6 encodes NADH-ubiquinone oxidoreductase chain 6 (ND6), the only protein-coding gene on the mtDNA
  light strand and a core subunit of the membrane arm of respiratory Complex I. This small six-helix protein
  in the inner mitochondrial membrane forms, with ND1, ND3 and ND4L, the E-channel proton-translocation
  unit next to the quinone site. Its conserved TMH3 is alpha-helical in active enzyme but carries a pi-bulge
  in the open/deactive state, so ND6 helps couple quinone chemistry to proton pumping and controls the
  active/deactive transition. ND6 is required for Complex I activity and assembly. Pathogenic variants
  cause LHON (m.14484T>C), LHON with dystonia, Leigh syndrome and MELAS (m.14453G>A).
