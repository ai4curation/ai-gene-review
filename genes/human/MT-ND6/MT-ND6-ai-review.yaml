suggested_questions:
- question: >-
    The E-channel that translocates protons is formed jointly by ND1, ND3, ND6 and ND4L, so ND6 contributes
    to proton transmembrane transporter activity (GO:0015078) rather than enabling it alone. Its core function
    already uses the single contributes_to_molecular_function slot for NADH dehydrogenase (ubiquinone)
    activity (GO:0008137). How should a channel activity formed jointly by several subunits be represented
    for a subunit that also contributes to the complex's overall catalytic activity?
