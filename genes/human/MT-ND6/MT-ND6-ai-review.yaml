core_functions:
- description: >-
    Small core subunit of the Complex I membrane arm. With ND1, ND3 and ND4L it forms the E-channel, the
    proton-translocation unit nearest the quinone site, and its TMH3 switches between an alpha-helix and
    a pi-bulge during the active/deactive transition. It contributes to the complex's proton-pumping NADH:ubiquinone
    oxidoreductase activity.
