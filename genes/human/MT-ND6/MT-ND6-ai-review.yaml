- term:
    id: GO:0032981
    label: mitochondrial respiratory chain complex I assembly
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P03925
  - RefSeq:ENSMUSP00000081002
  review:
    summary: >-
      IEA annotation to mitochondrial respiratory chain complex I assembly.
    action: KEEP_AS_NON_CORE
    reason: >-
      Loss or pathogenic variants of ND6 block or destabilise Complex I assembly, and ND6 enters at a
      defined assembly step. This shows ND6 is a required building block of the complex rather than an
      assembly factor; the annotation is kept, but the core role is catalytic (contribution to proton-pumping
      NADH:ubiquinone oxidoreduction).
    supported_by:
    - reference_id: PMID:14595656
      supporting_text: suggesting that the mutation has a profound effect on complex I assembly and/or
        stability
    - reference_id: Reactome:R-HSA-6799199
      supporting_text: Membrane arm subunits COA1:MT-ND2, TMEM186:MT-ND3, MT-ND6 and NDUFB6 associate
        with the assembly factors
