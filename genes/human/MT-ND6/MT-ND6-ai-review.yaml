    summary: >-
      Proposed new annotation: ND6 contributes to proton transmembrane transporter activity as part of the
      E-channel proton-translocation unit of Complex I.
    action: NEW
    reason: >-
      ND6 is one of the small membrane-arm subunits (ND3, ND6, ND4L, with part of ND1) that form the E-channel,
