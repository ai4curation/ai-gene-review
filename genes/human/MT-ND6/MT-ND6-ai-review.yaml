- term:
    id: GO:0042776
    label: proton motive force-driven mitochondrial ATP synthesis
  evidence_type: NAS
  original_reference_id: PMID:30030361
  qualifier: involved_in
  review:
    summary: >-
      NAS annotation (ComplexPortal) to proton motive force-driven mitochondrial ATP synthesis.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Complex I generates the proton motive force but does not synthesise ATP; that process is carried
