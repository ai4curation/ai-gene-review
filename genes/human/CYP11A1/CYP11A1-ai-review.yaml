- term:
    id: GO:0071375
    label: cellular response to peptide hormone stimulus
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: Phylogenetic (IBA) annotation reflecting that steroidogenic expression/activity of P450scc
      is regulated by peptide hormones (e.g. ACTH via cAMP). This is a regulatory cellular response
      rather than a molecular activity of CYP11A1.
    action: KEEP_AS_NON_CORE
    reason: 'Retain the conserved cellular-response context as peripheral to catalysis: steroidogenic
      cells use CYP11A1 as an effector of hormone/cAMP-regulated steroid output, not a peptide receptor
      or signal transducer. PMID:1849407 demonstrates cAMP-responsive CYP11A1 synthesis in human
      JEG-3 and mouse Y1 cells; cAMP is a downstream messenger rather than a direct peptide-ligand
      assay.'
    supported_by:
