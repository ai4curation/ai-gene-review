    label: glucocorticoid biosynthetic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: CYP11A1 catalyzes the entry reaction of adrenal glucocorticoid biosynthesis.
    action: ACCEPT
    reason: Pregnenolone synthesis is an actual enzymatic step within the multistep glucocorticoid
      pathway. A shared upstream reaction need not be glucocorticoid-specific to participate; the
      prior over-annotation judgment incorrectly excluded pathway-entry enzymes. Human CYP11A1 biochemistry
      and adrenal-deficiency variants support the PAINT-inherited role.
    supported_by:
