id: P05108
gene_symbol: CYP11A1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CYP11A1 is a mitochondrial heme-thiolate monooxygenase that initiates steroid hormone
  biosynthesis by converting cholesterol to pregnenolone. At the matrix face of the inner mitochondrial
  membrane it performs successive C22 and C20 hydroxylations and C20–C22 bond cleavage, releasing
  pregnenolone and 4-methylpentanal. Electrons are supplied from NADPH through ferredoxin reductase
  and adrenodoxin. This shared entry reaction supports adrenal, gonadal and placental steroidogenesis;
  tissue-specific downstream enzymes determine the final hormones. CYP11A1 also supports a secondary
  pathway of vitamin D hydroxylation. Loss-of-function variants can cause combined adrenal and gonadal
  steroid deficiency.
