    label: cell fate determination
  evidence_type: NAS
  original_reference_id: PMID:10837489
  qualifier: involved_in
  review:
    summary: The short MCL-1S splice product promotes apoptosis, but cell fate determination is too 
      broad.
    action: MODIFY
    reason: PMID:10837489 identifies a pro-apoptotic splice product; the supported biology is 
      regulation of apoptosis by an MCL1 isoform rather than generic cell fate determination.
    proposed_replacement_terms:
