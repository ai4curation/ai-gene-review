core_functions:
- description: Canonical MCL-1L binds BH3 helices from BAK, BAX, and BH3-only ligands at the 
    mitochondrial outer membrane, sequestering pore-forming or activating BCL2-family proteins to 
    prevent mitochondrial outer membrane permeabilization and cytochrome-c release.
  molecular_function:
    id: GO:0051434
    label: BH3 domain binding
  directly_involved_in:
  - id: GO:1901029
    label: negative regulation of mitochondrial outer membrane permeabilization involved in 
      apoptotic signaling pathway
  - id: GO:0090201
    label: negative regulation of release of cytochrome c from mitochondria
  locations:
  - id: GO:0005741
    label: mitochondrial outer membrane
  in_complex:
    id: GO:0097136
    label: Bcl-2 family protein complex
  supported_by:
  - reference_id: PMID:15901672
    supporting_text: "in healthy cells, Bak associates with Mcl-1 and Bcl-x(L) but surprisingly not\n\
      Bcl-2, Bcl-w, or A1."
  - reference_id: PMID:18040043
