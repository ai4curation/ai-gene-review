id: Q07820
gene_symbol: MCL1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'MCL1 encodes a short-lived BCL2-family survival factor best known as the mitochondrial outer-membrane
  protein Mcl-1L, whose BH3-binding groove sequesters BAK, BAX, and BH3-only proteins to restrain mitochondrial
  outer membrane permeabilization, cytochrome-c release, and downstream caspase activation. Alternative
  splicing produces the short MCL-1S isoform, and caspase cleavage can also generate pro-apoptotic MCL1
  fragments, separating conditional pro-death proteoforms from the canonical anti-apoptotic long isoform.
  MCL1 abundance is controlled rapidly by phosphorylation, ubiquitination, and deubiquitination, and contextual
  MCL1 pools have been linked to autophagy control, anoikis resistance, DNA-damage responses, and mitochondrial
  dynamics.'
alternative_products:
- name: 1 (MCL1L, MCL-1L)
  id: Q07820-1
- name: 2 (Delta S, MCL-1S, TM)
  id: Q07820-2
  sequence_note: VSP_000532, VSP_000533
