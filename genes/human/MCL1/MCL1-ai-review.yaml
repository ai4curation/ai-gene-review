  review:
    summary: Canonical MCL-1L restrains cytochrome-c release rather than forming a release pore.
    action: MODIFY
    reason: The inherited family term conflates pro-survival and pore-forming BCL2 relatives. For 
      canonical MCL1, the specific supported role is inhibition of BAX/BAK-dependent cytochrome-c 
      release.
    proposed_replacement_terms:
