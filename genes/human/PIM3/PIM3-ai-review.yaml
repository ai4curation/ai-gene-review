description: 'PIM3 encodes a PIM-family serine/threonine kinase that phosphorylates BAD and
  CDKN1B/p27 and participates in PIM-family control of cell survival and cell-cycle progression. Human
  PIM3 is supported by BAD phosphorylation evidence in colon cancer cells, with additional mammalian evidence
  for insulin-secretion and energy-metabolism branches.'
