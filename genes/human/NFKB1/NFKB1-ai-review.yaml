id: P19838
gene_symbol: NFKB1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: NFKB1 encodes the NF-kappaB p105 precursor and its processed p50 DNA-binding subunit. The p50 Rel-homology domain forms kappaB-site DNA-binding dimers with RELA, RELB, REL and itself to regulate RNA polymerase II target genes in inflammatory and immune signaling. The p105 C-terminal ankyrin repeats keep associated Rel proteins and MAP3K8/TPL2 in inactive cytoplasmic complexes until signal-induced phosphorylation, ubiquitination and proteasomal processing release p50 and activate downstream NF-kappaB and MAPK outputs.
