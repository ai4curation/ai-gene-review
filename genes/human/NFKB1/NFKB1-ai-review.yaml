- description: The p105 precursor uses its ankyrin-repeat region to sequester associated Rel proteins and MAP3K8/TPL2-containing complexes in the cytoplasm until signal-induced p105 phosphorylation, ubiquitination and proteasomal processing release NF-kappaB and MAPK signaling outputs.
