core_functions:
- description: The processed p50 subunit of NFKB1 binds kappaB cis-regulatory DNA in NF-kappaB dimers, including the abundant p50:p65 complex, and regulates RNA polymerase II transcription after NF-kappaB activation and nuclear entry.
