  - reference_id: Reactome:R-HSA-5684273
    supporting_text: IKBKB-induced proteolysis of NFkB p105 to p50 releases MAP3K8
suggested_questions:
- question: Which p50-containing dimers account for the macrophage anti-inflammatory effects that differ between human NFKB1 haploinsufficiency and Nfkb1-deficient mouse cells?
- question: Can the direct p105-MAP3K8 scaffold function be separated genetically from p105 processing to p50 in primary human macrophages?
suggested_experiments:
- description: Use NFKB1 variants that uncouple p105 ankyrin-repeat sequestration, MAP3K8 binding and p50 production to measure canonical NF-kappaB and MAPK outputs in the same primary human macrophage system.
