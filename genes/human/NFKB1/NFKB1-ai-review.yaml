- term:
    id: GO:0000165
    label: MAPK cascade
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P25799
  - ensembl:ENSMUSP00000029812
  review:
    summary: MAPK cascade is a direct p105-MAP3K8 branch of the NFKB1 mechanism.
    action: KEEP_AS_NON_CORE
    reason: p105 sequesters and stabilizes MAP3K8/TPL2, and IKBKB-induced p105 proteolysis releases MAP3K8 to activate the MAP2K-MAPK1/3 cascade. Keep this row as a direct but secondary p105 scaffold output, distinct from the core p50 DNA-binding and Rel-subunit retention functions.
    supported_by:
    - reference_id: Reactome:R-HSA-5684273
      supporting_text: IKBKB-induced proteolysis of NFkB p105 to p50 releases MAP3K8 (TPL2) from the complex with NFkB p105 and ABIN2. On TLR or IL1beta stimulation, dissociated MAP3K8 with an adequate phosphorylation state activates MAP2K (MKK1/2) and consequently MAPK1/3 (ERK1/2).
