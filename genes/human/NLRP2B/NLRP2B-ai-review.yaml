description: >-
  NLRP2B (pyrin-only protein 4, POP4; formerly the pseudogene NLRP2P/CLRX.1/NOD24) is a
  45-amino-acid protein encoded on chromosome Xp11.21 by a processed retrocopy of an
  NLRP2/NLRP7-like gene that is restricted to Old World primates. Its open reading frame
  corresponds to the first 45 codons of NLRP2 and is predicted to fold into only the first
  two alpha-helices of a pyrin domain (PYD); it is about 80% identical to the N-terminal
  region of the pyrin-only protein POP2 (PYDC2). The ORF is under purifying selection
  across hominids, and the mRNA is detected in many tissues and in leukocytes and is
  induced by lipopolysaccharide in monocytic cells. The endogenous protein has not been
  detected directly. When expressed ectopically, POP4 is diffusely cytoplasmic and
  partly nuclear, and moves into the nucleus on TNF stimulation. It inhibits NF-kappaB
  RelA/p65 transactivation at or downstream of RelA/p65 by reducing RelA/p65
  phosphorylation at Ser-536, and thereby lowers TNF and IL-6 release from macrophages
  stimulated through TLR2 or TLR4; siRNA knockdown in human THP-1 cells increases the
  release of these cytokines. Unlike POP2, it lacks the acidic residues and helix 4 needed
  to block ASC-dependent inflammasomes and does not inhibit NLRP3 inflammasome-driven
  IL-1beta release. In HeLa cells under cycloheximide treatment it slows S/G2 progression
  and, with TNF, increases apoptosis.
