      supporting_text: Further, TNFα treatment also induces the nuclear translocation of
        POP4 in the majority (80%) of transfected cells (Fig. 4D).
    - reference_id: PMID:24871464
      supporting_text: Although cytoplasmic localization was more predominant, some cells
        with nuclear concentration of POP4 were observed (Fig. 4A).
