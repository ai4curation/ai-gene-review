  review:
    summary: FLAG-tagged POP4 expressed in HeLa cells is partly nuclear at rest and
      becomes predominantly nuclear in most transfected cells after TNF stimulation.
    action: ACCEPT
    reason: Direct immunofluorescence localisation, and the nuclear pool fits the
      proposed nuclear site of action (inhibition of the isolated RelA/p65 TAD1 in a
      Gal4 assay). The caveat is that this was an overexpressed tagged protein in a cell
      line that does not express endogenous NLRP2B; no endogenous protein localisation
      exists.
