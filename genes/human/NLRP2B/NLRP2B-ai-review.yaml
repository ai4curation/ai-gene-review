  - reference_id: PMID:24871464
    supporting_text: Together these results strongly suggest that POP4 limits NF-κB
      phosphorylation of S536 in these cells, thereby reducing transactivation by the p65
      TAD1.
proposed_new_terms: []
suggested_questions:
- question: >-
    Is the 45-residue POP4 protein made from the endogenous NLRP2B locus? All functional
    data come from ectopic expression of the ORF, the tagged protein was not detectable
    by western blot, and HPA reports no protein. Detection of the endogenous peptide (for
    example by targeted mass spectrometry in LPS-stimulated monocytes) would confirm the
    product that the annotations describe.
- question: >-
    What does POP4 bind to reduce RelA/p65 Ser-536 phosphorylation - RelA/p65 itself, an
    IKK or other Ser-536 kinase, or a phosphatase? Only an answer to this would allow a
    molecular function term to be assigned.
- question: >-
    Should NLRP2B also carry a general NF-kappaB signalling regulation term (for example
    GO:0043124 negative regulation of canonical NF-kappaB signal transduction), or are the
    stimulus-specific TNF and TLR terms the intended representation?
suggested_experiments:
- hypothesis: The endogenous NLRP2B ORF is translated in human myeloid cells.
  description: >-
    Ribosome profiling and targeted mass spectrometry (or an endogenous epitope knock-in)
    in LPS-stimulated THP-1 cells or primary monocytes, where NLRP2B mRNA is induced.
  experiment_type: proteomics / ribosome profiling
- hypothesis: POP4 limits RelA/p65 Ser-536 phosphorylation by binding a specific kinase
    or RelA/p65 itself.
  description: >-
    Affinity purification-mass spectrometry of tagged POP4 at near-endogenous levels,
    followed by in vitro kinase assays with IKKbeta/TBK1 and RelA TAD1 substrate in the
    presence of recombinant POP4.
  experiment_type: interaction proteomics and in vitro kinase assay
