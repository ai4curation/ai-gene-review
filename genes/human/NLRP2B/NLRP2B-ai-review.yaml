- term:
    id: GO:0010804
    label: negative regulation of tumor necrosis factor-mediated signaling pathway
  evidence_type: IMP
  original_reference_id: PMID:24871464
  qualifier: involved_in
  review:
    summary: POP4 reduces TNF-induced NF-kappaB reporter activity and TNF-induced
      RelA/p65 Ser-536 phosphorylation.
    action: ACCEPT
    reason: The paper (full text read) shows that POP4 suppresses NF-kappaB output in
      response to TNF and acts at or downstream of RelA/p65, without blocking the
      NF-kappaB-independent SV40 promoter. The evidence is overexpression (gain of
      function) rather than loss of function, so the code is generous, but the claim
      itself is supported. This is one of the two read-outs of the core function
      (dampening of NF-kappaB-dependent inflammatory signalling).
    supported_by:
    - reference_id: PMID:24871464
      supporting_text: Similar to POP1 and POP2, POP4 significantly reduced NF-κB
        promoter/reporter activity in response to TNFα (Fig. 3B).
    - reference_id: PMID:24871464
      supporting_text: Together these results strongly suggest that POP4 limits NF-κB
        phosphorylation of S536 in these cells, thereby reducing transactivation by the
        p65 TAD1.
- term:
    id: GO:0032691
    label: negative regulation of interleukin-1 beta production
  evidence_type: IMP
  original_reference_id: PMID:24871464
  qualifier: involved_in
  negated: true
  review:
    summary: NOT annotation. POP4 did not reduce IL-1beta release from cells with a
      reconstituted NLRP3 inflammasome or from ASC-overexpressing cells.
    action: ACCEPT
    reason: The negative result is directly reported and has a structural explanation
      (POP4 lacks pyrin-domain helix 4 and the acidic residues at positions 6 and 16
      that POP2 needs to block ASC-dependent inflammasomes). The NOT row is useful
      because it separates POP4 from its closest paralog POP2, which does carry this
      term. The scope is the reconstitution assay; inhibition of other inflammasomes was
      not tested.
    supported_by:
    - reference_id: PMID:24871464
      supporting_text: Indeed, POP4 failed to prevent release of IL-1β from cells
        expressing a reconstituted NLRP3 inflammasome (Fig. 3D).
    - reference_id: PMID:24871464
      supporting_text: Even with increasing concentrations, POP4 was unable to block
        ASC-dependent IL-1β release (Fig. 3E).
- term:
    id: GO:0033137
    label: negative regulation of peptidyl-serine phosphorylation
  evidence_type: IMP
  original_reference_id: PMID:24871464
  qualifier: involved_in
  review:
    summary: POP4-expressing J774A.1 clones show dose-dependent reduction of nuclear
      RelA/p65 phosphorylated at Ser-536 after TNF or LPS.
    action: ACCEPT
    reason: This is the mechanistic read-out reported for POP4 and is well supported by
      graded clones. The kinase or phosphatase that POP4 affects is unknown, so the
      annotation records an effect on a phosphorylation event rather than a molecular
      activity; it should not be read as POP4 being a kinase inhibitor.
    supported_by:
    - reference_id: PMID:24871464
      supporting_text: Nevertheless, POP4 reduces the amount of S536-phosphorylated p65
        suggesting an impact of POP4 on a kinase or phosphatase targeting S536
- term:
    id: GO:0034122
    label: negative regulation of toll-like receptor signaling pathway
  evidence_type: IMP
  original_reference_id: PMID:24871464
  qualifier: involved_in
  review:
    summary: POP4 overexpression reduces TNF and IL-6 release after TLR2 or TLR4
      stimulation of macrophages, and siRNA knockdown in human THP-1 cells increases
      LPS-induced TNF and IL-6.
    action: ACCEPT
    reason: The best-supported function of NLRP2B, and the only one with both gain- and
      loss-of-function evidence, the latter in human myeloid cells where the gene is
      expressed and LPS-inducible. Core function.
    supported_by:
    - reference_id: PMID:24871464
      supporting_text: However, in both individual and polyclonal populations of
        stable-transfected POP4-expressing J774A.1 cells, POP4 reduced IL-6 and TNFα
        release relative to vector-only controls in response to LPS (Fig. 7A) and
        Pam3CysK4 (Fig. 7B).
    - reference_id: PMID:24871464
      supporting_text: In cells with reduced POP4 expression (250 ng siRNA), there was a
        statistically significant increase in IL-6 and TNFα cytokine release as compared
        to control cells (Fig. 7E).
- term:
    id: GO:0043065
    label: positive regulation of apoptotic process
  evidence_type: IMP
  original_reference_id: PMID:24871464
  qualifier: involved_in
  review:
    summary: Overexpressed POP4 increased hypodiploid (apoptotic) HeLa nuclei, but only
      under combined cycloheximide and TNF treatment.
    action: KEEP_AS_NON_CORE
    reason: A single, condition-dependent overexpression result in a cell line that does
      not express NLRP2B. The authors present it as a likely consequence of RelA/p65
      inhibition, which would make it an indirect, downstream effect, and note that POP2
      does not reproduce it. Retained because the curator recorded what was observed,
      but it is not part of the core function.
    supported_by:
    - reference_id: PMID:24871464
      supporting_text: Further, apoptosis (as indicated by hypodiploid nuclei) was
        significantly increased by POP4, but only in the presence of both CHX and TNFα
        (Fig. 6D).
    - reference_id: PMID:24871464
      supporting_text: These data suggest that under appropriate conditions POP4 might
        restrict cell cycle progression and promote apoptotic cell death, features
        consistent with its ability to inhibit RelA/p65.
- term:
    id: GO:0045786
    label: negative regulation of cell cycle
  evidence_type: IMP
  original_reference_id: PMID:24871464
  qualifier: involved_in
  review:
    summary: In cycloheximide-treated HeLa cells, overexpressed POP4 reduced
      proliferation and disrupted progression through S/G2.
    action: KEEP_AS_NON_CORE
    reason: Same limitations as the apoptosis row - one overexpression experiment, only
      under cycloheximide, in a non-expressing cell line, and probably indirect. Kept as
      non-core.
    supported_by:
    - reference_id: PMID:24871464
      supporting_text: Cell cycle analysis revealed that in CHX-treated cells POP4
        disrupts progression through the S/G2 phase (Fig. 6B&C).
- term:
    id: GO:1900226
    label: negative regulation of NLRP3 inflammasome complex assembly
  evidence_type: IMP
  original_reference_id: PMID:24871464
  qualifier: involved_in
  negated: true
  review:
    summary: NOT annotation. POP4 does not inhibit NLRP3 inflammasome function in a
      reconstitution assay.
    action: ACCEPT
    reason: The paper concludes that POP4 is not an NLRP3 inflammasome inhibitor. The
      assay measured IL-1beta release rather than complex assembly itself, so the
      assembly term is slightly more specific than the read-out, but the negative claim
      follows (no inhibition of output implies no effective inhibition of assembly) and
      it distinguishes POP4 from POP2, which carries the positive annotation.
    supported_by:
    - reference_id: PMID:24871464
      supporting_text: Therefore, POP4 appears not to be an inhibitor of the NLRP3
        inflammasome and is unlikely to inhibit other ASC-dependent inflammasomes
core_functions:
- description: >-
    Dampens NF-kappaB RelA/p65-dependent inflammatory gene expression downstream of
    Toll-like receptor and TNF receptor stimulation, by reducing activating
    phosphorylation of RelA/p65 at Ser-536 and so limiting RelA/p65 TAD1
    transactivation, which lowers TNF and IL-6 production by macrophages. The molecular
    activity responsible (which kinase or phosphatase is affected, and whether POP4 binds
    RelA/p65 directly) is unknown, so no molecular function term is assigned. Unlike its
    paralog POP2, it does not inhibit ASC-dependent inflammasomes.
