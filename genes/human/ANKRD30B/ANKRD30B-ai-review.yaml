knowledge_gaps:
- gap_statement: Whether ANKRD30B is translated, and if so its molecular activity, location and role,
    are unknown.
  boundary: 'GOA holds only the three ND root placeholders. PAN-GO assigns no annotations, and the PANTHER
    family PTHR24147 has no annotated PAINT nodes. Nothing transfers from the better-known paralog ANKRD30A
    (NY-BR-1): it sits in a different subfamily (SF63, versus SF52 for ANKRD30B), and neither subfamily
    has an annotated PAINT node. No mechanistic study exists; the literature is the 2001 identification
    plus later association and expression reports.'
  gap_kind:
  - BIOLOGY
  dark_aspect: WHOLLY_DARK
  status: OPEN
  significance: ANKRD30B recurs as a methylation hit in neurological conditions, but without a known product
    or function these associations cannot be interpreted.
  resolution: Detect endogenous ANKRD30B protein, for example by targeted mass spectrometry in testis
    or brain, before attempting localization and loss-of-function studies.
