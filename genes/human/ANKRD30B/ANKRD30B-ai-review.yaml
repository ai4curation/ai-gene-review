description: ANKRD30B (ankyrin repeat domain-containing 30B) is an uncharacterized protein of about 1,390
  residues, with five N-terminal ankyrin repeats and long C-terminal coiled-coil regions. Its transcript
  is found in brain, breast and testis; UniProt records only transcript-level evidence for the protein,
  and no molecular activity, location or biological role is known. Differential methylation of ANKRD30B
  has been reported in Williams syndrome and Alzheimer's disease.
