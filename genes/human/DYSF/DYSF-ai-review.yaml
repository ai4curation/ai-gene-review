  qualifier: enables
  supporting_entities:
  - UniProtKB:Q9Y4F9
  review:
    summary: RIPOR2/FAM65B is a supported myogenic interaction partner.
    action: KEEP_AS_NON_CORE
    reason: The complete original reports endogenous reciprocal co-IP of dysferlin with FAM65B/RIPOR2
      in differentiating primary human fetal myogenic cells and discusses a transient complex with HDAC6.
      The paper does not establish a purified binary interface. RIPOR2 is a RHOA regulator with cytoskeletal
      and differentiation contexts, but binding a regulator is not small-GTPase binding and does not transfer
      its signaling activity to DYSF. Retain this supported contextual association as generic non-core
      binding; no better evidenced molecular subclass is established by the inspected pair.
