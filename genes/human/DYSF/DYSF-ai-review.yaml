- term:
    id: GO:0002280
    label: monocyte activation involved in immune response
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  supporting_entities:
  - ARBA:ARBA00089298
  review:
    summary: The automated monocyte-activation assertion is biologically supported but contextual.
    action: KEEP_AS_NON_CORE
    reason: The literal ARBA00089298 rule contains the vertebrate FunFam condition associated with the
      target and predicts this term. The complete original reports activated mononuclear infiltrates in
      human dysferlin-deficient muscle and increased activation markers in dysferlin-deficient mouse macrophages.
      This supports the curated immune context, but does not establish a primary immune-receptor or cytokine-signaling
      activity of dysferlin. The human basal phagocytosis difference was not statistically significant;
      the significant human comparison was after TNF treatment. Controlled dysferlin knockdown and increased
      phagocytosis were demonstrated in mouse J774 cells. Preserve the positive disease/cell context as
      non-core without treating all these assays as human or as one activation mechanism.
    additional_reference_ids:
    - PMID:18276788
    - file:human/DYSF/DYSF-source-guide.md
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
      - source_id: ARBA:ARBA00089298
        source_status: SUPPORTS_TRANSFER
        comment: The exact source identifier was inspected; see the source-specific reason and saved raw-derived
          projection.
