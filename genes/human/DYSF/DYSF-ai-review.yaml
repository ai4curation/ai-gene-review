  review:
    summary: Nebulin binding has a supported cytoskeletal partner class.
    action: MODIFY
    reason: The human muscle-library study reports the DYSF–NEB pair with PBS category A and positive
      proximity ligation in its original supplementary interaction table. Literal IntAct records preserve
      the DYSF and nebulin fragments, including the P20929-1 participant; the reference-sequence ROGID
      independently matches that official isoform. Nebulin is an independently established F-actin-associated
      structural sarcomere protein. Refine the binding class without transferring nebulin structural activity
      to DYSF, equating PLA proximity with purified contact, or claiming that the full natural proteins
      were assayed in every record.
