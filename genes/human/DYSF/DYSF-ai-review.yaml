- term:
    id: GO:0005543
    label: phospholipid binding
  evidence_type: IDA
  original_reference_id: PMID:24239457
  qualifier: enables
  review:
    summary: Phospholipid binding is a central demonstrated DYSF activity.
    action: ACCEPT
    reason: Human canonical and alternative-exon C2A fragments bind lipid membranes with different calcium
      dependence in the cited original. Independent human DYSF domain assays show binding to POPC/POPS
      liposomes even in EDTA and enhancement by calcium, with no significant binding to pure POPC. Retain
      broad phospholipid binding because universal absolute calcium dependence would misdescribe the observed
      domain behavior. Neither study assays all 15 natural full-length products.
    additional_reference_ids:
    - PMID:24461013
    - file:human/DYSF/DYSF-source-guide.md
    supported_by:
    - reference_id: PMID:24239457
