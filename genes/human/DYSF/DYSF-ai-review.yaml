core_functions:
- description: Dysferlin binds acidic membrane phospholipids through its C2 domains. Calcium enhances
    binding by the tested canonical domains, while basal binding and the alternative exon-1 C2A response
    show that this activity is not uniformly calcium-dependent across constructs. This membrane interaction
    underlies its role in muscle membrane maintenance and repair. Surface, T-tubule and endosomal pools
    are supported, with muscle-specific sarcolemmal localization distinguished from non-muscle plasma
    membrane. These gene-level activities and locations are not assigned equally to all 15 products, particularly
    the form lacking the canonical membrane anchor.
  molecular_function:
    id: GO:0005543
    label: phospholipid binding
  locations:
  - id: GO:0005886
    label: plasma membrane
  - id: GO:0042383
    label: sarcolemma
  - id: GO:0030315
    label: T-tubule
  - id: GO:0005769
    label: early endosome
  - id: GO:0031902
    label: late endosome membrane
  supported_by:
  - reference_id: PMID:11959863
  - reference_id: PMID:24239457
  - reference_id: PMID:24461013
  - reference_id: PMID:10196375
  - reference_id: PMID:17185750
  - reference_id: PMID:20595382
  - reference_id: PMID:26707827
- description: Calcium binding by dysferlin C2 domains tunes their membrane interactions. Purified human
    canonical C2A and the seven tested human C2 domains bind calcium directly. The alternative exon-1
    C2A fragment behaves differently in solution and on lipid membranes; the observation defines a biochemical
    construct class rather than proving identical calcium responses of every full-length splice product.
  molecular_function:
    id: GO:0005509
    label: calcium ion binding
  supported_by:
  - reference_id: PMID:24239457
  - reference_id: PMID:24461013
suggested_questions:
- question: Which full-length products carrying alternative exon 1 reproduce the isolated C2Av1 calcium/lipid
    response, and how does the membrane-anchor-deficient product localize and function?
- question: Do the inherited synaptic annotations reflect a conserved human dysferlin function or a specialization
    of experimentally characterized MCTP donors?
suggested_experiments:
- hypothesis: The alternative N terminus and loss of the C-terminal anchor have separable effects on full-length
    dysferlin membrane engagement.
  description: Compare sequence-authenticated full-length products in matched cell backgrounds using calcium-controlled
    lipid association, surface/endosomal imaging and damage-repair assays, including expression and trafficking
    controls.
  experiment_type: Matched full-length isoform biochemistry and cell imaging
