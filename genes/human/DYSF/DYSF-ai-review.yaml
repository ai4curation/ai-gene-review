- term:
    id: GO:0005509
    label: calcium ion binding
  evidence_type: IDA
  original_reference_id: PMID:24239457
  qualifier: enables
  review:
    summary: The canonical human C2A domain directly binds calcium.
    action: ACCEPT
    reason: The original study assays human canonical C2A residues 1–125 and the alternative N-terminal
      C2Av1 class as bacterial recombinant fragments. Canonical C2A binds calcium; the variant lacks measurable
      binding in solution but gains a lipid-exposed calcium site with different effects on membrane avidity.
      Retain the positive gene-level IDA assertion without applying canonical behavior to all 15 products
      or treating the Cys2Ala variant reagent as an unmodified natural full-length isoform.
    additional_reference_ids:
    - PMID:24461013
    - file:human/DYSF/DYSF-source-guide.md
    supported_by:
    - reference_id: PMID:24239457
