id: O75923
gene_symbol: DYSF
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Dysferlin is a ferlin-family membrane protein whose C2 domains bind calcium and acidic phospholipids.
  It participates in skeletal-muscle membrane maintenance and repair and is found at the sarcolemma, T-tubules
  and internal membrane compartments, with trafficking between the cell surface and endosomes. Alternative
  splicing changes its N-terminal calcium/lipid coupling, and one truncated product lacks the canonical
  C-terminal membrane anchor.
