suggested_questions:
- question: Does the ATG12-ATG5-ATG16L2 complex lipidate LC3 on any non-canonical membrane (for example
    during LC3-associated phagocytosis), and do Crohn disease-associated ATG16L2 variants alter that?
suggested_experiments:
- description: In ATG16L1-null human cells re-expressing ATG16L2, test LC3 lipidation on phagosomes, endolysosomes
    and in CASM, and map the region (as in the Atg16L1/L2 chimeras) that would confer membrane recruitment.
