gene_symbol: ATG16L2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ATG16L2 is the paralog of the autophagy protein ATG16L1, with an N-terminal ATG5-binding
  region, a coiled-coil that self-oligomerizes, and C-terminal WD repeats. Like ATG16L1, it binds ATG5
  and forms a ~800-kDa ATG12-ATG5-ATG16L2 complex with E3-like activity in vitro. Unlike ATG16L1, it is
  not recruited to phagophores, stays mostly cytosolic, and is not required for canonical autophagosome
  formation. In mice it has lineage-specific roles in myeloid, lymphoid and epithelial cells. It is reported
  to support ATG5-12-16L1 assembly and autophagy flux in LPS-stimulated macrophages, which restrains NLRP3
  inflammasome activation, and to promote NLRC4 inflammasome activation by binding NAIPs. ATG16L2 variants
  are associated with Crohn disease and systemic lupus erythematosus.
