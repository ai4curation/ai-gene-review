  findings:
  - statement: Atg16L2 forms an ~800-kDa Atg12-5-16L2 complex.
    supporting_text: Biochemical analysis revealed that Atg16L2 interacts with Atg5 and self-oligomerizes
      to form an ~800-kDa complex, the same as Atg16L1 does.
  - statement: Membrane-targeted Atg12-5-16L2-N has E3-like LC3-lipidation activity.
    supporting_text: S5 ), indicating that the Atg12–5-16L2-N complex has the ability to function as an
      E3-like enzyme, the same as the Atg12–5-16L1-N complex does.
  - statement: Atg16L2 is cytosolic and not recruited to phagophores.
    supporting_text: A subcellular distribution analysis indicated that, despite forming the Atg12–5-16L2
      complex, Atg16L2 is not recruited to phagophores and is mostly present in the cytosol.
  - statement: Atg16L2 is not required for canonical autophagy.
    supporting_text: Based on these results, we concluded that Atg16L2 is not required for canonical autophagy,
      despite forming an ~800-kDa complex with Atg12–5 and having E3-like activity.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text; mouse cells. The basis of the ISS rows.
- id: PMID:31451676
  title: Distinct Tissue-Specific Roles for the Disease-Associated Autophagy Genes ATG16L2 and ATG16L1.
  findings:
  - statement: ATG16L2 knockout has lineage-specific effects distinct from ATG16L1.
    supporting_text: Our results show that ATG16L1 and ATG16L2 contribute very distinctly to autophagy
      and cellular ontogeny in myeloid, lymphoid, and epithelial lineages.
  - statement: ATG16L2 is implicated in Crohn disease and SLE.
    supporting_text: Interestingly, ATG16L1 has a single homolog, ATG16L2, which is independently implicated
      in diseases, including Crohn disease and systemic lupus erythematosus.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text; first ATG16L2 knockout mouse.
