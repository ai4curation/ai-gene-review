- term:
    id: GO:0003810
    label: protein-glutamine gamma-glutamyltransferase activity
  evidence_type: TAS
  original_reference_id: PMID:2877456
  qualifier: enables
  review:
    summary: Retain the established activity while distinguishing structural evidence.
    action: ACCEPT
    reason: PMID:2877456 identifies and sequences human placental factor XIII A and describes human plasma
      material, but explicitly states that the structural study made no activity measurements. The TAS
      statement is biologically correct and is independently supported by the executed human wild-type
      amine-incorporation and fibrin-cross-linking experiments in PMID:27363989. Retention therefore does
      not relabel the 1986 sequence analysis as a catalytic assay or equate its historical residue numbering
      with the current 732-residue sequence.
    supported_by:
    - reference_id: PMID:2877456
    - reference_id: PMID:27363989
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:32814053
  qualifier: enables
  supporting_entities:
  - UniProtKB:O15273
  review:
    summary: Retain the reported O15273 interaction as non-core.
    action: KEEP_AS_NON_CORE
    reason: The actual Haenig NeuroNet source and current IntAct records report F13A1/P00488 with O15273
      (TCAP) in two-hybrid pooling, array and validated two-hybrid contexts. The supplement identifies
      F13A1 bait clone CCSB_8309; the Methods describe human cDNA or fragment fusion constructs, exclusion
      of autoactivating baits, three yeast reporters and repeated pairwise tests. This supports the reported
      physical association, not a demonstrated physiological transglutaminase substrate, covalent cross-link,
      adaptor activity or transfer of the partner's function. Specific functional binding alternatives
      were considered, but these experiments do not establish the coordinated molecular role required
      for such a replacement. Study-wide mammalian validation is not claimed for this pair. Current parent-record
      identity does not verify the historical insert sequence, and a partner suffix is not a F13A1 isoform
      annotation.
    supported_by:
    - reference_id: PMID:32814053
