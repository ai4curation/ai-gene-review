id: P00488
gene_symbol: F13A1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: F13A1 encodes the catalytic A subunit of coagulation factor XIII, a calcium-dependent transglutaminase
  that stabilizes fibrin clots by forming covalent links between protein-bound glutamine and lysine residues.
  Activated A subunits cross-link fibrin chains and incorporate alpha2-antiplasmin into fibrin, increasing
  clot stability and resistance to fibrinolysis. Plasma factor XIII circulates as an A2B2 zymogen complex
  with carrier B subunits; thrombin cleavage and calcium promote activation of the A subunits and dissociation
  of the B subunits. Platelets contain a major cytosolic A-subunit pool, alongside smaller surface, released
  and reported alpha-granule pools. The intracellular pool has distinct activation and substrate contexts
  from plasma fibrin cross-linking. F13A1 deficiency impairs clot stabilization and causes a bleeding
  disorder.
