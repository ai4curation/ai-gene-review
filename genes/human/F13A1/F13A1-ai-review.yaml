- term:
    id: GO:0003810
    label: protein-glutamine gamma-glutamyltransferase activity
  evidence_type: IDA
  original_reference_id: PMID:27363989
  qualifier: enables
  review:
    summary: Retain the directly assayed human transglutaminase activity.
    action: ACCEPT
    reason: The complete PMID:27363989 article and supplement reproduced in the author thesis describe
      sequence-checked human F13A1 cDNA expressed in COS-1 cells. Activated wild-type preparations incorporate
      a primary amine into fibrinogen and incorporate alpha2-antiplasmin; calcium-dependent activity and
      the fibrin cross-linking assays establish the protein-glutamine gamma-glutamyltransferase reaction.
      COS-1 is the expression host, not the species of the insert. The 100 mM calcium experiment without
      thrombin is a separate in vitro activation condition, not a normal plasma calcium requirement. No
      activity equivalence is inferred for every patient variant or external transcript model.
    supported_by:
    - reference_id: PMID:27363989
