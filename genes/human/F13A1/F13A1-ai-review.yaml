core_functions:
- description: Activated F13A1 catalyzes glutamine-to-lysine protein cross-links, forming fibrin gamma-chain
    dimers and alpha-chain multimers and incorporating alpha2-antiplasmin into fibrin. This directly stabilizes
    the extracellular fibrin clot. The catalytic activity belongs to the A subunit; the B-containing plasma
    zymogen assembly and activated A-subunit preparations represent different states of factor XIII, and
    no invariant active stoichiometry is assumed. Thrombin performs the activating cleavage. Activity
    recovered from platelet cytosolic fractions establishes a cellular enzyme pool without assigning intracellular
    fibrin catalysis to it.
  molecular_function:
    id: GO:0003810
    label: protein-glutamine gamma-glutamyltransferase activity
  directly_involved_in:
  - id: GO:0018149
    label: peptide cross-linking
  - id: GO:0072378
    label: blood coagulation, fibrin clot formation
  locations:
  - id: GO:0005576
    label: extracellular region
  in_complex:
    id: GO:1990234
    label: transferase complex
  supported_by:
  - reference_id: PMID:27363989
  - reference_id: PMID:25331118
  - reference_id: Reactome:R-HSA-140851
suggested_questions:
- question: Which substrates are cross-linked by the retained platelet cytosolic F13A1 pool in intact
    cells, and under which physiological conditions is that pool activated without proteolytic removal
    of its activation peptide?
- question: How do the major cytosolic A-subunit pool and the minor reported alpha-granule A2B2 pool contribute
    to surface exposure, release and extracellular clot stabilization during human platelet activation?
suggested_experiments:
- description: Map F13A1-dependent isopeptide cross-links in intact human platelets across defined activation
    conditions, comparing untreated cells with selective catalytic inhibition and F13A1-deficient material
    where available. Pair cross-link measurements with activation-peptide status, intracellular calcium
    measurements and validated compartment markers. Separate native cellular activity from activity induced
    after lysis by added calcium or thrombin, and distinguish substrate identification from physical association.
- description: Combine quantitative fractionation with matched-setting imaging and A- and B-subunit detection
    in washed human platelets. Track cytosolic, granule, surface, soluble-release and vesicle-associated
    material over a stimulation time course, controlling for plasma carryover, membrane damage and fraction
    purity. Measure activation state and fibrin cross-linking independently of antigen abundance to establish
    which released pools contribute active enzyme without presupposing an uptake or export route.
