proposed_new_terms: []
suggested_questions:
- question: >-
    GO:0140677 molecular function activator activity records that RBRP activates another
    molecular function but not which one or of what. Should GO provide a scoped term (or
    a has-input extension) for activating IGF2BP1 binding to m6A-modified mRNA, so the
    target and the activated activity are machine-readable?
- question: >-
    Which tryptic peptides were observed in the endogenous MS identification of RBRP? Only
    peptides from the unique C-terminal tail (residues 48-71, e.g. HPDPYEFLLLR or
    HPGFNEELSPC) distinguish RBRP from SEPTIN14, and the search was run against a custom
    RBRP-only database.
- question: >-
    Does the C-terminal coiled-coil region of SEPTIN14 itself, which contains the same
    Gly-19-equivalent residue (SEPTIN14 Gly-401), bind IGF2BP1? If so, the binding
    surface is a septin property rather than a novel peptide function.
- question: >-
    Has the RBRP-IGF2BP1 interaction or the MYC mRNA stabilisation effect been reproduced
    by an independent laboratory?
suggested_experiments:
- hypothesis: The endogenous SEPTIN14P20 ORF is translated into the 71-residue RBRP peptide.
  description: >-
    Targeted mass spectrometry for the unique C-terminal tryptic peptides, searched
    against the full human proteome, in colorectal cancer cells; plus CRISPR knock-in of
    an epitope tag at the endogenous RBRP C-terminus and ribosome profiling across the
    ORF.
  experiment_type: proteomics / genome editing
- hypothesis: RBRP knockout (not transcript knockdown) reduces MYC mRNA stability.
  description: >-
    Mutate the endogenous start codon or introduce a frameshift in the RBRP ORF (leaving
    the transcript intact), then measure MYC mRNA half-life and IGF2BP1 RIP enrichment
    on MYC CRD RNA.
  experiment_type: genome editing with mRNA decay assay
references:
- id: PMID:32245947
  title: An oncopeptide regulates m(6)A recognition by the m(6)A reader IGF2BP1 and
    tumorigenesis.
  findings:
  - statement: The paper states that RBRP has no homologs or matching proteins. Residues
      1-47 of RBRP are in fact identical to human SEPTIN14 residues 383-429.
    supporting_text: Sequence comparisons did not identify homologs of LINC00266-1 or the
      RBRP peptide in any other species, and there were no matching proteins and known
      domains/motifs in RBRP, indicating that RBRP is an uncharacterized peptide.
    finding_review:
      finding_status: DISPUTED
      superseded_by:
      - file:human/SEPTIN14P20/SEPTIN14P20-bioinformatics/RESULTS.md
      review_notes: Local alignment against UniProt Q6ZU15 gives 47/47 identities over
        RBRP 1-47. This affects how the antibody and MS existence evidence should be read
        (shared epitopes and peptides), but does not contradict the functional
        experiments, which used ORF constructs.
      supported_by:
      - reference_id: file:human/SEPTIN14P20/SEPTIN14P20-bioinformatics/RESULTS.md
        supporting_text: RBRP residues 1-47 align to SEPTIN14 residues
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: Full text read (PMC7125119). The only study of RBRP and the source of all
      three GOA rows. Functional experiments are internally well controlled (start-codon
      mutant, G19A binding-dead mutant, shRNA-resistant rescue, recombinant protein
      assays). Marked DISPUTED because of the incorrect no-homolog claim and because the
      endogenous existence evidence (antibody spanning a SEPTIN14-shared epitope; MS
      searched against an RBRP-only database) cannot exclude SEPTIN14 cross-detection.
      UniProt keeps the entry at PE5 with a pseudogene caution; HGNC classes the locus as
      a pseudogene. Not independently replicated.
