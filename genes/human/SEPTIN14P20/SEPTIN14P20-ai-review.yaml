description: >-
  SEPTIN14P20 encodes RBRP (RNA-binding regulatory peptide), a 71-amino-acid peptide
  translated from a transcript of the septin 14 pseudogene 20 locus on chromosome
  20q13.33, which was previously annotated as the long non-coding RNA LINC00266-1
  (C20orf69). The peptide is the retained septin-14 reading frame of this pseudogene:
  residues 1-47 are identical to the C-terminal coiled-coil region of SEPTIN14 (residues
  383-429), and only a 24-residue C-terminal tail is unique. RBRP has been reported in
  colorectal, breast, ovarian and nasopharyngeal cancer cells and in colorectal tissue,
  at higher levels in tumours than in adjacent normal tissue, but independent confirmation
  of the endogenous product is lacking. In the single functional study, RBRP bound the
  KH3-KH4 di-domain of the m6A reader IGF2BP1 in an RNA-independent manner (abolished by
  a G19A substitution), increased IGF2BP1 binding to m6A-modified RNA in vitro and in
  cells, and increased the association of IGF2BP1 and the RNA stabilisers ELAVL1/HuR,
  MATR3 and PABPC1 with m6A-marked MYC mRNA. This stabilised MYC mRNA and promoted
  colorectal cancer cell proliferation, migration, invasion and xenograft growth.
existing_annotations:
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:32245947
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q9NZI8
  review:
    summary: Co-immunoprecipitation of RBRP with IGF2BP1 (UniProtKB:Q9NZI8), RNase
      resistant, mapped to the IGF2BP1 KH3-KH4 di-domain and abolished by RBRP G19A.
    action: MODIFY
    reason: Bare protein binding carries no functional information. The same paper shows
      what the binding does - recombinant RBRP increases the binding of recombinant
      IGF2BP1 to m6A-methylated RNA, and the binding-defective G19A mutant does not - so
      the interaction is better captured as an activator of IGF2BP1's m6A-RNA-binding
      activity (GO:0140677 molecular function activator activity). The evidence comes
      from one laboratory on a PE5 pseudogene product whose first 47 residues are
      identical to SEPTIN14, so the replacement is offered on the strength of the
      in vitro data, not as a settled function.
    proposed_replacement_terms:
    - id: GO:0140677
      label: molecular function activator activity
    supported_by:
    - reference_id: PMID:32245947
      supporting_text: indicating that the binding of RBRP to IGF2BP1 was RNA independent
    - reference_id: PMID:32245947
      supporting_text: Similar to endogenous RBRP peptides, a recombinant RBRP
        oncopeptide increased the binding of the recombinant IGF2BP1 protein to
        m6A-methylated RNA oligos, whereas a recombinant G19A-mutated RBRP oncopeptide
        did not
- term:
    id: GO:0048255
    label: mRNA stabilization
  evidence_type: IDA
  original_reference_id: PMID:32245947
  qualifier: involved_in
  review:
    summary: RBRP overexpression lengthens MYC mRNA half-life in an IGF2BP1-, METTL14-
      and m6A-site-dependent way; knockdown of the host transcript shortens it, and only
      wild-type RBRP (not G19A) rescues.
    action: ACCEPT
    reason: Full text read. RBRP acts as a cofactor of the IGF2BP1 stabilising complex
      (it increases IGF2BP1 and HuR/MATR3/PABPC1 occupancy on m6A-marked MYC mRNA), so
      it contributes to the process rather than merely being required for it. The data
      are locus-specific (ORF constructs, start-codon mutants, 3'-UTR shRNA with
      shRNA-resistant rescue), so the doubtful-existence rule for inherited annotations
      does not apply. Caveats are recorded on the reference - single laboratory, UniProt
      PE5, HGNC pseudogene, and the peptide shares residues 1-47 with SEPTIN14.
    supported_by:
    - reference_id: PMID:32245947
      supporting_text: Knockdown of LINC00266-1 significantly decreased the c-Myc mRNA
        stability and level, cell growth, colony formation, migration, and invasion,
        whereas these alterations were restored to the control levels in cells
        cotransfected with WT RBRP but not with the IGF2BP1-binding-defective mutant RBRP
        G19A
    - reference_id: PMID:32245947
      supporting_text: Thus, RBRP strengthens the recruitment of the RNA stabilizers HuR,
        MATR3, and PABPC1 to m6A-c-Myc CRD RNAs, to promote the stability of c-Myc mRNA
        and upregulate the c-Myc levels.
- term:
    id: GO:1902416
    label: positive regulation of mRNA binding
  evidence_type: IDA
  original_reference_id: PMID:32245947
  qualifier: involved_in
  review:
    summary: RBRP increases binding of IGF2BP1 to m6A-modified RNA oligos and MYC CRD RNA,
      in vitro with recombinant proteins and in cells by RIP-qPCR, in a G19-dependent
      and m6A-dependent manner.
    action: ACCEPT
    reason: This is the central, best-controlled result of the paper (recombinant
      proteins, a binding-dead point mutant, and m6A-site mutants in the target). It is
      the process-side description of the activator activity proposed for the protein
      binding row. Same single-laboratory and existence caveats as the mRNA
      stabilization row.
    supported_by:
    - reference_id: PMID:32245947
      supporting_text: Collectively, RBRP enhances the m6A recognition by IGF2BP1 on RNAs.
core_functions:
- description: >-
    Reported regulatory cofactor of the m6A reader IGF2BP1. RBRP binds the IGF2BP1 KH3-KH4
    di-domain through a septin-14-derived segment (Gly-19 required) and increases
    IGF2BP1 binding to m6A-modified mRNA and the recruitment of the RNA stabilisers
    HuR, MATR3 and PABPC1, which lengthens the half-life of MYC mRNA. Rests on a single
    study of a pseudogene-encoded peptide whose existence UniProt rates as uncertain.
