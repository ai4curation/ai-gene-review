id: P55201
gene_symbol: BRPF1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: BRPF1 is a multivalent chromatin reader and scaffold that assembles and
  activates histone acetyltransferase complexes containing KAT6A/MOZ, KAT6B/MORF or
  KAT7/HBO1. It connects catalytic subunits with ING and MEAF6 cofactors and helps
  direct their activity toward nucleosomal histone H3, including H3K14 and H3K23.
  Its PZP module recognizes the unmodified H3 amino terminus and supports chromatin
  engagement, while its bromodomain recognizes acetylated histone ligands. BRPF1 acts
  principally in the nucleus, with partner-dependent localization observed in expression
  assays, and supports context-dependent transcriptional regulation. Monoallelic pathogenic
  variants cause an intellectual developmental disorder associated with deficient
  histone H3 acetylation.
