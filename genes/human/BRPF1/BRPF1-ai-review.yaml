- description: Recognizes histone states and couples them to chromatin engagement
    by acetyltransferase complexes. The PZP module binds the H3 amino terminus preferentially
    when Lys4 is unmethylated and supports nucleosomal engagement; the bromodomain
    recognizes acetylated histone peptides including H2AK5ac and H4K12ac. ING5 can
    redirect the assembled complex toward H3K4me3-rich chromatin without changing
    intrinsic BRPF1 PZP specificity.
