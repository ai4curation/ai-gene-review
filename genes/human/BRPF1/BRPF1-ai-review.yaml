core_functions:
- description: Assembles and activates MOZ/MORF acetyltransferase complexes by bridging
    KAT6A or KAT6B with ING5 and MEAF6, promoting nucleosomal H3 acetylation and context-dependent
    transcriptional coactivation. BRPF1 also forms alternative KAT7/HBO1 complexes
    and helps determine their H3 substrate preference; the KAT subunits perform acetyl
    transfer.
