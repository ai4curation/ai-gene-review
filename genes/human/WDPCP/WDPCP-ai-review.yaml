- id: PMID:27158779
  title: The ciliopathy-associated CPLANE proteins direct basal body recruitment of intraflagellar transport
    machinery.
  findings:
  - statement: Intu, Fuz and Wdpcp form the CPLANE module, which recruits peripheral IFT-A subunits
      to basal bodies; Wdpcp knockdown phenocopies the IFT-A/IFT-B defects.
    supporting_text: Similar effects on IFT-A and IFT-B were observed after Wdpcp knockdown
  - statement: Compound-heterozygous human WDPCP variants were found in an oral-facial-digital patient.
    supporting_text: In one patient, a 5-year-old male presenting with facial dysmorphism, tongue hamartoma,
      high arched palate, tooth abnormalities, and postaxial polydactyly, we found trans-heterozygous
      mutations in WDPCP.
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached (PMC4978421). Experiments are largely in Xenopus multiciliated cells
      and mouse; the human contribution is patient genetics plus variant-stability testing.
- id: PMID:24302887
  title: Wdpcp, a PCP protein required for ciliogenesis, regulates directional cell migration and cell
    polarity by direct modulation of the actin cytoskeleton.
  full_text_unavailable: false
  findings:
  - statement: Mouse Wdpcp localizes to the transition zone, the axoneme, actin stress fibers and focal
      adhesions, and recruits SEPT2, NPHP1 and MKS1.
    supporting_text: These results show Wdpcp is required for recruitment of Mks1 and Nphp1 to the ciliary
      transition zone.
  - statement: IFT88 localization is unaffected in Wdpcp mutant cilia.
    supporting_text: Ift88 distribution in the ciliary axoneme and basal body was unchanged in WdpcpCys40
      mutant MEFs, indicating IFT transport is not disrupted by Wdpcp deficiency
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached (PLoS Biol). The primary mouse loss-of-function study (Cys40 allele)
      with zebrafish morphant data; the main source for localization and septin recruitment.
- id: PMID:35427153
  title: Structure of the ciliogenesis-associated CPLANE complex.
  full_text_unavailable: false
  findings:
  - statement: Human and mouse WDPCP-INTU-FUZ form a structurally resolved complex; the WDPCP C-terminal
      tail binds PIPs.
    supporting_text: Wdpcp engages PIPs via the last 60 C-terminal residues.
  - statement: Human WDPCP carries an ~35-residue N-terminal extension relative to mouse.
    supporting_text: Compared to mouse, the human Wdpcp has an N-terminal extension of ~35 residues that
      is not resolved in the map.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached. Lipid-binding mapping uses mouse subunits plus the human 485-746
      fragment (WT and S708F).
- id: PMID:20671153
  title: Planar cell polarity acts through septins to control collective cell movement and ciliogenesis.
  full_text_unavailable: false
  findings:
  - statement: Xenopus Fritz controls cortical and ciliary septin localization, cell shape during convergent
      extension, and ciliogenesis.
    supporting_text: Thus, Fritz controls cell shape but not polarization during CE
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The experimental source behind the GO_REF:0000024 ISS rows from Xenopus Q32NR9 (same
      PANTHER subfamily SF5). Also the source of the BBS15 disease association in UniProt.
