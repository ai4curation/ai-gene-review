- term:
    id: GO:0001736
    label: establishment of planar polarity
  evidence_type: NAS
  original_reference_id: PMID:27158779
  qualifier: involved_in
  review:
    action: ACCEPT
    summary: WDPCP helps establish planar cell polarity through cytoskeletal organization.
    reason: Mouse loss-of-function analysis links WDPCP-dependent actin and septin organization to polarity
      and directional migration, independently of simply observing a ciliary phenotype.
    supported_by:
    - &id002
      reference_id: PMID:24302887
      supporting_text: 'in Wdpcp-deficient cells, Sept2 was lost from the actin

        cytoskeleton, suggesting Wdpcp is required for Sept2 recruitment to actin

        filaments.'
    - &id005
      reference_id: PMID:24302887
      supporting_text: 'decreased membrane ruffling, failure to establish cell polarity, and loss of

        directional cell migration.'
