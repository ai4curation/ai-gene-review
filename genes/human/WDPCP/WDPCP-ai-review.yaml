id: O95876
gene_symbol: WDPCP
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: WDPCP (fritz homolog, BBS15) is a non-enzymatic WD40 beta-propeller plus alpha-solenoid
  scaffold protein that forms the CPLANE (ciliogenesis and planar polarity effector) complex with INTU
  and FUZ. At the ciliary base and transition zone, CPLANE recruits the peripheral IFT-A subunits to
  basal bodies, and WDPCP is required for transition-zone localization of SEPT2, NPHP1 and MKS1, so its
  loss impairs cilium assembly and cilium-dependent Hedgehog signaling. A second pool at the cell cortex,
  on actin stress fibers and at focal adhesions recruits SEPT2 to actin and supports cortical septin
  organization, cell-shape stability, polarized protrusion and directional migration. Its disordered
  C-terminal tail binds monophosphorylated phosphoinositides, preferring PI(3)P. Biallelic loss-of-function
  variants cause recessive ciliopathies (Bardet-Biedl syndrome 15; congenital heart defects, tongue
  hamartomas and polysyndactyly; oral-facial-digital phenotypes).
