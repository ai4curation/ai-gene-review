- term:
    id: GO:1902017
    label: regulation of cilium assembly
  evidence_type: NAS
  original_reference_id: PMID:27158779
  qualifier: involved_in
  review:
    action: KEEP_AS_NON_CORE
    summary: WDPCP participates in cilium assembly; the evidence does not establish a regulatory role.
    reason: The CPLANE data show WDPCP acting as part of the assembly machinery (recruitment of IFT-A
      and transition-zone proteins). They do not show it modulating the rate or extent of ciliogenesis
      as a regulator. The participation term cilium assembly (GO:0060271) is accepted separately. This
      complex-level NAS is kept as non-core rather than accepted.
    supported_by:
    - reference_id: PMID:27158779
      supporting_text: These data suggest that CPLANE acts by recruiting peripheral IFT-A proteins to
        the basal body for assembly onto the IFT-A core.
- term:
    id: GO:0035869
    label: ciliary transition zone
  evidence_type: ISS
  original_reference_id: PMID:24302887
  qualifier: located_in
  review:
    action: NEW
    summary: WDPCP localizes to the ciliary transition zone, its best-resolved ciliary location.
    reason: Mouse Wdpcp (Q8C456, PTHR13667:SF5, same subfamily as human WDPCP under PAINT node PTN001007408)
      is localized to the transition zone independently of MKS1, and is required there for SEPT2, NPHP1
      and MKS1 recruitment. GOA carries only the more specific axonemal basal plate and the general cilium
      term. The transition zone is the compartment the evidence actually resolves.
    supported_by:
    - reference_id: PMID:24302887
      supporting_text: Wdpcp is localized to the transition zone
    - reference_id: PMID:24302887
      supporting_text: These results show Wdpcp is required for recruitment of Mks1 and Nphp1 to the ciliary
        transition zone.
