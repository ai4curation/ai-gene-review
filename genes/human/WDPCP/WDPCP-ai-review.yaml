- term:
    id: GO:0001736
    label: establishment of planar polarity
  evidence_type: NAS
  original_reference_id: PMID:27158779
  qualifier: involved_in
  review:
    action: ACCEPT
    summary: WDPCP is a PCP effector that executes polarized cytoskeletal organization downstream of core
      PCP proteins.
    reason: Fritz/WDPCP is one of the planar polarity effector proteins first defined in Drosophila wing
      hairs, and the vertebrate orthologs (same PANTHER subfamily PTHR13667:SF5) retain a polarity-effector
      role. Mouse Wdpcp mutants show misoriented cochlear hair-cell stereocilia and lose asymmetric Vangl2,
      and mutant fibroblasts fail to establish polarity, through loss of SEPT2-actin organization. WDPCP
      does some of the work of polarity establishment (it organizes the polarized actin/septin
      cytoskeleton) rather than merely being required for it. Not core PCP signaling, but an effector
      component of the process.
    supported_by:
    - reference_id: PMID:24302887
      supporting_text: Examination of the cochlea of WdpcpCys40 mutants showed the hair cells were disarrayed,
        with some of the chevron misaligned
    - reference_id: PMID:24302887
      supporting_text: decreased membrane ruffling, failure to establish cell polarity, and loss of directional
        cell migration.
    - reference_id: PMID:24302887
      supporting_text: in Wdpcp-deficient cells, Sept2 was lost from the actin cytoskeleton, suggesting
        Wdpcp is required for Sept2 recruitment to actin filaments.
