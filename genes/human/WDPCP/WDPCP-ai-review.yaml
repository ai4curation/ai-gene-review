id: O95876
gene_symbol: WDPCP
product_type: PROTEIN
status: IN_PROGRESS
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: WDPCP is a component of the CPLANE ciliogenesis machinery and a regulator of cytoskeletal
  organization and planar cell polarity. It acts at the ciliary base and in cytoplasmic actin-associated
  pools, helping recruit septins and other proteins required for cilia formation and directional cell
  behavior. Its C-terminal region binds phosphoinositides. Loss of WDPCP disrupts ciliogenesis and embryonic
  patterning.
