- term:
    id: GO:0042073
    label: intraciliary transport
  evidence_type: NAS
  original_reference_id: PMID:27158779
  qualifier: involved_in
  review:
    action: KEEP_AS_NON_CORE
    summary: CPLANE acts upstream of IFT by loading peripheral IFT-A subunits at the basal body; it is
      not part of the moving train.
    reason: Toriyama et al. show that CPLANE, including Wdpcp (knockdown gives similar effects), recruits
      peripheral IFT-A proteins to basal bodies. Without CPLANE the IFT-A core still moves bidirectionally,
      while IFT-B movement is impaired. In mouse Wdpcp mutants, IFT88 distribution is normal. WDPCP
      therefore contributes to assembling IFT particles at the ciliary base, which affects IFT, rather
      than carrying out intraciliary transport itself. The earlier ACCEPT overstated this, so the row
      is downgraded to non-core. No more specific GO process term for basal-body recruitment of IFT-A
      was found.
    supported_by:
    - reference_id: PMID:27158779
      supporting_text: These data suggest that CPLANE acts by recruiting peripheral IFT-A proteins to
        the basal body for assembly onto the IFT-A core.
    - reference_id: PMID:27158779
      supporting_text: Similar effects on IFT-A and IFT-B were observed after Wdpcp knockdown
    - reference_id: PMID:24302887
      supporting_text: Ift88 distribution in the ciliary axoneme and basal body was unchanged in WdpcpCys40
        mutant MEFs, indicating IFT transport is not disrupted by Wdpcp deficiency
