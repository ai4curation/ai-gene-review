  review:
    action: ACCEPT
    summary: An axonemal pool of WDPCP is reported in three vertebrates, in addition to the transition-zone
      pool.
    reason: The earlier review left this UNDECIDED because the transition zone is the best-resolved
      location. On re-reading the full texts, axonemal localization is reported directly in mouse IMCD3
      cells (antibody against endogenous Wdpcp), along zebrafish pronephric cilia (lost in morphants,
      so the antibody is specific), and for Xenopus Fritz along multiciliated-cell axonemes. All three
