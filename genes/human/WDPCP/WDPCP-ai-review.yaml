  review:
    action: KEEP_AS_NON_CORE
    summary: WDPCP is a peripheral, cortex-associated protein; plasma-membrane association is plausible
      but indirect.
    reason: The UniProt "Cell membrane" subcellular location is by similarity to Xenopus Fritz (Q32NR9),
      where Fritz-GFP is concentrated at the cell cortex, and mouse Wdpcp sits on cortical actin and at
      focal adhesions. Its phosphoinositide-binding C-terminal tail provides a plausible mechanism for
      peripheral membrane association. WDPCP has no transmembrane segment. The cortical location (GO:0005938)
      is better supported than an integral plasma-membrane location, so this row is kept as non-core.
    supported_by:
    - reference_id: PMID:20671153
      supporting_text: both sept2 fused to green fluorescent protein (sept2-GFP) and Fritz-GFP were concentrated
        at the cell cortex during CE
    - reference_id: PMID:24302887
      supporting_text: Wdpcp is also found in the cytoplasm, where it is localized in the actin cytoskeleton
        and in focal adhesions.
    - reference_id: PMID:35427153
      supporting_text: Wdpcp engages PIPs via the last 60 C-terminal residues.
