    supporting_text: Belongs to the WD repeat fritz family.
core_functions:
- description: CPLANE scaffold subunit at the ciliary base. It recruits transition-zone proteins (SEPT2,
    NPHP1, MKS1) and, with INTU and FUZ, peripheral IFT-A subunits needed for cilium assembly. Its
    C-terminal tail binds phosphoinositides.
  molecular_function:
    id: GO:0035091
    label: phosphatidylinositol binding
  directly_involved_in:
  - id: GO:0060271
    label: cilium assembly
  - id: GO:0045184
    label: establishment of protein localization
  locations:
  - id: GO:0035869
    label: ciliary transition zone
  - id: GO:0005930
    label: axoneme
  supported_by:
  - reference_id: PMID:24302887
    supporting_text: These results show Wdpcp is required for recruitment of Mks1 and Nphp1 to the ciliary
      transition zone.
  - reference_id: PMID:27158779
    supporting_text: These data suggest that CPLANE acts by recruiting peripheral IFT-A proteins to the
      basal body for assembly onto the IFT-A core.
  - reference_id: PMID:35427153
    supporting_text: Wdpcp engages PIPs via the last 60 C-terminal residues.
- description: A cortical planar polarity effector. It recruits SEPT2 to actin filaments and the cell
    cortex, organizing the septin-actin cytoskeleton for cell-shape stability, polarized protrusion and
    directional migration.
  directly_involved_in:
  - id: GO:0032185
    label: septin cytoskeleton organization
  - id: GO:0001736
    label: establishment of planar polarity
  locations:
  - id: GO:0005938
    label: cell cortex
  supported_by:
  - reference_id: PMID:24302887
    supporting_text: in Wdpcp-deficient cells, Sept2 was lost from the actin cytoskeleton, suggesting
      Wdpcp is required for Sept2 recruitment to actin filaments.
  - reference_id: PMID:20671153
    supporting_text: the ratio of cortical-to-cytoplasmic sept2-GFP was consistently reduced in Fritz
      morphants compared with controls
suggested_questions:
- question: Does the BBS-associated S708F gain of PIP binding in the WDPCP tail alter CPLANE targeting
    to the ciliary base, or its partitioning between the ciliary and cortical pools?
- question: Is a CPLANE complex term (INTU-FUZ-WDPCP) warranted in GO, given the cryo-EM structures
    of the human and mouse complexes?
suggested_experiments:
- description: Express WDPCP lacking its C-terminal 60 residues, or the S708F variant, in WDPCP-null
    ciliated cells and measure transition-zone, basal-body IFT-A and cortical SEPT2 recruitment to test
    whether phosphoinositide binding targets either pool.
