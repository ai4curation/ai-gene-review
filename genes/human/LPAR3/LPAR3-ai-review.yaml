- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  review:
    summary: Retain the inherited broad cytoplasmic context; internal membrane structures belong to cytoplasm.
    action: KEEP_AS_NON_CORE
    reason: GO:0005737 includes subcellular structures other than the plasma membrane and nucleus; it is not synonymous with soluble cytosol. Both actual target lineages descend from positive PTN002733616. Human receptor internalization is directly documented in PMID:26473723; LPAR3 additionally retains intracellular receptor–arrestin associations in PMID:38928196. No target loss of the inherited contextual assertion has been established. Preserve the original is_active_in qualifier without claiming that imaging alone proves a particular endosomal G-protein signaling mechanism. The former objection based solely on seven-transmembrane topology was invalid.
    additional_reference_ids:
    - PMID:26473723
    supported_by:
    - &id001
      reference_id: PMID:26473723
      supporting_text: 'It was also clearly observed that agonists and

