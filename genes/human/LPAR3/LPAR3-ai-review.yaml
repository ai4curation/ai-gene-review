id: Q9UBY5
gene_symbol: LPAR3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: LPAR3 is a class-A seven-transmembrane receptor that recognizes lysophosphatidic acid and activates heterotrimeric G proteins at the plasma membrane. It supports phospholipase-C-dependent calcium mobilization and context-dependent cyclic-nucleotide and ERK responses. Human LPAR3 potentiates forskolin-stimulated cAMP in Sf9 cells and supports Gi2alpha activation in a recombinant mammalian membrane assay; these observations reflect different signaling environments. The receptor preferentially responds to several unsaturated LPA species, although saturated ligands can act in other assay systems. Agonist- and protein-kinase-C-dependent phosphorylation regulate beta-arrestin recruitment and receptor internalization. LPAR3 is expressed in reproductive and other tissues, including human forebrain regions in one Northern-blot study. In mice, Lpar3 signaling contributes to uterine receptivity, embryo spacing and axonal branching. Loss of uterine Lpar3 disrupts implantation timing and spacing; prostaglandin supplementation rescues timing but not spacing. The historical HOFNH30 sequence was proposed as a possible splice variant, but its status as an endogenous LPAR3 protein isoform remains unresolved.
