  supported_by:
  - reference_id: PMID:10488122
    supporting_text: LPAs with an unsaturated fatty acid but not with a saturated fatty acid induced an increase in the [Ca(2+)](i) of EDG7-expressing Sf9 cells, whereas LPAs with both saturated and unsaturated fatty acids elicited a Ca(2+) response in Sf9 cells expressing EDG4.
  - reference_id: PMID:11723223
