    id: GO:0002031
    label: G protein-coupled receptor internalization
  evidence_type: IDA
  original_reference_id: PMID:38928196
  qualifier: involved_in
  review:
    summary: Proposed as a new non-core annotation for directly demonstrated agonist-induced LPAR3 internalization.
    action: NEW
    reason: Human LPAR3 expressed in T-REx HEK293 cells rapidly recruits beta-arrestin after LPA stimulation, and clathrin inhibition markedly reduces receptor internalization. Phosphosite-mutant experiments independently show that receptor phosphorylation is required for efficient beta-arrestin-2 association and uptake. This is a strong receptor-regulatory mechanism but not a separate core ligand-signaling activity.
