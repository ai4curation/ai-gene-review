knowledge_gaps:
- gap_statement: The quantitative Gq/11, Gi/o, and other coupling profile of endogenous human LPAR3 is unresolved across native cell types.
  boundary: Recombinant Sf9 experiments directly show pertussis-toxin-insensitive calcium responses and potentiation of forskolin-induced cAMP accumulation, while UniProt and receptor-focused literature summarize both Gq/11 and Gi/o recruitment. The forskolin-background assay supports adenylate-cyclase modulation but does not isolate a universally activating directional mechanism, and these sources do not provide matched coupling measurements at endogenous receptor abundance in native human tissues.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: Coupling preference determines whether LPAR3 primarily changes calcium, cAMP, or additional second messengers and whether recombinant-cell observations represent physiological signaling.
  resolution: Measure endogenous LPAR3 with parallel Gq/11, Gi/o, Gs, G12/13, beta-arrestin, calcium, and cAMP biosensors across matched ligand-dose and time-course conditions in relevant human cells.
- gap_statement: Native LPAR3 ligand preferences across physiological LPA molecular species are incompletely defined.
  boundary: EDG7/LPAR3 favored unsaturated over saturated LPA species in recombinant Sf9 calcium assays, and recombinant pharmacology identifies ligands and antagonists, but these data do not establish binding affinities or efficacy rankings in native human membranes. VPC12249 is dual LPAR1/LPAR3 and cannot isolate LPAR3 in mixed-receptor systems.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: Molecular-species selectivity may determine tissue responses and therapeutic pharmacology, while nonselective tools can confound receptor attribution.
  resolution: Quantify binding and branch-resolved efficacy for defined LPA species using endogenous LPAR3 knockout/rescue and receptor-selective genetic controls in native human membranes and cells.
- gap_statement: The relationship between the historical HOFNH30 sequence and current human LPAR3 transcripts and proteins remains unresolved.
  boundary: HOFNH30 is 96% identical to EDG7, was described as possibly alternatively spliced, and is functional after heterologous expression, but the current reviewed Q9UBY5 record defines no alternative protein products. The historical sequence therefore cannot be treated as a validated modern isoform.
  gap_kind:
  - BIOLOGY
  - CURATION
  status: OPEN
  significance: Incorrectly promoting HOFNH30 to an isoform would conflate a historical sequence variant with established transcript biology and could distort ligand and tissue comparisons.
  resolution: Reconcile HOFNH30 against current genomic and transcript accessions, then use long-read RNA sequencing and proteogenomics to test whether a corresponding endogenous product exists.
  provenance:
  - reference_id: PMID:10891327
    supporting_text: This receptor has 96% amino acid identity to the Jurkat-T cell-derived EDG7 and could be a splice variant.
- gap_statement: The physiological settings and consequences of LPAR3 phosphorylation, beta-arrestin recruitment, and internalization are not established in native human tissues.
  boundary: Phosphosites, beta-arrestin-2 association, and clathrin-sensitive uptake are directly demonstrated with human LPAR3 constructs in heterologous cells, but native cell-type dependence, recycling, degradation, and signaling resensitization have not been resolved.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: These mechanisms set receptor surface residence and signaling duration and may differ with kinase or arrestin expression across tissues.
  resolution: Endogenously tag LPAR3 in human cells, perturb mapped phosphosites, kinases, beta-arrestin-2, and clathrin, and quantify internalization, recycling, degradation, and branch-specific signaling recovery.
- gap_statement: The physiological relevance of the 53 HuRI binary interaction partners is unknown.
  boundary: The normalized IPI row preserves verified high-throughput binary contacts, but the screen does not establish endogenous coexpression, common receptor mechanism, or one stable complex.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: Orthogonal validation may identify true trafficking or signaling regulators while preventing a large screening set from being mistaken for core function.
  resolution: Prioritize coexpressed candidates in relevant human tissues, verify endogenous proximity and perturbation dependence, and measure effects on ligand binding, surface delivery, coupling, and internalization.
- gap_statement: Whether the uterine implantation and embryo-spacing functions established for mouse Lpar3 are conserved as LPAR3-dependent physiology in humans is unresolved.
  boundary: The reviewed human record reports strongest expression in prostate, testes, pancreas, and heart and moderate expression in lung and ovary, whereas the decisive reproductive physiology comes from female Lpar3-null mice. Mouse loss causes delayed implantation and altered spacing; prostaglandin replacement rescues implantation timing but not spacing. These organism-level phenotypes do not establish an equivalent human developmental role or a new receptor molecular activity.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: Establishing conservation would connect the receptor's tissue distribution to reproductive physiology without over-transferring a mouse knockout phenotype to human LPAR3.
  resolution: Map endogenous LPAR3 in human endometrial cell states across the implantation window and test receptor-specific LPA responses, prostaglandin synthesis, and embryo-attachment support in genetically controlled human endometrial models.
  provenance:
  - reference_id: PMID:15875025
    supporting_text: Targeted deletion of LPA3 in mice resulted in significantly reduced litter size, which could be attributed to delayed implantation and altered embryo spacing.
proposed_new_terms: []
suggested_questions:
- question: What are the quantitative Gq/11, Gi/o, Gs, G12/13, and beta-arrestin coupling profiles of endogenous human LPAR3 in physiologically relevant cells?
- question: Which LPA molecular species bind and activate native LPAR3 most effectively, and which pharmacological tools distinguish LPAR3 from LPAR1?
- question: Does an endogenous transcript or protein corresponding to HOFNH30 exist, or is it a historical sequence variant rather than an LPAR3 isoform?
- question: How do mapped intracellular-loop and C-terminal phosphosites control beta-arrestin recruitment, clathrin-dependent internalization, recycling, and resensitization at endogenous LPAR3 abundance?
- question: Which HuRI contacts, if any, regulate native LPAR3 localization or signaling?
- question: Is the mouse Lpar3-dependent implantation and embryo-spacing program conserved in human endometrium, and which prostaglandin-linked component is receptor dependent?
suggested_experiments:
- hypothesis: Endogenous LPAR3 coupling differs from the pertussis-toxin-insensitive calcium and cAMP responses observed in recombinant Sf9 cells.
  description: CRISPR-tag endogenous LPAR3 in human cell models with native expression and use parallel conformational or BRET biosensors for Gq/11, Gi/o, Gs, G12/13, and beta-arrestin together with calcium and cAMP readouts. Resolve dose and time courses with selective G-alpha knockout and rescue.
  experiment_type: endogenous multiplexed GPCR coupling analysis
- hypothesis: Native LPAR3 retains a measurable preference for unsaturated LPA species, but the rank order differs from heterologous Sf9 calcium assays.
  description: Measure direct binding and branch-resolved efficacy for defined saturated and unsaturated LPA species in native human cells, comparing wild type, LPAR3 knockout, and genomic rescue while controlling LPAR1 and LPAR2 expression.
  experiment_type: receptor-specific native ligand pharmacology
- hypothesis: The historical HOFNH30 sequence is not a routinely expressed alternative LPAR3 protein product.
  description: Map HOFNH30 differences onto the current locus, perform targeted long-read RNA sequencing across reported tissues, and search isoform-discriminating peptides by targeted proteomics before comparing recombinant function.
  experiment_type: transcript and proteoform reconciliation
- hypothesis: Mapped intracellular-loop and C-terminal phosphorylation sites encode distinct beta-arrestin recruitment, internalization, and recycling kinetics.
  description: Introduce precise phosphosite-cluster substitutions at endogenous LPAR3 and quantify agonist-dependent phosphorylation, beta-arrestin-2 recruitment, clathrin dependence, endocytosis, recycling, degradation, and signaling resensitization.
  experiment_type: endogenous phosphosite-resolved receptor trafficking
- hypothesis: Only a small subset of HuRI partners affects LPAR3 receptor biology under native coexpression.
  description: Rank partners by tissue coexpression and membrane compatibility, validate endogenous proximity with orthogonal assays, then perform knockout/add-back and quantify LPA binding, surface abundance, coupling bias, and internalization.
  experiment_type: endogenous interaction-screen triage
- hypothesis: Human endometrial LPAR3 controls a prostaglandin-linked implantation program analogous to the implantation-timing component of the mouse Lpar3-null phenotype.
  description: Profile LPAR3 across the human endometrial cycle by single-cell transcript and spatial protein measurements, then perturb LPAR3 genetically in primary endometrial organoids or assembloids. Quantify LPA-dependent prostaglandin synthesis, receptivity markers, and embryo-attachment support with rescue by receptor re-expression and PGE2 or prostacyclin analogues. Treat embryo spacing as a mouse-specific outcome unless independently demonstrated in an appropriate human model.
  experiment_type: human endometrial receptor physiology and mouse-to-human conservation test
