- id: PMID:10488122
  title: Molecular cloning and characterization of a novel human G-protein-coupled
    receptor, EDG7, for lysophosphatidic acid.
  findings:
  - statement: A cloned human EDG7 cDNA encodes a specific LPA-responsive GPCR with a ligand profile distinct from LPAR1 and LPAR2.
    supporting_text: In this study, we isolated a human cDNA encoding a novel G-protein-coupled receptor, designated EDG7, and characterized it as a cellular receptor for LPA.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  - statement: In recombinant Sf9 cells, unsaturated LPA species activate EDG7-dependent calcium mobilization and potentiate forskolin-driven cAMP accumulation through pertussis-toxin-insensitive signaling.
    supporting_text: Neither the EDG7- nor EDG4-transduced Ca(2+) response or cAMP accumulation was inhibited by pertussis toxin.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  - statement: EDG7 did not mediate LPA-stimulated MAP kinase activation in the tested PC12-cell context.
    supporting_text: In PC12 cells, EDG4 but not EDG2 or EDG7 mediated the activation of MAP kinase by LPA.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Foundational primary human cloning and receptor-characterization paper. Functional results derive from recombinant Sf9 and PC12 systems and should not be generalized to every native human cell context.
- id: PMID:10891327
  title: Identification of an EDG7 variant, HOFNH30, a G-protein-coupled receptor for
    lysophosphatidic acid.
  findings:
  - statement: HOFNH30 is a 354-residue human EDG7-like sequence that the authors proposed could represent a splice variant.
    supporting_text: This receptor has 96% amino acid identity to the Jurkat-T cell-derived EDG7 and could be a splice variant.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  - statement: RT-PCR distinguished placenta expression of HOFNH30 from the highest EDG7 expression in prostate.
    supporting_text: RT-PCR analysis demonstrated that HOFNH30 mRNA is expressed in placenta whereas EDG7 mRNA shows highest expression in prostate.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  - statement: Recombinant HOFNH30 responds to LPA with calcium mobilization and MAPK phosphorylation in RBL-2H3 cells.
    supporting_text: LPA also induced phosphorylation of mitogen-activated protein kinase (p42(MAPK) and p44(MAPK)) in HOFNH30-transfected but not vector-transfected RBL-2H3 cells.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary evidence for the historical HOFNH30 sequence and its recombinant activity. The paper says it "could be" a splice variant; the reviewed UniProt record does not define an alternative isoform, so isoform status remains unconfirmed.
- id: PMID:11723223
  title: 'Activity of 2-substituted lysophosphatidic acid (LPA) analogs at LPA receptors:
    discovery of a LPA1/LPA3 receptor antagonist.'
  findings:
  - statement: Recombinant LPA receptors show sharply different activity profiles for 2-substituted LPA analogs, consistent with a spatially restrictive ligand-binding pocket.
    supporting_text: Analysis of this series at each recombinant LPA receptor using a guanosine 5'-O-(3-[35S]thio)triphosphate (GTP[gamma35S]) binding assay revealed sharp differences in activity.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  - statement: VPC12249 is a competitive antagonist shared by LPAR1 and LPAR3 rather than an LPAR3-selective probe.
    supporting_text: One compound with a bulky hydrophobic group (VPC12249) was a dual LPA1/LPA3 competitive antagonist.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct recombinant receptor pharmacology supporting ligand-pocket selectivity and a useful antagonist boundary; VPC12249 cannot distinguish LPAR3 from LPAR1.
- id: PMID:15875025
  title: LPA3-mediated lysophosphatidic acid signalling in embryo implantation and
    spacing.
  findings:
  - statement: Targeted deletion of mouse Lpar3 reduces litter size through delayed implantation and altered embryo spacing.
    supporting_text: Targeted deletion of LPA3 in mice resulted in significantly reduced litter size, which could be attributed to delayed implantation and altered embryo spacing.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  - statement: The implantation and spacing defects lead to delayed embryonic development, shared hypertrophic placentas, and embryonic death in the mouse knockout.
    supporting_text: These two events led to delayed embryonic development, hypertrophic placentas shared by multiple embryos and embryonic death.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  - statement: Lpar3-deficient mouse uteri have reduced preimplantation COX2 and the implantation-critical prostaglandins PGE2 and PGI2.
    supporting_text: An enzyme demonstrated to influence implantation, cyclooxygenase 2 (COX2) (ref. 5), was downregulated in LPA3-deficient uteri during pre-implantation. Downregulation of COX2 led to reduced levels of prostaglandins E2 and I2 (PGE2 and PGI2), which are critical for implantation.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  - statement: Prostaglandin replacement rescues implantation timing but not embryo spacing in Lpar3-deficient mice.
    supporting_text: Exogenous administration of PGE2 or carbaprostacyclin (a stable analogue of PGI2) into LPA3-deficient female mice rescued delayed implantation but did not rescue defects in embryo spacing.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Decisive in vivo mouse knockout evidence for Lpar3-dependent implantation timing and embryo spacing, with a COX2-prostaglandin link. It supports ortholog physiology and pathway context, not direct proof of the same role in humans.
- id: PMID:26473723
  title: Phosphorylation and Internalization of Lysophosphatidic Acid Receptors LPA1,
    LPA2, and LPA3.
  findings:
  - statement: Agonist-activated recombinant LPAR3 raises intracellular calcium and undergoes homologous desensitization in C9 cells.
    supporting_text: Agonist-activation increases intracellular calcium concentration in a concentration-dependent fashion.
    full_text_unavailable: false
    reference_section_type: ABSTRACT
  - statement: LPA and PKC activation induce phosphorylation and internalization of LPAR3 as well as LPAR1 and LPAR2.
    supporting_text: Lysophosphatidic acid and phorbol myristate acetate were able to induce LPA1-3 phosphorylation, in time- and concentration-dependent fashions. It was also clearly observed that agonists and protein kinase C activation induced internalization of these receptors.
    full_text_unavailable: false
    reference_section_type: ABSTRACT
  - statement: LPA-receptor-driven ERK activation in this system depends substantially on EGFR transactivation.
    supporting_text: Activation of LPA1-3 receptors induced ERK 1/2 phosphorylation; this effect was markedly attenuated by inhibition of epidermal growth factor receptor tyrosine kinase activity, suggesting growth factor receptor transactivation in this effect.
    full_text_unavailable: false
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct comparative signaling, phosphorylation, desensitization, and internalization study in transfected C9 rat hepatocyte cells; it establishes receptor regulation but not native human-tissue behavior.
- id: PMID:32296183
  title: A reference map of the human binary protein interactome.
  findings:
  - statement: HuRI interaction candidates were generated by systematic yeast two-hybrid screening, pairwise retesting, and sequence confirmation rather than targeted LPAR3 mechanistic experiments.
    supporting_text: To map the reference interactome, we performed nine screens of Space III, followed by pairwise verification by quadruplicate retesting and sequence confirmation.
    full_text_unavailable: false
    reference_section_type: RESULTS
  - statement: Most HuRI interactions were recovered in only one screen, so individual LPAR3 partners remain screen-level candidates without context-specific functional validation.
    supporting_text: These results reinforce previous observations12,22 that the protein interactome might be dominated by weaker and more transient PPIs that are difficult to detect, as indicated by the fact that the majority of PPIs in HuRI were found in only one screen (Extended Data Fig. 3h, i).
    full_text_unavailable: false
    reference_section_type: RESULTS
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Valid high-throughput binary-interaction map underlying many IntAct partner rows. The paper does not narratively validate LPAR3 partners or receptor-signaling consequences, so curator provenance should be preserved while mechanistic interpretation remains cautious.
- id: PMID:34201414
  title: 'The LPA(3) Receptor: Regulation and Activation of Signaling Pathways.'
  findings:
  - statement: The review synthesizes LPAR3 as coupling mainly to Gαq/11 and Gαi/o while emphasizing that regulation and trafficking were poorly resolved at the time.
    supporting_text: 'The LPA3 receptor is a GPCR whose activation mainly promotes the recruitment of two G proteins: Gαq/11 and Gαi/o; therefore, it is considered promiscuous.'
    full_text_unavailable: false
    reference_section_type: INTRODUCTION
  - statement: The review explicitly cautions that then-current models of LPAR3 phosphorylation-dependent trafficking were largely hypothetical.
    supporting_text: Similarly, the LPA3 receptor internalization process is essentially unexplored. Therefore, we have to assume that the molecular consequences of phosphorylation in signaling and intracellular location/trafficking are similar to those observed for other receptors.
    full_text_unavailable: false
    reference_section_type: DISCUSSION
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Useful receptor-focused synthesis and gap source, but mechanistic claims are secondary and newer primary phosphorylation/internalization studies supersede its 2021 trafficking uncertainty.
- id: PMID:38791546
  title: 'LPA(3) Receptor Phosphorylation Sites: Roles in Signaling and Internalization.'
  findings:
  - statement: Mutating phosphorylation sites in both intracellular loop 3 and the C-terminal tail nearly abolishes LPAR3 phosphorylation.
    supporting_text: Agonist- and LPA-mediated receptor phosphorylation was diminished in the IL3 and Ctail mutants and essentially abolished in the IL3/Ctail mutant, confirming that the main phosphorylation sites are present in both domains and their role in receptor phosphorylation eliminated by substitution and distributed in both domains.
    full_text_unavailable: false
    reference_section_type: ABSTRACT
  - statement: These phosphorylation-site mutations strongly impair β-arrestin-2 recruitment and LPAR3 internalization.
    supporting_text: LPA and PMA-induced receptor interaction with β-arrestin 2 and LPA3 internalization were severely diminished in cells expressing the mutants.
    full_text_unavailable: false
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct mutational evidence linking mapped phosphorylation regions to β-arrestin recruitment and internalization in T-REx HEK293 cells; phenotypic effects remain heterologous-cell-context evidence.
- id: PMID:38928196
  title: 'Lysophosphatidic Acid Receptor 3 (LPA3): Signaling and Phosphorylation Sites.'
  findings:
  - statement: LPA stimulates pertussis-toxin-insensitive calcium mobilization and ERK phosphorylation through recombinant LPAR3.
    supporting_text: The agonist, lysophosphatidic acid (LPA), increased intracellular calcium and ERK phosphorylation through pertussis toxin-insensitive processes.
    full_text_unavailable: false
    reference_section_type: ABSTRACT
  - statement: LPA drives rapid β-arrestin association and clathrin-sensitive internalization of LPAR3.
    supporting_text: Pitstop 2 (clathrin heavy chain inhibitor) markedly reduced LPA-induced receptor internalization; in contrast, phorbol ester-induced internalization was only delayed. LPA induced rapid β-arrestin-LPA3 receptor association.
    full_text_unavailable: false
    reference_section_type: ABSTRACT
  - statement: Mass spectrometry maps LPAR3 phosphorylation to residues in intracellular loop 3 and the C-terminal tail.
    supporting_text: Phosphorylated residues were detected in the intracellular loop 3 (S221, T224, S225, and S229) and in the carboxyl terminus (S321, S325, S331, T333, S335, Y337, and S343).
    full_text_unavailable: false
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct signaling, phosphorylation-site, β-arrestin, and trafficking study using T-REx HEK293 expression; strong mechanism evidence with an explicit heterologous-system boundary.
