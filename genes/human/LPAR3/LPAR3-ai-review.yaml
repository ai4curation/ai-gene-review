      supporting_text: "Pitstop 2 (clathrin heavy chain inhibitor) markedly reduced LPA-induced receptor internalization; in contrast, phorbol ester-induced internalization was only delayed. LPA induced rapid \u03B2-arrestin-LPA3 receptor association."
