  review:
    summary: Proposed as a new non-core annotation for directly demonstrated agonist-induced LPAR3 internalization.
    action: NEW
    reason: 'Retain the pre-existing proposal on active recruitment grounds: human LPAR3 binds/recruits beta-arrestin after stimulation, and full PMID:38791546 Fig.4–8 associates receptor phosphosite changes with reduced recruitment and uptake. Thus the proposed contribution is the receptor docking interface that assembles endocytic machinery, not merely its being cargo. Live comparator checks found the exact process absent on LPAR1 and ADRB2 but present on human DRD2 via rat Drd2 IDA PMID:14617818, so absence is not uniform across same-role receptors. No LPAR3 entry was found in the local GO-CAM index. Live is_a/part_of ancestors show no overlap with the source GPCR-signaling/calcium process terms. This does not establish the receptor as a vesicle-formation enzyme or every phosphorylation mutant as a clean loss of one contact.'
    supported_by:
