id: Q9UBY5
gene_symbol: LPAR3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  LPAR3 is a class-A seven-transmembrane G protein-coupled receptor that binds
  extracellular lysophosphatidic acid at the plasma membrane and converts ligand
  occupancy into heterotrimeric G-protein signaling. In recombinant Sf9 cells,
  human EDG7/LPAR3 preferentially responds to unsaturated rather than saturated LPA
  species, raises cytosolic calcium, and potentiates forskolin-induced cAMP
  accumulation; the calcium and cAMP responses are pertussis-toxin insensitive in
  that system. This demonstrates adenylate-cyclase modulation but does not by itself
  establish a universally activating directional mechanism. LPAR3 has been reported
  to couple to Gq/11 and Gi/o proteins, although their relative contributions in
  native human tissues have not been quantified. MAP-kinase output is also model
  dependent: founding experiments found no EDG7-driven MAPK activation in PC12
  cells, whereas later transfected-cell studies detected ERK signaling with an
  epidermal-growth-factor-receptor-transactivation component. LPAR3 signaling is
  regulated by agonist- and protein-kinase-C-dependent phosphorylation,
  beta-arrestin-2 recruitment, and clathrin-sensitive internalization demonstrated
  with human receptor constructs in heterologous cells. Reported human tissue
  expression is strongest in prostate, testes, pancreas, and heart, moderate in lung
  and ovary, and undetectable in brain or several other surveyed tissues. LPAR3 has
  also been associated with ovarian-cancer development, although its causal role and
  mechanism remain unresolved. In mice, germline Lpar3 deletion causes delayed
  implantation and altered embryo spacing, with the defect traced to the uterus and
  downstream placental and embryonic consequences; prostaglandin replacement rescues
  implantation timing but not spacing. This reproductive physiology provides a model
  for possible human roles, which remain unresolved. The historical
  HOFNH30 sequence is 96% identical to EDG7 and was proposed as a possible splice
  variant, but it remains unconfirmed as an endogenous LPAR3 protein isoform.
