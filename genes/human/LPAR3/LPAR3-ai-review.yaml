        comment: GO:0051928 explicitly includes movement within a cell, so intracellular calcium release qualifies without requiring plasma-membrane influx. Full human LPAR3 PMID:38928196 compares calcium-containing/free buffers and PLC inhibition with thapsigargin controls, supporting predominant intracellular mobilization. The exact rat donor Q8K5E0 has experimental PMID:11340076 evidence for extracellular influx in microglia, a different cellular context. Neither result requires replacing the transport term merely because another assay measures cytosolic concentration.
