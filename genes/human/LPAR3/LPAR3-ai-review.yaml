- description: Directly recognizes lysophosphatidic acid as the extracellular ligand-binding step of LPAR3 signaling. The founding recombinant-cell assay shows stronger calcium responses to unsaturated than saturated LPA molecular species, but this assay preference is not generalized into an absolute native-tissue selectivity rule and does not imply binding to unrelated lipid classes.
