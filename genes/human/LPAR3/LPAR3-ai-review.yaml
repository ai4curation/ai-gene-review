core_functions:
- description: LPA-activated receptor signaling at the plasma membrane engages G-alpha proteins and elevates cytosolic calcium through intracellular mobilization. Recombinant human LPAR3 also potentiates forskolin-stimulated cAMP in Sf9 cells, while mammalian Gi2alpha reconstitution demonstrates ligand-driven nucleotide loading. The relative cyclic-nucleotide, calcium and ERK outputs depend on cellular signaling partners. Conditional activating capacity is retained without asserting a universal direction or Gs coupling.
  molecular_function:
