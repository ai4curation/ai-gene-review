suggested_questions:
- question: How broadly does the B3GAT3 bypass observed in tested human cells operate across
    cell types and proteoglycan substrates, and how much residual GAG synthesis reflects variant
    activity versus compensation?
- question: How do loss of catalytic activity and failure of Golgi delivery separately determine
    the effects of individual B3GALT6 variants?
- question: Which direct B3GALT6 experiments establish metal requirements independently of the
    historical switched-cDNA citation flagged in UniProt?
suggested_experiments:
- description: Compare purified wild-type and pathogenic B3GALT6 variants on defined phosphorylated
    and unphosphorylated Gal-Xyl acceptors, measuring protein integrity and product linkage
    separately from trafficking.
- description: Measure linker composition and GAG output in matched human B3GALT6-deficient
    cells with controlled B3GAT3 abundance, alongside wild-type rescue and enzyme-dead controls,
    to distinguish residual synthesis from compensation.
