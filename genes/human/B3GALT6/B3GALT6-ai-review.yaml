description: B3GALT6 is a Golgi type II membrane glycosyltransferase, also called galactosyltransferase
  II. It transfers galactose from UDP-galactose to galactose-beta-1,4-xylose attached to a proteoglycan
  core protein, forming the second galactose and third sugar of the common glycosaminoglycan
  linker. This reaction supports efficient synthesis of heparan sulfate, chondroitin sulfate
  and dermatan sulfate proteoglycans. Its catalytic domain faces the Golgi lumen, with enrichment
  in medial Golgi cisternae. Biallelic loss-of-function variants disrupt proteoglycan glycanation
  and cause skeletal and connective-tissue disorders, including spondylodysplastic Ehlers-Danlos
  syndrome and spondyloepimetaphyseal dysplasia with joint laxity.
