- id: PMID:29449551
  title: Mutations in CFAP43 and CFAP44 cause male infertility and flagellum defects
    in Trypanosoma and human.
  findings:
  - statement: A CFAP43-mutated human patient has profound sperm axoneme disorganization,
      including central-pair loss; mouse disruption corroborates the flagellar architectural
      requirement.
    supporting_text: the absence of the CPC
  - statement: Endogenous tagged Trypanosoma CFAP43 and CFAP44 localize along the
      axoneme. Their doublet-5/6 positioning relative to a paraflagellar rod is not
      automatically transferred to human cilia.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Genuine full primary cache; selected Results/Figures 2, 4–7 and
      relevant construct/localization Methods read. Human patient sperm, mouse knockout
      and tagged Trypanosoma proteins are kept distinct. Q57WH1 is CFAP44; Q580P9
      is the CFAP43 assayed in the same paper.
- id: PMID:31884020
  title: CFAP43 modulates ciliary beating in mouse and Xenopus.
  findings:
  - statement: Mouse Cfap43 loss increases tracheal beat frequency while decreasing
      bead transport. Gross respiratory-cilium structure can remain intact, separating
      beat regulation from sperm architectural requirements.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Normal cache is abstract-only. Selected publisher-indexed primary
      Results, tracheal imaging Methods and Movie S4/S5 legends were also accessed;
      direct page opening later returned 403. No complete PDF or all figures were
      inspected. Mouse and Xenopus experiments are not relabeled as human assays.
- id: PMID:29514928
  title: The I1 dynein-associated tether and tether head complex is a conserved regulator
    of ciliary motility.
  findings:
  - statement: Tetrahymena fap43 knockout removes the tether/tether-head structure
      while averaged I1 dynein and other axonemal components appear retained.
    supporting_text: both the tether and tether head structures were missing
  - statement: Tagged termini and structural analyses support FAP43/FAP44 complex
      organization; they do not demonstrate that human CFAP43 is an ATPase or universally
      required for inner-arm assembly.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
