suggested_questions:
- question: How do the five human CFAP43 products differ in tether/tether-head incorporation
    and in respiratory versus sperm axonemes?
  experts: []
- question: Which CFAP43 surfaces couple tether deformation to dynein coordination,
    and which interactions are conserved between human cilia and protist models?
  experts: []
- question: Why does CFAP43 loss cause severe sperm axoneme disorganization while
    respiratory axonemes can retain gross structure but beat at an altered frequency?
  experts: []
suggested_experiments:
- description: Introduce sequence-defined, expression-matched CFAP43 product rescues
    in human airway cultures, measuring axonemal incorporation, cryo-electron-tomographic
    architecture, ciliary waveform, beat frequency and bead transport separately.
- description: Test structure-guided CFAP43 interface substitutions that retain overall
    expression and ciliary entry, then measure tether/tether-head incorporation and
    dynein coordination. Compare these separation-of-function mutants with complete
    loss rather than inferring a motor mechanism from immotility alone.
