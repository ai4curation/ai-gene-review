      localization, tagging and strains Methods read. Tetrahymena and Chlamydomonas
      findings remain species-specific; algal FAP244 redundancy explains retained
      tether structures in many fap43 repeats.
- id: PMID:29687140
  title: Ciliary proteins Fap43 and Fap44 interact with each other and are essential
