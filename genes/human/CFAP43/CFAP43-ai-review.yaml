id: Q8NDM7
gene_symbol: CFAP43
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CFAP43 is a conserved axonemal protein with an N-terminal WD-repeat region
  and an extended C-terminal coiled-coil region. Together with CFAP44 it forms the
  tether/tether-head complex associated with inner dynein arm f and the doublet microtubule
  surface. Its structural integration links axonemal organization to coordinated ciliary
  beating. Human respiratory axoneme structures identify CFAP43 in this machinery,
  while human infertility and mouse loss-of-function studies establish a requirement
  for normal sperm flagellar architecture and motility. Respiratory cilia can remain
  assembled while their beat frequency and fluid transport are altered. The relative
  requirements for this complex vary across tissues and organisms, and the functional
  differences among the five human alternative products remain unresolved.
