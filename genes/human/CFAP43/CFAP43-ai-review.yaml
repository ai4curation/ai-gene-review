core_functions:
- description: CFAP43 contributes to the tether/tether-head complex with CFAP44 along
    the axonemal doublet microtubule surface, providing a structural connection within
    inner-dynein-arm docking machinery. Native human respiratory-axoneme models identify
    the canonical-sequence protein; detailed algal and bovine contacts remain species-scoped.
    This structural role supports coordinated ciliary movement and sperm axoneme organization.
    Respiratory cilia may remain assembled while their beat frequency and transport
    change; severe sperm architectural defects therefore do not imply a universal
    failure of cilium initiation.
  molecular_function:
    id: GO:0005200
    label: structural constituent of cytoskeleton
  directly_involved_in:
