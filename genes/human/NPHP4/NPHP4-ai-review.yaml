core_functions:
- description: Central component of the NPHP (NPHP1-4-8) transition-zone module, located at the distal
    transition zone close to the membrane. It is an essential part of the ciliary barrier that controls
    membrane and soluble protein entry into the cilium, and it acts redundantly with the MKS module in
    transition-zone membrane attachment. No specific molecular activity has been defined.
  directly_involved_in:
  - id: GO:1904491
    label: protein localization to ciliary transition zone
  locations:
  - id: GO:0035869
    label: ciliary transition zone
  - id: GO:0036064
    label: ciliary basal body
  in_complex:
    id: GO:1990957
    label: NPHP complex
  supported_by:
  - *id005
  - *id011
  - *id012
  - *id013
- description: At epithelial cell-cell junctions, NPHP4 is required with NPHP1 for timely tight-junction
    formation and apical organization during epithelial morphogenesis.
  directly_involved_in:
  - id: GO:1903348
    label: positive regulation of bicellular tight junction assembly
  locations:
  - id: GO:0005911
    label: cell-cell junction
  supported_by:
  - *id009
  - *id014
  - *id003
suggested_questions:
- question: Does NPHP4 bind membrane lipids directly through its C2-like domains, which would explain
    how it holds the distal transition zone against the ciliary membrane?
- question: Are the Wnt (JADE1) and Hippo (LATS1) regulatory roles of NPHP4 carried out by the transition-zone
    pool or by separate cytoplasmic or nuclear pools?
suggested_experiments:
- description: Use liposome flotation and lipid-strip assays with purified NPHP4 C2-like domains to test
    for direct phosphoinositide or membrane binding.
- description: Use human NPHP4-null RPE1 cells with combined MKS-module depletion and fluorescence recovery
    after photobleaching of ciliary membrane reporters to test whether the Chlamydomonas barrier function
    of NPHP4 is conserved in mammals.
