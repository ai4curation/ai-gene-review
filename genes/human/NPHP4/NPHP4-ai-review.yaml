- question: Does human NPHP4 contribute to transition-zone Y-link assembly only when the MKS module is
    compromised (as in C. elegans), or does it have an independent structural role in mammalian TZs?
  experts: []
- question: Are the Wnt (JADE1), Hippo (LATS1/TAZ) and anti-viral (VZV restriction, PMID:40739040) activities
    of NPHP4 carried out by the TZ pool or by distinct cytoplasmic/nuclear/junctional pools?
  experts: []
suggested_experiments:
- hypothesis: NPHP4 bridges NPHP1 and RPGRIP1L at the TZ and is required for the integrity of the distal
    TZ barrier in mammalian cells.
  description: In NPHP4 knockout RPE1 cells, rescue with wild-type NPHP4 or NPHP1-binding/RPGRIP1L-binding
    deficient mutants (including SLSN patient variants); measure NPHP1/RPGRIP1L TZ recruitment, ciliary
    exclusion of large soluble proteins (size-dependent diffusion assays) and Y-link ultrastructure by
    cryo-ET.
  experiment_type: knockout rescue + barrier assay
