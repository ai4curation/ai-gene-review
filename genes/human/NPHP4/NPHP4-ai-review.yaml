gene_symbol: NPHP4
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'NPHP4 (nephrocystin-4, nephroretinin) is a large, conserved, soluble protein built from
  repeated C2-like and immunoglobulin-like domains. It lies at the distal ciliary transition zone close
  to the membrane and at the basal body, centrosome and epithelial cell-cell junctions. NPHP4 is the central
  member of the NPHP1-4-8 (NPHP) module: it binds NPHP1 directly and links it to RPGRIP1L. In Chlamydomonas,
  NPHP4 is an essential part of the transition-zone barrier that controls the membrane and soluble protein
  composition of the cilium. In C. elegans, NPHP-4 acts redundantly with the MKS module to attach the
  basal body and transition zone to the membrane and to build the ciliary gate. At junctions, NPHP4 supports
  timely tight-junction formation and epithelial morphogenesis. Through Inturned and DAAM1 it organizes
  the subapical actin network of multiciliated cells. It also regulates signaling: it stabilizes JADE1
  and moves it to the nucleus to inhibit canonical Wnt signaling, and it controls PYK2-dependent phosphorylation
  of NPHP1. NPHP4 mutations cause nephronophthisis type 4 and Senior-Loken syndrome.'
