id: O75161
gene_symbol: NPHP4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'NPHP4 (nephrocystin-4, nephroretinin) is a large, evolutionarily conserved protein of the
  ciliary transition zone and the hub of the NPHP module: it binds NPHP1 and RPGRIP1L (NPHP8) directly
  and bridges them into the NPHP1-4-8 complex. NPHP4 sits in the distal part of the transition zone near
  the ciliary membrane, distal to CEP290, and is required for transition-zone recruitment of NPHP1. Acting
  partly redundantly with the MKS module, it establishes basal body/transition zone membrane attachments
  (Y-links) and forms an essential part of the ciliary barrier that controls membrane and soluble protein
  entry into cilia. Pools at the basal body/centrosome and at epithelial tight junctions support epithelial
  morphogenesis and the subapical actin network of multiciliated cells (via Inturned-DAAM1). NPHP4 also
  dampens canonical Wnt signalling by stabilizing JADE1 and modulates Hippo signalling via LATS1/TAZ.
  Mutations cause nephronophthisis type 4 and Senior-Loken syndrome; RPGRIP1-dependent targeting of NPHP4
  to the photoreceptor connecting cilium is needed for photoreceptor survival.'
