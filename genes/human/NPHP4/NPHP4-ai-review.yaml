- term:
    id: GO:1905349
    label: ciliary transition zone assembly
  evidence_type: ISS
  original_reference_id: PMID:21422230
  qualifier: involved_in
  review:
    summary: C. elegans NPHP-4, redundantly with MKS-module proteins, is required to form transition-zone
      Y-links and basal body/TZ membrane attachments. Chlamydomonas NPHP4 is a stable distal-TZ component
      essential for the barrier. Human NPHP4 is the orthologous NPHP-module hub.
    action: NEW
    reason: 'Participation test: NPHP4 is a structural TZ component whose loss (with an MKS-module mutation)
      removes Y-links and TZ-membrane connections. It supplies part of the structure being assembled and
      anchors NPHP1, so it is not merely upstream-necessary (scaffold case). GO:1905349 replaces the obsoleted
      GO:0097711 and is annotated to very few genes (CEP290, CCDC66, DZIP1L), so absence for NPHP-module
      proteins reflects an under-populated term. This matches the module assignment of TZ assembly to
      the NPHP module. Evidence is from orthologs, hence ISS.'
    additional_reference_ids:
    - PMID:25150219
    supported_by:
    - &id015
      reference_id: PMID:21422230
      supporting_text: mks-6;nphp-4 and mks-5;nphp-4 double mutants exhibit mispositioned and disrupted
        TZ regions, with clear disconnections between the BB/TZ region and membrane, accompanied by missing
        Y-links
    - &id016
      reference_id: PMID:21422230
      supporting_text: Specifically, MKS/MKSR/NPHP proteins establish basal body/TZ membrane attachments
        before or coinciding with intraflagellar transport-dependent axoneme extension and subsequently
        restrict accumulation of nonciliary components within the ciliary compartment.
    - *id007
