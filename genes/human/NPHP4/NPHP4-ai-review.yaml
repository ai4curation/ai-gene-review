    label: structural molecule activity
  evidence_type: NAS
  original_reference_id: PMID:12006559
  qualifier: enables
  review:
    summary: NAS citing Donaldson et al. 2002, a study of nephrocystin-1 (NPHP1) domains.
    action: REMOVE
    reason: The cited paper analyses NPHP1, not NPHP4; its abstract concerns nephrocystin only. Nothing
      shows NPHP4 contributing to the structural integrity of a complex, as opposed to bridging partners.
      Its demonstrated molecular role is adaptor/bridging within the NPHP1-4-8 module (see the MODIFY
      of the Sang et al. protein binding rows).
    supported_by:
    - reference_id: PMID:12006559
      supporting_text: Analysis of nephrocystin amino acid sequences from human and other species revealed
        three distinct conserved domains including Src homology 3 and coil-coil domains in the N-terminal
        region, as well as a large highly conserved C-terminal region bearing no obvious homology to other
        proteins and hence referred to as the "nephrocystin homology domain" (NHD).
