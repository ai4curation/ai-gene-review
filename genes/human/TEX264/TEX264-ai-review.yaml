- description: 'Adaptor that delivers the p97 ATPase and the SPRTN metalloprotease to topoisomerase 1 cleavage
    complexes. A nuclear pool of TEX264, concentrated at the nuclear periphery and present on nascent DNA, binds
    TOP1 through a surface in and around its GyrI-like domain (point mutants such as E194A lose TOP1 binding and
    fail to clear adducts) and binds p97 through an SHP box in its disordered C-terminus, holding the two together.
    Two SUMO-interacting motifs let it also recognise SUMO1-conjugated TOP1. Bridging is required in cells: without
    TEX264, far less TOP1 co-purifies with either p97 or SPRTN, endogenous TOP1 cleavage complexes accumulate,
    forks slow and cells become camptothecin-sensitive. TEX264 performs no catalysis here, and bulk DNA-protein
    crosslink clearance is unaffected by its loss, so the activity is adaptor-type and TOP1-specific.'
