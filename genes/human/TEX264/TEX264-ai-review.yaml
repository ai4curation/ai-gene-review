suggested_questions:
- question: Should GO:0160247 autophagy cargo adaptor activity be used for membrane-embedded selective-autophagy
    receptors such as TEX264, RETREG1 and CCPG1 as well as for soluble adaptors such as CALCOCO1, or does the
    receptor class need a distinct child term?
- question: Several ER-phagy receptors carry GO:0038023 signaling receptor activity from papers that use the word
    'receptor' in the cargo sense. Is a systematic sweep of GO:0038023 annotations on selective-autophagy receptors
    warranted now that GO:0160247 exists?
- question: TEX264 is the only ER-phagy receptor with a documented second, chromatin-based function. Would a GO-CAM
    model of TOP1cc repair (TEX264 bridging p97 and SPRTN to TOP1, upstream of TDP1) be useful, and does GO:0106300
    need causal structure to represent the adaptor step separately from the proteolytic and phosphodiesterase
    steps?
suggested_experiments:
- hypothesis: The chromatin-associated pool of TEX264 is a form that lacks the N-terminal membrane anchor, generated
    either by proteolysis or by an unannotated transcript.
  description: Raise antibodies to the C-terminus and run quantitative immunoblots of ER, nuclear and chromatin
    fractions looking for a faster-migrating species; test for proteolytic release by inhibiting candidate proteases
    and by pulse-chase; and look for an alternative transcript by 5' RACE and long-read sequencing of TEX264 mRNA,
    with ribosome profiling to check for an internal start. If a distinct form exists, knock in a tag at the internal
    start and test whether it alone rescues TOP1cc clearance in TEX264-null cells.
  experiment_type: Biochemical fractionation, immunoblotting, 5-prime RACE and long-read RNA sequencing, ribosome
    profiling, knock-in rescue
- hypothesis: ER-phagy and TOP1cc repair are independent functions of TEX264, separable by mutation.
  description: Reconstitute TEX264-null cells with separation-of-function mutants (F273A/L276A, which abolishes
    LC3B binding; the SHP-box deletion, which abolishes p97 binding; E194A, which abolishes TOP1 binding) and
    measure both ER-phagy flux reporters and TOP1cc levels by RADAR for each. Full separation in both directions
    would show the activities are independent; any cross-dependence would indicate coupling, for example ER-phagy
    supplying the nuclear pool or buffering camptothecin sensitivity.
  experiment_type: Separation-of-function rescue with ER-phagy flux reporters and RADAR TOP1cc assays
- hypothesis: The GyrI-like domain binds a ligand or an ER cargo determinant that directs which ER subdomains
    TEX264 commits to autophagy.
  description: Solve or model the structure of the cytosolic region and screen the GyrI-like pocket for bound
    small molecules by native mass spectrometry and thermal-shift assays against metabolite libraries; in parallel,
    compare the ER proteins stabilised in TEX264-null cells with those stabilised in cells reconstituted with
    pocket mutants, to test whether the domain contributes to cargo selection rather than only to TOP1 binding.
  experiment_type: Structural analysis, native mass spectrometry, thermal-shift ligand screening, quantitative
    proteomics of ER-phagy cargo
knowledge_gaps:
- gap_statement: How the TOP1cc-repair pool of TEX264 reaches chromatin is unknown. The protein is anchored in
    the ER membrane by a signal-anchor at residues 7-31, yet it is recovered in the chromatin fraction and at
    replication forks, and no mechanism for releasing it from the membrane and no transmembrane-free form has
    been demonstrated.
  boundary: 'Established: TEX264 is a type III ER membrane protein; a subpopulation is nuclear, concentrated at
    the nuclear periphery and recovered on nascent DNA by iPOND; deleting residues 1-33 redistributes it into
    the cytoplasm and nucleoplasm, where it still co-localises with nascent DNA, SPRTN foci and TOP1ccs. Not established:
    whether the nuclear pool is anchored in the inner nuclear membrane, proteolytically released, or translated
    from an unannotated transcript lacking the anchor.'
  gap_kind:
  - BIOLOGY
  dark_aspect: CC_DARK
  status: OPEN
  significance: Determines whether the ER-phagy and TOP1cc-repair activities are exercised by one protein pool
    or two, and therefore whether ER-phagy flux and genome stability are mechanistically coupled through TEX264.
    It also decides whether the reviewed UniProt entry is missing a functional form.
  provenance:
  - reference_id: PMID:32152270
    supporting_text: There may otherwise be a mechanism of releasing TEX264 from the nuclear envelope or alternative
      TEX264 isoforms which lack the LRR.
    reference_section_type: DISCUSSION
  - reference_id: PMID:32152270
    supporting_text: We found that TEX264 is present in the cytosol, nucleus, and on chromatin
    reference_section_type: RESULTS
- gap_statement: Why TEX264 is required to clear TOP1 cleavage complexes but dispensable for clearing DNA-protein
    crosslinks in general is unknown, even though SPRTN handles both.
  boundary: 'Established: TEX264 depletion raises endogenous TOP1ccs and delays their resolution, is epistatic
    with TDP1, and strongly reduces the SPRTN-TOP1 interaction, yet total DNA-protein crosslinks do not accumulate
    when TEX264 is lost, unlike when SPRTN is. Not established: what distinguishes TOP1 adducts from other SPRTN
    substrates such that only the former need a dedicated adaptor, and whether other adaptors serve the remaining
    crosslink classes.'
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: Substrate selection is the main unsolved problem in DNA-protein crosslink repair, and TEX264 is
    the clearest example of a lesion-specific adaptor; resolving it would show how SPRTN is aimed and whether
    TOP1cc repair can be targeted selectively in camptothecin-resistant tumours.
  provenance:
  - reference_id: PMID:32152270
    supporting_text: depletion of TEX264, unlike SPRTN, did not cause total DPCs to accumulate, suggesting that
      TEX264 may specifically promote SPRTN-dependent TOP1cc repair
    reference_section_type: RESULTS
  - reference_id: PMID:32152270
    supporting_text: we find that TEX264 fulfils this role by forming a complex with the p97 ATPase and the SPRTN
      metalloprotease
    reference_section_type: ABSTRACT
- gap_statement: What the six-residue lumenal N-terminus and the GyrI-like domain contribute to ER-phagy is unknown.
    The GyrI-like fold is the protein's only structured cytosolic module and in bacteria the family binds small
    molecules and inhibits gyrase, but no ligand, and no role in cargo selection, has been identified for it on
    the ER side.
  boundary: 'Established: the LIR motif and the length of the disordered region account for receptor function,
    and the GyrI-like surface is the TOP1-binding site used in the nuclear function. Not established: whether
    the same surface selects or senses anything in the ER, or whether the domain is an evolutionary carry-over
    repurposed for TOP1 binding.'
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: Would say whether TEX264 selects particular ER subdomains or cargo, or simply tethers whatever
    ER is nearby, which is the central open question about ER-phagy receptor specificity.
  provenance:
  - reference_id: PMID:31006537
    supporting_text: TEX264 contains an N-terminal hydrophobic segment and a cytosolic gyrase inhibitor (Gyrl)-like
      domain followed by an unstructured C-terminal region.
    reference_section_type: INTRODUCTION
  - reference_id: file:human/TEX264/TEX264-uniprot.txt
    supporting_text: The disordered region is required for autophagosome binding and reticulophagy, probably via
      bridging the long distance between endoplasmic reticulum and autophagosome membranes
    reference_section_type: DATABASE_ENTRY
