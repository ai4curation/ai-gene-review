- id: GO_REF:0000107
  title: Automatic transfer of experimentally verified manual GO annotation data to orthologs using Ensembl Compara
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Ensembl Compara ortholog transfer for the autophagosome membrane and ER rows, from mouse UniProtKB:E9Q137.
      Both restate claims the human protein already carries by IDA.
- id: PMID:25416956
  title: A proteome-scale map of the human interactome network.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Rolland et al. proteome-scale human interactome map; cited by GOA only for a bare GO:0005515
      row with TMEM79. Correctly cited, but a large-scale binary screen with no functional follow-up for TEX264,
      so it is background rather than evidence of function.
- id: PMID:31006537
  title: TEX264 Is an Endoplasmic Reticulum-Resident ATG8-Interacting Protein Critical for ER Remodeling during
    Nutrient Stress.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Full text cached (PMC6747008). An et al., Mol Cell 2019; one of the two papers that identified
      TEX264 as an ER-phagy receptor. Verified against the cached record: the TEX264 identification, the LIR dependence,
      the three-way-junction trafficking and the ER-protein stabilisation in knockout cells are all in the text
      quoted here. Note that the cached title/abstract for this PMID is the An et al. paper; PMID:31006538 is
      the Chino et al. companion.'
- id: PMID:31006538
  title: Intrinsically Disordered Protein TEX264 Mediates ER-phagy.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Chino et al., Mol Cell 2019, the companion paper; abstract only in the cache (full_text_available:
      false), so the imaging and localisation panels behind the MGI and GO_Central rows were not read. The claims
      used here (TEX264 as ER-phagy receptor, single TM plus LIR, deletion blocking ER-phagy, IDR requirement,
      LC3 and GABARAP family binding) are all stated in the abstract. Experimental rows from this paper were accepted
      or repointed on term grounds, never removed for lack of visible evidence.'
  full_text_unavailable: true
- id: PMID:31515488
  title: Extensive disruption of protein interactions by genetic variants across the allele frequency spectrum
    in human populations.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Interaction-perturbation screen across the allele-frequency spectrum; cited for the same bare
      TMEM79 binding row. Correctly cited; tests variant effects on interactions, not TEX264 function.
- id: PMID:32152270
  title: TEX264 coordinates p97- and SPRTN-mediated resolution of topoisomerase 1-DNA adducts.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Full text cached (PMC7062751). Fielden et al., Nat Commun 2020; establishes the second, TOP1cc-repair
      function. Verified against the cached record for every claim used: in vitro bridging of p97 and TOP1, the
      SHP box, the GyrI-like TOP1-binding surface and E194A, the two SIMs and SUMO1 selectivity, the cytosol/nucleus/chromatin
      fractionation, iPOND recovery at forks, and the finding that bulk DPCs do not accumulate on TEX264 loss.'
- id: PMID:32296183
  title: A reference map of the human binary protein interactome.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: HuRI reference map of the human binary interactome; the source of 26 bare GO:0005515 rows on
      this entry. Correctly cited and methodologically sound, but none of the pairs has functional follow-up for
      TEX264, and the partners are predominantly membrane proteins of the kind that recur in such screens.
- id: PMID:34524948
  title: Global Proximity Interactome of the Human Macroautophagy Pathway.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Proximity interactome of the human macroautophagy pathway; the source of the GABARAPL2 row.
      Relevant because the partner is an ATG8-family protein and the map was built over the autophagy machinery,
      which is why that row was repointed to an ATG8-engagement function rather than removed. Proximity labelling
      does not establish direct binding.
- id: Reactome:R-HSA-481007
  title: Exocytosis of platelet alpha granule contents
  reference_review:
    relevance: LOW
    correctness: UNVERIFIED
    review_notes: Reactome 'Exocytosis of platelet alpha granule contents', the source of the extracellular region
      and platelet alpha granule lumen rows. The cached entry holds only the event summary with no participant
      list, so TEX264's membership could not be checked; marked UNVERIFIED for that reason. The locations themselves
      are inconsistent with the protein's topology, which is recorded as a SUSPECTED source defect with requested_change
      CHECK on the alpha-granule row.
