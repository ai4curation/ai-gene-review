- term:
    id: GO:0005576
    label: extracellular region
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-481007
  qualifier: located_in
  review:
    summary: Extracellular region, TAS from the Reactome platelet alpha-granule exocytosis event. TEX264 is a
      type III ER membrane protein, not a secreted one.
    action: MARK_AS_OVER_ANNOTATED
    reason: TEX264 has no secretable ectodomain. UniProt places only residues 1-6 in the lumen, with a signal-anchor
      at 7-31 and the whole of 32-313 cytosolic, so the protein cannot be a soluble alpha-granule cargo and is
      not a secreted protein. The likely origin of these rows is the legacy identification of the gene as a putative
      secreted protein (Zsig11), which UniProt still carries as an AltName and whose original deposit it flags
      for erroneous initiation. Marked over-annotated rather than removed because the cached Reactome entry holds
      only the event summary, with no participant list to inspect, so the possibility that platelet proteomics
      placed TEX264 in a granule membrane could not be excluded.
    supported_by:
    - reference_id: file:human/TEX264/TEX264-uniprot.txt
      supporting_text: Single-pass type III membrane protein
      reference_section_type: DATABASE_ENTRY
      record_section:
