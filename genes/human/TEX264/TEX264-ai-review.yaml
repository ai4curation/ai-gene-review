      supporting_text: TEX264 interacts with LC3 and GABARAP family proteins more efficiently and is expressed
        more ubiquitously than previously known ER-phagy receptors.
      full_text_unavailable: true
      reference_section_type: ABSTRACT
    - reference_id: PMID:31006538
      supporting_text: A long intrinsically disordered region of TEX264 is required for its ER-phagy receptor
