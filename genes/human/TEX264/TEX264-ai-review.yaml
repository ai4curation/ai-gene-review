id: Q9Y6I9
gene_symbol: TEX264
aliases:
- ZSIG11
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'TEX264 is a small single-pass endoplasmic reticulum membrane protein that serves as the major receptor
  for selective autophagy of the ER (reticulophagy, or ER-phagy) in mammalian cells, and separately as the adaptor
  that targets the p97 ATPase and the SPRTN metalloprotease to trapped topoisomerase 1-DNA adducts. Its topology
  is unusual and underlies both activities: six residues face the ER lumen, a signal-anchor crosses the membrane,
  and the remaining ~280 residues are cytosolic, comprising a GyrI-like (gyrase-inhibitor-like) domain and a long
  intrinsically disordered tail that ends in an LC3-interacting region. During nutrient stress the LIR binds ATG8-family
  proteins (MAP1LC3A/B, GABARAP, GABARAPL1) on a nascent phagophore that typically engages ER tubules at three-way
  junctions, while the disordered region spans the gap between the two membranes, so ER fragments are captured
  and delivered to lysosomes. TEX264 loss alone profoundly blocks ER-phagy and stabilises a broad cohort of ER
  proteins during starvation, making it more central to this process than the earlier-described receptors RETREG1/FAM134B,
  RTN3, SEC62 and CCPG1. A nuclear pool of the protein, concentrated at the nuclear periphery and recovered on
  nascent DNA, performs a mechanistically unrelated job: the GyrI-like surface binds topoisomerase 1 (both unmodified
  and SUMO1-conjugated, the latter through two SUMO-interacting motifs) while an SHP box binds p97, bridging the
  two so that p97 remodels the adduct and SPRTN cleaves it upstream of the phosphodiesterase TDP1. Cells lacking
  TEX264 accumulate endogenous TOP1 cleavage complexes, replicate more slowly and are sensitised to camptothecin,
  although bulk DNA-protein crosslinks are cleared normally, so the repair role is specific to TOP1 adducts. The
  protein was originally mis-identified as a secreted protein (Zsig11) on bioinformatic grounds; it has no ectodomain
  and is not secreted.'
