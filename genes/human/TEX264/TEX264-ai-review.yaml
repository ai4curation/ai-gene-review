core_functions:
- description: 'ER-phagy cargo receptor. As an integral ER membrane protein, TEX264 presents a cytosolic LC3-interacting
    region (residues 273-276) that binds ATG8-family proteins on the apposed phagophore membrane, while its long
    intrinsically disordered region spans the distance between the ER and the autophagosomal membrane, which is
    otherwise occupied by ribosomes. The result is capture of ER subdomains, typically tubular segments near three-way
    junctions, into autophagosomes that then fuse with lysosomes. TEX264 is the quantitatively dominant receptor
    for this process: its deletion alone profoundly blocks ER-phagy and stabilises a large cohort of ER proteins
    during nutrient stress, and it acts independently of RETREG1/FAM134B, RTN3, SEC62 and CCPG1.'
  supported_by:
  - reference_id: PMID:31006538
    supporting_text: identified TEX264 as a receptor for autophagic degradation of the endoplasmic reticulum (ER-phagy)
    full_text_unavailable: true
