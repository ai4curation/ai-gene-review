  evidence_type: IPI
  original_reference_id: PMID:31006538
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q9GZQ8
  review:
    summary: 'Protein binding with MAP1LC3B (Q9GZQ8). This is the functional interaction: the LIR motif at 273-276
      binds LC3, and F273A or L276A abolishes it.'
    action: MODIFY
    reason: The cited paper supports a far more informative molecular function than bare binding. TEX264 holds
      ER membrane against the phagophore by binding ATG8-family proteins through its LIR, with the long disordered
      region acting as the spacer, which is exactly GO:0160247 autophagy cargo adaptor activity (the same term
      this repository uses for CALCOCO1). The mutagenesis evidence is on this row's own paper, so the deeper term
      is supported here and not borrowed.
    proposed_replacement_terms:
    - &id001
      id: GO:0160247
      label: autophagy cargo adaptor activity
    supported_by:
