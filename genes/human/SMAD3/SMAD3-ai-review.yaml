  original_reference_id: PMID:18729074
  review:
    summary: SMAD3 self-association is supported by biochemical studies of SMAD assembly. Identical protein binding
      does not specify that all physiological complexes are dimers; phosphorylated R-SMADs also participate in trimers.
    action: ACCEPT
    reason: SMAD3 self-association is supported by biochemical studies of SMAD assembly. Identical protein binding
      does not specify that all physiological complexes are dimers; phosphorylated R-SMADs also participate in trimers.
    supported_by:
    - reference_id: PMID:9111321
      supporting_text: We now show that Smad3 and Smad4 associate in homomeric and heteromeric interactions, as
        assessed by yeast two-hybrid and coimmunoprecipitation analyses.
    - reference_id: PMID:15350224
      supporting_text: Both complexes are heterotrimers, comprising two phosphorylated R-Smad subunits and one Smad4
        subunit, a finding that was corroborated by isothermal titration calorimetry and mutational studies.
