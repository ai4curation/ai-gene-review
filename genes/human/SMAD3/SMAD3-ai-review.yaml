- description: SMAD3 directly binds regulatory DNA and activates or represses RNA polymerase II transcription in
    cooperation with promoter-specific transcriptional partners. The same R-SMAD participates in TGF-beta, activin
    and nodal responses; context-dependent signaling may also operate without SMAD4.
