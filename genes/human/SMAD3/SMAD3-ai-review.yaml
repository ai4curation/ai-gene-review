        truncated at their carboxy termini, hMAD-3 and -4 act as dominant-negative inhibitors of the normal TGF-beta
        response.
- term:
    id: GO:0042803
    label: protein homodimerization activity
  evidence_type: IPI
  original_reference_id: PMID:8774881
  review:
    summary: SMAD3 self-association is established, but the precise homodimer stoichiometry is not resolved from
      the accessible source.
    action: UNDECIDED
    reason: The primary interaction studies establish homomeric association, while structural work describes R-SMAD
      homotrimers and heterotrimers. Neither observation alone settles the more specific homodimerization assertion.
      Keep identical protein binding accepted and leave this experimental stoichiometric claim unresolved rather
      than overrule it from an abstract.
    supported_by:
    - reference_id: PMID:9111321
      supporting_text: We now show that Smad3 and Smad4 associate in homomeric and heteromeric interactions, as
        assessed by yeast two-hybrid and coimmunoprecipitation analyses.
    - reference_id: PMID:15350224
      supporting_text: Both complexes are heterotrimers, comprising two phosphorylated R-Smad subunits and one Smad4
        subunit, a finding that was corroborated by isothermal titration calorimetry and mutational studies.
- term:
    id: GO:0043235
    label: receptor complex
  evidence_type: IMP
  original_reference_id: PMID:8774881
  review:
    summary: SMAD3 transiently associates with the TGF-beta receptor complex. Zhang et al. (1996) showed that hMAD-3
      (SMAD3) was phosphorylated and associated with the ligand-bound receptor complex (PMID:8774881). Nakao et
      al. (1997) confirmed that SMAD3 interacts with the activated TGF-beta type I receptor (PMID:9311995).
    action: KEEP_AS_NON_CORE
    reason: Valid but SMAD3 is not a permanent constituent of the receptor complex. SMAD3 transiently associates
      with the activated TGF-beta type I receptor for phosphorylation and then dissociates. The primary localization
      of SMAD3 is cytoplasm (basal) and nucleus (activated). This CC annotation is technically correct but could
      be misleading about stable residency.
    supported_by:
    - reference_id: PMID:8774881
      supporting_text: hMAD-3 but not hMAD-4 was phosphorylated and associated with the ligand-bound receptor complex.
