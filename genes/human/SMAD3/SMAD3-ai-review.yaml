id: P84022
gene_symbol: SMAD3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SMAD3 is a receptor-regulated SMAD transcription factor that relays TGF-beta, activin and nodal signals
  from activated serine/threonine kinase receptors to the nucleus. Receptor-mediated C-terminal phosphorylation
  promotes SMAD complex assembly, including heteromeric complexes with SMAD4. Its MH1 domain directly recognizes
  regulatory DNA, while its MH2 domain mediates interactions with receptors, other SMADs and transcriptional partners.
  Nuclear SMAD3 activates or represses target genes according to its binding partners and cellular context; some
  responses occur independently of SMAD4. It regulates cell growth and differentiation, extracellular matrix production,
  epithelial plasticity and immune responses. SMAD3 also participates in context-dependent post-transcriptional
  regulation, including primary microRNA processing and stabilization of beta-catenin. It shuttles between cytoplasmic
  and nuclear compartments, and pathogenic variants cause a heritable aortopathy within the Loeys-Dietz syndrome
  spectrum.
