    id: GO:0005518
    label: collagen binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  review:
    summary: The study reports collagen I, III and V interactions with SMAD3 MH2 and weaker binding to full-length
      SMAD3 by yeast two-hybrid and GST pull-down assays. This is actual binding evidence, not merely regulation
      of collagen gene expression. Retain as an experimentally motivated, context-dependent interaction without
      implying that SMAD3 is normally an extracellular collagen receptor.
    action: KEEP_AS_NON_CORE
    reason: The study reports collagen I, III and V interactions with SMAD3 MH2 and weaker binding to full-length
      SMAD3 by yeast two-hybrid and GST pull-down assays. This is actual binding evidence, not merely regulation
      of collagen gene expression. Retain as an experimentally motivated, context-dependent interaction without
      implying that SMAD3 is normally an extracellular collagen receptor.
