    label: negative regulation of cell growth
  evidence_type: IDA
  original_reference_id: PMID:8774881
  review:
    summary: SMAD3 mediates TGF-beta-induced growth inhibition. Zhang et al. (1996) demonstrated that hMAD-3 (SMAD3)
      and hMAD-4 (SMAD4) synergize to induce TGF-beta-like responses including growth arrest, and that C-terminally
      truncated forms act as dominant-negative inhibitors of normal TGF-beta response (PMID:8774881).
    action: KEEP_AS_NON_CORE
    reason: Well-supported by early functional studies. TGF-beta-induced growth inhibition is a major biological
      outcome of SMAD3 signaling, but is a downstream cellular response rather than a core molecular or signaling
      function. SMAD3 mediates this through transcriptional regulation of cell cycle inhibitors like p15INK4b and
      p21.
