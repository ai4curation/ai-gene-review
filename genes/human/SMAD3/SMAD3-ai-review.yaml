- id: file:human/SMAD3/SMAD3-deep-research-falcon.md
  title: SMAD3 deep research report (Falcon)
  findings:
  - statement: Summarizes SMAD3 MH1/MH2 architecture, receptor-regulated activation and transcriptional context.
      Primary sources adjudicate source-specific claims and update the older SMAD2 DNA-binding simplification.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Read as background. Primary studies are used for the final decisions; the report's suggestion
      that the SMAD2 insertion restricts DNA binding is interpreted in light of full-length SMAD2 DNA-binding evidence
      in PMID:31582430.
