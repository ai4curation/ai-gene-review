id: Q14156
gene_symbol: EFR3A
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: EFR3A (protein EFR3 homolog A; KIAA0143) is a non-enzymatic, all-alpha-helical
  ARM/HEAT-repeat scaffold that sits on the cytoplasmic face of the plasma membrane. It is
  anchored there by palmitoylation of an N-terminal cysteine cluster (Cys6-Cys9), assisted by a
  conserved basic patch that binds acidic phospholipids. Its disordered C terminus folds into a
  three-helix element on binding the TTC7-FAM126 subcomplex of the phosphatidylinositol 4-kinase
  type III alpha (PI4KA) complex, so EFR3A tethers the PI4KA-TTC7-FAM126 assembly to the plasma
  membrane, where PI4KA generates the plasma-membrane pool of phosphatidylinositol 4-phosphate,
  the precursor of PI(4,5)P2. EFR3A does not contact PI4KA directly and has no catalytic activity
  of its own. It is partly redundant with its paralog EFR3B. Depletion of EFR3A and EFR3B together
  alters desensitization of G protein-coupled receptors such as AGTR1, probably as an indirect
  consequence of altered plasma-membrane phosphoinositide homeostasis. Rare missense variants have
  been reported in autism spectrum disorder cohorts.
