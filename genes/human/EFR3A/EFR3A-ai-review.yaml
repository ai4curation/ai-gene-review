  label: Homo sapiens
description: EFR3A is a palmitoylated peripheral membrane scaffold that helps anchor the PI4KA phosphatidylinositol
  4-kinase complex to the plasma membrane. Its N-terminal cysteine cluster is required for membrane localization,
  allowing the complex to maintain plasma-membrane phosphatidylinositol 4-phosphate.
