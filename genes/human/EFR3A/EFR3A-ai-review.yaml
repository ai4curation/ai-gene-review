  review:
    summary: Ensembl Compara transfer of a SynGO annotation of mouse Efr3a (PMID:30867420). In that
      study, halving or presynaptically deleting Efr3a prevented amyloid-beta oligomers from
      depleting presynaptic PI(4,5)P2 and lowering release probability; Efr3a was used as a tool to
      dampen Gq-coupled GPCR (mGluR5) responsiveness.
    action: REMOVE
    reason: I read the full text of PMID:30867420. It shows that Efr3a dosage modifies a
      pathology-induced loss of release probability, through the GPCR/PIP2 axis, in APP/PS1 mice and
      Abeta-treated slices. It does not show that EFR3A does any step of synaptic vesicle priming
      (e.g. Munc13/Munc18-dependent SNARE assembly), nor does it report a baseline priming defect.
      EFR3A's molecular role is to tether PI4KA at the plasma membrane in all cell types, so any
      effect on priming acts several steps away, via lipid supply. PAINT propagated plasma membrane
      and protein localization to plasma membrane at PTN000278197 but not this term. A process this
      indirect should not be propagated to the human protein. The mouse SynGO source annotation
      would need a separate donor-side review.
    supported_by:
