core_functions:
- description: Palmitoylated plasma-membrane scaffold that binds the TTC7-FAM126 subcomplex through
    its C terminus and so tethers the PI4KA phosphatidylinositol 4-kinase complex to the plasma membrane,
    supporting synthesis of the plasma-membrane PI4P pool.
  molecular_function:
    id: GO:0043495
    label: protein-membrane adaptor activity
  directly_involved_in:
  - id: GO:0072659
    label: protein localization to plasma membrane
  - id: GO:0180048
    label: phosphatidylinositol 4-phosphate biosynthetic process
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:39705356
    supporting_text: Complex disrupting mutations in TTC7B, FAM126A, and EFR3 decrease PI4KA recruitment
      to the plasma membrane.
  - reference_id: PMID:23229899
    supporting_text: These data suggest that EFR3 is a peripheral membrane protein whose posttranslational
      lipidation enables its localization to membranes and its function in PI4KIIIα-mediated PtdIns4P
      synthesis at the plasma membrane.
suggested_questions:
- question: Does EFR3A have functions distinct from EFR3B (tissue distribution, palmitoylation dynamics,
    TTC7A versus TTC7B preference), or are the paralogs fully interchangeable in PI4KA recruitment?
- question: Is the reported EFR3A-flotillin-2 association and effect on membrane order (PMID:37880612)
    independent of PI4KA-dependent PI4P supply?
- question: Isoform 2 (Q14156-2) lacks residues 1-36, which contain the palmitoylated Cys6-Cys9 cluster.
    Is this isoform expressed as protein, and if so is it cytosolic and
    unable to recruit PI4KA, acting as a dominant-negative or as a cytosolic pool?
- question: Should the mouse SynGO synaptic vesicle priming and glutamatergic synapse annotations for
    Efr3a (PMID:30867420) be revisited, given that the data show a disease-model modifier effect rather
    than participation in priming?
suggested_experiments:
- description: Single EFR3A knockout (with EFR3B intact) versus double knockout in neurons, measuring
    plasma-membrane PI4P and PI(4,5)P2 with biosensors and baseline readily-releasable pool size, to
    test whether EFR3A has a direct, non-redundant presynaptic role.
