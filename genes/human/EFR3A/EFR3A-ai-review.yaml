  review:
    summary: EFR3A tethers the PI4KA complex to the plasma membrane and so supports PI4KA-mediated
      synthesis of the plasma-membrane PI4P pool.
    action: MODIFY
    reason: EFR3A takes part in PI4P synthesis in the scaffold sense of CLAUDE.md. It has no
      catalytic activity, but it supplies the membrane anchorage that the PI4KA step needs, and
      interface-disrupting EFR3 mutations reduce PI4KA recruitment. The phosphoinositide that
      depends on EFR3 is specifically PI4P (PI4KA makes PI4P; PI(4,5)P2 is made by PIP5Ks), so the
      precise child term GO:0180048 phosphatidylinositol 4-phosphate biosynthetic process (is_a
      GO:0046854) is supported and preferred.
