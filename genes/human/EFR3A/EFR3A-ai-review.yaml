- id: PMID:23229899
  title: "PtdIns4P synthesis by PI4KIIIα at the plasma membrane and its impact on plasma membrane\
    \ identity."
  findings:
  - statement: Human EFR3A is palmitoylated on its N-terminal Cys6-Cys9 cluster, which is required for
      plasma-membrane localization; EFR3 is part of an evolutionarily conserved PI4KIIIalpha complex
      that targets the kinase to the plasma membrane.
    supporting_text: we show that PI4KIIIα was targeted to the plasma membrane as part of an evolutionarily
      conserved complex containing Efr3/rolling blackout, which we found was a palmitoylated peripheral
      membrane protein.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached; primary source for palmitoylation-dependent localization and the
      PI4KA-recruitment role of EFR3A/EFR3B.
