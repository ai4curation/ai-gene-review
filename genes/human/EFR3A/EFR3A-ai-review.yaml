- term:
    id: GO:0043495
    label: protein-membrane adaptor activity
  evidence_type: IDA
  original_reference_id: PMID:39705356
  qualifier: enables
  review:
    summary: EFR3A binds the plasma membrane through its palmitoylated N terminus and conserved basic
      patch, and binds the TTC7B-FAM126A subcomplex through its C terminus (Kd about 23.5 nM),
      tethering the PI4KA complex to the membrane. This is exactly protein-membrane adaptor activity.
    action: NEW
    reason: GOA has no molecular function for EFR3A beyond generic protein binding. The cryo-EM/HDX-MS
      structure plus interface mutagenesis (PMID:39705356) shows a direct EFR3A-TTC7B/FAM126A
      interface needed for PI4KA plasma-membrane recruitment. Membrane anchoring has been shown by
      palmitoylation-site mutagenesis in human EFR3A (PMID:23229899) and by basic-patch mutagenesis
      of mouse EFR3A (PMID:24360784; mouse Efr3a is in the same PANTHER subfamily, PTHR12444:SF1).
      This activity is what links the existing process rows (protein localization to plasma
      membrane, PI4P synthesis) to a mechanism. As a comparator check, the PomBase GO-CAM
      gomodel:663d668500002178 gives S. pombe efr3 GO:0043495 in the same role (noted in
      modules/phosphoinositide_biosynthesis.yaml), so the term is the established convention for
      this scaffold role. Yeast Efr3 is placed by PANTHER in a separate family (PTHR47766), so that
      precedent is about curation convention, not phylogenetic transfer; the human evidence is
      direct.
    supported_by:
    - reference_id: PMID:39705356
      supporting_text: The EFR3A C terminus undergoes a disorder-order transition upon binding to the
        PI4KA complex, with an unexpected direct interaction with both TTC7B and FAM126A.
    - reference_id: PMID:39705356
      supporting_text: Complex disrupting mutations in TTC7B, FAM126A, and EFR3 decrease PI4KA recruitment
        to the plasma membrane.
    - reference_id: PMID:24360784
      supporting_text: A conserved basic patch in Efr3, which binds acidic phospholipids, anchors the
        complex to the plasma membrane.
