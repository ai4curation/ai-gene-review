- term:
    id: GO:0004857
    label: enzyme inhibitor activity
  evidence_type: TAS
  original_reference_id: PMID:9545573
  qualifier: enables
  review:
    summary: >-
      Human PAP41/PRPSAP2 is a close paralog of human PAP39 and rat PAP41 that
      lacks the PRPP-binding site. Rat PRPP synthetase aggregates contain 39-
      and 41-kDa PAP proteins, and eliminating the PAP proteins increased
      catalytic PRS activity.
    action: ACCEPT
    reason: >-
      The TAS row is consistent with the original biochemical evidence for
      inhibitory PAP proteins in the PRPP synthetase complex and with the PAINT
      enzyme-regulator assignment to the PRPSAP node. PAP41-specific evidence is
      weaker than PAP39-specific evidence, but the combined rat PAP evidence,
      human PAP41 orthology and PRPSAP clade-level PAINT curation support a
      core inhibitory/regulatory role.
    additional_reference_ids:
    - PMID:8132556
    - file:interpro/panther/PTHR10210/PTHR10210-paint.tsv
    supported_by:
