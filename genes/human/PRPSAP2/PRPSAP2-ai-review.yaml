id: O60256
gene_symbol: PRPSAP2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  PRPSAP2 encodes phosphoribosyl pyrophosphate synthase-associated protein 2
  (PAP41), a PRPS-like but non-catalytic associated subunit of the cytoplasmic
  PRPP synthase machinery. It is the close paralog of PRPSAP1/PAP39 and belongs
  to the PRPSAP clade that diverged from catalytic ribose-phosphate
  diphosphokinases. PRPSAP2 binds PRPS1, PRPS2 and PRPSAP1 and is inferred to
  regulate PRPP synthesis by the catalytic PRPS enzymes rather than to produce
  5-phosphoribose 1-diphosphate itself.
