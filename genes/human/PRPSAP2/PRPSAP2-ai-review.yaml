    summary: >-
      InterPro2GO annotation from the broad ribose-phosphate diphosphokinase
      signature to the magnesium cofactor used by catalytic PRPS enzymes.
    action: REMOVE
    reason: >-
      PRPSAP2 is the non-catalytic PAP41 subunit; the human cDNA paper noted
