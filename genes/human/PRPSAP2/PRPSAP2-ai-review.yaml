  review:
    summary: >-
      New annotation placing PRPSAP2 in the ribose phosphate diphosphokinase
      complex.
    action: NEW
    reason: >-
      Human AP-MS screens repeatedly recover PRPSAP2 with PRPSAP1 and catalytic
