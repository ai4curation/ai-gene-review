suggested_questions:
- question: Which human BOLA3–GLRX5 cluster-transfer routes predominate in cells, and how
    do they relate to NFU1, ISCA1/ISCA2 and individual Fe-S clients? What explains the reported
    disagreement about direct binding of isolated BOLA3 to NFU1 between the 2016 MST assays
    and later studies summarized in PMID:34063696? Reconstitution and yeast loss/rescue data
    do not establish the exclusive human route.
- question: Can the target-specific records for the HuRI BOLA3 partners and the BOLA3–FAAP100
    interaction be examined to distinguish validated physical interactions from physiological
    functions?
suggested_experiments:
- description: Test cluster-transfer and LIAS-maturation phenotypes using human BOLA3 depletion
    and rescue with wild-type and defined variants, while measuring the relevant complex and
    Fe-S clients separately.
  hypothesis: Variant-dependent effects on BOLA3 cluster handling alter late Fe-S protein
    maturation; the relative cellular contribution of the reconstituted GLRX5–BOLA3–NFU1 route
    remains testable.
