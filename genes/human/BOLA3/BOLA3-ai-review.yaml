  title: Gene Ontology annotation based on curation of immunofluorescence data
  findings: []
- id: GO_REF:0000120
  title: Combined Automated Annotation using Multiple IEA Methods
  findings: []
- id: PMID:22746225
  title: BOLA1 is an aerobic protein that prevents mitochondrial morphology changes induced
    by glutathione depletion.
  findings:
  - statement: The available paper body primarily characterizes BOLA1; its Introduction discusses
      BOLA3 in mitochondrial Fe-S biogenesis. Results and Methods are missing from the cache,
      so BOLA3-specific localization was not independently re-read.
- id: PMID:27499296
  title: Mitochondrial Protein Interaction Mapping Identifies Regulators of Respiratory Chain
    Function.
  findings:
  - statement: Mitochondrial protein interaction mapping underlies the curated BOLA3–GLRX5
      IPI. The target table is not present in the available abstract/Introduction cache; the
      same interaction is corroborated by the human biochemical studies cited separately.
- id: PMID:27532772
  title: Mitochondrial Bol1 and Bol3 function as assembly factors for specific iron-sulfur
    proteins.
  findings:
  - statement: Yeast genetics places mitochondrial Bol1/Bol3 in late Fe-S protein maturation,
      with a major LIAS-related phenotype; the authors explicitly leave aspects of the biochemical
      mechanism unresolved.
  - statement: Direct human-protein measurements establish BOLA3 complexes with GLRX5, with
      distinct holo-complex behavior from BOLA1.
  - statement: Microscale thermophoresis reports direct BOLA3–NFU1 interaction, preferentially
      with holo-NFU1.
    finding_review:
      finding_status: DISPUTED
      superseded_by:
      - PMID:34063696
      review_notes: The later paper’s Introduction summarizes in vitro studies with no detected
        BOLA3–NFU1 interaction in either apo/holo state and notes an unclear in vivo interaction.
        Those underlying studies were not independently re-read here. Record the disagreement
        without declaring the original MST finding overturned; transfer-associated activity
        of the GLRX5–BOLA3 complex is a separate claim.
      supported_by:
      - reference_id: PMID:34063696
        supporting_text: BOLA3 and NFU1 do not interact each other
  - statement: Bol1/Bol3 deletion did not activate the yeast iron regulon; Bol2-dependent
      effects and indirect metabolic crosstalk are distinguished from a direct mitochondrial
      Bol role in iron regulation.
- id: PMID:32296183
  title: A reference map of the human binary protein interactome.
  findings:
  - statement: HuRI reports systematically verified binary interactions; its exact BOLA3 supplementary
      records were not independently accessed. An aggregate source row contains seven partner
      records and is not adjudicated from GLRX5 alone.
- id: PMID:33961781
  title: Dual proteome-scale networks reveal cell-specific remodeling of the human interactome.
  findings:
  - statement: The study reports cell-context-dependent proteome-scale interaction networks.
      The BOLA3 source partner is FAAP100, but the target-specific AP-MS record is absent
      from the partial cached body.
- id: PMID:34063696
  title: Molecular Basis of Multiple Mitochondrial Dysfunctions Syndrome 2 Caused by CYS59TYR
    BOLA3 Mutation.
  findings:
  - statement: C59Y maintains the BOLA3 fold and GLRX5 association while altering interaction
      geometry and cluster coordination; it does not abolish cluster binding.
  - statement: The human reconstitution/NMR comparison measures less cluster-bound NFU1 with
      C59Y than wild-type BOLA3–GLRX5. The proposed explanation of one compound-heterozygous
      patient’s recovery remains a mechanistic interpretation, not a demonstrated developmental
      rescue mechanism.
- id: PMID:34800366
  title: Quantitative high-confidence human mitochondrial proteome and its dynamics in cellular
    context.
  findings:
  - statement: The study combines quantitative mitochondrial proteomics, spatial profiling
      and importomics in human cells. The exact BOLA3 supplementary measurement was not independently
      read, although its curated mitochondrial annotation is consistent with established biology.
