gene_symbol: BOLA3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: BOLA3 is a mitochondrial BolA-family protein that contributes to late iron-sulfur
  protein maturation. It forms a [2Fe-2S]-binding heterocomplex with the monothiol glutaredoxin
  GLRX5. Reconstituted human-protein experiments link this complex to cluster transfer and formation
  of [4Fe-4S]-bound NFU1, although reports differ on direct binding between isolated BOLA3 and
  NFU1. Mitochondrial Bol function is especially important for lipoic acid synthase maturation
  and protein lipoylation. Yeast loss-and-rescue experiments also link it to succinate dehydrogenase
  activity, and BOLA3-deficient patient cells show respiratory-complex I and II deficiencies.
  BOLA3 provides cluster-binding and transfer-associated function rather than lipoic-acid synthesis
  itself. Pathogenic variants cause multiple mitochondrial dysfunctions syndrome 2, with impaired
  lipoylation and mitochondrial energy metabolism; individual variants can retain partial biochemical
  activity.
