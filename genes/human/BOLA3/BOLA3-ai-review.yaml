  title: Combined Automated Annotation using Multiple IEA Methods
  findings: []
- id: PMID:22746225
  title: BOLA1 is an aerobic protein that prevents mitochondrial morphology changes induced
    by glutathione depletion.
  findings:
  - statement: BOLA1 counteracts glutathione-depletion effects on mitochondrial thiol redox
      potential and morphology. The Introduction separately places BOLA3 in mitochondrial Fe-S
      biogenesis; the BOLA1 experiments do not establish a BOLA3 redox function.
  reference_review:
    review_notes: The cached Introduction and Discussion were read; Results and Methods are
      absent. The BOLA3-specific localization experiment and images remain unverified. An earlier
      direct PMC attempt returned reCAPTCHA.
- id: PMID:27499296
  title: Mitochondrial Protein Interaction Mapping Identifies Regulators of Respiratory Chain
    Function.
  findings:
  - statement: Affinity-enrichment mass spectrometry maps condition-specific mitochondrial protein
      interactions. Follow-up experiments identify C17orf89 as a complex-I assembly factor and
      LYRM5-dependent deflavination of electron-transferring flavoprotein.
  reference_review:
    review_notes: Abstract and cached Introduction read. The original BOLA3–GLRX5 interaction-table
      record was not independently inspected; support from other biochemical papers does not
      verify that mapping experiment.
- id: PMID:27532772
  title: Mitochondrial Bol1 and Bol3 function as assembly factors for specific iron-sulfur proteins.
  findings:
  - statement: Yeast genetics places mitochondrial Bol1/Bol3 in late Fe-S protein maturation,
      with a major LIAS-related phenotype; the authors explicitly leave aspects of the biochemical
      mechanism unresolved.
  - statement: Human-protein NMR detects apo and reconstituted holo GLRX5–BOLA3 association.
      In contrast, size-exclusion chromatography does not show a stable holo heterodimer; CD
      effects are weak and GSH-dependent, and BOLA3 does not stabilize the cluster against dithionite.
      These results distinguish detectable interaction from kinetic stability under the tested
      conditions.
  - statement: Microscale thermophoresis reports direct BOLA3–NFU1 interaction, preferentially
      with holo-NFU1.
    finding_review:
      finding_status: DISPUTED
      superseded_by:
      - PMID:34063696
      review_notes: The later paper’s Introduction summarizes in vitro studies with no detected
        BOLA3–NFU1 interaction in either apo/holo state and notes an unclear in vivo interaction.
        Those underlying studies were not independently re-read here. Record the disagreement
        without declaring the original MST finding overturned; transfer-associated activity
        of the GLRX5–BOLA3 complex is a separate claim.
      supported_by:
      - reference_id: PMID:34063696
        supporting_text: BOLA3 and NFU1 do not interact each other
  - statement: Bol1/Bol3 deletion did not activate the yeast iron regulon; Bol2-dependent effects
      and indirect metabolic crosstalk are distinguished from a direct mitochondrial Bol role
      in iron regulation.
  - statement: Yeast Bol3 loss mildly reduces succinate dehydrogenase activity; combined Bol1/Bol3
      loss produces stronger Fe-S-enzyme and lipoylation defects rescued by either Bol protein.
      The Discussion relates this specificity to LIAS and respiratory-complex I/II deficiencies
      in BOLA3-deficient patients.
- id: PMID:32296183
  title: A reference map of the human binary protein interactome.
  findings:
  - statement: HuRI maps approximately 53,000 human binary protein interactions and links the
      network to tissue-context and Mendelian-disease analyses.
  reference_review:
    review_notes: Abstract and prior cached HuRI generation/verification reading establish the
      study design. The BOLA3 edge/table remains uninspected. Source GOA preserves seven partner
      IDs; separate GLRX5 biochemistry supports only that subset, not all original screen edges.
- id: PMID:33961781
  title: Dual proteome-scale networks reveal cell-specific remodeling of the human interactome.
  findings:
  - statement: Affinity-purification mass spectrometry in 293T and HCT116 cells reveals shared
      core protein complexes and extensive cell-context-dependent interaction remodeling.
  reference_review:
    review_notes: Abstract and cached Introduction/Discussion read. The original BOLA3–FAAP100
      AP-MS record, orientation and cellular context remain unverified.
- id: PMID:34063696
  title: Molecular Basis of Multiple Mitochondrial Dysfunctions Syndrome 2 Caused by CYS59TYR
    BOLA3 Mutation.
  findings:
  - statement: C59Y maintains the BOLA3 fold and GLRX5 association while altering interaction
      geometry and cluster coordination; it does not abolish cluster binding.
  - statement: The human reconstitution/NMR comparison measures less cluster-bound NFU1 with
      C59Y than wild-type BOLA3–GLRX5. The proposed explanation of one compound-heterozygous
      patient’s recovery remains a mechanistic interpretation, not a demonstrated developmental
      rescue mechanism.
- id: PMID:34800366
  title: Quantitative high-confidence human mitochondrial proteome and its dynamics in cellular
    context.
  findings:
  - statement: Quantitative human-cell mitochondrial proteomics defines a high-confidence set
      of more than 1,100 proteins and measures broad variation in abundance and turnover, with
      additional analyses of import and protein-complex assembly.
  reference_review:
    review_notes: Abstract and prior initial Results reading establish the proteomic design.
      The exact BOLA3 supplementary entry was not independently inspected; no target-specific
      abundance, turnover or import rate is claimed.
