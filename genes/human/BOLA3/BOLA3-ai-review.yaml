description: BOLA3 is a mitochondrial BolA-family protein that contributes to late iron-sulfur
  protein maturation. It forms a [2Fe-2S]-binding heterocomplex with the monothiol glutaredoxin
  GLRX5. Reconstituted human-protein experiments link this complex to cluster transfer and
  formation of [4Fe-4S]-bound NFU1, although reports differ on direct binding between isolated
  BOLA3 and NFU1. Genetic studies connect mitochondrial Bol proteins particularly to maturation
  of lipoic acid synthase and consequently protein lipoylation. BOLA3 provides cluster-binding
  and transfer-associated function rather than lipoic-acid synthesis itself. Pathogenic BOLA3
  variants cause multiple mitochondrial dysfunctions syndrome 2, with impaired lipoylation
  and mitochondrial energy metabolism; individual variants can retain partial biochemical
  activity.
