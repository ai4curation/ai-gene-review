core_functions:
- molecular_function:
    id: GO:0051537
    label: 2 iron, 2 sulfur cluster binding
  description: BOLA3 coordinates an Fe-S cluster in the GLRX5–BOLA3 heterocomplex and contributes
    to late mitochondrial Fe-S protein assembly. Human reconstitution experiments demonstrate
    cluster-binding and NFU1 transfer-associated activity; yeast genetics particularly links
    mitochondrial Bol function to LIAS maturation. BOLA3 is not the enzyme that synthesizes
    lipoic acid, and the reconstituted transfer route is not asserted to be the sole cellular
    pathway (PMID:27532772, PMID:34063696).
