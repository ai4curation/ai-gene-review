  evidence_type: NAS
  original_reference_id: PMID:27532772
  review:
    summary: A BOLA3-specific intracellular iron-homeostasis role is not established by the
      experiments read in PMID:27532772.
    action: UNDECIDED
    reason: The yeast Results and Discussion distinguish late mitochondrial Bol1/Bol3 function
      from cytosolic Bol2-dependent iron-regulon control. Bol1/Bol3 deletion did not alter
      the iron regulon, while combined Bol2 deletion produced additional effects interpreted
      through metabolic and iron-regulatory crosstalk. These findings do not prove absence
      of every human BOLA3 role in iron homeostasis, but they do not justify the prior positive
      claim from Fe-S biogenesis alone. Preserve the NAS assertion as undecided pending a
      source that establishes the particular BOLA3 role.
