suggested_questions:
- question: >-
    OATP1C1 is experimentally a facilitative, Na+-independent, pH-insensitive transporter, yet GO:0015349
    thyroid hormone transmembrane transporter activity is placed under GO:0015291 secondary active
    transmembrane transporter activity in the is_a hierarchy. Should the ontology placement of thyroid
    hormone transmembrane transporter activity (or a dedicated facilitative thyroid hormone transporter
    term) be revised? (Same point raised for MCT8/MCT10.)
- question: >-
    What sets the physiological directionality of OATP1C1-mediated thyroid hormone flux at the blood-brain
    barrier and choroid plexus (net T4 import into the CNS) given that OATP-type anion exchange is in
    principle bidirectional, and how do the opposite substrate preferences of OATP1C1 (T4/rT3) and MCT8
    (T3) divide labour in delivering thyroid hormone to glia and neurons?
- question: >-
    OATP1C1 carries a C-terminal class-I PDZ ligand (...KETQL) and binds a large panel of PDZ-domain
    scaffolds (NHERF2, PDZK1, DLG/MAGI/SCRIB/TJP, etc.). Does one or more of these scaffolds control
    OATP1C1 surface expression, polarity or stability at the brain barriers, warranting a specific
    PDZ-domain-binding or adapter-mediated-localization annotation rather than bare protein binding?
suggested_experiments:
- description: >-
    Quantitative flux/electrophysiology on purified, reconstituted human OATP1C1 (now that a T4-bound
    cryo-EM structure exists) to confirm uncoupled facilitated diffusion versus anion exchange, define
    the full iodothyronine/organic-anion selectivity profile and apparent affinities, and directly test
    Na+- and pH-independence.
- description: >-
    Cell-type-specific conditional Slco1c1 models (brain endothelium vs choroid plexus vs glia) combined
    with intracellular T4/T3 reporters to dissect how OATP1C1 transport at each barrier shapes regional
    brain thyroid hormone status, and how it combines with MCT8, informing the pathophysiology of the
    OATP1C1-deficiency neurodegeneration phenotype.
- description: >-
    Knockdown/overexpression of candidate PDZ scaffolds (e.g. PDZK1, NHERF2) with surface-biotinylation
    and polarized-epithelium trafficking assays to test whether the C-terminal PDZ ligand controls OATP1C1
    membrane targeting and stability at the brain barriers.
