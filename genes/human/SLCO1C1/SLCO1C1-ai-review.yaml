id: Q9NYB5
gene_symbol: SLCO1C1
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  SLCO1C1 encodes OATP1C1 (organic anion transporting polypeptide 1C1; also OATP14,
  OATP-F, thyroxine transporter), a 712-residue, 12-transmembrane plasma-membrane
  member of the SLCO/OATP organic anion transporter family (major facilitator
  superfamily fold). In contrast to the broad-specificity organic-anion carriers that
  make up most of the family, OATP1C1 is a high-affinity, substrate-selective thyroid
  hormone transporter: it preferentially transports the prohormone T4 (L-thyroxine) and
  reverse T3, transports T3 only poorly, and handles T4 sulfate, estradiol-17-glucuronide
  and estrone-3-sulfate as weaker substrates. Transport is Na+-independent and
  facilitative (OATPs operate as electroneutral anion exchangers coupled to bicarbonate
  counter-flux); OATP1C1 is additionally pH-insensitive because it lacks the conserved
  transmembrane-domain-3 histidine that confers pH stimulation on other OATPs. It is
  expressed in brain capillary endothelium, choroid plexus epithelium and testicular
  Leydig cells, where it mediates thyroid hormone entry into the central nervous system
  across the blood-brain and blood-cerebrospinal-fluid barriers (together with MCT8),
  supplying T4 for intracellular deiodinase conversion. Its substrate preference for T4/rT3
  is the mirror image of the T3 preference of MCT8 (SLC16A2). Biallelic loss-of-function is
  associated with severe brain hypometabolism and juvenile neurodegeneration, consistent
  with a non-redundant role in brain thyroid hormone supply.
