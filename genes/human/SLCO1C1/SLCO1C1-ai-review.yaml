core_functions:
- description: >-
    High-affinity, Na+-independent, facilitative (pH-insensitive) transmembrane transport of thyroid
    hormones, preferentially the prohormone T4 (L-thyroxine) and reverse T3, with weaker handling of
    T4 sulfate, estradiol-17-glucuronide and estrone-3-sulfate and little transport of T3. OATP1C1
    operates as an electroneutral organic anion exchanger of the SLCO/OATP family. Physiologically it
    mediates thyroid hormone entry into the central nervous system across the blood-brain and
    blood-cerebrospinal-fluid barriers, acting in brain capillary endothelium and choroid plexus
    epithelium (together with MCT8) to supply T4 for local deiodinase conversion to active T3.
  molecular_function:
