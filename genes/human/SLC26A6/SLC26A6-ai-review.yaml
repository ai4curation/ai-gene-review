gene_symbol: SLC26A6
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SLC26A6 (putative anion transporter 1, PAT1; CFEX) is an SLC26A/SulP-family, STAS-domain
  anion exchanger of the apical (brush-border) membrane of small intestine, pancreatic duct and renal
  proximal tubule epithelia. It operates in several exchange modes, principally chloride/bicarbonate and
  chloride/oxalate, and also oxalate/formate, chloride/formate and, at low rates in the human protein,
  sulfate exchange. Its C-terminal PDZ-binding motif links it to NHERF scaffolds, and its bicarbonate
  transport is regulated by CFTR, cAMP, protein kinase C and carbonic anhydrase II binding. SLC26A6 mediates
  intestinal oxalate secretion, which limits net absorption of dietary oxalate; Slc26a6-null mice develop
  hyperoxaluria and calcium oxalate stones, and a heterozygous dominant-negative human variant (p.R507W)
  causes enteric hyperoxaluria with calcium oxalate nephrolithiasis. It also contributes to duodenal and
  pancreatic bicarbonate secretion and intracellular pH regulation.
