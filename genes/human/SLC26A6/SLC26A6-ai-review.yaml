suggested_questions:
- question: How often do rare SLC26A6 loss-of-function or dominant-negative variants underlie enteric
    hyperoxaluria and calcium oxalate stones beyond the single reported p.R507W family?
- question: Is the human SLC26A6 chloride/oxalate exchange electroneutral in vivo, and how does its stoichiometry
    differ from the electrogenic mouse orthologue?
suggested_experiments:
- description: Measure intestinal oxalate secretion (e.g. in human enteroids) carrying SLC26A6 p.R507W
    or loss-of-function alleles, with and without wild-type co-expression.
