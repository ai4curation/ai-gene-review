  - statement: Slc26a6-null mice lack intestinal oxalate secretion, develop hyperoxaluria, hyperoxalemia
      and calcium oxalate urolithiasis.
    supporting_text: mice lacking Slc26a6 have a defect in intestinal oxalate secretion resulting in enhanced
      net absorption of oxalate
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Mouse knockout establishing the physiological role; abstract-only cache.
- id: PMID:35115415
  title: Dominant negative mutation in oxalate transporter SLC26A6 associated with enteric hyperoxaluria
    and nephrolithiasis.
  findings:
  - statement: A heterozygous dominant-negative SLC26A6 p.R507W variant reduces chloride-dependent oxalate
      transport and surface expression and cosegregates with hyperoxaluria.
    supporting_text: SLC26A6 inactivation can cause inherited enteric hyperoxaluria with calcium oxalate
      NL.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Single family plus functional data; full text cached.
