- term:
    id: GO:0007141
    label: male meiosis I
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q9CWR8
  - ensembl:ENSMUSP00000000746
  review:
    summary: Male meiosis I transferred from mouse Dnmt3l. Meiotic failure in Dnmt3l-null spermatocytes
      is a downstream consequence of failed premeiotic de novo methylation; Dnmt3l is not expressed in
      spermatocytes.
    action: REMOVE
    reason: DNMT3L cannot participate in meiosis I in cells where it is not expressed. Bourc'his and Bestor
      (2004) show that the meiotic catastrophe arises in spermatocytes that do not express Dnmt3L, after
      earlier loss of retrotransposon methylation in prospermatogonia. This is an indirect organismal
      phenotype, not process participation, so the electronic and ISS transfers are removed.
    supported_by:
    - reference_id: PMID:15318244
      supporting_text: Loss of Dnmt3L from early germ cells also caused meiotic failure in spermatocytes,
        which do not express Dnmt3L.
    - reference_id: PMID:15318244
      supporting_text: is expressed in testes during a brief perinatal period in the non-dividing precursors
        of spermatogonial stem cells at a stage where retrotransposons undergo de novo methylation.
