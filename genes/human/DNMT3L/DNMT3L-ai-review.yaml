- term:
    id: GO:0140006
    label: histone H3 reader activity
  evidence_type: IDA
  original_reference_id: PMID:17687327
  qualifier: enables
  review:
    summary: DNMT3L's N-terminal ADD (cysteine-rich, PHD-like) domain directly binds the unmodified N-terminal
      tail of histone H3; binding is abolished by H3K4 methylation.
    action: NEW
    reason: Human DNMT3L-H3 tail co-crystal structure, peptide-binding assays and binding-site mutagenesis
      directly establish that DNMT3L recognizes H3 unmethylated at K4. GO:0140006 explicitly covers readers
      of unmodified H3. This is a molecular function the protein itself performs, not a process it is
      required for, and no existing annotation captures it.
    supported_by:
    - reference_id: PMID:17687327
      supporting_text: Peptide interaction assays showed that DNMT3L specifically interacts with the extreme
        amino terminus of histone H3; this interaction was strongly inhibited by methylation at lysine
        4 of histone H3 but was insensitive to modifications at other positions.
    - reference_id: PMID:17687327
      supporting_text: Cocrystallization of DNMT3L with the tail of histone H3 revealed that the tail
        bound to the cysteine-rich domain of DNMT3L, and substitution of key residues in the binding site
        eliminated the H3 tail-DNMT3L interaction.
    - reference_id: PMID:17713477
      supporting_text: the carboxy-terminal domain of human Dnmt3L interacts with the catalytic domain
        of Dnmt3a, demonstrating that Dnmt3L has dual functions of binding the unmethylated histone tail
        and activating DNA methyltransferase.
