- term:
    id: GO:0045814
    label: negative regulation of gene expression, epigenetic
  evidence_type: IDA
  original_reference_id: PMID:12202768
  qualifier: involved_in
  review:
    summary: Human DNMT3L represses transcription in an HDAC1-dependent, trichostatin-sensitive way (IDA),
      and more broadly silences genes epigenetically by directing de novo DNA methylation.
    action: ACCEPT
    reason: Both the HDAC-dependent repression shown in the source paper and DNMT3L-dependent establishment
      of silencing methylation at imprinted loci fall under epigenetic negative regulation of gene expression.
    supported_by:
    - reference_id: PMID:12202768
      supporting_text: We find that Dnmt3L can repress transcription and that this repression is dependent
        on HDAC1 and is relieved by treatment with the HDAC inhibitor trichostatin A.
    - reference_id: PMID:11719692
      supporting_text: Bisulfite genomic sequencing of DNA from oocytes and embryos showed that removal
        of Dnmt3L prevented methylation of sequences that are normally maternally methylated.
