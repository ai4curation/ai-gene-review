- term:
    id: GO:0006346
    label: DNA methylation-dependent constitutive heterochromatin formation
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q9CWR8
  - ensembl:ENSMUSP00000000746
  review:
    summary: 'DNMT3L is a non-catalytic but essential subunit of the de novo DNA methylation machinery:
      it binds the DNMT3A/3B catalytic domain, stimulates catalysis and couples it to H3K4-unmethylated
      chromatin. Mouse Dnmt3l knockouts fail to establish de novo methylation of imprints and retrotransposons.'
    action: ACCEPT
    reason: 'DNMT3L does part of the work of this process rather than merely being required for it: its
      C-terminal domain forms the DNMT3L-DNMT3A-DNMT3A-DNMT3L heterotetramer whose interfaces are needed
      for catalysis, and its ADD domain reads unmethylated H3K4. The human biochemistry plus the mouse
      genetics (ortholog in the same PANTHER subfamily SF13) support the transfer.'
    supported_by:
    - reference_id: PMID:17713477
      supporting_text: Substitution of key non-catalytic residues at the Dnmt3a-Dnmt3L interface or the
        Dnmt3a-Dnmt3a interface eliminated enzymatic activity.
    - reference_id: PMID:17687327
      supporting_text: These data indicate that DNMT3L recognizes histone H3 tails that are unmethylated
        at lysine 4 and induces de novo DNA methylation by recruitment or activation of DNMT3A2.
    - reference_id: PMID:15318244
      supporting_text: Deletion of the Dnmt3L gene prevented the de novo methylation of both long-terminal-repeat
        (LTR) and non-LTR retrotransposons, which were transcribed at high levels in spermatogonia and
        spermatocytes.
