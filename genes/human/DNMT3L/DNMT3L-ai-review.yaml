  - ensembl:ENSMUSP00000000746
  review:
    summary: Transposable element silencing by piRNA-directed DNA methylation (from mouse). DNMT3L is
      part of the de novo methylation machinery recruited downstream of the piRNA pathway to young retrotransposons
