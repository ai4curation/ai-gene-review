- term:
    id: GO:0005634
    label: nucleus
  evidence_type: HDA
  original_reference_id: PMID:16780588
  qualifier: located_in
  review:
    summary: Nuclear localization is well supported and is where DNMT3L acts.
    action: ACCEPT
    reason: DNMT3L reads histone H3 tails on chromatin and assembles with DNMT3A/DNMT3B on genomic DNA,
      so the nucleus is where its activity is executed. Mouse Dnmt3l co-localizes with Dnmt3a/3b in nuclei
      of transfected cells, and the human protein binds nucleosomal histone H3 directly.
    supported_by:
    - reference_id: PMID:11934864
      supporting_text: We also show that Dnmt3L interacts with Dnmt3a and Dnmt3b and co-localizes with
        these enzymes in the nuclei of transfected cells
    - reference_id: PMID:17687327
      supporting_text: Peptide interaction assays showed that DNMT3L specifically interacts with the extreme
        amino terminus of histone H3; this interaction was strongly inhibited by methylation at lysine
        4 of histone H3 but was insensitive to modifications at other positions.
