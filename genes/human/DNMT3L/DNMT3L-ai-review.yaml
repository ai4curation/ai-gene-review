id: Q9UJW3
gene_symbol: DNMT3L
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: DNMT3L is a noncatalytic regulator of de novo DNA methyltransferases and chromatin-dependent
  gene repression. Its ADD domain recognizes chromatin context and supports interactions with repressive
  machinery, while its methyltransferase-like region interacts with DNMT3A and DNMT3B. DNMT3L contributes
  to imprint establishment and transposable-element silencing without itself serving as a conventional
  DNA methyltransferase.
