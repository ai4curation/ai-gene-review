  review:
    summary: Retrotransposon silencing in the male germline depends on DNMT3L-mediated de novo methylation
      (ISS from mouse).
    action: ACCEPT
    reason: Dnmt3l deletion prevents de novo methylation of LTR and non-LTR retrotransposons in mouse
      prospermatogonia, which are then highly transcribed. DNMT3L is part of the methylation machinery
      that does the silencing.
    supported_by:
    - reference_id: PMID:15318244
      supporting_text: Deletion of the Dnmt3L gene prevented the de novo methylation of both long-terminal-repeat
