    label: heterochromatin
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: located_in
  supporting_entities:
  - UniProtKB:Q9CWR8
  - ensembl:ENSMUSP00000000746
  review:
    summary: Heterochromatin location transferred from mouse Dnmt3l (Ensembl Compara). Consistent with
      DNMT3L's role in de novo methylation of retrotransposons and imprinted regions, but not its specific
      site of action.
    action: KEEP_AS_NON_CORE
    reason: DNMT3L directs de novo methylation at retrotransposons and imprinting control regions that
      become heterochromatic, so association with heterochromatin is plausible. However DNMT3L's reader
      activity targets H3K4-unmethylated chromatin generally, not a heterochromatin-specific mark, so
      this is retained as a non-core location.
    supported_by:
    - reference_id: PMID:15318244
      supporting_text: Deletion of the Dnmt3L gene prevented the de novo methylation of both long-terminal-repeat
        (LTR) and non-LTR retrotransposons, which were transcribed at high levels in spermatogonia and
        spermatocytes.
    - reference_id: PMID:17687327
      supporting_text: These data indicate that DNMT3L recognizes histone H3 tails that are unmethylated
        at lysine 4 and induces de novo DNA methylation by recruitment or activation of DNMT3A2.
