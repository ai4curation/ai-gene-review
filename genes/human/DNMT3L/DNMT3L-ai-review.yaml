core_functions:
- description: Non-catalytic activator subunit of the de novo DNA methyltransferases DNMT3A and DNMT3B.
    It binds their catalytic domains to form heterotetramers and stimulates methylation of genomic DNA,
    establishing germline imprints and silencing retrotransposons.
