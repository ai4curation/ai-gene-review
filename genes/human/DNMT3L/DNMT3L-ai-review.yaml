  review:
    summary: Spermatogenesis (ISS from mouse). Dnmt3l-null males are azoospermic because germline de novo
      methylation fails.
    action: KEEP_AS_NON_CORE
    reason: DNMT3L acts in perinatal prospermatogonia to establish methylation, and its loss blocks spermatogenesis.
      This is a genuine but broad developmental involvement, so it is kept as non-core; the mechanistic
      core is de novo methylation.
    supported_by:
    - reference_id: PMID:11934864
      supporting_text: In addition, both Dnmt3a and Dnmt3L are required for spermatogenesis.
    - reference_id: PMID:15318244
      supporting_text: is expressed in testes during a brief perinatal period in the non-dividing precursors
        of spermatogonial stem cells at a stage where retrotransposons undergo de novo methylation.
    - reference_id: file:human/DNMT3L/DNMT3L-deep-research-falcon.md
      supporting_text: Dnmt3l-null male mice are infertile and develop germ-cell depletion, delayed meiotic
        entry, abnormal homologous-chromosome synapsis, and subsequent apoptosis.
- term:
    id: GO:0008047
    label: enzyme activator activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - MGI:MGI:1859287
  - PANTHER:PTN001891074
  - UniProtKB:Q9UJW3
  review:
    summary: DNMT3L stimulates the catalytic activity of DNMT3A and DNMT3B by binding their catalytic
      domains, without itself having methyltransferase activity.
    action: ACCEPT
    reason: 'Directly shown for human DNMT3L: DNMT3B stimulation (Xie et al. 2006, the IDA source), and
      DNMT3A activation through the heterotetramer interface (Jia et al. 2007). The IBA node PTN001891074
      is the DNMT3L clade itself (donors are mouse Dnmt3l and human DNMT3L), so the inference stays within
      subfamily SF13 and does not extend the activator role to the catalytic paralogs.'
    supported_by:
