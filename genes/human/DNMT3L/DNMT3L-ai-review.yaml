  review:
    summary: Condensed nuclear chromosome location transferred from mouse. Mouse Dnmt3l is expressed in
      perinatal non-dividing prospermatogonia, not in meiotic spermatocytes, so association with condensed
      meiotic chromosomes is not where it functions.
    action: KEEP_AS_NON_CORE
    reason: The source mouse annotation is experimental and has not been examined here, so it is not removed.
      DNMT3L acts on interphase chromatin in prospermatogonia and oocytes; mouse Dnmt3l is absent from
      spermatocytes. Any condensed-chromosome association is peripheral to its function.
