gene_symbol: DNMT3L
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: DNMT3L (DNA cytosine-5-methyltransferase 3-like) is a 386-residue nuclear protein of the
  DNMT3 family that has no DNA methyltransferase activity of its own. It acts as a regulatory subunit
  of the de novo DNA methyltransferases DNMT3A and DNMT3B. Its C-terminal methyltransferase-like domain
  binds their catalytic domains, forming DNMT3L-DNMT3A-DNMT3A-DNMT3L (and analogous DNMT3B) heterotetramers
  in which it stimulates catalysis. Its N-terminal ADD (ATRX-DNMT3-DNMT3L) zinc-finger domain reads histone
  H3 tails unmethylated at lysine 4, linking de novo methylation to chromatin lacking H3K4 methylation.
  DNMT3L is expressed mainly in germ cells and pluripotent cells. Mouse genetics show it is required to
  establish maternal and paternal methylation imprints and to methylate and silence retrotransposons in
  the male germline. In embryonic stem cells it can also limit methylation at bivalent promoters through
  an interaction with PRC2. Through its ADD domain it can bind HDAC1 and repress transcription independently
  of DNA methylation.
