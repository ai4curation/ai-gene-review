  review:
    action: MARK_AS_OVER_ANNOTATED
    summary: PAINT over-propagates a broad catabolic-process term on the small UCHL3/UCHL1 branch.
    reason: Re-reviewed against the PAINT tree on 2026-11-24; the action stands and the account of the seeds is corrected. The IBD sits at PTN000063381 (177 leaves) and has two seeds. Mouse Uchl3 (MGI:MGI:1355274) is the ortholog of the target and joins human UCHL3 at PTN000063417 (7 leaves); its only experimental row for this term is an IDA from PMID:21762696 (UniProt), not a knockout phenotype as the earlier reason said. That paper shows UCH-L3 hydrolyzing the C-terminal extension of the mutant ubiquitin UBB+1, which trims a ubiquitin and leaves another ubiquitin molecule; it is the ubiquitin C-terminal hydrolase activity already annotated here and does not show a protein being broken down. Rat Uchl1 (RGD:3928) joins UCHL3 at PTN000063387 (46 leaves) and carries ubiquitin-dependent protein catabolic process by IDA from PMID:11850463, whose abstract reports raised UCH-L1 expression in the dorsal horn of neuropathic rats and effects of proteasome inhibitors, not an assay of UCH-L1 in protein breakdown. Both readings rest on abstracts and the full texts were not read, so the seed rows are queried, not declared wrong. On that reading neither seed shows the enzyme taking part in protein catabolism, and the over-reach starts at the seeds. The specific catalytic annotation to cysteine-type deubiquitinase activity is retained; the family review requests removal of this IBD row from PTN000063381.
