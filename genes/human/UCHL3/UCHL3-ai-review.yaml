id: P15374
gene_symbol: UCHL3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'UCHL3 is a compact cytosolic ubiquitin C-terminal hydrolase with a C12 catalytic cysteine. It hydrolyzes amide, peptide, ester and isopeptide bonds at the C-terminal glycine of ubiquitin and can process ubiquitin-ribosomal precursor proteins and small ubiquitin adducts; it can also cleave the C terminus of NEDD8 in vitro. In the DNA-damage response, ATM phosphorylation activates UCHL3 to deubiquitinate RAD51 at DNA double-strand breaks, promoting RAD51-BRCA2 association and RAD51 focus formation during homologous-recombination repair. A separate study linked UCHL3 to SMAD1 deubiquitination during BMP-driven osteoblast differentiation.'
