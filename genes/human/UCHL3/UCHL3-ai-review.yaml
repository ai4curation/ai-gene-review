- term:
    id: GO:1905168
    label: positive regulation of double-strand break repair via homologous recombination
  evidence_type: IDA
  original_reference_id: PMID:27941124
  qualifier: involved_in
  review:
    action: ACCEPT
    summary: ATM-activated UCHL3 deubiquitinates RAD51 and promotes homologous-recombination repair.
    reason: PMID:27941124 shows that, after DNA damage, ATM phosphorylates UCHL3 on Ser75, UCHL3 directly removes ubiquitin from RAD51, and this deubiquitination promotes RAD51-BRCA2 binding, RAD51 focus formation and homologous recombination.
    supported_by:
    - reference_id: PMID:27941124
      supporting_text: UCHL3, in turn, deubiquitinates RAD51 and promotes the binding between RAD51 and BRCA2
- term:
    id: GO:0035861
    label: site of double-strand break
  evidence_type: IDA
  original_reference_id: PMID:27941124
  qualifier: located_in
  review:
    action: NEW
    summary: UCHL3 is recruited to DNA double-strand breaks after damage.
    reason: The homologous-recombination study showed both UCHL3 colocalization with RAD51 and gamma-H2AX foci and chromatin immunoprecipitation of UCHL3 at an induced I-SceI break, directly placing the RAD51 deubiquitination activity at DNA double-strand break sites.
    supported_by:
    - reference_id: PMID:27941124
      supporting_text: Moreover, we observed accumulation of UCHL3 at the DSB by a chromatin immunoprecipitation (ChIP) assay in which the DSB was introduced by the exogenously expressed I-SceI endonuclease
