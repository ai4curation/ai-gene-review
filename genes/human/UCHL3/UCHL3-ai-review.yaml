- term:
    id: GO:0006511
    label: ubiquitin-dependent protein catabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR001578
  - InterPro:IPR036959
  review:
    action: MARK_AS_OVER_ANNOTATED
    summary: The UCH domain supports DUB activity, not a direct protein-catabolic role for UCHL3.
    reason: UCHL3 liberates ubiquitin from small C-terminal adducts, ubiquitin precursors and RAD51. Unlike the proteasome-associated paralog UCHL5, it is not itself a proteasomal substrate-processing factor, so ubiquitin-dependent protein catabolism is an over-extension of a generic InterPro UCH mapping.
    supported_by:
    - reference_id: PMID:9521656
      supporting_text: These data suggest that the physiological role of UCH is to hydrolyze small adducts of ubiquitin and to generate free monomeric ubiquitin from ubiquitin proproteins
