core_functions:
- description: Factor I catalyses cofactor-dependent cleavage of C3b and C4b, limiting complement
    amplification and producing fragments with different receptor-recognition properties.
    The noncatalytic heavy chain helps organize substrate/cofactor contacts and regulate the
    catalytic light chain; both derive from one precursor. The mature enzyme can remain zymogen-like
    until a productive complex forms. The 2017 inactive S525A ternary structure is distinguished
    from separate active-enzyme cleavage assays; the 2011 free-enzyme structure and ternary
    docking model are not the same experiment.
  molecular_function:
    id: GO:0004252
    label: serine-type endopeptidase activity
  directly_involved_in:
  - id: GO:0045916
    label: negative regulation of complement activation
  locations:
  - id: GO:0005576
    label: extracellular region
  supported_by:
  - reference_id: PMID:21768352
    supporting_text: it circulates in a zymogen-like state
  - reference_id: PMID:28671664
    supporting_text: cofactor-assisted sequential cleavages of C3b by FI
suggested_questions:
- question: What molecular form of factor I is present in urinary and EPS-urine vesicle preparations,
    and is it vesicle-luminal, surface-associated or a soluble co-isolate?
- question: Do the engineered HCV-F and GLP1R associations occur with sequence-defined mature
    human factor I in physiological cellular or extracellular contexts?
suggested_experiments:
- description: Use orthogonal vesicle purification, peptide mapping and protease-protection
    assays with and without detergent to distinguish intact factor I and its chains, surface
    association, luminal cargo and soluble contamination.
- description: Test the reported partner associations using sequence-defined factor-I products
    and viral strain constructs, matched expression and secretion controls, and endogenous-context
    assays before assigning a downstream signaling or viral role.
