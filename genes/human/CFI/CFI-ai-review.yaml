  label: Homo sapiens
description: Complement factor I is a secreted regulatory serine protease that cleaves the
  complement fragments C3b and C4b in complexes with appropriate cofactors, including factor
  H, C4b-binding protein, CD46 and CR1. Its noncatalytic heavy chain and catalytic light chain
  are produced from one precursor and remain linked by a disulfide bond. The mature enzyme
  has a zymogen-like resting conformation; substrate and cofactor contacts stabilize a proteolytically
  competent state. Its limited cleavage prevents complement amplification and also generates
  fragments with distinct complement-receptor recognition properties. Factor I acts in extracellular
  fluids and can associate transiently with membrane-attached substrate/cofactor complexes.
