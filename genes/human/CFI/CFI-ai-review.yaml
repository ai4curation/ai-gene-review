  review:
    summary: Retain broad functional protein processing with explicit maturation limits.
    action: KEEP_AS_NON_CORE
    reason: GO:0016485 specifically concerns cleavage-mediated maturation toward full functional
      capacity. CFI cleavage inhibits C3b/C4b convertase functions, while iC3b/C3dg products
      have distinct complement-receptor recognition activities; thus the broader inherited
      processing assertion remains defensible, but the classical maturation sense is not the
      principal core role. Retain this source as non-core and state negative complement regulation
