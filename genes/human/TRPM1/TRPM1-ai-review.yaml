id: Q7Z4N2
gene_symbol: TRPM1
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'TRPM1 (melastatin) is the founding member of the melastatin (M) subfamily of transient receptor potential
  channels: a six-transmembrane subunit with a pore loop between S5 and S6 that assembles into tetrameric, constitutively
  open, nonselective cation channels permeable to Ca2+ and other divalent cations and inhibited by extracellular
  zinc; it can also form heteromultimeric channels with TRPM3. Its principal physiological role is in retinal ON
  (depolarizing) bipolar cells, where a long isoform is the transduction channel of the mGluR6 cascade: at the dendritic
  tips, glutamate released by photoreceptors in the dark activates mGluR6 and the G protein Go, which keeps TRPM1
  closed; at light onset the fall in glutamate lets the channel open and the cell depolarizes. Localization to the
  dendritic tips depends on nyctalopin, mGluR6 and the presynaptic organizer LRIT3, and most of the protein in bipolar
  cells resides in the endoplasmic reticulum of the soma, dendrites and axon. Biallelic loss of function causes
  autosomal recessive complete congenital stationary night blindness (CSNB1C) without a pigmentation phenotype.
  TRPM1 is also expressed in melanocytes under MITF control, where it mediates calcium uptake that mGluR6 signalling
  enhances, and its expression falls during melanoma progression; its intron hosts the miR-211 gene.'
