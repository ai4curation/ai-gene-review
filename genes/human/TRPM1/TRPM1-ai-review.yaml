- term:
    id: GO:0005783
    label: endoplasmic reticulum
  evidence_type: IDA
  original_reference_id: PMID:30027108
  qualifier: located_in
  review:
    summary: Endoplasmic reticulum; a large native ER pool in ON-bipolar cells, not the site of the light response.
    action: KEEP_AS_NON_CORE
    reason: Endogenous TRPM1 in mouse ON-bipolar cell bodies colocalizes with the ER and not the Golgi, and most
      of the protein is there; the functional channel acts at the dendritic tips, which the ER does not reach. A
      real location of the endogenous protein in its native cell, peripheral to the core function.
    supported_by:
    - reference_id: PMID:30027108
      supporting_text: In cell bodies, TRPM1 colocalized with the ER, and not with the Golgi apparatus.
    - reference_id: PMID:30027108
      supporting_text: These results indicate that the majority of TRPM1 is present in the ER
- term:
    id: GO:0005789
    label: endoplasmic reticulum membrane
  evidence_type: EXP
  original_reference_id: PMID:30027108
  qualifier: located_in
  review:
    summary: ER membrane; TM topology in the ER plus ER colocalization of the endogenous protein.
    action: KEEP_AS_NON_CORE
    reason: TRPM1 is a multipass protein; protease-protection assays place both termini in the cytoplasm, and in
      mouse ON-bipolar cells the endogenous protein colocalizes with the ER. That meets the ER membrane bar, but
      the pool is a reservoir rather than where the channel signals.
    supported_by: &id003
    - reference_id: PMID:30027108
      supporting_text: revealed that the N and C termini are both accessible to the cytoplasm, consistent with the
        transmembrane domain topology of related TRP channels
