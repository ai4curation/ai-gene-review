  - UniProtKB:Q96QT4
  - UniProtKB:Q9HCF6
  review:
    summary: Calcium channel activity; TRPM1 conducts Ca2+ as a nonselective cation channel.
    action: ACCEPT
    reason: Heterologously expressed human TRPM1 mediates Ca2+ entry and is a bona fide plasma-membrane channel
      with a divalent permeability profile; in human melanocytes TRPM1 knockdown abolishes the Ca2+ influx. The
      IBA sits on the TRPM node and the TAS rows restate the family property. TRPM1 is nonselective, so the core
      function uses the cation channel parent, but Ca2+ conduction is real.
    supported_by: &id001
    - reference_id: PMID:11535825
      supporting_text: We reveal that TRPM4 and MLSN each mediate Ca(2+) entry when expressed in HEK293 cells.
    - reference_id: PMID:21278253
      supporting_text: we measured the divalent permeability profile and found that channels containing the pore
        of TRPM1 are inhibited by extracellular zinc ions at physiological concentrations
    - reference_id: PMID:23452348
      supporting_text: Knockdown of TRPM1 or mGluR6 by shRNA abolished L-AP4-induced Ca(2+) influx and TRPM1 currents
