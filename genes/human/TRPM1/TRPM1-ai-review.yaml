core_functions:
- description: Transduction cation channel of retinal ON-bipolar dendritic tips. Constitutively open TRPM1 is closed
    by the mGluR6-Go cascade while photoreceptors release glutamate in the dark and opens at light onset, depolarizing
    the cell; needed for the ON-bipolar response in mouse and human.
  molecular_function:
    id: GO:0005261
    label: monoatomic cation channel activity
  directly_involved_in:
  - id: GO:0007216
    label: G protein-coupled glutamate receptor signaling pathway
  - id: GO:0098655
    label: monoatomic cation transmembrane transport
  - id: GO:0007601
    label: visual perception
  locations:
  - id: GO:0044292
    label: dendrite terminus
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:19966281
    supporting_text: TRPM1-L localization is developmentally restricted to the dendritic tips of ON BCs in colocalization
      with mGluR6
  - reference_id: PMID:19966281
    supporting_text: TRPM1-L functions as a constitutively active nonselective cation channel and its activity is
      negatively regulated by Go in the mGluR6 cascade
  - reference_id: PMID:19861548
    supporting_text: TRPM1 is necessary for the depolarizing light response of ON-bipolar cells, and further that
      TRPM1 is a component of the channel that generates this light response
suggested_questions:
- question: Is TRPM1 closed by Galpha-o, by Gbeta-gamma, or both, and does either bind the channel directly?
- question: What, if anything, does the large ER-resident TRPM1 pool in ON-bipolar cells do beyond supplying the
    dendritic tips?
suggested_experiments:
- hypothesis: The ER pool of TRPM1 in ON-bipolar cells is a reserve that is trafficked to the dendritic tips on
    demand.
  description: Pulse-label endogenous TRPM1 (for example by a self-labelling tag knock-in in mouse) and follow its
    delivery from ER to dendritic tips under different light-adaptation states.
