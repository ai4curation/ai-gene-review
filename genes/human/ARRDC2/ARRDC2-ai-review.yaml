description: ARRDC2 is an alpha-arrestin (arrestin domain-containing) protein that localizes to the plasma
  membrane and cytoplasmic vesicles. Like other alpha-arrestins it carries PPxY motifs. It binds HECT
  ubiquitin ligases such as WWP1 and can act as an adaptor between these ligases and ESCRT components.
  In skeletal muscle, Arrdc2 expression rises quickly with mechanical unloading, and its overexpression
  reduces C2C12 myotube diameter, implicating it in disuse atrophy.
