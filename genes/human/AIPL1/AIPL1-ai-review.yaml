taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  AIPL1 is a retina- and pineal-enriched co-chaperone that supports the folding, assembly and stability
  of photoreceptor phosphodiesterase 6 (PDE6). Its TPR region and intact domain organization mediate
  association with HSP90, while its FKBP-like domain recognizes prenyl groups on client proteins.
  These complementary interactions support PDE6 biogenesis in the photoreceptor cytoplasm and inner
  segment. Nuclear AIPL1 is also detected during human retinal development. Biallelic loss of AIPL1
  compromises PDE6 abundance and cGMP homeostasis and causes severe early-onset retinal degeneration,
  including Leber congenital amaurosis 4.
