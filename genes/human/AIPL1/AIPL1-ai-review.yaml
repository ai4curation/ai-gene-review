- id: PMID:23737531
  title: Interaction of aryl hydrocarbon receptor-interacting protein-like 1 with the farnesyl
    moiety.
  findings:
  - statement: AIPL1 binds farnesylated-Cys through its FKBP-like domain.
    supporting_text: farnesylated-Cys binds exclusively to the FKBP domain of AIPL1
    reference_section_type: DISCUSSION
  - statement: The Discussion reports lack of canonical PPIase activity for the AIPL1 FKBP-like
      domain, citing earlier biochemical work.
    supporting_text: the FKBP domain of AIPL1 does not bind FK506 or exhibit
      peptidylprolylisomerase activity
    reference_section_type: DISCUSSION
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached identifier/title, abstract, Introduction and Discussion inspected.
      Direct farnesyl-probe binding and mutational conclusions are reported; the cached
      full-text extraction omits Methods/Results. The lack of PPIase activity is an explicit
      Discussion statement citing prior work, not a newly performed catalytic assay in this
      paper. The proposed necessity of prenyl recognition is qualified by the later
      PMID:35065964 experiments.
  full_text_unavailable: false
- id: PMID:28973376
  title: The integrity and organization of the human AIPL1 functional domains is critical for
    its role as a HSP90-dependent co-chaperone for rod PDE6.
  findings:
  - statement: AIPL1 is an HSP90-dependent co-chaperone for rod PDE6.
    supporting_text: >-
      AIPL1 functions as a photoreceptor-specific co-chaperone that interacts with
      the molecular chaperone HSP90
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached primary abstract plus indexed original PMC5886190 Results/Figures 3–5
      and Discussion inspected at https://pmc.ncbi.nlm.nih.gov/articles/PMC5886190/. Human AIPL1
      interactions are supported by co-IP, directed assays and ELISA with human HSP90α/β. Some
      PDE6 readouts are cellular cGMP abundance, not isolated catalytic activity; direct
      hydrolysis assays are distinguished in the later mouse-AIPL1 study. The publisher
      correction at https://doi.org/10.1093/hmg/ddy024 adds two omitted co-authors; it does not
      report a biological result correction. Local cache is abstract-only.
  full_text_unavailable: true
