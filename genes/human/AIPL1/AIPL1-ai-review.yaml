- id: PMID:35065964
  title: Molecular insights into the maturation of phosphodiesterase 6 by the specialized
    chaperone complex of HSP90 with AIPL1.
  findings:
  - statement: Mouse AIPL1 binds human HSP90 in the biochemical assays and supports maturation
      of human PDE6C in the heterologous expression system.
    supporting_text: AIPL1 preferentially binds to HSP90 in the closed state with a
      stoichiometry of 1:2
    reference_section_type: ABSTRACT
  - statement: Disrupting the tested mouse AIPL1–HSP90 interface impairs maturation of
      heterologously expressed PDE6C.
    supporting_text: Disruption of the AIPL1 interaction with HSP90 impedes maturation of PDE6
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached primary full Methods/Results/Discussion inspected. The biochemical and
      cell-expression experiments use mouse AIPL1, human HSP90β and human PDE6C; the rod
      farnesylation-deficient model is mouse. Supports a conserved chaperone mechanism, direct
      PDE6 activity readouts, and context-specific dispensability of prenyl recognition. Does
      not supply a direct human AIPL1 binding assay or prove that prenyl binding has no
      physiological role.
  full_text_unavailable: false
- id: PMID:32817338
  title: The ubiquitin-like modifier FAT10 inhibits retinal PDE6 activity and mediates its
    proteasomal degradation.
  full_text_unavailable: true
  findings:
  - statement: >-
      The study reports that AIPL1 stabilizes the FAT10 monomer and PDE6–FAT10 conjugate; FAT10 conjugation
      targets PDE6 for degradation and noncovalent FAT10 association inhibits PDE6 activity.
    supporting_text: We found that AIPL1 stabilizes the FAT10 monomer and the PDE6-FAT10
      conjugate.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Cached primary identifier/title/abstract inspected, with PubMed/PMC
      identifiers and DOI retained. Reports FAT10-mediated PDE6 conjugation/degradation and
      stabilization of FAT10 species by AIPL1. This does not by itself establish a specific
      molecular function for the separately annotated AIPL1–NUB1 interaction. Local content is
      abstract-only, despite its nonstandard cache metadata.
- id: PMID:38439910
  title: Effective AAV-mediated gene replacement therapy in retinal organoids modeling
    AIPL1-associated LCA4.
  findings:
  - statement: >-
      AIPL1 replacement in human retinal organoids restores PDE6 abundance and lowers elevated cGMP,
      with no notable PDE6 transcript change, supporting post-transcriptional rescue in models without
      overt photoreceptor degeneration.
    supporting_text: Our data suggest that this is a post-transcriptional phenomenon, since no
      notable changes in PDE6 transcripts or the transcriptome in general were detected either
      by qPCR or RNA-seq after AAV7m8.hRKp.AIPL1 treatment.
    reference_section_type: DISCUSSION
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached primary full Methods/Results/Discussion inspected. Human
      patient-derived and isogenic AIPL1-knockout retinal organoids show restoration of PDE6
      abundance and lower elevated cGMP after replacement. Transcript evidence supports
      post-transcriptional rescue. These organoids did not exhibit overt photoreceptor
      degeneration, so the paper is not treated as direct rescue of that absent phenotype.
  full_text_unavailable: false
