- term:
    id: GO:0018343
    label: protein farnesylation
  evidence_type: IDA
  original_reference_id: PMID:14555765
  qualifier: acts_upstream_of_or_within
  review:
    summary: AIPL1 enhances processing of a farnesylated client, but the affected chemical step
      is unresolved.
    action: UNDECIDED
    reason: GO:0018343 denotes covalent attachment of a farnesyl group. In the full
      PMID:14555765 Results and Figure 3, AIPL1 coexpression in HEK293 cells increases the
      faster-migrating processed DNAJA2 species, with a nonprenylatable Cys-to-Ser control;
      disease variants impair this effect. The Discussion leaves open improved lipid addition
      versus subsequent proteolysis/methylation, ER delivery or protection of the processed
      client. These data support a real processing effect but do not isolate participation in
      the covalent attachment step. A noncatalytic cofactor can participate in farnesylation, so
      absence of transferase catalysis is not a sufficient rejection. Retain uncertainty about
      this exact process instead of asserting a proven downstream-only mechanism or substituting
      the later PDE6-maturation assay for the original experiment.
    additional_reference_ids:
    - PMID:35065964
    supported_by:
    - reference_id: PMID:14555765
      supporting_text: Analysis of isoprenylation in cultured human cells shows that AIPL1
        enhances the processing of farnesylated proteins.
      reference_section_type: ABSTRACT
