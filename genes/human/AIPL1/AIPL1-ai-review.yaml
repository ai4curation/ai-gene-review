proposed_new_terms: []
suggested_questions:
- question: 'Which step of DNAJA2 CAAX processing is enhanced by AIPL1: farnesyl transfer, subsequent
    cleavage/methylation, or retention and trafficking of processed protein? The mobility assay in
    PMID:14555765 does not distinguish these possibilities.'
- question: What kinetic or spatial contribution does prenyl recognition make to PDE6 biogenesis
    in human photoreceptors, given the preserved endpoint maturation in the mouse and
    heterologous systems of PMID:35065964?
- question: Does the developmental nuclear AIPL1 pool carry a distinct molecular activity, and
    how is it related to cytoplasmic co-chaperoning?
- question: Do additional primary HSP70 or NUB1 experiments justify a specific functional
    annotation beyond the supported HSP90 interaction and contextual FAT10/PDE6 findings?
suggested_experiments:
- hypothesis: AIPL1 changes one or more separable stages of client CAAX processing.
  description: Measure farnesyl incorporation, terminal peptide cleavage and methylation
    separately for DNAJA2 with and without AIPL1, alongside the mobility shift and client
    abundance. Include the nonprenylatable client control and binding-deficient AIPL1 variants.
  experiment_type: Step-resolved biochemical processing assay
- hypothesis: Prenyl recognition improves the rate or spatial fidelity of PDE6 biogenesis in
    human photoreceptors without being absolutely required for endpoint folding.
  description: Compare human AIPL1 prenyl-binding variants with HSP90-interface variants in
    retinal organoids, using time-resolved PDE6 assembly, localization and direct
    cGMP-hydrolysis measurements.
  experiment_type: Human retinal-organoid variant complementation
