  title: AIPL1, a protein implicated in Leber's congenital amaurosis, interacts with and aids in
    processing of farnesylated proteins.
  findings:
  - statement: AIPL1 binds farnesylated proteins and aids their processing.
    supporting_text: AIPL1 interacts specifically with farnesylated proteins
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached abstract and independently recovered primary PMC240669 Results/Figures
      1–5 and Discussion inspected at https://pmc.ncbi.nlm.nih.gov/articles/PMC240669/.
      Farnesylation-defective clients and yeast controls support binding; the HEK293 DNAJA2
      mobility assay reports increased processed product, not a resolved measurement of the
      covalent lipid-transfer step. The paper discusses alternative affected steps. Mouse
      inner-segment staining supports donor localization. Local cache remains abstract-only. Its
      early HSP90 yeast assay was negative; later human co-IP and ELISA in PMID:28973376 provide
      positive evidence under different assay conditions.
  full_text_unavailable: true
