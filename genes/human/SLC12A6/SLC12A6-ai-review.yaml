- term:
    id: GO:0001525
    label: angiogenesis
  evidence_type: NAS
  original_reference_id: PMID:10187864
  qualifier: involved_in
  review:
    summary: >-
      NAS annotation derived from the original cloning paper, which identified
      KCC3 as a transcript up-regulated by the angiogenic factor VEGF in vascular
      endothelial cells.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The annotation rests only on KCC3 mRNA being VEGF-inducible (and
      TNF-repressible) in endothelial cells. Being regulated by an angiogenic
      factor and expressed in angiogenic endothelium is association/necessity, not
      participation: there is no evidence that KCC3 executes a step of
      angiogenesis. KCC3's characterized activity is K-Cl cotransport. Flagged as
      an over-annotation rather than removed because endothelial expression and
      VEGF-responsiveness are real.
    supported_by:
    - reference_id: PMID:10187864
      supporting_text: >-
        The KCC3 mRNA level in endothelial cells increased on treatment with VEGF
        and decreased with the proinflammatory cytokine tumor necrosis factor
        alpha
