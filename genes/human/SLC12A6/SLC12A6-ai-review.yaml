- term:
    id: GO:1990573
    label: potassium ion import across plasma membrane
  evidence_type: IDA
  original_reference_id: PMID:12657561
  qualifier: involved_in
  review:
    summary: >-
      Oocyte flux assays measured K+/Rb+ (and NH4+) uptake via KCC3, scored here as
      potassium import.
    action: MODIFY
    reason: >-
      KCC3 is an electroneutral, bidirectional K-Cl cotransporter whose
      physiological role is K-Cl efflux (K+ export), not import; the uptake measured
      in oocytes reflects the imposed assay gradients. The directional "import"
      term over-specifies and misstates the physiological direction. Generalize to
      the direction-neutral GO:0071805 potassium ion transmembrane transport, which
      the gene already carries.
    proposed_replacement_terms:
    - id: GO:0071805
      label: potassium ion transmembrane transport
    supported_by:
    - reference_id: PMID:12657561
      supporting_text: >-
        all of the CCCs examined (NKCC1, NKCC2, KCC1, KCC3, and KCC4) can promote
        NH4(+) translocation, presumably through binding of the ion at the K(+) site
core_functions:
- description: >-
    Swelling-activated electroneutral K+:Cl- cotransport across the plasma
    membrane, driving chloride exit, cell volume homeostasis (regulatory volume
    decrease) and control of intracellular chloride concentration; activity is
    inhibited by WNK-SPAK/OSR1 phosphorylation and relieved by hypotonic
    dephosphorylation.
  molecular_function:
    id: GO:0015379
    label: potassium:chloride symporter activity
  directly_involved_in:
  - id: GO:1902476
    label: chloride transmembrane transport
  - id: GO:0071805
    label: potassium ion transmembrane transport
  - id: GO:0006884
    label: cell volume homeostasis
  - id: GO:0055064
    label: chloride ion homeostasis
  locations:
  - id: GO:0005886
    label: plasma membrane
  - id: GO:0016323
    label: basolateral plasma membrane
  supported_by:
  - reference_id: PMID:10600773
    supporting_text: >-
      KCC3 transiently expressed in human embryonic kidney (HEK)-293 cells
      fulfilled three criteria for increased expression of K-Cl cotransport:
      stimulation of cotransport by swelling
  - reference_id: PMID:16048901
    supporting_text: >-
      All five NH(2)-terminal isoforms are activated by cell swelling (hypotonic
      conditions), with no activity under isotonic conditions
  - reference_id: PMID:19665974
    supporting_text: Cl(-) exit via K-Cl cotransporters (KCCs) is a major determinant of [Cl(-)]
  - reference_id: PMID:34031912
    supporting_text: >-
      Potassium-coupled chloride transporters (KCCs) play crucial roles in
      regulating cell volume and intracellular chloride concentration
suggested_questions:
- question: >-
    Beyond cell-autonomous K-Cl cotransport, what is the precise mechanism by
    which KCC3 loss causes peripheral axon degeneration and corpus callosum
    agenesis (e.g. axonal ion/volume regulation vs a developmental role)?
- question: >-
    Does the KCC3-CKB (brain creatine kinase) C-terminal interaction represent an
    additional, metabolically coupled regulatory input to transport activity in
    neurons?
suggested_experiments:
- description: >-
    Conditional, cell-type-specific Slc12a6 knockout (e.g. Schwann cell vs neuron)
    with axonal [Cl-]i and cell-volume imaging to dissect which KCC3-dependent
    ion/volume function is required for peripheral nerve maintenance.
- description: >-
    Structure-guided mutagenesis of the Thr-991/Thr-1048 phospho-sites and the
    N-terminal vestibule-occluding loop in primary neurons to test how
    WNK-SPAK/OSR1 regulation of K-Cl cotransport maps onto neuronal chloride
    homeostasis and GABAergic signalling.
