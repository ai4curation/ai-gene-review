id: Q9UHW9
gene_symbol: SLC12A6
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  SLC12A6 encodes KCC3, an electroneutral K+:Cl- cotransporter of the SLC12
  cation-chloride cotransporter family (K/Cl cotransporter subfamily). It is a
  multi-pass plasma-membrane glycoprotein that catalyses obligately coupled,
  Na+-independent cotransport of potassium and chloride down their combined
  electrochemical gradient (reaction K+(in) + Cl-(in) = K+(out) + Cl-(out)).
  Transport is quiescent under isotonic conditions and is activated by hypotonic
  cell swelling; activity is controlled by WNK-SPAK/OSR1 phosphorylation of
  C-terminal and N-terminal threonines (Thr-991, Thr-1048), with hypotonic
  dephosphorylation relieving inhibition. KCC3 functions as a homodimer (and can
  heterodimerise with KCC2). Through swelling-activated K-Cl efflux it is a major
  route of chloride exit, setting intracellular chloride concentration and
  mediating regulatory volume decrease / cell volume homeostasis. It is broadly
  expressed (brain, heart, kidney and other tissues), localising to the plasma
  membrane and basolaterally in polarized epithelia such as the renal proximal
  tubule. Loss of KCC3 function causes Andermann syndrome (peripheral neuropathy
  with agenesis of the corpus callosum, ACCPN), and dominant variants cause
  axonal Charcot-Marie-Tooth disease type 2II, reflecting an essential role in
  peripheral nervous system axon maintenance.
