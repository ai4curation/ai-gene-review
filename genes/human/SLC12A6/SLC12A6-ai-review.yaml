  review:
    summary: >-
      Phylogenetic (IBA) inference of apical plasma-membrane localization from the
      broader cation-chloride cotransporter clade (which includes apical members
      such as NKCC2/NCC).
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      KCC3 is documented to be basolateral in polarized epithelia, not apical. The
