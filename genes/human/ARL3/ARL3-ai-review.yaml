- term:
    id: GO:0005929
    label: cilium
  evidence_type: IDA
  original_reference_id: PMID:17646400
  qualifier: located_in
  negated: true
  review:
    summary: NOT located in cilium, from a GFP-tagged localization screen of Rab and Arl GTPases in serum-starved
      hTERT-RPE1 cells (Yoshimura et al. 2007), in which overexpressed EGFP-Arl family members other than
      ARL13B were not detected on primary cilia (Fig. S2 A).
    action: REMOVE
    reason: 'The full text shows the basis of the NOT is a negative result for an overexpressed EGFP-tagged
      construct in one cell line: Arl family GTPases "were also absent from primary cilia", and only Rab8a,
      Rabl5 and Arl13b showed cilium targeting. That establishes that GFP-ARL3 is not selectively targeted
      to or enriched in cilia under those conditions; it does not establish that ARL3 is absent or that its
      function lies outside the cilium. The function is defined inside the cilium: ARL13B, the ARL3 GEF,
      is confined to the ciliary membrane, so ARL3-GTP is generated inside the cilium, where it releases
      lipidated cargo from PDE6D and UNC119 (PMID:26551564). ARL3 is a soluble protein found throughout the
      cell and enriched in cilia; endogenous ARL3 stains cilia (PMID:16525022) and the photoreceptor connecting
      cilium (PMID:12417528). A NOT would be appropriate only if the function were shown to act outside
      the cilium, and the evidence shows the opposite.'
    supported_by:
    - reference_id: PMID:17646400
      supporting_text: In addition, Rabl4 and GTPases of the Arl family implicated in microtubule and cilia
        formation (Chiang et al., 2004; Schafer et al., 2006; Zhou et al., 2006; Qin et al., 2007) were also
        absent from primary cilia (Fig. S2 A).
    - reference_id: PMID:26551564
      supporting_text: We had anticipated that in order for Arl3 to mediate cargo release inside cilia, an
        Arl3-specific GEF should be localized there as well.
    - reference_id: PMID:26551564
      supporting_text: The highly conserved Arl3 − only present in ciliated organisms – localizes throughout
        the cell and is enriched in the primary cilium
    - reference_id: PMID:16525022
      supporting_text: Correlative evidence in support of this hypothesis was found in that staining of
        Arl3 was strikingly similar to that of acetylated tubulin in interphase cells, spindles, cilia,
        and midbodies.
    - reference_id: PMID:12417528
      supporting_text: In contrast, cofactor C and Arl3 localized predominantly to the photoreceptor connecting
        cilium in rod and cone photoreceptors.
