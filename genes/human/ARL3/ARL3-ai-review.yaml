id: P36405
gene_symbol: ARL3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'ARL3 (ADP-ribosylation factor-like 3) is a small Arf-family GTPase that acts as a cargo-release
  factor for lipidated ciliary proteins. In its GDP-bound form it is inactive. Inside the cilium it is
  loaded with GTP by its ciliary guanine nucleotide exchange factor ARL13B. ARL3-GTP binds the lipid-binding
  carrier proteins PDE6D (PDEdelta, for farnesylated/prenylated cargo such as INPP5E, GRK1, PDE6 subunits)
  and UNC119A/B (for myristoylated cargo such as NPHP3, transducin-alpha, cystin). This binding releases
  the cargo, so that lipidated proteins are deposited in the ciliary membrane. Because ARL13B is ciliary
  and the GTPase-activating protein RP2 is concentrated at the ciliary base and in the cytoplasm, ARL3
  activity is polarized: cargo is released inside the cilium and the carriers are recycled after RP2 stimulates
  GTP hydrolysis. ARL3 also binds ARL2BP/BART and the BART-like protein CFAP36/BARTL1 through its N-terminal
  amphipathic helix. It is found in the cilium (prominently the photoreceptor connecting cilium), at centrosomes,
  on mitotic spindles and midbodies, at the Golgi, and in the cytoplasm and nucleus. ARL3 depletion impairs
  cytokinesis in HeLa cells. ARL3 variants cause Joubert syndrome and inherited retinal dystrophy, and
  mouse Arl3 loss causes photoreceptor degeneration and renal cysts.'
