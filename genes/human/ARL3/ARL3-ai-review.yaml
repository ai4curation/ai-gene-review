- term:
    id: GO:0000281
    label: mitotic cytokinesis
  evidence_type: IMP
  original_reference_id: PMID:16525022
  qualifier: involved_in
  review:
    summary: ARL3 siRNA in HeLa cells causes failure of cytokinesis and binucleation.
    action: KEEP_AS_NON_CORE
    reason: Experimental observation, retained. The mechanism is unresolved, and the role is separate
      from the established ciliary cargo-release function.
    supported_by:
    - reference_id: PMID:16525022
      supporting_text: Knockdown of Arl3 by siRNA resulted in changes in cell morphology, increased acetylation
        of α-tubulin, failure of cytokinesis, and increased number of binucleated cells.
