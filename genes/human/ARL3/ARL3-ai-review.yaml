- id: file:human/ARL3/ARL3-deep-research-falcon.md
  title: Falcon deep research report for ARL3 (human)
  findings: []
core_functions:
- description: Small GTPase switch (G protein) that is activated in the cilium by its GEF ARL13B and inactivated
    by its GAP RP2. In the GTP-bound state it binds the lipid-binding carriers PDE6D and UNC119A/B and
    allosterically releases their farnesylated or myristoylated cargo (e.g. INPP5E, NPHP3) into the ciliary
    membrane, which sets ciliary membrane composition.
  molecular_function:
    id: GO:0003925
    label: G protein activity
  directly_involved_in:
  - id: GO:1903441
    label: protein localization to ciliary membrane
  locations:
  - id: GO:0005929
    label: cilium
  supported_by:
  - reference_id: PMID:22085962
    supporting_text: Furthermore, we found that binding of ARL3-GTP serves to release myristoylated cargo
      from UNC119.
  - reference_id: PMID:30269812
    supporting_text: Both missense variants replace the highly conserved Arg149 residue, which we show
      to be necessary for the interaction with its guanine nucleotide exchange factor ARL13B, such that
      the mutant protein is associated with reduced INPP5E and NPHP3 localization in cilia.
  - reference_id: PMID:26455799
    supporting_text: The ciliary protein Arl3 has been shown to act as a specific release factor for myristoylated
      and farnesylated ciliary cargo molecules by binding to the effectors Unc119 and PDE6δ.
  - reference_id: file:human/ARL3/ARL3-deep-research-falcon.md
    supporting_text: ARL3-GTP binds these carriers allosterically and promotes cargo release at the cilium;
      it is neither the lipid-modifying enzyme nor the cargo’s membrane transporter.
- description: GTP-dependent binding of effectors (PDE6D, UNC119A/B, ARL2BP/BART, CFAP36/BARTL1). For
    the cargo carriers, this binding is the mechanism of cargo displacement.
  molecular_function:
    id: GO:0030742
    label: GTP-dependent protein binding
  locations:
  - id: GO:0005929
    label: cilium
  supported_by:
  - reference_id: PMID:26455799
    supporting_text: The ciliary protein Arl3 has been shown to act as a specific release factor for myristoylated
      and farnesylated ciliary cargo molecules by binding to the effectors Unc119 and PDE6δ.
proposed_new_terms: []
suggested_questions:
- question: Is the cytokinesis/midbody role of ARL3 (from HeLa siRNA) mechanistically linked to its cargo-release
    function, for example via PDE6D/UNC119 cargo at the midbody, or is it independent?
- question: What is the basis of the negative ciliary localization reported in the Rab/Arl localization
    screen (PMID:17646400), given the positive endogenous and HPA ciliary data?
suggested_experiments:
- hypothesis: ARL3's role in cytokinesis is independent of ARL13B-driven cargo release.
  description: Test whether ARL3 knockout cells rescued with ARL13B-binding-deficient ARL3 (R149H/C) still
    complete cytokinesis normally, while failing to target INPP5E and NPHP3 to cilia.
  experiment_type: knockout rescue with separation-of-function mutants
