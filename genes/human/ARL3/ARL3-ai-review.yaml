      supporting_text: Recently, we could identify RP2, responsible for a variant of X-linked retinitis
        pigmentosa, as the Arl3-specific GAP.
- term:
    id: GO:0003925
    label: G protein activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q9WUL7
  - ensembl:ENSMUSP00000026009
  review:
    summary: G protein activity, by Ensembl Compara transfer.
    action: ACCEPT
    reason: ARL3 is a small-GTPase switch that cycles between GDP- and GTP-bound states. Its GEF is ARL13B
      and its GAP is RP2, and in the GTP-bound state it binds effectors (PDE6D, UNC119, ARL2BP, BARTL1).
      GO G protein activity explicitly covers small monomeric GTPases.
    supported_by:
    - reference_id: PMID:30269812
      supporting_text: Both missense variants replace the highly conserved Arg149 residue, which we show
        to be necessary for the interaction with its guanine nucleotide exchange factor ARL13B
    - reference_id: file:human/ARL3/ARL3-deep-research-falcon.md
      supporting_text: with ARL13B/BART-dependent activation and RP2-dependent termination
    - reference_id: file:human/ARL3/ARL3-deep-research-falcon.md
      supporting_text: ARL3-GTP binds these carriers allosterically and promotes cargo release at the
        cilium; it is neither the lipid-modifying enzyme nor the cargo’s membrane transporter.
