  review:
    summary: The inherited complex-membership claim is unresolved without a demonstrated CaV3.1 channel
      assembly.
    action: UNDECIDED
    reason: GO:0005891 requires a channel-forming protein complex; its GO:0032991 ancestor requires an
      assembly of multiple macromolecules functioning together. Autonomous CaV3.1 pore activity does not
      by itself establish such an assembly, and lack of mandatory auxiliary subunits does not prove that
      native complexes never occur. Caveolin-3 co-immunoprecipitation in PMID:21084288 supports scaffold
      association, not demonstrated membership of a stable channel-forming unit; that observation is not
      used as positive complex evidence. The PAINT assertion records PTN001295293, but its positive ancestral
      evidence and placement were not reconstructed. Unlike GO:0008331, which target-specific low-voltage
      recordings directly contradict, a generic complex can remain compatible with optional partners.
      Neither an HVA-like assembly nor loss of an ancestral assembly is established. Retain this row as
      UNDECIDED pending native-complex and ancestral-evidence review; donor number or identity is not
      the argument.
    additional_reference_ids:
    - PMID:26715324
    - PMID:21084288
    propagation_review:
      root_cause: UNRESOLVED
      source_entities:
      - source_id: PANTHER:PTN001295293
        source_status: UNRESOLVED
        comment: GOA supplies this ancestral node. The positive IBD placement and its relevant complex
          evidence were not recovered. Single-polypeptide T-type function does not demonstrate loss of
          native partner association, so no ancestral gain/loss or propagation failure is asserted.
