taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'CACNA1G encodes CaV3.1, the pore-forming subunit of a T-type calcium channel. Its four repeated
  membrane domains contain voltage sensors and the calcium-selective pore. Opening at relatively negative
  membrane potentials permits calcium entry across the plasma membrane and contributes to electrical excitability
  and rhythmic firing in neurons and cardiac nodal cells. Alternative splicing diversifies channel products.
  Dominant variants can perturb channel gating: the recurrent adult-onset ataxia-associated R1715H variant
  shifts voltage dependence, whereas particular de novo variants associated with severe childhood cerebellar
  disease increase window current and slow inactivation.'
