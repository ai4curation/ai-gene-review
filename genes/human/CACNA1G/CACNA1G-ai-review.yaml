- term:
    id: GO:0003163
    label: sinoatrial node development
  evidence_type: NAS
  original_reference_id: PMID:26786210
  qualifier: involved_in
  review:
    summary: Regulated expression of a functional SAN channel does not establish participation in node
      development.
    action: MARK_AS_OVER_ANNOTATED
    reason: GO:0003163 concerns progression of the sinoatrial node from formation to a mature structure.
      The accessed publisher SAN section of PMID:26786210 distinguishes Isl1-dependent developmental regulators
      from ion channels for SAN function, including Cacna1g. Downregulation of the channel after loss
      of Isl1 establishes regulation within that program, not that the channel itself performs a step
      in node formation or maturation. The NAS developmental assertion therefore exceeds the cited mechanistic
      evidence. This judgment does not deny established pacemaker-current function or rule out a separately
      demonstrated developmental contribution.
