id: O14788
gene_symbol: TNFSF11
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: TNFSF11 encodes RANKL, a type II membrane and soluble TNF-superfamily
  cytokine that binds RANK/TNFRSF11A and osteoprotegerin/TNFRSF11B to regulate osteoclast
  differentiation, osteoclast activation, bone resorption, and contextual immune signaling.
