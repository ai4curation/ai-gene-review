    label: negative regulation of transcription by RNA polymerase II
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:O35235
  - ensembl:ENSMUSP00000022592
  review:
    summary: Mark transferred context as over-annotated.
    action: MARK_AS_OVER_ANNOTATED
    reason: The mouse Rankl/RANK transfer to negative regulation of transcription
      by RNA polymerase II is a physiological downstream readout and is too indirect
      for a human TNFSF11 GO assertion.
    supported_by:
    - reference_id: file:interpro/panther/PTHR11471/PTHR11471-review.yaml
      supporting_text: "Every PTHR11471 ligand binds one or more receptors of the\
        \ tumor necrosis\n      factor receptor superfamily via conserved crevices\
        \ between monomers of\n      the homotrimeric TNF-homology domain."
- term:
    id: GO:0002548
    label: monocyte chemotaxis
  evidence_type: IDA
  original_reference_id: PMID:15248232
  qualifier: involved_in
  review:
    summary: Keep direct monocyte chemotaxis as non-core.
    action: KEEP_AS_NON_CORE
    reason: Human RANKL can stimulate monocyte chemotaxis through RANK, but this leukocyte
      migration assay is contextual relative to the core RANKL-RANK osteoclastogenic
      axis.
    supported_by:
    - reference_id: PMID:15248232
      supporting_text: "RANKL significantly stimulated monocyte chemotaxis via activation\
        \ of \nphosphatidylinositol 3-kinase, phosphodiesterase, and Src kinase."
