unresolved_claims:
- row_zero_based: 57
  term:
    id: GO:0014059
    label: regulation of dopamine secretion
  reason: The literal mouse donor for this term cites PMID:19887632. Its recovered main Methods/Results
    directly establish D2-receptor surface trafficking and neuronal excitability; a dopamine-release measurement
    was not recovered in the selected original or available supplement material. This is an access/claim-resolution
    gap, not evidence that the curator cited the wrong study. Preserve the original assertion and leave
    the narrower dopamine-secretion claim undecided rather than substitute receptor trafficking or infer
    secretion from excitability.
- row_zero_based: 64
  term:
    id: GO:0030426
    label: growth cone
  reason: The matching mouse growth-cone IDA record cites PMID:16980328. The recovered operative source
    windows establish axonal, synaptic and dendritic localization but do not resolve that specific growth-cone
    assay. PMID:19428785 independently reports growth-cone localization in cultured neurons at abstract
    level; its full Methods and exact culture/construct species were not recovered. These are positive
    curator/source signals, not grounds for removal, but the specific transfer remains undecided rather
    than conflating a growth cone with any axonal terminal.
- row_zero_based: 89
  term:
    id: GO:0060041
    label: retina development in camera-type eye
  reason: The rat source joins an IEP record citing PMID:23954924. The available authentic abstract describes
    developmental dysbindin expression in Müller cells and retinal tissue, but the full functional experiments
    could not be accessed. This does not establish that the annotation is wrong, nor does expression timing
    alone identify a performed developmental step. Preserve the source assertion as undecided pending
    the full target-specific evidence.
core_mechanism:
  membrane_bending: GO:0180020 is a contribution to assembled BLOC-1 in PMID:36169638, which uses dysbindin
    1–259, not a purified independent activity of all natural products. The term describes induction of
    deformation rather than preferential curvature sensing.
  neuronal_regulation: The second core deliberately has no autonomous MF. Release/receptor regulation
    does not establish motor, SNARE, kinase, receptor-binding or direct cytoskeletal bridging activity.
