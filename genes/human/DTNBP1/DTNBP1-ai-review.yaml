suggested_questions:
- question: Which regions of dysbindin contact membranes or support bending within assembled
    BLOC-1, and are the three sequence-authenticated natural products equivalent in that role?
- question: Which molecular partners account for acute release-kinetics rescue versus slower
    effects on vesicle populations and dopamine receptor trafficking?
- question: Can independent endogenous product-specific measurements resolve nuclear and synaptic
    distributions without relying on the disputed fraction-marker blots?
- question: What original experiments support the exact dopamine-secretion, growth-cone and
    retina-development donor assertions that remain unresolved?
suggested_experiments:
- description: Reconstitute BLOC-1 with each sequence-authenticated natural dysbindin product
    and matched truncation controls; measure incorporation, membrane binding and tubulation
    separately.
- description: Compare acute dysbindin restoration with longer rescue in the same neuronal system,
    measuring release kinetics, vesicle number and receptor recycling with independent controls.
- description: Use validated endogenous product-specific tagging or targeted proteomics with
    independent compartment markers and release uncropped source images.
