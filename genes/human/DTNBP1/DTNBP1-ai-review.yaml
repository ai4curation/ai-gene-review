id: Q96EV8
gene_symbol: DTNBP1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: DTNBP1 encodes dysbindin, a coiled-coil subunit of the BLOC-1 complex. BLOC-1 associates
  with endosomal membranes and shapes tubular carriers that sort cargo toward lysosome-related
  organelles and other destinations. Dysbindin contributes to melanosome and platelet dense-granule
  biogenesis and to neuronal vesicle trafficking. It also regulates synaptic vesicle release
  and dopamine D2 receptor trafficking. Biallelic loss of DTNBP1 causes Hermansky-Pudlak syndrome
  type 7, with defects in pigmentation and platelet dense granules. Alternative protein products
  differ in sequence and have incompletely resolved functional specialization.
alternative_products:
- name: 1 (Dysbindin 1-A)
  id: Q96EV8-1
  description: The displayed 351-residue product. Recombinant complex studies use shorter dysbindin
    constructs, including residues 1–217 or 1–259, and do not by themselves establish identical
    behavior of every full-length natural product.
- name: '2'
  id: Q96EV8-2
  sequence_note: VSP_009023
  description: A 303-residue product in which the canonical C-terminal 80 residues are replaced
    by 32 residues (VSP_009023). Historical studies also use lettered product names; those labels
    are not sufficient to authenticate the current accession or its cellular partition.
- name: 3 (Dysbindin 1-B)
  id: Q96EV8-3
  sequence_note: VSP_046062
  description: A 270-residue product lacking canonical residues 1–81 (VSP_046062). The official
    synonym is Dysbindin 1-B; historical papers call a 270-residue product C. No functional
    equivalence or sequence identity is inferred from the letter alone. Exact fraction-specific
    conclusions from the 2011 study are limited by its subsequent Expression of Concern.
