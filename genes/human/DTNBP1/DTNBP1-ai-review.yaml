    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:15102850
  qualifier: enables
  supporting_entities:
  - UniProtKB:O95295
  review:
    summary: Supported association with O95295 (SNAPIN).
    action: KEEP_AS_NON_CORE
    reason: The original human-construct Y2H study and endogenous HeLa co-IP support this pair.
      The co-IP records are spoke expansions of a multicomponent complex; the separate two-hybrid
      records are binary assay evidence, not a native affinity measurement. SNAPIN is an adaptor
      and BLOC-1 subunit, not itself a SNARE. Binding SNAPIN cannot be relabeled SNARE binding,
      and no established specific binding term for this subunit is demonstrated. The positive
      association is retained as non-core under the project instruction; BLOC-1 membership is
      assessed separately.
    supported_by:
    - reference_id: PMID:15102850
