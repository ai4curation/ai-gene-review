- description: Dysbindin regulates synaptic vesicle exocytosis and dopamine D2 receptor trafficking.
    Mouse acute-protein rescue distinguishes effects on fusion kinetics and quantal size from
    slower changes in release probability, while human neuronal-cell and rat-neuron studies
    link dysbindin to D2 internalization and downstream signaling. These results establish trafficking
    and release regulation without identifying an autonomous fusion, motor or receptor-binding
    activity.
