    label: positive regulation of neurotransmitter secretion
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q91WZ8
  review:
    summary: Conserved positive regulation of transmitter release.
    action: ACCEPT
    reason: The literal mouse donor has IMP support from PMID:18504299. Sandy chromaffin cells
      and hippocampal neurons have altered release; acute delivery of purified mouse dysbindin
      rescues fusion-event kinetics and quantal size, although not release probability or total
      release in that interval. This supports an active regulatory contribution, not an autonomous
      fusion enzyme or identical effects on every release parameter. The human transfer is consistent
      with conserved vesicle trafficking; the experiments themselves are mouse.
    supported_by:
    - reference_id: PMID:18504299
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
