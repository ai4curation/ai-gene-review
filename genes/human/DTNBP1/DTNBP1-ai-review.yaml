  knowledge_gaps:
  - gap_statement: The membrane-contacting contribution of dysbindin within BLOC-1 and the functional
      equivalence of its three natural protein products are not resolved by the reconstituted-complex
      experiments.
    boundary: Membrane deformation is demonstrated for the assembled human complex containing
      a dysbindin fragment; complex incorporation and an isolated fragment are not interchangeable
      with independent activity of each natural product.
    provenance:
    - reference_id: PMID:36169638
