  - ensembl:ENSRNOP00000091788
  review:
    summary: Positive control of D2-receptor internalization in the tested cells.
    action: ACCEPT
    reason: The rat donor record joins PMID:17989303. Dysbindin depletion in human SH-SY5Y cells
      and rat cortical neurons increases surface D2 receptor and impairs agonist-induced internalization,
      with D1 receptor controls. Mouse cortical neurons in PMID:19887632 instead show enhanced
      D2 recycling with little change in internalization. These context-dependent routes both
      support receptor-trafficking control; the latter does not negate the earlier positive
      internalization result or establish a universal mechanism.
