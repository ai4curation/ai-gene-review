  - UniProtKB:O14980
  review:
    summary: Supported association with O14980 (XPO1).
    action: KEEP_AS_NON_CORE
    reason: The original uses human 351-aa dysbindin constructs, recombinant GST-dysbindin capture
      from HEK293 lysate and FLAG co-IP; endogenous N2a experiments are separate. These support
      association but are not a purified two-protein affinity assay. XPO1/CRM1 is the nuclear
      export receptor for the dysbindin NES. It is not a ligand-regulated DNA-binding nuclear
      receptor, so nuclear receptor binding would be misleading. Retain the experimentally supported
      export-receptor association as non-core; being exported does not make dysbindin an export
      catalyst.
