core_functions:
- description: Dysbindin is a structural subunit of BLOC-1, a complex that deforms endosomal
    membranes into tubular transport carriers. Recombinant human BLOC-1 containing dysbindin
    residues 1–259 bends negatively charged membranes; this establishes a contribution to the
    complex activity, not autonomous membrane bending by isolated dysbindin. The complex coordinates
    carrier formation and selective cargo trafficking, supporting melanosome and platelet dense-granule
    biogenesis and neuronal anterograde vesicle trafficking.
