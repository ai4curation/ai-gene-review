  qualifier: enables
  supporting_entities:
  - UniProtKB:Q9NX95
  review:
    summary: Supported association with Q9NX95 (SYBU).
    action: KEEP_AS_NON_CORE
    reason: The genuine publisher supplementary Screen Results workbook identifies DTNBP1 bait
      and human FLJ20366/SYBU prey (AY705385), fetal-brain library, PBS B, five clones. In the
      literal IntAct record EBI-1105796 / IM-16650-62, SYBU is interactor A (prey) with no recorded
      feature, whereas DTNBP1 is interactor B (bait) with binding-associated region 1–189. The
      supplementary workbook identifies the pair and library but gives no residue boundaries,
      so it does not independently resolve the construct extent. The region is therefore attributed
      only to the DTNBP1 side of that curated record, not to SYBU. This is a positive human
      fragment-library Y2H observation, not a DTNBP1–DISC1 pair. SYBU/syntabulin is a kinesin-associated
      trafficking adaptor, not the kinesin motor itself. This positive association does not
      support kinesin binding by substitution of a different ligand. No more informative binding
      class is established for the measured adaptor, so retain it as non-core.
    supported_by:
    - reference_id: PMID:17043677
