- term:
    id: GO:0034045
    label: phagophore assembly site membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  review:
    summary: >-
      Phagophore assembly site membrane: the evidence describes ATG9A on the phagophore
      itself, not on a membrane bounding the assembly site.
    action: MODIFY
    reason: >-
      GO:0034045 asserts via bounding_layer_of that a membrane bounds the phagophore
      assembly site. The PAS is a liquid-like protein condensate with no bounding bilayer
      (PMID:32025038), and the term carries phagophore and isolation membrane as related
      synonyms of the distinct term GO:0061908 - see GO issue #29437 and
      projects/CONDENSATES/GO_0034045-annotation-audit.md. ATG9A is the emblematic case in
      that issue's section 5.4 triage: it colocalizes with ATG2 at the expanding edge of the
      isolation membrane. Moved to GO:0061908, the existing term those synonyms belong to.
      The precise destination is the phagophore membrane, proposed under proposed_new_terms,
      since ATG9A is an integral membrane protein of that bilayer rather than merely present
      at the structure.
    proposed_replacement_terms:
    - id: GO:0061908
      label: phagophore
    supported_by:
    - reference_id: PMID:33106658
      supporting_text: Atg9 colocalizes with Atg2 at the expanding edge of the isolation membrane (IM), where Atg2 receives phospholipids from the endoplasmic reticulum (ER).
- term:
