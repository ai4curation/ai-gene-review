- term:
    id: GO:0017128
    label: phospholipid scramblase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: >-
      Lipid scramblase activity of the ATG9A homotrimer; the gene's core molecular function.
    action: ACCEPT
    reason: >-
      ATG9A is a homotrimeric multi-pass membrane protein with a central pore that forms a
      path between the two membrane leaflets, and it scrambles phospholipids in vitro; pore
      mutations reduce scrambling and yield markedly smaller autophagosomes. This is the
      gene's defining biochemical activity and the reason it is the only transmembrane
      protein of the core autophagy machinery.
    supported_by:
    - reference_id: PMID:33106659
      supporting_text: Mutations in the pore reduce scrambling activity and yield markedly smaller autophagosomes, indicating that lipid scrambling by ATG9A is essential for membrane expansion.
- term:
    id: GO:0000423
    label: mitophagy
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: >-
      Mitophagy, one selective autophagy route among several that use the core machinery.
    action: KEEP_AS_NON_CORE
    reason: >-
      ATG9A contributes as core machinery rather than as a mitophagy-specific factor.
      Non-core, alongside reticulophagy.
- term:
    id: GO:0061709
    label: reticulophagy
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: >-
      Reticulophagy, another selective route served by the same core machinery.
    action: KEEP_AS_NON_CORE
    reason: >-
      Same reasoning as mitophagy: participation is via the general phagophore machinery,
      not a receptor-level specificity.
- term:
    id: GO:0034727
    label: piecemeal microautophagy of the nucleus
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: >-
      Piecemeal microautophagy of the nucleus, a yeast-defined process propagated
      phylogenetically.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      PMN is characterised in budding yeast at the nucleus-vacuole junction. Propagating it
      to human ATG9A by IBA asserts a process whose mammalian counterpart is not
      established. Over-annotated rather than removed, since the underlying machinery is
      genuinely shared.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - LINEAGE_OR_TAXON_MISMATCH
      - CONTEXT_OR_TISSUE_MISMATCH
      source_entities:
      - source_id: SGD:S000002308
        source_label: ATG9 (Saccharomyces cerevisiae)
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Yeast Atg9 is genuinely required for piecemeal microautophagy of the nucleus, which
          proceeds at the nucleus-vacuole junction formed by Nvj1-Vac8. Humans have no
          vacuole and no characterised NVJ equivalent, so the process term does not transfer
          even though the Atg9 orthology is sound.
      - source_id: PANTHER:PTN000315580
        source_label: ATG9 family node
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          The node correctly groups ATG9 orthologs; the error is in propagating a
          fungal-specific process term across the whole node rather than in the grouping.
