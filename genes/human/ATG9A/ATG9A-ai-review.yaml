- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:19893488
  qualifier: enables
  review:
    summary: >-
      Bare protein binding from ten independent IPI experiments; uninformative as a function
      statement.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Per project curation guidance, protein binding does not describe what the gene product
      does. The interactions behind these annotations are individually meaningful - ATG2A
      via the ATG9A C-terminus, AP4M1, ARFIP1/2, PI4K2A/PI4KB, ATG4A - and belong in the
      interaction record or as specific adaptor/tethering terms, not as a bare binding
      annotation.
