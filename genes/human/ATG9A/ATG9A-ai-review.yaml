id: Q7Z3C6
gene_symbol: ATG9A
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  ATG9A is the only transmembrane protein of the core autophagy machinery. It is a
  multi-pass membrane protein that assembles into a homotrimer with a central, solvated
  pore connecting the two membrane leaflets, and this architecture gives it phospholipid
  scramblase activity. Small ATG9A-containing vesicles are delivered to the site of
  autophagosome formation, where ATG9A concentrates with ATG2 at the expanding edge of the
  phagophore; there it equilibrates across the bilayer the glycerophospholipids that ATG2
  transfers from the endoplasmic reticulum into the cytosolic leaflet. Without that
  equilibration, lipid delivered by ATG2 would accumulate in one leaflet and membrane
  expansion would stall, which is why pore mutations that reduce scrambling produce markedly
  smaller autophagosomes. Between rounds of autophagy ATG9A resides in a cycling pool that
  moves through the trans-Golgi network, recycling endosomes and late endosomes, and its
  trafficking is directed by adaptors including the AP-4 complex.
