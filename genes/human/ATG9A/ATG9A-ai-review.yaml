core_functions:
- description: >-
    Equilibrates glycerophospholipids between the two leaflets of the growing phagophore,
    acting on the lipid that ATG2 delivers into the cytosolic leaflet at the ER-phagophore
    interface. This is the activity that permits phagophore expansion.
  molecular_function:
    id: GO:0017128
    label: phospholipid scramblase activity
  directly_involved_in:
  - id: GO:0000045
    label: autophagosome assembly
  locations:
  - id: GO:0061908
    label: phagophore
  - id: GO:0000407
    label: phagophore assembly site
  supported_by:
  - reference_id: PMID:33106659
    supporting_text: Mutations in the pore reduce scrambling activity and yield markedly smaller
      autophagosomes, indicating that lipid scrambling by ATG9A is essential for membrane expansion.
  - reference_id: PMID:33106658
    supporting_text: Atg9 colocalizes with Atg2 at the expanding edge of the isolation membrane
      (IM), where Atg2 receives phospholipids from the endoplasmic reticulum (ER).
- description: >-
    Supplies membrane to the forming autophagosome as a cycling vesicle pool that moves
    between the trans-Golgi network, recycling and late endosomes, and the phagophore
    assembly site.
  molecular_function:
    id: GO:0017128
    label: phospholipid scramblase activity
  directly_involved_in:
  - id: GO:0034497
    label: protein localization to phagophore assembly site
  locations:
  - id: GO:0005802
    label: trans-Golgi network
  - id: GO:0055038
    label: recycling endosome membrane
  - id: GO:0031902
    label: late endosome membrane
proposed_new_terms:
- proposed_name: phagophore membrane
  proposed_definition: >-
    The membrane system of a phagophore, comprising its two closely apposed lipid bilayers
    and the continuous rim that joins them, which expands by lipid acquisition and closes to
    form the double membrane of an autophagosome.
  justification: >-
    ATG9A is an integral multi-pass protein of this bilayer, not merely a resident of the
    structure, so GO:0061908 phagophore records its location less precisely than the evidence
    supports. GO has autophagosome membrane (GO:0000421) and omegasome membrane (GO:1903349)
    but no phagophore membrane, which is why such annotations went to GO:0034045 phagophore
    assembly site membrane - a term that asserts via bounding_layer_of a bounding membrane the
    PAS does not have (PMID:32025038). See GO issue #29437 recommendation R3. The
    sheet-versus-system question is unresolved upstream; this proposal takes the collective
    reading.
  proposed_parent:
    id: GO:0016020
    label: membrane
suggested_questions:
- question: >-
    Does ATG9A scramblase activity have lipid-headgroup preference in vivo, or is it
    non-selective as the in-vitro liposome assays suggest?
  experts: []
- question: >-
    What fraction of the final autophagosomal surface derives from ATG9A-vesicle membrane
    delivered at the assembly site, versus lipid transferred through ATG2?
  experts: []
suggested_experiments:
- hypothesis: >-
    ATG9A scrambling and ATG2 transfer are kinetically coupled, so that slowing one limits
    the other.
