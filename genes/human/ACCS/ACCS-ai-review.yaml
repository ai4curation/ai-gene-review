- id: PMID:39876065
  title: Cysteine S-conjugate sulfoxide β-lyase activity for human ACCS.
  publication_type: PRIMARY_RESEARCH
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full-text primary biochemical and structure-function study purified human
      ACCS (Q96QU6) to homogeneity, proved stoichiometric PLP binding via K323,
      discovered cysteine S-conjugate sulfoxide C-beta-S lyase activity, and
      mapped the inter-subunit catalytic pocket by mutagenesis.
  findings:
  - statement: >-
      Purified human ACCS binds stoichiometric PLP via Lys323 and catalyzes
      cysteine S-conjugate sulfoxide beta-lyase cleavage, with substrate
      orientation mediated by Arg457 and an inter-subunit homodimer pocket
      defined by Trp135, Tyr132, and Arg351.
    supporting_text: >-
      The PLP-bound substrate 4 is oriented by R457, while its side chain
      extends into a side pocket primarily defined by residues from the other
      monomer within the homodimer, including W135(B), Y132(B), and R351(B).
    residue_mappings:
    - as_reported:
        accession: UniProtKB:Q96QU6
        position: 323
        residue: K
        sequence_version: 1
      note: >-
        Active-site Schiff-base lysine and general base numbered directly on
        canonical Q96QU6 (501 aa).
    - as_reported:
        accession: UniProtKB:Q96QU6
        position: 286
        residue: D
        sequence_version: 1
