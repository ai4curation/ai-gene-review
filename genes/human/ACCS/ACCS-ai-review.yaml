- term:
    id: GO:0016847
    label: 1-aminocyclopropane-1-carboxylate synthase activity
  evidence_type: IDA
  original_reference_id: PMID:11470512
  qualifier: enables
  negated: true
  review:
    summary: >-
      Valid negative experimental annotation (NOT enables GO:0016847): purified
      recombinant human ACCS does not catalyze ACC formation from
      S-adenosyl-L-methionine.
    action: ACCEPT
    reason: >-
      Both Koch et al. 2001 (PMID:11470512, recombinant human PHACS purified
      from Pichia pastoris) and Gao et al. 2025 (PMID:39876065, recombinant
      hACCS purified from Saccharomyces cerevisiae) directly assayed SAM
      turnover and experimentally demonstrated complete absence of
      1-aminocyclopropane-1-carboxylate synthase activity; separately,
      AlphaFold2 homology modeling and AutoDock Vina docking hypothesize that
      partner-subunit Tyr132 sterically impedes productive SAM binding alongside
      divergence of plant ACS active-site residues (PMID:39876065).
    supported_by:
    - reference_id: PMID:11470512
      supporting_text: >-
        Purified recombinant PHACS, expressed in Pichia pastoris, contains bound
        pyridoxal-5'-phosphate (PLP), but does not catalyze the synthesis of
        ACC.
    - reference_id: PMID:39876065
      supporting_text: >-
        Despite having an amino acid sequence most similar to plant ACCS (e.g.,
        < 32% sequence identity), human ACCS (hereafter referred to as hACCS)
        does not exhibit any ACC synthase activity.
    - reference_id: PMID:39876065
      supporting_text: >-
        We also docked SAM to understand the loss of ACCS activity (Figure S2).
        Apparent steric clash was observed between the side chain of SAM and
        residue Y132(B), which would suggest that binding of SAM is impeded in
        hACCS due to steric hinderance.
