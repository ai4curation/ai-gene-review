- term:
    id: GO:0047804
    label: cysteine-S-conjugate beta-lyase activity
  evidence_type: IDA
  original_reference_id: PMID:39876065
  qualifier: enables
  review:
    summary: >-
      Proposed new core molecular function annotation: purified recombinant
      human ACCS catalyzes PLP-dependent cysteine-S-conjugate beta-lyase
      cleavage of non-sulfoxide S-aryl-L-cysteine conjugates (EC 4.4.1.13) and
      cysteine S-sulfoxides.
    action: NEW
    reason: >-
      Gao et al. 2025 (PMID:39876065) demonstrated by LC-MS pyruvate kinetics
      and active-site mutagenesis (K323A, R457C, R351A/Y, W135A/Y, Y195F) that
      purified human ACCS exhibits full Michaelis-Menten saturation kinetics on
      the non-sulfoxide conjugate S-phenyl-L-cysteine (substrate 4: Km = 0.5 mM,
      kcat = 0.4 s^-1, kcat/Km ~ 700 M^-1 s^-1 -> thiol + NH3 + pyruvate, EC
      4.4.1.13) alongside cysteine S-sulfoxides including S-phenyl-L-cysteine
      sulfoxide (substrate 10: kcat = 14 s^-1, kcat/Km ~ 700 M^-1 s^-1) and
      alliin (substrate 9), exceeding weak L-vinylglycine deamination by two
      orders of magnitude with no gamma-lyase or beta-replacement activity.
      GO:0047804 (cysteine-S-conjugate beta-lyase activity, is_a GO:0016846) is
      therefore the exact supported specific molecular function for human ACCS.
    supported_by:
    - reference_id: PMID:39876065
      supporting_text: >-
        In this study, through a biochemical profiling approach, we demonstrate
        that human ACCS possesses cysteine conjugate sulfoxide β-lyase activity.
    - reference_id: PMID:39876065
      supporting_text: >-
        The catalytic efficiency (kcat/Km) for 4 and 10 are approximately the
        same (~700 M−1s−1), and both exceed that of the vinylglycine deamination
        reaction by two orders of magnitude (Figure 5). However, reaction with
        substrate 4 shows saturation kinetics with an apparent Km of 0.5 mM,
        whereas substrate 10 does not reach saturation up to 16 mM. The turnover
        number (kcat) for 10 (14 s−1) is 38-fold higher than 4 (0.4 s−1),
        consistent with the results shown above that sulfoxide substrates are
        more reactive than non-sulfoxide cysteine conjugate.
    - reference_id: file:human/ACCS/ACCS-deep-research-affinage.md
      supporting_text: >-
        Human ACCS is a pyridoxal-phosphate-dependent enzyme that, despite its
        annotation as a 1-aminocyclopropane-1-carboxylate synthase homolog,
        lacks canonical ACC synthase activity and instead catalyzes cysteine
        conjugate sulfoxide β-lyase activity [PMID:39876065].
core_functions:
- description: >-
    Homodimeric PLP-dependent cysteine-S-conjugate beta-lyase that binds
    stoichiometric pyridoxal 5'-phosphate via Lys323 and catalyzes
    alpha,beta-elimination of S-aryl-L-cysteine conjugates (such as
    S-phenyl-L-cysteine, EC 4.4.1.13) and S-alkyl/aryl-L-cysteine sulfoxides
    (such as S-phenyl-L-cysteine sulfoxide and alliin) into pyruvate, ammonia,
    and thiol or sulfenic acid products, using an inter-subunit pocket formed by
    Arg457 together with partner-monomer Trp135, Tyr132, and Arg351
    (PMID:11470512, PMID:39876065).
  molecular_function:
    id: GO:0047804
    label: cysteine-S-conjugate beta-lyase activity
  supported_by:
  - reference_id: PMID:39876065
    supporting_text: >-
      In this study, through a biochemical profiling approach, we demonstrate
      that human ACCS possesses cysteine conjugate sulfoxide β-lyase activity.
  - reference_id: PMID:39876065
    supporting_text: >-
      The PLP-bound substrate 4 is oriented by R457, while its side chain
      extends into a side pocket primarily defined by residues from the other
      monomer within the homodimer, including W135(B), Y132(B), and R351(B).
  - reference_id: PMID:11470512
    supporting_text: >-
      Purified recombinant PHACS, expressed in Pichia pastoris, contains bound
      pyridoxal-5'-phosphate (PLP), but does not catalyze the synthesis of ACC.
knowledge_gaps:
- gap_statement: >-
    The endogenous or xenobiotic cysteine S-conjugate sulfoxide substrate(s) of
    human ACCS in vivo and its physiological metabolic pathway—potentially
    downstream of flavin-containing monooxygenases in hepatic glutathione-based
    mercapturic-acid detoxication—have not yet been experimentally established.
  boundary: >-
    Stoichiometric PLP binding at Lys323, obligate homodimerization, absence of
    ACC synthase activity, and in vitro C-beta-S lyase catalysis on model
    S-alkyl/aryl-L-cysteine sulfoxides are established (PMID:11470512,
    PMID:39876065), whereas in vivo substrate identity and cellular pathway
    participation remain unassayed.
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  status: OPEN
  significance: >-
    Although kcat/Km (~700 M^-1 s^-1) on synthetic S-phenyl-L-cysteine sulfoxide
