id: Q96QU6
gene_symbol: ACCS
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  1-aminocyclopropane-1-carboxylate synthase-like protein 1 (ACCS, also known as
  PHACS) is a 501-residue homodimeric fold-type I pyridoxal 5'-phosphate
  (PLP)-dependent cysteine-S-conjugate beta-lyase encoded on human chromosome
  11p11.2 adjacent to its mammalian-specific paralog ACCSL. Despite ~30%
  sequence identity to plant 1-aminocyclopropane-1-carboxylate (ACC) synthases,
  purified ACCS lacks ACC synthase activity toward S-adenosyl-L-methionine
  (SAM); active-site AlphaFold2 homology modeling and AutoDock Vina docking
  suggest partner-subunit Tyr132 sterically impedes productive SAM binding, in
  addition to divergence of plant ACS catalytic residues. Instead, ACCS binds
  stoichiometric PLP covalently at Lys323 (coordinated by Asp286, Arg331,
  Asn258, Tyr195, and inter-subunit Tyr132) and catalyzes alpha,beta-elimination
  of S-alkyl- and S-aryl-L-cysteine sulfoxides and non-sulfoxide S-aryl-L-cysteine
  conjugates—and at much lower efficiency non-physiological L-vinylglycine—into
  pyruvate, ammonia, and sulfenic acid or thiol products. Substrate recognition
  relies on Arg457 to anchor the alpha-carboxylate group together with
  partner-monomer Trp135, Tyr132, and Arg351 across the homodimer interface;
  although its in vitro specificity resembles hepatic cysteine S-conjugate
  beta-lyase activity in glutathione-derived xenobiotic metabolism, its
  endogenous in vivo substrates, physiological pathway, and native subcellular
  localization remain uncharacterized.
alternative_products:
- name: '1'
  id: Q96QU6-1
  description: >-
    Canonical full-length 501-residue polypeptide containing the intact
    fold-type I PLP-dependent catalytic domain, Schiff-base Lys323, substrate
    alpha-carboxylate-anchoring Arg457, and inter-subunit pocket residues
    Tyr132, Trp135, and Arg351; biochemically characterized as a homodimeric
    cysteine S-conjugate sulfoxide beta-lyase.
- name: '2'
  id: Q96QU6-2
  sequence_note: VSP_055800, VSP_055801
  description: >-
    Truncated 158-residue splice variant that substitutes residues 117-158 and
    lacks residues 159-501, removing the core PLP-binding catalytic domain
    including Asp286, Lys323, Arg351, and Arg457 and therefore predicted to be
    catalytically inactive.
