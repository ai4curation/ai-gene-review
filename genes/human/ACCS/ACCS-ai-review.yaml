- id: file:human/ACCS/ACCS-deep-research-affinage.md
  title: Affinage mechanistic annotation for ACCS (human)
  publication_type: OTHER
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Affinage synthesis (faith_pct 66.67%, pairwise win, 1 discovery) accurately
      captures PMID:39876065's demonstration of PLP-dependent cysteine conjugate
      sulfoxide beta-lyase activity, active-site mutagenesis, lack of ACC
      synthase activity, and open localization/substrate/pathway gaps. However,
      it omits Koch et al. 2001 (PMID:11470512), omits experimental
      homodimerization (GO:0042802), and grounds molecular_activity to coarse
      goslim_generic GO:0016829 (lyase activity) rather than specific GO:0047804
      (cysteine-S-conjugate beta-lyase activity) / GO:0016846 (carbon-sulfur
      lyase activity), with GO:0047804 used here instead.
  findings:
  - statement: >-
      Affinage identifies human ACCS as a PLP-dependent cysteine conjugate
      sulfoxide beta-lyase lacking canonical ACC synthase activity, with
      cellular localization, physiological substrates, and pathway context still
      uncharacterized.
    supporting_text: >-
      Human ACCS is a pyridoxal-phosphate-dependent enzyme that, despite its
      annotation as a 1-aminocyclopropane-1-carboxylate synthase homolog, lacks
      canonical ACC synthase activity and instead catalyzes cysteine conjugate
      sulfoxide β-lyase activity [PMID:39876065].
suggested_questions:
- question: >-
    What are the endogenous or dietary/xenobiotic cysteine S-conjugate sulfoxide
    substrates cleaved by human ACCS in liver and lymphoid tissues, and does
    ACCS correspond to the historically reported human hepatic cysteine-conjugate
    beta-lyase?
  experts:
  - Yang Hai
  - Arthur J. L. Cooper
- question: >-
    How does the lung-cancer-associated missense variant Pro421Leu (rs3107275)
    affect human ACCS homodimer stability or C-beta-S lyase catalytic efficiency?
  experts:
  - Yang Hai
suggested_experiments:
- hypothesis: >-
    Human ACCS cleaves FMO-oxidized xenobiotic or endogenous S-substituted
    L-cysteine sulfoxides in hepatocytes as part of the mercapturic-acid
    detoxication pathway.
  description: >-
    Generate CRISPR/Cas9 ACCS-knockout and K323A knock-in HepG2 and primary
    human hepatocyte models, challenge with glutathione/cysteine S-conjugate
    precursors, and quantify accumulation of S-conjugate sulfoxides and pyruvate
    / sulfenic-acid cleavage products by targeted and untargeted LC-MS/MS.
  experiment_type: CRISPR knockout/knock-in cellular metabolomics
- hypothesis: >-
    Co-crystallization of human ACCS (K323A or wild-type) with S-phenyl-L-cysteine
    sulfoxide or L-(-)-alliin resolves the inter-subunit W135(B)/Y132(B)/R351(B)
    pocket and tests whether Tyr195/His201 coordinate the sulfoxide oxygen via a
    water bridge.
  description: >-
    Determine X-ray crystal structures of apo PLP-bound human ACCS and the
    external-aldimine complex of hACCS with S-configured and R-configured
    cysteine S-conjugate sulfoxides.
  experiment_type: X-ray crystallography and steady-state enzymology
