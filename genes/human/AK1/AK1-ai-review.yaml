- id: file:human/AK1/AK1-bioinformatics/RESULTS.md
  title: 'AK1 (P00568) bioinformatics: where the adenylate kinase deficiency variants sit and what they break'
  findings:
  - statement: cDNA and protein numbering of the reported variants agree with the canonical sequence.
    supporting_text: The NM_000476.3 coding sequence is 585 nt and its translation is identical to the 194-residue
      UniProt P00568 canonical sequence, so cDNA and protein numbering agree with no offset.
  - statement: Most non-truncating disease variants are at the nucleotide-binding site.
    supporting_text: Eight of the eleven non-truncating variants (Gly40Arg, Gly64Arg, Arg97Trp, Gln101Lys, Arg128Trp,
      Arg132His, Arg138His and Asp141del) change a residue within 5.1 A of the bound bisubstrate inhibitor, in the
      AMP site, the ATP site or the phosphate-clamping arginine network of the LID.
  - statement: The remaining missense variants are buried, away from the ligand.
    supporting_text: The three remaining missense variants (Gln24Arg, Tyr164Cys and Val173Gly) change residues that
      are buried (relative solvent accessibility 0.04 or less) and 5 to 12 A from the nucleotide, the pattern expected
      of folding or stability defects rather than loss of a ligand contact.
  - statement: AK1 tolerates heterozygous loss of function in the population.
    supporting_text: 'gnomAD v4 constraint for AK1: pLI 0.009, loss-of-function observed/expected 0.54 (90 percent
      interval 0.35 to 0.86), missense Z 1.10.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Reproducible analysis in this gene's bioinformatics folder (just all).
