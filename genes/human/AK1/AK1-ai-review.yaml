id: P00568
gene_symbol: AK1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Adenylate kinase isoenzyme 1 is the major cytosolic adenylate kinase of skeletal muscle, heart, brain
  and red blood cells. It is a 194-residue monomer of the P-loop nucleoside monophosphate kinase fold, with a CORE
  domain and two mobile lobes, the NMP-binding domain and the LID, that close over the substrates. It catalyses
  the reversible transfer of a phosphoryl group between ATP and AMP (ATP + AMP = 2 ADP), which returns AMP to the
  phosphorylated adenine nucleotide pool, lets cells draw on the second phosphoanhydride bond of ADP when ATP demand
  is high, and sets the AMP level that energy-sensing systems read. It also phosphorylates dAMP with much lower
  affinity and shows a broad nucleoside diphosphate kinase activity in vitro. Mice lacking the enzyme are viable;
  their muscles and hearts contract normally at rest but spend more ATP per contraction and tolerate hypoxia poorly,
  and their AMP-dependent signalling is blunted. An alternative first exon produces AK1beta, an N-terminally extended,
  myristoylated isoform at the plasma membrane. Biallelic loss-of-function variants cause erythrocyte adenylate
  kinase deficiency, a rare autosomal recessive chronic non-spherocytic haemolytic anaemia, in some families with
  psychomotor impairment.
functional_isoforms:
- id: AK1_BETA
  name: AK1beta (membrane-associated, N-myristoylation consensus)
  type: SPLICE_VARIANT
  description: 'Product of an alternative promoter and first coding exon. In mouse the protein has 18 extra N-terminal
    residues, a consensus N-myristoylation signal, and localises to the plasma membrane; its transcript is induced
    by p53 in mouse and human cells (PMID:10557075), and in mouse brain it is co-expressed with cytosolic AK1 in
    neurons and can couple AMP to ATP-sensitive potassium channel opening in transfected cells (PMID:14977170).
    The reviewed entry P00568 lists no alternative products. The human sequence is the unreviewed entry Q5T9B7 (210
    residues; RefSeq NP_001305051.1): an 18-residue N-terminus, MGCCSSSDPRREDDLRAR, replaces Met1-Glu2 of the canonical
    protein and is followed by canonical residues 3-194, so a residue of this isoform is numbered 16 higher than
    in P00568. Membrane localisation and function of the human protein have not been tested in the literature searched;
    the plasma membrane location is from mouse and transfected-cell work.'
  maps_to:
  - type: REFSEQ_PROTEIN
    ids:
    - NP_001305051.1
  - type: UNIPROTKB_UNREVIEWED
    ids:
    - Q5T9B7
  source_defects:
  - defect_type: MISSING_ISOFORM
    resource: UNIPROT
    record: UniProtKB:P00568
    slot: ALTERNATIVE PRODUCTS
    requested_change: ADD
    asserted_value: UniProtKB:P00568
    corrected_value: RefSeq:NP_001305051.1
    corrected_label: AK1beta (210 aa; N-terminus MGCCSSSDPRREDDLRAR)
    confidence: CONFIRMED
    explanation: The reviewed entry has no ALTERNATIVE PRODUCTS comment. That the isoform is absent from it is read
      directly from the record. That a human AK1beta exists rests on the abstract of PMID:10557075 (p53-dependent
      induction of the alternative transcript in human cells; full text not read), on RefSeq NP_001305051.1 and
      on the unreviewed entry Q5T9B7, whose sequence the isoform script in this gene's bioinformatics folder compared
      with the canonical one. The request is to add the isoform; its membrane localisation in human cells is not
      claimed here.
    supported_by:
    - reference_id: PMID:10557075
      supporting_text: The human AK1 gene contains several consensus p53 binding sites and we report that p53-dependent
        induction of the alternative AK1beta transcript also occurs in human cells.
    - reference_id: file:human/AK1/AK1-bioinformatics/RESULTS.md
      supporting_text: Among the 18 human UniProtKB entries with gene name AK1, one unreviewed entry, Q5T9B7 (210
        residues; RefSeq NP_001305051.1; Ensembl ENST00000223836), carries canonical residues 3-194 behind an alternative
        18-residue N-terminus, MGCCSSSDPRREDDLRAR.
