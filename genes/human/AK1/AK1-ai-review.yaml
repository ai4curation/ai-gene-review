    summary: Outer dense fiber location transferred by Ensembl Compara from mouse Ak1 (Q9R0Y5), where AK1 was localised
      to sperm accessory structures (PMID:16790685).
    action: KEEP_AS_NON_CORE
    reason: 'The mouse result is direct: AK1 appears in condensing spermatids and is associated with outer dense
      fibers and the outer microtubule doublets, and the germ-cell transcript encodes the same protein as the somatic
      one. Nothing in the human literature searched tests this, so the row rests on the orthologue alone. The term
      is as precise as the mouse evidence and the location is plausible for an enzyme that buffers adenine nucleotides
      where ATP is consumed, but it is a tissue-specific placement of the ubiquitous cytosolic enzyme and not where
      its core function is defined.'
