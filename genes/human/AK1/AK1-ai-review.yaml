core_functions:
- description: 'ATP:AMP phosphotransferase of the cytosol. AK1 equilibrates AMP, ADP and ATP: it rephosphorylates
    AMP to ADP, and in the reverse direction makes ATP and AMP from two ADP when ATP is being consumed fast. The
    active site lies between the P-loop of the CORE domain (ATP), the NMP-binding domain (AMP) and the LID, whose
    arginines clamp the transferred phosphates. Loss of this activity is what the disease alleles have in common:
    truncations, substitutions at the nucleotide-binding residues and substitutions that destabilise the buried
    core.'
  molecular_function:
    id: GO:0004017
    label: AMP kinase activity
  directly_involved_in:
  - id: GO:0006172
    label: ADP biosynthetic process
  - id: GO:0015949
    label: nucleobase-containing small molecule interconversion
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - *id001
  - *id002
  - *id005
  - *id009
  - reference_id: file:human/AK1/AK1-bioinformatics/RESULTS.md
    supporting_text: Eight of the eleven non-truncating variants (Gly40Arg, Gly64Arg, Arg97Trp, Gln101Lys, Arg128Trp,
      Arg132His, Arg138His and Asp141del) change a residue within 5.1 A of the bound bisubstrate inhibitor, in the
      AMP site, the ATP site or the phosphate-clamping arginine network of the LID.
  knowledge_gaps:
  - gap_statement: Why loss of AK1 shortens red cell survival is not known, nor whether it is sufficient on its
      own. The enzyme defect is established, but no measurement connects it to a specific failure of the erythrocyte
      (adenine nucleotide pool loss, ATP shortfall under stress, or something else).
    boundary: 'Established: every molecularly characterised family has biallelic damaging AK1 variants, the recombinant
      mutant enzymes are catalytically crippled or unstable, and carriers with half-normal activity are well. Not
      established: the step from absent activity to haemolysis. Deficient red cells keep about 1/2,000 of normal
      ADP-forming capacity from another enzyme, one equally deficient sibling had no haemolysis, and a kindred studied
      before molecular diagnosis had additional phosphotransferase abnormalities; the genotypes of those early families
      are unknown.'
    gap_kind:
    - BIOLOGY
    dark_aspect: RESIDUAL_SUBGAP
    status: OPEN
    significance: It decides whether adenylate kinase deficiency is a single-gene disorder with variable expressivity
      or needs a second hit, and what a treatment would have to restore.
    resolution: Isotope tracing of adenine nucleotide turnover and stress survival in AK1-null human erythroid cells
      (edited CD34+ derived reticulocytes) and in Ak1 knockout mouse red cells, with and without the residual AMP-phosphorylating
      activity inhibited.
    provenance:
    - reference_id: PMID:6308059
      supporting_text: A child with hemolytic anemia was found to have severe erythrocyte adenylate kinase (AK)
        deficiency, but an equally enzyme-deficient sibling had no evidence of hemolysis.
    - reference_id: PMID:1646049
      supporting_text: These additional biochemical defects in the AK-deficient RBC further support the concept
        that AK deficiency per se may not cause hemolytic anemia.
    - reference_id: PMID:17662886
      supporting_text: The altered properties displayed by the mutant enzymes support the cause-effect relationship
        between AK1 mutations and hemolytic anemia.
suggested_questions:
- question: Do Ak1 knockout mice have reduced red cell survival, reticulocytosis or splenomegaly? The published
    knockout work concentrates on muscle and heart; red-cell indices would show whether the mouse models the human
    anaemia.
- question: Which enzyme supplies the residual AMP-phosphorylating activity of AK1-deficient human red cells (AK2
    carried over from reticulocytes, guanylate kinase, or another), and does its level explain why some deficient
    individuals do not haemolyse?
- question: Is human AK1beta (Q5T9B7) myristoylated and at the plasma membrane in native cells, and should the reviewed
    UniProt entry carry it as an isoform?
- question: How does AK1 reach serum and the surface of myotubes, where it has been reported to interconvert extracellular
    adenine nucleotides, given that it has no signal peptide?
suggested_experiments:
- hypothesis: Loss of AK1 alone is sufficient to shorten red cell survival because AMP formed by ATP-consuming reactions
    cannot be rephosphorylated and is lost from the adenine nucleotide pool.
  description: Knock out AK1 in human CD34+ cells, differentiate to reticulocytes, and follow total adenine nucleotides,
    labelled adenine incorporation and deformability during in vitro ageing and oxidative or glucose-limited stress;
    rescue with wild-type AK1 and with the Arg97Trp hypomorph.
  experiment_type: genetic perturbation with metabolic tracing
- hypothesis: The buried-residue variants Tyr164Cys, Val173Gly and Gln24Arg cause deficiency by lowering protein
    stability, not catalysis.
  description: Express the three variants and the active-site variants as recombinant human enzymes; measure melting
    temperature, half-life in reticulocyte lysate and kcat/KM for AMP and ATP side by side. Only Tyr164Cys has been
    characterised so far.
  experiment_type: biochemical characterisation
knowledge_gaps:
- gap_statement: The cause of the psychomotor impairment seen in some people with adenylate kinase deficiency, and
    not in others, is unknown. No study has examined AK1 or AK1beta function in human neurons, and neither genotype
    nor residual red-cell activity separates the affected from the unaffected families.
  boundary: 'Known: both AK1 isoforms are expressed predominantly in neurons in mouse brain, and psychomotor impairment
    is reported with Arg107Ter, Arg97Trp and a frameshift with Arg138His, but not with Gly40Arg/Gly64Arg, the Asp140
    deletion or Gln101Lys. Unknown: whether the brain phenotype is a direct effect of AK1 loss in neurons, a consequence
    of severe neonatal jaundice and anaemia, or coincidental in consanguineous families.'
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  status: OPEN
  significance: Counselling and follow-up differ if the neurological risk is intrinsic to the genotype.
  resolution: Neurological phenotyping of Ak1 knockout mice protected from neonatal hyperbilirubinaemia, and energetics
    of AK1-null human iPSC-derived neurons under high firing load.
  provenance:
  - reference_id: PMID:14977170
    supporting_text: Immunohistochemical analysis of brain tissue and primary neurons and astrocytes in culture
      demonstrated that AK1 isoforms are expressed predominantly in neurons.
  - reference_id: PMID:10233365
    supporting_text: Two siblings of Italian origin with mild chronic haemolytic anaemia, psychomotor impairment
      and undetectable adenylate kinase (AK) activity are reported.
  - reference_id: PMID:12649162
    supporting_text: In neither case was psychomotor impairment observed.
