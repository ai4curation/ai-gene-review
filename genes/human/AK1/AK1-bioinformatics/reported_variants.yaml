# Variants reported in patients with erythrocyte adenylate kinase deficiency.
# Authored input for the scripts in this folder. `cdna` is HGVS-style numbering on
# the coding sequence of NM_000476 (A of ATG = 1); `reported_protein` is the
# consequence as the source states it. The scripts recompute the protein
# consequence from the CDS and flag any disagreement; nothing here is trusted.
transcript: NM_000476.3
uniprot: P00568
