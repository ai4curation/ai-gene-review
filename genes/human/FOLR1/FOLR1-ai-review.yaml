id: P15328
gene_symbol: FOLR1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Folate receptor alpha is a GPI-anchored cell-surface receptor of epithelial
  tissues that captures folate and reduced folates with high affinity at neutral pH and
  carries them into the cell. Because the anchor sits in the outer leaflet, the entire
  folate-binding domain faces the extracellular space and is accessible on intact cells,
  which is the basis of folate-targeted imaging and therapy. Bound receptor is
  internalised through clathrin-coated vesicles into endosomes, where mildly acidic pH
  triggers a conformational change that releases the folate, and the receptor is then
  recycled to the surface. In polarised epithelia it is sorted apically or basolaterally
  depending on the tissue, and it contributes to folate supply during embryonic
  development; loss-of-function mutations cause cerebral folate transport deficiency.
