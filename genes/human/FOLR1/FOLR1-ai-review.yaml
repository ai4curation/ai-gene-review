  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  review:
    action: MARK_AS_OVER_ANNOTATED
    summary: The receptor imports folates; it does not catalyse any step of
      tetrahydrofolate synthesis.
