  qualifier: enables
  review:
    action: MODIFY
    summary: FOLR1 is a cargo receptor that internalises folate, not a signalling
      receptor.
    reason: The GO definition of folic acid receptor activity, combining selectively with
      extracellular folic acid and delivering it into the cell via endocytosis, is exactly
      what this protein does, and that term sits under cargo receptor activity rather than
      signaling receptor activity. The family node assertion is therefore mis-scoped for
      this branch.
