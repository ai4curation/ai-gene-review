core_functions:
- description: GPI-anchored folate receptor at the cell surface. It binds folate and
    reduced folates with high affinity at neutral pH, is internalised through
    clathrin-coated vesicles, releases its ligand when endosomal pH falls, and recycles to
    the membrane, thereby delivering folate into epithelial cells.
  molecular_function:
    id: GO:0061714
    label: folic acid receptor activity
  locations:
  - id: GO:0009897
    label: external side of plasma membrane
  - id: GO:0005768
    label: endosome
  directly_involved_in:
  - id: GO:0015884
    label: folic acid transport
  - id: GO:0006898
    label: receptor-mediated endocytosis
  supported_by:
  - reference_id: file:human/FOLR1/FOLR1-uniprot.txt
    supporting_text: Binds to folate and reduced folic acid derivatives and mediates
      delivery of 5-methyltetrahydrofolate and folate analogs into the interior of cells
  - reference_id: PMID:8567728
    supporting_text: Using immunoelectron microscopy, we found MFR-alpha along the entire
      endocytic pathway, in clathrin-coated buds and vesicles, and in small and large
      endosomal vacuoles.
  - reference_id: PMID:23851396
    supporting_text: To understand how folate binds its receptors, we determined the
      crystal structure of human FRα in complex with folic acid at 2.8 Å resolution.
suggested_questions:
- question: What determines whether the GPI-anchored receptor is sorted apically or
    basolaterally, given that retinal pigment epithelium places it basolaterally while
    other epithelia place it apically?
- question: Is the reported nuclear, transcription-factor role of folate receptor alpha
    reproducible, and if so how does a GPI-anchored ectoprotein reach the nucleoplasm?
- question: How much of the folate taken up by human epithelia depends on FOLR1 endocytosis
    versus the reduced folate carrier and PCFT transporters?
suggested_experiments:
- hypothesis: Apical versus basolateral sorting of FOLR1 depends on tissue-specific lipid
    raft composition rather than on the protein itself.
  description: Express the same tagged FOLR1 construct in polarised RPE and in intestinal
    or kidney epithelial monolayers, and compare domain-specific surface biotinylation
    with and without perturbation of sphingolipid synthesis.
- hypothesis: The nuclear pool of folate receptor alpha is an artefact of the antibody or
    of overexpression.
  description: Repeat the nuclear localisation and promoter-binding experiments with
    endogenous tagged FOLR1 in a knock-in line, with GPI-anchor-deficient and
    signal-peptide-deficient controls, and test chromatin occupancy by CUT and RUN.
- hypothesis: Endosomal acidification, not receptor affinity, sets the rate of folate
    delivery.
  description: Measure folate uptake flux in cells expressing wild-type FOLR1 while
    clamping endosomal pH pharmacologically, and compare with receptor variants altered in
    their pH-dependent release.
