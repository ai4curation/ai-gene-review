- term:
    id: GO:0031267
    label: small GTPase binding
  evidence_type: IPI
  original_reference_id: PMID:22511774
  qualifier: enables
  supporting_entities:
  - UniProtKB:P57729
  review:
    summary: Small GTPase binding, with RAB38 as the partner. The experiment is a co-immunoprecipitation
      from MNT-1 melanocytic cell extracts in which BLOC-2, AP-3 and AP-1 all came down with
      Rab38 and Rab32, together with colocalisation and a cargo-trafficking phenotype for
      tyrosinase and TYRP1 in Rab32/Rab38-deficient cells. The GOA projection from this reference
      covers seven gene products - AP3D1, AP3B1, AP1G1, HPS5, RAB38, RAB32 and AP3M1 - i.e.
      the complexes and the Rabs, not a mass projection.
    action: KEEP_AS_NON_CORE
    reason: 'Keep. The interaction is real and biologically meaningful - it is the mechanism
      by which cell-type-specific Rabs recruit the ubiquitous sorting machinery to the maturing
      melanosome - but it was detected at complex level in one specialised cell type, and
      nothing identifies mu3A as the subunit that contacts the Rab. The known GTPase interface
      of AP-3 is on the large subunits: the cryo-EM work places the primary Arf1 site on delta
      with a second on beta3, and reports no nucleotide-GTPase contact for mu3. Non-core on
      both counts.'
