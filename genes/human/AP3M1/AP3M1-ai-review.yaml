- term:
    id: GO:0035654
    label: clathrin-coated vesicle cargo loading, AP-3-mediated
  evidence_type: NAS
  original_reference_id: PMID:9545220
  qualifier: involved_in
  review:
    summary: '''Clathrin-coated vesicle cargo loading, AP-3-mediated'', asserted by ComplexPortal
      and cited to the 1998 Science report that mammalian AP-3 binds clathrin through the
      beta3 appendage. The AP-3-mediated cargo-loading half of the term is exactly right for
      this protein - it is what the mu subunit does. The clathrin-coated-vesicle half is the
      problem, and the term''s own definition already hedges it (''in some organisms, links
      clathrin'').'
    action: MODIFY
    reason: 'Generalise to GO:0035459 ''vesicle cargo loading'', the grandparent that makes
      the same assertion without committing to a clathrin coat. The cited paper is a real
      result and its own conclusion is hedged - AP-3 function ''may depend on clathrin'' -
      and the interaction it reports is with beta3, not with mu3A. Against it: AP-3 was originally
      characterised as a non-clathrin coat, the 2024 review of the field calls the question
      open with only partial colocalisation in vivo, and the 2026 cryo-ET reconstitution shows
      AP3:ARF1 generating carriers with no clathrin lattice at all. Since the intermediate
      term GO:0035652 is also clathrin-specific, GO:0035459 is the nearest ancestor free of
      the commitment. The AP-3 specificity that is lost by generalising is worth recovering
      with a new clathrin-neutral child term, which is proposed separately.'
    proposed_replacement_terms:
    - id: GO:0035459
      label: vesicle cargo loading
    supported_by:
    - reference_id: PMID:9545220
      supporting_text: In vitro binding assays showed that mammalian AP-3 did associate with
        clathrin by interaction of the appendage domain of its beta3 subunit with the amino-terminal
        domain of the clathrin heavy chain
    - reference_id: PMID:9545220
      supporting_text: Thus, AP-3 function in protein sorting may depend on clathrin
    - reference_id: PMID:42139345
      supporting_text: By demonstrating that AP3:ARF1 can generate carriers without using
        a clathrin lattice, we explain the clathrin independence of AP3-mediated trafficking
    - reference_id: PMID:39705307
      supporting_text: AP-3 has been reported to have both clathrin-dependent (21, 22) and
        -independent functions (23–25) and is found to only partially colocalize with clathrin
        in vivo (26, 27)
- term:
    id: GO:0048490
    label: anterograde synaptic vesicle transport
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q9JKC8
  - ensembl:ENSMUSP00000117346
  review:
    summary: 'Transferred from mouse Ap3m1 (Q9JKC8), whose own row for this term is an IMP
      citing PMID:21998198. Reading that paper: all of its AP-3 genetics use the mocha allele
      Ap3d1mh/mh, a delta-subunit null, and the phenotype is failure of the AP-3 cargo PI4KIIalpha
      to reach neurites from the cell body. Searching the cached full text, the strings ''Ap3m1'',
      ''mu3A'' and ''AP3M'' do not occur at all, and ''mu3'' occurs twice, both inside the
      introductory sentence that names the heterotetramer''s four subunits. So mu3A itself
      is never perturbed or assayed. Anterograde synaptic vesicle transport is the synaptic-vesicle-specific
      version of the same claim, from the same mouse IMP and the same mocha experiment.'
    action: KEEP_AS_NON_CORE
    reason: 'Keep, but not as a core AP3M1 function, and with the source-side limitation on
      record. Two separate dilutions sit between the experiment and this row. First, the evidence
      is complex-level: a delta null removes the whole coat, so the phenotype belongs to AP-3
      rather than to its medium subunit. Second, delta is shared by the ubiquitous and the
      neuronal complexes (ComplexPortal CPX-5051/CPX-5052 versus CPX-5053/CPX-5055), so a
      mocha phenotype cannot even be assigned to the AP-3A complex that contains AP3M1. The
      genetics that do separate the two point the other way: beta3B-containing complexes are
      the ones preferentially targeted to neuronal processes and required for synaptic-vesicle
      targeting of ZnT3 and ClC-3, while beta3A-deficient brain has more of those cargoes,
      not less. A subunit of the ubiquitous complex is a poor candidate for the core agent
      of synaptic vesicle delivery. This row is the one where that matters most, because synaptic
      vesicle cargo targeting is precisely the job the beta3B/neuronal complex was shown to
      own.'
    supported_by:
    - reference_id: PMID:21998198
      supporting_text: the AP-3–deficient allele mocha (Ap3d1mh/mh
    - reference_id: PMID:15537701
      supporting_text: Consistently, beta3B deficiency compromised synaptic zinc stores assessed
        by Timm's staining and the synaptic vesicle targeting of membrane proteins involved
        in zinc uptake (ZnT3 and ClC-3)
    - reference_id: PMID:15537701
      supporting_text: These observations indicate that the functions of beta3A- and beta3B-containing
        complexes are distinct and divergent
    propagation_review:
      root_cause: SOURCE_WEAK_OR_INFERRED
      failure_modes:
      - SOURCE_EVIDENCE_WEAK
      source_entities:
      - source_id: UniProtKB:Q9JKC8
        source_label: Ap3m1, mouse AP-3 complex subunit mu-1
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: 'Mouse Ap3m1 is a true 1:1 orthologue and the cargo pocket is identical to
          human at all 14 tested columns, so orthology is not the problem. The problem is
          upstream of the transfer: the donor''s own IMP rests on the Ap3d1 mocha allele,
          so it is evidence about the AP-3 complex and not about this subunit.'
      - source_id: ensembl:ENSMUSP00000117346
        source_label: Ensembl Compara protein model for mouse Ap3m1
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: The Ensembl Compara protein model through which the orthology call was made;
          it carries no evidence of its own beyond the Q9JKC8 record.
      residue_claims_not_applicable: The reservation is about which gene was perturbed in
        the donor experiment, not about sequence divergence; the measured pocket comparison
        in file:human/AP3M1/AP3M1-bioinformatics/RESULTS.md finds mouse and human AP3M1 identical
        at 14 of 14 cargo-contact columns.
