- term:
    id: GO:0006896
    label: Golgi to vacuole transport
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000055849
  - SGD:S000000492
  - SGD:S000001011
  - SGD:S000006180
  - UniProtKB:O00189
  review:
    summary: 'Post-Golgi delivery of transmembrane cargo to the vacuole/lysosome is what AP-3
      is for. The IBD is at PTN000055849, the family-level node, with four gene-level donors:
      yeast Apm3 (the AP-3 mu subunit, which drives the ALP pathway to the vacuole), yeast
      Apm2 and Apm1, and human AP4M1. GO:0006896 ''Golgi to vacuole transport'' is the least
      common ancestor that covers both the fungal vacuole and the animal lysosome, since GO:0005764
      lysosome is_a GO:0005773 vacuole and the human-specific child GO:0090160 ''Golgi to
      lysosome transport'' is_a GO:0006896.'
    action: ACCEPT
    reason: 'Core. In human cells the machinery is the same and the destination is the lysosome
      and its related organelles: loss of AP-3 redistributes LAMP1, LAMP2 and CD63 to the
      cell surface (PMID:10024875). One nuance worth recording rather than acting on: the
      mammalian step is now placed on tubular early endosomes rather than at the Golgi itself
      (PMID:42139345), so the ''Golgi to'' framing describes the route''s origin rather than
      the membrane AP-3 is recruited to. The parent term remains the right LCA for a node
      whose donors span fungi and animals, so this is not a granularity failure - the donors
      do not all agree on a single more specific child.'
    supported_by:
    - reference_id: PMID:10024875
      supporting_text: The AP-3 deficiency results in increased surface expression of the
        lysosomal membrane proteins CD63, lamp-1, and lamp-2, but not of nonlysosomal proteins
    - reference_id: PMID:10024875
      supporting_text: Our results suggest that AP-3 functions in protein sorting to lysosomes
    - reference_id: PMID:42139345
      supporting_text: The AP3 complex mediates cargo sorting and carrier assembly for the
        trafficking of transmembrane proteins from endosomes to lysosomes
    propagation_review:
