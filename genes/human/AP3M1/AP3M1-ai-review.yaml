core_functions:
- description: 'Recognition of tyrosine-based YxxPhi sorting signals in the cytoplasmic tails
    of transmembrane cargo, and presentation of that cargo to the AP-3 coat. This is the subunit-level
    activity: the mu homology domain of mu3A provides the pocket, the complex provides the
    adaptor function. The pocket is directly visualised with a LAMP1 YQTI peptide bound, and
    two-hybrid work with defined tails and a combinatorial signal library shows that mu3A
    has its own signal preferences, biased toward lysosomal targeting motifs, rather than
    simply duplicating mu1 or mu2. A contact census of the structures confirms that the site
    is the same structural site as AP-2''s but differs in chemistry at most of its positions.'
