- term:
    id: GO:0005802
    label: trans-Golgi network
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - AGI_LocusCode:AT1G60780
  - AGI_LocusCode:AT4G24550
  - PANTHER:PTN000055849
  - SGD:S000001011
  - UniProtKB:E2RED8
  - UniProtKB:O00189
  review:
    summary: 'Trans-Golgi network localisation, inherited from the family-level node PTN000055849.
      None of the five gene-level donors is an AP-3 subunit: two Arabidopsis proteins (AT1G60780
      = AP1M2, AT4G24550 = AP4M), yeast Apm2, and the dog and human AP4M1 orthologues. Human
      AP-3 does have independent TGN evidence of its own - both founding papers placed the
      complex in the Golgi region and at the TGN - but the modern mammalian picture puts the
      functional pool on tubular early endosomes.'
    action: KEEP_AS_NON_CORE
    reason: 'Real but peripheral. Simpson et al. localised endogenous AP-3 to the Golgi region
      and more peripheral structures, and Dell''Angelica et al. found the sigma3 complex at
      the TGN and in peripheral structures, so a TGN pool is documented and UniProt records
      Golgi apparatus as a subcellular location. What has changed is where the work is thought
      to happen: the 2026 cryo-ET study describes mammalian AP-3 as recruited onto early/tubular
      endosomal compartments. Keeping the term as non-core records the observed pool without
      promoting it to the site of action; GO:0005769 early endosome, already on this gene,
      carries the functional compartment.'
    supported_by:
    - reference_id: PMID:9151686
