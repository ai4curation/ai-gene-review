- term:
    id: GO:0035651
    label: AP-3 adaptor complex binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q9JKC8
  - ensembl:ENSMUSP00000117346
  review:
    summary: '''AP-3 adaptor complex binding'' transferred from mouse Ap3m1, whose own row
      is an MGI IDA citing PMID:19010779. That paper cross-linked cells in vivo, affinity-purified
      AP-3 complexes and identified the associated proteins by mass spectrometry. Finding
      mu3A in a purified AP-3 preparation demonstrates that mu3A is in AP-3 - which is complex
      membership, and is already asserted on this gene as GO:0030123 part_of, twice.'
    action: MARK_AS_OVER_ANNOTATED
    reason: Not wrong, but the wrong kind of statement. AP3M1 is an obligate subunit of AP-3,
      not an external ligand of it; typing that relationship as the molecular function 'binding
      to an AP-3 adaptor complex' recasts machinery as one of its own interactors. The informative
      content is fully carried by the two existing GO:0030123 part_of rows. GO:0035651 is
      useful for genuine AP-3 partners - BLOC-1 subunits, PI4KIIalpha, cargo - and AP3M2 carries
      the same IEA, so this is a pattern in the mu subfamily rather than a one-off. Marked
      over-annotated rather than removed because the underlying mouse IDA is a real observation
      and MGI curators read the full paper.
    supported_by:
    - reference_id: PMID:19010779
      supporting_text: AP-3 was co-isolated with BLOC-1, BLOC-2, and homotypic fusion and
        vacuole protein sorting complex subunits; clathrin; and phosphatidylinositol-4-kinase
        type II alpha (PI4KIIalpha)
    - reference_id: file:human/AP3M1/AP3M1-uniprot.txt
      supporting_text: AP3B1 or AP3B2), a medium adaptin (mu-type subunit AP3M1 or AP3M2)
        and
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      source_entities:
      - source_id: UniProtKB:Q9JKC8
        source_label: Ap3m1, mouse AP-3 complex subunit mu-1
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: Mouse Ap3m1's MGI IDA for this term comes from affinity purification of the
          AP-3 complex itself, so what was observed is that the subunit is in the complex.
          The orthology step is fine; it is the term's role that does not fit an obligate
          subunit.
      - source_id: ensembl:ENSMUSP00000117346
        source_label: Ensembl Compara protein model for mouse Ap3m1
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: The Ensembl Compara protein model through which the orthology call was made;
