- term:
    id: GO:0060155
    label: platelet dense granule organization
  evidence_type: NAS
  original_reference_id: PMID:23247405
  qualifier: involved_in
  review:
    summary: 'Platelet dense granule organization, asserted by ComplexPortal for AP-3. Dense
      granules are lysosome-related organelles, and their defective formation is what makes
      AP-3 loss a bleeding disorder: Hermansky-Pudlak syndrome type 2 is caused by AP3B1 mutations.
      The cited review covers the shared LRO machinery rather than platelets specifically.'
    action: KEEP_AS_NON_CORE
