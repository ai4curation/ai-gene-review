- term:
    id: GO:0030123
    label: AP-3 adaptor complex
  evidence_type: NAS
  original_reference_id: PMID:9151686
  qualifier: part_of
  review:
    summary: 'ComplexPortal''s statement-level assertion of the same membership, citing the
      paper that defined AP-3. Simpson et al. raised antibodies against the delta and sigma3
      candidates and showed by co-immunoprecipitation that they are the missing subunits of
      the complex already known to contain p47 (mu3) and beta-NAP (beta3B). An independent,
      non-mechanistic corroboration comes from proteomics: AP3B1 depletion lowers AP3M1 protein
      abundance, the behaviour expected of an obligate subunit whose stability depends on
      assembly. That stoichiometric observation is the entire content of the affinage record
      for this gene.'
    action: ACCEPT
    reason: Core, and correctly cited. The reference projects over 14 entities in GOA, which
      is the AP-3 subunits and their orthologues rather than a mass projection. NAS is the
      right code for a ComplexPortal curation statement, and it is consistent with the IBA
      row for the same term.
    supported_by:
    - reference_id: PMID:9151686
      supporting_text: Immunoprecipitation experiments indicated that the complex consists
        not only of β-NAP and p47, but also of two other proteins of ∼160 (p160) and ∼25 kD
        (p25), making it a heterotetramer like an adaptor complex
    - reference_id: PMID:9151686
      supporting_text: 'p47 exists as two isoforms: p47A, which is expressed ubiquitously,
        and p47B, which is specifically expressed in neuronal tissues'
    - reference_id: PMID:29032074
      supporting_text: We identified 48 such rate-limiting interactions and experimentally
        confirmed our predictions on the interactions of AP3B1 with AP3M1 and GTF2E2 with
        GTF2E1
    - reference_id: file:human/AP3M1/AP3M1-deep-research-affinage.md
      supporting_text: 'Within this complex, AP3B1 acts as a rate-limiting assembly factor:
        depletion of AP3B1 reduces AP3M1 protein abundance, indicating that AP3M1 stability
        and stoichiometry depend on co-regulation with AP3B1'
    additional_reference_ids:
    - PMID:29032074
    - file:human/AP3M1/AP3M1-deep-research-affinage.md
- term:
    id: GO:0030131
    label: clathrin adaptor complex
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: part_of
  supporting_entities:
  - InterPro:IPR001392
  - InterPro:IPR018240
  review:
    summary: InterPro2GO maps IPR001392 'Clathrin adaptor, mu subunit' and its conserved site
      IPR018240 onto GO:0030131 'clathrin adaptor complex', defined as 'A membrane coat adaptor
      complex that links clathrin to a membrane'. IPR001392 is a family signature that matches
      every AP medium subunit - AP1M1, AP1M2, AP2M1, AP3M1, AP3M2 and AP4M1 are all in PTHR10529
      and all carry it - so the mapping cannot distinguish the two AP complexes that link
      clathrin from the two that do not.
    action: REMOVE
    reason: 'A demonstrably wrong domain-to-complex mapping, which is the licensed use of
      REMOVE on an IEA row. GO itself places AP-3 outside this class: GO:0030131 has exactly
      two children, GO:0030121 (AP-1) and GO:0030122 (AP-2), and the ancestors of GO:0030123
      (AP-3) are GO:0030119, GO:0030117, GO:0048475, GO:0098796 and GO:0005737 - GO:0030131
      is not among them. The definition of GO:0030123 says the same in prose: AP-3 does not
      appear to associate with clathrin in all organisms. Biologically, reconstituted AP3:ARF1
      builds coated tubular carriers with no clathrin lattice, and UniProt''s own FUNCTION
      line calls AP-3 an adaptor-related complex which is not clathrin-associated. The residual
      clathrin link that does exist is a beta3 hinge interaction (PMID:9545220), not a property
      of the mu subunit and not sufficient to make AP-3 a clathrin adaptor complex. The same
      InterPro pair also yields GO:0006886 and GO:0016192 on this gene; those are generically
      true and are kept.'
    supported_by:
    - reference_id: PMID:42139345
      supporting_text: By demonstrating that AP3:ARF1 can generate carriers without using
        a clathrin lattice, we explain the clathrin independence of AP3-mediated trafficking
    - reference_id: PMID:9151686
      supporting_text: The AP-3 complex is not clathrin associated
    - reference_id: file:human/AP3M1/AP3M1-uniprot.txt
      supporting_text: not clathrin-associated. The complex is associated with the Golgi
    - reference_id: file:human/AP3M1/AP3M1-uniprot.txt
      supporting_text: PANTHER; PTHR10529; AP COMPLEX SUBUNIT MU; 1.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      source_entities:
      - source_id: InterPro:IPR001392
        source_label: InterPro family 'Clathrin adaptor, mu subunit' (covers every AP medium
          subunit)
        source_status: SOURCE_BAD
        comment: The signature is correct for AP3M1 - InterPro returns it among the seven
          entries matching Q9Y2T2 - but its name embeds a complex assignment the family does
          not license. The entry covers AP-3 and AP-4 medium subunits, neither of whose complexes
          is a GO:0030131 descendant, so the interpro2go mapping is wrong for a subset of
          the entry's own members.
      - source_id: InterPro:IPR018240
        source_label: InterPro conserved site 'Clathrin adaptor, mu subunit, conserved site'
        source_status: SOURCE_BAD
        comment: A conserved-site signature within the same family, inheriting the same problem;
          it adds no independent evidence about clathrin.
      residue_claims_not_applicable: The clathrin-binding element of AP-3 is a box motif in
        the beta3 hinge, on a different subunit; nothing about AP3M1's own residues bears
        on the claim.
- term:
    id: GO:0030659
