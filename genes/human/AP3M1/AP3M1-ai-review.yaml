suggested_questions:
- question: In human cells, does AP3M1 loss phenocopy AP3B1 loss for lysosomal membrane protein
    traffic, or does AP3M2 substitute? The answer determines whether AP3M1 should carry the
    lysosome-targeting process terms in its own right or only as a complex subunit.
- question: Is mu3A ever found in a beta3B-containing complex in neurons? If not, the anterograde
    axonal and synaptic vesicle transport rows now propagated onto AP3M1 from the mocha delta
    null belong to AP3M2, and AP3M1 should lose them.
- question: Which cargo classes does the mu3A pocket select that mu1 and mu2 do not? The combinatorial
    library gave mu3A distinct residue preferences at the x and Phi positions, but the physiological
    cargo repertoire that follows from those preferences has never been enumerated.
- question: Does the clathrin interaction of AP-3 have any function in cells, given that AP3:ARF1
    builds carriers without a clathrin lattice? A negative answer would justify revising the
    definition of GO:0035654 rather than working around it.
- question: Should GO:0030123 be split into ubiquitous and neuronal AP-3 complex children,
    and if so, should the split be defined by the beta3 isoform, the mu3 isoform, or both?
suggested_experiments:
- hypothesis: AP3M1 is the YxxPhi-reading subunit of the ubiquitous AP-3 complex, so an AP3M1-null
    human cell should mislocalise tyrosine-motif lysosomal cargo while leaving dileucine-motif
    cargo comparatively intact.
  description: 'Make AP3M1, AP3M2 and AP3M1/AP3M2 double knockouts in a pigmented human cell
    line (MNT-1) and in HeLa, and measure surface versus lysosomal distribution of a matched
    cargo panel by flow cytometry and microscopy: LAMP1 and CD63, whose tails carry YxxPhi
    motifs, against tyrosinase and LIMP-II, whose AP-3 signals are acidic dileucine. Rescue
    the AP3M1 knockout with wild type mu3A and with pocket mutants at the measured LAMP1-contact
    positions (Y180, K403, V405) to test whether the cargo defect maps to the tyrosine site.
    The prediction that distinguishes this from a general complex-destabilisation phenotype
    is selectivity: pocket mutants should assemble into AP-3 normally, by blue-native gel
    or by co-purification with delta, while failing only the YxxPhi cargoes.'
  experiment_type: genetic perturbation with cargo-class-resolved readout
- hypothesis: The neuronal AP-3 phenotypes currently attributed to AP3M1 belong to mu3B-containing
    complexes.
  description: In mouse cortical neurons, compare conditional Ap3m1 and Ap3m2 deletions against
    the mocha Ap3d1 null for the cargo readouts that defined the AP-3 neuronal phenotype -
    PI4KIIalpha, VAMP7 and ZnT3 content of synaptosomes, and PI4KIIalpha export from cell
    bodies into neurites. Immunoprecipitate beta3A and beta3B separately from the same brain
    lysates and blot for mu3A and mu3B to establish which beta each mu partners with in vivo.
    If the mocha phenotype is reproduced by Ap3m2 deletion and not by Ap3m1 deletion, the
    ISS and Ensembl rows for anterograde axonal and synaptic vesicle transport should move
    off AP3M1.
  experiment_type: subunit-resolved mouse genetics with biochemical complex mapping
- hypothesis: mu3A's measured YxxPhi preferences predict a definable cargo repertoire distinct
    from mu1 and mu2.
  description: Run a proteome-scale peptide-array or yeast display selection of human cytoplasmic-tail
    YxxPhi peptides against purified mu3A, mu3B, mu1A and mu2 C-terminal domains, calibrating
    against the known binders (LAMP1 YQTI, TGN38 YQRL, MPR46) and the known non-binder behaviour
    of mu4. Cross the resulting mu3A-selective set against surface proteomics of AP3M1-null
    cells from the first experiment; the informative output is the overlap, which would convert
    the in vitro specificity into a defensible in vivo cargo list and give the proposed tyrosine-based
    sorting signal binding term an annotatable set of substrates.
  experiment_type: in vitro binding selection cross-validated by cell-surface proteomics
- hypothesis: AP-3's clathrin interaction is dispensable for cargo delivery in cells.
  description: Express clathrin-box mutants of beta3A in AP3B1-null cells and assay AP-3-dependent
    cargo traffic and carrier morphology alongside the AP3:AP3 and AP3:ARF1 lattice mutants
    already shown to disrupt lysosomal cargo trafficking. A clean separation - lattice mutants
    defective, clathrin-box mutants normal - would settle the term definition question and
    support replacing GO:0035654 with a clathrin-neutral AP-3-specific child of GO:0035459.
  experiment_type: structure-guided separation-of-function mutagenesis
