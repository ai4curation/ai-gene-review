- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: located_in
  supporting_entities:
  - ARBA:ARBA00026971
  review:
    summary: 'Cytoplasm, from the UniProt ARBA rule ARBA00026971. AP-3 is a soluble heterotetramer
      that cycles between cytosol and membranes, so the term is true. The rule itself is worth
      recording: fetching https://rest.uniprot.org/arba/ARBA00026971 returns 2388 OR-ed condition
      sets and a single output annotation, GO:0005737. Only two of those condition sets mention
      any signature AP3M1 carries, and neither can fire for this protein - one additionally
      requires taxon Saccharomyces, the other additionally requires IPR016635 and IPR027156,
      which are absent from AP3M1''s complete seven-entry InterPro match list.'
    action: KEEP_AS_NON_CORE
    reason: 'Keep: the statement is true and harmless, and cytoplasmic residence of the unassembled
      coat is part of how AP-3 works - the complex is recruited from cytosol onto membranes
      by Arf1. The reproducibility problem with the rule is recorded rather than used as grounds
      for removal, since the served rule definition may not be everything the production pipeline
      uses; this repository has already documented the same right-branch-rule pattern for
      ARBA00027853. Non-core because ''cytoplasm'' says nothing the specific compartment terms
      on this gene do not say better.'
    supported_by:
    - reference_id: PMID:39705307
      supporting_text: the primary Arf1 binding site on AP-3 is on δ, in contrast to AP-1,
        which has been reported to interact more strongly with Arf1 through β1
    - reference_id: file:human/AP3M1/AP3M1-uniprot.txt
      supporting_text: 'SUBCELLULAR LOCATION: Golgi apparatus. Cytoplasmic vesicle membrane'
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
      - source_id: ARBA:ARBA00026971
        source_label: UniProt ARBA rule emitting GO:0005737 from 2388 OR-ed condition sets
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: The rule emits only GO:0005737 and does so from 2388 condition sets. Of those,
          just two cite an InterPro entry AP3M1 has, and both carry a further condition AP3M1
          fails (taxon Saccharomyces in one; IPR016635 plus IPR027156 in the other), so the
          annotation cannot be reproduced from the rule as published. The conclusion happens
          to be correct, which is why the row is kept.
      residue_claims_not_applicable: An ARBA rule fires on domain and taxon conditions, not
        on residues, so there is nothing residue-level to test.
- term:
    id: GO:0005764
    label: lysosome
  evidence_type: TAS
  original_reference_id: PMID:10024875
  qualifier: located_in
  review:
    summary: Lysosome as a location, the second traceable author statement from the same paper.
      What the paper shows is that AP-3 is required for lysosomal membrane proteins to reach
      lysosomes instead of the plasma membrane; it does not show that AP-3 itself resides
      in the lysosome.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'The evidence supports a process, not a residence. AP-3 is a cytosolic heterotetramer
      recruited onto tubular early-endosomal and Golgi-region membranes; the destination of
      the cargo it sorts is not its own compartment. UniProt records Golgi apparatus and cytoplasmic
      vesicle membrane, not lysosome. The gene already carries a separate, better-scoped lysosomal-membrane
      row from proteomics (GO:0005765, HDA) which captures whatever association exists. Marked
      over-annotated rather than removed: a coat acting at the endolysosomal boundary will
      legitimately be detected on those membranes, so the term is not false, only mis-scoped
      relative to the cited evidence.'
    supported_by:
    - reference_id: PMID:10024875
      supporting_text: Our results suggest that AP-3 functions in protein sorting to lysosomes
    - reference_id: file:human/AP3M1/AP3M1-uniprot.txt
      supporting_text: 'SUBCELLULAR LOCATION: Golgi apparatus. Cytoplasmic vesicle membrane'
    - reference_id: PMID:42139345
      supporting_text: is recruited onto early/tubular endosomal compartments from where it
        sorts transmembrane protein cargo to endolysosomes, lysosomes, and a diverse group
        of cell type–specific compartments termed lysosome-related organelles (LROs) that
        include melanosomes
