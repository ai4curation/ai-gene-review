        source_status: SUPPORTS_TRANSFER
        comment: 'A deep node ancestral to every AP medium subunit. For a transport process
          shared by AP-1, AP-3 and AP-4 that placement is defensible, and the PAINT curators
          fenced off the one clade where it is not: PTN002575694, the stonins, carries an
          IRD (negated) for this same term.'
      - source_id: SGD:S000000492
        source_label: APM3 / P38153, Saccharomyces cerevisiae AP-3 mu subunit
        source_status: SUPPORTS_TRANSFER
        comment: Yeast Apm3, the AP-3 mu subunit - the donor closest in role to the target,
