  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0089
  review:
    summary: 'Cytoplasmic vesicle membrane, from SL-0089. This is the coat''s working location:
      UniProt adds ''Peripheral membrane protein; Cytoplasmic side'' and notes that AP-3 is
      a component of the coat surrounding the cytoplasmic face of coated vesicles at the Golgi
