  evidence_type: HDA
  original_reference_id: PMID:17897319
  qualifier: located_in
  review:
    summary: Lysosomal membrane, from a high-throughput proteomic survey of purified placental
      lysosomal membranes. The GOA projection from this reference covers 242 distinct gene
      products, and the paper's own framing of the extra hits is 'significantly enriched in
      the lysosomal membrane fraction' rather than integral lysosomal proteins - it explicitly
      separates out proteins with signalling and targeting functions that are only partially
      associated with lysosomes.
    action: KEEP_AS_NON_CORE
    reason: Plausible and worth keeping, but not a core location. AP-3 is a peripheral coat
