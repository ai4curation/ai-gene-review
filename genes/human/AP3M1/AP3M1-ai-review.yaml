- term:
    id: GO:0005048
    label: signal sequence binding
  evidence_type: IDA
  original_reference_id: PMID:39705307
  review:
    summary: 'The molecular function of a medium subunit is to read the tyrosine-based (YxxPhi)
      sorting signal in a cargo protein''s cytoplasmic tail, and for mu3A this is directly
      demonstrated. In the human AP-3 cryo-EM series a LAMP1 cytoplasmic-tail peptide carrying
      the YQTI motif is resolved in the mu3 C-terminal domain''s tyrosine cargo-binding pocket;
      the same structures show that in the closed AP-1/AP-2 state that pocket is the occluded
      cargo site and that in AP-3 it is constitutively exposed. Four independent earlier lines
      say the same thing for mu3A specifically: the ubiquitous p47A chain binds the TGN38
      YQRL signal; a combinatorial XXXYXXO two-hybrid library gives mu3A its own residue preferences
      distinct from mu1 and mu2; the lgp120 (LAMP1) tail binds mu3A almost exclusively among
      the medium chains, and the very motif involved is YQTI; and the MPR46 cytoplasmic tail
      binds both mu2 and mu3A. A fifth comes from virology, where the human respiratory syncytial
      virus matrix protein was shown to engage AP-3 specifically through mu3A, dependent on
      the tyrosine of a YXXL motif.'
    action: NEW
    reason: 'GOA gives AP3M1 no molecular function of its own: the only MF rows are a clathrin-specific
      IBA seeded entirely from AP-1/AP-2 donors, two small-GTPase IPIs from a complex-level
      co-immunoprecipitation, and twenty-three bare protein-binding rows. The one activity
      that is directly measured for this protein is therefore missing. GO:0005048 is the term
      GO already uses for this activity on the sister subunit - human AP2M1 (Q96CW1) carries
      it with IDA evidence from PMID:8918456, the mu-chain tyrosine-signal work - so this
      row brings AP3M1 into line with existing practice rather than inventing a precedent.
      The structural site was checked rather than assumed: a contact analysis of PDB 9C5B
      and 1BXX (file:human/AP3M1/AP3M1-bioinformatics/RESULTS.md) finds ten AP3M1 residues
      within 4.5 A of the LAMP1 peptide, nine of them on alignment columns that are also AP2M1
      cargo-pocket positions, with AP3M1 identical to AP2M1 at only 5 of 14 of those columns
      - the site is present and used, and its chemistry differs, which is exactly what the
      combinatorial specificity data predict. A dedicated child term for tyrosine-based sorting-signal
      binding would be better still and is proposed separately.'
    supported_by:
    - reference_id: PMID:39705307
      supporting_text: There is also clear density for the LAMP1 cargo motif in the μ3-CTD
        tyrosine cargo-binding pocket, unambiguously showing that this complex represents
        the cargo-engaged state of AP-3
    - reference_id: PMID:39705307
      supporting_text: 'This closed form of the complex occludes the two known binding sites
