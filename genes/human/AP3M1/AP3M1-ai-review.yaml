- term:
    id: GO:0030123
    label: AP-3 adaptor complex
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: part_of
  supporting_entities:
  - PANTHER:PTN002237676
  - SGD:S000000492
  - dictyBase:DDB_G0277901
  review:
    summary: AP3M1 is the medium (mu) subunit of the AP-3 heterotetramer, and this IBA sits
      on PTN002237676, the AP-3 mu clade node of PTHR10529. Both seeds are genuine AP-3 mu
      subunits - yeast Apm3 (SGD:S000000492 = P38153) and Dictyostelium apm3 (dictyBase:DDB_G0277901
      = Q9GPF1) - so the node is not a family-wide catch-all but the AP-3-specific one, and
      the human AP-3 mu subunit sits squarely inside its clade. The complex itself was defined
      biochemically by co-immunoprecipitation of the four subunits (PMID:9151686) and human
      AP-3 containing AP3M1 has since been reconstituted and solved by cryo-EM (PMID:39705307,
      PDB 9C58-9C5C, chain M = AP3M1 1-418).
    action: ACCEPT
    reason: 'Core. Complex membership is the least disputable fact about this protein: UniProt
      states the composition, ComplexPortal models AP3M1 into CPX-5051 and CPX-5052, and the
      2024 cryo-EM series resolves it as chain M of the reconstituted human complex. The only
      imprecision is at the ontology''s end rather than the annotation''s: GO:0030123 has
      no children, so it cannot express that AP3M1 belongs specifically to the ubiquitous
      AP-3A variants and not to the neuronal AP-3B complexes, which use AP3M2 and AP3B2. That
      is recorded as a proposed new term rather than as a defect in this row.'
    supported_by:
    - reference_id: PMID:9151686
      supporting_text: Immunoprecipitation experiments indicated that the complex consists
        not only of β-NAP and p47, but also of two other proteins of ∼160 (p160) and ∼25 kD
        (p25), making it a heterotetramer like an adaptor complex
    - reference_id: PMID:39705307
