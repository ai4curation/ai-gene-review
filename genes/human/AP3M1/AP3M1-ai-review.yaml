- term:
    id: GO:0006622
    label: protein targeting to lysosome
  evidence_type: TAS
  original_reference_id: PMID:10024875
  qualifier: involved_in
  review:
    summary: Protein targeting to lysosome, a traceable author statement from the paper that
      identified AP3B1 mutations in Hermansky-Pudlak syndrome. Loss of AP-3 in patient fibroblasts
      sends CD63, LAMP1 and LAMP2 to the cell surface while leaving non-lysosomal proteins
      alone, and the authors attribute the selectivity to the mu3A subunit's preference for
      tyrosine-based lysosomal targeting signals - which is why the curator placed the row
      on AP3M1. In GOA this reference annotates one gene product only, AP3M1.
    action: ACCEPT
    reason: 'Core. This is AP-3''s defining cellular job and the paper names mu3A as the reason
      the cargo selection is specific. Convergent modern evidence: the cryo-EM structure resolves
      a LAMP1 tyrosine motif in the mu3 pocket, the same LAMP1/lgp120 YQTI motif that was
      shown by two-hybrid to bind mu3A almost exclusively.'
    supported_by:
    - reference_id: PMID:10024875
      supporting_text: The AP-3 deficiency results in increased surface expression of the
        lysosomal membrane proteins CD63, lamp-1, and lamp-2, but not of nonlysosomal proteins
    - reference_id: PMID:10024875
      supporting_text: These differential effects are consistent with the preferential interaction
        of the AP-3 mu 3A subunit with tyrosine-based signals involved in lysosomal targeting
    - reference_id: PMID:9794796
      supporting_text: we show that the cytosolic domain of lgp120 interacts almost exclusively
        with mu3A
    - reference_id: PMID:39705307
      supporting_text: There is also clear density for the LAMP1 cargo motif in the μ3-CTD
        tyrosine cargo-binding pocket, unambiguously showing that this complex represents
        the cargo-engaged state of AP-3
