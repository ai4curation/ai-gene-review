- term:
    id: GO:0008089
    label: anterograde axonal transport
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q9JKC8
  - ensembl:ENSMUSP00000117346
  review:
    summary: 'Transferred from mouse Ap3m1 (Q9JKC8), whose own row for this term is an IMP
      citing PMID:21998198. Reading that paper: all of its AP-3 genetics use the mocha allele
      Ap3d1mh/mh, a delta-subunit null, and the phenotype is failure of the AP-3 cargo PI4KIIalpha
      to reach neurites from the cell body. Searching the cached full text, the strings ''Ap3m1'',
      ''mu3A'' and ''AP3M'' do not occur at all, and ''mu3'' occurs twice, both inside the
      introductory sentence that names the heterotetramer''s four subunits. So mu3A itself
      is never perturbed or assayed. The term itself is also a stretch for a coat adaptor:
      GO:0008089 is defined as directed movement along microtubules toward the cell periphery,
      and AP-3 is a sorting coat that loads cargo into carriers rather than a motor that moves
      them.'
    action: KEEP_AS_NON_CORE
    reason: 'Keep, but not as a core AP3M1 function, and with the source-side limitation on
      record. Two separate dilutions sit between the experiment and this row. First, the evidence
      is complex-level: a delta null removes the whole coat, so the phenotype belongs to AP-3
      rather than to its medium subunit. Second, delta is shared by the ubiquitous and the
      neuronal complexes (ComplexPortal CPX-5051/CPX-5052 versus CPX-5053/CPX-5055), so a
      mocha phenotype cannot even be assigned to the AP-3A complex that contains AP3M1. The
      genetics that do separate the two point the other way: beta3B-containing complexes are
      the ones preferentially targeted to neuronal processes and required for synaptic-vesicle
      targeting of ZnT3 and ClC-3, while beta3A-deficient brain has more of those cargoes,
      not less. A subunit of the ubiquitous complex is a poor candidate for the core agent
      of synaptic vesicle delivery.'
    supported_by:
    - reference_id: PMID:21998198
      supporting_text: the AP-3–deficient allele mocha (Ap3d1mh/mh
    - reference_id: PMID:21998198
      supporting_text: PI4KIIα was targeted to processes in wild-type primary cultured cortical
        neurons and PC12 cells but failed to reach neurites in cells lacking either AP-3 or
        BLOC-1
    - reference_id: PMID:15537701
      supporting_text: beta3B-containing AP-3 complexes were preferentially targeted to neuronal
        processes
    - reference_id: PMID:15537701
      supporting_text: Surprisingly, despite the lack of neurological symptoms, beta3A-deficient
        mouse brain possessed significantly increased synaptic zinc stores and synaptic vesicle
        content of ZnT3 and ClC-3
    propagation_review:
      root_cause: SOURCE_WEAK_OR_INFERRED
      failure_modes:
      - SOURCE_EVIDENCE_WEAK
      source_entities:
      - source_id: UniProtKB:Q9JKC8
        source_label: Ap3m1, mouse AP-3 complex subunit mu-1
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: 'Mouse Ap3m1 is a true 1:1 orthologue and the cargo pocket is identical to
          human at all 14 tested columns, so orthology is not the problem. The problem is
          upstream of the transfer: the donor''s own IMP rests on the Ap3d1 mocha allele,
          so it is evidence about the AP-3 complex and not about this subunit.'
      - source_id: ensembl:ENSMUSP00000117346
        source_label: Ensembl Compara protein model for mouse Ap3m1
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: The Ensembl Compara protein model through which the orthology call was made;
          it carries no evidence of its own beyond the Q9JKC8 record.
      residue_claims_not_applicable: The reservation is about which gene was perturbed in
        the donor experiment, not about sequence divergence; the measured pocket comparison
        in file:human/AP3M1/AP3M1-bioinformatics/RESULTS.md finds mouse and human AP3M1 identical
        at 14 of 14 cargo-contact columns.
