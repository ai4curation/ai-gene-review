- description: 'As a constitutive subunit of the ubiquitous AP-3A complex, delivery of transmembrane
    cargo from tubular early endosomes to lysosomes and to lysosome-related organelles. This
    is the complex-level process the cargo-reading activity serves, and it is what fails when
    AP-3 is lost: lysosomal membrane proteins reach the plasma membrane instead of the lysosome.
    The same machinery is redirected by cell-type-specific Rab GTPases to build melanosomes
    and platelet dense granules, which is why AP-3 deficiency presents as Hermansky-Pudlak
    syndrome; those specialised outputs are recorded as non-core context rather than as separate
    functions of this subunit.'
