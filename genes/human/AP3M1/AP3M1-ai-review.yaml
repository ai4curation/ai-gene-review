id: Q9Y2T2
gene_symbol: AP3M1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'AP3M1 (mu3A, mu-adaptin 3A) is the medium subunit of the ubiquitously expressed
  AP-3A adaptor protein complex, a heterotetrameric coat that sorts transmembrane proteins
  out of tubular early endosomes and the trans-Golgi region and delivers them to lysosomes
  and to lysosome-related organelles such as melanosomes and platelet dense granules. The
  complex comprises two large adaptins (delta, encoded by AP3D1, and beta3A or beta3B), one
  medium adaptin (mu3A or the neuron-enriched mu3B/AP3M2) and one small adaptin (sigma3A or
  sigma3B); AP3M1 is the medium subunit of the ubiquitous, beta3A-containing variants. Within
  the complex the mu subunit is the cargo reader: its C-terminal mu homology domain (residues
  176-417) carries the pocket that binds tyrosine-based YxxPhi sorting signals in the cytoplasmic
  tails of membrane cargo such as LAMP1, TGN38 and the 46 kDa mannose-6-phosphate receptor,
  with sequence preferences that differ from those of the AP-1 and AP-2 medium subunits. Unlike
  AP-1 and AP-2, AP-3 sits in a constitutively open conformation, is recruited to membranes
  by the small GTPase Arf1 through its large subunits, and polymerises into tubular carriers
  without a clathrin lattice. Cargo capture by the mu3A pocket is the step that rigidifies
  the complex and licenses coat assembly. Loss of AP-3 function causes lysosomal membrane
  proteins to accumulate at the cell surface and underlies Hermansky-Pudlak syndrome, although
  the human disease alleles lie in the beta3A and delta subunits rather than in AP3M1. In
  neurons the protein is additionally reported to be upregulated during homeostatic synaptic
  scaling, redistributing with AMPA receptors into recycling endosomes.'
existing_annotations:
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:19116314
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q04671
  review:
    summary: 'Protein binding to OCA2 (Q04671, the P protein), and the only low-throughput
      entry among the twenty-three GO:0005515 rows - assigned by UniProt rather than IntAct,
      from a study of how OCA2 reaches melanosomes. In GOA the reference annotates four gene
      products: AP1G1, AP2A1, OCA2 and AP3M1, so it is a small, adaptor-focused projection
      rather than a screen. The motifs the paper assays are acidic dileucine signals in the
      OCA2 cytoplasmic N-terminus, and it reports that the two signals interact differentially
      with cytoplasmic adaptors known to traffic other proteins to melanosomes.'
    action: MARK_AS_OVER_ANNOTATED
    reason: Biologically the most interesting of the binding rows, and still not convertible
      into an informative molecular function on the evidence available. Acidic dileucine signals
      are read by the sigma3/delta hemicomplex of AP-3; the mu subunit's site is the tyrosine
      YxxPhi pocket, and the two are distinct binding sites on distinct subunits. The cached
      record for this paper is abstract-only, so I cannot see which AP-3 construct was used
      or whether an additional tyrosine-motif experiment sits in the full text, and I am not
      going to assert a mis-attribution I cannot check - the curator read the whole paper.
      What I can say is that converting this row into a cargo-recognition MF would attribute
      to mu3A a motif specificity the abstract assigns to dileucine signals. Kept, marked
      over-annotated, with the AP-3 role in melanosomal cargo delivery captured instead by
      the melanosome assembly row.
    supported_by:
    - reference_id: PMID:19116314
      supporting_text: Steady-state melanosomal localization requires a conserved consensus
        acidic dileucine-based sorting motif within the cytoplasmic N-terminal region of OCA2
    - reference_id: PMID:19116314
      supporting_text: The two dileucine signals physically interact in a differential manner
        with cytoplasmic adaptors known to function in trafficking other proteins to melanosomes
    - reference_id: PMID:39705307
      supporting_text: 'This closed form of the complex occludes the two known binding sites
        for transmembrane cargo: tyrosine-based YxxΦ motifs (where x is any amino acid and
        Φ is a bulky, hydrophobic amino acid) on the μ subunit (12, 13)'
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:25416956
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q14194
  review:
    summary: Bare protein binding to CRMP1 (Q14194), from a systematic yeast two-hybrid map
      of ~14,000 human binary interactions (HI-II-14). A high-throughput screening hit curated
      into IntAct, with no AP-3-specific follow-up.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'GO:0005515 says nothing about what AP3M1 does, and this partner does not let
      a more informative molecular function be substituted: it is not an AP-3 subunit, not
      a known AP-3 cargo whose sorting was traced, and there is no follow-up study naming
      AP3M1 and this protein together. Two of the informative alternatives are ruled out specifically
      - the mu3A cargo site reads YxxPhi motifs in cytoplasmic tails, which is proposed separately
      as a GO:0005048 row from the peptide-binding and structural literature, and the small-GTPase
      rows on this gene come from a different, complex-level experiment. Where UniProt records
      an NbExp value for one of these pairs it counts replicates within these same datasets,
      not independent studies. Marked over-annotated: reproducible, uncharacterised, and not
      removable, since nothing contradicts the pairing.'
    supported_by:
    - reference_id: PMID:25416956
      supporting_text: Here, we describe a systematic map of ?14,000 high-quality human binary
        protein-protein interactions
