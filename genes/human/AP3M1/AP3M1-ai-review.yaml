proposed_new_terms:
- proposed_name: AP-3A adaptor complex
  proposed_definition: A heterotetrameric AP-type membrane coat adaptor complex composed of
    the delta subunit, the ubiquitously expressed beta3A subunit, the ubiquitously expressed
    mu3A medium subunit and a sigma3 small subunit; it is the form of AP-3 present in non-neuronal
    cells and sorts transmembrane cargo from endosomes to lysosomes and lysosome-related organelles.
  proposed_parent:
    id: GO:0030123
    label: AP-3 adaptor complex
  justification: GO:0030123 has no children, so nothing in the ontology distinguishes the
    ubiquitous complex that contains AP3M1 and AP3B1 from the neuronal complex that contains
    AP3M2 and AP3B2, even though the two have been shown genetically to have distinct and
    in places opposite functions in brain and are separately modelled by ComplexPortal (CPX-5051
    and CPX-5052 versus CPX-5053 and CPX-5055). Without the distinction, neuronal AP-3 phenotypes
    obtained with the shared delta subunit propagate indiscriminately onto the ubiquitous
    subunits.
