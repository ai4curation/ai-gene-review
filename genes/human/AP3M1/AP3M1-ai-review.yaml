knowledge_gaps:
- gap_statement: No experiment has perturbed AP3M1 itself in a human cell. Every process and
    localisation statement on this gene traces either to the complex - beta3A mutations in
    Hermansky-Pudlak syndrome fibroblasts, the mouse mocha Ap3d1 null, melanocyte co-immunoprecipitations
    - or to overexpression and knockdown of mu3A in mouse neurons. What a human AP3M1 loss
    of function does to lysosomal membrane protein traffic, and whether AP3M2 can cover for
    it, is unknown.
  boundary: 'Established: AP3M1 is a constitutive subunit of the ubiquitous AP-3A complex
    (ComplexPortal CPX-5051/CPX-5052, cryo-EM chain M of reconstituted human AP-3); its mu
    homology domain binds YxxPhi sorting signals including the LAMP1 YQTI motif, shown by
    two-hybrid and by structure; AP-3 loss sends LAMP1, LAMP2 and CD63 to the plasma membrane.
    Not established: any AP3M1-specific loss-of-function phenotype in any human cell, any
    human disease allele (a Europe PMC search over 143 hits for AP3M1 with mutation, variant
    or patient terms returned no Mendelian AP3M1 disorder, while HPS2 maps to AP3B1 and HPS10
    to AP3D1), and the degree of redundancy with AP3M2. One route by which a human loss could
    arise has been described but never observed clinically: the mu3A gene lies head-to-head
    with adenosine kinase across a shared bidirectional CpG-island promoter, and large ADK-region
    deletions in cultured hamster cells removed the whole mu3A gene.'
