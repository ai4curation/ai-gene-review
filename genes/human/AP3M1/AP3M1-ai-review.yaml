- gap_statement: AP-3's residual clathrin association has never been given a function. AP-3
    carries a clathrin-binding motif in the beta3 hinge and partially colocalises with clathrin,
    yet carrier formation demonstrably does not require a clathrin lattice, and clathrin knockdown
    does not fully disrupt AP-3-dependent cargo traffic.
