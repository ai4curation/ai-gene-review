- gap_statement: Whether mu3A and mu3B partition with beta3A and beta3B respectively, or whether
    the subunits mix and match, has been an open question since AP-3 was characterised, and
    I found nothing settling it for human cells. ComplexPortal models strict pairing; the
    genetics that dissect AP-3 function in brain used the beta3 isoforms, not the mu ones.
  boundary: 'Established: beta3A- and beta3B-containing complexes have distinct and in places
    opposite functions in mouse brain, with beta3B complexes preferentially targeted to neuronal
