      - source_id: SGD:S000006180
        source_label: APM1 / Q00776, Saccharomyces cerevisiae AP-1 mu subunit
        source_status: SUPPORTS_TRANSFER
        comment: 'Yeast Apm1, the AP-1 mu subunit. Same comment: it argues for the process
