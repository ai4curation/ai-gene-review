        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Arabidopsis AP1M2 (O22715), an AP-1 medium subunit. AP-1 is a bona fide TGN
          coat, so the donor annotation is sound; it is the step to an AP-3 subunit that is
          loose.
      - source_id: AGI_LocusCode:AT4G24550
        source_label: AP4M / Q9SB50, Arabidopsis thaliana AP-4 mu subunit
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: 'Arabidopsis AP4M (Q9SB50). Same situation: correct for AP-4 at the plant
          TGN, not evidence about AP-3.'
