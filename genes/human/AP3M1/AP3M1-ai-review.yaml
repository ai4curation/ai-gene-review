  review:
    summary: 'Where AP-3 acts has shifted since the terms currently on this gene were assigned.
      GOA describes the route as Golgi to vacuole (IBA) and as protein targeting to lysosome
      (TAS), but both recent structural studies state the step as endosome to lysosome: AP-3
      is recruited onto early/tubular endosomal compartments and sorts transmembrane cargo
      from there to endolysosomes, lysosomes and lysosome-related organelles. The melanocyte
      literature agrees independently, packaging tyrosinase and TYRP1 at early/recycling endosome-associated
      tubules under AP-1 and AP-3 control, and GOA already carries early endosome as a location
      for this gene.'
    action: NEW
    reason: 'Adds the compartment step that the existing process rows leave unstated, using
      the evidence code that matches the evidence. TAS rather than IMP or IDA is deliberate:
      the cell experiments that anchor these statements perturb the delta subunit and the
      AP3:AP3 lattice, not AP3M1, so this is a traceable author statement about the complex
      of which AP3M1 is a constitutive subunit, on the same footing as the existing GO:0006622
      TAS row. It complements rather than replaces GO:0006896: that term names the origin
      of the biosynthetic route, this one names the step AP-3 itself performs.'
    supported_by:
    - reference_id: PMID:42139345
      supporting_text: The AP3 complex mediates cargo sorting and carrier assembly for the
