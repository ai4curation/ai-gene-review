- term:
    id: GO:0035615
    label: clathrin-cargo adaptor activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - FB:FBgn0024833
  - FB:FBgn0263351
  - PANTHER:PTN000055849
  - dictyBase:DDB_G0289247
  review:
    summary: 'This is the AP-1/AP-2-specific term leaking onto AP-3 through the shared medium-subunit
      family. GO:0035615 is defined as ''Bringing together a cargo protein with clathrin,
      responsible for the formation of endocytic vesicles'', and every gene-level donor on
      the row is an AP-1 or AP-2 medium subunit: Drosophila AP-1mu (FBgn0024833 = O62531),
      Drosophila AP-2mu (FBgn0263351 = O62530) and Dictyostelium apm1 (DDB_G0289247 = Q54HS9);
      the current PAINT slice for PTN000055849 adds human AP1M2 (Q9Y6Q5) as a fourth. Both
      halves of the definition fail for AP-3. AP-3 builds carriers without a clathrin lattice,
      and it acts on the biosynthetic/endosomal route to lysosomes rather than in endocytosis.
      What is true, and what the donors really share with AP3M1, is the underlying cargo-adaptor
      activity: the mu subunit reads YxxPhi sorting signals and bridges them to the coat.'
    action: MODIFY
    reason: 'Retain the adaptor essence, drop the clathrin and endocytic commitments. GO:0140312
      ''cargo adaptor activity'' is the immediate parent of GO:0035615 and says what the family
      node actually supports. Three independent grounds for the change. (i) The ontology already
      separates the two coats: GO:0030131 ''clathrin adaptor complex'' has exactly two children,
      AP-1 and AP-2, and GO:0030123 AP-3 is not among its descendants. (ii) The biology: reconstituted
      AP3:ARF1 forms coated tubular carriers with no clathrin lattice. (iii) Direction of
      traffic: AP-3 sorts from endosomes to lysosomes, not into endocytic vesicles. The cargo-adaptor
      half of the term is, by contrast, directly demonstrated for this subunit - the cryo-EM
      structure resolves a LAMP1 YxxPhi peptide in the mu3 pocket, and a contact analysis
      of that structure (file:human/AP3M1/AP3M1-bioinformatics/RESULTS.md) shows the pocket
      is the same structural site as AP-2''s, retained in AP3M1 but chemically divergent from
      it.'
    proposed_replacement_terms:
    - id: GO:0140312
      label: cargo adaptor activity
    supported_by:
    - reference_id: PMID:42139345
      supporting_text: By demonstrating that AP3:ARF1 can generate carriers without using
        a clathrin lattice, we explain the clathrin independence of AP3-mediated trafficking
    - reference_id: PMID:39705307
      supporting_text: 'This closed form of the complex occludes the two known binding sites
        for transmembrane cargo: tyrosine-based YxxΦ motifs (where x is any amino acid and
        Φ is a bulky, hydrophobic amino acid) on the μ subunit (12, 13)'
    - reference_id: PMID:39705307
      supporting_text: There is also clear density for the LAMP1 cargo motif in the μ3-CTD
        tyrosine cargo-binding pocket, unambiguously showing that this complex represents
        the cargo-engaged state of AP-3
    - reference_id: PMID:9151686
      supporting_text: The AP-3 complex is not clathrin associated
    - reference_id: file:human/AP3M1/AP3M1-uniprot.txt
      supporting_text: not clathrin-associated. The complex is associated with the Golgi
    - reference_id: file:human/AP3M1/AP3M1-bioinformatics/RESULTS.md
      supporting_text: 'It is the *same* site as the AP-2 one: 9 of those 10 residues fall
        on alignment columns that are also AP2M1 cargo-pocket positions in the mu2/TGN38 crystal
        structure.'
