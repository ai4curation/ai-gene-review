- term:
    id: GO:1902608
    label: positive regulation of large conductance calcium-activated potassium channel activity
  evidence_type: ISS
  original_reference_id: PMID:39303704
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:F6X7B3
  review:
    summary: Proposed. Mouse mWAKE/ANKFN1 increases BK channel activity to lower neuronal excitability
      at night.
    action: NEW
    reason: '[PMID:39303704 "mWAKE promotes BK channel activity at night to inhibit neuronal excitability
      in a rhythmic manner."] ANKFN1 does part of the work: it is in the neurons whose BK current it raises,
      conditional loss in the dorsomedial hypothalamus raises those neurons'' excitability [PMID:37821426
      "mWAKE levels peak at night under clock control, and loss of mWAKE leads to hyperarousal and greater
      DMHmWAKE neuronal excitability specifically at night."], and loss in the central amygdala does the
      same [PMID:40835437 "Consistent with prior studies, loss of mWAKE function increases intrinsic excitability
      of CeA neurons."]. BK channels are the large-conductance calcium-activated potassium channels (KCNMA1),
      so GO:1902608 names the measured effect. Whether ANKFN1 binds the channel is unknown, so no MF is
      proposed. Transferred to human by ISS from mouse Ankfn1 (F6X7B3), which has no GO annotations of
      its own.'
    supported_by:
    - reference_id: PMID:39303704
      supporting_text: mWAKE promotes BK channel activity at night to inhibit neuronal excitability in
        a rhythmic manner.
    - reference_id: PMID:37821426
      supporting_text: mWAKE levels peak at night under clock control, and loss of mWAKE leads to hyperarousal
        and greater DMHmWAKE neuronal excitability specifically at night.
    - reference_id: PMID:40835437
      supporting_text: Consistent with prior studies, loss of mWAKE function increases intrinsic excitability
        of CeA neurons.
references:
- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  findings: []
- id: PMID:37821426
  title: A clock-dependent brake for rhythmic arousal in the dorsomedial hypothalamus.
  findings:
  - statement: mWAKE is a clock-dependent brake on arousal at night.
    supporting_text: Surprisingly, our data suggest that mWAKE acts as a clock-dependent brake on arousal
      during the night, when mice are normally active.
  - statement: Loss of mWAKE causes hyperarousal and higher DMH neuron excitability.
    supporting_text: mWAKE levels peak at night under clock control, and loss of mWAKE leads to hyperarousal
      and greater DMHmWAKE neuronal excitability specifically at night.
  - statement: mWAKE mutants change the quality, not the quantity, of wakefulness.
    supporting_text: These data suggest that mWake mutants exhibit changes in the quality, but not quantity,
      of wakefulness at night.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text. Mouse knockouts, chemogenetics and electrophysiology.
- id: PMID:39303704
  title: An amygdalar oscillator coordinates cellular and behavioral rhythms.
  findings:
  - statement: mWAKE raises Ca2+-activated K+ channel activity at night in amygdala neurons.
    supporting_text: mWAKE levels rise at night and promote rhythmic excitability of adLAmWAKE neurons
      by upregulating Ca2+-activated K+ channel activity specifically at night.
  - statement: mWAKE promotes BK channel activity to inhibit excitability.
    supporting_text: mWAKE promotes BK channel activity at night to inhibit neuronal excitability in a
      rhythmic manner.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text. Mouse amygdalar oscillator.
- id: PMID:24631345
  title: WIDE AWAKE mediates the circadian timing of sleep onset.
  findings:
  - statement: Fly WAKE is a clock output that promotes sleep onset.
    supporting_text: We propose that WAKE acts as a clock output molecule specifically for sleep, inhibiting
      LNvs at dusk to promote the transition from wake to sleep.
  - statement: Fly WAKE co-immunoprecipitates with the GABA-A receptor subunit RDL.
    supporting_text: We found that WAKE-T coimmunoprecipitated with RDL from Xenopus oocyte extracts (Figure
      5B), suggesting that WAKE and RDL may physically interact in a complex.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text. Drosophila ortholog; comparator for the NEW row.
- id: PMID:25088559
  title: The conserved discs-large binding partner Banderuola regulates asymmetric cell division in Drosophila.
  findings:
  - statement: Fly Banderuola regulates spindle orientation in neural precursors.
    supporting_text: We identify Banderuola (Bnd), an essential regulator of cell polarization, spindle
      orientation, and asymmetric protein localization in Drosophila neural precursor cells.
  - statement: Mammalian Bnd and Dlg homologs also interact.
    supporting_text: Because the mammalian homologs of Bnd and Dlg are interacting as well, Bnd function
      might be conserved in vertebrates, and it might also regulate cell polarity in higher organisms.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only. Source of the fly donor annotations behind the three IBAs.
- id: PMID:40835437
  title: mWAKE in the Central Amygdala Regulates Fear Learning and Memory.
  findings:
  - statement: Loss of mWAKE raises central amygdala neuron excitability.
    supporting_text: Consistent with prior studies, loss of mWAKE function increases intrinsic excitability
      of CeA neurons.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text. mWAKE is not rhythmic in the central amygdala, so its excitability effect
      is not purely circadian.
- id: PMID:35100349
  title: Ankfn1-mutant vestibular defects require loss of both ancestral and derived paralogs for penetrance
    in zebrafish.
  findings:
  - statement: Vertebrate Ankfn1 genes are needed for vestibular function.
    supporting_text: Our results show that vertebrate Ankfn1 genes are required for vestibular-related
      functions, with at least partial redundancy between ancestral and derived paralogs.
  - statement: A mouse Ankfn1 null allele (nmf9) has vestibular and neurological phenotypes.
    supporting_text: We identified a presumptive null allele of the mouse homolog by positional cloning
      of a neurological mutation (nmf9) marked by vestibular and neurological phenotypes
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text. Zebrafish double mutants.
