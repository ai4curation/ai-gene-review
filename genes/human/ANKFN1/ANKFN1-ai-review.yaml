    action: KEEP_AS_NON_CORE
    reason: The donor is fly Wake/Banderuola, which FlyBase annotates to the spindle and centrosome by
      IDA from the same study (PMID:25088559; only its abstract is cached). The abstract itself emphasizes
      cortical domains with Dlg [PMID:25088559 "We identify Banderuola (Bnd), an essential regulator of
      cell polarization, spindle orientation, and asymmetric protein localization in Drosophila neural
      precursor cells."]. is_active_in claims that the propagated activity is carried out at the spindle,
      which is more than a localization. For vertebrate ANKFN1 there is no localization data at the spindle;
      mouse mWAKE studies place it in neurons and ependymal cells. Kept as a non-core propagation, not
      adopted.
