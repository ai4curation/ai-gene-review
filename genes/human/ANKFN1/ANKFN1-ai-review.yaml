suggested_questions:
- question: Does mammalian ANKFN1 bind Ca2+-activated K+ channels or GABA-A receptor subunits directly,
    as fly WAKE binds RDL? And does it orient the spindle in vertebrate neural progenitors, as Banderuola
    does in flies?
suggested_experiments:
- description: Immunoprecipitate ANKFN1 from mouse hypothalamus at night versus day to identify channel
    partners, and image spindle orientation in Ankfn1-null neural progenitors.
