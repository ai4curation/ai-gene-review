    - reference_id: PMID:35100349
      supporting_text: Our results show that vertebrate Ankfn1 genes are required for vestibular-related
        functions, with at least partial redundancy between ancestral and derived paralogs.
    - reference_id: PMID:35100349
      supporting_text: We identified a presumptive null allele of the mouse homolog by positional cloning
        of a neurological mutation (nmf9) marked by vestibular and neurological phenotypes
