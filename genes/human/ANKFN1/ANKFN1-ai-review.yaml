- term:
    id: GO:1904326
    label: negative regulation of circadian sleep/wake cycle, wakefulness
  evidence_type: ISS
  original_reference_id: PMID:37821426
  qualifier: involved_in
  review:
    summary: Proposed. Mouse mWAKE/ANKFN1 acts as a clock-dependent brake on arousal at night.
    action: NEW
    reason: '[PMID:37821426 "Surprisingly, our data suggest that mWAKE acts as a clock-dependent brake
      on arousal during the night, when mice are normally active."] [PMID:37821426 "mWAKE levels peak
      at night under clock control, and loss of mWAKE leads to hyperarousal and greater DMHmWAKE neuronal
      excitability specifically at night."] ANKFN1 does part of the work: it is expressed in the arousal-promoting
      neurons themselves and lowers their excitability, and in amygdala neurons it acts by upregulating
      Ca2+-activated K+ channel activity [PMID:39303704 "mWAKE levels rise at night and promote rhythmic
      excitability of adLAmWAKE neurons by upregulating Ca2+-activated K+ channel activity specifically
      at night."]. The fly ortholog WAKE is likewise a clock output that promotes sleep [PMID:24631345
      "We propose that WAKE acts as a clock output molecule specifically for sleep, inhibiting LNvs at
      dusk to promote the transition from wake to sleep."] and carries GO:0045938 positive regulation
      of circadian sleep/wake cycle, sleep. Mouse Ankfn1 has no GO annotations, so this is an uncurated
      gap, not a convention. Transferred to human by ISS from the mouse data.'
    supported_by:
    - reference_id: PMID:37821426
      supporting_text: Surprisingly, our data suggest that mWAKE acts as a clock-dependent brake on arousal
        during the night, when mice are normally active.
    - reference_id: PMID:37821426
      supporting_text: mWAKE levels peak at night under clock control, and loss of mWAKE leads to hyperarousal
        and greater DMHmWAKE neuronal excitability specifically at night.
    - reference_id: PMID:39303704
      supporting_text: mWAKE levels rise at night and promote rhythmic excitability of adLAmWAKE neurons
        by upregulating Ca2+-activated K+ channel activity specifically at night.
    - reference_id: PMID:24631345
      supporting_text: We propose that WAKE acts as a clock output molecule specifically for sleep, inhibiting
        LNvs at dusk to promote the transition from wake to sleep.
