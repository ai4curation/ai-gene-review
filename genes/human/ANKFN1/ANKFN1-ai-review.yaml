  review:
    summary: Establishment of mitotic spindle orientation (IBA). Propagated from the fly ortholog's neuroblast
      spindle-orientation role; plausible but untested in vertebrates; kept as non-core.
    action: KEEP_AS_NON_CORE
    reason: The sole donor is the Drosophila ortholog Wake/Banderuola, which regulates spindle orientation
      and polarity in neural precursors [PMID:25088559 "We identify Banderuola (Bnd), an essential regulator
      of cell polarization, spindle orientation, and asymmetric protein localization in Drosophila neural
      precursor cells."]. Its authors note that the mammalian homologs of Bnd and its partner Dlg also
      interact, so the role may be conserved [PMID:25088559 "Because the mammalian homologs of Bnd and
      Dlg are interacting as well, Bnd function might be conserved in vertebrates, and it might also regulate
      cell polarity in higher organisms."]. None of the vertebrate studies reviewed here tests ANKFN1
      in spindle orientation; the mouse null allele nmf9 was found through its vestibular and neurological
      phenotypes [PMID:35100349 "We identified a presumptive null allele of the mouse homolog by positional
      cloning of a neurological mutation (nmf9) marked by vestibular and neurological phenotypes"]. Vertebrate
      ANKFN1 is known instead for clock-dependent control of neuronal excitability in mouse [PMID:37821426
      "Surprisingly, our data suggest that mWAKE acts as a clock-dependent brake on arousal during the
      night, when mice are normally active."] and vestibular function in zebrafish [PMID:35100349 "Our
      results show that vertebrate Ankfn1 genes are required for vestibular-related functions, with at
      least partial redundancy between ancestral and derived paralogs."]. With no counter-evidence the
      propagation stands, but as a non-core, untested role for the human protein.
    supported_by:
