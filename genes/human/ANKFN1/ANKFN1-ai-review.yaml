    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: 'Trust gates clear. Its mouse clock/arousal and zebrafish vestibular claims match PMID:37821426,
      PMID:39303704 and PMID:35100349, used here. Not used: the hepatocellular carcinoma claim (PMID:35725908),
      a single cancer study; the zebrafish crispant cilia screen (PMID:36533556), which lists ankfn1 among
      11 genes with ciliary phenotypes without mechanism; and the mouse brain expression atlas (PMID:33140455).
      PMID:40835437 is used for its central-amygdala result.'
