id: Q8N957
gene_symbol: ANKFN1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ANKFN1 (ankyrin repeat and fibronectin type-III domain-containing 1; mWAKE in mouse) is the
  vertebrate ortholog of Drosophila Wide awake (WAKE), also called Banderuola. In mouse brain it is a
  clock-output protein whose levels rise at night. In the dorsomedial hypothalamus it acts as a brake
  on arousal, and its loss causes hyperarousal and more excitable neurons. In the lateral amygdala it
  sets rhythmic neuronal excitability by increasing the activity of BK (KCNMA1) calcium-activated potassium
  channels. Mouse mutants keep normal total wake time but show longer wake bouts and heightened arousal,
  so ANKFN1 shapes the quality rather than the amount of wakefulness. A mouse null allele (nmf9) causes
  vestibular and neurological defects, and in zebrafish Ankfn1 genes are needed for vestibular function.
  The fly ortholog also orients the mitotic spindle in neural precursors, a role not tested in vertebrates.
  How ANKFN1 acts on ion channels at the molecular level is unknown.
