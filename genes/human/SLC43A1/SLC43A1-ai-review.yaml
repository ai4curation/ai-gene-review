core_functions:
- description: Sodium-independent, facilitated (equilibrative, uniport) transmembrane
    transport of large neutral and branched-chain L-amino acids (L-leucine,
    L-isoleucine, L-valine, L-phenylalanine, L-methionine), functioning autonomously
    without the SLC3A2/4F2hc heavy chain and without obligate exchange. The
    bidirectional, electroneutral mechanism distinguishes LAT3 from the obligatory
    exchangers LAT1/LAT2.
  molecular_function:
    id: GO:0015175
    label: neutral L-amino acid transmembrane transporter activity
  directly_involved_in:
  - id: GO:0015804
    label: neutral amino acid transport
  locations:
  - id: GO:0005886
    label: plasma membrane
  - id: GO:0016324
    label: apical plasma membrane
  supported_by:
