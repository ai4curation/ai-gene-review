      accumulation of iodocompounds imported by LAT1/LAT2, reflecting its equilibrative
      efflux capacity. This is a genuine, curator-reviewed (ARUK-UCL) experimental
      annotation but a context-dependent regulatory consequence of the core transport
      activity, not itself a core function. Kept as non-core.
