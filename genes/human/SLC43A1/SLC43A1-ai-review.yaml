id: O75387
gene_symbol: SLC43A1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SLC43A1 (LAT3, system L amino acid transporter 3) is a multi-pass plasma
  membrane protein of the SLC43 / major facilitator superfamily (TC 2.A.1.44) that
  mediates sodium-independent, facilitated (equilibrative, uniport) transmembrane
  transport of large neutral and branched-chain L-amino acids, including L-leucine,
  L-isoleucine, L-valine, L-phenylalanine and L-methionine. Unlike the system L
  transporters LAT1 (SLC7A5) and LAT2 (SLC7A8), LAT3 is catalytically autonomous,
  requiring no SLC3A2/4F2hc heavy chain and acting as a non-obligate transporter
  rather than an exchanger, so it can carry net flux in either direction depending
  on substrate gradients. Because it is bidirectional and electroneutral, it also
  effluxes small iodocompounds such as 3,3'-diiodo-L-thyronine (3,3'-T2) and
  3-iodo-L-tyrosine (MIT). It is most highly expressed in liver, pancreas and
  skeletal muscle, and is expressed in kidney glomerular podocytes, where it
  localizes to the apical plasma membrane of the foot processes. By supplying
  branched-chain amino acids such as leucine it contributes to cellular amino-acid
  homeostasis and protein synthesis; the gene (as POV1/PB39) is upregulated in
  prostate cancer.
