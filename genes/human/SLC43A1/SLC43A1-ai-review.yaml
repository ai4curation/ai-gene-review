    supporting_text: transported neutral amino acids such as l-leucine,
      l-isoleucine, l-valine, and l-phenylalanine
  - reference_id: PMID:12930836
    supporting_text: The transport of l-leucine was electroneutral and mediated by
      a facilitated diffusion
  - reference_id: file:human/SLC43A1/SLC43A1-uniprot.txt
    record_section: ["CC:FUNCTION"]
    supporting_text: The transport activity is sodium
      ions-independent, electroneutral and mediated by a facilitated
      diffusion
proposed_new_terms:
- proposed_name: L-amino acid uniporter activity
  proposed_definition: Enables the facilitated, uniport (equilibrative, non-exchange)
    transfer of an L-amino acid from one side of a membrane to the other, driven by
    the substrate's electrochemical gradient and independent of coupling to any other
    solute.
  justification: LAT3's defining mechanistic property, which distinguishes it from the
    system L exchangers LAT1/LAT2, is that it is a facilitative uniporter (equilibrative,
    non-exchange, Na+-independent) for L-amino acids. Current MF terms (GO:0015175,
    GO:0015179) and substrate-specific terms capture the substrate class but not the
    uniport mechanism. A child of GO:0015292 (uniporter activity) specific to L-amino
    acids would make this biologically important distinction machine-readable.
  proposed_parent:
    id: GO:0015292
    label: uniporter activity
  supported_by:
  - reference_id: PMID:12930836
    supporting_text: The transport of l-leucine was electroneutral and mediated by
      a facilitated diffusion
suggested_questions:
- question: Does LAT3 function predominantly as an efflux route for branched-chain
    amino acids and intracellular metabolites in liver and skeletal muscle, given
    its equilibrative mechanism and high expression in those tissues?
- question: Is the ER/pancreatic acinar crystalline-inclusion localization reported
    for the mouse ortholog a genuine resident location of human LAT3, or does it
    reflect biosynthetic transit or a cell-type-specific storage form?
suggested_experiments:
- description: Directional flux assays (radiolabel efflux vs influx) in polarized
    epithelial cells or proteoliposomes to quantify the net physiological direction
    of LAT3-mediated leucine/valine transport under native gradients.
- description: Endogenous immunolocalization (apical vs ER) of human LAT3 in liver,
    skeletal muscle and pancreatic acinar cells, with ER and plasma-membrane markers,
    to test whether the ER localization inferred from mouse holds for the human
    protein.
