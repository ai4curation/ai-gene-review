proposed_new_terms:
- proposed_name: negative regulation of magnesium ion transmembrane transport
  proposed_definition: Any process that stops, prevents or reduces the frequency, rate or extent of the
    directed movement of magnesium ions across a membrane.
  justification: ARL15 (and PRL phosphatases) inhibit CNNM-mediated Mg2+ efflux by direct binding; GO
    has magnesium ion transmembrane transport (GO:1903830) but no regulation children. GO:0010960 magnesium
    ion homeostasis describes the outcome at the level of cellular Mg2+ content, not the regulation of
    transporter flux that ARL15 performs, so it is not a substitute.
  supported_by:
  - reference_id: PMID:37449820
    supporting_text: Cells expressing both CNNM2 and ARL15 showed no efflux, thus demonstrating that,
      like PRL3, ARL15 inhibits CNNM protein activity.
suggested_questions:
- question: ARL15 was recovered with the lipid-binding chaperones PDE6D and UNC119 in independent two-hybrid
    screens. Since ARL15 is triply S-acylated, do these chaperones carry it between membranes?
- question: Do ARL15's CNNM and Smad4 roles act from the same compartment, and which explains the cleft
    palate of Arl15 knockout mice?
suggested_experiments:
- description: Test whether the CNNM-binding-deficient R95A mutant still promotes Smad4 activation, to
    separate ARL15's two effector arms.
