      conflicts with a recent report that ARL15 upregulates TGFβ family signaling by promoting the assembly
      of the Smad complex (Shi et al."] [PMID:37449820 "It is questionable whether ARL15 has catalytic
      activity, given the importance and prevalence of glutamine in related GTPases."] [PMID:37449820
