gene_symbol: ARL15
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'ARL15 is a 204-residue Arf-like small GTPase, palmitoylated, that localizes to the Golgi
  and endolysosomes. It binds GTP. Its intrinsic GTPase activity is disputed: measurable hydrolysis has
  been reported, but structural work finds it weak, consistent with an alanine at the catalytic glutamine
  position. ARL15 binds the CBS-pair domains of the CNNM magnesium transporters (crystal structure with
  CNNM2), promotes their complex N-glycosylation, and inhibits CNNM2-mediated Mg2+ efflux and TRPM7-mediated
  divalent cation uptake. It also binds the MH2 domain of Smad4, relieving Smad4 autoinhibition so that
  Smad complexes assemble; Smad4 has been reported to act as its GTPase-activating protein, although this
  is contested. It regulates Golgi-to-surface cargo transport. Arl15 knockout mice have cleft palate,
  and ARL15 variants are associated with metabolic traits and adiponectin levels.'
