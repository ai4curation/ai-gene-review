  review:
    summary: GTPase activity (IEA, InterPro). The evidence is contested. One study measured GTP hydrolysis
      by recombinant ARL15 (Km about 100 uM), and another reports Smad4 as its GTPase-activating protein.
      A structural study instead finds very weak GTP binding and low intrinsic GTPase activity. ARL15
      has alanine in place of the catalytic glutamine, so those authors doubt that a GAP exists. Accepted,
      because measurable if weak hydrolysis has been reported and is not refuted, but the activity level
      and its regulation are disputed.
