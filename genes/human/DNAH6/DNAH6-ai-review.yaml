suggested_questions:
- question: >-
    Why does PAINT place DNAH6 (and DNAH14) outside the node that gives DNAH3 and DNAH7 the
    inner dynein arm, inner dynein arm assembly and sperm flagellum assembly IBAs? Human and
    mouse orthologs are treated consistently, so this is a tree-topology question rather than
    a classification error.
- question: >-
    Does DNAH6 deficiency cause primary ciliary dyskinesia on its own? The airway evidence
    is from knockdown and oligogenic heterotaxy cases; homozygous null DNAH6 individuals with
    respiratory phenotyping are needed.
- question: >-
    Are the sperm head, acrosome and azoospermia phenotypes reported in some DNAH6 patients
    direct roles of DNAH6 outside the axoneme, or secondary to flagellar failure or linked
    variants?
suggested_experiments:
- description: >-
    Generate Dnah6 knockout mice and examine airway ciliary beat, ependymal flow, laterality
    and sperm axoneme ultrastructure by cryo-ET to confirm IDAg loss and its consequences.
  experiment_type: mouse knockout phenotyping and cryo-electron tomography
- description: >-
    Immunoprecipitation-mass spectrometry of DNAH6 from airway cilia to define its light chains
    (centrin, actin, DNALI1) and test the IBA-derived intermediate and light intermediate
    chain binding.
  experiment_type: IP-MS
