- term:
    id: GO:0003351
    label: epithelial cilium movement involved in extracellular fluid movement
  evidence_type: IMP
  original_reference_id: PMID:26918822
  qualifier: involved_in
  review:
    summary: >-
      shRNA knockdown of DNAH6 in human and mouse airway epithelia disrupted ciliary motion;
      dnah6 morpholino knockdown in zebrafish disrupted Kupffer's vesicle cilia and flow.
    action: NEW
    reason: >-
      DNAH6 is itself a motor subunit of the axonemal inner arms, so it does part of the work
      of airway ciliary beating, not merely being required for it. Not currently annotated
      in GOA. The evidence is knockdown-based and the authors note possible off-target effects,
      but it is consistent across species and with the CCDC39/40 ruler-defect data.
    supported_by:
    - reference_id: PMID:26918822
      supporting_text: >-
        Functional analysis with gene knockdown in zebrafish embryos and in the human and
        mouse respiratory epithelia showed DNAH6 is required for left-right patterning and
        airway ciliary motion, respectively.
- term:
    id: GO:0120316
    label: sperm flagellum assembly
  evidence_type: IMP
  original_reference_id: PMID:37594300
  qualifier: involved_in
  review:
    summary: >-
      Biallelic DNAH6 variants in several unrelated families cause MMAF, with absent inner
      dynein arms and radial spokes in patient sperm.
    action: NEW
    reason: >-
      DNAH6 is itself a structural inner dynein arm heavy chain, and its loss leaves both the
      inner arms and the radial spokes absent from patient sperm, so it does part of the work of
      building the flagellar axoneme rather than merely being required for it. Patient data from
      at least four independent groups show the same MMAF phenotype. Not currently annotated in
      GOA; the IBA that DNAH3 and DNAH7 receive for this term does not reach DNAH6, which sits
      outside PTN008951089, so the gap is phylogenetic rather than a curator decision.
    supported_by:
    - reference_id: PMID:37594300
      supporting_text: >-
        The absence of inner dynein arms and radial spokes was observed in the sperm of patients
        with DNAH6 variants.
