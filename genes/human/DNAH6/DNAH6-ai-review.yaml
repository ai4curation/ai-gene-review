id: Q9C0G6
gene_symbol: DNAH6
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  DNAH6 (dynein axonemal heavy chain 6) is a 4158-residue axonemal dynein heavy chain of the
  inner dynein arms of motile cilia and sperm flagella. It has the typical heavy-chain architecture:
  an N-terminal stem that docks it in the axoneme and a C-terminal motor head of six AAA+
  modules with a coiled-coil stalk and microtubule-binding domain, which converts ATP hydrolysis
  into minus-end-directed force on the neighbouring doublet. By sequence conservation and
  structural analysis DNAH6 is the heavy chain of IDAg, a single-headed, centrin (CETN2)-associated
  inner arm related to Chlamydomonas DHC2; IDAg and IDAd share a combined tail complex that
  associates with radial spoke 3. DNAH6 is expressed in testis, trachea and brain and lies
  along the respiratory ciliary axoneme and throughout the sperm flagellum; its axonemal assembly
  depends on the CCDC39/CCDC40 molecular ruler, and it is reduced in sperm lacking DNAH3 or
  DNAH7. Knockdown of DNAH6 disrupts motile cilia in human and mouse airway epithelium (with
  central-pair defects) and in the zebrafish left-right organizer, causing heterotaxy, and
  heterozygous DNAH6 variants have been proposed to act together with variants in other PCD
  genes in heterotaxy. Biallelic DNAH6 variants cause male infertility with multiple morphological
  abnormalities of the sperm flagella, with loss of inner dynein arms and radial spokes and,
  in some patients, sperm head and acrosome defects; ICSI can achieve pregnancy. Reports of
  DNAH6 in azoospermia and sperm head anomalies are single-family candidate findings.
