core_functions:
- description: HADH catalyzes the NAD+-dependent oxidation of L-(3S)-3-hydroxyacyl-CoA to 3-ketoacyl-CoA
    in mitochondrial fatty-acid beta-oxidation, as a soluble matrix homodimer with a preference for short-
    and medium-chain substrates.
  molecular_function:
    id: GO:0003857
    label: (3S)-3-hydroxyacyl-CoA dehydrogenase (NAD+) activity
  directly_involved_in:
  - id: GO:0006635
    label: fatty acid beta-oxidation
  locations:
  - id: GO:0005759
    label: mitochondrial matrix
  supported_by:
  - reference_id: PMID:10231530
    supporting_text: catalyzes the oxidation of the hydroxyl group of L-3-hydroxyacyl-CoA to a keto group,
      concomitant with the reduction of NAD+ to NADH
  - reference_id: PMID:11489939
    supporting_text: Expression studies showed that the P258L enzyme had no catalytic activity
- description: HADH provides an additional regulatory function by inhibiting glutamate dehydrogenase activity
    and restraining amino-acid-stimulated insulin secretion. Protein association and enzyme-kinetic evidence
    come chiefly from mouse islets; human biallelic HADH defects can cause hyperinsulinism, with phenotypic
    variation among reported cases. This function is distinguished from the beta-oxidation reaction without
    asserting that all secretagogue responses or the direct human interaction have been independently
    established.
  molecular_function:
    id: GO:0004857
    label: enzyme inhibitor activity
  directly_involved_in:
  - id: GO:0046676
    label: negative regulation of insulin secretion
  locations:
  - id: GO:0005759
    label: mitochondrial matrix
  supported_by:
  - reference_id: PMID:20670938
    supporting_text: showed protein-protein interactions between SCHAD and GDH
  - reference_id: PMID:20670938
    supporting_text: reflecting the loss of an inhibitory protein-protein interaction of SCHAD upon GDH
  - reference_id: PMID:21990309
    supporting_text: insulin secretion in response to glucose and glucose plus palmitate was elevated
      in isolated islets of knockout mice
proposed_new_terms: []
suggested_questions:
- question: To what extent is HADH's regulation of insulin secretion mediated by direct GLUD1 inhibition
    versus by perturbation of short-chain acyl-CoA/3-hydroxyacyl-CoA pools from impaired beta-oxidation,
    and are these mechanisms separable in human beta-cells?
- question: Is the HADH-GLUD1 inhibitory interaction conserved and direct in human tissue (as opposed
    to the By-similarity/mouse-based evidence currently underpinning it), and what is its stoichiometry
    and regulation?
suggested_experiments:
- description: Reconstitute purified human HADH with human GLUD1 in vitro and measure GLUD1 activity +/-
    HADH (and +/- HADH catalytic-dead mutants) to determine whether enzyme-inhibitor activity is independent
    of HADH's own catalysis.
- description: Generate beta-cell models expressing a catalytically dead but folding-competent HADH variant
    versus full knockout to dissociate the dehydrogenase activity from the GLUD1-inhibition / insulin-secretion-restraint
    function.
- description: Measure purified human HADH activity across C4–C16 substrates to quantify chain-length
    preferences, using HADHA as a comparator under matched assay conditions.
