- id: PMID:10231530
  title: Biochemical characterization and crystal structure determination of human heart short chain L-3-hydroxyacyl-CoA
    dehydrogenase provide insights into catalytic mechanism.
  findings:
  - statement: Human SCHAD is a homodimeric dehydrogenase characterized biochemically and by an NAD+-bound
      crystal structure; substrate docking, rather than a solved substrate complex, was used in this paper
      to investigate the catalytic mechanism.
    supporting_text: catalyzes the oxidation of the hydroxyl group of L-3-hydroxyacyl-CoA to a keto group,
      concomitant with the reduction of NAD+ to NADH
  - statement: Substrate modeling supports His158 as a general base assisted by Glu170 in the paper’s
      mature-chain numbering; these correspond to His170 and Glu182 of the canonical Q16836 precursor.
    supporting_text: His 158 serves as a general base, abstracting a proton from the 3-OH group of the
      substrate
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified primary biochemistry/structure paper establishing the human SCHAD core
      catalytic activity, homodimer, and mechanism. Abstract-only in cache.
  full_text_unavailable: true
- id: PMID:10840044
  title: Sequestration of the active site by interdomain shifting. Crystallographic and spectroscopic
    evidence for distinct conformations of L-3-hydroxyacyl-CoA dehydrogenase.
  findings:
  - statement: Crystal structures of apo-, cofactor-, and substrate-bound forms reveal NAD+-binding domain
      shifting relative to the C-terminal domain; supports NAD+ binding and catalytic mechanism.
    supporting_text: significant shifting of the NAD(+)-binding domain relative to the C-terminal domain
      occurs in the ternary and substrate-bound complexes
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified structural follow-up supporting NAD+ binding and the catalytic conformational
      cycle. Abstract-only in cache.
  full_text_unavailable: true
- id: PMID:11489939
  title: Hyperinsulinism in short-chain L-3-hydroxyacyl-CoA dehydrogenase deficiency reveals the importance
    of beta-oxidation in insulin secretion.
  findings:
  - statement: First report linking a fatty-acid-oxidation defect (SCHAD/HADH deficiency, P258L) to hyperinsulinism,
      establishing HADH's role in insulin-secretion regulation.
    supporting_text: This is the first defect in fatty acid beta-oxidation that has been associated with
      hyperinsulinism
  - statement: The disease-causing P258L variant abolishes catalytic activity, directly tying HADH to
      the 3-hydroxyacyl-CoA dehydrogenase reaction.
    supporting_text: Expression studies showed that the P258L enzyme had no catalytic activity
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified case report establishing the HADH-hyperinsulinism link and confirming
      loss of catalytic activity in a pathogenic variant. Abstract-only in cache.
  full_text_unavailable: true
- id: PMID:16725361
  title: Reye-like syndrome resulting from novel missense mutations in mitochondrial medium- and short-chain
    l-3-hydroxy-acyl-CoA dehydrogenase.
  findings:
  - statement: Expressed human variants D45G and Y214H (paper numbering; precursor D57G/Y226H) respectively
      alter NADH Km and abolish detectable activity. The reported patient lacked clinical evidence of
      hyperinsulinism, distinguishing this case from earlier HADH cases.
    supporting_text: This association suggests that there is a role for M/SCHAD in regulating the pancreatic
      secretion of insulin
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified case report with mutant enzymology supporting the core activity and
      the insulin-regulation role. Abstract-only in cache.
  full_text_unavailable: true
- id: PMID:20670938
  title: Mechanism of hyperinsulinism in short-chain 3-hydroxyacyl-CoA dehydrogenase deficiency involves
    activation of glutamate dehydrogenase.
  findings:
  - statement: Mouse Hadh deletion, protein interaction experiments and islet enzyme kinetics support
      inhibitory regulation of GDH by SCHAD. This study found amino-acid hypersensitivity without an altered
      glucose-stimulated response, including with added octanoate or palmitate.
    supporting_text: reflecting the loss of an inhibitory protein-protein interaction of SCHAD upon GDH
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed identity and abstract checked; cached article text includes abstract, introduction
      and discussion but does not expose the methods/results sections. Those sections could not be retrieved
      independently in this session. Mechanistic claims are limited to the reported mouse/islet findings;
      no direct human interaction assay is asserted.
- id: PMID:21990309
  title: Role of medium- and short-chain L-3-hydroxyacyl-CoA dehydrogenase in the regulation of body weight
    and thermogenesis.
  findings:
  - statement: This mouse knockout study reports low glucose, elevated insulin and increased islet secretion
      in response to glucose or glucose plus palmitate. Its secretagogue response differs from the normal
      glucose response reported in PMID:20670938; both observations are retained.
    supporting_text: insulin secretion in response to glucose and glucose plus palmitate was elevated
      in isolated islets of knockout mice
  - statement: Hadh knockout impairs adaptive thermogenesis and body-weight regulation under high-fat/cold
      conditions.
    supporting_text: SCHAD plays an important role in adaptive thermogenesis
  - statement: SCHAD/HADH is highly expressed in pancreatic islets of Langerhans, consistent with a direct
      role in beta-cell function.
    supporting_text: in the islets of Langerhans within the pancreas
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified mouse knockout study (full text available) supporting insulin-secretion
      regulation, thermogenesis, and islet expression.
