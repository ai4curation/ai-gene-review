  evidence_type: IEA
  original_reference_id: GO_REF:0000116
  qualifier: enables
  review:
    summary: Pig HADH has experimentally measured long-chain substrate activity, and human UniProt transfers
      the C16 reaction by similarity. This supports biochemical capability but does not establish a physiological
      long-chain role for human HADH.
    action: MARK_AS_OVER_ANNOTATED
    reason: GO:0016509 covers 13–22-carbon substrates; RHEA:31159 is the C16 hydroxyhexadecanoyl-CoA reaction
      transferred from pig P00348. The inspected PMID:2817332 abstract reports medium-chain preference
      and similar medium/long-chain Km values, but these do not establish comparable catalytic efficiency
      or a physiological human long-chain contribution. Mark the inferred functional assignment as over-annotated
      rather than retaining it as a demonstrated secondary physiological role. The closest ENZYME_SPECIFICITY
      rationale is in vitro activity of uncertain functional relevance; its no-alternative-enzyme condition
      is not met because HADHA supplies the dedicated long-chain pathway step. Do not call the observed
      pig activity absent or assay noise, and do not infer a wrong-paralog transfer. Full kinetic tables
      were not inspected.
    supported_by:
    - reference_id: PMID:2817332
      supporting_text: most active with medium-chain substrates
