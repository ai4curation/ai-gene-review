id: Q16836
gene_symbol: HADH
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: HADH encodes a soluble mitochondrial matrix 3-hydroxyacyl-CoA dehydrogenase that functions
  as a homodimer. It catalyzes the NAD+-dependent oxidation of L-(3S)-3-hydroxyacyl-CoA to 3-ketoacyl-CoA,
  the third reaction of mitochondrial fatty-acid beta-oxidation, with a preference for short- and medium-chain
  substrates. Structural studies support a histidine general base assisted by a neighboring glutamate
  in the catalytic mechanism. HADH is expressed in liver, kidney, pancreas, heart and skeletal muscle.
  It also restrains amino-acid-stimulated insulin secretion through an inhibitory association with glutamate
  dehydrogenase (GLUD1), a mechanism characterized in mouse pancreatic islets. Loss of this regulatory
  interaction provides an explanation for the hyperinsulinaemic hypoglycaemia associated with biallelic
  human HADH defects. The dehydrogenase reaction and inhibition of GLUD1 represent distinct molecular
  roles; the regulatory interaction is less directly characterized in human beta-cells.
