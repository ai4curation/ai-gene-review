  review:
    summary: Conserved EF-hand calcium-binding motifs support calcium ion binding.
    action: ACCEPT
    reason: The human sequence has four EF-hand domains with explicit calcium-coordinating positions assigned
      by PROSITE-ProRule. Horse CAPSL is 97.1% identical over all 208 human residues and retains the EF-hand
      architecture. This is a motif- and conservation-based inference; no direct calcium-binding measurement
      is asserted.
    supported_by:
