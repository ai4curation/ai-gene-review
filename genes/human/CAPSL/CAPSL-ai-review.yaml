- description: EF-hand calcium-binding protein. EF-hands 1 and 2 carry canonical calcium-coordinating
    loops, and the family architecture is shared with the structurally characterised paralog calcyphosin.
    Whether calcium regulates CAPSL's microtubule role is unknown.
