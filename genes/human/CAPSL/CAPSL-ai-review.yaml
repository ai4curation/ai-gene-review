id: Q8WWF8
gene_symbol: CAPSL
product_type: PROTEIN
status: IN_PROGRESS
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CAPSL is a calcyphosin-like EF-hand protein with conserved calcium-binding motifs. Human
  CAPSL is distributed in the cytoplasm and nucleus. Depletion in human retinal microvascular endothelial
  cells impairs proliferation, migration and tube formation, and endothelial Capsl loss disrupts retinal
  vascular development in mice. Its molecular connection to MYC signaling remains unresolved; a calcium-dependent
  regulatory mechanism is plausible but not experimentally established. A mammalian structural preprint
  identifies CAPSL as a microtubule-inner protein of the ciliary transition zone and reports microtubule
  stabilization in vitro; the native structural evidence is from bovine cilia.
