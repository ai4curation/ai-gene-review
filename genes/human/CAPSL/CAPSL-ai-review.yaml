- id: PMID:39264149
  title: Dysfunction of Calcyphosine-Like gene impairs retinal angiogenesis through the MYC axis and is
    associated with familial exudative vitreoretinopathy.
  findings:
  - statement: Endothelial-specific Capsl knockout in mouse causes FEVR-like retinal vascular defects,
      and CAPSL knockdown in human retinal microvascular endothelial cells impairs proliferation and migration
      and lowers MYC protein but not MYC mRNA.
    supporting_text: Notably, the depletion of CAPSL significantly decreased the protein level of MYC, rather
      than the mRNA level in HRECs (Figure 7G).
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text cached. It provides genetic (loss-of-function) evidence for an endothelial
      requirement, but no molecular mechanism. Its cytoplasm/nucleus localization statement cites the Human
      Protein Atlas rather than this study's own data. MGI used it for mouse IMP process annotations. Those
      phenotypes are not transferred to human CAPSL here.
- id: PMID:31186450
  title: Calcyphosine-like (CAPSL) is regulated in Multiple Symmetric Lipomatosis and is involved in Adipogenesis.
  findings:
  - statement: Capsl knockout 3T3-L1 cells show enhanced adipogenic differentiation, while overexpressing
      cells fail to accumulate lipid properly.
    supporting_text: CapslKO cells showed enhanced propensity for differentiation, while CapslOE cells showed
      no proper lipid accumulation
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Full text cached. Cell-line perturbation phenotype in mouse 3T3-L1 cells and expression
      data in human adipose-derived cells. It is not used to support any GO annotation, because it shows
      a phenotype and not a CAPSL activity.
