proposed_new_terms: []
suggested_questions:
- question: Does calcium occupancy of EF-hands 1 and 2 change CAPSL binding to the microtubule lumen
    or its self-association in the transition-zone spiral?
- question: Is the endothelial requirement for CAPSL in retinal angiogenesis, which acts through lowered
    MYC protein, related to a microtubule-associated function in endothelial cells, or does it reflect
    a separate cytoplasmic or nuclear pool? Human curators have not annotated the endothelial phenotypes
    that MGI captured for mouse Capsl. Should GO capture them as process participation, or only as phenotype?
suggested_experiments:
- description: Knock out CAPSL in differentiated human airway multiciliated cultures and analyse transition-zone
    doublet ultrastructure by cryo-ET, ciliary gating and beat, with rescue by tubulin-interface and EF-hand
    loop mutants.
  hypothesis: CAPSL is required for the mechanical integrity of transition-zone doublets, and calcium binding
    modulates this role.
- description: Measure calcium affinity of recombinant CAPSL (ITC or fluorescence titration) and test
    calcium dependence of its microtubule binding and stabilization in vitro.
  hypothesis: EF-hands 1 and 2 bind calcium with physiologically relevant affinity, and calcium binding
    changes CAPSL interaction with microtubules.
