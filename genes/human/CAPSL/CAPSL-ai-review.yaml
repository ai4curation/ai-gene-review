  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0086
  review:
    summary: CAPSL has a supported intracellular cytoplasmic distribution.
    action: ACCEPT
    reason: The curated localization agrees with CAPSL localization examined in human cells in the retinal
      angiogenesis study; nuclear distribution is also reported. Cytoplasm is a justified location, without
      assigning CAPSL to a particular organelle.
    supported_by:
    - reference_id: PMID:39264149
      supporting_text: CAPSL is localized in both the cytoplasm and the nucleus of cells
- term:
    id: GO:0043226
    label: organelle
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: located_in
  supporting_entities:
  - ARBA:ARBA00029065
  review:
    summary: Organelle is a broad compatible localization for the reported nuclear pool.
    action: KEEP_AS_NON_CORE
    reason: CAPSL has reported nuclear as well as cytoplasmic distribution. The organelle term is therefore
      compatible but adds little specificity and does not describe its principal biochemical function.
      The supporting biological observation is the human localization study, not the ARBA assertion that
      supplied this GOA row.
    supported_by:
    - reference_id: PMID:39264149
      supporting_text: CAPSL is localized in both the cytoplasm and the nucleus of cells
