core_functions:
- description: Hydrolyses the ester bond of fatty acid esters of hydroxy fatty acids in the plasma membrane,
    releasing a free fatty acid and a hydroxy fatty acid and thereby terminating FAHFA signalling. Catalysis
    uses Thr47 as nucleophile and His131 as general base, both within transmembrane helices.
  molecular_function:
    id: GO:0120573
    label: FAHFA hydrolase activity
  directly_involved_in:
  - id: GO:0042758
    label: long-chain fatty acid catabolic process
  locations:
  - id: GO:0005886
    label: plasma membrane
  substrates:
  - id: CHEBI:83670
    label: 9-PAHSA(1-)
  - id: CHEBI:83677
    label: 12-PAHSA(1-)
  - id: CHEBI:136282
    label: 9-[(9Z)-octadecenoyloxy]octadecanoate
  supported_by:
  - reference_id: PMID:27018888
    supporting_text: The FAHFA hydrolase activities of AIG1 and ADTRP were abolished by mutating their
      putative catalytic nucleophilic residues Thr-43 and Thr-47, respectively
  - reference_id: PMID:27018888
    supporting_text: Both AIG1 and ADTRP hydrolyze bioactive fatty acid esters of hydroxy fatty acids
      (FAHFAs) but not other major classes of lipids.
  - reference_id: PMID:32152231
    supporting_text: androgen-induced gene 1 (AIG1) and androgen-dependent TFPI-regulating protein (ADTRP),
      two threonine hydrolases, control FAHFA levels in vivo in both genetic and pharmacologic mouse models
proposed_new_terms:
- proposed_name: fatty acid ester of hydroxy fatty acid catabolic process
  proposed_definition: The chemical reactions and pathways resulting in the breakdown of a fatty acid
    ester of a hydroxy fatty acid (FAHFA), a class of endogenous bioactive signalling lipids in which
    a fatty acid is esterified to a hydroxyl group on a second fatty acid backbone.
  proposed_parent:
    id: GO:0042758
    label: long-chain fatty acid catabolic process
  justification: GO gained the molecular function GO:0120573 FAHFA hydrolase activity on 2026-03-14 but
    has no biological-process counterpart; a QuickGO text search for 'FAHFA' returns GO:0120573 and nothing
    else. The nearest available process term, GO:0042758 long-chain fatty acid catabolic process, is chemically
    true for ADTRP because ChEBI classifies the substrate 9-PAHSA(1-) (CHEBI:83670) as a long-chain fatty
    acid anion, but it is far broader than the demonstrated specificity and it is the term PAINT is currently
    propagating from a pan-eukaryotic node to 86 gene products including 14 fungi and 5 plants. A FAHFA-level
    process term would let PAINT and manual curators state the specific claim where it is supported and
    withhold it where it is not. GO may reasonably decline this on the grounds that a single-step hydrolysis
    is adequately covered by the molecular function; that is recorded here as the counter-argument rather
    than suppressed.
  supported_by:
  - reference_id: PMID:32152231
    supporting_text: The levels of other lipid classes were unaltered indicating that AIG1 and ADTRP specifically
      hydrolyze FAHFAs.
suggested_questions:
- question: 'PAINT recommendation for PTHR10989. At node PTN001659973, scoped taxon:2759 (Eukaryota) and
    seeded only by human ADTRP (Q96IZ2) and human AIG1 (Q9NVV5), the molecular function is held at GO:0016787
    hydrolase activity - the root of the branch - while the biological process is the far more specific
    GO:0042758 long-chain fatty acid catabolic process. Both reach all 86 recipients, including 14 fungal,
    5 plant and 2 other-eukaryote proteins, of which the only reviewed representatives are two uncharacterised
    UPF0641 proteins (P38842, Q96WV4). The character conserved across the node is the Thr/His catalytic
    dyad: 73 of 85 recipients retain it when aligned onto ADTRP''s own annotated SITE positions. A conserved
    dyad supports a claim about catalytic mechanism, which is what GO:0016787 states, but not a claim
    about substrate - and GO:0042758 is a substrate-level term whose substrate has been established only
    for the four characterised animal members. Should the process term therefore sit on the vertebrate
    or mammalian subclade where the IBD seeds actually are, as PTN002591065 already does for GO:0005901,
    leaving the mechanism-level MF at the Eukaryota node? Note the MF placement is recent and deliberate
    (2026-05-28, after GO:0120573 was created on 2026-03-14), so this is a question about the process
    term rather than a suggestion that the MF is stale.'
  experts:
  - GO Central / PAINT curators
- question: UniProt evidence attribution for Q96IZ2. The SUBCELLULAR LOCATION line cites both PubMed:21868574
    and PubMed:27018888 as ECO:0000269 evidence for 'Cell membrane', and GOA has split this into two EXP
    rows for GO:0005886. The cached full text of PubMed:27018888 contains no localisation experiment -
    no immunofluorescence, confocal imaging or fractionation beyond bulk membrane lysates of transfected
    HEK293T cells, and no occurrence of the phrases 'plasma membrane' or 'cell surface'. Should that reference
    be attached to 'Multi-pass membrane protein' only, leaving PubMed:21868574 as the evidence for the
    plasma-membrane compartment?
