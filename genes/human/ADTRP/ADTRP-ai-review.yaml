- term:
    id: GO:0120573
    label: FAHFA hydrolase activity
  evidence_type: IMP
  original_reference_id: PMID:27018888
  qualifier: enables
  review:
    summary: The gene's core molecular function, established by loss-of-activity mutagenesis of both catalytic
      residues against a panel of non-FAHFA lipid controls.
    action: ACCEPT
    reason: 'ADTRP is a six-pass integral membrane threonine hydrolase that cleaves the ester bond of
      fatty acid esters of hydroxy fatty acids (FAHFAs). Catalysis requires Thr47 and His131, both of
      which UniProt records as SITE features with experimental evidence from PubMed:27018888 and both
      of which lie inside predicted transmembrane helices. The evidence is specific in both directions:
      transfected membrane lysates hydrolysed FAHFAs but showed negligible activity against (lyso)-phospholipids
      and mono-, di- and tri-glycerides, and both T47A and H131A abolished FAHFA hydrolysis. The term
      matches the measured reaction exactly and is anchored to RHEA, so no granularity question arises.
      IMP is the right code: the assignment rests on the mutant phenotype.'
    supported_by:
    - reference_id: PMID:27018888
      supporting_text: The FAHFA hydrolase activities of AIG1 and ADTRP were abolished by mutating their
        putative catalytic nucleophilic residues Thr-43 and Thr-47, respectively
    - reference_id: PMID:27018888
      supporting_text: We also tested the H134A mutant of AIG1 and H131A mutant of ADTRP and found that
        these proteins showed no detectable FAHFA hydrolase activity above a mock-transfected control
    - reference_id: PMID:27018888
      supporting_text: The membrane lysates of hAIG1- and hADTRP-transfected HEK293T cells showed negligible
        hydrolytic activity above a mock-transfected control proteome with the majority of tested lipid
        substrates, including common classes of (lyso)-phospholipids and neutral lipids
    - reference_id: PMID:27018888
      supporting_text: AIG1 and ADTRP displayed a preference for FAHFAs with branching distal from the
        carboxylate head group of the lipids
