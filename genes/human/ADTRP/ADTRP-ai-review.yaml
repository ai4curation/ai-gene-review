- gap_statement: 'The ADTRP/AIG1 family is pan-eukaryotic with 5788 members, but only four proteins have
    ever been characterised biochemically: human and mouse ADTRP and human and mouse AIG1. No substrate
    is known for any fungal, plant or invertebrate member.'
  boundary: 'Known: two human enzymes, their mouse orthologues, a mouse knockout phenotype, and that the
    Thr/His catalytic dyad is retained in 73 of 85 other members of the PANTHER node - so most of the
    family is very likely to be catalytically competent. Unknown: what any non-animal member hydrolyses,
    and whether FAHFAs exist as metabolites outside animals. Undetermined rather than negative for the
    14 fungal members, whose alignments to ADTRP all fall below 25% identity.'
