- question: Is GO:2000402 negative regulation of lymphocyte migration correct for ADTRP from PMID:28341552?
    The abstract describes monocyte adhesion and monocyte transendothelial migration and never mentions
    lymphocytes. If the full text has no lymphocyte migration assay, GO:2000438 negative regulation of
    monocyte extravasation is the matching term; GO:0071676 negative regulation of mononuclear cell migration
    is a verified ancestor of both and would be the conservative choice.
  experts:
  - BHF-UCL curators
- question: 'Does ADTRP''s FAHFA hydrolase activity have anything to do with its effect on TFPI expression?
    The two literatures have never been joined: no study has asked whether the catalytically dead T47A
    or H131A mutant still supports TFPI up-regulation, nor whether FAHFA levels change in endothelial
    cells on ADTRP knockdown. Until that is done, the gene has two unconnected functional descriptions
    and GO records both without a causal link.'
  experts:
