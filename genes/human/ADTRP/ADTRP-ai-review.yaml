  - Vascular biology
- question: Should human ADTRP carry a caveola annotation with the is_active_in relation? The seeding
    evidence is a located_in colocalisation IDA in endothelial cells, and no assay has placed FAHFA hydrolase
    activity in caveolae specifically.
  experts:
  - GO Central / PAINT curators
suggested_experiments:
- hypothesis: TFPI regulation by ADTRP requires its FAHFA hydrolase activity.
  description: Reconstitute ADTRP knockdown endothelial cells with wild-type ADTRP, the T47A nucleophile
    mutant and the H131A general-base mutant, and measure TFPI mRNA, cell-associated TFPI anticoagulant
    activity against factor Xa, and cellular FAHFA levels by LC-MS in parallel. A catalytically dead mutant
    that still restores TFPI would separate the two functions; one that does not would unify them.
  experiment_type: structure-function rescue
- hypothesis: ADTRP hydrolyses FAHFAs within caveolae rather than across the plasma membrane generally.
  description: Fractionate endothelial membranes into caveolar and non-caveolar pools by detergent-free
    density gradient, and assay FAHFA hydrolase activity in each with and without the ADTRP-active inhibitors
    KC01 and JJH260 alongside their inactive structural controls THL and ABC34. This would test the is_active_in
    caveola claim that PAINT currently propagates to 25 vertebrate orthologues.
  experiment_type: subcellular fractionation and activity assay
- hypothesis: The fungal ADTRP/AIG1 members that PAINT annotates as long-chain fatty acid catabolic enzymes
    are not FAHFA hydrolases.
  description: Express the two reviewed uncharacterised family members, S. cerevisiae YHR140W (P38842)
    and S. pombe SPBPJ4664.05 (Q96WV4), and assay them against the same FAHFA and non-FAHFA lipid panel
    used for ADTRP and AIG1, checking fluorophosphonate probe reactivity and the conservation of the Thr/His
    pair. A negative result would justify restricting the node's process annotation to the clade where
    activity is demonstrated.
  experiment_type: heterologous expression and substrate panel
knowledge_gaps:
- gap_statement: 'The physiological substrate-to-phenotype link for human ADTRP is unknown: no study connects
    its measured FAHFA hydrolase activity to any of the endothelial, coagulation or atherosclerosis phenotypes
    attributed to the gene.'
  boundary: 'Known: the enzyme hydrolyses FAHFAs in vitro and controls FAHFA levels in mouse tissues;
    and separately, its knockdown alters TFPI expression, monocyte adhesion and PIK3R3/AKT signalling
    in human endothelial cells. Unknown: whether either phenotype is downstream of the catalytic activity.'
