    action: MARK_AS_OVER_ANNOTATED
    reason: 'Both GO:0005515 rows come from the single HuRI binary interactome screen. IntAct returns
      10 interactions for Q96IZ2; the two HuRI partners are each logged three times, as ''two hybrid array'',
      ''two hybrid prey pooling approach'' and ''validated two hybrid'' - three sub-methods of one experiment,
