      ORFeome-clone substitution - but a single unreplicated screen hit is not an informative molecular
      function. Marked over-annotated rather than removed: nothing refutes the interaction, it is simply
      unsupported beyond one screen. Q6PL24 is reviewed TMED8_HUMAN, 325 aa, matching the canonical entry.'
