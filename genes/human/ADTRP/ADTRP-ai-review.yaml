id: Q96IZ2
gene_symbol: ADTRP
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'ADTRP (androgen-dependent TFPI-regulating protein) is a six-pass integral membrane enzyme
  of the ADTRP/AIG1 family that hydrolyses fatty acid esters of hydroxy fatty acids (FAHFAs), a class
  of endogenous bioactive signalling lipids with anti-inflammatory and insulin-sensitising properties.
  It is an atypical hydrolase: it has no sequence or structural relationship to the classical serine-hydrolase
  folds, and instead uses a threonine nucleophile (Thr47) activated by a histidine general base (His131),
  both of which sit within transmembrane helices rather than in a soluble catalytic domain. Substitution
  of either residue abolishes FAHFA hydrolysis, and the enzyme is inactive against phospholipids, lysophospholipids
  and mono-, di- and triglycerides, preferring FAHFA isomers branched distal to the carboxylate head group.
  Together with its paralogue AIG1 it is one of the two principal FAHFA hydrolases in mammals; knockout
  mice accumulate FAHFAs, particularly the 9-position ester isomers, with other lipid classes unchanged.
  ADTRP is expressed in vascular endothelium and placenta, is transcriptionally induced by androgen, and
  localises to the plasma membrane, concentrating with tissue factor pathway inhibitor (TFPI) and caveolin-1
  in lipid rafts and caveolae. In endothelial cells it raises TFPI expression and the cell-associated
  anticoagulant activity of TFPI against factor Xa, and its depletion increases monocyte adhesion and
  transendothelial migration through a PIK3R3-AKT-MIA3 axis. The gene lies at a coronary-artery-disease
  GWAS locus. How the lipid-hydrolase activity relates to the endothelial TFPI and vascular phenotypes
  is not established.'
