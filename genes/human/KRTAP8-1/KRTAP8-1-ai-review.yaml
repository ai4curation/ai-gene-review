id: Q8IUC2
gene_symbol: KRTAP8-1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Keratin-associated protein 8-1 (KAP8.1) is a 63-residue high glycine-tyrosine (HGT) keratin-associated protein encoded in the chromosome 21q22.1 KAP gene domain. Spectroscopy and modelling indicate a compact structure of poly-proline II and beta strands held together by two disulfide bridges. KAP8.1 protein is deposited in discrete regions of the keratinizing zone of the hair cortex, and its asymmetric distribution is associated with the orthocortex and hair curvature. In vitro, KAP8.1 binds the head domain of the type II hair keratin K85, and HGT KAPs also bind desmoplakin, suggesting that they bridge keratin intermediate filaments within the cortical matrix. Ovine KRTAP8-1 variation is associated with wool staple length.
