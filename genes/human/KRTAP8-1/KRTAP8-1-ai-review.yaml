suggested_questions:
- question: Does KAP8.1 binding to the K85 head domain control the helical arrangement of filaments in the orthocortex in vivo, and hence hair curvature?
- question: Desmoplakin C-terminus binding was reported for some HGT KAPs (PMID:23791804) but is not shown specifically for KAP8.1 in the abstract; does KAP8.1 bind desmoplakin, and is this physiologically relevant in cortical cells?
- question: Is KAP8.1 a compact disulfide-bridged poly-proline II structure (spectroscopy and modelling, PMID:28289743) or largely disordered (low-confidence AlphaFold model cited in the OpenScientist report), and does it become ordered on binding the K85 head domain?
- question: GO lacks a cellular component term for the keratin-associated interfilamentous matrix of the hair cortex/cuticle; should one be requested, as keratin filament is only an approximation?
