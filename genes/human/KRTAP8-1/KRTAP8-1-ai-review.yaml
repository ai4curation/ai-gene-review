- term: &id004
    id: GO:0045095
    label: keratin filament
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-6809663
  review:
    summary: Proposed location of KRTAP8-1 with hair keratin filaments, as for other KAP family members.
    action: NEW
    reason: KAPs form the interfilamentous matrix that is cross-linked to hair keratin intermediate filaments. Most KRTAP paralogues already carry keratin filament from the InterPro KAP signature; this gene lacks that signature match but belongs to the same functional class. GO has no separate term for the keratin-associated matrix, so keratin filament is the closest location.
    supported_by:
    - *id001
    - reference_id: Reactome:R-HSA-6809663
      supporting_text: In the lower and middle cortex, keratin filaments are embedded in a matrix that consists of KAPs.
    - reference_id: PMID:18721477
      supporting_text: In the hair cortex, hair keratins IFs are embedded in an in interfilamentous matrix, which consists of hair keratin-associated proteins (KATAP, usually abbreviated as KAP) [26].
- term:
    id: GO:1990254
    label: keratin filament binding
  evidence_type: IDA
  original_reference_id: PMID:23791804
  review:
    summary: KAP8.1 binds the head domain of the type II hair keratin K85 in vitro (Western blot and ITC).
    action: NEW
    reason: 'Direct binding of KAP8.1 to a trichocyte keratin head domain, and bundling of filament complexes observed by TEM, support keratin filament binding as a specific molecular activity. Species caveat: neither the cached abstract nor the OpenScientist deep-research report states the species of the recombinant KAP8.1, K85 and K35 proteins, and the full text could not be retrieved (publisher access denied). Human origin is likely but unconfirmed: the human K85/K35 nomenclature is used, the work comes from a human hair-research collaboration, and the same group''s follow-up (PMID:30125694) raised its antibody against human KAP8.1. The annotation is kept on that basis; if the proteins prove non-human, the evidence code should become ISS rather than IDA. Assays used the isolated K85 head domain, and binding to other hair keratins was not tested, so filament-level binding and partner range should be confirmed.'
    supported_by:
    - reference_id: PMID:23791804
      supporting_text: Western blot analysis and isothermal titration calorimetry (ITC) indicate that KAP8.1 binds to the head domain of K85, which is helically aligned around the axis of the intermediate filament (IF).
    - reference_id: PMID:30125694
      supporting_text: we generated a monoclonal antibody against human KAP8.1 to analyze the protein's roles and distribution in the human hair shaft
    - reference_id: file:human/KRTAP8-1/KRTAP8-1-deep-research-openscientist.md
      supporting_text: The direct binding evidence is for the head domain of keratin K85
