  title: OpenScientist deep-research report on KRTAP8-1
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: DISPUTED
    review_notes: 'Checked against cached PubMed records. Verified quotes: K85 head-domain binding and orthocortex helical IF arrangement (PMID:23791804); discrete cortical localization, curvature role and cross-species linear epitope (PMID:30125694); three KAP classes and a single human KAP8 gene (PMID:25279319); HGT-KAP genes are the first KAP genes expressed (PMID:22044071); orthocortical-side HGT expression (PMID:17697142); IF-in-matrix composite (PMID:23135675). Disputed or over-stated: (1) desmoplakin ("bidirectional") binding is reported for some HGT KAPs, not shown for KAP8.1 in the abstract; (2) the abstract says the binding contributes to mechanical robustness, not shape directly; (3) mouse Krtap16 is called orthologous, but Krtap16 is a separate HGT family and only the gene domain is orthologous to human 21q22.11 (PMID:15385554); (4) HOXC13 control of KRTAP8-1 is extrapolated from Krtap16 EMSA data and is not shown for this gene; (5) the AlphaFold claim of full intrinsic disorder (mean pLDDT 41) conflicts with spectroscopy and modelling of synthetic KAP8.1 as a compact PPII structure held by two disulfides (PMID:28289743), and low pLDDT is weak evidence for small cysteine-bridged proteins; (6) the ortholog alignment and aromatic-stacking adhesion model are the report''s own unverified analyses. The report does not state the species of the recombinant proteins in PMID:23791804. Used only as leads; no annotation rests on it alone.'
core_functions:
- description: 'KRTAP8-1 is a high glycine-tyrosine (HGT) KAP8 family keratin-associated protein that acts as a structural matrix component of the hair fibre: it is deposited between trichocyte keratin intermediate filaments in the keratinizing zone and becomes cross-linked to them, mainly through disulfide bonds (HS/UHS KAPs) or additional non-covalent interactions (HGT KAPs), giving the hair shaft its rigidity and resistance.'
