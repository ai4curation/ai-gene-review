core_functions:
- description: Catalytically competent DNMT3B transfers methyl groups from S-adenosylmethionine to DNA
    cytosines, contributing to the establishment of DNA methylation patterns. Human catalytic-domain assays
    show preferential CpG methylation with measurable CpA and CpT activity. Oligomeric interactions with
    regulatory partners shape this chemistry; the catalytic activity must not be assigned indiscriminately
    to truncated or catalytically inactive splice products. This methyl-transfer chemistry contributes
    to epigenetic gene repression; mouse promoter-methylation experiments and conditional human D4Z4/DUX4
    evidence support that role without assigning one silencing mechanism to every genomic locus.
  molecular_function:
    id: GO:0003886
    label: DNA (cytosine-5-)-methyltransferase activity
  locations:
  - id: GO:0005654
    label: nucleoplasm
  in_complex:
    id: GO:0140020
    label: DNA methyltransferase complex
  supported_by:
  - reference_id: PMID:32083663
    supporting_text: 12- or 30-fold higher activity for CpG over CpA or CpT sites, respectively
  - reference_id: GO_REF:0000052
  - reference_id: PMID:22133874
  - reference_id: PMID:27153398
  directly_involved_in:
  - id: GO:0045814
    label: negative regulation of gene expression, epigenetic
- description: The catalytically inactive DNMT3B3 product binds the nucleosome acidic patch and anchors
    a DNMT3A-containing methyltransferase complex to chromatin. This positions the active DNMT3A subunits
    toward linker DNA. Human-protein reconstitution, structural contacts and cellular anchoring-mutant
    experiments support a targeting role distinct from DNMT3B catalytic chemistry.
  molecular_function:
    id: GO:0031491
    label: nucleosome binding
  locations:
  - id: GO:0000785
    label: chromatin
  in_complex:
    id: GO:0140020
    label: DNA methyltransferase complex
  supported_by:
  - reference_id: PMID:32968275
    supporting_text: 'The catalytic-like domain of the

      accessory DNMT3B3 binds to the acidic patch of the nucleosome core'
suggested_questions:
- question: In the ZHX1 and hPc2 repression systems, which DNA-binding transcription factor recruits DNMT3B
    at the endogenous target locus, and does the recruitment direction meet the current GO corepressor
    definition?
- question: Which of the remaining sequence-defined natural DNMT3B products have catalytic activity or
    chromatin-targeting roles comparable to the authenticated DNMT3B3 accessory product?
- question: How do native DNMT3B/DNMT3L and DNMT3A/DNMT3B3 assemblies distribute across nucleoplasmic
    and chromatin-bound pools in relevant human cell types?
suggested_experiments:
- hypothesis: DNMT3B repression in the ZHX1/CBX4 systems depends on a defined locus-specific recruitment
    interface.
  description: Use endogenous tagging, reciprocal domain-selective perturbation and locus-resolved occupancy
    assays to distinguish DNMT3B recruitment by a DNA-binding factor from repression after artificial
    DNA tethering. Measure methylation and transcription separately.
  experiment_type: Endogenous recruitment and separation-of-function analysis
- hypothesis: Sequence-defined natural splice products have separable catalytic and nucleosome-targeting
    capacities.
  description: Express sequence-verified natural products, measure methylation on matched naked DNA and
    nucleosomes, and test complex formation with DNMT3A and DNMT3L under controlled stoichiometry. Include
    inactive DNMT3B3 as an accessory-function comparator.
  experiment_type: Product-resolved biochemical reconstitution
