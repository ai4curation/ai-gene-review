id: Q9UBC3
gene_symbol: DNMT3B
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: DNMT3B is a nuclear DNA cytosine-5 methyltransferase that helps establish DNA methylation
  patterns and regulate gene expression. Catalytically competent forms prefer CpG sites but also methylate
  non-CpG cytosines under tested conditions. Association with DNMT3L, other DNA methyltransferases and
  chromatin regulators influences activity and targeting. A distinct, catalytically inactive splice product,
  DNMT3B3, binds the nucleosome acidic patch and positions DNMT3A-containing complexes on chromatin. DNMT3B-dependent
  methylation contributes to repeat stability and transcriptional silencing; pathogenic variants cause
  a subset of immunodeficiency, centromeric instability and facial anomalies syndrome. Context-specific
  positive effects on gene expression are also reported. DNMT3B also helps maintain epigenetic repression
  of D4Z4 repeats. Hypomorphic variants can contribute to somatic DUX4 derepression and digenic facioscapulohumeral
  muscular dystrophy type 4 when repeat length and a permissive chromosome 4 haplotype provide the required
  genetic context.
alternative_products:
- name: '1'
  id: Q9UBC3-1
  description: Displayed 853-residue product. The human catalytic construct in PMID:32083663 maps to residues
    571–853 with an N-terminal GHM remnant in PDB 6KDA; it is not the full-length protein.
- name: '2'
  id: Q9UBC3-2
  sequence_note: VSP_005637
  description: 833 residues; lacks displayed-sequence residues 356–375. The sequence is independently
    reconstructed, but distinct activity and localization are not assigned from this deletion alone.
- name: '3'
  id: Q9UBC3-3
  sequence_note: VSP_005637, VSP_005638
  description: 770 residues; lacks displayed-sequence residues 356–375 and 745–807. The full deposited
    DNMT3B3 sequence in PDB 6PA7 exactly matches this product. PMID:32968275 establishes catalytically
    inactive nucleosome anchoring in a DNMT3A complex, not biological inactivity.
- name: '4'
  id: Q9UBC3-4
  sequence_note: VSP_005637, VSP_005639, VSP_005640
  description: 724 residues; lacks residues 356–375 and 745–853 and replaces displayed Arg744 with serine.
    No product-specific activity is inferred solely from the shortened sequence. UniProt predicts that
    this product is probably nonfunctional because two conserved methyltransferase motifs are missing;
    this is a curated sequence-based prediction, not a direct assay of all catalytic or accessory functions.
- name: '5'
  id: Q9UBC3-5
  sequence_note: VSP_005637, VSP_005641
  description: 792 residues; lacks residues 356–375 and has a distinct carboxyl terminus replacing residues
    768–853. Its functional equivalence to the displayed product remains unestablished in the inspected
    experiments. UniProt predicts that this product is probably nonfunctional because two conserved methyltransferase
    motifs are missing; this is a curated sequence-based prediction, not a direct assay of all catalytic
    or accessory functions.
- name: '6'
  id: Q9UBC3-6
  sequence_note: VSP_005636, VSP_005637
  description: 845 residues; combines an alternative amino-terminal sequence with deletion of residues
    356–375. Historical isoform names are not used to assign activity without sequence authentication.
- name: '7'
  id: Q9UBC3-7
  sequence_note: VSP_045874, VSP_005637, VSP_045876
  description: 694 residues; lacks displayed residues 69–144, 356–375 and 744–806. A historical 694-residue
    construct or an aberrant transcript named DNMT3B7 is not this product merely because of its length
    or name.
- name: '8'
  id: Q9UBC3-8
  sequence_note: VSP_045875, VSP_005637, VSP_045876
  description: 728 residues; lacks displayed residues 103–144, 356–375 and 744–806. Its exact sequence
    is verified; product-specific biochemical function remains unassigned.
