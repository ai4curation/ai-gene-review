id: Q9ULF5
gene_symbol: SLC39A10
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  SLC39A10 (ZIP10) is a member of the ZIP (Zrt-/Irt-like protein, SLC39A) family
  of metal transporters and belongs to the LIV-1 subfamily, which carries a
  PrP-like N-terminal ectodomain. It is a multi-pass plasma-membrane protein that
  mediates zinc influx, importing Zn(2+) from the extracellular space into the
  cytosol. ZIP10 forms a heteromer with its closest paralog ZIP6 (SLC39A6); the
  ZIP6/ZIP10 unit raises cytosolic zinc, which inactivates GSK-3 and represses
  E-cadherin, driving epithelial-to-mesenchymal transition and cell migration,
  and supplies the zinc signal that triggers entry into mitosis. In the kidney
  ZIP10 is located at the apical membrane of proximal tubules and the collecting
  duct, consistent with a role in renal zinc handling. ZIP10 also supports mature
  B-cell maintenance and humoral immune responses, and is up-regulated in several
  breast cancers where its zinc-transport activity promotes invasive behavior.
