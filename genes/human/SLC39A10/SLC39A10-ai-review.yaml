  review:
    summary: >-
      Direct functional evidence in human MCF-7 cells and zebrafish embryos that
      ZIP10 promotes EMT and cell migration, acting through its zinc-transport
      activity to inactivate GSK-3 and down-regulate E-cadherin (CDH1).
