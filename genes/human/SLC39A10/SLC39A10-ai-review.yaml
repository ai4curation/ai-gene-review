core_functions:
- description: >-
    Plasma-membrane zinc influx: ZIP10 imports Zn(2+) from the extracellular
    space into the cytosol at the cell surface, including the apical membrane of
    renal proximal tubules. It functions as the core zinc importer of the
    LIV-1 ZIP subfamily and can act together with ZIP6 as a heteromeric
    zinc-transport unit.
