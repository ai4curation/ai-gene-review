- term:
    id: GO:0008160
    label: protein tyrosine phosphatase activator activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q6P5F6
  - ensembl:ENSMUSP00000027131
  review:
    summary: >-
      Electronic transfer from the mouse ortholog of a 'protein tyrosine
      phosphatase activator activity' molecular function. ZIP10 is a zinc
      transporter; any effect on phosphatases is an indirect consequence of
      changing cytosolic zinc, not a direct enzymatic/activator molecular
      function of the transporter.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Attributing a direct protein-tyrosine-phosphatase activator molecular
      function to a membrane zinc transporter conflates a downstream
      zinc-signaling effect with a direct activity performed by the gene product.
      The transporter does not itself bind and activate a phosphatase; it moves
      zinc, and cytosolic zinc generally modulates (predominantly inhibits)
      protein tyrosine phosphatases. Marked as over-annotation rather than removed
      because the underlying zinc-signaling link is not fabricated, only
      mis-assigned as a direct MF.
