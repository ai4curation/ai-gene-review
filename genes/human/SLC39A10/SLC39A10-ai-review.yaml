suggested_questions:
- question: >-
    Does human ZIP10 transport zinc by an electroneutral Zn(2+)/bicarbonate
    symport mechanism, as shown for its paralogs ZIP8 and ZIP14, or by a distinct
    mechanism?
- question: >-
    What is the physiological division of labor between ZIP10 homodimers and the
    ZIP6/ZIP10 heteromer, and in which tissues/processes does each predominate?
suggested_experiments:
- description: >-
    Measure the counter-ion dependence of human ZIP10-mediated Zn(2+) uptake
    (bicarbonate dependence, electrogenicity) in Xenopus oocytes or a controlled
    cell system to test the cation:bicarbonate symporter mechanism directly for
    ZIP10.
- description: >-
    Use ZIP10-specific loss-of-function (knockout/degron) with quantitative
    zinc-flux and phospho-GSK-3 / E-cadherin readouts to determine whether ZIP10's
    role in EMT requires the ZIP6/ZIP10 heteromer and the extent of redundancy
    with ZIP6.
