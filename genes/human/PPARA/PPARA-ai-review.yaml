id: Q07869
gene_symbol: PPARA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: PPARA encodes the lipid-activated nuclear receptor PPAR-alpha, a RXR-heterodimeric transcription factor
  that binds PPAR response elements in regulatory DNA to coordinate fatty-acid transport, beta-oxidation, ketogenesis
  and lipoprotein metabolism. It is most prominent in liver and other oxidative tissues, where endogenous lipid ligands
  and hypolipidemic fibrate drugs activate a nuclear transcriptional program that links fasting or lipid exposure to
  fatty-acid catabolism and metabolic homeostasis.
