  supported_by:
  - reference_id: PMID:10748115
    supporting_text: An initial signaling event following activation of the B cell antigen receptor is phosphorylation of the CD79a (Ig-alpha) ITAM by Lyn, a Src family protein-tyrosine kinase.
- description: Same tyrosine kinase phosphorylating inhibitory ITIM tyrosines of co-receptors (CD22, FcgammaRIIB, PIR-B/LILRB3, SIRPA), creating docking sites that recruit the phosphatases SHP-1/SHP-2 and SHIP-1 to dephosphorylate signalling intermediates and down-regulate immunoreceptor signalling
