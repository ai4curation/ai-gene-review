    reason: LYN is a non-receptor Src-family tyrosine kinase. PMID:23555801 uses LYN constructs and discusses
      its BANK1/IP3R context, while its principal new activation experiments concern BLK. Retention of
      the LYN catalytic function also rests on independent biochemical characterization, not on relabeling
      the BLK result as a LYN assay.
