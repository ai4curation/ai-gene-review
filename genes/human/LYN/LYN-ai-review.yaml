  review:
    summary: Plasma membrane (cytoplasmic face) - the principal functional location of LYN.
    action: ACCEPT
    reason: The curated human record places lipid-anchored LYN at the cytoplasmic face of the cell membrane.
      PMID:32958780 uses mouse Lyn cDNA with human CD36/DHHC5 in heterologous experiments and mouse adipocyte
