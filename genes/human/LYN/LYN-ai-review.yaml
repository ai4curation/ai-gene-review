core_functions:
- description: Src-family (non-receptor) tyrosine kinase that phosphorylates activating ITAM tyrosines of clustered immunoreceptors (B-cell receptor subunits CD79A/CD79B, FcepsilonRI beta/gamma, FcgammaR), generating phosphotyrosine docking sites that recruit and activate SYK to initiate downstream signalling
