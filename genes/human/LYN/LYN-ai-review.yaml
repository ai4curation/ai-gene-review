id: P07948
gene_symbol: LYN
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'LYN is a cytoplasmic (non-receptor) protein-tyrosine kinase of the Src family (EC 2.7.10.2),
  expressed mainly in B-lymphoid, myeloid, mast, platelet and erythroid lineages, with two splice isoforms
  (p56/LynA and p53/LynB). It has the canonical Src architecture: an N-terminal SH4 region that is N-myristoylated
  at Gly2 and S-palmitoylated at Cys3, a unique region, SH3 and SH2 domains, a tyrosine-kinase domain,
  and a C-terminal regulatory tail. Lipidation anchors LYN to the cytoplasmic face of the plasma membrane
  and enriches it in cholesterol/sphingolipid rafts, where it carries out its principal function; newly
  synthesized LYN traffics through the Golgi, and a secondary nuclear pool participates in the genotoxic-stress
  response. LYN catalyses ATP-dependent phosphorylation of tyrosine residues in protein substrates and
  is autoinhibited by an intramolecular SH2-clamp onto C-terminal phospho-Tyr508 (added by CSK/CHK); activation-loop
  Tyr397 autophosphorylation and CD45-mediated dephosphorylation of Tyr508 promote the active state. Functionally,
  LYN is a receptor-proximal signalling switch acting downstream of immunoreceptors (the B-cell receptor
  via CD79A/CD79B, FcepsilonRI, FcgammaR, CD19, CD22) and of cytokine and growth-factor receptors (KIT,
  EPOR, MPL, CSF2RB, CXCR4). It phosphorylates activating ITAM motifs to create docking sites for SYK
  and propagate signalling (PI3K-AKT, BTK-PLCgamma, calcium, MAPK), and it phosphorylates inhibitory ITIM
  motifs of co-receptors (CD22, FcgammaRIIB, PIR-B, SIRPA) to recruit the phosphatases SHP-1, SHP-2 and
  SHIP-1, thereby restraining signalling. This dual activating/inhibitory role makes LYN both an initiator
  and a terminator of immune-cell signalling and a key enforcer of immune self-tolerance; gain-of-function
  variants that abolish Tyr508 regulation cause a constitutively active-kinase autoinflammatory vasculitis
  and liver-fibrosis syndrome.'
