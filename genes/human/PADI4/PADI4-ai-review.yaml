id: Q9UM07
gene_symbol: PADI4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: PADI4 is a calcium-dependent protein-arginine deiminase with prominent nuclear histone substrates. It citrullinates H3 and H4 arginines to antagonize arginine methylation and alter chromatin state, and in neutrophils its nuclear histone hypercitrullination promotes chromatin decondensation, nuclear-envelope rupture, and neutrophil extracellular trap release.
