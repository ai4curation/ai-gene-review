- id: PMID:29606301
  title: Absence of CFAP69 Causes Male Infertility due to Multiple Morphological Abnormalities of
    the Flagella in Human and Mouse.
  findings:
  - statement: CFAP69 localizes to the midpiece of human sperm and is absent from patient sperm;
      patient sperm lose SPEF2 staining.
    supporting_text: In sperm from control individuals, we observed CFAP69 concentrated in the midpiece
      of the sperm flagellum
  - statement: Cfap69 knockout males are infertile with immotile MMAF sperm and globally disorganized
      flagellar components.
    supporting_text: no sperm were observed to be motile in Cfap69 mutant samples
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached. Human patient genetics, sperm immunostaining and mouse knockout
      analysis read. The authors note that no CFAP69 protein partner had been confirmed and that
      the midpiece pattern argues against a core axonemal location in sperm.
- id: PMID:30415212
  title: Novel homozygous CFAP69 mutations in humans and mice cause severe asthenoteratospermia with
    multiple morphological abnormalities of the sperm flagella.
  findings:
  - statement: Homozygous loss-of-function CFAP69 variants in two MMAF men and an MMAF phenotype
      in Cfap69 knockout mice.
    supporting_text: male Cfap69-knockout mice manifested with MMAF phenotypes
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract only in cache. The abstract states the human variants and the mouse knockout
      phenotype; the localization and ultrastructure data behind the MGI annotations are in the full
      text, which was not seen.
- id: PMID:28495971
  title: Cilia- and Flagella-Associated Protein 69 Regulates Olfactory Transduction Kinetics in Mice.
  full_text_unavailable: true
  findings:
  - statement: Mouse CFAP69 is enriched in OSN cilia, and its loss speeds the on and off kinetics
      of odor responses.
    supporting_text: OSNs lacking CFAP69, remarkably, displayed faster kinetics in both the on and
      off phases of electrophysiological responses
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract only in cache. This is the primary source for the olfactory annotations
      transferred from mouse. The data are mouse only.
- id: PMID:34083607
  title: Composition and function of the C1b/C1f region in the ciliary central apparatus.
  findings:
  - statement: Tetrahymena Cfap69 co-purifies with Spef2A, Cfap246 and Adgb, and its knockout loses
      the C1b central-apparatus projection.
    supporting_text: Note a lack of a large C1b projection in CFAP69-KO and SPEF2A-coDel mutants
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text cached. These are Tetrahymena data. The mammalian intra-axonemal location
      of CFAP69 has not been determined, so no central-apparatus annotation is proposed for the human
      protein.
- id: PMID:37392306
  title: A novel variant in CFAP69 causes asthenoteratozoospermia with treatable ART outcomes and
    a literature review.
  full_text_unavailable: true
  findings:
  - statement: An additional CFAP69 frameshift variant was found in an MMAF patient, with reduced
      CFAP69 in sperm.
    supporting_text: We identified a novel frameshift variant in CFAP69
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Abstract only in cache. Corroborative human genetics.
core_functions:
- description: CFAP69 is required during spermiogenesis for building a normal sperm flagellum. It
    is concentrated in the flagellar midpiece of human sperm, and without it all flagellar components,
    including the axoneme, outer dense fibres and mitochondrial sheath, are disorganized, SPEF2 is
    lost from the flagellum and sperm are immotile. Its molecular activity is not defined. The armadillo-repeat
    fold and the Tetrahymena data, in which Cfap69 forms part of the SPEF2-containing C1b central-apparatus
    projection, suggest a structural or scaffolding role, but this has not been shown for the mammalian
    protein.
