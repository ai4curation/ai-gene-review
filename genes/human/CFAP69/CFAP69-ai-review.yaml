- term:
    id: GO:1902093
    label: positive regulation of flagellated sperm motility
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:2443778
  - PANTHER:PTN001027662
  review:
    summary: Loss of Cfap69 abolishes sperm motility because the flagellum fails to form. That is
      evidence for a role in motility and flagellum assembly, not in positive regulation of motility.
    action: MODIFY
    reason: The mouse source annotation rests on Cfap69 knockout males whose sperm are completely
      immotile and malformed (PMID:29606301). In those sperm all flagellar components are disorganized,
      so the motility loss follows from failed flagellum development. Nothing shows CFAP69 tuning
      the rate or extent of motility of an otherwise intact flagellum. A regulatory role is documented
      only in olfactory cilia, where CFAP69 dampens transduction kinetics, and that does not transfer
      to sperm. The correct claim is the non-regulatory parent process flagellated sperm motility
      (GO:0030317), which the gene already carries by IMP.
    supported_by:
    - *id005
    - *id006
    proposed_replacement_terms:
    - id: GO:0030317
      label: flagellated sperm motility
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - ROLE_CONFLATION
      source_entities:
      - source_id: PANTHER:PTN001027662
        source_status: UNRESOLVED
        comment: Node placement not reconstructed. The family-level inheritance of a sperm-flagellar
          role is not disputed; the issue is the regulatory scoping of the term.
      - source_id: MGI:MGI:2443778
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: Mouse Cfap69 knockout sperm are immotile because the flagellum is malformed. That
