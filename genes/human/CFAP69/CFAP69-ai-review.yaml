id: A5D8W1
gene_symbol: CFAP69
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CFAP69 is a cilium- and flagellum-associated protein of about 940 residues that is built
  largely from armadillo-like alpha-helical repeats and has no recognized catalytic domain. In human
  sperm it is concentrated in the midpiece of the flagellum, and it is required during spermiogenesis
  for assembly of a normal flagellum. Loss of CFAP69 in men and mice causes multiple morphological
  abnormalities of the sperm flagellum, with disorganized axonemal and peri-axonemal structures,
  loss of the flagellar protein SPEF2 and immotile sperm. In the ciliate Tetrahymena the orthologue
  is part of the C1b projection of the ciliary central apparatus, together with SPEF2 and androglobin
  homologues. In mouse olfactory sensory neurons CFAP69 is enriched in the non-motile olfactory cilia,
  where it slows the activation and termination kinetics of the odor response without being needed
  for cilium structure.
