- term:
    id: GO:1905516
    label: positive regulation of fertilization
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q8BH53
  - ensembl:ENSMUSP00000053206
  review:
    summary: Male infertility of Cfap69 knockout mice is a downstream consequence of absent functional
      flagella.
    action: MARK_AS_OVER_ANNOTATED
    reason: Cfap69 knockout males cannot sire offspring although mating behavior is normal (PMID:29606301).
      The cause is MMAF sperm that cannot swim. CFAP69 has no known role in gamete interaction or
      fertilization itself; 'positive regulation of fertilization' re-describes the infertility phenotype
      of a flagellar-assembly defect. It is not entirely wrong, since fertilization fails without
      CFAP69, but it over-annotates an indirect, pleiotropic effect. The specific processes are already
      captured by sperm axoneme assembly and flagellated sperm motility.
    supported_by:
    - &id007
      reference_id: PMID:29606301
      supporting_text: Cfap69 knockout male mice failed to produce any offspring over 3 months of
        breeding
