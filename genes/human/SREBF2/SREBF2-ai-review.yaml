core_functions:
- description: Nuclear SREBF2 (the released bHLH-Zip N-terminal domain) is a sequence-specific RNA polymerase
    II transcription activator. It binds sterol regulatory elements and activates the genes for cholesterol
    biosynthesis and LDL receptor-mediated uptake, increasing cellular cholesterol synthesis.
  molecular_function:
    id: GO:0001228
    label: DNA-binding transcription activator activity, RNA polymerase II-specific
  directly_involved_in:
  - id: GO:0045542
    label: positive regulation of cholesterol biosynthetic process
  - id: GO:0032933
    label: SREBP signaling pathway
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:7903453
    supporting_text: In vitro SREBP-2 bound SRE-1 with the same specificity as SREBP-1a. In vivo it mimicked
      SREBP-1a in activating transcription of reporter genes containing SRE-1.
  - reference_id: PMID:12177166
    supporting_text: cholesterogenic genes containing classic SREs in their promoters are strongly and
      efficiently activated by both SREBP-1a and SREBP-2, but not by SREBP-1c
  - reference_id: PMID:11994399
    supporting_text: SREBP-2 preferentially activates the LDL receptor gene and various genes required
      for cholesterol synthesis
  - reference_id: PMID:8674110
    supporting_text: The liberated NH2-segment enters the nucleus and activates genes controlling cholesterol
      synthesis and uptake.
- description: The membrane-bound SREBF2 precursor is the cargo and sensor output of the sterol-regulated
    ER-to-Golgi checkpoint. Its C-terminal domain binds SCAP, forming the SREBP-SCAP complex, which INSIG
    retains in the ER membrane when sterols are high. When sterols are low, the complex moves to the Golgi
    membrane for S1P/S2P cleavage.
  directly_involved_in:
  - id: GO:0032933
    label: SREBP signaling pathway
  locations:
  - id: GO:0005789
    label: endoplasmic reticulum membrane
  - id: GO:0000139
    label: Golgi membrane
  in_complex:
    id: GO:0032936
    label: SREBP-SCAP complex
  supported_by:
  - reference_id: PMID:9242699
    supporting_text: Co-immunoprecipitation experiments show that SCAP and SREBP-2 form a complex that
      can be precipitated with antibodies to either component.
  - reference_id: PMID:12202038
    supporting_text: In sterol-depleted cells, SCAP escorts SREBPs from ER to Golgi for proteolytic processing,
      thereby allowing SREBPs to stimulate cholesterol synthesis.
  - reference_id: PMID:12242332
    supporting_text: The coimmunoprecipitation experiment of Fig. 3 B confirms that insig-2 binds to the
      SCAP/SREBP-2 complex only in the presence of sterols.
  - reference_id: PMID:8674110
    supporting_text: The first, regulated by sterols, occurs in the lumenal loop. The second, not regulated
      by sterols, occurs within the first transmembrane domain.
suggested_questions:
- question: How is SREBP-2 processing kept sterol-sensitive while SREBP-1a processing escapes sterol control
    in fatty-acid-depleted cells, if both are carried by the same SCAP?
- question: Does nuclear SREBP-2 repress genes such as ABCA1 and LRP1 directly through E-box binding in
    vivo, or are these effects mainly secondary to changes in sterol status and LXR activity?
- question: Should the substrate role of SREBF2 in S1P/S2P-mediated regulated intramembrane proteolysis
    be captured as has_input on the protease activities in GO-CAM, rather than as a process annotation
    on SREBF2?
suggested_experiments:
- hypothesis: SREBP-2 repression of ABCA1 and LRP1 is a direct, E-box-dependent activity of the nuclear
    form.
  description: In endothelial and vascular smooth muscle cells with endogenous SREBF2 replaced by DNA-binding-dead
    or SRE-only (bHLH tyrosine-to-arginine) variants, combine CUT&RUN for nuclear SREBP-2 with promoter
    E-box editing and nascent-transcript measurement, holding cellular sterol constant with LXR agonist/antagonist
    controls.
  experiment_type: Genome editing with chromatin occupancy and nascent transcription assays
