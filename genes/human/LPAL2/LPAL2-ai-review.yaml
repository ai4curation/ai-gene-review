- id: PMID:7749817
  title: Loss of a splice donor site at a 'skipped exon' in a gene homologous to apolipoprotein(a)
    leads to an mRNA encoding a protein consisting of a single kringle domain.
  findings:
  - statement: >-
      A human liver transcript of apo(a)-related gene C was predicted to encode a
      132-amino-acid polypeptide with a secretion signal and one kringle domain.
    supporting_text: >-
      We have isolated the human liver transcript derived from one of these genes,
      designated apo(a)-related gene C, that encodes a polypeptide of 132 amino
      acids composed of a secretion signal and a single kringle domain.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  - statement: >-
      Loss of a canonical splice donor causes exon skipping, a coding-frame shift,
      and premature stop codons in the derived transcript.
    supporting_text: >-
      Analysis of genomic sequence shows that the predicted exon at this site
      lacks a canonical splice donor site. This results in "exon skipping" during
      maturation of the mRNA, causing a coding frame shift and the presence of
      premature stop codons.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The identifier, title, and quoted abstract text are verified in the cached
      PubMed record. This supports a transcript-derived historical 132-residue ORF
      model and the disabling splice defect, not experimental detection of an
      endogenous LPAL2 protein.
- id: PMID:36010685
  title: LPAL2 Suppresses Tumor Growth and Metastasis of Hepatocellular Carcinoma by
    Modulating MMP9 Expression.
  findings:
  - statement: >-
      This study explicitly treats LPAL2 as a pseudogene-derived lncRNA and found
      it downregulated in hepatocellular carcinoma tissues.
    supporting_text: >-
      In the current study, we found that the pseudogene-derived lncRNA LPAL2 is
      downregulated in hepatocellular carcinoma (HCC) tissues, and further showed
      that elevated LPAL2 expression is positively correlated with survival
      outcome.
    full_text_unavailable: false
    reference_section_type: ABSTRACT
  - statement: >-
      LPAL2 RNA depletion in hepatoma cells increased growth, migration, and
      invasion.
    supporting_text: >-
      We found that the knockdown of LPAL2 in HA22T and Huh7 cell lines accelerated
      cell growth, migration, and invasion
    full_text_unavailable: false
    reference_section_type: RESULTS
  - statement: >-
      MMP9 RNA and protein increased in LPAL2-depleted hepatoma cells.
    supporting_text: >-
      Furthermore, MMP9 mRNA and protein were upregulated in LPAL2-depleted HA22T
      and Huh7 cell lines
    full_text_unavailable: false
    reference_section_type: RESULTS
  - statement: >-
      The authors' synthesis is that LPAL2 acts as a tumor-suppressor lncRNA in
      hepatocellular carcinoma.
    supporting_text: >-
      Our collective results indicate that LPAL2 acts as a tumor-suppressor lncRNA
      in HCC.
    full_text_unavailable: false
    reference_section_type: DISCUSSION
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The PMID, title, and findings are verified against cached full text. The work
      is direct functional evidence for an LPAL2 noncoding RNA in an HCC model; it
      is not evidence for Q16609 protein existence and must not be converted into
      protein-centric GO annotations.
