      human liver.
    supporting_text: >-
      Hybridization analysis and reverse transcriptase polymerase chain reaction
      showed that one of these novel genes, designated apolipoprotein(a)rg-C, has
      a domain structure similar to apolipoprotein(a) and is transcribed in human
