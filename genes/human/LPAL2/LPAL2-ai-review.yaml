core_functions: []
knowledge_gaps:
- gap_statement: >-
    It is unknown whether any LPAL2 transcript produces a stable endogenous
    polypeptide corresponding to Q16609 or another open reading frame.
  boundary: >-
    Liver transcription is established, and one historical transcript contains a
    predicted 132-residue signal-peptide-plus-kringle ORF. The same transcript
    study documents exon skipping, a frameshift, and premature stop codons;
    current transcript models are truncated and NMD candidates, and UniProt rates
    Q16609 protein existence as uncertain.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: >-
    Product-existence evidence is prerequisite to assigning any protein molecular
    function, localization, or interaction to LPAL2.
  resolution: >-
    Demonstrate endogenous translation and a stable product with transcript-
    resolved ribosome profiling, targeted mass spectrometry using unique peptides,
    and an independently validated endogenous antibody, including NMD and
    pseudogene-negative controls.
  provenance:
  - reference_id: PMID:7749817
    supporting_text: >-
      This results in "exon skipping" during maturation of the mRNA, causing a coding frame shift and the presence of premature stop codons.
  - reference_id: file:human/LPAL2/LPAL2-uniprot.txt
    supporting_text: 'PE   5: Uncertain;'
- gap_statement: >-
    The direct molecular mechanism by which LPAL2 RNA alters MMP9 transcription
    and hepatocellular-carcinoma phenotypes is unknown.
  boundary: >-
    LPAL2 depletion increases MMP9 RNA and protein and promotes growth, migration,
    invasion, sphere formation, and doxorubicin resistance in hepatoma models,
    but no RNA-binding protein, RNA target, chromatin site, or causal intermediate
    has been established.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: >-
    Without a direct RNA mechanism, the observed phenotypes cannot be represented
    as a precise core molecular activity or distinguished confidently from
    indirect perturbation effects.
  resolution: >-
    Combine endogenous LPAL2 perturbation and RNA-only rescue with RNA-protein and
    RNA-chromatin interaction mapping, then test candidate intermediates and MMP9
    promoter effects by epistasis.
  provenance:
  - reference_id: PMID:36010685
    supporting_text: >-
      The direct, transcriptional effects of LPAL2 on MMP9 expression should be fully addressed in future studies.
- gap_statement: >-
    The transcript isoform and structural RNA elements responsible for the
    reported lncRNA activity have not been resolved.
  boundary: >-
    LPAL2 has multiple truncated transcript variants, while the functional study
    perturbs LPAL2 RNA and attributes the phenotype to a pseudogene-derived lncRNA
    without establishing which transcript form or sequence element is sufficient.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: >-
    Isoform resolution is necessary to separate a reproducible RNA function from
    NMD-linked transcript abundance and from the historical Q16609 ORF model.
  resolution: >-
    Define full-length LPAL2 transcripts by long-read RNA sequencing and map NMD
    sensitivity, then perform isoform-specific loss-of-function and rescue with
    nontranslatable RNA constructs.
proposed_new_terms: []
suggested_questions:
- question: >-
    Is any LPAL2 transcript translated into a stable endogenous protein, or is
    Q16609 solely a conceptual product of the historical 132-residue ORF?
- question: >-
    Which LPAL2 transcript isoform and RNA structural elements are necessary and
    sufficient for the hepatocellular-carcinoma phenotypes?
- question: >-
    Does LPAL2 RNA regulate MMP9 directly at chromatin or through an RNA-binding
    protein, microRNA, transcript-stability, or signaling intermediate?
suggested_experiments:
- hypothesis: >-
    Endogenous LPAL2 transcripts are not translated into a stable Q16609-like
    protein.
  description: >-
    Perform transcript-resolved ribosome profiling and targeted parallel-reaction
    monitoring for peptides unique to the predicted LPAL2 ORF across liver and
    hepatocyte models, before and after NMD inhibition. Confirm any signal with an
    independently validated endogenous antibody and CRISPR disruption of the ORF
    without altering the candidate lncRNA promoter.
  experiment_type: endogenous translation and proteomics assay
- hypothesis: >-
    A specific noncoding LPAL2 transcript, rather than translation of its short
    ORF, mediates the observed tumor-suppressive phenotype.
  description: >-
    Resolve LPAL2 transcripts by long-read RNA sequencing, selectively deplete
    each isoform with junction-specific reagents, and rescue with matched wild-type
    and start-codon-disabled RNA constructs expressed at endogenous abundance.
    Measure growth, migration, invasion, MMP9 expression, and NMD sensitivity.
  experiment_type: isoform-resolved RNA loss-of-function and rescue
- hypothesis: >-
    LPAL2 RNA represses MMP9 transcription through a specific RNA-associated
    protein or chromatin interaction.
  description: >-
    Map endogenous LPAL2 RNA-protein contacts by orthogonal RNA pulldown and
    crosslinking methods and map RNA-chromatin occupancy at the MMP9 locus. Validate
    candidate partners with reciprocal binding, targeted depletion, and rescue,
    and measure nascent MMP9 transcription rather than steady-state RNA alone.
  experiment_type: lncRNA interactome and chromatin-mechanism analysis
- hypothesis: >-
    MMP9 induction is a causal mediator of the growth and invasion phenotypes
    observed after LPAL2 depletion.
  description: >-
    Combine LPAL2 depletion with MMP9 knockout or catalytic inhibition in multiple
    hepatoma lines, primary HCC organoids, and xenografts. Rescue LPAL2 with the
    validated noncoding transcript and test whether MMP9 epistasis separates
    invasion from proliferation, stemness, and doxorubicin-resistance phenotypes.
  experiment_type: genetic epistasis in HCC models
