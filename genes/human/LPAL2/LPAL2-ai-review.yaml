id: Q16609
gene_symbol: LPAL2
product_type: PSEUDOGENE
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  LPAL2 is a transcribed human pseudogene in the apolipoprotein(a)/plasminogen
  gene cluster. Its annotated transcripts contain truncated open reading frames
  and are candidates for nonsense-mediated decay. An early liver transcript
  defined a hypothetical 132-amino-acid product with a signal peptide and one
  kringle domain, represented by UniProt Q16609, but the splice-donor defect,
  frameshift, and premature stops underlying that model were identified at the
  RNA level; no stable endogenous LPAL2 protein has been demonstrated, and
  UniProt assigns protein-existence level 5. LPAL2 transcripts have been studied
  as pseudogene-derived long noncoding RNAs. In hepatocellular carcinoma models,
  LPAL2 RNA is reduced in tumors, its depletion promotes growth, migration,
  invasion, stem-like phenotypes, and doxorubicin resistance, and depletion
  increases MMP9 expression; the direct RNA mechanism remains unresolved. The
  single-kringle homology does not establish lipoprotein(a) particle assembly,
  lipid transport, plasminogen regulation, protease activity, or any other LPA-
  or plasminogen-derived protein function.
existing_annotations:
- term:
    id: GO:0005576
    label: extracellular region
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0243
  review:
    summary: >-
      Marked as over-annotated. A predicted signal peptide would route the
      historical 132-residue ORF to the secretory pathway if translated, but no
      stable endogenous LPAL2 protein has been demonstrated.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The SL-0243 mapping faithfully propagates UniProt's predicted "Secreted"
      statement, and PMID:7749817 derives a secretion signal from a transcript ORF.
      However, current NCBI/HGNC classification treats LPAL2 as a pseudogene whose
      transcript ORFs are truncated and candidates for nonsense-mediated decay;
      PMID:7749817 reports a splice-donor defect, exon skipping, a frameshift, and
      premature stops rather than endogenous protein detection. UniProt assigns
      Q16609 protein-existence level 5 and cautions that it may be a pseudogene
      product. Thus extracellular localization is conditionally plausible for an
      experimentally expressed ORF but overstates the evidence for the endogenous
      gene product. It remains unsuitable as a core function and does not imply
      any LPA particle, plasminogen, or protease biology.
    supported_by:
    - reference_id: PMID:7749817
      supporting_text: >-
        This results in "exon skipping" during maturation of the mRNA, causing a coding frame shift and the presence of premature stop codons.
    - reference_id: file:human/LPAL2/LPAL2-uniprot.txt
      supporting_text: Could be the product of a pseudogene.
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:25416956
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q08AM6
  review:
    summary: >-
      Marked as over-annotated: the source is a proteome-scale binary-interaction
      map and the normalized row records VAC14 as the partner, but generic protein
      binding is uninformative and physiological relevance is not established.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The IPI annotation is retained with curator deference to the experimental
      screen, but it should not be interpreted as a core activity. LPAL2 is a
      short, putatively secreted single-kringle precursor, whereas VAC14 is an
      intracellular phosphoinositide-regulatory scaffold; the cached paper does
      not discuss LPAL2 or validate this pair in a physiological compartment.
      A high-throughput binary contact neither supplies a more informative
      molecular-function term nor supports transfer of apo(a)/plasminogen biology.
    supported_by:
    - reference_id: PMID:25416956
      supporting_text: >-
        Here, we describe a systematic map of ?14,000 high-quality human binary protein-protein interactions.
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:32814053
  qualifier: enables
  supporting_entities:
  - UniProtKB:O00291
  - UniProtKB:O94985-2
  - UniProtKB:P06307
  - UniProtKB:P55212
  - UniProtKB:P62826
  review:
    summary: >-
      Marked as over-annotated: five high-throughput candidate interactions are
      collapsed into this normalized protein-binding row, but none establishes a
      defining molecular activity of LPAL2.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Live QuickGO records HIP1, CLSTN1 isoform 2, CCK, CASP6, and RAN as the five
      WITH/FROM partners. The source is a systematic yeast two-hybrid interactome
      focused on neurodegenerative-disease proteins, and the cached abstract does
      not discuss LPAL2 or provide pair-specific orthogonal validation. Several
      partners are intracellular and therefore topologically difficult to
      reconcile with a signal-peptide-bearing putative secreted product; CCK may
      share an extracellular route, but the screen alone does not establish a
      physiological interaction. Curator deference argues against removing the
      IPI result, while the generic GO:0005515 term and pooled partner set should
      remain non-core and must not be used to infer LPA-like function.
    supported_by:
    - reference_id: PMID:32814053
      supporting_text: >-
        connects ∼5,000 human proteins via ∼30,000 candidate interactions and is generated by systematic yeast two-hybrid interaction screening
