suggested_questions:
- question: Does human PKD2L2 form an ion-conducting channel in its native membrane context, or does it
    primarily regulate other TRP channels?
suggested_experiments:
- description: Patch-clamp full-length human PKD2L2 with candidate TRPC partners in its native topology to
    test whether the protein conducts ions or modulates partner channels.
