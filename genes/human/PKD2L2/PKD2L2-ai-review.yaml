  label: Homo sapiens
description: 'PKD2L2 encodes a predicted multi-pass PKD2-like membrane protein, also called TRPP5. It is closely
  related to PKD2 and PKD2L1 but has not been shown to be a standalone human calcium channel, and current evidence
  leaves its physiological channel or channel-regulatory role unresolved.'
