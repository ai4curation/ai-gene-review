id: P10412
gene_symbol: H1-4
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Histone H1.4 is a replication-dependent nuclear linker histone encoded in the chromosome
  6p22.2 histone cluster. It binds nucleosomal DNA and contributes to chromatin organization across compacted
  and transcriptionally active states. Post-translational modifications tune its chromatin association
  and regulatory contacts. Heterozygous C-terminal frameshift variants cause Rahman syndrome, a neurodevelopmental
  disorder in which overgrowth is variable.
