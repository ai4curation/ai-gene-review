description: ANKRD7 (ankyrin repeat domain-containing 7; TSA806) is a testis-specific ankyrin-repeat protein.
  Within the testis, Ankrd7 is expressed in Sertoli cells, where it is nuclear and appears as the cells
  mature. No molecular activity or biological role has been established.
