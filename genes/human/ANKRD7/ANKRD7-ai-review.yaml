knowledge_gaps:
- gap_statement: ANKRD7's molecular activity and biological role are unknown; it is a nuclear Sertoli-cell
    protein whose function has not been tested.
  boundary: Testis-specific expression, nuclear Sertoli-cell localization and maturation-dependent onset
    are reported. No loss-of-function, partner or activity study exists; PAN-GO assigns nothing, and PTHR24147
    has no annotated PAINT nodes.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: A nuclear Sertoli-cell protein appearing as Sertoli cells mature could contribute to their
    differentiation, but this is untested.
  resolution: Test Sertoli-cell maturation and fertility in Ankrd7 knockout mice, and identify ANKRD7
    nuclear partners.
