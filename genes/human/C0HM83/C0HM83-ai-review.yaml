- id: PMID:41883858
  title: Mediterranean diet adherence is associated with mitochondrial microproteins Humanin and
    SHMOOSE; potential role of the Humanin-Nox2 interaction in cardioprotection.
  findings:
  - statement: Independently states the ORF coordinates as m.12234-12410, matching the local sequence
      mapping.
    supporting_text: SHMOOSE is encoded by a small open reading frame (smORF) overlapping the serine
      tRNA region, between nucleotides 12,234 and 12,410
  reference_review:
