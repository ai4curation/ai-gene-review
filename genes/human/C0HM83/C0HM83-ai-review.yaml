- id: file:human/C0HM83/C0HM83-bioinformatics/RESULTS.md
  title: SHMOOSE ORF location and genetic-code check
  findings:
  - statement: The ORF maps to rCRS m.12234-12410 (+ sense), overlapping MT-TS2, MT-TL2 and the 5'
      end of MT-ND5 in another frame, and translates identically under the standard and vertebrate
      mitochondrial codes.
core_functions:
- description: >-
    SHMOOSE is a mitochondrial-DNA-encoded microprotein found in mitochondria, where its only
    reported partner is the MICOS core subunit mitofilin (IMMT). Its molecular activity is unknown:
    the binding, respiration and neuroprotection data come from adding synthetic peptide, and no
    loss-of-function test of the endogenous peptide exists, so no molecular function or process is
    asserted.
  locations:
  - id: GO:0005739
    label: mitochondrion
  supported_by:
  - reference_id: PMID:36127429
    supporting_text: Notably, following precipitation of SHMOOSE from neuronal mitochondria, two unique
      SHMOOSE-derived peptides were confidently identified using mass spectrometry
  - reference_id: PMID:36127429
    supporting_text: SHMOOSE bound the inner mitochondrial membrane mitofilin in multiple models including
      neuronal cells and dot blot
suggested_questions:
- question: Is SHMOOSE translated by mitochondrial or cytosolic ribosomes? Its codons read the same
    under both genetic codes, and its start codon lies within the tRNA-Ser(AGY) sequence, so
    translation would seem to require an RNA that escapes normal tRNA punctuation processing of the
    heavy-strand transcript. Which RNA species carries the intact ORF?
- question: Does endogenous SHMOOSE associate with mitofilin/MICOS, and on which side of the inner
    membrane? If so, does it change MICOS assembly or crista junction structure, which would support a
    more specific function term than protein binding?
- question: Is the nuclear signal real (imaging, protease protection, other antibodies), and how would a
    mitochondrially encoded peptide reach the nucleus?
- question: Is the Alzheimer disease association of m.12372G>A caused by the D47N peptide change rather
    than by linked haplogroup U variants or effects of the variant on the overlapping RNA?
suggested_experiments:
- description: Ribosome profiling of mitochondrial versus cytosolic ribosomes (or mitoribosome
    inhibitor sensitivity of endogenous peptide levels) to find where SHMOOSE is translated.
- description: Loss of function of the endogenous peptide, e.g. base editing of the start codon or
    an internal stop in cybrid or mtDNA-edited cells, choosing edits silent for MT-TS2/MT-TL2 and
    MT-ND5, followed by respirometry and cristae imaging.
- description: Cybrid lines that differ only at m.12372 (D47N), to separate the variant from its
    haplogroup background.
- description: Protease-protection and immuno-EM localisation of endogenous SHMOOSE, with co-IP of the
    endogenous peptide and MICOS subunits (MIC60, MIC19, MIC10).
