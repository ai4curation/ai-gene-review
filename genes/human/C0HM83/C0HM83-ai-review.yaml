  label: Homo sapiens
description: >-
  SHMOOSE (Small Human Mitochondrial ORF Over SErine tRNA) is a 58-aa microprotein encoded by a
  short open reading frame in human mitochondrial DNA. The ORF lies on the heavy-strand-encoded
  sense at m.12234-12410, overlapping the genes for tRNA-Ser(AGY) (MT-TS2) and tRNA-Leu(CUN)
  (MT-TL2) and the 5' end of MT-ND5 in a different reading frame. It contains no codons whose
  meaning differs between the standard and vertebrate mitochondrial genetic codes, so it encodes
  the same peptide whether translated by mitochondrial or cytosolic ribosomes, and the site of
  its translation is unknown. The peptide has a predicted N-terminal amphipathic helix, a
  disordered proline-rich C-terminal half and no recognisable mitochondrial targeting sequence.
  Endogenous SHMOOSE has been detected in neuronal mitochondrial and nuclear fractions (absent
  from cells lacking mtDNA), by mass spectrometry of peptides from mitochondria, and in
  cerebrospinal fluid. Synthetic SHMOOSE binds the MICOS core subunit mitofilin (IMMT/MIC60)
  and, when added to neuronal cells, increases basal oxygen consumption and protects against
  oligomeric amyloid-beta toxicity; these effects come from added peptide, and the role of the
  endogenous peptide has not been tested by loss of function. The m.12372G>A (rs2853499)
  haplogroup U marker changes Asp47 to Asn (D47N) and was associated with Alzheimer disease risk
  and brain imaging traits, but this association, which cannot separate the peptide from the
  overlapping mtDNA sequence and linked haplogroup variants, does not by itself establish what
  the peptide does.
existing_annotations:
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:36127429
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q16891
  review:
    summary: Binding of SHMOOSE to mitofilin (IMMT, Q16891), shown with synthetic peptide by IP-mass
      spectrometry from spiked lysate, reciprocal co-IP after treating cells with peptide, and dot blot
      with recombinant proteins. GOA carries the row twice (UniProt and IntAct).
    action: REMOVE
    reason: The interaction itself is reasonably supported (three methods in one study, plus siRNA
      against IMMT abolishing a peptide effect), but bare protein binding says nothing about what
      SHMOOSE does, and there is no informative MF term to replace it with. GO has no MICOS complex
      binding term, and the data do not show that SHMOOSE regulates MICOS assembly or crista
      organisation. All binding data use exogenous synthetic or recombinant peptide; no interaction
      of the endogenous peptide is shown. The interaction is recorded in the description, and a more
      specific term is a question for future work.
    supported_by:
    - reference_id: PMID:36127429
      supporting_text: The SHMOOSE-mitofilin interaction was confirmed in vitro by treating cells with
        SHMOOSE followed by gentle lysis, reciprocal immunoprecipitation, and western blot at least three
        times
    - reference_id: PMID:36127429
      supporting_text: Mass spectrometry-based analysis suggested SHMOOSE bound 98 proteins; however, during
        protein quantification filtering and indexing by p value and fold change, we considered mitofilin
        a top SHMOOSE binding protein candidate
