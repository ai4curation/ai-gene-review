references:
- id: GO_REF:0000044
  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot Subcellular Location
    vocabulary mapping, accompanied by conservative changes to GO terms applied by
    UniProt
  findings: []
- id: PMID:36127429
  title: Mitochondrial DNA variation in Alzheimer's disease reveals a unique microprotein
    called SHMOOSE.
  findings:
  - statement: The AD-associated mtSNP rs2853499 (m.12372) is synonymous for MT-ND5 but changes
      codon 47 of the SHMOOSE ORF (D47N); association is modest and confounded by haplogroup U.
    supporting_text: mtSNP 12372 (rs2853499) does change the amino acid sequence of a microprotein
      encoded by a sORF that we ultimately called SHMOOSE
  - statement: SHMOOSE contains no codons read differently by the mitochondrial code, so its sequence
      does not reveal where it is translated.
    supporting_text: SHMOOSE does not contain such mitochondrial-specific codon usage and is translated
      into identical sequences regardless of codon specificity
  - statement: Synthetic SHMOOSE (not D47N) raised basal oxygen consumption of neuronal cells.
    supporting_text: compared to SHMOOSE.D47N, wild type SHMOOSE significantly increased basal oxygen
      consumption rate by approximately 20%
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Sole primary characterisation (full text cached, PMC10027624). Existence data on the
      endogenous peptide are solid (WB in fractions, rho0 negative control, MS). Functional data use
      exogenous peptide; the interactome and OCR work is from one group and has not been replicated.
      The disease association is from a haplogroup-defining SNP, which the authors acknowledge cannot be
      separated from linked variants. Authors disclose filed intellectual property.
