id: Q16665
gene_symbol: HIF1A
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'HIF1A/HIF-1alpha is an oxygen-regulated bHLH-PAS transcription factor alpha
  subunit that heterodimerizes with ARNT/HIF-1beta to form HIF-1, binds hypoxia-response elements
  in regulatory chromatin, recruits CBP/p300 coactivators, and activates RNA polymerase II
  transcriptional programs that adapt cells to low oxygen. Oxygen-, iron- and metabolite-dependent
  hydroxylation couples HIF1A to VHL/CUL2 ubiquitination and proteasomal degradation, while
  hypoxia stabilizes HIF1A and permits nuclear HIF-1 activity in glycolytic, angiogenic, erythropoietic
  and stress-response gene-expression programs.'
alternative_products:
