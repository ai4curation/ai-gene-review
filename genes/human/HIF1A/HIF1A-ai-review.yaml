- term:
    id: GO:0043536
    label: positive regulation of blood vessel endothelial cell migration
  evidence_type: IMP
  original_reference_id: PMID:26879375
  qualifier: involved_in
  review:
    summary: Angiogenic VEGF signaling is a non-core HIF1A transcriptional output.
    action: KEEP_AS_NON_CORE
    reason: HIF-1 directly activates VEGF transcription and thereby regulates angiogenic
      endothelial responses, but angiogenesis is a context-specific biological output 
      downstream of HIF-1 transcription-factor activity.
    supported_by:
    - reference_id: PMID:8756616
      supporting_text: A HIF-1 binding site was demonstrated in the 47-bp hypoxia 
        response element, and a 3-bp substitution eliminated the ability of the element 
        to bind HIF-1 and to activate transcription in response to hypoxia and/or 
        recombinant HIF-1.
- term:
