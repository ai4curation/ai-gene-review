- term:
    id: GO:0045821
    label: positive regulation of glycolysis
  evidence_type: IDA
  original_reference_id: PMID:8089148
  qualifier: acts_upstream_of
  review:
    summary: HIF1A regulation of glucose metabolism is a non-core hypoxic output.
    action: KEEP_AS_NON_CORE
    reason: The cited pathogen-effector and classic hypoxia-response literature support 
      HIF1A control of glucose metabolic genes, but glycolytic remodeling is one 
      downstream branch of HIF-1 transcription.
    supported_by:
    - reference_id: PMID:32697943
      supporting_text: The infection triggers mitochondrial ROS production, which 
        induces stabilization of hypoxia-inducible factor-1α (HIF-1α) and consequently 
        promotes glycolysis.
