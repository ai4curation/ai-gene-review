    label: collagen metabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q61221
  - ensembl:ENSMUSP00000021530
  review:
    summary: HIF1A-dependent LOX induction does not make HIF1A a collagen-metabolism
      effector.
    action: MARK_AS_OVER_ANNOTATED
    reason: HIF-1alpha induces LOX-family target genes and fibrotic collagen deposition
      downstream, but it acts as a transcriptional regulator rather than as a participant in
      collagen metabolism.
    supported_by:
    - reference_id: PMID:18037992
      supporting_text: induced epithelial cell migration through upregulation of lysyl oxidase
        genes. Genetic ablation of epithelial Hif-1alpha inhibited the development of
        tubulointerstitial fibrosis in UUO kidneys, which was associated with decreased
        interstitial collagen deposition
