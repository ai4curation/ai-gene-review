- term:
    id: GO:0001938
    label: positive regulation of endothelial cell proliferation
  evidence_type: IC
  original_reference_id: PMID:8756616
  qualifier: involved_in
  supporting_entities:
  - GO:0010575
  review:
    summary: Angiogenic VEGF signaling is a non-core HIF1A transcriptional output.
    action: KEEP_AS_NON_CORE
    reason: HIF-1 directly activates VEGF transcription and thereby regulates angiogenic
      endothelial responses, but angiogenesis is a context-specific biological output 
      downstream of HIF-1 transcription-factor activity.
    supported_by:
    - reference_id: PMID:8756616
      supporting_text: A HIF-1 binding site was demonstrated in the 47-bp hypoxia 
        response element, and a 3-bp substitution eliminated the ability of the element 
        to bind HIF-1 and to activate transcription in response to hypoxia and/or 
        recombinant HIF-1.
- term:
    id: GO:0002039
    label: p53 binding
  evidence_type: EXP
  original_reference_id: PMID:15629713
  qualifier: enables
  review:
    summary: HIF1A ODD binds p53.
    action: KEEP_AS_NON_CORE
    reason: The HIF1A ODD-p53 interaction is direct and experimentally supported, but it
      is a stress-response regulatory interaction rather than the primary HRE-bound 
      transcription-factor activity.
    supported_by:
    - reference_id: PMID:15629713
      supporting_text: The HIF-1alpha ODD domain binds weakly to the isolated p53 core 
        domain but tightly to full-length p53 to give a complex of one HIF-1alpha ODD 
        domain with a p53 dimer.
