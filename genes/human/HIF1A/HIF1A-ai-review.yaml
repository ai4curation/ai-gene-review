- term:
    id: GO:0032991
    label: protein-containing complex
  evidence_type: IMP
  original_reference_id: PMID:14594809
  qualifier: part_of
  review:
    summary: Root protein-containing complex is entailed by more informative HIF1A complexes.
    action: TOO_GENERAL
    reason: HIF1A can form protein-containing complexes with CBP/p300 and is part of the HIF-1
      transcription factor complex, so this root cellular-component term is true but
      uninformative beside the more specific complex and partner-binding rows elsewhere in this
      review.
    supported_by:
    - reference_id: PMID:14594809
      supporting_text: HIF-1alpha and CITED2 domains utilize partly overlapping surfaces of
        TAZ1 to achieve high affinity binding and to compete effectively with each other for
        interaction with CBP/p300; CITED2 and HIF-1alpha use these binding sites differently to maintain
        similar binding affinities in order to displace each other in a feedback loop during the
        hypoxic response
- term:
    id: GO:0032991
    label: protein-containing complex
  evidence_type: IMP
  original_reference_id: PMID:15629713
  qualifier: part_of
  review:
    summary: Root protein-containing complex is entailed by more informative HIF1A complexes.
    action: TOO_GENERAL
    reason: HIF1A can bind p53 and is part of the HIF-1 transcription factor complex, so this
      root cellular-component term is true but uninformative beside the more specific complex
      and partner-binding rows elsewhere in this review.
    supported_by:
    - reference_id: PMID:15629713
      supporting_text: HIF-1alpha ODD domain binds weakly to the isolated p53 core domain but
        tightly to full-length p53 to give a complex of one HIF-1alpha ODD domain with a p53
        dimer
