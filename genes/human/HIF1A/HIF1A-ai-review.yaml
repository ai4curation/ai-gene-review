- term:
    id: GO:0045648
    label: positive regulation of erythrocyte differentiation
  evidence_type: IC
  original_reference_id: PMID:1448077
  qualifier: involved_in
  supporting_entities:
  - GO:0046886
  review:
    summary: Erythropoietin enhancer activation is a non-core HIF1A erythropoietic 
      output.
    action: KEEP_AS_NON_CORE
    reason: HIF-1 binding is required for hypoxic transcriptional induction from the EPO
      enhancer; erythrocyte differentiation is retained only as a downstream endocrine 
      output of HIF-1alpha target-gene activation.
    supported_by:
    - reference_id: PMID:1448077
      supporting_text: We have identified a 50-nucleotide enhancer from the human 
        erythropoietin gene 3'-flanking sequence which can mediate a sevenfold 
        transcriptional induction in response to hypoxia
