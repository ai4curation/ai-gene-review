- term:
    id: GO:0001217
    label: DNA-binding transcription repressor activity
  evidence_type: IMP
  original_reference_id: PMID:31368162
  qualifier: enables
  review:
    summary: HIF1A repression at this adipose miRNA promoter is context-specific.
    action: KEEP_AS_NON_CORE
    reason: The cited miR-20a/TGF-beta1 axis supports a repressive promoter effect of 
      HIF1A in adipose-derived stem cells, but this is a context-specific output of 
      HIF1A chromatin binding rather than its dominant molecular role.
    supported_by:
    - reference_id: PMID:31368162
      supporting_text: HIF1A suppressed the expression of miR-20a via targeting its 
        promoter region, subsequently promoting the paracrine from ADSCs and HDMEC 
        angiogenesis.
- term:
    id: GO:0001222
    label: transcription corepressor binding
  evidence_type: IPI
  original_reference_id: PMID:19071119
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q9NWT6
  review:
    summary: HIF1A binds FIH-1 through the same region used by HDAC4/HDAC5.
    action: KEEP_AS_NON_CORE
    reason: The corepressor-binding row reflects regulatory partners that modulate HIF1A
      transactivation rather than the HIF-1 DNA-binding activity itself.
    supported_by:
    - reference_id: PMID:19071119
      supporting_text: HDAC4 and HDAC5 physically associated with HIF-1alpha through the
        inhibitory domain (ID) that is the binding site for factor inhibiting HIF-1 
        (FIH-1).
