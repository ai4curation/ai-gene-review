    label: sequence-specific DNA binding
  evidence_type: IDA
  original_reference_id: PMID:7539918
  qualifier: contributes_to
  review:
    summary: Sequence-specific DNA binding should be refined to HRE-containing Pol II 
      regulatory-region binding.
    action: MODIFY
    reason: HIF-1 binds HRE-containing regulatory DNA upstream of Pol II target-gene 
      activation, so GO:0000977 is more precise than the generic DNA-binding parent.
