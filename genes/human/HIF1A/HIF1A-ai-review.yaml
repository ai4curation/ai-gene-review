- term:
    id: GO:0042826
    label: histone deacetylase binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q61221
  - ensembl:ENSMUSP00000021530
  review:
    summary: HDAC4/5 binding is a specific HIF1A regulatory interaction.
    action: KEEP_AS_NON_CORE
    reason: HDAC4 and HDAC5 physically associate with the HIF1A inhibitory domain and 
      promote p300 over FIH-1 association; this binding modulates HIF-1alpha 
      transactivation rather than constituting the core DNA-binding activity.
    supported_by: &id005
    - reference_id: PMID:19071119
      supporting_text: HDAC4 and HDAC5 physically associated with HIF-1alpha through the
        inhibitory domain (ID) that is the binding site for factor inhibiting HIF-1 
        (FIH-1)
