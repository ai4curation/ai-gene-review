core_functions:
- description: HIF1A/HIF-1alpha heterodimerizes with ARNT/HIF-1beta to form a nuclear 
    HIF-1 RNA polymerase II transcription-regulator complex that binds HRE-containing 
    regulatory chromatin and activates hypoxia-responsive target genes.
  molecular_function:
    id: GO:0001228
    label: DNA-binding transcription activator activity, RNA polymerase II-specific
  directly_involved_in:
  - id: GO:0045944
    label: positive regulation of transcription by RNA polymerase II
  - id: GO:0071456
    label: cellular response to hypoxia
  locations:
  - id: GO:0000785
    label: chromatin
  in_complex:
    id: GO:0090575
    label: RNA polymerase II transcription regulator complex
  supported_by:
  - reference_id: PMID:7539918
    supporting_text: Hypoxia-inducible factor 1 (HIF-1) is found in mammalian cells 
      cultured under reduced O2 tension and is necessary for transcriptional activation 
      mediated by the erythropoietin gene enhancer in hypoxic cells.
  - reference_id: PMID:8756616
    supporting_text: A HIF-1 binding site was demonstrated in the 47-bp hypoxia response
      element, and a 3-bp substitution eliminated the ability of the element to bind 
      HIF-1 and to activate transcription in response to hypoxia and/or recombinant 
      HIF-1.
  - reference_id: file:reactome/R-HSA-1234171.md
    supporting_text: HIF-alpha (HIF1A, HIF2A (EPAS1, MOP2), HIF3A isoform 1) forms a 
      heterodimer with ARNT
  - reference_id: file:reactome/R-HSA-1234167.md
    supporting_text: HIF (heterodimer of HIF-alpha and HIF-beta) recruits p300 and CBP 
      to the promoters of target genes
proposed_new_terms: []
suggested_questions:
- question: Which HIF1A developmental and inflammatory process rows should remain direct
    gene-level annotations versus being represented through GO-CAM target-gene models?
- question: Which regulatory protein interactions should be promoted from non-core 
    modifiers into a HIF1A oxygen-dependent degradation module?
suggested_experiments:
- hypothesis: Endogenous HIF1A directly activates a cell-type-specific subset of 
    HRE-containing enhancers across acute and chronic hypoxia.
  description: Pair endogenous HIF1A and ARNT CUT&RUN with nascent RNA profiling after 
    HIF1A knockout and rescue in matched epithelial, endothelial and monocyte systems 
    under normoxia, hypoxia and reoxygenation.
  experiment_type: HIF-1 CUT&RUN and nascent transcriptomics
