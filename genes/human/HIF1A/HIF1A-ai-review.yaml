- term:
    id: GO:0000302
    label: response to reactive oxygen species
  evidence_type: IDA
  original_reference_id: PMID:32697943
  qualifier: involved_in
  review:
    summary: SARS-CoV-2 monocyte response/glycolysis is a context-specific HIF1A output.
    action: KEEP_AS_NON_CORE
    reason: The SARS-CoV-2 monocyte study supports HIF1A as a mediator of virus-induced 
      ROS, glycolytic rewiring and cytokine production, but this is a pathogen-response 
      context downstream of core HIF-1 transcriptional activation.
    supported_by:
    - reference_id: PMID:32697943
      supporting_text: The infection triggers mitochondrial ROS production, which 
        induces stabilization of hypoxia-inducible factor-1α (HIF-1α) and consequently 
        promotes glycolysis.
    - reference_id: PMID:32697943
      supporting_text: HIF-1α-induced changes in monocyte metabolism by SARS-CoV-2 
        infection directly inhibit T cell response and reduce epithelial cell survival.
