  evidence_type: IMP
  original_reference_id: PMID:31368162
  qualifier: enables
  review:
    summary: The cis-regulatory binding row should be refined to Pol II cis-regulatory 
      binding.
    action: MODIFY
    reason: The HIF1A evidence supports Pol II HRE-containing cis-regulatory binding 
      rather than only the generic cis-regulatory region parent.
    proposed_replacement_terms:
    - id: GO:0000978
      label: RNA polymerase II cis-regulatory region sequence-specific DNA binding
    supported_by:
    - reference_id: PMID:8756616
      supporting_text: A HIF-1 binding site was demonstrated in the 47-bp hypoxia 
        response element, and a 3-bp substitution eliminated the ability of the element 
        to bind HIF-1 and to activate transcription in response to hypoxia and/or 
        recombinant HIF-1.
