references:
- id: PMID:8486631
  title: A novel form of cytochrome P-450 family 4 in human polymorphonuclear leukocytes. cDNA cloning
    and expression of leukotriene B4 omega-hydroxylase.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified. Original cDNA cloning and expression establishing that the neutrophil
      LTB4 omega-hydroxylase is a CYP4 enzyme, with Km 0.71 uM. Abstract-only in cache.
- id: PMID:9675028
  title: Purification and characterization of recombinant human neutrophil leukotriene B4 omega-hydroxylase
    (cytochrome P450 4F3).
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified. Purified recombinant neutrophil CYP4F3 (i.e. isoform CYP4F3A). Establishes
      the LTB4 Km, the wider eicosanoid substrate range including 5-HETE and lipoxins, and -- decisively
      for the isoform question -- that arachidonate is NOT a substrate of this isoform. Abstract-only
      in the cache; all claims drawn here are stated in the abstract.
- id: PMID:11461919
  title: Alternative splicing determines the function of CYP4F3 by switching substrate specificity.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'PubMed-verified. The isoform paper: alternative exon use switches substrate specificity,
      with Km values for both isoforms on both LTB4 and arachidonate and their tissue distributions. The
      single most informative reference for this gene. Abstract-only in cache.'
- id: PMID:15145985
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified. Fatty acid epoxide omega-hydroxylation; the title states the CYP4F3
      isoforms are the main human catalysts, with CYP4F3A the most active. Supports the long-chain omega-hydroxylase
      core function. Abstract-only in cache.
  title: Human CYP4F3s are the main catalysts in the oxidation of fatty acid epoxides.
- id: PMID:15364545
  title: 'Expression and characterization of human cytochrome P450 4F11: Putative role in the metabolism
    of therapeutic drugs and eicosanoids.'
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified. Primarily a CYP4F11 characterisation paper; cited by GOA on CYP4F3
      for LTB4 omega-hydroxylase and arachidonate omega-hydroxylase rows. Retained as supporting context
      rather than quoted here, since the title and abstract foreground the paralog and the cache is abstract-only
      -- the curator who made these experimental annotations read the full text, which may well assay
      CYP4F3 alongside CYP4F11.
- id: PMID:16547005
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified, and this paper is GO:0140692's own definitional reference. Identifies
      CYP4F2 and CYP4F3B as the two P450s initiating VLCFA omega-hydroxylation, with the X-ALD motivation.
      Abstract-only in cache.
  title: Omega-oxidation of very long-chain fatty acids in human liver microsomes. Implications for X-linked
    adrenoleukodystrophy.
- id: PMID:16820285
  title: 'Oxygenation of omega-3 fatty acids by human cytochrome P450 4F3B: effect on 20-hydroxyeicosatetraenoic
    acid production.'
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified. CYP4F3B omega-hydroxylation of EPA and DHA and competition with arachidonate
      for 20-HETE formation. Abstract-only in cache.
- id: PMID:18065749
  reference_review:
    relevance: LOW
    correctness: MISCITED
    review_notes: 'PubMed-verified, and the citation problem is on UniProt''s side rather than GOA''s.
      UniProt''s CYP4F3B FUNCTION line cites this paper for omega-hydroxylation of long-chain 3-hydroxy
      fatty acids, but the paper reports the opposite for this enzyme: CYP4F11 is the catalyst and CYP4F3b
      is named among those with negligible activity. No GO annotation depends on it, so there is nothing
      to action in existing_annotations; flagged here and in suggested_questions so the UniProt line does
      not seed a future over-annotation.'
  findings:
  - statement: CYP4F11 is the predominant catalyst of long-chain 3-hydroxy fatty acid omega-hydroxylation;
      CYP4F3B shows negligible activity.
    supporting_text: CYP4F3b, CYP4F12, and CYP4A11 exhibited negligible activity
  title: Omega oxidation of 3-hydroxy fatty acids by the human CYP4F gene subfamily enzyme CYP4F11.
- id: PMID:18182499
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified. Characterises the steps after omega-hydroxylation and names CYP4F3A
      and CYP4F3B explicitly for the NADPH-dependent oxidation of omega-hydroxy-VLCFAs, which is the CYP4F3-specific
      evidence behind the two proposed new terms. Also states that the NAD(+)-dependent route predominates,
      which is why the proposal is framed as a real but minor P450 branch. Abstract-only in cache.
  title: Characterization of the human omega-oxidation pathway for omega-hydroxy-very-long-chain fatty
    acids.
- id: PMID:18577768
  title: 'Cytochromes P450 from family 4 are the main omega hydroxylating enzymes in humans: CYP4F3B is
    the prominent player in PUFA metabolism.'
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'PubMed-verified. Both isoforms are the most efficient PUFA omega-hydroxylases among
      the CYP4 enzymes tested. Also the basis for NOT proposing an omega-1 annotation: the paper assigns
      the omega-1 route to CYP1A1, CYP2C19 and CYP2E1, not to the CYP4F enzymes. Abstract-only in cache.'
- id: PMID:24138531
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified, full text available and read. Correctly cited for what it shows --
      CYP4F2 and CYP4F11 as vitamin K omega-hydroxylases -- but it does NOT assay CYP4F3, which appears
      only as liver mRNA background. Cited here precisely to document that the CYP4F3 vitamin K IBAs have
      no paralog-specific experimental support, while not being contradicted either.
  title: 'Cytochrome P450-dependent catabolism of vitamin K: ω-hydroxylation catalyzed by human CYP4F2
    and CYP4F11.'
