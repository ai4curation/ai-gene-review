  description: Incorporates exon 3 (VSP_047193). Selectively expressed in liver and kidney, and the predominant
    CYP4F in trachea and gastrointestinal tissues. Omega-hydroxylates arachidonate to 20-HETE (Km 22 uM)
    and other PUFAs including EPA and DHA; 30-fold higher Km for LTB4 than CYP4F3A. One of two P450s initiating
    very-long-chain fatty acid omega-oxidation.
