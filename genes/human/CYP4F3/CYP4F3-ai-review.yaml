functional_isoforms:
- id: CYP4F3_A
  name: CYP4F3A (exon 4, myeloid)
  type: SPLICE_VARIANT
  maps_to:
  - type: UNIPROT_ISOFORM
    ids:
    - Q08477-1
  description: 'Incorporates exon 4. The only CYP4F isoform in blood neutrophils and bone marrow. Leukotriene
    B4 omega-hydroxylase (Km 0.64-0.71 uM), carrying LTB4 through three successive oxidations to 20-carboxy-LTB4.
    Essentially inactive on arachidonate: the purified neutrophil enzyme showed no detectable activity
    on it, and Km is ~185 uM.'
