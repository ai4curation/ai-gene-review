id: Q08477
gene_symbol: CYP4F3
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'Cytochrome P450 4F3 is a microsomal, heme-thiolate cytochrome P450 monooxygenase of the
  endoplasmic reticulum membrane that omega-hydroxylates fatty acids and their oxygenated derivatives
  (oxylipins), using molecular oxygen and electrons delivered from NADPH by cytochrome P450 reductase.
  Alternative promoter usage and splicing of mutually exclusive 48-codon exons produce two 520-residue
  isoforms with different substrate preferences and tissue distributions, which is the defining feature
  of the gene. CYP4F3A, the only CYP4F in blood neutrophils and bone marrow, is the leukotriene B4 omega-hydroxylase:
  it inactivates LTB4 with submicromolar affinity and carries the oxidation through three successive steps
  to 20-hydroxy-, 20-oxo- and finally 20-carboxy-LTB4, terminating a potent chemoattractant signal during
  the resolution of inflammation. CYP4F3B, expressed in liver, kidney, trachea and gastrointestinal tissues,
  instead prefers polyunsaturated fatty acids: it converts arachidonate to 20-HETE, a vasoconstrictive
  and natriuretic mediator of arterial blood pressure, and omega-hydroxylates eicosapentaenoate and docosahexaenoate,
  so omega-3 fatty acids act as competing substrates that lower 20-HETE output. Both isoforms also omega-hydroxylate
  monohydroxy polyunsaturated fatty acids and fatty acid epoxides, and both initiate the omega-oxidation
  of saturated very-long-chain fatty acids to dicarboxylic acids, an extra-peroxisomal route for shortening
  chains that would otherwise require peroxisomal beta-oxidation.'
