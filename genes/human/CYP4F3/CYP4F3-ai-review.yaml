core_functions:
- description: Leukotriene B4 inactivation (isoform CYP4F3A, EC 1.14.14.94). As the neutrophil LTB4 omega-hydroxylase,
    CYP4F3A hydroxylates the omega (C20) carbon of LTB4 with submicromolar affinity, then oxidises the
    product twice more -- to 20-oxo-LTB4 and to 20-carboxy-LTB4 -- so that one enzyme performs the whole
    three-step inactivation of a potent neutrophil chemoattractant. Electrons come from NADPH via cytochrome
    P450 reductase.
  molecular_function:
    id: GO:0050051
    label: leukotriene-B4 20-monooxygenase activity
