proposed_new_terms:
- proposed_name: omega-hydroxy fatty acid omega-oxidase activity
  proposed_definition: 'Catalysis of the reaction: an omega-hydroxy fatty acid + reduced [NADPH--hemoprotein
    reductase] + O2 = an omega-oxo fatty acid + oxidized [NADPH--hemoprotein reductase] + 2 H2O + H(+).'
  proposed_parent:
    id: GO:0004497
    label: monooxygenase activity
  justification: 'Step 2 of fatty acid omega-oxidation has no GO molecular function term, although GO
    holds the identical step for leukotriene B4 as GO:0097258 ''20-hydroxy-leukotriene B4 omega oxidase
    activity'' -- annotated to this very protein and mapped in rhea2go. CYP4F3A and CYP4F3B are both experimentally
    credited with the NADPH-dependent oxidation of omega-hydroxy-VLCFAs. Anchored to RHEA:39055 (C22)
    and RHEA:39059 (C26). No chain-length qualifier: docosanoate is exactly 22 carbons, so GO:0102033
    (13-22 C) covers it and GO:0140692 (>22 C) does not, and GO:0120250 shows GO keeps an unqualified
    parent tier for this chemistry. Proposed in SSSOM batch 8 of the RHEA project; this review supplies
    the CYP4F3-specific evidence.'
