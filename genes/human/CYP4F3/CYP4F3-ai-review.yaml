- term:
    id: GO:0042361
    label: menaquinone catabolic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000757327
  - UniProtKB:P78329
  - UniProtKB:Q9HBI6
  review:
    summary: Menaquinone (vitamin K2) catabolic process, by IBA only. The experimentally established vitamin
      K omega-hydroxylases in this subfamily are CYP4F2 and CYP4F11.
    action: KEEP_AS_NON_CORE
    reason: 'KEEP rather than REMOVE, on an explicit reading of the evidence. The IBA is a PAINT node
      judgment covering CYP4F2, CYP4F3, CYP4F8, CYP4F11 and CYP4F12, and only CYP4F2 and CYP4F11 carry
      IDA, both from PMID:24138531. I read that paper''s full text: it expresses and assays CYP4F2 and
      CYP4F11 only, mentions CYP4F3B twice and solely as liver mRNA background, and ends with ''Studies
      are ongoing to determine if other human liver enzymes might be involved in MK4 metabolism''. So
      CYP4F3 was never tested -- this is not tested-and-negative, and the node placement is not contradicted.
      Inheritance is plausible on chemistry too, since CYP4F3B is a liver CYP4F acting on lipophilic isoprenoid-tailed
      substrates. But there is no CYP4F3-specific evidence and vitamin K catabolism is not what this gene
      is for, so non-core.'
    supported_by:
    - &id006
      reference_id: PMID:24138531
      supporting_text: expressed and purified and found to be equally efficient as in vitro catalysts
