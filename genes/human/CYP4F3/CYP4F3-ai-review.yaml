- term:
    id: GO:0097265
    label: 5(S)-hydroxyeicosatetraenoic acid dehydrogenase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000116
  qualifier: enables
  supporting_entities:
  - RHEA:48656
  review:
    summary: 'Annotated from RHEA:48656, which is 5-HETE + O2 + reduced CPR = 5,20-dihydroxy-ETE: an omega-hydroxylation
      that CYP4F3 genuinely performs. The GO term, however, is named and classified as a dehydrogenase.'
    action: MODIFY
    reason: The reaction is correct for this gene -- the purified enzyme omega-hydroxylates 5-HETE --
      but GO:0097265 is internally inconsistent and mis-placed, so it should not be the term carrying
      it. Its definition formula is an O2-consuming monooxygenation (xref RHEA:48656, product 5,20-dihydroxy-eicosatetraenoate)
      while its name says 'dehydrogenase' and its definition glosses the product as '(5-oxo-ETE)', which
      is what a real 5-hydroxyeicosanoid dehydrogenase would make. Its is_a path runs through GO:0016616
      'oxidoreductase activity, acting on the CH-OH group of donors, NAD or NADP as acceptor', where an
      O2-consuming monooxygenation does not belong. Replace with the long-chain omega-hydroxylase class
      term, following GO's own per-substrate obsoletion precedent (GO:0052869, GO:0018777); the term itself
      is raised in suggested_questions as an ontology defect.
    proposed_replacement_terms:
    - id: GO:0102033
      label: long-chain fatty acid omega-hydroxylase activity
    supported_by:
    - reference_id: PMID:9675028
      supporting_text: 5-HETE and 12-HETE
    - *id013
