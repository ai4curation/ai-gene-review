id: Q15119
gene_symbol: PDK2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'PDK2 is a broadly expressed mitochondrial matrix serine kinase that phosphorylates and inhibits
  pyruvate dehydrogenase E1 alpha within the pyruvate dehydrogenase complex. Structural studies show that
  ATP and regulatory ligands bind its C-terminal catalytic and N-terminal regulatory domains, and this
  isoform forms homo- and PDK1-containing heterodimers that help tune pyruvate oxidation.'
