id: O95500
gene_symbol: CLDN14
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CLDN14 encodes claudin-14, a four-pass membrane protein that forms structural strands of
  epithelial tight junctions. Its self-association and interactions with other claudins restrict paracellular
  permeability, supporting the inner-ear barrier and regulated renal calcium handling. In model junctions,
  claudin-14 can form a barrier on its own and replace claudin-16 within claudin-19-containing strands.
  Its cytoplasmic C-terminal motif binds PDZ domains. Human loss-of-function variants cause recessive
  nonsyndromic deafness, while renal expression is responsive to calcium-sensing pathways.
