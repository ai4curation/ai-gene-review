core_functions:
- description: Claudin-14 supplies a polymerizing membrane component of bicellular tight junctions. Homomeric
    strands and context-dependent copolymers form a barrier to paracellular passage; changes in strand
    composition couple its abundance to epithelial permeability.
  molecular_function:
    id: GO:0005198
    label: structural molecule activity
  directly_involved_in:
  - id: GO:0070830
    label: bicellular tight junction assembly
  locations:
  - id: GO:0005923
    label: bicellular tight junction
  supported_by:
  - reference_id: PMID:41325524
    supporting_text: CLDN14 alone can form a TJ barrier
  - reference_id: PMID:22373575
  - reference_id: PMID:17130295
  - reference_id: PMID:15880785
suggested_questions:
- question: Which claudins directly pair with CLDN14 across the native human cochlear junction, and how
    does that composition differ from the renal barrier?
- question: Which CLDN14 C-terminal PDZ interactions operate in intact polarized epithelia, and how do
    they affect junctional residence or strand architecture?
- question: How do the older CLDN14–CLDN16 association assays and the newer CLDN14–CLDN19 strand-replacement
    model relate across expression levels, cis/trans geometry and epithelial context?
- question: What was the intended source for the original protein-containing-complex assembly TAS assertion
    attributed to PMID:7644498?
suggested_experiments:
- description: Introduce sequence-verified human CLDN14 into an isogenic claudin-deficient epithelial
    background, measure strand architecture and ion permeability together, and compare matched CLDN14/16/19
    combinations and self-association mutants.
- description: Test the CLDN14 terminal motif and selected PDZ partners in polarized human epithelial
    cells with endogenous expression controls, separating trafficking effects from direct strand assembly.
- description: Resolve native cochlear junction partners with spatially restricted interaction measurements
    and species-matched rescue; distinguish cis oligomerization from trans pairing across neighboring
    cells.
