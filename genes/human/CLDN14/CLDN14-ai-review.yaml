    label: structural molecule activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR006187
  review:
    summary: CLDN14 supplies structural components of tight-junction strands.
    action: ACCEPT
    reason: Claudin-domain mapping agrees with CLDN14 self-assembly, junctional strand formation and reduced
      paracellular permeability. The newer heterologous-cell work resolves polymerization and replacement
      of CLDN16 in CLDN19-containing meshworks; it does not establish an autonomous ion-conducting pore.
      Its construct species is unspecified in the inspected supplement, while the older mechanistic study
      explicitly uses mouse CLDN14.
    supported_by:
    - reference_id: GO_REF:0000002
    - reference_id: PMID:41325524
    - reference_id: PMID:22373575
    - reference_id: PMID:17130295
    - reference_id: file:human/CLDN14/CLDN14-source-evidence.json
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: InterPro:IPR006187
        source_status: SUPPORTS_TRANSFER
        comment: The claudin-domain structural assignment is independently corroborated by target-family
          strand and barrier experiments.
