description: CACNA2D4 encodes the alpha2delta-4 auxiliary subunit of voltage-gated calcium channels. The
  largely extracellular, membrane-anchored protein associates with pore-forming channel subunits and regulates
  calcium entry. Human alpha2delta-4 enhances CaV1.2/beta3-dependent calcium influx in a heterologous
  expression system. Mouse retinal studies show that alpha2delta-4 maintains presynaptic CaV1.4 channel
  function and organization of photoreceptor ribbon synapses, supporting transmission to bipolar cells.
  Human biallelic truncating variants cause autosomal recessive cone dystrophy. Proteolytic separation
  into alpha2 and delta chains has not been established in vivo for this subunit.
