- term:
    id: GO:0050908
    label: detection of light stimulus involved in visual perception
  evidence_type: IMP
  original_reference_id: PMID:17033974
  qualifier: involved_in
  review:
    action: UNDECIDED
    summary: CACNA2D4 is required for normal retinal function, but the specific light-detection step remains
      unresolved.
    reason: PMID:17033974 establishes human cone dystrophy and places the auxiliary subunit in photoreceptor
      ribbon-synapse calcium-channel function. GO:0050908 concerns receiving light and converting it into
      a molecular signal; impaired synaptic transmission can also disrupt visual responses downstream
      of that step. The accessible abstract and PubMed figure caption do not settle the exact experimental
      annotation, and the complete original article could not be accessed. Retain the curator assertion
      as unresolved rather than reject it from incomplete evidence. Later mouse evidence separates preserved
      photocurrents from impaired synaptic transmission (PMID:28262416); a small a-wave reduction in older
      mutants was considered alongside retinal degeneration (PMID:29875267). These findings support downstream
      function but do not resolve every assay in the inaccessible original human report.
    supported_by:
    - reference_id: PMID:17033974
      supporting_text: Both patients share symptoms of slowly progressing cone dystrophy.
    additional_reference_ids:
    - PMID:28262416
    - PMID:29875267
