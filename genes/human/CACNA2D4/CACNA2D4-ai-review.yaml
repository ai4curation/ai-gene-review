  qualifier: involved_in
  review:
    action: ACCEPT
    summary: The auxiliary alpha2delta-4 subunit participates in calcium transport by supporting the active
      channel complex.
    reason: PMID:12181424 directly demonstrates increased channel-mediated calcium influx when human alpha2delta-4
      is coexpressed with CaV1.2 and beta3. Its active regulatory contribution to the transporting complex
      supports this process annotation. Ion passage occurs through alpha1, so the process assignment does
      not imply that alpha2delta-4 independently conducts calcium. The mouse studies PMID:28262416 and
      PMID:29875267 corroborate its functional contribution to native presynaptic calcium entry, with
      residual activity after loss of the auxiliary subunit.
    additional_reference_ids:
