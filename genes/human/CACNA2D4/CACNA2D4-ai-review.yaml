      and official PubMed. Direct human HEK293 coexpression/association and calcium-influx evidence; full
      text not accessed. The original 1120-residue construct does not supersede the current 1137-residue
      UniProt sequence.
- id: PMID:17033974
  title: Mutation in the auxiliary calcium-channel subunit CACNA2D4 causes autosomal recessive cone dystrophy.
  findings:
  - statement: A homozygous truncating CACNA2D4 variant was identified in two siblings with slowly progressive
      cone dystrophy.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Normal cached PubMed metadata and complete abstract, plus official PubMed figure caption,
      checked. Human siblings with a homozygous truncating variant establish retinal disease relevance.
      Full original article access attempts failed; the mechanistic distinction between primary light
      detection and downstream transmission remains unresolved for its GO assertion.
- id: PMID:28262416
  title: The Auxiliary Calcium Channel Subunit α2δ4 Is Required for Axonal Elaboration, Synaptic Transmission,
    and Wiring of Rod Photoreceptors.
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Normal XML cache; complete abstract and selected individual Methods, Results and Discussion
      read, excluding duplicate aggregate paragraphs. Exon8 mouse knockout, native retinal recordings
      and cellular association assays. Cone transmission persists at reduced efficiency in this model.
      Supplementary images were not independently inspected; this is not a native human retinal experiment.
  findings:
  - statement: Mouse alpha2delta-4 loss reduces native photoreceptor calcium-channel function and rod-to-bipolar
      signaling while preserving photoreceptor photocurrents. Cellular ELFN1 coassociation supports a
      synaptic complex, but purified ectodomain pull-down did not establish binary binding.
- id: PMID:29875267
  title: α(2)δ-4 Is Required for the Molecular and Structural Organization of Rod and Cone Photoreceptor
    Synapses.
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Normal HTML fallback cache; complete abstract and selected Methods, Results and Discussion
      read. Exon2 mouse knockout, rod-terminal GCaMP imaging and serial-EM analysis; the latter reveals
      cone triad abnormalities beyond ribbon counts. A small a-wave decrease in older animals occurs alongside
      retinal degeneration. Figures and supplementary material were not independently inspected; no native
      human experiment is inferred.
  findings:
  - statement: An independent mouse knockout reduces functional presynaptic CaV1.4 channels and disrupts
      rod synapses and cone postsynaptic triads despite relatively preserved cone ribbons. Residual channel
      activity argues against an absolute requirement for forward trafficking.
