gene_symbol: NADK2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: NADK2 (NAD kinase 2, mitochondrial; also known as C5orf33, MNADK, NADKD1)
  is the mitochondrial NAD(+) kinase (EC 2.7.1.23). It is imported into mitochondria
  by an N-terminal transit peptide and acts as a soluble enzyme that phosphorylates
  NAD(+) using ATP (and, in vitro, inorganic polyphosphate) to produce NADP(+). It is
  the source of the mitochondrial NADP(H) pool, separate from the cytosolic pool made
  by NADK. The enzyme has a low Km for NAD(+), only weak NADH kinase activity, and is
  inhibited by NADH, NADPH and NADP(+). Crystal structures show a constitutively active
  homodimer, held together by an insert that is characteristic of animal mitochondrial
  NAD kinases and that prevents the tetramer formed by other NAD kinases; acetylation
  of lysines near the active site inhibits it. Mitochondrial NADPH derived from NADK2
  is used by NADPH-dependent matrix enzymes, including 2,4-dienoyl-CoA reductase (DECR1)
  in polyunsaturated fatty acid oxidation, the first step of lysine degradation, and
  delta-1-pyrroline-5-carboxylate synthase (P5CS) in proline biosynthesis, which makes
  NADK2-deficient cells proline auxotrophs. NADK2 is broadly expressed, with high levels
  in liver; Nadk2 knockout mice show stress-induced hepatic steatosis. Biallelic loss-of-function variants cause NADK2 deficiency
  (2,4-dienoyl-CoA reductase deficiency, DECRD), a mitochondrial NADP(H) deficiency
  with infantile-onset encephalopathy, elevated C10:2-carnitine and hyperlysinemia.
