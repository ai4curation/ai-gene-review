- term:
    id: GO:0042803
    label: protein homodimerization activity
  evidence_type: IDA
  original_reference_id: PMID:23212377
  qualifier: enables
  review:
    summary: NADK2 is a homodimer. The original statement is a curator inference from
      PMID:23212377 (UniProt ECO:0000305), but two later crystal structures confirm a
      dimer, held together by an insert specific to animal mitochondrial NAD kinases.
    action: KEEP_AS_NON_CORE
    reason: The homodimer is now well supported and is required for activity, but self-association
      describes how the enzyme is assembled rather than what it contributes; NAD+ kinase
      activity is the core function. Same action as the horse NADK2 review.
    supported_by:
    - reference_id: PMID:35868311
      supporting_text: We find that NADK2 presents an unexpected dimeric organization
        instead of the typical tetrameric assemblage observed for other NADKs.
    - reference_id: PMID:35733246
      supporting_text: the absence of cooperativity indicates that NADK2 forms a constitutively
        active homodimer that does not dissociate
core_functions:
- description: Mitochondrial NAD(+) kinase. NADK2 phosphorylates NAD(+) with ATP (or
    inorganic polyphosphate in vitro) to form NADP(+) in the mitochondrial matrix. This
    is the source of the mitochondrial NADP(H) pool used by NADPH-dependent matrix enzymes
    such as DECR1, the first enzyme of lysine degradation and P5CS of proline synthesis.
    The matrix location is inferred, not measured by submitochondrial fractionation; it
    rests on NADK2 being a soluble protein with a cleavable N-terminal presequence, on the
    matrix location of the enzymes that use its product, and on Reactome's placement of
    the reaction.
