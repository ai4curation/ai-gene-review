suggested_questions:
- question: Should NADK2 carry a proline biosynthesis or lysine catabolism process term?
    This review does not add one. NADK2 supplies the NADPH that P5CS and the lysine-degradation
    oxidoreductase use, but performs no step of either pathway, so by the participation
    test it is a supplier of a cofactor rather than a participant. Would a has_input/has_part
    relation in a GO-CAM model (NADK2 -> NADP+ -> P5CS) express this better?
- question: Is isoform 2 (Q4G0N4-2), which lacks residues 288-319 including the NAD+-stacking
    Trp319, catalytically active, and is it expressed as protein?
- question: Does the weak NADH kinase activity of NADK2 (about 10% of its NAD+ kinase
    activity in vitro) contribute to mitochondrial NADPH in vivo?
suggested_experiments:
- description: Express the mature forms of NADK2 isoforms 1 and 2 and assay NAD+ kinase
    activity and dimerisation; quantify isoform 2 protein in liver mitochondria by
    targeted proteomics.
  experiment_type: enzyme assay and targeted proteomics
- description: Confirm the matrix location of NADK2 by protease protection of isolated
    mitochondria and mitoplasts, with matrix and intermembrane-space markers.
