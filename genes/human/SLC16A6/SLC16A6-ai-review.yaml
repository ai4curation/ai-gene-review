core_functions:
- description: >-
    Facilitative (uniport), pH- and sodium-independent export of the ketone body beta-hydroxybutyrate (a
    monocarboxylic acid) across the plasma membrane. In hepatocytes this mediates secretion of ketone
    bodies into the circulation during fasting; loss of function traps ketogenic carbon in the liver and
    causes hepatic steatosis. Human SLC16A6 rescues the orthologous zebrafish defect, directly linking
    the human protein to this activity.
  molecular_function:
    id: GO:0097253
    label: beta-hydroxybutyrate transmembrane transporter activity
  directly_involved_in:
  - id: GO:0015718
    label: monocarboxylic acid transport
  locations:
  - id: GO:0005886
    label: plasma membrane
  - id: GO:0016323
    label: basolateral plasma membrane
  substrates:
  - id: CHEBI:17066
    label: (R)-3-hydroxybutyric acid
  supported_by:
  - reference_id: PMID:22302940
    supporting_text: a gene that we show encodes a transporter of the major ketone body β-hydroxybutyrate
  - reference_id: PMID:22302940
    supporting_text: introducing human SLC16A6 in rmn mutant livers rescues the mutant phenotype
- description: >-
    Low-affinity, pH- and sodium-independent facilitative transport of taurine (an amino-sulfonic acid)
    across the basolateral plasma membrane, favouring efflux. Characterized for mammalian MCT7 in human
    HEK293T and polarized Caco-2 cells (directly assayed construct is the rat ortholog; human activity is
    ISS-inferred). Transport is enhanced by the ancillary proteins basigin/CD147 and embigin/GP70.
  molecular_function:
    id: GO:0005368
    label: taurine transmembrane transporter activity
  directly_involved_in:
  - id: GO:0015734
    label: taurine transmembrane transport
  locations:
  - id: GO:0016323
    label: basolateral plasma membrane
  substrates:
