gene_symbol: SLC16A6
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  SLC16A6 encodes Monocarboxylate transporter 7 (MCT7), a 12-transmembrane major facilitator
  superfamily protein of the SLC16/monocarboxylate porter family. In contrast to the well-characterized
  proton-coupled monocarboxylate transporters MCT1-4, MCT7 is a facilitative (uniport), pH- and
  sodium-independent, low-affinity, polyspecific transporter whose substrate repertoire is still being
  defined. Its best-established cargoes are the ketone body beta-hydroxybutyrate and the amino-sulfonic
  acid taurine. In hepatocytes MCT7 mediates export of beta-hydroxybutyrate, a function required for
  secretion of ketone bodies into the circulation during fasting; loss of the transporter traps
  ketogenic carbon in the liver and causes hepatic steatosis. It also mediates facilitative, bidirectional
  (efflux-favouring) transport of taurine and is inhibited by other monocarboxylates and acidic amino
  acids. MCT7 resides in the basolateral plasma membrane of polarized epithelia and associates with the
  ancillary single-span proteins basigin/CD147 or embigin/GP70, which enhance its transport activity.
  It is expressed in liver, brain, choroid plexus, epididymis and retina, and human SLC16A6 variants are
  associated with adult height.
