- id: PMID:22302940
  title: A monocarboxylate transporter required for hepatocyte secretion of ketone
    bodies during fasting.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Hugo et al. 2012 (Genes Dev). Zebrafish red moon (rmn) mutant maps to slc16a6a, shown to encode a
      beta-hydroxybutyrate transporter; loss causes fasting hepatic steatosis. Critically, human SLC16A6
      rescues the mutant, directly linking the human protein to ketone body (beta-hydroxybutyrate) export.
      PubMed-verified; abstract-only in cache, but the cached abstract text is checked by validate-quotes.
- id: PMID:30692937
  title: The Monocarboxylate Transporter SLC16A6 Regulates Adult Length in Zebrafish
    and Is Associated With Height in Humans.
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Karanth & Schlegel 2019 (Front Physiol). Reaffirms zebrafish slc16a6 mutants cannot export
      beta-hydroxybutyrate; human SLC16A6 variants genome-wide associated with height. Supports the
      monocarboxylate/ketone-body transport role across tissues. Abstract-only in cache.
- id: PMID:35257743
  title: Mammalian monocarboxylate transporter 7 (MCT7/Slc16a6) is a novel facilitative
    taurine transporter.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Higuchi et al. 2022 (JBC). Mechanistic characterization of mammalian MCT7 as a low-affinity,
      pH-independent facilitative taurine transporter in human HEK293T and polarized Caco-2 cells,
      localized basolaterally, enhanced by basigin/CD147 and embigin/GP70. The directly assayed construct
      is the rat ortholog (per the authors' 2024 review), so human taurine activity is ISS-propagated.
      Full text available in cache (full_text_available: true) and checked by validate-quotes; the cached
      Methods confirm the rat-derived construct ("cDNA was synthesized from Wistar rat intestines or brains").
- id: PMID:39617467
  title: '[Analysis of Endogenous Metabolite Transporters for the Development of Novel
    Pharmaceutical Therapies and Drug Targets].'
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Higuchi 2024 review. Clarifies that taurine was identified as a substrate of rat Slc16a6/MCT7,
      and that MCT7 transport (unlike MCT6/MCT13) is unaffected by extracellular chloride and potassium,
      consistent with simple facilitative transport. Japanese-language review; abstract-only in cache.
