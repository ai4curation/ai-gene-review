    label: taurine zwitterion
  supported_by:
  - reference_id: file:human/SLC16A6/SLC16A6-uniprot.txt
    record_section: ["CC:FUNCTION"]
    supporting_text: Monocarboxylate transporter selective for taurine.
  - reference_id: PMID:35257743
    supporting_text: taurine is a novel substrate of MCT7
proposed_new_terms:
- proposed_name: beta-hydroxybutyrate transmembrane transport
  proposed_definition: >-
    The directed movement of beta-hydroxybutyrate, the conjugate base of (R)-3-hydroxybutyric acid,
    across a membrane by means of a transmembrane transporter.
  justification: >-
    GO provides the molecular function GO:0097253 (beta-hydroxybutyrate transmembrane transporter
    activity) but no matching specific biological-process term; the most specific available process for
    MCT7-mediated ketone body export is GO:0015718 monocarboxylic acid transport. A dedicated BP term
    would let the physiologically important hepatocyte ketone-body export role be annotated precisely.
  proposed_parent:
    id: GO:0015718
    label: monocarboxylic acid transport
suggested_questions:
- question: >-
    Does the human SLC16A6 protein itself (not the rat ortholog) directly transport taurine, and what is
    its full endogenous substrate range beyond beta-hydroxybutyrate and taurine?
- question: >-
    Which tissues depend on MCT7 for beta-hydroxybutyrate export in mammals, and does human MCT7
    deficiency produce a ketone-handling or metabolic phenotype analogous to the zebrafish mutant?
- question: >-
    Are basigin/CD147 and embigin/GP70 obligatory ancillary subunits for human MCT7 surface expression
    and activity, and does the choice of ancillary protein determine substrate preference or polarity?
suggested_experiments:
- description: >-
    Express human SLC16A6 in a heterologous system (e.g. Xenopus oocytes or HEK293 cells) with and
    without basigin/embigin and measure radiolabelled beta-hydroxybutyrate and taurine flux to directly
    establish the human protein's substrate kinetics, directionality, and ion-dependence.
- description: >-
    Generate SLC16A6 loss-of-function human hepatocyte or liver-organoid models and quantify intracellular
    versus secreted beta-hydroxybutyrate under fasting/ketogenic conditions to test conservation of the
    hepatocyte ketone-export role.
