id: O94760
gene_symbol: DDAH1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  DDAH1 is a cytosolic dimethylargininase that hydrolyzes the endogenous nitric
  oxide synthase inhibitors asymmetric dimethylarginine (ADMA) and
  N(G)-monomethyl-L-arginine (L-NMMA) to L-citrulline plus the corresponding
  alkylamine. By lowering ADMA and L-NMMA, DDAH1 relieves NOS inhibition and
  promotes nitric oxide production, with documented roles in vascular nitric oxide
  bioavailability and pulmonary vascular responses to hypoxia.
