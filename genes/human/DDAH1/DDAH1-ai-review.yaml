suggested_questions:
- question: What fraction of human tissue-specific ADMA and L-NMMA turnover is handled by DDAH1 versus alternative clearance pathways?
- question: Which DDAH1 pools drive the pulmonary endothelial miR-21/hypoxia phenotypes most directly?
suggested_experiments:
- description: >-
    Combine acute DDAH1 knockout or degron-mediated depletion with targeted ADMA and
    L-NMMA metabolomics in endothelial, neuronal and renal cell types.
- description: >-
    Rescue hypoxic primary pulmonary endothelial cells with catalytically active and
    inactive DDAH1 alleles to separate dimethylarginine hydrolysis from any scaffold-like
    effects on vascular barrier phenotypes.
