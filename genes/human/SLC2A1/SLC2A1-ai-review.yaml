core_functions:
- description: 'Facilitative (uniport) D-glucose transport across the plasma membrane by alternating access: GLUT1 mediates constitutive, energy-independent glucose uptake, most critically across the erythrocyte membrane and the blood-brain barrier.'
  molecular_function:
    id: GO:0055056
    label: D-glucose transmembrane transporter activity
  directly_involved_in:
  - id: GO:1904659
    label: D-glucose transmembrane transport
  - id: GO:0098708
    label: D-glucose import across plasma membrane
  locations:
  - id: GO:0005886
    label: plasma membrane
  in_complex:
    id: GO:1990350
    label: glucose transporter complex
  supported_by:
  - reference_id: PMID:24847886
    supporting_text: The glucose transporter GLUT1 catalyses facilitative diffusion of glucose into erythrocytes and is responsible for glucose supply to the brain and other organs
  - reference_id: PMID:1714544
    supporting_text: Defective glucose transport across the blood-brain barrier as a cause of persistent hypoglycorrhachia, seizures, and developmental delay
- description: Transport of dehydroascorbic acid (oxidized vitamin C) across the plasma membrane; GLUT1 is a major route of cellular vitamin C uptake (apparent Km ~1.1 mM), with imported DHA reduced to ascorbate intracellularly.
  molecular_function:
    id: GO:0033300
    label: dehydroascorbic acid transmembrane transporter activity
  directly_involved_in:
  - id: GO:0070837
    label: dehydroascorbic acid transport
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:9228080
    supporting_text: apparent Km of DHA transport via GLUT1 and GLUT3 was 1.1 +/- 0.2 and 1.7 +/- 0.3 mM, respectively
  - reference_id: PMID:10862609
    supporting_text: transported by GLUT1 and GLUT3 in Xenopus laevis oocytes with transport rates similar to that of 2-deoxyglucose (2-DG)
