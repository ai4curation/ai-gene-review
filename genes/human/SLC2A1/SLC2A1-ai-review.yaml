- term:
    id: GO:1904659
    label: D-glucose transmembrane transport
  evidence_type: IDA
  original_reference_id: PMID:1429721
  qualifier: involved_in
  review:
    summary: D-glucose transmembrane transport is a core process for GLUT1, uniquely capturing the glucose efflux that its import-only child term does not cover.
    action: ACCEPT
    reason: GLUT1 is a bidirectional facilitative uniporter that moves D-glucose down its concentration gradient in either direction, so the import-only child GO:0098708 'D-glucose import across plasma membrane' does not entail this bidirectional parent. GO:1904659 uniquely captures GLUT1-mediated glucose efflux (e.g. the astrocyte and blood-brain-barrier endothelial transcellular route, where glucose exits across the far membrane). A genuine, informative GLUT1 process.
