id: P11166
gene_symbol: SLC2A1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'SLC2A1 (GLUT1) is the archetypal facilitative glucose transporter: a 12-transmembrane-helix member of the Major Facilitator Superfamily (sugar porter family, TC 2.A.1.1) that moves D-glucose across membranes by energy-independent facilitated diffusion (a uniporter following the substrate concentration gradient; it is not Na+-coupled and does not perform active transport). Through an alternating-access mechanism it mediates constitutive, basal glucose uptake and has broad specificity for aldoses including pentoses and hexoses. It is the principal glucose carrier of the erythrocyte membrane and of the blood-brain barrier, where it supplies glucose as the main energy source of the brain; it is also the major route of dehydroascorbic acid (oxidized vitamin C) uptake into many cells. GLUT1 resides predominantly in the plasma membrane (at both apical and basolateral surfaces of polarized epithelia and endothelia) and self-associates into redox-sensitive dimers and tetramers. Its surface level and activity are modulated by PKC phosphorylation, by hypoxia (as a HIF-1 target), and by interacting partners that control its trafficking and recycling. Loss-of-function variants cause GLUT1 deficiency syndrome and related paroxysmal neurological and haematological disorders.'
