- term:
    id: GO:0005324
    label: long-chain fatty acid transmembrane transporter activity
  evidence_type: IMP
  original_reference_id: PMID:10227690
  qualifier: enables
  review:
    summary: Long-chain fatty acid transport attributed to GLUT1.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'Biologically implausible for GLUT1: it is a sugar porter with a sugar-specific binding site and broad specificity for aldoses, not fatty acids; long-chain fatty acid uptake is mediated by dedicated transporters (SLC27/FATP, CD36). The single ARUK-UCL IMP points to PMID:10227690, a GLUT1 deficiency clinical report concerning glucose transport, which does not establish fatty-acid transport.'
    supported_by:
    - reference_id: file:human/SLC2A1/SLC2A1-uniprot.txt
      supporting_text: Has a very broad substrate specificity; can transport a wide range of aldoses including both pentoses and hexoses
      record_section: ["CC:FUNCTION"]
