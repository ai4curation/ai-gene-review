  label: Homo sapiens
description: 'BCO1 is the cytosolic beta,beta-carotene 15,15''-dioxygenase that performs central oxidative
  cleavage of dietary provitamin A carotenes, especially beta-carotene, to all-trans-retinal. Its non-heme
  iron dioxygenase reaction supplies retinal that can be reduced to retinol for intestinal vitamin A absorption
  or feed retinoid pools in other epithelia.'
