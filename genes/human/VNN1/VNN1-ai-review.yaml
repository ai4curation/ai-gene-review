    label: positive regulation of oxidative stress-induced intrinsic apoptotic signaling
      pathway
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q9Z0K8
  - ensembl:ENSMUSP00000040599
  review:
    summary: VNN1/Vnn1-derived cysteamine can sensitize tissues to oxidative injury;
      the intrinsic-apoptotic-signaling term overstates this indirect redox effect.
    action: MARK_AS_OVER_ANNOTATED
    reason: The abstract-only source for this row reports that Vanin-1 knockout protects
      mice from irradiation- or paraquat-induced oxidative injury and is correlated
      with reduced apoptosis, reversible by cystamine. This whole-animal oxidative-injury
      phenotype is downstream of cysteamine production and does not show that VNN1
      performs a step in the intrinsic apoptotic signaling pathway.
    supported_by:
    - reference_id: PMID:15282320
      supporting_text: This protection is correlated with reduced apoptosis and inflammation
        and is reversed by treating mutant animals with cystamine.
- term:
    id: GO:1902177
    label: positive regulation of oxidative stress-induced intrinsic apoptotic signaling
      pathway
  evidence_type: ISS
  original_reference_id: PMID:15282320
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q9Z0K8
  review:
    summary: The mouse oxidative-injury study supports a cysteamine-dependent oxidative
      stress effect of Vnn1, but not direct execution of intrinsic apoptotic signaling.
    action: MARK_AS_OVER_ANNOTATED
    reason: VNN1 is not an apoptotic signaling protein, but the pantetheinase product
      cysteamine shifts tissue glutathione stores and sensitizes mouse tissue to oxidative
      injury. That places apoptosis downstream of the diffusible pantetheinase product,
      but does not make VNN1 an intrinsic apoptotic signaling protein.
    supported_by:
    - reference_id: PMID:15282320
      supporting_text: Vanin-1(-/-) mice, which lack cysteamine in tissues, exhibit
        resistance to oxidative injury induced by whole-body gamma-irradiation or
        paraquat.
