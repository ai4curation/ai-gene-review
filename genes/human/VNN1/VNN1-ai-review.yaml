  review:
    summary: Reactome includes VNN1 among GPI-anchored surface proteins that can be
      released by GPLD1; extracellular localization is plausible for shed VNN1 but
      peripheral to the main plasma-membrane pool.
    action: KEEP_AS_NON_CORE
    reason: Human VNN1 has a signal peptide, extracellular catalytic domain and GPI
      anchor, so its mature domain is exposed on the cell exterior and could be released
      by GPI-anchor cleavage. The cached Reactome GPLD1 summary describes this generic
      route for GPI-anchored proteins rather than source-specific VNN1 shedding, so
      this broad extracellular row is kept as non-core beside the better supported
      plasma-membrane rows.
