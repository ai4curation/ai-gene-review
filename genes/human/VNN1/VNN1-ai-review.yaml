id: O95497
gene_symbol: VNN1
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: VNN1 encodes vanin-1, a glycosylphosphatidylinositol-anchored ectoenzyme
  on the plasma membrane that hydrolyses D-pantetheine to pantothenate (vitamin
  B5) and cysteamine. The human enzyme belongs to the nitrilase-like carbon-nitrogen
  hydrolase superfamily and is one of the mammalian vanin pantetheinases, distinct
  from the related biotinidase branch. Its conserved catalytic activity recycles pantothenate
  from extracellular pantetheine and, through cysteamine production, can tune glutathione
  pools, oxidative-stress sensitivity and inflammatory responses in epithelial tissues.
