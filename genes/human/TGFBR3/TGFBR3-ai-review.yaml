- term:
    id: GO:0005539
    label: glycosaminoglycan binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - MGI:MGI:104637
  - PANTHER:PTN002678643
  - RGD:61821
  - UniProtKB:Q90998
  review:
    summary: Glycosaminoglycan binding (IBA).
    action: MARK_AS_OVER_ANNOTATED
    reason: 'Betaglycan is a proteoglycan: its ectodomain is covalently substituted with heparan sulfate
      and chondroitin sulfate chains. The cited cloning paper only identifies GAG attachment sites. Carrying
      covalent GAG chains is not the molecular function of binding a glycosaminoglycan; no evidence was
      found that the core protein binds free GAGs non-covalently as a function. The PAINT node propagated
      this from rodent annotations, but the underlying observation appears to be GAG substitution rather
      than binding.'
    supported_by:
    - &id011
      reference_id: PMID:1333192
      supporting_text: Potential glycosaminoglycan attachment sites were found in the extracellular domain
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - ROLE_CONFLATION
      source_entities:
      - source_id: PANTHER:PTN002678643
        comment: Target is inside the clade; the node's GAG binding IBD (seeded by rodent annotations)
          appears to conflate covalent GAG substitution of the proteoglycan with non-covalent GAG binding.
        source_status: UNRESOLVED
