- term:
    id: GO:0006955
    label: immune response
  evidence_type: IMP
  original_reference_id: PMID:16886151
  qualifier: involved_in
  review:
    summary: IMP from a candidate-gene SNP association study of bacteremia in sickle cell anemia.
    action: REMOVE
    reason: A genetic association between TGFBR3 polymorphisms and bacteremia risk does not show that
      TGFBR3 participates in an immune response; the abstract only suggests a possible role. IMP is not
      an appropriate reading of an association study.
    supported_by:
    - reference_id: PMID:16886151
      supporting_text: We found significant associations with SNPs in IGF1R and genes of the TGF-beta
        /BMP pathway (BMP6, TGFBR3, BMPR1A, SMAD6 and SMAD3)
- term:
    id: GO:0007179
    label: transforming growth factor beta receptor signaling pathway
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:104637
  - PANTHER:PTN002678643
  - RGD:61821
  - UniProtKB:Q03167
  review:
    summary: TGF-beta receptor signaling pathway.
    action: ACCEPT
    reason: TGFBR3 binds TGF-beta (especially TGF-beta2), presents it to TGFBR2 and promotes formation
      of the TGFBR2/TGFBR1 signaling complex; increased TGFBR3 enhances TGF-beta responses and its loss
      reduces TGF-beta2 sensitivity. This is a core process for the gene, consistent with the IBA from
      PTN002678643.
    supported_by:
    - &id019
      reference_id: PMID:11323414
      supporting_text: thus promoting the preferential formation of a complex between the autophosphorylated
        type II receptor and the type I receptor and then dissociating from this active signaling complex
    - &id020
      reference_id: PMID:11546783
      supporting_text: increased expression of the type III receptor is sufficient to enhance TGF-beta
        signaling
    - &id021
      reference_id: PMID:12773577
      supporting_text: TbetaRIII-null cells exhibited significantly reduced sensitivity to TGFbeta2 in
        terms of growth inhibition, reporter gene activation, and Smad2 nuclear localization
