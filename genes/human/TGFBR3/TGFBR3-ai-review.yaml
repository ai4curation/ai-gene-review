    label: response to hypoxia
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P26342
  - ensembl:ENSRNOP00000002867
  review:
    summary: Ensembl Compara transfer from rat betaglycan of a response-to-hypoxia annotation.
    action: MARK_AS_OVER_ANNOTATED
    reason: Response terms of this kind are typically based on altered expression of the rodent gene under
      hypoxia; they describe TGFBR3 as a regulated readout rather than a participant in the cellular response.
      No human evidence for a hypoxia role was found, and it does not reflect the coreceptor function
      of the protein.
- term:
    id: GO:0001837
    label: epithelial to mesenchymal transition
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN002678643
  - UniProtKB:Q03167
  - UniProtKB:Q90998
  review:
    summary: Epithelial to mesenchymal transition (IBA). Betaglycan is required for TGF-beta2- and BMP2-driven
      endocardial and epicardial EMT and invasion; the IBA comes from PAINT node PTN002678643 (Euteleostomi
      TGFBR3 clade), seeded by the human IDA.
    action: KEEP_AS_NON_CORE
    reason: 'TGFBR3 does part of the work of EMT in these settings: as the ligand-binding coreceptor that
      initiates TGF-beta2/BMP2 signaling into the Par6/Smurf1/RhoA pathway, and via its GIPC-binding cytoplasmic
      tail. EMT is a context-specific cellular outcome (cardiac cushion and epicardium) rather than the
      core molecular role, so it is retained as non-core. Note that in carcinoma cells TGFBR3 overexpression
      instead suppresses EMT, reinforcing that the direction is context-dependent.'
    additional_reference_ids:
    - PMID:22033038
    - PMID:29130787
    supported_by:
    - &id001
      reference_id: PMID:18184661
      supporting_text: BMP-2 specifically stimulates TbetaRIII-mediated epithelial to mesenchymal cell
        transformation
    - &id002
      reference_id: PMID:22033038
      supporting_text: the Par6/Smurf1/RhoA pathway is activated downstream of TGFβR3 in epicardial cells
    - &id003
      reference_id: PMID:29130787
      supporting_text: transfection of a TGFBR3-containing plasmid dramatically inhibited epithelial-to-mesenchymal
        transition (EMT) and migration in CAL-27 cells
