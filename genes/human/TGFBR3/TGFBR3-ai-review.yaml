  review:
    summary: IDA from Kirkbride et al. 2008 showing that betaglycan binds BMPs and enhances BMP signaling.
    action: MODIFY
    reason: TGFBR3 has no kinase or other signaling domain of its own; it binds BMPs and enhances ligand
      binding to the BMP type I receptors, which transduce the signal. This is coreceptor activity rather
      than an autonomous transmembrane signaling receptor activity, so the more accurate term is coreceptor
      activity (already carried by IDA for inhibin).
