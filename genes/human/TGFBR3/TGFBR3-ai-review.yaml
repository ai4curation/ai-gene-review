suggested_questions:
- question: Does the human TGFBR3 core protein bind glycosaminoglycans or heparin non-covalently, or do
    the existing glycosaminoglycan/heparin binding annotations (including the PAINT IBD at PTN002678643)
    reflect its covalent GAG substitution? If the latter, should the IBD be revisited?
- question: What experiments underlie the mouse NOT annotations to regulation of JNK and ERK1/2 cascades
    that were transferred by ISS to human TGFBR3, and are they valid in human cells?
- question: Is betaglycan required for inhibin action in human gonadotropes, given that in mouse it is
    needed for inhibin A but not inhibin B, with TGFBR3L acting as the inhibin B coreceptor?
suggested_experiments:
- hypothesis: TGFBR3 is required for inhibin A-mediated suppression of FSH in human pituitary gonadotropes.
  description: CRISPR knockout of TGFBR3 (and TGFBR3L) in human gonadotrope-like cells or pituitary organoids,
    measuring inhibin A and inhibin B suppression of activin-induced FSHB transcription.
  experiment_type: genetic and cell-based assay
- hypothesis: The ligand-independent anti-migratory function of TGFBR3 depends solely on beta-arrestin
    2 binding via phospho-Thr841.
  description: Rescue of TGFBR3-null human epithelial cells with wild-type, T841A, PDZ-motif-deleted and
    ectodomain-only constructs, measuring Cdc42 activation, random migration and NF-kappaB activity.
  experiment_type: structure-function cell biology
