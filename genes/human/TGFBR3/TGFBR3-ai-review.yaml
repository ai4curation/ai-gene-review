id: Q03167
gene_symbol: TGFBR3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'TGFBR3 (betaglycan) is a single-pass type I transmembrane proteoglycan and the most abundant
  TGF-beta binding protein at the cell surface. Its large ectodomain, comprising an endoglin-like N-terminal
  region and a zona pellucida (ZP) domain and substituted with heparan sulfate and chondroitin sulfate
  chains, binds all three TGF-beta isoforms (with highest affinity for TGF-beta2), inhibins, and several
  BMPs and GDF5. Lacking any kinase domain, it acts as a coreceptor: it presents TGF-beta to the type
  II receptor TGFBR2 and promotes assembly of the TGFBR2-TGFBR1 signaling complex, forms the high-affinity
  inhibin receptor together with ActRII (allowing inhibin to antagonize activin signaling, e.g. FSH suppression
  in pituitary gonadotropes), and enhances BMP signaling through ALK3 and ALK6. The short cytoplasmic
  tail is phosphorylated by TGFBR2 at Thr841, which recruits beta-arrestin 2 to drive endocytosis of TGFBR3
  with its partner receptors; a C-terminal class I PDZ motif binds GIPC1, stabilizing TGFBR3 at the surface.
  Through beta-arrestin 2, TGFBR3 also has ligand-independent activities, activating Cdc42 to restrain
  epithelial cell migration, inhibiting NF-kappaB signaling and regulating integrin alpha5beta1 trafficking
  and adhesion to fibronectin. Ectodomain shedding by membrane-type MMPs releases a soluble form into
  serum and extracellular matrix that sequesters TGF-beta. In mouse, Tgfbr3 is essential for embryonic
  development, being required in epicardial cells for EMT and invasion that underlie coronary vessel formation.
  TGFBR3 expression is frequently lost in human cancers, where it behaves as a suppressor of migration
  and invasion.'
