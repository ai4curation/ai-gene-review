- term:
    id: GO:0010628
    label: positive regulation of gene expression
  evidence_type: IMP
  original_reference_id: PMID:30467960
  qualifier: involved_in
  review:
    summary: IMP from siRNA knockdown of TGFBR3 in HUVECs reducing VEGFC and MMP9 mRNA.
    action: MARK_AS_OVER_ANNOTATED
    reason: Reduced expression of two downstream genes after partial knockdown is an indirect consequence
      of altered TGF-beta superfamily signaling; TGFBR3 does not itself regulate gene expression. Positive
      regulation of gene expression is an uninformative over-interpretation.
    supported_by:
    - reference_id: PMID:30467960
      supporting_text: only VEGFC and MMP9 mRNA levels significantly decreased, whereas mRNA levels of
