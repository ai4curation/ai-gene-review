- description: 'Beta-arrestin 2 adaptor function of the cytoplasmic tail: after TGFBR2 phosphorylation
    at Thr841, recruits beta-arrestin 2 to internalize TGFBR3 with partner receptors (down-regulating
    TGF-beta signaling) and, independently of ligand, to activate Cdc42 and inhibit epithelial cell migration
    and NF-kappaB signaling.'
