  original_reference_id: PMID:10746731
  review:
    summary: Betaglycan is the inhibin coreceptor that enables inhibin to antagonize activin signaling.
    action: NEW
    reason: 'Participation test: TGFBR3 itself does the work, binding inhibin and forming the inhibin-betaglycan-ActRII
      complex that sequesters type II activin receptors; it is not merely a target or substrate. Betaglycan
      confers inhibin sensitivity to otherwise poorly responsive cells, and gonadotrope-specific Tgfbr3
      knockout in mouse abolishes inhibin A suppression of FSH. This complements the accepted inhibin-betaglycan-ActRII
      complex and coreceptor activity annotations.'
