- term:
    id: GO:0005829
    label: cytosol
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-9839388
  qualifier: located_in
  review:
    summary: Reactome TAS to cytosol, from the TGFBR3 translation / plasma-membrane translocation reactions.
    action: REMOVE
    reason: TGFBR3 has an N-terminal signal peptide and a single type I transmembrane segment; it is synthesized
      into the secretory pathway and does not reside in the cytosol. The cytosol compartment is an artifact
      of how the Reactome reactions model translation and trafficking.
    supported_by:
    - &id015
      reference_id: file:human/TGFBR3/TGFBR3-uniprot.txt
      supporting_text: type I membrane protein {ECO:0000255}
    - &id016
      reference_id: Reactome:R-HSA-9839388
      supporting_text: TGFBR3 is a transmembrane glycoprotein which localises to the plasma where it participates
        in ligand binding and induces signaling
