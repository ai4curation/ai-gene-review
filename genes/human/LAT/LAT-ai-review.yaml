suggested_questions:
- question: Should the LAT-dependent inside-out activation of beta1 integrins after TCR engagement be
    captured as positive regulation of integrin activation on LAT, or only on downstream effectors (e.g.
    ADAP/SKAP, RAP1)?
- question: Is the mouse Lat 'COP9 signalosome' annotation (UniProt IDA, PMID:22561606) a term-selection
    error for 'TCR signalosome', and should it be corrected at source?
- question: Does LAT Y136 (mouse; Y132 human) phosphorylation-dependent negative feedback, revealed by
    LatY136F lymphoproliferation, warrant a negative regulation term, or is it best viewed as a consequence
    of loss of the PLCG1 docking site?
- question: A large LAT pool resides on intracellular vesicles that cycle through the Golgi/TGN (Rab6/syntaxin-16
    retrograde, VAMP7/GMAP210 anterograde) and is recruited to the immunological synapse after surface LAT
    is phosphorylated. Should LAT carry a cellular component annotation for this compartment (e.g. intracellular
    vesicle or trans-Golgi network), and does vesicular LAT itself act as a signaling scaffold or mainly
    as a delivery reservoir for the plasma membrane pool?
- question: Is the reported DNA-PKcs phosphorylation of LAT S224/S241 (currently a single 2025 bioRxiv
    preprint) reproducible in peer-reviewed work, and which isoform numbering do these residues follow?
suggested_experiments:
- hypothesis: Vesicular LAT contributes signaling capacity at the synapse beyond replenishing surface LAT.
  description: In LAT-deficient human T cells, express LAT variants restricted to the plasma membrane or
    retained in the vesicular pool (e.g. by disrupting Rab6- or VAMP7-dependent traffic) and compare microcluster
    phosphorylation, PLCG1 recruitment and calcium/ERK output at the synapse.
- hypothesis: Condensate formation by multivalent phospho-LAT contributes to TCR signal amplification
    beyond simple effector docking.
  description: Reconstitute human LAT condensates with PLCG1, GRB2-SOS1 and GRAP2-LCP2 in LAT-deficient
    human T cells expressing valency mutants, measuring condensate formation and Ras/calcium output by
    live imaging, to test whether condensate scaffolding is separable from simple adaptor docking.
- hypothesis: IMD52 variants differ in which LAT scaffold functions they abolish.
  description: Profile IMD52 patient LAT variants for membrane targeting, phosphorylation and effector
    docking to determine which scaffold functions are lost in human disease.
