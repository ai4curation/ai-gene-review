  review:
    summary: IPI protein binding between LAT and ZAP70 (P43403) (PMID:12646565).
    action: REMOVE
    reason: ZAP70 is the kinase that phosphorylates LAT; the interaction is enzyme-substrate and does
      not indicate a LAT molecular function. Bare protein binding (GO:0005515) is uninformative about LAT function. Removal does not dispute
      the reported interaction; LAT's function as a phosphotyrosine-dependent scaffold is captured by
      GO:0030159 signaling receptor complex adaptor activity and GO:0035591 signaling adaptor activity.
