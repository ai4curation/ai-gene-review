  title: Falcon deep research report for human LAT
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: >-
      Provider-generated literature synthesis (Edison/falcon) drawing mostly on two reviews (Shah 2021,
      Fernandez-Aguilar 2023) and three preprints (Rubin 2024 bioRxiv, Rainwater 2025 bioRxiv, Saez
      bioRxiv). Its core scaffold, docking-site and pathway claims agree with the primary papers already
      cited here. Its vesicular-trafficking claims were verified against peer-reviewed primary papers
      (PMID:29789604, PMID:23666293, PMID:29440364, and the published Saez paper PMID:33572370). Errors
      noted: it gives LAT as ~233 residues without saying this is the short isoform (UniProt canonical
      O43561-1 is 262 aa, so Y132/Y171/Y191/Y226 are short-isoform numbers); it attributes a 2026 Yamane
      et al. SLP-76/PLCgamma1 study to the 2021 Shah review; DNA-PKcs phosphorylation of S224/S241 rests
      on a single preprint. Not used as sole evidence for any annotation decision.
