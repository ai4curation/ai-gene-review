- term:
    id: GO:0007265
    label: Ras protein signal transduction
  evidence_type: IMP
  original_reference_id: PMID:12646565
  qualifier: involved_in
  review:
    summary: LAT Grb2/Gads and PLCgamma docking sites synergize to build TCR signaling assemblies; LAT
      recruits Grb2-SOS and PLCG1 (RasGRP) to activate Ras.
    action: ACCEPT
    reason: LAT directly scaffolds the Grb2-SOS and PLCG1 arms that activate Ras downstream of the TCR;
      Y132 is required for Ras pathway activation.
    supported_by:
    - reference_id: PMID:12646565
      supporting_text: We found that the phospholipase C gamma docking site of LAT and different Grb2/Gads
        docking sites function in an interdependent fashion and synergize to accumulate LAT, Grb2, and
        phospholipase C gamma in TCR signaling assemblies.
    - reference_id: PMID:11368773
      supporting_text: we demonstrate that Tyr(191) and Tyr(171) are required for T-cell activation and
        Tyr(132) is required for the activation of PLCgamma1 and Ras signalling pathways.
