id: O43561
gene_symbol: LAT
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: LAT (linker for activation of T cells) is a small, palmitoylated single-pass (type III) transmembrane
  adaptor protein of T cells, NK cells, mast cells and platelets with no catalytic activity. Palmitoylation
  of Cys26/Cys29 targets it to cholesterol-rich plasma membrane microdomains. Following TCR engagement,
  ZAP70 (and in other cells SYK) phosphorylates multiple cytoplasmic tyrosines (conventionally numbered
  Y132, Y171, Y191 and Y226 after the originally cloned 233-residue short isoform; Y161, Y200, Y220 and
  Y255 in the 262-residue canonical long isoform), creating SH2 docking sites for PLCG1 (Y132), GRB2/SOS1,
  GRAP2 (GADS)-SLP-76 (LCP2), the PI3K p85 subunit and VAV1. Multivalent phospho-LAT and its partners
  assemble into the TCR signalosome, forming liquid-like membrane condensates that concentrate kinases,
  exclude phosphatases and couple TCR triggering to calcium mobilization, Ras-MAPK activation, NFAT/AP-1
  activation and actin reorganization. Besides the plasma membrane pool, much of LAT resides on intracellular
  vesicles; surface LAT is phosphorylated first in microclusters, while vesicular LAT, cycled by Rab6/syntaxin-16-dependent
  retrograde transport to the Golgi/TGN and VAMP7/GMAP210-dependent anterograde delivery, is recruited
  later to the immunological synapse. LAT plays the same scaffold role downstream of FcepsilonRI in mast
  cells and the collagen receptor GPVI (and FcgammaRIIA) in platelets. LAT is essential for thymocyte development
  beyond the DN stage in mice, and loss-of-function mutations in humans cause combined immunodeficiency
  with autoimmunity (IMD52).
