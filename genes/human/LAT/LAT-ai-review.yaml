- term:
    id: GO:0005911
    label: cell-cell junction
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: located_in
  supporting_entities:
  - UniProtKB:O54957
  - ensembl:ENSMUSP00000032997
  review:
    summary: Ensembl Compara transfer of mouse Lat cell-cell junction localization (from an Rltpr/CD28
      study at the T cell immunological synapse).
    action: MODIFY
    reason: The source mouse annotation concerns the T cell-APC contact (immunological synapse), which
      is not a cell-cell junction in the epithelial sense; immunological synapse is the accurate term
      and is already supported by direct human evidence.
    proposed_replacement_terms:
    - id: GO:0001772
      label: immunological synapse
    additional_reference_ids:
    - PMID:23793062
    supported_by:
    - reference_id: PMID:23793062
      supporting_text: Engagement of TCR-CD28 at the immunological synapse resulted in the colocalization
        of CD28 with both wild-type and mutant Rltpr proteins.
    - reference_id: PMID:12646565
      supporting_text: Taken together our data suggest a synergistic assembly of multimolecular TCR.LAT
        signal transduction complexes in T cell plasma membrane domains.
- term:
    id: GO:0006954
    label: inflammatory response
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:1342293
  - PANTHER:PTN008356078
  review:
    summary: IBA for inflammatory response, seeded from mouse Lat IMP data (LatY136F/Lat3YF knock-in mice).
    action: MARK_AS_OVER_ANNOTATED
    reason: The source phenotype is a T cell lymphoproliferative disorder with allergic-type inflammation
      in LAT tyrosine mutant mice; this reflects dysregulated T cell signaling (necessity/ phenotype),
      not LAT executing an inflammatory response. LAT's process role is captured by T cell receptor and
      Fc receptor signaling pathways.
    additional_reference_ids:
    - PMID:16002666
    supported_by:
    - reference_id: PMID:16002666
      supporting_text: Mice with mutations of distinct LAT tyrosine residues (LatY136F and Lat3YF) develop
        lymphoproliferative disorders involving TCR alphabeta or gammadelta T cells that trigger symptoms
        resembling allergic inflammation.
    propagation_review:
      root_cause: SOURCE_WEAK_OR_INFERRED
      failure_modes:
      - ROLE_CONFLATION
      - CONTEXT_OR_TISSUE_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN008356078
        comment: LAT-clade node carrying the inflammatory response IBD; the node placement is fine for
          the family but the asserted process is a phenotype-level outcome.
        source_status: SOURCE_WEAK_OR_INFERRED
      - source_id: MGI:MGI:1342293
        comment: Mouse Lat IMP (PMID:16002666) is from LatY136F/Lat3YF knock-in mice whose dysregulated
          T cells cause allergic-type inflammation; this records necessity/phenotype, not LAT performing
          an inflammatory response.
        source_status: SOURCE_WEAK_OR_INFERRED
