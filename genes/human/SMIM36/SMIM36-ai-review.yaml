id: A0A1B0GVT2
gene_symbol: SMIM36
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  SMIM36 (small integral membrane protein 36) is a 93-amino-acid (about 10 kDa) protein
  encoded on chromosome 17q22. It has a single predicted helical transmembrane segment near
  the N-terminus (residues 14-34), followed by a cytoplasmic or luminal segment of about 60
  residues whose last 20 residues are predicted to be disordered and are rich in proline and
  glycine. It defines its own small protein family (Pfam SMIM36), with no recognised
  relationship to characterised proteins. Orthologues are found across bony vertebrates,
  including teleost fish. The protein has been detected by mass spectrometry, and its RNA
  is enriched in retina and testis. Its membrane localisation is predicted from sequence;
  the specific membrane, topology, partners and biological role are unknown. An intronic
  SMIM36 variant was associated with response to IL-17 pathway inhibitors in a small
  psoriasis cohort, but that variant is an expression QTL for the neighbouring MMD gene and
  says nothing about the SMIM36 protein. No functional study of SMIM36 has been published.
