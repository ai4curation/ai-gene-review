      intronic SNP; the authors link the SNP to MMD expression. No information on SMIM36
      protein function, and the association is unreplicated.
core_functions: []
suggested_questions:
- question: >-
    In which membrane and with which topology does SMIM36 reside in photoreceptors or
    spermatogenic cells, the cell types where its RNA is most abundant?
- question: >-
    Is the proline/glycine-rich disordered C-terminal tail a binding site for SH3, WW or
    other proline-recognising domains?
suggested_experiments:
- hypothesis: SMIM36 is a single-pass membrane protein of a defined compartment in retina or testis.
  description: >-
    Tag the endogenous locus in rat or zebrafish (Ensembl Compara lists orthologues in both
    but none in mouse), localise the protein in retina and testis with organelle markers, and
    identify partners of the C-terminal tail by proximity labelling. A zebrafish mutant would
    show whether the gene is needed for vision or fertility.
