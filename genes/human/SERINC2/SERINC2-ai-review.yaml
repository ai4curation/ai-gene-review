knowledge_gaps:
- gap_statement: The endogenous regulation and cellular consequences of SERINC2 scrambling are unknown.
  boundary: Purified SERINC2 flips NBD-PC in proteoliposomes, but available evidence does not define
    when endogenous SERINC2 is active or which leaflet-lipid changes it produces in living human cells.
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  status: OPEN
  significance: A plasma-membrane scramblase must be regulated to avoid constitutive collapse of lipid
    asymmetry, so this gap limits interpretation of SERINC2's normal cellular role.
  resolution: Use endogenous SERINC2 knockout/rescue with matched surface expression, catalysis-disrupting
    mutants, and leaflet-resolved lipid probes across candidate signaling states.
  provenance:
  - reference_id: file:human/SERINC2/SERINC2-notes.md
    supporting_text: Determine how endogenous SERINC2 activity is regulated
- gap_statement: The structural or membrane-context basis for SERINC2's lack of antiviral activity is
    unresolved.
  boundary: SERINC2 flips lipid probe in purified proteoliposomes and can be incorporated into virions,
    but it does not produce the SERINC3/SERINC5 antiviral phenotype or virion PS-asymmetry disruption.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: Separating scramblase activity from retroviral restriction is central to understanding
    which SERINC molecular features determine antiviral function.
  resolution: Compare SERINC2/SERINC3/SERINC5 chimeras and point mutants under matched expression for
    purified lipid flipping, surface abundance, virion incorporation, Env remodeling, PS exposure, and
    infectivity.
  provenance:
  - reference_id: file:human/SERINC2/SERINC2-notes.md
    supporting_text: Do not propagate the SERINC3/SERINC5 antiviral role to SERINC2.
- gap_statement: Functional differences among the four human SERINC2 isoforms are not established.
  boundary: Reviewed UniProt defines four SERINC2 isoforms, but the available functional studies do not
    resolve isoform-specific topology, localization, lipid specificity, or activity.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: Alternative sequence segments could alter trafficking or scramblase activity and explain
    context-specific SERINC2 functions.
  resolution: Express each isoform after endogenous SERINC2 deletion and compare topology, surface localization,
    purified lipid flipping, cellular lipid asymmetry, and candidate physiological phenotypes.
  provenance:
  - reference_id: file:human/SERINC2/SERINC2-notes.md
    supporting_text: Compare all four UniProt isoforms
suggested_questions:
- question: What endogenous signal or membrane context activates SERINC2 scrambling in human cells?
- question: Which SERINC2 structural features explain why it retains purified lipid-flipping activity
    but lacks SERINC3/SERINC5-like antiviral restriction?
- question: Do the four human SERINC2 isoforms differ in topology, localization, lipid specificity, or
    cellular activity?
suggested_experiments:
- hypothesis: SERINC2 scrambling is regulated by cell state or membrane context rather than being constitutively
    active at the plasma membrane.
  description: Profile leaflet lipid distributions in SERINC2 knockout and isoform-rescue cells across
    signaling, stress, and differentiation states while matching surface abundance and testing catalysis-disrupting
    mutants.
  experiment_type: Endogenous scramblase regulation and lipid-asymmetry profiling
- hypothesis: SERINC2 lacks antiviral activity because structural determinants outside the shared lipid-flipping
    core fail to remodel the HIV-1 envelope productively.
  description: Build SERINC2/SERINC5 chimeras and point mutants, then assay purified NBD-lipid flipping,
    virion incorporation, PS externalization, Env conformation, fusion intermediates, and infectivity
    under matched expression.
  experiment_type: SERINC paralog separation-of-function mutagenesis
- hypothesis: SERINC2 isoforms differ in membrane topology or trafficking, producing distinct cellular
    lipid outputs.
  description: Compare all four UniProt isoforms after endogenous SERINC2 deletion using topology mapping,
    surface biotinylation, live-cell localization, purified lipid-flipping assays, and rescue of any
    identified cellular lipid phenotype.
  experiment_type: Isoform-resolved trafficking and scramblase analysis
