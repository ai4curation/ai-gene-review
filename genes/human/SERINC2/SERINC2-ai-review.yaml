gene_symbol: SERINC2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SERINC2 is a multipass SERINC-family plasma-membrane protein with phospholipid scramblase
  activity. Direct purified-protein evidence shows SERINC2-dependent NBD-PC flipping in proteoliposomes,
  consistent with non-ATP-dependent bidirectional lipid movement. SERINC2 is
  incorporated into HIV-1 virions without restricting infectivity or disrupting virion phosphatidylserine
  asymmetry, distinguishing it from the antiviral SERINC3 and SERINC5 paralogs. Its endogenous cellular
  lipid outputs, regulatory conditions, and isoform-specific activities remain unresolved.
