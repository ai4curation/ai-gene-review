  qualifier: enables
  review:
    summary: C4-specific thiolase activity has conflicting experimental support and is distinct from the
      established broader long-chain thiolase function.
    action: UNDECIDED
    reason: GO:0003985 denotes the acetoacetyl-CoA/two-acetyl-CoA reaction, whereas GO:0003988 denotes
      general 3-oxoacyl-CoA thiolysis. Human liver-purified TFP lacked detectable C4 activity (PMID:1550553;
      PMID:8163672), but PMID:31980458 reports acetoacetyl-CoA turnover by a commercial recombinant human
      HADHB preparation. Different preparations and conditions prevent treating the older negative assay
      as universal. The newer assay does not establish physiological C4 flux or comparative substrate
      efficiency. Leave this specific claim unresolved rather than equating it with general thiolase activity
      or asserting absence. The IBA descends from PTN000432378; the challenge concerns target-specific
      substrate evidence, not donor count. The retained IBD snapshot and current family tree show no lineage
      loss; no new pruning node is asserted.
