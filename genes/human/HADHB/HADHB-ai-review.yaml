- term:
    id: GO:0003857
    label: (3S)-3-hydroxyacyl-CoA dehydrogenase (NAD+) activity
  evidence_type: TAS
  original_reference_id: PMID:1550553
  qualifier: enables
  review:
    summary: The 3-hydroxyacyl-CoA dehydrogenase catalytic site belongs to the alpha subunit HADHA; HADHB
      supplies the thiolase site.
    action: REMOVE
    reason: The original human liver study characterized the assembled trifunctional enzyme. Positive
      subunit-expression evidence in PMID:8135828 assigns hydratase/dehydrogenase activities to alpha
      and thiolase to beta; the human structures in PMID:29915090 and PMID:30850536 agree with this division.
      Loss of beta can destabilize the whole complex (PMID:8651282), which explains loss of all three
      activities without giving beta an alpha-subunit active site. This is a direct catalytic-attribution
      correction based on expression and structural evidence, not a conclusion from a paper title or the
      inability to access its full text.
    supported_by:
    - &id004
      reference_id: PMID:8135828
      supporting_text: Expression of this cDNA in mammalian cells yielded a polypeptide with the long-chain
        enoyl-CoA hydratase and long-chain 3-hydroxyacyl-CoA dehydrogenase activities.
      full_text_unavailable: true
    - *id002
    additional_reference_ids:
    - PMID:29915090
    - PMID:30850536
    - PMID:8651282
