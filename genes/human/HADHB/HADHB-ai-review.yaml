- id: PMID:1550553
  title: Human liver long-chain 3-hydroxyacyl-coenzyme A dehydrogenase is a multifunctional membrane-bound
    beta-oxidation enzyme of mitochondria.
  findings:
  - statement: Early characterization of the trifunctional enzyme complex from human liver. Described
      the enzyme as having hydratase, dehydrogenase, and thiolase activities, but did NOT determine which
      subunit carries which activity. The subunit-specific activities were later determined by PMID:8135828.
- id: PMID:7958339
  title: 'The mitochondrial long-chain trifunctional enzyme: 2-enoyl-CoA hydratase, 3-hydroxyacyl-CoA
    dehydrogenase and 3-oxoacyl-CoA thiolase.'
  findings:
  - statement: The retained record is bibliographic-only; the scientific contents of this individual source
      were not independently verified.
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: Native UniProt/GOA cite the record for TFP activities, but accessible cache has no abstract.
      No title-only mechanistic quotation is used.
- id: PMID:8135828
  title: Structural analysis of cDNAs for subunits of human mitochondrial fatty acid beta-oxidation trifunctional
    protein.
  findings:
  - statement: Human subunit-cDNA expression assigns hydratase/dehydrogenase to alpha and thiolase to
      beta. The accessible abstract does not establish an exhaustive absence of every other beta activity.
- id: PMID:18063578
  title: The layered structure of human mitochondrial DNA nucleoids.
  findings:
  - statement: The accessible abstract describes classes of human nucleoid-associated proteins, but does
      not identify HADHB-specific capture or cross-link results.
- id: PMID:20562859
  title: Network organization of the human autophagy system.
  findings:
  - statement: Autophagy network study identifying HADHB-GABARAPL1 interaction.
- id: PMID:21527675
  title: Human cytomegalovirus directly induces the antiviral protein viperin to enhance infectivity.
  findings:
  - statement: The abstract describes viperin redistribution to mitochondria, TFP interaction and reduced
      ATP generation. HADHB-specific ER topology, outer-membrane fractionation and infection-dependent
      localization are not established by that abstract.
- id: PMID:22658674
  title: Insights into RNA biology from an atlas of mammalian mRNA-binding proteins.
  findings:
  - statement: Interactome capture study identified HADHB among 860 RNA-binding proteins in HeLa cells.
      Many metabolic enzymes were unexpectedly found to bind RNA.
- id: PMID:28514442
  title: Architecture of the human interactome defines protein communities and disease networks.
  findings:
  - statement: Large-scale interactome study showing HADHB-HADHA interaction.
- id: PMID:29915090
  title: Cryo-EM structure of human mitochondrial trifunctional protein.
  findings:
  - statement: A 4.2-A human TFP cryo-EM structure resolves an alpha2-beta2 architecture. Its concave
      surface and detergent contacts suggest a membrane-association surface.
- id: PMID:30850536
  title: Crystal structure of human mitochondrial trifunctional protein, a fatty acid β-oxidation metabolon.
  findings:
  - statement: A 3.6-A human TFP crystal structure resolves the alpha2-beta2 assembly and catalytic sites.
      The structure supports a proposed substrate-channeling route; it is not a direct measurement of
      intermediate transfer.
- id: PMID:32243843
  title: Mitoregulin Controls β-Oxidation in Human and Mouse Adipocytes.
  findings:
  - statement: MTLN (mitoregulin) interacts with TFP to regulate beta-oxidation.
- id: PMID:33961781
  title: Dual proteome-scale networks reveal cell-specific remodeling of the human interactome.
  findings:
  - statement: Interactome study confirming HADHB-HADHA interaction.
- id: PMID:34800366
  title: Quantitative high-confidence human mitochondrial proteome and its dynamics in cellular context.
  findings:
  - statement: Mitochondrial proteome study confirming HADHB mitochondrial localization.
- id: PMID:40205054
  title: Multimodal cell maps as a foundation for structural and functional genomics.
  findings:
  - statement: Large-scale multimodal cell mapping study that integrated AP-MS interaction data and immunofluorescence
      imaging for over 5,100 proteins in U2OS cells; HADHB is included among the proteins covered by this
      global subcellular architecture map.
    supporting_text: Here we construct a global map of human subcellular architecture through joint measurement
      of biophysical interactions and immunofluorescence images for over 5,100 proteins in U2OS osteosarcoma
      cells.
    reference_section_type: ABSTRACT
- id: Reactome:R-HSA-1482775
  title: MLCL is acylated to CL by HADH (IM)
  findings:
  - statement: The linked GOA assertion is mitochondrial inner-membrane localization. A reaction title
      does not by itself assert that HADHB performs cardiolipin acylation; catalytic assignments and complex
      participation require separate review.
- id: Reactome:R-HSA-77271
  title: 3-Oxotetradecanoyl-CoA+CoA-SH<=>Lauroyl-CoA
  findings:
  - statement: Thiolase reaction in beta-oxidation pathway - appropriate for HADHB.
- id: Reactome:R-HSA-77277
  title: trans-Tetradec-2-enoyl-CoA+H2O<=>(S)-3-Hydroxytetradecanoyl-CoA
  findings:
  - statement: Hydratase reaction - this is actually HADHA's activity, but both subunits are annotated
      to the complex.
- id: Reactome:R-HSA-77283
  title: (S)-3-Hydroxytetradecanoyl-CoA+NAD<=>3-Oxotetradecanoyl-CoA+NADH+H
  findings:
  - statement: Dehydrogenase reaction - this is actually HADHA's activity.
- id: Reactome:R-HSA-77301
  title: trans-Hexadec-2-enoyl-CoA+H2O<=>(S)-3-Hydroxyhexadecanoyl-CoA
  findings:
  - statement: Enoyl-CoA hydratase reaction (C16 substrate) in mitochondrial beta-oxidation. This is the
      hydratase activity of the TFP complex, which is carried by the HADHA alpha subunit; HADHB is annotated
      through complex membership rather than direct catalysis.
- id: Reactome:R-HSA-77303
  title: (S)-3-Hydroxyhexadecanoyl-CoA+NAD<=>3-Oxopalmitoyl-CoA+NADH+H
  findings:
  - statement: 3-Hydroxyacyl-CoA dehydrogenase reaction (C16 substrate) in mitochondrial beta-oxidation.
      This dehydrogenase activity belongs to the HADHA alpha subunit of TFP; HADHB is annotated to this
      reaction only via complex membership.
- id: Reactome:R-HSA-77304
  title: 3-Oxopalmitoyl-CoA+CoA-SH<=>myristoyl-CoA
  findings:
  - statement: Thiolase reaction - appropriate for HADHB.
- id: Reactome:R-HSA-77309
  title: 3-Oxododecanoyl-CoA+CoA-SH<=>Decanoyl-CoA
  findings:
  - statement: This reaction concerns thiolysis within the fatty acid beta-oxidation pathway. The associated
      GOA row asserts inner-membrane localization. Native TFP activity on C6 and longer substrates prevents
      rejecting C6/C8 chemistry solely from a C10-C16 preference or a long-chain enzyme name.
- id: Reactome:R-HSA-77321
  title: 3-Oxohexanoyl-CoA+CoA-SH<=>Butanoyl-CoA
  findings:
  - statement: This reaction concerns thiolysis within the fatty acid beta-oxidation pathway. The associated
      GOA row asserts inner-membrane localization. Native TFP activity on C6 and longer substrates prevents
      rejecting C6/C8 chemistry solely from a C10-C16 preference or a long-chain enzyme name.
- id: Reactome:R-HSA-77329
  title: 3-Oxooctanoyl-CoA+CoA-SH<=>Hexanoyl-CoA
  findings:
  - statement: This reaction concerns thiolysis within the fatty acid beta-oxidation pathway. The associated
      GOA row asserts inner-membrane localization. Native TFP activity on C6 and longer substrates prevents
      rejecting C6/C8 chemistry solely from a C10-C16 preference or a long-chain enzyme name.
- id: Reactome:R-HSA-77340
  title: 3-Oxodecanoyl-CoA+CoA-SH<=>Octanoyl-CoA
  findings:
  - statement: This reaction concerns thiolysis within the fatty acid beta-oxidation pathway. The associated
      GOA row asserts inner-membrane localization. Native TFP activity on C6 and longer substrates prevents
      rejecting C6/C8 chemistry solely from a C10-C16 preference or a long-chain enzyme name.
- id: GO_REF:0000116
  title: Automatic Gene Ontology annotation based on Rhea mapping
  findings: []
- id: PMID:8163672
  title: Mitochondrial trifunctional protein deficiency. Catalytic heterogeneity of the mutant enzyme
    in two patients.
  findings: []
- id: PMID:8651282
  title: 'Molecular characterization of mitochondrial trifunctional protein deficiency: formation of the
    enzyme complex is important for stabilization of both alpha- and beta-subunits.'
  findings: []
- id: PMID:31980458
  title: Targeting viperin to the mitochondrion inhibits the thiolase activity of the trifunctional enzyme
    complex.
  findings:
  - statement: The primary full text reports acetoacetyl-CoA turnover by commercial recombinant human
      HADHB, conflicting with older native-complex C4-negative assays. The native cache remains abstract-only;
      the exact Methods excerpt and access limits are recorded in the manual research supplement.
- id: PMID:32513690
  title: A long noncoding RNA regulates inflammation resolution by mouse macrophages through fatty acid
    oxidation activation.
  findings:
  - statement: Mouse macrophage experiments connect lncFAO-Hadhb association and fatty-acid oxidation
      with late inflammatory responses. Cell-lysate acetoacetyl-CoA turnover is not isolated HADHB kinetics.
- id: PMID:41816300
  title: MALAT1 regulates human macrophage metabolism by interacting with HADHB.
  findings:
  - statement: Human macrophage RIP and perturbation experiments support a MALAT1-associated metabolic
      role for HADHB; direct specific binding remains unresolved and FAOBlue is a cell-level readout.
- id: PMID:20132223
  title: Histone acetylation and steroid receptor coactivator expression during clofibrate-induced rat
    hepatocarcinogenesis.
  findings:
  - statement: Rat peroxisomal TH associates with a PPARalpha-containing nuclear complex; the mapping
      of this experiment to Q60587 HADHB needs source-side checking.
- id: file:human/HADHB/HADHB-deep-research-manual.md
  title: 'HADHB: targeted evidence reconciliation'
core_functions:
- description: Catalyzes CoA-dependent thiolytic cleavage of medium- and long-chain 3-oxoacyl-CoAs to
    acetyl-CoA and shortened acyl-CoAs, completing a mitochondrial fatty acid beta-oxidation cycle within
    the HADHA-HADHB complex. The general thiolase term represents this established chemistry without requiring
    a physiological C4 role.
  molecular_function: *id005
  directly_involved_in:
  - id: GO:0006635
    label: fatty acid beta-oxidation
  locations:
  - id: GO:0005743
    label: mitochondrial inner membrane
  in_complex:
    id: GO:0016507
    label: mitochondrial fatty acid beta-oxidation multienzyme complex
  supported_by:
  - *id002
proposed_new_terms: []
suggested_questions:
- question: What explains the different C4-substrate results from native human TFP and commercial recombinant
    HADHB, and does HADHB carry meaningful acetoacetyl-CoA flux in vivo?
- question: Does human MALAT1 bind HADHB directly or through bridging proteins, and which interaction
    sites distinguish RNA-dependent metabolic regulation from generic RNA association?
- question: What assays support the curated HADHB outer-membrane, ER and nucleoid pools, and under which
    conditions are they present?
suggested_experiments:
- description: Compare purified native TFP and sequence-verified recombinant HADHB across C4, C6, C12
    and C16 3-oxoacyl-CoAs, with HADHB catalytic mutants, matched conditions and orthogonal product identification.
    Measure saturation kinetics before assigning physiological substrate roles.
  hypothesis: Assembly or preparation conditions contribute to the differing reported C4 activities.
- description: Reconstitute human HADHB-MALAT1 association using purified components and map cross-link
    sites; test mutations for effects on RNA binding and thiolysis separately.
  hypothesis: The cellular association may require bridging factors, while direct binding, if present,
    should survive their exclusion.
