id: P55084
gene_symbol: HADHB
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: HADHB encodes the beta subunit of mitochondrial trifunctional protein, a membrane-associated
  complex that performs three successive reactions of fatty acid beta-oxidation. HADHB catalyzes CoA-dependent
  cleavage of 3-oxoacyl-CoA to acetyl-CoA and an acyl-CoA shortened by two carbons; HADHA provides the
  preceding hydratase and dehydrogenase activities. Human structures show an alpha2-beta2 assembly associated
  with the mitochondrial inner membrane. The native enzyme acts on medium- and long-chain substrates,
  and its subunit association helps stabilize both proteins. Biallelic pathogenic HADHB variants can impair
  thiolysis and destabilize the complex, causing mitochondrial trifunctional protein deficiency with variable
  cardiomyopathy, myopathy and peripheral neuropathy.
