id: P38571
gene_symbol: LIPA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: LIPA encodes lysosomal acid lipase (LAL; cholesteryl ester hydrolase, EC 3.1.1.13), a glycosylated
  serine hydrolase of the acid lipase family that is synthesized as a preproprotein and acts in the lysosomal lumen
  at acid pH. It hydrolyzes cholesteryl esters and triacylglycerols, and also diacylglycerols, delivered to lysosomes
  by receptor-mediated endocytosis of low-density lipoproteins, releasing free cholesterol and fatty acids for use
  by the cell. Biallelic loss-of-function variants cause lysosomal acid lipase deficiency, which ranges from infantile-onset
  Wolman disease, with no residual activity, to the milder cholesteryl ester storage disease, in which residual
  activity remains.
