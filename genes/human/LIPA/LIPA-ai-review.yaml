- term:
    id: GO:0090122
    label: cholesterol ester hydrolysis involved in cholesterol transport
  evidence_type: IDA
  original_reference_id: PMID:7204383
  qualifier: involved_in
  review:
    summary: Proposed process not currently in GOA for LIPA. The GO definition (cholesterol esters hydrolyzed into
      free fatty acids and cholesterol in the lysosome, contributing to intracellular cholesterol transport) describes
      exactly the LAL reaction on endocytosed LDL cholesteryl esters, and the purified enzyme hydrolyzes cholesterol
      oleate directly.
    action: NEW
    reason: LAL is the enzyme that performs the lysosomal cholesteryl ester hydrolysis step that this term names;
      the only current GOA annotation is CES1 by TAS. The evidence is direct assay on the purified enzyme, which
      gives a Vmax and Km for cholesterol oleate, so this row takes IDA from PMID:7204383 rather than TAS from a
      review sentence - the same basis as its GO:0019433 sibling, which is the triacylglycerol half of the same
      purification.
