suggested_questions:
- question: 'GO:0090122 (cholesterol ester hydrolysis involved in cholesterol transport) is proposed here as a NEW
    annotation for LIPA, since its definition names the lysosomal step LAL performs. Its only current annotation
    is CES1 by TAS, and CES1 is a cytosolic/ER enzyme rather than a lysosomal one. Is the CES1 annotation
    intended, or should the term be understood as naming the lysosomal reaction alone?'
suggested_experiments:
- description: Measure residual cholesteryl ester and triacylglycerol hydrolase activities of a panel of CESD and
    Wolman missense LIPA variants expressed in a common system, to test whether the two activities are lost in parallel
    or can be dissociated.
