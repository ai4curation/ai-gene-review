description: LY6K (lymphocyte antigen 6 complex locus K) is a GPI-anchored member of the Ly6/uPAR family
  with a snake-toxin-like three-finger fold. It is normally a cancer-testis antigen expressed in testis,
  where the mouse ortholog is required for sperm migration into the oviduct and for sperm binding to the
  zona pellucida, acting in a complex with the GPI-anchored protein TEX101. The mature protein is attached
  to the extracellular leaflet of the plasma membrane by a GPI anchor (partitioning into membrane rafts)
  and is also found in the sperm acrosome. LY6K is aberrantly re-expressed in non-small-cell lung and
  esophageal squamous cell carcinomas, where it promotes cancer cell growth and a shed/soluble form serves
  as a serum tumor biomarker.
