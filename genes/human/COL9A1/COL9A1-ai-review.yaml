- id: PMID:17880280
  title: Trimerization of collagen IX alpha-chains does not require the presence of
    the COL1 and NC1 domains.
  findings:
  - statement: Collagen IX is a heterotrimer of three alpha chains built from three COL and four NC
      domains numbered from the C-terminus.
    supporting_text: Collagen IX is a heterotrimer of three alpha-chains, which consists of three
      COL domains (collagenous domains) (COL1-COL3) and four NC domains (non-collagenous domains)
      (NC1-NC4), numbered from the C-terminus.
    reference_section_type: ABSTRACT
  - statement: Collagen IX alpha chains can trimerize without COL1 and NC1, but the COL2-NC2 region
      alone does not suffice.
    supporting_text: Our results demonstrate that collagen IX alpha-chains can associate in the absence
      of COL1 and NC1 domains to form a triple helix, but the COL2-NC2 region alone is not sufficient
      for trimerization.
    reference_section_type: ABSTRACT
  - statement: Collagen IX folding is co-operative across multiple COL and NC domains, with COL1-NC1
      governing chain specificity.
    supporting_text: The results suggest that folding of collagen IX is a co-operative process involving
      multiple COL and NC domains and that the COL1-NC1 region is important for chain specificity.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: "Original indexed author postprint Methods, Results and Figure 3 caption were recovered and read separately from the unchanged normal abstract. Individually expressed full-length human alpha1 chains occur mainly as monomers and dimers in insect-cell conditioned medium analyzed under reducing/non-reducing conditions. The public source-evidence index provides the exact Results locator and short excerpt. This is contextual recombinant self-association, not a native homodimer or equivalent activity of engineered/natural shortened products; no downloaded PDF or figure-pixel claim."
- id: PMID:21659506
  title: NC4 Domain of cartilage-specific collagen IX inhibits complement directly
    due to attenuation of membrane attack formation and indirectly through binding
    and enhancing activity of complement inhibitors C4B-binding protein and factor
    H.
  findings:
  - statement: Recombinant alpha1(IX) NC4 inhibits C9 polymerization in a concentration-dependent
      manner, blocking lytic membrane attack complex assembly.
    supporting_text: Our results demonstrate that NC4 can function as a novel inhibitor of the complement
      system able to bind C4, C3, and C9 and to directly inhibit C9 polymerization and assembly of
      the lytic membrane attack complex.
    reference_section_type: ABSTRACT
  - statement: The concentration dependence of C9 inhibition was measured directly.
    supporting_text: NC4 inhibited C9 polymerization in a concentration-dependent manner
    reference_section_type: RESULTS
  - statement: NC4 separately binds C4b-binding protein and factor H and enhances their cofactor activity,
      which is a distinct mechanism from the direct C9 effect.
    supporting_text: NC4 also binds the complement inhibitors C4b-binding protein and factor H and
      enhances their cofactor activity in degradation of activated complement components C4b and C3b.
    reference_section_type: ABSTRACT
  - statement: The NC4 domain projects from the fibril surface and provides matrix-partner interaction
      sites.
    supporting_text: The NC4 domain projects out from the fibril surface and provides sites for interaction
      with other matrix components such as cartilage oligomeric matrix protein, matrilins, fibromodulin,
      and osteoadherin.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Genuine selected full original Methods/Results read. Recombinant
      NC4 directly inhibits C9 polymerization in solution and erythrocyte assays;
      it enhances low-dose FH/C4BP-dependent FI cleavage but does not itself serve
      as the FI cofactor. Intact collagen IX effects are explicitly speculative in
      the source. Human pAM104-2 NC4 provenance is independently authenticated in
      the indexed original Methods of reference16, PMID:19700767; it is not assumed
      identical to the earlier pGAT2-NC23 construct.
- id: PMID:19700767
  title: The tyrosine sulfate-rich domains of the LRR proteins fibromodulin and osteoadherin
    bind motifs of basic clusters in a variety of heparin-binding proteins, including
    bioactive factors.
  findings:
  - statement: The tyrosine-sulfate domains of fibromodulin and osteoadherin bind the collagen IX
      NC4 domain, placing NC4 among the heparin-binding proteins recognized by these basic-cluster
      ligands.
    supporting_text: The tyrosine sulfate domains also bound heparin-binding proteins such as basic
      fibroblast growth factor-2, thrombospondin I, MMP13, the NC4 domain of collagen IX, and interleukin-10.
    reference_section_type: ABSTRACT
  full_text_unavailable: true
