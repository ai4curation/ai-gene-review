      network before secretion into the extracellular space and organization into higher
      order structures.
    reference_section_type: DATABASE_ENTRY
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Actual event summary and a complete typed participant path to P20849
