- id: PMID:3473493
  title: Structure of the glycosaminoglycan domain in the type IX collagen-proteoglycan.
  findings:
  - statement: Type IX collagen is a major minor collagen of hyaline cartilage, built from three genetically
      distinct subunits.
    supporting_text: The molecules of this collagen are composed of three genetically distinct polypeptide
      subunits.
    reference_section_type: ABSTRACT
  - statement: The alpha1(IX) NC3 exon is shorter than the alpha2(IX) one and lacks the serine that
      carries the glycosaminoglycan side chain, so the glycosaminoglycan attachment is specific to
      alpha2(IX).
    supporting_text: By comparing the exons encoding the NC3 domain in the alpha 2(IX) and alpha 1(IX)
      genes, we find that the exon coding for the glycosaminoglycan attachment site in the alpha 2(IX)
      gene is 48 base pairs long, whereas the homologous alpha 1(IX) exon is 33 base pairs.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: MISCITED
    review_notes: "The complete original five PMC page images,4044–4048, were read in the bounded consultation. This is genuine chicken cartilage alpha1/alpha2 molecular characterization, including an alpha1 NC3 comparison; it does not support the specific organ-morphogenesis assertion. Article identity and molecular findings are valid; MISCITED is limited to that process attribution. The public source-evidence index links the original PMC page 4044 and its Materials and methods preparation paragraph, which explicitly identifies chicken embryonic cartilage. This organism attribution comes from the original page, not inference from the abstract."
- id: PMID:8660302
  title: 'Collagen type IX from human cartilage: a structural profile of intermolecular
    cross-linking sites.'
  findings:
  - statement: In human cartilage, type IX collagen is covalently cross-linked both to type II collagen
      and to other type IX molecules.
    supporting_text: in human cartilage, type IX collagen is covalently cross-linked to type II collagen
      and to other molecules of type IX collagen
    reference_section_type: ABSTRACT
  - statement: The conclusion rests on structural analysis and mapping of the individual cross-linking
      sites in native human cartilage collagen IX.
    supporting_text: we demonstrate by structural analysis and location of cross-linking sites
    reference_section_type: ABSTRACT
  - statement: Type IX collagen is a quantitatively minor cartilage collagen that associates with
      the surface of type II fibrils.
    supporting_text: Type IX collagen, a quantitatively minor collagenous component of cartilage,
      is known to be associated with and covalently cross-linked to type II collagen fibrils in chick
      and bovine cartilage.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Authentic original indexed human cartilage Methods/Results/Figures
      were read in the bounded consultation. Native II–IX and IX–IX chain cross-links
      support structural integration; an isolated alpha1–alpha1 homodimer is not established
      by those mapped sites.
