- id: PMID:17880280
  title: Trimerization of collagen IX alpha-chains does not require the presence of
    the COL1 and NC1 domains.
  findings:
  - statement: Collagen IX is a heterotrimer whose alpha chains each contain three collagenous
      (COL1-COL3) and four non-collagenous (NC1-NC4) domains.
    supporting_text: Collagen IX is a heterotrimer of three alpha-chains, which consists
      of three COL domains (collagenous domains) (COL1-COL3) and four NC domains (non-collagenous
      domains) (NC1-NC4)
    reference_section_type: ABSTRACT
  - statement: Chain association and triple-helix formation can occur without the COL1
      and NC1 domains, but the COL2-NC2 region alone is not sufficient, so folding of
      collagen IX is a cooperative process spanning several COL and NC domains.
    supporting_text: collagen IX alpha-chains can associate in the absence of COL1 and
      NC1 domains to form a triple helix, but the COL2-NC2 region alone is not sufficient
      for trimerization
    reference_section_type: ABSTRACT
  - statement: Constructs lacking COL1-NC1 trimerize with reduced chain-selection fidelity,
      identifying the COL1-NC1 region as the determinant of chain specificity.
    supporting_text: the specificity of chain selection was diminished compared with
      full-length chains
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: "Original indexed author postprint Methods, Results and Figure 3 caption were recovered and read separately from the unchanged normal abstract. Individually expressed full-length human alpha1 chains occur mainly as monomers and dimers in insect-cell conditioned medium analyzed under reducing/non-reducing conditions. The public source-evidence index provides the exact Results locator and short excerpt. This is contextual recombinant self-association, not a native homodimer or equivalent activity of engineered/natural shortened products; no downloaded PDF or figure-pixel claim."
- id: PMID:21659506
  title: NC4 Domain of cartilage-specific collagen IX inhibits complement directly
    due to attenuation of membrane attack formation and indirectly through binding
    and enhancing activity of complement inhibitors C4B-binding protein and factor
    H.
  findings:
  - statement: The NC4 domain binds C4, C3 and C9 and directly inhibits C9 polymerization
      and assembly of the lytic membrane attack complex.
    supporting_text: Our results demonstrate that NC4 can function as a novel inhibitor
      of the complement system able to bind C4, C3, and C9 and to directly inhibit C9
      polymerization and assembly of the lytic membrane attack complex.
    reference_section_type: ABSTRACT
  - statement: NC4 additionally binds the complement inhibitors C4b-binding protein
      and factor H and enhances their cofactor activity, which is an indirect contribution
      distinct from the direct inhibition of C9.
    supporting_text: NC4 also binds the complement inhibitors C4b-binding protein and
      factor H and enhances their cofactor activity in degradation of activated complement
      components C4b and C3b.
    reference_section_type: ABSTRACT
  - statement: The NC4 domain projects from the fibril surface and is lost early in
      cartilage degradation, before major damage to collagen II fibrils.
    supporting_text: Fragmentation of collagen IX and loss of the NC4 domain are early
      events in cartilage degradation in joint diseases that precedes major damage of
      collagen II fibrils.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Genuine selected full original Methods/Results read. Recombinant
      NC4 directly inhibits C9 polymerization in solution and erythrocyte assays;
      it enhances low-dose FH/C4BP-dependent FI cleavage but does not itself serve
      as the FI cofactor. Intact collagen IX effects are explicitly speculative in
      the source. Human pAM104-2 NC4 provenance is independently authenticated in
      the indexed original Methods of reference16, PMID:19700767; it is not assumed
      identical to the earlier pGAT2-NC23 construct.
