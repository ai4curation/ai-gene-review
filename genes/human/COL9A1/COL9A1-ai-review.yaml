id: P20849
gene_symbol: COL9A1
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: COL9A1 encodes the alpha1 chain of collagen IX, a fibril-associated collagen
  with interrupted triple helices in cartilage and vitreous extracellular matrix.
  Alpha1(IX) assembles with alpha2(IX) and alpha3(IX), and the resulting heterotrimer
  associates with type II collagen fibrils and other matrix components. The long alpha1
  chain exposes an N-terminal NC4 domain that binds heparin and cartilage oligomeric
  matrix protein. Recombinant NC4 can also inhibit terminal complement assembly. Alternative
  transcripts encode a shorter N-terminal form and a truncated product. Biallelic
  pathogenic variants cause recessive Stickler syndrome with ocular, auditory and
  skeletal manifestations.
alternative_products:
- name: 1 (Long)
  id: P20849-1
  description: The displayed 921-residue precursor, carrying the full N-terminal NC4 globular
    domain that projects from the fibril surface and binds heparin and COMP.
- name: 2 (Short)
  id: P20849-2
  description: Short form transcribed from the alternative exon 1* in intron 6. Residues 1-243
    are absent and 244-267 are replaced by an alternative signal peptide, so this product lacks
    the NC4 domain and the heparin/COMP-binding activity assigned to it.
- name: '3'
  id: P20849-3
  description: Severely truncated 328-residue product. Residues 326-328 are altered and 329-921
    are absent, so it retains the NC4 region but none of the collagenous domains; its secretion
    and matrix fate are untested.
