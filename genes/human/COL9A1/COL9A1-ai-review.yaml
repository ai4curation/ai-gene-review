id: P20849
gene_symbol: COL9A1
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: COL9A1 encodes the alpha1 chain of collagen IX, a fibril-associated collagen
  with interrupted triple helices in cartilage and vitreous extracellular matrix.
  Alpha1(IX) assembles with alpha2(IX) and alpha3(IX), and the resulting heterotrimer
  associates with type II collagen fibrils and other matrix components. The long alpha1
  chain exposes an N-terminal NC4 domain that binds heparin and cartilage oligomeric
  matrix protein. Recombinant NC4 can also inhibit terminal complement assembly. Alternative
  transcripts encode a shorter N-terminal form and a truncated product. Biallelic
  pathogenic variants cause recessive Stickler syndrome with ocular, auditory and
  skeletal manifestations.
