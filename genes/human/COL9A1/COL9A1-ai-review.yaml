- id: PMID:9707347
  title: Human COL9A1 and COL9A2 genes. Two genes of 90 and 15 kb code for similar
    polypeptides of the same collagen molecule.
  findings:
  - statement: The complete human COL9A1 structure was determined as a roughly 90 kb gene of 38
      exons.
    supporting_text: The COL9A1 gene is about 90 kb and consists of 38 exons.
    reference_section_type: ABSTRACT
  - statement: An alternative exon 1* lies in intron 6 of COL9A1 and is separated from exon 7 by
      only a short intron, which explains why its transcripts splice directly to exon 8. This is the
      genomic basis of the short, NC4-lacking product.
    supporting_text: the alternative exon 1* found in intron 6 of the COL9A1 gene is separated
      from exon 7 only by a short intron
    reference_section_type: ABSTRACT
  - statement: COL9A1 and COL9A2 encode similar polypeptides of the same collagen molecule,
      consistent with alpha1(IX) membership in the type IX heterotrimer.
    supporting_text: Here we report the complete structure for the human COL9A1 and the complete
      sequence for the human COL9A2 genes.
    reference_section_type: ABSTRACT
