      IX, every splice product or a demonstrated endogenous immune role. NC4 is not
      itself a factor-I cofactor or protease, although it enhances reactions containing
      FH/C4BP. Current typed coverage has no overlap with original or replacement
      terms; same-role CLU carries direct IDA1971, while VTN/COMP exact-query absences
      are retained. No redundant parent or complement-binding NEW is proposed.
