id: P20849
gene_symbol: COL9A1
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: COL9A1 encodes the alpha1 chain of collagen IX, a fibril-associated collagen
  with interrupted triple helices in cartilage and vitreous extracellular matrix.
  Alpha1(IX) assembles with alpha2(IX) and alpha3(IX), and the resulting heterotrimer
  associates with type II collagen fibrils and other matrix components. The long alpha1
  chain exposes an N-terminal NC4 domain that binds heparin and cartilage oligomeric
  matrix protein. Recombinant NC4 can also inhibit terminal complement assembly. Alternative
  transcripts encode a shorter N-terminal form and a truncated product. Biallelic
  pathogenic variants cause recessive Stickler syndrome with ocular, auditory and
  skeletal manifestations.
alternative_products:
- name: 1 (Long)
  id: P20849-1
  description: UniProt displayed sequence, the long alpha1(IX) precursor. It carries the full N-terminal
    NC4 globular domain that projects from the fibril surface and binds heparin and cartilage oligomeric
    matrix protein, followed by the three collagenous domains.
- name: 2 (Short)
  id: P20849-2
  sequence_note: VSP_001141, VSP_001142
  description: Short alpha1(IX) form from an alternative first exon. VSP_001141 removes residues 1-243
    and VSP_001142 replaces 244-267 with an alternative signal peptide, so the product lacks the
    large NC4 globular domain while retaining the collagenous regions.
- name: '3'
  id: P20849-3
  sequence_note: VSP_015250, VSP_015251
  description: Severely truncated form. VSP_015250 changes residues 326-328 and VSP_015251 removes
    329-921, leaving the N-terminal NC4-containing region without the collagenous domains; its secretion
    and fate are not established.
