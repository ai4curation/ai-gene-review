  title: Procollagen triple helix formation
  findings:
  - statement: Procollagen triple-helix formation is nucleated by C-terminal prodomain
      alignment and proceeds C-to-N in the rough endoplasmic reticulum, which is the
      compartment in which alpha1(IX) precursors fold.
    supporting_text: Alignment of the C-terminal prodomains initiates triple helix formation,
      which propagates in a zipper-like fashion in the C-to-N direction. This occurs
      in the rough endoplasmic reticulum
    reference_section_type: DATABASE_ENTRY
