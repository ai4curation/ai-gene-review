- id: PMID:15047691
  title: 'Characterization of recombinant amino-terminal NC4 domain of human collagen
    IX: interaction with glycosaminoglycans and cartilage oligomeric matrix protein.'
  findings:
  - statement: Recombinant human NC4 binds heparin with a Kd of 0.6 uM, and full-length
      recombinant collagen IX binds it more strongly still, with an apparent Kd of 3.6 nM.
    supporting_text: The results show that the NC4 domain of collagen IX specifically binds
      heparin with a K(d) of 0.6 microm, and the full-length recombinant collagen IX has an even
      stronger interaction with heparin, with an apparent K(d) of 3.6 nm.
    reference_section_type: ABSTRACT
  - statement: The NC4 heparin-binding site lies in the extreme N terminus and contains a heparin-
      binding consensus sequence, while electron microscopy indicated at least three further sites
      elsewhere on full-length collagen IX.
    supporting_text: The heparin-binding site of the NC4 domain was located in the extreme N
      terminus, containing a heparin-binding consensus sequence
    reference_section_type: ABSTRACT
  - statement: NC4 also binds cartilage oligomeric matrix protein, and this interaction is
      competed by heparin, so the two ligands engage overlapping surfaces.
    supporting_text: This interaction and the association of cartilage oligomeric matrix protein
      with other regions of collagen IX were found to be heparin-competitive.
    reference_section_type: ABSTRACT
  - statement: Binding was measured on the purified 27.5-kDa recombinant domain by surface plasmon
      resonance and solid-state assays, so the activity is established for the isolated domain
      rather than for any particular natural splice product.
    supporting_text: The purified 27.5-kDa product was analyzed for its glycosaminoglycan-binding
      potential by surface plasmon resonance and solid-state assays.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: "Original indexed Methods/Results recovered and read. Human NC4 and full-length recombinant human collagen IX were both tested for heparin binding with ligand-free surfaces and GAG competition; the NC4 basic-region mutant was folding-controlled. Rat COMP P35444/full and 266–755 fragment assays are distinct. The public source-evidence index supplies Methods/Results locators; normal abstract cache is unchanged. Indexed original access does not imply a downloaded PDF or figure-pixel inspection."
- id: PMID:17553797
  title: Crystal structure of the N-terminal NC4 domain of collagen IX, a zinc binding
    member of the laminin-neurexin-sex hormone binding globulin (LNS) domain family.
  findings:
  - statement: The NC4 crystal structure at 1.8 A is the first atomic-level structure of an
      NC4-like unit and adopts the LNS fold, an antiparallel beta-sheet sandwich.
    supporting_text: this report, describing the crystal structure of NC4 at 1.8-A resolution,
      represents the first atomic level structure for these domains
    reference_section_type: ABSTRACT
  - statement: NMR titration with a heparin tetrasaccharide revealed a secondary, lower-affinity
      heparin site on NC4, distinct from the N-terminal consensus site.
    supporting_text: NMR titration with a heparin tetrasaccharide revealed the presence of a
      secondary binding site for heparin on NC4
    reference_section_type: ABSTRACT
  - statement: A zinc ion occupies the LNS metal site, but the solution affinity is weak, which
      the authors read as regulatory rather than structural.
    supporting_text: The K(d) of 11.5 mM suggests a regulatory rather than a structural role for
      zinc in solution.
    reference_section_type: ABSTRACT
  - statement: The alpha1(IX) NC4 domain is positioned as the chain's interaction module for
      proteoglycans and cartilage oligomeric matrix protein.
    supporting_text: The N-terminal NC4 domain of the alpha1(IX) chain is probably important in
      this because it interacts with various macromolecules such as proteoglycans and cartilage
      oligomeric matrix protein.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete authentic abstract establishes NC4 structure, weak solution
      zinc affinity and heparin-tetrasaccharide binding. Full original Methods/control
      access failed; zinc binding is not negated, but a new zinc claim is deferred.
  full_text_unavailable: true
- id: PMID:25037231
  title: Extracellular matrix signatures of human primary metastatic colon cancers
    and their metastases to liver.
  findings:
  - statement: Serial extraction of human colon, tumour and liver tissue yields an insoluble
      fraction enriched for extracellular matrix proteins and depleted of intracellular markers, the
      fraction in which the COL9A1 protein entry was detected.
    supporting_text: The insoluble fraction remaining after serial extraction was enriched for ECM
      proteins and largely depleted for intracellular components.
    reference_section_type: RESULTS
  - statement: Identified proteins were classified into matrisome subsets reported in the
      supplementary workbook, where the grouped COL9A1 entry appears in both the complete-data and
      matrisome sheets.
    supporting_text: The complete proteomic data sets and the matrisome subsets (ECM and ECM-
      associated proteins) are presented in Additional files 2 and 3
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected full human ECM-extraction/MS Methods/Results and original
      supplementary workbook row121 in both A/B sheets were read. Grouped COL9A1 detection
      is genuine; the principal short-isoform label does not resolve unique natural-product
      activity, and no tensile assay was performed.
- id: PMID:27897211
  title: Structural insight for chain selection and stagger control in collagen.
  findings:
  - statement: The three distinct type IX chains alpha1, alpha2 and alpha3 assemble through their
      NC2 assembly domain, which sets both chain composition and the leading/middle/trailing stagger
      of the triple helix.
    supporting_text: Three distinct chains (α1, α2 and α3) of the non-collagenous domain 2 (NC2)
      of type IX collagen are assembled to guide triple-helical sequences in the leading, middle
      and trailing positions.
    reference_section_type: ABSTRACT
  - statement: Heterotrimeric collagens need a dedicated mechanism to control which chains are
      selected and in which register they pack.
    supporting_text: Thus there must be mechanisms that control composition and stagger during
      collagen folding.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Actual selected full Methods/Results read. Type IX NC2 chains were
      assembled with engineered type I host–guest sequences; construct-specific structures
      are distinguished from intact type IX and all natural products.
- id: PMID:32814053
  title: Interactome Mapping Provides a Network of Neurodegenerative Disease Proteins
    and Uncovers Widespread Protein Aggregation in Affected Brains.
  findings:
  - statement: The COL9A1 interactions with GIPC1, CRYAA and KLK6 come from a systematic yeast
      two-hybrid screen of about 500 neurodegeneration-related proteins, integrated with literature
      interactions, so they are screen-level candidate interactions rather than assays in a native
      matrix context.
    supporting_text: Here, we report on an interactome map that focuses on neurodegenerative
      disease (ND), connects ∼5,000 human proteins via ∼30,000 candidate interactions and is
      generated by systematic yeast two-hybrid interaction screening of ∼500 ND-related proteins
      and integration of literature interactions.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete abstract and genuine public-author-repository full PDF
      text at automated Y2H and mammalian validation Methods were read. Three exact
      current positive records per target pair were joined to sequence ROGIDs; dataset-level
      mammalian validation is not claimed for each COL9A1 pair.
- id: PMID:33961781
  title: Dual proteome-scale networks reveal cell-specific remodeling of the human
    interactome.
  findings:
  - statement: The COL9A1-COL6A1 association derives from proteome-scale affinity-purification
      mass spectrometry, which reports co-complex membership rather than isolated binary affinity.
    supporting_text: Through affinity-purification mass spectrometry, we have created two
      proteome-scale, cell-line-specific interaction networks.
    reference_section_type: ABSTRACT
  - statement: The two networks come from 293T and HCT116 cells respectively, which is why the
      COL9A1 records carry cell-line-specific scope.
    supporting_text: The second results from 5,522 immunoprecipitations in HCT116 cells.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected partial cache is preserved; genuine normal-fetched full
      text was separately archived and actual clone, cell-line, AP-MS, filtering and
      Results passages read. Two exact COL6A1 pairs retain HEK293T/HCT116 and co-complex/spoke-expansion
      scope; no native binary assay is invented.
- id: PMID:3473493
  title: Structure of the glycosaminoglycan domain in the type IX collagen-proteoglycan.
  findings:
  - statement: Type IX collagen makes up 5-20% of hyaline cartilage collagen and is built from
      three genetically distinct subunits.
    supporting_text: Type IX collagen represents 5-20% of the total collagen in hyaline cartilage.
      The molecules of this collagen are composed of three genetically distinct polypeptide
      subunits.
    reference_section_type: ABSTRACT
  - statement: The glycosaminoglycan attachment serine sits in the NC3 domain of alpha2(IX) and is
      absent from alpha1(IX), whose homologous exon is 33 rather than 48 base pairs. The paper's
      alpha1(IX) content is therefore a sequence comparison, not a functional assay.
    supporting_text: By comparing the exons encoding the NC3 domain in the alpha 2(IX) and alpha
      1(IX) genes, we find that the exon coding for the glycosaminoglycan attachment site in the
      alpha 2(IX) gene is 48 base pairs long, whereas the homologous alpha 1(IX) exon is 33 base
      pairs.
    reference_section_type: ABSTRACT
  - statement: The five extra residues make the alpha2(IX) NC3 domain longer than that of
      alpha1(IX), explaining the kink seen by electron microscopy.
    supporting_text: The NC3 domain is, therefore, five amino acid residues longer in alpha 2(IX)
      than in alpha 1(IX).
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: MISCITED
    review_notes: "The complete original five PMC page images,4044–4048, were read in the bounded consultation. This is genuine chicken cartilage alpha1/alpha2 molecular characterization, including an alpha1 NC3 comparison; it does not support the specific organ-morphogenesis assertion. Article identity and molecular findings are valid; MISCITED is limited to that process attribution. The public source-evidence index links the original PMC page 4044 and its Materials and methods preparation paragraph, which explicitly identifies chicken embryonic cartilage. This organism attribution comes from the original page, not inference from the abstract."
- id: PMID:8660302
  title: 'Collagen type IX from human cartilage: a structural profile of intermolecular
    cross-linking sites.'
  findings:
  - statement: In human cartilage, type IX collagen is covalently cross-linked both to type II
      collagen and to other type IX molecules, placing it within the extracellular fibrillar
      network.
    supporting_text: in human cartilage, type IX collagen is covalently cross-linked to type II
      collagen and to other molecules of type IX collagen
    reference_section_type: ABSTRACT
  - statement: Type IX collagen is a quantitatively minor cartilage collagen associated with the
      surface of type II collagen fibrils.
    supporting_text: Type IX collagen, a quantitatively minor collagenous component of cartilage,
      is known to be associated with and covalently cross-linked to type II collagen fibrils in
