id: P20849
gene_symbol: COL9A1
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: COL9A1 encodes the alpha1 chain of collagen IX, a fibril-associated collagen
  with interrupted triple helices in cartilage and vitreous extracellular matrix.
  Alpha1(IX) assembles with alpha2(IX) and alpha3(IX), and the resulting heterotrimer
  associates with type II collagen fibrils and other matrix components. The long alpha1
  chain exposes an N-terminal NC4 domain that binds heparin and cartilage oligomeric
  matrix protein. Recombinant NC4 can also inhibit terminal complement assembly. Alternative
  transcripts encode a shorter N-terminal form and a truncated product. Biallelic
  pathogenic variants cause recessive Stickler syndrome with ocular, auditory and
  skeletal manifestations.
alternative_products:
- name: 1 (Long)
  description: The displayed 921-residue Long chain, which retains the N-terminal
    NC4 globular domain that carries the heparin and cartilage oligomeric matrix protein
    binding sites.
  id: P20849-1
- name: 2 (Short)
  description: The Short chain, which lacks residues 1-243 and replaces 244-267 with
    an alternative signal peptide, so it begins downstream of the NC4 globular domain.
  id: P20849-2
  sequence_note: VSP_001141, VSP_001142
- name: '3'
  description: A severely truncated product that diverges at residues 326-328 and
    lacks 329-921, so it retains neither the collagenous domains nor the C-terminal
    assembly region.
  id: P20849-3
  sequence_note: VSP_015250, VSP_015251
