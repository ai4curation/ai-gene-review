core_functions:
- description: Alpha1(IX) supplies structural elements of the alpha1/alpha2/alpha3 type IX heterotrimer
    at the surface of type II collagen fibrils. Chain assembly and covalent matrix connections support
    this fibril-associated matrix role. The NC2 structure is an engineered assembly-domain assay, and
    the chain does not autonomously form the major fibrillar scaffold or catalyze its own processing.
    Long/short precursor architecture and the severely truncated product are kept distinct.
  molecular_function:
    id: GO:0030020
    label: extracellular matrix structural constituent conferring tensile strength
  in_complex:
    id: GO:0005594
    label: collagen type IX trimer
  locations:
  - id: GO:0031012
    label: extracellular matrix
  directly_involved_in:
  - id: GO:0030198
    label: extracellular matrix organization
  supported_by:
  - reference_id: PMID:8660302
  - reference_id: PMID:27897211
  - reference_id: PMID:15047691
  - reference_id: PMID:17880280
- description: The alpha1(IX) NC4 domain binds heparin, providing a ligand-binding activity in the extracellular
    matrix distinct from structural chain assembly. Recombinant human NC4 binding is supported by direct
    assays, GAG competition and a folding-controlled basic-region mutant; full-length recombinant human
    collagen IX also binds heparin. Additional binding sites on the intact heterotrimer are not all assigned
    to alpha1. These experiments do not demonstrate a specific native matrix-bridging mechanism or equivalent
    activity of all natural splice products, including the NC4-lacking Short product.
  molecular_function:
    id: GO:0008201
    label: heparin binding
  locations:
  - id: GO:0031012
    label: extracellular matrix
  supported_by:
  - reference_id: PMID:15047691
  - reference_id: PMID:17553797
suggested_questions:
- question: Which COL9A1 products enter native type IX heterotrimers in cartilage
    and vitreous, and can the truncated NC4-containing product be secreted or act
    independently?
- question: How do NC4 heparin and matrix-partner interactions contribute to fibril
    organization in native tissue, relative to the separate collagenous cross-links?
- question: Does native or proteolytically released human NC4 inhibit terminal complement
    under tissue concentrations, and how do C9 binding and enhanced FH/C4BP-dependent
    reactions contribute separately?
- question: What performed organ-morphogenesis contribution supports the current matching
    ARBA rule, beyond the separate 1987 sequence-characterization paper and known
    matrix assembly?
- question: What is the biological significance of the weak NC4 zinc affinity reported
    in solution, and which intact products retain that interaction?
suggested_experiments:
- description: Express sequence-defined natural COL9A1 products with human alpha2(IX)/alpha3(IX),
    then separately measure secretion, chain stoichiometry, collagen folding and matrix
    incorporation.
  hypothesis: The short precursor retains major assembly regions whereas the truncated
    product has a distinct extracellular fate.
- description: Compare intact type IX, released sequence-defined NC4 and NC4 ligand-site
    mutants in human complement assays with purified C9 and separately reconstituted
    FI/FH/C4BP reactions.
  hypothesis: Direct terminal-complement inhibition can be separated from effects
    on other complement cofactors.
- description: Combine COL9A1 loss and product-specific rescue with quantitative developmental
    tissue architecture and matched matrix abundance controls.
  hypothesis: A performed morphogenetic structural step can be distinguished from
    correlated expression or generalized tissue damage.
status: DRAFT
