- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  findings:
  - statement: PAINT annotations are propagated from a curator-placed ancestral-node
      (IBD) assertion to the descendants of that node, so an IBA records an inherited
      phylogenetic judgment rather than a pairwise similarity transfer.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Standard evidence-method reference is preserved from genuine GOA.
      Current rule/donor records are distinguished from uninspected historical PAINT
      node placement or historical ARBA versions.
- id: GO_REF:0000117
  title: Electronic Gene Ontology annotations created by ARBA machine learning models
  findings:
  - statement: ARBA annotations are emitted by machine-learned association rules over
      UniProtKB features, so a row carries the rule's premise rather than evidence about
      the target gene.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Standard evidence-method reference is preserved from genuine GOA.
      Current rule/donor records are distinguished from uninspected historical PAINT
      node placement or historical ARBA versions.
- id: PMID:15047691
  title: 'Characterization of recombinant amino-terminal NC4 domain of human collagen
    IX: interaction with glycosaminoglycans and cartilage oligomeric matrix protein.'
  findings:
  - statement: The NC4 domain of collagen IX specifically binds heparin, and full-length
      recombinant collagen IX binds it more strongly still.
    supporting_text: The results show that the NC4 domain of collagen IX specifically
      binds heparin with a K(d) of 0.6 microm, and the full-length recombinant collagen
      IX has an even stronger interaction with heparin, with an apparent K(d) of 3.6
      nm.
    reference_section_type: ABSTRACT
  - statement: The principal heparin-binding site lies in the extreme N-terminus of
      NC4 around a heparin-binding consensus sequence, with at least three further sites
      elsewhere on full-length collagen IX.
    supporting_text: The heparin-binding site of the NC4 domain was located in the extreme
      N terminus, containing a heparin-binding consensus sequence, whereas electron
      microscopy suggested the presence of at least three additional heparin-binding
      sites on full-length collagen IX.
    reference_section_type: ABSTRACT
  - statement: NC4 also binds cartilage oligomeric matrix protein, and that interaction
      is heparin-competitive.
    supporting_text: The NC4 domain was also shown to bind cartilage oligomeric matrix
      protein. This interaction and the association of cartilage oligomeric matrix protein
      with other regions of collagen IX were found to be heparin-competitive.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: "Original indexed Methods/Results recovered and read. Human NC4 and full-length recombinant human collagen IX were both tested for heparin binding with ligand-free surfaces and GAG competition; the NC4 basic-region mutant was folding-controlled. Rat COMP P35444/full and 266–755 fragment assays are distinct. The public source-evidence index supplies Methods/Results locators; normal abstract cache is unchanged. Indexed original access does not imply a downloaded PDF or figure-pixel inspection."
- id: PMID:17553797
  title: Crystal structure of the N-terminal NC4 domain of collagen IX, a zinc binding
    member of the laminin-neurexin-sex hormone binding globulin (LNS) domain family.
  findings:
  - statement: The crystal structure of the alpha1(IX) NC4 domain is an LNS-family antiparallel
      beta-sheet sandwich with a bound zinc ion.
    supporting_text: the crystal structure of NC4 at 1.8-A resolution, represents the
      first atomic level structure for these domains
    reference_section_type: ABSTRACT
  - statement: NMR titration identifies a secondary heparin-binding site on NC4, of
      markedly reduced affinity, conserved with thrombospondin-1.
    supporting_text: NMR titration with a heparin tetrasaccharide revealed the presence
      of a secondary binding site for heparin on NC4, showing structural and functional
      conservation with thrombospondin-1, but a markedly reduced affinity for the ligand.
    reference_section_type: ABSTRACT
  - statement: The NC4 domain of the alpha1(IX) chain is the part of collagen IX that
      interacts with proteoglycans and cartilage oligomeric matrix protein.
    supporting_text: The N-terminal NC4 domain of the alpha1(IX) chain is probably important
      in this because it interacts with various macromolecules such as proteoglycans
      and cartilage oligomeric matrix protein.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete authentic abstract establishes NC4 structure, weak solution
      zinc affinity and heparin-tetrasaccharide binding. Full original Methods/control
      access failed; zinc binding is not negated, but a new zinc claim is deferred.
  full_text_unavailable: true
- id: PMID:25037231
  title: Extracellular matrix signatures of human primary metastatic colon cancers
    and their metastases to liver.
  findings:
  - statement: Extracellular-matrix-enriched fractions from human colon carcinomas,
      their liver metastases and matched normal tissue were profiled by mass spectrometry
      to define tissue ECM composition.
    supporting_text: We have used enrichment of extracellular matrix (ECM) from human
      patient samples and proteomics to define the ECM composition of primary colon
      carcinomas and their metastases to liver in comparison with normal colon and liver
      samples.
    reference_section_type: ABSTRACT
  - statement: The approach yields reproducible ECM protein signatures for each tissue,
      so detection in these datasets reflects matrix residence rather than a mechanical
      or causal measurement.
    supporting_text: robust signatures of ECM proteins characteristic of each tissue,
      normal and malignant, can be defined using relatively small samples
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected full human ECM-extraction/MS Methods/Results and original
      supplementary workbook row121 in both A/B sheets were read. Grouped COL9A1 detection
      is genuine; the principal short-isoform label does not resolve unique natural-product
      activity, and no tensile assay was performed.
- id: PMID:27897211
  title: Structural insight for chain selection and stagger control in collagen.
  findings:
  - statement: The NC2 trimerization domain of type IX collagen assembles three distinct
      chains, alpha1, alpha2 and alpha3, and assigns each to the leading, middle or
      trailing position of the adjacent triple helix.
    supporting_text: Three distinct chains (α1, α2 and α3) of the non-collagenous domain
      2 (NC2) of type IX collagen are assembled to guide triple-helical sequences in
      the leading, middle and trailing positions.
    reference_section_type: ABSTRACT
  - statement: In the crystal structures the three NC2 chains form a parallel right-handed
      alpha-helical bundle, with a disulfide bond connecting the alpha1 and alpha3 chains.
    supporting_text: Three unique chains form a parallel α-helical right-handed bundle.
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Actual selected full Methods/Results read. Type IX NC2 chains were
      assembled with engineered type I host–guest sequences; construct-specific structures
      are distinguished from intact type IX and all natural products.
- id: PMID:32814053
  title: Interactome Mapping Provides a Network of Neurodegenerative Disease Proteins
    and Uncovers Widespread Protein Aggregation in Affected Brains.
  findings:
  - statement: The interactions recorded here come from systematic yeast two-hybrid
      screening of around 500 neurodegeneration-related proteins, integrated with literature
      interactions, so each positive record is a candidate binary association rather
      than a native complex.
    supporting_text: generated by systematic yeast two-hybrid interaction screening
      of ∼500 ND-related proteins and integration of literature interactions
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete abstract and genuine public-author-repository full PDF
      text at automated Y2H and mammalian validation Methods were read. Three exact
      current positive records per target pair were joined to sequence ROGIDs; dataset-level
      mammalian validation is not claimed for each COL9A1 pair.
- id: PMID:33961781
  title: Dual proteome-scale networks reveal cell-specific remodeling of the human
    interactome.
  findings:
  - statement: The interactions recorded here come from proteome-scale affinity-purification
      mass spectrometry in 293T and HCT116 cells, so a positive record may be a co-complex
      rather than a direct contact.
    supporting_text: Through affinity-purification mass spectrometry, we have created
      two proteome-scale, cell-line-specific interaction networks.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected partial cache is preserved; genuine normal-fetched full
      text was separately archived and actual clone, cell-line, AP-MS, filtering and
      Results passages read. Two exact COL6A1 pairs retain HEK293T/HCT116 and co-complex/spoke-expansion
      scope; no native binary assay is invented.
- id: PMID:3473493
  title: Structure of the glycosaminoglycan domain in the type IX collagen-proteoglycan.
  findings:
  - statement: The glycosaminoglycan attachment site of the type IX collagen proteoglycan
      is a Gly-Ser-Ala-Asp sequence within the NC3 domain of the alpha2(IX) chain.
    supporting_text: the attachment region contains the sequence Gly-Ser-Ala-Asp, located
      within the noncollagenous domain NC3 of the alpha 2(IX) chain
    reference_section_type: ABSTRACT
  - statement: The NC3 domain is five residues longer in alpha2(IX) than in alpha1(IX),
      and the extra Val-Glu-Gly-Ser-Ala block supplies the glycosylated serine that
      alpha1(IX) lacks.
    supporting_text: The inserted block of amino acid residues also provides the NC3
      domain of alpha 2(IX) chains with a serine residue, not present in alpha 1(IX)
      that serves as attachment site for a glycosaminoglycan side chain.
    reference_section_type: ABSTRACT
  - statement: The study is a molecular-structure analysis of the glycosaminoglycan
      attachment site, not an assay of a developmental or morphogenetic process.
    supporting_text: We report here on the structure of the glycosaminoglycan attachment
      site of type IX collagen-proteoglycan.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: MISCITED
    review_notes: "The complete original five PMC page images,4044–4048, were read in the bounded consultation. This is genuine chicken cartilage alpha1/alpha2 molecular characterization, including an alpha1 NC3 comparison; it does not support the specific organ-morphogenesis assertion. Article identity and molecular findings are valid; MISCITED is limited to that process attribution. The public source-evidence index links the original PMC page 4044 and its Materials and methods preparation paragraph, which explicitly identifies chicken embryonic cartilage. This organism attribution comes from the original page, not inference from the abstract."
- id: PMID:8660302
  title: 'Collagen type IX from human cartilage: a structural profile of intermolecular
    cross-linking sites.'
  findings:
  - statement: In human cartilage, type IX collagen is covalently cross-linked both
      to type II collagen and to other type IX collagen molecules, which is the network-integration
      premise for the structural role of alpha1(IX).
    supporting_text: in human cartilage, type IX collagen is covalently cross-linked
      to type II collagen and to other molecules of type IX collagen
    reference_section_type: ABSTRACT
  - statement: Type IX collagen is a quantitatively minor cartilage collagen associated
      with the surface of type II collagen fibrils, consistent with its fibril-associated
      (FACIT) character.
    supporting_text: Type IX collagen, a quantitatively minor collagenous component
      of cartilage, is known to be associated with and covalently cross-linked to type
      II collagen fibrils
    reference_section_type: ABSTRACT
  - statement: Type IX collagen molecules form covalent cross-links with each other,
      which is the self-association observed in the native matrix.
    supporting_text: Type IX collagen molecules have also been shown to form covalent
      cross-links with each other in bovine cartilage.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Authentic original indexed human cartilage Methods/Results/Figures
      were read in the bounded consultation. Native II–IX and IX–IX chain cross-links
      support structural integration; an isolated alpha1–alpha1 homodimer is not established
      by those mapped sites.
- id: PMID:9707347
  title: Human COL9A1 and COL9A2 genes. Two genes of 90 and 15 kb code for similar
    polypeptides of the same collagen molecule.
  findings:
  - statement: The human COL9A1 and COL9A2 genes, of about 90 kb and 15 kb, encode similar
      polypeptides of the same collagen molecule.
    supporting_text: Human COL9A1 and COL9A2 genes. Two genes of 90 and 15 kb code for
      similar polypeptides of the same collagen molecule.
    reference_section_type: TITLE
  - statement: An alternative exon 1* in intron 6 of COL9A1 is spliced directly to exon
      8, which is the basis of the alternative N-terminal products of the gene.
    supporting_text: the alternative exon 1* found in intron 6 of the COL9A1 gene is
      separated from exon 7 only by a short intron in the chick, human, mouse and rat
      genes probably explaining why transcripts from exon 1* are spliced directly to
      exon 8
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Complete authentic abstract describes human COL9A1/COL9A2 gene and
      alternative-exon structures. Full original target passages were not recovered;
      established trimer membership is retained with independent evidence and curator
      deference.
  full_text_unavailable: true
