    supporting_text: The complete proteomic data sets and the matrisome subsets (ECM and ECM-associated
      proteins) are presented in Additional files 2 and 3.
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected full human ECM-extraction/MS Methods/Results and original
      supplementary workbook row121 in both A/B sheets were read. Grouped COL9A1 detection
      is genuine; the principal short-isoform label does not resolve unique natural-product
      activity, and no tensile assay was performed.
- id: PMID:27897211
  title: Structural insight for chain selection and stagger control in collagen.
  findings:
  - statement: Three distinct type IX NC2 chains, including alpha1, assemble to place attached triple-helical
      sequences in defined leading, middle and trailing positions.
    supporting_text: Three distinct chains (α1, α2 and α3) of the non-collagenous domain 2 (NC2) of
      type IX collagen are assembled to guide triple-helical sequences in the leading, middle and
      trailing positions.
    reference_section_type: ABSTRACT
  - statement: The crystallized NC2 trimer is a parallel right-handed bundle of three unique chains.
    supporting_text: Three unique chains form a parallel α-helical right-handed bundle.
    reference_section_type: RESULTS
  - statement: The stagger of the central COL2 collagenous domain of type IX collagen is alpha2-alpha1-alpha3
      and is set by the NC2 domain.
    supporting_text: At least for type IX collagen we can conclude now that the stagger of the central
      collagenous domain (COL2) is α2α1α3 and it is determined by the NC2 domain.
    reference_section_type: DISCUSSION
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Actual selected full Methods/Results read. Type IX NC2 chains were
      assembled with engineered type I host–guest sequences; construct-specific structures
      are distinguished from intact type IX and all natural products.
