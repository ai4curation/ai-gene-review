- id: PMID:15047691
  title: 'Characterization of recombinant amino-terminal NC4 domain of human collagen
    IX: interaction with glycosaminoglycans and cartilage oligomeric matrix protein.'
  findings:
  - statement: Recombinant human alpha1(IX) NC4 binds heparin with sub-micromolar affinity, and full-length
      recombinant collagen IX binds it more strongly still.
    supporting_text: the NC4 domain of collagen IX specifically binds heparin with a K(d) of 0.6 microm,
      and the full-length recombinant collagen IX has an even stronger interaction with heparin, with
      an apparent K(d) of 3.6 nm
    reference_section_type: ABSTRACT
  - statement: The NC4 heparin-binding site maps to a consensus sequence at the extreme N terminus
      of the domain.
    supporting_text: The heparin-binding site of the NC4 domain was located in the extreme N terminus,
      containing a heparin-binding consensus sequence
    reference_section_type: ABSTRACT
  - statement: NC4 also binds cartilage oligomeric matrix protein, and that interaction is heparin-competitive.
    supporting_text: This interaction and the association of cartilage oligomeric matrix protein with
      other regions of collagen IX were found to be heparin-competitive.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: "Original indexed Methods/Results recovered and read. Human NC4 and full-length recombinant human collagen IX were both tested for heparin binding with ligand-free surfaces and GAG competition; the NC4 basic-region mutant was folding-controlled. Rat COMP P35444/full and 266–755 fragment assays are distinct. The public source-evidence index supplies Methods/Results locators; normal abstract cache is unchanged. Indexed original access does not imply a downloaded PDF or figure-pixel inspection."
- id: PMID:17553797
  title: Crystal structure of the N-terminal NC4 domain of collagen IX, a zinc binding
    member of the laminin-neurexin-sex hormone binding globulin (LNS) domain family.
  findings:
  - statement: The crystal structure of alpha1(IX) NC4 at 1.8 A is the first atomic-level structure
      of an NC4-like domain and adopts the LNS fold.
    supporting_text: this report, describing the crystal structure of NC4 at 1.8-A resolution, represents
      the first atomic level structure for these domains
    reference_section_type: ABSTRACT
  - statement: NMR titration identifies a secondary heparin-binding site on NC4, distinct from the
      N-terminal consensus site.
    supporting_text: NMR titration with a heparin tetrasaccharide revealed the presence of a secondary
      binding site for heparin on NC4
    reference_section_type: ABSTRACT
  - statement: The solution zinc affinity of NC4 is weak, suggesting a regulatory rather than structural
      role for the bound metal.
    supporting_text: The K(d) of 11.5 mM suggests a regulatory rather than a structural role for zinc
      in solution.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete authentic abstract establishes NC4 structure, weak solution
      zinc affinity and heparin-tetrasaccharide binding. Full original Methods/control
      access failed; zinc binding is not negated, but a new zinc claim is deferred.
  full_text_unavailable: true
