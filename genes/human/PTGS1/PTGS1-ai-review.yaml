id: P23219
gene_symbol: PTGS1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'PTGS1 encodes cyclooxygenase-1, a heme-dependent homodimeric prostaglandin G/H synthase
  on the lumenal face of the endoplasmic reticulum and nuclear envelope. It catalyzes the constitutive
  cyclooxygenase and peroxidase steps that convert arachidonate through prostaglandin G2 to prostaglandin
  H2, supplying the common precursor for prostaglandins, prostacyclin and thromboxane.'
