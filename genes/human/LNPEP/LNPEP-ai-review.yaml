    supporting_text: In human dendritic cells, IRAP was localized to a Rab14+ endosomal storage compartment in which it interacted with MHC class I molecules.
  - reference_id: PMID:19498108
    supporting_text: We propose the existence of two pathways for proteasome-dependent cross-presentation in which final peptide trimming involves IRAP in endosomes and involves the related aminopeptidases in the endoplasmic reticulum.
  - reference_id: PMID:19918052
    supporting_text: We demonstrate that IRAP and MR are dispensable for cross-presentation by CD8 + DC and for cross-priming.
  - reference_id: PMID:19918052
    supporting_text: However, cross-presentation was impaired in moDC deficient in IRAP or MR, confirming the role of these two molecules in inflammatory DC.
- description: >-
    Proteolytic cleavage of placental membrane LNPEP releases a soluble ectodomain
    into maternal serum during pregnancy. This processed product retains the same
    zinc-dependent aminopeptidase activity and degrades peptide hormones, but its
    extracellular location and circulating abundance distinguish it from the
    membrane-embedded cellular pool. It is a proteolytic product of the canonical
    protein rather than a separately annotated splice isoform.
  molecular_function:
    id: GO:0070006
