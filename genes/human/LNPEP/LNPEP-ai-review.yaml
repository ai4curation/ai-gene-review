knowledge_gaps:
- gap_statement: >-
    The molecular mechanism by which the LNPEP cytosolic and transmembrane regions
    control GLUT4 sorting, and the degree to which this mechanism operates in human
    adipocytes in vivo, remain unresolved.
  boundary: >-
    Human adipocytes place LNPEP in insulin-responsive GLUT4 vesicles and show
    insulin-stimulated plasma-membrane recruitment. Mouse 3T3-L1 depletion and
    rescue experiments localize a GLUT4-retention function to the LNPEP
    cytosolic/transmembrane region rather than its catalytic ectodomain, but this
    noncatalytic mechanism has not been tested equivalently at the endogenous human
    locus.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    Resolving this mechanism would separate LNPEP's established aminopeptidase
    activity from a potentially independent trafficking function relevant to
    insulin-responsive glucose transport.
  resolution: >-
    Introduce endogenous tail-motif and catalytic-site edits into primary human
    adipocytes or iPSC-derived adipocytes, then quantify GLUT4-vesicle composition,
    basal and insulin-stimulated exocytosis, glucose uptake, and rescue by matched
    membrane-tethered catalytic and noncatalytic constructs.
  provenance:
  - reference_id: PMID:11701721
    supporting_text: >-
      Therefore, we studied subcellular localization of GLUT4 and insulin-regulated
      aminopeptidase (IRAP; also referred to as vp165 or gp160), which is a
      constituent of GLUT4 vesicles and also translocates to PM in response to
      insulin.
    reference_section_type: ABSTRACT
  - reference_id: PMID:20410133
    supporting_text: >-
      This increased exocytosis was rescued by reexpression of either full-length
      IRAP or IRAP-TR (Figure 3A).
    reference_section_type: RESULTS
- gap_statement: >-
    The peptide-import route, TAP contribution, substrate repertoire, and human
    dendritic-cell states that make LNPEP-dependent cross-presentation essential
    are not fully defined.
  boundary: >-
    Human dendritic-cell evidence establishes a proteasome-dependent pathway in
    which LNPEP trims exogenous peptide precursors in Rab14-positive endosomes, but
    it does not establish a universally TAP-independent mechanism. Mouse studies
    further show that the requirement differs between steady-state conventional
    and inflammatory dendritic-cell populations.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    Defining the transport and cell-state logic is necessary to understand when
    LNPEP controls antigen repertoire and immune activation without conflating it
    with the distinct vacuolar pathway or cytosolic aminopeptidases.
  resolution: >-
    Combine acute LNPEP depletion with TAP1/2 perturbation, compartment-resolved
    immunopeptidomics, endosomal peptide-import assays, and rescue by catalytically
    inactive or localization-defective LNPEP in primary human dendritic-cell
    subsets under steady-state and inflammatory conditions.
  provenance:
  - reference_id: PMID:19498108
    supporting_text: We propose the existence of two pathways for proteasome-dependent cross-presentation in which final peptide trimming involves IRAP in endosomes and involves the related aminopeptidases in the endoplasmic reticulum.
    reference_section_type: ABSTRACT
  - reference_id: PMID:19918052
    supporting_text: We demonstrate that IRAP and MR are dispensable for cross-presentation by CD8 + DC and for cross-priming.
    reference_section_type: ABSTRACT
  - reference_id: PMID:19918052
    supporting_text: However, cross-presentation was impaired in moDC deficient in IRAP or MR, confirming the role of these two molecules in inflammatory DC.
    reference_section_type: ABSTRACT
- gap_statement: >-
    Functional differences among the three annotated human LNPEP splice isoforms,
    and the protease and signals that generate the circulating pregnancy-serum
    ectodomain, remain poorly resolved.
  boundary: >-
    UniProt records two short N-terminal splice deletions and a proteolytically
    released chain beginning at residue 155, but current GO annotations do not
    demonstrate isoform-exclusive catalysis, trafficking, or antigen-processing
    functions. The serum product is cleavage-derived and must not be treated as a
    splice isoform.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    Product-resolved evidence would clarify whether N-terminal variation alters
    targeting or regulation and how placental processing changes the enzyme's
    substrate access during pregnancy.
  resolution: >-
    Use isoform-selective endogenous tagging and splice editing in human placental,
    neuronal, and adipocyte models, coupled to N-terminomics of the shed product,
    protease perturbation, localization, trafficking, and matched substrate-cleavage
    assays.
  provenance:
  - reference_id: file:human/LNPEP/LNPEP-uniprot.txt
    supporting_text: Event=Alternative splicing; Named isoforms=3;
    reference_section_type: OTHER
