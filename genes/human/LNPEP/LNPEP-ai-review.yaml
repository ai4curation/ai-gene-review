suggested_questions:
- question: >-
    Which endogenous cytosolic-tail interactions and trafficking motifs make LNPEP
    necessary for formation or retention of insulin-responsive GLUT4 vesicles in
    human adipocytes?
  experts:
  - adipocyte membrane-trafficking specialists
  - insulin-signaling biologists
- question: >-
    Which peptide-import machinery and dendritic-cell activation states determine
    whether LNPEP-dependent endosomal trimming changes the human MHC-I
    immunopeptidome?
  experts:
  - antigen cross-presentation specialists
  - immunopeptidomics researchers
- question: >-
    Do Q9UIQ6-1, Q9UIQ6-2, and Q9UIQ6-3 differ in localization or substrate access,
    and which protease releases the pregnancy-serum ectodomain?
  experts:
  - placental protease specialists
  - aminopeptidase structural biologists
suggested_experiments:
- hypothesis: >-
    LNPEP's cytosolic sorting motifs, rather than its aminopeptidase active site,
    are required to retain GLUT4 in insulin-responsive vesicles in human adipocytes.
  description: >-
    Generate isogenic human adipocytes carrying endogenous dileucine-, tankyrase-
    motif, catalytic-site, or tail-deletion edits. Compare GLUT4-vesicle proteomics,
    live-cell exocytosis, glucose uptake, and rescue with expression-matched LNPEP
    constructs.
  experiment_type: endogenous structure-function editing and vesicle-trafficking assay
- hypothesis: >-
    LNPEP changes the presented peptide repertoire through a proteasome-dependent,
    cell-state-selective endosomal pathway whose TAP requirement depends on peptide
    source.
  description: >-
    Acutely degrade LNPEP in primary human conventional and inflammatory dendritic
    cells with or without TAP1/2 perturbation, then combine compartment-resolved
    peptide tracing, quantitative MHC-I immunopeptidomics, T-cell activation, and
    rescue by catalytic-dead or endosome-targeting-defective LNPEP.
  experiment_type: human dendritic-cell epistasis and immunopeptidomics
- hypothesis: >-
    N-terminal splice variation and placental ectodomain cleavage independently
    regulate LNPEP trafficking and circulating peptide-hormone metabolism.
  description: >-
    Create isoform-selective tags and splice edits in human trophoblast organoids,
    map cleavage by N-terminomics and protease screens, and compare membrane
    residence, shedding, oligomeric state, and oxytocin/vasopressin hydrolysis for
    each product at matched abundance.
  experiment_type: isoform-resolved placental processing and enzymology
