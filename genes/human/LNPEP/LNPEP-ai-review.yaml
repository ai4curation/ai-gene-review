core_functions:
- description: >-
    Membrane-associated LNPEP is a zinc-dependent M1 metalloaminopeptidase whose
    extracellular or organelle-lumen-facing catalytic domain removes N-terminal
    residues from peptide hormones and neuropeptides. Purified human placental
    enzyme hydrolyzes oxytocin, vasopressin, and angiotensin III, while human
    brain-associated LNPEP also degrades Met-enkephalin and dynorphin. Regulated
    movement between intracellular vesicles and the cell surface changes access
    to extracellular substrates without changing the orientation of the catalytic
    domain.
  molecular_function:
    id: GO:0070006
    label: metalloaminopeptidase activity
  directly_involved_in:
