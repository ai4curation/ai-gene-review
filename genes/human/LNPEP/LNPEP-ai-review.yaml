id: Q9UIQ6
gene_symbol: LNPEP
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  LNPEP encodes a zinc-dependent M1 aminopeptidase that is synthesized as a
  single-pass type-II membrane protein with a short cytosolic N-terminal region
  and a lumen-facing or extracellular catalytic domain. It removes N-terminal
  residues from peptide hormones and neuropeptides, including oxytocin,
  vasopressin, angiotensin III, Met-enkephalin, and dynorphin. Full-length LNPEP
  cycles between intracellular vesicles and the plasma membrane, including
  insulin-responsive vesicles and antigen-processing endosomes, where it helps
  trim peptide precursors for MHC class I cross-presentation. Proteolytic release
  of its ectodomain produces a soluble pregnancy-serum aminopeptidase. Its
  cytosolic tail also participates in regulated vesicle sorting, although the
  physiological mechanism and conservation of this noncatalytic role in human
  cells remain incompletely defined.
