    supporting_text: Some peptides generated by the 26S proteasome are too long to bind to MHC class I molecules. These N-terminal extended precursor peptides may be trimmed by cytosolic aminopeptidases, such as Tripeptidyl peptidase II (TPP2), puromycin-sensitive aminopeptidase (PSA), bleomycin hydrolase (BH), and leucine aminopeptidase (LAP).
