  - reference_id: PMID:11389728
    supporting_text: >-
      P-LAP was shown to degrade several bioactive neuropeptides such as
      Met-enkephalin and dynorphin A (1-8).
  - reference_id: PMID:11701721
    supporting_text: >-
      Therefore, we studied subcellular localization of GLUT4 and insulin-regulated
      aminopeptidase (IRAP; also referred to as vp165 or gp160), which is a
      constituent of GLUT4 vesicles and also translocates to PM in response to
      insulin.
- description: >-
    In human dendritic cells, LNPEP/IRAP occupies Rab14-positive early and recycling
    endosomes, interacts with MHC class I molecules, and trims proteasome-derived
    exogenous peptide precursors for cross-presentation. This pathway is distinct
    from soluble cytosolic aminopeptidase trimming: full-length LNPEP remains an
    integral endosomal-membrane protein with its catalytic domain facing the
    endosomal lumen. The requirement is cell-state dependent, being prominent in
    inflammatory monocyte-derived dendritic cells but dispensable for steady-state
    cross-presentation by conventional CD8-positive dendritic cells in mouse.
  molecular_function:
    id: GO:0070006
    label: metalloaminopeptidase activity
  directly_involved_in:
