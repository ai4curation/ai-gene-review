core_functions:
- description: 'CLN6 cooperates with CLN8 to recruit soluble lysosomal enzyme precursors at
    the ER. Its luminal-loop region is required for the tested enzyme associations; CLN6 remains
    in the ER while CLN8 supports subsequent Golgi delivery. CLN6 self-association is integrated
    into this recruitment role: the luminal-loop deletion retains self-association but loses
    enzyme association, so self-association alone is insufficient for recruitment. The assays
    do not resolve a scaffold geometry or simultaneous cargo/coat-adaptor bridging, and equivalent
    function has not been established for both annotated products.'
  locations:
