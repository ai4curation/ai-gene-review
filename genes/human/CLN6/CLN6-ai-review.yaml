id: Q9NWW5
gene_symbol: CLN6
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CLN6 is a multipass endoplasmic-reticulum membrane protein involved in the delivery
  of newly synthesized lysosomal enzymes. Together with CLN8, it recruits enzyme precursors
  at the ER, while CLN8 subsequently accompanies cargo toward the Golgi. CLN6 forms homodimers
  and exposes luminal regions involved in recruitment. Its deficiency impairs lysosomal degradative
  capacity and causes neuronal ceroid lipofuscinosis, with progressive neurological and visual
  dysfunction. Secondary cellular observations include altered lipid distribution and lysosomal
  pH.
