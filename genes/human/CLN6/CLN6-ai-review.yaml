    label: endoplasmic reticulum membrane
  supported_by:
  - reference_id: PMID:32597833
    supporting_text: recruitment of newly synthesized lysosomal enzymes
  - reference_id: PMID:41392992
  - reference_id: PMID:15010453
  proposed_molecular_function: lysosomal enzyme recruitment activity at the endoplasmic reticulum
suggested_questions:
- question: Does CLN6 directly bridge lysosomal cargo and CLN8, or alter cooperative cargo recognition
    without a stable bridging geometry?
  experts:
  - ER export and lysosomal enzyme-trafficking specialists
- question: How does the altered N terminus of CLN6 isoform 2 affect localization, self-association
    and enzyme recruitment?
  experts:
  - CLN6 protein-topology and isoform specialists
- question: Which lipid and pH abnormalities arise directly from CLN6-dependent recruitment,
    and which follow secondary lysosomal dysfunction?
  experts:
  - Lysosomal physiology specialists
suggested_experiments:
- hypothesis: CLN6 provides a distinct cargo-recognition contribution to the CLN6–CLN8 system.
  description: Reconstitute defined CLN6, CLN8 and individual enzyme precursors with verified
    membrane topology. Measure direct contacts, stoichiometry and cargo recruitment, separating
    pairwise association from simultaneous bridging; sequence-verify the luminal-loop variants
    because published deletion coordinates disagree.
  experiment_type: Biochemical reconstitution and contact mapping
- hypothesis: The alternative N terminus changes CLN6 recruitment function.
  description: Compare sequence-verified canonical and isoform-2 proteins at matched expression
    in a CLN6-null background, measuring ER localization, dimerization and synchronized enzyme
    export with a secretory-cargo control.
  experiment_type: Isoform-specific functional complementation
proposed_new_terms:
- proposed_name: lysosomal enzyme recruitment activity at the endoplasmic reticulum
  proposed_definition: Selective association with newly synthesized soluble lysosomal enzyme
    precursors that recruits them to an endoplasmic-reticulum resident complex for subsequent
    Golgi delivery.
  justification: CLN6 and CLN8 cooperate in enzyme recruitment, while CLN8 mediates subsequent
    COPII export. A recruitment activity describes the demonstrated contribution without asserting
    that CLN6 directly binds the coat, independently escorts cargo, or structurally holds the
    complex together. Ontology parent placement remains to be assessed. The current GO:0038024
    cargo receptor activity definition requires a membrane-spanning receptor to engage cargo
    and coat adaptors together for vesicle delivery. CLN6 remains ER-resident in the tested
    recruitment system, and simultaneous CLN6 cargo/coat-adaptor engagement is not established;
    CLN8 supplies the demonstrated export role. GO:0038024 is therefore not asserted for CLN6
    from these experiments.
  supported_by:
  - reference_id: PMID:32597833
  - reference_id: PMID:41392992
