taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'ZDHHC4 is a DHHC-family multi-pass S-acyltransferase that resides mainly in endoplasmic-reticulum,
  Golgi and plasma-membrane compartments. It transfers palmitate from palmitoyl-CoA to cysteine residues
  in selected protein substrates, regulating substrate stability and membrane localization; reported targets
  include DRD2, CD36, GSK3B, and MAVS. During RNA-virus or epigenetic-perturbation signaling, CPT1A recruits
  ER-localized ZDHHC4 to palmitoylate MAVS on Cys79, stabilizing MAVS and potentiating antiviral type
  I interferon signaling.'
