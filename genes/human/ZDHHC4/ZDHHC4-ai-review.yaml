suggested_questions:
- question: Which endogenous ZDHHC4 substrates are modified at the ER rather than at Golgi or 
    plasma-membrane pools, and does CPT1A recruit ZDHHC4 specifically for MAVS or for a broader 
    substrate class?
- question: How are the ER-retention KXX motif and the observed Golgi/plasma-membrane pools balanced
    across cell types and ZDHHC4 substrates?
suggested_experiments:
- description: Isoform- and compartment-resolved rescue of ZDHHC4-null cells with wild-type ZDHHC4, 
    catalytic-dead DHHC-mutant ZDHHC4, and KXX-sorting mutants followed by acyl-RAC or acyl-biotin 
    exchange assays for MAVS, DRD2, CD36 and GSK3B.
- description: CPT1A-dependence assays for ZDHHC4-MAVS proximity and MAVS Cys79 palmitoylation using
    endogenous tagging, proximity labeling, and CPT1A mutants that separate carnitine 
    acyltransferase activity from ZDHHC4 recruitment.
