- term:
    id: GO:0005432
    label: calcium:sodium antiporter activity
  evidence_type: IDA
  original_reference_id: PMID:40200126
  qualifier: enables
  negated: true
  review:
    summary: 'A NOT annotation: Garbincius et al. conclude that TMEM65 is an NCLX binding partner
      required for sodium-dependent mitochondrial calcium efflux, but is not itself the exchanger,
      because the TMEM65 effect is abolished by deletion or pharmacological inhibition of NCLX.'
    action: UNDECIDED
    reason: 'GOA carries this GO term on TMEM65 twice with opposite polarity - NOT|enables IDA from
      PMID:40200126 and enables IDA from PMID:40691517, both curated by UniProt on the same date.
      GO has annotated both sides of a live dispute rather than choosing between them, and there
      is no basis in the published evidence for choosing either. Position B (this annotation) rests
      on a clean epistatic result: TMEM65 overexpression accelerates matrix calcium efflux in control
      fibroblasts but has no effect in Nclx-null fibroblasts. Position A rests on reconstitution
      of purified TMEM65 into liposomes, which a Cell Metab commentary argues cannot distinguish
      calcium binding from calcium translocation, and on TMEM65-induced exchange in Sf9 mitochondria
      that lack native activity. No electrophysiological recording of purified TMEM65 exists. UNDECIDED
      rather than ACCEPT or REMOVE, for both entries; accepting either would assert a resolution
      the evidence does not support.'
    supported_by:
    - reference_id: PMID:40200126
      supporting_text: we identify the mitochondrial inner membrane protein TMEM65 as an NCLX binding
        partner that enhances sodium (Na+)-dependent mCa2+ efflux. Mechanistically, acute pharmacological
        NCLX inhibition or genetic deletion of NCLX ablates the TMEM65-dependent increase in mCa2+
        efflux, and loss-of-function studies show that TMEM65 is required for Na+-dependent mCa2+
        efflux.
    - reference_id: PMID:40200126
      supporting_text: These findings suggest that TMEM65 limits net matrix Ca2+ accumulation upon
        increased cytosolic Ca2+, but that this effect requires NCLX.
    - reference_id: PMID:41061666
      supporting_text: Unfortunately, this experiment cannot distinguish simple binding of Ca2+ to
        TMEM65 protein embedded in the proteoliposome membrane from actual transport of Ca2+ across
        the membrane.
- term:
    id: GO:0005432
    label: calcium:sodium antiporter activity
  evidence_type: IDA
  original_reference_id: PMID:40691517
  qualifier: enables
  review:
    summary: Zhang et al. conclude that TMEM65 is itself the mitochondrial Na+/Ca2+ exchanger, on
      the basis of exchange activity induced in Sf9 mitochondria that lack native mito-NCX and of
      purified TMEM65 reconstituted into liposomes.
    action: UNDECIDED
    reason: GOA carries this GO term on TMEM65 twice with opposite polarity - NOT|enables IDA from
      PMID:40200126 and enables IDA from PMID:40691517, both curated by UniProt on the same date.
      GO has annotated both sides of a live dispute rather than choosing between them, and there
      is no basis in the published evidence for choosing either. Position A (this annotation) has
      the stronger reductionist design - heterologous reconstitution with NCLX verified absent from
      the preparation, plus a tissue distribution that tracks mito-NCX activity where NCLX's does
      not - but its liposome assay measures 45Ca2+ accumulation, which a Cell Metab commentary argues
      cannot distinguish binding from transport, and no electrophysiology on purified TMEM65 exists.
      Position B's epistatic result (no TMEM65 effect in Nclx-null cells) is unexplained under Position
      A. UNDECIDED rather than ACCEPT, for both entries; accepting this one while a NOT annotation
      of the same term stands would assert a resolution the evidence does not support.
    supported_by:
    - reference_id: PMID:40691517
      supporting_text: Heterologous expression of TMEM65 induces Na+/Ca2+ exchange in cells lacking
        native mito-NCX activity. Moreover, purified, liposome-reconstituted TMEM65 exhibits key
        mito-NCX features.
    - reference_id: PMID:40691517
      supporting_text: Lastly, we verified that no NCLX was co-purified or co-reconstituted with
