id: Q6PI78
gene_symbol: TMEM65
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'Small polytopic protein of the mitochondrial inner membrane, imported via a cleaved
  N-terminal targeting sequence and comprising a matrix-exposed soluble segment followed by three
  transmembrane helices. TMEM65 is expressed most strongly in heart, skeletal muscle and brain and
  is essentially absent from liver. It is required for sodium-dependent export of calcium from the
  mitochondrial matrix: loss of TMEM65 abolishes this efflux and causes matrix calcium overload,
  primes mitochondria for permeability transition, and produces cardiac and neuromuscular failure
  in mice, while a homozygous human splice variant causes a severe mitochondrial encephalomyopathy.
  TMEM65 forms a homodimer and carries conserved acidic and polar residues (Asp132, Asn163, Ser166,
  Asp167) whose mutation abolishes calcium efflux, and it is a binding target of CGP-37157, the classical
  inhibitor of mitochondrial sodium/calcium exchange. Whether TMEM65 is itself the transport protein
  or an obligatory partner of the exchanger NCLX/SLC8B1 is unresolved and actively disputed: purified
  TMEM65 reconstituted into liposomes reportedly reproduces the hallmarks of mitochondrial sodium/calcium
  exchange, whereas in fibroblasts the effect of TMEM65 on calcium efflux is abolished by deletion
  of NCLX. A distinct body of work also localises Tmem65 to the cardiac intercalated disc, where
  it is reported to stabilise connexin 43 and support ventricular development and cardiac conduction;
  this pool is not reproduced in the mitochondrial studies and its relationship to the inner-membrane
  protein is unclear.'
