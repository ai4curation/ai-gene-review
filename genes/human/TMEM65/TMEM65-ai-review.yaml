core_functions:
- description: TMEM65 is an obligatory component of the machinery that exports calcium from the mitochondrial
    matrix in exchange for sodium, acting from the mitochondrial inner membrane. Its requirement
    is established by three independent groups - depletion abolishes sodium-dependent matrix calcium
    efflux, raises matrix calcium and primes mitochondria for permeability transition, and in mice
    produces cardiac and neuromuscular failure. TMEM65 forms a homodimer and carries conserved acidic
    and polar residues whose substitution abolishes efflux, and it binds CGP-37157, the classical
    mito-NCX inhibitor. No molecular function term is asserted here, because whether TMEM65 is the
    ion-translocating protein (GO:0005432 calcium:sodium antiporter activity) or an obligatory partner
    of NCLX/SLC8B1 is unresolved; GOA records both readings as opposing IDA annotations of the same
    term, and the reconstitution experiment that would distinguish them has not been done in a form
    that separates calcium binding from calcium translocation.
  directly_involved_in:
  - id: GO:0099093
    label: calcium export from the mitochondrion
  locations:
  - id: GO:0005743
    label: mitochondrial inner membrane
  supported_by:
  - reference_id: PMID:40200126
    supporting_text: loss-of-function studies show that TMEM65 is required for Na+-dependent mCa2+
      efflux
  - reference_id: PMID:40691517
    supporting_text: TMEM65 is highly expressed in the heart and brain but absent in the liver, correlating
      with mito-NCX activity in these tissues.
  - reference_id: PMID:41061666
    supporting_text: Zhang et al. provide compelling evidence supporting a critical role for TMEM65
      in mCa2+ extrusion.
suggested_questions:
- question: Does purified TMEM65 translocate ions across a membrane, or does it only bind calcium?
    The 45Ca2+ proteoliposome accumulation assay in PMID:40691517 cannot distinguish the two; electrophysiological
    recording of reconstituted TMEM65, or simultaneous bilayer Ca2+ and Na+ reporters, would decide
    between Position A (TMEM65 is the exchanger) and Position B (TMEM65 is a required partner of
    NCLX).
- question: Why does the TMEM65 effect on matrix calcium efflux require NCLX in mouse embryonic fibroblasts
    (PMID:40200126) while TMEM65 alone suffices to generate exchange in Sf9 mitochondria and in liposomes
    (PMID:40691517)? Is there a cell-type-dependent requirement, or does one system report something
    other than exchange?
- question: Is CGP-37157 a direct inhibitor of TMEM65, of NCLX, or of both? The inhibitor-binding
    residues reported for TMEM65 were mapped in cells with intact endogenous NCLX.
- question: What is the physical stoichiometry of a TMEM65-NCLX assembly, and does TMEM65 loss alter
    NCLX oligomeric state or stability rather than its intrinsic activity?
- question: Is the cardiac intercalated-disc pool of Tmem65 a genuine second localisation, and if
    so how does a protein with a cleaved mitochondrial targeting sequence reach the sarcolemma?
suggested_experiments:
- description: Reconstitute purified TMEM65 into planar lipid bilayers and record currents under imposed
    Na+ and Ca2+ gradients, testing for the electrogenic, CGP-37157-sensitive exchange predicted
    by Position A and for loss of current in the D132/N163/S166/D167 mutants.
- description: Repeat the Sf9 heterologous-expression experiment in a system verified to lack any
    NCLX orthologue by genome search and proteomics, and in parallel test whether TMEM65 can generate
    exchange in NCLX-knockout mammalian mitochondria.
- description: Determine a cryo-EM structure of the TMEM65 homodimer, with and without NCLX, to establish
    whether TMEM65 has a continuous ion pathway and whether the two proteins form a stoichiometric
    complex.
- description: Measure matrix Na+ (not only Ca2+) directly in TMEM65-null and NCLX-null cells with
    a targeted Na+ sensor, to test whether TMEM65 loss abolishes Na+ entry into the matrix as a true
    exchanger model requires.
