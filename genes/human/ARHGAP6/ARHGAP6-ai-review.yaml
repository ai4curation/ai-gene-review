- id: PMID:18434237
  title: 'Regulation of phospholipase C-delta1 by ARGHAP6, a GTPase-activating protein for RhoA: possible
    role for enhanced activity of phospholipase C in hypertension.'
  findings:
  - statement: Under in vitro conditions ARHGAP6 activates PLC-delta1 by a direct mechanism - occluding
      the sites at which inhibitory phospholipids bind - raising the enzyme's maximal rate and its calcium
      responsiveness.
    supporting_text: ARHGAP6 increased the V(max) of PLC-delta1 and enhanced its response to Ca(2+) stimulation.
    reference_section_type: ABSTRACT
  - statement: 'The hypertension link is correlative, not a manipulation: ARHGAP6 mRNA and protein are
      higher in mononuclear cells from hypertensive patients, alongside higher PLC activity, IP3 and DAG.
      This is why the IP3 and DAG numbers are not offered as support for the process annotation.'
    supporting_text: Enhanced expression of ARHGAP6 was associated with an elevated level of PLC activity
      and increased levels of IP(3) (1.6-fold) and DAG (2.3-fold).
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'The source of the three BHF-UCL phospholipase annotations that are in UniProt but not
      in current GOA. Verified against PubMed: Ochocka et al., Int J Biochem Cell Biol 2008. Note the
      title misspells the gene as ARGHAP6, which is why symbol-driven searches and the affinage report
      both miss it. Abstract only in cache; the quoted claims are all in the abstract.'
- id: PMID:19038263
  title: Genetic screening in C. elegans identifies rho-GTPase activating protein 6 as novel HERG regulator.
  findings:
  - statement: ARHGAP6 lowers HERG/KCNH2 current and cell-surface channel density, and the effect survives
      both a dominant-negative Rho and a GAP-dead ARHGAP6 while being lost when PLC is inhibited - so
      it is a GAP-independent, PLC-routed output.
    supporting_text: ARHGAP6 effects were maintained when we introduced a dominant negative rho-GTPase,
      or ARHGAP6 devoid of rhoGAP function, indicating ARHGAP6 regulation of HERG is independent of rho
      activation.
    reference_section_type: ABSTRACT
  - statement: 'The channel effect is not an overexpression artefact: suppressing endogenous ARHGAP6 in
      an atrial myocyte line raises IKr by about half.'
    supporting_text: In an atrial myocyte cell line, suppression of endogenous ARHGAP6 by virally transduced
      shRNA led to a 53% enhancement of I(Kr).
    reference_section_type: ABSTRACT
  - statement: The mechanism is a reduction in the number of channels at the membrane rather than a change
      in gating.
    supporting_text: Biochemical measurements of cell-surface associated HERG revealed that ARHGAP6 reduced
      membrane expression of HERG by 35%, which correlates well with the reduction in current.
    reference_section_type: ABSTRACT
  - statement: The catalytic arginine finger of ARHGAP6 is R433, and R433G is the established loss-of-GAP
      reagent. The result is Prakash et al. 2000's (PMID:10699171), whose abstract names the residue only
      as 'a conserved arginine residue in the rhoGAP domain'; this paper is where the position is stated
      explicitly, and is quoted for that reason.
    supporting_text: Mutation of the conserved arginine at position 433 to a glycine (R433G) abolishes
      the rhoGAP activity of ARHGAP6
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Independent evidence that an ARHGAP6 output is GAP-independent and PLC-dependent, and
