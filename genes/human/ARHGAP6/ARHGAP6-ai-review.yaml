core_functions:
- description: 'RhoA-directed GTPase-activating protein. ARHGAP6 binds RhoA and accelerates its intrinsic
    GTP hydrolysis through the Rho-GAP domain (residues 401-602), whose arginine finger R433 stabilises
    the transition state. The cellular readout is the canonical RhoA-off phenotype: stress fibres and
    focal adhesions disassemble and the cell body retracts. Arginine-finger dependence is what makes this
    arm separable from the rest of the protein - R433G abolishes stress-fibre loss while leaving process
    outgrowth intact. The residue itself is verified present (alignment to the 1TX4-resolved ARHGAP1 R282,
    plus UniProt''s SITE feature), but retention is not the evidence for activity: in this family the
    residue and curated GAP activity are decoupled in both directions, so the functional mutant is what
    carries the claim. Substrate specificity is for RhoA; a single co-precipitation with Rac3 has been
    read by a pathway database as RAC3-directed GAP activity, which the data do not establish.'
  molecular_function:
    id: GO:0005096
    label: GTPase activator activity
  directly_involved_in:
  - id: GO:0007266
    label: Rho protein signal transduction
  - id: GO:0051497
    label: negative regulation of stress fiber assembly
  - id: GO:0051895
    label: negative regulation of focal adhesion assembly
  locations:
  - id: GO:0015629
    label: actin cytoskeleton
  supported_by:
  - reference_id: PMID:10699171
    supporting_text: Mutation of a conserved arginine residue in the rhoGAP domain prevents the loss of
      stress fibers but has little effect on process outgrowth.
  - reference_id: PMID:10699171
    supporting_text: Transfected mammalian cells expressing ARHGAP6 lose their actin stress fibers, retract
      from the growth surface and extend thin, branching processes resembling filopodia.
  - reference_id: file:human/ARHGAP6/ARHGAP6-bioinformatics/RESULTS.md
    supporting_text: '| ARHGAP6 | O43182 (sv3) | 401-602 | R433 | R433 | yes | RETAINED |'
  knowledge_gaps:
  - gap_statement: GO cannot record that ARHGAP6's GAP activity is RhoA-directed, so the annotation is
      indistinguishable from that of a GAP with any other substrate.
    boundary: 'The specificity itself is not in doubt for RhoA - it is in the title of the primary paper
      and is reproduced by a family-wide specificity screen. What is missing is a machine-readable place
      to put it on the molecular function: GO:0005096 has no descendants on either OLS4 or api.geneontology.org,
      and QuickGO''s only child of it is a cellular component reached by capable_of. Whether ARHGAP6 is
      also a RAC3 GAP is a separate and genuinely open question.'
    gap_kind:
    - ONTOLOGY
    dark_aspect: RESIDUAL_SUBGAP
    status: OPEN
    significance: A pathway database has already assigned ARHGAP6 RAC3-directed GAP activity on the strength
      of a co-immunoprecipitation, and that assertion re-enters GOA as a TAS row indistinguishable from
      the well-supported RhoA one. An expressible substrate slot would separate them.
- description: 'GAP-independent actin remodelling. An N-terminal region of ARHGAP6 co-localises with filamentous
    actin and recruits F-actin into thin, branching, filopodium-like processes that the cell extends while
    its body retracts. This arm is defined by a clean genetic separation rather than by a measured biochemical
    activity: the GAP-dead R433G mutant still drives process outgrowth, and targeted disruption of the
    rhoGAP domain alone leaves mice phenotypically normal. No molecular function is asserted for it, and
    that omission is deliberate. Attaching the GAP activity would contradict the evidence that defines
    the arm, and attaching a binding or structural function would assert a mechanism nobody has measured
    - what exists is co-localisation and recruitment in transfected cells, not a demonstrated actin-binding,
    nucleating, bundling or capping activity. The molecular_function slot is optional; leaving it empty
    states the evidence accurately.'
  directly_involved_in:
  - id: GO:0007015
    label: actin filament organization
  locations:
  - id: GO:0015629
    label: actin cytoskeleton
  - id: GO:0005884
    label: actin filament
  supported_by:
  - reference_id: PMID:10699171
    supporting_text: The ARHGAP6 protein co-localizes with actin filaments through an N-terminal domain
      and recruits F-actin into the growing processes.
  - reference_id: PMID:10699171
    supporting_text: 'These results suggest that ARHGAP6 has two independent functions: one as a GAP with
      specificity for RhoA and the other as a cytoskeletal protein that promotes actin remodeling.'
  - reference_id: PMID:10699171
    supporting_text: Surprisingly, loss of the rhoGAP function of Arhgap6 does not cause any detectable
      phenotypic or behavioral abnormalities in the mutant mice.
  knowledge_gaps:
  - gap_statement: 'The molecular activity underlying ARHGAP6''s GAP-independent actin remodelling is
      unidentified: no direct actin-binding, nucleating, bundling or severing activity has been measured
      for the N-terminal region.'
    boundary: That the activity exists and is separable is not speculative - it survives the R433G catalytic
      mutant, and the rhoGAP-domain knockout mouse is normal. What is unknown is what the N-terminal region
      does at the molecular level, and even whether it contacts actin directly rather than through a partner.
      The evidence is co-localisation and recruitment in transfected cells.
    gap_kind:
    - BIOLOGY
    dark_aspect: MF_DARK
    status: OPEN
    significance: This is the arm the knockout evidence suggests carries most of ARHGAP6's biology, and
      it is the one with no molecular function at all. Until it is identified, the protein's most consequential
      activity cannot be placed in a causal model.
- description: Activation of phospholipase C-delta1. ARHGAP6 binds PLC-delta1 and increases its catalytic
    output, raising the enzyme's maximal rate and its responsiveness to calcium by occluding the sites
    at which inhibitory phospholipids bind. The activation is reported under in vitro conditions as well
    as in cells, so it is an activity of ARHGAP6 rather than an indirect consequence of lowering RhoA-GTP,
    and cellular PLC activity rises about six-fold when ARHGAP6 is overexpressed. The IP3 (1.6-fold) and
    DAG (2.3-fold) elevations reported in the same paper belong to a different observation - mononuclear
    cells from hypertensive subjects, where raised ARHGAP6 was found alongside raised PLC activity - and
    are a correlation, not a measurement in the transfected cells. A second laboratory, working on an
    unrelated question, found that an ARHGAP6 effect on HERG/KCNH2 surface expression persists in a GAP-dead
    mutant and in the presence of dominant-negative Rho but is lost when PLC is inhibited - independent
    evidence that ARHGAP6 has a PLC-routed, GAP-independent output.
  molecular_function:
    id: GO:0016004
    label: phospholipase activator activity
  directly_involved_in:
  - id: GO:0141214
    label: positive regulation of phospholipase C/protein kinase C signal transduction
  supported_by:
  - reference_id: PMID:18434237
    supporting_text: Under in vitro conditions, ARHGAP6 protein activated PLC-delta1.
  - reference_id: PMID:18434237
    supporting_text: The activity of PLC in cells overexpressing ARHGAP6 increased approximately 6-fold
      compared to control cells.
  - reference_id: PMID:19038263
    supporting_text: ARHGAP6 effects were maintained when we introduced a dominant negative rho-GTPase,
      or ARHGAP6 devoid of rhoGAP function, indicating ARHGAP6 regulation of HERG is independent of rho
      activation.
  knowledge_gaps:
  - gap_statement: Whether ARHGAP6 regulates PLC-delta1 under physiological expression, and in which cells,
      is unknown; the cellular evidence is from overexpression, and the one disease association is correlative.
    boundary: 'The direct biochemistry is solid and does not depend on expression level: purified ARHGAP6
      activates purified PLC-delta1. What is untested is whether endogenous ARHGAP6 sets PLC-delta1 activity
      in any normal tissue. The reported elevation of ARHGAP6 with raised PLC activity in mononuclear
      cells from hypertensive subjects is an association in patient material, not a demonstration of the
      mechanism in vivo.'
    gap_kind:
    - BIOLOGY
    dark_aspect: RESIDUAL_SUBGAP
    status: OPEN
    significance: This arm is the only one of the three with an identified molecular partner and a measurable
      enzymatic readout, which makes it the most tractable route to testing what ARHGAP6 does outside
      transfected cells.
suggested_questions:
- question: Is ARHGAP6 a GAP for any Rho-family GTPase other than RhoA? Reactome assigns it RAC3-directed
    GAP activity on the basis of a co-immunoprecipitation, and no study has measured its GAP activity
    against Rac3 directly.
- question: The GO molecular function GO:0005096 has no descendants, so a GAP's substrate cannot be recorded
    on the activity term. Should substrate be captured with has input on the GAP activity for ARHGAP6,
    and would that be applied consistently across the RhoGAP family?
- question: Three BHF-UCL annotations (GO:0016004, GO:0043274, GO:0141214) appear in UniProt's cross-references
    for O43182 but not in GOA, while mouse and rat ISO rows in GOA still name O43182 as their source for
    those same terms. Were the human annotations withdrawn deliberately, and if so should the dependent
    projections be withdrawn with them?
- question: What does the N-terminal region of ARHGAP6 bind in order to co-localise with F-actin and recruit
    it into extending processes? Is the interaction with actin direct?
- question: The published HERG result shows a GAP-independent, PLC-dependent reduction in channel surface
    expression, with both overexpression and knockdown arms. It is not proposed as an annotation here
    because it is a single laboratory working largely in heterologous systems and the effect is routed
    through PLC rather than exerted on the channel. Is that the right threshold, or is the knockdown in
    atrial myocytes sufficient?
suggested_experiments:
- hypothesis: ARHGAP6 is a GAP for RhoA but not for Rac3, and the pathway-database assignment of RAC3-directed
    GAP activity is an over-reading of a binding experiment.
  description: Measure GAP-stimulated GTP hydrolysis by purified ARHGAP6 Rho-GAP domain against RhoA,
    Rac1, Rac3 and Cdc42 side by side, with the R433G mutant as the negative control and a characterised
    RhoA GAP as the positive control. A binding-only result for Rac3 with no acceleration of hydrolysis
    would settle the Reactome assignment.
  experiment_type: biochemical assay
- hypothesis: The N-terminal region of ARHGAP6 binds filamentous actin directly.
  description: Co-sedimentation of purified N-terminal fragments with F-actin, with a titration to obtain
    an affinity, plus TIRF microscopy of the same fragments on actin filaments to distinguish binding
    from bundling and from nucleation. Include a fragment that fails to co-localise in cells as the negative
    control.
  experiment_type: biochemical assay
- hypothesis: Endogenous ARHGAP6 sets PLC-delta1 activity in a cell type where both are expressed.
  description: 'Deplete ARHGAP6 with independent siRNAs or a knockout in a cell line expressing both proteins
    endogenously, and measure PLC activity, IP3 and DAG. Rescue with wild-type and with the R433G mutant:
    PLC-delta1 activation should be restored by both if it is genuinely GAP-independent.'
  experiment_type: loss of function
- hypothesis: The actin-remodelling arm, not the GAP arm, accounts for ARHGAP6's contribution to phenotype
    in vivo.
  description: Compare the existing rhoGAP-domain-disrupted mouse with a full Arhgap6 null and with an
    N-terminal deletion that removes the actin-co-localising region, phenotyping the cytoskeleton and
    cell morphology in a tissue where expression is high (kidney, heart, skeletal muscle). The published
    rhoGAP-only disruption is normal, so a phenotype in the other two lines would localise the biology.
  experiment_type: genetic
