id: O43182
gene_symbol: ARHGAP6
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'Rho GTPase-activating protein 6 (ARHGAP6) is an X-linked (Xp22.3) member of the RhoGAP superfamily:
  a largely disordered 974-residue protein built around a single Rho-GAP domain (residues 401-602) whose
  catalytic arginine finger is R433, carrying SH3-binding proline-rich motifs and terminating in a class
  I PDZ-binding motif (...LPETLV) that recruits a wide range of PDZ scaffolds. It has at least two genetically
  separable activities. Through its GAP domain it accelerates GTP hydrolysis on RhoA, and cells expressing
  it lose actin stress fibres and focal adhesions and retract from the growth surface; this arm requires
  R433. Independently of GAP catalysis, an N-terminal region co-localises with filamentous actin and recruits
  F-actin into thin, branching, filopodium-like processes, so the protein also behaves as a cytoskeletal
  component rather than purely as a switch regulator. A further GAP-independent activity is biochemical
  activation of phospholipase C-delta1: ARHGAP6 binds PLC-delta1 and raises its maximal rate and its calcium
  responsiveness by occluding inhibitory phospholipid binding sites, and raises cellular PLC output several
  fold when overexpressed; raised ARHGAP6 has separately been found alongside raised PLC activity, IP3
  and DAG in mononuclear cells from hypertensive subjects. A PLC-dependent, GAP-independent ARHGAP6 effect
  lowers cell-surface expression of the HERG/KCNH2 potassium channel. Targeted disruption of the rhoGAP
  domain alone leaves mice phenotypically normal, consistent with the non-catalytic arms carrying much
  of the protein''s biology. The gene lies in the Xp22.3 critical region for microphthalmia with linear
  skin defects and is deleted in affected individuals, though its contribution to that phenotype is unresolved.
  Expression is highest in kidney, heart and skeletal muscle, and the gene is subject to X inactivation.'
