- term:
    id: GO:0005096
    label: GTPase activator activity
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-8981637
  qualifier: enables
  review:
    summary: Reactome's RHOA-GAP event, and the better-grounded of its two GAP assertions for this protein.
    action: ACCEPT
    reason: R-HSA-8981637 places ARHGAP6 in the tier of GAPs shown to bind RHOA and stimulate its GTPase
      activity, citing Prakash et al. 2000 (PMID:10699171) and Muller et al. 2020 (PMID:32203420), the
      latter a family-wide substrate-specificity screen. Two independent lines for the same claim; this
      is the row that carries the RhoA GAP activity properly.
    supported_by:
    - reference_id: PMID:10699171
      supporting_text: Transfected mammalian cells expressing ARHGAP6 lose their actin stress fibers,
        retract from the growth surface and extend thin, branching processes resembling filopodia.
    - reference_id: PMID:32203420
      supporting_text: Through a family-wide characterization of substrate specificities, interactomes
        and localization, we reveal at the systems level how RhoGEFs and RhoGAPs contextualize and spatiotemporally
        control Rho signalling.
- term:
    id: GO:0005096
    label: GTPase activator activity
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-9018806
  qualifier: enables
  review:
    summary: Same term, but reached through a RAC3-GAP claim that rests on a co-immunoprecipitation.
    action: ACCEPT
    reason: 'The assertion is true and is kept: GO:0005096 is substrate-agnostic and ARHGAP6 enables it
      for RhoA. What is unsupported is the route. R-HSA-9018806 is ''RAC3 GAPs stimulate RAC3 GTPase activity'',
      and Reactome puts ARHGAP6 in its top tier - binds RAC3 and stimulates its GTPase activity - on a
      single citation, Li et al. 2016 (PMID:26628301), whose only Rac3 experiment is a co-immunoprecipitation;
      GTPase activity is never measured. Reactome''s own RHOA event cites Muller et al. 2020, which places
      ARHGAP6 among the RhoA-directed GAPs. Unsupported is not contradicted, so the row is not downgraded;
      the defect is recorded here and in propagation_review instead. GO cannot express the distinction
      on this term: GO:0005096 has zero descendants on both OLS4 and api.geneontology.org, and QuickGO''s
      single child GO:1902773 is a cellular component reached by capable_of, so there is no substrate-specific
      GAP term to move to.'
    supported_by:
    - reference_id: PMID:26628301
      supporting_text: Co-immunoprecipitation assay was performed to validate the interaction between
        Arhgap6 and Rac3 (Ras-related C3 botulinum toxin substrate 3).
    propagation_review:
      root_cause: SOURCE_WEAK_OR_INFERRED
      failure_modes:
      - SOURCE_EVIDENCE_WEAK
      source_entities:
      - source_id: Reactome:R-HSA-9018806
        source_label: RAC3 GAPs stimulate RAC3 GTPase activity
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: Assigns ARHGAP6 RAC3-directed GAP activity on the strength of PMID:26628301, which shows
          binding only.
      residue_claims_not_applicable: The issue is substrate assignment by a pathway database, not a residue
        in ARHGAP6; the catalytic machinery is intact and is not in question here.
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:36115835
  qualifier: enables
  supporting_entities:
  - UniProtKB:O75970
  review:
    summary: Direct binding of ARHGAP6's C-terminal class I motif to a PDZ domain of MPDZ; replace the
      generic term with PDZ domain binding.
    action: MODIFY
    reason: 'Generic protein binding is uninformative as a molecular function, but here the cited paper
      does support a more specific one, so this is a MODIFY rather than a REMOVE. PMID:36115835 is a holdup
      screen of a recombinant PDZome library against a library of C-terminal PDZ-binding motif peptides,
      and IntAct records this pair as a direct interaction detected by holdup assay (MI:2437). MPDZ carries
      13 PDZ domains, and ARHGAP6 terminates in ...LPETLV, a canonical class I PDZ-binding motif. What
      was measured is therefore binding between ARHGAP6''s C-terminal motif and a PDZ domain, which GO:0030165
      states exactly. Nothing beyond that is asserted - no adaptor, scaffolding, localisation or signalling
      role - because interaction evidence alone would not support one. Note that the cached full text
      of PMID:36115835 never names ARHGAP6: the pair is in the supplementary peptide library, so the per-pair
      evidence above is read from IntAct''s curated record of that paper rather than from its prose.'
    supported_by:
    - reference_id: file:human/ARHGAP6/ARHGAP6-bioinformatics/RESULTS-pdz-interactome.md
      supporting_text: 'Distinct partners parsed from the GOA file: **22** (from 22 binding rows). Carrying
        at least one PDZ domain: **22**.'
    - reference_id: file:human/ARHGAP6/ARHGAP6-bioinformatics/RESULTS-binding-evidence.md
      supporting_text: '| MPDZ | O75970 | holdup assay (MI:2437) | direct interaction |'
