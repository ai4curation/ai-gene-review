- term:
    id: GO:0005096
    label: GTPase activator activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - MGI:MGI:1196332
  - PANTHER:PTN000973894
  review:
    summary: Phylogenetic propagation of RhoA-GAP activity onto a protein that has its own experimental
      grounding for it.
    action: ACCEPT
    reason: 'ARHGAP6 is a bona fide RhoA-directed GAP. The catalytic arginine finger is present and verified:
      a domain alignment to the structurally resolved anchor ARHGAP1 R282 (PDB 1TX4 chain A Arg85) and
      UniProt''s own SITE feature independently place it at R433, and R433G is the mutation the literature
      uses to abolish GAP activity. Residue retention alone would not settle it, because in this family
      the residue and the annotation record come apart. The strong case is ARHGAP11B, which retains the
      arginine and carries two curated experimental NOT|enables GO:0005096 rows. The converse cases are
      weaker and are cited as facts about the annotation record rather than about activity: ARHGAP36 and
      OCRL substitute the arginine and still carry positive GO:0005096 rows, but those are an IBA and
      a FlyBase-assigned IDA that other literature disputes, so what they establish is that a positive
      GAP annotation can sit on a residue-dead protein, not that such proteins are active. Either way
      the decisive support here is functional: cells expressing wild-type ARHGAP6 lose stress fibres and
      the R433G mutant does not. The IBD node is seeded by mouse Arhgap6 (MGI:MGI:1196332), which carries
      its own IDA for this term from the same primary paper, so the propagation is both phylogenetically
      sound and experimentally anchored. Core.'
    supported_by:
    - reference_id: PMID:10699171
      supporting_text: 'These results suggest that ARHGAP6 has two independent functions: one as a GAP
        with specificity for RhoA and the other as a cytoskeletal protein that promotes actin remodeling.'
    - reference_id: PMID:10699171
      supporting_text: Mutation of a conserved arginine residue in the rhoGAP domain prevents the loss
        of stress fibers but has little effect on process outgrowth.
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: MGI:MGI:1196332
        source_label: Arhgap6 (Mus musculus)
        source_status: SUPPORTS_TRANSFER
        comment: Carries enables GO:0005096 by IDA from PMID:10699171 and PMID:25211221. The latter is
          titled for Arhgap28; the curator read the full text, which our cache does not have, so it is
          recorded as supporting rather than challenged.
      - source_id: PANTHER:PTN000973894
        source_label: PTN000973894
        source_status: SUPPORTS_TRANSFER
        comment: Ancestral node at which PAINT placed the GAP activity.
      residue_claims:
      - claim_type: RETAINED
        anchor:
          accession: UniProtKB:Q07960
          position: 282
          residue: R
          sequence_version: 1
        target:
          accession: UniProtKB:O43182
          position: 433
          residue: R
          sequence_version: 3
        role: arginine finger; stabilises the GTP hydrolysis transition state
        method: MSA
        comment: Correspondence from a global BLOSUM62 alignment of the two UniProt-annotated Rho-GAP
          domains, anchored on ARHGAP1 R282, which is verified against PDB 1TX4 chain A Arg85 by an exact
          sequence-window match rather than asserted. Both records' UniProt Arginine finger SITE features
          agree with the alignment call, and PMID:19038263 names R433 as the residue whose mutation abolishes
          GAP activity. Retention is recorded because it refutes a pseudo-GAP reading, not because it
          demonstrates activity.
