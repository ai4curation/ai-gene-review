  label: Homo sapiens
description: >-
  LONRF1 is a poorly characterized RING-family protein containing two conserved
  RING-type zinc-finger regions and a C-terminal region homologous to the
  substrate-binding N-terminal domain of Lon proteases. Conserved family
  relationships, preservation of the RING architectures, and a yeast two-hybrid interaction with
  the ubiquitin-conjugating enzyme UBE2L6 support ubiquitin protein ligase activity,
  although ubiquitin transfer by LONRF1 itself has not been directly demonstrated
  and no physiological substrate is established. The protein lacks the AAA+ ATPase
  and proteolytic domains required for Lon peptidase activity. Its native site of
  action is unresolved, and direct localization evidence is lacking. An alternative
  isoform replaces residues 452-462 immediately before the second RING region, but
  no isoform-specific functional difference has been tested.
