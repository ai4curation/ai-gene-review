core_functions:
- description: >-
    Predicted RING-type ubiquitin protein ligase activity. This assignment is
    supported by the accepted IBA annotation, two conserved RING-type zinc-finger
    regions, and a yeast two-hybrid interaction with UBE2L6. It remains an
    evidence-bounded inference because no direct LONRF1 ubiquitin-transfer assay,
    physiological substrate, ubiquitin-chain topology, biological process, native
    location, or stable complex has been established.
  molecular_function:
    id: GO:0061630
    label: ubiquitin protein ligase activity
  supported_by:
  - reference_id: PMID:19549727
    supporting_text: >-
      In this study, yeast two-hybrid (Y2H) screens were combined with true homology modeling methods to generate a high-density map of human E2/E3-RING interactions.
  - reference_id: file:human/LONRF1/LONRF1-bioinformatics/RESULTS.md
    supporting_text: >-
      These results support an intact RING-family interaction/metal-binding scaffold and are compatible with GO:0061630 (ubiquitin protein ligase activity). They do **not**, by sequence comparison alone, demonstrate ubiquitin transfer, E2 recruitment, substrate recognition, or catalytic activity; experimental E3 evidence remains preferable for GO:0061630.
knowledge_gaps:
- gap_statement: >-
    Direct ubiquitin ligase activity by LONRF1 and its E2 requirements, chain
    products, and physiological substrates have not been established.
  boundary: >-
    An IBA annotation, two conserved RING regions, and a yeast two-hybrid edge to
    UBE2L6 support a RING-E3 model, but none is a LONRF1-specific ubiquitin-transfer
    assay and interaction-screen partners cannot be assumed to be substrates.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: >-
    Direct catalysis and substrate identification are required to distinguish an
    active ubiquitin ligase from a RING-containing interaction scaffold and to
    refine the molecular activity beyond the broad parent term.
  resolution: >-
    Reconstitute full-length LONRF1 with candidate human E2 enzymes and ubiquitin,
    compare wild type with RING-disrupting variants, and measure E2~ubiquitin
    discharge, autoubiquitination, substrate ubiquitination, and chain linkage.
- gap_statement: >-
    The biological process in which LONRF1-mediated ubiquitination acts is unknown.
  boundary: >-
    Reactome supplies only generic ubiquitination-cycle reactions, proteome-scale
    interaction screens do not identify a validated endogenous substrate, and
    transcriptomic associations in mouse cells do not demonstrate LONRF1-dependent
    protein quality control, proteasomal degradation, oxidative-stress defense, or
    tissue remodeling.
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  status: OPEN
  significance: >-
    Without a causal substrate and phenotype, no substrate-specific ubiquitination
    or downstream protein-quality-control process can be assigned to human LONRF1.
  resolution: >-
    Combine acute endogenous LONRF1 loss with diGly ubiquitin-remnant proteomics and
    quantitative protein-turnover measurements, then rescue candidate changes with
    wild-type but not RING-disrupted LONRF1 and validate direct substrates
    biochemically.
- gap_statement: >-
    The native subcellular location and any stable macromolecular complex of LONRF1
    are unknown.
  boundary: >-
    Reactome models LONRF1 in the cytosol, but those annotations derive from generic
    pathway reactions rather than direct localization experiments, and the many
    binary interaction-screen partners do not define a stable complex.
  gap_kind:
  - BIOLOGY
  - CURATION
  dark_aspect: CC_DARK
  status: OPEN
  significance: >-
    Compartment and complex context constrain which E2 enzymes and candidate
    substrates can encounter LONRF1 physiologically.
  resolution: >-
    Endogenously tag LONRF1 and combine quantitative imaging, biochemical
    fractionation, proximity labeling, and orthogonal co-complex validation under
    basal and proteotoxic-stress conditions.
- gap_statement: >-
    Whether the canonical product and isoform 2 differ in activity, stability,
    localization, or partner selection is unknown.
  boundary: >-
    Isoform 2 replaces residues 452-462 immediately N-terminal to the second RING
    region, but no GO annotation targets this isoform and no isoform-comparative
    experiment is available; proximity to the RING region alone does not establish
    an isoform-specific effect.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    A local sequence replacement could affect regulation of the inferred E3 module,
    but treating the two products as functionally distinct without direct evidence
    would overstate current knowledge.
  resolution: >-
    Express matched, sequence-verified isoforms at endogenous levels and compare
    E2 engagement, ubiquitination activity, stability, localization, and validated
    substrate recognition, including RING-disrupting controls.
proposed_new_terms: []
suggested_questions:
- question: >-
    Does full-length human LONRF1 directly catalyze ubiquitin transfer, and which
    E2 enzyme or enzymes support that reaction under physiological conditions?
- question: >-
    Which endogenous proteins are direct LONRF1 substrates, and does their
    modification alter stability, localization, interaction, or activity rather
    than necessarily targeting them for proteasomal degradation?
- question: >-
    Where does endogenous LONRF1 act, and are the numerous binary-interaction hits
    reproducible partners, transient substrates, or screening-context artifacts?
- question: >-
    Does the residues 452-462 replacement in isoform 2 alter the neighboring RING
    module or any other property relative to the canonical product?
suggested_experiments:
- hypothesis: >-
    LONRF1 is an active RING-type E3 whose ubiquitin-transfer activity requires an
    intact RING region and is supported by a restricted subset of human E2 enzymes.
  description: >-
    Reconstitute purified full-length LONRF1 with an E1, ubiquitin, and a panel of
    candidate E2 enzymes including UBE2L6. Measure E2~ubiquitin discharge,
    autoubiquitination, and free or substrate-linked ubiquitin chains, comparing
    wild type with structure-guided zinc-coordinating-residue mutants in each RING
    region.
  experiment_type: in vitro ubiquitination assay
- hypothesis: >-
    Acute loss of LONRF1 changes ubiquitination and abundance of a small set of
    endogenous direct substrates.
  description: >-
    Engineer an acute degron at the endogenous LONRF1 locus, then perform matched
    diGly ubiquitin-remnant proteomics, quantitative total proteomics, and pulse-
    chase turnover analysis before and after depletion. Rescue prioritized changes
    with wild-type versus RING-disrupted LONRF1 and test direct ubiquitination of
    validated candidates in a purified system.
  experiment_type: acute perturbation and ubiquitin proteomics
- hypothesis: >-
    LONRF1 occupies a regulated cellular compartment and engages a limited local
    interaction network that is obscured by proteome-scale binary screens.
  description: >-
    Introduce a minimally disruptive endogenous fluorescent or proximity-labeling
    tag, map localization and proximal proteins under basal and proteotoxic-stress
    conditions, and validate high-confidence partners by reciprocal endogenous
    co-immunoprecipitation and size-exclusion or native-complex analysis.
  experiment_type: endogenous localization and proximity proteomics
- hypothesis: >-
    The sequence replacement in isoform 2 modulates the adjacent RING module without
    necessarily creating an isoform-exclusive function.
  description: >-
    Compare sequence-verified canonical and isoform-2 products expressed from the
    same genomic landing site at matched levels for stability, localization, E2
    binding, in vitro ubiquitination, and validated substrate modification, with
    equivalent RING-disrupting variants as mechanistic controls.
  experiment_type: isoform-comparative functional analysis
