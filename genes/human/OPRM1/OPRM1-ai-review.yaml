core_functions:
- description: 'Receptor for exogenous alkaloid and synthetic opioids: MOR binds morphine and related
    drugs (heroin, fentanyl, methadone, buprenorphine) at the neuronal plasma membrane and activates Gi/o,
    inhibiting adenylyl cyclase and, through G beta-gamma, presynaptic voltage-gated calcium channels
    and transmitter release. It is the molecular target required for morphine analgesia, reward and dependence.'
