  review:
    summary: G protein-coupled opioid receptor activity - the defining molecular function of OPRM1.
    action: ACCEPT
    reason: Cloned human MOR binds opiate drugs and opioid peptides in a GTP-sensitive manner and inhibits
      cAMP (PMID:7905839), and couples to G-protein-activated K+ channels (PMID:7891175). Single-molecule
      work shows agonists at uOR drive GDP release from bound Gi, with efficacy tracking the rate of Galpha
      AHD opening (PMID:42870023).
