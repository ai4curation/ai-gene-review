- term:
    id: GO:0048149
    label: behavioral response to ethanol
  evidence_type: IMP
  original_reference_id: PMID:21039637
  qualifier: involved_in
  review:
    summary: 'Behavioral response to ethanol (IMP, PMID:21039637: OPRM1 Asp40 allele associated with greater
      cue-induced alcohol craving in heavy drinkers).'
    action: KEEP_AS_NON_CORE
    reason: 'The cited human study is a preliminary genetic association, but the process assignment rests
      on mechanistic loss-of-function evidence: mu-opioid receptor knockout mice do not self-administer
      ethanol in operant or two-bottle paradigms and show ethanol aversion. MOR is therefore required
      for ethanol reinforcement. This is an organismal behavioural phenotype downstream of receptor signaling,
      so it is kept as non-core.'
    additional_reference_ids:
    - PMID:10869404
    supported_by:
    - reference_id: PMID:10869404
      supporting_text: In no case did knockout mice show evidence of ethanol self-administration, and,
        in fact, these mice showed evidence of an aversion to ethanol under several experimental conditions.
    - reference_id: PMID:21039637
      supporting_text: The Asp40 allele of the OPRM1 was associated with greater cue-induced alcohol craving
        following the neutral imagery condition.
- term:
    id: GO:0050769
    label: positive regulation of neurogenesis
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P42866
  - ensembl:ENSMUSP00000101227
  review:
    summary: Positive regulation of neurogenesis (IEA transfer from mouse Oprm1, P42866). The mouse annotation
      is an IMP from Rios et al., who studied neuritogenesis in mouse Neuro-2A cells on activation of
      mu opioid and CB1 cannabinoid receptors.
    action: KEEP_AS_NON_CORE
    reason: The source examined neurite outgrowth (neuritogenesis) in a neuroblastoma cell line, which
      falls under neurogenesis in GO through neuron projection development, and found that receptor activation
      affects it and that co-activation of MOR and CB1 attenuates the response. The evidence is cell-line
      based and abstract-only here, and the effect is downstream of receptor signaling, so it is kept
      as non-core.
