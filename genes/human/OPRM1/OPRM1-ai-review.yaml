core_functions:
- description: 'Opioid-activated Gi/o-coupled receptor: binds endogenous opioid peptides (beta-endorphin,
    enkephalins, endomorphins) and opiate drugs (morphine, fentanyl) at the cell surface and catalyses
    GDP/GTP exchange on Gi/o alpha subunits; ligand efficacy is reflected in how fast the bound Galpha
    alpha-helical domain opens for GDP release.'
