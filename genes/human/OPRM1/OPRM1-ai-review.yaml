id: P35372
gene_symbol: OPRM1
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Mu-type opioid receptor (MOR, uOR), a class A rhodopsin-like G protein-coupled receptor and
  the principal receptor for endogenous opioid peptides (beta-endorphin, enkephalins, endomorphins) and
  for clinically used and abused opiates such as morphine, fentanyl, methadone and heroin. Agonist binding
  at the extracellular orthosteric pocket stabilises active receptor conformations that engage pertussis
  toxin-sensitive Gi/o heterotrimers at the plasma membrane and catalyse GDP release from the Galpha subunit;
  agonist efficacy is encoded in part by how rapidly the bound Galpha alpha-helical domain opens to permit
  GDP release. Released Galpha(i/o)-GTP and Gbetagamma inhibit adenylate cyclase, activate GIRK potassium
  channels and inhibit N- and L-type voltage-gated calcium channels, reducing neuronal excitability and
  presynaptic transmitter release; secondary outputs include ERK and PLC activation. Receptor activity
  is terminated by GRK phosphorylation, beta-arrestin recruitment and endocytosis to endosomes with recycling.
  Expressed on neuronal somata, dendrites and presynaptic terminals in pain and reward circuits, MOR mediates
  opioid analgesia, reward, respiratory depression, tolerance and dependence. The gene is extensively
  alternatively spliced; for example, the 6TM MOR1K isoform is retained intracellularly and couples to
  Gs, and truncated SV1/SV2 isoforms modulate ligand binding of full-length receptor. The common A118G
  (N40D) variant alters beta-endorphin affinity and potency.
