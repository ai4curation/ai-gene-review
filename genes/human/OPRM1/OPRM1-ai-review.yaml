id: P35372
gene_symbol: OPRM1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'OPRM1 encodes the mu-type opioid receptor (MOR), a class A (rhodopsin-like) seven-transmembrane
  G protein-coupled receptor and the principal receptor for endogenous opioid peptides (beta-endorphin,
  endomorphins, enkephalins) and for morphine and most clinically used opioid analgesics (fentanyl, methadone,
  buprenorphine) and drugs of abuse (heroin). Located at the plasma membrane of neurons in the central
  and peripheral nervous system, agonist-bound MOR couples predominantly to pertussis toxin-sensitive
  Gi/o proteins: the Galpha(i/o) subunit inhibits adenylyl cyclase, while released G beta-gamma activates
  G protein-gated inwardly rectifying K+ (GIRK) channels and inhibits N- and L-type voltage-gated Ca2+
  channels, hyperpolarizing neurons and suppressing presynaptic neurotransmitter release; MAPK/ERK and
  phospholipase C branches are also engaged. Activated MOR is phosphorylated by GRKs, binds beta-arrestins,
  and is internalized through clathrin-coated pits and recycled, processes that govern desensitization
  and tolerance. MOR is required for morphine analgesia, reward and physical dependence, and its signaling
  also underlies respiratory depression. The gene is extensively alternatively spliced; the common N40D
  (A118G) variant alters beta-endorphin binding and potency, and some isoforms (e.g. the 6TM MOR1K) have
  distinct coupling or act as dominant modulators of full-length receptor binding.'
