suggested_questions:
- question: Should GO distinguish G protein-biased from beta-arrestin-dependent mu-opioid receptor signaling
    (for example separate process terms for G protein-mediated versus arrestin-scaffolded MOR signaling),
    given ligands such as PZM21 that activate Gi with minimal beta-arrestin-2 recruitment and the debated
    contribution of each arm to analgesia versus respiratory depression and tolerance?
  experts:
  - GO signaling editors
  - opioid receptor pharmacologists
- question: Which human OPRM1 splice isoforms are translated at physiologically meaningful levels in brain,
    and should isoform-specific annotations (e.g. Gs coupling and intracellular retention of 6TM MOR1K,
    binding-incompetent SV1/SV2) be propagated to the gene level?
  experts:
  - OPRM1 splicing researchers
- question: Is "regulation of cellular response to stress" (IMP, PMID:21039637) based on an OPRM1-by-stress
    analysis in the full text, given that the abstract attributes stress-induced craving to a different
    gene?
  experts:
  - OPRM1 curators
suggested_experiments:
- description: Compare Gi/o activation (GTP-gamma-S, cAMP inhibition, GIRK current) with beta-arrestin-2
    recruitment and MOR internalization across a panel of balanced and biased agonists in matched human
    cell lines, and correlate each arm with downstream readouts.
  hypothesis: G protein-biased MOR agonists engage the Gi/adenylyl-cyclase-inhibiting arm while sparing
    the GRK/beta-arrestin desensitization arm.
- description: Express individual human OPRM1 splice isoforms (canonical MOR1, 6TM MOR1K, SV1/SV2) in
    a null background and measure ligand binding, G protein coupling (Gi/o versus Gs), surface versus
    intracellular localization, and dominant-negative effects on co-expressed MOR1.
  hypothesis: Specific OPRM1 isoforms diverge in coupling and trafficking and modulate canonical receptor
    function.
- description: Quantify presynaptic calcium current and evoked transmitter release at MOR-expressing terminals
    during MOR agonism with and without G beta-gamma scavengers or GIRK/Cav2.2 perturbation.
  hypothesis: MOR suppresses transmitter release chiefly through G beta-gamma inhibition of presynaptic
    voltage-gated calcium channels.
