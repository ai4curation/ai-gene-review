suggested_questions:
- question: Do the uOR-Gi AHD-opening kinetics measured with mouse uOR (PMID:42870023) hold for human
    OPRM1 and for its N40D (A118G) variant, and do clinically used partial agonists such as buprenorphine
    differ between them?
- question: Is efficacy-dependent control of the Galpha alpha-helical domain opening also seen with Go
    and Gz, the other G proteins MOR couples to, and does it contribute to agonist-dependent G protein
    subtype selectivity?
- question: Which of the many OPRM1 splice isoforms (e.g. 6TM MOR1K, SV1/SV2) are translated at physiologically
    meaningful levels in human neurons, and does MOR1K-Gs coupling contribute to opioid-induced hyperalgesia
    in vivo?
- question: Among the dozens of reported MOR-interacting proteins from yeast two-hybrid and bead-array
    screens (FLNA, RANBP9, WLS, SIAH1/2, RAMPs), which engage endogenous MOR in neurons and shape signalling,
    trafficking or desensitization rather than being screen artefacts?
suggested_experiments:
- hypothesis: Agonist efficacy at human OPRM1 is set by the rate of Gi alpha-helical domain opening, as
    shown for mouse uOR.
  description: Repeat the single-molecule FRET assay of Deutsch et al. (PMID:42870023) with purified human
    OPRM1 (and the N40D variant) coupled to human Gi1, across a graded agonist panel (DAMGO, morphine,
    buprenorphine, fentanyl), correlating low-FRET open-state occupancy with GTP turnover.
  experiment_type: single-molecule biophysics
- hypothesis: The 6TM MOR1K isoform signals through Gs and opposes canonical MOR1 Gi/o signalling in human
    neurons.
  description: Express tagged MOR1 and MOR1K isoforms in human iPSC-derived neurons, quantify surface
    vs intracellular localization, and measure cAMP and calcium responses to morphine with and without
    isoform-specific knockdown.
  experiment_type: cell biology / signalling
- hypothesis: A subset of reported MOR interactors are required for agonist-induced internalization or
    desensitization of endogenous MOR.
  description: Knock out candidate interactors (FLNA, RANBP9) in a neuronal line expressing endogenous
    MOR and measure DAMGO/morphine-induced receptor endocytosis, arrestin recruitment and desensitization
    of adenylate cyclase inhibition.
  experiment_type: genetic perturbation
