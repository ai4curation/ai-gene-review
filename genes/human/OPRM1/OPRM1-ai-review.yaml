- term:
    id: GO:0005245
    label: voltage-gated calcium channel activity
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: enables
  supporting_entities:
  - UniProtKB:P33535
  review:
    summary: ISS transfer from rat Oprm1 (P33535) asserting voltage-gated calcium channel activity.
    action: REMOVE
    reason: MOR is a seven-transmembrane GPCR with no pore-forming channel domain. It inhibits N- and
      L-type voltage-gated calcium channels indirectly via Gi/o-released G beta-gamma; the effector channel
      activity belongs to CACNA1B/CACNA1C etc., not to the receptor. This is an effector-for-receptor
      error in the donor annotation.
    supported_by:
    - &id018
      reference_id: file:human/OPRM1/OPRM1-uniprot.txt
      supporting_text: including inhibition of adenylate cyclase activity and both N-type and L-type calcium
        channels
    - &id015
      reference_id: file:human/OPRM1/OPRM1-uniprot.txt
      supporting_text: OPRM1-mediated inhibition of voltage-gated calcium channels on central presynaptic
        terminals of primary afferent nociceptors is thought to be one of the primary mechanisms mediating
        analgesia at the spinal level
