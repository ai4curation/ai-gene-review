- term:
    id: GO:0005245
    label: voltage-gated calcium channel activity
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: enables
  supporting_entities:
  - UniProtKB:P33535
  review:
    summary: ISS transfer from mouse of voltage-gated calcium channel activity.
    action: REMOVE
    reason: OPRM1 is a seven-transmembrane GPCR, not an ion channel. MOR inhibits N- and L-type voltage-gated
      calcium channels indirectly through Gi/o (Gbetagamma) signalling; that is regulation of channel
      activity by a receptor, not channel activity of the receptor itself. The MF is wrong for this gene
      product.
