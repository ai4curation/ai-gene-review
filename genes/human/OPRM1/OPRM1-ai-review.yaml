- term:
    id: GO:0001965
    label: G-protein alpha-subunit binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN002796119
  - UniProtKB:P35372
  review:
    summary: 'PAINT IBA: OPRM1 binds Gi/o alpha subunits as part of receptor-catalysed G protein activation.'
    action: ACCEPT
    reason: Direct coupling of agonist-bound MOR to Gi/o alpha subunits is the mechanistic heart of its
      receptor activity. Deutsch et al. (PMID:42870023) imaged the receptor-bound Gi alpha-helical domain
      in uOR-Gi complexes and showed that agonist efficacy is encoded by how fast the bound Galpha opens
      for GDP release. Binding of Galpha is therefore a genuine and functionally central property (part
      of the GPCR activity), consistent with the IBA node.
    additional_reference_ids:
    - PMID:42870023
    supported_by:
    - &id001
      reference_id: file:human/OPRM1/OPRM1-uniprot.txt
      supporting_text: predominantly coupled to pertussis toxin-sensitive G(i) and G(o) G
    - &id002
      reference_id: PMID:42870023
      supporting_text: The μ-opioid receptors (μORs) are G-protein-coupled receptors (GPCRs) that mediate
        analgesia and reward responses to common opioid drugs by catalyzing guanine nucleotide exchange
        in heterotrimeric Gi proteins
    - &id003
      reference_id: PMID:42870023
      supporting_text: Full agonists promote AHD opening, facilitating GDP release and, therefore, efficient
        GTP binding.
