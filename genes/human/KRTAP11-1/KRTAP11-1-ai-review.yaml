id: Q8IUC1
gene_symbol: KRTAP11-1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Keratin-associated protein 11-1 (KAP11.1) is a 163-residue high-sulfur keratin-associated protein (PMG/Keratin_matx family), encoded in the chromosome 21q22.1 KAP gene domain. It is rich in serine, threonine and cysteine. In human hair it is expressed in the upper matrix and throughout the hair cortex. Recombinant KAP11.1 tends to be insoluble and aggregate-prone, consistent with its role as a component of the interfilamentous matrix that is disulfide cross-linked to trichocyte keratin intermediate filaments in the hair shaft. The ovine and goat orthologues are candidate wool and cashmere trait genes.
existing_annotations:
- term:
    id: GO:0005198
    label: structural molecule activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR007659
  review:
    summary: InterPro2GO structural molecule activity from the keratin matrix (Keratin_matx) domain.
    action: MODIFY
    reason: 'The structural role is correct, but GO has a more specific child term for proteins that contribute to the structural integrity of hairs: structural constituent of cutaneous appendage (GO:0030281). KAPs are structural matrix proteins of the hair fibre.'
    proposed_replacement_terms:
    - &id002
      id: GO:0030281
      label: structural constituent of cutaneous appendage
    supported_by:
    - &id001
      reference_id: file:human/KRTAP11-1/KRTAP11-1-uniprot.txt
      supporting_text: which are essential for the formation of a rigid and resistant hair shaft through their extensive disulfide bond cross-linking with abundant cysteine residues of hair keratins
    - reference_id: PMID:29391282
      supporting_text: KAPs are the major constituent of the matrix between the hair keratin intermediate filaments (IFs), and stabilise hair structure by extensive disulfide bonding.
