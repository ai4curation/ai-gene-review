suggested_questions:
- question: The rabbit study PMID:32955717 reports a mitochondrial localization and signalling effects of Krtap11-1 in a cell line; is there any in vivo evidence for a non-structural role?
- question: GO lacks a cellular component term for the keratin-associated interfilamentous matrix of the hair cortex/cuticle; should one be requested, as keratin filament is only an approximation?
suggested_experiments:
- hypothesis: Human KRTAP11-1 binds the same trichocyte keratins (K31/K33/K34) as its mouse orthologue, and does so through specific residues.
  description: The mouse orthologue has already been shown to adhere to hair-cortex type I keratins K31/K33/K34 (PMID:24439038), so the open question is whether human KAP11.1 recapitulates this and what the structural consequence of binding is. Test direct binding of purified human KAP11.1 to human K31/K33/K34 (and type II partners such as KRT83) by ITC or pull-down, map the interaction interface, and determine the structural consequence of KAP11.1 incorporation on keratin-filament packing by TEM or small-angle scattering.
  experiment_type: biochemical reconstitution
