  title: Characterization of a first domain of human high glycine-tyrosine and high sulfur keratin-associated protein (KAP) genes on chromosome 21q22.1.
  findings:
  - statement: Defines the chromosome 21q22.1 domain containing KRTAP11-1.
    supporting_text: Based on amino acid sequence comparisons of the encoded proteins, the KAP genes could be divided into seven high glycine-tyrosine gene families (KAP6-KAP8, and KAP19-KAP22) and four high sulfur gene families (KAP11, KAP13, KAP15, and KAP23).
  full_text_unavailable: true
  reference_review:
