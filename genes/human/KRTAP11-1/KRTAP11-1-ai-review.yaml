- id: PMID:24439038
  title: Krtap11-1, a hair keratin-associated protein, as a possible crucial element for the physical properties of hair shafts.
  findings:
  - statement: Mouse Krtap11-1 (the KRTAP11-1 orthologue) binds hair-cortex type I keratins K31, K33 and K34; the only primary functional study of a KAP11 protein.
    supporting_text: the biotinylated Krtap11-1 probe enabled the adherence to certain type I keratins in the hair cortex, including K31, 33 and 34, in the absence of disulfide formation.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified. Fujimoto et al. 2014; the only primary study of a KAP11 protein, using the mouse orthologue Krtap11-1. Demonstrates direct adherence of the KAP11-1 probe to type I hair keratins (K31/K33/K34) and a hair-shaft structural phenotype. Species caveat - the binding data are from mouse, not human KRTAP11-1.
