  - UniProtKB:P78385
  review:
    summary: High-throughput binary interaction (IPI, PMID:32296183) of KRTAP11-1 with KRT83 (UniProtKB:P78385), a type II hair keratin, annotated only as bare protein binding.
    action: MODIFY
    reason: 'Unlike the other PMID:32296183 interactome preys, this partner is itself a hair keratin: KRT83 (K83/Hb3, UniProtKB:P78385) is a type II trichocyte keratin co-expressed with KRTAP11-1 in the hair cortex, so the recovered interaction is biologically plausible rather than a non-hair spurious prey. Direct binding evidence from the mouse orthologue (Fujimoto et al. 2014, PMID:24439038) shows that a biotinylated Krtap11-1 probe adheres to hair-cortex type I keratins K31, K33 and K34, establishing that KAP11.1 binds trichocyte keratins. Rather than remove the row under the protein-binding policy, the uninformative GO:0005515 is modified to the specific child keratin filament binding (GO:1990254), mirroring the NEW keratin filament binding row in genes/human/KRTAP8-1. Species caveat: the direct binding data are from the mouse orthologue; whether human KRTAP11-1 binds the same keratins is not yet shown experimentally.'
    proposed_replacement_terms:
    - id: GO:1990254
      label: keratin filament binding
    supported_by:
    - reference_id: PMID:24439038
      supporting_text: the biotinylated Krtap11-1 probe enabled the adherence to certain type I keratins in the hair cortex, including K31, 33 and 34, in the absence of disulfide formation.
