taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'TCF7L1 is a nuclear HMG-box TCF/LEF transcription factor that binds Wnt cis-regulatory
  DNA on chromatin. Like other family members it can assemble with beta-catenin, but it is
  especially associated with TLE/CtBP-linked repression of canonical Wnt target genes and
  with beta-catenin-dependent relief of that repression in responsive cells.'
