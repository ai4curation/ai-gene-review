suggested_questions:
- question: Should UniProt-GOA add a direct TCF7L1 annotation to RNA polymerase
    II-specific DNA-binding transcription repressor activity to capture the
    TLE/Groucho-linked default repressor state?
- question: Should UniProt-GOA add a negative regulation of transcription by RNA
    polymerase II row for TCF7L1 so the default repressor state is represented on the
    biological-process side?
