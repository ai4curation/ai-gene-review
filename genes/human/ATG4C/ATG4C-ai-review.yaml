  review:
    summary: >-
      Family-wide IBA (ancestral ATG4 node PTN002503342, which includes yeast Atg4
      and all four human paralogs) for participation in autophagosome assembly via
      ATG8 processing. Human ATG4C appears in its own WITH/FROM, reflecting its own
      experimental annotation for this term.
    action: ACCEPT
    reason: >-
      ATG4C carries the conserved catalytic triad (Cys111/Asp345/His347, see
      bioinformatics RESULTS) and does part of the work of autophagosome assembly:
      it primes pro-GABARAPL1/L2 in human cells, which allows their lipidation on
      autophagic structures, and it delipidates ATG8-PE. Its contribution is
      partial and redundant with the paralogs, but it is real participation, and
      the target is inside the clade that inherited the function from the
      ancestral ATG4 node.
