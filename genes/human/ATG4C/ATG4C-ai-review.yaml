- id: file:human/ATG4C/ATG4C-bioinformatics/RESULTS.md
  title: ATG4C catalytic triad and PANTHER subfamily check
  findings:
  - statement: >-
      The ATG4B-defined catalytic triad is conserved in ATG4C (C111, D345, H347).
      Human, mouse and donkey ATG4C share PANTHER subfamily PTHR22624:SF38 and
      align end to end, while ATG4A, ATG4B and ATG4D are in separate subfamilies.
    supporting_text: 'query Q96DT6 length 458; triad residues: C111, D345, H347'
- id: file:human/ATG4C/ATG4C-uniprot.txt
  title: UniProtKB Q96DT6 (ATG4C_HUMAN) record
  findings: []
core_functions:
- description: >-
    Delipidation (deconjugation) of membrane-anchored ATG8-family proteins: ATG4C
    hydrolyses the amide bond between the C-terminal glycine of LC3/GABARAP and
    phosphatidylethanolamine, releasing ATG8 from autophagic membranes. Shown
    directly in two independent reconstitution studies.
  molecular_function:
    id: GO:0019786
    label: protein-phosphatidylethanolamide deconjugating activity
  directly_involved_in:
  - id: GO:0051697
    label: protein delipidation
  - id: GO:0000045
    label: autophagosome assembly
  locations:
  - id: GO:0005737
    label: cytoplasm
  supported_by:
  - reference_id: PMID:29458288
    supporting_text: all 4 ATG4 proteases can be activated to similar enzymatic activities
      on lipid-attached substrates
  - reference_id: PMID:33909989
    supporting_text: Consistent with published work, all four ATG4s can delipidate
      ATG8s from PE liposomes, to varying degrees
- description: >-
    Priming of pro-ATG8 proteins by cysteine-type endopeptidase cleavage after the
    conserved C-terminal glycine. This activity is weak for ATG4C compared with
    ATG4B, but measurable in vitro, and it contributes partially to
    GABARAPL1/GABARAPL2 priming and lipidation in human cells.
  molecular_function:
    id: GO:0004197
    label: cysteine-type endopeptidase activity
  directly_involved_in:
  - id: GO:0016485
    label: protein processing
  - id: GO:0000045
    label: autophagosome assembly
  locations:
  - id: GO:0005737
    label: cytoplasm
  supported_by:
  - reference_id: PMID:30661429
    supporting_text: the observation that loss of both ATG4C and ATG4D produced a
      complete inhibition of lipidation suggests a partial involvement of ATG4C in
      GABARAPL1/L2 priming
  - reference_id: PMID:21177865
    supporting_text: whereas Atg4C and Atg4D had minimal activities as did the catalytic
      mutant of Atg4B (C74S)
suggested_questions:
- question: >-
    Is ATG4C's major physiological role ATG8-PE delipidation rather than priming,
    and does it have a preferred ATG8 substrate (LC3 vs GABARAP subfamily) on
    membranes in cells?
- question: >-
    ATG4C was reported to be weakly or not involved in phagophore growth during
    PINK1/Parkin mitophagy. Is that a real paralog-specific difference, or does it
    reflect low ATG4C expression in the cell lines tested?
- question: >-
    The cytoplasm ISS row (GO_REF:0000024) cites mouse ATG4B (Q8BGE6), a paralog.
    Should this ISS source be re-pointed to mouse Atg4c (Q811C2), or dropped in
    favour of the IBA?
suggested_experiments:
- description: >-
    Single ATG4C knockout in an ATG4A/B/D-null background (for example HeLa
    quadruple knockout re-expressing ATG4C wild type or C111S), measuring LC3/GABARAP
    priming, ATG8-PE versus ATG8-PS levels, and autophagic flux, to define the
    activities ATG4C supports on its own in cells.
  experiment_type: genetic complementation
