id: Q96DT6
gene_symbol: ATG4C
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  ATG4C (autophagin-3) is one of the four human ATG4 cysteine proteases of the
  peptidase C54 family (papain-like fold, Cys111/Asp345/His347 catalytic triad by
  similarity to ATG4B). ATG4 enzymes process the ubiquitin-like ATG8 proteins
  (LC3 and GABARAP subfamilies) at two steps of macroautophagy: priming, in which
  the C-terminal residue(s) of the pro-ATG8 are cleaved to expose the glycine that
  is conjugated to phosphatidylethanolamine (PE) on the phagophore, and
  delipidation, in which the amide bond between that glycine and PE is hydrolysed
  to release and recycle ATG8 from membranes. Compared with ATG4B, which carries
  most priming activity in cells, ATG4C is a weak priming protease in vitro
  (measurable activity toward LC3B and GABARAPL2) and contributes only partially
  to GABARAPL1/GABARAPL2 priming in human cells lacking ATG4A and ATG4B. On
  membrane-anchored ATG8-PE substrates, by contrast, ATG4C delipidates with an
  activity comparable to the other ATG4 paralogs, so its main physiological role
  is likely ATG8 deconjugation. The protein is cytoplasmic. In a mitophagy assay,
  ATG4C contributed little or nothing to phagophore growth, unlike the other
  paralogs. A widely cited paper on ATG4C tissue distribution and activity, and a
  paper on Atg4c-deficient mice, have both been retracted.
