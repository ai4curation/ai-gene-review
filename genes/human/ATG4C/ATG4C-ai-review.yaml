  review:
    summary: >-
      IBA seeded only by yeast Atg4 (SGD:S000005167), propagated from the root ATG4
      node to all metazoan paralogs.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Piecemeal microautophagy of the nucleus was defined in budding yeast at
      nucleus-vacuole junctions, and its only experimental basis in this node is
      yeast Atg4. Atg4 in yeast is needed for any process that requires Atg8
      lipidation, so the donor annotation reflects the core Atg8 machinery rather
      than a function specific to this pathway. There is no evidence for this
      process in human cells or for ATG4C. The annotation is not demonstrably
