core_functions:
- molecular_function:
    id: GO:0031267
    label: small GTPase binding
  description: >-
    An effector, not an enzyme. Munc13-4 is recruited by small monomeric GTPases and converts a secretory
    lysosome into a granule that can fuse, and the molecular-function term that fits is the binding that
    does the recruiting: GO offers no child to be more precise with, since Rab GTPase binding and Rho
    GTPase binding were both merged into GO:0031267, and it offers no term at all for priming as an
    activity. Three GTPases are documented and they are not interchangeable. Rab27a forms a direct complex
    with it on the secretory lysosome; the binding site is mapped to Rab27a R141, Y159 and S163, and
    disease alleles on either side - Griscelli syndrome type 2 in RAB27A, familial haemophagocytic
    lymphohistiocytosis type 3 in UNC13D - break the complex and abolish secretion. Rab15 binds it too, in
    endothelium, cooperating with Rab27a to drive Weibel-Palade body exocytosis. RhoG binds it at the
    plasma membrane, increasing RhoG's own affinity for membrane lipids and thereby targeting Munc13-4 to
    them, which is what lets a granule dock. Downstream of that recruitment the protein has two separable
    jobs, shown in one paper to be independent: without Rab27a it assembles Rab11-positive recycling and
    Rab27-positive late endosomal vesicles into an exocytic-vesicle pool, and with active Rab27a it primes
    the lysosomal granule for fusion with it. UniProt summarises the pair as granule maturation plus
    granule docking and priming at the immunological synapse. The second half has no GO process term of
    its own, which is raised as a question below rather than invented here.
  directly_involved_in:
  - id: GO:0043316
    label: cytotoxic T cell degranulation
  - id: GO:1903307
    label: positive regulation of regulated secretory pathway
  - id: GO:0045921
    label: positive regulation of exocytosis
  locations:
  - id: GO:0101004
    label: cytolytic granule membrane
  - id: GO:0070382
    label: exocytic vesicle
  supported_by:
  - reference_id: PMID:15548590
    supporting_text: We show that Munc13-4 is a direct partner of rab27a.
  - reference_id: PMID:25312756
    supporting_text: All 6 patients carried mutations at amino acids R141, Y159, or S163 of Rab27a that
      disrupt the interaction of Rab27a with Munc13-4, without impairing the interaction between
      melanophilin and Rab27a.
  - reference_id: PMID:33513601
    supporting_text: We discovered that RhoG engages in a protein-protein interaction with Munc13-4, an
      exocytosis protein essential for CG fusion with the PM.
  - reference_id: PMID:17237785
    supporting_text: Independently of Rab27a, hMunc13-4 mediated the assembly of Rab11(+) recycling and
      Rab27(+) late endosomal vesicles, constituting a pool of vesicles destined for regulated exocytosis.
  - reference_id: file:human/UNC13D/UNC13D-uniprot.txt
    record_section: ["CC:FUNCTION"]
    supporting_text: Required for both granule maturation and granule docking and priming at the
      immunologic synapse.
  knowledge_gaps:
  - gap_kind:
    - BIOLOGY
    gap_statement: >-
      What the priming reaction physically is for this protein is not established. In the synaptic Munc13
      proteins the MUN domain catalyses the opening of closed syntaxin and the templating of the SNARE
      complex, and Munc13-4 has the homologous Munc13 homology domains - but what those domains have been
      shown to do here is target the protein to the secretory lysosome, not open a SNARE. Whether Munc13-4
      acts on syntaxin-11 the way Munc13-1 acts on syntaxin-1, whether it instead works only by tethering
      the exocytic vesicle to the granule, and what its calcium-binding C2 domains contribute to the
      timing, are all open. A reconstituted fusion assay with purified Munc13-4, syntaxin-11, Munc18-2 and
      SNAP23 would settle it.
    dark_aspect: MF_DARK
suggested_questions:
- question: >-
    GO has a priming term for each kind of vesicle whose priming has been studied - GO:0016082 synaptic
    vesicle priming and GO:0061789 dense core granule priming, both is_a protein-containing complex
    assembly and part_of their own granule's exocytosis - but none for the secretory lysosome. Munc13-4's
    central step therefore has no term, and the record has to express it as small GTPase binding plus
    positive regulation of exocytosis. Should a cytolytic granule priming term be created on the same
    pattern, part_of GO:0043316, so that the priming factor and the SNAREs it primes for can be told
    apart?
- question: >-
    UniProt and the paper title both say Munc13-4 is required for granule maturation, and this review
    does not annotate it, because the existing term does not seem to mean the same thing: GO:0061792
    secretory granule maturation and its descendant GO:1990502 carry six human annotations between them,
    all on neuroendocrine dense-core-vesicle biogenesis genes such as HID1, BAIAP3, PTPRN and SNX19,
    whereas what Munc13-4 does is deliver a separate endosomal vesicle that fuses with an already-formed
    granule. Is heterotypic delivery of a fusion partner the same process as dense-core biogenesis, and if
    not, which term should carry it?
- question: >-
    Munc13-4 is the effector of three different small GTPases - Rab27a on the granule, Rab15 in
    endothelium, RhoG at the plasma membrane - and in the RhoG case the direction of recruitment is
    reversed: the interaction increases RhoG's affinity for membrane lipids and thereby targets Munc13-4 to
    them. Is this one effector surface used three times, or separate sites? The answer decides whether a
    single small GTPase binding row is the right representation or whether three partner-specific rows are
    needed.
suggested_experiments:
- description: >-
    Reconstitute the fusion step with purified components - Munc13-4, syntaxin-11, Munc18-2, SNAP23 and
    VAMP8 on liposomes - and ask what Munc13-4 contributes. The readouts that distinguish the models are
    whether it accelerates SNARE complex assembly in the absence of any tether, whether it requires the
    closed conformation of syntaxin-11, and whether calcium acting through its C2 domains changes the rate
    rather than the extent of lipid mixing.
- description: >-
    Separate the two arms genetically in primary human cytotoxic T lymphocytes. The Rab27a-binding
    mutation that causes FHL3, Munc13-4 Delta608-611, should abolish granule priming while leaving
    exocytic-vesicle assembly intact, since that arm was shown to be Rab27a-independent; a mutation in the
    RhoG-binding surface should abolish docking at the plasma membrane while leaving both. Scoring granule
    polarisation, docking and CD107a surface exposure separately in each background would say whether the
    three activities are genuinely modular.
- description: >-
    Test whether the natural killer cell sibling term is warranted on the same evidence, by running the
    standard CD107a degranulation assay on FHL3 patient NK cells beside their cytotoxic T lymphocytes with
    the priming and docking steps scored by live imaging. The current GO annotation set has no gene
    carrying both GO:0043316 and GO:0043320, so a single study scoring both cell types for one gene would
    also show whether that split reflects biology or only which assay each paper happened to run.
