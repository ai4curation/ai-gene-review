      only as a NARROW synonym, so there is no Rab-specific child to use. The gene already carries
      GO:0031267 twice from the Weibel-Palade body screen, and under the ClinGen Mendelian project's
      standing instruction a supported generic binding row is modified when the evidence supports a more
      informative term rather than retained as non-core.
