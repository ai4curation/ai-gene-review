    action: MODIFY
    reason: >-
      This is the paper that established what Munc13-4 is, and the term it carries says only that two
      proteins touch. The finding is that Munc13-4 is a direct partner of Rab27a, that the two colocalise
      on secretory lysosomes in cytotoxic T lymphocytes and mast cells, and that the disease alleles on
