id: Q70J99
gene_symbol: UNC13D
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  UNC13D encodes Munc13-4, the priming factor that makes a secretory lysosome competent to fuse with the
  plasma membrane in haematopoietic cells. It is a cytosolic, peripheral membrane protein with no
  transmembrane segment: two Munc13 homology domains flanked by two C2 domains that bind calcium and
  membrane lipids, and it works as the effector of small GTPases rather than as an enzyme. Two of its jobs
  in a cytotoxic lymphocyte are separable. Independently of Rab27a it assembles Rab11-positive recycling
  and Rab27-positive late endosomal vesicles into a pool of exocytic vesicles; with active Rab27a, whose
  binding site on the GTPase is mapped and whose loss on either side causes disease, it primes the
  lysosomal cytotoxic granule itself for fusion. A third small GTPase, RhoG, recruits it to membrane lipids
  at the plasma membrane and so lets the granule dock there. When a target cell is recognised both
  organelles polarise to the contact area and the granule discharges perforin and granzymes into the
  immunological synapse. Biallelic loss of function causes familial haemophagocytic lymphohistiocytosis
  type 3, in which cytotoxic T and natural killer cells cannot degranulate and uncontrolled macrophage and
  T cell activation follows. The same machinery serves regulated secretion well beyond the cytotoxic
  lineage: mast cell secretory lysosomes, endothelial Weibel-Palade bodies, where it is an effector of
  Rab15 as well as Rab27a, and platelet granules.
