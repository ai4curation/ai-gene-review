  supporting_entities:
  - UniProtKB:B2RUP2
  - ensembl:ENSMUSP00000102058
  review:
    summary: Vasculature development, projected from the mouse ortholog by Ensembl Compara.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The route to this term is visible and it runs one step too far. Munc13-4 is required for the
      exocytosis of Weibel-Palade bodies, the endothelium's own regulated secretory organelle, and that
      cargo - von Willebrand factor, angiopoietin-2, P-selectin - bears on thrombosis, inflammation and
      angiogenesis. Secreting a cargo that acts on vessels is not participating in the development of
      the vasculature: the step UNC13D performs is the fusion of a granule, and everything downstream
      of release is done by the released proteins and by the cells that respond to them. The gene's own
      Weibel-Palade body location and its positive regulation of the regulated secretory pathway are
      accepted in this review and say what it does in endothelium without this overreach. Marked
      over-annotated rather than removed because the loss-of-function consequence for vessels is real;
      it is the attribution of the developmental process to this gene product that is too generous.
