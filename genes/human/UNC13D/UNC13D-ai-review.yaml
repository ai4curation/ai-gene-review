    label: extracellular region
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-6798751
  qualifier: located_in
  review:
    summary: Extracellular region, from Reactome's model of azurophil granule exocytosis.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Munc13-4 is not a secreted protein. It has no signal peptide and no transmembrane segment, UniProt
      gives it as cytoplasm and peripheral membrane with endosome and lysosome keywords and no Secreted
      keyword, and its two C2 domains bind calcium and membrane lipids - the architecture of a factor
      that works on the cytosolic face of a granule, not of a cargo that leaves with it. The Reactome
      event this row cites is the exocytosis of azurophil granule lumen proteins, so what the model
      places in the extracellular space is granule content; a priming factor that stays behind when the
      granule discharges is being carried along with the cargo it releases. Marked over-annotated rather
      than removed because the cached Reactome entry holds only the event summary and no participant
      list, so what Reactome actually asserts about this protein cannot be read from here - see the
      companion azurophil granule lumen row, where the same reservation is recorded as a source defect
      for Reactome to check.
