- term:
    id: GO:0035578
    label: azurophil granule lumen
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-6798751
  qualifier: located_in
  review:
    summary: Azurophil granule lumen, from Reactome's model of azurophil granule exocytosis.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The lumen is the one place in a granule this protein cannot be. Munc13-4 is made on free ribosomes
      - no signal peptide, no transmembrane segment, no Secreted keyword - and it reaches granule
      membranes from the cytosol through C2 domains that bind calcium and lipids; its documented job is
      to prime and dock the granule from outside, which is a job that only exists on the cytosolic face.
      Topologically, a protein in the azurophil granule lumen would be separated from Rab27a and RhoG by
      a bilayer. Neutrophil granule subfractions routinely carry co-purifying cytosolic and
      granule-surface proteins, which is the most likely route from a real observation to this term.
      Marked over-annotated rather than removed, and the correction recorded as a defect for Reactome to
      check rather than asserted: the cached Reactome entry holds the event summary only, with no
      participant list, so how this protein is modelled there cannot be read from here.
    source_defects:
    - defect_type: WRONG_TERM
      resource: REACTOME
      record: Reactome:R-HSA-6798751
      slot: participant_compartment
      requested_change: CHECK
      asserted_value: UNC13D located_in GO:0035578 azurophil granule lumen (and GO:0005576 extracellular
        region) via Exocytosis of azurophil granule lumen proteins
      corrected_value: UNC13D is a peripheral membrane protein on the cytosolic face of the granule;
        GO:0101004 cytolytic granule membrane or GO:0005765 lysosomal membrane would fit, not the lumen
        or the extracellular region
      cause: SCOPE_OVER_REACH
      confidence: PROBABLE
      explanation: >-
        Raised as a query rather than a confirmed error. The topology argument is strong and rests on the
        UniProt record rather than on inference - UNC13D has no signal peptide, no transmembrane segment
        and no Secreted keyword, and its C2 domains bind membrane lipids from the cytosol - and the
        partners that make it work, Rab27a and RhoG, are themselves cytosolic. What cannot be checked from
        here is what Reactome asserts: the cached entry for R-HSA-6798751 carries only the event summary,
        and the participant list, including any complexes or candidate sets that might place this protein
        more carefully, is not in it. A curator with the participant list should be able to settle it in
        one look, which is why requested_change is CHECK.
