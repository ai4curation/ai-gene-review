    label: regulation of transcription by RNA polymerase II
  - id: GO:0035329
    label: hippo signaling
  locations:
  - id: GO:0005634
    label: nucleus
  - id: GO:0000785
    label: chromatin
  in_complex:
    id: GO:0140552
    label: TEAD-YAP complex
  supported_by:
  - reference_id: PMID:18579750
    supporting_text: This unbiased strategy identified TEAD2, TEAD3, and TEAD4 as the strongest positives
      based on the transcription reporter assay.
  - reference_id: PMID:19324877
    supporting_text: Notably, all four TEAD family members, TEAD1, TEAD2, TEAD3, and TEAD4, were identified
      with high scores.
  - reference_id: PMID:20368466
    supporting_text: NMR studies reveal that the TEAD-binding domain of YAP is natively unfolded and that
      TEAD binding causes localized conformational changes in YAP.
suggested_questions:
- question: Which YAP/TAZ target genes and developmental outputs are uniquely dependent on TEAD2, rather than buffered by the other human TEAD paralogs?
- question: Which VGLL-family cofactors form physiological complexes with TEAD2 in human tissues, and do they activate or repress the same cis-regulatory targets as YAP/TAZ?
suggested_experiments:
- description: Use single and combinatorial CRISPR knockouts of TEAD1-4 followed by YAP/TAZ ChIP-seq and RNA-seq to separate TEAD2-specific Hippo targets from redundant pan-TEAD targets.
