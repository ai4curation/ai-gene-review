id: Q15562
gene_symbol: TEAD2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: TEAD2 encodes a nuclear TEA-domain transcription factor that binds MCAT/GT-IIC-related cis-regulatory DNA and recruits the Hippo-regulated YAP1 and WWTR1/TAZ coactivators through its C-terminal YAP-binding domain. TEAD2 is activated by YAP and TAZ in reporter assays, participates in nuclear TEAD-YAP and TEAD-TAZ transcriptional complexes, and functions with the other TEAD paralogs as a DNA-anchoring component of Hippo-responsive RNA polymerase II transcription.
