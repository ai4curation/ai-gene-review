core_functions:
- description: Sequence-specific DNA binding at RNA polymerase II cis-regulatory regions, with direct structural
    evidence that the TEAD2 YAP-binding domain docks the intrinsically disordered YAP TEAD-binding region
    to form a TEAD-YAP transcriptional complex.
  molecular_function:
    id: GO:0000981
    label: DNA-binding transcription factor activity, RNA polymerase II-specific
  directly_involved_in:
