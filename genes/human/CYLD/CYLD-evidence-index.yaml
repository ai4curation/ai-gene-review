- pmid: '17495026'
  url: https://pubmed.ncbi.nlm.nih.gov/17495026/
  cache: publications/PMID_17495026.md
  cache_sha256: 8be3bc79d67117a23721e826aaf2eb18ccfd2d33101f35c574e4c0a6726d3332
  cache_full_text_flag: true
  assessed_scope: Selected complete original Methods, Results and Discussion were read. Human siRNA/rescue
    supports G2/M regulation; microtubule and tagged midbody localization and PLK1 association are positive.
    Direct PLK1 deubiquitination is proposed rather than demonstrated.
- pmid: '18313383'
  url: https://pubmed.ncbi.nlm.nih.gov/18313383/
  cache: publications/PMID_18313383.md
  cache_sha256: 6cd8673338e686907ef02eb63deb81116449353879085bdb5c21e745246bc21b
  cache_full_text_flag: false
  assessed_scope: Complete abstract and primary RCSB 2VHF metadata/coordinates were assessed; full paper
    recovery failed. The human 583–956 USP structure and zinc contacts support enzyme/structural context
    but do not replace the unavailable localization/noncanonical-NF-kappaB assays. Established catalysis
    and broad location are independently corroborated; the precise noncanonical assertion remains undecided.
- pmid: '18636086'
  url: https://pubmed.ncbi.nlm.nih.gov/18636086/
  cache: publications/PMID_18636086.md
  cache_sha256: cb0f01324ab83f9f6bfe97a755a17bd7706964a0ef2d3998d77253a29f516757
  cache_full_text_flag: true
  assessed_scope: The cache reports full_text_available=true but its body lacks complete Results/Discussion.
    Separately recovered indexed original Results describe RIG-I, MAVS, TBK1 and IKK-epsilon associations
    and distinguish reporter effects. Literal current MINT pairs were checked. No complete-paper or figure-pixel
    audit is claimed.
- pmid: '19615732'
  url: https://pubmed.ncbi.nlm.nih.gov/19615732/
  cache: publications/PMID_19615732.md
  cache_sha256: c5d39d689b2d398c8ce606ccdd714b6bf4c46122ccc6354a2b8a0fdcfd209393
  cache_full_text_flag: false
  assessed_scope: Complete available abstract and two exact current CYLD–SPATA2 interaction records were
    checked. The original target table was not recovered; HEK293T association is corroborated independently
    by purified-domain studies.
- pmid: '19893491'
  url: https://pubmed.ncbi.nlm.nih.gov/19893491/
  cache: publications/PMID_19893491.md
  cache_sha256: c9977ed660d4951e5f0e9caa4dfcd58640cda8e3f2a16d3920530b58f45ae27e
  cache_full_text_flag: true
  assessed_scope: Selected complete original Methods/Results/Discussion establish microtubule cosedimentation,
    recombinant CYLD–HDAC6 binding and HDAC6 inhibition using immunoprecipitated/peptide-eluted proteins
    and bovine tubulin. G1/S effects need catalytic and N-terminal functions, unlike the C/S-persistent
    cytokinesis effect. No histone-inhibitor claim, figure-pixel or separate-supplement audit, or equal
    intact-product activity is inferred.
- pmid: '20194890'
  url: https://pubmed.ncbi.nlm.nih.gov/20194890/
  cache: publications/PMID_20194890.md
  cache_sha256: 4f25a57c0306209ac507e6bbe0c8cbc2a8a18f436a35c2d8a464c2363d0b0228
  cache_full_text_flag: false
  assessed_scope: The abstract and recovered indexed original Results/Figure captions support HUVEC microtubule
    dynamics, Rac1-related polarity and migration. Methods and Figure 2 caption describe membrane-fraction
    analysis, but the actual fraction result and precise leaflet assignment were not inspected. This is
    selected original access, not a complete full-paper or figure-pixel read.
- pmid: '20227366'
  url: https://pubmed.ncbi.nlm.nih.gov/20227366/
  cache: publications/PMID_20227366.md
  cache_sha256: a7e56a7d3c9cbe9008117f20516689bd2f47db237e459f856b45031d7e595c15
  cache_full_text_flag: false
  assessed_scope: Complete abstract supports Dishevelled K63 ubiquitination and canonical Wnt regulation.
    Full original recovery failed and the exact current DVL3 interaction join is empty. Broad function
    is supported; the precise DVL3 assertion remains undecided rather than declared false.
- pmid: '21525013'
  url: https://pubmed.ncbi.nlm.nih.gov/21525013/
  cache: publications/PMID_21525013.md
  cache_sha256: 3f900d286fcdc62ce0172fb5959e3090b2fadd27417a6f0e2370b9395e499d89
  cache_full_text_flag: false
  assessed_scope: Complete original scientific text and Figure 6 pixels were read in the independent source
    assessment. Human HSC3 CYLD siRNA reduces RIP1/FADD/caspase-8 complex assembly and viability loss;
    mitochondrial amplification is upstream cross-talk in a type-II response. Supplement S10 was not inspected
    and its TNF claim remains authors’ narrative. The cache itself remains abstract-only.
- pmid: '22057290'
  url: https://pubmed.ncbi.nlm.nih.gov/22057290/
  cache: publications/PMID_22057290.md
  cache_sha256: e98bac90c3a75ca914ef4be4a7c53c57dadfd420cf86289ba3b8b1c81a7ac674
  cache_full_text_flag: true
  assessed_scope: Selected original Methods/Results/Discussion show direct recombinant CYLD–ITCH binding
    and sequential TAK1 ubiquitin editing, with mouse inflammatory models. The exact ITCH-2 construct
    is not resolved by main-text descriptions; CYLD supplies chain removal and ITCH supplies ligase chemistry.
- pmid: '24981860'
  url: https://pubmed.ncbi.nlm.nih.gov/24981860/
  cache: publications/PMID_24981860.md
  cache_sha256: 65ac26bbef11a620d8acd189bff815d2dac655c8394c289e24e8f4a3b2cc76cd
  cache_full_text_flag: false
  assessed_scope: Complete abstract and exact positive human CYLD–SPATA2 tandem-affinity record were checked.
    Original target table was not recovered. The association is independently corroborated, but this screen
    does not establish chromatin catalysis by CYLD.
- pmid: '25134987'
  url: https://pubmed.ncbi.nlm.nih.gov/25134987/
  cache: publications/PMID_25134987.md
  cache_sha256: b26ddaa0c6b1ed7ed11af416b4ab89831fbb7e150b4cbfc9a793c0016c864550
  cache_full_text_flag: false
  assessed_scope: Genuine publisher original PDF text was recovered and selected full Methods/Results/Discussion
    read. Human RPE1 centrosomal recruitment, mouse ependymal basal-body/tip localization, and ciliary
    rescue are distinguished. Delta932 differs from knockout and official 953-residue isoform 2; compensation
    is a possible explanation, not demonstrated equivalence. This source did not observe midbody staining
    under its conditions; another primary source did.
- pmid: '26997266'
  url: https://pubmed.ncbi.nlm.nih.gov/26997266/
  cache: publications/PMID_26997266.md
  cache_sha256: a221a193cd6027be19f37a14e67b3fcfa5a94e5849a8793b0ffccc6e1f59fa5e
  cache_full_text_flag: true
  assessed_scope: Selected original Methods/Results/Discussion were read independently. CYLD WT/C601A
    and linkage-resolved RIPK2 ubiquitination support K63/M1 regulation. Direct cleavage is referenced
    in Figure S1B, which was not separately viewed; purified cleavage is independently corroborated. NOD2
    and TNF effects are context-specific.
- pmid: '27307491'
  url: https://pubmed.ncbi.nlm.nih.gov/27307491/
  cache: publications/PMID_27307491.md
  cache_sha256: 3606ffb647cd096b07ec274cd4ce380d7869513d2142fa7e23dfffd9f8860d4e
  cache_full_text_flag: true
  assessed_scope: Selected original Methods/Results/Discussion establish human A549 proteomic association
    and SPATA2-dependent CYLD recruitment. SPATA2 is the bridge; its L929 perturbation phenotype is not
    silently relabeled as a CYLD perturbation.
- pmid: '27458237'
  url: https://pubmed.ncbi.nlm.nih.gov/27458237/
  cache: publications/PMID_27458237.md
  cache_sha256: be01d92e974f9d6d0df24b2e89d8f1510f69ac0eff67e520b53587665b4a3202
  cache_full_text_flag: false
  assessed_scope: Complete abstract and recovered indexed original Methods/Results support SPATA2 association,
    CYLD K63/M1 chain cleavage and TNF signaling context. Human Addgene 22544 is named, but reported C598A
    numbering was not reconciled to an exact insert. Complete original/supplement access was not achieved;
    the precise CYLD necroptosis IDA remains unresolved.
- pmid: '27545878'
  url: https://pubmed.ncbi.nlm.nih.gov/27545878/
  cache: publications/PMID_27545878.md
  cache_sha256: 6eec3b8197db58a5a8256cfc24891ffff67bf09b0feb8892821854e98f00625b
  cache_full_text_flag: true
  assessed_scope: Selected complete original Methods/Results/Discussion establish SPATA2 bridging and
    direct negative tests for isolated HOIP PUB–CYLD USP association. Actual mouse L929 CYLD/SPATA2 depletion
    supports a necroptotic role. This does not contradict positive complex association with HOIP or establish
    direct binding to it.
- pmid: '27591049'
  url: https://pubmed.ncbi.nlm.nih.gov/27591049/
  cache: publications/PMID_27591049.md
  cache_sha256: c60b3f735b5b30604d8c66d8103463d0405cd348e3a6ad3b018a8ab28c97653f
  cache_full_text_flag: true
  assessed_scope: Selected complete original Methods/Results/Discussion support CYLD USP583–956/SPATA2
    PUB1–241 complex formation, interface-dependent activation and K63/M1 cleavage. Sf9 CYLD and bacterial
    partner fragments are distinguished from intact products. The B-box supports dimerization rather than
    being sufficient alone for SPATA2 binding; isolated supplements were not inspected.
- pmid: '27746020'
  url: https://pubmed.ncbi.nlm.nih.gov/27746020/
  cache: publications/PMID_27746020.md
  cache_sha256: 3d53960a36bb5f2887d94afbdfa49ec36f933a8d05e6e1f3eb2460270786de11
  cache_full_text_flag: false
  assessed_scope: Complete available abstract reports K48 branching protecting K63 linkages from CYLD
    and amplifying inflammatory signaling. Full original recovery failed. Independent WT enzyme and canonical-pathway
    studies corroborate retained positives; no K48 hydrolase activity or universal branched-chain resistance
    is inferred.
- pmid: '29291351'
  url: https://pubmed.ncbi.nlm.nih.gov/29291351/
  cache: publications/PMID_29291351.md
  cache_sha256: 04face5ee491aeef899f3d88fd9ef6d354d407a9128fdbf854e30314d80e8279
  cache_full_text_flag: false
  assessed_scope: Genuine publisher HTML and selected complete Methods/Results were read. Mouse hepatic
    and human-labelled L02 systems support CYLD–TAK1 association, K63-ubiquitin regulation and JNK/p38
    consequences. The in-vitro ubiquitination subsection concerns TRIM47 modifying CYLD, not a purified
    CYLD–TAK1 cleavage experiment.
- pmid: '32185393'
  url: https://pubmed.ncbi.nlm.nih.gov/32185393/
  cache: publications/PMID_32185393.md
  cache_sha256: c2c8b7832b016c4927d0a1a674b42a8433b57ee7b44b9e1fcbc06eda15c292e5
  cache_full_text_flag: false
  assessed_scope: Selected complete original Methods/Results/captions were read independently, including
    WT versus D681G/M719V cleavage. WT human CYLD K63 catalysis is distinct from the disease mutant’s
    enhanced rate and neuropathology; no K48 cleavage was observed in the tested assay. Human endogenous
    staining is distinct from transfected mouse neurons.
- pmid: '32424362'
  url: https://pubmed.ncbi.nlm.nih.gov/32424362/
  cache: publications/PMID_32424362.md
  cache_sha256: 85b7853b02616b33de35bc113d73b3a410b5d08dcb17e6d3d55161ce15c39052
  cache_full_text_flag: true
  assessed_scope: Genuine full cached primary text was read at selected Methods/Results/Discussion scope.
    Mouse CYLD perturbation, NLRP6 K63 deubiquitination, catalytic rescue and IL-18 genetic/antibody experiments
    support contextual inflammation and IL-18 regulation. Human colonic findings are correlative. No direct
    IL-18-receptor assay, figure pixels or separate supplement was inspected.
