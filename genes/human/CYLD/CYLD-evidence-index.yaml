gene: CYLD
target: UniProtKB:Q9NQC7
scope: Compact evidence locators and assay boundaries, not raw responses or annotation mirrors. Review
  decisions are in CYLD-ai-review.yaml. Captures are from the 2026-10-15 isolated review; historical source
  snapshots remain literal.
source_reconciliation:
  raw_goa_rows: 109
  seeded_source_objects: 107
  reason: Two pairs of raw rows differ in provenance metadata but collapse to the same seeded source identity.
    All 107 seeded objects, qualifiers, partners and multiplicity are preserved; none is relabeled NEW.
  repository_sources:
  - genes/human/CYLD/CYLD-goa.tsv
  - genes/human/CYLD/CYLD-uniprot.txt
  new_supporting_cache: PMID:32424362 was fetched genuinely for the literal mouse donor context, not added
    as a new annotation.
products:
- name: '1'
  id: Q9NQC7-1
  sequence_note: The displayed Q9NQC7-1 product is 956 residues. Independent official FASTA reconstruction
    is exact. Experimental fragments, catalytic mutants and gene-level assays are not automatically assigned
    to a particular intact product.
- name: '2'
  id: Q9NQC7-2
  sequence_note: Q9NQC7-2 is 953 residues and lacks displayed-sequence ALS305–307 (VSP_011277). Both official
    FASTAs reconstruct exactly. The shared N-terminal 1–212 region and shared USP fragment do not establish
    equal activity of both intact products; the experimental delta932 allele is a different truncation.
identity_url: https://rest.uniprot.org/uniprotkb/Q9NQC7.json
performed_roles:
  catalytic: Cysteine-dependent K63/Met1 hydrolysis by the USP domain; SPATA2 recruits/activates CYLD.
    The broad mechanism class and the two linkage classes are all supported.
  noncatalytic: N-terminal microtubule association and direct HDAC6 binding plus tubulin-deacetylation
    inhibition. Recombinant binding and immunoprecipitate inhibition are distinct assays; no histone-specific
    inhibition is inferred.
  limits: Human gene-level observations, shared-domain constructs, catalytic mutants, mouse transfers
    and the two intact products remain distinct. No equal intact-product activity or universal signaling
    direction is claimed.
