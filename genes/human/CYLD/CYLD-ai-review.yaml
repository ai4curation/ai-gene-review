core_functions:
- description: CYLD is a cysteine-type deubiquitinase that cleaves K63 and Met1 ubiquitin linkages.
    SPATA2 binds and activates its USP domain and couples it to receptor-associated complexes,
    allowing CYLD to remodel signaling ubiquitin and regulate canonical NF-kappaB and cell-death
    responses in a context-dependent manner.
  molecular_function:
    id: GO:0004843
    label: cysteine-type deubiquitinase activity
  directly_involved_in:
  - id: GO:0070536
    label: protein K63-linked deubiquitination
  - id: GO:1990108
    label: protein linear deubiquitination
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:27591049
    supporting_text: Quantitative cleavage of Lys63-/Met1-linked diUb
  - reference_id: PMID:26997266
  - reference_id: PMID:32185393
- description: CYLD directly binds HDAC6 and reduces its tubulin deacetylase activity, supporting
    acetylated microtubules. This N-terminal inhibitory function is distinct from USP catalysis and
    does not imply inhibition of histone deacetylation. Cytokinesis effects can persist with a
    DUB-inactive construct, whereas the reported G1/S delay requires both N-terminal and catalytic
    functions.
  molecular_function:
    id: GO:0004857
    label: enzyme inhibitor activity
  locations:
  - id: GO:0005881
    label: cytoplasmic microtubule
  supported_by:
  - reference_id: PMID:19893491
    supporting_text: This interaction inhibits HDAC6-mediated tubulin deacetylation
  - reference_id: PMID:20194890
- description: The N-terminal CAP-Gly region of CYLD binds polymerized microtubules. Biochemical
    cosedimentation supports this activity independently of co-immunoprecipitation with tubulin; it
    does not establish recognition of a unique tubulin isoform. Microtubule binding and HDAC6
    inhibition provide complementary mechanisms for regulating the microtubule cytoskeleton, without
    establishing equivalent activity of both intact CYLD products.
  molecular_function:
    id: GO:0008017
    label: microtubule binding
  locations:
  - id: GO:0005881
    label: cytoplasmic microtubule
  supported_by:
  - reference_id: PMID:19893491
    supporting_text: CYLD associates with MTs
