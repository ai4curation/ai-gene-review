id: Q9NQC7
gene_symbol: CYLD
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CYLD is a cytoplasmic USP-family deubiquitinase that removes K63- and Met1-linked
  ubiquitin chains from signaling proteins. Its catalytic domain, stimulated and recruited by
  SPATA2, edits receptor-associated ubiquitin scaffolds and regulates inflammatory and cell-death
  signaling. Its N-terminal CAP-Gly region also binds microtubules and interacts with HDAC6 to
  inhibit tubulin deacetylation independently of ubiquitin hydrolysis. These catalytic and
  noncatalytic activities connect CYLD with microtubule organization, cell-cycle progression and
  centrosomal functions. Loss of CYLD function predisposes to cutaneous adnexal tumors.
alternative_products:
- name: '1'
  id: Q9NQC7-1
  sequence_note: The displayed Q9NQC7-1 product is 956 residues. Independent official FASTA
    reconstruction is exact. Experimental fragments, catalytic mutants and gene-level assays are not
    automatically assigned to a particular intact product.
- name: '2'
  id: Q9NQC7-2
  sequence_note: Q9NQC7-2 is 953 residues and lacks displayed-sequence ALS305–307 (VSP_011277). Both
    official FASTAs reconstruct exactly. The shared N-terminal 1–212 region and shared USP fragment
    do not establish equal activity of both intact products; the experimental delta932 allele is a
    different truncation.
