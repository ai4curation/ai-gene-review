core_functions:
- description: 'MAP2K6 (MKK6) is a dual-specificity MAP kinase kinase of the p38 stress-activated cascade: once phosphorylated
    on Ser207/Thr211 by stress/cytokine-activated MAP3Ks (ASK1, TAK1, TAO2 and others) it docks onto p38 MAPKs and phosphorylates
    the Thr and Tyr of their Thr-Gly-Tyr activation motif, activating all four p38 isoforms but not ERK or JNK.'
  molecular_function:
    id: GO:0004708
    label: MAP kinase kinase activity
  directly_involved_in:
  - id: GO:0038066
    label: p38MAPK cascade
  locations:
  - id: GO:0005829
    label: cytosol
  - id: GO:0005654
    label: nucleoplasm
  supported_by:
  - reference_id: file:human/MAP2K6/MAP2K6-uniprot.txt
    supporting_text: Dual specificity protein kinase which acts as an essential
  - reference_id: file:human/MAP2K6/MAP2K6-uniprot.txt
    supporting_text: and a tyrosine residue in the MAP kinases p38 MAPK11, MAPK12, MAPK13
  - reference_id: file:human/MAP2K6/MAP2K6-uniprot.txt
    supporting_text: Activated by dual phosphorylation on Ser-207 and
  - reference_id: Reactome:R-HSA-1247960
    supporting_text: All are activated by phosphorylation on a canonical TxY motif by the dual-specificity kinase MKK6, which
      displays minimal substrate selectivity amongst the p38 isoforms
  - reference_id: Reactome:R-HSA-450346
    supporting_text: both phosphorylate and activate p38 MAP kinase at its activation site Thr-Gly-Tyr but do not phosphorylate
      or activate Erk1/2 or SAPK/JNK.
  - reference_id: PMID:8663074
    supporting_text: MAPKK6 was shown to phosphorylate and specifically activate the p38/MPK2 subgroup of the mitogen-activated
      protein kinase superfamily
  - reference_id: PMID:8622669
    supporting_text: Expression of activated MKK3 and MKK6 in cultured cells caused a selective increase in p38 MAP kinase
      activity.
  - reference_id: Reactome:R-HSA-450296
    supporting_text: The p38 activators MKK3 (MAP2K3) and MKK6 (MAP2K6) were present in both the nucleus and the cytoplasm,
      consistent with a role in activating p38 in the nucleus.
suggested_questions:
- question: How do MKK6 and MKK3 divide the activation of individual p38 isoforms in vivo, and does the p38beta/p38delta preference
    of MKK6 hold in primary cells?
- question: Are the non-MAPK substrates reported for MKK6 (PIP4K2B Ser326, PAK6) phosphorylated directly by MKK6 under physiological
    conditions, and does this represent a distinct function?
- question: Does the autoinhibitory MKK6 homodimer seen in crystal and solution studies exist in cells, and how is it disrupted
    by upstream MAP3Ks?
suggested_experiments:
- description: Quantitative in vitro kinase assays of active MKK6 on each recombinant p38 isoform and on PIP4K2B/PAK6, with
    phosphosite mapping, compared with MKK3.
- description: Isoform-selective MKK6 knockout or rapid degradation (degron) in human cells to separate MKK6-specific p38
    activation from MKK3 redundancy across stresses.
