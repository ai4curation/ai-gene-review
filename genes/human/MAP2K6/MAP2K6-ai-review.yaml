gene_symbol: MAP2K6
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: MAP2K6 (MKK6, MEK6, SKK3) is a dual-specificity protein kinase of the STE group that forms, with its paralog
  MKK3, the MAP kinase kinase tier of the p38 stress-activated MAPK cascade. It is activated by phosphorylation of Ser207
  and Thr211 in its activation loop by many MAP3Ks, including ASK1 (MAP3K5), TAK1 (MAP3K7), TAO2, MEKK1-4 and MLK3, as well
  as by PKR in response to double-stranded RNA; MAP3Ks are recruited through a C-terminal DVD docking site. Activated MKK6
  docks onto p38 MAPKs through its N-terminal D domain and phosphorylates both the threonine and tyrosine of their Thr-Gly-Tyr
  activation motif, activating all four p38 isoforms (p38alpha/MAPK14, p38beta/MAPK11, p38gamma/MAPK12 and p38delta/MAPK13)
  but not ERK or JNK. Unphosphorylated MKK6 can form an autoinhibited homodimer. It is a soluble protein found in cytoplasm
  and nucleus. Through p38 it relays inflammatory cytokine and environmental stress signals (osmotic shock, UV, gamma irradiation,
  ribotoxic stress) to outputs such as transcription, cell-cycle checkpoints, apoptosis and senescence. MKK6 is inactivated
  by bacterial virulence factors (anthrax lethal factor cleavage and Yersinia YopJ acetylation).
