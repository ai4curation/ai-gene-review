core_scope: Two complementary contact functions, dynein-heavy-chain binding and alpha-tubulin binding,
  describe one integrated outer-dynein-arm structural role. The assembly process remains attached to the
  heavy-chain-binding unit. No autonomous ATPase, motor, purified human ternary bridge, or measured human
  A-tubule mechanosensor is asserted.
