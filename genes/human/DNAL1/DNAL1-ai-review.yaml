id: Q4LDG9
gene_symbol: DNAL1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: DNAL1 is a leucine-rich-repeat light-chain component of axonemal outer dynein arms. Its associations
  with dynein heavy chains and alpha-tubulin support the integrity and assembly of the ciliary motor apparatus.
  Biallelic pathogenic variants can destabilize DNAL1 and impair these associations, causing primary ciliary
  dyskinesia with defective outer dynein arms.
alternative_products:
- name: '1'
  id: Q4LDG9-1
  description: The displayed 190-residue product provides the full-length sequence used in the human DNAL1
    binding studies. The N150S disease variant was tested on this coding-region construct.
- name: '2'
  id: Q4LDG9-2
  sequence_note: VSP_023982 deletes canonical residues 1–113; 77 residues.
  description: This natural N-terminally shortened product has not been functionally resolved in the inspected
    original assays; sequence retention alone establishes neither equivalent activity nor inactivity.
- name: '3'
  id: Q4LDG9-3
  sequence_note: VSP_043590 deletes canonical residues 1–39; 151 residues.
  description: This natural N-terminally shortened product is distinct from the pathogenic N150S construct.
