  full_text_unavailable: true
- id: PMID:21496787
  title: Primary ciliary dyskinesia caused by homozygous mutation in DNAL1, encoding dynein light chain
    1.
  findings:
  - statement: Human N150S DNAL1 is less stable and has impaired heavy-chain/alpha-tubulin association
      in rat axonemal extracts; affected respiratory cilia have outer-arm defects.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The intended paper and cached abstract were verified; selected original PMC Methods,
      Results and Figure 1/3/4 text were independently read. Human WT/N150S constructs were mixed with
      rat extracts; natural short products were not tested. The unchanged cache remains abstract-only
      despite external original access.
  full_text_unavailable: true
- id: PMID:29601588
  title: ZMYND10 stabilizes intermediate chain proteins in the cytoplasmic pre-assembly of dynein arms.
  findings:
  - statement: ZMYND10 associates with and stabilizes DNAI1 in the inspected experimental sections; the
      DNAL1-specific interaction attributed by the curated record remains unresolved.
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: PMID and original identity were verified. The original full-text target windows, Figure
      4 and supplementary Figure S7 captions name DNAI1 in the operative experiments. The positive DNAL1
      curator assertion is preserved, but its exact source-specific target assay could not be reconciled;
      no wrong-gene conclusion or nonbinding claim is made.
  full_text_unavailable: false
- id: PMID:32296183
  title: A reference map of the human binary protein interactome.
  findings:
  - statement: A human DNAL1–LRRC40 association is recorded in the HuRI binary interaction screen and
      its retest records.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The intended original, assay Methods and exact IntAct pair records were inspected. Sequence
      hashes match the displayed DNAL1 and LRRC40 products; the sufficient-region feature is kept separate
      from natural isoform identity. Network-level orthogonal validation is not claimed for this individual
      pair.
  full_text_unavailable: false
