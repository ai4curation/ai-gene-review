- term:
    id: GO:0036158
    label: outer dynein arm assembly
  evidence_type: IMP
  original_reference_id: PMID:21496787
  qualifier: involved_in
  review:
    summary: DNAL1 helps establish a stable outer dynein arm.
    action: ACCEPT
    reason: The homozygous human N150S allele is associated with primary ciliary dyskinesia and loss of
      outer arms in the examined respiratory cilia. The same substitution reduces DNAL1 stability and
      its association with heavy-chain-containing axonemal material. Together with DNAL1 being an arm
      component, these observations support a structural contribution to assembly or stability rather
      than only a downstream motility phenotype. The experiment does not identify the temporal order of
      assembly steps.
    supported_by:
    - reference_id: PMID:21496787
