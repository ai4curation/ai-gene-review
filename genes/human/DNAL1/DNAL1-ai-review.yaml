suggested_questions:
- question: What target-specific experiment supports the curated DNAL1–ZMYND10 interaction attributed
    to PMID:29601588, given the DNAI1 identity in the inspected operative experiments?
- question: Do human DNAL1 heavy-chain and alpha-tubulin associations reflect simultaneous direct contacts,
    and how do these contacts contribute to outer-arm assembly and stability?
- question: Where are the natural 77- and 151-residue products expressed, and do they retain the interaction
    and assembly roles of the displayed 190-residue product?
suggested_experiments:
- description: Test sequence-verified human DNAL1 and defined human heavy-chain/tubulin partners in reconstituted
    binding assays, with controls distinguishing direct binary contacts from extract-mediated association.
- description: Compare the three sequence-verified natural products in ciliated human cells for expression,
    outer-arm incorporation and rescue of DNAL1-dependent structural defects, keeping the N150S variant
    as a separate perturbation.
