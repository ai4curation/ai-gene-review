  title: Identification and analysis of axonemal dynein light chain 1 in primary ciliary dyskinesia patients.
  findings:
  - statement: Human 190-residue EGFP-DNAL1 associates with DNAH5 in pig tracheal axonemal extract; human
      testis expression and mouse ciliated-tissue expression were examined separately.
