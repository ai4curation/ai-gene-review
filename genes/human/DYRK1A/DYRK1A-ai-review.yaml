core_functions:
- description: DYRK1A catalyzes ATP-dependent protein phosphorylation. Direct human biochemical
    studies support serine/threonine substrate phosphorylation and tyrosine autophosphorylation,
    including weak tyrosine activity of the mature enzyme. Nuclear substrates include the
    RNA polymerase II CTD and histone H3; Tau and splicing factors extend its substrate repertoire.
    Phosphorylation-dependent regulation of transcription and alternative exon choice is context-dependent,
    without a universal positive effect on all transcripts. The histidine-rich region promotes
    CTD association and hyperphosphorylation; this targeting mechanism is not assigned to
    natural products lacking that region.
  molecular_function:
    id: GO:0004712
    label: protein serine/threonine/tyrosine kinase activity
