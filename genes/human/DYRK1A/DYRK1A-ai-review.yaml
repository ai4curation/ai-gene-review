  qualifier: involved_in
  review:
    summary: Retain a defined RNF169-dependent repair-regulatory branch with its opposing
      knockout phenotype.
    action: KEEP_AS_NON_CORE
    reason: 'PMID:30773093 supports a positive RNF169-dependent branch: DYRK1A phosphorylates
      RNF169 and kinase-active DYRK1A enhances RNF169-dependent exclusion of 53BP1. The production
      GO-CAM 617b481400003575 explicitly places this kinase activity upstream of RNF169-mediated
      homologous-recombination repair. This is the positive mechanistic scope retained here,
      not a claim that every DYRK1A perturbation increases repair. In the same study, DYRK1A
      knockout increased the HR reporter significantly in one clone, with a nonsignificant
      upward trend in the second; RNF169-independent effects on 53BP1 recruitment also remained.
      PMID:31024071 further separates early 53BP1 recruitment, protein abundance and inhibitor
      effects. The signed branch is therefore retained as contextual non-core regulation while
      the net knockout outcome and unresolved mechanism remain explicit.'
    supported_by:
    - reference_id: PMID:30773093
      supporting_text: Knockdown of RNF169 rescues DYRK1A-mediated inhibition of 53BP1 foci
        formation.
