id: Q13627
gene_symbol: DYRK1A
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: DYRK1A is a dual-specificity protein kinase with nuclear, cytoplasmic and cytoskeleton-associated
  pools. It phosphorylates serine/threonine-containing substrates and undergoes tyrosine autophosphorylation.
  Its substrate repertoire includes the RNA polymerase II C-terminal domain, histone H3, Tau
  and splicing factors, connecting kinase activity to transcription, chromatin regulation,
  alternative splicing and neuronal function. The histidine-rich C-terminal region contributes
  to RNA polymerase II targeting. Natural products share the kinase domain but differ in their
  terminal sequences; the shorter products lack this histidine-rich region. Human pathogenic
  variants cause an autosomal dominant neurodevelopmental disorder commonly including microcephaly
  and intellectual disability.
