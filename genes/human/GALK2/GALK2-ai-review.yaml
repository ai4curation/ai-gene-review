  review:
    summary: The cited specificity study argues that GALK2 is GalNAc kinase with weak galactose side activity.
    action: MARK_AS_OVER_ANNOTATED
    reason: PMID:8798585 is the paper that reidentified chromosome-15 GK2 as GalNAc kinase. It reports
      galactose phosphorylation by GalNAc kinase only at millimolar galactose concentrations, whereas purified
      galactokinases phosphorylated galactose but not GalNAc. The galactokinase term therefore overstates a
      weak promiscuous reaction rather than naming the evolved core activity.
