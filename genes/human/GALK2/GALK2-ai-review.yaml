  review:
    summary: ATP is the phosphoryl donor for the GALK2 GalNAc kinase reaction.
    action: ACCEPT
    reason: GALK2 belongs to the ATP-dependent GHMP sugar kinase family, and the human GalNAc kinase structure
      was solved with GalNAc plus MnAMPPNP or MgATP-derived products in the active site. ATP binding is
      therefore the expected substrate interaction for the accepted GalNAc kinase activity.
    supported_by:
    - reference_id: PMID:16006554
      supporting_text: solved in the presence of MnAMPPNP and GalNAc or MgATP and GalNAc
