  label: Homo sapiens
description: 'GALK2 encodes a cytosolic GHMP-family sugar kinase that preferentially phosphorylates N-acetyl-D-galactosamine
  to N-acetyl-D-galactosamine 1-phosphate using ATP, feeding GalNAc salvage into UDP-N-acetylgalactosamine
  biosynthesis. It is related to GALK1 but its GalNAc kinase activity is much stronger than its weak in vitro
  galactokinase side activity, separating GALK2 from the canonical Leloir-pathway galactokinase reaction.'
