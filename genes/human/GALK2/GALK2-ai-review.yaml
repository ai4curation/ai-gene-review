    summary: A GalK-family transfer to GALK2 overstates weak GalNAc kinase side activity.
    action: MARK_AS_OVER_ANNOTATED
    reason: GALK2 sits inside PTHR10457:SF7, but the human protein is the chromosome-15 GalNAc kinase rather
      than the chromosome-17 GALK1 Leloir-pathway kinase. Direct biochemical papers show preferred GalNAc
