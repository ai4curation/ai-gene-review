- id: PMID:16006554
  title: The molecular architecture of human N-acetylgalactosamine kinase.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Authentic PubMed abstract read. The paper reports the first human GalNAc kinase structure,
      solves GALK2 with GalNAc and nucleotide analogs or products, and states that the enzyme has greater
      activity against GalNAc than galactose. The abstract supports GalNAc kinase identity and active-site
      binding, not full kinetic constants.
  full_text_unavailable: true
- id: PMID:7542884
  title: Comparison of the enzymatic activities of human galactokinase GALK1 and a related human galactokinase
    protein GK2.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Authentic PubMed abstract read. COS-cell expression showed that only the chromosome-17 GALK1
      cDNA produced high galactokinase activity; the abstract leaves GK2 activity and expression level
      uncertain, so it is used as evidence against a major GALK2 galactokinase role, not as evidence of
      complete catalytic inactivity.
  full_text_unavailable: true
- id: PMID:8798585
  title: Identification of the GalNAc kinase amino acid sequence.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Authentic PubMed abstract read. Human and pig kidney GalNAc kinase specificity was compared
      with galactokinase; the chromosome-15 GK2 cDNA produced GalNAc activity and only weak galactose activity
      at millimolar sugar. This supports GALK2 as GalNAc kinase and treats galactokinase activity as a weak
      side reaction.
  full_text_unavailable: true
