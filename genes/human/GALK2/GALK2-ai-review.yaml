  original_reference_id: PMID:16006554
  qualifier: involved_in
  review:
    summary: GALK2 catalyzes the GalNAc salvage step that feeds UDP-N-acetylgalactosamine biosynthesis.
    action: NEW
    reason: Human GALK2 directly phosphorylates free GalNAc to GalNAc-1-phosphate, the upstream salvage
      intermediate that is converted to UDP-N-acetylgalactosamine. PMID:16006554 names this as a GalNAc salvage
      pathway for reutilizing free GalNAc released by complex-carbohydrate degradation, so GALK2 executes one
      enzyme step in UDP-N-acetylgalactosamine biosynthesis rather than merely supplying a substrate.
    supported_by:
