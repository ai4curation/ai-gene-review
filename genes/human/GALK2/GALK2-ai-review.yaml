suggested_questions:
- question: What native metabolic flux does human GALK2 carry in free GalNAc salvage, and is the weak
    millimolar galactose phosphorylation observed in vitro ever physiologically relevant?
suggested_experiments:
- description: Measure purified human GALK2 kinetics on GalNAc and galactose side by side with human GALK1,
    then quantify GalNAc-1-phosphate and galactose-1-phosphate production in GALK2-null and rescued human
    cells supplied with free GalNAc or galactose.
