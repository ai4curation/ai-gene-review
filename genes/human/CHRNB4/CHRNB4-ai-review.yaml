      alpha2beta4 and alpha6beta4. The 2alpha:3beta arrangement measured for particular recombinant receptors
      is not universal for accessory-subunit-containing receptors. Refine the broad location to postsynaptic
      membrane, the specific synaptic pool independently supported here. This is not an inference of a
