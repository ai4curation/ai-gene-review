id: P30926
gene_symbol: CHRNB4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Human beta4 supplies complementary ligand-binding and pore-forming contributions to several
  heteromeric neuronal receptors, including alpha3beta4, alpha2beta4 and alpha6beta4. The 2alpha:3beta
  arrangement measured for particular recombinant receptors is not universal for accessory-subunit-containing
  receptors. These pentameric membrane proteins couple extracellular acetylcholine recognition to cation
  flux and neuronal excitability. Beta4-containing receptors support autonomic ganglionic signaling and
  context-dependent neuroendocrine secretion.
