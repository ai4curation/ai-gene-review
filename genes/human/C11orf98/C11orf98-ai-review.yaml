proposed_new_terms: []
suggested_questions:
- question: >-
    Are the two assigned roles of this microprotein - as a component of nucleoplasmic
    pre-60S ribosomal particles and as a sororin cofactor in sister chromatid cohesion -
    mechanistically connected, or does one protein simply do two unrelated jobs in two
    nuclear compartments? Both come from single papers that did not test the other role.
  experts:
  - Wenya Hou
  - Huiqiang Lou
  - Ning Gao
- question: >-
    Is C11orf98 required for pre-60S maturation, or only present in the particle? The cryo-EM
    work identifies it as a component; no depletion phenotype for ribosome biogenesis has
    been published, and UniProt's wording remains "may be involved".
  experts:
  - Ning Gao
  - Yunyang Zhang
- question: >-
    Is homozygous loss of the alternative ORF viable? Only heterozygous CRISPR knockout
    clones were recovered, which hints at essentiality but is not stated as such, and a
    knockout that also disrupts the host LBHD1 reading frame would confound the
    interpretation.
  experts:
  - Wenya Hou
  - Xingzhi Xu
- question: >-
    Should the molecular function be modelled as an adaptor that brings sororin to cohesin,
    or as an activator that increases sororin's anti-WAPL activity? The reported data are
    compatible with both, and the distinction determines which GO molecular function term
    is correct.
  experts:
  - Wenya Hou
suggested_experiments:
- hypothesis: >-
    The cohesion function belongs specifically to the alternative-ORF product and not to
    LBHD1 translated from the same locus.
  description: >-
    Separate the two reading frames genetically: introduce a start-codon mutation that
    abolishes only the alternative ORF while leaving the LBHD1 coding sequence intact, and
    conversely a frameshift that removes LBHD1 but preserves the alternative ORF. Score
    sister chromatid cohesion by chromosome spreads in each background. This is the control
    that keeps annotations on E9PRG8 from leaking onto Q9BQE6.
  experiment_type: allele-specific genome editing of overlapping reading frames
- hypothesis: >-
    The nucleolar pre-60S pool and the nucleoplasmic cohesion pool are the same protein
    partitioning between compartments, and the partition is cell-cycle regulated.
  description: >-
    Follow endogenously tagged C11orf98 through the cell cycle by live imaging and by
    fractionation into nucleolar, nucleoplasmic and chromatin compartments, quantifying
    co-purification with pre-60S particles and with sororin at each stage. Test whether
    PARP1 inhibition shifts the partition.
  experiment_type: cell-cycle-resolved fractionation with quantitative proteomics
- hypothesis: >-
    The microprotein acts as an adaptor rather than as an allosteric activator of sororin.
  description: >-
    Reconstitute cohesin, sororin, WAPL, PDS5 and recombinant C11orf98 and ask whether the
    microprotein increases sororin occupancy on cohesin (adaptor) or increases the
    anti-WAPL effect per bound sororin molecule (activator), using PARylated and
    non-PARylated microprotein and the 16-lysine-and-arginine PARylation-site mutant as
    controls.
  experiment_type: in vitro reconstitution with purified components
