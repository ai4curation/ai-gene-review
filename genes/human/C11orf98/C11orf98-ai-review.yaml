core_functions:
- description: >-
    In S phase, the C11orf98/RSMC microprotein binds sororin/CDCA5 directly through two
    short sororin-interacting motifs and delivers it to cohesin on replicated chromatin.
    PARP1 poly(ADP-ribosyl)ates the microprotein during S phase, which strengthens the
    sororin interaction, so that the adaptor works in parallel with ESCO1/ESCO2-dependent
    SMC3 acetylation. The bound sororin then antagonises WAPL, locking cohesin onto
    chromatin and establishing sister chromatid cohesion. The microprotein carries no
    catalytic activity of its own; its contribution is the selective, regulated
    bringing-together of sororin and cohesin.
