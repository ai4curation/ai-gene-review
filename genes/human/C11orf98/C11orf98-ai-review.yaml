aliases:
- RSMC
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  C11orf98 encodes a 123-amino-acid nuclear microprotein, translated from an alternative
  open reading frame of the LBHD1 locus and therefore distinct from the LBHD1 protein made
  from the same genomic region. UniProt names it RSMC, for 28S rRNA/ribosome and sororin
  micro-cofactor. The protein is basic and disordered at both termini, with a short helical
  core, and two lines of work assign it two nuclear roles. In the nucleolus it is a
  component of nucleoplasmic pre-60S ribosomal particles, resolved by cryo-electron
  microscopy within the assembling large subunit and proposed to be a distal functional
  counterpart of yeast Alb1; consistent with this, its most prominent proximity partners
  are the nucleolar chaperones nucleolin and nucleophosmin. In the nucleoplasm during
  S phase it binds sororin/CDCA5 directly through two short sororin-interacting motifs, and
  this interaction is strengthened when PARP1 poly(ADP-ribosyl)ates the microprotein.
  Through that interaction it promotes recruitment of sororin to cohesin on replicated
  chromatin and stimulates the anti-WAPL activity of sororin, acting alongside
  ESCO1/ESCO2-dependent acetylation of the cohesin subunit SMC3 to establish sister
  chromatid cohesion. Depletion causes precocious sister chromatid separation and increased
  inter-sister distance, and its overexpression rescues cohesion defects caused by PARP
  inhibition. Whether the ribosome-assembly and cohesion roles are mechanistically
  connected is not known.
