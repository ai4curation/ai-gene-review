  - reference_id: PMID:2823150
    supporting_text: Thus, the CD4 protein, even in the absence of T-cell receptor-antigen interactions, can interact directly with class II antigens to function as a cell surface adhesion molecule.
  - reference_id: PMID:1901411
    supporting_text: We demonstrate that, although CD4 and CD8 alpha can specifically enhance interleukin 2 secretion, maximal potentiation occurs with expression of CD4, which, unlike CD8, can bind to the same major histocompatibility complex protein as the T-cell receptor.
  - reference_id: PMID:12517957
    supporting_text: The localization of CD4 in lipid rafts also correlates to the ability of CD4 to enhance receptor tyrosine phosphorylation.
  - reference_id: PMID:15128768
    supporting_text: Specifically, we demonstrate that CD4 palmitoylation sequences are required for TCR/PKCtheta raft association and subsequent clustering, indicating a particular role for raft-associated CD4 molecules in regulating immune synapse organization.
suggested_questions:
- question: Is interleukin-16 a genuine ligand of CD4? The founding report shows CD4-dependent calcium and IP3 signaling by CD4-affinity-purified lymphocyte chemoattractant factor (PMID:1673145), but a later study detected no interaction between mature IL-16 and the CD4 ectodomain by NMR or on CD4-expressing cells (PMID:27231345), suggesting a requirement for multimeric IL-16. GO currently carries interleukin-16 binding and interleukin-16 receptor activity on CD4; should these be qualified or removed?
- question: What supports the interleukin-15-mediated signaling pathway annotations (GO:0035723, IDA and IBA) on CD4? The cited reference (PMID:24942581) is a study of MHC class II ligation of CD4 on human monocytes and its abstract does not mention IL-15, and CD4 is not a component of the IL-15 receptor.
- question: Should CD4 be part_of the T cell receptor complex (GO:0042101)? CD4 is a separate single-chain coreceptor rather than a stoichiometric subunit, and the CD4-pMHCII-TCR geometry excludes a direct CD4-TCR contact (PMID:11535811).
- question: Is there a GO term that captures CD4's role in organising the immunological synapse, where palmitoylation-dependent raft localization of CD4 is required for TCR and PKC-theta clustering (PMID:15128768)? The existing maintenance of protein location in cell annotation describes this poorly.
- question: How should GO treat CD4's non-T-cell role? MHC class II ligation of CD4 on human monocytes drives macrophage differentiation (PMID:24942581), a function that does not exist in mouse, where monocytes lack CD4 -- relevant when propagating annotations between the two species.
suggested_experiments:
- description: 'Resolve the IL-16/CD4 question directly: measure binding of monomeric versus defined oligomeric preparations of mature IL-16 to the CD4 ectodomain and to CD4 on intact cells by orthogonal methods (SPR, mass photometry, cell-surface binding), and test whether any binding requires the D1 or the D3/D4 domains.'
- description: 'Separate coreceptor ligand binding from LCK delivery in a single system: reconstitute CD4-deficient primary human T cells with wild-type CD4, a Phe43 mutant that cannot bind class II, a tail-cysteine mutant that cannot form the zinc clasp, and a palmitoylation-site mutant, and quantify TCR sensitivity, ITAM phosphorylation kinetics and synapse clustering for each.'
- description: Test whether CD4 dimerization is required in situ rather than only for soluble class II binding, by expressing the K318/Q344 dimerization-site mutants in primary T cells and measuring 2D affinity for peptide-MHC class II, LCK recruitment and antigen sensitivity.
- description: 'Define the monocyte pathway: in human monocytes, map which kinases are recruited to the CD4 tail after MHC class II ligation (LCK is low in monocytes), using proximity labelling plus tail-mutant rescue, and ask whether the zinc clasp is needed for macrophage differentiation.'
- description: 'Characterise the immunological phenotype of human CD4 deficiency (immunodeficiency 79) in depth: compare antigen-specific responses, MHC class II restriction and TCR repertoire of the substituting double-negative T cells with conventional CD4+ T cells, to establish what CD4 contributes beyond lineage marking.'
