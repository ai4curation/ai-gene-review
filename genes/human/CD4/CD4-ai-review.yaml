    action: ACCEPT
    reason: "This is one of CD4's two core molecular functions and the mechanistic basis of its coreceptor role: it delivers LCK to the peptide-MHC-engaged TCR. It is the mirror image of the GO:0042609 CD4 receptor binding annotation on LCK."
