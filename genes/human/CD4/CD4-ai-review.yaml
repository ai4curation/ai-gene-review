core_functions:
- description: Binds the membrane-proximal alpha-2/beta-2 concavity of peptide-MHC class II through the D1 immunoglobulin-like domain, acting as the coreceptor that stabilises class II-restricted antigen recognition by the T cell receptor; D4-mediated dimerization is required for stable class II binding.
  molecular_function:
    id: GO:0023026
    label: MHC class II protein complex binding
  directly_involved_in:
  - id: GO:0050852
    label: T cell receptor signaling pathway
  - id: GO:0042110
    label: T cell activation
  locations:
  - id: GO:0009897
    label: external side of plasma membrane
  - id: GO:0044853
    label: plasma membrane raft
  supported_by:
  - reference_id: PMID:11535811
    supporting_text: The CD4 Phe-43 side chain extends into a hydrophobic concavity formed by MHC residues from both alpha 2 and beta 2 domains.
  - reference_id: PMID:21900604
    supporting_text: CD4 recognizes HLA-DR1 through its membrane-distal D1 domain, which contacts the membrane-proximal α2 and β2 domains of the MHC class II molecule
  - reference_id: PMID:27114505
    supporting_text: to measure the 2D K d for the CD4/pMHC II interaction, which proves to the best of our knowledge to be the weakest such interaction ever studied
  - reference_id: PMID:12444132
    supporting_text: More importantly, we demonstrate that dimer formation is essential for the coligand and coreceptor functions of CD4 in T cell activation.
- description: Carries the Src-family kinase LCK on its cytoplasmic tail through a zinc clasp in which two CD4 cysteines and two cysteines of the LCK unique region co-coordinate one Zn2+ ion, delivering LCK to the peptide-MHC-engaged TCR-CD3 complex so that it can phosphorylate the CD3 ITAMs.
  molecular_function:
    id: GO:1990782
    label: protein tyrosine kinase binding
  directly_involved_in:
  - id: GO:0050852
    label: T cell receptor signaling pathway
  locations:
  - id: GO:0005886
    label: plasma membrane
  - id: GO:0044853
    label: plasma membrane raft
  supported_by:
  - reference_id: PMID:14500983
    supporting_text: The T cell coreceptors CD4 and CD8 both associate via their cytoplasmic tails with the N-terminus of the Src-family tyrosine kinase Lck.
  - reference_id: PMID:14500983
    supporting_text: The coreceptor tails and the Lck N-terminus are unstructured in isolation but assemble in the presence of zinc to form compactly folded heterodimeric domains.
  - reference_id: PMID:9668045
    supporting_text: These results are consistent with the proposal that Lck and CD4 associate by thiol-mediated co-coordination of zinc.
  - reference_id: PMID:3262426
    supporting_text: Our data demonstrate that p56lck is specifically modulated with either CD4 or CD8 following antibody-mediated cross-linking of these molecules and that a large fraction of the total cellular lck protein can be coimmunoprecipitated with these surface glycoproteins.
- description: 'Coreceptor activity: acting with the antigen-engaged T cell receptor as the nearby primary receptor, CD4 raises the sensitivity of class II-restricted recognition and the resulting helper T cell response, a function that requires its cytoplasmic tail and raft localization.'
  molecular_function:
    id: GO:0015026
    label: coreceptor activity
