- term:
    id: GO:0001772
    label: immunological synapse
  evidence_type: IDA
  original_reference_id: PMID:15128768
  review:
    summary: Proposed new annotation placing CD4 at the immunological synapse, where raft-associated CD4 is required for TCR and PKC-theta clustering.
    action: NEW
    reason: CD4 is not merely required for synapse organisation; it is itself a constituent of the clustered structure, co-recruited with the TCR to peptide-MHC class II on the opposing cell and supplying LCK there. The cited work shows that CD4 palmitoylation sequences are needed for TCR/PKC-theta raft association and clustering at the synapse, and that raft targeting alone is insufficient without the signalling tail, which places CD4 in the structure rather than upstream of it. GOA currently records this only through a poorly fitting maintenance of protein location in cell row.
    supported_by:
    - reference_id: PMID:15128768
      supporting_text: We show using transgenic mouse and retroviral reconstitution studies that CD4 is required for TCR/protein kinase C (PKC) theta clustering.
    - reference_id: PMID:15128768
      supporting_text: Specifically, we demonstrate that CD4 palmitoylation sequences are required for TCR/PKCtheta raft association and subsequent clustering, indicating a particular role for raft-associated CD4 molecules in regulating immune synapse organization.
    - reference_id: PMID:12517957
      supporting_text: The localization of CD4 in lipid rafts also correlates to the ability of CD4 to enhance receptor tyrosine phosphorylation.
