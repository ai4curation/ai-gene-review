    reason: Orthology-transferred response-to-chemical annotations of this kind generally derive from rodent studies in which CD4 transcript or CD4+ cell numbers change after a treatment. A change in the abundance of CD4, or of the cells that bear it, is not CD4 performing a step of a response; nothing in the CD4 literature identifies a molecular role for the protein in handling these agents.
