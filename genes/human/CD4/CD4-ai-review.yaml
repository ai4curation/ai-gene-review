    summary: Annotation of CD4 as the interleukin-16 receptor, derived from the classic report that CD4-affinity-purified lymphocyte chemoattractant factor triggers CD4-dependent calcium and IP3 signaling.
    action: UNDECIDED
    reason: The IL-16/CD4 relationship is genuinely contested. The original work shows CD4-dependent second-messenger generation and a reported sub-nanomolar affinity, but a later structural study failed to detect any interaction between mature IL-16 and the CD4 ectodomain by NMR or by competition with an anti-CD4 antibody on CD4-expressing cells. Neither result can be dismissed from the material available here -- monomeric versus multimeric IL-16 is the suggested reconciliation -- so the annotation is left undecided rather than accepted or removed.
