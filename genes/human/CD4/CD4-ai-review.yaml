id: P01730
gene_symbol: CD4
product_type: PROTEIN
status: IN_PROGRESS
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'CD4 is a single-pass type I cell-surface glycoprotein of the immunoglobulin superfamily, expressed on helper and regulatory T cells and, in human, also on monocytes, macrophages, dendritic cells and NK cells. Its ectodomain comprises four immunoglobulin-like domains, D1 to D4. The membrane-distal D1 domain binds a non-polymorphic concavity formed by the alpha-2 and beta-2 domains of MHC class II molecules, with Phe43 of CD4 inserting into that pocket; the interaction is of remarkably low affinity, so CD4 contributes not by independent ligation but by being co-recruited to a peptide-MHC class II complex that the T cell receptor is already engaging. On the cytoplasmic face, two cysteines in the short CD4 tail together with two cysteines in the LCK unique region coordinate a single Zn2+ ion in a zinc clasp, so that CD4 carries the Src-family kinase LCK and delivers it to the TCR-CD3 complex, where LCK phosphorylates the CD3 ITAMs and initiates the ZAP70-LAT-PLCG1 cascade. Palmitoylation of the membrane-proximal cysteines plus LCK association concentrate CD4 in plasma-membrane rafts and contribute to receptor and PKC-theta clustering at the immunological synapse, and D4-mediated dimerization is required for stable class II binding. CD4 thereby sets the sensitivity and the avidity threshold of class II-restricted recognition, which shapes thymic selection into the CD4 lineage and the subsequent helper T cell response, including IL-2 production. Outside T cells, MHC class II ligation of CD4 on human blood monocytes triggers MAPK- and Src-kinase-dependent differentiation into mature macrophages, a role absent in mouse monocytes, which do not express CD4. Loss-of-function variants cause an autosomal recessive CD4 deficiency (immunodeficiency 79) with recalcitrant HPV warts, in which double-negative T cells partly substitute for the missing CD4+ compartment. CD4 is additionally the primary cellular receptor for HIV-1: the same D1 surface binds the envelope glycoprotein gp120 and triggers the conformational change that exposes the CCR5/CXCR4 site, and HIV-1 Nef and Vpu in turn down-regulate CD4 by clathrin-mediated endocytosis and ER-associated degradation.'
