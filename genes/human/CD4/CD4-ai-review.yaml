- term:
    id: GO:0008270
    label: zinc ion binding
  evidence_type: IDA
  original_reference_id: PMID:9668045
  qualifier: enables
  review:
    summary: IDA for zinc ion binding, from the demonstration that the CD4 cytoplasmic tail and the LCK N-terminal region jointly coordinate a single Zn2+ ion.
    action: ACCEPT
    reason: 'This is a genuine, structurally defined metal-binding activity of CD4: two tail cysteines together with two LCK cysteines form the zinc clasp that tethers the kinase to the coreceptor, and the complex dissociates on chelation.'
    supported_by:
    - reference_id: PMID:9668045
      supporting_text: These results are consistent with the proposal that Lck and CD4 associate by thiol-mediated co-coordination of zinc.
    - reference_id: PMID:9668045
      supporting_text: Biochemical and biophysical experiments show that the complex dissociates in the presence of EDTA and that it contains a single Zn2+ ion.
    - reference_id: PMID:14500983
      supporting_text: The coreceptor tails and the Lck N-terminus are unstructured in isolation but assemble in the presence of zinc to form compactly folded heterodimeric domains.
