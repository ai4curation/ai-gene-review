  - description: EXOSC7 is a non-catalytic RNase PH-like scaffold subunit of the Exo-9 RNA exosome
      core, contributing to substrate engagement by DIS3-, DIS3L- and EXOSC10-containing exosome
      complexes that process and degrade RNAs in the nucleoplasm, nucleolus and cytosol.
