  - term:
      id: GO:0003723
      label: RNA binding
    evidence_type: TAS
    original_reference_id: PMID:11849973
    qualifier: enables
    review:
      summary: Keep the generic RNA-binding activity as support for exosome substrate engagement.
      action: ACCEPT
      reason: The Exo-9 core is not catalytic, but it binds and presents RNA substrates to the DIS3,
        DIS3L and EXOSC10/RRP6 ribonucleases; the broad RNA-binding row captures that
        substrate-engagement role.
      supported_by:
        - &id004
          reference_id: PMID:20531386
          supporting_text: It consists of a nine-subunit catalytically inert core that serves a
            structural function and participates in substrate recognition.
