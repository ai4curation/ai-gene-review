id: Q15024
gene_symbol: EXOSC7
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: EXOSC7 encodes the human RRP42 subunit of the catalytically inert nine-subunit RNA
  exosome core. EXOSC7 pairs with EXOSC6 in the RNase PH-like ring, contributes to the scaffold that
  binds and channels RNA, and is shared by nuclear, nucleolar, and cytoplasmic exosome complexes
  that process or degrade rRNA, snRNA, unstable mRNA, and surveillance substrates.
existing_annotations:
  - term:
      id: GO:0000175
      label: 3'-5'-RNA exonuclease activity
    evidence_type: TAS
    original_reference_id: PMID:11849973
    qualifier: enables
    review:
      summary: Remove the exonuclease activity from a catalytically inert scaffold subunit.
      action: REMOVE
      reason: The row assigns catalytic 3-to-5 RNA exonuclease activity to an RNase PH-like core
        subunit, but the human nine-subunit core is catalytically inert and instead scaffolds RNAs
        for the associated ribonucleases DIS3, DIS3L and EXOSC10/RRP6.
      supported_by:
        - &id001
          reference_id: PMID:20531389
          supporting_text: The nine-subunit core of the eukaryotic exosome is catalytically inactive
            and may have an architectural function and mediate substrate binding.
