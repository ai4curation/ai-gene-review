      label: mRNA 3'-UTR AU-rich region binding
    evidence_type: IBA
    original_reference_id: GO_REF:0000033
    qualifier: enables
    supporting_entities:
      - PANTHER:PTN000120503
      - UniProtKB:Q06265
      - UniProtKB:Q96B26
    review:
      summary: Mark the root PAINT AU-rich RNA-binding transfer to EXOSC7 as over-broad.
      action: MARK_AS_OVER_ANNOTATED
      reason: The PTHR11097 IBD sits at the family root and descends to EXOSC7, EXOSC8 and EXOSC9,
        but its human experimental seeds support AU-rich RNA binding by PM-Scl75/EXOSC9 and
        OIP2/EXOSC8, not by EXOSC7/RRP42. EXOSC7 remains an RNA exosome scaffold subunit, but this
        specific AU-rich 3-UTR binding term is over-propagated to it.
      supported_by:
        - reference_id: PMID:11782436
          supporting_text: PM-Scl75 protein was found to interact specifically with AREs
        - reference_id: PMID:16912217
          supporting_text: RNase PH domains from two other exosomal components, OIP2 and RRP41, as
