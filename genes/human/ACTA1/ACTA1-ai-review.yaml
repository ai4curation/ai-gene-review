      cytoskeleton row.
- id: GO_REF:0000107
  title: Automatic transfer of experimentally verified manual GO annotation data to orthologs using 
    Ensembl Compara
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Compara transfer from mouse Acta1 (P68134), a true ortholog. Its GO:0048741 donor annotation
      is a genuine mouse IDA (PMID:2731651), so unlike the ACTR8 case there is no complex-level
      projection behind this row.
- id: PMID:10508519
  title: Mutations in the skeletal muscle alpha-actin gene in patients with actin myopathy and 
    nemaline myopathy.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The founding ACTA1 disease paper and the source of five TAS rows. Queried by PMID in QuickGO:
      it carries exactly 5 annotations, all on ACTA1, so it is gene-specific curation and not a
      projection. The TAS rows rest on the paper's introductory account of the contractile
      mechanism, which is accurate but generic; its skeletal-specific framing is what licenses the
      MODIFY of GO:0006936 to GO:0003009.
- id: PMID:11333380
  title: Nemaline myopathy caused by mutations in the muscle alpha-skeletal-actin gene.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Source of the GO:0030240 IMP. Queried by PMID in QuickGO: 1 annotation in all of GO, on
      ACTA1. Abstract-only in the cache, but the thin-filament phenotype it reports is stated
      explicitly in the abstract.
- id: PMID:12849983
