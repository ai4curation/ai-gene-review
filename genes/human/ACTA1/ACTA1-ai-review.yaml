- term:
    id: GO:0016887
    label: ATP hydrolysis activity
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: enables
  review:
    summary: >-
      Pig skeletal alpha-actin provides direct biochemical support for the orthologous ATPase activity.
    action: ACCEPT
    reason: >-
      The ISS donor P68137 is pig ACTA1. PMID:24743229 uses purified endogenous pig skeletal muscle alpha-actin
      as the canonical control and reports phosphate release during polymerization (Figure 6D). The assay
      measures phosphate release, which can lag hydrolysis, so it does not directly equate release kinetics
      with cleavage kinetics. Together with the conserved actin nucleotide site and the UniProt ATP-to-ADP
      reaction, this supports ATP hydrolysis in human ACTA1. Actin hydrolysis is distinct from myosin
      ATP hydrolysis during the contractile power-stroke cycle.
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: UniProtKB:P68137
        source_label: ACTA1 (Sus scrofa, Swiss-Prot)
        source_status: SUPPORTS_TRANSFER
        comment: Pig skeletal-actin control explicitly purified and assayed for phosphate release in
          PMID:24743229; supports conserved actin ATPase function.
    supported_by:
    - reference_id: PMID:24743229
      supporting_text: Endogenous pig skeletal muscle α-actin was purified as described
    - reference_id: PMID:24743229
      supporting_text: As expected, α-actin showed an even lower release of phosphate in the
        Ca2+-bound compared to the Mg2+-bound form.
