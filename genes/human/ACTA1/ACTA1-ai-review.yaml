id: P68133
gene_symbol: ACTA1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  Skeletal muscle alpha-actin, the actin isoform that builds the thin filament of the adult
  skeletal muscle sarcomere. Globular ATP-bound monomers polymerise head-to-tail into a
  two-stranded helical filament, hydrolysing ATP to ADP as they incorporate, and the resulting
  filament is anchored at its barbed end in the Z disc through alpha-actinin and runs alongside
  the thick filament, where cyclic attachment of myosin heads and their ATP-driven power stroke
  slide the two filament sets past one another to generate contractile force. ACTA1 is one of six
  highly similar conventional human actins and is 97.9 per cent identical to smooth muscle
  alpha-actin and 98.9 per cent identical to cardiac alpha-actin, yet its expression is sharply
  restricted: alpha-cardiac actin predominates in fetal skeletal muscle and in the heart, while
  alpha-skeletal actin becomes the exclusive sarcomeric isoform of skeletal muscle from infancy
  onward. Beyond serving as the filament protomer, the protein is the platform on which the thin
  filament's regulatory apparatus is assembled, and it is a substrate for several modifications
  that tune actomyosin behaviour, including SETD3-dependent histidine methylation at His-75,
  reversible methionine oxidation by MICAL enzymes, and lysine methylation removed by ALKBH4.
  Dominant missense mutations distributed across all six coding exons cause a spectrum of
  congenital myopathies - nemaline myopathy with rod bodies, actin myopathy with excess thin
  filaments, intranuclear rod myopathy, congenital fibre-type disproportion and a
  scapulohumeroperoneal myopathy - acting as poison proteins that misfold, aggregate and
  co-assemble into filaments rather than by simple loss of function, which is why disease severity
  tracks the ratio of mutant to wild-type protein. Monomeric actin is also a target of bacterial
  toxins: the Vibrio cholerae MARTX effectors RtxA and VgrG1 cross-link actin monomers into toxic
  oligomers, though the Lys-52 to Glu-272 residue assignment on ACTA1 is transferred by similarity
  from beta-actin rather than measured on the skeletal isoform.

references:
- id: GO_REF:0000024
  title: Manual transfer of experimentally-verified manual GO annotation data to orthologs by 
    curator judgment of sequence similarity
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      The ISS pipeline reference. Used here for two very different outcomes, which is the point:
      the GO:0016887 row transfers from pig ACTA1, a true ortholog holding its own EXP evidence,
      while the five AgBase rows transfer from chicken ACTA2, a paralog. The GO_REF itself is
      sound; the discrimination has to be made per row from the WITH/FROM field.
- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PAINT/PAN-GO. On this gene the pipeline is working: GO:0005200 is IBD-asserted at the
      conventional-actin node PTN000940351 and IRD-negated at eight divergent descendant nodes,
      and ACTA1 is on the accepting side. Verified against
      interpro/panther/PTHR11937/PTHR11937-paint.tsv.
- id: GO_REF:0000044
  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot Subcellular Location vocabulary 
    mapping, accompanied by conservative changes to GO terms applied by UniProt
  reference_review:
    relevance: LOW
    correctness: VERIFIED
