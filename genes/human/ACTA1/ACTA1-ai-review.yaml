- term:
    id: GO:0070062
    label: extracellular exosome
  evidence_type: HDA
  original_reference_id: PMID:23533145
  qualifier: located_in
  review:
    summary: >-
      Skeletal muscle alpha-actin reported in exosomes from prostatic secretions in urine. The
      isoform attribution is untested rather than refuted, and 85.7 per cent of ACTA1's detectable
      tryptic peptides are shared with other actins.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Deliberately not a REMOVE, because the measurement behind this review does not support one.
      An in-silico trypsin digest of all six conventional human actins shows that 9 of ACTA1's 63
      peptides in the 7 to 30 residue window occur in no other human actin, and those 9 collapse to
      only 3 independent regions once nested missed-cleavage variants are merged. So
      ACTA1-specific attribution is achievable, and a study reporting a peptide from one of those
      regions would settle the matter. What the numbers do show is that it cannot be assumed: 54 of
      63 peptides are shared, and 29 of those are shared with ACTB and ACTG1, which are expressed
      in the prostatic epithelium this study sampled whereas ACTA1 is skeletal-tissue-enriched. A
      sarcomeric structural protein in a urinary exosome is more readily explained by shared-peptide
      assignment than by biology, so the row is marked as an over-annotation while the decisive
      experiment is recorded in suggested_experiments.
    supported_by:
    - reference_id: file:human/ACTA1/ACTA1-bioinformatics/RESULTS.md
      supporting_text: '| distinguishing (present in no other human actin) | **9 (14.3%)** |'

