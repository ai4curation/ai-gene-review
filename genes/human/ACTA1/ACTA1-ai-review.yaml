# ---------------------------------------------------------------------------
# Proposed new annotation
# ---------------------------------------------------------------------------

- term:
    id: GO:0051371
    label: muscle alpha-actinin binding
  evidence_type: IDA
  original_reference_id: PMID:16945537
  qualifier: enables
  review:
    summary: >-
      Missing from GOA despite being one of ACTA1's best-evidenced molecular functions: UniProt
      maps it to two discrete segments and the affinity has been measured on actin isolated from
      human muscle.
    action: NEW
    reason: >-
      Alpha-actinin anchors the thin filament in the Z disc, so binding it is central to what
      skeletal muscle alpha-actin does, yet no alpha-actinin term appears anywhere in ACTA1's GOA.
      The evidence is specific in both directions. Structurally, UniProt localises the interaction
      to two separate regions of ACTA1, residues 112 to 125 and residues 360 to 372, and states the
      interaction in its SUBUNIT block. Quantitatively, actin was isolated from the muscle biopsy
      of a patient carrying K336E and examined by in vitro motility assay, and its affinity for the
      Z-line protein alpha-actinin was reduced ten-fold relative to normal - a measurement that
      presupposes a wild-type ACTA1-alpha-actinin affinity to be reduced from, and that was made on
      protein from human skeletal muscle rather than on a recombinant surrogate. GO:0051371 is the
      right term rather than the generic parent because it is defined as binding to muscle isoforms
      of actinin, which are found in skeletal and cardiac muscle and localised to the Z disc,
      matching both the tissue and the structure. On the evidence code: IPI would be the natural
      choice for a binding term and was considered, but IPI requires the interacting partner to be
      identified, and this paper names only "the Z-line protein alpha-actinin" without specifying
      which of ACTN2 or ACTN3 was used, so there is no partner accession to put in a with/from
      field and asserting one would be a guess. IDA is therefore used, on the direct affinity
      measurement itself, and no supporting_entities are given for that reason; a curator who
      obtains the isoform from the full text should convert this row to IPI with the corresponding
      ACTN accession. A curator preferring to rest the annotation on UniProt's region assignments
      instead would use ISS against UniProtKB:P68135.
