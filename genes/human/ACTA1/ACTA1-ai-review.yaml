    label: extracellular exosome
  evidence_type: HDA
  original_reference_id: PMID:23533145
  qualifier: located_in
  review:
    summary: >-
      The reported ACTA1 localization in exosomes from expressed prostatic secretions in urine remains
      unresolved at the protein-identification level.
    action: KEEP_AS_NON_CORE
    reason: >-
      PMID:23533145 is the cited proteomics study of exosomes from expressed prostatic secretions in
      urine. The main article is available, but the ACTA1-specific supplementary protein/peptide entry
      needed to resolve the assignment could not be recovered. The saved mature-chain digest finds 54
      of 63 theoretical peptides shared with other human actins, including 29 shared with ACTB/ACTG1,
      and three independent ACTA1-distinguishing regions. It does not show which peptides this
      experiment detected. Skeletal-muscle enrichment and lack of a secretion signal do not disprove
      extracellular recovery. Keep the curator assertion unresolved pending its actual protein/peptide
      evidence, without converting hypothetical contamination or paralog ambiguity into a negative
      finding. OMICS_EVIDENCE disposition (2026-10-06): a vesicle-type location (exosome,
      extracellular vesicle, microparticle) from a bulk vesicle or body-fluid proteome records
      detection in secreted cargo, not where the protein acts, so it is kept as non-core by default
      (previous action: UNDECIDED). See projects/OMICS_EVIDENCE.md.
    supported_by:
    - reference_id: file:human/ACTA1/ACTA1-bioinformatics/RESULTS.md
      supporting_text: '| shared with ≥1 other human actin | 54 |'
    - reference_id: file:human/ACTA1/ACTA1-bioinformatics/RESULTS.md
      supporting_text: '| of those, shared with ACTB and/or ACTG1 | **29** |'
    - reference_id: file:human/ACTA1/ACTA1-bioinformatics/RESULTS.md
      supporting_text: '**It does not refute the five HDA rows**'
