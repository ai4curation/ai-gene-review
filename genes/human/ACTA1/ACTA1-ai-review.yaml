- term:
    id: GO:0015629
    label: actin cytoskeleton
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  review:
    summary: >-
      Correct and well founded. ACTA1 is itself one of the 24 protein donors on this row, and all
      24 carry their own experimental evidence for the term.
    action: ACCEPT
    reason: >-
      The heaviest-donor row in the record, from PANTHER node PTN002631484. All 24 protein tokens
      in the WITH/FROM field resolve, none is unresolved or unverified after checking each against
      the resolved entry's own cross-references, and every one carries its own experimental
      annotation to GO:0015629 or a descendant. Twenty-two of the 24 are Swiss-Prot; the two
      unreviewed entries (C. albicans ACT1 and C. elegans act-5) carry their own IDA but their
      protein names are automatic, so they count towards the evidence total and not towards
      independent characterisation. ACTA1 itself (UniProtKB:P68133) is among the donors, which
      makes this row partly a record of ACTA1's own IMP rather than a pure transfer. The term is a
      general parent of the specific locations ACTA1 also holds, but that generality is correct
      here rather than lazy: the donor set spans conventional actins from fungi, amoebae,
      nematodes, insects, apicomplexans and vertebrates, and actin cytoskeleton is what they agree
