id: P68133
gene_symbol: ACTA1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  ACTA1 encodes skeletal muscle alpha-actin, the predominant sarcomeric actin isoform in mature skeletal
  muscle. Globular actin binds adenine nucleotides and polymerizes into polarized thin filaments whose
  interaction with myosin transmits contractile force. Actin also binds muscle alpha-actinin, helping
  organize the thin filament at the Z-disc. ATP hydrolysis and subsequent phosphate release accompany
  filament assembly and influence filament dynamics. ACTA1 expression changes during muscle development
  alongside cardiac alpha-actin. Pathogenic variants can disturb folding, polymerization and interactions
  within the contractile apparatus, causing congenital myopathies including nemaline myopathy; both dominant
  and recessive inheritance occur.

