core_functions:

- description: >-
    The protomer of the skeletal muscle thin filament. ATP-bound globular monomers polymerise
    head-to-tail into a two-stranded helical filament in which each subunit contacts four others,
    hydrolysing ATP to ADP as they incorporate, and the resulting filament confers the structural
    integrity of the sarcomere's thin filament - the role GO:0005200 names. This is the function
    that PAINT asserts for conventional actins at PTHR11937's node PTN000940351 and explicitly
    negates at eight divergent descendant nodes, and ACTA1 is the recipient it was asserted for.
  molecular_function:
    id: GO:0005200
    label: structural constituent of cytoskeleton
  directly_involved_in:
  - id: GO:0030240
    label: skeletal muscle thin filament assembly
  locations:
  - id: GO:0005865
    label: striated muscle thin filament
  - id: GO:0030017
    label: sarcomere
  - id: GO:0005884
    label: actin filament
  - id: GO:0015629
    label: actin cytoskeleton
  supported_by:
  - reference_id: PMID:10508519
    supporting_text: Muscle contraction results from the force generated between the thin filament
  - reference_id: PMID:15198992
    supporting_text: present within insoluble actin filaments isolated from muscle from two ACTA1 NM
  - reference_id: PMID:11333380
    supporting_text: disruption, and "whorling" of actin thin filaments. The percentage of fibers
  - reference_id: file:human/ACTA1/ACTA1-uniprot.txt
    supporting_text: 'CC   -!- SUBUNIT: Polymerization of globular actin (G-actin) leads to a'

- description: >-
    A nucleotide-binding ATPase. ACTA1 binds ATP in its interlobe cleft and hydrolyses it to ADP,
    which is why both nucleotide states are annotated: ATP marks the assembly-competent monomer and
    ADP the aged protomer, and the hydrolysis step is what makes the filament a polar, treadmilling
    structure rather than a passive rod. The hydrolysis annotation transfers by similarity from pig
    ACTA1, whose own annotation carries experimental evidence, and UniProt assigns the EC number on
    the same basis.
  molecular_function:
    id: GO:0016887
    label: ATP hydrolysis activity
  locations:
  - id: GO:0005884
    label: actin filament
  supported_by:
  - reference_id: file:human/ACTA1/ACTA1-uniprot.txt
    supporting_text: 'DE            EC=3.6.4.- {ECO:0000250|UniProtKB:P68137};'
  - reference_id: PMID:24743229
    supporting_text: Structural differences explain diverse functions of Plasmodium actins.
  knowledge_gaps:
  - gap_statement: >-
      The ATP hydrolysis activity of human ACTA1 has not itself been measured; the annotation rests
      on transfer from pig skeletal muscle alpha-actin, and UniProt's own catalytic-activity
      statement carries an ECO:0000250 by-similarity tag rather than an experimental one.
    boundary: >-
      Established: pig ACTA1 carries GO:0016887 with evidence code EXP from PMID:24743229; the
      mammalian skeletal muscle alpha-actins are near-invariant in sequence; and recombinant human
      skeletal alpha-actin polymerises and depolymerises like native actin. Not established: a
      kinetic measurement of ATP turnover on the human protein.

- description: >-
    The force-transmitting partner of myosin. Cyclic attachment of myosin heads to the thin
    filament and their ATP-driven power stroke slide the thick and thin filaments past one another,
    and ACTA1 is the actin on which this occurs in skeletal muscle - the isoform's exclusivity in
    that tissue from infancy onward is why the contraction process is annotated as skeletal rather
    than as muscle contraction generally. Disease mutations act here directly: they reduce actin
    sliding speed in motility assays and modify the actin-actin interface so that strong-binding
    myosin cross-bridges cannot form.
  molecular_function:
    id: GO:0017022
    label: myosin binding
  directly_involved_in:
  - id: GO:0003009
    label: skeletal muscle contraction
  locations:
  - id: GO:0005865
    label: striated muscle thin filament
  supported_by:
  - reference_id: PMID:10508519
    supporting_text: Muscle contraction results from the force generated between the thin filament
  - reference_id: PMID:16288873
    supporting_text: gestation and is the exclusive isoform expressed in muscle from infancy through
  - reference_id: PMID:16945537
    supporting_text: isolated from the muscle biopsy and examined by in vitro motility assay. The

- description: >-
    The Z-disc anchor of the thin filament. ACTA1 binds muscle alpha-actinin through two discrete
    segments, residues 112 to 125 and 360 to 372, and it is this interaction that fixes the
    filament's barbed end in the Z disc so that force generated along the filament is transmitted
    to the sarcomere boundary. The affinity has been measured on actin from human muscle, where a
    disease mutation reduced it ten-fold. This function is absent from ACTA1's GOA and is proposed
    as a NEW annotation.
  molecular_function:
    id: GO:0051371
    label: muscle alpha-actinin binding
  locations:
  - id: GO:0005865
    label: striated muscle thin filament
  supported_by:
  - reference_id: PMID:16945537
    supporting_text: 'Z-line protein alpha-actinin was reduced 10 fold. This is the first report on a'
  - reference_id: file:human/ACTA1/ACTA1-uniprot.txt
    supporting_text: 'FT   REGION          112..125'
  - reference_id: file:human/ACTA1/ACTA1-uniprot.txt
    supporting_text: 'FT   REGION          360..372'
  knowledge_gaps:
  - gap_statement: >-
      The alpha-actinin binding measurement was made on actin isolated from a patient biopsy
      containing roughly 28 per cent mutant protein, so the ten-fold reduction is a property of a
      mixture rather than of pure mutant actin, and no absolute affinity for wild-type human ACTA1
      has been reported.
    boundary: >-
      Established: the interaction exists, is mapped by UniProt to two discrete ACTA1 segments, and
      is reduced ten-fold by K336E in actin from patient muscle. Not established: the wild-type
      dissociation constant, and whether the two mapped segments contribute independently.

suggested_questions:

- question: >-
    Should AgBase's five-term ISS block from chicken smooth muscle alpha-actin (UniProtKB:P08023,
    PMID:10633868) be retracted from the sarcomeric actins? It is currently on human ACTA1 and
    ACTC1 and on mouse Acta1, as well as on ACTA2 where it belongs and ACTG2 where it is arguable,
    while the cytoplasmic actins ACTB and ACTG1 did not receive it - so the transfer was keyed on
    alpha-actin-ness rather than on actin-ness. Chicken has its own ACTA1 (P68139), which would
    have been the correct ortholog had a skeletal-actin transfer been intended. Stating this once
    with all affected genes named: retracting the block from ACTA1, ACTC1 and mouse Acta1 would
    remove fifteen annotations that rest on a single chick cardiogenesis experiment.
  experts:
  - AgBase
  - UniProt
- question: >-
    Should PAN-GO drop GO:0001725 stress fiber from ACTA1's core set? It is IBD at PTHR11937 node
    PTN000233075 seeded from ACTA1 itself, and the only ACTA1 stress fiber datum is an
    EGFP-tagged-actin transfection into C2C12 myoblasts (PMID:15198992) whose abstract does not
    mention stress fibers. The propagation has already carried it into mouse Acta1 by four separate
    routes - ISS, IEA, ISO and IBA - all with WITH/FROM P68133, so one ectopic-expression readout
    now supports five annotations across two species. The three sarcomeric terms on the same node
    are correct and should stay.
  experts:
  - GO Central
  - PAN-GO
- question: >-
    Should Reactome's generic F-actin (all) polymer be resolved by isoform where the pathway is
    tissue-specific? The entity's reference entities are all six conventional human actins, so
    every reaction that touches it places skeletal muscle alpha-actin in that pathway. The
    consequence here is that ACTA1 is a participant in Regulation of CDH1 Function and Activation
    of STAT3 by cadherin engagement, epithelial adherens-junction pathways in a tissue that
    expresses no E-cadherin junctions, and UniProt propagates the pathway cross-reference. The GO
    term it yields is only cytosol, which is bland enough that the substitution is invisible from
    the GO record - so this is worth raising even though no wrong GO term results.
  experts:
  - Reactome
- question: >-
    Should high-throughput MS localisations of actin be required to cite an isoform-distinguishing
    peptide? Only 3 independent regions of ACTA1 distinguish it from the other five conventional
    human actins, covering 9 of its 63 tryptic peptides in the 7 to 30 residue window, while 29 of
    the 54 shared peptides are shared with the ubiquitous ACTB and ACTG1. Five ACTA1 rows place a
    skeletal-muscle-restricted protein in prostatic-secretion, parotid and trabecular-meshwork
    exosomes, plasma microparticles and tears. The general policy question is whether HDA rows on
    members of near-identical paralogue families should record which peptides discriminated them.
  experts:
  - UniProt
  - GO Central
- question: >-
    Why does ACTA1's protein-binding record consist entirely of screen output while its two
    hypothesis-driven interactions are absent? All eleven GO:0005515 rows come from
    high-throughput or incidental sources - seven from a single two-hybrid bait panel, two from
    one affinity-purification pipeline, one from a host-pathogen force-spectroscopy study and
    one from a purification step - while the two interactions UniProt records with experimental
    ECO:0000269 tags have no GO row at all: TTID/myotilin (PMID:10958653) and USP25
    (PMID:16501887), the latter mapped to the actin C-terminus with an isoform preference for
    USP25m in differentiating muscle. Queried by PMID, PMID:10958653 carries seven annotations
    in GO and all are on MYOT rather than on actin, and PMID:16501887 carries none anywhere.
    Adding those two would improve the record more than removing any of the nine weak rows.
  experts:
  - UniProt
  - GO Central
  - IntAct
- question: >-
    Is the ACTA1-syncoilin interaction real? Of the seven partners from the PMID:32814053
    two-hybrid screen, SYNC is the only one in the right cell and compartment - a muscle
    intermediate-filament-associated protein of the sarcolemma and Z line. The screen evidence is
    weak for all seven equally (one experiment logged under three sub-method labels, MI-score
    0.56), so the annotation cannot stand on it, but this particular pair deserves an orthogonal
    assay rather than dismissal.
  experts:
  - IntAct
  - muscle cell biology
- question: >-
    Should UniProt's ACTA1 entry state the alpha-actinin interaction with an experimental tag? The
    two interaction regions are currently annotated ECO:0000250 by similarity to rabbit ACTA1
    (P68135), yet the affinity has been measured on actin isolated from human patient muscle
    (PMID:16945537). Upgrading the evidence would also make the missing GO:0051371 annotation
    proposed in this review straightforward to justify.
  experts:
  - UniProt

suggested_experiments:

- hypothesis: >-
    Skeletal muscle alpha-actin does not localise to stress fibers at native expression levels; the
    reported localisation is a property of the transfected C2C12 myoblast host, which assembles
    stress fibers from its own cytoplasmic actin and incorporates any actin supplied to it.
  description: >-
    Image endogenous ACTA1 with an isoform-specific antibody, or a knock-in fluorescent tag at the
    ACTA1 locus, in undifferentiated C2C12 or primary human myoblasts and in the same cells after
    differentiation, alongside a phalloidin counterstain to mark stress fibers and a sarcomeric
    marker such as alpha-actinin. The comparison that matters is endogenous against transfected in
    the same cell type: if stress fiber incorporation requires over-expression, the GO:0001725 rows
    on ACTA1 and their four propagated descendants on mouse Acta1 should go, and if it does not, the
    PAN-GO core call is vindicated on evidence rather than on a single transfection.
  experiment_type: isoform-specific immunofluorescence with endogenous versus ectopic comparison
- hypothesis: >-
    The five extracellular high-throughput localisations of ACTA1 are isoform misassignments of
    peptides shared with the cytoplasmic actins ACTB and ACTG1, which are expressed in every tissue
    those studies sampled.
  description: >-
    Re-analyse the deposited spectra, or run targeted parallel-reaction monitoring on the same
    sample types, restricted to the three regions this review identifies as ACTA1-distinguishing -
    residues 3 to 30, 287 to 317 and 338 to 361 - with heavy-labelled synthetic standards for the
    corresponding peptides. The N-terminal coordinates matter and are easy to get wrong: ACTA1's
    initiator methionine is removed and the acetylated Cys-2 of the intermediate form is cleaved by
    ACTMAP, so the mature chain is residues 3 to 377 and the observable N-terminal tryptic peptide
    is DEDETTALVCDNGSGLVK, not the ORF peptide beginning at Met-1, which does not exist in vivo and
    for which a synthetic standard would be wasted. The analysis was recomputed on the mature chain
    for this reason; the distinguishing counts are unchanged, so only the peptide identity moves.
    This is decisive in both directions and it is cheap, because the discriminating peptide set is
    small and already enumerated. Detecting the distinguishing peptides would confirm the rows;
    failing to detect them while detecting shared actin peptides would establish that the
    assignment came from the shared fraction.
  experiment_type: targeted proteomics with isoform-distinguishing peptides
- hypothesis: >-
    Syncoilin binds skeletal muscle alpha-actin directly, making it the one genuine partner among
    the seven reported from the PMID:32814053 two-hybrid screen.
  description: >-
    Test the pair by a method orthogonal to two-hybrid: co-sedimentation or microscale
    thermophoresis with purified recombinant syncoilin and human skeletal alpha-actin for direct
    binding and affinity, and proximity ligation or co-immunoprecipitation from differentiated
    human myotubes for the interaction at native levels in the right cell type. A positive result
    would justify replacing a bare protein binding row with an informative molecular function term;
    a negative one would confirm that all seven rows from that screen reflect its bait panel rather
    than ACTA1's interactome.
  experiment_type: orthogonal in vitro binding assay plus endogenous co-immunoprecipitation
- hypothesis: >-
    Human ACTA1 hydrolyses ATP with kinetics indistinguishable from pig skeletal muscle
    alpha-actin, so the ISS transfer that currently carries GO:0016887 is quantitatively as well as
    qualitatively correct.
  description: >-
    Measure polymerisation-coupled phosphate release on recombinant human skeletal alpha-actin,
    which the baculovirus system already produces in quantity and in a form that cycles between
    polymerised and depolymerised states, against pig and rabbit skeletal actin as controls. This
    would convert the gene's one remaining by-similarity molecular function into an experimental
    one, and would give the divergent actin-family members whose ATPase annotations were proposed
    or withheld on reconstructed evidence a measured human reference point rather than an inferred
    one.
  experiment_type: coupled phosphate-release ATPase assay on recombinant protein
