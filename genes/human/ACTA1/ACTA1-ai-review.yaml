suggested_experiments:

- hypothesis: ACTA1 localization in developing myoblasts varies with differentiation and expression
    level.
  description: Compare endogenous ACTA1 localization with tagged ACTA1 in primary human myoblasts
    before and after differentiation, using validated isoform-specific detection and
    stress-fiber/sarcomere markers. This tests the physiological extent of the supported culture
    observation without assuming transfection made it false.
  experiment_type: isoform-specific imaging
- hypothesis: ACTA1 can be distinguished from other actins in extracellular proteomics when
    isoform-specific peptide evidence is available.
  description: Reinspect deposited spectra and protein inference for the cited extracellular
    studies, then use targeted proteomics with processed N-terminal and other ACTA1-distinguishing
    peptides. Shared peptides alone leave isoform attribution unresolved; failure to detect a
    distinguishing peptide does not by itself prove that the protein was absent.
  experiment_type: targeted proteomics and source-data reanalysis
