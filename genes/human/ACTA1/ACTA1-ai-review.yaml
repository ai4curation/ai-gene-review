- id: PMID:10633868
  title: Antisense oligodeoxynucleotide complementary to smooth muscle alpha-actin inhibits 
    endothelial-mesenchymal transformation during chick cardiogenesis.
  reference_review:
    relevance: NONE
    correctness: VERIFIED
    review_notes: >-
      Not cited in ACTA1's GOA rows but it is the sole experimental basis for five of them: the
      AgBase ISS block transfers this paper's chicken smooth-muscle alpha-actin findings onto human
      ACTA1 via UniProtKB:P08023. Correctly cited as a paper; entirely irrelevant to ACTA1, whose
      correct ortholog in the same species (P68139, chicken ACTA1) was not used. Recorded here so
      the provenance of those five rows is visible.
- id: PMID:16288873
  title: Defining alpha-skeletal and alpha-cardiac actin expression in human heart and skeletal 
    muscle explains the absence of cardiac involvement in ACTA1 nemaline myopathy.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Establishes by direct protein quantification that alpha-skeletal actin is the exclusive
      sarcomeric isoform of skeletal muscle from infancy, while alpha-cardiac actin predominates in
      heart and fetal skeletal muscle. This is the load-bearing fact behind both the MODIFY to
      GO:0003009 and the argument that smooth-muscle and mesenchymal annotations cannot belong to
      this isoform. Title copied from the cached record after an earlier draft of this review got
      it wrong from memory.
- id: PMID:16945537
  title: Fatal hypertrophic cardiomyopathy and nemaline myopathy associated with ACTA1 K336E 
    mutation.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Grounds the proposed GO:0051371 muscle alpha-actinin binding annotation. Actin was isolated
      from the patient's own muscle biopsy and assayed by in vitro motility, and the K336E
      mutation reduced affinity for alpha-actinin ten-fold - a measurement that presupposes
      wild-type ACTA1 binds alpha-actinin. Verified verbatim against the cached abstract rather
      than taken from the affinage narrative.
- id: PMID:10958653
  title: Myotilin is mutated in limb girdle muscular dystrophy 1A.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Not cited by any GOA row, and that is the point. UniProt records an ACTA1-TTID
      (myotilin) interaction from this paper with an experimental ECO:0000269 tag, but no
      GO:0005515 row on ACTA1 corresponds to it. Queried by PMID, the paper carries 7
      annotations in all of GO and every one is on MYOT or mouse Myot - including MYOT's own
      GO:0051393 alpha-actinin binding IDA - so the curation was done from the myotilin side
      and never reciprocated onto actin.
- id: PMID:16501887
  title: The ubiquitin-specific protease USP25 interacts with three sarcomeric proteins.
  reference_review:
    relevance: MEDIUM
