  - proteomics curators
- question: Can Reactome distinguish actin isoforms in adhesion-related F-actin (all) participants
    when isoform-specific evidence exists? A compatible cytosol annotation should not be read as
    evidence that ACTA1 executes every reaction using the generic set.
