- id: file:human/ACTA1/ACTA1-deep-research-affinage.md
  title: Affinage mechanistic annotation for ACTA1 (human)
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      The provider record (gates_passed true, 11 citations, all numeric PMIDs - no bioRxiv ids in
      PMID-shaped fields). Cited once, for a summary clause every element of which was independently
      checked against a primary source before use: the sarcomeric thin-filament identity against
      PMID:1423520 and PMID:15198992, polymerisation against PMID:12849983, the myosin interaction
      against PMID:10508519 and PMID:16945537, and the alpha-actinin interaction against
      PMID:16945537 and UniProt's two REGION features. It is used as corroboration of a function
      this review proposes on other grounds, never as the evidence for one, and none of its
      mechanistic sentences is quoted. Its own GO grounding was deliberately not imported - it
      offers GO:0005198 structural molecule activity where the conventional-actin node supports the
      specific child GO:0005200, and GO:0005634 nucleus, which is a mutant-aggregation phenotype
      rather than a location of the wild-type protein. Its 11 citations were checked for retraction
      and erratum along with the rest; none is flagged.
