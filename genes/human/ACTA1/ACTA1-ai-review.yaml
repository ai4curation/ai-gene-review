- term:
    id: GO:0043531
    label: ADP binding
  evidence_type: TAS
  original_reference_id: PMID:10508519
  qualifier: enables
  review:
    summary: >-
      The post-hydrolysis nucleotide state of the filament protomer. Correct and core, and the
      reason ACTA1 is the reference point the sibling reviews measured themselves against.
    action: ACCEPT
    reason: >-
      ADP binding is not an incidental second nucleotide term; it names a distinct, functionally
      necessary state of the protein. ATP-bound G-actin is the assembly-competent species that adds
      to a growing filament; hydrolysis to ADP and phosphate follows incorporation, and the
      ADP-bound protomer is the aged, depolymerisation-prone form that gives the filament its
      polarity and its treadmilling behaviour, and that is the substrate cofilin and the other
      severing and recycling factors recognise. So ACTA1 genuinely binds both ligands at different
      points in one cycle, and dropping either would misdescribe the mechanism rather than remove a
      redundancy - which is also why GO:0016887 ATP hydrolysis activity sits alongside them both.
      A note on provenance, because this row nearly acquired a wrong number. An earlier draft placed
      ACTA1 among a supposed pair of family members holding both terms, relaying a list from the
      merged ACTR10 review as if it were a count of my own. Measured across all 533 reviewed
      (Swiss-Prot) PTHR11937 members (nucleotide_terms_in_family.py, batched, with the truncation
      guard comparing reported hits against rows actually returned), the figures are that 31
      reviewed members carry GO:0005524 ATP binding and exactly 1 carries GO:0043531 ADP binding -
      ACTA1 - so ACTA1 is the sole holder of both among reviewed entries, not one of two. The
      scope qualifier is load-bearing rather than a hedge: the member list comes from InterPro's
      reviewed-only protein endpoint, so 533 is about 0.6 per cent of the 88,887 proteins
      PTHR11937's own metadata reports, and this measurement says nothing about the unreviewed
      remainder. That the result probably does extend family-wide is an argument rather than a
      measurement, and is offered as one: ACTA1's GO:0043531 is a manual TAS annotation,
      unreviewed TrEMBL entries receive only IEA, and no IEA pipeline maps the actin fold to ADP
      binding, so an unreviewed member holding the term is unlikely - but unlikely is not
      measured. Either way the sibling's list had been about ATP binding alone, and the corrected
      fact is the stronger one; it is why the merged ACTR1A, ACTR1B and ACTR10 reviews treated
      ACTA1 as the precedent for annotating the ligand actually observed rather than the one
      assumed.

