- term:
    id: GO:0005200
    label: structural constituent of cytoskeleton
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: >-
      The row that inverts this campaign's usual finding. PAINT asserts GO:0005200 once in
      PTHR11937, at the conventional-actin node, and negates it at eight divergent descendant
      nodes. ACTA1 is the intended recipient.
    action: ACCEPT
    reason: >-
      Ten of the eleven WITH/FROM tokens are proteins and all ten carry their own experimental
      evidence for GO:0005200: human ACTB (EXP, IDA, IMP and TAS), rat and mouse Actg1,
      S. cerevisiae ACT1, ARP1 and ARP10, human ARP2 and ARP3, and two Dictyostelium actins. All
      ten are Swiss-Prot. The eleventh token is PANTHER:PTN000940351, which is the whole point:
      the PAINT file for PTHR11937 shows GO:0005200 IBD-asserted at that single node and
      IRD-negated with negated set to true at eight descendant nodes, in two dated batches - five
      on 2025-08-05 (PTN000233752, PTN000233887, PTN000234048, PTN001732543, PTN008986528) and
      three on 2026-04-16 (PTN000233596, PTN000233796, PTN007551901) - and the merged reviews of
      ACTL7A, ACTL7B and ACTRT3 each had to act on the negated side of that split. ACTA1 is on the
      accepting side, and that was confirmed positively rather than assumed from the absence of a
      negation: a QuickGO query for GO:0005200 restricted to human and to evidence code
      ECO:0000318 returns ACTA1 among the recipients, alongside the other conventional actins
      (ACTA2, ACTC1, ACTG2, ACTB, ACTG1, ACTBL2, the POTE paralogues), ACTR10, and the divergent
      genes the sweep has not yet adjudicated. So this is one of the places the negation sweep
      deliberately left the term standing, and the divergent-gene reasoning must not be imported. The
      AADACL4 heterogeneous-donor caveat was checked and does not apply:
      the donors agree with each other and with the target, so this is not a broad term papering
      over a mixed clade, and there is no more specific term to move to. Being a filament protomer
      that confers the filament's structural integrity is precisely what GO:0005200 is defined for
      - the action of a molecule that contributes to the structural integrity of a cytoskeletal
      structure.
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: MGI:MGI:87906
