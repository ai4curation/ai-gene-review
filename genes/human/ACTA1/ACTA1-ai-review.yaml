      purification, that is binding, and not inhibition of catalysis; and annotating an in vitro
      activity that has no physiological counterpart would be the in-vitro-not-in-vivo error rather
      than an improvement. For context, GO:0060703 currently has 279 annotations, almost all phage
      and bacterial Gam-like inhibitors by IEA, and no actin carries it.
