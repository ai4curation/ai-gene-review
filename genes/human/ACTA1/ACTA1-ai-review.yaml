      gene expression in ACTA1 remains unresolved.
    action: UNDECIDED
    reason: >-
      The source P08023 is chicken ACTA2. PMID:10633868 explicitly studies smooth-muscle alpha-actin in
      chick endocardial mesenchyme, including localization and an SMA-specific antisense perturbation.
      This establishes the donor context, but the accessible source does not resolve positive regulation
      of gene expression for human ACTA1. An ISS can legitimately cross paralogs, so the different gene
      name, developmental tissue and lack of target-specific evidence do not by themselves prove a wrong
      transfer. Moreover, wild-type ACTA1 can incorporate into non-sarcomeric actin structures in cultured
      myoblasts (PMID:15198992). Keep the transfer unresolved pending evidence of conservation or target-specific
      divergence, without rejecting the donor experimental annotation.
