# ---------------------------------------------------------------------------
# GOA rows 19-23: the AgBase block. One chicken smooth-muscle-actin paper,
# transferred to a sarcomeric actin. All five REMOVE.
# ---------------------------------------------------------------------------

- term:
    id: GO:0010628
    label: positive regulation of gene expression
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: involved_in
  review:
    summary: >-
      One of five terms transferred from chicken smooth muscle alpha-actin. The observation is a
      chick endothelial-mesenchymal transformation experiment and has no bearing on skeletal muscle
      alpha-actin.
    action: REMOVE
    reason: >-
      WITH/FROM UniProtKB:P08023 resolves to reviewed Gallus gallus ACTA2, actin aortic smooth
      muscle. That is the ortholog of human ACTA2, not of human ACTA1, and chicken has its own
      ACTA1 - P68139, ACTS_CHICK - so the correct ortholog existed in the same species and was not
      used. The donor's evidence is not weak, which is why the failure is in the propagation rather
      than the source: P08023 holds this term by its own IDA, but that IDA and the four others in
      this block all come from a single paper, PMID:10633868, in which antisense oligonucleotides
      against smooth muscle alpha-actin reduced its expression and blocked migratory appendage
      formation during chick cardiogenesis. Transferring a smooth-muscle-alpha-actin gene-expression
      effect to the skeletal isoform is not supportable on any ACTA1 evidence, and sequence
      similarity cannot license it: ACTA1 is 97.9 per cent identical to ACTA2 and 98.9 per cent to
