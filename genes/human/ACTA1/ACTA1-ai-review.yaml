- term:
    id: GO:0051371
    label: muscle alpha-actinin binding
  evidence_type: IDA
  original_reference_id: PMID:16945537
  qualifier: enables
  review:
    summary: >-
      Retain the existing proposal for binding to Z-line muscle alpha-actinin.
    action: NEW
    reason: >-
      PMID:16945537 reports a direct affinity measurement using actin from a human ACTA1 K336E muscle
      biopsy and a comparison with normal actin. The partner is explicitly described as Z-line alpha-actinin,
      matching the muscle-isoform scope of GO:0051371. Retain the pre-existing IDA proposal without inventing
      an ACTN2 or ACTN3 accession. The biopsy contained 28% mutant actin, so the reported ten-fold affinity
      change is a property of a mixture. UniProt residue-level interaction regions are inferred from rabbit
      ACTA1 and are not independent human mapping experiments.
    supported_by:
    - reference_id: PMID:16945537
      supporting_text: the affinity of actin for the Z-line protein alpha-actinin was reduced 10
        fold.
    - reference_id: PMID:16945537
      supporting_text: electrophoresis showed 28% mutant actin present in his muscle biopsy.
