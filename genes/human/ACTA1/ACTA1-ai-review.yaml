    label: stress fiber
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  review:
    summary: >-
      A self-referential IBA whose sole seed is ACTA1's own stress fiber IDA, and that IDA comes
      from transfecting actin-EGFP into C2C12 myoblasts. PAN-GO promoted an ectopic-expression
      readout to a core annotation, and it has since propagated into mouse by four routes.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Mechanically this row is valid: the PAINT file records GO:0001725 as IBD at node
      PTN000233075 seeded from UniProtKB:P68133, that is from ACTA1 itself, restricted to taxon
      32523, so it is a PAN-GO curator's judgement that the term is core for ACTA1 rather than a
      transfer from anything else. The problem is what it rests on. The only ACTA1 stress fiber
      datum is the IDA from PMID:15198992, whose actin-localisation experiments are transfections
      of C2C12 myoblasts with mutant actin-EGFP constructs; stress fibers are a property of the
      undifferentiated myoblast host, which will incorporate any actin, and the paper's abstract
      does not mention stress fibers at all. Adult skeletal muscle alpha-actin is a sarcomeric
      thin-filament protein and alpha-skeletal actin is its tissue's exclusive isoform from
      infancy, so a non-sarcomeric contractile bundle is not where this protein acts. The reach is
      the reason to act rather than shrug: QuickGO shows all four of mouse Acta1's GO:0001725 rows
      carry WITH/FROM P68133 - ISS by UniProt, IEA by Ensembl, ISO by GO_Central and IBA by
      PAN-GO - so one transfection readout has become five annotations in two species. Demoted
      rather than removed because the underlying observation is probably real in the assay
      performed and the paper's full text is not available. The three sarcomeric terms on the same
      PAN-GO node are correct and are accepted below; this objection is specific to stress fiber.
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      failure_modes:
      - CONTEXT_OR_TISSUE_MISMATCH
      source_entities:
