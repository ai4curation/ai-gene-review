id: P47710
gene_symbol: CSN1S1
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Alpha-S1-casein (CSN1S1; a 185-residue precursor with a 15-residue signal peptide) is a secreted,
  intrinsically disordered milk phosphoprotein of the calcium-sensitive casein family. It is synthesized
  by mammary alveolar epithelial cells during late pregnancy and lactation, passes through the endoplasmic
  reticulum and Golgi, where serines in its phosphoserine clusters are phosphorylated, and is secreted
  into milk. There, with beta-casein, it binds calcium and associates with colloidal calcium phosphate
  in the interior of casein micelles, which kappa-casein stabilizes at the surface; the micelles let milk
  deliver calcium, phosphate and amino acids to the infant at concentrations above their solubility. Unlike
  in cow's milk, alpha-S1-casein is a minor casein in human milk (less than 1% of milk protein). In vitro,
  recombinant, non-phosphorylated human alpha-S1-casein binds the TLR4/MD2 receptor complex and induces
  pro-inflammatory cytokines in monocytic cells, skews monocyte differentiation towards macrophages and
  inhibits early GM-CSF-driven dendritic-cell differentiation; phosphorylation by CK2 abolishes TLR4 binding,
  and the physiological significance of these effects is not established. Proteolysis releases bioactive
  peptides such as the opioid antagonist casoxin D, and the bovine ortholog is a major allergen in cow's
  milk allergy.
