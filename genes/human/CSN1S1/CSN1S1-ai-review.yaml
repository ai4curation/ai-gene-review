- id: PMID:38339021
  title: 'Structural Analysis of Breast-Milk α(S1)-Casein: An α-Helical Conformation Is Required for TLR4-Stimulation.'
  findings:
  - statement: Phosphorylation reduces the alpha-helical content of human alpha-S1-casein and abolishes
      its TLR4-agonist activity.
    supporting_text: Our results indicate that αS1-casein appears in two distinct conformations, an α-helical
      TLR4-agonistic and a less α-helical TLR4 non-agonistic conformation induced by phosphorylation.
  - statement: Alpha-S1-casein is less than 1% of human milk protein.
    supporting_text: A reason for this could be the low content of breast-milk αS1-casein with less than
      1% (3 mg/L to 537 mg/L) of total milk protein content
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text cached; in vitro structural and cell-reporter study.
