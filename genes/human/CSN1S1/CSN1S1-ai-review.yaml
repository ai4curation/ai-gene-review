      that participates in **casein micelle** architecture and thereby supports nutrient/mineral delivery;
      in humans it is a **minor casein component** relative to β- and κ-casein
    reference_section_type: DISCUSSION
  - statement: αS1-casein is a documented precursor for Casoxin D (αS1-casein f158–164; YVPFPPF), classified
      in reviews as an opioid antagonist peptide.
    supporting_text: αS1-casein is a documented precursor for **Casoxin D** (αS1-casein f158–164; **YVPFPPF**),
      classified in reviews as an **opioid antagonist** peptide
    reference_section_type: DISCUSSION
- id: PMID:36903269
  title: 'Caseins: Versatility of Their Micellar Organization in Relation to the Functional and Nutritional
    Properties of Milk'
  findings:
  - statement: αS1-, αS2-, and β-caseins are calcium-binding phosphoproteins located mainly in the casein
      micelle interior, associating with colloidal calcium phosphate; κ-casein forms the stabilizing surface
      layer.
    reference_section_type: DISCUSSION
  - statement: In human milk, αS1-casein is a minor casein fraction (~3% of casein), with total casein
      concentration 2.4–4.2 g/L and mean micelle diameter 64–80 nm.
    reference_section_type: DISCUSSION
- id: PMID:24083466
  title: Human casein alpha s1 (CSN1S1) skews in vitro differentiation of monocytes towards macrophages.
  findings:
  - statement: Recombinant human CSN1S1 skews primary monocytes towards a macrophage-like phenotype and
      inhibits early GM-CSF-driven dendritic-cell differentiation in vitro.
    supporting_text: CSN1S1 skews in vitro differentiation of monocytes towards a macrophage-like phenotype.
  - statement: Inhibition of early GM-CSF-induced dendritic-cell differentiation.
    supporting_text: Early GM-CSF, but not GM-CSF/IL-4 induced differentiation of monocytes towards dendritic
      cells (DC) was inhibited by addition of CSN1S1.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: In vitro study with recombinant protein at 10 ug/ml; physiological relevance to milk
      or infant immunity not shown. Supports description only, not a GO annotation.
- id: PMID:26909866
  title: Human casein alpha s1 induces proinflammatory cytokine expression in monocytic cells by TLR4
    signaling.
  findings:
  - statement: Recombinant CSN1S1 induces IL-1beta, IL-8 and IL-6 in monocytic cells through TLR4, and
      CK2 phosphorylation abolishes this effect and TLR4 binding.
    supporting_text: Phosphorylation of CSN1S1 by casein-kinase 2 completely abolished proinflammatory
      cytokine induction and binding to TLR4.
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract verified. In vitro; the milk protein is normally highly phosphorylated, so
      the TLR4-agonist form may not be the physiological one.
