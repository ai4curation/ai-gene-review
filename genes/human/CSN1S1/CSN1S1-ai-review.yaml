- term:
    id: GO:0007595
    label: lactation
  evidence_type: NAS
  review:
    summary: 'Alpha-s1-casein does part of the work of milk secretion: in goat, loss of alpha-s1-casein
      impairs ER-to-Golgi export of the other caseins, and in the mouse Csn1s1 knockout secretion of milk
      proteins and calcium phosphate is curtailed.'
    action: NEW
    reason: 'Participation test: alpha-s1-casein acts with the other caseins in the secretory pathway
      to drive their ER export and casein micelle biogenesis, rather than only being cargo secreted during
      lactation (goat alpha-s1 null, PMID:10504344; PMID:20704729; mouse Csn1s1 knockout, PMID:21789179).
      The evidence is from ruminant and mouse orthologs; no human experiment exists, and human milk contains
      relatively little alpha-s1-casein, so the role is inferred by orthology. Comparator check: mouse
      and rat Csn1s1 carry GO:0007595 in GOA, as do mouse/rat/human beta- and kappa-caseins, while the
      alpha-s2 clade lacks it (no alpha-s2 knockout exists), so the term follows the experimental evidence
      rather than a family-wide convention.'
    supported_by:
    - reference_id: PMID:10504344
      supporting_text: We conclude that optimal export of the caseins out of the endoplasmic reticulum
        is dependent upon alpha(S1)-casein.
    - reference_id: PMID:21789179
      supporting_text: Absence of α-casein protein significantly curtails secretion of other milk proteins
        and calcium-phosphate, suggesting a role for α-casein in the establishment of casein micelles.
    - reference_id: PMID:20704729
      supporting_text: Our data suggest that alphaS1-casein, which is required for efficient export of
        the other caseins from the endoplasmic reticulum, plays a key role in early steps of casein micelle
        biogenesis and casein transport in the secretory pathway.
- term:
    id: GO:0140314
    label: calcium ion sequestering activity
  evidence_type: NAS
  review:
    summary: Alpha-S1-casein binds Ca2+ via clusters of phosphoserine residues and traps it as colloidal
      calcium phosphate (CCP) inside casein micelle interiors, removing free Ca2+ from the available pool
      and stabilizing otherwise supersaturating calcium-phosphate concentrations in milk for delivery
      to the nursing infant.
    action: NEW
    reason: 'GO:0140314 (calcium ion sequestering activity, defined as binding to a calcium ion

      to prevent it from interacting with other partners or to inhibit its localization)

      accurately captures the casein function. The previously proposed GO:0006816

      (calcium ion transport) is inappropriate -- caseins are secreted structural

      phosphoproteins, not transporters or pores. Replaces a previously proposed

      GO:0006816 NEW annotation per PR #678 review feedback.

      '
    supported_by:
    - reference_id: file:human/CSN1S1/CSN1S1-uniprot.txt
      supporting_text: Important role in the capacity of milk to transport calcium phosphate.
    - reference_id: PMID:36903269
      supporting_text: The calcium-sensitive caseins (αS1-, αS2-, and β-) bind calcium, mainly by electrostatic
        interactions with colloidal calcium phosphate (CCP)
    - reference_id: file:human/CSN1S1/CSN1S1-deep-research-falcon.md
      supporting_text: caseins assemble with **colloidal calcium phosphate** into casein micelles; αS1-,
        αS2-, and β-caseins are emphasized as **calcium-binding** and located mainly in the micelle interior
