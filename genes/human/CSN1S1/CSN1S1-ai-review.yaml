proposed_new_terms:
- proposed_name: casein micelle
  proposed_definition: A colloidal protein-mineral particle, typically 50-500 nm in diameter, found in
    the milk of mammals and formed in the lumen of mammary alveoli from calcium-sensitive phosphorylated
    caseins (alpha-s1, alpha-s2 and beta-casein) associated with nanoclusters of amorphous calcium phosphate,
    together with kappa-casein, which limits micelle growth and confers colloidal stability.
  justification: 'The casein micelle is the supramolecular assembly in which alpha-S1-casein acts, but
    GO has no cellular component for it, so caseins can only be annotated to extracellular region. The
    same term is proposed in the human CSN2 and CSN3 reviews. The definition deliberately does not fix
    kappa-casein at the micelle surface: the classic model places it in a surface layer, while scattering
    data interpreted under a multivalent-binding model place kappa-casein throughout coat and core (PMID:38318529).'
suggested_questions:
- question: 'Calcium ion sequestering activity (GO:0140314) is used here as an approximation: alpha-S1-casein''s
    phosphoserine clusters sequester nanoclusters of amorphous calcium phosphate rather than free calcium
    ions. Should GO add a more precise term (for example calcium phosphate sequestering activity) for
    the calcium-sensitive caseins?'
- question: Does non-phosphorylated alpha-S1-casein reach the infant gut or circulation in amounts sufficient
    to engage TLR4, or are the TLR4 and monocyte effects seen with recombinant protein confined to in
    vitro conditions?
- question: Given that alpha-S1-casein is less than 1% of human milk protein, does it still play the structural
    role in ER export and micelle formation that it plays in goat and mouse?
suggested_experiments:
- hypothesis: Native, phosphorylated alpha-S1-casein purified from human milk does not activate TLR4,
    whereas a dephosphorylated form does.
  description: Compare native and phosphatase-treated alpha-S1-casein from human milk in TLR4/MD2/CD14
    reporter cells and primary monocytes, with phosphorylation state checked by mass spectrometry.
  experiment_type: cell-based reporter assay
status: COMPLETE
