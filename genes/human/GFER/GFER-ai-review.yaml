proposed_new_terms: []
suggested_questions:
- question: Which source-specific donor experiments distinguish a regenerative effector role from general
    redox-dependent survival in the conserved liver-development assertion?
- question: How are the natural 205- and 125-residue products distributed and secreted in human cells,
    and which substrates do they oxidize in those compartments?
suggested_experiments:
- experiment_type: Natural-product localization and redox function
  description: Compare sequence-verified natural long and short products at matched expression for compartmental
    distribution, extracellular release and MIA40 redox state. Analyze engineered truncations and cysteine
    substitutions separately; do not equate secretion with a regenerative mechanism.
