id: P55789
gene_symbol: GFER
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: GFER encodes ALR, a FAD-dependent sulfhydryl oxidase that regenerates CHCHD4/MIA40 in the
  mitochondrial intermembrane space. Its cysteine relay transfers electrons from reduced MIA40 through
  FAD to downstream acceptors, supporting oxidative folding and import of mitochondrial proteins. Cytochrome
  c and oxygen can accept electrons. The long natural product contains the N-terminal relay extension;
  the shorter product lacks it and has a reported cytoplasmic pool, while its human extracellular occurrence
  remains unresolved. Biallelic GFER variants cause a mitochondrial disorder with progressive myopathy,
  congenital cataract, hearing loss and respiratory-chain deficiency.
alternative_products:
- id: P55789-1
  name: 1 (HPO-205, lfALR)
  sequence_note: Displayed 205-residue product.
  description: The long product contains the distal MIA40 shuttle motif and is assigned to mitochondria
    and the intermembrane space by UniProt.
- id: P55789-2
  name: 2 (HPO-125, sfALR)
  sequence_note: VSP_040393 removes residues 1–80, yielding 125 residues; the direct official FASTA matches
    this reconstruction.
  description: The short product lacks the N-terminal distal MIA40 shuttle motif. Short engineered ALR
    proteins retain model-substrate oxidation, which does not establish identical activity for every natural
    product. UniProt assigns cytoplasmic and secreted pools; a primary human secretion assay remains unresolved.
