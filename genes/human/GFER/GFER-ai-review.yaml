- term:
    id: GO:0015035
    label: protein-disulfide reductase activity
  evidence_type: IDA
  original_reference_id: PMID:22224850
  qualifier: enables
  review:
    summary: GFER catalyzes protein thiol/disulfide interconversion.
    action: ACCEPT
    reason: The official definition describes protein thiol/disulfide interconversion without specifying
      reaction direction or terminal acceptor. Human ALR oxidizes reduced MIA40 while relaying electrons
      to cytochrome c. This core route is not exhausted by the O2-specific sulfhydryl-oxidase child term;
      ACCEPT does not imply generalized disulfide reduction.
    supported_by:
    - reference_id: PMID:22224850
