    supporting_text: lf-ALR oxidizes the CPC motif of MIA40 more efficiently than sf-ALR
  - reference_id: PMID:20593814
  - reference_id: PMID:22224850
  - reference_id: PMID:23676665
  - reference_id: PMID:19397338
    supporting_text: human Mia40 as a direct substrate of human lfALR
