id: Q8IVG9
gene_symbol: MT-RNR2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'Humanin (HN) is a 24-residue peptide translated from a short open reading frame inside MT-RNR2,
  the mitochondrial 16S ribosomal RNA gene, and is the founding member of the mitochondrial-derived peptide
  family that also includes MOTS-c and the small humanin-like peptides SHLP1-6. It behaves as a secreted,
  cytoprotective signalling peptide: it is released from cells, circulates in plasma at levels that decline
  with age, and engages cell-surface receptors - the G protein-coupled formyl peptide receptors FPR2/FPRL1
  and FPR3/FPRL2, and a gp130-family cytokine receptor complex containing CNTFR and WSX-1/IL27RA - triggering
  JAK/STAT3 signalling that protects neurons, retinal pigment epithelium, endothelium and pancreatic beta-cells
  from apoptotic insults. Humanin also has an intracellular arm: in the cytosol it binds the BCL-2-family
  proteins BAX, BID and the BimEL isoform of BIM, co-assembling with them into fibers that sequester them
  and prevent mitochondrial outer-membrane permeabilization, and it binds IGFBP3, blocking IGFBP3-dependent
  cell death and competing with importin-beta1 for IGFBP3. It binds amyloid-beta oligomers directly and
  delays amyloid fibril formation. Humanin homodimerizes through Ser7, and the determinants of its secretion
  and of its neuroprotective activity have been mapped residue by residue. It is detected in testis, sperm
  (concentrated in the flagellar midpiece), retina, heart, skeletal muscle, kidney and liver, and intracellularly
  in cytoplasm and mitochondria. Two features of the peptide remain unresolved: whether the active peptide
  is translated from the mitochondrial transcript (which, read with the mitochondrial genetic code, would
  yield a 21-residue product lacking the three C-terminal residues) or from one of the thirteen nuclear
  MT-RNR2-like loci that derive from mitochondrial DNA inserted into the nuclear genome; and how a peptide
  encoded in the mitochondrial genome reaches the extracellular space. Most functional data come from
  synthetic peptide applied exogenously, often as the more potent S14G analogue.'
