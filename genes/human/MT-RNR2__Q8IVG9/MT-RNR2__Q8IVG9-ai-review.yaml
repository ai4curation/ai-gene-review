proposed_new_terms:
- proposed_name: insulin-like growth factor binding protein binding
  proposed_definition: Binding to an insulin-like growth factor binding protein (IGFBP), a secreted carrier
    protein of the IGFBP family.
  justification: 'Humanin binds IGFBP3 with high affinity and specificity, the interaction has been mapped
    to the IGFBP3 heparin-binding segment (residues 215-232), is abolished by the humanin F6A substitution,
    and has defined consequences: humanin blocks IGFBP3-induced cell death and competes with importin-beta1
    for IGFBP3, preventing its nuclear import. Three independent GOA rows record this interaction as bare
    GO:0005515 protein binding, which conveys none of it. No existing GO term fits: GO:0005520 insulin-like
    growth factor binding and its children describe binding to IGF itself, not to the carrier, and GO:0019838
    growth factor binding is wrong for the same reason. The term would also serve other IGFBP-binding
    proteins (for example the humanin-competitive hyaluronan-CD44 system described in PMID:30184438) rather
    than being gene-specific.'
