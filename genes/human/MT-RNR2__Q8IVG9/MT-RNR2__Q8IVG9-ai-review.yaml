    action: ACCEPT
    reason: 'A mitochondrial pool is reported by three independent approaches and is unsurprising for
      a peptide whose ORF lies in the mitochondrial genome. Two caveats worth recording rather than acting
      on: the RPE result follows uptake of exogenous synthetic peptide, so it shows import rather than
      synthesis in the organelle, and the antibody-based results cannot distinguish this accession from
      the nuclear MT-RNR2-like paralogs. Neither undermines the annotation, but neither establishes that
      humanin is made in the matrix.'
