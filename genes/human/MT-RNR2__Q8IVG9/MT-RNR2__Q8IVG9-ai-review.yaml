- term:
    id: GO:0006879
    label: intracellular iron ion homeostasis
  evidence_type: NAS
  original_reference_id: PMID:15567815
  qualifier: involved_in
  review:
    summary: Non-traceable author statement attached to the observation that humanin immunoreactivity
      in villonodular synovitis is seen predominantly around dense intramitochondrial iron deposits.
    action: REMOVE
    reason: Proximity of a peptide to iron deposits in a diseased tissue is not participation in iron
      homeostasis. No assay of iron uptake, storage, export or sensing was performed, no iron-related
      partner or activity has ever been reported for humanin, and the annotation is an NAS - the weakest
      evidence class - on a single descriptive pathology study. This is a clear over-annotation and should
      be withdrawn.
    supported_by:
    - reference_id: PMID:15567815
      supporting_text: Electron microscopy disclosed immunolocalisation of this peptide, predominantly
        around dense iron deposits
