  review:
    summary: Immunocytochemistry and immunoelectron microscopy of human testis and ejaculated sperm report
      humanin immunoreactivity in the cytoplasm and nucleus of spermatocytes and spermatids and on uncoiled
      sperm chromatin.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'This is the sole evidence for a nuclear pool, it is antibody-based in a single short report
      with no biochemical fractionation, and no nuclear function has ever been assigned to humanin. The
      antibody problem is acute for this gene: thirteen nuclear MT-RNR2-like loci encode near-identical
      humanin-like peptides, so an anti-humanin antibody cannot attribute signal to this accession. The
      peptide also has no basic nuclear-targeting determinant and is a secreted ligand.'
