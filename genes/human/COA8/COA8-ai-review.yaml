    summary: The apoptosis family mapping overextends context-dependent mouse findings to human COA8.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'GO:0097193 describes intracellular signaling that triggers apoptotic execution. The recovered
      2006 paper provides real positive evidence: mouse Apop-1 expression releases cytochrome c and activates
      caspases, CypD deficiency and cyclosporin A protect, and antisense expression reduces stimulus-induced
      death. Its 194-residue Apop-1 and alternative C-terminal Apop-2 constructs are not equated to either
