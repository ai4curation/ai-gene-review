      cell lines, including HeLa. These target-specific findings make the family-wide human process assertion
      overextended. This supersedes the prior non-core retention without declaring the mouse experiments
      false, interpreting the renamed protein as evidence, or asserting that every possible human context
      lacks an apoptosis role.'
