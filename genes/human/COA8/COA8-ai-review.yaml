core_functions:
- description: COA8 associates with the heme O synthase COX10 and supports complex IV biogenesis at the
    matrix-facing inner membrane. Its assembly role includes maintaining nascent complex IV subunits and
    protecting their abundance during oxidant challenge. COX10 binding is linked to COX10 stability and
    heme A availability, although the molecular mechanism connecting binding to enzyme function remains
    unresolved.
