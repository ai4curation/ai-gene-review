id: Q96IL0
gene_symbol: COA8
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: COA8 is a nuclear-encoded mitochondrial complex IV assembly factor associated with the matrix-facing
  surface of the inner membrane. It supports cytochrome c oxidase biogenesis and the stability of newly
  synthesized mitochondrial subunits, including during oxidative challenge. Its precursor undergoes proteasomal
  turnover, whereas oxidative stress rapidly increases the mature mitochondrial protein. COA8 also associates
  with the heme O synthase COX10 in human cell assays; this preliminary association is linked to COX10
  abundance and heme A availability, while the proposed effect on COX10 catalysis remains unresolved.
  Biallelic pathogenic variants cause complex IV deficiency with cavitating leukoencephalopathy. Mouse
  apoptogenic constructs produced context-dependent cell-death effects that were not reproduced by later
  human protein-expression studies.
