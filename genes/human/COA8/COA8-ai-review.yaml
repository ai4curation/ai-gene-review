core_functions:
- description: COA8 supports complex IV assembly and nascent-subunit stability at the matrix-facing inner
    membrane, including under oxidant challenge. Its molecular association with the heme O synthase COX10
    is supported by controlled human cell co-immunopurification in an unreviewed 2024 preprint, and is
    therefore provisional. The W174A variant retains COX10 association and restores its abundance but
    fails to restore heme A and complex IV, separating binding from functional rescue. No intrinsic COA8
    catalysis or purified COX10 rate enhancement has been demonstrated by these experiments.
  molecular_function:
    id: GO:0019899
    label: enzyme binding
  directly_involved_in:
  - id: GO:0033617
    label: mitochondrial respiratory chain complex IV assembly
  - id: GO:0050821
    label: protein stabilization
  locations:
  - id: GO:0099617
    label: matrix side of mitochondrial inner membrane
  supported_by:
  - reference_id: PMID:25175347
  - reference_id: PMID:30552096
  - reference_id: DOI:10.1101/2024.04.02.587738
suggested_questions:
- question: Does purified COA8 directly alter COX10 turnover or conformation independently of COX10 abundance,
    and is the preprint mechanism reproduced in endogenous human complexes?
- question: What is the physiological abundance and activity of the current 125-residue Q96IL0-2 product,
    and how does it correspond to the historical APOPT1-203 construct?
- question: Which construct and cellular conditions explain the positive mouse apoptosis experiments versus
    the later negative human assays?
suggested_experiments:
- description: Reconstitute human COX10 with and without mature COA8, quantify heme O synthesis at matched
    COX10 abundance, and compare WT and W174A without equating binding to activation.
- description: Quantify endogenous COA8 splice products with discriminating peptides and test matched,
    sequence-verified rescue constructs in COA8-deficient human cells.
