suggested_questions:
- question: Does purified COA8 directly alter COX10 turnover or conformation independently of COX10 abundance,
    and is the preprint mechanism reproduced in endogenous human complexes?
- question: What is the physiological abundance and activity of the current 125-residue Q96IL0-2 product,
    and how does it correspond to the historical APOPT1-203 construct?
- question: Which construct and cellular conditions explain the positive mouse apoptosis experiments versus
    the later negative human assays?
suggested_experiments:
- description: Reconstitute human COX10 with and without mature COA8, quantify heme O synthesis at matched
    COX10 abundance, and compare WT and W174A without equating binding to activation.
- description: Quantify endogenous COA8 splice products with discriminating peptides and test matched,
    sequence-verified rescue constructs in COA8-deficient human cells.
