    correctness: VERIFIED
    review_notes: Selected full human and mouse Results and Methods were read. Results paragraph 71 supports
      a matrix-facing C terminus, whereas Discussion paragraph 114 says IMS-facing; the experimental Results
      guide localization. Paper APOPT1-201/203 constructs are not automatically equated to both current
      UniProt products.
