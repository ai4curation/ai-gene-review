taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: COA8 is a nuclear-encoded mitochondrial complex IV assembly factor associated with the matrix-facing
  surface of the inner membrane. It supports cytochrome c oxidase biogenesis and the stability of newly
  synthesized mitochondrial subunits, including during oxidative challenge. Its precursor is subject to
  proteasomal turnover, whereas oxidative stress rapidly increases the mature mitochondrial protein. A
  2024 preprint reports specific association with the heme O synthase COX10 and links COA8 loss to reduced
  COX10 abundance and heme A availability; the proposed effect on the catalytic conformation of COX10
  remains mechanistically unresolved. Biallelic pathogenic variants cause complex IV deficiency with cavitating
  leukoencephalopathy. Earlier mouse apoptogenic constructs produced context-dependent cell-death effects,
  distinct from the established assembly function.
