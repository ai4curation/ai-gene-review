- id: DOI:10.1101/2024.04.02.587738
  title: COA8 is a COX10-binding protein involved in the early biogenesis of cytochrome c oxidase
  findings:
  - statement: Human COA8 associates with COX10. A W174A variant retains binding and restores COX10 abundance
      but fails to restore heme A and complex IV, separating association from functional rescue.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Unreviewed 2024 preprint, version 2. Official bioRxiv and Crossref records were checked;
      the normal DOI cache is abstract-only after provider failures. A genuine repository PDF supplied
      actual selected Results and Methods. Human HA-SILAC and GFP co-IP demonstrate association; heme
      pool measurements and predicted interfaces do not constitute purified COX10 catalytic-rate or COA8
      catalytic assays.
