      read. Pipeline validation is not asserted for the individual pair.
- id: PMID:30552096
  title: APOPT1/COA8 assists COX assembly and is oppositely regulated by UPS and ROS.
  findings:
  - statement: Human complementation and pulse-chase experiments connect COA8 to complex IV assembly and
      subunit stability; stress-dependent accumulation and matrix-side association are experimentally
      supported.
  reference_review:
