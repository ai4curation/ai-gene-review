- id: PMID:12674328
  title: Leupaxin is a critical adaptor protein in the adhesion zone of the osteoclast.
  full_text_unavailable: true
  findings:
  - statement: In murine osteoclasts, LPXN is a component of the podosomal signaling complex and associates with PYK2, FAK, PTP-PEST, and p95PKL.
    supporting_text: We have identified leupaxin to be a component of the osteoclast podosomal signaling complex. We have found that leupaxin in murine osteoclasts is associated with both PYK2 and pp125FAK in the osteoclast.
    reference_section_type: ABSTRACT
  - statement: Reducing LPXN in osteoclasts decreases their in-vitro resorptive capacity.
    supporting_text: Finally, in vitro inhibition of leupaxin expression in the osteoclast led to a decrease in resorptive capacity.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-verified primary osteoclast study; direct functional experiments are murine, so the podosome and bone-resorption conclusions must retain that species boundary.
- id: PMID:17640867
  title: Leupaxin negatively regulates B cell receptor signaling.
  full_text_unavailable: true
  findings:
  - statement: BCR stimulation recruits and tyrosine-phosphorylates LPXN at the plasma membrane of human BJAB lymphoma cells and induces LPXN binding to Lyn through its LD3 region.
    supporting_text: We show here that leupaxin (LPXN), a member of this family, was tyrosine-phosphorylated and recruited to the plasma membrane of human BJAB lymphoma cells upon BCR stimulation and that it interacted with Lyn (a critical Src family tyrosine kinase in BCR signaling) in a BCR-induced manner.
    reference_section_type: ABSTRACT
  - statement: In mouse A20 B lymphoma cells, LPXN overexpression selectively suppresses BCR signaling, and Tyr72 is required for inhibition of IL-2 secretion.
    supporting_text: The overexpression of LPXN in mouse A20 B lymphoma cells led to the suppression of BCR-induced activation of JNK, p38 MAPK, and, to a lesser extent, Akt, but not ERK and NFkappaB, suggesting that LPXN can selectively repress BCR signaling.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-verified mechanistic study with a human BJAB localization/Lyn-binding arm and a mouse A20 gain-of-function signaling arm; only the latter directly establishes pathway inhibition.
- id: PMID:18451096
  title: Leupaxin, a novel coactivator of the androgen receptor, is expressed in prostate
    cancer and plays a role in adhesion and invasion of prostate carcinoma cells.
  full_text_unavailable: true
  findings:
  - statement: In prostate-cancer cells, LPXN shuttles between focal adhesions and the nucleus and binds ligand-activated androgen receptor as a transcriptional coactivator.
    supporting_text: We could also demonstrate for the first time that leupaxin interacts with the androgen receptor in a ligand-dependent manner and serves as a transcriptional activator of this hormone receptor in PCa cells.
    reference_section_type: ABSTRACT
  - statement: LPXN depletion reduces motility and invasion of androgen-independent PC-3 and DU145 prostate-cancer cells.
    supporting_text: In contrast, knockdown of leupaxin expression in androgen-independent PC-3 and DU 145 cells induced a significant decrease of both the invasive capacity and motility.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified primary human prostate-cancer study. The AR-coactivation and migration phenotypes are disease-cell-context evidence, not universal LPXN activity.
- id: PMID:18497331
  title: The LIM protein leupaxin is enriched in smooth muscle and functions as an
    serum response factor cofactor to induce smooth muscle cell gene transcription.
  findings:
  - statement: LPXN is enriched in human and mouse vascular smooth muscle, localizes to focal adhesions and nucleus, and functions as an SRF cofactor.
    supporting_text: Herein, we identified leupaxin in a screen for focal adhesion kinase binding partners in aortic smooth muscle, and we show that leupaxin is enriched in human and mouse vascular smooth muscle and that leupaxin expression is dynamically regulated during development.
    reference_section_type: ABSTRACT
  - statement: LPXN forms a complex with SRF, occupies CArG-containing smooth-muscle promoters, and promotes smooth-muscle marker transcription in mouse and rat cell systems.
    supporting_text: We found that leupaxin forms a complex with serum response factor and associates with CArG-containing regions of smooth muscle promoters and that ectopic expression of leupaxin induces smooth muscle marker gene expression in both 10T1/2 cells and rat aortic smooth muscle cells.
    reference_section_type: ABSTRACT
  - statement: Increased FAK activity retains LPXN outside the nucleus and limits its SRF-dependent transcriptional effect.
    supporting_text: Subsequent studies indicated that enhanced focal adhesion kinase activity (induced by fibronectin or expression of constitutively active focal adhesion kinase) attenuates the nuclear accumulation of leupaxin and limits the ability of leupaxin to enhance serum response factor-dependent gene transcription.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full-text primary study. Human coronary smooth-muscle cells establish endogenous localization/promoter occupancy; several transcriptional perturbations use mouse 10T1/2 or rat aortic smooth-muscle cells.
