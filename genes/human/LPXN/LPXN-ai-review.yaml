id: O60711
gene_symbol: LPXN
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  LPXN (leupaxin) is a paxillin-family LD/LIM adaptor enriched in hematopoietic
  cells and vascular smooth muscle. It cycles among the cytoplasm, focal
  adhesions or podosomes, and the nucleus. At adhesion structures, its LD motifs
  bind focal-adhesion-family tyrosine kinases including PYK2 and FAK, while
  regulated contacts with Src-family kinases, PTP-PEST, and p95PKL connect
  integrin-associated signaling to cytoskeletal organization. LIM3 directs
  focal-adhesion targeting, and adhesion-site recruitment precedes
  stimulus-dependent LPXN tyrosine phosphorylation. In murine osteoclasts,
  podosomal LPXN promotes adhesion and bone-resorptive activity. B-cell-receptor
  stimulation recruits LPXN to the plasma membrane and induces Lyn binding in
  human BJAB lymphoma cells; gain-of-function experiments in mouse A20 cells
  show selective inhibition of B-cell-receptor outputs. Nuclear LPXN acts as a
  transcriptional coactivator with androgen receptor in prostate-cancer cells
  and as a serum-response-factor cofactor in vascular smooth-muscle systems;
  beta-catenin coactivation has also been observed in hepatocellular-carcinoma
  models. These transcriptional and migration effects depend on cell state and
  experimental context. Two human isoforms differ at their extreme N termini,
  but no isoform-specific activity has been established.
