core_functions:
- description: >-
    LPXN acts through its LD and LIM interaction motifs as a regulated
    protein-macromolecule adaptor at focal adhesions and podosomes. LD1 and LD3
    bind the two sites of the PYK2 FAT domain, while cellular studies place LPXN
    with PYK2 or FAK, Src-family kinases, PTP-PEST, and p95PKL. These contacts
    couple adhesion-site organization to integrin-dependent adhesion and
    cytoskeletal signaling. Human breast- and prostate-cancer-cell experiments
    establish focal-adhesion targeting and context-specific adhesion or migration
    effects; murine osteoclast experiments establish a podosomal role in adhesion
    and resorption. Upon B-cell-receptor stimulation, human BJAB cells recruit
    phosphorylated LPXN to the plasma membrane and induce its binding to Lyn,
    whereas selective pathway inhibition was demonstrated by LPXN overexpression
    in mouse A20 cells. The activity is therefore a dynamic adaptor mechanism,
    not evidence for one obligate stable LPXN complex.
  molecular_function:
    id: GO:0030674
    label: protein-macromolecule adaptor activity
  directly_involved_in:
  - id: GO:0033628
    label: regulation of cell adhesion mediated by integrin
  locations:
  - id: GO:0005925
    label: focal adhesion
  - id: GO:0002102
    label: podosome
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:12674328
    supporting_text: >-
      We have identified leupaxin to be a component of the osteoclast podosomal
      signaling complex. We have found that leupaxin in murine osteoclasts is
      associated with both PYK2 and pp125FAK in the osteoclast.
  - reference_id: PMID:20543562
    supporting_text: >-
      Using mutagenesis, we identified LIM3 as the primary FA targeting domain
      for LPXN and showed BN-induced LPXN tyrosine phosphorylation on residues
      22, 62 and 72.
  - reference_id: PMID:17640867
    supporting_text: >-
      We show here that leupaxin (LPXN), a member of this family, was
      tyrosine-phosphorylated and recruited to the plasma membrane of human BJAB
      lymphoma cells upon BCR stimulation and that it interacted with Lyn (a
      critical Src family tyrosine kinase in BCR signaling) in a BCR-induced
      manner.
  - reference_id: PMID:26866573
    supporting_text: >-
      The first and third LD motifs of leupaxin preferably target the two
      LD-binding sites on the Pyk2-FAT domain, respectively.
- description: >-
    After regulated nuclear accumulation, LPXN functions as a transcriptional
    coregulator by binding DNA-associated transcription regulators rather than by
    binding DNA sequence directly. It binds ligand-activated androgen receptor
    and enhances androgen-receptor transcription in human prostate-cancer cells.
    In vascular smooth-muscle systems it binds serum response factor and occupies
    CArG-containing promoters; the transcriptional perturbations include mouse
    10T1/2 and rat aortic smooth-muscle cells. FAK activity limits nuclear LPXN
    accumulation and SRF-dependent transcription. LPXN also enhances
    beta-catenin-dependent transcription in hepatocellular-carcinoma models.
    These results establish a regulated, context-dependent nuclear coadapter
    activity rather than a universal transcriptional program.
