knowledge_gaps:
- gap_statement: >-
    The endogenous composition, stoichiometry, and temporal order of LPXN-bound
    PYK2 or FAK, Src-family kinases, PTP-PEST, and p95PKL at adhesion structures
    are unresolved.
  boundary: >-
    Pairwise cellular associations and a purified 1:1 LPXN-PYK2-FAT interaction
    are established, but they do not show that all partners bind simultaneously
    or define a single constitutive complex.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    Resolving the assembly sequence is necessary to distinguish LPXN-mediated
    bridging from mutually exclusive partner exchange and to explain how the
    adaptor changes adhesion signaling.
  resolution: >-
    Endogenous time-resolved proximity labeling, quantitative co-complex
    analysis, and interaction-motif rescue experiments at focal adhesions and
    podosomes would establish partner occupancy and dependence.
- gap_statement: >-
    Whether LPXN is required for podosome organization and bone resorption in
    human osteoclasts is unknown.
  boundary: >-
    Localization, gain- and loss-of-function phenotypes, and kinase associations
    are established in murine osteoclasts, but direct human osteoclast evidence is
    lacking.
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  status: OPEN
  significance: >-
    Human evidence would determine whether the mouse resorption phenotype is a
    conserved physiological role of LPXN rather than a species- or assay-specific
    effect.
  resolution: >-
    Endogenous LPXN loss and rescue in primary human monocyte-derived osteoclasts,
    coupled to podosome-belt imaging and mineral-resorption assays, would close
    this gap.
- gap_statement: >-
    The relative abundance, localization, partner selection, and activity of the
    two human LPXN protein isoforms have not been established.
  boundary: >-
    UniProt records an alternative extreme N terminus for isoform 2, while the
    functional literature does not distinguish LPXN isoforms.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    Isoform-resolved evidence is needed before any adhesion, signaling, or nuclear
    coactivation function can be called isoform-specific.
  resolution: >-
    Isoform-selective transcript and proteomic measurements followed by
    endogenous-locus isoform-specific rescue would determine whether the short
    N-terminal difference changes LPXN behavior.
- gap_statement: >-
    The mechanism and physiological scope of LPXN nuclear import and its choice
    among androgen receptor, SRF, and beta-catenin transcriptional programs are
    unresolved.
  boundary: >-
    Nucleocytoplasmic shuttling, nuclear coactivator activity, and FAK-dependent
    control of nuclear accumulation are established in selected smooth-muscle and
    cancer-cell systems, but no universal import determinant or target program has
    been demonstrated.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    This distinction is required to separate a normal adhesion-to-nucleus signal
    from lineage- or disease-specific coactivation.
  resolution: >-
    Endogenous trafficking perturbations combined with partner-resolved chromatin
    occupancy and transcriptional profiling across primary hematopoietic and
    smooth-muscle cells would define the mechanism and scope.
proposed_new_terms: []
suggested_questions:
- question: >-
    Does endogenous LPXN simultaneously bridge PYK2 or FAK, Src, PTP-PEST, and
    p95PKL at adhesion structures, or do these partners exchange in distinct
    signaling states?
- question: >-
    Is the murine osteoclast requirement for LPXN conserved in primary human
    osteoclast podosome organization and bone resorption?
- question: >-
    Which endogenous B-cell contexts require LPXN for inhibition of
    B-cell-receptor signaling, independently of the mouse A20 overexpression
    paradigm?
- question: >-
    What controls LPXN nuclear entry and determines selection of androgen
    receptor, SRF, or beta-catenin transcriptional programs?
- question: >-
    Do LPXN isoforms 1 and 2 differ in expression, adhesion-site targeting,
    partner binding, or nuclear coactivation?
suggested_experiments:
- hypothesis: >-
    LPXN organizes a stimulus-dependent sequence of kinase, phosphatase, and
    cytoskeletal-regulator contacts rather than a constitutive multiprotein
    complex.
  description: >-
    Endogenously tag LPXN in human macrophages and vascular smooth-muscle cells,
    then combine time-resolved proximity labeling, cross-linking quantitative
    proteomics, and single-particle focal-adhesion imaging before and after
    integrin or inflammatory stimulation. Compare wild-type LPXN with LD1-,
    LD3-, and LIM3-contact mutants introduced at the endogenous locus.
  experiment_type: cell biology and proteomics
- hypothesis: >-
    LPXN is required cell-autonomously for human osteoclast podosome organization
    and mineral resorption.
  description: >-
    Use CRISPR knockout or an acute degron in primary human monocyte-derived
    osteoclasts, quantify podosome-belt architecture, traction, and mineral
    resorption, and rescue with wild-type LPXN or PYK2-binding- and
    focal-adhesion-targeting mutants.
  experiment_type: functional cell biology
- hypothesis: >-
    Endogenous LPXN restrains a defined subset of B-cell-receptor outputs through
    activation-dependent LD3-Lyn binding and Tyr72 phosphorylation.
  description: >-
    Introduce an acute LPXN degron into human B-cell models, measure time-resolved
    JNK, p38, Akt, ERK, NF-kappaB, calcium, and cytokine responses after BCR
    cross-linking, and rescue from the endogenous locus with wild-type, LD3-mutant,
    and Y72F LPXN.
  experiment_type: signal transduction
- hypothesis: >-
    FAK-regulated nuclear accumulation selects distinct LPXN transcriptional
    programs according to lineage and transcription-factor availability.
  description: >-
    Couple endogenous LPXN live-cell tracking and acute FAK perturbation to
    LPXN/SRF/androgen-receptor/beta-catenin CUT&RUN and nascent-RNA sequencing in
    primary vascular smooth-muscle cells and matched disease-cell models.
  experiment_type: cell biology and functional genomics
- hypothesis: >-
    The alternative N terminus of LPXN isoform 2 changes protein stability or
    partner selection without altering the shared LD/LIM interaction core.
  description: >-
    Quantify isoform-specific transcripts and N-terminal peptides across LPXN-rich
    tissues, then compare endogenous-locus isoform-1 and isoform-2 rescue for
    half-life, focal-adhesion targeting, partner proteomes, and nuclear
    coactivation.
  experiment_type: isoform-resolved proteomics
