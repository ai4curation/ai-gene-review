    is unidentified and is not a beta-1 integrin - and the contribution is dispensable, since Acrv1-null male mice
    are fertile, so this is stated as participation rather than requirement. The GO term used is labelled for fusion
    while the measured event is binding: its definition covers both steps as one process, and the evidence reaches
    only the binding step.'
