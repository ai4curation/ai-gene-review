  review:
    summary: 'Correct but three levels vaguer than the evidence it was drawn from; modified to acrosomal vesicle.


      Resolving the WITH/FROM field settles this row. MGI:MGI:104590 is mouse Acrv1, UniProtKB P50289 - the true
      one-to-one orthologue, not a paralogue. Asking what that donor itself carries for this term (QuickGO, geneProductId=UniProtKB:P50289,
      goId=GO:0005737, goUsage=descendants) returns five hits, and two of them are the donor''s own IDA annotations
      to GO:0001669 acrosomal vesicle (PMID:1591350, PMID:16093322), with an ISO and an IEA to the same term alongside.
      GO:0001669 is a confirmed descendant of GO:0005737. So the donor''s experimental evidence is specifically
      acrosomal, and the propagated statement threw that away.


      Two further facts make the loss of precision gratuitous rather than cautious. First, human ACRV1 already carries
      its own IDA to GO:0001669 from HPA, so as written this row adds nothing. Second, the WITH/FROM list is short
      - the mouse orthologue, one PANTHER node, and the gene itself - so there is no wide, functionally heterogeneous
      clade forcing a conservative ancestral term.


      The qualifier should change with the term. is_active_in asserts the protein is active where it sits, which
      presupposes a molecular activity ACRV1 does not have; the two existing GO:0001669 rows both use located_in,
      and the replacement should match them. This is a recommendation, not an aside: the proposed annotation is
      located_in GO:0001669, not is_active_in GO:0001669.


      Hence MODIFY rather than REMOVE: the assertion is true, the propagation machinery worked, and the constructive
      fix is to state what the donor''s IDA states.'
    action: MODIFY
    reason: 'The sole protein donor in WITH/FROM, mouse Acrv1 (P50289), carries two IDA annotations to GO:0001669
      acrosomal vesicle, a descendant of GO:0005737; the human gene has its own IDA to the same specific term. Replacing
      the vague ancestor with the term the evidence supports, and with it the qualifier: the replacement should
      be located_in GO:0001669, matching the two existing rows for that term, rather than is_active_in, which presupposes
      a molecular activity ACRV1 has not been shown to have.'
