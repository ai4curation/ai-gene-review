core_functions:
- description: 'Abundant peripheral constituent of the acrosomal matrix of spermatids and spermatozoa. Made with
    a signal peptide and delivered to the nascent acrosomal vesicle of Golgi-phase round spermatids, it is layered
    in a bilaminar array between the outer and inner acrosomal membranes, is hydrophilic and detergent-resistant
    yet released by chaotrope, and is inaccessible from the surface of acrosome-intact sperm. During testicular
    and early epididymal maturation it is trimmed by intra-acrosomal endoproteases, including a trypsin-like activity,
    into a ladder of 18-32 kDa peptides. No molecular activity is assignable: its only experimental molecular-function
    annotation is bare protein binding, its C-terminal Ly-6/uPAR domain belongs to a family whose members carry
    unrelated activities, and it has no human paralogue at subfamily resolution from which to infer one.'
