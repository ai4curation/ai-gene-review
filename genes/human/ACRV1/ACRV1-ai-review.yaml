        but no positive candidate has been proposed or tested.
      boundary: Antibody inhibition establishes that native SP-10 on the equatorial segment of acrosome-reacted
        human sperm is needed for efficient sperm-oolemma binding in vitro, and that the ligand is not a beta-1
        integrin.
      gap_kind:
      - BIOLOGY
      dark_aspect: MF_DARK
      status: OPEN
      significance: Naming the ligand would convert an inhibition phenotype into a molecular function and would
        decide whether cell adhesion mediator activity is the right molecular-function term.
      resolution: Affinity or crosslinking capture of oolemmal proteins using recombinant SP-10 or its 135-149 epitope
        region, with validation by loss of sperm binding on ligand-depleted oocytes.
