suggested_questions:
- question: Should the two PAN-GO annotations for ACRV1 be tightened from cytoplasm and vesicle to acrosomal vesicle?
    The mouse orthologue that supplies the WITH/FROM evidence carries two IDA annotations to GO:0001669, and the
    human protein has its own IDA to the same term, so the propagated terms are strictly less precise than their
    source.
  experts:
  - GO Central / PAN-GO curators
- question: Is the negative hemizona result of PMID:10775167 and the reduced sperm-zona secondary binding of PMID:8882296
    reconcilable as primary versus secondary binding, as proposed in this review, or do the two studies genuinely
    disagree? The answer decides whether GO:0007339 binding of sperm to zona pellucida should also be considered.
  experts:
  - sperm-egg interaction specialists
- question: Given that Acrv1-null male mice are fertile, is the antibody-inhibition evidence for a role in sperm-oolemma
    binding strong enough to annotate, and if so at what level - GO:0007342 or the more cautious parent GO:0007338?
  experts:
  - GO biological-process curators
  - reproductive biologists
- question: What is the acrosomal-matrix anchor that retains SP-10 against detergent extraction but releases it
    with thiocyanate? Identifying it would give ACRV1 its first physiological binding partner.
  experts:
  - acrosome biochemistry laboratories
- question: Does the Ly-6/uPAR domain of SP-10 have a ligand-binding activity analogous to its relatives, or has
    the fold been repurposed purely as a stable scaffold in a proteolytically hostile compartment?
  experts:
  - three-finger-protein structural biologists
- question: ACRV1 is aberrantly expressed in ovarian cancer, where its knockdown attenuates ZNF280A-driven AKT phosphorylation
    and glycolysis (PMID:41338461). Should any GO annotation follow from a testis-restricted protein acting in a
    tissue that never normally expresses it, or is this strictly an ectopic-expression phenotype?
  experts:
  - GO Consortium
  - cancer biologists
- question: UniProt records eleven splice isoforms but no functional distinction among them. Since all isoforms
    with measurable abundance retain the complete Ly-6/uPAR domain and differ only in the length of the disordered
    spacer, is there any evidence that the spacer length is functionally relevant?
  experts:
  - spermatid gene expression laboratories
suggested_experiments:
- description: Identify the oolemmal ligand of SP-10. Use recombinant SP-10, its isolated Ly-6/uPAR domain, and
    the 135-149 epitope peptide as affinity baits against detergent extracts of human or hamster oocyte plasma membrane,
    with photo-crosslinking to capture low-affinity contacts, and validate hits by testing whether depleting the
    candidate from the oolemma reduces binding of acrosome-reacted sperm.
  hypothesis: SP-10 displayed on the equatorial segment engages a specific, non-integrin oolemmal protein that mediates
    the binding step it is required for.
  experiment_type: affinity capture and crosslinking
- description: Capture the acrosomal-matrix anchor. Crosslink intact human or bovine acrosomes, then elute with
    150 mM sodium thiocyanate under the conditions that release the detergent-resistant SP-10 pool, and identify
    co-eluting proteins by mass spectrometry; compare against a detergent-only elution to separate matrix partners
    from bulk lumenal content.
  hypothesis: The detergent-resistant, chaotrope-releasable SP-10 pool is held by one or a few specific acrosomal
    matrix proteins rather than by nonspecific aggregation.
  experiment_type: crosslinking mass spectrometry
- description: Test redundancy behind the fertile Acrv1-null phenotype. Compare Acrv1-null and wild-type males in
    competitive and sequential mating, in in vitro fertilisation with zona-intact and zona-free oocytes, and in
    sperm-oolemma binding assays; then generate combinatorial knockouts of Acrv1 with other acrosomal matrix genes.
  hypothesis: SP-10 makes a real but redundant contribution to sperm-oolemma binding that is revealed only under
    competition or in vitro, and is masked in a standard fertility test.
  experiment_type: mouse genetics and in vitro fertilisation
- description: Determine the structure of the SP-10 Ly-6/uPAR domain (residues 185-265) by NMR or crystallography,
    and map its surface conservation across mammalian orthologues, to ask whether it retains a ligand-binding groove
    comparable to CD59 or uPAR or presents a featureless scaffold.
  hypothesis: The three-finger fold of SP-10 retains a conserved ligand-binding surface, which would predict a molecular
    function and identify residues to mutate.
  experiment_type: structural biology
- description: Ask whether the disordered spacer length matters, by expressing the four abundant isoforms (81-265
    residues, differing only in spacer length) in a spermatid or heterologous secretory system and comparing acrosomal
    targeting, proteolytic processing rate, and matrix association under the detergent and chaotrope fractionation
    used on native sperm.
  hypothesis: The alternatively spliced spacer tunes proteolytic processing or matrix retention rather than conferring
    distinct molecular functions.
  experiment_type: isoform comparison and cell fractionation
