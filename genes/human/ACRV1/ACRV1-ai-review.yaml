id: P26436
gene_symbol: ACRV1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ACRV1 encodes SP-10, an intra-acrosomal protein of mammalian spermatids and spermatozoa. It is made
  as a 265-residue precursor with an N-terminal signal peptide, enters the secretory pathway and accumulates in
  the nascent acrosomal vesicle of Golgi-phase round spermatids; expression is confined to the testis. Structurally
  it has two parts - a long serine/glutamate/glycine-rich block of three interleaved short repeats that is intrinsically
  disordered, and a C-terminal Ly-6/uPAR ("three-finger") domain with ten cysteines, the same fold used by CD59,
  the urokinase receptor and the secreted Ly-6 proteins. Alternative splicing produces at least eleven mRNAs encoding
  81-265 residues, all by in-frame deletions inside the repeat block, and intra-acrosomal endoproteolysis - including
  a trypsin-like activity, possibly acrosin - cleaves the precursor into a ladder of 18-32 kDa peptides during testicular
  and early epididymal maturation; together these give the heterogeneous SP-10 banding pattern seen on blots of
  human sperm. In the intact acrosome SP-10 is a hydrophilic peripheral protein of the acrosomal matrix, layered
  against the inner face of the outer acrosomal membrane and the outer face of the inner acrosomal membrane, and
  inaccessible from the sperm surface. After the acrosome reaction it remains on the sperm head, concentrated on
  the inner acrosomal membrane of the equatorial segment, where antibody-blocking experiments implicate it in binding
  of acrosome-reacted sperm to the oolemma, independently of beta-1 integrins, rather than in binding to the zona
  pellucida. Mice lacking Acrv1 are nonetheless fertile, with testis appearance, testis histology and sperm motility
  all examined and reported normal, so the contribution is dispensable at least individually. Because SP-10 is abundant,
  testis-restricted and displayed only after the acrosome reaction, it has long been used as a marker of acrosome
  status and staging, and was designated a candidate contraceptive-vaccine antigen.
