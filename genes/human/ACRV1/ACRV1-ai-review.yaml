  review:
    summary: 'Over-annotated. Partner Q9BZ23-2 is a cytoplasmic isoform of PANK2, pantothenate kinase 2, which catalyses
      the rate-determining step of coenzyme A synthesis. UniProt assigns the mitochondrial location to isoform 1
      only and places the remaining isoforms, this one among them, in the cytoplasm - note that the accession suffix
      and the isoform name do not run in step, Q9BZ23-2 being UniProt''s named isoform 3.


      A pantothenate kinase and an acrosomal matrix protein have no shared pathway, no shared compartment and no
