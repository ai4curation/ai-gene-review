- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:32814053
  qualifier: enables
  supporting_entities:
  - UniProtKB:P50897
  review:
    summary: 'Over-annotated. A single yeast two-hybrid screen hit between a lysosomal thioesterase and an intra-acrosomal
      protein, on opposite sides of a membrane.


      Partner P50897 is PPT1, palmitoyl-protein thioesterase 1, whose UniProt localisations are lysosome, secreted,
      Golgi and endoplasmic reticulum and whose function is hydrolysis of palmitoyl thioesters including palmitoylated
      proteins. Nothing in the PPT1 or the SP-10 literature connects them; PPT1 deficiency causes infantile neuronal
      ceroid lipofuscinosis, and ACRV1 expression is restricted to testis.


      The evidence is thinner than the record suggests. Querying IntAct directly for P26436 shows this interaction
      recorded three times from the one publication - as "two hybrid array", "two hybrid pooling" and "validated
      two hybrid" - with both partners over-expressed and an MI-score of 0.56. So the NbExp=3 in the UniProt INTERACTION
      block counts three yeast two-hybrid variants inside a single screen, not three independent methods, and there
      is no orthogonal confirmation for this pair anywhere in IntAct.


      There is also a topological problem that applies to all five of these rows. ACRV1 has a signal peptide and
      resides in the lumen of a secretory organelle, so in a spermatid it is never in the compartment where PPT1''s
      cytosolic face or any cytosolic protein could reach it; the two-hybrid assay expressed a signal-peptide-bearing
      open reading frame in a yeast nucleus, where that peptide is inert. Add the 166-residue disordered, serine-
      and glutamate-rich low-complexity region that makes up the middle of ACRV1 - a classic sticky-prey feature
      - and the set behaves like screen background.


      Marked as over-annotated rather than removed: a two-hybrid hit is a real observation and may yet mean something,
      but bare protein binding conveys no function, and this pair does not license a functional claim.'
    action: MARK_AS_OVER_ANNOTATED
    reason: Unreplicated yeast two-hybrid hit from a neurodegeneration-focused screen, recorded three times as three
      Y2H variants of one experiment; no orthogonal assay, no biological connection to acrosome biology, and the
      two proteins occupy opposite sides of a membrane in vivo.
    supported_by:
    - reference_id: PMID:32814053
      supporting_text: connects ∼5,000 human proteins via ∼30,000 candidate interactions and is generated by systematic
        yeast two-hybrid interaction screening of ∼500 ND-related proteins
    - reference_id: PMID:2310816
      supporting_text: Immunofluorescence showed that SP-10 was not associated with the surface of acrosome-intact,
        ejaculated sperm.
      full_text_unavailable: true
    - reference_id: file:human/ACRV1/ACRV1-bioinformatics/RESULTS.md
      supporting_text: The 166-residue linker is composed almost entirely of a few residue types (S 18.7%, E 17.5%,
        G 13.3%, Q 7.8%, A 7.2%, H 7.2%).
    knowledge_gaps:
    - gap_statement: No physiological binding partner of SP-10 inside the acrosome has been identified; the acrosomal-matrix
        anchor that retains it against detergent extraction is an inferred, uncharacterised entity.
      boundary: SP-10 is firmly established as a hydrophilic peripheral protein released from the acrosome by chaotrope
        or pH extremes but not by detergent or 1.5 M NaCl, so a binding partner must exist.
      gap_kind:
      - BIOLOGY
      dark_aspect: MF_DARK
      status: OPEN
      significance: Without a lumenal partner, ACRV1's molecular function cannot be typed, and the existing protein-binding
        annotations point only at cytosolic proteins that it cannot reach in vivo.
      resolution: Crosslinking or affinity capture from purified human acrosomal matrix under chaotrope elution,
        followed by mass spectrometry.
      provenance:
      - reference_id: PMID:1591355
        supporting_text: Together the results suggest that SP-10 is a hydrophilic peripheral acrosomal membrane
          protein that may be associated with a TX-114-resistant "anchor."
        full_text_unavailable: true
