      with full-length TSC1, and the GOA row inherits an accession that no other TSC1 annotation uses.


      The generic objections apply as well: recorded only from PMID:32814053 under the three two-hybrid method labels
      with both partners over-expressed, MI-score 0.56; TSC1 is a cytosolic component of the TSC1-TSC2 complex regulating
      mTORC1, with no reported acrosomal or spermatid role; and ACRV1 is lumenal, so the pair cannot meet in vivo.


      Marked over-annotated rather than removed - the observation stands, but neither its interpretation nor even
      its partner identity is secure.'
