  - statement: SP-10 lies throughout the human acrosome in a bilaminar array against the inner face of the outer
      acrosomal membrane and the outer face of the inner acrosomal membrane.
    supporting_text: Light and electron microscopic immunocytochemistry localized SP-10 throughout the acrosome,
      and electron microscopic evidence demonstrated a bilaminar array in association with the inner aspect of the
      outer acrosomal membrane and the outer aspect of the inner acrosomal membrane.
    full_text_unavailable: true
  - statement: It is not exposed on the surface of acrosome-intact ejaculated sperm, so it is inaccessible until
      the acrosome reaction.
    supporting_text: Immunofluorescence showed that SP-10 was not associated with the surface of acrosome-intact,
      ejaculated sperm.
    full_text_unavailable: true
  - statement: After the acrosome reaction it stays on the sperm head with the inner acrosomal membrane and equatorial
      segment.
    supporting_text: After induction of the acrosome reaction with the ionophore A23187, SP-10 remained displayed
      on the sperm head in association with the inner acrosomal membrane and equatorial segment.
    full_text_unavailable: true
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Foundational human localisation study; PubMed-verified. Its acrosome-reaction-dependent exposure
      result is what makes the primary-versus-secondary binding reconciliation between PMID:10775167 and PMID:8882296
      coherent. Cached copy is abstract-only but the abstract carries the localisation conclusions directly.
- id: PMID:1591355
  title: Interactions of human sperm acrosomal protein SP-10 with the acrosomal membranes.
  findings:
  - statement: Both the detergent-released and detergent-resistant SP-10 pools are hydrophilic, so SP-10 is peripheral
      to rather than integral in the acrosomal membranes.
    supporting_text: Phase partitioning of TX-114-released and TX-114-resistant SP-10 pools showed that both were
      hydrophilic, indicating that these pools consist of proteins that are peripherally associated with, rather
      than integral to, the acrosomal membranes.
    full_text_unavailable: true
  - statement: The detergent-resistant pool localises to the acrosomal matrix, inner acrosomal membrane and equatorial
      segment.
    supporting_text: TX-114-resistant SP-10 was associated with the equatorial segment and with TX-114-resistant
      portions of the acrosomal matrix and the inner acrosomal membrane.
    full_text_unavailable: true
  - statement: That pool is released by chaotropic salt or pH extremes but not by repeated detergent or 1.5 M NaCl,
      implying an uncharacterised matrix anchor.
    supporting_text: Together the results suggest that SP-10 is a hydrophilic peripheral acrosomal membrane protein
      that may be associated with a TX-114-resistant "anchor."
    full_text_unavailable: true
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct biochemical partitioning of native human sperm SP-10; PubMed-verified. Basis for the proposed
      GO:0043159 acrosomal matrix annotation and for the topology argument against the cytosolic two-hybrid partners.
- id: PMID:7888499
  title: 'Human SP-10: acrosomal distribution, processing, and fate after the acrosome reaction.'
  findings:
  - statement: Immunogold EM concentrates SP-10 in the principal segment and posterior bulb of the equatorial segment
      of the human sperm acrosome.
    supporting_text: Electron microscopic immunocytochemical observations of epididymal, ejaculated, and capacitated
      sperm revealed that colloidal gold labeling of SP-10 was most abundant within the principal segment and posterior
      bulb of the equatorial segment of the acrosome
    full_text_unavailable: true
  - statement: After a follicular-fluid-induced acrosome reaction SP-10 is on the inner acrosomal membrane of the
      equatorial segment and on hybrid vesicles.
    supporting_text: After a follicular fluid-induced acrosome reaction, SP-10 was detected on the inner acrosomal
      membrane in the equatorial segment and was associated with hybrid vesicles.
    full_text_unavailable: true
  - statement: Processing is complete before ejaculation - no further cleavage occurs during epididymal transit,
      ejaculation or capacitation.
    supporting_text: no additional SP-10 bands were detected in extracts of cauda epididymal, ejaculated, or capacitated
      sperm, suggesting that no further processing of the 32-18-kDa SP-10 peptides occurred during epididymal transit,
      ejaculation, and capacitation.
    full_text_unavailable: true
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified. Note that this paper's own closing hypothesis favours sperm-zona binding or penetration,
      which the later human hemizona result (PMID:10775167) does not support for primary binding; the localisation
      data it reports are unaffected by that and are what is cited here.
- id: PMID:10775167
  title: A monoclonal antibody to human SP-10 inhibits in vitro the binding of human sperm to hamster oolemma but
    not to human Zona pellucida.
  findings:
  - statement: A monoclonal antibody against SP-10 residues 135-149 blocked human sperm binding to zona-free hamster
      oolemma but not sperm-zona binding in the hemizona assay.
    supporting_text: Monoclonal Ab pep-SP10 inhibited sperm-oolemma binding in the zona-free hamster egg penetration
      test, but it did not inhibit sperm-zona binding in the hemizona assay.
    full_text_unavailable: true
  - statement: The authors conclude SP-10 on the equatorial region of acrosome-reacted sperm mediates sperm-oolemma
      binding independently of beta-1 integrins.
    supporting_text: human SP-10, expressed on the equatorial region of acrosome-reacted sperm, indeed mediates
      sperm-oolemma binding in a beta(1) integrin-independent manner, but not sperm-zona binding
    full_text_unavailable: true
  - statement: Beta-1 integrins were positively excluded as the oolemmal ligand using F9 cells and beta-1-null derivatives,
      leaving the ligand unidentified.
    supporting_text: we demonstrated that the oolemmal ligands of human SP-10 did not include beta(1) integrins,
      the most promising candidates for oocyte ligands involved in sperm-oolemma binding
    full_text_unavailable: true
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified; the only paper providing a functional handle on human SP-10 and the basis for
      the proposed GO:0007342 annotation. Caveats stated in the annotation rather than hidden - heterologous hamster
      oolemma, antibody inhibition rather than direct binding, and a fertile mouse knockout. Assay is on native
      protein on human sperm, which is why IDA rather than IMP is proposed.
- id: PMID:8882296
  title: Inhibition of bovine fertilization in vitro by antibodies to SP-10.
  findings:
  - statement: Anti-human-SP-10 monoclonal and polyclonal antibodies reduced bovine in vitro fertilisation rates.
    supporting_text: Fertilization experiments in vitro demonstrated that monoclonal antibodies, as well as polyclonal
      antibodies, to human SP-10 significantly reduced fertilization rates of bovine oocytes by bovine spermatozoa.
    full_text_unavailable: true
  - statement: The effect was on sperm-zona secondary binding, i.e. the post-acrosome-reaction step, not primary
      binding.
    supporting_text: SP-10 antibodies exerted their anti-fertilization effect by reducing sperm-zona secondary binding.
    full_text_unavailable: true
  - statement: The antibodies also reduced completion of the acrosome reaction by capacitated sperm, a result not
      annotated here.
    supporting_text: Consistent with the accessibility of the SP-10 antigen following capacitation, SP-10 antibodies
      also reduced the ability of capacitated spermatozoa to complete the acrosome reaction.
    full_text_unavailable: true
  - statement: They also reduced the motility of capacitated but not noncapacitated sperm, which confounds the acrosome-reaction
      result.
    supporting_text: Furthermore, SP-10 antibodies affected the motility of capacitated spermatozoa, while not affecting
      the motility of noncapacitated spermatozoa.
    full_text_unavailable: true
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: 'PubMed-verified. Reads as contradicting PMID:10775167 on sperm-zona binding but does not: the
      hemizona assay scores primary binding by acrosome-intact sperm whereas this paper reports secondary (post-acrosome-reaction)
      binding, and SP-10 is inaccessible before the acrosome reaction. Recorded here so the apparent conflict is
      not mistaken for a citation error. Bovine rather than human, hence MEDIUM.'
- id: PMID:38697008
  title: Individual disruption of 12 testis-enriched genes via the CRISPR/Cas9 system does not affect the fertility
    of male mice.
  findings:
  - statement: Acrv1 is one of twelve testis-enriched genes individually disrupted by CRISPR/Cas9 in mouse.
    supporting_text: In this study, 12 genes of interest were found to be dispensable for male mouse reproduction,
      at least individually, by generating KO mice with the CRIPR/Cas9 system.
  - statement: Testis appearance, testis histology and sperm motility were examined for every one of the twelve
      knockouts, Acrv1 included.
    supporting_text: we generated knockout mice for 12 genes (Acrv1, Adgrf3, Atp8b5, Cfap90, Cfap276, Fbxw5, Gm17266,
      Lrrd1, Mroh7, Nemp1, Spata45, and Trim36) that are expressed predominantly in the testis and examined the
      appearance and histological morphology of testes, sperm motility, and male fertility.
  - statement: Litter sizes sired by knockout males were indistinguishable from wild type.
    supporting_text: We found that the average number of pups sired by each KO male was 7 to 10 pups per litter
      during the mating period, comparable to the WT control (about 9 pups per litter), suggesting that there was
      no significant difference between the fecundity of KO and WT males.
  - statement: Immunising male rodents against SP-10 does not arrest spermiogenesis.
    supporting_text: Furthermore, the immunization with anti-human SP-10 antibody in male rodents did not induce
      the arrest of spermiogenesis (Sehgal et al., 1996).
  - statement: SP-10 is described as abundant in the acrosomal matrix and inner acrosomal membrane across mammals.
    supporting_text: Acrv1 is an evolutionarily conserved gene encoding the sperm protein SP-10, which abundantly
      exists in the acrosomal matrix and the inner acrosomal membrane in mammals (Reddi, 2023).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text available and read. This is the decisive evidence against ACRV1 involved_in spermatogenesis
      and the reason the proposed fertilisation annotation is framed as participation rather than requirement. Note
      the limitation the authors state themselves - dispensable at least individually - so redundancy is not excluded.
- id: PMID:1693291
  title: Cloning and sequencing of cDNAs coding for the human intra-acrosomal antigen SP-10.
  findings:
  - statement: SP-10 is a 265-residue protein with a hydrophobic N-terminal signal peptide and three amino-acid
      repeat types occurring 16 times in the central third.
    supporting_text: Sequence data showed that three different amino acid repeats occurred a total of 16 times in
      the central third of the SP-10 protein.
    full_text_unavailable: true
  - statement: In 1990 no sequence homologue could be found, which is the claim later domain databases superseded.
    supporting_text: SP-10 cDNA sequences did not show any significant homology to other sequences found in the
      Genbank, National Biomedical Research Foundation, or Swiss sequence banks.
    full_text_unavailable: true
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified and correctly cited for the sequence architecture. Its unique-protein, no-significant-homology
      conclusion was correct for 1990 databases but is now superseded - the C-terminal third is a Ly-6/uPAR three-finger
      domain (InterPro IPR016054, Pfam PF00021, CDD cd23628). Recorded because that stale conclusion is still repeated
      in secondary sources, including the affinage record for this gene.
- id: PMID:7619499
  title: Characterization of alternatively spliced human SP-10 mRNAs.
  findings:
  - statement: Eleven authentic alternatively spliced SP-10 mRNAs encode proteins of 81-265 residues, all from in-frame
      deletions in exons 2 and/or 3.
    supporting_text: The 11 alternatively spliced SP-10 mRNAs encoded proteins ranging from 81 to 265 amino acids.
    full_text_unavailable: true
  - statement: The four largest mRNAs make up over 99% of testis SP-10 message.
    supporting_text: Quantitative competitive RTPCR showed that the four largest SP-10 mRNAs represented the majority
      (> 99%) of the SP-10 message in testes from each of four men.
    full_text_unavailable: true
  - statement: The full-length 265-residue isoform is consistently the most abundant single form.
    supporting_text: the longest SP-10 mRNA, SP10-1, which encoded a 265 amino acid protein, was consistently the
      most abundant, comprising 53-72% of the total SP-10 message
    full_text_unavailable: true
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified; source of the isoform abundances used as input to the isoform-versus-domain mapping
      in the bioinformatics analysis. Explains, together with proteolysis, the heterogeneous SP-10 banding pattern,
      and shows the abundant isoforms differ only in the disordered spacer.
- id: PMID:1637938
  title: Purification and microsequencing of the intra-acrosomal protein SP-10. Evidence that SP-10 heterogeneity
    results from endoproteolytic processes.
  findings:
  - statement: N-terminal sequencing of eight purified SP-10 peptides implies endoproteolysis at five distinct bonds,
      including a trypsin-like cut possibly by acrosin.
    supporting_text: endoproteases that act at five different peptide bonds are predicted to cleave SP-10
    full_text_unavailable: true
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified. Also the source of the direct protein sequencing recorded in UniProt (residues
      78-100, 106-122, 127-151), which is why this gene's PE 1 status reflects real protein-level detection.
- id: PMID:1591350
  title: Molecular and developmental studies of a sperm acrosome antigen recognized by HS-63 monoclonal antibody.
  findings: []
  full_text_unavailable: true
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: One of the two references behind the mouse orthologue's IDA annotations to GO:0001669 acrosomal
      vesicle, established by QuickGO query on UniProtKB:P50289. Cited here only to document what the IBA WITH/FROM
