- term:
    id: GO:0043159
    label: acrosomal matrix
  evidence_type: IDA
  original_reference_id: PMID:1591355
  qualifier: located_in
  review:
    summary: 'Proposed as a new annotation, to record the sub-acrosomal localisation that the existing acrosomal
      vesicle terms cannot express.


      Two independent human experiments support it. Triton X-114 phase partitioning of human sperm resolves a detergent-resistant
      SP-10 pool associated with the acrosomal matrix and the inner acrosomal membrane, and shows both pools to
      be hydrophilic - so SP-10 is peripheral to, not integral in, the acrosomal membranes; that resistant pool
      is released by 150 mM sodium thiocyanate or by pH extremes but not by repeated detergent or 1.5 M NaCl, the
      classic signature of a matrix-associated protein. Independently, electron-microscopic immunocytochemistry
      places SP-10 in a bilaminar array against the inner face of the outer acrosomal membrane and the outer face
      of the inner acrosomal membrane, which is the matrix compartment.


      GO:0043159 acrosomal matrix is defined as the structural framework or dense core at the interior of an acrosome,
      which is exactly this. Proposed rather than substituted for the existing GO:0001669 rows, since those are
      separately sourced and correct.'
    action: NEW
    reason: Detergent-resistant, chaotrope-releasable, hydrophilic partitioning of native human sperm SP-10 plus
      EM immunolocalisation to a bilaminar array between the two acrosomal membranes identify the acrosomal matrix
      specifically, a term absent from the current record.
    additional_reference_ids:
