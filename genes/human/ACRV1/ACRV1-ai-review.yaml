    acrosome reaction SP-10 is retained on the sperm head, concentrated on the inner acrosomal membrane of the equatorial
    segment, where it becomes accessible; antibody inhibition of the native protein blocks human sperm binding to
    zona-free oolemma without affecting primary sperm-zona binding, and in a second species reduces post-acrosome-reaction
