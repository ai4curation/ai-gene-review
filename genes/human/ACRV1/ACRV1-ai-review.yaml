  review:
    summary: 'Over-annotated, on the same grounds as the other four rows from this screen.


      Partner Q7Z699 is SPRED1, a Sprouty-related EVH1-domain protein that suppresses growth-factor-driven MAP kinase
      signalling and localises to the cell membrane, caveolae and nucleus. SPRED1 loss causes Legius syndrome; it
      has no reported role in spermatogenesis or fertilisation, and no SP-10 paper mentions RAS/MAPK signalling.
      As a membrane-associated cytoplasmic adaptor it is also on the wrong side of the acrosomal membrane from SP-10.


      IntAct records this pair only from PMID:32814053, again under the three two-hybrid method labels with both
      partners over-expressed, MI-score 0.56. No co-immunoprecipitation, no co-localisation, no reciprocal pulldown.


      This is the pattern the curation guidelines warn about: bare protein binding tells us nothing about activity,
      and there is no informative term to modify it to, because the interaction itself is unsupported beyond one
      screen. Marked over-annotated.'
    action: MARK_AS_OVER_ANNOTATED
    reason: Single-screen Y2H hit with a cytoplasmic MAPK-pathway suppressor; no orthogonal evidence, no functional
      or tissue overlap with an intra-acrosomal spermatid protein.
