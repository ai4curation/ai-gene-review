- term:
    id: GO:0001669
    label: acrosomal vesicle
  evidence_type: IDA
  original_reference_id: GO_REF:0000052
  qualifier: located_in
  review:
    summary: 'Accepted, and this is the best-supported annotation on the gene.


      GO_REF:0000052 records Human Protein Atlas immunofluorescence curation. The call is independently corroborated
      by three decades of human sperm work: immunocytochemistry on human testis sections localised SP-10 to round
      spermatids and spermatozoa in the adluminal compartment and, by light and electron microscopy, throughout
      the acrosome; immunogold EM on epididymal, ejaculated and capacitated human sperm concentrated the label in
      the equatorial segment; and after the acrosome reaction the protein remains on the inner acrosomal membrane.
      The mouse orthologue carries two independent IDA annotations to the same term.


      Kept as core. Given how sparse the rest of the record is, this compartment assignment plus the acrosome-reaction-dependent
      redistribution is essentially what is known about ACRV1 with confidence, and the finer terms it licenses (acrosomal
      matrix, inner acrosomal membrane) are proposed additively rather than as replacements.'
    action: ACCEPT
    reason: Immunofluorescence localisation confirmed by independent light- and electron-microscopic immunocytochemistry
      on human testis and sperm, and by two IDA annotations on the mouse orthologue.
    supported_by:
