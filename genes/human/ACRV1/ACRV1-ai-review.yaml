  review:
    summary: 'Over-annotated, and this row has an additional defect worth recording: the partner accession is not
      the canonical protein it is labelled with.


      Q86WV8 is an unreviewed TrEMBL entry of 366 residues, submitted from cDNA clone AAH47772 under the name "Tuberous
      sclerosis 1". Canonical human TSC1 is Q92574, 1164 residues. So the interaction is with a partial ORFeome
      clone covering less than a third of TSC1, and the IntAct alias field records it as clone CCSB_14153 - a Center
