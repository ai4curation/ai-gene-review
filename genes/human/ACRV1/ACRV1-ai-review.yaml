- term:
    id: GO:0002079
    label: inner acrosomal membrane
  evidence_type: IDA
  original_reference_id: PMID:7888499
  qualifier: located_in
  review:
    summary: 'Proposed as a new annotation. The existing acrosomal vesicle terms cannot express which acrosomal
      membrane SP-10 sits on, and that detail is the whole basis of the proposed fertilisation role.


      Three human observations converge. Immunogold electron microscopy on acrosome-reacted sperm detects SP-10
      on the inner acrosomal membrane of the equatorial segment; ionophore-induced acrosome reaction leaves it displayed
      on the sperm head in association with the inner acrosomal membrane and equatorial segment; and in intact sperm
      the detergent-resistant pool is associated with the acrosomal matrix and the inner acrosomal membrane. GO:0002079
      is defined as the acrosomal membrane region underlying the acrosomal vesicle and facing the sperm nucleus,
      which is the region responsible for the interactions that let sperm reach and fuse with the egg plasma membrane
      - exactly the location the antibody-blocking result implicates.


      SP-10 is peripherally associated rather than integral, which is compatible with located_in for a membrane-associated
      protein and is stated explicitly in the acrosomal matrix annotation alongside this one.'
    action: NEW
    reason: Two independent electron-microscopic immunocytochemical studies of human sperm place SP-10 on the inner
      acrosomal membrane after the acrosome reaction, and the detergent-resistant pool is associated with that membrane
      in intact sperm; the compartment is currently annotated only at the level of the whole acrosomal vesicle.
