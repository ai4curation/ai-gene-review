- id: PMID:16093322
  title: RNF17, a component of the mammalian germ cell nuage, is essential for spermiogenesis.
  findings: []
  full_text_unavailable: true
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: The second reference behind the mouse orthologue's IDA annotation to GO:0001669, per QuickGO on
      UniProtKB:P50289. The paper's subject is RNF17; SP-10 appears as an acrosomal marker, which is a normal basis
      for a localisation annotation. Cited only to document the donor's evidence.
- id: PMID:41338461
  title: ZNF280A and ACRV1 enhance aerobic glycolysis and drive ovarian cancer progression via the PI3K/AKT signaling
    pathway.
  findings:
  - statement: ZNF280A drives ACRV1 transcription in ovarian cancer cells by recruiting CUX2 to the ACRV1 promoter.
    supporting_text: Mechanistically, ZNF280A enhanced ACRV1 transcription by interacting with the transcription
      factor CUX2, thereby facilitating its recruitment to the ACRV1 promoter.
  - statement: Raised ACRV1 in these cells activates PI3K/AKT signalling and glycolysis.
    supporting_text: Elevated ZNF280A or ACRV1 expression activated PI3K/AKT signaling and increased glycolytic
      enzyme expression (PKM2 and LDHA), glucose uptake, lactate production, ATP generation, and extracellular acidification
      rate
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: 'Full text available and read; the only loss- and gain-of-function work on human ACRV1 that exists.
      Deliberately not annotated: ACRV1 is testis-restricted, and these are ovarian cancer lines aberrantly expressing
      it, so the phenotype describes a consequence of ectopic expression rather than a normal function. Raised as
      a question for the Consortium instead.'
- id: file:human/ACRV1/ACRV1-bioinformatics/RESULTS.md
  title: 'ACRV1 (SP-10): what the LU domain, the splice isoforms and the family do and do not license'
  findings:
  - statement: The C-terminal third of ACRV1 is a canonical Ly-6/uPAR three-finger domain with ten cysteines, the
      modal count across the human LU family, and every cysteine in the protein lies inside it.
    supporting_text: The domain carries **10 cysteines** at 190, 193, 202, 209, 217, 235, 239, 255, 256, 262
  - statement: All splice isoforms with a measured abundance keep the LU domain complete; only the rare isoforms
      8 and 11 truncate it, so splicing varies the disordered spacer rather than the folded module.
    supporting_text: 'All isoforms with a measured abundance retain the complete LU domain: **True**.'
  - statement: ACRV1 is one of eleven of thirty reviewed human LU-domain proteins without a GPI anchor, matching
      its experimentally determined peripheral, chaotrope-releasable behaviour.
    supporting_text: ACRV1 is one of the few human LU-domain proteins with no GPI anchor
  - statement: ACRV1 shares no subfamily-resolution signature with any other reviewed human LU-domain protein, so
      no paralogue-based inference is available to it.
    supporting_text: '**No other reviewed human LU-domain protein shares either model**, so ACRV1 is a subfamily
      singleton in the human proteome.'
  - statement: ACRV1's only experimental molecular-function annotation is bare protein binding, and the family's
      most widely shared function (acetylcholine receptor modulation, 7/30 members) sits in GPI-anchored or secreted
      surface members that ACRV1 does not resemble.
    supporting_text: 'ACRV1''s own experimental molecular-function annotations are GO:0005515, of which informative:
      **none**.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Own analysis. Computed from a committed snapshot of UniProt, InterPro and QuickGO in data/, so
      analyze.py touches no network and a fresh run reproduces RESULTS.md byte-for-byte (verified with diff). Its
      purpose is to make the no-justifiable-molecular-function claim testable rather than asserted; it deliberately
      reports the complication that PATE1 and PATE4, ACRV1's nearest structural neighbours by CDD naming, do carry
      acetylcholine receptor regulator activity.
- id: file:human/ACRV1/ACRV1-uniprot.txt
  title: UniProtKB P26436 (ASPX_HUMAN) flat-file record
  findings: []
