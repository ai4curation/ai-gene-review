  review:
    summary: 'Accepted. This is the keyword pipeline working exactly as intended.


      GO_REF:0000044 maps UniProt subcellular-location vocabulary terms to GO, and here it maps SL-0007 (acrosome)
      from the UniProt line "Cytoplasmic vesicle, secretory vesicle, acrosome". The mapping is faithful and the
      underlying UniProt statement is itself well founded: SP-10 has been localised to the acrosome of human spermatids
