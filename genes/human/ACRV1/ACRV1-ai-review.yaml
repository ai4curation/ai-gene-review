- term:
    id: GO:0007342
    label: fusion of sperm to egg plasma membrane involved in single fertilization
  evidence_type: IMP
  original_reference_id: PMID:10775167
  qualifier: involved_in
  review:
    summary: 'Proposed as a new annotation. This is the only functional role ever demonstrated for SP-10, and GOA
      currently carries no fertilisation term for ACRV1 at all.


      A monoclonal antibody raised against human SP-10 residues 135-149 inhibited binding of human sperm to zona-free
      hamster oolemma in the sperm penetration assay, while the same antibody did not inhibit sperm-zona binding
      in the hemizona assay; the authors further excluded beta-1 integrins as the oolemmal ligand using F9 cells
      and beta-1-null derivatives. The evidence code is IMP: a function-blocking antibody is a specific inhibitor,
      and the inference runs from a perturbation phenotype (block the protein, watch binding fall) rather than from
      direct observation of the protein doing anything, which is what IDA requires. GO:0007342 is defined as the
      binding and fusion of a sperm with the plasma membrane of the oocyte as part of single fertilization, and
      explicitly covers the binding step, which is what was measured; the localisation fits, since SP-10 becomes
      displayed on the equatorial segment after the acrosome reaction and the equatorial segment is where oolemma
      fusion begins.


      An apparent conflict resolves in favour of the annotation. Anti-SP-10 antibodies reduced bovine in vitro fertilisation
      by reducing sperm-zona SECONDARY binding, which reads as contradicting the negative hemizona result. It does
      not: the hemizona assay scores primary binding by acrosome-intact sperm, whereas secondary binding is attachment
      of the inner acrosomal membrane after the acrosome reaction. SP-10 is inaccessible on acrosome-intact sperm,
      so a role confined to post-acrosome-reaction steps is consistent with both papers, and the shared conclusion
      across two species is that SP-10 contributes after the acrosome reaction.


      One further result in the bovine paper is deliberately not annotated. The same antibodies reduced the ability
      of capacitated spermatozoa to complete the acrosome reaction, which would suggest GO:0007340 acrosome reaction.
      Three things argue against taking it: the antibodies are anti-human reagents used on bovine sperm, the same
      abstract reports that they also reduced the motility of capacitated spermatozoa, so a general effect on capacitated
      cells is not excluded as the cause, and SP-10 becoming accessible only after the acrosome reaction makes a
      role in triggering that reaction hard to place mechanistically. The sperm-oolemma result does not share the
      second problem, because it was obtained on human sperm with a defined-epitope monoclonal in an assay that
      scores binding rather than progression.


      The caveat that must travel with this annotation: Acrv1-null male mice are fertile, so the contribution is
      dispensable, at least when no other acrosomal gene is disrupted. GO annotates participation rather than requirement,
      so a fertile knockout does not veto the term, but a curator preferring maximum caution could annotate the
      parent GO:0007338 single fertilization instead, or hold the annotation pending a direct SP-10-oolemma binding
      assay. The heterologous hamster oolemma is a second, milder caveat.'
    action: NEW
    reason: Antibody inhibition of native human SP-10 blocks sperm-oolemma binding but not sperm-zona binding, with
      the protein displayed on the equatorial segment of acrosome-reacted sperm; corroborated in a second species
      by reduced sperm-zona secondary binding and impaired acrosome reaction. No fertilisation term is currently
      annotated to ACRV1.
