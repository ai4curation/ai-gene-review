      full_text_unavailable: true
- term:
    id: GO:0007283
    label: spermatogenesis
  evidence_type: NAS
  original_reference_id: PMID:21252238
  qualifier: involved_in
  review:
    summary: 'Over-annotated. The gene is regulated during spermatogenesis; it has not been shown to participate
      in it, and the mouse knockout argues that it does not.


      Read the cited paper and the direction of the relationship inverts. PMID:21252238 is a study of TDP-43, which
      represses the mouse acrv1 promoter through GTGTGT motifs and is associated with paused RNA polymerase II there
      in spermatocytes; its conclusion is about TDP-43 regulating acrv1, and it contains no assay of ACRV1 protein
      function at all. acrv1 is the transcriptional target. The defensible content of that paper for this gene is
      a statement about expression timing - round-spermatid-specific transcription - which is not a biological-process
      annotation. NAS is also the weakest available evidence code, so nothing here rests on a curator having read
      data we cannot see.


      The independent evidence points the same way. CRISPR knockout of mouse Acrv1 leaves males fertile, with litter
      sizes indistinguishable from wild type; testis appearance, testis histology and sperm motility were examined
      for all twelve knockouts in that study and only Gm17266, not Acrv1, showed an abnormality. The same report
      notes that immunising male rodents against SP-10 did not arrest spermiogenesis. A protein whose loss perturbs
      neither the process nor its output is a poor candidate for involved_in that process.


      Why stop at MARK_AS_OVER_ANNOTATED when the citation is wrong and the null is fertile? Because the two objections
      attack the evidence, not the proposition. SP-10 is a spermatid-specific product and a constituent of the acrosome,
      an organelle assembled during spermiogenesis, so a curator with an assembly assay could plausibly earn this
      term; and a fertile knockout demonstrates dispensability, which is not the same as non-participation. What
      is established is that the term rests on nothing at present. MARK_AS_OVER_ANNOTATED says exactly that and
      leaves the term available to better evidence, whereas REMOVE would assert the stronger claim that ACRV1 takes
      no part in building the acrosome, which no experiment has tested. The sole documented function of ACRV1 is
      at fertilisation, after spermatogenesis is over, and that role is proposed additively below rather than substituted
      here, since it is a different process and not a different level of the same one.'
    action: MARK_AS_OVER_ANNOTATED
    reason: The cited reference studies TDP-43 repressing the mouse acrv1 promoter and assays no ACRV1 protein function,
      so the annotation is an expression-timing statement recast as process participation; Acrv1-null male mice
      are fertile and anti-SP-10 immunisation does not arrest spermiogenesis.
