- term:
    id: GO:0140664
    label: ATP-dependent DNA damage sensor activity
  evidence_type: IMP
  original_reference_id: PMID:16717288
  qualifier: enables
  review:
    summary: >-
      ATP-dependent DNA damage sensor activity (IMP): Walker A/B mutants of human RAD51D tested for complementation
      of rad51d CHO cells.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The paper (full text) shows that the Walker B motif, but not the Walker A ATP-binding lysine, is
      needed for RAD51D's interactions with XRCC2 and RAD51C and for mitomycin C resistance. It does not
      test damage recognition or a signalling response, and the dispensability of motif A argues against
      an ATP-driven sensor activity. The authors propose bipartite ATPase sites formed with partner paralogs,
      which later structures confirmed, with RAD51D itself non-catalytic. The data support RAD51D's role
      in HR (captured by GO:0000724 and the NEW ICL-repair row) but not this molecular function.
    supported_by:
    - reference_id: PMID:16717288
      supporting_text: >-
        a functional Walker B motif, but not A motif, is necessary for RAD51D's interactions with other
        paralogs and for efficient HRR
    - reference_id: PMID:16717288
      supporting_text: >-
        We present a model in which ATPase sites are formed in a bipartite manner between RAD51D and other
        RAD51 paralogs
- term:
    id: GO:0031297
    label: replication fork processing
  evidence_type: IMP
  original_reference_id: PMID:32669601
  review:
    summary: >-
      RAD51D is required for active slowing and reversal of stressed replication forks (siRNA and knockout
      in U2OS cells).
    action: NEW
    reason: >-
      Fork remodelling is a distinct, well-documented role of BCDX2 that is not captured by any existing
      RAD51D annotation. RAD51D is one of the paralogs tested most directly. The trigger review also assigns
      DX2 to stabilising FBH1-remodelled forks and to ATR-dependent control of fork progression. Purified
      BCDX2 has no fork-reversal activity itself, so the broader GO:0031297 is used rather than GO:0071932
      replication fork reversal. BCDX2 participates by building and stabilising the RAD51 filament that
      remodels and protects the fork. Comparator: RAD51C carries GO:0031297 by IDA.
    additional_reference_ids:
    - PMID:37843130
    - PMID:42682019
    supported_by:
