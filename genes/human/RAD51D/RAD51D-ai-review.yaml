- term:
    id: GO:0036297
    label: interstrand cross-link repair
  evidence_type: IMP
  original_reference_id: PMID:16717288
  review:
    summary: >-
      Human RAD51D complements the mitomycin C (interstrand crosslink) hypersensitivity of rad51d-knockout
      CHO cells, and Walker B mutants do not.
    action: NEW
    reason: >-
      Repair of interstrand crosslinks by homologous recombination is a well-evidenced RAD51D function,
      shown by complementation in hamster and mouse rad51d-deficient cells. The two complementation studies
      disagree on whether the Walker A lysine is required (dispensable in hamster CHO cells, PMID:16717288;
      required in mouse MEFs, PMID:16236763; the conflict is recorded on the PMID:16236763 reference),
      but both show that RAD51D itself is needed for ICL repair, which is all this term asserts. Within the ICL pathway, RAD51D
      performs the RAD51-loading step of the HR stage, so it participates in the process. The same NEW
      term is added in the sibling RAD51C and XRCC2 reviews.
    additional_reference_ids:
    - PMID:16236763
    supported_by:
    - reference_id: PMID:16717288
      supporting_text: Although A-motif mutants complement very efficiently, B-motif mutants do not
    - reference_id: PMID:16236763
      supporting_text: >-
        The K113R and K113A mutants demonstrated a respective 96 and 83% decrease in repair capacity
        relative to wild-type
