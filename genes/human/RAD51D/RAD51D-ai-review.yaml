core_functions:
- description: >-
    As a subunit of BCDX2, RAD51D forms the DX2 half with XRCC2. RAD51C-RAD51D-XRCC2 mimics a short RAD51
    filament, and the complex binds ssDNA through the N-terminal domains and stimulates nucleation and
    extension of RAD51 filaments on RPA-coated ssDNA. This happens downstream of BRCA2 and upstream of
    RAD51 loading, in homologous recombination repair of DNA double-strand breaks and interstrand crosslinks.
    RAD51D binds but does not hydrolyse ATP, and may regulate the RAD51B-RAD51C ATPase.
  supported_by:
  - reference_id: PMID:37344587
    supporting_text: >-
      RAD51C-RAD51D-XRCC2 mimics three RAD51 protomers aligned within a nucleoprotein filament, whereas
      RAD51B is highly dynamic
  - reference_id: PMID:37344587
    supporting_text: BCDX2 stimulates the nucleation and extension of RAD51
  - reference_id: PMID:37344589
    supporting_text: >-
      The structures reveal how the amino-terminal domains of RAD51B, RAD51C and RAD51D participate in
      inter-subunit interactions that underpin complex formation and ssDNA-binding specificity
  - reference_id: PMID:23149936
    supporting_text: the BCDX2 complex acts downstream of BRCA2 recruitment but upstream of Rad51 recruitment
  - reference_id: PMID:41542474
    supporting_text: >-
      we identify the RAD51D-RAD51C interface within the BCDX2 complex as essential for regulating its
      ATPase activity
