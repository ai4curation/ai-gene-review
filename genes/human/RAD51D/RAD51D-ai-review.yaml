    label: Rad51B-Rad51C-Rad51D-XRCC2 complex
- description: >-
    The RAD51D-XRCC2 subcomplex also joins RAD51C-XRCC3 to form X3CDX2. It remodels an autoinhibited RAD51-XRCC3-RAD51C
    assembly, and the resulting complex caps the 5' ends of RAD51 filaments, stabilising them and promoting
    homologous pairing and strand exchange. The isolated XRCC2-RAD51D complex can itself catalyse homologous
    pairing in vitro.
    No molecular function is asserted for this role. XRCC3 is the subunit that contacts RAD51,
    and RAD51-XRCC3-RAD51C stimulates strand exchange without RAD51D-XRCC2, so DNA strand
    exchange activator activity (GO:0140619, contributes_to) is assigned to XRCC3 only. X3CDX2
    stimulates strand invasion more strongly than CX3, so RAD51D-XRCC2 may add to the activity,
    but no assay separates its own contribution.
  supported_by:
  - reference_id: PMID:41196948
    supporting_text: >-
      the XRCC3 complex stably caps the 5' termini of RAD51 filaments to promote homologous pairing
  - reference_id: PMID:42020761
    supporting_text: >-
      the RAD51D-XRCC2 paralog complex remodels RAD51-X3C into a pentameric RAD51-X3CDX2 assembly
  - reference_id: PMID:11834724
    supporting_text: complex catalyzed homologous pairing between single-stranded and double-stranded
      DNA
  - reference_id: PMID:42020761
    supporting_text: RAD51–X3C displayed significantly enhanced DNA strand exchange activity over RAD51
      alone across the protein concentrations tested
