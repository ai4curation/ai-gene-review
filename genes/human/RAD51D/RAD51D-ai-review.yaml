- term:
    id: GO:0000722
    label: telomere maintenance via recombination
  evidence_type: IMP
  original_reference_id: PMID:15109494
  qualifier: involved_in
  review:
    summary: Telomere maintenance via recombination (IMP).
    action: KEEP_AS_NON_CORE
    reason: >-
      In telomerase-negative human cells, which maintain telomeres by recombination, RAD51D knockdown
      caused telomere erosion and fusions. This supports a recombination-based telomere role. Kept as
      non-core.
    supported_by: &id002
    - &id005
      reference_id: PMID:15109494
      supporting_text: RAD51D was shown to localize to the telomeres of both meiotic and somatic cells
    - reference_id: PMID:15109494
      supporting_text: >-
        Inhibition of RAD51D synthesis in telomerase-negative immortalized human cells by siRNA also resulted
        in telomere erosion and chromosome fusion
- term:
