- id: PMID:16236763
  title: >-
    The ATPase motif in RAD51D is required for resistance to DNA interstrand crosslinking agents and interaction
    with RAD51C.
  findings:
  - statement: >-
      Walker A K113R and K113A mutations of mouse Rad51d strongly reduce ICL repair capacity in Rad51d-deficient
      MEFs, interpreted as showing that ATP binding and hydrolysis by RAD51D are required for ICL repair.
    supporting_text: >-
      These cell-based studies are the first evidence that ATP binding and hydrolysis by RAD51D are required
      for efficient HR repair of DNA interstrand crosslinks
    finding_review:
      finding_status: DISPUTED
      superseded_by:
      - PMID:16717288
      - PMID:37344587
      - PMID:41196948
      review_notes: >-
        The requirement for RAD51D in ICL repair is not in question. The Walker A requirement is contested:
        human RAD51D Walker A mutants complement hamster rad51d CHO cells efficiently, and the authors of
        that study explicitly note the opposite conclusion of this mouse study. The hydrolysis part of the
        interpretation is contradicted by cryo-EM structures showing RAD51D lacks the catalytic glutamate
        and is ATP-bound but catalytically inactive. A Walker A defect may act through loss of nucleotide
        binding and RAD51C association rather than loss of hydrolysis.
      supported_by:
      - reference_id: PMID:16717288
        supporting_text: Although A-motif mutants complement very efficiently, B-motif mutants do not
      - reference_id: PMID:16717288
        supporting_text: >-
          in which only A-motif mutants were examined, reached the opposite conclusion
      - reference_id: PMID:37344587
        supporting_text: >-
          These glutamates are not conserved in RAD51D or XRCC2 explaining their inability to promote ATP
          hydrolysis while retaining nucleotide binding
      - reference_id: PMID:41196948
        supporting_text: >-
          RAD51D and XRCC2 were both bound to ATP, as observed in the RAD51B complex, but neither is catalytically
          active due to the absence of an otherwise conserved catalytic glutamate residue
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: >-
      Abstract checked. Supports a requirement for RAD51D in ICL repair in mouse cells. Its Walker A / ATP
      hydrolysis interpretation is contested by PMID:16717288 and by later structures (see finding_review).
