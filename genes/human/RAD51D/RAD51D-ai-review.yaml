suggested_questions:
- question: >-
    GO has a cellular component term for BCDX2 (GO:0033063) and for CX3 (GO:0033065), but none for the
    XRCC3-RAD51C-RAD51D-XRCC2 (X3CDX2) complex now shown structurally and biochemically to cap RAD51 filaments.
    Should a new complex term be created so that RAD51D's membership in both tetramers can be recorded?
- question: >-
    Does RAD51D's non-catalytic ATP binding regulate ATP hydrolysis by RAD51C across the RAD51C-RAD51D
    interface, as the deep mutational scan proposes? Can the earlier report of intrinsic DNA-stimulated
    ATPase activity in isolated RAD51D be reconciled with the structural data?
- question: >-
    Is the telomere-protection role of RAD51D a specialised function at t-loops or telomere replication
    forks, or a general consequence of HR deficiency at hard-to-replicate regions?
- question: >-
    Does the RAD51D-BLM interaction, which lets XRCC2-RAD51D stimulate BLM-mediated junction disruption
    in vitro, operate in cells during late HR or fork restart? Would it warrant a specific molecular-function
    annotation such as an activator of helicase activity?
suggested_experiments:
- description: >-
    Measure ATP turnover by reconstituted BCDX2 and X3CDX2 carrying RAD51D variants at the RAD51C interface
    or Walker motifs, together with RAD51 filament assembly and capping in single-molecule assays.
  hypothesis: >-
    RAD51D variants that accelerate the complex ATPase impair RAD51 filament assembly, consistent with
    RAD51D acting as a brake on RAD51C-driven ATP hydrolysis.
  experiment_type: biochemical reconstitution
- description: >-
    Separation-of-function RAD51D mutants that block X3CDX2 formation but preserve BCDX2 (or the reverse),
    tested for DR-GFP HR, fork reversal, fork restart and telomere stability in RAD51D-knockout cells.
  hypothesis: >-
    BCDX2 and X3CDX2 contribute separable RAD51D functions: early filament assembly and fork reversal
    versus filament capping and fork restart.
  experiment_type: genetic complementation
