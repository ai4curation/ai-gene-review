  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000534427
  - UniProtKB:O75771
  - WB:WBGene00004342
  review:
    summary: RAD51D functions in DSB repair via homologous recombination (IBA).
    action: ACCEPT
    reason: >-
      Central role. BCDX2 acts between BRCA2 and RAD51 recruitment, and the RAD51D-XRCC2 interaction is
      required for HR. Pathogenic RAD51D variants in the DNA-binding and ATP-binding core abolish HR.
