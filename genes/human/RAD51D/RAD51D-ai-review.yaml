- description: >-
    Within BCDX2, RAD51D binds replication-fork and Holliday-junction DNA. It is required for active fork
    slowing and RAD51-dependent fork reversal under replication stress, and BCDX2 works with RAD51 filaments
    to protect reversed forks from nucleolytic degradation.
  supported_by:
