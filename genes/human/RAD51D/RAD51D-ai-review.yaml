id: O75771
gene_symbol: RAD51D
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  RAD51D (RAD51L3, TRAD) is one of the five human RAD51 paralogs, RecA/RAD51-family proteins that act
  as accessory factors to the RAD51 recombinase in homologous recombination. RAD51D binds XRCC2 directly
  to form the DX2 subcomplex. DX2 is part of the heterotetrameric BCDX2 complex (RAD51B-RAD51C-RAD51D-XRCC2)
  and can also join RAD51C-XRCC3 to form the X3CDX2 complex. In BCDX2, RAD51C-RAD51D-XRCC2 forms a RAD51-filament-like
  arrangement, and the complex stimulates nucleation and extension of RAD51 filaments on RPA-coated single-stranded
  DNA, downstream of BRCA2 and upstream of RAD51 loading. X3CDX2 caps the 5' ends of RAD51 filaments and
  promotes homologous pairing. RAD51D binds ssDNA through its N-terminal domain and binds ATP through
  its Walker A motif. Unlike RAD51B and RAD51C it lacks the catalytic glutamate and is not an active ATPase
  within these complexes; it may instead regulate the ATPase of its partners. RAD51D is needed for homologous
  recombination repair of double-strand breaks and interstrand crosslinks, for slowing and reversing replication
  forks under stress, and for telomere maintenance, where it localises to telomeres and prevents telomere
  erosion and end-to-end fusions. The XRCC2-RAD51D subcomplex interacts with BLM and stimulates BLM-mediated
  disruption of Holliday junction-like structures in vitro. Rad51d loss is embryonic lethal in mice and
  causes chromosome instability. Germline loss-of-function variants in RAD51D predispose to ovarian cancer
  and confer PARP-inhibitor sensitivity.
