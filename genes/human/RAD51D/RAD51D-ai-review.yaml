  - UniProtKB:O75771
  review:
    summary: ATP-dependent activity, acting on DNA (IBA; PANTHER node seeded by human RAD51D itself).
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The IBA rests on the older report that isolated RAD51D is a DNA-stimulated ATPase. Two later cryo-EM
      studies of BCDX2 and X3CDX2 give target-specific evidence of divergence: RAD51D binds ATP but lacks
      the catalytic glutamate conserved in RAD51, RAD51B and RAD51C, so it is catalytically inactive in
      both complexes. A deep mutational scan suggests that RAD51D restrains, rather than provides, BCDX2
      ATPase activity. ATP-driven catalysis is the property of RAD51B and RAD51C in this complex. RAD51D's
      ATP binding is captured by GO:0005524.
    supported_by:
    - &id008
      reference_id: PMID:37344587
      supporting_text: >-
        These glutamates are not conserved in RAD51D or XRCC2 explaining their inability to promote ATP
        hydrolysis while retaining nucleotide binding
    - &id009
      reference_id: PMID:41196948
      supporting_text: >-
        RAD51D and XRCC2 were both bound to ATP, as observed in the RAD51B complex, but neither is catalytically
        active due to the absence of an otherwise conserved catalytic glutamate residue
    - reference_id: PMID:41542474
      supporting_text: the primary function of RAD51D is to slow the ATPase activity of BCDX2
