- term:
    id: GO:0008094
    label: ATP-dependent activity, acting on DNA
  evidence_type: IDA
  original_reference_id: PMID:10871607
  qualifier: enables
  review:
    summary: >-
      ATP-dependent activity, acting on DNA (IDA): purified RAD51D reported as a DNA-stimulated ATPase.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The original report (abstract only in cache) measured DNA-stimulated ATPase activity in purified
      RAD51D, which is experimental evidence. Later structural work shows RAD51D lacks the catalytic glutamate
      and is ATP-bound but catalytically inactive in BCDX2 and X3CDX2. The genetic data on the Walker A
      lysine conflict: human RAD51D K113 mutants complemented MMC sensitivity of hamster rad51d CHO cells
      efficiently (PMID:16717288), whereas mouse Rad51d K113R/K113A mutants lost most ICL-repair capacity
      in MEFs (PMID:16236763), which may reflect nucleotide binding (needed for RAD51C association) rather
      than hydrolysis. Neither study measures RAD51D catalysis directly. The activity measured in isolation
      may reflect low intrinsic or contaminating activity; the original data are not removed as wrong,
      but assigning a catalytic ATP-driven activity to RAD51D overstates its role, since within its physiological
      complexes ATP hydrolysis is carried out by RAD51B and RAD51C. Marked as over-annotated (consistent
      with the IBA row) and not used in the core functions.
    supported_by:
    - reference_id: PMID:10871607
      supporting_text: >-
        the purified RAD51L3 protein possesses single-stranded DNA binding activity and DNA-stimulated
        ATPase activity
    - *id008
    - *id009
