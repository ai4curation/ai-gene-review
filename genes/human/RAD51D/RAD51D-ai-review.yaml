        RAD51C and RAD51D downregulation by two independent siRNA sequences drastically impaired active
        fork slowing
    - reference_id: PMID:32669601
      supporting_text: >-
        we indeed confirmed that downregulation of RAD51C and RAD51D, but not of XRCC3, markedly impairs
        CPT-induced replication fork reversal
    - reference_id: PMID:37843130
      supporting_text: >-
