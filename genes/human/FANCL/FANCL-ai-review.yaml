id: Q9NW38
gene_symbol: FANCL
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: FANCL (PHF9) is the RING-type E3 ubiquitin ligase subunit of the nuclear Fanconi anemia repair complex. In partnership with the cognate E2 enzyme UBE2T, it promotes monoubiquitination of FANCD2 and FANCI, a central step in the response to DNA interstrand cross-links. FANCL contains an N-terminal E2-like fold (ELF), a central UBC–RWD region involved in substrate recognition, and a C-terminal RING zinc-binding domain that recruits UBE2T. FANCB and FAAP100 organize FANCL within the catalytic module of the larger core complex. Biallelic pathogenic FANCL variants cause Fanconi anemia complementation group L, with chromosome instability, bone-marrow failure and cancer predisposition.
