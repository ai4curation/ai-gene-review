core_functions:
- description: FANCL supplies the RING-type E3 activity of the nuclear Fanconi anemia core complex. Together with UBE2T, it promotes direct ubiquitin transfer from the charged E2 to FANCD2 and FANCI, supporting their site-specific monoubiquitination and interstrand cross-link repair. Its central UBC–RWD region contributes substrate recognition, while FANCB and FAAP100 organize the catalytic module.
  molecular_function:
    id: GO:0061630
    label: ubiquitin protein ligase activity
  directly_involved_in:
  - id: GO:0006513
    label: protein monoubiquitination
  - id: GO:0036297
    label: interstrand cross-link repair
  locations:
  - id: GO:0005634
    label: nucleus
  in_complex:
    id: GO:0043240
    label: Fanconi anaemia nuclear complex
  substrates:
  - id: UniProtKB:Q9BXW9
    label: FANCD2
  - id: UniProtKB:Q9NVI1
    label: FANCI
  supported_by:
  - reference_id: PMID:12973351
    supporting_text: which possesses E3 ubiquitin ligase activity in vitro and is essential for FANCD2 monoubiquitination in vivo
  - reference_id: PMID:19589784
    supporting_text: FANCI can be ubiquitinated on Lys-523 by the UBE2T-FANCL pair in vitro
  - reference_id: PMID:21775430
  - reference_id: PMID:27986592
- description: FANCL recognizes and recruits its cognate E2, UBE2T, through the C-terminal RING interface. This selective E2-recognition facet supplies UBE2T to the same FANCD2/FANCI monoubiquitination mechanism described by the ligase core, with specificity demonstrated by human-domain binding and competition experiments.
  molecular_function:
    id: GO:0031624
    label: ubiquitin conjugating enzyme binding
  directly_involved_in:
  - id: GO:0006513
    label: protein monoubiquitination
  locations:
  - id: GO:0005634
    label: nucleus
  in_complex:
    id: GO:0043240
    label: Fanconi anaemia nuclear complex
  supported_by:
  - reference_id: PMID:24389026
    supporting_text: these specific interactions are required for selection of Ube2T over other E2s by FANCL
  - reference_id: PMID:16916645
    supporting_text: UBE2T binds to FANCL, the ubiquitin ligase subunit of the Fanconi anemia core complex
  - reference_id: PMID:21775430
proposed_new_terms: []
suggested_questions:
- question: How does the five-residue insertion distinguishing the 380-residue FANCL product from the 375-residue product affect UBC–RWD folding, core-complex assembly, substrate recognition and E3 activity in human cells?
- question: Does the ELF-domain ubiquitin-binding activity demonstrated in fly, frog and chicken proteins occur directly in human FANCL, and how does it influence repair-complex activity without being required for the minimal RING–UBE2T transfer reaction?
suggested_experiments:
- experiment_type: natural-product comparison with matched expression
  description: Compare the exact 375- and 380-residue human FANCL products in matched FANCL-deficient human cells and purified complexes. Measure expression, folding, nuclear localization, FANCB/FAAP100 assembly, UBE2T and substrate binding, FANCD2/FANCI monoubiquitination and cross-link survival separately. Include empty-vector and RING-interface controls so expression or complex-stability differences are distinguished from altered catalytic function.
- experiment_type: separation of ELF ubiquitin recognition from RING catalysis
  description: Measure purified human FANCL and ELF-domain binding to wild-type and I44A ubiquitin using orthogonal quantitative assays. Test carefully folded ELF-interface variants in minimal UBE2T transfer reactions and complete repair complexes, then examine matched variants in human-cell rescue experiments. Confirm protein folding, core-complex assembly and nuclear localization before interpreting altered FANCD2/FANCI monoubiquitination.
references:
- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO terms
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Official InterPro method, actual IPR026848 definition/GO mappings and Q9NW38 match read. The three mappings are transferase activity, ICL repair and FA nuclear complex. Target biochemistry supports refinement of the broad MF to E3 ligase; activity is not inferred from a RING pattern alone. The InterPro entry retains historical WD-repeat language, whereas actual human structural PMID21775430 establishes URD/RING architecture.
- id: GO_REF:0000024
  title: Manual transfer of experimentally-verified manual GO annotation data to orthologs by curator judgment of sequence similarity
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Official manual orthology-transfer method and actual mouse Q9CR14 identity/GOA/UniProt assertions read. Donor PMID:21229326 Methods specify mouse FANCL/UBE2W constructs; target localization, UBE2W interaction and discharge experiments were read separately from human-cell UBE2W knockdown. Human PMID:19589784 chemistry and HPA localization independently corroborate transferred E3/nuclear/cytoplasmic biology. No equivalence of human natural products or conversion of donor assays into human experiments is asserted.
- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Official method and four authentic global IBD records at PTN000324788 read. Fresh official v19 tree/MSA responses verify human leaf PTN002491116, its descent from PTN000324788 and exact displayed 375-residue sequence. All four positive IBDs are on the path, with no NOT in the saved family PAINT rows. The six intake failures remain preserved as historical access limitations; the successful responses are separately pinned. Human self-WITH is legitimate experimental grounding, not circularity. The DNA-repair IBD includes an additional Arabidopsis donor absent from the current human row; both source versions remain preserved. Actual mouse PMID:21229326 and fly PMID:25205745 experiments, fly PMID:16860002 abstract and independent human PMID:19589784 chemistry inform biology; no donor-count shortcut is used.
- id: GO_REF:0000041
  title: Gene Ontology annotation based on UniPathway vocabulary mapping
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Official UniPathway mapping method read; the method states that UniPathway is no longer maintained, with last release March 2015. The target UniProt protein-ubiquitination pathway is genuine. Specific substrate monoubiquitination is supported independently; the old mapping is not claimed to be a new experimental source.
- id: GO_REF:0000044
  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot Subcellular Location vocabulary mapping, accompanied by conservative changes to GO terms applied by UniProt
  findings: []
  reference_review:
    relevance: HIGH
