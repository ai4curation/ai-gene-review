  review:
    summary: Retain the orthology-inferred conditional nuclear-envelope association as non-core.
    action: KEEP_AS_NON_CORE
    reason: Mouse Q9CR14 IPI traces to PMID:12574169 and GGN/PR:Q80WJ1. Newly recovered operative Methods/Results show tagged mouse POG/FANCL co-localizing with coexpressed GGN1 near the nuclear membrane in HeLa cells. This positive partner-directed localization supports retaining the curated donor inference; peripheral association need not make FANCL a membrane-spanning protein. Perinuclear signal alone would be less specific, but the GGN1 interaction and colocalization provide additional context. The human row remains an orthology inference, with no endogenous human assay, membrane-side assignment or natural-product resolution. Its conditional scope warrants non-core retention. Figure pixels remain uninspected; the earlier Methods/Results access limitation is superseded. The paper proposes GGN1 nuclear-envelope topology from its sequence and localization; it does not establish membrane topology experimentally or distinguish an envelope surface from nearby perinuclear structures.
