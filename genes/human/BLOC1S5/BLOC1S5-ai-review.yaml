    reason: PMID:21998198 directly includes FLAG-muted-containing complexes in human SH-SY5Y cells and
      reduced dentate-gyrus PI4KIIalpha in muted-null mice. These data support a BLOC-1 contribution to
      neuronal cargo sorting, rather than MUTED acting as a motor. The detailed compartmental and trafficking
