core_functions:
- description: MUTED stabilizes BLOC-1, supporting membrane-cargo delivery from endosomes to melanosomes
    and melanosome organization. Human MUTED complementation restores complex stability, pigmentation
    and cargo delivery in mutant mouse melanocytes.
  in_complex:
    id: GO:0031083
    label: BLOC-1 complex
  directly_involved_in:
  - id: GO:0035646
    label: endosome to melanosome transport
  - id: GO:0032438
    label: melanosome organization
  supported_by:
  - reference_id: PMID:12191018
  - reference_id: PMID:15102850
  - reference_id: PMID:17182842
  - reference_id: PMID:22203680
  - reference_id: UniProt:Q8TDH9
  - reference_id: PMID:32565547
    supporting_text: rescued TYRP1 localization
  knowledge_gaps:
  - gap_statement: The distinct molecular activity and contact topology of MUTED within BLOC-1 remain
      incompletely resolved.
    boundary: Octamer membership, assembly stability and cargo-sorting rescue are supported; the inspected
      evidence does not isolate an enzymatic active site, autonomous motor, or MUTED-specific AP-3-binding
      surface.
    gap_kind:
    - BIOLOGY
    dark_aspect: MF_DARK
    status: OPEN
    resolution: Reconstitute MUTED-containing interfaces and separate mutations that disrupt complex stability
      from those that selectively impair cargo sorting.
suggested_questions:
- question: Which MUTED contacts support BLOC-1 assembly, and can a MUTED-specific molecular activity
    be separated experimentally from general octamer destabilization?
- question: Which BLOC-1-dependent cargo-sorting step fails during platelet dense-granule formation in
    BLOC1S5 deficiency, and does wild-type human BLOC1S5 restore that step in patient-derived megakaryocytes?
suggested_experiments:
- hypothesis: MUTED interface variants can distinguish loss of BLOC-1 assembly from a selective cargo-sorting
    defect.
  description: Reconstitute BLOC-1 with defined MUTED interface variants; measure octamer integrity and
    membrane-cargo sorting in parallel, retaining variants with comparable protein abundance and using
    wild-type MUTED rescue as a control.
  experiment_type: Complex reconstitution, interaction mapping and cargo-trafficking rescue
- hypothesis: Restoring BLOC1S5 rescues a specific dense-granule cargo-sorting defect in patient-derived
    megakaryocytes.
  description: Compare patient-derived megakaryocytes and isogenic corrected cells for BLOC-1 stability,
    trafficking of established dense-granule cargos, granule maturation and released platelet granule
    content. Distinguish cargo delivery from granule number and stimulus-dependent secretion.
  experiment_type: Isogenic rescue and platelet dense-granule trafficking analysis
