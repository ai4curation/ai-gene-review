  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q8R015
  - ensembl:ENSMUSP00000036614
  review:
    action: UNDECIDED
    summary: The exact mouse gene-expression donor experiment remains unresolved.
    reason: The electronic source transfers mouse Q8R015/ENSMUSP00000036614. The official gene-expression
      definition concerns production of mature RNA or protein from genetic information. Expression of
      MUTED itself or altered cargo abundance does not distinguish participation in this process from
      trafficking, degradation or a downstream phenotype. The exact donor experiment has not been recovered;
      preserve the assertion as undecided without assigning an unverified study or alleging a propagation
      error. The assembly and cargo-sorting evidence cited here describes the established role; it is
      not negative evidence against an unexamined donor assay. A fresh direct QuickGO donor query was
      inaccessible. No specific transcription or translation mechanism is assigned.
    supported_by:
    - reference_id: UniProt:Q8TDH9
    - reference_id: PMID:32565547
