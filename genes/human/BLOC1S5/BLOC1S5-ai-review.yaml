  review:
    summary: Endosomal cargo delivery to melanosomes is the supported specific transport function.
    action: MODIFY
    reason: 'The broad vesicle-mediated transport assertion is consistent with BLOC-1 function, but the
      human MUTED rescue experiments resolve endosome-to-melanosome cargo transport more specifically.
      Refine this general annotation to GO:0035646, already present with independent source evidence,
      without adding a NEW row. This does not challenge the PAINT node placement or the separately retained
      neuronal transport roles. The structured category records only term granularity: the PAINT phylogeny
      and IBD node were not inspected here, and no source-annotation or propagation error is alleged.'
    supported_by:
    - reference_id: PMID:17182842
    - reference_id: UniProt:Q8TDH9
    - reference_id: PMID:32565547
