- id: PMID:32565547
  title: BLOC1S5 pathogenic variants cause a new type of Hermansky-Pudlak syndrome.
  full_text_unavailable: false
  findings:
  - statement: Patient 1 platelets show loss or reduction of other BLOC-1 subunits, supporting assembly
      destabilization associated with the BLOC1S5 deletion.
    supporting_text: levels of both Pallidin and Dysbindin are reduced or absent
  - statement: HA-tagged full-length human BLOC1S5 restores BLOC-1 stability, pigmentation and TYRP1 delivery
      in muted mouse melanocytes, whereas patient-derived truncated constructs fail to rescue.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The exact normal Source100 cache joins PMID32565547, PMC7529931, DOI10.1038/s41436-020-0867-5
      and the title. Complete abstract and selected XML Methods, Results and Discussion were read. Human
      platelet immunoblots quantify pallidin/dysbindin; the authors could not detect a specific MUTED
      band in control platelets with available antibodies. Rescue and TYRP1/TfR colocalization use HA-tagged
      human constructs in murine melan-mu cells. The Patient 2 frameshift allele was not functionally
      tested. Figure panels and supplementary material were not independently inspected. Cargo sorting
      and melanosome function are supported; these assays do not establish whole-melanosome movement or
      pigment-cell differentiation.
core_functions:
- description: MUTED contributes to the BLOC-1 assembly that supports sorting of endosomal membrane cargo
    toward melanosomes. Human MUTED complementation restores complex stability and cargo delivery in mutant
    mouse melanocytes; the assembly contribution is established more clearly than an autonomous molecular
    activity.
  in_complex:
    id: GO:0031083
    label: BLOC-1 complex
  directly_involved_in:
  - id: GO:0035646
    label: endosome to melanosome transport
  supported_by:
  - reference_id: PMID:12191018
  - reference_id: PMID:15102850
  - reference_id: PMID:17182842
  - reference_id: PMID:22203680
  - reference_id: UniProt:Q8TDH9
  - reference_id: PMID:32565547
    supporting_text: rescued TYRP1 localization
  knowledge_gaps:
  - gap_statement: The distinct molecular activity and contact topology of MUTED within BLOC-1 remain
      incompletely resolved.
    boundary: Octamer membership, assembly stability and cargo-sorting rescue are supported; the inspected
      evidence does not isolate an enzymatic active site, autonomous motor, or MUTED-specific AP-3-binding
      surface.
    gap_kind:
    - BIOLOGY
    dark_aspect: MF_DARK
    status: OPEN
    resolution: Reconstitute MUTED-containing interfaces and separate mutations that disrupt complex stability
      from those that selectively impair cargo sorting.
