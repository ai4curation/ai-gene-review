- term:
    id: GO:0032402
    label: melanosome transport
  evidence_type: IDA
  original_reference_id: PMID:17182842
  qualifier: involved_in
  review:
    summary: Cargo delivery to melanosomes is supported; whole-melanosome movement is unresolved.
    action: UNDECIDED
    reason: GO:0032402 denotes directed movement of melanosomes. The inspected PMID:17182842 methods and
      results show Tyrp1 cargo routing, endosomal exit and pigmentation rescue by human MuHA in muted
      mouse melanocytes. These measurements do not themselves establish movement of whole melanosomes.
      The exact curator basis may involve figure or supplementary material not inspected here, so preserve
