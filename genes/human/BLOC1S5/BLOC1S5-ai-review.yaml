- term:
    id: GO:0032438
    label: melanosome organization
  evidence_type: NAS
  original_reference_id: PMID:15102850
  qualifier: involved_in
  review:
    summary: BLOC-1 contributes to melanosome organization through cargo delivery.
    action: ACCEPT
    reason: MUTED is an integral BLOC-1 subunit. Complex composition and assembly studies, together with
      human MUTED rescue of pigment and cargo sorting in muted melanocytes, support a role in melanosome
      biogenesis and organization. This is an assembly-mediated function, not evidence that MUTED catalyzes
      pigment synthesis. Independent PMID:32565547 selected Results show full-length human BLOC1S5 rescue
      of BLOC-1 stability and TYRP1 localization in muted mouse melanocytes, whereas patient-derived truncated
