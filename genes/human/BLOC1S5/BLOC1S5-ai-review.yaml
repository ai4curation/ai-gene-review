      remains unresolved.
    action: UNDECIDED
    reason: This combined electronic localization inference uses GO:0008089 axonal transport and GO:0048490
      synaptic vesicle transport. PMID:21998198 directly detects Muted-containing complexes in human SH-SY5Y
