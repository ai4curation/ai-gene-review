id: Q8TDH9
gene_symbol: BLOC1S5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: BLOC1S5, also called MUTED, is a small nonenzymatic subunit of the eight-subunit BLOC-1 complex.
  It helps maintain the assembly that sorts membrane cargo from early endosomes toward melanosomes and
  other lysosome-related organelles. Human MUTED can restore BLOC-1 stability, pigmentation and cargo
  delivery in muted mouse melanocytes. BLOC-1 also supports selected neuronal cargo-trafficking routes;
  these findings do not establish an autonomous motor or transporter activity for MUTED. Biallelic BLOC1S5
  defects cause Hermansky-Pudlak syndrome type 11, with hypopigmentation and platelet dense-granule deficiency.
