id: Q8TDH9
gene_symbol: BLOC1S5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: BLOC1S5, also called MUTED, is a small nonenzymatic subunit of the eight-subunit BLOC-1 complex.
  It stabilizes the assembly that sorts membrane cargo from early endosomes to melanosomes and other lysosome-related
  organelles. Human MUTED restores BLOC-1 stability, pigmentation and cargo delivery in muted mouse melanocytes.
  BLOC-1 also supports selected neuronal cargo-trafficking routes. Biallelic BLOC1S5 defects cause Hermansky-Pudlak
  syndrome type 11, with hypopigmentation and platelet dense-granule deficiency.
