id: P60953
gene_symbol: CDC42
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CDC42 is a small Rho-family guanine-nucleotide-binding protein that couples extracellular
  and intracellular signals to changes in cell architecture. Its GTP-bound state engages effectors such
  as WASP-family proteins, PAK kinases and PAR6 polarity complexes; intrinsic GTP hydrolysis, accelerated
  by GTPase-activating proteins, returns it toward an inactive GDP-bound state. Spatial control of this
  cycle at membranes regulates actin organization, filopodial protrusion and cell polarity. Cytosolic
  and organelle-associated pools support context-dependent trafficking and mitotic functions. Alternative
  products differ at their C termini, including sequences involved in lipid modification and membrane
  targeting.
