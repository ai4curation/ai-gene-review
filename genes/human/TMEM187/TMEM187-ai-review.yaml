id: Q14656
gene_symbol: TMEM187
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  Six-pass transmembrane protein of the trans-Golgi network, encoded at Xq28 and formerly known as CXorf12
  or ITBA1. It is ubiquitously expressed, has no recognisable catalytic, transport or adaptor domain, and
  defines a protein family of its own (Pfam PF15100). TMEM187 binds the small GTPase RAB11A, preferentially
  in its GDP-bound form, and acts as a negative regulator of endosomal recycling: in its presence RAB11A is
  less available to its guanine-nucleotide exchange factor GRAB, recycling of transferrin receptor 1 back to
  the plasma membrane is slowed, and cellular iron uptake is held down. In erythroid cells this sets a brake
  on differentiation. Loss of TMEM187 in human erythroleukaemia lines accelerates iron uptake and triggers
  erythroid differentiation without inducing agents, leading to premature maturation with phosphatidylserine
  exposure, membrane fragility and increased macrophage clearance; zebrafish lacking tmem187 show enhanced
  early erythropoiesis, and forced expression of human TMEM187 in mouse haematopoietic stem cells, in an
  organism with no endogenous orthologue, compromises erythropoiesis and produces moderate anaemia. The
  molecular activity through which TMEM187 achieves this is not established: binding to RAB11A is
  demonstrated, but whether it acts by occluding the GEF, by sequestering RAB11A in a membrane subdomain, or
  by some other means has not been determined.
