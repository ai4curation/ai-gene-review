  - reference_id: PMID:41824385
    supporting_text: Together, we have demonstrated that TMEM187 acts as a novel negative regulator of
      erythroid differentiation and maturation.
  knowledge_gaps:
  - gap_statement: >-
      The molecular activity of TMEM187 is undetermined. Binding to RAB11A is established; what TMEM187 does
      to RAB11A, or to anything else, is not. Specifically: it has not been shown to inhibit GRAB-catalysed
      nucleotide exchange in a reconstituted or in vitro assay, it has not been shown to bind any cargo, and
      no transport or permeation activity has been tested despite its six transmembrane helices. Which
      surface of the protein contacts RAB11A, and whether the transmembrane helices are structural or
      functional, are also unknown.
    boundary: >-
      Firmly established: TMEM187 is a 261-residue, six-pass membrane protein of the trans-Golgi network;
      it co-immunoprecipitates with RAB11A in HEK293 and K562 cells and prefers the GDP-locked S25N mutant;
      its loss increases surface TfR1, transferrin uptake and GRAB-TfR1 colocalisation; and it restrains
      erythroid differentiation in human cells, zebrafish and a humanised mouse model. What is missing is the
      step between binding RAB11A and slowing recycling. The competition model is inference from
      colocalisation, expression levels and co-immunoprecipitation, and the paper flags that its observed
      nucleotide preference is opposite to what was reported for GRAB in axon outgrowth.
    gap_kind:
    - BIOLOGY
    dark_aspect: MF_DARK
    status: NARROWING
    significance: >-
      This is the classic MF-dark configuration: rich, credible cellular and organismal biology around a
      protein whose activity is unknown, which makes it look annotated. Without the activity, TMEM187's GO
      molecular function can only be a binding term, and the mechanism by which iron delivery is matched to
      erythroid demand cannot be written as a causal model. It also matters practically - a brake on
      erythropoiesis is a candidate lever in anaemia and in ineffective erythropoiesis, and a druggable
      mechanism requires knowing the activity.
    resolution: >-
      A reconstituted nucleotide-exchange assay: purified RAB11A, purified GRAB, and TMEM187 in detergent or
      nanodiscs, measuring GDP release with and without TMEM187, would directly test the GEF-occlusion model.
      Pair with proximity labelling from TMEM187 in erythroid cells to find partners other than RAB11A, and
      with a structure or crosslinking map of the TMEM187-RAB11A interface.
    provenance:
    - reference_id: PMID:41824385
      supporting_text: Here, we identify human TMEM187, a Golgi transmembrane protein of unknown function, as
        a novel negative regulator of erythropoiesis.
    - reference_id: PMID:41824385
      supporting_text: TMEM187 encodes a 261-amino-acid, 6-transmembrane protein located on chromosome Xq28.
        The precise function of TMEM187 remains unknown.
    - reference_id: PMID:41824385
      supporting_text: The same preference of GRAB with RAB11A S25N is the opposite of that observed in previous
        studies on axon outgrowth.
  - gap_statement: >-
      Whether TMEM187 has a role outside erythropoiesis is unknown. It is ubiquitously expressed and X-linked,
      but every functional observation comes from erythroid or erythroid-induced systems, and the mouse
      lineage has lost the gene entirely - so there is no mammalian loss-of-function model in a normal genomic
      context, and no phenotype has been described for any other cell type.
    boundary: >-
      Established: ubiquitous expression (UniProt tissue specificity), Xq28 location, and an erythroid
      phenotype in K562 cells, zebrafish and humanised mice. Also established, and unusual: mice lack a
      homologous gene endogenously, which is why the gain-of-function mouse experiment was possible and why a
      conventional knockout mouse is not. What is missing is any assay of TMEM187 outside the erythroid
      context.
    gap_kind:
    - BIOLOGY
    dark_aspect: BP_DARK
    status: OPEN
    significance: >-
      A ubiquitously expressed regulator of RAB11A-dependent recycling would be expected to act on more than
      transferrin receptor in more than one lineage. If it does not, that restriction is itself informative
      about how the brake is imposed. The absence of a mouse orthologue also means that inferences drawn from
      rodent models of iron handling cannot be transferred to this gene in either direction.
    resolution: >-
      Recycling assays for other RAB11A cargoes in non-erythroid TMEM187-null cells, plus a survey of
      TMEM187 expression and RAB11A-dependent traffic across tissues; and comparative work in a species that
      retains the gene, since the mouse does not.
    provenance:
    - reference_id: PMID:41824385
      supporting_text: whereas hematopoietic stem cell expression of human TMEM187 in mice, which lack a
        homologous gene endogenously, results in compromised erythropoiesis and moderate anemia
suggested_questions:
- question: >-
    Does TMEM187 inhibit GRAB-catalysed nucleotide exchange on RAB11A directly, or does it restrain recycling
    some other way? This is the single experiment that would convert TMEM187's GO molecular function from a
    binding term into an activity. The competition model currently rests on co-immunoprecipitation,
    colocalisation and expression changes, not on a measured exchange rate.
  experts:
  - Kai Li
  - Yang Liu
- question: >-
    Is the observed preference of TMEM187 for GDP-bound RAB11A (S25N) reconcilable with the reported behaviour
    of GRAB? The authors note that their nucleotide-state preference for GRAB is the opposite of what earlier
    axon-outgrowth studies found, which matters because the whole competition model depends on both proteins
    contending for the same RAB11A conformer.
  experts:
  - Kai Li
- question: >-
    Should any molecular-function term be asserted for TMEM187 at this stage, or is small GTPase binding
    (GO:0031267) the correct ceiling? The cellular component and biological process are now reasonably clear,
    which creates pressure to supply a matching MF - but adaptor, cargo receptor and transporter are all
    unsupported.
  experts: []
- question: >-
    Does TMEM187 act outside the erythroid lineage? It is ubiquitously expressed and X-linked, yet mice have
    lost the gene entirely and all functional data come from erythroid systems.
  experts:
  - Kai Li
  - Yvette Y Yien
suggested_experiments:
- hypothesis: >-
    TMEM187 restrains RAB11A activation by occluding the surface that its GEF GRAB engages, so TMEM187 should
    slow GRAB-catalysed GDP release from RAB11A in a reconstituted system.
  description: >-
    Purify RAB11A and the GRAB (RAB3IL1) GEF domain, and reconstitute TMEM187 into detergent micelles or
    nanodiscs. Measure GDP release and GTP loading on RAB11A (mant-nucleotide fluorescence or filter-binding)
    with and without TMEM187, over a TMEM187 concentration series, and test whether a TMEM187 mutant that
    fails to co-immunoprecipitate RAB11A also fails to inhibit exchange.
  experiment_type: Reconstituted guanine-nucleotide exchange assay
- hypothesis: >-
    TMEM187's effect on TfR1 is entirely indirect, via RAB11A, with no TMEM187-cargo contact.
  description: >-
    Perform proximity-dependent biotinylation from TMEM187 in K562 cells before and after erythroid induction
    and ask whether TfR1 or other recycling cargoes appear in the proximitome; in parallel, test whether the
    TfR1 surface phenotype of TMEM187 knockout cells is abolished by a RAB11A mutant locked in the GDP state.
    If cargo never appears and the RAB11A epistasis is complete, the adaptor and cargo-receptor hypotheses can
    be formally excluded rather than merely left unasserted.
  experiment_type: Proximity labelling plus epistasis with RAB11A nucleotide-state mutants
- hypothesis: >-
    The six transmembrane helices are functional rather than merely anchoring, and TMEM187 may move a
    substrate across the TGN membrane.
  description: >-
    Reconstitute purified TMEM187 into proteoliposomes and screen for transport or conductance using a broad
    panel (ions including iron species, protons, small metabolites) with electrophysiology and radiotracer
    flux. A clean negative result across a wide panel would be worth publishing, because it would justify
    treating the transmembrane region as structural and redirect effort to the cytosolic surfaces that contact
    RAB11A.
  experiment_type: Proteoliposome transport and conductance screen
