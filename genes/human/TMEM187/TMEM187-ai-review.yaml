- id: PMID:41824385
  title: TMEM187 is a novel brakelike modulator in the regulation of erythropoiesis.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Blood 2026;148(3):361-375, PMC13386088), with an accompanying Blood commentary
      (PMID:42461672). Essentially the entire functional literature on this gene. The cellular-component and
      biological-process claims are well supported - loss and gain of function in human cells, zebrafish and
      humanised mice, in both directions. The molecular mechanism is the weaker part: the GEF-competition
      model is inferred from co-immunoprecipitation, colocalisation and expression changes, with no
      nucleotide-exchange assay, and the paper itself notes that its observed nucleotide-state preference for
      GRAB is opposite to earlier reports. This is a single study from one laboratory and has not yet been
      independently replicated.
