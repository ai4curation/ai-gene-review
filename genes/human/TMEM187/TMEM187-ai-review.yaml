core_functions:
- description: >-
    TMEM187 sits in the trans-Golgi network membrane as a six-pass integral membrane protein and acts as a
    negative regulator of RAB11A-dependent endosomal recycling, and through it of erythroid differentiation.
    It binds RAB11A, preferentially in the GDP-bound state, and in its presence less transferrin receptor 1
    returns to the plasma membrane and less iron is taken up; removing TMEM187 releases that brake and drives
    premature erythroid differentiation and maturation.

    No molecular_function is asserted here, deliberately. What is demonstrated at the molecular level is
    binding to RAB11A and nothing more; that is recorded as a small GTPase binding annotation in
    existing_annotations, but binding is not an activity. The published model - that TMEM187 occupies
    GDP-RAB11A and thereby competes with the exchange factor GRAB - is consistent with the data but has not
    been tested with a nucleotide-exchange assay, and the paper itself notes that the nucleotide-state
    preference it observes runs opposite to earlier reports of GRAB's own preference. Nothing supports an
    adaptor, cargo-receptor, transporter or channel assignment either: no cargo binds TMEM187, TfR1 is
    affected downstream of RAB11A rather than by contact, and no permeation or transport assay has been
    performed despite the six transmembrane helices. An omitted molecular function states that it is not
    established; a plausible-sounding one would state something false.
