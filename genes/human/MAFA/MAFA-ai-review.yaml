      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - ROLE_CONFLATION
      source_entities:
      - source_id: PANTHER:PTN000014714
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: The PAINT node captures the conserved glucose-responsive MAFA branch, but insulin
          secretion is a downstream beta-cell process rather than the step performed by this transcription
          factor.
      - source_id: UniProtKB:Q8NHW3
        source_label: human MAFA
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Human MAFA is the target and directly regulates insulin transcription; annotating that
          upstream transcriptional role as involved_in insulin secretion conflates regulator and process
          participant.
