    summary: Mark the insulin secretion row as over-annotated for MAFA.
    action: MARK_AS_OVER_ANNOTATED
    reason: MAFA directly regulates insulin gene transcription, but the existing rows overstate that transcriptional role as participation in the insulin secretion process itself.
