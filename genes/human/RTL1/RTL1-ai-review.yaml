suggested_questions:
- question: Is the human RTL1 retropepsin aspartic-protease domain catalytically active, and does it autoprocess
    the RTL1 Gag-Pol polyprotein as its PEG10 paralog does?
- question: Does human RTL1 form RNA-packaging virus-like particles, and is particle formation or membrane
    association the basis of its placental and muscle functions?
- question: How quantitatively does RTL1 dosage map onto the opposite placental and skeletal-muscle phenotypes
    of Kagami-Ogata versus Temple syndrome?
suggested_experiments:
- hypothesis: Human RTL1 is a catalytically active aspartic protease that autoprocesses its polyprotein.
  description: Express recombinant human RTL1 Pol/protease domain and test autocatalytic cleavage versus
    an active-site aspartate mutant in vitro.
  experiment_type: enzyme assay / mutagenesis
- hypothesis: Human RTL1 dosage changes recapitulate Kagami-Ogata and Temple syndrome tissue phenotypes.
  description: Model RTL1 over- and under-expression in human trophoblast and myogenic cell systems and
    compare capillary/myotube phenotypes.
  experiment_type: cell model
