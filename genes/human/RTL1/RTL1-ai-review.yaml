  review:
    summary: The mouse RTL1 ortholog self-assembles into capsid-like particles (PMID:34413232) and human
      RTL1 retains the full Gag capsid domain; the capsid structural activity is inferred by orthology.
      No molecular function was previously annotated for human RTL1.
    action: NEW
    reason: Capsid-like self-assembly demonstrated for the mouse ortholog; human RTL1 retains the capsid
      domain. The retropepsin aspartic protease is present but not yet experimentally demonstrated active
      in RTL1, so no protease activity is asserted here (see suggested questions). Full-length PEG11/RTL1
      protein detected in ovine muscle was unprocessed, which its authors read as an inactive or non-autolytic
      protease (PMID:20072617).
    supported_by:
    - reference_id: PMID:34413232
      supporting_text: self-assemble into capsid-like particles
    - reference_id: PMID:20072617
      supporting_text: The immunoblot and peptide mass spectrometry data, which demonstrated that the PEG11
        protein was full length, suggested that the aspartyl protease domain was either inactive or did
