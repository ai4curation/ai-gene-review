description: 'RTL1 (retrotransposon-like 1; also PEG11, SIRH2, MART1/MAR1) is a eutherian-specific, paternally
  expressed imprinted gene in the DLK1-DIO3 cluster at human chromosome 14q32.2, domesticated from a Ty3/gypsy
  (sushi-ichi) LTR retrotransposon. It encodes a full-length Gag-Pol-like polyprotein with a capsid/nucleocapsid
  region, a retropepsin aspartic-protease domain (DSG motif), reverse-transcriptase-like and RNase-H-like
  regions, and predicted C-terminal transmembrane helices. RTL1 dosage is tuned in trans by microRNAs
  from the reciprocally imprinted maternal antisense transcript RTL1as. From mouse and sheep orthologs,
  RTL1 is essential for dosage-sensitive maintenance of the fetal capillary network of the labyrinthine
  placenta and is a major driver of fetal/neonatal skeletal-muscle development, localizing beside the
  sarcomeric Z-disc in muscle. In human and mouse placenta RTL1 is expressed in the fetal-capillary
  vascular endothelial cells and pericytes of the villi/labyrinth rather than in trophoblast, complementing
  its trophoblast-expressed paralog PEG10. In humans, RTL1 dosage is central to two 14q32.2 imprinting disorders:
  excessive RTL1 expression underlies Kagami-Ogata syndrome (paternal upd(14)pat and related maternal-allele
  lesions), and reduced/absent RTL1 contributes to Temple syndrome (maternal upd(14)mat and related paternal-allele
  lesions); the two conditions share placental and skeletal-muscle phenotypes of opposite sign. RTL1 is
  additionally imprinted in the human brain.'
