  conclusions:
  - PTPRJ supports protein phosphatase binding; PLPP3 supports the broader phosphatase class, without
    established inhibition of its chemistry.
  - EGFR/MET, cadherins and Kaiso support partner-class refinements at each source assay scope. Co-IP,
    TAP, PLA and tagged membrane reporters are not recast as purified interfaces.
  - CagA association can be MET-mediated; FRMD5 uses a C-terminal fragment; CDH26 has a heterogeneous
    catenin assembly. SYNGAP1 supports GAP-partner binding within the inclusive neuronal association
    scope.
  - Empty literal joins are not negative interactions. Sequence-backbone checks authenticate database
    identities, not every experimental construct endpoint or product activity.
