  historical_constructs:
  - source: PMID:11896187
    locator: Methods and localization Results; human AF062341 constructs
    scope: Alternative starts Met55/102/324 and C-terminal exon B distinguish the tested historical
      names. Human 1A/2A/3A enter nuclei variably; 4A/1AB remain cytoplasmic in the tested cells.
      These observations are not assigned indiscriminately to all current products.
  - source: PMID:20371349
    locator: https://www.rcsb.org/structure/3L6Y
    scope: Deposited p120 is O60716-29 (4A,610 aa) minus product residues 290–320 plus N-terminal
      GSPEF, giving 584 aa. The cadherin entity is an 18-aa peptide; its UniProt-derived species attribution
      is distinguished from the original paper construct provenance.
  - source: PMID:19199708
    locator: Publisher Tables S1/S2
    scope: Two target peptides match 24 and 32 current products. Historical IPI 1AB naming is not
      an isoform-exclusive observation.
primary_source_scopes:
- source: PMID:14610055
  repository: ../../../publications/PMID_14610055.md
  locator: https://pmc.ncbi.nlm.nih.gov/articles/PMC2173649/
  read: Selected operative main Methods, Results and Discussion; no figure pixels.
  finding: Human-cell p120 depletion/murine rescue and pulse-chase/surface biotinylation establish
    cadherin stability after initial surface arrival. Endocytosis versus later sorting is unresolved.
- source: PMID:11896187
  repository: ../../../publications/PMID_11896187.md
  locator: https://citeseerx.ist.psu.edu/document?doi=706af5643387d586a6e75a40322828e35a3943db&repid=rep1&type=pdf
  read: Recovered original PDF scientific Methods, Results, Discussion and caption text; no image-pixel
    claim.
  finding: Product-dependent human-cell localization and morphology; broad cytoplasm is not automatically
    narrowed to cytosol.
- source: PMID:20371349
  repository: ../../../publications/PMID_20371349.md
  locator: https://doi.org/10.1016/j.cell.2010.01.017
  read: Abstract, indexed original p124 structural/reconstitution text and official 3L6Y entity sequences.
    Complete main download and full supplemental Methods unavailable.
  finding: Cadherin-tail interface is demonstrated with a defined deletion construct; no intact-4A
    or all-product equivalence.
- source: PMID:10725230
  repository: ../../../publications/PMID_10725230.md
  locator: https://www.researchgate.net/publication/12591163_ARVCF_localizes_to_the_nucleus_and_adherens_junction_and_is_mutually_exclusive_with_P120_in_E-cadherin_complexes
  read: Indexed original selected Methods/Results and Figure 5 caption; no pixels.
  finding: The ARVCF-focused paper includes p120/E-cadherin controls. The Figure 5 endogenous MDCK
    pair is canine, with human ARVCF introduced separately.
- source: PMID:12734196
  repository: ../../../publications/PMID_12734196.md
  locator: https://www.researchgate.net/publication/10771797_Characterization_of_Cadherin-24_a_Novel_Alternatively_Spliced_Type_II_Cadherin
  read: Indexed original operative Methods/Results/Discussion, not a recovered publisher PDF.
  finding: Long and short human CDH24 constructs each recover p120 complexes in A431D cells; no equal
    affinity or extracellular adhesive activity inferred.
- source: PMID:18343367
  repository: ../../../publications/PMID_18343367.md
  locator: https://doi.org/10.1016/j.yexcr.2008.01.031
  read: Complete abstract and selected publisher Methods/Results preview; complete operative original
    unavailable.
  finding: DSG3 association and anchor-region-dependent retention concern a free surface pool distinguished
    from mature desmosomal incorporation. The deletion is in DSG3’s intracellular p120-association
    region, not in CTNND1.
- source: PMID:20123964
  repository: ../../../publications/PMID_20123964.md
  locator: https://pmc.ncbi.nlm.nih.gov/articles/PMC2838065/
  read: Recovered indexed PMC complete main Methods/Results/Discussion and main captions. Selected
    repository cache lacks the operative main Methods/Results despite its full-text flag. No pixels/supplement.
  finding: The original main assays establish human endothelial p120–LPP3 association and reduced
    β-catenin/LEF1 output, not inhibition of measured lipid-substrate turnover. The phosphatase-inhibitor
    annotation is over-specific to the demonstrated mechanism; this is not a claim that catalytic
    inhibition is disproved. Positive phosphatase binding remains separate. p120 depletion reduces
    branching rather than demonstrating negative regulation.
- source: PMID:21998202
  repository: ../../../publications/PMID_21998202.md
  locator: https://pubmed.ncbi.nlm.nih.gov/21998202/
  read: Selected complete target Results, Methods, Discussion and captions; no whole-paper/pixel claim.
  finding: Mouse p120 in 3T3-L1 cells reduces GLUT4 surface trafficking. Human MSC experiments concern
    RPTPmu. The target main passages do not establish p120–GLUT4 binding or identify Rho GDP-dissociation
    inhibition as the mechanism of the trafficking effect; the source-specific sequestration uncertainty
    remains.
- source: PMID:33972531
  repository: ../../../publications/PMID_33972531.md
  locator: https://pmc.ncbi.nlm.nih.gov/articles/PMC8110786/
  read: Selected full main Figure 3 Results/caption, Discussion and construct/imaging Methods.
  finding: Human HUVEC p120 dissociation from intracellular VE-cadherin tails precedes trafficking.
    The literal mouse donor provenance is preserved. GO:0098632 describes extracellular trans-cell
    binding; the source supports intracellular cadherin binding.
- source: PMID:19199708
  repository: ../../../publications/PMID_19199708.md
  locator: https://doi.org/10.1021/pr800658c
  read: Selected collection Methods/Discussion plus genuine Tables S1/S2.
  target_table:
    S1: https://ndownloader.figshare.com/files/4571323
    S1_excel_rows:
    - 4194
    - 4195
    S2: https://ndownloader.figshare.com/files/4571341
    S2_sheet: Paratid Exosomes
    S2_excel_row: 526
    identifier: IPI00182469.2 / CTNND1
  finding: Two peptides support target detection in the isolated parotid exosome fraction; neither
    isoform exclusivity nor vesicle biogenesis follows.
- source: PMID:19332538
  repository: ../../../publications/PMID_19332538.md
  locator: https://pubmed.ncbi.nlm.nih.gov/19332538/
  read: Selected original epithelial-cell Methods/Results.
  finding: DEP1 substrate-trapping association supports protein phosphatase binding; p120 catalysis
    is not implied.
- source: PMID:21357690
  repository: ../../../publications/PMID_21357690.md
  locator: https://pubmed.ncbi.nlm.nih.gov/21357690/
  read: Selected original Methods/Results.
  finding: Human SH-SY5Y N-cadherin/p120 coimmunoprecipitation is scoped to the RET cleavage experiment;
    mouse neuronal contexts remain separate.
- source: PMID:28051089
  repository: ../../../publications/PMID_28051089.md
  locator: https://pubmed.ncbi.nlm.nih.gov/28051089/
  read: Selected main Methods/Results.
  finding: CDH26-associated p120/alpha-/beta-catenin coimmunoprecipitation supports a cellular assembly,
    not native stoichiometry or every purified binary contact.
- source: PMID:24189400
  repository: ../../../publications/PMID_24189400.md
  locator: https://pubmed.ncbi.nlm.nih.gov/24189400/
  read: Selected target-bearing main Results and main Methods. Supplementary Methods not inspected.
  finding: Tagged wild-type EGFR/catenin association in human airway cells is distinguished from each
    mutant interactome.
- source: PMID:31980649
  repository: ../../../publications/PMID_31980649.md
  locator: https://pubmed.ncbi.nlm.nih.gov/31980649/
  read: Selected main assay design/Results; target supplement not independently viewed.
  finding: The literal target record uses MYTH Cub/Nub constructs, distinct from the study affinity-purification
    networks.
- source: PMID:25468996
  repository: ../../../publications/PMID_25468996.md
  locator: https://pubmed.ncbi.nlm.nih.gov/25468996/
  read: Selected available main BioID principles/Discussion; exact target table not inspected.
  finding: Proximity labeling has broader reach than binary contact; established cadherin binding
    supports curator deference without validating an unseen target entry.
- source: PMID:37207277
  repository: ../../../publications/PMID_37207277.md
  locator: https://pubmed.ncbi.nlm.nih.gov/37207277/
  read: Selected main IP-MS Methods/Results and literal target records; exact screen table not independently
    inspected.
  finding: The reviewed SYNGAP1 Ras/Rap GAP class makes GTPase activating protein binding more informative
    than generic binding. Inclusive neuronal associations are not all direct or stoichiometric; the
    exact target table/panel remains uninspected and no GAP catalysis by p120 is inferred.
