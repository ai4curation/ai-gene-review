Rho_activity:
  sources:
  - https://www.nature.com/articles/ncb0900_637.pdf
  - https://pmc.ncbi.nlm.nih.gov/articles/PMC1820477/
  read_scope: Selected 2000 original PDF Results/Methods/Discussion and 2007 indexed original construct/binding/GDP-assay
    Methods/Results/captions. No full-paper, figure-pixel or supplement claim. Normal caches remain
    abstract-only.
  performed_activity: Two mouse studies directly measure GDP-release inhibition; the later direct-binding
    and mutation/truncation work strengthens the activity evidence and addresses the earlier co-purification
    caveat.
  human_inference: One new ISS molecular-function assertion and a separately qualified core; no new
    BP or claim of human experimental validation.
  construct_mapping: Z17804.1/CAA79078.1 is mouse 911 aa; the best current human alignment is O60716-8
    (912 aa), 887 identical paired residues across the full query. Historical mouse 1B is not current
    human O60716-6 (941 aa). Tested regulatory sites/basic motif are conserved, with product-specific
    limitations.
  reproducible_analysis: CTNND1-bioinformatics/RESULTS.md
  limits: All 32 sequences were calculated, not all 32 activities. Cytosol-only localization and membrane/cytosol
    switching are mechanistic models, not newly proved localization restrictions. The new MF does
    not resolve the separate GLUT4 sequestration assertion.
  cadherin_context: Original PMID:10980705 Figure 5 cellular competition and Discussion distinguish
    cadherin-free Rho inhibition from cadherin-bound stabilization. Cadherin juxtamembrane fragments
    suppress the p120 branching phenotype; endogenous cadherin-uncoupling experiments use ezrin localization
    as an indirect Rho readout. No universal, directly measured exclusion for every human product
    is asserted.
  open_biology: Exact human start/splice-product GDP-release activities and their cadherin/phosphorylation
    dependence remain experimentally unresolved despite conservation. The review now records this
    as a BIOLOGY knowledge gap with a purified human-product experiment.
