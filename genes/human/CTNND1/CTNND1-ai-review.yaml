id: O60716
gene_symbol: CTNND1
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CTNND1 encodes p120-catenin, an armadillo-repeat protein that binds cadherin cytoplasmic
  tails and controls cadherin surface stability. At adherens junctions it supports persistent cell-cell
  adhesion by protecting cadherins from turnover while allowing regulated junction remodeling. Cadherin-free
  long p120 products can restrain RhoA activation; cadherin engagement and phosphorylation modulate
  this regulation. Cytoplasmic and nuclear pools interact with signaling proteins and the transcription
  factor Kaiso. Alternative translation starts and splicing generate products with different N- and
  C-terminal sequences and distinct patterns of nuclear accumulation and effects on cell morphology.
