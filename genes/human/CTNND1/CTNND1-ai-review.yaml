core_functions:
- description: p120-catenin binds intracellular cadherin juxtamembrane tails and protects cadherin
    surface stability. Regulated occupancy of this interface supports cadherin-dependent cell-cell
    adhesion and junction maintenance.
  molecular_function:
    id: GO:0045296
    label: cadherin binding
  directly_involved_in:
  - id: GO:0050821
    label: protein stabilization
  - id: GO:0044331
    label: cell-cell adhesion mediated by cadherin
  locations:
  - id: GO:0005912
    label: adherens junction
  in_complex:
    id: GO:0016342
    label: catenin complex
  supported_by:
  - reference_id: PMID:14610055
    supporting_text: 'p120 acts at the cell

      surface to control cadherin turnover'
  - reference_id: PMID:20371349
  - reference_id: PMID:12734196
  - reference_id: PMID:10725230
- description: Long p120-catenin products are inferred to restrain Rho activation by inhibiting GDP
    dissociation, based on direct mouse biochemical assays and conservation of the tested regulatory
    regions in human products. Cadherin-tail competition suppresses the Rho-inhibitory phenotype in
    the original cellular experiments, distinguishing this activity from simultaneous cadherin-bound
    junctional stabilization. Phosphorylation and terminal-sequence differences tune Rho regulation.
  molecular_function:
    id: GO:0005094
    label: Rho GDP-dissociation inhibitor activity
  locations:
  - id: GO:0005737
    label: cytoplasm
  supported_by:
  - reference_id: PMID:10980705
  - reference_id: PMID:17194753
    supporting_text: 'p120-catenin N-terminal

      regulatory domain as the docking site for RhoA'
  - reference_id: file:human/CTNND1/CTNND1-bioinformatics/RESULTS.md
suggested_questions:
- question: Which exact human p120 products retain Rho GDP-dissociation inhibition, and how do initiation
    sites, exon B and phosphorylation alter that activity?
- question: Does p120 binding directly inhibit LPP3 phosphatase catalysis, or mainly change its localization
    and downstream beta-catenin/LEF1 signaling?
- question: Does the GLUT4-linked GO-CAM sequestration activity have a demonstrated p120–GLUT4 physical
    interface, as distinct from Rho/Rac-dependent trafficking regulation?
- question: Can the original p120 target assays be resolved for the Kaiso-family, PLEKHA7, AMPA-trafficking
    and midbody-screen sources?
- question: Should the inherited extracellular adhesion-mediator activity be reconciled with the intracellular
    cadherin-tail role recorded in the endothelial source and GO-CAM?
suggested_experiments:
- description: Compare sequence-verified human start/splice products in matched cadherin-tail binding
    and surface-turnover assays.
  hypothesis: Product-specific terminal sequences regulate localization and turnover control even
    when the shared armadillo interface retains cadherin binding.
- description: Measure purified LPP3 substrate turnover with and without defined p120 constructs separately
    from LEF1 reporters.
  hypothesis: The signaling effect may occur without direct inhibition of phosphatase chemistry.
- description: Measure intrinsic and GEF-stimulated RhoA GDP release using purified, sequence-verified
    human p120 start/splice products, with and without cadherin tails and controlled phosphorylation.
    Include the mapped mouse construct, no-p120 and inactive-truncation controls.
  hypothesis: Retention of the mapped regulatory regions predicts Rho GDP-dissociation inhibition
    in a subset of long human products, modulated by cadherin occupancy and phosphorylation.
status: DRAFT
knowledge_gaps:
- gap_statement: The capacity of individual human p120 start/splice products to inhibit RhoA GDP dissociation,
    and its quantitative dependence on cadherin occupancy and phosphorylation, remains unresolved.
  boundary: Direct mouse GDP-release assays and conserved regulatory sequences support the human Rho
    GDI inference. Reconstruction of all 32 human products establishes their sequences, not their
    individual activities; the historical mouse assay name does not identify an equivalent human splice
    product.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: Product-specific activity would distinguish junctional cadherin stabilization from
    the regulation of a cadherin-free Rho-inhibitory pool.
  resolution: Measure intrinsic and GEF-stimulated RhoA GDP release with purified, sequence-verified
    human start/splice products, with matched phosphorylation states and cadherin-tail competition.
  provenance:
  - reference_id: PMID:10980705
  - reference_id: PMID:17194753
  - reference_id: file:human/CTNND1/CTNND1-bioinformatics/RESULTS.md
