- term:
    id: GO:0007565
    label: female pregnancy
  evidence_type: TAS
  original_reference_id: PMID:10866201
  qualifier: involved_in
  review:
    summary: >-
      Taken from the paper that cloned placental TAC3 and proposed that excessive
      syncytiotrophoblast NKB secretion causes pre-eclampsia; NKB is expressed in the
      placenta throughout the third trimester and circulates in maternal plasma.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The paper establishes placental expression, maternal plasma NKB and a correlation
      with pregnancy-induced hypertension and pre-eclampsia, plus a pressor response to
      supraphysiological NKB in rats. That is expression during pregnancy and a proposed
      pathological effect, not a demonstrated contribution of NKB to the physiological
      processes that allow a fetus to develop (the GO:0007565 definition). No
      loss-of-function evidence bears on pregnancy: women with biallelic TAC3 mutations
      are infertile for the hypothalamic reason above, and pulsatile GnRH restored
      fertility in one patient (PMID:20194706), which is a gonadotropin defect rather
      than a placental one. Kept, because placental NKB secretion in pregnancy is real,
      but marked as an over-annotation of a broad life-stage process.
    supported_by:
    - reference_id: PMID:10866201
      supporting_text: plasma concentrations of NKB were grossly elevated in pregnancy-induced hypertension and pre-eclampsia
    - reference_id: PMID:10866201
      supporting_text: We conclude that elevated levels of NKB in early pregnancy may be an indicator of hypertension and pre-eclampsia
- term:
    id: GO:0045777
    label: positive regulation of blood pressure
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN002694376
  - RGD:3809
  review:
    summary: >-
      Phylogenetic propagation of a pressor role to the tachykinin-3 clade, seeded by the
      rat Tac3 annotation from intracerebroventricular NK3 agonist injections.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The underlying data are central agonist pharmacology in rats: ICV senktide and
      [Pro7]-neurokinin B raise blood pressure, and the response is partly mediated by
      peripheral vasopressin receptors, so NKB is acting on a central circuit whose output
      is vasopressin release. Page et al. likewise obtained pressor activity only at NKB
      concentrations several-fold above late-pregnancy levels. Tachykinins are vasoactive
      as a family, so the claim is not false, and the ancestral node placement is
      reasonable; but there is no loss-of-function or physiological evidence that
      endogenous human NKB raises blood pressure, and patients lacking NKB have no
      reported blood-pressure phenotype. Marked as an over-annotation, matching the
      treatment of the corresponding rat-derived row in the TACR3 review rather than
      removing a family-level vasoactive claim. `just paint-losses human TAC3` reports no
      IRD or IKR on this lineage, so the IBA is current.
    supported_by:
