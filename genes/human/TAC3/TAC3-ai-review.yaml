    - reference_id: PMID:2478257
      supporting_text: blockade of peripheral vascular vasopressin receptors reduced these pressor responses
    - reference_id: PMID:10866201
      supporting_text: In female rats, concentrations of NKB several-fold above that of an animal 20 days into pregnancy caused substantial pressor activity.
