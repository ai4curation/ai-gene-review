      Cloned the 121-residue human placental precursor of NKB, localised expression to the
      outer syncytiotrophoblast, and showed raised maternal plasma NKB in pre-eclampsia.
      Source of the TAS rows for extracellular region, tachykinin receptor signalling,
      signalling receptor binding and female pregnancy. The pre-eclampsia causation in the
      title is the authors' proposal from correlative human data plus a rat pressor
      response to supraphysiological NKB; the precursor cloning and the expression and
      plasma findings are the solid part. Abstract-only cache.
- id: PMID:1370820
  title: Direct linkage of three tachykinin receptors to stimulation of both phosphatidylinositol
    hydrolysis and cyclic AMP cascades in transfected Chinese hamster ovary cells.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Rat tachykinin receptors in CHO cells; tachykinins stimulate phosphoinositide
      hydrolysis and, less efficiently, cAMP formation. This is the rat evidence behind the
      GO:0007189 ISS row on the human gene (via rat Tac3, RGD:3809). Abstract-only cache.
- id: PMID:1708331
  title: Hypertrophy and increased gene expression of neurons containing neurokinin-B
    and substance-P messenger ribonucleic acids in the hypothalami of postmenopausal
    women.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Human post-mortem in situ hybridisation: infundibular NKB neurons hypertrophy and NKB
      mRNA rises after menopause. Used for the description, not as support for any
      annotation, since an expression change is not itself a function of the peptide.
      Abstract-only cache.
- id: PMID:10372719
  title: The effects of hormone replacement therapy on hypothalamic neuropeptide gene
    expression in a primate model of menopause.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Ovariectomised cynomolgus monkeys: estrogen, alone or with progesterone, suppresses
      the number of infundibular neurons expressing NKB, which establishes that the
      postmenopausal rise follows estrogen withdrawal. Background for the description.
      Abstract-only cache.
- id: PMID:17437961
  title: A role for tachykinins in the regulation of human sperm motility.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Exogenous NKB and other tachykinins increased human sperm progressive motility, and
      RT-PCR detected the TAC3 transcript in spermatozoa. Cited by UniProt for the
      is_active_in extracellular region row. Abstract-only cache, so the sperm
      immunolocalisation detail comes from full text the curator read; the extracellular
      ligand claim is independently sound.
- id: PMID:19079066
  title: TAC3 and TACR3 mutations in familial hypogonadotropic hypogonadism reveal
    a key role for Neurokinin B in the central control of reproduction.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The defining human genetic study: homozygous TAC3 M90T, at the C-terminal methionine
      of the decapeptide, with absent puberty and prepubertal gonadotropins, and the
      synthesized mutant peptide about tenfold less potent at NK3R (non-amidated form
      nearly inactive). Full text available. The paper is explicit that rodent data of the
      time did not reproduce the phenotype and that an NK3R agonist suppressed LH in rats,
      which is why the direction of the LH effect is stated with a caveat here.
- id: PMID:20194706
  title: TAC3 and TACR3 defects cause hypothalamic congenital hypogonadotropic hypogonadism
    in humans.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      A TAC3 splice-site mutation that deletes NKB; very low LH with near-normal FSH, and
      pulsatile GnRH restored sex steroids, LH release and fertility in one subject,
      locating the lesion above GnRH release. Primary support for the NEW GO:0033686 row.
      Abstract-only cache.
- id: PMID:20332248
  title: TAC3/TACR3 mutations reveal preferential activation of gonadotropin-releasing
    hormone release by neurokinin B in neonatal life followed by reversal in adulthood.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Larger cohort: a homozygous single-base deletion in TAC3 removing the whole
      decapeptide, microphallus in most affected males, absent thelarche in affected
      females, and frequent reversal of hypogonadotropism after treatment withdrawal.
      Supports the age-dependence noted in the description. Abstract-only cache.
- id: PMID:25574869
  title: Neurokinin B is critical for normal timing of sexual maturation but dispensable
    for adult reproductive function in female mice.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Tac2 (mouse TAC3 orthologue) knockout: females show delayed vaginal opening and
      first estrus with recovery of cycling and retained fertility; males unaffected. The
      species contrast with human loss of function, and the suggestion that NKB may act
      through other tachykinin receptors, inform the caveats rather than any annotation.
      Abstract-only cache.
- id: PMID:19776272
  title: Regulation of gonadotropin-releasing hormone secretion by kisspeptin/dynorphin/neurokinin
    B neurons in the arcuate nucleus of the mouse.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Mouse arcuate Kiss1 neurons co-express NKB, dynorphin and the NK3 receptor, all
      estradiol-inhibited, with the autosynaptic model for pacing kisspeptin and GnRH
      release. Note the same paper reports that NKB and dynorphin inhibit LH secretion in
      this system, the sign contrast recorded on the GO:0033686 row. Abstract-only cache.
- id: PMID:17823266
  title: Kisspeptin neurons in the arcuate nucleus of the ewe express both dynorphin
    A and neurokinin B.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Dual immunocytochemistry in the ewe establishing the KNDy co-expression pattern
      (over three quarters of arcuate kisspeptin neurons also express NKB). Cellular
      context for the description. Abstract-only cache.
- id: PMID:20529119
  title: 'The kisspeptin system of the human hypothalamus: sexual dimorphism and relationship
    with gonadotropin-releasing hormone and neurokinin B neurons.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Human autopsy immunocytochemistry: 77% of infundibular kisspeptin neurons synthesize
      NKB, NKB is present in a subset of kisspeptin fibres, and kisspeptin varicosities
      contact GnRH neurons. The human counterpart of the rodent and ovine KNDy data.
      Abstract-only cache.
- id: PMID:23150555
  title: Role for kisspeptin/neurokinin B/dynorphin (KNDy) neurons in cutaneous vasodilatation
    and the estrogen modulation of body temperature.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Rat: ablating NK3-expressing arcuate KNDy neurons lowers tail-skin temperature and
      removes part of the estradiol effect on body temperature, implicating the circuit in
      cutaneous vasodilatation. Background for the thermoregulatory knowledge gap; the
      toxin targets the receptor-bearing neurons, so it does not isolate the NKB ligand.
      Abstract-only cache.
- id: PMID:25683060
  title: Neurokinin B administration induces hot flushes in women.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Intravenous NKB in healthy women induced flushing; the same study found no change in
      LH, FSH or estradiol over the 30-minute infusion. Both results are used: the first for
      the thermoregulatory gap, the second as a caveat on the direction of the LH effect.
      Full text available.
- id: PMID:2478257
  title: 'Central pressor actions of neurokinin B: increases in neurokinin B contents
    in discrete nuclei in spontaneously hypertensive rats.'
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Intracerebroventricular NK3 agonists raise blood pressure in rats, partly through
      peripheral vasopressin receptors. The experimental basis of the rat Tac3 annotation
      that seeds the GO:0045777 IBA; central agonist pharmacology, not endogenous peptide
      physiology. Abstract-only cache.
- id: PMID:37391393
  title: Structural insights into neurokinin 3 receptor activation by endogenous and
    analogue peptide agonists.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Cryo-EM structures of NK3R-Gq bound to NKB, substance P and senktide, with IP-one
      accumulation assays of receptor activation. Direct evidence for the ligand activity
      and the Gq/PLC pathway rows, and the reference both GO-CAMs use for the TAC3
      activity. Full text available.
- id: PMID:32296183
  title: A reference map of the human binary protein interactome.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      HuRI, a systematic yeast two-hybrid screen. Correctly cited for two binary
      interactions of the TAC3 precursor (PRB1 and an uncharacterised secreted protein),
      but neither identifies a function, which is why both rows are removed under the
      protein-binding policy. Full text available.
- id: PMID:32814053
  title: Interactome Mapping Provides a Network of Neurodegenerative Disease Proteins
    and Uncovers Widespread Protein Aggregation in Affected Brains.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Neurodegeneration-focused yeast two-hybrid interactome; source of the TAC3-JPH3
      interaction. No functional consequence tested, so the generic binding row is
      removed. Abstract-only cache.
- id: PMID:23643382
  title: Mutations in FGF17, IL17RD, DUSP6, SPRY4, and FLRT3 are identified in individuals
    with congenital hypogonadotropic hypogonadism.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Oligogenic CHH screen; cited by UniProt for the TAC3 R80S variant, found in a patient
      who also carries an HS6ST1 mutation. Listed because the UniProt variant record rests
      on it; no annotation here depends on it. Full text available.
