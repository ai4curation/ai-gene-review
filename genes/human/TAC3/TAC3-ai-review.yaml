core_functions:
- description: >-
    Processed and C-terminally amidated to the decapeptide neurokinin B, which is secreted
    and acts in the extracellular space as the preferred agonist of the neurokinin-3
    receptor NK3R (TACR3), activating Gq/11, phospholipase C and intracellular calcium
    signalling; with lower potency it also activates the other tachykinin receptors.
  molecular_function:
    id: GO:0048018
    label: receptor ligand activity
  directly_involved_in:
  - id: GO:0007209
    label: phospholipase C-activating tachykinin receptor signaling pathway
  - id: GO:0007217
    label: tachykinin receptor signaling pathway
  locations:
  - id: GO:0005576
    label: extracellular region
  supported_by:
  - reference_id: PMID:37391393
    supporting_text: Endogenous neurokinin B (NKB) is the most potent natural agonist of NK3R.
  - reference_id: PMID:37391393
    supporting_text: NKB preferentially activates NK3R coupled to the Gαq family of G proteins for intracellular signal transduction
- description: >-
    Released by hypothalamic arcuate KNDy neurons, where NKB acting on NK3R within the
    kisspeptin/neurokinin B/dynorphin network patterns pulsatile kisspeptin and
    gonadotropin-releasing hormone output and thereby promotes luteinizing hormone
    secretion; loss of the decapeptide in humans causes normosmic congenital
    hypogonadotropic hypogonadism.
  molecular_function:
    id: GO:0048018
    label: receptor ligand activity
  directly_involved_in:
  - id: GO:0033686
    label: positive regulation of luteinizing hormone secretion
  locations:
  - id: GO:0005576
    label: extracellular region
  anatomical_locations:
  - id: UBERON:0001932
    label: arcuate nucleus of hypothalamus
  supported_by:
  - reference_id: PMID:20194706
    supporting_text: Our data demonstrate the hypothalamic origin of the gonadotropin deficiency in these genetic forms of normosmic CHH.
  - reference_id: PMID:20529119
    supporting_text: Dual-immunofluorescent studies established that 77% of kisspeptin-immunoreactive cells in the infundibular nucleus synthesize the tachykinin peptide neurokinin B
  - reference_id: PMID:19079066
    supporting_text: These findings establish that NKB action via the NK3R is necessary for the central neuroendocrine control of human reproduction.
proposed_new_terms: []
suggested_questions:
- question: >-
    Which prohormone convertases process proNKB in hypothalamic KNDy neurons and in
    placental syncytiotrophoblast, and is the gamma isoform, whose splice removes the
    NKB-coding segment, translated into a peptide with any activity of its own?
- question: >-
    Why does hypogonadotropism reverse in adulthood in many patients lacking neurokinin B,
    and does signalling of the remaining tachykinins through NK1R or NK2R, as suggested by
    the Tac2-null mouse, account for it?
suggested_experiments:
- description: >-
    Measure the peptide products of each TAC3 splice isoform directly: express the three
    isoforms in a neuroendocrine cell line with and without knockdown of PCSK1 and PCSK2,
    and quantify amidated NKB and any novel C-terminal peptides by targeted mass
    spectrometry, pairing each product with an NK3R, NK1R and NK2R activation assay.
  hypothesis: >-
    Only the isoforms retaining residues 80-98 yield amidated NKB, and the convertase
    requirement differs between neuronal and placental processing, which would explain
    tissue differences in the circulating peptide.
- description: >-
    Separate the ligand from the receptor-bearing neurons in the thermoregulatory circuit:
    in a rodent model, delete Tac2 conditionally in arcuate kisspeptin neurons in adulthood
    and record tail-skin and core temperature with cutaneous vasomotor responses, comparing
    with NK3R antagonism and with ablation of NK3R-expressing neurons.
  hypothesis: >-
    Endogenous NKB from KNDy neurons is itself required for the heat-dissipation responses
    that NK3R antagonists suppress, rather than those responses depending only on the
    integrity of NK3R-expressing neurons.
knowledge_gaps:
- gap_statement: >-
    How neurokinin B signalling triggers the heat-dissipation episodes seen as hot flushes
    is not established: the neurons it acts on in the human hypothalamus, the effector
    pathway to cutaneous vasodilatation and sweating, and whether this is the same KNDy
    population that paces gonadotropin-releasing hormone, are all unresolved.
  boundary: >-
    What is established is that intravenous NKB induces flushes in women, that NKB
    expression in the infundibular nucleus rises after menopause and is suppressed by
    estrogen, and that ablating NK3-expressing arcuate neurons in the rat lowers tail-skin
    temperature and blunts the estradiol effect on body temperature. What is not known is
    the human circuit, and in particular no experiment isolates a requirement for the NKB
    ligand itself rather than for the integrity of the NK3R-expressing neurons.
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  status: OPEN
  significance: >-
    This is the mechanism of a validated drug class: NK3R antagonists relieve menopausal
    vasomotor symptoms, so identifying the neurons and effector pathway through which
    endogenous NKB acts would explain how that blockade works and how the
    thermoregulatory and reproductive arms of NKB signalling are separated.
  resolution: >-
    Map NKB-responsive neurons and their projections in human hypothalamus, and test in an
    animal model whether removing the ligand from arcuate KNDy neurons in adulthood
    reproduces the thermoregulatory phenotype of receptor blockade.
  provenance:
  - reference_id: PMID:25683060
    supporting_text: However, the central mechanisms through which sex steroid deficiency triggers flushing remain unclear.
  - reference_id: PMID:23150555
    supporting_text: KNDy neuron ablation consistently reduced tail-skin temperature (T(SKIN)), indicating that KNDy neurons facilitate cutaneous vasodilatation, an important heat dissipation effector.
