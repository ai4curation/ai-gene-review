- term:
    id: GO:0048018
    label: receptor ligand activity
  evidence_type: IDA
  original_reference_id: PMID:37391393
  qualifier: enables
  review:
    summary: >-
      NKB is the most potent natural agonist of NK3R; cryo-EM structures of the NKB-bound
      NK3R-Gq complex show how the amidated C-terminal motif engages the orthosteric
      pocket, and receptor activation by NKB was measured directly.
    action: ACCEPT
    reason: >-
      This is the core molecular function of the gene product: the processed decapeptide
      binds NK3R and increases its activity. It is supported by direct structural and
      signalling assays on the human peptide and receptor, by the ligand-side evidence
      from patient variants (the M90T peptide is about tenfold less potent), and it is the
      MF both cached GO-CAMs assign to TAC3 opposite TACR3 GO:0016498. Keeping the MF on
      the ligand side and the receptor activity on TACR3 also keeps the two reviews
      consistent.
    supported_by:
    - reference_id: PMID:37391393
      supporting_text: Endogenous neurokinin B (NKB) is the most potent natural agonist of NK3R.
    - reference_id: PMID:37391393
      supporting_text: NKB preferentially activates NK3R coupled to the Gαq family of G proteins for intracellular signal transduction
    - reference_id: PMID:19079066
      supporting_text: The amidated mutant peptide (predicted to be the form that would occur in nature) had severely reduced activity, being around 10 fold less potent than amidated wild type NKB at stimulating the NK3R
    - reference_id: PMID:37391393
      supporting_text: b IP-one accumulation assay of NK3R activation by NKB, SP, and senktide.
    - reference_id: file:human/TAC3/TAC3-uniprot.txt
