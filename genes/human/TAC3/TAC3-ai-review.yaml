- term:
    id: GO:0033686
    label: positive regulation of luteinizing hormone secretion
  evidence_type: IMP
  original_reference_id: PMID:20194706
  qualifier: involved_in
  review:
    summary: >-
      Loss of the NKB decapeptide in humans produces normosmic congenital
      hypogonadotropic hypogonadism with very low LH that pulsatile GnRH corrects, placing
      NKB upstream of GnRH release and of LH secretion; NKB is made by arcuate KNDy
      neurons whose NKB-NK3R signalling patterns pulsatile kisspeptin and GnRH output.
    action: NEW
    reason: >-
      The gene's physiological role is not captured by any existing row. Three human TAC3
      mutations that delete or inactivate the decapeptide give absent puberty with
      prepubertal gonadotropins and strikingly low LH, and pulsatile GnRH restores LH,
      sex steroids and in one case fertility, which locates the defect above GnRH release
      (PMID:20194706, PMID:19079066, PMID:20332248). Participation: NKB is the signalling
      molecule that acts on NK3R within the KNDy network to shape pulsatile kisspeptin and
      GnRH secretion (PMID:19776272), so it performs a regulatory step, not merely being
      required downstream. Comparator check (QuickGO, human, GO:0032276 and descendants,
      2026-11-13): the peptide ligands KISS1 (GO:0033686, IBA), LEP (GO:0033686, IEA),
      NPVF (GO:0032277) and the inhibins carry gonadotropin-secretion regulation terms
      alongside the receptors KISS1R, GNRHR and TACR3, so GO practice does put these terms
      on the hormone as the regulator. The companion TACR3 review accepts GO:0033686 on the
      receptor, so the pair is annotated consistently. Caveat, stated rather than hidden:
      the sign is not uniform across systems, since central NKB and NK3R agonists can
      suppress LH in rodents and a 30-minute NKB infusion did not change LH in women; the
      positive direction here rests on the human loss-of-function phenotype.
    supported_by:
    - reference_id: PMID:20194706
      supporting_text: We demonstrated that these two mutations, respectively, deleted neurokinin B and truncated its receptor NK3R.
    - reference_id: PMID:20194706
      supporting_text: pulsatile GnRH administration normalized circulating sex steroids, LH release, and restored fertility in one subject
    - reference_id: PMID:20194706
      supporting_text: Our data demonstrate the hypothalamic origin of the gonadotropin deficiency in these genetic forms of normosmic CHH.
    - reference_id: PMID:19079066
      supporting_text: All subjects who are in the second decade of life or older show unequivocal evidence of failure of pubertal progression with low circulating sex steroid levels and pre-pubertal levels of circulating gonadotropins.
    - reference_id: PMID:19776272
      supporting_text: We propose a model whereby NKB and dynorphin act autosynaptically on kisspeptin neurons in the Arc to synchronize and shape the pulsatile secretion of kisspeptin and drive the release of GnRH from fibers in the median eminence.
