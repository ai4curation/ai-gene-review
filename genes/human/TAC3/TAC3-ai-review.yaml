    summary: >-
      Traceable-author-statement annotation (2003) that the placental NKB peptide binds a
      signalling receptor. Correct, but the generic binding term says nothing about which
      receptor or that NKB activates it.
    action: MODIFY
    reason: >-
      NKB is the preferred endogenous agonist of NK3R and activates it (cryo-EM and IP-one
