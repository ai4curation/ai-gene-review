id: Q9UHF0
gene_symbol: TAC3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  TAC3 encodes preprotachykinin-3, a 121-residue secretory precursor that is cleaved
  at flanking dibasic sites and C-terminally amidated to release neurokinin B (NKB,
  neuromedin K; residues 81-90, DMHDFFVGLM-NH2), a member of the tachykinin
  neuropeptide family defined by the C-terminal Phe-X-Gly-Leu-Met-NH2 motif. NKB is
  the preferred and most potent endogenous agonist of the neurokinin-3 receptor (NK3R,
  TACR3); it binds the orthosteric pocket of NK3R and activates Gq/11, phospholipase C
  and intracellular calcium signalling, and it can also activate NK1R and NK2R with
  lower potency. The amidated C-terminal methionine is required for full activity: the
  hypogonadotropic hypogonadism variant M90T lowers potency at NK3R about tenfold. NKB
  is synthesized by neurons of the hypothalamic arcuate (infundibular) nucleus that
  also make kisspeptin and dynorphin (KNDy neurons) and is present in their axons,
  where NKB-NK3R signalling within the KNDy network supports the pulsatile release of
  kisspeptin and gonadotropin-releasing hormone and hence luteinizing hormone
  secretion. Biallelic loss-of-function TAC3 mutations cause normosmic congenital
  hypogonadotropic hypogonadism (HH10) with absent puberty and very low LH, corrected
  by pulsatile GnRH; many patients later show reversal, and Tac2-deficient female mice
  show delayed sexual maturation with preserved adult fertility. Infundibular NKB
  expression is suppressed by estrogen and rises markedly after menopause or
  ovariectomy, and exogenous NKB induces hot flushes in women, implicating NKB-NK3R
  signalling in the hypothalamic control of heat dissipation, although the human
  circuit is not defined. NKB is also made by the placental syncytiotrophoblast and
  secreted into maternal plasma during pregnancy, with raised levels in pre-eclampsia;
  pressor and other effects described from rodent agonist pharmacology are not
  established physiological roles. Of the three splice isoforms, isoform 3 lacks the
  NKB-coding segment.
