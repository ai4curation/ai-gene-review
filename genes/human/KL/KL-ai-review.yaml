  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:1101771
  - PANTHER:PTN008498336
  review:
    summary: KL is an integral component of the FGF23 receptor, making FGF23-FGFR1c signaling possible.
    action: ACCEPT
    reason: KL binds FGF23 and FGFR1c and is required for FGF23-induced FGFR activation; the anti-Klotho antibody
      abolishes FGF23 function in vivo. KL does work in the pathway by forming the ligand-binding part of the
      receptor complex, so involvement in FGFR signaling is a core process. Consistent with the PAINT placement
      for the Klotho clade.
    additional_reference_ids:
