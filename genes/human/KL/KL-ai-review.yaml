- term:
    id: GO:0003085
    label: negative regulation of systemic arterial blood pressure
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q9Z2Y9
  - ensembl:ENSRNOP00000001449
  review:
    summary: Electronic transfer from rat Kl, whose annotation rests on intracerebroventricular klotho shRNA
      raising blood pressure during cold exposure.
    action: MARK_AS_OVER_ANNOTATED
    reason: The rat source shows that brain Klotho knockdown potentiates cold-induced hypertension through
      endothelin-1 and sympathetic activation, a systemic and indirect effect. KL has no demonstrated molecular
      role within blood-pressure regulation; its established activity is FGF23 co-reception. The claim is not
      impossible physiologically but exceeds what is known about how the protein acts.
    additional_reference_ids:
    - PMID:20086041
    supported_by:
    - reference_id: PMID:20086041
      supporting_text: silencing of brain klotho increased ET1 production and the sympathetic nervous activity
      reference_section_type: ABSTRACT
- term:
    id: GO:0004553
    label: hydrolase activity, hydrolyzing O-glycosyl compounds
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR001360
  review:
    summary: InterPro GH1-family mapping to O-glycosyl hydrolase activity.
    action: MARK_AS_OVER_ANNOTATED
    reason: KL has two GH1-like domains but each lacks one catalytic glutamate. Weak beta-glucuronidase activity
      was reported for a mouse Klotho-Fc fusion, but the human ectodomain used for the crystal structure failed
      to hydrolyse glucuronidase or sialidase substrates, and the pocket loops are incompatible with canonical
      GH1 catalysis. The activity is contested and has no established physiological substrate, so the family-level
      catalytic term overstates what KL does.
    additional_reference_ids:
    - PMID:29342138
    - PMID:14701853
    - file:human/KL/KL-deep-research-falcon.md
    supported_by:
    - &id015
      reference_id: file:human/KL/KL-uniprot.txt
      supporting_text: Contains 2 glycosyl hydrolase 1 regions. However, the first region lacks the essential
        Glu active site residue at position 239
    - &id003
      reference_id: PMID:29342138
      supporting_text: Moreover, both KL domains lack one of the key catalytic glutamates deep within the putative
        catalytic pocket.
      reference_section_type: RESULTS
    - &id002
      reference_id: PMID:29342138
      supporting_text: Indeed, αKlothoecto failed to hydrolyze substrates for both sialidase and β-glucuronidase
        in vitro
      reference_section_type: RESULTS
    - &id001
      reference_id: PMID:14701853
      supporting_text: An enzymatic activity of Klotho was observed only with 4-methylumbelliferyl beta-D-glucuronide
      reference_section_type: ABSTRACT
      full_text_unavailable: true
    - reference_id: file:human/KL/KL-deep-research-falcon.md
      supporting_text: The weak in vitro glucuronidase activity may represent residual capacity rather than
        a physiologically significant function.
- term:
    id: GO:0004566
    label: beta-glucuronidase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - UniProtKB:O35082
  - ensembl:ENSMUSP00000077899
  - RHEA:17633
  - EC:3.2.1.31
  review: &id004
    summary: Beta-glucuronidase activity transferred from mouse Klotho, based on the Tohyama 2004 in vitro
      assay of a Klotho-Fc fusion.
    action: MARK_AS_OVER_ANNOTATED
    reason: The mouse study detected activity only against an artificial 4-methylumbelliferyl glucuronide and,
      by competition, steroid glucuronides. The human alphaKlotho ectodomain failed to hydrolyse beta-glucuronidase
      substrates in the Chen 2018 study, and both KL domains lack a catalytic glutamate. The reported activity
      is weak, contested, and not linked to any physiological function; KL acts through FGF23 co-reception.
      It is retained as a reported, non-core in vitro activity rather than removed outright because a positive
      experimental report exists.
    additional_reference_ids:
    - PMID:14701853
    - PMID:29342138
    - file:human/KL/KL-deep-research-falcon.md
    supported_by:
    - *id001
    - *id002
    - *id003
    - reference_id: file:human/KL/KL-deep-research-falcon.md
      supporting_text: The weak in vitro glucuronidase activity may represent residual capacity rather than
        a physiologically significant function.
