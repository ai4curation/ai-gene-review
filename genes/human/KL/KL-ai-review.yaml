- term:
    id: GO:0055062
    label: phosphate ion homeostasis
  evidence_type: IMP
  original_reference_id: PMID:17710231
  qualifier: involved_in
  review:
    summary: Homozygous loss-of-function KL H193R causes hyperphosphatemic tumoral calcinosis by impairing
      FGF23 signaling.
    action: NEW
    reason: 'KL performs work in this process as the ligand-binding part of the FGF23 receptor in kidney, not
      merely as a required factor: FGF23 cannot engage FGFR1c without it. Comparator check: FGF23 carries phosphate
      ion homeostasis (IMP); FGFR1 and KLB do not, the latter because it serves other FGFs. The human disease
      phenotype is precisely loss of FGF23-dependent phosphate control.'
    supported_by:
