- term:
    id: GO:0015026
    label: coreceptor activity
  evidence_type: IDA
  original_reference_id: PMID:29342138
  qualifier: enables
  review:
    summary: alphaKlotho binds FGF23 and FGFR1c and is required for FGF23 to activate FGFR1c; it cannot signal
      alone.
    action: NEW
    reason: 'Coreceptor activity (binding an extracellular messenger and cooperating with a nearby primary
      receptor to initiate a change in cell activity) describes KL exactly: it converts FGFR1c into a high-affinity
      FGF23 receptor, both membrane-bound and as the soluble ectodomain. This matches the core MF used for
      the paralog KLB. Fibroblast growth factor binding and FGF receptor binding already present describe the
      two halves of this activity.'
