id: Q9UEF7
gene_symbol: KL
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: KL encodes alpha-Klotho, a glycosylated type I single-pass transmembrane protein whose ectodomain
  consists of two tandem glycoside hydrolase family 1-like domains (KL1 and KL2) that lack the essential catalytic
  glutamates of active family members. Expressed mainly in kidney tubules, parathyroid gland and choroid plexus,
  alpha-Klotho binds the bone-derived hormone FGF23 and binds FGF receptors, principally FGFR1c, forming a
  ternary complex in which it acts as a non-enzymatic scaffold that converts FGFR1c into a high-affinity FGF23
  receptor. FGF23-Klotho-FGFR signaling promotes renal phosphate excretion and suppresses 1,25-dihydroxyvitamin
  D synthesis; loss of human KL function causes hyperphosphatemic tumoral calcinosis. The ectodomain is shed
  from the cell surface and circulates in blood, urine and cerebrospinal fluid, where it can still serve as
  an FGF23 co-receptor, and a minor splice transcript encodes a KL1-only secreted form. Weak beta-glucuronidase
  activity has been reported in vitro but is contested, and the FGF23-independent hormonal effects attributed
  to soluble Klotho remain mechanistically unresolved.
