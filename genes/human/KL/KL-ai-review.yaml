- term:
    id: GO:0005975
    label: carbohydrate metabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR001360
  review:
    summary: InterPro GH1-family mapping to carbohydrate metabolic process.
    action: REMOVE
    reason: KL has no demonstrated role in carbohydrate metabolism. The only reported chemistry is weak in
      vitro glucuronide hydrolysis, which the human ectodomain did not reproduce, and both GH1-like domains
      lack a catalytic glutamate. The family mapping assumes a conventional glycosidase, which KL is not; its
      physiological role is FGF23 co-reception.
    additional_reference_ids:
    - PMID:29342138
    - file:human/KL/KL-deep-research-falcon.md
    supported_by:
    - *id003
    - *id002
    - *id015
    - reference_id: file:human/KL/KL-deep-research-falcon.md
      supporting_text: The weak in vitro glucuronidase activity may represent residual capacity rather than
        a physiologically significant function.
- term:
    id: GO:0008422
    label: beta-glucosidase activity
  evidence_type: TAS
  original_reference_id: PMID:9363890
  qualifier: enables
  review:
    summary: Beta-glucosidase activity asserted from sequence similarity in the original klotho discovery paper.
    action: REMOVE
    reason: The 1997 paper reports only sequence similarity to beta-glucosidases, not activity. When recombinant
      Klotho was later screened against a series of 4-methylumbelliferyl beta-glycosides, activity was seen
      only with the glucuronide, not glucosides, and the human ectodomain lacks catalytic glutamates in both
      GH1-like domains. Beta-glucosidase activity is therefore contradicted.
    additional_reference_ids:
    - PMID:14701853
    - PMID:29342138
    - file:human/KL/KL-deep-research-falcon.md
    supported_by:
    - reference_id: PMID:9363890
      supporting_text: The gene encodes a membrane protein that shares sequence similarity with the beta-glucosidase
        enzymes.
      reference_section_type: ABSTRACT
      full_text_unavailable: true
    - *id001
    - *id003
    - reference_id: file:human/KL/KL-deep-research-falcon.md
      supporting_text: The weak in vitro glucuronidase activity may represent residual capacity rather than
        a physiologically significant function.
- term:
