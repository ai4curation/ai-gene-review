- term:
    id: GO:0030501
    label: positive regulation of bone mineralization
  evidence_type: IMP
  original_reference_id: PMID:12110410
  qualifier: involved_in
  review:
    summary: Based on association of a KL microsatellite allele with bone density in postmenopausal women.
    action: MARK_AS_OVER_ANNOTATED
    reason: The study is a genetic association of a non-coding CA-repeat polymorphism with bone density, with
      no association in the overall population and nominal subgroup associations. That does not show that KL
      acts in bone mineralization, or in which direction. KL affects the skeleton indirectly through FGF23-dependent
      phosphate and vitamin D control; human loss of KL causes hyperphosphatemia and ectopic calcification.
      The curated annotation reflects the paper, but the process claim goes beyond the evidence.
    supported_by:
    - reference_id: PMID:12110410
      supporting_text: None of the genotypes was associated with bone density in the overall population
      reference_section_type: ABSTRACT
      full_text_unavailable: true
    - &id019
      reference_id: PMID:17710231
      supporting_text: loss-of-function mutations in human KL impair FGF23 bioactivity, underscoring the essential
        role of KL in FGF23-mediated phosphate and vitamin D homeostasis in humans
      reference_section_type: ABSTRACT
- term:
    id: GO:0033280
    label: response to vitamin D
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q9Z2Y9
  - ensembl:ENSRNOP00000001449
  review:
    summary: Electronic transfer from rat Kl, whose annotation is based on expression change in response to
      vitamin D.
    action: MARK_AS_OVER_ANNOTATED
    reason: This is an electronic transfer from a rat expression (IEP) annotation. A change in KL expression
      after the stimulus does not show that KL protein acts in the response, and there is no mechanistic evidence
      for this in human. Vitamin D induces klotho expression as part of the FGF23 feedback loop, but KL itself
      acts upstream of vitamin D metabolism via FGF23 signaling rather than in the response to vitamin D.
    supported_by:
