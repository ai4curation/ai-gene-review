- id: PMID:10631108
  title: Establishment of the anti-Klotho monoclonal antibodies and detection of Klotho protein in kidneys.
  findings:
  - statement: Klotho protein is present in kidney membrane fractions.
    supporting_text: KM2076 and KM2119 specifically recognized a 130 kDa Klotho protein in the mouse and human
      kidney membrane fractions
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract verified against PubMed. Monoclonal antibodies detect 130 kDa Klotho in human and
      mouse kidney membranes and in transfected CHO supernatant, supporting both plasma-membrane and extracellular
      location.
  full_text_unavailable: true
- id: PMID:12110410
  title: Association of klotho gene polymorphism with bone density and spondylosis of the lumbar spine in postmenopausal
    women.
  findings:
  - statement: No genotype association with bone density in the overall cohort.
    supporting_text: None of the genotypes was associated with bone density in the overall population
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: LOW
    correctness: MISCITED
    review_notes: Abstract verified against PubMed. This is an association study of a non-coding CA-repeat
      polymorphism with bone density, negative in the overall population; it does not establish that KL acts
      in bone mineralization, so it is weak support for the IMP process annotation it underpins.
  full_text_unavailable: true
- id: PMID:15135068
  title: 'Secreted Klotho protein in sera and CSF: implication for post-translational cleavage in release of
    Klotho protein from cell membrane.'
  findings:
  - statement: Secreted Klotho is present in serum and cerebrospinal fluid.
    supporting_text: Newly established antibodies against Klotho allowed the detection of secreted Klotho,
      a candidate for the putative humoral factor, in sera and cerebrospinal fluid.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract verified against PubMed. First detection of circulating Klotho in human serum and
      CSF; the 130 kDa size indicates the shed ectodomain rather than the predicted splice product.
  full_text_unavailable: true
- id: PMID:18829467
  title: C-terminal tail of FGF19 determines its specificity toward Klotho co-receptors.
  findings:
  - statement: FGF19 binds both alpha- and beta-Klotho in vitro.
    supporting_text: We previously showed that FGF19 can bind to both alpha and betaKlotho
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract verified against PubMed. Chimera study supports direct binding of endocrine FGFs
      to alpha-Klotho and localizes specificity to the FGF C-terminal tail.
  full_text_unavailable: true
