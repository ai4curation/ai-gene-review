suggested_questions:
- question: Does alpha-Klotho retain any physiologically relevant glycosidase activity, reconciling the positive
    glucuronidase report for a mouse Klotho-Fc fusion with the negative result for the human ectodomain?
- question: Which binding partner mediates the FGF23-independent effects attributed to soluble Klotho, such
    as modulation of insulin/IGF1 signaling, Wnt signaling and TRPV5 or ROMK channel surface abundance, and
    do these involve glycan binding rather than hydrolysis?
- question: Is phosphate ion homeostasis an appropriate process term for KL given that FGF23 carries it but
    FGFR1 and KLB do not, or is the GO convention to place endocrine-outcome terms only on the hormone?
- question: What fraction of circulating Klotho arises from ADAM-mediated ectodomain shedding versus the KL1-only
    splice transcript, and does the splice product have measurable co-receptor activity?
suggested_experiments:
- hypothesis: Any glucuronidase activity of Klotho is separable from, and dispensable for, its FGF23 co-receptor
    function.
  description: Assay purified, correctly glycosylated human alpha-Klotho ectodomain and the mouse Klotho-Fc
    construct side by side against 4-methylumbelliferyl glucuronide and steroid glucuronides with sensitive
    product detection, then test matched catalytic-site variants for FGF23 binding and FGFR1c activation in
    a Klotho-null cell line.
  experiment_type: Parallel enzymology and separation-of-function signaling assay
- hypothesis: The soluble shed ectodomain supports FGF23 signaling in vivo in tissues that lack membrane-bound
    KL.
  description: Compare mice expressing only a non-sheddable membrane-anchored KL with mice expressing only
    the soluble ectodomain from a Klotho-null background, and measure FGF23-dependent phosphaturia, CYP27B1
    and CYP24A1 expression and ERK activation in proximal tubule and in FGFR-positive, KL-negative tissues.
  experiment_type: Allele-specific mouse genetics with endocrine readouts
- hypothesis: FGF23-independent effects of soluble Klotho require a distinct cell-surface receptor.
  description: Perform proximity labeling and unbiased CRISPR screening for loss of soluble-Klotho responsiveness
    in cells lacking FGFRs, then validate candidate receptors by binding measurements and by testing whether
    KL variants that lose FGF23 co-receptor activity retain the FGF23-independent response.
  experiment_type: Interaction proteomics plus genetic screen
