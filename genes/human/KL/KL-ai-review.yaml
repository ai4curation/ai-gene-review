- id: PMID:29342138
  title: α-Klotho is a non-enzymatic molecular scaffold for FGF23 hormone signalling.
  findings:
  - statement: Alpha-Klotho is a non-enzymatic scaffold that tethers FGF23 and FGFR1c together.
    supporting_text: The structure reveals that αKlotho serves as a non-enzymatic scaffold that simultaneously
      tethers FGFR1c and FGF23 to implement FGF23-FGFR1c proximity and hence stability.
    reference_section_type: ABSTRACT
  - statement: The shed soluble ectodomain also works as an FGF23 co-receptor.
