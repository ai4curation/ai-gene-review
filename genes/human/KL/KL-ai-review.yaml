core_functions:
- description: At the plasma membrane of renal tubular, parathyroid and choroid-plexus cells, and as the shed
    soluble ectodomain, alpha-Klotho binds FGF23 and binds FGFR1c, acting as the non-enzymatic co-receptor
    that converts FGFR1c into a high-affinity FGF23 receptor. This confers endocrine-FGF specificity on the
    receptor and lets FGF23 control renal phosphate handling and vitamin D metabolism.
  molecular_function:
    id: GO:0015026
    label: coreceptor activity
  directly_involved_in:
  - id: GO:0008543
    label: fibroblast growth factor receptor signaling pathway
  - id: GO:0055062
    label: phosphate ion homeostasis
  locations:
  - id: GO:0005886
    label: plasma membrane
  - id: GO:0005576
    label: extracellular region
  supported_by:
  - reference_id: PMID:29342138
    supporting_text: The structure reveals that αKlotho serves as a non-enzymatic scaffold that simultaneously
      tethers FGFR1c and FGF23 to implement FGF23-FGFR1c proximity and hence stability.
    reference_section_type: ABSTRACT
  - reference_id: PMID:17086194
    supporting_text: Thus, the concerted action of Klotho and FGFR1(IIIc) reconstitutes the FGF23 receptor.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - reference_id: PMID:17710231
    supporting_text: loss-of-function mutations in human KL impair FGF23 bioactivity, underscoring the essential
      role of KL in FGF23-mediated phosphate and vitamin D homeostasis in humans
    reference_section_type: ABSTRACT
