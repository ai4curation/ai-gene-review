  review:
    summary: The generic actin-binding mapping should be refined to F-actin binding.
    action: MODIFY
    reason: The InterPro ADF-homology mapping captures genuine actin binding, and cloned human
      ADF/destrin was shown to bind and sever actin filaments. The more informative retained
      molecular function is actin filament binding.
