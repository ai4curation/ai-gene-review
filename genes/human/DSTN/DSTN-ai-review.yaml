id: P60981
gene_symbol: DSTN
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'Destrin, also known as actin-depolymerizing factor, is a small ADF/cofilin-family actin
  regulator that binds G-actin and F-actin and promotes pH-sensitive actin-filament severing and depolymerization.
  It shares the ancient eukaryotic actin-remodeling core with CFL1 and CFL2, but the currently reviewed
  human evidence mainly supports its general cytoplasmic actin-cytoskeleton role rather than the muscle-specialized
  CFL2 program or CFL1-specific mammalian signaling contexts.'
