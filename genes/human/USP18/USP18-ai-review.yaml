core_functions:
- description: Interferon-induced ISG15 deconjugase that hydrolyzes ISG15 from 
    ISGylated proteins to maintain the balance of protein ISGylation, with 
    full-length cytoplasmic and short nuclear isoforms contributing to 
    compartment-specific deISGylation.
  molecular_function:
    id: GO:0019785
    label: ISG15-specific peptidase activity
  locations:
  - id: GO:0005829
    label: cytosol
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:11788588
    supporting_text: UBP43 is the first bona fide ISG15-specific protease 
      reported.
  - reference_id: PMID:38421872
    supporting_text: the E3 HERC5 catalyzes the ISGylation of cytoplasmic cGAS 
      at lysine 21, 187, 219, and 458, whereas Ubl carboxy-terminal hydrolase 18
      removes the ISGylation of cGAS.
  - reference_id: PMID:22170061
    supporting_text: USP18-sf shows different subcellular distribution compared 
      with the full-length protein and enhanced deISGylation activity in the 
      nucleus.
- description: 'Catalysis-independent negative feedback factor for type I interferon
    signaling: STAT2 recruits USP18 to the IFNAR2 cytosolic tail, where USP18 interferes
    with productive ligand-receptor/JAK1 signaling complex assembly.'
  molecular_function:
    id: GO:0140678
    label: molecular function inhibitor activity
  directly_involved_in:
  - id: GO:0060339
    label: negative regulation of type I interferon-mediated signaling pathway
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:28165510
    supporting_text: We found that STAT2 recruits USP18 to the type I IFN 
      receptor subunit IFNAR2 via its constitutive membrane-distal STAT2-binding
      site.
  - reference_id: PMID:16710296
    supporting_text: Ubp43 specifically binds to the IFNAR2 receptor subunit and
      inhibits the activity of receptor-associated JAK1 by blocking the 
      interaction between JAK and the IFN receptor.
- description: Noncatalytic adaptor for the STING innate-immune pathway, 
    recruiting USP20 to STING so USP20 can remove destabilizing K48-linked 
    ubiquitin chains and sustain DNA-virus-triggered signaling.
  molecular_function:
    id: GO:0060090
    label: molecular adaptor activity
  directly_involved_in:
  - id: GO:0140374
    label: antiviral innate immune response
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:27801882
    supporting_text: USP18 did not deubiquitinate STING in vitro but facilitated
      USP20 to catalyze deubiquitination of STING in a manner independent of the
      enzymatic activity of USP18.
suggested_questions:
- question: Is there a more precise GO molecular function term than GO:0060090 
    molecular function inhibitor activity for the STAT2-dependent USP18
    activity that sterically inhibits IFNAR2-JAK1 signaling?
- question: How broadly does USP18 act as a ubiquitin-chain DUB on cellular 
    substrates such as SLC7A11 and TAK1 compared with its better established 
    ISG15-specific deconjugase activity?
suggested_experiments:
- description: Compare wild-type, catalytic-dead, SLC7A11-binding-defective, 
    STAT2-binding-defective, and USP20/STING-binding-defective USP18 alleles at 
    endogenous expression to partition deISGylation, SLC7A11 deubiquitination, 
    IFNAR2 feedback, and STING-adaptor functions.
