id: Q9UMW8
gene_symbol: USP18
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'USP18 is an interferon-induced USP-family cysteine protease with a dominant
  ISG15-specific isopeptidase activity that removes ISG15 from conjugated proteins
  in the cytoplasm and, through an N-terminally truncated isoform, the nucleus. It
  also has catalytic ubiquitin-chain deconjugase activity on selected substrates such
  as TAK1:TAB1 and SLC7A11, and noncatalytic signaling functions in innate immunity:
  it binds the IFNAR2 receptor chain in a STAT2-dependent negative-feedback mechanism
  that blocks type I interferon signaling, and it recruits USP20 to STING to promote
  DNA-virus-triggered antiviral signaling.'
