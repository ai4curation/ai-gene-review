    label: cysteine-type deubiquitinase activity
  evidence_type: EXP
  original_reference_id: PMID:27801882
  qualifier: enables
  review:
    summary: USP18 is catalytically a deubiquitinase, but PMID:27801882 supports
      its noncatalytic USP20/STING adaptor role rather than USP18-mediated STING
      deubiquitination.
    action: KEEP_AS_NON_CORE
    reason: USP18 directly removes ubiquitin chains from TAK1:TAB1 and SLC7A11 
      in other contexts, so the generic DUB activity is true but secondary to 
      its ISG15 isopeptidase and type I interferon feedback roles. The original 
      paper for this row instead reports that USP18 facilitates USP20-mediated 
      STING deubiquitination independently of USP18 catalytic activity; that 
      source is already represented by GO:0060090 molecular adaptor activity.
    additional_reference_ids:
    - PMID:38959043
    supported_by:
    - reference_id: PMID:27801882
      supporting_text: USP18 did not deubiquitinate STING in vitro but 
        facilitated USP20 to catalyze deubiquitination of STING in a manner 
        independent of the enzymatic activity of USP18.
    - reference_id: PMID:38959043
      supporting_text: USP18 appears to be a bona fide DUB for SLC7A11 
        stabilization at posttranslational levels.
    source_defects:
    - defect_type: WRONG_TERM
      resource: UNIPROT
      requested_change: CHECK
      asserted_value: GO:0004843
      confidence: PROBABLE
      explanation: PMID:27801882 directly supports a noncatalytic USP18 adaptor
        role in recruiting USP20 to STING, and explicitly says USP18 did not
        itself deubiquitinate STING in vitro. The cached abstract therefore
        disputes this reference's support for generic GO:0004843 while not
        ruling out USP18 deubiquitination of another substrate in the unread
        full text. The generic DUB claim itself is retained on the Reactome
        TAK1:TAB1 row and the PMID:38959043 SLC7A11 row; UniProt should check
        whether PMID:27801882 should instead support only the GO:0060090
        molecular adaptor activity row.
      supported_by:
