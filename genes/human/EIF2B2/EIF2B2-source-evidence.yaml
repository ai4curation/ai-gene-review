unresolved:
- source_index: 32
  source_reference: PMID:15776425
  reason: The authentic PMID:15776425 abstract identifies an EIF2B2 Pro196Ser variant among patients with
    eIF2B-related white-matter disorders. Publisher and PDF routes were blocked and full operative genotype/phenotype
    analyses were not recovered. This supports clinical relevance but does not resolve the source-specific
    developmental-process assertion. Preserve the experimental source rather than infer a wrong gene or
    replace unknown observations with a mechanism.
- source_index: 34
  source_reference: PMID:12499492
  reason: PMID:12499492 is an authentic severe infantile VWM report whose abstract foregrounds an EIF2B5
    variant and metabolic abnormalities. The full operative text was not recovered. This does not establish
    beta misattribution, but the source-specific heat-response evidence remains inaccessible; preserve
    it as undecided. The separate rat-ortholog heat-response row is evaluated on its own evidence.
- source_index: 36
  source_reference: PMID:15217090
  reason: The recovered PMID:15217090 Methods, Results and Discussion examine five VWM autopsies; patient
    5 is explicitly EIF2B2-mutant, whereas patients 1–4 have EIF2B5 mutations. The beta-associated infant
    has prominent oligodendrocyte apoptosis, and the study measures cell density, survival and proliferation.
    These are positive observations of beta-associated glial pathology. GO:0014003 concerns progression
    from commitment to a fully differentiated oligodendrocyte. The selected original evidence leaves unresolved
    whether EIF2B2 contributes to that developmental progression, altered survival, or both; the paper
    discusses the unresolved mechanism. UNDECIDED records this scientific uncertainty and preserves the
    curator assertion. It is not based solely on the abstract-only normal cache, and it does not require
    an isolated biochemical differentiation activity.
- source_index: 41
  source_reference: PMID:8626696
  reason: The recovered PMID:8626696 Results and Discussion demonstrate rapid whole-eIF2B exchange activation
    in primary human T cells after ionomycin/PMA, with PHA responsiveness also reported. Later increases
    in beta protein and mRNA are distinct from the early activation of existing factor. These are positive
    translational responses during T-cell activation. GO:0050852 concerns the molecular signals initiated
    by antigen-receptor cross-linking. The available observations do not resolve whether beta performs
    part of that signaling process or is regulated downstream as translation increases. UNDECIDED preserves
    this source-specific scientific uncertainty without asserting absence of a TCR role. Selected Results/Discussion
    were read; complete operative Methods remain unavailable, but that access limit is not the sole basis
    for the decision.
