      the regulatory subcomplex and gamma/epsilon in the catalytic subcomplex, citing PMID:25858979, PMID:27023709
      and PMID:31048492. The independent PMID:25858979 advisory identifies whole-complex GDP-release experiments
      and CHO Eif2b4 delta-mutant experiments, not isolated-beta catalysis. Supplementary Methods and
