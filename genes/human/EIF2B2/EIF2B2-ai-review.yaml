- term:
    id: GO:0001541
    label: ovarian follicle development
  evidence_type: IMP
  original_reference_id: PMID:15507143
  qualifier: involved_in
  review:
    summary: The cited ovarian-failure screen does not demonstrate follicle-development activity.
    action: MARK_AS_OVER_ANNOTATED
    reason: PMID:12707859 reports ovarian failure and white-matter disease in patients 944 and 992 with
      EIF2B2 variants; this is positive human disease evidence. The original source PMID:15507143 then
      screened 93 women with isolated premature ovarian failure for selected known EIF2B2/EIF2B4/EIF2B5
      variants and found none. Neither result establishes which step of follicle formation or maturation
      depends on EIF2B2. The earlier paper explicitly leaves decreased follicle formation, increased loss,
      altered recruitment and interrupted maturation as alternatives. The GO:0001541 assertion therefore
      overstates the source-specific developmental resolution; this does not deny EIF2B2-associated ovarian
      disease or generalize the negative screen to all variants.
    supported_by:
    - reference_id: PMID:15507143
    - reference_id: file:human/EIF2B2/EIF2B2-source-evidence.yaml
    - reference_id: PMID:12707859
