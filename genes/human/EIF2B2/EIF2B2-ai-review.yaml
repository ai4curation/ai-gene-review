id: P49770
gene_symbol: EIF2B2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: EIF2B2 encodes the beta subunit of the cytosolic eukaryotic translation initiation factor
  eIF2B. Beta participates in assembly and regulation of this multisubunit complex, which releases GDP
  from eIF2 so that GTP can bind and the initiation factor can return to protein synthesis. Inhibition
  of eIF2B by phosphorylated eIF2alpha couples translation initiation to cellular stress responses. Beta
  contributes to the function of the assembled exchange factor through its structural and regulatory role.
