    label: mitochondrial matrix
  supported_by:
  - reference_id: PMID:21907147
    supporting_text: >-
      A portion of the Met-tRNA(Met) pool is formylated by mitochondrial methionyl-tRNA formyltransferase
      (MTFMT) to generate N-formylmethionine-tRNA(Met) (fMet-tRNA(met)), which is used for translation
      initiation
  - reference_id: PMID:21907147
    supporting_text: >-
      patient fibroblasts have dramatically reduced fMet-tRNA(Met) levels and an abnormal formylation
