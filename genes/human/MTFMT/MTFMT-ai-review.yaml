core_functions:
- description: >-
    Formylates a portion of the mitochondrial methionyl-tRNA(Met) pool, using 10-formyltetrahydrofolate
    as the formyl donor, to generate the N-formylmethionyl-tRNA(Met) initiator used by the mitochondrial
    translation initiation machinery, in the mitochondrial matrix.
