id: Q96DP5
gene_symbol: MTFMT
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  MTFMT encodes the nuclear-encoded mitochondrial methionyl-tRNA formyltransferase. Metazoan mitochondria
  use a single tRNA(Met) for both initiation and elongation; MTFMT transfers a formyl group from 10-formyltetrahydrofolate
  to part of the aminoacylated Met-tRNA(Met) pool, generating fMet-tRNA(Met), which is preferred by the
  mitochondrial initiation factor for translation initiation on mitochondrial ribosomes. Formylation is
  required for efficient synthesis of the mtDNA-encoded respiratory-chain subunits in human cells, and
  biallelic loss-of-function or hypomorphic variants cause Leigh syndrome with combined oxidative phosphorylation
  deficiency (COXPD15) or isolated complex I deficiency.
