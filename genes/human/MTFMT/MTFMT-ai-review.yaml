  - reference_id: PMID:25288793
    supporting_text: >-
      N-Formylation of initiator methionyl-tRNA (Met-tRNA(Met)) by methionyl-tRNA formyltransferase (MTF)
      is important for translation initiation in bacteria, mitochondria, and chloroplasts.
  - reference_id: PMID:25288793
    supporting_text: >-
      The S125L mutant has 653-fold lower activity, whereas the S209L mutant has 36-fold lower activity.
  - reference_id: PMID:21907147
    supporting_text: >-
      Our findings demonstrate that MTFMT is critical for efficient human mitochondrial translation
suggested_questions:
- question: >-
    What fraction of the mitochondrial Met-tRNA(Met) pool must be formylated to sustain normal mitochondrial
    translation initiation in different human tissues, and why is the brain particularly sensitive to
    its reduction?
- question: >-
    Does reduced formylation alter the N-terminal formylation state of individual mtDNA-encoded proteins
    differently, and does that affect their assembly into respiratory-chain complexes?
suggested_experiments:
- description: >-
    Quantify formylated versus non-formylated Met-tRNA(Met) and mitoribosome-profiling initiation density
    for all 13 mtDNA-encoded ORFs in isogenic MTFMT-null and c.626C>T knock-in human iPSC-derived neurons.
