core_functions:
- description: 'KRTAP4-1 is a ultrahigh-sulfur (UHS) KAP4 family keratin-associated protein that acts as a structural matrix component of the hair fibre: it is deposited between trichocyte keratin intermediate filaments in the keratinizing zone and becomes cross-linked to them, mainly through disulfide bonds (HS/UHS KAPs) or additional non-covalent interactions (HGT KAPs), giving the hair shaft its rigidity and resistance.'
