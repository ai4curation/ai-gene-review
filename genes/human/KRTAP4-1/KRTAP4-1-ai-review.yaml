suggested_questions:
- question: Do the numerous KRTAP4 size alleles alter matrix cysteine content and hair fibre mechanics?
- question: KRTAP4-1 lacks the hair cycle IBA carried by other KRTAP4 paralogues; is this a difference in PANTHER subfamily placement rather than biology?
- question: GO lacks a cellular component term for the keratin-associated interfilamentous matrix of the hair cortex/cuticle; should one be requested, as keratin filament is only an approximation?
suggested_experiments:
- hypothesis: KAP4 repeat-length variation modulates hair fibre properties.
  description: Associate KRTAP4-1 repeat-length genotypes with fibre diameter and tensile properties in human hair samples.
  experiment_type: genotype-phenotype association
