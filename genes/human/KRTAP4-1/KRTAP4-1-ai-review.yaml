id: Q9BYQ7
gene_symbol: KRTAP4-1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Keratin-associated protein 4-1 (KAP4.1, also designated KAP4.10) is a 146-residue ultrahigh-sulfur keratin-associated protein of the KAP4 family, encoded in the KRTAP cluster within the type I keratin locus on chromosome 17q21. Its sequence consists largely of cysteine-rich pentapeptide repeats, and the KRTAP4 genes show extensive size polymorphism arising from intragenic deletion or duplication of these repeats. KAP4 proteins are expressed in hair follicles and form part of the cysteine-rich interfilamentous matrix that is disulfide cross-linked to trichocyte keratin intermediate filaments in the hair cortex.
