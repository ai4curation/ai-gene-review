  review:
    summary: IPI row recording the interaction of RBX1 with CUL1.
    action: MODIFY
    reason: RBX1's binding to cullin C-terminal domains is exactly what cullin family protein binding (GO:0097602)
      denotes, and that term is already supported by IDA and by PAINT inference; the generic protein-binding row
      should be replaced by it rather than removed, because the specific function is established.
