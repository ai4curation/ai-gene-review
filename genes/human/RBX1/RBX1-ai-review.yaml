id: P62877
gene_symbol: RBX1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'RBX1 (ROC1, RNF75) is a 108-residue RING-H2 protein that forms the catalytic subunit of most human
  cullin-RING ubiquitin ligases (CRLs). Its N-terminal strand pairs with the C-terminal domain of a cullin through
  an intermolecular beta-sheet, while its cross-braced RING domain, which coordinates two structural zinc ions (a
  third is seen in SCF structures), binds a modifier-charged E2 enzyme and holds it in the closed, transfer-competent
  conformation. RBX1 forms no thioester of its own: ubiquitin passes directly from the E2 (CDC34/UBE2R, UBE2D) to
  a lysine on a substrate that a variable receptor module has recruited at the far end of the cullin, roughly 100
  A away. The same RING also acts in the NEDD8 pathway, where RBX1 binds UBE2M/UBC12~NEDD8 - assisted by DCN-type
  co-E3s (DCUN1D1-5) - and rotates to neddylate the conserved cullin lysine, the modification that activates the
  ligase and blocks CAND1 binding; the paralogue RBX2/RNF7 performs the equivalent reaction with UBE2F for CUL5.
  RBX1 is therefore shared by CRL1/SCF (with SKP1 and about 70 F-box proteins), CRL2 (elongin BC with VHL-box receptors),
  CRL3 (BTB proteins such as KEAP1, SPOP, KLHL and KCTD family members), CRL4A/B (DDB1 with DCAFs) and the CUL7-FBXW8
  and hexameric CUL9 assemblies, and substrate choice resides in these receptors rather than in RBX1 itself. Its
  outputs are correspondingly broad: mainly K48-linked chains that commit substrates to the proteasome (p27/CDKN1B
  via SCF(SKP2) at the G1/S transition, IkappaB-alpha, beta-catenin and DEPTOR via SCF(beta-TrCP), c-Myc and NOTCH
  via SCF(FBXW7), CDT1 and p21 via CRL4(CDT2), NRF2 via CUL3-KEAP1, HIF-alpha via CRL2(VHL), RNA polymerase II subunits
  via CRL3(ARMC5) and CRL4(CSA)), but also monoubiquitination (SEC31, PCNA) and K63- or K27-linked signals. RBX1
  acts in both nucleus and cytosol, with its effective location set by the assembled ligase, and it is essential:
  mouse Rbx1 disruption causes p27 accumulation, hypoproliferation and early embryonic lethality that deleting p27
  only partly delays.'
