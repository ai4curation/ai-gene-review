proposed_new_terms: []
suggested_questions:
- question: Should the ~55 GO:0005515 rows recording RBX1 with individual cullins, substrate receptors and CRL substrates
    be re-curated as cullin family protein binding (GO:0097602) plus complex membership, or captured in GO-CAM as
    has_input relations on the receptor and RBX1 activity nodes, rather than as bare protein binding on the shared
    catalytic subunit?
- question: Which receptor-specific pathway outputs (circadian rhythm, iron homeostasis, TORC1, BMP, xenophagy,
    ciliogenesis, spermatogenesis, beige-fat differentiation) should be annotated to RBX1 at all, given that RBX1
    is shared by every CRL and that the same subunit supports opposite-sign outputs through different receptors?
- question: How should the division of labour between RBX1 and ARIH1 be annotated? Neddylated CUL1-RBX1 activates
    ARIH1, which primes many CRL substrates with the first ubiquitin while the RBX1-E2 pair elongates the chain
    - a distinction that current terms (GO:0061630 versus GO:0034450) only partly express.
suggested_experiments:
- hypothesis: The RBX1 RING is required for chain elongation but dispensable for ARIH1-mediated priming of a defined
    subset of CRL substrates.
  description: Reconstitute neddylated CUL1-RBX1 and CUL3-RBX1 ligases carrying RING linchpin and E2-interface mutations,
    and compare priming versus elongation kinetics on SCF(beta-TrCP), SCF(FBXW7) and CUL3(KEAP1) substrates with
    and without ARIH1, reading out chain length by ubiquitin-remnant mass spectrometry.
  experiment_type: structure-guided mutational reconstitution with ubiquitination kinetics
- hypothesis: RBX1's neddylation and ubiquitination activities can be separated in cells, so that loss of cullin
    neddylation accounts for only part of the RBX1-null phenotype.
  description: Rescue RBX1-depleted human cells with alleles selectively impaired in UBE2M binding versus in ubiquitin-charged
    E2 binding, then measure cullin neddylation state, accumulation of canonical substrates (p27, CDT1, NRF2, DEPTOR)
    and proliferation/senescence, comparing each to NEDD8-E1 inhibition.
  experiment_type: separation-of-function rescue in cells
- hypothesis: RBX1 associates with CUL5 only in defined contexts, whereas RBX2/RNF7 is the default CUL5 partner.
  description: Quantify RBX1 and RBX2 occupancy on CUL5 complexes across cell types and receptor classes (SOCS-box
    versus elongin A) by targeted proteomics of endogenous CUL5 pulldowns in RBX2-null and RBX1-degron cells.
  experiment_type: quantitative interaction proteomics with genetic controls
