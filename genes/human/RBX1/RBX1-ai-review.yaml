- term:
    id: GO:0004842
    label: ubiquitin-protein transferase activity
  evidence_type: IDA
  original_reference_id: PMID:15983046
  qualifier: contributes_to
  review:
    summary: RBX1 supplies the RING activity that transfers ubiquitin from a charged E2 onto CRL-recruited substrates;
      the annotation is the parent of the more precise ubiquitin protein ligase activity (GO:0061630) also annotated
      here.
    action: ACCEPT
    reason: 'Correct, if one step broader than GO:0061630: RBX1 does not form a ubiquitin thioester itself but activates
      the E2~ubiquitin conjugate for direct transfer, which is what ubiquitin-protein transferase activity denotes.
      The contributes_to qualifier on the IDA rows is appropriate for a subunit that is catalytic only within an
      assembled cullin-RING complex.'
    supported_by:
    - reference_id: PMID:15983046
      supporting_text: Keap1 is a BTB-Kelch protein that functions as a substrate adaptor protein for a Cul3-dependent
        E3 ubiquitin ligase complex.
    - reference_id: file:human/RBX1/RBX1-uniprot.txt
      supporting_text: The RING-type zinc finger domain is essential for ubiquitin ligase activity
    - reference_id: file:human/RBX1/RBX1-deep-research-falcon.md
      supporting_text: Its N-terminal region binds the C terminus of a cullin scaffold, whereas its RING domain
        recruits a modifier-loaded E2 enzyme.
