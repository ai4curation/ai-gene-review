    summary: IPI row from the CRL4(DDB2)/CRL4(CSA) architecture study; the RBX1-containing entity characterised
      there is the DDB1-DDB2-CUL4A/B-RBX1 ubiquitin ligase, which acts in nucleotide-excision repair.
