- term:
    id: GO:0000082
    label: G1/S transition of mitotic cell cycle
  evidence_type: NAS
  original_reference_id: PMID:11961546
  qualifier: involved_in
  review:
    summary: Through SCF(SKP2), which degrades Thr187-phosphorylated p27/CDKN1B, and through CRL1/CRL4 turnover
      of CDT1, p21 and E2F1, RBX1 is required for the G1/S transition; mouse Rbx1 disruption accumulates p27 and
      causes early embryonic lethality with hypoproliferation.
    action: ACCEPT
    reason: 'Core process: RBX1 performs the ubiquitin-transfer step of the p27 degradation switch, and the genetic
      evidence shows the requirement is not redundant with RBX2.'
    supported_by:
