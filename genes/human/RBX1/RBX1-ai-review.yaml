      supporting_text: E3 ubiquitin ligase component of multiple cullin-RING-based E3 ubiquitin-protein ligase (CRLs)
        complexes which mediate the ubiquitination and subsequent proteasomal degradation of target proteins
    - reference_id: file:human/RBX1/RBX1-deep-research-falcon.md
      supporting_text: Its N-terminal region binds the C terminus of a cullin scaffold, whereas its RING domain
        recruits a modifier-loaded E2 enzyme.
