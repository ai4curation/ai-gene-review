core_functions:
- description: 'Catalytic RING subunit of cullin-RING ubiquitin ligases: RBX1 binds the cullin C-terminal domain
    and recruits a ubiquitin-charged E2 (CDC34/UBE2R, UBE2D), activating the E2~ubiquitin conjugate so that ubiquitin
    is transferred directly onto a lysine of the substrate held by the cullin''s receptor module. Mostly K48-linked
    chains are built, committing the substrate to the proteasome.'
  molecular_function:
    id: GO:0061630
    label: ubiquitin protein ligase activity
  directly_involved_in:
  - id: GO:0016567
    label: protein ubiquitination
  - id: GO:0070936
    label: protein K48-linked ubiquitination
  - id: GO:0043161
    label: proteasome-mediated ubiquitin-dependent protein catabolic process
  locations:
  - id: GO:0005634
    label: nucleus
  - id: GO:0005829
    label: cytosol
  in_complex:
    id: GO:0031461
    label: cullin-RING ubiquitin ligase complex
  supported_by:
  - reference_id: PMID:10230407
    supporting_text: ROC1 mutations completely abolished their ligase activity without noticeable changes in associated
      proteins.
  - reference_id: PMID:11961546
    supporting_text: The globular domain binds the RING finger protein Rbx1 through an intermolecular beta-sheet,
      forming a two-subunit catalytic core that recruits the ubiquitin-conjugating enzyme.
  - reference_id: PMID:36372232
    supporting_text: RBX1 is a RING protein that recruits a ubiquitin-charged E2 to the E3 ligase.
  - reference_id: file:human/RBX1/RBX1-uniprot.txt
    supporting_text: Recruits the E2 ubiquitin-conjugating enzyme CDC34 to the complex and brings it into close
      proximity to the substrate.
  - reference_id: file:human/RBX1/RBX1-deep-research-falcon.md
    supporting_text: Its N-terminal region binds the C terminus of a cullin scaffold, whereas its RING domain recruits
      a modifier-loaded E2 enzyme.
- description: 'NEDD8 E3 for cullin neddylation: with the NEDD8-conjugating E2 UBE2M/UBC12, and assisted by DCN-type
    co-E3s, RBX1 transfers NEDD8 onto the conserved lysine of the CUL1-CUL4 C-terminal domain, the modification
    that reorients the cullin-RING arm, displaces CAND1 and switches the ligase into its active, ubiquitin-transferring
    conformation.'
  molecular_function:
    id: GO:0019788
    label: NEDD8 transferase activity
  directly_involved_in:
  - id: GO:0045116
    label: protein neddylation
  locations:
  - id: GO:0005634
    label: nucleus
  - id: GO:0005829
    label: cytosol
  in_complex:
    id: GO:0031461
    label: cullin-RING ubiquitin ligase complex
  supported_by:
  - reference_id: PMID:24949976
    supporting_text: Nonetheless, RING E3 mechanisms matching a specific UBL and acceptor lysine remain elusive,
      including for RBX1, which mediates NEDD8 ligation to cullins and >10% of all ubiquitination.
  - reference_id: PMID:21765416
    supporting_text: We propose RING domain rotation as a general mechanism for UBL transfer for the largest family
      of E3s.
  - reference_id: PMID:19250909
    supporting_text: The E2s have distinct functions, with UBE2M/RBX1 and UBE2F/RBX2 displaying different target
      cullin specificities.
  - reference_id: file:human/RBX1/RBX1-uniprot.txt
    supporting_text: Promotes the neddylation of CUL1, CUL2, CUL4 and CUL4 via its interaction with UBE2M.
  - reference_id: file:human/RBX1/RBX1-deep-research-falcon.md
    supporting_text: RBX1 also works with UBE2M~NEDD8 to neddylate cullins and activate CRLs.
- description: 'Catalytic module of SCF (SKP1-CUL1-F-box-RBX1) ligases in cell-cycle proteolysis: within SCF, RBX1
    and CUL1 form the invariant core onto which interchangeable F-box receptors dock, and RBX1 performs the ubiquitin
