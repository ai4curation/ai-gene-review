- term:
    id: GO:0005634
    label: nucleus
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - FB:FBgn0025638
  - FB:FBgn0250903
  - MGI:MGI:1337096
  - PANTHER:PTN000129805
  - PomBase:SPAC23H4.18c
  - PomBase:SPAC343.03
  - SGD:S000002166
  - SGD:S000005493
  - UniProtKB:P62877
  - UniProtKB:Q38DY9
  - UniProtKB:Q9NYG5
  - UniProtKB:Q9UBF6
  review:
    summary: RBX1 is present in the nucleus, where CRL1/CRL2/CRL3/CRL4 ligases act on nuclear substrates (p27, cyclin
      E, CDT1, NRF2, RNA Pol II subunits); ROC1 binding also promotes nuclear accumulation of CUL1.
    action: ACCEPT
    reason: 'Well-supported nuclear pool: direct immunofluorescence/fractionation, curator inference from nuclear
      CRL substrates, the UniProt subcellular location, and a PAINT inference placed at the RING-box family node
      whose descendants (yeast Hrt1/Apc11, fly and mouse Rbx1, human RBX1) all act on nuclear substrates.'
    supported_by:
    - reference_id: file:human/RBX1/RBX1-uniprot.txt
      supporting_text: E3 ubiquitin ligase component of multiple cullin-RING-based E3 ubiquitin-protein ligase (CRLs)
        complexes which mediate the ubiquitination and subsequent proteasomal degradation of target proteins
    - reference_id: file:human/RBX1/RBX1-deep-research-falcon.md
      supporting_text: RBX1 is reported in both the **nucleus and cytoplasm**, consistent with degradation of substrates
        in both compartments.
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN000129805
        source_label: PANTHER:PTN000129805
        source_status: SUPPORTS_TRANSFER
        comment: RING-box family node spanning RBX1, RBX2/RNF7 and APC11; the descendant experimental evidence includes
          human RBX1 itself, mouse Rbx1, fly Roc1a/Roc1b and yeast Hrt1/Rbx1 and Apc11, so the function is inherited
          rather than lineage-specific.
