gene_symbol: ABCC10
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  ABCC10 (MRP7) is a member of the ABCC/multidrug resistance-associated protein (MRP)
  subfamily of ATP-binding cassette transporters. It is a polytopic, multi-pass integral
  membrane protein organized as three transmembrane domains and two cytoplasmic
  nucleotide-binding domains, and functions as an ATP-dependent efflux pump at the plasma
  membrane. In polarized epithelia it localizes to the basolateral/basal cell surface.
  ABCC10 uses the energy of ATP binding and hydrolysis to extrude amphipathic lipophilic
  organic anions from cells, including glutathione S-conjugates such as the cysteinyl
  leukotriene C4 (LTC4) and glucuronide conjugates such as 17-beta-estradiol
  17-(beta-D-glucuronide). It also transports a broad range of structurally unrelated
  xenobiotics and anticancer drugs (taxanes such as docetaxel and paclitaxel, vinca
  alkaloids, epothilone B and nucleoside analogues), and its overexpression confers
  multidrug resistance in cancer cells. ABCC10 is widely expressed, and in testis is found
  at the basal membrane of Sertoli cells and in peritubular myoid cells, consistent with a
  role in moving organic compounds across the blood-testis barrier.
