suggested_questions:
- question: What is the principal endogenous physiological substrate of ABCC10 in vivo, given
    that it transports LTC4 and estradiol-glucuronide in vitro but a dominant native cargo has
    not been established?
- question: Does human ABCC10 contribute to intercellular antiviral 2-5A (oligoadenylate)
    export and RNase L cross-activation, as inferred by similarity from the mouse ortholog,
    and in which tissues?
suggested_experiments:
- description: Vesicular transport assays with purified or membrane-reconstituted ABCC10
    across a panel of candidate endogenous anions (cysteinyl leukotrienes, steroid
    glucuronides/sulfates, bile constituents) to rank physiological substrate preference and
    determine kinetic parameters.
- description: Measure 2-5A efflux and RNase L activation in neighboring cells using human
    ABCC10-overexpressing and ABCC10-knockout cells challenged with RNA virus, to test the
    antiviral signaling role in human cells.
