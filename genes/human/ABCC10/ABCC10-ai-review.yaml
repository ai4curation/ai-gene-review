    label: lysosomal membrane
  evidence_type: HDA
  original_reference_id: PMID:17897319
  qualifier: located_in
  review:
    summary: ABCC10 was detected in a high-throughput proteomic survey of placental
      lysosomal membranes.
    action: MARK_AS_OVER_ANNOTATED
    reason: This is a single high-throughput discovery proteomics screen of crude placental
      lysosomal-membrane fractions reporting many transporters not previously assigned to
      lysosomes; such fractions are prone to plasma-membrane contamination. ABCC10's
      steady-state location is firmly established as the (basolateral/basal) plasma membrane
      by multiple independent experimental and phylogenetic lines, and no functional role
      for ABCC10 at the lysosomal membrane has been shown. The lysosomal-membrane claim is
      an uncorroborated over-annotation rather than a demonstrated residence.
    supported_by:
    - reference_id: PMID:17897319
      supporting_text: 16 enzymes and transporters were detected that had not been assigned
        to lysosomal membranes previously
