- term:
    id: GO:0002021
    label: response to dietary excess
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q61330
  - ensembl:ENSMUSP00000083707
  review:
    summary: The mouse ortholog has a diet-dependent energy-balance phenotype.
    action: KEEP_AS_NON_CORE
    reason: The exact Q61330 donor has an IMP record from the diet study. Tag1-null
      mice resisted weight gain on a high-fat/simple-carbohydrate diet and differed
      in body composition and food consumption. This supports a peripheral physiological
      annotation, while the experiments do not identify a direct CNTN2 nutrient-sensing
      mechanism or establish the hypothalamic step. It is kept outside the adhesion
      core.
    supported_by:
    - reference_id: GO_REF:0000107
    - reference_id: PMID:22752552
- term:
    id: GO:0002023
    label: reduction of food intake in response to dietary excess
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q61330
  - ensembl:ENSMUSP00000083707
  review:
    summary: The specific reduction-of-intake process is not resolved by the donor
      phenotype.
    action: UNDECIDED
    reason: The mouse study reports lower food intake in null mice early after high-fat
      feeding, with a later nonsignificant trend, and lower rather than increased
      energy expenditure after prolonged feeding. These observations do not identify
      CNTN2 as performing the defined reduction of feeding after detection of dietary
      excess. The original positive donor assertion and the real diet phenotype are
      retained while that precise functional direction remains unresolved.
    supported_by:
    - reference_id: GO_REF:0000107
    - reference_id: PMID:22752552
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:32814053
  qualifier: enables
  supporting_entities:
  - UniProtKB:P05067
  review:
    summary: The positive APP interaction can be described by the partner adhesion
      class.
    action: MODIFY
    reason: 'Three exact IntAct records from the neurodegenerative-disease interaction
      screen support APP–CNTN2 association: array, prey-pooling and validated two-hybrid
      assays. APP is independently established as a cell adhesion protein by ectodomain
      bead aggregation and cell-contact experiments. Cell adhesion molecule binding
      is therefore a defensible partner-class refinement, without inferring a native
      APP–CNTN2 adhesion mechanism or amyloid-processing role. The recorded APP 670–671
      mutation feature and neutral roles in the validated record remain explicit.'
    supported_by:
    - reference_id: PMID:32814053
    - reference_id: PMID:25122912
    proposed_replacement_terms:
    - id: GO:0050839
      label: cell adhesion molecule binding
