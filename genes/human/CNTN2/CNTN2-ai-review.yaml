- term:
    id: GO:0022604
    label: regulation of cell morphogenesis
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q61330
  - ensembl:ENSMUSP00000083707
  review:
    summary: CNTN2 influences neuronal and glial morphology in a developmental context.
    action: KEEP_AS_NON_CORE
    reason: The mapped mouse study measures altered retinal-axon caliber, cytoskeletal
      organization and neighboring astroglial processes in Tag1-null nerves. Human
      TAX-expressing cells and purified human TAG-1 substrates also affect mouse retinal-axon
      adhesion and fasciculation. The broad morphology-regulation term is retained
      without assigning a cell-intrinsic cytoskeletal activity or a universal morphogenesis
      mechanism.
    supported_by:
    - reference_id: GO_REF:0000107
    - reference_id: PMID:18650339
