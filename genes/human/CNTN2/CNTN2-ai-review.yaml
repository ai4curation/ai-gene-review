id: Q02246
gene_symbol: CNTN2
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Contactin-2 (CNTN2, TAG-1 or TAX-1) is a glycosylphosphatidylinositol-anchored
  neural cell-surface adhesion protein with six immunoglobulin-like and four fibronectin
  type III domains. Homophilic extracellular contacts support cell adhesion, while
  interactions with other neural surface proteins help organize axonal and synaptic
  membrane domains. In myelinated axons, contactin-2 cooperates with CASPR2 to maintain
  juxtaparanodal potassium-channel clusters. Neuronal and glial expression contributes
  to axon organization and axon–glia contacts. Human loss-of-function variants have
  been associated with epilepsy, and rodent studies reveal additional developmental
  and metabolic phenotypes.
