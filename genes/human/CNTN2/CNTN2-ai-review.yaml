- id: file:human/CNTN2/CNTN2-source-evidence.json
  title: CNTN2 source records and evidence scope
  findings:
  - statement: Exact interaction and donor record identities, source hashes and access
      boundaries are indexed for reproducibility. Primary references supply biological
      support.
core_functions:
- description: CNTN2 mediates neural cell-cell adhesion through homophilic extracellular
    contacts and context-dependent interactions with other surface proteins. Human
    ectodomain binding and surface-controlled interface mutants directly establish
    the adhesive work. In rodent myelinated nerves, CNTN2 cooperates with CASPR2 to
    organize and maintain juxtaparanodal Kv1 clusters; glial rescue establishes a
    CNS contribution while peripheral rescue has different requirements. Postsynaptic
    targeting of human CNTN2 constructs provides another membrane context. The protein
    is an adhesion component, not an ion-channel pore, and a specific presynaptic
    assembly step remains unresolved.
  molecular_function:
    id: GO:0098632
    label: cell-cell adhesion mediator activity
  directly_involved_in:
  - id: GO:0007156
    label: homophilic cell-cell adhesion
  - id: GO:0045163
    label: clustering of voltage-gated potassium channels
  locations:
  - id: GO:0005886
    label: plasma membrane
  - id: GO:0044224
    label: juxtaparanode region of axon
  - id: GO:0045211
    label: postsynaptic membrane
  supported_by:
  - reference_id: PMID:38968938
  - reference_id: PMID:39702996
  - reference_id: PMID:12963709
  - reference_id: PMID:12975355
  - reference_id: PMID:20962216
  - reference_id: PMID:26217189
suggested_questions:
- question: Which experiment establishes the specific presynaptic membrane organization
    assertion linked to the clinical CNTN2 paper, and how is it distinguished from
    juxtaparanodal organization?
- question: Does human CNTN2 mediate dendritic self-avoidance in a defined neuronal
    context, and how does that relate to its directly demonstrated adhesive contacts?
- question: Does CNTN2 control a nutrient-sensing or feeding step, and can any adipocyte-differentiation
    effect be separated from whole-animal growth and intake changes?
suggested_experiments:
- description: Compare surface-matched WT human CNTN2 and adhesion-interface mutants
    in neuron–glia cocultures, measuring CASPR2/Kv1 arrival and residence at defined
    membrane domains.
  hypothesis: Adhesive contacts stabilize membrane-domain complexes, with distinguishable
    effects on initial delivery and retention.
- description: Use compartment-restricted CNTN2 rescue in neuronal cultures with direct
    pre- and postsynaptic membrane markers and quantified partner clustering.
  hypothesis: A specific synaptic organizing contribution can be separated from surface
    localization and from the juxtaparanodal role.
status: COMPLETE
