suggested_questions:
- question: What evidence supports direct DNA recognition by the ASXL2 PHD-based electronic mapping, separately
    from chromatin association and HARE-HTH predictions?
- question: How do the two ASXL2 protein products differ in BAP1 activation, receptor coactivation and
    MBD5/6-dependent assembly?
- question: Which original ASXL2-SPOP assays and construct controls support the curated interaction?
suggested_experiments:
- description: Compare purified full-length ASXL2 products and matched DEUBAD/PHD variants for BAP1 activation
    on nucleosomal H2A-K119ub and MBD6-dependent complex stability.
  hypothesis: The isoforms preserve separable regulatory interfaces but differ in their assembly or transcriptional
    effects.
