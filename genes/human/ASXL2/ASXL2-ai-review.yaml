    relevance: HIGH
    review_notes: Actual canonical XML histone-binding and ASXL2-MBD6 assembly Results/Figures 2,4,5 legends
      plus construct/ELISA Methods read. Human ASXL2 PHD lacks consistent binding to the tested histone-H3
