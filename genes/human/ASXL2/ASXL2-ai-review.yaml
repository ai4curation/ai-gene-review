  title: Additional sex comb-like (ASXL) proteins 1 and 2 play opposite roles in adipogenesis via reciprocal
    regulation of peroxisome proliferator-activated receptor {gamma}.
  findings:
  - statement: ASXL2 enhances PPARgamma activity in the reported adipocyte model.
    supporting_text: 'overexpression of ASXL2 greatly enhanced rosiglitazone-induced PPARγ activity

      and enhanced adipogenesis.'
    full_text_unavailable: true
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    review_notes: Complete canonical abstract read. Independent annotation consultation inspected original
      Experimental Procedures, Results and Figures 1-6 legends; root separately read indexed original
      human ASXL2 construct, HEK293 interaction and reporter Methods. Human ASXL2 was expressed in human
      HEK293 and mouse 3T3-L1 contexts; the adipogenesis experiment is not human adipocyte physiology.
      Antibodies recognize human and mouse ASXLs; tagged versus endogenous partner configurations are
      distinguished. Cache remains abstract-only. Follow-up indexed original ChIP Methods and Figures
      3,5,6 clarify FLAG-human-ASXL2 expression in mouse 3T3-L1 cells and distinguish tagged from endogenous
      chromatin assays.
    correctness: VERIFIED
