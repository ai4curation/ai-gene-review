  description: ASXL2 binds BAP1 through its DEUBAD regulatory region and stimulates BAP1-mediated deubiquitination
    of histone H2A at lysine 119. As a regulatory subunit of nuclear PR-DUB, it promotes substrate recognition
    and helps maintain the complex. BAP1 supplies the hydrolytic activity; ASXL2 supplies the activating
    interaction. Its PHD-dependent MBD5/6 interactions support complex assembly and chromatin association
    within this integrated regulatory role.
