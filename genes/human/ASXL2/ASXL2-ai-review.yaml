description: ASXL2 is a nuclear chromatin regulator with HARE-HTH, DEUBAD and atypical PHD regions. It
  forms a regulatory subunit of BAP1-containing PR-DUB complexes and stimulates BAP1-mediated removal
  of ubiquitin from histone H2A. ASXL2 also supports transcriptional coactivation through nuclear-receptor
  and chromatin-associated interactions, including experimentally established PPAR signaling. These activities
  influence developmental gene expression and cell differentiation.
