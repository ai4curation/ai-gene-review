  review:
    summary: TTLL6 enzyme association supports a more informative binding term.
    action: MODIFY
    reason: PMID:22246503 Fig. 4b reports pairwise tagged CEP41–TTLL6 co-immunoprecipitation.
      TTLL6 is the tubulin polyglutamylase partner, supporting enzyme binding rather than an
      unspecified protein association. The experiment establishes complex association, not a
      purified binary interface. The Methods describe both human EGFP/HA and mouse GST/EGFP/FLAG
      CEP41 constructs; the HEK293 host alone does not establish the species of every Figure
      4b construct. Preserve the original human IPI and Q8N841 partner; do not assign TTLL6
      catalysis or a motor-adaptor bridge to CEP41.
