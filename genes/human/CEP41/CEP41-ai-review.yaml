- term:
    id: GO:0018095
    label: protein polyglutamylation
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q6GQN0
  review:
    summary: CEP41 contributes noncatalytically to ciliary tubulin polyglutamylation.
    action: KEEP_AS_NON_CORE
    reason: The full study supports the broader involved_in assertion without assigning glutamyl-transfer
      activity to CEP41. Human patient fibroblasts retain cilia but lose tubulin GT335/PolyE modification,
      and exogenous CEP41 restores the modification endpoint. Tagged complex association with TTLL6 and
      the separate mouse IMCD3 experiment, in which Cep41 depletion restricts TTLL6 mainly to basal bodies,
      provide a mechanistic link through enzyme targeting. Together these support a noncatalytic contribution
      to ciliary polyglutamylation; lack of a purified reaction-level cofactor assay does not invalidate
      broader process involvement. Retain this modification process as non-core and describe the more
      directly resolved targeting work in the localization core. The original ISS assertion and zebrafish
