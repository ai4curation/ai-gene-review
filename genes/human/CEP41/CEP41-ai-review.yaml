- id: PMID:38841887
  title: CEP41, a ciliopathy-linked centrosomal protein, regulates microtubule assembly and
    cell proliferation.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Normal cache is abstract-only; selected publisher full Results and Methods
      were externally read through the indexed ResearchGate publisher preview (DOI:10.1242/jcs.261927).
      Human NM_018718.3 CEP41 was purified from bacteria, its His tag removed, and tested with
      goat-brain tubulin. Fig. 1E/F directly supports binding; bulk assembly assays do not establish
      a processive plus-end polymerase. Native co-IP used mouse NIH3T3 cells.
- id: PMID:40593728
  title: In situ cryo-electron tomography reveals the progressive biogenesis of basal bodies
    and cilia in mouse ependymal cells.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected full primary Results/Fig. 6, Methods and Discussion read. Mouse ependymal
      cryo-ET/AlphaFold fitting assigns CEP41 to mBMIP5; localization and two-siRNA experiments
      support multiciliogenesis. This is not atomic human structural evidence. The authors leave
      luminal CEP41 versus external tubulin-tail access by TTLL6 unresolved.
core_functions:
- description: CEP41 associates with TTLL6 and supports its ciliary access, thereby facilitating
    axonemal tubulin glutamylation. The measured binding/targeting role is noncatalytic; tagged
    complex association and mammalian localization experiments do not by themselves identify
    an IFT motor bridge.
