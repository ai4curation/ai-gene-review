id: Q9BYV8
gene_symbol: CEP41
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CEP41 is a centrosomal and ciliary protein that supports axonemal tubulin glutamylation
  and microtubule organization. It associates with the polyglutamylase TTLL6 and promotes its
  access to the cilium, without an established glutamylase activity of its own. CEP41 localizes
  to centrioles, basal bodies and cilia; loss of CEP41 can disrupt ciliary modification and
  architecture while leaving initial ciliogenesis intact. Purified human CEP41 also binds and
  stabilizes microtubules. In endothelial models, CEP41-dependent glutamylation influences ciliary
  disassembly and vascular cell behavior. Biallelic loss-of-function variants cause Joubert
  syndrome.
