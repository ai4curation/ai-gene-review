- question: Which CEP41 surfaces directly recognize TTLL6, and does CEP41 couple it to a defined
    ciliary entry or motor complex?
  experts: []
- question: How are direct microtubule binding and TTLL6 targeting separated across the four
    CEP41 products and in different ciliary cell types?
  experts: []
- question: What establishes the original membrane-proteomic CEP41 identification, and which
    membrane-associated pool did it measure?
  experts: []
- question: How does the luminal CEP41 assignment in motile cilia relate to TTLL6-dependent
    modification of externally exposed tubulin tails?
  experts: []
suggested_experiments:
- description: Compare human CEP41 products and separation-of-function mutants in CEP41-deficient
    cells, measuring TTLL6 entry, axonemal glutamylation, ciliary architecture and direct microtubule
    binding independently.
- description: Reconstitute CEP41–TTLL6 association with purified, sequence-defined proteins
    before testing candidate ciliary trafficking partners; distinguish binary binding from cellular
    complex association.
