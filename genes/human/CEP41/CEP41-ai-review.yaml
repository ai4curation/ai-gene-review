  review:
    summary: Purified human CEP41 directly binds preformed microtubules.
    action: NEW
    reason: PMID:38841887 tests full-length human CEP41 encoded by NM_018718.3 (373 residues), produced
      in bacteria with its His tag removed before the purified-protein experiments. CEP41 co-sediments
      with preformed taxol-stabilized microtubules assembled from goat-brain tubulin, whereas the protein
      remains soluble without microtubules under the same centrifugation conditions. This directly supports
      microtubule binding independently of the cellular co-IP, localization or perturbation assays. It
      does not establish a human atomic lattice interface, processive plus-end polymerase activity, a
      particular physiological tubulin subtype or equivalent activity of every alternative product. The
      existing enzyme-binding refinement concerns TTLL6 association and does not cover this direct microtubule
      interaction.
