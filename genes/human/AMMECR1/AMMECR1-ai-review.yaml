id: Q9Y4X0
gene_symbol: AMMECR1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: AMMECR1 is a small, highly conserved nuclear protein encoded on the X chromosome in the region
  deleted in AMME syndrome (Alport syndrome, intellectual disability, midface hypoplasia and elliptocytosis).
  It contains a RAGNYA-fold AMMECR1 domain, predicted from structure and genomic context to bind nucleic
  acids or nucleotides and possibly to act in an RNA-modification pathway, but no biochemical activity
  has been shown. It forms dimers with its paralog AMMECR1L. A patient missense variant (p.G177D) disrupts
  its nuclear localization and causes midface hypoplasia, intellectual disability and elliptocytosis,
  and zebrafish knockdown produces growth, bone and cardiac defects.
