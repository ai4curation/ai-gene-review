core_functions: []
knowledge_gaps:
- gap_statement: AMMECR1's molecular activity is unknown.
  boundary: Structure and genomic context predict a nucleic-acid or nucleotide-binding role, possibly
    in RNA modification, and the protein is nuclear and dimerizes with AMMECR1L, but no activity has been
    demonstrated. Loss-of-function phenotypes (patient variant, zebrafish knockdown, cancer-cell proliferation)
    are not tied to a mechanism.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: AMMECR1 is a disease gene for the AMME phenotype and its AMMECR1 domain is conserved from
    yeast to humans, so its activity likely underlies a basic cellular process.
  resolution: Test recombinant AMMECR1 (alone and with AMMECR1L) for nucleic-acid binding and RNA-modification
    activity, guided by the predicted RAGNYA-fold binding surface.
  provenance:
  - reference_id: file:genes/human/AMMECR1/AMMECR1-deep-research-affinage.md
    supporting_text: The direct molecular activity of AMMECR1 has not been demonstrated biochemically
      in the available corpus
  - reference_id: PMID:27811305
    supporting_text: Transfected cell lines with the p.G177D mutation showed aberrant nuclear localisation
      patterns when compared with the wild type.
proposed_new_terms: []
suggested_questions:
- question: Is the AMMECR1-AMMECR1L dimer the functional unit, and does it bind RNA as the RAGNYA fold
    predicts?
suggested_experiments:
- description: CLIP or in vitro RNA-binding assays with AMMECR1 and AMMECR1L, comparing wild type with
    the p.G177D variant.
