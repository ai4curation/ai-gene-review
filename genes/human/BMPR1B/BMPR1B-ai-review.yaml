id: O00238
gene_symbol: BMPR1B
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: BMPR1B, or ALK6, is a single-pass BMP-family type I serine/threonine kinase receptor
  with an extracellular ligand-binding region and a cytosolic kinase domain. It binds BMP/GDF
  ligands, especially GDF5, in heteromeric complexes with type-II receptors and transmits the signal
  to BMP R-SMADs. This receptor mechanism underlies chondrogenic and osteogenic developmental
  outputs and explains skeletal malformations caused by BMPR1B or GDF5 pathway disruption.
