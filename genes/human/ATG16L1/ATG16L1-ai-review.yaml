- term:
    id: GO:0043495
    label: protein-membrane adaptor activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: >-
      Protein-membrane adaptor activity. The molecular function ATG16L1 contributes to the
      complex: it puts the conjugation machinery on the right membrane.
    action: ACCEPT
    reason: >-
      ATG16L1 has two separable membrane-binding regions, an N-terminal one required for
      lipidation under all conditions and a beta-isoform-specific C-terminal one required
      only for lipidation on perturbed endosomes. ATG12-ATG5 alone cannot bind membrane;
      adding Atg16 restores it. That is exactly the GO:0043495 definition - bringing a
      protein complex together with a membrane - and it is what distinguishes ATG16L1's
      contribution from the catalytic chemistry supplied by ATG3 and ATG7. Core.
    supported_by:
    - reference_id: PMID:30778222
      supporting_text: the N-terminal membrane-binding region is essential for LC3B lipidation under all conditions tested
