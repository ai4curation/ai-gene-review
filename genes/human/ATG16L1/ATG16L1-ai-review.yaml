      belong to; the precise destination is the phagophore membrane proposed under
      proposed_new_terms. One of the four assertions carries UniProtKB-SubCell:SL-0221, so
      this is also an SL propagation.
    proposed_replacement_terms:
    - id: GO:0061908
      label: phagophore
    supported_by:
    - reference_id: PMID:23392225
      supporting_text: Atg16L1 deletion mutants, which lack the FIP200-interacting domain, are defective in proper membrane targeting.
    - reference_id: PMID:32960676
      supporting_text: RAB33B recruits the ATG16L1 complex to the phagophore
