      branch returns macroautophagy, microautophagy, chaperone-mediated autophagy and the
      cargo-specific children, but nothing for conjugation of ATG8 to single membranes.
      Moved to GO:0006501 C-terminal protein lipidation, which both papers support directly
      and which this gene already carries from one of them. A dedicated term is proposed
      under proposed_new_terms.
    proposed_replacement_terms:
    - id: GO:0006501
      label: C-terminal protein lipidation
    supported_by:
    - reference_id: PMID:29317426
      supporting_text: In contrast, non-canonical autophagy is a pathway through which LC3 is lipidated and inserted into single membranes, particularly endolysosomal vacuoles during cell engulfment events such as LC3-associated phagocytosis.
- term:
    id: GO:0016237
    label: microautophagy
  evidence_type: IDA
  original_reference_id: PMID:33586810
  qualifier: involved_in
  review:
    summary: >-
      Microautophagy. Both supporting experiments are about ATG8 conjugation to single
      endolysosomal membranes, which is not what GO:0016237 means.
    action: MODIFY
    reason: >-
      GO:0016237 is defined as cytosolic components being ingested by late endosomes,
      lysosomes or vacuoles through direct invagination of the compartment membrane, without
      prior sequestration into an autophagosome. That is a cargo-uptake mechanism. What
      PMID:29317426 and PMID:33586810 actually show is that the WD40 domain of ATG16L1
      directs lipidation of ATG8-family proteins onto single, already-existing endolysosomal
      membranes - the process usually called non-canonical autophagy or CASM, which involves
      no invagination and delivers no cargo by itself. The curators appear to have reached
      for the nearest available term because GO has none for CASM: a search of the autophagy
      branch returns macroautophagy, microautophagy, chaperone-mediated autophagy and the
      cargo-specific children, but nothing for conjugation of ATG8 to single membranes.
      Moved to GO:0006501 C-terminal protein lipidation, which both papers support directly
      and which this gene already carries from one of them. A dedicated term is proposed
      under proposed_new_terms.
    proposed_replacement_terms:
    - id: GO:0006501
      label: C-terminal protein lipidation
    supported_by:
