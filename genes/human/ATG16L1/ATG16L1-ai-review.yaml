id: Q676U5
gene_symbol: ATG16L1
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  ATG16L1 is the targeting subunit of the E3-like machinery that conjugates ATG8-family
  proteins to membrane phospholipids. It has no catalytic activity of its own: it binds the
  ATG12-ATG5 conjugate, homodimerizes through a coiled coil, and oligomerizes into 400 kDa and
  800 kDa assemblies that determine where ATG3 delivers an activated ATG8 protein. What
  ATG16L1 supplies is placement. Two separable membrane-binding regions and a set of protein
  interactions decide which bilayer gets modified: an N-terminal region required for lipidation
  under all conditions, a beta-isoform-specific C-terminal region, RB1CC1 and the WIPI proteins
  that read the PtdIns3P mark on the phagophore, and RAB33A and RAB33B, which bind the ATG16L1
  homodimer through a noncanonical Rab-effector interface and recruit the complex to phagophores.
  The protein serves two mechanistically distinct pathways through different domains. In
  canonical macroautophagy it drives ATG8 lipidation on the double-membrane phagophore and so
  controls its elongation. In non-canonical autophagy, often called CASM, its WD40 C-terminal
  domain directs lipidation onto single, pre-existing endolysosomal and endosomal membranes -
  a route dispensable for canonical autophagy but required for LC3-associated phagocytosis,
  for antigen presentation in dendritic cells, and for surviving influenza A infection in mice.
  ATG16L1 also links autophagy to innate immune signalling through NOD1, NOD2, TLR2, TMEM59,
  MEFV and IRGM, and the T300A coding variant is a well-known Crohn's disease risk allele.
