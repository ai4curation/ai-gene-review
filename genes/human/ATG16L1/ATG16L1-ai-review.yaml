core_functions:
- description: >-
    As the targeting subunit of the ATG12-ATG5-ATG16L1 complex, promotes covalent attachment
    of ATG8-family proteins to membrane phospholipid, the E3-like step of the ATG8
    conjugation cascade. ATG16L1 supplies membrane placement and complex oligomerization
    rather than catalysis, so the activity belongs to the complex it completes.
  contributes_to_molecular_function:
    id: GO:0019776
    label: Atg8-family ligase activity
  directly_involved_in:
  - id: GO:0006501
    label: C-terminal protein lipidation
  - id: GO:0000045
    label: autophagosome assembly
  in_complex:
    id: GO:0034274
    label: Atg12-Atg5-Atg16 complex
  locations:
  - id: GO:0000421
    label: autophagosome membrane
  - id: GO:0061908
    label: phagophore
  supported_by:
  - reference_id: PMID:30778222
    supporting_text: Thus, we propose that distinct membrane binding by the two isoforms of
      ATG16L1 mechanistically distinguish lipidation of LC3 and GABARAP proteins at distinct
      cellular locations and/or under different cellular conditions.
- description: >-
    Brings the ATG12-ATG5 conjugate to a membrane. ATG12-ATG5 alone does not bind membrane;
    ATG16L1 supplies two separable membrane-binding regions, an N-terminal one required for
    lipidation under all conditions and a beta-isoform-specific C-terminal one required only
    on perturbed endosomes, and this is what selects which bilayer is modified.
  molecular_function:
    id: GO:0043495
    label: protein-membrane adaptor activity
  directly_involved_in:
  - id: GO:0034497
    label: protein localization to phagophore assembly site
  locations:
  - id: GO:0061908
    label: phagophore
  supported_by:
  - reference_id: PMID:30778222
    supporting_text: the N-terminal membrane-binding region is essential for LC3B lipidation
      under all conditions tested
- description: >-
    Through its WD40 C-terminal domain, directs lipidation of ATG8-family proteins onto
    single, pre-existing endolysosomal and endosomal membranes - the non-canonical or CASM
    arm. This is domain-separable from canonical autophagy, which does not need the WD40
    domain, and it is the activity that underlies LC3-associated phagocytosis and the
    protective response to influenza A virus in mice.
  contributes_to_molecular_function:
    id: GO:0019776
    label: Atg8-family ligase activity
  directly_involved_in:
  - id: GO:0006501
    label: C-terminal protein lipidation
  locations:
  - id: GO:0036020
    label: endolysosome membrane
  - id: GO:0005765
    label: lysosomal membrane
  - id: GO:0010008
    label: endosome membrane
  supported_by:
  - reference_id: PMID:29317426
    supporting_text: In contrast, non-canonical autophagy is a pathway through which LC3 is
      lipidated and inserted into single membranes, particularly endolysosomal vacuoles during
      cell engulfment events such as LC3-associated phagocytosis.
  - reference_id: PMID:33586810
    supporting_text: ATG16L1-dependent targeting of LC3 to single-membrane, non-autophagosome
      compartments - referred to as non-canonical autophagy - protects mice from lethal IAV
      infection.
proposed_new_terms:
- proposed_name: phagophore membrane
  proposed_definition: >-
    The membrane system of a phagophore, comprising its two closely apposed lipid bilayers
    and the continuous rim that joins them, which expands by lipid acquisition and closes to
    form the double membrane of an autophagosome.
  proposed_parent:
    id: GO:0061908
    label: phagophore
  justification: >-
    The four GO:0034045 assertions on this gene, and the GO:0000421 autophagosome membrane
    annotation, all describe the same thing: the ATG12-ATG5-ATG16L1 complex acting on the
    elongating phagophore bilayer. GO has autophagosome membrane and omegasome membrane but
    no phagophore membrane, so such annotations split between a term for the finished
    organelle and GO:0034045, which asserts via bounding_layer_of a bounding membrane the PAS
    does not have. See GO issue #29437 recommendation R3 and
    projects/CONDENSATES/GO_0034045-annotation-audit.md. Same term proposed in the ATG9A and
    WIPI2 reviews.
- proposed_name: endoplasmic reticulum-phagophore membrane contact site
  proposed_definition: >-
    An organelle membrane contact site formed at the junction of the endoplasmic reticulum
    membrane and the phagophore or isolation membrane, across which lipid is delivered to the
    expanding phagophore and which is resolved before autophagosome closure.
  proposed_parent:
    id: GO:0044232
    label: organelle membrane contact site
  justification: >-
    PMID:28890335 shows in mammalian and C. elegans cells that isolation membranes contact the
    ER, that VMP1 controls those contacts through SERCA, and that losing VMP1 locks isolation
    membranes onto the ER and blocks autophagosome formation. GOA recorded this as GO:0120095
    vacuole-isolation membrane contact site, a term defined for the junction of the vacuolar
    membrane with the isolation membrane - the yeast VICS - in an organism that has no
    vacuole. The mis-assignment happens because GO:0120095 is the ontology's only
    isolation-membrane contact site term. The organelle membrane contact site branch already
    has ER-vacuole, ER-endosome, ER-lysosome, ER-plasma membrane, ER-trans-Golgi and
    ER-lipid droplet children; the ER-phagophore contact, which is where ATG2-mediated lipid
    transfer occurs, is missing. See modules/phagophore_organelle_contact_site.yaml.
- proposed_name: protein lipidation at single membranes
  proposed_definition: >-
    The conjugation of an ATG8-family protein to a phospholipid of a single, pre-existing
    membrane such as an endosome, lysosome, phagosome or plasma membrane, without formation
    of a double-membrane autophagosome and without sequestration of cytosolic cargo. Also
    known as non-canonical autophagy or conjugation of ATG8 to single membranes (CASM).
  proposed_parent:
    id: GO:0006501
    label: C-terminal protein lipidation
  justification: >-
    Two IDA experiments on this gene, PMID:29317426 and PMID:33586810, both characterise this
    process and both were annotated to GO:0016237 microautophagy, whose definition requires
    cargo ingestion by direct invagination of the compartment membrane. CASM involves no
    invagination and delivers no cargo by itself; it is a lipidation event on an existing
    bilayer, and it is separable from canonical autophagy at the domain level, needing the
    WD40 C-terminal domain of ATG16L1 that canonical autophagy does not. A search of the
    autophagy branch returns macroautophagy, microautophagy, chaperone-mediated autophagy and
    the cargo-specific children, but no term for this process, which is why curators reached
    for the nearest wrong one. LC3-associated phagocytosis, the best-known instance, likewise
    has no GO term.
suggested_questions:
- question: >-
    ATG16L1 is annotated with enables on the complex-level ligase activity, but it is the
    targeting subunit and the chemistry is done by ATG3 and ATG7. Should the conjugation
    annotations on ATG16L1, ATG5 and ATG12 all be contributes_to, with enables reserved for
    the catalytic subunits?
- question: >-
    Do the axoneme, sperm midpiece, axon, axonal transport and glutamatergic synapse
    annotations rest on any observation of human ATG16L1, or are all five downstream of the
    single mouse entry UniProtKB:Q8C0J2? Four of them are automatic, and one of those is
    inferred from another.
- question: >-
    Does the ontology need a CASM branch, and if so where should it attach - under protein
    lipidation, as proposed here, or as a sibling of macroautophagy under autophagy? The
    field is explicit that these are not bona fide autophagic processes, which argues against
    the autophagy branch.
- question: >-
    The T300A Crohn's risk variant increases caspase cleavage of ATG16L1. Which of this
    gene's two functional arms does it impair, and is the disease association better explained
    by loss of canonical autophagy or of WD40-dependent lipidation at single membranes?
suggested_experiments:
- description: >-
    Separation-of-function rescue in ATG16L1-null cells comparing full-length protein, a
    WD40-deleted mutant and an N-terminal membrane-binding mutant across canonical
    starvation-induced autophagy, LC3-associated phagocytosis, monensin-induced endosomal
    lipidation and Salmonella xenophagy, to establish which annotations belong to which arm
    and give GO a basis for splitting them.
- description: >-
    Direct test of the human localizations projected from mouse: immunostain endogenous
    ATG16L1 in human spermatozoa and in cultured human neurons, with knockout controls, to
    determine whether the axoneme, sperm midpiece, axon and synapse annotations are supported
    outside the mouse entry.
- description: >-
