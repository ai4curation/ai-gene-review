    supported_by:
    - reference_id: PMID:30778222
      supporting_text: Thus, we propose that distinct membrane binding by the two isoforms of ATG16L1 mechanistically distinguish lipidation of LC3 and GABARAP proteins at distinct cellular locations and/or under different cellular conditions.
