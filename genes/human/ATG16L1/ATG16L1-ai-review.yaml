- term:
    id: GO:0005765
    label: lysosomal membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  review:
    summary: >-
      Lysosomal membrane. Core location for the non-canonical, WD40-dependent arm of ATG16L1
      function.
    action: ACCEPT
    reason: >-
      ATG16L1 has two separable jobs, and this is the location of the second one. Its WD40
      C-terminal domain is required for ATG8-family lipidation onto single endolysosomal
      membranes and dispensable for canonical autophagy, which makes this a genuine site of
      action rather than a trafficking waypoint. Core.
    supported_by:
    - reference_id: PMID:29317426
      supporting_text: In contrast, non-canonical autophagy is a pathway through which LC3 is lipidated and inserted into single membranes, particularly endolysosomal vacuoles during cell engulfment events such as LC3-associated phagocytosis.
- term:
    id: GO:0010008
    label: endosome membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  review:
    summary: >-
      Endosome membrane, a demonstrated site of non-canonical ATG8 lipidation.
    action: ACCEPT
    reason: >-
      Lipidation onto perturbed endosomes requires the beta-isoform-specific C-terminal
      membrane-binding region of ATG16L1 and is independent of VPS34, so this is a
