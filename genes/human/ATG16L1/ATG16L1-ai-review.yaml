- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  review:
    summary: >-
      Cytoplasm, the broadest possible location for a protein with six specific ones.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      ATG16L1 is annotated to autophagosome membrane, lysosomal membrane, endosome membrane,
