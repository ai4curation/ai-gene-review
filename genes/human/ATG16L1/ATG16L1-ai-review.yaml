existing_annotations:
- term:
    id: GO:0000045
    label: autophagosome assembly
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: >-
      Autophagosome assembly, the process ATG16L1's conjugation activity drives.
    action: ACCEPT
    reason: >-
      ATG16L1 positions the ATG12-ATG5 conjugate on the phagophore, where the complex acts
      as the E3-like factor for ATG8-family lipidation and thereby drives membrane
      elongation. Supported by IMP as well as IBA across the family. Core.
- term:
    id: GO:0034045
    label: phagophore assembly site membrane
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  review:
    summary: >-
      Phagophore assembly site membrane. Four assertions describing ATG16L1 recruitment to
      the isolation membrane, not to a membrane bounding the assembly site.
    action: MODIFY
    reason: >-
      GO:0034045 asserts via bounding_layer_of that a membrane bounds the phagophore
      assembly site. The PAS is a liquid-like protein condensate with no bounding bilayer,
      and the term carries phagophore and isolation membrane as related synonyms of the
      distinct term GO:0061908 - see GO issue #29437 and
      projects/CONDENSATES/GO_0034045-annotation-audit.md. The underlying experiments here
      are unambiguous about which sense is meant: PMID:23392225 is titled for targeting of
      Atg16L1 to the isolation membrane, and PMID:32960676 shows RAB33B recruiting the
      complex to the phagophore. Moved to GO:0061908, the existing term those synonyms
      belong to; the precise destination is the phagophore membrane proposed under
      proposed_new_terms. One of the four assertions carries UniProtKB-SubCell:SL-0221, so
      this is also an SL propagation.
    proposed_replacement_terms:
    - id: GO:0061908
      label: phagophore
    supported_by:
    - reference_id: PMID:23392225
      supporting_text: Atg16L1 deletion mutants, which lack the FIP200-interacting domain, are defective in proper membrane targeting.
    - reference_id: PMID:32960676
      supporting_text: RAB33B recruits the ATG16L1 complex to the phagophore
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: MGI:MGI:1924290
        source_label: Atg16l1 (mouse)
        source_status: SUPPORTS_TRANSFER
        comment: >-
          Direct one-to-one ortholog. The localization transfers cleanly; the defect is in the
          destination term, not the inference.
      - source_id: UniProtKB:Q676U5
        source_label: ATG16L1 (the target's own experimental evidence)
        source_status: SUPPORTS_TRANSFER
        comment: >-
          The target appears among its own WITH/FROM sources because its experimental
          annotation was one of the descendant evidences behind the curator's IBD. That
          strengthens the transfer rather than making it circular, and it means the term
          issue flagged here is purely one of destination, with the underlying localization
          experimentally grounded on this gene.
      - source_id: MGI:MGI:1920933
        source_label: Atg16l2 (mouse)
        source_status: SUPPORTS_TRANSFER
        comment: >-
          Atg16l2 is a paralog rather than an ortholog, and its inclusion means the curator
          placed the IBD ancestral to both ATG16 paralogs - a positive judgment that the
          localization predates the duplication, not a dilution of the evidence. Nothing here
          bears on the term-scoping objection, which is the whole of the issue with this
          annotation.
      - source_id: PANTHER:PTN000459085
        source_label: ATG16 family node
        source_status: SUPPORTS_TRANSFER
        comment: >-
          The node grouping is sound; all members act at autophagic membranes.
- term:
    id: GO:0000421
    label: autophagosome membrane
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  review:
    summary: >-
      Autophagosome membrane, the site of the canonical conjugation reaction.
    action: ACCEPT
    reason: >-
      This is where the ATG12-ATG5-ATG16L1 complex works during canonical autophagy.
      Strictly the reaction happens on the elongating phagophore rather than on a completed
      autophagosome, which is the same phagophore/autophagosome-membrane conflation that the
      proposed phagophore membrane term is meant to resolve. Accepted as the best available
      term for a core location.
- term:
