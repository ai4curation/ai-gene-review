- term:
    id: GO:0034497
    label: protein localization to phagophore assembly site
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  review:
    summary: >-
      Protein localization to phagophore assembly site, supported by IMP.
    action: ACCEPT
