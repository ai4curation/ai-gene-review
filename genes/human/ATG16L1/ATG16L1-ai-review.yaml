    label: Atg12-Atg5-Atg16 complex
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: part_of
  review:
    summary: >-
      Atg12-Atg5-Atg16 complex. The complex ATG16L1 names and organizes.
    action: ACCEPT
    reason: >-
      ATG16L1 homodimerizes and oligomerizes the ATG12-ATG5 conjugate into the 400 kDa and
