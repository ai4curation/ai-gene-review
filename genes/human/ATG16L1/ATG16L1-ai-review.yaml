- term:
    id: GO:0042802
    label: identical protein binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: enables
  review:
    summary: >-
      Identical protein binding. Unusually informative for this term, since ATG16L1
      homodimerization is structurally required.
    action: KEEP_AS_NON_CORE
    reason: >-
      Both IPI experiments name UniProtKB:Q676U5, ATG16L1 itself, and the homodimer is real
      and functional - two RAB33B molecules bind independently to one ATG16L1 homodimer, and
      the coiled-coil-mediated dimer is the unit that assembles into the larger
      ATG12-ATG5-ATG16L1 complexes. The term still describes an interaction rather than an
      activity, and the functional consequence is already captured by GO:0034274, so this is
      kept as genuine but non-core.
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:20562859
  qualifier: enables
  review:
    summary: >-
      Bare protein binding from twenty-eight IPI experiments; uninformative as a function
      statement, and it is where several of this gene's most important interactions are
      buried.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Per project curation guidance, protein binding says nothing about what the gene
      product does. The problem is acute here because ATG16L1 is a hub and the pile hides
      mechanistically distinct partners: ATG5 and ATG12 form the conjugate it carries;
      RB1CC1 targets it to the isolation membrane; WIPI1 and WIPI2 deliver it there from the
      PtdIns3P mark; RAB33A and RAB33B recruit the complex to phagophores through a
      noncanonical Rab interaction; ATG3 hands over the ATG8 protein; MAP1LC3B, MAP1LC3C and
      GABARAPL2 are its substrates; TLR2, NOD2, TMEM59, MEFV, SPATA33 and UBAC2 connect it
      to signalling and cargo contexts. The substrate and Rab interactions in particular
      support the accepted GO:0019776 and GO:0034274 annotations and would be better
      captured there.
