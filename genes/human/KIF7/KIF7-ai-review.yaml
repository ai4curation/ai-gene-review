    summary: 'Co-precipitation of KIF7 with mouse Sufu (PMID:19592253). This is the best-characterised of the KIF7
      contacts: in growth-plate chondrocytes and in keratinocytes the positive arm of KIF7 function runs entirely
      through relieving SUFU inhibition of GLI (PMID:21795282, PMID:23034632).'
    action: MODIFY
    reason: 'A bare protein-binding row carries no functional information, but this interaction has an established
      molecular consequence, so the policy asks for MODIFY rather than removal. KIF7 does not act on GLI catalytically
      and does not carry it: it holds the GLI-SUFU complex in one place. He et al. show that without KIF7 the Gli-Sufu
      complex appears in ectopic tip-like compartments scattered along the axoneme instead of at the single distal
      tip, while entry into the cilium is unaffected (PMID:24952464). Yue et al. reach the same description from
      the biochemistry, proposing that immotile KIF7 and Cos2 work as microtubule-based tethers of signalling complexes
      (PMID:29351996). That is protein-macromolecule adaptor activity, and it is the term the pan-metazoan Hedgehog
      module already assigns to the KIF7 ciliary-tip annoton. The genetics is unusually clean here: halving the
      Sufu dose restores normal pathway activity and chondrocyte development in Kif7-null mice, which places KIF7
      upstream of SUFU as a regulator of the SUFU-GLI complex rather than as a substrate or a transporter of it
