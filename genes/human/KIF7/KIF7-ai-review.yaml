  review:
    summary: Microtubule motor activity inferred phylogenetically for the kinesin family.
    action: MODIFY
    reason: GO:0003777 describes ATP-driven movement along microtubules. Single-molecule TIRF assays show
      purified KIF7 is stationary on microtubules, and Jiang et al. 2019 describe KIF7 as a non-motile
      kinesin whose fold has been repurposed for plus-end recognition. The essence of the annotation (an
      ATP-dependent microtubule-interacting kinesin domain) is right, but the accurate activity is microtubule
      plus-end binding/tracking. This IBA is propagated from motile kinesins. KIF7 shows target-specific
      loss of motility, so it falls outside the functional clade for this activity.
    proposed_replacement_terms:
    - id: GO:0051010
      label: microtubule plus-end binding
    supported_by:
    - reference_id: PMID:24952464
      supporting_text: KIF7560-GFP molecules were stationary when bound to microtubules, exhibiting neither
        unidirectional movement nor significant diffusion along the microtubule lattice
    - reference_id: PMID:31031197
      supporting_text: The conserved non-motile kinesin Kif7 defines a "cilium-tip compartment" by localizing
        to the distal ends of axonemal microtubules
    - reference_id: PMID:31031197
      supporting_text: We propose that the ubiquitous kinesin fold has been repurposed in Kif7 to facilitate
        organization of a spatially restricted platform for localization of Hedgehog effectors at the
        cilium tip
    propagation_review:
