        diphosphate in response to microtubule binding
    - reference_id: PMID:24952464
      supporting_text: Together, our in vitro analysis suggests that the plus-end-associated KIF7 promotes catastrophe
        and inhibits microtubule growth in an ATP-hydrolysis dependent manner.
