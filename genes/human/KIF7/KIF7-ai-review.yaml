  review:
    summary: 'The PAINT node PTN000648413 asserts microtubule motor activity across the kinesin superfamily, and
      that node placement is sound: nearly every extant member sampled is a processive motor. KIF7 is the documented
      exception. Purified recombinant KIF7 binds microtubules but shows no detectable movement, and the same is
      true of Drosophila Costal-2, so the loss is a property of the whole KIF7/Costa clade rather than of human
      KIF7 alone (PMID:24952464, PMID:29351996).'
    action: MODIFY
    reason: The argument here is not with the IBD node but with whether this descendant inherited the activity.
      Yue et al. assayed all four kinesin-4 branches side by side and found KIF4 and KIF21 fast and processive,
      KIF27 slow and processive, and KIF7 and Cos2 immotile - and traced KIF7 immotility to an inability to release
      ADP on microtubule binding, i.e. a break in the motor's chemomechanical cycle rather than a loss of microtubule
      affinity (PMID:29351996). He et al. reached the same conclusion with purified KIF7 on dynamic microtubules
      (PMID:24952464). GO:0003777 is defined as "A motor activity that generates movement along a microtubule, driven
      by ATP hydrolysis", so it is contradicted. What survives is the microtubule interaction, and specifically
      plus-end binding, which is the activity the same experiments do demonstrate. Both replacement terms are already
      carried by this gene in other rows or are proposed here; the motor reading is what must go.
    proposed_replacement_terms:
    - id: GO:0051010
      label: microtubule plus-end binding
    - id: GO:0008017
      label: microtubule binding
    additional_reference_ids:
    - PMID:24952464
    - PMID:29351996
    supported_by:
