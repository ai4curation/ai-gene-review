      supporting_text: three independent proteome interactome studies have detected the interaction between P4HA2
        and KIF7
    - reference_id: PMID:38909089
      supporting_text: Notably, a strong direct interaction was observed between P4HA2 and KIF7, while no significant
        or direct interaction was detected between P4HA2 and GLI1 or SUFU
    - reference_id: PMID:38909089
      supporting_text: suggesting that the ciliary localization of P4HA2 is dependent on KIF7
    - reference_id: PMID:38909089
      supporting_text: In summary, KIF7 serves as a scaffold protein, facilitating the ciliary localization of P4HA2
        and its association with other components, thereby regulating the impact of P4HA2 on the Hh signaling pathway.
    - reference_id: PMID:38909089
      supporting_text: Additionally, KIF7, acting as a key scaffold protein, is involved in the post-translational
        modification of the Hh pathway component, facilitating the hydroxylation of key proline residues in SUFU.
