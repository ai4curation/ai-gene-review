core_functions:
- description: 'Scaffolding of the GLI regulatory complex at the tip of the primary cilium. KIF7 brings the GLI
    transcription factors, their inhibitor SUFU and accessory enzymes such as the prolyl hydroxylase P4HA2 together
    in one place, using its C-terminal GLI-binding region while remaining anchored to axonemal microtubule plus
    ends. It performs no chemistry on these partners and does not carry them into the cilium - other motors do that
    - but without KIF7 the GLI-SUFU complex disperses into ectopic tip-like compartments along the axoneme and P4HA2
    never reaches the cilium at all. This single adaptor activity accounts for both regulatory signs: it keeps GLI2
    from being activated without ligand and full-length GLI3 from being processed into its repressor, and it permits
    SUFU turnover and SUFU-GLI dissociation when the pathway turns on.'
