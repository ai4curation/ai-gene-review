core_functions:
- description: Non-motile kinesin that tracks growing microtubule plus ends and inhibits their growth.
    At the primary cilium tip this limits axoneme length and stability and organizes a single cilium-tip
    compartment.
  molecular_function:
    id: GO:0051010
    label: microtubule plus-end binding
  directly_involved_in:
  - id: GO:0031115
    label: negative regulation of microtubule polymerization
  locations:
  - id: GO:0097542
    label: ciliary tip
  supported_by:
  - reference_id: PMID:24952464
    supporting_text: Purified recombinant Kif7 binds the plus ends of growing microtubules in vitro, where
      it reduces the rate of microtubule growth and increases the frequency of microtubule catastrophe
  - reference_id: PMID:24952464
    supporting_text: KIF7560-GFP molecules were stationary when bound to microtubules, exhibiting neither
      unidirectional movement nor significant diffusion along the microtubule lattice
  - reference_id: PMID:24952464
    supporting_text: Here we show that Kif7 localizes to the cilium tip, the site of microtubule plus
      ends, where it limits cilium length and controls cilium structure
  - reference_id: PMID:21552264
    supporting_text: These findings suggest that, whereas KIF7 is not necessary for cilia formation, it
      might be involved in regulating cilia length
  - reference_id: PMID:31031197
    supporting_text: The conserved non-motile kinesin Kif7 defines a "cilium-tip compartment" by localizing
      to the distal ends of axonemal microtubules
- description: Regulates Hedgehog signal transduction downstream of Smoothened at the cilium tip, acting
    both negatively and positively. Without ligand it prevents inappropriate GLI2 activation; with ligand
    it promotes GLI3 ciliary localization and blocks GLI3 repressor processing. It does this by organizing
    the tip compartment where GLI-SUFU complexes are regulated. KIF7 binds GLI zinc fingers directly through
    its coiled coil, a DNA-mimicking interaction, and its immotility keeps GLI out of the cilium without
    signal.
  directly_involved_in:
  - id: GO:0045879
    label: negative regulation of smoothened signaling pathway
  - id: GO:0045880
    label: positive regulation of smoothened signaling pathway
  locations:
  - id: GO:0097542
    label: ciliary tip
  supported_by:
  - reference_id: PMID:19666503
    supporting_text: mouse Kif7 acts downstream of Smo and upstream of Gli2 and has both negative and
      positive roles in Shh signal transduction
  - reference_id: PMID:19592253
    supporting_text: We also demonstrate a requirement for Kif7 in the efficient localization of Gli3
      to cilia in response to Hh and for the processing of Gli3 to its repressor form
  - reference_id: PMID:19549984
    supporting_text: Kif7 physically interacted with Gli transcription factors and controlled their proteolysis
      and stability, and acted both positively and negatively in Hh signaling
  - reference_id: PMID:21552264
    supporting_text: we show deregulation of most GLI transcription factor targets and impaired GLI3 processing
      in tissues from individuals with KIF7 mutations
  - reference_id: PMID:31031197
    supporting_text: We propose that the ubiquitous kinesin fold has been repurposed in Kif7 to facilitate
      organization of a spatially restricted platform for localization of Hedgehog effectors at the cilium
      tip
  - reference_id: PMID:35725768
    supporting_text: the coiled-coil dimerization domain of KIF7, characterized by its striking shape,
      size and charge similarity to DNA, forms a complex with the DNA-binding zinc fingers in GLI, thus
      revealing a mode of tethering a DNA-binding protein to the cytoskeleton
  - reference_id: PMID:35725768
    supporting_text: showed that the Kif7-CC:Gli2-ZF complex has a Kd of 48 ± 5 nM
  - reference_id: PMID:34705483
    supporting_text: we show that the immotile behavior of KIF7 is required to prevent ciliary localization
      of Gli transcription factors in the absence of Hedgehog signaling
  molecular_function:
    id: GO:0140297
    label: DNA-binding transcription factor binding
suggested_questions:
- question: Is KIF7's ciliary length-limiting activity separable from its Hedgehog regulatory role, e.g.
    by point mutants that keep GLI binding but lose plus-end tracking?
- question: Which GLI/SUFU contacts are direct, and does KIF7 act as a scaffold (Cos2-like) or only as
    an organizer of the tip compartment?
- question: 'Kinesin-2 (KIF3A/KIF3B/KAP) carries KIF7 to the tip, and KIF7 microtubule binding is dispensable
    for signal-induced GLI tip accumulation (Yue 2022). Which KIF7 outputs require plus-end binding: length
    control only, or also GLI regulation?'
- question: Should GO represent KIF7's plus-end growth inhibition at the axoneme as a ciliary length-control
    process term? No dedicated 'regulation of cilium length' term was found.
suggested_experiments:
- description: Rescue KIF7-null human RPE1 cells with plus-end-binding-deficient KIF7 (from the Jiang
    2019 structure-guided mutants). Measure axoneme length and GLI2/GLI3 tip localization separately.
- description: Reconstitute KIF7 with GLI2/SUFU on dynamic microtubules to test whether tip-tracking KIF7
    recruits GLI-SUFU to plus ends.
