  label: Homo sapiens
description: 'KIF7 is a 1343-residue member of the kinesin-4 family and the vertebrate counterpart of Drosophila
  Costal-2, with which it shares PANTHER family PTHR24115 as a sister subfamily. It has an N-terminal kinesin motor
  domain, a coiled-coil stalk that supports homodimerisation, and a long C-terminal region carrying the GLI-binding
  and NPHP1-binding determinants. Despite the intact motor domain, KIF7 is not a transport motor: purified KIF7
  binds microtubules with high affinity but shows no detectable movement, because it cannot release ADP in response
  to microtubule binding. Instead it binds the plus ends of growing microtubules, where it slows growth and promotes
  catastrophe in an ATP-hydrolysis-dependent manner. In cells this makes KIF7 the organiser of the distal tip of
  the primary cilium: it limits cilium length, keeps the axoneme correctly modified and stable, and creates a single
  tip compartment. KIF7 concentrates at the ciliary base when Hedgehog signalling is off and redistributes to the
  tip when the pathway is activated, and it tethers the GLI transcription factors together with their inhibitor
  SUFU at that tip; it also delivers the prolyl hydroxylase P4HA2 there. Through this one scaffolding activity KIF7
  acts in both directions on the pathway downstream of Smoothened - restraining ligand-independent GLI2 activation
  and preventing ectopic activation of GLI-SUFU complexes scattered along the axoneme, while also promoting signalling
  by driving SUFU turnover and SUFU-GLI dissociation and by protecting full-length GLI3 from processing into its
  repressor form. It is not required for intraflagellar transport or for entry of pathway components into the cilium.
  In humans, loss of KIF7 causes a group of ciliopathies - acrocallosal syndrome, hydrolethalus syndrome 2, Joubert
  syndrome 12 and Al-Gazali-Bakalinova syndrome - with polydactyly, corpus callosum and other brain malformations,
  and skeletal defects, and KIF7 missense alleles act as modifiers across the wider ciliopathy spectrum.'
