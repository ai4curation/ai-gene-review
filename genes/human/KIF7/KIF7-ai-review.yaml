  review:
    summary: Purified KIF7 tracks growing microtubule plus ends, reduces their growth rate and raises
      catastrophe frequency.
    action: NEW
    reason: 'Participation test: KIF7 itself performs the step. Purified protein inhibits plus-end growth
      in vitro in an ATP-hydrolysis-dependent manner, so the claim does not rest on necessity evidence
      alone. In cells this activity is proposed to restrain axonemal plus-end growth at the cilium tip,
      explaining the long, unstable cilia of mouse mutants and of human patient fibroblasts. Mouse Kif7
      does not yet carry this term; the gap reflects the 2014 biochemistry postdating most curation rather
      than a convention (kinesin-4 relatives KIF4A/KIF21A are known growth inhibitors).'
    supported_by:
