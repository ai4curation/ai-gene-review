      tethering and the axonemal plus-end activity occur. The cytoplasmic pool is a pre-activation reservoir that
      traffics into the cilium on stimulation, which makes cytoplasm a genuine but secondary location. Kept rather
      than removed because the zebrafish work makes the cytoplasmic pool a substantive observation, and because
