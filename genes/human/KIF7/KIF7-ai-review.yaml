  review:
    summary: 'Cytoskeleton-dependent intracellular transport, propagated from the transport-kinesin node PTN009082057.
      He et al. tested this requirement directly in Kif7 mutant cilia and found it absent: intraflagellar transport
      rates are unchanged and Hh pathway proteins still enter the cilium (PMID:24952464).'
    action: REMOVE
    reason: 'This is the one KIF7 annotation for which a published experiment is a direct negative. He et al. measured
      anterograde and retrograde IFT velocities in wild-type and Kif7 mutant cilia and found no significant difference,
      showed that Gli2 still reaches the cilium without KIF7, and concluded that KIF7 is not required for normal
      intraflagellar transport or for trafficking of Hh pathway proteins into cilia. Combined with the immotility
      of the purified protein, there is no sense in which KIF7 moves cargo along the cytoskeleton. What KIF7 does
      is position cargo that other motors have already delivered - which is captured by the adaptor-activity replacements
      proposed on the protein-binding rows, not by a transport term. Removal is the right call for
      an over-propagated phylogenetic inference that specific experiments contradict.'
    additional_reference_ids:
    - PMID:24952464
    - PMID:29351996
    supported_by:
    - reference_id: PMID:24952464
      supporting_text: Kif7 is not required for normal intraflagellar transport or for trafficking of Hh pathway
        proteins into cilia.
    - reference_id: PMID:24952464
      supporting_text: Thus there was no significant difference in the rates of IFT between wild type and Kif7L130P
        cilia, indicating that KIF7 does not control cilia length by affecting the rates of IFT.
    - reference_id: PMID:24952464
      supporting_text: Thus KIF7 is not required for trafficking of Gli2 into cilia, but it does control proper
        localization of Gli2 within the cilium.
    - reference_id: PMID:29351996
      supporting_text: We suggest that evolutionarily selected sequence differences enable immotile KIF7 and Cos2
        motors to function not as transporters but as microtubule-based tethers of signaling complexes.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      - ROLE_CONFLATION
      - PSEUDO_OR_SUBACTIVITY_LOSS
      source_entities:
      - source_id: PANTHER:PTN009082057
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Node covering the transport kinesins, whose members do move cargo along microtubules. KIF7 descends
          from it but is immotile, and the transport requirement was tested and excluded experimentally in Kif7
          mutant cilia.
      residue_claims_not_applicable: 'The immotility of KIF7 is not a single-residue lesion: Yue et al. trace it
        to altered chemomechanical coupling - a failure to release ADP upon microtubule binding - which is a distributed
        property of the motor domain, so it cannot be expressed as a point-residue gain or loss.'
- term:
    id: GO:0036064
    label: ciliary basal body
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: located_in
  supporting_entities:
  - UniProtKB:B7ZNG0
  review:
    summary: 'Ciliary basal body localisation transferred by curator judgment from mouse Kif7 (UniProtKB:B7ZNG0).
      The mouse evidence is direct: Kif7-eGFP sits at the base of the primary cilium in the absence of Shh and moves
      to the tip when the pathway is activated (PMID:19666503).'
    action: ACCEPT
    reason: A sound one-to-one orthologue transfer. Mouse and human KIF7 are unambiguous orthologues in the same
      PANTHER subfamily (PTHR24115:SF445), and the mouse record independently carries an experimental IDA for this
      same term. The basal-body pool is the resting state of the protein and complements the ciliary-tip rows, which
      report the activated state; together they describe the base-to-tip redistribution that is the hallmark of
      KIF7 behaviour. Accepted as core because the redistribution, not just the endpoint, is part of how the pathway
      is read out.
    additional_reference_ids:
    - PMID:19666503
    supported_by:
    - reference_id: PMID:19666503
      supporting_text: Mouse Kif7 activity depends on the presence of cilia and Kif7-eGFP localizes to base of the
        primary cilium in the absence of Shh.
    - reference_id: PMID:19666503
      supporting_text: Activation of the Shh pathway promotes trafficking of Kif7-eGFP from the base to the tip
        of the cilium, and localization to the tip of the cilium is disrupted in a motor domain mutant.
- term:
    id: GO:0045879
    label: negative regulation of smoothened signaling pathway
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:B7ZNG0
  review:
    summary: 'Negative regulation of the smoothened signaling pathway, transferred from mouse Kif7. Mouse Kif7 carries
      three independent IMP rows for this term, from three separate 2009 studies, and the phenotype is consistent
      across species: loss of Kif7 causes ectopic, ligand-independent pathway activity (PMID:19666503, PMID:19549984,
      PMID:19592253).'
    action: ACCEPT
    reason: Core, and mechanistically explained rather than merely observed. KIF7 restrains the pathway by confining
      GLI-SUFU complexes to a single ciliary tip compartment; when KIF7 is absent, those complexes appear in ectopic
      tip-like sites along the axoneme where they are inappropriately activated without ligand (PMID:24952464).
      The transfer from mouse is safe - same subfamily, same phenotype reported in zebrafish and in human patient
      tissue - and the negative arm is one of the two halves of KIF7 function that every study since 2009 has reproduced.
    additional_reference_ids:
    - PMID:19666503
    - PMID:19549984
    - PMID:24952464
    - PMID:21552264
    supported_by:
    - reference_id: PMID:19666503
      supporting_text: we show that, similar to Drosophila and zebrafish Cos2, mouse Kif7 acts downstream of Smo
        and upstream of Gli2 and has both negative and positive roles in Shh signal transduction
    - reference_id: PMID:19549984
      supporting_text: Similar to Cos2, Kif7 physically interacted with Gli transcription factors and controlled
        their proteolysis and stability, and acted both positively and negatively in Hh signaling.
    - reference_id: PMID:24952464
      supporting_text: Instead, a central function of Kif7 in the mammalian Hh pathway is to control cilium architecture
        and to create a single cilium tip compartment, where Gli-Sufu activity can be correctly regulated.
    - reference_id: PMID:24952464
      supporting_text: We propose that the ectopic activation of the pathway seen in Kif7 mutants is due to the
        ectopic Gli/Sufu complexes away from the cilia tip, where they become inappropriately activated in the absence
        of ligand
    - reference_id: PMID:21552264
      supporting_text: Consistent with a role of KIF7 in Hedgehog signaling, we show deregulation of most GLI transcription
        factor targets and impaired GLI3 processing in tissues from individuals with KIF7 mutations.
- term:
    id: GO:0045880
    label: positive regulation of smoothened signaling pathway
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:B7ZNG0
  review:
    summary: 'Positive regulation of the smoothened signaling pathway, transferred from mouse Kif7, which carries
      two IMP rows for the term. The positive arm has been dissected genetically: it consists of relieving SUFU
      inhibition of GLI, and is separable from the negative arm (PMID:21795282, PMID:23034632).'
    action: ACCEPT
    reason: 'Core. The apparent paradox of one protein carrying both regulatory signs is resolved rather than unexplained
      here: KIF7 promotes signalling by driving SUFU turnover and SUFU-GLI dissociation, and halving the Sufu dose
      is sufficient to restore normal pathway output in Kif7-null mice - a genetic demonstration that the positive
      role is to restrict SUFU (PMID:21795282). The same Sufu-dependent positive function operates in keratinocytes
      (PMID:23034632) and in zebrafish (PMID:24339784). Endoh-Yamagami et al. describe the other positive contribution,
      preventing inappropriate GLI3 cleavage into the repressor form in the presence of ligand (PMID:19592253).
      This is the annotation that matches the Hedgehog module, where the KIF7 annoton serves both the off and the
      on state.'
    additional_reference_ids:
    - PMID:21795282
    - PMID:23034632
    - PMID:24339784
    - PMID:19592253
    supported_by:
    - reference_id: PMID:21795282
      supporting_text: Importantly, halving the dose of Sufu restores normal hedgehog pathway activity and chondrocyte
        development in Kif7-null mice, demonstrating that the positive role of Kif7 is to restrict the inhibitory
        activity of Sufu.
    - reference_id: PMID:23034632
      supporting_text: 'Kif7 possesses Sufu-dependent and -independent regulatory functions in Hh signaling: while
        it promotes Hh pathway activity through the dissociation of Sufu-Gli2 complex, it also contributes to the
        repression of Hh target genes in the absence of Sufu.'
    - reference_id: PMID:24339784
      supporting_text: We also show that zebrafish Kif7 potentiates Gli2a activity by promoting its dissociation
        from the Suppressor of Fused (Sufu) protein
    - reference_id: PMID:19592253
      supporting_text: These results suggest a role for Kif7 in coordinating Hh signal transduction at the tip of
        cilia and preventing Gli3 cleavage into a repressor form in the presence of Hh.
- term:
    id: GO:0097542
    label: ciliary tip
  evidence_type: IDA
  original_reference_id: GO_REF:0000052
  qualifier: located_in
  review:
    summary: Ciliary tip localisation from curated immunofluorescence (HPA, GO_REF:0000052). This is the defining
      localisation of KIF7 and is reproduced in mouse, human and zebrafish cells (PMID:19592253, PMID:24952464,
      PMID:24339784).
    action: ACCEPT
    reason: 'Core, and the single most informative component annotation KIF7 has. The tip is where the microtubule
      plus ends are, which is why a plus-end-binding protein ends up there (PMID:24952464), and it is where the
      GLI-SUFU complexes it regulates are enriched. Targeting is autonomous: KIF7 still reaches cilia tips in cells
      lacking Smo or Gli2 and Gli3. This is exactly the location the Hedgehog module assigns to the KIF7 ciliary-tip
      scaffold annoton.'
    additional_reference_ids:
    - PMID:19592253
    - PMID:24952464
    supported_by:
    - reference_id: PMID:19592253
      supporting_text: We show that Kif7 accumulates at the distal tip of the primary cilia in a Hh-dependent manner.
    - reference_id: PMID:24952464
      supporting_text: Here we show that Kif7 localizes to the cilium tip, the site of microtubule plus ends, where
        it limits cilium length and controls cilium structure.
    - reference_id: PMID:24952464
      supporting_text: KIF7 was also present at cilia tips in MEFs derived from mutant embryos that lack Smo or
        Gli2 and Gli3, indicating that KIF7 is targeted to cilia independently of Shh pathway proteins
