- description: 'Microtubule plus-end binding that limits axonemal microtubule growth. Purified KIF7 tracks the plus
    ends of growing microtubules, reduces their growth rate in a dose-dependent way and increases catastrophe frequency,
    and it does so only at plus ends - minus-end dynamics are unaffected. The activity requires ATP hydrolysis and
    is abolished by AMP-PNP, yet it is not motility: KIF7 cannot convert hydrolysis into stepping, so it acts as
    a stationary plus-end regulator rather than a transporter. In the cilium this is what sets cilium length, keeps
    the axoneme acetylated, glutamylated and stable, and confines the tip to a single compartment, which is the
    structural precondition for the scaffolding function above.'
