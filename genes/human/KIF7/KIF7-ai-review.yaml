  review:
    summary: 'ATP hydrolysis activity from the kinesin PAINT node. Measured directly on purified KIF7: basal and
      microtubule-stimulated ATPase rates were determined by NADH-coupled assay, and the plus-end activity is ATP-hydrolysis
      dependent (PMID:29351996, PMID:24952464).'
    action: ACCEPT
    reason: 'Worth separating carefully from the motor-activity row, because the two fail and survive for the same
      reason. KIF7 hydrolyses ATP - weakly, with only about a fivefold microtubule stimulation rather than the large
      stimulation seen in transport kinesins - and that hydrolysis is what powers catastrophe promotion, since AMP-PNP
      abolishes the effect. What KIF7 has lost is the coupling of hydrolysis to stepping, not hydrolysis itself.
      The activity is therefore accepted, and is core: it is the energetic basis of the plus-end function.'
    additional_reference_ids:
    - PMID:29351996
    - PMID:24952464
    supported_by:
