  review:
    summary: 'Co-precipitation of KIF7 with human GLI3, one of five pathway partners reported together in Endoh-Yamagami
      et al. The same paper shows the functional consequence: KIF7 is required for efficient GLI3 localisation to
      cilia in response to Hh and for GLI3 repressor processing (PMID:19592253).'
    action: MODIFY
    reason: 'A bare protein-binding row carries no functional information, but this interaction has an established
      molecular consequence, so the policy asks for MODIFY rather than removal. KIF7 does not act on GLI catalytically
      and does not carry it: it holds the GLI-SUFU complex in one place. He et al. show that without KIF7 the Gli-Sufu
      complex appears in ectopic tip-like compartments scattered along the axoneme instead of at the single distal
      tip, while entry into the cilium is unaffected (PMID:24952464). Yue et al. reach the same description from
      the biochemistry, proposing that immotile KIF7 and Cos2 work as microtubule-based tethers of signalling complexes
      (PMID:29351996). That is protein-macromolecule adaptor activity, and it is the term the pan-metazoan Hedgehog
      module already assigns to the KIF7 ciliary-tip annoton. For GLI3 specifically the downstream readout is documented
      twice over: impaired GLI3 processing is also what is seen in tissue from patients carrying KIF7 mutations
      (PMID:21552264).'
    proposed_replacement_terms:
    - id: GO:0030674
      label: protein-macromolecule adaptor activity
    additional_reference_ids:
    - PMID:24952464
    - PMID:29351996
    - PMID:21552264
    supported_by:
    - reference_id: PMID:19592253
      supporting_text: We also demonstrate a requirement for Kif7 in the efficient localization of Gli3 to cilia
        in response to Hh and for the processing of Gli3 to its repressor form.
    - reference_id: PMID:19592253
      supporting_text: These results suggest a role for Kif7 in coordinating Hh signal transduction at the tip of
        cilia and preventing Gli3 cleavage into a repressor form in the presence of Hh.
    - reference_id: PMID:24952464
      supporting_text: indicating that KIF7 is required to restrict Gli-Sufu complexes to the distal end of the
        cilium
    - reference_id: PMID:29351996
      supporting_text: We suggest that evolutionarily selected sequence differences enable immotile KIF7 and Cos2
        motors to function not as transporters but as microtubule-based tethers of signaling complexes.
    - reference_id: PMID:21552264
      supporting_text: Consistent with a role of KIF7 in Hedgehog signaling, we show deregulation of most GLI transcription
        factor targets and impaired GLI3 processing in tissues from individuals with KIF7 mutations.
