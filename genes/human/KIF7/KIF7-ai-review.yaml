      with KIF7 acting as the scaffold that delivers P4HA2 to the ciliary tip and couples it to the SUFU-GLI complex
      (PMID:38909089).
    action: MODIFY
    reason: 'Three high-throughput screens finding the same interaction would not by itself justify anything more
      than removal of an uninformative row. What changes the call is that the interaction was subsequently validated
      and given a mechanism, in a paper that explicitly credits these three screens as its prior support (PMID:38909089).
      In that work P4HA2 binds KIF7 directly - and only KIF7, not GLI1 or SUFU - through the KIF7 GLI-binding domain;
      KIF7 knockdown reduces P4HA2 association with GLI1 and with SUFU; and in KIF7-knockout cells P4HA2 no longer
      reaches the cilium at all. The authors state the conclusion in the terms GO uses: KIF7 serves as a scaffold
      protein. So the informative molecular function behind these rows is protein-macromolecule adaptor activity,
      the same activity that covers the GLI and SUFU contacts and the same term the Hedgehog module assigns to the
      KIF7 annoton.'
    proposed_replacement_terms:
    - id: GO:0030674
      label: protein-macromolecule adaptor activity
    additional_reference_ids:
    - PMID:38909089
    supported_by:
