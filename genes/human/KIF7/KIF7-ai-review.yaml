suggested_questions:
- question: KIF7 hydrolyses ATP and needs that hydrolysis to promote microtubule catastrophe, yet it cannot step.
    Is there a GO molecular function that captures a nucleotide-driven, non-translocating plus-end regulator, or
    does the ontology force such proteins to choose between "microtubule motor activity", which is false, and "microtubule
    plus-end binding", which omits the catalysis? This affects every immotile kinesin, not only KIF7.
  experts: []
- question: Does the single adaptor activity proposed here really account for both regulatory signs, or are the
    negative and positive arms separable at the level of KIF7 itself? Halving Sufu rescues the Kif7-null chondrocyte
    phenotype, which argues that the positive arm is entirely SUFU-directed, while the negative arm persists when
    Sufu is absent. A KIF7 separation-of-function allele would settle whether these are one activity read in two
    contexts or two activities.
  experts: []
- question: KIF7 homodimerises and mouse Kif7 carries an experimental identical-protein-binding annotation, but
    human KIF7 has no such row. Is dimerisation required for plus-end tracking, as it is for other kinesin-4 proteins,
    and if so should it be annotated for human KIF7 despite being another uninformative child of protein binding?
  experts: []
- question: Zebrafish Kif7 accumulates in cytoplasmic puncta that disperse on pathway activation, and Drosophila
    Costal-2 can substitute for Kif7 outright. Do mammalian cells retain a functional cytoplasmic KIF7-GLI complex
    of the Drosophila kind alongside the ciliary one, or is the cytoplasmic pool purely a staging reservoir? The
    answer decides whether cytoplasm deserves more than a non-core location for vertebrate KIF7.
  experts: []
- question: P4HA2 reaches the ciliary tip only via KIF7 and hydroxylates SUFU there. Is P4HA2 one of a wider set
    of modifying enzymes that KIF7 delivers to the tip, which would make "enzyme-delivery adaptor" the general description
    of KIF7 function, or is it a lineage- or tissue-specific addition to the pathway?
  experts: []
suggested_experiments:
- hypothesis: The GLI-SUFU tethering function of KIF7 is a consequence of plus-end binding and fails whenever KIF7
    cannot reach or hold microtubule plus ends.
  description: 'Build KIF7 variants that separate the two activities: motor-domain point mutants that abolish microtubule
    binding but retain the GLI-binding region, and C-terminal truncations that retain plus-end tracking but lose
    GLI binding. Express each at endogenous level in KIF7-null cells and score, in parallel, plus-end tracking in
    vitro, cilium length and axonemal acetylation, the number of IFT81-positive tip-like compartments, and the distribution
    of GLI2 and SUFU along the axoneme. If tethering is downstream of plus-end binding, the motor-domain mutants
    should reproduce the full null phenotype while the C-terminal truncations should give normal cilium architecture
    with mislocalised GLI-SUFU.'
  experiment_type: structure-guided mutagenesis with paired in vitro and ciliary readouts
- hypothesis: KIF7 positions GLI-SUFU complexes that other motors deliver, rather than transporting them, so acute
    loss of KIF7 should redistribute existing ciliary GLI without changing its rate of entry.
  description: Use an inducible degron on endogenous KIF7 in cells expressing tagged GLI2 and SUFU, and follow single
    complexes by live imaging through the first hour of KIF7 depletion. Measure entry frequency at the ciliary base,
    transit velocity, dwell time at the tip, and the appearance of ectopic dwell sites along the axoneme, alongside
    IFT particle velocities in the same cells. Transport models predict reduced entry and slowed transit; the tethering
    model predicts unchanged entry and transit with loss of tip dwell and new ectopic dwell sites.
  experiment_type: acute degron depletion with single-particle live ciliary imaging
- hypothesis: KIF7 is a general delivery adaptor for enzymes that modify the GLI-SUFU complex at the ciliary tip,
    of which P4HA2 is one example.
  description: Compare the ciliary-tip proteome of wild-type and KIF7-null cells before and after pathway activation,
    using tip-targeted proximity labelling rather than whole-cilium preparations so that ectopic tip-like compartments
    can be distinguished from the true tip. Cross-reference the KIF7-dependent set against the KIF7 GLI-binding-domain
    interactome and test the strongest candidates for SUFU or GLI modification in vitro. A set of modifying enzymes
    whose ciliary delivery requires KIF7 would generalise the P4HA2 result; a KIF7-dependent set limited to GLI,
    SUFU and P4HA2 would not.
  experiment_type: compartment-resolved proximity labelling with targeted biochemical follow-up
