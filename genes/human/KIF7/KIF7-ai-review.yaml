  review:
    summary: Co-precipitation of KIF7 with human SMO, reported in the same five-partner panel as the GLI and SUFU
      contacts (PMID:19592253; UniProt SUBUNIT "Interacts with GLI1, GLI2, GLI3, SMO and SUFU"). Unlike the GLI
      and SUFU contacts, no molecular consequence of a vertebrate KIF7-SMO contact has been established.
    action: REMOVE
    reason: The interaction itself is not disputed and removal does not say it is false. The problem is that a bare
      protein-binding row is uninformative and, for this pair, nothing more informative is supported. KIF7 acts
      genetically downstream of SMO (PMID:19666503), which is a pathway-order statement, not evidence that KIF7
      tethers SMO to anything; and He et al. found KIF7 still at cilia tips in cells lacking Smo, so KIF7 localisation
      does not depend on SMO either (PMID:24952464). Assigning adaptor activity on the strength of this row alone
      would be inventing a function from interaction evidence. The Drosophila Costal-2-Smoothened tail interaction
      is a real scaffold recruitment step, but it is curated in the Drosophila arm of the module and does not license
      the vertebrate claim.
    additional_reference_ids:
    - PMID:19666503
    - PMID:24952464
