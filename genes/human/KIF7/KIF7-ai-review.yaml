  review:
    summary: 'Cytoplasm as the active compartment, from the kinesin-superfamily PAINT node. There is a real cytoplasmic
      KIF7 pool: endogenous zebrafish Kif7 forms cytoplasmic puncta that disperse on pathway activation (PMID:24339784),
      and KIF7 co-localises with P4HA2 in the cytoplasm before stimulation (PMID:38909089).'
    action: KEEP_AS_NON_CORE
