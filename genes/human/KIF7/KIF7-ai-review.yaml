id: Q2M1P5
gene_symbol: KIF7
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'KIF7 is a kinesin-4 family protein and the vertebrate ortholog of Drosophila Costal2. It
  is a homodimeric, non-motile kinesin. Its motor domain binds microtubules and hydrolyses ATP but does
  not walk; instead it tracks the GTP-tubulin-rich plus ends of growing microtubules, slowing their growth
  and promoting catastrophe. In primary cilia KIF7 concentrates at the distal tip, where the axonemal
  plus ends lie, and it moves there from the ciliary base when the Hedgehog pathway is activated. At the
  tip it limits axoneme length and stability and builds a single cilium-tip compartment. GLI transcription
  factors and SUFU are regulated in this compartment. KIF7 acts downstream of Smoothened. Its coiled coil
  binds the DNA-binding zinc fingers of GLI proteins directly by mimicking DNA, tethering GLI to microtubules;
  kinesin-2-driven IFT carries KIF7 to the tip. It has dual roles in Hedgehog signaling: it suppresses
  GLI2 activation without ligand, and it promotes GLI3 ciliary localization while preventing GLI3 processing
  into its repressor form when ligand is present. Loss of KIF7 gives long, unstable cilia with mislocalized
  GLI-SUFU. In humans, mutations cause hydrolethalus syndrome, acrocallosal syndrome and Joubert syndrome
  (JBTS12), and KIF7 acts as a modifier across the ciliopathy spectrum.'
