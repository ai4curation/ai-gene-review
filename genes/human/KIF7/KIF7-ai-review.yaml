    summary: Kinesin complex membership from the superfamily PAINT node. KIF7 does dimerise - UniProt records "Can
      form homodimers and interacts with microtubules", the protein has the canonical coiled-coil stalk (UniProt
      COILED 480..542), and mouse Kif7 carries an experimental identical-protein-binding annotation from He et al.
    action: KEEP_AS_NON_CORE
    reason: 'The structural claim holds: a coiled-coil-mediated kinesin homodimer satisfies the first clause of
      the GO:0005871 definition. But the definition goes on to describe kinesin complexes as generally possessing
      "a force-generating enzymatic activity, or motor, which converts the free energy of the gamma phosphate bond
      of ATP into mechanical work" - which is exactly what KIF7 does not do. Retaining the row as non-core records
