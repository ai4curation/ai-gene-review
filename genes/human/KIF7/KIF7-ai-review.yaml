  review:
    summary: Microtubule-based movement from the kinesin-superfamily PAINT node. KIF7 is immotile and is not required
      for intraflagellar transport, so the motility sense of this term does not apply; but KIF7 does act on microtubule
      dynamics, slowing growth and promoting catastrophe at plus ends (PMID:24952464, PMID:29351996).
    action: MODIFY
    reason: 'GO:0007018 is broad enough to be technically defensible - its definition admits "movement driven by
      polymerization or depolymerization of microtubules", and KIF7 does drive depolymerisation of axonemal plus
      ends. That is why MODIFY rather than REMOVE is right: the parent statement survives through a clause the PAINT
      node did not intend, while the reason the node placed the term here (processive transport) is false for this
      descendant. Replacing it with negative regulation of microtubule polymerization states what KIF7 actually
      does and removes the motor implication.'
    proposed_replacement_terms: &id001
    - id: GO:0031115
      label: negative regulation of microtubule polymerization
    additional_reference_ids:
    - PMID:24952464
    - PMID:29351996
    supported_by:
    - reference_id: PMID:24952464
      supporting_text: Purified recombinant Kif7 binds the plus ends of growing microtubules in vitro, where it
        reduces the rate of microtubule growth and increases the frequency of microtubule catastrophe.
    - reference_id: PMID:24952464
      supporting_text: In addition to promoting catastrophe, KIF7 decreased the rate of microtubule growth in a
        dose-dependent manner
    - reference_id: PMID:24952464
      supporting_text: Kif7 is not required for normal intraflagellar transport or for trafficking of Hh pathway
        proteins into cilia.
    - reference_id: PMID:29351996
      supporting_text: KIF4 and KIF21 motors are fast and processive, KIF7 and its Drosophila melanogaster homologue
        Costal2 (Cos2) are immotile, and KIF27 is slow and processive.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN000648413
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: The node asserts movement in the transport sense. KIF7 satisfies the term only through its polymerisation/depolymerisation
          clause, so the precise child term is the correct annotation for this descendant.
      residue_claims_not_applicable: 'The immotility of KIF7 is not a single-residue lesion: Yue et al. trace it
        to altered chemomechanical coupling - a failure to release ADP upon microtubule binding - which is a distributed
        property of the motor domain, so it cannot be expressed as a point-residue gain or loss.'
