  review:
    summary: Dafinger et al. is the source of this IDA. Its abstract calls KIF7 "a putative ciliary motor protein"
      and its cell-biological result is that KIF7 knockdown perturbs tubulin acetylation and microtubule dynamics
      - a microtubule-directed activity, read at the time as motility (PMID:21633164). Purified-protein work published
      afterwards shows KIF7 does not move along microtubules (PMID:24952464, PMID:29351996).
    action: MODIFY
    reason: 'This is not a case of second-guessing an assay that the cached abstract happens not to show. The 2011
      paper frames motor activity as putative, and two later studies measured motility directly on purified KIF7
      - single-molecule imaging plus microtubule gliding in Yue et al., TIRF assays on dynamic microtubules in He
      et al. - and found none. The underlying observation the IDA rests on (KIF7 acting on microtubules and their
      post-translational state) is sound and is retained by replacing the term with microtubule plus-end binding,
      the activity the purified protein does have. Even the motor-domain requirement reported for ciliary-tip targeting
      (PMID:19666503) is consistent with this: the domain is needed because it binds microtubules, not because it
      walks.'
    proposed_replacement_terms:
    - id: GO:0051010
      label: microtubule plus-end binding
    - id: GO:0008017
      label: microtubule binding
    additional_reference_ids:
    - PMID:24952464
    - PMID:29351996
    - PMID:19666503
    supported_by:
    - reference_id: PMID:21633164
      supporting_text: Interestingly, KIF7 is a known regulator of Hedgehog signaling and a putative ciliary motor
        protein.
    - reference_id: PMID:21633164
      supporting_text: These cellular phenotypes likely resulted from abnormal tubulin acetylation and microtubular
        dynamics.
    - reference_id: PMID:24952464
      supporting_text: KIF7 can interact directly with microtubules but lacks detectable motility
    - reference_id: PMID:29351996
      supporting_text: KIF4 and KIF21 motors are fast and processive, KIF7 and its Drosophila melanogaster homologue
