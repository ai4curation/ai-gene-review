suggested_questions:
- question: Given that RAB8 is activated only after ciliary vesicle assembly, is RAB8A required for distal
    appendage vesicle delivery at all, or exclusively for ciliary vesicle extension and ciliary membrane
    growth?
- question: How much do RAB8A and RAB8B (and RAB10) compensate for each other in ciliogenesis and polarized
    exocytosis in vivo?
- question: Does LRRK2 phosphorylation of RAB8A (Thr72) suppress ciliogenesis in physiologically relevant
    cells, and through which phospho-Rab effectors (RILPL1, RILPL2, JIP4)?
suggested_experiments:
- description: Acute degron-mediated depletion of RAB8A (with RAB8B knockout) in RPE1 cells at defined
    times after serum starvation, imaged by CLEM, to pinpoint the ciliogenesis step that requires RAB8
    activity.
  experiment_type: acute depletion and CLEM
- description: Phospho-mimetic/phospho-dead Thr72 RAB8A knock-in cells to test the effect of LRRK2 phosphorylation
    on ciliary membrane assembly and effector recruitment.
  experiment_type: knock-in and imaging
