id: P61006
gene_symbol: RAB8A
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: RAB8A is a ubiquitously expressed Rab-family small GTPase (Sec4/Rab8 subfamily) that is C-terminally
  geranylgeranylated and cycles between an inactive GDP-bound form and an active GTP-bound form. It is
  activated by GEFs including Rabin8 (RAB3IP), GRAB (RAB3IL1), RPGR and the C9ORF72-SMCR8 complex, inactivated
  by GAPs such as TBC1D30 and TBC1D17, and phosphorylated in its switch II region by LRRK2. Active RAB8A
  recruits effectors (myosin V motors, MICAL-L1/EHD1, optineurin, OCRL, MICAL1) to direct post-Golgi and
  recycling-endosome carriers to the plasma membrane, supporting polarized exocytosis, endocytic recycling
  and delivery of cargoes such as E-cadherin and neurotransmitter receptors. In ciliogenesis, RAB8A is
  activated by Rabin8 at the mother centriole downstream of RAB11, after the ciliary vesicle has formed,
  and drives extension of the ciliary membrane; it is the only Rab enriched in the primary cilium, where
  it resides in the ciliary membrane. It also functions in Golgi organization, cytokinesis (midbody vesicle
  delivery) and autophagy.
