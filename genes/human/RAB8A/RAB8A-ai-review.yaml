    summary: Generic protein binding (IPI, PMID:15207266) with SNCA.
    action: REMOVE
    reason: Interaction with SNCA comes from an interaction-mapping, pathology or host-pathogen study
      without evidence that it is part of RAB8A's normal function. As for most Rab-partner interactions,
      the bare 'protein binding' term carries no functional information; RAB8A's molecular function is
      captured by GTPase activity/GTP binding, and its roles by the trafficking process and location annotations.
      Removal does not mean the interaction is false.
