core_functions:
- description: Binds tRNA with high affinity as an auxiliary component of the aminoacyl-tRNA
    synthetase complex, supporting substrate recruitment and efficient aminoacylation by the cognate
    synthetases. Intact p43 binds more strongly than its separated domains and lowers the apparent
    tRNA Km of human RARS without supplying aminoacyl-transfer chemistry.
  molecular_function:
    id: GO:0000049
    label: tRNA binding
  directly_involved_in:
  - id: GO:0006418
    label: tRNA aminoacylation for protein translation
  locations:
  - id: GO:0005829
    label: cytosol
  in_complex:
    id: GO:0017101
    label: aminoacyl-tRNA synthetase multienzyme complex
  supported_by:
  - reference_id: PMID:11306575
    supporting_text: p43/proEMAPII has a strong tRNA binding capacity (K(D) = 0.2 microm)
  - reference_id: PMID:10358004
    supporting_text: Pro-EMAPII reduced the apparent Km of RRS to tRNA, whereas the kcat value
      remained unchanged.
- description: Provides structural contacts that organize the RARS1–QARS1 subcomplex and connect it
    to AIMP2 in the multi-synthetase complex. Human complex structures and interface-disrupting
    mutants distinguish this assembly function from generic protein association.
  molecular_function:
    id: GO:0140378
    label: protein complex scaffold activity
  directly_involved_in:
  - id: GO:0006418
    label: tRNA aminoacylation for protein translation
  locations:
  - id: GO:0005829
    label: cytosol
  in_complex:
    id: GO:0017101
    label: aminoacyl-tRNA synthetase multienzyme complex
  supported_by:
  - reference_id: PMID:25288775
    supporting_text: This ternary complex was further anchored to AIMP2/p38 through interaction with
      AIMP1.
  - reference_id: PMID:19131329
    supporting_text: The data are consistent with a structural role of the three nonsynthetase
      components of MARS
suggested_questions:
- question: Which endogenous human conditions release full-length AIMP1 versus processed EMAP-II,
    and how do their local concentrations determine endothelial migration, survival and apoptosis?
- question: What topology and trafficking route place AIMP1 in the gp96/KDELR1-associated ER/Golgi
    pool while most protein is retained in the cytosolic synthetase complex?
- question: Which rat experiment underlies the current Ensembl antiviral-defense transfer, and what
    conserved human AIMP1 activity does it establish?
