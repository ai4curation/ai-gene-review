id: Q12904
gene_symbol: AIMP1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: AIMP1, also called p43 or proEMAPII, is a tRNA-binding auxiliary component of the
  mammalian aminoacyl-tRNA synthetase multienzyme complex. Its N-terminal interaction region helps
  organize the RARS1–QARS1 subcomplex and connect it to AIMP2, while cooperation between its N- and
  C-terminal regions supports high-affinity tRNA binding and stimulation of arginyl-tRNA
  aminoacylation. AIMP1 is predominantly cytosolic, with a nuclear complex-associated pool and
  additional ER/Golgi-associated populations. Full-length AIMP1 and its processed C-terminal EMAP-II
  domain also have extracellular cytokine activities. These include leukocyte recruitment and
  context-dependent endothelial responses; recombinant full-length p43 stimulates endothelial
  migration at lower concentrations and apoptosis at higher concentrations. Caspase-7 cleavage can
  release EMAP-II from the complex and greatly reduce the high-affinity RNA-binding capacity of
  intact p43. AIMP1 also participates in gp96 retention and retrieval at the ER–Golgi interface.
  Biallelic pathogenic variants cause a severe neurodevelopmental disorder with hypomyelination.
