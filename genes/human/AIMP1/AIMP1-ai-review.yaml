- term:
    id: GO:0006915
    label: apoptotic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000043
  review:
    summary: Extracellular p43 can positively regulate endothelial apoptosis.
    action: MODIFY
    reason: PMID:12237313 directly assayed apoptosis induced by higher concentrations of recombinant
      full-length p43 in bovine aortic endothelial cells, including DNA fragmentation and caspase
      activation. This positive effector evidence is distinct from AIMP1 merely being cleaved during
      apoptosis. Refine the broad apoptosis keyword to positive regulation of endothelial cell
      apoptotic process, with the recombinant-ligand, endothelial-cell and dose boundaries explicit.
      The same study reports migration at lower doses, so the replacement describes the high-dose
      apoptotic arm rather than a uniform response to p43.
    additional_reference_ids:
    - PMID:12237313
    proposed_replacement_terms:
    - id: GO:2000353
      label: positive regulation of endothelial cell apoptotic process
    supported_by:
    - reference_id: PMID:12237313
      supporting_text: It promoted the migration of endothelial cells at low dose but induced their
        apoptosis at high dose.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      source_entities:
      - source_id: UniProtKB-KW:KW-0053
        source_status: SUPPORTS_TRANSFER
        comment: The keyword combines apoptosis-associated processing and extracellular effector
          activity; the latter supports a more precise regulatory process.
      failure_modes:
      - GRANULARITY_MISMATCH
