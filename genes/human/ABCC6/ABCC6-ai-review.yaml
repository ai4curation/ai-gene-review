- term:
    id: GO:0055062
    label: phosphate ion homeostasis
  evidence_type: IDA
  original_reference_id: PMID:28592560
  qualifier: involved_in
  review:
    summary: >-
      The mechanistic evidence concerns extracellular pyrophosphate availability and mineralization rather
      than phosphate-ion steady-state regulation.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      GO:0055062 denotes maintenance of phosphate-ion levels. The full 2017 studies assess PPi, ATP-catabolizing
      enzymes and calcium-phosphate deposition; pyrophosphate is a distinct chemical species, not interchangeable
      with inorganic phosphate. The mouse dietary study reports no serum phosphate difference in the compared
      groups. These findings support anti-mineralization, already represented by GO:0140928, but do not
      establish phosphate-ion homeostasis as a separate ABCC6 process. Mouse evidence includes independent
      studies as well as human-derived transfers, so the chain is not simply circular.
    supported_by:
    - *id012
    - &id013
      reference_id: PMID:24732453
      supporting_text: >-
        No difference in serum calcium, inorganic phosphate or pyrophosphate concentrations was noted
        (Table 1).
