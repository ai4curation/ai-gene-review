  findings:
  - statement: >-
      Full text read: native human/mouse liver and primary mouse hepatocyte staining supports basolateral
      localization and disputes earlier MAM attribution for full-length protein. Does not negate URG7
      isoform ER data.
    supporting_text: >-
      Our results show unambiguously that in frozen sections of mouse and human livers, Abcc6/ABCC6 is
      colocalized with the plasma membrane markers cadherin (Figure 1A, D) and catenin (not shown) as
      well as the basolateral membrane marker Na,K-ATPase (Figure 1B).
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed/Entrez identity verified by the supported publication fetch. Full text read: native human/mouse
      liver and primary mouse hepatocyte staining supports basolateral localization and disputes earlier
      MAM attribution for full-length protein. Does not negate URG7 isoform ER data.
