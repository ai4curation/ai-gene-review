  review:
    summary: >-
      The ABCC6 C-terminal peptide binds a PDZ domain of DLG4; PDZ domain binding is more informative
      than generic protein binding.
    action: MODIFY
    reason: >-
      Primary Supplementary Dataset 1 identifies O95255 peptide YRLAQESGLV (residues 1494-1503) and quantified
      affinity for DLG4_2 (row 16646, pKd 3.5488). This supports GO:0030165 at the fragment-assay level,
      without demonstrating a full-length cellular complex or a role for this partner in ATP release.
      The source audit records all measured domains and the IntAct discrepancy; other unquantified domains
      do not negate this positive domain result. This ancillary tail interaction is not included as a
      core transport function.
    supported_by:
    - *id001
    proposed_replacement_terms:
    - id: GO:0030165
      label: PDZ domain binding
