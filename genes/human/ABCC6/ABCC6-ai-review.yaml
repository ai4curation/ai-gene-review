        does not transport nucleoside triphosphates.
    - &id010
      reference_id: PMID:24969777
      supporting_text: >-
        Factors could be missing in vitro, however, that allows ABCC6 to transport ATP in vivo, or ABCC6
        could indirectly stimulate ATP release by regulating vesicular transport or ion channels.
