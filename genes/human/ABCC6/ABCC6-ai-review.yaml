  review:
    summary: >-
      The positive interaction assignment with GRID2IP cannot be confidently reconciled with the source
      affinity data.
    action: UNDECIDED
    reason: >-
      Full text and Supplementary Dataset 1 were inspected. The ABCC6 peptide has composite pKd=0 for
      the assayed GRID2IP domains (50463, 61669), with no quantified positive domain affinity recovered
      for this partner. Matching IntAct records label the interactions non-negative but report kd:1.0x10(molar),
      unlike quantified micromolar values. This is an unresolved threshold/export interpretation, not
      proof of universal nonbinding: only sampled domains and a 10-residue peptide were assayed, and the
      paper distinguishes unquantifiable weak affinities. Retain the original IPI tuple pending reconciliation
      rather than inventing a specific positive molecular function or interpreting zero as a biological
      negative.
    supported_by:
    - &id001
      reference_id: PMID:36115835
      supporting_text: >-
        We quantified 18,332 unique dissociation constants, whereas 46,825 PDZ-PBM affinities representing
        72% of the explored space remained below the assay’s quantification threshold.
