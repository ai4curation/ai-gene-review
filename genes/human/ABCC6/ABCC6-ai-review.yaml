- id: file:human/ABCC6/ABCC6-deep-research-falcon.md
  title: Falcon research report for human ABCC6
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: >-
      Genuine provider output, completed in 776.51 seconds with 1200-second wrapper limit; preserved unchanged.
      ATP-release versus direct-substrate distinction corroborates primary sources. Review-level and unidentified-journal
      references, registry claims and absence of structures were not independently adopted as primary
      evidence.
  findings: []
core_functions:
- description: >-
    ATP-dependent organic-anion export by a basolateral ABC transporter. Glutathione conjugates are demonstrated
    assay substrates; the main endogenous cargo remains unresolved. ABCC6-dependent nucleotide release
    contributes to extracellular PPi production and prevention of ectopic mineralization, without proving
    direct ATP translocation.
  molecular_function:
    id: GO:0015431
    label: ABC-type glutathione S-conjugate transporter activity
  locations:
  - id: GO:0016323
    label: basolateral plasma membrane
  directly_involved_in:
  - id: GO:0055085
    label: transmembrane transport
  - id: GO:0140928
    label: inhibition of non-skeletal tissue mineralization
  supported_by:
  - *id007
  - *id003
  - *id012
  - *id010
suggested_questions:
- question: >-
    What endogenous substrate is physically transported by ABCC6, and does ABCC6 directly translocate
    ATP or regulate another ATP-release route?
- question: >-
    How should the PMID:36115835 IntAct positive interaction exports carrying a 10-molar affinity placeholder
    be reconciled with zero-coded, unquantified affinities in the primary supplement?
- question: >-
    Which quantified C-terminal PDZ interactions occur with full-length endogenous ABCC6 and influence
    basolateral trafficking or physiological export?
- question: >-
    Does the original mouse intracellular-phosphate annotation have an assay distinct from the extracellular
    PPi measurements in PMID:24277820?
suggested_experiments:
- description: >-
    Reconstitute purified full-length ABCC6 in defined membranes and distinguish ATP used for the transport
    cycle from ATP or other substrates physically translocated. Pair transport measurements with ATPase
    assays and inactive controls.
- description: >-
    Test the five quantified source PDZ interactions using full-length endogenous proteins, matched expression
    compartments and C-terminal mutations; measure localization and substrate release separately from
    fragment affinity.
