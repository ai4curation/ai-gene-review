- term:
    id: GO:0015867
    label: ATP transport
  evidence_type: IDA
  original_reference_id: PMID:24277820
  qualifier: involved_in
  review:
    summary: >-
      ABCC6 participates in cellular ATP release, although direct ATP translocation through ABCC6 is unresolved.
    action: ACCEPT
    reason: >-
      Retain GO:0015867 as a biological-process assignment to observed ABCC6-dependent ATP release. The
      2013 abstract includes human and rat ABCC6 expression; the 2014 full text uses inducible rat ABCC6
      in human cell lines, mouse hepatocytes/liver perfusion and human patient PPi measurements. These
      distinct systems converge on the release pathway. The authors could not detect nucleoside-triphosphate
      transport in vesicles and allow an indirect release mechanism, so this BP does not warrant a direct
      ATP-transporter MF or an ATP substrate claim.
