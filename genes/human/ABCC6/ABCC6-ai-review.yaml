    label: ATP binding
  evidence_type: IDA
  original_reference_id: PMID:11880368
  qualifier: enables
  review:
    summary: >-
      ATP binding is intrinsic to the ABCC6 nucleotide-binding domains.
    action: ACCEPT
    reason: >-
      Direct assays of full-length human ABCC6 support ATP binding. The older ARA study described a partial
      sequence; it is not used to infer the complete protein architecture. ATP binding as an energy-coupling
      step does not establish that ATP is the transported substrate.
    supported_by:
    - &id002
      reference_id: PMID:11880368
      supporting_text: >-
        In isolated membranes ATP binding as well as ATP-dependent active transport by ABCC6 was demonstrated.
