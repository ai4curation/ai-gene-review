suggested_questions:
- question: What fraction of adult human forebrain NMDA receptors retain GluN2B (as diheteromeric GluN1/GluN2B or
    triheteromeric GluN1/GluN2A/GluN2B), and how is this split between synaptic and extrasynaptic pools?
- question: Does the GluN2B C-terminal tail contribute to excitotoxic and amyloid-beta-linked signalling independently
    of ion flux, for example as a CaMKII/DAPK1 scaffold, and is that separable from channel gating in human neurons?
- question: Are presynaptic NMDA receptors at human cortical synapses GluN2B-containing, and if so do they shape short-term
    plasticity there?
suggested_experiments:
- hypothesis: GluN2B promotes excitotoxic and amyloid-beta-linked neuronal injury partly through C-terminal-tail scaffolding
    independent of its own ion conduction.
  description: In human iPSC-derived neurons, compare a GluN2B channel-dead pore mutant, a C-terminal-tail truncation,
    and wild type for amyloid-beta-oligomer-induced spine loss and calcium dysregulation, to separate ion-flux-dependent
    from scaffold-dependent effects.
  experiment_type: structure-function rescue in human iPSC neurons with live-imaging readouts
- hypothesis: Presynaptic NMDA receptors at human cortical synapses contain GluN2B.
  description: Use subunit-selective antagonists (GluN2B-selective ifenprodil derivatives) and GluN2B knockdown to
    test whether presynaptic NMDA receptor-dependent plasticity at human cortical synapses depends on GluN2B.
  experiment_type: slice electrophysiology with subunit-selective pharmacology and knockdown
