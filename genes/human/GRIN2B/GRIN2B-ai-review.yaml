id: Q13224
gene_symbol: GRIN2B
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: GRIN2B encodes GluN2B (NR2B, glutamate [NMDA] receptor subunit epsilon-2), one of the four GluN2 subunits
  of NMDA-type ionotropic glutamate receptors. Two GluN1 subunits assemble with two GluN2 subunits (and sometimes
  GluN3) into a heterotetrameric cation channel in the neuronal plasma membrane, concentrated in the postsynaptic
  density of excitatory synapses on dendritic spines. GluN2B provides the glutamate-binding site (GluN1 binds the
  co-agonist glycine or D-serine), and its extracellular N-terminal and ligand-binding domains, transmembrane pore
  and exceptionally long intracellular C-terminal tail set the receptor's slow deactivation kinetics, open probability,
  voltage-dependent Mg2+ block and Ca2+ permeability. Channel opening requires glutamate plus glycine binding and
  depolarisation to relieve Mg2+ block. GluN2B predominates in the immature forebrain and shifts to a smaller, largely
  extrasynaptic pool in the adult, where it is implicated in synaptic plasticity, dendritic-spine remodelling and,
  through its C-terminal tail, in excitotoxic and amyloid-beta-linked signalling. The GluN2B C-terminal tail is a
  scaffolding hub that binds CaMKII and PDZ-domain proteins of the PSD-95/DLG family. De novo and inherited GRIN2B
  variants cause autosomal-dominant intellectual disability with or without seizures, developmental and epileptic
  encephalopathy, and autism spectrum features.
