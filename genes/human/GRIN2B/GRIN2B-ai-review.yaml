  review:
    summary: IPI interactions of GluN2B with CaMKII, PDZ-domain scaffolds (PSD-95/DLG family) and other partners.
    action: REMOVE
    reason: The interactions are real and biologically important (CaMKII docks on the GluN2B C-terminal tail; PSD-95/DLG
      scaffolds anchor the receptor), but bare protein binding carries no functional information. Removal does not
      dispute the interactions.
