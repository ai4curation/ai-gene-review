- term:
    id: GO:0016594
    label: glycine binding
  evidence_type: IDA
  original_reference_id: PMID:17047094
  qualifier: enables
  review:
    summary: Glycine binding asserted for GluN2B (IDA), cited to a study of NR1/NR3 receptors.
    action: REMOVE
    reason: The glycine-binding site of NMDA receptors is formed by GluN1 and GluN3 subunits; GluN2 subunits form
      the glutamate site and do not bind glycine. The cited paper assays only the NR1 and NR3 ligand-binding cores
      and does not characterise a GluN2B glycine site, so glycine binding is misattributed to GluN2B. GluN2B's correct
      ligand-binding function, glutamate binding, is retained from the ISS row. Only the abstract of PMID:17047094 is
      cached; the removal rests on the structural assignment of the glycine site to GluN1 and the glutamate site to
      GluN2 (PMID:12805203), which contradicts the function itself, not on the abstract alone.
    supported_by:
    - reference_id: PMID:12805203
      supporting_text: NMDA receptors require both glycine and glutamate for activation with NR1 and NR2 forming glycine
        and glutamate sites, respectively
    - reference_id: file:human/GRIN2B/GRIN2B-uniprot.txt
      supporting_text: Channel activation requires binding of the neurotransmitter L-glutamate to the GluN2 subunit,
        glycine or D-serine binding to the GluN1 subunit
      record_section:
      - CC:FUNCTION
    source_defects:
    - defect_type: WRONG_TERM
      resource: UNIPROT
      requested_change: DELETE_ROW
      asserted_value: GO:0016594
      explanation: PMID:17047094 characterises glycine binding by the NR1 and NR3 subunits of NR1/NR3 receptors; GluN2
        subunits form the glutamate site, not a glycine site. The IDA glycine-binding annotation on GluN2B (Q13224)
        appears to be a subunit/ligand mis-attribution (the paper's GluN1 interaction is captured separately as a
        protein-binding IPI).
      confidence: PROBABLE
