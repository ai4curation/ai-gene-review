- term:
    id: GO:0001540
    label: amyloid-beta binding
  evidence_type: NAS
  original_reference_id: PMID:26719327
  qualifier: enables
  review:
    summary: Amyloid-beta binding asserted for GluN2B (NAS), cited to a review of amyloid-beta receptors.
    action: MARK_AS_OVER_ANNOTATED
    reason: The cited review states that no direct binding of amyloid-beta oligomers to NMDA receptor subunits has
      been reported; amyloid-beta acts on NMDA receptors indirectly, via oligomer binding to other surface proteins
      (e.g. cellular prion protein) and Fyn-mediated GluN2B phosphorylation. A direct binding function for GluN2B
      goes beyond the evidence.
    supported_by:
    - reference_id: PMID:26719327
      supporting_text: However, no direct binding of AβO to NMDAR subunits has been reported.
