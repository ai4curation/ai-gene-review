core_functions:
- description: GluN2B is a glutamate-binding, pore-forming subunit of the NMDA receptor. Together with GluN1 it forms
    a glutamate- and glycine-gated cation channel that is blocked by Mg2+ at resting potential and conducts Na+, K+
    and Ca2+ when open. GluN2B-containing receptors have slow deactivation kinetics and contribute the slow component
    of the excitatory postsynaptic response and the calcium signal that induces synaptic plasticity.
  contributes_to_molecular_function:
