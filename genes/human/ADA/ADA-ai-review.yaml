- term:
    id: GO:0060169
    label: negative regulation of adenosine receptor signaling pathway
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: Inference that ADA negatively regulates adenosine-receptor signaling. By
      catabolizing extracellular adenosine (the receptor agonist), ecto-ADA reduces
      adenosine-receptor activation; the net effect can be complex, since ADA can also
      allosterically enhance receptor agonist affinity.
    action: KEEP_AS_NON_CORE
    reason: The PTN000150939 assertion is grounded in the human endothelial evidence for
      removal of extracellular adenosine. Reduced agonist availability limits
      adenosine-receptor signaling in that context. Retain as a contextual regulatory
      consequence of catalysis, without generalizing the sign to every
      receptor-associated ADA function.
    supported_by:
    - reference_id: PMID:16670267
