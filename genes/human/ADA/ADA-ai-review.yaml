id: P00813
gene_symbol: ADA
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Human ADA (adenosine deaminase, also called ADA1) is a zinc-dependent
  enzyme that hydrolyzes adenosine to inosine and 2'-deoxyadenosine to 2'-deoxyinosine.
  These reactions support purine breakdown and salvage and prevent toxic deoxynucleoside
  accumulation; loss of ADA activity causes severe combined immunodeficiency. ADA acts
  predominantly in the cytosol, with additional lysosomal and extracellular cell-surface
  pools. Surface ADA associated with CD26/DPP4 removes extracellular adenosine and
  thereby regulates receptor stimulation. ADA-CD26 interactions also support T-cell
  costimulation and integrin-mediated cell adhesion through functions separable from
  nucleoside hydrolysis. ADA can metabolize nucleoside analogues, including ribavirin,
  in drug-metabolism contexts.
