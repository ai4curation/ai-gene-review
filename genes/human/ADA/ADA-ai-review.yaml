core_functions:
- description: Zinc-dependent hydrolysis of adenosine to inosine supports adenosine
    breakdown and purine recycling. Cytosolic ADA handles intracellular nucleosides;
    extracellular membrane-associated ADA also clears adenosine and controls its
    availability to receptors.
