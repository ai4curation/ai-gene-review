  review:
    summary: Human ERF directly represses transcription of ETS-site-containing reporters.
    action: ACCEPT
    reason: The original PMID:7588608 Results “Functional analysis of ERF,” Figure 2A–D and Libraries/plasmids,
      Cell lines/transfection and EMSA Methods were read. Full-length human ERF (548 residues) represses
      CAT reporters in HeLa cells. Removing an ETS-binding site from the GATA1 promoter reduces ERF repression
      without eliminating GATA1-driven activation; GAL4 tethering separately establishes an active C-terminal
      repression region rather than promoter competition alone. Figure 2 pixels confirm the reporter comparisons
      and GAL4-fusion binding controls. CAT measurements were made in the linear range and normalized
      to cotransfected beta-galactosidase. ERF itself supplies DNA recognition and repression, so this
      is direct transcriptional regulation rather than a downstream proliferation phenotype. The assays
      establish the canonical protein; they do not establish equivalent function of the natural 473-residue
      product.
    supported_by:
    - reference_id: PMID:7588608
