  review:
    summary: Sequence-specific DNA binding is a well-supported biochemical property of ERF.
    action: ACCEPT
    reason: 'JASPAR profile MA0760.1 explicitly identifies human ERF/P50548, HT-SELEX and source PMID:23332764,
      with its deposited position-frequency matrix. This verifies the target-specific assay attribution;
      the 2013 full Methods, construct boundaries and supplement were not recovered, so no claim is made
      about its exact tested product. Independent original PMID:7588608 cDNA-isolation Results, functional
      reporter assays and EMSA Methods establish ETS-site recognition: the human clone was selected with
      an ETS2 H1 oligonucleotide, site removal reduces reporter repression, and in-vitro-produced ERF
      was assayed with the ETS2 H28 probe. The initial Southwestern result is reported as data not shown,
      and the inspected Figure 2D gel is GAL4 binding, not an ERF–H28 gel. Taken together with the curated
      direct annotation and target-specific deposited motif, these support the binding capacity without
      assuming the natural shorter product has the same specificity.'
