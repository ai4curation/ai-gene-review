    summary: ERF associates with chromatin through its sequence-specific transcriptional role.
    action: ACCEPT
    reason: 'The author-hosted TFClass classification explicitly places ERF/P50548 in Ets-related family
      3.5.2; that classification is a source inference, not a localization assay. Independent PMID:23354439
      Results/Figure 3h and ChIP-Seq Methods directly recover mouse Erf-associated chromatin from E13.5
      fibroblasts, with input controls and serum-dependent binding. The same paper tests human wild-type
      ERF repression of ETS-containing reporters in HeLa cells (Figure 4b; promoter-assay Methods). These
      complementary observations support the conserved chromatin-associated transcriptional role without
      calling the mouse ChIP a human experiment or implying constitutive chromosome residence. These gene-level
      conclusions do not establish equivalent activity of the 473-residue product, which lacks canonical
      residues 1–75 and therefore part of the mapped ETS domain. '
