suggested_questions:
- question: Where is the natural 473-residue ERF product expressed, and does its partial ETS domain retain
    sequence-specific DNA recognition or transcriptional repression?
- question: Which reported HuRI partners form endogenous ERF complexes and alter its promoter occupancy
    or repression, rather than only binding in the two-hybrid assay?
- question: Does the nucleolar ERF pool detected by HPA072144 have a defined regulatory function, and
    how does that pool change with ERK activity?
core_functions:
- description: ERF recognizes ETS DNA sites in the nucleoplasm and uses its C-terminal repression region
    to reduce RNA polymerase II transcription. This activity is established for canonical 548-residue
    human ERF; ERK-linked nuclear–cytoplasmic shuttling regulates its nuclear availability. Equivalent
    repression by the natural 473-residue product is unestablished.
