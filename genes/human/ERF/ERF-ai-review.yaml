  review:
    summary: The reported ERF interaction with Q08117-2 is retained as non-core binding.
    action: KEEP_AS_NON_CORE
    reason: The deposited HuRI PSI-MI records identify human ERF as P50548-1, ORFeome clone 2592 and ENST00000222329.8/ENSP00000222329.3.
      They report two-hybrid array, prey-pooling and validated two-hybrid records in yeast. These are
      method records for a reported pair, not three independent physiological interactions. The original
      main Results describe quadruplicate pairwise retesting and sequence confirmation across the dataset.
      The complete supplementary Methods were not recovered, and no target-pair mammalian orthogonal validation
      or endogenous complex mechanism is asserted. The exact Q08117-2 partner is recorded as ORFeome clone
      53886, found in screen 8. This supports a physical interaction in the assay but does not establish
      a more specific molecular activity, a constitutive cellular complex or activity of the 473-residue
      ERF product. Retain the supported generic binding assertion as non-core.
    supported_by:
    - reference_id: PMID:32296183
