id: P50548
gene_symbol: ERF
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ERF is an ETS-family DNA-binding transcriptional repressor that recognizes ETS motifs and
  inhibits RNA polymerase II transcription through a C-terminal repression region. Its nuclear availability
  responds to ERK-pathway activity through phosphorylation-dependent shuttling between the nucleus and
  cytoplasm. ERF dosage influences cranial-suture development; heterozygous loss of function causes craniosynostosis,
  and mouse Erf also contributes to extraembryonic lineage differentiation. The canonical human protein
  has 548 residues. A reported 473-residue splice product lacks the first 75 residues, including part
  of the ETS domain; its DNA recognition and transcriptional repression have not been established.
