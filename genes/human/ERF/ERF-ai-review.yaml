  review:
    summary: ERF has a conserved developmental differentiation role supported by mouse Erf experiments.
    action: KEEP_AS_NON_CORE
    reason: The actual PTHR11849 version 19 tree places human ERF leaf PTN002483866 below PTN000218930;
      its ungapped alignment exactly matches the canonical 548-residue sequence. All four asserted IBD
      records occur at that ancestor and there is no target-path NOT. Target self-WITH entries for transcription
      and nucleus are legitimate experimental grounding. The actual differentiation IBD includes mouse
      Erf MGI:109637/P70459; its 551-residue alignment is exact and current donor annotations cite PMID:17502352.
      That original’s targeting/TSC Methods and Results/Figures 5–7 show altered placental lineage markers
      and delayed differentiation after growth-factor withdrawal in Erf-null trophoblast stem-cell lines.
      These are differentiation-stage phenotypes, not expression alone. ERF’s transcriptional regulatory
      role supplies a plausible conserved contribution; the paper does not define all direct target genes
      or assay human ERF isoform 2. Retain broad cell differentiation as a non-core developmental context,
      without inventing a human trophoblast-specific activity or treating mouse placental development
      as a direct human assay.
    supported_by:
    - reference_id: GO_REF:0000033
    - reference_id: PMID:17502352
    additional_reference_ids:
    - PMID:17502352
    propagation_review:
