  review:
    summary: The inherited DNA-binding transcription-factor activity is more specifically repressor activity.
    action: MODIFY
    reason: 'The actual PTHR11849 version 19 tree places human ERF leaf PTN002483866 below PTN000218930;
      its ungapped alignment exactly matches the canonical 548-residue sequence. All four asserted IBD
      records occur at that ancestor and there is no target-path NOT. Target self-WITH entries for transcription
      and nucleus are legitimate experimental grounding. The family-wide assertion is biologically sound,
      but human ERF has the more precise activity already represented by source row 4. PMID:23354439 Figure
      4b and promoter-assay Methods show ERF reducing an ETS/RUNX reporter below basal activity in HeLa
      cells; the human disease-variant reporter assays distinguish loss of repression by ETS-domain mutants.
      Refine to GO:0001227 without claiming that every ETS-family descendant is a repressor. These gene-level
      conclusions do not establish equivalent activity of the 473-residue product, which lacks canonical
      residues 1–75 and therefore part of the mapped ETS domain.  The independently recovered original
      PMID:7588608 Results “Functional analysis of ERF,” Figure 2 and Methods additionally test the full-length
      human ORF in HeLa CAT assays: ETS-site deletion reduces repression and GAL4 tethering maps an active
      repression segment to residues 472–530, with reporter normalization and binding controls.'
