  review:
    summary: Retained as non-core; full-length transmembrane human APCDD1 forms homodimers in cells, whereas the isolated active ectodomain is monomeric.
    action: KEEP_AS_NON_CORE
    reason: >-
      Differently tagged full-length human APCDD1 proteins co-immunoprecipitate in HEK293T
      cells and migrate as ~130 kDa dimers, an interaction that also enables ER-arrested
      APCDD1(L9R) to sequester wild-type APCDD1 dominant-negatively (PMID:20393562,
      PMID:32320685). Because the isolated glycosylated ectodomain is monomeric in solution
      (PMID:37155902) and still inhibits Wnt signaling when expressed without the
      transmembrane segment (PMID:20393562), homodimerization is a transmembrane-dependent
      auxiliary property rather than the core ligand-binding activity.
    supported_by:
    - reference_id: PMID:20393562
      supporting_text: First, western blot of APCDD1 expressed in HEK293T cells revealed that the protein is glycosylated and forms a dimer (Figs. 1l and S10a-c).
    - reference_id: PMID:32320685
      supporting_text: We note that APCDD1 was present both as monomer and dimer, as we previously reported (Fig. S6 B, C in (Shimomura et al., 2010)).
