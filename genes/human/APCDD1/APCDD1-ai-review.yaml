- id: PMID:12384519
  title: Isolation of a novel human gene, APCDD1, as a direct target of the beta-Catenin/T-cell factor 4 complex with probable involvement in colorectal carcinogenesis.
  full_text_unavailable: true
  findings:
  - statement: Human APCDD1 is directly activated by beta-catenin/TCF4 via two upstream TCF/LEF-binding motifs and is repressed by wild-type APC and AXIN1 in colorectal cancer cells.
    supporting_text: A reporter gene assay using the 5'-flanking region of APCDD1 indicated that transfection of beta-catenin together with wild-type Tcf4 into HeLa cells increased the reporter activity through two putative Tcf/lymphoid enhancer factor-binding motifs upstream of the transcription start site, indicating that APCDD1 is one of the direct targets of this transcription complex.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Original discovery paper isolating human APCDD1 and demonstrating direct transcriptional regulation by beta-catenin/TCF4 and repression by APC/AXIN1. Cached as abstract-only.
- id: PMID:20393562
  title: APCDD1 is a novel Wnt inhibitor mutated in hereditary hypotrichosis simplex.
  findings:
  - statement: Wild-type human APCDD1 is an N-glycosylated plasma-membrane protein that forms homodimers and inhibits WNT3A-induced canonical Wnt signaling upstream of beta-catenin in a cell-autonomous manner.
    supporting_text: Collectively, these data reveal that APCDD1 is likely a membrane-tethered Wnt inhibitor that acts as a dimer at the surface of the Wnt-receiving cell.
    reference_section_type: RESULTS
  - statement: Heterozygous signal-peptide mutation p.Leu9Arg in human APCDD1 causes hereditary hypotrichosis simplex by preventing signal-peptide cleavage and retaining both mutant and co-expressed wild-type APCDD1 in the endoplasmic reticulum.
    supporting_text: In addition, Wt- or L9V-APCDD1 protein was localized to the cell membrane, while L9R-APCDD1 was retained within the ER (Figs. 2h,i and S11a-j).
    reference_section_type: RESULTS
  - statement: Detergent-solubilized and bacterially expressed human APCDD1 ectodomain co-precipitated WNT3A and LRP5 in vitro, although the LRP5 ectodomain interaction was later not reproduced using folded glycosylated mammalian ectodomains in PMID:37155902.
    supporting_text: In contrast, the extracellular domain of APCDD1 (APCDD1ΔTM) coprecipitated with recombinant tagged forms of Wnt3A and LRP5, two proteins important for HF induction 12 (Figs. 2a, S3b and S5), suggesting that APCDD1 can modulate the Wnt pathway via potential interactions with WNT3A and LRP5 at the cell surface.
    reference_section_type: RESULTS
    finding_review:
      finding_status: DISPUTED
      superseded_by:
      - PMID:37155902
      review_notes: Direct WNT ligand binding stands and was extended to WNT7A in PMID:37155902, whereas folded glycosylated APCDD1 ectodomains showed no detectable binding to LRP5 or LRP6 PE1-4 ectodomains in PMID:37155902.
      supported_by:
      - reference_id: PMID:37155902
        supporting_text: We observed no detectable binding between the APCDD1 and the PE1-4 domains of LRP5 or LRP6, consistent with a model in which APCDD1 acts via binding to WNT ligands rather than to WNT coreceptors.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary human genetics and functional characterization establishing plasma-membrane localization, homodimerization, WNT3A binding, canonical Wnt pathway inhibition, and the dominant-negative p.Leu9Arg ER-retention mechanism in hereditary hypotrichosis simplex.
- id: PMID:25592970
  title: The WNT inhibitor APCDD1 sustains the expression of β-catenin during the osteogenic differentiation of human dental follicle cells.
  full_text_unavailable: true
  findings:
  - statement: Depletion of APCDD1 in cultured human dental follicle cells reduced beta-catenin levels, RUNX2 expression, and matrix mineralization during osteogenic differentiation while inhibiting beta-catenin in control oral squamous carcinoma cells.
    supporting_text: In addition, a depletion of APCDD1 inhibits the expression of osteogenic markers such as RUNX2 and decreased the matrix mineralization.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only study documenting context-dependent effects of human APCDD1 knockdown in dental follicle cells versus oral squamous carcinoma cells.
- id: PMID:26170146
  title: The role of APCDD1 in epithelial rearrangement in tooth morphogenesis.
  full_text_unavailable: true
  findings:
  - statement: Antisense oligodeoxynucleotide knockdown of mouse Apcdd1 in cultured E13.5 tooth germs alters inner enamel epithelial rearrangement, decreases cell proliferation, modulates Wnt and enamel-knot gene expression, and induces ectopic mesial cusps.
    supporting_text: Our results suggested that APCDD1 modulates the gene expression of Wnt- and EK-related signaling molecules at the cap stage of tooth development, and is involved in tooth cusp patterning by modulating the epithelial rearrangement in the IEE.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only mouse tooth-germ knockdown study underpinning the MGI IMP annotation to GO:0042487 on mouse Q3U128 that is projected to human Q8J025 via Ensembl Compara (GO_REF:0000107).
- id: PMID:28242765
  title: 'A novel role for the Wnt inhibitor APCDD1 in adipocyte differentiation: Implications for diet-induced obesity.'
  findings:
  - statement: Adenoviral APCDD1 expression suppresses Wnt signaling components and promotes adipogenic differentiation, whereas miR-130 targets the APCDD1 3'-UTR in diet-induced obesity.
    supporting_text: 3T3-L1 preadipocytes were transduced with adenoviruses carrying APCDD1 or a control gene at a multiplicity of infection of 500 with 0.5 μg/ml poly- l -lysine in preadipocyte medium for 6 h and then differentiated in the presence of adipocyte differentiation medium.
    reference_section_type: METHODS
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Supports downstream adipogenic modulation via Wnt pathway suppression in human subcutaneous adipose tissue and mouse preadipocyte models.
- id: PMID:28698141
  title: Epigenetic silencing of the Wnt antagonist APCDD1 by promoter DNA hyper-methylation contributes to osteosarcoma cell invasion and metastasis.
  full_text_unavailable: true
  findings:
  - statement: DNMT3a-mediated promoter hypermethylation silences APCDD1 in human osteosarcoma, and ectopic APCDD1 suppresses Wnt/beta-catenin signaling and cell invasion.
    supporting_text: Importantly, ectopic expression of APCDD1 suppressed activity of the Wnt/β-Catenin signaling pathway in OS cells and inhibited their invasion and reversed their EMT-like properties, while depletion of APCDD1 promoted invasion and metastasis of osteosarcoma cells in vitro and in vivo.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only study corroborating canonical Wnt/beta-catenin pathway suppression by human APCDD1 in osteosarcoma cells.
- id: PMID:32320685
  title: Apcdd1 is a dual BMP/Wnt inhibitor in the developing nervous system and skin.
  findings:
  - statement: Human APCDD1 suppresses BMP2- and BMP4-induced transcriptional and nuclear phospho-Smad1 responses, self-associates in human cells, and co-immunoprecipitates with type I BMP receptor BMPR1A to reduce its cell-surface abundance.
    supporting_text: APCDD1 blocks BMP signaling by binding to the BmprIa receptor and inhibiting the nuclear localization of Smad1, the main BMP effector.
    reference_section_type: ABSTRACT
  - statement: Human APCDD1 co-immunoprecipitates specifically with type I BMP receptor BMPR1A (not BMPR2) in mammalian cells and is detected as both monomer and dimer.
    supporting_text: Supporting this hypothesis, APCDD1-Flag immunoprecipitated with the type I BMP receptor BMPRIA-myc, but not with the type II receptor BMPR2, in CHO cells (Fig. 3K, middle panel).
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Demonstrates direct BMP signaling inhibition and BMPR1A receptor interaction by human APCDD1 alongside conserved Xenopus apcdd1 and zebrafish apcdd1l developmental assays.
- id: PMID:37155902
  title: Structure of WNT inhibitor adenomatosis polyposis coli down-regulated 1 (APCDD1), a cell-surface lipid-binding protein.
  findings:
  - statement: X-ray crystal structures of the homologous mouse APCDD1 ectodomain reveal two antiparallel beta-barrel domains (ABD1 and ABD2) linked by an interdomain Cys52-Cys466 disulfide bond, with a ~350 A^3 hydrophobic pocket in ABD2 that binds fatty acyl chains and captures palmitoylated human WNT7A.
    supporting_text: Structural and functional analyses show that APCDD1 has a large hydrophobic pocket in ABD2 and that APCDD1 can bind to WNT7A, presumably via its covalently bound palmitoleate, a modification that is common to all WNTs and is essential for signaling.
    reference_section_type: ABSTRACT
  - statement: Folded glycosylated mammalian APCDD1 ectodomain shows no detectable binding to the extracellular PE1-4 domains of LRP5 or LRP6, arguing that APCDD1 inhibits Wnt signaling by binding WNT ligands rather than LRP5/6 coreceptors.
    supporting_text: We observed no detectable binding between the APCDD1 and the PE1-4 domains of LRP5 or LRP6, consistent with a model in which APCDD1 acts via binding to WNT ligands rather than to WNT coreceptors.
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Resolves the two-domain beta-barrel structure, Cys52-Cys466 interdomain disulfide, ABD2 lipid-binding pocket, detergent-sensitive WNT7A capture, and absence of LRP5/6 PE1-4 binding using mouse APCDD1 ECD (88% ectodomain identity with human APCDD1) and human WNT7A/LRP6.
