  review:
    summary: Proposed new annotation; human APCDD1 specifically co-immunoprecipitates with human type I BMP receptor BMPR1A (ALK3, UniProtKB:P36894), but not type II receptor BMPR2, in mammalian cells.
    action: NEW
    reason: >-
      Vonica et al. (PMID:32320685) co-expressed FLAG-tagged human APCDD1 with Myc-tagged
      human BMPR1A (ALK3, UniProtKB:P36894) or HA-tagged BMPR2 in CHO cells and demonstrated
      that human APCDD1 specifically co-immunoprecipitates with BMPR1A but not BMPR2,
      colocalizes with BMPR1A, and displaces BMPR1A from the cell surface to block BMP
      pathway signaling.
    supported_by:
