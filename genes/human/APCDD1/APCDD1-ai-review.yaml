- term:
    id: GO:0001942
    label: hair follicle development
  evidence_type: IMP
  original_reference_id: PMID:20393562
  qualifier: involved_in
  review:
    summary: Retained as non-core developmental process; human APCDD1 p.Leu9Arg causes hereditary hypotrichosis simplex with hair follicle miniaturization downstream of impaired Wnt/BMP signaling regulation.
    action: KEEP_AS_NON_CORE
    reason: >-
      Heterozygous p.Leu9Arg mutation in human APCDD1 cosegregates with autosomal-dominant
      hereditary hypotrichosis simplex (characterized by progressive hair follicle
      miniaturization), and endogenous APCDD1 is abundantly expressed in the dermal papilla,
      matrix, and hair shaft of human scalp follicles (PMID:20393562). Because APCDD1
      participates in hair follicle morphogenesis indirectly as a cell-surface Wnt and BMP
      pathway inhibitor rather than as a dedicated structural follicular component, this
      developmental phenotype is retained as non-core.
    supported_by:
    - reference_id: PMID:20393562
      supporting_text: Our study provides the first genetic evidence that mutations in a Wnt inhibitor result in hair loss in humans.
