      supporting_text: Supporting this hypothesis, APCDD1-Flag immunoprecipitated with the type I BMP receptor BMPRIA-myc, but not with the type II receptor BMPR2, in CHO cells (Fig. 3K, middle panel).
    - reference_id: PMID:32320685
      supporting_text: Plasmids expressing human Alk3 Myc (500ng), BMPR2 HA (1μg), and human APCDD1 FLAG (500pg) were transfected in CHO cells grown in 6-well plates.
- term:
    id: GO:0030514
    label: negative regulation of BMP signaling pathway
  evidence_type: IDA
  original_reference_id: PMID:32320685
  qualifier: involved_in
  review:
    summary: Proposed new annotation; human APCDD1 binds BMPR1A, reduces its membrane abundance, and inhibits BMP2/BMP4-stimulated Smad1 nuclear accumulation and transcriptional output.
    action: NEW
    reason: >-
      Vonica et al. (PMID:32320685) demonstrated directly on human APCDD1 that expression in
      cultured mammalian cells suppresses BMP2- and BMP4-induced BRE reporter transcription,
      blocks BMP2-induced nuclear phospho-Smad1 accumulation, co-immunoprecipitates
      specifically with type I BMP receptor BMPR1A (not BMPR2), and lowers cell-surface BMPR1A
      levels, matching conserved endogenous BMP antagonism in Xenopus embryos.
    supported_by:
    - reference_id: PMID:32320685
      supporting_text: APCDD1 blocks BMP signaling by binding to the BmprIa receptor and inhibiting the nuclear localization of Smad1, the main BMP effector.
    - reference_id: PMID:32320685
      supporting_text: This finding was also observed in mouse NIH 3T3 cells; cells transfected with human APCDD1 (hAPCDD1) showed a reduced response to BMP4 responsivity (Fig. S1C).
