- id: file:human/APCDD1/APCDD1-deep-research-affinage.md
  title: Affinage mechanistic annotation for APCDD1 (human)
  findings: []
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: >-
      Machine-generated Affinage synthesis that passed automated citation/precision gates
      (self_evaluation_pairwise: win, faith_pct: 100.0, 10 valid numeric PMIDs, 0 PMID:bio_
      preprint tokens) and accurately summarizes cell-autonomous Wnt/beta-catenin feedback
      inhibition (PMID:20393562, PMID:12384519) and dual BMP inhibition (PMID:32320685) while
      surfacing PMID:37155902, PMID:29154126, PMID:28242765, PMID:25592970, and PMID:28698141.
      None of Affinage's coarse goslim_generic MF terms (GO:0008289, GO:0098772, GO:0140313)
      or top-level Reactome nodes (R-HSA-162582, R-HSA-1266738) were imported. Marked DISPUTED
      for two substantive inaccuracies recorded in source_defects: (1) its localization
      profile asserts GO:0005783 endoplasmic reticulum alongside GO:0005886 plasma membrane by
      conflating ER retention of the pathogenic p.Leu9Arg signal-peptide mutant (PMID:20393562)
      with wild-type residence; and (2) its narrative asserts physical interaction with LRP5
      alongside PMID:37155902 while omitting PMID:37155902's direct negative assay showing
      folded glycosylated APCDD1 ectodomains do not bind LRP5 or LRP6 PE1-4 domains, and
      conflates mouse Apcdd1 (Q3U128) structural, retinal, glial, and tooth studies with human
      APCDD1 without noting species.
    source_defects:
    - defect_type: WRONG_STATEMENT
      resource: AFFINAGE
      record: UniProtKB:Q8J025
      slot: mechanism_profile.localization
      requested_change: CHECK
      asserted_value: 'localization: GO:0005886 plasma membrane, GO:0005783 endoplasmic reticulum'
      corrected_value: GO:0005886
      corrected_label: plasma membrane
      cause: OTHER
      confidence: CONFIRMED
      explanation: >-
        Affinage's localization profile assigns GO:0005783 (endoplasmic reticulum) to human
        APCDD1 alongside GO:0005886 (plasma membrane). Wild-type APCDD1 is a plasma-membrane
        glycoprotein; endoplasmic reticulum accumulation in PMID:20393562 is specific to the
        pathogenic signal-peptide mutant APCDD1(L9R) (and wild-type protein trapped by L9R in
        heterozygotes), not steady-state wild-type residence.
      supported_by:
      - reference_id: PMID:20393562
        supporting_text: In addition, Wt- or L9V-APCDD1 protein was localized to the cell membrane, while L9R-APCDD1 was retained within the ER (Figs. 2h,i and S11a-j).
    - defect_type: WRONG_STATEMENT
      resource: AFFINAGE
      record: UniProtKB:Q8J025
      slot: narrative
      requested_change: CHECK
      asserted_value: Mechanistically, its extracellular domain comprises two apposed β-barrel domains (ABD1 and ABD2), with ABD2 forming a large hydrophobic pocket that binds lipid; through this pocket the ectodomain engages WNT ligands via their conserved covalent palmitoleate modification, allowing APCDD1 to titrate WNT at the cell surface [PMID:37155902], and it physically interacts with WNT3A and the co-receptor LRP5 [PMID:20393562].
      cause: OTHER
      confidence: CONFIRMED
      explanation: >-
        Affinage's narrative presents physical interaction with LRP5 (from detergent lysates
        and bacterially expressed unglycosylated GST-APCDD1 in PMID:20393562) as an active
        part of the current mechanism in the same sentence as PMID:37155902, omitting that
        PMID:37155902 directly tested folded, glycosylated mammalian APCDD1 ectodomain against
        the extracellular PE1-4 domains of LRP5 and LRP6 and observed no detectable binding,
        and omitting that the crystal structure and WNT7A capture in PMID:37155902 were
        determined using mouse APCDD1 (UniProtKB:Q3U128).
      supported_by:
      - reference_id: PMID:37155902
        supporting_text: We observed no detectable binding between the APCDD1 and the PE1-4 domains of LRP5 or LRP6, consistent with a model in which APCDD1 acts via binding to WNT ligands rather than to WNT coreceptors.
