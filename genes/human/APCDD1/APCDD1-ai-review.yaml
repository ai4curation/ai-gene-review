id: Q8J025
gene_symbol: APCDD1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  Single-pass type I plasma-membrane glycoprotein that functions as a cell-autonomous
  feedback negative regulator of Wnt and BMP signaling at the surface of ligand-receiving
  cells. Induced transcriptionally by the beta-catenin/TCF4 complex, mature APCDD1
  presents a glycosylated extracellular region composed of two homologous antiparallel
  beta-barrel domains (ABD1 and ABD2) linked by six conserved disulfide bridges, including
  an interdomain Cys52-Cys466 disulfide bond, and forms transmembrane-dependent homodimers
  in the plasma membrane. ABD2 encloses a large hydrophobic pocket that accommodates the
  conserved palmitoleoyl lipid moiety of secreted WNT proteins, enabling APCDD1 to bind and
  titrate WNT ligands at the cell surface upstream of beta-catenin without binding the
  extracellular PE1-4 domains of LRP5 or LRP6. APCDD1 also interacts with type I BMP
  receptor BMPR1A to dampen BMP-induced Smad1 nuclear signaling in developing ectodermal
  and neural tissues. Heterozygous signal-peptide mutation p.Leu9Arg blocks signal-peptide
  cleavage, traps mutant and wild-type APCDD1 dimers in the endoplasmic reticulum, and
  causes autosomal-dominant hereditary hypotrichosis simplex through hair follicle
  miniaturization.
