- question: >-
    Does human APCDD1 capture non-canonical WNT ligands (such as WNT5A or WNT11) via their
    conserved palmitoleoyl moiety with comparable affinity to canonical ligands WNT3A and
    WNT7A, and how does membrane homodimerization modulate WNT versus BMPR1A engagement?
suggested_experiments:
- description: >-
    Perform quantitative surface plasmon resonance or biolayer interferometry binding and
    structure-guided ABD2 pocket mutagenesis using purified glycosylated human APCDD1
    ectodomain against acylated versus Notum-deacylated WNT3A, WNT5A, and WNT7A, alongside
    purified BMPR1A ectodomain.
