id: Q8N7X0
gene_symbol: ADGB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  Androglobin is the fifth and most structurally unusual mammalian globin: a large (1667 aa)
  chimeric protein in which an N-terminal calpain-like (peptidase C2) region is followed by a
  circularly permuted globin domain whose two halves are separated by an IQ calmodulin-binding
  motif, and then by a long C-terminal region ending in a coiled coil. The globin domain is a
  genuine heme protein - the recombinant human domain purifies with heme and shows a
  hexacoordinate ferrous spectrum - but it is not a bis-histidyl globin: the proximal F8
  histidine (His824) is retained while the distal E7 position is a glutamine (Gln792). It binds
  nitric oxide as an unusual five-coordinate complex, shows nitrite reductase activity in the
  isolated globin domain (at millimolar K_M, so its physiological significance is untested)
  that is enhanced by calmodulin binding at the IQ motif, and autoxidises three orders of magnitude
  faster than neuroglobin, so its measured chemistry points to nitric oxide handling rather
  than to oxygen storage or transport. The calpain-like region, by contrast, is a degenerate
  protease fold: it retains a cysteine at the aligned nucleophile position but has lost the
  catalytic histidine and asparagine, and MEROPS classifies androglobin as a non-peptidase
  homologue of family C2. Androglobin is expressed predominantly in post-meiotic male germ
  cells and, more broadly, in motile-ciliated cell types, where its transcription is driven by
  the ciliogenic factors FOXJ1 and RFX2. It localises to the sperm flagellum, midpiece and
  annulus, binds calmodulin, septin 10, CFAP69, SPEF2, TTC29 and CFAP47, and in the ciliate
  central apparatus is a component of the C1b/C1f supercomplex. Loss of androglobin in mice
  causes male infertility with defective spermatid maturation, abnormal head shaping and
  disrupted manchette, annulus and flagellum organisation, and bi-allelic human variants cause
  asthenozoospermia and oligoasthenoteratozoospermia with acrosome, mitochondrial-sheath and
  axonemal defects.
