- term:
    id: GO:0004198
    label: calcium-dependent cysteine-type endopeptidase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR001300
  review:
    summary: >-
      Removed. This is the textbook case of a domain's name being propagated into an activity,
      and the removal is argued positively rather than merely asserted. Three independent lines
      converge, and two of them do not depend on my alignment at all. First, the residues.
      Aligning the catalytic domains of six reviewed reference calpains (CAPN1, CAPN2, CAPN3,
      CAPN7, CAPN10, CAPN15) to ADGB 70-411 under four substitution and gap models, and reading
      the ADGB residue in each column anchored on the reference's own UniProt Active site
      feature, gives a sharply split result. The nucleophile cysteine is retained: 11 of 15
      aligned columns have a Cys in ADGB and it is always the same residue, C132, with the ADGB
      position invariant even though which reference reaches it varies by model. The general
      base histidine and the asparagine are not: 1 of 22 and 0 of 22 respectively, scattered
      over seven and six different ADGB positions, and the single His hit appears under one
      model only at a position no other model selects. A papain-fold cysteine protease cannot
      turn over without the general base that deprotonates the nucleophile, so a retained Cys
      with no His and no Asn is a fold, not an active site. Second, UniProt says the same thing
      in a CAUTION, and annotates zero Active site features on ADGB while all six reference
      calpains carry three each. Third, and independently of sequence analysis, MEROPS
      classifies androglobin as a non-peptidase homologue of family C2 and makes ADGB the
      holotype of that entry; the identifier block corroborates it, with the reference calpains
      at C02.001/.002/.004/.018/.029/.031 against ADGB at C02.972. The term additionally
      requires calcium dependence, for which there is no evidence of any kind on this protein -
      the calcium link in the literature runs through calmodulin binding at the IQ motif, which
      is a different thing.
    action: REMOVE
    reason: >-
      An InterPro domain signature has been read as an activity. The calpain fold is present
      but degenerate: the catalytic His and Asn are absent across six references and four
      alignment models, UniProt flags it in a CAUTION and annotates no active-site residues,
      and MEROPS independently classifies ADGB as a non-peptidase homologue with ADGB as the
      holotype. No experimental evidence supports calcium-dependent cysteine protease activity
      for ADGB in any organism. This is an electronic inference removed on biological grounds,
      not a curator's experimental call being second-guessed.
    proposed_replacement_terms: []
    supported_by:
    - reference_id: file:human/ADGB/ADGB-uniprot.txt
      supporting_text: The calpain domain lacks the conserved active site residues.
    - reference_id: file:human/ADGB/ADGB-bioinformatics/RESULTS.md
      supporting_text: >-
        A papain-fold cysteine protease cannot catalyse without the general-base histidine that
        deprotonates the nucleophile. A retained Cys with no His and no Asn is a fold, not an
        active site.
    - reference_id: file:human/ADGB/ADGB-bioinformatics/RESULTS.md
      supporting_text: >-
        All 6 reference calpains: Cysteine. ADGB: **Non-peptidase homologue**, and ADGB is the
        *holotype* of that entry.
    - reference_id: PMID:22115833
      supporting_text: >-
        The calpain-like region is homologous to the catalytic domain II of the large subunit of
        human calpain-7.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - PSEUDO_OR_SUBACTIVITY_LOSS
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: InterPro:IPR001300
        source_label: Peptidase_C2_calpain_cat (calpain catalytic domain signature)
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          The signature itself is sound and ADGB genuinely matches the calpain catalytic fold -
          UniProt, PROSITE PS50203 and SMART CysPc all place the domain at 70-411. What fails is
          the InterPro2GO mapping from that fold to a catalytic activity, because ADGB is a
          fold-retaining pseudoenzyme that has lost the general base and the Asn. The defect is
          in the propagation, not in the source: this is why the root cause is PROPAGATION_BAD
          and not SOURCE_WEAK_OR_INFERRED, which my own analysis would contradict.
- term:
    id: GO:0006508
    label: proteolysis
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR001300
  review:
    summary: >-
      Marked as over-annotated rather than removed, because two things are true at once and
      they pull in opposite directions. The route that produced this row is the same unsound
      one that produced the GO:0004198 row: InterPro2GO reading a degenerate calpain fold as a
      protease. On that basis alone the term would go. But there is a real, published
      observation that ADGB contributes to proteolysis of septin 10, and it must not be erased
      by a structural argument. Reading past the abstract shows exactly what was and was not
      shown. The assay is co-overexpression of ADGB and SEPT10 in HEK293 cells, with a
      dose-dependent 37 kDa SEPT10 fragment appearing in the presence of ADGB; the
      perturbations that reduced it were a whole-IQ-domain deletion and a whole-protease-domain
      deletion. There is no purified-protein cleavage assay, no protease inhibitor, and
      crucially no catalytic-residue point mutant - which is the experiment that would
      demonstrate catalysis, and for which there is no confident triad to target. The word
      "catalytic" does not appear in the paper, and the authors consistently write "contributes
      to" rather than "cleaves". A large deletion in a 1667-residue protein can abolish an
      activity by disrupting folding or complex assembly without the deleted region being the
      catalytic module. So the conclusion may well be right by a mechanism other than direct
      catalysis - ADGB delivering SEPT10 to another protease, for example - but it is not
      established for this gene by the route that produced the annotation. That is
      over-annotation, not error.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Derived from a catalytic domain signature that MEROPS and UniProt both hold to be
      non-catalytic in ADGB, so the inference route is unsound. Not removed, because a real
      in vitro observation of ADGB-dependent SEPT10 cleavage exists; that observation rests on
      co-overexpression and whole-domain deletion rather than on any demonstration that ADGB
      itself catalyses the bond hydrolysis, so it cannot carry the term on its own either.
    proposed_replacement_terms: []
    supported_by:
    - reference_id: PMID:35700329
      supporting_text: >-
        Collectively, these in vitro data suggest a scenario in which overexpressed ADGB
        proteolytically contributes to cleavage of overexpressed SEPT10 in an O2-independent but
        CaM-dependent manner.
    - reference_id: file:human/ADGB/ADGB-uniprot.txt
      supporting_text: 'Interacts with septin SEPT10; contributes to in vitro'
    - reference_id: file:human/ADGB/ADGB-uniprot.txt
      supporting_text: The calpain domain lacks the conserved active site residues.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - PSEUDO_OR_SUBACTIVITY_LOSS
      source_entities:
      - source_id: InterPro:IPR001300
        source_label: Peptidase_C2_calpain_cat (calpain catalytic domain signature)
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Same signature and same failure as the GO:0004198 row: the fold match is real, the
          activity inference is not. Recorded separately here because the biological-process
          term, unlike the molecular-function term, is not contradicted by independent data -
          it is merely unsupported by the route that produced it.
- term:
    id: GO:0019825
    label: oxygen binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR012292
  review:
    summary: >-
      Kept, but as a non-core function - and the reasoning here runs opposite to the reflex.
      The tempting move is to remove it: ADGB is a hexacoordinate globin whose distal position
      is occupied, and the primary biophysical paper states outright that the extreme
      autoxidation rate means O2 binding is not a physiological function of the protein.
      Reading the term's definition rather than its label changes the answer. GO:0019825 is
      defined, in full, as "Binding to oxygen (O2)". It asserts nothing about transport,
      delivery, storage or physiological role. And the same paper that argues against a
      physiological role did observe an oxy complex and measure its association rate constant
      of about 0.8 x 10^6 M^-1 s^-1 by stopped-flow. Oxygen binding is therefore demonstrated
      chemistry, and the annotation is true as written. What the data do refute are the
      physiological oxygen terms, and GOA does not carry them: GO:0005344 oxygen carrier
      activity requires binding and delivering oxygen to an acceptor or a location, and
      GO:0019826 oxygen sensor activity requires responding to changes in oxygen level. Neither
      is annotated and neither should be added - the authors' clause about "the possibility of
      oxygen sensing" is an explicit hedge, not evidence. Two further observations reinforce
      keeping this non-core: the measured autoxidation rate of at least 2.6 per second is three
      orders of magnitude faster than neuroglobin's, and the SEPT10 cleavage assay in cells was
      explicitly repeated under 0.2 percent O2 with no difference, so the one cellular process
      linked to ADGB is oxygen-independent. Curator precedent agrees with keeping it: the
      two closest comparators, human neuroglobin (Q9NPG2) and cytoglobin (Q8WWM9), are also
      hexacoordinate globins that are not oxygen transporters, and GOA gives each of them
      GO:0019825 by IDA. Removing the term from ADGB while its nearest structural analogues
      retain it on the same kind of evidence would be inconsistent.
    action: KEEP_AS_NON_CORE
    reason: >-
      The term means only "binding to oxygen", and that binding has been measured on the human
      recombinant globin domain, so the annotation is correct as written. It is not a core
      function because the oxy complex is only transiently observable and autoxidises three
      orders of magnitude faster than neuroglobin's, and the protein's measured chemistry is
      oriented towards nitric oxide rather than oxygen.
    proposed_replacement_terms: []
    supported_by:
    - reference_id: PMID:38725499
      supporting_text: >-
        This remarkable autoxidation rate strongly suggests that O2 binding is not a
        physiological function of the protein except for the possibility of oxygen sensing.
    - reference_id: PMID:38725499
      supporting_text: >-
        With rapid autoxidation and high nitrite reductase activity, the globin appears to be
        more tailored toward nitric oxide homeostasis or buffering.
- term:
    id: GO:0020037
    label: heme binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR012292
  review:
    summary: >-
      Accepted as a core molecular function, and this is the half of the chimera where the
      domain-derived IEA turns out to be right. It is supported experimentally in human and
      structurally at residue level. Experimentally: the recombinant human globin domain has
      been expressed and purified with heme by three independent groups, showing a Soret band
      at 411 nm in the ferric state shifting to 423 nm on reduction with visible bands at 529
      and 558 nm, an extinction coefficient determined by the hemochromogen method, and EPR
      characterisation. Structurally: aligning ADGB's globin domain to reviewed globins whose
      heme-iron ligands UniProt annotates, and requiring both residue identity and that the
      column land on one of ADGB's own annotated sites, the proximal F8 histidine is retained
      in 3 of 3 on-register references (myoglobin H94, neuroglobin H96, cytoglobin H113 all map
      to ADGB H824). The annotated-site condition is doing real work here rather than being
      decorative: sequence identity alone does not predict register, since cytoglobin at 18.0
      percent is on-register for both ligands while haemoglobin beta at 20.3 percent is
      on-register for neither and produces a spurious distal "match" on a histidine UniProt
      does not annotate. One correction to UniProt belongs on this row rather than as a change
      to the GO term: the protein is a His/Gln hexacoordinate globin, not a bis-histidyl one.
      The distal E7 position is Gln792, confirmed by UniProt's own feature table, by the
      Swiss-Prot sequence read directly, and by three primary papers, while UniProt's FUNCTION
      prose still says bis-histidyl. That affects how the heme chemistry should be described,
      not whether heme is bound.
    action: ACCEPT
    reason: >-
      Directly demonstrated on the human protein by three independent laboratories, and
      structurally well founded - the proximal heme-iron ligand is retained and is precisely
      the residue UniProt annotates. Core to what androglobin is.
    proposed_replacement_terms: []
    supported_by:
    - reference_id: PMID:22115833
      supporting_text: >-
        The recombinantly expressed human globin domain exhibits an absorption spectrum
        characteristic of hexacoordination of the heme iron atom.
    - reference_id: PMID:39719941
      supporting_text: >-
        These observations suggest that Gln30 in the heme distal site may coordinate to the heme
        iron in the ferrous state.
    - reference_id: file:human/ADGB/ADGB-bioinformatics/RESULTS.md
      supporting_text: >-
        **Proximal position (ADGB H824).** 3 reference columns land on it and 3 of 3 match: ADGB
        retains the proximal histidine.
    - reference_id: PMID:38725499
      supporting_text: X = His for Cygb and Gln for Adgb
- term:
