- description: >-
    Nitric oxide handling at the same heme. The ferrous globin domain binds nitric oxide as a
    five-coordinate complex with sub-nanomolar affinity - unusual in the globin superfamily, and
    characteristic instead of NO-storage or NO-sensing hemoproteins such as soluble guanylate
    cyclase. The same heme also reduces nitrite to nitric oxide in the isolated globin domain,
    at millimolar K_M and so of untested physiological significance, an activity that calmodulin
    binding at the IQ motif enhances about two-fold. Recorded as a core function because it is
    what the heme measurably does, whereas heme binding records only that the cofactor is
    present; the nitric oxide binding is the better-founded half of that chemistry, at
    sub-nanomolar affinity. The qualifier is stated rather than buried: every measurement is on
    the isolated recombinant globin domain, and no nitric-oxide-dependent phenotype has been
    demonstrated for androglobin in any organism.
