suggested_questions:
- question: >-
    UniProt's FUNCTION line for Q8N7X0 describes androglobin as a "chimeric globin with a
    bis-histidyl six-coordinate heme-iron atom", but bis-histidyl requires two histidines and
    UniProt's own feature table annotates the distal heme-iron ligand as Gln792, with only the
    proximal His824 being a histidine. Three primary papers agree the distal residue is a
    glutamine - Reeder et al. give the ferric coordination as His-Fe(III)-X with "X = His for
    Cygb and Gln for Adgb", Nie et al. label it the distal Gln30 in their construct numbering,
    and Ren et al. name it in their title and mutate it as Q12H/Q12Y. Should the FUNCTION text
    be corrected to His/Gln hexacoordinate? The prose appears to predate the 2024-2026
    biophysics.
  experts:
  - UniProt curation team
  - David Hoogewijs
  - Brandon Reeder
- question: >-
    Human ADGB carries no experimental GO annotation of any kind, despite Evidence at protein
    level and more than a decade of published human biochemistry: heme binding by the human
    recombinant globin domain, nitric-oxide and nitrite chemistry on that domain by two
    independent laboratories, calmodulin binding demonstrated biophysically and disrupted by
    human disease variants, and co-immunoprecipitation of CFAP69, SPEF2, TTC29 and CFAP47 with
    human ADGB. All 13 current rows are electronic or phylogenetic, and 8 of them trace to a
    single mouse ortholog and two papers. Could GOA curate the human primary literature
    directly rather than relying on Compara and PAINT transfer?
  experts:
  - GOA curation team
  - UniProt curation team
- question: >-
    Is androglobin itself the protease in the SEPT10 cleavage reaction? MEROPS classifies ADGB
    as a non-peptidase homologue of family C2 with ADGB as the holotype, UniProt flags the loss
    of active-site residues in a CAUTION, and alignment against six reviewed calpains under
    four substitution models finds the catalytic histidine and asparagine absent while only the
    nucleophile cysteine (C132) is retained. The cleavage evidence comes from co-overexpression
    of both proteins in HEK293 cells with whole-domain deletions, not from a purified-protein
    assay or a catalytic-residue point mutant. An equally consistent model is that androglobin
    targets SEPT10 to a different protease in a calmodulin-dependent manner.
  experts:
  - Anna Keppner
  - David Hoogewijs
  - MEROPS curation team
- question: >-
    Should GO:0001669 acrosomal vesicle be annotated for ADGB? Immunofluorescence in human and
    mouse spermatogenic cells reports androglobin at the acrosome as well as the flagella, and
    human patients with bi-allelic ADGB variants show acrosome loss by electron microscopy. It
    is not proposed as an annotation here because the localisation rests on a single study, but
    it is the most likely missing cellular component if it can be independently confirmed.
  experts:
  - GOA curation team
- question: >-
    Is the nitrite reductase activity physiologically relevant, or an in vitro property of the
    isolated domain? All measurements use the recombinant globin domain with dithionite as
    reductant and millimolar KM values; the original authors write that it remains unclear
    whether this is a natural function. Against that, testicular oxygen tension is low
    (~10-15 mmHg), which is the regime where globin nitrite reductase activity is thought to
    matter, and androglobin is expressed in exactly those post-meiotic cells.
  experts:
  - Brandon Reeder
  - Ying-Wu Lin
- question: >-
    A PAINT-specific observation: within PANTHER PTHR46298, the biological-process term
    GO:0007286 sits at node PTN002922608 while the two cellular-component terms sit at
    PTN002922607. The family's reviewed membership is only human and mouse androglobin, so no
    harm results here, but it is worth confirming the two-node split is intentional rather than
    an artefact, since androglobin orthologs exist across 3237 taxa and any future expansion of
    the reviewed set would inherit whichever placement is wrong.
  experts:
  - GO Reference Genome/PAINT curators
suggested_experiments:
- hypothesis: >-
    Androglobin does not itself hydrolyse peptide bonds; the SEPT10 fragment observed on
    co-overexpression is produced by a cellular protease that androglobin recruits or licenses
    in a calmodulin-dependent manner.
  description: >-
    Express and purify the isolated ADGB calpain-like region (residues 70-411) and full-length
    androglobin, and assay them directly against recombinant SEPT10 in the presence and absence
    of calcium and calmodulin. Include a C132S substitution as the catalytic-residue control -
    the point mutant that the existing cell-based work never made - and a panel of
    class-specific protease inhibitors. In parallel, repeat the HEK293 co-overexpression
    experiment with the C132S full-length protein: if the 37 kDa SEPT10 band still appears,
    androglobin is not the catalyst, and the whole-domain deletion result reflects loss of a
    binding or scaffolding function rather than of catalysis.
  experiment_type: in vitro reconstitution and structure-function
- hypothesis: >-
    The extreme autoxidation rate measured for the isolated globin domain is a property of the
    truncated construct, and the full-length protein or the calmodulin-bound complex stabilises
    the oxy form enough for oxygen chemistry to be physiologically accessible.
  description: >-
    Measure oxygen association and dissociation kinetics and the autoxidation rate on
    full-length androglobin, and on the globin domain in complex with calcium-loaded
    calmodulin, by stopped-flow and flash photolysis, comparing directly against the published
    isolated-domain values. Repeat with the Q792H variant, which restores the canonical distal
    histidine and has already been shown to improve stability, to test whether the distal
    glutamine is what destabilises the oxy complex.
  experiment_type: biophysical kinetics
- hypothesis: >-
    The distal glutamine is functionally required in vivo, and androglobin's role in spermatid
    maturation depends on its heme chemistry rather than only on its scaffolding interactions.
  description: >-
    Generate Adgb knock-in mice carrying the Q792H equivalent (restoring the ancestral distal
    histidine) and, separately, a proximal H824A heme-binding-null allele, and compare sperm
    counts, motility, annulus and manchette organisation and axonemal ultrastructure against
    wild-type and full knockout. A heme-null allele that phenocopies the knockout would
    establish that the globin chemistry, not merely the protein's presence, is what spermatid
    development requires; a heme-null allele with a normal phenotype would show the reverse and
    would reframe androglobin as a cytoskeletal adaptor that happens to carry a heme.
  experiment_type: mouse genetics
- hypothesis: >-
    Androglobin generates nitric oxide from nitrite in post-meiotic germ cells under the low
    oxygen tension of the testis.
  description: >-
    Quantify nitric oxide output in wild-type versus Adgb-null spermatids using a cell-permeant
    NO probe under controlled oxygen tensions spanning the testicular range, with and without
    nitrite supplementation, and confirm by measuring downstream nitrosation. Complement with
    quantitative proteomics of S-nitrosylated targets in wild-type versus knockout testis to
    identify whether any of the known androglobin partners - septin 10, CFAP69, SPEF2, TTC29,
    CFAP47 - are among them, which would connect the heme chemistry to the cytoskeletal
    phenotype.
  experiment_type: cell biology and redox proteomics
