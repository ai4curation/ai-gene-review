      With rapid autoxidation and high nitrite reductase activity, the globin appears to be
      more tailored toward nitric oxide homeostasis or buffering.
  - statement: >-
      Androglobin binds nitric oxide as a five-coordinate complex, which is highly unusual
      among globins and characteristic of nitric-oxide storage hemoproteins.
    supporting_text: Adgb binds NO as a five-coordinate heme iron
  - statement: >-
      The distal heme-iron ligand of androglobin is a glutamine, not a histidine, stated
      explicitly in contrast with cytoglobin. This contradicts UniProt's bis-histidyl FUNCTION
      text and agrees with UniProt's own feature table.
    supporting_text: X = His for Cygb and Gln for Adgb
  - statement: >-
      A tyrosine replaces the otherwise invariant CD1 phenylalanine, a further departure from
      canonical eukaryotic globin architecture that affects heme stabilisation.
    supporting_text: >-
      Exceptional for eukaryotic globins is that a tyrosine takes the place of the highly
      conserved phenylalanine in the CD1 position, a critical point in stabilizing the heme.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The only full biophysical characterisation of the androglobin globin domain, and the
      single most important reference for this review's molecular-function calls. Notably it
      was NOT in the affinage record and was found by an independent PubMed sweep; without it
      the oxygen-binding row had no experimental anchor in either direction and the
      distal-glutamine finding was invisible. Full text cached and read, including the
      paragraphs surrounding each quotation. PubMed-verified; no retraction, erratum or
      Crossref-only corrigendum.
- id: PMID:39719941
  title: Calmodulin interacts with androglobin and regulates the nitrite reductase activity.
  findings:
  - statement: >-
      Calmodulin binding at the IQ motif increases the nitrite reductase catalytic efficiency
      of the androglobin globin domain roughly two-fold, linking the calcium-sensor module
      directly to the heme chemistry.
    supporting_text: the binding of CaM enhanced the nitrite reductase activity of Adgb
  - statement: >-
      Independent confirmation that the distal heme ligand is a glutamine and the proximal
      ligand a histidine, in a construct whose numbering maps onto UniProt Q792 and H824.
    supporting_text: >-
      These observations suggest that Gln30 in the heme distal site may coordinate to the heme
      iron in the ferrous state.
  - statement: >-
      The circularly permuted globin domain folds correctly with heme and engages calmodulin
      through the IQ motif, supporting both the heme-binding and the proposed
      calmodulin-binding annotations.
    supporting_text: >-
      The circularly permutated globin domain of Adgb was well folded with a heme group, which
      can interact with CaM via the IQ motif.
  - statement: >-
      The authors themselves qualify whether nitrite reduction is a natural function of
      androglobin, which is recorded as an explicit caveat on the proposed GO:0098809
      annotation.
    supporting_text: it remains unclear whether this is a natural function of Adgb
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached and read. One internal inconsistency worth flagging for anyone quoting
      it: the Results body text says "Asn30 in helix E is located in the heme distal position",
      while the Fig. 1B legend and the concluding sentence of that same paragraph both say
      Gln30. The Swiss-Prot sequence settles it - UniProt position 792, which the register
      arithmetic maps to their residue 30, is a glutamine. Quoting the body sentence alone
      would have propagated a typographical error, so only the legend-consistent statements are
      used here. PubMed-verified; no retraction or erratum.
- id: PMID:42372363
  title: Spectroscopic studies on human androglobin regulated by its heme distal Gln12
    and IQ motif via interaction with calmodulin.
  full_text_unavailable: true
  findings:
  - statement: >-
      A third independent confirmation that the heme distal residue of human androglobin is a
      glutamine, here established by mutagenesis rather than by inference - the authors
      generate Q12H and Q12Y substitutions and show that the distal residue controls both
      stability and nitrite reductase activity, and that deleting the IQ motif abolishes
      calmodulin-mediated activation.
    supporting_text: >-
      investigated the role of its heme distal residue Gln12 through the generation of Q12H and
      Q12Y mutants
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract only. Also absent from the affinage record and found by independent PubMed
      search. Its value here is that it converts the distal-glutamine claim from an alignment
      and spectroscopy inference into a mutational one, and it independently supports the IQ
      motif being required for calmodulin-dependent activation. Its construct numbering
      (Gln12, C114S/C190S) differs from both UniProt's and Nie et al.'s, so no positional claim
      is transferred from it without the register being checked. PubMed-verified; the Crossref
      lookup for its DOI returned 404, which is recorded rather than treated as a clean result.
- id: PMID:35700329
  title: Androglobin, a chimeric mammalian globin, is required for male fertility.
  findings:
  - statement: >-
      Adgb-null mice are infertile and androglobin localises to the sperm flagellum, annulus
      and midpiece. This is the source of the mouse IDA annotations that both the PAINT IBA
      rows and the Ensembl Compara rows on human ADGB are transferred from.
    supporting_text: >-
      it locates to the sperm flagellum, the annulus, and the midpiece, and that it is crucial
      for male fertility and sperm formation
  - statement: >-
      The proteolysis claim is stated by the authors as a suggestion from in vitro data about
      overexpressed proteins, not as a demonstration that androglobin catalyses the cleavage.
      This is the wording the MARK_AS_OVER_ANNOTATED call on GO:0006508 rests on.
    supporting_text: >-
      Collectively, these in vitro data suggest a scenario in which overexpressed ADGB
      proteolytically contributes to cleavage of overexpressed SEPT10 in an O2-independent but
      CaM-dependent manner.
  - statement: >-
      A construct spanning the globin and IQ domains binds calmodulin robustly by
      co-immunoprecipitation, whereas full-length androglobin did not under basal conditions,
      suggesting the interaction is conformationally gated by the long C-terminal region.
    supporting_text: >-
      a truncated construct covering the globin and IQ domains displayed robust ADGB-CaM
      interaction
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The principal in vivo study and the donor of most of this gene's transferred annotations.
      Full text cached and read rather than relied on at abstract level, which mattered: the
      abstract's "Adgb contributes to Sept10 proteolysis" reads far more strongly than the
      Results, where the assay is co-overexpression in HEK293 cells with whole-domain deletions
      and no catalytic-residue mutant. Checked for the complex-projection pattern - the
      reference annotates only two distinct entities and its phenotype terms stay on Adgb alone
      - so it is parallel per-protein curation, not a projection. PubMed-verified; no
      retraction or erratum.
- id: PMID:36995441
  title: ADGB variants cause asthenozoospermia and male infertility.
  full_text_unavailable: true
  findings:
  - statement: >-
      Human ADGB variants causing asthenozoospermia disrupt binding of androglobin to
      calmodulin. This is the human-specific evidence behind the proposed GO:0005516
      annotation, and UniProt records the same interaction with ECO:0000269 against the human
      entry.
    supporting_text: The variants disrupted the binding of ADGB to calmodulin.
  - statement: >-
      CFAP69 and SPEF2 were confirmed as androglobin-binding proteins, connecting androglobin
      to the ciliary and flagellar assembly machinery.
    supporting_text: In particular, CFAP69 and SPEF2 were confirmed to bind to ADGB.
  - statement: >-
      Adgb-null mice show abnormal spermatogenesis with malformation of elongating and
      elongated spermatids, the IMP that both the GO:0007286 IBA and Compara rows derive from.
    supporting_text: >-
      Spermatogenesis was also abnormal, with malformation of both elongating and elongated
      spermatids
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract only in the cache, but this is the reference UniProt cites with ECO:0000269 for
      the human FUNCTION, the asthenozoospermia disease link, the truncating variant and the
      calmodulin interaction, so the human-specific claims used here are independently anchored
      in the curated entry rather than resting on my reading of the abstract alone.
      PubMed-verified; no retraction or erratum.
- id: PMID:38385883
  title: 'Whole-exome sequencing identifies ADGB as a novel causative gene for male
    infertility in humans: from motility to fertilization.'
  full_text_unavailable: true
  findings:
  - statement: >-
      Bi-allelic ADGB variants in three unrelated Han Chinese men cause severe
      asthenoteratozoospermia with acrosome and flagellum malformations on light and electron
      microscopy, providing human loss-of-function corroboration for the spermatogenesis and
      flagellum annotations transferred from mouse.
    supporting_text: >-
      the spermatozoa from patients harboring ADGB variants showed multiple acrosome and
      flagellum malformations under light and electron microscopy
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Second independent human genetics cohort. Used only for the human phenotype, deliberately
      not for any molecular-function claim, since a knockout or loss-of-function phenotype does
      not by itself establish a molecular activity. PubMed-verified; no retraction or erratum.
- id: PMID:41834962
  title: '[Whole Exome Sequencing Identified Novel Pathogenic Mutations of ADGB in Patients
    With Oligoasthenozoospermia].'
  findings:
  - statement: >-
      Immunofluorescence places androglobin in the acrosome and flagella of human and mouse
      spermatogenic cells, with expression rising after puberty. The flagellar localisation
      corroborates the transferred GO:0036126 annotation directly in human; the acrosomal
      localisation is not currently captured by GOA and is raised as a question rather than
      proposed, since it rests on this single study.
    supporting_text: >-
      ADGB was found to be highly expressed after puberty in both human and mouse testes and
      was localized to the acrosome and flagella of spermatogenic cells.
  - statement: >-
      TTC29 and CFAP47 were confirmed as androglobin interactors by co-immunoprecipitation,
      extending the set of ciliary and flagellar partners beyond septin 10, CFAP69 and SPEF2.
    supporting_text: >-
      Co-immunoprecipitation experiments confirmed TTC29 and CFAP47 as interacting proteins of
      ADGB.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Third independent human genetics cohort, 781 men, published in Chinese with an English
      abstract; the cached record is bilingual and the English text is abstract-level. Treated
      accordingly - used for the human localisation and interactor claims that the abstract
      states explicitly, and not leaned on for anything requiring the figures. PubMed-verified
      against the correct DOI (10.12182/20260160108); the Crossref update lookup returned 404
      for that DOI, which is reported rather than counted as a clean pass.
- id: PMID:34083607
  title: Composition and function of the C1b/C1f region in the ciliary central apparatus.
  findings:
  - statement: >-
      Androglobin is a component of the C1b/C1f supercomplex of the ciliary central apparatus
      in Tetrahymena, alongside Spef2A and Cfap69 - the same proteins that were later found to
      bind androglobin in mammals. This supports the motile-cilium localisation outside the
      sperm context.
    supporting_text: >-
      C1b/C1f contains several evolutionarily conserved proteins: Spef2A, Cfap69,
      Cfap246/LRGUK, Adgb/androglobin
  - statement: >-
      Deleting Adgb caused only minor changes in ciliary motility, unlike deletion of Spef2A or
      Cfap69 which abolished the entire C1b projection. Androglobin is therefore a resident of
      the structure rather than a core structural or motor component, which is consistent with
      annotating localisation but not a motility function.
    supporting_text: Loss of either Cfap246 or Adgb caused only minor alterations in ciliary motility.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Tetrahymena, not human, so it is used as convergent support for the motile-cilium
      component and deliberately not as evidence for any human-specific claim. Its negative
      result - minor motility change on Adgb deletion - is recorded as well as its positive
      one, because it constrains how strongly the ciliary role should be stated. Full text
      cached. PubMed-verified; no retraction or erratum.
- id: PMID:33453283
  title: Androglobin gene expression patterns and FOXJ1-dependent regulation indicate its
    functional association with ciliogenesis.
  findings:
  - statement: >-
      Across human tissues, ADGB expression is specifically associated with motile-ciliated
      cell types beyond the testis, including the female reproductive tract, lung and brain,
      supporting the motile-cilium annotation as more than a sperm-flagellum artefact.
    supporting_text: specifically being associated with cell types forming motile cilia
  - statement: >-
      Overexpressing full-length ADGB increases the number of ciliated cells, and the ADGB
      promoter is a direct target of the ciliogenic transcription factors FOXJ1 and RFX2.
    supporting_text: >-
      cell culture studies indicated an ADGB-dependent increase in the number of ciliated cells
      upon overexpression of the full-length protein, confirming a ciliogenesis-associated role
      of ADGB in mammals
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The primary FOXJ1/ciliogenesis paper. Absent from the affinage record, which cited the
      later secondary FOXJ1 paper PMID:37158461 instead; found by independent PubMed search.
      Full text cached. PubMed-verified; no retraction or erratum.
- id: PMID:37158461
  title: Congenital heart defects caused by FOXJ1.
  full_text_unavailable: true
  findings: []
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Cited by the affinage record for FOXJ1 activating the ADGB promoter, but the paper is
      about FOXJ1-associated congenital heart defects and uses the ADGB promoter as a reporter
      readout for FOXJ1 function rather than studying ADGB. Retained for completeness and
      marked LOW relevance; the ADGB-side claim is taken from the primary source PMID:33453283
      instead. No claim in this review rests on it. PubMed-verified; no retraction or erratum.
- id: PMID:41138754
  title: Expression analysis of androglobin and its influence on the transcriptome in cancer.
  full_text_unavailable: true
  findings: []
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Cited by the affinage record for RFX3 regulation of the ADGB promoter and for
      transcriptomic effects of ADGB overexpression in A549 lung cancer cells. Both are
      transcriptional-regulation and overexpression-phenotype observations rather than evidence
      of androglobin's own function, so no annotation here rests on it. PubMed-verified; no
      retraction or erratum.
