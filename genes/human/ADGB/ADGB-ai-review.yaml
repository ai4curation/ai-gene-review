- term:
    id: GO:0005516
    label: calmodulin binding
  evidence_type: IPI
  original_reference_id: PMID:36995441
  qualifier: enables
  supporting_entities:
  - UniProtKB:P0DP23
  review:
    summary: >-
      Proposed new annotation, and the clearest gap in this gene's record: GOA carries no
      calmodulin-binding annotation for ADGB in either human or mouse, despite calmodulin being
      the one partner that binds a defined, named motif in the protein and the one whose
      disruption is directly tied to human disease. UniProt annotates an IQ calmodulin-binding
      motif at residues 906-935, sitting between the two halves of the circularly permuted
      globin domain - an arrangement that is the structural signature of the whole protein
      family. Four independent lines support the interaction. In human patients, ADGB variants
      causing asthenozoospermia disrupt binding of ADGB to calmodulin, and UniProt records this
      with ECO:0000269 against the human entry. In cells, a truncated construct covering the
      globin and IQ domains co-immunoprecipitates calmodulin robustly, and mass spectrometry of
      the isolated globin-domain pulldown shows prominent enrichment of endogenous calmodulin.
      Biophysically, fluorescein-labelled calmodulin mutants show a 35 percent quenching with
      the N-lobe label against 10 percent with the C-lobe label on adding the purified ADGB
      globin domain, consistent with energy transfer to the heme. Functionally, calmodulin
      binding raises the domain's nitrite reductase catalytic efficiency roughly two-fold, and
      deleting the IQ motif abolishes that activation. Recorded as IPI against the human
      patient-variant study, with calmodulin-1 as the supporting entity. Note the one negative
      in the record, kept in view rather than suppressed: co-immunoprecipitation of full-length
      ADGB did not detect calmodulin under basal conditions in HEK293 cells, which the authors
      attribute to interference from the long C-terminal region. That argues the interaction is
      regulated or conformationally gated, not that it is absent.
    action: NEW
    reason: >-
      Fills the most conspicuous molecular-function gap in the record. ADGB has a
      UniProt-annotated IQ motif, human disease variants that disrupt calmodulin binding,
      direct co-immunoprecipitation and mass-spectrometric evidence, biophysical binding data
      on the purified human domain, and a measured functional consequence - yet no GO
      annotation in either species.
    proposed_replacement_terms: []
    supported_by:
    - reference_id: PMID:36995441
      supporting_text: The variants disrupted the binding of ADGB to calmodulin.
    - reference_id: PMID:35700329
      supporting_text: >-
        a truncated construct covering the globin and IQ domains displayed robust ADGB-CaM
        interaction
    - reference_id: PMID:39719941
      supporting_text: >-
        The circularly permutated globin domain of Adgb was well folded with a heme group, which
        can interact with CaM via the IQ motif.
- term:
    id: GO:0070026
    label: nitric oxide binding
  evidence_type: IDA
  original_reference_id: PMID:38725499
  qualifier: enables
  review:
    summary: >-
      Proposed new annotation. The purified human androglobin globin domain binds nitric oxide,
      and does so in a way that is unusual enough to be diagnostic rather than generic globin
      chemistry: the complex is five-coordinate, which in the globin superfamily is highly
      atypical and is instead the signature of hemoproteins with nitric-oxide storage or
      sensing roles such as soluble guanylate cyclase and cytochrome c prime. The
      characterisation used optical spectroscopy, EPR, stopped-flow and femtosecond laser flash
      photolysis; the NO-bound Soret peak is blue-shifted to 395 nm against the 420-430 nm
      typical of hexacoordinate ferrous-NO globins, and the measured affinity is in the 10^-10
      to 10^-11 M range. Adding NO to the ferric protein produced no optical change, so the
      binding is specific to the ferrous state rather than a general heme artefact. The term
      is well precedented for this chemistry. GOA annotates GUCY1B1 to GO:0070026 by IEA -
      the code is stated because the neighbouring holders are experimental and it must not be
      read across - and soluble guanylate cyclase is precisely the five-coordinate NO
      hemoprotein the authors name as ADGB's comparator, alongside cytochrome c prime. The
      experimental precedent comes from CBS, THAP4 (nitrobindin) and the haemoglobin complex
      CPX-2158, which hold the term by IDA. This is a
      molecular function of ADGB that GOA does not record at all, and unlike the oxygen term it
      is the activity the biophysics actually points to. Stated caveat: the measurements are on
      the isolated recombinant globin domain, not full-length androglobin, and no in vivo
      NO-related phenotype has been demonstrated for ADGB in any organism.
    action: NEW
    reason: >-
      Direct, multi-method biophysical demonstration on the purified human globin domain of an
      atypical five-coordinate NO complex with sub-nanomolar affinity. Not represented anywhere
      in GOA for this gene.
    proposed_replacement_terms: []
    supported_by:
    - reference_id: PMID:38725499
      supporting_text: Adgb binds NO as a five-coordinate heme iron
    - reference_id: PMID:38725499
      supporting_text: >-
        With rapid autoxidation and high nitrite reductase activity, the globin appears to be
        more tailored toward nitric oxide homeostasis or buffering.
- term:
    id: GO:0098809
    label: nitrite reductase activity
  evidence_type: IDA
  original_reference_id: PMID:38725499
  qualifier: enables
  review:
    summary: >-
      Proposed new annotation. Two independent laboratories have measured nitrite reductase
      activity on the purified human androglobin globin domain, and a third study has probed it
      by mutagenesis. The ferrous heme reacts with nitrite to generate nitric oxide, followed
      spectroscopically as loss of the 423 nm Soret with a rise near 386 nm; the kinetics fit
      Michaelis-Menten, giving kcat/KM of 0.046 mM^-1 s^-1 for the domain alone rising to 0.102
      on calmodulin binding, and mutating the distal glutamine to tyrosine further enhances the
      activity. The activity is also modulated by the redox state of the CD-loop disulfide.
      Term choice was checked against the definitions rather than the labels. GO:0050421
      "nitrite reductase (NO-forming) activity" was considered and rejected: its definition is
      cytochrome-c-specific, describing the cd1-type enzyme, and does not describe a
      deoxyferrous globin reducing nitrite. GO:0098809 is the correct level, and that is
      confirmed by curator practice rather than only by reading the definitions: GOA already
      annotates human neuroglobin, cytoglobin and myoglobin to GO:0098809 by IDA for exactly
      this chemistry, and none of the three uses the GO:0050421 child. Stated caveats,
      which are the authors' own. All measurements are on the isolated recombinant globin
      domain rather than full-length androglobin, they use dithionite as the reductant, and the
      KM values are in the millimolar range - well above physiological nitrite. The original
      authors write that it remains unclear whether this is a natural function of Adgb. It is
      proposed here as a demonstrated in vitro activity, not as an established physiological
      role, and it is not listed among the core functions for that reason.
    action: NEW
    reason: >-
      Replicated in vitro catalytic activity on the human protein's globin domain, measured by
      two independent groups with full Michaelis-Menten kinetics and probed by mutagenesis by a
      third. Absent from GOA. Proposed with the isolated-domain and millimolar-KM caveats
      explicit.
    proposed_replacement_terms: []
    supported_by:
    - reference_id: PMID:38725499
      supporting_text: >-
        With rapid autoxidation and high nitrite reductase activity, the globin appears to be
        more tailored toward nitric oxide homeostasis or buffering.
    - reference_id: PMID:39719941
      supporting_text: the binding of CaM enhanced the nitrite reductase activity of Adgb
    - reference_id: PMID:39719941
      supporting_text: it remains unclear whether this is a natural function of Adgb
core_functions:
- description: >-
    Heme-binding circularly permuted globin domain that coordinates a b-type heme through a
    retained proximal histidine (His824), with a glutamine rather than the canonical histidine
    at the distal position (Gln792). The resulting His/Gln hexacoordinate heme binds nitric
    oxide as an atypical five-coordinate complex and reduces nitrite to nitric oxide, while
    binding oxygen only transiently. This is the module that defines androglobin as a globin.
  molecular_function:
    id: GO:0020037
    label: heme binding
  locations:
  - id: GO:0036126
    label: sperm flagellum
  supported_by:
  - reference_id: PMID:22115833
    supporting_text: >-
      The recombinantly expressed human globin domain exhibits an absorption spectrum
      characteristic of hexacoordination of the heme iron atom.
  - reference_id: file:human/ADGB/ADGB-bioinformatics/RESULTS.md
    supporting_text: >-
      Verdict: the globin domain is intact as a heme protein, but it is a His/Gln
      hexacoordinate globin, not a bis-histidyl one.
  - reference_id: PMID:38725499
    supporting_text: X = His for Cygb and Gln for Adgb
- description: >-
    Calcium-sensor coupling through an IQ motif that lies between the two halves of the split
    globin domain. Calmodulin binding places its N-lobe adjacent to the heme pocket and
    increases the domain's nitrite reductase efficiency about two-fold; deleting the IQ motif
    abolishes that activation. In human patients, variants that disrupt calmodulin binding
    cause asthenozoospermia, making this the molecular function most directly tied to disease.
  molecular_function:
    id: GO:0005516
    label: calmodulin binding
  locations:
  - id: GO:0097227
    label: sperm annulus
  supported_by:
  - reference_id: PMID:36995441
    supporting_text: The variants disrupted the binding of ADGB to calmodulin.
  - reference_id: PMID:39719941
    supporting_text: the binding of CaM enhanced the nitrite reductase activity of Adgb
  - reference_id: PMID:35700329
    supporting_text: >-
      a truncated construct covering the globin and IQ domains displayed robust ADGB-CaM
      interaction
- description: >-
    Required for the late, post-meiotic remodelling of spermatids into functional spermatozoa.
    Androglobin localises to the flagellum, midpiece and annulus of elongating spermatids and
    binds septin 10, CFAP69, SPEF2, TTC29 and CFAP47; its loss in mice causes infertility with
    abnormal head shaping and defective manchette, annulus and flagellum organisation, and
    bi-allelic human variants cause asthenozoospermia and oligoasthenoteratozoospermia. The
    molecular activity underlying this requirement is not established - notably, the
    calpain-like region is a non-catalytic pseudoprotease - so this is recorded as a cellular
    role rather than as a molecular function.
  directly_involved_in:
