core_functions:
- description: DOCK11 activates CDC42 by promoting guanine-nucleotide exchange, coupling small-GTPase
    signaling to actin-rich protrusion formation. Human DOCK11 constructs support CDC42 exchange activity,
    and patient-cell, knock-in and Jurkat knockdown/rescue experiments support a positive role in filopodium
    assembly during T-cell spreading on fibronectin. Protrusion and migration outcomes depend on cell
    type and assay conditions; this is not a universal prediction for every immune-cell state.
  molecular_function:
    id: GO:0005085
    label: guanyl-nucleotide exchange factor activity
  directly_involved_in:
  - id: GO:0051491
    label: positive regulation of filopodium assembly
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:16968698
    supporting_text: specific GEF for Cdc42
  - reference_id: PMID:37342957
    supporting_text: 'Patient-derived T cells did not form

      filopodia and showed abnormal migration.'
  - reference_id: Reactome:R-HSA-1011598
suggested_questions:
- question: Which molecular interactions determine whether DOCK11 loss reduces filopodia or produces excessive
    abnormal protrusions in different activated human immune-cell states?
- question: Does DOCK11 contact RCC2 directly, and does this association alter CDC42 exchange or the spatial
    organization of the signaling complex?
suggested_experiments:
- hypothesis: Cell state and upstream stimulation determine the morphology produced by altered DOCK11–CDC42
    signaling.
  description: Compare matched DOCK11 knockdown and wild-type rescue across primary human T cells, platelets
    and monocyte-derived dendritic cells, measuring active CDC42 and protrusion dynamics under defined
    receptor and adhesion stimuli.
  experiment_type: Matched perturbation/rescue with live-cell imaging and CDC42 activity measurements
- hypothesis: The RCC2-associated DOCK11 pool reflects either a direct interface or recruitment through
    an intermediate protein.
  description: Test purified or independently isolated DOCK11 and RCC2 constructs for binding, with negative
    controls and domain mapping, then measure whether any validated interaction changes CDC42 exchange.
  experiment_type: Controlled binding and nucleotide-exchange assays
