id: Q5JSL3
gene_symbol: DOCK11
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: DOCK11 is a large CDC42-directed guanine-nucleotide exchange factor of the DOCK-D family.
  Its DHR2 region promotes nucleotide exchange, while additional N-terminal contacts with active CDC42
  support feedback activation. DOCK11 couples CDC42 signaling to actin-rich protrusion organization and
  contributes to immune-cell morphology and homeostasis. Positive filopodium formation is demonstrated
  during T-cell spreading, but the direction and shape of protrusion changes depend on cell type and stimulation.
  Mouse Dock11 also supports the marginal-zone B-cell compartment. Human loss-of-function variants cause
  immune dysregulation and hematologic abnormalities.
