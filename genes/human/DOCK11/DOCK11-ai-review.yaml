- term:
    id: GO:0051491
    label: positive regulation of filopodium assembly
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:1923224
  - PANTHER:PTN002762089
  - UniProtKB:Q5JSL3
  review:
    summary: The filopodium IBA is grounded in direct target and ortholog evidence.
    action: ACCEPT
    reason: Positive filopodium regulation is directly supported in defined cellular contexts. In PMID:37342957,
      patient and engineered human cells show impaired actin-rich protrusions, and Jurkat knockdown/rescue
      shows partial restoration by wild-type DOCK11 but not W1707S during the tested spreading response.
      PMID:36952639 reports reduced platelet filopodial-stage responses alongside excessive abnormal protrusions
      in other activated immune-cell settings. Thus the positive process annotation is supported, but
      is not a universal prediction that DOCK11 deficiency reduces every protrusion in every cell state.
      The GO:0051491 IBD lies at PTN002762089 on the target path and includes human Q5JSL3 as genuine
      descendant experimental grounding; this self-inclusion is not circular.
    additional_reference_ids:
    - PMID:37342957
    - PMID:36952639
    - PMID:22494997
    supported_by:
    - reference_id: PMID:37342957
    - reference_id: PMID:36952639
    - reference_id: PMID:22494997
    propagation_review:
      root_cause: NO_FAILURE_CORE
