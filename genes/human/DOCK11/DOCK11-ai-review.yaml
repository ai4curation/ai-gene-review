- term:
    id: GO:0007264
    label: small GTPase-mediated signal transduction
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR026791
  review:
    summary: Specify the experimentally supported CDC42 signaling branch.
    action: MODIFY
    reason: The InterPro family mapping to small-GTPase signaling is biologically sound but broader than
      the established target specificity. DOCK11 catalyzes the GDP-exchange step that activates CDC42;
      the human construct assay and human-cell activation phenotypes therefore place the protein in the
      CDC42 signaling cassette. GO:0032488 is an is_a/part_of descendant of the imported GO:0007264 in
      the checked current ontology. This refines an existing assertion without adding a new process or
      transferring the functions of every DOCK family member.
    additional_reference_ids:
    - PMID:16968698
    - PMID:37342957
    supported_by:
    - reference_id: PMID:16968698
    - reference_id: PMID:37342957
