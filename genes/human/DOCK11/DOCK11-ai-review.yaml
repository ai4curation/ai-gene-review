  qualifier: involved_in
  supporting_entities:
  - UniProtKB:A2AF47
  - ensembl:ENSMUSP00000033419
  review:
    summary: Conserved B-cell compartment homeostasis is a contextual function.
    action: KEEP_AS_NON_CORE
    reason: Mouse Dock11 A2AF47 has direct IMP grounding in PMID:25729399. Global and B-cell-specific
      deletion reduce the marginal-zone B-cell compartment; normal LPS proliferation and tested chemotaxis
      do not invalidate that compartment phenotype. The human transfer is a defensible conserved physiological
      context, while the central molecular function is CDC42-directed nucleotide exchange. Retain this
      developmental/homeostatic context as non-core without claiming that a particular human proliferation,
      survival or retention mechanism has been demonstrated.
