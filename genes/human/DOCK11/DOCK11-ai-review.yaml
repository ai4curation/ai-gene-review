  - MGI:MGI:1923224
  - MGI:MGI:2146320
  - PANTHER:PTN000593987
  - UniProtKB:Q8NF50
  review:
    summary: Phylogenetic GEF activity is directly corroborated on DOCK11.
    action: ACCEPT
    reason: DOCK11 promotes CDC42 nucleotide exchange. The recovered PMID:16968698 original measures exchange
      using immunoprecipitated HA-tagged historical human full-length DOCK11 expressed in COS7, rather
      than purified soluble DOCK11; the DHR2 fragment is weaker and Rac is negative in the tested comparison.
      The historical 2073-residue clone differs at three positions from the current reference, without
      evidence that this negates its gene-level activity. PMID:25851601 separately measures CDC42-selective
      exchange by a DOCK11 DHR2 preparation. GO:0005085 is the appropriate current activity term. The
      literal IBD is at PTN000593987 on the verified path to Q5JSL3; the target MSA sequence matches its
      current 2073-residue sequence. This is a valid ancestral placement, not a pairwise donor vote.
