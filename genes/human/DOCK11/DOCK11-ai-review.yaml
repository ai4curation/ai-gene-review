  review:
    summary: DOCK11 was recovered with GFP–RCC2 in a controlled cellular pull-down.
    action: KEEP_AS_NON_CORE
    reason: PMID:25074804 Figure 3B identifies DOCK11 in the HEK293T GFP–RCC2 versus GFP SILAC screen
      (score 42.35, two peptides, enrichment ratio 7.5). This is positive co-complex association, not
      a purified binary interface or a demonstrated DOCK11 regulatory effect on RCC2. The subsequent direct
      RCC2–RAC1 and RCC2–coronin assays should not be reassigned to DOCK11. Retain the positive generic
