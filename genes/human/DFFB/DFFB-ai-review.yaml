  review:
    summary: DFFB/CAD contributes to apoptotic chromosome condensation.
    action: ACCEPT
    reason: CAD can induce chromatin condensation in isolated nuclei and DFF40 is sufficient to trigger chromatin 
      condensation in the DFF reconstitution system, even though TOP2A and other nuclear factors also contribute to the 
      full morphology.
    supported_by:
