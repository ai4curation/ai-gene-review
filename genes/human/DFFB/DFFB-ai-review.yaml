id: O76075
gene_symbol: DFFB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: DFFB, also called CAD, CPAN, or DFF40, is the nuclease subunit of the DNA fragmentation factor. It is 
  synthesized and held inactive in a complex with DFFA/ICAD, then released after executioner-caspase cleavage of DFFA 
  during apoptosis. Active DFFB oligomerizes, binds chromatin, and introduces double-strand DNA breaks that generate 
  oligonucleosomal DNA fragmentation; it also contributes to apoptotic chromatin condensation. DFFB functions in 
  cytosolic and nuclear DFF pools whose relative abundance can determine whether apoptotic cells complete DNA laddering.
