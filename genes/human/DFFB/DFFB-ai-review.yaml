  review:
    summary: CAD binds topoisomerase IIalpha in a chromatin-condensation pathway.
    action: KEEP_AS_NON_CORE
    reason: The Durrieu study identified TOP2A as a CAD partner that enhances TOP2A decatenation in vitro. This is a 
