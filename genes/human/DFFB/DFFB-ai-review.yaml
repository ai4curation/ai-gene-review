suggested_questions:
- question: Should GO add a DNA fragmentation factor complex cellular-component term so DFFA and DFFB complex membership
    can be curated more specifically than protein-containing complex?
  experts: []
- question: Should DFFB homodimerization be represented only as identical protein binding, or should active CAD 
    oligomerization have a pathway relation in a DNA-fragmentation GO-CAM?
  experts: []
suggested_experiments:
- description: Compare endogenous wild-type DFFB with dimerization-defective and catalytic mutants in a DFFB-null cell 
    line after DFFA cleavage, measuring chromatin recruitment, double-strand break-end chemistry, oligonucleosomal DNA 
    laddering, and apoptotic chromatin condensation.
  hypothesis: DFFB oligomerization and catalytic DNA endonuclease activity are both required to convert DFFA cleavage 
    into efficient apoptotic DNA laddering and nuclear condensation.
