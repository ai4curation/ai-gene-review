    id: GO:0032991
    label: protein-containing complex
  evidence_type: IDA
  original_reference_id: PMID:11371636
  qualifier: part_of
  review:
    summary: DFFB is part of the DFF40:DFF45 protein complex.
    action: KEEP_AS_NON_CORE
    reason: DFFB truly forms a DFF complex with DFFA, and the N-terminal DFF40:DFF45 heterodimer was structurally 
      characterized in the cited paper. The GO term itself is generic because no DNA fragmentation factor complex 
      cellular-component term is available locally.
    supported_by:
    - reference_id: PMID:11371636
      supporting_text: solution structure of the heterodimeric complex between NTDs of DFF40 and DFF45
- term:
    id: GO:0042802
    label: identical protein binding
  evidence_type: IPI
  original_reference_id: PMID:11371636
  qualifier: enables
  supporting_entities:
  - UniProtKB:O76075
  review:
    summary: Active DFF40/CAD oligomerizes as part of nuclease activation.
    action: KEEP_AS_NON_CORE
    reason: Identical protein binding is mechanistically sound for DFF40 because, after DFF45 release, DFF40 
      homodimerization is the basic enzymatically active nuclease state.
    additional_reference_ids:
    - Reactome:R-HSA-211193
    supported_by:
    - reference_id: Reactome:R-HSA-211193
      supporting_text: DFF40 forms homodimers, which are the basic structures of the enzymatically active nuclease
- term:
    id: GO:1902511
    label: negative regulation of apoptotic DNA fragmentation
  evidence_type: IDA
  original_reference_id: PMID:11371636
  qualifier: involved_in
  review:
    summary: DFFB is inhibited during negative regulation of DNA fragmentation; it is not the inhibitor.
    action: REMOVE
    reason: This ComplexPortal-style assertion conflates membership in the inactive DFF40:DFF45 complex with the 
      DFF45/ICAD inhibitor role. DFFB/CAD performs apoptotic DNA fragmentation once DFFA is cleaved; DFFA, not DFFB, is 
      the subunit that negatively regulates the nuclease.
    supported_by:
    - reference_id: PMID:11371636
      supporting_text: DFF45, which also acts as a nuclease inhibitor before DFF40 activation
