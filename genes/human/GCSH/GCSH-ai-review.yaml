  review:
    summary: GCSH is the obligatory lipoyl-relay intermediate in mitochondrial protein lipoylation; protein
      lipoylation is the specific descendant of protein maturation.
    action: MODIFY
    reason: GO:0051604 protein maturation is defined as 'Any process leading to the attainment of the full
      functional capacity of a protein'; GO:0009249 protein lipoylation is its specific descendant for this
      case. In human mitochondria LIPT2 octanoylates apo-GCSH, LIAS converts the octanoyl to a lipoyl group
      on GCSH, and LIPT1 transfers the lipoyl group from GCSH to the DLAT and DLST E2 subunits. GCSH therefore
      does part of the work of the process, as the scaffold that carries the group being built and transferred,
      not merely as a substrate. This matches the accepted protein-lipoylation IMP on yeast Gcv3 (PMID:19570983)
      and contrasts with bacteria using the LipB/LipA route, where GcvH is only modified.
