- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:16189514
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q13287
  review:
    summary: Generic protein binding from a binary interactome screen is uninformative for this mitochondrial
      matrix lipoyl carrier.
    action: REMOVE
    reason: 'The UniProtKB:Q13287 pair comes from a proteome-scale yeast two-hybrid screen (PMID:16189514)
      and is not removed as false. GO:0005515 carries no functional information, and no informative binding
      activity follows: the partner-class refinements considered earlier (transcription coactivator/coregulator
      binding for NMI, MED11 and MAGEA11) would assert a function for a nuclear or cytosolic partner class
      that the matrix-resident GCSH has no demonstrated physiological access to. The protein-binding policy
      therefore calls for REMOVE rather than a partner-class MODIFY.'
    supported_by:
    - reference_id: file:human/GCSH/GCSH-source-guide.md
      supporting_text: These records are not claims of independent physiological validation.
