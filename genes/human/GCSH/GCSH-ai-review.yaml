- term:
    id: GO:0005739
    label: mitochondrion
  evidence_type: EXP
  original_reference_id: PMID:36190515
  qualifier: located_in
  review:
    summary: Human GCSH constructs localize to mitochondria in the experimental cell model.
    action: ACCEPT
    reason: PMID:36190515 expresses full-length human GCSH constructs in COS7 cells after endogenous H-protein
      knockdown and examines localization by confocal microscopy with a cytochrome-c marker. Wild-type and
      individual variant observations must remain distinct. This supports the mitochondrial pool, without
      claiming native human tissue imaging or a complete submitochondrial topology determination.
    supported_by:
    - reference_id: PMID:36190515
    - reference_id: PMID:36190515
      supporting_text: Representative merged images (40X objective lens) showing colocalization of mitochondrial
