id: P23434
gene_symbol: GCSH
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: GCSH encodes the mitochondrial H-protein of the glycine-cleavage system. A covalently attached lipoyl
  arm carries the glycine-derived aminomethyl intermediate between catalytic components, supporting glycine breakdown
  and one-carbon metabolism. The lipoylated protein also supplies the donor used by LIPT1 to mature other mitochondrial
  enzymes, including DLAT and DLST. Biallelic variants can impair glycine metabolism, enzyme lipoylation, or both.
  The 173-residue precursor is processed to a 125-residue mature chain.
status: COMPLETE
references:
- id: PMID:15489334
  title: 'The status, quality, and expansion of the NIH full-length cDNA project: the Mammalian Gene Collection
    (MGC).'
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Describes the MGC full-length cDNA resource. This supports sequence-resource provenance, not a
      target-specific GCSH functional assay. Only the abstract was inspected; no target clone or residue result
      was extracted.
  full_text_unavailable: true
- id: PMID:15616553
  title: The sequence and analysis of duplication-rich human chromosome 16.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Supports human chromosome 16 genomic sequence context, rather than a GCSH biochemical or localization
      experiment. The abstract supplies no target-specific functional conclusion.
  full_text_unavailable: true
- id: PMID:16189514
  title: Towards a proteome-scale map of the human protein-protein interaction network.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Supports a positive GCSH–NMI screen interaction. Selected original supplementary methods describe
      the screen and verification strategy, but the study-wide co-affinity confirmation rate does not establish
      independent validation of this pair. Physiological GCSH transcriptional regulation remains untested by this
      evidence.
  full_text_unavailable: true
- id: PMID:1671321
  title: 'The glycine cleavage system: structure of a cDNA encoding human H-protein, and partial characterization
    of its gene in patients with hyperglycinemias.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Establishes human precursor and mature-chain sequence context. Original main text pp. 351–360
      assigns the lipoyl lysine by sequence comparison and describes covalent attachment by another enzyme; it does
      not demonstrate noncovalent lipoic-acid affinity. The normal cache is abstract-only. The incoming TAS process
      claim is distinct from the retired authored IDA binding proposal.
  full_text_unavailable: false
- id: PMID:2025283
  title: The primary structure of human H-protein of the glycine cleavage system deduced by cDNA cloning.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Human fetal-liver H-protein cDNA has a 519-base coding region, a 48-residue presequence and a
      125-residue mature protein, supporting precursor architecture. The cache is abstract-only; original Methods
      and target-specific processing experiments were not inspected.
  full_text_unavailable: true
- id: PMID:21269460
  title: Initial characterization of the human central proteome.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Provides protein-existence background from proteomic identification across seven human cell lines.
      Full text is available, but the GCSH identification table and peptides were not inspected; no new function
      or compartment is inferred.
  full_text_unavailable: false
- id: PMID:24275569
  title: An enzyme assisted RP-RPLC approach for in-depth analysis of human liver phosphoproteome.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Provides human liver phosphoproteome provenance. No GCSH-specific phosphopeptide or functional
      effect was independently verified from the abstract; it does not support a new phosphorylation mechanism.
  full_text_unavailable: true
- id: PMID:25944712
  title: N-terminome analysis of the human mitochondrial proteome.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Describes human mitochondrial N-terminome mapping. The GCSH-specific peptide and cleavage-site
      table were not inspected; mature-chain coordinates are attributed to the reviewed protein record, not to a
      newly verified peptide.
  full_text_unavailable: true
- id: PMID:32296183
  title: A reference map of the human binary protein interactome.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Supports seven positive GCSH partner interactions with literal target ORF 953 and RHBDD2 Q6NTF9-3/ORF
      4836. Historical MAGEA11 G5E962/ORF 4361 maps to current P43364 through ENSG00000185247.14 at gene level;
      clone-sequence equivalence is unverified. Multiple assay records do not establish physiological interactions
      or confer partner activity on GCSH.
  full_text_unavailable: false
- id: PMID:3348809
  title: Cloning of cDNA encoding human H-protein, a constituent of the glycine cleavage system.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Supports human H-protein identity and complex-component context through immunological cDNA selection
      and agreement with the first 12 residues of purified protein. The abstract does not establish separately inspected
      localization or purified-complex assembly methods.
  full_text_unavailable: true
- id: PMID:33890291
  title: Biallelic start loss variant, c.1A > G in GCSH is associated with variant nonketotic hyperglycinemia.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The original main Methods/Results and Discussion establish the variant and segregation findings.
      Three affected individuals from two families had the biallelic start-codon variant, with exome findings confirmed
      by Sanger sequencing and segregation. The proposed shortened translation product is a prediction, not an observed
      natural alternative product. The authors explicitly report that functional experiments could not be performed
      because further patient samples were unavailable. Figures and supplementary files were not inspected.
  full_text_unavailable: false
- id: PMID:34800366
  title: Quantitative high-confidence human mitochondrial proteome and its dynamics in cellular context.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Original Table S1A, Excel row 403, identifies the P23434-containing group 4249 as subtractive
      Class 1, spatial Cluster 1 and importomics Class 1. Selected original methods distinguish HEK293T fractionation
      from HeLa TOMM40 depletion. Additional accessions share the group, precluding isoform-specific peptide attribution.
      The membrane-association category is Ambiguous, and the matrix column contains prior GO annotation rather
      than a direct matrix assay. Table S1B’s metabolic category is not a flux measurement.
  full_text_unavailable: false
- id: PMID:36190515
  title: Pathogenic variants in GCSH encoding the moonlighting H-protein cause combined nonketotic hyperglycinemia
    and lipoate deficiency.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected original Introduction, Results, Discussion, Methods and captions were read. Human recombinant
      H/P-protein exchange, human-construct expression in COS7 cells and patient-cell lipoylation measurements distinguish
      carrier function, localization and downstream enzyme maturation. H57R separates glycine-exchange and E2-lipoylation
      effects; it does not establish that GCSH performs LIPT1 catalysis or additional structural work in maturation.
      The study explicitly did not test direct LIPT2 interaction. Recombinant reagents and mutant lower-mass species
      are not natural alternative products.
  full_text_unavailable: false
- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO terms
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The literal incoming InterPro mappings were inspected together with the target’s H-protein/lipoyl-domain
      identity. This methodological source explains the electronic mapping; human function and localization are
      assessed independently.
- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The actual PTHR11715 tree, alignment, AN/PTN map and IBD records were replayed. The exact 173-residue
      human target AN32/PTN002482330 descends from AN2/PTN001711613 for all three incoming IBA terms. Donor identities
      agree and no target-lineage negative record was retained. This is a phylogenetic assertion rather than a donor-count
      or pairwise-similarity test.
- id: GO_REF:0000044
  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot Subcellular Location vocabulary mapping, accompanied
    by conservative changes to GO terms applied by UniProt
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The incoming UniProt subcellular-location mapping is traceable to the reviewed mitochondrial record.
      The mapping supplies organelle localization, not membrane topology or an independently measured submitochondrial
      compartment.
- id: Reactome:R-HSA-5693967
  title: PXLP-K754-GLDC dimer decarboxylates Gly
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The actual GLDC event connects lipoyl-GCSH input 6793611 and the aminomethylated target in output
      complex 5693969 to human P23434, residues 49–173, in mitochondrial matrix. GLDC catalyzes the step; GCSH carries
      its intermediate.
- id: Reactome:R-HSA-5693977
  title: AMT transfers NH2CH2 from GCSH:SAMDLL to THF
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The actual AMT event’s input complex 5693969 and output complex 5693982 contain the corresponding
      GCSH chemical states. Both resolve to human P23434, residues 49–173, in matrix. AMT activity is not transferred
      to the carrier.
- id: Reactome:R-HSA-5694018
  title: DLD dimer:2xFAD oxidises GCSH:DHLL to GCSH:lipoate
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The actual DLD event resolves input GCSH in complex 5693982 and regenerated lipoyl-GCSH 6793611
      to the human mature chain in matrix. DLD oxidizes the lipoyl arm; this is not evidence of autonomous GCSH
      dehydrogenase activity.
- id: Reactome:R-HSA-6783984
  title: Glycine degradation
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The actual pathway summation and three child reactions were read. The model describes the GLDC,
      AMT and DLD steps coupled by GCSH, supporting glycine-cleavage context while preserving the distinct carrier
      and catalyst roles.
- id: Reactome:R-HSA-6792572
  title: LIPT1 transfers lipoyl group from lipoyl-GCSH to DBT/DLST
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The actual LIPT1 event uses human matrix lipoyl-GCSH 6793611 as donor and returns GCSH 5693951.
      DBT/DLST forms a recipient DefinedSet. This establishes target-specific localization and modeled donor chemistry,
      not by itself structural or catalytic participation of GCSH in protein maturation.
- id: Reactome:R-HSA-6793590
  title: LIPT2 transfers octanoyl group to GCSH
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The actual LIPT2 event resolves GCSH 5693951 and octanoyl-GCSH 6793586 to human P23434, residues
      49–173, in matrix. NDUFAB1 has a different participant compartment; its inner-membrane location does not relocate
      GCSH.
- id: Reactome:R-HSA-6793591
  title: LIAS synthesizes lipoyl-GCSH
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The actual LIAS event connects octanoyl-GCSH 6793586 to lipoyl-GCSH 6793611, with the same human
      mature-chain and matrix identity. LIAS performs sulfur insertion, while GCSH is the modified carrier.
- id: Reactome:R-HSA-9857492
  title: Protein lipoylation
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The pathway and its child reactions distinguish LIPT2 octanoylation, LIAS sulfur insertion and
      LIPT1 transfer from the GCSH donor. The available official record and repository cache support this mechanistic
      scope.
- id: Reactome:R-HSA-9858752
  title: LIPT1 transfers lipoyl group from lipoyl-GCSH to DLAT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The actual DLAT lipoylation event places the human GCSH donor and returned GCSH in matrix. Repeated
      numeric participant references express model multiplicity, not alternative GCSH products. LIPT1 performs lipoyl
      transfer to DLAT.
- id: UniProtKB:P23434
  title: Glycine cleavage system H protein, mitochondrial
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The official reviewed human record and direct canonical FASTA establish the 173-residue precursor,
      processed chain 49–173, covalent lipoyl site Lys107 and H-protein carrier role. No alternative natural products
      are declared. Lys107 is a precursor coordinate, corresponding arithmetically to mature residue 59. The record’s
      covalent-cofactor statement is not a noncovalent affinity assay.
- id: UniProtKB:Q13287
  title: N-myc-interactor
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The official FUNCTION account describes NMI recruitment of CBP/p300 to STAT proteins with enhanced
      transcription. This establishes the coactivator partner class independently of the GCSH interaction screens;
      it does not demonstrate GCSH-mediated transcriptional regulation.
- id: UniProtKB:P43360
  title: Melanoma-associated antigen 6
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The official reviewed MAGEA6 FUNCTION account identifies an E3-ligase activator. Activation of
      another enzyme does not make the measured partner a catalytic E3 enzyme; the GCSH pair is retained without
      an unsupported enzyme-binding refinement.
- id: UniProtKB:P43364
  title: Melanoma-associated antigen 11
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The official MAGEA11 FUNCTION account establishes androgen-receptor transcription coregulation.
      The HuRI historical accession crosswalk is gene-level only; no modern isoform-specific activity or GCSH regulatory
      mechanism is inferred.
- id: UniProtKB:Q6NTF9
  title: Rhomboid domain-containing protein 2
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The official RHBDD2 record cautions that conserved peptidase active sites are absent. The original
      interaction is specifically Q6NTF9-3, but no demonstrated activity of that isoform was recovered. A peptidase
      family name alone does not establish enzyme binding.
- id: UniProtKB:Q9NYP9
  title: Protein Mis18-alpha
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The official MIS18A FUNCTION account supports CENPA recruitment and centromere assembly. It does
      not identify the partner as a histone, catalytic enzyme or demonstrated histone chaperone for a corresponding
      GCSH binding refinement.
- id: UniProtKB:Q9P086
  title: Mediator of RNA polymerase II transcription subunit 11
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The official MED11 record identifies a component of the Mediator transcription coactivator. That
      partner class supports the binding refinement, while the screen does not establish interaction with assembled
      Mediator or GCSH transcriptional activation.
- id: UniProtKB:Q9UHD4
  title: Lipid transferase CIDEB
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The official CIDEB account describes directional lipid transfer between droplets. Physical lipid
      transfer is not catalytic group-transfer chemistry; no GCSH lipid-transport function is assigned from the
      positive interaction alone.
- id: file:human/GCSH/GCSH-uniprot.txt
  title: Glycine cleavage system H protein, mitochondrial
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The exact local copy of the reviewed P23434 record supports the quoted FUNCTION and COFACTOR statements.
      It describes intermediate carriage and covalent lipoyl attachment, not independent catalytic activity or noncovalent
      affinity.
- id: file:gocams/67b1629100001554/67b1629100001554-src.yaml
  title: glycine decarboxylation via glycine cleavage system (GO:0004375)
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The production PomBase model assigns GO:0140104 to gcv3/SPBP19A11.01 at activity node 1562. This
      establishes an H-protein carrier-annotation precedent and distinguishes it from the targeted human, budding-yeast,
      mouse and E. coli queries; it is not a new human assay.
