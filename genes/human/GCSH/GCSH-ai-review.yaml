suggested_questions:
- question: How should the proposed lipoyl-dependent carrier activity be reconciled with current GO conventions?
    PomBase GO-CAM 67b1629100001554 assigns GO:0140104 to the fission-yeast H protein. Budding-yeast GCV3 has GO:0031405
    by IDA (PMID:32974306), and E. coli sucB and M. tuberculosis dlaT also carry IDA lipoic-acid-binding annotations
    despite covalent lipoyl groups. The selected GCV3 experiment identifies lipoylated peptides rather than noncovalent
    affinity; the bacterial original assays were not independently inspected. These annotations demonstrate competing
    usage, not a universal absence of carrier or lipoic-acid-binding annotations.
- question: Does GCSH contribute structural or cofactor work to E2 protein maturation beyond supplying the lipoyl
    donor substrate used by LIPT1? The existing cellular recovery experiments do not isolate that distinction.
- question: What explains the different effects of individual GCSH variants on glycine exchange and E2 lipoylation,
    and how do those differences depend on physiological tissue context?
suggested_experiments:
- description: Reconstitute human GCSH, LIPT1 and recipient E2 lipoyl domains at matched lipoyl occupancy. Compare
    transfer kinetics and interaction-deficient GCSH variants to distinguish donor availability from an additional
    structural contribution.
- description: Test the glycine-cleavage carrier cycle with matched quantities of lipoylated human H-protein variants,
    measuring intermediate transfer and product formation separately from protein stability and mitochondrial import.
proposed_new_terms:
- proposed_name: lipoyl-dependent carrier activity
  proposed_definition: Carrying a substrate or reaction intermediate on a covalently attached lipoyl prosthetic
    group and delivering it between cognate enzymes. In the glycine cleavage system, the H protein carries the glycine-derived
    aminomethyl intermediate between the P and T proteins and presents its reduced lipoyl arm to the L protein.
  justification: The established activity is intermediate delivery by a mobile lipoyl arm. GO:0140104 covers molecular
    carriers and has a phosphopantetheine-dependent carrier child, but no lipoyl-dependent counterpart was identified.
    The proposed child describes the carrier function without assigning GLDC, AMT or DLD catalytic activities, or
    treating covalent cofactor attachment as noncovalent binding.
  proposed_parent:
    id: GO:0140104
    label: molecular carrier activity
  supported_by:
  - reference_id: file:human/GCSH/GCSH-uniprot.txt
  - reference_id: file:gocams/67b1629100001554/67b1629100001554-src.yaml
