  original_authored_NEW:
    original_row: 22
    term: GO:0031405
    literal_evidence_type: IDA
    literal_reference: PMID:1671321
    decision: RETIRE_AUTHORED_NEW_TO_ARCHIVE_NO_REPLACEMENT_NEW
    rationale: The old proposal treated covalent Lys107 lipoylation as lipoic-acid binding. The actual binding parent
      requires a noncovalent interaction. The original human study establishes sequence/lipoyl-site context rather
      than an affinity assay, so its literal IDA assignment is not a verified direct assay of that MF. This does
      not assert that noncovalent lipoate association is biologically impossible. The yeast GCV3/PMID32974306 comparator
      remains an explicit contrary annotation convention, with selected source evidence of covalent lipoyl peptides;
      it is not silently adjudicated here.
    preservation: Retain the complete original row, every supporting-text association and all old review/notes bytes
      in the portable archive. The final28 current original rows are separate from this retired authored assertion.
    complete_original_annotation:
      term:
        id: GO:0031405
        label: lipoic acid binding
      evidence_type: IDA
      original_reference_id: PMID:1671321
      qualifier: enables
      review:
        summary: GCSH binds one lipoic acid (lipoate) cofactor covalently on Lys107 (N6-lipoyllysine), via its lipoyl-binding
          domain. This covalently bound lipoyl group is the swinging arm that carries the reaction intermediate
          through the glycine cleavage cycle; lipoic acid binding is the informative molecular function of this
          otherwise non-catalytic carrier protein.
        action: NEW
        reason: GOA lists only bare protein binding as a molecular function. The lipoyl-carrier role is GCSH's defining
          molecular activity and is directly supported by the covalent (R)-lipoate cofactor (PMID:1671321), the
          N6-lipoyllysine modification at position 107, and the lipoyl-binding (biotinyl/lipoyl attachment) domain
          in UniProt. GO:0031405 lipoic acid binding is the appropriate, informative term. Proposed as a new molecular-function
          annotation.
        supported_by:
        - reference_id: file:human/GCSH/GCSH-uniprot.txt
          record_section:
          - CC:COFACTOR
          supporting_text: Binds 1 lipoyl cofactor covalently.
        - reference_id: file:human/GCSH/GCSH-uniprot.txt
          record_section:
          - FT:MOD_RES
          supporting_text: N6-lipoyllysine
        - reference_id: PMID:36190515
          supporting_text: Lipoate is also a critical cofactor of the glycine cleavage enzyme system (GCS), where
            the H-protein itself is the lipoate carrier of this enzyme complex.
