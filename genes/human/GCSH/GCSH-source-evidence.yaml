  - path: reactome/R-HSA-5693967.md
    bytes: 1742
    sha256: e5016dbc16ae23f7d2ea162ca6a11ceb28eb6dc9bad8fec9b8cbc40759110eef
    blob: d18d46e67161876fdfab291e2f4a498662e5dd5a
    mode: '100644'
    header:
      stable_id: R-HSA-5693967
      display_name: PXLP-K754-GLDC dimer decarboxylates Gly
      species: Homo sapiens
      summary: The simplest amino acid, glycine, is catabolised by several different pathways. The major pathway
        is via the glycine cleavage system. In the first reaction, glycine (Gly) is decarboxylated to carbon dioxide
        (CO2) and aminomethyl group (NH2CH2) by mitochondrial glycine dehydrogenase (decarboxylating) (GLDC, P protein),
        a dimeric protein using pyridoxal 5-phosphate (PXPL) as cofactor per subunit (Kume et al. 1991). Mitochondrial
        glycine cleavage system H protein (GCSH) is used as a co-substrate in this reaction. GCSH uses lipoate as
        a cofactor which accepts the aminomethylgroup from glycine decarboxylation to form a S-aminomethyldihydrolipoylated
        protein (GCSH:SAMDLL) (Fujiwara et al. 1991, Fujiwara et al. 1991).
  - path: reactome/R-HSA-5693977.md
    bytes: 1258
    sha256: a49c512a160af5a8082cc89d52eaadec6474a4ead435d4cbce7993ffe3d0a09f
    blob: a64b9383b0081d256109b11fd2ced9b8af5bc5ce
    mode: '100644'
    header:
      stable_id: R-HSA-5693977
      display_name: AMT transfers NH2CH2 from GCSH:SAMDLL to THF
      species: Homo sapiens
      summary: The major degradative pathway for the amino acid glycine is via the glycine cleavage system. In the
        second reaction in this system, the decarboxylated moiety from glycine decarboxylation attached to H protein
        (GCSH:SAMDLL) is further degraded by mitochondrial aminomethyltransferase (AMT, GCST, T protein) to ammonia
        (NH3) and GCSH with reduced lipoate. Tetrahydrofolate (THF) is required for this reaction and accepts the
        methyl group to form 5,10MTHF (Fujiwara et al. 1984).
  - path: reactome/R-HSA-5694018.md
    bytes: 842
    sha256: 1bd127103641763acc60c791646835bc248549b92f514d575a949d66778d705f
    blob: 0c02db3a2b096de76bb96853b613c4641e440d7a
    mode: '100644'
    header:
      stable_id: R-HSA-5694018
      display_name: DLD dimer:2xFAD oxidises GCSH:DHLL to GCSH:lipoate
      species: Homo sapiens
      summary: The last step in the glycine cleavage system is the reoxidation of the reduced lipoate (dihydrolipoyl
        group) attached to the H protein (GCSH:DHLL) catalysed by the L protein (mitochondrial dihydrolipoyl dehydrogenase,
        DLD) (Harris et al. 1997, Ciszak et al. 2006).
  - path: reactome/R-HSA-6783984.md
    bytes: 774
    sha256: 878a46330986326cfc0b0c4f1804296022a34a84eabab271acbb3b19e111513e
    blob: 0ab665855c9367b21fb1bc2a84dbdd44c14beea1
    mode: '100644'
    header:
      stable_id: R-HSA-6783984
      display_name: Glycine degradation
      species: Homo sapiens
      summary: The simplest amino acid, glycine, is catabolised by several different pathways. The major pathway
        is via the glycine cleavage system, comprising dimeric P protein (GLDC), T protein (AMT, GCST), dimeric
        L protein (DLD) and H protein (GCSH) (Kikuchi et al. 2008).
  - path: reactome/R-HSA-6792572.md
    bytes: 1166
    sha256: 8a708a250f3f24bf48d72aad5a4fd5c2e75db9d2002b6f802b547d5902d5dc93
    blob: 39f24b502132189360b52cb9bbf464575fe9140c
    mode: '100644'
    header:
      stable_id: R-HSA-6792572
      display_name: LIPT1 transfers lipoyl group from lipoyl-GCSH to DBT/DLST
      species: Homo sapiens
      summary: Mitochondrial lipoyltransferase 1 (LIPT1) catalyses the transfer of a lipoyl group from lipoyl-K107-GCSH
        to lysine residue(s) of lipoate-dependent enzymes (Fujiwara et al. 1999; Cao et al., 2018). Defects in LIPT1
        reduce lipoylation of pyruvate dehydrogenase and alpha-ketoglutarate dehydrogenase, causing a cofactor disorder
        of mitochondrial energy metabolism (Soreze et al. 2013, Tort et al. 2014; Ni et al., 2019).
  - path: reactome/R-HSA-6793590.md
    bytes: 1342
    sha256: 5834a20b84086c5c468f1240656b3e78f5c0f35099699799a2b90dc9d4f4a29a
    blob: 3fc6f26dc42e9471412801ed9c42e05706fab379
    mode: '100644'
    header:
      stable_id: R-HSA-6793590
      display_name: LIPT2 transfers octanoyl group to GCSH
      species: Homo sapiens
      summary: Mitochondrial lipoyltransferase 2 (LIPT2) transfers an octanoyl group bound to the acyl-carrier protein
        NDUFAB1 (ACP) to mitochondrial glycine cleavage system H protein (GCSH) at lysine 107 (Schonauer et al.
        2009; Cao et al., 2018). The octanoyl moiety is provided by mitochondrial fatty acid synthesis pathways
        (Feng et al., 2009; Witkowski et al., 2011). Mutations in LIPT2 can cause severe neonatal encephalopathy
        by lipoate deficiency of mitochondrial dehydrogenase complexes (NELABA. MIM:617668; Habarou et al., 2017).
  - path: reactome/R-HSA-6793591.md
    bytes: 1884
    sha256: b450c2319a08b7c599e64f9361553835f948f3b4cf0816467285bb7266563793
    blob: 1c2c159ffba0f97bb17d72363eac35878a98bec4
    mode: '100644'
    header:
      stable_id: R-HSA-6793591
      display_name: LIAS synthesizes lipoyl-GCSH
      species: Homo sapiens
      summary: Mitochondrial lipoyl synthase (LIAS) mediates the radical-mediated insertion of two sulfur atoms
        into the C-6 and C-8 positions of the octanoyl moiety bound to glycine cleavage system H protein (GCSH),
        transforming the octanoyl moiety to a lipoyl moiety. LIAS requires two 4Fe-4S clusters as cofactors, which
        act as the sulfur donors in the reaction. It also requires ferredoxin FDX1 as a cofactor. Moreover, LIAS
        is in complex with iron-sulfur cluster scaffold NFU1, which restores the auxiliary cluster of LIAS during
        turnover (Morikawa et al., 2001; Warui et al., 2022; Dreishpoon et al., 2023; Joshi et al., 2023). Defects
        in LIAS can cause neonatal-onset epilepsy, defective mitochondrial energy metabolism, and glycine elevation
        (HGCLAS, MIM:614462; Mayr et al., 2011; reviewed by Cronan, 2020).
  - path: reactome/R-HSA-9857492.md
    bytes: 2398
    sha256: ec611ca0c252621215ff3b5466f1cd6d9d4ba7f2044672a03fdbd8e3b6407f78
    blob: 9ffc05a96e87e9e72923fd9b0d1733a9a41fa3c0
    mode: '100644'
    header:
      stable_id: R-HSA-9857492
      display_name: Protein lipoylation
      species: Homo sapiens
      summary: 'Lipoate is an essential cofactor for five redox reactions: four in oxoacid dehydrogenases (active
        in energy and amino acid metabolism) and one in the glycine cleavage system (GCS). Lipoate synthesis and
        transfer to target proteins in mitochondria requires three steps. Octanoyl carried by ACP from mitochondrial
        fatty acid synthesis is first transferred to GCSH. In the second step, two sulfur atoms of an iron-sulfur
        cluster are inserted on the side chain, synthesizing the lipoyl group in a highly complicated reaction.
        Finally, lipoyl is transferred onto the lipoyl domains of the E2 subunits (DLST, DLAT, DBT) of the target
        enzyme complexes (OGDH, OADH, PDH, BCKDH) (Schonauer et al., 2009; Cao et al., 2018; reviewed in Cronan,
        2020). Defects in the enzymes catalyzing the three steps cause severe lactic acidosis and metabolic imbalances
        due to dehydrogenase deficiency. Mutations in the lipoyl carrier GCSH additionally cause hyperglycinemia,
        leading to epileptic encephalopathy, since GCSH moonlights in glycine catabolism (Arribas-Carreira et al.,
        2023).'
  - path: reactome/R-HSA-9858752.md
    bytes: 1178
    sha256: 30cd87a8cfd91af90e23567c1789f110c59144b50520c25cb863a8c752aff4df
    blob: 00cbdf6882de5259f27b75ae106eef1cc6a7d880
    mode: '100644'
    header:
      stable_id: R-HSA-9858752
      display_name: LIPT1 transfers lipoyl group from lipoyl-GCSH to DLAT
      species: Homo sapiens
      summary: Mitochondrial lipoyltransferase 1 (LIPT1) catalyses the transfer of a lipoyl group from lipoyl-K107-GCSH
        to two lysine residues of the PDH complex subunit E2 (DLAT) (Fujiwara et al. 1999; Cao et al., 2018). Defects
        in LIPT1 reduce lipoylation of pyruvate dehydrogenase and alpha-ketoglutarate dehydrogenase, causing a cofactor
        disorder of mitochondrial energy metabolism (Soreze et al. 2013, Tort et al. 2014; Ni et al., 2019).
