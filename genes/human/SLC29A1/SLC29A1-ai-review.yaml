  review:
    summary: Proposed refinement capturing the defining equilibrative (facilitated,
      Na+-independent, down-concentration-gradient) mechanism of ENT1, which the
      existing general GO:0005337 annotations do not record.
    action: NEW
    reason: ENT1 is the prototypic equilibrative transporter and is explicitly
      Na+-independent; transport runs down the substrate concentration gradient
      (bidirectional uniporter). GO:0015395 is the is_a child of GO:0005337 that
      states this mechanism and is the most accurate core molecular function. Inferred
      (IC) from the Na+-independent facilitative function shown in the original cloning
      paper and corroborated by the es-type equilibrative kinetics.
