    record_section: ["CC:FUNCTION"]
    supporting_text: Also mediates the uptake of nicotinamide; contributes to maintaining nicotinamide homeostasis
suggested_questions:
- question: Is ENT1-mediated nicotinamide transport physiologically significant for
    tissue NAD+ metabolism, and should a dedicated nicotinamide transmembrane
    transporter activity GO term be created and annotated to SLC29A1/SLC29A2?
- question: Which GO-annotatable physiological roles of ENT1 are directly mediated by
    its transport activity versus indirectly caused by changes in extracellular
    adenosine/inosine signalling (e.g. cardioprotection, nociception, BAT
    thermogenesis)?
suggested_experiments:
- description: Structure-guided mutagenesis combined with radiotracer flux assays to
    define the substrate-binding determinants that distinguish high-affinity
    nucleoside transport from low-affinity nucleobase and nicotinamide transport in
    ENT1.
- description: Tissue-specific Slc29a1 conditional knockouts with targeted
    metabolomics (adenosine, inosine, nicotinamide, NAD+) to separate the direct
    transport function of ENT1 from downstream purinergic-signalling consequences.
