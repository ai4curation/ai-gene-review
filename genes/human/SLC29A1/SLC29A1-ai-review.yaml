  review:
    summary: Reactome event (SLC29A1,2 transport 6-mercaptopurine) asserting
      transporter activity. 6-mercaptopurine is a purine nucleobase analog (of
      hypoxanthine), which hENT1 transports as a nucleobase (PMID:21795683).
    action: MODIFY
    reason: The equilibrative transport activity is genuine, but 6-mercaptopurine is a
      nucleobase analog (an analog of hypoxanthine), not a nucleoside; hENT1 transports
      it as a nucleobase (Yao et al. 2011). The substrate-precise molecular function
      for this 6-MP transport event is therefore nucleobase transmembrane transporter
      activity (GO:0015205), not the nucleoside term GO:0005337. ENT1's
      nucleobase-transporter activity is independently supported and kept as non-core
      elsewhere in this review (the adenine/guanine/uracil substrate-specific rows).
    proposed_replacement_terms:
