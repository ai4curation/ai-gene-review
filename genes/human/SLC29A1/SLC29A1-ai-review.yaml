- term:
    id: GO:0015389
    label: 'pyrimidine- and adenosine-specific:sodium symporter activity'
  evidence_type: IDA
  original_reference_id: PMID:21795683
  qualifier: enables
  review:
    summary: UniProt IDA annotation assigning a sodium symporter (Na+-coupled,
      concentrative) activity to ENT1, cited to the nucleobase-transport paper.
    action: REMOVE
    reason: This term is mechanistically wrong for ENT1. GO:0015389 is a Na+ symporter
      (cotransports solute with Na+ against a gradient; concentrative). ENT1 is the
      prototypic equilibrative transporter and is explicitly Na+-INDEPENDENT; the
      cited paper (PMID:21795683) demonstrates NBMPR-sensitive, saturable, Na+-free
      equilibrative transport, directly contradicting a sodium-symport mechanism.
      Na+-coupled concentrative nucleoside transport in humans is performed by the
      unrelated SLC28/CNT family, not SLC29/ENT. The correct molecular function is the
      equilibrative nucleoside transporter activity already annotated (GO:0005337 or
      GO:0015395). Recorded as a UniProt source defect.
    supported_by:
    - reference_id: file:human/SLC29A1/SLC29A1-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Functions as a Na(+)-independent transporter
    - reference_id: PMID:21795683
      supporting_text: saturable and inhibited by NBMPR
    source_defects:
    - defect_type: WRONG_TERM
      resource: UNIPROT
      slot: GO
      requested_change: REPOINT
      asserted_value: GO:0015389
      corrected_value: GO:0005337
      corrected_label: nucleoside transmembrane transporter activity
      confidence: CONFIRMED
      explanation: UniProt annotates ENT1 (Q99808) with GO:0015389 (pyrimidine- and
        adenosine-specific sodium symporter activity) by IDA from PMID:21795683. This
        is a Na+-coupled (concentrative) symporter term, but ENT1 is the prototypic
        equilibrative, Na+-independent nucleoside/nucleobase uniporter. UniProt's own
        FUNCTION comment states ENT1 functions as a Na(+)-independent transporter, and
        the cited paper shows saturable, NBMPR-sensitive, Na+-free equilibrative
        transport. Concentrative Na+-coupled nucleoside transport in humans is done by
        the SLC28/CNT family, not SLC29/ENT. Replace GO:0015389 with the correct
        equilibrative nucleoside transporter activity (GO:0005337; or the more specific
        GO:0015395, nucleoside transmembrane transporter activity, down a concentration
        gradient).
