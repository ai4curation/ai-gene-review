id: Q99808
gene_symbol: SLC29A1
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Equilibrative nucleoside transporter 1 (ENT1/hENT1), the prototypic es-type
  (equilibrative, nitrobenzylmercaptopurine riboside [NBMPR]-sensitive) nucleoside
  transporter of the SLC29/ENT family. ENT1 is a polytopic plasma-membrane protein
  (11 transmembrane helices, MFS-like fold) that acts as a uniporter mediating
  facilitated, Na+-independent, bidirectional (equilibrative) movement of nucleosides
  and, at lower affinity, nucleobases down their concentration gradient. Its
  high-affinity physiological substrates are the purine and pyrimidine nucleosides
  adenosine, guanosine, inosine, uridine, thymidine and cytidine; it also transports
  the purine nucleobases hypoxanthine, adenine and guanine, the pyrimidine
  nucleobases thymine and uracil, and nicotinamide. By mediating cellular nucleoside
  flux ENT1 maintains nucleoside homeostasis and sets extracellular levels of the
  signalling nucleosides adenosine (a purinergic P1-receptor neuromodulator important
  in cardiovascular and central-nervous-system physiology) and inosine (which
  regulates brown-adipose-tissue energy expenditure). ENT1 is broadly expressed
  (erythrocytes, brain, blood-brain barrier endothelium, kidney, intestine, placenta,
  testis/Sertoli cells, adipose tissue) and, in polarized epithelia, localizes to the
  basolateral and apical membranes. It is potently inhibited by NBMPR, dipyridamole,
  dilazep and draflazine, and transports many nucleoside-analog drugs (gemcitabine,
  cytarabine, cladribine, fludarabine, ribavirin, mercaptopurine, antivirals),
  making it a major determinant of their cellular uptake and a biomarker of
  gemcitabine response.
