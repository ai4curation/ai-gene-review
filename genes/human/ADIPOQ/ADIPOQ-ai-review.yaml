    label: negative regulation of platelet-derived growth factor receptor signaling pathway
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:106675
  - PANTHER:PTN008559544
  - UniProtKB:Q15848
  review:
    action: ACCEPT
    summary: Adiponectin binds PDGF-BB and blocks its access to the receptor; a directly demonstrated,
      mechanistically explicit process.
    reason: This is one of the few adiponectin activities with a directly measured molecular
      mechanism in human cells. PMID:12070119 showed that human adiponectin binds PDGF-BB
      itself and thereby blocks the ligand from reaching its receptor on human aortic smooth
      muscle cells, suppressing PDGF beta-receptor autophosphorylation. Ligand sequestration
      is a direct participation in the negative regulation of that pathway, not a downstream
      physiological consequence.
    propagation_review:
