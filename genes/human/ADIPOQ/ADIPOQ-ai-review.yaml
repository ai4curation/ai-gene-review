- term:
    id: GO:0005201
    label: extracellular matrix structural constituent
  evidence_type: RCA
  original_reference_id: PMID:28675934
  qualifier: enables
  review:
    action: REMOVE
    summary: Adiponectin is a circulating hormone, not a structural component of the extracellular
      matrix; this row is a bulk computational block that converted matrisome detection into
      a structural role.
    reason: 'Three independent grounds. (1) Provenance: PMID:28675934 is an ECM proteomics
      survey, and in GOA it assigns GO:0005201 by RCA to 41 entities, together with GO:0030020,
      GO:0030021 and GO:0030023 - the collagen tensile-strength terms - to 31, 8 and 4 more.
      That is a computational block over a matrisome protein list, not a measurement of adiponectin''s
      contribution to matrix integrity. (2) The term''s definition is ''the action of a molecule
      that contributes to the structural integrity of the extracellular matrix''; no such
      contribution has been reported for adiponectin, and UniProt places the mature protein
      in ''Secreted'' with no matrix role. (3) The likely trigger is the collagen-like domain
      (residues 42-107), but UniProt''s SUBUNIT is explicit that those repeats build adiponectin''s
      own homotrimer: the low-molecular-weight trimers are assembled via non-covalent interactions
      of the collagen-like domains in a triple helix. They do not crosslink a matrix. This
      is a fold-to-function error arriving through a bulk RCA import rather than through the
      retired Swiss-Prot-keyword route. Adiponectin does adsorb to matrix in injured tissue,
      but that is binding, not being a structural constituent, and no GO row currently makes
      the binding claim.'
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - ROLE_CONFLATION
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: PMID:28675934
        comment: 'bulk RCA block: 41 entities receive GO:0005201 from this one ECM-proteomics
