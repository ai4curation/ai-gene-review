    reason: PMID:12368907 showed adiponectin stimulates glucose uptake and lactate production
      in myocytes through AMPK, and PMID:16622416 traced GLUT4 membrane translocation to APPL1-Rab5.
      A core metabolic action, correctly expressed as regulation.
    supported_by:
    - reference_id: PMID:12368907
      supporting_text: Ad stimulates phosphorylation of acetyl coenzyme A carboxylase (ACC),
        fatty-acid oxidation, glucose uptake and lactate production in myocytes
