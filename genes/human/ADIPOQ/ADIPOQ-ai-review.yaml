- term:
    id: GO:0005179
    label: hormone activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - MGI:MGI:106675
  - PANTHER:PTN008559544
  - UniProtKB:Q15848
  review:
    action: ACCEPT
    summary: Adiponectin is a bona fide adipocyte-derived endocrine hormone and this is its
      core molecular function.
    reason: GO:0005179 is defined as the action of 'any substance formed in very small amounts
      in one specialized organ or group of cells and carried (sometimes in the bloodstream)
      to another organ or group of cells in the same organism, upon which it has a specific
      regulatory action'. Adiponectin is made only by adipocytes, circulates in plasma at
      5-30 ug/ml, and acts on liver, skeletal muscle, macrophages, endothelium and kidney
      through AdipoR1, AdipoR2 and T-cadherin. The definition is met exactly, and this term
      - not the coarser signaling receptor binding, and not extracellular matrix or interaction-screen
      terms - is what the gene is for. The IBA is self-referential - its WITH/FROM is MGI:MGI:106675|PANTHER:PTN008559544|UniProtKB:Q15848,
      i.e. it includes ADIPOQ itself - so it records a PAINT curator judging this function
      core rather than importing it from elsewhere. Both donor tokens resolve and both carry
      their own experimental evidence for the term (MGI:MGI:106675 = Q60994 ADIPO_MOUSE, IDA).
      Node PTN008559544 reaches exactly one human gene, ADIPOQ, checked against all 82 human
      GO:0005179 IBA rows.
