- term:
    id: GO:0033691
    label: sialic acid binding
  evidence_type: IDA
  original_reference_id: PMID:19855092
  qualifier: enables
  review:
    action: REMOVE
    summary: The cited paper shows that adiponectin IS sialylated; it does not show that adiponectin
      binds sialic acid. The annotation inverts the direction of the relationship.
    reason: 'GO:0033691 is defined as ''Binding to a sialic acid''. PMID:19855092 is a post-translational-modification
      study: it maps sialylated O-linked glycans onto Thr residues of adiponectin''s own variable
      domain and shows that removing them accelerates plasma clearance. Adiponectin is the
      glycoprotein carrying the sialic acid, not a lectin recognising it - the only receptor
      discussed is the hepatic asialoglycoprotein receptor, which binds desialylated adiponectin,
      i.e. the traffic runs the other way. UniProt encodes the same facts as CARBOHYD features
      at Thr-21 and Thr-22 with this exact reference, and a PTM comment, not as a binding
      activity. Adiponectin has no lectin domain: its two modules are a collagen-like repeat
      (42-107) and a C1q jelly-roll (108-244). This is the sole annotation PMID:19855092 carries
      in all of GOA. Note the row has already propagated: mouse Adipoq (Q60994) holds GO:0033691
      only by IEA GO_REF:0000107 and ISO GO_REF:0000119, both orthology transfers from this
      human row, so correcting it here retracts the error in both species.'
    supported_by:
