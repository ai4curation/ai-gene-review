      the same two references, so the defect originates upstream at MGI and reaches human
      through these ISS transfers. The IEA rows are Compara projections from mouse Adipoq
      and inherit the same evidence. They are kept because each direction does have one correctly-cited
      paper behind it; the fix belongs upstream, where the four mouse IMP rows should become
      two.'
