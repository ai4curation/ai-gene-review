  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q60994
  review:
    action: MARK_AS_OVER_ANNOTATED
    summary: The underlying observation is that a drug INDUCES adiponectin, which makes adiponectin
      the output of the response rather than a participant in it.
    reason: 'The mouse annotation this ISS transfers from is GO:0071466 IDA on Q60994 from
      PMID:19109165, ''The peroxisome proliferator-activated receptor gamma agonist rosiglitazone
      ameliorates murine lupus by induction of adiponectin''. The datum is that rosiglitazone
      raises adiponectin expression. Annotating ADIPOQ to ''cellular response to xenobiotic
      stimulus'' therefore inverts the roles: adiponectin is what the responding adipocyte
      produces, not the machinery by which it detects or handles the xenobiotic. Marked over-annotated
      rather than removed because the transcriptional response is real and a curator reading
      only the expression change would reasonably reach for this term.'
