- term:
    id: GO:0006091
    label: generation of precursor metabolites and energy
  evidence_type: TAS
  original_reference_id: PMID:10095105
  qualifier: involved_in
  review:
    action: REMOVE
    summary: The cited paper is a gene-structure report that performs no metabolic experiment,
      and the term is a direct-participation term for a protein with no catalytic activity.
    reason: 'PMID:10095105 is ''Organization of the gene for gelatin-binding protein (GBP28)'':
      it maps ADIPOQ to 3q27 by FISH and describes a 16 kb, three-exon gene lacking a TATA
      box. It contains no assay of energy metabolism. The projection test shows this reference
      carries exactly one annotation in all of GOA - this one - so it is not a bulk import
      that swept ADIPOQ up; it is a single unsupported TAS, assigned by PINC. Separately,
      GO:0006091 ''generation of precursor metabolites and energy'' describes the reactions
      themselves, and adiponectin is a hormone that modulates them in other cells rather than
      performing them. Mouse Adipoq carries no counterpart row, so nothing depends on this
      one.'
    propagation_review:
      root_cause: SOURCE_BAD
      failure_modes:
      - SOURCE_MISCITATION
      - ROLE_CONFLATION
      source_entities:
      - source_id: PMID:10095105
        comment: gene-structure paper; its only GOA annotation is this row
- term:
    id: GO:0070207
    label: protein homotrimerization
  evidence_type: IDA
  original_reference_id: PMID:8947845
  qualifier: involved_in
  review:
    action: NEW
    summary: Adiponectin's obligate assembly unit is a homotrimer, and GO has a term that
      states exactly this; nothing in the current record captures the stoichiometry.
    reason: The gene's whole signalling logic runs through assembly state - trimers activate
      AMPK in skeletal muscle, hexamers and HMW complexes activate NF-kB and are the only
      species T-cadherin binds - yet GOA records self-association only as GO:0042802 identical
      protein binding (IEA) and GO:0042803 protein homodimerization activity, the latter naming
      a stoichiometry adiponectin does not adopt. GO:0070207 is defined as 'the formation
      of a protein homotrimer, a macromolecular structure consisting of three noncovalently
      associated identical subunits', which matches UniProt's SUBUNIT description of a non-covalent
      collagen-domain triple helix precisely. PMID:8947845 characterised the human plasma
      protein and described this architecture directly.
    supported_by:
    - reference_id: PMID:8947845
      supporting_text: possessing a collagen-like domain through which they form homo-trimers,
        which further combine to make oligomeric complexes
    - reference_id: PMID:14522956
      supporting_text: substitution of Cys22 with alanine led exclusively to trimers
core_functions:
- description: Adipocyte-derived endocrine hormone. Adiponectin is secreted into plasma and
    acts on distant tissues through the seven-transmembrane receptors AdipoR1 and AdipoR2
    and the GPI-anchored receptor T-cadherin, initiating the adiponectin-activated signalling
    pathway and, through AMPK and PPAR-alpha, raising fatty-acid oxidation and glucose uptake
    in muscle while suppressing hepatic gluconeogenesis.
  molecular_function:
    id: GO:0005179
    label: hormone activity
  directly_involved_in:
  - id: GO:0033211
    label: adiponectin-activated signaling pathway
  - id: GO:0038002
    label: endocrine signaling
  - id: GO:0042593
    label: glucose homeostasis
  - id: GO:0045721
    label: negative regulation of gluconeogenesis
  - id: GO:0046326
    label: positive regulation of D-glucose import across plasma membrane
  - id: GO:0045923
    label: positive regulation of fatty acid metabolic process
  locations:
  - id: GO:0005576
    label: extracellular region
  supported_by:
  - reference_id: PMID:12368907
    supporting_text: stimulation of glucose utilization and fatty-acid oxidation by Ad occurs
      through activation of AMPK
  - reference_id: PMID:12802337
    supporting_text: they serve as receptors for globular and full-length adiponectin
- description: Growth-factor sequestration. Adiponectin binds PDGF-BB directly and selectively
    - it does not bind PDGF-AA - preventing the ligand from engaging its receptor on vascular
    smooth muscle cells and thereby suppressing PDGF beta-receptor autophosphorylation, ERK1/2
    activation, proliferation and migration. This is the one adiponectin activity with a directly
    measured, ligand-level molecular mechanism in human cells.
  molecular_function:
    id: GO:0019838
    label: growth factor binding
  directly_involved_in:
  - id: GO:0010642
    label: negative regulation of platelet-derived growth factor receptor signaling pathway
  locations:
  - id: GO:0005576
    label: extracellular region
  supported_by:
  - reference_id: PMID:12070119
    supporting_text: Adiponectin specifically bound to (125)I-PDGF-BB and significantly inhibited
      the association of (125)I-PDGF-BB with HASMCs
- description: 'Homomultimer assembly. Three adiponectin chains associate through a triple
    helix of their collagen-like domains and hydrophobic contacts in the globular C1q heads
    to form the obligate trimer; trimers then join through interchain disulfide bonds into
    hexamers and 12- to 18-mer high-molecular-weight complexes. The assembly state is functionally
    decisive - trimers activate AMPK in muscle, hexamers and HMW species activate NF-kB and
    are the only forms that bind T-cadherin - so self-association is part of the gene''s function
    rather than incidental. GO:0042802 is a deliberately unspecific term, and it is used here
    because it is the most specific CORRECT molecular function available: GO:0042803 protein
    homodimerization activity names a stoichiometry adiponectin does not adopt, and GO:0070207
    protein homotrimerization - the term that does state it - exists only in the biological
    process branch. A search of the ontology returns no molecular function term for homotrimerisation
    or homooligomerisation, so the imprecision is the ontology''s, not the annotation''s.'
  molecular_function:
    id: GO:0042802
    label: identical protein binding
  directly_involved_in:
  - id: GO:0070207
    label: protein homotrimerization
  locations:
  - id: GO:0005576
    label: extracellular region
  supported_by:
  - reference_id: PMID:8947845
    supporting_text: possessing a collagen-like domain through which they form homo-trimers,
      which further combine to make oligomeric complexes
  - reference_id: PMID:14522956
    supporting_text: Thus, trimeric and HMW/hexameric Acrp30 activate different signal transduction
      pathways
proposed_new_terms:
- proposed_name: regulation of glomerular permeability to albumin
  proposed_definition: Any process that modulates the rate, frequency or extent at which albumin
    crosses the glomerular filtration barrier from blood into the urinary space.
  proposed_parent:
    id: GO:0003093
    label: regulation of glomerular filtration
  justification: 'GO can currently express changes in urinary albumin only as renal albumin
    ABSORPTION (GO:0097018 and its regulation terms GO:2000532-2000534), which sits under
    GO:0097017 renal protein absorption - uptake from the nephron lumen. That is a different
    process from permselectivity of the glomerular filtration barrier, and the mismatch has
    produced a real mis-annotation: PMID:18431508 shows adiponectin acting through AMPK to
    reduce podocyte permeability to albumin, with no measurement of tubular reabsorption anywhere
    in the paper, yet both human ADIPOQ and mouse Adipoq carry GO:2000534 positive regulation
    of renal albumin absorption. Podocyte-barrier biology is a large and active field (nephrin,
    podocin, slit diaphragm) that has no adequate GO process term for its central readout.'
  supported_by:
  - reference_id: PMID:18431508
    supporting_text: both adiponectin and AMPK activation reduced podocyte permeability to
      albumin and podocyte dysfunction
- proposed_name: regulation of sympathetic nervous system activity
  proposed_definition: Any process that modulates the frequency, rate or extent of efferent
    signalling by the sympathetic division of the autonomic nervous system to its target organs.
  proposed_parent:
    id: GO:0044057
    label: regulation of system process
  justification: Searching GO for 'sympathetic' returns only developmental terms (GO:0048485
    sympathetic nervous system development, GO:0061549, GO:0097490, GO:0097491, GO:0097492,
    GO:1903045) and for 'autonomic' only GO:0048483 and GO:1901166. There is no term for modulating
    sympathetic outflow, which is a standard, directly measurable physiological readout. In
    its absence, PMID:17327472's measurement of reduced renal sympathetic nerve activity was
    annotated to GO:0050805 negative regulation of synaptic transmission, a term about communication
    across an individual synapse, which the study did not assay.
  supported_by:
  - reference_id: PMID:17327472
    supporting_text: Both iv and LCV injections of adiponectin induced dose-dependent suppressions
      of RSNA and b/p
suggested_questions:
- question: GOA and MGI both attach GO:0120162 (positive) and GO:0120163 (negative) regulation
    of cold-induced thermogenesis to BOTH PMID:24531262 and PMID:26166748 - a full 2x2 cross-product
    in which each paper supports only one direction. Mouse Adipoq carries four IMP rows over
    the same two references and human ADIPOQ four ISS/IEA rows derived from them. Can MGI
    reduce this to one correctly-cited row per direction, after which the human ISS and Compara
    rows will follow?
- question: 'GO records no interaction between adiponectin and T-cadherin (CDH13, P55290)
    on either gene: CDH13 has 60 annotations and none names Q15848 in WITH/FROM, and ADIPOQ''s
    61 GO:0005515 partners do not include it. T-cadherin is the established receptor for hexameric
    and HMW adiponectin (PMID:15210937) and mediates the M2-macrophage recruitment in PMID:26166748.
    AdipoR2 (Q86V24) is likewise absent from both records while AdipoR1 has a reciprocal pair.
    Should the two missing receptors be curated?'
- question: GO:0045296 cadherin binding is defined as 'binding to cadherin, a type I membrane
    protein involved in cell adhesion'. T-cadherin is GPI-anchored, not a type I membrane
    protein, so the definition as written excludes the one cadherin that is a hormone receptor.
    Should the definition be broadened to the cadherin superfamily by domain content rather
    than by membrane topology?
- question: GO:0033691 sialic acid binding on ADIPOQ (IDA, PMID:19855092) records that adiponectin
    IS sialylated, not that it binds sialic acid; the same reference is used correctly by
    UniProt as CARBOHYD features. Mouse Adipoq has acquired the term by IEA and ISO from this
    human row, so it is the sole origin. Can it be retracted in both species?
- question: 'Adiponectin''s activity is multimer-dependent in a way GO cannot currently express:
    trimers activate AMPK but not NF-kB, hexamers and HMW complexes do the reverse and alone
    bind T-cadherin, and HMW but not LMW induces MCP-1 and IL-8. Several annotations on this
    gene are isoform-specific in that sense while carrying no marker of it. Is there an annotation-extension
    convention for oligomeric state, analogous to the isoform field for splice variants?'
- question: UniProt's SUBUNIT states that LMW, MMW and HMW complexes bind HBEGF and that HMW
    binds FGF2, with distinct affinities, but tags the whole statement ECO:0000250|UniProtKB:Q60994
    (By similarity from mouse). The one human measurement, PMID:12070119, found no effect
    of adiponectin on HB-EGF binding to smooth muscle cells. Is there direct human evidence
    for HBEGF and FGF2 binding, or should the human entry be qualified?
suggested_experiments:
- description: Resolve the cold-thermogenesis contradiction by comparing the two knockout
    lines head to head. PMID:24531262 and PMID:26166748 used different Adipoq-null alleles,
    different cold protocols (acute 4 C challenge versus chronic intermittent exposure) and
    different depots (interscapular BAT versus subcutaneous WAT beiging). Run both protocols
    on both lines in one facility with matched housing temperature and diet, reading UCP1,
    core temperature and indirect calorimetry, and stratify by circulating HMW fraction.
  hypothesis: Adiponectin suppresses beta3-adrenergic BAT activation acutely while promoting
    chronic beiging of subcutaneous fat through T-cadherin on M2 macrophages, so the two results
    are depot- and timescale-specific rather than contradictory.
- description: Test directly whether adiponectin binds sialic acid, the claim GO:0033691 makes.
    Assay purified recombinant adiponectin against a sialylated glycan array and by surface
    plasmon resonance against free Neu5Ac and sialyllactose, with a Siglec ectodomain as positive
    control and desialylated adiponectin as an internal control.
  hypothesis: Adiponectin shows no measurable sialic acid binding; the annotation originates
    from a post-translational modification of adiponectin itself, and the array will be negative
    at all concentrations.
- description: Establish the human interactome of adiponectin with an assay compatible with
    its topology. Perform secretome-scale extracellular interaction screening (for example
    AVEXIS or an equivalent avidity-based assay using eukaryotically expressed, multimerised
    ectodomain baits) against a library of human cell-surface and secreted proteins, and confirm
    hits by surface plasmon resonance with size-fractionated trimer, hexamer and HMW adiponectin.
  hypothesis: None of the 59 unreplicated two-hybrid partners will reproduce, whereas AdipoR1,
    AdipoR2, T-cadherin, CD93 and PDGF-BB will, and several hits will be specific to the hexamer/HMW
    species.
- description: Separate ligand sequestration from receptor signalling in the vascular phenotype.
    Compare wild-type adiponectin with a C1q-domain point mutant that retains AdipoR binding
    but loses PDGF-BB binding (identified by alanine scanning guided by the 6U66 structure)
    for their ability to suppress PDGF-BB-driven proliferation and migration of human aortic
    smooth muscle cells.
  hypothesis: The anti-proliferative effect depends on direct PDGF-BB sequestration rather
    than on AdipoR signalling, so the separation-of-function mutant will lose the vascular
    effect while retaining AMPK activation.
- description: Determine whether the podocyte effect is filtration or reabsorption, which
    decides between GO:2000534 and the proposed glomerular permeability term. Combine micropuncture
    or FITC-albumin two-photon imaging of the glomerular filtration barrier with megalin/cubilin-dependent
    proximal tubule uptake assays in adiponectin-treated and untreated Adipoq-null mice.
  hypothesis: Adiponectin reduces trans-barrier albumin flux with no change in tubular reabsorptive
    capacity, confirming that the existing absorption term names the wrong process.
knowledge_gaps:
- gap_statement: No structure of adiponectin bound to any of its three receptors exists. The
    three deposited structures (4DOU, 6U66, 6U6N) all cover only the globular C1q domain,
    residues 104-244, so neither the collagen-like domain nor any receptor complex has been
    resolved, and the structural basis of multimer-selective T-cadherin binding is unknown.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  boundary: The globular C1q domain fold is solved to 0.99 A (PDB 6U66, residues 107-244),
    the trimer/hexamer/HMW ladder and its disulfide dependence are established, and the three
    receptors are identified.
  significance: Multimer-selective receptor engagement is the central unexplained feature
    of adiponectin biology and the main obstacle to designing receptor-selective agonists.
  provenance:
  - reference_id: file:human/ADIPOQ/ADIPOQ-uniprot.txt
    supporting_text: DR   PDB; 6U66; X-ray; 0.99 A; A/B/C=107-244.
- gap_statement: Whether the globular fragment of adiponectin, which is far more potent than
    the full-length protein in many assays, is actually generated in vivo in humans remains
    unresolved. It can be released from full-length adiponectin by neutrophil elastase in
    vitro, but whether it circulates at meaningful concentrations is disputed, and much of
    the receptor literature uses it as a surrogate.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  boundary: Neutrophil elastase can release the globular fragment from full-length adiponectin
    in vitro, and the fragment binds AdipoR1/AdipoR2 and activates AMPK; what is unresolved
    is whether it exists in human circulation at functionally relevant levels.
  significance: A large fraction of the functional literature, and therefore of this gene's
    GO record, rests on globular adiponectin whose physiological existence is uncertain.
  provenance:
  - reference_id: PMID:18431508
    supporting_text: although it remains controversial whether the globular fragment of adiponectin
      is generated in situ or circulates in vivo
- gap_statement: The sign of adiponectin's effect on inflammation is unresolved and appears
    to depend on multimer state and target-cell polarisation. HMW adiponectin induces MCP-1
    and IL-8 in peripheral blood mononuclear cells and microvascular endothelium while LMW
    does not, and hexamer/HMW species activate NF-kB in myocytes, yet adiponectin suppresses
    TNF-induced NF-kB in endothelium. GOA carries both directions with no marker of the conditions
    that distinguish them.
  gap_kind:
  - BIOLOGY
  - ONTOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  boundary: The multimer species are separable and individually assayable, and their divergent
    effects on AMPK, NF-kB and T-cadherin binding are reproducible; what is missing is a rule
    predicting the sign in a given cell type, and any way to record multimer state in a GO
    annotation.
  significance: Both GO:0043123 and GO:0043124, and both GO:0050728 and the chemokine-induction
    rows, are simultaneously annotated; without a convention for recording multimer state
    the record cannot express what is actually known.
  provenance:
  - reference_id: PMID:19524870
    supporting_text: LMW adiponectin at the same concentrations did not induce chemokine production
      in any of the cell types tested
