      acting through AMPK reduces podocyte PERMEABILITY to albumin. The full text contains
      no measurement of tubular reabsorption; the words absorption, reabsorption and tubular
      do not appear in the extracted text at all. So adiponectin restores the glomerular filtration
      barrier - less albumin crosses it - rather than increasing uptake downstream. GO has
      no term for regulation of glomerular permeability to albumin, which is very likely why
