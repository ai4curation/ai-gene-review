    summary: The paper measures podocyte permeability to albumin, not renal albumin absorption;
      the term names the wrong process.
    reason: 'GO:2000534 sits under GO:0097017 renal protein absorption, defined as proteins
      ''taken up from the collecting ducts, glomerulus and proximal and distal loops of the
