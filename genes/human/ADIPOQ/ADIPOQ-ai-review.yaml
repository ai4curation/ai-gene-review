- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:25910212
  qualifier: enables
  supporting_entities:
  - UniProtKB:O43765
  review:
    action: MARK_AS_OVER_ANNOTATED
    summary: Unreplicated interactome-screen hit (SGTA (O43765)); no orthogonal evidence and
      no plausible compartment in which secreted adiponectin could meet it.
    reason: 'This row comes from a systematic binary-interactome screen, not from a hypothesis-led
      experiment on adiponectin. IntAct records 286 interactions for Q15848 across only 7
      publications, of which 171 are from the single HuRI dataset (PMID:32296183) and 196
      are two-hybrid, logged under five sub-method names (two hybrid array, validated two
      hybrid, two hybrid prey pooling approach, two hybrid pooling, two hybrid bait and prey
      pooling approach) - which is why UniProt shows NbExp=3 on nearly every partner even
      though there is one experiment. 240 of 264 IntAct partners appear in exactly one publication,
      and no orthogonal biophysical assay (SPR, ITC, co-immunoprecipitation of endogenous
      protein) supports any of them. Adiponectin is synthesised with a cleaved signal peptide
      (SIGNAL 1..18) and its mature chain is secreted; two-hybrid requires both partners to
      reconstitute a transcription factor in the yeast nucleus, a compartment the native protein
      never enters. Its assembly into disulfide-linked hexamers and HMW multimers, and the
      hydroxylation/glycosylation those multimers depend on, also cannot occur in that assay.
      This partner (SGTA) is the only one recorded in more than two of the seven IntAct publications,
      appearing in PMID:25910212, PMID:31515488 and PMID:32296183 - but all three are two-hybrid
      interactome datasets from the same methodological lineage, so the repetition is the
      same assay run again rather than orthogonal validation. SGTA is a cytosolic co-chaperone
      for mislocalised tail-anchored proteins, a well-known source of promiscuous hits. Marked
      as over-annotated rather than removed: an unreplicated screen hit is unmeasured, not
      refuted, and a bare protein binding term carries no functional information either way.'
    supported_by:
    - reference_id: file:human/ADIPOQ/ADIPOQ-bioinformatics/RESULTS.md
      supporting_text: There is **no orthogonal biophysical assay** anywhere in the set
