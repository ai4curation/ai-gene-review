gene_symbol: ADIPOQ
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'Adiponectin is a 244-residue, adipocyte-specific secreted protein and one of
  the most abundant hormones in human plasma, circulating at roughly 5-30 ug/ml. After removal
  of an 18-residue signal peptide the mature chain comprises a short variable N-terminal segment,
  a collagen-like domain of 22 Gly-X-Y repeats (residues 42-107) and a C-terminal globular
  C1q domain (108-244), the architecture that places it in the C1q/TNF-related (CTRP) superfamily
  alongside the complement C1q chains. Three chains associate through a triple helix of their
  collagen-like domains and hydrophobic contacts within the globular heads to form the obligate
  trimer; trimers then join through interchain disulfide bonds into hexamers and 12- to 18-mer
  high-molecular-weight complexes. Extensive post-translational modification of the collagen
  domain - proline and lysine hydroxylation, glucosyl-galactosyl glycosylation of the hydroxylysines,
  and sialylation of O-linked glycans on N-terminal threonines - governs how much high-molecular-weight
  complex is assembled and secreted and how long the protein persists in blood.


  Oligomeric state determines which signal adiponectin delivers. Trimers preferentially activate
  AMP-activated protein kinase in skeletal muscle, whereas hexameric and high-molecular-weight
  species activate NF-kB and are the only forms that bind T-cadherin. Signalling runs through
  two seven-transmembrane receptors, AdipoR1 and AdipoR2, which are unrelated to G-protein-coupled
  receptors and recruit the adaptor APPL1, and through the GPI-anchored receptor T-cadherin.
  Downstream, AMPK and PPAR-alpha activation increase fatty-acid oxidation and glucose uptake
  in muscle and suppress gluconeogenic gene expression in liver, which is the basis of adiponectin''s
  insulin-sensitising and glucose-lowering action; infusion reduces endogenous glucose production
  by around two thirds.


  Beyond metabolism, adiponectin acts on the vessel wall and on myeloid cells. It binds PDGF-BB
  directly and sequesters it from its receptor, suppressing smooth-muscle proliferation and
  migration; it blocks TNF-induced NF-kB activation and adhesion-molecule expression in endothelium
  through a cAMP/PKA-dependent route; it lowers scavenger-receptor-mediated lipid uptake and
  raises ABCA1-dependent cholesterol efflux in macrophages; and it restrains myelomonocytic
  proliferation and phagocytosis. These effects are not uniformly anti-inflammatory - high-molecular-weight
  adiponectin induces MCP-1 and IL-8 in peripheral blood mononuclear cells and microvascular
  endothelium while the low-molecular-weight form does not - so the sign of the response depends
  on multimer state and on the target cell. Plasma adiponectin falls with visceral obesity
  and insulin resistance, and rare variants that impair high-molecular-weight assembly or
  secretion cause autosomal dominant adiponectin deficiency.'
