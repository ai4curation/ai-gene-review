      rather than removed because the phenotype (less urinary albumin) is real and the term
      is the closest existing fit. Note also that the evidence code is IDA on the human gene
      while the experiments are an adiponectin-knockout mouse plus cultured podocytes; MGI
      records the same finding as IMP on mouse Adipoq, which is the more accurate code.'
