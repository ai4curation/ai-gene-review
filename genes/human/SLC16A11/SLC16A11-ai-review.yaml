gene_symbol: SLC16A11
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  SLC16A11 (monocarboxylate transporter 11, MCT11) is a 447-residue, 12-transmembrane-helix
  member of the proton-linked monocarboxylate transporter family (SLC16, major facilitator
  superfamily). In heterologous human cells it mediates proton-coupled, bidirectional
  transport of pyruvate across the plasma membrane, placing it among the "category I"
  SLC16 carriers of simple monocarboxylates; its full substrate range is not defined,
  although mouse Mct11 supports lactate uptake in exhausted CD8+ T cells. Like MCT1-4,
  SLC16A11 associates with the ancillary glycoprotein basigin (BSG), which is required
  for efficient delivery to the cell surface; at steady state most overexpressed protein
  resides in the endoplasmic reticulum membrane, with a small fraction at the plasma
  membrane. It is expressed mainly in liver, salivary gland and thyroid. A common
  haplotype of Neanderthal origin that lowers hepatic SLC16A11 expression and weakens
  the BSG interaction is a major risk factor for type 2 diabetes in Mexican and other
  Latin American populations, and reducing SLC16A11 in human hepatocytes shifts fatty
  acid and triacylglycerol metabolism.
