- term:
    id: GO:0006629
    label: lipid metabolic process
  evidence_type: IDA
  original_reference_id: PMID:24390345
  qualifier: involved_in
  review:
    summary: >-
      Ectopic expression of SLC16A11 in HeLa cells (which do not normally express it)
      increased intracellular triacylglycerol and diacylglycerol and decreased
      lysophosphatidylcholine, cholesteryl ester and sphingomyelin; knockdown in primary
      human hepatocytes later raised acylcarnitines, DAG and TAG (PMID:28666119).
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The metabolomic observations are reproducible, but they are downstream consequences
      of altered monocarboxylate (e.g. pyruvate) flux. SLC16A11 is a plasma-membrane
      carrier and catalyses no step of lipid synthesis or breakdown, nor supplies a
      structure or cofactor that such a step depends on, so this is a necessity/phenotype
      observation rather than participation in lipid metabolic process. The authors
      themselves frame the link as a hypothesis. The row is not removed because the
      experiment is real and the curator read the full text, but it should not be
      transferred to orthologs as a function.
    supported_by:
    - reference_id: PMID:24390345
      supporting_text: Expression of SLC16A11 resulted in substantial increases in
        triacylglycerol (TAG) levels
    - reference_id: PMID:24390345
      supporting_text: these results suggest that SLC16A11 may play a role in hepatic
        lipid metabolism
    - reference_id: PMID:28666119
      supporting_text: Steady-state levels of intracellular acylcarnitines,
        diacylglycerols (DAGs), and triacylglycerols (TAGs) are significantly increased
        in human hepatocytes treated with siRNAs targeting SLC16A11 compared to
        negative-control siRNAs
