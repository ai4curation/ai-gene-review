  review:
    summary: >-
      In HEK293T cells expressing SLC16A11 and the pyruvate FRET sensor pyronic, pyruvate
      influx and efflux rates increased over vector controls; parallel BCECF measurements
      showed a ~40% increase in rates of acidification and alkalinization reciprocal to
      pyruvate influx and efflux, i.e. H+ co-transport.
    action: MODIFY
    reason: >-
      The term is correct, and is the core activity, but the same paper shows that the
      transport is proton-coupled, which GO captures as GO:0005477 pyruvate secondary
      active transmembrane transporter activity (is_a GO:0050833 and is_a GO:0015355
