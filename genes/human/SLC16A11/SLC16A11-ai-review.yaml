core_functions:
- description: >-
    Proton-coupled, bidirectional transmembrane transport of pyruvate (and probably other
    simple monocarboxylates) across the plasma membrane, with cell-surface delivery
    dependent on association with basigin. Pyruvate/H+ transport is established
    experimentally for the human protein; lactate as a substrate is inferred from mouse
    Mct11 and from family membership.
  molecular_function:
    id: GO:0005477
    label: pyruvate secondary active transmembrane transporter activity
  directly_involved_in:
  - id: GO:1901475
    label: pyruvate transmembrane transport
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:28666119
    supporting_text: Following addition and withdrawal of pyruvate, we observed a ~40%
      increase in the rates of acidification and alkalization, with both phases reciprocal
      to influx and efflux of pyruvate.
  - reference_id: PMID:28666119
    supporting_text: We found that BSG knockout significantly reduces localization of
      SLC16A11REF to the plasma membrane by ~80% (Figure 5G).
suggested_questions:
- question: What is the physiological substrate repertoire of human SLC16A11 (pyruvate,
    L-lactate, ketone bodies, short-chain fatty acids), and which substrate links reduced
    hepatic SLC16A11 to the lipid changes associated with type 2 diabetes?
- question: Does the large ER-resident pool of SLC16A11 have any function of its own, or
    does it simply reflect limiting basigin/embigin availability for export?
- question: Should GO capture the dependence of category I MCTs on basigin for surface
    delivery with something more informative than protein binding (e.g. on the BSG side)?
suggested_experiments:
- description: Measure uptake of radiolabelled L-lactate, pyruvate, beta-hydroxybutyrate
    and acetate in Xenopus oocytes co-expressing human SLC16A11 and BSG, with kinetic
    parameters and pH dependence, to define substrate specificity independent of
    endogenous MCTs.
- description: Endogenous-level localization of SLC16A11 in primary human hepatocytes
    (tagged knock-in or validated antibody) to test whether the ER-predominant distribution
    seen on overexpression holds for native protein.
