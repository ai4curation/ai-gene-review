- id: PMID:20805893
  title: 'LRCH proteins: a novel family of cytoskeletal regulators.'
  findings:
  - statement: >-
      Expressed human LRCH3 accumulates at the cleavage furrow from anaphase in HeLa
      cells, providing direct human localization evidence in a mitotic context.
    supporting_text: >-
      Similarly, we found that hLRCH3 accumulates at the cleavage furrow from anaphase
      onset (Figure S6C), albeit without significant cortical accumulation being
      observed at previous stages of mitosis.
    reference_section_type: DISCUSSION
  - statement: >-
      Four human LRCH paralogs share the LRR-plus-CH architecture, but the paper's
      loss-of-function mechanism was established for the single Drosophila LRCH gene.
    supporting_text: >-
      In human, only four highly-related proteins (hLRCH1-4) simultaneously harbor
      these two motifs.
    reference_section_type: RESULTS
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed metadata and the full cached article were checked. The paper directly
      shows expressed human LRCH3 at the HeLa cleavage furrow. Its cortical-stability,
      spindle-positioning, fertility, and stress phenotypes derive from Drosophila
      dLRCH and must not be assigned to human LRCH3; the type-3 CH-domain discussion
      also does not demonstrate direct actin binding by human LRCH3.
core_functions:
- description: >-
    LRCH3 acts as a protein-macromolecule adaptor in the experimentally defined DISP
    module: distinct LRCH3 regions engage the DHR-2 region of DOCK7 and the
    cargo-binding tail of MYO6, linking these proteins in a co-immunoprecipitation-
    supported MYO6-LRCH3-DOCK7 trimeric DISP complex during remodeling of the septin
    cytoskeleton. In cultured human RPE and HEK293T systems, the LRCH3
    calponin-homology region recruits SEPT7, and LRCH3 with DOCK7 DHR-2 strongly
    promotes cytosolic septin-ring formation. The complex evidence supports its
    composition in these systems, while endogenous stoichiometry and tissue
    generality remain unresolved. Septins were absent from LRCH3 immunoprecipitates,
    so their association is modeled as functional relocation rather than DISP complex
    membership; LRCH3 is not thereby established as a direct actin-binding protein.
  supported_by:
  - reference_id: PMID:29467281
    supporting_text: >-
      The observations that MYO6 and LRCH3 both bound to the same site on DOCK7,
      but MYO6 and DOCK7 bound distinct sites on LRCH3 imply that LRCH3 is the
      linker between MYO6 and DOCK7.
  - reference_id: PMID:29467281
    supporting_text: >-
      Co‐expression of MitoGBD with GFP alone, full‐length GFP‐LRCH3 or GFP‐tagged
      domain fragments of LRCH3 in RPE cells caused all to relocalise to the
      mitochondria; however, only relocalisation of full‐length LRCH3 or a fragment
      containing its calponin homology domain triggered the concomitant recruitment,
      and oligomerisation, of SEPT7, from its steady state localisation along actin
      filaments to mitochondria (Figs 6A and EV5C).
  molecular_function:
    id: GO:0030674
    label: protein-macromolecule adaptor activity
  directly_involved_in:
  - id: GO:0032185
    label: septin cytoskeleton organization
  locations:
  - id: GO:0005829
    label: cytosol
  in_complex:
    id: GO:0032991
    label: protein-containing complex
knowledge_gaps:
- gap_statement: >-
    The abundance, dynamics, and cellular contexts of endogenous LRCH3 association
    with MYO6 and DOCK7 have not been established, and it is unknown whether all
    three proteins occupy one module simultaneously in unmodified human cells.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: >-
    Endogenous measurements are needed to establish when the mapped adaptor topology
    operates and to avoid treating an expressed-cell module as a constitutive stable
    complex in every tissue.
  provenance:
  - reference_id: PMID:29467281
    supporting_text: >-
      The observations that MYO6 and LRCH3 both bound to the same site on DOCK7,
      but MYO6 and DOCK7 bound distinct sites on LRCH3 imply that LRCH3 is the
      linker between MYO6 and DOCK7.
- gap_statement: >-
    The molecular relationship between LRCH3 and septins remains unresolved because
    septins were not recovered in LRCH3 immunoprecipitates despite proximity and
    calponin-homology-region-dependent relocalization evidence.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: >-
    Determining whether LRCH3 contacts a septin directly or recruits it through an
    intermediate is necessary to define the immediate activity that drives septin
    displacement and oligomerization.
  provenance:
  - reference_id: PMID:29467281
    supporting_text: >-
      As we were unable to observe septins in LRCH3 IPs (the same IP was positive
      for MYO6 and DOCK7; compare Figs 5C and EV5B), we verified this interaction
      using a knock sideways approach that targeted GFP‐LRCH3 to mitochondria using
      a GFP binding domain fused to a mitochondria‐targeting sequence (MitoGBD).
- gap_statement: >-
    It is unknown whether LRCH3 changes DOCK7 guanine-nucleotide exchange activity,
    substrate choice, or spatial signaling toward RAC1 and CDC42 during septin
    remodeling.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: >-
    The current evidence links LRCH3 to the catalytic DHR-2 region and a cellular
    phenotype but does not establish whether LRCH3 regulates catalysis or uses the
    domain only as a recruitment site.
- gap_statement: >-
    Direct binding of LRCH3 to F-actin has not been demonstrated, and the actin
    structure or subcellular site at which endogenous septin remodeling occurs is
    not defined.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: >-
    This distinction is needed to separate a direct cytoskeletal-binding activity
    from an indirect adaptor role operating near actin-associated septins.
- gap_statement: >-
    The expression, localization, and partner specificity of the four LRCH3 splice
    isoforms have not been compared in endogenous human tissues.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    Isoform-resolved evidence would determine whether the DISP-module observations
    apply broadly or to a restricted LRCH3 product and cellular context.
proposed_new_terms:
- proposed_name: DOCK7-induced septin displacement complex
  proposed_definition: >-
    A protein-containing complex, also known as the DISP complex, composed of MYO6,
    LRCH3, and DOCK7 that links the MYO6 cargo-binding tail to the DOCK7 DHR-2 region
    through distinct binding sites on LRCH3 and participates in remodeling the septin
    cytoskeleton.
  justification: >-
    The named DOCK7-induced septin displacement (DISP) complex has mapped trimeric
    topology supported by proximity labeling, co-immunoprecipitation, domain mapping,
    and direct LRCH3-MYO6 two-hybrid evidence, but GO has no specific cellular-
    component term for it. A specific term would distinguish the MYO6-LRCH3-DOCK7
    complex from generic protein-containing complexes and from septins, which were
    not recovered in LRCH3 immunoprecipitates and are not proposed as subunits.
  proposed_parent:
    id: GO:0032991
    label: protein-containing complex
  supported_by:
  - reference_id: PMID:29467281
    supporting_text: >-
      We next confirmed the interactions between MYO6, LRCH3 and DOCK7 and mapped
      the topology of the complex by performing pull‐down experiments using
      full‐length and functional domain fragments of LRCH3 and DOCK7.
  - reference_id: PMID:29467281
    supporting_text: >-
      The observations that MYO6 and LRCH3 both bound to the same site on DOCK7,
      but MYO6 and DOCK7 bound distinct sites on LRCH3 imply that LRCH3 is the
      linker between MYO6 and DOCK7.
suggested_questions:
- question: >-
    Do endogenous LRCH3, DOCK7, and MYO6 occupy one transient module in human cells,
    and what signal controls its assembly or disassembly?
  experts:
  - Cytoskeletal trafficking experts
  - Endogenous interactomics experts
- question: >-
    Does LRCH3 regulate DOCK7 exchange activity toward RAC1 or CDC42, or does the
    DHR-2 interaction serve only to position the GEF?
  experts:
  - DOCK-family signaling experts
  - Rho GTPase experts
- question: >-
    Does the LRCH3 calponin-homology region contact a septin or F-actin directly,
    and which molecular interface produces septin displacement?
  experts:
  - Septin experts
  - Actin cytoskeleton experts
- question: >-
    Are the four endogenous LRCH3 isoforms differentially expressed or specialized
    for MYO6, DOCK7, septin, or cleavage-furrow localization?
  experts:
  - Isoform biology experts
  - Cell-division experts
suggested_experiments:
- hypothesis: >-
    Endogenous LRCH3 transiently bridges MYO6 and DOCK7 during localized septin
    remodeling rather than forming a constitutive complex.
  description: >-
    Introduce endogenous fluorescent and affinity tags into all three genes in a
    human cell type expressing LRCH3, then combine time-resolved proximity labeling,
    reciprocal native immunoprecipitation, and single-molecule imaging before and
    during septin reorganization. Use interface-selective LRCH3 mutants to test
    whether simultaneous partner engagement is required.
  experiment_type: endogenous interaction dynamics
- hypothesis: >-
    LRCH3 binding to the DOCK7 DHR-2 region changes localized RAC1 or CDC42 exchange
    activity during septin-ring formation.
  description: >-
    Reconstitute DOCK7 nucleotide exchange with purified LRCH3 domains and RAC1 or
    CDC42, then measure localized GTPase activity with biosensors in LRCH3-null human
    cells rescued by wild-type, DOCK7-binding-deficient, or MYO6-binding-deficient
    LRCH3 at endogenous expression levels.
  experiment_type: biochemistry and live-cell signaling
- hypothesis: >-
    The LRCH3 calponin-homology region recruits septins through a specific protein
    interface rather than through direct F-actin binding.
  description: >-
    Compare purified LRCH3 calponin-homology region binding to reconstituted septin
    oligomers and F-actin, map any direct interface, and test separation-of-function
    mutants in endogenous rescue assays that quantify septin displacement, ring
    formation, and actin organization.
  experiment_type: cytoskeletal reconstitution
- hypothesis: >-
    LRCH3 isoforms differ in tissue expression or DISP-module activity.
  description: >-
    Use long-read RNA sequencing and isoform-specific proteomics across human tissue
    and cell panels, followed by isoform-specific rescue in an LRCH3-null background
    to compare partner association, cytosolic and cleavage-furrow localization, and
    septin-remodeling phenotypes.
  experiment_type: isoform-resolved functional genomics
