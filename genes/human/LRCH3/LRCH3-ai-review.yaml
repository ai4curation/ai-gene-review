id: Q96II8
gene_symbol: LRCH3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  LRCH3 is a cytosolic leucine-rich-repeat and calponin-homology-domain protein
  that organizes a DOCK7-induced septin displacement module in cultured human
  cells. Its leucine-rich repeats associate with the DHR-2 region of the RAC1/CDC42
  guanine-nucleotide exchange factor DOCK7, while an intervening LRCH3 region binds
  directly to the cargo-binding tail of the actin motor MYO6, allowing LRCH3 to link
  the two proteins. The LRCH3 calponin-homology region recruits and oligomerizes
  SEPT7 in a relocalization assay, and LRCH3 expression displaces septins from actin
  filaments and promotes cytosolic septin-ring structures, especially with the DOCK7
  DHR-2 region. Co-immunoprecipitation, interaction mapping, and two-hybrid evidence
  support a MYO6-LRCH3-DOCK7 trimeric DISP complex in the tested cell systems;
  endogenous stoichiometry and tissue generality remain unresolved. Septins were not
  recovered in LRCH3 immunoprecipitates, so their relationship to DISP is functional
  relocation rather than established complex membership, and direct LRCH3-actin
  binding has not been demonstrated. Expressed LRCH3 also accumulates at the cleavage
  furrow from anaphase in HeLa cells. Four splice isoforms are described, without
  evidence for endogenous functional specialization.
