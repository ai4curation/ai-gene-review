- id: PMID:29467281
  title: The MYO6 interactome reveals adaptor complexes coordinating early endosome
    and cytoskeletal dynamics.
  findings:
  - statement: >-
      LRCH3 links MYO6 and DOCK7 through distinct regions: its LRR region associates
      with DOCK7, whereas residues 383-648 bind MYO6.
    supporting_text: >-
      These experiments showed both MYO6 and DOCK7 can bind to LRCH3; DOCK7 binds
      to its leucine‐rich repeats and MYO6 to a region between amino acids 383–648
      (Fig 5C).
    reference_section_type: RESULTS
  - statement: >-
      Mammalian two-hybrid experiments support a direct LRCH3-MYO6 interaction and
      map the LRCH3-binding requirement to both MYO6 cargo-binding motifs.
    supporting_text: >-
      Indeed, our M2H assay confirmed that LRCH3 interacts directly with MYO6; the
      binding site again mapped to amino acids 363–648 and required both the WWY and
      RRL motif in the MYO6 CBD, corroborating our earlier SILAC experiments (Figs
      1E and 5D).
    reference_section_type: RESULTS
  - statement: >-
      The LRCH3 calponin-homology region is sufficient in the knock-sideways assay
      to recruit and oligomerize SEPT7 away from its actin-associated distribution.
    supporting_text: >-
      Co‐expression of MitoGBD with GFP alone, full‐length GFP‐LRCH3 or GFP‐tagged
      domain fragments of LRCH3 in RPE cells caused all to relocalise to the
      mitochondria; however, only relocalisation of full‐length LRCH3 or a fragment
      containing its calponin homology domain triggered the concomitant recruitment,
      and oligomerisation, of SEPT7, from its steady state localisation along actin
      filaments to mitochondria (Figs 6A and EV5C).
    reference_section_type: RESULTS
  - statement: >-
      Coexpression of LRCH3 with the DOCK7 DHR2 region strongly increased septin
      ring formation, supporting a cellular role in septin cytoskeleton remodeling.
    supporting_text: >-
      Strikingly however, the co‐expression of LRCH3 and the DOCK7 DHR2 domain,
      which contains the LRCH3 and MYO6 binding sites as well as the RAC1/CDC42 GEF
      activity of DOCK7, caused a very dramatic increase in the number of cells
      (~80%) containing septin ring structures (Fig 6D).
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed metadata and the full cached article were checked. This is the decisive
      mechanistic LRCH3 study: BioID, pull-downs, mammalian two-hybrid assays,
      domain mapping, relocalization, and cell imaging support the MYO6-LRCH3-DOCK7
      DISP model and septin remodeling. Most experiments use expressed constructs in
      RPE or HEK293T cells, so the evidence does not prove a constitutive complex in
      every tissue or license transfer of LRCH1, LRCH2, or LRCH4 functions.
