id: Q15165
gene_symbol: PON2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'PON2 is a membrane-associated intracellular paraoxonase-family lactonase/arylesterase. It
  hydrolyzes aromatic esters and N-acyl-homoserine lactones, with particularly strong activity toward
  bacterial quorum-sensing lactones, and has cell-associated antioxidant activity that limits oxidative
  stress and LDL lipid oxidation; unlike PON1 and PON3 it is not primarily a secreted HDL particle enzyme.'
