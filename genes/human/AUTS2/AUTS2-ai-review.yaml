  id: NCBITaxon:9606
  label: Homo sapiens
description: AUTS2 is a nonenzymatic regulator of transcription and neuronal cytoskeletal organization. In the nucleus, it participates in noncanonical PRC1 complexes containing PCGF3 or PCGF5 and recruits the histone acetyltransferase EP300/P300 and casein kinase II. P300 recruitment promotes transcriptional activation, while recruited CK2 can inhibit RING1B-dependent histone H2A ubiquitination. The AUTS2 HX-repeat region contributes to P300 association. Mouse studies also support cytoplasmic roles in Rac1/Cdc42 signaling, actin organization, neuronal migration and neurite extension. Its nuclear and cytoplasmic activities depend on cellular context and protein form.
