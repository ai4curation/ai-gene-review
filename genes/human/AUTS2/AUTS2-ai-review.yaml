    label: transcription coactivator activity
suggested_questions:
- question: How do the sequence-verified natural human AUTS2 products differ in P300 recruitment, PRC1 composition and cytoplasmic function, given that long/short labels and engineered fragments do not uniquely map to the four UniProt products?
- question: Which AUTS2-PCGF5 and AUTS2-RNF2 experiment records in the Polycomb and BioPlex interaction datasets support the four unresolved source-specific annotations?
- question: How does AUTS2 regulate Rac1/Cdc42 signaling in human neurons, and which interacting exchange factors or other proteins perform the nucleotide-exchange step?
- question: Which DNA-binding partners recruit AUTS2-containing PRC1 in human neuronal cell types with low NRF1 expression?
suggested_experiments:
- description: Compare sequence-verified natural human products at matched expression in neuronal cells using endogenous P300 and PRC1 co-immunoprecipitation, chromatin occupancy and nascent transcription. Measure recruited enzyme activity separately from AUTS2 interaction and recruitment.
- description: Use endogenous depletion and rescue with interaction-selective AUTS2 variants to separate P300-dependent nuclear transcription from Rac1/Cdc42-dependent cytoplasmic morphology, with matched localization and protein-abundance controls.
