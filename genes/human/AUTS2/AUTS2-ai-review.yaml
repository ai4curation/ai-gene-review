core_functions:
- description: Contributes to transcription coactivation in noncanonical PRC1 complexes by binding and recruiting EP300/P300. Human AUTS2 tethered to a reporter promotes RNA polymerase II transcription in a P300- and PRC1-dependent manner. In mouse brain and derived motor neurons, NRF1 associates with AUTS2-containing PRC1 and directs its occupancy at a subset of active genes. AUTS2 supplies recruitment; P300 and CK2 supply the associated acetyltransferase and kinase activities.
  molecular_function:
    id: GO:0035035
    label: histone acetyltransferase binding
  directly_involved_in:
  - id: GO:0045944
    label: positive regulation of transcription by RNA polymerase II
  locations:
