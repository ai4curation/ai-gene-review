    reason: SMDT1/EMRE genuinely participates in calcium import into mitochondria, but PMID:22925203
      is a mouse Pde8b behavioral paper and cannot support this human SMDT1 annotation. The claim is
      kept because PMID:24231807 and PMID:27099988 provide direct EMRE loss-of-function and
      rescue/mechanistic evidence for mitochondrial Ca2+ uptake.
    supported_by:
    - reference_id: PMID:24231807
      supporting_text: In its absence, uniporter channel activity was lost despite intact MCU
        expression and oligomerization
    - reference_id: PMID:27099988
      supporting_text: EMRE supports Ca2+ transport by using its TMH to bind to MCU through its
        first TMH
    source_defects:
    - defect_type: WRONG_REFERENCE
      resource: UNIPROT
      slot: DB:Reference
      requested_change: DELETE_ROW
      asserted_value: PMID:22925203
      confidence: CONFIRMED
      explanation: The UniProt GOA row for human SMDT1/EMRE calcium import cites PMID:22925203. That
        PMID is Tsai et al. 2012 on mouse Pde8b in memory, motor performance, and aging, and is
        unrelated to SMDT1/EMRE or mitochondrial calcium import. No likely intended replacement PMID
        could be identified for this row; delete the row or repoint it if UniProt can identify the
        intended SMDT1 source.
      supported_by:
      - reference_id: PMID:22925203
        supporting_text: Inactivation of Pde8b enhances memory, motor performance
