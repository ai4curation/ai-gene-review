    id: GO:0051560
    label: mitochondrial calcium ion homeostasis
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - FB:FBgn0062440
  - PANTHER:PTN002141638
  - UniProtKB:Q9H4I9
  - WB:WBGene00008980
  review:
    summary: SMDT1/EMRE contributes to mitochondrial calcium ion homeostasis.
    action: ACCEPT
    reason: By enabling MCU pore opening and keeping the MICU gatekeepers associated with the pore,
      EMRE does core structural work that determines mitochondrial Ca2+ import and prevents ungated
      calcium leakage. The homeostasis process is broader than import but still captures a direct
      function of this regulatory pore subunit.
    supported_by:
    - reference_id: PMID:27099988
      supporting_text: This dual functionality of EMRE ensures that all transport-competent
        uniporters are tightly regulated
    - reference_id: PMID:27642048
      supporting_text: constitutively active MCU-EMRE channels lacking gatekeeper subunits
