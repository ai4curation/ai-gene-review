id: Q9H4I9
gene_symbol: SMDT1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SMDT1, also known as EMRE, encodes a small metazoan single-pass mitochondrial inner
  membrane subunit of the mitochondrial calcium uniporter complex. Mature EMRE binds MCU through its
  transmembrane helix to keep the pore in a calcium-conducting state and uses its
  intermembrane-space acidic tail to retain MICU gatekeeper subunits at the pore, coupling matrix
  calcium import to calcium-dependent gating.
existing_annotations:
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:27099988
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q8NE86
  review:
    summary: Refine generic MCU binding to EMRE channel-activator and adaptor activities.
    action: MODIFY
    reason: 'The PMID:27099988 evidence demonstrates the specific mechanism behind the MCU IPI row: EMRE
      binds MCU through transmembrane helices to support calcium permeation, and also uses its intermembrane-space
      poly-Asp tail to retain MICU1 at the pore. GO:0099103 captures the MCU pore-opening activity and
      GO:0030674 captures the bridging activity; bare protein binding should not be retained.'
    proposed_replacement_terms:
    - id: GO:0099103
      label: channel activator activity
    - id: GO:0030674
      label: protein-macromolecule adaptor activity
    supported_by:
    - reference_id: PMID:27099988
      supporting_text: EMRE supports Ca2+ transport by using its TMH to bind to MCU through its
        first TMH
    - reference_id: PMID:27099988
      supporting_text: EMRE also interacts with MICU1 via its C-terminal polyaspartate tail
