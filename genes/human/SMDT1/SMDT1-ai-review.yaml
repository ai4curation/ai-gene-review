suggested_questions:
- question: How does endogenous EMRE:MCU stoichiometry vary across human tissues, and which stress
    or developmental states tune it through MAIP1, AFG3L2:SPG7, or YME1L1?
- question: Do MICU3-containing neuronal uniplexes use the same EMRE tail contacts and EMRE
    copy-number dependence as the canonical MICU1/MICU2 holocomplex?
suggested_experiments:
- description: Quantitatively tag endogenous SMDT1 and MCU in primary human cell models, perturb
    MAIP1, YME1L1, and m-AAA protease subunits, and combine complexomics with mitoplast patch-clamp
    to measure EMRE copy number and channel gatekeeping.
  experiment_type: endogenous tagging / complexomics / mitoplast electrophysiology
  hypothesis: EMRE proteostasis sets the number of EMRE molecules per MCU tetramer and thereby tunes
    MICU-dependent gatekeeping without changing the identity of the core pore.
- description: Reconstitute human MCU-EMRE-MICU1-MICU3 and MCU-EMRE-MICU2-MICU3 complexes with
    defined EMRE stoichiometry and compare calcium-dependent gating with MICU1/MICU2 uniplexes.
  experiment_type: defined in vitro reconstitution and calcium-flux assay
  hypothesis: Neuronal MICU3-containing uniplexes preserve the EMRE C-tail adaptor mechanism but
    alter the calcium threshold for pore opening.
