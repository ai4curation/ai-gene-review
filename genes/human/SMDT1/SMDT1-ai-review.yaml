  review:
    summary: Remove the mature-protein mitochondrial matrix location.
    action: REMOVE
    reason: Reactome:R-HSA-8949649 describes mitochondrial processing peptidase cleavage of the
      proSMDT1 transit peptide before mature EMRE assembles into the MCU complex. Mature EMRE is a
