  - UniProtKB:Q96AQ8
  review:
    summary: Remove generic MCUR1 protein binding.
    action: REMOVE
    reason: PMID:27184846 reports physical association of MCUR1 with MCU and EMRE, but a bare
      protein-binding row does not identify SMDT1/EMRE's molecular function. EMRE's core annotated
      functions are MCU channel activation and MICU adaptor activity, so this generic GO:0005515
      assertion should be removed under the protein-binding policy.
    supported_by:
    - reference_id: PMID:27184846
      supporting_text: MCUR1 binds to MCU and EMRE and function as a scaffold factor
