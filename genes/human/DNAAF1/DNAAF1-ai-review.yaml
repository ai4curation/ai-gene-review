      3-4 text were inspected. Partner associations are measured; a fixed R2TP-like cargo-transfer complex
      is proposed. Reduced mutant abundance confounds an affinity-only explanation. No figure-pixel or
      complete supplementary-table inspection is claimed.
  findings:
  - statement: Human DNAAF1 binds IFT88 in a one-to-one yeast two-hybrid assay and co-immunoprecipitates
      with endogenous or expressed IFT88 in HEK293 cells; the IFT88 C-terminal region supports the Y2H
      interaction.
    reference_section_type: RESULTS
  - statement: Human DNAAF1 co-purifies with RUVBL1/RUVBL2, with endogenous-partner co-immunoprecipitation
      confirming association. RUVBL1 depletion perturbs DNAAF1/IFT88 colocalization; the assembly-to-transport
      handoff remains a proposed model.
