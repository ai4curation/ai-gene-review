suggested_questions:
- question: Which DNAAF1 contacts with dynein clients are direct, how do the established IFT88 and RUVBL1/RUVBL2
    associations couple preassembly to ciliary delivery, and do the two shorter predicted products retain
    this activity?
- question: How does the human renal primary-cilium phenotype relate mechanistically to the established
    motile dynein-arm assembly function?
