id: Q8NEP3
gene_symbol: DNAAF1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: DNAAF1 is a leucine-rich-repeat protein that supports cytoplasmic assembly of the outer and
  inner dynein arms needed for motile cilia. Loss of DNAAF1 disrupts dynein-arm incorporation and causes
  primary ciliary dyskinesia with respiratory and left–right patterning abnormalities. Human protein has
  also been observed in cilia and at mitotic spindle poles, and depletion in cultured renal epithelial
  cells impairs primary-cilium formation. Alternative transcripts encode three predicted products with
  different repeat or C-terminal regions.
alternative_products:
- name: '1'
  id: Q8NEP3-1
  description: The 725-residue canonical product contains the complete six-repeat LRR array and distal
    tail. Human full-length LRRC50-EGFP was studied in the 2008 localization experiments; exact equivalence
    of every historical sequence to the current reference is not assumed.
- name: '2'
  id: Q8NEP3-2
  sequence_note: VSP_036354, VSP_036355
  description: The 489-residue product lacks canonical residues 1–252, including all six annotated LRRs,
    and replaces R343 with RGMRSAEDNSPRVPLRL. Loss of the repeat array makes equivalent assembly function
    uncertain; inactivity has not been demonstrated.
- name: '3'
  id: Q8NEP3-3
  sequence_note: VSP_036356
  description: The 418-residue product retains canonical residues 1–408 and replaces residues 409–725
    with DPATVTACEG. It retains the annotated LRRs but loses the distal canonical tail. Its assembly activity
    and native localization have not been established.
