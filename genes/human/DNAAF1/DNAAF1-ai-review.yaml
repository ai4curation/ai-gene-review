core_functions:
- description: 'Supports cytoplasmic preassembly and incorporation of the outer and inner dynein arms
    during motile-cilium assembly. Human genetic and component-localization evidence establishes both
    arm classes; ortholog fractionation and rescue experiments support cytoplasmic preassembly. Human
    DNAAF1 associates with IFT88 and RUVBL1/RUVBL2, linking the assembly factor to ciliary trafficking
    machinery. The proposed coupling of dynein assembly to IFT delivery remains mechanistic inference:
    the direct dynein-client interfaces and a reconstituted transfer reaction are unresolved.'
