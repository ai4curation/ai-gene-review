  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  supporting_entities:
  - UniProtKB:Q8BH07
  - ensembl:ENSMUSP00000028336
  - UniProtKB-SubCell:SL-0179
  review:
    summary: Nuclear inner membrane (IEA, from mouse Arl6ip6). V5-tagged mouse Arl6ip6 is concentrated
      at the nuclear envelope with uniform rim staining in mesenchymal cells and adipocytes; the authors
      place it in the inner nuclear membrane. A minor peripheral ER pool is also seen. This is the only
      location evidence for the protein; accepted as its core location.
    action: ACCEPT
    reason: '[PMID:31142202 "We demonstrated by quantitative immunofluorescence microscopy that five little-characterized
      proteins with high enrichment scores are substantially concentrated at the NE, with Itprip exposed
      at the outer nuclear membrane, Smpd4 enriched at the NPC, and Mfsd10, Tmx4, and Arl6ip6 likely residing
      in the inner nuclear membrane."] [PMID:31142202 "Since Arl6ip6, Mfsd10 and Tmx4 showed relatively
      uniform nuclear rim staining similar to Vrk2, it is likely that these proteins are localized at
      the INM."] [PMID:31142202 "We were able to visualize Arl6ip6, Itprip, Smpd4, Tmx4 and Vrk2 in differentiated
      adipocytes, and in all cases obtained strong labeling of the NE with little or no peripheral ER/cytoplasmic
      staining."]'
    supported_by:
    - reference_id: PMID:31142202
      supporting_text: We demonstrated by quantitative immunofluorescence microscopy that five little-characterized
        proteins with high enrichment scores are substantially concentrated at the NE, with Itprip exposed
        at the outer nuclear membrane, Smpd4 enriched at the NPC, and Mfsd10, Tmx4, and Arl6ip6 likely
        residing in the inner nuclear membrane.
    - reference_id: PMID:31142202
      supporting_text: Since Arl6ip6, Mfsd10 and Tmx4 showed relatively uniform nuclear rim staining similar
        to Vrk2, it is likely that these proteins are localized at the INM.
    - reference_id: PMID:31142202
      supporting_text: We were able to visualize Arl6ip6, Itprip, Smpd4, Tmx4 and Vrk2 in differentiated
        adipocytes, and in all cases obtained strong labeling of the NE with little or no peripheral ER/cytoplasmic
        staining.
    propagation_review:
