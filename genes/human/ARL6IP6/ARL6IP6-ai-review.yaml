  - reference_id: PMID:31142202
    supporting_text: We demonstrated by quantitative immunofluorescence microscopy that five little-characterized
      proteins with high enrichment scores are substantially concentrated at the NE, with Itprip exposed
      at the outer nuclear membrane, Smpd4 enriched at the NPC, and Mfsd10, Tmx4, and Arl6ip6 likely residing
