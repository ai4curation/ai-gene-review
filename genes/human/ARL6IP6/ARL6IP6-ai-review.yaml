id: Q8N6S5
gene_symbol: ARL6IP6
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ARL6IP6 is a 226-residue protein with three predicted transmembrane helices, classified by
  UniProt in the ARL6IP6 family. Tagged mouse Arl6ip6 is concentrated at the nuclear envelope, most likely
  in the inner nuclear membrane, with a minor peripheral ER pool. A homozygous truncating ARL6IP6 variant
  was found in one family with syndromic cutis marmorata telangiectatica congenita, and an intronic ARL6IP6
  variant was associated with ischemic stroke in young adults. Its molecular function is unknown.
