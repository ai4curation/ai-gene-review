- id: PMID:25957586
  title: ARL6IP6, a susceptibility locus for ischemic stroke, is mutated in a patient with syndromic Cutis
    Marmorata Telangiectatica Congenita.
  findings:
  - statement: A homozygous truncating ARL6IP6 variant in syndromic CMTC.
    supporting_text: We have identified a homozygous truncating mutation in ARL6IP6 as the likely cause
      of a syndromic form of CMTC associated with major dysmorphism, developmental delay, transient ischemic
      attacks and cerebral vascular malformations.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only; single consanguineous family.
  full_text_unavailable: true
- id: PMID:22384361
  title: Genome-wide association analysis of ischemic stroke in young adults.
  findings:
  - statement: An intronic ARL6IP6 variant associated with early-onset ischemic stroke.
    supporting_text: rs2304556 is in the intron of FMNL2, which encodes a formin-related protein, and
      rs1986743 is in the intron of ARL6IP6, which encodes ADP-ribosylation-like factor 6 interacting
      protein 6.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Full text; GWAS locus, not functional.
- id: PMID:10508919
  title: A novel ADP-ribosylation like factor (ARL-6), interacts with the protein-conducting channel SEC61beta
    subunit.
  findings:
  - statement: ARL-6 yeast two-hybrid partners were identified.
    supporting_text: Using the yeast two-hybrid system, six molecules which interact with ARL-6 were identified
      including SEC61beta, a subunit of the heterotrimeric protein conducting channel SEC61p.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Abstract-only; mouse ARL-6 screen that named the ARL6-interacting proteins.
  full_text_unavailable: true
