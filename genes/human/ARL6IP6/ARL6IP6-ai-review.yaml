  significance: A truncating variant in a syndromic vascular malformation family and a stroke association
    suggest a role in vascular development that no cell-biological study has addressed.
  resolution: Identify nuclear-envelope partners of endogenous ARL6IP6 by proximity labelling, and test
    endothelial phenotypes of ARL6IP6 loss.
suggested_questions:
- question: Does ARL6IP6 interact with ARL6 at all, or does the name derive only from the original ARL-6
    two-hybrid screen?
suggested_experiments:
- description: Localize endogenous ARL6IP6 in human endothelial cells and test whether the CMTC-associated
    truncation alters nuclear-envelope targeting.
