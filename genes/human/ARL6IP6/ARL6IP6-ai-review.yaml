knowledge_gaps:
- gap_statement: ARL6IP6 has no known molecular activity or biological process. Its only experimental
    characterization is localization of the tagged mouse protein to the nuclear envelope.
  boundary: 'Established: three predicted transmembrane helices; tagged mouse protein concentrated at
    the nuclear envelope, likely the inner nuclear membrane, with a minor peripheral ER pool. Database
    records: proteome-scale binary interaction calls with other membrane proteins (BioGRID, IntAct). Human
    genetics: one CMTC family with a truncating variant and one stroke GWAS locus. Not established: any
    activity, functional partner, or cellular process. Despite the gene name, no ARL6 interaction is recorded
    in UniProt''s binary interaction list.'
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
