  - reference_id: PMID:31142202
    supporting_text: In addition, labeling of the relatively minor peripheral ER pools of Arl6ip6, Mfsd10,
      Tmx4 and Vrk2 also was evident (Figure 5), suggesting that the V5 epitope tag on these proteins
      was exposed to the cytosolic/nucleoplasmic space.
  - reference_id: file:human/ARL6IP6/ARL6IP6-uniprot.txt
    supporting_text: DR   BioGRID; 127351; 99.
