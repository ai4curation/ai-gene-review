suggested_questions:
- question: Does BiP repress IRE1alpha and PERK predominantly as a canonical chaperone-client interaction
    (substrate-binding domain, ERdj4-dependent) or via a non-canonical nucleotide-binding-domain interaction
    with the sensor luminal domains, and does this differ between IRE1alpha, PERK and ATF6?
- question: How do FICD-mediated AMPylation and BiP oligomerization partition BiP between active folding
    and inactive reserve pools in human secretory cells?
- question: Are the cell-surface and cytosolic GRP78 pools produced by a regulated mechanism, and does
    surface GRP78 have a physiological (non-pathogen) receptor function?
suggested_experiments:
- description: Separation-of-function BiP mutants (SBD substrate-binding defective vs NBD-interface mutants)
    in HSPA5-knockout human cells to measure effects on IRE1/PERK/ATF6 activation versus client folding.
