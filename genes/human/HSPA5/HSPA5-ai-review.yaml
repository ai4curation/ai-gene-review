core_functions:
- description: ATP-dependent Hsp70 chaperone of the ER lumen that binds nascent and misfolded clients
    through cycles of ATP binding and hydrolysis, regulated by ER J-domain co-chaperones and nucleotide
    exchange factors, promoting folding and retaining or targeting misfolded proteins for ERAD.
  molecular_function:
    id: GO:0140662
    label: ATP-dependent protein folding chaperone
  directly_involved_in:
  - id: GO:0034975
    label: protein folding in endoplasmic reticulum
  - id: GO:0036503
    label: ERAD pathway
  locations:
  - id: GO:0005788
    label: endoplasmic reticulum lumen
  in_complex:
    id: GO:0034663
    label: endoplasmic reticulum chaperone complex
  supported_by:
  - *id005
  - *id001
  - *id031
- description: 'Luminal repressor of the UPR transducers: BiP binds the luminal domains of IRE1alpha (recruited
    by ERdj4), PERK and ATF6 in unstressed cells, holding them inactive; competition by accumulating unfolded
    proteins releases them and activates the three UPR branches.'
  molecular_function:
    id: GO:0140311
    label: protein sequestering activity
  directly_involved_in:
  - id: GO:1903895
    label: negative regulation of IRE1-mediated unfolded protein response
  - id: GO:1903898
    label: negative regulation of PERK-mediated unfolded protein response
  - id: GO:1903891
    label: regulation of ATF6-mediated unfolded protein response
  locations:
  - id: GO:0005788
    label: endoplasmic reticulum lumen
  supported_by:
  - *id026
  - *id030
  - *id004
