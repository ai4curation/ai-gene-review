id: P11021
gene_symbol: HSPA5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'HSPA5 (BiP/GRP78) is the Hsp70-family molecular chaperone of the endoplasmic reticulum (ER)
  lumen. It enters the ER through a cleaved signal peptide and is retained there by a C-terminal KDEL
  retrieval motif. Its nucleotide-binding domain binds and hydrolyzes ATP, which allosterically controls
  client binding and release by the substrate-binding domain; the cycle is driven by ER J-domain co-chaperones
  (ERdj3/DNAJB11, ERdj4/DNAJB9, ERdj5/DNAJC10, Sec63) that stimulate ATP hydrolysis and nucleotide-exchange
  factors (SIL1, GRP170/HYOU1), and is further tuned by FICD-mediated AMPylation and oligomerization.
  BiP binds hydrophobic segments of nascent and misfolded secretory and membrane proteins, promoting their
  folding and assembly, retaining unfolded clients and delivering terminally misfolded ones to ER-associated
  degradation. It also assists Sec61-mediated translocation of a subset of precursors into the ER. BiP
  is the master luminal regulator of the unfolded protein response: in unstressed cells it binds the luminal
  domains of the transducers IRE1alpha (ERN1, recruited by ERdj4), PERK (EIF2AK3) and ATF6, keeping them
  inactive, and competition by accumulating unfolded proteins releases them to signal; BiP is itself a
  major UPR-induced gene. Minor stress-induced cytosolic and cell-surface pools exist, and surface GRP78
  serves as an entry factor for several viruses and Mucorales fungi.'
