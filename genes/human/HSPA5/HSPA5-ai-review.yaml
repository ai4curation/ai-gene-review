  evidence_type: TAS
  original_reference_id: PMID:16130169
  qualifier: enables
  review:
    summary: TAS from an HUVEC proteomics paper; BiP is a recognized low-affinity, high-capacity Ca2+-binding
      protein of the ER lumen.
    action: KEEP_AS_NON_CORE
    reason: Ca2+ buffering by abundant lumenal chaperones is plausible, but the cited proteomics paper
      does not demonstrate Ca2+ binding; not a core function.
