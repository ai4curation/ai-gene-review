core_functions:
- description: >-
    Acts at the plasma membrane as a non-enzymatic Wnt coreceptor. The LRP6
    ectodomain binds Wnt proteins and Frizzled receptors through distinct
    molecular contacts, enabling ligand-induced assembly of the
    Wnt-Frizzled-LRP5/6 complex and canonical beta-catenin signaling. These
    Wnt-protein-binding and Frizzled-binding activities support, but are not
    synonyms for, coreceptor activity; LRP6 does not act as an autonomous
    receptor enzyme.
