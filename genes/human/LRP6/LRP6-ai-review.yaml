id: O75581
gene_symbol: LRP6
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  LRP6 is a 1,613-amino-acid type-I single-pass cell-surface glycoprotein and a
  coreceptor for canonical Wnt/beta-catenin signaling. Its extracellular
  beta-propeller-EGF modules bind Wnt proteins, Frizzled receptors, and
  extracellular regulators, while its cytoplasmic PPPSP-rich tail is
  phosphorylated after receptor-complex assembly. Phosphorylated LRP6 clusters
  into Wnt signalosomes and recruits Dishevelled and the AXIN-GSK3 destruction
  complex to the plasma membrane, thereby stabilizing beta-catenin; phosphorylated
  PPPSPxS motifs can also directly inhibit GSK3. LRP6 is a non-enzymatic
  coreceptor, not a protein kinase or autonomous receptor enzyme. Its canonical
  Wnt function contributes to human development and tissue homeostasis. Human
  LRP6 variants are associated with disorders of retinal vascularization,
  dentition, bone mass, and cardiometabolic physiology, with evidence and
  mechanisms that vary by allele.
