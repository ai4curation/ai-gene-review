knowledge_gaps:
- gap_statement: >-
    It is unknown whether the additional NCBI RefSeq LRP6 transcript/protein
    models designated a-j produce stable products with functions that differ from
    the UniProtKB O75581/RefSeq isoform-b model reviewed here.
  boundary: >-
    UniProtKB O75581 has no ALTERNATIVE PRODUCTS or VAR_SEQ record and maps to
    RefSeq isoform b, whereas current NCBI records enumerate additional predicted
    models. None of the reviewed functional studies establishes an isoform-specific
    activity for those non-b products, and the GSK3A isoform study PMID:30824926
    supplies no LRP6 isoform evidence.
  gap_kind:
  - BIOLOGY
  - CURATION
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    Assigning core receptor functions to untested transcript models could obscure
    product-specific trafficking, extracellular architecture, or cytoplasmic-tail
    differences.
  resolution: >-
    Establish transcript abundance and translation with isoform-resolved long-read
    RNA sequencing and proteogenomics, then compare cell-surface delivery and Wnt
    signaling of sequence-verified products against the O75581/RefSeq-b product.
- gap_statement: >-
    The architecture and conformational transitions of full-length, membrane-embedded
    human LRP6 in an activated Wnt-Frizzled signalosome remain unresolved.
  boundary: >-
    Existing structures define isolated human LRP6 extracellular E1E2 or E3E4
    fragments and fragment complexes with DKK1 or Kremen1. They do not establish
    the structure of intact LRP6, its transmembrane segment, cytoplasmic tail, or a
    complete membrane receptor signalosome.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    Full-length structural information is needed to connect extracellular
    ligand/coreceptor geometry to tail phosphorylation, oligomerization, AXIN
    recruitment, and antagonist action.
  resolution: >-
    Determine structures of endogenous or near-endogenous full-length human LRP6
    with defined Wnt and Frizzled partners in a membrane environment, supported by
    cross-linking mass spectrometry and phosphosite-resolved conformational assays.
