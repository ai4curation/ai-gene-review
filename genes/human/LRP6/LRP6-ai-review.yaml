  significance: >-
    Tissue-specific redundancy and variant mechanisms determine which phenotypes
    reflect altered ligand binding, receptor trafficking, signalosome assembly, or
    paralog compensation.
  resolution: >-
    Compare endogenous LRP6 variant alleles in human tissue-relevant models with
    matched LRP5 loss or rescue, and test ligand binding, surface abundance,
    phospho-tail signaling, and signalosome assembly without extrapolating from
    LRP4 or LRP5L.
proposed_new_terms: []
suggested_questions:
- question: >-
    Which NCBI RefSeq LRP6 models a-j are translated in human tissues, and do any
    product-specific sequences alter surface delivery, ligand binding, or the
    PPPSP-dependent signalosome mechanism relative to UniProtKB O75581/RefSeq b?
- question: >-
    What is the full-length architecture of a human Wnt-Frizzled-LRP6 signalosome,
    and how does extracellular complex geometry control phosphorylation and AXIN
    recruitment by the cytoplasmic tail?
- question: >-
    In endogenous human signaling, how much beta-catenin stabilization is caused
    by direct GSK3 inhibition by phosphorylated LRP6 motifs versus AXIN-GSK3
    recruitment or sequestration?
- question: >-
    Which human tissues depend specifically on LRP6 rather than LRP5, and which
    disease variants perturb ligand binding, receptor trafficking, signalosome
    assembly, or direct GSK3 inhibition?
suggested_experiments:
- hypothesis: >-
    Only a subset of NCBI RefSeq LRP6 models a-j produces stable cell-surface
    protein, with the O75581/RefSeq-b product accounting for the established core
    Wnt-coreceptor activity.
  description: >-
    Combine long-read RNA sequencing, targeted junction assays, ribosome profiling,
    and isoform-unique targeted proteomics across human Wnt-responsive tissues.
    Express only sequence-verified products at matched levels in an LRP6-null human
    background and compare maturation, plasma-membrane abundance, Wnt/Frizzled
    complex assembly, tail phosphorylation, and beta-catenin signaling.
  experiment_type: isoform-resolved transcriptomics, proteomics, and functional rescue
- hypothesis: >-
    Defined Wnt and Frizzled combinations impose distinct full-length LRP6
    conformations that couple extracellular receptor assembly to cytoplasmic-tail
    phosphorylation and signalosome formation.
  description: >-
    Reconstitute full-length human LRP6 with defined human Wnt and Frizzled partners
    in nanodiscs and matched human cells, then combine cryo-EM or cryo-electron
    tomography with cross-linking mass spectrometry, phosphosite mapping, and
    single-particle clustering measurements. Include fragment-only constructs as
    controls rather than treating them as full-receptor structures.
  experiment_type: full-length membrane-complex structural and phosphoproteomic analysis
- hypothesis: >-
    AXIN recruitment and direct GSK3 inhibition are separable phospho-tail functions
    whose relative importance changes with signaling dose and duration.
  description: >-
    Introduce endogenous separation-of-function edits in individual PPPSP motifs,
    quantify AXIN/GSK3 recruitment and GSK3 substrate phosphorylation in real time,
    and measure beta-catenin stabilization in human cells. Compare intact LRP6 with
    recruitment-defective and inhibitor-defective tails while verifying equal
    surface abundance and Wnt-Frizzled complex formation.
  experiment_type: endogenous phosphosite editing and quantitative signaling kinetics
- hypothesis: >-
    LRP6 disease alleles cause tissue-specific phenotypes through distinct defects
    in receptor trafficking, extracellular ligand/coreceptor assembly, or
    phospho-tail signaling, modulated by LRP5 compensation.
  description: >-
    Engineer representative extracellular, transmembrane-proximal, and tail variants
    into isogenic human retinal, dental, bone, and vascular models. Measure surface
    delivery, ligand and Frizzled binding, signalosome assembly, and beta-catenin
    output with matched LRP5 knockout and rescue conditions; do not use LRP4 or
    LRP5L as functional substitutes.
  experiment_type: isogenic variant phenotyping in tissue-relevant human models
