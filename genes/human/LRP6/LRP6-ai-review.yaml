- gap_statement: >-
    The tissue-specific division of labor between human LRP6 and LRP5, and the
    mechanistic effects of many LRP6 disease variants, remain incompletely resolved.
  boundary: >-
    LRP6-specific human evidence supports the core receptor mechanism, but many
    studies report LRP5/6 jointly or use Xenopus, mouse, zebrafish, PC12, NIH3T3,
    or other heterologous systems. LRP4- and LRP5L-specific findings are not
    transferable to LRP6, and disease-associated variants do not by themselves
    define normal LRP6 function; PMID:34896607 lacks locally accessible functional
    text.
  gap_kind:
  - BIOLOGY
  - CURATION
  dark_aspect: RESIDUAL_SUBGAP
