  - *id022
  - *id023
  - *id024
  - *id025
suggested_questions:
- question: Is the IBA to anterior/posterior pattern specification (HES subfamily node PTN000105428) appropriately
    propagated to the divergent DEC branch (BHLHE40/BHLHE41), which lacks the WRPW motif and has no segmentation
    phenotype?
- question: Does human BHLHE40 directly activate any target genes (e.g. CSF2/GM-CSF, cell-cycle genes),
    or are reported positive effects indirect consequences of repressing other repressors?
- question: Should hypoxia induction of BHLHE40 (a direct HIF-1 target) and its role in hypoxic inhibition
    of adipogenesis via PPARG repression be represented as process annotations, or are these expression
    responses better left to GO-CAM?
- question: Which BHLHE40 functions depend on its BHLHE41 paralog (redundancy in alveolar macrophages,
    clock), and should annotations note this redundancy?
suggested_experiments:
- description: Genome-wide ChIP-seq/CUT&RUN of endogenous BHLHE40 in human macrophages and T cells, combined
    with acute degron depletion and nascent transcription (PRO-seq), to separate direct repressed and
    activated targets.
  experiment_type: genome-wide occupancy with acute depletion
  hypothesis: Direct BHLHE40 targets are predominantly repressed through CACGTG E-boxes; activated genes
    are mostly indirect.
- description: Test whether the LXXLL motif mutant (L78A/L79A) of human BHLHE40 retains E-box repression
    but loses RXR corepression in hepatocytes, and assess effects on hepatic lipid gene rhythms.
  experiment_type: structure-function mutagenesis
  hypothesis: E-box DNA-binding repression and RXR corepression are separable activities of BHLHE40.
- description: Assess human monocyte-derived and tissue macrophages with BHLHE40 knockout for IL-10 production
    and proliferation after IL-4 or apoptotic-cell exposure.
  experiment_type: loss-of-function in primary human cells
  hypothesis: The mouse Bhlhe40-Il10 and Bhlhe40-Maf regulatory axes are conserved in human macrophages.
