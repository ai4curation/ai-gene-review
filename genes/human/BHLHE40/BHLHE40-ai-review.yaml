  - ZFIN:ZDB-GENE-990415-90
  review:
    summary: IBA anterior/posterior pattern specification propagated from the HES subfamily node (PTN000105428),
      seeded by segmentation-clock genes such as Hes7/her genes.
    action: MARK_AS_OVER_ANNOTATED
    reason: Anterior/posterior patterning is a HES/HER segmentation-clock function. There is no experimental
      evidence that BHLHE40 (DEC subfamily, no WRPW motif) acts in somitogenesis or axial patterning,
      and Stra13/Bhlhe40-null mice are viable and are studied mainly for adult immune and clock phenotypes.
      The deep node placement probably over-propagates this function to the divergent DEC branch.
    supported_by:
    - reference_id: PMID:11668339
      supporting_text: aging Stra13-/- mice develop autoimmune disease
    - reference_id: PMID:10737769
      supporting_text: Stra13 expression is transcriptionally repressed and maintained at a low level
        in cells through a negative autoregulatory mechanism that is brought about by its interaction
        with the corepressor histone deacetylase (HDAC1)
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN000105428
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: HES-related ancestral node whose patterning evidence comes from HES/HER segmentation-clock
          members (e.g. zebrafish her genes, mouse Hes7). The DEC branch (BHLHE40/BHLHE41) lacks the WRPW
          motif and has no somitogenesis or axial-patterning evidence, so the function likely did not
          persist on that branch.
