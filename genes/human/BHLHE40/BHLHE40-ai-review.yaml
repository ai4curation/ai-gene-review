gene_symbol: BHLHE40
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'BHLHE40 (DEC1/STRA13/SHARP2) is a class E basic helix-loop-helix-Orange transcription factor
  of the HES-related family that acts predominantly as a sequence-specific transcriptional repressor in
  the nucleus. It binds class B CACGTG E-boxes as a homodimer or as a heterodimer with its paralog BHLHE41/DEC2,
  and represses RNA polymerase II target genes by competing with activators such as CLOCK-BMAL1 and by
  HDAC1-dependent and -independent mechanisms. It is a clock-controlled gene and an auxiliary component
  of the circadian clock: it represses PER1, DBP, BHLHE41 and its own promoter, and tunes the phase and
  robustness of E-box-driven clock gene expression. It also acts as a corepressor of RXR and RXR heterodimers
  through an LXXLL motif, and interacts with p53. BHLHE40 is strongly induced by hypoxia (a direct HIF-1
  target) and by retinoic acid, serum deprivation, DNA damage and immune activation. In immune cells it
  controls cytokine programmes, promoting GM-CSF and repressing IL-10 in T cells and myeloid cells. In
  tissue-resident macrophages it supports self-renewal and proliferation by repressing c-Maf/MafB. Its
  activity and stability are modulated by SUMOylation and ubiquitin-proteasome turnover.'
