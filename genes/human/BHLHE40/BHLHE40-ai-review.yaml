core_functions:
- description: Sequence-specific DNA-binding transcriptional repressor that binds class B CACGTG E-boxes
    as a homodimer or BHLHE41 heterodimer and represses RNA polymerase II target genes, including CLOCK-BMAL1-activated
    clock and clock-controlled genes (PER1, DBP, BHLHE41, its own promoter, NR0B2, ATP1B1), thereby shaping
    the phase and robustness of circadian gene expression.
  molecular_function:
    id: GO:0001227
    label: DNA-binding transcription repressor activity, RNA polymerase II-specific
  directly_involved_in:
  - id: GO:0000122
    label: negative regulation of transcription by RNA polymerase II
  - id: GO:0032922
    label: circadian regulation of gene expression
  locations:
  - id: GO:0005634
    label: nucleus
  - id: GO:0000785
    label: chromatin
  supported_by:
  - *id008
  - *id007
  - *id002
  - *id011
  - *id013
- description: 'Transcriptional corepressor of retinoid X receptor (RXR) and RXR heterodimers (LXR, FXR,
    VDR, RAR): binds RXRalpha through an LXXLL motif in its basic region and represses ligand-induced
    transactivation.'
  molecular_function:
    id: GO:0003714
    label: transcription corepressor activity
  directly_involved_in:
  - id: GO:0000122
    label: negative regulation of transcription by RNA polymerase II
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - *id017
  - *id020
  - *id009
- description: In immune cells, acts as a direct transcriptional repressor of Il10 and Maf, restraining
    IL-10 production by T cells and myeloid cells and permitting self-renewal and proliferation of tissue-resident
    (large peritoneal) macrophages, including after efferocytosis (evidence from mouse).
  molecular_function:
    id: GO:0001227
    label: DNA-binding transcription repressor activity, RNA polymerase II-specific
  directly_involved_in:
  - id: GO:0032693
    label: negative regulation of interleukin-10 production
  - id: GO:0120041
    label: positive regulation of macrophage proliferation
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
