id: P11473
gene_symbol: VDR
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: VDR (vitamin D receptor, NR1I1) is a ligand-activated nuclear receptor transcription factor that mediates
  the genomic actions of calcitriol (1-alpha,25-dihydroxyvitamin D3). Its C-terminal ligand-binding domain binds
  calcitriol with high affinity (and, with lower affinity, the secondary bile acid lithocholic acid); ligand binding
  promotes heterodimerisation with RXR (mainly RXRA), binding of the VDR-RXR heterodimer via the zinc-finger DNA-binding
  domain to vitamin D response elements (typically DR3 direct repeats), and exchange of corepressors (NCOR1) for
  coactivators (MED1/DRIP205, NCOA1-3) to activate, or in some contexts repress, target genes. VDR shuttles between
  cytoplasm and nucleus and acts on chromatin. Its target-gene programmes drive intestinal calcium and phosphate
  absorption (e.g. TRPV6, calbindin), feedback control of vitamin D metabolism (induction of CYP24A1, repression
  of CYP27B1 and PTH), and ligand-independent hair-follicle cycling. Biallelic loss-of-function variants cause vitamin
  D-dependent rickets type 2A (hereditary 1,25-dihydroxyvitamin D-resistant rickets), often with alopecia.
