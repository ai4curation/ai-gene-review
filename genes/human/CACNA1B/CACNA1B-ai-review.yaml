  findings:
  - statement: The cohort comparison detected R1389H in one of 520 myoclonus-dystonia cases and one of 489
      healthy controls, with no carrier among 146 familial probands; the study did not support a causal
      association for this variant.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Authenticated normal PMID/PMCID/DOI/title and full XML body inspected. Complete abstract
      and unique Introduction, Results, Discussion and Materials and Methods were read; repeated extraction
      blocks were recognized. Cases underwent CACNA1B exon-28 Sanger sequencing, while control frequencies
      used whole-exome data; public population datasets supplied additional comparisons. Supplementary
      chromatograms and images were not inspected. This is study-specific negative genetic-association
      evidence, not negative evidence for alpha1B pore function or a current blanket clinical classification.
core_functions:
- description: The alpha1B pore converts strong membrane depolarization into calcium entry through neuronal
    CaV2.2 channels, coupling electrical activity to neurotransmitter release. Beta and alpha2delta subunits
    support channel expression and gating, and interaction partners regulate this same channel unit. Alpha1B
    conducts the ion; calcium sensing by release machinery and membrane fusion occur downstream.
  molecular_function:
    id: GO:0008331
    label: high voltage-gated calcium channel activity
  directly_involved_in:
