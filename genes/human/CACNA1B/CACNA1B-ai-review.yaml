suggested_questions:
- question: Does amyloid-beta bind alpha1B directly under defined conditions, or is the observed current
    modulation mediated through another membrane or cellular component?
- question: How do the Alpha-1B-1 and Alpha-1B-2 products differ in native trafficking, gating and partner
    dependence, separately from disease-associated missense variants and other splice events?
- question: Which neuronal contexts support the curated CACNA1B–RXRB interaction, and which channel region
    was tested in the original fragment-based screen?
suggested_experiments:
- description: Test physical amyloid-beta interaction with defined human CaV2.2 preparations alongside
    matched electrophysiology, using aggregation-state controls and independent binding readouts to distinguish
    contact from functional modulation.
