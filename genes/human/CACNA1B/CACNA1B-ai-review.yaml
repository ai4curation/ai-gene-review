      review_notes: The later multicenter cohort found comparable variant frequencies in cases and healthy
        controls. This disputes the genetic causal attribution, independently of the reported functional
        channel changes. It does not test every CACNA1B variant or all possible disease mechanisms.
      supported_by:
      - reference_id: PMID:26157024
        supporting_text: 'These results do not

          support a causal association'
