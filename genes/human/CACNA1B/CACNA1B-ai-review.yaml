    relevance: HIGH
    correctness: DISPUTED
    review_notes: Normal identity and complete abstract checked. WT/R1389H whole-cell and single-channel
      measurements support channel activity. The proposed R1389H myoclonus-dystonia association is contested
      by the now normally cached PMID:26157024, whose complete abstract and unique Introduction, Results,
      Discussion and Methods were read. Comparable carrier frequencies in 520 cases and 489 controls,
      with no carrier among 146 familial probands, challenge this particular disease attribution. DISPUTED
      does not invalidate the channel-current measurements or assert a contemporary clinical classification.
