id: Q00975
gene_symbol: CACNA1B
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CACNA1B encodes the pore-forming alpha1B subunit of the N-type, high-voltage-activated calcium
  channel CaV2.2. Its four homologous transmembrane repeats form voltage sensors and a calcium-selective
  pore. In neuronal plasma membranes, depolarization opens the channel and calcium entry couples electrical
  activity to neurotransmitter release. Beta and alpha2delta auxiliary subunits influence channel expression
  and gating, while presynaptic partners and phosphorylation pathways regulate the alpha1B subunit. The
  channel is sensitive to omega-conotoxins, including the pore blocker ziconotide. The Alpha-1B-1 and
  Alpha-1B-2 splice products provide distinct sequence forms of the channel.
