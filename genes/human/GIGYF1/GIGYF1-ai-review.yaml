id: O75420
gene_symbol: GIGYF1
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: GIGYF1 is a cytosolic GYF-domain protein that represses translation and couples selected
  translating mRNAs to decay. Its N-terminal regions bind 4EHP and DDX6, while the GYF domain recognizes
  proline-rich protein regions. C-terminal eIF3 engagement reduces eIF3–eIF4G1 association, supporting
  4EHP-independent repression; adaptor interfaces connect RNA-bound factors and effectors. GIGYF1 also
  associates with GRB10-containing signaling assemblies.
