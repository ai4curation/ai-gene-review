  sequence_note: Displayed 1,035-residue sequence; no alternative product is enumerated in the inspected
    official record.
core_functions:
- description: Represses translation through adaptor interactions, with distinct eIF3 and 4EHP/DDX6 mechanisms
    supporting repression and selected mRNA decay.
