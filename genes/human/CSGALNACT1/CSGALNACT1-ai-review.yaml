- term:
    id: GO:0015012
    label: heparan sulfate proteoglycan biosynthetic process
  evidence_type: NAS
  original_reference_id: PMID:11514575
  qualifier: involved_in
  review:
    summary: >-
      CSGALNACT1 does not synthesise heparan sulfate. It diverts linkage-region acceptors
      away from heparan sulfate toward chondroitin sulfate. The cited paper is about
      CHSY1.
    action: REMOVE
    reason: >-
      PMID:11514575 only draws an analogy between chondroitin synthase and the heparan
      sulfate polymerases. It makes no claim that either enzyme makes heparan sulfate,
      and it is about CHSY1 anyway. CSGALNACT1 adds GalNAc, a residue absent from
      heparan sulfate. Overexpressing it replaces heparan sulfate with chondroitin
      sulfate on a hybrid core protein. In patient cells, the heparan sulfate increase
      after its loss comes from unused linker acceptor, not from any heparan sulfate
      synthetic step performed by CSGALNACT1. The gene does none of the work of heparan
      sulfate synthesis.
    supported_by:
