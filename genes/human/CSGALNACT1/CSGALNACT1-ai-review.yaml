- term:
    id: GO:0008955
    label: peptidoglycan glycosyltransferase activity
  evidence_type: IDA
  original_reference_id: PMID:11514575
  qualifier: enables
  review:
    summary: >-
      Wrong term and wrong gene. GO:0008955 is the bacterial lipid II (GlcNAc-MurNAc
      pentapeptide) cell-wall polymerase reaction. The cited paper characterised human
      chondroitin synthase (CHSY1), not CSGALNACT1.
    action: REMOVE
    reason: >-
      GO:0008955 is defined as polymerisation of
      GlcNAc-(1->4)-Mur2Ac-pentapeptide-undecaprenyl diphosphate (lipid II) into
      peptidoglycan (term checked in OLS; not obsolete). This bacterial cell-wall
      reaction is carried out by GT51 transglycosylases and SEDS proteins (rule
      FRR:0001). CSGALNACT1 is a Golgi GT7 enzyme that transfers GalNAc from UDP-GalNAc
      to glucuronic acid in chondroitin. It has no peptidoglycan substrate, and
      vertebrates make no peptidoglycan. The 2003 curator most likely confused
      "peptidoglycan" with the proteoglycan/chondroitin polymer acceptor; the right
      terms for the measured reactions are GO:0047238 (GalNAc) and GO:0050510 (GlcA).
      The paper also did not assay CSGALNACT1. It cloned the 802-aa chromosome-15
      chondroitin synthase (CHSY1, Q86X52), and that paper is correctly cited for CHSY1
      under GO:0047238 and GO:0050510. CSGALNACT1 (532 aa, chromosome 8) was cloned a
      year later by homology to that synthase. We chose REMOVE over MODIFY because the
      tuple (Q8TDX6, GalNAc transferase, PMID:11514575) would still be unsupported
      after a term swap. CSGALNACT1's real GalNAc-transferase activities are already
      captured with valid evidence by the GO:0047237 and GO:0047238 rows (IDA
      PMID:12163485, EXP PMID:21160489/PMID:27599773, IBA, TAS).
    supported_by:
    - reference_id: PMID:11514575
      supporting_text: The identified protein consists of 802 amino acids with a type
        II transmembrane protein topology
    - reference_id: PMID:11514575
      supporting_text: the enzyme was chondroitin synthase, with both beta1,3-GlcUA
        transferase and beta1,4-GalNAc transferase activities
    - reference_id: PMID:11788602
      supporting_text: Based on sequence homology with the recently cloned human chondroitin
        synthase, we identified a novel beta1,4-N-acetylgalactosaminyltransferase, which
        consisted of 532 amino acids
    source_defects:
    - defect_type: WRONG_TERM
      resource: UNIPROT
      slot: GO_ID
      requested_change: REPOINT
      asserted_value: GO:0008955
      corrected_value: GO:0047238
      corrected_label: glucuronosyl-N-acetylgalactosaminyl-proteoglycan 4-beta-N-acetylgalactosaminyltransferase
        activity
      confidence: CONFIRMED
      explanation: >-
        GO:0008955 peptidoglycan glycosyltransferase activity is the bacterial lipid II
        polymerisation reaction. PMID:11514575 measured transfer of GalNAc (and GlcA) from
        UDP-sugars onto polymer chondroitin, a vertebrate glycosaminoglycan. The GalNAc
