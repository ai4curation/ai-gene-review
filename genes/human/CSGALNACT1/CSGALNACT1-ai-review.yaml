    - defect_type: WRONG_GENE_PRODUCT
      resource: UNIPROT
      slot: DB_Object_ID
      requested_change: DELETE_ROW
      asserted_value: UniProtKB:Q8TDX6
      corrected_value: UniProtKB:Q86X52
      corrected_label: CHSY1, chondroitin sulfate synthase 1
      confidence: CONFIRMED
      explanation: >-
        PMID:11514575 describes an 802-aa chromosome-15 chondroitin synthase (CHSY1,
