    label: chondroitin sulfate proteoglycan biosynthetic process
  locations:
  - id: GO:0000139
    label: Golgi membrane
  supported_by:
  - reference_id: PMID:11788602
    supporting_text: not only to a polymer chondroitin representing growing chondroitin
      chains (beta-GalNAc transferase II activity) but also to
  - reference_id: PMID:12163485
    supporting_text: N-Acetylgalactosaminyltransferase activity was observed toward
      chondroitin poly- and oligosaccharides
suggested_questions:
- question: >-
    Which metal does CSGALNACT1 require (Mn2+ as for other GT7 enzymes?), and do the
    predicted binding residues 360 and 477 coordinate it? This would allow a specific
    cation-binding term to replace metal ion binding.
- question: >-
    How much does CSGALNACT1's GalNAcT-II (elongation) activity contribute in vivo, given
    CSGALNACT2 and the CHSY/CHPF polymerase complexes? Does it influence chain length as
    well as chain number?
- question: >-
    Should Reactome R-HSA-1971482 (GalNAc transfer to the linker GlcA) map to GO:0047237
    rather than GO:0047238?
suggested_experiments:
- description: >-
    Measure GalNAcT-I and GalNAcT-II kinetics of purified CSGALNACT1 side by side with
    defined linker-tetrasaccharide and chondroitin-oligosaccharide acceptors, across
    divalent cations and with alanine mutants of residues 360 and 477.
- description: >-
    In CSGALNACT1/CSGALNACT2 double-knockout chondrocytes, rescue with GalNAcT-I-selective
    versus elongation-competent variants and measure CS chain number and length on
    aggrecan.
