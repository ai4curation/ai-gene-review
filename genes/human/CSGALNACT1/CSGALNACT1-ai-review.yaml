id: Q8TDX6
gene_symbol: CSGALNACT1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  CSGALNACT1 (chondroitin sulfate N-acetylgalactosaminyltransferase 1, ChGn-1) is a
  532-residue type II transmembrane glycosyltransferase of the Golgi membrane. It belongs
  to the CAZy GT7 / chondroitin N-acetylgalactosaminyltransferase family. Its lumenal
  catalytic domain transfers N-acetylgalactosamine (GalNAc) from UDP-GalNAc in beta1,4
  linkage to a glucuronic acid acceptor. Its main role is chain initiation: it adds the
  first GalNAc to the GlcA-Gal-Gal-Xyl linkage tetrasaccharide on proteoglycan core
  proteins, which commits that site to chondroitin/dermatan sulfate rather than heparan
  sulfate. It also has GalNAc-transferase II (chain elongation) activity on chondroitin
  polymers, but CSGALNACT2 and the chondroitin synthase/polymerase complexes are the main
  chain elongators. CSGALNACT1 is highly expressed in developing cartilage and sets the
  number of chondroitin sulfate chains on aggrecan. Loss-of-function variants cause an
  autosomal recessive mild skeletal dysplasia with joint laxity and advanced bone age
  (CSGALNACT1-CDG). Patient fibroblasts show fewer CS/DS chains and a compensatory rise in
  heparan sulfate.
