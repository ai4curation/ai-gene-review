core_functions:
- description: >-
    Chain-initiating GalNAc transferase (GalNAcT-I). In the Golgi lumen, CSGALNACT1 adds
    the first beta1,4-GalNAc to the GlcA of the GlcA-Gal-Gal-Xyl linkage
    tetrasaccharide on proteoglycan core proteins. This commits the chain to
    chondroitin/dermatan sulfate rather than heparan sulfate and sets the number of CS
    chains per core protein, for example on cartilage aggrecan.
  molecular_function:
    id: GO:0047237
    label: glucuronylgalactosylproteoglycan 4-beta-N-acetylgalactosaminyltransferase
      activity
  directly_involved_in:
  - id: GO:0050650
    label: chondroitin sulfate proteoglycan biosynthetic process
  - id: GO:0050651
    label: dermatan sulfate proteoglycan biosynthetic process
  locations:
  - id: GO:0000139
    label: Golgi membrane
  supported_by:
  - reference_id: PMID:11788602
    supporting_text: a synthetic substrate for beta-GalNAc transferase I that transfers
      the first GalNAc to the core tetrasaccharide in the protein linkage region of chondroitin
      sulfate
  - reference_id: PMID:12446672
    supporting_text: CSGalNAcT-1 is involved in the initiation of chondroitin sulfate
      synthesis, whereas CSGalNAcT-2 participates mainly in the elongation, not initiation
  - reference_id: PMID:17145758
    supporting_text: CSGalNAcT-1 overexpression increases the number of CS chains attached
      to aggrecan core protein
- description: >-
    Chain-elongating GalNAc transferase (GalNAcT-II). CSGALNACT1 also transfers
    beta1,4-GalNAc to the non-reducing terminal GlcA of growing chondroitin chains. This
    elongation activity is weaker than CSGALNACT2's, and elongation is mainly carried out
    by the chondroitin synthase/polymerase complexes.
  molecular_function:
    id: GO:0047238
    label: glucuronosyl-N-acetylgalactosaminyl-proteoglycan 4-beta-N-acetylgalactosaminyltransferase
      activity
