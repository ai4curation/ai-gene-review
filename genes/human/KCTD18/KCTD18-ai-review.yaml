  - id: file:human/KCTD18/KCTD18-hypotheses/kgap-kctd18-cul3-substrate-adaptor/openscientist.md
    title: OpenScientist report on KCTD18 CUL3 substrate-adaptor activity
    findings:
      - statement: >-
          High-throughput AP-MS/TAP-MS data are consistent with possible KCTD18
          CUL3-complex association, but no direct CUL3-binding, substrate, or
          ubiquitination assay establishes KCTD18 as a CRL3 substrate adaptor.
        supporting_text: >-
          While high-throughput proteomics data suggest KCTD18 may associate with
          CUL3 and CRL complex components, no targeted binding validation, substrate
          identification, or ubiquitination assay has been published.
      - statement: >-
          BTB-domain features make CUL3 binding plausible but do not settle the
          claim, because similar motifs are compatible with both CUL3-binding and
          nonbinding KCTD proteins.
        supporting_text: >-
          However, BTB domain presence with LNVGG motif is **necessary but not
          sufficient** for CUL3 binding
