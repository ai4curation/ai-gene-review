      interpretation is disputed and direct binding has not been validated.
  - description: SEC-MALS and native mass spectrometry to determine oligomeric state
    hypothesis: KCTD18 is monomeric in solution, unlike pentameric KCTD family members
  - description: BioID/APEX proximity labeling to identify interacting proteins and
