id: Q9UBY0
gene_symbol: SLC9A2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  SLC9A2 (NHE2) is a plasma-membrane sodium/hydrogen antiporter of the SLC9
  (monovalent cation:proton antiporter-1, CPA1; TC 2.A.36) family. It is a
  multi-pass membrane glycoprotein that catalyses the electroneutral 1:1
  exchange of extracellular Na(+) for intracellular H(+). In polarized epithelia
  of the gastrointestinal tract (stomach, small intestine, colon) and the kidney
  it localizes to the apical/brush-border membrane, where it contributes to
  transepithelial Na(+) absorption and to regulation of intracellular pH. In the
  colonic crypt NHE2 is the major apical Na(+)/H(+) exchanger, and by setting
  cryptal intracellular pH it influences epithelial differentiation toward the
  absorptive enterocyte lineage. Its cytoplasmic C-terminal tail binds the
  calcineurin B-homologous proteins CHP1/CHP2, which regulate exchanger activity.
