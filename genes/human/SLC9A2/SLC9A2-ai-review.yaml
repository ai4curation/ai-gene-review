  review:
    summary: >-
      ComplexPortal (NAS) assignment of the NHE2-CHP complexes to the basolateral
      plasma membrane.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      NHE2's established localization is apical/brush-border, not basolateral.
      Western analysis and immunohistochemistry placed NHE2 in brush-border but
      not basolateral membranes of intestinal epithelial cells, and UniProt
      records only "Apical cell membrane". The cited reference (PMID:34108458) is
      the cryo-EM structure of the NHE1-CHP1 complex, and it is NHE1 (SLC9A1) that
      resides in the basolateral membrane of polarized epithelia; the basolateral
      assignment appears transferred to NHE2 by homology to NHE1 when the
      NHE2-CHP complexes were created, rather than demonstrated for NHE2 itself.
      Flagged as an over-annotation; basolateral residence of NHE2 is not
      established in any epithelium.
    supported_by:
