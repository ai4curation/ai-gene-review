  review:
    summary: >-
      Phylogenetic assertion that NHE2 imports Na(+) across the plasma membrane.
    action: ACCEPT
    reason: >-
      NHE2 mediates electroneutral exchange of intracellular H(+) for
      extracellular Na(+), i.e. net Na(+) uptake across the apical plasma membrane,
      underpinning transepithelial Na(+) absorption. This is the most specific,
      informative sodium-transport process term for NHE2 and the gene product
      itself performs the import step. Core transport process.
