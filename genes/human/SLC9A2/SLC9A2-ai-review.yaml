  reference_review:
    relevance: MEDIUM
    correctness: MISCITED
    review_notes: >-
      PubMed-verified cryo-EM structure of the human NHE1 (SLC9A1)-CHP1 complex.
      It elucidates the alternating-access mechanism of the CPA1/NHE family and
      CHP binding, so it is mechanistically relevant to NHE2, but it is NOT an
      NHE2 (SLC9A2) study. It is used by ComplexPortal to underpin the basolateral
      plasma-membrane assignment of the NHE2-CHP complexes, which it does not
      support: the paper describes NHE1 as the basolateral isoform, and NHE2 is
      experimentally apical. Flagged as miscited for the basolateral NHE2 claim.
