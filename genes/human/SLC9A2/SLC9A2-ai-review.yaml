suggested_questions:
- question: >-
    Does human NHE2 physiologically exchange K(+) for H(+) at the plasma membrane,
    or is K(+)/H(+) antiporter activity restricted to the organellar (NHE6-9) and
    plant/fungal members of the CPA1 family?
- question: >-
    Is NHE2 ever localized to the basolateral membrane in any epithelium, or is
    the ComplexPortal basolateral assignment of the NHE2-CHP complexes an
    unsupported transfer from the basolateral paralog NHE1?
suggested_experiments:
- hypothesis: >-
    Human NHE2 is Na(+)/Li(+)-selective and does not mediate measurable K(+)/H(+)
    exchange at the plasma membrane.
  description: >-
    Express human NHE2 in Na(+)/H(+)-exchange-deficient PS120 cells and measure
    cation selectivity (Na(+), Li(+), K(+), Rb(+)) by pH-stat and fluorescence-based
    intracellular-pH recovery assays under defined ionic gradients, comparing with
    an organellar NHE (e.g. NHE6/NHE9) as a positive K(+)/H(+) control.
- hypothesis: >-
    Endogenous NHE2 is confined to the apical/brush-border membrane in human
    gastrointestinal and renal epithelia, with no basolateral pool.
  description: >-
    Perform quantitative apical-vs-basolateral surface biotinylation and confocal
    immunolocalization of endogenous NHE2 in polarized human intestinal and renal
    epithelial models, using validated isoform-specific antibodies and NHE2
    knockout controls.
knowledge_gaps:
- gap_statement: >-
    Whether human plasma-membrane NHE2 has any physiological monovalent-cation
    selectivity beyond Na(+)/Li(+) (in particular whether it catalyses K(+)/H(+)
    exchange) is unresolved.
  boundary: >-
    The cloned exchanger reconstitutes Na(+)/H(+) exchange and UniProt records only
    the Na(+)-for-H(+) reaction, but a direct, quantitative selectivity series for
    human NHE2 at the plasma membrane has not been reported; the phylogenetic
    K(+)/H(+) assertions derive from organellar and plant/fungal family members.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: >-
    Resolving the cation selectivity defines whether family-level K(+)/H(+)
    annotations apply to this plasma-membrane isoform and sharpens its molecular
    function beyond the generic family inference.
  resolution: >-
    Measure the monovalent-cation selectivity of purified or heterologously
    expressed human NHE2 under controlled ionic conditions.
  provenance:
  - reference_id: PMID:34108458
    supporting_text: subcellular localization, cation selectivity, and regulation in response to diverse stimuli
