core_functions:
- description: >-
    Electroneutral apical Na(+)/H(+) exchange: NHE2 catalyses the 1:1 exchange of
    extracellular Na(+) for intracellular H(+) at the brush-border (apical) plasma
    membrane of gastrointestinal and renal epithelia, thereby extruding protons to
    regulate intracellular pH and importing Na(+) for transepithelial absorption.
