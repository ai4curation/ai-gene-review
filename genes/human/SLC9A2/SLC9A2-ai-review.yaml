  review:
    summary: >-
      Phylogenetic assertion of K(+)/H(+) antiporter activity propagated across
      the CPA1 family.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The IBA node (PTN008493947) spans a broad family that includes plant
      vacuolar NHX and fungal antiporters and the mammalian organellar NHEs
      (NHE6-9), which are genuine (Na(+),K(+))/H(+) exchangers. Human NHE2 is a
      plasma-membrane isoform characterized biochemically as a Na(+)/H(+) (and
      Li(+)/H(+)) exchanger; UniProt and the primary literature describe its
      reaction only as Na(+) for H(+), with no evidence of physiological K(+)/H(+)
      exchange. The K(+)/H(+) activity is most plausibly an over-broad family-level
      propagation to a Na(+)-selective plasma-membrane member. Flagged as
      over-annotated rather than removed because K(+) handling by mammalian
      plasma-membrane NHEs has not been definitively excluded.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN008493947
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          The IBD node spans the broad CPA1 family, including plant vacuolar NHX,
          fungal antiporters and the mammalian organellar NHE6-9, which are genuine
          (Na(+),K(+))/H(+) exchangers; the K(+)/H(+) activity does not transfer to
          the Na(+)-selective plasma-membrane member NHE2.
    supported_by:
    - reference_id: file:human/SLC9A2/SLC9A2-uniprot.txt
      record_section: ["CC:CATALYTIC ACTIVITY"]
      supporting_text: "Reaction=Na(+)(in) + H(+)(out) = Na(+)(out) + H(+)(in);"
