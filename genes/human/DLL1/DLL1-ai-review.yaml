  review:
    summary: >-
      DLL1 is a canonical DSL-family Notch ligand; the PAINT node places Notch binding at
      the ancestral Delta/Serrate clade.
    action: ACCEPT
    reason: >-
      Direct binding of DLL1 to NOTCH1/2/3 extracellular domains is experimentally established
      (cell-binding and solid-phase assays, affinity measurements). The IBA correctly captures
      the core function inherited across metazoan Delta/Serrate ligands.
    supported_by:
    - reference_id: file:human/DLL1/DLL1-uniprot.txt
      supporting_text: >-
        Transmembrane ligand protein of NOTCH1, NOTCH2 and NOTCH3 receptors that binds the
        extracellular domain (ECD) of Notch receptor in a cis and trans fashion manner
    - reference_id: PMID:11006133
      supporting_text: >-
        Cell-binding assays showed that soluble forms of Notch1 and Notch3 proteins physically
        bound to the three DSL proteins on the cell surface.
