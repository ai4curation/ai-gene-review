- term:
    id: GO:0048018
    label: receptor ligand activity
  evidence_type: IDA
  original_reference_id: PMID:23839946
  qualifier: enables
  review:
    summary: >-
      DLL1 ectodomain (MNNL-EGF3) is sufficient to activate NOTCH1 in reporter assays, i.e.
      DLL1 acts as a receptor ligand.
    action: ACCEPT
    reason: >-
      Receptor ligand activity is the appropriate general MF for a signaling ligand that binds
      and activates a receptor. Core, together with the more specific Notch binding.
    supported_by:
    - reference_id: PMID:23839946
      supporting_text: >-
        Truncation studies of the Dll1 and Dll4 ectodomains showed that the MNNL-EGF3 region
        was both necessary and sufficient for full activation.
