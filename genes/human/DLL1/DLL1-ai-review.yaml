    - reference_id: file:human/DLL1/DLL1-uniprot.txt
      supporting_text: >-
        Following transinteraction, ligand cells produce mechanical force that depends of
        a clathrin-mediated endocytosis, requiring ligand ubiquitination, EPN1 interaction,
        and actin polymerization
    - reference_id: file:human/DLL1/DLL1-uniprot.txt
      supporting_text: >-
        Ubiquitinated by MIB (MIB1 or MIB2), leading to its endocytosis and subsequent degradation
