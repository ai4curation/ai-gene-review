- term:
    id: GO:0045807
    label: positive regulation of endocytosis
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q61483
  - ensembl:ENSMUSP00000014917
  review:
    summary: Endocytosis terms (rat/mouse Dll1).
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      DLL1 is the endocytic cargo whose MIB1-dependent clathrin-mediated internalization generates
      the pulling force for Notch activation. It is endocytosed rather than an effector of
      the endocytic machinery.
