    label: plasma membrane
  supported_by:
  - reference_id: file:human/DLL1/DLL1-uniprot.txt
    supporting_text: >-
      Transmembrane ligand protein of NOTCH1, NOTCH2 and NOTCH3 receptors that binds the extracellular
      domain (ECD) of Notch receptor in a cis and trans fashion manner
  - reference_id: PMID:11006133
    supporting_text: >-
      Cell-binding assays showed that soluble forms of Notch1 and Notch3 proteins physically
      bound to the three DSL proteins on the cell surface.
  - reference_id: PMID:23839946
    supporting_text: >-
      Plate-based and cell binding assays revealed a specific, calcium-dependent interaction
      between cell-surface and recombinant Notch receptors and ligand molecules.
- description: >-
