- term:
    id: GO:0048630
    label: skeletal muscle tissue growth
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q61483
  - ensembl:ENSMUSP00000014917
  review:
    summary: >-
      Myogenesis: inhibition of myoblast differentiation and muscle growth (mouse Dll1).
    action: KEEP_AS_NON_CORE
    reason: >-
      Developmental role of mouse Dll1 transferred by orthology (ISS/Ensembl Compara). DLL1
      contributes to this process as the Notch ligand presented by the signal-sending cell;
      the process is a downstream, tissue-specific outcome of DLL1-Notch signaling rather
      than the core molecular role, so it is retained as non-core.
    supported_by:
    - reference_id: file:human/DLL1/DLL1-uniprot.txt
      supporting_text: >-
        During early development, inhibits myoblasts differentiation from the medial dermomyotomal
        lip and later regulates progenitor cell differentiation.
    - reference_id: file:human/DLL1/DLL1-uniprot.txt
      supporting_text: >-
        Maintains myogenic progenitors pool by suppressing differentiation through down-regulation
        of MYOD1 and is required for satellite cell homing and PAX7 expression.
