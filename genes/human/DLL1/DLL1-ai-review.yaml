- term:
    id: GO:0005576
    label: extracellular region
  evidence_type: NAS
  original_reference_id: PMID:11823422
  qualifier: located_in
  review:
    summary: >-
      Extracellular region annotation based on soluble Delta1 experiments.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      DLL1 is a transmembrane protein; the soluble form used in PMID:11823422 is an engineered
      ectodomain. Although ectodomain shedding occurs, full ligand activity requires the membrane-bound,
      intracellular-domain-containing form.
    supported_by:
    - reference_id: PMID:11823422
      supporting_text: >-
        Here we show that soluble Delta1 (sD1) activates Notch2 (N2), but much more weakly
        than full-length Delta1 (fD1).
