      Negative regulation of Notch signaling (IBA), reflecting cis-inhibition by Delta ligands.
    action: KEEP_AS_NON_CORE
    reason: >-
      Delta/Serrate ligands co-expressed with Notch in the same cell inhibit signaling in
      cis; NOTCH2NL relieves DLL1-mediated cis-inhibition. The PAINT node placement is plausible;
      retained as non-core.
    supported_by:
    - reference_id: PMID:29856955
      supporting_text: >-
        At the molecular level, NOTCH2NL function by activating the Notch pathway through
        inhibition of cis Delta/Notch interactions.
    - reference_id: file:human/DLL1/DLL1-uniprot.txt
      supporting_text: through inhibition of cis DLL1-NOTCH2 interactions
- term:
