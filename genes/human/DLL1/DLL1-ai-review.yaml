core_functions:
- description: >-
    Cell-surface DSL ligand that binds the EGF-repeat ectodomain of NOTCH1/2/3 (calcium-dependent)
    and, when presented in trans and endocytosed after MIB1 ubiquitination, activates Notch
    signaling in the adjacent cell.
  molecular_function:
    id: GO:0005112
    label: Notch binding
  directly_involved_in:
