id: Q04446
gene_symbol: GBE1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: GBE1 is a cytosolic glucan branching enzyme that transfers a terminal segment of an alpha-1,4-linked
  glucan chain to a glucose 6-hydroxyl group, creating an alpha-1,6 branch. It works with glycogen synthase
  to construct branched, soluble glycogen. Deficient branching produces poorly branched polyglucosan and
  causes glycogen storage disease type IV or adult polyglucosan body disease, with variable hepatic, neuromuscular
  and neurological presentations.
