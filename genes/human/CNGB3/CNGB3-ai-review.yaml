core_functions:
- description: CNGB3 contributes ligand-binding and pore-forming structures to the
    CNGA3/CNGB3 cone channel, coupling intracellular cGMP recognition to cation conduction.
    Direct human structures resolve three CNGA3 subunits and one CNGB3; beta3 alone
    is not asserted to form a functional channel. cAMP activation is a supported secondary
    capability. Full-length canonical human CNGB3 and engineered N-terminal truncations
    provide the structural evidence, whereas natural isoform 2, lacking residues 590–594
    in the nucleotide-binding domain, remains functionally unresolved. Cone outer-segment
    localization is supported by mouse ortholog and alpha-partner studies together
    with human surface-channel experiments.
