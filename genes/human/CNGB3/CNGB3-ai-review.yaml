id: Q9NQW8
gene_symbol: CNGB3
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CNGB3 is the beta subunit of the cone photoreceptor cyclic-nucleotide-gated
  cation channel. It assembles with CNGA3 in a heterotetramer containing three alpha
  subunits and one beta subunit. CNGB3 contributes to the ion-conduction pathway,
  selectivity filter and cyclic-nucleotide-binding machinery, shaping ligand sensitivity
  and pore gating. Intracellular cGMP controls the cone membrane current during visual
  transduction. Pathogenic CNGB3 variants can disrupt channel function and cause achromatopsia
  or related cone disorders.
