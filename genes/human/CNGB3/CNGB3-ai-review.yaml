  review:
    summary: Retain direct cAMP activation of the assembled human channel.
    action: KEEP_AS_NON_CORE
    reason: 'The actual human retinal CNGB3/oocyte study compares wild-type heteromers with CNGA3 homomers:
      CNGB3 enhances relative cAMP efficacy and apparent affinity, while CNGB3 alone produces no functional
      channel in the reported experiment. The null T383fsX construct behaves like the alpha homomer when
      coexpressed, and S435F effects are separate from wild type. Purified human channel reconstitution
      independently gives open probabilities of 0.004 with cAMP and 0.28 with cGMP at 10 micromolar; these
      preparation-specific values are not native-cone response estimates or binding constants. The original
      enables qualifier is preserved as source data; the reviewed relation should be contributes_to, because
      CNGB3 supplies part of the assembled channel activity.'
    supported_by:
    - reference_id: PMID:12815043
    - reference_id: PMID:34969976
