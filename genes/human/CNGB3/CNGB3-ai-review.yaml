suggested_experiments:
- hypothesis: The five-residue deletion in natural CNGB3 isoform 2 changes ligand
    recognition or assembly independently of surface abundance.
  description: Sequence-verify both natural CNGB3 products and express each with matched
    CNGA3. Compare surface abundance, subunit assembly, cGMP and cAMP concentration-response
    curves, and single-channel behavior; include full-length canonical and engineered
    truncation controls. Distinguish activation from direct binding using an independent
    ligand-binding measurement.
  experiment_type: Product-resolved assembly, binding and electrophysiology
- hypothesis: Native cone membrane organization constrains the channel behavior measured
    in heterologous preparations.
  description: Combine validated endogenous CNGB3 labeling with membrane-resolved
    imaging and cone patch recordings in an appropriate retinal model, separating
    alpha-partner colocalization from direct beta3 membrane localization.
  experiment_type: Native localization and channel physiology
