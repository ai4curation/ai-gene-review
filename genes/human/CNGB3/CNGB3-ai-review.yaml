  - statement: Purified human CNGA3/CNGB3 forms a functional 3:1 cGMP-gated channel with beta3 contributions
      to the asymmetric pore.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected complete human full-length cloning/purification Methods, reconstituted-current
      Results and structure descriptions were read. The apo structure establishes 3:1 composition and
      beta3 pore contributions; later ligand-bound work resolves opening. No figure-pixel or whole-supplement
      read is claimed.
