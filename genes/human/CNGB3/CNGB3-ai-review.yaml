- question: Does natural CNGB3 isoform 2 retain cGMP binding and channel contribution despite deletion
    of residues 590–594 across part of the resolved nucleotide-binding pocket?
  experts:
  - Cone-channel structural biologists and electrophysiologists
- question: How closely do native human cone subunit stoichiometry and membrane distribution match recombinant
    3:1 CNGA3/CNGB3 preparations and mouse localization?
  experts:
  - Retinal cell biologists
- question: What conditions permit the secondary cAMP response to influence native cone currents?
  experts:
  - Photoreceptor electrophysiologists
suggested_experiments:
- hypothesis: The five-residue deletion in natural CNGB3 isoform 2 changes ligand recognition or assembly
    independently of surface abundance.
  description: Sequence-verify both natural CNGB3 products and express each with matched CNGA3. Compare
    surface abundance, subunit assembly, cGMP and cAMP concentration-response curves, and single-channel
    behavior; include full-length canonical and engineered truncation controls. Distinguish activation
    from direct binding using an independent ligand-binding measurement.
  experiment_type: Product-resolved assembly, binding and electrophysiology
- hypothesis: Native cone membrane organization constrains the channel behavior measured in heterologous
    preparations.
  description: Combine validated endogenous CNGB3 labeling with membrane-resolved imaging and cone patch
    recordings in an appropriate retinal model, separating alpha-partner colocalization from direct beta3
    membrane localization.
  experiment_type: Native localization and channel physiology
