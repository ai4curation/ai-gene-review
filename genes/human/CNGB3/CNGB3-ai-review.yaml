  - statement: Human CNGA3/CNGB3 channels carry cGMP-activated membrane currents whose gating changes
      during extracellular MMP exposure.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected complete original human-construct Methods and channel Results were read. The
      experiments measure heteromeric currents and MMP-dependent gating; apparent activation affinity
      is not isolated CNGB3 binding affinity, and calcium supporting MMP action is not itself a calcium-permeability
      assay.
- id: PMID:37463923
  title: Conformational trajectory of allosteric gating of the human cone photoreceptor cyclic nucleotide-gated
    channel.
