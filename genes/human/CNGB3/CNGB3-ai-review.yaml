      are distinguished from human CNGB3 79–809/CNGA3 152–694 nanodisc constructs. Resolved cGMP occupancy
      includes beta3; occupied closed states and the inferred rather than time-resolved gating trajectory
      remain explicit.
- id: PMID:34969976
  title: Structure of the human cone photoreceptor cyclic nucleotide-gated channel.
