description: ASPHD2 is a single-pass type II membrane protein whose C-terminal domain belongs to the aspartyl/asparaginyl
  beta-hydroxylase family of Fe(II)/2-oxoglutarate-dependent dioxygenases. Unlike its paralog ASPHD1,
  it keeps both iron-binding histidines and the 2-oxoglutarate-binding residues of ASPH, so it may be
  an active dioxygenase, but its substrate and function are unknown. It has been detected in a lymphocyte
  membrane proteome, and large-scale interaction screens repeatedly recover the Golgi xylose kinase FAM20B
  as a partner.
