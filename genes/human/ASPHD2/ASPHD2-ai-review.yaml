suggested_questions:
- question: Does ASPHD2 hydroxylate Asp or Asn residues in EGF-like domains like ASPH, or a different
    substrate, and is its partner FAM20B a substrate or a co-factor in Golgi glycosylation?
suggested_experiments:
- description: Assay purified ASPHD2 for 2-oxoglutarate turnover and Asp/Asn hydroxylation of EGF-domain
    peptides, with H283A/H328A mutants, and localize it relative to the Golgi.
