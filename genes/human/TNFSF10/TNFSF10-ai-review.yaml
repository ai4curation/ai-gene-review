core_functions:
- description: Membrane-bound or soluble TNFSF10/TRAIL homotrimers bind TNFRSF10A/DR4 and 
    TNFRSF10B/DR5 at the cell surface or in the extracellular region to initiate TRAIL-activated, 
    FADD/CASP8-dependent extrinsic apoptotic signaling.
  molecular_function:
    id: GO:0005164
    label: tumor necrosis factor receptor binding
  directly_involved_in:
  - id: GO:0036462
    label: TRAIL-activated apoptotic signaling pathway
  locations:
  - id: GO:0005886
    label: plasma membrane
  - id: GO:0005576
    label: extracellular region
  supported_by:
  - *id005
  - *id002
  - *id003
proposed_new_terms: []
suggested_questions:
- question: Should GO add a more precise TRAIL receptor binding child that names TNFSF10 binding to 
    TNFRSF10A/TNFRSF10B and distinguishes the signaling death receptors from TNFRSF10C/TNFRSF10D 
    decoy binding?
  experts: []
- question: Should Reactome-to-GOA export attach TNFSF10 extracellular-region rows only to 
    ligand-receptor events, rather than to downstream CFLAR/CASP8 events that are part of the TRAIL 
    pathway but no longer contain the ligand as an acting molecule?
  experts: []
suggested_experiments: []
