id: P50591
gene_symbol: TNFSF10
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'TNFSF10, also called TRAIL or Apo2L, is a type II transmembrane TNF-family cytokine that
  can remain at the cell surface or be released as a soluble extracellular ligand. Its extracellular TNF-homology
  domain forms homotrimers that bind TNFRSF10A/DR4 and TNFRSF10B/DR5 death receptors, as well as TNFRSF10C/D
  decoy receptors, to initiate FADD- and CASP8-dependent TRAIL-activated extrinsic apoptotic signaling.
  TRAIL receptor engagement can also produce contextual NF-kappaB outputs and immune-cell regulatory effects,
  while the zinc site and identical subunit binding are structural features of the trimeric ligand.'
alternative_products:
