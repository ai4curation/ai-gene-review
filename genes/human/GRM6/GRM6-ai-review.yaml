  review:
    summary: Adenylate-cyclase-inhibiting glutamate receptor activity; family-level effector, not the native one.
    action: MODIFY
    reason: The IBA is placed on the group II/III mGluR node and the IEA is a Compara transfer from rat; group III
      receptors do inhibit adenylyl cyclase via Gi in heterologous systems (Reactome). But in the cell where mGluR6
      works, the ON bipolar cell, the receptor signals through Go to gate the TRPM1 channel, and loss of Galpha-o
      (mouse) abolishes the ON response. The receptor activity itself is sound; the parent term without the effector
      clause is the accurate claim for human mGluR6.
    proposed_replacement_terms:
