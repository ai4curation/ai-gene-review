- term:
    id: GO:0007268
    label: chemical synaptic transmission
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P35349
  - ensembl:ENSRNOP00000000249
  review:
    summary: Synaptic transmission at the photoreceptor to ON bipolar synapse; mGluR6 is its postsynaptic receptor.
    action: MODIFY
    reason: The mouse knockout shows mGluR6 is essential for transmission from photoreceptors to ON bipolar cells,
      where it is the receptor that carries the glutamate signal, so it takes part in glutamatergic synaptic transmission
      itself. The IEA term (chemical synaptic transmission) is correct but general, and the IBA term (regulation
      of glutamatergic transmission) fits the presynaptic group III receptors on the same node better than mGluR6,
      which mediates rather than modulates the transmission.
    proposed_replacement_terms:
    - id: GO:0035249
      label: synaptic transmission, glutamatergic
    supported_by:
    - reference_id: PMID:7889569
      supporting_text: The results demonstrate that mGluR6 is essential in synaptic transmission to the ON bipolar
        cell
- term:
    id: GO:0007626
    label: locomotory behavior
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q5NCH9
  - ensembl:ENSMUSP00000130728
  review:
    summary: Locomotory behavior; a downstream consequence of losing the ON visual pathway in knockout mice.
    action: MARK_AS_OVER_ANNOTATED
    reason: The mouse source (Takao 2000) shows Grm6-null mice fail to suppress wheel running at light onset because
      they do not respond to light; circadian rhythm is normal. mGluR6 acts in visual transmission, and the locomotor
      change is an indirect behavioural readout of that, not a process the receptor executes.
    supported_by:
    - reference_id: PMID:10842024
      supporting_text: This study clearly demonstrates that the dysfunction of the ON visual pathway in metabotropic
        glutamate receptor subtype 6-deficient mice impairs their behavioral responsiveness to light
