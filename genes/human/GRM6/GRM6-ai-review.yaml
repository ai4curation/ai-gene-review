  review:
    summary: Golgi membrane; biosynthetic transit of an overexpressed plasma-membrane receptor.
    action: MARK_AS_OVER_ANNOTATED
    reason: The IDA (and the UniProt subcellular-location line it feeds) comes from human mGluR6 expressed in transfected
      cells, where the wild-type receptor reaches the cell surface and is also seen in ER and Golgi on its way there;
      disease mutants are the ones retained. Under the organelle policy a plasma-membrane receptor's transit pool
      seen only after overexpression is not a residence, and the native location is the ON-bipolar dendritic tip.
      Not wrong, but over-annotated.
