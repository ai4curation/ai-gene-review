id: O15303
gene_symbol: GRM6
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: GRM6 encodes metabotropic glutamate receptor 6 (mGluR6), a group III class C G protein-coupled receptor
  with a large extracellular Venus-flytrap glutamate-binding domain, a cysteine-rich domain and seven transmembrane
  helices; like other class C receptors it forms homodimers. In the retina it is expressed in rod and cone ON (depolarizing)
  bipolar cells and concentrated at their dendritic tips, where it is the postsynaptic receptor for glutamate released
  by photoreceptors. In darkness tonic glutamate activates mGluR6, which through the heterotrimeric G protein Go
  keeps the TRPM1 cation channel closed; the fall in glutamate at light onset deactivates the receptor, the channel
  opens and the cell depolarizes. It works within a signalling complex with TRPM1, nyctalopin, GPR179 and the RGS7/RGS11-Gbeta5
  GTPase-activating proteins. Loss of mGluR6 in mice abolishes ON-bipolar responses, and biallelic human variants
  cause autosomal recessive complete congenital stationary night blindness (CSNB1B); disease missense variants retain
  the receptor in the endoplasmic reticulum. In heterologous cells group III receptors inhibit adenylate cyclase,
  and in human melanocytes, which lack Galpha-o, mGluR6 signalling instead enhances TRPM1-dependent calcium uptake.
