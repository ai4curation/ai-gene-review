- term:
    id: GO:0009584
    label: detection of visible light
  evidence_type: TAS
  original_reference_id: PMID:9215706
  qualifier: involved_in
  review:
    summary: Light detection; the receptor detects glutamate, not light, but is required for vision.
    action: MODIFY
    reason: Detection of light is the photoreceptor's step (light absorbed and converted into a molecular signal).
      mGluR6 acts one synapse later, carrying the photoreceptor signal into ON bipolar cells; loss of it in mice
      and humans abolishes ON responses with intact a-waves. The essence (required for vision) is sound, so the
      claim is visual perception.
    proposed_replacement_terms: &id009
    - id: GO:0007601
