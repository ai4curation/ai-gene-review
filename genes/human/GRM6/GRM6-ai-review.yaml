core_functions:
- description: Postsynaptic G protein-coupled glutamate receptor of retinal ON bipolar cells. At the dendritic tips
    it binds glutamate released by photoreceptors in the dark and, through Go, keeps the TRPM1 transduction channel
    closed; light-driven fall in glutamate deactivates it so the cell depolarizes. Required for the ON pathway in
    mouse knockouts and in human CSNB1B.
  molecular_function:
    id: GO:0098988
    label: G protein-coupled glutamate receptor activity
  directly_involved_in:
  - id: GO:0007216
    label: G protein-coupled glutamate receptor signaling pathway
  - id: GO:0035249
    label: synaptic transmission, glutamatergic
  locations:
  - id: GO:0044292
    label: dendrite terminus
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:30027108
    supporting_text: In the dark, tonic release of glutamate activates mGluR6, keeping the channel closed; at light
      onset, decrease in glutamate release and deactivation of mGluR6 lead to channel opening and membrane depolarization.
  - reference_id: PMID:7889569
    supporting_text: The results demonstrate that mGluR6 is essential in synaptic transmission to the ON bipolar
      cell
  - reference_id: PMID:19966281
    supporting_text: TRPM1-L localization is developmentally restricted to the dendritic tips of ON BCs in colocalization
      with mGluR6
suggested_questions:
- question: How does activated Go (Galpha-o or Gbeta-gamma) close TRPM1 downstream of mGluR6, and is the coupling
    direct?
- question: Does human mGluR6 inhibit adenylate cyclase in any native cell, or is that coupling confined to heterologous
    expression?
suggested_experiments:
- hypothesis: Activated Go subunits released by mGluR6 bind TRPM1 directly to close it.
  description: Reconstitute mGluR6, Go and TRPM1 with nyctalopin in a heterologous cell or lipid bilayer and test
    channel closure by purified Galpha-o-GTP versus Gbeta-gamma, with binding-interface mutants.
status: COMPLETE
