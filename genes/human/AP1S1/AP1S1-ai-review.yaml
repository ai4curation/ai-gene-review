description: 'AP1S1 encodes sigma1A, the small subunit of adaptor protein complex 1 (AP-1), the clathrin
  adaptor that sorts transmembrane cargo between the trans-Golgi network and endosomes. AP-1 is a heterotetramer
  of two large chains (gamma and beta1), a medium chain (mu1) and a small chain (sigma1); in humans the
  gamma, mu1 and sigma1 positions are each filled by one of several paralogs, and sigma1A is the ubiquitously
  expressed member of the sigma1 set, with sigma1B and sigma1C showing more restricted expression. The
  complex is recruited to membranes by Arf1-GTP together with phosphatidylinositol 4-phosphate, which
  unlocks it into a cargo-binding conformation, and it then links selected membrane proteins to the clathrin
  lattice.


  Within the complex, sigma1A is not an inert structural filler. Cargo is selected through two classes
  of cytosolic sorting signal that bind different parts of AP-1: tyrosine-based YxxO motifs bind the mu1
  subunit, while acidic dileucine motifs bind neither subunit alone but a composite site formed by the
  gamma and sigma1 chains together. sigma1A supplies the hydrophobic pockets of that site, and a solved
  AP-1 structure shows a dileucine-mimicking viral peptide bound directly in a pocket on sigma1. Substitutions
  at the sigma1A pocket residues abolish signal binding, and sigma1A is also required for the complex
  to assemble and to associate with TGN and endosomal membranes at all. Cargoes routed this way include
  the copper-transporting ATPases ATP7A and ATP7B, the lysosomal membrane protein LIMP-II, tyrosinase
  en route to maturing melanosomes, and basolaterally sorted proteins in polarized epithelia; HIV-1 Nef
  and Vpu subvert the same site to redirect host immune receptors.


  Loss of sigma1A function causes MEDNIK syndrome (also called IDEDNIK), an autosomal recessive multisystem
  disorder combining intellectual disability, enteropathy, deafness, peripheral neuropathy, ichthyosis
  and keratodermia, together with a distinctive copper metabolism defect that mixes features of Menkes
  and Wilson diseases. Truncating, splice-site and missense alleles all converge on the same mechanism:
  failure of sigma1A to assemble into AP-1 and to recognise dileucine cargo. Knockdown in zebrafish disrupts
  skin formation, pigmentation and spinal neural network development and is rescued by wild-type but not
  truncated human AP1S1, and knockout in intestinal epithelial cells mislocalises tight-junction proteins
  and breaks the epithelial barrier.'
