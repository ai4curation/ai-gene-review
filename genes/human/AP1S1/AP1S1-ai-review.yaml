    reason: 'A presynaptic terminal is a place a ubiquitous coat adaptor can legitimately be found without
      it being what the protein is for. The donor''s evidence is IDA from PMID:20203623, a paper titled
      for sigma1B. That is a trap, not a defect. The cached record is abstract-only, MGI curators read
      the full text, and the abstract itself contrasts the two isoforms -- it states that the ubiquitously
