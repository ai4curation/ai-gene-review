- term:
    id: GO:0005829
    label: cytosol
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-182263
  qualifier: located_in
  review:
    summary: Reactome models the uncoated/unassembled AP-1 pool as cytosolic; this row is the step 'Degradation
      of MHC I Complex'.
    action: KEEP_AS_NON_CORE
    reason: 'True but not where the protein does its job. AP-1 is a peripheral membrane complex that cycles
      on and off membranes -- UniProt classes sigma1A as a peripheral membrane protein on the cytoplasmic
      side -- so a soluble cytosolic pool genuinely exists between rounds of coat assembly. Several of
      these Reactome steps are explicitly the uncoating or dissociation half of that cycle, which is precisely
      when the complex is cytosolic and precisely when it is not functioning. Reactome cites this reaction
      to every participant of the AP-1 coat, so the row is one pathway-level assertion projected across
      the complex rather than independent evidence about sigma1A: a QuickGO query by this reference returns
      a handful of gene products, essentially the AP-1 subunits plus clathrin and the reaction''s cargo.
      Retained as non-core: the informative locations are the Golgi, TGN and endosomal membranes annotated
      separately.'
    supported_by:
    - *id001
    - *id003
