- term:
    id: GO:0005198
    label: structural molecule activity
  evidence_type: IMP
  original_reference_id: PMID:39269494
  qualifier: enables
  review:
    summary: Proposed. GOA gives AP1S1 exactly one molecular-function term, and it is a complex-level
      one inherited from a domain signature. The subunit's own contribution -- holding the AP-1 heterotetramer
      together, without which the complex neither assembles nor reaches its membranes -- is directly demonstrated
      in human cells and is annotated nowhere.
    action: NEW
    reason: 'GO:0005198 is defined as ''The action of a molecule that contributes to the structural integrity
      of a complex'', which is precisely what this evidence shows, and it is the subunit-level function
      that the schema asks for alongside a contributes_to complex activity. The demonstration is in human
      cells and runs in both directions. Positive: myc-tagged wild-type sigma1A co-immunoprecipitates
      with endogenous gamma1, restores gamma1 protein levels in HAP1 cells knocked out for all three sigma1
      isoforms, and rescues gamma1 staining on TGN and endosomal membranes. Negative: the MEDNIK L90P
      substitution reduces gamma1 co-immunoprecipitation to 0-13% of wild type, fails to restore gamma1
      levels, and fails to rescue membrane association -- and the authors attribute the membrane defect
      to impaired assembly of the whole complex rather than to a separate targeting role. So the structural
      contribution is not inferred from the protein being small and bound: it is the measured consequence
      of removing it. Coded IMP rather than IDA because the readouts come from transfected constructs
      in a knockout background, which is a genetic perturbation and not observation of the native protein.
      This is a coverage gap rather than an over-annotation -- QuickGO carries no GO:0005198 annotation
      for human AP1S1 -- and it is kept deliberately generic: the more interesting subunit-level activity,
      dileucine sorting-signal binding, has no GO term at all and is filed under proposed_new_terms.'
    supported_by:
    - reference_id: PMID:39269494
      supporting_text: The σ1A L90P variant is largely unable to assemble into the AP-1 complex.
    - reference_id: PMID:39269494
      supporting_text: Reciprocal co-immunoprecipitation experiments showed that assembly of γ1 with σ1AL90P
        was reduced to 0–13% relative to σ1AWT
    - reference_id: PMID:39269494
      supporting_text: Expression of myc-tagged σ1AWT in these cells resulted in partial restoration of
        endogenous γ1 levels, whereas expression of myc-tagged σ1AL90P led to minimal or no recovery relative
        to untransfected cells
    - *id004
    - reference_id: PMID:39269494
      supporting_text: These data indicated that the σ1A L90P substitution disrupts the association of
        γ1 with TGN/endosomes, likely due to impaired assembly of the whole AP-1 complex.
    - *id008
core_functions:
- description: As the small subunit of AP-1, sigma1A forms the gamma1-sigma1A hemicomplex that recognises
    acidic dileucine sorting signals in the cytosolic tails of transmembrane cargo, thereby selecting
    cargo into clathrin-coated carriers at the trans-Golgi network and endosomes. The activity belongs
    to the hemicomplex, not to sigma1A alone -- these signals bind no single AP subunit -- but the cargo-binding
    pockets are on sigma1A itself, and substituting them abolishes binding.
  contributes_to_molecular_function:
