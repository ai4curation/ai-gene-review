      of the dileucine cargo-signal binding site.'
    action: ACCEPT
    reason: 'Accepted, and better supported than its IEA code suggests -- but the support is for a contribution,
      not for an activity sigma1A has alone. Dileucine sorting signals do not bind any single AP subunit;
      they bind the gamma-sigma1 hemicomplex, and the same experiments that establish this show mu1 and
      beta1 binding weakly or not at all. The evidence is specific to sigma1A rather than inherited from
      AP-1 generically: sigma1A paired with gamma1, but not with the AP-2 alpha or AP-3 delta subunits,
      binds the LIMP-II and tyrosinase tails; point substitutions in sigma1A itself (V88D, I103S, A63D)
      abolish the binding; and in the AP-1 crystal structure that contains this exact protein as chain
      S, the HIV-1 Vpu dileucine mimic is bound in a hydrophobic pocket on sigma1 itself. Two caveats
      recorded rather than acted on. First, the term''s GO definition says ''responsible for the formation
      of endocytic vesicles'', which does not describe AP-1; the label fits, the definition does not,
      and that mismatch is raised as a suggested question rather than used to justify a MODIFY, since
      GO_Central itself applies this term to AP-1 sigma subunits. Second, no GO term exists for the actual
      activity -- binding a dileucine sorting signal -- which is filed as a proposed new term and an ontology
      knowledge gap. In core_functions this is expressed as contributes_to_molecular_function, which is
      the reading the evidence supports.'
