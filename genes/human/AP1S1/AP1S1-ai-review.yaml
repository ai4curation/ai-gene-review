      and the homologous σ1A V88D and I103S and σ3A V94D and L109S substitutions.
  knowledge_gaps:
  - gap_statement: 'No GO term expresses what sigma1A actually does at the molecular level: bind an acidic
      dileucine sorting signal. The activity has to be annotated through GO:0035615 clathrin-cargo adaptor
      activity, whose definition -- bringing a cargo protein together with clathrin, responsible for the
      formation of endocytic vesicles -- names the wrong compartment for AP-1 and describes the whole
      complex rather than the subunit''s contribution.'
    boundary: What is known is unusually precise. Dileucine signals bind the gamma1-sigma1A hemicomplex
      and not any single subunit; the pockets are on sigma1A; V88D, I103S and A63D abolish binding; a
      crystal structure containing this protein shows a dileucine mimic in the sigma1 pocket; and a human
      disease allele destroys the interaction. The gap is purely in the vocabulary available to record
      it.
    gap_kind:
