- id: PMID:21097499
  title: Conservation and diversification of dileucine signal recognition by adaptor protein (AP) complex
    variants.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Supplies the residue-level evidence used in this review: sigma1A V88D and I103S, homologous
      to sigma2 V88D and L103S, abolish signal binding, and sigma1A Arg 15 is the equivalent of sigma2
      Arg 15. Also shows all three sigma1 isoforms recognise the signals, so the activity is shared across
      sigma1A/B/C rather than private to AP1S1. Verified against the cached full text; the residue positions
      were checked independently against the live P61966 sequence. Missed by affinage.'
