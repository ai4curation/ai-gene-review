- term:
    id: GO:0000139
    label: Golgi membrane
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-421831
  qualifier: located_in
  review:
    summary: sigma1A is on the Golgi membrane as part of the AP-1 coat; this row is the Reactome step
      'trans-Golgi Network Coat Assembly'.
    action: ACCEPT
    reason: 'The Golgi membrane is where AP-1 assembles and where sigma1A therefore sits. UniProt records
      the protein on the cytoplasmic face of Golgi-derived coated vesicles from direct evidence, and AP-1
      recruitment to that membrane is the Arf1-GTP/PI4P-dependent step these Reactome reactions model.
      sigma1A is not a passenger in this: in cells lacking all three sigma1 isoforms, wild-type sigma1A
      restores gamma1 staining on TGN/endosomal membranes and the MEDNIK L90P variant does not, so the
      small subunit is required for the coat to be there at all. Reactome cites this reaction to every
      participant of the AP-1 coat, so the row is one pathway-level assertion projected across the complex
      rather than independent evidence about sigma1A: a QuickGO query by this reference returns a handful
      of gene products, essentially the AP-1 subunits plus clathrin and the reaction''s cargo. Accepted
      as correct and core, but the six Golgi-membrane rows are six steps of one coat-assembly pathway
      and should be read as a single line of evidence.'
