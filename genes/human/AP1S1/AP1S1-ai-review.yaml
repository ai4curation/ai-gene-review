      the grounds that the title names a paralog would be exactly the error of overruling a curator from
      evidence I cannot see. Graded non-core instead: the localisation is real but neuronal and tissue-restricted,
      whereas sigma1A is a ubiquitously expressed adaptor subunit whose core business is TGN/endosomal
      sorting. Brain is nonetheless the tissue of highest sigma1A expression, so the annotation is not
      incongruous.'
