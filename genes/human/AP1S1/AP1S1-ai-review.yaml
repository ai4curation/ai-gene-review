- id: file:human/AP1S1/AP1S1-bioinformatics/RESULTS.md
  title: AP1S1 dileucine-site residue conservation analysis (this review)
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Analysis written for this review. Fetches nine AP-complex sigma subunits live from
      UniProt, asserts their lengths, and maps the structurally defined sigma2 dileucine pocket onto each.
      Confirms all five literature-named sigma1A positions and reproduces the homologies the literature
      states. Its most useful output is negative: the verified non-binder sigma4 retains the same 4/5
      residues as the binders, so conservation at this pocket is not by itself evidence of the activity.'
- id: file:human/AP1S1/AP1S1-deep-research-affinage.md
  title: Affinage mechanistic annotation for AP1S1 (human)
  reference_review:
    relevance: MEDIUM
    correctness: LOW_QUALITY
    review_notes: 'Machine-generated deep-research record whose own head-to-head self-evaluation scored
      pairwise = tie rather than win, tripping the trust gate; marked LOW_QUALITY on that basis and every
      claim taken from it was re-verified against its PMID. It does describe the right protein and found
      the disease and cell-biology literature well. Two errors: it presents PMID:2040623 as though the
      cDNA were human when the paper used rat and mouse brain libraries, and it states sigma1A nucleates
      a complex with Rabex-5 when PMID:27411398 explicitly reports Rabex-5 binds sigma1B and not sigma1A.
      It missed the entire dileucine literature and every structural paper, i.e. the whole molecular-function
      story.'
