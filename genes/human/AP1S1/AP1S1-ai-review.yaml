- id: PMID:39269494
  title: 'Revising pathogenesis of AP1S1-related MEDNIK syndrome: a missense variant in the AP1S1 gene
    as a causal genetic lesion.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The single most important paper for this gene and absent from GOA entirely. Verified
      against the cached full text. Shows the L90P variant causes full MEDNIK, is largely unable to assemble
      into AP-1, fails to rescue gamma1 association with TGN/endosomes in triple sigma1-knockout cells,
      and abolishes gamma1-sigma1A binding to the LIMP-II and tyrosinase dileucine tails. Supplies the
      subunit-specific evidence behind the core molecular function and the reason the hemicomplex reading,
      not an 'enables' reading, is correct.
- id: PMID:17360967
  title: The gamma/sigma1 and alpha/sigma2 hemicomplexes of clathrin adaptors AP-1 and AP-2 harbor the
    dileucine recognition site.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The paper that settled which subunits carry the dileucine site, by expressing AP-1 and
      AP-2 subunits singly and as hemicomplexes. Establishes that gamma/sigma1 binds strongly while beta1/mu1
      and the individual chains do not, which is what makes the contributes_to reading of the molecular
      function correct. Missed by the affinage report. Abstract-only in the cache; the quoted result is
      in the abstract.
  full_text_unavailable: true
