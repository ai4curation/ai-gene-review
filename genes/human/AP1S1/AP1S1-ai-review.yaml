    - CURATION
    dark_aspect: MF_DARK
    status: OPEN
    significance: Cargo-signal recognition is the step that makes an adaptor an adaptor. Without a term
      for it, the difference between a subunit that selects cargo and one that merely holds the complex
      together is invisible in GO, and the many AP subunits across AP-1, AP-2 and AP-3 that share this
      activity cannot be grouped by it.
    resolution: Create the proposed 'dileucine sorting signal binding' term and annotate AP1S1, AP1S2,
      AP1S3, AP2S1, AP3S1 and their large-subunit partners to it with contributes_to.
