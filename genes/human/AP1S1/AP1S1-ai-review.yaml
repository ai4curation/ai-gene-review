- term:
    id: GO:0006898
    label: receptor-mediated endocytosis
  evidence_type: TAS
  original_reference_id: PMID:9733768
  qualifier: involved_in
  review:
    summary: Asserts AP1S1 acts in receptor-mediated endocytosis. AP-1 is not an endocytic adaptor and
      the cited paper contains no endocytosis experiment.
    action: REMOVE
    reason: 'The GO definition is explicit that this is a cell-surface process: a receptor on the cell
      surface binds ligand and ''the plasma-membrane region containing the receptor-ligand complex then
      undergoes endocytosis''. AP-1 does not work at the plasma membrane. Its recruitment is Arf1-GTP-
      and PI4P-dependent at the TGN, and the current statement of its remit is sorting between the TGN
      and endosomes plus polarized sorting to the basolateral and somatodendritic domains -- never internalisation
      from the cell surface. The adaptor that does clathrin-mediated endocytosis is AP-2, whose small
      subunit is the paralog AP2S1, and the dileucine work makes the division of labour concrete by testing
      AP-1 and AP-2 hemicomplexes as distinct entities. The cited paper supports none of it: it is a gamma2-adaptin
      identification study whose sigma1A content is a yeast two-hybrid interaction and whose localisation
      result is paranuclear, non-overlapping with gamma1-adaptin. This is a traceable author statement,
      not an experimental annotation by a curator who read an assay we cannot see, so deferring to it
      is not required; and the argument here is a positive biological one about compartment, not an inference
      from the abstract being about another gene. The same paper''s other row, AP-1 complex membership,
      is accepted -- that claim it does support.'
    supported_by:
    - *id003
    - *id005
    - reference_id: PMID:15377783
      supporting_text: TGN localization of AP-1 depends on the small GTPase, Arf1, and the phosphoinositide,
        PI-4-P.
    - reference_id: PMID:9733768
      supporting_text: Immunofluorescence microscopy analysis has revealed that gamma2-adaptin is localized
        to paranuclear vesicular structures that are not superimposed on structures containing gamma1-adaptin.
    - &id009
