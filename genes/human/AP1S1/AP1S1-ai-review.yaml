  review:
    summary: Statement-level placement of AP-1 on the lysosome-related-organelle route, from a Rab32/Rab38
      review.
    action: KEEP_AS_NON_CORE
    reason: 'The lysosomal membrane is a destination of AP-1-derived carriers rather than a place AP-1
      works: the review describes AP-1 acting with BLOC-2 and AP-3 on early/recycling endosome tubules,
      from which cargo is delivered onward to lysosome-related organelles. The coat itself is shed before
      arrival. The claim is also entirely complex-level and NAS -- nothing in the paper concerns sigma1A
      specifically, and QuickGO returns 178 annotations over 48 distinct gene products for this one reference,
      which is the signature of a broad review projection. Real but peripheral, so retained as non-core
      rather than removed.'
    supported_by:
