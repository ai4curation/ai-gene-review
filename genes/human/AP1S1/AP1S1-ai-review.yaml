proposed_new_terms:
- proposed_name: dileucine sorting signal binding
  proposed_definition: Binding to an acidic dileucine sorting signal, a short peptide motif of the form
    acidic residue - X - X - X - Leu - Leu/Ile in the cytosolic tail of a transmembrane protein, which
    directs that protein into clathrin-coated carriers at the trans-Golgi network, endosomes or the plasma
    membrane.
  justification: GO can express the tyrosine-based branch of clathrin-adaptor cargo recognition through
    GO:0089710 endocytic targeting sequence binding, whose definition requires an essential tyrosine and
    internalization by clathrin-coated pits, but it has no counterpart for the dileucine branch. Searches
    of QuickGO for 'dileucine', 'sorting signal binding', 'targeting sequence binding' and 'leucine motif
    binding', and enumeration of the molecular-function children of GO:0140312 cargo adaptor activity,
    return nothing that fits. The consequence is that a well-characterised, subunit-attributable activity
    -- demonstrated by yeast three-hybrid, in vitro binding, point mutagenesis and X-ray crystallography,
    and destroyed by a human disease variant -- can currently only be annotated through GO:0035615 clathrin-cargo
    adaptor activity, a complex-level term whose own definition restricts it to the formation of endocytic
    vesicles. The term would apply to the sigma and large subunits of AP-1, AP-2 and AP-3 across eukaryotes.
  proposed_parent:
    id: GO:0005515
    label: protein binding
  supported_by:
  - *id011
  - *id009
  - reference_id: PMID:14691137
    supporting_text: These observations reveal a novel mode of recognition of sorting signals involving
      the gamma/delta and sigma subunits of AP-1 and AP-3.
  - *id012
knowledge_gaps:
- gap_statement: What distinguishes the sigma subunits that bind dileucine signals from the one that does
    not is unidentified. The AP-4 epsilon-sigma4 hemicomplex demonstrably fails to bind these signals,
    yet sigma4 retains the same pocket residues as the binders, so the specificity determinant is not
    the pocket itself.
  boundary: The binding/non-binding phenotypes are firmly established by yeast three-hybrid across AP-1,
    AP-2, AP-3 and AP-4 hemicomplexes, and the pocket residues are known from the AP-2 structure and confirmed
    by mutagenesis in sigma1A, sigma2 and sigma3A. The bioinformatics analysis in this review maps that
    pocket onto all six human sigma paralogs and finds sigma4 scoring 4/5 identical, the same as sigma1A,
    sigma1B and sigma1C.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: It means residue conservation at this site cannot be used to predict dileucine binding
    in an uncharacterised sigma subunit or in a non-model organism, which is exactly the inference an
    automated pipeline would make. The determinant most likely lies in the partner large subunit or in
    conformational accessibility of the pocket, but that has not been tested.
  resolution: Swap the surrounding surface between sigma1A and sigma4, or test chimeric hemicomplexes
    pairing gamma1 with sigma4 and epsilon with sigma1A, and ask which component confers binding.
  provenance:
  - reference_id: PMID:14691137
    supporting_text: These observations reveal a novel mode of recognition of sorting signals involving
      the gamma/delta and sigma subunits of AP-1 and AP-3.
  - reference_id: file:human/AP1S1/AP1S1-bioinformatics/RESULTS.md
    supporting_text: 'Residue identity at this pocket therefore does not discriminate

      binders from the non-binder, and the conservation argument for sigma1A is weaker than

      it appears.'
- gap_statement: Why loss of sigma1A specifically produces the MEDNIK organ spectrum -- skin, intestine,
    ear, peripheral nerve, brain and copper handling -- is unknown. The cellular basis for the division
    of labour between the three sigma1 isoforms has not been established, so it is not known whether the
    phenotype reflects sigma1A's ubiquitous expression, a cargo preference unique to it, or the absence
    of compensation by sigma1B and sigma1C in those tissues.
  boundary: 'The biochemistry gives no isoform difference to work with: all three sigma1 isoforms recognise
    every dileucine signal tested, and all three assemble with gamma1. Expression differs -- sigma1A is
    ubiquitous while sigma1B and sigma1C are restricted -- and the disease alleles are well characterised
    as loss of function.'
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  status: OPEN
  significance: This is what stands between a molecular mechanism and an explanation of the disease, and
    it determines whether raising sigma1B or sigma1C expression could be therapeutic.
  resolution: Tissue-resolved comparison of AP-1 cargo repertoires in sigma1A-null versus sigma1B-null
    and sigma1C-null cells, and a test of whether sigma1B or sigma1C overexpression rescues the sigma1A-null
    epithelial barrier phenotype.
  provenance:
  - reference_id: PMID:21097499
    supporting_text: Although these genetic studies have provided information on the requirement of specific
      AP-1 subunit isoforms at the organismal level, the molecular and cellular bases for these requirements
      are not known.
  - reference_id: PMID:21097499
    supporting_text: It is not known, however, whether most of these combinations occur in cells and whether
      particular subunit isoforms endow the complexes with different functional properties.
- gap_statement: The cargo repertoire that sigma1A selects is not systematically mapped. Individual cargoes
    are known -- ATP7A and ATP7B, LIMP-II, tyrosinase, EGFR, tight-junction proteins -- but they were
    found one at a time, and no unbiased survey has asked which of them depend on the sigma subunit as
    opposed to the complex.
  boundary: The recognition mechanism is solved and a handful of cargoes are validated individually, including
    two whose tails were tested directly against the gamma1-sigma1A hemicomplex. Recent AP-1 vesicle proteomics
    exists but perturbs the gamma1 large subunit rather than sigma1A.
  gap_kind:
  - BIOLOGY
  - CURATION
  dark_aspect: BP_DARK
  status: NARROWING
  significance: Without the repertoire it is not possible to say which parts of the MEDNIK phenotype follow
    from which mis-sorted protein, and GO cannot record has_input relationships for an activity whose
    substrates are only anecdotally known.
  resolution: Apply the existing AP-1 vesicle-proteomics assay to sigma1A-deficient cells rather than
    gamma1-deficient cells, and cross the hits against proteins carrying gamma1-sigma1A-compatible dileucine
    motifs.
  provenance:
  - reference_id: PMID:41032520
    supporting_text: Despite these advances, the full repertoire of cargoes and accessory factors involved
      in AP-1- and AP-4-mediated trafficking remains poorly understood.
  - reference_id: PMID:32306098
    supporting_text: Whether mutations in further subunits of AP-1 will be identified as causing MEDNIK
      syndrome or non-syndromic enteropathy remains to be elucidated.
- gap_statement: Whether the coat-independent role reported for sigma1A -- promoting early-endosome maturation
    by raising endosomal Rabex-5 and Vps34 activity through ArfGAP1 -- operates in human cells, and whether
    it is separable from the complex's sorting function, has not been tested.
  boundary: 'The mechanism was worked out in mouse synaptosomes and rests on an indirect link: Rabex-5
    binds sigma1B and not sigma1A directly, with ArfGAP1 proposed as the connector. It is explicitly presented
    as a mode of action that does not involve AP-1 coated-vesicle formation.'
  gap_kind:
  - BIOLOGY
  - CURATION
  dark_aspect: MF_DARK
  status: OPEN
  significance: If real in human cells it would be a second, structurally distinct molecular function
    for the same subunit, which no current annotation captures; it is the reason no NEW human annotation
    was created for endosome maturation in this review.
  resolution: Reproduce the ArfGAP1-dependent Rabex-5 recruitment in human cells using the triple-sigma1-knockout
    background already available, comparing sigma1A rescue with an assembly-incompetent variant such as
    L90P to separate coat-dependent from coat-independent effects.
  provenance:
  - reference_id: PMID:27411398
    supporting_text: Unexpectedly, Rabex-5 binds σ1B, not σ1A
  - reference_id: PMID:27411398
    supporting_text: A direct sorting function of AP-1 for SV proteins into SV and in SV reformation,
      as indicated by the ‘knock-out’ phenotype, remains to be demonstrated.
suggested_questions:
- question: GO:0035615 clathrin-cargo adaptor activity is defined as 'Bringing together a cargo protein
    with clathrin, responsible for the formation of endocytic vesicles', yet GO_Central applies it to
    AP-1 sigma subunits, which act at the TGN and endosomes rather than in endocytosis. Should the definition
    be broadened to cover non-endocytic clathrin coats, or should AP-1 subunits move to a different term?
  experts:
  - Bonifacino JS
  - Mattera R
- question: All three sigma1 isoforms bind every dileucine signal tested and all assemble with gamma1.
    What then confines the MEDNIK phenotype to loss of sigma1A -- is it purely expression level, or do
    sigma1B and sigma1C fail to substitute for reasons that are not visible in a binding assay?
  experts:
  - Schu P
  - Bonifacino JS
- question: The AP-4 epsilon-sigma4 hemicomplex does not bind dileucine signals even though sigma4 retains
    the pocket residues that matter in sigma1A, sigma2 and sigma3A. Where does the specificity actually
    reside -- in the large subunit, in the surrounding sigma surface, or in whether the pocket is exposed
    in the AP-4 conformation?
  experts:
  - Mattera R
  - Bonifacino JS
  - Hurley JH
- question: Is the ArfGAP1-dependent, coat-independent role of sigma1A in early-endosome maturation a
    general property of the ubiquitous AP-1/sigma1A complex, or a neuron-specific adaptation seen only
    in the synaptosome preparations where it was characterised?
  experts:
  - Schu P
  - Candiello E
suggested_experiments:
- hypothesis: Dileucine-signal binding specificity among AP sigma subunits is conferred by the partner
    large subunit rather than by the sigma pocket, which is why sigma4 retains the pocket residues but
    the AP-4 hemicomplex does not bind.
  description: 'Build chimeric hemicomplexes in the yeast three-hybrid format already validated for this
    question: gamma1 paired with sigma4, epsilon paired with sigma1A, and reciprocal swaps of the sigma
    C-terminal helical region. Score binding against the Nef, tyrosinase and LIMP-II tails, with the wild-type
    gamma1-sigma1A and epsilon-sigma4 pairs as the positive and negative controls. If specificity tracks
    the large subunit, gamma1-sigma4 binds; if it tracks the sigma surface outside the pocket, it does
    not.'
  experiment_type: yeast three-hybrid with chimeric subunits
- hypothesis: sigma1A selects a definable cargo set that only partly overlaps the cargo set selected by
    the gamma1 large subunit, and the MEDNIK phenotype follows from the sigma-dependent subset.
  description: Apply the in vitro AP-1 vesicle-formation assay with label-free quantitative mass spectrometry,
    but comparing wild-type cells against AP1S1-deficient cells rather than the AP1G1-deficient cells
    used previously, and add a rescue arm expressing the assembly-incompetent L90P variant. Cargo lost
    in the knockout and restored by wild-type but not L90P sigma1A is sigma-dependent. Cross the resulting
    list against proteins carrying acidic dileucine motifs compatible with the gamma1-sigma1A preference.
  experiment_type: vesicle reconstitution with quantitative proteomics
- hypothesis: sigma1B and sigma1C can functionally replace sigma1A when expressed in the tissues affected
    in MEDNIK, so the disease reflects expression rather than an intrinsic isoform difference.
  description: Use the CaCo2 AP1S1-knockout intestinal epithelial model, in which tight-junction mislocalisation,
    reduced transepithelial resistance and abnormal lumen formation are established and reversible by
    wild-type AP1S1. Ask whether expressing AP1S2 or AP1S3 at matched levels rescues the same readouts.
    Full rescue argues the isoforms are interchangeable and the disease is a dosage problem; failure to
    rescue points to an isoform-specific property that binding assays have not captured.
  experiment_type: paralog complementation in a knockout epithelial model
