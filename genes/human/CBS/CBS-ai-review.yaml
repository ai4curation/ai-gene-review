core_functions:
- description: CBS catalyzes PLP-dependent beta-replacement reactions that convert serine and homocysteine
    to cystathionine in cytosolic transsulfuration, and can generate H2S when cysteine replaces serine.
    SAM-dependent allostery, heme-mediated regulation and oligomeric assembly regulate this catalytic
    unit; they are not separate core occupations.
