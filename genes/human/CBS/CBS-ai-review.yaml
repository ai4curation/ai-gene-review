taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Human cystathionine beta-synthase (CBS) is a PLP-dependent, heme-containing enzyme that catalyzes
  condensation of L-serine with L-homocysteine to form cystathionine, the first step of transsulfuration
  toward cysteine. It also uses cysteine with homocysteine to generate cystathionine and hydrogen sulfide.
  The principally cytoplasmic enzyme has a C-terminal regulatory region that binds S-adenosylmethionine
  and controls activity and stability; its reduced heme can bind NO and CO and modulate catalysis. CBS
  forms oligomeric assemblies, and human full-length protein can form regulated filaments. A sumoylated
  fraction has also been detected at the nuclear scaffold. Biallelic CBS deficiency causes classical homocystinuria
  through impaired homocysteine metabolism.
