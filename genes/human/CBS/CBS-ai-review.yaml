- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO terms
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: InterPro-to-GO method; direct human chemistry is used to assess the broad PLP-domain
      and CBS-family process mappings.
- id: GO_REF:0000024
  title: Manual transfer of experimentally-verified manual GO annotation data to orthologs by curator
    judgment of sequence similarity
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Curator-mediated manual orthology transfer; direct human H2S catalysis independently
      supports the retained rat-derived process.
- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PAINT ancestral inference; target-as-descendant evidence and short donor lists are not
      circularity or weakness. Exact IBD/MSA placements were not independently reconstructed.
- id: GO_REF:0000043
  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot keyword mapping
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Reviewed UniProt keyword mapping; broad catalytic/lyase mappings are refined to the
      known human reaction, while cofactor context is kept distinct.
- id: GO_REF:0000044
  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot Subcellular Location vocabulary mapping
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Reviewed subcellular-location vocabulary mapping; nuclear residence is independently
      described in the SUMO study and is retained as conditional.
- id: GO_REF:0000107
  title: Automatic transfer of experimentally verified manual GO annotation data to orthologs using Ensembl
    Compara
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Automatic transfer of experimentally grounded ortholog annotations through Ensembl Compara.
      Direct human chemistry corroborates metabolic rows; rat nutrient/hypoxia/apoptosis provenance and
      unresolved construct/transfer limits are documented separately.
- id: GO_REF:0000117
  title: Electronic Gene Ontology annotations created by ARBA machine learning models
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: ARBA electronic rule inference; precise rule conditions were not re-executed, so acceptance
      of metabolic terms rests on direct human enzyme evidence.
- id: GO_REF:0000120
  title: Combined Automated Annotation using Multiple IEA Methods
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Combined electronic methods; all archived supporting entities remain intact and are
      assessed against independent human reaction/localization evidence.
- id: PMID:7929220
  title: Transsulfuration depends on heme in addition to pyridoxal 5'-phosphate. Cystathionine beta-synthase
    is a heme protein.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Human heme/PLP biochemistry and the CBS reaction are explicit in the complete abstract.
      Historical heme-dependence language is not generalized beyond the experiments; later work separates
      heme regulation from PLP catalysis.
- id: PMID:11483494
  title: 'Structure of human cystathionine beta-synthase: a unique pyridoxal 5''-phosphate-dependent heme
    protein.'
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete cached abstract and selected external primary structural text were read. The
      crystallized human 1–413 construct lacks the C-terminal regulatory region and is dimeric; it does
      not establish exclusive dimerization of full-length CBS.
- id: PMID:15520012
  title: Production of the neuromodulator H2S by cystathionine beta-synthase via the condensation of cysteine
    and homocysteine.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete abstract directly describes cysteine/homocysteine beta-replacement and compares
      cysteine-only hydrolysis, substrate kinetics and in vitro reconstitution. It supports H2S-producing
      catalysis, not every downstream H2S phenotype.
