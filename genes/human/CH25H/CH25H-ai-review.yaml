- id: PMID:33239446
  title: Cholesterol 25-hydroxylase suppresses SARS-CoV-2 replication by blocking membrane fusion.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Human primary study (Zang et al., PNAS 2020, full text available). ISG screen identifies
      CH25H as a SARS-CoV-2 restriction factor; a catalytic His-His double mutant abolishes 25-HC production
