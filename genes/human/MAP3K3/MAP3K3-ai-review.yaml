    review_notes: Automated literature synthesis; used for orientation; primary papers cited where available.
core_functions:
- description: MEKK3 is a MAP kinase kinase kinase that binds MEK5 (MAP2K5) through PB1-PB1 heterodimerization and
    phosphorylates and activates it, initiating the MEK5-ERK5 cascade; this module is required for growth-factor
    activation of ERK5 and, in endothelium, is restrained by the CCM complex.
  molecular_function:
    id: GO:0004709
    label: MAP kinase kinase kinase activity
  directly_involved_in:
  - id: GO:0070375
    label: ERK5 cascade
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:10593883
    supporting_text: a dominant active form of MEKK3 stimulates BMK1 activity through MEK5
  - reference_id: PMID:10593883
    supporting_text: MEKK3 activity is required for growth factor mediated cellular activation of endogenous BMK1
  - reference_id: PMID:12912994
    supporting_text: the PB1 domain mediates the association of MEKK2 and MEKK3 with MEK5
  - reference_id: PMID:27027284
    supporting_text: These studies identify gain of MEKK3 signalling and KLF2/4 function as causal mechanisms for CCM
      pathogenesis
- description: In TNF receptor and IL-1R/TLR4 signalling MEKK3 is recruited to RIP1 and TRAF6 complexes and directly
    phosphorylates the IKK complex, acting as a kinase required for IKK-NF-kappaB (and JNK-p38) activation.
