  - reference_id: PMID:11429546
    supporting_text: MEKK3 plays a critical role in TNF-induced NF-kappaB activation
  - reference_id: PMID:14661019
    supporting_text: MEKK3 is crucial for IL-1- and LPS-induced activation of NF-kappaB and JNK-p38 but not ERK
suggested_questions:
- question: Human MAP3K3 lacks the blood vessel development annotation that mouse Map3k3 carries (IMP, PMID:10700190,
    acts_upstream_of_or_within). Should the endothelial MEKK3-MEK5-ERK5-KLF2/4 role be represented for human MAP3K3
    through a more specific process (e.g. a flow/shear-stress response term) rather than a broad developmental term?
- question: Does MEKK3 directly phosphorylate IKKbeta as its physiological NF-kappaB output in TNF signalling, or does
    it act together with other MAP3Ks such as TAK1 in the RIP1/TRAF6 complexes?
- question: Which MEKK3 outputs (MEK5-ERK5 versus MKK3/6-p38, JNK or Hippo LATS1/2) are driven by the CCM-associated
    I441M variant in endothelium in vivo, and which are responsible for lesion formation?
suggested_experiments:
- description: In vitro kinase assays with purified full-length MEKK3 (wild type, K391M, I441M) against MEK5, MKK3,
    MKK6, MKK4, MEK1, IKKbeta and LATS1 to establish direct substrate preference and the effect of the I441M variant.
- description: Endothelial-specific MAP3K3 knockout or PB1-mutant knock-in with phospho-MEK5/ERK5, KLF2/KLF4 and
    shear-response readouts, compared with MAP3K2 loss, to separate paralog-specific from redundant functions.
