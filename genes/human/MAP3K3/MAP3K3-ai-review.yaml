- term:
    id: GO:0035556
    label: intracellular signal transduction
  evidence_type: IDA
  original_reference_id: PMID:15001576
  qualifier: acts_upstream_of_or_within
  review:
    summary: Intracellular signal transduction (acts upstream of or within) from TRAF7-potentiated MEKK3-dependent
      AP1/CHOP activation.
    action: MODIFY
    reason: Correct but very general; the experiment measured AP1 and CHOP activation downstream of MEKK3, and AP1
      activation by MEKK3 proceeds through its MAP2K substrates (SEK/MKK4-JNK, MEK-ERK). The informative replacement
      is MAPK cascade (GO:0000165), which MEKK3 already carries by IBA and TAS; the more specific ERK5 cascade is
      proposed via the ARBA annotation.
    proposed_replacement_terms:
    - id: GO:0000165
      label: MAPK cascade
    supported_by:
    - reference_id: PMID:9006902
      supporting_text: We now demonstrate that MEKK3 activates SEK and MEK, the known kinases targeting SAPK and ERK,
        respectively.
    - reference_id: PMID:15001576
      supporting_text: TRAF7 specifically interacted with MEKK3 and potentiated MEKK3-mediated AP1 and CHOP activation.
- term:
    id: GO:0035556
    label: intracellular signal transduction
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  supporting_entities:
  - ARBA:ARBA00026887
  review:
    summary: ARBA machine-learning assignment of intracellular signal transduction.
    action: MODIFY
    reason: 'Correct but uninformative. The best-defined process for MEKK3 is the MEK5-ERK5 cascade, in which MEKK3 performs
      the MEK5-phosphorylation step (participation, not just requirement): MEKK3 binds MEK5 via PB1 domains, active MEKK3
      drives ERK5 through MEK5, and MEKK3 activity is required for growth-factor activation of endogenous ERK5. ERK5 cascade
      (GO:0070375) is already carried by MAP2K5 and MAPK7, and is proposed identically for MAP3K2.'
    proposed_replacement_terms:
    - id: GO:0070375
      label: ERK5 cascade
    supported_by:
    - reference_id: PMID:10593883
      supporting_text: a dominant active form of MEKK3 stimulates BMK1 activity through MEK5
    - reference_id: PMID:10593883
      supporting_text: MEKK3 activity is required for growth factor mediated cellular activation of endogenous BMK1
    - reference_id: PMID:12912994
      supporting_text: The free PB1 domain of MEKK2 or MEKK3 functions effectively to inhibit the ERK5 pathway but not
        the p38 or JNK pathways
- term:
    id: GO:0043123
    label: positive regulation of canonical NF-kappaB signal transduction
  evidence_type: IEP
  original_reference_id: PMID:12761501
  qualifier: involved_in
  review:
    summary: Positive regulation of canonical NF-kappaB signal transduction from a large-scale cDNA overexpression
      reporter screen.
    action: ACCEPT
    reason: 'The IEP evidence itself (NF-kappaB reporter activation on overexpression) is weak, but the conclusion is strongly
      supported by loss-of-function data: MEKK3-deficient cells fail to activate IKK/NF-kappaB in response to TNF, IL-1 and
      LPS, and MEKK3 directly phosphorylates IKK. A real, physiologically important MEKK3 role.'
    supported_by:
    - reference_id: PMID:12761501
      supporting_text: we identified 299 cDNAs that activate the NF-kappaB pathway
    - reference_id: PMID:11429546
      supporting_text: MEKK3 plays a critical role in TNF-induced NF-kappaB activation
    - reference_id: PMID:11429546
      supporting_text: MEKK3 interacts with RIP and directly phosphorylates IKK
    - reference_id: PMID:14661019
      supporting_text: MEKK3 is crucial for IL-1- and LPS-induced activation of NF-kappaB and JNK-p38 but not ERK
- term:
    id: GO:0046777
    label: protein autophosphorylation
  evidence_type: IDA
  original_reference_id: PMID:15001576
  qualifier: acts_upstream_of_or_within
  review:
    summary: Protein autophosphorylation (acts upstream of or within) from the TRAF7-MEKK3 study.
    action: ACCEPT
    reason: MEKK3 autophosphorylates its activation-loop Ser526, a modification required for its activity; the
      catalytically inactive mutant is not phosphorylated at this site. Autophosphorylation is a genuine, regulatory
      property of MEKK3.
    supported_by:
    - reference_id: PMID:16407301
      supporting_text: phosphorylation of Ser526 occurs via autophosphorylation
    - reference_id: PMID:15001576
      supporting_text: TRAF7 specifically interacted with MEKK3 and potentiated MEKK3-mediated AP1 and CHOP activation.
