- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:12392720
  qualifier: enables
  supporting_entities:
  - UniProtKB:P62258
  review:
    summary: Interaction of MEKK3 with the 14-3-3 protein YWHAE (14-3-3 epsilon) (PMID:12392720; targeted study).
    action: MODIFY
    reason: 'Bare protein binding is uninformative. The partner is a 14-3-3 protein. MEKK3 binding to 14-3-3 is a targeted,
      phosphorylation-dependent regulatory interaction: 14-3-3 docks on phospho-Thr294 (restraining TNF-induced NF-kappaB
      activity) and protects activation-loop phospho-Ser526 from PP2A, and all six 14-3-3 isoforms are recovered with MEKK3
      across independent interactome studies. 14-3-3 protein binding (GO:0071889) is the informative term; it is a regulatory
      property, not a core MEKK3 activity. Consistent with the treatment of the same interactions for MAP3K2.'
    proposed_replacement_terms:
    - id: GO:0071889
      label: 14-3-3 protein binding
    supported_by:
    - reference_id: PMID:12392720
      supporting_text: We identified 14-3-3 proteins as interacting with MEKK3
    - reference_id: PMID:18308725
      supporting_text: Mutation of Thr(294) to alanine abolished 14-3-3-MEKK3 association
    - reference_id: PMID:16407301
      supporting_text: the association between MEKK3 and 14-3-3 was dependent on Ser526 and prevented dephosphorylation
        of Ser526
    - reference_id: PMID:9452471
      supporting_text: The 14-3-3zeta and 14-3-3epsilon isoforms were isolated in a two-hybrid screen for proteins
        interacting with the N-terminal regulatory domain of MEKK3.
