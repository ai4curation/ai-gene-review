taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'MAP3K3 (MEKK3) is a STE11-family serine/threonine protein kinase of the MAP kinase kinase kinase (MAP3K) tier.
  It has an N-terminal amphiphilic helix that binds the CCM adaptor CCM2, an N-terminal PB1 domain, a regulatory region and
  a C-terminal kinase domain nearly identical to that of its paralog MEKK2. MEKK3 phosphorylates and activates MAP kinase
  kinases; its best-established substrate is MEK5 (MAP2K5), which it binds by PB1-PB1 heterodimerization and activates to
  drive the MEK5-ERK5 (BMK1) cascade. It can also activate SEK1/MKK4 (JNK pathway), MEK1 (ERK1/2 pathway) and MKK6 (p38 pathway),
  and in TNF, IL-1 and LPS signalling it is recruited to RIP1 and TRAF6 complexes and directly phosphorylates IKK to activate
  NF-kappaB. MEKK3 activity depends on autophosphorylation of activation-loop Ser526 and is restrained by phospho-Thr294-dependent
  14-3-3 binding and by the CCM complex (KRIT1-CCM2-PDCD10) and STRIPAK; TRAF7 binds MEKK3 and promotes its signalling. MEKK3
  acts in cytoplasmic signalling complexes. In endothelial and endocardial cells MEKK3-MEK5-ERK5 signalling drives KLF2 and
  KLF4 expression; Map3k3-null mice die around E11 with defective blood vessel development, loss of the CCM complex causes
  MEKK3 gain of function, and activating somatic MAP3K3 variants (e.g. I441M) cause sporadic cerebral cavernous malformations
  (CCM5).'
