    label: acetylcholine-gated channel complex
  supported_by:
  - reference_id: PMID:40203823
    supporting_text: with M2 lining the channel pore
  - reference_id: PMID:27375219
    supporting_text: increasing the opening rate and decreasing the closing rate
  - reference_id: PMID:16527851
  - reference_id: PMID:8872460
suggested_questions:
- question: Does the N-terminally shortened P11230-2 product assemble into functional muscle receptors,
    and in which tissues or developmental stages is it expressed?
- question: Which full-source experiments under PMID:8651643 support postsynaptic membrane organization
    and muscle cell development beyond secondary excitotoxic remodeling?
- question: What exact CHRNB1 evidence underlies the IMP nervous-system assertion citing the CHRNB2 epilepsy
    paper PMID:11104662 and the nicotine-behavior assertion citing association study PMID:16874522?
- question: Can the exact ASB6 interaction be reproduced with native membrane-associated beta1, and does
    it alter receptor abundance or turnover?
suggested_experiments:
- description: Compare sequence-verified P11230-1 and P11230-2 with identical alpha1/delta/epsilon partners
    in the same expression system, measuring assembly, surface delivery and single-channel kinetics against
    matched expression controls.
- description: Test whether beta1 perturbation changes postsynaptic architecture after matching receptor
    current and calcium burden, separating a direct organization contribution from secondary excitotoxic
    damage.
