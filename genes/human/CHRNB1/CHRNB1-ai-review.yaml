    label: postsynaptic membrane organization
  evidence_type: IMP
  original_reference_id: PMID:8651643
  qualifier: involved_in
  review:
    summary: Retain uncertainty about the source-specific membrane-organization interpretation.
    action: UNDECIDED
    reason: The authentic PMID:8651643 abstract reports a beta gate mutation, prolonged openings, endplate
      myopathy and extensive postsynaptic membrane remodeling. This is positive structural pathology,
      but does not by itself resolve an organization step performed by normal beta1 versus secondary excitotoxic
      remodeling. The full original body remained inaccessible after bounded publisher/search attempts;
      do not reject the experimental assertion from the abstract or equate every assembly observation
      with membrane organization.
    supported_by:
    - reference_id: PMID:8651643
      supporting_text: extensive remodeling of the postsynaptic membrane
    - reference_id: file:human/CHRNB1/CHRNB1-source-evidence.json
