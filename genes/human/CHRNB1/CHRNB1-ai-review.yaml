    summary: Do not equate receptor affinity changes with direct beta1 acetylcholine binding.
    action: MARK_AS_OVER_ANNOTATED
    reason: The actual mouse P09690 donor has an experimental IMP/PMID:8872460 acetylcholine-binding annotation.
      Its Methods measure ACh competition at assembled mouse receptors in HEK cells, and the beta V266M
      effect on apparent affinity is explained by altered open-state occupancy. This establishes receptor
      allostery, not an acetylcholine contact made by beta1. Independent human receptor structures in
      PMID:40203823 place canonical ACh sites at alpha1–delta and alpha1–epsilon interfaces; the beta1-specific
      mouse gating study PMID:24194945 makes the same functional distinction. GO:0042166 describes binding
      itself. The source assertion overextends receptor-level affinity evidence to direct beta1 binding;
      retain the genuine donor record and beta1 channel role, without a universal claim excluding every
      possible noncanonical ligand interaction.
