  review:
    summary: Retain the exact assay-scoped ASB6 interaction.
    action: KEEP_AS_NON_CORE
    reason: Three literal positive human CHRNB1–ASB6/Q9NWX5 IntAct records under PMID:32296183 describe
      pooling, array and validated yeast two-hybrid assays, including N-terminal Gal4 DNA-binding and
      C-terminal activation-domain fusions. The inspected primary text describes repeated pairwise verification
      and sequence confirmation; dataset-wide orthogonal validation is not a CHRNB1-specific native assay.
      ASB6 is a probable substrate-recognition subunit of an ECS ubiquitin-ligase complex, not independently
      established as the catalytic ligase. Neither a native membrane encounter nor CHRNB1 adaptor/ubiquitination
      activity follows from this pair. Retain generic binding as non-core rather than invent a molecular
      mechanism.
