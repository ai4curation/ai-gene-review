core_functions:
- description: Beta1 supplies pore-lining and gating elements to the muscle acetylcholine receptor, converting
    activation of the assembled receptor into postsynaptic cation current and neuromuscular excitation.
    Human full-length receptor reconstruction and human beta1-mutant kinetic experiments establish performed
    channel work. Canonical transmitter contacts occur at alpha1–delta/epsilon interfaces; apparent-affinity
    changes after beta1 mutation do not by themselves demonstrate beta1 ligand binding. The core uses
    contributes_to for the heteropentamer and does not assign standalone channel activity, fetal/adult
    calcium selectivity to beta1 alone, or equal function to the 72-residue-shortened product.
  contributes_to_molecular_function:
    id: GO:0022848
    label: acetylcholine-gated monoatomic cation-selective channel activity
