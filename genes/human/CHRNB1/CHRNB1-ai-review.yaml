  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN002707651
  - RGD:2349
  review:
    summary: Retain the receptor contribution to muscle contraction.
    action: ACCEPT
    reason: PMID:27375219 directly expresses human CHRNA1/CHRNB1/CHRND/CHRNE in HEK293 cells and measures
      wild-type and beta-mutant channel kinetics. PMID:40203823 establishes the functional full-length
      recombinant human adult heteropentamer and resolves the beta1 M2 pore contribution. This is a subunit
      contribution to an assembled channel, not an autonomous beta1 channel or a demonstration that both
      current products behave identically. Acetylcholine-gated current supplies the excitatory neuromuscular
      step that triggers contraction; beta1 contributes the conducting/gating structure. This does not
      assign actomyosin ATPase chemistry to beta1. The PAINT node is a curated phylogenetic assertion;
      rat P25109 is independently identified as Chrnb1.
