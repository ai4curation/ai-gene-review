id: P11230
gene_symbol: CHRNB1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CHRNB1 encodes the beta1 subunit of the skeletal-muscle nicotinic acetylcholine receptor.
  Beta1 contributes a pore-lining transmembrane helix and allosteric gating elements to a heteropentamer
  containing two alpha1 subunits, delta and either fetal gamma or adult epsilon. Acetylcholine binding
  at alpha1 interfaces opens the assembled cation channel at the neuromuscular postsynaptic membrane,
  depolarizing muscle and initiating contraction. Beta1 pore mutations can prolong channel activation
  and cause slow-channel congenital myasthenic disease. Full-length human receptor reconstructions and
  reconstitution assays establish this channel role; the N-terminally shortened alternative beta1 product
  has not been functionally resolved by those experiments.
alternative_products:
