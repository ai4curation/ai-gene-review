- id: PMID:11104662
  title: CHRNB2 is the second acetylcholine receptor subunit associated with autosomal dominant nocturnal
    frontal lobe epilepsy.
  findings:
  - statement: The inspected experiments establish beta2 epilepsy-related channel effects rather than
      a beta1-specific nervous-system experiment.
  reference_review:
    relevance: LOW
    correctness: MISCITED
    review_notes: Complete selected main Methods/Results/Discussion concern CHRNB2 V287M and CHRNA4/CHRNB2
      receptors; the inspected CHRNB1 mention is an M2 comparison. No beta1 perturbation was established
      in that scope. The original assertion remains UNDECIDED pending precise curator/source evidence;
      unread material is not claimed excluded.
  full_text_unavailable: false
- id: PMID:15701510
  title: Refined structure of the nicotinic acetylcholine receptor at 4A resolution.
  findings:
  - statement: The native Torpedo receptor structure defines the heteropentamer and pore architecture
      that contextualize the muscle receptor family.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Unchanged genuine normal abstract and authenticated shared author PDF. Native Torpedo
      helical membrane tubes and the closed five-subunit structural model are not mislabeled human reconstitution.
      Human beta1 complex membership is independently corroborated by PMID:40203823.
  full_text_unavailable: false
- id: PMID:16874522
  title: Gene-based analysis suggests association of the nicotinic acetylcholine receptor beta1 subunit
    (CHRNB1) and M1 muscarinic acetylcholine receptor (CHRM1) with vulnerability for nicotine dependence.
  findings:
  - statement: CHRNB1 variation is associated with nicotine-dependence measures in the tested families;
      causal beta1 molecular participation remains unresolved.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Identifier and authentic abstract verified; official landing page has abstract/context
      but full original Methods/Results were not recovered, and the indexed author-copy open was rate-limited.
      Positive CHRNB1 SNP/haplotype associations are retained without upgrading them to a demonstrated
      behavioral mechanism.
  full_text_unavailable: true
- id: PMID:21480901
  title: Multiple inhibitory actions of lidocaine on Torpedo nicotinic acetylcholine receptors transplanted
    to Xenopus oocytes.
  findings:
  - statement: Acetylcholine-elicited currents through transplanted Torpedo receptors are inhibited by
      lidocaine through several receptor-level mechanisms.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Authentic abstract explicitly describes Torpedo receptors transplanted to Xenopus oocytes.
      Full original body not recovered; no human construct or beta1-specific autonomous effect is inferred.
  full_text_unavailable: true
- id: PMID:32296183
  title: A reference map of the human binary protein interactome.
  findings:
  - statement: HuRI identifies an assay-supported CHRNB1–ASB6 interaction without establishing receptor
      ubiquitination or native encounter.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Exact main cache retained. Three literal positive IntAct records join human P11230/Q9NWX5
      to Supplementary Table9; actual primary screening/verification methods are recorded. Fusion/yeast
      context and dataset-level validation remain distinct from an endogenous beta1–ASB6 mechanism.
  full_text_unavailable: false
- id: PMID:7531341
  title: Congenital myasthenic syndrome caused by prolonged acetylcholine receptor channel openings due
    to a mutation in the M2 domain of the epsilon subunit.
  findings:
  - statement: Wild-type beta1 participates in assembled muscle receptors; epsilon mutation causes prolonged
      channel openings in the investigated human disease and mouse reconstitution systems.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Unchanged genuine normal abstract. All five authentic PMC primary page images758–762
      were inspected after the PDF request returned a download challenge. Methods 759 explicitly uses
      mouse subunit cDNAs in HEK cells; human patient/control endplates and epsilon T264P are distinguished.
  full_text_unavailable: false
- id: PMID:8651643
  title: A beta-subunit mutation in the acetylcholine receptor channel gate causes severe slow-channel
    syndrome.
  findings:
  - statement: A beta gate mutation prolongs openings and is associated with severe endplate myopathy
      and postsynaptic remodeling.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Authentic identifier/abstract verified; original publisher body and PDF attempts were
      blocked and no complete author copy was recovered. The abstract directly reports beta gate disruption,
      prolonged openings and postsynaptic pathology; detailed construct/organization/development conclusions
      remain limited.
  full_text_unavailable: true
- id: PMID:8872460
  title: New mutations in acetylcholine receptor subunit genes reveal heterogeneity in the slow-channel
    congenital myasthenic syndrome.
  findings:
  - statement: Beta1 mutation alters assembled receptor gating, with human endplate pathology and mouse
      receptor reconstitution providing distinct evidence.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Unchanged genuine normal abstract; authentic author-uploaded full original Methods/Results
      and binding/gating passages were read separately. Mouse receptor cDNAs in HEK cells and human patient
      endplates are distinct. Apparent-affinity shifts are not isolated beta1 ACh-binding measurements.
  full_text_unavailable: false
- id: PMID:27375219
  title: Mutations Causing Slow-Channel Myasthenia Reveal That a Valine Ring in the Channel Pore of Muscle
    AChR is Optimized for Stabilizing Channel Gating.
  findings:
  - statement: Human beta1 pore mutation changes opening/closing kinetics, demonstrating its functional
      contribution to channel gating.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full selected primary Methods36/41/44 and Results55/59/63–65, Discussion75–77 read.
      Human subunit cDNAs in HEK293 are explicit; betaV266A is mature-chain numbering versus precursorVal289Ala.
      Receptor-affinity and kinetic model parameters are distinguished.
  full_text_unavailable: false
- id: PMID:16527851
  title: The human adult subtype ACh receptor channel has high Ca2+ permeability and predisposes to endplate
    Ca2+ overloading.
  findings:
  - statement: Beta1-containing human muscle receptors conduct calcium as a fraction of their cation current.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Authenticated shared full cache and prior primary consultation. Adult human alpha/beta/delta/epsilon
      receptors are tested in rat GH4C1; fetal receptor current is also measured in human myotubes. Epsilon
      explains much of the adult species difference, not beta1 alone.
  full_text_unavailable: false
- id: PMID:40203823
  title: Autoimmune mechanisms elucidated through muscle acetylcholine receptor structures.
  findings:
  - statement: Human receptor structures locate beta1 in the pore and gating machinery while canonical
      ACh sites lie at alpha1–delta/epsilon interfaces.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Full genuine normal source: selected Results20/23–25/48–49 and Methods89/94–95/119/121/127
      read. Wild-type full-length human subunits in HEK cells have tags in delta/epsilon loops. Resting
      and ACh-bound desensitized structures are nonconducting snapshots; electrophysiology independently
      establishes activity. Neither all residues nor both beta1 products are claimed tested.'
  full_text_unavailable: false
- id: PMID:24194945
  title: Energetic contributions to channel gating of residues in the muscle nicotinic receptor β1 subunit.
  findings:
  - statement: Beta1 contributes to allosteric gating, while receptor-affinity measurements and canonical
      transmitter contacts are distinct properties.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full genuine normal source and independently read bounded peer. Mouse beta1 mutagenesis/choline
      single-channel gating assays are distinguished from direct human ligand binding.
  full_text_unavailable: false
