suggested_questions:
- question: Which biochemical step does DNAJC30 perform during replacement of complex I N-module subunits,
    and does that step involve mitochondrial HSP70 or access by CLPXP?
- question: Under which cellular conditions does the demonstrated ATP-synthase association affect ATP
    production, and how is it related to the complex I repair role?
suggested_experiments:
- description: Reconstitute subunit exchange in assembled complex I with DNAJC30 and candidate repair
    partners, measuring direct participation separately from restoration of respiration.
- description: Measure HSP70 ATPase activation with DNAJC30 and appropriate J-domain mutants rather than
    inferring activity from the domain sequence.
- description: Test native ATP-synthase association and ATP production in matched human and mouse systems,
    controlling upstream respiratory-chain activity and separating single-gene loss from Williams-Beuren
    multigene deletion.
