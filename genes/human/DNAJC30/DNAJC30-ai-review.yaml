- term:
    id: GO:0034367
    label: protein-containing complex remodeling
  evidence_type: IMP
  original_reference_id: PMID:33465056
  qualifier: involved_in
  review:
    summary: Retain the inherited proposal for remodeling pre-existing complex I.
    action: NEW
    reason: This is the previously merged authored proposal, not a current GOA assertion. GO:0034367 covers
      acquisition or loss of macromolecules from an existing complex. In PMID:33465056, transient complex-I
      association/co-migration accompanies selective defects in N-module subunit turnover while complex-I
      assembly remains intact; this supports an accessory contribution to exchange within an existing
      complex, beyond the necessity phenotype alone. DNAJC30 is not asserted to be a respiratory catalytic
      subunit or the substrate consumed in that exchange. Direct substrate extraction, CLPXP access and
      HSP70 activation remain mechanistic models rather than measured DNAJC30 activities. The comparator
      audit found no GO:0034367 on CLPX, CLPP or NDUFAF2, whose established proteolysis/assembly roles
      differ; that absence is not treated as evidence of a curation gap. No selected GO-CAM target was
      found, and this process is not an ancestor or descendant of the other process terms retained here.
      No additional NEW term is proposed.
    supported_by:
    - reference_id: PMID:33465056
      supporting_text: significant decrease in the turnover of N-module subunits in assembled complex I
