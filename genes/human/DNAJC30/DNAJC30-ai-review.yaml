- id: PMID:30318146
  title: The 7q11.23 protein DNAJC30 interacts with ATP synthase and links mitochondria to brain development.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Identifier and final citation verified. The separately recovered complete primary article
      establishes native human-brain ATP-synthase association and subunit interactions; the inner-membrane
      immunogold experiment used macaque tissue, and functional knockout assays used mouse cells/tissue.
      Tagged MT-ATP6 was an engineered nuclear-expression construct. Williams-Beuren deletion samples
      do not isolate DNAJC30 effects on ATP-synthase dimers. The source guide identifies the relevant
      Results and Methods and distinguishes the normal cache from the recovered original.
  findings:
  - statement: Native human-brain immunoprecipitation associates DNAJC30 with ATP synthase; human-bait
      two-hybrid assays identify MT-ATP6 and ATP5MC2 interactions.
    reference_section_type: OTHER
  - statement: Macaque immunogold supports inner-membrane localization. Mouse knockout affects neuronal
      morphology, respiration and ATP production; multigene Williams-Beuren samples have a separate interpretive
      scope.
    reference_section_type: OTHER
- id: PMID:32296183
  title: A reference map of the human binary protein interactome.
  findings:
  - statement: Validated binary interaction records support a heterogeneous DNAJC30 partner panel; native
      physiological roles of these interactions remain unresolved.
    reference_section_type: OTHER
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Identifier and original study Methods/Results verified. All 23 current DNAJC30 partner
      products were matched to positive validated two-hybrid and screening records. These are heterologous
      binary interaction data, not individual demonstrations of native mitochondrial complexes; study-wide
      orthogonal validation is not attributed to every target pair.
- id: PMID:33465056
  title: Impaired complex I repair causes recessive Leber's hereditary optic neuropathy.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Identifier and complete primary article verified. Human patient fibroblast and knockout
      HEK293 data support selective N-module turnover in assembled complex I. Transient association and
      turnover evidence support repair participation, while CLPXP access and the exact extraction or delivery
      step remain mechanistic proposals. The study did not find complex-V defects in its tested systems.
  findings:
  - statement: DNAJC30-deficient human cells retain assembled complex I but show impaired rapid turnover
      of selected N-module subunits, supporting a repair role rather than a de-novo assembly requirement.
    reference_section_type: OTHER
  - statement: Complex-V activity, abundance and turnover were unaffected in the tested human systems,
      limiting a universal ATP-synthase regulatory mechanism.
    reference_section_type: OTHER
- id: PMID:34800366
  title: Quantitative high-confidence human mitochondrial proteome and its dynamics in cellular context.
  findings:
  - statement: Human-cell mitochondrial fractionation and membrane-association proteomics identify DNAJC30
      as an integral mitochondrial protein.
    reference_section_type: OTHER
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Identifier, relevant primary Methods and the original supplementary workbook verified.
      Table S1A identifies Q96LL9/DNAJC30 as protein group 9379, worksheet row 322, and classifies it
      as mitochondrial and integral. These data do not alone distinguish the inner from the outer mitochondrial
      membrane.
