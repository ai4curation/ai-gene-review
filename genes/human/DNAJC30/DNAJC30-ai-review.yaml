taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: DNAJC30 is a mitochondrial inner-membrane member of the DnaJ/HSP40 family that is enriched
  in neurons, including large cortical pyramidal neurons. It helps maintain respiratory-chain function
  through turnover and replacement of N-module subunits in assembled complex I. DNAJC30 also binds
  mitochondrial ATP synthase and contributes to regulation of mitochondrial ATP production, with the
  contribution varying across cellular contexts. The gene lies in the chromosome 7q11.23 Williams-Beuren
  syndrome interval; its individual contribution does not explain the full multigene-deletion phenotype.
  Biallelic pathogenic variants cause autosomal-recessive Leber hereditary optic neuropathy.
