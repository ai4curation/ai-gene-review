- term:
    id: GO:1905706
    label: regulation of mitochondrial ATP synthesis coupled proton transport
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  review:
    summary: DNAJC30 can regulate mitochondrial ATP synthesis in the tested context.
    action: ACCEPT
    reason: The literal mouse donor P59041 carries an IMP annotation to this exact regulatory process
      from PMID:30318146. Dnajc30 loss decreased ATP output from isolated mouse cortical mitochondria
      supplied with malate, pyruvate and ADP (Figure 4F and ATP-production Methods), alongside reduced
      neuronal respiration. This is positive support for regulation of mitochondrial ATP production;
      GO:1905706 does not require intrinsic ATP-synthase catalysis. Native human ATP-synthase association
      and subunit-binding evidence provide complementary molecular context, but the ATP-output assay
      does not isolate a direct effect on complex V from upstream respiratory-chain contributions.
      PMID:33465056 found no complex-V activity, abundance or turnover defect in its tested human systems.
      Retain the valid ortholog transfer and include the bounded regulatory role in the ATP-synthase core,
      without claiming that its physical association is the established cause of the output change,
      universal dimer stabilization or a single mechanism in all tissues.
    supported_by:
    - reference_id: PMID:30318146
      supporting_text: resulted in decreased ATP
    - reference_id: PMID:33465056
    propagation_review:
