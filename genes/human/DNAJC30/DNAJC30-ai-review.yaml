core_functions:
- description: Transiently supports selective turnover and replacement of N-module subunits during repair
    of assembled mitochondrial complex I. The precise biochemical step is unresolved.
  directly_involved_in:
  - id: GO:0034367
    label: protein-containing complex remodeling
  locations:
  - id: GO:0005743
    label: mitochondrial inner membrane
  supported_by:
  - reference_id: PMID:33465056
    supporting_text: integral to a complex I repair mechanism
- description: Binds mitochondrial ATP synthase through contacts with its subunits, including MT-ATP6
    and ATP5MC2, and contributes to regulation of mitochondrial ATP production. Mouse neuronal and
    mitochondrial ATP-output phenotypes complement human complex-association evidence. The causal route
    from this association to ATP-output regulation remains unresolved; direct complex-V catalytic modulation
    and a universal effect across tissues are not established.
  molecular_function:
