id: Q96NS5
gene_symbol: ASB16
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ASB16 is an ankyrin repeat and SOCS box protein of the ASB family, with seven ankyrin repeats
  and a C-terminal SOCS box. By homology to characterized family members such as ASB7, it is predicted
  to act as the substrate-recognition subunit of an Elongin B/C-Cullin 5 E3 ubiquitin ligase that targets
  proteins for proteasomal degradation. No substrate or cellular role has been established for ASB16.
