knowledge_gaps:
- gap_statement: ASB16's substrates and biological role are unknown, and whether it assembles a functional
    CRL5 ligase has not been tested.
  boundary: 'Established: ASB-family architecture (seven ankyrin repeats, C-terminal SOCS box) and an
    IBA transfer of CRL5 substrate-receptor activity from ASB7. Not established: any ASB16 substrate,
    partner beyond screen hits, localization or phenotype.'
  gap_kind:
  - BIOLOGY
