- term:
    id: GO:0035556
    label: intracellular signal transduction
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR036036
  review:
    summary: Intracellular signal transduction (IEA, InterPro SOCS box). In ASB proteins the SOCS box
      is the Elongin B/C-Cullin 5-binding module of a ubiquitin-ligase substrate receptor. The signalling
      mapping is inherited from the cytokine-signalling SOCS proteins. Any effect ASB16 has on signalling
      would come from degrading signalling components, which is regulation rather than participation in
      signal transduction. Marked as over-annotated, as in the SOCS4, ASB10 and ASB11 reviews.
    action: MARK_AS_OVER_ANNOTATED
    reason: '[file:human/ASB16/ASB16-uniprot.txt "CC   -!- DOMAIN: The SOCS box domain mediates the interaction
      with the Elongin"] [file:human/ASB16/ASB16-uniprot.txt "FT   DOMAIN          398..450"]'
