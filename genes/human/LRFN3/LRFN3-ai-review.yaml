id: Q9BTN0
gene_symbol: LRFN3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  LRFN3, also known as SALM4, is a type-I single-pass cell-surface adhesion protein
  with extracellular leucine-rich-repeat, immunoglobulin-like, and fibronectin type
  III domains and a short cytoplasmic tail that lacks the C-terminal PDZ-binding motif
  found in SALM1-SALM3. At neuronal synapses, SALM4 forms homophilic trans-cellular
  adhesions and also acts postsynaptically in cis with SALM3 to limit SALM3 engagement
  of presynaptic LAR-family receptor phosphatases, thereby restraining presynapse and
  excitatory-synapse development. Rodent studies additionally link SALM4 to neurite
  branching and suppression of excessive GluN2B-containing NMDA-receptor signaling,
  without demonstrating direct SALM4 binding to NMDA receptors. In primary human
  endothelial cells, LRFN3 supports VEGF-A-induced VEGFR2 Tyr1175 phosphorylation and
  angiogenic responses through an as-yet unidentified membrane-associated mediator.
