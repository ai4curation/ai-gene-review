- term:
    id: GO:0098631
    label: cell adhesion mediator activity
  evidence_type: ISO
  original_reference_id: PMID:18227064
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q8BLY3
  review:
    summary: >-
      Mouse SALM4/Lrfn3 constructs form homophilic trans-cellular associations
      through the extracellular N terminus in heterologous-cell and rat-neuron
      coculture assays, supporting transfer to human LRFN3.
    action: NEW
    reason: >-
      GO:0098631 captures SALM4's experimentally demonstrated trans-cellular adhesion
      activity more informatively than generic protein binding. The tested SALM4
      constructs trace to mouse cDNA, whereas rat brain and hippocampal neurons were
      the native-tissue or coculture hosts. The ISO donor is therefore the mouse
      Lrfn3 ortholog, not a SALM3/SALM5 paralog or the rat host protein; the evidence
      does not imply that human LRFN3 was directly assayed.
    supported_by:
    - reference_id: PMID:18227064
      supporting_text: >-
        Both SALMs 4 and 5 formed homophilic, but not heterophilic associations, whereas
        no trans associations were formed by the other SALMs. The ability of SALM4 to
        form trans interactions is due to its extracellular N terminus because chimeras
        of SALM4 N terminus and SALM2 C terminus can form trans interactions, whereas
        chimeras of SALM2 N terminus and SALM4 C terminus cannot.
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: UniProtKB:Q8BLY3
        source_label: mouse Lrfn3/SALM4
        source_status: SUPPORTS_TRANSFER
        comment: >-
          The experimentally tested SALM4 constructs derive from mouse cDNA; rat
          hippocampal neurons were the coculture host. The transfer is restricted to
          SALM4 homophilic trans adhesion.
