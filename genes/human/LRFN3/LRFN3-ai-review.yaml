- id: PMID:16495444
  title: A novel family of adhesion-like molecules that interacts with the NMDA receptor.
  findings:
  - statement: >-
      The founding SALM-family study established that SALM4 is a single-pass
      membrane adhesion-like protein with extracellular LRR, Ig, and FNIII domains,
      and uniquely lacks the C-terminal PDZ-binding domain present in SALM1-SALM3.
    supporting_text: >-
      The family members, SALM1-SALM4, have a single transmembrane (TM) domain and
      contain extracellular leucine-rich repeats, an Ig C2 type domain, a fibronectin
      type III domain, and an intracellular postsynaptic density-95 (PSD-95)/Discs
      large/zona occludens-1 (PDZ) binding domain, which is present on all members
      except SALM4.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed and cached abstract verified. The SALM4-relevant result is its domain
      architecture and absence of a PDZ-binding tail; the paper's NMDA-receptor and
      PSD-95 experiments concern SALM1 and must not be transferred to LRFN3.
- id: PMID:18227064
  title: The SALM family of adhesion-like molecules forms heteromeric and homomeric
    complexes.
  findings:
  - statement: >-
      In rat brain, SALM4 and SALM5 did not join the strong SALM1-SALM3 complexes,
      suggesting that the two PDZ-tail-lacking proteins mainly form homomeric
      complexes in vivo.
    supporting_text: >-
      In brain, we found that SALMs 1-3 strongly co-immunoprecipitated with each
      other, whereas SALMs 4 and 5 did not, suggesting that SALMs 4 and 5 mainly form
      homomeric complexes.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: >-
      SALM4 mediates homophilic, not heterophilic, trans-cellular adhesion through
      its extracellular N terminus.
    supporting_text: >-
      Both SALMs 4 and 5 formed homophilic, but not heterophilic associations, whereas
      no trans associations were formed by the other SALMs. The ability of SALM4 to
      form trans interactions is due to its extracellular N terminus because chimeras
      of SALM4 N terminus and SALM2 C terminus can form trans interactions, whereas
      chimeras of SALM2 N terminus and SALM4 C terminus cannot.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: >-
      In a HeLa-neuron coculture, SALM4 accumulated at cell-contact points involving
      either neuronal axons or dendrites.
    supporting_text: >-
      Co-culture experiments using HeLa cells and rat hippocampal neurons expressing
      the SALMs showed that SALM4 is recruited to points of contact between the cells.
      In neurons, these points of contact were seen in both axons and dendrites.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed, cached abstract, and the construct-method chain were verified. The
      SALM constructs trace to mouse brain cDNA, while rat brain and hippocampal
      neurons supplied native tissue or coculture hosts. This is the direct source
      for SALM4 homophilic trans adhesion and axonal/dendritic contact localization,
      while also showing that brain complex behavior differs from SALM1-SALM3.
- id: PMID:18585462
  title: Synaptic adhesion-like molecules (SALMs) promote neurite outgrowth.
  findings:
  - statement: >-
      Epitope-tagged SALMs, including SALM4, were distributed throughout cultured
      hippocampal neurons in axons, dendrites, and growth cones.
    supporting_text: >-
      Expression of epitope-tagged proteins in cultured hippocampal neurons showed
      that SALMs are distributed throughout neurons, including axons, dendrites, and
      growth cones.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: >-
      Overexpression and loss-of-function perturbations implicated all five SALMs in
      neurite outgrowth, while SALM2/SALM4 chimera experiments implicated the SALM N
      terminus rather than a SALM4 PDZ tail.
    supporting_text: >-
      Over-expression of each SALM resulted in enhanced neurite outgrowth, but with
      different phenotypes. Neurite outgrowth could be reduced by applying antibodies
      targeting the extracellular leucine rich regions of SALMs and with RNAi. Through
      over-expression of deletion constructs, we found that the C-terminal PDZ binding
      domains of SALMs 1-3 are required for most aspects of neurite outgrowth. In
      addition, by using a chimera of SALMs 2 and 4, we found that the N-terminus is
      also involved in neurite outgrowth.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed and cached abstract verified; primary cultured-hippocampal-neuron study.
      Supports a SALM4 neurite-outgrowth role, but the detailed PDZ-tail mechanism
      applies only to SALM1-SALM3 because SALM4 lacks that motif.
- id: PMID:19681166
  title: Reticulon 3 is an interacting partner of the SALM family of adhesion molecules.
  findings:
  - statement: >-
      A reticulon-3C species co-immunoprecipitated with SALM1-SALM4 from brain, and
      the shared SALM LRR region mediated the interaction.
    supporting_text: >-
      This interaction was shown to occur through the LRR domain, which is found on
      all SALMs. To determine whether this relationship also occurs in brain, we
      performed immunoprecipitation using antibodies to SALMs 1-4. A 19-kDa band,
      identified as reticulon 3C, bound to all four SALMs, whereas a 90-kDa band,
      which did not comigrate with any known reticulon 3 variant, bound to SALMs 2
      and 3.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: >-
      The authors proposed that RTN3 may participate in SALM trafficking, but did not
      establish this as a demonstrated SALM4 mechanism.
    supporting_text: >-
      These results show that reticulon 3 may play a role in the trafficking of the
      SALM family of adhesion molecules.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed and cached abstract verified. Supports the Reactome SALM4-RTN3 event at
      family level, but the trafficking consequence is explicitly tentative and is
      not a core LRFN3 function.
- id: PMID:20600927
  title: Flotillin-1 mediates neurite branching induced by synaptic adhesion-like molecule
    4 in hippocampal neurons.
  findings:
  - statement: >-
      Flotillin-1 is required for SALM4-induced neurite branching in cultured
      hippocampal neurons.
    supporting_text: >-
      When each of SALMs 1-5 was overexpressed, siRNA knockdown of flot-1 prevented
      neurite branching by SALM4. Overall, our data reveal a flot-1 signaling pathway
      for hippocampal neurite branching that is regulated by SALM4.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: >-
      The flotillin-1 branch-promoting pathway depends on lipid-raft microdomains,
      SoHo proteins, the actin cytoskeleton, and the exocyst complex.
    supporting_text: >-
      We show that induction of neurite outgrowth by flot-1 depends on amino acids
      134-151 as well as lipid raft microdomains, SoHo proteins to regulate the actin
      cytoskeleton, and the exocyst complex to deliver new membrane proteins to
      growing neurites.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed and cached abstract verified; primary cultured-hippocampal-neuron study.
      Directly supports the SALM4-flotillin-1 neurite-branching pathway represented
      by Reactome, although the experiments are not human-specific.
- id: PMID:27480238
  title: SALM4 suppresses excitatory synapse development by cis-inhibiting trans-synaptic
    SALM3-LAR adhesion.
  findings:
  - statement: >-
      The five-member family mapping establishes that SALM4 is Lrfn3, distinct from
      SALM1/Lrfn2, SALM2/Lrfn1, SALM3/Lrfn4, and SALM5/Lrfn5.
    supporting_text: >-
      Synaptic cell adhesion-like molecules (SALMs; also known as Lrfns) represent a
      family of leucine-rich repeat (LRR)-containing synaptic cell adhesion molecules,
      with five known members: SALM1/Lrfn2, SALM2/Lrfn1, SALM3/Lrfn4, SALM4/Lrfn3 and
      SALM5/Lrfn5 (refs 12, 13, 14, 15).
    reference_section_type: INTRODUCTION
    full_text_unavailable: false
  - statement: >-
      Salm4 deletion increased hippocampal excitatory and inhibitory synapse numbers.
    supporting_text: >-
      These results suggest that SALM4 deletion increases the number of excitatory
      and inhibitory synapses in the hippocampus.
    reference_section_type: RESULTS
    full_text_unavailable: false
  - statement: >-
      SALM4 cis-associates with SALM3 and suppresses SALM3-dependent presynaptic
      differentiation by reducing the trans-synaptic interaction of SALM3 with LAR.
    supporting_text: >-
      SALM4 cis-interacts with SALM3, inhibits trans-synaptic SALM3 interaction with
      presynaptic LAR family receptor tyrosine phosphatases and suppresses
      SALM3-dependent presynaptic differentiation.
    reference_section_type: ABSTRACT
    full_text_unavailable: false
  - statement: >-
      Removing Salm3 genetically rescued the excess excitatory synapse phenotype of
      Salm4-null mice, supporting the inhibitory SALM4-SALM3 mechanism in vivo.
    supporting_text: >-
      Importantly, deletion of Salm3 in Salm4(-/-) mice (Salm3(-/-); Salm4(-/-))
      normalizes the increased excitatory synapse number.
    reference_section_type: ABSTRACT
    full_text_unavailable: false
  - statement: >-
      SALM3 and SALM5, but not SALM4, directly induce presynaptic differentiation in
      contacting axons; SALM4 instead restrains those synaptogenic paralogs.
    supporting_text: >-
      SALM3 and SALM5 (but not the other SALMs) have synaptogenic activities,
      promoting both excitatory and inhibitory presynaptic differentiation in
      contacting axons18 via trans-synaptic interactions with presynaptic LAR family
      receptor tyrosine phosphatases19.
    reference_section_type: INTRODUCTION
    full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full PMC text and PubMed metadata verified. This is the decisive gene-specific
      SALM4/Lrfn3 study for negative regulation of excitatory synapse development,
      cis inhibition of SALM3-LAR adhesion, synaptic localization, and the distinction
      from SALM3/SALM5 positive synaptogenic activity.
- id: PMID:31170000
  title: SALM4 regulates angiogenic functions in endothelial cells through VEGFR2 phosphorylation
    at Tyr1175.
  findings:
  - statement: >-
      In primary human umbilical-vein endothelial cells, SALM4 silencing selectively
      reduced VEGF-A-induced VEGFR2 Tyr1175 phosphorylation and downstream signaling.
    supporting_text: >-
      SALM4 silencing in HUVECs and Salm4 knockout (KO) in lung endothelial cells
      (ECs) of Salm4-/- mice suppressed phosphorylation of VEGFR2 tyrosine (Y) 1175
      (Y1173 in mice) and downstream signaling upon VEGF-A stimulation. However,
      VEGFR2 phosphorylation at Y951 (Y949 in mice) and Y1214 (Y1212 in mice) remained
      unchanged.
    reference_section_type: ABSTRACT
    full_text_unavailable: false
  - statement: >-
      SALM4 depletion inhibited VEGF-A-driven endothelial angiogenic functions,
      including leakage, sprouting, and migration.
    supporting_text: >-
      Knockdown and KO of SALM4 inhibited VEGF-A-induced angiogenic functions of ECs.
      SALM4 depletion reduced endothelial leakage, sprouting, and migratory activities.
    reference_section_type: ABSTRACT
    full_text_unavailable: false
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full PMC text and PubMed metadata verified. This supplies direct human LRFN3
      perturbation evidence in HUVECs and reveals a non-neuronal VEGFR2-regulatory
      role, but the unidentified molecular mediator and vascular context make it
      secondary to the conserved synaptic core.
- id: PMID:34588597
  title: SALM4 negatively regulates NMDA receptor function and fear memory consolidation.
  findings:
  - statement: >-
      Lrfn3-null mice showed increased hippocampal NMDAR-mediated, but not
      AMPAR-mediated, transmission involving GluN2B-containing NMDARs.
    supporting_text: >-
      In the present study, we found that SALM4-knockout (KO) (Lrfn3−/−) mice
      displayed abnormally increased NMDAR-mediated, but not AMPAR-mediated, synaptic
      transmission involving the NMDAR GluN2B subunit and the presynaptic receptor
      tyrosine phosphatase PTPσ.
    reference_section_type: INTRODUCTION
    full_text_unavailable: false
  - statement: >-
      SALM4 suppresses excessive GluN2B-NMDAR function and selectively constrains
      long-term contextual fear-memory consolidation in male mice.
    supporting_text: >-
      These results suggest that SALM4 suppresses excessive GluN2B-NMDAR (not AMPAR)
      function and fear memory consolidation (not acquisition).
    reference_section_type: ABSTRACT
    full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full PMC text and PubMed metadata verified. Provides gene-specific mouse KO
      physiology and behavioral evidence that extends SALM4's inhibitory synaptic
      role to NMDAR signaling; no direct SALM4-NMDAR binding is demonstrated.
core_functions:
- description: >-
    Uses its extracellular adhesion domains at the neuronal plasma membrane to bind
    SALM4 on an apposed cell and mediate homophilic trans-cellular adhesion at synaptic
    contacts. This adhesion activity is distinct from the SALM3/SALM5 interaction with
    presynaptic LAR-family receptor phosphatases.
  molecular_function:
    id: GO:0098631
    label: cell adhesion mediator activity
  directly_involved_in:
  - id: GO:0099560
    label: synaptic membrane adhesion
  locations:
  - id: GO:0005886
    label: plasma membrane
  - id: GO:0045202
    label: synapse
  supported_by:
  - reference_id: PMID:18227064
    supporting_text: >-
      Both SALMs 4 and 5 formed homophilic, but not heterophilic associations, whereas
      no trans associations were formed by the other SALMs. The ability of SALM4 to
      form trans interactions is due to its extracellular N terminus because chimeras
      of SALM4 N terminus and SALM2 C terminus can form trans interactions, whereas
      chimeras of SALM2 N terminus and SALM4 C terminus cannot.
- description: >-
    Binds SALM3 in cis at the postsynaptic membrane and limits SALM3 engagement of
    presynaptic LAR-family receptor phosphatases, thereby negatively regulating
    SALM3-dependent presynapse assembly and excitatory-synapse development. LRFN3/SALM4
    lacks a PDZ-binding tail and is not assigned the direct positive synaptogenic
    activity of SALM3 or SALM5.
  molecular_function:
