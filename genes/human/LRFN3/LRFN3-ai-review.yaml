      normalizes the increased excitatory synapse number.
proposed_new_terms: []
suggested_questions:
- question: >-
    Is the postsynaptic LRFN3-SALM3-LAR inhibitory mechanism conserved in human
    excitatory neurons, and how strongly does it constrain excitatory versus inhibitory
    presynapse assembly at endogenous expression levels?
- question: >-
    Which extracellular and transmembrane interfaces distinguish LRFN3 homophilic
    trans adhesion from its SALM3 cis interaction, and how does its PDZ-tail-lacking
    cytoplasmic region couple these interactions to intracellular regulation?
- question: >-
    Which membrane-associated mediator connects LRFN3 to VEGFR2 Tyr1175 phosphorylation
    in human endothelial cells, given that direct binding to VEGFR2, NRP1, VE-PTP, and
    PTP1B was not detected?
- question: >-
    Are the flotillin-dependent neurite-branching and GluN2B-NMDA-receptor phenotypes
    downstream of the SALM3 cis-inhibitory mechanism, homophilic adhesion, or separate
    LRFN3 membrane-signaling pathways?
suggested_experiments:
- hypothesis: >-
    Endogenous human neuronal LRFN3 restrains presynapse assembly through cis binding
    to LRFN4/SALM3 rather than through direct engagement of presynaptic LAR-family
    phosphatases.
  description: >-
    Generate LRFN3-null human iPSC-derived excitatory neurons and compare wild-type,
    LRFN3 rescue, adhesion-defective LRFN3 mutants, and matched LRFN4 single- and
    double-knockout conditions in neuron-neuron and neuron-fibroblast synapse-formation
    assays. Quantify endogenous LRFN3-LRFN4 cis proximity, LRFN4-LAR trans engagement,
    presynaptic marker recruitment, and miniature synaptic currents.
  experiment_type: human neuronal genetics, epistasis, and synapse-formation assay
- hypothesis: >-
    Distinct surfaces of the LRFN3 ectodomain mediate homophilic trans adhesion and
    SALM3 cis binding.
  description: >-
    Map interaction interfaces using purified mammalian LRFN3 and SALM3 ectodomains,
    quantitative cell-aggregation and binding assays, and structure-guided mutagenesis.
    Test surface-expression-matched mutants for selective loss of trans homophilic
    adhesion or cis SALM3 binding, then rescue each activity in LRFN3-null neurons.
  experiment_type: quantitative adhesion biochemistry and structure-guided rescue
- hypothesis: >-
    A lipid-raft-associated LRFN3 partner, rather than VEGFR2 itself, selectively
    promotes VEGFR2 Tyr1175 phosphorylation in human endothelial cells.
  description: >-
    Endogenously tag LRFN3 in primary HUVECs and combine acute VEGF-A stimulation with
    proximity labeling, cross-linking proteomics, and phosphoproteomics in control,
    LRFN3-depleted, wild-type-rescue, and interaction-defective-rescue cells. Validate
    candidate mediators by reciprocal perturbation while measuring VEGFR2 site-specific
    phosphorylation, sprouting, migration, and barrier permeability.
  experiment_type: endogenous proximity proteomics and endothelial functional rescue
