- description: Catalyzes the Mg2+-dependent transfer of the beta,gamma-diphosphoryl group of ATP to D-ribose
    5-phosphate, producing PRPP and AMP in the cytosol. This reaction makes the activated ribose-phosphate
    donor used by nucleotide biosynthesis and salvage pathways.
