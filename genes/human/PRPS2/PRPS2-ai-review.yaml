id: P11908
gene_symbol: PRPS2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: PRPS2 encodes ribose-phosphate pyrophosphokinase 2, a cytosolic Mg2+-dependent PRPP synthetase
  that transfers the beta,gamma-diphosphoryl group of ATP to D-ribose 5-phosphate to produce 5-phospho-alpha-D-ribose
  1-diphosphate (PRPP) and AMP. PRPS2 forms homohexamers that can stack into higher-order filaments in
  vitro, and the hexamer/filament interfaces help organize active-site and allosteric-site function. Like
  PRPS1, PRPS2 feeds de novo and salvage nucleotide biosynthesis by supplying PRPP, but PRPS2 is less
  sensitive to purine feedback inhibition and can support enhanced purine nucleotide and SAM production
  in cancer contexts.
