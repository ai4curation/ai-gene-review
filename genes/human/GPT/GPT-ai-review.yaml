core_functions:
- description: Cytosolic PLP-dependent alanine aminotransferase reversibly interconverts L-alanine plus
    2-oxoglutarate with pyruvate plus L-glutamate. It directly executes alanine turnover; net flux is
    context dependent. Native human liver ALT1 is a homodimer; extracellular detection is not its
    defining metabolic role.
