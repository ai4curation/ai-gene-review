    label: extracellular exosome
  evidence_type: HDA
  original_reference_id: PMID:19056867
  qualifier: located_in
  review:
    summary: Retain the curated detection in human urinary exosome preparations.
    action: KEEP_AS_NON_CORE
    reason: The original human urinary-vesicle proteomic study supports a contextual compartment
      observation. Its abstract describes the large-scale assay but not the target-specific peptide
