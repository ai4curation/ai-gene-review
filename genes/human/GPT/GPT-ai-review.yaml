  label: Homo sapiens
description: 'GPT encodes cytosolic alanine aminotransferase ALT1, a homodimeric pyridoxal 5''-phosphate-dependent
  enzyme. It catalyzes reversible transamination of L-alanine and 2-oxoglutarate to pyruvate and L-glutamate,
  linking alanine turnover with glucose and amino-acid metabolism. Human liver protein has been purified and
  characterized, and ALT1 is detected in tissues including liver and kidney. Alanine breakdown supplies pyruvate
  for further metabolism, while reverse flux can produce alanine. ALT1 can also be detected in plasma and extracellular
  vesicle preparations; these observations do not establish secretion as its defining physiological function.
  The related mitochondrial enzyme is encoded by GPT2.'
