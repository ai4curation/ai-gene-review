- id: PMID:10572067
  title: Dominance of ErbB-1 heterodimers in lung epithelial cells overexpressing ErbB-2. Both ErbB-1
    and ErbB-2 contribute significantly to tumorigenicity.
  assessment:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'The complete source abstract reports distinct EGFR heterodimers in human immortalized
      bronchial epithelial derivatives, and the literal interaction record maps the exact human EGFR–ERBB2
      pair to anti-bait co-immunoprecipitation. The independently captured official partner record supports
      the protein-kinase class. This refinement characterizes the associated partner without claiming
      a purified interface or applying the same heterodimer composition to both cell derivatives. The
      original full Methods and insert sequence were unavailable. Other source-specific assertions: The
      source examines EGFR signaling in human bronchial epithelial derivatives. EGFR signaling supports
      growth-related behavior in the bronchial epithelial tumor model. EGFR associates with ERBB3 in the
      human bronchial epithelial model.'
