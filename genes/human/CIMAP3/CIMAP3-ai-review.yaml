      cilium and release the basal body when quiescent cells re-enter the cell cycle; cilium assembly
      is not blocked. Participation: PIFO accumulates at the basal body and drives AURKA activation, the
      kinase step that triggers HDAC6-mediated axoneme destabilization. Comparator check: NEDD9, the other
      AURKA activator in this pathway, together with AURKA and HDAC6, carries GO:0061523 involved_in in
      human GOA (PMID:17604723). The term is therefore used for activators of the disassembly kinase.
