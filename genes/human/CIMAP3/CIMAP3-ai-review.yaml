suggested_questions:
- question: Does PIFO activate Aurora A directly (e.g. allosterically, like TPX2 or NEDD9), or indirectly
    by delivering an activator or scaffold to the basal body?
- question: Which, if any, of the pull-down partners (RAB6, RAB8, ARL13B, KIF3A, centrin, tubulins) bind
    PIFO directly, and are they needed for its basal-body accumulation?
- question: Is CIMAP3 relevant to cilium disassembly in adult human ciliated cells, or mainly in embryonic
    organizer cells and sperm (consistent with its absence from the HPA cilium atlas)?
- question: Is the R80K variant causal for laterality/ciliopathy phenotypes in humans?
suggested_experiments:
- description: Reconstitute AURKA kinase activity with purified PIFO (WT vs R80K) to test direct activation.
- description: CRISPR knockout of CIMAP3 in a ciliated human line expressing it, followed by serum-induced
    cilia disassembly assays and measurement of AURKA T288 phosphorylation at the basal body.
