id: Q8TCI5
gene_symbol: CIMAP3
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CIMAP3 (Pitchfork, PIFO; formerly C1orf88) is a small chordate-specific protein with two
  SHIPPO repeats, related to the sperm outer dense fiber protein ODF3 family. It is expressed in embryonic
  organizer regions such as the monociliated pit cells of the node, and in testis. Pitchfork travels on
  vesicles from the Golgi/trans-Golgi network and along the axoneme. It accumulates at the ciliary basal
  body when quiescent cells re-enter the cell cycle. There it associates with Aurora A kinase (AURKA)
  and promotes its activation, a step in the AURKA-HDAC6 pathway that resorbs primary cilia. Reduced Pitchfork
  dosage in mouse leaves cilia unretracted, the basal body undetached and centrosomes over-duplicated.
  The result is duplicated node cilia, left-right asymmetry defects and heart malformations. Pull-down
  assays also co-precipitate Pitchfork with ciliary trafficking components (RAB6, RAB8, ARL13B, KIF3A,
  centrin, beta- and gamma-tubulin). A heterozygous R80K variant that blocks AURKA activation was found
  in individuals with laterality and cystic kidney phenotypes.
