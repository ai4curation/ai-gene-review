core_functions:
- description: PMS1 forms the MLH1-PMS1 MutLbeta heterodimer; its direct enzymatic role in human MMR
    remains unresolved.
  locations:
  - id: GO:0005634
    label: nucleus
  in_complex:
    id: GO:0032390
    label: MutLbeta complex
  supported_by:
