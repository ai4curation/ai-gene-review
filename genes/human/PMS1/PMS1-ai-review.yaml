id: P54277
gene_symbol: PMS1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: PMS1 is a human MutL homolog that forms the nuclear MLH1-PMS1 MutLbeta heterodimer.
  MutLbeta has been detected in human cells and binds DNA with MutSalpha in vitro, but unlike
  MLH1-PMS2 MutLalpha its direct catalytic role in the canonical human mismatch-repair reaction
  remains unestablished.
