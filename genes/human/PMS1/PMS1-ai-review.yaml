  - reference_id: PMID:11292842
    supporting_text: 'Furthermore, we show that there is competition for the

      interacting domain in hMLH1 among the three other MutL homologues.'
knowledge_gaps:
- gap_statement: Whether purified human MutLbeta supports a defined mismatch-repair incision or
    excision reaction remains unestablished.
  boundary: PMS1 forms the MLH1-PMS1 MutLbeta heterodimer, while the canonical purified human
    mismatch-repair reaction uses MLH1-PMS2 MutLalpha.
  gap_kind:
  - BIOLOGY
  status: OPEN
  resolution: Reconstitution of mismatch-provoked incision and excision with purified MLH1-PMS1
    MutLbeta.
  provenance:
  - *id001
  - *id003
suggested_questions:
- question: What purified biochemical activity distinguishes human PMS1 from its MLH/PMS paralogs?
  experts:
  - DNA mismatch repair curators
suggested_experiments:
- description: Reconstitute the relevant MLH1-PMS1 heterodimer with MutSalpha/MutSbeta, RFC, PCNA,
    EXO1, RPA, polymerase delta, and LIG1 to test incision and repair on nicked and
    ribonucleotide-directed heteroduplex substrates.
  hypothesis: The direct repair activity of PMS1 is restricted to its cognate MutL heterodimer.
