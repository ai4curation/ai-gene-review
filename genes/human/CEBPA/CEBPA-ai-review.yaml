- id: PMID:16428455
  title: The proline-histidine-rich CDK2/CDK4 interaction region of C/EBPalpha is dispensable for C/EBPalpha-mediated
    growth regulation in vivo.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Genuine normal abstract and externally recovered full PMC1347024 Methods, Results/Figures
      1–2 and 5–7 and Discussion inspected. Rat expression constructs and a mouse/rat hybrid knock-in
      show context-specific dispensability of the proposed PHR kinase-interaction region for growth repression,
      including unchanged fetal-liver CDK2 histone-H1 kinase activity. Failed CDK2 co-IP may reflect high-salt
      extraction, as the authors explain; it is not used to deny kinase contact or isolated inhibitory
      capacity. This limits universal physiological-necessity claims, not the source-specific human binding
      assertions.
core_functions:
- description: Recognizes cis-regulatory DNA through the bZIP dimer and regulates RNA polymerase II transcription,
    activating lineage-specific genes that establish granulocyte and adipocyte differentiation. Promoter
    partners and the N-terminal product context determine output; p30 is not assumed to match p42 potency.
  molecular_function:
    id: GO:0000981
    label: DNA-binding transcription factor activity, RNA polymerase II-specific
  directly_involved_in:
  - id: GO:0045944
    label: positive regulation of transcription by RNA polymerase II
  - id: GO:0030851
    label: granulocyte differentiation
  - id: GO:0045444
    label: fat cell differentiation
  locations:
  - id: GO:0005634
    label: nucleus
  in_complex:
    id: GO:1990647
    label: C/EBP complex
  supported_by:
  - reference_id: PMID:11242107
  - reference_id: PMID:28186500
  - reference_id: PMID:11672531
  - reference_id: PMID:36228616
- description: Reported CDK2/CDK4 inhibition provides a context-dependent route to proliferative restraint,
    alongside the separate E2F-repression program. Human liver association supports kinase contact. Growth
    repression nevertheless persists after deletion of the proposed kinase-interaction region in rat-construct
    cell assays and in the tested mouse fetal-liver and myeloid settings; direct kinase inhibition is
    not a universally required mechanism of CEBPA-mediated growth control.
  molecular_function:
