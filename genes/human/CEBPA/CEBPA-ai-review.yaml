suggested_questions:
- question: How do endogenous p42, p30 and the extended CEBPA product partition promoter and rDNA regulation
    in primary human myeloid cells?
- question: Which CEBPA–bZIP heterodimers occupy functional chromatin sites in human cells, particularly
    the ATF4-containing complex during integrated stress signaling?
suggested_experiments:
- description: Use product-selective endogenous tagging and perturbation in human myeloid progenitors,
    with matched chromatin occupancy, nascent Pol II RNA and rRNA measurements, to separate the shared
    bZIP activity from product-specific regulatory outputs.
- description: Measure CEBPA and ATF4 joint chromatin occupancy and transcriptional output under defined
    stress, with interface-selective rescue constructs that retain individual DNA-binding competence,
    to test the specific heterodimer contribution.
