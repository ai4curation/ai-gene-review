id: P49715
gene_symbol: CEBPA
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CEBPA encodes C/EBPalpha, a basic leucine-zipper transcription factor that recognizes cis-regulatory
  DNA as a homodimer or heterodimer and coordinates differentiation with proliferative restraint. Its
  N-terminal regulatory regions and interacting transcription factors shape promoter-specific activation
  and repression. C/EBPalpha drives granulocytic and adipocyte gene programs and contributes to differentiated
  functions in liver and lung. The p42 and N-terminally truncated p30 products share the C-terminal DNA-binding
  and dimerization region but differ in regulatory potency; an N-terminally extended product is associated
  with nucleolar rDNA regulation. C/EBPalpha also associates with cell-cycle regulatory proteins, linking
  transcriptional control to cell-cycle arrest in a product- and phosphorylation-dependent manner. Disruptive
  CEBPA variants impair myeloid differentiation and predispose to acute myeloid leukemia.
