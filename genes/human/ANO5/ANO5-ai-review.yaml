suggested_questions:
- question: Which molecular step performed by ANO5 coordinates annexin trafficking and membrane repair
    independently of its scrambling domain?
- question: How do ANO5 isoform length, membrane targeting and endogenous ANO6 alter intrinsic versus
    indirect current measurements and reconcile the positive and NOT calcium-gated chloride annotations?
- question: Which original mouse localization experiment and historical Compara assertion establish the
    vesicle transfer, and what direct evidence supports ANO5 dimerization?
knowledge_gaps:
- gap_statement: Which molecular activity of ANO5 supports muscle membrane repair independently of its
    phospholipid-scrambling domain remains unresolved in the reviewed experiments.
  boundary: ANO5 loss disrupts repair and annexin trafficking; human ANO5 restores repair in deficient
    mouse fibers, and the scrambling-defective ANO5-1-5 chimera also restores repair. Human patient myocytes
    show defective repair. These observations establish the repair role without identifying the molecular
    step performed by ANO5.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  resolution: Separate direct ANO5-dependent membrane or partner activities from downstream annexin redistribution
    and calcium changes, using repair-competent and repair-defective constructs with independently measured
    scrambling.
  provenance:
  - reference_id: PMID:33496727
    full_text_unavailable: false
    supporting_text: Both ANO5 and ANO5-1-5 expression in ANO5-KO myofibers restored normal repair
