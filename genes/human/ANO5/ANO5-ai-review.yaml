  review:
    summary: Human ANO5 supports calcium-evoked chloride-permeable currents in an expression assay.
    action: KEEP_AS_NON_CORE
    reason: The original human ANO5 Results, Figure 3 legend and Methods in PMID:22946059 support small
      transient currents after ionomycin in HEK293 cells; its anion-ranking subset was ANO1/4/6/10, not
      ANO5. Independent PMID:29124309 human 898- and 913-residue constructs yield calcium-favored, poorly
      selective currents in HEK293 cells, with the 898-residue construct also tested in CHO cells. At
      3 µM intracellular calcium, large currents required strong depolarization; matched controls lacked
      comparable currents, and calcium favored rather than absolutely determined activation. GO:0005229
      requires calcium-responsive chloride passage but does not require exclusion of other ions. Negative
      ANO5 results in PMID:20056604, PMID:22075693 and PMID:23047743, and the ANO6-background effects
      in PMID:39337485, restrict confidence in native channel physiology. The latter reports ANO5-associated
      currents in ANO6-deficient cells; it does not identify these currents as endogenous ANO6. Retain
      this positive experimental assertion as secondary and conditional, while the broader scope of the
      separate NOT row remains unresolved.
