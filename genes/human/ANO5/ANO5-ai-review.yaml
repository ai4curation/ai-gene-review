core_functions:
- description: 'Catalyzes transbilayer phospholipid scrambling in calcium-stimulated cell assays. Human
    constructs support surface lipid exposure, and endothelial ANO5 contributes to phosphatidylserine
    externalization. The plasma-membrane location describes where this surface lipid-exposure activity
    was measured; it does not exclude the substantial ER pool. Muscle membrane repair is also an established,
    biologically central ANO5 role. It is not assigned as a direct consequence of this molecular activity
    because a scrambling-defective chimera rescues repair. A separate repair activity cannot yet be named
    from the available experiments: annexin organization and calcium handling are implicated, but ANO5
    has not been shown to execute a specific binding, scaffolding, transport or fusion step that explains
    repair.'
