id: Q75V66
gene_symbol: ANO5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ANO5 (TMEM16E) is a multipass membrane protein of the anoctamin family with calcium-dependent
  phospholipid scramblase activity. It resides mainly in the endoplasmic reticulum and reaches the plasma
  membrane in particular expression and injury contexts. Human ANO5 supports transbilayer lipid redistribution
  and associated nonselective ion conductance in cell assays. In muscle, ANO5 supports membrane repair
  and coordinated annexin trafficking after injury; a scrambling-defective chimera can rescue repair,
  indicating separable functions. Endothelial ANO5 contributes to surface phosphatidylserine exposure.
  Recessive ANO5 variants cause limb-girdle muscular dystrophy R12 or Miyoshi muscular dystrophy 3, whereas
  specific dominant variants cause gnathodiaphyseal dysplasia.
