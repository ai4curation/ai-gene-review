  review:
    summary: The NOT calcium-gated chloride-channel assertion remains unresolved across assay contexts.
    action: UNDECIDED
    reason: 'The original NOT flag and the negative result remain intact. PMID:22075693 tested human ANO5
      IMAGE100061756 with a C-terminal EGFP tag: whole-cell recordings at about 24 µM free intracellular
      calcium were negative, with intracellular retention. The authors explicitly leave intrinsic channel
      capacity unresolved. The ANO5 halide assay in PMID:20056604 and the negative channel interpretation
      in PMID:23047743 add contrary evidence. However, PMID:22946059 reports small ionomycin-evoked human
      ANO5 currents, and PMID:29124309 reports calcium-favored nonselective currents from human 898- and
      913-residue constructs with matched negative controls. PMID:39337485 further demonstrates dependence
      on the ANO6 expression background; its Discussion places ANO5-associated currents in the absence,
      not the presence, of ANO6. These different localization, construct and stimulation conditions do
      not resolve a context-independent NOT assertion. UNDECIDED records that unresolved biological scope,
      rather than denying the original negative experiment or claiming its Methods were inaccessible.'
