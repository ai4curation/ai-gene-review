id: Q75V66
gene_symbol: ANO5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ANO5 (TMEM16E) is a multipass membrane protein with calcium-dependent phospholipid scramblase
  activity. It occupies the endoplasmic reticulum and reaches the plasma membrane in particular expression
  and injury contexts. Human ANO5 supports transbilayer lipid redistribution and associated nonselective
  ion conductance in cell assays. In muscle, ANO5 supports membrane repair and the coordinated trafficking
  of annexins after injury; repair can persist when its scrambling domain is replaced, indicating separable
  functions. Endothelial ANO5 contributes to surface phosphatidylserine exposure. Recessive ANO5 dysfunction
  causes muscular dystrophy, whereas specific dominant variants cause gnathodiaphyseal dysplasia.
