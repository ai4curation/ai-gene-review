core_functions:
- description: Catalyzes transbilayer phospholipid scrambling in calcium-stimulated cell assays. Human
    constructs support surface lipid exposure, and endothelial ANO5 contributes to phosphatidylserine
    externalization. Muscle membrane repair is also an established ANO5 role, but it is not assigned as
    a direct consequence of this molecular activity because a scrambling-defective chimera rescues repair.
