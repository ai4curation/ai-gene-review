  review:
    summary: ANO5 supports repair of wounded muscle plasma membrane.
    action: ACCEPT
    reason: The actual Results and construct Methods of PMID:33496727 show human ANO5 rescue of isolated
      Ano5-deficient mouse fibers, recruitment near wounds, altered annexin trafficking, and defective
      repair in human R58W patient myocytes. These support the existing repair assertion. The scrambling-defective
      ANO5-1-5 chimera also restores repair, so this role is not equated with phospholipid scrambling,
      direct annexin binding or membrane-fusion chemistry.
