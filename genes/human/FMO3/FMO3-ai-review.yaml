  review:
    action: MODIFY
    summary: Human FMO3–CREB3 interaction supports DNA-binding transcription factor binding.
    reason: PMID:25910212 has three exact positive IntAct records for human P31513 and O43889-2, covering
      pooled screening, pairwise yeast two-hybrid testing and the validated-two-hybrid record. Selected
      actual Results and Methods describe human ORF interaction screening and allele comparisons; the
      target records distinguish FMO3 substitutions that retain or disrupt the interaction. Reviewed UniProt
      identifies O43889-2 as the displayed CREB3/LZIP product named isoform 1, a CREB-family DNA-binding
      transcription-factor precursor. GO:0140297 therefore describes the supported partner class more
      informatively than protein binding. A narrower CREB-protein binding term remains a candidate rather
      than the selected replacement because its CREB3 family boundary is not resolved by the bounded usage
      check. This does not establish FMO3 transcription-factor activity, binding to a DNA-bound or processed
      CREB3 form, a transcription-regulatory mechanism, or endogenous mammalian co-localization. The paper-level
      orthogonal GPCA validation is not claimed for this particular pair; the original supplement cells
      and insert sequences were not independently reconstructed.
    proposed_replacement_terms:
    - id: GO:0140297
      label: DNA-binding transcription factor binding
    supported_by:
    - reference_id: PMID:25910212
    - reference_id: file:human/FMO3/FMO3-source-evidence.md
