id: P31513
gene_symbol: FMO3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Flavin-containing monooxygenase 3 is an FAD-containing enzyme of the endoplasmic reticulum
  membrane, prominent in adult human liver. It uses NADPH and oxygen to convert trimethylamine to trimethylamine
  N-oxide and also oxygenates other nitrogen- and sulfur-containing substrates. Bound FAD and retained
  NADP support formation and stabilization of the oxygenating intermediate. Reduced FMO3 activity causes
  trimethylamine accumulation in primary trimethylaminuria.
