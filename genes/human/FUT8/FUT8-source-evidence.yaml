  approved_review: &id001
    action: KEEP_AS_NON_CORE
    summary: Retain the positive ZBTB10 isoform 3 association as non-core.
    reason: Three source-specific IntAct records for PMID:32296183 identify human FUT8 and human ZBTB10
      isoform 3 (Q96DT7-3) in positive yeast two-hybrid assays. The partner suffix belongs to ZBTB10 and
      is preserved; it does not specify a FUT8 natural product. The records retain the assay host, fusion
      tags and differing experimental-role fields. They support a physical interaction in the assay, without
      establishing an endogenous Golgi–nuclear mechanism, a FUT8 adaptor activity or SH3-domain binding.
      Exact primary Table 9 and FUT8 construct boundaries were not independently recovered. Retain this
      positive generic binding context under the campaign instruction.
    supported_by:
    - reference_id: PMID:32296183
