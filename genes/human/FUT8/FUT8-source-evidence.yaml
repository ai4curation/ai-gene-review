      Arg365/Arg366 substitutions affecting activity and GDP-fucose interaction. Supports donor-substrate
      mechanism. Full methods and figures were not recovered; no new residue-level assertion is added
      from an unexamined structure.
- id: PMID:10814706
  title: Genomic structure and promoter analysis of the human alpha1, 6-fucosyltransferase gene (FUT8).
