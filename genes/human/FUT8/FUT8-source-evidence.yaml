- id: PMID:29304374
  title: Biallelic Mutations in FUT8 Cause a Congenital Disorder of Glycosylation with Defective Fucosylation.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The current immutable native publication cache contains full HTML-derived Main Text,
      which was read. It describes three unrelated human biallelic FUT8 cases with prenatal growth restriction
      and other congenital findings; primary fibroblasts from two affected individuals lack detectable
      FUT8 protein, and LC-MS/lectin assays show deficient core-fucosylated N-glycans, with serum measurements
      in all three. O-glycans are reported unaffected and L-fucose supplementation ineffective, both with
      data not shown; no genetic rescue experiment is claimed. The earlier private NCBI XML response lacked
      an article body, but that access limit does not describe this later native full-text cache. Original
      table/figure pixels and supplements were not independently audited here.
