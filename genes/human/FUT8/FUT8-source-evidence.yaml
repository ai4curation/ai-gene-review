  approved_review: &id002
    action: ACCEPT
    summary: Retain the specific N-glycan core-fucosyltransferase reaction.
    reason: The EC:2.4.1.68, RHEA:12985 and InterPro contexts agree with the defined transfer of fucose
      from GDP-L-fucose to the innermost N-glycan GlcNAc in an alpha-1,6 linkage. Human purification/cloning
      and engineered-human-enzyme glycan-product measurements independently support this chemistry. The
      reaction itself is appropriate even though the separate current ontology link from this MF to direct
      protein O-fucosylation is problematic. This gene-level activity is not assigned to all four natural
      products.
    supported_by:
    - reference_id: GO_REF:0000120
    - reference_id: PMID:9133635
