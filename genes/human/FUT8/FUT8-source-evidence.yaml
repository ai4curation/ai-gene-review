description: FUT8 is a type II Golgi membrane glycosyltransferase that transfers fucose from GDP-L-fucose
  to the innermost N-acetylglucosamine of N-linked glycans, forming an alpha-1,6 linkage during glycoprotein
  maturation. Its substrates include the N-glycans attached to IgG Fc. Biallelic loss of human FUT8 causes
  deficient core fucosylation and a congenital disorder of glycosylation with prenatal growth restriction,
  skeletal abnormalities and respiratory complications. UniProt documents four sequence-distinct products
  of 575, 308, 412 and 169 residues. The 308-residue product called Retinal is distinct from the 169-residue
  product bearing Retina-1/Retina-2 synonyms; the reported inactivity of the latter does not establish
  inactivity of the former.
