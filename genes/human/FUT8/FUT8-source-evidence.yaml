      and cloning of the 575-residue enzyme, with GDP-fucose transfer to N-linked glycopeptides. Selected
      original abstract read; the full paper was inaccessible. Supernatant purification does not establish
      the normal location or activity of every splice product.
- id: PMID:10764839
  title: 'A sequence motif involved in the donor substrate binding by alpha1,6-fucosyltransferase: the
    role of the conserved arginine residues.'
  reference_review:
