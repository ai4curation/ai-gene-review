      in Discussion without a retinal assay in the displayed activity tables. Transcript expression alone
      does not establish an embryogenesis function. The official inactivity comment is on Q9BYC5-4 (169
      residues; Retina-1/Retina-2), not Q9BYC5-2 (308 residues; Retinal; separate PMID:10814706 sequence
