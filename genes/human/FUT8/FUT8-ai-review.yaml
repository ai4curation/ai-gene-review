suggested_questions:
- question: Which endogenous cells produce each shorter FUT8 product, and how do their catalytic activity
    and subcellular distribution compare with the 575-residue enzyme?
- question: Does the FUT8–ZBTB10 isoform 3 interaction occur in endogenous human cells, and what cellular
    context could permit the association?
- question: What form and orientation of FUT8 account for its detection in parotid-exosome preparations,
    and is enzyme activity retained in those vesicles?
suggested_experiments:
- description: Compare sequence-verified FUT8 products in matched expression systems using the same N-glycan
    acceptor/GDP-fucose product assay, with tag-placement controls and protein-abundance normalization.
- description: Test endogenous FUT8–ZBTB10 association with reciprocal assays and compartment controls,
    distinguishing the original ZBTB10 isoform 3 from other products.
- description: Combine product-specific peptide detection, membrane-protection assays and glycan-product
    measurements in independently purified parotid vesicle fractions.
