id: Q9BYC5
gene_symbol: FUT8
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'FUT8 is a Golgi membrane glycosyltransferase that transfers fucose from GDP-L-fucose to
  the innermost N-acetylglucosamine of N-linked glycans, forming an alpha-1,6 linkage during glycoprotein
  maturation. Loss of human FUT8 activity causes deficient core fucosylation and a congenital disorder
  of glycosylation. UniProt documents four sequence-distinct products of 575, 308, 412 and 169 residues.
  Their localization and catalytic properties are not interchangeable: the 308-residue product called
  Retinal is distinct from the 169-residue product bearing Retina-1/Retina-2 synonyms, and the functional
  consequences of each sequence difference require product-specific evidence.'
