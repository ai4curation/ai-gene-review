description: ANGPTL7 (angiopoietin-like 7, CDT6) is a secreted glycoprotein of the angiopoietin-like family
  that forms disulfide-linked homotetramers through coiled-coil interactions. It is abundant in the corneal
  stroma, where keratocyte-derived ANGPTL7 keeps the cornea avascular, and in the trabecular meshwork,
  where it remodels the extracellular matrix and disrupts fibronectin fibril assembly. Steroids raise
  ANGPTL7 in aqueous humor, excess ANGPTL7 increases outflow resistance and intraocular pressure, Angptl7
  knockout mice resist steroid-induced pressure rises, and human protein-altering variants lower intraocular
  pressure and protect against glaucoma. Its receptor is unknown.
