  review:
    summary: Blood coagulation (InterPro IEA, fibrinogen/angiopoietin-like domain). The domain is shared
      with fibrinogen, but ANGPTL7 has no role in coagulation; removed.
    action: REMOVE
    reason: The InterPro fibrinogen/angiopoietin-like signature (IPR037579) maps to blood coagulation
      because of fibrinogen. The angiopoietin-like proteins share the fold but not that function, and
      no study links ANGPTL7 to coagulation; its documented roles are corneal avascularity and trabecular
      meshwork ECM regulation.
    supported_by:
