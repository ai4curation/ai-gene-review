suggested_questions:
- question: What receptor mediates ANGPTL7's effects on trabecular meshwork cells and endothelial cells,
    and is it shared with other angiopoietin-like proteins?
suggested_experiments:
- description: Identify ANGPTL7 cell-surface binding partners on trabecular meshwork cells by proximity
    labeling or receptor arrays, then test whether blocking them reproduces ANGPTL7-blocking antibody
    effects on outflow facility.
