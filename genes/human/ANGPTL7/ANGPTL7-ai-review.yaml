- id: PMID:11682471
  title: The angiopoietin-like factor cornea-derived transcript 6 is a putative morphogen for human cornea.
  findings:
  - statement: CDT6/ANGPTL7 is secreted and forms disulfide-linked homotetramers.
    supporting_text: We demonstrate that CDT6 is a secreted protein that folds into disulfide-linked homotetramers
      by coiled-coil interactions.
  - statement: CDT6 expression in xenografts induces fibrosis and aberrant vessels.
    supporting_text: Expression of CDT6 led to a reduction in tumor growth and aberrant blood vessel formation
      by inducing massive fibrosis.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only. First characterization of CDT6/ANGPTL7.
- id: PMID:25622036
  title: Angiopoietin-like 7 is an anti-angiogenic protein required to prevent vascularization of the
    cornea.
  findings:
  - statement: ANGPTL7 knockdown increases tube formation, reversed by recombinant protein.
    supporting_text: In vitro, inhibiting ANGPTL7 expression by using a specific siRNA led to greater
      tube formation than did the transfection of cells with a control siRNA, and this increase in tube
      formation was abolished when recombinant ANGPTL7 protein was added to the cultures.
  - statement: ANGPTL7 maintains corneal avascularity.
    supporting_text: ANGPTL7, which is abundantly expressed in keratocytes, plays a major role in maintaining
      corneal avascularity and transparency.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text. Keratocyte co-culture and mouse corneal knockdown.
- id: PMID:21199193
  title: 'Evidence for a role of angiopoietin-like 7 (ANGPTL7) in extracellular matrix formation of the
    human trabecular meshwork: implications for glaucoma.'
  findings:
  - statement: ANGPTL7 alters trabecular meshwork ECM gene expression.
    supporting_text: We find that overexpression of ANGPTL7 in primary human trabecular meshwork cells
      altered the expression of fibronectin, collagens type I, IV & V, myocilin, versican, and MMP1.
  - statement: ANGPTL7 disrupts fibronectin fibril assembly.
    supporting_text: ANGPTL7 also interfered with the fibrillar assembly of fibronectin.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text. Primary human trabecular meshwork cells.
- id: PMID:32369491
  title: Rare protein-altering variants in ANGPTL7 lower intraocular pressure and protect against glaucoma.
  findings:
  - statement: An ANGPTL7 missense variant lowers IOP.
    supporting_text: that significantly lowers IOP
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text. UK Biobank and FinnGen protective-variant association.
- id: PMID:38497513
  title: ANGPTL7 and Its Role in IOP and Glaucoma.
  findings:
  - statement: Angptl7 KO mice resist dexamethasone-induced IOP rise.
    supporting_text: When challenged with Dex, IOP increased in wild-type but not Angptl7 KO mice.
  - statement: ANGPTL7 lowers hydraulic conductivity; blocking antibodies raise it.
    supporting_text: Using 3D culture, recombinant ANGPTL7 decreased, and ANGPTL7-blocking antibodies
      increased hydraulic conductivity.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only. Mouse KO, human ex vivo eyes and rabbit antibody studies. Note that KO
      mice had elevated baseline IOP.
- id: PMID:8026862
  title: Cloning and sequence analysis of candidate human natural killer-enhancing factor genes.
  findings:
  - statement: The paper is about natural killer-enhancing factor cloning.
    supporting_text: Cloning and sequence analysis of candidate human natural killer-enhancing factor
  reference_review:
    relevance: NONE
    correctness: WRONG_IDENTIFIER
    review_notes: Cited by a 2003 PINC TAS row for response to oxidative stress. The paper clones NKEF
      (a peroxiredoxin) and is unrelated to ANGPTL7, so the identifier is wrong.
