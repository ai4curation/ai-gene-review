id: O00115
gene_symbol: DNASE2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: DNASE2 encodes deoxyribonuclease II alpha (DNase II), a 360-residue glycosylated, signal-peptide-bearing
  acid endonuclease of the lysosome. Its catalytic domain belongs to the phospholipase D superfamily,
  and it cleaves double-stranded DNA endonucleolytically at acidic pH, without divalent cations, to 3'-phosphate
  products. DNase II is expressed ubiquitously and highly in macrophages, where it degrades the DNA of
  engulfed apoptotic cells and of nuclei extruded by erythroid precursors in phagolysosomes; it also degrades
  nuclear and mitochondrial DNA delivered to lysosomes by autophagy, and trims endocytosed microbial DNA
  into ligands for TLR9. DNase II-derived oligonucleotides from apoptotic-cell DNA also serve as a signal
  for efferocytosis-induced macrophage proliferation in mice. Loss of DNase II leaves undigested self-DNA
  that activates cGAS-STING and type I interferon responses; in mice this causes lethal anemia and polyarthritis,
  and biallelic hypomorphic DNASE2 variants in humans cause autoinflammatory-pancytopenia syndrome, a
  type I interferonopathy.
