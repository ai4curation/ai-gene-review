- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:28514442
  qualifier: enables
  supporting_entities:
  - UniProtKB:P27824
  review:
    summary: High-throughput interactome mapping detected DNASE2 with calnexin (CANX).
    action: REMOVE
    reason: Generic protein binding is uninformative. The only partner is calnexin (CANX, P27824), the
      ER lectin chaperone that binds newly synthesised N-glycoproteins; DNase II is a glycosylated secretory-pathway
      protein, so the interaction from high-throughput interactome mapping most likely reflects ER folding
      quality control of the nascent enzyme rather than a DNase II function. Removal under the protein-binding
      policy does not imply the interaction is false.
