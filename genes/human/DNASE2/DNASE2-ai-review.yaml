- term:
    id: GO:0005764
    label: lysosome
  evidence_type: IDA
  original_reference_id: PMID:23516607
  qualifier: located_in
  review:
    summary: Ohkouchi et al. 2013 showed by subcellular fractionation and immuno-EM that processed DNase
      II forms reside in lysosomes, with lysosomal processing by cathepsin L, and that DNase II is localized
      in macrophage lysosomes.
    action: ACCEPT
    reason: Lysosome is the principal site of DNase II action and is supported directly. The cached abstract
      describes mouse DNase II (antibody against mouse protein, mouse tissues); the curator applied it
      to human O00115, which may reflect assays in the full text. The localization is in any case conserved
      and corroborated for the human enzyme (patient report describes DNASE2 as "the lysosomal DNase")
      so the annotation is accepted. Whole-organelle fractionation cannot resolve sub-compartment; lumen
      added separately as NEW.
    supported_by:
    - reference_id: PMID:23516607
      supporting_text: These results indicate that DNase II is processed and activated in lysosomes, while
        cathepsin L is involved in the processing of the enzyme.
    - reference_id: PMID:29259162
      supporting_text: the gene encoding the 360 amino acid lysosomal DNase DNase II
