- term:
    id: GO:0006309
    label: apoptotic DNA fragmentation
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000092274
  - WB:WBGene00000799
  - WB:WBGene00003828
  - WB:WBGene00007056
  review:
    summary: PAINT IBA from PTN000092274 seeded by C. elegans nuc-1 and paralogs, which degrade apoptotic-cell
      DNA.
    action: KEEP_AS_NON_CORE
    reason: DNase II does directly cleave the DNA of apoptotic cells, satisfying the GO usage note requiring
      direct involvement in fragmenting DNA. However, in both worm and mammals this is the engulfment-dependent
      step performed in the phagocyte (nuc-1; macrophage DNase II), not the cell-autonomous fragmentation
      by CAD/DFFB in the dying cell. The process the enzyme serves is more fully described by DNA catabolic
      process and apoptotic cell clearance; this term is kept as non-core.
    supported_by:
    - reference_id: PMID:12524536
      supporting_text: when apoptotic cells were phagocytosed by macrophages, their DNA was degraded by
        DNase II
    - reference_id: PMID:10716942
      supporting_text: Completion of DNA degradation did not occur in the absence of cell-corpse engulfment.
