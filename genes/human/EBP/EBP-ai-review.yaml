core_functions:
- description: Catalyzes sterol Delta8-to-Delta7 isomerization at the endoplasmic reticulum membrane during
    cholesterol biosynthesis, including zymostenol-to-lathosterol and zymosterol-to-cholesta-7,24-dien-3beta-ol
    conversion. Human enzyme assays and the five-transmembrane-helix structure support this catalytic
    unit.
  molecular_function:
    id: GO:0047750
    label: cholestenol delta-isomerase activity
  directly_involved_in:
  - id: GO:0006695
    label: cholesterol biosynthetic process
  locations:
  - id: GO:0005789
    label: endoplasmic reticulum membrane
  supported_by:
  - reference_id: PMID:8798407
    supporting_text: catalyzes the conversion of delta8-sterols to their corresponding
  - reference_id: PMID:9894009
    supporting_text: isomerase activity (EC 5.3.3.5) upon heterologous expression in a sterol
  - reference_id: PMID:31165728
  - reference_id: PMID:10406945
  - reference_id: PMID:12133002
proposed_new_terms: []
suggested_questions:
- question: Within the AEBS (EBP-DHCR7) complex, does EBP itself contribute the catalytic cholesterol-5,6-epoxide
    hydrolase activity, or is it a scaffolding/regulatory partner of DHCR7?
- question: What oligomeric state does EBP adopt in native ER membranes, and does it change with membrane
    lipid composition or partner association?
suggested_experiments:
- description: Reconstitute purified EBP and DHCR7 separately and together in defined liposomes and assay
    ChEH activity to resolve which subunit carries the epoxide-hydrolase catalysis.
- description: Measure sterol-isomerization kinetics and substrate binding for sequence-verified human
    EBP catalytic-site variants, using the current H76/E80/E122/W196 numbering and distinguishing catalytic
    effects from altered folding or membrane incorporation.
- description: Compare EBP oligomerization in native membranes and defined lipid reconstitutions with
    matched sterol-isomerase activity measurements.
