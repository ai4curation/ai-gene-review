id: Q15125
gene_symbol: EBP
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: EBP, the emopamil-binding protein, is a five-pass integral membrane sterol isomerase that
  catalyzes a post-lanosterol step in cholesterol biosynthesis. It moves the sterol double bond from the
  Delta8 to the Delta7 position, converting zymostenol to lathosterol and zymosterol to cholesta-7,24-dien-3beta-ol.
  EBP acts at the endoplasmic reticulum membrane and is also detected at nuclear-envelope membranes and
  in vesicles during mitosis. It binds several sterol-like and lipophilic inhibitors, including tamoxifen.
  EBP and DHCR7 cooperate in microsomal cholesterol-5,6-epoxide hydrolysis, although the separate catalytic
  contribution of each protein remains unresolved. Loss of EBP sterol-isomerase function causes X-linked
  chondrodysplasia punctata 2, with abnormal accumulation of Delta8 sterol intermediates.
