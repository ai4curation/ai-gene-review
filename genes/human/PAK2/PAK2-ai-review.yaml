id: Q13177
gene_symbol: PAK2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: PAK2 encodes a ubiquitous group I p21-activated serine/threonine kinase that is
  activated by CDC42/RAC binding and autophosphorylation. Full-length PAK2 phosphorylates substrates
  involved in actin, cell motility, MAPK4/MAPK6 signaling, JUN signaling and caspase-7 inhibition,
  whereas caspase cleavage produces an active PAK2p34 fragment that moves to nuclear and membrane
  compartments and promotes late apoptotic events.
functional_isoforms:
  - id: PAK2_P27
    name: PAK-2p27
    type: CLEAVAGE_PRODUCT
    maps_to:
      - type: UNIPROT_CHAIN
        ids:
          - PRO_0000304922
        residues: 2-212
    description: The N-terminal PAK2 cleavage product generated during apoptosis.
  - id: PAK2_P34
    name: PAK-2p34
    type: CLEAVAGE_PRODUCT
    maps_to:
      - type: UNIPROT_CHAIN
        ids:
          - PRO_0000304923
        residues: 213-524
    description: A caspase-generated active C-terminal kinase fragment that translocates to the
      nucleus, cytoplasmic perinuclear region and membranes and promotes late apoptotic signaling.
    isoform_specific_terms:
      - id: GO:0005634
        label: nucleus
      - id: GO:0016020
        label: membrane
      - id: GO:0048471
        label: perinuclear region of cytoplasm
      - id: GO:2001238
        label: positive regulation of extrinsic apoptotic signaling pathway
