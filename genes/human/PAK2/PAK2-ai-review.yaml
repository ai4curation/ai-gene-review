core_functions:
  - description: Full-length PAK2 is a CDC42/RAC-regulated protein serine/threonine kinase that
      phosphorylates MAPK6/MAPK4, JUN, CASP7 and other substrates in cytoplasmic signaling pathways.
    molecular_function:
      id: GO:0004674
      label: protein serine/threonine kinase activity
    directly_involved_in:
      - id: GO:0035556
        label: intracellular signal transduction
      - id: GO:0043408
        label: regulation of MAPK cascade
    supported_by:
      - reference_id: PMID:21317288
        supporting_text: The class I p21-activated kinases (Pak1-3) regulate many essential
          biological processes, including cytoskeletal rearrangement, cell cycle progression,
          apoptosis, and cellular transformation.
      - reference_id: PMID:21555521
        supporting_text: PAK2 mediates chemotherapeutic resistance in human breast invasive ductal
          carcinoma by negatively regulating caspase-7 activity.
  - description: Caspase-cleaved PAK-2p34 is a constitutively active pro-apoptotic kinase fragment
      that relocates to the nucleus and membrane compartments during apoptosis.
    molecular_function:
      id: GO:0004674
      label: protein serine/threonine kinase activity
    directly_involved_in:
      - id: GO:2001238
        label: positive regulation of extrinsic apoptotic signaling pathway
    locations:
