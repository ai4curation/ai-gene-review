id: Q9ULC6
gene_symbol: PADI1
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: PADI1 is a cytoplasmic, calcium-dependent peptidylarginine deiminase that catalyzes hydrolytic deimination of protein L-arginyl residues to L-citrullyl residues. It is active as a monomer and is expressed most clearly in epidermal keratinocytes and other epithelial or reproductive tissues, where it contributes protein citrullination without the specialized nuclear histone program of PADI4.
