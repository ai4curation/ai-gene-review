knowledge_gaps:
- gap_statement: Whether human ASPDH is an active dehydrogenase, and with what substrate and cofactor,
    is unknown; its only measured activity is NAADP binding.
  boundary: 'Established: L-aspartate dehydrogenase family membership and probable retention of the catalytic
    histidine (sequence inference). Reported once: NAADP binding by recombinant mouse ASPDH. Not established:
    cofactor preference, any enzymatic activity, the physiological role of NAADP binding, or location.
    Isoform 2 (A6ND91-2) lacks residues 2-65 and 95-144, removing the glycine-rich dinucleotide-binding
    motif.'
