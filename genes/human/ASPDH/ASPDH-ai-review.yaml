    summary: NAD+ biosynthetic process (IEA, InterPro). The mapping comes from bacterial L-aspartate dehydrogenases
      (NadX), whose iminoaspartate product is condensed into quinolinate by quinolinate synthase (NadA).
      No mammal has a quinolinate synthase; mammals make NAD+ de novo from tryptophan instead. ASPDH also
      lacks the NAD-specific ribose-binding aspartate. The pathway context is absent, so the row is removed.
