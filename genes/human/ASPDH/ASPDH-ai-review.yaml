references:
- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO terms
  findings: []
- id: PMID:35841763
  title: Identification of ASPDH as a novel NAADP-binding protein.
  findings:
  - statement: ASPDH is an NAADP-binding protein (mouse ASPDH, Kd 455 nM by ITC).
    supporting_text: Isothermal titration calorimetry (ITC) experiment using the recombinantly expressed
      protein shows a 1:1 binding stoichiometry and a Kd of 455 nM between NAADP and mouse ASPDH.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only; pig liver purification and recombinant mouse ASPDH. A single unreplicated
      report; in the same experiments the previously published NAADP receptors JPT2 and LSM12 showed no
      binding, which conflicts with earlier studies. Treat as a lead rather than an established activity.
  full_text_unavailable: true
- id: PMID:42127630
  title: ASPDH inhibits the proliferation, migration, and invasion of liver cancer cells by regulating
    lactate metabolism and the NF-κB/PD-L1 pathway.
  findings:
  - statement: ASPDH restrains liver cancer cell proliferation and invasion.
    supporting_text: ASPDH knockdown enhanced proliferation, colony formation, migration, and invasion,
      while overexpression had opposite effects.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Full text; cancer cell phenotypes.
