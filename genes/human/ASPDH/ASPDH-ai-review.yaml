id: A6ND91
gene_symbol: ASPDH
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ASPDH is a member of the L-aspartate dehydrogenase family, with a Rossmann-type dinucleotide-binding
  domain related to bacterial NadX enzymes. It probably retains the catalytic histidine of those enzymes,
  but its cofactor preference is unknown and no dehydrogenase activity has been shown for it. Mammals
  lack the downstream quinolinate synthase of the bacterial aspartate route to NAD+. Purified from pig
  liver as an NAADP-binding protein, recombinant mouse ASPDH binds the calcium-mobilizing messenger NAADP
  with a Kd of about 455 nM. In liver cancer cells, ASPDH expression restrains proliferation and invasion.
