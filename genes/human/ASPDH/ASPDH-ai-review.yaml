suggested_questions:
- question: Does ASPDH oxidize L-aspartate or another amino acid using NADP(+), and does NAADP binding
    regulate such an activity or sequester NAADP to tune calcium signalling?
suggested_experiments:
- description: Assay purified human ASPDH isoform 1 (A6ND91-1) for NAD(P)-dependent dehydrogenase activity
    on L-aspartate and related amino acids, with an H223A mutant, and test whether NAADP competes with
    NADP binding.
