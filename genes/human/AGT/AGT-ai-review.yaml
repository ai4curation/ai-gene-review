  significance: >-
    This is why the record looks the way it does. A reader cannot tell from GOA that 'hormone
    activity' and 'type 1 angiotensin receptor binding' belong to an octapeptide while 'protease
    binding' belongs to the precursor, nor that the precursor has essentially no annotated activity
    of its own. The same problem affects every prohormone and polyprotein.
