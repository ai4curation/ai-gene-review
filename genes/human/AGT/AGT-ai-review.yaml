core_functions:
- description: >-
    Renin substrate and angiotensin delivery device. Angiotensinogen holds the angiotensin sequence
    in an ordered 63-residue N-terminal tail with the scissile Leu-Val bond buried, and presents
    it to renin through a tail-into-mouth conformational change that threads the N terminus into
    a pocket equivalent to the hormone-binding site of the carrier serpins. Binding is not confined
    to the catalytic cleft: there is an extensive, largely hydrophobic body-to-body interface
    with the protease, and mutagenesis and kinetics show that the rate and specificity of angiotensin
    I release are set by angiotensinogen residues and glycans outside renin's active site. This
    is the molecular function of the full-length precursor itself, as opposed to that of the peptides
    cleaved from it, and it is the rate-limiting step of the whole renin-angiotensin cascade.
  supported_by:
  - reference_id: PMID:20927107
    supporting_text: >-
      there is a substantial contact surface of 670Å2 between the bodies of the two proteins,
      primarily hydrophobic in nature
  - reference_id: PMID:30563843
    supporting_text: >-
      These structures revealed that AGT undergoes profound conformational changes and binds renin
      through a tail-into-mouth allosteric mechanism that inserts the N terminus into a pocket
      equivalent to a hormone-binding site on other serpins.
  - reference_id: PMID:20927107
    supporting_text: >-
      The 63-residue amino-terminal tail of angiotensinogen is seen as an ordered superstructure,
      anchored by two new helices, and with the renin-cleavage site, Leu10-Val11 in humans, held
      in an inaccessibly buried position.
  - reference_id: PMID:30563843
    supporting_text: >-
      Mutagenesis and kinetic analyses confirmed that renin-mediated production of angiotensin
      I is controlled by interactions of amino acid residues and glycan components outside renin's
      active-site cleft.
  molecular_function:
