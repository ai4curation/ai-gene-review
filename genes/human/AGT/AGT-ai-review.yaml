- term:
    id: GO:0003081
    label: regulation of systemic arterial blood pressure by renin-angiotensin
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR000227
  - InterPro:IPR033834
  review:
    summary: >-
      Correctly scoped InterPro2GO inference, and the control that shows what went wrong with
      the GO:0004867 IEA. The two signatures in the WITH/FROM are IPR000227 (Angiotensinogen)
      and IPR033834 (Angiotensinogen_serpin_dom) - angiotensinogen-specific, not family-wide -
      and they map to the angiotensinogen-specific process term. This is exactly what AGT does.
    action: ACCEPT
    reason: >-
      Gene-level InterPro signatures mapped to the gene's core physiological process. The same
      protein matches the generic serpin signature IPR000215 as well, and that route produces
      the wrong molecular function - the contrast is diagnostic of where InterPro2GO fails and
      where it works.
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: InterPro:IPR000227
        source_status: SUPPORTS_TRANSFER
        comment: >-
          InterPro 'Angiotensinogen' - a signature specific to this gene, not to the serpin family,
          so its GO mapping cannot leak across the family.
      - source_id: InterPro:IPR033834
        source_status: SUPPORTS_TRANSFER
        comment: >-
          InterPro 'Angiotensinogen_serpin_dom' - the angiotensinogen-specific serpin domain,
          again gene-level rather than family-level.
    supported_by:
    - reference_id: PMID:7989296
      supporting_text: >-
        The systolic blood pressure of the homozygous mutant mice was 66.9 +/- 4.1 mm Hg, significantly
        lower than that of wild-type mice (100.4 +/- 4.4 mm Hg).
    - reference_id: PMID:25691624
      supporting_text: >-
        AAV-driven expression of both forms of AGT led to equivalent increases of systolic blood
        pressure and augmentation of atherosclerotic lesion size in hepAGT-/- mice.
- term:
    id: GO:0004867
    label: serine-type endopeptidase inhibitor activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR000215
  review:
    summary: >-
      The InterPro route to the same false claim as the GO:0004867 IBA. The single signature is
      IPR000215 'Serpin_fam', which matches the whole serpin family including its many non-inhibitory
      members (corticosteroid-binding globulin, thyroxine-binding globulin, PEDF, ovalbumin, HSP47,
      and angiotensinogen). The interpro2go mapping IPR000215 -> GO:0004867 is therefore only
      as good as the assumption that every serpin inhibits, which is false, and AGT is one of
      the members where it fails.
    action: REMOVE
    reason: >-
      A demonstrably over-broad InterPro2GO mapping applied to a member that lacks the activity.
      Removing it is safe on exactly the grounds the guidelines allow for IEA rows: AGT has no
      reactive bond, a proline-blocked hinge, MEROPS non-inhibitor classification, and a published
      crystal structure showing it cannot undergo the stressed-to-relaxed transition. Note that
      AGT's own gene-level signatures (IPR000227, IPR033834) give a correct annotation via the
      same pipeline.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: InterPro:IPR000215
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          InterPro 'Serpin_fam' - a whole-family signature. It correctly identifies AGT as a serpin
          (UniProt agrees: 'Belongs to the serpin family'), but the activity its interpro2go mapping
          carries is not a property of every family member and is not a property of this one.
      residue_claims_not_applicable: >-
        The residue argument is made once, on the GO:0004867 IBA row; this row is the same claim
        reaching AGT by a different pipeline and rests on the same evidence.
    supported_by:
    - reference_id: PMID:20927107
      supporting_text: angiotensinogen-a non-inhibitory member of the serpin family of protease
        inhibitors
    - reference_id: PMID:30563843
      supporting_text: >-
        In contrast, it has been shown that AGT has lost the ability to undergo this typical serpin
        S-to-R transition (29), confirmed here by our structure of loop-cleaved AGT, so it was
        very puzzling why the serpin framework was selected in the course of evolution as an angiotensin
        carrier.
    - reference_id: file:human/AGT/AGT-uniprot.txt
      supporting_text: 'SIMILARITY: Belongs to the serpin family.'
