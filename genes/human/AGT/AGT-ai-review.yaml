  qualifier: enables
  supporting_entities:
  - UniProtKB:C9J082
  review:
    summary: >-
      One of ten GO:0005515 rows from a single large-scale yeast two-hybrid interactome of neurodegenerative
      disease proteins. Angiotensinogen is not a neurodegeneration protein and appears here as
      library prey. The partner in this row is UniProtKB:C9J082 (NPHP1, Nephrocystin 1), for which
      UniProt annotates no subcellular location at all, so the pairing cannot even be assessed
      for compartment plausibility. No functional consequence of this pairing has been reported
      for either protein.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Bare 'protein binding' from one high-throughput screen, with no functional follow-up, no
      orthogonal validation, and a systematic compartment mismatch: AGT is a secreted, signal-peptide-cleaved,
      disulfide-bonded, four-site N-glycosylated plasma protein, while yeast two-hybrid reconstitutes
      a transcription factor in the yeast nucleus. Across all ten partners, 0 of 10 share a secreted
      or extracellular compartment with AGT. The paper itself calls these candidate interactions,
      and UniProt's NbExp=3 is replicates within this one study rather than three independent
      studies. Marked over-annotated rather than removed: the screen is reproducible, it is simply
      uncharacterised for this gene.
    supported_by:
    - reference_id: PMID:32814053
      supporting_text: >-
        candidate interactions and is generated by systematic yeast two-hybrid interaction screening
        of
    - reference_id: file:human/AGT/AGT-bioinformatics/RESULTS.md
      supporting_text: All ten PMID:32814053 partners are intracellular
