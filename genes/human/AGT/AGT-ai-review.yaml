  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Correctly cited HDA detection. The objection is to the inference, not the citation: an abundant
      plasma protein detected in a tissue ECM proteome is the expected blood background, and no
      matrix function has been reported for angiotensinogen.
- id: PMID:27068509
  title: >-
    Extracellular matrix remodelling in response to venous hypertension: proteomics of human varicose
