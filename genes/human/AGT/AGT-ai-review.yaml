- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:18202720
  qualifier: enables
  supporting_entities:
  - UniProtKB:P25095
  review:
    summary: >-
      Real interaction, uninformative term. The partner is rat Agtr1 (P25095), the type-1 angiotensin
      II receptor - UniProt records the pair as a cross-species IntAct entry with 10 experiments.
      The molecule on the AGT side is the angiotensin II octapeptide, and what it does to AGTR1
      is act as its agonist. 'Protein binding' says none of that, and GO curation guidance is
      to replace bare GO:0005515 with an informative molecular function wherever the partner is
      known.
    action: MODIFY
    reason: >-
      The specific term GO:0031702 type 1 angiotensin receptor binding is available, is already
      used elsewhere in this gene's record for the same interaction from a different reference,
      and states what the bare parent hides.
    proposed_replacement_terms:
    - id: GO:0031702
      label: type 1 angiotensin receptor binding
    supported_by:
    - reference_id: PMID:18202720
      supporting_text: >-
        Here, we show that cell stretch leads to activation of the AT(1) receptor, which undergoes
        an anticlockwise rotation and a shift of transmembrane (TM) 7 into the ligand-binding
        pocket.
    - reference_id: file:human/AGT/AGT-uniprot.txt
      supporting_text: 'P01019; P25095: Agtr1; Xeno; NbExp=10'
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:20927107
  qualifier: enables
  supporting_entities:
  - UniProtKB:P00797
  review:
    summary: >-
      The single most important interaction in this gene's record, recorded as bare 'protein binding'.
      The partner is renin (P00797), and the association is not a transient enzyme-substrate encounter:
      the crystal structure of the human angiotensinogen-renin complex shows a 670 A^2 body-to-body
      interface outside the active-site cleft, with helix A of AGT lying across renin's active
      site and helix C and the CD-loop contacting renin's N-terminal lobe. The follow-up structures
      show a tail-into-mouth allosteric mechanism and demonstrate by mutagenesis and kinetics
      that specificity is set by AGT residues and glycans outside that cleft.
    action: MODIFY
    reason: >-
      GO:0002020 protease binding is the informative molecular function this interaction supports
      and is the only term in AGT's whole record that describes what the full-length precursor
      itself does. The interface is extensive, structurally characterised, and functionally load-bearing
      rather than incidental to catalysis.
    proposed_replacement_terms:
    - id: GO:0002020
      label: protease binding
    supported_by:
    - reference_id: PMID:20927107
      supporting_text: >-
        there is a substantial contact surface of 670Å2 between the bodies of the two proteins,
        primarily hydrophobic in nature
    - reference_id: PMID:30563843
      supporting_text: >-
        These structures revealed that AGT undergoes profound conformational changes and binds
        renin through a tail-into-mouth allosteric mechanism that inserts the N terminus into
        a pocket equivalent to a hormone-binding site on other serpins.
    - reference_id: PMID:30563843
      supporting_text: >-
        Mutagenesis and kinetic analyses confirmed that renin-mediated production of angiotensin
        I is controlled by interactions of amino acid residues and glycan components outside renin's
        active-site cleft.
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:23082758
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q10714
  review:
    summary: >-
      A cross-phylum enzyme-substrate co-crystal reported as a protein-protein interaction. The
      partner Q10714 is AnCE, the Drosophila melanogaster angiotensin-converting enzyme homologue,
      and UniProt flags the pair 'Xeno'. What was actually crystallised is the insect enzyme with
      the mammalian angiotensin I decapeptide (and bradykinin, and a snake-venom peptide) sitting
      in its active site. That is a peptide in a catalytic cleft, not an interaction of human
      angiotensinogen with a human partner.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Structurally real but of no interpretive value for human AGT: a 10-residue cleavage product
      of AGT bound in the active site of a Drosophila enzyme, used as a structural model for human
      ACE. Human ACE processing of angiotensin I is already represented properly in this record
      by the Reactome reactions. Kept rather than removed because the structure is genuine.
    supported_by:
    - reference_id: PMID:23082758
      supporting_text: >-
        Here, we report the structures of an ACE homologue from Drosophila melanogaster (AnCE;
        a proven structural model for the more complex human ACE) co-crystallized with mammalian
        peptide substrates (bradykinin, Thr(6) -bradykinin, angiotensin I and a snake venom peptide
        inhibitor, bradykinin-potentiating peptide-b).
    - reference_id: file:human/AGT/AGT-uniprot.txt
      supporting_text: 'P01019; Q10714: Ance; Xeno; NbExp=2'
- term:
