- term:
    id: GO:0038166
    label: angiotensin-activated signaling pathway
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:87963
  - PANTHER:PTN008518321
  - UniProtKB:P01019
  review:
    summary: >-
      Well-placed, angiotensinogen-specific inference. Node PTN008518321 is not a family-wide
      node: it is seeded by mouse Agt (MGI:MGI:87963 = P11859) and human AGT itself, at taxon
      117571 (Euteleostomi). The term describes the pathway initiated when angiotensin II binds
      AGTR1/AGTR2, and angiotensin II exists only as a cleavage product of angiotensinogen, so
      no other gene could seed it.
    action: ACCEPT
    reason: >-
      This is the core biological process of the gene and the node is tightly and correctly drawn
      around the angiotensinogens. The three-token WITH/FROM is short because the clade is small,
      not because the evidence is thin.
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: MGI:MGI:87963
        source_label: Agt (Mus musculus)
        source_status: SUPPORTS_TRANSFER
        comment: >-
          Mouse Agt (P11859), the 1:1 orthologue. Its own knockout abolishes plasma angiotensin
          I (PMID:7989296), which is the strongest possible descendant evidence that this pathway
          depends on angiotensinogen.
      - source_id: PANTHER:PTN008518321
        source_label: PAINT ancestral node
        source_status: SUPPORTS_TRANSFER
        comment: >-
          Angiotensinogen-specific IBD node (taxon:117571), seeded by mouse and human angiotensinogen.
          Confirmed in the committed PAINT slice for PTHR11461, where it also carries GO:0042981.
      - source_id: UniProtKB:P01019
        source_label: AGT (Homo sapiens)
        source_status: SUPPORTS_TRANSFER
        comment: >-
          Human AGT, the target's own accession. Its five direct GO:0038166 annotations are among
          the descendant evidences behind the IBD; the target appearing in its own WITH/FROM is
          expected and marks experimental grounding on the target, not circularity.
    supported_by:
    - reference_id: PMID:1567413
      supporting_text: >-
        Ligand binding studies of the cloned receptor expressed in COS cells suggested that it
        is pharmacologically a type 1 angiotensin II receptor subtype.
    - reference_id: PMID:7989296
      supporting_text: >-
        These mice do not produce angiotensinogen in the liver, resulting in the complete loss
        of plasma immunoreactive angiotensin I.
- term:
    id: GO:0004867
    label: serine-type endopeptidase inhibitor activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - MGI:MGI:891970
  - PANTHER:PTN008970140
  - RGD:1307404
  - RGD:3326
  - RGD:619817
  - UniProtKB:P01009
  - UniProtKB:P05154
  - UniProtKB:Q3ZEJ6
  - UniProtKB:Q86WD7
  - UniProtKB:Q9TTE1
  review:
    summary: >-
      Over-propagated family inference, and the clearest defect in this gene's record. GO:0004867
      is defined as 'Binds to and stops, prevents or reduces the activity of a serine-type endopeptidase'.
      Angiotensinogen does none of that. It is the SUBSTRATE of renin, an ASPARTYL protease -
      wrong catalytic class and wrong role. The serpin inhibitory mechanism requires cleavage
      at the reactive centre loop followed by a stressed-to-relaxed transition that traps the
      protease, and AGT has been shown crystallographically to have lost that transition. Sequence
      analysis agrees: AGT carries no UniProt 'Reactive bond' site (10 of 12 inhibitors in the
      panel do), its P17-P9 hinge is ADEREPTES against SERPINA1's EKGTEAAGA with a helix-breaking
      Pro430 at the P12 position that must be small for beta-sheet A insertion, and MEROPS classes
      it I04.953, in the range reserved for non-inhibitor homologues. Every one of the 7 resolvable
      seed proteins of node PTN008970140 is a MEROPS inhibitor.
    action: REMOVE
    reason: >-
      A family-level inference contradicted by the target's own structure and sequence. The IBD
      node PTN008970140 is the SERPINA-clade node and every seed that donated the term is a genuine
      inhibitory serpin; AGT is the one non-inhibitory member of that clade and inherits the activity
      mechanically. No seed annotation is wrong, so this is a propagation failure, not a source
      failure, and removing it overrules no experimental annotation. Note that PAINT already uses
      IRD in this same family (node PTN002606963 blocks GO:0005576 for the intracellular subclade);
      an IRD at the angiotensinogen node would fix every inherited copy at once.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      - PSEUDO_OR_SUBACTIVITY_LOSS
      source_entities:
      - source_id: MGI:MGI:891970
        source_label: Serpina1b (Mus musculus)
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Serpina1b (Mus musculus): MEROPS I04.001. A genuine inhibitory serpin with an intact
          reactive centre, so the term is right for this seed. It does not transfer to AGT, which
          is MEROPS I04.953 - the range reserved for non-inhibitor homologues - and which has
          no annotated reactive bond and a proline at the P12 hinge position.
      - source_id: PANTHER:PTN008970140
        source_label: PAINT ancestral node
        source_status: SOURCE_BAD
        comment: >-
          SERPINA-clade IBD node (taxon:7711) seeded exclusively by inhibitory serpins. The node
          assertion is correct for those seeds but its placement covers angiotensinogen, the one
          clade member that lost the inhibitory mechanism, so as an assertion about the clade
          as a whole it is wrong.
      - source_id: RGD:1307404
        source_label: Serpinc1 (Rattus norvegicus)
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Serpinc1 (Rattus norvegicus): no MEROPS cross-reference on its own UniProt entry, though
          its human orthologue is MEROPS-classified as an inhibitor. A genuine inhibitory serpin
          with an intact reactive centre, so the term is right for this seed. It does not transfer
          to AGT, which is MEROPS I04.953 - the range reserved for non-inhibitor homologues -
          and which has no annotated reactive bond and a proline at the P12 hinge position.
      - source_id: RGD:3326
        source_label: Serpina1 (Rattus norvegicus)
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Serpina1 (Rattus norvegicus): MEROPS I04.001. A genuine inhibitory serpin with an intact
          reactive centre, so the term is right for this seed. It does not transfer to AGT, which
          is MEROPS I04.953 - the range reserved for non-inhibitor homologues - and which has
          no annotated reactive bond and a proline at the P12 hinge position.
      - source_id: RGD:619817
        source_label: Serpina5 (Rattus norvegicus)
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Serpina5 (Rattus norvegicus): no MEROPS cross-reference on its own UniProt entry, though
