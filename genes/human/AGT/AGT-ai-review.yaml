  original_reference_id: PMID:3397061
  qualifier: enables
  review:
    summary: >-
      The origin of the serpin-inhibitor claim, and its own wording shows it was never an activity
      measurement. This is a 1988 paper reporting the cloning and sequencing of the MOUSE angiotensinogen
      gene. Its statement about inhibition is a sequence alignment: because angiotensinogen is
      homologous to serpins, the authors aligned the putative reactive centre across species.
      The same abstract then notes that the human site differs from the rodent one and that the
      significance of that divergence was unknown. No inhibition assay, no protease, no kinetics
      - a homology observation recorded as a traceable author statement and thereafter read as
      a molecular function.
    action: REMOVE
    reason: >-
      The claim is false and its source does not even assert it. Angiotensinogen does not inhibit
      serine endopeptidases: it has no reactive bond, a proline-blocked hinge at P12, MEROPS non-inhibitor
      classification I04.953, and a crystal structure of loop-cleaved protein showing it cannot
      undergo the stressed-to-relaxed transition that the inhibitory mechanism requires. Its protease
      partner renin is an aspartyl protease and AGT is its substrate. Removing this, the IBA and
      the IEA together eliminates the claim from the record; no experimental annotation is being
      overruled, because none exists.
