- term:
    id: GO:0038166
    label: angiotensin-activated signaling pathway
  evidence_type: IDA
  original_reference_id: PMID:18971559
  qualifier: involved_in
  review:
    summary: >-
      Angiotensin-activated signalling is the core biological process of this gene: angiotensin
      II is produced from angiotensinogen and from nothing else, and this term names the pathway
      it initiates. Here it is evidenced in primary human monocyte-macrophages, where added angiotensin
      II raises ACAT1 through AGTR1 and the effect is abolished by AT1 antagonists but not by
      an AT2 antagonist - a clean receptor-specific demonstration of the pathway.
    action: ACCEPT
    reason: Core process, correctly evidenced with receptor-subtype controls.
    supported_by:
    - reference_id: PMID:18971559
      supporting_text: >-
        Two-fold increases in ACAT1 protein expression and ACAT activity with Ang II treatment
        were completely inhibited by AT(1) receptor antagonists
    - reference_id: PMID:18971559
      supporting_text: >-
        Application of an Ang II type 1 (AT(1)) receptor agonist (L162313), but not an Ang II
        type 2 (AT(2)) receptor agonist (CGP42112A), mimicked the effects of Ang II treatment
        in inducing ACAT1 protein expression.
- term:
    id: GO:0090205
    label: positive regulation of cholesterol metabolic process
  evidence_type: IDA
  original_reference_id: PMID:18971559
  qualifier: acts_upstream_of
  review:
    summary: >-
      A downstream cellular response to added angiotensin II, correctly qualified. Angiotensin
      II raises ACAT1, which esterifies free cholesterol for storage in lipid droplets. AGT is
      not itself a participant in cholesterol metabolism; it is the source of a hormone whose
      receptor engagement changes the expression of a cholesterol enzyme. The 'acts_upstream_of'
      qualifier is what makes this defensible, and it is the qualifier several sibling rows from
      the same class of experiment should have used but did not.
    action: KEEP_AS_NON_CORE
    reason: >-
      Real and reproducible, but two steps removed from anything angiotensinogen does: hormone
      -> receptor -> transcriptional change in an unrelated enzyme. Peripheral to the gene's function
      and correctly marked as upstream rather than participatory.
    supported_by:
    - reference_id: PMID:18971559
      supporting_text: >-
        Ang II significantly increased ACAT1 protein expression in a time- or concentration-dependent
        manner.
- term:
    id: GO:0001819
    label: positive regulation of cytokine production
  evidence_type: IDA
  original_reference_id: PMID:17906677
  qualifier: involved_in
  review:
    summary: >-
      Real but indirect, and from a paper about a different gene. The study transfects ACE2 into
      an endothelial cell line and asks what that does to insulin signalling; the AGT-side observation
      is that angiotensin II and angiotensin IV induce macrophage migration inhibitory factor,
      which ACE2 transfer then suppresses. So the evidence for AGT is 'added peptide raises a
      cytokine in a cell line', which is genuine but sits at the far end of the hormone's action.
    action: KEEP_AS_NON_CORE
    reason: >-
      Angiotensin II is genuinely pro-inflammatory and cytokine-inducing, so the biology is sound,
      but this is a cellular response to the hormone rather than a function of angiotensinogen,
      and the citation's subject is ACE2.
    supported_by:
    - reference_id: PMID:17906677
      supporting_text: >-
        Gene transfer of ACE2 suppressed the expression of p22phox and MIF induced by angiotensin
        (Ang) II and Ang IV, accompanied by a decreased level of malondialdehyde in cells.
- term:
    id: GO:0050729
    label: positive regulation of inflammatory response
  evidence_type: IDA
  original_reference_id: PMID:17906677
  qualifier: involved_in
  review:
    summary: >-
      The inflammatory arm of the same experiment. Angiotensin II induces MIF, a pro-inflammatory
      cytokine, in the EAhy926 endothelial line; ACE2 over-expression, which degrades angiotensin
      II, reverses it. Duplicated by a TAS row for the same term from the PMID:17159080 editorial.
    action: KEEP_AS_NON_CORE
    reason: >-
      A well-established consequence of angiotensin II signalling, but a response of the target
      cell rather than an activity of angiotensinogen, and evidenced here only in an immortalised
      endothelial line.
    supported_by:
    - reference_id: PMID:17906677
      supporting_text: >-
        Gene transfer of ACE2 suppressed the expression of p22phox and MIF induced by angiotensin
        (Ang) II and Ang IV, accompanied by a decreased level of malondialdehyde in cells.
- term:
    id: GO:2000379
    label: positive regulation of reactive oxygen species metabolic process
  evidence_type: IDA
  original_reference_id: PMID:17906677
  qualifier: involved_in
  review:
    summary: >-
      The oxidative arm of the same experiment: angiotensin II induces p22phox, an NADPH oxidase
      subunit, raising malondialdehyde, and ACE2 transfer reverses it. Angiotensin II-driven NADPH
      oxidase activation is one of the best-replicated effects in vascular biology, so the direction
      is not in doubt; the reservation is the same as for the sibling rows.
    action: KEEP_AS_NON_CORE
    reason: >-
      Real downstream redox signalling initiated by the hormone, not a molecular or cellular role
      of the precursor protein.
    supported_by:
    - reference_id: PMID:17906677
      supporting_text: >-
        In addition, Ang II diminished insulin-stimulated phosphorylation of Akt (at Ser(473))
        and eNOS (at Ser(1177)) and NO generation, effects which were reversed by ACE2 gene transfer
        and anti-MIF treatment in endothelial cells.
- term:
    id: GO:0008083
    label: growth factor activity
  evidence_type: IDA
  original_reference_id: PMID:10406457
  qualifier: enables
  review:
    summary: >-
      Contradicted by the paper it cites. GO:0008083 is defined as 'The function that stimulates
      a cell to grow or proliferate'. PMID:10406457 is an AT2-receptor intracellular-loop mutagenesis
      study in PC12 cells, and everything it measures runs the other way: AT2-mediated apoptosis,
      inhibition of ERK, and SHP-1 activation. It contains no growth or proliferation assay. A
      second paper cited elsewhere in this same record independently reports that angiotensin
      II does not increase proliferation in its system.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Angiotensin II is genuinely mitogenic for vascular smooth muscle through AGTR1, so the term
      is not absurd for the gene and I am not removing it. But the cited evidence is an apoptosis-and-ERK-inhibition
      study, which cannot support a growth factor activity, and no growth-factor assay on AGT
      or its peptides is cited anywhere in the record. GO's own comment on this term also suggests
      considering GO:0048018 receptor agonist activity, which would fit angiotensin II far better.
    supported_by:
    - reference_id: PMID:10406457
      supporting_text: >-
        Deletion of residues 240-244 within the intermediate portion of the i3 loop resulted in
        a complete loss of AT2-mediated apoptosis, inhibition of extracellular signal-regulated
        kinases (ERK), and SHP-1 activation.
    - reference_id: PMID:10406457
      supporting_text: >-
        Our data demonstrate that the intermediate portion of the i3 loop is important for AT2
        function and that SHP-1 is a proximal effector of the AT2 receptor that is implicated
        in the inhibition of ERKs and in the apoptotic effect of this receptor.
    - reference_id: PMID:15652490
      supporting_text: >-
        Moreover, Ang II induces a time- and dose-dependent augmentation in cell migration, but
        does not affect HUVEC proliferation.
- term:
    id: GO:0038166
    label: angiotensin-activated signaling pathway
  evidence_type: IMP
  original_reference_id: PMID:15153556
  qualifier: involved_in
  review:
    summary: >-
      Angiotensin-activated signalling is the core biological process of this gene: angiotensin
      II is produced from angiotensinogen and from nothing else, and this term names the pathway
      it initiates. Evidenced here in mouse embryonic renal cell lines, where added angiotensin
      II upregulates Pax-2 through AGTR2 and the effect is blocked by the AT2 antagonist PD123319
      but not by the AT1 antagonist losartan. The receptor-subtype pharmacology is clean. The
      IMP code is loose - the perturbations are receptor antagonists and kinase inhibitors, not
      mutations in AGT - but the pathway claim holds.
    action: ACCEPT
    reason: >-
      Core process, correctly identified, with receptor-specific antagonist controls. The evidence-code
      choice is questionable but the annotation is not.
    supported_by:
    - reference_id: PMID:15153556
      supporting_text: >-
        Angiotensin II (AngII) upregulated Pax-2 protein and Pax-2 mRNA expression via the AngII
        type 2 (AT(2)) receptor in MK4 but not in MK3 cells.
- term:
    id: GO:0038060
    label: nitric oxide-cGMP-mediated signaling
  evidence_type: TAS
  original_reference_id: PMID:17159080
  qualifier: involved_in
  review:
    summary: >-
      Sourced from PMID:17159080, which PubMed types as Comment / Editorial / Review. It is a
      two-page commentary on another paper and the cached record contains no abstract text at
      all - only the citation line. It is the sole source for eleven GOA rows on this gene, four
      of them coded TAS. The commentary's subject is AGTR1/AGTR2 cross-talk in vascular remodelling,
      and the AT2 arm is conventionally described as signalling through bradykinin, nitric oxide
      and cGMP. That is a receptor-level statement about AGTR2, applied here to the ligand's precursor.
    action: KEEP_AS_NON_CORE
    reason: >-
      The AT2/NO-cGMP arm is real and is the counter-regulatory limb of the pathway, so the term
      is not wrong. But it is a statement about receptor signalling taken from an editorial with
      no primary data, and it is peripheral to the gene's core role.
    supported_by:
    - reference_id: PMID:17906677
      supporting_text: >-
        In addition, Ang II diminished insulin-stimulated phosphorylation of Akt (at Ser(473))
        and eNOS (at Ser(1177)) and NO generation, effects which were reversed by ACE2 gene transfer
        and anti-MIF treatment in endothelial cells.
- term:
    id: GO:1901203
    label: positive regulation of extracellular matrix assembly
  evidence_type: IDA
  original_reference_id: PMID:30729664
  qualifier: acts_upstream_of
  review:
    summary: >-
      Three steps removed from angiotensinogen. In this atrial fibrosis model angiotensin II raises
      miR-23b-3p and miR-27b-3p in human atrial fibroblasts; those miRNAs target TGFBR3; loss
      of TGFBR3 activates Smad3; and it is over-expression of the miRNAs, not angiotensin II,
      that raises COL1A1, COL3A1 and ACTA2. The 'acts_upstream_of' qualifier is doing necessary
      work here.
    action: KEEP_AS_NON_CORE
    reason: >-
      Real fibrotic biology downstream of angiotensin II and correctly qualified as upstream rather
      than participatory, but too indirect to be a function of the gene.
    supported_by:
    - reference_id: PMID:30729664
      supporting_text: A cell model of atrial fibrosis was achieved in Ang-II-induced HAFs.
    - reference_id: PMID:30729664
      supporting_text: >-
        Moreover, Smad3 was activated in HAFs in response to Ang-II treatment and inactivation
        of Smad3 attenuated up-regulation of miR-23b-3p and miR-27b-3p in Ang-II-treated HAFs.
- term:
    id: GO:1902895
    label: positive regulation of miRNA transcription
  evidence_type: IMP
  original_reference_id: PMID:30729664
  qualifier: acts_upstream_of
  review:
    summary: >-
      Directly measured: miR-23b-3p and miR-27b-3p rise in angiotensin II-treated human atrial
      fibroblasts, and Smad3 inactivation blocks that rise. This is the most immediate of the
      three rows from this paper.
    action: KEEP_AS_NON_CORE
    reason: >-
      A real transcriptional response to the hormone in a primary human cell type, correctly qualified
      as upstream. Peripheral to the gene's function. The IMP code sits oddly on an experiment
      whose perturbation is peptide addition rather than a mutation in AGT.
    supported_by:
    - reference_id: PMID:30729664
      supporting_text: >-
        We found that miR-23b-3p and miR-27b-3p were markedly increased in atrial appendage tissues
        of AF patients and in Ang-II-treated HAFs.
- term:
    id: GO:1990776
    label: response to angiotensin
  evidence_type: IDA
  original_reference_id: PMID:30729664
  qualifier: acts_upstream_of
  review:
    summary: >-
      Nearly tautological as written: angiotensinogen 'acts upstream of' the response to angiotensin.
      It is true - angiotensinogen is the sole source of the ligand, so it necessarily precedes
      any response to it - but it conveys no information beyond what GO:0038166 already states,
      and it would be equally true of every angiotensin experiment ever done.
    action: KEEP_AS_NON_CORE
    reason: >-
      Not wrong, and the qualifier is the correct one, but uninformative: it restates the definitional
      relationship between the precursor and its own peptide. Kept because it is harmless and
      correctly qualified.
    supported_by:
    - reference_id: PMID:30729664
      supporting_text: A cell model of atrial fibrosis was achieved in Ang-II-induced HAFs.
- term:
    id: GO:0038166
    label: angiotensin-activated signaling pathway
  evidence_type: IDA
  original_reference_id: PMID:15652490
  qualifier: involved_in
  review:
    summary: >-
      Angiotensin-activated signalling is the core biological process of this gene: angiotensin
      II is produced from angiotensinogen and from nothing else, and this term names the pathway
      it initiates. Here in primary human umbilical vein endothelial cells, where angiotensin
      II drives FAK and paxillin phosphorylation and migration through PI3K, Src and EGFR transactivation.
    action: ACCEPT
    reason: Core process, in a primary human cell type, with pathway inhibitor dissection.
    supported_by:
    - reference_id: PMID:15652490
      supporting_text: >-
        In the present study, we demonstrated that Ang II provokes a transitory enhancement of
        focal adhesion kinase (FAK) and paxillin phosphorylation in human umbilical endothelial
        cells (HUVEC).
- term:
    id: GO:0051897
    label: positive regulation of phosphatidylinositol 3-kinase/protein kinase B signal transduction
  evidence_type: IDA
  original_reference_id: PMID:15652490
  qualifier: involved_in
  review:
    summary: >-
      A downstream signalling response to added angiotensin II. Wortmannin and LY294002 attenuate
      the FAK/paxillin phosphorylation, placing PI3K in the pathway. This is a property of the
      AGTR1-bearing endothelial cell, not of angiotensinogen.
    action: KEEP_AS_NON_CORE
    reason: >-
