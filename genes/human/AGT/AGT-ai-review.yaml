  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Correctly cited for an AGT-AGTR1 interaction (UniProt records the pair as a cross-species
      IntAct entry with 10 experiments), but recorded under the uninformative GO:0005515. MODIFIED
      to type 1 angiotensin receptor binding.
- id: PMID:4300938
  title: Enzymatic degradation and electrophoresis of human angiotensin I.
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: >-
      A 1968 paper cited by UniProt for the signal peptide and the 'Secreted' location, and by
      GOA as the IDA behind is_active_in extracellular region. PubMed holds no abstract for it,
      so the experiment cannot be inspected here. The conclusion is not in doubt and is corroborated
      many times over, but the evidence itself is unread.
- id: PMID:14718574
  title: >-
    The human plasma proteome: a nonredundant list developed by combination of four separate sources.
  full_text_unavailable: true
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      A consolidated catalogue of 1175 plasma gene products rather than an experiment. Correctly
      cited as NAS for extracellular localisation, where it adds breadth of corroboration and
