- gap_statement: >-
    GO cannot express the distinction between a precursor protein and the peptides cleaved from
    it, so every function of angiotensin I, II, III, IV and (1-7) is recorded indistinguishably
    on the 476-residue precursor.
  boundary: >-
    Established, and handled better elsewhere: UniProt separates the layers explicitly, with eight
    PEPTIDE features, per-chain FUNCTION blocks for angiotensin-2, angiotensin-3 and angiotensin-(1-7),
    and IntAct entries keyed to PRO_ chain identifiers rather than to P01019. Reactome likewise
    names its participants AGT(25-32), AGT(25-31) and so on. GOA has only the accession, so roughly
    forty rows on this gene describe the peptides while a handful describe the protein, with nothing
    to tell them apart.
