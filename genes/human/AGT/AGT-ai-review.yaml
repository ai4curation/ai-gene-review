    correctness: VERIFIED
    review_notes: >-
      Correctly cited HDA detection, but the starting material is plasma, where angiotensinogen
      is present at microgram-per-millilitre concentrations, so its appearance in a plasma-derived
      vesicle fraction carries no localisation information.
- id: file:human/AGT/AGT-deep-research-affinage.md
  title: Affinage mechanistic annotation for AGT (human)
  reference_review:
    relevance: LOW
    correctness: LOW_QUALITY
    review_notes: >-
      The script's trust gate tripped (self_evaluation_pairwise: tie, not win), and the record
      fails independently of that. It confuses AGT with AGXT: the narrative asserts that AGT has
      peroxisomal alanine:glyoxylate aminotransferase activity, citing a primary hyperoxaluria
      type 1 study in AgxtQ84-/- rats. 'AGT' is also the common abbreviation for that enzyme,
      whose HGNC symbol is AGXT (P21549) - a different gene, a different protein, a different
      compartment. The error propagates into its own GO grounding, which lists GO:0016740 transferase
      activity and GO:0005777 peroxisome for a secreted plasma serpin; none of that grounding
      was imported. Recall is also poor: none of its 11 citations appears in AGT's GOA record,
      and it misses every paper that matters for the molecular biology (PMID:20927107, PMID:30563843,
      PMID:7989296, PMID:25691624, PMID:12045255). Nothing from it is used as supporting_text
      for a mechanistic claim.
- id: file:human/AGT/AGT-uniprot.txt
  title: UniProtKB P01019 (ANGT_HUMAN) flat file
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The curated record, used for the signal peptide and chain boundaries, the eight angiotensin
      PEPTIDE features, the Cys42-Cys162 disulfide, the four N-glycosylation sites, the 'Secreted'
      location, the serpin similarity statement, the MEROPS I04.953 cross-reference, and the IntAct
      entries. The last of those matter for the review's framing: UniProt attaches the receptor
      interactions to PRO_ chain identifiers (PRO_0000032458 with AGTR1, PRO_0000032459 with AGTR2)
      rather than to full-length angiotensinogen.
- id: file:human/AGT/AGT-bioinformatics/RESULTS.md
  title: AGT (P01019) - bioinformatics support for the annotation review
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Three analyses written for this review, all fetching live from UniProt, QuickGO and the
      committed PANTHER PAINT slice. They establish that AGT is MEROPS I04.953 while all 7 resolvable
      seeds of the donating IBD node are MEROPS inhibitors; that AGT has no UniProt reactive bond
      and a proline-blocked hinge at P12 (Pro430); and that 0 of the 10 partners from the large-scale
      yeast two-hybrid screen share a compartment with a secreted protein. The document states
      its own limits, including that the receptor-binding rows are deliberately excluded from
      the compartment metric.
- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The PAINT route behind all four IBA rows. Three of the four are correctly placed. The fourth,
      GO:0004867, descends from node PTN008970140, a SERPINA-clade node seeded exclusively by
      inhibitory serpins; the pipeline is applied correctly and the node placement is what fails.
      The same family already demonstrates the remedy, since node PTN002606963 carries an IRD
      blocking GO:0005576 for the intracellular serpin subclade.
- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO terms
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Behind two IEA rows that make an instructive pair. From the angiotensinogen-specific signatures
      IPR000227 and IPR033834 it produces GO:0003081, which is exactly right. From the family-wide
      signature IPR000215 (Serpin_fam) it produces GO:0004867, which is wrong for this member.
      The pipeline is correctly applied in both cases; the defect is in the breadth of the second
      signature's GO mapping.
- id: GO_REF:0000024
  title: >-
    Manual transfer of experimentally-verified manual GO annotation data to orthologs by curator
    judgment of sequence similarity
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The route behind all six ISS rows, transferring from rat Agt (P01015) and mouse Agt (P11859),
      both 1:1 orthologues rather than paralogues. I checked each donor in QuickGO and all six
      still carry the transferred term with experimental evidence, so none is stale or itself
      inferred. Worth noting that three of the six trace to a single rat study, PMID:8348686,
      so they are not three independent observations.
- id: GO_REF:0000120
  title: Combined Automated Annotation using Multiple IEA Methods
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Behind the GO:0005576 IEA row. One of its two inputs, UniProtKB-SubCell SL-0243, is AGT's
      own curated 'Secreted' location, so this row is not independent of the UniProt record -
      but it is correct.
- id: GO_REF:0000108
  title: >-
    Automatic assignment of GO terms using logical inference, based on on GO logical definitions
  reference_review:
    relevance: LOW
    correctness: UNVERIFIED
    review_notes: >-
      Not used by any existing annotation on this gene; listed only because the two NEW rows need
      a reference identifier and are curator inferences rather than new experiments. The experimental
      grounding for both NEW rows is given in their supported_by, from PMID:7989296 and PMID:25691624.
- id: Reactome:R-HSA-1989774
  title: Expression of AGT
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Correctly cited Reactome reaction, "Expression of AGT". It supports only the extracellular
      localisation annotation drawn from it, which is right. One of 27 such references on this
      gene, together producing 27 identical GO:0005576 rows - a quarter of the entire GOA record
      expressing one claim once per reaction. Worth noting that Reactome names its participants
      by peptide span (AGT(25-32), AGT(25-31) and so on), so it distinguishes the precursor from
      its cleavage products where GO cannot.
