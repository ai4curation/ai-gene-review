- description: >-
    Source of the angiotensin peptide hormones, and through them the effector of systemic blood
    pressure and fluid-electrolyte homeostasis. Angiotensin II, released from angiotensinogen
    by the sequential action of renin and ACE, binds the AGTR1 and AGTR2 G-protein-coupled receptors;
    through AGTR1 it activates phospholipase C and mobilises calcium, constricts arterioles, drives
    adrenal aldosterone production and renal sodium retention, and so sets arterial pressure and
    blood volume. Because angiotensin II has no gene of its own, this activity is recorded on
    the precursor, which is also what UniProt does. The dependence is absolute and demonstrated
    in both directions: deleting angiotensinogen abolishes circulating angiotensin I and drops
    systolic pressure by a third, and restoring it restores angiotensin II and pressure.
  supported_by:
  - reference_id: PMID:7989296
    supporting_text: >-
      These mice do not produce angiotensinogen in the liver, resulting in the complete loss of
      plasma immunoreactive angiotensin I.
  - reference_id: PMID:7989296
    supporting_text: >-
      The systolic blood pressure of the homozygous mutant mice was 66.9 +/- 4.1 mm Hg, significantly
      lower than that of wild-type mice (100.4 +/- 4.4 mm Hg).
