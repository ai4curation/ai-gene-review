  review:
    summary: >-
      Correct family inference. PANTHER node PTN000156123 is the secreted-serpin node of PTHR11461,
      and its 49 seeds span the whole functional range of the family - inhibitory members (SERPINA1,
      SERPINC1, SERPINE1, SERPINF2) alongside non-inhibitory ones (SERPINF1/PEDF, SERPINA6/corticosteroid-binding
      globulin, SERPINA7/thyroxine-binding globulin, chicken ovalbumin-related protein Y). What
      those proteins actually share is secretion, not inhibition, so the node is both correctly
      placed and correctly broad. AGT is a liver-secreted plasma protein with a cleaved signal
      peptide (residues 1-24) and no transmembrane segment, so it sits squarely inside the clade
      that inherited this property.
    action: ACCEPT
    reason: >-
      Extracellular localisation is a core, directly evidenced property of AGT and the phylogenetic
      inference is sound. That the same family node carries both inhibitory and non-inhibitory
      serpins is exactly why this term transfers where GO:0004867 does not.
