suggested_questions:
- question: >-
    For the PAINT curators of PTHR11461: would an IRD at the angiotensinogen node block GO:0004867
    the way the existing IRD at PTN002606963 blocks GO:0005576 for the intracellular serpin subclade?
    Angiotensinogen is the one non-inhibitory member of the SERPINA clade that node PTN008970140
    covers, and the same leak will reach every angiotensinogen orthologue in the family, not just
    the human gene.
- question: >-
    For InterPro: should the interpro2go mapping IPR000215 (Serpin_fam) -> GO:0004867 exist at
    all? The family contains many non-inhibitory members - corticosteroid-binding globulin, thyroxine-binding
    globulin, PEDF, ovalbumin, angiotensinogen - and MEROPS already distinguishes them by reserving
    the I04.9xx range. The gene-level angiotensinogen signatures IPR000227 and IPR033834 produce
    a correct annotation through the same pipeline.
- question: >-
    For BHF-UCL: GO:1903598 positive regulation of gap junction assembly is annotated to AGT by
    IGI from PMID:17416596, but that paper reports connexin 43 significantly REDUCED in the double-transgenic
    rats. Should this be GO:1903597, negative regulation of gap junction assembly?
- question: >-
    For AgBase: can the AGT-HCV F protein interaction annotated from PMID:16237761 be traced?
    The full text of that paper enumerates its 36 positive colonies by identity and does not mention
    angiotensinogen anywhere; the serpin it reports is C1 inhibitor. If the supporting data are
    in a table not present in the retrievable text, a pointer would settle it.
- question: >-
    For UniProt and GOA jointly: the pregnancy-specific disulfide-linked 2:2 heterotetramer of
    angiotensinogen with pro-PRG2, and the probable 2:2:2 complex with pro-PRG2 and C3dg, are
    curated in UniProt from PMID:20927107 and PMID:7539791 but appear nowhere in the GO record.
    What is the barrier - a missing complex term, or simply that no one has curated it?
- question: >-
    Would GOA accept annotations against the PRO chain identifiers that already exist for this
    entry? Roughly forty rows on AGT describe the pharmacology of an octapeptide, and UniProt
    already keys the receptor interactions to PRO_0000032458 and PRO_0000032459 rather than to
    P01019.
- question: >-
    Is the eleven-row dependence of this gene's record on PMID:17159080, a two-page editorial
    with no primary data and no abstract, intentional? Four of those rows are coded TAS, which
    implies traceability to a primary source that the commentary itself would have to supply.
suggested_experiments:
- description: >-
    Test directly whether angiotensinogen inhibits any serine endopeptidase. Incubate purified
    plasma-derived and recombinant glycosylated angiotensinogen with a panel of serine proteases
    spanning the targets of its SERPINA clade-mates - neutrophil elastase and proteinase 3 for
    SERPINA1, thrombin and activated protein C for SERPINA5, cathepsin G for SERPINA3 - and look
    for both residual activity loss and, critically, the SDS-stable covalent acyl-enzyme complex
    that is diagnostic of the serpin mechanism. The prediction from the structure and from MEROPS
    I04.953 is that no complex forms with any of them. This is the experiment that would convert
    the GO:0004867 removal from an argument into a measurement, and its absence from the literature
    is why the claim survived for nearly forty years.
- description: >-
    Discriminate the redox switch's physiology from its biochemistry. The in vitro effect requires
    cell-surface renin bound to the prorenin receptor, while the in vivo test used whole-animal
    plasma angiotensin II and blood pressure, both strongly buffered by renin feedback. Cross
    the Cys18Ser/Cys137Ser knock-in onto a background with tissue-specific prorenin receptor readouts
    and measure local angiotensin generation in kidney and vascular wall, rather than circulating
    levels; add a pregnancy challenge, since the human observation that motivated the model is
    pre-eclampsia.
- description: >-
    Ask what the serpin body is for. Use the renin-complex structure to design angiotensinogen
    variants that retain the N-terminal tail and the renin-binding surface but disrupt distinct
    patches elsewhere on the molecule, express them as correctly glycosylated secreted protein,
    and test each for renin cleavage kinetics (to confirm the presentation function is intact)
    and then for binding partners, cellular uptake and plasma half-life. Any patch whose disruption
    changes clearance or partner binding without changing cleavage would be the first evidence
    of a second function for the 400 residues C-terminal to the angiotensin sequence.
- description: >-
    Replace the ten yeast two-hybrid interactions with something interpretable. Pull down native
    angiotensinogen from human plasma with a monoclonal antibody raised against the body of the
    molecule rather than the angiotensin tail, and identify co-eluting proteins by mass spectrometry,
    in plasma from non-pregnant donors and from pregnant donors with and without pre-eclampsia.
    The positive control is built in: the pro-PRG2/C3dg complex should appear in the pregnancy
    samples and not the others, which both validates the method and would supply the curation
    that the GO record currently lacks.
