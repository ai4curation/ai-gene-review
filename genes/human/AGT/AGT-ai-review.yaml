      residue_claims:
      - claim_type: SUBSTITUTED
        anchor:
          accession: UniProtKB:P01009
          position: 371
          residue: A
          sequence_version: 3
        target:
          accession: UniProtKB:P01019
          position: 430
          residue: P
          sequence_version: 4
        role: >-
          hinge P12; serpin reactive-centre-loop insertion into beta-sheet A requires a small
          residue here
        method: MSA
        comment: >-
          Global pairwise alignment of P01019 to P01009 anchored on SERPINA1's UniProt 'Reactive
          bond' SITE (P1 = Met382), computed in AGT-bioinformatics/serpin_inhibitory.py. AGT's
          P17-P9 hinge is ADEREPTES (P01019 residues 425-433) against SERPINA1's EKGTEAAGA, with
          2/4 small residues at P12-P9 versus 4/4 for SERPINA1 and a mean 3.58/4 across the 12
          inhibitors in the panel. AGT additionally has no UniProt 'Reactive bond' SITE at all,
          where 10 of those 12 inhibitors do.
    supported_by:
    - reference_id: PMID:20927107
      supporting_text: angiotensinogen-a non-inhibitory member of the serpin family of protease
        inhibitors
    - reference_id: PMID:30563843
      supporting_text: >-
        To confirm conclusions from biochemical experiments that cleavage of the reactive center
        loop of AGT does not trigger the stressed-to-relaxed (S-to-R) transition characteristic
        of inhibitory serpins, we solved the structure of AGT cleaved by thermolysin treatment
        and compared it with that of intact AGT.
    - reference_id: PMID:30563843
      supporting_text: >-
        In contrast, it has been shown that AGT has lost the ability to undergo this typical serpin
        S-to-R transition (29), confirmed here by our structure of loop-cleaved AGT, so it was
        very puzzling why the serpin framework was selected in the course of evolution as an angiotensin
        carrier.
    - reference_id: file:human/AGT/AGT-bioinformatics/RESULTS.md
      supporting_text: All 7 resolvable seed proteins of IBD node `PTN008970140` are MEROPS
- term:
    id: GO:0042981
    label: regulation of apoptotic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:87963
  - PANTHER:PTN008518321
  - RGD:2069
  - UniProtKB:P01019
  review:
    summary: >-
      Defensible but peripheral and deliberately generic. The node is the same angiotensinogen-specific
      PTN008518321 seeded by mouse Agt, rat Agt and human AGT, so the inference is not over-propagated.
      The bare parent term is however the right level rather than a granularity failure: angiotensin
      II is pro-apoptotic through AGTR2 (PMID:10406457, and AGT already carries GO:2001238 positive
      regulation of extrinsic apoptotic signaling pathway) and anti-apoptotic/proliferative through
      AGTR1, so the donors do not agree in sign and the neutral parent is the correct least common
      ancestor. GO's own comment on the term endorses this use.
    action: KEEP_AS_NON_CORE
    reason: >-
      Real but secondary: apoptotic regulation is one downstream consequence of angiotensin receptor
      engagement, not what angiotensinogen is for. Kept at the parent level deliberately - this
      is not a GRANULARITY_MISMATCH, because a more specific term would have to pick a sign the
      biology does not support family-wide.
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
      - source_id: MGI:MGI:87963
        source_label: Agt (Mus musculus)
        source_status: SUPPORTS_TRANSFER
        comment: >-
          Mouse Agt (P11859); angiotensin II regulates apoptosis in mouse tissues in both directions
          depending on receptor subtype.
      - source_id: PANTHER:PTN008518321
        source_label: PAINT ancestral node
        source_status: SUPPORTS_TRANSFER
        comment: >-
          Angiotensinogen-specific IBD node, the same node that correctly seeds GO:0038166. Correctly
          placed; the reservation is about the term's breadth, not the node.
      - source_id: RGD:2069
        source_label: Agt (Rattus norvegicus)
        source_status: SUPPORTS_TRANSFER
        comment: >-
          Rat Agt (P01015), a 1:1 orthologue whose GO record carries experimentally grounded angiotensin
          phenotypes (verified live in QuickGO).
      - source_id: UniProtKB:P01019
        source_label: AGT (Homo sapiens)
        source_status: SUPPORTS_TRANSFER
        comment: >-
