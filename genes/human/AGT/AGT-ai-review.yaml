id: P01019
gene_symbol: AGT
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  Angiotensinogen is the liver-secreted plasma glycoprotein that is the sole source of the angiotensin
  peptides, and through them the origin of the renin-angiotensin system that sets blood pressure,
  blood volume and electrolyte balance. It is synthesised with a cleaved 24-residue signal peptide,
  carries N-glycans at four sites, and circulates in plasma at high, physiologically rate-influencing
  concentration. Structurally it belongs to the serpin superfamily and retains the serpin fold
  despite only about 22% identity to its closest serpin relatives, but it is a non-inhibitory
  serpin: it has no functional reactive-centre bond, its reactive centre loop does not undergo
  the stressed-to-relaxed transition by which inhibitory serpins trap proteases, and it inhibits
  no protease. The fold instead serves as a carrier and delivery device for the hormone held in
  its N-terminal tail.


  The rate-limiting step of the whole cascade is cleavage of that tail by renin, an aspartyl protease.
  Angiotensinogen is not a passive substrate in this reaction. The scissile Leu-Val bond is buried
  in an ordered 63-residue N-terminal superstructure and becomes accessible only through a large
  conformational change: renin binds through a tail-into-mouth allosteric mechanism that threads
  the N terminus into a pocket equivalent to the hormone-binding site of the carrier serpins,
  unwinds helix H, and forms an extensive body-to-body interface with the protease outside its
  catalytic cleft. Cleavage specificity and rate are set by angiotensinogen residues and glycans
  in that interface. A labile disulfide bridge between Cys42 and Cys162 (Cys18-Cys138 in mature
  numbering), the only two cysteines conserved across species, links the tail to the body of the
  molecule and gives plasma angiotensinogen a mixture of reduced and oxidised forms; the oxidised
  form is more efficiently cleaved by receptor-bound renin, although removing the bridge in mice
  does not measurably change angiotensin II production or blood pressure.


  Renin cleavage releases angiotensin I, which ACE converts to the vasoconstrictor octapeptide
  angiotensin II, and further processing by ACE2, aminopeptidases, neprilysin and other peptidases
  generates angiotensin III, angiotensin IV, angiotensin-(1-9) and angiotensin-(1-7). Angiotensin
  II acts on the AGTR1 and AGTR2 G-protein-coupled receptors: through AGTR1 it constricts arterioles,
  drives aldosterone secretion from the adrenal zona glomerulosa, promotes renal sodium and water
  retention, and stimulates cardiac, vascular and fibroblast growth and matrix deposition, while
  through AGTR2 it engages SHP-1, inhibits ERK and can promote apoptosis. Angiotensin-(1-7), acting
  on MAS1, opposes several of these effects. Loss of angiotensinogen is profound and informative:
  knockout mice have no circulating angiotensin I and are markedly hypotensive, and biallelic
  human loss-of-function mutations cause autosomal recessive renal tubular dysgenesis, with absent
  proximal tubules, fetal anuria and perinatal death, attributed to chronically low fetal renal
  perfusion pressure. Common coding variants, notably M235T, associate with essential hypertension
  and pre-eclampsia and appear to act by raising circulating angiotensinogen concentration rather
  than by altering the protein's function.
references:
- id: PMID:20927107
  title: A redox switch in angiotensinogen modulates angiotensin release.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The single most important paper for this gene and absent from the deep research report.
      Crystal structures of angiotensinogen at 2.1 A and of the human angiotensinogen-renin complex
      at 4.4 A. Verified against the cached full text: it states in its own abstract that angiotensinogen
      is a non-inhibitory serpin, which is the basis for removing the three GO:0004867 rows, and
      it supplies the 670 A^2 renin interface behind the GO:0002020 MODIFY. Its redox-switch model
      is treated as structurally sound but physiologically contested, because PMID:25691624 tested
      it in vivo.
- id: PMID:30563843
  title: Structural basis for the specificity of renin-mediated angiotensinogen cleavage.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Also missed by the deep research report. Four structures including loop-cleaved AGT, solved
      specifically to test whether the reactive centre loop triggers the stressed-to-relaxed transition;
      it does not. This is the experimental demonstration, rather than the assertion, that AGT
      lacks the serpin inhibitory mechanism, and it is what makes the GO:0004867 removals safe.
      Also the source of the tail-into-mouth mechanism and of the finding that specificity is
      set outside renin's active-site cleft.
- id: PMID:7989296
  title: Angiotensinogen-deficient mice with hypotension.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The foundational loss-of-function evidence, cited by GOA for this gene nowhere at all. Homozygous
      Agt-null mice have no plasma immunoreactive angiotensin I and a systolic pressure of 66.9
      mm Hg against 100.4 in wild-type. Supports both NEW rows and the core blood-pressure functions.
      Abstract only; the quantitative result is in the abstract.
- id: PMID:25691624
  title: >-
    Cys18-Cys137 disulfide bond in mouse angiotensinogen does not affect AngII-dependent functions
    in vivo.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The measured negative that kept a GO term out of this review. AAV delivery of wild-type
      versus Cys18Ser/Cys137Ser angiotensinogen into hepatocyte-specific Agt-null mice gave equivalent
      plasma angiotensin II, systolic blood pressure and atherosclerotic lesion size. Directly
      tests the PMID:20927107 redox model in vivo and finds the disulfide dispensable. Also the
      source of the gain-of-function direction for both NEW rows.
- id: PMID:3397061
  title: Molecular cloning of the mouse angiotensinogen gene.
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: MISCITED
    review_notes: >-
      Cited by GOA as a TAS for GO:0004867 serine-type endopeptidase inhibitor activity, which
      it does not assert. Its own abstract says only that angiotensinogen is homologous to serpins
      and that the authors aligned a putative reactive centre - and then notes that the human
      site differs from the rodent one. A sequence-alignment observation in a mouse gene-cloning
      paper became a molecular function annotation on the human gene. Correctly identified and
      correctly titled; it simply does not support the claim made from it.
- id: PMID:17159080
  title: >-
    Cross-talk between angiotensin II receptor types 1 and 2: potential role in vascular remodeling
    in humans.
  full_text_unavailable: true
  reference_review:
    relevance: LOW
    correctness: LOW_QUALITY
    review_notes: >-
      PubMed types this Comment / Editorial / Review; it is a two-page commentary on another paper,
      and the cached record contains no abstract text at all. It is nonetheless the sole source
      of eleven GOA rows on this gene, four of them coded TAS. Several of the terms it supports
      are correct RAS physiology and are accepted here on the biology rather than on this citation;
      the generic ones are marked over-annotated. Flagged so the weight of eleven rows is not
      mistaken for eleven findings.
- id: PMID:10406457
  title: Analysis of functional domains of angiotensin II type 2 receptor involved in apoptosis.
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: MISCITED
    review_notes: >-
      Sound paper, over-extended in GOA. It is an AT2 intracellular-loop mutagenesis study in
      PC12 cells measuring apoptosis, ERK inhibition and SHP-1 activation, and it properly supports
      the AGTR2-binding, apoptosis and TRK rows. It cannot support GO:0008083 growth factor activity,
      which it contradicts, nor GO:0001974 blood vessel remodeling, which it does not measure.
      Abstract only, but the abstract is unambiguous about what was done.
- id: PMID:17416596
  title: Angiotensin II-induced sudden arrhythmic death and electrical remodeling.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: MISCITED
    review_notes: >-
      An unusually well-justified IGI source: dTGR rats carry both the human renin and the human
      angiotensinogen transgenes, and neither alone produces the phenotype, which is exactly what
      IGI encodes. Three of its four rows are sound. The fourth has the sign inverted - GOA reads
      it as POSITIVE regulation of gap junction assembly, while the abstract states that connexin
      43 was significantly REDUCED in dTGR. Verified against the cached abstract.
- id: PMID:21183621
  title: >-
    Protein microarrays discover angiotensinogen and PRKRIP1 as novel targets for autoantibodies
    in chronic renal disease.
  reference_review:
    relevance: LOW
    correctness: MISCITED
    review_notes: >-
      Cited as an IDA for GO:0003014 renal system process. The cached full text is complete and
      contains no renal-process experiment: it is an autoantibody biomarker screen, and the authors
      state they cannot tell whether the antibodies target angiotensinogen or angiotensin I, nor
      establish pathogenicity. Correct paper, correct title, wrong use.
- id: PMID:32814053
  title: >-
    Interactome Mapping Provides a Network of Neurodegenerative Disease Proteins and Uncovers
    Widespread Protein Aggregation in Affected Brains.
  full_text_unavailable: true
  reference_review:
    relevance: LOW
    correctness: LOW_QUALITY
    review_notes: >-
      A competent large-scale study whose output is unsuitable for functional annotation of this
      gene. It yields ten bare protein-binding rows on AGT, a protein unrelated to neurodegeneration;
      the paper itself calls the results candidate interactions. All ten partners are intracellular
      while AGT is secreted (0/10 shared compartment, computed in AGT-bioinformatics), and UniProt's
      NbExp=3 on each is replicates within this study.
- id: PMID:16237761
  title: >-
    Screening of hepatocyte proteins binding to F protein of hepatitis C virus by yeast two-hybrid
    system.
  reference_review:
    relevance: LOW
    correctness: UNVERIFIED
    review_notes: >-
      GOA cites this (via AgBase) for an AGT-HCV F protein interaction. The cached full text is
      complete - abstract through the full discussion, in which each hit is treated in turn -
      and the word 'angiotensinogen' does not appear in it. The paper enumerates its 36 positive
      colonies by identity and angiotensinogen is not among them; the serpin it does report is
      C1 inhibitor. Left UNVERIFIED rather than WRONG_IDENTIFIER because a table lost in text
      extraction cannot be excluded.
- id: PMID:23082758
  title: >-
    Structural basis of peptide recognition by the angiotensin-1 converting enzyme homologue AnCE
    from Drosophila melanogaster.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Correctly cited and a good structural paper, but what it shows about AGT is a 10-residue
      cleavage product sitting in the active site of a Drosophila enzyme. UniProt flags the pair
      'Xeno'. Recorded on human AGT as bare protein binding, where it carries no interpretive
      weight.
- id: PMID:16116425
  title: >-
    Mutations in genes in the renin-angiotensin system are associated with autosomal recessive
    renal tubular dysgenesis.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The human loss-of-function genetics, and the basis of the UniProt DISEASE entry for renal
      tubular dysgenesis. Biallelic AGT mutations among 11 affected individuals from nine families.
      The authors' own mechanism is haemodynamic, which is why the kidney-development row is kept
      as non-core rather than as a core developmental function.
- id: PMID:1567413
  title: Cloning and characterization of a human angiotensin II type 1 receptor.
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      A receptor-cloning paper that is the source of four AGT rows including two identical GO:0005179
      IDA rows. The molecule assayed on the AGT side is synthetic angiotensin II in ligand-binding
      studies, so the evidence for 'hormone activity' is real but indirect. The claims are correct
      and independently supported; the coding is generous.
- id: PMID:1378723
  title: >-
    Cloning, expression, and characterization of a gene encoding the human angiotensin II type
    1A receptor.
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      The AT1a receptor cloning paper behind the GO:0031702 IPI and the two IC rows derived from
      it. High-affinity angiotensin II binding coupled to inositol phosphate turnover is directly
      shown.
- id: PMID:15652490
  title: >-
    Angiotensin II induces focal adhesion kinase/paxillin phosphorylation and cell migration in
    human umbilical vein endothelial cells.
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Four AGT rows, all from adding synthetic angiotensin II to primary HUVEC. Well controlled
      with pathway inhibitors. Also supplies a useful negative - angiotensin II did not affect
      HUVEC proliferation - which bears on the growth-factor-activity row.
- id: PMID:18971559
  title: >-
    Angiotensin II upregulates acyl-CoA:cholesterol acyltransferase-1 via the angiotensin II Type
    1 receptor in human monocyte-macrophages.
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: MISCITED
    review_notes: >-
      Good receptor-subtype pharmacology in primary human macrophages, supporting the angiotensin-signalling,
      cholesterol and foam-cell rows. It cannot support the GO:0005576 localisation row also drawn
      from it: no localisation experiment on angiotensinogen appears in the study.
- id: PMID:17906677
  title: >-
    Enhanced angiotensin converting enzyme 2 regulates the insulin/Akt signalling pathway by blockade
    of macrophage migration inhibitory factor expression.
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      The paper's subject is ACE2 gene transfer; the AGT-relevant observation is that angiotensin
      II and angiotensin IV induce MIF and p22phox in an endothelial cell line. Correctly cited
      for the cytokine, inflammation and ROS rows, but the evidence is a cellular response to
      an added peptide in an immortalised line.
- id: PMID:15153556
  title: Angiotensin II increases Pax-2 expression in fetal kidney cells via the AT2 receptor.
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Clean AT2-specific pharmacology in mouse embryonic renal cell lines. Supports the angiotensin-signalling
      row; the generic transcription row drawn from the same experiment is marked over-annotated.
- id: PMID:18607644
  title: >-
    Deficiency of intrarenal angiotensin II type 2 receptor impairs paired homeo box-2 and N-myc
    expression during nephrogenesis.
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      AT2R-knockout mouse embryonic kidneys, with an ex vivo angiotensin II response absent in
      the nulls. Good genetics for the receptor. Supports the ureteric-bud branching row; the
      generic transcription row from the same experiment is marked over-annotated.
- id: PMID:30729664
  title: >-
    Novel role of the clustered miR-23b-3p and miR-27b-3p in enhanced expression of fibrosis-associated
    genes by targeting TGFBR3 in atrial fibroblasts.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Correctly cited. Three AGT rows, all properly qualified 'acts_upstream_of'. The most immediate
      observation - angiotensin II raises miR-23b-3p and miR-27b-3p in primary human atrial fibroblasts
      - is direct; the matrix row is three steps downstream, since the collagen induction is driven
      by miRNA over-expression rather than by angiotensin II.
- id: PMID:28283184
  title: >-
    Angiotensin-(1-7) regulates angiotensin II-induced matrix metalloproteinase-8 in vascular
    smooth muscle cells.
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      The only row in the record representing the counter-regulatory angiotensin-(1-7)/MAS1 limb,
      which is why it is kept. Correctly cited; the IMP evidence code is loose, since the perturbations
      are peptide agonists and the MAS1 antagonist A779 rather than mutations in AGT.
- id: PMID:17069818
  title: >-
    Angiotensin II type 1-receptor antagonism prevents type IIA secretory phospholipase A2-dependent
    lipid peroxidation.
  full_text_unavailable: true
  reference_review:
    relevance: LOW
    correctness: MISCITED
    review_notes: >-
      Correct paper, wrong agent. The LDL modification it reports is the activity of sPLA2-IIA,
      confirmed by the paper's own inhibitor control; angiotensin II is two steps upstream, inducing
      the enzyme. Cited on AGT as NAS for LDL particle remodeling.
- id: PMID:8513325
  title: A molecular variant of angiotensinogen associated with preeclampsia.
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: MISCITED
    review_notes: >-
      A historically important genetic association study, cited on AGT as a TAS for the generic
      term 'cell-cell signaling', which it contains no experiment bearing on. The variant it identifies
      is also now understood to act through angiotensinogen concentration rather than function.
- id: PMID:18202720
  title: >-
    Conformational switch of angiotensin II type 1 receptor underlying mechanical stress-induced
