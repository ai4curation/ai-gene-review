      of the receptor. Every GPCR agonist that transactivates a receptor tyrosine kinase would
      earn this term.
    supported_by:
    - reference_id: PMID:15652490
      supporting_text: >-
        The effect of Ang II on FAK and paxillin phosphorylation was markedly attenuated in cells
        pretreated with wortmannin and LY294002, indicating that phosphoinositide 3-kinase (PI3K)
        plays an important role in regulating FAK activation.
- term:
    id: GO:0005179
    label: hormone activity
  evidence_type: IDA
  original_reference_id: PMID:1567413
  qualifier: enables
  review:
    summary: >-
      Correct, with a caveat about what the annotation unit means. GO:0005179 requires a substance
      formed in one tissue and carried to another where it has a specific regulatory action through
      a receptor. That describes angiotensin II exactly, and does not describe the 476-residue
      precursor, which is inert until renin cleaves it. But GOA's annotation unit is the UniProt
      accession, angiotensin II has no gene of its own, and UniProt itself carries the peptide
