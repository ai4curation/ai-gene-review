knowledge_gaps:
- gap_statement: >-
    Whether the Cys42-Cys162 (mature Cys18-Cys138) redox switch has any physiological role is
    unresolved, and the two decisive experiments disagree.
  boundary: >-
    Firmly established: the disulfide exists and is the only cysteine pair conserved across species;
    it is labile, with plasma holding a near 40:60 reduced:oxidised mixture; the oxidised form
    is preferentially cleaved by receptor-bound renin, giving a 4-fold increase in angiotensin
    release in vitro; and the oxidised form is elevated in the maternal circulation in pre-eclampsia.
    Equally firmly established: removing the bridge in mice changes nothing measurable.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    This is the only proposed mechanism by which angiotensinogen itself, rather than renin abundance,
    could regulate the cascade's output, and it is the stated rationale for antioxidant approaches
    to pre-eclampsia. If real it would justify a molecular function on the precursor; if not,
    angiotensinogen is a concentration variable and nothing more. No GO term is proposed here
    for exactly this reason.
  resolution: >-
    The in vitro and in vivo experiments differ in more than species: the in vitro effect requires
    the prorenin receptor and cell-surface renin, while the mouse experiment measured whole-animal
    plasma angiotensin II, blood pressure and lesion size, which are strongly buffered by renin
    feedback. A tissue-level or prorenin-receptor-dependent readout in the Cys-to-Ser mice, or
    a pregnancy challenge, would discriminate.
  provenance:
  - reference_id: PMID:25691624
    supporting_text: >-
      These data indicate that the Cys18-Cys137 disulfide bond in AGT is dispensable for AngII
      production and AngII-dependent functions in mice.
  - reference_id: PMID:20927107
    supporting_text: >-
      the prorenin receptor whilst having little effect on the reduced form gives a 4-fold increase
      in the renin-binding affinity (Km) of the oxidised form, with a consequent 4-fold increase
      in the catalytic release of angiotensin
- gap_statement: >-
    Why the angiotensin peptides are carried on a serpin scaffold at all is unknown. The fold
    is retained but the mechanism that defines the superfamily has been lost, and no function
    has been assigned to the retained body of the molecule beyond providing the renin-binding
    surface.
  boundary: >-
    Established: angiotensinogen retains the typical serpin fold at only about 22% identity to
    its closest serpin relatives; it has no functional reactive centre and loop cleavage does
    not trigger the stressed-to-relaxed transition; and the related non-inhibitory serpins SERPINA6
    and SERPINA7 do use that transition to release their bound hormones, which angiotensinogen
    cannot. The 400-odd residues C-terminal to the angiotensin sequence have no assigned activity.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: >-
    The authors of the structural work call this puzzling in print. If the serpin body has a function
    beyond presenting the tail to renin - a second ligand, a clearance receptor, a protein partner
    - it would be the first molecular activity of the precursor beyond protease binding, and would
    change what should be annotated on this gene.
  resolution: >-
    Structure-guided mutagenesis separating the renin-presentation surface from the rest of the
    serpin body, combined with an unbiased interaction screen using correctly folded, glycosylated,
    secreted angiotensinogen rather than a yeast two-hybrid system.
  provenance:
  - reference_id: PMID:30563843
    supporting_text: >-
      In contrast, it has been shown that AGT has lost the ability to undergo this typical serpin
