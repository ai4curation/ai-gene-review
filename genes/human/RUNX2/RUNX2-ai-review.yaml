id: Q13950
gene_symbol: RUNX2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: RUNX2 encodes the osteoblast-lineage Runt-domain transcription factor that binds regulatory
  DNA in CBFB/core-binding-factor complexes and drives RNA polymerase II transcriptional programs required
  for osteoblast differentiation, skeletal morphogenesis, and intramembranous and endochondral ossification.
  RUNX2 functions primarily at nuclear chromatin, with cytoplasmic and cytosolic pools reflecting regulated
  trafficking, interaction, and proteasomal turnover rather than its main site of transcriptional action.
