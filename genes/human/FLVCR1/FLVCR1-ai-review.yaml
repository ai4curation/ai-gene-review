  review:
    summary: The short-product-associated mitochondrial pool supports the inherited localization.
    action: KEEP_AS_NON_CORE
    reason: The mitochondrial-location IBD at PTN002589204 is on the target path. Actual endogenous human
      mitochondrial-fraction immunoblotting and complementary tagged murine-product localization support
      the short-product-associated location. Retain this distinct mitochondrial role without transferring
      it to all full-length plasma-membrane transport or inferring the inner mitochondrial membrane from
      the ancestral annotation.
