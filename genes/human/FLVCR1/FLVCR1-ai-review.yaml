- id: PMID:20610401
  title: Kinetics and specificity of feline leukemia virus subgroup C receptor (FLVCR) export function
    and its dependence on hemopexin.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected original full-text Methods/Results and Fig7 caption read. Human FLVCR expression
      in rat cells and acceptor-dependent cellular export are distinct from binding of a GST-tagged FLVCR
      fragment spanning residues 132–201 to purified rabbit apohemopexin. The fragment insert species
      is not separately specified in the inspected Methods. No full-length human-human affinity or complete
      histidine mechanism is established.
