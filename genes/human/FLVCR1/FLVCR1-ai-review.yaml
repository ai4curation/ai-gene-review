      immunoblot and human transcript depletion are distinct from tagged murine Flvcr1a/b constructs in
      human HeLa/K562 cells. Compartmental heme-content and differentiation endpoints support contextual
      roles, not purified short-product translocation or inner-versus-outer membrane resolution. No figure-pixel
      or separate supplement audit.
- id: PMID:36115835
  title: Quantitative fragmentomics allow affinity mapping of interactomes.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: Authentic original Methods/Results, exact IntAct pairs and original SupplementaryDataset1
      measurements were read and joined. Eight source pairs have above-threshold domain-peptide measurements;
      thirteen remain unresolved because every tested partner domain is below the authors detection threshold.
      Citation identity and measurements are verified, but those thirteen positive GOA assertions are
      not independently verified. No false nonbinding conclusion, invented affinity, full-length complex
      claim or FLVCR1-specific FP replication.
- id: PMID:37100056
  title: Integrative genetic analysis identifies FLVCR1 as a plasma-membrane choline transporter in mammals.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected original full-text Results/Methods read. Human-cell loss and rescue, radiolabeled
      choline uptake and unchanged measured choline-kinase activity distinguish transport from downstream
      phosphorylation. Full-length product rescue and paired tagged localization Methods are read; supplementary
      image pixels were not independently audited. Mouse phenotypes remain separate.
- id: PMID:38693265
  title: Structural basis of lipid head group entry to the Kennedy pathway by FLVCR1.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Final original Nature article is now genuinely available in the normal full-text cache.
      Selected Results, protein-expression, proteoliposome-reconstitution/uptake and cellular-assay Methods
      read. Purified human choline translocation is distinct from cellular ethanolamine uptake, selective
      mutagenesis and isotope tracing into phosphoethanolamine. Unresolved atomic-model termini are not
      natural-product deletions. No figure-pixel or separate supplement audit.
- id: PMID:38778100
  title: Molecular mechanism of choline and ethanolamine transport in humans.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected original full-text Results/Methods read. Human full-length FLVCR1a uptake,
      membrane imaging and substrate-bound structures support the two activities. CHKA/ETNK1 enhance intracellular
      trapping; cellular accumulation is not purified turnover. FLVCR1 ethanolamine washout is distinct
      from FLVCR2 choline washout. Transport is facilitative rather than an ATP pump or obligatory one-way
      importer.
