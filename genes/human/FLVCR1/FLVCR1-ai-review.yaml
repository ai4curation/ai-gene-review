  evidence_type: IDA
  original_reference_id: PMID:23187127
  qualifier: located_in
  review:
    summary: Endogenous human fractionation supports mitochondrial association of the short product.
    action: KEEP_AS_NON_CORE
    reason: The primary study detects an endogenous human C-terminal-reactive band of the short-product
      size in purified mitochondrial fractions with compartment controls. Tagged localization corroborates
      the result but uses murine constructs. Retain mitochondrial association with explicit product/antibody
      scope; no inner-versus-outer membrane or experimentally mapped targeting-peptide cleavage follows
      from these data.
    supported_by:
    - reference_id: PMID:23187127
