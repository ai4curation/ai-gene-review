  supporting_entities:
  - UniProtKB:P02790
  review:
    summary: A FLVCR fragment binds hemopexin in the reported biochemical assay.
    action: KEEP_AS_NON_CORE
    reason: Actual PMID:20610401 original Methods/Results and Fig7 caption support hemopexin binding to
      a GST-tagged FLVCR fragment spanning residues 132–201, with GST-alone and competition controls.
      The protein reagent was purified rabbit apohemopexin; human FLVCR expression is explicit in rat
      NRK cell experiments, while the binding-fragment insert species is not separately stated. Preserve
      the original human HPX accession and retain contextual binding with this species/fragment scope.
      This is not a purified full-length human-human affinity or proof of a complete transport mechanism.
    supported_by:
    - reference_id: PMID:20610401
    - reference_id: file:human/FLVCR1/FLVCR1-source-evidence.md
