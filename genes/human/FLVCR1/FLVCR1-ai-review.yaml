  review:
    summary: The GRID2IP source-pair assertion remains unresolved against the below-threshold measurements.
    action: UNDECIDED
    reason: Exact IntAct records identify the GRID2IP-FLVCR1 peptide/domain assays, but every tested GRID2IP
      domain in the actual original SupplementaryDataset1 has normalized DAPF binding intensity below
      the authors' 0.05 detection threshold and composite pKd coded zero. Thus the source does not independently
      quantify a positive association for this protein pair. Keep the original assertion UNDECIDED pending
      curator/source reconciliation. Below threshold is not proof of noninteraction and does not justify
      REMOVE; IntAct negative=false and its malformed kd:1.0x10(molar) parameter are not substitutes for
      measured positive binding.
