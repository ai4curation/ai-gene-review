  review:
    summary: The FLVCR1 terminal peptide binds a tested DLG4 PDZ domain.
    action: MODIFY
    reason: Original PMID:36115835 SupplementaryDataset1 directly reports above-threshold DAPF holdup
      binding for at least one DLG4 PDZ domain to the FLVCR1 C-terminal ten-residue peptide. MODIFY to
      GO:0030165 PDZ domain binding because the assay directly tests binding to the named PDZ domain,
      an evidence-backed specific class for the same interaction. Human protein sequences and isolated
      tagged domains/biotinylated peptides were tested in vitro, not full-length endogenous protein complexes.
      These are single measurements converted using an estimated peptide concentration, without FLVCR1-specific
      FP replication; do not transfer the partner function or infer physiological transport regulation.
