suggested_questions:
- question: How do cellular heme-export and compartmental-heme phenotypes relate mechanistically to purified
    choline transport and cellular ethanolamine transport? Direct, product-defined reconstitution could
    distinguish transport from coupled cellular handling without dismissing the older measured export
    observations.
- question: Which bilayer contains endogenous FLVCR1b, and what substrates and directionality can the
    sequence-defined 279-residue product support? Mitochondrial association does not resolve inner-versus-outer
    membrane or establish the full-length transport repertoire.
- question: Can the thirteen PMID:36115835 source-pair assertions be reconciled with the original below-threshold
    holdup measurements, and can the eight quantified peptide/PDZ interactions be verified with full-length
    proteins and independent measurements?
- question: Can the target-specific FLVCR1 assays in PMID:40972734 and detailed original Methods in PMID:22483575
    be recovered to resolve the remaining source-access limits without transferring other transporters
    kinetics?
