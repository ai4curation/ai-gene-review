id: Q9Y5Y0
gene_symbol: FLVCR1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: FLVCR1 is a multipass membrane transporter whose full-length product, FLVCR1a, facilitates
  choline and ethanolamine movement across the plasma membrane. These substrates supply downstream metabolism,
  including phospholipid synthesis through the Kennedy pathway. FLVCR1 also supports cellular heme handling
  and erythroid maturation. A shorter natural product, FLVCR1b, has been linked to mitochondrial heme homeostasis.
alternative_products:
- name: 1 (FLVCR1a)
  id: Q9Y5Y0-1
- name: 2 (FLVCR1b, mitochondrial)
  id: Q9Y5Y0-2
  sequence_note: VSP_047866
