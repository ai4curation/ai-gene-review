id: P33991
gene_symbol: MCM4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'MCM4 encodes an AAA+ ATPase motor subunit of the MCM2-7 helicase. It forms part of the MCM4-MCM6-MCM7 catalytic
  core and of the MCM2-7 ring, is loaded onto chromatin as part of origin licensing, and contributes ATP hydrolysis, single-stranded
  DNA binding and DNA helicase activity to the activated CDC45-MCM-GINS helicase at replication forks.'
existing_annotations:
- term:
    id: GO:0000727
    label: double-strand break repair via break-induced replication
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000179968
  - SGD:S000006223
  review:
    summary: Keep break-induced replication as a non-core use of the replicative helicase.
    action: KEEP_AS_NON_CORE
    reason: Break-induced replication is a homologous-recombination repair context that uses the replication helicase
      machinery; it is plausible by PAINT for the MCM2-7 clade but peripheral to the main mitotic replication role.
    supported_by:
    - reference_id: file:interpro/panther/PTHR11630/PTHR11630-paint.tsv
      supporting_text: GO:0000727
- term:
    id: GO:0000781
    label: chromosome, telomeric region
  evidence_type: HDA
  original_reference_id: PMID:19135898
  qualifier: located_in
  review:
    summary: Keep the telomeric-chromatin localization as non-core.
    action: KEEP_AS_NON_CORE
    reason: The PICh telomere proteomics row is plausible for a replicative helicase that can travel through telomeric
      chromatin, but the core location is chromatin/nuclear CMG rather than a telomere-specific pool.
    supported_by:
    - reference_id: PMID:19135898
      supporting_text: Purification of human telomeric chromatin using PICh identified the majority of known telomeric
        factors and uncovered a large number of novel associations
- term:
    id: GO:0003677
    label: DNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR001208
  - InterPro:IPR008047
  - InterPro:IPR018525
  - InterPro:IPR031327
  review:
    summary: Keep the broad DNA-binding row.
    action: ACCEPT
    reason: Human CMG is the MCM2-7-containing helicase that binds a leading-strand ssDNA template, and all MCM2-7
      subunits contact DNA in the ATP-bound human CMG structure; the narrower ssDNA-binding and helicase activities are
      captured by distinct existing rows rather than by replacing this binding term with catalytic terms.
    supported_by:
    - reference_id: PMID:22474384
      supporting_text: translocates along the leading strand (3' to 5' direction). The complex hydrolyses ATP in the
        absence of DNA; unwinds duplex regions up to 500 bp
    - reference_id: PMID:22474384
      supporting_text: The isolated complex binds to ssDNA regions in the presence of magnesium and ATP
    - reference_id: PMID:32453425
      supporting_text: All MCM subunits contact DNA, from MCM2 at the 5'-end to MCM5 at the 3'-end of the DNA spiral
- term:
    id: GO:0003678
    label: DNA helicase activity
  evidence_type: IDA
  original_reference_id: PMID:25661590
  qualifier: contributes_to
  review:
    summary: Refine DNA helicase activity to the ssDNA/3-prime to 5-prime helicase terms supported for the assembled CMG
      motor.
    action: MODIFY
    reason: DNA helicase activity is correct but less precise than the row's MCM4/6/7 evidence, which supports MCM4
      contributing to the single-stranded DNA helicase activity of the MCM4/6/7 subcomplex.
    proposed_replacement_terms:
    - id: GO:0017116
      label: single-stranded DNA helicase activity
    supported_by:
    - reference_id: PMID:25661590
      supporting_text: Purified MCM4/6/7 complex containing the G364R MCM4 exhibited similar levels of single-stranded DNA
        binding and ATPase activities to the complex containing wild-type MCM4. However, the mutant complex showed only
        30-50% of DNA helicase activity
- term:
    id: GO:0003678
    label: DNA helicase activity
  evidence_type: IDA
  original_reference_id: PMID:9305914
  qualifier: contributes_to
  review:
    summary: Refine DNA helicase activity to the ssDNA/3-prime to 5-prime helicase terms supported for the assembled CMG
      motor.
    action: MODIFY
    reason: DNA helicase activity is correct but less precise than the row's MCM4/6/7 evidence. The MCM4-containing
      subcomplex displaces fragments from single-stranded circular DNA with 3-prime to 5-prime polarity, supporting both
      single-stranded DNA helicase activity and 3-prime to 5-prime DNA helicase activity.
    proposed_replacement_terms:
    - id: GO:0017116
      label: single-stranded DNA helicase activity
    - id: GO:0043138
      label: 3'-5' DNA helicase activity
    supported_by:
    - reference_id: PMID:9305914
      supporting_text: Displacement of DNA fragments by the DNA helicase suggested that it migrated along single-stranded
        DNA in the 3' to 5' direction
- term:
    id: GO:0003678
    label: DNA helicase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - UniProtKB:P49717
  - ensembl:ENSMUSP00000023353
  - InterPro:IPR008047
  - EC:3.6.4.12
  review:
    summary: Refine DNA helicase activity to the ssDNA/3-prime to 5-prime helicase terms supported for the assembled CMG
      motor.
    action: MODIFY
    reason: DNA helicase activity is correct but less precise than the evidence. Human CMG is the MCM2-7-containing
      helicase that binds a leading-strand ssDNA template and translocates 3-prime to 5-prime; MCM4 contributes to this
      MCM2-7/CMG complex activity, so the source qualifier should also be changed from enables to contributes_to.
    proposed_replacement_terms:
    - id: GO:0017116
      label: single-stranded DNA helicase activity
    - id: GO:0043138
      label: 3'-5' DNA helicase activity
    supported_by:
