      supporting_text: translocates along the leading strand (3' to 5' direction). The complex hydrolyses ATP in the
        absence of DNA; unwinds duplex regions up to 500 bp
    - reference_id: PMID:22474384
      supporting_text: The isolated complex binds to ssDNA regions in the presence of magnesium and ATP
    - reference_id: PMID:32453425
      supporting_text: All MCM subunits contact DNA, from MCM2 at the 5'-end to MCM5 at the 3'-end of the DNA spiral
    source_defects:
    - defect_type: WRONG_QUALIFIER
      resource: UNIPROT
      slot: Qualifier
      requested_change: REPOINT
      asserted_value: enables
      corrected_value: contributes_to
      cause: SCOPE_OVER_REACH
      confidence: CONFIRMED
      explanation: MCM4 contributes to single-stranded DNA helicase activity as a subunit of the human MCM2-7/CMG complex;
        the GO:0003678 row should use contributes_to rather than enables.
