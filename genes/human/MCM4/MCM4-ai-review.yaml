core_functions:
- description: MCM4 is a motor subunit of the nuclear MCM2-7/CMG replicative helicase and contributes to ATP-dependent
    3-prime to 5-prime single-stranded DNA helicase activity during origin firing and replication fork progression.
  contributes_to_molecular_function:
    id: GO:0017116
    label: single-stranded DNA helicase activity
  directly_involved_in:
  - id: GO:1902975
    label: mitotic DNA replication initiation
  - id: GO:0006271
    label: DNA strand elongation involved in DNA replication
  locations:
  - id: GO:0005634
    label: nucleus
  in_complex:
    id: GO:0071162
    label: CMG complex
  supported_by:
  - reference_id: PMID:9305914
    supporting_text: ATPase activity and DNA helicase activity that displaces oligonucleotides annealed to
      single-stranded circular DNA are associated with an MCM protein complex
  - reference_id: PMID:25661590
    supporting_text: Purified MCM4/6/7 complex containing the G364R MCM4 exhibited similar levels of single-stranded DNA
      binding and ATPase activities
  - reference_id: PMID:32453425
    supporting_text: All MCM subunits contact DNA, from MCM2 at the 5'-end to MCM5 at the 3'-end of the DNA spiral
  - reference_id: file:human/MCM4/MCM4-uniprot.txt
    record_section:
    - CC:FUNCTION
    supporting_text: Core component of CDC45-MCM-GINS (CMG) helicase, the molecular machine that unwinds template DNA
      during replication
proposed_new_terms: []
suggested_questions:
- question: How do human MCM4 phosphorylation and other post-translational modifications tune MCM4-MCM6-MCM7 ATPase-site
    firing in the intact CMG?
- question: Which MCM4 variant classes impair DNA loading versus helicase translocation, and how do those defects
    produce immune deficiency, growth retardation, or cancer phenotypes?
suggested_experiments:
- description: Compare wild-type and disease-variant MCM4 in fully reconstituted human CMG helicase reactions and
    origin-firing assays.
  hypothesis: MCM4 variants separate origin loading defects from defects in ATP-driven CMG translocation.
