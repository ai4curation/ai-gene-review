id: P18859
gene_symbol: ATP5PF
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ATP5PF encodes coupling factor 6 (F6) of mitochondrial F1F0 ATP synthase (complex V), a small,
  nuclear-encoded, mitochondrially imported subunit of the peripheral stalk. Together with subunits b,
  d and OSCP, the stalk acts as a stator that holds the catalytic alpha3beta3 head and subunit a static
  against the rotating central stalk and c-ring. It is required for functional coupling of the catalytic
  F(1) and proton-translocating F(o) sectors during oxidative ATP synthesis.
