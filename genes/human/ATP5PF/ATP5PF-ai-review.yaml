  - statement: Immunocaptured human F1F0 contains its full subunit complement.
    supporting_text: The immunoprecipitated F(1)F(0) contained a full complement of subunits that were
      identified with specific antibodies against five of the subunits (alpha, beta, OSCP, d, and IF(1))
      and by MALDI-TOF and/or LC/MS/MS for all subunits except subunit c, which could not be resolved
      by these methods because of the limits of detection.
  - statement: The captured complex V is active and oligomycin-sensitive.
    supporting_text: The captured complex V displayed ATP hydrolysis activity that was fully oligomycin
      and inhibitor protein IF(1)-sensitive.
