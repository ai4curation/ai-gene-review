suggested_questions:
- question: Which stimuli and terminal synthase complements route human PTGS2-derived PGH2 toward
    prostaglandins versus aspirin-triggered specialized pro-resolving mediators?
suggested_experiments:
- description: Pair endogenous PTGS2 localization with targeted oxylipin lipidomics after cytokine,
    hypoxia and aspirin treatment in a panel of primary human inflammatory and vascular cell types.
