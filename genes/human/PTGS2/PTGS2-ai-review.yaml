- term:
    id: GO:0005637
    label: nuclear inner membrane
  evidence_type: IDA
  original_reference_id: PMID:9545330
  qualifier: located_in
  review:
    summary: PTGS2 resides on the lumenal side of ER and nuclear-envelope membranes.
    action: ACCEPT
    reason: Direct immunoelectron microscopy located PGHS-2 on ER and nuclear-envelope membranes;
      the ER, ER-lumen, ER-membrane and nuclear-membrane rows all describe that same native membrane
      topology at different granularities.
    supported_by: &id002
    - reference_id: PMID:9545330
      supporting_text: Both PGHS-1 and -2 were found on the lumenal surfaces of the endoplasmic
        reticulum (ER) and nuclear envelope of human monocytes, murine NIH 3T3 cells, and human
        umbilical vein endothelial cells. Within the nuclear envelope, PGHS-1 and -2 were present
        on both the inner and outer nuclear membranes
