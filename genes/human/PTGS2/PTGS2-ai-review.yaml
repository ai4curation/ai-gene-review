    label: prostaglandin biosynthetic process
  evidence_type: IDA
  original_reference_id: PMID:27642067
  qualifier: involved_in
  review:
    summary: PTGS2 performs the core cyclooxygenase/prostanoid biosynthetic step.
    action: ACCEPT
    reason: Human PTGS2 expression and purified-enzyme studies directly establish prostaglandin G/H
      synthase activity, and the prostaglandin/cyclooxygenase pathway terms capture its core
      PGH2-forming role.
