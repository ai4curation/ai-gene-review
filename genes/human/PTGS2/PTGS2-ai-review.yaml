id: P35354
gene_symbol: PTGS2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'PTGS2 encodes inducible cyclooxygenase-2, a heme-dependent homodimeric prostaglandin G/H
  synthase on the lumenal face of the endoplasmic reticulum and nuclear envelope. It catalyzes conversion
  of arachidonate to prostaglandin H2 during inflammatory and stress responses and can oxygenate alternative
  polyunsaturated fatty-acid substrates, especially after aspirin acetylation.'
