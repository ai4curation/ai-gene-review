  review:
    summary: Golgi membrane is a well-supported principal FURIN location.
    action: ACCEPT
    reason: Human FURIN is a single-pass membrane proprotein convertase that
      resides in and cycles through the trans-Golgi network and Golgi membrane.
      PAINT has no loss on the FURIN lineage, and the experimental and pathway
      rows all agree with the established TGN/Golgi pool; broad Reactome parent
      events are retained as indirect evidence of the same location rather than
      read as independent compartment assays.
