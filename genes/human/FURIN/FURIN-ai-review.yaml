- term:
    id: GO:0001825
    label: blastocyst formation
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P23188
  - ensembl:ENSMUSP00000113370
  review:
    summary: Blastocyst formation is a broad developmental phenotype propagated
      from mouse Furin.
    action: MARK_AS_OVER_ANNOTATED
    reason: The IEA row transfers a mouse Furin developmental association. Human
      FURIN's direct function is broad proprotein convertase activity, and this
      organism-level developmental process is too remote to retain as a human
      FURIN process annotation.
    supported_by:
    - reference_id: file:human/FURIN/FURIN-uniprot.txt
      record_section:
      - CC:FUNCTION
      supporting_text: Ubiquitous endoprotease within constitutive secretory
        pathways capable of cleavage at the RX(K/R)R consensus motif
- term:
    id: GO:0002020
    label: protease binding
  evidence_type: IPI
  original_reference_id: PMID:14744861
  qualifier: enables
  supporting_entities:
  - UniProtKB:O75173
  review:
    summary: ADAMTS4 protease binding is true but subordinate to zymogen activation.
    action: KEEP_AS_NON_CORE
    reason: PMID:14744861 shows that FURIN participates in removing the prodomain of the protease
      ADAMTS4. Protease binding is therefore a defensible substrate-interaction claim, but the
      informative process is ADAMTS4 zymogen activation and the core molecular activity is FURIN's
      paired-basic endopeptidase activity.
    supported_by:
    - reference_id: PMID:14744861
      supporting_text: we demonstrate that furin plays an important role in the
        intracellular removal of ADAMTS4 prodomain.
    - reference_id: file:human/FURIN/FURIN-uniprot.txt
      record_section:
      - CC:CATALYTIC ACTIVITY
      supporting_text: Reaction=Release of mature proteins from their
        proproteins by cleavage of -Arg-Xaa-Yaa-Arg-|-Zaa- bonds
- term:
    id: GO:0002862
    label: negative regulation of inflammatory response to antigenic stimulus
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-9662834
  qualifier: involved_in
  review:
    summary: negative regulation of inflammatory response to antigenic stimulus
      is indirect relative to FURIN's cleavage step.
