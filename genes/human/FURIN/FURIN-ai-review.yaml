      supporting_text: In the Golgi apparatus, TGF-beta-1 (TGFB1) is activated
        by furin protease cleavage of the N-terminal pro-peptide portion. This
        leads to the formation of the N-terminal disulphide-linked dimeric
        pro-peptides, also known as latency-associated proteins (LAPs) and the
        C-terminal mature disulphide-linked dimeric TGF-beta-1 (Dubois et al.
        1995, Dubois et al. 2001, Leitlein et al. 2001). However, the N- and
        C-terminal polypeptides do not physically separate. Rather they stay in
        one complex. In addition, the LAP forms disulphide links with separate
        secreted proteins, the Latent TGF-beta binding proteins (LTBPs).
        LTBPs-linked to LAP and the non-covalently linked mature TGF-beta-1
        remain together and form the large latent complex (LLC) (Annes et al.
        2003).
