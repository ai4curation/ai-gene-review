id: P09958
gene_symbol: FURIN
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'FURIN encodes furin, a calcium-dependent type-I membrane proprotein
  convertase of the subtilisin/kexin family. It is synthesized as a zymogen, autocatalytically
  removes an N-terminal inhibitory propeptide during transit from the endoplasmic
  reticulum to acidic trans-Golgi network/endosomal compartments, and then cycles
  between the trans-Golgi network, endosomes, and the cell surface. Mature furin cleaves
  precursor proteins after paired-basic RX(K/R)R motifs, activating or maturing many
  secretory-pathway substrates including growth factors, receptors, proteases, peptide
  precursors, bacterial toxins, and viral envelope glycoproteins such as HIV-1 Env
  and SARS-CoV-2 spike.'
existing_annotations:
