    supported_by:
    - reference_id: Reactome:R-HSA-9699007
      supporting_text: 'In a SARS-CoV-2 infection the cellular protease furin cleaves
        the spike protein at the S1/S2 site and that cleavage is essential for S-protein-mediated
        cell-cell fusion and entry into human lung cells. The furin cleavage site
        promotes increased spike cleavage that has implications for pathogenesis (Hoffman
        et al. 2020; Johnson et al, 2021). Furin is associated with the plasma membrane
        of the host cell and mediates the hydrolytic cleavage of SARS-CoV-2 Spike
        (S) protein component of the viral membrane-associate S3:M:E:encapsidated
        SARS coronavirus genomic RNA: 7a:O-glycosyl 3a tetramer complex associated
        with ACE2. Spike cleavage by furin is affected by O-glycosylations around
        the cleavage site at position 685-686. In particular the P681 mutation, which
        occurs in the SARS-CoV-2 alpha and delta variants, results in decreased O-glycosylation,
        increased furin cleavage, and increased syncytia formation which may contribute
        to increased viral infectivity (Zhang et al, 2021a).<br><br><br>Neuropilin-1
        (NRP1) is a receptor expressed in a broad range of cells from human organ
        systems including respiratory, urinary, digestive, reproductive, and immune
        systems. Specific cell lines from these organs are susceptible to SARS-CoV-2
        infection. From these A549 (lung) and HRC45 (kidney) cells had a robust SARS‐CoV‐2
        pseudovirus infection but weak levels of ACE2, and both expressed strong levels
        of NRP1 (Zhang et al, 2021b). High levels of NRP1 were detected in the epithelial
        surface layer of the human respiratory and olfactory epithelium, with ACE2
        hardly detectable in these tissues. Artificial additional NRP1 expression
        in Caco-2 and HEK-293T cells increased SARS-CoV-2 infection markedly (Cantuti-Castelvetri
        et al, 2020; Zhu et al, 2021). The furin-cleaved SARS-CoV-2 spike glycoprotein
        fragment S1 binds NRP1, and selective NRP1 inhibitors reduced SARS-CoV-2 entry
        and infectivity in Caco-2 cell culture (Daly et al, 2020). Taken together,
        NRP1 appears to be the entry factor on NRP1-rich cells, and a weak entry factor
        on cells where ACE2 is present.<br><br><br>Several cell lines also have relatively
        higher levels of Hepatitis A virus cellular receptor 1 (kidney injury molecule-1,
        HAVCR1, KIM1, TIM1), a membrane protein upregulated upon kidney injury. Recombinant
        HAVCR1 blocked infection of both SARS‐CoV‐2 and SARS‐CoV pseudoviruses in
        a dose‐dependent fashion in one‐way ANOVA analysis albeit no significant difference
        was detected when the treated groups were compared with the untreated infected
        group (Zhang et al, 2021b). HAVCR1 binds to SARS-CoV-2 spike glycoprotein.
        Uptake of spike virosomes by lung and kidney epithelial cells that naturally
        express HAVCR1 was inhibited by anti-HAVCR1 antibodies and a HAVCR1 inhibitor
        (Mori et al, 2022; Yang et al, 2021).<br><br>Heparin effectively inhibits
        SARS-CoV-2 spike (S) cleavage into S1, S2 by furin. Unfractionated heparin
        (UFH) exhibits a higher furin inhibitory potency than the low-molecular-weight
        heparin (LMWH) (Paiardi et al, 2021).<br>'
