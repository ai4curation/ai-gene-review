- term:
    id: GO:0004252
    label: serine-type endopeptidase activity
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-9919050
  qualifier: enables
  review:
    summary: Serine-type endopeptidase activity is FURIN's core molecular
      function.
    action: ACCEPT
    reason: FURIN is a calcium-dependent subtilisin/kexin-family serine
      endopeptidase that cleaves paired-basic RX(K/R)R motifs in protein
      precursors. The PAINT IBD to GO:0004252 has no loss on the FURIN lineage,
      and the direct, Reactome and InterPro rows all point to this same
      catalytic activity.
    supported_by:
    - reference_id: Reactome:R-HSA-9919050
      supporting_text: Shortly before the virion exits the cell, at the low pH
        conditions of the late secretory pathway, the trimers of Dengue virus
        prM:E heterodimers change their conformation such that the host's furin
        (FURIN) protease is able to cleave them, releasing the pr peptide. This
        reaction is essential for the activation/maturation of the virion
        (Stadler et al., 1997, using tick-borne encephalitis virus, TBEV; Zheng
        et al., 2014, using DENV-1). Virion maturation exposes a lipid pocket on
        E proteins, enabling it to bind (more) phosphatidylethanolamine (PE),
        and possibly improving the stabilization of the virion (Renner et al.,
        2021).<br><br>Luteolin is a flavonoid, occuring in a wide spectrum of
        plants. It inhibits furin protease activity in vitro and reduces DENV-2
        (EDEN2 strain) viremia in mice (Peng et al., 2017). From this result we
        infer that furin cleavage occurs in DENV-2.<br><br>Niclosamide is an
        approved anthelminthic and causes endosomal deacidification, suppressing
        virion membrane fusion on entry and virion maturation on release (Kao et
        al., 2018).
    - reference_id: file:human/FURIN/FURIN-uniprot.txt
      record_section:
      - CC:CATALYTIC ACTIVITY
      supporting_text: Reaction=Release of mature proteins from their
        proproteins by cleavage of -Arg-Xaa-Yaa-Arg-|-Zaa- bonds
