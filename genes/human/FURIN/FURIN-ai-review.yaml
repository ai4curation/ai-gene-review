        (EDEN2 strain) viremia in mice (Peng et al., 2017). From this result we
        infer that furin cleavage occurs in DENV-2.<br><br>Niclosamide is an
        approved anthelminthic and causes endosomal deacidification, suppressing
        virion membrane fusion on entry and virion maturation on release (Kao et
        al., 2018).
