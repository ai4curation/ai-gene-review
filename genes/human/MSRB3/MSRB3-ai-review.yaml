gene_symbol: MSRB3
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  MSRB3 encodes a Cys-containing, zinc-stabilized methionine-R-sulfoxide
  reductase that repairs oxidized peptide methionine (R)-S-oxide residues.
  Alternative N termini direct the human MSRB3 protein either to the endoplasmic
  reticulum, where the C-terminal KAEL retention motif is used, or to
  mitochondria. Loss-of-function MSRB3 variants cause autosomal-recessive
  nonsyndromic deafness, including a mitochondrial-isoform nonsense allele and a
  zinc-ligand Cys89Gly allele that abolishes zinc binding and enzyme activity.
