core_functions:
- description: >-
    Reduces oxidized peptide methionine (R)-S-oxide residues in ER and
    mitochondrial proteins back to methionine through its Cys-dependent,
    zinc-stabilized MsrB active site.
  molecular_function:
    id: GO:0033743
    label: peptide-methionine (R)-S-oxide reductase activity
  directly_involved_in:
  - id: GO:0030091
    label: protein repair
  locations:
  - id: GO:0005783
    label: endoplasmic reticulum
  - id: GO:0005739
    label: mitochondrion
suggested_questions:
- question: Which ER and mitochondrial proteins are the physiologic substrates
    of each MSRB3 isoform in hearing-relevant inner-ear cells?
- question: Does DFNB74 arise primarily from loss of the mitochondrial MSRB3B
    isoform, from loss of ER MSRB3A, or from tissue-specific use of both isoforms?
suggested_experiments:
- description: >-
    Perform isoform-specific MSRB3 rescue in MSRB3-null inner-ear organoids or
    cochlear hair-cell models with wild-type, catalytic-Cys and Zn-binding Cys89
    alleles.
- description: >-
    Compare ER and mitochondrial Met-R-SO proteomes after MSRB3A- or
    MSRB3B-selective depletion to identify compartment-specific repair targets.
