id: P00734
gene_symbol: F2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Prothrombin is the circulating zymogen of alpha-thrombin, a vitamin
  K-dependent serine protease made in the liver and secreted into plasma. The zymogen
  carries an N-terminal Gla domain whose gamma-carboxyglutamate residues bind calcium and
  tether the protein to negatively charged phospholipid surfaces, two kringle domains,
  and a chymotrypsin-like protease domain. Activation by the prothrombinase complex
  releases alpha-thrombin, which cleaves after Arg and Lys residues to convert fibrinogen
  to fibrin, activates factors V, VII, VIII, XI and XIII, and, when bound to
  thrombomodulin, switches to an anticoagulant mode by activating protein C. Thrombin
  also signals to cells by cleaving protease-activated receptors on the cell surface,
  which exposes a tethered ligand and triggers platelet activation and calcium signalling,
  and C-terminal fragments released by proteolysis of thrombin act as antimicrobial host
  defence peptides. The protein is extracellular throughout its functional life; its
  interactions with cells occur at the external face of the plasma membrane.
