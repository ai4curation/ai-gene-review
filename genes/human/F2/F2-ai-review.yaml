- term:
    id: GO:0001530
    label: lipopolysaccharide binding
  evidence_type: IDA
  original_reference_id: PMID:20421939
  qualifier: enables
  review:
    action: KEEP_AS_NON_CORE
    summary: Thrombin-derived C-terminal peptides bind and neutralise bacterial
      lipopolysaccharide.
    reason: The binding is a property of proteolytic fragments of thrombin acting as host
      defence peptides, not of the coagulation protease itself, so the claim is real but
      peripheral to the core function.
    supported_by:
    - reference_id: PMID:20421939
      supporting_text: Here we show that C-terminal peptides of thrombin, a key enzyme in
        the coagulation cascade, constitute a novel class of host defense peptides,
        released upon proteolysis of thrombin in vitro, and detected in human wounds in
        vivo.
