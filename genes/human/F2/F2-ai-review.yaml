core_functions:
- description: Vitamin K-dependent serine protease of plasma. After activation by the
    prothrombinase complex, alpha-thrombin cleaves fibrinogen to fibrin and activates
    factors V, VIII, XI and XIII, driving clot formation; calcium bound by the Gla domain
    positions the zymogen on anionic phospholipid surfaces where activation occurs.
  molecular_function:
    id: GO:0004252
    label: serine-type endopeptidase activity
  locations:
  - id: GO:0005576
    label: extracellular region
  directly_involved_in:
  - id: GO:0007596
    label: blood coagulation
  - id: GO:0030194
    label: positive regulation of blood coagulation
  - id: GO:0006508
    label: proteolysis
  supported_by:
  - reference_id: file:human/F2/F2-uniprot.txt
    supporting_text: Thrombin, which cleaves bonds after Arg and Lys, converts fibrinogen
      to fibrin and activates factors V, VII, VIII, XIII, and, in complex with
      thrombomodulin, protein C.
  - reference_id: PMID:10761923
    supporting_text: The serine proteinase alpha-thrombin causes blood clotting through
      proteolytic cleavage of fibrinogen and protease-activated receptors and amplifies
      its own generation by activating the essential clotting factors V and VIII.
- description: Agonist of protease-activated receptors at the cell surface. Thrombin
    cleaves the extracellular N-terminus of PAR-family receptors, exposing a tethered
    ligand that activates the receptor and triggers platelet activation and calcium
    signalling in platelets, endothelium and other cells.
  molecular_function:
    id: GO:0005102
    label: signaling receptor binding
  locations:
  - id: GO:0009897
    label: external side of plasma membrane
  directly_involved_in:
  - id: GO:0070493
    label: thrombin-activated receptor signaling pathway
  - id: GO:0030168
    label: platelet activation
  supported_by:
  - reference_id: PMID:1672265
    supporting_text: A peptide mimicking the new amino terminus created by cleavage at R41
      was a potent agonist for both thrombin receptor activation and platelet activation.
  - reference_id: PMID:12855810
    supporting_text: defined two sites in GpIbalpha that bind to exosite II and exosite I
      of two distinct alpha-thrombin molecules
- description: Anticoagulant protease when bound to thrombomodulin. Cofactor binding
    redirects substrate specificity so that thrombin activates protein C, which degrades
    factors Va and VIIIa, and activates the thrombin-activatable fibrinolysis inhibitor,
    suppressing clot lysis.
  molecular_function:
    id: GO:0004252
    label: serine-type endopeptidase activity
  locations:
  - id: GO:0009897
    label: external side of plasma membrane
  directly_involved_in:
  - id: GO:0030195
    label: negative regulation of blood coagulation
  - id: GO:0051918
    label: negative regulation of fibrinolysis
  supported_by:
  - reference_id: PMID:10761923
    supporting_text: Thrombomodulin, a transmembrane thrombin receptor with six contiguous
      epidermal growth factor-like domains (TME1-6), profoundly alters the substrate
      specificity of thrombin from pro- to anticoagulant by activating protein C.
  - reference_id: PMID:10761923
    supporting_text: The thrombin-thrombomodulin complex inhibits fibrinolysis by
      activating the procarboxypeptidase thrombin-acti
suggested_questions:
- question: How much of thrombin's non-haemostatic biology, in inflammation, wound repair
    and the nervous system, is mediated by protease-activated receptors as opposed to
    other substrates?
- question: Are the antimicrobial C-terminal thrombin peptides generated at physiologically
    relevant concentrations in vivo, and by which proteases?
- question: Does thrombin bound to platelet GPIb-alpha have a distinct substrate profile
    from free thrombin, as thrombomodulin binding does?
suggested_experiments:
- hypothesis: GPIb-alpha binding, like thrombomodulin binding, alters thrombin substrate
    specificity rather than simply localising the enzyme.
  description: Measure cleavage kinetics of fibrinogen, PAR1 peptide and protein C by
    thrombin free and bound to recombinant GPIb-alpha fragments covering each exosite.
- hypothesis: The antimicrobial activity of thrombin-derived peptides contributes to wound
    defence in vivo.
  description: Quantify the C-terminal peptides in human wound fluid over time by targeted
    mass spectrometry and correlate with bacterial load, then test neutralisation with
    peptide-specific antibodies in an animal wound infection model.
- hypothesis: Thrombin annotations attributed to cell-surface receptor activity reflect
    its action on receptors rather than any membrane residence.
  description: Use surface biotinylation and acid washes on thrombin-stimulated platelets
    and endothelial cells to distinguish bound extracellular thrombin from any
    membrane-integrated pool, alongside PAR1 cleavage reporters.
