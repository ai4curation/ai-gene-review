core_functions:
- description: Collagen-XVIII chains contribute structural integrity and organization to basement
    membranes as homotrimers. Human isolated-domain experiments demonstrate a trimerization module,
    while mouse knockout and tissue studies connect the intact matrix protein to basement-membrane
    architecture and vitreoretinal anchoring. The tensile-strength assignment follows the established
    GO convention for extracellular-matrix collagens, including nonfibrillar collagens; it does not
    claim an isolated human whole-precursor force measurement. Proteolytically released NC1/endostatin
    preparations have distinct contextual effects and are not assumed to retain this entire structural
    role.
  molecular_function:
    id: GO:0030020
    label: extracellular matrix structural constituent conferring tensile strength
  directly_involved_in:
  - id: GO:0030198
    label: extracellular matrix organization
  locations:
  - id: GO:0005604
    label: basement membrane
  in_complex:
    id: GO:0030938
    label: collagen type XVIII trimer
  supported_by:
  - reference_id: PMID:19631658
  - reference_id: PMID:11927538
  - reference_id: PMID:15254016
  - reference_id: PMID:14614989
suggested_questions:
- question: Which endogenous human precursor and cleavage products account for context-dependent
    endothelial responses, and how do oligomerization, glycosylation and amino-terminal processing
    affect them?
- question: Does the historical skeletal-development PAINT node include evidence for a COL18A1-performed
    skeletal step, distinct from the positive collagen-XXVII descendant experiments?
- question: Can the original vesicle proteomics target tables and peptides resolve COL18A1 association
    with exosomes and distinguish precursor-derived from endostatin-derived material?
suggested_experiments:
- description: Compare authenticated human precursor isoforms, native circulating endostatin, matched
    recombinant monomers and defined NC1 oligomers in the same matrix-dependent endothelial migration
    and proliferation assays; verify product sequence, oligomerization, glycosylation and endotoxin
    controls.
- description: Measure basement-membrane organization and mechanics after isoform-selective COL18A1
    rescue, distinguishing extracellular structural restoration from changes in fragment abundance.
