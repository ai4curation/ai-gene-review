id: P39060
gene_symbol: COL18A1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'COL18A1 encodes the alpha-1 chain of collagen XVIII, a secreted, nonfibrillar basement-membrane
  heparan-sulfate proteoglycan that assembles into homotrimers. Its matrix role supports basement-membrane
  organization and tissue architecture, including the vitreoretinal interface. Alternative amino-terminal
  forms share the collagenous and carboxy-terminal regions. Proteolytic release of the carboxy-terminal
  NC1 region and endostatin produces forms with distinct extracellular effects: oligomeric NC1 can
  promote matrix-dependent endothelial motility and morphogenesis, whereas some endostatin preparations
  inhibit endothelial proliferation or angiogenesis. These effects depend on oligomerization, preparation
  and biological context; they are not interchangeable properties of every intact precursor or circulating
  fragment. Biallelic loss-of-function variants cause Knobloch syndrome, with severe ocular abnormalities
  and variable occipital defects.'
alternative_products:
- name: 1 (NC1-728)
  id: P39060-3
  description: Official human 1754-residue precursor; identity and sequence were independently reconstructed
    from the UniProt alternative-sequence features and matched the isoform FASTA. The three recorded
    precursors share the same 183-residue carboxy-terminal endostatin sequence. Their different amino-terminal
    regions and historical NC1-728/NC-493/NC1-303 names must not be confused with the experimentally
    excised carboxy-terminal NC1 domain. The literature does not establish equivalent activity of
    every recorded precursor; processed monomers and engineered oligomers are described separately.
