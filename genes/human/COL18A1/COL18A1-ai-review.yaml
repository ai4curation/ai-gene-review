  - statement: A human Knobloch pedigree carried a COL18A1 splice-site defect affecting the short
      transcript, with ocular abnormalities and occipital encephalocele. The abstract links this
      to retinal structure and neural-tube closure without resolving a specific skeletal mechanism.
  reference_review:
