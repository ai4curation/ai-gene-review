    label: late endosome membrane
  - id: GO:0005765
    label: lysosomal membrane
- description: >-
    Contributes, as a subunit of the AP-5-SPG11-SPG15 assembly, to a sorting step that leaves
    the late endosome and returns membrane proteins to the Golgi. Depleting mu-5 alone
    redistributes the cation-independent mannose 6-phosphate receptor and the retromer subunit
    Vps26 into enlarged perinuclear puncta and swells multivesicular bodies; knocking out the
    zeta subunit, which also destroys mu-5, shows by fractionation profiling and mass spectrometry
    that the receptor and the Golgi proteins GOLIM4 and GOLM1 fail to return to the Golgi. The
    only molecular activity yet demonstrated for the assembly is membrane deformation: the
    reconstituted complex binds phosphatidylinositol 3-phosphate, senses curvature and remodels
    membranes in vitro. That activity is recorded here as a contribution rather than as an
    annotation on the gene, because the experiment is in vitro, is performed on the whole hexamer,
    does not resolve which subunits deform the bilayer, and the mu-5 and zeta chains in the
    deposited models are the mouse orthologues.
  supported_by:
