- id: PMID:27136675
  title: Characterization of MUDENG, a novel anti-apoptotic protein.
  reference_review:
    relevance: MEDIUM
    correctness: DISPUTED
    review_notes: >-
      Full text cached. Reports the opposite sign to PMID:18395520 and PMID:31427081, with MuD
