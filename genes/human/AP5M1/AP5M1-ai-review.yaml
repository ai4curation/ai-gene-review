proposed_new_terms:
- proposed_name: autophagic lysosome reformation
  proposed_definition: >-
    The process by which lysosomes are regenerated from autolysosomes after autophagic
    degradation, comprising the extrusion of tubules from the autolysosomal membrane, their
    extension, and scission to release proto-lysosomes that mature into functional lysosomes.
  justification: >-
    GO has no term for this process. The QuickGO ontology search returns no hits for the word
    reformation; the children of GO:0007040 lysosome organization are three regulation terms plus
    GO:0001845 phagolysosome assembly and GO:0097212 lysosomal membrane organization; and the
    nearest existing terms, GO:0170064 lysosome fission and GO:0097749 membrane tubulation, whose
    only compartment-specific children are GO:0097750 for endosome membranes and terms for the
    plasma membrane, each capture one aspect and neither names the process. The result is that
    the best-characterised cellular defect of the whole AP-5, SPG11 and SPG15 axis has to be
    annotated to the generic parent GO:0007040, which is how it currently reaches AP5M1. The gap
    affects at least SPG11, ZFYVE26, AP5Z1, AP5B1, AP5S1 and AP5M1, plus the PI4K2A and mTOR
    machinery that acts in the same pathway.
  proposed_parent:
    id: GO:0007040
    label: lysosome organization
  supported_by:
  - reference_id: PMID:40175557
    supporting_text: essential for the initiation of autolysosome tubulation
  - reference_id: PMID:26085577
    supporting_text: AP-5 deficiency represents a new type of LSDs
knowledge_gaps:
- gap_statement: >-
    No molecular function has been established for mu-5 itself. It has the mu-homology domain
    fold but not the tyrosine-signal binding site, and no sorting motif of any kind has been
    identified for AP-5, so it is not known whether mu-5 recognises cargo at all, and if it does,
    what it recognises.
  boundary: >-
    Firmly established: mu-5 carries an MHD over residues 206 to 476 by UniProt, PROSITE PS51072,
    CDD cd09256 and Pfam PF00928; it binds beta-5 through its N-terminal domain in the canonical
    mu-beta arrangement; and it is an obligate member of AP-5. Equally firmly established, and
    measured for this review: of the fourteen mu-2 residues that contact the TGN38 DYQRLN peptide
    in PDB 1BXX, AP5M1 retains three, and the three closest contacts to the signal tyrosine, mu2
    F174, D176 and W421, are serine, serine and alanine in mu-5, while AP4M1 and AP1M1 retain all
    three. So the fold is present and the tyrosine site is not.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: >-
    AP-5 is the only AP complex with no known sorting signal. Whether it recognises a different
    motif, recognises a lipid or conformational feature instead, or has abandoned cargo
    recognition entirely and become a purely structural member of a coat, determines what kind
    of machine the AP-5-SPG11-SPG15 assembly is, and it decides whether any cargo-binding
    molecular function should ever be annotated to this gene. It is also the reason this review
    annotates mu-5 as a structural subunit rather than as an adaptor.
  resolution: >-
    An unbiased search for the motif, for example peptide or proteomic-peptide phage display
    against the recombinant mu-5 MHD, or crosslinking mass spectrometry of the assembled hexamer
    on membranes bearing candidate cargo. A negative result would be informative in itself and
    should be recorded, since the alternative hypothesis, that mu-5 is structural, is testable
    by asking whether an MHD-deleted mu-5 still supports complex assembly and CIMPR retrieval.
  provenance:
  - reference_id: PMID:29381698
    supporting_text: the highly conserved cargo binding sites found in the other AP complexes
      are absent in AP-5.
  - reference_id: PMID:22022230
    supporting_text: are altered in C14orf108, suggesting that if C14orf108 is involved in cargo
      recognition, it probably interacts with a different type of motif.
  - reference_id: file:human/AP5M1/AP5M1-bioinformatics/RESULTS.md
    supporting_text: AP5M1 retains **3 of 14** (K240, I461, R465). The comparators retain 11/14
- gap_statement: >-
    It is not known which subunits of the AP-5-SPG11-SPG15 assembly carry out the membrane
    deformation the complex performs in vitro, so mu-5's contribution to the one demonstrated
    molecular activity of the assembly cannot be stated more precisely than complex membership.
  boundary: >-
    Established: the reconstituted assembly binds phosphatidylinositol 3-phosphate, senses
    membrane curvature and remodels membranes in vitro, and is needed to initiate autolysosome
    tubulation; spastizin supplies a FYVE domain that binds PI3P and was proposed to dock the
    coat, and spatacsin was proposed to scaffold it. Not established: whether AP-5 itself, or
    mu-5 in particular, contributes anything to bilayer deformation beyond being part of the
    assembled particle.
  gap_kind:
  - BIOLOGY
  - CURATION
  dark_aspect: RESIDUAL_SUBGAP
  status: NARROWING
  significance: >-
    This is the only molecular activity ever demonstrated for anything containing mu-5, so
    resolving it would give the gene its first real molecular function rather than a structural
    placeholder. Until it is resolved, contributes_to is the strongest defensible statement, and
    the added caution is that the mu-5 and zeta chains in the deposited cryo-EM models are the
    mouse orthologues rather than the human proteins.
  resolution: >-
    Subunit dropout or truncation in the in vitro membrane-remodelling assay, reconstituting
    SPG11-SPG15 without AP-5 and AP-5 without mu-5, would attribute the activity. Reporting the
    assay on the human complex would remove the species caveat.
  provenance:
  - reference_id: PMID:40175557
    supporting_text: AP5-SPG11-SPG15 complex can bind PI3P molecules, sense membrane curvature
      and drive membrane remodeling in vitro
  - reference_id: PMID:23825025
    supporting_text: We propose that AP-5, SPG15, and SPG11 form a coat-like complex, with AP-5
      involved in protein sorting
- gap_statement: >-
    Whether the cell-death phenotypes reported for this protein under the name MUDENG reflect
    anything it does at physiological levels is unresolved, and the published effects point in
    opposite directions.
  boundary: >-
    Established: ectopic overexpression kills Jurkat, HeLa and cervical carcinoma cells, and the
    cervical carcinoma effect requires BAX; depletion in astroglioma and glioblastoma cells
    sensitises them to TRAIL, placing the protein downstream of Bid; and the protein is cleaved
    by caspase-3 at D276 and D290, both of which are aspartates inside the annotated MHD. Not
    established: any mechanism connecting these observations to AP-5, to membrane traffic or to
    the endolysosomal system, or any phenotype at endogenous expression levels that is not a
    sensitisation assay.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    Two literatures describe this protein and cite each other barely at all. If the death
    phenotype is a consequence of disrupted endolysosomal homeostasis, which is plausible given
    that AP-5 loss produces a lysosomal storage phenotype, then it is downstream of the
    trafficking function and should not be annotated as a separate process. If it is a genuinely
    separate activity it would be the second function of the protein. GOA currently carries no
    apoptosis term for this gene, and this review proposes none.
  resolution: >-
    Test the death phenotype in cells carrying the AP-5-null alleles that are now available from
    the macular dystrophy families, and ask whether it requires assembly into AP-5 by testing a
    mu-5 variant that cannot bind beta-5. Measuring lysosomal function in the MUDENG depletion
    and overexpression systems would test the downstream hypothesis directly.
  provenance:
  - reference_id: PMID:18395520
    supporting_text: Ectopic expression of MUDENG induced cell death in Jurkat T cells and HeLa
      cells
  - reference_id: PMID:27136675
    supporting_text: MuD localizes predominantly in the ER and partly in mitochondria, then is
      decreased upon TRAIL stimulation
  - reference_id: PMID:41915273
    supporting_text: TurboID-based proximity labeling revealed reproducible interactions with
      AP5B1 and AP5M1 subunits
  - reference_id: PMID:31427081
    supporting_text: AP5M1 completely lost its apoptotic activity in BAX-knockout or -knockdown
      cells, indicative of its functional dependence on BAX.
  - reference_id: PMID:23665015
    supporting_text: Caspase cleavage sites (D276 and D290) were located in the adaptin domain
      of MUDENG, and cleaved MUDENG showed the reduced killing activity
- gap_statement: >-
    GO cannot express the process that AP-5, SPG11 and SPG15 are best characterised for,
    regenerating lysosomes from autolysosomes by tubulation and scission, so the most specific
    thing known about this gene's biology is annotated to a generic parent.
  boundary: >-
    Established: the assembly is required to initiate autolysosome tubulation, and its loss
    produces a lysosomal storage phenotype. Established about the ontology: no GO term names this
    process; the closest are GO:0170064 lysosome fission and GO:0097749 membrane tubulation,
    neither of which is specific to the autolysosome or to lysosome regeneration.
  gap_kind:
  - ONTOLOGY
  - CURATION
  dark_aspect: BP_DARK
  status: OPEN
  significance: >-
    At least six genes in this axis, plus the lipid kinase and mTOR machinery acting with them,
    currently collapse onto GO:0007040 lysosome organization, which hides both the shared pathway
    and the specific defect that unites these hereditary spastic paraplegia and macular dystrophy
    genes.
  resolution: >-
    Create the term proposed in proposed_new_terms, as a child of GO:0007040, and re-annotate
    the AP-5, SPG11 and SPG15 gene products to it.
  provenance:
  - reference_id: PMID:40175557
    supporting_text: essential for the initiation of autolysosome tubulation
suggested_questions:
- question: >-
    For the PAINT curators of PTHR16082: all five IBDs on PTN002699615 are seeded by human AP5M1
    alone, and one of them asserts the parent term GO:0030119 rather than GO:0044599 AP-5 adaptor
    complex, which is a child of it and is what this family is the mu subunit family of. Was the
    parent chosen deliberately in 2019, or would the node take the child now?
- question: >-
    For the AP-5 groups: does the mu-5 MHD bind any peptide motif at all? The tyrosine subsite
    is gone, but three of the fourteen mu-2 contact positions survive, so the open question is
    whether the remaining face binds a different class of signal or has been repurposed for a
    protein-protein contact inside the coat.
- question: >-
    Is mu-5 required for AP-5 function, or only for AP-5 assembly? Every phenotype attributed to
    mu-5 is also produced by losing another subunit, because the subunits destabilise one another,
    so no published experiment separates a structural requirement from a functional one.
- question: >-
    Why does complete loss of AP5M1 cause an isolated macular dystrophy while complete loss of
    AP5Z1 causes spastic paraplegia, when the two are subunits of the same obligate complex and
    each destabilises the other?
- question: >-
    Does the pathogenic AP5M1 p.Tyr313Cys allele disrupt the complex or the fold? Tyr313 sits
    inside the MHD and is a tyrosine at the same alignment column in all five human mu subunits
    and in mouse and Arabidopsis mu-5, and the corresponding AP4M1 residue Tyr284 is mutated in
    spastic paraplegia type 50.
- question: >-
    Is the MUDENG cell-death phenotype a downstream consequence of impaired endolysosomal
    homeostasis rather than a separate activity? The two literatures on this protein cite each
    other almost not at all.
- question: >-
    Does isoform 2, which replaces residues 241 to 284 and deletes everything C-terminal of 284
    and so removes most of the MHD, make a protein, and if so does it assemble with beta-5?
suggested_experiments:
- hypothesis: >-
    Mu-5 has lost peptide-motif recognition entirely, rather than having switched to a different
    sorting signal.
  description: >-
    Proteomic peptide phage display, or a synthetic peptide array tiling the cytosolic tails of
    the candidate AP-5 cargo (CIMPR, sortilin, GOLIM4, GOLM1), against the recombinant mu-5 MHD,
    with the mu-2 MHD and a YxxPhi peptide as the positive control. A negative result should be
    published: it would be as informative as a positive one, and it is currently the untested
    half of the only mechanistic statement anyone makes about this subunit.
  experiment_type: peptide-binding screen
- hypothesis: >-
    Mu-5's contribution to AP-5 is structural, so an allele that cannot assemble and an allele
    that assembles but lacks the MHD should give different phenotypes.
  description: >-
    Build separation-of-function alleles from the cryo-EM model. Identify the mu-5 surface that
    contacts beta-5, make a mu-5 that cannot assemble, and ask whether it still supports CIMPR
    and GOLIM4 retrieval in AP5M1-null cells. Pair it with an MHD deletion that still assembles,
    to ask the converse. This is the experiment that would separate the structural from the
    functional requirement.
  experiment_type: structure-guided mutagenesis with rescue
- hypothesis: >-
    The AP5M1 p.Tyr313Cys missense allele is a hypomorph rather than a null.
  description: >-
    Knock the three AP5M1 macular dystrophy alleles, p.Arg33Ter, p.Trp389Ter and p.Tyr313Cys,
    into iPSC-derived retinal pigment epithelium and measure AP-5 subunit levels by western blot,
    CIMPR and GOLIM4 distribution by immunofluorescence, and autolysosome tubulation after
    starvation and refeeding. The two nonsense alleles give the null baseline against which the
    missense can be graded.
  experiment_type: isogenic iPSC-RPE allelic series
- hypothesis: >-
    Membrane deformation by the AP-5-SPG11-SPG15 assembly is contributed by SPG11 and SPG15, not
    by AP-5 or mu-5.
  description: >-
    Subunit dropout in the in vitro membrane-remodelling assay: compare SPG11-SPG15 alone, AP-5
    alone, the full assembly, and an assembly lacking mu-5, on giant unilamellar vesicles
    containing PI3P, scoring tubule formation and curvature preference. Use human subunits
    throughout, since the deposited structures use mouse mu-5 and zeta.
  experiment_type: reconstituted liposome tubulation assay
- hypothesis: >-
    The MUDENG cell-death phenotypes are downstream of disrupted endolysosomal homeostasis rather
    than a second activity of the protein.
  description: >-
    Repeat the TRAIL sensitisation and overexpression death assays in AP5M1-null cells derived
    from the macular dystrophy families and in cells expressing an assembly-incompetent mu-5, and
    in parallel measure lysosomal proteolytic capacity and autophagic flux in the same cells. If
    the death phenotype tracks with lysosomal failure and not with mu-5 protein per se, the two
    literatures describe one function.
  experiment_type: genetic epistasis with lysosomal function readout
