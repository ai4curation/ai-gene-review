- id: PMID:23665015
  title: MUDENG is cleaved by caspase-3 during TRAIL-induced cell death.
  full_text_unavailable: true
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Abstract-only. Reports caspase-3 cleavage at D276 and D290; both are aspartates inside the
      annotated MHD in Q9H0R1 sequence version 2, checked in AP5M1-bioinformatics. Being a caspase
