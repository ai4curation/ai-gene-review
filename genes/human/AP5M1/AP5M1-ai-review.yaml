    action: KEEP_AS_NON_CORE
    reason: >-
      The IBD is on the same well-resolved node as the other four, seeded by the target's own
      IDA, and there is nothing wrong with the propagation. A coat adaptor that cycles on and
      off membranes genuinely has a cytosolic phase, and that is conserved across the family.
