- description: >-
    Required for lysosomal homeostasis. When AP-5 is lost, endolysosomes fill with undigested
    material organised into multilamellar whorls, striated belts and fingerprint bodies, a
    phenotype seen both in patient fibroblasts and in cells depleted of AP-5 by siRNA and severe
    enough that the authors class AP-5 deficiency as a lysosomal storage disease. The assembly
    is also required to initiate the lysosomal tubulation that regenerates lysosomes from
    autolysosomes. In humans, bi-allelic loss-of-function alleles of AP5M1 itself cause a
    recessive macular dystrophy, in a tissue whose lysosomal and phagocytic load is exceptional,
    the retinal pigment epithelium, which is the strongest organismal evidence that mu-5 is not
    redundant.
