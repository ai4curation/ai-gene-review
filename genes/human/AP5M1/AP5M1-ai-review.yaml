    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Establishes the 1:1:1:1:1:1 hexamer and that knocking down any of the six components, mu-5
      included, traps the CIMPR in early endosomes. The cache is abstract-only, so only abstract
