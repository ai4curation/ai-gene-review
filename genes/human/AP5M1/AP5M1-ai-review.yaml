id: Q9H0R1
gene_symbol: AP5M1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  AP5M1 encodes mu-5 (also called MuD or MUDENG), the medium subunit of adaptor protein complex
  5 (AP-5), the fifth and most recently identified member of the heterotetrameric adaptor protein
  family. AP-5 is built from AP5Z1 (zeta), AP5B1 (beta-5), AP5M1 (mu-5) and AP5S1 (sigma-5), and
  in cells the tetramer is part of a larger assembly with spatacsin (SPG11) and spastizin
  (SPG15/ZFYVE26), which supply the membrane-docking and scaffolding functions of a coat. Like
  other AP mu subunits, mu-5 binds the beta subunit through its N-terminal domain and carries a
  C-terminal mu-homology domain, but the residues that in AP-1 and AP-2 form the binding site for
  YxxPhi sorting signals are not conserved in mu-5, no sorting motif has been identified for AP-5,
  and the complex neither associates with clathrin nor responds to brefeldin A. Mu-5 cycles
  between the cytosol and the cytoplasmic face of late endosomal and lysosomal membranes, and its
  abundance falls when other subunits of the complex are lost, indicating that it is an obligate
  member of an assembled complex rather than an independent protein. Loss of AP-5 impairs
  retrieval of the cation-independent mannose 6-phosphate receptor and of Golgi membrane proteins
  from endosomes back to the Golgi, and fills endolysosomes with undigested multilamellar storage
  material; the reconstituted AP-5-SPG11-SPG15 assembly binds phosphatidylinositol 3-phosphate,
  senses membrane curvature and deforms membranes in vitro, and the assembly is required for the
  initiation of autolysosome tubulation. Bi-allelic loss-of-function variants in AP5M1 cause a
  recessive macular dystrophy, and variants in the partner genes AP5Z1, SPG11 and SPG15 cause
  complicated hereditary spastic paraplegia. Under the name MUDENG the same protein has been
  reported to modulate apoptotic signalling in cultured tumour cells, but those effects are seen
  on over- or under-expression and their direction differs between cell types.
