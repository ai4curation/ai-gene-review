- id: PMID:31427081
  title: BAX is an essential key mediator of AP5M1-induced apoptosis in cervical carcinoma cells.
  full_text_unavailable: true
  reference_review:
    relevance: LOW
    correctness: LOW_QUALITY
    review_notes: >-
      Abstract-only. Overexpression of AP5M1 is pro-apoptotic and BAX-dependent in cervical
      carcinoma lines. The same overexpression limitation as PMID:18395520, and the opposite sign
      to PMID:27136675 and PMID:41915273.
- id: PMID:41915273
  title: MUDENG, a component of adaptor complex 5, mediates TRAIL- and TMZ-triggered apoptosis
    in glioblastoma (GBM) via multiple pathways.
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
