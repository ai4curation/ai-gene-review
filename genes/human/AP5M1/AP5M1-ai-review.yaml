  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached. Provides the direct evidence that mu-5 is an obligate subunit, its protein
      level falling both in AP5Z1-nonsense patient fibroblasts and on spastizin knockdown, which
      the authors attribute to instability of unassembled AP subunits.
- id: PMID:29381698
  title: Role of the AP-5 adaptor protein complex in late endosome-to-Golgi retrieval.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached. Identifies the transport step AP-5 acts in. The perturbation is a CRISPR
      knockout of AP5Z1, not of AP5M1, which is why it is used here together with the mu-5-specific
      knockdowns rather than on its own. It also states plainly that the conserved AP cargo-binding
      sites are absent from AP-5.
- id: PMID:40175557
  title: Structural basis for membrane remodeling by the AP5-SPG11-SPG15 complex.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Cryo-EM of the AP5-SPG11-SPG15 assembly and the only source of a molecular activity for
      the complex. The cache is abstract-only. The depositions were checked directly via the RCSB
      REST API, and in both 8YAB and 8YAH the mu-5 and zeta entities map to the mouse orthologues
      Q8BJ63 and Q3U829 while beta-5, sigma-5 and spatacsin are human, so the reconstitution is
      mixed-species and no PDB entry maps to human Q9H0R1. That is why no gene-level GO annotation
      is proposed from it here.
- id: PMID:40081374
  title: Bi-allelic variants in three genes encoding distinct subunits of the vesicular AP-5
