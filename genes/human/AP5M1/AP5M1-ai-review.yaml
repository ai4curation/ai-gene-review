core_functions:
- description: >-
    Obligate medium subunit of the AP-5 adaptor complex. Mu-5 binds the beta-5 subunit through
    its N-terminal domain, in the same arrangement that joins mu to beta in AP-1 and AP-2, and
    the two proteins depend on one another for stability: knocking down beta-5 lowers mu-5
    protein, and mu-5 falls again in fibroblasts from patients whose AP5Z1 alleles abolish the
    zeta subunit, because unassembled AP subunits are degraded. Assembled AP-5 joins spatacsin
    and spastizin in a roughly equimolar hexamer that behaves as a coat-like complex on the
    cytoplasmic face of late endosomal and lysosomal membranes. Mu-5 carries a mu-homology domain,
    but the residues that form the YxxPhi signal-binding pocket in mu-2 are not conserved in it,
    and no sorting motif has been identified for AP-5, so no molecular function is asserted for
    mu-5 itself; what is established is complex membership and the mutual dependence that makes
    it obligate.
  supported_by:
