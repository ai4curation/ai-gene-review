description: ASPHD1 is a single-pass type II membrane protein whose C-terminal domain belongs to the aspartyl/asparaginyl
  beta-hydroxylase family of Fe(II)/2-oxoglutarate-dependent dioxygenases. It keeps most of the 2-oxoglutarate-binding
  residues of ASPH but has lost one of the two iron-binding histidines, suggesting it is not an active
  hydroxylase. Its function is unknown. In a placental trophoblast model, ASPHD1 is upregulated by invasive
  Escherichia coli strains, and its knockdown increases bacterial internalization.
