suggested_questions:
  - question: >-
      How does incorporation of ASGR2 into ASGR1/ASGR2 hetero-oligomers alter the
      spatial arrangement of C-type lectin carbohydrate-recognition domains and select
      for specific multi-antennary endogenous glycoprotein ligands in human
      hepatocytes?
    experts:
      - Martin Spiess
      - Paul H Weigel
  - question: >-
      What physiological signals or hepatocyte states regulate alternative splicing of
      the ASGR2 luminal juxtamembrane pentapeptide (exon 3, VSP_003061) that governs
      ER quality control retention versus plasma membrane export?
    experts:
      - Gerardo Z Lederkremer
      - Martin Spiess
suggested_experiments:
  - hypothesis: >-
      Hetero-oligomerization of ASGR2 with ASGR1 is required to mask an ER retention/ERAD
      degron in the juxtamembrane stalk region of ASGR2, enabling COPII-mediated ER
      export to the hepatocyte plasma membrane.
    description: >-
      Perform pulse-chase metabolic labeling, co-immunoprecipitation, and ER-to-Golgi
      transport assays across ASGR2 splice isoforms (P07307-1, P07307-2, P07307-3) in
      the presence and absence of ASGR1 in human hepatocyte lines.
    experiment_type: Pulse-chase metabolic labeling and endo H sensitivity trafficking assay
  - hypothesis: >-
      Dual S-palmitoylation of ASGR2 at Cys-54 and Cys-58 cooperates with Cys-36
      palmitoylation on ASGR1 to drive partitioning of heteromeric ASGR1/ASGR2
      complexes into clathrin-coated pits and pH-dependent uncoupling of ligands in
      sorting endosomes.
    description: >-
      Compare clathrin-coated pit recruitment, internalization kinetics, and endosomal
      ligand dissociation in cells co-expressing wild-type ASGR1 with wild-type versus
      C54S/C58S mutant ASGR2.
    experiment_type: Site-directed mutagenesis and quantitative endocytosis fluorescence microscopy
