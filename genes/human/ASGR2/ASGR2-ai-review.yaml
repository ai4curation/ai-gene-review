  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  Asialoglycoprotein receptor 2 (ASGR2, also known as hepatic lectin H2 or HL-2) is
  a 311-amino-acid single-pass type II transmembrane C-type lectin that serves as the
  minor subunit of the hepatic asialoglycoprotein receptor (Ashwell-Morell receptor)
  on the sinusoidal (basolateral) plasma membrane of hepatocytes. Sharing 58% sequence
  identity with the major subunit ASGR1 (H1), ASGR2 comprises an N-terminal
  cytoplasmic tail (residues 1-58) containing a phenylalanine-based internalization
  signal (FQDI, residues 5-8) and palmitoylated cysteine residues (Cys-54 and Cys-58),
  a transmembrane signal-anchor helix (residues 59-79), an extracellular coiled-coil
  stalk domain that mediates hetero-oligomerization with ASGR1, and a C-terminal
  extracellular C-type lectin carbohydrate-recognition domain (residues 176-302). Its
  carbohydrate-recognition domain carries a conserved QPD (Gln259-Pro260-Asp261) motif
  that recognizes terminal D-galactose and N-acetyl-D-galactosamine (GalNAc) units on
  desialylated plasma glycoproteins. Unlike ASGR1, which can assemble into functional
  homo-oligomers, ASGR2 requires co-expression and hetero-oligomerization with ASGR1
  for efficient export from the endoplasmic reticulum to the plasma membrane, where
  the ASGR1/ASGR2 complex mediates clathrin-dependent receptor-mediated endocytosis of
  desialylated glycoprotein cargo for lysosomal degradation. When expressed in the
  absence of ASGR1 (particularly splice isoform H2a retaining the luminal
  juxtamembrane pentapeptide), unassembled ASGR2 precursors accumulate in the
  juxtanuclear endoplasmic reticulum quality control compartment and undergo
  Sec61-associated endoplasmic reticulum-associated degradation (ERAD).
alternative_products:
  - name: '1'
    id: P07307-1
    description: >-
      Canonical 311-amino-acid isoform (H2a) containing both the 19-residue
      cytoplasmic mini-exon (residues 24-42) and the 5-residue luminal/extracellular
      juxtamembrane pentapeptide (residues 82-86); when unassembled with ASGR1,
      undergoes retention in the endoplasmic reticulum quality control compartment and
      ERAD.
  - name: '2'
    id: P07307-2
    sequence_note: VSP_003060
    description: >-
      Splice isoform lacking cytoplasmic residues 24-42 while retaining the
      extracellular juxtamembrane pentapeptide (residues 82-86).
  - name: '3'
    id: P07307-3
    sequence_note: VSP_003060, VSP_003061
    description: >-
      Splice isoform lacking both cytoplasmic residues 24-42 and the extracellular
      juxtamembrane pentapeptide (residues 82-86), which hetero-oligomerizes stably
      with ASGR1 at the hepatocyte plasma membrane.
