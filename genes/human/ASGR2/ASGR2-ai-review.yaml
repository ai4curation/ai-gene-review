      Minor subunit of the heteromeric hepatocyte cell-surface asialoglycoprotein
      receptor complex (with ASGR1) that recognizes terminal D-galactose and
      N-acetyl-D-galactosamine (GalNAc) units on desialylated plasma glycoproteins via
      its C-type lectin domain and mediates their clathrin-dependent receptor-mediated
      endocytosis for lysosomal degradation.
