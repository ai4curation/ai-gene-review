  - id: PMID:11408579
    title: A novel quality control compartment derived from the endoplasmic reticulum.
    findings:
      - statement: >-
          When expressed without ASGR1 in heterologous cells, the precursor of human
          ASGR2 isoform H2a accumulates in a juxtanuclear pre-Golgi endoplasmic
          reticulum quality control compartment prior to ubiquitin-proteasome ERAD.
        supporting_text: >-
          We found that substrates of this pathway, the precursor of human
          asialoglycoprotein receptor H2a and free heavy chains of murine class I
          major histocompatibility complex (MHC), accumulate in a novel preGolgi
          compartment that is adjacent to but not overlapping with the centrosome,
          the Golgi complex, and the ER-to-Golgi intermediate compartment (ERGIC).
        reference_section_type: ABSTRACT
      - statement: >-
          During endoplasmic reticulum-associated degradation, unassembled H2a
          associates with the ER translocon subunit Sec61.
        supporting_text: >-
          On its way to degradation, H2a associated increasingly after synthesis with
          the ER translocon Sec61.
        reference_section_type: ABSTRACT
  - id: PMID:11543633
    title: >-
      Cloning, mapping, and characterization of a human homologue of the yeast
      longevity assurance gene LAG1.
    full_text_unavailable: true
    findings:
      - statement: >-
          Yeast two-hybrid screening and GST pull-down assays identified interactions
          between LASS2 (CERS2) and membrane-associated receptors or transporters.
        supporting_text: >-
          Yeast two-hybrid screening and glutathione S-transferase pull-down assays
          showed that the LASS2 protein interacts with several membrane-associated
          receptors or transporters.
        reference_section_type: ABSTRACT
  - id: PMID:12171918
    title: >-
      Nonpalmitoylated human asialoglycoprotein receptors recycle constitutively but
      are defective in coated pit-mediated endocytosis, dissociation, and delivery of
      ligand to lysosomes.
    full_text_unavailable: true
    findings:
      - statement: >-
          The human hepatic asialoglycoprotein receptor contains subunits H1 (ASGR1)
          and H2 (ASGR2) and internalizes desialylated glycoproteins via the
          clathrin-coated pit pathway for lysosomal degradation.
        supporting_text: >-
          The hepatic asialoglycoprotein receptor (ASGP-R) internalizes desialylated
          glycoproteins via the clathrin-coated pit pathway and mediates their
          delivery to lysosomes for degradation. The human ASGP-R contains two
          subunits, H1 and H2.
        reference_section_type: ABSTRACT
      - statement: >-
          Palmitoylation of the asialoglycoprotein receptor subunits is required for
          efficient clathrin-dependent endocytosis, ligand dissociation, and delivery
          to lysosomes.
        supporting_text: >-
          We conclude that palmitoylation of the ASGP-R is required for its efficient
          endocytosis of ligand by the clathrin-dependent endocytic pathway and, in
          particular, for the proper dissociation and delivery of ligand to lysosomes.
        reference_section_type: ABSTRACT
  - id: PMID:21988832
    title: >-
      Toward an understanding of the protein interaction network of the human liver.
    findings:
      - statement: >-
          High-throughput yeast two-hybrid screen of human liver proteins mapping
          binary protein-protein interactions.
        supporting_text: >-
          In this study, we map the interactions of an unbiased selection of 5026 human
          liver expression proteins by yeast two-hybrid technology and establish a
          human liver protein interaction network (HLPN) composed of 3484 interactions
          among 2582 proteins.
        reference_section_type: ABSTRACT
  - id: PMID:29069408
    title: >-
      Asialoglycoprotein receptor 1 mediates productive uptake of N-acetylgalactosamine-conjugated
      and unconjugated phosphorothioate antisense oligonucleotides into liver
      hepatocytes.
    findings:
      - statement: >-
          Co-expression of ASGR1 incorporates ASGR2 into ASGR1/ASGR2 heterodimers that
          are exported from the ER and targeted to the hepatocyte plasma membrane.
        supporting_text: >-
          This data parallels previous reports demonstrating that co-expression of
          ASGR1 results in ASGR2 incorporation into ASGR1/ASGR2 heterodimers that are
          then exported from the ER and are ultimately targeted to the plasma membrane
        reference_section_type: RESULTS
  - id: PMID:3863106
    title: >-
