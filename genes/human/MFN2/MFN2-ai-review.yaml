- term:
    id: GO:0003924
    label: GTPase activity
  evidence_type: EXP
  original_reference_id: PMID:28114303
  qualifier: enables
  review:
    summary: GTPase activity. MFN2 is a dynamin-superfamily GTPase of the mitochondrial outer membrane
      that, with MFN1, tethers apposed mitochondria in trans and drives outer-membrane fusion in a GTP
      hydrolysis-dependent manner.
    action: ACCEPT
    reason: Core molecular function; G-domain catalytic-residue mutants of MFN2 (E230A, R259A) are non-functional
      for mitochondrial elongation, and the activity is conserved across the mitofusin family (IBA, InterPro/RHEA
      IEA).
    supported_by:
    - reference_id: PMID:28114303
      supporting_text: Both Mfn1E209A and Mfn1R238A, as well as the corresponding Mfn2 mutants Mfn2E230A
        and Mfn2R259A, failed to elongate mitochondria
    - reference_id: PMID:11181170
      supporting_text: Formation of mitochondrial filaments and networks required a wild-type Mfn2 GTPase
        domain, suggesting that the Mfn2 GTPase regulates or mediates mitochondrial fusion
    - reference_id: file:human/MFN2/MFN2-uniprot.txt
      supporting_text: Mitochondrial outer membrane GTPase that mediates mitochondrial clustering and
        fusion
