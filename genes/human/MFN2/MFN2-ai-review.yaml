core_functions:
- description: GTPase of the mitochondrial outer membrane that, with MFN1, tethers apposed mitochondria
    and drives outer-membrane fusion using GTP hydrolysis.
  molecular_function:
    id: GO:0003924
    label: GTPase activity
  directly_involved_in:
  - id: GO:0008053
    label: mitochondrial fusion
  - id: GO:1990626
    label: mitochondrial outer membrane fusion
  locations:
  - id: GO:0005741
    label: mitochondrial outer membrane
  supported_by:
  - reference_id: PMID:11181170
    supporting_text: Formation of mitochondrial filaments and networks required a wild-type Mfn2 GTPase
      domain, suggesting that the Mfn2 GTPase regulates or mediates mitochondrial fusion
  - reference_id: PMID:28114303
    supporting_text: Both Mfn1E209A and Mfn1R238A, as well as the corresponding Mfn2 mutants Mfn2E230A
      and Mfn2R259A, failed to elongate mitochondria
  - reference_id: file:human/MFN2/MFN2-uniprot.txt
    supporting_text: Mitochondrial outer membrane GTPase that mediates mitochondrial clustering and fusion
suggested_questions:
- question: Does MFN2 act as a direct ER-mitochondria tether in vivo, or do its effects on contact sites
    arise indirectly from altered mitochondrial dynamics (the de Brito/Scorrano versus Filadi/Pozzan controversy)?
- question: Which MFN2-specific functions (Parkin receptor, ER contacts, Miro-dependent transport) explain
    why CMT2A is caused by MFN2 rather than MFN1 mutations?
suggested_experiments:
- description: Acute, degron-mediated depletion of MFN2 combined with quantitative cryo-ET of ER-mitochondria
    contacts to separate direct tethering from secondary effects of altered mitochondrial morphology.
