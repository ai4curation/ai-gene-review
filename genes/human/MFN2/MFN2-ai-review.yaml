  review:
    summary: IPI with MFN1 in the study proposing that ER-localized MFN2 tethers ER to mitochondria via
      homotypic and heterotypic mitofusin complexes.
    action: MODIFY
    reason: Protein binding is uninformative; the paper uses the MFN2-MFN1/2 trans interaction to support
      ER-mitochondria tethering. The tethering role is debated (some later studies found increased ER-mitochondria
      contact after MFN2 loss), so it is proposed here as the replacement for this row but not as a core
      function.
    proposed_replacement_terms:
    - id: GO:0140474
      label: mitochondrion-endoplasmic reticulum membrane tether activity
    supported_by:
    - reference_id: PMID:19052620
      supporting_text: Thus, mitofusin 2 tethers ER to mitochondria, a juxtaposition required for efficient
        mitochondrial Ca(2+) uptake.
    - reference_id: PMID:19052620
      supporting_text: mitofusin 2 on the ER bridges the two organelles by engaging in homotypic and heterotypic
        complexes with mitofusin 1 or 2 on the surface of mitochondria
