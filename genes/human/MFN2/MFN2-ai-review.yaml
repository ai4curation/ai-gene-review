id: O95140
gene_symbol: MFN2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Mitofusin 2 (MFN2) is a dynamin-superfamily GTPase anchored in the mitochondrial outer membrane
  by a hairpin transmembrane segment, with its N-terminal GTPase domain and helical bundle domains facing
  the cytosol. Together with its paralog MFN1, MFN2 forms homo- and hetero-oligomeric complexes in trans
  between apposed mitochondria; nucleotide-dependent dimerization of the GTPase domains tethers the membranes
  and GTP hydrolysis drives outer-membrane fusion, which is coordinated with OPA1-mediated inner-membrane
  fusion. MFN2 also concentrates at ER-mitochondria contacts and has been proposed to tether the two organelles,
  connects mitochondria to the Miro/TRAK transport machinery, and in damaged mitochondria is phosphorylated
  by PINK1 and ubiquitinated by Parkin, linking fusion arrest to mitophagy. Dominant MFN2 mutations cause
  Charcot-Marie-Tooth disease type 2A, an axonal peripheral neuropathy.
