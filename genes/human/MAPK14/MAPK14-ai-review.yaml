core_functions:
- description: 'Terminal MAP kinase of the stress/cytokine-activated p38 cascade: dually phosphorylated
    on Thr180/Tyr182 by MKK3/MKK6, p38 alpha phosphorylates downstream kinases (MK2/MK3, MSK1/2, MNK1/2)
    in the cytosol and nucleus to relay stress and inflammatory signals.'
