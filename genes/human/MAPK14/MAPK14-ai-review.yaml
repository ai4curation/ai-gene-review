id: Q16539
gene_symbol: MAPK14
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: MAPK14 encodes p38 alpha (SAPK2a/CSBP), the prototypic and ubiquitously expressed member
  of the p38 subfamily of mitogen-activated protein kinases. It is a proline-directed serine/threonine
  kinase of the CMGC group that is activated by environmental stresses (osmotic, oxidative, UV, ribotoxic,
  DNA damage) and pro-inflammatory stimuli (LPS, IL-1, TNF) through dual phosphorylation of the Thr180-Gly-Tyr182
  activation-loop motif by the MAP kinase kinases MKK3 and MKK6, with TAB1-driven autophosphorylation
  and TCR/ZAP70 Tyr323 phosphorylation as alternative routes. Docking-motif interactions direct it to
  substrates in the cytosol and nucleus, including the downstream kinases MK2/MK3, MSK1/MSK2, MNK1/MNK2
  and MK5, transcription factors such as MEF2A/C, ATF2 and USF1, and RNA-binding proteins such as TIAR.
  Through these outputs p38 alpha controls inflammatory cytokine production, mRNA stability and translation,
  chromatin-associated gene induction, cell-cycle checkpoints, senescence, and differentiation of muscle,
  erythroid and other lineages. Activity is terminated by MAPK phosphatases (DUSP1, DUSP10, DUSP16, PTPRR,
  PPM1D). p38 alpha is the target of the pyridinyl-imidazole cytokine-suppressive anti-inflammatory drugs
  (e.g. SB203580).
