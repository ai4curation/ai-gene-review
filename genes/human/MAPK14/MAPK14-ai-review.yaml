suggested_questions:
- question: Many process annotations (IL-12 production, response to virus, cyclase activity, response
    to LTA) rest on SB203580/SB202190 inhibitor data that do not distinguish p38 alpha from p38 beta;
    should these be re-evaluated against isoform-selective genetic evidence (MAPK14 vs MAPK11 knockdown/knockout)?
- question: Should the numerous p38 alpha substrates currently represented as protein-binding rows (MK2,
    MK3, MSK1/2, MNK1/2, Rb, p18Hamlet/ZNHIT1) be captured instead as has_input on MAP kinase activity
    in a p38 cascade GO-CAM?
- question: Does the Mxi2 splice isoform (Q16539-3), which binds ERK1/2 and nucleoporins and promotes
    ERK nuclear import, warrant isoform-specific annotations distinct from the canonical kinase?
suggested_experiments:
- description: Analog-sensitive MAPK14 allele (with MAPK11 knockout background) combined with thiophosphate
    labelling and quantitative phosphoproteomics after anisomycin or LPS stimulation to define direct
    p38 alpha substrates and separate them from MK2/MSK-dependent phosphosites.
