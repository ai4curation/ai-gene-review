  full_text_unavailable: true
- id: PMID:32296183
  title: A reference map of the human binary protein interactome.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The retained authentic HuRI rows support the current target set, with explicit accession/product limits. TP53BP2 remains an unresolved accession crosswalk, GOLGA2 has a stable gene-level crosswalk, and source NEK6-1 versus incoming NEK6-4 is a specific unresolved product discrepancy. Assay projections are not independent physiological validations.
  full_text_unavailable: false
- id: PMID:32814053
  title: Interactome Mapping Provides a Network of Neurodegenerative Disease Proteins and Uncovers Widespread Protein Aggregation in Affected Brains.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Original NN1.0/extended target tables support all162 GFAP partner contexts. Historical CCDC196 and DPY19L2P2 crosswalks are documented; ZNF19/RPL27 and BRK1/VHL retain positive assays but conflicting accession/gene assignments. Independent partner-class records inform refinements without transferring the partners' activities to GFAP.
  full_text_unavailable: true
- id: PMID:33961781
  title: Dual proteome-scale networks reveal cell-specific remodeling of the human interactome.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Original network rows and selected Methods support GFAP protein associations in BioPlex cell-line contexts. AP-MS association does not prove purified binary contact; historical GFAP product naming is not silently equated to current kappa. Shared data with MuSIC are not independent replication.
  full_text_unavailable: false
- id: PMID:34819669
  title: A multi-scale map of cell structure fusing protein images and interactions.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Original Supplementary Table1 records the GFAP-ZNF143 association twice in reciprocal table layout. Selected supplementary Methods identify tagged-ORF AP-MS in HEK293T with technical replication; these data also entered BioPlex3 and are not independent GFAP validations.
  full_text_unavailable: true
- id: PMID:9099667
  title: Phosphorylation of glial fibrillary acidic protein at the same sites by cleavage furrow kinase and Rho-associated kinase.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Authentic abstract reports GFAP phosphorylation by Rho-associated kinase and inhibition of filament formation in vitro. GFAP is the substrate, not the kinase; source-specific species and complete constructs were not established from the abstract.
  full_text_unavailable: true
- id: PMID:9175763
  title: Domain-specific phosphorylation of vimentin and glial fibrillary acidic protein by PKN.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Authentic abstract reports PKN-mediated GFAP phosphorylation and inhibition of filament formation, while the explicitly described direct-binding assays concern vimentin. Do not silently transfer the vimentin binding experiment or assign kinase activity to GFAP.
  full_text_unavailable: true
- id: PMID:9693047
  title: Determination of the gene structure of human GFAP and absence of coding region mutations associated with frontotemporal dementia with parkinsonism linked to chromosome 17.
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: Authentic PubMed metadata confirms the GFAP gene-structure/frontotemporal-dementia citation but supplies no abstract. The original was not read; the title alone does not support a detailed functional or disease-exclusion claim.
  full_text_unavailable: true
- id: GO_REF:0000024
  title: Manual transfer of experimentally-verified manual GO annotation data to orthologs by curator judgment of sequence similarity
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Manual orthology transfer describes the two inherited GFAP localization assertions. Exact donor identity and mammalian primary-source scope are preserved; this method reference is not a new human localization experiment.
- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The actual PTHR45652 tree, MSA and four ancestral assertions were replayed. Structural annotations arise at AN0 and CMA regulation at AN260 on the target lineage. Target self-evidence is legitimate descendant evidence; donor count does not measure confidence.
- id: GO_REF:0000052
  title: Gene Ontology annotation based on curation of immunofluorescence data
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: This describes manually interpreted immunofluorescence localization. The target image was not reanalyzed; the intermediate-filament assertion agrees with independent structural evidence.
- id: GO_REF:0000107
  title: Automatic transfer of experimentally verified manual GO annotation data to orthologs using Ensembl Compara
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: This describes automatic projection from experimentally annotated orthologs. The actual rat and mouse donor records and relevant primary sources were distinguished from the incoming human IEA assertions; expression-only and contextual process endpoints were assessed separately.
- id: GO_REF:0000117
  title: Electronic Gene Ontology annotations created by ARBA machine learning models
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: ARBA is a predictive annotation method. The present structural claim is independently supported by GFAP sequence, assembly evidence and curated ancestry; ARBA is not treated as a new experiment or sole partner-class evidence.
- id: GO_REF:0000120
  title: Combined Automated Annotation using Multiple IEA Methods
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: This method combines matching electronic annotations. Literal component sources remain in the raw archive; combined provenance is not counted as independent experimental replication.
- id: Reactome:R-HSA-1251985
  title: Nuclear signaling by ERBB4
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The official pathway describes ERBB4-dependent regulation of GFAP gene expression. GFAP is a regulated target here, not the receptor, protease or transcriptional coregulator. No additional GFAP process annotation is inferred.
- id: Reactome:R-HSA-1253321
  title: GFAP gene expression is inhibited by ERBB4:TAB2:NCOR1
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The official event output1253311 explicitly maps human P14136 residues1–432 to cytosol. This supports the retained soluble compartment representation; the modeled transcriptional inhibition is performed by ERBB4/TAB2/NCOR1 rather than GFAP.
- id: Reactome:R-HSA-9613829
  title: Chaperone Mediated Autophagy
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The official pathway lists GFAP association with LAMP2A multimers and phosphorylated-GFAP/EEF1A1 steps. This is curated pathway context; the mechanistic and species assessment rests separately on PMID20797626, without calling GFAP a transported degradation substrate.
- id: UniProtKB:P14136
  title: GFAP_HUMAN — Glial fibrillary acidic protein
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The actual reviewed record and three direct product sequences were inspected and reconstructed exactly. Display name2/epsilon maps to P14136-3, whereas display name3/kappa maps to P14136-2. This nomenclature is preserved without assigning all historical assays exclusively to one product.
- id: file:human/GFAP/GFAP-evidence.yaml
  title: GFAP annotation context, source and product evidence archive
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Companion provenance archive for 279 original contexts, genuine native joins, three extension atoms, products, ancestral assertions and independent source/partner records. The original GOA records are preserved data, not independent biological support. Five original native quote offsets are established. The follow-up retains prior binding judgments as historical provenance and records the current functional-informativeness reassessment.
- id: PMID:6371809
  title: Identification of glial filament protein and vimentin in the same intermediate filament system in human glioma cells.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: All five original scanned pages were visually read. Human glioma immunogold experiments locate GFAP and vimentin in the same filaments with antibody-specificity controls. This supplies structural context for binding, without resolving heterodimer geometry; separate protofibrils remain possible. The genuine native cache contains the abstract only; the inspected scanned original supplies the full-paper evidence.
- id: PMID:35511821
  title: Effects of Alexander disease-associated mutations on the assembly and organization of GFAP intermediate filaments.
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected original assembly Methods, Results and captions directly establish purified recombinant human wild-type GFAP filament formation and human-protein incorporation into rat astrocyte networks. No figure pixels or supplements were inspected. Local mutant-label inconsistencies prevent precise genotype/ratio claims; no new natural-product sequence equivalence is asserted. The genuine native full-text cache was checked against this selected assembly scope.
