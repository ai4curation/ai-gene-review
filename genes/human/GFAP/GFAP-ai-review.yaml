id: P14136
gene_symbol: GFAP
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Glial fibrillary acidic protein is a type III intermediate-filament protein that contributes to the cytoplasmic filament network of astrocytes and other GFAP-expressing glial cells. Its self-association and assembly with other intermediate-filament proteins support cytoskeletal organization. Alternative carboxyl termini distinguish alpha, epsilon and kappa splice products with different assembly and interaction properties. A peripheral lysosomal pool regulates chaperone-mediated autophagy in mammalian experimental systems. Pathogenic GFAP variants cause Alexander disease, characterized by astrocytic protein inclusions and nervous-system dysfunction.
core_functions:
- description: Contributes structural subunits to intermediate filaments, organizing the glial cytoskeleton through filament assembly and association with other intermediate-filament proteins.
  molecular_function:
    id: GO:0005200
    label: structural constituent of cytoskeleton
  directly_involved_in:
  - id: GO:0045109
    label: intermediate filament organization
  locations:
  - id: GO:0005882
    label: intermediate filament
  supported_by:
  - reference_id: PMID:2740350
  - reference_id: PMID:12058025
  - reference_id: PMID:17203480
functional_isoforms:
- id: GFAP_ALPHA
  name: GFAP alpha
  type: SPLICE_VARIANT
  maps_to:
  - type: UNIPROT_ISOFORM
    ids:
    - P14136-1
  description: The displayed 432-residue product supplies the reference carboxyl terminus and forms filamentous networks in the reported human-protein expression studies. It is the comparison product for the epsilon- and kappa-tail effects (PMID:12058025; PMID:17203480).
- id: GFAP_EPSILON
  name: GFAP epsilon
  type: SPLICE_VARIANT
  maps_to:
  - type: UNIPROT_ISOFORM
    ids:
    - P14136-3
  description: The 431-residue product replaces the alpha carboxyl terminus. Its tail supports presenilin-fragment binding in the tested human-protein assays, and epsilon incorporates into cellular filament networks; these observations do not establish epsilon homomeric assembly (PMID:12058025). UniProt display name 2 maps to accession P14136-3.
- id: GFAP_KAPPA
  name: GFAP kappa
  type: SPLICE_VARIANT
  maps_to:
  - type: UNIPROT_ISOFORM
    ids:
    - P14136-2
  description: The 438-residue product has a distinct alternative carboxyl terminus. The authentic abstract reports failure to form homomeric filaments and disruption of alpha networks as kappa expression increases; the original full text remains unavailable (PMID:17203480). UniProt display name 3 maps to accession P14136-2.
suggested_questions:
- question: Which exact GFAP perturbation or assay supports the two PMID:26571399 neural-crest and enteric-development annotations? The inspected original and supplement leave the gene-to-experiment link unresolved.
  experts:
  - Enteric nervous-system curators
  - Original study authors
- question: Can original clone sequences reconcile TP53BP2 Q05BL1 with the HuRI partner, NEK6 Q9HC98-4 with source Q9HC98-1, and the ZNF19/RPL27 and BRK1/VHL accession–gene conflicts in the Haenig interaction records?
  experts:
  - Molecular interaction database curators
  - Original interaction-screen authors
- question: How do the three sequence-defined GFAP splice products differ in endogenous human filament assembly and peripheral lysosomal regulation at physiological expression ratios?
  experts:
  - Intermediate-filament specialists
  - Chaperone-mediated autophagy specialists
suggested_experiments:
- description: Compare sequence-verified alpha, epsilon and kappa at controlled ratios in human astrocytes, measuring filament incorporation and insoluble assemblies separately from protein abundance.
  hypothesis: Carboxyl-terminal differences alter coassembly in a manner that depends on relative product abundance.
- description: Resolve soluble and lysosome-associated GFAP pools in human astrocytes and test LAMP2A-complex stability and substrate uptake separately after GFAP perturbation.
  hypothesis: The two-pool regulatory mechanism reported in rodent systems can be distinguished from a requirement for initial LAMP2A-complex assembly.
