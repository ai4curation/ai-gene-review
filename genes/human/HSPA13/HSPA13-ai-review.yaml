core_functions:
- description: Hydrolyzes ATP in a peptide-independent manner at ER-associated protein-quality-control
    machinery. HSPA13 associates with the Sec61 translocon and ER chaperones, and altering its abundance
    or ATPase activity changes secretory-protein import and maturation; its precise regulatory mechanism
    remains unresolved.
  molecular_function:
    id: GO:0016887
    label: ATP hydrolysis activity
