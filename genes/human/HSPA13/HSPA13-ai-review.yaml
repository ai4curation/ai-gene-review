- term:
    id: GO:0042026
    label: protein refolding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: HSPA13 involvement in refolding requires a process-specific mechanistic test.
    action: UNDECIDED
    reason: A refolding biological process need not mean that HSPA13 independently executes the canonical
      HSP70 foldase cycle. SBD loss is relevant divergence, but ER-chaperone and translocon interactions
      allow possible assistance through other proteins. Existing studies measure import, maturation, aggregation
      and turnover rather than recovery of a denatured protein's biological activity. The inherited process
      is therefore unresolved, not disproved solely by domain truncation.
    supported_by:
    - reference_id: PMID:36244454
      supporting_text: Another 11 interactors are major ER chaperones
