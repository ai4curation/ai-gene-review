id: P48723
gene_symbol: HSPA13
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: HSPA13/STCH is an atypical HSP70-family ATPase associated with endoplasmic-reticulum
  microsomes and the Sec61 translocation machinery. It retains a nucleotide-binding domain but lacks
  the canonical C-terminal HSP70 substrate-binding domain and has peptide-independent ATPase activity.
  In human-cell studies, HSPA13 abundance and ATPase function affect the import and maturation of
  secretory proteins, while loss of HSPA13 destabilizes proteostasis under ER stress. HSPA13 also
  associates with ER chaperones and ubiquilin/BAG6-family proteins; binding to the latter does not
  require their ubiquitin-like domains. Its effects on folding and degradation depend on the client
  and experimental context.

