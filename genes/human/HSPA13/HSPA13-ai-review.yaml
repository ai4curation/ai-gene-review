- id: PMID:8131751
  title: Stch encodes the 'ATPase core' of a microsomal stress 70 protein.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached publications/PMID_8131751.md title matches; also anchored to GOA (TAS, GO:0043231).
      The defining characterization of STCH/HSPA13 as a microsomal HSP70 with peptide-independent
      ATPase activity and a truncated substrate-binding domain; supports core_function GO:0016887.
      (Gene is poorly characterized overall, but this paper is directly on-target.)
  findings:
  - statement: STCH/HSPA13 is a microsome-associated HSP70-family member with a hydrophobic leader
      sequence, a ~50-residue insertion in the ATP-binding domain and a truncated C-terminal peptide-binding
      region; it has peptide-independent ATPase activity, is constitutively expressed, and is induced
      by calcium ionophore but not by heat shock.
    reference_section_type: RESULTS
- id: PMID:10675567
  title: A family of ubiquitin-like proteins binds the ATPase domain of Hsp70-like Stch.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary abstract checked. GO:0032182 denotes small conjugating ubiquitin-like proteins;
      binding to ubiquilin/BAG6-like proteins through a different region does not establish that activity.
  findings:
  - statement: STCH binding to Chap1/Chap2 does not require their ubiquitin-like domains.
    supporting_text: While the N-terminal UbL domains were not essential for Stch binding
    reference_section_type: RESULTS
  - statement: Chap1 instead requires a Sti1-like repeat for this interaction.
    supporting_text: 'Chap1/Dsk2 contains a Sti1-like repeat sequence that is required for binding
      to

      Stch'
    reference_section_type: RESULTS
  full_text_unavailable: true
