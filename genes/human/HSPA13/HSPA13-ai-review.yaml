    id: GO:0044183
    label: protein folding chaperone
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: Canonical HSP70 folding chemistry is disrupted, but the broad folding-chaperone claim is
      not decisively resolved.
    action: UNDECIDED
    reason: The missing canonical substrate-binding domain and peptide-independent ATPase are genuine
      target-specific divergence evidence, so canonical HSP70 client-clamping cannot simply be assumed.
      However, GO:0044183 also covers binding a protein-containing complex to assist folding. PMID:36244454
      establishes ER-chaperone/translocon associations and effects on proteostasis, without a direct folding
      assay. Its observation that both HSPA13 and BiP overexpression can impair translocation also undermines
      the provider claim that antagonistic overexpression phenotypes alone exclude chaperone capacity.
      Retain uncertainty about an indirect complex-dependent folding contribution rather than treating
      absence of the canonical domain as impossibility of every qualifying mechanism.
