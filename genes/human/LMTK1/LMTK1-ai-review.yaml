id: Q6ZMQ8
gene_symbol: LMTK1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  LMTK1 (formerly AATK) encodes an alternatively spliced protein kinase. The
  1,374-amino-acid reference human product has a predicted N-terminal transmembrane
  helix and an N-proximal kinase domain; one short isoform lacks both, while another
  retains them but lacks much of the C-terminal tail. Human-cell wild-type versus
  kinase-dead experiments and immunoprecipitate kinase assays support
  serine/threonine kinase activity, TP53 Ser366 phosphorylation, and
  kinase-dependent growth suppression. Repeated human interaction datasets support
  association with protein phosphatase 1 catalytic subunits, although a PP1-scaffold
  function has not been established in human cells. By contrast, Rab11-dependent
  recycling-endosome trafficking and regulation of axonal, dendritic, and
  dendritic-spine growth were established mainly in rodent neurons, particularly
  for historical transmembrane-domain-free LMTK1A; historical LMTK1A/LMTK1B
  nomenclature does not map unambiguously to current numbered human isoforms.
