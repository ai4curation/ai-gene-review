  supporting_entities:
  - MGI:MGI:1197518
  - PANTHER:PTN002815112
  review:
    summary: >-
      A mouse cerebellar-granule-cell study found that wild-type AATK enhanced
      apoptosis relative to a kinase-deficient construct under low-KCl conditions.
      This supports the PAINT transfer as a conserved neuronal context, but neuronal
      apoptosis is not the best-supported core role of human LMTK1.
    action: KEEP_AS_NON_CORE
    reason: >-
      Retain the annotation as a non-core, orthology-supported process. The source
      study is explicitly about mouse Aatk and the cached record is abstract-only,
      so it does not establish a direct human neuronal-apoptosis annotation. Direct
      human evidence instead establishes serine/threonine kinase activity; neuronal
      differentiation was observed in a human cell line with unresolved construct
      species, and the endosomal-trafficking evidence is rodent or heterologous.
    additional_reference_ids:
    - PMID:11314040
    supported_by:
    - reference_id: PMID:11314040
      supporting_text: >-
        The number of apoptotic granule cells overexpressing wild-type AATYK protein
        was significantly greater than the number of apoptotic granule cells
        overexpressing a mutant AATYK that lacked tyrosine kinase activity in low
        concentrations of KCl.
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
      - source_id: MGI:MGI:1197518
        source_label: mouse Aatk
        source_status: SUPPORTS_TRANSFER
        comment: >-
          The mouse source has direct experimental support for a role in apoptosis of
          mature cerebellar granule neurons (PMID:11314040), although the full text is
          unavailable in the cache and the role is contextual rather than core.
      - source_id: PANTHER:PTN002815112
        source_label: PANTHER ancestral node
        source_status: SUPPORTS_TRANSFER
        comment: >-
          The PAINT node links the orthologous mammalian LMTK1 proteins; no evidence of
