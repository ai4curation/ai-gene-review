knowledge_gaps:
- gap_statement: >-
    The human construct used for the direct kinase work in PMID:35902728 has not been
    mapped unambiguously to a current Q6ZMQ8 isoform.
  boundary: >-
    Q6ZMQ8-2 lacks residues 1-433, including the kinase domain, whereas Q6ZMQ8-1 and
    Q6ZMQ8-3 retain the kinase domain.
  gap_kind:
  - BIOLOGY
  - CURATION
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    Isoform mapping is required before catalytic activity or TP53 phosphorylation can
    be assigned to a specific human isoform.
  resolution: >-
    Sequence the experimental construct and assay purified, sequence-defined Q6ZMQ8
    isoforms.
- gap_statement: >-
    Conservation of the LMTK1-TBC1D9B-Rab11A pathway in endogenous human neurons is
    untested.
  boundary: >-
    Knockout, knockdown, rescue, trafficking, and neuronal-morphogenesis evidence is
    strong for the mouse ortholog, but historical LMTK1A does not map cleanly to a
    current human isoform.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    This determines whether the orthology-supported neuronal role can become direct
