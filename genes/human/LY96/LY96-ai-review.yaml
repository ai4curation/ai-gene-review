- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: IDA
  original_reference_id: PMID:11274165
  qualifier: located_in
  review:
    summary: LPS was crosslinked to MD-2 in the CD14-TLR4-MD-2 membrane receptor complex on transfected
      cells.
    action: ACCEPT
    reason: MD-2 has no transmembrane segment but is held at the outer face of the plasma membrane by
      TLR4; plasma membrane (as part of the receptor complex) is its functional location. Cell surface
      would be the more literal term, but plasma membrane is conventional for peripheral receptor subunits.
    supported_by:
    - &id018
      reference_id: PMID:11274165
      supporting_text: Here we show that LPS is cross-linked specifically to TLR4 and MD-2 only when co-expressed
        with CD14.
    - &id010
      reference_id: PMID:10359581
      supporting_text: These results are consistent with membrane anchoring of MD-2 via physical association
        with TLR4.
