- term:
    id: GO:0001530
    label: lipopolysaccharide binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR039217
  review:
    summary: MD-2 binds the lipid A moiety of LPS in a deep hydrophobic pocket formed by its ML (MD-2-related
      lipid-recognition) fold.
    action: ACCEPT
    reason: Direct lipid A binding by MD-2 is shown by crosslinking and by several crystal structures;
      TLR4 alone does not bind LPS. The InterPro mapping from the LY96 family (IPR039217) is correct and
      this is a core molecular function.
    supported_by:
    - &id014
      reference_id: PMID:22532668
      supporting_text: MD-2 has a unique hydrophobic cavity that directly binds to lipid A, the active
        center of LPS.
    - &id002
      reference_id: PMID:22532668
      supporting_text: TLR4 alone does not directly bind LPS and requires the coreceptor MD-2
    - &id001
      reference_id: PMID:19252480
      supporting_text: LPS interacts with a large hydrophobic pocket in MD-2 and directly bridges the
        two components of the multimer.
- term:
    id: GO:0001875
    label: lipopolysaccharide immune receptor activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000390890
  - UniProtKB:Q9Y6Y9
  review:
    summary: MD-2 is the ligand-binding subunit of the TLR4-MD-2 LPS receptor. The PAINT node PTN000390890
      places this activity on the LY96 clade, with the human protein among the experimental descendants.
    action: ACCEPT
    reason: GO:0001875 describes combining with LPS and transmitting the signal across the membrane. MD-2
      performs the combining step (lipid A sits in its pocket and bridges the two TLR4-MD-2 heterodimers),
      while TLR4 supplies the transmembrane and TIR signalling part. The activity therefore belongs to
      the heterodimer, to which MD-2 contributes the recognition half. The annotation is accepted as correct
      for the receptor subunit that recognises the ligand; in core_functions it is recorded as a contribution
      to the heteromeric receptor activity, with LPS binding and coreceptor activity as the activities
      MD-2 has on its own.
    supported_by:
    - &id003
      reference_id: PMID:19252480
      supporting_text: form a heterodimer that recognizes a common 'pattern' in structurally diverse LPS
        molecules
    - *id001
    - *id002
- term:
    id: GO:0001875
    label: lipopolysaccharide immune receptor activity
  evidence_type: IDA
  original_reference_id: PMID:19252480
  qualifier: enables
  review:
    summary: The TLR4-MD-2-LPS crystal structure shows LPS bound in the MD-2 pocket, bridging two TLR4-MD-2
      heterodimers into the m-shaped signalling multimer.
    action: ACCEPT
    reason: Direct structural evidence that MD-2 is the LPS-binding component of the heterodimeric LPS
      receptor. As for the IBA row, MD-2 carries out the recognition step of a receptor activity whose
      transmembrane transmission is performed by TLR4; accepted, with the contributes-to nuance recorded
      in core_functions.
    supported_by:
    - *id003
    - *id001
    - *id002
- term:
    id: GO:0002221
    label: pattern recognition receptor signaling pathway
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  supporting_entities:
  - ARBA:ARBA00033911
  review:
    summary: MD-2 is part of the TLR4 receptor that initiates this pattern recognition receptor signalling
      pathway.
    action: ACCEPT
