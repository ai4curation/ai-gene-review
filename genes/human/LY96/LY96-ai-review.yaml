    - *id003
- term:
    id: GO:0002224
    label: toll-like receptor signaling pathway
  evidence_type: IDA
  original_reference_id: PMID:14607928
  qualifier: involved_in
  review:
    summary: Mutagenesis of MD-2 separated its TLR4-binding surface from the surface needed for LPS responsiveness;
      both are needed for TLR4 signalling.
    action: ACCEPT
    reason: MD-2 is a component of the receptor that initiates TLR4 signalling. The more specific GO:0034142
      is also annotated.
    supported_by:
    - &id004
      reference_id: PMID:14607928
      supporting_text: MD-2 binding to TLR4 was dependent on Cys(95) and Cys(105), which might form an
        intramolecular disulfide bond.
    - &id016
      reference_id: PMID:14607928
      supporting_text: Thus, our data indicate that MD-2 interaction with TLR4 is necessary but not sufficient
        for cellular response to LPS.
