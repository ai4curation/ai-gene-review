- term:
    id: GO:0006968
    label: cellular defense response
  evidence_type: TAS
  original_reference_id: PMID:10359581
  qualifier: involved_in
  review:
    summary: Traceable author statement from the MD-2 discovery paper about host defence against pathogens.
    action: MODIFY
    reason: Cellular defense response ("a defense response that is mediated by cells") is vague for a
      secreted/cell-surface receptor subunit. What MD-2 does is recognise LPS as part of the TLR4 receptor
      to initiate the innate immune response; innate immune response is the appropriate term.
    supported_by:
    - *id005
    proposed_replacement_terms:
    - id: GO:0045087
      label: innate immune response
- term:
    id: GO:0007166
    label: cell surface receptor signaling pathway
  evidence_type: TAS
  original_reference_id: PMID:10359581
  qualifier: involved_in
  review:
    summary: MD-2 is part of the TLR4 cell-surface receptor that signals in response to LPS.
    action: MODIFY
    reason: Correct but too general; the specific pathway is toll-like receptor 4 signaling pathway.
    supported_by:
    - *id012
    - *id005
    proposed_replacement_terms:
    - id: GO:0034142
      label: toll-like receptor 4 signaling pathway
- term:
    id: GO:0010008
    label: endosome membrane
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-166168
  qualifier: located_in
  review:
    summary: Reactome places activated TLR4:LY96:LPS:CD14 complexes on the endosome membrane after LPS-induced
      endocytosis, where TRAM/TRIF signalling is initiated.
    action: KEEP_AS_NON_CORE
    reason: MD-2 travels with TLR4 into endosomes, where the TRAM/TRIF branch of TLR4 signalling is triggered.
      MD-2 is on the lumenal face as part of the TLR4 complex, not an integral membrane protein. Plausible
      as a signalling compartment, but the primary site of LPS recognition is the cell surface.
    supported_by:
    - &id013
      reference_id: Reactome:R-HSA-2201293
      supporting_text: Upon LPS stimulation TLR4 is internalized into endosomes where the signaling pathway
        is triggered through the adaptors TRAM and TRIF leading to the activation of IRF3 and induction
        of IFN-beta
