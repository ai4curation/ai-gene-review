  supporting_entities:
  - UniProtKB:O00206
  review:
    summary: MD-2 binds the extracellular domain of TLR4. This IPI comes from a TLR10 characterisation
      paper (abstract-only in cache); the abstract does not describe the MD-2 experiment, but the partner
      recorded by the curator is TLR4.
    action: MODIFY
    reason: The partner is TLR4 (O00206). MD-2 binding to the concave face of the TLR4 ectodomain is established
      by coimmunoprecipitation, mutagenesis and crystal structures, and is how MD-2 functions (it is retained
      at the cell surface only through TLR4). Generic protein binding is replaced by the informative term
      Toll-like receptor 4 binding.
    supported_by:
    - &id005
      reference_id: PMID:10359581
      supporting_text: MD-2 is physically associated with TLR4 on the cell surface and confers responsiveness
        to LPS.
    - *id004
    proposed_replacement_terms:
