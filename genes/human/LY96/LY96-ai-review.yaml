      confers LPS responsiveness on TLR4-expressing cells.
    action: ACCEPT
    reason: Direct experimental evidence that MD-2 is secreted as disulfide-linked oligomers. Core location
      for the soluble pool.
    supported_by:
    - &id008
      reference_id: PMID:11593030
      supporting_text: MD-2 contains a leader sequence but lacks a transmembrane domain, and we asked
        whether it is secreted into the medium as an active protein.
    - &id015
      reference_id: PMID:11593030
      supporting_text: We conclude that normal and transfected cells secrete a soluble form of MD-2 that
        binds with high affinity to TLR4 and that could play a role in regulating responses to LPS and
        other pathogen-derived substances in vivo.
