- term:
    id: GO:0015026
    label: coreceptor activity
  evidence_type: TAS
  original_reference_id: PMID:10359581
  qualifier: enables
  review:
    summary: 'MD-2 is the coreceptor of TLR4: it binds the ligand (lipid A) and cooperates with the transmembrane
      receptor TLR4 to initiate signalling.'
    action: ACCEPT
    reason: 'Coreceptor activity ("combining with an extracellular messenger, and in cooperation with
      a nearby primary receptor, initiating a change in cell activity") describes MD-2 precisely: TLR4
      alone does not bind LPS and requires the coreceptor MD-2, and MD-2 has no transmembrane or signalling
      domain of its own. This is the best single term for what MD-2 does independently.'
    supported_by:
    - *id002
    - *id005
    - *id014
