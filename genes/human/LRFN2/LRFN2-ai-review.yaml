gene_symbol: LRFN2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  LRFN2, also called SALM1, is a brain-enriched type-I single-pass synaptic
  membrane glycoprotein with an extracellular leucine-rich-repeat,
  immunoglobulin-like, and fibronectin type III region and a long cytoplasmic tail
  ending in an ESTV PDZ-binding motif. SALM1 occupies both postsynaptic and
  presynaptic membranes. At postsynapses, rodent SALM1 associates with PSD-95-family
  scaffolds and NMDA receptors and supports postsynaptic-density maturation,
  glutamate-receptor surface organization, synaptic transmission, and plasticity.
  At presynapses, mouse SALM1 binds CASK through its PDZ-binding tail and promotes
  F-actin- and PIP2-dependent cis clustering of neurexin, without evidence that
  SALM1 binds neurexin directly. SALM1 can also form cis complexes with itself and
  other SALMs, but it did not mediate SALM-SALM trans-cellular adhesion in
  heterologous cell-aggregation assays.
