- id: PMID:16495444
  title: A novel family of adhesion-like molecules that interacts with the NMDA receptor.
  findings:
  - statement: Rat SALM1 is a single-pass neuronal membrane protein with extracellular
      LRR, Ig-like, and fibronectin type III domains and a cytoplasmic PDZ-binding tail.
    supporting_text: The family members, SALM1-SALM4, have a single transmembrane
      (TM) domain and contain extracellular leucine-rich repeats, an Ig C2 type
      domain, a fibronectin type III domain, and an intracellular postsynaptic
      density-95 (PSD-95)/Discs large/zona occludens-1 (PDZ) binding domain, which
      is present on all members except SALM4.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: Endogenous rat-brain SALM1 associates with PSD-95-family scaffolds and
      occurs in synaptic-membrane and postsynaptic-density fractions as well as axons
      and dendrites.
    supporting_text: SALM1 interacts with PSD-95, synapse-associated protein 102
      (SAP102), and SAP97 based on coimmunoprecipitation of detergent-solubilized
      brain. Distribution studies show that SALM1 is present in synaptic membrane
      and postsynaptic density fractions but is also distributed in axons and
      dendrites.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: SALM1 overexpression in rat hippocampal neurons recruits NMDA receptors
      and PSD-95 to dendritic puncta.
    supporting_text: Overexpression of SALM1 in 14 DIV neurons recruits NMDA receptors
      (NR) and PSD-95 to dendritic puncta.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed and the PMC record were verified; the local cache is
      abstract-only. The experiments establish rat SALM1/Lrfn2 scaffold, NMDA-
      receptor, and localization biology, not direct human LRFN2 evidence.
- id: PMID:16828986
  title: Comparative analysis of structure, expression and PSD95-binding capacity of Lrfn, a novel family of neuronal transmembrane proteins.
  findings:
  - statement: Mouse and human Lrfn proteins share an extracellular LRR-Ig-FNIII
      region and span the plasma membrane with an extracellular N terminus.
    supporting_text: Lrfn1-5 commonly encode glycoproteins spanning the plasma
      membrane, with their N-terminus located on the extracellular side.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: Lrfn2 expression begins in mature neural cells, and its C-terminal
      tail binds PSD95 PDZ domains and redistributes PSD95 to the cell periphery.
    supporting_text: In the course of development, expression of Lrfn1, Lrfn3, and
      Lrfn4 started from immature neural cells, whereas that of Lrfn2 and Lrfn5 was
      limited to mature ones. Lrfn1-5 commonly encode glycoproteins spanning the
      plasma membrane, with their N-terminus located on the extracellular side.
      C-termini of Lrfn1, Lrfn2 and Lrfn4 were bound by PDZ domains of postsynaptic
      protein PSD95, re-distributing PSD95 to cell periphery where the Lrfn proteins
      were detected.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed metadata and abstract were verified. This comparative study
      explicitly covers both mouse and human family members, but the abstract does
      not assign every assay to a human construct; species-specific claims are
      therefore kept conservative.
- id: PMID:18227064
  title: The SALM family of adhesion-like molecules forms heteromeric and homomeric complexes.
  findings:
  - statement: In rat brain, SALM1-3 strongly co-immunoprecipitate, supporting
      cis-family complexes.
    supporting_text: In brain, we found that SALMs 1-3 strongly
      co-immunoprecipitated with each other, whereas SALMs 4 and 5 did not,
      suggesting that SALMs 4 and 5 mainly form homomeric complexes.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: SALM1-3 did not form trans-cellular associations; only SALM4 and SALM5
      formed homophilic trans associations in the tested system.
    supporting_text: Both SALMs 4 and 5 formed homophilic, but not heterophilic
      associations, whereas no trans associations were formed by the other SALMs.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed and the PMC record were verified; the local cache is
      abstract-only. The work used rat brain and transfected heterologous cells and
      is important for distinguishing SALM1 cis oligomerization from trans adhesion.
- id: PMID:18585462
  title: Synaptic adhesion-like molecules (SALMs) promote neurite outgrowth.
  findings:
  - statement: SALM1 overexpression promotes neurite outgrowth in cultured rat
      hippocampal neurons, and its C-terminal PDZ-binding domain is required for most
      measured outgrowth effects.
    supporting_text: Over-expression of each SALM resulted in enhanced neurite
      outgrowth, but with different phenotypes. Neurite outgrowth could be reduced
      by applying antibodies targeting the extracellular leucine rich regions of
      SALMs and with RNAi. Through over-expression of deletion constructs, we found
      that the C-terminal PDZ binding domains of SALMs 1-3 are required for most
      aspects of neurite outgrowth.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed and the PMC record were verified; the local cache is
      abstract-only. The study supports a rodent neuronal phenotype but does not
      identify a human-specific pathway or a unique SALM1 extracellular ligand.
- id: PMID:19681166
  title: Reticulon 3 is an interacting partner of the SALM family of adhesion molecules.
  findings:
  - statement: A yeast two-hybrid screen with the SALM1 extracellular region
      recovered full-length RTN3A1, and the interaction mapped to the conserved SALM
      LRR domain.
    supporting_text: To identify proteins that interact with extracellular domains
      of SALMs, we carried out yeast two-hybrid screening using the extracellular
      domain of SALM1 as bait. A clone encoding full-length reticulon 3A1 was
      isolated. This interaction was shown to occur through the LRR domain, which is
      found on all SALMs.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: Brain immunoprecipitation detected an RTN3C-sized band with SALM1-4,
      whereas a separate 90-kDa band associated only with SALM2 and SALM3.
    supporting_text: A 19-kDa band, identified as reticulon 3C, bound to all four
      SALMs, whereas a 90-kDa band, which did not comigrate with any known reticulon
      3 variant, bound to SALMs 2 and 3.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed metadata and abstract were verified. The evidence supports
      family-level RTN3 association and suggests trafficking involvement, but the
      latter remains interpretive and the SALM1 interaction is weaker than the
      SALM2/SALM3 signal described by Reactome.
- id: PMID:20410109
  title: Selected SALM (synaptic adhesion-like molecule) family proteins regulate synapse formation.
  findings:
  - statement: The tested ability to induce presynaptic differentiation belongs to
      SALM3 and SALM5, not SALM1/LRFN2, and should not be transferred across the
      family.
    supporting_text: We found that expression of the SALM family proteins SALM3 and
      SALM5 in nonneural and neural cells induces both excitatory and inhibitory
      presynaptic differentiation in contacting axons.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed and the PMC record were verified; the local cache is abstract-only.
      This is used as a paralog boundary: it supports SALM3/SALM5 synaptogenic
      activity, not a corresponding SALM1/LRFN2 activity.
- id: PMID:28604739
  title: Autism-like behaviours and enhanced memory formation and synaptic plasticity in Lrfn2/SALM1-deficient mice.
  findings:
  - statement: Mouse Lrfn2 is enriched in postnatal cortex and hippocampus and occurs
      in synaptosomal plasma-membrane and postsynaptic-density fractions.
    supporting_text: Lrfn2 expression increased in the postnatal cerebral cortex and
      hippocampus, (Fig. 1b), and Lrfn2 was the only Lrfn family member that
      prominently increased in postnatal hippocampus.
    reference_section_type: RESULTS
    full_text_unavailable: false
  - statement: Lrfn2 loss produces structurally immature hippocampal synapses, lowers
      AMPA/NMDA ratio, and enhances LTP in this mouse line.
    supporting_text: The synapses are structurally and functionally immature with
      spindle shaped spines, smaller postsynaptic densities, reduced AMPA/NMDA ratio,
      and enhanced LTP.
    reference_section_type: ABSTRACT
    full_text_unavailable: false
  - statement: AMPA-receptor surface expression depends on the Lrfn2-PSD-95
      interaction in cultured neuronal experiments.
    supporting_text: In vitro experiments reveal that synaptic surface expression of
      AMPAR depends on the direct interaction between Lrfn2 and PSD-95.
    reference_section_type: ABSTRACT
    full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed identity and the cached PMC full text were verified. The
      core mechanistic and knockout data are mouse or rat-neuron experiments; the
      paper separately tested human LRFN2 patient variants and should not be read as
      direct normal-function experimentation in human neurons.
- id: PMID:29798891
  title: Lrfn2-Mutant Mice Display Suppressed Synaptic Plasticity and Inhibitory Synapse Development and Abnormal Social Communication and Startle Response.
  findings:
  - statement: In an independent mouse Lrfn2 knockout line, hippocampal CA1 neurons
      showed altered excitatory transmission/plasticity and reduced inhibitory-
      synapse density and transmission.
    supporting_text: Here, we found that mice lacking SALM1/LRFN2 (Lrfn2-/- mice)
      show a normal density of excitatory synapses but altered excitatory synaptic
      function, including enhanced NMDAR-dependent synaptic transmission but
      suppressed NMDAR-dependent synaptic plasticity in the hippocampal CA1 region.
      Unexpectedly, SALM1 expression was detected in both glutamatergic and GABAergic
      neurons and Lrfn2-/- CA1 pyramidal neurons showed decreases in the density of
      inhibitory synapses and the frequency of spontaneous inhibitory synaptic
      transmission.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed and the PMC record were verified; the local cache is
      abstract-only. This independent mouse line supports a synaptic-regulatory role
      but differs from PMID:28604739 in the direction of plasticity and several adult
      behavioral phenotypes, so those outcomes should not be collapsed.
- id: PMID:31368584
  title: SALM1 controls synapse development by promoting F-actin/PIP2-dependent Neurexin clustering.
  findings:
  - statement: In mouse hippocampal neurons SALM1 occupies both presynaptic and
      postsynaptic membranes, and depletion from either side impairs excitatory
      synapse formation.
    supporting_text: We show that SALM1 is present at pre‐ and postsynaptic membranes
      of mouse hippocampal neurons and that depletion of pre‐ or postsynaptic SALM1
      impaired Neuroligin1‐ and Neurexin1β‐mediated excitatory synapse formation and
      reduced synaptic vesicle clustering, synaptic transmission, and synaptic
      vesicle release.
    reference_section_type: INTRODUCTION
    full_text_unavailable: false
  - statement: Presynaptic SALM1 promotes cis clustering of neurexin through an
      F-actin/PIP2-dependent mechanism, rather than by direct SALM1-neurexin binding.
    supporting_text: Together, our data suggest that SALM1 organizes synapse
      development by promoting F‐actin/PIP2‐dependent cis‐oligomerization of Neurexin
      at the presynapse.
    reference_section_type: INTRODUCTION
    full_text_unavailable: false
  - statement: SALM1 binds the presynaptic CASK/Mint1/Lin7b organizer through its PDZ-
      binding tail.
    supporting_text: Together, these data identify SALM1 as a novel binding partner
      of the CASK/Mint1/Lin7b presynaptic organizer complex, interacting directly
      with CASK, via its PDZ binding domain.
    reference_section_type: RESULTS
    full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed identity and the cached PMC full text were verified. The
      localization and loss-of-function work is in mouse hippocampal neurons; it
      establishes a presynaptic SALM1 pool alongside the better-known postsynaptic
      pool and does not imply trans binding between SALM1 and neurexin.
- id: PMID:34251337
  title: Sorting nexin-27 regulates AMPA receptor trafficking through the synaptic adhesion protein LRFN2.
  findings:
  - statement: The LRFN2 C-terminal PDZ-binding motif directly binds the SNX27 PDZ
      domain, with high-micromolar affinity in a purified system.
    supporting_text: This established that the isolated recombinant PDZ domain of
      SNX27 directly bound to a synthetic peptide corresponding to the LRFN2 PDZ
      binding motif, S-S-E-W-V-M-E−3-S-T-V−0 with a high micromolar affinity (Kd =
      1.6 µM) (Figure 2D).
    reference_section_type: RESULTS
    full_text_unavailable: false
  - statement: Rat-neuron LRFN2 associates with AMPA receptors, and LRFN2 knockdown
      lowers surface AMPA-receptor expression, synaptic activity, and hippocampal
      long-term potentiation.
    supporting_text: Furthermore, LRFN2 associates with AMPA receptors and knockdown
      of LRFN2 results in decreased surface AMPA receptor expression, reduced
      synaptic activity, and attenuated hippocampal long-term potentiation.
    reference_section_type: ABSTRACT
    full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed identity and the cached PMC full text were verified. The
      direct biochemical interaction used a recombinant rat SNX27 PDZ domain and a
      human LRFN2 tail peptide, whereas trafficking and electrophysiology were
      principally performed in rat primary neurons and hippocampal tissue.
- id: PMID:38408870
  title: Cone Synaptic Function is Modulated by the Leucine-Rich Repeat Adhesion Molecule LRFN2.
  findings:
  - statement: Mouse retinal LRFN2 is selectively expressed at cone terminals and
      colocalizes with depolarizing bipolar-cell signalplex markers.
    supporting_text: LRFN2 is selectively expressed at cone terminals and colocalizes
      with PNA, and other DBC signalplex members.
    reference_section_type: ABSTRACT
    full_text_unavailable: false
  - statement: Lrfn2 deficiency selectively reduces bright-flash photopic ERG b-wave
      amplitude, supporting a role in transmission from cones to cone depolarizing
      bipolar cells.
    supporting_text: In the absence of LRFN2 the cone-mediated photopic
      electroretinogram b-wave amplitude is reduced at the brightest flash
      intensities. These data demonstrate that LRFN2 absence compromises normal
      synaptic transmission between cones and cone DBCs.
    reference_section_type: ABSTRACT
    full_text_unavailable: false
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed identity and the cached PMC full text were verified. This
      is a direct mouse retinal localization and knockout phenotype that extends
      Lrfn2 biology beyond hippocampal synapses; the exact trans-synaptic partner
      remains unresolved.
core_functions:
- description: >-
