- id: Reactome:R-HSA-8849882
  title: SALMs 1-4 bind reticulon 3
  findings:
  - statement: Reactome models a relatively weak interaction of human SALM1/LRFN2
      with RTN3, in contrast to the tighter SALM2 and SALM3 associations.
    supporting_text: In the brain, reticulon 3 (RTN3) tightly associates with SALM2
      and SALM3 to form a complex, and interacts relatively weakly with SALM1 and
      SALM4.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The locally cached Reactome record was checked. Its human event is
      consistent with PMID:19681166, but the paper's experiments are family-level
      brain and heterologous-cell assays and do not establish a human-specific
      interaction or a direct trafficking function for LRFN2.
- id: Reactome:R-HSA-8849891
  title: SALMs 1-3 bind to PSD-95 family members
  findings:
  - statement: Reactome models SALM1/LRFN2 binding to DLG-family postsynaptic
      scaffolds while explicitly restricting presynaptic-induction activity to
      SALM3 and SALM5.
    supporting_text: SALM3 and SALM5, but not other SALMs, induce presynaptic
      differentiation in contacting axons (Mah et al. 2010).
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The locally cached Reactome record was checked against the primary
      SALM1 scaffold evidence in PMID:16495444 and the SALM3/SALM5 paralog boundary
      in PMID:20410109.
- id: Reactome:R-HSA-8849900
  title: SALMs1-3 bind each other in cis interactions
  findings:
  - statement: Reactome models SALM1, SALM2, and SALM3 homo- and heteromerization in
      cis, without asserting trans-cellular SALM1 adhesion.
    supporting_text: SALM1, SALM2, and SALM3 form homo- and heteromeric complexes in
      a cis manner.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The locally cached event was checked against PMID:18227064, which
      reports rat-brain and heterologous-cell complexes and explicitly found no
      trans association for SALM1-3.
- id: Reactome:R-HSA-8849906
  title: SALM1 binds NMDA receptor
  findings:
