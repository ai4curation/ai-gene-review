knowledge_gaps:
- gap_statement: >-
    The endogenous scaffold, glutamate-receptor, and trafficking partners occupied
    by LRFN2 at human pre- and postsynaptic membranes, and the requirement for its
    terminal ESTV motif in human neurons, remain unknown.
  boundary: >-
    Human LRFN2 is directly localized to the plasma membrane, and a human LRFN2 tail
    peptide directly binds SNX27. PSD-95-family, CASK, NMDA-receptor, and neuronal
    functional evidence otherwise comes principally from exact rodent orthologs or
    heterologous systems.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    Establishing the endogenous human partner hierarchy is necessary to connect the
    conserved binding activities to physiological human synapse organization.
  resolution: >-
    Use endogenous compartment-resolved tagging in human induced-pluripotent-stem-
    cell-derived neurons, compare wild type with ESTV-deleted LRFN2, and combine
    quantitative interactomics, receptor tracking, synaptic imaging, and functional
    rescue.
  provenance:
  - reference_id: PMID:34251337
    supporting_text: >-
      This established that the isolated recombinant PDZ domain of SNX27 directly bound to a synthetic peptide corresponding to the LRFN2 PDZ binding motif, S-S-E-W-V-M-E−3-S-T-V−0 with a high micromolar affinity (Kd = 1.6 µM) (Figure 2D).
    reference_section_type: RESULTS
- gap_statement: >-
    How presynaptic SALM1 couples CASK and its juxtamembrane basic region to
    F-actin/PIP2-dependent neurexin cis clustering is unresolved, including whether
    the relevant interactions are simultaneous, transient, or indirect.
  boundary: >-
    Mouse SALM1 binds CASK through its PDZ-binding tail and is required for neurexin
    clustering and presynaptic organization, but the study does not demonstrate
    direct SALM1-neurexin binding or a stable obligate SALM1-CASK-Mint1-Lin7b-
    neurexin complex.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    Resolving this linkage would define SALM1's presynaptic mechanism without
    conflating cis regulation of neurexin with a trans-synaptic ligand interaction.
  resolution: >-
    Combine endogenous CASK and SALM1 perturbations with ESTV-tail and polybasic-
    region rescue mutants, PIP2 manipulation, single-molecule neurexin clustering,
    and direct binding assays using purified cytoplasmic components.
  provenance:
  - reference_id: PMID:31368584
    supporting_text: >-
      Together, our data suggest that SALM1 organizes synapse development by promoting F‐actin/PIP2‐dependent cis‐oligomerization of Neurexin at the presynapse.
    reference_section_type: INTRODUCTION
- gap_statement: >-
    The direction and cellular basis of Lrfn2-dependent synaptic plasticity are not
    settled, and the relative contributions of excitatory versus inhibitory
    synapses differ between mouse models and brain regions.
  boundary: >-
    One knockout study reported immature hippocampal synapses and enhanced LTP,
    whereas an independent line showed suppressed NMDAR-dependent plasticity and
    region-specific inhibitory or excitatory transmission defects. These outcomes
    should not be collapsed into a single signed regulatory effect.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    A mechanistically resolved phenotype is needed before assigning a more specific
    positive or negative regulation term for plasticity or transmitter-specific
    synapse development.
  resolution: >-
    Compare conditional, cell-type-specific Lrfn2 loss and matched rescue alleles
    across hippocampal and cortical circuits using standardized development,
    receptor-composition, morphology, and electrophysiology assays.
  provenance:
  - reference_id: PMID:28604739
    supporting_text: >-
      The synapses are structurally and functionally immature with spindle shaped spines, smaller postsynaptic densities, reduced AMPA/NMDA ratio, and enhanced LTP.
    reference_section_type: ABSTRACT
  - reference_id: PMID:29798891
    supporting_text: >-
      mice lacking SALM1/LRFN2 (Lrfn2-/- mice) show a normal density of excitatory synapses but altered excitatory synaptic function, including enhanced NMDAR-dependent synaptic transmission but suppressed NMDAR-dependent synaptic plasticity in the hippocampal CA1 region.
    reference_section_type: ABSTRACT
- gap_statement: >-
    The physiological role of SALM1-containing cis homo- and heteromeric SALM
    assemblies is unknown, as is whether they regulate trafficking, membrane avidity,
    or synaptic partner selection.
  boundary: >-
    SALM1-3 co-immunoprecipitate and form same-cell complexes, but SALM1-3 did not
    form trans-cellular SALM associations in the tested assay. The evidence therefore
    does not support homophilic trans adhesion or a defined stable complex for human
    LRFN2.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    Defining the function of cis assembly would explain a conserved interaction
    while preventing inappropriate transfer of SALM4/5 trans-association mechanisms.
  resolution: >-
    Determine endogenous SALM stoichiometry and cis interfaces in neurons, then test
    interface-specific mutants that preserve folding and surface delivery for
    effects on receptor/scaffold binding, trafficking, and synaptic organization.
  provenance:
  - reference_id: PMID:18227064
    supporting_text: >-
      Both SALMs 4 and 5 formed homophilic, but not heterophilic associations, whereas no trans associations were formed by the other SALMs.
    reference_section_type: ABSTRACT
proposed_new_terms: []
suggested_questions:
- question: >-
    Which PSD-95-family, CASK-family, sorting, and glutamate-receptor partners bind
    endogenous human LRFN2 at pre- versus postsynaptic membranes, and which
    interactions require the terminal ESTV motif?
- question: >-
    What molecular bridge connects presynaptic SALM1 and CASK to
    F-actin/PIP2-dependent neurexin cis clustering without direct SALM1-neurexin
    binding?
- question: >-
    Which developmental stage, cell type, or circuit variable explains the
    divergent Lrfn2 knockout effects on hippocampal plasticity and on excitatory
    versus inhibitory transmission?
- question: >-
    Do SALM1-containing cis homo- or heteromeric assemblies regulate surface
    trafficking or partner avidity while remaining distinct from the trans-cellular
    adhesion mechanisms of SALM4 and SALM5?
- question: >-
    Which membrane side and extracellular partner account for the LRFN2-dependent
    cone-to-bipolar-cell transmission phenotype, and is this retinal role conserved
    in humans?
suggested_experiments:
- hypothesis: >-
    Human LRFN2 uses its terminal ESTV motif to recruit distinct postsynaptic
    PSD-95/SNX27 and presynaptic CASK modules that jointly support synapse
    organization and transmission.
  description: >-
    Generate isogenic human induced-pluripotent-stem-cell-derived excitatory neurons
    with endogenous LRFN2 knockout, ESTV deletion, and repaired controls. Use
    compartment-resolved proximity labeling and quantitative interactomics together
    with AMPA/NMDA receptor surface tracking, synaptic nanostructure imaging, and
    paired-neuron electrophysiology to test localization-specific rescue.
  experiment_type: Endogenous human-neuron structure-function analysis
- hypothesis: >-
    The SALM1 PDZ-binding tail and juxtamembrane polybasic region provide separable
    inputs that couple CASK and PIP2/F-actin to presynaptic neurexin clustering.
  description: >-
    Rescue LRFN2-depleted neurons with ESTV-tail, polybasic-region, and combined
    mutants expressed at matched endogenous abundance. Quantify CASK binding,
    membrane PIP2, cortical F-actin, single-molecule neurexin cluster size,
    synaptic-vesicle clustering, and neurotransmitter release; separately test
    purified components for direct interactions.
  experiment_type: Presynaptic mechanism dissection
- hypothesis: >-
    Postsynaptic SALM1 regulates NMDA- and AMPA-receptor organization through
    separable extracellular receptor association and intracellular PDZ-scaffold
    recruitment.
  description: >-
    Introduce domain-selective LRFN2 substitutions that preserve surface delivery,
    compare them with ESTV deletion in rodent and human neurons, and measure direct
    NR1 binding, PSD-95/SNX27 occupancy, receptor diffusion and surface retention,
    postsynaptic-density morphology, and AMPA/NMDA current ratios.
  experiment_type: Postsynaptic receptor-interface epistasis
- hypothesis: >-
    The divergent mouse phenotypes reflect circuit- and developmental-stage-specific
    requirements rather than opposite biochemical functions of Lrfn2.
  description: >-
    Perform matched conditional deletion and knock-in rescue in hippocampal
    excitatory neurons, hippocampal inhibitory inputs, cortical neurons, and retinal
    cone circuits. Use the same age windows and assays for receptor composition,
    synapse morphology, basal transmission, plasticity, and retinal output.
  experiment_type: Cross-circuit conditional-genetics comparison
- hypothesis: >-
    SALM1 cis oligomerization controls membrane organization but does not confer
    SALM1-mediated trans homophilic adhesion.
  description: >-
    Map endogenous cis interfaces and stoichiometry by cross-linking mass
    spectrometry and single-molecule imaging, create interface-specific mutants that
    retain folding and surface expression, and compare effects on scaffold/receptor
    recruitment, synapse organization, and quantitative cell-cell adhesion assays.
  experiment_type: Cis-assembly interface analysis
