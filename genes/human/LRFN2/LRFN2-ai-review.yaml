- term:
    id: GO:0030165
    label: PDZ domain binding
  evidence_type: IPI
  original_reference_id: PMID:34251337
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q8K4V4
  review:
    summary: The human LRFN2/SALM1 C-terminal PDZ-binding motif directly binds the
      rat SNX27 PDZ domain; ortholog studies also support binding to PSD-95-family
      scaffolds and CASK.
    action: NEW
    reason: GO:0030165 exactly captures the direct interaction measured between a
      human LRFN2 C-terminal peptide and the recombinant rat SNX27 PDZ domain by ITC.
      Exact rodent-ortholog studies independently support binding of the conserved
      terminal motif to PSD-95-family PDZ domains and CASK. This does not place
      SNX27 at the postsynaptic density or assert membership in a stable obligate
      complex.
    additional_reference_ids:
    - PMID:16828986
    - PMID:16495444
    - PMID:31368584
    supported_by:
    - reference_id: PMID:34251337
      supporting_text: This established that the isolated recombinant PDZ domain of
        SNX27 directly bound to a synthetic peptide corresponding to the LRFN2 PDZ
        binding motif, S-S-E-W-V-M-E−3-S-T-V−0 with a high micromolar affinity (Kd =
        1.6 µM) (Figure 2D).
    - reference_id: PMID:16828986
      supporting_text: C-termini of Lrfn1, Lrfn2 and Lrfn4 were bound by PDZ domains
        of postsynaptic protein PSD95, re-distributing PSD95 to cell periphery where
        the Lrfn proteins were detected.
    - reference_id: PMID:31368584
      supporting_text: Together, these data identify SALM1 as a novel binding
        partner of the CASK/Mint1/Lin7b presynaptic organizer complex, interacting
        directly with CASK, via its PDZ binding domain.
