    LRFN2/SALM1 binds PDZ domains of PSD-95-family scaffold proteins. Rodent
    ortholog studies connect this interaction to postsynaptic-density maturation,
    AMPA-receptor surface retention, chemical synaptic transmission, and
    plasticity; its endogenous operation in human neurons remains to be
    demonstrated.
