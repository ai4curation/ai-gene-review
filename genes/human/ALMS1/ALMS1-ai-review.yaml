core_functions:
- description: ALMS1 localizes to proximal centrioles and basal bodies and supports centrosome cohesion
    and normal ciliary architecture. Human depletion reduces centriolar C-Nap1 and produces stunted cilia,
    without establishing direct C-Nap1 tethering or an autonomous molecular activity. Human fibroblast
    recycling defects and interactions with actin-associated machinery support a connection to endosomal
    recycling, while an ALMS1-containing transport scaffold remains a mechanistic model.
  locations:
  - id: GO:0005814
    label: centriole
  - id: GO:0036064
    label: ciliary basal body
  supported_by:
  - reference_id: PMID:20844083
    supporting_text: ALMS1 localizes specifically to the proximal ends of centrioles and basal bodies
  - reference_id: PMID:20844083
    supporting_text: depletion of ALMS1 leads to a reduction in the level of C-Nap1 at the centrosome,
      resulting in compromised centrosome cohesion
  - reference_id: PMID:22693585
    supporting_text: the exit of Tf-Alexa 647 from the recycling compartment was significantly delayed
      in ALMS fibroblasts compared to controls
  - reference_id: PMID:40021845
    supporting_text: ALMS1 forms a ring capping the proximal end of both mother and daughter centrioles
    full_text_unavailable: false
  - reference_id: PMID:17954613
    supporting_text: the depletion of Cep57 or ALMS1 led to the formation of morphologically abnormal,
      stunted cilia without considerably reducing the efficiency of ciliogenesis
    full_text_unavailable: false
  knowledge_gaps:
  - gap_statement: The ALMS1 interaction interface and structural contribution that connect the actin-associated
      machinery to human endosomal recycling remain unresolved.
    boundary: Human transport phenotypes and cross-species physical associations support the model, but
      the inspected experiments do not connect a particular ALMS1 interface to the recycling step.
    provenance:
    - reference_id: PMID:22693585
      supporting_text: Perhaps ALMS1 is a component of the transport machinery that forms a subcomplex
        with CART subunits and facilitates the rapid movement of endosomes along the actin filaments to
        the PM.
suggested_questions:
- question: Which ALMS1 domains couple proximal centriole organization and C-Nap1 retention to ciliary
    elongation, and how are these functions separated from centriole duplication?
- question: Do ALMS1 interactions with ACTN4, MYO5B or RINT1 directly organize an endosomal recycling
    complex in human cells, and can interface-specific rescue separate recycling from centrosomal defects?
- question: Does ALMS1 promote adaptive thermogenesis through neural or endocrine control, an adipocyte-autonomous
    role, or secondary systemic effects, and which regulatory function is conserved between mouse and
    human?
