  review:
    action: UNDECIDED
    summary: The precise ALMS1–DISC1 experimental interaction record remains unverified.
    reason: The HENA paper reports experimental yeast-two-hybrid and integrated interaction data, but the
      target-specific ALMS1–DISC1 supplementary record has not been independently recovered. Generic protein
      binding is uninformative and would normally be replaced by a supported specific activity or removed
      for lack of functional information. Here the relevant experimental evidence remains unresolved, so
      the explicit source-access rule takes precedence and the annotation remains UNDECIDED. Verified paper
      identity does not verify this interaction record. This judgment neither rejects the interaction nor
      asserts that network experiments cannot inform molecular function; no specific replacement is established.
