core_functions:
- description: ALMS1 supports the organization of proximal centrioles and basal bodies and the
    normal operation of intracellular recycling. Human perturbation and localization evidence
    establish these cellular roles, but do not yet define an autonomous molecular activity or
    prove direct tethering of C-Nap1.
