    summary: Retain the cytosol location, supported by human-cell immunofluorescence.
    reason: The cached event "TPX2 promotes AURKA autophosphorylation" supplies a curated location
      assertion in a larger centrosomal/ciliary model. The current Human Protein Atlas ALMS1
      page independently reports supported cytosol staining in human cells, including two antibodies
      in U2OS. Retain this location; the event summary does not independently establish an ALMS1-specific
      assay or show that ALMS1 performs the reaction named in its title. Proximal-centriole
      imaging is not used as proof of fluid cytosol localization.
