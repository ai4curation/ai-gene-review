id: Q8TCU4
gene_symbol: ALMS1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ALMS1 is a large centrosome-associated protein concentrated at the proximal ends
  of centrioles and ciliary basal bodies. It supports centrosome cohesion and the organization
  of intracellular trafficking, including endosomal recycling. Loss of ALMS1 disrupts the localization
  of centrosome-cohesion machinery and alters transferrin recycling and actin organization in
  human cells. Its precise molecular activity and the relationship between its centriolar and
  trafficking roles remain incompletely defined. Biallelic pathogenic variants cause Alström
  syndrome, with progressive sensory, metabolic and other organ involvement.
