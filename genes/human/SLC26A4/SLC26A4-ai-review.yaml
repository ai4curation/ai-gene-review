  review:
    summary: Phylogenetic (IBA) sulfate transporter activity from node PTN000929279,
      seeded by animal and fungal sulfate permeases where sulfate is the ancestral cargo.
    action: REMOVE
    reason: Target-specific evidence of divergence/loss. Pendrin was directly tested and
      does NOT transport sulfate; it transports chloride and iodide only. The sulfate IBD
      node (PTN000929279) is the deeper opisthokont SulP clade. Its seeds include several
      paralogs that sit with pendrin in the vertebrate SLC26 radiation (PTN002273826),
      among them SLC26A2, SLC26A6, SLC26A7 and SLC26A8, so the node placement is sound and
      the metazoan branch as a whole did not lose sulfate cargo. The loss is specific to
      the pendrin clade (PTN002624472, the vertebrate SLC26A4 orthologs), which has no
      sulfate seed and whose human member tested negative. The PANTHER PTHR11814 family
      review assesses the sulfate node as SOUND without a pendrin exception, and PAINT has
      not recorded a loss on this lineage; a loss on the pendrin clade is warranted (see
      notes file).
    supported_by:
    - reference_id: PMID:10192399
      supporting_text: chloride and iodide, but not sulfate
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN000929279
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Opisthokont SulP sulfate-transporter node seeded by fungal sulfate
          permeases and by several vertebrate paralogs (SLC26A2, SLC26A6, SLC26A7,
          SLC26A8); sulfate cargo was lost in the pendrin clade PTN002624472, not in the
          whole chloride/bicarbonate exchanger branch.
