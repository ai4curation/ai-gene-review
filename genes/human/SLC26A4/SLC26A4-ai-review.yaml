id: O43511
gene_symbol: SLC26A4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Pendrin (SLC26A4) is a sodium-independent, electroneutral anion exchanger
  of the SLC26A/SulP transporter family, with a multi-pass transmembrane domain and a
  C-terminal cytoplasmic STAS domain. It resides in the apical plasma membrane of
  polarized epithelia and exchanges chloride for bicarbonate, iodide, or formate with
  1:1 stoichiometry. In the thyroid follicular cell it drives apical iodide efflux into
  the follicle lumen, supplying iodide for thyroid hormone synthesis. In the kidney
  cortical collecting duct it mediates apical chloride/bicarbonate exchange in
  non-A (type B) intercalated cells, underlying renal bicarbonate secretion, chloride
  reabsorption and acid-base homeostasis. In the inner ear it contributes to endolymph
  ion and pH homeostasis required for hearing. Despite its sequence relationship to
  sulfate transporters, pendrin does not transport sulfate. Biallelic loss-of-function
  causes Pendred syndrome (sensorineural deafness, goiter, enlarged vestibular aqueduct)
  and nonsyndromic recessive deafness DFNB4.
