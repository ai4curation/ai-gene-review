core_functions:
- molecular_function:
    id: GO:0098882
    label: structural constituent of presynaptic active zone
  description: >-
    RIMBP2 is a core structural scaffold of the presynaptic active zone, containing
    three SH3 domains and three FN3 domains that mediate multivalent interactions
    with
    RIM proteins, Munc13-1, Bassoon, and voltage-gated calcium channels. This scaffolding
    function organizes the molecular machinery required for synaptic vesicle release.
