id: O15034
gene_symbol: RIMBP2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  RIMS-binding protein 2 (RIM-BP2) is a presynaptic active-zone scaffold with three SH3 and three fibronectin
  type III domains. It organizes calcium-channel positioning relative to synaptic vesicle release sites
  and promotes vesicle priming through the RIM/Munc13 machinery. Studies of mammalian RIM-BP2 show synapse-dependent
  contributions: calcium-secretion coupling at hippocampal CA3-CA1 synapses, stabilization of Munc13-1
  and vesicle docking/priming at mossy-fiber synapses, and channel organization at auditory ribbon synapses.
existing_annotations:
- term:
    id: GO:0007274
    label: neuromuscular synaptic transmission
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: >-
      The historical neuromuscular-transmission IBA is biologically plausible through conserved RIM-BP
      presynaptic function, but its specific vertebrate context remains unresolved. The current human
      QuickGO record instead carries broader presynaptic annotations.
    action: UNDECIDED
    reason: >-
      GO:0007274 describes transmission from neuron to muscle; it does not require exclusive function
      at neuromuscular junctions. Mammalian central/ribbon-synapse function therefore does not refute
      this IBA. The OpenScientist investigation documents fly neuromuscular evidence, mammalian coupling
      mechanisms, and no identified experiment refuting a mammalian neuromuscular role. Its conclusion
      that missing mammalian experiments alone precludes phylogenetic transfer is not sufficient: inheritance
      depends on the ancestral assertion and evidence of conservation or divergence. The historical PTN002306629
      node is absent from the refreshed PTHR14234 PAINT slice, and a direct QuickGO query confirms that
      human O15034 no longer carries GO:0007274. This establishes a snapshot difference, not proof of
      biological loss. Retain UNDECIDED for the historical assertion pending resolution of its context-specific
      phylogenetic placement. Skeletal-muscle expression is not a useful exclusion test for a presynaptic
      protein made in motor neurons.
    propagation_review:
      root_cause: UNRESOLVED
      source_entities:
      - source_id: PANTHER:PTN002306629
        source_status: SOURCE_STALE_OR_MISSING
        comment: Historical PAINT node from the reviewed GOA row, absent from the refreshed
          PTHR14234 PAINT slice. Current O15034 QuickGO annotations omit GO:0007274; neither
          observation establishes loss of neuromuscular function.
    supported_by:
    - reference_id: PMID:27671655
      supporting_text: >-
        Still, the importance of RIM-BPs for STP is conserved between flies and mammals
    - &id003
      reference_id: PMID:31535974
      supporting_text: >-
        at hippocampal mossy fiber synapses, RIM-BP2 has a substantial impact on neurotransmitter release
        by promoting vesicle docking/priming and vesicular release probability via stabilization of Munc13-1
        at the active zone.
    - reference_id:
        file:human/RIMBP2/RIMBP2-hypotheses/function-hypothesis-go-0007274/openscientist.md
      supporting_text: a vertebrate NMJ role remains formally untested rather than disproven
- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  review:
    summary: >-
      RIMBP2 associates with the synaptic plasma membrane as part of the presynaptic active-zone scaffold.
    action: ACCEPT
    reason: >-
      The broad cellular-component annotation is supported by the curated UniProt subcellular location
      and mammalian active-zone localization. It does not imply uniform localization across the entire
      plasma membrane. The more specific active-zone annotation can coexist with this correct parent-level
      location.
    supported_by:
    - reference_id: UniProt:O15034
      supporting_text: Note=Synaptic plasma membrane
    - &id001
      reference_id: PMID:27671655
      supporting_text: >-
        Together, these results indicate that RIM-BP2 is part of the presynaptic AZ scaffold and forms
        a complex with the priming factors RIM and Munc13-1.
