    - *id001
- term:
    id: GO:0048786
    label: presynaptic active zone
  evidence_type: ISS
  original_reference_id: DOI:10.1073/pnas.1605256113
  review:
    summary: >-
      Mammalian RIM-BP2 is part of the presynaptic active-zone scaffold.
    action: NEW
    reason: >-
      Super-resolution microscopy and complex analysis in mouse hippocampal synapses establish active-zone
      localization. Transfer to the conserved human RIMBP2 ortholog is appropriate; the evidence is on
      the mouse protein rather than a direct human localization experiment.
    supported_by:
    - *id002
    - *id001
- term:
    id: GO:0098882
    label: structural constituent of presynaptic active zone
  evidence_type: ISS
  original_reference_id: DOI:10.1016/j.celrep.2020.107960
  review:
    summary: >-
      RIMBP2 contributes structural scaffolding to the presynaptic active zone.
    action: NEW
    reason: >-
      RIMBP2 forms an active-zone complex with RIM and Munc13-1 and organizes calcium channels relative
      to vesicle release sites. The spatial and functional evidence supports structural-constituent activity
      by orthology from mammalian RIM-BP2, beyond a generic interaction annotation.
    supported_by:
    - *id001
- term:
    id: GO:0010808
    label: positive regulation of synaptic vesicle priming
  evidence_type: ISS
  original_reference_id: DOI:10.7554/eLife.43243
  review:
    summary: >-
      RIMBP2 promotes synaptic vesicle priming through stabilization of Munc13-1 at mossy-fiber active
      zones.
    action: NEW
    reason: >-
      The mouse study links RIMBP2 to Munc13-1 positioning and stabilization and to vesicle docking/priming.
      This is a mechanistic scaffold contribution to priming, not merely a downstream transmission phenotype.
      Transfer to human RIMBP2 is an ortholog inference, and the magnitude of this role depends on synapse
      type.
    supported_by:
    - *id003
