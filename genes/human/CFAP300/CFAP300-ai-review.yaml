    - reference_id: PMID:29727692
- term:
    id: GO:0005930
    label: axoneme
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  review:
    summary: Human airway imaging supports axonemal localization without establishing stable
      structural incorporation.
    action: ACCEPT
    reason: GO:0005930 includes proteins associated with the ciliary microtubule core; it
      does not require a constitutive or detergent-insoluble structural subunit. PMID:36246608,
      Immunofluorescence Methods, Figure 4 and its Results, directly detects endogenous CFAP300
