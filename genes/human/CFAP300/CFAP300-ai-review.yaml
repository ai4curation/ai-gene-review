core_functions:
- description: Acts as a DNAAF2-associated accessory factor in outer and inner dynein-arm
    assembly. Selective human arm defects, conserved perturbation phenotypes and partner
    interaction support participation in the assembly machinery. The protein is predominantly
    cytoplasmic with a small ciliary pool; the specific molecular activity and relative
    contributions to cytoplasmic preassembly versus delivery remain unresolved. Its
    own IFT-dependent localization does not establish a dynein-cargo adaptor mechanism.
  proposed_molecular_function: axonemal dynein preassembly factor activity
  directly_involved_in:
  - id: GO:0036158
    label: outer dynein arm assembly
  - id: GO:0036159
    label: inner dynein arm assembly
  locations:
  - id: GO:0005737
    label: cytoplasm
  supported_by:
  - reference_id: PMID:29727693
    supporting_text: C11orf70 is involved in cytoplasmic assembly of dynein arms
  - reference_id: PMID:29727692
    supporting_text: assembly of dynein arms
  - reference_id: PMID:36246608
    supporting_text: crucial role of CFAP300 in dynein arm preassembly and transport
      to motile cilia
  - reference_id: file:human/CFAP300/CFAP300-source-evidence.json
proposed_new_terms:
- proposed_name: axonemal dynein preassembly factor activity
  proposed_definition: A molecular function that promotes cytoplasmic preassembly,
    stabilization, or maturation of axonemal dynein arm complexes before their
    delivery to the ciliary axoneme, without necessarily catalyzing a known chemical
    reaction or remaining as part of the assembled motor.
  justification: CFAP300 and other DNAAF proteins are annotatable to dynein-arm
    assembly processes and to generic protein binding, but GO lacks a molecular-function
    term for the accessory factor activity that acts on soluble dynein-arm assembly
    intermediates. A specific term would allow reviews to represent this MF-dark
    activity without pretending that the biochemical mechanism is already known.
  proposed_parent:
    id: GO:0003674
    label: molecular_function
  supported_by:
  - reference_id: PMID:29727693
    supporting_text: C11orf70 is involved in cytoplasmic assembly of dynein arms
  - reference_id: PMID:29727692
    supporting_text: assembly of dynein arms
suggested_questions:
- question: Does CFAP300 stabilize or assemble a defined dynein intermediate, or mainly
    enable its subsequent delivery? Existing association and localization assays do
    not separate these roles.
- question: Which CFAP300 product was used in the original interaction assays, and
    how do the three current UniProt products differ in localization or function?
    The historical review lacks product entries and the original assay accession/version
    remains unresolved.
- question: Can the original GOA IPI linkage to PMID:29727692 be clarified, given
    the directly inspected DNAAF2 interaction in PMID:29727693?
suggested_experiments:
- description: Measure dynein intermediate composition and ciliary entry separately
    in CFAP300-deficient human airway cultures rescued with defined CFAP300 products
    and DNAAF2-interaction mutants.
  hypothesis: CFAP300-dependent assembly or stabilization can be separated from a
    later delivery defect.
- description: Test purified CFAP300 and DNAAF2 with defined dynein clients and appropriate
    binary-binding controls, then compare rescue activity in cells.
  hypothesis: A defined client or cofactor activity can explain the assembly phenotype
    without assuming a generic scaffold or chaperone mechanism.
knowledge_gaps:
- gap_statement: Which molecular activity does CFAP300 perform within the DNAAF2-associated
    assembly pathway, and at which step does it act?
  boundary: Human and model-organism perturbations cause selective outer/inner dynein-arm
    defects; DNAAF2 association is directly supported. Human imaging and tagged ortholog
    fractionation establish predominantly cytoplasmic localization with a small ciliary
    pool. These data support an accessory assembly role but do not distinguish a chaperone,
    scaffold, other cofactor, or delivery mechanism. No reconstituted dynein-cargo
    bridge or universal requirement for every axonemal motor is established.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: Resolving the performed molecular step would justify a specific MF
    without conflating an assembly phenotype with catalysis or cargo transport.
  resolution: Combine defined CFAP300–DNAAF2 and dynein-subunit assays with separation-of-function
    rescue in differentiated human airway cells; measure soluble assembly intermediates
    and ciliary entry independently.
  provenance:
  - reference_id: PMID:29727692
  - reference_id: PMID:29727693
  - reference_id: PMID:30916986
  - reference_id: PMID:36246608
status: DRAFT
