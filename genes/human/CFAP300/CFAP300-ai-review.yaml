  original_reference_id: PMID:29727692
  review:
    summary: Retain the prior outer-dynein-arm assembly proposal with a bounded accessory-factor
      mechanism.
    action: NEW
    reason: Human CFAP300 variants selectively disrupt outer dynein arms and their
      axonemal markers in PMID:29727692 and PMID:29727693. This necessity evidence
      is joined by the direct DNAAF2 interaction assays in PMID:29727693, positioning
      CFAP300 as an accessory component of the assembly machinery rather than merely
      an assembled motor substrate. The assignment is a combined inference of assembly-factor
      participation, not purified catalytic activity or proof of dynein cargo carriage.
      Same-role DNAAF1, DNAAF2 and DNAAF3 carry assembly annotations; current typed
      parents and the fixed-main GO-CAM index reveal no convention excluding this
      role or conflicting CFAP300 model. Retain the specific outer-arm proposal and
      withdraw the redundant authored parent GO:0070286.
