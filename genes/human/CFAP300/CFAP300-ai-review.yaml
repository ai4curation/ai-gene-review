- id: PMID:36246608
  title: CFAP300 mutation causing primary ciliary dyskinesia in Finland.
  full_text_unavailable: false
  findings:
  - statement: Endogenous human nasal epithelial immunostaining and Airyscan imaging show
      a predominantly cytoplasmic distribution plus CFAP300 along ciliary axonemes; patient
      signal is strongly depleted. This supports the retained axoneme localization at the
      resolution of the assay.
    supporting_text: small amount of CFAP300 along the ciliary length
    reference_section_type: DISCUSSION
  - statement: The CFAP300 antibody recognizes residues 113–188, and the authors consider
      a short product as a possible source of residual patient staining. The assay does not
      establish isoform-specific transport or stable incorporation into an axonemal structural
      complex.
  - statement: Patient cilia lose dynein-arm components while retaining the basic microtubule
      arrangement. The authors treat basal-foot disorientation as potentially secondary to
      immotility; neither fixed-cell localization nor this phenotype directly measures cargo
      carriage.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected full Methods, Results, Discussion and Figures 2/4 were read; Figure
      4 pixels independently inspected. Human nasal epithelial antibody imaging supports cytoplasmic
      and ciliary localization. The epitope spans residues 113–188; the authors discuss possible
      residual short-isoform signal. Fixed-cell puncta do not demonstrate dynamic cargo transport,
      and basal-foot disorientation is discussed as potentially secondary to immotility.
