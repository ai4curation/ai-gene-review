      they do not negate the human localization or exclude association with axonemal structures.
      The previous refinement to the already present motile-cilium term applied an unnecessarily
      strict structural-membership test. Retain the axoneme assertion while leaving residence
      time, direct microtubule contact and dynamic cargo carriage unresolved.
