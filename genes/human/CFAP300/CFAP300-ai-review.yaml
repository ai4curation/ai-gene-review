gene_symbol: CFAP300
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CFAP300 (C11orf70; also called DNAAF17) is a conserved accessory factor
  for the assembly of outer and inner axonemal dynein arms in motile cilia and sperm
  flagella. It associates with the assembly factor DNAAF2 and is predominantly cytoplasmic,
  with a smaller ciliary pool. Human biallelic loss-of-function variants cause primary
  ciliary dyskinesia with dynein-arm defects, impaired ciliary motility and, in some
  individuals, laterality abnormalities or male infertility. Experiments in Paramecium
  and Chlamydomonas show that the ciliary distribution of CFAP300 orthologs depends
  on intraflagellar transport. The precise molecular activity and the division of
  its contribution between dynein preassembly and delivery remain unresolved.
