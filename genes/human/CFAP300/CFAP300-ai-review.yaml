    summary: Cytoplasmic localization is directly corroborated in human airway epithelial
      cells.
    action: ACCEPT
    reason: The UniProt subcellular-location mapping is consistent with the predominant
      cytoplasmic pool detected by CFAP300 immunostaining in control human nasal epithelial
