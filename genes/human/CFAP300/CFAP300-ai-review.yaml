core_functions:
- description: Acts as a DNAAF2-associated accessory factor in outer and inner dynein-arm
    assembly. Selective human arm defects, conserved perturbation phenotypes and partner interaction
    support participation in the assembly machinery. The protein is predominantly cytoplasmic
    with a small ciliary pool; the specific molecular activity and relative contributions
    to cytoplasmic preassembly versus delivery remain unresolved. Its own IFT-dependent localization
    does not establish a dynein-cargo adaptor mechanism.
  directly_involved_in:
  - id: GO:0036158
    label: outer dynein arm assembly
  - id: GO:0036159
    label: inner dynein arm assembly
  locations:
  - id: GO:0005737
    label: cytoplasm
  supported_by:
  - reference_id: PMID:29727693
    supporting_text: C11orf70 is involved in cytoplasmic assembly of dynein arms
  - reference_id: PMID:29727692
  - reference_id: PMID:36246608
  - reference_id: file:human/CFAP300/CFAP300-source-evidence.json
proposed_new_terms: []
suggested_questions:
- question: Does CFAP300 stabilize or assemble a defined dynein intermediate, or mainly enable
    its subsequent delivery? Existing association and localization assays do not separate
    these roles.
- question: Do the three human CFAP300 products differ in dynein-intermediate association,
    cytoplasmic assembly-site residence or ciliary entry, and which differences are required
    for motile-cilium function?
- question: Does endogenous CFAP300 participate in cytoplasmic dynein-assembly particles (DynAPs),
    and does its interaction with DNAAF2 alter client assembly or residence rather than merely
    sharing the same compartment?
suggested_experiments:
- description: Measure dynein intermediate composition and ciliary entry separately in CFAP300-deficient
    human airway cultures rescued with defined CFAP300 products and DNAAF2-interaction mutants.
  hypothesis: CFAP300-dependent assembly or stabilization can be separated from a later delivery
    defect.
- description: Test purified CFAP300 and DNAAF2 with defined dynein clients and appropriate
    binary-binding controls, then compare rescue activity in cells.
  hypothesis: A defined client or cofactor activity can explain the assembly phenotype without
    assuming a generic scaffold or chaperone mechanism.
- description: Test whether endogenously tagged CFAP300 is enriched with DNAAF2 and dynein
    clients in cytoplasmic dynein-assembly particles (DynAPs) in differentiated human airway
    cultures. Compare wild-type and interaction-disrupting rescue constructs, measuring local
    residence dynamics, dynein intermediate composition and subsequent ciliary entry separately.
  hypothesis: If CFAP300 performs an assembly-site cofactor role, its interaction with DNAAF2
    should affect a defined client intermediate or residence behavior; colocalization alone
    would not establish that activity.
knowledge_gaps:
- gap_statement: Which molecular activity does CFAP300 perform within the DNAAF2-associated
    assembly pathway, and at which step does it act?
  boundary: Human and model-organism perturbations cause selective outer/inner dynein-arm
    defects; DNAAF2 association is directly supported. Human imaging and tagged ortholog fractionation
    establish predominantly cytoplasmic localization with a small ciliary pool. These data
    support an accessory assembly role but do not distinguish a chaperone, scaffold, other
    cofactor, or delivery mechanism. No reconstituted dynein-cargo bridge or universal requirement
    for every axonemal motor is established. MF_DARK here records biological uncertainty about
    the performed molecular activity, not an established activity for which GO is known to
    lack a term. DNAAF2 association does not by itself demonstrate selective bridging of two
    clients, protein-folding assistance or a preassembly-specific reaction.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: Identifying the molecular step would determine whether an existing MF applies
    or an ontology proposal is warranted. An assembly-factor process role alone does not establish
    a missing MF, and the unresolved preassembly-versus-delivery distinction prevents defining
    a preassembly-specific activity for CFAP300.
  resolution: Combine defined CFAP300–DNAAF2 and dynein-subunit assays with separation-of-function
    rescue in differentiated human airway cells; measure soluble assembly intermediates and
    ciliary entry independently.
  provenance:
  - reference_id: PMID:29727692
  - reference_id: PMID:29727693
  - reference_id: PMID:30916986
  - reference_id: PMID:36246608
status: DRAFT
