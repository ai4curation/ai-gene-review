- id: PMID:29727692
  title: C11orf70 Mutations Disrupting the Intraflagellar Transport-Dependent Assembly of
    Multiple Axonemal Dyneins Cause Primary Ciliary Dyskinesia.
  findings:
  - statement: Human CFAP300 variants cause respiratory-cilium motility defects with both
      outer and inner dynein-arm loss; patient phenotype and microscopy establish necessity
      but not the performed molecular step.
    supporting_text: combined loss
    reference_section_type: ABSTRACT
  - statement: Tagged native Paramecium and Chlamydomonas orthologs are predominantly cytoplasmic,
      with a small ciliary pool; full Figure 3 fractionation places this pool in soluble membrane/matrix
      material. These are ortholog constructs, not a direct human assay.
    supporting_text: localizes mainly in the cytoplasm
    reference_section_type: ABSTRACT
  - statement: IFT139/TTC21B and FLA10 perturbations alter the ciliary distribution of CFAP300
      orthologs. The experiment follows the factor itself rather than directly showing it
      carrying a dynein complex.
    supporting_text: IFT dependent
    reference_section_type: ABSTRACT
  - statement: Paramecium ortholog knockdown reduces dynein arms, beating and swimming. Its
      conserved accessory-factor role is supported, while preassembly, stabilization and delivery
      remain experimentally distinguishable possibilities.
  - statement: During ciliogenesis the tagged model-organism factor accumulates at ciliary
      tips with a distribution resembling IFT46. The endpoint supports the factor’s own trafficking
      and does not by itself establish a dynein-cargo bridge.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Authentic UCL author manuscript was read at selected localization, fractionation,
      RNAi and IFT Methods/Results (Figures 3–5). Human patient arm defects are distinct from
      Paramecium/Chlamydomonas tagged-ortholog localization. The exact historical IPI/DNAAF2
      attribution to this PMID remains unresolved; independently supporting interaction experiments
      are in PMID:29727693. The unchanged repository cache is abstract-only, but primary full
      text was accessible externally.
  full_text_unavailable: false
- id: PMID:29727693
  title: Mutations in C11orf70 Cause Primary Ciliary Dyskinesia with Randomization of Left/Right
    Body Asymmetry Due to Defects of Outer and Inner Dynein Arms.
  findings:
  - statement: Human loss-of-function variants cause outer- and inner-dynein-arm defects in
      respiratory cilia and sperm flagella, supporting the inherited assembly-process proposals
      together with the interaction evidence.
  - statement: DNAAF2 association is supported by the target yeast-two-hybrid assay and tagged
      co-immunoprecipitation in Figure S12/Table S2. The inspected text does not resolve the
      exact modern CFAP300 product or co-IP host.
    supporting_text: interaction with cytoplasmic ODA/IDA assembly factor DNAAF2
    reference_section_type: ABSTRACT
  - statement: IFT46 and PIH1D3 yeast candidates showed autoactivation and were not recovered
      in the tested co-immunoprecipitations; these controls do not establish a CFAP300 bridge
      to IFT machinery.
  - statement: Expression increases during ciliogenesis and the authors propose a preassembly
      role. Association and selective arm defects support assembly-factor participation, but
      no specific chaperone, scaffold or catalytic reaction was reconstructed.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Authentic complete article and supplement were read at the interaction Results/Methods,
      patient dynein-arm assays, Figure S12 and Table S2. DNAAF2 is positive; PIH1D3/IFT46
      autoactivation and negative co-IP controls prevent a direct IFT-bridge claim. Clones
      were sequence-checked against RefSeq, but the inspected material does not identify the
      co-IP host or exact construct accession/version; no modern isoform is assigned. The
      unchanged cache is abstract-only despite external full-primary access.
  full_text_unavailable: false
