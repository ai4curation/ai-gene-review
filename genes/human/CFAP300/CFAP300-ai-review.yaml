- id: PMID:29727692
  title: C11orf70 Mutations Disrupting the Intraflagellar Transport-Dependent Assembly
    of Multiple Axonemal Dyneins Cause Primary Ciliary Dyskinesia.
  findings:
  - statement: CFAP300 is required for assembly of dynein arms.
    supporting_text: In summary, C11orf70 is essential for assembly of dynein arms
      and C11orf70 mutations cause defective cilia motility and PCD.
  - statement: CFAP300 orthologs are mostly cytoplasmic, with a smaller ciliary
      component.
    supporting_text: Tagged C11orf70 in Paramecium and Chlamydomonas localizes mainly
      in the cytoplasm with a small amount in the ciliary component.
  - statement: Affected children show combined loss of inner and outer dynein arms.
    supporting_text: immotile respiratory cilia displaying combined loss of inner
      and outer dynein arms
  - statement: CFAP300 accumulates at ciliary tips during ciliogenesis.
    supporting_text: During ciliogenesis, C11orf70 accumulates at the ciliary tips
      in a similar distribution to the IFT-B protein IFT46.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Authentic UCL author manuscript was read at selected localization,
      fractionation, RNAi and IFT Methods/Results (Figures 3–5). Human patient arm
      defects are distinct from Paramecium/Chlamydomonas tagged-ortholog localization.
      The exact historical IPI/DNAAF2 attribution to this PMID remains unresolved;
      independently supporting interaction experiments are in PMID:29727693. The unchanged
