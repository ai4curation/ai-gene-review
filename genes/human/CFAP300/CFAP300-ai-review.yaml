  review:
    summary: Cytoplasmic localization is directly corroborated in human airway epithelial
      cells.
    action: ACCEPT
    reason: The UniProt subcellular-location mapping is consistent with the predominant cytoplasmic
      pool detected by CFAP300 immunostaining in control human nasal epithelial cells (PMID:36246608,
      Figures 2D and 4); signal is markedly depleted in cells carrying truncating CFAP300
      variants. Tagged native orthologs in Paramecium and Chlamydomonas independently show
      predominantly cytoplasmic localization (PMID:29727692, Figure 3). This localization
      supports its assembly-factor context without itself establishing a chaperone reaction.
