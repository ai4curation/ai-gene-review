- id: file:human/UBAC2/UBAC2-hypotheses/function-hypothesis-go-0004252/openscientist.md
  title: OpenScientist hypothesis investigation - UBAC2 serine-type endopeptidase activity
  publication_type: DEEP_RESEARCH
  findings:
  - statement: OpenScientist refuted the UBAC2 GO:0004252 serine-type endopeptidase activity hypothesis
      and recommended removing the propagated IBA annotation.
    supporting_text: UBAC2 does not have serine-type endopeptidase activity (GO:0004252). The annotation
      should be removed.
  - statement: The report traced the incorrect IBA to phylogenetic transfer from active rhomboid proteases
      to a catalytically inactive rhomboid pseudoprotease.
    supporting_text: The IBA (Inferred from Biological Ancestor) annotation originated from PANTHER phylogenetic
      propagation (GO_REF:0000033), which incorrectly transferred serine endopeptidase activity from active
      rhomboid proteases to UBAC2 based on family membership alone.
  - statement: The report identifies a GSSG motif only at residues 6-9, outside annotated membrane spans,
      and no membrane catalytic histidine; primary PMID:23297223 independently calls UBAC2 an ER-resident
      rhomboid pseudoprotease. This supports loss of proteolysis while trafficking and ER-phagy remain
      valid.
    supporting_text: No GxSG motif exists within the three transmembrane segments of UBAC2
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: 'The catalytic-loss conclusion is supported by primary evidence and the cached sequence/topology.
      Do not adopt the report''s unverified assertion that PANTHER topology itself is wrong, its treatment
      of PMID:23297223 as the original IBA reference (GOA cites GO_REF:0000033), or its proposed GO:0140318
      ER-phagy label: QuickGO identifies that ID as protein transporter activity.'
