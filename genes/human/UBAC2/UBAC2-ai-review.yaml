- term:
    id: GO:0004252
    label: serine-type endopeptidase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: UBAC2 belongs to the rhomboid superfamily but is a catalytically inactive pseudoprotease;
      the UniProt record and ERAD literature describe it as a rhomboid pseudoprotease lacking the
      serine-protease catalytic dyad. This IBA is propagated from the active-rhomboid branch of
      the phylogenetic tree and is biologically incorrect for UBAC2.
    action: REMOVE
    reason: UBAC2 is explicitly characterized as an ER-resident rhomboid pseudoprotease in PMID:23297223.
      The OpenScientist sequence audit finds the only GxSG-like motif outside the three annotated
      membrane spans and no membrane catalytic histidine, supporting target-specific loss of the
      rhomboid catalytic machinery. This contradicts inherited serine endopeptidase activity without
      excluding its nonproteolytic ER functions.
