core_functions:
- description: 'TLR10 is an inhibitory Toll-like receptor: engagement of this transmembrane receptor (or
    its heterodimerisation with TLR2) suppresses MyD88- and TRIF-dependent TLR signaling and downstream
    cytokine and type I interferon production in monocytes, pDCs and B cells.'
  molecular_function:
    id: GO:0004888
    label: transmembrane signaling receptor activity
  directly_involved_in:
  - id: GO:0034122
    label: negative regulation of toll-like receptor signaling pathway
  - id: GO:0030889
    label: negative regulation of B cell proliferation
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:27022193
    supporting_text: These results demonstrate that TLR10 functions as a broad negative regulator of TLR
      signaling
  - reference_id: PMID:25288745
    supporting_text: We demonstrate that TLR10 is a modulatory receptor with mainly inhibitory effects
  - reference_id: PMID:27956526
    supporting_text: We have found that Ab-mediated engagement of TLR10 on primary human B cells suppresses
      B cell proliferation, cytokine production, and signal transduction
  - reference_id: PMID:38995177
    supporting_text: Our data provide the (to our knowledge) first evidence that TLR10 is constitutively
      expressed on the surface of human pDCs and works as a regulator of their innate response
- description: TLR10 binds TLR2, forming TLR2:TLR10 heterodimers that sense TLR1-type (triacylated lipopeptide)
    ligands and recruit MyD88 but do not activate NF-kappaB, which allows TLR10 to compete with and inhibit
    TLR2-driven responses.
  molecular_function:
    id: GO:0035663
    label: Toll-like receptor 2 binding
  directly_involved_in:
  - id: GO:0034122
    label: negative regulation of toll-like receptor signaling pathway
  supported_by:
  - reference_id: PMID:20348427
    supporting_text: TLR10 requires TLR2 for innate immune recognition, and these receptors colocalize
      in the phagosome and physically interact in an agonist-dependent fashion
  - reference_id: PMID:20348427
    supporting_text: However, TLR10, alone or in cooperation with TLR2, fails to activate typical TLR-induced
      signaling, including NF-kappaB-, IL-8-, or IFN-beta-driven reporters
  - reference_id: PMID:25288745
    supporting_text: cotransfection in human cell lines showed that TLR10 acts as an inhibitory receptor
      when forming heterodimers with TLR2
suggested_questions:
- question: PAINT places toll-like receptor signaling pathway, lipopeptide binding and cellular response
    to bacterial lipopeptide at nodes that include TLR10. Given that TLR10 fails to activate NF-kappaB
    and acts mainly as a negative regulator, should PAINT record a divergence for TLR10 at the signaling-pathway
    node, or is the generic pathway term acceptable for a receptor that transduces an inhibitory signal?
- question: Reactome models TLR10 with TLR5 as an activating receptor for MyD88-IRAK4-IRAK1/2-TRAF6 reactions
    (e.g. R-HSA-975866, R-HSA-975873). Is there direct evidence for TLR10-driven IRAK activation, or should
    these reactions be revised in light of the inhibitory data?
- question: What is the physiological ligand of TLR10? Lipopeptides (with TLR2), dsRNA (endosomal), HIV-1
    gp41 and influenza RNP have each been proposed from single laboratories; none has been confirmed by
    direct binding measurements from an independent group.
- question: Does GO need a molecular function term for an inhibitory pattern recognition receptor, i.e.
    a receptor that binds a PAMP and transmits a signal that suppresses innate immune activation, analogous
    to how GO:0038187 is defined for activating receptors?
- question: Antibody-mediated TLR10 engagement suppressed virus-induced IFN-alpha, IFN-lambda and
    TNF-alpha in primary human pDCs (PMID:38995177). Should TLR10 carry GO:0032687 negative regulation
    of interferon-alpha production, or is surrogate-agonist antibody engagement insufficient without
    an identified physiological ligand?
suggested_experiments:
- description: Generate TLR10-knockout primary human B cells and monocytes (CRISPR RNP) and measure responses
    to TLR2/1, TLR4, TLR7 and TLR9 agonists and to B-cell receptor stimulation, comparing to the antibody-engagement
    and transgenic-mouse data.
  hypothesis: Loss of endogenous TLR10 in human cells enhances responses to other TLR agonists, confirming
    the negative-regulator role without relying on antibodies or overexpression.
  experiment_type: CRISPR knockout in primary human cells
- description: Measure direct binding of purified TLR10 ectodomain (alone and with TLR2) to Pam3CSK4,
    dsRNA and HIV-1 gp41 by SPR or ITC, and solve a TLR10 ectodomain structure with any confirmed ligand.
  hypothesis: At least one proposed ligand binds TLR10 directly with physiologically relevant affinity.
  experiment_type: biophysical binding assay / structural biology
