id: Q9BXR5
gene_symbol: TLR10
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'TLR10 is a type I transmembrane receptor of the Toll-like receptor family, most closely
  related to TLR1 and TLR6 and encoded in the same TLR6-TLR1-TLR10 cluster; it is functional in humans
  but is a disrupted pseudogene in mice. It is expressed mainly in B cells, plasmacytoid dendritic cells
  and monocytes, on the cell surface and in endosomes. Like TLR1 it heterodimerises with TLR2, senses
  triacylated lipopeptides through TLR2 and recruits MYD88 through its TIR domain, but unlike other TLRs
  it largely fails to activate NF-kappaB. Instead TLR10 acts mainly as an inhibitory receptor: it dampens
  proinflammatory and type I interferon responses to other TLR agonists (MyD88- and TRIF-dependent), in
  part by competing for TLR2 or ligand and by PI3K/Akt-driven IL-1 receptor antagonist production; it
  suppresses B cell proliferation and antibody responses cell-intrinsically, restrains monocyte-to-dendritic-cell
  differentiation, and in pDCs induces STAT3/SOCS3 and blocks IRF7 nuclear translocation. Proposed ligands
  include lipopeptides, double-stranded RNA and HIV-1 gp41, and some studies report activating roles in
  viral and Listeria infection.'
