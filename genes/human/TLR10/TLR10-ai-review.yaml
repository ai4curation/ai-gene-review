  review:
    summary: PAINT IBA for toll-like receptor signaling pathway (TLR node PTN002808083).
    action: KEEP_AS_NON_CORE
    reason: 'TLR10 is a TLR-family receptor that recruits MyD88 and, when engaged, initiates intracellular
      signaling, so the general term is not wrong. But the target-specific evidence departs from the positive-signaling
      function inherited at this node: TLR10 alone or with TLR2 fails to activate NF-kappaB, IL-8 or IFN-beta
      reporters, and gain- and loss-of-function studies (transfected U937 cells, TLR10 transgenic mice,
      blocking and cross-linking antibodies in primary human cells) show it suppresses both MyD88- and
      TRIF-dependent TLR responses. A minority of studies report positive sensing roles (influenza, Listeria,
      HIV-1 gp41). The term is kept as non-core; the core role is better captured by negative regulation
      of toll-like receptor signaling pathway.'
    supported_by:
    - reference_id: PMID:15728506
      supporting_text: by using a recombinant CD4TLR10 molecule we also demonstrated that TLR10 directly
        associates with MyD88
    - reference_id: PMID:20348427
      supporting_text: However, TLR10, alone or in cooperation with TLR2, fails to activate typical TLR-induced
        signaling, including NF-kappaB-, IL-8-, or IFN-beta-driven reporters
    - reference_id: PMID:27022193
      supporting_text: These results demonstrate that TLR10 functions as a broad negative regulator of
        TLR signaling
    - reference_id: PMID:24567377
      supporting_text: TLR10 contributed to innate immune sensing of viral infection leading to cytokine
        induction, including proinflammatory cytokines and interferons
