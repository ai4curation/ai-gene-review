id: O60721
gene_symbol: SLC24A1
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SLC24A1 encodes NCKX1, the potassium-dependent sodium/calcium exchanger of retinal rod photoreceptors,
  a multi-pass plasma membrane protein of the SLC24 branch of the Ca2+/cation antiporter superfamily. Using both
  the inward sodium gradient and the outward potassium gradient, it exchanges four Na+ for one Ca2+ and one K+.
  In rods it sits in the plasma membrane of the outer segment, where in darkness it extrudes the Ca2+ that enters
  through the open cGMP-gated channels and, after illumination closes those channels, keeps extruding Ca2+ so that
  cytosolic Ca2+ falls rapidly. This fall drives the Ca2+-dependent feedback on guanylyl cyclase and other targets
  that underlies rod light adaptation and recovery. Recessive loss-of-function variants cause congenital stationary
  night blindness type 1D, a non-progressive rod dysfunction with a Riggs-type electroretinogram.
