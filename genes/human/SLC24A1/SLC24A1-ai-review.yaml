  review:
    summary: Calcium channel activity; NCKX1 is a coupled exchanger, not a channel.
    action: REMOVE
    reason: NCKX1 moves Ca2+ by stoichiometric exchange against Na+ and K+, driven by their gradients; it does not
      form a Ca2+ channel. The same PANTHER node correctly carries calcium, potassium:sodium antiporter activity
      (row 15). The channel term appears to derive from a mouse Slc24a2 knockout annotation and is a mischaracterization
      of exchanger activity for any family member.
