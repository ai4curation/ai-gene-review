  review:
    summary: Long-term synaptic potentiation/depression; a hippocampal phenotype of the paralog NCKX2.
    action: REMOVE
    reason: These IBA rows descend from a node seeded by the mouse Slc24a2 (NCKX2) knockout, whose hippocampal synaptic
      plasticity defects reflect the neuronal expression of NCKX2. NCKX1 is the rod outer-segment exchanger, described
