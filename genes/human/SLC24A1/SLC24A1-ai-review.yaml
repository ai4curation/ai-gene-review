  - UniProtKB:Q9HC58
  - UniProtKB:Q9IAL7
  - UniProtKB:Q9IAL8
  - UniProtKB:Q9UI40
  review:
    summary: Calcium, potassium:sodium antiporter activity; the defining activity of NCKX1.
    action: ACCEPT
    reason: Human NCKX1 expressed in HEK293 cells carries K+-dependent Na+/Ca2+ exchange (reverse-mode Ca2+ influx
      with defined external Ca2+ and K+ and internal Na+ dependencies). The bovine rod exchanger was the first shown
      to use both Na+ and K+ gradients, and the chicken rod ortholog (the ISS source) behaves likewise; the IBA
      node is seeded by experimentally characterized NCKX family members including human SLC24A1 itself, which is
      expected. Reactome and the InterPro mapping state the same 4Na+:(1Ca2+ + 1K+) exchange.
    supported_by: &id006
    - reference_id: PMID:26631410
      supporting_text: We measured changes to Ca(2+) influx via the reverse exchange mode while manipulating external
        Ca(2+) or K(+) or internal Na(+) concentrations
    - reference_id: Reactome:R-HSA-425678
      supporting_text: The five members of the NCKX (SLC24) family are all able to exchange one Ca2+ and one K+
        for four Na+.
    - reference_id: PMID:10662833
      supporting_text: The retinal rod Na–Ca exchanger protein was shown to be a Na–Ca+K exchanger (NCKX) that uses
        both the inward sodium gradient and the outward potassium gradient to drive calcium extrusion
