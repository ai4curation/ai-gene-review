core_functions:
- description: NCKX1 exchanges four Na+ for one Ca2+ plus one K+ across the rod outer-segment plasma membrane, extruding
    Ca2+ that enters through the cGMP-gated channels and lowering outer-segment Ca2+ after illumination, which drives
    light adaptation (human protein in HEK293 cells; bovine and chicken rods).
  molecular_function:
    id: GO:0008273
    label: calcium, potassium:sodium antiporter activity
  directly_involved_in:
  - id: GO:1990034
    label: calcium ion export across plasma membrane
  - id: GO:0006874
    label: intracellular calcium ion homeostasis
  - id: GO:0036367
    label: light adaption
  locations:
  - id: GO:0042622
    label: photoreceptor outer segment membrane
  supported_by:
  - reference_id: PMID:26631410
    supporting_text: We measured changes to Ca(2+) influx via the reverse exchange mode while manipulating external
      Ca(2+) or K(+) or internal Na(+) concentrations
  - reference_id: PMID:10662833
    supporting_text: In darkness, the Na–Ca exchanger extrudes calcium that enters rod or cone outer segments via
      the cGMP-gated channels
  - reference_id: Reactome:R-HSA-5625841
    supporting_text: The light-induced lowering of calcium by efflux via this protein plays a key role in the process
      of light adaptation.
suggested_questions:
- question: Is human NCKX1 confined to the rod outer segment as in bovine retina, given that the CSNB1D study reported
    inner-segment and nuclear-layer immunostaining?
suggested_experiments:
- hypothesis: Human rods restrict NCKX1 to the outer-segment plasma membrane.
  description: Immunostain human donor retina or retinal organoids for NCKX1 with antibodies validated on SLC24A1-null
    tissue, co-labelling rod outer-segment and inner-segment markers.
