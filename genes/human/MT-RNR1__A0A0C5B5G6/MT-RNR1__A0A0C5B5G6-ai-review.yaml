      encoded MOTS-c.
    supporting_text: we found that none of the putative NUMT-derived peptides shared complete
      homology with mitochondrial encoded MOTS-c
    reference_section_type: RESULTS
  - statement: The endogenous peptide circulates in human and rodent plasma.
