- term:
    id: GO:0043610
    label: regulation of carbohydrate utilization
  evidence_type: IDA
  original_reference_id: PMID:25738459
  qualifier: involved_in
  review:
    summary: MOTS-c-overexpressing and peptide-treated cells show increased glucose clearance,
      lactate accumulation and glycolytic flux, and treated mice show improved glucose tolerance
      and insulin sensitivity; the effects require AMPK and are reversed by folate.
    action: KEEP_AS_NON_CORE
    reason: >-
      This is the headline physiological effect of the peptide and is supported by cellular flux
      measurements plus whole-animal glucose tolerance tests, so it should be kept. It is not a
      core molecular role, however - it is the distal output of the folate-AICAR-AMPK cascade,
      several steps downstream of any activity the peptide performs itself, and it was obtained
      with stable overexpression, exogenous peptide and daily injections rather than at
      endogenous levels.
    supported_by:
    - reference_id: PMID:25738459
      supporting_text: MOTS-c appeared to stimulate glucose utilization evidenced by increased
        glucose clearance and lactate accumulation in culture media
    - reference_id: PMID:25738459
      supporting_text: Its primary target organ appears to be the skeletal muscle, and its cellular
        actions inhibit the folate cycle and its tethered de novo purine biosynthesis, leading
        to AMPK activation.
- term:
    id: GO:0048630
    label: skeletal muscle tissue growth
  evidence_type: IDA
  original_reference_id: PMID:33554779
  qualifier: involved_in
  review:
    summary: Injected MOTS-c reduced myostatin levels and muscle-atrophy signalling in high-fat-diet
      mice; the muscle-mass difference itself was apparent only after normalising to body weight.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The authors state that absolute muscle masses did not differ between treatment groups and
      that the effect emerged only on body-weight adjustment in peptide-injected mice; the
      companion experiment is prevention of palmitate-induced atrophy, i.e. protection against
      loss rather than growth. Growth of skeletal muscle tissue is therefore not established,
      and in any case would be a distal consequence of the CK2-PTEN-AKT-FOXO1-myostatin cascade
      rather than a process the peptide carries out.
    supported_by:
    - reference_id: PMID:33554779
      supporting_text: Although no differences were found between any of the three treatment groups
        when considering total, gastrocnemius, soleus, and plantaris absolute muscle mass, differences
        were more visible when performing an adjustment calculation with body weight.
    - reference_id: PMID:33554779
      supporting_text: We administered MOTS-c (0.5 mg/kg/day, ip injection) in HFD (60 kcal% fat)-fed
        mice for 3 wk and examined gastrocnemius, soleus, and plantaris muscle mass.
- term:
    id: GO:0071902
    label: positive regulation of protein serine/threonine kinase activity
  evidence_type: IDA
  original_reference_id: PMID:33554779
  qualifier: involved_in
  review:
    summary: MOTS-c treatment increased AKT Ser473 phosphorylation (an mTORC2-dependent site)
      in skeletal muscle of diet-induced obese mice, while Thr308 was unchanged, and increased
      CK2 substrate phosphorylation.
    action: KEEP_AS_NON_CORE
    reason: >-
      A regulation-level term is appropriate for an indirect effect, and the phospho-site
      specificity (Ser473 but not Thr308) argues the effect is real rather than a generic
      signalling shift. It is not a core function - the peptide acts through a multi-step
      cascade (CK2, PTEN, mTORC2) with no direct kinase target identified, and the data come
      from peptide-injected mice.
    supported_by:
    - reference_id: PMID:33554779
      supporting_text: MOTS-c elevated the phosphorylation of AKT at Ser 473
    - reference_id: PMID:33554779
      supporting_text: In MOTS-c-treated mice, the total levels of phosphorylated CK2 substrate
        were elevated compared with control mice, suggesting CK2 kinase activity is higher in
        MOTS-c treated mice
- term:
    id: GO:0072522
    label: purine-containing compound biosynthetic process
  evidence_type: IDA
  original_reference_id: PMID:25738459
  qualifier: involved_in
  review:
    summary: Metabolomics in MOTS-c-overexpressing and peptide-treated cells showed depletion
      of 5-methyl-tetrahydrofolate, blockade of de novo purine biosynthesis, more than 20-fold
      accumulation of the intermediate AICAR and a fall in purines.
    action: MODIFY
    reason: >-
      The direction of the annotation is wrong - MOTS-c blocks de novo purine biosynthesis
      rather than contributing to it, and it is not a biosynthetic enzyme in the pathway. A
