core_functions:
- description: >-
    In the nucleus, MOTS-c binds DNA of antioxidant response element (ARE)-containing promoters
    and associates with the ARE-regulating transcription factors NFE2L2/NRF2, ATF1 and
    NFE2L1/NRF1, occupying the HO-1 and NQO1 promoters in a stress-dependent manner and
    shifting expression of several hundred nuclear genes, many of them bona fide NRF2
    targets. Nuclear entry requires the hydrophobic core Tyr8-Tyr11 and the cationic tail
    Arg13-Arg16, and occurs after glucose restriction or oxidative stress in an
    AMPK-dependent manner. This makes the peptide a mitochondrially encoded contributor to
    nuclear stress-response transcription; it has no catalytic activity, and it is not
    itself a sequence-specific transcription factor, since the specificity controls in the
    binding assays cannot separate motif recognition from the charge-driven DNA affinity of
    a small cationic peptide.
  molecular_function:
    id: GO:0003677
    label: DNA binding
  directly_involved_in:
