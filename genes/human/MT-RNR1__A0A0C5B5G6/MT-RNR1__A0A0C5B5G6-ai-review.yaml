  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Original characterisation of the peptide; full text in the cache. Verified that it
      establishes the 12S rRNA ORF, the obligate cytosolic translation, the exclusion of NUMT
      sources, plasma detection by ELISA, and the folate-AICAR-AMPK cascade. Soundness caveat
      recorded in the annotation reviews rather than here - the functional work uses stable
      overexpression, exogenous peptide and injected mice, and no direct molecular target in
      the folate cycle is identified.
  findings:
  - statement: >-
      The 51-bp ORF lies within the mitochondrial 12S rRNA and cannot be translated by the
      mitochondrial ribosome, so the peptide must be made in the cytosol from an exported
      mitochondrial transcript.
    supporting_text: MOTS-c peptide translation obligatorily occurs in the cytoplasm using the
      standard genetic code because mitochondrial translation, using the mitochondria-specific
      genetic code, yields tandem start and stop codons
    reference_section_type: RESULTS
