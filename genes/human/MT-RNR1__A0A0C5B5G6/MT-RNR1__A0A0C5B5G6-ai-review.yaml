      their interaction was strengthened after GR (3 hr)
- description: >-
    As a secreted, plasma-borne amphipathic cationic peptide, MOTS-c acts directly on
    bacteria - it aggregates and damages Escherichia coli and methicillin-resistant
    Staphylococcus aureus through its hydrophobic core and cationic tail, inhibits their
    growth, and neutralises MRSA infectivity in mice. Its expression is induced in human
    monocytes by interferon gamma, lipopolysaccharide and differentiation signals, and
    exogenous peptide reprogrammes differentiating monocytes into macrophages with greater
    bacterial killing capacity. These are the chemistry and the behaviour of a host defence
    peptide, and this is the function for which the peptide itself performs the step rather
    than sitting upstream of a metabolite cascade. No molecular-function term is asserted
    because membrane permeabilisation was shown as aggregation and surface damage, not as
    transmembrane pore formation.
