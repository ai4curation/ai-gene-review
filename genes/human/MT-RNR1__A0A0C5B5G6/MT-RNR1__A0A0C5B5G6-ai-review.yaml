- term:
    id: GO:0006357
    label: regulation of transcription by RNA polymerase II
  evidence_type: IDA
  original_reference_id: PMID:29983246
  qualifier: involved_in
  review:
    summary: In the nucleus after glucose restriction, MOTS-c occupies ARE-containing promoters,
      associates with ARE-regulating transcription factors, increases ARE-luciferase reporter
      activity and changes expression of several hundred nuclear genes that overlap with bona
      fide NRF2 targets.
    action: ACCEPT
    reason: >-
      The peptide itself binds the promoter DNA and the transcription factors acting there, so
      it does part of the work of regulating polymerase II transcription rather than merely
      being required for it. This, together with the DNA- and transcription-factor-binding
      activities, is the core nuclear function and the most distinctive claim about the peptide
      (a mitochondrially encoded regulator of the nuclear genome).
    supported_by:
    - reference_id: PMID:29983246
      supporting_text: we found that MOTS-c directly bound DNA sequences of ARE-containing promoter
        regions of NRF2 target genes, including HO-1, NQO1, UGT1A1, UGT1A6, TXN, FTL, and GPX2,
        in a concentration-dependent manner
    - reference_id: PMID:29983246
      supporting_text: In the nucleus, MOTS-c regulated a broad range of genes in response to
        glucose restriction, including those with antioxidant response elements (ARE), and interacted
        with ARE-regulating stress-responsive transcription factors, such as nuclear factor erythroid
        2-related factor 2 (NFE2L2/NRF2)
- term:
    id: GO:0032147
    label: activation of protein kinase activity
  evidence_type: IDA
  original_reference_id: PMID:25738459
  qualifier: involved_in
  review:
    summary: MOTS-c treatment increased AMPK alpha Thr172 phosphorylation, but the paper's own
      mechanism places two steps between peptide and kinase - inhibition of the folate cycle
      blocks de novo purine synthesis, AICAR accumulates more than 20-fold, and AICAR is the
      known AMPK activator.
    action: MODIFY
    reason: >-
      GO:0032147 means initiating the activity of an inactive protein kinase, which implies an
      action on the kinase. Here the proximate activator is the metabolite AICAR, and no direct
      MOTS-c target in the folate cycle has been identified; AMPK activation occurred despite
      lower AMP levels. A regulation-level term for a serine/threonine kinase states what was
      observed without claiming the peptide acts on the kinase.
    proposed_replacement_terms:
    - id: GO:0071902
      label: positive regulation of protein serine/threonine kinase activity
    supported_by:
    - reference_id: PMID:25738459
      supporting_text: resulting in an accumulation of endogenous AICAR (5-aminoimidazole-4-carboxamide
        ribonucleotide) to levels higher than 20-fold in MOTS-c-ST cells compared to control
        cells
    - reference_id: PMID:25738459
      supporting_text: MOTS-c treatment led to the phosphorylation of AMPKα (Thr172) and Akt
        (Ser473) in a time and dose-dependent manner
