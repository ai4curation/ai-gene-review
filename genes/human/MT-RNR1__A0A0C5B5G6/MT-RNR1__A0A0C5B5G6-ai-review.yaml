      in a concentration-dependent manner
  - reference_id: PMID:29983246
    supporting_text: The binding of MOTS-c to promoter regions of HO-1 and NQO1 containing ARE
      sites significantly increased 3 hr after being challenged with GR and tBHP
  - reference_id: PMID:29983246
    supporting_text: NRF2 co-immunoprecipitated with MOTS-c only from nuclear extracts of cells
      treated with GR and tBHP for 3 hr
- description: >-
    MOTS-c binds the ARE-regulating stress-responsive transcription factors NFE2L2/NRF2,
    ATF1 and NFE2L1/NRF1 in the nucleus. The NRF2 association is stress-inducible and
    reciprocally confirmed with tagged constructs, and the two proteins reach the nucleus
    independently of each other, so the complex forms on chromatin rather than being a
    nuclear-import cargo relationship. Functionally this is how a mitochondrially encoded
    peptide is coupled to an existing nuclear transcription factor network, rather than
    acting as a transcription factor in its own right.
  molecular_function:
    id: GO:0140297
