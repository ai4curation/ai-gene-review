suggested_questions:
- question: >-
    How is a peptide whose ORF lies inside the 12S rRNA actually made? The mitochondrial
    genetic code reads the ORF as tandem start and stop codons, so translation must occur in
    the cytosol from an exported mitochondrial transcript, by a route the original paper
    describes as poorly understood. Until an export mechanism and a cytosolic initiation
    event are demonstrated, every annotation on this entry rests on an unestablished
    biosynthetic premise.
  experts:
  - Changhan David Lee
  - Pinchas Cohen
- question: >-
    Has endogenous MOTS-c ever been identified at the peptide level by mass spectrometry,
    independently of the in-house antibody and ELISA? All localisation and abundance claims
    (mitochondrial, nuclear, plasma, exercise- and age-dependent changes) depend on those
    two reagents, and the peptide is only 16 residues long.
  experts:
  - Pinchas Cohen
  - Troy L Merry
- question: >-
    Is the DNA binding of MOTS-c sequence-specific? The EMSA specificity controls substitute
    the hydrophobic core and the cationic tail, which are also the residues that would drive
    charge-based binding of any short cationic peptide to DNA, so motif recognition has not
    been separated from non-specific affinity. The answer decides whether a
    cis-regulatory-region or sequence-specific DNA binding term is ever justified.
  experts:
  - Kyung Hwa Kim
  - Changhan David Lee
- question: >-
    What is the direct molecular target of MOTS-c in the folate-methionine cycle? The whole
    metabolic arm of the field - AICAR accumulation, AMPK activation, insulin sensitisation -
    is attributed to inhibition of this cycle, but no binding partner or inhibited enzyme has
    been identified, which is why the metabolic annotations have to stay at the regulation
    level.
  experts:
  - Changhan David Lee
  - Pinchas Cohen
- question: >-
    Do the reported effects occur at physiological peptide concentrations? Cellular work uses
    0.5-10 micromolar synthetic peptide (100 micromolar for the antibacterial assays) and
    animal work 0.5-5 mg/kg/day by injection, while circulating endogenous levels are in the
    nanogram-per-millilitre range. Which of the phenotypes survive at endogenous
    concentrations is unresolved and determines which process terms are defensible.
  experts:
  - Troy L Merry
  - Hiroshi Kumagai
suggested_experiments:
- hypothesis: >-
    Endogenous MOTS-c exists as a discrete 16-residue peptide and can be detected without
    antibody reagents.
  description: >-
    Targeted mass spectrometry (parallel reaction monitoring) for the MOTS-c peptide and its
    predicted proteolytic fragments in human plasma, skeletal muscle and isolated nuclei,
    with a heavy-isotope-labelled synthetic standard for quantification, in paired samples
    before and after exercise. A positive result would place the entry's existence beyond the
    antibody, and would give the absolute concentrations needed to judge which published
    effects are physiological.
- hypothesis: >-
    The nuclear and transcriptional functions require the peptide itself rather than the 12S
    rRNA transcript or a NUMT-derived product.
  description: >-
    Express the MOTS-c ORF from a nuclear, codon-optimised construct lacking any 12S rRNA
    context, with and without the YIFY and RKLR substitutions, in cells depleted of
    mitochondrial transcripts by actinonin, and test ARE promoter occupancy by ChIP-qPCR and
    stress-gene induction. Separating peptide from transcript settles whether the reported
    phenotypes belong on this protein entry at all.
- hypothesis: >-
    MOTS-c binding to ARE-containing DNA is charge-driven rather than motif-specific.
  description: >-
    Competition EMSA and a quantitative binding assay (fluorescence anisotropy or microscale
    thermophoresis) comparing ARE-containing probes against scrambled probes of identical
    length and GC content, and against poly-dIdC, at matched ionic strength, using
    charge-conservative mutants (for example Arg-to-Lys) as controls instead of alanine
    substitutions. This is the experiment that would license or exclude a sequence-specific
    DNA binding annotation.
- hypothesis: >-
    The antibacterial activity operates at concentrations reachable in vivo and proceeds by
    membrane permeabilisation.
  description: >-
    Determine minimum inhibitory and minimum bactericidal concentrations for MOTS-c against
    E. coli and MRSA in physiological salt and serum, alongside calcein-leakage and
    membrane-potential assays on liposomes and on bacteria, and compare with LL-37 as a
    benchmark. Dose-response data in physiological media would show whether the host-defence
    role is plausible at endogenous levels, and leakage kinetics would settle whether a
    pore-forming molecular function term is warranted.
- hypothesis: >-
    The metabolic phenotypes depend on endogenous MOTS-c rather than on pharmacological
    peptide exposure.
  description: >-
    Use a MOTS-c-neutralising antibody or an ORF-targeted antisense approach to lower
    endogenous peptide levels without ablating all mitochondrial gene expression (the
    confound in actinonin and rho-zero systems), then measure folate-cycle metabolites,
    AICAR, AMPK phosphorylation and glucose flux. Loss-of-function at endogenous levels is
    the missing half of the evidence for every metabolic annotation on this entry.
