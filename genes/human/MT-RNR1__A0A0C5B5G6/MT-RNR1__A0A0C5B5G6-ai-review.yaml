id: A0A0C5B5G6
gene_symbol: MT-RNR1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  MOTS-c (mitochondrial open reading frame of the 12S rRNA-c) is a 16-amino-acid
  mitochondrial-derived peptide encoded by a 51-bp alternative ORF inside the mitochondrial
  12S rRNA gene (MT-RNR1); because the mitochondrial genetic code reads the ORF as tandem
  start and stop codons, the peptide must be translated in the cytosol from an exported
  mitochondrial transcript, and nuclear NUMT copies of the locus do not encode the exact
  peptide. The peptide is amphipathic and cationic, with a hydrophobic core (Tyr8-Tyr11)
  and a basic C-terminal tail (Arg13-Arg16) that together govern both its nuclear entry
  and its interaction with nucleic acids and bacterial membranes. It is detected in
  mitochondria, in the nucleus and in extracellular fluid, circulating in human and rodent
  plasma; muscle and plasma levels rise with exercise and change with age. In the nucleus,
  following glucose restriction or oxidative stress, it occupies antioxidant response
  element (ARE)-containing promoters and associates with the ARE-regulating transcription
  factors NFE2L2/NRF2, NFE2L1/NRF1 and ATF1, thereby modulating RNA polymerase
  II-dependent stress-response gene expression - a case of a mitochondrially encoded
  factor acting on the nuclear genome. Applied as synthetic peptide it inhibits the
  folate-methionine cycle and de novo purine biosynthesis, causing AICAR to accumulate and
  AMPK to be activated, with downstream effects on glucose utilisation, insulin
  sensitivity, adiposity and muscle wasting signalling in rodents. As a cationic
  amphipathic peptide it also aggregates and damages Escherichia coli and
  methicillin-resistant Staphylococcus aureus directly, is induced in human monocytes by
  interferon gamma and lipopolysaccharide, and protects mice from MRSA challenge,
  properties shared with classical host defence peptides. The common Asian mtDNA variant
  m.1382A>C substitutes Lys14 with Gln and reduces the peptide's insulin-sensitising
  activity.
existing_annotations:
- term:
    id: GO:0001649
    label: osteoblast differentiation
  evidence_type: IDA
  original_reference_id: PMID:30468456
  qualifier: involved_in
  review:
    summary: Synthetic MOTS-c added to cultured rat bone-marrow mesenchymal stem cells increased
      osteogenic markers and calcified-nodule formation, an effect reversed by TGF-beta1 knockdown.
      This is pharmacology on rat cells rather than evidence that endogenous human MOTS-c participates
      in osteoblast differentiation.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The experiment applies exogenous peptide to rat BMSCs and reads out differentiation
      markers; no endogenous MOTS-c manipulation, no human cells and no molecular target in the
      TGF-beta/SMAD pathway are shown. The peptide is not reported to catalyse or structurally
      contribute to any step of osteoblast differentiation, so involved_in overstates what was
      observed. Retained rather than removed because the observation itself is a direct assay
      and may reflect a real, if indirect, response to the peptide.
    supported_by:
    - reference_id: PMID:30468456
      supporting_text: Rat BMSCs were isolated and cultured, followed by osteogenic and lipid
        differentiation.
    - reference_id: PMID:30468456
      supporting_text: MOTS-c treatment could remarkably stimulate the formation of calcified
        nodules in BMSCs.
- term:
    id: GO:0003677
    label: DNA binding
  evidence_type: IDA
  original_reference_id: PMID:29983246
  qualifier: enables
  review:
    summary: Electrophoretic mobility shift assays showed concentration-dependent binding of
      synthetic MOTS-c to ARE-containing promoter fragments of several NRF2 target genes, and
      ChIP-qPCR showed stress-induced occupancy of the HO-1 and NQO1 promoters in cells. This
      is the best-supported molecular activity of the peptide.
    action: ACCEPT
    reason: >-
      Direct in vitro DNA binding plus in-cell chromatin occupancy. GO:0003677 is the right
      level of specificity. Although the probes carried ARE motifs, the specificity controls
      were alanine substitutions of the hydrophobic core and the cationic tail, which also
      remove the residues that would drive non-specific peptide-nucleic acid binding, so
      sequence specificity (GO:0043565, GO:0000976) is not established and should not be
      asserted.
    supported_by:
    - reference_id: PMID:29983246
      supporting_text: we found that MOTS-c directly bound DNA sequences of ARE-containing promoter
        regions of NRF2 target genes, including HO-1, NQO1, UGT1A1, UGT1A6, TXN, FTL, and GPX2,
        in a concentration-dependent manner
    - reference_id: PMID:29983246
      supporting_text: The binding of MOTS-c to promoter regions of HO-1 and NQO1 containing
        ARE sites significantly increased 3 hr after being challenged with GR and tBHP
