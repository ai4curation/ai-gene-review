- term:
    id: GO:2001145
    label: negative regulation of phosphatidylinositol-3,4,5-trisphosphate 5-phosphatase
      activity
  evidence_type: IDA
  original_reference_id: PMID:33554779
  qualifier: involved_in
  review:
    summary: MOTS-c increased phosphorylation of the PTEN C-terminal Ser380/Thr382/Thr383/Ser385
      cluster in mouse skeletal muscle, which the authors interpret as stabilising PTEN while
      suppressing its phosphatase activity, thereby permitting AKT Ser473 phosphorylation.
    action: MODIFY
    reason: >-
      The term names the wrong enzyme chemistry. PTEN is a
      phosphatidylinositol-3,4,5-trisphosphate 3-phosphatase (GO:0016314), whereas GO:2001145
      refers to PIP3 5-phosphatase activity, the INPP5D/SHIP-family reaction, which PTEN does
      not perform. GO currently has no negative-regulation term for the 3-phosphatase activity,
      so the correct available term is the parent GO:0010923 negative regulation of phosphatase
      activity. The underlying claim is also inferred from phospho-site immunoblots rather than
      a phosphatase assay, and is mediated via CK2, so it is not a core function.
    proposed_replacement_terms:
    - id: GO:0010923
      label: negative regulation of phosphatase activity
    supported_by:
    - reference_id: PMID:33554779
      supporting_text: MOTS-c increased the phosphorylation of the c-terminal cluster of PTEN
    - reference_id: PMID:33554779
      supporting_text: which stabilizes PTEN, resulting in increased protein abundance but suppressed
        PTEN phosphatase activity
- term:
    id: GO:0061844
    label: antimicrobial humoral immune response mediated by antimicrobial peptide
  evidence_type: IDA
  original_reference_id: PMID:42611943
  qualifier: involved_in
  review:
    summary: MOTS-c is an amphipathic cationic peptide that aggregates and damages Escherichia
      coli and methicillin-resistant Staphylococcus aureus through its hydrophobic core and cationic
      tail, is induced in human monocytes by interferon gamma and lipopolysaccharide, and neutralises
      MRSA infectivity in mouse peritonitis; an independent group reported improved survival and
      reduced bacterial load in MRSA-challenged mice.
    action: NEW
    reason: >-
      Participation test - the peptide itself performs the antibacterial step, acting directly
      on bacterial surfaces, rather than merely being required for a process another gene
      product carries out; the activity maps to defined residues whose substitution abolishes
      it. Comparator test - the canonical secreted human antimicrobial peptide CAMP/LL-37
      (P49913) carries GO:0061844 by IDA, so this is the established convention for a
      circulating cationic amphipathic peptide with direct killing activity, and the absence of
      such a term for MOTS-c is a gap rather than a convention. The humoral framing fits a
      peptide already annotated to the extracellular region and measurable in plasma. The in
      vitro killing assays used 100 micromolar peptide, which is why the molecular-function side
      (membrane permeabilisation, pore formation) is left unannotated.
    additional_reference_ids:
    - PMID:29096170
    supported_by:
    - reference_id: PMID:42611943
      supporting_text: We demonstrate that MOTS-c (mitochondrial open reading frame from the 12
        S rRNA type-c) is a mitochondrial-encoded amphipathic and cationic peptide with direct
        antibacterial and immunomodulatory functions, consistent with the peptide chemistry and
        functions of known HDPs.
    - reference_id: PMID:42611943
      supporting_text: In human monocytes, interferon gamma (IFNγ), lipopolysaccharides (LPS),
        and differentiation signals each induced the expression of endogenous MOTS-c.
    - reference_id: PMID:29096170
      supporting_text: we demonstrated that a Mitochondria-derived peptide (MOTS-c) could significantly
        improve the survival rate and decrease bacteria loads in MRSA-challenged mice
