- description: Raft-resident accessory component of the early TCR signalosome in human T cells. On activation CD48 is recruited with CD2 and Lck to the TCR/CD3 complex and is needed for LAT to join the complex and for IL-2 production. CD48 has no cytoplasmic domain, so this is likely membrane-microdomain co-recruitment rather than a binding activity; no molecular function term is asserted.
  directly_involved_in:
