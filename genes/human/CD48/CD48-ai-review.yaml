    supporting_text: CD48 reorganization was vital for T cell IL-2 production by mediating lateral association of the early signaling component linker for activated T cells (LAT) to the TCR/CD3 complex.
suggested_questions:
- question: 'What is the physiological role of soluble CD48 in plasma: does it act as a decoy that blocks 2B4 engagement, or as an agonist, and how is it released (GPI-PLD cleavage vs. alternative isoform 2)?'
- question: How strong and functionally relevant is the human CD2-CD48 interaction in trans, given that CD58 is the principal human CD2 ligand?
- question: Does CD48 also function as a ligand for receptors on mast cells and eosinophils (e.g. bacterial FimH-binding or 2B4 on eosinophils) in allergic inflammation, beyond lymphocyte 2B4?
- question: Does CD48 physically associate with LAT or only co-partition with it in rafts during TCR signalosome assembly, and is CD48 required for LAT recruitment in primary human T cells?
suggested_experiments:
- hypothesis: CD48 is required to shuttle LAT into TCR microclusters in primary human T cells.
  description: CRISPR knockout of CD48 in primary human CD4+ T cells, followed by TIRF imaging of LAT/Lck recruitment to TCR microclusters and IL-2 readout, with rescue by wild-type CD48 vs. a transmembrane-anchored (raft-excluded) variant.
  experiment_type: genetic perturbation with imaging
- hypothesis: Soluble plasma CD48 antagonises 2B4-dependent NK cytotoxicity.
  description: Titrate purified soluble CD48 (and isoform 2 protein) into 2B4-dependent NK killing assays against CD48-positive targets and measure 2B4 phosphorylation.
  experiment_type: functional assay
