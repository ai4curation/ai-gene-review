  review:
    summary: CD48 is recruited to the TCR/CD3 complex on activation and shuttles LAT into the early TCR signalosome; CD48 is required for IL-2 production.
    action: NEW
    reason: 'Regulation-level claim: CD48 is required for LAT to associate with the TCR/CD3 complex and for IL-2 production (PMID:19494291), which supports positive regulation of TCR signalling without asserting that CD48 performs a signalling step. CD48 is GPI-anchored with no cytoplasmic domain, so its effect on LAT is most likely lipid-raft co-recruitment rather than direct binding. Single abstract-only study; proposed conservatively.'
