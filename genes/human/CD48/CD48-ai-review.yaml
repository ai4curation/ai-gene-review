core_functions:
- description: Ligand of the activating SLAM-family receptor 2B4 (CD244). Cell-surface CD48 on target or neighbouring cells binds the 2B4 V domain in trans (Kd ~8 uM in human), delivering activating signals to human NK cells; cis binding on the NK cell itself reduces trans engagement and tunes 2B4 responsiveness.
