- term:
    id: GO:0030101
    label: natural killer cell activation
  evidence_type: IDA
  original_reference_id: PMID:27249817
  qualifier: involved_in
  review:
    summary: 'IDA: CD48 binds 2B4 in trans on neighbouring cells and in cis on the NK cell itself; cis binding reduces trans engagement and 2B4 phosphorylation by CD48-positive targets.'
    action: ACCEPT
    reason: 'Accepted: in human NK cells CD48-2B4 engagement delivers activating signals (PMID:16002700), so CD48 acting in trans on target cells contributes to NK cell activation. PMID:27249817''s own CD48 result is a modulation one. Cis CD48 on the NK cell reduces 2B4 binding to CD48 in trans and lowers stimulation-dependent 2B4 phosphorylation, and blocking the cis interaction enhanced lysis of CD48-positive tumour cells. CD48 therefore also tunes NK activation negatively in cis; this is regulatory and does not change the ACCEPT for the trans activating role.'
    supported_by:
    - *id002
    - reference_id: PMID:27249817
      supporting_text: Interfering with the cis interaction therefore enhanced the lysis of CD48-expressing tumour cells.
    - *id003
