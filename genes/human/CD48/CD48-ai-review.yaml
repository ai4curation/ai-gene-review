    action: MODIFY
    reason: Generic protein binding is uninformative. The cited work measures the head-to-head adhesive bond between the extracellular regions of CD2 and CD48, so the informative function is binding to a cell adhesion molecule (CD2). CD2 is the principal CD48 counter-receptor in rodents; in human, CD58 is the main CD2 ligand and the CD2-CD48 interaction is weaker, but CD2-CD48 cis association in the human TCR signalosome has been shown (PMID:19494291). The curator read the full text, so the interaction partner is accepted; only the term is refined.
