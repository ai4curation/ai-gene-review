id: P09326
gene_symbol: CD48
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CD48 (SLAMF2, BLAST-1) is a glycosylphosphatidylinositol (GPI)-anchored cell-surface glycoprotein of the CD2/SLAM subset of the immunoglobulin superfamily, with an N-terminal V-set domain and a membrane-proximal C2-set domain. It is expressed on essentially all hematopoietic cells, is upregulated by type I and type II interferons, and resides in lipid rafts; a soluble form circulates in plasma. CD48 is the ligand of the activating SLAM-family receptor 2B4 (CD244) on NK cells and subsets of T cells, binding it in trans on neighbouring cells to trigger 2B4 ITSM phosphorylation, SAP/EAT-2 recruitment and NK-cell cytotoxicity and cytokine release, and in cis on the same cell to tune 2B4 responsiveness. CD48 is also a low-affinity ligand of CD2 (the principal CD2 ligand in rodents), and in human T cells it is recruited with CD2 and Lck to the TCR/CD3 complex where it shuttles the adaptor LAT into the early TCR signalosome.
