- id: file:human/ARID5B/ARID5B-deep-research-affinage.md
  title: Affinage mechanistic annotation for ARID5B (human, UniProtKB:Q14865)
  findings:
  - statement: Accurately synthesizes MRF2/ARID5B AATA(C/T) major- and minor-groove recognition via loops L1 and L2 alongside PHF2 H3K9me2 demethylase recruitment and metabolic/hematopoietic roles.
    supporting_text: Its ARID domain recognizes the core AATA(C/T) motif through major- and minor-groove contacts, with two flexible interhelical loops (L1, L2) mediating phosphate-backbone and AT base-pair contacts [PMID:10329386, PMID:17407261].
  reference_review:
    relevance: HIGH
    correctness: LOW_QUALITY
    review_notes: Correctly matches UniProtKB:Q14865 and provides strong coverage of AATA(C/T) NMR/biochemical DNA-binding studies (PMID:10329386, PMID:11478881, PMID:17407261), PKA-dependent PHF2-ARID5B H3K9me2 demethylation (PMID:21532585, PMID:24276541), adipose/muscle metabolic phenotypes (PMID:14651970, PMID:33757861), and ALL genetics. However, its GO molecular_activity profile is restricted to coarse goslim_generic terms (omitting both GO:0000976 cis-regulatory binding and GO:0003713 transcription coactivator activity), it omits the founding CMV enhancer repression study (PMID:8649988), and it emits a malformed pseudo-PMID ('PMID:bio_10.1101_2025.10.17.683040') for an unpeer-reviewed bioRxiv preprint.
