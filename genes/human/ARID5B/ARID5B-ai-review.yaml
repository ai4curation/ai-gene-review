knowledge_gaps:
- gap_statement: Which lysine methyltransferase deposits the inhibitory methyl mark on ARID5B Lys336 prior to PKA-PHF2 activation, and how short versus long ARID5B splice isoforms partition between PHF2 coactivation and HDAC1/2 corepression, remain unresolved.
  boundary: PKA-triggered PHF2 demethylation of ARID5B Lys336 and promoter H3K9me2 removal are established (PMID:21532585, PMID:24276541), whereas the upstream writer methyltransferase for Lys336 and the structural role of the N-terminal BAH-like region unique to the long isoform are uncharacterized.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: Defines the upstream signal-transduction switch controlling whether DNA-bound ARID5B activates or represses target loci across metabolic and lymphoid lineages.
suggested_questions:
- question: Which protein lysine methyltransferase methylates ARID5B at Lys336 in basal cells to hold the PHF2-ARID5B module in a poised state prior to cAMP/PKA signaling?
- question: How does the N-terminal region present only in the long isoform of human ARID5B alter recruitment of PHF2 versus class I HDAC corepressors at target enhancers?
suggested_experiments:
- description: Perform targeted siRNA/CRISPR screening of nuclear KMTs coupled with quantitative mass spectrometry of ARID5B Lys336 methylation in hepatocytes before and after forskolin/glucagon stimulation.
- description: Compare genome-wide CUT&RUN occupancy and quantitative interactomes (PHF2 vs HDAC1/2) of endogenously epitope-tagged long and short ARID5B isoforms in human B-lineage progenitors.
