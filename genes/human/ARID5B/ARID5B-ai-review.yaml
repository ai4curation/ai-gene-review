id: Q14865
gene_symbol: ARID5B
aliases:
- MRF2
- MRF-2
- DESRT
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Sequence-specific AT-rich cis-regulatory DNA-binding transcription factor and chromatin coregulator (~1188 aa) whose central ARID domain recognizes 5'-AATA(C/T)-3' motifs through Loop L1 backbone contacts and Loop L2/Helix 5 (Thr388, Ser389, Cys393, Arg396) major-groove base contacts. Associates via Lys336 with PKA-phosphorylated PHF2 in the nucleoplasm to form an active H3K9me2 histone demethylase coactivator complex that activates hepatic, chondrogenic (SOX9-dependent), and metabolic transcription, while also repressing AT-rich viral and cellular cis-regulatory elements and governing adipogenesis and B/T-lymphoid differentiation.
core_functions:
- description: Recognizes AT-rich 5'-AATA(C/T)-3' cis-regulatory promoter and enhancer sequences via major- and minor-groove contacts of its ARID domain to activate or repress RNA polymerase II transcription.
  molecular_function:
    id: GO:0000976
    label: transcription cis-regulatory region binding
  locations:
  - id: GO:0005654
    label: nucleoplasm
  directly_involved_in:
  - id: GO:0006357
    label: regulation of transcription by RNA polymerase II
  - id: GO:0000122
    label: negative regulation of transcription by RNA polymerase II
  - id: GO:0045893
    label: positive regulation of DNA-templated transcription
  supported_by:
  - reference_id: PMID:10329386
    supporting_text: Binding interference and binding site selection assays indicated that Mrf-2 requires the core sequence AATA(C/T) for high affinity binding.
  - reference_id: PMID:17407261
    supporting_text: While the L1 loop contacts the phosphate backbone, L2 and several residues in the adjacent helices interact with AT base pairs in the major groove of DNA.
  - reference_id: PMID:8649988
    supporting_text: Mutations of these stretches in the modulator reduce the binding activity of MRF, as well as the repressing activity on the enhancer. These results suggest that MRF may act as a repressor of enhancer function.
  - reference_id: file:human/ARID5B/ARID5B-deep-research-affinage.md
    supporting_text: Its ARID domain recognizes the core AATA(C/T) motif through major- and minor-groove contacts, with two flexible interhelical loops (L1, L2) mediating phosphate-backbone and AT base-pair contacts [PMID:10329386, PMID:17407261].
- description: Partners via Lys336 with PKA-activated PHF2 to target H3K9me2 histone demethylase activity to promoters, remodeling chromatin to coactivate SOX9- and fasting-regulated transcription.
  molecular_function:
    id: GO:0003713
    label: transcription coactivator activity
  locations:
  - id: GO:0005654
    label: nucleoplasm
  directly_involved_in:
  - id: GO:0045815
    label: transcription initiation-coupled chromatin remodeling
  - id: GO:0006357
    label: regulation of transcription by RNA polymerase II
  supported_by:
  - reference_id: PMID:21532585
    supporting_text: We found that phosphorylated PHF2 then associates with ARID5B, a DNA-binding protein, and induce demethylation of methylated ARID5B. This modification leads to targeting of the PHF2-ARID5B complex to its target promoters, where it removes the repressive H3K9Me2 mark.
  - reference_id: PMID:24276541
    supporting_text: Arid5b recruits Phf2, a histone lysine demethylase, to the promoter region of Sox9 target genes and stimulates H3K9me2 demethylation of these genes.
