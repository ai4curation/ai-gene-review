suggested_questions:
- question: Does TMEM268 stabilize integrins by blocking E3 ligase access to their
    cytoplasmic tails, by acting in ER quality control, or by directing endosomal
    recycling instead of lysosomal sorting? The two clients are degraded by different
    routes (proteasome for ITGB4, endolysosome for CD11b).
- question: Do the N- and C-terminal regions both face the cytoplasm, as a two-TM hairpin
    topology and binding to two different integrin cytoplasmic tails would predict?
- question: Does Drosophila CG18507 bind fly integrins (e.g. mys/beta-PS) and stabilize
    them, which would test whether the integrin-stabilizing function is conserved
    across PTHR31193?
suggested_experiments:
- description: Determine TMEM268 membrane topology by protease protection or glycosylation-site
    mapping, and map the integrin-binding surfaces on each cytoplasmic region.
  experiment_type: biochemical topology mapping
- description: Pulse-chase and surface biotinylation-recycling assays in human TMEM268-knockout
    cells to tell whether TMEM268 acts in ER export, in surface retention or in endosomal
    recycling of ITGB4 and CD11b.
  experiment_type: cell biology
- description: Knock down CG18507 in Drosophila tissues that depend on integrins (wing
    epithelium, muscle attachment) and measure beta-PS integrin protein levels.
  experiment_type: in vivo genetics
