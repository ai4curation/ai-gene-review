core_functions:
- description: >-
    TMEM268 is a membrane protein of the ER and plasma membrane that binds the
    cytoplasmic regions of integrin subunits (ITGB4 in human gastric cancer cells; CD11b
    in human HEK293T and THP-1 cells) and keeps them from degradation. The human
    evidence covers ITGB4 binding, ITGB4 stabilization against ubiquitin-proteasome
    degradation, and CD11b binding. CD11b stabilization against endosomal-lysosomal
    degradation was shown in mouse cells lacking the orthologous Tmem268. Fly CG18507
    sits in the same PANTHER subfamily but has not been studied, so these functions
    cannot yet be said to be conserved outside vertebrates.
