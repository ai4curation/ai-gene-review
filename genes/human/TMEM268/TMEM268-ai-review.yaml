- term:
    id: GO:0005178
    label: integrin binding
  evidence_type: IPI
  original_reference_id: PMID:30361615
  review:
    summary: >-
      GST-TMEM268 pulled down endogenous ITGB4 from human BGC823 lysates, endogenous
      co-IP confirmed the association, and mapping placed the interaction between the
      TMEM268 C-terminal region (104-342) and the ITGB4 C-terminal region (1356-1756),
      which lies in the ITGB4 cytoplasmic domain.
    action: NEW
    reason: >-
      Integrin binding to ITGB4 is demonstrated in human cells by GST pull-down,
      endogenous co-IP and domain mapping. With the CD11b interaction (PMID:38730209),
      this gives two independent integrin partners, so integrin binding is the
      informative MF for this gene. GOA has no annotation for the ITGB4 interaction.
    supported_by:
    - reference_id: PMID:30361615
      supporting_text: The endogenous co-immunoprecipitation (Co-IP) assay revealed
        that TMEM268 coprecipitated with ITGB4
    - reference_id: PMID:30361615
      supporting_text: Data from the Co-IP experiments suggest that the C-terminal of
        TMEM268 (TMEM268104–342) mediates the TMEM268−ITGB4 association
- term:
    id: GO:0050821
    label: protein stabilization
  evidence_type: IMP
  original_reference_id: PMID:30361615
  review:
    summary: >-
      In human BGC823 cells, TMEM268 knockout increased ITGB4 polyubiquitination
      and proteasomal degradation of ITGB4 (blocked by MG-132) and lowered surface ITGB4.
      In mouse Tmem268-/- phagocytes, CD11b was degraded faster through the
      endosomal-lysosomal pathway (PMID:38730209).
    action: NEW
    reason: >-
      TMEM268 binds the integrins whose degradation it prevents, so it acts directly
      on its client proteins and is not a distant upstream regulator. That meets the
      participation bar for protein stabilization. The human evidence is for ITGB4;
      CD11b stabilization was shown in mouse cells for the orthologous Tmem268 (same
      PANTHER subfamily PTHR31193:SF1), with the binding shown in human cells. How
      TMEM268 stabilizes its clients (shielding from ubiquitination, ER quality control
      or endosomal sorting) is unknown.
    supported_by:
    - reference_id: PMID:30361615
      supporting_text: Mechanistically, TMEM268 interacts with ITGB4; TMEM268 deletion
        promotes ITGB4 degradation via the protease pathway.
    - reference_id: PMID:30361615
      supporting_text: It was observed that in Cas9-TMEM268/BGC823 cells, the ITGB4
        fluorescence signal on the surface of the cell membrane was significantly downregulated
        compared to Control cells
    - reference_id: PMID:38730209
      supporting_text: These data suggest that Tmem268 knockout promotes CD11b degradation
        via the endosomal–lysosomal pathway but not autophagy and that the TMEM268–CD11b
        interaction plays an important role in maintaining the protein homeostasis of
        CD11b.
