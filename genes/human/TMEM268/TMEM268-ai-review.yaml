  label: Homo sapiens
description: >-
  TMEM268 (formerly C9orf91) is a 342-residue membrane protein with two predicted
  transmembrane helices (residues 105-152) and a DUF4481 (Pfam PF14800) domain; it is
  the sole subfamily (SF1) of PANTHER family PTHR31193, which includes vertebrate
  orthologs and Drosophila CG18507. In human gastric cancer cells it is found mainly in
  the endoplasmic reticulum and plasma membrane, binds the cytoplasmic C-terminal region
  of integrin beta4 (ITGB4) through its own C-terminal region, and is required to keep
  ITGB4 from ubiquitin-mediated proteasomal degradation; loss of TMEM268 lowers
  surface ITGB4, disrupts the ITGB4-plectin linkage, reduces cell-matrix adhesion and
  impairs tumour growth. TMEM268 also binds the cytoplasmic tail of the beta2-integrin
  alpha subunit CD11b (ITGAM) in human cells, and in mouse phagocytes Tmem268 loss
  increases endosomal-lysosomal degradation of CD11b, reducing phagocyte adhesion,
  migration and bacterial clearance. Its molecular mechanism beyond binding (for
  example chaperone, adaptor or sorting function) is unknown, and it has no known
  enzymatic activity.
