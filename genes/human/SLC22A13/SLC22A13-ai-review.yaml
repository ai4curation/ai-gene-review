id: Q9Y226
gene_symbol: SLC22A13
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SLC22A13 encodes Organic Anion Transporter 10 (OAT10; historically ORCTL3,
  organic cation transporter-like 3), a 551-residue, 12-transmembrane-domain member
  of the SLC22 family within the major facilitator superfamily. It is a Na(+)-independent
  anion antiporter of the apical (brush-border) membrane of renal proximal tubule
  epithelial cells. OAT10 takes up urate, nicotinate, orotate and p-aminohippurate
  in exchange for intracellular anions such as (S)-lactate, succinate, glutathione
  and nicotinate. It is a high-affinity nicotinate transporter (Km ~22-48 uM) and a
  lower-affinity urate transporter (Km ~558 uM), and also transports orotate with
  Cl(-)-dependent, biphasic kinetics. Physiologically it acts as a renal urate re-absorber
  on the urine side of the proximal tubule, resembling URAT1/SLC22A12; the dysfunctional
  R377C variant lowers serum urate and reduces gout risk, making OAT10 a candidate
  urate-lowering drug target. It is strongly expressed in kidney, with weaker expression
  in brain, heart and intestine, and its nicotinate uptake feeds the NAD+ salvage pathway.
