  qualifier: located_in
  review:
    summary: ER signal of an overexpressed ORCTL3-ECFP fusion reflects biosynthetic
      transit of a plasma-membrane protein, not endogenous ER residence.
    action: MARK_AS_OVER_ANNOTATED
    reason: The ER localization comes from an over-expressed C-terminal ECFP fusion
      in HeLa cells, and the authors interpret it as the normal secretory route of a
      plasma-membrane protein ("conforms to the known internal route of plasma membrane
      proteins"). Per the ER policy, transit of an overexpressed protein is not residence;
      there is no evidence of the endogenous OAT10 functioning at the ER in its native
      renal cell. The functional location is the apical plasma membrane.
