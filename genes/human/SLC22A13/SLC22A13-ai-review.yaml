core_functions:
- description: Apical renal urate transmembrane transport. OAT10 takes up urate across
    the apical (brush-border) membrane of proximal tubule epithelial cells by anion
    exchange, acting as a renal urate re-absorber (URAT1-like); loss of function (R377C)
    lowers serum urate and gout risk.
