- term:
    id: GO:0015297
    label: antiporter activity
  evidence_type: IDA
  original_reference_id: PMID:18411268
  qualifier: enables
  review:
    summary: Proposed new annotation - OAT10 is an anion antiporter (urate/orotate/nicotinate
      taken up in exchange for intracellular anions), the mechanistic core absent from
      GOA.
    action: NEW
    reason: >-
      OAT10's defining mechanism is Na(+)-independent anion exchange: urate uptake is
      trans-stimulated by, and exchanged for, intracellular anions such as (S)-lactate,
      succinate, glutathione and nicotinate (PMID:18411268), and UniProt curates five
      anion-exchange catalytic activities (urate/(S)-lactate, urate/succinate, urate/glutathione,
      nicotinate/urate, orotate/carboxylate). GO:0015297 antiporter activity is the live,
      non-obsolete mechanism term (the organic-anion grouping terms GO:0008514/GO:0015347/GO:0015301
      are obsolete and deliberately avoided). The mechanism is absent from GOA and is
      added as a conservative NEW annotation.
    supported_by:
    - *uni_func
    - reference_id: PMID:18411268
      supporting_text: 'Surprisingly, we have detected urate(-)/glutathione exchange
        by hOAT10, consistent with an involvement of hOAT10 in the renal glutathione
        cycle.'
