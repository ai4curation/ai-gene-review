proposed_new_terms:
- proposed_name: orotate transmembrane transporter activity
  proposed_definition: Enables the transfer of orotate from one side of a membrane to
    the other.
  justification: Human OAT10/SLC22A13 transports orotate across the apical membrane
    of renal proximal tubule cells with saturable, biphasic, Cl(-)-dependent kinetics
    (PMID:35144162), and UniProt curates an orotate/carboxylate antiport catalytic activity
    (Rhea:73487). No GO molecular-function term for orotate transport exists (QuickGO
    search returns none), and the organic-anion grouping terms are obsolete. A specific
    orotate transmembrane transporter activity term, as a child of monocarboxylic acid
    transmembrane transporter activity, would capture this well-characterized substrate.
  proposed_parent:
    id: GO:0008028
    label: monocarboxylic acid transmembrane transporter activity
suggested_questions:
- question: What is the physiological direction and electrochemical driving force of
    OAT10 in vivo? OAT10 operates as an anion exchanger, but which intracellular counter-anions
    (lactate, succinate, glutathione, nicotinate) predominantly drive apical urate and
    orotate reabsorption under physiological conditions, and how is the reported Cl(-)-dependence
    of urate/orotate transport integrated into the exchange model?
- question: How much of the URAT1-independent renal urate reabsorption is attributable
    to OAT10, and does OAT10 functionally compensate for URAT1 loss as UniProt proposes?
suggested_experiments:
- description: Generate Slc22a13-knockout and humanized (R377C knock-in) mouse models
    and quantify fractional excretion of uric acid and serum urate, alone and on a Urat1-null
    background, to measure OAT10's in vivo contribution to renal urate reabsorption.
- description: Reconstitute purified human OAT10 in proteoliposomes preloaded with defined
    counter-anions and measure urate, orotate and nicotinate uptake while independently
    varying trans-side anion, pH and chloride, to establish the exchange stoichiometry
    and the basis of Cl(-)-dependence and orotate's biphasic kinetics.
- description: Determine whether endogenous SLC22A13 physiologically regulates SCD1/fatty-acid
    desaturation in native kidney or other tissues (versus the overexpression anticancer
    phenotype) using tagged-endogenous co-immunoprecipitation and lipidomics in OAT10-expressing
    primary renal cells.
