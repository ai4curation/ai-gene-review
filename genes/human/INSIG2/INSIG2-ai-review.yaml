    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:12242332
  qualifier: enables
  supporting_entities:
  - UniProtKB:P97260
  review:
    summary: Sterol-dependent binding of INSIG2 to SCAP (UniProtKB:P97260), the interaction that holds SCAP-SREBP
      in the ER.
    action: MODIFY
    reason: The interaction is real and is the core mechanism of this protein, but protein binding is uninformative.
      Binding to sterol-loaded SCAP prevents COPII from engaging SCAP and keeps SCAP-SREBP in the ER, which is what
      GO:0140311 protein sequestering activity describes; that term is already supported by IDA rows for this gene
      and by GO-CAM 6205c24300000880. Judged identically in the INSIG1 review (shared PAINT node / paralog function).
    proposed_replacement_terms:
    - &id001
      id: GO:0140311
      label: protein sequestering activity
    supported_by:
    - reference_id: PMID:12242332
      supporting_text: insig-2 binds to the SCAP/SREBP-2 complex only in the presence of sterols
