- term:
    id: GO:0006357
    label: regulation of transcription by RNA polymerase II
  evidence_type: NAS
  original_reference_id: PMID:12242332
  qualifier: involved_in
  review:
    summary: Regulation of RNA polymerase II transcription inferred from the effect of INSIGs on SREBP processing.
    action: MARK_AS_OVER_ANNOTATED
    reason: INSIGs are ER membrane proteins with no nuclear role. They change SREBP target-gene transcription only
      indirectly, by holding SCAP-SREBP in the ER and preventing proteolytic release of the SREBP transcription
      factor domain. That upstream effect is captured by GO:0036316 and GO:0032933; a transcription-regulation process
      term overstates the participation. Judged identically in the INSIG1 review (shared PAINT node / paralog function).
    supported_by:
    - reference_id: PMID:12242332
      supporting_text: By blocking this movement, insig-2, like the previously described insig-1, prevents the proteolytic
        processing of SREBPs by Golgi enzymes, thereby blocking cholesterol synthesis.
- term:
    id: GO:0006695
    label: cholesterol biosynthetic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:1916289
  - MGI:MGI:1920249
  - PANTHER:PTN001033847
  - UniProtKB:O15503
  - UniProtKB:Q9Y5U4
  review:
    summary: Annotated to cholesterol biosynthetic process; INSIGs restrain, rather than carry out, cholesterol
      synthesis.
    action: MODIFY
    reason: 'INSIGs perform no step of cholesterol synthesis or metabolism. They lower it by retaining SCAP-SREBP
      in the ER (so less SREBP-driven transcription of sterol-synthesis genes) and by adapting HMGCR to ER-associated
      degradation. The sound essence is regulatory, with a negative sign: GO:0045541 negative regulation of cholesterol
      biosynthetic process. For the IBA row, the node placement (PTN001033847, vertebrate INSIGs) is not disputed,
      only the relation of the protein to the process. Judged identically in the INSIG1 review (shared PAINT node
      / paralog function).'
    proposed_replacement_terms:
    - &id003
      id: GO:0045541
      label: negative regulation of cholesterol biosynthetic process
    supported_by:
    - reference_id: PMID:12242332
      supporting_text: By blocking this movement, insig-2, like the previously described insig-1, prevents the proteolytic
        processing of SREBPs by Golgi enzymes, thereby blocking cholesterol synthesis.
    - reference_id: PMID:12535518
      supporting_text: degradation of HMG CoA reductase is accelerated by the sterol-induced binding of its sterol-sensing
        domain to the ER protein insig-1
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - ROLE_CONFLATION
      source_entities:
      - source_id: MGI:MGI:1916289
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: Mouse knockout genetic evidence (IGI acts_upstream_of_or_within per QuickGO) shows necessity for
          normal sterol control, not that INSIG performs a biosynthetic step.
      - source_id: MGI:MGI:1920249
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: Mouse knockout genetic evidence (IGI acts_upstream_of_or_within per QuickGO) shows necessity for
          normal sterol control, not that INSIG performs a biosynthetic step.
      - source_id: PANTHER:PTN001033847
        source_status: SUPPORTS_TRANSFER
        comment: Vertebrate INSIG1/INSIG2 node; the target is inside the clade and the paralogs share the function.
          The issue is the relation to the process (regulator, not participant), not node placement.
      - source_id: UniProtKB:O15503
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Human INSIG experimental row for this term; the biology supports negative regulation of cholesterol
          synthesis rather than participation.
      - source_id: UniProtKB:Q9Y5U4
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Human INSIG experimental row for this term; the biology supports negative regulation of cholesterol
          synthesis rather than participation.
