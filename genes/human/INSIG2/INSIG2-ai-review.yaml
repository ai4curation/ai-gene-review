id: Q9Y5U4
gene_symbol: INSIG2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: INSIG2 (insulin-induced gene 2) is a polytopic, six-transmembrane protein of the endoplasmic reticulum
  membrane, a paralog of INSIG1 (59% identity), and a sterol sensor in feedback control of lipid synthesis. It binds
  oxysterols such as 25-hydroxycholesterol; a cryo-EM structure of human SCAP-INSIG2 shows 25-hydroxycholesterol
  bound between SCAP and INSIG2 transmembrane helices 3 and 4. Sterol-loaded INSIG2 binds SCAP and retains the SCAP-SREBP
  complex in the ER, preventing COPII-dependent export and Golgi processing of SREBP-1 and SREBP-2. Unlike INSIG1,
  INSIG2 is expressed independently of nuclear SREBPs and acts only when sterols are present, so it maintains retention
  when SREBP activity and INSIG1 levels are low. A liver-specific Insig-2a transcript is repressed by insulin, which
  may permit SREBP-1c processing for lipogenesis. INSIG2 also mediates sterol-induced binding of HMG-CoA reductase
  to the ER ubiquitin ligases TRC8/RNF139 and RNF145 for ER-associated degradation (it binds gp78 poorly). In hepatocellular
  carcinoma cells, phosphorylation at Ser151 by PCK1 has been reported to reduce sterol binding.
