      supporting_text: Alanine substitution of the corresponding aspartic acid in Insig-2 produced the same dual
        defects.
    - reference_id: PMID:29374057
      supporting_text: RNF145 interacts with Insig-1 and -2 proteins and ubiquitinates HMGCR
