- term:
    id: GO:0008142
    label: oxysterol binding
  evidence_type: IDA
  original_reference_id: PMID:17428920
  qualifier: enables
  review:
    summary: INSIG2 binds oxysterols such as 25-hydroxycholesterol, which triggers binding to SCAP.
    action: ACCEPT
    reason: Core activity. Oxysterols act by binding to Insigs (direct binding assays, TM3/TM4 mutants), and a cryo-EM
      structure of human SCAP-INSIG2 shows 25-hydroxycholesterol bound between SCAP and INSIG TM3/TM4. Accepted
      in both paralog reviews.
    supported_by:
    - reference_id: PMID:17428920
      supporting_text: Here, we show that oxysterols act by binding to Insigs, causing Insigs to bind to Scap.
    - reference_id: PMID:17428920
      supporting_text: These studies define Insigs as oxysterol-binding proteins, explaining the long-known ability
        of oxysterols to inhibit cholesterol synthesis in animal cells.
    - reference_id: PMID:33446483
      supporting_text: A 25HC molecule is sandwiched between the S4 to S6 segments in Scap and TMs 3 and 4 in Insig-2
        in the luminal leaflet of the membrane.
    - reference_id: PMID:17428920
      supporting_text: Mutational analysis of the six transmembrane helices of Insigs reveals that the third and
        fourth are important for Insig's binding to oxysterols and to Scap.
