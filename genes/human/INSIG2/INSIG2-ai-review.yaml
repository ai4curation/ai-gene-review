suggested_questions:
- question: Is INSIG2 itself a substrate of TRC8/RNF139-dependent ubiquitination, and does this contribute to insulin-induced
    reduction of INSIG2 protein in liver (PMID:22143767 raises this possibility)?
- question: Why does INSIG2 have an absolute sterol requirement for SCAP binding while INSIG1 at high levels can
    retain SCAP without added sterols? Is the shorter N-terminus of INSIG2 responsible?
- question: Is there a suitable GO biological-process term for sterol-regulated ERAD of HMGCR (not quality control
    of misfolded proteins)?
suggested_experiments:
- description: Swap the N-terminal cytosolic segments of INSIG1 and INSIG2 and measure sterol-independent SCAP retention
    and SCAP affinity in INSIG-deficient (SRD-15) cells.
  experiment_type: domain swap / cell biology
  hypothesis: The INSIG1 N-terminus confers sterol-independent SCAP retention at high expression.
- description: Measure INSIG2 ubiquitination and half-life in hepatocytes after TRC8 or RNF145 knockout, with and
    without insulin.
  experiment_type: genetic perturbation / protein turnover
  hypothesis: TRC8 ubiquitinates INSIG2 and contributes to its insulin-regulated turnover.
