- term: &id005
    id: GO:1990756
    label: ubiquitin-like ligase-substrate adaptor activity
  evidence_type: IDA
  original_reference_id: PMID:22143767
  review:
    summary: INSIG2 links sterol-loaded HMGCR to the TRC8 ubiquitin ligase for sterol-accelerated ERAD.
    action: NEW
    reason: Parallels the INSIG1 rows MODIFIED to this term. Both Insigs bind TRC8, and RNAi shows that HMGCR-Trc8
