  evidence_type: IMP
  original_reference_id: PMID:18364389
  qualifier: involved_in
  negated: true
  review:
    summary: NOT axonal transport, based on the absence of detectable transport inhibition in G59S p150Glued
      transgenic mice.
    action: REMOVE
    reason: The experiment shows that one disease allele does not measurably impair bulk axonal transport
      in this model; it does not show that DCTN1 is not involved in axonal transport. Dynactin is widely
      documented as essential for dynein-driven (retrograde) axonal transport, and even the G59S study
      authors interpret a subtle loss of function as affecting retrograde axonal transport. The negative
      assertion is contradicted by the broader evidence.
