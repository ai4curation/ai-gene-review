- term:
    id: GO:0140660
    label: cytoskeletal motor activator activity
  evidence_type: IDA
  original_reference_id: PMID:25035494
  qualifier: contributes_to
  review:
    summary: Dynactin (with p150Glued as its dynein- and microtubule-binding projection) activates processive
      motility of mammalian cytoplasmic dynein together with cargo adaptors such as BICD2.
    action: NEW
    reason: Purified mammalian dynein alone is poorly processive; dynein-dynactin-BICD2 complexes move
      robustly and processively, and BICD2 alone does not stimulate motility without dynactin. This dynein-activating
      function is the central molecular role of dynactin and is not represented in the existing annotation
      set. Because activation is a property of the whole dynactin complex, this is best asserted as contributes_to
      for DCTN1.
    supported_by:
    - reference_id: PMID:25035494
      supporting_text: The addition of BicD2 to purified brain dynein did not stimulate processive motility,
        indicating a requirement for dynactin
    - reference_id: PMID:25035494
      supporting_text: In contrast to brain dynein, the DDB complexes moved robustly and processively
        along MTs
    - reference_id: PMID:38547289
      supporting_text: DIC-N opens dynactin’s p150 arm for LIS1 and dynein binding
    - reference_id: file:human/DCTN1/DCTN1-uniprot.txt
      supporting_text: Part of the dynactin complex that activates the molecular motor dynein for ultra-processive
        transport along microtubules
    - reference_id: file:human/DCTN1/DCTN1-deep-research-falcon.md
      supporting_text: Many organelle and mitotic functions are established for dynactin as a whole and
        should not be over-annotated as independent p150–cargo interactions.
