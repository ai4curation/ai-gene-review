- term:
    id: GO:0000132
    label: establishment of mitotic spindle orientation
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000431881
  - UniProtKB:Q14203
  - WB:WBGene00001017
  review:
    summary: IBA for establishment of mitotic spindle orientation; dynein-dynactin anchored at the cell
      cortex pulls on astral microtubules to orient the spindle, and human p150Glued has direct experimental
      support.
    action: ACCEPT
    reason: The PAINT node placement is consistent with conserved cortical dynein-dynactin function in
      spindle positioning (yeast, worm and human data). Human DCTN1 carries its own IMP (PMID:22327364),
      so the IBA reflects inherited function.
    supported_by:
    - reference_id: file:human/DCTN1/DCTN1-uniprot.txt
      supporting_text: Plays a role in metaphase spindle orientation
    - reference_id: PMID:22327364
      supporting_text: We find that this signal comprises the spindle-pole-localized polo-like kinase
        (Plk1), which regulates dynein localization by controlling the interaction between dynein-dynactin
        and its upstream cortical targeting factors NuMA and LGN.
