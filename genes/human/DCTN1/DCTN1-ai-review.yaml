- term:
    id: GO:0000278
    label: mitotic cell cycle
  evidence_type: NAS
  original_reference_id: PMID:1828535
  qualifier: involved_in
  review:
    summary: NAS to the broad term mitotic cell cycle from the original cloning paper of p150Glued.
    action: MARK_AS_OVER_ANNOTATED
    reason: The 1991 paper cloned the dynein-associated 150K polypeptide and only speculated about dynein
      roles in mitosis; more specific, experimentally supported mitotic processes (spindle orientation,
      prophase nuclear envelope breakdown) are annotated separately. The generic cell-cycle term adds
      little.
    supported_by:
    - reference_id: PMID:1828535
      supporting_text: It is thought to be responsible for retrograde axonal transport and other aspects
        of organelle motility and may have a role in the poleward movement of mitotic chromosomes.
