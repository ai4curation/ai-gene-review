    - reference_id: file:human/DCTN1/DCTN1-deep-research-falcon.md
      supporting_text: The best-defined specialized role is initiation and support of fast retrograde
        axonal transport.
    - reference_id: PMID:16505168
      supporting_text: This subtle loss of function does not significantly perturb nonneuronal cells but
        may be sufficient to affect the overall efficiency of retrograde axonal transport in neurons.
