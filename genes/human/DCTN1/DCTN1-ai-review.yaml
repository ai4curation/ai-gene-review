core_functions:
- description: As the dynein-binding subunit of dynactin, p150Glued contributes to activation of cytoplasmic
    dynein-1 into a processive minus-end-directed motor that transports membranous cargoes and organelles
    along microtubules.
  contributes_to_molecular_function:
    id: GO:0140660
    label: cytoskeletal motor activator activity
  directly_involved_in:
  - id: GO:0042147
    label: retrograde transport, endosome to Golgi
  - id: GO:0007097
    label: nuclear migration
  locations:
  - id: GO:0005829
    label: cytosol
  - id: GO:0035371
    label: microtubule plus-end
  - id: GO:0005635
    label: nuclear envelope
  in_complex:
    id: GO:0005869
    label: dynactin complex
  supported_by:
  - reference_id: file:human/DCTN1/DCTN1-uniprot.txt
    supporting_text: Part of the dynactin complex that activates the molecular motor dynein for ultra-processive
      transport along microtubules
  - reference_id: PMID:25035494
    supporting_text: The addition of BicD2 to purified brain dynein did not stimulate processive motility,
      indicating a requirement for dynactin
  - reference_id: PMID:19935774
    supporting_text: recruitment of the motor complex to the membrane-associated retromer requires the
      SNX6-p150(Glued) interaction
  - reference_id: PMID:19874786
    supporting_text: Our results indicate that the SUN-KASH complexes mediate the coupling between the
      nucleus and the centrosome, and provide anchors in the NE for cytoplasmic dynein/dynactin during
      neuronal migration.
- description: The p150Glued CAP-Gly and basic domains bind microtubules, tubulin and +TIPs, tethering
    dynein-dynactin to microtubule plus ends and, in neurons, promoting microtubule nucleation and suppressing
    catastrophe.
  molecular_function:
    id: GO:0008017
    label: microtubule binding
  directly_involved_in:
  - id: GO:0031116
    label: positive regulation of microtubule polymerization
  - id: GO:0090063
    label: positive regulation of microtubule nucleation
  locations:
  - id: GO:0035371
    label: microtubule plus-end
  - id: GO:0030424
    label: axon
  supported_by:
  - reference_id: file:human/DCTN1/DCTN1-uniprot.txt
    supporting_text: Inhibits microtubule catastrophe by binding both to microtubules and to tubulin,
      leading to enhanced microtubule stability along the axon
  - reference_id: PMID:23874158
    supporting_text: Here, we demonstrate in vitro using assembly assays and TIRF microscopy, and in primary
      neurons using live-cell imaging, that p150(Glued) is a potent anti-catastrophe factor for microtubules.
  - reference_id: PMID:16505168
    supporting_text: we observed the binding of only half of the mutant p150Glued polypeptide to microtubules,
      suggesting that some portion of the mutant protein population is unavailable for binding to microtubules.
- description: Cortical and spindle-associated dynein-dynactin positions and orients the mitotic spindle;
    p150Glued localizes asymmetrically to the metaphase cortex under Plk1/NuMA-LGN control.
  contributes_to_molecular_function:
    id: GO:0140660
    label: cytoskeletal motor activator activity
  directly_involved_in:
  - id: GO:0000132
    label: establishment of mitotic spindle orientation
  locations:
  - id: GO:0005938
    label: cell cortex
  - id: GO:0000776
    label: kinetochore
  - id: GO:0000922
    label: spindle pole
  in_complex:
    id: GO:0005869
    label: dynactin complex
  supported_by:
  - reference_id: PMID:22327364
    supporting_text: We find that this signal comprises the spindle-pole-localized polo-like kinase (Plk1),
      which regulates dynein localization by controlling the interaction between dynein-dynactin and its
      upstream cortical targeting factors NuMA and LGN.
  - reference_id: file:human/DCTN1/DCTN1-uniprot.txt
    supporting_text: Plays a role in metaphase spindle orientation
- description: A pool of p150Glued at mother-centriole subdistal appendages, recruited by KIF3A, anchors
    microtubules at the centrosome.
  molecular_function:
    id: GO:0008017
    label: microtubule binding
  directly_involved_in:
  - id: GO:0034454
    label: microtubule anchoring at centrosome
  locations:
  - id: GO:0005814
    label: centriole
  in_complex:
    id: GO:0120103
    label: centriolar subdistal appendage
  supported_by:
  - reference_id: PMID:23386061
    supporting_text: Kif3a recruits p150(Glued) to the subdistal appendages of mother centrioles, critical
      for centrosomes to function as microtubule-organizing centres.
  - reference_id: file:human/DCTN1/DCTN1-uniprot.txt
    supporting_text: Also required for microtubule anchoring at the mother centriole
suggested_questions:
- question: Should DCTN1 carry an explicit contributes_to cytoskeletal motor activator activity (GO:0140660)
    annotation, given that dynein activation is a property of the assembled dynactin complex with a cargo
    adaptor?
  experts:
  - GO molecular function editors
  - dynein/dynactin biochemists
- question: Is the NOT axonal transport annotation (PMID:18364389) intended to capture only that the G59S
    allele does not impair bulk transport, and should it be withdrawn given that dynactin is required
    for retrograde axonal transport initiation?
  experts:
  - GO annotation QC
  - neuronal transport experts
- question: Which nucleokinesis contexts (radial migration, interkinetic nuclear migration, neural crest)
    have direct DCTN1-specific evidence, as opposed to evidence from dynactin disruption by dynamitin
    overexpression?
  experts:
  - neuronal migration biologists
suggested_experiments:
- description: Acute degron-mediated depletion of DCTN1 in migrating cortical neurons with live imaging
    of nucleus-centrosome coupling, rescued by p150 or p135 isoforms and by a CAP-Gly mutant.
  hypothesis: Nuclear translocation in neuronal nucleokinesis requires the dynein-activating function
    of dynactin but not the CAP-Gly microtubule-binding domain.
  experiment_type: live imaging with isoform rescue
- description: Single-molecule reconstitution of dynein-dynactin-BICD2 on nesprin-2-decorated membranes
    with p150 variants lacking CAP-Gly or CC1.
  hypothesis: p150 CC1 and the dynein-binding region are required for nuclear-envelope-anchored dynein
    force generation.
  experiment_type: in vitro reconstitution
