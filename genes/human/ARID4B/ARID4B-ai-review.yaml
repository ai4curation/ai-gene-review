  review:
    summary: IBA annotation over-propagated from Opisthokont node PTN000359478 seeded solely by human ARID5B.
    action: REMOVE
    reason: ARID4B (carrying Ser376 in place of the ARID5 Thr388 major-groove AT-recognition residue) belongs to the sequence-nonspecific ARID4 clade; both its ARID domain and its interdigitated double Tudor domain (aa 4-121, Glu50 + RGR extension) bind DNA electrostatically without cis-regulatory sequence specificity.
    supported_by:
    - reference_id: PMID:15640446
      supporting_text: The results indicate that the majority of ARID subfamilies (i.e. five out of seven) bind DNA without obvious sequence preference.
    - reference_id: PMID:33675746
      supporting_text: Structure determination and DNA titration analysis indicated that the ARID4B Tudor domain is also an interdigitated double Tudor domain with a DNA-binding surface similar to ARID4A.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN000359478
        source_label: PTN000359478
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Seeded solely by human ARID5B (UniProtKB:Q14865, PTHR13964:SF37) on the Opisthokont root PTN000359478; human ARID4B (PTHR13964:SF24) lacks the ARID5 Loop-L2/Helix-5 AT-selective motif (Ser376 vs Thr388) and engages dsDNA non-specifically.
- term:
    id: GO:0003677
    label: DNA binding
  evidence_type: EXP
  original_reference_id: PMID:33675746
  qualifier: enables
  review:
    summary: EXP annotation (PMID:33675746) for DNA binding.
    action: ACCEPT
    reason: Solution NMR and mutagenesis in Ren et al. 2021 (PMID:33675746) directly demonstrate non-specific DNA binding by the human ARID4B N-terminal interdigitated double Tudor domain (modulated by Glu50 salt bridges and a basic RGR C-terminal tail), alongside its conserved central ARID domain.
    supported_by:
    - reference_id: PMID:33675746
      supporting_text: Structure determination and DNA titration analysis indicated that the ARID4B Tudor domain is also an interdigitated double Tudor domain with a DNA-binding surface similar to ARID4A.
    - reference_id: PMID:33675746
      supporting_text: The Leu50 in ARID4A is Glu50 in ARID4B, and the latter forms salt bridges with two lysine residues at the DNA-binding surface. This causes a decrease in the strength of positive charge, thus reducing DNA-binding affinity while significantly increasing protein stability. We also found that a C-terminal extension region enhances the DNA-binding affinity of the ARID4B Tudor domain.
