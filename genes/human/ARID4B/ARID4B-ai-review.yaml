id: Q4LE39
gene_symbol: ARID4B
aliases:
- RBP1L1
- RBBP1L1
- SAP180
- BCAA
- BRCAA1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Multidomain nuclear chromatin-regulatory scaffold (~1312 aa; paralog of ARID4A lacking the canonical LXCXE RB1 pocket-binding motif) containing an N-terminal interdigitated double Tudor dsDNA-binding domain with a basic RGR extension, a sequence-nonspecific central ARID domain, a chromobarrel domain, an N-terminal HDAC-independent repression region, and a C-terminal mSin3A-binding R2 domain. Functions as a selective HDAC1-associated subunit of the mammalian Sin3A corepressor complex required for embryonic stem cell differentiation, partners with ARID4A to maintain genomic imprinting at the PWS/AS locus and suppress myeloid leukemogenesis, and acts as a context-dependent transcriptional coactivator/activator for the androgen receptor in Sertoli cells and by antagonizing linker histone H1 at PIK3CA and PIK3R2 promoters.
core_functions:
- description: Subunit of the nucleoplasmic mSin3A-HDAC1 histone deacetylase corepressor complex that represses and remodels RNA polymerase II transcriptional programs during lineage commitment and genomic imprinting.
  molecular_function:
    id: GO:0003714
    label: transcription corepressor activity
  in_complex:
    id: GO:0070822
    label: Sin3-type complex
  locations:
  - id: GO:0005654
    label: nucleoplasm
  directly_involved_in:
  - id: GO:0000122
    label: negative regulation of transcription by RNA polymerase II
  - id: GO:0006357
    label: regulation of transcription by RNA polymerase II
  supported_by:
  - reference_id: PMID:12724404
    supporting_text: 'We have purified an mSin3A complex from K562 erythroleukemia cells and identified three new mSin3A-associated proteins (SAP): SAP180, SAP130, and SAP45.'
  - reference_id: PMID:12724404
    supporting_text: 'SAP180 has two repression domains: a C-terminal domain, which interacts with the mSin3A-HDAC complex, and an N-terminal domain, which functions independently of mSin3A-HDAC.'
  - reference_id: PMID:33454011
    supporting_text: We identified a physical and functional interaction of ARID4B with HDAC1 rather than HDAC2, suggesting functionally distinct Sin3a subcomplexes might regulate cell fate decisions
  - reference_id: file:human/ARID4B/ARID4B-deep-research-affinage.md
    supporting_text: Within the SIN3A complex, ARID4B interacts specifically with HDAC1 (and not HDAC2) and with the corepressor components mSIN3A/mSDS3, and its activity governs the balance of H3K27 acetylation versus H3K27 trimethylation at developmental gene loci, where it is required for embryonic stem cell differentiation toward mesoderm and endoderm [PMID:33454011, PMID:22693453].
- description: Binds DNA non-specifically via its interdigitated double Tudor domain (Glu50 + basic RGR tail) and ARID domain and antagonizes linker histone H1 promoter occupancy or coactivates androgen receptor targets to regulate RNA polymerase II transcription.
  molecular_function:
    id: GO:0003677
    label: DNA binding
  locations:
  - id: GO:0005654
    label: nucleoplasm
  directly_involved_in:
  - id: GO:0006357
    label: regulation of transcription by RNA polymerase II
  supported_by:
  - reference_id: PMID:33675746
    supporting_text: Structure determination and DNA titration analysis indicated that the ARID4B Tudor domain is also an interdigitated double Tudor domain with a DNA-binding surface similar to ARID4A.
  - reference_id: PMID:31551414
    supporting_text: Reciprocal binding of ARID4B and histone H1 to the PIK3CA and PIK3R2 promoters modulates chromatin condensation, suggesting a mechanism by which ARID4B activates these promoters.
  - reference_id: PMID:23487765
    supporting_text: Our results thus indicate that ARID4A and ARID4B function as transcriptional coactivators for AR and RB and play an integral part in the AR and RB regulatory pathways involved in the regulation of Sertoli cell function and male fertility.
