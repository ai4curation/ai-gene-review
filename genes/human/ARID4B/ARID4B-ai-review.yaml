      resource: OTHER
      record: https://affinage.wi.mit.edu/api/gene/ARID4B
      slot: current_model
      requested_change: CHECK
      asserted_value: In cancer, ARID4B binds directly to the promoters of PI3K pathway genes — PIK3CA, PIK3R2, and mTOR — where it competes with histone H1 to modulate chromatin condensation and deposits activating H3K27ac, thereby driving PI3K/AKT/mTOR signaling
      cause: SPECULATION_AS_ASSERTION
      confidence: CONFIRMED
      explanation: ARID4B has no acetyltransferase catalytic domain and does not deposit H3K27ac; Wu et al. 2019 (PMID:31551414) explicitly demonstrated that ARID4B ablation increases histone H1 binding at PIK3CA and PIK3R2 promoters without affecting H4Ac, H3K27Ac, or H3K4me3.
      supported_by:
      - reference_id: PMID:31551414
        supporting_text: ChIP-qPCR analyses showed that ablation of ARID4B increased binding of histone H1 to the PIK3CA and PIK3R2 promoters (Fig. 2d) without affecting histone H4 acetylation (H4Ac), H3 lysine 27 acetylation (H3K27Ac), or H3 lysine 4 trimethylation (H3K4me3)
    - defect_type: MISSING_STATEMENT
      resource: OTHER
      record: https://affinage.wi.mit.edu/api/gene/ARID4B
      slot: citations
