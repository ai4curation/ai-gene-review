knowledge_gaps:
- gap_statement: The direct histone-mark specificity of the human ARID4B chromobarrel domain and the molecular determinant that recruits ARID4B selectively to PIK3CA/PIK3R2 and mTOR promoters despite sequence-nonspecific Tudor/ARID DNA binding remain unresolved.
  boundary: NMR structure and dsDNA titration of the ARID4B Tudor domain (PMID:33675746) and ChIP-seq occupancy at PIK3CA/PIK3R2 TSSs (PMID:31551414) are established, whereas isolated ARID4B chromobarrel peptide affinities and sequence-specific recruiting TF partners at PI3K promoters have not been biochemically mapped.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: Explains how ARID4B achieves locus-selective chromatin decompaction in PTEN-deficient prostate cancer without an LXCXE RB1 motif or sequence-specific ARID head.
suggested_questions:
- question: Which sequence-specific transcription factor recruits ARID4B to the TSSs of PIK3CA and PIK3R2 in PTEN-deficient prostate cancer cells to displace linker histone H1?
- question: What structural interface of ARID4B mediates its selective association with HDAC1 over HDAC2 within mESC SIN3A complexes?
suggested_experiments:
- description: Perform ITC and solution NMR titrations of the purified human ARID4B chromobarrel and ARID domains against H4K20me3, H3K9me3, H3K27me3, and H3K4me3 peptides in the presence and absence of nucleosomal DNA.
- description: Use rapid immunoprecipitation mass spectrometry of endogenous proteins (RIME) for ARID4B at chromatin in PTEN-null PC3 cells to identify the recruiting transcription factor at PIK3CA/PIK3R2 promoters.
