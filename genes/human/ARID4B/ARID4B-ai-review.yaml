  title: Affinage mechanistic annotation for ARID4B (human, UniProtKB:Q4LE39)
  findings:
  - statement: Summarizes selective ARID4B-HDAC1 interaction within SIN3A complexes during mESC differentiation alongside PWS/AS imprinting and Sertoli AR coactivation.
    supporting_text: Within the SIN3A complex, ARID4B interacts specifically with HDAC1 (and not HDAC2) and with the corepressor components mSIN3A/mSDS3, and its activity governs the balance of H3K27 acetylation versus H3K27 trimethylation at developmental gene loci, where it is required for embryonic stem cell differentiation toward mesoderm and endoderm [PMID:33454011, PMID:22693453].
  reference_review:
    relevance: HIGH
    correctness: LOW_QUALITY
    review_notes: Correctly targets UniProtKB:Q4LE39 and covers mouse genetic studies on PWS/AS imprinting (PMID:17043311), AML suppression (PMID:18728284), Sertoli AR coactivation (PMID:23487765, PMID:26258622, PMID:28207192), and SIN3A-HDAC1 pluripotency exit (PMID:33454011). However, its Current model fabricates a non-existent enzymatic histone acetyltransferase function ('deposits activating H3K27ac' at PIK3CA/PIK3R2 promoters) that is directly contradicted by ChIP-qPCR controls in PMID:31551414, and it omits both the foundational biochemical purification of SAP180/ARID4B in the human mSin3A complex (PMID:12724404) and the NMR structure of the human ARID4B Tudor DNA-binding domain (PMID:33675746).
