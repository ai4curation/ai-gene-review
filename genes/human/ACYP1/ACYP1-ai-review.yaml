  label: Homo sapiens
description: >-
  ACYP1 is the organ-common/erythrocyte isozyme of acylphosphatase, a small
  soluble enzyme that hydrolyzes carboxyl-phosphate bonds in acyl phosphates.
  It shares the ancient acylphosphatase fold and EC 3.6.1.7 reaction with the
  muscle-type paralog ACYP2. Red-cell Ca2+-ATPase phosphoenzyme is a supported
  candidate substrate, and the dominant physiological acyl-phosphate substrate
  remains unresolved.
