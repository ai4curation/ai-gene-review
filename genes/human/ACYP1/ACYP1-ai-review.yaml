- id: PMID:1645713
  title: Effects of acylphosphatase on the activity of erythrocyte membrane Ca2+
    pump.
  findings:
  - statement: >-
      Human erythrocyte acylphosphatase hydrolyzes the red-cell membrane
      Ca2+-ATPase phosphoenzyme intermediate at physiological enzyme amounts,
      increases ATP hydrolysis about twofold and reduces the Ca2+/ATP
      coupling ratio from 2.04 to 0.9.
    supporting_text: >-
      Acylphosphatase addition to red cell membranes resulted in a
      significant increase in the rate of ATP hydrolysis. Maximal
      stimulation (about 2-fold over basal) was obtained at 2 units/mg
      membrane protein
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract-only cache. The abstract directly studies acylphosphatase
      purified from human erythrocytes and supports red-cell membrane
      Ca2+-ATPase phosphoenzyme as a plausible ACYP1 substrate.
