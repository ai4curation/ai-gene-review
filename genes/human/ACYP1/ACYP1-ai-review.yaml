proposed_new_terms: []
knowledge_gaps:
- gap_statement: >-
    How much ACYP1 flux in intact human cells runs through Ca2+-ATPase
    phosphoenzyme, 1,3-bisphosphoglycerate or other acyl-phosphate substrates
    remains unresolved.
  boundary: >-
    Human erythrocyte ACYP1 hydrolyzes the red-cell membrane Ca2+-ATPase
    phosphoenzyme in vitro at enzyme amounts within the physiological range
    (PMID:1645713), and acylphosphatases can hydrolyze 1,3-bisphosphoglycerate
    to 3-phosphoglycerate in the glycolytic phosphoglycerate kinase reaction.
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  status: OPEN
  significance: >-
    Separating ACYP1's red-cell pump, glycolytic and other candidate
    substrates will determine which process, if any, is the dominant
    physiological output of the organ-common isozyme.
  resolution: >-
    Combine substrate-targeted metabolomics and direct pump-phosphoenzyme
    turnover assays in ACYP1-deficient and rescue human erythroid or other
    ACYP1-expressing cells.
  provenance:
  - reference_id: PMID:16511269
    supporting_text: The biological role of acylphosphatase is not fully understood.
suggested_questions:
- question: >-
    Does ACYP1 measurably uncouple red-cell Ca2+-ATPase or alter
    1,3-bisphosphoglycerate flux in intact cells, and are either of those
    activities dominant in tissues that express the organ-common isozyme?
suggested_experiments:
- description: >-
    Compare acyl-phosphate pools, Ca2+-ATPase phosphoenzyme turnover and ATPase
    coupling in ACYP1 knockout and matched rescue erythroid cells using
    wild-type ACYP1 and variants of the UniProt-annotated active-site residues
    24 and 42.
status: COMPLETE
