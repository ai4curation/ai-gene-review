    supporting_text: which regulate the level of HGF-induced Rac activation and promote cortical cytoskeletal
      remodeling via IQGAP1-Arp3/cortactin interactions.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text; endothelial cells.
