- id: PMID:17214551
  title: Asef is a Cdc42-specific guanine nucleotide exchange factor.
  findings:
  - statement: Asef is a Cdc42-specific GEF in vitro.
    supporting_text: Here we investigated the specificity and regulation of Asef by measuring its GEF
      activity in vitro and observed hardly any activity towards Rac1, Rac2 and Rac3, or RhoA and TC10.
      In contrast, various purified Asef protein fragments catalyzed the nucleotide exchange reaction
      of Cdc42.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only.
  full_text_unavailable: true
- id: PMID:17704816
  title: Release of autoinhibition of ASEF by APC leads to CDC42 activation and tumor suppression.
  findings:
  - statement: APC relieves SH3-mediated autoinhibition of ASEF to activate CDC42.
    supporting_text: Here we show that binding of the armadillo repeats of APC to a 'core APC-binding'
      (CAB) motif within ASEF, or truncation of the SH3 domain of ASEF, relieves autoinhibition, allowing
      the specific activation of CDC42.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only; structure plus cell assays.
  full_text_unavailable: true
- id: PMID:18653540
  title: Phosphorylation and activation of the Rac1 and Cdc42 GEF Asef in A431 cells stimulated by EGF.
  findings:
  - statement: Asef contributes to EGF-induced Rac1 activation.
    supporting_text: we looked for another Rac1 GEF downstream of the EGF receptor and found that Asef,
      a Rac1-Cdc42 GEF bound to the tumor suppressor APC, also contributed to EGF-induced Rac1 activation.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only; A431 cells.
  full_text_unavailable: true
- id: PMID:25492863
  title: Hepatocyte growth factor-induced Asef-IQGAP1 complex controls cytoskeletal remodeling and endothelial
    barrier.
