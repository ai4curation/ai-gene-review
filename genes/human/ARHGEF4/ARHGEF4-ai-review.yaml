id: Q9NR80
gene_symbol: ARHGEF4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ARHGEF4 (Asef) is a Dbl-family guanine nucleotide exchange factor with an N-terminal APC-binding
  region, an SH3 domain and a DH-PH catalytic module. It binds the armadillo repeats of the APC tumour
  suppressor. In vitro its DH-PH module is a Cdc42-specific GEF with little activity on Rac1-3, RhoA or
  TC10, and the SH3 domain holds it in an autoinhibited state that APC binding relieves. In cells APC-activated
  Asef promotes cell flattening, membrane ruffling and lamellipodia formation, and in colorectal cancer
  cells full-length APC activates CDC42 through Asef.
