  review:
    summary: Guanyl-nucleotide exchange factor activity (IBA). In vitro Asef catalyses nucleotide exchange
      on Cdc42 but hardly on Rac1-3, RhoA or TC10. It is autoinhibited by its SH3 domain, and APC binding
      relieves this to activate CDC42. Core function.
    action: ACCEPT
    reason: '[PMID:17214551 "Here we investigated the specificity and regulation of Asef by measuring
      its GEF activity in vitro and observed hardly any activity towards Rac1, Rac2 and Rac3, or RhoA
      and TC10. In contrast, various purified Asef protein fragments catalyzed the nucleotide exchange
      reaction of Cdc42."] [PMID:17704816 "Here we show that binding of the armadillo repeats of APC to
      a ''core APC-binding'' (CAB) motif within ASEF, or truncation of the SH3 domain of ASEF, relieves
      autoinhibition, allowing the specific activation of CDC42."]'
    supported_by:
