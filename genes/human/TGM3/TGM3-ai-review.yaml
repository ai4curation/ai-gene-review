suggested_questions:
- question: Which human cornified-envelope and hair-shaft proteins are obligatory in vivo TGM3
    substrates rather than in vitro substrates shared with TGM1 and TGM5?
- question: Which physiological protease activates the TGM3 zymogen in the upper epidermis and inner
    root sheath?
suggested_experiments:
- description: Compare crosslink-site occupancy in normal and TGM3-deficient human hair follicles to
    identify the direct TGM3-dependent structural links.
