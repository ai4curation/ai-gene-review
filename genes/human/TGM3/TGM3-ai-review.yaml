id: Q08188
gene_symbol: TGM3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'TGM3 encodes epidermal transglutaminase E, a cytoplasmic zymogen that is activated by limited
  proteolysis and calcium binding. The active enzyme catalyzes protein-glutamine gamma-glutamyltransferase
  reactions that crosslink loricrin, small proline-rich proteins, hornerin, trichohyalin and other structural
  substrates during cornified-envelope maturation and hair-shaft formation. Calcium binding converts the
  processed enzyme to an open, catalytically competent conformation, and loss-of-function TGM3 variants
  impair hair-shaft morphogenesis in uncombable hair syndrome.'
