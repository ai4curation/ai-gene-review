id: O75828
gene_symbol: CBR3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  CBR3 is the cytosolic CBR1 paralog in the human monomeric carbonyl reductase family. It
  is an NADPH-dependent short-chain dehydrogenase/reductase that reduces selected carbonyl
  and orthoquinone substrates, but direct comparisons show much narrower substrate specificity
  than CBR1 and no significant prostaglandin 9-keto reductase or 15-hydroxyprostaglandin dehydrogenase
  activity.
