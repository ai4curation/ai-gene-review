core_functions:
- description: >-
    CBR3 is a cytosolic NADPH-dependent carbonyl reductase that reduces selected carbonyl
    compounds and orthoquinones. Compared with CBR1 it has a narrow substrate profile, with
    strongest direct support for 1,2-naphthoquinone, isatin, oracin and low menadione turnover.
  molecular_function:
    id: GO:0004090
    label: carbonyl reductase (NADPH) activity
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:18493841
    supporting_text: Bacterially expressed hCBR3 exhibited limited catalytic activity
      toward menadione
  - reference_id: PMID:19841672
    supporting_text: CBR3 has narrower substrate specificity and acts on several
      orthoquinones
- description: >-
    CBR3 catalyzes NADPH-dependent reduction of selected orthoquinones to quinols, a direct
    but narrow quinone reductase activity.
  molecular_function:
    id: GO:0008753
    label: NADPH dehydrogenase (quinone) activity
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:15537833
    supporting_text: Kinetic experiments with the recombinant CBR3 protein variants and
      menadione revealed
