    label: transmembrane receptor protein tyrosine phosphatase activity
  evidence_type: TAS
  original_reference_id: PMID:8798755
  qualifier: enables
  review:
    summary: Author statement from the cloning paper that recombinant IAR has phosphatase activity, extended
      to receptor PTP activity.
    action: REMOVE
    reason: The 1996 cloning abstract says only that recombinant IAR "has phosphatase activity"; UniProt
      records that this was weak activity at pH 4.5, absent at pH 5.5, and of questioned in vivo relevance.
      Subsequent direct assays found no significant activity on phosphoprotein or pNPP substrates, and
      later human work states PTPRN2 is inactive against phosphoproteins. Beyond lacking protein-tyrosine
      phosphatase activity, there is no ligand or receptor signalling activity for PTPRN2; it is a granule
      membrane protein whose luminal domain is largely removed during maturation. Receptor protein tyrosine
      phosphatase activity is contradicted, not merely unsupported. This is a TAS statement, not an experimental
      annotation, and it conflicts with the later direct evidence.
