  - MGI:MGI:107418
  - PANTHER:PTN000439772
  review:
    summary: PAINT propagation from the vertebrate IA-2/IA-2beta node (PTN000439772), seeded by mouse
      Ptprn and Ptprn2.
    action: ACCEPT
    reason: The node covers the vertebrate PTPRN/PTPRN2 clade, and the curators restricted this term to
      it rather than the deeper family node used for granule location and regulation of secretion, a sensible
      placement since insulin is a vertebrate beta-cell product. Mouse Ptprn2 knockout alone impairs glucose-stimulated
      insulin secretion and reduces dense-core vesicle number and insulin content, and in rat phogrin the
      catalytic-cysteine-dependent PIPase activity correlates with effects on glucose-stimulated insulin
      secretion. PTPRN2 contributes as a dense-core granule membrane component that maintains granule number
      and membrane phosphoinositides, which is participation in the secretory process rather than an indirect
      phenotype.
    supported_by:
    - reference_id: PMID:15220191
      supporting_text: The IA-2beta(-/-) mice, in contrast to wild-type controls, showed mild glucose intolerance and impaired glucose-stimulated insulin secretion.
