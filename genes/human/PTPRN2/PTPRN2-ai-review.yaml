- term:
    id: GO:0052866
    label: phosphatidylinositol phosphate phosphatase activity
  evidence_type: ISS
  original_reference_id: PMID:20097759
  review:
    action: NEW
    summary: PTPRN2 is a transmembrane phosphatidylinositol phosphate phosphatase; its catalytic-cysteine-dependent
      activity is on phosphoinositides, not phosphoproteins.
    reason: Purified transmembrane rat phogrin, the PTHR46106:SF5 ortholog of human PTPRN2, dephosphorylates
      PI(3)P and PI(4,5)P2 (but not PI(3,4,5)P3) with a specific activity comparable to other PIPases, and
      this activity is lost on mutation of the catalytic cysteine. Human PTPRN2 knockdown and overexpression
      raise and lower plasma membrane PI(4,5)P2 respectively, and its pro-migratory effect requires the
      catalytic cysteine (C945A). The general phosphatidylinositol phosphate phosphatase term is used because
      the phosphate position removed from PI(4,5)P2 was not determined.
    supported_by:
    - reference_id: PMID:20097759
      supporting_text: phogrin is able to dephosphorylate specific inositol phospholipids, including phosphatidylinositol (PI) 3-phosphate and PI 4,5-diphosphate but not PI 3,4,5-trisphosphate.
    - reference_id: PMID:20097759
      supporting_text: The PIPase activity of phogrin depended on the catalytic site cysteine and correlated
        with effects on glucose-stimulated insulin secretion.
    - reference_id: PMID:26620550
      supporting_text: Both PTPRN2 and PLCβ1 are enzymes with previously demonstrated activities for the
        substrate PI(4,5)P2 (Rebecchi & Pentyala, 2000; Caromile et al, 2010).
    - reference_id: PMID:26620550
      supporting_text: We found that while wild‐type PTPRN2 overexpression was sufficient to increase
        invasion, migration, and metastatic lung colonization in mice, these effects were dependent on
        PTPRN2's catalytic activity as equivalent overexpression of PTPRN2C945A failed to enhance these
        phenotypes (Fig 2D–F).
