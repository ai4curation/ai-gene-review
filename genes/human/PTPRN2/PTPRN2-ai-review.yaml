  review:
    summary: 'protein tyrosine phosphatase activity: PTPRN2 does not exhibit conventional phosphoprotein-substrate
      activity because of changes in its PTP domain; the human cell study explicitly distinguishes this
      from reported phosphoinositide phosphatase activity. The electronic protein-phosphatase activity
      assignment overgeneralizes the domain.'
    action: REMOVE
    reason: PTPRN2 does not exhibit conventional phosphoprotein-substrate activity because of changes
      in its PTP domain; the human cell study explicitly distinguishes this from reported phosphoinositide
      phosphatase activity. The electronic protein-phosphatase activity assignment overgeneralizes the
      domain.
    supported_by:
    - reference_id: PMID:26620550
      supporting_text: PTPRN2 belongs to the protein tyrosine phosphatase family, but does not exhibit
        activity against phosphoprotein substrates due to several critical amino acid variations in the
        PTP domain (Magistrelli et al, 1996).
