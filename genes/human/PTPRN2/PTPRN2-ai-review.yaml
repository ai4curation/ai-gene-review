  review:
    summary: Direct-assay annotation from a structural study of SNX17/SNX27/SNX31 PX-FERM binding to NPxY
      sorting motifs of diverse transmembrane cargos.
    action: UNDECIDED
    reason: The study surveyed binding of PX-FERM sorting nexins to sorting motifs of many putative cargos,
      and PTPRN2 carries a tyrosine-based internalization motif, so it was plausibly one of the tested
      cargo peptides. The cached record does not mention PTPRN2, and neither the cached text nor any other
      evidence identifies a signalling receptor complex containing PTPRN2. A cargo-motif binding assay
      would more naturally support a sorting-nexin binding function than complex membership. Without the
      relevant figure or table the experimental basis cannot be checked, so the annotation is neither accepted
      nor removed.
