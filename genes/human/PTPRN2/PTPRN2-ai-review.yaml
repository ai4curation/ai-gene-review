id: Q92932
gene_symbol: PTPRN2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: PTPRN2 is a membrane protein of neuroendocrine secretory vesicles that traffics between secretory
  granules and the plasma membrane. It regulates vesicle accumulation and secretion and has a phosphatase-like
  intracellular domain. Conventional phosphoprotein activity is impaired, whereas phosphoinositide phosphatase
  activity and regulation of membrane PI(4,5)P2 have been reported in mammalian cells.
