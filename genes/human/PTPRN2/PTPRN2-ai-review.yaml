core_functions:
- description: Dense-core granule and synaptic vesicle membrane protein that maintains neuroendocrine
    secretory vesicle number and supports stimulus-coupled secretion, notably glucose-stimulated insulin
    secretion from beta cells.
  directly_involved_in:
  - id: GO:0035773
    label: insulin secretion involved in cellular response to glucose stimulus
  - id: GO:0051046
    label: regulation of secretion
  locations:
  - id: GO:0032127
    label: dense core granule membrane
  - id: GO:0030672
    label: synaptic vesicle membrane
  supported_by:
  - reference_id: PMID:21732083
    supporting_text: Islets from single and DKO mice all showed a significant decrease in insulin content, insulin secretion and the number and half-life of DCV
  - reference_id: PMID:15220191
    supporting_text: The IA-2beta(-/-) mice, in contrast to wild-type controls, showed mild glucose intolerance and impaired glucose-stimulated insulin secretion.
  - reference_id: PMID:19361477
    supporting_text: IA-2beta, but not IA-2, co-purifies with fractions rich in synaptic vesicles (SV)
- description: Transmembrane phosphatidylinositol phosphate phosphatase whose PTP-like domain dephosphorylates
    PI(3)P, PI(5)P and PI(4,5)P2, lowering membrane PI(4,5)P2; it lacks conventional protein-tyrosine
    phosphatase activity.
  molecular_function:
    id: GO:0052866
    label: phosphatidylinositol phosphate phosphatase activity
  locations:
  - id: GO:0032127
    label: dense core granule membrane
  supported_by:
  - reference_id: PMID:20097759
    supporting_text: phogrin is able to dephosphorylate specific inositol phospholipids, including phosphatidylinositol (PI) 3-phosphate and PI 4,5-diphosphate but not PI 3,4,5-trisphosphate.
  - reference_id: PMID:26620550
    supporting_text: Both PTPRN2 and PLCβ1 are enzymes with previously demonstrated activities for the
      substrate PI(4,5)P2 (Rebecchi & Pentyala, 2000; Caromile et al, 2010).
suggested_questions:
- question: Which phosphate (4- or 5-position) does PTPRN2 remove from PI(4,5)P2, and does the dense-core
    granule membrane PI(4,5)P2 pool, rather than the plasma membrane pool, mediate its effect on insulin
    secretion?
- question: Does PTPRN2 bind the FERM domain of SNX17 or SNX27 through its tyrosine-based internalization
    motif, and does that binding contribute to its recycling back to dense-core granules?
suggested_experiments:
- description: Assay purified full-length human PTPRN2 and its C945S mutant against PI(4,5)P2 with product
    identification by mass spectrometry to define positional specificity, and rescue Ptprn2-null beta
    cells with wild-type versus catalytic-dead protein to separate the lipid-phosphatase function from
    the structural granule role.
