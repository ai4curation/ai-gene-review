id: Q92932
gene_symbol: PTPRN2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: PTPRN2 (IA-2beta, phogrin) is a single-pass type I transmembrane protein of the IA-2 family
  of receptor-like protein-tyrosine phosphatases, expressed mainly in brain, pituitary and pancreatic
  islets. It resides in the membrane of neuroendocrine dense-core secretory granules and, in neurons,
  synaptic vesicles; after granule exocytosis it is transiently present at the plasma membrane and is
  recycled by clathrin/AP-2-dependent endocytosis. The precursor is processed in the granule pathway to
  a mature IA-2beta60 transmembrane form with a short luminal segment and a cytoplasmic PTP-like domain.
  That domain carries substitutions at conserved catalytic positions, and the protein has no meaningful
  activity on phosphoprotein substrates; instead, the purified transmembrane form dephosphorylates
  phosphoinositides (PI(3)P, PI(5)P and PI(4,5)P2) in a catalytic-cysteine-dependent manner and lowers
  plasma membrane PI(4,5)P2 when expressed in cells. Loss of PTPRN2 in mice reduces the number and half-life
  of dense-core vesicles, insulin content and glucose-stimulated insulin secretion, and (together with
  PTPRN) reduces brain monoamine content and neurotransmitter release. PTPRN2 is a major autoantigen in
  type 1 diabetes, and in breast cancer cells its PI(4,5)P2-lowering activity promotes cofilin-dependent
  migration.
