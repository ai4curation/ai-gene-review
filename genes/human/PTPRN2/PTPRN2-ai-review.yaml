  review:
    summary: Ensembl Compara transfer from mouse Ptprn2 of a role in neurotransmitter secretion.
    action: KEEP_AS_NON_CORE
    reason: The donor is the mouse ortholog in the same PANTHER subfamily (PTHR46106:SF5). In mice lacking
