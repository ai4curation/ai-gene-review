    label: protein tyrosine phosphatase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - InterPro:IPR000242
  - RHEA:10684
  - EC:3.1.3.48
  review:
    summary: Domain-based electronic assignment of protein tyrosine phosphatase activity to a PTP-like
      domain whose conventional catalytic activity is lost.
    action: REMOVE
    reason: The PTP-like domain of PTPRN2 carries substitutions at conserved catalytic positions. Direct
      biochemical work on the orthologous rat protein (same PANTHER subfamily PTHR46106:SF5) found no significant
      activity on phosphoproteins or pNPP, the knockout study describes IA-2beta as enzymatically inactive,
      and the human cell study states it has no activity against phosphoprotein substrates. UniProt also
      notes that the weak acidic-pH activity reported at cloning is of questionable in vivo relevance. The
      measurable catalytic-cysteine-dependent activity is toward phosphoinositides, which is captured by
      the separate phosphatidylinositol phosphate phosphatase activity term. The InterPro/EC mapping is
      therefore demonstrably wrong for this protein.
    supported_by:
    - reference_id: PMID:26620550
      supporting_text: PTPRN2 belongs to the protein tyrosine phosphatase family, but does not exhibit
        activity against phosphoprotein substrates due to several critical amino acid variations in the
        PTP domain (Magistrelli et al, 1996).
    - reference_id: PMID:20097759
      supporting_text: By sequence, phogrin is a member of the family of receptor-like protein-tyrosine
        phosphatases, but it contains substitutions in conserved catalytic sequences, and no significant
        enzymatic activity for phogrin has ever been reported.
    - reference_id: file:human/PTPRN2/PTPRN2-uniprot.txt
      record_section: ["CC:CAUTION"]
      supporting_text: 'CC   -!- CAUTION: Has no tyrosine-protein phosphatase activity at mild acidic'
- term:
