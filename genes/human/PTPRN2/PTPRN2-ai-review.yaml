- term: &id003
    id: GO:0052866
    label: phosphatidylinositol phosphate phosphatase activity
  evidence_type: IMP
  original_reference_id: PMID:26620550
  review:
    action: NEW
    summary: Human PTPRN2 has phosphoinositide phosphatase activity distinct from its impaired protein-phosphatase
      activity.
    reason: The study connects PTPRN2-dependent PI(4,5)P2 levels to actin remodeling and tests catalytic-domain
      mutation. The broad phosphoinositide-phosphatase MF avoids inferring an unverified phosphate-position
      specificity.
    supported_by:
    - &id004
      reference_id: PMID:26620550
      supporting_text: Both PTPRN2 and PLCβ1 are enzymes with previously demonstrated activities for the
        substrate PI(4,5)P2 (Rebecchi & Pentyala, 2000; Caromile et al, 2010).
    - &id005
      reference_id: PMID:26620550
      supporting_text: Mutation of the catalytic cysteine residue to the structurally similar serine residue
        abrogates PTPRN2's ability to dephosphorylate PI(4,5)P2 (Caromile et al, 2010)
    - &id006
      reference_id: PMID:26620550
      supporting_text: We found that while wild‐type PTPRN2 overexpression was sufficient to increase
        invasion, migration, and metastatic lung colonization in mice, these effects were dependent on
        PTPRN2's catalytic activity as equivalent overexpression of PTPRN2C945A failed to enhance these
        phenotypes (Fig 2D–F).
    - &id007
      reference_id: PMID:26620550
      supporting_text: Both PTPRN2 and PLCβ1 also demonstrated localization to the plasma membrane in
        breast cancer cells, in addition to some cytoplasmic localization (Fig EV3A).
