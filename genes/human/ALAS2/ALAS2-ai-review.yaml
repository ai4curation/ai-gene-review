core_functions:
- description: >-
    ALAS2 catalyzes the PLP-dependent condensation of glycine and succinyl-CoA to form 5-aminolevulinate,
    CoA and CO2 in the mitochondrial matrix, initiating the heme-synthesis branch that supplies hemoglobin
    in erythroid cells. Its homodimer builds each active site from both subunits, with PLP linked to Lys391;
    the C-terminal extension regulates substrate access and product release. PLP binding is integral to
    this catalytic unit.
  molecular_function:
    id: GO:0003870
    label: 5-aminolevulinate synthase activity
  directly_involved_in:
  - id: GO:0006785
    label: heme B biosynthetic process
  - id: GO:0042541
    label: hemoglobin biosynthetic process
  locations:
  - id: GO:0005759
    label: mitochondrial matrix
  supported_by:
  - reference_id: PMID:32499479
    supporting_text: >-
      ALAS catalyses the pyridoxal 5′-phosphate (PLP)-dependent condensation of succinyl-CoA and
      glycine to form aminolevulinic acid (ALA), with CoA and CO2 as by-products
  - reference_id: PMID:32499479
    supporting_text: ALAS2 (gene location Xp11.21) is predominantly expressed in erythroid
      progenitor cells, and synthesizes 85–90% of total body heme specifically for hemoglobin
      production during erythropoiesis.
    reference_section_type: INTRODUCTION
  - reference_id: PMID:32499479
    supporting_text: Like its orthologs, hsALAS2 is an obligate homodimer in that each active site
      is formed from both monomeric subunits, with one PLP molecule bound per active site.
    reference_section_type: RESULTS
