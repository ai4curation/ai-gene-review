description: >-
  SMIM43 (NEMEP, Nodal enhanced mesendoderm micropeptide; formerly annotated as TMEM155)
  is a 63-amino-acid microprotein with a single N-terminal transmembrane helix, translated
  from an upstream open reading frame in a transcript previously regarded as non-coding or
  as encoding a larger, unconfirmed 130-residue protein. In mouse, the orthologous
  transcript (Gm11549) is a direct target of Nodal/Activin signaling, and the micropeptide
  localizes to the plasma membrane, where it binds the class I facilitative glucose
  transporters GLUT1 (SLC2A1) and GLUT3 (SLC2A3) through its transmembrane segment and a
  short C-terminal motif (His51-Phe57). NEMEP increases cellular glucose uptake and
  glycolytic flux in a binding-dependent manner, and in mouse embryonic stem cells it is
  required for mesendoderm differentiation, apparently by supplying the increased glucose
  uptake that this transition requires. The human protein is translated, shares about 94%
  identity with the mouse peptide, binds human GLUT1 and GLUT3, and raises glucose
  consumption and glycolysis when overexpressed in human hepatoma cells; its role in human
  development has not been examined.
