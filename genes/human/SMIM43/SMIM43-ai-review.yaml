- term:
    id: GO:0141109
    label: transporter activator activity
  evidence_type: IDA
  original_reference_id: PMID:35810171
  qualifier: enables
  review:
    summary: Proposed molecular function. NEMEP binds GLUT1/GLUT3 and increases glucose
      transporter activity, and binding-deficient mutants (TMD deletion, H51-F57 deletion)
      fail to do so, including in cells overexpressing GLUT1 or GLUT3.
    action: NEW
    reason: >-
      This is the only molecular activity that describes what NEMEP does, rather than
      what it binds; transmembrane transporter binding alone does not convey the
      direction of the effect. It parallels the regulator-type MFs used for the
      SERCA-regulating microproteins (DWORF GO:0008047 enzyme activator activity; SLN and
      PLN GO:0004857 enzyme inhibitor activity). Caveats: the evidence is cell-based and
      largely mouse (human only by HepG2 overexpression), the authors say "likely", and
      a direct effect on transporter kinetics has not been shown in a reconstituted
      system, so confidence is moderate.
    supported_by:
    - reference_id: PMID:35810171
      supporting_text: the expression of WT NEMEP but not TMD-deletion NEMEP or
        H51-F57-deletion NEMEP in mESCs overexpressing GLUT1 or GLUT3 resulted in
        significantly higher glucose uptake compared to the GLUT1 or GLUT3 overexpressing
        mESCs
    - reference_id: PMID:35810171
      supporting_text: Therefore, NEMEP’s boosting glucose uptake likely through
        interactions with the known glucose transporters GLUT1 and GLUT3.
