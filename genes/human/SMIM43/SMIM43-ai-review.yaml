  findings:
  - statement: The human TMEM155 locus encodes a translated 63-aa peptide (hNEMEP) about
      94% identical to mouse NEMEP.
    supporting_text: TMEM155 likewise encodes a 63 aa peptide (“hNEMEP”, sharing 93.6%
      identity with mNEMEP)
  - statement: Human NEMEP binds human GLUT1 and GLUT3.
    supporting_text: Then, we confirmed that the homologous human NEMEP protein also
      interacts with the human GLUT1 and GLUT3 proteins
  - statement: Mouse NEMEP is required for mesendoderm differentiation of mESCs and for
      normal glucose uptake.
    supporting_text: demonstrated that loss of NEMEP both significantly impaired
      mesendoderm differentiation and decreased glucose uptake
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (Nat Commun 2022;13:3984, PMC9271079; published 2022,
      not 2020). Full text cached. The only functional study of this gene. Most data are
      from mouse ESCs; human-specific data are the translation of hNEMEP, co-IP with human
      GLUT1/GLUT3 in HEK293T, and overexpression in HepG2.
core_functions:
- description: >-
    Plasma membrane microprotein that binds the facilitative glucose transporters GLUT1
    (SLC2A1) and GLUT3 (SLC2A3) via its single transmembrane helix and a C-terminal
    H51-F57 motif and enhances their glucose uptake, increasing glycolytic flux. In mouse
    ES cells this Nodal-induced boost of glucose import supports mesendoderm
    differentiation.
  molecular_function:
    id: GO:0141109
    label: transporter activator activity
  directly_involved_in:
