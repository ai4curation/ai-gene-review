    supporting_text: Then, we confirmed that the homologous human NEMEP protein also
      interacts with the human GLUT1 and GLUT3 proteins
  - reference_id: PMID:35810171
    supporting_text: Therefore, NEMEP’s boosting glucose uptake likely through
      interactions with the known glucose transporters GLUT1 and GLUT3.
suggested_questions:
- question: >-
    Does NEMEP change the intrinsic kinetics (Vmax, Km) of GLUT1/GLUT3, or does it act by
    increasing their surface abundance or stability? This decides between transporter
    activator activity and a trafficking/stabilization role.
- question: >-
    Is SMIM43 expressed and required during human gastrulation-stage differentiation (e.g.
    hESC-derived mesendoderm), and is it Nodal/Activin-responsive in human cells?
- question: >-
    What is the function of TMEM155/SMIM43 upregulation reported in immune-cell
    transcriptomic studies (acute HIV infection PBMCs), given that previous annotations
    were based on an incorrect 130-residue ORF?
suggested_experiments:
- description: >-
    Reconstitute GLUT1 or GLUT3 in proteoliposomes with and without synthetic NEMEP (WT
    versus H51-F57 deletion) and measure glucose transport kinetics.
  experiment_type: in vitro reconstitution transport assay
- description: >-
    Knock out SMIM43 in human ES cells and assay 2-deoxyglucose uptake and mesendoderm
    marker induction after Activin A treatment, together with surface biotinylation of
    GLUT1/GLUT3.
  experiment_type: CRISPR knockout in hESCs
