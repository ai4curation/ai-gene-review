core_functions:
- description: Intramembrane zinc metalloendopeptidase that performs the second, membrane-embedded cleavage
    in regulated intramembrane proteolysis of S1P-trimmed membrane-bound bZIP transcription factors, releasing
    their cytosolic domains; principal substrates are SREBP-1/-2 (sterol-regulated lipid synthesis) and
    ATF6/ATF6B (ER unfolded protein response), with CREB3-family factors (OASIS/CREB3L1, CREB3L2, CREB3L3)
    as further substrates.
  molecular_function:
    id: GO:0004222
