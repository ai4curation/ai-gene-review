suggested_questions:
- question: Should S2P (and S1P) carry GO:0032933 SREBP signaling pathway? In human, mouse and rat that
    term is held by SCAP, INSIG1/2, SREBF1/2 and ERLIN1/2 but by no protease, whereas the ATF6 pathway
    term GO:0036500 is annotated to both proteases.
- question: Why do different hypomorphic MBTPS2 alleles give mainly cutaneous (IFAP, KFSD, Olmsted) or
    mainly skeletal (OI19) disease, and do they impair processing of SREBP, ATF6 and CREB3L1 to different
    extents?
- question: Does S2P cleave substrates beyond the bZIP transcription factors, for example other type II
    membrane proteins with Asn-Pro-containing transmembrane helices, and how does it recognise S1P-trimmed
    substrates?
suggested_experiments:
- description: Reconstitute purified human S2P in proteoliposomes with S1P-trimmed SREBP2, ATF6 and CREB3L1
    transmembrane substrates and measure cleavage kinetics for wild-type and IFAP/OI19 patient variants
    to relate residual substrate-specific activity to phenotype.
- description: Perform unbiased N-terminomics or proteomics of membrane-released fragments in MBTPS2-knockout
    versus rescued cells to identify additional physiological S2P substrates.
