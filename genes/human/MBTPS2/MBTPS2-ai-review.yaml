    action: KEEP_AS_NON_CORE
    reason: Activation of membrane-bound bZIP ER stress transducers by S2P is conserved between plants
      (bZIP17/28) and animals (ATF6, CREB3 family), so the human protein lies within the clade that inherited
      this role and there is no evidence of loss. In human the specific mechanism is better described
      by ATF6-mediated unfolded protein response; the regulatory framing is kept as non-core.
