id: O43462
gene_symbol: MBTPS2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: MBTPS2 encodes site-2 protease (S2P), an intramembrane zinc metalloprotease of the M50 family.
  It is a polytopic membrane protein in the Golgi with cytosolic N- and C-termini, an HEIGH zinc-binding
  motif, and an Asp ligand buried within membrane-spanning segments. S2P acts after site-1 protease (MBTPS1)
  in regulated intramembrane proteolysis. Once S1P has trimmed the lumenal domain of a membrane-bound
  transcription factor, S2P cleaves within its transmembrane helix, which depends on a helix-destabilizing
  Asn-Pro motif in the substrate. This releases the cytosolic N-terminal bZIP domain, which enters the
  nucleus. Its principal substrates are SREBP-1 and SREBP-2, which drive cholesterol and fatty acid synthesis
  and uptake, and ATF6/ATF6B, which induce ER chaperones in the unfolded protein response. S2P also cleaves
  the CREB3-family factors OASIS (CREB3L1), BBF2H7 (CREB3L2) and CREB-H (CREB3L3). S2P is essential for
  cholesterol prototrophy and the ATF6 branch of the ER stress response. X-linked hypomorphic variants
  cause IFAP syndrome, keratosis follicularis spinulosa decalvans, X-linked Olmsted syndrome and osteogenesis
  imperfecta type XIX. In the bone disease, defective processing of OASIS, ATF6 and SREBP impairs collagen
  secretion and osteoblast differentiation.
