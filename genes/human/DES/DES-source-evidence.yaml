quotation_policy: Excerpts are short, occur only once in the authored review/guide, and total no more
  than 25 words per paper across the final authored artifacts. Source caches are unchanged.
limits:
- Original-only excerpts are not inserted as publication supporting_text when absent from the cache.
- Figure captions and selected original text were read; no new image-pixel or supplemental-image analysis
  is claimed.
- Partner catalytic/regulatory classification uses curated function/family/domain evidence, not protein
  names or GO labels alone. DDX6 ATP-hydrolysis evidence remains curator inference plus established helicase-family/domain
  classification, not a newly performed purified ATPase assay.
