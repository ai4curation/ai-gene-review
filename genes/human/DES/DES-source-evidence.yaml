gene_symbol: DES
identity:
  uniprot: P17661
  length: 470
  products: No named alternative products; engineered constructs and disease variants are not isoforms.
interpretation:
  core: One filament assembly and cytoskeletal linkage activity. Identical-protein and cytoskeletal-protein
    binding are mechanistic components of this integrated structural role, not separate regulatory cores.
  locations: Intermediate filament already reaches intermediate filament cytoskeleton through the current
    is_a/part_of closure. Sarcolemma is peripheral association, not insertion. Cardiac-myofibril measurements
    support location, not motor function.
  binding_classes: A direct binary interaction with an established enzyme or regulatory protein can support
    binding to that class. It does not establish that DES performs or regulates the partner activity.
    Yeast assays do not resolve native colocalization or stoichiometry.
  sarcolemma_context: Normal skeletal-muscle localization in PMID21135508 independently supports
    the accepted gene-level peripheral structural location. The human R350P observation in
    PMID25394388 retains its mutant-aggregate scope without being treated as normal topology evidence.
