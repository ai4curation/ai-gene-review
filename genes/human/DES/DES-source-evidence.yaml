source_assessments:
- reference_id: PMID:11309420
  url: https://pubmed.ncbi.nlm.nih.gov/11309420/
  examined: Original Methods and repeated nebulin fragment screens
  scope: Rabbit nebulin Q04020 bait and human DES-library prey; myopalladin is another partner in the
    paper.
- reference_id: PMID:11353857
  url: https://pmc.ncbi.nlm.nih.gov/articles/PMC33438/
  examined: Full human DES constructs, cell-free co-immunoprecipitation, human muscle EM
  scope: DMN/synemin rod fragments bind DES; human EM independently places desmin around Z-lines.
- reference_id: PMID:16923132
  url: https://www.med.oita-u.ac.jp/matrix/research/2006/Wang_2006.pdf
  examined: Scanned original Methods and figure pages, visually read
  scope: Human epiplakin fragments and human recombinant DES in slot-blots; GST/BSA controls, weaker DES
    signal; no native stoichiometry claim.
- reference_id: PMID:20706999
  url: https://pubmed.ncbi.nlm.nih.gov/20706999/
  examined: Abstract and exact independently curated physical-pair records; full original unavailable
  scope: MLH1 association includes cellular co-immunoprecipitation; no repair or partner-complex catalytic
    activity assigned to DES.
- reference_id: PMID:21135508
  url: https://pmc.ncbi.nlm.nih.gov/articles/PMC3007152/
  examined: Original human-bait screen, biochemical/cellular assays and assembly/phosphatase controls
  scope: MTM1 modulates DES assembly; DES did not change the assayed MTM1 phosphatase activity.
- reference_id: PMID:23615443
  url: https://pubmed.ncbi.nlm.nih.gov/23615443/
  examined: Full original construct/purification and direct binding experiments
  scope: Human DES and human nebulin modules; other species' imaging is separate. No direct DES–actin
    binding inferred.
- reference_id: PMID:24940650
  url: https://pubmed.ncbi.nlm.nih.gov/24940650/
  examined: Publisher-indexed body explicitly reports desmin binding as data not shown; official pair
    annotation
  scope: Full original/supplement retrieval failed. Retention defers to the reported pair; no uninspected
    fragment refinement.
- reference_id: PMID:25416956
  url: https://pmc.ncbi.nlm.nih.gov/articles/PMC4266588/
  examined: Original screening and validation Methods plus exact pairs
  scope: Four pairwise retests, at least three positives and sequence confirmation apply to this 2014
    map. Orthogonal validation of a subset is not assigned to every DES pair.
- reference_id: PMID:26816005
  url: https://pubmed.ncbi.nlm.nih.gov/26816005/
  examined: Full original human constructs, Y2H reconstruction, GST pull-down controls
  scope: Human DES–DUX1/DUX4 binding; mouse screen/cell assays are distinguished. Homeodomain binding
    alone does not establish a DES transcriptional mechanism.
- reference_id: PMID:26871637
  url: https://pubmed.ncbi.nlm.nih.gov/26871637/
  examined: Genuine full original cache, Methods and exact participant records
  scope: The DES–NEFL record uses NEFL residues 1–377. Isoform profiling does not establish a new DES
    isoform.
- reference_id: PMID:27107012
  url: https://pubmed.ncbi.nlm.nih.gov/27107012/
  examined: Full original validation Methods and exact pair methods
  scope: DES–NEFL is split-luciferase complementation; DES–VIM has BFG and validated Y2H. Methods are
    not homogenized across pairs.
- reference_id: PMID:27733623
  url: https://pubmed.ncbi.nlm.nih.gov/27733623/
  examined: Full original constructs, direct binding, assembly assays and model discussion
  scope: Distinguish purified experiments, chick/rat tissue and limited human RD-cell co-IP. The actin-coordination
    model is not direct DES–actin binding.
- reference_id: PMID:28514442
  url: https://pubmed.ncbi.nlm.nih.gov/28514442/
  examined: Full original tagged-bait AP-MS and scoring Methods, exact DES–VIM association
  scope: HEK293T co-purification, gene-level aggregation and spoke expansion do not establish direct contact
    or all isoforms.
- reference_id: PMID:32296183
  url: https://pubmed.ncbi.nlm.nih.gov/32296183/
  examined: Full original HuRI Methods and all source-specific pair records
  scope: Quadruplicate retesting and sequence confirmation; do not import the 2014 three-of-four criterion.
    Native expression and stoichiometry are not inferred.
- reference_id: PMID:32814053
  url: https://pub.dzne.de/record/153392/files/DZNE-2020-01389.pdf
  examined: Genuine author PDF, original Y2H Methods and exact pair records
  scope: HTT regions 1–88, 1–511 and 1932–2642 are fragment evidence. Subset mammalian validation is not
    assigned without a matching record.
- reference_id: PMID:33961781
  url: https://pmc.ncbi.nlm.nih.gov/articles/PMC8165030/
  examined: Genuine full original, AP-MS/clone/scoring Methods and exact DES pairs
  scope: Co-purifying cytoskeletal proteins remain associations; VIM records include HEK293T and HCT116
    contexts.
