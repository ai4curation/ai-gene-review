  review:
    summary: HuRI supports a physical DES–DDX6 interaction.
    action: MODIFY
    reason: The exact HuRI DES–DDX6 pair includes validated two-hybrid evidence. The current GO:0051117
      definition covers binding to an enzyme that hydrolyzes ATP, and the official DDX6 record explicitly
      assigns ATP + water to ADP + phosphate with curated evidence ECO:0000305. That established ATPase
      partner class supports a narrower refinement than enzyme binding. This does not assert a new DES
      catalytic activity, RNA unwinding by DES, modulation of DDX6 ATP turnover, or a native P-body function.
      The official catalytic assignment is not represented as an independently reread purified-enzyme
