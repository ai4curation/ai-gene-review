id: P17661
gene_symbol: DES
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Desmin is a type III intermediate-filament protein that forms a mechanically resilient cytoskeletal
  network in muscle cells. Its filaments connect and support myofibrillar structures around Z discs and
  at cardiac intercalated discs. Desmin self-assembly and interactions with cytoskeletal partners help
  organize this network; the small heat-shock protein alpha-B-crystallin binds assembly intermediates
  and modulates filament organization. Disruptive DES variants can impair filament assembly and produce
  protein aggregates in cardiac and skeletal muscle.
