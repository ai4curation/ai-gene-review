suggested_questions:
- question: Which developmentally restricted nuclear and cardiac-envelope anchoring roles demonstrated
    in rodent desmin also occur for endogenous human DES?
- question: Which validated interaction-map pairs occur together at physiological abundance in DES-expressing
    human muscle cells, and which depend on the tested partner fragments or isoforms?
- question: Which direct desmin–organelle connections, as distinct from secondary filament disruption,
    position mitochondria in human skeletal muscle?
suggested_experiments:
- description: In human skeletal-muscle cells, compare wild-type DES with an MTM1-binding-deficient separation-of-function
    mutant that retains filament assembly. Measure mitochondrial position alongside filament architecture,
    membrane potential and MTM1 phosphatase activity to separate physical tethering from secondary network
    or metabolic effects.
