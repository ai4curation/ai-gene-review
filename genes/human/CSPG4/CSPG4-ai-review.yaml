  evidence_type: IPI
  original_reference_id: PMID:36115835
  qualifier: enables
  supporting_entities:
  - UniProtKB:O75970
  review:
    summary: The C-terminal PDZ-binding motif of CSPG4 binds many PDZ-domain proteins in affinity-mapped
      fragmentomics.
    action: MODIFY
    reason: Generic protein binding is uninformative; every partner in this screen (DLG1-4, GRIP1, MPP3,
      APBA1/2, SCRIB, FRMPD2 and related) is a PDZ-domain protein engaged through the CSPG4 C-terminal
      motif, so PDZ domain binding is the informative term. UniProt independently records interaction
      with the first PDZ domain of MPDZ and with GRIP1/GRIP2.
