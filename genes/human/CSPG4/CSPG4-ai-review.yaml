core_functions:
- description: 'Cell-surface proteoglycan coreceptor and signalling platform: its very large glycanated
    ectodomain, exposed on the outside of the plasma membrane, binds matrix ligands, growth factors and
    proteases and cooperates with integrins, while the cytoplasmic tail recruits PDZ scaffolds and signalling
    proteins, driving CDC42/ACK1/p130Cas-dependent cell spreading and migration.'
  molecular_function:
    id: GO:0015026
    label: coreceptor activity
  directly_involved_in:
  - id: GO:0035556
    label: intracellular signal transduction
  - id: GO:0050731
    label: positive regulation of peptidyl-tyrosine phosphorylation
  locations:
  - id: GO:0005886
    label: plasma membrane
  - id: GO:0009986
    label: cell surface
  - id: GO:0031258
    label: lamellipodium membrane
  supported_by:
  - reference_id: PMID:10587647
    supporting_text: MCSP stimulation also results in a pronounced activation and recruitment of the Rho-family
      GTPase Cdc42
  - reference_id: file:human/CSPG4/CSPG4-uniprot.txt
    supporting_text: Binds through its extracellular N-terminus growth
- description: 'Scaffolding through its short cytoplasmic tail: the C-terminal PDZ-binding motif engages
    PDZ-domain proteins (MPDZ, GRIP1/2, DLG family), positioning CSPG4 and its partners in membrane signalling
    assemblies.'
  molecular_function:
    id: GO:0030165
    label: PDZ domain binding
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: file:human/CSPG4/CSPG4-uniprot.txt
    supporting_text: Interacts with the first PDZ domain of MPDZ.
  - reference_id: PMID:36115835
    supporting_text: Here, we measure the affinities of 65,000 interactions involving PDZ domains and
      their target PDZ-binding motifs (PBM) within a human interactome region particularly relevant for
      viral infection and cancer
suggested_questions:
- question: Which CSPG4 ectodomain ligand engagements actually initiate the CDC42/ACK1/p130Cas pathway
    in vivo, as opposed to the antibody-clustering used in vitro?
- question: How much do the chondroitin sulfate chains, rather than the core protein, determine partner
    selection (for example ITGA4) and antibody accessibility on tumour cells?
suggested_experiments:
- hypothesis: Chondroitin sulfate chains on CSPG4 are required for integrin partnering but dispensable
    for PDZ-scaffold-dependent signalling.
  description: Compare spreading, CDC42 activation and p130Cas phosphorylation in melanoma cells expressing
    wild-type CSPG4, a glycosaminoglycan-attachment-site mutant, and a C-terminal PDZ-motif deletion.
