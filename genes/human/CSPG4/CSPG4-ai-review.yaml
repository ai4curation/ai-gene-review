id: Q6UVK1
gene_symbol: CSPG4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'CSPG4 (chondroitin sulfate proteoglycan 4, also called NG2 or melanoma-associated chondroitin
  sulfate proteoglycan, MCSP) is a very large single-pass type I membrane proteoglycan: a 2200-residue
  ectodomain containing laminin G-like domains and chondroitin sulfate attachment sites, a single transmembrane
  helix, and a short cytoplasmic tail ending in a PDZ-binding motif. It is expressed on pericytes, oligodendrocyte
  progenitors, chondrocytes and basal keratinocytes, and is strongly expressed by melanoma and several
  other tumours, which has made its exposed ectodomain an antibody and CAR-T target. The ectodomain binds
  extracellular ligands including collagens V and VI, tenascin, laminin, galectin-3, growth factors (FGF2,
  PDGF-AA), plasminogen and MMP16, and it engages integrins, while the cytoplasmic tail binds PDZ scaffolds
  such as MPDZ and GRIP1 and signalling proteins. Through these interactions CSPG4 acts as a coreceptor
  and signalling platform at the cell surface: it promotes integrin-dependent cell spreading and migration
  via CDC42, ACK1 (TNK2) and BCAR1/p130Cas, activates FAK and ERK signalling, and supports pericyte behaviour
  during microvascular morphogenesis. It is also exploited as a receptor for Clostridioides difficile
  toxin B.'
