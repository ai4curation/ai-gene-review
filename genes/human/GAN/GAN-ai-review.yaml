  review:
    summary: GAN supports intermediate-filament and microtubule cytoskeleton organization.
    action: MODIFY
    reason: 'The broad GAN-specific InterPro mapping is refined to two supported is_a descendants. Intermediate-filament
      organization is supported by substrate recruitment and proteasome-sensitive filament clearance,
      altered soluble vimentin pools and loss/rescue effects on filament arrangement (PMID:23585478, PMID:31944090,
      PMID:37043392); purified CRL3–GAN ubiquitination of selected intermediate-filament proteins establishes
      an active adaptor contribution beyond disease necessity alone (PMID:37903270). Microtubule cytoskeleton
      organization has separate experimental support: coexpressed gigaxonin and MAP1B light chain protect
      the microtubule network against colchicine-induced disassembly, whereas the tested truncated GAN
      construct does not (PMID:12147674). This is a context-specific stabilization result, not direct
      tubulin binding. Both GO:0045104 and GO:0000226 descend directly from GO:0007010. Kelch-mutant clearance
      and morphology effects can separate, and none of these findings establishes GAN as a motor or a
      universal direct filament-disassembly enzyme.'
    supported_by:
