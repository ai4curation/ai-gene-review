    summary: The cytoskeletal location can be specified as microtubule cytoskeleton.
    action: MODIFY
    reason: 'The UniProt cytoskeleton mapping is a true but broad location. PMID:12147674 directly reports
      MAP1B-dependent localization of tagged GAN along microtubules in cotransfected COS-7 cells and endogenous
      gigaxonin/MAP1B colocalization in mouse DRG neurons and sciatic nerves. Together with the retained
      HPA microtubule-cytoskeleton annotation, this supports GO:0015630, a verified is_a descendant of
      GO:0005856. The term includes associated proteins: GAN need not bind tubulin directly. Intermediate-filament
      binding and turnover are not used as evidence that intact GAN localizes along those filaments; the
      source also tests an isolated Kelch-domain construct, which is kept distinct from full-length GAN.'
