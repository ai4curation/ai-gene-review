  label: Homo sapiens
description: Gigaxonin is a BTB/Kelch substrate-recognition adaptor in cytosolic CUL3–RBX1 ubiquitin ligase
  complexes. Its Kelch region recognizes selected cytoskeletal proteins, while its amino-terminal region
  connects them to ubiquitination machinery. Substrate turnover helps maintain intermediate-filament and
  other cytoskeletal networks. Loss of functional gigaxonin causes giant axonal neuropathy, in which intermediate
  filaments accumulate and neuronal function deteriorates.
