  native_cache_header:
    stable_id: R-HSA-8955241
    display_name: CAND1 binds cytosolic CRL E3 ubiquitin ligases
    species: Homo sapiens
    summary: 'CRL complexes consist of a cullin protein (CUL1, 2, 3, 4A, 4B, 5, 7 and 9 in humans) and
      a RING box protein (RBX1 or 2) in addition to one or more substrate binding proteins that confer
      substrate specificity to the complex (reviewed in Petroski and Deshaies, 2005; Lipkowitz and Weismann,
      2011). CRL complexes can be classes according to their cullin proteins: CRL1 complexes (also called
      SCF complexes) contain CUL1, CRL2 complexes contain CUL2, CLR complexes contain CUL3, and CLR5 complexes
      contain CUL5. Cullin-associated NEDD8-dissociated protein 1 (CAND1, TIP120) is a key assembly factor
      of Cullin E3 RING ubiquitin ligase (CRL) complexes, acting as a substrate receptor exchange factor.
      CAND1 binds to the inactive, deneddylated CRL complex through the conserved amino-terminal 3 Cullin
      repeats of the cullin subunit, which are also required for binding of the substrate binding proteins
      (Zheng et al, 2002a, b; Liu et al 2002; Min et al, 2003; Goldenberg et al, 2004). By disrupting
      the substrate binding protein interaction interface on the cullin proteins, CAND1 binding destabilizes
      the CRL complex, allowing exchange of the substrate binding protein (Schmidt et al, 2009; Pierce
      et al, 2013; Zemla et al, 2013; Wu et al, 2013). Neddylation of the CRL complex results in a conformational
      change that eliminates the CAND1 binding site, thereby promoting the active CRL ubiquitin ligase
      complex (Duda et al, 2008; Saha and Deshaies, 2008; Boh et al, 2011; Yu et al, 2015).<br>'
  disposition: UNCHANGED_MAIN_REUSE
- relative_path: reactome/R-HSA-8955289.md
  bytes: 2642
  sha256: ca34634613daec7332a3737757049b54e352acb35a7d2c6947d083191c45abda
  blob: 5622fe3756ce3a04cb3225ad7c200051910006c1
  mode: '100644'
  path: reactome/R-HSA-8955289.md
  native_cache_header:
    stable_id: R-HSA-8955289
    display_name: COMMDs displace CAND1 from cytosolic CRL E3 ubiquitin ligase complexes
    species: Homo sapiens
    summary: 'COMMD1 is a member of a family of 10 copper metabolism MURR1 domain-containing proteins
      that have pleiotropic roles in copper metabolism, NF kappa beta-mediated transcription, the hypoxic
      response and electrolyte transport (Burstein et al, 2005; reviewed in Maine and Burstein, 2007).
      COMMD proteins have differential tissue and expression levels, but appear to have partially overlapping
      function and form homo- and heterodimers through the shared COMM domain (Burstein et al, 2005).
      COMMD1 and other family members interact with the cullin subunit of CRL E3 ubiquitin ligase complexes,
      as well as with CCDC22, a protein implicated in X-linked intellectual disability that may regulate
      COMMD localization. Together, COMMD proteins and CCDC22 activate the ubiquitin ligase activity of
      CRL complexes by displacing the CAND1 inhibitor (Burstein et al, 2005; Maine et al, 2007; Mao et
      al, 2011; Starokadomskyy et al, 2013;Phillips-Krawczak et al, 2015).  The specificity of interaction
      between various COMMD and CUL family members may serve to fine tune the regulation of CRL activation,
      although these details remain to be determined. '
  disposition: UNCHANGED_MAIN_REUSE
- relative_path: reactome/R-HSA-8956040.md
  bytes: 2326
  sha256: b351cf781f159665afb855f82dda59051d7189607013162a6142891d297b4a44
  blob: 4fc55ec958b01712a1e837c436a2c158104e5884
