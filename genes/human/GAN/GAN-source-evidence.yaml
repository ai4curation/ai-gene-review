  path: reactome/R-HSA-8956040.md
  native_cache_header:
    stable_id: R-HSA-8956040
    display_name: COP9 signalosome deneddylates cytosolic CRL E3 ubiquitin ligase complexes
    species: Homo sapiens
    summary: 'The COP9 signalosome (also known as CSN) is a highly conserved multi-subunit enzymatic complex
      that plays a role as the sole CRL ubiquitin ligase deneddylase. Deneddylation decreases ubiquitin
      ligase activity of CRL complexes, and is required for the sCAND1 binding to the cullin subunit.
      The CSN is required for stabilization of CRL substrate receptors: without the CSN, CRL complexes
      are "hyper-active" and promote their own degradation through autoubiquitination. Both the CSN and
      CAND1 allow remodeling of the ubiquitin ligase complex through exchange of the ubiquitin substrate
      specific receptors (Cope et al, 2006; Denti et al, 2006; Peth et al, 2007; Schmidt et al, 2009;
      Enchev et al, 2012; Pierce et al, 2013; Zemla et al, 2013; Wu et al, 2013, reviewed in Wei et al,
      2008). Deregulation of the CRL-CSN pathway causes misregulation of numerous important cellular targets
      and has been implicated in the development of some cancers (reviewed in Gummlich et al, 2013).'
  disposition: UNCHANGED_MAIN_REUSE
- relative_path: reactome/R-HSA-983168.md
  bytes: 3304
  sha256: 87fee22d00c93b9458486621d3752a76ccc34eeab059f020b447b709a0f9cbb6
  blob: 5f5a13c33e37fdd421bb785da6b102eeb34cf948
  mode: '100644'
  path: reactome/R-HSA-983168.md
  native_cache_header:
    stable_id: R-HSA-983168
    display_name: 'Antigen processing: Ubiquitination & Proteasome degradation'
    species: Homo sapiens
    summary: 'Intracellular foreign or aberrant host proteins are cleaved into peptide fragments of a
      precise size, such that they can be loaded on to class I MHC molecules and presented externally
      to cytotoxic T cells. The ubiquitin-26S proteasome system plays a central role in the generation
      of these class I MHC antigens. <br>Ubiquitination is the mechanism of adding ubiquitin to lysine
      residues on substrate protein leading to the formation of a polyubiquitinated substrate. This process
      involves three classes of enzyme, an E1 ubiquitin-activating enzyme, an E2 ubiquitin-conjugating
      enzyme, and an E3 ubiquitin ligase. Polyubiquitination through lysine-48 (K48) generally targets
      the substrate protein for proteasomal destruction. The protease responsible for the degradation
      of K48-polyubiquitinated proteins is the 26S proteasome. This proteasome is a two subunit protein
      complex composed of the 20S (catalytic core particle) and 19S (regulatory particle) proteasome complexes.
      The proteasome eliminates most of the foreign and non-functional proteins from the cell by degrading
      them into short peptides; only a small fraction of the peptides generated are of the correct length
      to be presented by the MHC class I system. It has been calculated that between 994 and 3122 protein
      molecules have to be degraded for the formation of a single, stable MHC class I complex at the cell
      surface, with an average efficiency of 1 in 2000 (Kloetzel et al. 2004, Princiotta et al. 2003). '
  disposition: UNCHANGED_MAIN_REUSE
