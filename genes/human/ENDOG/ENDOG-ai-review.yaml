- id: file:human/ENDOG/ENDOG-hypotheses/submitochondrial-localization-ims-vs-matrix/openscientist.md
  title: OpenScientist sequence-feature test of whether human ENDOG targets the mitochondrial
    matrix or the intermembrane space
  findings:
  - statement: ENDOG enters mitochondria by the cleavable-presequence TIM23 route and is not a
      MIA40 disulfide-relay substrate, which excludes the twin-cysteine class of intermembrane
      space residents.
    supporting_text: ENDOG is imported via the cleavable-presequence (TOM/TIM23) pathway, not the
      MIA40 twin-cysteine pathway
  - statement: That route does not settle the compartment, because presequence-imported proteins
      are sorted to either destination.
    supporting_text: Many IMS proteins (DIABLO/SMAC, HTRA2) are delivered by the same presequence
      machinery, then arrested or sorted into the IMS
  - statement: The classifier reached only 60 percent accuracy on reference proteins of known
      sub-compartment, failing on exactly the presequence-bearing intermembrane space proteins
      that ENDOG resembles, so its matrix lean is not decisive.
    supporting_text: LOO-CV accuracy = 60.0% (9/15)
  - statement: The presequence signature is shared with the EXOG paralog, so it is a family trait
      rather than a discriminator.
    supporting_text: so the matrix-type signature is a family trait
  - statement: A dual or regulated localization is compatible with every sequence feature computed.
    supporting_text: reconciles all observations and is not excluded by any sequence feature
      computed here
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Run of 2026-10-27, 3 iterations. Saved executed code as provenance, which fetches
      the reference sequences from UniProt. Every sequence fact it reports was checked here against
      the local UniProt record and is correct. Transit peptide 1-48 and mature chain 49-297, three
      cysteines in total at positions 84, 113 and 196, presequence 16.7 percent arginine with net
      charge +5, and no twin CX9C or CX3C motif. Two limitations it states plainly and that matter.
      No external localization predictor was reachable, so the result rests on its own classifiers,
      and it did not retrieve the context papers I supplied, taking them as given. Recorded as weak
      computational evidence. It supports no annotation and changes no action, and confirms the
      existing decision to stay at the root mitochondrion term.
  full_text_unavailable: false
- id: file:human/ENDOG/ENDOG-hypotheses/mtdna-breakpoint-motif-enrichment/openscientist.md
  title: OpenScientist computational test of whether mtDNA breakpoints are enriched at
    ENDOG-preferred G-quadruplex and C-rich motifs
  findings:
  - statement: mtDNA deletion breakpoints are enriched at G-quadruplex and C-rich motifs over
      GC-matched controls, but the signal is confined to deletions flanked by direct repeats and
      is absent in non-repeat deletions, so it does not isolate ENDOG cleavage.
    supporting_text: 'Signal only in DR≥5 bp deletions (fold 1.24); absent in DR<5 bp
      (fold 0.97, p=0.91)'
  - statement: The direct-repeat mechanism accounts for the same localization without ENDOG.
    supporting_text: a mechanism that does not require ENDOG and fully accounts for the observed
      G/C-rich localization
  - statement: NUMT breakpoints show no such enrichment in the 66,083-genome catalogue or in an
      independent UCSC set; their own trinucleotide signal looks like end-joining microhomology.
    supporting_text: consistent with non-homologous end joining at the nuclear insertion site
      rather than ENDOG motif cleavage in mtDNA
  - statement: Coordinate data alone cannot establish that ENDOG made the cuts.
    supporting_text: No ENDOG perturbation data were available; causation cannot be tested from
      coordinates alone
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Run of 2026-10-26, 3 iterations, 22 minutes. A genuine computation rather than a
      literature summary. It fetched the rCRS, the MitoBreak deletion table, the PMID:36198798
      supplementary NUMT tables and the UCSC NumtS track, and ran a GC-decile-matched permutation
      test. Independently verified here that the rCRS base composition it reports is correct
      (C 31.3%, G 13.1%, 16,569 bp) and that the 9 bp deletion hotspot it cites is a C-rich direct
      repeat, ACCCCCTCTAC at 8271-8281, which is its central point. Not reproducible as run. Only an
      HTML and a PDF report were saved, with no code or intermediate tables, so the test statistics
      cannot be replayed. Recorded as a negative and qualifying result; it supports no annotation and
      changes no action, and its own GO suggestions were not adopted.
  full_text_unavailable: false
