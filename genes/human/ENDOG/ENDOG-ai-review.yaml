- term:
    id: GO:0042803
    label: protein homodimerization activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: enables
  supporting_entities:
  - UniProtKB:O08600
  - ensembl:ENSMUSP00000015481
  review:
    summary: ENDOG homodimerization is conserved and required for nuclease 
      activity.
    action: KEEP_AS_NON_CORE
    reason: Mouse-derived transfer of ENDOG self-association to human is plausible
      for the conserved nuclease fold, but the self-association row is a structural
      prerequisite rather than a separate core molecular function. Ortholog
      structural and biochemical work makes the prerequisite concrete. The dimer
      binds two DNA strands at separate metal-finger motifs and is needed for full
      endonuclease activity (PMID:27738134), and oxidation dissociates it into
      monomers with reduced activity, which is how reactive oxygen species gate
      the enzyme (PMID:27346342). This supports keeping the row while leaving it
      non-core.
    supported_by:
    - reference_id: PMID:27738134
      supporting_text: the dimer conformation of CPS-6 is essential for
        maintaining its optimal DNA-binding and endonuclease activity
    - reference_id: PMID:27346342
      supporting_text: homodimeric CPS-6-the C. elegans homolog of EndoG-is
        dissociated into monomers with diminished nuclease activity
