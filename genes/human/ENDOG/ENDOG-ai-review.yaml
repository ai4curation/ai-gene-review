- term:
    id: GO:0051880
    label: G-quadruplex DNA binding
  evidence_type: IDA
  original_reference_id: PMID:36394256
  qualifier: enables
  review:
    summary: Human ENDOG binds G-quadruplex DNA in mitochondria, selectively over
      the rest of the mitochondrial genome.
    action: NEW
    reason: The GO:0003676 nucleic acid binding MODIFY names this term among its
      replacements; this row is what establishes it, by IDA on the primary
      assays. Binding is an activity ENDOG performs itself, and is a step
      distinct from the cleavage the endonuclease rows record. In human cells,
      mitochondrial immunoprecipitation shows ENDOG occupying the
      G-quadruplex-forming regions and not other parts of mtDNA, and ENDOG
      colocalizes with the G4-specific BG4 antibody; the same paper
      characterizes the structures in vitro and shows cleavage at G4
      single-to-double-stranded junctions. It does not rest on the
      breakpoint-motif hypothesis run, which was negative and which argued only
      that these motifs do not explain where population mtDNA breakpoints fall.
      Remaining caveat for a reviewer, recorded rather than hidden. That paper
      shows selectivity by immunoprecipitation and imaging, not by a measured
      affinity comparison against unstructured duplex DNA, so the specificity is
      qualitative.
    supported_by:
    - reference_id: PMID:36394256
      supporting_text: The findings from mito IP studies suggest that
        Endonuclease G only binds to the G-quadruplex forming regions and not to
        the other areas of mtDNA
    - reference_id: PMID:36394256
      supporting_text: Representative immunofluorescence images showing the
        colocalization of Endonuclease G and BG4
