- term:
    id: GO:0006309
    label: apoptotic DNA fragmentation
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:1261433
  - PANTHER:PTN000359600
  - SGD:S000003744
  - WB:WBGene00000787
  review:
    summary: ENDOG-family nucleases can contribute to apoptotic DNA 
      fragmentation, but this is not human ENDOGs principal function.
    action: KEEP_AS_NON_CORE
    reason: ENDOG is catalytically capable of fragmenting chromosomal DNA after 
      mitochondrial release, so the PAINT process transfer is plausible. Recent 
      direct human data instead center ENDOG on 5hmC-modified DNA cleavage, 
      mitochondrial genome maintenance, and autophagy, making apoptotic DNA
      fragmentation a retained non-core branch rather than the defining
      function. Checked against the APOPTOSIS project's assay-readout rule. This
      is not an endpoint-readout inference, because ENDOG is itself the nuclease
      that performs the step. Recombinant human EndoG reproduces the defining
      two-stage pattern on isolated nuclei, large fragments then nucleosomal
      cleavage (PMID:11606588). EndoG fragments chromatin in DFF-deficient mouse
      cells (PMID:11452314). In worms, cps-6 loss impairs apoptotic DNA
      degradation, and the nuclease activity of CPS-6 mutants tracks their
      killing activity (PMID:11452313, PMID:22223640). Necessity in mammals is
      weak. A null mouse allele that spares the overlapping gene shows no obvious
      apoptotic DNA-degradation defect (PMID:15601850), so the role is redundant
      with CAD/DFFB. Non-core is the right weight. The apparent conflict between
      the two mouse lines does not change that. The PMID:14663139 allele was
      embryonic lethal, but the PMID:15601850 authors built a null that spares
      the gene lying tail to tail with Endog and attribute the lethality to
      disrupting that neighbour, which is why PMID:14663139 is marked DISPUTED in
      the reference list. The cleaner allele is therefore the better test of
      necessity. The activity itself does not rest on either mouse, but on the
      purified human enzyme cleaving isolated nuclei (PMID:11606588) and on
      fragmentation in CAD-deficient cells (PMID:11452314), so the activity is
      real and the requirement is not.
    supported_by:
    - reference_id: PMID:29719607
      supporting_text: In the nucleus EndoG participates in site-specific
        cleavage
    - reference_id: PMID:11606588
      supporting_text: The addition of the protein to isolated nuclei from
        non-apoptotic cells first induces higher order chromatin cleavage into
        DNA fragments
    - reference_id: PMID:11452314
      supporting_text: Once released from mitochondria, endoG cleaves chromatin
        DNA into nucleosomal fragments independently of caspases
    - reference_id: PMID:11452313
      supporting_text: Reduction of cps-6 activity caused by a genetic mutation
        or RNA-mediated interference (RNAi) affects normal DNA degradation
    - reference_id: PMID:15601850
      supporting_text: There is also no obvious effect on nuclear DNA
        degradation in standard apoptosis assays
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
      - source_id: PANTHER:PTN000359600
        source_status: SUPPORTS_TRANSFER
        comment: ENDOG/NUC1-family node supporting apoptotic DNA-fragmentation 
          roles in several opisthokonts; the transfer is plausible but not the 
          main human ENDOG activity.
