- term:
    id: GO:0005743
    label: mitochondrial inner membrane
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - PANTHER:PTN000359598
  - SGD:S000003744
  - UniProtKB:Q9Y2C4
  review:
    summary: The ENDOG family includes inner-membrane-associated mitochondrial 
      nucleases.
    action: KEEP_AS_NON_CORE
    reason: The membrane claim in this row has its own positive support, and the
      donor check prescribed by the organelle policy was run. Both PAINT donors
      carry GO:0005743. Yeast Nuc1 does, and the purification of the major yeast
      mitochondrial nuclease places that activity in the inner membrane
      (PMID:3286639). Human EXOG carries it by IDA, from PMID:18187503, and that
      paper subfractionated human mitochondria expressing tagged EndoG and EXOG
      and found both in membrane fractions while excluding them from the soluble
      intermembrane space and the soluble matrix. That is evidence for membrane
      association of an EndoG protein rather than only of the PAINT donors, so
      the row is kept rather than marked over-annotated. Note which EndoG,
      though. The construct in that paper is the bovine ortholog, expressed in
      human cells alongside human EXOG, so this is not a measurement on the
      human protein; it is still independent of the donor annotations, because
      bovine EndoG is not one of them. The same paper also speaks to
      inner versus outer. Subfractionation alone cannot separate them, because
      those membrane fractions co-stained for COX-IV, TOM20 and cytochrome c
      together; but the immunogold electron microscopy in the next panel can, and
      its legend reports both tagged proteins delineating the cristae, which are
      inner membrane. One honest discrepancy inside that paper, recorded rather
      than smoothed over. The running text describes the EM only for EXOG and
      cites earlier work for mammalian EndoG, so the legend's claim about both
      proteins is the stronger of the two statements; the whole experiment used
      tagged, expressed protein; and, as above, the EndoG construct is bovine.
      That is enough to keep an inner-membrane row with its own support, and not
      enough to make the location core, so the row stays non-core. One further
      limit, recorded as a source defect rather than argued here. This evidence
      places the protein at the inner membrane; it does not show the nuclease
      acting there, and the same row argues below that mtDNA cleavage needs
      matrix access, so located_in fits the support better than the inherited
      is_active_in. Sub-compartment check under the organelle policy, which is
      a separate question from whether this row stands. Fractionation
      places mammalian EndoG in the intermembrane space and not the matrix
      (PMID:12444964), consistent with its release on outer-membrane
      permeabilization. In human HeLa cells it instead colocalizes with the matrix
      nucleoid marker TFAM (PMID:36394256), and its cleavage of mtDNA
      (PMID:29719607) and, in mouse, of mitochondrial transcripts (PMID:39752519)
      requires matrix access. The worm ortholog CPS-6 moves from the
      intermembrane space to the matrix after fertilization (PMID:27338704), so
      both may hold under different conditions. A sequence analysis narrows the
      import route without settling the compartment. ENDOG has a cleavable
      arginine-rich presequence and only three cysteines with no twin CX9C or
      CX3C motif, so it enters by the TIM23 presequence route and is not a MIA40
      disulfide-relay intermembrane-space protein. That route delivers proteins
      to both compartments, the same signature is shared with the EXOG paralog,
      and the classifier scored only 60 percent on reference proteins of known
      sub-compartment, so it does not discriminate. Because those lines
      disagree, no soluble intermembrane-space or matrix row is added; the
      membrane-fraction result above is consistent with that, since it finds
      ENDOG in neither soluble compartment. The root mitochondrion rows carry the
      overall location.
    supported_by:
    - reference_id: PMID:18187503
      supporting_text: Following mitochondrial subfractionation EXOG and EndoG
        were both found in membrane fractions, co-localizing with CYTC, COX-IV
        and TOM20
    - reference_id: PMID:18187503
      supporting_text: exclude their presence as soluble proteins of the
        intermembrane space or the mitochondrial matrix
    - reference_id: PMID:18187503
      supporting_text: Both proteins are often found delineating the cristae,
        pointing towards an association with the inner mitochondrial membrane
    - reference_id: PMID:3286639
      supporting_text: The enzyme is located in the mitochondrial inner membrane
    - reference_id: PMID:12444964
      supporting_text: it exists in the mitochondrial intermembrane space, but
        not in the matrix where mtDNA replication occurs
    - reference_id: PMID:36394256
      supporting_text: Representative images of colocalization of Endonuclease G
        to mitochondrial matrix (TFAM) in HeLa cells
    source_defects:
    - defect_type: WRONG_QUALIFIER
      resource: GO_CENTRAL
      slot: Qualifier
      requested_change: CHECK
      asserted_value: is_active_in
      corrected_value: located_in
      confidence: PROBABLE
      explanation: >-
        The evidence that supports this row places the protein at the inner membrane
        rather than showing catalysis there. Immunogold electron microscopy puts tagged
        EndoG at the cristae and subfractionation excludes it from both soluble
        compartments (PMID:18187503), and the yeast donor evidence is likewise a
        localization result (PMID:3286639). No experiment cited here shows the nuclease
        acting at the inner membrane, and this review argues separately that cleaving
        mtDNA and mitochondrial transcripts needs matrix access, so is_active_in asserts
        more than the support carries. Raised as a query rather than a correction, since
        the PAINT node may rest on evidence we have not seen.
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
      - source_id: PANTHER:PTN000359598
        source_status: SUPPORTS_TRANSFER
        comment: Mitochondrial ENDOG/EXOG/NUC1 node with 
          inner-membrane-associated mitochondrial nuclease sources.
