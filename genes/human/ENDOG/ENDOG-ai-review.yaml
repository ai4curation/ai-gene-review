- term:
    id: GO:0071889
    label: 14-3-3 protein binding
  evidence_type: IDA
  original_reference_id: PMID:33473107
  qualifier: enables
  review:
    summary: Phosphorylated ENDOG binds YWHAG/14-3-3gamma to suppress mTOR 
      signaling.
    action: NEW
    reason: Existing GOA captures the downstream negative regulation of TOR 
      signaling and positive regulation of autophagy but not the specific 
      phosphorylation-dependent 14-3-3 binding activity that releases TSC2 and 
      VPS34 from YWHAG/14-3-3gamma during starvation. A mouse liver study
      extends the same binding mode to a second client, Rictor, which ENDOG
      displaces from 14-3-3gamma to activate mTORC2 (PMID:37794041). That is
      corroboration for the binding activity, not a separate human
      annotation.
