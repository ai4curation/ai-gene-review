core_functions:
- description: ENDOG cleaves damaged mitochondrial DNA, promoting removal of 
    mtDNA molecules that are not repaired efficiently and stimulating 
    compensatory mitochondrial DNA replication under oxidative stress.
  molecular_function:
    id: GO:0004520
    label: DNA endonuclease activity
  directly_involved_in:
