core_functions:
- description: ENDOG cleaves damaged mitochondrial DNA, promoting removal of
    mtDNA molecules that are not repaired efficiently and stimulating
    compensatory mitochondrial DNA replication under oxidative stress. The
    purified human enzyme strongly prefers oxidized, nicked or gapped DNA. It
    can also cut at G-quadruplex-forming mtDNA sequences in vitro and in cells.
    Whether that cleavage generates the common 9-bp mtDNA deletion is not
    settled. Population breakpoint data place deletion breakpoints at such
    motifs only where a direct repeat is also present, which the classical
    slipped-replication mechanism explains without ENDOG.
  molecular_function:
    id: GO:0004520
    label: DNA endonuclease activity
  directly_involved_in:
  - id: GO:0032043
    label: mitochondrial DNA catabolic process
  - id: GO:0090297
    label: positive regulation of mitochondrial DNA replication
  locations:
  - id: GO:0005739
    label: mitochondrion
  supported_by:
  - reference_id: PMID:29719607
    supporting_text: EndoG stimulates both mtDNA replication
  - reference_id: PMID:41854021
    supporting_text: displays a particularly strong preference for cleaving
      oxidatively damaged DNA, including nicked and gapped dsDNA, and oxoG-DNA
  - reference_id: PMID:36394256
    supporting_text: Endonuclease G binds to G-quadruplex structures formed at
      the hotspot and induces DNA breaks
  - reference_id:
      file:human/ENDOG/ENDOG-hypotheses/mtdna-breakpoint-motif-enrichment/openscientist.md
    supporting_text: 'Signal only in DR≥5 bp deletions (fold 1.24); absent in DR<5 bp (fold
      0.97, p=0.91)'
- description: Nuclear ENDOG cleaves 5-hydroxymethylcytosine-modified
    double-stranded DNA and thereby generates breaks that can feed conservative 
    DNA recombination.
  molecular_function:
    id: GO:0004520
    label: DNA endonuclease activity
  directly_involved_in:
  - id: GO:0006310
    label: DNA recombination
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:25355512
    supporting_text: recombinant EndoG preferentially recognizes and cleaves a 
      core sequence
  - reference_id: PMID:25355512
    supporting_text: promote conservative recombination in an EndoG-dependent 
      manner
- description: Phosphorylated, starvation-released ENDOG binds 14-3-3 proteins, 
    freeing TSC2 and VPS34 from YWHAG/14-3-3gamma to suppress mTORC1 signaling 
    and initiate autophagy.
  molecular_function:
    id: GO:0071889
    label: 14-3-3 protein binding
  directly_involved_in:
  - id: GO:1904262
    label: negative regulation of TORC1 signaling
  - id: GO:0010508
    label: positive regulation of autophagy
  supported_by:
  - reference_id: PMID:33473107
    supporting_text: enhances its interaction with 14-3-3
  - reference_id: PMID:33473107
    supporting_text: mTOR pathway suppression and autophagy initiation
proposed_new_terms: []
suggested_questions:
- question: Should GO add a narrower molecular function for ENDOG-like 
    5-hydroxymethylcytosine-biased DNA endonuclease activity, or is DNA 
    endonuclease activity sufficient for this substrate preference?
  experts: []
- question: Should the ENDOG/YWHAG starvation-autophagy mechanism be modeled 
    with an explicit GO-CAM linking GSK3beta phosphorylation, 14-3-3 binding, 
    release of TSC2/VPS34, mTOR suppression, and autophagy initiation?
  experts: []
suggested_experiments:
- description: Rescue ENDOG-null human cells with mitochondrial-targeted, 
    nucleus-restricted, nuclease-dead, and 14-3-3-binding-defective ENDOG 
    variants and measure mtDNA cleavage/replication, 5hmC-dependent 
    recombination, mTOR substrate phosphorylation, and LC3 autophagic flux.
  hypothesis: ENDOG uses separable localization and interaction determinants for
    mitochondrial genome turnover, nuclear 5hmC DNA cleavage, and
    14-3-3-dependent autophagy induction.
- description: Map mtDNA breakpoints in ENDOG-null versus wild-type human cells, and separately
    map ENDOG cleavage sites on undamaged and oxidatively damaged mtDNA templates in vitro.
    Analyse repeat-flanked and repeat-free deletions separately.
  hypothesis: If ENDOG places mtDNA breakpoints, its loss should deplete breakpoints at its
    preferred motifs, and the effect should be detectable in repeat-free deletions where the
    slipped-replication mechanism does not operate. A measured cleavage map would also replace the
    assumed motif, since a reference-sequence scan cannot see lesion-driven site selection.
