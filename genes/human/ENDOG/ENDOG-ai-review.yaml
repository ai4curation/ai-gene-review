- id: PMID:11452314
  title: Endonuclease G is an apoptotic DNase when released from mitochondria.
  findings:
  - statement: EndoG is released from mitochondria and cleaves chromatin into
      nucleosomal fragments without caspases, including in DFF-deficient
      mouse cells.
    supporting_text: Once released from mitochondria, endoG cleaves chromatin
      DNA into nucleosomal fragments independently of caspases
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only cache. Founding paper for the apoptotic
      nuclease role.
  full_text_unavailable: true
- id: PMID:11606588
  title: 'Action of recombinant human apoptotic endonuclease G on naked DNA and
    chromatin substrates: cooperation with exonuclease and DNase I.'
  findings:
  - statement: Purified recombinant human EndoG reproduces large-fragment then
      internucleosomal cleavage on isolated nuclei, aided by exonuclease and
      DNase I.
    supporting_text: The addition of the protein to isolated nuclei from
      non-apoptotic cells first induces higher order chromatin cleavage into
      DNA fragments
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only cache. Direct human enzyme evidence for the
      catalytic step behind apoptotic DNA fragmentation.
  full_text_unavailable: true
- id: PMID:11452313
  title: Mitochondrial endonuclease G is important for apoptosis in C. elegans.
  findings:
  - statement: Worm CPS-6 is a mitochondrial EndoG homolog whose loss impairs
      apoptotic DNA degradation and delays cell-corpse appearance.
    supporting_text: Reduction of cps-6 activity caused by a genetic mutation
      or RNA-mediated interference (RNAi) affects normal DNA degradation
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only cache. Ortholog genetics underlying the PAINT
      apoptotic-fragmentation node.
  full_text_unavailable: true
- id: PMID:22223640
  title: Structural insights into apoptotic DNA degradation by CED-3 protease
    suppressor-6 (CPS-6) from Caenorhabditis elegans.
  findings:
  - statement: The CPS-6 structure shows a Mg-dependent homodimer, and in vivo
      killing activity tracks the nuclease activity of interface mutants.
    supporting_text: the reduced DNase activity of CPS-6 mutants was
      positively correlated with its diminished cell killing activity in C.
      elegans
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only cache. Ties nuclease activity to the
      cell-death role in the ortholog.
  full_text_unavailable: true
