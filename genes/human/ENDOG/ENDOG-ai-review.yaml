suggested_questions:
- question: Should GO add a narrower molecular function for ENDOG-like 
    5-hydroxymethylcytosine-biased DNA endonuclease activity, or is DNA 
    endonuclease activity sufficient for this substrate preference?
  experts: []
- question: Should the ENDOG/YWHAG starvation-autophagy mechanism be modeled 
    with an explicit GO-CAM linking GSK3beta phosphorylation, 14-3-3 binding, 
    release of TSC2/VPS34, mTOR suppression, and autophagy initiation?
  experts: []
suggested_experiments:
- description: Rescue ENDOG-null human cells with mitochondrial-targeted, 
    nucleus-restricted, nuclease-dead, and 14-3-3-binding-defective ENDOG 
    variants and measure mtDNA cleavage/replication, 5hmC-dependent 
    recombination, mTOR substrate phosphorylation, and LC3 autophagic flux.
  hypothesis: ENDOG uses separable localization and interaction determinants for
    mitochondrial genome turnover, nuclear 5hmC DNA cleavage, and 
    14-3-3-dependent autophagy induction.
