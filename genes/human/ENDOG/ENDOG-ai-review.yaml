id: Q14249
gene_symbol: ENDOG
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'ENDOG encodes mitochondrial endonuclease G, a nuclear-encoded Mg-dependent
  DNA/RNA nuclease of the DRGH/His-Me finger family with an N-terminal mitochondrial
  transit peptide. It acts as a homodimer. Mature ENDOG resides mainly in mitochondria,
  can enter the nucleus, and catalyzes endonucleolytic cleavage of DNA substrates,
  with a strong preference for oxidatively damaged, nicked or gapped DNA and for 5-hydroxymethylcytosine-modified
  double-stranded DNA. Where it sits inside mitochondria is unresolved. Fractionation
  places it in the intermembrane space, but it colocalizes with matrix nucleoids in
  human cells and acts on mitochondrial DNA. Its nuclease activity supports mitochondrial genome turnover
  and compensatory replication, and nuclear ENDOG-mediated DNA breaks can promote
  conservative recombination. During starvation, released and phosphorylated ENDOG
  also binds 14-3-3 proteins to suppress mTOR signaling and promote autophagy, with
  an additional endonuclease-dependent DNA damage-response arm. After release from
  mitochondria during cell death, ENDOG cleaves nuclear chromatin into nucleosomal
  fragments independently of caspases, in a role partly redundant with CAD/DFFB. KU80
  binds ENDOG and restrains its nuclear activity.'
