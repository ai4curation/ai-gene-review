- term:
    id: GO:0009612
    label: response to mechanical stimulus
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:A6JTV7
  - ensembl:ENSRNOP00000021531
  review:
    summary: This rat-derived stress or stimulus row is too context-specific for
      human ENDOG core curation.
    action: MARK_AS_OVER_ANNOTATED
    reason: The Compara source reflects a rat experimental context in which 
      ENDOG was perturbed or mobilized under a stress condition. Human ENDOG has
      conserved nuclease and autophagy activities, but the specific calcium, 
      glucose, hypoxia, oxidative, estradiol, mechanical, or hydrogen-peroxide 
      cell-death contexts should not be propagated as reusable human ENDOG 
      biological processes without direct proximal evidence.
