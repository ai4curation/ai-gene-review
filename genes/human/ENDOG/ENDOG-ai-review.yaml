id: Q14249
gene_symbol: ENDOG
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'ENDOG encodes mitochondrial endonuclease G, a nuclear-encoded Mg-dependent
  DNA/RNA nuclease with an N-terminal mitochondrial transit peptide. Mature ENDOG
  resides mainly in mitochondria, can enter the nucleus, and catalyzes endonucleolytic
  cleavage of DNA substrates including oxidatively damaged mitochondrial DNA and 5-hydroxymethylcytosine-modified
  double-stranded DNA. Its nuclease activity supports mitochondrial genome turnover
  and compensatory replication, and nuclear ENDOG-mediated DNA breaks can promote
  conservative recombination. During starvation, released and phosphorylated ENDOG
  also binds 14-3-3 proteins to suppress mTOR signaling and promote autophagy, with
  an additional endonuclease-dependent DNA damage-response arm.'
