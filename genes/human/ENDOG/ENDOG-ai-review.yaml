      core sequence
  - reference_id: PMID:25355512
    supporting_text: promote conservative recombination in an EndoG-dependent 
      manner
- description: Phosphorylated, starvation-released ENDOG binds 14-3-3 proteins, 
    freeing TSC2 and VPS34 from YWHAG/14-3-3gamma to suppress mTORC1 signaling 
    and initiate autophagy.
  molecular_function:
    id: GO:0071889
    label: 14-3-3 protein binding
  directly_involved_in:
