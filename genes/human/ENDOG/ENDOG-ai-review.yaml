    label: mitochondrion
  supported_by:
  - reference_id: PMID:29719607
    supporting_text: EndoG stimulates both mtDNA replication
- description: Nuclear ENDOG cleaves 5-hydroxymethylcytosine-modified 
    double-stranded DNA and thereby generates breaks that can feed conservative 
    DNA recombination.
  molecular_function:
    id: GO:0004520
    label: DNA endonuclease activity
  directly_involved_in:
