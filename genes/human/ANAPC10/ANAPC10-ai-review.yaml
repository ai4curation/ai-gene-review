- id: PMID:10318877
  title: Characterization of the DOC1/APC10 subunit of the yeast and the human anaphase-promoting complex.
  findings:
  - statement: APC10 is a genuine human APC/C subunit.
    supporting_text: Biochemical fractionation experiments and mass spectrometric analysis of a component
      of the purified human APC show that APC10 is a genuine APC subunit whose cellular levels or association
      with the APC are not cell cycle-regulated.
  - statement: Apc10 mutation inactivates the APC/C without disassembling it.
    supporting_text: Mutation of Doc1/Apc10 inactivates the APC without destabilizing the complex.
  - statement: Yeast Doc1/Apc10 is an APC subunit throughout the cell cycle.
