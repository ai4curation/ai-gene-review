- term:
    id: GO:0005680
    label: anaphase-promoting complex
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: part_of
  supporting_entities:
  - PANTHER:PTN000309720
  - PomBase:SPBC1A4.01
  - SGD:S000003209
  - UniProtKB:Q9UM13
  review:
    summary: Part of the anaphase-promoting complex. APC10 is a core APC/C subunit; accepted.
    action: ACCEPT
    reason: APC10 is a stoichiometric core subunit of the APC/C in human cells [PMID:10318877 "Biochemical
      fractionation experiments and mass spectrometric analysis of a component of the purified human APC
      show that APC10 is a genuine APC subunit whose cellular levels or association with the APC are not
      cell cycle-regulated."]. The same holds for the yeast ortholog [PMID:10318877 "Here, we show that
      Doc1/Apc10 is a subunit of the yeast APC throughout the cell cycle."].
    supported_by:
    - reference_id: PMID:10318877
      supporting_text: Biochemical fractionation experiments and mass spectrometric analysis of a component
        of the purified human APC show that APC10 is a genuine APC subunit whose cellular levels or association
        with the APC are not cell cycle-regulated.
    - reference_id: PMID:10318877
      supporting_text: Here, we show that Doc1/Apc10 is a subunit of the yeast APC throughout the cell
        cycle.
    propagation_review:
      root_cause: NO_FAILURE_CORE
      residue_claims_not_applicable: APC10 is a non-catalytic subunit; the propagated term makes no residue-level
        claim.
