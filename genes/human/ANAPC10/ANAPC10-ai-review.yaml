id: Q9UM13
gene_symbol: ANAPC10
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ANAPC10 (APC10, DOC1) is a core subunit of the anaphase-promoting complex/cyclosome (APC/C),
  the multi-subunit E3 ubiquitin ligase that drives mitotic exit and keeps cells in G1 by marking cyclins,
  securin and other cell-cycle regulators for proteasomal destruction. APC10 is a small beta-sandwich
  (DOC domain) protein that sits beside the cullin subunit APC2 and is anchored to the TPR subunit APC3/CDC27
  by its C-terminal IR tail. Together with a coactivator (shown directly for CDH1; CDC20 is the other)
  it forms a co-receptor for the D-box degron of substrates, and it is needed for processive substrate
  ubiquitination but not for complex assembly. Its levels and APC/C association are constant through the
  cell cycle. Mouse Apc10 disruption causes a cell-autonomous block at the metaphase-to-anaphase transition.
existing_annotations:
- term:
    id: GO:0000278
    label: mitotic cell cycle
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - FB:FBgn0034231
  - PANTHER:PTN000309720
  review:
    summary: Mitotic cell cycle (IBA). Correct but too shallow; the evidence is specifically for the metaphase/anaphase
      transition. Modified to GO:0007091.
    action: MODIFY
    reason: Disruption of mouse Apc10 blocks the metaphase-to-anaphase transition [PMID:11247669 "The
      lethal effect of the mutation is due to a cell-autonomous block in the transition from metaphase
      to anaphase."], and APC10 depletion lowers APC/C activity in metaphase in human cells [PMID:21926987
      "To reduce APC/C activity directly we depleted APC10, which should primarily affect activity in
      metaphase 13 and APC11, which should inactivate the APC/C entirely 37, 38."]. That is GO:0007091
      metaphase/anaphase transition of mitotic cell cycle (is_a GO:0000278); GO:0031145 separately carries
      the catabolic-process content. Sibling APC/C subunit reviews (ANAPC11, CDC20, ANAPC2, CDC27) carry
      GO:0007091, and APC10 does part of the work as the D-box co-receptor.
    supported_by:
    - reference_id: PMID:11247669
      supporting_text: The lethal effect of the mutation is due to a cell-autonomous block in the transition
        from metaphase to anaphase.
    - reference_id: PMID:21926987
      supporting_text: To reduce APC/C activity directly we depleted APC10, which should primarily affect
        activity in metaphase 13 and APC11, which should inactivate the APC/C entirely 37, 38.
    - reference_id: PMID:21107322
      supporting_text: Cdh1 and Apc10, identified from difference maps, create a co-receptor for the D-box
        following repositioning of Cdh1 towards Apc10.
    proposed_replacement_terms:
    - id: GO:0007091
      label: metaphase/anaphase transition of mitotic cell cycle
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      residue_claims_not_applicable: APC10 is a non-catalytic subunit; the propagated term makes no residue-level
        claim.
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:34595750
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q9UM13
  review:
    summary: Protein binding (IPI) with FBXO43/EMI2. Uninformative; removed.
    action: REMOVE
    reason: The paper reports that APC/C subunits, including ANAPC10, bind the APC/C inhibitor FBXO43
      [PMID:34595750 "In mouse testicular protein extracts, three subunits of the APC/C, including ANAPC2,
      ANAPC8 and ANAPC10, were validated to interact directly with FBXO43"]. That describes FBXO43 inhibiting
      the APC/C, not an activity of APC10. The row's WITH/FROM field also lists ANAPC10 itself (UniProtKB:Q9UM13)
      rather than FBXO43. No informative MF term fits APC10's side of this interaction, so the generic
      protein-binding row is removed.
    supported_by:
    - reference_id: PMID:34595750
      supporting_text: In mouse testicular protein extracts, three subunits of the APC/C, including ANAPC2,
        ANAPC8 and ANAPC10, were validated to interact directly with FBXO43
