- term:
    id: GO:0051445
    label: regulation of meiotic cell cycle
  evidence_type: NAS
  original_reference_id: PMID:15678131
  qualifier: involved_in
  review:
    summary: Regulation of meiotic cell cycle (NAS, review). The APC/C acts in meiosis, but there is no
      APC10-specific meiotic evidence; kept as non-core.
    action: KEEP_AS_NON_CORE
    reason: The APC/C has essential functions in meiosis [PMID:16364912 "essential functions in mitosis,
      meiosis, and G1 phase of the cell cycle"], and APC10 is a constitutive subunit, so the statement
      is reasonable. APC10 also binds the meiotic APC/C inhibitor FBXO43 in testis extracts [PMID:34595750
      "In mouse testicular protein extracts, three subunits of the APC/C, including ANAPC2, ANAPC8 and
      ANAPC10, were validated to interact directly with FBXO43"], which places it in the meiotic APC/C,
      but no study tests the effect of APC10 loss on meiosis.
    supported_by:
    - reference_id: PMID:16364912
      supporting_text: essential functions in mitosis, meiosis, and G1 phase of the cell cycle
    - reference_id: PMID:10318877
      supporting_text: Biochemical fractionation experiments and mass spectrometric analysis of a component
        of the purified human APC show that APC10 is a genuine APC subunit whose cellular levels or association
        with the APC are not cell cycle-regulated.
    - reference_id: PMID:34595750
      supporting_text: In mouse testicular protein extracts, three subunits of the APC/C, including ANAPC2,
        ANAPC8 and ANAPC10, were validated to interact directly with FBXO43
