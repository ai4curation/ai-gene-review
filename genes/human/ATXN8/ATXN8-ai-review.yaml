  label: Homo sapiens
description: ATXN8 encodes a short, nearly pure polyglutamine protein translated from the antisense (CAG)
  strand of the spinocerebellar ataxia type 8 (SCA8) CTG-CAG repeat locus, which is bidirectionally transcribed
  with the noncoding ATXN8OS. In SCA8 the expanded repeat yields a polyglutamine protein that forms intranuclear
  inclusions in cerebellar Purkinje and brainstem neurons, contributing to toxic gain-of-function pathogenesis
  alongside the CUG-expansion RNA. ATXN8 protein has been detected only in SCA8 patients, and no normal
  function is known.
