  findings:
  - statement: Expanded ATXN8 polyQ protein forms intranuclear inclusions.
    supporting_text: 1C2-positive intranuclear inclusions in cerebellar Purkinje and brainstem neurons
      in SCA8 expansion mice and human SCA8 autopsy tissue result from translation of a polyglutamine
      protein, encoded on a previously unidentified antiparallel transcript (ataxin 8, ATXN8) spanning
      the repeat in the CAG direction.
  - statement: SCA8 involves protein and RNA gain-of-function.
    supporting_text: Moreover, the expression of noncoding (CUG)n expansion transcripts (ataxin 8 opposite
      strand, ATXN8OS) and the discovery of intranuclear polyglutamine inclusions suggests SCA8 pathogenesis
      involves toxic gain-of-function mechanisms at both the protein and RNA levels.
