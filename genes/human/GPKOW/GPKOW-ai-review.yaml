id: Q92917
gene_symbol: GPKOW
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: GPKOW is a nuclear MOS2-family protein with G-patch and KOW domains. It binds RNA and DHX16/hPrp2
  and participates in spliceosomal pre-mRNA processing. Pathogenic GPKOW variants cause X-linked developmental
  disorders involving growth, brain and eye abnormalities.
