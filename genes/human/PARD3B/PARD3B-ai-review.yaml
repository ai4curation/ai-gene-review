core_functions:
- description: Junction-localized PDZ scaffold that binds the polarity kinase LKB1 through a PARD3B-specific inter-PDZ segment and restrains LKB1-AMPK signalling. LKB1 binding is established with human Par3L constructs and in human colorectal cancer cells; kinase suppression is inferred from reduced AMPK phosphorylation in cells. This activity is subfamily-specific (PARD3 does not bind LKB1).
  molecular_function:
    id: GO:0019901
    label: protein kinase binding
  locations:
  - id: GO:0005923
    label: bicellular tight junction
  - id: GO:0005912
    label: adherens junction
  supported_by:
  - reference_id: PMID:24859006
    supporting_text: Unexpectedly, Par3L, but not Par3, binds to the tumour suppressor protein Lkb1 and inhibits its kinase activity.
  - reference_id: PMID:24859006
    supporting_text: Therefore, this short Par3L sequence is required for LKB1 binding.
  - reference_id: PMID:27908725
    supporting_text: Par3L depletion resulted in abnormal activation of Lkb1/AMPK signaling cascade.
- description: 'aPKC-independent component of the epithelial junctional polarity machinery: localizes to tight and adherens junctions without PAR6/aPKC binding and is required for single-lumen formation in human Caco-2 cysts, consistent with the PAR3-family role in apical-basal polarity inherited at PAINT node PTN001046835.'
  directly_involved_in:
  - id: GO:0045197
    label: establishment or maintenance of epithelial cell apical/basal polarity
  locations:
  - id: GO:0005923
    label: bicellular tight junction
  - id: GO:0005912
    label: adherens junction
  supported_by:
  - reference_id: PMID:12459187
    supporting_text: Nevertheless PAR3beta, expressed intrinsically or extrinsically, localizes to the tight junctions
  - reference_id: PMID:34815476
    supporting_text: Collectively these results demonstrate that PARD3B is required for normal lumen formation and support a role of PARD3B as a part of a polarity-complex in this process.
  - reference_id: PMID:33565714
    supporting_text: Thus, PARD3 and PARD3B have diverged such that PARD3 remains tightly associated with aPKC apically, while PARD3B localises to adherens junctions.
suggested_questions:
- question: Does PARD3B inhibit LKB1 catalytic activity directly (e.g. by competing with STRAD/MO25 or substrate access), or does it act by relocalizing LKB1? Only cellular AMPK phosphorylation has been measured.
- question: Which PARD3B splice isoforms bind PAR6, given the conflicting reports (no binding in PMID:12459187 and PMID:34815476 versus isoform-differential binding in PMID:12234671)?
- question: Should PAINT restrict aPKC-dependent family terms such as intracellular protein localization at PTN001046835 to the PARD3 subfamily, given that PARD3B has lost the FXR and KR aPKC-binding motifs?
suggested_experiments:
- hypothesis: PARD3B directly inhibits LKB1 kinase activity.
  description: In vitro kinase assays with purified LKB1-STRAD-MO25 complex and AMPK or peptide substrate, titrating wild-type PARD3B inter-PDZ fragment versus the PARD3-swap mutant that cannot bind LKB1.
  experiment_type: biochemical kinase assay
- hypothesis: PARD3B binds phosphoinositides through its PDZ2 domain like PARD3.
  description: Liposome flotation or lipid-overlay assays with purified PARD3B PDZ2, compared with PARD3 PDZ2.
  experiment_type: binding assay
