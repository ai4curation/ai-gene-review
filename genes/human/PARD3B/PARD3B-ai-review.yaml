id: Q8TEW8
gene_symbol: PARD3B
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: PARD3B (Par3beta, Par3-like/Par3L) is a vertebrate-specific paralog of the cell-polarity scaffold PARD3, a large multi-PDZ protein of the PAR3 family (PANTHER PTHR16484:SF4) with an N-terminal Par3/HAL oligomerisation region and three PDZ domains. In human epithelial cells it localizes to cell-cell junctions, at tight junctions together with ZO-1 and at lateral adherens junctions. Unlike PARD3, it has lost the conserved aPKC-binding motifs and does not detectably bind aPKC or stably bind PAR6, so its junctional targeting is independent of the PAR6-aPKC complex. Instead PARD3B binds the polarity kinase LKB1 (STK11/PAR-4) through a short PARD3B-specific segment between PDZ2 and PDZ3 and restrains LKB1-AMPK signalling, a mechanism shown to support mouse mammary stem cell maintenance and colorectal cancer cell survival. It also binds Inscuteable (INSC) and, when phosphorylated on Ser-746, 14-3-3 proteins. Knockdown in human intestinal epithelial cysts disrupts single-lumen formation,
  implicating it in apical-basal epithelial polarity, and mouse Pard3b loss causes spindle defects and tumours.
