  review:
    summary: PARD3B (Par3L), but not PARD3, binds the polarity kinase LKB1/STK11 (PAR-4). Binding maps to a short PARD3B-specific segment between PDZ2 and PDZ3; replacing it with the PARD3 sequence abolishes LKB1 binding by full-length human Par3L.
    action: NEW
    reason: Evidence is from co-immunoprecipitation (including endogenous mouse kidney lysates) and mapping with full-length human Par3L constructs (PMID:24859006), and the interaction was independently reproduced in human colorectal cancer cells (PMID:27908725). The binding region is unique to the PARD3B subfamily, so this is a subfamily-specific function and should not be transferred to PARD3 orthologs. MGI annotated the mouse result only as generic protein binding; protein kinase binding is the informative MF it supports. A kinase-inhibitor activity is not proposed because LKB1 inhibition was inferred from reduced AMPK phosphorylation in cells, not from a direct kinase assay.
    supported_by:
    - reference_id: PMID:24859006
      supporting_text: Unexpectedly, Par3L, but not Par3, binds to the tumour suppressor protein Lkb1 and inhibits its kinase activity.
    - reference_id: PMID:24859006
      supporting_text: Therefore, this short Par3L sequence is required for LKB1 binding.
    - reference_id: PMID:27908725
      supporting_text: Par3L depletion resulted in abnormal activation of Lkb1/AMPK signaling cascade.
