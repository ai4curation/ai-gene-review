- term:
    id: GO:0000226
    label: microtubule cytoskeleton organization
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - FB:FBgn0000163
  - MGI:MGI:2135608
  - PANTHER:PTN001046835
  - WB:WBGene00003918
  review:
    summary: IBA microtubule cytoskeleton organization, inherited from the PAR3 family root.
    action: KEEP_AS_NON_CORE
    reason: PARD3B (PTHR16484:SF4) inherits this from the PAINT family-root node PTN001046835, which unites the PARD3 and PARD3B subfamilies with Drosophila Bazooka and C. elegans PAR-3. Bazooka, mouse Pard3 and worm PAR-3 carry experimental support; there is no direct experimental evidence for human PARD3B. Mouse Pard3b knockout intestinal epithelium shows increased aberrant mitotic spindles, which is consistent with but does not establish a direct cytoskeletal role. Kept as an inherited, non-core family-level term; it is not evidence for transfer.
    supported_by:
    - &id001
      reference_id: file:human/PARD3B/PARD3B-uniprot.txt
      record_section: ["DR:PANTHER"]
      supporting_text: PANTHER; PTHR16484:SF4; PARTITIONING DEFECTIVE 3 HOMOLOG B; 1.
    - reference_id: PMID:41274508
      supporting_text: found increased mitotic cells, which have significantly higher ratios of aberrant spindles compared to that of the WT mice
- term:
