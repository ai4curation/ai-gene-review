    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:16458856
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q1MX18
  review:
    summary: 'IPI: interaction with INSC/Inscuteable (UniProtKB:Q1MX18). Human INSC binds PARD3B (Par3beta) as well as PARD3, an adaptor link in the conserved Par3-Insc-Pins (LGN/AGS3) spindle-orientation module.'
    action: REMOVE
    reason: Bare protein binding is uninformative under the protein-binding policy. The INSC interaction itself is credible and is retained in the description and core function text; no GO term exists for Inscuteable binding, and the abstract-only paper does not establish a more specific PARD3B molecular activity (e.g. adaptor activity) that would justify a MODIFY. Removal does not mean the interaction is false.
    supported_by:
    - &id005
      reference_id: PMID:16458856
      supporting_text: human Insc proteins bind to the human Pins homologues LGN and AGS3, and also to human Par3 and its related protein Par3beta
