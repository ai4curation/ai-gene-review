# Disease-associated GNRHR variants with a published in vitro functional result.
# Curated input for 02_variant_structure.py. Every entry carries the PMID and a
# verbatim sentence from the cached publication (publications/PMID_<n>.md, or the
# UniProt record where the paper itself is not open access). `reported_class` is
# the authors' call, not ours: COMPLETE_LOF, PARTIAL_LOF or LOF (severity not stated).
# `reported_mechanism` is filled only when the paper tested it (surface expression,
# pharmacoperone rescue, binding affinity) and is otherwise left out.
# `mechanism_pmid` names the paper for the mechanism when it is not the paper quoted.
# Residue numbers are those of UniProt P30968 (canonical, 328 aa); the script
# verifies each reference residue against that sequence and fails on a mismatch.
- {variant: N10K, pmid: 11397871, reported_class: PARTIAL_LOF, reported_mechanism: reduced_affinity,
   quote: "The Asn(10)Lys mutation in the extracellular amino-terminal domain of the receptor also reduced the affinity for GnRH in vitro."}
- {variant: T32I, pmid: 11297587, reported_class: COMPLETE_LOF,
   quote: "failed to respond to GnRH agonist stimulation"}
- {variant: E90K, pmid: 22918878, reported_class: COMPLETE_LOF, reported_mechanism: misfolding_rescuable,
   quote: "In cell cultures, E90K causes misfolding that leads to almost complete retention by the protein quality control system and subsequent degradation."}
- {variant: G99E, pmid: 30575316, reported_class: PARTIAL_LOF, reported_mechanism: reduced_affinity,
   quote: "Functional studies for the p.Gly99Glu mutation demonstrated a right-shifted GnRH-stimulated signaling response."}
- {variant: T104I, pmid: 21277937, reported_class: COMPLETE_LOF, reported_mechanism: misfolding_rescuable,
   quote: "Exposure to the pharmacoperone In3 rescued almost completely Thr104Ile mutant function to wild-type levels, whereas rescue was partial for the Tyr108Cys GnRHR."}
- {variant: Q106R, pmid: 11397871, reported_class: PARTIAL_LOF, reported_mechanism: reduced_affinity,
   quote: "in vitro analysis indicated that the mutant receptor was able to bind GnRH, but with a reduced affinity"}
- {variant: Y108C, pmid: 21277937, reported_class: COMPLETE_LOF, reported_mechanism: misfolding_rescuable,
   quote: "The Tyr108Cys mutant forms an aberrant disulfide bridge that prevents formation of the required Cys14-Cys200 bridge essential for GnRHR plasma membrane expression."}
- {variant: A129D, pmid: 10084584, reported_class: COMPLETE_LOF,
   quote: "This A129D mutation results in a complete loss of function"}
- {variant: V134G, pmid: 25016926, reported_class: COMPLETE_LOF,
   quote: "Functional analysis of the novel p.Y283H and p.V134G mutations demonstrated that both are completely inactivating."}
- {variant: R139H, pmid: 11397871, reported_class: COMPLETE_LOF,
   quote: "The Arg(139)His mutation completely eliminated detectable GnRH-binding activity and prevented GnRH-induced stimulation of inositol phosphate accumulation in vitro."}
- {variant: R139C, pmid: 20389088, reported_class: LOF, reported_mechanism: misfolding_rescuable,
   quote: "For this Arg139Cys mutation, expression was increased by the administration of IN3 (a GnRHR antagonist)"}
- {variant: S168R, pmid: 10523035, reported_class: COMPLETE_LOF, reported_mechanism: not_rescuable, mechanism_pmid: 19059461,
   quote: "this mutation resulted in the complete loss of the receptor-mediated signaling response to GnRH"}
- {variant: A171T, pmid: 12679486, reported_class: COMPLETE_LOF,
   quote: "Specific receptor binding of (125)I-labeled GnRH ligand was undetectable in Ala(171)Thr GnRH receptor-transfected cells."}
- {variant: C200Y, pmid: 11297587, reported_class: COMPLETE_LOF, reported_mechanism: misfolding_rescuable, mechanism_pmid: 19246515,
   quote: "failed to respond to GnRH agonist stimulation"}
- {variant: S217R, pmid: 10022417, reported_class: LOF, reported_mechanism: not_rescuable, mechanism_pmid: 19059461,
   quote: "both Gln106Arg and Ser217Arg mutations altered hormone binding"}
- {variant: R262Q, pmid: 10022417, reported_class: PARTIAL_LOF, reported_mechanism: impaired_coupling,
   quote: "the Arg262Gln mutation altered activation of phospholipase C"}
- {variant: L266R, pmid: 11297587, reported_class: COMPLETE_LOF,
   quote: "failed to respond to GnRH agonist stimulation"}
- {variant: C279Y, pmid: 11297587, reported_class: COMPLETE_LOF, reported_mechanism: misfolding_rescuable, mechanism_pmid: 22679506,
   quote: "failed to respond to GnRH agonist stimulation"}
- {variant: P282R, pmid: 22679506, reported_class: COMPLETE_LOF, reported_mechanism: not_rescuable,
   quote: "Measurement of membrane binding, Gαq/11 protein signaling as well as the ability to rescue nascent receptor trafficking show that Pro282Arg is a complete loss-of-function mutant and Tyr323Cys is a partial loss-of-function mutant."}
- {variant: Y283H, pmid: 25016926, reported_class: COMPLETE_LOF,
   quote: "Functional analysis of the novel p.Y283H and p.V134G mutations demonstrated that both are completely inactivating."}
- {variant: Y284C, pmid: 25016926, reported_class: PARTIAL_LOF, reported_mechanism: misfolding_rescuable, mechanism_pmid: 22679506,
   quote: "the p.Y284C severely affects the receptor signaling capacity, with minimal activity retained"}
- {variant: Y323C, pmid: 22679506, reported_class: PARTIAL_LOF, reported_mechanism: misfolding_rescuable,
   quote: "The Tyr323Cys mutant has an increased GnRH binding affinity but reduced receptor expression at the plasma membrane and impaired G protein-coupling."}
