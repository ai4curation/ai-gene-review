id: P30968
gene_symbol: GNRHR
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  Class A (rhodopsin-like) G protein-coupled receptor for the hypothalamic decapeptide gonadotropin-releasing
  hormone (GnRH). It sits in the plasma membrane of anterior pituitary gonadotropes, where pulsatile GnRH
  binding activates Gq/11 and phospholipase C-beta, producing inositol trisphosphate and diacylglycerol,
  mobilizing calcium and activating protein kinase C and MAPK cascades; these drive the synthesis and
  secretion of luteinizing hormone and follicle-stimulating hormone and so control puberty and fertility.
  The same receptor mediates the actions of GnRH-II, whose own receptor gene is disrupted in humans. Mammalian
  type I GnRH receptors, the human one included, end at the last residue of the seventh transmembrane
  helix and have no cytoplasmic C-terminal tail: they do not recruit beta-arrestin, do not desensitize
  rapidly and internalize slowly. The human receptor also folds inefficiently, so that a substantial share
  of newly made protein is retained by endoplasmic reticulum quality control; a lysine at position 191
  in the second extracellular loop, found in primates, contributes to this. Biallelic loss-of-function
  variants cause autosomal recessive normosmic hypogonadotropic hypogonadism, in most cases because the
  mutant receptor misfolds and fails to reach the cell surface. A truncated splice isoform neither binds
  GnRH nor signals and lowers surface expression of the full-length receptor when co-expressed.
