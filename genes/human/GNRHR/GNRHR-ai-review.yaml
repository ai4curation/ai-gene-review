    label: gonadotropin secretion
  evidence_type: NAS
  original_reference_id: PMID:8386108
  qualifier: involved_in
  review:
    summary: Gonadotropin secretion as a non-traceable author statement from the cloning paper.
    action: MODIFY
    reason: >-
      The receptor does not itself release gonadotropin; it is the gonadotrope's sensor for GnRH, and
      its Gq/11 signalling triggers LH and FSH release. That is positive regulation of the secretory process,
      so the row is corrected laterally to GO:0032278 positive regulation of gonadotropin secretion. The
      role is central to the gene and is listed in core_functions: mice with a loss-of-function Gnrhr
      allele have low circulating reproductive hormones and few gonadotropes (PMID:15625238), and biallelic
      human variants cause hypogonadotropic hypogonadism.
    proposed_replacement_terms:
    - id: GO:0032278
      label: positive regulation of gonadotropin secretion
    supported_by:
