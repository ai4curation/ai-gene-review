- name: '1'
  id: P30968-1
- name: 2 (Truncated)
  id: P30968-2
  sequence_note: VSP_001914
functional_isoforms:
- id: GNRHR_FULL_LENGTH
  name: Full-length GnRH receptor (isoform 1)
  type: SPLICE_VARIANT
  maps_to:
  - type: UNIPROT_ISOFORM
    ids:
    - P30968-1
  description: >-
    The 328-residue seven-transmembrane receptor. It binds GnRH and activates phospholipase C (PMID:8386108,
    PMID:9259321). All annotations in this review are to this isoform.
- id: GNRHR_TRUNCATED
  name: Truncated splice variant (isoform 2)
  type: SPLICE_VARIANT
  maps_to:
  - type: UNIPROT_ISOFORM
    ids:
    - P30968-2
  description: >-
    Product of a cryptic splice acceptor in exon 2 that shifts the reading frame after residue 175, replacing
    transmembrane helices 5 to 7 with 75 unrelated residues. In transfected COS-7 cells it reaches the
    membrane at lower density, does not bind ligand or activate phospholipase C, and reduces maximal signalling
    and plasma membrane insertion of co-expressed full-length receptor, with no effect on other Gq/11-coupled
    receptors (PMID:9259321). Whether it is made in the pituitary at a level that matters is not known;
    the evidence is from overexpression.
