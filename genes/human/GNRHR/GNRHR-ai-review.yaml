proposed_new_terms: []
suggested_questions:
- question: >-
    Are people homozygous for GNRHR Q106R or R262Q, who are present in gnomAD at about the Hardy-Weinberg
    number, unaffected, mildly affected, or affected and reversed? What fraction of such homozygotes ever
    present with delayed puberty?
- question: >-
    Does P146S (ICL2, at the G-alpha-q interface, four homozygotes in gnomAD) reduce Gq/11 coupling at
    all, or is it a benign polymorphism listed among disease variants?
- question: >-
    Is the truncated isoform 2 translated in human gonadotropes at a level sufficient to lower surface
    expression of the full-length receptor, or is its inhibitory effect an overexpression result?
- question: >-
    Is there a Cys14-Cys200 disulfide in the native human receptor, and how does Lys191 change the probability
    that it forms? No experimental structure resolves either residue.
suggested_experiments:
- description: >-
    Recall-by-genotype of Q106R and R262Q homozygotes and compound heterozygotes from a biobank with linked
    records: pubertal timing, LH pulsatility, testosterone or estradiol, fertility history and response
    to a GnRH stimulation test.
  hypothesis: >-
    Biallelic partial loss-of-function genotypes are incompletely penetrant and give a continuous range
    from normal reproductive function through delayed puberty and reversible hypogonadism to partial hypogonadotropic
    hypogonadism.
  experiment_type: human genetics, recall by genotype
- description: >-
    Measure surface expression (epitope-tag ELISA), GnRH binding and inositol phosphate accumulation for
    every ClinVar missense variant in one cell background, with and without a pharmacoperone, and compare
    with the structural class computed for each residue.
  hypothesis: >-
    Variants at buried transmembrane positions lose surface expression and are rescued by pharmacoperones
    unless they introduce a charge facing the lipid or helix core (S168R, S217R, P282R); variants at the
    G-alpha-q interface (R262Q, R262W, P146S) keep surface expression and binding but lose coupling.
  experiment_type: deep mutational scanning or arrayed functional assay
- description: >-
    Determine a structure of the human receptor that resolves the N-terminus and extracellular loop 2
    (residues 1-17 and 184-191), with and without Lys191.
  hypothesis: >-
    Lys191 displaces extracellular loop 2 so that Cys200 is less often positioned to pair with Cys14,
    lowering the fraction of receptor that passes endoplasmic reticulum quality control.
  experiment_type: cryo-EM
knowledge_gaps:
- gap_statement: >-
    The penetrance of biallelic partial loss-of-function GNRHR genotypes is unknown. Homozygotes for Q106R
    and R262Q are not depleted in gnomAD, yet the same genotypes are reported in patients with partial
    hypogonadotropic hypogonadism.
  boundary: >-
    Known: both alleles reduce receptor function in vitro (Q106R lowers GnRH affinity, R262Q impairs phospholipase
    C activation); biallelic genotypes built from them are found in patients, sometimes with reversal;
    and for biallelic genotypes severity tracks genetic load across a patient cohort. Not known: what
    happens to an unselected person who carries one of these genotypes, because population databases carry
    no reproductive phenotype.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    It decides how these two alleles, the most frequent in patients, should be classified and counselled,
    and whether a second factor is needed for disease.
  resolution: >-
    Phenotype homozygotes and compound heterozygotes ascertained by genotype and not by clinic, in a cohort
    with endocrine and fertility data.
  provenance:
  - reference_id: file:human/GNRHR/GNRHR-bioinformatics/RESULTS.md
    supporting_text: Q106R and R262Q are the two alleles reported as partial loss of function and as the
  - reference_id: PMID:22745237
    supporting_text: for patients with monoallelic GNRHR mutations this correlation does not hold
- gap_statement: >-
    How Lys191 and the N-terminus to extracellular loop 2 region set the folding efficiency of the human
    receptor has no experimental structural basis.
  boundary: >-
    Known from mutagenesis: deleting Lys191 raises expression about fourfold, and a Cys14-Cys200 bridge
    is reported to be needed for surface expression of the human receptor and dispensable in rodent receptors.
    Not known: the geometry. Residues 1-17 and 184-191 are absent from the only human structure, the AlphaFold
    model has low confidence there, and the pig receptor used for the active-state structure has glycine
    at position 200.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    This region is where C200Y and Y108C act and is the proposed reason that human GNRHR is unusually
    sensitive to misfolding mutations.
  resolution: >-
    A structure of the human receptor resolving both segments, with the Lys191 deletion as comparison.
  provenance:
  - reference_id: file:human/GNRHR/GNRHR-bioinformatics/RESULTS.md
    supporting_text: Lys191 and Cys14 are not modelled in 7BR3.
  - reference_id: PMID:10379888
    supporting_text: >-
      Deletion of Lys191 from the human GnRH receptor caused a 4-fold increase in receptor expression
      in COS-1 and HEK 293 cells
