  review:
    summary: >-
      GnRH receptor activity inherited from the PAINT node PTN002797483 (Euteleostomi GnRH receptor clade),
      seeded by the human receptor itself and two zebrafish GnRH receptors.
    action: ACCEPT
    reason: >-
      This is the defining molecular function. The IBD sits on the GnRH receptor clade and not on the
      wider neuropeptide receptor family, which is the right depth: the family's other subfamilies bind
      oxytocin, vasopressin, orexin and cholecystokinin. The human protein appears among the seeds because
      its own IDA (PMID:8386108) is one of the experimental annotations the node rests on; that is expected
      and not circular. The cloned human receptor binds GnRH agonists and an antagonist with nanomolar
      affinity and responds with phosphoinositide turnover.
    supported_by:
    - reference_id: PMID:8386108
      supporting_text: >-
        agonists and an antagonist displaced [125I]GnRH agonist from membrane isolates with nanomolar
        range dissociation constants similar to those described for displacement from human pituitary
        membranes
    - reference_id: PMID:8386108
      supporting_text: >-
        Transfected COS-1 cells manifested a GnRH-stimulated increase in phosphoinositol turnover, with
        an EC50 of approximately 3 nM, which was inhibited by GnRH antagonists
