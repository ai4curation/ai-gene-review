core_functions:
- description: CEP250/C-Nap1 contributes cohesive structural material at proximal parental centriole ends
    and anchors linker components. Dynamic contacts between C-Nap1 assemblies and their association with
    rootlet-fiber termini maintain interphase centriole pairing and organize the centrosomal linker.
