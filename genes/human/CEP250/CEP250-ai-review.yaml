  review:
    summary: Human full-length CEP250 A609V changes primary-cilium length relative to WT CEP250 in transfected
      ARPE-19 cells.
    action: KEEP_AS_NON_CORE
    reason: Retain the existing experimental cilium-assembly assertion as non-core, with support confined
      to the measured ciliary phenotype. PMID:28005958 Figure 4 and Methods compare tagged human full-length
      WT and A609V CEP250 in ARPE-19 cells with endogenous CEP250 still present; mutant-expressing cells
      have longer cilia. This is not a depletion/rescue test or a demonstration that native CEP250 is
      required to initiate cilia, and the separate endogenous retinal localization is in mouse. A static
      length endpoint does not resolve assembly versus disassembly rate, so a more specific regulatory
      or directional process term is not imposed. Normal ciliation in PMID:28100636 knockout cells limits
      an essential-assembly interpretation; its divergent length observations were explicitly considered
      compatible with clonal variation. No normal human photoreceptor mechanism or untested isoform is
      inferred.
