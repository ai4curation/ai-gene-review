id: Q9BV73
gene_symbol: CEP250
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CEP250, also called C-Nap1, is a large coiled-coil centrosomal protein concentrated at the
  proximal ends of parental centrioles. It forms cohesive assemblies and anchors components of the centrosomal
  linker, maintaining interphase centriole proximity and organizing the centrosomal accumulation of linker
  proteins. Its association with the centrosome changes during the cell cycle and is regulated by phosphorylation,
  including modification by NEK2. Human CEP250 variants are associated with retinal and auditory disease;
  experimental ciliary phenotypes depend on cell type and perturbation context.
