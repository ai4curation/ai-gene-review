  review:
    summary: C-Nap1 undergoes cell-cycle-dependent redistribution and contributes to the centrosomal structural
      cycle.
    action: KEEP_AS_NON_CORE
    reason: The original human-cell study measures C-Nap1 mitotic phosphorylation/dissociation, phosphatase-sensitive
      antibody recognition and overexpression effects on microtubule organization; it does not show that
      C-Nap1 is degraded or catalyzes the cell-cycle transition. Retain the broad existing process with
      independent evidence that C-Nap1 itself maintains interphase centriole cohesion. The more descriptive
      core is the structural cohesion function, not an intrinsic kinase or an absolute requirement for
      all mitoses.
