suggested_questions:
- question: Which physiological cilium-assembly roles of CEP250 remain after reconciling validated null
    cells, the exact 2013 RNAi reagents and disease-variant expression, and which descendant experiments
    support PAINT node PTN000570270?
- question: Do the retinal donor experiments establish direct involvement in light detection, or a maintenance
    role that secondarily changes retinal electrophysiology?
- question: Which original perturbation or supplementary records underlie the protein-localization and
    cohesion assertions attributed to PMID:23213374, and which experimental construct maps to the NIN
    partner Q8N4C6-7?
- question: How do the two recorded CEP250 products differ in native expression, centrosomal assembly
    and disease susceptibility?
- question: How does multisite phosphorylation change C-Nap1 assembly and rootlet anchoring, and do purified
    full-length measurements support phase separation or another cohesive material state?
suggested_experiments:
- description: Compare sequence-verified 2013 RNAi reagents in wild-type and independently derived CEP250-null
    human cells, with rescue at near-endogenous expression and separate formation, maintenance and length
    readouts.
- description: Measure purified full-length C-Nap1 assembly and rootlet-end association before and after
    defined phosphorylation, alongside endogenous centriole-cohesion imaging.
