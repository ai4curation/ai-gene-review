id: O75386
gene_symbol: TULP3
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: TULP3 is a tubby-family adaptor that delivers integral membrane proteins into the primary
  cilium. Its C-terminal tubby domain binds PI(4,5)P2 and captures ciliary localization sequences of cargo
  such as rhodopsin-family GPCRs (GPR161, SSTR3, MCHR1, FFAR4, GPR45) and the polycystin-1/2 complex at
  the plasma membrane, while its N-terminal region binds the intraflagellar transport complex A (IFT-A),
  which carries TULP3 and cargo through the ciliary base. Release of cargo is favored by the PI(4,5)P2-poor,
  PI(4)P-rich ciliary membrane maintained by INPP5E. By importing the Gs-coupled receptor GPR161 into
  cilia, TULP3 acts as a negative regulator of Sonic hedgehog signalling in neural tube patterning. TULP3
  can also translocate to the nucleus upon Gq/PLC-beta-mediated PI(4,5)P2 hydrolysis, and has been reported
  to interact with SIRT1 and, in mouse, to mediate metabolic responses to lithocholic acid. Biallelic
  TULP3 variants cause progressive liver, kidney and heart fibrosis.
