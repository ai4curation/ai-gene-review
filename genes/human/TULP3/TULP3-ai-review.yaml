core_functions:
- description: Adaptor bridging IFT-A (via its N terminus) and PI(4,5)P2-bound integral membrane cargo
    (via the tubby domain) to import GPCRs and polycystins into the primary cilium.
  molecular_function:
    id: GO:0030674
    label: protein-macromolecule adaptor activity
  directly_involved_in:
  - id: GO:0097499
    label: protein localization to non-motile cilium
  locations:
  - id: GO:0005929
    label: cilium
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:20889716
    supporting_text: We find that specific Tubby family proteins, notably Tubby-like protein 3 (TULP3),
      bind to the IFT-A complex.
  - reference_id: PMID:20889716
    supporting_text: Both IFT-A and membrane phosphoinositide-binding properties of TULP3 are required
      for ciliary GPCR localization.
  - reference_id: PMID:28154160
    supporting_text: In this study, we determine that the tubby family protein TULP3 functions as a general
      adapter for ciliary trafficking of structurally diverse integral membrane cargo, including multiple
      reported and novel rhodopsin family G protein-coupled receptors (GPCRs) and the polycystic kidney
      disease-causing polycystin 1/2 complex.
  - reference_id: PMID:28154160
    supporting_text: We propose a three-step model for TULP3/TUB-mediated ciliary trafficking, including
      the capture of diverse membrane cargo by the tubby domain in a phosphoinositide 4,5-bisphosphate
      (PI(4,5)P2)-dependent manner, ciliary delivery by intraflagellar transport complex A binding to
      the TULP3/TUB N terminus, and subsequent release into PI(4,5)P2-deficient ciliary membrane.
  - reference_id: PMID:36775821
    supporting_text: TULP3, the cargo adapter, interacts with IFT-A through its N-terminal region, and
      interface mutations disrupt cargo transport.
- description: Binds PI(4,5)P2 through the tubby domain, coupling cargo capture to membrane phosphoinositide
    identity (read-out of INPP5E-set ciliary PI(4)P/PI(4,5)P2).
  molecular_function:
    id: GO:0005546
    label: phosphatidylinositol-4,5-bisphosphate binding
  directly_involved_in:
  - id: GO:0061512
    label: protein localization to cilium
  supported_by:
  - reference_id: PMID:28154160
    supporting_text: The first step involves the capture of membrane cargo by TULP3 in the plasma membrane
      in a PI(4,5)P2-dependent manner.
  - reference_id: PMID:26305592
    supporting_text: Increasing ciliary PI(4,5)P2 levels or conferring the ability to bind PI(4)P on Tulp3
      increases the ciliary localization of Tulp3.
  - reference_id: PMID:26305592
    supporting_text: Therefore, Inpp5e regulates ciliary membrane phosphoinositide composition, and Tulp3
      reads out ciliary phosphoinositides to control ciliary protein localization, enabling Hh signaling.
- description: Binds the IFT-A complex, which carries TULP3-cargo complexes into cilia.
  molecular_function:
    id: GO:0120160
    label: intraciliary transport particle A binding
  directly_involved_in:
