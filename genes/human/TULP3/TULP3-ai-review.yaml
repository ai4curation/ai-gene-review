    supporting_text: We find that specific Tubby family proteins, notably Tubby-like protein 3 (TULP3),
      bind to the IFT-A complex.
  - reference_id: PMID:36775821
    supporting_text: TULP3, the cargo adapter, interacts with IFT-A through its N-terminal region, and
      interface mutations disrupt cargo transport.
suggested_questions:
- question: 'How is cargo released from TULP3 inside cilia: is PI(4,5)P2 depletion by INPP5E sufficient,
    or are additional factors required?'
- question: Which tubby-domain surface recognizes cargo ciliary-localization sequences, and do patient
    variants (e.g., R382W) act by impairing cargo recognition rather than lipid binding?
- question: Are the mouse lithocholic acid/SIRT1/AMPK functions of TULP3 conserved in human cells, and
    do they relate to its ciliary role?
- question: Does nuclear TULP3 have any transcriptional function, or is nuclear translocation simply a
    consequence of PI(4,5)P2 loss?
suggested_experiments:
- hypothesis: Ciliary cargo release by TULP3 requires PI(4,5)P2 depletion in the ciliary membrane.
  description: Acutely raise ciliary PI(4,5)P2 (cilium-targeted PIP5K or INPP5E inhibition) and track
    single-molecule TULP3-GPR161 complexes entering and dissociating in human RPE1 cilia.
  experiment_type: Live-cell imaging with chemically induced lipid manipulation
- hypothesis: Fibrosis in TULP3-deficient patients reflects loss of ciliary cargo delivery rather than
    sirtuin regulation.
  description: Rescue TULP3-null patient-derived cells with IFT-A-binding or PI(4,5)P2-binding mutants
    and measure ciliary cargo and fibrotic gene expression.
  experiment_type: Separation-of-function rescue
