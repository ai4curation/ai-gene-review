        such as Slug and Sox9
    - reference_id: PMID:12511599
      supporting_text: Loss-of-function experiments with antisense AP2alpha morpholino oligonucleotides result in severe reduction
        in the NC territory.
    - reference_id: PMID:31848212
      supporting_text: According to this model, TFAP2A/C heterodimers mediate neural plate border induction, whereas TFAP2A/B
        heterodimers promote neural crest specification.
    - reference_id: PMID:17258188
      supporting_text: simultaneous inhibition of tfap2a and tfap2c utterly prevents neural crest induction, supporting a
        conserved role for Tfap2-type activity in neural crest induction
    - reference_id: PMID:21204207
      supporting_text: are evidence for BOFS as a neurocristopathy
