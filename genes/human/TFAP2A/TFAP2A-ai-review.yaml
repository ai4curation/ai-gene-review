id: P05549
gene_symbol: TFAP2A
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Transcription factor AP-2-alpha (AP-2alpha) is a nuclear, sequence-specific DNA-binding transcription factor
  of the AP-2 family. It binds GCC(N3)GGC elements as a homodimer or as a heterodimer with AP-2beta or AP-2gamma, using a
  basic DNA-binding region next to a C-terminal helix-span-helix dimerization domain. An N-terminal proline-rich transactivation
  domain recruits the CITED2 and p300/CBP coactivators. The same domain is inhibited by KCTD1/KCTD15, and SUMOylation dampens
  activity. AP-2alpha activates most of its targets, but it represses others in a promoter-specific way (for example C/EBPalpha,
  MYC and SOD2), partly by recruiting corepressors such as NPM1. It is one of the earliest regulators of the embryonic ectoderm.
  It is expressed in non-neural ectoderm and at the neural plate border during gastrulation, and then in premigratory and
  migratory neural crest. In frog it initiates the neural plate border upstream of PAX3 and later acts again within the crest
  as a crest specifier. In chick it opens chromatin at border enhancers with AP-2gamma and then at crest specification enhancers
  with AP-2beta. Loss of AP-2alpha, or of AP-2alpha together with AP-2gamma, disrupts crest induction or development in frog
  and zebrafish. Mouse mutants have cranial neural tube closure failure, craniofacial, body wall, eye, ear and limb malformations.
  Heterozygous mutations in human TFAP2A cause branchio-oculo-facial syndrome. AP-2alpha also acts in epidermal keratinocytes,
  lens and retinal development, and dental mesenchymal cells, and it is often dysregulated in cancers. A single AP-2 gene
  in amphioxus is expressed in non-neural ectoderm but not at the neural plate border, so the ectodermal role is ancestral
  in chordates and deployment in the neural crest is a vertebrate co-option.
