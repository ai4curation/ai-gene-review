suggested_questions:
- question: 'GO has no neural plate border formation/specification term. AP-2alpha is the clearest case for one: it initiates
    the border (upstream of pax3) before crest specification. Should a neural plate border term be created, so that AP-2alpha,
    Pax3/7, Zic1, Msx1 and Hes4 can be annotated to it apart from GO:0014029 and GO:0014036?'
- question: AP-2alpha spans both the border and the specifier layers, and only one NC term (GO:0014029) was proposed, to avoid
    ancestor/descendant redundancy. Should the project convention allow a border gene that also specifies the crest to carry
    GO:0014036 as well, as zebrafish tfap2a already does by IMP?
- question: Pioneer factor activity (opening closed chromatin at border and crest enhancers) has no GO molecular function
    term. Is a term needed, or is chromatin binding plus transcription activator activity enough?
- question: Epidermis/non-neural ectoderm development is the ancestral AP-2 role (amphioxus) but is not annotated to human
    TFAP2A, possibly because of TFAP2C redundancy in mammals. Should a TFAP2A epidermis development annotation rest on combined
    Tfap2a/Tfap2c mouse epidermal knockouts?
- question: Several UniProt-cited interactions (MYO6; RALBP1/EPN1/NUMB) may involve the clathrin adaptor complex AP-2 rather
    than transcription factor AP-2alpha. Should these be audited across TFAP2A records?
suggested_experiments:
- description: Test whether amphioxus AP-2, expressed in Xenopus neuralized ectoderm, can impose a border-like pattern (pax3
    activation) and induce snail2/sox9 as Xenopus AP2a does. This separates protein-level from cis-regulatory evolution of
    the AP-2 border role.
- description: Profile TFAP2A/TFAP2C and TFAP2A/TFAP2B heterodimer occupancy (CUT&RUN) in human pluripotent stem cell-derived
    neural plate border and cranial neural crest, to test whether the chick partner switch holds in human.
- description: Map AP-2 binding at the lamprey and amphioxus orthologous enhancers of pax3/7, msx and soxE, to ask whether
    border/crest AP-2 inputs are vertebrate-specific cis-regulatory additions.
proposed_new_terms:
- proposed_name: neural plate border formation
  proposed_definition: The formation of the neural plate border, the region of ectoderm at the boundary
    between the neural plate and the non-neural ectoderm that is competent to give rise to neural crest,
    preplacodal ectoderm, dorsal neural tube and epidermis.
  justification: GO has no term for the neural plate border. GO:0014029 neural crest formation is defined
    as forming this ectodermal region but is placed under epithelial to mesenchymal transition, so border
    specifiers end up annotated to an EMT term. The border is conserved in chordates without neural crest
    (amphioxus, tunicates), so it cannot be a part of neural crest formation. See projects/NEURAL_CREST_FORMATION_OBSOLETION.md.
  proposed_parent:
    id: GO:0007398
    label: ectoderm development
  supported_by:
  - reference_id: PMID:21169220
    supporting_text: As the earliest known NB specifier, AP2a mediates Wnt signals to initiate the NB
      and activate pax3; as a NC specifier, AP2a regulates further NC development independent of and downstream
      of NB patterning.
  - reference_id: PMID:21169220
    supporting_text: AP2a initiates NB patterning and is sufficient to elicit a NB-like pattern in neuralized
      ectoderm.
