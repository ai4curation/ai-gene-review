  review:
    summary: Buettner et al. 1993 cloned AP-2B, an alternatively spliced TFAP2A product that lacks the dimerization domain.
      AP-2B acts as a dominant-negative inhibitor of AP-2 transactivation.
    action: ACCEPT
    reason: This is a real negative regulatory output of the TFAP2A gene, but it belongs to a minor splice isoform (UniProt
      isoform 4, AP-2B) that interferes with AP-2 activity. It is not repression of target promoters by full-length AP-2alpha.
      Accepted for consistency with the other GO:0000122 rows, because negative regulation of Pol II transcription is a genuine
      output of the gene. Note that this row reflects the isoform 4 dominant-negative mechanism.
