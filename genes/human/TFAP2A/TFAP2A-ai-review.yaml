  evidence_type: ISS
  original_reference_id: PMID:21169220
  review:
    summary: 'AP-2alpha acts at two steps of crest formation. At the neural plate border it is the earliest border specifier:
      it is induced by Wnt, activates pax3, and alone can impose a border-like pattern on neuralized ectoderm. Within the
      crest it then acts as a crest specifier, sufficient to induce Slug/Sox9, and as a pioneer factor that opens border (with
      TFAP2C) and then crest (with TFAP2B) enhancers.'
    action: NEW
    reason: "Human TFAP2A has no neural crest process term. Frog, chick, zebrafish and mouse data show that AP-2alpha is a DNA-binding TF that acts first at the neural plate border: induced by Wnt, it activates pax3 and alone imposes a border-like pattern on neuralized ectoderm; with TFAP2C it opens border enhancers. That border-initiating step is captured by the proposed term 'neural plate border formation' (NTR), which replaces GO:0014029 (proposed for obsoletion: its text describes the border region but it is placed under epithelial to mesenchymal transition; projects/NEURAL_CREST_FORMATION_OBSOLETION.md). The later crest-specifier role is a separate NEW row at GO:0014036. ISS because the experiments are on vertebrate orthologs."
    supported_by:
    - reference_id: PMID:21169220
      supporting_text: As the earliest known NB specifier, AP2a mediates Wnt signals to initiate the NB and activate pax3;
        as a NC specifier, AP2a regulates further NC development independent of and downstream of NB patterning.
    - reference_id: PMID:21169220
      supporting_text: AP2a initiates NB patterning and is sufficient to elicit a NB-like pattern in neuralized ectoderm.
    - reference_id: PMID:12511599
