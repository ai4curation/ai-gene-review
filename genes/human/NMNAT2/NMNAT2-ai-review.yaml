- term:
    id: GO:0004515
    label: nicotinate-nucleotide adenylyltransferase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: >-
      Phylogenetic (IBA) transfer of the nicotinate-nucleotide adenylyltransferase (EC 2.7.7.18)
      activity across the eukaryotic NMN adenylyltransferase family. This is directly supported for
      human NMNAT2 by experimental assays (PMID:16118205, PMID:17402747) and by UniProt EC=2.7.7.18.
      One of the two core catalytic activities.
    action: ACCEPT
    reason: >-
      ACCEPT: the activity is performed by NMNAT2 itself, which is a monomer, so enables is the
      right qualifier. The node (PANTHER:PTN000247701) is seeded from a deep and diverse set of
      descendants spanning plant (AGI_LocusCode:AT5G55810), fly (FB:FBgn0039254), two mouse genes,
      the bacterial NadD (UniProtKB:P0A752) and the human paralogs NMNAT1 (UniProtKB:Q9HAN9) and
      NMNAT3 (UniProtKB:Q96T66), which places the adenylyl-transfer function at or near the base of
      the family rather than in a recent clade. Note that Q9BZQ4 itself appears in the WITH/FROM
      list: that is expected and correct, not circular, because NMNAT2's own experimental
      annotations are among the descendant evidences the PAINT curator used to place the IBD, and
      the IBA then adds the further claim that the function is inherited rather than
      lineage-specific.
    supported_by:
    - reference_id: file:human/NMNAT2/NMNAT2-uniprot.txt
      supporting_text: >-
        Can also use the deamidated form; nicotinic acid mononucleotide (NaMN) as substrate but
        with a lower efficiency
