    label: cytoplasmic vesicle membrane
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: located_in
  review:
    summary: >-
      Cytoplasmic vesicle membrane location transferred by sequence similarity from mouse Nmnat2
      (Q8BNJ3). Consistent with NMNAT2 being palmitoylated and delivered to axons on Golgi-derived
      cytoplasmic vesicles. Correct; duplicates the IEA cytoplasmic-vesicle-membrane annotation.
    action: ACCEPT
    reason: >-
      ACCEPT: this is a curator-judged similarity transfer from mouse Nmnat2, the same source that
      UniProt uses for the location, and the structural basis for the transfer is conserved - the
      palmitoylation sites Cys-164 and Cys-165 that anchor the mouse protein to vesicle membranes are
      present in the human sequence. Mouse and human NMNAT2 are 1:1 orthologs with no evidence of
      divergence in trafficking, so the transfer is sound; it is kept despite duplicating the IEA
      row because the two arrive by different routes.
    supported_by:
    - reference_id: file:human/NMNAT2/NMNAT2-uniprot.txt
      supporting_text: >-
        {ECO:0000250|UniProtKB:Q8BNJ3}. Cytoplasmic vesicle membrane
- term:
    id: GO:0061564
    label: axon development
  evidence_type: ISS
  original_reference_id: PMID:30304512
  qualifier: involved_in
  review:
    summary: >-
      Axon development role, transferred by similarity to mouse Nmnat2, supported by Gilley et al.
      2019: NMNAT2 is "an endogenous axon maintenance factor that preserves axon health by blocking
      Wallerian-like axon degeneration", mice lacking it "die at birth with severe axon defects", and
      reduced levels compromise peripheral axon development. This axon-maintenance/development role is
      genuine and physiologically important, but the primary evolved function is the adenylyltransferase
      activity, so this is kept as non-core.
    action: KEEP_AS_NON_CORE
    reason: >-
      KEEP_AS_NON_CORE, and the reasoning matters because the evidence here is unusually strong
      necessity evidence that could easily be over-read. Nmnat2-null mice die at birth with severe
      axon defects, and compound heterozygotes with merely reduced levels already have fewer
      myelinated sensory axons at 1.5 months and slower neurite outgrowth - so NMNAT2 is plainly
      required for axon development. What NMNAT2 contributes to that process, however, is NAD+:
      the gene product does not itself extend or guide an axon, it sustains a metabolite pool whose
      depletion activates the pro-degenerative NADase SARM1. The participation is therefore real but
      indirect and mediated by the catalytic function already annotated, which is why it is retained
      as a genuine non-core role rather than promoted to core or removed. The evidence code is also
      a reminder of scope: ISS from mouse Q8BNJ3, since the human developmental phenotype is inferred
      rather than measured.
    supported_by:
    - reference_id: PMID:30304512
      supporting_text: >-
        Nicotinamide mononucleotide adenylyltransferase 2 (NMNAT2) is an endogenous axon maintenance
        factor that preserves axon health by blocking Wallerian-like axon degeneration.
    - reference_id: PMID:30304512
      supporting_text: >-
        These data reveal that reducing NMNAT2 levels below a particular threshold compromises the
        development of peripheral axons and increases their vulnerability to stresses.
- term:
    id: GO:0140768
    label: protein ADP-ribosyltransferase-substrate adaptor activity
  evidence_type: IDA
  original_reference_id: PMID:34314702
  qualifier: enables
  review:
    summary: >-
      Challa et al. 2021 show NMNAT2 supports PARP16 (a mono-ADP-ribosyltransferase) activity toward
      ribosomal proteins, with NMNAT2 and PARP16 physically interacting and catalytically active NMNAT2
      enhancing PARP16 auto-MARylation. This is a context-specific (cytosolic NAD+ supply, high-PARP16
      ovarian cancer) moonlighting role largely mediated through NAD+ production rather than the core
      metabolic function. Experimental IDA; retained as non-core.
    action: KEEP_AS_NON_CORE
    reason: >-
      KEEP_AS_NON_CORE: the underlying experiment is sound and the curator read the full text, so the
      role itself is not in doubt - depleting NMNAT2 or PARP16 inhibits ribosomal-protein MARylation,
      and NMNAT2 and PARP16 physically interact. It is non-core because it is a specialised,
      context-dependent use of the enzyme's product rather than a second evolved activity. One
      term-fit tension is worth flagging to a curator rather than acting on unilaterally: GO:0140768
      is defined as an enzyme-substrate adaptor that brings together an ADP-ribosyltransferase and
      its substrate, which implies a bridging function separable from catalysis - yet UniProt records
      that the catalytically dead variants H24D and W92G abolish not only adenylyltransferase
      activity but also the ability to promote mono-ADP-ribosylation of ribosomes
      (ECO:0000269|PubMed:34314702). That catalysis-dependence points to local NAD+ supply as the
      mechanism rather than adaptor bridging. The action is left unchanged pending curator input and
      the question is recorded under suggested_questions.
    supported_by:
    - reference_id: PMID:34314702
      supporting_text: >-
        NMNAT-2 supports the catalytic activity of the mono(ADP-ribosyl) transferase (MART) PARP-16,
        which mono(ADP-ribosyl)ates (MARylates) ribosomal proteins.
    - reference_id: file:human/NMNAT2/NMNAT2-uniprot.txt
      supporting_text: >-
        adenylyltransferase activity; abolished ability to promote mono-ADP-ribosylation of
        ribosomes.
- term:
    id: GO:2000766
    label: negative regulation of cytoplasmic translation
  evidence_type: IDA
  original_reference_id: PMID:34314702
  qualifier: involved_in
  review:
    summary: >-
      Challa et al. 2021 show NMNAT2 (via PARP16-mediated ribosomal-protein MARylation) inhibits
      protein synthesis in a manner dependent on its catalytic activity, tuning cytoplasmic translation
      and proteostasis in cancer cells. Experimental IDA, but a specialized downstream/context-specific
      role rather than the core NAD+-biosynthetic function; kept as non-core.
    action: KEEP_AS_NON_CORE
    reason: >-
      KEEP_AS_NON_CORE: the perturbation evidence is direct - depleting NMNAT2 increases polysome
      association and enhances translation of specific mRNAs - so the regulatory relationship is
      established. It is non-core, and deliberately not promoted, because the entity that performs
      the regulating step is PARP16: NMNAT2 supplies the NAD+ that PARP16 consumes to MARylate RPL24
      and RPS6, which in turn stabilises eIF6 binding and blocks polysome assembly. NMNAT2 is two
      steps removed from the ribosome, and the chain runs entirely through its catalytic product. The
      effect is also cell-context specific, demonstrated in ovarian cancer cells where NMNAT2 is
      highly upregulated, so it should not be read as a general property of the gene.
    supported_by:
    - reference_id: PMID:34314702
      supporting_text: >-
        Depletion of NMNAT-2 or PARP-16 leads to inhibition of MARylation, increased polysome
        association and enhanced translation of specific mRNAs
    - reference_id: PMID:34314702
      supporting_text: >-
        MARylation of the ribosomal proteins, such as RPL24 and RPS6, inhibits polysome assembly by
        stabilizing eIF6 binding to ribosomes.
