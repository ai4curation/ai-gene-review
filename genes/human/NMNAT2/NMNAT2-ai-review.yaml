proposed_new_terms: []
suggested_questions:
- question: >-
    Is the axon-maintenance function of NMNAT2 fully attributable to its NAD+-biosynthetic activity
    (and consequent SARM1 suppression via NMN consumption), or does NMNAT2 also have
    activity-independent (e.g. chaperone-like) contributions to axon survival?
- question: >-
    GO:0140768 is defined as an enzyme-substrate adaptor that brings together an
    ADP-ribosyltransferase and its substrate, which implies a bridging role separable from
    catalysis. Yet the catalytically dead NMNAT2 variants H24D and W92G abolish the ability to
    promote mono-ADP-ribosylation of ribosomes as well as adenylyltransferase activity. Is NMNAT2
    genuinely an adaptor for PARP16, or does it act solely by supplying local NAD+ - in which case
    should this annotation be replaced by an NAD+-supply or positive-regulation term?
- question: >-
    How central is the PARP16-adaptor / translation-regulatory role of NMNAT2 outside the ovarian
    cancer context in which it was characterized, where NMNAT2 is highly upregulated, and is it
    relevant in neurons, where NMNAT2 is most abundant?
- question: >-
    What is the spectrum and mechanism of NMNAT2-related human disease (childhood-onset polyneuropathy
    with skeletal abnormalities) and how does it relate to the murine perinatal-lethal axon phenotype?
- question: >-
    NMNAT2 is rapidly turned over through MYCBP2/FBXO45-dependent polyubiquitination, and its short
    half-life is what makes axonal NAD+ supply dependent on continuous delivery. Is palmitoylation
    at Cys-164/165 - and hence partitioning between the soluble and vesicle-bound pools - itself
    regulated, and does the membrane-anchored pool turn over at a different rate from the cytosolic
    one?
- question: >-
    Isoform 2 (Q9BZQ4-2) replaces the first 28 residues, removing the NAD-binding residues 16-17 and
    the critical ATP-binding His-24. Is this isoform expressed as stable protein, is it catalytically
    dead as the mutagenesis data predict, and could it compete for palmitoylation or trafficking
    machinery with the canonical isoform?
suggested_experiments:
- hypothesis: >-
    Axon survival depends on NMNAT2's catalytic output rather than on the protein as such, so a
    catalytically dead variant will fail to rescue axon degeneration even at wild-type protein
    levels, and the failure will track quantitatively with axonal NMN accumulation and SARM1
    activation.
  description: >-
    Quantify axonal NAD+/NMN and SARM1 activation in human iPSC-derived neurons upon graded NMNAT2
    depletion, and compare rescue by wild-type NMNAT2 with rescue by the catalytic-dead variants
    H24D and W92G expressed at matched protein levels. Read out axon survival after transection or
    vincristine stress, NMN and NAD+ by targeted LC-MS on isolated axons, and SARM1 activity by
    cADPR accumulation. Include a SARM1-null background to test whether any residual protection by
    the dead variants is SARM1-independent, which would be the signature of an
    activity-independent (chaperone-like) contribution.
  experiment_type: catalytic-dead rescue with axonal metabolite and SARM1-activity readouts
- hypothesis: >-
    The three human NMNAT isoforms have genuinely distinct substrate preferences rather than
    differing only in compartment, so matched side-by-side kinetics will separate their
    contributions to compartmentalized NAD+ pools.
  description: >-
    Structural and enzyme-kinetic comparison of recombinant NMNAT1, NMNAT2 and NMNAT3 under matched
    buffer, metal and temperature conditions, measuring Km and kcat for NMN, NaMN and NMNH with ATP
    and with ITP, plus product inhibition. Pair this with isoform-selective depletion in a single
    cell background and compartment-resolved NAD+ measurement (nuclear, cytosolic, mitochondrial
    sensors) to test whether the in vitro preferences predict which pool each isoform sustains. The
    existing isoform comparisons were done in different laboratories under different conditions,
    which is what makes a matched study necessary.
  experiment_type: matched comparative enzymology with compartment-resolved NAD+ sensors
- hypothesis: >-
    PARP16 support by NMNAT2 is purely metabolic: supplying NAD+ in trans, or bypassing NMNAT2 with
    an NAD+ precursor, restores ribosome MARylation in NMNAT2-depleted cells without requiring
    NMNAT2-PARP16 contact.
  description: >-
    In NMNAT2-depleted ovarian cancer cells, test whether ribosomal-protein MARylation is restored by
    (i) catalytically dead NMNAT2 (H24D, W92G), (ii) a cytosolically targeted but PARP16-non-binding
    NMNAT2 variant, and (iii) raising cytosolic NAD+ independently of NMNAT2. Measure MARylation of
    RPL24 and RPS6, polysome profiles and NMNAT2-PARP16 proximity. If NAD+ supply alone suffices and
    contact is dispensable, the GO:0140768 adaptor annotation should be replaced by an NAD+-supply or
    positive-regulation-of-ADP-ribosylation term; if contact is required beyond catalysis, the
    adaptor term is justified.
  experiment_type: mechanism-separating rescue to adjudicate an annotation term choice
references:
- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO
    terms
  findings:
  - statement: >-
      Source of the single GO:0003824 root catalytic-activity row, fired by InterPro:IPR004821, a
      cytidylyltransferase-like signature shared across a broad set of nucleotidyl transferases.
      Because the signature is fold-level rather than family-level, the rule can only emit the
      branch root - which is why this row is marked over-annotated while the IPR045094-based rows
      from GO_REF:0000120 reach the specific activity terms.
    reference_section_type: DATABASE_ENTRY
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Correctly cited as the InterPro2GO pipeline behind the root catalytic-activity row; signature
      identifier taken from the GOA WITH/FROM column. The imprecision is inherent to fold-level
      domain matching, not a citation error.
- id: GO_REF:0000024
  title: Manual transfer of experimentally-verified manual GO annotation data to orthologs
    by curator judgment of sequence similarity
  findings:
  - statement: >-
      Basis for the ISS transfer of the cytoplasmic vesicle membrane location from mouse Nmnat2
      (UniProtKB:Q8BNJ3). The structural basis for the transfer is conserved: the S-palmitoylated
      cysteines 164 and 165 that anchor the mouse protein to vesicle membranes are present in the
      human sequence, and mouse and human NMNAT2 are 1:1 orthologs with no reported divergence in
      trafficking.
    reference_section_type: DATABASE_ENTRY
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Correctly cited as the curator-judged similarity-transfer route. The source organism and
      accession are taken from the GOA WITH/FROM column and match UniProt's own ECO:0000250
      attribution for the same location.
- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  findings:
  - statement: >-
      GO_Central supplies four IBA rows from two different nodes, and the split is informative. The
      two catalytic activities and the salvage-pathway process come from the deep node
      PANTHER:PTN000247701, whose descendant evidences span plant (AGI_LocusCode:AT5G55810), yeast
      (SGD:S000003242, SGD:S000004320), fly (FB:FBgn0039254), mouse, bacterial NadD
      (UniProtKB:P0A752) and the human paralogs NMNAT1 and NMNAT3. Golgi localization instead comes
      from the much shallower PANTHER:PTN002635346, seeded only by mouse Nmnat2 and human NMNAT2 -
      correctly so, because compartmentalization is the isoform-specific trait while the activity
      is ancestral.
    reference_section_type: DATABASE_ENTRY
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Correctly cited for all four IBA rows; nodes and WITH/FROM entries taken from the GOA rows.
      Q9BZQ4's appearance in its own WITH/FROM lists is expected rather than circular - NMNAT2's
      experimental annotations are among the descendant evidences used to place the IBD.
- id: GO_REF:0000044
  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot Subcellular Location
    vocabulary mapping, accompanied by conservative changes to GO terms applied by
    UniProt
  findings:
  - statement: >-
      Source of four location rows, mapped from distinct Swiss-Prot subcellular-location
      identifiers: SL-0134 (Golgi membrane), SL-0086 (cytoplasm), SL-0279 (axon) and SL-0089
      (cytoplasmic vesicle membrane). Their evidential weight differs even though the pipeline is
      the same: the Golgi-membrane and cytoplasm statements carry ECO:0000269|PubMed:16118205 in
      UniProt, whereas the axon and vesicle-membrane statements are ECO:0000250 transfers from mouse
      Q8BNJ3 - which is why the axon row is held as non-core.
    reference_section_type: DATABASE_ENTRY
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Correctly cited for all four location rows. Worth flagging that a Swiss-Prot location IEA can
      be experimentally grounded or similarity-grounded depending on the underlying line's ECO code;
      both kinds occur in this entry.
- id: GO_REF:0000052
  title: Gene Ontology annotation based on curation of immunofluorescence data
  findings:
  - statement: >-
      Source of the GO:0005829 cytosol IDA row, from Human Protein Atlas immunofluorescence
      curation. The row carries no PMID, which is why no literature quote can be attached to that
      annotation. It records the soluble pool of an enzyme that also exists palmitoylated on Golgi
      and vesicle membranes.
    reference_section_type: DATABASE_ENTRY
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Correctly cited as the HPA immunofluorescence curation route. Consistent with UniProt's
      experimental Cytoplasm annotation and with the cytosolic NAD+-supply role described by Challa
      et al.
- id: GO_REF:0000117
  title: Electronic Gene Ontology annotations created by ARBA machine learning models
  findings:
  - statement: >-
      Source of the GO:0009165 nucleotide biosynthetic process IEA row, from ARBA:ARBA00027613.
      The rule is a sequence-feature machine-learning model, which is why it stops at a high-level
      grouping term that is an ancestor of the GO:0009435 and GO:0034355 rows NMNAT2 already
      carries; the same term also arrives independently as a curator IC inference.
    reference_section_type: DATABASE_ENTRY
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Correctly cited as the ARBA machine-learning route. Nothing asserted is wrong; the row is
      simply subsumed by two more specific process annotations.
- id: GO_REF:0000120
  title: Combined Automated Annotation using Multiple IEA Methods
  findings:
  - statement: >-
      Combined multi-method electronic annotation supplies three rows that all reach appropriate
      specificity, because they rest on the family-specific InterPro:IPR045094 plus reaction-level
      mappings: GO:0000309 (RHEA:21360, EC 2.7.7.1), GO:0004515 (RHEA:22860, EC 2.7.7.18) and
      GO:0009435 (UniPathway UPA00253). The contrast with the IPR004821-derived root term is the
      clearest illustration in this review of signature specificity determining term specificity.
    reference_section_type: DATABASE_ENTRY
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Correctly cited for the two activity rows and the NAD+ biosynthetic process row. The
      underlying RHEA/EC mappings trace to UniProt catalytic-activity lines that themselves carry
      ECO:0000269 experimental evidence, so these rows are better grounded than a typical IEA.
- id: PMID:16118205
  title: Subcellular compartmentation and differential catalytic properties of the
    three human nicotinamide mononucleotide adenylyltransferase isoforms.
  findings:
  - statement: >-
      NMNAT is the central enzyme of the NAD biosynthetic pathway; this study characterized all
      three human isoforms side by side and localized NMNAT1 to the nucleus, NMNAT2 to the Golgi
      complex and NMNAT3 to mitochondria.
    reference_section_type: ABSTRACT
    supporting_text: >-
      NMNAT2 and -3 were localized to the Golgi complex and the mitochondria, respectively
  - statement: >-
      The authors draw the inference that makes the compartmentalization functionally significant
      rather than incidental: differential localization implies an organelle-specific, non-redundant
      role for each isoform, and they argue the existence of separate nuclear, mitochondrial and
      Golgi NAD+ biosynthetic pathways is inconsistent with a single general cellular NAD pool.
    reference_section_type: ABSTRACT
    supporting_text: >-
      This differential subcellular localization points to an organelle-specific, nonredundant
      function of each of the three proteins.
  - statement: >-
      Kinetic comparison showed NMNAT3 has the highest tolerance toward substrate modifications,
      and that unlike NMNAT1's preference for NAD+ synthesis, NMNAT2 and NMNAT3 can also form NADH
      directly from reduced nicotinamide mononucleotide. UniProt cites this paper as the
      ECO:0000269 source for NMNAT2's catalytic activity, kinetic parameters, substrate specificity
      and subcellular location.
    reference_section_type: ABSTRACT
    supporting_text: >-
      Comparison of the kinetic properties showed that particularly NMNAT3 exhibits a high
      tolerance toward substrate modifications.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Primary experimental characterization of the three human NMNAT isoforms; establishes NMNAT2 as
      a Golgi-localized NMN/NaMN adenylyltransferase (central enzyme of NAD biosynthesis). Cited by
      UniProt as ECO:0000269 for EC 2.7.7.1/2.7.7.18 and Golgi/cytoplasm localization. Cached record
      is abstract-only (full_text_available: false); annotations anchored to the GOA/UniProt evidence
      codes and abstract.
- id: PMID:17402747
  title: 'Initial-rate kinetics of human NMN-adenylyltransferases: substrate and metal
    ion specificity, inhibition by products and multisubstrate analogues, and isozyme
    contributions to NAD+ biosynthesis.'
  findings:
  - statement: >-
      Initial-rate and product-inhibition analysis established distinct ordered ternary-complex
      kinetic mechanisms, substrate specificities and metal-ion preferences for each of the three
      human NMNAT isozymes, including a substrate-binding order for NMNAT2 opposite to that of
      mitochondrial NMNAT3.
    reference_section_type: ABSTRACT
    supporting_text: >-
      Initial-rate and product inhibition studies revealed distinctive ordered ternary complex
      kinetic mechanisms, substrate specificities, and metal ion preferences
  - statement: >-
      The negative results bound NMNAT2's substrate range and are what justify annotating exactly
      two activity terms rather than a broader one: tiazofurin monophosphate is a substrate only
      for NMNAT1 and NMNAT3, and NMNH conversion to NADH by NMNAT2 is much slower than by the other
      two isozymes.
    reference_section_type: ABSTRACT
    supporting_text: >-
      Our finding that TrMP is only a substrate with NMNAT1 and NMNAT3 reveals for the first time
      an organelle selectivity in the metabolism of this important drug.
  - statement: >-
      The authors used the isozymes' differing substrate and metal-ion selectivities to quantify
      each one's individual contribution to NAD+ formation in human cell extracts, which is what
      makes NMNAT2's activity a measured metabolic contribution rather than an in vitro capability.
      UniProt cites this paper as the ECO:0000269 source for catalytic activity, activity
      regulation and the Mg2+ cofactor requirement.
    reference_section_type: ABSTRACT
    supporting_text: >-
      Distinctive differences in their substrate specificity and metal ion selectivity also
      permitted us to quantify individual isozyme contributions to NAD+ formation in human cell
      extracts.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Detailed initial-rate kinetics of the three human NMNAT isozymes, including Golgi NMNAT2
      (EC 2.7.7.1). Cited by UniProt as ECO:0000269 for catalytic activity, substrate/metal-ion
      specificity, and activity regulation. Cached record abstract-only.
- id: PMID:30304512
  title: Low levels of NMNAT2 compromise axon development and survival.
  findings:
  - statement: >-
      NMNAT2 is an endogenous axon maintenance factor that preserves axon health by blocking
      Wallerian-like axon degeneration, and mice lacking it die at birth with severe axon defects in
      both the peripheral and central nervous systems.
    reference_section_type: ABSTRACT
    supporting_text: >-
      Nicotinamide mononucleotide adenylyltransferase 2 (NMNAT2) is an endogenous axon maintenance
      factor that preserves axon health by blocking Wallerian-like axon degeneration.
  - statement: >-
      Reducing rather than abolishing NMNAT2 is already damaging: Nmnat2 compound heterozygote mice
      have reduced numbers of myelinated sensory axons by 1.5 months, lose further axons between 18
      and 24 months, and show early temperature insensitivity and later motor decline; cultured
      compound-heterozygote neurons show slower neurite outgrowth and increased sensitivity to
      axonal stress. This dose-sensitivity is why natural variation in human NMNAT2 expression is
      considered health-relevant.
    reference_section_type: ABSTRACT
    supporting_text: >-
      These data reveal that reducing NMNAT2 levels below a particular threshold compromises the
      development of peripheral axons and increases their vulnerability to stresses.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Establishes NMNAT2 as an endogenous axon maintenance factor that blocks Wallerian-like axon
      degeneration; Nmnat2-null mice die at birth with severe axon defects, and reduced levels
      compromise peripheral axon development and survival. ISS source for the human GO:0061564 (axon
      development) annotation. Cached record abstract-only. Note that the experiments are in mouse,
      which is consistent with the human annotation's ISS evidence code and WITH/FROM
      UniProtKB:Q8BNJ3.
- id: PMID:34314702
  title: Ribosome ADP-ribosylation inhibits translation and maintains proteostasis
    in cancers.
  findings:
  - statement: >-
      NMNAT-2, a cytosolic NAD+ synthase that is highly upregulated in ovarian cancers, supports the
      catalytic activity of the mono(ADP-ribosyl) transferase PARP-16, which MARylates ribosomal
      proteins.
    reference_section_type: ABSTRACT
    supporting_text: >-
      NMNAT-2 supports the catalytic activity of the mono(ADP-ribosyl) transferase (MART) PARP-16,
      which mono(ADP-ribosyl)ates (MARylates) ribosomal proteins.
  - statement: >-
      Depleting NMNAT-2 or PARP-16 inhibits MARylation, increases polysome association, enhances
      translation of specific mRNAs, causes aggregation of their protein products and reduces
      ovarian cancer cell growth - the perturbation evidence behind the GO:2000766 negative
      regulation of cytoplasmic translation annotation.
    reference_section_type: ABSTRACT
    supporting_text: >-
      Depletion of NMNAT-2 or PARP-16 leads to inhibition of MARylation, increased polysome
      association and enhanced translation of specific mRNAs
  - statement: >-
      The mechanism places NMNAT2 two steps removed from the ribosome: MARylation of ribosomal
      proteins such as RPL24 and RPS6 inhibits polysome assembly by stabilizing eIF6 binding, so
      NMNAT2's contribution runs through PARP16's use of the NAD+ it makes. This is the basis for
      keeping both PARP16-related annotations non-core.
    reference_section_type: ABSTRACT
    supporting_text: >-
      MARylation of the ribosomal proteins, such as RPL24 and RPS6, inhibits polysome assembly by
      stabilizing eIF6 binding to ribosomes.
  - statement: >-
      The paper's introduction states the pathway context used throughout this review: the final
      step of NAD+ synthesis in the salvage pathway is mediated by NMNATs with distinct subcellular
      localizations, with NMNAT-1 nuclear, NMNAT-2 Golgi-associated and acting in the cytoplasm, and
      NMNAT-3 mitochondrial or cytoplasmic depending on cell type.
    reference_section_type: INTRODUCTION
    supporting_text: >-
      The final step in the synthesis of NAD+ in this pathway is mediated by nicotinamide
      mononucleotide adenylyl transferases (NMNATs)
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full text available and verified. Shows cytosolic NAD+ synthesis by NMNAT2 supports PARP16
      (a MART) MARylation of ribosomal proteins, thereby inhibiting cytoplasmic translation and
      maintaining proteostasis in ovarian cancer. Direct support for the GO:0140768
      (ADP-ribosyltransferase-substrate adaptor) and GO:2000766 (negative regulation of cytoplasmic
      translation) IDA annotations. A context-specific moonlighting role, not the core metabolic
      function. Note the term-fit tension recorded in the GO:0140768 review: UniProt's mutagenesis
      data attributed to this paper show that catalytically dead NMNAT2 cannot promote ribosome
      MARylation, which argues for NAD+ supply rather than adaptor bridging as the mechanism.
- id: Reactome:R-HSA-197235
  title: NMNAT2 transfers an adenylyl group from ATP to NAMN to yield NAAD
  findings:
  - statement: >-
      Reactome curates the NaMN-to-NaAD reaction and records the topologically important detail
      behind the Golgi membrane annotation: the protein localizes predominantly to the cytoplasmic
      face of the Golgi apparatus. A lumenal orientation would be incompatible with the reaction,
      whose substrates NMN, NaMN and ATP are cytosolic.
    reference_section_type: DATABASE_ENTRY
    supporting_text: >-
      The protein localizes predominantly to the cytoplasmic face of the Golgi apparatus
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Reactome reaction for the NaMN-to-NaAD step; supports the Golgi membrane location and the
      cytoplasmic-face orientation. The statement traces to Berger et al. 2005 and Lau et al. 2010,
      so it corroborates the EXP row at the pathway-model level rather than adding independent
      evidence.
- id: Reactome:R-HSA-8939959
  title: NMNAT2 transfers an adenylyl group from ATP to NMN to yield NAD+
  findings:
  - statement: >-
      Reactome's second NMNAT2 reaction entry, for NMN to NAD+, carries the same curated statement
      and records two mechanistic facts used elsewhere in this review: the active form of the enzyme
      is a monomer in vitro and Mg2+ is required for activity. Both agree with UniProt's SUBUNIT
      (Monomer, ECO:0000269|PubMed:12359228) and COFACTOR lines.
    reference_section_type: DATABASE_ENTRY
    supporting_text: >-
      The active form of the enzyme is a monomer in vitro; Mg2+ is required for activity
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Reactome reaction for the NMN-to-NAD+ step. Its summary text is identical to that of
      R-HSA-197235, so the duplicated Golgi membrane location across the two entries is a modelling
      artefact rather than two independent claims.
