    Catalyzes the central adenylyl-transfer step of NAD+ biosynthesis: condensation of nicotinamide
    mononucleotide (NMN) with ATP to yield NAD+ and pyrophosphate (EC 2.7.7.1). This Mg2+-dependent
    reaction, shared by the NAD+ salvage and de novo routes, is the primary evolved function of NMNAT2.
