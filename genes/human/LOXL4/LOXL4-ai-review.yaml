- id: PMID:14551188
  title: Expression and purification of enzymatically active forms of the human lysyl
    oxidase-like protein 4.
  findings:
  - statement: Recombinant human LOXL4 is an active, BAPN-inhibitable amine oxidase
      against the nonpeptidyl substrate benzylamine.
    supporting_text: The purified LOXL4 proteins showed beta-aminopropionitrile-inhibitable
      activity of 0.022-0.032 units/mg toward a nonpeptidyl substrate, benzylamine.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: Human LOXL4 contains four SRCR domains in addition to conserved lysyl-oxidase-family
      catalytic features.
    supporting_text: LOXL4 contains four scavenger receptor cysteine-rich domains in
      addition to the characteristic domains of the LOX family, including the copper-binding
      domain, the cytokine receptor-like domain, and the residues of the lysyl-tyrosyl
      quinone cofactor.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-cached abstract directly establishes recombinant human LOXL4
      amine-oxidase activity and BAPN sensitivity. The assay substrate was benzylamine;
      this abstract does not directly demonstrate collagen or elastin oxidation, copper
      dependence, extracellular activity, or BMP1 activation.
