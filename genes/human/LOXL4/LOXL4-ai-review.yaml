  label: Homo sapiens
description: >-
  LOXL4 is a secreted lysyl-oxidase-family amine oxidase with an N-terminal signal
  peptide, four scavenger-receptor cysteine-rich domains, and a conserved
  copper/lysine-tyrosylquinone catalytic region. Purified recombinant human LOXL4
  has beta-aminopropionitrile-sensitive activity toward the nonpeptidyl substrate
  benzylamine. Collagen-I and collagen-II oxidation has been demonstrated for mouse
  LOXC, the murine ortholog, but direct collagen- or elastin-substrate evidence for
  human LOXL4 is not established. Recombinant human LOXL4 was secreted without
  evident proteolytic processing; the reviewed record contains no propeptide feature
  or named alternative products, and BMP1 cleavage remains inferred rather than
  demonstrated. Extracellular-matrix, elastic-fiber, parotid-exosome, receptor-complex,
  and high-throughput interaction observations vary in evidence strength and context
  and do not establish membrane anchoring or stable complex membership.
