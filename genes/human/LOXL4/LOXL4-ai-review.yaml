- id: PMID:11691588
  title: A novel human lysyl oxidase-like gene (LOXL4) on chromosome 10q24 has an altered
    scavenger receptor cysteine rich domain.
  findings:
  - statement: Human LOXL4 has conserved catalytic-family features and four N-terminal
      SRCR domains, one containing a distinctive 13-residue insertion.
    supporting_text: The cDNA and derived amino acid sequence of LOXL4 demonstrates
      a conserved C-terminal region including the characteristic copper-binding site,
      lysyl and tyrosyl residues and a cytokine receptor-like domain. One of the four
      N-terminal SRCR domains contains a 13 amino acid insertion encoded by a short exon
      not present within the closely homologous LOXL2 and LOXL3 genes.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: LOXL4 transcript expression was reported in multiple human tissues and
      cell types, with strongest tested tissue signals in pancreas and testis.
    supporting_text: The 3.5-kb LOXL4 mRNA is present in pancreas and testis and at lower
      levels in several other tissues. Fibroblasts, smooth muscle and osteosarcoma (HOS)
      cells express LOXL4.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct human gene-structure and expression evidence; it identifies
      catalytic-family residues but does not itself assay enzymatic activity.
- id: PMID:11292829
  title: Molecular cloning and biological activity of a novel lysyl oxidase-related
    gene expressed in cartilage.
  findings:
  - statement: Mouse LOXC, the murine LOXL4 ortholog, showed BAPN-sensitive activity
      toward chick type I and type II collagens in conditioned medium.
    supporting_text: The conditioned media of COS-7 cells transfected with the full-length
      LOXC cDNA showed the lysyl oxidase activity in both type I and type II collagens
      derived from chick embryos, and these activities of LOXC were inhibited by beta-aminopropionitrile,
      a specific inhibitor of lysyl oxidase.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: Mouse LOXC expression increases during chondrogenic differentiation and
      is localized to hypertrophic and calcified growth-plate chondrocytes in vivo.
    supporting_text: In vivo, LOXC gene expression was localized in hypertrophic and
      calcified chondrocytes of growth plates in adult mice.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Primary model-organism evidence for the murine ortholog. It supports
      conserved collagen-substrate plausibility and cartilage biology but is not direct
      evidence for human LOXL4 or human collagen substrates.
- id: file:human/LOXL4/LOXL4-uniprot.txt
  title: UniProt text export for human LOXL4 (Q96JB6)
  findings:
  - statement: The reviewed Q96JB6 sequence is a 756-residue precursor with a 24-residue
      signal peptide and no annotated propeptide feature.
    supporting_text: FT   SIGNAL          1..24
  - statement: UniProt localizes LOXL4 to the secreted extracellular space, but marks
      that statement as inferred rather than experimentally sourced.
    supporting_text: 'CC   -!- SUBCELLULAR LOCATION: Secreted, extracellular space {ECO:0000305}.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Reviewed UniProt record Q96JB6. It contains no ALTERNATIVE PRODUCTS
      section or named reviewed isoforms, annotates only signal peptide 1-24 and chain
      25-756, and says LOXL4 may be cleaved by BMP1; the latter is an inference, while
      PMID:11691589 observed secretion without evident proteolytic processing.
knowledge_gaps:
- gap_statement: >-
    The endogenous human protein substrates and modified lysine sites of LOXL4 are
    unknown, including whether collagen and elastin are direct physiological
    substrates.
  boundary: >-
    Purified human LOXL4 oxidizes benzylamine in a BAPN-sensitive assay, whereas
    collagen-I and collagen-II activity was shown for mouse LOXC in conditioned
    medium. The ortholog result supports substrate plausibility but is not direct
    evidence for human LOXL4.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    Direct substrate and site maps are needed to define LOXL4's contribution to human
    matrix cross-linking and distinguish it from other lysyl oxidases.
  resolution: >-
    Acutely deplete endogenous LOXL4 in primary human matrix-producing cells and map
    LOXL4-dependent allysine sites by quantitative carbonyl proteomics, followed by
    wild-type and catalytic-dead rescue and purified-enzyme validation.
  provenance:
  - reference_id: PMID:14551188
    supporting_text: >-
      The purified LOXL4 proteins showed beta-aminopropionitrile-inhibitable activity of 0.022-0.032 units/mg toward a nonpeptidyl substrate, benzylamine.
  - reference_id: PMID:11292829
    supporting_text: >-
      The conditioned media of COS-7 cells transfected with the full-length LOXC cDNA showed the lysyl oxidase activity in both type I and type II collagens derived from chick embryos, and these activities of LOXC were inhibited by beta-aminopropionitrile, a specific inhibitor of lysyl oxidase.
- gap_statement: >-
    Whether endogenous human LOXL4 is proteolytically processed after secretion, and
    whether any such cleavage regulates activity, substrate choice, or matrix
    retention, remains unresolved.
  boundary: >-
    Recombinant human LOXL4 was secreted without evident processing, UniProt defines
    a signal peptide and chain but no propeptide, and its possible BMP1 cleavage is
    inferred rather than experimentally established.
  gap_kind:
  - BIOLOGY
  - CURATION
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    Resolving the native proteoform boundary would prevent an inferred BMP1 cleavage
    event from being conflated with demonstrated propeptide-dependent activation.
  resolution: >-
    Map endogenous secreted LOXL4 termini and intact proteoforms by N-terminomics and
    top-down mass spectrometry, then perturb BMP1-family proteases and test activity
    of cleavage-resistant and cleavage-mimetic LOXL4 constructs.
  provenance:
  - reference_id: PMID:11691589
    supporting_text: >-
      Recombinant LOXL4 expressed in HT-1080 cells was secreted into the culture medium with no evident proteolytic processing.
- gap_statement: >-
    The extracellular compartment in which endogenous human LOXL4 performs its main
    catalytic function, and the extent to which it resides in matrix, elastic fibers,
    or extracellular vesicles, are not directly resolved.
  boundary: >-
    Human secretion is experimentally supported, extracellular-matrix and
    elastic-fiber localizations are phylogenetic or electronic/curator transfers, and
    parotid-exosome evidence is a tissue-specific high-throughput detection.
  gap_kind:
  - BIOLOGY
  dark_aspect: CC_DARK
  status: OPEN
  significance: >-
    Compartment-resolved localization is necessary to connect LOXL4 catalysis to its
    native substrates without promoting dataset-level detections to a general site of
    action.
  resolution: >-
    Endogenously tag LOXL4 in relevant primary human cells and combine secretion
    pulse-chase imaging, matrix extraction, extracellular-vesicle fractionation, and
    activity-based detection with orthogonal fraction-purity controls.
  provenance:
  - reference_id: PMID:11691589
    supporting_text: >-
      Recombinant LOXL4 expressed in HT-1080 cells was secreted into the culture medium with no evident proteolytic processing.
- gap_statement: >-
    The physiological relevance, compartmental compatibility, and directness of the
    reported high-throughput LOXL4 interaction partners and signaling-receptor-complex
    association are unresolved.
  boundary: >-
    The source datasets report binary or co-association hits, but accessible records
    do not establish a LOXL4-specific mechanism, a stable complex, or that these
    interactions occur in the extracellular physiological context of LOXL4.
  gap_kind:
  - BIOLOGY
  - CURATION
  dark_aspect: MF_DARK
  status: OPEN
  significance: >-
    Validation is required before generic binding or receptor-complex annotations can
    be converted into an informative molecular function or complex model.
  resolution: >-
    Test prioritized partners at endogenous abundance in secreting human cells using
    reciprocal extracellular proximity labeling and co-complex analysis, with signal-
    peptide, catalytic-dead, and compartment-mismatched controls.
core_functions:
- description: >-
    Secreted LOXL4 performs lysyl-oxidase-family oxidative deamination in the
    extracellular compartment. Direct recombinant human evidence establishes
    BAPN-sensitive amine-oxidase activity toward benzylamine; the more specific
    protein-lysine assignment is supported holistically by the conserved catalytic
    machinery, phylogenetic inference, and reaction/EC mappings. Collagen-I and
    collagen-II oxidation is demonstrated for mouse LOXC and is therefore ortholog
    support, not direct human substrate evidence.
  molecular_function:
    id: GO:0004720
    label: protein-lysine 6-oxidase activity
  locations:
  - id: GO:0005576
    label: extracellular region
  supported_by:
  - reference_id: PMID:14551188
    supporting_text: >-
      The purified LOXL4 proteins showed beta-aminopropionitrile-inhibitable activity of 0.022-0.032 units/mg toward a nonpeptidyl substrate, benzylamine.
  - reference_id: PMID:11691589
    supporting_text: >-
      Recombinant LOXL4 expressed in HT-1080 cells was secreted into the culture medium with no evident proteolytic processing.
  - reference_id: PMID:11292829
    supporting_text: >-
      The conditioned media of COS-7 cells transfected with the full-length LOXC cDNA showed the lysyl oxidase activity in both type I and type II collagens derived from chick embryos, and these activities of LOXC were inhibited by beta-aminopropionitrile, a specific inhibitor of lysyl oxidase.
proposed_new_terms: []
suggested_questions:
- question: >-
    Which endogenous human extracellular proteins and lysine sites are directly
    oxidized by LOXL4, and are collagen or elastin physiological substrates?
- question: >-
    Is endogenous secreted LOXL4 proteolytically processed, and does BMP1-family
    cleavage alter activity, substrate choice, or extracellular retention?
- question: >-
    Where does catalytically active endogenous LOXL4 partition among soluble
    extracellular space, matrix, elastic fibers, and extracellular vesicles?
- question: >-
    Which high-throughput LOXL4 interaction or receptor-complex observations are
    reproducible at endogenous abundance and compatible with its secretory pathway?
suggested_experiments:
- hypothesis: >-
    Human LOXL4 oxidizes a defined subset of extracellular-matrix lysine sites that
    cannot be inferred solely from mouse LOXC collagen activity.
  description: >-
    Introduce an acute endogenous LOXL4 degron into primary human fibroblasts and
    chondrocytes, quantify matrix allysine sites and mature cross-links by targeted
    mass spectrometry, and rescue with wild-type or catalytic-dead LOXL4. Validate
    candidate collagen, elastin, and noncanonical substrates with purified enzyme.
  experiment_type: endogenous depletion and matrix redox proteomics
- hypothesis: >-
    Signal-peptide removal is sufficient for LOXL4 activity and BMP1-family cleavage
    is not an obligatory activation step.
  description: >-
    Map endogenous extracellular LOXL4 termini and proteoforms by N-terminomics and
    top-down mass spectrometry, perturb BMP1-family proteases, and compare secretion
    and activity of endogenous cleavage-resistant and cleavage-mimetic alleles.
  experiment_type: endogenous proteoform mapping and protease perturbation
- hypothesis: >-
    Active LOXL4 partitions primarily with extracellular matrix rather than being a
    constitutive exosome cargo or membrane-associated protein.
  description: >-
    Endogenously tag LOXL4 in matrix-producing and salivary epithelial cells, then
    combine pulse-chase imaging with soluble-medium, matrix, membrane, and
    extracellular-vesicle fractionation. Measure LOXL4 abundance and activity with
    fraction-purity and protease-protection controls.
  experiment_type: compartment-resolved endogenous localization
- hypothesis: >-
    Most reported intracellular high-throughput partners do not form stable
    physiological complexes with secreted LOXL4.
  description: >-
    Prioritize recurrent partners and test them by reciprocal endogenous proximity
    labeling, co-immunoprecipitation, and extracellular cross-linking in secreting
    human cells, with signal-peptide mutants and compartment-mismatched proteins as
    controls; separately re-examine the signaling-receptor-complex association.
  experiment_type: endogenous interaction and compartment validation
