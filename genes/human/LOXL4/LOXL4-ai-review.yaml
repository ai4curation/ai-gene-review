- id: PMID:11691589
  title: 'Cloning and characterization of a fifth human lysyl oxidase isoenzyme: the
    third member of the lysyl oxidase-related subfamily with four scavenger receptor
    cysteine-rich domains.'
  findings:
  - statement: Human LOXL4 is a 756-residue secretory protein with a 24-residue signal
      peptide, a conserved C-terminal lysyl oxidase domain, and four N-terminal SRCR-like
      domains.
    supporting_text: The predicted polypeptide is 756 amino acids long, including a
      24-residue signal peptide. The C-terminal region contains a LO domain similar to
      those of LOX, LOXL, LOXL2 and LOXL3. The N-terminal region has four subregions
      similar to scavenger receptor cysteine-rich domains that are highly conserved
      with LOXL2 and LOXL3.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: Recombinant human LOXL4 was secreted without evident proteolytic processing
      in the tested cell system.
    supporting_text: Recombinant LOXL4 expressed in HT-1080 cells was secreted into the
      culture medium with no evident proteolytic processing.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct human cloning and secretion study. Its explicit absence of
