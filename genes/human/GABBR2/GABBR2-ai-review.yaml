core_functions:
- description: GABBR2 forms the coupling subunit of the GABBR1–GABBR2 metabotropic GABA receptor. Intersubunit
    interfaces relay ligand recognition by GABBR1 to inhibitory G-protein signaling, reducing adenylyl-cyclase
    activity and supporting GABAergic neurotransmission. Pre- and postsynaptic receptor populations support
    inhibition of transmitter release and slow postsynaptic inhibition, respectively. Downstream G-protein
    subunits regulate ion channels; GABBR2 itself is a receptor rather than the conducting pore. Direct
    subunit-resolved localization evidence is from rat hippocampus and is synthesized with the human receptor
    evidence.
