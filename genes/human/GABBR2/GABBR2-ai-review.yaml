  review:
    action: ACCEPT
    summary: GABBR2 has a core GABA-B receptor role, while this early autonomous-receptor interpretation
      remains disputed.
    reason: PMID:10328880 explicitly reports human GABBR2-dependent adenylyl-cyclase inhibition in CHO
      cells described as lacking GABBR1. That is the actual historical report and is not rewritten as
      a heterodimer experiment. Subsequent work shows functional responses requiring both subunits, and
      human structures place orthosteric agonists in GABBR1 (PMID:10075644, PMID:10773016, PMID:24305054).
      The gene-level GABA-B receptor activity is firmly supported in the heterodimer. Accepting it does
      not endorse the paper's proposed physiological GABBR2 homomer; the reference assessment records
      that conflict separately. The accepted biological claim is GABBR2 contribution to the assembled
      receptor, as represented in the contributes_to core. The literal upstream relationship field remains
      unchanged; this review does not independently establish a qualifier defect.
    additional_reference_ids:
    - PMID:10075644
    - PMID:10773016
    - PMID:24305054
