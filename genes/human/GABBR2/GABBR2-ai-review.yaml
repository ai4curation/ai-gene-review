suggested_questions:
- question: Which original ComplexPortal evidence was intended by the three annotations carrying the unrelated
    PMID:987231, and can the responsible source verify a replacement rather than infer one from identifier
    similarity?
- question: What target-level constructs and data support the GABBR2–GLP-1R and GABBR2–Q86UR5 interaction
    records whose exact tables were unavailable in the retained source text?
- question: Under which expression and assay conditions did the early GABBR2-alone adenylyl-cyclase responses
    occur, and how do those conditions compare with later evidence for the physiological heterodimer?
suggested_experiments:
- hypothesis: Receptor–auxiliary-protein composition tunes signaling kinetics without changing the orthosteric
    division of labor between GABBR1 and GABBR2.
  description: Compare matched full-length human GABBR1–GABBR2 receptors with defined KCTD combinations
    using surface-expression controls, direct Gi activation and cAMP or GIRK readouts. Keep engineered
    chimeric-G-protein assays separate from native-coupling conclusions.
