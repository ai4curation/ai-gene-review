- id: PMID:14657159
  title: Subcellular localization of metabotropic GABA(B) receptor subunits GABA(B1a/b) and GABA(B2) in
    the rat hippocampus.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed identity and original Methods, Results, captions and selected Discussion checked.
      Adult-rat hippocampal immunoelectron microscopy directly identifies R2 at pre/postsynaptic, chiefly
      extrasynaptic membranes. Quantitative distance analysis is R1-specific; it is not transferred to
      R2. This is rodent donor evidence for the human similarity annotation, not a human microscopy assay.
- id: PMID:15013631
  title: The GABA(B) receptor subunits R1 and R2 interact differentially with the activation transcription
    factor ATF4 in mouse brain during the postnatal development.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed identity/abstract and exact mouse donor context checked. Neonatal-mouse receptor–ATF4
      association and colocalization are reported, but original full text and the specific cytoplasmic/neuron-projection
      localization panels were not recovered. The abstract does not independently resolve either exact
      compartment, and no soluble-cytosol or receptor transcription-factor activity is inferred.
- id: PMID:15304491
  title: 'Structural analysis of the complement control protein (CCP) modules of GABA(B) receptor 1a:
    only one of the two CCP modules is compactly folded.'
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: PubMed identity and complete abstract verified. The abstract centers on GABBR1a CCP
      domains; the full supporting GABBR2 localization/heterodimer experiments were not recovered. This
      is an unresolved assay-access limit, not evidence of paralog misattribution or an invalid citation.
- id: PMID:15617512
  title: Subcellular distribution of GABA(B) receptor homo- and hetero-dimers.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed identity and complete abstract checked. Coimmunoprecipitation, resonance-energy-transfer
      and microscopy report R2 homodimers and R1–R2 heterodimers at the plasma membrane, while R1 homodimers
      remain intracellular. Surface presence is distinct from autonomous receptor function. Original full
      text was not recovered.
- id: PMID:16724110
  title: Coordinated action of NSF and PKC regulates GABAB receptor signaling efficacy.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed identity and abstract checked. NSF interaction with receptor heterodimers is
      reported in rat synaptosomes and CHO cells, with an R2-derived inhibitory peptide and PKC/desensitization
      experiments. Full construct and pair-specific assay details remain uninspected; NSF ATPase or PKC
      kinase activity is not attributed to R2.
- id: PMID:22660477
  title: Structure and functional interaction of the extracellular domain of human GABA(B) receptor GBR2.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed identity plus selected original Results, Discussion and Methods in PMC3374333
      checked. Human ectodomain assembly, affinity measurements and surface-controlled mutagenesis support
      R2-dependent allosteric enhancement of R1. HEK293 assays include mouse GIRK components or chimeric
      Galpha-qi9; they do not establish natural Gq coupling.
- id: PMID:23864651
  title: The identification of novel proteins that interact with the GLP-1 receptor and restrain its activity.
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: PubMed identity, abstract and the actually available cached Discussion were read. Human
      GLP1R bait/fetal-brain prey screening and CHO follow-up are described, but the exact GABBR2–P43220
      table entry and tested target construct were not recovered. The cache full-text flag overstates
      the inspected sections. Preserve the curated interaction without claiming independent pair-level
      confirmation or assigning other interactors insulin-secretion results to GABBR2.
- id: PMID:24305054
  title: Structural mechanism of ligand activation in human GABA(B) receptor.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed identity and selected original structural Results and Methods in PMC3865065 verified.
      Human R1b/R2 ectodomain complexes directly establish heterodimer interfaces and orthosteric ligand
      binding on R1; functional crosslink/mutagenesis experiments connect assembly to activation. Engineered
      ectodomains and cysteine substitutions are not natural products.
- id: PMID:24658140
  title: The mammalian-membrane two-hybrid assay (MaMTH) for probing membrane-protein interactions in
    human cells.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed identity verified. The authentic retained publisher supplement directly names
      GABBR1 bait and GABBR2-Nub as a MaMTH positive control in Supplementary Figures 3e and 6b, including
      HEK293T reporter experiments. The EGFR-focused abstract does not invalidate this target pair. Reporter-fusion
      assays are not purified affinity measurements or endogenous neuronal coimmunoprecipitation.
- id: PMID:30814734
  title: Structural basis for KCTD-mediated rapid desensitization of GABA(B) signalling.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed identity plus selected original main text and construct Methods in PMC6405316
      checked. A human R2 carboxy-terminal peptide binds a KCTD16 pentamer; human Tyr903 and mouse Tyr902
      numbering are distinguished. KCTD H1–Gbeta-gamma binding and stripping are auxiliary-subunit mechanisms,
      not receptor-tail catalysis.
- id: PMID:32555460
  title: Structural basis of the activation of a metabotropic GABA receptor.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed identity and selected original Results, Discussion and Methods in PMC8020835
      checked. Structures and functional tests support asymmetric activation and PAM binding at the R1/R2
      transmembrane interface. Despite broad full-length wording, structural Methods specify R2 residues
      42–821; HEK293 IP1 assays use Galpha-qi9. No bound Gi/o or natural short R2 product is claimed.
- id: PMID:32580208
  title: Structures of metabotropic GABA(B) receptor.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed identity, original main text and selected Methods in PMC7429364 checked. Human
      receptor structures and expression-matched assays support ECL2/linker coupling and inactive-interface
      regulation. Signaling assays use Galpha-q/o5; the separately characterized homodimer is R1b. Phospholipid
      identity is inferred and may be heterogeneous; do not substitute another paper's specific lipid
      assignments.
- id: PMID:32581365
  title: Structure of human GABA(B) receptor in an inactive state.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed identity plus selected original text and construct Methods in PMC7725281 checked.
      The inactive human R1b/R2 structure and latch-mutant assays support subunit interfaces and autoinhibition.
      R2 structural construct 1–819 and Galpha-qi5 functional assays are explicit. R1 calcium binding
      and uncertain ligand densities are not reassigned to R2.
- id: PMID:37207277
  title: Using brain cell-type-specific protein interactomes to interpret neurodevelopmental genetic signals
    in schizophrenia.
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: PubMed identity and selected actual cached Results/Methods checked. Human induced-neuron
      IP-MS design and GABBR2 network prioritization are described, but the exact Q86UR5–O75899 target
      table/condition was not recovered. Pair-level confirmation remains unresolved; neither wrong-gene
      attribution nor direct binary binding follows from that gap.
- id: Reactome:R-HSA-1013012
  title: Binding of Gbeta/gamma to GIRK/Kir3 channels
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Official ContentService event and target-membership chain inspected. The explicit catalyst/receptor/Gbeta-gamma/Kir
      participant chain reaches O75899 at the plasma membrane. Location membership is supported; GABBR2
      is not assigned GIRK pore activity. This is a curated model assessment, not independent experimental
      replication.
- id: Reactome:R-HSA-1013013
  title: Association of GABA B receptor with G protein beta-gamma subunits
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Official ContentService event and target-membership chain inspected. The ligand-bound
      R1:R2 receptor complex includes mature O75899 at the plasma membrane and is explicitly associated
      with Gbeta-gamma. The existing shared source blob is identical in main and PR5312 and remains immutable.
      This is a curated model assessment, not independent experimental replication.
- id: Reactome:R-HSA-1013020
  title: Activation of GIRK/Kir3 Channels
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Official ContentService event and target-membership chain inspected. The modeled larger
      receptor/Gbeta-gamma/Kir assembly includes O75899 at the plasma membrane. Its inward-rectifier channel
      catalytic activity belongs to the larger channel-containing complex, not the R2 polypeptide. This
      is a curated model assessment, not independent experimental replication.
- id: Reactome:R-HSA-380073
  title: Liganded Gi-activating GPCR acts as a GEF for Gi
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Official ContentService event and target-membership chain inspected. Official participant/set/catalyst
      traversal reaches the ligand-bound R1:R2 receptor within the Gi-activating GPCR set. This supports
      the membrane receptor context; cytosolic nucleotide participants do not relocate the receptor. This
      is a curated model assessment, not independent experimental replication.
- id: Reactome:R-HSA-420688
  title: GABAB heterodimeric receptor binds GABA
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Official ContentService event and target-membership chain inspected. Official receptor
      complex 420748 and ligand-bound 420698 explicitly contain O75899. GABA binding is modeled for the
      heterodimer, not an isolated R2 orthosteric site. This is a curated model assessment, not independent
      experimental replication.
- id: Reactome:R-HSA-749454
  title: The Ligand:GPCR:Gi complex dissociates
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Official ContentService event and target-membership chain inspected. The activated ligand:GPCR:Gi
      complex includes the explicitly verified R1:R2 member of set 380091. Target compartment is plasma
      membrane; dissociation does not assert receptor secretion or ion conductance. This is a curated
      model assessment, not independent experimental replication.
- id: Reactome:R-HSA-749456
  title: Liganded Gi-activating GPCRs bind inactive heterotrimeric G-protein Gi
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Official ContentService event and target-membership chain inspected. The inactive-Gi
      association complex 749455 includes ligand-bound R1:R2 via explicit set 380091 membership. O75899
      identity, processed 42–941 chain and plasma-membrane compartment were checked. This is a curated
      model assessment, not independent experimental replication.
