taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: GABBR2 encodes the GABA-B receptor subunit that couples a GABBR1–GABBR2 heterodimer to inhibitory
  heterotrimeric G proteins. Its extracellular Venus-flytrap domain and seven-transmembrane region form
  interfaces with GABBR1, relaying agonist-dependent conformational changes from the orthosteric ligand-binding
  GABBR1 subunit toward G-protein activation. At neuronal plasma membranes, receptor signaling inhibits
  adenylyl cyclase and regulates potassium and calcium channels through downstream G-protein subunits.
  Presynaptic receptors inhibit transmitter release, while postsynaptic receptors contribute to slow inhibition;
  extrasynaptic populations coexist with synaptic receptors. The distal GABBR2 tail binds KCTD auxiliary
  proteins that shape signaling kinetics. GABBR2 also supports receptor assembly and surface expression.
