- id: PMID:27387505
  title: Lunapark Is a Component of a Ubiquitin Ligase Complex Localized to the Endoplasmic Reticulum Three-way Junctions.
  full_text_unavailable: true
  findings:
  - statement: Mammalian-cell purification reports associated and intrinsic in-vitro ubiquitin-ligase activity for LNPK.
    supporting_text: >-
      Accordingly, Lnp purified from mammalian cells has a ubiquitin ligase activity in vitro
      Intriguingly, biochemical analyses show that this activity can be attributed not only to
      associated ubiquitin ligase, but also to an intrinsic ubiquitin ligase activity borne by Lnp itself.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Single-paper, abstract-only biochemical evidence absent from current UniProt/GOA; retain as a non-core knowledge gap pending replication.
- id: PMID:30498943
  title: Reciprocal regulation between lunapark and atlastin facilitates ER three-way junction formation.
  findings:
  - statement: LNPK and atlastin reciprocally regulate ER-junction formation, with LNPK stabilizing rather than catalyzing membrane fusion.
    supporting_text: >-
      Three-way junctions are characteristic structures of the tubular endoplasmic reticulum (ER)
      network. Junctions are formed through atlastin (ATL)-mediated membrane fusion and stabilized by lunapark (Lnp).
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Mechanistic corroboration for LNPK junction targeting and cooperation with atlastin; species and construct boundaries are retained in notes.
- id: PMID:41193816
  title: Secretome translation shaped by lysosomes and lunapark-marked ER junctions.
  findings:
  - statement: Human-cell LNPK loss impairs eIF2-dependent secretome-mRNA initiation at lysosome-proximal ER junctions.
    supporting_text: >-
      Loss of LNPK selectively reduces ribosome occupancy and translation efficiency of secretome
      mRNAs at these junctions by impairing eIF2-dependent initiation, an effect that can be rescued
      by the integrated stress response (ISR) inhibitor ISRIB.
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct human knockout/depletion and rescue evidence for a spatially restricted, secondary translation role.
