- id: PMID:12732147
  title: A global control region defines a chromosomal regulatory landscape containing
    the HoxD cluster.
  full_text_unavailable: true
  findings:
  - statement: Lnp shares limb and CNS expression with neighboring Hoxd genes and Evx2, but the study does not test a causal limb function.
    supporting_text: >-
      During limb development, coordinated expression of several Hoxd genes is required in
      presumptive digits. We searched for the underlying control sequences upstream from the
      cluster and found Lunapark (Lnp), a gene which shares limb and CNS expression specificities
      with both Hoxd genes and Evx2, another gene located nearby.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: LOW
    correctness: MISCITED
    review_notes: Expression evidence does not establish membrane localization or causal limb development.
- id: PMID:22729086
  title: ER network formation requires a balance of the dynamin-like GTPase Sey1p
    and the Lunapark family member Lnp1p.
  findings:
  - statement: Human Lnp expressed in mammalian cells localizes to ER three-way junctions; most mechanism in the paper is yeast evidence.
    supporting_text: In mammalian cells, Lnp1 also localized to the three way junctions of the ER (Fig. 2e), suggesting that its function is conserved from yeast to higher cells.
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct mammalian localization with conserved-family mechanistic evidence primarily from budding yeast.
- id: PMID:24223779
  title: Protein N-myristoylation plays a critical role in the endoplasmic reticulum
    morphological change induced by overexpression of protein Lunapark, an integral
    membrane protein of the endoplasmic reticulum.
  findings:
  - statement: Human LNPK is a double-spanning integral ER membrane protein with cytosolic termini.
    supporting_text: >-
      Analysis of tumor necrosis factor-fusion proteins with each of the two putative transmembrane
      domains and their flanking regions of protein Lunapark revealed that transmembrane domain 1
      and 2 functioned as type II signal anchor sequence and stop transfer sequence, respectively,
      and together generated a double-spanning integral membrane protein with an N-/C-terminal
      cytoplasmic orientation.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct human topology, localization, lipidation, and mutagenesis evidence; morphology uses overexpression.
- id: PMID:25404289
  title: A model for the generation and interconversion of ER morphologies.
  findings:
  - statement: A curvature model and mammalian experiments support LNPK stabilization of ER three-way junctions.
    supporting_text: >-
      Lunapark is an example of S-type proteins that promote junctions between tubules and sheets.
      In a tubular ER network, lunapark stabilizes three-way junctions, i.e., small triangular
      sheets with concave edges.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Integrates theoretical modeling and mammalian overexpression; not a purified curvature-sensing assay.
- id: PMID:25548161
  title: Lunapark stabilizes nascent three-way junctions in the endoplasmic reticulum.
  full_text_unavailable: true
  findings:
  - statement: Mammalian live imaging shows that LNPK-positive nascent ER junctions remain stable while LNPK-negative junctions close.
    supporting_text: >-
      Newly formed junctions that acquire mLnp1 remain stable within the ER network, whereas nascent
      junctions that fail to acquire mLnp1 undergo rapid ring closure.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Strong mammalian dynamic evidence; detailed construct provenance is unavailable in the cached abstract.
- id: PMID:27619977
  title: Cooperation of the ER-shaping proteins atlastin, lunapark, and reticulons
    to generate a tubular membrane network.
  findings:
  - statement: Human U2OS LNPK knockout shifts peripheral ER from tubules and junctions toward sheets, and low-level rescue restores the reticular network.
    supporting_text: >-
      We generated a CRISPR knock-out of lunapark in U2OS cells that express GFP-calreticulin
      (Figure 8—figure supplement 1A). Cells lacking Lnp exhibited a proliferation of peripheral
      sheets and a reduction of tubules and junctions (Figure 8A; quantification in Figure 8B).
    reference_section_type: RESULTS
  - statement: The zinc-finger-containing region is required for LNPK self-interaction and junction targeting.
    supporting_text: >-
      Taken together, these results show that localization to three-way junctions requires several
      Lnp features, including the Zn2+-finger implicated in dimerization.
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Strong direct human knockout, rescue, localization, domain, and interaction evidence.
- id: PMID:30032983
  title: Mutations in LNPK, Encoding the Endoplasmic Reticulum Junction Stabilizer
    Lunapark, Cause a Recessive Neurodevelopmental Syndrome.
  full_text_unavailable: true
  findings:
  - statement: Human biallelic LNPK loss-of-function causes a neurodevelopmental syndrome with corpus-callosum hypoplasia and abnormal ER structure.
    supporting_text: >-
      Affected cells showed the absence of full-length lunapark, aberrant ER structures, and
      increased luminal mass density. Together, our results implicate the ER junction stabilizer
      lunapark in establishing the corpus callosum.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct human genetics and patient-cell evidence; detailed assays are inaccessible in the abstract-only cache.
- id: PMID:32296183
  title: A reference map of the human binary protein interactome.
  findings:
  - statement: HuRI supplies binary interaction candidates, but their cellular functions generally remain unresolved.
    supporting_text: While HuRI displays highly significant overlap with known functional relationships, the cellular function of most individual PPIs remains to be elucidated.
    reference_section_type: DISCUSSION
