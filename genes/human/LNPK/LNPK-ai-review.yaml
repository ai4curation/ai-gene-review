suggested_questions:
- question: >-
    Does endogenous human LNPK possess intrinsic ubiquitin-protein ligase activity,
    and if so, what are its physiological substrates and consequences at ER junctions?
  experts: []
- question: >-
    Is the secretome-mRNA initiation phenotype a direct function of LNPK or an indirect
    consequence of altered ER-junction architecture and lysosome positioning?
  experts: []
- question: >-
    Which neural cell type and LNPK-dependent cellular process make corpus-callosum
    development especially sensitive to loss of this broadly expressed ER-shaping protein?
  experts: []
