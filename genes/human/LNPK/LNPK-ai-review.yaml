knowledge_gaps:
- gap_statement: >-
    Whether LNPK itself has physiologically relevant ubiquitin-protein ligase activity,
    and any endogenous substrate of that proposed activity, remain unresolved.
  boundary: >-
    A single study reports in-vitro ubiquitin-ligase activity in mammalian-cell-purified
    LNPK and attributes activity both to an associated ligase and to LNPK itself. The
    cached record is abstract-only, the activity lacks independent replication, and it
    is not adopted in the current reviewed UniProt entry or GO annotation set.
  gap_kind:
  - BIOLOGY
  - CURATION
  dark_aspect: MF_DARK
  status: OPEN
  significance: >-
    Resolving this question would determine whether LNPK has a second catalytic molecular
    function or acts solely as an architectural ER-junction protein.
  resolution: >-
    Purified-protein reconstitution after excluding copurifying E3 enzymes, catalytic-site
    mutagenesis, endogenous ubiquitination assays, and substrate identification should test
    intrinsic activity and its cellular relevance.
  provenance:
  - reference_id: PMID:27387505
    supporting_text: >-
      Accordingly, Lnp purified from mammalian cells has a ubiquitin ligase activity in vitro
      Intriguingly, biochemical analyses show that this activity can be attributed not only to
      associated ubiquitin ligase, but also to an intrinsic ubiquitin ligase activity borne by Lnp itself.
- gap_statement: >-
    The causal steps connecting LNPK-mediated ER-junction stabilization to selective
    secretome-mRNA initiation and to corpus-callosum development are not known.
  boundary: >-
    Human-cell loss experiments establish a spatially restricted translation-initiation
    phenotype at lysosome-proximal LNPK-marked ER junctions, while human biallelic loss
    establishes a requirement for normal ER structure and corpus-callosum development.
    Neither result shows that translation control or neural development is a second
    constitutive molecular activity of LNPK.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    Defining these connections would explain how a broadly expressed membrane-architecture
    factor produces selective translational and neurodevelopmental outcomes.
  resolution: >-
    Separation-of-function rescue alleles should be tested jointly for ER topology,
    junction-proximal translation initiation, and neural-lineage phenotypes to establish
    whether the downstream effects require junction stabilization itself.
  provenance:
