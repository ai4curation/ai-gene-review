  experts: []
suggested_experiments:
- hypothesis: >-
    LNPK has intrinsic ubiquitin-protein ligase activity that modifies defined
    ER-junction substrates independently of copurifying E3 enzymes.
  description: >-
    Reconstitute ubiquitination with rigorously purified human LNPK, defined E1/E2 and
    ubiquitin components, and catalytic or N-terminal mutants; combine orthogonal product
    detection with endogenous substrate-trapping and knockout/rescue experiments.
  experiment_type: purified-protein ubiquitination and cellular substrate validation
- hypothesis: >-
    LNPK supports secretome-mRNA initiation through a junction-specific property that
    can be separated from its global effect on ER morphology.
  description: >-
    Rescue LNPK-null human cells at endogenous expression with myristoylation-, coiled-coil-,
    zinc-finger-, and oligomerization-defective variants, then quantify ER topology,
    lysosome-junction proximity, spatial ribosome occupancy, and ISRIB-sensitive initiation
    in the same cells.
  experiment_type: separation-of-function rescue and spatial translation profiling
- hypothesis: >-
    Corpus-callosum phenotypes arise from a lineage-restricted requirement for LNPK-mediated
    ER-junction maintenance during axon growth or glial support.
  description: >-
    Use isogenic LNPK-null human neural organoids with lineage-restricted wild-type and
    separation-of-function rescue, measuring ER ultrastructure, axon extension, glial
    differentiation, and secretome translation across relevant neural cell types.
  experiment_type: neural-organoid lineage-rescue study
- hypothesis: >-
    Alternative LNPK products differ in membrane insertion and junction-stabilizing capacity
    because their N-terminal architectures are altered.
  description: >-
    Introduce isoform-specific endogenous tags and perform topology mapping, quantitative
    junction localization, and knockout-rescue assays for all four products at matched
    expression levels.
  experiment_type: isoform-resolved topology and functional rescue
