id: Q9C0E8
gene_symbol: LNPK
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  LNPK encodes lunapark, an N-myristoylated double-pass endoplasmic-reticulum membrane
  protein that concentrates at three-way junctions of the peripheral ER tubular network.
  Its cytosolic coiled-coil and zinc-finger-containing regions support self-association
  and junction targeting, allowing LNPK to stabilize newly formed junctions and preserve
  the balance between ER tubules, junctions, and sheets. LNPK abundance and oligomerization
  are regulated during mitosis. Loss of LNPK disrupts ER architecture in human cells and
  causes a recessive neurodevelopmental disorder characterized by severe developmental
  impairment and corpus-callosum hypoplasia. LNPK-marked ER junctions also organize a
  context-dependent site of secretome-mRNA translation near lysosomes.
