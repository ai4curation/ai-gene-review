- question: Is the interaction with DYNLL1/DYNLL2 direct, and is ACTL7B the cargo or
    the adaptor? The co-immunoprecipitations establish association in native testis in
    both directions, but not directness, stoichiometry, or which partner positions the
    other.
  experts:
