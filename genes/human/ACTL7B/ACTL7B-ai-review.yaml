- term:
    id: GO:0005200
    label: structural constituent of cytoskeleton
  evidence_type: TAS
  original_reference_id: PMID:10373328
  qualifier: enables
  review:
    summary: >-
      A ProtInc-era traceable author statement, dated 2003, tracing to the 1999 paper that
      cloned the gene. Reading that paper settles the matter: it reports cDNA selection and
      genomic sequencing, chromosomal mapping, Northern-blot tissue distribution and a
      mutation screen in familial dysautonomia patients. There is no protein-level
      experiment in it, no localisation study, and no cytoskeletal or polymerisation assay.
      The annotation is a restatement of the title's description of ACTL7A and ACTL7B as
      "two novel actin genes", a fold name entering GO as a molecular function.

      Three independent lines converge against it. First, GO's own phylogenetic curation has
      explicitly rejected this term for the clade containing ACTL7B: node PTN008986528
      carries GO:0005200 as an IRD with negated=true and propagates only the generic parent
      GO:0005198, so GOA currently publishes for ACTL7B a term that PAINT has decided does
      not belong to its clade. Second, the structural requirement for the term is absent: of
      the 74 protomer-protomer contact positions computed from the F-actin filament, only
      26 are identical in ACTL7B and 34 differ non-conservatively, and the largest contact
      segment, actin 38-45, the DNase-I-binding D-loop that forms actin's principal
      longitudinal contact, is entirely replaced (PRHQGVMV to RCPEAADA, 0 of 8 identical).
      At 35% interface identity ACTL7B sits with Arp2 and the nuclear ARPs, not with any
      conventional actin. Third, this row is the sole input to the spurious GO:0007010 IEA.

      This is not the mirror-image error of asserting "fold without function" without
      checking: the nucleotide pocket was checked too, and it is only partly degenerate
      (13 of 20 contacts retained, including the catalytic Gln137), which is why no
      nucleotide or ATP-binding claim is made or contested here.
    action: REMOVE
    reason: >-
      The evidence code is a statement, not an experiment, and the statement traced to is
      the gene's name. TAS is not an experimental code, so removing it does not overrule a
      curator who read data; the paper is cached and its abstract shows what it contains. GO
      has already reached the same conclusion for this clade through PAINT, and the
      structural analysis shows the fold-based route to the term is closed because the
      polymerisation surface is not conserved. Removing it also removes the basis of the
      GO:0007010 inference. The defensible level of this claim, GO:0005198 structural
      molecule activity, is already present on the gene by IBA and is accepted above, so no
      information is lost.
    supported_by:
    - reference_id: PMID:10373328
      supporting_text: Two novel human actin-like genes, ACTL7A and ACTL7B, were identified
        by cDNA selection and direct genomic sequencing
    - reference_id: file:human/ACTL7B/ACTL7B-bioinformatics/RESULTS.md
      supporting_text: '| 38-45 | 8 | PRHQGVMV | RCPEAADA | 0/8 | 1/8 | 8/8 |'
