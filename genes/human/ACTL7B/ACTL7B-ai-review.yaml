      support subacrosomal F-actin and carries perinuclear theca by IDA, so actin-related
      compartment claims have some footing there. ACTL7B has none of that evidence.
    action: REMOVE
    reason: >-
      Statement-level evidence from a paper with no localisation data, asserting membership
      of an actin-composed structure for a protein that has lost actin's polymerisation
      interface and has never been shown to associate with F-actin. This is the cellular
      component twin of the GO:0005200 defect and should go for the same reasons. The
      broader GO:0005856 cytoskeleton row is retained but flagged, so no compartment claim
      is silently strengthened by this removal.
