- term:
    id: GO:0005856
    label: cytoskeleton
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  review:
    summary: >-
      Keyword-driven electronic annotation. The WITH/FROM token is not a gene but
      UniProtKB-SubCell:SL-0090, and that keyword comes from the single subcellular-location
      line in the UniProt entry, which is flagged ECO:0000250, by similarity. So the chain
      runs: ACTL7B has the actin fold, therefore UniProt infers it is cytoskeletal,
      therefore the keyword mapping asserts GO:0005856. No observation enters the chain at
      any point.

      The inference does not survive checking against what ACTL7B is actually reported to
      localise to. The compartments described in mouse, namely acrosomal vesicle
      (GO:0001669), the region connecting flagellum to head (GO:0120212 sperm head-tail
      coupling apparatus) and nucleus, are none of them descendants of GO:0005856 in the
      ontology. The paralogue ACTL7A is different in exactly this respect: it carries
      GO:0033011 perinuclear theca by IDA, and perinuclear theca is a descendant of
      cytoskeleton, so the cytoskeleton annotation is defensible for ACTL7A and not for
      ACTL7B. Independently, the filament interface analysis argues against ACTL7B being an
      F-actin subunit.
