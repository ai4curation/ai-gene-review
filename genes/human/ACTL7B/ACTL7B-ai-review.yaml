knowledge_gaps:
- gap_statement: >-
    Every functional statement about ACTL7B comes from mouse. There is no human
    loss-of-function evidence, no human localisation study, and no biochemical assay on the
    human protein; the only human-specific data are transcript and protein detection in
    testis and a polymorphism screen that could not establish causality.
  boundary: >-
    The human protein exists and is testis-enriched (UniProt PE 1, HPA tissue-enriched
    testis), and the mouse orthologue is 86.7% identical over the whole chain, so ISS
    transfer is reasonable and is what this review proposes. The gap is that nothing about
    the human protein has been measured directly, so every proposed annotation is an
    inference across species.
  gap_kind:
  - BIOLOGY
  - CURATION
  dark_aspect: MF_DARK
  status: OPEN
  significance: >-
    ACTL7B knockout phenocopies two leading causes of idiopathic human male infertility, so
    the absence of human data is the obstacle to using the gene diagnostically.
- gap_statement: >-
    Whether ACTL7B binds a nucleotide is unknown. The pocket is intermediate: 13 of 20
    nucleotide contacts computed from the F-actin structure are conserved, including the
    P-loop serine and lysine and the catalytic Gln137, but G15, D157, R210, T303 and Y306
    are not. No nucleotide-binding or hydrolysis assay has ever been performed on ACTL7B or
    on any ACTL7-family protein.
  boundary: >-
    This is a genuinely open question, not a hidden negative. The conservation level (65%)
    sits between the ATP-binding cytoplasmic ARPs Arp2 and Arp3 (85% and 70%) and the
    nucleotide-poor nuclear ARPs (35-50%), so the sequence alone cannot decide it. GOA does
    not annotate ATP binding for ACTL7B, so nothing is currently wrong; the point is that
    nothing is known either.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: >-
    Whether the ACTL7 clade retains nucleotide binding determines whether these proteins can
    be conformationally regulated like actin or are static structural elements, which in
    turn determines what kind of molecular function terms could ever apply to them.
- gap_statement: >-
    The nuclear pool of ACTL7B has a localisation but no activity. Intranuclear ACTL7B is
    documented in spermatocytes and round spermatids, a conserved putative nuclear
    localisation sequence has been described, HDAC1 and HDAC3 lose intranuclear localisation
    in its absence, and knockout testis shows transcriptional changes, but the only
    proposed mechanism, substitution for conventional nuclear ARPs on the HSA domains of
    INO80 and SWI/SNF remodellers, is a computational docking result in a preprint.
  boundary: >-
    The localisation is observed in vivo and the HDAC phenotype is a real knockout
    observation, which is why the nucleus annotation is kept. What does not exist is any
    measured interaction with a chromatin-remodelling complex, any demonstration that ACTL7B
    occupies an ARP position in one, or peer-reviewed publication of the modelling work.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: NARROWING
  significance: >-
    If confirmed, germline-specific ARP substitution in nucleosome-remodelling complexes
    would be a new mechanism for the chromatin reorganisation of spermiogenesis. If not, the
    nuclear pool may be incidental, and GO would be carrying an is_active_in nucleus
    annotation for a protein with no nuclear activity.
suggested_questions:
- question: Does ACTL7B bind ATP or ADP? The nucleotide pocket retains the P-loop serine
    and lysine and the catalytic Gln137 but has lost G15, D157, R210, T303 and Y306,
    placing it between the nucleotide-binding cytoplasmic ARPs and the nucleotide-poor
    nuclear ARPs. No binding or hydrolysis assay has ever been reported for any ACTL7-family
    protein.
