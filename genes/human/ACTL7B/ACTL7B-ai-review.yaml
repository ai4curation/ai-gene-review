core_functions:
- description: >-
    Spermatid-specific structural actin-related protein required for spermiogenesis. ACTL7B
    appears post-meiotically in round and elongating spermatids and is found in the
    cytoplasm, on the developing acrosome and at the region where the flagellum joins the
    sperm head. Two independent mouse knockouts show that without it spermatid remodelling
    fails: acrosomes detach, membranes are disrupted, flagella and sperm heads are malformed
    from spermiogenesis step 9 onward, abnormal spermatids are degraded, and males are
    infertile with oligoteratozoospermia. No catalytic activity, nucleotide hydrolysis or
    actin binding has been demonstrated, and the residues actin uses to polymerise are not
    conserved, with only 26 of 74 filament interface positions identical and the D-loop
    entirely replaced, so the molecular function is best stated at the level of a
    structural molecule rather than as a cytoskeletal filament constituent. This is also the
    level that GO's phylogenetic curation independently arrived at, by rejecting GO:0005200
    for this clade while propagating GO:0005198.
