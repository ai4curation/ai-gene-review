    dark_aspect: MF_DARK
    status: OPEN
    significance: >-
      Oligoteratozoospermia and multiple morphological abnormalities of the flagellum are
      leading causes of idiopathic male infertility, and ACTL7B knockout phenocopies both.
      Without a molecular mechanism the human gene cannot be interpreted in patients, and GO
      can express its function only as "structural molecule activity".
- description: >-
    Binds the LC8-family dynein light chains DYNLL1 and DYNLL2 and determines where they are
    in the cell. Anti-ACTL7B beads recover both light chains from whole wild-type mouse
    testis, anti-DYNLL2 beads recover ACTL7B reciprocally, and a GFP pull-down from cells
    expressing ACTL7B-eGFP enriches the same partners. The interaction is functionally
    consequential in both directions: in Actl7b-null testis DYNLL1 and DYNLL2 are
    mislocalised while their abundance is unchanged, and ectopic ACTL7B in HEK cells
    redistributes both light chains. DYNLL1 and DYNLL2 first appear in step 9 spermatids, the
    stage at which the null phenotype begins, so this interaction is the best current
    candidate for the proximate molecular event behind the spermatid defect.
