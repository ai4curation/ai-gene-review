  review:
    summary: >-
      The second ProtInc traceable author statement from the same 1999 cloning paper, and
      the same problem in the cellular component aspect. The paper performed no
      localisation experiment of any kind; its expression data are Northern blots of tissue
      RNA. GO:0015629 is defined as the part of the cytoskeleton "composed of actin and
