id: Q9Y614
gene_symbol: ACTL7B
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  ACTL7B (actin-like protein 7B, T-ACTIN 1) is a 415-residue actin-related protein (ARP)
  expressed almost exclusively in the testis. The gene is intronless and sits head-to-head
  with its paralogue ACTL7A on chromosome 9q31, both having arisen by retroposition of a
  spliced actin-progenitor mRNA. The protein appears post-meiotically in round and
  elongating spermatids, where it is found in the cytoplasm, on the developing acrosome, at
  the region connecting the flagellum to the sperm head, and at lower abundance inside
  the nucleus of early spermatids and spermatocytes. Two independent mouse knockouts show
  that it is required for spermiogenesis: null males are infertile with severe
  oligoteratozoospermia, multiple morphological abnormalities of the flagellum, malformed
  sperm heads, detached acrosomes and disrupted membranes appearing from spermiogenesis step
  9, after which abnormal spermatids are degraded. Its only well-supported molecular partners
  are the LC8-family dynein light chains DYNLL1 and DYNLL2, which ACTL7B binds in testis and
  whose intracellular distribution becomes abnormal in its absence, implicating ACTL7B in the
  positioning of dynein light chains during spermatid remodelling. Although it retains the
  actin fold and much of the actin nucleotide pocket, the surface actin uses for filament
  formation is not conserved, with the DNase-I-binding loop entirely replaced, so ACTL7B is
  not expected to behave as a conventional filament-forming actin, and no polymerisation,
  nucleotide-hydrolysis or actin-binding activity has been demonstrated for it. A nuclear
  role in chromatin regulation, possibly by substituting for conventional nuclear ARPs in
  nucleosome-remodelling complexes, has been proposed but so far rests on localisation,
  transcriptome changes in knockout testis, and computational docking.
references:
- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  findings: []
- id: GO_REF:0000044
  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot Subcellular Location
    vocabulary mapping, accompanied by conservative changes to GO terms applied by
    UniProt
  findings: []
- id: GO_REF:0000108
  title: Automatic assignment of GO terms using logical inference, based on on inter-ontology
    links
  findings: []
- id: PMID:10373328
  title: Cloning, mapping, and expression of two novel actin genes, actin-like-7A
    (ACTL7A) and actin-like-7B (ACTL7B), from the familial dysautonomia candidate
    region on 9q31.
  findings:
  - statement: >-
      The paper that both legacy TAS annotations on ACTL7B trace to. It reports cDNA
      selection, genomic sequencing, chromosomal mapping, Northern-blot tissue expression
      and mutation screening in familial dysautonomia patients. It contains no protein-level
      experiment, no localisation study and no cytoskeletal assay, so it cannot support
      either "structural constituent of cytoskeleton" or "actin cytoskeleton".
    supporting_text: Two novel human actin-like genes, ACTL7A and ACTL7B, were identified
      by cDNA selection and direct genomic sequencing
  - statement: >-
      Establishes the testis-restricted expression of ACTL7B, in contrast to the broadly
      expressed paralogue ACTL7A.
    supporting_text: was detected only in the testis and, to a lesser extent, in the
      prostate.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Correctly cited as the discovery and expression paper, and it is the paper the two
      TAS annotations name. Verified against the cached abstract that it contains no
      protein-level or localisation experiment; the TAS annotations derived from it are
      restatements of the genes' actin-like name, which is why both are recommended for
      removal.
- id: PMID:12672658
  title: Novel actin-like proteins T-ACTIN 1 and T-ACTIN 2 are differentially expressed
    in the cytoplasm and nucleus of mouse haploid germ cells.
  findings:
  - statement: >-
      Original mouse immunolocalisation, and the source of the mouse Actl7b GO:0005737 IDA
      that anchors the cytoplasm IBA on human ACTL7B. T-ACTIN 1 is mouse Actl7b and T-ACTIN
      2 is mouse Actl7a; the two paralogues were placed in different compartments.
    supporting_text: the cellular locations of these two proteins are quite different
      (T-ACTIN-1 was found in the cytoplasm and T-ACTIN-2 was located in the nucleus)
  - statement: >-
      The authors already noted that the T-ACTINs retain only part of actin's conserved
      architecture, consistent with the residue-level audit performed for this review.
    supporting_text: The T-ACTINs contained some of the conserved regions seen in other
      actins.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified. This is the experimental basis of the mouse Actl7b cytoplasm IDA
      cited in the WITH/FROM of the human cytoplasm IBA. Its nucleus assignment applies to
      T-ACTIN 2 (Actl7a), not to ACTL7B; the ACTL7B nuclear pool is a later finding
      (PMID:37800308, PMID:38464253), so this paper should not be cited for ACTL7B nuclear
      localisation.
- id: PMID:31310081
  title: Genetic Polymorphisms within The Intronless ACTL7A and ACTL7B Genes Encoding
    Spermatogenesis-Specific Actin-Like Proteins in Japanese Males.
  findings:
  - statement: >-
      Human sequencing of 282 sterile and 89 fertile men found polymorphisms in both genes
      but established no causal link, so there is still no human genetic evidence assigning
      a function to ACTL7B.
    supporting_text: Although we could not determine whether these SNPs cause infertility
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Correctly cited, and deliberately used only for a negative statement: the paper's own
      conclusion is that causality could not be determined. Cited to document that the human
      gene has no established disease association, not as support for any function.
- id: PMID:32814053
  title: Interactome Mapping Provides a Network of Neurodegenerative Disease Proteins
    and Uncovers Widespread Protein Aggregation in Affected Brains.
  findings:
  - statement: >-
      The source of all four GO:0005515 protein binding rows on ACTL7B. It is a systematic
      yeast two-hybrid matrix built around neurodegeneration-related baits, generating tens
      of thousands of candidate interactions; ACTL7B, a testis-restricted spermatid protein,
      appears among the prey. No orthogonal validation of any ACTL7B interaction is reported.
    supporting_text: candidate interactions and is generated by systematic yeast two-hybrid
      interaction screening of ∼500 ND-related proteins
  reference_review:
    relevance: LOW
    correctness: LOW_QUALITY
    review_notes: >-
      The citation is correct and the study is a legitimate large-scale resource, but for
      ACTL7B specifically it yields four unreplicated Y2H candidate interactions from a
      screen whose biological context (neurodegeneration, brain tissue) does not overlap the
      gene's expression domain. Flagged LOW_QUALITY as support for ACTL7B molecular function,
      not as a criticism of the paper's own claims.
- id: PMID:36617158
  title: Actin-related protein ACTL7B ablation leads to OAT with multiple morphological
    abnormalities of the flagellum and male infertility in mice†.
  findings:
  - statement: >-
      Mouse Actl7b knockout. Establishes the subcellular distribution of ACTL7B during
      spermiogenesis, including the developing acrosome and the nucleus of early spermatids.
    supporting_text: In mice, ACTL7B specifically localises to the developing acrosome,
      within the nucleus of early spermatids, and to the flagellum connecting region.
  - statement: >-
      The knockout phenotype is infertility with oligoteratozoospermia and multiple
      morphological abnormalities of the flagellum and sperm head.
    supporting_text: KO mice were infertile, with severe and variable oligoteratozoospermia
      (OAT) and multiple morphological abnormalities of the flagellum (MMAF) and sperm
      head.
  - statement: >-
      States explicitly that the testis-specific ARPs, including ACTL7B, were functionally
      uncharacterised before this work, which is why the pre-existing GO annotations rest
      on fold-level inference rather than data.
    supporting_text: Multiple testis-specific ARPs are well conserved among mammals, but
      their functional roles are unknown.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified; the abstract states the localisation and knockout phenotype quoted.
      Cached record is abstract-only (full_text_available false), so only abstract-level
      claims are used here. Mouse work, hence proposed as ISS for the human gene rather than
      IMP or IDA.
- id: PMID:37800308
  title: Actl7b deficiency leads to mislocalization of LC8 type dynein light chains
    and disruption of murine spermatogenesis.
  findings:
  - statement: >-
      Independent mouse Actl7b-null line confirming the infertility and spermatid
      morphogenesis phenotype, with a defined onset at spermiogenesis step 9.
    supporting_text: Severe spermatid defects, such as detached acrosomes, disrupted
      membranes and flagella malformations start to appear after spermiogenesis step 9
  - statement: >-
      Identifies DYNLL1 and DYNLL2 as ACTL7B partners by co-immunoprecipitation from
      wild-type testis, that is, at endogenous levels in the native tissue.
    supporting_text: In the co-immunoprecipitation using the anti-ACTL7B-coupled beads,
      we identified LC8 light chains, dynein light chain 1 (DYNLL1) and its paralog dynein
      light chain 2 (DYNLL2).
  - statement: Reciprocal co-immunoprecipitation confirms the interaction in the opposite
      direction.
    supporting_text: In the eluate of the co-immunoprecipitation using anti-DYNLL2-coupled
      beads, DYNLL2 and ACTL7B were detected, further supporting the ACTL7B-DYNLL2 interaction.
  - statement: >-
      Loss of ACTL7B changes where DYNLL1 and DYNLL2 are, without changing how much of them
      there is, so this is a localisation phenotype rather than a stability phenotype.
    supporting_text: Taken together, these results suggest that the localization of DYNLL1
      and DYNLL2 is altered in the absence of ACTL7B, whereas the amount of protein is
      unchanged.
  - statement: >-
      Ectopic expression of ACTL7B in HEK cells redistributes DYNLL1 and DYNLL2, providing
      a gain-of-function counterpart to the knockout result.
    supporting_text: This supports the notion that ACTL7B interacts with and controls DYNLL1
      and DYNLL2 localization in the cell.
  - statement: >-
      Records the nuclear pool of ACTL7B alongside the dominant cytoplasmic pool, refining
      the cytoplasm-only assignment of PMID:12672658.
    supporting_text: ACTL7B is detected in the cytoplasm and at lesser amounts in the nucleus
      of round and elongating spermatids
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified and full text available in the cache; the co-immunoprecipitation
      passages were read directly rather than taken from a summary. This is the single most
      informative reference for ACTL7B molecular function and it is absent from both the
      human and the mouse GO records. It was also missing from the affinage report, and was
      found by an independent PubMed search of the gene symbol.
- id: PMID:38464253
  title: Novel Nuclear Roles for Testis-Specific ACTL7A and ACTL7B Supported by In
    Vivo Characterizations and AI Facilitated In Silico Mechanistic Modeling with Implications
    for Epigenetic Regulation in Spermiogenesis.
  findings:
  - statement: >-
      Confirms an intranuclear pool of ACTL7B in mouse spermatocytes and round spermatids
      and reports a conserved putative nuclear localisation sequence.
    supporting_text: This study confirms the intranuclear presence of ACTL7B in spermatocytes
      and round spermatids
  - statement: >-
      Reports that intranuclear HDAC1 and HDAC3 localisation is lost in the absence of
      ACTL7A or ACTL7B.
    supporting_text: Additionally, in the absence of ACTL7A or ACTL7B there is a loss of
      intranuclear localization of HDAC1 and HDAC3
  - statement: >-
      The proposed mechanism, ACTL7B substituting for conventional nuclear ARPs on the HSA
      domains of INO80 and SWI/SNF remodellers, is explicitly a computational docking result
      rather than a binding measurement, and is treated here as a hypothesis.
    supporting_text: models, ACTL7A and ACTL7B were found capable of binding to INO80 and
      SWI/SNF nucleosome remodeler family members in a manner akin to nuclear actin and
      ACTL6A.
  reference_review:
    relevance: MEDIUM
    correctness: LOW_QUALITY
    review_notes: >-
      Correctly cited and the PMID resolves to the intended record, but PubMed types it as a
      Preprint (bioRxiv, PMCID PMC10925299) with no peer-reviewed version found by PubMed
      search as of this review. Its in vivo localisation and HDAC observations are used only
      as corroboration of the nucleus annotation; its INO80 and SWI/SNF interaction claim is
      in silico docking and is not used to support any GO term.
- id: file:human/ACTL7B/ACTL7B-bioinformatics/RESULTS.md
  title: ACTL7B bioinformatics audit - propagation audit and actin residue audit
  findings:
  - statement: >-
      PAINT explicitly rejected GO:0005200 for the clade containing ACTL7B. Node
      PTN008986528 carries GO:0005198 by IBA and GO:0005200 as an IRD with negated=true,
      both inherited from node PTN000940351, whose GO:0005200 IBD is seeded from conventional
      actins and Arp2/Arp3.
    supporting_text: '| PTN008986528 | GO:0005200 | F | IRD (NEGATED) | PANTHER:PTN000940351 |'
  - statement: >-
      The protomer-protomer interface of the F-actin filament is not conserved in ACTL7B.
      Of 74 contact positions computed from the middle protomer of 8A2S, 26 are identical
      and 34 differ non-conservatively (35.1% identity), versus 97-100% for conventional
      actins.
    supporting_text: '| ACTL7B (Homo sapiens) | query (human ACTL7B) | 42.9 | 26 | 13 | 34
      | 1 | 35.1 | 52.7 |'
  - statement: >-
      The largest single interface segment, actin residues 38-45 (the DNase-I-binding
      D-loop, the principal longitudinal inter-protomer contact), is entirely replaced in
      ACTL7B. PRHQGVMV becomes RCPEAADA, 0 of 8 identical, against 8 of 8 in ACTB.
    supporting_text: '| 38-45 | 8 | PRHQGVMV | RCPEAADA | 0/8 | 1/8 | 8/8 |'
  - statement: >-
      By contrast the nucleotide pocket is only partly degenerate. ACTL7B retains the P-loop
      serine and lysine (S14, K18) and the catalytic Gln137, while losing G15, D157, R210,
      T303 and Y306. Nucleotide binding is therefore untested rather than excluded, and no
      ATP-binding annotation is being contested.
    supporting_text: 'Per-position nucleotide contacts in ACTL7B (8A2S numbering -> ACTL7B):
      G13->G57, S14->S58, G15->Q59, L16->Y60, K18->K62, Q137->Q181'
  - statement: >-
      Every protein-level WITH/FROM source of every IBA row carries its own experimental
      evidence for the propagated term, including yeast ARP9, which has IDA and IPI for
      nucleus. No row in this review is criticised on the grounds that its source was
      guessing.
    supporting_text: '| 1 | GO:0005634 nucleus | IBA | `SGD:S000004636` | ARP9 (Saccharomyces
      cerevisiae) Q05123 [Swiss-Prot] | IBA,IDA,IEA,IPI (own experimental: yes) |  |'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Generated in this review by ACTL7B-bioinformatics/analyze.py; a fresh run reproduces
      the committed report byte for byte. Contact residue sets are computed from deposited
      structures (1ATN, 8A2S) rather than taken from literature, and the WITH/FROM table is
      built from ACTL7B-goa.tsv with an assertion that token counts match GOA.
- id: file:human/ACTL7B/ACTL7B-uniprot.txt
  title: UniProt entry Q9Y614 (ACL7B_HUMAN)
  findings:
  - statement: >-
      UniProt makes no functional claim for ACTL7B beyond family membership, and its only
      subcellular-location statement is an inference (ECO:0000250, By similarity) rather
      than an observation, which is the ultimate source of the GO:0005856 IEA.
    supporting_text: 'SUBCELLULAR LOCATION: Cytoplasm, cytoskeleton {ECO:0000250}.'
  - statement: The entry asserts only family membership, with ECO:0000305 (curator inference).
    supporting_text: 'SIMILARITY: Belongs to the actin family. {ECO:0000305}.'
  - statement: >-
      The protein is detected at protein level, so the gap is functional and biochemical
      characterisation of the human protein rather than evidence of its existence.
    supporting_text: 'PE   1: Evidence at protein level;'
  - statement: >-
      Conserved-domain databases already treat the ACTL7 clade as distinct from generic
      actin, assigning a clade-specific nucleotide-binding-domain model.
    supporting_text: CDD; cd10214; ASKHA_NBD_ACTL7; 1.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Machine-fetched UniProt record; quotes taken verbatim from single physical lines of
      the flat file.
- id: file:human/ACTL7B/ACTL7B-deep-research-affinage.md
  title: Affinage mechanistic annotation for ACTL7B (human)
  findings:
  - statement: >-
      The affinage record's own GO grounding proposes cytoskeletal protein binding as
      ACTL7B's molecular activity. No measurement supports it: no actin-binding or
      cytoskeletal-protein-binding assay has been reported for ACTL7B, and the one
      documented interaction is with dynein light chains. Recorded here because it is the
      same fold-to-activity leap that produced the legacy TAS annotations.
    supporting_text: '- **molecular_activity:** GO:0008092 cytoskeletal protein binding'
  reference_review:
    relevance: MEDIUM
    correctness: LOW_QUALITY
    review_notes: >-
      The record carries no self_evaluation_pairwise score; its narrative correctly surfaced PMID:36617158 and
      PMID:38464253, but the record missed PMID:37800308 entirely - the Development 2023
      Actl7b-null paper that supplies the only informative molecular partner - which was
      found instead by a direct PubMed search of the gene symbol. Its own GO grounding
      (GO:0008092 cytoskeletal protein binding) is unsupported. Used as a lead only; every
      claim taken from it was re-verified against the cited PMIDs, and no affinage sentence
      is quoted as support for a mechanistic claim.
existing_annotations:
- term:
    id: GO:0005634
    label: nucleus
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  review:
    summary: >-
      Phylogenetic propagation from PANTHER node PTN008986520. All four protein seeds were
      resolved and each carries its own experimental evidence for nucleus: mouse Actl7a
      (Q9QY84, Swiss-Prot; EXP and IDA), Saccharomyces ARP9 (Q05123, Swiss-Prot; IDA and
      IPI), Candida ARP9 (Q5A9X7, unreviewed TrEMBL; IDA) and a Trypanosoma brucei
      actin-like protein (Q57ZL0, unreviewed TrEMBL; IDA and HTP). The two TrEMBL entries
      are reported as such: their protein names are automatic by-similarity labels and are
      not used here as evidence of what the family does, although their curated GO
      annotations are real.

      What is missing from the seed list is the true orthologue, mouse Actl7b. The path is
      therefore paralogue plus deep nuclear ARPs at a node constrained only to Eukaryota,
      which is a weak basis for a compartment claim. The destination, however, is
      independently correct: two 2023-2024 mouse studies place ACTL7B itself inside the
      nucleus of early spermatids and spermatocytes, one of them reporting a conserved
      putative nuclear localisation sequence.
    action: KEEP_AS_NON_CORE
    reason: >-
      The localisation is right and should be kept, but it is not where ACTL7B's
      demonstrated function lies, and the qualifier overstates the evidence. is_active_in
      asserts that the gene product's molecular function is executed in the nucleus, and no
      nuclear activity has been measured for ACTL7B: the proposed chromatin-remodeller
      subunit-swapping mechanism is computational docking, and the HDAC1 and HDAC3
      mislocalisation phenotype shows a requirement, not an activity. located_in would be
      the defensible qualifier. Kept as non-core, and the better evidence line would be
      ISS or ISO from mouse Actl7b (PMID:36617158, PMID:38464253) rather than IBA from ARP9.
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      failure_modes:
      - WRONG_ORTHOLOG_OR_PARALOG
      source_entities:
      - source_id: MGI:MGI:1343051
        source_label: mouse Actl7a (Q9QY84), paralogue rather than orthologue
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Carries GO:0005634 by EXP (PMID:12672658, PMID:21278383) and IDA (PMID:36734600),
          so the source annotation is sound. But it is the ACTL7A paralogue, and the paper
          behind its nucleus call reported the opposite compartment for Actl7b: T-ACTIN 2
          (Actl7a) nuclear, T-ACTIN 1 (Actl7b) cytoplasmic. Paralogue transfer is legitimate
          for IBA, but it means no orthologue-strength inference is available on this row.
      - source_id: SGD:S000004636
        source_label: S. cerevisiae ARP9 (Q05123), RSC and SWI/SNF actin-related subunit
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Swiss-Prot, with GO:0005634 IDA and IPI of its own; also annotated to GO:0016586
          (RSC complex) and GO:0016514 (SWI/SNF complex) at node PTN000940625. A genuine
          nuclear ARP, but one of the most divergent members of the family, 20.2% identical
          to ACTL7B and retaining only 7 of 20 actin nucleotide contacts, so it supports
          "some ARPs are nuclear", not "ACTL7B is nuclear".
      - source_id: CGD:CAL0000196900
        source_label: C. albicans ARP9 (Q5A9X7)
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: >-
          Unreviewed TrEMBL entry; gene symbol ARP9 comes from CGD. Carries its own IDA for
          nucleus. Reported as unreviewed because an unreviewed entry is weaker support and
          its protein name cannot be treated as functional evidence.
      - source_id: UniProtKB:Q57ZL0
        source_label: T. brucei "Actin-like protein, putative"
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: >-
          Unreviewed TrEMBL entry with no gene symbol; the name is an automatic
          by-similarity label. Its GO record does carry IDA and HTP for nucleus, so the
          evidence provenance is real even though the name provenance is not.
      - source_id: PANTHER:PTN008986520
        source_label: ancestral PANTHER node (taxon constraint 2759, Eukaryota)
        source_status: SUPPORTS_TRANSFER
        comment: >-
          Internal tree node, not a protein. Holds GO:0005634 by IBD from the four seeds
          above. A pan-eukaryotic node is a coarse level from which to assign a compartment
          to a mammal-specific, testis-restricted protein.
    supported_by:
    - reference_id: PMID:36617158
      supporting_text: In mice, ACTL7B specifically localises to the developing acrosome,
        within the nucleus of early spermatids, and to the flagellum connecting region.
    - reference_id: PMID:38464253
      supporting_text: This study confirms the intranuclear presence of ACTL7B in spermatocytes
        and round spermatids
    - reference_id: PMID:37800308
      supporting_text: ACTL7B is detected in the cytoplasm and at lesser amounts in the nucleus
        of round and elongating spermatids
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  review:
    summary: >-
      Propagation from PANTHER node PTN001377938, which is restricted to the ACTL7 clade
      (taxon constraint 32524) and seeded by four proteins, all resolved: mouse Actl7b
      (Q9QY83, the true orthologue, with its own GO:0005737 IDA from PMID:12672658), mouse
      Actl7a, rat Actl7a and human ACTL7A. This is the best-founded row in the set, because
      the inference is orthologue-anchored and does not leave the family, and it agrees with
      the primary literature, where the bulk of ACTL7B is cytoplasmic in round and
      elongating spermatids and its reported structures (developing acrosome, flagellum
      connecting region) are cytoplasmic.
    action: ACCEPT
    reason: >-
      Correct compartment, sound propagation, orthologue-anchored, and the compartment in
      which the demonstrated function, binding DYNLL1 and DYNLL2 and controlling their
      distribution during spermatid remodelling, is exercised, so is_active_in is
      appropriate here. The only criticism is that the term is uninformatively broad; the
      specific children supported by the mouse orthologue are proposed as new annotations
      below rather than by modifying this row.
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: MGI:MGI:1343053
        source_label: mouse Actl7b (Q9QY83), true orthologue
        source_status: SUPPORTS_TRANSFER
        comment: >-
          Swiss-Prot, 86.7% identical to human ACTL7B, with GO:0005737 IDA from
          PMID:12672658 (T-ACTIN 1 found in the cytoplasm). Orthologue-strength support.
      - source_id: UniProtKB:Q9Y615
        source_label: human ACTL7A (paralogue)
        source_status: SUPPORTS_TRANSFER
        comment: >-
          Paralogue with its own GO:0005737 IDA; adds no independent weight beyond the
          orthologue but is not misleading for a compartment this generic.
      - source_id: MGI:MGI:1343051
        source_label: mouse Actl7a (paralogue)
        source_status: SUPPORTS_TRANSFER
        comment: Own EXP and IDA for cytoplasm (PMID:12672658, PMID:21278383, PMID:36734600).
      - source_id: RGD:1304697
        source_label: rat Actl7a (Q641W9, paralogue)
        source_status: SUPPORTS_TRANSFER
        comment: Swiss-Prot, own EXP for cytoplasm.
      - source_id: PANTHER:PTN001377938
        source_label: ACTL7-clade PANTHER node (taxon constraint 32524)
        source_status: SUPPORTS_TRANSFER
        comment: >-
          Clade-restricted node holding GO:0005737 by IBD from the four ACTL7 seeds, the
          right granularity for this family, in contrast to the pan-eukaryotic node used for
          the nucleus row.
    supported_by:
    - reference_id: PMID:12672658
      supporting_text: the cellular locations of these two proteins are quite different (T-ACTIN-1
        was found in the cytoplasm and T-ACTIN-2 was located in the nucleus)
    - reference_id: PMID:37800308
      supporting_text: ACTL7B is detected in the cytoplasm and at lesser amounts in the nucleus
        of round and elongating spermatids
- term:
    id: GO:0005198
    label: structural molecule activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: >-
      The WITH/FROM field contains no proteins, only two PANTHER tree nodes, so the row
      cannot be judged without opening the PAINT table for PTHR11937. Doing so is what makes
      this row informative. Node PTN000940351 carries GO:0005200 "structural constituent of
      cytoskeleton" by IBD, seeded from ten resolved proteins: conventional actins (human
      ACTB, mouse and rat cytoplasmic actin 2, yeast ACT1, two Dictyostelium actins), the
