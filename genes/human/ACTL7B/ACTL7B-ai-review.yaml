  - Schorle H
  - Witke W
- question: Does ACTL7B associate with F-actin at all? It has lost the polymerisation
    interface, but the paralogue ACTL7A is reported to support subacrosomal F-actin,
    so the two paralogues may differ on exactly this point. A direct actin-binding
    measurement would settle whether any actin-related GO term belongs on ACTL7B.
  experts:
