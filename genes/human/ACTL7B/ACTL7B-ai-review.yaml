      structure: the actin filament interface is not conserved in ACTL7B (26 of 74 contact
      positions identical, 34 non-conservative changes, the D-loop segment 38-45 entirely
      replaced), so ACTL7B is not a filament-forming actin and cannot be assigned the
      constituent term on fold grounds.
