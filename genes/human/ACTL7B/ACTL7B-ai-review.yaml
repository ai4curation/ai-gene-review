suggested_experiments:
- hypothesis: ACTL7B has retained enough of the actin nucleotide pocket to bind ATP or
    ADP, or alternatively has joined the nuclear ARPs in losing nucleotide binding
    altogether.
  description: Measure nucleotide binding and hydrolysis on recombinant human ACTL7B,
    using isothermal titration calorimetry or fluorescent nucleotide exchange for binding
    and a phosphate-release assay for hydrolysis, with an Arp2/3 subunit as a positive
    comparator and a nuclear ARP as a negative one. This is the cheapest experiment that
    would resolve the largest ontological ambiguity about the family, since it determines
    whether nucleotide-binding molecular function terms could ever apply.
  experiment_type: biophysical nucleotide binding and ATPase assay
- hypothesis: ACTL7B cannot polymerise or co-assemble into actin filaments, because the
    D-loop and the wider protomer-protomer interface are not conserved.
  description: Test polymerisation and actin co-assembly directly with pyrene-actin
    polymerisation in the presence of ACTL7B, sedimentation of ACTL7B with F-actin, and
    a chimera in which the ACTL7B segment corresponding to actin 38-45 is replaced by the
    actin D-loop, to ask whether the interface is the reason for any negative result.
  experiment_type: in vitro polymerisation and co-sedimentation
- hypothesis: The ACTL7B-DYNLL1/DYNLL2 interaction is direct and is the proximate cause
    of the spermatid phenotype, rather than a downstream consequence of spermatid collapse.
  description: Map the interaction with recombinant pull-downs to establish directness,
    mutate the candidate LC8-binding motif in ACTL7B, and generate a knock-in mouse
    carrying that separation-of-function mutation to ask whether loss of light-chain
    binding alone reproduces the null phenotype.
  experiment_type: interaction mapping plus separation-of-function knock-in mouse
- hypothesis: Nuclear ACTL7B occupies an actin-related-protein subunit position in
    INO80 or SWI/SNF-family nucleosome remodellers, while cytoplasmic ACTL7B works with
    dynein light chains and acrosomal partners.
  description: Immunoprecipitate ACTL7B separately from purified spermatid nuclei and
    from cytoplasmic fractions and identify partners by mass spectrometry, to test the
    ARP-substitution hypothesis and to find the structural partners in the acrosome and
    head-tail coupling region. Compartment-resolved interactomes are needed because the
    two pools are predicted to have different partners.
  experiment_type: compartment-resolved immunoprecipitation mass spectrometry
- hypothesis: Loss-of-function variants in human ACTL7B cause oligoteratozoospermia and
    multiple morphological abnormalities of the flagellum, as they do in mouse.
  description: Screen ACTL7B in cohorts of men with idiopathic oligoteratozoospermia and
    multiple morphological abnormalities of the flagellum, and stain human spermatids for
    ACTL7B, to replace the current inference-only annotation set with human evidence.
  experiment_type: human genetics cohort screen with immunohistochemistry
- hypothesis: ACTL7A and ACTL7B are not functionally interchangeable, despite sharing
    around 59% sequence identity and a common ancestor.
  description: Test whether spermatid-expressed ACTL7A rescues the Actl7b-null phenotype,
    and the converse. The paralogues differ in expression breadth, compartment and
    phenotype, and four of the eight protein-level WITH/FROM tokens behind ACTL7B's
    cellular component annotations are ACTL7A orthologues, so a rescue experiment would
    tell curators whether such transfers are ever safe.
  experiment_type: transgenic cross-rescue in mouse
