    reason: >-
      Not demonstrably false, since a sperm cytoskeletal association may yet be found and
      the knockout phenotype is architectural, but as it stands the annotation asserts a
      compartment that no observation supports, derived from a by-similarity statement about
      an actin fold whose polymerisation surface ACTL7B has lost. Marked as over-annotated
      rather than removed because the term is broad enough that a future demonstration (for
      example in the perinuclear theca, as for ACTL7A) would rescue it. The informative and
      evidence-backed compartments are proposed as new annotations below.
