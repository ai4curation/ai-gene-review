      which is ancestral to ACTL7B, carries two annotations from that parent node: GO:0005198
      by IBA, and GO:0005200 as an IRD with negated=true. In other words the PAINT curators
      inspected this clade, explicitly refused to propagate the specific cytoskeletal
      constituent term into it, and let only the generic parent through.

