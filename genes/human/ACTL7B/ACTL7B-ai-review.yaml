  - gap_statement: >-
      What ACTL7B physically does to hold spermatid architecture together is unknown. No
      binding partner in the acrosome, acroplaxome or head-tail coupling region has been
      identified, no oligomeric state has been determined, and it is not known whether
      ACTL7B works as a monomer, a homo-oligomer, or a subunit of a larger assembly.
    boundary: >-
      That it is required is not in doubt: two independent null alleles give concordant
      structural phenotypes with a defined onset at spermiogenesis step 9. What is missing is
      the molecular interaction that underlies the requirement. The residue audit narrows the
      possibilities usefully, because the actin polymerisation interface is not conserved, so
      self-assembly into an actin-like filament is unlikely to be the mechanism.
