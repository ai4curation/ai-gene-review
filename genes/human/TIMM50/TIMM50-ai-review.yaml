- id: PMID:15044455
  title: Tim50, a component of the mitochondrial translocator, regulates mitochondrial integrity and cell
    death.
  findings:
  - statement: Human TIMM50 is a mitochondrial inner membrane protein, anchored by its N-terminal
      transmembrane segment with the CTD-like domain facing the intermembrane space.
    supporting_text: indicating that it is likely anchored to the inner mitochondrial membrane via its
      N-terminal TM domain
    reference_section_type: RESULTS
  - statement: TIMM50 co-immunoprecipitates with TIMM23 from HeLa mitochondria, the basis for naming it the
      human Tim50 ortholog.
    supporting_text: The 40 kDa protein coprecipitated with anti-Tim23 monoclonal antibody but not with the
      control T7 monoclonal antibody
    reference_section_type: RESULTS
  - statement: 'Phosphatase activity was assayed only with GST fusions purified from E. coli: full length and
      the C-terminal region (110-353) hydrolysed pNPP dose-dependently, the N-terminal fragment did not. No
      catalytic-site mutant was tested.'
    supporting_text: both the full-length human Tim50 and the isolated CTR (residues 110–353), but not the
      MTS (residues 1–50), catalyzed the conversion of pNPP to pNP and inorganic phosphate in a
      dose-dependent manner
    reference_section_type: RESULTS
  - statement: The activity had an acidic pH optimum (4.0-6.0) and fell sharply at basic pH.
    supporting_text: The human Tim50 phosphatase activity displayed a bell-shaped pH profile with an optimum
      activity around pH 4.0–6.0. Phosphatase activity declined sharply at basic pH
    reference_section_type: RESULTS
  - statement: The fusions also dephosphorylated phosphotyrosine peptides and, more weakly, a
      phosphothreonine peptide.
    supporting_text: Human Tim50 and its isolated CTR also exhibited activity toward Ser/Thr(P)-peptide
      RRA(pT)VA
    reference_section_type: RESULTS
  - statement: No physiological substrate was identified; the authors only speculate about Bcl-2 family
      proteins, and note that yeast Tim50 lacks the activity.
    supporting_text: It is tempting to speculate that in addition to its translocase activity, human Tim50
      might also function as a phosphatase for certain mitochondrial proteins
    reference_section_type: DISCUSSION
  - statement: TIMM50 was first isolated in a yeast two-hybrid screen with the DR5 death domain, but no
      interaction between the endogenous proteins could be detected; the paper does not concern
      interleukin-2 receptor.
    supporting_text: subsequent co-immunoprecipitation assays with extracts from several human cell lines
      before or after stimulation with TRAIL failed to detect any interactions between the endogenous 40
      kDa protein and endogenous DR4 or DR5
    reference_section_type: RESULTS
  - statement: siRNA depletion of TIMM50 sensitized human cells to UV- and staurosporine-induced cytochrome c
      release and apoptosis, and zebrafish morphants showed neurodegeneration and cell death.
    supporting_text: and apoptosis in human Tim50-depleted cells compared with control cells
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read from the publisher PDF supplied by the curator (CC BY) and cached on
      2026-10-10. The identifier resolves to the intended paper. The paper supports the mitochondrial inner
      membrane location, the TIM23 association and the depletion phenotypes. Its phosphatase evidence is a
      single in vitro assay without a catalytic-site mutant, and it contains no interleukin-2 receptor work.
