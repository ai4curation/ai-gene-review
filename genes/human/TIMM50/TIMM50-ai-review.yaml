- term:
    id: GO:0004722
    label: protein serine/threonine phosphatase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  review:
    summary: Human TIMM50 was reported to hydrolyse pNPP and phosphotyrosine and phosphothreonine peptides
      in vitro (Guo et al. 2004). The full text shows this rests on one assay of GST fusions purified from
      E. coli, with no catalytic-site mutant and no physiological substrate. TIMM50 lacks the catalytic
      motif of FCP/SCP phosphatases, and its established role is TIM23 presequence receptor/gatekeeper.
    action: MARK_AS_OVER_ANNOTATED
    additional_reference_ids:
    - file:human/TIMM50/TIMM50-deep-research-falcon.md
    - PMID:15044455
    reason: >-
      The reported activity is a real in vitro observation, so the annotation is not plainly wrong, but it
      is weak evidence that phosphatase activity is a function of this protein. (1) The assay used GST
      fusions purified from E. coli; the controls were GST alone and the N-terminal targeting fragment, and
      no catalytic-residue mutant was tested, so a co-purifying bacterial phosphatase is not excluded. (2)
      Activity peaked at pH 4.0-6.0 and declined sharply at basic pH. (3) No physiological substrate was
      shown; dephosphorylation of Bcl-2 family proteins is offered in the Discussion only as speculation.
      (4) The CTD-like domain lacks the D-x-D-x-(T/V) catalytic motif of FCP/SCP phosphatases (sequence
      scan of Q3ZCQ8, 2026-10-10), and the authors note that yeast Tim50 lacks the activity. PAINT blocks
      the ancestral phosphatase IBD for the whole Tim50 clade, and the PTHR12210 family review judges that
      block LOSS_SUPPORTED. UniProt likewise says the activity may not be relevant in vivo.
    supported_by:
    - reference_id: PMID:15044455
      supporting_text: To test this possibility we expressed N-terminal GST-tagged full-length or truncated
        human Tim50 in bacteria
    - reference_id: PMID:15044455
      supporting_text: The human Tim50 phosphatase activity displayed a bell-shaped pH profile with an optimum
        activity around pH 4.0–6.0. Phosphatase activity declined sharply at basic pH
    - reference_id: PMID:15044455
      supporting_text: It is tempting to speculate that in addition to its translocase activity, human Tim50
        might also function as a phosphatase for certain mitochondrial proteins
    - reference_id: PMID:15044455
      supporting_text: while yeast Tim50 was reported not to have such an activity
    - reference_id: file:human/TIMM50/TIMM50-deep-research-falcon.md
      supporting_text: Therefore, based on available evidence, the primary validated function remains
        **protein import receptor/gating**, not a defined metabolic reaction with established substrates.
