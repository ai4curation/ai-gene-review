id: Q15120
gene_symbol: PDK3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'PDK3 is a mitochondrial matrix pyruvate dehydrogenase kinase with high activity when bound
  to the inner lipoyl domain of the PDC E2 core. It phosphorylates PDHA1 on serine residues to inhibit
  PDC and is a transcriptionally inducible PDK isoform in PPARbeta/delta, hypoxia/HIF1, butyrate, and
  melanoma metabolic settings.'
