    supporting_text: All four PDKs phosphorylated site 1 and site 2, however, with different rates
      in phosphate buffer
    reference_section_type: ABSTRACT
  - reference_id: file:human/PDK3/PDK3-uniprot.txt
    supporting_text: Mitochondrion matrix
suggested_questions:
- question: Which tissue- and signal-specific conditions make PDK3 the dominant PDK isoform
    controlling PDC rather than another PDK family member?
- question: Which additional substrates, if any, are phosphorylated by endogenous PDK3 at
    physiologic abundance in human cells?
suggested_experiments:
- description: Use endogenous PDK3 knockout/rescue or acute degron systems in a tissue-matched human
    cell type, followed by PDHA1 phosphosite quantification and isotope tracing from glucose to
    acetyl-CoA, to distinguish direct PDC control from transcriptional adaptation.
