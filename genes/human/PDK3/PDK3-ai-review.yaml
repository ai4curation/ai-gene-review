core_functions:
- description: Phosphorylates the pyruvate dehydrogenase E1 alpha subunit in the mitochondrial
    matrix, inhibiting PDC and limiting oxidative decarboxylation of pyruvate to acetyl-CoA.
  molecular_function:
    id: GO:0004740
    label: pyruvate dehydrogenase (acetyl-transferring) kinase activity
  directly_involved_in:
