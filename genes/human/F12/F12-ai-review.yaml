  review:
    summary: Activated FXII performs the prekallikrein-activation step of the plasma contact cascade.
    action: ACCEPT
    reason: The original PMID:18725990 Results and Methods show FXII-dependent conversion of prekallikrein
      to kallikrein with nonfibrillar protein aggregates and surface controls. Chromozym PK measures the
      downstream kallikrein, not direct FXII substrate turnover. Independent PMID:34967109 Methods 2.1
      and 2.7 explicitly use human FXIIa to activate human prekallikrein, then inhibit FXIIa before measuring
      generated kallikrein. This is an executed proteolytic step of the cascade, not participation inferred
      solely from FXII being activated.
