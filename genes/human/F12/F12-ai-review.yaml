  review:
    summary: Human Hageman factor supplies the active enzyme that initiates prekallikrein activation.
    action: ACCEPT
    reason: The complete PMID:6793628 original compares purified normal human plasma Hageman factor with
      the inactive Washington D.C. patient protein. After controlled trypsin activation and blockade of
      residual trypsin, normal factor generates prekallikrein-activator activity, whereas the abnormal
      factor does not (Methods, Tables II–III and Figures 4–6). These experiments support the cascade
      role of activated normal FXII; they do not imply that circulating zymogen or every variant is already
      catalytically active.
