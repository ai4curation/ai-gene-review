suggested_questions:
- question: Which combinations of FXII processing state, surface chemistry and contact cofactors determine
    whether activation generates kallikrein alone or also activates factor XI under physiological plasma
    conditions?
- question: What initiates FXII activity in surface-dependent reactions without prekallikrein, and how
    much is attributable to single-chain FXII activity versus amplification by small amounts of already
    processed FXIIa?
suggested_experiments:
- description: Compare sequence- and chain-verified human FXII, alpha-FXIIa and beta-FXIIa on defined
    polyphosphate, receptor-bearing endothelial surfaces and characterized nonfibrillar or fibrillar protein
    preparations. Measure FXI and prekallikrein cleavage separately, quantify the generated proteases
    after selectively stopping FXIIa, and follow clotting and bradykinin as distinct downstream endpoints.
    Control zinc, kininogen and active-site concentration, and include FXII-depleted plasma with matched
    add-back.
- description: Reconstitute surface-dependent activation with purified human single-chain FXII and no
    prekallikrein or other activating protease. Quantify trace processed FXIIa before incubation and follow
    both chain cleavage and active-site formation over time. Compare catalytic-site and cleavage-resistant
    variants with wild type, using separately tracked enzyme and substrate preparations and matched surface-free
    controls. Establish the detection limits for pre-existing FXIIa before assigning initiation to a particular
    molecular species.
