id: P00748
gene_symbol: F12
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: F12 encodes coagulation factor XII, a secreted plasma glycoprotein that circulates as a zymogen.
  Its activated serine protease, factor XIIa, cleaves factor XI and prekallikrein to generate factor XIa
  and plasma kallikrein. These reactions connect contact-initiated intrinsic coagulation with the kallikrein-kinin
  system, in which kallikrein subsequently releases bradykinin from kininogen. Surface association promotes
  factor XII activation, including autocatalytic amplification and reciprocal activation by kallikrein.
  The alpha and beta forms arise through proteolytic processing and differ in surface association and
  substrate responses. Contact reactions occur in extracellular fluid and at external cell surfaces; the
  activating surface and protein assembly influence whether kallikrein generation is coupled to factor
  XI activation.
