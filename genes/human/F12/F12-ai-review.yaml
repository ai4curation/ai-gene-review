core_functions:
- description: Factor XIIa catalyzes internal peptide-bond cleavage that activates factor XI and prekallikrein.
    This protease activity performs zymogen activation in intrinsic coagulation and the kallikrein-kinin
    system; kallikrein, rather than factor XIIa, performs the downstream kininogen cleavage that releases
    bradykinin. The same catalytic system supports surface-dependent FXII autoactivation. Human functional
    assays distinguish FXII-only activation from reactions reporting generated FXIa or kallikrein. Activity
    is organized in extracellular fluid and peripheral cell-surface contact assemblies; processed forms
    and activating surfaces are not assumed to produce identical substrate responses.
