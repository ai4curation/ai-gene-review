core_functions:
- description: CLN5 catalyzes lipid transacylation that produces BMP in the lysosomal compartment and
    contributes to lysosomal lipid homeostasis. Its measured BMP products and cellular contribution depend
    on substrate stereochemistry and lipid supply; this capacity is distinct from the PLD3/4 reaction
    producing S,S-BMP. The glycosylated protein is processed through the secretory pathway and can associate
    with the luminal lysosomal membrane.
  molecular_function:
    id: GO:0160121
    label: bis(monoacylglycero)phosphate synthase activity
  locations:
  - id: GO:0043202
    label: lysosomal lumen
  - id: GO:0005765
    label: lysosomal membrane
  supported_by:
  - reference_id: PMID:37708259
  - reference_id: PMID:39423811
  - reference_id: PMID:39548099
  - reference_id: PMID:24038957
  - reference_id: PMID:24058541
suggested_questions:
- question: Which BMP stereoisomers does endogenous human CLN5 produce, and how should the inconsistent
    GO:0160121 and RHEA:77619 glycerol numbering be reconciled?
- question: What natural protein or lipid substrates account for the measured synthetic-probe thioesterase
    activity, and which original experiment supports the acyl-CoA-specific annotations?
- question: Which glycosyl-bond substrate and purification controls underlie the reported human and Dictyostelium
    CLN5 glycosidase activity?
- question: How does luminal CLN5 affect cytosolic Rab7 activation and retromer recruitment, and is the
    connection mediated by another membrane protein?
- question: Which assays in the original maturation study distinguish CLN5 being processed from CLN5 performing
    a maturation step on another protein?
- question: Does the original CLN5 mannose-6-phosphate affinity study contain any direct CLN5 sugar-recognition
    experiment beyond capture of its covalent glycans by the receptor?
suggested_experiments:
- description: Compare sequence-defined purified human CLN5 with PLD3 and PLD4 using stereochemically
    resolved LPG and BMP standards, alongside inactive mutants and matched enzyme-free controls.
- description: Test candidate natural palmitoylated substrates and acyl-CoA species directly with purified
    CLN5, separating thioester cleavage from any auxiliary glucosidase reaction.
- description: Measure Rab7 loading and receptor recycling after endogenous CLN5 rescue with catalytically
    inactive but normally localized variants, while testing candidate transmembrane intermediates.
