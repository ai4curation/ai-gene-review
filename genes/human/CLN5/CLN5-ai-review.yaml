id: O75503
gene_symbol: CLN5
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CLN5 is a glycosylated lysosomal lipid enzyme that promotes bis(monoacylglycero)phosphate
  (BMP) formation and has cysteine-dependent palmitoyl-thioester hydrolase activity. Its endogenous thioester
  substrates remain unidentified, and its contribution to cellular BMP pools depends on the extracellular
  lipid environment and other lysosomal enzymes. CLN5 passes through the secretory pathway as a processed
  precursor and occupies the lysosomal lumen and luminal membrane surface. Cellular studies connect it
  to Rab7 activation and retromer-dependent recycling of lysosomal sorting receptors. Loss of CLN5 causes
  a neuronal ceroid lipofuscinosis with progressive neurodegeneration.
