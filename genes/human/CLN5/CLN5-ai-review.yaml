- term:
    id: GO:0007042
    label: lysosomal lumen acidification
  evidence_type: IMP
  original_reference_id: PMID:11722572
  qualifier: involved_in
  review:
    summary: The patient-cell pH effect is established, but CLN5 acidification participation remains unresolved.
    action: UNDECIDED
    reason: 'The recovered original Methods, Table 1 and Results measure lysosomal pH in one CLN5 patient
      fibroblast line carrying the homozygous 2467(AT) deletion: 4.64 ± 0.18 versus 4.02 ± 0.06 in the
      control, with normal cytoplasmic pH. This is positive evidence for a genotype-associated lysosomal
      pH defect. However, the Discussion explicitly leaves direct and indirect mechanisms open; it does
      not establish that CLN5 itself performs a lysosomal pH-lowering step. Keep the source-specific participation
      assertion unresolved rather than assuming either direct involvement or a demonstrated downstream
      consequence. Unlike the maturation experiments, this assay does not resolve which entity performs
      the relevant step.'
    supported_by:
    - reference_id: PMID:11722572
