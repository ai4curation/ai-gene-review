knowledge_gaps:
- gap_statement: ANKDD1B's location, binding partners and function are unknown.
  boundary: Only domain content (ankyrin repeats and a death domain) and tissue expression are known.
    PANTHER family PTHR24125 has no PTN nodes carrying PAINT annotations, and none of its representative
    members checked in QuickGO has an experimental GO annotation, so phylogenetic propagation has no donor
    to draw on.
