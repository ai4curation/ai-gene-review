    id: GO:0007165
    label: signal transduction
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR000488
  review:
    summary: Signal transduction (InterPro IEA from the death domain). A generic domain-based inference
      with no supporting data; over-annotated.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'ANKDD1B has a C-terminal death domain [file:human/ANKDD1B/ANKDD1B-uniprot.txt "CDD; cd01670;
      Death; 1."], a fold that mediates homotypic interactions in apoptotic and inflammatory signaling,
      and InterPro2GO maps it to signal transduction. ANKDD1B is uncharacterized: UniProt classes its
      existence as predicted [file:human/ANKDD1B/ANKDD1B-uniprot.txt "PE   4: Predicted;"], Pharos as
      [file:human/ANKDD1B/ANKDD1B-uniprot.txt "DR   Pharos; A6NHY2; Tdark."], and PAN-GO assigns it [file:human/ANKDD1B/ANKDD1B-uniprot.txt
      "DR   PAN-GO; A6NHY2; 0 GO annotations based on evolutionary models."]. The deep-research provider
      likewise found no mechanistic literature [file:human/ANKDD1B/ANKDD1B-deep-research-affinage.md "No
      mechanistic discoveries found in literature."]. This is a gene-level judgment that the term is unearned
      for an uncharacterized protein. It does not challenge the InterPro2GO mapping itself, which this
      repository accepts as broad but correct for characterized death-domain receptors such as FAS and
      TNFRSF1A.'
    supported_by:
    - reference_id: file:human/ANKDD1B/ANKDD1B-uniprot.txt
      supporting_text: CDD; cd01670; Death; 1.
    - reference_id: file:human/ANKDD1B/ANKDD1B-uniprot.txt
      supporting_text: 'PE   4: Predicted;'
    - reference_id: file:human/ANKDD1B/ANKDD1B-uniprot.txt
      supporting_text: DR   Pharos; A6NHY2; Tdark.
    - reference_id: file:human/ANKDD1B/ANKDD1B-uniprot.txt
      supporting_text: DR   PAN-GO; A6NHY2; 0 GO annotations based on evolutionary models.
    - reference_id: file:human/ANKDD1B/ANKDD1B-deep-research-affinage.md
      supporting_text: No mechanistic discoveries found in literature.
