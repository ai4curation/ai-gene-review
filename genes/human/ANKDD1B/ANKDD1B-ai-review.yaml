suggested_questions:
- question: Does ANKDD1B share its paralog ANKDD1A's reported interaction with the asparaginyl hydroxylase
    FIH1 (PMID:30082910), and is its death domain used for homotypic signaling interactions?
suggested_experiments:
- description: Identify ANKDD1B partners by proximity labeling, test FIH1 binding and ankyrin-repeat hydroxylation,
    and localize tagged ANKDD1B.
