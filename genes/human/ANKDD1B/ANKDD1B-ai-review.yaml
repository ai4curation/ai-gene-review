description: ANKDD1B (ankyrin repeat and death domain-containing 1B) is an uncharacterized 528-residue
  protein with ten ankyrin repeats and a C-terminal death domain. It is a paralog of ANKDD1A. No experimental
  study of its location, partners or function has been reported.
