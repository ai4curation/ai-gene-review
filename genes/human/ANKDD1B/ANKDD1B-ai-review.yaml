  review:
    summary: Signal transduction (InterPro IEA from the death domain). A generic domain-based inference
      with no supporting data; over-annotated.
    action: MARK_AS_OVER_ANNOTATED
    reason: ANKDD1B has a C-terminal death domain [file:genes/human/ANKDD1B/ANKDD1B-uniprot.txt "CDD;
      cd01670; Death; 1."], a fold that mediates homotypic interactions in apoptotic and inflammatory
      signaling, and InterPro2GO maps it to signal transduction. No study of ANKDD1B function exists [file:genes/human/ANKDD1B/ANKDD1B-deep-research-affinage.md
      "No mechanistic discoveries found in literature."], so the term is a domain-level guess rather than
      a characterized role.
    supported_by:
    - reference_id: file:genes/human/ANKDD1B/ANKDD1B-uniprot.txt
