suggested_questions:
- question: Which physiological RNA targets and binding surface account for the human ANKS6 FLASH signal,
    and how does this activity relate to ANKS3-BICC1 assemblies?
- question: Can purified human ANKS6 and NEK8 reconstitute activation, and which structural contacts distinguish
    binding, ciliary recruitment and catalytic stimulation?
- question: Which source-specific constructs and assay results support the unresolved DCAF7 and HuRI interaction
    rows?
- question: Does the ANKS6-YAP association directly stabilize YAP in human biliary cells, and how does
    that mechanism relate to the ciliary complex?
suggested_experiments:
- description: Reconstitute purified human ANKS6-NEK8 complexes and measure kinase activity with inactive-kinase,
    ANK-repeat and SAM-domain controls.
- description: Map RNA contacts in endogenous human ANKS6 using orthogonal crosslinking and domain mutants,
    with matched protein abundance and nonspecific-binding controls.
- description: Separate ciliary complex assembly from YAP regulation using compartment-specific rescue
    constructs in human cholangiocyte models.
