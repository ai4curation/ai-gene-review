    - reference_id: PMID:25599650
      supporting_text: a functional activator of NEK8 as a kinase
      full_text_unavailable: false
- term:
    id: GO:0003723
    label: RNA binding
  evidence_type: IDA
  original_reference_id: PMID:32994509
  qualifier: enables
  review:
    summary: Human ANKS6 binds RNA in a UV-crosslinking assay.
    action: NEW
    reason: The targeted FLASH comparison explicitly used hANKS6 in inducible Flp-In T-REx 293 cells,
      with a C-terminal 3xFLAG-HBH tag. UV-C crosslinking, successive affinity purifications and high-salt
      washes identified ANKS6-associated RNAs across at least eight experiments, with ARL13B and BBS3
      controls. This directly supports RNA binding; it does not establish a specific RNA-processing reaction
      or physiological target set. The Results and Discussion differ in their qualitative description
      of AGO2-mRNA binding, so no affinity claim is made. This activity is not promoted to a core function
      because its physiological contribution remains unresolved.
    supported_by:
    - reference_id: PMID:32994509
      supporting_text: 524 RNA molecules for ANKS6
      full_text_unavailable: false
