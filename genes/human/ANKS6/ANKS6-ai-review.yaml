    reason: In PMID:23793029, Anks6 associates with NEK8, INVS and NPHP3, increases recovery of INVS with
      NEK8, and enables NPHP3 to co-precipitate with NEK8. This is an assembly role that holds components
      together, beyond detection of an isolated binding pair. The published Figure 3b legend and adjoining
      Results identify rat Anks6 in this construct series; the human-host experiments are therefore represented
      as an ISS inference to human ANKS6, with rat P0C0T2 as the supporting entity. Human SAM-domain binding
      and later ANKS3-containing complex studies corroborate conserved interaction architecture but do
