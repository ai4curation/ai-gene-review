  review:
    summary: The named interaction partner NEK8 is a protein kinase.
    action: MODIFY
    reason: Figure 3C of this source, PMID:26967905, assays GFP-NEK8 and Flag-ANKS6 co-immunoprecipitation
      in HEK293T cells and shows reduced association for NEK8 p.T87A. NEK8 is a protein kinase, making
      protein kinase binding more informative than generic binding. The Methods identify human NEK8 constructs;
      the ANKS6 construct species was not resolved from the retrieved Methods, and the human host does
      not settle that question. This interaction experiment is distinct from the source's patient-fibroblast
      localization and YAP phenotypes and does not itself demonstrate kinase activation.
    proposed_replacement_terms:
