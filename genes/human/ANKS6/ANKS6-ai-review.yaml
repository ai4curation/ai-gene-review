core_functions:
- description: Organizes ciliary and cytoplasmic protein complexes through ANK-repeat and SAM-domain interactions.
    It links the NEK8-INVS-NPHP3 module and remodels ANKS3-containing assemblies; ANKS6 is not itself
    a SAM homopolymer and BICC1 recruitment is mediated by ANKS3. Whole-protein functional experiments
    and isolated human-domain experiments have different species and construct scopes.
  molecular_function:
    id: GO:0140378
    label: protein complex scaffold activity
  locations:
  - id: GO:0097543
    label: ciliary inversin compartment
  - id: GO:0005737
    label: cytoplasm
  supported_by:
  - reference_id: PMID:23793029
    supporting_text: organize its assembly by linking INVS and NPHP3 to NEK8
    full_text_unavailable: false
  - reference_id: PMID:24998259
    supporting_text: ANKS6-SAM appears monomeric, ANKS3-SAM appears weakly polymeric
    full_text_unavailable: false
  - reference_id: PMID:29290488
    supporting_text: ANKS6 recruitment alters the topology of macromolecular Bicc1-ANKS3 complexes
    full_text_unavailable: false
  - reference_id: PMID:37733651
    supporting_text: ANKS6 cooperates with the ANKS3 Nter to dislodge the ANKS3 Cter from Bicc1 KH domains
    full_text_unavailable: false
- description: Promotes NEK8 kinase activation through an ANK-repeat-dependent interaction. The functional
    biochemical evidence uses rat Anks6 and mouse Nek8 in immunoprecipitated complexes, supporting a conserved
    human function rather than a purified human reconstitution. NEK8 helps recruit ANKS6 to the ciliary
    compartment; ANKS6 is not an intrinsic kinase.
  molecular_function:
    id: GO:0030295
    label: protein kinase activator activity
