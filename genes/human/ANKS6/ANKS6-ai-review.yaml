id: Q68DC2
gene_symbol: ANKS6
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ANKS6 is an ankyrin-repeat and sterile alpha motif protein that organizes protein assemblies
  in the proximal ciliary inversin compartment and cytoplasm. It links components of a nephronophthisis-associated
  complex containing NEK8, INVS and NPHP3, and its SAM domain binds ANKS3. Biochemical work with mammalian
  orthologs supports NEK8 activation and remodeling of ANKS3-containing BICC1 complexes. Human ANKS6 also
  displays RNA-binding activity, while studies in liver models connect ANKS6 to YAP abundance and transcriptional
  output. Biallelic variants cause nephronophthisis with variable laterality, cardiac and hepatobiliary
  abnormalities.
existing_annotations:
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:24998259
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q6ZW76
  review:
    summary: ANKS3 association contributes to organization of multiprotein complexes.
    action: MODIFY
    reason: The source partner is ANKS3. Human isolated SAM-domain experiments in PMID:24998259 establish
      heterointeraction, with monomeric ANKS6-SAM capping ANKS3 polymers. Assembly experiments in PMID:23793029
      and heterocomplex studies in PMID:29290488 and PMID:37733651 provide the additional mechanistic
      basis for scaffold activity. Whole-protein experiments include rodent constructs, whereas the isolated-domain
      work explicitly uses human sequences. The source interaction screens do not themselves establish
      this mechanism, ANKS6 self-polymerization or direct BICC1 binding.
    proposed_replacement_terms:
    - id: GO:0140378
      label: protein complex scaffold activity
    supported_by:
    - reference_id: PMID:23793029
      supporting_text: organize its assembly by linking INVS and NPHP3 to NEK8
      full_text_unavailable: false
    - reference_id: PMID:24998259
      supporting_text: ANKS6-SAM appears monomeric, ANKS3-SAM appears weakly polymeric
      full_text_unavailable: false
    - reference_id: PMID:29290488
      supporting_text: ANKS6 recruitment alters the topology of macromolecular Bicc1-ANKS3 complexes
      full_text_unavailable: false
    - reference_id: PMID:37733651
      supporting_text: ANKS6 cooperates with the ANKS3 Nter to dislodge the ANKS3 Cter from Bicc1 KH domains
      full_text_unavailable: false
    additional_reference_ids:
    - PMID:24998259
    - PMID:23793029
    - PMID:29290488
    - PMID:37733651
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:26638075
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q86SG6
  review:
    summary: The named interaction partner NEK8 is a protein kinase.
    action: MODIFY
    reason: The source partner is NEK8. Independent domain-mapping and co-immunoprecipitation experiments
      in PMID:23793029, PMID:25599650 and figure 3 of PMID:26967905 substantiate the partner-class refinement.
      Rodent constructs and human host-cell assays are distinguished; the original interaction screen
      is not treated as an activation assay, and uninspected pair tables are not claimed read. NEK8 helps
      recruit ANKS6 to cilia, correcting the reversed recruitment mechanism in the earlier review.
    proposed_replacement_terms:
