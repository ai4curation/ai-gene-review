- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:24998259
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q6ZW76
  review:
    summary: Isolated human ANKS6 and ANKS3 SAM domains bind directly.
    action: MODIFY
    reason: PMID:24998259 directly characterizes binding of the human ANKS6 SAM domain to the human
      ANKS3 SAM domain by native gels and interface mutations, supporting the specific SAM domain binding
      term. The affinity and heterocomplex structure experiments use the ANKS3 I36E variant to suppress
      ANKS3 polymerization while retaining the heterointerface. These two-domain experiments do not by
      themselves establish a multiprotein scaffold; that activity has separate assembly evidence in
      PMID:23793029. The isolated ANKS6 SAM domain appears monomeric under the tested conditions,
      which does not determine the oligomeric state of full-length ANKS6 or imply binding to every SAM domain.
    proposed_replacement_terms:
    - id: GO:0032093
      label: SAM domain binding
    supported_by:
    - reference_id: PMID:24998259
      supporting_text: The EH-surface of ANKS3-SAM binds the ML-surface of ANKS6-SAM
      full_text_unavailable: false
    additional_reference_ids:
    - PMID:23793029
