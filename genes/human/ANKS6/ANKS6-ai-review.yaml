id: Q68DC2
gene_symbol: ANKS6
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ANKS6 is an ankyrin-repeat and sterile alpha motif protein that organizes protein assemblies
  in the proximal ciliary inversin compartment and cytoplasm. It links NEK8, INVS and NPHP3 in a nephronophthisis-associated
  complex and promotes NEK8 kinase activation. Its SAM domain binds ANKS3 and helps remodel ANKS3-containing
  BICC1 assemblies. ANKS6 also binds RNA, while its loss can impair YAP abundance and transcriptional
  output in biliary cells. Biallelic variants cause nephronophthisis with variable laterality, cardiac
  and hepatobiliary abnormalities.
