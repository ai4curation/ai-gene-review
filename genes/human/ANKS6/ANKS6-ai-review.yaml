    summary: A conserved NEK8-activating function is inferred from experimental rat Anks6 evidence.
    action: NEW
    reason: The original study coexpressed rat Anks6 and mouse Nek8 in human 293T cells. ANKS6-dependent
      autophosphorylation and phosphorylation of the added alpha-casein substrate, with inactive-kinase
      and domain controls, support activation. A purified assay could not be performed because the bacterial
      recombinant constructs were insoluble. The human assertion is therefore an ortholog-based ISS inference,
      with rat Anks6 P0C0T2 as the supporting entity, rather than a direct human IDA result. The conserved
      ANK-repeat interaction architecture and human ciliopathy context support this interpretation; no
      intrinsic kinase activity is assigned to ANKS6.
