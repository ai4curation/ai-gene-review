- term:
    id: GO:0001916
    label: positive regulation of T cell mediated cytotoxicity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:95896
  - MGI:MGI:95904
