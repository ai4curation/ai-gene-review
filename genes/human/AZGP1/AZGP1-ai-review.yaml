    summary: Immune response (IBA). This is propagated from classical and non-classical MHC class I antigen-presenting
      molecules. AZGP1 is a secreted MHC class I-like protein that has diverged from the antigen-presenting
      members of its family. It lacks a transmembrane anchor (signal peptide, soluble chain), does not
      bind beta2-microglobulin, and its groove holds a non-peptide hydrophobic ligand (fatty acids) rather
      than a peptide. None of the evidence reviewed here links AZGP1 to antigen presentation or T-cell
      recognition.
    action: REMOVE
    reason: '[PMID:10206894 "The 2.8 angstrom crystal structure of ZAG resembles a class I major histocompatibility
      complex (MHC) heavy chain, but ZAG does not bind the class I light chain beta2-microglobulin."]
      [PMID:10206894 "Instead of a peptide, the ZAG groove contains a nonpeptidic compound that may be
      implicated in lipid catabolism under normal or pathological conditions."] [PMID:11425849 "Here we
      show, using serum-derived and bacterial recombinant protein, that ZAG binds the fluorophore-tagged
      fatty acid 11-(dansylamino)undecanoic acid (DAUDA) and, by competition, natural fatty acids such
      as arachidonic, linolenic, eicosapentaenoic, and docosahexaenoic acids."]'
