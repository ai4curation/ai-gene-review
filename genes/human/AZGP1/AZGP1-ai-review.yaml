id: P25311
gene_symbol: AZGP1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: AZGP1 (zinc-alpha-2-glycoprotein, ZAG) is a secreted N-glycosylated glycoprotein of plasma,
  seminal plasma, saliva, sweat and other body fluids, produced by glandular epithelia, liver and adipocytes.
  It has an MHC class I heavy-chain fold but does not bind beta2-microglobulin. Its alpha1-alpha2 groove
  binds hydrophobic ligands such as polyunsaturated fatty acids instead of peptides. ZAG acts as a lipid-mobilizing
  adipokine. It binds beta3- and beta2-adrenergic receptors, raising cAMP, and stimulates lipolysis in
  adipocytes. It contributes to fat loss in cancer cachexia and to energy homeostasis. In seminal plasma
  it forms a complex with prolactin-inducible protein (PIP). It is also widely studied as a tumour-suppressive
  and anti-fibrotic factor in epithelial cancers and kidney.
