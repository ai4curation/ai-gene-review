  review:
    summary: Detection of chemical stimulus involved in sensory perception of bitter taste (IDA). The
      study correlated band intensities in infant saliva with acceptance of a bitter solution. A band
      containing ZAG, among several, predicted lower acceptance. This is a statistical association, not
      evidence that ZAG takes part in bitter-taste detection. A detection-of-chemical-stimulus term requires
      the gene product to detect the tastant, and the cited abstract states only the correlation. Removed.
