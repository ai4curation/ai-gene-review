proposed_new_terms: []
suggested_questions:
- question: Is there a functionally relevant intracellular AZGP1 pool (reported in hypothalamic POMC neurons,
    binding AGK), and how is it generated from a signal-peptide-bearing secreted protein?
- question: Does ZAG act as a true agonist (receptor ligand activity) at beta2/beta3-adrenergic receptors
    in native adipocytes, beyond binding and the cAMP rise seen in transfected cells?
- question: Is the physiological groove ligand of ZAG a fatty acid, and does ligand occupancy affect beta-adrenergic
    receptor engagement or lipolytic activity?
- question: Does ZAG act directly on beta-adrenergic receptors in human adipocytes, as in transfected
    CHO cells, or through a co-receptor?
suggested_experiments:
- description: Use groove mutants that abolish fatty-acid binding to test whether ligand loading is needed
    for beta3-AR binding, cAMP signalling and lipolysis in human adipocytes.
