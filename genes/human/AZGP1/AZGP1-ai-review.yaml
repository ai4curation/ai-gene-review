  review:
    summary: RNA nuclease activity (NAS). A 1999 study reports that native and recombinant ZAG have RNase
      activity, and no corroborating study was found in this review. ZAG has an MHC class I fold with
      no recognizable nuclease domain, and the cached abstract gives no assay details. Undecided.
