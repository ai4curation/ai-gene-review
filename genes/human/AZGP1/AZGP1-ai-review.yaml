- id: PMID:22227600
  title: Role of β-adrenergic receptors in the anti-obesity and anti-diabetic effects of zinc-α2-glycoprotien
    (ZAG).
  findings:
  - statement: ZAG binds beta3-AR and beta2-AR, not beta1-AR.
    supporting_text: 'RESULTS: ZAG bound to the β3-AR with higher affinity (Kd 46±1nM) than the β2-AR
      (Kd 71±3nM) while there was no binding to the β1-AR, and this correlated with the increases in cyclic
      AMP in CHO-K1 cells transfected with the various β-AR and treated with ZAG.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only; binding and cAMP in transfected CHO-K1, with ob/ob mouse pharmacology.
  full_text_unavailable: true
