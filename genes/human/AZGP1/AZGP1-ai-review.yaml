- term:
    id: GO:0005504
    label: fatty acid binding
  evidence_type: IDA
  original_reference_id: PMID:11425849
  qualifier: enables
  review:
    summary: Fatty acid binding (NEW, IDA). Serum-derived and recombinant ZAG bind the fluorescent fatty
      acid DAUDA with micromolar affinity, and natural polyunsaturated fatty acids (arachidonic, linolenic,
      EPA, DHA) compete for it. Ligand binding stabilizes the protein. Crystallography places the hydrophobic
      ligand site in the MHC-like groove. The groove ligand in deposited structures is PEG, which displaces
      the fatty acid from the same site. This is AZGP1's best-defined molecular activity.
    action: NEW
    reason: '[PMID:11425849 "Here we show, using serum-derived and bacterial recombinant protein, that
      ZAG binds the fluorophore-tagged fatty acid 11-(dansylamino)undecanoic acid (DAUDA) and, by competition,
      natural fatty acids such as arachidonic, linolenic, eicosapentaenoic, and docosahexaenoic acids."]
      [PMID:11425849 "Fluorescence and isothermal calorimetry analysis showed that ZAG binds DAUDA with
      K(d) in the micromolar range, and differential scanning calorimetry showed that ligand binding increases
      the thermal stability of the protein."] [PMID:15477100 "Further support for PEG binding in the ZAG
      groove is provided by the finding that PEG displaces a fluorophore-tagged fatty acid from the ZAG
      binding site."]'
    supported_by:
