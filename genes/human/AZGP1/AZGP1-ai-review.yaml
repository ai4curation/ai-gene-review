- id: PMID:11425849
  title: Hydrophobic ligand binding by Zn-alpha 2-glycoprotein, a soluble fat-depleting factor related
    to major histocompatibility complex proteins.
  findings:
  - statement: ZAG binds DAUDA and natural PUFAs with micromolar affinity.
    supporting_text: Here we show, using serum-derived and bacterial recombinant protein, that ZAG binds
      the fluorophore-tagged fatty acid 11-(dansylamino)undecanoic acid (DAUDA) and, by competition, natural
      fatty acids such as arachidonic, linolenic, eicosapentaenoic, and docosahexaenoic acids.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only; serum and recombinant protein binding assays.
  full_text_unavailable: true
