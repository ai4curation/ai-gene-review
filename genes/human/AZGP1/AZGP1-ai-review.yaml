        implicated in lipid catabolism under normal or pathological conditions.
    - reference_id: PMID:11425849
      supporting_text: Here we show, using serum-derived and bacterial recombinant protein, that ZAG binds
        the fluorophore-tagged fatty acid 11-(dansylamino)undecanoic acid (DAUDA) and, by competition,
        natural fatty acids such as arachidonic, linolenic, eicosapentaenoic, and docosahexaenoic acids.
