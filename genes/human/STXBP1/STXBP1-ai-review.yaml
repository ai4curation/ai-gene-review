- id: PMID:10657302
  title: Synaptic assembly of the brain in the absence of neurotransmitter secretion.
  findings:
  - statement: Munc18-1 knockout mice lose all synaptic vesicle secretion but assemble a normally wired brain.
    supporting_text: Deletion of a single protein, Munc18-1, in mice leads to a complete loss of
      neurotransmitter secretion from synaptic vesicles throughout development.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Mouse knockout establishing that Munc18-1 is essential for release.
- id: PMID:11545717
  title: Munc18-1 promotes large dense-core vesicle docking.
  findings:
