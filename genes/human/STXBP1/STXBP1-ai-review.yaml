id: P61764
gene_symbol: STXBP1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'STXBP1 encodes Munc18-1 (nSec1, Unc-18A), the neuronal member of the Sec1/Munc18 (SM) protein family.
  It is a soluble ~67 kDa arch-shaped protein that is cytosolic and peripherally associated with the cytoplasmic
  face of the plasma membrane, concentrated in presynaptic terminals of neurons and present in neuroendocrine cells.
  Munc18-1 binds the plasma-membrane SNARE syntaxin-1 in two modes: it clasps syntaxin-1 in its autoinhibited closed
  conformation, stabilizing it and gating its entry into SNARE complexes, and it binds the syntaxin-1 N-terminal
  peptide and assembled SNARE complexes. Together with Munc13, which opens syntaxin-1, Munc18-1 acts as a template
  that brings syntaxin-1 and VAMP2/synaptobrevin together in register, nucleating NSF/alpha-SNAP-resistant trans-SNARE
  complex assembly and accelerating fusion of cognate SNAREs. Through these activities it is required for docking
  and priming of synaptic vesicles and dense-core vesicles and for essentially all neurotransmitter release; deletion
  in mice abolishes synaptic vesicle secretion. Its binding to syntaxin-1 is modulated by phosphorylation of syntaxin-1
  and of Munc18-1 itself. Munc18-1 also has reported roles in exocytosis in non-neuronal cells (sperm acrosome reaction,
  platelets) and has been described as a chaperone limiting alpha-synuclein aggregation. Heterozygous loss-of-function
  variants, many of which destabilize the protein, cause developmental and epileptic encephalopathy 4 (STXBP1 encephalopathy).'
