core_functions:
- description: Binds syntaxin-1 in its closed conformation and through its N-terminal peptide, and binds SNARE
    complexes containing open syntaxin-1; this binding stabilizes syntaxin-1, gates SNARE assembly, and keeps
    Munc18-1 engaged with the assembling fusion machinery.
