    supporting_text: Munc18-1 interacts with neuronal SNARE proteins in two distinct modes
  - reference_id: PMID:23057743
    supporting_text: Munc18-1 binds to an autoinhibitory closed conformation of syntaxin-1, gating formation
      of SNARE complexes, and also binds to SNARE complexes
  - reference_id: PMID:12730201
    supporting_text: significantly decreases syntaxin binding to Munc18-1, a syntaxin-binding protein that
      regulates SNARE complex formation and is required for synaptic vesicle docking
- description: Acts with Munc13 as a template that holds syntaxin-1 and VAMP2/synaptobrevin together,
    nucleating trans-SNARE complex assembly and accelerating fusion of cognate exocytic SNAREs; this is the
    activity through which Munc18-1 drives synaptic vesicle fusion and neurotransmitter release.
