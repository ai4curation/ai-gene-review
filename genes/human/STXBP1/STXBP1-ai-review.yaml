- term:
    id: GO:0000149
    label: SNARE binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - ARBA:ARBA00090461
  - UniProtKB:P61765
  - ensembl:ENSRNOP00000021189
  review:
    summary: SNARE binding. Munc18-1 binds closed syntaxin-1, the syntaxin-1 N-peptide, VAMP2 and assembled
      SNARE complexes.
    action: ACCEPT
    reason: SNARE binding is the right level for the full set of Munc18-1 SNARE partners (syntaxin-1 alone,
      SNARE complexes, and the v-SNARE), which syntaxin-1 binding alone does not cover. Core activity,
      consistent with the rat Stxbp1 review.
    supported_by:
    - reference_id: PMID:23057743
      supporting_text: Munc18-1 binds to an autoinhibitory closed conformation of syntaxin-1, gating formation
        of SNARE complexes, and also binds to SNARE complexes
    - reference_id: PMID:17218264
      supporting_text: strongly accelerates this reaction through direct contact with both t- and v-SNAREs
