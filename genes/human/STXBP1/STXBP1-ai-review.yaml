- term:
    id: GO:0002576
    label: platelet degranulation
  evidence_type: IMP
  original_reference_id: PMID:12773094
  qualifier: involved_in
  review:
    summary: Platelet degranulation, from Munc18-derived peptides that inhibit secretion from all three
      platelet granule types in permeabilized platelets.
    action: KEEP_AS_NON_CORE
    reason: The abstract shows that Munc18a (Munc18-1) is present in platelets and binds syntaxin 2, and that
      Munc18-based peptides inhibit granule secretion. The full text was read by the curator and is not
      cached; the peptide approach does not cleanly separate Munc18-1 from its platelet paralogs Munc18-2 and
      Munc18-3. Plausible but peripheral to the neuronal function.
    supported_by:
    - reference_id: PMID:12773094
      supporting_text: Addition of the peptides to permeabilized platelets inhibits secretion from all three
        platelet granules.
- term:
    id: GO:0003006
    label: developmental process involved in reproduction
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P61765
  - ensembl:ENSRNOP00000021189
  review:
    summary: Developmental process involved in reproduction, electronic transfer.
    action: MARK_AS_OVER_ANNOTATED
    reason: The only reproductive evidence for Munc18-1 is its role in exocytosis of the sperm acrosome, which
      is a secretory event, not a developmental process. No evidence that Munc18-1 contributes to reproductive
      development.
- term:
    id: GO:0003723
    label: RNA binding
  evidence_type: HDA
  original_reference_id: PMID:22658674
  qualifier: enables
  review:
    summary: RNA binding from mRNA interactome capture (high-throughput).
    action: MARK_AS_OVER_ANNOTATED
    reason: Detected in a proteome-wide mRNA-crosslinking screen. Munc18-1 has no RNA-binding domain and no
      study links RNA binding to its function; the hit is not informative about its biology.
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:16049941
  qualifier: enables
  supporting_entities:
  - UniProtKB:P05067
  review:
    summary: Protein binding from high-throughput or interactor-screening studies (APP, HTT, HuRI/BioPlex
      binary screens; partners include TRIM38, STX11, STX19, STX5, HSPA8, MAPK1).
    action: REMOVE
    reason: Bare protein binding is uninformative. These interactions are not being called false, but the
      screens give no functional context. Some partners are non-neuronal syntaxins (STX11, STX19, STX5) found
      by yeast two-hybrid, whose relevance to Munc18-1 function is unknown; Munc18-1 is reported to bind
      syntaxins 1, 2 and 3. The informative syntaxin binding is captured by syntaxin-1 binding and SNARE
      binding.
