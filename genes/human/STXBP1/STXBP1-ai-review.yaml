suggested_questions:
- question: Does Munc18-1 dissociate from the SNARE complex once zippering is complete, or does it remain
    bound through fusion pore opening?
- question: For STXBP1 encephalopathy missense variants, how much of the phenotype reflects simple loss of
    protein (haploinsufficiency) versus co-aggregation of wild-type Munc18-1 with destabilized mutant protein?
- question: Is the reported alpha-synuclein chaperone activity of Munc18-1 relevant at endogenous
    concentrations in neurons, or a consequence of overexpression?
suggested_experiments:
- description: Single-molecule optical-tweezers or smFRET measurements of SNARE zippering with Munc18-1 and
    Munc13 in the presence of a fusing membrane, tracking Munc18-1 occupancy through full zippering and pore
    opening.
  hypothesis: Munc18-1 remains bound to the syntaxin-1 N-peptide during fusion pore opening and is released
    only after full zippering.
- description: Knock-in human iPSC-derived neurons carrying destabilizing STXBP1 missense variants, compared
    with isogenic heterozygous null lines, measuring wild-type Munc18-1 levels, aggregates and evoked release.
  hypothesis: Destabilizing missense variants reduce functional Munc18-1 below the level seen with a null
    allele by sequestering the wild-type protein.
