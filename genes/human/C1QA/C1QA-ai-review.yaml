id: P02745
gene_symbol: C1QA
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: C1QA is the A chain of the secreted complement recognition protein C1q. Six copies
  each of the A, B and C chains assemble into collagen-like stalks and heterotrimeric globular
  heads. The A-chain globular module binds immunoglobulins, and assembled C1q recognizes clustered
  IgG or IgM on target surfaces. Within the C1 complex, this recognition couples to activation
  of the associated C1r and C1s proteases and initiation of the classical complement cascade.
  C1QA also contributes to C1q recognition of altered-self surfaces and to receptor-mediated
  immune regulation; phosphatidylserine recognition and CD33 signaling have been demonstrated
  for assembled C1q rather than established as autonomous A-chain activities. In mouse models,
  C1qa-dependent complement activity participates in synaptic remodeling and glial responses,
  providing the experimental basis for contextual orthology annotations to human C1QA.
