core_functions:
- description: Recognizes immunoglobulins through the A-chain globular module and the multivalent
    C1q head assembly, coupling surface-bound IgG or IgM recognition to C1r/C1s activation in
    classical complement. The recognition/assembly role is distinct from the proteolytic reactions
    performed by C1r and C1s.
  molecular_function:
    id: GO:0019865
    label: immunoglobulin binding
  directly_involved_in:
  - id: GO:0006958
    label: complement activation, classical pathway
  locations:
  - id: GO:0005576
    label: extracellular region
  - id: GO:0009986
    label: cell surface
  in_complex:
    id: GO:0005602
    label: complement component C1 complex
  supported_by:
  - reference_id: PMID:12847249
  - reference_id: PMID:19006321
  - reference_id: PMID:23650384
  - reference_id: PMID:24626930
  - reference_id: PMID:34155115
- description: Contributes the A-chain structural component to phosphatidylserine recognition
    by the heterotrimeric C1q globular heads on altered-self surfaces. Human C1q and its globular
    region bind phosphatidylserine, but the principal crystallographic phosphoserine site lies
    on chain C; autonomous A-chain sufficiency is not established.
  contributes_to_molecular_function:
    id: GO:0001786
    label: phosphatidylserine binding
  locations:
  - id: GO:0005576
    label: extracellular region
  in_complex:
    id: GO:0062167
    label: complement component C1q complex
  supported_by:
  - reference_id: PMID:18250442
- description: 'Contributes to extracellular receptor-ligand activity of assembled C1q: the
    globular region binds CD33 and stimulates its inhibitory signaling motifs in human monocytes.
    This is activation of an inhibitory receptor, not inhibition of ligand-receptor engagement,
    and neither isolated A-chain sufficiency nor a C1QA kinase activity is implied.'
  contributes_to_molecular_function:
    id: GO:0048018
    label: receptor ligand activity
  locations:
  - id: GO:0005576
    label: extracellular region
  in_complex:
    id: GO:0062167
    label: complement component C1q complex
  supported_by:
  - reference_id: PMID:28325905
suggested_questions:
- question: Which C1QA residues make physiological contributions to phosphatidylserine recognition
    independently of the established C-chain site, beyond crystal-packing contacts?
- question: Which exact donor experiments support the fine presynaptic/post-synaptic membrane
    and glutamatergic-synapse transfers to human C1QA?
- question: Can the original PMID:6249812 experimental text and the C1QA extracellular-matrix
    target table in PMID:28675934 be inspected to resolve their source-specific UNDECIDED rows?
