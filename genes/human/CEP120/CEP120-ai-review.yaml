id: Q8N960
gene_symbol: CEP120
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CEP120 is a centriolar microtubule-binding protein that supports centriole duplication, elongation
  and the assembly of structures needed for ciliogenesis. Its N-terminal C2A region binds microtubules,
  while other regions associate with centriolar proteins including CPAP, C2CD3 and TALPID3. CEP120 is
  enriched on daughter centrioles and helps organize the recruitment of distal centriolar components.
  Mouse quiescent-cell experiments additionally show restraint of premature pericentriolar-material accumulation,
  distinct from centriole construction in cycling cells. Biallelic variants cause ciliopathies including
  Joubert syndrome and short-rib thoracic dysplasia.
