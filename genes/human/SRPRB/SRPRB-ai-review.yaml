- term:
    id: GO:0005881
    label: cytoplasmic microtubule
  evidence_type: IDA
  original_reference_id: PMID:23264731
  qualifier: located_in
  review:
    summary: The cited paper reports a localization screen of the human ORFeome (15,483 tagged ORFs) for proteins with a microtubule pattern and then characterizes one hit, MTR120/KIAA1383. UniProt annotated 16 screen hits, SRPRB among them, to cytoplasmic microtubule from it. SRPRB is the ER-membrane beta subunit of the SRP receptor, and nothing else places it on microtubules.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'The row is not a wrong-gene error. UniProt made the same IDA cytoplasmic microtubule row on 2013-03-11 for 16 otherwise unrelated proteins from this paper (SRPRB, SERP1, SNPH, BCL10, CYP2A6, SCTR, CIMAP1D, TMEM214, DCXR, HID1, SPACA9, GRAMD2B, SELENOS, REEP2, ENKD1 and CLMP), three days after its rows for MTR120 itself. That batch matches the paper''s Fig. 1C, a list of ORFs scored for microtubule localization in the overexpression screen, and it includes hits the text names (TMEM214, C17ORF28/HID1, C9ORF9/SPACA9, C16ORF48/ENKD1). The cached text does not reproduce the figure, so SRPRB was not seen in the list directly, but the absence of its name from the running text does not show it was not assayed. As evidence the row is weak: a single image-based hit for an overexpressed tagged ORF with no follow-up on SRPRB, an ER membrane protein whose reticular pattern can follow microtubules. It is marked as an over-annotation and not treated as an established location of the protein.'
    supported_by:
    - reference_id: PMID:23264731
      supporting_text: "Here, we carried out a large-scale analysis of the subcellular localization of all 15,483 ORFs in the human ORFeome v5.1 collection, which is complementary to previous approaches."
    - reference_id: PMID:23264731
      supporting_text: "We identified tubulins, previously characterized MAPs, and putative new MAPs"
