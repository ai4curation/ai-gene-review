      asserted_value: ECO:0005543
      confidence: PROBABLE
      explanation: >-
        PMID:16439358 reports the crystal structure of the SRP receptor, PDB 2FH5, whose
        primary citation is this paper. Its two chains are human SR-alpha (P08240) and mouse
        SR-beta (P47758), per the RCSB entity source organisms, so the beta subunit in the
        experiment is mouse Srprb, not human SRPRB. The membership claim is true of human
