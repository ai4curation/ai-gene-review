id: P56378
gene_symbol: ATP5MJ
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ATP5MJ encodes subunit j (6.8-kDa mitochondrial proteolipid, MLQ) of mitochondrial F1F0 ATP
  synthase (complex V). It is a small single-pass inner-membrane protein in the F(o) membrane domain.
  Although it is a minor, loosely associated subunit, it is needed to maintain the cellular population
  of ATP synthase. Its knockdown depletes the enzyme post-transcriptionally, lowers mitochondrial ATP
  synthesis, slows growth and sensitizes cells to glucose deprivation.
