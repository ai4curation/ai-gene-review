proposed_new_terms: []
knowledge_gaps:
- gap_statement: How subunit j maintains ATP synthase abundance, whether by promoting assembly, stabilizing
    the assembled complex or protecting it from turnover, is unknown.
  boundary: 'Established: subunit j is an F(o) subunit, and its knockdown depletes ATP synthase without
    lowering alpha/beta mRNA. Not established: the step at which subunit j acts, or how its variable expression
    is regulated.'
  gap_kind:
  - BIOLOGY
  status: OPEN
  provenance:
  - reference_id: PMID:24330338
    supporting_text: Here, we show that MLQ-knockdown HeLa cells lose population of ATP synthase in mitochondria.
  - reference_id: PMID:24330338
    supporting_text: This is not due to low transcription of subunit genes of ATP synthase because levels
      of mRNA for α- and β-subunits are unaffected by the knockdown.
suggested_questions:
- question: Does loss of subunit j block a specific ATP synthase assembly intermediate, or does it increase
    turnover of the assembled complex?
suggested_experiments:
- description: Knock out ATP5MJ and profile complex V assembly intermediates by complexome profiling,
    and measure the half-life of assembled ATP synthase with pulse-chase labelling.
