- term:
    id: GO:0035278
    label: miRNA-mediated gene silencing by inhibition of translation
  evidence_type: IDA
  original_reference_id: PMID:18771919
  review:
    summary: AGO1 mediates noncleavage translational repression.
    action: ACCEPT
    reason: The human Ago1 tethering experiments in PMID:18771919 compare reporter protein output
      with mRNA abundance and support translational repression in addition to nonendonucleolytic
      transcript destabilization. Repression potency in the tested 293T boxB reporter system ranked
      Ago4 > Ago3 > Ago2 >= Ago1; at low concentrations Ago4 was about sixfold more potent than
      Ago1, whereas the four proteins caused similar reductions in mRNA abundance. Thus AGO1 can
      repress translation, but it was the weakest paralog in this assay. This relative potency is
      not a universal ranking across endogenous targets or cell types. Independent TNRC6 recruitment
      supports its central miRISC effector role.
