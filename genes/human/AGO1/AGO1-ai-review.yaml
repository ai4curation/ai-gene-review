id: Q9UL18
gene_symbol: AGO1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: AGO1 encodes a human Argonaute protein that binds small-RNA guides, loads miRNA
  duplexes and promotes their maturation into active RNA-induced silencing complexes. Its PAZ, MID
  and PIWI-containing architecture holds the guide and recognizes complementary target RNAs.
  Wild-type AGO1 lacks efficient target-RNA slicing activity but recruits TNRC6/GW182-associated
  effectors to repress translation and promote mRNA decay. It acts principally in the cytoplasm,
  including P-bodies and other ribonucleoprotein assemblies, and also has a nuclear pool associated
  with transcriptional regulation. A C-terminally extended readthrough proteoform, AGO1x, has been
  reported with distinct miRNA-inhibitory and nuclear dsRNA-regulatory properties; endogenous
  abundance and reporter-based readthrough estimates remain experimentally disputed.
