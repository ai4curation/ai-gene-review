- id: PMID:26764146
  title: Argonaute proteins in cardiac tissue contribute to the heart injury during viral
    myocarditis.
  full_text_unavailable: true
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary PubMed title and abstract were independently verified; MGI J:233964 is the
      historical donor reference for the exact GO:1901224 IMP. The normal fetch artifact recovered
