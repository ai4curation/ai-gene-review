- id: PMID:31330067
  title: Let-7a-regulated translational readthrough of mammalian AGO1 generates a microRNA pathway
    inhibitor.
  findings:
  - statement: Original report of AGO1x - a C-terminally extended AGO1 proteoform said to arise from
      let-7a-promoted stop codon readthrough, to load miRNAs without silencing them because it
      cannot bind GW182, and thus to act as a competitive inhibitor of the miRNA pathway.
    reference_section_type: ABSTRACT
    supporting_text: Ago1x can load miRNAs on target mRNAs without causing post-transcriptional gene
      silencing, due to its inability to interact with GW182
  - statement: 'Evidence beyond the contested reporter assay: ribosome profiling, mass spectrometry and
      a proteoform-specific antibody.'
    reference_section_type: ABSTRACT
    supporting_text: Analysis of ribosome profiling data and mass spectrometry data provided
      additional evidence for translational readthrough of AGO1.
  - statement: Endogenous detection of the readthrough product is claimed with a specific antibody.
    reference_section_type: ABSTRACT
    supporting_text: The endogenous readthrough product, Ago1x, could be detected by a specific
      antibody both in vitro and in vivo.
  reference_review:
    relevance: MEDIUM
    correctness: DISPUTED
    review_notes: The original readthrough and AGO1x inhibitory-function study is directly
      challenged by PMID:40500330 and defended in PMID:40500329. The latter response was verified
      from PubMed and the publisher full text. Reporter-method disagreement does not by itself
      invalidate orthogonal proteomic/antibody evidence or all proteoform functions. No seeded GOA
      row cites this paper.
  full_text_unavailable: false
- id: PMID:32812257
  title: Prevention of dsRNA-induced interferon signaling by AGO1x is linked to breast cancer cell
    proliferation.
  findings:
  - statement: Independent laboratory (Zavolan) reporting AGO1x in breast cancer cells, with a
      function distinct from canonical AGO1 - limiting dsRNA accumulation and interferon induction -
      and a nuclear, perinucleolar localization unlike cytoplasmic AGO1.
    reference_section_type: ABSTRACT
    supporting_text: AGO1x, an evolutionarily conserved translational readthrough isoform of
      Argonaute 1, is generated in highly proliferative breast cancer cells
  - statement: The reported AGO1x localization is nuclear, which matters because generic nuclear
      annotations on AGO1 should not be quietly justified by a disputed proteoform.
    reference_section_type: ABSTRACT
    supporting_text: AGO1x exhibits nuclear localization in the vicinity of nucleoli
  - statement: Specificity of the AGO1x-detecting antibody was tested against FLAG-AGO1 and
      FLAG-AGO1x stable lines - evidence for the proteoform that does not depend on a luciferase
      reporter.
    reference_section_type: RESULTS
    supporting_text: These experiments again demonstrated that the AGO1x antibody is highly specific
      for AGO1x
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full cached independent study reports readthrough-specific peptides, antibody
      controls, genomic perturbation and a nuclear AGO1x/dsRNA phenotype in breast-cancer cells.
      These experiments are supporting primary evidence for its reported proteoform-specific model,
      not direct evidence for every canonical AGO1 nuclear annotation. The reporter critique
      PMID:40500330 does not test these experiments; the broader readthrough quantification dispute
      remains open.
  full_text_unavailable: false
- id: PMID:38499809
  title: Transcript-specific induction of stop codon readthrough using a CRISPR-dCas13 system.
  findings:
  - statement: Uses the AGO1 stop codon as a known natural readthrough site when demonstrating
      dCas13-induced readthrough; its AGO1 readthrough measurements are the second target of the
      2025 critique.
    reference_section_type: ABSTRACT
    supporting_text: we target dCas13 to the region downstream of canonical stop codons of mammalian
      AGO1 and VEGFA mRNAs, known to exhibit natural SCR
  reference_review:
    relevance: MEDIUM
    correctness: DISPUTED
    review_notes: Full cached dCas13 readthrough-induction study uses AGO1 reporters and
      endogenous-protein assays. Its reporter interpretation is challenged in PMID:40500330 and
      defended in PMID:40500329. The criticism is scoped to readthrough measurement, not assumed to
      refute every dCas13 result or AGO1 function.
  full_text_unavailable: false
- id: PMID:40500330
  title: The dual luciferase assay does not support claims of stop codon readthrough on the AGO1
    mRNA.
  findings:
  - statement: 'Direct methodological challenge to the AGO1 readthrough claim: using an insulated StopGo/2A
      single-mRNA dual-luciferase system, no meaningful readthrough at the AGO1 stop codon was detected,
      while the positive control AQP4 behaved as expected.'
    reference_section_type: RESULTS
    supporting_text: we could not detect readthrough activity above 0.1%
  - statement: In the tested reporter designs, apparent readthrough fell after removing the AGO1
      fusion; the authors interpret this as a reporter artefact. The design and interpretation are
      contested in PMID:40500329.
    reference_section_type: RESULTS
    supporting_text: when we tested the unfused AGO1-SG-F-luc constructs, apparent readthrough
      almost disappeared
  - statement: The authors attribute the published ~20% figure to an impaired sense-codon control
      combined with reporter-independent background activity.
    reference_section_type: RESULTS
    supporting_text: resulted in an overestimation of AGO1 readthrough
  - statement: The authors framed the reported efficiency as exceptionally high; their
      highest-known-human-readthrough statement is disputed by the response PMID:40500329 and is not
      adopted as an established fact.
    reference_section_type: INTRODUCTION
    supporting_text: As far as we know, this is the highest reported readthrough efficiency observed
      for any human mRNA.
  reference_review:
    relevance: MEDIUM
    correctness: DISPUTED
    review_notes: The full cached methodological critique shows low signal in its insulated reporter
      and attributes earlier values to reporter effects. Its interpretation is explicitly contested
      by the co-published response PMID:40500329, which discusses reporter design and orthogonal
      evidence. This is an unresolved experimental disagreement, not a retraction. The earlier claim
      that no response existed is superseded.
  full_text_unavailable: false
- id: PMID:40500329
  title: Response to Suresh et al.
  full_text_unavailable: false
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: DISPUTED
    review_notes: PubMed independently verified the identifier, title and DOI
      10.1038/s44318-025-00479-0; publisher full text was read. The normal fetch artifact recovered
      on 2026-09-27 now supplies XML full text from PMC12264181. The authors contest the critique
      using prior AGO1 reporter and orthogonal evidence and new HBB reporter comparisons with versus
      without stop-go sequences. The HBB experiment is not itself an endogenous AGO1 abundance
      measurement. This reply and the methodological critique leave the endogenous readthrough
      dispute unresolved; DISPUTED remains the appropriate scientific assessment despite verified
      identity and recovered access.
