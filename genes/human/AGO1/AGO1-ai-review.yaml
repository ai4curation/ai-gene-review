core_functions:
- description: AGO1 binds miRNA guides and complementary target RNAs in cytoplasmic RISC and
    recruits TNRC6/GW182-associated effectors for translational repression and nonendonucleolytic
    mRNA decay. In a human-cell tethered-reporter comparison, AGO1 repressed translation less
    potently than the other three Argonautes, while all four caused similar reductions in mRNA
    abundance; these relative contributions depend on the experimental context. Guide-duplex loading
    and PAZ-dependent passenger-strand release generate the active complex without AGO2-like target
    slicing. AGO1 occupies both dispersed cytoplasmic assemblies and P-bodies.
  molecular_function:
    id: GO:0035198
    label: miRNA binding
  directly_involved_in:
  - id: GO:0035278
    label: miRNA-mediated gene silencing by inhibition of translation
  - id: GO:0000956
    label: nuclear-transcribed mRNA catabolic process
  - id: GO:0070922
    label: RISC complex assembly
  locations:
  - id: GO:0005737
    label: cytoplasm
  - id: GO:0000932
    label: P-body
  in_complex:
    id: GO:0016442
    label: RISC complex
  supported_by:
  - reference_id: PMID:15260970
    supporting_text: Our results suggest that miRNAs are incorporated indiscriminately of their
      sequence into Ago1 through Ago4 containing microRNPs (miRNPs).
  - reference_id: PMID:22795694
    supporting_text: Thus, Ago1/3/4-ΔPAZ maintained their ability to physically associate with
      small-RNA duplexes, but not the ability to unwind and form active RISC.
  - reference_id: PMID:19383768
    supporting_text: Our findings indicate that TNRC6A, TNRC6B, and TNRC6C are recruited to miRNA
      targets through an interaction between their N-terminal domain and an Argonaute protein; the
      TNRC6s then promote translational repression and/or degradation of miRNA targets through a
      C-terminal silencing domain.
  - reference_id: PMID:18771919
    supporting_text: the four tethered proteins caused nearly equal reductions in cytoplasmic mRNA
      concentration, suggesting that each has a similar capacity to destabilize mRNA.
  - reference_id: PMID:28683311
    supporting_text: Loss of LIMD1 had no visible effect on AGO1, 2, or 3 colocalization with TNRC6A
      or DDX6 in P-bodies
  - reference_id: PMID:18771919
    supporting_text: At low concentrations, where the differences were greatest, Ago4, Ago3, and
      Ago2 were about 6-fold, 2.7-fold, and 1.6-fold more potent than Ago1, respectively.
proposed_new_terms: []
suggested_questions:
- question: How should GO:0035279 and GO:0090625 names and synonyms be reconciled with their
    target-cleavage definitions, so NOT annotations on nonslicing Argonautes do not imply an absence
    of TNRC6-mediated decay?
- question: Does GO:0070578 describe only the DICER1–TARBP2–AGO2 trimer in its current definition,
    or should AGO1-containing loading intermediates have a separately supported complex
    representation?
- question: Do the AGO1-dependent TNFAIP3 assays in PMID:26764146 establish regulation of the
    NIK/non-canonical NF-kappaB branch specifically, and is the same mechanism supported in human
    AGO1?
- question: Does AGO1 itself contact promoter DNA in the let-7i/IL2 system, or is its
    sequence-directed occupancy mediated by the bound guide and other nuclear factors?
- question: What is the endogenous abundance and functional contribution of AGO1x after accounting
    for both sides of the 2025 readthrough-method debate?
  experts:
  - Loughran G
  - Eswarappa SM
  - Zavolan M
suggested_experiments:
- description: Measure AGO1-specific guide and target occupancy together with translation and mRNA
    half-lives after paralog-specific depletion and rescue.
  experiment_type: RNA-protein interaction profiling and kinetic RNA analysis
  hypothesis: AGO1 recruitment can separate translational repression from nonendonucleolytic decay
    without requiring target slicing.
- description: Resolve the composition of human AGO1 loading intermediates and directly compare them
    with DICER1–TARBP2–AGO2 complexes.
  experiment_type: Endogenous complex purification and biochemical reconstitution
  hypothesis: AGO1 duplex loading and maturation need not use the exact historical trimeric RLC
    composition.
knowledge_gaps:
- gap_statement: Endogenous AGO1 stop-codon readthrough efficiency and the quantitative contribution
    of AGO1x differ among the reported assays and remain disputed after the 2025 critique and
    response.
  boundary: Canonical AGO1 RNA binding, RISC maturation and nonendonucleolytic silencing are
    independently established. No seeded GOA annotation cites the AGO1x papers. Orthogonal evidence
    for the reported proteoform is not negated solely by the reporter disagreement.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: The reported extended proteoform has functions and localization distinct from
    canonical AGO1, making quantitative proteoform-specific assays important for interpreting
    nuclear and interferon phenotypes.
  resolution: Compare matched reporter designs and perform quantitative endogenous peptide
    measurements, with genomic controls that distinguish altered RNA regulation from loss of the
    C-terminal extension. Assess both PMID:40500330 and the response PMID:40500329.
  provenance:
  - reference_id: PMID:15260970
    supporting_text: Our results suggest that miRNAs are incorporated indiscriminately of their
      sequence into Ago1 through Ago4 containing microRNPs (miRNPs).
  - reference_id: PMID:31330067
    supporting_text: Analysis of ribosome profiling data and mass spectrometry data provided
      additional evidence for translational readthrough of AGO1.
