biological_limits:
- Human complex purification identifies endogenous ELP2; human N17 deletion/co-IP supports assembly. Yeast
  crystal, microtubule and H3K14 assays remain species-specific.
- Elongator performs the tRNA modification reaction. ELP2 complex contribution is distinct from autonomous
  ELP2 enzymatic activity.
- Predominant cytosol and additional nuclear localization are compatible. Cross-source cytosol refinements
  do not retrospectively increase the resolution of historical assays.
- Historical human-complex RNAPII/transcription evidence is retained as non-core; calf-thymus polymerase
  and ELP1/ELP3 localization in PMID11714725 are explicit.
- The murine kinase-binding donor supports a contextual association. A stable STAT3–StIP1–JAK1 ternary
  complex was not recovered; no new human kinase-scaffold role is inferred.
