- term:
    id: GO:0006357
    label: regulation of transcription by RNA polymerase II
  evidence_type: TAS
  original_reference_id: PMID:11714725
  qualifier: involved_in
  review:
    summary: Historical human Elongator experiments support a transcription-regulatory context.
    action: KEEP_AS_NON_CORE
    reason: PMID11714725 reports polymerase/early-elongation-complex association and histone acetylation,
      rather than the chromatin-transcription stimulation assay previously attributed to it here. In PMID11818576,
      purified Elongator restored acetyl-CoA-dependent transcription from chromatin in Elongator-depleted
      nuclear extract, although it did not stimulate the fully defined reconstituted system (Functional
      Analysis; Fig. 5; Discussion). This is positive complex-level evidence in a particular biochemical
      context. PMID27847465 supports the predominant tRNA-modification role and explains how translation
      defects can cause transcription phenotypes in cells; it also leaves distinct transcription functions
      open. That account does not by itself explain away acute cell-free add-back. Retain the imported
      TAS as non-core, without assigning independent transcriptional catalysis to ELP2 or generalizing
      the assay to its principal cellular function.
    supported_by:
    - reference_id: PMID:11714725
    - reference_id: PMID:29332244
    - reference_id: PMID:11818576
    - reference_id: PMID:27847465
- term:
    id: GO:0006368
    label: transcription elongation by RNA polymerase II
  evidence_type: TAS
  original_reference_id: PMID:11714725
  qualifier: involved_in
  review:
    summary: ELP2 has a supported complex-level transcription-elongation context.
    action: KEEP_AS_NON_CORE
    reason: PMID11714725 associates human Elongator with RNA polymerase II and early elongation complexes.
      PMID11818576 reports positive chromatin-transcription rescue in depleted nuclear extract, but a
      negative result in a fully defined reconstituted system; its Discussion also leaves a possible initiation
      contribution unresolved. Thus the evidence supports a historical transcription-associated complex
      context without isolating an ELP2-dependent elongation step. PMID27847465 favors a primary tRNA-modification
      role and explains some whole-cell transcription phenotypes as secondary effects, while retaining
      the possibility of additional transcription functions. Retain the source-specific TAS as non-core
      because of the early-elongation association and positive extract assay; do not treat it as a demonstration
      of autonomous ELP2 RNA-chain extension or a universal cellular elongation role.
    supported_by:
    - reference_id: PMID:11714725
    - reference_id: PMID:11818576
    - reference_id: PMID:27847465
