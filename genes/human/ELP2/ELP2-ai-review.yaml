core_functions:
- description: Supports assembly of the ELP1–ELP2–ELP3 subcomplex and contributes to Elongator-catalyzed
    formation of carboxymethyluridine at tRNA position 34. ELP3 performs the catalytic chemistry; ELP2
    provides a structural contribution within the complex.
