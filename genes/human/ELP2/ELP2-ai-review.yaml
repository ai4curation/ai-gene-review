      as predominant and secondary effects as an explanation for some cellular phenotypes, but explicitly
      leaves distinct transcription functions open. Retain the experimental complex annotation as non-core
      on the positive biochemical evidence, without making it the identity of all cytosolic Elongator
      or an established core ELP2 function.
