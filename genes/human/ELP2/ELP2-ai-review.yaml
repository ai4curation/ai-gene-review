suggested_questions:
- question: Do the seven ELP2 splice products differ in their incorporation into Elongator or their support
    for tRNA wobble-uridine modification?
- question: Does human ELP2 bind microtubules as yeast Elp2 does, and is that interaction physiologically
    important independently of its contribution to Elongator assembly and tRNA modification? PMID25960406
    did not establish purified human ELP2 microtubule binding.
- question: Which human nuclear transcription effects reflect a distinct Elongator activity, and which
    follow altered tRNA modification and translation? Can defined-system experiments explain the positive
    nuclear-extract add-back result and separate initiation from elongation?
