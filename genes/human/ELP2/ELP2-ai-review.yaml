    summary: The mouse experimental donor supports contextual protein-kinase binding.
    action: KEEP_AS_NON_CORE
    reason: The literal Q91WG4 donor has an MGI IDA GO:0019901 annotation to PMID10954736. That original
      uses murine StIP1, endogenous M1-cell JAK1/JAK2/TYK2 co-immunoprecipitation and mapped GST-StIP1
