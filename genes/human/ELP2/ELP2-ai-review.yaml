  review:
    summary: The historical transcription-associated Elongator complex is supported.
    action: KEEP_AS_NON_CORE
    reason: PMID11714725 identifies ELP2 within human Elongator and shows association of the complex with
      RNA polymerase II and early elongation complexes. PMID11818576 adds positive chromatin-transcription
      rescue in depleted nuclear extract, despite failure to stimulate the fully defined system. Together
      these support a bounded historical transcription-complex context, rather than membership inferred
      solely from a transcription phenotype. GO:0008023 requires a complex affecting polymerase-II elongation
