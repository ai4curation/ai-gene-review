id: Q6IA86
gene_symbol: ELP2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ELP2 is a WD-repeat subunit of the six-subunit Elongator complex that supports assembly of
  its ELP1–ELP2–ELP3 subcomplex. In the cytosol, ELP2 contributes to Elongator-mediated modification of
  uridine at the wobble position of tRNAs. ELP3 supplies the catalytic activity that forms carboxymethyluridine,
  an intermediate in further wobble-uridine modifications important for codon decoding. ELP2 is predominantly
  cytosolic, with an additional nuclear pool.
