suggested_questions:
- question: Is the FGFR-independent, p53-dependent anti-apoptotic activity of intracellular FGF1 physiologically
    significant in vivo, and which pool (pre-secretory or internalized) mediates it?
- question: Do the metabolic (insulin-sensitizing, anti-lipolytic) effects of FGF1 reflect a distinct
    receptor/heparan sulfate configuration from its mitogenic signaling, and are they relevant to human
    adipose physiology?
- question: Is direct integrin alphaV-beta3 binding required for FGF1 signaling in cells from independent
    laboratories, or is the R50E phenotype explained by altered heparan sulfate or receptor dimer geometry?
- question: What is the molecular mechanism by which FGF1 crosses the plasma membrane during stress-induced
    non-classical secretion, and which components (S100A13, SYT1 p40, AHNAK2, Na+/K+-ATPase) are rate-limiting
    in vivo?
suggested_experiments:
- description: Compare Fgf1-null mice rescued with wild-type, NLS-mutant or FGFR-binding-dead FGF1 knock-in
    alleles under high-fat diet and apoptotic stress to separate extracellular FGFR-dependent from intracellular
    functions.
  experiment_type: mouse genetics / knock-in
  hypothesis: Adipose remodelling and insulin sensitivity require extracellular FGFR activation, whereas
    the anti-apoptotic function persists with an FGFR-binding-dead intracellular FGF1.
- description: Quantify binding kinetics of FGF1 to all seven FGFR isoforms with defined heparan sulfate
    oligosaccharides by SPR/BLI and correlate with ERK and AKT signaling dynamics in isogenic cell lines.
  experiment_type: biochemistry / quantitative signaling
  hypothesis: Heparan sulfate composition tunes FGF1 receptor selectivity and signaling duration, distinguishing
    mitogenic and metabolic outputs.
- description: Test integrin alphaV-beta3 dependence of FGF1 signaling using ITGB3 knockout endothelial
    cells and orthogonal binding assays of FGF1 R50E versus wild type.
  experiment_type: genetic manipulation / binding assays
  hypothesis: If integrin binding is required, ITGB3 loss will phenocopy the R50E signaling defect.
