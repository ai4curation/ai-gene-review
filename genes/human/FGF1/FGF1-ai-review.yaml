id: P05230
gene_symbol: FGF1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: FGF1 (acidic fibroblast growth factor) is a heparin-binding beta-trefoil member of the paracrine
  FGF family and the only FGF able to bind and activate all seven principal FGF receptor isoforms (FGFR1-3
  IIIb/IIIc and FGFR4). It lacks a signal peptide and is released from cells by a stress-induced, copper-
  and S100A13/synaptotagmin-1-dependent non-classical export pathway. Extracellular FGF1, stabilized and
  presented by heparan sulfate proteoglycans, binds the D2-D3 region of FGFRs to drive receptor dimerization
  and tyrosine kinase activation, engaging FRS2alpha-RAS-ERK, PI3K-AKT and PLCgamma signaling. These pathways
  make FGF1 a potent mitogen and chemoattractant for fibroblasts, endothelial and epithelial cells and
  a pro-angiogenic factor. FGF1 has also been reported to bind integrin alphaV-beta3. Internalized FGF1
  can translocate into the cytosol and, via an N-terminal NLS, LRRC59 and importins, into the nucleus,
  and intracellular FGF1 has an FGFR-independent anti-apoptotic activity linked to direct binding of p53.
  Fgf1-null mice are essentially normal under standard conditions but develop severe insulin resistance
  and aberrant adipose remodelling on a high-fat diet, where FGF1 is induced by PPARgamma; exogenous FGF1
  is a potent insulin sensitizer in rodents.
