  review:
    summary: FGF1 binds integrin alphaV-beta3 directly (KD ~1 uM); the integrin-binding-defective R50E
      mutant still binds FGFR and heparin but is defective in mitogenic and migratory signaling.
    action: KEEP_AS_NON_CORE
    reason: Direct binding is experimentally supported by solid-phase binding and mutagenesis, but the
      integrin co-receptor model comes largely from a single laboratory and is an accessory to, not the
      basis of, FGFR-mediated signaling. Retained as a genuine but non-core activity.
    additional_reference_ids:
