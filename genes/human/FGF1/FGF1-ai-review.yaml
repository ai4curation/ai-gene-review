  review:
    summary: PAINT places FGFR binding at the ancestral paracrine FGF node (PTN000160075); FGF1 is a canonical
      member of that clade and has its own direct experimental evidence.
    action: ACCEPT
    reason: FGF1 is the prototypic paracrine FGF and the only FGF that activates every principal FGFR
      splice isoform; receptor binding at the D2-D3 region is its defining molecular activity. The IBA
      node placement is sound and FGF1 lies squarely inside the inheriting clade.
    supported_by:
    - &id001
      reference_id: PMID:8663044
      supporting_text: These studies demonstrate that FGF 1 is the only FGF that can activate all FGF
        receptor splice variants.
    - &id002
