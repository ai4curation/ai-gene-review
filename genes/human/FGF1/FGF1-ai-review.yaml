core_functions:
- description: 'Secreted FGF1 is a universal FGFR ligand: it binds the D2-D3 ligand-binding region of
    all FGFR1-4 splice isoforms and triggers receptor dimerization and tyrosine kinase activation, initiating
    FGFR signaling and the downstream RAS-MAPK/ERK cascade.'
