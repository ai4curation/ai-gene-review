description: CAST encodes calpastatin, an intrinsically flexible cytosolic inhibitor of
  calcium-dependent calpain cysteine proteases. Multiple repeated inhibitory domains
  bind calcium-activated calpain heterodimers across the catalytic cleft, blocking
  proteolysis while leaving the CAST polypeptide itself uncleaved.
