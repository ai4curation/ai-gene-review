id: Q13873
gene_symbol: BMPR2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: BMPR2 is a single-pass type-II bone morphogenetic protein receptor with an extracellular
  ligand-binding domain and an intracellular serine/threonine kinase. At the plasma membrane it participates
  in BMP ligand/type-I/type-II receptor complexes and phosphorylates type-I receptors, which relay signals
  to R-SMADs and other effectors. Ligand and receptor composition shape the response, including BMP9/10
  signaling in vascular endothelium and BMP-dependent mesenchymal differentiation. These pathways contribute
  to pulmonary vascular homeostasis, cartilage and bone development, and context-dependent control of
  proliferation and survival. The canonical 1,038-residue product has a long cytoplasmic tail that binds
  regulatory proteins; a named 530-residue splice product lacks most of that tail. Activin-A reception
  is also documented in a defined gonadotrope-like cell context. Disease-associated variants can alter
  surface trafficking, kinase signaling and endothelial behavior. Some disease-associated mutants produce
  p38 responses absent from wild-type receptor in the tested cell context.
