core_functions:
- description: Binds BMP-family ligands at the cell surface and transmits their signal within a heteromeric
    receptor complex by phosphorylating type-I receptor components. Ligand recognition, receptor assembly
    and ATP-dependent receptor-to-receptor phosphorylation form one coupled mechanism; the activated type-I
    kinase subsequently phosphorylates R-SMADs.
  molecular_function:
    id: GO:0098821
    label: BMP receptor activity
  directly_involved_in:
  - id: GO:0030509
    label: BMP signaling pathway
  locations:
  - id: GO:0005886
    label: plasma membrane
  in_complex:
    id: GO:0043235
    label: signaling receptor complex
  supported_by:
  - reference_id: PMID:35504921
    supporting_text: 'BMPRII binds

      BMP10 at the knuckle epitope'
  - reference_id: Reactome:R-HSA-201443
    supporting_text: trans-phosphorylates specific serine residues at the conserved Gly-Ser-rich juxtapositioned
      domain of the type I receptor.
suggested_questions:
- question: Which exact mouse allele, tissue, developmental stage and anatomical readout justify each
    of the four transferred NOT developmental annotations?
- question: Do the ALK1-pathway donor experiments establish an endogenous BMPR2 requirement for each lymphatic,
    arterial and retinal process, or a broader ligand/receptor-pathway requirement?
- question: How broadly does the demonstrated activin-A/BMPR2/ALK4 pathway operate outside the gonadotrope-like
    cell system?
- question: Which phenotypes and interactions distinguish the natural short BMPR2 splice product from
    engineered kinase/tail truncations and disease alleles?
- question: Can the original C4bpa, ASC and YWHAE screen entries, the noggin-specific assay and the compartment-specific
    proteomic records be recovered to resolve the remaining target-level evidence gaps?
