description: MLH3 is a MutL homolog that heterodimerizes with MLH1 to form MutLgamma. Human MLH3 can
  contribute to backup or minor mismatch-repair contexts, while its best-established conserved role
  is in meiotic recombination with the meiotic MutS homolog MSH4.
