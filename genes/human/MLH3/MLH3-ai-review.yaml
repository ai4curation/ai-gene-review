- term:
    id: GO:0004520
    label: DNA endonuclease activity
  evidence_type: IDA
  original_reference_id: PMID:32015124
  qualifier: contributes_to
  review:
    summary: Human MLH1-MLH3 MutLgamma is a metal-dependent DNA endonuclease.
    action: NEW
    reason: Purified human MutLgamma carries its active DQHA(X)2E(X)4E motif in MLH3 and incises
      loop-containing DNA in a MutSbeta-dependent reaction; MLH3 therefore contributes to the
      endonuclease activity of the MLH1-MLH3 complex.
    supported_by:
    - reference_id: PMID:32015124
      supporting_text: Here we have shown that human MutLγ is a metal-dependent endonuclease. Our
        study has discovered that human MutLγ displays a distinct MutSβ-dependent endonuclease
        activity that incises loop-containing DNAs in the strand that does not carry the loop.
