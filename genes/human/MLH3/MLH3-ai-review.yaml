knowledge_gaps:
- gap_statement: The extent of direct human MutLgamma participation in canonical somatic mismatch
    repair remains unclear relative to its MutSbeta-dependent triplet-repeat expansion nuclease
    activity and its meiotic crossover role.
  boundary: Purified human MutLgamma incises loop-containing DNA with MutSbeta, but the canonical
    post-replicative MMR reaction is still built around MLH1-PMS2 MutLalpha.
  gap_kind:
  - BIOLOGY
  status: OPEN
  resolution: Purified human MLH1-MLH3 assays that establish whether MutLgamma repairs ordinary
    base-base mismatches or insertion-deletion loops under canonical MMR reaction conditions.
  provenance:
  - reference_id: PMID:32015124
    supporting_text: In addition, MutLγ has a minor role in MMR
  - reference_id: PMID:16143102
    supporting_text: "The reconstituted system includes MutSα or\nMutSβ, MutLα, RPA, EXO1, HMGB1, PCNA,
      RFC, polymerase delta, and ligase\nI."
suggested_questions:
- question: Which DNA substrates and cofactors distinguish human MLH1-MLH3 MutLgamma from the
    MLH1-PMS2 MutLalpha nuclease?
  experts:
  - DNA mismatch repair curators
suggested_experiments:
- description: Reconstitute MLH1-MLH3 MutLgamma on ordinary base-base mismatches and
    insertion-deletion loops under canonical MMR conditions, and compare its incision specificity
    with the MutSbeta-dependent loop incision measured for triplet-repeat substrates.
  hypothesis: Human MutLgamma has MLH3-dependent endonuclease activity but differs from MutLalpha in
    substrate choice and cofactor control.
