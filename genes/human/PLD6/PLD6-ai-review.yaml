core_functions:
- description: >-
    Single-strand-specific endonuclease, active as a homodimer on the cytosolic face of
    the mitochondrial outer membrane, that cuts piRNA precursors to generate
    5'-monophosphorylated ends of primary piRNAs in the germline.
  molecular_function:
    id: GO:0016891
    label: RNA endonuclease activity producing 5'-phosphomonoesters, hydrolytic mechanism
  directly_involved_in:
  - id: GO:0034587
    label: piRNA processing
  locations:
  - id: GO:0005741
    label: mitochondrial outer membrane
  supported_by:
  - reference_id: PMID:23064230
    supporting_text: DmZuc and the mouse homologue MmZuc (also known as Pld6 and MitoPLD) showed endoribonuclease activity for single-stranded RNAs in vitro
  - reference_id: PMID:28063496
    supporting_text: Here, we present a detailed method for purification and biochemical analysis of human PLD6 nuclease activity
- description: >-
    Promotes mitofusin-dependent mitochondrial fusion from the outer membrane, with a
    catalysis-dependent phosphatidic acid signal on the mitochondrial surface. Whether
    that PA comes from cardiolipin hydrolysis by PLD6 is contested, so no molecular
    function is asserted for this role.
  directly_involved_in:
  - id: GO:0008053
    label: mitochondrial fusion
  locations:
  - id: GO:0005741
    label: mitochondrial outer membrane
  supported_by:
  - reference_id: PMID:17028579
    supporting_text: Here, we identify an ancestral member of the phospholipase D (PLD) superfamily of lipid-modifying enzymes that is required for mitochondrial fusion
  - reference_id: PMID:21397848
    supporting_text: However, increasing MitoPLD expression to cause PA production induced sensor translocation to the aggregated mitochondria
  knowledge_gaps:
  - gap_statement: >-
      It is not established which catalytic activity of PLD6 produces the
      mitochondrial-surface phosphatidic acid that promotes fusion: direct cardiolipin
      hydrolysis has been reported for the human protein but was not reproduced with the
      purified mouse ortholog.
    boundary: >-
      Cell-based PA sensors and H156N mutants show the PA signal depends on PLD6
      catalysis and outer-membrane anchoring; purified soluble mouse PLD6 hydrolyses
      single-stranded nucleic acid but not cardiolipin liposomes, and mitochondrial
      lipidomics after overexpression detected no PA change.
    gap_kind:
    - BIOLOGY
    dark_aspect: RESIDUAL_SUBGAP
    status: OPEN
    significance: >-
      Determines whether PLD6 is a bifunctional lipase/nuclease or a nuclease whose
      fusion role works through another PA source.
    resolution: >-
      Reconstitute full-length, membrane-anchored human PLD6 in cardiolipin-containing
      proteoliposomes, with and without MIGA2, and quantify PA and PG by mass
      spectrometry against the H156N mutant.
suggested_questions:
- question: >-
    Does full-length, membrane-anchored PLD6 hydrolyse cardiolipin, while the soluble
    catalytic fragment does not, and do MIGA proteins switch the dimer between lipase
    and nuclease modes as proposed?
- question: >-
    Does PLD6 have a nuclease substrate in somatic cells, where piRNA precursors are
    absent, or is its somatic role purely in mitochondrial membrane dynamics?
suggested_experiments:
- description: >-
    Proteoliposome reconstitution of full-length human PLD6 (wild type and H156N) with
    cardiolipin, measuring PA and PG by LC-MS, alongside a single-stranded RNA cleavage
    assay on the same preparation, with and without MIGA2.
  experiment_type: in vitro biochemical reconstitution
