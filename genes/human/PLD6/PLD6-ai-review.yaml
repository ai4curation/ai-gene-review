id: Q8N2A8
gene_symbol: PLD6
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  PLD6 (MitoPLD; mammalian Zucchini) is a small, divergent member of the
  phospholipase D superfamily anchored in the mitochondrial outer membrane by an
  N-terminal transmembrane segment, with its catalytic domain facing the cytosol. It
  has a single HKD motif, so the active site forms only at the interface of a
  homodimer, in a narrow positively charged groove that accommodates single-stranded
  nucleic acid. Purified PLD6 and its mouse and fly orthologs are single-strand-specific
  endonucleases that leave 5'-phosphate ends, and in the germline the mouse and fly
  proteins make the endonucleolytic cuts that generate the 5' ends of primary piRNA
  precursors; loss of mouse Pld6 causes transposon derepression, meiotic arrest and
  male sterility, while females remain fertile. In somatic cells PLD6 promotes
  mitofusin-dependent mitochondrial fusion and generates phosphatidic acid on the
  mitochondrial surface, which recruits lipin 1. It was originally reported to make
  this phosphatidic acid by hydrolysing cardiolipin, but that lipase activity was not
  reproduced with the purified mouse ortholog and remains contested. Partners at the
  outer membrane include the mitoguardins MIGA1 and MIGA2, TRABD, NME3, and in
  spermatids GK2 and GYKL1.
