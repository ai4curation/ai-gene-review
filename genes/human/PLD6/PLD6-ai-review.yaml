  review:
    summary: The original report of cardiolipin hydrolysis by human MitoPLD; real but contested, so kept as non-core rather than core.
    action: KEEP_AS_NON_CORE
    reason: >-
      Choi et al. reported that human MitoPLD hydrolyses cardiolipin to phosphatidic
      acid, and that IDA (also the basis of the UniProt RHEA:44884 line) is direct
      evidence on this protein whose full text was not read here, so it is not removed.
      Later human-cell work agrees that PLD6 catalysis puts PA on the mitochondrial
      surface (PA-sensor recruitment that needs H156 and the TM anchor; NME3-PLD6 PA
      generation from cardiolipin). Against it: the soluble dimeric mouse ortholog
      showed no cardiolipin hydrolysis by TLC or SRM mass spectrometry, the structure
      resembles PLD-family nucleases more than phospholipases, mitochondrial lipidomics
      of MitoPLD-overexpressing HeLa cells found no PA increase, and purified human PLD6
      is assayed as a nuclease. The negative assays used a construct without the TM
      anchor, so they do not disprove membrane-dependent lipase activity. On balance the
      cardiolipin phospholipase D activity is plausible but unconfirmed by independent
      purified-protein biochemistry; it is kept as a secondary activity, and the
      well-supported single-strand endonuclease is taken as the core molecular function.
    supported_by:
