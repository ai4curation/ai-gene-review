    relevance: HIGH
    correctness: DISPUTED
    review_notes: >-
      PubMed-verified (Choi et al. 2006, Nat Cell Biol). Foundational paper on the human
      protein; localization and fusion findings are widely reproduced, but the
      cardiolipin hydrolase activity was not reproduced with purified mouse ortholog
      (PMID:23064227). Abstract only in cache.
