  actually_read: 'Materials and Methods: Experimental design, Animals, Hormone treatment, Western blot,
    Co-IP, qRT-PCR and immunohistochemistry; Results on Foxp1 protein/mRNA and coexpression; corresponding
    Discussion on regional differences. Cached original lines 90–132, 142–164 and 180–202.'
  findings: Rat pups receive DHT on PN0–2 with PN3 brain readouts. Foxp1 protein and mRNA rise in striatum
    and fall in cerebellar vermis; cortical Foxp1 mRNA falls while protein is unchanged. AR co-IP uses
    anti-Foxp2, not anti-Foxp1. Foxp1 coexpression is a separate immunofluorescence observation. The intervention
    is androgen, not an isolated Foxp1 perturbation.
  limits: No figure pixels, supplement, raw quantification or human FOXP1 assay was inspected. The accepted
    raw43 non-core response judgment and all original fields remain unchanged.
