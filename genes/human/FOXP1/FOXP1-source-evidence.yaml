- Determine whether the original PMID25609649 experiment independently resolves FOXP1 homomerization beyond
  self-bait detection, and map the recorded experimental clones before assigning current natural products.
- Resolve whether the original rat expression-only striatal and forebrain annotations support FOXP1 participation
  in those precise developmental processes.
- Inspect the exact PMID26333362 H2O2 supplement endpoint and the still-unverified PMID18799727 CXCL2
  claim; keep chelerythrine, MCP1/CCL2 and CXCL2 separate.
- Ask the source curator to reconcile the mouse PMID24859450 positive-IL21 annotation with the measured
  negative direction, preserving its original ID and qualifiers.
