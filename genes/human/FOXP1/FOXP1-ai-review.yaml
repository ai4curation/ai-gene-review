suggested_questions:
- question: Which endogenous human targets are differentially recognized and regulated by canonical FOXP1
    and FOXP1-ES, and how much of the difference reflects DNA specificity versus partner recruitment?
- question: When does SMRT recruitment dominate FOXP1 regulation, and when do FOXP2, FOXP4, androgen receptor
    or other partners alter the direction of transcriptional output?
- question: Is the restraint of IL21 and follicular-helper differentiation observed in mouse T cells conserved
    in matched human T-cell states?
- question: Which FOXP1-dependent transcriptional changes account for the contrasting survival effects
    in human B cells and rodent cardiomyocytes?
suggested_experiments:
- description: Use endogenous isoform-selective perturbations and matched rescue in human stem-cell differentiation,
    combining sequence-verified constructs, nascent RNA, occupancy and partner-association measurements.
    Distinguish shared antibody signals from isoform-specific occupancy.
- description: Perturb endogenous FOXP1 partners in matched human cell contexts while measuring occupancy,
    transcription and reciprocal complex recovery. Interface tests should distinguish cellular association
    from direct contact.
- description: Measure IL21, ICOS and follicular-helper maturation after controlled FOXP1 perturbation
    in a human T-cell differentiation system, with matched state and activation controls.
- description: Compare early transcriptional changes and later survival endpoints after matched FOXP1
    perturbation in human B cells and a validated human cardiomyocyte model, separating stimulus identity,
    growth and proliferation.
