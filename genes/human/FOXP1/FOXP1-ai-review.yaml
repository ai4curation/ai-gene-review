core_functions:
- description: Recognizes regulatory DNA and represses Pol II transcription in the nucleus. Human full-length
    FOXP1 reporter experiments, sequence-specific fragment binding, and functional SMRT recruitment establish
    this activity. Its output depends on the regulatory target, associated partners and splice form; activation
    of selected targets is also observed.
