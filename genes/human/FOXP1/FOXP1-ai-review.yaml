  review:
    action: KEEP_AS_NON_CORE
    summary: FOXP1 limits apoptosis in an activated human B-cell context.
    reason: Original PMID25267198 human primary memory-B-cell experiments show reduced caspase-dependent
      apoptosis and increased survival with CD40L or constitutive IKK2 signaling. Dye dilution did not
      show extra proliferation, and repression persisted without the survival benefit when the cooperating
      signal was absent. Retain the specific antiapoptotic process as non-core; it is a context-dependent
      consequence of transcriptional regulation, not universal B-cell survival activity.
