gene_symbol: FOXP1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'FOXP1 is a forkhead DNA-binding transcription factor that regulates gene expression in the
  nucleus through sequence-specific DNA recognition and association with transcriptional partners. It
  can recruit the SMRT corepressor and repress targets involved in myeloid differentiation, lymphocyte
  survival and other developmental programs. Its transcriptional effect depends on the target and cellular
  context: FOXP1 activates selected targets such as FBXL7, and an embryonic-stem-cell splice form changes
  DNA-binding preference and regulates pluripotency-associated genes. Human pathogenic variants link FOXP1
  to neurodevelopment, while human vascular-cell and lymphocyte experiments and mammalian models establish
  additional context-dependent roles in cell migration, differentiation, growth and survival. Alternative
  splicing changes the DNA-binding and other regions of the protein.'
