      mRNA decreases while protein is unchanged. The AR co-IP detects Foxp2, not Foxp1; Foxp1 coexpression
      is a separate observation. These source-specific expression responses support the existing non-core
      response judgment without transferring a paralog interaction or asserting a human assay.
