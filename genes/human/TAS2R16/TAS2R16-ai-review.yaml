suggested_questions:
- question: Has the complete native gustducin (GNAT3) -> PLCB2 -> IP3 -> TRPM5 signaling
    cascade been directly demonstrated for endogenous TAS2R16 in primary human taste
    receptor cells, as opposed to heterologous assays using engineered/chimeric
    G-protein constructs?
  experts:
  - Wolfgang Meyerhof
  - Maik Behrens
- question: Does the Asn172/Lys172 coding polymorphism produce a measurable difference
    in salicin/amygdalin bitterness perception thresholds or ingestive avoidance
    behavior in vivo, beyond the cell-based surface-expression and EC50 differences
    already shown?
  experts:
  - Wolfgang Meyerhof
- question: What is the physiological significance, if any, of TAS2R16 expression
    in testis, and of its reported extra-oral expression in sinonasal epithelium
    and gingival fibroblasts - are these loci of genuine receptor-mediated signaling
    or largely low-abundance transcriptional noise?
  experts: []
suggested_experiments:
- description: Immunolocalization of endogenous TAS2R16 (with organelle and RTP3/RTP4
    co-expression markers) in native taste bud tissue or taste-organoid cultures,
    to determine whether the ER/Golgi-to-plasma-membrane trafficking itinerary and
    RTP3/RTP4-dependence established in heterologous HEK293T cells also holds in
    the native cellular context.
  experiment_type: immunolocalization / co-localization microscopy
  hypothesis: Endogenous TAS2R16 traffics through the ER and Golgi to the apical
    plasma membrane of taste receptor cells, and this trafficking is enhanced by
    endogenous RTP3/RTP4 expression, mirroring the heterologous-cell findings of
    PMID:16720576.
- description: Calcium-imaging comparison of TAS2R16 Asn172 versus Lys172 variant
    receptors, and if feasible primary taste receptor cells or taste organoids from
    individuals of each genotype, challenged with a concentration series of salicin
    and amygdalin.
  experiment_type: functional calcium-flux / taste-perception assay
  hypothesis: The Asn172 variant confers greater cell-surface expression and agonist
    sensitivity than Lys172, translating into a lower behavioral/perceptual bitterness
    threshold for beta-glycopyranosides in Asn172 carriers.
