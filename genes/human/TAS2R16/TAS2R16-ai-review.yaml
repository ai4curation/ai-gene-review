      expression of TAS2Rs.
    action: MODIFY
    reason: 'The interaction is real and well supported (see supporting_text), but
      "protein binding" is uninformative per curation guidelines - it does not convey
      that RTP4 is a receptor-trafficking/escort chaperone for TAS2R16. GO:0051087
