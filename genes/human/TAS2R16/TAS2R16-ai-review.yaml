core_functions:
- description: >-
    Bitter chemoreceptor for beta-D-glycopyranosides. TAS2R16 is a
    seven-transmembrane GPCR that binds salicin and structurally related
    beta-glucosides/beta-mannosides (including plant cyanogenic and
    defense glycosides such as amygdalin and arbutin) via a broad TM3/TM7
    pocket that recognizes a conserved sugar group while tolerating a
    diverse aglycone; glucose alone does not activate the receptor. Upon
    agonist binding at the plasma membrane of gustducin-positive taste
    receptor cells, TAS2R16 couples to gustducin/G-protein signaling,
    contributing to the perception of bitter taste and to
    chemical-surveillance/avoidance of ingested beta-glycosides,
    including some toxic cyanogenic glycosides.
  molecular_function:
    id: GO:0033038
    label: bitter taste receptor activity
  directly_involved_in:
  - id: GO:0001580
    label: detection of chemical stimulus involved in sensory perception of bitter
      taste
