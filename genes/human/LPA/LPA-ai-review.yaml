id: P08519
gene_symbol: LPA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  LPA encodes apolipoprotein(a), a secreted, plasminogen-related glycoprotein whose
  repeated kringle IV scaffold is covalently disulfide-linked to apolipoprotein
  B-100 to form the extracellular plasma lipoprotein(a) particle. Kringle IV type
  2 is extensively copy-number polymorphic between alleles (2-43 copies); the
  UniProtKB P08519 represents a 15-copy reference allele, not an alternatively
  spliced isoform or a universal apo(a) length. Apo(a) kringles mediate binding to
  lysine-like sites and extracellular partners including fibronectin and
  apolipoproteins. On fibrin or other surfaces, these interactions can
  noncatalytically reduce tissue-type plasminogen activator-dependent plasminogen
  activation. Although apo(a) retains a trypsin-like domain and catalytic triad,
  its plasminogen-homologous activation junction is defective and recombinant
  studies found it proteolytically inactive; an older biochemical report of
  serine-proteinase activity remains disputed in light of the activation-site and
  recombinant evidence.
existing_annotations:
- term:
    id: GO:0004252
    label: serine-type endopeptidase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR001254
  - InterPro:IPR018114
  review:
    summary: >-
      Removed as a domain-to-GO over-annotation. Apo(a) contains a highly conserved
      trypsin-like domain and retains the catalytic His-Asp-Ser triad, but its
      PLG-homologous activation junction is S1819|I1820 rather than the cleavable
      R580|V581 junction of plasminogen.
    action: REMOVE
    reason: >-
      The two InterPro signatures establish a trypsin-like fold and an active-site
      histidine motif, not an activated enzyme. The reproducible sequence analysis
      found 88.58% identity to the plasminogen domain and retention of H1861, D1904,
      and S1990, but also replacement of the canonical P1 basic residue at the
      zymogen activation junction by serine and no UniProt cleavage annotation.
      This makes activity propagation from domain membership unsafe. It does not
      resolve the old IDA row, which is reviewed separately with curator deference.
    supported_by:
    - reference_id: file:human/LPA/LPA-bioinformatics/RESULTS.md
      supporting_text: >-
        At the homologous apo(a) protease-domain boundary, the sequence is
        S1819|I1820 and UniProt provides no cleavage annotation.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - PSEUDO_OR_SUBACTIVITY_LOSS
      source_entities:
      - source_id: InterPro:IPR001254
        source_label: Serine proteases, trypsin domain
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: The domain match establishes fold homology but cannot establish activation or catalysis.
      - source_id: InterPro:IPR018114
        source_label: Serine protease-like, trypsin family, histidine active site
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: The active-site signature is retained, but the PLG-like activation junction is not.
- term:
    id: GO:0006508
    label: proteolysis
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR001254
  - InterPro:IPR018114
  review:
    summary: >-
      Removed because this process annotation is propagated solely from protease
      signatures and inherits the same unresolved activation problem as the inferred
      serine-type endopeptidase activity.
    action: REMOVE
    reason: >-
      Participation in proteolysis requires demonstrated peptide-bond hydrolysis in
      the biological system; a protease-like fold alone is insufficient. Apo(a)
      retains the catalytic triad but lacks the PLG-homologous basic activation
      junction, providing a concrete LPA-specific reason not to transfer a generic
      proteolysis term from these signatures.
    supported_by:
    - reference_id: file:human/LPA/LPA-bioinformatics/RESULTS.md
      supporting_text: >-
        The S1819 substitution at the homologous PLG activation junction is a
        concrete reason to treat computationally propagated protease activity as
        suspect and pseudoenzyme over-annotation as biologically plausible.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - PSEUDO_OR_SUBACTIVITY_LOSS
      source_entities:
      - source_id: InterPro:IPR001254
        source_label: Serine proteases, trypsin domain
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: A fold signature does not show that LPA participates in proteolysis.
      - source_id: InterPro:IPR018114
        source_label: Serine protease-like, trypsin family, histidine active site
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Retention of one catalytic motif does not establish an activatable enzyme.
