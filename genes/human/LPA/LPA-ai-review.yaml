- id: PMID:14718574
  title: 'The human plasma proteome: a nonredundant list developed by combination
    of four separate sources.'
  findings:
  - statement: LPA was included in a nonredundant catalogue of proteins reported in human plasma or serum.
    supporting_text: We have merged four different views of the human plasma proteome, based on different methodologies, into a single nonredundant list of 1175 distinct gene products.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Supports extracellular/plasma occurrence only at proteome-catalogue level; it does not establish molecular function.
- id: PMID:2531657
  title: Lipoprotein(a) binds to fibronectin and has serine proteinase activity capable
    of cleaving it.
  findings:
  - statement: Purified Lp(a)/apo(a) bound immobilized fibronectin, with binding localized to fibronectin's C-terminal heparin-binding domain.
    supporting_text: The binding of Lp(a) was localized to the C-terminal heparin-binding domain of fibronectin.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: The study attributed fibronectin fragmentation and synthetic-substrate cleavage to a serine-proteinase-type activity of apo(a).
    supporting_text: The proteolytic activity of Lp(a) was localized to apo(a) and experiments with inhibitors indicated that the proteolytic activity was of serine proteinase-type.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: Correct source for the curator-read fibronectin-binding and experimental protease annotations, but only the abstract is cached. Its catalytic interpretation conflicts with PMID:3472206 and the recombinant apo(a) tests in PMID:7495809. Binding to a heparin-binding region of fibronectin is not direct evidence that apo(a) binds heparin.
- id: PMID:8047165
  title: Activation of transforming growth factor-beta is inhibited in transgenic
    apolipoprotein(a) mice.
  findings:
  - statement: Human apo(a) expression in transgenic mice inhibited plasminogen activation and consequently reduced TGF-beta activation.
    supporting_text: We show here that the activation of TGF-beta is inhibited in the aortic wall and serum of mice expressing apolipoprotein(a), as a consequence of apolipoprotein(a) inhibition of plasminogen activation.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Supports an antifibrinolytic consequence in a transgenic mouse model, not direct endopeptidase-inhibitor activity by apo(a).
- id: PMID:9269765
  title: Novel interaction of apolipoprotein(a) with beta-2 glycoprotein I mediated
    by the kringle IV domain.
  findings:
  - statement: A KIV-2 yeast two-hybrid screen identified beta-2-glycoprotein I, and coimmunoprecipitation confirmed apo(a)/Lp(a)-APOH interaction in plasma and cell supernatants.
    supporting_text: Coimmunoprecipitation experiments confirmed that beta-2 glycoprotein I and apo(a)/Lp(a) interact in human plasma and in cell culture supernatants of COS-1 cells, which ectopically expressed apo(a).
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Directly supports the APOH interaction; it does not define the core molecular function of apo(a).
- id: PMID:3472206
  title: Partial amino acid sequence of apolipoprotein(a) shows that it is homologous to plasminogen.
  findings:
  - statement: Apo(a) has a serine at the position homologous to the plasminogen activation-site arginine and was inactive in a plasmin-specific assay.
    supporting_text: Plasminogen is activated by the cleavage of a specific arginine residue by urokinase and tissue plasminogen activator; however, the corresponding site in apo(a) is a serine that would not be cleaved by tissue plasminogen activator or urokinase.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: The authors interpreted the biochemical and sequence results as an inactive protease domain.
    supporting_text: Using a plasmin-specific assay, no proteolytic activity could be demonstrated for lipoprotein(a) particles.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Decisive primary evidence for the activation-site defect and absence of plasmin-like activity; cached abstract only despite a PMC identifier.
- id: PMID:7495809
  title: Analysis of the proteolytic activity of a recombinant form of apolipoprotein(a).
  findings:
  - statement: Restoring an arginine at the activation junction permitted tPA cleavage but did not produce an active protease.
    supporting_text: However, tPA cleavage did not result in an active protease as both wildtype r-apo(a) and the mutant, either free or incorporated into r-Lp(a) particles, were uniformly inactive against a variety of chromogenic serine protease tripeptide substrates.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: Additional protease-domain substitutions, not only the Arg-to-Ser activation-site change, were inferred to disable apo(a) catalysis.
    supporting_text: The results of this study suggest that one or more of the substitutions present in the protease domain of apo(a), in addition to the Arg-->Ser substitution, render apo(a) proteolytically inactive.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Most decisive recombinant-protein counterevidence to a core serine-endopeptidase function; abstract only but reports multiple substrate, activation, DFP-labeling, and LDL-degradation tests.
- id: PMID:8366120
  title: Identification of the cysteine residue in apolipoprotein(a) that mediates extracellular coupling with apolipoprotein B-100.
  findings:
  - statement: Recombinant apo(a) formed covalent extracellular complexes with apoB-100-containing lipoprotein particles.
    supporting_text: However, covalent r-Lp(a) complexes were observed in the transfected cell supernatants.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: Site-directed mutagenesis identified apo(a) Cys4057 as participating in the disulfide linkage to apoB-100.
    supporting_text: Using site-directed mutagenesis, we demonstrated that Cys4057 in apo(a) is involved in disulfide linkage with apoB-100 in Lp(a) particles.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct primary evidence for extracellular covalent Lp(a) assembly and the apo(a) cysteine involved.
- id: PMID:7505444
  title: Cys4057 of apolipoprotein(a) is essential for lipoprotein(a) assembly.
  findings:
  - statement: Substitution of apo(a) Cys4057 prevented formation of lipoprotein-associated apo(a) in HepG2 supernatants.
    supporting_text: The same analysis performed with supernatants of cells transfected with plasmids mutated in codon 4057 revealed free apolipoprotein(a) glycoprotein without detectable amounts of lipoprotein-associated apolipoprotein(a).
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Independent mutational corroboration that the apo(a) cysteine/disulfide is essential for recombinant Lp(a)-like particle assembly.
- id: PMID:11802713
  title: Comparative analyses of the lysine binding site properties of apolipoprotein(a) kringle IV types 7 and 10.
  findings:
  - statement: Recombinant KIV-7 directly bound lysine analogues, but more weakly than the canonical KIV-10 lysine-binding site.
    supporting_text: Equilibrium binding analyses of the KIV(7) LBS using intrinsic fluorescence revealed an affinity for L-lysine and its analogues approximately 10-fold weaker (K(D) = 230 +/- 42 microM for epsilon-aminocaproic acid) than that of KIV(10) (K(D) = 33 +/- 4 microM for epsilon-aminocaproic acid).
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct biochemical definition of strong and weak lysine-binding sites in specific apo(a) kringles.
- id: PMID:7918682
  title: A single point mutation (Trp72-->Arg) in human apo(a) kringle 4-37 associated with a lysine binding defect in Lp(a).
  findings:
  - statement: A naturally occurring Trp-to-Arg apo(a) kringle variant abolished Lp(a) binding to lysine-Sepharose.
    supporting_text: For the first time we now report the occurrence of a human Lp(a) that has a mutant form of apo(a) where Arg has replaced Trp in position 72 of kringle 4-37 and is unable to bind to lysine Sepharose.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Human variant evidence tying the KIV-10-equivalent Trp residue to lysine binding; older kringle numbering is retained as reported.
- id: PMID:1829635
  title: Tissue-type plasminogen activator binds to and is inhibited by surface-bound lipoprotein(a) and low-density lipoprotein.
  findings:
  - statement: Surface-bound Lp(a), but not Lp(a) in solution, bound tPA and reduced its catalytic efficiency toward plasminogen.
    supporting_text: We now report that t-PA binds reversibly and saturably to surface-bound Lp(a) and to low-density lipoprotein (LDL) and that as a result of this binding activation of plasminogen by t-PA is inhibited.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct context-dependent evidence for antifibrinolytic action; the abstract explicitly says direct inhibition was not demonstrated in solution.
- id: PMID:12697748
  title: 'Inhibition of plasminogen activation by lipoprotein(a): critical domains in apolipoprotein(a) and mechanism of inhibition on fibrin and degraded fibrin surfaces.'
  findings:
  - statement: Lp(a) and recombinant apo(a) inhibited tPA-mediated plasminogen activation on fibrin cofactors.
    supporting_text: Human Lp(a) and a physiologically relevant, 17-kringle recombinant apo(a) species exhibited strong inhibition with both cofactors.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: Antifibrinolytic inhibition persisted without the protease domain and depended strongly on kringle lysine-binding determinants.
    supporting_text: A variant lacking the protease domain also exhibited strong inhibition, indicating that the apo(a)-plasminogen binding interaction mediated by the apo(a) protease domain does not ultimately inhibit plasminogen activation.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct domain-dissection evidence that apo(a)'s antifibrinolytic effect is noncatalytic and kringle-dependent.
- id: PMID:9524278
  title: The number of kringle IV repeats 3-10 is invariable in the human apo(a) gene.
  findings:
  - statement: Across alleles spanning 11-49 total kringles, KIV types 3-10 remained single-copy while KIV-2 accounted for size variation.
    supporting_text: Our analysis demonstrates that the number of kringles IV 3-10 is invariable in the human apo(a) gene, suggesting that the 3'domain of Apo(a) is functionally important.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct allele-structure evidence defining KIV-2 copy-number variation and preventing reference-sequence kringle counts from being generalized to all LPA products.
- id: PMID:3670400
  title: cDNA sequence of human apolipoprotein(a) is homologous to plasminogen.
  findings:
  - statement: The cloned apo(a) product contains repeated plasminogen-like kringles and a serine-protease-homologous domain.
    supporting_text: It contains a serine protease domain and two types of plasminogen-like kringle domains, one of which is present in 37 copies.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Foundational cDNA evidence for product architecture; the 37-copy allele is not a universal product boundary.
- id: Reactome:R-HSA-176879
  title: apolipoprotein(a) + LDL => Lp(a)
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Curated pathway record for extracellular Lp(a) assembly, independently supported mechanistically by PMID:8366120 and PMID:7505444.
