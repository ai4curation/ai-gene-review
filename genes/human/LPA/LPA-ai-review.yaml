    label: endopeptidase inhibitor activity
  evidence_type: TAS
  original_reference_id: PMID:8047165
  qualifier: enables
  review:
    summary: >-
      Modified to GO:0010757, negative regulation of plasminogen activation. The
      cited study demonstrates inhibition of a process, not direct stoichiometric
