- term:
    id: GO:0071827
    label: plasma lipoprotein particle organization
  evidence_type: IMP
  original_reference_id: PMID:7505444
  qualifier: involved_in
  review:
    summary: >-
      Apo(a) is directly required for formation of the Lp(a) particle through its
      cysteine-dependent association with apoB-100.
    action: NEW
    reason: >-
      Mutation of apo(a) Cys4057 yields secreted free apo(a) without detectable
      lipoprotein-associated apo(a), while independent site-directed mutagenesis
      identifies this cysteine in the defining disulfide linkage to apoB-100. These
      perturbation data support a direct role for LPA in plasma lipoprotein particle
      organization through formation of the Lp(a) particle. Unlike the narrower
      assembly term, GO:0071827 does not restrict the organizing interaction to a
      non-covalent mechanism.
    additional_reference_ids:
    - PMID:8366120
    supported_by:
    - reference_id: PMID:7505444
      supporting_text: >-
        The same analysis performed with supernatants of cells transfected with
        plasmids mutated in codon 4057 revealed free apolipoprotein(a) glycoprotein
        without detectable amounts of lipoprotein-associated apolipoprotein(a).
    - reference_id: PMID:8366120
      supporting_text: >-
        Using site-directed mutagenesis, we demonstrated that Cys4057 in apo(a) is
        involved in disulfide linkage with apoB-100 in Lp(a) particles.
references:
- id: file:human/LPA/LPA-bioinformatics/RESULTS.md
  title: LPA protease-domain sequence compatibility analysis
  findings:
  - statement: The P08519 protease-like domain retains the aligned His-Asp-Ser charge-relay residues.
    supporting_text: 'All three PLG charge-relay residues map without a gap to the same residue type in P08519: PLG H622/D665/S760 correspond to apo(a) H1861/D1904/S1990.'
  - statement: The plasminogen activation-site arginine is replaced by serine in P08519, providing sequence evidence for an activation-defective domain.
    supporting_text: 'At the homologous apo(a) protease-domain boundary, the sequence is S1819|I1820 and UniProt provides no cleavage annotation.'
  - statement: The sequence analysis does not itself prove absolute catalytic inactivity or negate curator-read experimental evidence.
    supporting_text: 'This sequence result cannot establish absolute inactivity. It neither reproduces nor refutes the older experimental report associated with UniProt''s “serine proteinase activity” statement, and it cannot exclude noncanonical cleavage, context-dependent activity, or activity attributed to another component or contaminant in an Lp(a) preparation.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Reproducible local sequence/domain analysis; directly frames the intact catalytic triad, defective activation junction, and limits of sequence-only inference.
- id: file:human/LPA/LPA-uniprot.txt
  title: UniProtKB entry P08519 (APOA_HUMAN), cached in the gene folder
  findings:
  - statement: The reference record bounds the extensive KIV-2 copy-number polymorphism.
    supporting_text: Depending on the individual, the encoded protein contains 2-43 copies
  - statement: P08519 represents a specific 15-copy reference allele rather than a universal apo(a) product length.
    supporting_text: here contains 15 copies of the kringle-type repeats.
  - statement: UniProt attributes serine-proteinase/autoproteolysis to the single older catalytic report.
    supporting_text: has serine proteinase activity and is able of autoproteolysis. Inhibits
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: The sequence, domain, polymorphism, and particle-subunit statements are authoritative for the cached reference allele. Its catalytic FUNCTION wording cites only PMID:2531657 and conflicts with PMID:3472206 and PMID:7495809, so that specific claim is disputed rather than treated as established core activity.
