knowledge_gaps:
- gap_statement: >-
    Whether apo(a) ever acquires intrinsic serine-endopeptidase activity in a
    physiological context remains unresolved.
  boundary: >-
    The protease-like domain retains the His-Asp-Ser triad, but the canonical
    plasminogen activation-site arginine is replaced by serine, recombinant
    apo(a) remained inactive even after an engineered activation-site restoration,
    and only one older curator-read study reports apo(a)-localized proteolysis.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: >-
    Resolving the conflict determines whether the experimental protease annotation
    represents a rare context-dependent activity or an assay-specific attribution;
    current evidence does not justify making catalysis a core function.
  resolution: >-
    Reconstitute purified, sequence-defined apo(a) and Lp(a) preparations with
    activation-state controls, orthogonal substrates, active-site labeling, and
    protease-contamination controls.
  provenance:
  - reference_id: file:human/LPA/LPA-bioinformatics/RESULTS.md
    supporting_text: This sequence result cannot establish absolute inactivity.
- gap_statement: >-
    The relative physiological contributions of individual apo(a) kringle
    interactions to Lp(a) deposition and antifibrinolytic activity are not defined
    across the natural range of KIV-2 copy-number alleles.
  boundary: >-
    Strong and weak lysine-binding sites have been measured in isolated kringles,
    and a lysine-binding-site variant abolishes lysine-Sepharose binding, while
    natural alleles vary specifically in KIV-2 repeat count.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: >-
    Allele-specific avidity could connect apo(a) size polymorphism to particle
    localization and inhibition of plasminogen activation without invoking
    different splice isoforms.
  resolution: >-
    Compare matched recombinant apo(a)/Lp(a) particles spanning KIV-2 copy number
    and targeted kringle lysine-site mutations in quantitative fibrin, fibronectin,
    and plasminogen-activation assays.
- gap_statement: >-
    The biological consequence of the directly observed apo(a)-APOH interaction is
    unknown.
  boundary: >-
    APOH was identified with KIV-2 and coimmunoprecipitated with apo(a)/Lp(a) in
    human plasma and cell-culture supernatants, but the accessible study does not
    establish a downstream molecular or physiological effect.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: >-
    Establishing an effect would clarify how this core apolipoprotein-binding
    activity influences Lp(a) biology beyond the demonstrated physical contact.
  resolution: >-
    Test whether APOH changes Lp(a) assembly, fibrin/fibronectin binding,
    plasminogen activation, or cellular uptake using APOH depletion and add-back.
proposed_new_terms: []
suggested_questions:
- question: >-
    Under what physiological activation state, if any, can apo(a)'s protease-like
    domain cleave a substrate despite its noncanonical activation junction and the
    negative recombinant-protein studies?
- question: >-
    How does natural KIV-2 copy number alter the avidity and geometry of apo(a)
    binding to fibrin, fibronectin, lysine-like sites, and apolipoprotein partners?
- question: >-
    Does APOH binding measurably change Lp(a) assembly, extracellular retention,
    uptake, or antifibrinolytic activity in human plasma?
suggested_experiments:
- hypothesis: >-
    Physiological apo(a) is activation-defective and lacks intrinsic
    serine-endopeptidase activity.
  description: >-
    Purify sequence-defined apo(a) and covalent Lp(a) particles under
    protease-free conditions, compare wild type with activation-junction and
    catalytic-serine mutants, verify processing by intact-mass spectrometry and
    N-terminal sequencing, and test fibronectin plus orthogonal peptide substrates
    with active-site probes and contaminating-protease spike-in controls.
  experiment_type: biochemical protease reconstitution and active-site profiling
- hypothesis: >-
    Apo(a) KIV-2 copy number quantitatively changes multivalent extracellular
    binding and surface-dependent inhibition of plasminogen activation.
  description: >-
    Produce an allelic series of otherwise matched recombinant apo(a)/Lp(a)
    particles with defined KIV-2 copy counts, then measure fibrin, degraded-fibrin,
    fibronectin, and lysine-analogue binding together with tPA-dependent plasmin
    generation on each surface.
  experiment_type: allele-resolved binding and fibrinolysis assay
- hypothesis: >-
    The KIV-10 strong lysine-binding site is required for apo(a)'s
    surface-dependent antifibrinolytic effect, whereas the protease-like domain is
    dispensable.
  description: >-
    Compare full-length apo(a), a protease-domain deletion, and precise KIV-10
    lysine-site mutants in matched Lp(a) particles using fibrin-clot plasminogen
    activation and lysis assays; confirm equivalent APOB coupling and particle
    abundance before functional comparison.
  experiment_type: domain-resolved structure-function analysis
- hypothesis: >-
    APOH binding modulates a specific extracellular property of Lp(a) rather than
    merely reporting a detectable physical interaction.
  description: >-
    Immunodeplete APOH from human plasma and restore it at physiological
    concentration, then quantify Lp(a) assembly state, fibronectin/fibrin binding,
    plasminogen activation, and receptor-mediated uptake with an apo(a) KIV-2
    interaction-site mutant as a specificity control.
  experiment_type: plasma depletion and add-back functional assay
