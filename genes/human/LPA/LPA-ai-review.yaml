- term:
    id: GO:0004252
    label: serine-type endopeptidase activity
  evidence_type: IDA
  original_reference_id: PMID:2531657
  qualifier: enables
  review:
    summary: >-
      Undecided. The curator-read 1989 study reports apo(a)-localized serine
      proteinase-type activity, but only its abstract is cached and sequence analysis
      identifies a noncanonical, plausibly activation-defective junction.
    action: UNDECIDED
    reason: >-
      Curator deference precludes removal of this IDA annotation without assessing
      the full purification, activation, inhibitor, and contaminant-control details.
      The abstract reports reproducible fibronectin cleavage, peptide-substrate
      specificity, localization of activity to apo(a), and serine-proteinase-type
      inhibitor behavior. In tension with that report, P08519 retains the catalytic
      triad but replaces the PLG R|V activation junction with S|I. The sequence
      result supports neither acceptance nor confident rejection of the old assay.
    supported_by:
    - reference_id: PMID:2531657
      supporting_text: >-
        The proteolytic activity of Lp(a) was localized to apo(a) and experiments
        with inhibitors indicated that the proteolytic activity was of serine
        proteinase-type.
    - reference_id: file:human/LPA/LPA-bioinformatics/RESULTS.md
      supporting_text: >-
        This sequence result cannot establish absolute inactivity.
