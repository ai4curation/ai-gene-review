    unpaired cysteine to form the defining extracellular disulfide linkage with
    apolipoprotein B-100. This covalent partnership incorporates apo(a) into the
    plasma lipoprotein(a) particle; it does not imply a broader role in lipid
    metabolism or blood circulation.
