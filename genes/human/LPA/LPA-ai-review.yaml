- term:
    id: GO:0006629
    label: lipid metabolic process
  evidence_type: NAS
  original_reference_id: PMID:8047165
  qualifier: involved_in
  review:
    summary: >-
      Marked as over-annotated. Apo(a) is a lipoprotein component, but the cited
      experiment concerns inhibition of plasminogen and TGF-beta activation rather
      than lipid synthesis, transport, or catabolism.
    action: MARK_AS_OVER_ANNOTATED
