knowledge_gaps:
- gap_statement: No experimentally solved structure of TAS2R38 exists. The proposed PTC/PROP binding pocket
    (residues including N103, F197, W201, F264) rests entirely on homology modeling validated by
    site-directed mutagenesis and calcium-imaging responses, not on a direct TAS2R38 structure - even
    though cryo-EM structures now exist for other human TAS2Rs (e.g. TAS2R14).
  boundary: 'Known: PTC/PROP agonism, PAV/AVI haplotype effects, and >20 mutagenesis-tested pocket residues.
    Unknown: the actual three-dimensional agonist-bound (or gustducin-bound) conformation of TAS2R38.'
  gap_kind:
  - BIOLOGY
  provenance:
  - reference_id: file:human/TAS2R38/TAS2R38-deep-research-falcon.md
    supporting_text: no retrieved study supplied an experimentally solved atomic structure of TAS2R38 itself
- gap_statement: Whether TAS2R38 itself is directly activated by bacterial quorum-sensing metabolites
    (e.g. Pseudomonas acyl-homoserine lactones) proposed to drive sinonasal innate-defense signaling is
    unresolved at the receptor-ligand level; pathway-level (calcium/NO/ciliary) responses in airway
    epithelium are reported, but at least one heterologous-system study disputed direct AHL activation of
    T2R38 and identified other volatile bacterial metabolites instead, and other airway TAS2Rs also
    contribute to bacterial-metabolite sensing. No GOA annotation for this putative role exists, and none
    is proposed here pending receptor-level resolution.
  boundary: 'Known: sinonasal ciliated-cell TAS2R38 activation correlates with NO production, ciliary beat
    frequency, and PAV/AVI-dependent antibacterial killing in primary cultures. Unknown: the identity and
    receptor-specificity of the direct activating ligand(s) in this context.'
  gap_kind:
  - BIOLOGY
  provenance:
  - reference_id: file:human/TAS2R38/TAS2R38-deep-research-falcon.md
    supporting_text: one calcium-imaging study disputed direct HSL activation in its heterologous system and
      instead identified several volatile bacterial metabolites
suggested_questions:
- question: The GO:0005886 IDA row sourced to PMID:12379855 (Bufe et al. 2002, Nat Genet) carries a title
    and cached abstract about TAS2R16, not TAS2R38, yet UniProt's own reference list cites the identical
    PMID as the source of the TAS2R38 genomic sequence and the Val262 variant. Can the full text be
    confirmed to report a direct plasma-membrane localization assay for TAS2R38 itself (as opposed to
    TAS2R16), so the CACAO annotation's exact experimental basis is documented?
  experts:
  - GOA curators
  - CACAO curators
- question: Given that TAS2R38's own accession already carries direct plasma-membrane evidence (IDA plus
    five Reactome TAS statements), would GO_Central consider adding a plasma-membrane-specific term
    (alongside, or refining, the generic "membrane") at PANTHER node PTN000149628 for the wider TAS2R
    clade, most of whose members currently receive only the generic parent by IBA?
  experts:
  - GO_Central PAINT curators
suggested_experiments:
- description: Solve an agonist-bound (PTC or PROP) TAS2R38-gustducin cryo-EM structure, following the
    approach recently used for TAS2R14, to directly test the mutagenesis-based binding-pocket model
    (residues including N103, F197, W201, F264) against real structural data.
  hypothesis: The computationally predicted PTC/PROP binding pocket residues form the actual
    agonist-contacting surface in a solved TAS2R38 structure.
- description: Test purified/heterologously-expressed TAS2R38 directly against defined bacterial
    quorum-sensing metabolites (acyl-homoserine lactones and the volatile metabolites proposed as
    alternative ligands) in a controlled calcium-imaging or BRET assay, to resolve whether TAS2R38 itself
    (versus other airway TAS2Rs) is the receptor responsible for bacterial-metabolite-triggered sinonasal
    innate-defense signaling.
  hypothesis: TAS2R38 is directly activated by one or more defined bacterial metabolites, distinct from its
    PTC/PROP pharmacology, accounting for its proposed role in mucociliary antibacterial defense.
- description: Compare cell-surface trafficking/expression of PAV versus AVI TAS2R38 protein (e.g. by
    surface biotinylation or flow cytometry of tagged constructs) alongside their agonist-response
    magnitude, to determine whether the AVI hypofunctional phenotype reflects reduced plasma-membrane
    trafficking, reduced intrinsic agonist affinity/efficacy, or both.
  hypothesis: The AVI haplotype's hypofunction is at least partly due to reduced plasma-membrane surface
    expression rather than purely reduced ligand-binding affinity.
