      activates nitric-oxide synthase.
core_functions:
- description: 'Detects thiourea-containing bitter agonists - principally PTC and PROP, and related dietary
    compounds such as goitrin - at the plasma membrane of type II taste receptor cells, and transduces
    that detection through the gustducin-PLCbeta2-IP3/Ca2+-TRPM5 cascade shared by other type II
    bitter/sweet/umami taste GPCRs. Receptor function is under common genetic control: three linked coding
    variants (residues 49, 262, 296) define PAV ("taster") and AVI (hypofunctional, "non-taster")
    haplotypes that explain much of the classical PTC/PROP bitter-sensitivity polymorphism in humans.'
