description: 'TAS2R38 (T2R38) is a human bitter-taste type 2 receptor (T2R/TAS2R family), a class-A-like,
  intronless seven-transmembrane G protein-coupled receptor encoded on chromosome 7. It is expressed in
  a subset of gustducin-positive taste receptor cells of the tongue and soft palate, and more broadly in
  extraoral epithelia including the motile cilia of sinonasal respiratory epithelium, gastrointestinal
  enteroendocrine cells, placenta, and leukocytes. TAS2R38 is the principal human receptor for phenylthiocarbamide
  (PTC) and the structurally related synthetic thyroid drug 6-n-propylthiouracil (PROP), and for other
  naturally occurring thiourea (N-C=S)-containing compounds such as goitrin found in cruciferous vegetables.
  Upon agonist binding, the receptor couples to the taste-specific heterotrimeric G protein gustducin and,
  through its beta-gamma subunits, activates phospholipase C beta 2, generating IP3 that releases Ca2+
  from intracellular stores and gates the cation channel TRPM5, driving depolarization and ATP release
  onto gustatory afferent nerve fibers - the canonical transduction cascade shared with other type II
  taste-cell bitter/sweet/umami GPCRs. The gene is genetically polymorphic: three tightly linked missense
  variants at residues 49 (Ala/Pro), 262 (Ala/Val) and 296 (Val/Ile) define the common PAV ("taster") and
  AVI (hypofunctional, "non-taster") haplotypes that account for much of the classical PTC/PROP
  bitter-taste-sensitivity polymorphism in humans. Outside the tongue, TAS2R38 is also expressed on motile
  cilia of upper-airway epithelial cells, where receptor activation raises intracellular calcium and has
  been linked to nitric-oxide-synthase activity, nitric-oxide-dependent antibacterial defense, and
  increased ciliary beat frequency, connecting the receptor to mucociliary innate defense of the sinonasal
  mucosa.'
