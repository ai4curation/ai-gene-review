core_functions:
- description: CAVIN1 forms oligomeric units of the caveolar coat and supplies a structural
    scaffold associated with caveolins and other cavins. Human-cell crosslinking, coat purification
    and ultrastructure support a physical coat contribution. It is a peripheral cytoplasmic
    coat protein, and the exact direct caveolin-contact mechanism remains unresolved.
  molecular_function:
    id: GO:0140378
    label: protein complex scaffold activity
  locations:
  - id: GO:0005901
    label: caveola
  supported_by:
  - reference_id: PMID:24013648
    supporting_text: form a distinct coat all around the caveolar bulb
  - reference_id: PMID:19525939
  - reference_id: PMID:19726876
- description: A nuclear CAVIN1/PTRF pool recognizes nascent pre-rRNA and contributes to release
    of paused RNA polymerase I complexes, enabling subsequent transcriptional recycling. Sequence-sensitive
    RNA recognition and release were established with murine PTRF; human adipocytes contain
    a nuclear pool, and inherited annotations support the conserved role. Mouse cellular studies
    add regulated nuclear localization and transcription-complex association. The mechanism
    does not assign RNA polymerase catalysis, direct DNA binding or first-round promoter initiation
    to CAVIN1.
  molecular_function:
    id: GO:0042134
    label: rRNA primary transcript binding
  directly_involved_in:
  - id: GO:0006363
    label: termination of RNA polymerase I transcription
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:9582279
    supporting_text: 'specific binding of PTRF to transcripts containing the 3'' end of

      pre-rRNA'
  - reference_id: PMID:11139612
    supporting_text: PTRF-mediated release of pre-rRNA
  - reference_id: PMID:27528195
suggested_questions:
- question: Which full-length human CAVIN1 assays directly establish pre-rRNA binding and transcript
    release, and does CAVIN1 perform a promoter-initiation step beyond the release-driven recycling
    demonstrated in mouse systems?
- question: Can the mitochondrial and ER annotations be traced to organelle-specific controls
    rather than combined fractions or unresolved donor transfers?
- question: What experimental donor mechanisms support the secretion and positive-motility transfers,
    and do they establish CAVIN1 participation or indirect consequences of altered caveolae?
- question: Do the three reviewed alternative products differ in coat assembly or nuclear transcript-release
    function? Existing assays are not assigned to unverified isoforms.
