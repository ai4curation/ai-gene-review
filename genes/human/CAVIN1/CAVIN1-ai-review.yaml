id: Q6NZI2
gene_symbol: CAVIN1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CAVIN1 (PTRF) is a peripheral caveolar coat protein that oligomerizes and associates
  with caveolins and other cavins on the cytoplasmic surface of caveolae. It supplies a structural
  framework for the coat and is important for stable caveola formation in adipose, muscle and
  other cells. Human biallelic loss causes congenital generalized lipodystrophy with muscular
  dystrophy and secondary caveolin deficiency. A smaller nuclear pool is observed in human adipocytes.
  Its conserved transcript-release role is supported principally by murine biochemical and cellular
  studies, in which PTRF recognizes nascent ribosomal RNA and facilitates release of paused
  RNA polymerase I complexes and transcriptional recycling.
