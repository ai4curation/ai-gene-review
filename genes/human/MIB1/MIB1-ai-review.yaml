core_functions:
- description: >-
    RING-type E3 ubiquitin ligase that binds the N-box and C-box epitopes of Notch ligand
    (JAG1, DLL) cytoplasmic tails and transfers ubiquitin to them, marking ligands for epsin-dependent
    endocytosis that is required for Notch activation in the neighbouring cell.
