suggested_questions:
- question: >-
    How does MIB1 partition between Notch ligand tails at the plasma membrane and centriolar
    satellite substrates, and is this regulated during differentiation?
- question: >-
    Which ligand lysines are ubiquitinated by MIB1 in vivo, given that N/C-box lysine mutants
    retain signaling?
suggested_experiments:
- description: >-
    Use MIB1 knockout human cells reconstituted with MZM/REP interface mutants in sender-receiver
    co-culture to quantify ligand endocytosis and NOTCH1 activation.
