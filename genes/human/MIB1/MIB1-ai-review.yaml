id: Q86YT6
gene_symbol: MIB1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  MIB1 (Mind bomb 1) is a large multi-domain RING-type E3 ubiquitin-protein ligase (EC 2.3.2.27).
  Its N-terminal substrate-recognition region (MZM domain, flanked by two Mib-Herc2 modules,
  and the REP ankyrin/repeat region) engages two separate epitopes in the cytoplasmic tails
  of Notch ligands (the membrane-proximal N-box and a C-terminal C-box of JAG1 and Delta-like
  ligands), and its C-terminal RING domains recruit the E2 to transfer ubiquitin onto ligand
  lysines. Ligand ubiquitination by MIB1 triggers epsin-dependent endocytosis in the signal-sending
  cell, which generates the mechanical force required for Notch S2 cleavage and activation;
  MIB1 is the dominant ligand E3 ligase in mammals and is required for essentially all ligand-dependent
  Notch signaling during development. MIB1 also localizes to centriolar satellites, where
  it ubiquitinates PCM1, CEP131, CEP290 and GABARAP (restraining ciliogenesis and GABARAP-dependent
  autophagy), and it mediates K63-linked ubiquitination of TBK1 in antiviral RNA sensing and
  ubiquitination-dependent degradation of SMN.
