- term:
    id: GO:0045747
    label: positive regulation of Notch signaling pathway
  evidence_type: IMP
  original_reference_id: PMID:25747658
  review:
    summary: >-
      Human MIB1 ubiquitinates JAG1 at two recognition epitopes; disrupting either interface
      impairs ligand-induced Notch signaling and fly rescue.
    action: NEW
    reason: >-
      MIB1 performs a step in ligand activation (ubiquitin transfer to the ligand tail) rather
      than being a substrate, so it passes the participation test. Comparator: NEURL1 and
      MIB2, the other ligand E3s, carry Notch-positive regulation annotations in other species
      (Drosophila neur/mib1). GO:0007219 (IBA) is already accepted; this adds the experimentally
      supported regulatory direction.
    supported_by:
    - reference_id: PMID:25747658
      supporting_text: >-
        Individual mutation of either the N- or C-box epitope also attenuated the extent of
        ubiquitination, suggesting that the two binding sites cooperate to achieve efficient
        ubiquitin transfer.
    - reference_id: PMID:25747658
      supporting_text: >-
        wild-type human Mib1 was sufficient for robust rescue of Wg expression along the dorsal/ventral
        boundary in a manner similar to fly Mib1
    - reference_id: PMID:25747658
      supporting_text: >-
        This ubiquitination step marks the ligand proteins for epsin-dependent endocytosis,
        which is critical for in vivo Notch receptor activation.
