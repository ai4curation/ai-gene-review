  evidence_type: IDA
  original_reference_id: PMID:31708432
  qualifier: involved_in
  review:
    summary: Seipin and LDAF1 define lipid-droplet assembly sites.
    action: ACCEPT
    reason: Endogenous tagging, live imaging and relocalization experiments in human SUM159
      cells show droplets emerging at LDAF1–seipin sites and following ectopically recruited
      assembly machinery. The purified-complex experiments use recombinant seipin residues
      1–310 and LDAF1 in mammalian cells, so they are not claimed to assay every full-length
      isoform. Seipin supplies part of the organizing structure; this is process participation
      rather than a necessity-only inference. The proposed triglyceride phase-transition mechanism
      does not imply chemical triglyceride synthesis by seipin.
