- term:
    id: GO:0140042
    label: lipid droplet formation
  evidence_type: IMP
  original_reference_id: PMID:27879284
  qualifier: involved_in
  review:
    summary: Human seipin supports functional ER–LD contacts and droplet growth.
    action: ACCEPT
    reason: Human A431 knockout, WT rescue, endogenous tagging, patient fibroblasts and cargo-flux
      experiments in PMID:27879284 link seipin to productive droplet biogenesis. Initial neutral-lipid
      synthesis and initial cargo recruitment are not abolished; later ER–LD exchange and
      growth are defective. This identifies a structural organization and delivery role within
      droplet formation, without attributing lipid-synthetic chemistry to seipin.
    supported_by:
    - reference_id: PMID:27879284
- term:
    id: GO:0170007
    label: endoplasmic reticulum-lipid droplet tether activity
  evidence_type: IDA
  original_reference_id: PMID:27879284
  review:
    summary: Seipin provides a membrane-contact tether that supports exchange between the
      ER and growing lipid droplets.
    action: NEW
    reason: GO:0170007 describes membrane-lipid binding that brings ER and lipid droplets
      together for contact and exchange. In human A431 cells, PMID:27879284 combines endogenous
      localization, knockout, wild-type rescue, ultrastructure and cargo-flux assays; a subset
      of droplets detaches and remaining contacts become abnormal after seipin loss. Patient
      fibroblasts corroborate altered droplet dynamics. PMID:31178403 supplies complementary
      contact-relocation and acute-depletion evidence, while PMID:30293840 directly reports
      human seipin lipid binding. Together these identify a structural contact activity rather
      than inferring it from localization or knockout necessity alone. The term is an adaptor
      MF, not an ancestor or descendant of the retained phospholipid-binding MF or a new biological-process
      assertion. No purified minimal human tether reconstitution is claimed.
    supported_by:
    - reference_id: PMID:27879284
    - reference_id: PMID:31178403
    - reference_id: PMID:30293840
