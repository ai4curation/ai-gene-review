- term:
    id: GO:0120162
    label: positive regulation of cold-induced thermogenesis
  evidence_type: ISS
  original_reference_id: PMID:27748422
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q9Z2E9
  review:
    summary: Reduced cold-adaptive thermogenesis is a downstream phenotype of generalized
      seipin-deficient lipodystrophy in this mouse study.
    action: MARK_AS_OVER_ANNOTATED
    reason: PMID:27748422 reports reduced maximal norepinephrine-stimulated thermogenic capacity
      and persistent shivering in cold-acclimated global Bscl2-knockout mice. In the tested
      brown-adipocyte cultures, some thermogenic transcripts and UCP1 protein were reduced,
      but basal and beta3-stimulated respiration, lipolysis and insulin signaling were largely
      preserved. The authors interpret the organismal defect through white-fat failure, substrate/adipokine
      supply and secondary insulin resistance. Non-cell-autonomous regulation can satisfy
      GO:0120162; that feature alone is not a reason to reject the term. Here, however, the
      experiments do not distinguish a specific seipin-mediated thermogenic regulatory step
      from the systemic consequences of lipodystrophy. Mark the mouse-to-human assignment
      as over-annotated while retaining the real physiological phenotype and its limits.
    supported_by:
    - reference_id: PMID:27748422
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - CONTEXT_OR_TISSUE_MISMATCH
      - GRANULARITY_MISMATCH
