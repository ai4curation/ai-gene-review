id: Q96G97
gene_symbol: BSCL2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Seipin, encoded by BSCL2, is an oligomeric integral endoplasmic reticulum membrane
  protein that organizes lipid droplet biogenesis. Its conserved lumenal domain binds anionic
  phospholipids, and seipin associates with LDAF1 to define sites where neutral lipids assemble
  into droplets. Seipin tethers growing lipid droplets to the ER and organizes their membrane
  contacts, supporting delivery of lipids and proteins and maintaining an organized droplet
  population. These functions contribute to cellular lipid storage and adipose tissue physiology.
  Biallelic loss causes congenital generalized lipodystrophy, whereas specific dominant variants
  that affect folding or glycosylation are associated with motor neuropathy.
