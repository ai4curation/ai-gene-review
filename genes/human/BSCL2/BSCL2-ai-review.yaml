  qualifier: involved_in
  review:
    summary: Seipin is required for productive maturation of nascent droplets.
    action: ACCEPT
    reason: Most detailed dynamics in PMID:27564575 use Drosophila S2 cells, but the inspected
      study also tests seipin-deficient human SUM159 cells and patient fibroblasts and reports
      the abnormal early-droplet phenotype. Human seipin rescues the fly depletion phenotype.
      Together these support the conserved formation/maturation role while keeping the fly-specific
      domain and imaging experiments distinct from direct human assays.
