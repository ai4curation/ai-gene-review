- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:36115835
  qualifier: enables
  supporting_entities:
  - UniProtKB:O75970
  review:
    summary: The reported interaction is a PDZ-domain/motif binding assay.
    action: MODIFY
    reason: The source quantitatively assays PDZ domains against human protein C-terminal PDZ-binding
      motifs. The curated ACVR2A interaction belongs to this assay class, and independent ActRIIA C-terminal
      mapping corroborates PDZ-domain binding. Refine the molecular interaction without treating every
      fragment hit as an established physiological full-length complex. Supplementary Dataset 1 explicitly
      includes ACVR2A/P27037 peptide VDFPPKESSL; the PDZ-PBM interactome sheet reports fluorescence-polarization
      affinities for DLG4_3, SCRIB_1, SNX27 and MAST2, corroborating the assay class.
    proposed_replacement_terms:
    - id: GO:0030165
      label: PDZ domain binding
    supported_by:
    - &id005
      reference_id: PMID:36115835
      supporting_text: Here, we measure the affinities of 65,000 interactions involving PDZ domains and
        their target PDZ-binding motifs (PBM) within a human interactome region particularly relevant
        for viral infection and cancer.
    - &id006
      reference_id: PMID:16648306
      supporting_text: ARIP2, ARIP2b and ARIP2c recognize COOH-terminal residues of ActRIIA that match
        a PDZ-binding consensus motif.
    - reference_id: file:human/ACVR2A/ACVR2A-notes.md
      supporting_text: 'The `PDZ-PBM interactome` sheet contains 266 ACVR2A/P27037 rows for the natural

        and assayed peptide `VDFPPKESSL`.'
