id: P27037
gene_symbol: ACVR2A
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ACVR2A is a single-pass plasma-membrane type II serine/threonine kinase receptor for activins
  and several other TGF-beta-superfamily ligands. Its extracellular domain binds ligand, and its intracellular
  kinase phosphorylates a partner type I receptor, which then activates SMAD-dependent transcriptional
  responses. With ACVR1B/ALK4 it mediates activin signaling; with appropriate BMP type I receptors it
  also transduces BMP signals, with ligand and co-receptor context determining receptor utilization. Inhibin
  binding together with betaglycan can sequester ACVR2A into antagonist complexes that do not recruit
  the signaling type I receptor. Receptor oligomerization and C-terminal PDZ-adaptor interactions contribute
  to complex assembly and trafficking. Downstream effects include developmental patterning, erythroid
  differentiation and context-dependent regulation of osteoblast function.
alternative_products:
- name: '1'
  id: P27037-1
- name: '2'
  id: P27037-2
  sequence_note: VSP_054689
existing_annotations:
- term:
    id: GO:0001649
    label: osteoblast differentiation
  evidence_type: IDA
  original_reference_id: PMID:18436533
  qualifier: involved_in
  review:
    summary: ACVR2A supports BMP-dependent osteoblast differentiation and bone-forming responses.
    action: KEEP_AS_NON_CORE
    reason: Primary human mesenchymal-cell experiments couple BMP receptor knockdown to osteogenic marker
      responses; the study also measures BMP-induced matrix mineralization. These supported physiological
      outputs are context-dependent and peripheral to the receptor mechanism. They do not contradict the
      negative effect of activin-ACVR2A signaling on bone mass in mouse osteoblasts.
    supported_by:
    - reference_id: PMID:18436533
      supporting_text: RNA interference-mediated gene knockdown revealed that osteoinductive BMP activities
        in hMSC are elicited through the type I receptors ACVR1A and BMPR1A and the type II receptors
        ACVR2A and BMPR2.
- term:
    id: GO:0001934
    label: positive regulation of protein phosphorylation
  evidence_type: IMP
  original_reference_id: PMID:17472960
  qualifier: acts_upstream_of_or_within
  review:
    summary: ACVR2A promotes downstream phosphorylation in an RGMa-dependent BMP context.
    action: KEEP_AS_NON_CORE
    reason: The reported receptor requirement supports positive regulation of protein phosphorylation
      through BMP signal propagation. This precise regulatory outcome is peripheral to the defining ligand-binding
      receptor kinase activity and does not imply direct phosphorylation of every downstream target.
    supported_by:
    - reference_id: PMID:17472960
      supporting_text: These findings suggest that RGMa facilitates the use of ActRIIA by endogenous BMP2
        and BMP4 ligands that otherwise prefer signaling via BMPRII and that increased utilization of
        ActRIIA leads to generation of an enhanced BMP signal.
