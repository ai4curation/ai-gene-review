      supporting_text: the R58Q mutant did not bind Ca(2+)
    - &id002
      reference_id: PMID:11102452
      supporting_text: Whereas phosphorylation of wild-type light chain decreased its Ca(2+) affinity
    - reference_id: file:human/MYL2/MYL2-uniprot.txt
