  review:
    summary: 'MYL2 has a canonical calcium-coordinating loop in its first EF hand (UniProt binding sites
      D37, D39, D41, D48). Recombinant human MYL2 binds Ca2+ with a measurable affinity that is changed
      by HCM mutations and by Ser15 phosphorylation (Szczesna et al. 2001). The site is the Ca2+/Mg2+
      site typical of regulatory light chains. This IBA comes from PAINT node PTN000549442 (sarcomeric
      RLCs: MYL2, MYL7, MYLPF, MYL10), for which MYL2 itself is the experimental donor.'
    action: ACCEPT
    reason: Direct human biochemical evidence (IDA on this gene) plus conserved EF-hand loop; the IBA
      correctly records that this property is inherited across the sarcomeric RLC clade. MYL2 appearing
      in its own WITH/FROM is the expected grounding, not circularity. Calcium binding is a supporting
      property; its physiological role at the RLC site (Mg2+ occupied at rest) is not fully resolved.
    supported_by:
