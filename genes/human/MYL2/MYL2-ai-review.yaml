suggested_questions:
- question: Is the actin monomer binding annotation from PMID:9180271 a mis-attribution of the essential
    light chain (MYL3, 'VLC-1') result to MLC-2v (MYL2)? The abstract names only MLC-1 peptides.
- question: The cytoskeleton and actin cytoskeleton IDA rows from PMID:17043135 rely on Thr18/Ser19 phospho-MLC2
    antibodies in non-muscle cells, which detect MYL9/MYL12A/MYL12B. Should they be moved to the nonmuscle
    RLC genes?
- question: PAINT placed muscle cell fate specification on the MYL2-branch node PTN002746142 from a promoter-reporter
    study. Should that IBD be withdrawn?
- question: Is the physiologically relevant ion at the MYL2 EF-hand site Mg2+ at rest, and does Ca2+ exchange
    at this site contribute to beat-to-beat regulation in human myocardium?
suggested_experiments:
- description: Human iPSC-derived ventricular cardiomyocytes with MYL2 knockout and S15A/S15D knock-in,
    to test sarcomere assembly, calcium sensitivity of force and stretch activation in human cells and
    to provide human experimental evidence for functions now inferred from mouse.
- description: Isothermal titration calorimetry of recombinant human MYL2 for Ca2+ and Mg2+ at physiological
    free Mg2+, with and without Ser15 phosphorylation and with an EF-hand 1 loop mutant.
