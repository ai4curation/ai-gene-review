- term:
    id: GO:0003785
    label: actin monomer binding
  evidence_type: IDA
  original_reference_id: PMID:9180271
  qualifier: enables
  review:
    summary: IDA for actin monomer binding citing Morano and Haase 1997. The abstract describes peptides
      from the N terminus of the essential light chains (MLC-1; ALC-1/MYL4 and VLC-1/MYL3) competing for
      G-actin binding. MYL2 is the regulatory light chain and is not named among the tested peptides.
    action: UNDECIDED
    reason: The cached record is abstract-only and the abstract explicitly states that the assayed peptides
      were the N-terminal sequences of the human cardiac essential light chains ALC-1 and VLC-1, which
      carry the actin-binding N-terminal extension that RLCs lack. The annotation may reflect confusion
      between 'ventricular light chain 1' (MYL3) and MLC-2v (MYL2), but the full text has not been read,
      so it is left UNDECIDED rather than removed. No other source in this review shows MYL2 binding actin
      monomers; RLC binds the heavy-chain neck.
    supported_by:
    - reference_id: PMID:9180271
      supporting_text: These results demonstrate the specific interaction between the N-terminal domains
        of human cardiac MLC-1 isoforms and actin
- term:
