id: P10916
gene_symbol: MYL2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: MYL2 encodes the ventricular/slow-twitch skeletal isoform of the myosin regulatory light
  chain (MLC-2v), a 166-residue non-enzymatic EF-hand protein of the calmodulin superfamily. Together
  with an essential light chain it wraps the alpha-helical neck (lever arm) of the class II myosin heavy
  chain (beta-cardiac/slow myosin, MYH7) in the sarcomeric thick filament, stiffening the lever arm and
  transmitting force from the motor domain to the filament backbone. Its first EF hand binds Ca2+/Mg2+.
  The N-terminal Ser15 is phosphorylated by cardiac myosin light chain kinase (MYLK3) and other kinases
  and dephosphorylated by myosin phosphatase. Phosphorylation increases the calcium sensitivity of force,
  maximal force and the kinetics of stretch activation, so MYL2 acts as a phospho-regulated modulator
  of cardiac contraction. In the embryo the ventricular isoform is required for assembly of ventricular
  sarcomeres and cannot be replaced by the atrial isoform MLC-2a (MYL7). MYL2 is expressed in cardiac
  ventricle and type I skeletal muscle fibres. Dominant missense variants cause familial hypertrophic
  cardiomyopathy, and recessive loss-of-function variants cause a lethal infantile myofibrillar myopathy
  with cardiomyopathy.
