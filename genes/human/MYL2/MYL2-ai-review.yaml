  review:
    summary: IDA for cytoskeleton from a study of Endo180-driven Rho-ROCK contractility in MG63 osteosarcoma
      and other non-muscle cells. Staining used antibodies against MLC2 phosphorylated at Thr18/Ser19,
      the ROCK/MLCK sites of nonmuscle and smooth-muscle RLCs.
    action: MODIFY
    reason: 'The review judges the claim, and the claim is true of MYL2: as a light chain of muscle myosin
      it is part of the muscle myosin complex (GO:0005859), which GO places under actin cytoskeleton and
      cytoskeleton, and GFP-MYL2 decorates the cytoskeleton of H9c2 cardiomyoblasts. The cited evidence,
      however, does not appear to concern MYL2. I read the full text: staining used antibodies to MLC2
      phosphorylated at Thr18/Ser19, the ROCK/MLCK sites of the nonmuscle and smooth-muscle RLCs (MYL9/MYL12A/MYL12B),
      in MG63 osteosarcoma and other non-muscle cells. MYL2''s regulatory site is Ser15. The replacement
      term is therefore supported by other sources, and this row''s reference should be reassigned to
      the nonmuscle RLC genes.'
