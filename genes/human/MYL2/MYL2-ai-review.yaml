      known (phosphorylated RLC increases force and calcium sensitivity), and the gene already carries
      the descendant GO:0098735 positive regulation of the force of heart contraction. The evidence is
      from mouse myocardium (same PANTHER subfamily PTHR23049:SF9 one-to-one ortholog); there is no equivalent
      human in-situ force measurement in the cited set, although human cardiac-MLCK phosphorylates MLC2v.'
