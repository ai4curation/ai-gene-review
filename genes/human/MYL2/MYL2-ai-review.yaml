    summary: ISS transfer from rat Myl2 (P08733) of a role in regulating the force of heart contraction.
      In mammalian myocardium MLCK-catalysed phosphorylation of the ventricular RLC raises the calcium
      sensitivity of isometric force and the maximal force, so MYL2 is the phospho-switch subunit through
      which force is tuned.
