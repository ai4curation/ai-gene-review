  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: located_in
  supporting_entities:
  - ARBA:ARBA00029243
  review:
    summary: Cytosol from an ARBA machine-learning rule.
    action: MARK_AS_OVER_ANNOTATED
    reason: MYL2 is a subunit of sarcomeric myosin and is found assembled in thick filaments of the myofibril,
      not as a free cytosolic protein. Reactome places its muscle-contraction reactions in the cytosol
      by compartment convention, and the ARBA rule is a generic prediction. The term is not strictly wrong
      (sarcomeric myosin is not membrane-bounded) but it misrepresents where the protein acts.
