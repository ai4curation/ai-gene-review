  review:
    summary: IBA from MYL2-branch node PTN002746142; the only donor is mouse Myl2 with an IMP from Lee
      et al. 1992, a promoter-luciferase transgenic study of MLC-2 gene regulation.
    action: REMOVE
    reason: Muscle cell fate specification would require MYL2 to help commit cells to a muscle fate. MYL2
      is a terminal differentiation product and a classic ventricular marker gene. The donor paper studied
      cis-regulatory elements that control MLC-2 expression, which concerns the regulation of MYL2 rather
      than a function of the MYL2 protein. Nothing in the gene's biology supports a fate-specification
      role, so the propagated assertion is rejected on biological grounds.
