- term:
    id: GO:0048019
    label: receptor antagonist activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN002141596
  - UniProtKB:Q8IVG9
  review:
    summary: Phylogenetic propagation of humanin's receptor antagonist activity to MTRNR2L10 from the
      humanin-family node PANTHER:PTN002141596. The grounding experiment is humanin competing with
      amyloid-beta at FPRL1 [PMID:15153530]; nothing comparable has been done with HN10.
    action: REMOVE
    reason: "The IBD behind this row places the activity at the humanin-family node, and the placement
      is reasonable for the mitochondrial peptide: humanin is a genuine FPRL1 ligand and the antagonism
      of amyloid-beta at that receptor is directly observed [PMID:15153530]. Arguing with the row means
      asking whether MTRNR2L10 sits inside the clade that inherited the function, and the difficulty is
      that the question is not really phylogenetic. The nuclear MT-RNR2-like loci are copies of a
      mitochondrial rRNA segment, so descent in this tree tracks genomic sequence rather than a
      protein-coding lineage, and membership of the node does not establish that the ORF is translated,
      that the peptide is stable, or that it reaches a receptor. On residues HN10 fails precisely where
      a receptor-level claim needs support. It carries Ser14->Arg, which UniProt records as one of the
      humanin substitutions that abolishes activity, and Thr13->Ile, the only substitution in this
      family with a direct measurement - the polymorphic HN5 variant carrying exactly Thr13->Ile has
      reduced cytoprotection [PMID:19477263] - and Thr13 is the position Bodzioch et al. singled out as
      the one that may matter for cell-surface receptor binding [PMID:19477263]. Pro3 is lost as well.
      The usual counterweight in this family, that synthetic HN5 keeps activity despite Leu12->Ser,
      does not apply here, because HN10 retains Leu12 and diverges instead at the positions where HN5
      remained humanin-like. A second, term-level point applies to every member of this node: receptor
      antagonist activity describes humanin's competition with amyloid-beta at FPRL1, which is a
      property measured in a specific assay, whereas humanin also carries receptor ligand activity by
      IDA - so even for the donor the term captures one facet of the interaction. I therefore remove
      the row rather than marking it over-annotated: the substitutions are at the positions where
      humanin receptor-level activity has been experimentally mapped, so the inheritance assumption
      fails on the target side."
    supported_by:
    - reference_id: PMID:15153530
      supporting_text: Humanin shares human FPRL1 and mouse FPR2 with Abeta(42) and suggest that
        Humanin may exert its neuroprotective effects by competitively inhibiting the access of
        FPRL1 to Abeta(42).
    - reference_id: PMID:19477263
      supporting_text: Proline vs serine in position 19 may determine whether the peptide is
        secreted or not, while threonine in position 13 may be important for cell surface receptor
        binding.
    - reference_id: PMID:19477263
      supporting_text: Cytoprotection against the STS-induced apoptosis conferred by the polymorphic
        HN5 variant, in which threonine in position 13 is replaced with isoleucine, is reduced
        compared to the wild type HN5 peptide.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
