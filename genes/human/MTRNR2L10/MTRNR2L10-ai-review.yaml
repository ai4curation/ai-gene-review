  review:
    summary: Electronic mapping of UniProt's Secreted subcellular-location line for P0CJ77. That
      line is itself annotated ECO:0000250 by similarity to humanin (UniProtKB:Q8IVG9), so the row
      carries no observation made on MTRNR2L10.
    action: REMOVE
    reason: "MTRNR2L10 is known only as a transcript (UniProt protein existence level 2); no peptide
      from this locus has been detected in any compartment by mass spectrometry. UniProt's Secreted
      and Cytoplasm lines for P0CJ77 are themselves ECO:0000250 by-similarity statements transferred
      from humanin (file:human/MTRNR2L10/MTRNR2L10-uniprot.txt), so both the ISS row (donor
      UniProtKB:Q8IVG9) and the subcellular-location IEA row state the same humanin claim, once
      directly and once via the controlled-vocabulary mapping. Secretion of humanin is not a generic
      property of the sequence: it depends on Leu9-Leu11 and on Pro19-Val20 [PMID:35372353], and
      Bodzioch et al. proposed on the alignment that position 19 is what decides whether a nuclear
      isoform is secreted at all [PMID:19477263]. HN10 is the one member of MTRNR2L1-10 that alters
      both residues of the Pro19-Val20 segment, carrying Pro19->Ser and Val20->Ala, while humanin
      Pro19->Arg and Val20->Arg each abolish secretion
      (file:human/MT-RNR2__Q8IVG9/MT-RNR2__Q8IVG9-uniprot.txt). Because the asserted location depends
      on secretion determinants that are altered at both positions in this peptide, the row is not
      merely unverified but positively doubtful, and I remove it."
